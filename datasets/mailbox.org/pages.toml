full_description = "AGB | Widerrufsbelehrung Ihr Konto bei mailbox.org läuft auf Guthabenbasis. Wird kein Guthaben eingezahlt (oder läuft das vorhandene Guthaben aus) wird der Account nach 30 Tagen gelöscht (§6 unserer AGB) und nach weiteren 30 Tagen werden alle bei uns gespeicherten Daten gelöscht (§5 unserer AGB).Wenn Sie kein noch zurückzuzahlendes Guthaben bei uns haben, können Sie ihren Account einfach auslaufen lassen und müssen uns keine Kündigung bzw. keinen Widerruf des Vertrages zukommen lassen. Click here for the English translation of our terms and conditions and cancellation policy -> Widerrufsbelehrung Wir sind gesetzlich verpflichtet Ihnen folgende Widerrufsbelehrung zukommen zu lassen, die Sie über ihre Rechte als Verbraucher aufklärt. WiderrufsrechtSie haben das Recht, binnen vierzehn Tagen ohne Angabe von Gründen diesen Vertrag zu widerrufen. Die Widerrufsfrist beträgt vierzehn Tage ab dem Tag des Vertragsabschlusses. Um Ihr Widerrufsrecht auszuüben, müssen Sie uns (Heinlein Hosting GmbH, Schwedter Straße 8/9A, 10119 Berlin, Fax 030/40505119, E-Mail widerruf@mailbox.org) mittels einer eindeutigen Erklärung (z.B. ein mit der Post versandter Brief, Telefax oder E-Mail) über Ihren Entschluss, diesen Vertrag zu widerrufen, informieren. Sie können dafür das beigefügte Muster-Widerrufsformular verwenden, das jedoch nicht vorgeschrieben ist. Zur Wahrung der Widerrufsfrist reicht es aus, dass Sie die Mitteilung über die Ausübung des Widerrufsrechts vor Ablauf der Widerrufsfrist absenden. Folgen des WiderrufsWenn Sie diesen Vertrag widerrufen, haben wir Ihnen alle Zahlungen, die wir von Ihnen erhalten haben, einschließlich der Lieferkosten (mit Ausnahme der zusätzlichen Kosten, die sich daraus ergeben, dass Sie eine andere Art der Lieferung als die von uns angebotene, günstigste Standardlieferung gewählt haben), unverzüglich und spätestens binnen vierzehn Tagen ab dem Tag zurückzuzahlen, an dem die Mitteilung über Ihren Widerruf dieses Vertrags bei uns eingegangen ist. Für diese Rückzahlung verwenden wir dasselbe Zahlungsmittel, das Sie bei der ursprünglichen Transaktion eingesetzt haben, es sei denn, mit Ihnen wurde ausdrücklich etwas anderes vereinbart; in keinem Fall werden Ihnen wegen dieser Rückzahlung Entgelte berechnet. Haben Sie verlangt, dass unsere Dienstleistungen während der Widerrufsfrist beginnen soll, so haben Sie uns einen angemessenen Betrag zu zahlen, der dem Anteil der bis zu dem Zeitpunkt, zu dem Sie uns von der Ausübung des Widerrufsrechts hinsichtlich die­ses Vertrags unterrichten, bereits erbrachten Dienstleistungen im Vergleich zum Gesamt­umfang der im Vertrag vorgesehenen Dienst­leistungen entspricht. Erlöschen des WiderrufsrechtsIhr Widerrufsrecht erlischt bei einem Vertrag zur Erbringung von Dienstleistungen auch dann, wenn wir die vereinbarte Dienstleistung vollständig erbracht haben und mit der Ausführung der Dienst­leis­tung erst begonnen haben, nachdem Sie dazu ihre aus­drück­liche Zustimmung gegeben und gleich­zeitig Ihre Kenntnis davon bestätigt haben, dass Sie Ihr Widerrufsrecht bei vollständiger Ver­tragserfüllung durch uns verlieren. Muster-Widerrufsformular(Wenn Sie den Vertrag widerrufen wollen, dann füllen Sie bitte dieses Formular aus und senden Sie es zurück) An Heinlein Hosting GmbHSchwedter Straße 8/9A10119 Berlin Fax 030/40505119E-Mail widerruf@mailbox.org: — Hiermit widerrufe(n) ich/wir (*) den von mir/uns (*) abgeschlossenen Vertrag über den Kauf der folgenden Waren (*) / die Erbringung der folgenden Dienstleistung (*): — Bestellt am (*) / erhalten am (*) — Name des/der Verbraucher(s) — Anschrift des/der Verbraucher(s) — Unterschrift des/der Verbraucher(s) (nur bei Mitteilung auf Papier) — Datum (*) Unzutreffendes streichen. Ende der Widerrufsbelehrung Allgemeinen Geschäftsbedingungen für mailbox.org Prepaid § 1 – Anbieter, Nutzer (1) Anbieter der unter der Domain mailbox.org an­gebotenen Leistungen (im folgenden „Dienst“) ist die Heinlein Support GmbH, Schwedter Str. 8-9b, 10119 Berlin (im folgenden „Anbie­ter“). (2) Etwaig vom Nutzer gestellte Geschäftsbedingung­en finden keine Anwendung. Der An­bieter wi­derspricht de­ren Einbeziehung ausdrück­lich, so­weit die Einbeziehung nicht indi­viduell schriftlich vereinbart wird. § 2 – Leistungsinhalt (1) Der Anbieter stellt dem Nutzer eine E-Mail-Adresse unter einer Domain des Anbieters zur Verfügung, z.B. im Format nutzername@mailbox.org (im folgenden „Mailbox-Adresse“). Den Nutzernamen kann der Nutzer bei Vertrags­schluss selbst wählen, soweit er nach den Namensrichtlinien des Anbieters zur Verfü­gung steht und nicht bereits vergeben ist. (2) Mit Ein­richtung der Mailbox-Adresse richtet der Anbieter ein gleichlautendes Nutzerkonto ein, das der Nutzer über SMTP, POP3 und IMAP bzw. über die Webseiten unter mailbox.org nutzen kann, um E-Mails abzurufen und zu versen­den, um Einstellungen vorzunehmen und ggf. mit dem gewählten Tarif verbundene weitere Leistungen in An­spruch zu nehmen, etwa Kalender-, Adressbuch-, Aufgaben­ver­wal­tungs-, Dateispeicher- und Dateitransfer-Funktionen. (3) Das Hosting von Domains oder Webspace gehört nicht zum Leistungsgegenstand. § 3 – Verfügbarkeit („Up-Time“) und Speicherkapazität („Quota“) (1) Der Anbieter stellt seinen Dienst mit einer zeitli­chen Verfüg­barkeit von durchschnittlich 99,9% im Ka­lendermonat zur Verfügung. (2) Bei der Datenübertragung beschränkt sich die Leistungspflicht des Anbieters auf die Kommunik­ation zwischen dem Server des Anbieters und einem vom Anbieter zu wählenden, ge­eigneten Verbin­dungspunkt mit dem Inter­net. Der Anbieter hat keinen Einfluss auf die Verfügbar­keit und Zuver­lässigkeit der außerhalb seines eige­nen Netzes liegenden Datenwege des Internets. Eine erfolg­reiche Wei­terleitung von Daten vom Verbindungs­punkt zu Servern Dritter ist daher nicht geschul­det. (3) Der Anbieter ist nur im Rahmen der jeweils vereinbart­en Speicherkapazität („Quota“) verpflich­tet, Mails für den Nutzer zu empfangen und Daten für den Nutzer zu speichern. Die Quota hängt vom gewählten Tarif des Nutzers ab und kann für verschiedene Dienste des Anbieters unterschiedlich ausfallen. In seinem Nutzer­konto kann sich der Nutzer über seine aktuelle Quota-Auslastung informieren. (4) E-Mails, die bei ausgeschöpfter Speicherkapazität an den Nutzer ge­schickt wer­den, werden vom Mailser­ver des Anbieters zu­rückgewiesen; der Absender erhält eine Nach­richt über das Fehl­schlagen des Zustel­lungsversuchs („over quota“). (5) Bei ausgeschöpfter Speicherkapazität kann der Nutzer seinem Nutzerkonto keine weiteren Da­ten (z.B. Adressen, Kalendereinträge, Aufgaben, Notizen, Dateien) hinzufügen. § 4 – Entgelte (1) Der Nutzer ist mit der Entgeltzahlung vorleistungsverpflichtet. (2) Zahlungen sind mög­lich mittels Banküberweisung oder Übersendung von Bargeld auf dem Postweg. Der Anbieter kann weitere Zahlungsarten anbieten. (3) Für die Entgelte gilt neben diesen Nutzungsbedingungen die bei Vertragsschluss gülti­ge Preis­liste. (4) Der Anbieter unterrichtet den Nutzer per E-Mail vor Ende des entgeltlichen Vertragsverhältnisses über die bei Vertragsende erfolgende Umstellung auf ein eingeschränktes Nutzerkonto. Bei Verträgen mit bestimmter Laufzeit erhält der Nutzer spätestens 30 Tage vor Vertragsende eine Benachrichtigung. Bei Verträgen mit unbestimmter Laufzeit benachrichtigt der Anbieter den Nutzer, wenn das Guthaben unter den Betrag gesunken ist, der für zwei Monate Nutzung im gewählten Tarif erforderlich ist. (5) Der Nutzer schuldet auch das Entgelt für die Inanspruchnahme von Leistungen seines Nutzer­kontos durch Dritte (z.B. nach fahrlässiger Offenlegung seiner Zugangsdaten), es sei denn, dass der Nutzer nachwei­sen kann, dass er die Inanspruchnahme nicht zu vertreten hat. (6) Alle Entgelte verstehen sich inklusive jeweils geltender Umsatzsteuer. § 5 – Aktive und eingeschränkte Nutzerkonten (1) Innerhalb der Laufzeit eines entgeltlichen Vertragsverhältnisses, dessen Entgelt vom Kunden beglichen ist, stehen dem Nutzer alle Leistungen des gewählten Tarifs in vollem Umfang zur Verfügung („aktives Nutzerkonto“). (2) Ist das entgeltliche Vertragsverhältnis abgelaufen oder ist das fällige Entgelt nicht beglichen, so kann der Anbieter die Funktion des Nutzerkontos einschränken („eingeschränktes Nutzerkonto“). (3) Hat der Nutzer ein nach Ablauf eines entgeltlichen Vertragsverhältnisses eingeschränktes Nutzerkonto über einen Zeitraum von 30 Tagen nicht in ein aktives Nut­zerkonto umgewandelt, schließt der Anbieter das eingeschränkte Nutzerkonto mit Ablauf des 30. Tages. Der Anbieter löscht dabei die auf seinen Systemen gespeicherten Daten des Nutzers gemäß § 10 und kann die Mailadresse zur erneuten Registrierung freigeben. § 6 – Vertragsschluss, Kontoeinrichtung (1) Der Vertragsschluss erfolgt ausschließlich online über die Webseite mailbox.org. Zur Be­antragung ist le­diglich die Eingabe des gewünschten Nutzernamens, eines Vor- und Nachnamens, des Landes des gewöhnlichen Aufenthalts (bei natürlichen Personen) bzw. des Sitzlandes (bei juristischen Personen) und eines selbst gewählten Passwortes erforderlich. (2) Kann das Nutzerkonto mit dem gewählten Nutzernamen eingerichtet werden, bestätigt der An­bieter den Vertragsschluss auf dem Bildschirm sowie per E-Mail, die unmittelbar an die neu einge­richtete Mailbox-Adresse geschickt wird. Der Nutzer kann diese E-Mail lesen und herunterladen über sein Nutzerkonto, das er durch Eingabe seines Nutzernamens und Passwortes aufrufen kann. (3) Das Nutzerkonto wird anfänglich als eingeschränktes Nutzerkonto mit einer Laufzeit von 30 Tagen eingerichtet. Mit der ersten Zahlung wird das Nutzerkonto zu einem aktiven Nutzerkonto. § 7 – Verbraucherwiderrufsrecht (1) Für den mit dem Anbieter geschlossenen Nutzungsvertrag steht Verbrauchern das gesetzliche Widerrufsr­echt zu. Die Einzelheiten ergeben sich aus der Widerrufsbelehrung. (2) Verbraucher ist jede natürliche Person, die ein Rechtsgeschäft zu Zwecken abschließt, die überwiegend weder ih­rer gewerblichen noch ihrer selbständigen beruflichen Tätigkeit zugerechnet werden können. (3) Einem Verbraucher mit ständigem Aufenthalt außerhalb Deutschlands räumt der Anbieter ein Widerrufsrecht gemäß den obigen Absätzen auch dann ein, wenn das nationale Recht des Verbrauchers kein Widerrufsrecht vorsieht oder den Widerruf an eine kürzere Frist oder an eine strengere Form knüpft als im Bürgerlichen Gesetzbuch geregelt. § 8 – Missbrauch, Schadensfreistellung (1) Der Nutzer darf sein Nutzerkonto und die Infrastruktur des Anbieters nicht zu vertrags- oder rechtswidri­gen Zwe­cken miss­brauchen. Als Missbrauch gilt zwi­schen den Parteien insbesondere (a) der Versand von E-Mails mit ge­fälschten, oder vorsätzlich täuschenden Ab­senderangaben zum Zwecke der Vorbereitung oder Durchführung einer Straftat, (b) der Versand unzulässiger E-Mail-Werbung („Spam“) sowie der Fall, dass der Nutzer seine Mailbox-Adresse als Antwortadresse zur Verfügung stellt für Spam, der über Dritte ver­sandt wur­de, (c ) die Speicherung oder der Versand von Ein­wahlprogrammen („Dialern“), soweit diese nicht behörd­lich zu­gelassen sind, (d) die Speicherung oder der Versand von Vi­ren oder ähnlicher Schadsoftware („Malware“) so­wie von Pro­grammen, deren Verbreitung nach § 95a Abs. 3 UrhG un­tersagt ist (Softwa­re zur Umge­hung eines Kopier­schutzes), (e) die Nutzung zum Zwecke der Computersa­botage oder des unbefugten Zugriffs auf ande­re In­ternet-Hosts (§§ 303a, 303b StGB), sowie ver­gleichbare Handlungen oder Vorbereitun­gen da­zu, die geeignet sind, für ei­ne rechts­widrige Handlung genutzt zu werden, (f) die Speicherung oder der Versand von Bild-, Vi­deo-, Audio-, Text- oder anderen Datei­en un­ter Ver­stoß gegen Urheber-, Mar­ken-, Na­mens-, Wettbe­werbs- oder Persönlichkeitsr­echte, oder solcher Dateien, die ver­botene Propagandamittel oder Kennzeichen verfassungswidriger Orga­nisationen (§§ 86, 86a StGB) enthal­ten und (g) die Speicherung oder der Versand porno­graphischer Werke im Sinne der §§ 184-184c StGB oder solcher Medien, die nach § 24 Abs. 1 JuSchG als jugendgefährdend gelistet sind. (2) Der Nutzer ist verpflichtet, den Anbieter von allen Ansprüc­hen freizustellen, die Dritte gegen­über dem Anbieter erhe­ben auf­grund von solchen Inhalten, die über die Mailbox-Adresse des Nut­zers verbreitet wer­den, insbesondere wegen behaupteter Urheber-, Mar­ken-, Namens-, Wettbe­werbs- oder Persönlichkeits­rechtsverletzungen. Der Freistellungsanspruch um­fasst auch die Auf­wendungen des Anbieters für eine zweckmä­ßige Sachverhaltsermittlung und Rechtsverteidi­gung. (3) E-Mails von Dritten, die den Zweck verfolgen, den Nutzer unter Täuschung über den wahren Absender zur Preisgabe vertraulicher Infomationen zu verleiten („Phishing-Mails“), muss der Anbieter nicht an das Postfach des Nutzers weiterleiten. Sofern der Anbieter solche Phishing-Mails erkennt, darf er deren Empfang blockieren bzw. bereits empfangene Phishing-Mails aus dem Postfach des Nutzers löschen. § 9 – Laufzeit, Kündigung (1) Der Nutzungsvertrag kann – je nach Tarif – mit unbestimmter Laufzeit oder auch mit bestimmter Laufzeit geschlossen werden. Ist eine bestimmte Vertragslaufzeit vereinbart, so ist die ordentliche Kündigung mit Wirkung vor Ende der Vertragslaufzeit ausgeschlossen. (2) Ist die Vertragslaufzeit unbestimmt, so kann der Nutzer das Vertragsverhältnis unter Einhaltung einer Frist von zwei Wochen zum Ende eines Abrechnungsmonats ordentlich kündigen; der Anbieter kann ein solches Vertragsverhältnis unter Einhaltung einer Frist von einem Monat zum Ende eines Abrechnungsmonats ordentlich kündigen. (3) Das Recht zur außerordentlichen Kündigung aus wichtigem Grund bleibt für jede Partei unbe­rührt. Einen wichtigen Grund kann für den Anbieter insbesondere ein Missbrauch des Dienstes im Sinne von § 8 darstel­len. Die Kündigung bedarf zu ihrer Wirksamkeit der Textform. § 10 – Löschung von Nutzerdaten (1) Der Anbieter ist berechtigt und gegenüber dem Nutzer verpflichtet, jegliche Daten des Nutzer­kontos nach Ablauf einer Vorhaltezeit von 60 Tagen nach Schließung des eingeschränkten Nutzerkontos unwiederbringlich zu löschen. Hierzu gehören insbesondere sämtliche E-Mails, Adressbuch- und Kalendereinträge, Aufgaben, Notizen und Datei­en, die zum Nutzerkonto gehören. Die 60-tägige Vorhaltezeit dient dazu, dem Nutzer eine Wiederher­stellung seiner Daten zu ermöglichen für den Fall, dass er den Vertrag versehentlich hat aus­laufen lassen. Das Recht des Nutzers, jederzeit die sofortige Löschung seiner Daten zu verlangen, bleibt unberührt. (2) Es obliegt dem Nutzer, diejenigen Daten, die er nach Vertragsende weiter verwenden möchte, rechtzeitig vor Vertragsende durch Herunterladen auf ein eigenes Speichermedium zu sichern. (3) Von der Löschung ausgenommen sind jedoch solche Daten, zu deren weiteren Speicherung der Anbieter aus steuerrechtlichen, handelsrechtlichen oder sonstigen gesetzlichen Gründen verpflichtet ist. § 11 – Haftung, Datensicherung (1) Die Haftung des Anbieters für Vermögens­schäden is"
