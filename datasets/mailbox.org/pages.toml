["https://mailbox.org/de/post/transparenzbericht-2024"]
title = "mailbox.org Transparenzbericht 2024: 30,1 % aller Anfragen rechtswidrig | mailbox.org"
description = "Heute veröffentlichen wir unseren Transparenzbericht 2024, in dem wir Art- und Umfang behördlicher Auskunftsanfragen an uns als Provider offenlegen."
full_description = "mailbox.org Transparenzbericht 2024: 30,1 % aller Anfragen rechtswidrig 30.01.2025 Heute veröffentlichen wir unseren Transparenzbericht 2024, in dem wir Art und Umfang behördlicher Auskunftsanfragen an uns als Provider offenlegen. Im vergangenen Jahr hat die Anzahl der Anfragen abgenommen. Fast ein Drittel der Anfragen wurde von uns nicht beantwortet. Wir haben insgesamt 25 der 83 Behörden-Anfragen im Jahr 2024 zurückgewiesen, da sie Fehler enthielten oder rechtlich unzulässig waren. Im Vergleich zum Vorjahr ist damit der Anteil der final als rechtswidrig abgelehnten Anfragen leicht gesunken: von 33,8 % (2023) auf 30,1 % (2024). Der häufigste Ablehnungsgrund Seit dem letzten Jahr hat sich seitens der Behörden nicht viel verbessert. Weiterhin ist der häufigste Ablehnungsgrund die Übertragung der Anfrage auf einem unverschlüsselten Kanal, wie per Fax und per E-Mail im Klartext. Im Jahre 2024 gingen fast ein Viertel (24,1 %) aller Auskunftsanfragen per Fax oder Klartext-E-Mail ein. Diese Anfragen werden von uns konsequent abgelehnt. Obwohl die Summe der Anfragen abgenommen hat, so haben die Anfragen mehr Aufwand verursacht, da vielen Dienststellen erklärt werden musste, wie verschlüsselte E-Mails mit PGP funktionieren. Kurz und knapp: Die Anfragen im Vorjahresvergleich Die Gesamtanzahl der Anfragen ist von 133 (2023) auf 83 (2024) gesunken. Es wurden 69,9 % der Anfragen korrekt gestellt, während es 2023 66,2 % waren. Wir erhielten die meisten Anfragen per E-Mail, mit PGP verschlüsselt. Die konkreten Zahlen von mailbox.org aus 2024 Anzahl der Ersuchen an mailbox.org im Jahr 2024 insgesamt: 83davon deutsche Behörden: 82davon ausländische Behörden: 0davon ausländische nicht-EU Behörden: 1 Art der Behörde Strafverfolgungsbehörden: 81Zollbehörden: 1Verfassungsschutz: 0Nachrichtendienste: 1 Art des Ersuchens Bestandsdatenabfragen: 79Postfachbeschlagnahmungen: 3Verkehrsdatenabfragen: 0Telekommunikationsüberwachung: 1 Die Berichte der letzten Jahre finden Sie unter Transparenzberichte. Wie wir mit Anfragen umgehen mailbox.org hat einen standardisierten Prozess zur Bearbeitung und Beantwortung von Auskunftsersuchen der Behörden. Jede Anfrage wird umfangreich von unserem Datenschutzbeauftragten und Rechtsanwalt geprüft, bewertet und entsprechend beantwortet oder abgewiesen. Im Fall einer Ablehnung kann die Behörde ihren Antrag korrigieren. In jedem Fall werden Daten von uns nur bei rechtmäßiger und fehlerfreier Anfrage herausgegeben. Welche Daten die Behörden abfragen Bestandsdatenabfragen: u. a. Telefonnummer, Name und Anschrift des Inhabers, Angaben zum Vertrag und Tarifmerkmalen Postfachbeschlagnahmungen: Beschlagnahmung sämtlicher im Postfach des Accounts befindlicher E-Mails Verkehrsdatenabfragen: u. a. IP-Adressen, von denen Logins auf den Mailserver stattfinden oder von denen aus E-Mails verschickt wurden Telekommunikationsüberwachung: eine temporär angelegte Überwachung aller empfangenen und gesendeten E-Mails und des gesamten Accounts."
year_published = 2025
