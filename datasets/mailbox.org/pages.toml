ch herunterladen, einloggen und loslegen! Für Android: OX Drive im Google Play Store Für iOS: OX Drive im App Store Ihr mailbox.org-Postfach können Sie in Ihre bestehende oder vorinstallierte E-Mail-App einbinden. Wir stellen Ihnen in den Postfach-Einstellungen eine Profil-Datei zur automatischen Einrichtung sowie die Zugangsdaten zur manuellen Konfiguration zur Verfügung. Darüber hinaus können Sie Ihr mailbox.org-Postfach auch im Webmailer verwenden und auf Ihrem Homescreen speichern. Wenn Sie das Online-Office und Drive auf Ihrem Smartphone nutzen möchten, dann empfehlen wir Ihnen die kostenlose OX Drive App. Kann ich meine bestehenden E-Mails mitnehmen? Ja, Sie können selbst ein langjähriges, umfangreiches Postfach zu mailbox.org mitnehmen. Entweder ziehen Sie Ihre Daten selbst um, binden ihr bisheriges Postfach in den mailbox.org Webmailer ein oder lassen den Umzug von unserem deutschen Partner audriga für einmalig 3 € durchführen. Wo bekomme ich Hilfe bei Fragen? Bei Problemen oder Unklarheiten muss es schnell gehen. Antworten und Unterstützung erhalten Sie oft schon in unsere Hilfe/FAQ oder durch engagierte User im Userforum. Darüber hinaus erhalten Sie in den Tarifen Premium und Standard individuelle Unterstützung durch unser Support-Team. Wie kann ich bezahlen? Bei mailbox.org wird nach dem Pre-Paid-Prinzip abgerechnet. Bezahlen können Sie per Überweisung Lastschrift (SEPA) Kreditkarte PayPal Sofortüberweisung paydirekt Bargeld auf dem Postweg (regulärer Brief, nur EURO / keine Schecks) Bareinzahlung aufs Bankkonto Bitte zahlen Sie nur soviel ein, wie Sie auch verbrauchen werden. Eine Guthabenerstattung ist nicht möglich. Sind alle Daten verschlüsselt? Alle unsere Dienste sind nur über SSL/TLS-verschlüsselte Verfahren zu erreichen. Unsere Entwickler setzen konsequent auf modernste Crypto-Algorythmen und schalten unsichere Verfahren ab. Und um die anonyme Nutzung des Internets zu unterstützen und unsere Kunden gegen die anlasslose Vorratsdatenspeicherung zu schützen, betreiben wir für Spezialisten sogar einen eigenen Tor Exit-Node mit Onion (Hidden) Services in unserem Rechenzentrum. Darüber hinaus können Sie PGP direkt im Webmailer ohne zusätzliche Programme nutzen und sogar ihr gesamtes Postfach verschlüsseln. Für noch mehr Sicherheit empfehlen wir den Login mittels Zwei-Faktor-Authentifizierung. Lernen Sie hier mehr über das Thema Sicherheit bei mailbox.org Kann ich meine eigene Domain verwenden? Ja, in den Tarifen Standard und Premium können Sie Ihre eigene Domain einrichten. Neben beliebigen Aliassen können Sie auch eine Catch-all-Adresse einrichten. Hier gehts zur Schritt-für-Schritt-Anleitung: E-Mail-Adressen der eigenen Domain nutzen Eignet sich das mailbox.org-Postfach auch für Unternehmen? Natürlich! Für Unternehmen eignen sich die Tarife Standard und Premium. Damit verschicken Sie Ihre E-Mails professionell mit eigener Domain und Sie erhalten auch Zugang zum Online-Office mit Drive sowie zur Videokonferenz. Darüber hinaus können Sie einen AV-Vertrag '''
