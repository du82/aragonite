["https://mailbox.org/de/post/opentalk-update-bei-mailbox-org-Oktober-2024"]
title = "OpenTalk Update bei mailbox.org: Neue Funktionen und verbesserte Usability | mailbox.org"
description = "Das Update bringt neue Funktionen und Verbesserungen, welche die Usability erhöhen und Videokonferenzen noch besser machen."
full_description = "OpenTalk Update bei mailbox.org: Neue Funktionen und verbesserte Usability 01.10.2024 Wir freuen uns, eine neue Version von OpenTalk präsentieren zu können. Das Update bringt eine Reihe neuer Funktionen und Verbesserungen, welche die Benutzerfreundlichkeit erhöhen und die Durchführung von Videokonferenzen noch reibungsloser gestalten. OpenTalk ist die Videokonferenzlösung von mailbox.org. Eingeführt Ende 2022 und gehostet in unseren Rechenzentren. OpenTalk ist ein Schwesterunternehmen von mailbox.org und ist ebenso Teil der Heinlein Gruppe. Neue Funktionen und Optimierungen Vereinfachte Teilnehmerverwaltung Moderatoren können nun die Namen der Teilnehmenden direkt über die Teilnehmerliste ändern. Dies ist besonders praktisch, um Telefonteilnehmer zu identifizieren oder Schreibfehler zu korrigieren. Zusätzlich wurde ein neuer Dialog für wiederkehrende Meetings eingeführt, der es ermöglicht, Wiederholungsfrequenzen präzise einzustellen und Enddaten für Serienmeetings festzulegen. Auch die Anzeige relevanter Meeting-Informationen neben dem Konferenztitel kann jetzt vom Moderator im Dashboard ausgewählt werden. Teilnehmende können in einen Warteraum geschickt und später zurückgeholt werden, was den Moderatoren mehr Flexibilität in der Besprechungssteuerung gibt. Außerdem können Mikrofone global deaktiviert werden, um etwa in Schulungen oder Diskussionen die Audioeinstellungen besser zu kontrollieren. Mehr Benutzerfreundlichkeit und Barrierefreiheit Bestätigungsfenster lassen sich jetzt per Escape-Taste, durch Klicken außerhalb des Fensters oder über das X schließen. Bei Umfragen können Teilnehmende ihre Meinung ändern, bevor sie die endgültige Wahl bestätigen. Die Moderatoren-Ansicht wurde so optimiert, dass Umfragen und Abstimmungen auch auf Tablets vollständig nutzbar sind, und Schließen-Buttons wurden barrierefrei gestaltet. Moderatoren profitieren zudem von umfassenden Benachrichtigungen darüber, wem sie wann welche Rechte innerhalb der Webkonferenz gegeben haben. Ebenso wurden weitere technische Verbesserung zur Barrierefreiheit umgesetzt. Dazu zählen Anpassungen bei Farben, Kontrast und der Steuerung per Tastatur. Auch die Nutzung auf mobilen Geräten wurde optimiert. Damit auch Nutzer mit Einschränkungen OpenTalk optimal nutzen können. Verbesserte Navigation Die Anzeige der gehobenen Hände ist jetzt zuverlässiger und übersichtlicher gestaltet. Speziell auf mobilen Endgeräten, insbesondere im Safari-Browser, wurde die Navigationsleiste verbessert – fehlende Elemente wie das Logo und das Aufklappmenü sind nun wieder funktionsfähig. Zudem wurde die Nutzerführung für Tastaturnutzer weiter optimiert, sodass auch Teilnehmende mit Einschränkungen eine verbesserte persönliche Navigationsleiste nutzen können. Mit OpenTalk mehr erreichen Knowhow, Leidenschaft und viel Erfahrung in Konzeption und Betrieb sicherer elektronischer Kommunikation verbindet unser Team über alle Marken der Heinlein Gruppe hinweg. OpenTalk ist Open Source. Der Quellcode wurde Februar 2023 veröffentlicht. OpenTalk schafft damit volle Transparenz für die Community und begeistert auch andere Entwickler für eine Mitarbeit an OpenTalk. Mach mit: Mehr erfahren → Das Team von OpenTalk hat noch einiges vor und freut sich über Verstärkung. Das Backend-Team programmiert in Rust, das Frontend-Team in JavaScript/React und Redux. Du suchst eine Herausforderung und willst an einem zukunftsweisenden Produkt mitarbeiten? Werde Teil des Teams: Jobs bei OpenTalk →"
year_published = 2024
clearnet = "https://mailbox.org/de/post/opentalk-update-bei-mailbox-org-Oktober-2024"
