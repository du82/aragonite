full_description = 'Ihr sicheres E-Mail-Postfach Wir bieten ein sicheres und zuverlässiges E-Mail-Postfach für Privat & Business. Mit bestmöglichem Spam- und Virenschutz und nach deutschem Datenschutzrecht. Seit über 30 Jahren betreiben wir E-Mail-Postfächer – als langjähriger Anbieter mit Substanz. Technisch perfekt und persönlich engagiert. Wir haben keine verdeckten Interessen an Ihren Daten und tun alles dafür, dass Privates privat bleibt. So geht Webmail Computer, Tablet oder Smartphone: mailbox.org lässt sich überall gut bedienen und eine Tabbed Inbox organisiert - vom User trainierbar - Ihre E-Mails automatisch in Unterordner wie Privates, Business, Social Media oder Shopping. Verschlüsselung muss einfach, sicher und komfortabel sein - und darf vor allem nicht stören. Auch ohne Installation eigener Software können Sie mit unserem Webmailer jederzeit auch auf verschlüsselte E-Mails zugreifen oder diese versenden. Selbst im Urlaub auf fremden Rechnern. Diskussionsverläufe Push Notifications PGP im Webmailer Spam-/Virenfilter Volltextsuche Kein Datenverlust bei Browser-Close Downloadlinks für große Anhänge Lernende Tabbed Inbox Garantiert verschlüsselter Versand Mehrere Postfächer auf einen Blick zurück nach Oben mailbox.org Office: Ihr virtueller Schreibtisch Mit Ihrem mailbox.org Office haben Sie alles Wichtige immer dabei. Mit Sicherheit! Ihr Online-Office: Alles an einem Ort Bei mailbox.org erhalten Sie mehr als ein sicheres E-Mail-Postfach. Nutzen Sie wie gewohnt vollen Office-Komfort in der sicheren Cloud. Mit Ihrem virtuellen Schreibtisch haben Sie alle Dokumente, Kalendertermine, Aufgaben und Ihr Adressbuch immer dabei. - Egal, ob zu Hause oder unterwegs. Privates Office Hier läuft alles zusammen: Ihr virtueller Schreibtisch bündelt die neuesten E-Mails, aktuellsten Dateiänderungen, externe RSS-Feeds oder Ihren Twitter-Account. Mehr Infos Adressbücher In verschiedenen Adressbüchern können Sie private und geschäftliche Kontakte getrennt verwalten. Und an deren Geburtstage wird im Kalender automatisch erinnert. Mehr Infos Kalender Verwalten Sie mehrere Kalender parallel, erteilen Sie Dritten Zugriffsrechte oder abonnieren Sie öffentliche Daten wie Ferien- oder Fußballtermine. So steht die Planung. Mehr Infos Aufgabenplaner Was wollte ich heute noch erledigen? Mit dem praktischen Aufgabenplaner behalten Sie den Überblick und vergessen nichts. Auch nicht im Supermarkt... Mehr Infos Text- & Tabellendokumente Bearbeiten Sie alleine oder gemeinsam Word- und OpenOffice-Dokumente direkt im Browser – egal, wo Sie gerade sind. Fertig? Dann starten Sie die Gruppenpräsentation. Mehr Infos Handy-Synchronisation Kalender, Kontakte, Dateien, E-Mails: Auch offline im Flugzeug alles dabei! Handy-Fotos werden mit unserer App direkt in Ihren mailbox.org Cloud-Speicher geladen. Mehr Infos zurück nach Oben Cloud-Speicher Sie möchten Ihre Dokumente, Bilder und Dateien in der Cloud sicher, datenschutzkonform und verschlüsselt verwalten? Mit mailbox.org kein Problem. Speichern, teilen, bearbeiten - ganz wie Sie möchten Ob nur für Sie oder Ihr gesamtes Team: Mit dem mailbox.org Cloud-Speicher ("Drive") können Sie all Ihre Dokumente, Fotos, Videos und auch Musik online speichern, synchronisieren und freigeben. Dokumente und Medien werden dabei einfach per Drag & Drop hochgeladen und können per nativer App mit allen anderen verbundenen Geräten synchronisiert werden. Die mobile App OX Drive sorgt dafür, dass Sie von überall auf Ihre Daten zugreifen können. Gemeinsam bearbeiten Mittels Gastzugriff auf einzelne Dateien oder ganze Ordner, bearbeiten Sie Dokumente gemeinsam. Live. Syncen & Teilen Übertragen Sie Fotos vom Handy automatisch ins Drive. So geht nichts verloren. Die Galerie steht auf Knopfdruck. Sicher verschlüsselt Alle Dateien im Cloud-Speicher können Sie mit Ihrem persönlichen PGP-Key verschlüsseln. Sicher ist sicher. Versand per E-Mail Dateien aus dem Drive können direkt oder als zeitlich beschränkter Downloadlink in E-Mails eingefügt werden. Multimedia-Betrachter PDF- und Office-Dokumente können direkt angezeigt werden, der Multimedia-Player spielt Musik und Videos. zurück nach Oben Terminplanung und Live-Texteditor: Ideal für Teams Viele Teams arbeiten virtuell und in Echtzeit. Dank der Terminplanung und dem Live-Texteditor wird die Zusammenarbeit einfacher und effektiver. Sicher und leicht: Terminplanung Wählen Sie zwischen „Termine finden“ und „klassische Umfrage“. Beide Funktionen helfen Ihnen, viel Zeit für die Abstimmungen mit kleinen und großen Gruppen zu sparen. Folgende Optionen stehen Ihnen außerdem zur Verfügung: Einladungen per Link oder E-Mail versenden, Passwortschutz, Umfrage mit Ablaufdatum, Anzeige der Umfrage-Ergebnisse und anpassbare URLs. Zusammenarbeit in Echtzeit mit dem Live-Texteditor Arbeiten Sie kollaborativ im Team und mit Freunden an einem gemeinsamen Text. Alle Änderungen werden sofort für alle Teilnehmenden sichtbar und alle Bearbeiter können farblich unterschieden werden. Zusätzlich kann neben der Textbearbeitung im Dokument gechattet werden. Weitere Funktionen: RTF, Import/Export, Verlauf, Kommentare und eine Verwaltung für Ihre Notizen. zurück nach Oben Sichere Videokonferenzen Ideal für Familien, Teams und Unternehmen: mailbox.org rückt auch Ihre Videokonferenzen sicher ins Bild. Videokonferenzen mit OpenTalk Unseren Kunden bieten wir sichere Videokonferenzen mit der Open-Source-Lösung OpenTalk, einer komplett neu entwickelten Software aus unserer Unternehmensgruppe. In der aktuellen Einführungsphase können alle mailbox.org-Kunden in den Tarifen PREMIUM und STANDARD OpenTalk unlimitiert ausprobieren. Nach der Einführungsphase bekommt auch der LIGHT-Tarif Zugriff auf OpenTalk und die verfügbaren Funktionen sind abhängig vom gewählten Tarif. Alle für diesen Dienst benötigten Server betreiben wir selbst in unseren eigenen Rechenzentren in Deutschland. So können wir garantieren, dass Ihre persönlichen Daten und Gespräche den besten Datenschutz genießen. DSGVO-konform läuft im Browser Einladungslink per E-Mail Passwortschutz Breakout-Räume Bildschirm / Präsentationen teilen Text-Chat und Umfragen Moderatoren-Rolle Virtuelle Hintergründe verschlüsselte Verbindungen So einfach legen Sie los Über unser mailbox.org Webportal gelangen Sie zur Verwaltungs­oberfläche von OpenTalk. Hier können Sie individuelle Konferenzräume mit Passwortschutz selbst anlegen und Ihre Teilnehmer anschließend mit einem sofort funktionsfähigen Einladungslink bequem per E-Mail einladen. Für die Teilnahme benötigen Sie lediglich Ihren Browser (wir empfehlen Firefox und Chrome) und keine zusätzliche Software. zurück nach Oben Unsere Preise Starten Sie 30 Tage lang mit einem kostenlosen Test-Account. Wählen Sie danach den passenden Tarif - unsere Preise passen sich Ihren Anforderungen flexibel an. Unsere Preis-Pakete für Ihr sicheres E-Mail-Postfach Mit einem sicheren E-Mail-Postfach bei mailbox.org erhalten Sie die Kontrolle über Ihre persönlichen Daten zurück. Egal, ob als privates E-Mail-Postfach, für Familien oder auch Teams mit bis zu 10 Mitgliedern: mailbox.org ist für jeden Bedarf die passende E-Mail- und Kommunikationsplattform.mailbox.org-Tarife für Unternehmen -> PREMIUM STANDARD LIGHT Das umfangreichstesichere E-Mail-Postfachinkl. priorisiertem Support. 9 € pro Nutzer / Monat Jetzt 30 Tagekostenlos testen PREMIUM STANDARD LIGHT Unser Sorglos-Paket: SichereE-Mail & viele Features,die Datenschutz leicht machen. 3 € pro Nutzer / Monat Jetzt 30 Tagekostenlos testen PREMIUM STANDARD LIGHT Unser Basistarif:Sichere E-Mail inkl.Kalender und Adressbuch. 1 € pro Nutzer / Monat Jetzt 30 Tage kostenlos testen Mail-Speicher inklusive 25 GB 10 GB 2 GB Cloud-Speicher inklusive 50 GB 5 GB - Aliasse @mailbox.org 25 25 3 eigene Domains möglich i Verknüpfen Sie Ihre bestehenden Domains mit mailbox.org. nur in Team-Accounts i Nur verfügbar für Team-Mitglieder. keine Werbung, kein Tracking Serverstandorte nur in Deutschland Tarif & Details Premium Standard Light ex