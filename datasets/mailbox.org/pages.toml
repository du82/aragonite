full_description = "Wir sind mailbox.org mailbox.org ist der sichere, deutsche E-Mail-Anbieter für Privat- und Geschäftskunden. Mehrfach ausgezeichnet, setzen wir neue Maßstäbe in sicherer Kommunikation, digitaler Souveränität und Datenschutz für unsere Nutzer. Die notwendige Technik betreiben wir mit eigener Infrastruktur in unseren Rechenzentren. Wir sind Linux-Profis aus Überzeugung und mit Leidenschaft und suchen Menschen, die die Begeisterung für Open Source, sinnstiftende Aufgaben und eine sichere, freie Kommunikation mit uns teilen. Wir arbeiten mit Kompetenz und Engagement an der Sache und teilen unser Wissen - sowohl intern als auch mit unseren Kunden. Hinter mailbox.org steht das Berliner Familienunternehmen Heinlein Support GmbH, dessen Ursprünge bis ins Jahr 1992 zurückgehen. Mittlerweile begleiten uns über 50 Kolleg*innen mit ihrem Know-How und ihrer Leidenschaft auf unserem Weg. Erfahre mehr über uns -> Unsere Teams IT-Administration Entwicklung Kunden-Support Hosting Marketing Was Dich erwartet inhabergeführtes Familienunternehmen mit flachen Strukturen und viel Gestaltungsspielraum offene Kultur mit intensivem Erfahrungsaustausch individuelle, gezielte Personalentwicklung (Weiterbildung, Feedback-Gespräche) strukturiertes Onboarding-Programm flexible Arbeitszeiten und Remote-Arbeit monetäre Beteiligung am Unternehmenserfolg BVG-Firmenticket wöchentliches Massage-Angebot sowie Bio-Obst- & Heißgetränke attraktive Büroräume in Berlin Prenzlauer Berg mit sehr guter Infrastruktur Aktuelle Jobs Du möchtest Sinnvolles tun? Dir sind Datenschutz und Privatsphäre wichtig? Du glaubst an Open Source?Wunderbar, dann bist Du bei uns genau richtig. QA Test Engineer (m/w/d) bei mailbox.org: ab sofort, Vollzeit, Berlin oder Remote Job ansehen Teamleiter Linux-Administration (m/w/d) bei mailbox.org: ab sofort, Vollzeit, Berlin Job ansehen Sales Manager (m/w/d) bei mailbox.org: ab sofort, Vollzeit, Berlin oder Remote Job ansehen Linux-Administrator (m/w/d) bei mailbox.org: ab sofort, Vollzeit, Berlin oder Remote Job ansehen IT-Support / User Helpdesk (m/w/d) bei mailbox.org: ab sofort, Vollzeit, Berlin oder Remote Job ansehen Personal Assistant der Geschäftsführung (m/w/d) bei Heinlein Support: ab sofort, Vollzeit, Berlin Job ansehen Linux-Consultant (m/w/d) bei Heinlein Support: ab sofort, Vollzeit, Berlin Job ansehen Bewerbungsprozess Deine Bewerbung via E-Mail ⟩ Telefonisches Erstgespräch ⟩ Persönliches Interview ⟩ Job-Angebot Keine passende Stelle dabei? Wir freuen uns über spannende Bewerbungen und Menschen, die mit Ihren Fähigkeiten unser Team ergänzen. Jetzt initiativ bewerben Das sagen deine Kolleginnen und Kollegen Erfahre aus erster Hand, wie wir bei mailbox.org ticken. „Man kann sich auf die anderen verlassen. Insgesamt empfinde ich das Gemeinschaftsgefühl hier als viel stärker, als ich es aus anderen Unternehmen kenne.“ Hendrik Schlange, Teamleiter Produktentwicklung Zum Interview mit Hendrik „Ich mag den Fokus auf Linux und den Open Source-Gedanken. Man lernt hier richtig viel und kennt jede Kollegin und jeden Kollegen noch persönlich.“ Oliver Jubel, Admin Zum Interview mit Oliver"
