title = "Datenschutz | mailbox.org"
description = "mailbox.org ► der E-Mail Anbieter für Privat- und Geschäftskunden ✓ werbefreies & sicheres E-Mail Postfach"
full_description = "Datenschutzhinweise nach EU-Datenschutz-Grundverordnung (DSGVO) Heinlein Hosting GmbH Diese Datenschutzhinweise gelten auch für mailbox.org und mailbox.org BUSINESS https://mailbox.org JPBerlin https://jpberlin.de Wir von der Heinlein Hosting GmbH nehmen Datenschutz sehr ernst. Schon seit 1992 haben wir uns auf den sicheren Datenaustausch und den Schutz der Privatsphäre spezialisiert. Datenschutz ist für uns also kein lästiges Übel, sondern politische Überzeugung, Aufgabe und Mission. Trotzdem müssen auch wir bestimmte Daten erfassen und speichern, um den reibungslosen Betrieb der Server und damit auch die Sicherheit Ihrer Daten gewährleisten zu können. Außerdem müssen auch wir Ihnen Rede und Antwort stehen können, um nachzuweisen, dass unsere Systeme ordentlich funktionieren und wir unsere Leistung Ihnen gegenüber erbracht haben. Im Folgenden legen wir Ihnen vollständig offen, wo, wie lange und wofür wir Daten verarbeiten. Die Verarbeitung personenbezogener Daten, beispielsweise des Namens, der Anschrift, E-Mail-Adresse oder Telefonnummer einer betroffenen Person, erfolgt stets im Einklang mit der Datenschutz-Grundverordnung und in Übereinstimmung mit den für die Heinlein Hosting GmbH geltenden deutschen Datenschutzbestimmungen. Mit diesen Datenschutzhinweisen möchten wir Sie über Art, Umfang und Zweck der von uns erhobenen, genutzten und verarbeiteten personenbezogenen Daten informieren. Ferner klären wir Sie mit diesen Datenschutzhinweisen über die Ihnen zustehenden Rechte auf. Die Heinlein Hosting GmbH hat als für die Verarbeitung verantwortliche Stelle zahlreiche technische und organisatorische Maßnahmen umgesetzt, um einen möglichst lückenlosen Schutz der verarbeiteten personenbezogenen Daten sicherzustellen. Dennoch können internetbasierte Datenübertragungen grundsätzlich Sicherheitslücken aufweisen, so dass ein absoluter Schutz nicht gewährleistet werden kann. Aus diesem Grund steht es jeder betroffenen Person frei, personenbezogene Daten auch auf alternativen Wegen, beispielsweise telefonisch, an uns zu übermitteln. 1. Begriffsbestimmungen Die Datenschutzhinweise der Heinlein Hosting GmbH beruhen auf den Begrifflichkeiten, die durch den Europäischen Richtlinien- und Verordnungsgeber beim Erlass der Datenschutz-Grundverordnung (DSGVO) verwendet wurden. Unsere Datenschutzhinweise sollen sowohl für die Öffentlichkeit als auch für unsere Kunden und Geschäftspartner einfach lesbar und verständlich sein. Um dies zu gewährleisten, möchten wir vorab die verwendeten Begrifflichkeiten erläutern. Wir verwenden in diesen Datenschutzhinweisen unter anderem die folgenden Begriffe: Personenbezogene Daten Dazu zählen alle Informationen, die sich auf eine identifizierte oder identifizierbare natürliche Person (im Folgenden „betroffene Person“) beziehen. Als identifizierbar wird eine natürliche Person angesehen, die direkt oder indirekt, insbesondere mittels Zuordnung zu einer Kennung wie einem Namen, zu einer Kennnummer, zu Standortdaten, zu einer Online-Kennung oder zu einem oder mehreren besonderen Merkmalen, die Ausdruck der physischen, physiologischen, genetischen, psychischen, wirtschaftlichen, kulturellen oder sozialen Identität dieser natürlichen Person sind, identifiziert werden kann. Betroffene Person Eine betroffene Person ist jede identifizierte oder identifizierbare natürliche Person, deren personenbezogene Daten von dem für die Verarbeitung Verantwortlichen verarbeitet werden. Verarbeitung Darunter zu verstehen ist jeder, mit oder ohne Hilfe automatisierter Verfahren, ausgeführte Vorgang oder jede solche Vorgangsreihe im Zusammenhang mit personenbezogenen Daten wie das Erheben, das Erfassen, die Organisation, das Ordnen, die Speicherung, die Anpassung oder Veränderung, das Auslesen, das Abfragen, die Verwendung, die Offenlegung durch Übermittlung, Verbreitung oder eine andere Form der Bereitstellung, den Abgleich oder die Verknüpfung, die Einschränkung, das Löschen oder die Vernichtung. Einschränkung der Verarbeitung Einschränkung der Verarbeitung ist die Markierung gespeicherter personenbezogener Daten mit dem Ziel, ihre künftige Verarbeitung einzuschränken. Profiling Profiling ist jede Art der automatisierten Verarbeitung personenbezogener Daten, die darin besteht, dass diese personenbezogenen Daten verwendet werden, um bestimmte persönliche Aspekte, die sich auf eine natürliche Person beziehen, zu bewerten, insbesondere, um Aspekte bezüglich Arbeitsleistung, wirtschaftlicher Lage, Gesundheit, persönlicher Vorlieben, Interessen, Zuverlässigkeit, Verhalten, Aufenthaltsort oder Ortswechsel dieser natürlichen Person zu analysieren oder vorherzusagen. Pseudonymisierung Damit gemeint ist die Verarbeitung personenbezogener Daten in einer Weise, auf welche die personenbezogenen Daten ohne Hinzuziehung zusätzlicher Informationen nicht mehr einer spezifischen betroffenen Person zugeordnet werden können, sofern diese zusätzlichen Informationen gesondert aufbewahrt werden und technischen und organisatorischen Maßnahmen unterliegen, die gewährleisten, dass die personenbezogenen Daten nicht einer identifizierten oder identifizierbaren natürlichen Person zugewiesen werden. Verantwortlicher oder für die Verarbeitung Verantwortlicher Das ist die natürliche oder juristische Person, Behörde, Einrichtung oder andere Stelle, die allein oder gemeinsam mit anderen über die Zwecke und Mittel der Verarbeitung von personenbezogenen Daten entscheidet. Sind die Zwecke und Mittel dieser Verarbeitung durch das Unionsrecht oder das Recht der Mitgliedstaaten vorgegeben, so kann der Verantwortliche beziehungsweise können die bestimmten Kriterien seiner Benennung nach dem Unionsrecht oder dem Recht der Mitgliedstaaten vorgesehen werden. Auftragsverarbeiter Auftragsverarbeiter ist eine natürliche oder juristische Person, Behörde, Einrichtung oder andere Stelle, die personenbezogene Daten im Auftrag des Verantwortlichen verarbeitet. Empfänger Empfänger ist eine natürliche oder juristische Person, Behörde, Einrichtung oder andere Stelle, der personenbezogene Daten offengelegt werden, unabhängig davon, ob es sich bei ihr um einen Dritten handelt oder nicht. Behörden, die im Rahmen eines bestimmten Untersuchungsauftrags nach dem Unionsrecht oder dem Recht der Mitgliedstaaten möglicherweise personenbezogene Daten erhalten, gelten jedoch nicht als Empfänger. Dritter Dritter ist eine natürliche oder juristische Person, Behörde, Einrichtung oder andere Stelle außer der betroffenen Person, dem Verantwortlichen, dem Auftragsverarbeiter und den Personen, die unter der unmittelbaren Verantwortung des Verantwortlichen oder des Auftragsverarbeiters befugt sind, die personenbezogenen Daten zu verarbeiten. Einwilligung Einwilligung ist jede von der betroffenen Person freiwillig für den bestimmten Fall in informierter Weise und unmissverständlich abgegebene Willensbekundung in Form einer Erklärung oder einer sonstigen eindeutigen bestätigenden Handlung, mit der die betroffene Person zu verstehen gibt, dass sie mit der Verarbeitung der sie betreffenden personenbezogenen Daten einverstanden ist. 2. Name und Anschrift der für die Verarbeitung verantwortlichen Stelle nach DS-GVO: Heinlein Hosting GmbH Schwedter Straße 8/9B10119 BerlinDeutschland E-Mail: mail@heinlein-support.deWebseite: www.heinlein-support.de 3. Cookies und Webseitenanalyse mit Matomo (ehemals Piwik) Wir benutzen auf unseren Webseiten „Matomo“, eine Open-Source-Software zur statistischen Auswertung der Besucherzugriffe. Wir betreiben ein eigenes Matomo-System, weil wir ausdrücklich auf die sonst übliche externe Analyse durch Google Analytics verzichten wollen. Wir analysieren über Matomo, woher Besucher unserer Webseite kommen, welche Inhalte für Sie relevant sind und wo es eventuell Probleme in unserer Webseite gibt. Wir analysieren die Ergebnisse unserer Marketingmaßnahmen, um die Wirksamkeit der Maßnahmen zu messen. Ebenso analysieren wir die Bewegung unserer Besucher auf den Webseiten um besser zu verstehen, wo wir Verbesserungen durchführen können. Wir führen keine konkrete Beobachtung unserer Nutzer als identifizierbare Personen durch. Alle Daten inklusive der IP-Adresse werden ausschließlich anonymisiert/pseudonymisiert gespeichert. Matomo wird bei uns cookielos betrieben. Bei der Nutzung unserer Services (nach dem Kunden-Login) kommen ausschließlich technische Cookies zum Einsatz. Diese sind zwingend für die Funktion der Systeme notwendig. 4. Weitere Dienste und Tracker An einigen Stellen verlinken wir auf Videos von uns. Diese Videos werden bei externen Anbietern gehostet. Für unsere Videos verwenden wir Vimeo und YouTube. Wir haben die Verlinkungen im erweiterten Datenschutzmodus eingebunden, damit so wenig wie möglich Daten an die externen Hoster übertragen werden. Mit dem Start der Videos setzten die Anbieter Cookies auf Ihrem Endgerät. Die Datenschutzhinweise der externen Anbieter finden Sie hier YouTube (https://policies.google.com/privacy) und hier Vimeo (https://vimeo.com/privacy). Der Vimeo-Video-Player löst bei einigen Anti-Tracking-Systemen einen Alarm aus, weil er statistische Angaben zur Video-Qualität an den Hersteller Conviva übermitteln kann (Datenschutzpolicy von Conviva). Uns ist leider kein Weg bekannt, das zu umgehen. Außerdem können Kommentare von Nutzern unter Beiträgen oder FAQ-Artikeln zu einem Nachladen von Avatar-Bildern von Gravatar führen (Datenschutzpolicy von Gravatar). 5. Erfassung von allgemeinen Daten und Informationen Unsere Webserver erfassen mit jedem Aufruf unserer Internetseiten eine Reihe von allgemeinen Daten und Informationen. Diese allgemeinen Daten und Informationen werden in den Logfiles des Servers gespeichert. Erfasst werden können die (1) verwendeten Browsertypen und Versionen, (2) das vom zugreifenden System verwendete Betriebssystem, (3) die Internetseite, von welcher ein zugreifendes System auf unsere Internetseite gelangt (sogenannte Referrer), (4) die Unterwebseiten, welche über ein zugreifendes System auf unserer Internetseite angesteuert werden, (5) das Datum und die Uhrzeit eines Zugriffs auf die Internetseite, (6) eine Internet-Protokoll-Adresse (IP-Adresse), (7) der Internet-Service-Provider des zugreifenden Systems und (8) sonstige ähnliche Daten und Informationen, die der Gefahrenabwehr im Falle von Angriffen auf unsere informationstechnologischen Systeme dienen. Bei der Nutzung dieser allgemeinen Daten und Informationen zieht die Heinlein Hosting GmbH keine Rückschlüsse auf die betroffene Person. Diese Informationen werden vielmehr benötigt, um (1) die Inhalte unserer Internetseite korrekt auszuliefern, (2) die Inhalte unserer Internetseite zu optimieren, (3) die dauerhafte Funktionsfähigkeit unserer informationstechnologischen Systeme und der Technik unserer Internetseite zu gewährleisten sowie (4) um Strafverfolgungsbehörden im Falle eines Cyberangriffes die zur Strafverfolgung notwendigen Informationen bereitzustellen. Diese anonym erhobenen Daten und Informationen werden durch uns daher einerseits statistisch und ferner mit dem Ziel ausgewertet, den Datenschutz und die Datensicherheit in unserem Unternehmen zu erhöhen, um letztlich ein optimales Schutzniveau für die von uns verarbeiteten personenbezogenen Daten sicherzustellen. Die anonymen Daten der Server-Logfiles werden getrennt von allen durch eine betroffene Person angegebenen personenbezogenen Daten gespeichert. 6. Registrierung auf unserer Internetseite Sie haben die Möglichkeit, sich auf unseren Internetseiten unter Angabe von personenbezogenen Daten zu registrieren. Welche personenbezogenen Daten dabei an uns übermittelt werden, ergibt sich aus der jeweiligen Eingabemaske, die für die Registrierung verwendet wird. Die von Ihnen eingegebenen personenbezogenen Daten werden ausschließlich für die interne Verwendung und für eigene Zwecke erhoben und gespeichert. Durch eine Registrierung auf unseren Internetseiten wird ferner die von Ihrem Internet-Service-Provider (ISP) vergebene IP-Adresse, das Datum sowie die Uhrzeit der Registrierung gespeichert. Die Speicherung dieser Daten erfolgt vor dem Hintergrund, dass nur so der Missbrauch unserer Dienste verhindert werden kann, und diese Daten im Bedarfsfall ermöglichen, begangene Straftaten aufzuklären. Insofern ist die Speicherung dieser Daten zur Absicherung des für die Verarbeitung Verantwortlichen erforderlich. Eine Weitergabe dieser Daten an Dritte erfolgt grundsätzlich nicht, sofern keine gesetzliche Pflicht zur Weitergabe besteht oder die Weitergabe der Strafverfolgung dient. Ihre Registrierung unter freiwilliger Angabe personenbezogener Daten dient uns dazu, Ihnen Inhalte oder Leistungen anzubieten, die aufgrund der Natur der Sache nur registrierten Benutzern angeboten werden können. Registrierten Personen steht die Möglichkeit frei, die bei der Registrierung angegebenen personenbezogenen Daten jederzeit abzuändern oder vollständig aus dem Datenbestand des für die Verarbeitung Verantwortlichen löschen zu lassen. Wir erteilen Ihnen jederzeit auf Anfrage Auskunft darüber, welche personenbezogenen Daten über Sie bei uns gespeichert sind. Ferner berichtigten oder löschen wir personenbezogene Daten auf Wunsch oder Hinweis der betroffenen Person, soweit dem keine gesetzlichen Aufbewahrungspflichten entgegenstehen. Unsere Mitarbeiter vom Kundensupport stehen Ihnen in diesem Zusammenhang als Ansprechpartner zur Verfügung. 7. Kontaktmöglichkeit über die Internetseiten, Newsletter und Community Hours Die Internetseiten der Heinlein Hosting GmbH enthalten aufgrund von gesetzlichen Vorschriften Angaben, die eine schnelle elektronische Kontaktaufnahme zu unserem Unternehmen sowie eine unmittelbare Kommunikation mit uns ermöglichen, was ebenfalls eine allgemeine Adresse der sogenannten elektronischen Post (E-Mail-Adresse) umfasst. Sofern Sie per E-Mail oder über ein Kontaktformular den Kontakt mit uns aufnehmen, werden die von Ihnen übermittelten personenbezogenen Daten automatisch gespeichert. Solche auf freiwilliger Basis von Ihnen an uns übermittelten personenbezogenen Daten werden für Zwecke der Bearbeitung oder der Kontaktaufnahme zu Ihnen gespeichert. Es erfolgt keine Weitergabe dieser personenbezogenen Daten an Dritte. Gleiches gilt für die Anmeldung unserer Newsletter und die Community Hours. 8. Kommentarfunktion im Blog auf der Internetseite Wir bieten Ihnen auf unserem Blog oder in unserem Userforum, die sich auf unseren Internetseiten befinden, die Möglichkeit, individuelle Kommentare oder einzelne Beiträge zu hinterlassen. Ein Blog oder Userforum ist ein auf einer Internetseite geführtes, in der Regel öffentlich einsehbares Portal, in welchem eine oder mehrere Personen, die Blogger oder Web-Blogger genannt werden, Artikel posten oder Gedanken in sogenannten Blogposts niederschreiben können. Die Blogposts können in der Regel von Dritten kommentiert werden. Hinterlassen Sie einen Kommentar in unserem Blog oder Userforum, werden neben Ihren hinterlassenen Kommentaren auch Angaben zum Zeitpunkt der Kommentareingabe so"
