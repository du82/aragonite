l be added to the cost of all services purchased. For exact base pricing please refer to prices listed in USD.<\/p>\n","dynamicBehavior":"contacts","originalText":"Learn more"} Offer Terms {"originalTextAriaLabel":"tooltip","closeLabel":"Close Tooltip","mobileCloseLabel":"Close","maxOfLabel":"a maximum of","type":"tooltip","id":"2XrN4j9q7AxXVLNDzpyFjm","placement":"right","header":null,"copy":"<p><strong>Offer Terms:<\/strong> 15% off the monthly base price of Mailchimp Premium, Standard or Essentials at 10,000 or more contacts for the first 12 (twelve) months of service, starting from the date of enrollment followed by the then-currently monthly list price based on your contacts and email sends. Discount applies to the monthly plan and the purchase of any add-on blocks for additional contacts. Your account will automatically be charged on a monthly basis until you cancel. If you add or remove features and\/or services, your service fees will be adjusted accordingly. If you change plans or tiers and maintain a minimum tier of 10,000 or more contacts, then the price will change to the then current list price for such relevant subscription and you will retain the 15% discount for the remainder of the original 12 month period. If you change to a plan or tier with fewer than 10,000 contacts, then the 15% discount will be terminated and the price will change to the then current list price for such relevant subscription when the downgrade takes effect at your next monthly billing date. Taxes may be applied where applicable. Accounts will be placed on hold if no valid payment method is on file after the promotional period ends. To be eligible for this offer you must be a new Mailchimp customer or existing Free plan customer within 90 days of account creation in select countries, and sign up for the Premium, Standard or Essentials monthly plan using the \"Buy Now\" button. Offer available for a limited time only. Discount has no cash value. Mailchimp accounts with compliance holds or violations are ineligible. You can pause your subscription or delete your Mailchimp account at any time via the Settings section in the Account &amp; Billing area. Pausing your monthly plan or deleting your Mailchimp account will become effective immediately. You can downgrade your monthly plan in the Monthly Plans or Credits page in the Billing Section. Downgrading your monthly plan will become effective at the end of the monthly billing period. You will not receive a refund for previously billed charges. You will immediately lose the offer if you cancel your account during or prior to the end of the promotional period. Pausing your account does not pause the promotional period and the promotion will expire 12 months from when it was originally applied to your account. Changing your Marketing plan does not extend the duration of the promotional period and the promotion will expire 12 months from when it was originally applied to your account. Offer does not apply to associated transaction fees or add-on\/one-time fees, such as transactional email (fka Mandrill) charges, SMS Marketing, pay as you go credits, or Google ads. This offer cannot be combined with any other Mailchimp offer(s). One offer per Mailchimp account. Offers are not eligible to be applied concurrently or consecutively. See <a href=\"\/legal\/promotional-offer-terms\/#15%25_Introductory_Offer_for_10%2C000%2B_Contacts_Terms_%26_Conditions\">full offer terms<\/a>. Terms, conditions, pricing, special features, and service and support options subject to change without notice.<\/p>\n","dynamicBehavior":null,"originalText":"Offer Terms"} Overages apply if contact or email send limit is exceeded. Learn more {"baseContacts":{"essential":500,"free":500,"contacts":500,"premium":10000,"standard":500},"maxContacts":{"essential":50000,"free":500,"premium":250000,"standard":100000},"originalTextAriaLabel":"tooltip","closeLabel":"Close Tooltip","mobileCloseLabel":"Close","maxOfLabel":"a maximum of","typ