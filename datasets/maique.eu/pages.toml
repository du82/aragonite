full_description = "Dreaming… Hallucinating… Lying in bed, looking down at my covered legs and feet, picturing this instead. 🇰🇭 🏝️ Daydreaming Again Throwback to a very fun afternoon. Beer (lots of it), beach, karaoke. How could that go wrong? 🇰🇭 🍺 Not sure when, or if, we’ll ever go back, but it’s good to read about friends who are walking these same streets right now, and be able to visit this way. 🇰🇭 🚲 Love Beach Now is probably not the time to think about this, but can’t help it. We just came back from vacation, but vacation is what we need. 🇰🇭🏝️ Another day, another country. We stopped in Cambodia, and this is how it went. theAmazingHoneymoon goes on… dinkiwinkiminkiwinki.com/cambodia-… 🇰🇭🏖🏯 It’s been a while since I posted a bSide, so here goes… While waiting for the time to pick tinyMovieStar up from kindergarten, hoping she didn’t get anything! 🇰🇭 ⏰ Pack Your Bags Not so long ago, when we could go places and meet people. It’s taking too long. 💛 🇰🇭 It’s going to be a hot one. Anyone has a time machine they can spare for a couple of days ? 💖 🇰🇭"
