title = "Posts tagged beSeated - {maique}"
description = "A list of all posts tagged beSeated on {maique}"
full_description = "🪑 Moura #beSeated I should be using one of these, as I sprained my ankle yesterday. I half expected it to be perfect after some rest, but know I’ll have to take it easier today. 🪑 On the way back to the city. In the meantime we’ve been rammed by one of the caravan’s cars, had a wonderful lunch, and worked a bit. 🪑 So many photos still left to check, from the thousands shot last month. In between work stuff, still managed to get some personal ones. This one belongs to beSeated, a long running series. 🪑 A cute, very vintage, #beSeated couple. movieStar saw it yesterday, sent a photo, and we walked by again a little later. I believe we’re also a cute, almost vintage, couple… 🪑 We made it! Ready to party, there’s over 20 people in the house, and we’re going out soon. More are expected, from our side."
