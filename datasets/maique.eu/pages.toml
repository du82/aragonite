l, and meet the gang for lunch. In the afternoon she had ski practice in a town an hour away. It was cancelled because it was still raining, but we went anyway. We really thought we’d see snow falling, but needed to go further up the mountain. There was no more road, only a lift. We decided against it, as the girls were getting cranky already. Too much driving, too many twists and turns. The drive up is amazing, if one enjoys mountain roads, as I do. The mountains are beautiful. The town (Macugnaga) looks like a postcard. We had a walk around, by the old church, and ended up in a cosy cafe, with the most annoying staff, drinking the thickest hot chocolate I ever had. Delicious. The girls started coughing here. Back to the village for dinner with Mamma, the Italian-Swiss matriarch, who had just arrived from Switzerland. She’s 80+, and had spent a few days skiing. It was lovely to meet her. 🚚 It was time to move the circus back to Portugal. But first… Pharmacy in the morning. So early, I actually had to wait for it to open for the day. I used that time to check on a couple of words I wasn’t too sure how to say in Italian. In the end I did just fine, and managed to get everything we needed (cough syrup and drops). Both girls were a little unwell then. It would get worse. We had lunch at the mountain house, and moved down to Milan for the flight when the sun was about to set. Dropped off the girls, drove to the other terminal, dropped off the car (under three minutes to do it), got on the shuttle, and we waited until it was time to go. Both movieStars burning in fever the whole time. It was not fun, but thankfully they slept most of the way. Very late departure as well, we were pretty tired by then. And, on top of it, I got a call for an assignment the following morning, just before boarding. I’m in no position to say no at this point in time, so I had to deal with that as well. Surprise: water as coming down from the ceiling when we arrived, well past midnight. We were in Lisbon, and I have to say that everything was as smooth as I could ever dream, regarding EasyJet, the Budget rental, and airport staff. Nice, professional, quick. Some people m 🚔 Thursday, with more rain than I’d care for. Work. Finally. This has not been a good year so far. Not at all. 🍿 Broken Rage. That was it. 📱 Subscribed to Flighty Pro for a week. One has to, when flying. 📦 Ordered my own birthday present. It’s coming up, and I don’t want to rely on others getting me stuff. They tend to forget. I also know movieStar is not going to be around on the day, as she has a trip to the island planned, so… making sure I have something. I ordered a sling bag from Labo Mono."
