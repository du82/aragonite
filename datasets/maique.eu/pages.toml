full_description = "📐 My first photo for #TheCompoChallenge. Uninspired, sorry about that. But I really needed an espresso. Coffee Time This is what I was talking about, @mpmilestogo. I would be sooooo happy if I could have one of these right now! While looking for this one I had to dig through the Vietnam photos. Missed it more. ☕️🇻🇳 The Boss One of the first things that comes to mind when I reminisce about Japan is the coffee from the vending machines. I loved it. I noticed Tommy Lee Jones on a few of the machines, but wasn’t aware this is a campaign that’s been going for so long. Another sighting. ☕️ 🇯🇵 What’s keeping me awake ? Coffee! Tons of coffee. And today, when someone turned the damn hear all the way up, it needs a big lump of ice. 🧊☕️ Still on the same mood: still Japan, and still coffee. Need more of both! ボスコーヒー ☕️ 🇯🇵"
