full_description = "Almost… Done with the text (I’m almost positive), and about to dive into the hundreds of photos from HK. I will probably leave that for tomorrow. It’s too late, I’m too tired. 🇭🇰🚶🏻‍♀️ HK street art. I think I’ll get a few of these and put them together on a separate page… I’ve been drawn to street art forever, I might as well do something with all the photos… 👾 🇭🇰 The bSides project gets it’s own page. So far 🇯🇵Japan and 🇭🇰Hong Kong, but others will follow. Got to keep busy. Feel free to visit and let me know what you think about it. bSides Loved the time we spent in HK. We rented an AirBnB apartment, only one on the whole trip, and I loved going out for a smoke and a can of coffee from our local 7-Eleven. 🚬 ☕️ 🇭🇰 Usually I miss the road enough already. But being stuck at home is making the feeling grow. Not knowing when we’ll be able to do this again makes me appreciate the good times we’ve had even more. 🌈🇭🇰"
