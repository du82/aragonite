full_description = "⛄️ You didn’t think we were done with the photos, did you? Some more italianBsides coming up, I’m sure. 🛍️ Hard to find an open shop in some towns. Most things only open in the summer, when German and Dutch tourists arrive. 🏔️ Snow-capped mountains with a lake next to them will never get boring for me. It’s a brilliant mix, as far as I’m concerned. Literally postcard perfect situation. 🇮🇹 We made it. Landed, got the car, and drove off. After sunset when we left the airport. The house is awesome, and we had dinner with friends, in the mountain. Perfect."
