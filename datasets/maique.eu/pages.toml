description = "A list of all posts tagged notes on {maique}"
full_description = "💣 For the second month in a row I was billed 3 USD by Mailgun. I’m on the free tier. Today I tried to figure out why. Seems like I sent 3000+ emails, even though I sent none. Their UI on mobile is atrocious, and I lack the mental bandwidth to figure out what happened. Nuked the account. 😵‍💫 This will be an odd week! School is out until Thursday. I’m working from Friday through Sunday. movieStar leaves for the island on Sunday. Monday is my birthday. She won’t be here. ⛄️ You didn’t think we were done with the photos, did you? Some more italianBsides coming up, I’m sure. 💧 Plumber will probably come today to check things. I have a book to pick up from the bookstore. Photos need to be sent to agency. Girls need to be nursed into shape. These are my plans for the day. 💻 Editing is taking a lot longer than usual today. Harder to work with a feverish baby girl around, I only want to cuddle. 🌧️ After almost a week up in the snowy mountains (where we would walk around in a t-shirt), it feels great to be back home, where the sun never stops shini… 👮🏻‍♂️ Whole morning with cops, mostly Spanish and local. One asks me a very technical question, I had to tell him I didn’t have a clue. He said he thought I was an officer! “With this hair and beard?”, I asked. He assumed I was doing undercover work. I never thought I’d be laughing so much today. 🐝 Anyhoo, we’re back. I’ll leave tomorrow to shoot something, and then hope regular life resumes. I have photos to post, shows to watch, feeds to read. Lots of catching up to do. 😩 Not a brilliant end of day. Landed close to midnight. Both girls with a fever. Took forever to get an Uber. Got home, and the apartment upstairs is leaking into ours. Neighbor not even home. Close to 1AM, can’t sleep with the drip-drip-drip sound, and must be up super early for an assignment. 💊 In a time honored tradition, here I am again, trying to find a pharmacy, in a country I barely know, and explain myself in a language I don’t speak."
