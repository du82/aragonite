full_description = "bSides A few - maybe a lot - of outtakes from theAmazingHoneymooon and other places we’ve visited. When this started, during Covid, we were stuck inside for a few months, with no work at all. I decided to go through the photos I took during that amazing trip, and edit a couple of them to keep me busy. Here they are, hope you enjoy them. 🇯🇵 japanBsides 🇭🇰 hkBsides 🇰🇭 cambodiaBsides 🇱🇦 laosBsides 🇻🇳 vietnamBsides 🇮🇩 indonesiaBsides 🇲🇲 myanmarBsides 🇸🇬 singaporeBsides 🇹🇭 thailandBsides 🇲🇾 malaysiaBsides 🇲🇴 macauBsides And then it grew. It’s not all Asia for us, so here you go, other places in the world…. 🇬🇧 londonBsides 🇲🇽 mexicoBsides 🇩🇰 denmarkBsides 🇺🇸 usaBsides 🇲🇦 moroccoBsides 🇹🇷 turkeyBsides The collection is growing by the day, still a few more countries to add. There’s also a couple of special ones, extra categories, that run parallel to all the others: streetArt. I’ve been an admirer for long, time to get all those photos together. And bridalBliss, with brides and grooms spotted across the world. beSeated is another of my odd fixations, places where you can seat, usually after they have been abandoned. I’m sure others will be added… 👾 streetArt 👰🏻 bridalBliss 🪑 beSeated ☕️ coffeeTime And we get to the most special place of all, our home away from home, the amazing island of Príncipe. We met there, married there, lived there, it means everything to us. 🇸🇹 príncipe Hope you enjoy all these. sticker spotter • panda pixels • mrBatsuContact"
