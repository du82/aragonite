["https://maique.eu/posts/thingsthisweek-127"]
title = "thingsThisWeek #127 - {maique}"
description = """
🇮🇹 Friday! Finally. Italy! Yay! Ciao, Italia. We got a Bolt, then an EasyJet, and soon we were landing in Milan Milano. Easy.

The flight was very uneventful, regular. It..."""
full_description = "thingsThisWeek #127 Italy. Snow. Food. Friends. That’s it. It was much better than we had anticipated. 🇮🇹 Friday! Finally. Italy! Yay! Ciao, Italia. We got a Bolt, then an EasyJet, and soon we were landing in Milan Milano. Easy. The flight was very uneventful, regular. It still departed almost an hour late, but that’s kinda expected for the low cost & Lisbon airport mix. From Terminal 1, and that’s a HUGE difference. Quick, slightly under three-hour flight, and we landed in Malpensa’s Terminal 2. Thankfully no one seems to call it by the official name (hint: it starts with Silvio, and ends with Berlusconi). We couldn’t wait to meet our friends, and their children: a daughter, and her younger brother. Nine, and six. As soon as we entered the terminal, and were heading to baggage claim, movieStar noticed we’d left one of the gifts we brought in the airplane. A box of LEGO for the kids. Panic! Airport staff came through, incredibly, and we had it back with us 20 minutes later! Panic averted. Amazing service. We then rode the shuttle bus to Terminal 1, and got our rental car. A lot of people in front of us, but very quick when our time arrived. The car had a few bruises. Also first time driving an MG too. Comfortable. Driving in Italy is sometimes considered a challenge, but we’re Portuguese. It’s nothing. Really. If you learn how to drive in Lisbon, only Mumbai will scare you. Maybe. Surely not Milano. Anyway, it took us around an hour, equally divided between rush hour traffic around the airport, and highway. Soon we were with our friends: a girl who was born in the same village as movieStar, married to the nicest Italian guy in world, a very cool man who once found himself working in Portugal, in the area where my parents come from! He knows the tiny villages in that area as well as I do! Funny as hell! Odd too. We made it to the town where they live, a small place. Map had already been memorized. I like to know these things beforehand. Pharmacy, supermarket, cafe, the main square, that sort of thing. Our friends met us, and we drove to the place where we would be staying. A big house they keep in the village. We dropped our bags, found out how everything works, and out we went, to their home, high up in the mountain next door. Dinner was waiting. Delicious dinner was waiting. We ate a lot. We would eat a lot the whole time we were there. We talked, drank, had fun, and they drove us down when it got too late. ⛄️ Saturday. tinyMovieStar saw snow for the first time. Check! That was the reason for the whole trip. And all we had to do was drive up the hill. That was it. We could see it from our living room, as soon as we woke up. The village is surrounded by huge mountains, and they had snow covering the top. Went to the supermarket for supplies, then to the bakery for cakes and espresso. We truly are coffee brothers, the Italians and us Portuguese. It’s the only place where we feel at home, coffee-wise. It’s the same coffee. Their machines are the ones we have in every single cafe in the country. They’re all Italian made. Anyway, we drove up the mountain, until we found a little snow. Got out of the car, and walked the rest of the way. As soon as the little one saw a patch big enough to lie on, she started doing a snow angel. She was SO happy! We spent around an hour going up the hill, and then went back to their place for lunch. It’s the sweetest spot. An awesomely cute cottage, with a sprawling front yard, complete with the most incredible view of the mountains. We spent hours looking at them. The kids played outside, we enjoyed the warmth indoors. Then it was time for school work, the girl had some stuff to do. Math and Italian. Guess who was the tutor for the day? Yeah, I found myself explaining objectivity/subjectivity, and fractions. With Italian schoolbooks! Thankfully the girl speaks Portuguese as well! Then, as night fell, we went out for ice-cream. And back for pizza. Delicious homemade pizza. We were living the Italian dream. ⛷️ Sunday. Woke up way too early. 5AM, a full three hours before our appointed time. We were going to Switzerland, for a ski event. Maria, the girl, had a competition. She comes from a ski family. Both grandparents were champions, and her father a ski instructor for many years. I was lying in the sofa, while the girls slept on the bed, considering the day ahead, and posting random thoughts. I considered going data-less for a day, to save on the silly roaming charges in Switzerland. In comes Andy, mentioning my trusty Holafly. Thanks. Got an eSIM. The way to Switzerland, snow all around. Cold surprisingly bearable. The whole day surrounded by ski enthusiasts. On the way back, after many many hours of standing around, we still found the energy to cross a suspended bridge. I wouldn’t say it was scary, but the thing did swing a lot. The whole valley is a UNESCO protected area. It’s beautiful. We also stopped at a tiny village, just before crossing back into Italy, to buy some cheese for a fondue. Yummy. 🏨 Monday. Maria had to go to school, we spent the morning driving around the lake. Humongous villas, empty towns. Most shops, hotels, restaurants, are only open during the summer months. Towns have a ghost town feel the rest of the year, we’re told. It certainly feels odd to walk in them. There is an incredible amount of hotels in the area, majestic ones. Loads of renovation work going on too, in buildings and roads. But feels very dated, and eerily deserted. We all got together for lunch, and visited the family’s marble quarry after that. Impressive! Oh! I drove a Unimog!! ❄️ On Tuesday, we woke up and, unlike every other day so far, it was raining. And foggy. We went for coffee, and the little one went up to the mountain house, and played with her friends. We, the parents, went to the one lake we had missed so far. We couldn’t see a thing when we got there, but enjoyed the quiet drive. We were back in time to pick up the older girl from school, and meet the gang for lunch. In the afternoon she had ski practice in a town an hour away. It was cancelled because it was still raining, but we went anyway. We really thought we’d see snow falling, but needed to go further up the mountain. There was no more road, only a lift. We decided against it, as the girls were getting cranky already. Too much driving, too many twists and turns. The drive up is amazing, if one enjoys mountain roads, as I do. The mountains are beautiful. The town (Macugnaga) looks like a postcard. We had a walk around, by the old church, and ended up in a cosy cafe, with the most annoying staff, drinking the thickest hot chocolate I ever had. Delicious. The girls started coughing here. Back to the village for dinner with Mamma, the Italian-Swiss matriarch, who had just arrived from Switzerland. She’s 80+, and had spent a few days skiing. It was lovely to meet her. 🚚 It was time to move the circus back to Portugal. But first… Pharmacy in the morning. So early, I actually had to wait for it to open for the day. I used that time to check on a couple of words I wasn’t too sure how to say in Italian. In the end I did just fine, and managed to get everything we needed (cough syrup and drops). Both girls were a little unwell then. It would get worse. We had lunch at the mountain house, and moved down to Milan for the flight when the sun was about to set. Dropped off the girls, drove to the other terminal, dropped off the car (under three minutes to do it), got on the shuttle, and we waited until it was time to go. Both movieStars burning in fever the whole time. It was not fun, but thankfully they slept most of the way. Very late departure as well, we were pretty tired by then. And, on top of it, I got a call for an assignment the following morning, just before boarding. I’m in no position to say no at this point in time, so I had to deal with that as well. Surprise: water as coming down from the ceiling when we arrived, well past midnight. We were in Lisbon, and I have to say that everything was as smooth as I could ever dream, regarding EasyJet, the Budget rental, and airport staff. Nice, professional, quick. Some people m 🚔 Thursday, with more rain than I’d care for. Work. Finally. This has not been a good year so far. Not at all. 🍿 Broken Rage. That was it. 📱 Subscribed to Flighty Pro for a week. One has to, when flying. 📦 Ordered my own birthday present. It’s coming up, and I don’t want to rely on others getting me stuff. They tend to forget. I also know movieStar is not going to be around on the day, as she has a trip to the island planned, so… making sure I have something. I ordered a sling bag from Labo Mono."
year_published = 2025
