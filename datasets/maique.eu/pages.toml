Looking for..."""
full_description = "About Praia Boi Hey there, my name is maique. I’m a geeky photographer, who toots. I’m married to movieStar and we have a baby daughter, tinyMovieStar. I’m VERY lucky! Looking for photos? Sure… I have some photos on Flickr, there’s a sort of life log on Instagram, and, if you’re looking for an official site, you’ll find one at maiquemadeira.com. There’s also Boo!, and a couple other blogs. Yeah, too many! Stuff to read? Look no further, that’s what {maique} is here for. I am, however, still moving stuff over from the old home. Oh, and you can read ‘maique’ as ‘mike’. That’s how it sounds when a Portuguese reads it… Home is sweet and sunny Lisbon.Home is also the lovely island of Príncipe. me Contact If you’d like to get in touch, even if it’s just to say hi, you can do that on Mastodon. Privacy minded folks can reach out on Signal. Or just use this form. I do LOVE to get emails. Support If you enjoy the content I’m sharing, either here or on the social sites, feel free to help support my extravagant lifestyle. BuyMeACoffee I will thank you forever. If you’re looking for copies of some of my photos, you’ll find them at theShop. Let me know if the one you’re looking for is missing. I am also offering photo walks around Lisbon, do let me know if you’d like to join them. And, finally, there is also an affiliate links page, with some services I use. If you’re into one of them, and thinking about signing up, maybe check it out. LoveProject Colophon This site is hosted at Pika, a great service provided by Good Enough. My avatars were lovingly made by Andy Carolan, and Hey Hey Momo. Contact form provided by Letterbird, another service by the fine people at Good Enough. I’m using two fonts on the site: Atkinson Hyperlegible, by the Braille Institute, and Ships Whistle, by SimpleBits. Thank you all. sticker spotter • panda pixels • mrBatsuContact"
