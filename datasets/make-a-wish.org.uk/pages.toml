["https://make-a-wish.org.uk/wishes/choosing-your-wish"]
title = "Choosing your wish | Make-A-Wish UK"
description = "See some of the imaginative and magical wishes being granted by Make-A-Wish UK to children with critical illnesses."
full_description = '''Home Wishes Choosing your wish Choosing your wish Our wishes give seriously ill children the chance to do something extraordinary. For many children, it's an opportunity to choose something just for them – a once-in-a-lifetime experience.Wishes can be divided into four key themes, to have, to be, to meet, or to go. Scroll down to read more about each of these wish types and follow the links for inspiration and examples of the types of wishes we can grant. "To Have" wishes... Bluebelle, 6, "I wish to have MacBook" If you wish for a "To Have" wish, there’s a whole world of options to explore! From special celebrations and exciting experiences, to getting your hands on the latest gear, you might have a hard time choosing only one!Find out more about "To Have" wishes "To Be" wishes... Allan, 7, "I wish to be a police officer" If you could be anything for a day what would it be? Whatever you dream of being, a "To Be" wish will transform you into the star of the show.Find out more about "To Be" wishes "To Meet" wishes... Molly, 17, "I wish to meet Paolo Nutini" Some people say you should never meet your idol, but we disagree! A "To Meet" wish allows you to invite your favourite person to spend some quality time with YOU.Find out more about "To Meet" wishes "To Go" wishes... Alice, 7, "I wish to go to Lapland" Whether it's visiting the Disney characters, taking a trip to meet Santa at his grotto, visiting your favourite attraction, or just spending a well-deserved holiday with your family, a "To Go" wish can transport you a magical place, far away from the worry of doctor's appointments and hospital visits. Find out more about "To Go" wishes Other useful resources The wish journey Find out more about the journey, from initial referral to the long-term impact of a wish. The journey Applying for a wish Find out how to refer a child for a wish, including information and guidance about eligibility. Find out more How wishes help A wish can have a long-lasting positive impact, not only on the child, but also on their family. How wishes help'''
year_published = 2025
