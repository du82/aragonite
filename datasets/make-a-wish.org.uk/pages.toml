full_description = '''Home Get involved Fundraise in your community Gaming to grant wishes Gaming to grant wishes Your next game could help make wishes come true!Gaming provides the children we support with a social outlet when they’re undergoing treatment and unable to attend school or clubs with their friends. It provides respite and distraction from the challenges they face every day with their critical illness, and it offers a welcoming and inclusive community where they can be who they want to be again.Every child deserves to wish for more than a life defined by illness. Your support creates lasting memories for wish children and their families that they will treasure forever - no matter what the future holds.We are calling on creators, gamers, developers, and studios to unite and raise vital funds to fulfil life-changing wishes for critically ill children throughout the UK.Partner with us Wish 200 WeekLast July, the gaming community united once again for Wish 200 Week, to help raise enough funds to grant 200 life-changing wishes.Watch the highlights of this year's event below Find out more about Wish 200 Week Wish storiesSee the impact of a wish for yourself right here… Wish Granted Lukasz 11 yrs Renal failure "I wish to have a VR headset" Lukasz's wish Wish Granted Sophie 15 yrs Spinal muscular atrophy "I wish to have a gaming PC" Sophie's wish Wish Granted Hayley 18 yrs Tetralogy of Fallot "I wish to have a PS5 Games Console" Hayley's wish Wish Granted Harvie 7 yrs Neurofibromatosis type 1 "I wish to have an iPad Pro" Harvie's wish Wish Granted Sunil 18 yrs Spinocerebellar ataxia type 2 "I wish to have a PS5 Games Console" Sunil's wish Wish Granted Evan 14 yrs Crohn's disease "I wish to have a blue Alienware laptop and new games" Evan's wish Useful resources If you're interested in holding a fundraiser on your own channels, you'll find useful information below on how to get started, together with tips and tricks on how to make the most of your fundraising. Discord Join our server to get started, where our supportive community can help with any questions you may have. Join server Frequently asked questions If you have questions about how to get involved, you'll find the answers in our FAQs. Read our FAQs Fundraising tips & tricks Useful hints and tips to help you maximise your fundraising and stay safe. Tips & tricks'''
