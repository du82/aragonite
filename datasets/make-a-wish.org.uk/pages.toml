["https://make-a-wish.org.uk/donate/leave-a-gift-your-will"]
title = "How to leave money to a charity in your Will | Make-A-Wish UK"
description = "You could leave as little as 1% to Make-A-Wish UK and make a huge difference. A gift in your will helps us grant life-changing wishes to seriously ill children."
full_description = '''Home Donate Leave a gift in your Will Leave a gift in your Will Will you leave a little magic in your Will…? Making a Will is important for your family, and it’s also an opportunity to make a huge difference to a cause that you care about. What greater gift could you give to a seriously ill child than the belief that wishes really can come true? That’s the magical power of leaving a gift in your Will to Make-A-Wish. Request your free Wills guide today and see how you can create a little magic that could last long into the future.All this information and much more is in your free guide to leaving a gift in your Will, so please simply click and request yours today.Request your FREE guide Eight-year-old George wished to be a Ghostbuster for the day "George’s wish made us grateful that we’re not alone. It’s given us something that he’ll take with him for the rest of his life." Jane, mum of wish child, George Three steps to magical wishesStep 1: Choose which type of gift is right for youThis could be a percentage of your estate, a set cash amount or a gift such as jewellery or property.Step 2: Get the right adviceWe’ve partnered with professional Will writers Farewill so you can get the best advice for FREE. Simply click on the button below to claim your free Will today.Claim your FREE Will today Step 3: Let us know!It’s entirely up to you whether you let us know your intentions, but if you do, it’ll be in complete privacy, and would mean we’d get to say a big thank you. You can call us on 01276 40 50 60 or email [email protected].All this information and much more is in your free guide to leaving a gift in your Will, so please simply click the link below to request yours today. There’s absolutely no obligation to include Make-A-Wish in your Will if you request a guide today - but we’d love to have the chance to show you just how much magic a legacy gift can bring.Request your FREE guide Five-year-old Sophia wished to 'have lot's of chocolate'. "Sophia had an amazing day, her wish has given her respite from having to think about the reality of her life-limiting condition. By supporting Make-A-Wish, you make so many children smile." Taz, mum of wish child, Sophia Frequently asked questions Do I really need a will? When you make a Will, you’re deciding exactly how you want your estate, and things that are precious to you, to be taken care of. If you don’t have a Will, the law will decide how to pass things on - and the people and causes you care about might not be included. Having a valid, up-to-date Will is an important way of helping your loved ones deal with your estate. It means they’ll know exactly what your intentions are and be reassured they’re carrying out your wishes. Is it expensive to make a Will? On average writing a simple Will should cost between £150 and £300, which is a small price to pay for such an important document.You may be interested to know that Make-A-Wish UK offers supporters the opportunity to have a simple Will written or updated for free. There's no obligation to include a gift to Make-A-Wish UK in your Will.Check out the 'Three steps to magical wishes' section above to request our FREE guide with more information on our free Will writing service. I already have a Will, how do I leave a gift to Make-A-Wish UK? You can do so by adding what is called a ‘codicil’, which is a legally binding amendment to your Will. We recommend you talk to your solicitor before adding a codicil. If you do, it’s a good idea to keep it in a safe place with your existing Will. How much should I give to make a difference? We're grateful for any amount we receive. Any gift will be part of helping us to be there to grant wishes for critically ill children. What type of gift can I leave? There are three types of gift: Residuary: is a percentage of the remainder of your estate once expenses like debts and taxes have been paid. For example, you could decide to leave 10% of your residue to Make-A-Wish UK. Pecuniary: is a fixed amount specified by you in your Will. For example, you could leave £3,000 to Make-A-Wish UK. Remember that inflation can affect the value of a cash gift over time. Specific: is a named item, such as a car or a piece of jewellery. What wording should I use to leave a gift to Make-A-Wish UK? I give (insert number) % share of the residue of my real or personal estate OR I give the sum of £ (insert fixed amount in numbers or words) OR I give (insert description of the specific item) to Make-A-Wish Foundation UK, Seventh Floor, Thames Tower, Station Road, Reading, RG1 1LX, registered charity numbers 295672 and SC037479 to be applied for its general charitable purposes and I declare that the receipt of the Legacy Administration Manager or other proper officer at Make-A-Wish Foundation UK for the time being shall be a sufficient discharge to my executors. What is an Executor? An Executor is the person you choose to make sure your wishes, as laid out in your Will, are adhered to. This can be a family member, friend or trusted professional. Useful resources Request your guide If you're not sure where to start, why not request a copy of our useful guide on leaving a gift in your Will? Request now How wishes help Find out more about the positive impact our wishes have on a child and their loved ones. Read more In memory gifts Making a donation in memory of a loved one is a wonderful way to remember and celebrate their life. Read more'''
year_published = 2025
