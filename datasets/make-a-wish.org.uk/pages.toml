["https://make-a-wish.org.uk/about-us/what-we-do/charity-information"]
title = "Make-A-Wish UK charity information | Make-A-Wish UK"
description = "Information about children's charity, Make-A-Wish UK, including details on how much of the money raised is spent on wishgranting and other useful facts and figures."
full_description = "Home About us What we do Where your money goes Charity Information Where your money goesOn average Make-A-Wish grants approximately 1,000 wishes per year. In the 2022/23 financial year we're on track to grant over 1,200 wishes and hoping to increase this number in future years.Inevitably, wishes do cost money though and we rely on people like you to raise the funds we need to grant those wishes. We also invest in fundraising to ensure that there is enough money available to grant the wishes of the children who will turn to us in the future.For every £1 we spend on fundraising, we generate £2.22 of income*.We also seek to generate support through offers of gifts in kind, which reduces our dependency on cash donations and will ultimately help us to increase the number of wishes we are able to grant. In 2021/22 we generated gift in kind support to the value of £1.46m*.There are many ways you can help us to raise funds.We’re committed to responsible fundraising – see our fundraising promise. Make-A-Wish Foundation® UK is a charity registered in England and Wales (295672) and Scotland (SC037479).Make-A-Wish Promotions Ltd is a subsidiary company which gifts all of its profits to Make-A-Wish Foundation UK. Please contact us if you’d like to know more about how and why we follow this approach. * Based on figures from annual accounts for the year ending 31st August 2022. Annual accounts Our annual accounts are produced at the end of our financial year to give you transparency on how the charity is reaching it's goals. Read more Fundraising promise Our promise to our supporters, to practice responsible fundraising and ensure you're well supported in your journey with us. Read more Make-A-Wish International Find out more about Make-A-Wish International, and how 38 countries are networked and have granted nearly 500,000 wishes globally. Read more"
