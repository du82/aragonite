title = "Read about the wishes that Make-A-Wish grant | Make-A-Wish UK"
description = "Read about the magical wishes we grant to desperately ill children, and find out how to help a child get a wish."
full_description = "Home Wishes Wishes Be a part of life-changing wishesHelp grant a child's wish todayA wish starts with a referral. A child diagnosed with a critical illness can be referred to Make-A-Wish by healthcare professionals, their social worker or play therapy team – that’s when their Wish Journey begins.Once we know a child is eligible for a wish, a pair of our volunteer Wish Makers arrange to visit them at home or in hospital to find out all about their favourite things, to delve into the child’s imagination and to use toys, tools and drawings to discover what their wish might be. Once their wish has been captured, a written report is sent to one of a team of Wishgranters who work with the child and their family to turn their wish into a life-changing reality that's unique to them.When possible, we work with our Make-A-Wish community to create a positive impact and touch the lives of all those involved. We’re growing that Community throughout the UK to strengthen all aspects of a family's wish experience. Wish stories Read about some of the children who are hoping to receive, or have been lucky enough to be granted their wish. Read more How wishes help As well as being respite from their illness, a wish has a long-lasting, positive impact on a child, their loved ones and the community involved in making it happen. Read more Wish eligibility Each child must meet certain criteria in order to be eligible to receive a wish. Find out more about the requirements here. Read more Apply for a wish If you know a child who would benefit from a wish, you can start the process now via our simple online application form. Read more The wish journey Find out what is involved in the journey from a child's initial referral to them receiving their wish. Read more Give a gift in kind If you have a particular skill or service that could help us to grant more life-changing wishes, we'd love to hear from you. Read more"
