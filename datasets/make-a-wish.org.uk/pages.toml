full_description = "Home Contact Us Contact Us Get in touchWhether you know a child that would benefit from a wish, you want to fundraise for Make-A-Wish UK, or would like to make a donation to help us grant life-changing wishes for more children, we'd love to hear from you. You'll find all our contact details below, so feel free to give us a call or send us a message via the following form. Telephone 01276 40 50 60 Email address [email protected] Make-A-Wish Foundation UK Seventh Floor, Thames Tower, Station Road, Reading, RG1 1LX Contact Us Contact Name: Email: Phone: Subject: Message: By submitting this form, you are agreeing to Make-A-Wish UK's terms and conditions and privacy policy. These documents explain where and how we'll use your data. Just ask if you have any questions. Submit General enquiries If you have a general enquiry and you're not sure who's the best person to speak to, please call our main number - 01276 405060 and our Supporter Experience Team will be happy to assist you. Help a child get a wish For questions on helping a child get a wish, please call our Referrals Team on 0118 304 3368, email [email protected], or you can read more online via the following link. Read more Fundraising enquiries If you'd like any help paying in money you've raised, or have questions about fundraising, please read our FAQs below, or call our Supporter Experience Team on 01276 405060. Our FAQs"
