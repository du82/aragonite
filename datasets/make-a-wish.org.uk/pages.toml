["https://make-a-wish.org.uk/donate/more-ways-to-give/give-as-you-shop"]
title = "Give to charity as you shop | Make-A-Wish UK"
description = "Find out how you can support children's charity, Make-A-Wish UK at no extra cost to you while shopping online."
full_description = "Home Donate More ways to give Give as you shop Give as you shop Help grant life-changing wishes whilst shopping online There are two easy ways you can help to grant life-changing wishes whilst shopping online with Amazon.We have an Amazon Wish List full of items we send to seriously ill children ahead of their wish to build excitement or keep them occupied on their travels. Our Amazon Wish List couldn’t be simpler to use – just browse through the items that could help make a seriously ill child’s wish come true. Make sure you select Make-A-Wish UK’s delivery address (and remember to check that you only have items from our wish list in your basket), place your order and Amazon will deliver your kind gift directly to us.View the Amazon WishlistUse AmazonSmile and donate to us at no extra cost to you.All you have to do is click here, save AmazonSmile to your favourites and do your shopping as normal. Amazon will then automatically donate a percentage of the money you spend to us – it’s that easy! Go to AmazonSmile We're now working with the free online fundraising platform Savoo to raise vital funds for life-changing wishes.When you use their discount codes and deals to save money on your favourite things, they’ll donate to us on your behalf at no extra cost to you.You search, you save, they donateHere's how you can help:Use Savoo's Microsoft Bing-powered search engine and they'll donate 1p to Make-A-Wish UK for every search you make.Shop online with Savoo's voucher codes and deals to save money and raise funds for Make-A-Wish at no extra cost to you. To get started, visit the Savoo website, simply register for an account and select Make-A-Wish UK as your chosen charity."
