["https://make-a-wish.org.uk/about-us/what-we-do/governance-and-leadership"]
title = "Make-A-Wish governance and leadership information | Make-A-Wish UK"
description = "Read about how the charity is governed, our trustees, senior management team and how decisions are made."
full_description = "Home About us What we do Governance & leadership Governance and leadership As an organisation, Make-A-Wish UK is made up of paid members of staff and volunteers who kindly give their time. Like all charities, we are led by a Chair and Board of Trustees (non-executive directors). They are also volunteers who work together to provide strategic direction and guidance to the charity, and ensure the charity is fulfilling its mission. How the Board works is set out in this Governance Handbook. Governance Handbook (PDF) Meet the Trustees Lin Hinnigan Lin took over from the previous Chair of Make-A-Wish, Per Harkjaer, in July 2020. Helen Spice Helen became a Trustee of Make-A-Wish UK in 2019. Sir Craig Oliver Sir Craig became a Trustee of Make-A-Wish UK in 2018. George Gabriel George became a Trustee of Make-A-Wish UK in 2022. Nina Saffuri Nina became a Trustee of Make-A-Wish UK in 2022. Usman Chaudry Usman became a Trustee of Make-A-Wish UK in 2022. Nik Pratap Nik became a Trustee of Make-A-Wish UK in 2024. Sarah Keeble Sarah became a Trustee of Make-A-Wish UK in 2024. Emma Johnson Emma became a Trustee of Make-A-Wish UK in 2024. Meet the Senior Leadership Team The day-to-day operation of Make-A-Wish is led by a team of three directors who have strategic and functional responsibilities. They are led by a Chief Executive, who reports to the Chair of the Board of Trustees.At Make-A-Wish we're committed to ensuring full accountability and transparency, not least when it comes to pay transparency. The Board of Trustees is responsible for setting pay of senior leadership within the charity and this is informed by independent benchmarking. In the financial year 2023-2024 the salary set for our Chief Executive role, held by Jason Suckley, is £112,500, and the Director's salaries range from £85,000 - £92,000. Senior leadership team Jason Suckley Chief Executive [email protected] Read More Jamie Dormandy Director of Operations [email protected] Read More Stephanie Witt Director of Income & Engagement [email protected] Read More"
