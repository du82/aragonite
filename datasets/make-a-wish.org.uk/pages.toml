["https://make-a-wish.org.uk/news/will-you-grant-a-childs-wish-this-christmas"]
title = "Will you help grant a child's wish this Christmas? | Make-A-Wish UK"
description = "This Christmas, we estimate around 1,000 children will be diagnosed with a life- changing illness that makes them eligible for a wish."
full_description = '''Home News & Stories Will you grant a child’s … Will you grant a child’s wish this Christmas? Make-A-Wish UK has today launched a new fundraising campaign themed around granting a child’s wish, to help us raise funds and grant more life-changing wishes to critically ill children, sooner.This Christmas, we estimate around 1,000 children will be diagnosed with a life- changing illness that makes them eligible for a wish.They have already endured so much – from endless hospital visits, grueling treatments and uncertainty from week to week. We are working tirelessly granting their wishes, but demand is continuing to outpace our best efforts to keep up. This means it’s taking longer than ever to grant once-in-a-lifetime wishes. We can’t keep asking families to wait for a wish that could bring joy, healing, and strength during their toughest times, because there is no time to wait. When it comes to the dreams of children battling critical illness, they deserve to wish for more than a life defined by their illness. This Christmas, too many children are waiting for their wish. It’s more urgent than ever to act now. Help us grant a child’s wish this Christmas by donating to Make-A-Wish. Even a small amount really can make the difference to a child’s wish being granted.Through this campaign we’ll shine the spotlight on wish parents, who will share how the wish their child was granted gave them some comfort in their passing. We’ll hear the joy and happiness it gave their child, giving them a chance to dream big no matter how long they had left to live, as well as the profound and lasting impact this has had on the memories they hold close to their hearts. Hear Maria talk to other wish parents about her daughter Ellie, who’s wish was to have a Christmas wonderland at home. Ellie sadly died a month after her wish was granted. In the UK, one child every hour is diagnosed with a critical illness that makes them eligible for a wish.This Christmas, we estimate around 1,000 children will be diagnosed with a life- changing illness that makes them eligible for a wish – we need your support now more than ever to grant their wishes sooner. Will you help grant a child's wish this Christmas? The one wish we can't grant is time But, together, we can make a child's wish come true this Christmas. Read more "I wish to have a Christmas wonderland at home" Ellie's last wish Read more Share Maria’s story on your networks using #LastWish The more people that see it, the more children you can help. Share today'''
year_published = 2025
