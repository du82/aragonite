["https://make-a-wish.org.uk/about-us/what-we-do"]
title = "What we do | Make-A-Wish | Make-A-Wish UK"
description = "We exist for one reason – to grant magical wishes to enrich the lives of children and young people fighting life-threatening conditions. Find out more here."
full_description = "Home About us What we do What we do Our challengeRight now over 134,000 children in the UK are eligible for a wish because they are dealing with the grueling daily reality of life with a critical illness. When it comes to their dreams, they deserve to wish for more than a life defined by their illness. We are granting a record number of wishes yet we face an urgent challenge. The demand for wishes is far outpacing our best efforts to keep up, so it’s taking longer than ever to grant once-in-a-lifetime wishes. But the heartbreaking reality is that many families simply can’t wait this long. We can’t keep asking families to wait for a wish that could bring joy, healing, and strength during their toughest times because for children who don't have long to live, there is no time to wait. When it comes to the dreams of children battling critical illness, they deserve to wish for more than a life defined by their illness. Wishes have the power to rescue the magic of childhood and provide a much-needed escape from the gruelling daily reality of a life defined by ongoing treatments, endless hospital stays and their critical illness.The one wish we can’t guarantee is more time, but only with your support, can we ensure their life isn’t defined by illness.Our impact Our research is building our understanding of the impact of a wish, so we can continually help children and their loved ones to gain the most out of their experience.We’ve learnt that when a wish is granted, it inspires a child to believe that anything is possible and it helps to restore some of the childhood that they missed out on because treatment for their condition interrupted school or typical family activities. A wish broadens horizons and is something to look forward to during tough times. More than that, a wish provides respite and distraction, helps family bonding and wellbeing, inclusion and social engagement.Wishes have the power to rescue the magic of childhood and provide an invaluable lifeline to escape the relentless challenges and grueling reality of a life defined by their illness. A wish can give them the chance to dream big even when they might not have long to live.Our community Wishes take time and money to organise. They require creativity, passion and commitment. Our networks and communities – health and social care professionals, volunteers, partners, fundraisers, supporters, wish families – are key to making children's wishes become a reality. We’re led by the child and their experience, seeking to understand what’s unique about them, so we can craft an experience that will excite and engage them. ​ Our wishes Everything about the Make-A-Wish experience is about the child and the impact a wish will have on their life. We’re unique in putting the child at the heart of their own experience. But we know that involving a child’s family in the unique way that we do, delivers a big impact. Our leading reputation – built on a global partnership of wishgranting best practice – is vital to our ability to reach children, inspire others and build relationships. What we doTogether, we create joy, happiness and magical memories through life-changing wishes for children with critical illnesses.Whether it's starring in their own films, feeding tigers, meeting a celebrity hero, or having a bedroom redesigned just so; our wishes are varied, personal and life-changing. We go above and beyond to grant amazing wishes to amazing children when they need it most. Because a child's life shouldn't be about illness, hospitals and diagnosis - it should be about wonder, joy and hope.We've seen first-hand how a wish can provide respite from the daily struggles that come with a critical condition and that is the driving force behind why we continue to do what we do.But we can't make these life-changing experiences happen without the generosity of people like you. Thank you. Find out more See how you can help From holding your own fundraiser, to taking part in a challenge, volunteering or simply donating - there are lots of ways you can help. Get involved Where your money goes Find out more about how your fundraising grants life-changing wishes and how we couldn't do it without our amazing volunteers. Read more Make-A-Wish International Find out more about Make-A-Wish International, and how 38 countries are networked and have granted nearly 500,000 wishes globally. Read more"
year_published = 2025
clearnet = "https://make-a-wish.org.uk/about-us/what-we-do"
