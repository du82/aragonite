title = "Payroll giving - donate to charity from your salary | Make-A-Wish UK"
description = "Payroll giving is an easy and convenient way for you to make a donation directly from your salary to help grant life-changing wishes to children with critical illnesses."
full_description = "Home Donate More ways to give Payroll giving Payroll giving Payroll Giving is an easy and convenient way for you to make a donation directly from your salary to help grant life-changing wishes to children with critical illnesses, like Danny who wished to be a King for the day. Sign up to Payroll GivingThrough Payroll Giving, donations are taken from your salary before tax, so each pound you donate will cost you less. You Donate… It costs a standard rate tax payer (20%)It costs a higher rate tax payer (40%)£5£4£3£10£8£6£15£12£9What are the benefits?It’s simple: Sign up using one simple form. Donor privacy: We don't ask for your bank details as the donation will come straight out of your salary. Control: You can stop or change your donation at any time by contacting your payroll team. Pay less to give more: It’s the only way to give that allows full tax relief on donations.Sign up to Payroll GivingWhy employers love Payroll Giving? Low cost to set up and maintain – potential to offset set up costs against tax One simple payment every pay run Engages employees in Charity of the Year partnerships Demonstrates community involvement Quality Marks and Excellence Awards Boost to staff morale Why employees love Payroll Giving? It’s tax-efficient so costs less to donate Can support more than one charity Flexibility – their gift can be stopped or changed at any time Quick, easy and convenient way to give No bank details required Through Payroll Giving you'll be helping grant more wishes like Danny’s. If you'd like more information about signing up to Payroll Giving, please call 01276 405060 or email [email protected]."
