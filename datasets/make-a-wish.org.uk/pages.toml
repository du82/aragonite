["https://make-a-wish.org.uk/wishes/apply-for-a-wish"]
title = "How to apply for a wish with Make-A-Wish UK | Make-A-Wish UK"
description = "Find out more about the application process, or apply for a child to receive a wish through children's charity Make-A-Wish UK."
full_description = "Home Wishes Apply for a wish Apply for a wish Do you know a child fighting a critical illness, who could benefit from a life-changing wish? As part of our commitment to continually improve and enhance our wish-granting capabilities, we've implemented a new referral model, and are now accepting referrals through our Community Referral Partners. This change in approach is a strategic decision aimed at reshaping our referral pathways to better serve the needs of eligible children. We're focusing on building and strengthening partnerships within communities across the UK to ensure that we can reach even more children year upon year.We'll continue to receive referrals for children who are in urgent need to have a wish granted. If a child’s prognosis is less than 12 months, then a referral can be submitted via our online application form. Wish children can be referred via their health, social care, or educational teams. For more information on our new model, and opportunities to become a Community Referral Partner please contact [email protected] See our eligibility criteria Refer a child What is a wish? Our wishes give critically ill children the chance to do something extraordinary. For many children, it's an opportunity to choose something just for them – a once-in-a-lifetime experience. Every wish is as unique as the child who created it. Our Wish Makers, who are a team of specially-trained volunteers, speak to the child and spend time with them to find out what matters most to them in the world, and what matters most to them about their wish. Leila wished to visit Battersea Dogs & Cats Home We’re keen to get the wish discovery experience right, because a child’s wish is a precious gift that helps build lasting memories, confidence and resilience. Tough times lead a child to be eligible for a wish, and families often suffer as a result of a child being critically ill, which is why it's important for us to include them in a child’s wish too, wherever possible. Wishes are often around four key themes I wish to meet... To meet someone special or important like a hero, celebrity or influencer. I wish to be... To be someone or something – such as a superhero, princess or a character. I wish to go... To go somewhere and spend time doing something special. I wish to have... To own something special or particular like a toy. Whatever the child’s wish, we make the experience a truly individual and memorable one.Read about some of the wishes we have granted Allan wished to be a police officer How do I refer a child? We've recently changed the way in which we're accepting referrals and are now working with Community Referral Partners. This change in approach is a strategic decision aimed at reshaping our referral pathways to better serve the needs of eligible children. We're focusing on building and strengthening partnerships within communities across the UK to ensure that we can reach even more children year upon year. Our Community Referral Partners will be able to refer children for specific wish experiences across the year, and we will work closely with our partners to notify them as to when they can refer. We continue to remain open to receive referrals for children who are in urgent need to have a wish granted. If a child’s prognosis is less than 12 months, then a referral can be submitted via our online application form.Wish children can be referred via their health, social care, or educational teams. For more information on our new model, and opportunities to become a Community Referral Partner please contact [email protected] Dewi wished to have a Nürburgring racing experience What happens next? If the child is eligible for a wish, we'll call the family asking for further information about the child. We'll then arrange for our Wish Makers to speak with the child to explore wish ideas with them. Please note, there are restrictions on some kinds of wishes. If your wish falls into a category with restrictions, we’ll explain these to you so you can understand why. Read more about the wish journey"
year_published = 2025
clearnet = "https://make-a-wish.org.uk/wishes/apply-for-a-wish"
