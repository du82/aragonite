["https://make-a-wish.org.uk/get-involved/volunteer"]
title = "Volunteer for Make-A-Wish UK | Make-A-Wish UK"
description = "There are few experiences more powerful than helping to make a child's wish come true, and through your volunteering journey with Make-A-Wish UK, you get the unique opportunity to do just that."
full_description = "Home Get involved Volunteer Volunteer for Make-A-Wish UK Volunteer for Make-A-Wish Your time grants wishesEvery child deserves to wish for more than a life defined by illness, and they need your time to help make their wishes come true. Even just 30 minutes a week of your time will have a profound impact on our ability to grant wishes sooner. It means that children who may not have long left to live will have the opportunity to make memories that the family can cherish forever, before it’s too late.From the moment that you sign up to donate your time to us as a Wish Maker, we take you on an engaging learning and development journey through our mobile volunteering app, allowing you to develop new skills and connect with volunteers across the UK. Most importantly, we connect you to the children near you that are waiting right now for their wishes to be granted, and empower and enable you to help us deliver every part of their Wish Journey. Your time can grant wishes. Ready to volunteer? Here’s how in three simple steps: How do I volunteer? Find a role Browse available volunteering opportunities in your area by entering your postcode or town. The role descriptions include details such as how much time or what particular skills may be required and what you’ll be doing. Search Apply It’s quick and easy to apply for a role once you have found one that suits you. If we think you're a good match, we will invite you to meet for an informal online chat to get to know you better. Get training and support Once you have been selected for a role, you’ll receive our Volunteer Handbook and have an inspiring induction made up of self-led online training modules that fit around your time, and live online sessions where you’ll meet the Make-A-Wish UK team. If you have any questions, we're here to help. Give us a call on 0118 304 2777, or email [email protected]. Useful resources Meet our volunteers Find out what it’s like to volunteer with us from some of our current volunteers. Read more Volunteering FAQs The answers to our most frequently asked questions about volunteering Read more"
