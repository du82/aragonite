["https://make-a-wish.org.uk/about-us/policy-and-procedures/privacy-policy"]
title = "Privacy policy | Make-A-Wish UK"
description = "Make-A-Wish UK is committed to safeguarding your privacy online. Read full details of our online Privacy Policy."
full_description = "Home About us Policy and procedures Privacy policy Privacy policy Make-A-Wish Foundation® UK relies on the generosity and support of people like you. We value transparency and want you to be really clear about why we ask you for personal information when you support us or volunteer with us, and want to be honest about how we will use it.Knowing more about you and why you support us helps us to make decisions that are right for our supporters, right for the children and families that we work with, and help us communicate more effectively. Ultimately, it helps us to achieve our goal of granting a wish for every eligible child. We’re also committed to protecting your information and using it responsibly. This policy tells you how we collect, use and store your information. The processing of your information is carried out by or on behalf of Make-A-Wish Foundation UK and Make-A-Wish UK Promotions Ltd. Make-A-Wish® UK is a registered charity in England & Wales (295672) and Scotland (SC037479). Make-A-Wish Promotions Ltd is a registered company (04015443).Contacting us:If you have any questions about this privacy policy and how we use your information you can contact us by writing to us at:Supporter CareMake-A-Wish Foundation UK, Seventh Floor, Thames TowerStation ApproachReadingRG1 1LX You can also get in touch by emailing us at [email protected].1 - Why we use your informationWe will only use your information where we have a legal basis and will always respect your rights.Where we use your information, it may be because you have consented to us doing so or because we consider we have a legitimate interest to do so. Where we do rely on a legitimate interest to use your information, we will always ensure that this is done in a way that is not intrusive or does not cause distress. We may also use your information because we have a legal obligation to do so or because we need to fulfil a contractual obligation. Some examples of what we mean by this include: You have given us your consent to use the information for a specified purpose, such as sending you marketing emails.We have a legal obligation to use your information, for example to claim Gift Aid.We need to use your information to fulfil a contract with you – such as providing an auction prize. We are using your information in pursuit of a legitimate interest, for example writing to you to tell you about our wishes and ask for your support in helping us grant wishes.Other reasons include:To pursue our charitable purpose to deliver our mission and visionTo raise vital funds for our workTo ensure we meet our regulatory requirements as a charityTo manage our ongoing relationship with our supporters and anyone we work withTo manage our financial transactions and prevent fraud2 - How we use your information 2.1 To respond to any requests, complaints or queries you make to usIf you contact us directly, we will use the information you give to us to handle your enquiry or request. This may include responding to your query or feedback, or sending you relevant information or fundraising materials. We may also keep a record of conversations we have with you, feedback you provide and any marketing materials we send out to you. This can help us to handle queries more efficiently. 2.2 To process any donations you make, claim any relevant Gift Aid and maintain a record of your past or potential future financial contributionsThis includes keeping a record of any pledges, gift agreements or any other indications that you are planning to donate to Make-A-Wish UK. We keep a record of any donations we receive for audit purposes, and as we are legally required to keep information related to Gift Aid. We may need to use your information to prevent fraud. We may also use your information to administer any lotteries or auctions you participate in, for example, contacting you to let you know you have won a prize.2.3 To provide you with information and support for any events, fundraising and campaigning activities or volunteering opportunities you sign up toRegistering or enquiring about an event, activity or campaignIf you have completed a form to register or enquire about an event or activity, or to sign up to one of our campaigns plus given us consent to contact you, we will consider this as a request to send you details about the event, activity or campaign. Volunteering with usWhen you take part in one of our volunteering roles, or sign up to support one of our sponsorship or regular giving programmes, we will use your details to contact you in relation to your role or activity and to provide you with information on the progress of that project. Supporting you in your charitable roleWhere you provide contact details, we will provide information and support by post, phone, mobile messaging, email, via social media, and any other channels for which you have given consent. When you have asked for details of an event, we will send you information including, where relevant, ideas for fundraising and reminders on key information about the activity. You can change your contact preferences at any time by getting in touch with us at [email protected].Where appropriate, we will use the information you provide to identify any help we can offer, specific to the activity you have signed up for and to provide necessary information to event organisers. Where this includes information about sensitive topics such as your health, we will only use this information if you have given us explicit consent to do so.We may also receive information through event organisers or through third party websites (for example JustGiving) so we know you are fundraising for us. 2.4 To manage our recruitmentWhen applying for a staff or voluntary role with Make-A-Wish UK online, through a third party portal or through a recruitment agency, the personal data you provide as part of the recruitment process will only be held and processed for the purpose of the selection processes of Make-A-Wish UK, and in connection with any subsequent employment unless otherwise indicated. By submitting your personal information, you will be asked to give your consent for us to hold and use the data for the purposes being consented to. You will be asked to provide certain information including your name, contact details, employment history and qualifications. This information is mandatory so we can fairly consider your application, communicate with you about your application and where successful, follow up with references or meet our statutory and internal monitoring and reporting responsibilities.We may also view social media profiles such as LinkedIn, Facebook and Twitter, to the extent that it is relevant to your application or candidate selection. Unsuccessful applicant data will be held confidentially within the recruitment system for up to six months before it is deleted. This means you can use your information in any future applications and we can respond to statutory reporting requests. 3 - How we use your information and tell you about our work3.1 To send you marketing communications by email, mobile messaging, or direct message on social media, where you have agreed to receive thisWhere you have provided an email address, mobile phone number, or details of your social media profiles and consented to being contacted in this way, we will send you information by those channels – including by direct message through social media – covering ways to give or raise money for us, campaign for us, to volunteer for us, updates on wishes and other areas of our work. This may include promoting the work of partner organisations that we believe will benefit us and our charitable cause. We never give your information to partner organisations and third parties without your prior consent.3.2 To contact you by phone and post Where it is appropriate and relevant, and you have provided us with a telephone number or a postal address, we will occasionally call or write to you to tell you about ways to give or raise money for us, to volunteer for us, the wishes we are granting and our wider work. We do this as we consider it as a legitimate interest to promote our charitable cause and communicate with you about ways you can support us. We will not contact you by phone for marketing purposes if your number is registered with the Telephone Preference Service, unless you have agreed to receive calls from us. We will not contact you by mail if you have registered your address with the Mailing Preference Service. 3.3 To manage your contact preferencesYou can tell us to stop contacting you, or change the way in which we do so, by getting in touch with us using the details in the Get in touch section or emailing [email protected]. We will keep a record of any requests to stop receiving marketing and fundraising information from us to ensure that we do not communicate with you in the future, unless you tell us you want to hear from us again. 3.4 To help us speak to you in a way that is relevant to you, and to understand our supporters more broadlyWe try to ensure that our communications are as effective as possible. This means communicating with people in different ways, appropriate to them.On occasion, we will use information you have given us, for example the record of your previous donations to us and the type of activity you have been involved with, to tailor our communications with you about future activities. We will also use information about how you use our website or interact with our emails so we can make them more effective.In certain circumstances we will use information about you from publicly available sources - such as online registries, websites, media or social media, or personal introductions - in order to understand more about your interests and preferences so that we can better tailor our communications – telling you about the things you are likely to be interested in or letting you know of ways to fundraise with us which are relevant to you. We may do this by looking at your career information, peer networks, demographic information, hobbies and interests or other information. We will also use broad demographic information such as statistics and analysis from third parties to better understand how our own supporter base compares to the general population. This helps us to decide who to send our communications to and is useful to ensure the communications you receive are relevant to you.We will analyse anonymised data from our database so that we can understand our supporters. For example, we may use tools like Mosaic which gives us broad demographic and behavioural data at postcode level. Insights like this help us understand supporters, create segments and categorise our supporters so they get a better experience. Some of our supporters may choose to give us some higher donations. We use in-house research, and where relevant, work with third party agencies (such as Experian) to help us identify people who may be able to support us with a higher gift. We use information you have given us, and from publicly available records such as the electoral roll, land records, ‘rich lists’, Who’s Who and Companies House records, as well as social media profiles. We may also collect information on your interests or articles about you from newspapers and magazines. We use this information to tailor our communication with you and invite potential supporters to meetings, groups and events which may be of interest to them.If you would prefer we didn’t use your information in this way, then you have the right to tell us to stop and can do so by getting in touch with us using the details in the Get in touch section or emailing [email protected].3.5 To target our digital and social media marketing and website activityIf you visit our website, we log the IP address of the computer you are using in order to protect our servers against abuse and malicious activity. The logs are deleted every 30 days. Other information is used to measure the performance of our website, how many visitors (traffic) we receive, how users move around the site (we also use third party sites like Hotjar to help with this). When you access our website, some cookies are saved to your computer, for example if you have chosen a particular landing setting or created a user account. You can also turn off your cookies so that we can’t access this information. For more information, please read our Cookies Policy here.We may also use the information you provide us with to target our digital and social media advertising effectively. This could include securely providing contact details such as your name and email address to digital advertising networks or social media companies, including but not limited to Facebook, Google and Twitter. For example, we may use your information to enable us to display adverts to you, or to find potential supporters who have similar characteristics to you.Any information we share with social media companies will be shared in an encrypted format and will not be used for their own purposes. You can stop your information being used for this by contacting us at [email protected]. Where you have asked us not to use your information for targeted digital advertising, you may still see adverts related to Make-A-Wish UK. This is because the social media site or advertising network may select you based on information they hold, such as your age and location, or websites you have visited, without using information that has been provided by us. You can control the kind of advertising which you see through the settings in the relevant social media site. You can also control other advertising messages by changing your browser settings, and opting out via networks such as Digital Advertising Alliance .You can control the cookies that your computer and other devices use too – find out more about cookies here. Please also see our Cookies Policy. 3.6 Use of any images, videos of, or other information you tell us about something you have done for Make-A-Wish UK.If you share information about the fundraising or campaigning activities you have done for us, or your personal experiences, by post, email or over social media, we may want to use this to help us promote our events and activities in the future. If you are participating in an event with us, we’ll ask if you are happy to be included in our pictures – please tell us if you are not. In other cases, we will obtain the necessary permission to use this information or share this via social media – if you have already posted information yourself via social media about your engagement with us, we may repost your information. 3.7 To undertake our wider work We maintain a record of information relating to areas of our wider work in wishgranting. This could include examples of offers you have made to donate items for a child’s wish, donations of time or money via a company or partner, or offers to provide us with discounts and other offers f"
