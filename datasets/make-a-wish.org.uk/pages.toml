title = "Website accessibility | Make-A-Wish UK"
description = "We’ve designed a website that everyone should be able to use regardless of their ability or disability. We’ve followed W3C guidance and always aim to meet their best practice standards."
full_description = "Home Website accessibility Website accessibility Make-A-Wish UK website accessibility policyWe take accessibility seriously and strive to conform to Level AA of the W3C Web Content Accessibility Guidelines 2.1.Some of the things we do to make our website accessible include:A website design that adapts to different screen sizesAiming to maintain a good contrast between text and background coloursUsing alt tags on images where appropriate, and striving to make these descriptions as informative as possibleUsing well-structured HTMLGracefully degrading the website where users choose not to use certain technologies (such as Javascript), where possibleUsing a writing style that is clear and understandableTesting our website in modern web browsers across a range of devicesThe current WCAG guidelines can be found below.View latest WCAG Guidelines We value your feedback. If you'd like to get in touch with any comments or suggestions as to how we can improve our website, please email [email protected] or call 01276 40 50 60."
