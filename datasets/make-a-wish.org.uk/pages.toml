["https://make-a-wish.org.uk/about-us/policy-and-procedures"]
title = "Make-A-Wish UK policy and procedures | Make-A-Wish UK"
description = "We’re a charity that takes our responsibilities and obligations seriously. This section shares some of our key policies with you."
full_description = "Home About us Policy and procedures Policy and procedures We’re a charity that takes our responsibilities and obligations seriously. We’re committed to transparency. We are guided by our vision, mission and values. We try not to be too “policy” heavy and take a positive proactive approach to how we can achieve impactful change, but there are a few things which need a clear policy approach to guide us in how we act and behave. Foremost in these is the protection of the children we are here to support, and their families. Our child safeguarding policy and wish family privacy policy. We’re also committed to responsible fundraising (FR promise) and looking after our supporters (Privacy policy). This section shares some of our key policies with you. If you have any questions about our approach, please do just get in touch. We’re happy to answer your questions. Child safeguarding Our Safeguarding Policy, Procedures and Code of Conduct. Read more Wish families privacy policy How we collect, use and store your information while we are granting your child’s wish. Read more Privacy policy Your data is important to us, find out how your data and personal information is managed by us. Read more Our fundraising promise We commit to our fundraising being legal, open, honest and respectful. Read more Complaints policy Find out more on our Complaints policy. Read more Charity information We're a registered charity, find out more about us and our Board of Trustees. Read more Join our community"
