description = "Do you want to get fit, push yourself to try something new, or simply have fun with like-minded people? Take on a fundraising challenge and do something amazing!"
full_description = '''Home Get involved Fundraising events and challenges Fundraising events and challenges Do you want to get fit, push yourself to try something new, or simply have fun with like-minded people? Take on a fundraising challenge (or plan your own) and do something amazing!By getting involved in a charity event for Make-A-Wish, you'll be raising vital funds to grant wishes for children with critical illnesses, bringing light and joy to wish children and their loved ones at the darkest of times. Fundraising events Whether you're looking to run, walk or cycle, take a look at our events calendar to find upcoming charity events near you. Find events Fundraising challenges From adrenaline-fuelled skydives to breath-taking coastal walks, find a challenge that offers something a little different to the norm. Find challenges Make-A-Wish special events Our special events are always the talk of the town, from art auctions to exclusive social gatherings set against stunning backdrops. Special events Looking for a smaller event to get involved in? Find your perfect event on our local fundraising events page. "Every child should have a childhood. Make-A-Wish deal with a lot of families that don't get that experience where a child has a critically illness, so the work they do to make those lasting memories is priceless. And let's be honest, running a marathon is nothing compared to the joy it will bring to a family and a wish child." John, #WishHero Plan your own challenge Thinking about taking on your own fundraising challenge but need some help? You're in the right place!We have lots of ideas and inspiration to help you get started. Tell us about your ideas and our dedicated Fundraising team will be in touch to support you along the way.Plan your challenge 3rd party event participant terms and conditionsFollow the link below to read important information that applies if you're considering taking part in a 3rd party charity event in support of Make-A-Wish.Read the T&Cs'''
