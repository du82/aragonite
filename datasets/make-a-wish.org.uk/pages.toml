["https://make-a-wish.org.uk/get-involved/fundraise-in-your-community/get-more-from-your-event"]
title = "Get more from your fundraising event | Make-A-Wish UK"
description = "Hints and tips to make the most of your charity fundraising event or challenge, from how to share your event to ways you can boost your fundraising."
full_description = "Home Get involved Fundraise in your community Get more from your event Get more from your event There are lots of ways you can get more from your event and maximise your fundraising. Below we have outlined some tips and tricks to boost your efforts. From asking your company to match your donations to claiming Gift Aid on every single pound, it all adds up and makes a big difference. Register your fundraising Organising your own event for Make-A-Wish? Whether it’s a bake sale or bungee jump, we’d love to hear about it - just register here. Register now Share your story A great way to raise awareness of Make-A-Wish and your event is to share your story in the community via social media or even in the local press. Share with us Gift Aid Adding Gift Aid to a donation can maximise your fundraising. If you are a UK tax payer, you may be eligible to claim an additional 25p for every pound you donate. Read more Matched giving Just imagine – doubling your money for no extra effort! Why not ask your workplace if they offer a matched funding scheme to boost your fundraising? Read more Online fundraising page Have you thought about creating an online fundraising page? This is a great way to reach people who can’t make it to your event or simply want to support your efforts. Create a page Keep it safe and legal We don’t want anything to stand in the way of your event being a huge success. Have a look through some of the practical things to consider prior to fundraising. Read more FAQs Hopefully you’ve found everything you need to make your event a roaring success. Here are some frequently asked questions that may help you. Read more Fundraising materials As well as our resource hub where you can download free materials such as posters and sponsorship forms, we also have collection buckets, balloons and much more to help brand your event. Read more If you don't feel you're ready to put on your own fundraising event or challenge just yet, why not simply to make a donation and help us to continue granting life-changing wishes to children with critical illnesses. To find out about the positive impact your support can have on wish children and their families, read more about how wishes help.Still got a question, need some additional materials or a bit of help setting up your online giving page? Get in touch with our Supporter Experience Team on 01276 405060 or email [email protected]."
