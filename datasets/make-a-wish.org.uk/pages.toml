["https://make-a-wish.org.uk/donate/give-in-memory"]
title = "Give a gift in memory of a loved one | Make-A-Wish UK"
description = "Make a donation in memory of a loved one to children's charity Make-A-Wish UK and help us to grant more life-changing wishes for truly deserving children."
full_description = '''Home Donate Give in memory Give in memory Losing someone you love is never easy. But setting up an online donation page will enable friends and families to leave tributes and share stories as well as donating to help other families create precious memories of their own.Making a donation in memory of a loved one is a wonderful way to remember and celebrate their life. We know these gifts have extra meaning and we’re always grateful to receive them.Thanks to kind people like you, we can continue granting life-changing wishes to children and young people with critical illnesses, like Hayden who has a rare genetic condition and whose wish was to have a spa pool. How to donate in memory Set up an In Memory fundraising pageSet up an In Memory fundraising page through JustGiving to create a lasting tribute online.Set up a fundraising page Collect donations on the dayIf you're holding a memorial service, you could ask for donations to Make-A-Wish on the day of the service.How to pay in your fundraising Make a one-off or regular donationTo mark a significant occasion, why not make a one-off or regular donation in memory.Donate in memory "When he’s in water he’s like a different boy, so relaxed and calm. So it’s lovely seeing him in the spa pool - he’s completely at peace." Beth, Hayden's mum If you have any questions please contact [email protected]. Read our wish stories Read more about some of the life-changing wishes we have granted with the help of our supporters. Read more Leave a gift in your will Did you know you could leave as little as 1% to Make-A-Wish UK and make a huge difference? Read more'''
