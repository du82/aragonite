["https://make-a-wish.org.uk/donate/more-ways-to-give/donate-goods-or-services"]
title = "Donate a skill or service to help us grant wishes | Make-A-Wish UK"
description = "Learn how you can donate a service or skill that will help us grant more life-changing wishes for children with critical illnesses."
full_description = "Home Donate More ways to give Donate goods or services Donate a gift in kindYou can help us grant magical wishes for critically ill children by donating your goods, skills and services!Donate a gift Wish list What are gifts in kind?Gifts in kind can range from a holiday home, allowing families to spend quality time together – something that was taken away from them during ill health, a gift card for a shopping spree of child’s dreams, to photography skills to capture the essence of a wish forever. They are so much more than just donations of goods, services, skills, and experiences; they carry magic of hope and joy that brightens children and families’ lives in their darkest times. We simply couldn’t grant life-changing wishes without the support and generosity of people like you! Whether you can offer a ride in a limo or make a mermaid tail, we want to hear from you! How to donate a gift in kind Simply follow the steps below and let our team take care of finding the perfect home for your offer. Please note, our wishes are just as unique as our wish children and in some cases, it may take some time for your donation to be used. View our wish list for ideas and items we require for our upcoming wishes. Or donate a gift in kind if you already know what you'd like to offer us. View wish list Submit your offer along with any required documents. Check out our GIK Guide to find out more about the type of documentation we may require. View our guide Sit back and let our team contact you, and then wait for your offer to help create a magical experience for a critically ill child. Your gift could help more children like AmberAmber's wish to have a festival allowed her to have a day that was all about her, rather than her brain tumour. Below, you can watch a video of how Amber’s vision came to life thanks to donations of gifts in kind from people like you. With your support we can bring joy and happiness to children who need it the most. The donations included services such as designing and printing t-shirts and leaflets, a silent disco, children’s entertainment, catering, as well as photography and videography skills. Quick links... View the wish list Browse the list of goods and services we're currently trying to source for upcoming wishes. View wish list Our gift in kind guide Find out more about what a gift in kind is and how your gifts can help wishes become a reality for critically ill children. View our guide FAQs Find answers to any questions you may have about donating a gift in kind in our frequently asked questions. FAQs"
year_published = 2025
