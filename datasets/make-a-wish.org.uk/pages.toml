description = "After three years of treatment for acute lymphoblastic leukaemia, Jacob is now in remission and he wished to go to an aeroplane factory and have an aircraft experience."
full_description = '''Home Get involved Corporate partnerships Corporate partnerships How can we work together?We receive no government funding so we rely on partnerships to keep delivering life-changing wishes to children with critical illnesses. Charity of the year Brilliant charity of the year programmes increase employee engagement, create opportunities for cross-team working and have a lasting impact on the charities they support. Read more Product promotion Working together to create an effective campaign, charity product promotions can boost sales and reach your target market in an engaging way – all whilst raising funds to grant wishes. Read more Brand partnership Building a brand partnership with one of the most trusted charities in the UK could have major benefits – opening up new audiences, creating engaging content and increasing profile. Read more Work for Good If you run or work for a small business, Work for Good make it super easy for your small business to donate to Make-A-Wish UK through the sale of your products and services. Read more Supporting wishesCan you help make wishes come true? Each wish we grant is as unique as the child themselves, which is why we’re always looking for partners who can help us deliver wishes that are truly magical and impactful.Read below about how our corporate partners, Easyjet and Airbus, pulled out all the stops to give wish child, Jacob the experience of a lifetime. Please take a second to share Jacob's wish Jacob's wish 7 years old Tadley "I wish to go to an aeroplane factory" After three years of treatment for acute lymphoblastic leukaemia, Jacob is now in remission and he wished to go to an aeroplane factory and have an aircraft experience. Read about Jacob's wish Our partnersClick on the logos below to read more about our partnerships'''
