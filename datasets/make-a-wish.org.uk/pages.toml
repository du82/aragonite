["https://make-a-wish.org.uk/donate/be-a-wishgranter"]
title = "Be a Wishgranter and help change lives | Make-A-Wish UK"
description = "Your monthly gift could give a child like Joseph an escape from pain, and the chance to have fun as a family again."
full_description = "Home Donate Be a Wishgranter Be a Wishgranter Will you donate £5 a month to give a child like Joseph an escape from pain, and the chance to have fun as a family again? Donate £5 Per month Donate £15 Per month Donate £25 Per month Donate Per month £ Set up your monthly donation In April 2016, aged six, Joseph was diagnosed with a brain tumour. Within a week, he was having life-saving brain surgery. Joseph battled through 30 doses of radiotherapy to the brain and spine and eight rounds of chemotherapy, living in hospital for five months before he eventually got to ‘ring the bell’ to signify the end of his treatment at Easter 2017.To continue his rehabilitation, doctors suggested Joseph should apply to Make-A-Wish UK and in April 2018 his wish to drive construction vehicles came true.Joseph’s epic crane drive is just one example of the experiences you help us conjure up thanks to your monthly gift. Whether it's being a vet, walking with dinosaurs, going on an amazing holiday, meeting a celebrity hero, or having a bedroom makeover, every wish is different – but always personal and life-changing.Together, we can help more children like Joseph experience the magic of a wish. Become a wishgranter today.Be a wishgranter “This has helped to balance out all those bad experiences, and has helped in our hearts to see that it has been compensated for. Thanks to Make-A-Wish, Joseph has long-lasting happy memories which I know will be with him forever.” Charlie, Joseph's mum Be a wishgranter If you're not in a position to give a regular gift to Make-A-Wish, please considermaking a one-off donation."
