["https://make-a-wish.org.uk/about-us/what-we-do/patrons-and-ambassadors"]
title = "The Make-A-Wish UK Patrons and Ambassadors | Make-A-Wish UK"
description = "Patrons, Ambassadors and Friends are volunteers who help us with wishgranting, fundraising and profile-raising activities."
full_description = '''Home About us What we do Patrons and ambassadors Patrons and ambassadors Our patrons, ambassadors and friends are volunteers who help us with wishgranting, fundraising and profile-raising activities. Patrons Batia Ofer Batia has been involved with the Foundation for more than 15 years now and is Chair of Art of Wishes, a patron of Make-A-Wish UK, Honorary President of Make-A-Wish Israel and Honorary President of the Global Shared Appeal. Read more Robert Small "With two young children of my own, I wanted to support a charity that was really making a difference to the lives of kids all around the UK. Make-A-Wish has a mission and purpose that really fulfils that brief and I'm thrilled to be a Patron." Ian Morton Ian is Senior Vice President of International Promotions for 20th Century Fox, based in London. He oversees all commercial partnerships for films made by the studio, including working on productions like ‘Ice Age’ and ‘Avatar’. Volunteer Ambassadors Together, we create life-changing wishes for children with critical illnesses. It's what we do. From capturing the wishes of children who are referred to Make-A-Wish, to fundraising, assisting at events or attending wishes, it takes an community of volunteers to make wishes happen and we couldn't do it without the support of our incredible volunteers. You can meet some of our longest standing volunteers below. Angela Costello Angela started volunteering for Make-A-Wish in 2012. She visits the children who are referred to us to find out what their wish is and has also taken on the role of training volunteers who are new to this. Toni Findley Toni's son Matt had a wish to swim with dolphins granted in 1992, inspiring her to start volunteering for us in 2015. The empathy she shows families, because of her own lived experience, is immeasurable. Paul Blakeborough Paul started volunteering with Make-A-Wish in 2013 and has since become involved in many areas across the organisation, including wish discovery visits, wish attendance and fundrasing. Ruth Briggs Ruth has been a Make-A-Wish volunteer for 10 years and has been one of our most active Wish Visitors, capturing the wishes of more than 30 children in one year. Shane Coleman Shane has been volunteering and fundraising for Make-A-Wish since 2007 and is extremely passionate about the work we do and the impact it has on children’s’ lives.'''
