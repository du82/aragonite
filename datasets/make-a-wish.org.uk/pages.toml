full_description = "Home Get involved Get involved Get Involved and support Make-A-Wish Find fundraising events & challenges We’d love to welcome you to our #WishHero team! Find out more about how you can get involved with Make-A-Wish UK and make a real difference to the life of a desperately ill child. From making a donation, or taking part in an event, to volunteering your time, your support will help us to grant more magical wishes. Find an event From walks and runs, to gala dinners and bake sales in your community, we have a range of events that you can take part in. Read more Fundraise in your Community Planning to hold your own event in the local community? We’ve got lots of fundraising tips and ideas to get you started and materials to support you on your journey. Read more Volunteer your time Volunteers are at the heart of our organisation. Find out more about how to volunteer your time and really make it count. Read more Corporate Partnerships Find out how we can work together with your organisation to grant life changing wishes. Read more Of course, one of the easiest ways to get involved is simply to make a donation and help us to continue granting life-changing wishes to children with critical illnesses. To find out about the positive impact your support can have on wish children and their families, read more about how wishes help."
