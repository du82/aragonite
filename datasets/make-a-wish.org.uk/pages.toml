["https://make-a-wish.org.uk/cookies-policy"]
title = "Cookies policy | Make-A-Wish UK"
description = "Our Cookie Policy explains what cookies are and how we use them. Read this policy to understand what type of cookies we use, the information we collect using cookies and how that information is used."
full_description = '''Home Cookies Cookies policy What are cookies?Cookies are small text files that are placed on your computer by websites that you visit. They are widely used in order to make websites work, or work better, as well as to provide information to the owners of the site. A cookie often contains a unique number, which can be used to recognise your computer when a user of your computer returns to a website that it visited previously.How does Make-A-Wish UK use cookies?We use cookies to enhance the online experience of our visitors, to better understand how our websites are used and to monitor how our advertisements perform. Cookies may tell us, for example, whether you have visited our site before or whether you are a new visitor.Your rightsOur cookies do not store financial information or information which is capable of directly identifying you (such as your name or address). You have the right to choose whether to accept these cookies. You can exercise this right by amending or setting the controls on your browser to reflect your cookie preferences. However, please note that if you choose to refuse cookies you may not be able to use the full functionality of this website.Changing your cookie preferencesThe "Help" menu in the toolbar of most web browsers will tell you how to change your browser's cookie settings, including how to have the browser notify you when you receive a new cookie, and how to disable cookies altogether. For details on how to do this, please visit aboutcookies.orgCookie terminologyWe have classified our cookies into two broad types - 'first party cookies' and 'third party cookies':First party cookies are cookies that are served directly by the website operator to your computer, and are often used to recognise your computer when it revisits that site and to remember your preferences as you browse the site.Third party cookies are served by a service provider on behalf of the website operator, and can be used by the service provider to recognise your computer when it visits other web sites. Third party cookies are used for a variety of reasons, most commonly used for website analytics or advertising purposes. More details are provided in the third party cookie section.In addition, cookies may be either 'session cookies' or 'persistent cookies'. Your computer automatically removes session cookies once you close your browser. Persistent cookies will survive on your computer until an expiry date specified in the cookie itself, is reached.'''
year_published = 2025
clearnet = "https://make-a-wish.org.uk/cookies-policy"
