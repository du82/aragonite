["https://make-a-wish.org.uk"]
title = "Children's charity, granting wishes to seriously ill children | Make-A-Wish UK"
description = "Donate, volunteer or fundraise for children's charity, Make-A-Wish UK and help us to grant life-changing wishes for children with critical illnesses."
full_description = '''Every child deserves to wish For more than a life defined by illness Donate now and make wishes come true Right now over 134,000 children in the UK are eligible for a wish because they are dealing with the grueling daily reality of life with a critical illness. When it comes to their dreams, they deserve to wish for more than a life defined by their illness.Critical illness brings a child’s joy to an abrupt end but Make-A-Wish UK is part of a global movement that grants life-changing wishes that have the power to turn tears into cheers, rescuing the magic of childhood even in their toughest times and providing a lifeline for families to spend precious time together. How you can help Donate today Whether it's a single donation or a regular gift, your donation will help revive a childhood stolen by critical illness. Donate today Find a challenge Do you want to get fit, push yourself to try something new, or simply have fun? Take on a challenge for Make-A-Wish in 2024. Find out more Fundraise for us Find out how you can get involved in fundraising opportunities within in your local community. Find out how Volunteer with us Even just 30 minutes a week of your time will have a profound impact on our ability to grant wishes sooner. Find out more News & storiesCatch up on the latest news and happenings. Will you grant a child's wish this Christmas? Go to story Transforming Christmas into wishes with our partners Go to story A Night of Wishes raises £450,000 for Make-A-Wish UK Go to story Make-A-Wish UK announces funding from players of People's Postcode Lottery. Go to story Browse all latest news Wish storiesTake a look at just some of the amazing wishes you've helped us grant. Wish Granted Chloe and Lucy 9 yrs Heart condition "We wish to go to Center Parcs and Legoland Windsor" Chloe and Lucy's wish Wish Granted Dylan 6 yrs Congenital heart defect "I wish to have a Paw Patrol party" Dylan's wish Wish Granted Theo 13 yrs Duchenne muscular dystrophy "I wish to go to Center Parcs for a winter wonderland break" Theo's wish Wish Granted Monty 5 yrs Leukaemia "I wish to be a firefighter" Monty's wish Wish Granted Avia 7 yrs Wilms' tumour "I wish to be a princess" Avia's wish Wish Granted Elspeth 10 yrs Spinal muscular atrophy "I wish to be a fashion designer for the day" Elspeth's wish Wish Granted Emilka 16 yrs End-stage renal failure "I wish to meet the England women's football team" Emilka's wish Wish Granted Laura 18 yrs Brain tumour "I wish to meet the England women's football team" Laura's wish Wish Granted Sevi 5 yrs Neuroblastoma "I wish to have a Nintendo Switch" Sevi's wish Wish Granted Benedicta 16 yrs Sickle cell disease with complications "I wish to have a gaming laptop" Benedicta's wish Wish Granted Penelope 8 yrs Rare genetic condition "I wish to be the Queen for a day" Penelope's wish Wish Granted Noah 12 yrs Complex lung condition "I wish to be in the army for a day" Noah's wish Wish Granted Lacey 6 yrs Congenital heart defect "I wish to have a unicorn-themed party" Lacey's wish Wish Granted Kate 9 yrs Complex severe cystic fibrosis "I wish to meet and train with my gymnastics idol" Kate's wish Wish Granted Dulcie 7 yrs Neuroblastoma "I wish to be a VIP and walk the red carpet with paparazzi" Dulcie's wish Wish Granted Izzy 18 yrs B cell lymphoma "I wish to spend the day with a ballet company" Izzy's wish Wish Granted Julia 6 yrs Leukaemia "I wish to to go Lapland UK" Julia's wish Wish Granted Alice 7 yrs Cancer "I wish to go to Lapland" Alice's wish Wish Granted Jack 10 yrs Hurler's syndrome "I wish to go to Lapland" Jack's wish Wish Granted Lincoln 7 yrs Osteogenesis imperfecta "A Disney Wish" Lincoln's wish Wish Granted James 5 yrs Blood disorder "I wish to go to Lapland" James's wish Wish Granted Ryleigh 6 yrs Brain tumours "I wish to have a Disney themed party with my family and friends" Ryleigh's wish Wish Granted Marco 18 yrs Crohn's disease "I wish to fly in a Spitfire" Marco's wish Wish Granted Lila 6 yrs Leukaemia "I wish to go on a holiday to Cornwall" Lila's wish Wish Granted George 5 yrs Leukaemia "I wish to go to a dirt bike championship and meet the riders" George's wish Wish Granted Harry 7 yrs Acute lymphoblastic leukaemia "I wish to search for the Loch Ness Monster" Harry's wish Wish Granted Oliver 18 yrs Acute lymphoblastic leukaemia "I wish to go to an Elton John concert" Oliver's wish Wish Granted Ben 18 yrs Testicular cancer "I wish to have a Playstation 5" Ben's wish Wish Granted Cameron 11 yrs Tetralogy of Fallot "I wish to meet and game with YouTuber, SB737" Cameron's wish Wish Granted Connor 12 yrs End-stage renal failure "I wish to meet DanTDM" Connor's wish Wish Granted Joshua 9 yrs Leukaemia "I wish to have a jungle themed bedroom" Joshua's wish Wish Granted Charlotte 6 yrs Heart defect "To go on holiday to Center Parcs" Charlotte's wish Wish Granted Oliver 3 yrs Neurodevelopmental disorder "To have a spa pool" Oliver's wish Wish Granted Zachariah 8 yrs Neurological condition "I wish to have a Delta Delichon Buggy" Zachariah's wish Wish Granted Abbie 12 yrs Osteosarcoma "I wish to meet Tilly Ramsay and cook a meal with her to enjoy together" Abbie's wish Wish Granted Amber 10 yrs Large cell lymphoma "I wish to go to the London Horse Show" Amber's wish Wish Granted Kieran 12 yrs Neurological condition "I wish to be a Transformers designer and make an actual figure" Kieran's wish Wish Granted Lewis 11 yrs Chromosome disorder "A Disney wish" Lewis's wish Browse all wish stories Other useful information Give a gift in kind Become a part of the wish journey by donating goods, skills or services and help grant life-changing wishes to more children. Find out how Get involved From capturing wishes to running a marathon, there are lots of ways you can be a part of granting wishes. Get involved Apply for a wish Find out everything you need to know about referring a child for a wish with Make-A-Wish. Wish referrals What we do Together, we create joy, happiness and magical memories through life-changing wishes for children with critical illnesses. What we do'''
