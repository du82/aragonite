["https://make-a-wish.org.uk/news/a-night-of-wishes-raises-450000-for-make-a-wish-uk"]
title = "A Night of Wishes raises £450,000 for Make-A-Wish | Make-A-Wish UK"
description = "Some of today’s most recognised celebrity talent gathered at The Savoy, London to raise funds for Make-A-Wish UK at the A Night of Wishes 2024 Ball."
full_description = '''Home News & Stories A Night of Wishes raises … A Night of Wishes raises £450,000 for Make-A-Wish UK Some of today’s most recognised celebrity talent were among an audience of 250 guests who gathered at The Savoy, London to raise funds for Make-A-Wish UK at the A Night of Wishes 2024 Ball. Hosted by Vernon Kay, the event featured entertainment by Louise Redknapp, Dreamgirls performer Nicole Raquel Dennis, House Gospel Choir and a DJ set from Toby Anstis to close the night.Celebrity guests in attendance included Dame Maureen Lipman, Harry Clark and Mollie Pierce from The Traitors, actress and singer Marisha Wallace, DJ Rickie Haywood-Williams and Strictly Come Dancing stars Tyler West and Molly Rainford. The audience took part in an auction featuring prizes such as a week away in Somerset for 14 people, a day trip to Lapland for a family of four, Champagne and sushi for 12 people at the Andy Warhol flat, two Friday Fairmont hospitality tickets to Formula 1 Monaco Grand Prix, an overnight stay at the Shangri-La The Shard with dinner in TING for two, a monthly bouquet of flowers for a year, and a kitchen aid bundle worth £1300.After dinner guests heard from wish child Evie's dad Paul and sister Rosie about the impact of a wish, and were given the opportunity to directly fund the wishes of children waiting for their to be granted. The event raised over £400,000! Paul Matthews with daughter Rosie speaking at A Night of Wishes "“I remain astounded by - and forever indebted to - our supporters and patrons, whom, once again, have shown nothing but generosity and support towards the charity and the vital work we do. We are granting more wishes than ever but demand for our help is currently outpacing our best efforts to keep up. Thanks to the money raised here tonight, we can grant wishes to families sooner, meaning they don't have to wait for a wish that could bring strength during their toughest and most relentless times.”" Jason Suckley, Chief Executive, Make-A-Wish UK'''
