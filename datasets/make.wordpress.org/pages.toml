title = "Make WordPress Core – WordPress Development Updates"
description = "Core is the set of software required to run WordPress. The Core Development Team builds WordPress."
full_description = '''Jonathan Desrosiers 12:17 am on January 11, 2025 Tags: 6-8 ( 33 ), core ( 625 ) WordPress 6.8: Release Squad, Timeline, and Focus Thank you to all who volunteered as interested in serving on the WordPress 6.8 release squad! After collecting all of the volunteers, reviewing active initiatives and tickets currently in the milestone, contributor availability in various areas, and planned events or holidays the following squad, timeline, and focus has been assembled. Release Squad Release LeadRelease Lead The community member ultimately responsible for the Release. – Matt Mullenweg Coordination – Jeffrey Paul & Michelle Frechette Tech Leads – Joe McGill, Jonathan Desrosiers, George Mamadashvili Triagetriage The act of evaluating and sorting bug reports, in order to decide priority, severity, and other factors. Lead – Jb Audras Design Lead – Tammie Lister Performance Lead – Felix Arntz Test Lead – Krupa Nanda This squad continues the experiment that started in 6.7 of merging the MarComms (Marketing and Communications) Lead with Release Coordination in order to gather more feedback on that experiment. This can change during the process for future releases if needed. The squad is also a bit smaller than usual because of this release being a polish and bugbug A bug is an error or unexpected result. Performance improvements, code optimization, and are considered enhancements, not defects. After feature freeze, only bugs are dealt with, with regressions (adverse changes from the previous version) being the highest priority. fix release. Also of note, the CoreCore Core is the set of software required to run WordPress. The Core Development Team builds WordPress. Tech Lead and Editor Tech Lead roles have been combined into a single “Tech Leads” role as part of the continued initiative to support a more closely coordinated effort across GutenbergGutenberg The Gutenberg project is the new Editor Interface for WordPress. The editor improves the process and experience of creating new content, making writing rich content much simpler. It uses ‘blocks’ to add richness rather than shortcodes, custom HTML etc. https://wordpress.org/gutenberg/ and Core. Aaron Jorbin has volunteered to continue managing tickets and will organize minor releases as necessary for the remainder of the 6.8 release cycle. Release Timeline As a reminder, here are a few of the key milestones for the release: BetaBeta A pre-release of software that is given out to a large group of users to trial under real conditions. Beta versions have gone through alpha testing in-house and are generally fairly close in look, feel and function to the final product; however, design changes often occur as part of the process. 1: March 4, 2025 Release Candidaterelease candidate One of the final stages in the version release cycle, this version signals the potential to be a final release to the public. Also see alpha (beta). 1: March 25, 2025 General Release: April 15, 2025 Please refer to the WordPress 6.8 Development Cycle page for the full release schedule. Release Focus After evaluating the current active initiatives, there will likely be fewer features ready to ship when compared to other recent major releases. As a result, 6.8 will focus primarily on being a polish and bug fix release. New features will be considered if deemed reasonably ready. A WordPress release is put together by the entire community and the release squad only represents a fraction of the contributors to a release. If you are looking to get involved, please join the #core channel in SlackSlack Slack is a Collaborative Group Chat Platform https://slack.com/. The WordPress community has its own Slack Channel at https://make.wordpress.org/chat/. where there are weekly chats on Wednesday at 20:00 UTC and bi-weekly new contributor onboarding meetings on the 2nd and 4th Wednesday of each month at 19:00 UTC. Props @jorbin, @joemcgill, @jeffpaul, @marybaum, @4thhubbard, @davidbaumwald, @courane01 for prepublish review. #6-8Login to Reply[{"type":"post","id":116753,"postID":116753,"cssClasses":"post post-116753 type-post status-publish format-standard sticky hentry category-general category-updates tag-6-8 tag-core mentions-4thhubbard mentions-courane01 mentions-davidbaumwald mentions-jeffpaul mentions-joemcgill mentions-jorbin mentions-marybaum author-desrosj","parentID":0,"titleRaw":"WordPress 6.8: Release Squad, Timeline, and Focus","titleFiltered":"WordPress 6.8: Release Squad, Timeline, and Focus","titleWasGeneratedFromContent":false,"contentRaw":"<!-- wp:paragraph -->\n<p>Thank you to all who <a href=\"https:\/\/make.wordpress.org\/core\/2024\/11\/21\/wordpress-6-8-call-for-volunteers\/\">volunteered as interested<\/a> in serving on the WordPress 6.8 release squad! After collecting all of the volunteers, reviewing active initiatives and tickets currently in the milestone, contributor availability in various areas, and planned events or holidays the following squad, timeline, and focus has been assembled.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:heading -->\n<h2 class=\"wp-block-heading\">Release Squad<\/h2>\n<!-- \/wp:heading -->\n\n<!-- wp:list -->\n<ul class=\"wp-block-list\"><!-- wp:list-item -->\n<li>Release Lead \u2013 <a href=\"https:\/\/profiles.wordpress.org\/matt\/\">Matt Mullenweg<\/a><\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Coordination \u2013 <a href=\"https:\/\/profiles.wordpress.org\/jeffpaul\/\">Jeffrey Paul<\/a> &amp; <a href=\"https:\/\/profiles.wordpress.org\/michelleames\/\">Michelle Frechette<\/a><\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Tech Leads \u2013 <a href=\"https:\/\/profiles.wordpress.org\/joemcgill\/\">Joe McGill<\/a>, <a href=\"https:\/\/profiles.wordpress.org\/desrosj\/\">Jonathan Desrosiers<\/a>, <a href=\"https:\/\/profiles.wordpress.org\/mamaduka\/\">George Mamadashvili<\/a><\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Triage Lead \u2013 <a href=\"https:\/\/profiles.wordpress.org\/audrasjb\/\">Jb Audras<\/a><\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Design Lead \u2013 <a href=\"https:\/\/profiles.wordpress.org\/karmatosed\/\">Tammie Lister<\/a><\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Performance Lead \u2013 <a href=\"https:\/\/profiles.wordpress.org\/flixos90\/\">Felix Arntz<\/a><\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Test Lead \u2013 <a href=\"https:\/\/profiles.wordpress.org\/krupajnanda\/\">Krupa Nanda<\/a><\/li>\n<!-- \/wp:list-item --><\/ul>\n<!-- \/wp:list -->\n\n<!-- wp:paragraph -->\n<p>This squad <a href=\"https:\/\/make.wordpress.org\/core\/2024\/08\/14\/wordpress-6-7-release-squad-ready\/\">continues the experiment that started in 6.7<\/a> of merging the <a href=\"https:\/\/make.wordpress.org\/core\/handbook\/about\/release-cycle\/wordpress-release-team-and-focus-leads\/#marcomms-marketing-and-communications-lead\">MarComms (Marketing and Communications) Lead<\/a> with <a href=\"https:\/\/make.wordpress.org\/core\/handbook\/about\/release-cycle\/wordpress-release-team-and-focus-leads\/#release-co-ordinator\">Release Coordination<\/a> in order to gather more feedback on that experiment. This can change during the process for future releases if needed.&nbsp; The squad is also a bit smaller than usual because of this release being a polish and bug fix release. Also of note, the Core Tech Lead and Editor Tech Lead roles have been combined into a single \u201cTech Leads\u201d role as part of the <a href=\"https:\/\/make.wordpress.org\/core\/2024\/07\/22\/aligning-committer-level-access-across-the-code-base\/\">continued initiative to support a more closely coordinated effort<\/a> across Gutenberg and Core.&nbsp;<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p><a href=\"https:\/\/profiles.wordpress.org\/jorbin\/\">Aaron Jorbin<\/a> has volunteered to continue managing tickets and will organize minor releases as necessary for the remainder of the 6.8 release cycle.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:heading -->\n<h2 class=\"wp-block-heading\">Release Timeline<\/h2>\n<!-- \/wp:heading -->\n\n<!-- wp:paragraph -->\n<p>As a reminder, here are a few of the key milestones for the release:<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:list -->\n<ul class=\"wp-block-list\"><!-- wp:list-item -->\n<li><strong>Beta 1: <\/strong>March 4, 2025<\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li><strong>Release Candidate 1:<\/strong> March 25, 2025<\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li><strong>General Release:<\/strong> April 15, 2025<\/li>\n<!-- \/wp:list-item --><\/ul>\n<!-- \/wp:list -->\n\n<!-- wp:paragraph -->\n<p>Please refer to the <a href=\"https:\/\/make.wordpress.org\/core\/6-8\/\">WordPress 6.8 Development Cycle page<\/a> for the full release schedule.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:heading -->\n<h2 class=\"wp-block-heading\">Release Focus<\/h2>\n<!-- \/wp:heading -->\n\n<!-- wp:paragraph -->\n<p>After evaluating the current active initiatives, there will likely be fewer features ready to ship when compared to other recent major releases. As a result, 6.8 will focus primarily on being a polish and bug fix release. New features will be considered if deemed reasonably ready.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p>A WordPress release is put together by the entire community and the release squad only represents a fraction of the contributors to a release. If you are looking to get involved, please join the #core channel in Slack where there are weekly chats on [time]Wednesday at 20:00 UTC[\/time] and bi-weekly new contributor onboarding meetings on the <a href=\"https:\/\/make.wordpress.org\/meetings\/#core\">2nd and 4th Wednesday of each month at 19:00 UTC<\/a>.\u00a0<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph {\"align\":\"right\"} -->\n<p class=\"has-text-align-right\">Props @jorbin, @joemcgill, @jeffpaul, @marybaum, @4thhubbard, @davidbaumwald, @courane01 for prepublish review.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p><\/p>\n<!-- \/wp:paragraph -->\n\n#6-8","contentFiltered":"<p>Thank you to all who <a href=\"https:\/\/make.wordpress.org\/core\/2024\/11\/21\/wordpress-6-8-call-for-volunteers\/\">volunteered as interested<\/a> in serving on the WordPress 6.8 release squad! After collecting all of the volunteers, reviewing active initiatives and tickets currently in the milestone, contributor availability in various areas, and planned events or holidays the following squad, timeline, and focus has been assembled.<\/p>\n\n\n\n<h2 class=\"wp-block-heading\">Release Squad<\/h2>\n\n\n\n<ul class=\"wp-block-list\">\n<li><span tabindex='0' class='glossary-item-container'>Release Lead<span class='glossary-item-hidden-content'><span class='glossary-item-header'>Release Lead<\/span> <span class='glossary-item-description'>The community member ultimately responsible for the Release.<\/span><\/span><\/span> \u2013 <a href=\"https:\/\/profiles.wordpress.org\/matt\/\">Matt Mullenweg<\/a><\/li>\n\n\n\n<li>Coordination \u2013 <a href=\"https:\/\/profiles.wordpress.org\/jeffpaul\/\">Jeffrey Paul<\/a> &amp; <a href=\"https:\/\/profiles.wordpress.org\/michelleames\/\">Michelle Frechette<\/a><\/li>\n\n\n\n<li>Tech Leads \u2013 <a href=\"https:\/\/profiles.wordpress.org\/joemcgill\/\">Joe McGill<\/a>, <a href=\"https:\/\/profiles.wordpress.org\/desrosj\/\">Jonathan Desrosiers<\/a>, <a href=\"https:\/\/profiles.wordpress.org\/mamaduka\/\">George Mamadashvili<\/a><\/li>\n\n\n\n<li><span tabindex='0' class='glossary-item-container'>Triage<span class='glossary-item-hidden-content'><span class='glossary-item-header'>triage<\/span> <span class='glossary-item-description'>The act of evaluating and sorting bug reports, in order to decide priority, severity, and other factors.<\/span><\/span><\/span> Lead \u2013 <a href=\"https:\/\/profiles.wordpress.org\/audrasjb\/\">Jb Audras<\/a><\/li>\n\n\n\n<li>Design Lead \u2013 <a href=\"https:\/\/profiles.wordpress.org\/karmatosed\/\">Tammie Lister<\/a><\/li>\n\n\n\n<li>Performance Lead \u2013 <a href=\"https:\/\/profiles.wordpress.org\/flixos90\/\">Felix Arntz<\/a><\/li>\n\n\n\n<li>Test Lead \u2013 <a href=\"https:\/\/profiles.wordpress.org\/krupajnanda\/\">Krupa Nanda<\/a><\/li>\n<\/ul>\n\n\n\n<p>This squad <a href=\"https:\/\/make.wordpress.org\/core\/2024\/08\/14\/wordpress-6-7-release-squad-ready\/\">continues the experiment that started in 6.7<\/a> of merging the <a href=\"https:\/\/make.wordpress.org\/core\/handbook\/about\/release-cycle\/wordpress-release-team-and-focus-leads\/#marcomms-marketing-and-communications-lead\">MarComms (Marketing and Communications) Lead<\/a> with <a href=\"https:\/\/make.wordpress.org\/core\/handbook\/about\/release-cycle\/wordpress-release-team-and-focus-leads\/#release-co-ordinator\">Release Coordination<\/a> in order to gather more feedback on that experiment. This can change during the process for future releases if needed.\u00a0 The squad is also a bit smaller than usual because of this release being a polish and <span tabindex='0' class='glossary-item-container'>bug<span class='glossary-item-hidden-content'><span class='glossary-item-header'>bug<\/span> <span class='glossary-item-description'>A bug is an error or unexpected result. Performance improvements, code optimization, and are considered enhancements, not defects. After feature freeze, only bugs are dealt with, with regressions (adverse changes from the previous version) being the highest priority.<\/span><\/span><\/span> fix release. Also of note, the <span tabindex='0' class='glossary-item-container'>Core<span class='glossary-item-hidden-content'><span class='glossary-item-header'>Core<\/span> <span class='glossary-item-description'>Core is the set of software required to run WordPress. The Core Development Team builds WordPress.<\/span><\/span><\/span> Tech Lead and Editor Tech Lead roles have been combined into a single \u201cTech Leads\u