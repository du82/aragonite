title = "WordPress Playground"
description = "MySQL is a relational database management system. A database is a structured collection of data where content, configuration and other options are stored. https://www.mysql.com/."
full_description = '''Bero 11:04 am on December 16, 2024 Tags: meeting ( 2 ), summary ( 2 ) Playground Team Meeting Summary – December 13, 2024 The Playground team met to discuss recent updates, ongoing projects, and community questions. (Slack script) facilitated by @berislavgrgicak Announcements Enabled CORS Proxy for all network requests. This gives WordPress running inside Playground more access to cross origin resources. Limitations still apply around allowed headers and download sizes. Props to @brandonpayton The new and experimental Data Liberation importer is now available in the importWxr step if you use the "importer": "data-liberation" option. The new importer rewrites links in the imported content, downloads assets through Playground’s CORS proxy, parallelizes the downloads, and communicates progress live. WP cron is now enabled in Playground We used the Playground tester to compare the error rate of the top 1000 WordPress.org plugins. In 2023 7% of plugins failed, and today it’s 5%. Contributor Updates Data Liberation Efforts: @zieladam added a experimental integration to the importWxr step. @zaerl is working on topological sorting of WXR entities. @bpayton created a WXR + uploads export package. Experimental Markdown importer in the importWxr step. SQLite Integration: @janjakesjanjakes is focused on implementing MySQLMySQL MySQL is a relational database management system. A database is a structured collection of data where content, configuration and other options are stored. https://www.mysql.com/. information_schema into SQLite. Next: translating ALTER TABLE statements. Playground Tester: Tests will be able to run automatically after we add support for GitHubGitHub GitHub is a website that offers online implementation of git repositories that can easily be shared, copied and modified by other developers. Public repositories are free to host, private repositories require a paid subscription. GitHub introduced the concept of the ‘pull request’ where code changes done in branches by contributors can be reviewed and discussed before being merged be the repository owner. https://github.com/ actions to push reports. @berislavgrgicak prototyped Playwright tests for the Tester. Workshop: @psykro and @berislavgrgicak delivered a WordPress Playground for developers workshop. Open Floor Should Playground load if Blueprint steps fail? We would like to improve error messages and how they are displayed. We discussed if Blueprint authors should be able to allowed a step to fail, but concluded it might cause issues. Thank you to all contributors for your participation! Stay tuned for updates in SlackSlack Slack is a Collaborative Group Chat Platform https://slack.com/. The WordPress community has its own Slack Channel at https://make.wordpress.org/chat/. and on the Make WordPress blog. #summary #meeting Props to @zieladam for reviewing. Login to Reply[{"type":"post","id":190,"postID":190,"cssClasses":"post post-190 type-post status-publish format-standard hentry category-updates tag-meeting tag-summary mentions-berislavgrgicak mentions-bpayton mentions-brandonpayton mentions-psykro mentions-zaerl mentions-zieladam author-berislavgrgicak","parentID":0,"titleRaw":"Playground Team Meeting Summary \u2013 December 13, 2024","titleFiltered":"Playground Team Meeting Summary \u2013 December 13, 2024","titleWasGeneratedFromContent":false,"contentRaw":"<!-- wp:paragraph -->\n<p>The Playground team met to discuss recent updates, ongoing projects, and community questions. (<a href=\"https:\/\/wordpress.slack.com\/archives\/C04EWKGDJ0K\/p1734098437070179\">Slack script<\/a>) facilitated by @berislavgrgicak<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:heading -->\n<h2 class=\"wp-block-heading\">Announcements<\/h2>\n<!-- \/wp:heading -->\n\n<!-- wp:list -->\n<ul class=\"wp-block-list\"><!-- wp:list-item -->\n<li><a href=\"https:\/\/github.com\/WordPress\/wordpress-playground\/pull\/2076\" target=\"_blank\" rel=\"noreferrer noopener\">Enabled CORS Proxy for all network requests<\/a>. This gives WordPress running inside Playground more access to cross origin resources. Limitations still apply around allowed headers and download sizes. Props to @brandonpayton<\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li>The new and experimental Data Liberation importer&nbsp;<a href=\"https:\/\/github.com\/WordPress\/wordpress-playground\/pull\/2058\" target=\"_blank\" rel=\"noreferrer noopener\">is now available in the importWxr step<\/a>&nbsp;if you use the&nbsp;<code>\"importer\": \"data-liberation\"<\/code>&nbsp;option. The new importer rewrites links in the imported content, downloads assets through Playground\u2019s CORS proxy, parallelizes the downloads, and communicates progress live.<\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li><a href=\"https:\/\/github.com\/WordPress\/wordpress-playground\/pull\/2039\" target=\"_blank\" rel=\"noreferrer noopener\">WP cron is now enabled in Playground<\/a><\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li>We used the Playground tester to compare the error rate of the top 1000&nbsp;<a href=\"http:\/\/wordpress.org\/\" target=\"_blank\" rel=\"noreferrer noopener\">WordPress.org<\/a>&nbsp;plugins.&nbsp;<a href=\"https:\/\/github.com\/bgrgicak\/Playground-compatibility-reports\/blob\/main\/reports\/test-comparison.md\" target=\"_blank\" rel=\"noreferrer noopener\">In 2023 7% of plugins failed, and today it's 5%.<\/a><\/li>\n<!-- \/wp:list-item --><\/ul>\n<!-- \/wp:list -->\n\n<!-- wp:heading -->\n<h2 class=\"wp-block-heading\">Contributor Updates<\/h2>\n<!-- \/wp:heading -->\n\n<!-- wp:list -->\n<ul class=\"wp-block-list\"><!-- wp:list-item -->\n<li><strong>Data Liberation Efforts:<\/strong><!-- wp:list -->\n<ul class=\"wp-block-list\"><!-- wp:list-item -->\n<li>@zieladam added a <a href=\"https:\/\/github.com\/WordPress\/wordpress-playground\/pull\/2058\">experimental integration to the&nbsp;<code>importWxr<\/code>&nbsp;step.<\/a><\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li>@zaerl is working on <a href=\"https:\/\/github.com\/WordPress\/wordpress-playground\/pull\/2030\">topological sorting of WXR entities.<\/a><\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li>@bpayton &nbsp;<a href=\"https:\/\/github.com\/WordPress\/wordpress-playground\/pull\/2078\" target=\"_blank\" rel=\"noreferrer noopener\">created a WXR + uploads export package<\/a>.<\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Experimental <a href=\"https:\/\/github.com\/WordPress\/wordpress-playground\/pull\/2080\">Markdown importer in the importWxr step<\/a>.<\/li>\n<!-- \/wp:list-item --><\/ul>\n<!-- \/wp:list --><\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li><strong>SQLite Integration<\/strong>: <!-- wp:list -->\n<ul class=\"wp-block-list\"><!-- wp:list-item -->\n<li>@janjakesjanjakes&nbsp;is focused on implementing MySQL <code>information_schema<\/code> into SQLite.<\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Next: translating <code>ALTER TABLE<\/code> statements.<\/li>\n<!-- \/wp:list-item --><\/ul>\n<!-- \/wp:list --><\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li><strong>Playground Tester<\/strong>: <!-- wp:list -->\n<ul class=\"wp-block-list\"><!-- wp:list-item -->\n<li>Tests will be able to run automatically after we add support for GitHub actions to push reports.<\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li>@berislavgrgicak <a href=\"https:\/\/github.com\/bgrgicak\/playground-tester\/pull\/9\">prototyped Playwright tests for the Tester.<\/a><\/li>\n<!-- \/wp:list-item --><\/ul>\n<!-- \/wp:list --><\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li><strong>Workshop<\/strong>:<!-- wp:list -->\n<ul class=\"wp-block-list\"><!-- wp:list-item -->\n<li>@psykro and @berislavgrgicak delivered a <a href=\"https:\/\/wordpress.tv\/2024\/12\/16\/wordpress-playground-for-developers\/\">WordPress Playground for developers workshop<\/a>.<\/li>\n<!-- \/wp:list-item --><\/ul>\n<!-- \/wp:list --><\/li>\n<!-- \/wp:list-item --><\/ul>\n<!-- \/wp:list -->\n\n<!-- wp:heading -->\n<h2 class=\"wp-block-heading\">Open Floor<\/h2>\n<!-- \/wp:heading -->\n\n<!-- wp:list -->\n<ul class=\"wp-block-list\"><!-- wp:list-item -->\n<li><strong><a href=\"https:\/\/wordpress.slack.com\/archives\/C04EWKGDJ0K\/p1734100147789199\">Should Playground load if Blueprint steps fail?<\/a><\/strong><!-- wp:list -->\n<ul class=\"wp-block-list\"><!-- wp:list-item -->\n<li>We would like to <a href=\"https:\/\/wordpress.slack.com\/archives\/C04EWKGDJ0K\/p1734101191915709\">improve error messages and how they are displayed.<\/a><\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li>We discussed if Blueprint authors should be able to allowed a step to fail, but <a href=\"https:\/\/wordpress.slack.com\/archives\/C04EWKGDJ0K\/p1734101386273749\">concluded it might cause issues. <\/a><\/li>\n<!-- \/wp:list-item --><\/ul>\n<!-- \/wp:list --><\/li>\n<!-- \/wp:list-item --><\/ul>\n<!-- \/wp:list -->\n\n<!-- wp:paragraph -->\n<p>Thank you to all contributors for your participation! Stay tuned for updates in Slack and on the <a>Make WordPress blog<\/a>.<a href=\"https:\/\/make.wordpress.org\/playground\/wp-admin\/post.php?post=131&amp;action=edit\"><\/a><\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p>#summary #meeting<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p><em>Props to @zieladam for reviewing<\/em>.<\/p>\n<!-- \/wp:paragraph -->","contentFiltered":"<p>The Playground team met to discuss recent updates, ongoing projects, and community questions. (<a href=\"https:\/\/wordpress.slack.com\/archives\/C04EWKGDJ0K\/p1734098437070179\">Slack script<\/a>) facilitated by <a href=\"https:\/\/profiles.wordpress.org\/berislavgrgicak\/\" class=\"mention\"><span class=\"mentions-prefix\">@<\/span>berislavgrgicak<\/a><\/p>\n\n\n\n<h2 class=\"wp-block-heading\">Announcements<\/h2>\n\n\n\n<ul class=\"wp-block-list\">\n<li><a href=\"https:\/\/github.com\/WordPress\/wordpress-playground\/pull\/2076\" target=\"_blank\" rel=\"noreferrer noopener\">Enabled CORS Proxy for all network requests<\/a>. This gives WordPress running inside Playground more access to cross origin resources. Limitations still apply around allowed headers and download sizes. Props to <a href=\"https:\/\/profiles.wordpress.org\/brandonpayton\/\" class=\"mention\"><span class=\"mentions-prefix\">@<\/span>brandonpayton<\/a><\/li>\n\n\n\n<li>The new and experimental Data Liberation importer\u00a0<a href=\"https:\/\/github.com\/WordPress\/wordpress-playground\/pull\/2058\" target=\"_blank\" rel=\"noreferrer noopener\">is now available in the importWxr step<\/a>\u00a0if you use the\u00a0<code>\"importer\": \"data-liberation\"<\/code>\u00a0option. The new importer rewrites links in the imported content, downloads assets through Playground\u2019s CORS proxy, parallelizes the downloads, and communicates progress live.<\/li>\n\n\n\n<li><a href=\"https:\/\/github.com\/WordPress\/wordpress-playground\/pull\/2039\" target=\"_blank\" rel=\"noreferrer noopener\">WP cron is now enabled in Playground<\/a><\/li>\n\n\n\n<li>We used the Playground tester to compare the error rate of the top 1000\u00a0<a href=\"https:\/\/wordpress.org\/\" target=\"_blank\" rel=\"noreferrer noopener\">WordPress.org<\/a>\u00a0plugins.\u00a0<a href=\"https:\/\/github.com\/bgrgicak\/Playground-compatibility-reports\/blob\/main\/reports\/test-comparison.md\" target=\"_blank\" rel=\"noreferrer noopener\">In 2023 7% of plugins failed, and today it\u2019s 5%.<\/a><\/li>\n<\/ul>\n\n\n\n<h2 class=\"wp-block-heading\">Contributor Updates<\/h2>\n\n\n\n<ul class=\"wp-block-list\">\n<li><strong>Data Liberation Efforts:<\/strong>\n<ul class=\"wp-block-list\">\n<li><a href=\"https:\/\/profiles.wordpress.org\/zieladam\/\" class=\"mention\"><span class=\"mentions-prefix\">@<\/span>zieladam<\/a> added a <a href=\"https:\/\/github.com\/WordPress\/wordpress-playground\/pull\/2058\">experimental integration to the\u00a0<code>importWxr<\/code>\u00a0step.<\/a><\/li>\n\n\n\n<li><a href=\"https:\/\/profiles.wordpress.org\/zaerl\/\" class=\"mention\"><span class=\"mentions-prefix\">@<\/span>zaerl<\/a> is working on <a href=\"https:\/\/github.com\/WordPress\/wordpress-playground\/pull\/2030\">topological sorting of WXR entities.<\/a><\/li>\n\n\n\n<li><a href=\"https:\/\/profiles.wordpress.org\/bpayton\/\" class=\"mention\"><span class=\"mentions-prefix\">@<\/span>bpayton<\/a> \u00a0<a href=\"https:\/\/github.com\/WordPress\/wordpress-playground\/pull\/2078\" target=\"_blank\" rel=\"noreferrer noopener\">created a WXR + uploads export package<\/a>.<\/li>\n\n\n\n<li>Experimental <a href=\"https:\/\/github.com\/WordPress\/wordpress-playground\/pull\/2080\">Markdown importer in the importWxr step<\/a>.<\/li>\n<\/ul>\n<\/li>\n\n\n\n<li><strong>SQLite Integration<\/strong>: \n<ul class=\"wp-block-list\">\n<li>@janjakesjanjakes\u00a0is focused on implementing <span tabindex='0' class='glossary-item-container'>MySQL<span class='glossary-item-hidden-content'><span class='glossary-item-header'>MySQL<\/span> <span class='glossary-item-description'>MySQL is a relational database management system. A database is a structured collection of data where content, configuration and other options are stored. <a href=\"https:\/\/www.mysql.com\/\">https:\/\/www.mysql.com\/<\/a>.<\/span><\/span><\/span> <code>information_schema<\/code> into SQLite.<\/li>\n\n\n\n<li>Next: translating <code>ALTER TABLE<\/code> statements.<\/li>\n<\/ul>\n<\/li>\n\n\n\n<li><strong>Playground Tester<\/strong>: \n<ul class=\"wp-block-list\">\n<li>Tests will be able to run automatically after we add support for <span tabindex='0' class='glossary-item-container'>GitHub<span class='glossary-item-hidden-content'><span class='glossary-item-header'>GitHub<\/span> <span class='glossary-item-description'>GitHub is a website that offers online implementation of git repositories that can easily be shared, copied and modified by other developers. Public repositories are free to host, private repositories require a paid subscription. GitHub introduced the concept of the \u2018pull request\u2019 where code changes done in branches by contributors can be reviewed and discussed before being merged be the repository owner. <a href=\"https:\/\/github.com\/\">https:\/\/github.com\/<\/a><\/span><\/span><\/span> actions to push reports.<\/li>\n\n\n\n<li><a href=\"https:\/\/profiles.wordpress.org\/berislavgrgicak\/\" class=\"mention\"><span class=\"mentions-prefix\">@<\/span>berislavgrgicak<\/a> <a href=\"https:\/\/github.com\/bgrgicak\/playground-tester\/pull\/9\">prototyped Playwright tests for the Tester.<\/a><\/li>\n<\/ul>\n<\/li>\n\n\n\n<li><strong>Workshop<\/strong>:\n<ul class=\"wp-block-list\">\n<li><a href=\"https:\/\/profiles.wordpress.org\/psykro\/\" class=\"mention\"><span class=\"mentions-prefix\">@<\/span>psykro<\/a> and <a href=\"https:\/\/profiles.wordpress.org\/berislavgrgicak\/\" class=\"ment'''
