title = "Make WordPress Documentation – Making WordPress Docs"
description = "GitHub is a website that offers online implementation of git repositories that can easily be shared, copied and modified by other developers. Public repositories are free to host, private repositories require a paid subscription. GitHub introduced the concept of the ‘pull request’ where code changes done in branches by contributors can be reviewed and discussed before being merged be the repository owner.  https://github.com/"
full_description = '''Milana Cap 8:00 am on June 13, 2022 Onboarding to Documentation team Here is some quick info you need in order to start contributing to Documentation team. Accounts: WordPress.org account. WordPress Slack account (wordpress.orgWordPress.org The community site where WordPress code is created and shared by the users. This is where you can download the source code for WordPress core, plugins and themes as well as the central location for community conversations and organization. https://wordpress.org/ account is needed). GitHub account – connect your GitHub account to your WordPress.org profile. Places: Blog – for meeting agendas and summaries (and anything related to Docs team). Slack channel #docs – where meetings are happening (and all communication regarding the team itself). GitHub repository – where issues for all documentation are reported, discussed and worked on. Handbook – how to contribute to the Documentation team (it’s a bit out of date). Style guide – for how to write WordPress documentation. Meetings (alternating every week) on Tuesdays at 2PM UTC: Regular meeting with agenda published on our blog. Issues triage where we discuss issues from the GitHubGitHub GitHub is a website that offers online implementation of git repositories that can easily be shared, copied and modified by other developers. Public repositories are free to host, private repositories require a paid subscription. GitHub introduced the concept of the ‘pull request’ where code changes done in branches by contributors can be reviewed and discussed before being merged be the repository owner. https://github.com/ repository. Live onboarding sessions We recorded onboarding sessions for everyone interested in getting started with the Documentation team. We know that our “Getting started” documentation is out of date and getting involved can be very confusing and frustrating so we hope to ease the process with these sessions. Overview Recording: https://wordpress.tv/2022/06/21/milana-cap-overview-onboarding-for-wordpress-documentation-team/ A more recent onboarding session, recorded on 28th July 2023, can be found here: https://wordpress.tv/2023/08/01/jenni-mckinnon-milana-cap-wordpress-documentation-team-onboarding-july-2023/ End user documentation internally called HelpHub Located at https://wordpress.org/support/ Recording: https://wordpress.tv/2022/06/21/milana-cap-end-user-documentation-onboarding-for-wordpress-documentation-team/ Developer documentation Internally called DevHub Located at https://developer.wordpress.org/ Developer documentation – PluginPlugin A plugin is a piece of software containing a group of functions that can be added to a WordPress website. They can extend functionality or add new features to your WordPress websites. WordPress plugins are written in the PHP programming language and integrate seamlessly with WordPress. These can be free in the WordPress.org Plugin Directory https://wordpress.org/plugins/ or can be cost-based plugin from a third-party handbook Located at https://developer.wordpress.org/plugins/ Recording: https://wordpress.tv/2022/06/21/milana-cap-developer-documentation-plugin-handbook-onboarding-for-wordpress-documentation-team/ Developer documentation – Common APIs handbook Located at https://developer.wordpress.org/apis/ Recording: https://wordpress.tv/2022/06/21/milana-cap-developer-documentation-common-apis-handbook-onboarding-for-wordpress-documentation-team/ Developer documentation – Code reference handbook Located at https://developer.wordpress.org/reference Recording: https://wordpress.tv/2022/06/21/milana-cap-developer-documentation-code-reference-handbook-onboarding-for-wordpress-documentation-team/ Developer documentation – BlockBlock Block is the abstract term used to describe units of markup that, composed together, form the content or layout of a webpage using the WordPress editor. The idea combines concepts of what in the past may have achieved with shortcodes, custom HTML, and embed discovery into a single consistent API and user experience. editor handbook Located at https://developer.wordpress.org/block-editor/ Recording: https://wordpress.tv/2022/06/30/milana-cap-developer-documentation-block-editor-handbook-onboarding-for-wordpress-documentation-team/ Developer documentation – Themes handbook Located at https://developer.wordpress.org/themes/ Recording: https://wordpress.tv/2022/06/30/milana-cap-developer-documentation-themes-handbook-onboarding-for-wordpress-documentation-team/ Contributor documentation – Documentation team handbook Located at https://make.wordpress.org/docs/handbook/ Recording: https://wordpress.tv/2022/06/21/milana-cap-contributor-documentation-documentation-team-handbook-onboarding-for-wordpress-documentation-tea/ Github related roles Located at: https://github.com/WordPress/Documentation-Issue-Tracker/ Recording: https://wordpress.tv/2023/02/08/github-related-roles-onboarding-for-wordpress-documentation-team/ If you have any questions or you’d like to have an “in more detail” session, feel free to leave the comment below. Login to Reply[{"type":"post","id":13128,"postID":13128,"cssClasses":"post post-13128 type-post status-publish format-standard sticky hentry category-meetings category-onboarding mentions-milana_cap author-milana_cap","parentID":0,"titleRaw":"Onboarding to Documentation team","titleFiltered":"Onboarding to Documentation team","titleWasGeneratedFromContent":false,"contentRaw":"<!-- wp:paragraph -->\n<p>Here is some quick info you need in order to start contributing to Documentation team.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p>Accounts:<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:list -->\n<ul><!-- wp:list-item -->\n<li><a href=\"https:\/\/login.wordpress.org\/register\">WordPress.org account<\/a>.<\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li><a href=\"https:\/\/make.wordpress.org\/chat\/\">WordPress Slack account<\/a> (wordpress.org account is needed).<\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li><a href=\"https:\/\/github.com\/signup\">GitHub account<\/a> - connect <a href=\"https:\/\/make.wordpress.org\/core\/2020\/03\/19\/associating-github-accounts-with-wordpress-org-profiles\/\">your GitHub account to your WordPress.org profile<\/a>.<\/li>\n<!-- \/wp:list-item --><\/ul>\n<!-- \/wp:list -->\n\n<!-- wp:paragraph -->\n<p>Places:<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:list -->\n<ul><!-- wp:list-item -->\n<li><a href=\"https:\/\/make.wordpress.org\/docs\/\">Blog<\/a> - for meeting agendas and summaries (and anything related to Docs team).<\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li><a href=\"https:\/\/wordpress.slack.com\/archives\/C02RP4WU5\">Slack channel #docs<\/a> - where meetings are happening (and all communication regarding the team itself).<\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li><a href=\"https:\/\/github.com\/WordPress\/Documentation-Issue-Tracker\">GitHub repository<\/a> - where issues for all documentation are reported, discussed and worked on. <\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li><a href=\"https:\/\/make.wordpress.org\/docs\/handbook\/\">Handbook<\/a> - how to contribute to the Documentation team (it's a bit out of date).<\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li><a href=\"https:\/\/make.wordpress.org\/docs\/style-guide\/\">Style guide<\/a> - for how to write WordPress documentation.<\/li>\n<!-- \/wp:list-item --><\/ul>\n<!-- \/wp:list -->\n\n<!-- wp:paragraph -->\n<p>Meetings (alternating every week) on <a href=\"https:\/\/mytime.io\/2pm\/UTC\">Tuesdays at 2PM UTC<\/a>:<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:list -->\n<ul><!-- wp:list-item -->\n<li>Regular meeting with agenda published on our blog.<\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Issues triage where we discuss <a href=\"https:\/\/github.com\/WordPress\/Documentation-Issue-Tracker\/issues\">issues<\/a> from the GitHub repository.<\/li>\n<!-- \/wp:list-item --><\/ul>\n<!-- \/wp:list -->\n\n<!-- wp:heading -->\n<h2 class=\"wp-block-heading\">Live onboarding sessions<\/h2>\n<!-- \/wp:heading -->\n\n<!-- wp:paragraph -->\n<p>We recorded onboarding sessions for everyone interested in getting started with the Documentation team. We know that our \"Getting started\" documentation is out of date and getting involved can be very confusing and frustrating so we hope to ease the process with these sessions. <\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:heading {\"level\":3} -->\n<h3 class=\"wp-block-heading\">Overview<\/h3>\n<!-- \/wp:heading -->\n\n<!-- wp:paragraph -->\n<p>Recording: <a href=\"https:\/\/wordpress.tv\/2022\/06\/21\/milana-cap-overview-onboarding-for-wordpress-documentation-team\/\">https:\/\/wordpress.tv\/2022\/06\/21\/milana-cap-overview-onboarding-for-wordpress-documentation-team\/<\/a><\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p>A more recent onboarding session, recorded on 28th July 2023, can be found here: <a href=\"https:\/\/wordpress.tv\/2023\/08\/01\/jenni-mckinnon-milana-cap-wordpress-documentation-team-onboarding-july-2023\/\">https:\/\/wordpress.tv\/2023\/08\/01\/jenni-mckinnon-milana-cap-wordpress-documentation-team-onboarding-july-2023\/<\/a> <\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:heading {\"level\":3} -->\n<h3 class=\"wp-block-heading\">End user documentation<\/h3>\n<!-- \/wp:heading -->\n\n<!-- wp:list -->\n<ul><!-- wp:list-item -->\n<li>internally called <strong>HelpHub<\/strong><\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Located at <a href=\"https:\/\/wordpress.org\/support\/\">https:\/\/wordpress.org\/support\/<\/a><\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Recording: <a href=\"https:\/\/wordpress.tv\/2022\/06\/21\/milana-cap-end-user-documentation-onboarding-for-wordpress-documentation-team\/\">https:\/\/wordpress.tv\/2022\/06\/21\/milana-cap-end-user-documentation-onboarding-for-wordpress-documentation-team\/<\/a><\/li>\n<!-- \/wp:list-item --><\/ul>\n<!-- \/wp:list -->\n\n<!-- wp:heading {\"level\":3} -->\n<h3 class=\"wp-block-heading\">Developer documentation<\/h3>\n<!-- \/wp:heading -->\n\n<!-- wp:list -->\n<ul><!-- wp:list-item -->\n<li>Internally called <strong>DevHub<\/strong><\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Located at <a href=\"https:\/\/developer.wordpress.org\/\">https:\/\/developer.wordpress.org\/<\/a><\/li>\n<!-- \/wp:list-item --><\/ul>\n<!-- \/wp:list -->\n\n<!-- wp:heading {\"level\":4} -->\n<h4 class=\"wp-block-heading\">Developer documentation - Plugin handbook<\/h4>\n<!-- \/wp:heading -->\n\n<!-- wp:list -->\n<ul><!-- wp:list-item -->\n<li>Located at <a href=\"https:\/\/developer.wordpress.org\/plugins\/\">https:\/\/developer.wordpress.org\/plugins\/<\/a><\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Recording: <a href=\"https:\/\/wordpress.tv\/2022\/06\/21\/milana-cap-developer-documentation-plugin-handbook-onboarding-for-wordpress-documentation-team\/\">https:\/\/wordpress.tv\/2022\/06\/21\/milana-cap-developer-documentation-plugin-handbook-onboarding-for-wordpress-documentation-team\/<\/a><\/li>\n<!-- \/wp:list-item --><\/ul>\n<!-- \/wp:list -->\n\n<!-- wp:heading {\"level\":4} -->\n<h4 class=\"wp-block-heading\">Developer documentation - Common APIs handbook<\/h4>\n<!-- \/wp:heading -->\n\n<!-- wp:list -->\n<ul><!-- wp:list-item -->\n<li>Located at <a href=\"https:\/\/developer.wordpress.org\/apis\/\">https:\/\/developer.wordpress.org\/apis\/<\/a><\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Recording: <a href=\"https:\/\/wordpress.tv\/2022\/06\/21\/milana-cap-developer-documentation-common-apis-handbook-onboarding-for-wordpress-documentation-team\/\">https:\/\/wordpress.tv\/2022\/06\/21\/milana-cap-developer-documentation-common-apis-handbook-onboarding-for-wordpress-documentation-team\/<\/a><\/li>\n<!-- \/wp:list-item --><\/ul>\n<!-- \/wp:list -->\n\n<!-- wp:heading {\"level\":4} -->\n<h4 class=\"wp-block-heading\">Developer documentation - Code reference handbook<\/h4>\n<!-- \/wp:heading -->\n\n<!-- wp:list -->\n<ul><!-- wp:list-item -->\n<li>Located at <a href=\"https:\/\/developer.wordpress.org\/reference\">https:\/\/developer.wordpress.org\/reference<\/a><\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Recording: <a href=\"https:\/\/wordpress.tv\/2022\/06\/21\/milana-cap-developer-documentation-code-reference-handbook-onboarding-for-wordpress-documentation-team\/\">https:\/\/wordpress.tv\/2022\/06\/21\/milana-cap-developer-documentation-code-reference-handbook-onboarding-for-wordpress-documentation-team\/<\/a><\/li>\n<!-- \/wp:list-item --><\/ul>\n<!-- \/wp:list -->\n\n<!-- wp:heading {\"level\":4} -->\n<h4 class=\"wp-block-heading\">Developer documentation - Block editor handbook<\/h4>\n<!-- \/wp:heading -->\n\n<!-- wp:list -->\n<ul><!-- wp:list-item -->\n<li>Located at <a href=\"https:\/\/developer.wordpress.org\/block-editor\/\">https:\/\/developer.wordpress.org\/block-editor\/<\/a><\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Recording: <a href=\"https:\/\/wordpress.tv\/2022\/06\/30\/milana-cap-developer-documentation-block-editor-handbook-onboarding-for-wordpress-documentation-team\/\">https:\/\/wordpress.tv\/2022\/06\/30\/milana-cap-developer-documentation-block-editor-handbook-onboarding-for-wordpress-documentation-team\/<\/a><\/li>\n<!-- \/wp:list-item --><\/ul>\n<!-- \/wp:list -->\n\n<!-- wp:heading {\"level\":4} -->\n<h4 class=\"wp-block-heading\">Developer documentation - Themes handbook<\/h4>\n<!-- \/wp:heading -->\n\n<!-- wp:list -->\n<ul><!-- wp:list-item -->\n<li>Located at <a href=\"https:\/\/developer.wordpress.org\/themes\/\">https:\/\/developer.wordpress.org\/themes\/<\/a><\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Recording: <a href=\"https:\/\/wordpress.tv\/2022\/06\/30\/milana-cap-developer-documentation-themes-handbook-onboarding-for-wordpress-documentation-team\/\">https:\/\/wordpress.tv\/2022\/06\/30\/milana-cap-developer-documentation-themes-handbook-onboarding-for-wordpress-documentation-team\/<\/a><\/li>\n<!-- \/wp:list-item --><\/ul>\n<!-- \/wp:list -->\n\n<!-- wp:heading {\"level\":3} -->\n<h3 class=\"wp-block-heading\">Contributor documentation - Documentation team handbook<\/h3>\n<!-- \/wp:heading -->\n\n<!-- wp:list -->\n<ul><!-- wp:list-item -->\n<li>Located at <a href=\"https:\/\/make.wordpress.org\/docs\/handbook\/\">https:\/\/make.wordpress.org\/docs\/handbook\/<\/a><\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Recording: <a href=\"https:\/\/wordpress.tv\/2022\/06\/21\/milana-cap-contributor-documentation-documentation-team-handbook-onboarding-for-wordpress-documentation-tea\/\">https:\/\/wordpress.tv\/2022\/06\/21\/milana-cap-contributor-documentation-documentation-team-handbook-onboarding-for-wordpress-documentation-tea\/<\/a><\/li>\n<!-- \/wp:list-item --><\/ul>\n<!-- \/wp:list -->\n\n<!-- wp:heading {\"level\":3} -->\n<h3 class=\"wp-block-heading\'''
