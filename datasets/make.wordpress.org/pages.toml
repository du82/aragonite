title = "Make WordPress Accessible – Equal Access For All"
description = "Accessibility (commonly shortened to a11y) refers to the design of products, devices, services, or environments for people with disabilities. The concept of accessible design ensures both “direct access” (i.e. unassisted) and “indirect access” meaning compatibility with a person’s assistive technology (for example, computer screen readers). (https://en.wikipedia.org/wiki/Accessibility)"
full_description = '''Nazmul Hasan Robin 5:40 am on February 3, 2025 Tags: accessibility ( 86 ), agenda ( 151 ) Accessibility Team Meeting Agenda: Feb 05, 2025 This is the proposed agenda for the weekly AccessibilityAccessibility Accessibility (commonly shortened to a11y) refers to the design of products, devices, services, or environments for people with disabilities. The concept of accessible design ensures both “direct access” (i.e. unassisted) and “indirect access” meaning compatibility with a person’s assistive technology (for example, computer screen readers). (https://en.wikipedia.org/wiki/Accessibility) Team meeting on Wednesday, February 05, 2025, 15:00 UTC. Updates from working groups Design Documentation General GutenbergGutenberg The Gutenberg project is the new Editor Interface for WordPress. The editor improves the process and experience of creating new content, making writing rich content much simpler. It uses ‘blocks’ to add richness rather than shortcodes, custom HTML etc. https://wordpress.org/gutenberg/ Media MetaMeta Meta is a term that refers to the inside workings of a group. For us, this is the team that works on internal WordPress sites like WordCamp Central and Make WordPress. Themes Open floor If you want to have a topic added to the agenda, please mention it in the comments of this post. The Accessibility Team bug scrub has moved to Tuesdays, 16:00 UTC. This meeting is held in the #accessibility channel in the Making WordPress SlackSlack Slack is a Collaborative Group Chat Platform https://slack.com/. The WordPress community has its own Slack Channel at https://make.wordpress.org/chat/. (requires registration). #accessibility, #agendaLogin to Reply[{"type":"post","id":16780,"postID":16780,"cssClasses":"post post-16780 type-post status-publish format-standard hentry category-accessibility category-agenda category-meetings tag-accessibility tag-agenda author-nhrrob","parentID":0,"titleRaw":"Accessibility Team Meeting Agenda: Feb 05, 2025","titleFiltered":"Accessibility Team Meeting Agenda: Feb 05, 2025","titleWasGeneratedFromContent":false,"contentRaw":"<!-- wp:jetpack\/markdown {\"source\":\"This is the proposed agenda for the weekly Accessibility Team meeting on [time]Wednesday, February 05, 2025, 15:00 UTC[\/time].\\n\\n## Updates from working groups\\n\\n* Design\\n* Documentation\\n* General\\n* Gutenberg\\n* Media\\n* Meta\\n* Themes\\n\\n## Open floor\\n\\nIf you want to have a topic added to the agenda, please mention it in the comments of this post.\\n\\nThe Accessibility Team bug scrub has moved to Tuesdays, 16:00 UTC.\\n\\nThis meeting is held in the [#accessibility](https:\/\/wordpress.slack.com\/messages\/C02RP4X03) channel in the Making WordPress Slack ([requires registration](https:\/\/make.wordpress.org\/chat\/)).\\n\"} -->\n<div class=\"wp-block-jetpack-markdown\"><p>This is the proposed agenda for the weekly Accessibility Team meeting on [time]Wednesday, February 05, 2025, 15:00 UTC[\/time].<\/p>\n<h2>Updates from working groups<\/h2>\n<ul>\n<li>Design<\/li>\n<li>Documentation<\/li>\n<li>General<\/li>\n<li>Gutenberg<\/li>\n<li>Media<\/li>\n<li>Meta<\/li>\n<li>Themes<\/li>\n<\/ul>\n<h2>Open floor<\/h2>\n<p>If you want to have a topic added to the agenda, please mention it in the comments of this post.<\/p>\n<p>The Accessibility Team bug scrub has moved to Tuesdays, 16:00 UTC.<\/p>\n<p>This meeting is held in the <a href=\"https:\/\/wordpress.slack.com\/messages\/C02RP4X03\">#accessibility<\/a> channel in the Making WordPress Slack (<a href=\"https:\/\/make.wordpress.org\/chat\/\">requires registration<\/a>).<\/p>\n<\/div>\n<!-- \/wp:jetpack\/markdown -->\n\n<!-- wp:paragraph -->\n<p><\/p>\n<!-- \/wp:paragraph -->\n\n#accessibility, #agenda","contentFiltered":"<div class=\"wp-block-jetpack-markdown\"><p>This is the proposed agenda for the weekly <span tabindex='0' class='glossary-item-container'>Accessibility<span class='glossary-item-hidden-content'><span class='glossary-item-header'>Accessibility<\/span> <span class='glossary-item-description'>Accessibility (commonly shortened to a11y) refers to the design of products, devices, services, or environments for people with disabilities. The concept of accessible design ensures both \u201cdirect access\u201d (i.e. unassisted) and \u201cindirect access\u201d meaning compatibility with a person\u2019s assistive technology (for example, computer screen readers). (<a href=\"https:\/\/en.wikipedia.org\/wiki\/Accessibility\" rel=\"nofollow\">https:\/\/en.wikipedia.org\/wiki\/Accessibility<\/a>)<\/span><\/span><\/span> Team meeting on <a href=\"https:\/\/www.timeanddate.com\/worldclock\/fixedtime.html?iso=20250205T1500\"><abbr class=\"date\" title=\"2025-02-05T15:00:00+00:00\">Wednesday, February 05, 2025, 15:00 UTC<\/abbr><\/a>.<\/p>\n<h2>Updates from working groups<\/h2>\n<ul>\n<li>Design<\/li>\n<li>Documentation<\/li>\n<li>General<\/li>\n<li><span tabindex='0' class='glossary-item-container'>Gutenberg<span class='glossary-item-hidden-content'><span class='glossary-item-header'>Gutenberg<\/span> <span class='glossary-item-description'>The Gutenberg project is the new Editor Interface for WordPress. The editor improves the process and experience of creating new content, making writing rich content much simpler. It uses \u2018blocks\u2019 to add richness rather than shortcodes, custom HTML etc. <a href=\"https:\/\/wordpress.org\/gutenberg\/\">https:\/\/wordpress.org\/gutenberg\/<\/a><\/span><\/span><\/span><\/li>\n<li>Media<\/li>\n<li><span tabindex='0' class='glossary-item-container'>Meta<span class='glossary-item-hidden-content'><span class='glossary-item-header'>Meta<\/span> <span class='glossary-item-description'>Meta is a term that refers to the inside workings of a group. For us, this is the team that works on internal WordPress sites like WordCamp Central and Make WordPress.<\/span><\/span><\/span><\/li>\n<li>Themes<\/li>\n<\/ul>\n<h2>Open floor<\/h2>\n<p>If you want to have a topic added to the agenda, please mention it in the comments of this post.<\/p>\n<p>The Accessibility Team bug scrub has moved to Tuesdays, 16:00 UTC.<\/p>\n<p>This meeting is held in the <a href=\"https:\/\/wordpress.slack.com\/messages\/C02RP4X03\">#accessibility<\/a> channel in the Making WordPress <span tabindex='0' class='glossary-item-container'>Slack<span class='glossary-item-hidden-content'><span class='glossary-item-header'>Slack<\/span> <span class='glossary-item-description'>Slack is a Collaborative Group Chat Platform <a href=\"https:\/\/slack.com\/\">https:\/\/slack.com\/<\/a>. The WordPress community has its own Slack Channel at <a href=\"https:\/\/make.wordpress.org\/chat\/\">https:\/\/make.wordpress.org\/chat\/<\/a>.<\/span><\/span><\/span> (<a href=\"https:\/\/make.wordpress.org\/chat\/\">requires registration<\/a>).<\/p>\n<\/div>\n\n\n\n<p><\/p>\n<p class=\"o2-appended-tags\"><a href=\"https:\/\/make.wordpress.org\/accessibility\/tag\/accessibility\/\" class=\"tag\"><span class=\"tag-prefix\">#<\/span>accessibility<\/a>, <a href=\"https:\/\/make.wordpress.org\/accessibility\/tag\/agenda\/\" class=\"tag\"><span class=\"tag-prefix\">#<\/span>agenda<\/a><\/p><nav class='o2-post-footer-actions'><ul class='o2-post-footer-action-row'><li class='o2-post-footer-action'><a href=\"https:\/\/login.wordpress.org\/?redirect_to=https%3A%2F%2Fmake.wordpress.org%2Faccessibility%2F2025%2F02%2F03%2Faccessibility-team-meeting-agenda-feb-05-2025%2F%23respond&#038;locale=en_US\" title=\"Login to Reply\" class=\"genericon genericon-reply\" data-action=\"login-to-reply\" data-actionstate=\"default\" >Login to Reply<\/a><\/li><\/ul><div class='o2-post-footer-action-likes'><\/div><ul class='o2-post-footer-action-row'><\/ul><\/nav>","permalink":"https:\/\/make.wordpress.org\/accessibility\/2025\/02\/03\/accessibility-team-meeting-agenda-feb-05-2025\/","unixtime":1738561209,"unixtimeModified":1738561209,"entryHeaderMeta":"","linkPages":"","footerEntryMeta":"","tagsRaw":"accessibility, agenda","tagsArray":[{"label":"accessibility","count":86,"link":"https:\/\/make.wordpress.org\/accessibility\/tag\/accessibility\/"},{"label":"agenda","count":151,"link":"https:\/\/make.wordpress.org\/accessibility\/tag\/agenda\/"}],"loginRedirectURL":"https:\/\/login.wordpress.org\/?redirect_to=https%3A%2F%2Fmake.wordpress.org%2Faccessibility%2F2025%2F02%2F03%2Faccessibility-team-meeting-agenda-feb-05-2025%2F&locale=en_US","hasPrevPost":false,"prevPostTitle":"","prevPostURL":"","hasNextPost":false,"nextPostTitle":"","nextPostURL":"","commentsOpen":true,"is_xpost":false,"editURL":null,"postActions":"<nav class='o2-dropdown-actions o2-post-actions'><button class='o2-dropdown-actions-disclosure genericon genericon-ellipsis'><span>Post Actions<\/span><\/button><ul><li><a href=\"https:\/\/login.wordpress.org\/?redirect_to=https%3A%2F%2Fmake.wordpress.org%2Faccessibility%2F2025%2F02%2F03%2Faccessibility-team-meeting-agenda-feb-05-2025%2F%23respond&#038;locale=en_US\" title=\"Login to Reply\" class=\"genericon genericon-reply\" data-action=\"login-to-reply\" data-actionstate=\"default\" >Login to Reply<\/a><\/li><li><a href=\"https:\/\/make.wordpress.org\/accessibility\/2025\/02\/03\/accessibility-team-meeting-agenda-feb-05-2025\/\" title=\"Scroll to comments\" class=\"o2-scroll-to-comments genericon genericon-downarrow\" data-action=\"scrolltocomments\" data-actionstate=\"default\" >Scroll<\/a><\/li><li><a href=\"https:\/\/make.wordpress.org\/accessibility\/?p=16780\" title=\"Shortlink\" class=\"short-link o2-short-link genericon genericon-link\" data-action=\"shortlink\" data-actionstate=\"default\" >Shortlink<\/a><\/li><\/ul><\/nav>","comments":[],"postFormat":"standard","postMeta":{"isSticky":false},"postTerms":{"category":[{"label":"Accessibility","count":126,"link":"https:\/\/make.wordpress.org\/accessibility\/category\/accessibility\/"},{"label":"Agenda","count":115,"link":"https:\/\/make.wordpress.org\/accessibility\/category\/agenda\/"},{"label":"Meetings","count":239,"link"