title = "Make WordPress Plugins – Resources for WordPress.org plugin developers"
description = "A plugin is a piece of software containing a group of functions that can be added to a WordPress website. They can extend functionality or add new features to your WordPress websites. WordPress plugins are written in the PHP programming language and integrate seamlessly with WordPress. These can be free in the WordPress.org Plugin Directory https://wordpress.org/plugins/ or can be cost-based plugin from a third-party"
full_description = '''Francisco Torres 4:31 pm on February 20, 2025 Tags: directory ( 15 ) Plugin author now linked to WordPress.org profiles The way the pluginPlugin A plugin is a piece of software containing a group of functions that can be added to a WordPress website. They can extend functionality or add new features to your WordPress websites. WordPress plugins are written in the PHP programming language and integrate seamlessly with WordPress. These can be free in the WordPress.org Plugin Directory https://wordpress.org/plugins/ or can be cost-based plugin from a third-party author information is displayed in the directory has changed; it’s now linked to the plugin owner’s public WordPress.orgWordPress.org The community site where WordPress code is created and shared by the users. This is where you can download the source code for WordPress core, plugins and themes as well as the central location for community conversations and organization. https://wordpress.org/ profile. We refer to the field that is displayed under the plugin title and is preceded by either a icon depicting a person or the text ‘By’, this represents the author of the plugin. Who’s the author? Previously This value was taken from the plugin’s headers, from the “Author” and “Author URI” fields. This made it possible for plugin authors to display any name and link to any website. Now This value is taken directly from the plugin owner’s profile. It shows the owner’s display name as set on their WordPress.org profile and a link to their profile. This way, the plugin attribution you see is directly linked to the plugin owner’s WordPress.org profile. FAQ Can plugins pages still include external links? Yes, as long as those links do not contravene the guidelines. External links can be included in the readme file so that they’re displayed on the plugin page, and plugin authors can also add links on their WordPress.org profile page. Does this change apply retroactively to existing plugins? Yes, this is a change to the way it is displayed throughout the directory. Can multiple authors be credited for a single plugin? While only the plugin owner’s display name and profile will be shown under the plugin title, multiple contributors can still be listed on the “Contributors & Developers” section. This can be set in the “Contributors” field in the plugin’s readme file. Can plugin teams still list their company / team / group / brand name instead of a personal profile? Yes, a company/team/group/entity can have one account to manage their plugins, In this case, they should consider the following: Accounts belonging to a company/team/group/entity are not allowed to participate in forums. Community forums are a space for people, not companies or groups. Members can have personal accounts to participate in forums. They can be added as Support Reps in the advanced section of the plugin. All plugins owned by a company/team/group/entity must be under the same account. This means that if they have 8 plugins, those 8 plugins must be under the same account, not under different accounts. When having different brands, you will need to decide what you want to display on all plugins, and users will be able to see all plugins published under that name. I need to change how the author is displayed, what can I do? If the plugin is associated with the correct WordPress.org account, you can simply change the display name in your WordPress.org profile. If this is not the case, you can transfer your plugin to another account. Just remember that if you have multiple plugins, you are expected to transfer all of them so that they are owned by one account (see the previous FAQ for more information). #directoryLogin to Reply[{"type":"post","id":2633,"postID":2633,"cssClasses":"post post-2633 type-post status-publish format-standard hentry category-announcement tag-directory author-frantorres","parentID":0,"titleRaw":"Plugin author now linked to WordPress.org profiles","titleFiltered":"Plugin author now linked to WordPress.org profiles","titleWasGeneratedFromContent":false,"contentRaw":"<!-- wp:paragraph -->\n<p>The way the plugin author information is displayed in the directory has changed; it's now linked to the plugin owner's public WordPress.org profile.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p>We refer to the field that is displayed under the plugin title and is preceded by either a icon depicting a person or the text \u2018By\u2019, this represents the author of the plugin.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:columns -->\n<div class=\"wp-block-columns\"><!-- wp:column -->\n<div class=\"wp-block-column\"><!-- wp:image {\"id\":2635,\"sizeSlug\":\"full\",\"linkDestination\":\"media\"} -->\n<figure class=\"wp-block-image size-full\"><a href=\"https:\/\/make.wordpress.org\/plugins\/files\/2025\/02\/image-1.png\"><img src=\"https:\/\/make.wordpress.org\/plugins\/files\/2025\/02\/image-1.png\" alt=\"A screenshot of what the plugin information looks like in the plugin listings of the directory.\" class=\"wp-image-2635\" \/><\/a><\/figure>\n<!-- \/wp:image --><\/div>\n<!-- \/wp:column -->\n\n<!-- wp:column -->\n<div class=\"wp-block-column\"><!-- wp:image {\"id\":2634,\"sizeSlug\":\"full\",\"linkDestination\":\"media\"} -->\n<figure class=\"wp-block-image size-full\"><a href=\"https:\/\/make.wordpress.org\/plugins\/files\/2025\/02\/image.png\"><img src=\"https:\/\/make.wordpress.org\/plugins\/files\/2025\/02\/image.png\" alt=\"A screenshot of what the plugin information looks like in the header of a single plugin page.\" class=\"wp-image-2634\" \/><\/a><\/figure>\n<!-- \/wp:image --><\/div>\n<!-- \/wp:column --><\/div>\n<!-- \/wp:columns -->\n\n<!-- wp:heading -->\n<h2 class=\"wp-block-heading\">Who's the author?<\/h2>\n<!-- \/wp:heading -->\n\n<!-- wp:heading {\"level\":3} -->\n<h3 class=\"wp-block-heading\">Previously<\/h3>\n<!-- \/wp:heading -->\n\n<!-- wp:paragraph -->\n<p>This value was taken from the plugin's headers, from the \"Author\" and \"Author URI\" fields.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p>This made it possible for plugin authors to display any name and link to any website.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:heading {\"level\":3} -->\n<h3 class=\"wp-block-heading\">Now<\/h3>\n<!-- \/wp:heading -->\n\n<!-- wp:paragraph -->\n<p>This value is taken directly from the plugin owner's profile. It shows the owner's display name as set on their WordPress.org profile and a link to their profile.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p>This way, the plugin attribution you see is directly linked to the plugin owner's WordPress.org profile.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:heading -->\n<h2 class=\"wp-block-heading\">FAQ<\/h2>\n<!-- \/wp:heading -->\n\n<!-- wp:paragraph -->\n<p><strong>Can plugins pages still include external links?<\/strong><\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p>Yes, as long as those links do not contravene the guidelines. External links can be included in the readme file so that they're displayed on the plugin page, and plugin authors can also add links on their WordPress.org profile page.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p><strong>Does this change apply retroactively to existing plugins?<\/strong><\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p>Yes, this is a change to the way it is displayed throughout the directory. <\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p><strong>Can multiple authors be credited for a single plugin?<\/strong><\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p>While only the plugin owner\u2019s display name and profile will be shown under the plugin title, multiple contributors can still be listed on the <strong>\"Contributors &amp; Developers<\/strong>\" section. This can be set in the \"Contributors\" field in the <a href=\"https:\/\/developer.wordpress.org\/plugins\/wordpress-org\/how-your-readme-txt-works\/#readme-header-information\">plugin's readme file<\/a>.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p><strong>Can plugin teams still list their company \/ team \/ group \/ brand name instead of a personal profile?<\/strong><\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p>Yes, a company\/team\/group\/entity can have <strong>one<\/strong> account to manage their plugins, In this case, they should consider the following:<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:list -->\n<ul class=\"wp-block-list\"><!-- wp:list-item -->\n<li>Accounts belonging to a company\/team\/group\/entity are <strong>not allowed to participate in forums<\/strong>. Community forums are a space for people, not companies or groups. Members can have personal accounts to participate in forums. They can be added as Support Reps in the advanced section of the plugin.<\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li>All plugins owned by a company\/team\/group\/entity <strong>must be under the same account<\/strong>. This means that if they have 8 plugins, those 8 plugins must be under the same account, not under different accounts. When having different brands, you will need to decide what you want to display on all plugins, and users will be able to see all plugins published under that name.<\/li>\n<!-- \/wp:list-item --><\/ul>\n<!-- \/wp:list -->\n\n<!-- wp:paragraph -->\n<p><strong>I need to change how the author is displayed, what can I do?<\/strong><\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p>If the plugin is associated with the correct WordPress.org account, you can simply change the display name in your WordPress.org profile.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p>If this is not the case, <a href=\"https:\/\/developer.wordpress.org\/plugins\/wordpress-org\/transferring-your-plugin-to-a-new-owner\/\">you can transfer your plugin to another account<\/a>. Just remember that if you have multiple plugins, you are expected to transfer all of them so that they are owned by one account (see the previous FAQ for more information).<\/p>\n<!-- \/wp:paragraph -->\n\n#directory","contentFiltered":"<p>The way the <span tabindex='0' class='glossary-item-container'>plugin<span class='glossary-item-hidden-content'><span class='glossary-item-header'>Plugin<\/span> <span class='glossary-item-description'>A plugin is a piece of software containing a group of functions that can be added to a WordPress website. They can extend functionality or add new features to your WordPress websites. WordPress plugins are written in the PHP programming language and integrate seamlessly with WordPress. These can be free in the WordPress.org Plugin Directory <a href=\"https:\/\/wordpress.org\/plugins\/\" rel=\"nofollow\">https:\/\/wordpress.org\/plugins\/<\/a> or can be cost-based plugin from a third-party<\/span><\/span><\/span> author information is displayed in the directory has changed; it\u2019s now linked to the plugin owner\u2019s public <span tabindex='0' class='glossary-item-container'>WordPress.org<span class='glossary-item-hidden-content'><span class='glossary-item-header'>WordPress.org<\/span> <span class='glossary-item-description'>The community site where WordPress code is created and shared by the users. This is where you can download the source code for WordPress core, plugins and themes as well as the central location for community conversations and organization. <a href=\"https:\/\/wordpress.org\/\">https:\/\/wordpress.org\/<\/a><\/span><\/span><\/span> profile.<\/p>\n\n\n\n<p>We refer to the field that is displayed under the plugin title and is preceded by either a icon depicting a person or the text \u2018By\u2019, this represents the author of the plugin.<\/p>\n\n\n\n<div class=\"wp-block-columns is-layout-flex wp-container-core-columns-is-layout-1 wp-block-columns-is-layout-flex\">\n<div class=\"wp-block-column is-layout-flow wp-block-column-is-layout-flow\">\n<figure class=\"wp-block-image size-full\"><a href=\"https:\/\/make.wordpress.org\/plugins\/files\/2025\/02\/image-1.png\"><img fetchpriority=\"high\" decoding=\"async\" width=\"483\" height=\"326\" src=\"https:\/\/make.wordpress.org\/plugins\/files\/2025\/02\/image-1.png\" alt=\"A screenshot of what the plugin information looks like in the plugin listings of the directory.\" class=\"wp-image-2635\" srcset=\"https:\/\/make.wordpress.org\/plugins\/files\/2025\/02\/image-1.png 483w, https:\/\/make.wordpress.org\/plugins\/files\/2025\/02\/image-1-300x202.png 300w\" sizes=\"(max-width: 483px) 100vw, 483px\"><\/a><\/figure>\n<\/div>\n\n\n\n<div class=\"wp-block-column is-layout-flow wp-block-column-is-layout-flow\">\n<figure class=\"wp-block-image size-full\"><a href=\"https:\/\/make.wordpress.org\/plugins\/files\/2025\/02\/image.png\"><img decoding=\"async\" width=\"374\" height=\"131\" src=\"https:\/\/make.wordpress.org\/plugins\/files\/2025\/02\/image.png\" alt=\"A screenshot of what the plugin information looks like in the header of a single plugin page.\" class=\"wp-image-2634\" srcset=\"https:\/\/make.wordpress.org\/plugins\/files\/2025\/02\/image.png 374w, https:\/\/make.wordpress.org\/plugins\/files\/2025\/02\/image-300x105.png 300w\" sizes=\"(max-width: 374px) 100vw, 374px\"><\/a><\/figure>\n<\/div>\n<\/div>\n\n\n\n<h2 class=\"wp-block-heading\">Who\u2019s the author?<\/h2>\n\n\n\n<h3 class=\"wp-block-heading\">Previously<\/h3>\n\n\n\n<p>This value was taken from the plugin\u2019s headers, from the \u201cAuthor\u201d and \u201cAuthor URI\u201d fields.<\/p>\n\n\n\n<p>This made it possible for plugin authors to display any name and link to any website.<\/p>\n\n\n\n<h3 class=\"wp-block-heading\">Now<\/h3>\n\n\n\n<p>This value is taken directly from the plugin owner\u2019s profile. It shows the owner\u2019s display name as set on their WordPress.org profile and a link to their profile.<\/p>\n\n\n\n<p>This way, the plugin attribution you see is directly linked to the plugin owner\u2019s WordPress.org profile.<\/p>\n\n\n\n<h2 class=\"wp-block-heading\">FAQ<\/h2>\n\n\n\n<p><strong>Can plugins pages still include external links?<\/strong><\/p>\n\n\n\n<p>Yes, as long as those links do not contravene the guidelines. External links can be included in the readme file so that they\u2019re displayed on the plugin page, and plugin authors can also add links on their WordPress.org profile page.<\/p>\n\n\n\n<p><strong>Does this change apply retroactively to existing plugins?<\/strong><\/p>\n\n\n\n<p>Yes, this is a change to the way it is displayed throughout the directory. <\/p>\n\n\n\n<p><strong>Can multiple authors be credited for a single plugin?<\/strong><\/p>\n\n\n\n<p>While only the plugin owner\u2019s display name and profile will be shown under the plugin title, multiple contributors can still be listed on the <strong>\u201cContributors &amp; Developers<\/strong>\u201d section. This can be set in the \u201cContributors\u201d field in the <a href=\"https:\/\/developer.wordpress.org\/plugins\/wordpress-org\/how-your-readme-txt'''
