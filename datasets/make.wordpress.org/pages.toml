full_description = '''Alex Kirk 4:20 am on January 11, 2025 Shutting down WordPress.org’s Matrix Server After careful evaluation and considering the evolving needs of our community, we have decided to shut down the community.wordpress.org Matrix server on January 31, 2025. With the integration of Single Sign-On (SSO) using WordPress.org accounts on SlackSlack Slack is a Collaborative Group Chat Platform https://slack.com/. The WordPress community has its own Slack Channel at https://make.wordpress.org/chat/., one of the primary advantages of the Matrix solution—simplified onboarding for new contributors—has been effectively addressed. Additionally, with very low usage and no significant demand for Matrix services, maintaining the server is no longer the best use of our resources. The links to the team chat pages from the Make homepage have already been removed, and we’ll remove the individual chat pages when the server has shut down. Thanks to everyone who participated in this effort, especially @ashfame and @psrpinto, but also everyone who helped surface issues with the implementation. Thank you for your understanding and support. If you have any questions or need help transitioning, please don’t hesitate to comment below. Login to Reply[{"type":"post","id":979,"postID":979,"cssClasses":"post post-979 type-post status-publish format-standard hentry category-uncategorized mentions-ashfame mentions-psrpinto author-akirk","parentID":0,"titleRaw":"Shutting down WordPress.org's Matrix Server","titleFiltered":"Shutting down WordPress.org&#8217;s Matrix Server","titleWasGeneratedFromContent":false,"contentRaw":"<!-- wp:paragraph -->\n<p>After careful evaluation and considering the evolving needs of our community, we have decided to shut down the\u00a0<a href=\"http:\/\/community.wordpress.org\/\" target=\"_blank\" rel=\"noreferrer noopener\">community.wordpress.org<\/a>\u00a0Matrix server on January 31, 2025.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p>With the integration of Single Sign-On (SSO) using\u00a0<a href=\"http:\/\/wordpress.org\/\" target=\"_blank\" rel=\"noreferrer noopener\">WordPress.org<\/a>\u00a0accounts on Slack, one of the primary advantages of the Matrix solution\u2014simplified onboarding for new contributors\u2014has been effectively addressed. Additionally, with very low usage and no significant demand for Matrix services, maintaining the server is no longer the best use of our resources.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p>The links to the team chat pages from the <a href=\"https:\/\/make.wordpress.org\/\">Make homepage<\/a> have already been removed, and we'll remove the individual chat pages when the server has shut down.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p>Thanks to everyone who participated in this effort, especially @ashfame and @psrpinto, but also <a href=\"https:\/\/github.com\/WordPress\/matrix\/issues\">everyone who helped surface issues with the implementation<\/a>.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p>Thank you for your understanding and support. If you have any questions or need help transitioning, please don\u2019t hesitate to comment below.<\/p>\n<!-- \/wp:paragraph -->","contentFiltered":"<p>After careful evaluation and considering the evolving needs of our community, we have decided to shut down the\u00a0<a href=\"https:\/\/community.wordpress.org\/\" target=\"_blank\" rel=\"noreferrer noopener\">community.wordpress.org<\/a>\u00a0Matrix server on January 31, 2025.<\/p>\n\n\n\n<p>With the integration of Single Sign-On (SSO) using\u00a0<a href=\"https:\/\/wordpress.org\/\" target=\"_blank\" rel=\"noreferrer noopener\">WordPress.org<\/a>\u00a0accounts on <span tabindex='0' class='glossary-item-container'>Slack<span class='glossary-item-hidden-content'><span class='glossary-item-header'>Slack<\/span> <span class='glossary-item-description'>Slack is a Collaborative Group Chat Platform <a href=\"https:\/\/slack.com\/\">https:\/\/slack.com\/<\/a>. The WordPress community has its own Slack Channel at <a href=\"https:\/\/make.wordpress.org\/chat\/\">https:\/\/make.wordpress.org\/chat\/<\/a>.<\/span><\/span><\/span>, one of the primary advantages of the Matrix solution\u2014simplified onboarding for new contributors\u2014has been effectively addressed. Additionally, with very low usage and no significant demand for Matrix services, maintaining the server is no longer the best use of our resources.<\/p>\n\n\n\n<p>The links to the team chat pages from the <a href=\"https:\/\/make.wordpress.org\/\">Make homepage<\/a> have already been removed, and we\u2019ll remove the individual chat pages when the server has shut down.<\/p>\n\n\n\n<p>Thanks to everyone who participated in this effort, especially <a href=\"https:\/\/profiles.wordpress.org\/ashfame\/\" class=\"mention\"><span class=\"mentions-prefix\">@<\/span>ashfame<\/a> and <a href=\"https:\/\/profiles.wordpress.org\/psrpinto\/\" class=\"mention\"><span class=\"mentions-prefix\">@<\/span>psrpinto<\/a>, but also <a href=\"https:\/\/github.com\/WordPress\/matrix\/issues\">everyone who helped surface issues with the implementation<\/a>.<\/p>\n\n\n\n<p>Thank you for your understanding and support. If you have any questions or need help transitioning, please don\u2019t hesitate to comment below.<\/p>\n<nav class='o2-post-footer-actions'><ul class='o2-post-footer-action-row'><li class='o2-post-footer-action'><a href=\"https:\/\/login.wordpress.org\/?redirect_to=https%3A%2F%2Fmake.wordpress.org%2Fproject%2F2025%2F01%2F11%2Fshutting-down-wordpress-orgs-matrix-server%2F%23respond&#038;locale=en_US\" title=\"Login to Reply\" class=\"genericon genericon-reply\" data-action=\"login-to-reply\" data-actionstate=\"default\" >Login to Reply<\/a><\/li><\/ul><div class='o2-post-footer-action-likes'><\/div><ul class='o2-post-footer-action-row'><\/ul><\/nav>","permalink":"https:\/\/make.wordpress.org\/project\/2025\/01\/11\/shutting-down-wordpress-orgs-matrix-server\/","unixtime":1736569228,"unixtimeModified":1736569228,"entryHeaderMeta":"","linkPages":"","footerEntryMeta":"","tagsRaw":"","tagsArray":[],"loginRedirectURL":"https:\/\/login.wordpress.org\/?redirect_to=https%3A%2F%2Fmake.wordpress.org%2Fproject%2F2025%2F01%2F11%2Fshutting-down-wordpress-orgs-matrix-server%2F&locale=en_US","hasPrevPost":false,"prevPostTitle":"","prevPostURL":"","hasNextPost":false,"nextPostTitle":"","nextPostURL":"","commentsOpen":true,"is_xpost":false,"editURL":null,"postActions":"<nav class='o2-dropdown-actions o2-post-actions'><button class='o2-dropdown-actions-disclosure genericon genericon-ellipsis'><span>Post Actions<\/span><\/button><ul><li><a href=\"https:\/\/login.wordpress.org\/?redirect_to=https%3A%2F%2Fmake.wordpress.org%2Fproject%2F2025%2F01%2F11%2Fshutting-down-wordpress-orgs-matrix-server%2F%23respond&#038;locale=en_US\" title=\"Login to Reply\" class=\"genericon genericon-reply\" data-action=\"login-to-reply\" data-actionstate=\"default\" >Login to Reply<\/a><\/li><li><a href=\"https:\/\/make.wordpress.org\/project\/2025\/01\/11\/shutting-down-wordpress-orgs-matrix-server\/\" title=\"Scroll to comments\" class=\"o2-scroll-to-comments genericon genericon-downarrow\" data-action=\"scrolltocomments\" data-actionstate=\"default\" >Scroll<\/a><\/li><li><a href=\"https:\/\/make.wordpress.org\/project\/?p=979\" title=\"Shortlink\" class=\"short-link o2-short-link genericon genericon-link\" data-action=\"shortlink\" data-actionstate=\"default\" >Shortlink<\/a><\/li><\/ul><\/nav>","comments":[{"type":"comment","id":"615","postID":"979","postTitleRaw":"Shutting down WordPress.org\u2019s Matrix Server","cssClasses":"comment byuser comment-author-akirk bypostauthor even thread-even depth-1","parentID":"0","contentRaw":"Noting that the server was shut down as described on Jan 31 EOD. The chat pages were removed from all the Make sites.","contentFiltered":"<p>Noting that the server was shut down as described on Jan 31 EOD. The chat pages were removed from all the Make sites.<\/p>\n","permalink":"https:\/\/make.wordpress.org\/project\/2025\/01\/11\/shutting-down-wordpress-orgs-matrix-server\/#comment-615","unixtime":1739172664,"loginRedirectURL":"https:\/\/login.wordpress.org\/?redirect_to=https%3A%2F%2Fmake.wordpress.org%2Fproject%2F2025%2F01%2F11%2Fshutting-down-wordpress-orgs-matrix-server%2F%23comment-615&locale=en_US","approved":true,"isTrashed":false,"prevDeleted":"","editURL":null,"depth":1,"commentDropdownActions":"","commentFooterActions":"<div class='o2-comment-actions o2-comment-footer-actions'><ul><li><a class='genericon genericon-reply' href='https:\/\/login.wordpress.org\/?redirect_to=https%3A%2F%2Fmake.wordpress.org%2Fproject%2F2025%2F01%2F11%2Fshutting-down-wordpress-orgs-matrix-server%2F%23comment-615&locale=en_US' >Login to Reply<\/a><\/li><\/ul><\/div>","commentTrashedActions":"<nav class='o2-comment-actions o2-dropdown-actions o2-comment-dropdown-actions'><button class='o2-dropdown-actions-disclosure genericon genericon-ellipsis'><\/button><ul><li><a class='o2-comment-untrash genericon genericon-refresh' href='#' >Untrash<\/a><\/li><\/ul><\/nav>","mentions":[],"mentionContext":"","commentCreated":"1739172664","hasChildren":false,"userLogin":"akirk","userNicename":"akirk"}],"postFormat":"standard","postMeta":{"isSticky":false},"postTerms":{"category":[{"label":"Uncategorized","count":30,"link":"https:\/\/make.wordpress.org\/project\/category\/uncategorized\/"}],"post_tag":[],"post_format":[]},"pluginData":[],"isPage":false,"mentions":["ashfame","psrpinto"],"mentionContext":"","isTrashed":false,"userLogin":"akirk","userNicename":"akirk"}]'''
