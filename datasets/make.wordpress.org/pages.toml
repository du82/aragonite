full_description = '''KafleG 5:05 am on February 10, 2025 Tags: Agenda ( 110 ), Themes team ( 178 ) Themes team meeting agenda for February 11, 2025 The Themes Team holds meetings on the second and fourth Tuesdays every month. For this month, this is the first meeting and is set to take place on 11 February. Meeting Details: Date and Time: Tuesday, February 11, 2025, 15:00 UTC Channel: #themereview (You need WordPress SlackSlack Slack is a Collaborative Group Chat Platform https://slack.com/. The WordPress community has its own Slack Channel at https://make.wordpress.org/chat/. and you need an account to participate. View here how to make a WordPress Slack account.) Alongside the scheduled agendas, we dedicate time at the end of each meeting for an open floor session, where you are invited to ask questions or share any themes-related updates. We strongly encourage all members and anyone interested in the themes to join in. If there are specific topics you’d like to see included in the agenda, please don’t hesitate to add them in the comment section below. Meeting Agendas Weekly updates Open Floor I am looking forward to seeing you at the meeting! #agenda, #themes-teamLogin to Reply[{"type":"post","id":24379,"postID":24379,"cssClasses":"post post-24379 type-post status-publish format-standard hentry category-team-meeting tag-agenda tag-themes-team author-kafleg","parentID":0,"titleRaw":"Themes team meeting agenda for February 11, 2025","titleFiltered":"Themes team meeting agenda for February 11, 2025","titleWasGeneratedFromContent":false,"contentRaw":"<!-- wp:paragraph -->\n<p>The Themes Team holds meetings on the second and fourth Tuesdays every month. For this month, this is the first meeting and is set to take place on 11 February.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p><strong>Meeting Details:<\/strong><\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:list -->\n<ul class=\"wp-block-list\"><!-- wp:list-item -->\n<li>Date and Time:\u00a0<a href=\"https: