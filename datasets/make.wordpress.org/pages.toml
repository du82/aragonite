description = "May 2022: This Contributor Handbook is currently in progress! There will be changes and updates in the months to come. For more information, follow the handbook tag on the Project blog. Welcome to the WordPress Contributor Handbook! The WordPress community welcomes contributors from around the world to help us Make WordPress and Democratize Publishing. This…"
full_description = "Contributor Handbook ↑ Back to top May 2022: This Contributor Handbook is currently in progress! There will be changes and updates in the months to come. For more information, follow the handbook tag on the Project blog. Welcome to the WordPress Contributor Handbook! The WordPress community welcomes contributors from around the world to help us Make WordPress and Democratize Publishing. This handbook aims to express our shared expectations of how we, as contributors, work together, who we want to build our products for, and the WordPress interpretation of modern, open sourceOpen Source Open Source denotes software for which the original source code is made freely available and may be redistributed and modified. Open Source **must be** delivered via a licensing model, see GPL. best practices. In keeping with open source best practices, this handbook is a living document, and will be updated as needed. Your feedback and questions are very welcome! If you have suggested edits for this handbook, please email the Community Team at support@wordcamp.org. The Contributor Handbook includes the following sections: Accessibility in WordPress Privacy Policy Diversity, Equity, Inclusion Statement Community Code of Conduct Incident Response Team Contributor Handbook History While the WordPress community has long discussed a contributor handbook, this current version came into existence around March 2021. It started with a proposal from Josepha Haden, followed by a series of draft documents and discussions in 2022. First published April 22, 2022 Last updated October 7, 2024 Next Community Code of Conduct Next: Community Code of Conduct"
year_published = 2022
