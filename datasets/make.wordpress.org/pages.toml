full_description = '''Nick Diego 4:46 pm on December 10, 2024 Tags: make.wordpress.org/meta ( 2 ), p2-xpost ( 23 ) X-post: The Photos Directory gets a refresh and is now powered by blocks X-post from +make.wordpress.org/meta: The Photos Directory gets a refresh and is now powered by blocks Login to Reply[{"type":"post","id":1910,"postID":1910,"cssClasses":"post post-1910 type-post status-publish format-standard hentry category-status tag-make-wordpress-org-meta tag-p2-xpost author-ndiego","parentID":0,"titleRaw":"X-post: The Photos Directory gets a refresh and is now powered by blocks","titleFiltered":"X-post: The Photos Directory gets a refresh and is now powered by blocks","titleWasGeneratedFromContent":false,"contentRaw":"X-post from <a href=\"https:\/\/make.wordpress.org\/meta\/\" title=\"Make WordPress.org\">&#043;make.wordpress.org\/meta<\/a>: <a href=\"https:\/\/make.wordpress.org\/meta\/2024\/12\/10\/the-photos-directory-gets-a-refresh-and-is-now-powered-by-blocks\/\" title=\"Over the past month and a half, the Meta and Design teams have been working on a new look for the Photos Directory. This visual refresh is part of the continued effort to establish a consistent design language across WordPress.org. I&#039;m pleased to announce that the updated site launched today. Congratulations to everyone who contributed to this project!&nbsp; Here&#039;s a quick look at the before and after. The Photos Directory now uses a block child theme alongside the shared WordPress.org parent theme. This update involved converting all elements to blocks and standardizing the layout, typography, and colors. Now, all directories across WordPress.org share consistent aesthetics and functionality, which simplifies any site-wide enhancements that may be considered in the future. The updated hom&hellip;\">The Photos Directory gets a refresh and is now powered by blocks<\/a>\n\n#make-wordpress-org-meta, #p2-xpost","contentFiltered":"X-post from <a href=\"https:\/\/make.wordpress.org\