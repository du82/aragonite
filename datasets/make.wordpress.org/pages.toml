full_description = '''Bethany Chobanian Lang 6:08 pm on July 26, 2022 Welcome to the Core Performance Team blog! 👋 Welcome to the CoreCore Core is the set of software required to run WordPress. The Core Development Team builds WordPress. Performance Team blog! Because our work is so integrated with WordPress core, plugins, and themes, our blog posts are typically shared on those blogs instead of being posted here. You can view all performance-related blog posts – including core feature and merge proposals, weekly chat agenda and meeting notes, and other discussions – by checking out our tags on those other blogs: https://make.wordpress.org/core/tag/performance/https://make.wordpress.org/plugins/tag/performance/https://make.wordpress.org/themes/tags/performance/ Login to Reply[{"type":"post","id":48,"postID":48,"cssClasses":"post post-48 type-post status-publish format-standard sticky hentry category-uncategorized author-mxbclang","parentID":0,"titleRaw":"Welcome to the Core Performance Team blog!","titleFiltered":"Welcome to the Core Performance Team blog!","titleWasGeneratedFromContent":false,"contentRaw":"<!-- wp:paragraph -->\n<p>\ud83d\udc4b Welcome to the Core Performance Team blog!<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p><p>Because our work is so integrated with WordPress core, plugins, and themes, our blog posts are typically shared on those blogs instead of being posted here.<\/p>\n\n<p>You can view all performance-related blog posts \u2013 including core feature and merge proposals, weekly chat agenda and meeting notes, and other discussions \u2013 by checking out our tags on those other blogs:<\/p><\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:list -->\n<ul><li><a target=\"_blank\" rel=\"noreferrer noopener\" href=\"https:\/\/make.wordpress.org\/core\/tag\/performance\/\">https:\/\/make.wordpress.org\/core\/tag\/performance\/<\/a><\/li><li><a target=\"_blank\" rel=\"noreferrer noopener\" href=\"https:\/\/make.wordpress.org\/plugins\/tag\/performance\/\">https:\/\/make.wordpress.org\/plugins\/tag\/performance\/<\/a><\/li><li><a target=\"_blank\" rel=\"noreferrer noopener\" href=\"https:\/\/make.wordpress.org\/themes\/tags\/performance\/\">https:\/\/make.wordpress.org\/themes\/tags\/performance\/<\/a><\/li><\/ul>\n<!-- \/wp:list -->","contentFiltered":"<p>\ud83d\udc4b Welcome to the <span tabindex='0' class='glossary-item-container'>Core<span class='glossary-item-hidden-content'><span class='glossary-item-header'>Core<\/span> <span class='glossary-item-description'>Core is the set of software required to run WordPress. The Core Development Team builds WordPress.<\/span><\/span><\/span> Performance Team blog!<\/p>\n\n\n\n<p><\/p><p>Because our work is so integrated with WordPress core, plugins, and themes, our blog posts are typically shared on those blogs instead of being posted here.<\/p>\n\n<p>You can view all performance-related blog posts \u2013 including core feature and merge proposals, weekly chat agenda and meeting notes, and other discussions \u2013 by checking out our tags on those other blogs:<\/p>\n\n\n\n<ul class=\"wp-block-list\"><li><a target=\"_blank\" rel=\"noreferrer noopener\" href=\"https:\/\/make.wordpress.org\/core\/tag\/performance\/\">https:\/\/make.wordpress.org\/core\/tag\/performance\/<\/a><\/li><li><a target=\"_blank\" rel=\"noreferrer noopener\" href=\"https:\/\/make.wordpress.org\/plugins\/tag\/performance\/\">https:\/\/make.wordpress.org\/plugins\/tag\/performance\/<\/a><\/li><li><a target=\"_blank\" rel=\"noreferrer noopener\" href=\"https:\/\/make.wordpress.org\/themes\/tags\/performance\/\">https:\/\/make.wordpress.org\/themes\/tags\/performance\/<\/a><\/li><\/ul>\n<nav class='o2-post-footer-actions'><ul class='o2-post-footer-action-row'><li class='o2-post-footer-action'><a href=\"https:\/\/login.wordpress.org\/?redirect_to=https%3A%2F%2Fmake.wordpress.org%2Fperformance%2F2022%2F07%2F26%2Fwelcome-to-the-performance-team-blog%2F%23respond&#038;locale=en_US\" title=\"Login 