title = "Make WordPress Design – A Better User Experience"
description = "Slack is a Collaborative Group Chat Platform https://slack.com/. The WordPress community has its own Slack Channel at https://make.wordpress.org/chat/."
full_description = '''Ahmed Kabir Chaion 1:54 pm on February 27, 2025 Tags: Contributor Day ( 5 ), WordCamp Asia ( 2 ) WordCamp Asia 2025: Contributor Day Recap WordCamp Asia 2025 Contributor Day took place on 20 February 2025 at the Philippine International Convention Center (PICC). The Design Table was led by Ahmed Kabir Chaion ( @chaion07 ). We had a total of 35 people joining both in-person and also remotely using SlackSlack Slack is a Collaborative Group Chat Platform https://slack.com/. The WordPress community has its own Slack Channel at https://make.wordpress.org/chat/.. Contributors collaborated on different focuses including the Design plans for WordPress 6.8. A few Tickets in CoreCore Core is the set of software required to run WordPress. The Core Development Team builds WordPress. TracTrac Trac is the place where contributors create issues for bugs or feature requests much like GitHub.https://core.trac.wordpress.org/. as well as a few Issues were discussed including a review of the Design Handbook. Attendance: @chaion07, @paupaupau555, @kelzo02, @areziaal, @yapalexandra, @nameth, @nellian, @cbsd2025, @hannahsirk1690, @meraldayson, @rotemg, @alikhallad, @mqrshmallcw, @paulitosm24, @wein32, @katzywcasia2025, @yralorescadesign, @sangronesrhiane, @neildinu, @ahmmedsabbirbd, @aion11, @ilonagl, @divyeshk71, @samuel1337, @heycharchar, @artrisi, @utkarshg01, @stealth37, @76tagztech, @coreyhall93. List of Tickets and Issues discussed: #68932 #69174 #69001 #69162 #68932 #62866 Additionally, we discussed more in Core, BlockBlock Block is the abstract term used to describe units of markup that, composed together, form the content or layout of a webpage using the WordPress editor. The idea combines concepts of what in the past may have achieved with shortcodes, custom HTML, and embed discovery into a single consistent API and user experience. Editor on Checkout Issue. We also emphasized on what we can’t customize, what we used to be and not flexible enough. We want to thank the Organizing Team of WordCamp Asia 2025 for hosting the contributor dayContributor Day Contributor Days are standalone days, frequently held before or after WordCamps but they can also happen at any time. They are events where people get together to work on various areas of https://make.wordpress.org/ There are many teams that people can participate in, each with a different focus. https://2017.us.wordcamp.org/contributor-day/ https://make.wordpress.org/support/handbook/getting-started/getting-started-at-a-contributor-day/. and having the design table. We also thank everyone who joined us remotely and #contributor-day, #wordcamp-asiaShare this:Click to share on Threads (Opens in new window)Click to share on Mastodon (Opens in new window)Click to share on Bluesky (Opens in new window)Click to share on Facebook (Opens in new window)Click to share on X (Opens in new window)Click to share on Reddit (Opens in new window)Click to email a link to a friend (Opens in new window)Login to Reply[{"type":"post","id":12766,"postID":12766,"cssClasses":"post post-12766 type-post status-publish format-standard has-post-thumbnail hentry category-contributor-day category-design-team tag-contributor-day tag-wordcamp-asia mentions-76tagztech mentions-ahmmedsabbirbd mentions-aion11 mentions-alikhallad mentions-areziaal mentions-artrisi mentions-cbsd2025 mentions-chaion07 mentions-coreyhall93 mentions-divyeshk71 mentions-hannahsirk1690 mentions-heycharchar mentions-ilonagl mentions-katzywcasia2025 mentions-kelzo02 mentions-meraldayson mentions-mqrshmallcw mentions-nameth mentions-neildinu mentions-nellian mentions-paulitosm24 mentions-paupaupau555 mentions-rotemg mentions-samuel1337 mentions-sangronesrhiane mentions-stealth37 mentions-utkarshg01 mentions-wein32 mentions-yapalexandra mentions-yralorescadesign author-chaion07","parentID":0,"titleRaw":"WordCamp Asia 2025: Contributor Day Recap","titleFiltered":"WordCamp Asia 2025: Contributor Day Recap","titleWasGeneratedFromContent":false,"contentRaw":"<!-- wp:paragraph -->\n<p><a href=\"https:\/\/asia.wordcamp.org\/2025\/contributor-day\/\">WordCamp Asia 2025 Contributor Day<\/a> took place on 20 February 2025 at the Philippine International Convention Center (PICC). The <a href=\"https:\/\/make.wordpress.org\/design\/2025\/02\/18\/join-the-design-table-at-wordcamp-asia-2025-contributor-day\/\">Design Table<\/a> was led by Ahmed Kabir Chaion ( @chaion07 ). We had a total of 35 people joining both in-person and also remotely using Slack. Contributors collaborated on different focuses including the <a href=\"https:\/\/make.wordpress.org\/design\/2025\/01\/15\/design-plans-for-wordpress-6-8\/\"><strong>Design plans for WordPress 6.8<\/strong><\/a>. A few Tickets in Core Trac as well as a few Issues were discussed including a review of the Design Handbook.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p>Attendance: @chaion07, @paupaupau555, @kelzo02, @areziaal, @yapalexandra, @nameth, @nellian, @cbsd2025, @hannahsirk1690, @meraldayson, @rotemg, @alikhallad, @mqrshmallcw, @paulitosm24, @wein32, @katzywcasia2025, @yralorescadesign, @sangronesrhiane, @neildinu, @ahmmedsabbirbd, @aion11, @ilonagl, @divyeshk71, @samuel1337, @heycharchar, @artrisi, @utkarshg01, @stealth37, @76tagztech, @coreyhall93.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:gallery {\"linkTo\":\"file\"} -->\n<figure class=\"wp-block-gallery has-nested-images columns-default is-cropped\"><!-- wp:image {\"id\":12784,\"sizeSlug\":\"large\",\"linkDestination\":\"media\"} -->\n<figure class=\"wp-block-image size-large\"><a href=\"https:\/\/make.wordpress.org\/design\/files\/2025\/02\/MG_1293-1-scaled.jpg\"><img src=\"https:\/\/make.wordpress.org\/design\/files\/2025\/02\/MG_1293-1-1024x683.jpg\" alt=\"\" class=\"wp-image-12784\" \/><\/a><\/figure>\n<!-- \/wp:image -->\n\n<!-- wp:image {\"id\":12780,\"sizeSlug\":\"large\",\"linkDestination\":\"media\"} -->\n<figure class=\"wp-block-image size-large\"><a href=\"https:\/\/make.wordpress.org\/design\/files\/2025\/02\/MG_1729-7-scaled.jpg\"><img src=\"https:\/\/make.wordpress.org\/design\/files\/2025\/02\/MG_1729-7-1024x683.jpg\" alt=\"\" class=\"wp-image-12780\" \/><\/a><\/figure>\n<!-- \/wp:image -->\n\n<!-- wp:image {\"id\":12795,\"sizeSlug\":\"large\",\"linkDestination\":\"media\"} -->\n<figure class=\"wp-block-image size-large\"><a href=\"https:\/\/make.wordpress.org\/design\/files\/2025\/02\/T2S_5823-scaled.jpg\"><img src=\"https:\/\/make.wordpress.org\/design\/files\/2025\/02\/T2S_5823-1024x684.jpg\" alt=\"\" class=\"wp-image-12795\" \/><\/a><\/figure>\n<!-- \/wp:image -->\n\n<!-- wp:image {\"id\":12782,\"sizeSlug\":\"large\",\"linkDestination\":\"media\"} -->\n<figure class=\"wp-block-image size-large\"><a href=\"https:\/\/make.wordpress.org\/design\/files\/2025\/02\/MG_1197-1-scaled.jpg\"><img src=\"https:\/\/make.wordpress.org\/design\/files\/2025\/02\/MG_1197-1-1024x683.jpg\" alt=\"\" class=\"wp-image-12782\" \/><\/a><\/figure>\n<!-- \/wp:image -->\n\n<!-- wp:image {\"id\":12785,\"sizeSlug\":\"large\",\"linkDestination\":\"media\"} -->\n<figure class=\"wp-block-image size-large\"><a href=\"https:\/\/make.wordpress.org\/design\/files\/2025\/02\/MG_1208-scaled.jpg\"><img src=\"https:\/\/make.wordpress.org\/design\/files\/2025\/02\/MG_1208-1024x683.jpg\" alt=\"\" class=\"wp-image-12785\" \/><\/a><\/figure>\n<!-- \/wp:image -->\n\n<!-- wp:image {\"id\":12783,\"sizeSlug\":\"large\",\"linkDestination\":\"media\"} -->\n<figure class=\"wp-block-image size-large\"><a href=\"https:\/\/make.wordpress.org\/design\/files\/2025\/02\/MG_1243-scaled.jpg\"><img src=\"https:\/\/make.wordpress.org\/design\/files\/2025\/02\/MG_1243-1024x683.jpg\" alt=\"\" class=\"wp-image-12783\" \/><\/a><\/figure>\n<!-- \/wp:image -->\n\n<!-- wp:image {\"id\":12781,\"sizeSlug\":\"large\",\"linkDestination\":\"media\"} -->\n<figure class=\"wp-block-image size-large\"><a href=\"https:\/\/make.wordpress.org\/design\/files\/2025\/02\/MG_1298-scaled.jpg\"><img src=\"https:\