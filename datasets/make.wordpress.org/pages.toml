\"\" class=\"wp-image-12788\" \/><\/a><\/figure>\n<!-- \/wp:image -->\n\n<!-- wp:image {\"id\":12789,\"sizeSlug\":\"large\",\"linkDestination\":\"media\"} -->\n<figure class=\"wp-block-image size-large\"><a href=\"https:\/\/make.wordpress.org\/design\/files\/2025\/02\/T2S_6300-scaled.jpg\"><img src=\"https:\/\/make.wordpress.org\/design\/files\/2025\/02\/T2S_6300-1024x684.jpg\" alt=\"\" class=\"wp-image-12789\" \/><\/a><\/figure>\n<!-- \/wp:image -->\n\n<!-- wp:image {\"id\":12792,\"sizeSlug\":\"large\",\"linkDestination\":\"media\"} -->\n<figure class=\"wp-block-image size-large\"><a href=\"https:\/\/make.wordpress.org\/design\/files\/2025\/02\/T2S_6306-scaled.jpg\"><img src=\"https:\/\/make.wordpress.org\/design\/files\/2025\/02\/T2S_6306-1024x684.jpg\" alt=\"\" class=\"wp-image-12792\" \/><\/a><\/figure>\n<!-- \/wp:image -->\n\n<!-- wp:image {\"id\":12794,\"sizeSlug\":\"large\",\"linkDestination\":\"media\"} -->\n<figure class=\"wp-block-image size-large\"><a href=\"https:\/\/make.wordpress.org\/design\/files\/2025\/02\/T2S_6305-scaled.jpg\"><img src=\"https:\/\/make.wordpress.org\/design\/files\/2025\/02\/T2S_6305-1024x684.jpg\" alt=\"\" class=\"wp-image-12794\" \/><\/a><\/figure>\n<!-- \/wp:image -->\n\n<!-- wp:image {\"id\":12786,\"sizeSlug\":\"large\",\"linkDestination\":\"media\"} -->\n<figure class=\"wp-block-image size-large\"><a href=\"https:\/\/make.wordpress.org\/design\/files\/2025\/02\/20250220_153813-scaled.jpg\"><img src=\"https:\/\/make.wordpress.org\/design\/files\/2025\/02\/20250220_153813-1024x768.jpg\" alt=\"\" class=\"wp-image-12786\" \/><\/a><\/figure>\n<!-- \/wp:image --><\/figure>\n<!-- \/wp:gallery -->\n\n<!-- wp:paragraph -->\n<p>List of Tickets and Issues discussed:<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:list {\"ordered\":true} -->\n<ol class=\"wp-block-list\"><!-- wp:list-item -->\n<li><a href=\"https:\/\/github.com\/WordPress\/gutenberg\/issues\/68932\">#68932<\/a><\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li><a href=\"https:\/\/github.com\/WordPress\/gutenberg\/issues\/69174\">#69174<\/a><\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li><a href=\"https:\/\/github.com\/WordPress\/gutenberg\/issues\/69001\">#69001<\/a><\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li><a href=\"https:\/\/github.com\/WordPress\/gutenberg\/issues\/69162\">#69162<\/a><\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li><a href=\"https:\/\/github.com\/WordPress\/gutenberg\/issues\/68932\">#68932<\/a><\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li><a href=\"https:\/\/core.trac.wordpress.org\/ticket\/62866\">#62866<\/a><\/li>\n<!-- \/wp:list-item --><\/ol>\n<!-- \/wp:list -->\n\n<!-- wp:paragraph -->\n<p>Additionally, we discussed more in Core, Block Editor on Checkout Issue. We also emphasized on what we can't customize, what we used to be and not flexible enough.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p>We want to thank the <a href=\"https:\/\/asia.wordcamp.org\/2025\/organizers\/\">Organizing Team of WordCamp Asia 2025<\/a> for hosting the contributor day and having the design table. We also thank everyone who joined us remotely and <\/p>\n<!-- \/wp:paragraph -->\n\n#contributor-day, #wordcamp-asia","contentFiltered":"<p><a href=\"https:\/\/asia.wordcamp.org\/2025\/contributor-day\/\">WordCamp Asia 2025 Contributor Day<\/a> took place on 20 February 2025 at the Philippine International Convention Center (PICC). The <a href=\"https:\/\/make.wordpress.org\/design\/2025\/02\/18\/join-the-design-table-at-wordcamp-asia-2025-contributor-day\/\">Design Table<\/a> was led by Ahmed Kabir Chaion ( <a href=\"https:\/\/profiles.wordpress.org\/chaion07\/\" class=\"mention\"><span class=\"mentions-prefix\">@<\/span>chaion07<\/a> ). We had a total of 35 people joining both in-person and also remotely using <span tabindex='0' class='glossary-item-container'>Slack<span class='glossary-item-hidden-content'><span class='glossary-item-header'>Slack<\/span> <span class='glossary-item-description'>Slack is a Collaborative Group Chat Platform <a href=\"https:\/\/slack.com\/\">https:\/\/slack.com\/<\/a>. The WordPress community has its own Slack Channel at <a href=\"https:\/\/make.wordpress.org\/chat\/\">https:\/\/make.wordpress.org\/chat\/<\/a>.<\/span><\/span><\/span>. Contributors collaborated on different focuses including the <a href=\"https:\/\/make.wordpress.org\/design\/2025\/01\/15\/design-plans-for-wordpress-6-8\/\"><strong>Design plans for WordPress 6.8<\/strong><\/a>. A few Tickets in <span tabindex='0' class='glossary-item-container'>Core<span class='glossary-item-hidden-content'><span class='glossary-item-header'>Core<\/span> <span class='glossary-item-description'>Core is the set of software required to run WordPress. The Core Development Team builds WordPress.<\/span><\/span><\/span> <span tabindex='0' class='glossary-item-container'>Trac<span class='glossary-item-hidden-content'><span class='glossary-item-header'>Trac<\/span> <span class='glossa'''
