["https://make.wordpress.org/media-corps"]
title = "WordPress Media Corps – Welcome to the official blog of the Media Corps for the WordPress open source project."
description = "Slack is a Collaborative Group Chat Platform https://slack.com/. The WordPress community has its own Slack Channel at https://make.wordpress.org/chat/."
full_description = '''Reyes Martínez 11:54 am on September 20, 2024 Mid-project Update and Request for Feedback The Media Corps experimental project already reached its halfway point, so I thought I’d share a mid-project update and start an open discussion to share learnings and feedback. Goal & current status As a quick refresher, the Media Corps experimental project aims to enable independent WordPress marketers and media members to produce excellent quality content with less time and effort. We are currently in Phase 2 (Implementation) and Phase 3 (Monitoring & Measurement) of the roadmap. Since the project began, it has made substantial progress: Media Corps blog and SlackSlack Slack is a Collaborative Group Chat Platform https://slack.com/. The WordPress community has its own Slack Channel at https://make.wordpress.org/chat/. channel: Created in May for a collaborative space. Self-assessment process: Shifted from an initial vetting process to a more open model where folks can self-certify their eligibility before participating. Briefings and support resources: Three briefings have been hosted so far. Based on feedback from the first session, we have also introduced regular updates on Slack and helped provide shareable assets for WordPress 6.6, Learn WordPress, and State of the Word 2024. Participation Here are some stats from the Media Corps’ efforts so far: Media partner interest: The self-assessment form has received 19 responses showing interest in participating in the project and briefings. Briefing attendance and views: WordPress 6.6 briefing: 14 participants attended live, and the recording has received 1,150 views to date. Multi-topic and Learn WordPress briefing: 11 live participants and 350 recording views. Mid-term goals for WordPress briefing: 7 live participants and 294 recording views so far. Observations and challenges Engagement: Around 60% of the media folks who expressed interest in the self-assessment form have shown active participation through briefings, feedback forms, Slack interactions, etc. “WP media” label: While the team has not been classifying self-assessment responses/outlets, I’ve heard concerns that tagging or grouping all folks as media partners or “WP media” can feel unfair, unbalanced, and not entirely accurate for different reasons, including 1) the different levels of engagement, 2) their different focuses and content interests, and 3) the difference in resources (e.g., some corporate outlets may have more resources/funds that other indie outlets don’t). Briefings: As an observation, attendance has declined throughout briefings. Beyond time zone and language challenges, and considering the diverse media folks’ needs and focuses, the overall impact that these sessions are having on supporting their content efforts is still a bit unclear. Request for feedback To better understand whether the experimental project is delivering value as is or might need future iterations or changes, here are a few questions I’d love to hear your thoughts on: How helpful have the briefing sessions been in supporting your news or content production efforts so far? Have you found other support resources, such as Slack updates or interactions, shareable assets, or briefing recaps, useful for your work? Has the Media Corps helped improve your ability to stay informed and report news or produce content? If so, how? What do you believe is the most significant impact the Media Corps has had on your work (if any)? What improvements or changes would you suggest for the Media Corps to support or engage the different types of outlets? Please share your feedback in the comments below by October 5, 2024. Thanks! Login to Reply[{"type":"post","id":240,"postID":240,"cssClasses":"post post-240 type-post status-publish format-standard hentry category-uncategorized mentions-acirujano author-rmartinezduque","parentID":0,"titleRaw":"Mid-project Update and Request for Feedback","titleFiltered":"Mid-project Update and Request for Feedback","titleWasGeneratedFromContent":false,"contentRaw":"<!-- wp:paragraph -->\n<p>The Media Corps experimental project already reached its halfway point, so I thought I\u2019d share a mid-project update and start an open discussion to share learnings and feedback.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:heading -->\n<h2 class=\"wp-block-heading\">Goal &amp; current status<\/h2>\n<!-- \/wp:heading -->\n\n<!-- wp:paragraph -->\n<p>As a quick refresher, the Media Corps experimental project aims to enable independent WordPress marketers and media members to produce excellent quality content with less time and effort.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p>We are currently in Phase 2 (Implementation) and Phase 3 (Monitoring &amp; Measurement) of the <a href=\"https:\/\/make.wordpress.org\/media-corps\/2024\/05\/03\/wordpress-media-corps-initial-roadmap\/\">roadmap<\/a>. Since the project began, it has made substantial progress:<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:list -->\n<ul class=\"wp-block-list\"><!-- wp:list-item -->\n<li><strong>Media Corps blog and Slack channel<\/strong>: Created in May for a collaborative space.<\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li><strong>Self-assessment process<\/strong>: Shifted from an initial vetting process to a <a href=\"https:\/\/make.wordpress.org\/media-corps\/2024\/06\/18\/update-on-the-media-corps-process-and-open-call-for-participation\/\">more open model where folks can self-certify<\/a> their eligibility before participating.<\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li><strong>Briefings and support resources: <\/strong>Three <a href=\"https:\/\/make.wordpress.org\/media-corps\/tag\/media-corps-briefing\/\">briefings<\/a> have been hosted so far. Based on <a href=\"https:\/\/make.wordpress.org\/media-corps\/2024\/07\/25\/first-briefing-retrospective-and-next-steps\/\">feedback from the first session<\/a>, we have also introduced regular updates on Slack and helped provide shareable assets for <a href=\"https:\/\/drive.google.com\/drive\/folders\/1mfIV86epDm6ElSXcteWyQ3IYhy34rk9B?usp=drive_link\">WordPress 6.6<\/a>, <a href=\"https:\/\/drive.google.com\/drive\/folders\/1Tl6nFFfdD6hb6dd0faqRp_NZz0dVm33Z?usp=drive_link\">Learn WordPress<\/a>, and <a href=\"https:\/\/drive.google.com\/drive\/folders\/1_64dZnhcgve9er58mE1ROtyqG9dLwjiL?usp=drive_link\">State of the Word 2024<\/a>.<\/li>\n<!-- \/wp:list-item --><\/ul>\n<!-- \/wp:list -->\n\n<!-- wp:heading -->\n<h2 class=\"wp-block-heading\">Participation<\/h2>\n<!-- \/wp:heading -->\n\n<!-- wp:paragraph -->\n<p>Here are some stats from the Media Corps' efforts so far:<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:list -->\n<ul class=\"wp-block-list\"><!-- wp:list-item -->\n<li><strong>Media partner interest<\/strong>: The self-assessment form has received 19 responses showing interest in participating in the project and briefings.<\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li><strong>Briefing attendance and views<\/strong>:<!-- wp:list -->\n<ul class=\"wp-block-list\"><!-- wp:list-item -->\n<li><a href=\"https:\/\/make.wordpress.org\/media-corps\/2024\/07\/03\/recap-of-the-media-corps-briefing-on-wordpress-6-6\/\">WordPress 6.6 briefing<\/a>: 14 participants attended live, and the <a href=\"https:\/\/www.youtube.com\/watch?v=MRUAzefDhjI\">recording<\/a> has received 1,150 views to date.<\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li><a href=\"https:\/\/www.youtube.com\/watch?v=698ttnBjzCc\">Multi-topic and Learn WordPress briefing<\/a>: 11 live participants and 350 <a href=\"https:\/\/www.youtube.com\/watch?v=698ttnBjzCc\">recording<\/a> views.<\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li><a href=\"https:\/\/make.wordpress.org\/media-corps\/2024\/09\/13\/recap-of-the-mid-term-goals-for-wordpress-briefing\/\">Mid-term goals for WordPress briefing<\/a>: 7 live participants and 294 <a href=\"https:\/\/www.youtube.com\/watch?v=UICfoft5ubU\">recording<\/a> views so far.<\/li>\n<!-- \/wp:list-item --><\/ul>\n<!-- \/wp:list --><\/li>\n<!-- \/wp:list-item --><\/ul>\n<!-- \/wp:list -->\n\n<!-- wp:heading -->\n<h2 class=\"wp-block-heading\">Observations and challenges<\/h2>\n<!-- \/wp:heading -->\n\n<!-- wp:list -->\n<ul class=\"wp-block-list\"><!-- wp:list-item -->\n<li><strong>Engagement<\/strong>: Around 60% of the media folks who expressed interest in the self-assessment form have shown active participation through briefings, feedback forms, Slack interactions, etc.<\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li><strong>\u201cWP media\u201d label:<\/strong> While the team has not been classifying self-assessment responses\/outlets, I\u2019ve heard concerns that tagging or grouping all folks as media partners or \u201cWP media\u201d can feel unfair, unbalanced, and not entirely accurate for different reasons, including 1) the different levels of engagement, 2) their different focuses and content interests, and 3) the difference in resources (e.g., some corporate outlets may have more resources\/funds that other indie outlets don't).<\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li><strong>Briefings<\/strong>: As an observation, attendance has declined throughout briefings. Beyond time zone and language challenges, and considering the diverse media folks\u2019 needs and focuses, the overall impact that these sessions are having on supporting their content efforts is still a bit unclear.<\/li>\n<!-- \/wp:list-item --><\/ul>\n<!-- \/wp:list -->\n\n<!-- wp:heading -->\n<h2 class=\"wp-block-heading\">Request for feedback<\/h2>\n<!-- \/wp:heading -->\n\n<!-- wp:paragraph -->\n<p>To better understand whether the experimental project is delivering value as is or might need future iterations or changes, here are a few questions I\u2019d love to hear your thoughts on:<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:list -->\n<ul class=\"wp-block-list\"><!-- wp:list-item -->\n<li>How helpful have the briefing sessions been in supporting your news or content production efforts so far?<\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Have you found other support resources, such as Slack updates or interactions, shareable assets, or briefing recaps, useful for your work?<\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Has the Media Corps helped improve your ability to stay informed and report news or produce content? If so, how?<\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li>What do you believe is the most significant impact the Media Corps has had on your work (if any)?<\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li>What improvements or changes would you suggest for the Media Corps to support or engage the different types of outlets?<\/li>\n<!-- \/wp:list-item --><\/ul>\n<!-- \/wp:list -->\n\n<!-- wp:paragraph -->\n<p>Please share your feedback in the comments below by October 5, 2024. Thanks!<\/p>\n<!-- \/wp:paragraph -->","contentFiltered":"<p>The Media Corps experimental project already reached its halfway point, so I thought I\u2019d share a mid-project update and start an open discussion to share learnings and feedback.<\/p>\n\n\n\n<h2 class=\"wp-block-heading\">Goal &amp; current status<\/h2>\n\n\n\n<p>As a quick refresher, the Media Corps experimental project aims to enable independent WordPress marketers and media members to produce excellent quality content with less time and effort.<\/p>\n\n\n\n<p>We are currently in Phase 2 (Implementation) and Phase 3 (Monitoring &amp; Measurement) of the <a href=\"https:\/\/make.wordpress.org\/media-corps\/2024\/05\/03\/wordpress-media-corps-initial-roadmap\/\">roadmap<\/a>. Since the project began, it has made substantial progress:<\/p>\n\n\n\n<ul class=\"wp-block-list\">\n<li><strong>Media Corps blog and <span tabindex='0' class='glossary-item-container'>Slack<span class='glossary-item-hidden-content'><span class='glossary-item-header'>Slack<\/span> <span class='glossary-item-description'>Slack is a Collaborative Group Chat Platform <a href=\"https:\/\/slack.com\/\">https:\/\/slack.com\/<\/a>. The WordPress community has its own Slack Channel at <a href=\"https:\/\/make.wordpress.org\/chat\/\">https:\/\/make.wordpress.org\/chat\/<\/a>.<\/span><\/span><\/span> channel<\/strong>: Created in May for a collaborative space.<\/li>\n\n\n\n<li><strong>Self-assessment process<\/strong>: Shifted from an initial vetting process to a <a href=\"https:\/\/make.wordpress.org\/media-corps\/2024\/06\/18\/update-on-the-media-corps-process-and-open-call-for-participation\/\">more open model where folks can self-certify<\/a> their eligibility before participating.<\/li>\n\n\n\n<li><strong>Briefings and support resources: <\/strong>Three <a href=\"https:\/\/make.wordpress.org\/media-corps\/tag\/media-corps-briefing\/\">briefings<\/a> have been hosted so far. Based on <a href=\"https:\/\/make.wordpress.org\/media-corps\/2024\/07\/25\/first-briefing-retrospective-and-next-steps\/\">feedback from the first session<\/a>, we have also introduced regular updates on Slack and helped provide shareable assets for <a href=\"https:\/\/drive.google.com\/drive\/folders\/1mfIV86epDm6ElSXcteWyQ3IYhy34rk9B?usp=drive_link\">WordPress 6.6<\/a>, <a href=\"https:\/\/drive.google.com\/drive\/folders\/1Tl6nFFfdD6hb6dd0faqRp_NZz0dVm33Z?usp=drive_link\">Learn WordPress<\/a>, and <a href=\"https:\/\/drive.google.com\/drive\/folders\/1_64dZnhcgve9er58mE1ROtyqG9dLwjiL?usp=drive_link\">State of the Word 2024<\/a>.<\/li>\n<\/ul>\n\n\n\n<h2 class=\"wp-block-heading\">Participation<\/h2>\n\n\n\n<p>Here are some stats from the Media Corps\u2019 efforts so far:<\/p>\n\n\n\n<ul class=\"wp-block-list\">\n<li><strong>Media partner interest<\/strong>: The self-assessment form has received 19 responses showing interest in participating in the project and briefings.<\/li>\n\n\n\n<li><strong>Briefing attendance and views<\/strong>:\n<ul class=\"wp-block-list\">\n<li><a href=\"https:\/\/make.wordpress.org\/media-corps\/2024\/07\/03\/recap-of-the-media-corps-briefing-on-wordpress-6-6\/\">WordPress 6.6 briefing<\/a>: 14 participants attended live, and the <a href=\"https:\/\/www.youtube.com\/watch?v=MRUAzefDhjI\">recording<\/a> has received 1,150 views to date.<\/li>\n\n\n\n<li><a href=\"https:\/\/www.youtube.com\/watch?v=698ttnBjzCc\">Multi-topic and Learn WordPress briefing<\/a>: 11 live participants and 350 <a href=\"https:\/\/www.youtube.com\/watch?v=698ttnBjzCc\">recording<\/a> views.<\/li>\n\n\n\n<li><a href=\"https:\/\/make.wordpress.org\/media-corps\/2024\/09\/13\/recap-of-the-mid-term-goals-for-wordpress-briefing\/\">Mid-term goals for WordPress briefing<\/a>: 7 live participants and 294 <a href=\"https:\/\/www.youtube.com\/watch?v=UICfoft5ubU\">recording<\/a> views so far.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n\n\n\n<h2 class=\"wp-block-heading\">Observations and challenges<\/h2>\n\n\n\n<ul class=\"wp-block-list\">\n<li><strong>Engagement<\/strong>: Around 60% of the media folks who'''
