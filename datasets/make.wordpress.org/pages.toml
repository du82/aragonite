title = "WordPress Chat"
description = "Slack is a Collaborative Group Chat Platform https://slack.com/. The WordPress community has its own Slack Channel at https://make.wordpress.org/chat/."
full_description = "The WordPress project uses Slack as its main real-time communication platform, replacing previous communication platforms such as IRC. When compiling a list of things people liked about our previous communication methods, it was obvious that SlackSlack Slack is a Collaborative Group Chat Platform https://slack.com/. The WordPress community has its own Slack Channel at https://make.wordpress.org/chat/. was all of that and more, including: Open for everyone Friendly user interface Easy asynchronous conversation iOSiOS The operating system used on iPhones and iPads. and Android apps Powerful customization abilities Excellent search WordPress historically used IRC for its real-time communication, and is still where the real-time #wordpress support channel exists. Slack communication is used for contributing to the WordPress project, be it code, design, documentation, etc. Set up a WordPress.org and Slack account for the Make WordPress Channel I need help with WordPress! Please note that there is no support channel for WordPress on Slack. The best place to get support is the WordPress.org support forums which are highly active and well maintained. Joining the WordPress team on Slack Please log in to WordPress.org first to join. I need help with Slack! For starters, Slack’s Help Center is really great. Once you’ve joined wordpress.slack.com, there is a #slackhelp channel to help members of the community. Here are some tips for getting the most out of Slack: Notifications The default notification settings for Slack send you everything. You’re going to want to switch to the recommended settings, which are for mentions and direct messages. You can also tweak these settings further, like setting specific “highlight” words and email preferences. Native Desktop and Mobile Apps Slack has a great, fully-featured web app, native Mac and Windows apps, and iOS and Android apps. Preferences, conversations, and what you’ve read are synced across devices. Push notifications on the go are pretty cool, too. Hiding Join Messages If the join/leave messages feel somewhat noisy, you may find the following user style helpful; it will hide them for you. Gravatars You can (and should!) add your special @chat.wordpress.org email to Gravatar. Keyboard Shortcuts Slack has many useful keyboard shortcuts. Access a list by typing Cmd-?. For example, Shift-Opt-↑ (up or down arrow) to switch to the next unread channel. Cmd-K or Cmd-T is a “quick switcher” that allows you to jump to any channel quickly. More keyboard shortcuts. Commands Much like IRC you can use Slack commands in the format /command where you start with a forward slash and then type the given command to perform an action. For example, /away to toggle status, /me to describe something you’re doing, or /prefs to open Preferences menu. More commands. TracTrac Trac is the place where contributors create issues for bugs or feature requests much like GitHub.https://core.trac.wordpress.org/. Integration Slack has dozens of powerful integrations with other services. We’ve already added a number of them, along with some custom tools using Slack’s webhooks. Trac and SVNSVN Apache Subversion (often abbreviated SVN, after its command name svn) is a software versioning and revision control system. Software developers use Subversion to maintain current and historical versions of files such as source code, web pages, and documentation. Its goal is to be a mostly compatible successor to the widely used Concurrent Versions System (CVS). WordPress core and the wordpress.org released code are all centrally managed through SVN. https://subversion.apache.org/. bots served the project well in IRC for years. We’ve brought this functionality to Slack, and looks better, too. When you enter #12345, a bot helpfully prints that ticket’s URLURL A specific web address of a website or web page on the Internet, such as a website’s URL www.wordpress.org and info. You can specify a specific Trac using #12345-core or #123-meta; otherwise, it is guided by the channel you are in. If you want to suggest an integration or tool for a channel, or report a bug or issue, join #slackhelp. WordPress Color Themes Just enter #23282d,#191E23,#0073AA,#FFFFFF,#191E23,#FFFFFF,#46B450,#00A0D2 into Preferences → SidebarSidebar A sidebar in WordPress is referred to a widget-ready area used by WordPress themes to display information that is not a part of the main content. It is not always a vertical column on the side. It can be a horizontal rectangle below or above the content area, footer, header, or any where in the theme. Theme. For a theme that mimics the excellent “Midnight” WordPress admin color scheme, try #363B3F, #26292C, #E14D43, #FFFFFF, #26292C, #FFFFFF, #E14D43, #E14D43. See 11 Useful Tips for Getting the Most out of Slack and Slack’s Help Center for more goodies."
