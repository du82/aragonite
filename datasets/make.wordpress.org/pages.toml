["https://make.wordpress.org"]
title = "Get Involved – WordPress.org"
description = "Whether you’re a developer, a designer, or want to push the community forward, we’re always looking for people to join us in making WordPress even better."
full_description = "Teams Core The coreCore Core is the set of software required to run WordPress. The Core Development Team builds WordPress. team makes WordPress. Whether you’re a seasoned PHPPHP PHP (recursive acronym for PHP: Hypertext Preprocessor) is a widely-used open source general-purpose scripting language that is especially suited for web development and can be embedded into HTML. https://www.php.net/manual/en/preface.php., HTMLHTML HTML is an acronym for Hyper Text Markup Language. It is a markup language that is used in the development of web pages and websites., JavaScriptJavaScript JavaScript or JS is an object-oriented computer programming language commonly used to create interactive effects within web browsers. WordPress makes extensive use of JS for a better user experience. While PHP is executed on the server, JS executes within a user’s browser. https://www.javascript.com/. or CSSCSS CSS is an acronym for cascading style sheets. This is what controls the design or look and feel of a site. developer or are just learning to code, we’d love to have you on board. You can write code, fix bugs, debate decisions, and help with development. Next meeting: Bugscrub 6.8 (+10 more)Mon Mar 03 17:00:00 2025 UTC (1 day from now) Design The design group is focused on the designing and developing the user interface. It’s a home for designers and UXers alike. There are regular discussions about mockups, design, and user testing. Mobile The mobile team builds the iOSiOS The operating system used on iPhones and iPads. and Android apps. Lend them your Kotlin, Swift, or ReactReact React is a JavaScript library that makes it easy to reason about, construct, and maintain stateless and stateful user interfaces. https://reactjs.org/. Native skills. The team also needs designers, UXUX UX is an acronym for User Experience – the way the user uses the UI. Think ‘what they are doing’ and less about how they do it. experts, and testers to give users a smooth experience on every device. Accessibility The a11yAccessibility Accessibility (commonly shortened to a11y) refers to the design of products, devices, services, or environments for people with disabilities. The concept of accessible design ensures both “direct access” (i.e. unassisted) and “indirect access” meaning compatibility with a person’s assistive technology (for example, computer screen readers). (https://en.wikipedia.org/wiki/Accessibility) group provides accessibilityAccessibility Accessibility (commonly shortened to a11y) refers to the design of products, devices, services, or environments for people with disabilities. The concept of accessible design ensures both “direct access” (i.e. unassisted) and “indirect access” meaning compatibility with a person’s assistive technology (for example, computer screen readers). (https://en.wikipedia.org/wiki/Accessibility) expertise across the project. They make sure that WordPress coreCore Core is the set of software required to run WordPress. The Core Development Team builds WordPress. and all of WordPress’ resources are accessible. Next meeting: Accessibility Bug Scrub (+1 more)Tue Mar 04 15:00:00 2025 UTC (2 days from now) accessible via #accessibility on Slack Polyglots WordPress is used all over the world and in many different languages. If you’re a polyglot, help out by translating WordPress into your own language. You can also assist with creating the tools that make translations easier. Next meeting: Polyglots Team Chat (Asia-Pacific) (+2 more)Wed Mar 05 07:00:00 2025 UTC (3 days from now) accessible via #polyglots on Slack Support Answering a question in the support forums or IRC is one of the easiest ways to start contributing. Everyone knows the answer to something! This blog is the place for discussion of issues around support. Next meeting: Support Team Fortnight ChatThu Mar 06 17:00:00 2025 UTC (4 days from now) accessible via #forums on Slack Documentation Good documentation lets people help themselves when they get stuck. The docs team is responsible for creating documentation and is always on the look-out for writers. The blog has discussion around the team’s current projects. Next meeting: Documentation team meeting (+2 more)Tue Mar 04 14:00:00 2025 UTC (2 days from now) accessible via #docs on Slack Themes The Theme Review Team reviews and approves every Theme submitted to the WordPress Theme repository. Reviewing Themes sharpens your own Theme development skills. You can help out and join the discussion on the blog. Next meeting: Default theme scrub (+1 more)Mon Mar 03 13:00:00 2025 UTC (1 day from now) Plugins If you are a PluginPlugin A plugin is a piece of software containing a group of functions that can be added to a WordPress website. They can extend functionality or add new features to your WordPress websites. WordPress plugins are written in the PHP programming language and integrate seamlessly with WordPress. These can be free in the WordPress.org Plugin Directory https://wordpress.org/plugins/ or can be cost-based plugin from a third-party developer, subscribe to the Plugin review team blog to keep up with the latest updates, find resources, and learn about any issues around Plugin development. Community If you’re interested in organizing a meetupMeetup All local/regional gatherings that are officially a part of the WordPress world but are not WordCamps are organized through https://www.meetup.com/. A meetup is typically a chance for local WordPress users to get together and share new ideas and seek help from one another. Searching for ‘WordPress’ on meetup.com will help you find options in your area. or a WordCampWordCamp WordCamps are casual, locally-organized conferences covering everything related to WordPress. They’re one of the places where the WordPress community comes together to teach one another what they’ve learned throughout the year and share the joy. Learn more., the community blog is a great place to get started. There are groups working to support events, to create outreach and training programs, and generally support the community. Next meeting: Community Team meeting (Asia-Pacific / EMEA) (+1 more)Thu Mar 06 12:00:00 2025 UTC (4 days from now) accessible via #community-team on Slack Meta The MetaMeta Meta is a term that refers to the inside workings of a group. For us, this is the team that works on internal WordPress sites like WordCamp Central and Make WordPress. team makes WordPress.orgWordPress.org The community site where WordPress code is created and shared by the users. This is where you can download the source code for WordPress core, plugins and themes as well as the central location for community conversations and organization. https://wordpress.org/, provides support, and builds tools for use by all the contributor groups. If you want to help make WordPress.org better, sign up for updates from the Meta blog. Next meeting: Meta Team Biweekly ChatWed Mar 05 19:00:00 2025 UTC (4 days from now) accessible via #meta on Slack Training The WordPress training team helps people learn to use, extend, and contribute to WordPress through synchronous and asynchronous learning as well as downloadable lesson plans for instructors to use in live environments, via learn.wordpress.org. If you enjoy teaching people how to use and build stuff for WordPress, immediately stop what you’re doing and join our team! Next meeting: Training Team weekly meetings (+1 more)Tue Mar 04 07:00:00 2025 UTC (2 days from now) accessible via #training on Slack Test The Test Team works to improve WordPress quality and usability by advancing the development process through manual and automated testing. Whether through a browser, app, terminal, or code, the team focuses on testing across the entire WordPress ecosystem, including CoreCore Core is the set of software required to run WordPress. The Core Development Team builds WordPress. and GutenbergGutenberg The Gutenberg project is the new Editor Interface for WordPress. The editor improves the process and experience of creating new content, making writing rich content much simpler. It uses ‘blocks’ to add richness rather than shortcodes, custom HTML etc. https://wordpress.org/gutenberg/, mobile apps and themes, and feature plugins and importers. Next meeting: Test Team Triage (+1 more)Wed Mar 05 16:00:00 2025 UTC (3 days from now) accessible via #core-test on Slack TV The TV team reviews and approves every video submitted to WordPress.tv. They also help WordCamps with video post-production and are responsible for the captioning and subtitling of published videos. Reviewing videos is a great way to learn about WordPress and help the community: experience is not required to get involved. Next meeting: WordPress.tv Team Weekly ChatThu Mar 06 15:00:00 2025 UTC (4 days from now) accessible via #wptv on Slack Marketing The Marketing team is currently archived to make room for an experimental shift in focus and processes. Check out the WordPress Media Corps to learn more. Amplification requests and Showcase activities are still running, and you can find out more about them on GitHub. CLI WP-CLIWP-CLI WP-CLI is the Command Line Interface for WordPress, used to do administrative and development tasks in a programmatic way. The project page is http://wp-cli.org/ https://make.wordpress.org/cli/ is the official command line tool for interacting with and managing your WordPress sites. Hosting We work to improve WordPress’ end-user experience across hosting environments through industry collaboration and user education. Come join us! Tide Tide is a series of automated tests run against every pluginPlugin A plugin is a piece of software containing a group of functions that can be added to a WordPress website. They can extend functionality or add new features to your WordPress websites. WordPress plugins are written in the PHP programming language and integrate seamlessly with WordPress. These can be free in the WordPress.org Plugin Directory https://wordpress.org/plugins/ or can be cost-based plugin from a third-party and theme in the directory and then displays PHPPHP PHP (recursive acronym for PHP: Hypertext Preprocessor) is a widely-used open source general-purpose scripting language that is especially suited for web development and can be embedded into HTML. https://www.php.net/manual/en/preface.php. compatibility and test errors/warnings in the directory. Next meeting: Tide Weekly ChatTue Mar 11 18:00:00 2025 UTC (1 week from now) accessible via #tide on Slack Openverse Openverse is a search engine for openly-licensed media. The Openverse team implements new features and new media types; maintains the public APIAPI An API or Application Programming Interface is a software intermediary that allows programs to interact with each other and share data in limited, clearly defined ways. and front-end search engine; and develops WordPress integrations to share Openverse with the entire WordPress community. Next meeting: Openverse Development Weekly ChatMon Mar 03 15:00:00 2025 UTC (1 day from now) accessible via #openverse on Slack Photos The Photo Directory team moderates every photo submitted to the WordPress Photo Directory, maintains and improves the directory site itself, and provides resources and documentation to educate, encourage, and facilitate photo contributors. Next meeting: Photo Directory Team MeetingFri Mar 07 13:00:00 2025 UTC (5 days from now) accessible via #photos on Slack Core Performance The coreCore Core is the set of software required to run WordPress. The Core Development Team builds WordPress. performance team is dedicated to monitoring, enhancing, and promoting performance in WordPress core and its surrounding ecosystem. Next meeting: Performance Office Hours (+2 more)Tue Mar 11 16:00:00 2025 UTC (1 week from now) accessible via #core-performance on Slack Media Corps The WordPress Media Corps is a new experimental project that aims to enable independent WordPress marketers and media members to produce excellent quality content with less time and effort. Playground The Playground team works on WordPress Playground: the platform that lets you run WordPress instantly on any device without a host, most often in a browser. Next meeting: Playground Team MeetingFri Mar 14 14:00:00 2025 UTC (2 weeks from now) accessible via #playground on Slack Not sure which team to contribute to? Check out our contributor wizard and find how to get started. Shape the future of WordPress Become a Five for the Future participant. Contribute as an organization Contribute as an individual"
