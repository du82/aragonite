title = "Make-A-Video"
description = """
Make-A-Video          Make-A-Video research builds on the recent progress made in text-to-image generation technology built to enable text-to-video generation. The system uses images with descriptions to learn what the world looks like and how it is often described. It also uses unlabeled videos to learn how the world moves. With this data, Make-A-Video lets you bring your imagination to life by generating whimsical, one-of-a-kind videos with just a few words or lines of text.        
                                                  A dog wearing a Superhero outfit with red cape flying through the sky"""
full_description = "Let us know if you’re interested in gaining access to any future releases of our Make-A-Video research Meta AI is committed to developing responsible AI and ensuring the safe use of this state-of-the-art video technology. Our research takes the following steps to reduce the creation of harmful, biased, or misleading content. This technology analyzes millions of pieces of data to learn about the world. As a way to reduce the risk of harmful content being generated, we examine, applied, and iterated on filters to reduce the potential for harmful content to surface in videos. Since Make-A-Video can create content that looks realistic, we add a watermark to all videos we generate. This will help ensure viewers know the video was generated with AI and is not a captured video. Our goal is to eventually make this technology available to the public, but for now we will continue to analyze, test, and trial Make-A-Video to ensure that each step of release is safe and intentional. Uriel Singer*, Adam Polyak*, Thomas Hayes*, Xi Yin*, Jie An, Songyang Zhang, Qiyuan (Isabelle) Hu, Harry Yang, Oron Ashual, Oran Gafni, Devi Parikh*, Sonal Gupta*, Yaniv Taigman* Mustafa Said Mehmetoglu, Jacob Xu, Katayoun Zand, Jia-Bin Huang, Jiebo Luo, Shelly Sheynin, Nadav Benedek, Shoshana Swell, Chantal Mora, Ana Paula Kirschner Mofarrej, Raghu Nayani, Eric Kaplan, Aiman Farooq, Alyssa Newcomb, Anne Davidson, Tamara Piksa, Michelle Restrepo, Natalie Hereth, Mallika Malhotra, Harrison Rudolph, Michael Friedrichs, Aran Mun, Angela Fan, Kelly Freed Huge thanks to all the people internal to FAIR who helped enable this work by providing extra compute for our experimentation. A ballerina performs a beautiful and difficult dance on the roof of a very tall skyscraper; the city is lit up and glowing behind her"
