["https://www.makerbot.com/stories/a-deeper-look-at-the-makerbot-method-x"]
title = "A Deeper Look At The MakerBot Method X - MakerBot"
description = "MakerBot reveals details of one of its first customers utilizing the recently launched MakerBot METHOD, the first performance 3D printer."
full_description = "3D printing in the classroom isn’t just about the 3D printer. It’s about the curriculum, the projects, and knowledge that surrounds it. Explore all the solutions that MakerBot has available for you Visit our support site for setup videos, how-to guides, FAQs, and technical expertise from our support team. The Method was a very different machine from MakerBot’s earlier devices, having a fully heated enclosure. This is quite unlike machines with heated build plates that accumulate heat by simply surrounding the print bed; the Method actually heated the air inside the chamber and did not even have a heated bed. There was no need to do so because the entire print, not just the bottom, was consistently heated to exactly the same temperature — up to 55C. This enabled vastly better print quality, when combined with a plethora of sensors and sophisticated control software. Like its sibling, the Method X has a heated chamber, but it can reach a sizzling 100C. The reason for this high temperature is for ABS prints, which require a much higher temperature to avoid warping. Warping will slightly (or greatly) modify the dimensions of the part, and this is entirely inappropriate for many printed parts that must meet precision thresholds. I was curious about how well ABS does in fact 3D print on this device, and at TCT Show I managed to find out more about the Method X courtesy of CEO Nadav Goshen, who walked me through the machine in detail. I learned quite a few things about the device I had not previously understood."
author = "mkrbotdev"
year_published = 2019
year_updated = 2024
