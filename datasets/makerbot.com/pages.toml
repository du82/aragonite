["https://www.makerbot.com/makerbot-and-ultimaker-agree-to-merge-to-accelerate-global-adoption-of-additive-manufacturing"]
title = "MakerBot and Ultimaker Agree to Merge to Accelerate Global Adoption of Additive Manufacturing"
description = "The new entity has secured additional funding of $62.4M to fuel global 3D printing innovation."
full_description = "3D printing in the classroom isn’t just about the 3D printer. It’s about the curriculum, the projects, and knowledge that surrounds it. Explore all the solutions that MakerBot has available for you Visit our support site for setup videos, how-to guides, FAQs, and technical expertise from our support team. MakerBot and Ultimaker, two leaders in desktop 3D printing, today announced that they have come to a business combination agreement that will accelerate the adoption of additive manufacturing by providing a comprehensive desktop 3D printing ecosystem of hardware, software, and materials. The new entity will be backed by existing investors, NPM Capital and Stratasys (Nasdaq: SSYS), and will benefit from a planned cash investment of $62.4 million to fuel innovation and expansion into new markets. The new company will be led by Nadav Goshen, current MakerBot CEO, and Jürgen von Hollen, current Ultimaker CEO, who will act as Co-CEOs, with Nadav managing operations and R&D and Jürgen managing the commercial functions. “This merger marks an important milestone for Ultimaker and MakerBot,” says Jürgen von Hollen, CEO of Ultimaker. “Innovation and growth are both critical to bringing desktop 3D printing from a specialty technology into mainstream business adoption. The new company will leverage and expand its combined global footprint with sales and operations in the Americas, EMEA and APAC.” “Technological innovation is paramount in growing the availability of easy-to-use professional 3D printing solutions,” says Nadav Goshen, CEO of MakerBot. “By combining our teams and leveraging the additional funding, we can accelerate the development of advanced solutions to provide our customers with a broad portfolio of hardware and software solutions to serve a wide spectrum of customers and applications. The new entity aims to offer easy-to-use and accessible desktop 3D printing solutions for any application while inspiring the industry to a future state of responsible and sustainable manufacturing."
