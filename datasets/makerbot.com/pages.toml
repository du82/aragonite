title = "Calcasieu Parish School Board Advances STEAM Education with MakerBot 3D Printers"
description = "Calcasieu Parish School Board expands access to innovative technology and strengthen skills and knowledge in the design process for students and educators across the school district, with the addition of 400 MakerBot SKETCH 3D printers."
full_description = "3D printing in the classroom isn’t just about the 3D printer. It’s about the curriculum, the projects, and knowledge that surrounds it. Explore all the solutions that MakerBot has available for you Visit our support site for setup videos, how-to guides, FAQs, and technical expertise from our support team. The addition of 400 MakerBot SKETCH™ 3D printers will expand access to innovative technology and strengthen skills and knowledge in the design process for students and educators across the school district MakerBot today announced that Calcasieu Parish School Board has invested in 200 MakerBot SKETCH Classroom™ sets, totaling 400 SKETCH 3D printers, to further advance its STEAM education and build critical skills among its students. The addition of SKETCH 3D printers brings the latest technological innovations to students to enhance classroom learning across grade levels and better prepare them for the future. “We want to make a difference with our students and give them all equal opportunities to succeed,” said Kim Leblanc, Chief Technology Officer at Calcasieu Parish School Board. “To do that, we need to give them tools and resources that will help them develop critical thinking, collaboration, and creativity skills. We believe that 3D printing and the MakerBot 3D printers fits right in and can support our teachers and students along their learning journey.” Located in southwest Louisiana, Calcasieu Parish School Board is the fifth largest school district in the state. The district has 29,500 students across its 60 elementary, middle, and high schools. Its mission is to “build foundations for the future,” and it does so by providing students with the latest technologies they need to be successful in and out of the classroom. In addition to STEAM (science, technology, engineering, arts, and mathematics) classes, the school district offers programs for advanced placement, gifted, and career & technical education to prepare students with skills needed for 21st century careers."
