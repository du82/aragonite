["https://www.makerbot.com/stories/3d-printing-mars-rover"]
title = "[Classroom Spotlight] 6th Graders Design Mars Rovers with 3D Printing"
description = "STEAM Students at Richmond Hill Middle School use the MakerBot SKETCH Classroom 3D printers solution to design and prototype Mars Rovers in a cross-curricular project led by 6th-grade teacher, Mary Bowden."
full_description = "3D printing in the classroom isn’t just about the 3D printer. It’s about the curriculum, the projects, and knowledge that surrounds it. Explore all the solutions that MakerBot has available for you Visit our support site for setup videos, how-to guides, FAQs, and technical expertise from our support team. Mary Bowden’s sixth grade classes teamed up with the Math and Science departments to design a robotic exploration rover that would be able to search for signs of life on Mars. Since the students were tasked with creating their own version of a Mars rover, they had to research the components of a real NASA mission, define the purpose of their NASA mission, research the components of an actual rover, and identify the parts of the rover that would be required to complete their mission on Mars. At the end of the project, they would then present their final prototype to a NASA expert experienced in getting rovers to Mars. Students learned about soil sciences and the properties of different types of soils and of those on Mars. Students could then determine if their Rovers would need to include a drill if their mission’s purpose was to collect soil samples. This meant they had to then incorporate a design of drill to equip their unique rover with. Students also had to think through how they would need to scale down their rover components to print on the MakerBot SKETCH, as well as determining what the life-size dimensions of this rover would be. During this project, many of the students learned that, in real-life, rovers can actually be as big as a car. To correctly scale their components, students had to learn more about ratios and scale factors and how that translates into actual 3D-printed designs. When it came to 3D printing, the MakerBot SKETCH Classroom printers were super user-friendly for her sixth graders to use and get a strong understanding of the whole process. “It was really easy to import their rover designs that they had created on Tinkercad straight into the MakerBot CloudPrint cloud-based software. They then uploaded their .MakerBot files of their designs onto their USB drives, plugged them into the printers and hit print,” said Mary."
author = "Bennie Sham"
year_published = 2023
year_updated = 2024
