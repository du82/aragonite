["https://www.makerbot.com/stories/advancing-solar-technology-with-the-help-of-3d-printing"]
title = "Advancing Solar Technology with the Help of 3D Printing | MakerBot"
description = "Learn how solar technology startup Solarlytics uses MakerBot 3D printers in their quest to revolutionize the solar energy sector with ultra efficient solar panels."
full_description = "3D printing in the classroom isn’t just about the 3D printer. It’s about the curriculum, the projects, and knowledge that surrounds it. Explore all the solutions that MakerBot has available for you Visit our support site for setup videos, how-to guides, FAQs, and technical expertise from our support team. California-based solar technology startup Solarytics uses the MakerBot METHOD platform to create optimized testing rigs for its cutting-edge solar panel technology Solarlytics is a 5-year-old startup in Livermore, California that specializes in improving the output of existing in-place solar panels. The company is developing a new technology that provides a significant uplift in solar energy output from existing solar panel infrastructure. It is working toward developing a product for the market and is currently engaged in research, testing, and product engineering. CAD to Part Time 48 hrs Part Cost $83 Size 12cm x 10cm x 10cm Printed on METHOD X Model Material MakerBot ASA Support Material MakerBot SR-30 The process of loading oddly-shaped and heavy (80+lbs) solar panels onto a testing rig is both awkward and labor-intensive. Previously, this process required multiple personnel and lots of space for testing to take place. There was also the risk of damaging and scratching the solar panel by dragging it to and from the flash test machine. Co-founder Doug Raymond and his team started out with cheaper desktop 3D printers, but quickly found the trial and error of calibration and reprinting to be extremely time-intensive and frustrating. Complex assemblies with tight tolerances were nearly impossible to print. The alternative of outsourcing for the part could cost up to $10,000, a price that would not allow for multiple iterations. In early 2019, the team invested in a MakerBot METHOD 3D printer based on its ability to print complex geometries with dissolvable support material. Says Doug Raymond, engineer and co-founder of Solarlytics, “The beauty of the METHOD is [that] you start the print at the end of Friday and when you’re back in the office [on Monday], it’s completely printed. The METHOD is a step above other 3D printers we’ve used.”"
