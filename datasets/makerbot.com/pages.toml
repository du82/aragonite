["https://www.makerbot.com/stories/additive-manufacturing-begins-to-mature-beyond-desktop-3d-printing"]
title = "Additive Manufacturing Begins to Mature Beyond Desktop 3D Printing - MakerBot"
description = "3D printing is growing up. Is it as revolutionary as its promise or just another valuable tool in the work toolbox—or both? We speak with MakerBot and a 3D-printing consultant in the Rust Belt to see where things are and where they are heading."
full_description = "3D printing in the classroom isn’t just about the 3D printer. It’s about the curriculum, the projects, and knowledge that surrounds it. Explore all the solutions that MakerBot has available for you Visit our support site for setup videos, how-to guides, FAQs, and technical expertise from our support team. 3D printing is growing up. Is it as revolutionary as its promise or just another valuable tool in the work toolbox—or both? We speak with MakerBot and a 3D-printing consultant in the Rust Belt to see where things are and where they are heading. 3D printing has not reached its full potential in professional and manufacturing-centric environments, but there’s a lot of healthy room to grow there, say additive manufacturing engineers, consultants and academics. And new technologies and machines are cropping up that are taking advantage of innovations in metal powders. One of the biggest questions about the technology is whether it can move from being a favorite of parts design and prototyping to a mainstay on the shop floor. Will it hit its stride at higher production levels? And what are the barriers to making bigger waves? Industry insiders say shops of all sizes are using these 3D processes in a variety of ingenious ways—from custom workholding and molds to functional end use parts featuring geometry that is only possible with additive manufacturing. “CNC shops have been using things like MakerBot to 3D-print complex structures that can hold the device in the mill at the angle needed to be able to machine the part,” says Chris Barrett, president of 3DDirections. “So shops are making jigs, fixtures and some tooling that way.” Barrett is a chemist and physicist by trade but was bored with test tubes—and found his way to material science and engineering. Because he’s based in Ohio, Barrett was exposed to traditional manufacturing and the world of emerging additive and 3D-printing technologies. He started his consultancy with a strong understanding of both worlds and focuses on helping companies take advantage of the technology where it makes the most sense."
author = "Felipe Castaneda"
year_published = 2019
year_updated = 2024
