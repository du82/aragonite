title = "Si Se Puede Foundation Boosts STEM Education with New 3D Printing Center Featuring MakerBot 3D Printers"
description = "Si Se Puede provides STEM access and mentorship to students in underrepresented communities, equipping them with skills and knowledge necessary to level the playing field and excel alongside their peers."
full_description = "3D printing in the classroom isn’t just about the 3D printer. It’s about the curriculum, the projects, and knowledge that surrounds it. Explore all the solutions that MakerBot has available for you Visit our support site for setup videos, how-to guides, FAQs, and technical expertise from our support team. Based in Chandler, Arizona, Si Se Puede Foundation is dedicated to bridging the STEM (science, technology, engineering, and mathematics) divide that exists in marginalized societies. Established over 23 years ago, the foundation started as an advocacy group focused on keeping kids engaged and out of trouble through extracurricular activities, such as soccer and dance. Today, the foundation focuses on providing access to technology and training for students in underrepresented and under-resourced communities and schools. Si Se Puede provides STEM access and mentorship to students in underrepresented communities, equipping them with skills and knowledge necessary to level the playing field and excel alongside their peers Designed to support the STEM ecosystem, the foundation’s STEM center offers a wide range of tools and equipment, including MakerBot Sketch and UltiMaker Method X 3D printers, computers, woodworking machines, CNC mills, CNC routers, manual lathes, laser cutters, band saws, grinders, and other basic tools. Si Se Puede offers use of its equipment, at no-charge, to schools—local and beyond—that need access to them. “There’s a reason we do what we do at the STEM center,” said Faridodin (Fredi) Lajvardi, President and CEO of Si Se Puede. “That’s to get students exposed to all the technology that’s necessary for them to be successful in the 21st century so, when they get into the workforce, they can be contributing members of the economy.” The Si Se Puede Foundation hosts student-led robotics teams, which utilize the center to build and test their robots for upcoming competitions, such as the FIRST Robotics Challenge, an international robotics competition for high school students, and the FIRST Tech Challenge which brings together middle and high school students to compete. There are over 19 schools that participate on the robotics teams, which means there are about 50 students who use the center. In addition, there are a dozen other teams, each with about 10 students, that use the facilities. Further, there are over 20 mentors from industry and students from Arizona State University who volunteer in our programs to guide and support the teams."
author = "Bennie Sham"
year_published = 2023
year_updated = 2025
