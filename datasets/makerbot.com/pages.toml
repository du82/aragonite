["https://www.makerbot.com/children-privacy-policy"]
title = "Children privacy policy - MakerBot"
full_description = "3D printing in the classroom isn’t just about the 3D printer. It’s about the curriculum, the projects, and knowledge that surrounds it. Explore all the solutions that MakerBot has available for you Visit our support site for setup videos, how-to guides, FAQs, and technical expertise from our support team. ##I. BACKGROUND AND PURPOSE The Children’s Online Privacy Protection Act of 1998 and its rules (collectively, “COPPA“) and the General Data Protection Regulation (“GDPR“) require us to inform parents and legal guardians (as used in this policy “Parents“) about our practices for collecting, using, and disclosing Personal Information from children under the age of 13 and 16 respectively. For purposes of this MakerBot Children’s Privacy Policy, the terms (“Child” or “Children“) shall refer to persons under the age of 16. COPPA and GDPR also require us to obtain verifiable consent from Parents if there is any collection, use, or disclosure of a Child’s Personal Information. This MakerBot Children’s Privacy Policy supplements the MakerBot Privacy Policy and the MakerBot Terms of Use to which this MakerBot Children’s Privacy Policy is incorporated. Capitalized terms used herein that are undefined shall have the same meanings ascribed to them in the MakerBot Privacy Policy or the MakerBot Terms of Use. ##II. TYPES OF INFORMATION, HOW INFORMATION IS USED, AND HOW INFORMATION IS DISCLOSED A. Information We Collect Directly Children who create a Company Account in accordance with Section III and Section IV below (“Child Users“) must provide us with the following Personal Information to register a Company Account with our Sites: first name, last name, email, country, username for Sites, birthdate, and password for Sites. If verifiable parental consent is not received by MakerBot from you, we will delete the Personal Information your Child provided to us during the Company Account registration process and a Company Account will not be created for your Child."
