full_description = "The key (and its associated subkeys) that I attempt to use for all personal communication today is 0xF5852F4E. It is a newer 4096 bit RSA key. For work related correspondance, I use 0x67225BF0 which is also a 4096 bit RSA key. Please use this key for all UW related correspondence but please do not use it for any non-work correspondence. I also have two older DSA/ELG Combination Keys — 0x607559E6 and 0xC99870B1. I still have control of both of these keys and used them actively until 2013. Because they are still valid and well connected, I appreciate if you sign them during a keysigning but please not use them for encrypted communication. I have created other keys as well and have lost control of one key and revoked another. Please only use the two keys listed above (0xF5852F4E for personal correspondence and 0x67225BF0 for work)."
