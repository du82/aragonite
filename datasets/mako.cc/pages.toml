title = "Teaching :: Benjamin Mako Hill"
full_description = '''Teaching My teaching is exclusively in the area of my research interests: peer production, online communities, innovation, quantitative methodology, and collective action. In addition to graduate and undergraduate classes, I mentor students and frequently give guest lectures. This page documents much of my teaching activity. My page on assessment includes the rubrics I use for both papers and participation in all of my classes and is largely inspired by similar documents written by Joseph Reagle. Courses I have developed (or modified and revamped) and taught the following quarter-long courses: [Spring 2021, Fall 2016] Building Successful Online Communities (COMMLD570, COM597 — Masters Level). UW Communication Leadership’s “Masters in Communication in Communities and Networks” program. Elective that builds off some of the material originally developed for my Interpersonal Media class. [Syllabus (Spring 2021)] [Syllabus (Fall 2016)] [Winter 2021] Statistical Methods in Communication (COM520 — Masters/PhD Level). UW Department of Communication. This is a first course in quantitative methods taught in our PhD program. The course was a technical course on statistics and statistical programming in GNU R. [Syllabus (Winter 2021)] [Winter 2021] Methods of Inquiry (COM501 — Masters/PhD Level). UW Department of Communication. Mandatory second-quarter introductory methods course for students in the UW Department of Communication. Co-taught with Leah Ceccarelli in Winter 2021. [Fall 2020, Winter 2020, Fall 2015, Fall 2014] Interpersonal Media (COM482 — Undergraduate Level). UW Department of Communication. The curriculum covers computer-mediated communication and focuses heavily on online communities. [Syllabus (Fall 2020)] [Syllabus (Winter 2020)] [Syllabus (Fall 2015)] [Syllabus (Fall 2014)] [Winter 2020, Spring 2016, Spring 2015] Designing Internet Research (COM528 — Masters/PhD Level). UW Department of Communication. The curriculum offers a survey of several Internet research methods. [Syllabus (Winter 2020)] [Syllabus (Spring 2016)] [Syllabus (Spring 2015)] [Fall 2019, Fall 2017, Fall 2016] Communication Theory Development (COM500 — Masters/PhD Level). UW Department of Communication. Mandatory first-quarter introductory theory course for students in the UW Department of Communication. Co-taught with Christine Harold in 2016, Ralina Joseph in 2017, and Patricia Moy in 2019. [Syllabus (Fall 2019)] [Syllabus (Fall 2017)] [Syllabus (Fall 2016)] [Fall 2017, Spring 2016, Spring 2014] Innovation Communities (COM597 — Masters Level). UW Communication Leadership’s “Masters in Communication in Communities and Networks” program. Elective covering using online communities to harness user innovation. [Syllabus (Fall 2017)] [Syllabus (Spring 2016)] [Syllabus (Spring 2014)] [Winter 2017] Advanced Statistical Methods in Communication (COM521 — Masters/PhD Level). UW Department of Communication. This is the second course in the two-course quantitative methods sequence taught in our PhD program. While the first course is mostly focused on issues of epistemology and design in social science, COM521 is a technical course on statistics and statistical programming in GNU R. [Syllabus (Winter 2017)] [Spring 2015] Community Data Science (COM597G — Masters Level) UW Communication Leadership’s “Masters in Digital Media” program. Elective covering hands-on introduction to programming, web APIs, and basic data analysis in Python for absolute beginners. [Syllabus (Spring 2015)] Workshops and Seminars [Winter 2020, Spring 2016, Fall 2015, Spring 2015, Fall 2014, Spring 2014] Community Data Science Workshops. Funded by Department of Communication and eScience Institute, University of Washington. [Fall 2013-Present] Social Computing Reading Group, University of Washington. Co-organized. [2011–2013] Cooperation Group Seminar. Berkman Center for Internet and Society, Harvard University. [Fall 2008] 15.960: Special Seminar in Collective Intelligence. Sloan School of Management. Supervised by Thomas Malone. [August 27, 2004—September 1, 2004] Werkleitz School of Common Property, Halle Volkspark in Halle, Germany. Mentorship Current Graduate Students Advised Kaylea Champion. Advisor and Chair (2019–), PhD Advisory Committee; Advisor and Chair (2017–2019), MA Thesis Committee; Department of Communication, University of Washington. Regina Cheng. Co-Advisor and Co-Chair (2019–), PhD Advisory Committee; Department of Human-Centered Design & Engineering, University of Washington. Emilia F. Gan. Co-Advisor and Co-Chair (2019–), PhD Advisory Committee; Paul G. Allen School of Computer Science & Engineering, University of Washington. Wm Salt Hale. Advisor and Chair (2017–), MA Thesis Committee; Department of Communication, University of Washington. Charles Kiene. Advisor and Chair (2020–), PhD Advisory Committee; Advisor and Chair (2019–2020), MA Thesis Committee; Department of Communication, University of Washington. Nate TeBluntenhuis. Advisor and Chair (2017–), PhD Advisory Committee; Advisor and Chair (2015–2017) MA Thesis Committee; Department of Communication, University of Washington. Other Students Currently Supervised Zach Arenson. Supervisor (2020–), Undergraduate Honors Thesis; Department of Communication, University of Washington. Kevin Calderwood. Member (2019–), PhD Dissertation Committee; Member (2017–2019), General Examination Committee; Department of Communication, University of Washington. Matthew Conlen. Graduate Student Representative (2021–), PhD Advisory Committee; Paul G. Allen School of Computer Science & Engineering, University of Washington. Stefania Druga. Member (2020–), PhD Advisory Committee; Information School, University of Washington. Jenna Frens. Member (2019–), PhD Dissertation Committee; Member (2018–2019), General Examination Committee; Department of Human-Centered Design & Engineering, University of Washington. Aparna Gosh. Member (2019–), PhD Advisory Committee, Department of Communication, University of Washington. Luyue Ma. Member (2019–) PhD Advisory Committee; Member (2019), General Examination Committee; Department of Communication, University of Washington. Jim Maddock. Member (2019–), General Examination Committee; Program in Technology and Social Behavior, Northwestern University. Amirah Majid. Graduate School Representative (2016–), PhD Dissertation Committee; Information School, University of Washington. Jason Portenoy. Graduate School Representative (2017–), PhD Dissertation Committee, Graduate School Representative (2017), General Examination Committee, Information School, University of Washington. John Robinson. Member (2018–) General Examination Committee, Department of Human-Centered Design and Engineering, University of Washington. Lucy Simko. Graduate Student Representative (2021–), PhD Advisory Committee; Paul G. Allen School of Computer Science & Engineering, University of Washington. Polly Straub-Cook. Member (2019–), PhD Dissertation Committee; Member (2018–2019), General Examination Committee; Department of Communication, University of Washington. Chau Tran. Member (2019–) PhD Dissertation Committee; Member (2018–2019), Qualifying Examination Committee; Department of Computer Science & Engineering, New York University. Janny Wang. Member (2017–), PhD Dissertation Committee; Member (2017) General Examination Committee; Department of Communication, University of Washington. Spencer Williams. Graduate School Representative (2020–), General Examination Committee; Department of Human-Centered Design & Engineering, University of Washington. Eric Zeng. Graduate Student Representative (2020–), PhD Advisory Committee; Paul G. Allen School of Computer Science & Engineering, University of Washington. Former Postdoctoral Supervisees Sayamindu Dasgupta. Postdoctoral Supervisor (2017–2018), Moore/Sloan Foundation Data Science Postdoctoral Fellowship, eScience Institute, University of Washington. Other Former Students Rob Thompson. G