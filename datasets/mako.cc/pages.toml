title = "Software Development Projects :: Benjamin Mako Hill"
full_description = "The vast majority of my free software development works is in contributions to large projects like Debian and Ubuntu. However, I have started several free software projects of my own. I have also written many other pieces of software. I no longer use this software but in many cases, many other people do. I am happy to transfer responsibility for software on this page to anyone that is interested in taking it. The software listed below is deprecated. This does not mean that you should not use it. It does mean that I will not be able to take time to respond to problems you might have with it. If you like the software and think it would be good to have someone maintain it in the future, you should consider being that person. Simply get in contact with me and we can discuss a transfer of responsibilities."
