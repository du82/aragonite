["https://mako.cc/academic"]
title = "Academic Work :: Benjamin Mako Hill"
full_description = '''Academic Work I study online communities and seek to understand the social dynamics that drive collaborative production of digital public goods like Wikipedia and Linux. I am particularly interested in how the design of communication and information technologies shape fundamental social outcomes with broad theoretical and practical implications—like the decision to join or leave a community or to engage in collective action. My research is deeply interdisciplinary, consists primarily of "big data" quantitative analyses, and lies at the intersection of communication, human-computer interaction, and sociology. I am an Associate Professor in the University of Washington Department of Communication and an Adjunct Associate Professor in the Department of Human-Centered Design & Engineering, the Paul G. Allen School of Computer Science & Engineering, and the Information School. I am a member of Community Data Science Collective which I founded with Aaron Shaw. At UW, I am also Affiliate Faculty in the Center for Statistics and the Social Sciences, the eScience Institute, and the "Design Use Build" (DUB) group that supports research on on human computer interaction. I am also a Faculty Associate at the Berkman Klein Center for Internet and Society at Harvard University and an affiliate of the Institute for Quantitative Social Science at Harvard. I received my PhD from the Massachusetts Institute of Technology in an interdepartmental program involving the MIT Sloan School of Management and the MIT Media Lab. My dissertation research was advised by Eric von Hippel, Yochai Benkler, Tom Malone and Mitch Resnick. I am spending the 2023–2024 academic year as a Fellow at the Center for Information Technology Policy at Princeton University. Articles in Journals & Conference Proceedings[?] Champion, Kaylea, and Benjamin Mako Hill. 2024. “Sources of Underproduction in Open Source Software.” In Proceedings of the 2024 IEEE International Conference on Software An