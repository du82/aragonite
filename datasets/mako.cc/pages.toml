["https://mako.cc/fun"]
title = "Art, Activism and Other Fun Projects :: Benjamin Mako Hill"
full_description = '''This page contains all the projects that keep me sane. It's the art, photography, activism, and other crazy and fun sounding ideas that I actually manage to follow through to (some level of) completion. I don't tweet because I'm not ready to hand my data and autonomy over to Twitter. That said, I dent on the more freedom-friendly identi.ca. I've found that microblogging is a great public outlet where one can talk about all those otherwise little meaningless things that we all do. High on that list, for me at least, is microblogging itself! But can you microblog about your microblogging? I created a special account, metamako, that proves that you sure can! Pierre-Joseph Proudhon is the nineteenth century French anarchist and mutualist most famous for saying, "La propriété, c'est le vol!" In English: "Property is theft!" I made t-shirts reading "Property of Pierre-Joseph Proudhon." I did an in-character interview as a copyright high-protectionist about Unhappy Birthday on the CBC show WireTap. Limericks have a reputation as a silly and humorous form but there's no reason that this should be the case. I started a wiki page in an effort to take back the form for serious subjects and prove that limericks can be used for a serious subject. I solicited limericks about the September 11th attacks on the World Trade Center and the effects and fallout from the attacks that we're still feeling today. With and help and support from the Computing Culture research group at the MIT Media Lab, I started Seeing Yellow. The project aimed to revitalize the outcry around tracking codes in color laser printers and to publicize a visit by secret service agents to one person who called up their printer manufacturer to ask to to turn them off. With over 10,000 people reporting that they had contacted their printer manufacturers, it seems likely that it had the effect. For National Day of Action for Open Access, I took a page from the Seeing Red project at Brown University and labeled MIT's 100 journals that cost more than $5,000 USD with price tags to highlight the skyrocketing cost of journals and some of the very bad deals that these prices translate into for research institution like MIT and for the public.'''
