ion: One Laptop per Child and Free/Open Source Software.” Hampshire College, Amherst, Massachusetts, March 12, 2008. Slides (PDF)] [Slides (ODP)] Talk Notes] [Talk Notes (ReST)] [Show Description] This first half of this talk introduced the One Laptop per Child Project and the XO-1 laptop. In this introduction, I focused on the published principles and stated goals of the project and tried to draw connections between the software and hardware design and development model and these goals. In the second half of the talk, I focused on the reasons behind OLPC's stated commitment to free and open source software and argued for free software in Constructionist education projects and in education and development work more generally. [Lecture] “Laptop Liberation: One Laptop per Child and Free/Open Source Software.” Nara Institute of Technology (NAIST), Nara, Japan, January 8, 2008. [Slides (PDF)] [Slides (ODP)] [Talk Notes] [Talk Notes (ReST)) [Lecture] “Laptop Liberation: One Laptop per Child and Free/Open Sourc"
