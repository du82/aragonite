title = "Contact Information :: Benjamin Mako Hill"
full_description = "Contact Information Because my job at the University of Washington makes me a government employee, I try to follow state rules to use my UW email and mailing address for, but only for, correspondence related to my work as a UW faculty member (e.g., teaching and UW-supported research). Please don't just email both of my email addresses in an attempt to get my attention. If you think I have missed your message, go ahead and email me again. I miss things sometimes and I don't mind reminders. Email: General/Personal/Consulting: mako@atdot.cc University of Washington/Research: makohill@uw.edu Physical Addresses: Please realize that I travel extensively so physical mail can be unreliable. This year I am on sabbatical and am spending the year at the Center for information Technology Policy at Princeton, University: Sherrerd Hall, 320C Princeton, NJ 08544 My permanent home is in Seattle in Extraordinary Least Squares. Please visit that home webpage for details and directions. If you want to send postal mail, our address is: 908 15th Ave E Seattle, WA, 98112 My office at UW is in the Community Data Science Lab in the Communications (CMU) building at the University of Washington in room CMU 306: Community Data Science Lab Communications Building (CMU), Room 306 University of Washington Seattle, WA, 98195 The room can be tricky to find so please follow these step-by-step directions if you are coming to visit. If nobody is in the room, there's a chance I might be in the Community Data Science Meeting Room in CMU 333. However, if you are going to send any postal mail or packages, please send to this to my UW mailing address: University of Washington Dept. of Communication, Box 353740 Seattle, WA, 98195 Phone, SMS, Signal: (+1) 206-409-7191 (Primary for calls, Signal, SMS) IRC: mako on OFTC (irc.oftc.net) mako on FreeNode (irc.freenode.net) Communicating Securely Whenever possible, I recommend that everyone communicating with me use encryption for authentication and to ensure that our conversations stay between us. For email, I use the GNU Privacy Guard (GPG). GPG Keys: Please update both keys from public keyservers and carefully check the signatures on each key. Personal RSA Key (4096 bit): 0x9EA33414F5852F4E (Fingerprint: E9A2 71C0 7196 4891 AA57 663D 9EA3 3414 F585 2F4E) [For all personal or non-work correspondance] Work/UW RSA Key (4096 bit): 0x7FD13BFE67225BF0 (Fingerprint: 34AC E00E 6BCC FD4F 8296 4C87 7FD1 3BFE 6722 5BF0) [For all UW and research related correspondance]"
