["https://malisper.me/postgres-lateral-joins"]
title = "Postgres Lateral Joins - malisper.me"
description = "Personally, lateral joins are one of my favorite Postgres features. They are simple, while at the same time they let you write queries that would be nearly impossible to write otherwise. I find it surprising lateral joins were only introduced into Postgres four years ago given how useful they are. I also find it surprising […]"
full_description = "Postgres Lateral Joins Personally, lateral joins are one of my favorite Postgres features. They are simple, while at the same time they let you write queries that would be nearly impossible to write otherwise. I find it surprising lateral joins were only introduced into Postgres four years ago given how useful they are. I also find it surprising there are no good explanations of lateral joins online given how simple they are. A lateral join is simply a foreach loop in SQL. There are actually two different ways of writing a lateral join. The simplest form, which is the one you probably want looks like the following: SELECT <columns> FROM <table reference>, LATERAL <inner subquery>; (For context, a table reference is either a table or a subquery.) The above query will iterate through each row in the table reference and evaluate the inner subquery for each row, exactly like a foreach loop would. The rows returned by the inner subquery are then added to the result of the lateral join. The primary reason for using a lateral join is that the inner subquery can refer to the fields of the row from the table reference and use that to determine what rows to return. To help illustrate what this means, here is Python code that imitates a lateral join: result = [] for row1 in table_reference(): for row2 in inner_subquery(row1): result += (row1, row2) As you should be able to see, the rows iterated over in the inner for loop are a function of the current row being iterated over in the outer for loop. As an example of where a lateral join is useful, let’s say we have a table people with an id column and an age column, and a table pets with columns id, owner_id and age. For the query, let’s say for each person over 30, we want to obtain the id of the oldest pet owned by that person. Anytime you hear the words “for each”, you are probably looking for a lateral join. This specific example can be done with the following query: SELECT people_sub.id, pets_sub.id FROM (SELECT id FROM people WHERE age > 30) people_sub, LATERAL (SELECT pets.id FROM pets WHERE pets.owner_id = people_sub.id ORDER BY pets.age DESC LIMIT 1) pets_sub; For each person over 30, this query will evaluate the inner subquery and add the results of the subquery to the results of the full query. The inner subquery, given a row for a person, will find the id of the oldest pet owned by that person, if they own a pet. That’s all there is to the lateral join. Believe it or not, most of the other ways of writing the above query are much trickier and usually are not as efficient1. The other syntax for writing a lateral join is the following: SELECT <columns> FROM <table reference> JOIN LATERAL <outer subquery> ON TRUE; The advantage of this form is you can use any join qualifier (e.g. LEFT JOIN LATERAL). If in the example above, we also wanted to obtain people who didn’t have a pet at all, we would have needed to use a lateral left join to get those people. Most of the time though, the first lateral join form is good enough. To recap, a lateral join is basically a foreach loop in SQL. Anytime you want to perform some calculation for each row in a subquery, you should try to see if a lateral join suits your use case. Once you understand a lateral join, you’ll realize it makes all sorts of queries much easier to write. Share this:TwitterLinkedInFacebookEmailPrintThe only real other option I’m aware of is a correlated subquery. The advantage of a lateral join is that it can return any number of rows whereas a correlated subquery has to return exactly one. Posted on June 13, 2017June 13, 2017 by malisper in Postgres 7"
year_published = 2017
year_updated = 2017
