["https://man.openbsd.org/vi.1"]
title = "vi(1) - OpenBSD manual pages"
full_description = '''NAME ex, vi, view — text editors SYNOPSIS ex [-FRrSsv] [-c cmd] [-t tag] [-w size] [file ...] vi [-eFRrS] [-c cmd] [-t tag] [-w size] [file ...] view [-eFrS] [-c cmd] [-t tag] [-w size] [file ...] DESCRIPTION ex is a line-oriented text editor; vi is a screen-oriented text editor. ex and vi are different interfaces to the same program, and it is possible to switch back and forth during an edit session. view is the equivalent of using the -R (read-only) option of vi. This manual page is the one provided with the nex/nvi versions of the ex/vi text editors. nex/nvi are intended as bug-for-bug compatible replacements for the original Fourth Berkeley Software Distribution (4BSD) ex and vi programs. For the rest of this manual page, nex/nvi is used only when it's necessary to distinguish it from the historic implementations of ex/vi. This manual page is intended for users already familiar with ex/vi. Anyone else should almost certainly read a good tutorial on the editor before this manual page. If you're in an unfamiliar environment, and you absolutely have to get work done immediately, read the section after the options description, entitled FAST STARTUP. It's probably enough to get you going. The following options are available: -c cmd Execute cmd on the first file loaded. Particularly useful for initial positioning in the file, although cmd is not limited to positioning commands. This is the POSIX 1003.2 interface for the historic “+cmd” syntax. nex/nvi supports both the old and new syntax. -e Start editing in ex mode, as if the command name were ex. -F Don't copy the entire file when first starting to edit. (The default is to make a copy in case someone else modifies the file during your edit session.) -R Start editing in read-only mode, as if the command name was view, or the readonly option was set. -r Recover the specified files or, if no files are specified, list the files that could be recovered. If no recoverable files by the specified name exist, the file is edited as if the -r option had not been specified. -S Run with the secure edit option set, disallowing all access to external programs. -s Enter batch mode; applicable only to ex edit sessions. Batch mode is useful when running ex scripts. Prompts, informative messages and other user oriented messages are turned off, and no startup files or environment variables are read. This is the POSIX 1003.2 interface for the historic “-” argument. nex/nvi supports both the old and new syntax. -t tag Start editing at the specified tag (see ctags(1)). -v Start editing in vi mode, as if the command name was vi. -w size Set the initial window size to the specified number of lines. Command input for ex/vi is read from the standard input. In the vi interface, it is an error if standard input is not a terminal. In the ex interface, if standard input is not a terminal, ex will read commands from it regardless; however, the session will be a batch mode session, exactly as if the -s option had been specified. FAST STARTUP This section will tell you the minimum amount that you need to do simple editing tasks using vi. If you've never used any screen editor before, you're likely to have problems even with this simple introduction. In that case you should find someone that already knows vi and have them walk you through this section. vi is a screen editor. This means that it takes up almost the entire screen, displaying part of the file on each screen line, except for the last line of the screen. The last line of the screen is used for you to give commands to vi, and for vi to give information to you. The other fact that you need to understand is that vi is a modeful editor, i.e. you are either entering text or you are executing commands, and you have to be in the right mode to do one or the other. You will be in command mode when you first start editing a file. There are commands that switch you into input mode. There is only one key that takes you out of input mode, and that is the ⟨escape⟩ key. Key names are written using angle brackets, e.g. ⟨escape⟩ means the “escape” key, usually labeled “Esc” on your terminal's keyboard. If you're ever confused as to which mode you're in, keep entering the ⟨escape⟩ key until vi beeps at you. Generally, vi will beep at you if you try and do something that's not allowed. It will also display error messages. To start editing a file, enter the following command: $ vi file The command you should enter as soon as you start editing is: :set verbose showmode This will make the editor give you verbose error messages and display the current mode at the bottom of the screen. The commands to move around the file are: h Move the cursor left one character. j Move the cursor down one line. k Move the cursor up one line. l Move the cursor right one character. ⟨cursor-arrows⟩ The cursor arrow keys should work, too. /text Search for the string “text” in the file, and move the cursor to its first character. The commands to enter new text are: a Append new text, after the cursor. i Insert new text, before the cursor. O Open a new line above the line the cursor is on, and start entering text. o Open a new line below the line the cursor is on, and start entering text. ⟨escape⟩ Once you've entered input mode using one of the a, i, O or o commands, use ⟨escape⟩ to quit entering text and return to command mode. The commands to copy text are: p Append the copied line after the line the cursor is on. yy Copy the line the cursor is on. The commands to delete text are: dd Delete the line the cursor is on. x Delete the character the cursor is on. The commands to write the file are: :w Write the file back to the file with the name that you originally used as an argument on the vi command line. :w file_name Write the file back to the file with the name file_name. The commands to quit editing and exit the editor are: :q Quit editing and leave vi (if you've modified the file, but not saved your changes, vi will refuse to quit). :q! Quit, discarding any modifications that you may have made. One final caution: Unusual characters can take up more than one column on the screen, and long lines can take up more than a single screen line. The above commands work on “physical” characters and lines, i.e. they affect the entire line no matter how many screen lines it takes up and the entire character no matter how many screen columns it takes up. REGULAR EXPRESSIONS ex/vi supports regular expressions (REs), as documented in re_format(7), for line addresses, as the first part of the ex substitute, global and v commands, and in search patterns. Basic regular expressions (BREs) are enabled by default; extended regular expressions (EREs) are used if the extended option is enabled. The use of regular expressions can be largely disabled using the magic option. The following strings have special meanings in the ex/vi version of regular expressions: An empty regular expression is equivalent to the last regular expression used. ‘\<’ matches the beginning of the word. ‘\>’ matches the end of the word. ‘~’ matches the replacement part of the last s command. BUFFERS A buffer is an area where commands can save changed or deleted text for later use. vi buffers are named with a single character preceded by a double quote, for example "⟨c⟩; ex buffers are the same, but without the double quote. nex/nvi permits the use of any character without another meaning in the position where a buffer name is expected. All buffers are either in line mode or character mode. Inserting a buffer in line mode into the text creates new lines for each of the lines it contains, while a buffer in character mode creates new lines for any lines other than the first and last lines it contains. The first and last lines are inserted at the current cursor position, becoming part of the current line. If there is more than one line in the buffer, the current line itself will be split. All ex commands which store text into buffers do so in line mode. The behaviour of vi commands depend on their associated motion command: ⟨control-A⟩, h, l, ,, 0, B, E, F, T, W, ^, b, e, f and t make the destination buffer character-oriented. j, ⟨control-M⟩, k, ', -, G, H, L, M, _ and | make the destination buffer line-oriented. $, %, `, (, ), /, ?, [[, ]], { and } make the destination buffer character-oriented, unless the starting and end positions are the first and last characters on a line. In that case, the buffer is line-oriented. The ex command display buffers displays the current mode for each buffer. Buffers named ‘a’ through ‘z’ may be referred to using their uppercase equivalent, in which case new content will be appended to the buffer, instead of replacing it. Buffers named ‘1’ through ‘9’ are special. A region of text modified using the c (change) or d (delete) commands is placed into the numeric buffer ‘1’ if no other buffer is specified and if it meets one of the following conditions: It includes characters from more than one line. It is specified using a line-oriented motion. It is specified using one of the following motion commands: ⟨control-A⟩, `⟨character⟩, n, N, %, /, {, }, (, ), and ?. Before this copy is done, the previous contents of buffer ‘1’ are moved into buffer ‘2’, ‘2’ into buffer ‘3’, and so on. The contents of buffer ‘9’ are discarded. Note that this rotation occurs regardless of the user specifying another buffer. In vi, text may be explicitly stored into the numeric buffers. In this case, the buffer rotation occurs before the replacement of the buffer's contents. The numeric buffers are only available in vi mode. VI COMMANDS The following section describes the commands available in the command mode of the vi editor. The following words have a special meaning in the commands description: bigword A set of non-whitespace characters. buffer Temporary area where commands may place text. If not specified, the default buffer is used. See also BUFFERS, above. count A positive number used to specify the desired number of iterations of a command. It defaults to 1 if not specified. motion A cursor movement command which indicates the other end of the affected region of text, the first being the current cursor position. Repeating the command character makes it affect the whole current line. word A sequence of letters, digits or underscores. buffer and count, if both present, may be specified in any order. motion and count, if both present, are effectively multiplied together and considered part of the motion. ⟨control-A⟩ Search forward for the word starting at the cursor position. [count] ⟨control-B⟩ Page backwards count screens. Two lines of overlap are maintained, if possible. [count] ⟨control-D⟩ Scroll forward count lines. If count is not given, scroll forward the number of lines specified by the last ⟨control-D⟩ or ⟨control-U⟩ command. If this is the first ⟨control-D⟩ command, scroll half the number of lines in the current screen. [count] ⟨control-E⟩ Scroll forward count lines, leaving the current line and column as is, if possible. [count] ⟨control-F⟩ Page forward count screens. Two lines of overlap are maintained, if possible. ⟨control-G⟩ Display the following file information: the file name (as given to vi); whether the file has been modified since it was last written; if the file is readonly; the current line number; the total number of lines in the file; and the current line number as a percentage of the total lines in the file. [count] ⟨control-H⟩ [count] h Move the cursor back count characters in the current line. [count] ⟨control-J⟩ [count] ⟨control-N⟩ [count] j Move the cursor down count lines without changing the current column. ⟨control-L⟩ ⟨control-R⟩ Repaint the screen. [count] ⟨control-M⟩ [count] + Move the cursor down count lines to the first non-blank character of that line. [count] ⟨control-P⟩ [count] k Move the cursor up count lines, without changing the current column. ⟨control-T⟩ Return to the most recent tag context. [count] ⟨control-U⟩ Scroll backwards count lines. If count is not given, scroll backwards the number of lines specified by the last ⟨control-D⟩ or ⟨control-U⟩ command. If this is the first ⟨control-U⟩ command, scroll half the number of lines in the current screen. ⟨control-W⟩ Switch to the next lower screen in the window, or to the first screen if there are no lower screens in the window. [count] ⟨control-Y⟩ Scroll backwards count lines, leaving the current line and column as is, if possible. ⟨control-Z⟩ Suspend the current editor session. ⟨escape⟩ Execute the ex command being entered, or cancel it if it is only partial. ⟨control-]⟩ Push a tag reference onto the tag stack. ⟨control-^⟩ Switch to the most recently edited file. [count] ⟨space⟩ [count] l Move the cursor forward count characters without changing the current line. [count] ! motion shell-argument(s) ⟨carriage-return⟩ Replace the lines spanned by count and motion with the output (standard output and standard error) of the program named by the shell option, called with a -c flag followed by the shell-argument(s) (bundled into a single argument). Within shell-argument(s), the ‘%’, ‘#’ and ‘!’ characters are expanded to the current file name, the previous current file name, and the command text of the previous ! or :! commands, respectively. The special meaning of ‘%’, ‘#’ and ‘!’ can be overridden by escaping them with a backslash. [count] # #|+|- Increment (trailing ‘#’ or ‘+’) or decrement (trailing ‘-’) the number under the cursor by count, starting at the cursor position or at the first non-blank character following it. Numbers with a leading ‘0x’ or ‘0X’ are interpreted as hexadecimal numbers. Numbers with a leading ‘0’ are interpreted as octal numbers unless they contain a non-octal digit. Other numbers may be prefixed with a ‘+’ or ‘-’ sign. [count] $ Move the cursor to the end of a line. If count is specified, additionally move the cursor down count - 1 lines. % Move to the parenthesis, square bracket or curly brace matching the one found at the cursor position or the closest to the right of it. & Repeat the previous substitution command on the current line. '⟨character⟩ `⟨character⟩ Return to the cursor position marked by the character character, or, if character is ‘'’ or ‘`’, to the position of the cursor before the last of the following commands: ⟨control-A⟩, ⟨control-T⟩, ⟨control-]⟩, %, ', `, (, ), /, ?, G, H, L, [[, ]], {, }. The first form returns to the first non-blank character of the line marked by character. The second form returns to the line and column marked by character. [count] ( [count] ) Move count sentences backward or forward, respectively. A sentence is an area of text that begins with the first nonblank character following the previous sentence, paragraph, or section boundary and continues until the next period, exclamation mark, or question mark character, followed by any number of closing parentheses, brackets, double or single quote characters, followed by either an end-of-line or two whitespace ch'''
