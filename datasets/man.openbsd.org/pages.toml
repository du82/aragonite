["https://man.openbsd.org/mandoc.1"]
title = "mandoc(1) - OpenBSD manual pages"
full_description = '''NAME mandoc — format manual pages SYNOPSIS mandoc [-ac] [-I os=name] [-K encoding] [-mdoc | -man] [-O options] [-T output] [-W level] [file ...] DESCRIPTION The mandoc utility formats manual pages for display. By default, mandoc reads mdoc(7) or man(7) text from stdin and produces -T locale output. The options are as follows: -a If the standard output is a terminal device and -c is not specified, use less(1) to paginate the output, just like man(1) would. -c Copy the formatted manual pages to the standard output without using less(1) to paginate them. This is the default. It can be specified to override -a. -I os=name Override the default operating system name for the mdoc(7) Os and for the man(7) TH macro. -K encoding Specify the input encoding. The supported encoding arguments are us-ascii, iso-8859-1, and utf-8. If not specified, autodetection uses the first match in the following list: If the first three bytes of the input file are the UTF-8 byte order mark (BOM, 0xefbbbf), input is interpreted as utf-8. If the first or second line of the input file matches the emacs mode line format .\" -*- [...;] coding: encoding; -*- then input is interpreted according to encoding. If the first non-ASCII byte in the file introduces a valid UTF-8 sequence, input is interpreted as utf-8. Otherwise, input is interpreted as iso-8859-1. -mdoc | -man With -mdoc, all input files are interpreted as mdoc(7). With -man, all input files are interpreted as man(7). By default, the input language is automatically detected for each file: if the first macro is Dd or Dt, the mdoc(7) parser is used; otherwise, the man(7) parser is used. With other arguments, -m is silently ignored. -O options Comma-separated output options. See the descriptions of the individual output formats for supported options. -T output Select the output format. Supported values for the output argument are ascii, html, the default of locale, man, markdown, pdf, ps, tree, and utf8. The special -T lint mode only parses the input and produces no output. It implies -W all and redirects parser messages, which usually appear on standard error output, to standard output. -W level Specify the minimum message level to be reported on the standard error output and to affect the exit status. The level can be base, style, warning, error, or unsupp. The base level automatically derives the operating system from the contents of the Os macro, from the -Ios command line option, or from the uname(3) return value. The levels openbsd and netbsd are variants of base that bypass autodetection and request validation of base system conventions for a particular operating system. The level all is an alias for base. By default, mandoc is silent. See EXIT STATUS and DIAGNOSTICS for details. The special option -W stop tells mandoc to exit after parsing a file that causes warnings or errors of at least the requested level. No formatted output will be produced from that file. If both a level and stop are requested, they can be joined with a comma, for example -W error,stop. file Read from the given input file. If multiple files are specified, they are processed in the given order. If unspecified, mandoc reads from standard input. The options -fhklw are also supported and are documented in man(1). In -f and -k mode, mandoc also supports the options -CMmOSs described in the apropos(1) manual. The options -fkl are mutually exclusive and override each other. ASCII Output Use -T ascii to force text output in 7-bit ASCII character encoding documented in the ascii(7) manual page, ignoring the locale(1) set in the environment. Font styles are applied by using back-spaced encoding such that an underlined character ‘c’ is rendered as ‘_\[bs]c’, where ‘\[bs]’ is the back-space character number 8. Emboldened characters are rendered as ‘c\[bs]c’. This markup is typically converted to appropriate terminal sequences by the pager or ul(1). To remove the markup, pipe the output to col(1) -b instead. The special characters documented in mandoc_char(7) are rendered best-effort in an ASCII equivalent. In particular, opening and closing ‘single quotes’ are represented as characters number 0x60 and 0x27, respectively, which agrees with all ASCII standards from 1965 to the latest revision (2012) and which matches the traditional way in which roff(7) formatters represent single quotes in ASCII output. This correct ASCII rendering may look strange with modern Unicode-compatible fonts because contrary to ASCII, Unicode uses the code point U+0060 for the grave accent only, never for an opening quote. The following -O arguments are accepted: indent=indent The left margin for normal text is set to indent blank characters instead of the default of five. Increasing this is not recommended; it may result in degraded formatting, for example overfull lines or ugly line breaks. When output is to a pager on a terminal that is less than 66 columns wide, the default is reduced to three columns. mdoc Format man(7) input files in mdoc(7) output style. This prints the operating system name rather than the page title on the right side of the footer line. One useful application is for checking that -T man output formats in the same way as the mdoc(7) source it was generated from. tag[=term] If the formatted manual page is opened in a pager, go to the definition of the term rather than showing the manual page from the beginning. If no term is specified, reuse the first command line argument that is not a section number. If that argument is in apropos(1) key=val format, only the val is used rather than the argument as a whole. This is useful for commands like ‘man -akO tag Ic=ulimit’ to search for a keyword and jump right to its definition in the matching manual pages. width=width The output width is set to width instead of the default of 78. When output is to a pager on a terminal that is less than 79 columns wide, the default is reduced to one less than the terminal width. In any case, lines that are output in literal mode are never wrapped and may exceed the output width. HTML Output Output produced by -T html conforms to HTML5 using optional self-closing tags. Equations rendered from eqn(7) blocks use MathML. Non-ASCII characters are rendered as hexadecimal Unicode character references. The following -O arguments are accepted: fragment Omit the <!DOCTYPE> declaration and the <html>, <head>, and <body> elements and only emit the subtree below the <body> element. The style argument will be ignored. This is useful when embedding manual content within existing documents. includes=fmt The string fmt, for example, ../src/%I.html, is used as a template for linked header files (usually via the In macro). Instances of ‘%I’ are replaced with the include filename. The default is not to present a hyperlink. man=fmt[;fmt] The string fmt, for example, ../html%S/%N.%S.html, is used as a template for linked manuals (usually via the Xr macro). Instances of ‘%N’ and ‘%S’ are replaced with the linked manual's name and section, respectively. If no section is included, section 1 is assumed. The default is not to present a hyperlink. If two formats are given and a file %N.%S exists in the current directory, the first format is used; otherwise, the second format is used. style=style.css The file style.css is used as an external stylesheet. This must be a valid absolute or relative URI. Using the file mandoc.css that is distributed with mandoc is recommended. It provides an appearance similar to terminal output with some additional features specific to mandoc HTML output, in particular making anchor locations that support deep linking stand out visually by putting a dotted line under them, providing tooltips showing the semantic function of elements (macro names), providing some simple aspects of responsive web design, and providing simple support for users who prefer a dark color scheme. Using a custom CSS file is possible, but writing it requires proficiency in all of the languages HTML 5, CSS 4, and mdoc(7) and familiarity with the mandoc-specific classes used in mandoc.css. Besides, while the file mandoc.css is always adapted to the HTML output generated by the mandoc version it is distributed with, maintaining a custom CSS file usually requires adaptations each time mandoc is upgraded to a new version. If a stylesheet is not specified with -O style, -T html embeds a minimal stylesheet into the HTML output, mostly to select adequate font-style and font-weight attributes for various macros. The result is readable in any graphical or text-based web browser, but does not aim for looking similar to terminal output. Instead, formatting is mostly left to browser defaults and to user settings in the browser configuration. tag[=term] Same syntax and semantics as for ASCII Output. This is implemented by passing a file:// URI ending in a fragment identifier to the pager rather than passing merely a file name. When using this argument, use a pager supporting such URIs, for example MANPAGER='lynx -force_html' man -T html -O tag=MANPAGER man MANPAGER='w3m -T text/html' man -T html -O tag=toc mandoc Consequently, for HTML output, this argument does not work with more(1) or less(1). For example, ‘MANPAGER=less man -T html -O tag=toc mandoc’ does not work because less(1) does not support file:// URIs. toc If an input file contains at least two non-standard sections, print a table of contents near the beginning of the output. Locale Output By default, mandoc automatically selects UTF-8 or ASCII output according to the current locale(1). If any of the environment variables LC_ALL, LC_CTYPE, or LANG are set and the first one that is set selects the UTF-8 character encoding, it produces UTF-8 Output; otherwise, it falls back to ASCII Output. This output mode can also be selected explicitly with -T locale. Man Output Use -T man to translate mdoc(7) input into man(7) output format. This is useful for distributing manual sources to legacy systems lacking mdoc(7) formatters. Embedded eqn(7) and tbl(7) code is not supported. If the input format of a file is man(7), the input is copied to the output. The parser is also run, and as usual, the -W level controls which DIAGNOSTICS are displayed before copying the input to the output. Markdown Output Use -T markdown to translate mdoc(7) input to the markdown format conforming to John Gruber's 2004 specification. The output also almost conforms to the CommonMark specification. The character set used for the markdown output is ASCII. Non-ASCII characters are encoded as HTML entities. Since that is not possible in literal font contexts, because these are rendered as code spans and code blocks in the markdown output, non-ASCII characters are transliterated to ASCII approximations in these contexts. Markdown is a very weak markup language, so all semantic markup is lost, and even part of the presentational markup may be lost. Do not use this as an intermediate step in converting to HTML; instead, use -T html directly. The man(7), tbl(7), and eqn(7) input languages are not supported by -T markdown output mode. PDF Output PDF-1.1 output may be generated by -T pdf. See PostScript Output for -O arguments and defaults. PostScript Output PostScript "Adobe-3.0" Level-2 pages may be generated by -T ps. Output pages default to letter sized and are rendered in the Times font family, 11-point. Margins are calculated as 1/9 the page length and width. Line-height is 1.4m. Special characters are rendered as in ASCII Output. The following -O arguments are accepted: paper=name The paper size name may be one of a3, a4, a5, legal, or letter. You may also manually specify dimensions as NNxNN, width by height in millimetres. If an unknown value is encountered, letter is used. UTF-8 Output Use -T utf8 to force text output in UTF-8 multi-byte character encoding, ignoring the locale(1) settings in the environment. See ASCII Output regarding font styles and -O arguments. On operating systems lacking locale or wide character support, and on those where the internal character representation is not UCS-4, mandoc always falls back to ASCII Output. Syntax tree output Use -T tree to show a human readable representation of the syntax tree. It is useful for debugging the source code of manual pages. The exact format is subject to change, so don't write parsers for it. The first paragraph shows meta data found in the mdoc(7) prologue, on the man(7) TH line, or the fallbacks used. In the tree dump, each output line shows one syntax tree node. Child nodes are indented with respect to their parent node. The columns are: For macro nodes, the macro name; for text and tbl(7) nodes, the content. There is a special format for eqn(7) nodes. Node type (text, elem, block, head, body, body-end, tail, tbl, eqn). Flags: An opening parenthesis if the node is an opening delimiter. An asterisk if the node starts a new input line. The input line number (starting at one). A colon. The input column number (starting at one). A closing parenthesis if the node is a closing delimiter. A full stop if the node ends a sentence. BROKEN if the node is a block broken by another block. NOSRC if the node is not in the input file, but automatically generated from macros. NOPRT if the node is not supposed to generate output for any output format. The following -O argument is accepted: noval Skip validation and show the unvalidated syntax tree. This can help to find out whether a given behaviour is caused by the parser or by the validator. Meta data is not available in this case. ENVIRONMENT LC_CTYPE The character encoding locale(1). When Locale Output is selected, it decides whether to use ASCII or UTF-8 output format. It never affects the interpretation of input files. MANPAGER Any non-empty value of the environment variable MANPAGER is used instead of the standard pagination program, less(1); see man(1) for details. Only used if -a or -l is specified. PAGER Specifies the pagination program to use when MANPAGER is not defined. If neither PAGER nor MANPAGER is defined, less(1) is used. Only used if -a or -l is specified. EXIT STATUS The mandoc utility exits with one of the following values, controlled by the message level associated with the -W option: 0 No base system convention violations, style suggestions, warnings, or errors occurred, or those that did were ignored because they were lower than the requested level. 1 At least one base system convention violation or style suggestion occurred, but no warning or error, and -W base or -W style was specified. 2 At least one warning occurred, but no error, and -W warning or a lower level was requested. 3 At least one parsing error occurred, but no unsupported feature was encountered, and -W error or a lower level was requested. 4 At least one unsupported feature was encountered, and -W unsupp or a lower level was requested. 5 Invalid command line arguments were specified. No input files have been read. 6 An operating system error occurred, for example exhaust'''
