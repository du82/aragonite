["https://man.openbsd.org/errno.2"]
title = "intro(2) - OpenBSD manual pages"
full_description = "NAME intro, errno — introduction to system calls and error numbers SYNOPSIS #include <errno.h> DESCRIPTION The manual pages in section 2 provide an overview of the system calls, their error returns, and other common definitions and concepts. Programs may be restricted to a subset of system calls with pledge(2). DIAGNOSTICS Nearly all of the system calls provide an error number via the identifier errno, which expands to an addressable location of type int. The address of errno in each thread is guaranteed to be unique for the lifetime of the thread. Applications must use errno as defined in <errno.h> and not attempt to use a custom definition. When a system call detects an error, it returns an integer value indicating failure (usually -1) and sets the variable errno accordingly. (This allows interpretation of the failure on receiving a -1 and to take action accordingly.) Successful calls never set errno; once set, it remains until another error occurs. It should only be examined after an error. Note that a number of system calls overload the meanings of these error numbers, and that the meanings must be interpreted according to the type and circumstances of the call. The following is a complete list of the errors and their names as given in <sys/errno.h>. 0 Undefined error: 0. Not used. 1 EPERM Operation not permitted. An attempt was made to perform an operation limited to processes with appropriate privileges or to the owner of a file or other resources. 2 ENOENT No such file or directory. A component of a specified pathname did not exist, or the pathname was an empty string. 3 ESRCH No such process. No process could be found which corresponds to the given process ID. 4 EINTR Interrupted system call. An asynchronous signal (such as SIGINT or SIGQUIT) was caught by the thread during the execution of an interruptible function. If the signal handler performs a normal return, the interrupted function call will seem to have returned the error condition. 5 EIO Input/output error. Some physical input or output error occurred. This error will not be reported until a subsequent operation on the same file descriptor and may be lost (overwritten) by any subsequent errors. 6 ENXIO Device not configured. Input or output on a special file referred to a device that did not exist, or made a request beyond the limits of the device. This error may also occur when, for example, a tape drive is not online or no disk pack is loaded on a drive. 7 E2BIG Argument list too long. The number of bytes used for the argument and environment list of the new process exceeded the limit ARG_MAX. 8 ENOEXEC Exec format error. A request was made to execute a file that, although it has the appropriate permissions, was not in the format required for an executable file. 9 EBADF Bad file descriptor. A file descriptor argument was out of range, referred to no open file, or a read (write) request was made to a file that was only open for writing (reading). 10 ECHILD No child processes. A wait(2), waitid(2), or waitpid(2) function was executed by a process that had no existing or unwaited-for child processes. 11 EDEADLK Resource deadlock avoided. An attempt was made to lock a system resource that would have resulted in a deadlock situation. 12 ENOMEM Cannot allocate memory. The new process image required more memory than was allowed by the hardware or by system-imposed memory management constraints. A lack of swap space is normally temporary; however, a lack of core is not. Soft limits may be increased to their corresponding hard limits. 13 EACCES Permission denied. An attempt was made to access a file in a way forbidden by its file access permissions. 14 EFAULT Bad address. The system detected an invalid address in attempting to use an argument of a call. 15 ENOTBLK Block device required. A block device operation was attempted on a non-block device or file. 16 EBUSY Device busy. An attempt to use a system resource which was in use at the time in a manner which would have conflicted with the request. 17 EEXIST File exists. An existing file was mentioned in an inappropriate context, for instance, as the new link name in a link(2) function. 18 EXDEV Cross-device link. A hard link to a file on another file system was attempted. 19 ENODEV Operation not supported by device. An attempt was made to apply an inappropriate function to a device, for example, trying to read a write-only device such as a printer. 20 ENOTDIR Not a directory. A component of the specified pathname existed, but it was not a directory, when a directory was expected. 21 EISDIR Is a directory. An attempt was made to open a directory with write mode specified. 22 EINVAL Invalid argument. Some invalid argument was supplied. (For example, specifying an undefined signal to a signal(3) or kill(2) function). 23 ENFILE Too many open files in system. Maximum number of file descriptors allowable on the system has been reached and a request for an open cannot be satisfied until at least one has been closed. The sysctl(2) variable kern.maxfiles contains the current limit. 24 EMFILE Too many open files. The maximum number of file descriptors allowable for this process has been reached and a request for an open cannot be satisfied until at least one has been closed. getdtablesize(3) will obtain the current limit. 25 ENOTTY Inappropriate ioctl for device. A control function (see ioctl(2)) was attempted for a file or special device for which the operation was inappropriate. 26 ETXTBSY Text file busy. An attempt was made either to execute a pure procedure (shared text) file which was open for writing by another process, or to open with write access a pure procedure file that is currently being executed. 27 EFBIG File too large. The size of a file exceeded the maximum. (The system-wide maximum file size is 2**63 bytes. Each file system may impose a lower limit for files contained within it.) 28 ENOSPC No space left on device. A write(2) to an ordinary file, the creation of a directory or symbolic link, or the creation of a directory entry failed because no more disk blocks were available on the file system, or the allocation of an inode for a newly created file failed because no more inodes were available on the file system. 29 ESPIPE Illegal seek. An lseek(2) function was issued on a socket, pipe or FIFO. 30 EROFS Read-only file system. An attempt was made to modify a file or create a directory on a file system that was read-only at the time. 31 EMLINK Too many links. The maximum allowable number of hard links to a single file has been exceeded (see pathconf(2) for how to obtain this value). 32 EPIPE Broken pipe. A write on a pipe, socket or FIFO for which there is no process to read the data. 33 EDOM Numerical argument out of domain. A numerical input argument was outside the defined domain of the mathematical function. 34 ERANGE Result too large. A result of the function was too large to fit in the available space (perhaps exceeded precision). 35 EAGAIN Resource temporarily unavailable. This is a temporary condition and later calls to the same routine may complete normally. 36 EINPROGRESS Operation now in progress. An operation that takes a long time to complete (such as a connect(2)) was attempted on a non-blocking object (see fcntl(2)). 37 EALREADY Operation already in progress. An operation was attempted on a non-blocking object that already had an operation in progress. 38 ENOTSOCK Socket operation on non-socket. Self-explanatory. 39 EDESTADDRREQ Destination address required. A required address was omitted from an operation on a socket. 40 EMSGSIZE Message too long. A message sent on a socket was larger than the internal message buffer or some other network limit. 41 EPROTOTYPE Protocol wrong type for socket. A protocol was specified that does not support the semantics of the socket type requested. For example, you cannot use the Internet UDP protocol with type SOCK_STREAM. 42 ENOPROTOOPT Protocol not available. A bad option or level was specified in a getsockopt(2) or setsockopt(2) call. 43 EPROTONOSUPPORT Protocol not supported. The protocol has not been configured into the system or no implementation for it exists. 44 ESOCKTNOSUPPORT Socket type not supported. The support for the socket type has not been configured into the system or no implementation for it exists. 45 EOPNOTSUPP Operation not supported. The attempted operation is not supported for the type of object referenced. Usually this occurs when a file descriptor refers to a file or socket that cannot support this operation, for example, trying to accept a connection on a datagram socket. 46 EPFNOSUPPORT Protocol family not supported. The protocol family has not been configured into the system or no implementation for it exists. 47 EAFNOSUPPORT Address family not supported by protocol family. An address incompatible with the requested protocol was used. For example, you shouldn't necessarily expect to be able to use NS addresses with Internet protocols. 48 EADDRINUSE Address already in use. Only one usage of each address is normally permitted. 49 EADDRNOTAVAIL Can't assign requested address. Normally results from an attempt to create a socket with an address not on this machine. 50 ENETDOWN Network is down. A socket operation encountered a dead network. 51 ENETUNREACH Network is unreachable. A socket operation was attempted to an unreachable network. 52 ENETRESET Network dropped connection on reset. The host you were connected to crashed and rebooted. 53 ECONNABORTED Software caused connection abort. A connection abort was caused internal to your host machine. 54 ECONNRESET Connection reset by peer. A connection was forcibly closed by a peer. This normally results from a loss of the connection on the remote socket due to a timeout or a reboot. 55 ENOBUFS No buffer space available. An operation on a socket or pipe was not performed because the system lacked sufficient buffer space or because a queue was full. 56 EISCONN Socket is already connected. A connect(2) request was made on an already connected socket; or, a sendto(2) or sendmsg(2) request on a connected socket specified a destination when already connected. 57 ENOTCONN Socket is not connected. A request to send or receive data was disallowed because the socket was not connected and (when sending on a datagram socket) no address was supplied. 58 ESHUTDOWN Can't send after socket shutdown. A request to send data was disallowed because the socket had already been shut down with a previous shutdown(2) call. 59 ETOOMANYREFS Too many references: can't splice. Not used in OpenBSD. 60 ETIMEDOUT Operation timed out. A connect(2) or send(2) request failed because the connected party did not properly respond after a period of time. (The timeout period is dependent on the communication protocol.) 61 ECONNREFUSED Connection refused. No connection could be made because the target machine actively refused it. This usually results from trying to connect to a service that is inactive on the foreign host. 62 ELOOP Too many levels of symbolic links. A pathname lookup involved more than 32 (SYMLOOP_MAX) symbolic links. 63 ENAMETOOLONG File name too long. A component of a pathname exceeded 255 (NAME_MAX) characters, or an entire pathname (including the terminating NUL) exceeded 1024 (PATH_MAX) bytes. 64 EHOSTDOWN Host is down. A socket operation failed because the destination host was down. 65 EHOSTUNREACH No route to host. A socket operation was attempted to an unreachable host. 66 ENOTEMPTY Directory not empty. A directory with entries other than ‘.’ and ‘..’ was supplied to a remove directory or rename call. 67 EPROCLIM Too many processes. 68 EUSERS Too many users. The quota system ran out of table entries. 69 EDQUOT Disk quota exceeded. A write(2) to an ordinary file, the creation of a directory or symbolic link, or the creation of a directory entry failed because the user's quota of disk blocks was exhausted, or the allocation of an inode for a newly created file failed because the user's quota of inodes was exhausted. 70 ESTALE Stale NFS file handle. An attempt was made to access an open file on an NFS filesystem which is now unavailable as referenced by the file descriptor. This may indicate the file was deleted on the NFS server or some other catastrophic event occurred. 72 EBADRPC RPC struct is bad. Exchange of rpc(3) information was unsuccessful. 73 ERPCMISMATCH RPC version wrong. The version of rpc(3) on the remote peer is not compatible with the local version. 74 EPROGUNAVAIL RPC program not available. The requested rpc(3) program is not registered on the remote host. 75 EPROGMISMATCH Program version wrong. The requested version of the rpc(3) program is not available on the remote host. 76 EPROCUNAVAIL Bad procedure for program. An rpc(3) call was attempted for a procedure which doesn't exist in the remote program. 77 ENOLCK No locks available. A system-imposed limit on the number of simultaneous file locks was reached. 78 ENOSYS Function not implemented. Attempted a system call that is not available on this system. 79 EFTYPE Inappropriate file type or format. The file contains invalid data or set to invalid modes. 80 EAUTH Authentication error. Attempted to use an invalid authentication ticket to mount a NFS filesystem. 81 ENEEDAUTH Need authenticator. An authentication ticket must be obtained before the given NFS filesystem may be mounted. 82 EIPSEC IPsec processing failure. IPsec subsystem error. Not used in OpenBSD. 83 ENOATTR Attribute not found. A UFS Extended Attribute is not found for the specified pathname. 84 EILSEQ Illegal byte sequence. An illegal sequence of bytes was used when using wide characters. 85 ENOMEDIUM No medium found. Attempted to use a removable media device with no medium present. 86 EMEDIUMTYPE Wrong medium type. Attempted to use a removable media device with incorrect or incompatible medium. 87 EOVERFLOW Value too large to be stored in data type. A numerical result of the function was too large to be stored in the caller provided space. 88 ECANCELED Operation canceled. The requested operation was canceled. 89 EIDRM Identifier removed. An IPC identifier was removed while the current thread was waiting on it. 90 ENOMSG No message of desired type. An IPC message queue does not contain a message of the desired type, or a message catalog does not contain the requested message. 91 ENOTSUP Not supported. The operation has requested an unsupported value. 92 EBADMSG Bad message. A corrupted message was detected. 93 ENOTRECOVERABLE State not recoverable. The state protected by a robust mutex is not recoverable. 94 EOWNERDEAD Previous owner died. The owner of a robust mutex terminated while holding the mutex lock. 95 EPROTO Protocol error. A device-specific protocol error occurred. DEFINITIONS Process A process is a collection of one or more threads, plus the resources shared by those threads such as process ID, address space, user IDs and group IDs, and root directory and"
