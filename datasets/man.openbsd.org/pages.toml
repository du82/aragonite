["https://man.openbsd.org/roff.7"]
title = "roff(7) - OpenBSD manual pages"
full_description = '''NAME roff — roff language reference for mandoc DESCRIPTION The roff language is a general purpose text formatting language. Since traditional implementations of the mdoc(7) and man(7) manual formatting languages are based on it, many real-world manuals use small numbers of roff requests and escape sequences intermixed with their mdoc(7) or man(7) code. To properly format such manuals, the mandoc(1) utility supports a subset of roff requests and escapes. Even though this manual page lists all roff requests and escape sequences, it only contains partial information about requests not supported by mandoc(1) and about language features that do not matter for manual pages. For complete roff manuals, consult the SEE ALSO section. Input lines beginning with the control character ‘.’ are parsed for requests and macros. Such lines are called “request lines” or “macro lines”, respectively. Requests change the processing state and manipulate the formatting; some macros also define the document structure and produce formatted output. The single quote ("'") is accepted as an alternative control character, treated by mandoc(1) just like ‘.’ Lines not beginning with control characters are called “text lines”. They provide free-form text to be printed; the formatting of the text depends on the respective processing context. LANGUAGE SYNTAX roff documents may contain only graphable 7-bit ASCII characters, the space character, and, in certain circumstances, the tab character. The backslash character ‘\’ indicates the start of an escape sequence, used for example for Comments and Special Characters. For a complete listing of escape sequences, consult the ESCAPE SEQUENCE REFERENCE below. Comments Text following an escaped double-quote ‘\"’, whether in a request, macro, or text line, is ignored to the end of the line. A request line beginning with a control character and comment escape ‘.\"’ is also ignored. Furthermore, request lines with only a control character and optional trailing whitespace are stripped from input. Examples: .\" This is a comment line. .\" The next line is ignored: . .Sh EXAMPLES \" This is a comment, too. example text \" And so is this. Special Characters Special characters are used to encode special glyphs and are rendered differently across output media. They may occur in request, macro, and text lines. Sequences begin with the escape character ‘\’ followed by either an open-parenthesis ‘(’ for two-character sequences; an open-bracket ‘[’ for n-character sequences (terminated at a close-bracket ‘]’); or a single one character sequence. Examples: \(em Two-letter em dash escape. \e One-letter backslash escape. See mandoc_char(7) for a complete list. Font Selection In mdoc(7) and man(7) documents, fonts are usually selected with macros. The \f escape sequence and the ft request can be used to manually change the font, but this is not recommended in mdoc(7) documents. Such manual font changes are overridden by many subsequent macros. The following fonts are supported: B Bold font. BI A font that is both bold and italic. CB Bold constant width font. Same as B in terminal output. CI Italic constant width font. Same as I in terminal output. CR Regular constant width font. Same as R in terminal output. CW An alias for CR. I Italic font. P Return to the previous font. If a macro caused a font change since the last \f escape sequence or ft request, this returns to the font before the last font change in the macro rather than to the font before the last manual font change. R Roman font. This is the default font. 1 An alias for R. 2 An alias for I. 3 An alias for B. 4 An alias for BI. Examples: \fBbold\fR Write in bold, then switch to regular font mode. \fIitalic\fP Write in italic, then return to previous font mode. \f(BIbold italic\fP Write in bold italic, then return to previous font mode. Whitespace Whitespace consists of the space character. In text lines, whitespace is preserved within a line. In request and macro lines, whitespace delimits arguments and is discarded. Unescaped trailing spaces are stripped from text line input unless in a literal context. In general, trailing whitespace on any input line is discouraged for reasons of portability. In the rare case that a space character is needed at the end of an input line, it may be forced by ‘\ \&’. Literal space characters can be produced in the output using escape sequences. In macro lines, they can also be included in arguments using quotation; see MACRO SYNTAX for details. Blank text lines, which may include whitespace, are only permitted within literal contexts. If the first character of a text line is a space, that line is printed with a leading newline. Scaling Widths Many requests and macros support scaled widths for their arguments. The syntax for a scaled width is ‘[+-]?[0-9]*.[0-9]*[:unit:]’, where a decimal must be preceded or followed by at least one digit. The following scaling units are accepted: c centimetre i inch P pica (1/6 inch) p point (1/72 inch) f scale ‘u’ by 65536 v default vertical span m width of rendered ‘m’ (em) character n width of rendered ‘n’ (en) character u default horizontal span for the terminal M mini-em (1/100 em) Using anything other than ‘m’, ‘n’, or ‘v’ is necessarily non-portable across output media. See COMPATIBILITY. If a scaling unit is not provided, the numerical value is interpreted under the default rules of ‘v’ for vertical spaces and ‘u’ for horizontal ones. Examples: .Bl -tag -width 2i two-inch tagged list indentation in mdoc(7) .HP 2i two-inch tagged list indentation in man(7) .sp 2v two vertical spaces Sentence Spacing Each sentence should terminate at the end of an input line. By doing this, a formatter will be able to apply the proper amount of spacing after the end of sentence (unescaped) period, exclamation mark, or question mark followed by zero or more non-sentence closing delimiters (‘)’, ‘]’, ‘'’, ‘"’). The proper spacing is also intelligently preserved if a sentence ends at the boundary of a macro line. If an input line happens to end with a period, exclamation or question mark that isn't the end of a sentence, append a zero-width space (‘\&’). Examples: Do not end sentences mid-line like this. Instead, end a sentence like this. A macro would end like this: .Xr mandoc 1 . An abbreviation at the end of an input line needs escaping, e.g.\& like this. REQUEST SYNTAX A request or macro line consists of: the control character ‘.’ or ‘'’ at the beginning of the line, optionally an arbitrary amount of whitespace, the name of the request or the macro, which is one word of arbitrary length, terminated by whitespace, and zero or more arguments delimited by whitespace. Thus, the following request lines are all equivalent: .ig end .ig end . ig end MACRO SYNTAX Macros are provided by the mdoc(7) and man(7) languages and can be defined by the de request. When called, they follow the same syntax as requests, except that macro arguments may optionally be quoted by enclosing them in double quote characters (‘"’). Quoted text, even if it contains whitespace or would cause a macro invocation when unquoted, is always considered literal text. Inside quoted text, pairs of double quote characters (‘""’) resolve to single double quote characters. To be recognised as the beginning of a quoted argument, the opening quote character must be preceded by a space character. A quoted argument extends to the next double quote character that is not part of a pair, or to the end of the input line, whichever comes earlier. Leaving out the terminating double quote character at the end of the line is discouraged. For clarity, if more arguments follow on the same input line, it is recommended to follow the terminating double quote character by a space character; in case the next character after the terminating double quote character is anything else, it is regarded as the beginning of the next, unquoted argument. Both in quoted and unquoted arguments, pairs of backslashes (‘\\’) resolve to single backslashes. In unquoted arguments, space characters can alternatively be included by preceding them with a backslash (‘\ ’), but quoting is usually better for clarity. Examples: .Fn strlen "const char *s" Group arguments "const char *s" into one function argument. If unspecified, "const", "char", and "*s" would be considered separate arguments. .Op "Fl a" Consider "Fl a" as literal text instead of a flag macro. REQUEST REFERENCE The mandoc(1) roff parser recognises the following requests. For requests marked as "ignored" or "unsupported", any arguments are ignored, and the number of arguments is not checked. ab [message] Abort processing. Currently unsupported. ad [b | c | l | n | r] Set line adjustment mode for subsequent text. Currently ignored. af registername format Assign an output format to a number register. Currently ignored. aln newname oldname Create an alias for a number register. Currently unsupported. als newname oldname Create an alias for a request, string, macro, or diversion. am macroname [endmacro] Append to a macro definition. The syntax of this request is the same as that of de. am1 macroname [endmacro] Append to a macro definition, switching roff compatibility mode off during macro execution (groff extension). The syntax of this request is the same as that of de1. Since mandoc(1) does not implement roff compatibility mode at all, it handles this request as an alias for am. ami macrostring [endstring] Append to a macro definition, specifying the macro name indirectly (groff extension). The syntax of this request is the same as that of dei. ami1 macrostring [endstring] Append to a macro definition, specifying the macro name indirectly and switching roff compatibility mode off during macro execution (groff extension). The syntax of this request is the same as that of dei1. Since mandoc(1) does not implement roff compatibility mode at all, it handles this request as an alias for ami. as stringname [string] Append to a user-defined string. The syntax of this request is the same as that of ds. If a user-defined string with the specified name does not yet exist, it is set to the empty string before appending. as1 stringname [string] Append to a user-defined string, switching roff compatibility mode off during macro execution (groff extension). The syntax of this request is the same as that of ds1. Since mandoc(1) does not implement roff compatibility mode at all, it handles this request as an alias for as. asciify divname Fully unformat a diversion. Currently unsupported. backtrace Print a backtrace of the input stack. This is a groff extension and currently ignored. bd font [curfont] [offset] Artificially embolden by repeated printing with small shifts. Currently ignored. bleedat left top width height Set the BleedBox page parameter for PDF generation. This is a Heirloom extension and currently ignored. blm macroname Set a blank line trap. Currently unsupported. box divname Begin a diversion without including a partially filled line. Currently unsupported. boxa divname Add to a diversion without including a partially filled line. Currently unsupported. bp [+|-]pagenumber Begin a new page. Currently ignored. BP source height width position offset flags label Define a frame and place a picture in it. This is a Heirloom extension and currently unsupported. br Break the output line. break Break out of the innermost while loop. breakchar char ... Optional line break characters. This is a Heirloom extension and currently ignored. brnl N Break output line after the next N input lines. This is a Heirloom extension and currently ignored. brp Break and spread output line. Currently, this is implemented as an alias for br. brpnl N Break and spread output line after the next N input lines. This is a Heirloom extension and currently ignored. c2 [char] Change the no-break control character. Currently unsupported. cc [char] Change the control character. If char is not specified, the control character is reset to ‘.’. Trailing characters are ignored. ce [N] Center the next N input lines without filling. N defaults to 1. An argument of 0 or less ends centering. Currently, high level macros abort centering. cf filename Output the contents of a file. Ignored because insecure. cflags flags char ... Set character flags. This is a groff extension and currently ignored. ch macroname [dist] Change a trap location. Currently ignored. char glyph [string] Define or redefine the ASCII character or character escape sequence glyph to be rendered as string, which can be empty. Only partially supported in mandoc(1); may interact incorrectly with tr. chop stringname Remove the last character from a macro, string, or diversion. Currently unsupported. class classname char ... Define a character class. This is a groff extension and currently ignored. close streamname Close an open file. Ignored because insecure. CL color text Print text in color. This is a Heirloom extension and currently unsupported. color [1 | 0] Activate or deactivate colors. This is a groff extension and currently ignored. composite from to Define a name component for composite glyph names. This is a groff extension and currently unsupported. continue Immediately start the next iteration of a while loop. Currently unsupported. cp [1 | 0] Switch roff compatibility mode on or off. Currently ignored. cropat left top width height Set the CropBox page parameter for PDF generation. This is a Heirloom extension and currently ignored. cs font [width [emsize]] Constant character spacing mode. Currently ignored. cu [N] Underline next N input lines including whitespace. Currently ignored. da divname Append to a diversion. Currently unsupported. dch macroname [dist] Change a trap location in the current diversion. This is a Heirloom extension and currently unsupported. de macroname [endmacro] Define a roff macro. Its syntax can be either .de macroname definition .. or .de macroname endmacro definition .endmacro Both forms define or redefine the macro macroname to represent the definition, which may consist of one or more input lines, including the newline characters terminating each line, optionally containing calls to roff requests, roff macros or high-level macros like man(7) or mdoc(7) macros, whichever applies to the document in question. Specifying a custom endmacro works in the same way as for ig; namely, the call to ‘.endmacro’ first ends the definition, and after that, it is also evaluated as a roff request or roff macro, but not as a high-level macro. The macro can be invoked later using the syntax .macroname [argument [argument ...]] Regarding argument parsing, see MACRO SYNTAX above. The line invoking the macro will be replaced in the input stream by the definition, replacing all occurrences of \\$N, where N is a digit, by the Nth argument. For example, .de ZN \fI\^\\$1\^\fP\\$2 .. .ZN XtFree . produces \fI\^XtFree\^\fP. in the input stream, and thus in the output: XtFree. Each occurrence of \\$'''
year_published = 2023
clearnet = "https://man.openbsd.org/roff.7"
category = "SitesList"
