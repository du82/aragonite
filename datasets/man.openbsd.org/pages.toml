title = "less(1) - OpenBSD manual pages"
full_description = '''NAME less — view files SYNOPSIS less [-?~AaBCcdEeFfGgIiJKLMmNnQqRrSsUuVWwX] [-b n] [-h n] [-j n] [-k keyfile] [-O | -o logfile] [-P prompt] [-p pattern] [-T tagsfile] [-t tag] [-x n,...] [-y n] [-z n] [-# n] [file ...] DESCRIPTION less displays text one screenful at a time. After showing each screenful, it prompts the user for a command, as described in COMMANDS. When showing the last line of a file, less displays a prompt indicating end of file and the name of the next file to examine, if any. It then waits for input from the user. less is similar to the traditional more(1), but with many more features. less will behave like more(1) if it is called as more, or if the LESS_IS_MORE environment variable is set. The main differences between the two are summarized in the COMPATIBILITY WITH MORE section, below. A long option name may be abbreviated as long as the abbreviation is unambiguous. Such option names need only have their first letter capitalized; the remainder of the name may be in either case. For example, --Quit-at-eof is equivalent to --QUIT-AT-EOF. The options are as follows: -? | --help This option displays a summary of the commands accepted by less (the same as the h command). (Depending on how your shell interprets the question mark, it may be necessary to quote the question mark, thus: ‘-\?’.) -A | --SEARCH-SKIP-SCREEN Causes all forward searches (not just non-repeated searches) to start just after the target line, and all backward searches to start just before the target line. Thus, forward searches will skip part of the displayed screen (from the first line up to and including the target line). Similarly backwards searches will skip the displayed screen from the last line up to and including the target line. This was the default behavior in less versions prior to 441. -a | --search-skip-screen By default, forward searches start at the top of the displayed screen and backwards searches start at the bottom of the displayed screen (except for repeated searches invoked by the n or N commands, which start after or before the “target” line respectively; see the -j option for more about the target line). The -a option causes forward searches to instead start at the bottom of the screen and backward searches to start at the top of the screen, thus skipping all lines displayed on the screen. -B | --auto-buffers By default, when data is read from a pipe, buffers are allocated automatically as needed. If a large amount of data is read from the pipe, this can cause a large amount of memory to be allocated. The -B option disables this automatic allocation of buffers for pipes, so that only 64K (or the amount of space specified by the -b option) is used for the pipe. Warning: use of -B can result in erroneous display, since only the most recently viewed part of the piped data is kept in memory; any earlier data is lost. -b n | --buffers=n Specifies the amount of buffer space less will use for each file, in units of kilobytes (1024 bytes). By default 64K of buffer space is used for each file (unless the file is a pipe; see the -B option). The -b option specifies instead that n kilobytes of buffer space should be used for each file. If n is -1, buffer space is unlimited; that is, the entire file can be read into memory. -C | --CLEAR-SCREEN Same as -c, for compatibility with older versions of less. -c | --clear-screen Causes full screen repaints to be painted from the bottom of the screen. By default, full screen repaints are done from the top line down to avoid the position of the display being moved when using interactive commands. -d | --dumb The -d option suppresses the error message normally displayed if the terminal is dumb; that is, if the terminal lacks some important capability, such as the ability to clear the screen or scroll backward. The -d option does not otherwise change the behavior of less on a dumb terminal. -E | --QUIT-AT-EOF Causes less to automatically exit the first time it reaches end-of-file. -e | --quit-at-eof Causes less to automatically exit the second time it reaches end-of-file. By default, the only way to exit less is via the q command. -F | --quit-if-one-screen Causes less to automatically exit if the entire file can be displayed on the first screen. -f | --force Forces non-regular files to be opened. (A non-regular file is a directory or a device special file.) Also suppresses the warning message when a binary file is opened. By default, less will refuse to open non-regular files. -G | --HILITE-SEARCH The -G option suppresses all highlighting of strings found by search commands. -g | --hilite-search Normally, less will highlight all strings which match the last search command. The -g option changes this behavior to highlight only the particular string which was found by the last search command. This can cause less to run somewhat faster than the default. -h n | --max-back-scroll=n Specifies a maximum number of lines to scroll backward. If it is necessary to scroll backward more than n lines, the screen is repainted in a forward direction instead. (If the terminal does not have the ability to scroll backward, ‘-h0’ is implied.) -I | --IGNORE-CASE Like -i, but searches ignore case even if the pattern contains uppercase letters. -i | --ignore-case Causes searches to ignore case; that is, uppercase and lowercase are considered identical. This option is ignored if any uppercase letters appear in the search pattern; in other words, if a pattern contains uppercase letters, then that search does not ignore case. -J | --status-column Displays a status column at the left edge of the screen. The status column shows the lines that matched the current search. The status column is also used if the -w or -W option is in effect. -j n | --jump-target=n Specifies a line on the screen where the “target” line is to be positioned. The target line is the line specified by any command to search for a pattern, jump to a line number, jump to a file percentage or jump to a tag. The screen line may be specified by a number: the top line on the screen is 1, the next is 2, and so on. The number may be negative to specify a line relative to the bottom of the screen: the bottom line on the screen is -1, the second to the bottom is -2, and so on. Alternately, the screen line may be specified as a fraction of the height of the screen, starting with a decimal point: .5 is in the middle of the screen, .3 is three tenths down from the first line, and so on. If the line is specified as a fraction, the actual line number is recalculated if the terminal window is resized, so that the target line remains at the specified fraction of the screen height. If any form of the -j option is used, forward searches begin at the line immediately after the target line, and backward searches begin at the target line, unless changed by -a or -A. For example, if ‘-j4’ is used, the target line is the fourth line on the screen, so forward searches begin at the fifth line on the screen. -K | --quit-on-intr Causes less to exit immediately (with status 2) when an interrupt character (usually ^C) is typed. Normally, an interrupt character causes less to stop whatever it is doing and return to its command prompt. Note that use of this option makes it impossible to return to the command prompt from the F command. -k keyfile | --lesskey-file=keyfile Causes less to open and interpret the named file as a lesskey(1) file. Multiple -k options may be specified. If the LESSKEY or LESSKEY_SYSTEM environment variable is set, or if a lesskey file is found in a standard place (see KEY BINDINGS), it is also used as a lesskey file. -M | --LONG-PROMPT Causes less to prompt even more verbosely than more(1). -m | --long-prompt Causes less to prompt verbosely, like more(1), with the percent into the file. By default, less prompts with a colon. -N | --LINE-NUMBERS Causes a line number to be displayed at the beginning of each line in the display. -n | --line-numbers Suppresses line numbers. The default (to use line numbers) may cause less to run more slowly in some cases, especially with a very large input file. Suppressing line numbers with the -n option will avoid this problem. Using line numbers means: the line number will be displayed in the verbose prompt and in the = command, and the v command will pass the current line number to the editor (see also the discussion of LESSEDIT in PROMPTS below). -O logfile | --LOG-FILE=logfile The -O option is like -o, but it will overwrite an existing file without asking for confirmation. If no log file has been specified, the -o and -O options can be used from within less to specify a log file. Without a file name, they will simply report the name of the log file. The s command is equivalent to specifying -o from within less. -o logfile | --log-file=logfile Causes less to copy its input to the named file as it is being viewed. This applies only when the input file is a pipe, not an ordinary file. If the file already exists, less will ask for confirmation before overwriting it. -P prompt | --prompt=prompt Provides a way to tailor the three prompt styles to your own preference. This option would normally be put in the LESS environment variable, rather than being typed in with each less command. Such an option must either be the last option in the LESS variable, or be terminated by a dollar sign. -Ps string changes the default (short) prompt to string. -Pm changes the medium (-m) prompt. -PM changes the long (-M) prompt. -Ph changes the prompt for the help screen. -P= changes the message printed by the = command. -Pw changes the message printed while waiting for data (in the F command). All prompt strings consist of a sequence of letters and special escape sequences. See the section on PROMPTS for more details. -p pattern | --pattern=pattern The -p option on the command line is equivalent to specifying +/pattern; that is, it tells less to start at the first occurrence of pattern in the file. -Q | --QUIET | --SILENT Causes totally quiet operation: the terminal bell is never rung. -q | --quiet | --silent Causes moderately quiet operation: the terminal bell is not rung if an attempt is made to scroll past the end of the file or before the beginning of the file. If the terminal has a visual bell, it is used instead. The bell will be rung on certain other errors, such as typing an invalid character. The default is to ring the terminal bell in all such cases. -R | --RAW-CONTROL-CHARS Like -r, but only ANSI color escape sequences are output in raw form. Unlike -r, the screen appearance is maintained correctly in most cases. ANSI color escape sequences are sequences of the form: ESC [ ... m where the “...” is zero or more color specification characters. For the purpose of keeping track of screen appearance, ANSI color escape sequences are assumed to not move the cursor. You can make less think that characters other than ‘m’ can end ANSI color escape sequences by setting the environment variable LESSANSIENDCHARS to the list of characters which can end a color escape sequence. And you can make less think that characters other than the standard ones may appear between the ESC and the m by setting the environment variable LESSANSIMIDCHARS to the list of characters which can appear. -r | --raw-control-chars Causes raw control characters to be displayed. The default is to display control characters using the caret notation; for example, a control-A (octal 001) is displayed as ‘^A’. Warning: when the -r option is used, less cannot keep track of the actual appearance of the screen (since this depends on how the screen responds to each type of control character). Thus, various display problems may result, such as long lines being split in the wrong place. -S | --chop-long-lines Display only the beginning of lines that exceed the screen width. The remainder can be shown by scrolling horizontally. The default is to wrap long lines; that is, display the remainder on the next line. -s | --squeeze-blank-lines Causes consecutive blank lines to be squeezed into a single blank line. -T tagsfile | --tag-file=tagsfile Specifies a tags file to be used instead of tags. -t tag | --tag=tag The -t option, followed immediately by a tag, will edit the file containing that tag. For this to work, tag information must be available; for example, there may be a file in the current directory called tags, which was previously built by ctags(1) or an equivalent command. The -t option may also be specified from within less (using the - command) as a way of examining a new file. The command :t is equivalent to specifying -t from within less. -U | --UNDERLINE-SPECIAL Causes backspaces, tabs and carriage returns to be treated as control characters; that is, they are handled as specified by the -r option. By default, if neither -u nor -U is given, backspaces which appear adjacent to an underscore character are treated specially: the underlined text is displayed using the terminal's hardware underlining capability. Also, backspaces which appear between two identical characters are treated specially: the overstruck text is printed using the terminal's hardware boldface capability. Other backspaces are deleted, along with the preceding character. Carriage returns immediately followed by a newline are deleted. Other carriage returns are handled as specified by the -r option. Text which is overstruck or underlined can be searched for if neither -u nor -U is in effect. -u | --underline-special Causes backspaces and carriage returns to be treated as printable characters; that is, they are sent to the terminal when they appear in the input. -V | --version Displays the version number of less. -W | --HILITE-UNREAD Like -w, but temporarily highlights the first new line after any forward movement command larger than one line. -w | --hilite-unread Temporarily highlights the first new line after a forward movement of a full page. The first new line is the line immediately following the line previously at the bottom of the screen. Also highlights the target line after a g or p command. The highlight is removed at the next command which causes movement. The entire line is highlighted, unless the -J option is in effect, in which case only the status column is highlighted. -X | --no-init Disables sending the termcap initialization and deinitialization strings to the terminal. This is sometimes desirable if the deinitialization string does something unnecessary, like clearing the screen. -x n,... | --tabs=n,... Sets tab stops. If only one n is specified, tab stops are set at multiples of n. If multiple values separated by commas are specified, tab stops are set at those positions, and then continue with the same spacing as the last two. For example, ‘-x9,17’ will set tabs at positions 9, 17, 25, 33, etc. The default for n is 8. -y n | --max-forw-scroll=n Specifies a maximum number of lines to scroll forward. If it is necessary to scroll forward more than n lines, the screen is repainted in'''
