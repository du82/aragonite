["https://man.sr.ht/support.md"]
title = "Getting support - man.sr.ht"
full_description = ".highlight { background: inherit; }Here's where to find support resources for sr.ht. #Reaching the support team You can reach the support team by emailing ~sircmpwn/sr.ht-support. This is your best bet for account-related issues, billing problems, and so on. Support is provided at the best effort of the sysadmins, who have other things to do as well. It's common to have to wait for a few days to receive an answer to your question. Please be patient. #Asking the community A great place to ask for general questions with using sr.ht, starting discussions about your ideas and feature requests, and generally getting to know the sr.ht community is the sr.ht-discuss mailing list. You can post here by writing an email to ~sircmpwn/sr.ht-discuss@lists.sr.ht. Please review the mailing list etiquette guide first! Be sure to search through the archives, as your question may have been asked before. #Real time chat Both community members and admins hang out at #sr.ht on irc.libera.chat, where you're welcome to ask questions and have discussions in a more free-form, real-time context. There's not always someone paying attention here, so be prepared to wait or follow-up with an email if necessary. Please review the irc etiquette guide first! #Submitting bug reports Note: the sr.ht bug trackers are meant for confirmed bugs and feature requests only, not for end-user support. Please discuss issues or features on the mailing list or on IRC — you will be asked to file a ticket if appropriate. Each service of sr.ht has a dedicated bug tracker: hub.sr.ht git.sr.ht hg.sr.ht builds.sr.ht todo.sr.ht lists.sr.ht man.sr.ht meta.sr.ht paste.sr.ht pages.sr.ht There is also a general-purpose bug tracker for issues that fit nowhere else, or that you're unsure of the appropriate place to report your bug: #Security vulnerabilities Please send an email to ~sircmpwn/sr.ht-security@lists.sr.ht . Please do not discuss security vulnerabilities in public until a fix has been developed and deployed."
