full_description = "Welcome to sr.ht! We have lots of helpful tutorials to introduce you to our platform and get you productive as soon as possible. .tutorial:not(:last-child) { margin-bottom: 1rem; } Setting up your account & first git repository This tutorial is recommended as the first stop for any new user. Get started here Contributing to projects on SourceHut Looking to contribute to an existing project? Most projects on sr.ht accept contributions via email. Check out our interactive tutorial for git-send-email. Read more Organizing your own projects Ready to set up your own projects? Make sure to read this short introduction to understand how projects are organized on SourceHut. Read more Getting started with builds.sr.ht Running your first few jobs on our continuous integration platform, builds.sr.ht. Read more Mastering git rebase git-rebase is a crucial tool in the toolbelt of the productive git user. Our comprehensive reference demystifies it. Read more More tutorials are coming! Is there something in particular you want to see here? Mention it on sr.ht-discuss!"
