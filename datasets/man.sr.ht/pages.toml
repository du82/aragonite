["https://man.sr.ht/~sircmpwn/sr.ht-docs"]
title = "sourcehut docs - man.sr.ht"
full_description = '''Welcome to sourcehut! You can access each of your services from the links in the navigation at the top of the site. You're currently on man.sr.ht, which provides the user manual and hosts wikis for your projects. dt { font-weight: normal; } Start here! New here? We have some great tutorials to get you started. Read the tutorials General documentation Information on billing, terms of service, privacy policy, and so on. Read boring stuff Getting help Need support? There are several resources available to you. Support resources Developers & admins Hacking on or deploying sourcehut yourself? Resources here. Getting started Notice: sr.ht documentation is a work in progress, and is incomplete in many places. News & Updates Want to keep up with the latest news on sr.ht? A monthly "what's cooking" is posted to the sr.ht-announce list. Consider subscribing! Service Documentation Project hub User Manual git.sr.ht: git hosting User Manual — API Reference hg.sr.ht*: mercurial hosting User Manual — API Reference builds.sr.ht: build service User Manual — API Reference todo.sr.ht: bug tracking User Manual — API Reference lists.sr.ht: mailing lists User Manual — API Reference chat.sr.ht: IRC chat rooms User Manual man.sr.ht: manual & wikis User Manual meta.sr.ht: account & security User Manual — API Reference Secondary services The services shown above are the primary services offered by sr.ht. Some secondary services are also available. paste.sr.ht: ad-hoc text file hosting User Manual — API Reference srht.site: static web hosting User Manual — Installation * These services are maintained by sourcehut community members, on infrastructure provided by sourcehut.'''
