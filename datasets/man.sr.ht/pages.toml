title = "Package Repositories - man.sr.ht"
full_description = ".highlight { background: inherit; }The official SourceHut Alpine Linux package repositories are available at mirror.sr.ht. If you would like to contribute to the package repositories, we accept patches at sr.ht-packages. Warning: SourceHut is still in alpha, and has no stable releases. As such, we do not recommend packaging SourceHut for your upstream distribution repositories until we have shipped stable versions of our software. #Alpine Linux Mirror: https://mirror.sr.ht/alpine/v3.20/sr.ht Signing key: alpine@sr.ht.pub Maintainer: Drew DeVault sir@cmpwn.com Source: https://git.sr.ht/~sircmpwn/sr.ht-apkbuilds # Add the following line to /etc/apk/repositories https://mirror.sr.ht/alpine/v3.20/sr.ht # Install signing key wget -q -O /etc/apk/keys/alpine@sr.ht.rsa.pub https://mirror.sr.ht/alpine/alpine@sr.ht.rsa.pub # Update package index apk update Warning: SourceHut shadows some upstream packages with patched versions. The SourceHut mirror must be the first repository in /etc/apk/repositories. Warning: You cannot upgrade to new Alpine releases until we provide a repository for that Alpine version. Announcements of the build status of new Alpine releases are provided on the sr.ht-admins mailing list. Warning: The Alpine Linux community package repository must be enabled."
