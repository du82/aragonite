["https://man.sr.ht/installation.md"]
title = "Installation - man.sr.ht"
full_description = ".highlight { background: inherit; }This document covers the installation steps common to all sr.ht services. If you would like to hack on or contribute to sr.ht, see the Hacking page. Warning: Currently, the only officially supported method for installing sr.ht software is through packages on x86_64 Alpine Linux hosts. sr.ht is a distributed system in which each service (e.g., git.sr.ht, builds.sr.ht) runs independently with its own database and resources, communicates with other services through their respective APIs and webhooks, and is highly tolerant to the temporary or permanent absence of its peers. This type of design allows you to choose and deploy any subset of services depending on your needs, making it ideal for both large-scale deployments and small-scale installations. However, being distributed also means that the installation and deployment process can become a bit more involving. In particular, many sr.ht services have their own, unique requirements that necessitate extra installation steps. As such, be sure to consult each service's installation page for more details: builds.sr.ht git.sr.ht hg.sr.ht hub.sr.ht lists.sr.ht man.sr.ht meta.sr.ht pages.sr.ht paste.sr.ht todo.sr.ht #sr.ht-admins If you are a sr.ht system administrator, we encourage you to subscribe to the sr.ht-admins mailing list, a low-volume list of sysadmin-oriented announcements regarding breaking changes, security vulnerabilities, and so on. #Prerequisites Most sr.ht services require the following: A PostgreSQL server — persistent storage A Redict server — ephemeral storage, caching, work distribution A mail server — incoming/outgoing mail A cron daemon — scheduled tasks #Installing From Packages Add the appropriate SourceHut package repository to your package manager. Install your sr.ht services! Note: For any distribution-related issues, please contact the appropriate maintainers listed on the Packages page. Note: Packages ship with the correct users and groups set up, as well as the correct daemon configurations for your distribution's init system. #Next Steps After installing your sr.ht services, you'll need to configure them. For more information, see the Configuration page."
year_published = 2025
