["https://man7.org/training/spintro/index.html"]
title = "Linux/UNIX System Programming Fundamentals Training Course"
full_description = "This two-day course provides a sound understanding of the operating system architecture and low-level interfaces (principally, system calls and library functions) that are required to build system-level applications on Linux and UNIX systems. The course consists of a mixture of detailed presentations coupled with a large number of carefully designed practical exercises that allow participants to apply the knowledge learned in the presentations. By the completion of the course, participants will have mastered the basic building blocks required to build system-level applications. The course also provides the prerequisite knowledge that is required for either of the follow-on courses, Linux/UNIX Threads and IPC Programming (M7D-TIPC01) and Linux/UNIX IPC Programming (M7D-IPC02). Previous system programming experience (on Linux, UNIX, or any other operating system) is not required. This course covers the same topics as the first part (the first two days) of the Linux/UNIX System Programming (M7D-LUSP01) course. A significant part of the course is spent on practical exercises. The lab sessions also provide participants with the opportunity to obtain one-to-one assistance from the trainer on the course material and exercises. Course participants receive course books of around 250 pages. The course books include all of the slides and exercises presented in the course. Some notable features of the course book are the following: In addition to the course book, participants receive a copy of The Linux Programming Interface, in either ebook or printed form (or, when possible, both). For onsite and virtual onsite courses, please email training@man7.org regarding availability and pricing. Online courses in Europe timezones are normally timed around Berlin time, starting at 08:00, 08:30, or 09:00. Online courses in Americas timezones are normally timed around New York time, starting at 09:00 or 10:00. Depending on the length of breaks, classes typically run for 8 to 8.5 hours per day."
