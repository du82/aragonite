["https://man7.org/training/shlib/index.html"]
title = "Building and Using Shared Libraries on Linux Training Course"
full_description = "This course covers the design, implementation, and use of shared libraries on Linux. A mixture of detailed presentations coupled with carefully designed practical exercises provide participants with the knowledge needed to understand, design, create, and deploy shared libraries. The primary audience comprises designers and programmers building and deploying shared libraries on Linux. Systems administrators are likely to also find the course of benefit for the purpose of troubleshooting problems with shared libraries. A significant part of the course is spent on practical exercises. The lab sessions also provide participants with the opportunity to obtain one-to-one assistance from the trainer on the course material and exercises. Course participants receive course books of around 150 pages. The course books include all of the slides and exercises presented in the course. The course book has been developed by the trainer, and is constantly updated based on ongoing changes in the Linux kernel, gcc, and the GNU C library, as well as practical teaching experience in courses. In addition to the course book, participants receive a copy of The Linux Programming Interface, in ebook form. For onsite and virtual onsite courses, please email training@man7.org regarding availability and pricing. [*] Although this is nominally a 2.5-day course, this iteration of the course will be run over 5 half days (around 3.5 to 4 hours each day). The course price nevertheless remains the same as for the 2.5-day version of the course. The course will be scheduled to accommodate participants in both Americas and European timezones (i.e., the course will run in the morning for Americas timezones and in the later afternoon for European timezones). For public online courses, the per-attendee price is €1600 reduced to €1500 when booked (and either paid or a company purchase order is supplied) at least 4 weeks before the start of the course. (In addition, 19% German VAT is charged for participants attending from German locations; 19% German VAT is also applicable for private attendees in any location in the European Union without a VAT ID.)"
year_published = 2025
