["https://man7.org/training/lusp/index.html"]
title = "Linux/UNIX System Programming Training Course"
full_description = 'This course provides a deep understanding of the operating system architecture and low-level interfaces (principally, system calls and library functions) that are required to build system-level, multithreaded, and network applications on Linux and UNIX systems. The course consists of a mixture of detailed presentations coupled with a large number of carefully designed practical exercises that allow participants to apply the knowledge learned in the presentations. By the completion of the course, participants will have the mastery needed to write complex system, network, and multithreaded applications on a Linux or UNIX system. Previous system programming experience (on Linux, UNIX, or any other operating system) is not required. A significant part of the course is spent on practical exercises. The lab sessions also provide participants with the opportunity to obtain one-to-one assistance from the trainer on the course material and exercises. Course participants receive course books of around 500 pages. The course books include all of the slides and exercises presented in the course. Some notable features of the course books are the following: In addition to the course book, participants receive a copy of The Linux Programming Interface, in either ebook or printed form (or, when possible, both). For onsite and virtual onsite courses, please email training@man7.org regarding availability and pricing. If you elect to have an onsite training course on your premises, it is possible to determine the length and content of the course. The length and content of tailored courses is determined by your choice of topics, typically based on a subset of the topics in The Linux Programming Interface. Relevant topics that are not in the "Standard" list are also possible; see Alternative Topics in the course outline, and contact me if you have specific requests. Online courses in Europe timezones are normally timed around Berlin time, starting at 08:00, 08:30, or 09:00. Online courses in Americas timezones are normally timed around New York time, starting at 09:00 or 10:00. Depending on the length of breaks, classes typically run for 8 to 8.5 hours per day.'
