["https://man7.org/training/tipc/index.html"]
title = "Linux/UNIX Threads and IPC Training Course"
full_description = "This course provides a deep understanding of the operating system architecture and low-level interfaces (principally, system calls and library functions) that are required to build system-level, multithreaded, and network applications on Linux and UNIX systems. The course consists of a mixture of detailed presentations coupled with a large number of carefully designed practical exercises that allow participants to apply the knowledge learned in the presentations. By the completion of the course, participants will have the mastery needed to write complex system, network, and multithreaded applications on a Linux or UNIX system. Note: some previous system programming background is presumed. Where necessary, that background can be gained by following the Linux/UNIX System Programming Fundamentals (SPINTRO01) course. This course covers the same topics as the last part (the final three days) of the Linux/UNIX System Programming (M7D-LUSP01) course. Note that this course is similar to the 3-day Linux/UNIX IPC Programming (M7D-IPC02) course, but omits some of the IPC topics in that course while adding coverage of POSIX threads. It is presumed that attendees will have a working knowledge of the topics covered in the course Linux/UNIX System Programming Fundamentals (M7D-SPINTRO01). In particular, participants should have a good understanding of concepts such as: file I/O using system calls, process lifecycle (fork(), exec(), wait()), and signals. A significant part of the course is spent on practical exercises. The lab sessions also provide participants with the opportunity to obtain one-to-one assistance from the trainer on the course material and exercises. Course participants receive course books of around 250 pages. The course books include all of the slides and exercises presented in the course. Some notable features of the course books are the following: In addition to the course book, participants receive a copy of The Linux Programming Interface, in either ebook or printed form (or, when possible, both)."
year_published = 2025
