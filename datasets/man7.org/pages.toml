["https://man7.org/training/splc/index.html"]
title = "System Programming for Linux Containers Training Course"
full_description = "This course provides a deep understanding of the Linux technologies (namely, set-UID/set-GID programs, capabilities, namespaces, cgroups, and seccomp) used to implement container, virtualization, and sandboxing systems. (These are the technologies used to build systems such as Docker, LXC, Firejail, and Flatpak.) The course also provides an understanding of the core APIs used to build system-level applications that run on such systems. Detailed explanations and carefully designed practical exercises provide participants with the knowledge needed both to troubleshoot container and sandboxing systems and to write complex applications that run on those systems. (The course does not cover administering container systems such as Docker and LXC, but by completion of the course participants will have a good understanding of various aspects of the underlying implementation and operation of such systems.) Note that this course is similar to the 4-day Linux Security and Isolation APIs (M7D-SECISOL02) course, but adds an initial day that covers a range of fundamental system programming topics. The audience for this course includes designers and developers who are building, troubleshooting, and administering system-level applications for Linux-based container systems. A significant part of the course is spent on practical exercises. The lab sessions also provide participants with the opportunity to obtain one-to-one assistance from the trainer on the course material and exercises. Course participants receive course books of around 600 pages. The course books include all of the slides and exercises presented in the course. Some notable features of the course books are the following: In addition to the course book, participants receive a copy of The Linux Programming Interface, in either ebook or printed form (or, when possible, both). For onsite and virtual onsite courses, please email training@man7.org regarding availability and pricing. Online courses in Europe timezones are normally timed around Berlin time, starting at 08:00, 08:30, or 09:00. Online courses in Americas timezones are normally timed around New York time, starting at 09:00 or 10:00. Depending on the length of breaks, classes typically run for 8 to 8.5 hours per day."
