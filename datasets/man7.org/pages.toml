["https://man7.org/training/spess/index.html"]
title = "Linux/UNIX System Programming Essentials Training Course"
full_description = "This one-day course provides an introduction to a range of fundamental system programming concepts: file I/O using system calls, signals, processes, and process lifecycle. The course consists of a mixture of presentations coupled with practical exercises that allow participants to apply the knowledge learned in the presentations. The course provides the prerequisite knowledge that is required for either of the follow-on courses, Linux/UNIX Threads and IPC Programming (M7D-TIPC01) and Linux/UNIX IPC Programming (M7D-IPC02). This course covers the same topics as the first day of the System Programming for Linux Containers (M7D-SPLC02) course. A significant part of the course is spent on practical exercises. The lab sessions also provide participants with the opportunity to obtain one-to-one assistance from the trainer on the course material and exercises. Course participants receive a course book of around 100 pages. The course book includes all of the slides and exercises presented in the course. Some notable features of the course book are the following: In addition to the course book, participants receive a copy of The Linux Programming Interface, in ebook form. For onsite and virtual onsite courses, please email training@man7.org regarding availability and pricing. Online courses in Europe timezones are normally timed around Berlin time, starting at 08:00, 08:30, or 09:00. Online courses in Americas timezones are normally timed around New York time, starting at 09:00 or 10:00. Depending on the length of breaks, classes typically run for 8 to 8.5 hours per day. [*] Although this is nominally a 1-day course, this iteration of the course will be run over 2 half days (around 4 to 4.5 hours each day). The course price nevertheless remains the same as for the 1-day version of the course. The course will be scheduled to accommodate participants in both Americas and European timezones (i.e., the course will run in the morning for Americas timezones and in the later afternoon for European timezones)."
year_published = 2025
