["https://man7.org/tlpi/tlpi_in_detail.html"]
title = 'About "The Linux Programming Interface"'
full_description = "TLPI provides more than just the technical details of the system programming interface: it gives important context describing why and how to use the interfaces, accompanied by a rich set of (complete) example programs. In the book, I assume that reader has some prior programming experience, a reading knowledge of C, and understands how to use common Linux or UNIX commands. Previous experience of system programming is not required. The programming examples in TLPI are in C, but the concepts are equally applicable in a wide range of other languages, both compiled languages such as C++, Rust, D, Pascal, and FORTRAN, and scripting languages such as Perl, Python, and Ruby."
