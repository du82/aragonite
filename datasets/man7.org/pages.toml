["https://man7.org/training/cgroups/index.html"]
title = "Linux Control Groups (Cgroups) Training Course"
full_description = "This course provides a thorough introduction to Linux control groups (cgroups), one of the components used in a range of modern applications, including container frameworks, sandboxing technologies, and systemd. Detailed presentations coupled with carefully designed practical exercises provide participants with an understanding of cgroups and the knowledge to build and troubleshoot applications that use cgroups. If you are interested in this course, you might also be interested in the following longer courses which cover a number of related topics, including capabilities, namespaces, and seccomp: The primary audience comprises designers, programmers, and systems administrators who are building, administering, or troubleshooting applications that employ cgroups. In order to get the most out of the course, participants should have a knowledge of basic UNIX/Linux shell commands. A significant part of the course is spent on practical exercises. The lab sessions also provide participants with the opportunity to obtain one-to-one assistance from the trainer on the course material and exercises. Course participants receive course books of around 100 pages. The course books include all of the slides and exercises presented in the course. The course book has been developed by the trainer, and is constantly updated based on ongoing changes in the Linux kernel, as well as practical teaching experience in courses. In addition to the course book, participants receive a copy of The Linux Programming Interface, in ebook form. For onsite and virtual onsite courses, please email training@man7.org regarding availability and pricing. Online courses in Europe timezones are normally timed around Berlin time, starting at 08:00, 08:30, or 09:00. Online courses in Americas timezones are normally timed around New York time, starting at 09:00 or 10:00. Depending on the length of breaks, classes typically run for 8 to 8.5 hours per day. [*] Although this is nominally a 1-day course, this iteration of the course will be run over 2 half days (around 4 to 4.5 hours each day). The course price nevertheless remains the same as for the 1-day version of the course. The course will be scheduled to accommodate participants in both Americas and European timezones (i.e., the course will run in the morning for Americas timezones and in the later afternoon for European timezones)."
