["https://man7.org/training/seccomp/index.html"]
title = "Linux Secure Computing (seccomp) Training Course"
full_description = "This course provides a thorough introduction to the Linux secure computing (seccomp) facility, a mechanism that can used to sandbox applications by limiting the set of system calls that they may perform. Seccomp one of the components used in a range of modern applications, including container frameworks, sandboxing technologies, and systemd. Detailed presentations coupled with carefully designed practical exercises provide participants with an understanding of seccomp and the knowledge to build and troubleshoot applications that use seccomp. If you are interested in this course, you might also be interested in the following longer courses which cover a number of related topics, including capabilities, namespaces, and control groups (cgroups): The primary audience comprises designers, programmers, and systems administrators who are building, administering, or troubleshooting applications that employ seccomp. In order to get the most out of the course, participants should have a knowledge of basic UNIX/Linux shell commands. A significant part of the course is spent on practical exercises. The lab sessions also provide participants with the opportunity to obtain one-to-one assistance from the trainer on the course material and exercises. Course participants receive course books that include all of the slides and exercises presented in the course. The course book has been developed by the trainer, and is constantly updated based on ongoing changes in the Linux kernel, as well as practical teaching experience in courses. The course book is produced on demand for each course, in order to ensure that it is completely up to date with current Linux developments. In addition to the course book, participants receive a copy of The Linux Programming Interface, in ebook form. For onsite and virtual onsite courses, please email training@man7.org regarding availability and pricing. Currently, this course is scheduled only on demand or for on-site delivery. Inquire at training@man7.org if you are interested in scheduling a course."
