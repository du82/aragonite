["https://man7.org/tlpi/faq/index.html"]
title = '"The Linux Programming Interface" FAQ'
full_description = '''The following is a list of frequently asked questions and answers related to the The Linux Programming Interface. Writing TLPI took several years, although the project was somewhat interrupted by various life events. The book was largely complete by 2006 (modulo subsequent updates that were required to cover features that appeared in subsequent kernel releases), but it was only in 2009 that I was able to make the time complete the task of production with No Starch Press. That task—spanning phases such as copyediting, typesetting, and proofing 1550 pages—turned out to be enormous in itself. I had various motivations for writing TLPI, among them the facts that I enjoy properly understanding things, and love teaching (I had been a teacher in various previous jobs, and have returned to training again nowadays). I've also always enjoyed writing; I've always felt that the software projects I've worked on over the years weren't complete if I hadn't documented my work on them. In addition, some years after my first degree in Computer Science, I did an Arts degree (Psychology and Art History) that considerably honed my writing skills. TLPI was published in 2010. Since then, the kernel and GNU C library have changed, but only slowly. (I track the changes on my API changes page.) In the meantime, all of the information in TLPI remains current, since the kernel and glibc maintainers place a strong emphasis on maintaining backward compatibility. The rate of additions to the APIs is slow enough that it will be quite a while yet before a new edition of TLPI is warranted. This FAQ typically comes from someone wondering "should I wait for the next edition before I buy a copy of TLPI?". My answer is "no", because TLPI is still fairly current and it will be quite some time before a second edition appears. I assume you have some prior programming experience, but no previous system programming experience is required. Sorry, I can't. I've got a lot of calls on my free time. Try sending your question to a suitable mailing list or forum (e.g., StackOverflow, which these days does seem to be the true to successor to Usenet groups); using a public forum is likely to get a wide variety of useful answers, and has the advantage that others can benefit from reading the answers. Alternatively, explaining your code to a colleague, classmate, friend, or rubber duck is usually a highly effective way of improving or debugging a program.'''
year_published = 2025
clearnet = "https://man7.org/tlpi/faq/index.html"
