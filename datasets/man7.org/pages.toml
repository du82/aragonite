["https://man7.org/training/secisol/index.html"]
title = "Linux Security and Isolation APIs Training Course"
full_description = "This course provides a deep understanding of the low-level Linux features (set-UID/set-GID programs, capabilities, namespaces, cgroups, and seccomp) used to implement privileged applications and build container, virtualization, and sandboxing technologies. A mixture of detailed presentations coupled with carefully designed practical exercises provide participants with the knowledge needed to understand, design, develop, and administer such applications. (The course does not cover administering container systems such as Docker and LXC, but by completion of the course participants will have a good understanding of various aspects of the underlying implementation and operation of such systems.) The System Programming for Linux Containers course contains the same content as the Linux Security and Isolation APIs course, but adds a preparatory day of fundamental system programming concepts. The primary audience comprises designers and programmers building privileged applications, container applications, and sandboxing applications. Systems administrators who are managing such applications are also likely to find the course of benefit. Note: participants are assumed to have knowledge of some fundamental Linux/UNIX system programming concepts including: file descriptors and file I/O system calls; basics of programming with signals; and the system calls that define the lifecycle of a process (fork(), execve(), wait(), exit()). Such knowledge is provided in any of the following courses: Alternatively, the System Programming for Linux Containers course contains the same content as the Linux Security and Isolation APIs course, but adds a preparatory day of fundamental system programming concepts. A significant part of the course is spent on practical exercises. The lab sessions also provide participants with the opportunity to obtain one-to-one assistance from the trainer on the course material and exercises. Course participants receive course books of around 500 pages. The course books include all of the slides and exercises presented in the course."
