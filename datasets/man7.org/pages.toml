["https://man7.org/training/sisess/index.html"]
title = "Linux Security and Isolation APIs Essentials Training Course"
full_description = "This course provides an overview of the low-level Linux features (capabilities, namespaces, and cgroups) used to build container, virtualization, and sandboxing technologies. This course is a heavily abridged version of the 4-day Linux Security and Isolation APIs (M7D-SECISOL02) course, which provides much more detailed coverage of the same topics. The primary audience comprises designers and programmers building privileged applications, container applications, and sandboxing applications. Systems administrators who are managing such applications are also likely to find the course of benefit. A significant part of the course is spent on practical exercises. The lab sessions also provide participants with the opportunity to obtain one-to-one assistance from the trainer on the course material and exercises. Course participants receive course books of around 125 pages. The course books include all of the slides and exercises presented in the course. The course book has been developed by the trainer, and is constantly updated based on ongoing changes in the Linux kernel, as well as practical teaching experience in courses. For onsite and virtual onsite courses, please email training@man7.org regarding availability and pricing. Online courses in Europe timezones are normally timed around Berlin time, starting at 08:00, 08:30, or 09:00. Online courses in Americas timezones are normally timed around New York time, starting at 09:00 or 10:00. Depending on the length of breaks, classes typically run for 8 to 8.5 hours per day. For public online courses, the per-attendee price is €850 reduced to €800 when booked (and either paid or a company purchase order is supplied) at least 4 weeks before the start of the course. (In addition, 19% German VAT is charged for participants attending from German locations; 19% German VAT is also applicable for private attendees in any location in the European Union without a VAT ID.) Currently (and for the foreseeable future), public versions of this course are delivered only in online format."
year_published = 2025
