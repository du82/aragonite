["http://man7.org/training"]
title = "man7.org (Michael Kerrisk) Linux/UNIX Programming Training"
full_description = "Michael Kerrisk provides training and consulting on Linux and UNIX system programming. He develops and delivers all man7.org courses. His courses emphasize deep conceptual understanding and employ insightful practical exercises that reinforce that understanding. The courses are rich with pictures, examples, and historical context that explain the workings of Linux/UNIX APIs. The following diagram provides an overview of the relationship between the various courses that are listed below. This overview is also available as a PDF. The following is a list of courses provided by man7.org, along with dates for public instances of the courses. For prices, details of how to book, and further information about each course, click the hyperlinked course names in the list. Pricing for public courses is provided under the descriptions of each course. For information on booking and pricing of onsite and virtual onsite courses, please contact man7.org. Course days are typically around 8.5 hours (including breaks). For onsite and (especially) for virtual onsite courses, there are flexible options for delivery. For example, courses may be spread over more days, to allow for shorter training days, or longer courses can be split into pieces that are delivered in different weeks. Contact man7.org for more information. After focusing on programming and writing for some years, I am now once more conducting frequent training courses on Linux/UNIX system programming and a number of related programming topics that are of particular relevance for developers of low-level user-space applications in domains ranging from embedded to enterprise server systems. I work closely with my customers, providing personalized assessment of their training needs, and where necessary customizing my courses to those needs. My customers range from small and medium-sized businesses to multinational companies and governments. Past and present customers include BMW, Google, Cisco Systems, VMware, IBM, Hewlett-Packard, Container Solutions, and the French, British, and American governments. (References from past and current customers are available upon request or you can read some public reviews of my training courses.)"
