["https://man7.org/tlpi/translations/index.html"]
title = 'Translations of "The Linux Programming Interface"'
full_description = "The Simplified Chinese translation of TLPI was published in two volumes by Posts and Telecommunications Press in January 2014. The Traditional Chinese translation of TLPI was published in two volumes (1, 2) by GOTOP in October 2016. There is a Facebook page devoted to the translation. The Japanese translation of TLPI was published by O'Reilly Japan in December 2012. The translation was done by kernel developer Junjiro Okajima, developer of the aufs file system. Japanese readers can read (the Japanese translation of) a short preface that I wrote for the translation. The Korean translation of TLPI was published by Acorn Publishing in July 2012, as two volumes. Korean readers can read (the Korean translation of) a short preface that I wrote for the translation and a blog post from the publisher. For the translation, the chapters were reordered somewhat: the five POSIX threads chapters were moved to a later point in the translated work, forming the start of Volume 2. The two volumes are thus: The numbering of the chapters in Volume 2 restarts from 1. Readers of the Korean edition should thus note that (after Chapter 28 of Volume 1) the chapter numbers in the Korean translation do not correspond with the English original, and do not match up with the chapter numbers shown in the online code pages. The Russian translation of TLPI was published in January 2018 by Piter Press. Russian readers can read (the Russian translation of) a short preface that I wrote for the translation."
