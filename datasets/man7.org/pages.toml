["https://man7.org/training/pthr/index.html"]
title = "POSIX Threads Programming Training Course"
full_description = "This one-day course covers the key features of programming with POSIX threads, including the following topics: The primary audience for this course is programmers developing multithreaded applications for Linux and UNIX systems, or programmers porting such applications from other operating systems (e.g., Windows) to Linux or UNIX. Participants should be able to write and compile C programs and be familiar with commonly used functions in the standard C library (e.g., functions in the stdio and malloc packages). A significant part of the course is spent on practical exercises. The lab sessions also provide participants with the opportunity to obtain one-to-one assistance from the trainer on the course material and exercises. Course participants receive course books of around 150 pages. The course books include all of the slides and exercises presented in the course. Some notable features of the course books are the following: In addition to the course book, participants receive a copy of The Linux Programming Interface, in ebook form. For onsite and virtual onsite courses, please email training@man7.org regarding availability and pricing. Currently, this course is scheduled only on demand or for on-site delivery. Inquire at training@man7.org if you are interested in scheduling a course. Online courses in Europe timezones are normally timed around Berlin time, starting at 08:00, 08:30, or 09:00. Online courses in Americas timezones are normally timed around New York time, starting at 09:00 or 10:00. Depending on the length of breaks, classes typically run for 8 to 8.5 hours per day. For public online courses, the per-attendee price is €750 reduced to €700 when booked (and either paid or a company purchase order is supplied) at least 4 weeks before the start of the course. (In addition, 19% German VAT is charged for participants attending from German locations; 19% German VAT is also applicable for private attendees in any location in the European Union without a VAT ID.)"
