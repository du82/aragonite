["https://man7.org/training/nwp/index.html"]
title = "Linux/UNIX Network Programming Training Course"
full_description = "The Linux/UNIX network programming course covers network programming using the sockets API on Linux and UNIX systems. The content of the course is based on the network programming chapters of The Linux Programming Interface, but adds a significant amount of supplementary material. The primary audience for this course is programmers developing network applications for Linux and UNIX systems, or programmers porting such applications from other operating systems (e.g., Windows) to Linux or UNIX. By the completion of the course, participants will have the understanding needed to write advanced network applications on a Linux or UNIX system. A significant part of the course is spent on practical exercises. The lab sessions also provide participants with the opportunity to obtain one-to-one assistance from the trainer on the course material and exercises. Course participants receive course books of around 350 pages. The course books include all of the slides and exercises presented in the course. Some notable features of the course books are the following: In addition to the course book, participants receive a copy of The Linux Programming Interface, in ebook form. For onsite and virtual onsite courses, please email training@man7.org regarding availability and pricing. Online courses in Europe timezones are normally timed around Berlin time, starting at 08:00, 08:30, or 09:00. Online courses in Americas timezones are normally timed around New York time, starting at 09:00 or 10:00. Depending on the length of breaks, classes typically run for 8 to 8.5 hours per day. [*] Although this is nominally a 3-day course, this iteration of the course will be run over 5 (longish) half days (around 4 to 4.5 hours each day). The course price nevertheless remains the same as for the 3-day version of the course. The course will be scheduled to accommodate participants in both Americas and European timezones (i.e., the course will run in the morning for Americas timezones and in the later afternoon for European timezones)."
