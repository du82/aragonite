["https://man7.org/tlpi/code/faq.html"]
title = 'Source Code FAQ for "The Linux Programming Interface"'
full_description = '''Below is a list of frequently asked questions for the program source code in the book The Linux Programming Interface. Improvements and additions to this list are welcome. Please take a look at the README file and the BUILDING file for general information about the source code and how to compile it. The "book" versions of some of the example programs yield the following compilation warning when built with the supplied makefiles: Some of the interfaces used in the sample programs require that _XOPEN_SOURCE be defined. If programs using these interfaces are compiled with -std=c99 -D_XOPEN_SOURCE=600, then all is well. However, if such programs are compiled without the _XOPEN_SOURCE definition, but with warnings enabled as described above, then errors or warnings will result (e.g., messages such as implicit declaration of function 'xxxxxx'). The solution I decided on for these programs was to include a preprocessor #define statement that defines _XOPEN_SOURCE suitably. The limitation of this solution is that when these programs are compiled using -D_XOPEN_SOURCE=600, and the source file redefines _XOPEN_SOURCE with a different value, the compiler warns about the redefinition. For reasons of code compactness, this approach was not employed in the "book" versions of the programs, but it is employed in the "distribution" versions. If you encounter the error sys/acl.h: No such file or directory, it is because the required ACL package is not installed on your system. If you encounter the error sys/capability.h: No such file or directory, it is because a required package is not installed on your system. If you encounter the error selinux/selinux.h: No such file or directory, it is because a required package is not installed on your system. For an explanation of the "_XOPEN_SOURCE" redefined warning that occurs when compiling the "book" version of this program, look here. When compiling this program, you may encounter the warning 'readdir_r' is deprecated [-Wdeprecated-declarations] when building with glibc version 2.24 or later. (How do I find out what version of glibc is on my system?) This is because readdir_r() has been deprecated since glibc 2.24. See the erratum for page 357 for further details.'''
year_published = 2025
clearnet = "https://man7.org/tlpi/code/faq.html"
