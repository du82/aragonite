["https://man7.org/tlpi/api_changes/index.html"]
title = "Linux and glibc API changes"
full_description = "As The Linux Programming Interface went to press in August 2010, it was up to date with the then current versions of the Linux kernel (2.6.35), glibc (2.12), and the POSIX.1/Single UNIX Standard (POSIX.1-2008/SUSv4). Because the developers of both the Linux kernel and glibc are committed to maintaining ABI compatibility, virtually all of the details provided in TLPI should remain accurate in the future. However, (a few) new features are added to the kernel and glibc with each release. As each new release of the Linux kernel and glibc occurs, this page will attempt to note new interface features that are relevant to the subject area of the book. In addition, this page provides links to information about subsequent updates to the POSIX/SUS standard. See also: LWN articles on the kernel 6.14 merge window (1, 2) and the Kernel Newbies kernel 6.14 summary. See also: LWN articles on the kernel 6.13 merge window (1, <2/a>) and the Kernel Newbies kernel 6.13 summary. See also: LWN articles on the kernel 6.12 merge window (1, 2) and the Kernel Newbies kernel 6.12 summary. See also: LWN articles on the kernel 6.11 merge window (1, 2) and the Kernel Newbies kernel 6.11 summary. See also: LWN articles on the kernel 6.10 merge window (1, 2) and the Kernel Newbies kernel 6.10 summary. See also: LWN articles on the kernel 6.9 merge window (1, 2) and the Kernel Newbies kernel 6.9 summary. See also: LWN articles on the kernel 6.8 merge window (1, 2) and the Kernel Newbies kernel 6.8 summary. See also: LWN articles on the kernel 6.7 merge window (1, 2) and the Kernel Newbies kernel 6.7 summary. See also: LWN articles on the kernel 6.6 merge window (1, 2) and the Kernel Newbies kernel 6.6 summary. See also: LWN articles on the kernel 6.5 merge window (1, 2) and the Kernel Newbies kernel 6.5 summary. See also: LWN articles on the kernel 6.4 merge window (1, 2) and the Kernel Newbies kernel 6.4 summary. See also: LWN articles on the kernel 6.3 merge window (1, 2) and the Kernel Newbies kernel 6.3 summary."
