["https://man7.org/training/capns/index.html"]
title = "Linux Capabilities and Namespaces Training Course"
full_description = "This course provides an in-depth exploration of Linux namespaces, which are used in a wide array of virtualization and sandboxing technologies such as Docker, LXC, Flatpak, Firejail, Systemd, and various web browsers. In addition, the course covers the Linux capabilities model, since an understanding of that model is essential to understanding the operation of user namespaces, which are a cornerstone of many of the aforementioned applications. Detailed presentations coupled with carefully designed practical exercises provide participants with the knowledge needed to understand, design, develop, and administer such applications. If you are interested in this course, you might also be interested in the following longer courses which cover a number of related topics, including control groups (cgroups) and seccomp: The primary audience comprises designers and programmers building privileged applications, container applications, and sandboxing applications. Systems administrators who are managing such applications are also likely to find the course of benefit. Note: knowledge of some fundamental Linux/UNIX system programming concepts (fork(), execve(), waitpid(), basics of programming with signals, the /proc filesystem) is assumed. Some background reading material on these topics will be sent to attendees before the course. A significant part of the course is spent on practical exercises. The lab sessions also provide participants with the opportunity to obtain one-to-one assistance from the trainer on the course material and exercises. Course participants receive course books of around 250 pages. The course books include all of the slides and exercises presented in the course. The course book has been developed by the trainer, and is constantly updated based on ongoing changes in the Linux kernel, as well as practical teaching experience in courses. In addition to the course book, participants receive a copy of The Linux Programming Interface, in ebook form. For onsite and virtual onsite courses, please email training@man7.org regarding availability and pricing."
