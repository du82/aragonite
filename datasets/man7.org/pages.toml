["http://man7.org/tlpi/reviews/index.html"]
title = '"The Linux Programming Interface" Reviews'
full_description = '''As reviews for The Linux Programming Interface appear, I'll add links below. If you see a review that isn't listed here, please email me with a pointer to the review. Where I've managed to find the individuals who wrote reviews in forums such as Amazon, I've hyperlinked to their homepages. And a request: if you appreciate my book, please consider reviewing it in an online magazine, online bookseller's web site (Amazon or elsewhere), blog, or web site. Reviews really do make a difference in getting the word out and improving sales. "Kerrisk's book is more thorough, more comprehensive and just as well written as the Stevens and Rochkind books… It is now easily THE standard book on Linux/UNIX system programming." "Absolutely, without question, the best longform technical writer. Reading his books, where he gets to exercise all of the skills in terms of sequencing, layering, explanation, repetition, etc is like receiving an architectural download from the universe." "This is one of the best technical books i have ever read (in any topic). It is comprehensive, authoritative, well organized and a pleasure to read. The author uses MANY example programs that are great at illustrating the concept being discussed." "… Crystal clear writing, great explanations and motivations, and tons of technical detail. It's one of the best technical books I've ever read, on par with K&R and Stevens… Thanks to the author for this wonderful contribution to the systems community." "I was hoping this book would serve as a handy reference [...] but it has far surpassed that expectation. This is THE most detailed programming book that I own." "This is without a doubt the best written technical book I've ever read; it's honestly hard to believe only one person wrote and organized it. In an era where you can often get a better answer from a highly voted Stack Overflow question than you'll find most books, TLPI is 100% an exception." "Beautifully written book, a model of clarity and succinctness, equivalent to K&R's C Programming Language book, but surprisingly readable from front to back too."'''
