title = "Episode 3: Global, remote management and the impact of coaching with Cate Huston - The Managing Managers Podcast"
description = '''Biography Cate Huston is an engineering director at DuckDuckGo and an advisor at Glowforge. She previously worked at Automattic where she led the mobile Jetpack and Developer Experience teams and Cate administers the new-ish manager slack and writes regularly. She is currently writing the O'Reilly book, "The Engineering Leader", coming out in early 2024. Links'''
full_description = "Episode 3: Global, remote management and the impact of coaching with Cate Huston BiographyCate Huston is an engineering director at DuckDuckGo and an advisor at Glowforge. She previously worked at Automattic where she led the mobile Jetpack and Developer Experience teams and Cate administers the new-ish manager slack and writes regularly. She is currently writing the O’Reilly book, “The Engineering Leader”, coming out in early 2024.Links and MentionsNew-(ish) Manager SlackCate’s Quartz ArticlesCate’s LeadDev ContributionsCate’s blogCate’s socials: Twitter, Instagram, LinkedIn, GitHub, MastodonTranscriptPatrick Kua: Welcome to the Managing Managers podcast. I’m your host, Patrick Kua, founder of the Tech Lead Academy and curator of the newsletter for leaders in tech, Level Up. In this podcast, I’m chatting with senior engineering managers, directors, VPs of engineering and others who have walked the path of managing other managers, where we will uncover some great stories and lessons learnt.Let’s get started.Patrick Kua: Hi. I’m really excited to be joined by Cate today. Cate is an engineering director at DuckDuckGo and an advisor at Glowforge. She previously worked at Automattic where she led the mobile Jetpack and Developer Experience teams and Cate administers the new-ish manager slack and writes regularly. She is currently writing the O’Reilly book, “The Engineering Leader”, coming out in early 2024. Welcome Cate to the show.Cate Houston: Hey Pat. How are you doing?Patrick Kua: I’m very well, how are you doing?Pretty good, pretty good. But like oh wow we’re finally talking about me writing a book because I haven’t really, you heard it here first unless I publish my blog posts before your podcast.Patrick Kua: Ah, that’s great. I mean you’ve written quite a lot of things on Quartz, on your blog, and I’m pretty sure, a number of LeadDev articles. So I’m really excited that you’re going to be working on The Engineering Leader book. Do you want to tell us a little bit about your book project?Cate Houston: Um, yeah, so I’ve been working on this since the start of last year. Last year I really spent convincing myself that I could write a book and not really talking to anybody else about it. Because I don’t want to be that person who’s like, I want to write a book and then a book never comes out. So I’d written quite a bit of it and then I had convinced myself that I could write a book. So then I was just really procrastinating on writing a book proposal by writing a book which like, I don’t really recommend. Eventually I posted something on Mastodon and Melissa from O’Reilly reached out to me. And I was like, “Wow, I think I can write a book now but I’m not convinced that I can write a book proposal,” and she was really helpful. So yeah, then.Patrick Kua: Amazing. What’s the essence or picture of the book?Cate Houston: Oh my god, I was thinking so much about your podcast that I think I forgot. I think it’s really about the kind of growth that you go through as a leader. And that you take teams through and how you can’t really disconnect those two things, right? You have to figure out what you want from your career before you can really help other people with their careers. You need to really figure out your own self-management and that becomes increasingly important as you have more responsibility in order to manage other people effectively.Patrick Kua: Amazing. Yeah, I love it. I can’t wait to read it as well. I’ll add it to my reading list for sure.Cate Houston: You’re welcome to have a preview copy and send me a list of all my typos.Patrick Kua: Ah, thank you. So I mean we’re going to get into your energy management and talk about this in the role of managing other managers. But why don’t you give us a brief summary of your leadership journey and maybe when you started to manage other managers.Cate Houston: Yeah, so I was like a pretty normal start to my career. I got a computer science degree from the University Of Edinburgh. I went to grad school. I dropped out of grad school to go work at Google. You know. So far so normal and then, I kind of, rage quit tech. Honestly I was just really tired of the misogyny. I took a break and I did a bunch of interesting things and I kind of like relearned what I liked about programming and tech in general. And then I somehow got my first management role in Columbia and ended up, as a not entirely legal migrant, in Colombia. So maybe that’s where it gets weird. And that was for a startup that was just, I was just obviously failing the whole time I was there, so it was all like real trial by fire. You know, like I had to lay off half my team. That was awful.Cate Houston: Single worst day of my professional career for sure. Just. Yeah. Just. I don’t know. I feel like I’m going to save that one for my memoir right? But somewhere towards the end of that, Matt Mullenweg reached out to me and he recruited me to go and run the mobile team at Automattic. And I was like, this, I don’t seem qualified for this. Um, and so I went from like a failing a team of 8 people at a failing startup to, ah, I wouldn’t call it a team, a group of, a collection of 24 people in like a bigger company.Patrick Kua: Wow.Cate Houston: I just really had to figure it all out. I think there, you know, the way that I ended up, because initially, you know, Matt told me this is what he was thinking. I was like, I don’t know why you think that would be a good idea. He was like, I really like your writing. I think clear writing is clear thinking. So I realised, even though I was on the face of it, not qualified for that job, I had this experience in open source, I had this experiencing kind of community management, and I had this remote experience that you know very few people I think had that blend because everyone was still quite co-located. Right? And so I saw a lot of maybe not that many, but plenty of people with a co-located mindset, come into a remote environment and not figure out how to be successful because there’s a lot of I think the kind of principles of community management that you can use in a remote context to really help you be effective.Patrick Kua: Amazing. Yeah, and um, I mean I can definitely understand it, particularly back then, maybe now is a little bit different, post COVID. But yeah, back then, remote and that experience was very very rare. Most leaders that I knew were definitely co-located with their team. So I can see that unique blend that you bring in.Cate Houston: Yeah, and global remote is different from even the remote we talk about today. Like where the way we’re talking about remote work. Often we’re talking about people who are in pretty similar time zones, who, you know maybe live. They don’t want to commute to the office but they can come in and so they see each other like reasonably regularly. When you’re talking about a global remote context, you’re talking about a team that operates 24 hours a day. That is not the same. You’re talking about people who can be 8 hours away from the people they work with regularly and that is really not the same. You have to think about things differently.Patrick Kua: Yep. Yep. So let’s talk about that experience then. So you inherited this group of 24 people. That sounds like a lot. And, you know, particularly when maybe it feels like from how you describe like everyone’s just doing their things they different work streams. How did you end up organising or structuring that in the end?Cate Houston: Yeah. I think when I took that job I knew it was gonna be hard. I expected to have… I will have eighteen months of hell if I take this job but at the end of it I might have, like I’ll have a really amazing job, right? Like because, you know, obviously WordPress was really personally meaningful to me. I really am bought into the distributed work idea. Um, and yeah. So I did like feel like I was signing up for like a really steep learning curve.And like, honestly, a really difficult situation. Um I think the way that I kind of went about getting things in order, is I think about teams along these like 4 layers of communication. So you have the mission layer. Um some people call it vision but that just is too tied to recreational drug use in my head. I’m not here for visions. Strategy, right? Which is how you intend to validate that you can achieve your current mission or your proximate objective on your mission. The tactics layer. Which I think is really about interoperability. So can people work together? Can teams work together? And then this fourth layer, which is execution. Which is just getting shit done. Um, and I think when you think about things on these four layers, it can make many problems very apparent right? So many small companies, they have a mission and they have some execution. They have nothing tying it together and this all breaks down once you get past a certain number of people. You know there’s this genre of person who I described as a process monster. You know they are obsessed with tactics. They have no strategy.Cate Houston: There may or may not be a mission. It doesn’t really matter. But nothing happens because everything is caught up in this oh but the perfect process. Everything will be fine. It will not.Patrick Kua: Yeah. No. I can definitely see that and I can definitely I appreciate those different lenses that you think about the teams and structures and I guess as you go through those different sort of lenses, I guess, as you talk to people and you were discovering what people were working on I guess you were studying to discover, maybe, how you might shape those teams. Is that right? Or?Cate Houston: Yeah I mean I think on each one of these layers, you have to think about how do I create clarity around this layer? How do I create capacity on this layer? In the team in general. And that means, saying no to some things. Doing less stupid things. In order to kind of make sure that everybody is moving in the same direction. And then you when I’m looking at a team that’s not functioning, I’m looking at what are the bottlenecks? Because often people go to the conversation that’s most comfortable to them.Patrick Kua: Yeah.Cate Houston: They will say, “The problem with our team is that we do not have a mission.” It’s like, I don’t know, probably not. You know, um. Because the mission I think is a very comfortable conversation because you don’t have to say no very much. So people love to have it. Your process monsters always want to talk about your process. And process can definitely be a limiting factor. But no great team is great because of their great processes. Processes are about enforcing adequacy.Patrick Kua: Yeah, yeah, they definitely help and maybe ritualize some of the routine things that teams agree on but they’re no replacement. I think it’s one of the agile manifesto things of people over process. Is that process is helpful but it’s not the end goal.Cate Houston: Yeah. Uh huh.Patrick Kua: And definitely not a substitute for the people that you’re working with. So I mean when you had these 24 people I’m just trying to imagine what the transformation was like. Does that mean that you were having one to ones with all these 24 people and then at some point you’re trying to work out how to organise these people.Cate Houston: Yeah I mean there were technically managers on the team. We called them team leads. You know, like one of them, this guy’s such a sweetheart. But I was asking him about his process for leading the team. His team had just refused to have one on ones with him. They’re like, “We don’t think that’ll be useful. We don’t need to have ones on ones.” So he’s trying to manage a team without whatever we would agree is probably the number one levers that managers have.Cate Houston: And I remember, I think, I joined in November and then in January we came back from a break. He was like, “Look. I’ve decided I’m going to make them have one on ones with me. That is my new year’s resolution.”Patrick Kua: How did that go?Cate Houston: I don’t think it’s gonna be as hard as you think. It seemed like it was something he was really psyching himself up to you. I think you can just tell them, “This is happening now”, and it’ll probably be fine.Patrick Kua: Got it.Cate Houston: I was doing I think almost bi monthly or quarterly 1-1s with everybody for a while and that was a lot. But it really helped me get a handle on things and start figuring out, who had potential, who was coaching who. One of the leads left. He was doing things like scheduling interviews with candidates and not showing up to them, so I didn’t feel that was a great loss.And I had a fun choice between let that continue, or shut down hiring. Then hiring has to be shut down. We can’t be doing that, you know. There was a lot of pretty fun and spicy things at first that I definitely you know, I was, “What the fuck did I do?” But the thing that really helped, was that my competing offer had required me to move to the US and Trump had just been elected. So obviously this was bad but I could be living under fascism so in the end I felt it was…Patrick Kua: It’s all relative.Cate Houston: Probably a win you know?Patrick Kua: Good timing. Good timing and good for Automattic at that time.Patrick Kua: In terms of the managers, that was your first time managing managers versus individual contributors. Did you find that there were any differences there or did you have to adapt how you manage those people versus ICs.Cate Houston: I think the thing that made it easier for me was that there were two failure modes that I completely sidestepped. The first is there was so many people that I couldn’t be functionally doing everybody’s job. And the second is that I hadn’t done anybody’s job.Cate Houston: I’d never been a developer on that codebase. I was never going to be a developer on that codebase. I clearly had too much other stuff to to be doing. So I wasn’t tempted to start writing code, undermine people. I didn’t have existing relationships with other people. I really sidestepped a lot of the things that I think when somebody goes from managing a team to splitting that team into um, kind of growing their responsibility. They can easily fall into those traps because they already have that context. They already know those people. It’s easy for them to inadvertently do things that don’t really serve making that manager successful.Patrick Kua: Yep, they’ve got those habits. And they can’t break those habits. Whereas you didn’t have any of those established patterns in that environment.Cate Houston: Yeah, and I just had no time to build them. So I think that helped a lot. I think one of the things that’s hard when you’re managing a manager who’s not doing a great job, for example, is that obviously has an impact on the team and that’s when you have to come back and figure out how to balance that again.Patrick Kua: Yeah, do you have any heuristics? Do you have a timeline i"
