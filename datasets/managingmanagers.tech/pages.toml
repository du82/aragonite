title = "Episode 25: Being a leader first, then a manager with Sarah Abrantes - The Managing Managers Podcast"
description = "VP of Engineering, Sarah Pimentel Abrantes, covers being a leader before being a manager, the challenge of letting go at different stages and so much more."
full_description = "Episode 25: Being a leader first, then a manager with Sarah Abrantes Guest BiographySarah Abrantes has experienced a lot of different tech roles over her career. She’s collected knowledge from development, business analysis, process engineering, testing and management, all acquired in a vast range of company and team sizes.She has played senior management roles and helped level up engineering leads over the last years in organisations such as GoEuro, N26, GetYourGuide and Tier Mobility, having recently joined Adyen as VP of Engineering. Sarah also presented at LeadingEng Berlin in 2023, so go check out her talk called “Influencing your company’s culture from the driver’s seat”LinkedIn: https://www.linkedin.com/in/sarahpimentel/Links and mentionsBrene Brown – https://brenebrown.com/ and one of her most popular books Dare to Lead – https://brenebrown.com/book/dare-to-lead/ Women CTO Dinner – https://womencto.eu/ 7CTOs – https://7ctos.com/TranscriptPatrick Kua: Hi everyone. Welcome to the Managing Managers podcast. Today we have Sarah Abrantes. Sarah Abrantes has experienced a lot of different tech roles over her career. She’s collected knowledge from development, business analysis, process engineering, testing and management. All acquired in a vast range of company and team sizes. She has played senior management roles and helped level up engineering leads over the last years in organisations such as GoEuro, N26, GetYourGuide and Tier Mobility. And has recently joined Adyen as VP of Engineering. Sarah has also presented at LeadingEng in Berlin in 2023, so go check out her talk called, “Influencing your company’s culture from the driver’s seat.” Welcome to the podcast Sarah.Sarah Abrantes: Hi. Thank you. Thank you for having me here.Patrick Kua: It’s a pleasure. You’ve got such a good range of experience across also some fairly well-known companies in Europe. I’d love to hear a little bit more about your leadership journey and how you ended up in management?Sarah Abrantes: Sure. So I think that it all started when I was an individual contributor. I think that that’s how it all starts. When you start to take some leadership positions. I think that this is important because oftentimes we have to remind people of this difference of leadership and management. You sometimes don’t have the title but you can start by acting as a lead and start gathering your leadership and your influence. And from that, it just naturally grows into management, if this is a path that you want to to grow into. That’s how my story goes. Getting a lot of leadership positions and eventually getting to official management positions as well.Patrick Kua: Great. I love that distinction that you make between leadership and management. It’s really about what you do. That act of leadership rather than necessarily having the title. And a good reminder that everyone can demonstrate leadership, regardless of what your current position is. At what point did you start managing other managers and what did that transition look like for you?Sarah Abrantes: I started back in, when I was at N26, where we met some years ago. And what happened over there is that the company was going through this massive growth. My teams, from the moment that I started to the moment that I left, grew about 10 times. It was a huge, huge growth and that also calls for other structures as well in place. We started out working with the tech leads and giving a little bit more responsibility and sharing this with them. But then it also grew into a moment where we needed to have other EMs, other Engineering Managers, in the company as well, and I started to build my organisation with them. Going back to what I said before, I think that leadership, again, is something that you can always be showing, even if you don’t have the title. Before I became a Head of Engineering, had managers to manage, I was also building a community of managers. I was giving support to new managers and I was building all of this before I got to a point where we decided to hire managers and then I was managing the managers.Patrick Kua: Great. And yeah, I do remember that, a very rare, fast paced growth. It puts a lot of pressure and stress. But it’s also a good learning opportunity for a lot of people. It sounds like you were already starting to do a lot of leadership as a leader of perhaps managers, was there anything that surprised you when you first started managing other managers? I hear there’s often this difference of relationship that people have with managing individual contributors versus managing other managers. Was there anything that changed for you or surprised you when you started doing that?Sarah Abrantes: It’s not necessarily a surprise per se but it’s something that it’s very difficult: It’s to let go. Letting go is really hard and I think that whenever you’re transitioning in your career, whether you’re going from an individual contributor to a tech lead, a tech lead to a manager, or a manager of managers, you’re always letting go of your old ways and your old job. And this is really hard because you’re not building replicas of yourself. You don’t want people to do it. You don’t want them to be you. You want them to bring their own ideas. But it’s really hard to see things happening and you’re not acting on them the way that you used to before. On top of that I think that as you grow, you become more accountable for the work and less responsible for the work. I mean you’re not executing it, but you’re more accountable for it and this is very scary.Patrick Kua: It is very scary. Can you help the listeners understand what do you mean by accountability and versus responsibility in this example? Can you give us a concrete example?Sarah Abrantes: Yes, of course. In a normal setup, and I hope that this doesn’t happen with anyone otherwise, you’re not going to get the CTO going directly to the developer to say “why something was not delivered”. The person that has to explain this and to justify why something is done a certain way or is taking longer etc is normally the higher management. They are going to, sometimes, I don’t know, be invited, depending on the size of the company, to go on a board meeting to justify stuff and that’s how it should be. You should not expose the developers to this kind of pressure. But you are not the person coding. You are not the person actively delivering this. It doesn’t mean that you would necessarily do a better job, but you’re also not super in touch with how things are going. Yet, you are the one that has to answer for them.Patrick Kua: That’s a really great example and what I heard there is that you can’t be involved, or you try not to be involved in the day-to-day with developers. That’s generally the role of that first level manager or tech lead. What are some of your strategies for keeping in touch with what people are doing given that you are accountable?Sarah Abrantes: So I try really strongly to not lose touch with everyone. Regardless of my position, at least up until now, and I know that this doesn’t scale forever, but up until now, and I’ve been responsible for organisations of roughly 100, 100+ people, I do talk to everyone. Not every day, but I do talk to everyone.Patrick Kua: That would be a lot of people.Sarah Abrantes: It is. It is. I don’t spend the whole day in 1-1s, so it takes a while. I do talk to everyone because I want everyone to feel safe to come to me to raise issues. I want them to tell me if they’re being exposed to unreasonable timelines, unreasonable workloads and so on. So that we can do something about it. Because again, you get detached from it and sometimes just don’t know what’s going on. I’ve seen situations where the developers oftentimes assume that everyone knows and they’re just doing a poor job knowingly. But sometimes they (management) just don’t know, so it’s very important that people feel this safety of coming and talking about the issues, so that we can try to fix them so that we can try to unblock them.Patrick Kua: Great. And when you’re talking to people one of the interesting things that sometimes happens is, here comes a director, or here comes a head of engineering. My manager’s manager. What are some things that you found that help to perhaps alleviate some of perception of or actual authority difference?Sarah Abrantes: So it goes a little bit with time but a few things that I normally do when I introduce myself: I try to introduce a little bit of my life as a person as well, so that they remember that I’m not this mythic figure that doesn’t have a life. But I do. I do have a daughter. I have a husband. Things happen in life as well in general and I like to put this kind of stuff in the conversation as well. My daughter going to school, for example, and other things on the day to day so that they can start relating and understanding that it’s all people. I also try oftentimes to break the ice with a few things.Like you join a company and you hear about the culture, for example, I like to ask the question, OK, now that I joined what is really the culture? What is really going on under the rug? I ask clearly to them what are the things that you think that I should be paying attention to? What are the things that you think I should have an eye on? Is there anything that is crossing your mind and I think that we start building the relationship from there.Patrick Kua: Great. I love how you bring in that very personal approach. As you say, it’s about, yeah, helping people understand you’re also a human. You also have other things than your title or your role. And yeah, giving people I guess anchors on which they can connect to you. It’s a really powerful approach. I think one thing that sometimes happens and I’m curious as to whether you’ve experienced this is when you are talking to people in teams, sometimes some of their managers might be worried about the conversations because they’re, perhaps, not feeling safe or they’re worried it’s about them. Have you ever had to deal with that with a manager that was maybe defensive or stressed around that and if so how did you navigate that situation?Sarah Abrantes: So I try to be very, very upfront. This is something that I adjusted, I think. In my culture, I’m originally from Brazil, we have a very talkative culture and are very around the bushes and stuff. But here in Europe, I think that I grew into a very direct culture and I put this together with transparency. So first of all, if I’m going to talk to the team, I do let the manager know. “I’m going to approach your team. I’m approaching everyone’s teams and I’m talking to them about xyz”. If there’s a problem with the manager, first of all, I’m not going to just talk to the team first. The very first person that needs to know that there’s a problem is the manager. I will go to him, I will give direct feedback, and when I need to approach the team, I’m telling him: “I will ask your team about what’s going on”. Do they like it? Probably not. But they know what’s to come. I think that this is important. I think that it’s not about how people like or not your decisions and what you’re doing but more like how behind that they can be. This can only happen if they understand and if you’re transparent with your intentions.Patrick Kua: Yeah, and what you said there is, yeah, not everyone’s always going to be happy with some of the decisions you make. I know, having talked to many other people managing other managers, one interesting challenge is sometimes you have to ask managers or teams to do things they probably don’t want to do, but you know it’s right for the organisation. Can you think of an example of where you’ve had to, maybe make a hard decision like that, and how did you go about delivering that?Sarah Abrantes: There are quite a few. Unfortunately I think that, from recent perspectives, there have been some layoffs in the industry and organising some of it is always a very hard position. It’s hard for everyone. No one wants to be in there. When you go sync with some of your managers to understand what’s next, it’s a very, very tough situation and you have to help them navigate this as a more experienced manager. But it’s just not easy for anyone.Patrick Kua: Yeah, great. Yeah, you’re right, is that it’s not easy for anyone to let anyone go. What are some perhaps concrete ways that you help your managers, in this example, with perhaps letting people go? What are ways that you perhaps support them?Sarah Abrantes: I think that reflecting on why we are taking some decisions. So first of all I think that we need to understand where this is coming from. We need to be able to reason about that. And afterwards when we get to a conclusion, we need to be able to defend it. We need to be able to.. if you were to talk about this with another manager, can you defend your choices? Can you defend what you’re doing? That is to remove some biases. That is to remove… Yeah. It’s really hard. I don’t think that I could ever come up with a formula to do that because it sounds very, very cold and again it’s a very hard process and emotional process as well. But I think that reasoning about this is very important. So what I do, I go through with them on the reasonings. We practise sometimes as well. I think there was even in one of your issues of the Levelup, where you said that when we’re going to have hard conversations, we don’t just YOLO (You Only Live Once) it, which is true. And a manager of managers also practises those because it’s just always hard. It doesn’t get that easy.Patrick Kua: Yep. No. Definitely not and they’re always tense regardless of how many things that you’ve done in the past for sure. I mean one concrete technique that I heard you say was really providing that context or that story about why. I think sometimes managers often think, well, what have I done? And sometimes those decisions are less about that person or that team and other things that are going on than the business that they may not actually know about and particularly I think in the current condition, that’s often a surprise for a lot of people who aren’t really connected into the cash flow or the operational side of the business as well.Patrick Kua: Let’s change trajectory a little bit. I know that you’ve just joined Adyen. So you’re still onboarding, gaining context. I’d like to talk a little bit about your past role because you were at Tier Mobility for a long time. So firstly, maybe you can help the listeners understand, who is Tier and what do they do?Sarah Abrantes: Yes, of course. So Tier is a shared micro mobility company that has light vehicles. So bikes, e-bikes, scooters in the city to promote transport in a greener way within the cities.Patrick Kua: Great. Excellent elevator pitch. I understand that you joined Tier as the director of engineering for platform and edge. So can you help us understand what you were responsible for and what was "
