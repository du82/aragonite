title = "Episode 7: Role models, restructuring and living in the future with Danielle Leong - The Managing Managers Podcast"
description = "Guest Biography Danielle is a seasoned engineering leader who is passionate about creating healthy, inclusive, productive engineering teams and helping them do their best work. She has a wealth of experience ranging from building teams at pre-seed startups to Director of Identity at GitHub to being an early engineer at Twilio. Danielle is also the"
full_description = "Episode 7: Role models, restructuring and living in the future with Danielle Leong Guest BiographyDanielle is a seasoned engineering leader who is passionate about creating healthy, inclusive, productive engineering teams and helping them do their best work. She has a wealth of experience ranging from building teams at pre-seed startups to Director of Identity at GitHub to being an early engineer at Twilio. Danielle is also the creator and founder of Feerless, an app that provided crowd-sourced, preemptive notifications for Netflix users with PTSD. In her spare time, she runs a photography studio that specialises in colourful, fun, and inclusive headshots. Social media links:Website: – https://danielleleong.com/Twitter – http://twitter.com/tsunamino LinkedIn – https://www.linkedin.com/in/danielleleong/ Links and MentionsLeading with Heart by John BairdPrinciples by Ray DalioManager resources repo – https://github.com/dmleong/manager-resources Nivia Henry LeadDev Talk – Living in the Future: How Leading Leaders is a lot Like Time Travel TranscriptPatrick Kua: Welcome to the Managing Managers podcast. I’m your host, Patrick Kua, founder of the Tech Lead Academy and curator of the newsletter for leaders in tech, Level Up. In this podcast, I’m chatting with senior engineering managers, directors, VPs of engineering and others who have walked the path of managing other managers, where we will uncover some great stories and lessons learnt. Let’s get started.Patrick Kua: Hi everyone. Welcome to the managing managers podcast. Today we have Danielle Leong. Danielle is an engineering leader passionate about creating healthy inclusive productive engineering teams and helping them to do their best work. She’s currently the VP of engineering at Maca, helping SAAS companies optimize their pricing structures with data. Previously she was the Director of Engineering for Identity and Access Management at GitHub and was an early engineer at Twilio. Danielle is also the creator and founder of Feerless, an app that provided crowdsourced, preemptive notifications for Netflix users with PTSD. In her spare time, she runs a photography studio that specializes in colourful, fun and inclusive headshots. Welcome to the podcast Danielle.Danielle Leong: Thanks for having me.Patrick Kua: It’s really wonderful to hear about your background. I was reading about you and we haven’t had that much overlap professionally. But I’d love to hear about your background in your leadership journey. So how did you get into the management track and what motivated you to move in that direction?Danielle Leong: Yeah, so one of my, the first team that I was on at GitHub, I had an amazing engineering manager. Her name was Helen. She really inspired me to see what a manager could be. She was incredible in terms of helping people along their journey, asking the right questions, leading people into learning about what the problem was and then leading them how to solve that problem. Rather than just being a top-down manager. This is like, okay, you need to do this, you need to do this. But she really brought you along on that journey and really helped me grow as an individual. So when she left GitHub, there was an opening there and because I was so inspired by her leadership style I was like, “Okay. That is actually who I want to be when I grow up.” We still remain to be very good friends to this day. I actually officiated her wedding earlier this year.Patrick Kua: My goodness.Danielle Leong: She remains a very very important part of my life. So she really kicked this off. In terms of what the craft of management and leadership could be.Patrick Kua: Yeah, that’s such an amazing experience and a) I know how hard it is to get good managers and also to get that style of management. I think it’s a really great example of having that role model. It sounds like it definitely had that big impact on you and created also the opportunity when she left. What was your transition like as you started to move into management? So you obviously had a good role model at that time. What other support did you have as you moved into that role?Danielle Leong: Yeah. So I had a lot of support. I was very lucky. I had an incredible group and network of people within Github that really helped me. Lynn was one of those people. Jim was another one. Anais is another one. These were all people that were invested in my journey. I had made personal connections with them. I had talked to them. Oftentimes they were my skip level managers and so when I stepped into this role, they were invested in my growth. So anytime I had a question like I don’t understand how to do this, or like I’m overwhelmed, I’m drowning, what the heck am I supposed to be doing? They would actually take time out of their busy days and really invest time in me to talk me through all of these different questions. Particularly being a woman of colour in a leadership position, you can have different sorts of issues that might pop up that maybe others don’t. So really having that female network, that female leadership, particularly female leadership of colour, that was incredibly important for me to not only help me grow as an individual and help me grow as a leader but to also help me feel less alone. Like we’re in this together. They were invested in my journey. They really wanted to help me succeed and you can’t replicate that. I do feel incredibly fortunate to have such an incredible support group around me, who really spent that time to help coach me to that next level.Patrick Kua: Yeah, that really sounds like a very unique environment. I’ve talked to lots of leaders and particularly as they step into their engineering management role for the first time a lot of people are left there to then work out how to do things by themselves. It sounds like you had such an amazing support network within your own organisation, through those skip one to ones and people with lots of different representation and probably different perspectives and experiences as well. I can imagine how that really helped ease you into that role and give you that support. Even it’s really difficult given that as you said leadership roles can be very lonely.Danielle Leong: They definitely can. Because you used to have a peer group of engineers that you could commiserate with. You could talk about the different problems that you’re going with but as you step up in leadership, that pool of people gets smaller and smaller. You have privileged information. You have decisions that either you know have been made or you have made yourself that have further repercussions down the line. They need to be planned out. That communication needs to be very thoughtfully put together to reduce fear, uncertainty and doubt. So that pool of people that you can confide in tends to get a little bit smaller the higher up you go. And so yes, it definitely is a privileged position but also it can be a lonely one and so without the right support network of folks that are at the same level, who understand the problems that you’ve gone through and can lean an ear or a shoulder and support on what they might do or even just to vent with somebody who understands those types of problems. That is incredibly vital.Patrick Kua: Absolutely. Everyone needs that place to let off steam and it’s not appropriate to talk about that with some of your people in your organisation and you definitely need that support network.Danielle Leong: Right.Patrick Kua: So we’ve heard a little bit about your journey into starting management. What’s the journey from there to when you started to become a manager of managers?Danielle Leong: Yeah. So I had been with this original team at GitHub for I think close to four and a half years. And at that point I was really looking to start growing. I had wanted to branch out from trust and safety. I had wanted to try something a little bit different for my own personal growth. I loved the team but my own personal growth felt a little bit stalled at that point. So Lynn, who I mentioned earlier, she said that she had a position from one of the managers on her team was going out on parental leave. Did I want to try leading the identity and access management team at GitHgub? So I said absolutely. Let me give this a shot. I’ve never done it before. That’s never stopped me before though. I love learning. I love trying something new. So I thought you know, let’s do it. Let’s do it. Let’s give this a shot. So I switched on over to identity and access management. Completely different field. It’s a highly technical field. It’s a platform team. It needs to have high reliability. It needs to have high security. It was just a completely different set of problems because we also had enterprise customers as well. In taking a look at the team I realised that they were doing too many things. There were 24 work streams for 10 people and I said the math doesn’t really add up here.Patrick Kua: That is a lot.Danielle Leong: As I started, that’s not how math really worked. You can’t have one person split across two and a half projects. What I did was I then took a look at the identity data model which was all of the different things that this one team was supposed to be in charge of. Then I started asking around and I said okay well who else touches these different projects and so in looking at that you actually became 3 different teams. Because I said it’s very clear that this one team is actually doing three different teams’ responsibilities. If you group them in this specific way then it starts to make sense. When you have an overlap of three different teams. who are technically owning one specific model, that’s why it takes a whole month to solve a support problem because it’s being kicked in between three different teams. If we split that out then it becomes very clear, ok, this very clear ownership here. Now that means that we can go faster with that clear ownership and then we have the ability to work on different projects and still be able to deliver to our enterprise customers. So that is how the identity and identity access management team became the identity organisation.Patrick Kua: Wow.Danielle Leong: And so then that split into 3 different teams and then I started managing managers from that point on.Patrick Kua: Wow.Danielle Leong: So it just happened to solve a problem I started managing managers.Patrick Kua: Yeah I mean it’s a very natural thing particularly with restructures, where suddenly there are more teams or a different point and it sounds like it was large enough that you wouldn’t be able to get involved in every team. You’d just overload yourself. So it definitely makes sense from that point. When you started to find people who would maybe lead or manage those teams were they more people internally or did you end up having to hire or was it a mix of people for those three groups?Danielle Leong: It ended up being internal. With the GitHub acquisition from Microsoft there were several teams that actually came over. The authentication and the external identities team. Being those 2 different teams. They had actually come over. Luckily they were also incredible engineers. They were incredible groups already. So it just happened that they came over together as a unit. So I was able to start managing whole groups of teams that already had an incredible workflow already. They already had relationships with one another. So it is a little bit different in the sense that I got lucky in that way. But certainly hiring managers is a whole different skill. We can go into that in another podcast. But building it from scratch I’ve built the internal team at Maca completely from scratch that definitely takes a long time. You’ve got to figure out what requirements you’re looking for. What does that role look like? That’s a completely different ballgame but in this particular case, I got lucky and I was able to have managers that were already experienced in their craft as well as with their team.Patrick Kua: That sounds like it’s a great place to be because when you’re dealing with particularly 3 groups of people and each group is chaotic, it could take up a lot more of your time and it sounds like you had a nice transition into managing managers where the team sounded like they were already in a high-performing state. They had good processes as you said and a good manager. What was it like when you were working with those managers for the first time? So I understand that probably the ones that came over from Microsoft you probably hadn’t worked with before. What was that like as you were thinking about building your management team?Danielle Leong: That was interesting. I would say that that was definitely the thing that required the most amount of communication. Because we are now merging 3 different cultures into one organisation. How do you take the best of each different previous history and each different previous culture and blend them into what will become a new organisation? So that ended up being a lot of back and forth. There was definitely some pieces of friction as well where we had disagreements about what is the culture that we are trying to build here? If I were to do it again I would have those explicit conversations up front. I would say, What do we value?What does each person, each manager here value? How do they like to get their work done? How do they like to run their engineering teams? What are the values that they have for their engineering teams? What is important to you? Is it building incredible software well? Is it building software fast? Is it getting promotions? What are the things that you value as an engineering leader and what is the best that we can take from each one of these and what can I as a leader say that is like, okay, this is what I want my organisation to be.Danielle Leong: Thank you for providing this context. But that’s not how we are going to be doing these things going forward because of these reasons and this is where I want to see this organisation go in the future. That is something that ended up being a lot of different conversations. If I were to do it again, I would have even more of those. Be very explicit. Have those offsites. Really start to think about what is the culture that we are trying to build here? Because it’s not just how are the engineers doing work. It is also what is the culture of each one of these different teams. What are the levels of autonomy within those different teams versus what do we collectively need to work towards as an organisation together? How do we present that united front as a leadership team? Then what are the things that are you’re free to do this within your own organisation because you are a leader as well? How do you want to run your own teams versus how do we want to be together as an organisation.?Patrick Kua: I think given that teams themselves have their own differences, it’s that extra fac"
