title = "Episode 5: More responsibility, less control and how the first team changes with Anita Singh - The Managing Managers Podcast"
description = "Anita Singh shares her experience, stepping into a managing manager role at the rapidly growing ultrafast grocery delivery company Gorillas and more!"
full_description = "Episode 5: More responsibility, less control and how the first team changes with Anita Singh BiographyAnita is an engineering leader who is passionate about building mobile apps and empowering teams to build quality software that delights users.After spending a couple of years working for bigger public tech companies, Anita has since worked at startups in both Silicon Valley and Berlin, where she has scaled teams, culture, processes and software from the ground up. She enjoys coaching engineering managers and staff engineers in her current role and hopes to continue on this path.Links and MentionsBuilding a first team mindsetAnita’s Twitter – @anitas3791Anita’s LinkedIn profile – https://www.linkedin.com/in/anitasinghusc/TranscriptPatrick Kua: Welcome to the Managing Managers podcast. I’m your host, Patrick Kua, founder of the Tech Lead Academy and curator of the newsletter for leaders in tech, Level Up. In this podcast, I’m chatting with senior engineering managers, directors, VPs of engineering and others who have walked the path of managing other managers, where we will uncover some great stories and lessons learnt.Let’s get started.Patrick Kua: Hi I’m really excited to have Anita join us on this episode today. Anita is an engineering leader who’s passionate about building mobile apps and empowering teams to build quality software that delights users. After spending a couple of years working for bigger public tech companies Anita has since worked at startups in both Silicon Valley and Berlin where she has scaled teams, culture, processes and software from the ground up. She enjoys coaching engineering managers and staff engineers in her current role and hopes to continue on this path. Welcome Anita to the podcast. Anita Singh: Thank you so much for having me. Really excited to be here.Patrick Kua: Amazing. You’ve got some really interesting experiences and backgrounds. So why don’t you help us understand your leadership journey and how you ended up in the role that you’re currently in.Anita Singh: My leadership journey actually started with a mobile lead role or a tech lead role. I think this was end of 2017, beginning 2018, where I was responsible for both the Android and iOS apps at this small startup and so this is where I launched into more the technical leadership side of things, like making sure we’re building a scalable app, architecture decisions, technical alignment, stakeholder management, release management. All these kind of fun, fun things, also around technical project management. We then decided to move to Berlin and so when I moved here, I had a chance to rethink what kind of roles I wanted to apply for and I decided to apply for senior Android roles because at the time Kotlin had just become the official language of Android development and I really wanted to get deep into that and master that. When you’re a Tech Lead you have a lot of responsibility that isn’t just coding or diving into the code so much, as you can maybe as a proper IC. So I decided to do that and joined Blinkist as a senior Android developer and had a really great time there. And a year in, I started feeling the itch of, okay, I think I’ve gotten this. I’ve scratched this itch of getting deep into Kotlin, I’m maybe ready again, to try some type of leadership role and my manager started this conversation of, “Do you want to go down the staff role or do you want to go down the engineering management role?”Anita Singh: And I started doing my research. I read books. I watched talks. And I decided that I really wanted to try the engineeringing manager route. I was really excited by figuring out how to have high performing teams, helping people grow their careers and just also the human aspect of it. I let my manager know and he started delegating some things to me like hiring, started using me as sparring partner and then eventually he actually did the switch – the swing from engineer manager to IC. So he went back to being an engineer and a position opened up. So they opened an internal hiring process because of course it’s like a role change rather than a traditional promotion. I applied and got the role and that’s how my journey in engineering management began. I felt very supported because I had this manager and also I had done research. I had worked with a leadership coach and so on so forth. A couple years later I got the opportunity to manage managers at Gorillas, which was going through this hypergrowth time. This was like pandemic time 2021.Patrick Kua: Maybe for the listeners, do you want to describe what Gorillas is?Anita Singh: Yes, my bad. It’s a grocery delivery company. Essentially you can have your essential needs delivered in minutes. I was one of the first 10 engineers there. I again started to be more hands on. But the idea was as the company grew, I would go back into management and this is where, when it kept growing again, a manager of manager position opened up. A similar story. I applied. I was really thrown into the deep end this time as you usually are in hypergrowth companies right? My transition to the engineering manager was so supported. Very calm and there was a proper transition period. Here, it was a bit chaotic right, as it tends to be. And actually that’s where the talk for the LeadDev on managing managers came from from that experience of being totally surprised of this experience. Around five and a half months ago I joined Freenow, as the director of engineering. So again managing managers. In not a hypergrowth scenario. In a more stable environment. And more on the backend side and working with more senior managers. So yeah, it’s been really fun so far.Patrick Kua: Amazing. And with more experience and lessons learned under your belt in your new role as well, I’m sure. Anita Singh: Yeah, yeah, although still early. But yes, already. Patrick Kua: Yeah, we’ll definitely come back to the talk that you were talking about because I think you’ve got some really interesting insights there.But let’s talk about your current role then. So FREENOW. Do you want to just give us quick overview as to what they do? And what your scope of your role is, like who do you manage, and what department or teams do you manage?Anita Singh: So Freenow is essentially a super mobility app. It helps you get where you want to go. And helps cities thrive. I manage 4 teams here. I’m sorry, 4 engineering managers, who have 4 teams, one team each. The scope is the marketplace. So essentially sits between demand and supply. So responsible for allocating the right drivers and having the right pricing and incentives to make sure we stimulate supply to meet the current marketplace conditions. So, it’s super interesting. It’s the backbone of the business. Really important for profitability and so on so forth. So it’s a lot of responsibility in that sense. But in terms of people it is reduced responsibility than what I had before, so it’s a nice balance. So overall it’s 20 engineers.Patrick Kua: Amazing. And then who are some of the peers that you work with and maybe other people across the business?Anita Singh: So peers? I guess I’m part of this broader organisation supply automation and marketplace. So I have my fellow manager of managers there. Around 3 of them. Then there’s broader peers as well outside. Which is around again 2 or 3 of the people and then there’s, of course, my product counterpart, design and then also outside of product and tech, there’s ops and the marketplace performance team. So these are my main peers I would say.Patrick Kua: Great. And who do you currently report to? Anita Singh: The VP of engineering.Patrick Kua: Got it. Excellent. I think it’s a really fascinating mix. You’ve got a few peers with similar scope and then you’ve also got ops and it sounds like in that industry, there’s probably quite a lot of ops.Anita Singh: Yes. Yes, exactly.Patrick Kua: How do you end up spending your time if you think about an average week versus your teams and the rest of the business? What does that look like?Anita Singh: That’s a great question. I guess because I’m still a bit in the onboarding phase. It’s probably going to look different as I get deeper. But I would say around half my time goes into marketplace topics. So our leadership round and my product counterpart and design. Then maybe like other 20% with my peers and around the rest towards ops. Although I have to say I do rely on my product counterpart a lot for that.Patrick Kua: Yeah, amazing. And I mean you just talked to actually about onboarding and it is relatively new in that area. What has your experience been like as a manager of managers onboarding? Was there structure in place? Were you thrown into it and work it out? How has that been for you?Anita Singh: So my manager actually had this nice 30, 60, 90 day plan. On my first day that we went over. So that really helped in knowing what I need to accomplish in my first three months which is, I think, quite crucial. But also had to be realistic right? Because a lot of the decisions you make right now or the path that you take, you probably see the impact of that way later. It’s probably not going to see some of that in the probation six month period so my manager really helped set those expectations. And then I did onboarding sessions with each of my 4 engineering managers. To learn about the systems in tech. Also, and then I did skip levels with everyone. Just intro coffee, so that was very eye-opening as always. I think the first few months was really just building relationships. Patrick Kua: What are some approaches that you’re using to build relationships with people?Anita Singh: Ah, that’s a great question as well. In the beginning really, it’s just having those first calls. And then following up. You see these concerns that are being brought up. Or ideas. Making sure I write them down. Or then keep that conversation going. I either say, “Hey, that was a great idea. I followed up on this. What do you think?” And from there I started the first few experiments I wanted to try out. So I think just keeping that loop going and then figuring out the ritual ways I stay connected with people as well. You know, skip levels. Knowledge sharing sessions that I’m part of. Or demos. Or all hands. Or stakeholder reviews. Like putting those initial rituals in place that either weren’t there or changing them or leveraging the ones that are there.Patrick Kua: Amazing. Yeah, it sounds like you’ve got some good cadence of structure of these different, as you mentioned, rituals. It sounds like your calendar is probably quite full. Anita Singh: Yes. Unfortunately, yes.Patrick Kua: Which I think is the case for people who end up with more scope. How do you carve out time for your thinking and work in that role?Anita Singh: I took the tip from Lena Reinhardt. She has this really great talk on building strategy. And I have blocks. I have at least Wednesday afternoons fully blocked for strategy time and it’s anyway meetings free time at work. So I try to really enforce that as much as I can with my direct reports. So that’s a good 3 hours a week that I intend to spend on thinking and strategy. But of course sometimes it doesn’t work that way. Patrick Kua: Yeah, it’s great that you’ve got that blocker. Anita Singh: Yeah.Patrick Kua: In terms of what you talked about with strategy time. I think there’s the temptation that if you have that time, it’s easy to whittle it away with email and other little tasks. What’s your tips or tricks for keeping to what you describe as strategic work and what does that look like for you?Anita Singh: Yeah, I try to definitely minimise Slack. I put the status saying I’m just going to be very delayed in responding, after 5 or the next day. Closing email. I spend this time to just read. I’m still onboarding. There’s so many terms I hear every day. I’m like, what does that acronym or what does the service do exactly? I keep notes of this through the day and then I spend this time first looking into that. Learning about it all. Figuring all the questions I need to ask to learn more because I’ve never been an engineer at Freenow. I don’t have that ability yet to just dive in and figure it out. So I have to really rely on people for that. From there, write down my thoughts. I have a document that I’m working on. The strategy. So I just keep adding to it. Although the next step right now is to do a workshop with some ICs and engineering managers. I haven’t done that yet. These are just my playground and my thoughts.Patrick Kua: Great. Excellent! A fantastic approach and I can see just having that time to think and focus on those high-level topics is really key. It’s good that you’ve got your process around that. You mentioned earlier a little bit about experiments. Can you give us an example about what’s an experiment that you’re running? What scope does it involve? How are you running it?Anita Singh: Yeah. So I took on this team from my manager who had a much bigger scope. He has a lot of different teams. So it’s very much still in the forming stage. I basically set some engineering manager rounds every week. Also around with product, design and data. So just setting up what meeting or aligning with them looks like, what’s the format of this, and iterating over that. Initially, there was a little bit of resistance of like, “Why do we need these meetings?” or the format. But it took some iterations. Now we’re in a better place. So for example, just introducing those was the first small experiment. And then also introducing this shared space. This engineering shared space. When I joined backend people would have the backend sharing and frontend would have these chapters. There wasn’t so much knowledge sharing between the different functions. So just setting that up also had a little bit of resistance to that because they were like, “Oh, we already have these.” I also didn’t want to be the person who just comes and introduces meetings. So I framed everything as an experiment. We’ll try once. If people hated it people don’t need to do it again? Once we tried it a couple of times, people seemed to like it or at least tolerate it. So those were, I think, starting with rituals was what just the first thing I did. Patrick Kua: Good. Excellent. So I mean one theme that I’m hearing is one of your roles is connecting those silos. Anita Singh: Yes, exactly.Patrick Kua: It sounds like that’s something that happens quite a lot which is teams work in their own space but actually, that cross-pollination is not happening organically and you’ve experimented to create some serendipitous connections around that or maybe more opportunity for those connections.Anita Singh: Exactly. There were silos between the cross-functional team. Silos between product, data and engineering. Also silos between the different functions. So at the beginning I was like, yeah, let’s start at least talking more and be more of a team. That "
