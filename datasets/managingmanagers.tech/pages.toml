["https://managingmanagers.tech/episodes/episode-011-katie-wilde"]
title = "Episode 11: Reasons why managing managers is not for everyone and so much more with Katie Wilde - The Managing Managers Podcast"
description = "Guest Biography Katie Wilde is currently Senior Director of Engineering at Snyk Cloud and has played other roles like VP of Engineering at Ambassador Labs and Buffer. She co-authored the O’Reilly books “97 Things Every Engineering Manager Should Know” and “Atomic Migration Strategy for Web Teams” and is also co-author for the Holloway Guide to"
full_description = "Episode 11: Reasons why managing managers is not for everyone and so much more with Katie Wilde Guest BiographyKatie Wilde is currently Senior Director of Engineering at Snyk Cloud and has played other roles like VP of Engineering at Ambassador Labs and Buffer. She co-authored the O’Reilly books “97 Things Every Engineering Manager Should Know” and “Atomic Migration Strategy for Web Teams” and is also co-author for the Holloway Guide to Remote Work.Social media links:Website: http://katiewilde.com or email hello@katiewilde.comTwitter: https://twitter.com/gokatiewilde Mastodon: https://octodon.social/@gokatiewilde LinkedIn: https://www.linkedin.com/in/katiewilde/ Links and mentionsHavard Business Review – https://hbr.org/TranscriptPatrick Kua: Hi everyone. Today we have Katie Wilde and Katie Wilde is currently Senior Director of Engineering at Snyk and has played other roles like VP of Engineering at Ambassador Labs and Buffer. She co-authored the O’Reilly books, 97 Things Every Engineering Manager Should Know and Atomic Migration Strategy for Web Teams and is also co-author of the recent Holloway Guide to Remote Work. Welcome Katie to the podcast.Katie Wilde: Thank you so much for having me Pat. I’m very excited about this podcast.Patrick Kua: Me too. You’ve got such a fascinating background. You studied philosophy, economics, have a Masters in management and strategy and before I understand it right, a certified financial analyst, and ran your own digital agency. So what’s your story about getting into tech and starting to lead?Katie Wilde: Gosh. Well I would say that I’m a curious person and so I think this industry is a great fit. I meet a lot of people who have the same fundamental curiosity. And that’s what got me into tech. It’s just neat that you can think of things. You can build them. You can make things come to life and I’ve really found that translated even more strongly into leadership where that kind of curiosity of what is happening here? Why are people behaving the way that they are behaving? What is everyone optimising for? It might not be what I am optimising for. That kind of a curiosity I’ve just found is grist to the mill when it comes to managing people and then managing managers where there’s just so much more to investigate and debug.Patrick Kua: Yeah I love that. I think you’re right is that our industry is so great for curious people. There’s always something new to learn. There’s always the people element which is always a challenge. And I could definitely see how that led into leading and managing people. What’s your story about getting into the management track and how did you start getting into, say managing people and then managing other managers?Katie Wilde: Well, I would say it’s a common story. I was working at Buffer at the time and at this time, Buffer was self-managed. There were no managers and it wasn’t going brilliantly. Which is a whole separate podcast that we could go into. But anyway I just joined. I was some roughly like lead-ish shaped engineer and I started doing a lot of things that it turns out are kind of fairly typical of engineering management, just for my peers. So because there was no management structure. It was emphatically self-managed. There were things like you had to write your own promotion cases and argue for it yourself. We had to get consensus on roadmaps and so I ended up playing a lot of these roles where I would go and talk to a PM. What are you thinking? What can we build and is this feasible? And oh I’m going to help my friend now. Like yes, you definitely are ready for this promotion. Let’s write this document. Let’s make the business case and after a few months of doing that, the organisation realised, well, maybe self-management and in various areas isn’t going the way that we’d quite hoped. I then took on the official role of engineering manager. At no point did I really receive much formal training and I’ve since then spoken to my peers. I don’t know if it’s the case today for engineering managers, you’re having their first management job, but you seem organised and like a fundamentally decent-ish human. Have at it. Like I don’t know. The first time I had to let someone go, I had to Google how to do this. It was like the Harvard Business Review was my number one resource and I have to give a huge amount of credit to the coaching that I got along the way. So I decided well, I’ve been thrown into this. I don’t have a boss. I’m reporting to a technical co-founder, who’s not much older than me and this is their first job. I don’t have somebody that can really tell me this is how it’s done. So I told myself last year I’m going to hire myself my ideal boss and I managed to get some very wonderful coaches. I’ve had a series of coaches and that was an absolutely massive career accelerator for me. Because you need somebody like that, it’s their job to tell you no, that’s a terrible idea or I think that you’re wrong in the situation. That you can listen to.Patrick Kua: Yeah.Katie Wilde: And if you don’t have that in your environment I think it’s quite difficult to make progress. So that’s something that I’m just so so glad I did. I can’t take credit for it. Actually I saw a tweet from Lara Hogan saying the biggest career accelerator for her was to hire a coach. People hire personal trainers all the time if they want to get fit. Or they go to the doctor if they’re unwell. I was like, oh yes, this is my exact situation and so and so yes, so that was very important.Patrick Kua: So just to reflect on what I’ve heard it’s like a) it’s really amazing because I think what you were demonstrating in that role before stepping into that EM role was really a lot of that leadership potential. Or the actions of what people would expect. So I guess that’s that formalisation and I think that journey that you talked about of being given that title, by then realising I don’t have any training am I doing the right thing is a very common experience for a lot of people. I have a little bit of selection bias because I obviously do training for EMs. But I know that there’s a whole bunch of people who don’t get that. I think everyone is looking for resources. Like HBR, Harvard Business Review or many other places today. But you’re right, a lot of people really struggle with that transition and I think it’s also very great that you also did reach out to get a coach because I think there’s also that difference between, oh yeah, this is a good idea versus actually then finding somebody and then doing that. So I’m really pleased for you.Katie Wilde: Oh thank you so much. Yes, and I love that you do management training because it’s something that I’m very passionate about where this is a separate profession and you should get trained. If you’re not being trained then you must train yourself. Absolutely.Katie Wilde: And I think I’m very grateful to have become a manager in an environment where management wasn’t the default. The alternative to me being a good manager was we won’t have any managers. And that was very important because it wasn’t the case that, of course, they’re managers. You get promoted into management. You’ll always be the manager. Now you’ve got power and you can do whatever. It was like, no, you have to prove your value to your peers, that are engineers. You need to be useful because there’s a very real chance that if this engineering management situation wasn’t meaningfully better than self-management, we would have just gone back to self-management. I think that that’s a fairly unique experience. A lot of people will say servant leader or like the job is to empower and support. But when you’re given a new role and you know, well either you figure out how to empower and support, or this entire situation, we’re just going to undo it, it gives a… it makes it very real. Let’s just say yeah.Patrick Kua: Yeah. Yeah, there’s definitely that credentialising. The proof and that pressure, as you say, of well this is maybe an experiment for the organisation. Did we really make the decision and that willingness to want to really make a big difference? Positive difference as a manager? Absolutely.Katie Wilde: Exactly.Patrick Kua: So you became an engineering manager and at what point did you start managing other managers? What did that journey look like for you there?Katie Wilde: It was a chaotic and difficult journey. It wasn’t something that and then I naturally stepped into it. And it was all wonderful. And I think it’s very important that the listeners know that this is a difficult transition, at least for me. I started managing managers when the CTO at the time decided to move on. At that point there wasn’t really a replacement and so I was in an interim leadership role. I think that was both a difficult situation and also in some ways a blessing because there was an out if I decided this is all but I can’t do it. There was a plan on paper. Well maybe we’ll go and hire a “Real VP of Engineering.” But I suppose the flip side of that, is you’re in an interim position and you don’t necessarily have a) the skills and training yet and b) the explicit organisational backing. So that was the environment with which I went into managing managers who were very aware that they’re being managed by somebody that’s never managed a manager before. Like there’s no hiding that. I must say Pat, it was much more difficult for me than the original engineering engineering lead/EM transition. The transition to managing managers. It was so much harder. And I remember my counterpart at the time, who then later on became the CEO, Dan Farreley. Yeah I was saying to him I’m really struggling with facilitating this meeting and I don’t know how to do this. And he said yeah but your management style. It’s like you walk in and you turn off the music and silence. And then you read everyone the thing and it’s like, “What are you doing?” I just remember being like, I see that. But I don’t know how else to do it. I think now, I love it. Now I actually I love the job of managing first-line engineering managers. It’s absolutely my, I don’t know if I’d say it’s my passion in life, but I just really love it. I was thinking the other day would I ever want, say, my boss’s job, say at Snyk? Where you’re only managing directors. It’s very much M&A. It’s very high level, strategic. I was like, I think I couldn’t. I couldn’t handle not being in it with managing EMs that are leading engineers. So I love it but the difficulty is you have to learn to manage without really knowing what the outcome is at a short level. And you have a very long feedback loop and that was what was so difficult for me compared to managing ICs (Individual Contributors). With an engineer. If you’re an engineer and they’re an engineer, and now you’re managing them, you can go to your Git repo. And you can go and look at the code they wrote. And so you can answer basic questions like is this person productive? There’s a factual answer. Is this person a good mentor? Again, you can look at their PR (pull request) reviews. You can see how they give feedback. It’s typically public. So there’s factual answers. And then suddenly, you get into managing managers and you’re thinking, does this person give effective feedback? You can’t join their one to ones.Patrick Kua: Yeah. Kind of awkward right?Katie Wilde: How does this person run their team meetings? Like you don’t know. Is this person? I mean, you can see the outcomes of the team. But I’ve seen teams that have had very strong engineers and a very strong PM that have been very successful despite an engineering manager who turns out was really failing. And then I’ve also seen teams that were really struggling for a variety of reasons and had that engineering manager not been extremely strong, that team would have been struggling 10 times more. So it’s just very very difficult and we can go into how do you know? How do you find problems? How do you know if a manager is doing a good job? How do you help them if they’re not doing a good job? Yeah. I love talking about all that stuff. But it’s something that was really hard for me to learn and it was really hard for me to find resources at the time.Patrick Kua: No, absolutely. And this is one of the reasons I’m doing this podcast. I think a lot of people have a very similar experience to you, which is, oh managing managers is the same, and then they’re actually, oh, it’s really different than what I was expecting to do with managing individual team members. I think also similarly, when you’re in that role, you’re often, once again, not given a lot of support. Maybe you’re ready for this and then here you go. bBut nobody’s helping you understand what are those differences and preparing you for some of the challenges that you’re going to have. A common theme that’s definitely come up is that long feedback cycle. The signals that you get are more subjective, tenuous. Like you said you can’t already join somebody’s 1 to 1. You can’t really evaluate how somebody gives effective feedback. And that’s a very common challenge for a lot of people who are stepping into this managing managers for the first time. Thank you for helping us understand what your journey was like and let’s hear about some of the things that you’ve learned along the way then. One of those things that you said is how do you start to evaluate how good an engineering manager is. What are some of the signals that you look for these days?Katie Wilde: One of the big signals that I look for these days is, is the team able to incrementally make progress? This is not to be confused with how much they ship and how fast they ship. Are they able to do milestone-based development and deliver vertical slices of value? I can just imagine I hope no one from Snyk listens to Katie-vertical slices-Wilde. But that’s one of the things that I’ve, when it comes to the job of delivering software in how incrementally are they able to break it down? When I ask an engineering manager, how’s the project going at what level of detail do they answer is very important. If you ask the manager how’s the project going and they say it’s going great, I get very worried. If they say we’ve finished take a 2.3.49 and we’re on milestone 1.4.1b sub-section I, I get even more worried. I’m like, you have lost the forest from the trees. What I want to hear is something on the level of what I would call medium detail.Katie Wilde:If somebody tells me, well, we’re able to ingest assets now. That seems to be working for this type of container image. We don’t quite know how to make it work for a different type of image. But we’re working on that and our next milestone is going to be deduplication of the assets that we’ve ingested. That is an answer that gives me confidence because I can see that the engineering manager sees both the forest and the trees. Sometimes they see only one or the other and that’s a problem. So that’s the "
