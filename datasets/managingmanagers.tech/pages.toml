description = "Biography Phil has been leading software teams in their hyper-growth stages since the early 2000s. He headed product engineering at SoundCloud and DigitalOcean, and platform engineering at Meetup and SeatGeek. He is currently a co-founder of Outropy.ai, the Copilot for Leaders. Links and Mentions Phil's website Phil's socials: Twitter, LinkedIn The Engineering/Manager Pendulum Outropy.ai Scaling"
full_description = "Episode 4: Hypergrowth leadership, the pendulum swing and attention management for managers with Phil Calçado BiographyPhil has been leading software teams in their hyper-growth stages since the early 2000s. He headed product engineering at SoundCloud and DigitalOcean, and platform engineering at Meetup and SeatGeek. He is currently a co-founder of Outropy.ai, the Copilot for Leaders.Links and MentionsPhil’s websitePhil’s socials: Twitter, LinkedInThe Engineering/Manager PendulumOutropy.aiScaling teams by Alexander Grosse and David LoftesnessAttention is all a manager needs and the original Attention is all you need paperThe original Backend For Frontends (BFF) articleTranscriptPatrick Kua: Welcome to the Managing Managers podcast. I’m your host, Patrick Kua, founder of the Tech Lead Academy and curator of the newsletter for leaders in tech, Level Up. In this podcast, I’m chatting with senior engineering managers, directors, VPs of engineering and others who have walked the path of managing other managers, where we will uncover some great stories and lessons learnt.Let’s get started.Patrick Kua: Hi everyone, welcome to the Managing Managers podcast. I’m very excited to have Phil Calçado. He’s a very experienced engineering leader. Phil has been leading software teams in the hyper-growth stages since the early 2000s. He headed product engineering at SoundCloud and Digital Ocean and platform engineering at Meetup and SeatGeek.Hi Phil.Phil Calçado: Hey Pat, how are you doing?Patrick Kua: I’m very well. How are you?Phil Calçado: I’m good, I just realised that in that bio. It misses the places where we met, at ThoughtWorks. It’s back like 15 years ago.Patrick Kua: This is very true. We never really got to work together. But I’m very fortunate that our paths have crossed professionally over the last couple of decades still.Phil Calçado: Sure, it’s a consultant’s core.Patrick Kua: Excellent. So you’ve got a huge history and I’d love to delve into particularly your leadership journey. Can you give us a bit of a high level overview of what it looks like so far?Phil Calçado: Sure. So you know, it’s the typical story. Especially for the early 2000s of people who fall into management. I never really wanted to be a manager or a leader. That was, maybe, I mean, I would say I didn’t want to, but I just never thought of it. I was like 22, whatever I was. From my very first job, I was working on that kind of digital agency back in Rio, I was quickly made team lead and as things happened back then, my first job was to fire two people from my own team that I had to work with before, just like, just up to then.So you know, having to learn how to do these things on my own, because, to be honest, mentorship was not great, was a huge component of my first few jobs, usually starting as a senior engineer in some way, and getting some leadership positions. That’s actually one of the reasons I joined ThoughtWorks back in the day, because I wanted to be around people who knew what they were doing. It turns out nobody knows what they’re doing. But it was still very, like the community was great and the exposure to different projects and different sizes was an incredible growth opportunity. And then after ThoughtWorks, which, you know, has a leadership component to consulting, but you’re not really managing people as much. It’s really like influence, which is a good muscle to exercise and learn about anyway, but then I, that’s when I moved to Berlin and I joined SoundCloud.It’s kind of completely by accident. I really just wanted to move to Berlin. I think I was the eighth engineer on our team at SoundCloud. The company was probably 40, 50 people total. And same story, I just wanted to move to Berlin, write some code, you know. Deal with some electronic music. Quickly ended up running the product engineering team, but the app team, we used to call it, became the product engineering organization, and it was a crazy, crazy journey.So after that, one thing, and we could talk a little bit about more of this, I would talk about managing managers, but I realized that I was over relying on my technical skills as an engineer. Actually, it wasn’t that I had this realization. I received this feedback from a boss I really respect. From Dan, it was like 2015, up to, well, I don’t know, five years maybe, I decided to kind of swing the pendulum back and try to stay as much as possible, you know, exercise my leadership and management muscle.Fast forward to now, I am actually starting a new endeavor, which means it’s me and my co-founder, I’m just cranking out code every day. I tried to manage him, but he slaps me, so let’s see how that goes.Patrick Kua: Yeah, it’s very exciting, and I’m very enthralled by what you’re building, which is a tool for engineering managers. We’ll talk about that later, but let’s delve into, particularly, the managing manager part. So I got the impression that when you joined SoundCloud, and those years there, it grew really rapidly, and so you started ending up managing managers. What was that sort of transition point? Was it something that you got pulled into? Was it something that you just got thrown in, you like every other role?Phil Calçado: Yeah. I just like perpetuated a curse a little bit probably. So I was moved into management at SoundCloud, as part of a restructure when our first group of engineering, who was Alex Grosse, who was still lives in Berlin. He decided to create a management layer, because up to then, everybody was managing to him. We were hiring like crazy. It was getting complicated. So we split into maybe four different groups. Product engineering was one of them. Then we had data and infrastructure. Yeah, I think it was the groups we had. And I then started off with a team of maybe eight people. Three months later maybe I had already 25 people reporting to me.Patrick Kua: Wow.Phil Calçado: So that’s the point you realize that you’re spending more times in 1-1s than anything else in your life. And also, I was really worried because I just, I was not able to follow what was happening in the company. In SoundCloud, always moved very, very fast. So at that stage, I started thinking about introducing a new layer. I talked to my leader and what we worked out. Ok, I should probably pick a few different people and not think too much about the structure, because we were in a hurry, there’s not a lot of time to plan.So I looked around my staff, because I’d never really hired an engineering manager and back then, you know, all this culture, we have now, with the material, you and other folks producing in these areas, this didn’t really exist. In fact, I think Alex wrote one of the first engineering manager’s book from the experience at SoundCloud a few years after this event. Anyway, so I looked around and I kind of tried to get feedback from people on the team. Like who would be good candidates.I’ve got two people who were very strong technically, but also were very kind of people people. Those are the folks who would come to me and say, hey, you should pay attention to this person, I think they are struggling a little bit. And they, they would tell you, both of them, that I kidnapped them into a room and made them managers. That’s a lie. I did not agree with that. I do not condone this version of the events. But I did talk to them. Say, hey, I want to try this out. I don’t know how it’s going to go. What do you think?And that’s when, you know, in one week, we had two new managers taking care of two slices of the team. Eventually it grew to be, you know, three different verticals under me, that each one had a lot of different managers. But that’s kind of how my first managing managers experience started. I had no idea what I was doing. All I knew is that this was not scaling. We need to build all these different things and we need smaller teams that have dedicated support.Patrick Kua: Amazing. So a couple of things. So the Scaling Teams book. I think that was the one that Alex wrote as well. So we’ll add that in the show notes as well. Really great book. Not so well known, I find. But I can see some of the lessons probably from SoundCloud there.Let’s delve into the sort of two people that you, not kidnapped, but convinced to step into a management role. So it’s an interesting mix because they were, they had that technical background, but they had that sort of people focus. And so when you put them into that sort of role, and you know, for you, I guess it was also relatively early in a sort of management sort of skill set or career. What sort of support or how did you support them being successful as engineering managers?Phil Calçado: So that’s probably the time where I developed a few of the things that I still apply today as a manager. One of them is, everybody who works with me knows that I talk a lot about accountability and responsibility. And these words in English are terrible because they could mean whatever the person wants them to mean. So I have to spend some time defining what that means to me, so I can use it as a framework. And I mean in general times, if you’re accountable for something, you are ultimately responsible for the success of that whatever that thing is. If you’re responsible for something, then you know, repeating words again gets complicated, but responsibility in this, basically means you’re doing the work.And there’s a very interesting dynamic that happen when you’re accountable for something. So if that fails, it’s on you, but you’re not responsible for it. So somebody else is doing the work and like, oh shit, how can I control this thing that I can’t control? And also the other way around. When you have responsibility, but no accountability. So it doesn’t really matter if it goes well or not.So I started thinking a lot about how to establish this framework, which is important to me, plus something that, obviously, took a few years to develop. But the idea that as your leader, as your manager, I’m working with you, it’s the same for ICs and first level, for several management as well. But it’s more important for when you’re managing managers in my experience, which is that you need to tell me what hat you need me to wear right now. Because I could be a coach and let’s sit down and work on this problem together, or it could be more of your boss. Maybe I can escalate something, or you need more context, or, you know, I need to represent the company often times, especially the higher up you go. The worst thing that happens with this thing is when it’s mixed and you’re bringing something to me that I think you could try to escalate to me and know, oh, we wanted to have a conversation about how to deal with that thing. Or, vice versa. You bring something that you really need me to act on. And I’m like, oh, yeah, let’s whiteboard this idea. It’s like, no, dude. Do something. It’s your job.So these are the first few pieces that I put together in trying to work with them. One thing that’s really important to me, and also it was part of the selection of these two particular people, was that I, my general feelings that, I hate the concept of managers as gardeners of people. I think this is not something, that’s to be honest, makes any sense to me. If I wanted somebody to be just a people manager or a coach, I would hire somebody who actually has studied that and not try to shoehorn a software engineer into this. So this is the component of people management, delivery management, and the technical accountability for what’s going on in this strategy of the team. I think are really important. I tried to use these generic building blocks in helping people through that.Patrick Kua: Great. I mean, I love the distinction that you make between the accountability or responsibility. And I think what you’re trying to say, or what I understood was that, clarify expectations around what are they, particularly between managers, because that’s where it gets fuzzy, I guess, where people are making assumptions as to who is responsible and accountable.Phil Calçado: Yup.Patrick Kua:It’s a lot easier when an IC is taking on, or an individual contributor is taking on very specific work. You see who does the work. But at management, it gets a bit fuzzy because everything is more conversation or sort of hidden work or not necessarily something that you’re producing as such.Phil Calçado: Yup.Patrick Kua: So I love that distinction that you make around that. I also love that you sort of define, I guess, sort of three capability areas that you talk about with engineering managers. Around the delivery management, the technical management and the people management as well. I found, personally, delivery management seems to have gone down a little bit, skills wise, in our industry. How would you describe what you mean by delivery management?Phil Calçado: Yeah, I definitely agree with that face value. So the way I see delivery management is really, you, again, going back to accountability. You are accountable as a leader of a team. For something, let’s say, it’s a delivery of a feature or a product or whatever it is. As a manager, you need to look at how things go from somebody gave you a task delivery to how that goes, how that’s live in production and working, right? And everybody’s responsible for this but the manager’s accountable for that. And figuring out, and that’s, you know, that’s where I think we lost, figuring out what’s the value stream to get there.I don’t want to throw a lot of terms that might not be familiar to people. But basically, what are the steps to go from A to B and manage that. I would say that in a healthy organization where you have enough technical skills, your people are not, it’s not a people crisis every day. This is the most important job for manager to look at this pipeline. It’s a factory from an idea to production and realize, “What’s missing here? What can be better? How can we prove this?”And I definitely agree that, for various different reasons, a lot of what we have developed as a culture of delivery in the 2000s has kind of died off. I think some of these reasons are valid. Because, you know, the work, the word back when people talked about the agile manifesto, it was very different.Yeah, IT was really outsourced, cost center, a whole different organization. And right now, we have a lot more contact with the business, especially like the tech industry as a whole. Banks and big corporations might be different. So it requires some changes from what was written 20 plus years ago. But it’s still, there’s a lot of practices that people are just like completely ignoring. And, funny enough, reinventing as they go.I guess, Pat, we’re old now. And when we were fresh, junior engineers, it was like, oh, I’ve seen this in the 90s. It’s like, oh, shut up, old man. It’s like, now, now we’ll see this. But yeah, I think it’s a, it’s a most important, well, I don’t know most about most important, bu"
