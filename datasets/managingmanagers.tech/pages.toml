title = "Episode 28: Leadership skills and energy management with Alice Bartlett - The Managing Managers Podcast"
description = "Tech Director at the FT Alice Bartlett covers how tech skills are not necessarily managing managers' key skills, the importance of leadership skills, and managing your energy (and your calendar!)."
full_description = "Episode 28: Leadership skills and energy management with Alice Bartlett Guest BiographyAlice is a tech director at the Financial Times. She oversees the team that builds and maintains FT.com and the apps. She has been at the FT for eight years and managing managers for about 5 years. She lives in Brighton with her family.Social links:Website: https://alicebartlett.co.uk/Contact: alice.bartlett [at] gmail.comLinks and mentionsHarvard Business Review: https://hbr.org/TranscriptPatrick Kua: Hi everyone. Welcome to the managing managers podcast. Today I’m delighted to have Alice Bartlett. Alice is a Tech Director at the Financial Times. She oversees the team that builds and maintains ft.com and the apps. She’s been at the FT for 8 years and managing managers for about 5 years and she lives in Brighton with her family. Welcome to the podcast Alice.Alice Bartlett: Hello. Hi. Thanks for having me.Patrick Kua: Great to have you on board. You’ve got quite an interesting history. So can you tell us a little bit about your leadership journey? If I understand it right before your current role, you were a Principal Engineer. So can you explain how you ended up in that role that you’re in now?Alice Bartlett: I was a Principal Engineer in the same team that I’m now the Tech Director of. For 5 years. Then six months ago I applied for the Tech Director role because my predecessor left and got it. So I’ve been doing this new job which is overseeing all of ft.com and the apps. We’ve got about 50 engineers and the budget associated with that as well. So I’ve been doing that for six months now.Patrick Kua: Very exciting. It sounds like with the ft.com and the apps. There’s quite a lot of things. I heard about 50 people. So can you describe the structure and how you divide work up between the structure of teams or people that you have?Alice Bartlett: Yeah. There’s 10, what I would call delivery teams. And they are cross-functional. So there’s a product manager in that team, a tech lead and some engineers and then depending on where in the product lifecycle they are, they might have a user researcher. They might have more time with research. Or an embedded researcher in the team. Or maybe they’re in a very maintenance and optimisation focused team which would get less time with user research. Then there’s a leadership team. Which is me and should be 5 Principal Engineers reporting into me. Although it’s 3 currently. Between us we run the team. We run all of the technical aspects. We do lead with my product counterpart. The director of product and the product managers. The whole piece of ft.com and we’ve got the FT app and then another app called the edit.Patrick Kua: Great. Excellent. And if I understand it right, then your Principal Engineers are also doing management. Is that correct?Alice Bartlett: Yes. I don’t think it’s a normal understanding of what the job title, Principal Engineer, means.Patrick Kua: It’s a bit unusual.Alice Bartlett: To have them doing management. But it’s what the FT does so. How would I describe that role? It’s more like there’s a bit of technical oversight. You’re looking at… maybe you’re doing a review of a vendor selection process. You’re maybe in a conversation with vendors asking the technical questions to make sure that the sales tap dance they’re doing is not just not completely compelling to marketing but or whoever the other stakeholders involved are. But you’re actually asking… Great. But do you have multifactor authentication. That kind of thing.Patrick Kua: The basics.Alice Bartlett: Yeah. Yeah. So maybe that. Or maybe you’re getting involved or closer to a problem. Some team’s delivery has gone a bit wonky and you need to kind of do that. You’re then managing the tech leads. So you have managerial responsibility for everybody and your management subtree. We used to have matrix management where people managed cross teams. There was a big overhead to understanding what was going on. so now we keep it in a tree structure where you manage people who are working on the same domain. Then the final part of that is operational. No. It’s strategy and strategic cross group things. Like work that doesn’t fall into different delivery teams but needs to go as a bigger piece. Our Principal Engineers lead on that. Maybe it’s an architectural thing. Or maybe it’s a management cross group thing like pay rounds. Promotion cases. That kind of thing.Patrick Kua: Got it. Okay and so if I understand it right, then you have you as a Tech Director you have Principal Engineers reporting into you and then those Principal Engineers are managing Tech Leads. Is that correct? And then tech leads are then managing other individual contributors? What’s that relationship?Alice Bartlett: Yeah. Yeah. So they will be managing tech leads and occasionally some others. Maybe people who we are very focused on developing. Who we just want to have a shorter line to leadership. Maybe there are some extenuating circumstances as well I suppose where we just need to provide some short-term relief in terms of management burden on a tech lead and we might rearrange stuff temporarily. Then the tech leads manage some people in their teams and maybe they even manage someone who then manages someone. One of the things we try to do is have nobody managing more than 4 people. So that we think is a manageable number to also be able to do other aspects of your role like tech leading or tech oversight or that kind of thing.Patrick Kua: Yep. No, that seems like a very sensible number. I definitely know that when people have a lot of people, that people management aspect can absorb a lot of time at the cost of other responsibilities or accountabilities.Alice Bartlett: Yeah. I think there’s a counterpoint to it though which you do need… I think 4 is actually ideal. If you only manage one but another person then you end up not having enough experience to understand.Patrick Kua: Yes.Alice Bartlett: You don’t have anything to balance the one experience you have with one person. So we try to have at least 2. Ideally 4 for each manager.Patrick Kua: Yeah. No, that makes sense. I think we have a good picture of your organisation and your group. I heard you have a peer counterpart. The Director of Product I think it was. Then what other peers do you have? Do you have other tech directors? If so, how many are there and is the division of work across all of you?Alice Bartlett: Yeah, there are 6 other tech directors. They have between team sizes of, say, I think 30 and 50. They are looking after different domains. So mine is the front end part of ft.com. Some APIs. But all the way up to my counterpart, Dimitar. He has what we call FT core. They are focused on databases and access to those databases for content. For subscriptions. For membership. All of that.Patrick Kua: Great.Alice Bartlett: Then we have an internal products team. They manage our CMS, spark. But also Salesforce. Anything for internal teams and then we have a staff experience team and an engineering enablement team. Then we have a specialist team who are actually managing all of our other publications. So there’s the FT. But the FT actually owns a lot of other specialist trade publications like The Banker or Investors Chronicle, etc. That has a tech director that oversees all of that. She has a very complicated job.Patrick Kua: Wow! Lots of peers. Lots of complexity and then who do you currently report to?Alice Bartlett: I report to the CTO. Rebecca Salisbury. She’s also new. She joined about the same time as I became Tech Director.Patrick Kua: Right? Okay. I think we have a good picture I think of downwards into your organisation. Sideways into your peers and upwards into your CTO. In terms of perhaps other departments and peers being responsible for the apps and the frontend. What other departments or teams do you work across in the business?Alice Bartlett: Yeah, so there’s 2 main stakeholder groups. There’s editorial, who are the journalists all the way up to the editor. They have a lot of interest, as you can imagine, in our storytelling formats. The article page. Comments. Everything where their work is shown. They view ft.com and the app as part of this is not just where it’s like the newspaper, but it goes when it’s on the internet. They have a good appreciation of the different ways in which technology can help them in their goals of telling a story. So they’re very invested in the technology and also the product. It’s kind of interesting because when I first started working with the FT, I used to work at a company called Asanka and we were doing work for the FT and then the FT acquired Asanka. Then at that point it was maybe fifteen years ago and there were still people who felt like the web was just where we put the print.Patrick Kua: Yeah.Alice Bartlett: The non-print version of stuff. There wasn’t this kind of appreciation of the the material qualities of the web and also the app and what technology can do for your ability to tell stories.Patrick Kua: Yep.Alice Bartlett: Now we really have that and it’s very cool. So that’s one group of stakeholders. I work with Matt Garrahan, who is the person in editorial who I work with the most. He’s the person who represents all of their interests to us. Then the other group is commercial. That is the consumer revenue group whose concern is getting people to subscribe. And getting people to keep subscribing. What they’re interested in is, from my perspective, is how I meet their needs. Is by creating a website that is marketable. Not marketable in the sense that it has lots of bells and whistles that you can talk about in your marketing. But technically marketable. Like how do commercial partners roll out a marketing message on the site and it also is in people’s emails. So there’s a technical capability that they can have two market things and that’s what that relationship is all about for me anyway and what I’m trying to improve at the moment actually is the marketing capabilities we give to that group.Patrick Kua: Great. That’s super fascinating. I think also some of the things I heard you say are a great reflection about how, I guess, technology has become pervasive. End users like your editors start to appreciate the capabilities that platforms like mobile and web have. Interestingly start to affect how they express their needs to you probably of how they’d like to express a story. Inspired by different apps or seeing these things and what could we do? I think that’s a really exciting time to be in a place like the FT.Alice Bartlett: Yeah, yeah. We do get, the New York Times has done this. That would be our main goal for an editorial. Our main competitor I think is in terms of experience is what the New York Times is doing.Patrick Kua: Yeah. That’s great. I mean one of the interesting things I’ve heard while talking to people managing other managers is where people spend time. That can seem like a very strange thing for a maybe first level tech lead or manager of a team. Where a majority of their time is spent with a team. So if you think about your calendar, is there an average week or how would you describe where your time goes?Alice Bartlett: Oh that’s an interesting question. Yeah I agree. One thing I was thinking about in the run up to this is that there is a naive idea about what a tech director does. They must just be the person who’s best at computers. And obviously in a team of 50, the skills you need to manage that successfully and lead it really don’t have a lot to do with computers at this stage. Certainly it’s not the first or even second most important skill. So yeah, what’s my calendar look like? I might be able to just find a tab with it in. I think I do spend most of my time in meetings. That is for sure.Patrick Kua: Yes, that’s a very common occurrence.Alice Bartlett: Yeah. I spend a lot of time meeting with my team. Group meetings with the Principal Engineers and then one to ones as well. I have an hour a week with each of them. I spend a lot of time with my product counterpart. At the moment because I’m hiring I’m spending a lot of time doing screening calls. I think it’s a really good use of my time to be right at the front of the funnel because I can just get an understanding of the candidates. But it is very time consuming of course because we haven’t done any interviews with them. We’ve had a call with the recruiter to check the salary and right to work and stuff. Then it’s straight into me. Then the rest of my time is spent not on things I can predict. But things are happening. When you’ve got fifty people all going about their daily lives, every week there’s something that needs an intervention from me. In order for me to intervene appropriately, I need to invest the time to understand the problem and you can’t do that without actually putting quite a bit of time into it. The thing I don’t ever want to be is the person who parachutes in. Doesn’t know what’s going on and then makes everything worse. So yeah, I’d say that’s how it breaks down but certainly no time spent writing code.Patrick Kua: Yeah, yeah. I could definitely empathise. I’ve heard this many times. I find some really interesting things that you’ve talked about. I’ll come back to a couple of them. But I want to focus on one of the last things I heard you say which was dealing with surprises and the interventions.Patrick Kua: It feels like you have a very good deliberate way of maybe building up context. I think one thing that sounds like it could be a bit of a challenge is if your calendar fills up with meetings. How do you handle needing to deal with a surprise or an intervention? How do you make sure I guess you have enough capacity to investigate or intervene in the way that you’d like to?Alice Bartlett: It’s just constant prioritisation by me. So if I can see that there’s something that needs my time, I will say to people, I’m sorry. We have to move this meeting. Or can we move it to next week? That is very necessary a lot of the time. The second thing is using my Principal Engineers. Getting them to investigate things. If ideally what I will have if something has gone wrong is I’ll say to one of them, hello. Could you please write me a one page or on what’s happened here. Then I’m at least briefed a little bit before I get into my own stuff. A key skill I’m interested in Principal Engineers that I hire is can you look at an ambiguous and messy situation and write one page on it that I can then read? Those are the 2 things really. Ask the leadership team. Give them a request and then also just reprioritise my time.Patrick Kua: Great. Very practical and very useful tips for I think a lot of people. I think for a lot of first time managers of managers, they may be not used to moving meetings and asking to reprioritise, so it feels like that’s something that you’ve maybe done a lot and have got very comfortable with.Alice Bartlett: Yeah.Patrick Kua: Gre"
