title = "Episode 20: Navigating organisational change and traumatic times with Nivia Henry - The Managing Managers Podcast"
description = "In this podcast, we cover how directors help people through organisational change, the trauma of forced change from COVID and how to build shared context."
full_description = "Episode 20: Navigating organisational change and traumatic times with Nivia Henry Guest BiographyNivia is a technologist with over 20 years of engineering and leadership experience. Her career path has included nearly every role in tech; but her true passion is inspiring people to do their best work. These days Nivia applies her talents as Director of Engineering for Spotify’s new music team, tasked with bringing enriching artist expression tools and experiences to Spotify. Nivia gives back to the tech community by speaking at, chairing and attending tech conferences. Her hobbies include: mentoring Black engineering leaders; reading; and relaxing on her farm with her hubby Andre and their feline overlord Zuko.Social media links:LinkedIn: https://www.linkedin.com/in/nivia/ Twitter: https://twitter.com/lanoobaLinks and mentionsFive Dysfunctions of a Team https://www.goodreads.com/book/show/21343.The_Five_Dysfunctions_of_a_Team Camille Fournier’s The Manager’s Path – https://www.goodreads.com/book/show/33369254-the-manager-s-path DDD Europe – https://dddeurope.com/ DDD System – https://en.wikipedia.org/wiki/Domain-driven_designBAPO (Business, Architecture, Process, Organisation) – https://brain.mikecordell.com/posts/20210813165115-business_architecture_process_organization_bapo/TranscriptPatrick Kua: Hi everyone. Welcome back to the Managing Managers podcast. Today I’m really delighted to be joined by Nivia Henry. Nivia is a technologist with over 20 years of engineering and leadership experience. Her career path has included nearly every role in tech; but her true passion is inspiring people to do their best work. I think that makes a great manager. These days Nivia applies her talents as Director of Engineering for Spotify’s new music team, tasked with bringing enriching artist expression tools and experiences to Spotify. Nivia gives back to the tech community by speaking at, chairing and attending tech conferences. Her hobbies include: mentoring Black engineering leaders; reading; and relaxing on her farm with her hubby Andre and their feline overlord Zuko. Welcome Nivia to the podcast.Nivia Henry: Oh I am so happy to be here. Thanks for having me Pat. And what a lovely intro.Patrick Kua: Thank you. You’ve got such an amazing background. You’ve been working in tech for a while. So can you remember when you first got into the management track and why you made that transition?Nivia Henry: Indeed. It’s been a little while. I felt every year of those 20 years. So I would say my first official leadership job came around, I want to say 2004/2005. incidentally it was not exactly a tech job I was at. I was the marketing manager for a luxury toilet company. Kind of far with tech. I started out as a tech intern. Took over the marketing role. Got promoted along the way. One of my roles was leading at the time. I remember talking to my parents about it. My parents are still, in my eyes, very successful, leaders. Some of the best leaders I’ve seen to date. They were executives at IBM. I felt such a big responsibility and their advice to me was, remember, at the end of the day, people will respect your authenticity. So everything you do apply yourself. Apply your talents. You’re curious. But meet people where they are. Come from it from a place of genuine interest and the rest will sort of work itself out. I found that to be true. I love tigerette(?) and took on a much larger team right after at DDI. And that team, oh I want to say it was in the dozen. So I went from meeting a couple of people and that was a tech job and that felt it was definitely out of the frying pan and into the barbecue pit. So I would say that was probably my first significant leadership role at that time.Patrick Kua: Wow. Yeah I mean it’s great to have a couple of great role models. Also some great advice about really leaning into authenticity. I can see that really come through in how you talk and how you present yourself as well. I can imagine your team would really love working with you. Can you remember when you started to manage other managers? What was that transition like?Nivia Henry: Wooo. Oh boy. So you think, OK, I’ve been leading and supporting people for a while now, it should be the same job. Maybe a little bit more scale? And I did not find that to be true at all.Patrick Kua: You’re not alone. You’re not alone.Nivia Henry: So basically my first significant managing managers, I had small tastes of it here and there, when my manager was out. Even at DDI and I would sub for them. But my first full blown full time job was at Spotify. I was promoted from engineering manager to senior engineering manager. At Spotify what that means is you’re now managing managers. You’re managing a group. A product area some people call it. And so it was a group comprised of about 4 or 5 teams and each team had an engineering manager reporting to me. So luckily that promotion set me up for success because I was already part of that team. I understood the culture domain well which I think is extremely important. And I knew the folks well but what it did is when I transitioned into the role I had to first change a little bit of my mindset from how do you interact with your peers to people who are now reporting to you? That becomes a tricky dance of itself. And so a lot of my time was spent making that transition as organic as it could be, because let’s be realistic, the dynamics have shifted. All of a sudden the jokes about your manager being a pain in the ass you look around and you’re the manager.Patrick Kua: That’s you, that’s you.Nivia Henry: Exactly. So those were moments of, oh right, right, I am the pointy haired boss now in the room. So I spent a lot of time trying to manage that transition organically as well as just trying to give my team as much space as possible. Because that was the risk as well. I knew the domain so well that I could have really over leaned in and helicoptered them to death. But that would have done them a disservice and that wouldn’t have given them an opportunity and that would have only limited me anyway. So I would say those were the two things I recall focusing on.Patrick Kua: Great. It sounds like a really nice transition for you. I think one challenge for engineering managers is sometimes they find themselves as a manager without a lot of support. When you transitioned to becoming a senior engineering manager did you have any support and if so what did that look like?Nivia Henry: Oh that’s such a good question Pat because I don’t. I’ll butcher the joke but I remember the joke, someone making the joke to me, the higher you go the less support you get. You’ll know whether you’re doing well if you still have the job. And that tends to be true. In terms of support early in my career, the person who supported my promotion was my manager and who helped me transition into the senior EM. Her name is Michelle Alexander Baller. Oh my god. She’s such a good leader. One in a thousand, I would say type of leader.Patrick Kua: Amazing.Nivia Henry: Michelle, if you’re listening. First of all, you ought to be listening. But if you are listening… She was so supportive. So the short answer to your question is, yes, she was extremely supportive and a lot of it had to do with her coaching stance. At the end of the day, she had a lot of faith in me, it was a long journey. We were together for years. What she intended to do was act as my sounding board. Oftentimes I would go to her and be like, I need.. what do I do and she’d go, well, let’s talk it out. No. Give me the answer. She’s like would you give your EMs an answer? In this crisis I might. Well what would they learn if you gave them the answer. Instead, let’s talk through the scenarios. Let’s talk to the pros/cons. Oh darn it. So she just became a sounding board. A new type of rubber duck if you will.Patrick Kua: Fantastic. Yeah I mean it’s so useful to have a sounding board. I’m just comparing it to many other people’s experiences of being thrown in, as you say, you just are expected to operate and you’re lucky if you continue to have the job. People don’t have that sounding board and it sounds like you’ve got a really good relationship and Michelle was able to help you by acting as that sounding board.Nivia Henry: Indeed.Patrick Kua: So that’s some fantastic support. What were some maybe surprises for you? So sometimes people think, oh, if I become a senior engineering manager in your case, it’s more of the same. So what was maybe something that was different for you or some surprises?Nivia Henry: Right? There were quite a few. So the ones that stood out for me, Pat, were, we already talked about the fact that the relationship dynamics change. It wasn’t a surprise but the extent to which it changes took some adjustment. It’s all good. It should change. But one never is prepared for that. The second one was that you have to give up a lot of your, I would say, lower level knowledge or more detailed, finer grain knowledge in order to absorb more nebulous concepts. What I mean by to oversimplify it, you have to start really seeing the forest for the trees. And you have to then shed a lot of the individual trees and branches. To overextend the metaphor I was deep in the trees and trenches because it’s somewhere I was, for at least 2 years I think, before I became senior EM. These are teams I worked in. These are technologies I built. I was very proud of having that knowledge. But the brain only has so much space so I had to give a lot of that up and really start looking around. Also the other thing that stood out was where one operates or where specifically I had to operate.Nivia Henry: In other words, as an engineering manager, really is a first line role where your primary concern is your team and their health and how do you block and unblock and support and enable. That concept of a team, for me, never went away which I love, but it’s no longer an engineering team. It is now a cross-functional team of my peers. So it was more of a peer group where the biggest role I had was influencing. I had to influence my peers to work with me and to work with my teams. To get on board with some of the same goals and concepts that we’re trying to achieve together. Then I also had to influence it because the cruel joke is, people are like, oh you’re the manager. You have all the power and the answer is no, no, no. The higher up you go. Middle management is just a progressive loss of power, until you become CEO. Then you maybe get that power back. The other change I would say was the ability to bring others along through context and influence as opposed to the perception that you can just tell people what to do and they’ll follow along, which is laughable. So those are the ones that stick out.Patrick Kua: Yeah I love the way that you phrase it as well. Context and influence. I think it’s such an important aspect and you’re right is that I think a lot of people. It feels you have more authority but actually feels you don’t when you’re in that role right?Nivia Henry: Not at all. Not at all. My goodness. To your point I wonder if other managers have felt that shift as well because somehow when you look at your own reporting line, they do still seem they have the greater influence. Sometimes I have to remind myself that they have a manager too. They have a limited sphere of influence as well at the end of the day. Unless you’re the owner of the company, sometimes not even the CXO, your ability to make things happen and the snap is limited. So even I sometimes am reminded that we all operate in this capitalistic system that we all have to make do.Patrick Kua: Indeed. Unfortunately but it is also the reality of it.Nivia Henry: Indeed. All good.Patrick Kua: I want to jump to a talk that you gave related to this theme of managing managers at Leading Eng. It was called, “Living in the future: How leading leaders is a lot like time travel.” So what is this concept of time travel and how does that relate to leading leaders?Nivia Henry: My goodness. Oh that brought back great memories. I was sad to have missed being live for that talk because I caught COVID. Unfortunately.Patrick Kua: On no.Nivia Henry: But to your question, I am a huge sci-fi geek. I love sci-fi. I primarily read fiction and sci-fi is my favourite genre. So it was inevitable that I would have some kind of time travel sci-fi at my talk. The concept I would say resonated with me because oftentimes when I think about my day, it’s never about what’s happening today. Today as a director, and this is timely because we’re planning, as most people are. We are always or at least I find myself thinking about either next month. The next three months. The next quarter. The next six months. The next year. It is very rare that I am talking about, thinking about or operating at today.That’s probably appropriate, right? I have very incredible talented people, who are supporting and executing on the day-to-day thinking about the challenges that come up day to day but oftentimes it just doesn’t come to me. If there’s an issue on production, for example, unless the CEO of Spotify is going to know about it, it rarely comes to me. There’s someone there. Rightfully so to support it. So what the organisation and what my teams rely on me for are things like, what are we doing in the next six months that will have an impact? What are we doing in, well, really what are we doing in the next year? We start there and back that into six months. Back that into three months. Then how do I help enable it? Do we have the tech stack we need to succeed? Do we have the people? Do the people we have the skills?Do they have the confidence and the enthusiasm? Those are the domains that I find myself thinking about which to me is time travel. I’m always thinking in the future and there are days where I wake up and I’m like, how is it Thursday? when yesterday was Sunday so that’s what came about.Patrick Kua: Time definitely flies faster. Particularly in these more senior roles.Nivia Henry: It’s true. It’s true.Patrick Kua: I think it’s an interesting perspective of living in the future with that different time perspective, particularly that six, maybe, twelve month horizon. I also understand that it’s probably not something you can do by yourself. Is that you have to get input from other people. What’s your strategy for bringing people on that time travel journey with you?Nivia Henry: Oh such a good question. So first of all, you already know this, Pat. But leadership is best done when it’s a team sport. I love tennis but, to me, tennis is a contrast, where it’s really all on your shoulders all the time. If you’re sick, you’re sick. There’s no game. Whereas I see the leadership team as more of a basketball team, where you have, hopefully, a strong bench. You know how each other operates and at any given time you can jump in for one another. So to your question about what that looks and how d"
