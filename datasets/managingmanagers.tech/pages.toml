title = "Episode 16: Management as a true calling and the three pillars of being a director with Dan Na - The Managing Managers Podcast"
description = "Dan shares how he found his first managing managers role, how he sees management as his true calling, and how management might not be everyone’s cup of tea."
full_description = "Episode 16: Management as a true calling and the three pillars of being a director with Dan Na Guest BiographyDan Na is the Engineering Director of the Market Expansion organization at Squarespace in NYC. Previously he was a Staff Engineer at Squarespace and an Engineering Manager at Etsy. He loves learning and teaching in a collaborative environment and solving both the technical and people problems of shipping software. He’s a weather-agnostic iced coffee drinker, a mediocre golfer, an NBA basketball fan and loves spending time with his family.Social media links:https://blog.danielna.com/Twitter – @dxna – https://twitter.com/dxna Mastodon – @dxna@mastodon.socialLinks and mentionsResilient Management by Lara HoganGood Strategy, Bad Strategy by Richard P. RumeltHigh Output Management by Andy GroveTranscriptPatrick Kua:Hi everyone. Welcome to the Managing Managers podcast and I’m delighted to be joined today by Dan Na. Dan Na is the engineering director of the market expansion organisation at Squarespace in New York City. Previously he was a staff engineer at Squarespace and an engineering manager at Etsy. He loves learning and teaching in a collaborative environment and solving both the technical and people problems of shipping software. He’s a weather agnostic iced coffee drinker, a mediocre golfer, probably much better than me, an NBA basketball fan and loves spending time with his family. Welcome to the podcast Dan.Dan Na: Thanks Pat. Thanks for having me.Patrick Kua: It’s great to connect with you. We’ve maybe exchanged paths a little bit over the internet but it’s nice to speak to you at last. I’d love to hear a little bit about how you got first into the management track.Dan Na: So my path to management started at Etsy. I worked at Etsy from 2013 to 2017 and by sheer dumb luck, the manager who hired me at Etsy was Lara Hogan, who’s somewhat famous now. She’s a very well-known engineering management thinker. She’s literally written a book about engineering management called Resilient Management, which I consider one of the best books about the human-centred nature of the management job.So when I was at Etsy, I was on the IC track for most of my tenure, mostly working on front-end platform type things. But then one of the last roles I took there was the engineering manager of the accessibility engineering team. So that was cool. I bootstrapped that team as an IC and then I moved into a management role and I worked under Lara this entire time. It was just really valuable for me to learn from her example. I left Etsy in 2017. I came to Squarespace. I actually returned back to the IC track. But eventually I became a staff engineer and eventually I moved back to the management track.I think I always knew the manager track was my career calling. It’s just the track that’s much more resonant for me personally and I think more consistent with my skills. But the timing wasn’t right until the opportunity came up and I’ve just been on the manager track ever since then.Patrick Kua: Fantastic. So I think it’s great that you’ve had a great supportive environment as you transitioned into the management track. As you said Lara Hogan is very well known and make sure her book also appears in the show notes there. It’s a great book. Nice, short and digestible. As you mentioned it’s a really good focus on the human side as you mentioned management. And yeah, it’s great to have that support when you’re actually growing because I think a lot of people get thrown into any type of management track and probably not really having that supportive environment. As you went back to being an IC what were the areas you were working in?Dan Na: I was a staff engineer at Squarespace. That was just kind of an evolution of my IC role when I joined. I joined as pretty senior and then I became a staff engineer. I think if you were to ask internally at Squarespace what I’m known for, I was one of the two engineers to bootstrap the international engineering effort which started formally around 2018. In terms of the scope… So the other thing about Squarespace at that time, I think like many tech companies around that time, we were really growing a lot. I think our engineering team had, I think they had, recently added titles shortly before I joined. So it was a pretty flat organisation. Then we had this really big growth push where we doubled engineering in two years and then we doubled it again or something. So a lot of things were up in the air. When you grow that much, they’re just some side effects. Everyone’s just trying to figure out exactly what the processes are: what the management structure will look like, what the titles will look like.So if I had to explain my scope it would probably be pretty imprecise. It was just like, “Hey, we want to do international. We’re going to do a small team, so you and this one other person go on this team. Can you just figure it out?” I was like, “Yeah, let’s figure it out.” So the role wasn’t very well defined other than: I was a senior person. I was shipping a lot of code at the time. The team was really small. We were just tasked with setting some foundations and kind of getting our own bearings and figuring it out and so that’s just how it happened.Patrick Kua: Great. And what I’m hearing there is even though there wasn’t a strict, perhaps, definition of the scope, I understand it that you had perhaps a clear remit of: Grow or start the international organisation. Lead the technical infrastructure and work out some of those key technical decisions that probably need to be made in those early days. Is that right?Dan Na: Yeah. I think it was just: be the senior person in the room. So at the time, when international was in its infancy, the cross-functional team was like 4 people. It was me, as the engineering representative and three people for marketing. And now it’s literally 50 plus people. The cross-functional org is much bigger. The initiative. There’s a ton of cross-functional work that goes behind it. A really big marketing and strategy component. So when it was very nascent, it was just, we were all kind of just flying by the seat of our pants a little bit. We were starting from scratch more or less and we’re like, “Ookay what’s the first thing we should do? Let’s align on that.” And so my responsibility was translating a lot of that into engineering requirements, which was a thing that I was used to. I had managed before. So yeah, it was to ship a lot of the code but also do as much of the technical leadership responsibilities necessary to keep this going, given that it was a very small team.Patrick Kua: Great. I’d like to maybe backtrack a little bit and go back to one of the things I heard you say. Which was, I heard you say, the management track as your true calling. What does that mean to you?Dan Na: Yeah. That’s a really good question. This is actually a thing that I talk about with a number of people. I’ve had people email me, being like, hey I’ve thought about going to the management track. The best thing I can explain about the… I have tactical reasons why I think the management track is better suited for me personally. I think it aligns a little bit better to some of my skills. Some of my differentiating skills. So, for example, I really don’t struggle to put my thoughts to paper. Which sounds really weird, right? But I do think in the management function when I talk to people who… There’s this trope, “Oh I tried management and it was horrible. I was in meetings all day and I had to write docs all day.” That’s kind of true. I think it’s kind of a very uncharitable take on it. But it’s also, inevitably, a lot of your artefacts are communication. Either written, in person, or presenting. And if you hate that, maybe this isn’t a job for you. I don’t mind that. I actually have never struggled with any of those parts. So that part is not even a thing that I consider a blocker.The other thing about calling, though, that I can’t really explain really well, is the analogy I actually give people is…So growing up I owned a bunch of guitars. I owned maybe five. And I knew a lot about guitars. I can see a guitar from my desk right now. But the reality is I suck at guitar. And the reason is when I pick up a guitar, I just don’t care that much. As much as I appreciate a good guitarist and I understand a lot about it: I can probably identify what guitar they’re playing and I like music. When I sit down to put in the reps of building the callouses and doing the scales and learning the music theory, I just don’t. I just didn’t. I never did. It’s just not resonant.Whereas when I’m in the work of day-to-day management, I really find this intrinsic value in understanding incentives, putting forth… living out the cultural beliefs that I want to be true in a team. I find a lot of satisfaction in… I don’t really mind the long feedback loop. A lot of the pitfalls that I think people don’t like and the main differences between an IC track and a management track are things that I don’t really find that problematic. It’s just ever since I stepped into the function. I like planning. I like making a strategic decision. I like taking a diverse set of inputs. I don’t mind the meetings required to do it. I like understanding the incentives of non-engineering people to help dictate our roadmap. I really like the mentorship aspect. So in that way, it’s really hard to explain resonance, but it just feels better. That isn’t to say I don’t code. I was a staff engineer. I did write a lot of the code. It’s just if I had to choose, it’s the management track.Patrick Kua: That’s a really great answer. If I was to reflect back on some of the things that I’m hearing here is that when I hear that term resonance. There’s a lot of activities associated with management and it feels like those activities are interesting for you. Which, if I compare it to other engineers who step into management roles, sometimes it’s a bit of a struggle for them to want to do that. I think you gave a really good example as well of writing your thoughts down clearly. I’ve enjoyed a lot of your writing. It’s one of the reasons I’ve included a number of your articles in the past in my newsletter at some points. As you said, it’s an activity that you’ll be doing as a manager and if you don’t enjoy that, then it’s going to be very difficult. So I can see a lot of that resonance around if you’re good at these things, if it’s needed, and you find interest in them, it’s going to be a lot easier in that area of staying in that management role. So I appreciate that. Let’s talk about your current role then. So if I understand it right, you started off as that staff engineer, working with a small group of people. Today you’re an engineering director so tell us about that journey.Dan Na: Sure. So it was pretty organic. As the international business evolved, as the demands on the international engineering team evolved, as the cross-functional team evolved, we just needed more headcount to fulfil our mandate. And as we needed more headcount… So when I started it was me and one other engineer that I still work with, Karim Baaba. And he reports to me today as a staff engineer. So we had a ton of shared context. He’s a really strong engineer. We didn’t need a lot of ceremony because we just sat next to each other and we’re, like, hey, we need to do this. But then as we started to grow the team and add people from outside the organisation or internal transfer or whatever, we were like, okay, this process where we read each other’s minds doesn’t work anymore. We need to double down on something more formal. We need some onboarding.Our reach was expanding so we needed a lot more documentation and empowering other teams to use the tooling that we were building. And I was like, “There’s a lot of overhead here where the opportunity cost of me spending time on coding is just too high where someone else can probably do the coding work. Someone needs to step into this more managerial function.” Also, when you add people you need career growth for these people. You need to manage the levels and the tasks and the priority. Somewhat organically as the team grew, I moved back to the management track which is the thing that I think I always knew I was going to do. Then it grew more. The international business is one of our biggest drivers, even today. So as the company has doubled down on that investment, our team has grown accordingly. So eventually we needed to split into two teams. One of the ICs on one of the teams wanted to try the manager track, and so they turned into the engineering manager for one of the teams. That’s been really successful. He’s great. He reports to me today.So international is kind of like… It existed and I was the senior manager over that team. Then late last year the company was talking tactically about really starting to invest in the enterprise business. Meaning enterprise customers using Squarespace. Building lots of sites. They have some bespoke needs around security and access and workflows that an individual customer doesn’t have. There are a lot of parallels between the needs and challenges of enterprise to what some of the challenges that international faced in its early days in terms of, “How do you build this abstraction on top of this product that wasn’t necessarily built for this customer?” So when they were thinking about what to do with this org, if they really wanted to invest more in enterprise, they were, hey, we’re thinking of creating this market expansion organisation. Enterprise international. While, at face value, they are very different, they actually have a lot of thematic overlap. So do you want to step into this director role and lead both and that was a great opportunity. So that’s how I became the engineering director. There was a spot they wanted to really invest in. I have a product and design counterpart so there was a sufficient product engineering design triad to work with. That’s how I stepped into my role at the end of last year.Patrick Kua: Great. As you were asked, would you like to step into the director role, at that point if I understand right, that level had been defined and that title had been defined, so that there was an idea about the general high level scope about what a director meant. Is that correct? Or is that still fuzzy?Dan Na: I feel it’s unavoidably fuzzy to some degree. I think it’s mostly just, you are more accountable for the outcomes here and you have a bunch of disparate workstreams under your remit and the managers that are accountable to those outcomes. I’m somewhat more accountable to the cross-functional stakeholders and that there is ultimately a group of executives that both initiatives roll into that are not engineering. Like C-suite level executives. Thus, by being in that director role I’m invited to those meetings to explain the engineering component to what we’re doing. I wouldn’t say "
