title = "Episode 9: Serendipity, looking for future talent, and how to do no harm with Theresa Neate - The Managing Managers Podcast"
description = "Guest Biography Theresa Neate is an award winning senior leader with a background in service desk, software delivery, quality engineering and platform developer experience, who loves lean and agility and advocates for holistic system quality and systems thinking. She has an additional side interest in cloud, infrastructure and networking. She has also written on the"
full_description = "Episode 9: Serendipity, looking for future talent, and how to do no harm with Theresa Neate Guest BiographyTheresa Neate is an award winning senior leader with a background in service desk, software delivery, quality engineering and platform developer experience, who loves lean and agility and advocates for holistic system quality and systems thinking. She has an additional side interest in cloud, infrastructure and networking. She has also written on the subjects, including contributing 2 chapters to a published O’Reilly book.Social media links:Website: https://theresaneate.net/ LinkedIn: https://www.linkedin.com/in/neatet/ Social: https://twitter.com/TheresaNeateLinks and mentionsGetting to Yes – https://www.goodreads.com/en/book/show/313605 Dan Pink’s Drive – https://www.goodreads.com/book/show/6452796-drive Leadership is Language – https://www.goodreads.com/book/show/42774083-leadership-is-language The Coaching Habit – https://www.goodreads.com/book/show/29342515-the-coaching-habit Turn the Ship Around – https://www.goodreads.com/nl/book/show/16158601TranscriptPatrick Kua: Hi everyone. Welcome to the managing managers podcast. I’m really excited to have Theresa Neate with us today. Theresa Neate is an award-winning senior leader with a background in service desk, software delivery, quality engineering and platform developer experience, who loves lean and agility and advocates for holistic system quality and systems thinking. A personal passion of mine as well, so love it. She has an additional side interest in cloud infrastructure and networking and has also written on the subjects including contributing two chapters to a published O’Reilly book. Welcome Theresa to the podcast. Theresa Neate: Thanks Pat! It’s lovely to be here.Patrick Kua: It’s lovely to have you here and you’ve got such an interesting, wide variety of experiences across different parts of tech and I’d love to hear about your leadership journey. So when did you start getting into leadership and maybe, can you remember when you started to manage a team?Theresa Neate: Well my my experience in leadership, as has been in life, has been serendipity more than intentional and it began 10 years into my career, I was elevated into a very very senior role at the time. Wasn’t ready. And I had a catastrophic failure in the role and there was my first attempt at leadership. So I’ll say that, it’s through failing that one learns how to to get better. There’s no easy path. At that particular time I ended up vowing I would never be a leader again. I quite literally disavowed leadership completely and the stress of responsibility, from that point onwards. And all I wanted to do was be an IC (individual contributor) and I was back on the tools and IC again for some time. Then as my comfort in taking responsibility grew, I became far more interested in improving the fate of everyone around me, as opposed to my own fate and that’s where I just naturally grew into leadership some years later. I have not held back since then. I’ve just loved every minute and every step of the way just making lives better.Patrick Kua: That’s a great story and also a common one, particularly that first instance of, as you said, doing this serendipitously. Being thrust into a role, perhaps where it’s like, oh maybe, this isn’t something I really want to do and it can be quite traumatic particularly when organisations and environments don’t provide a lot of support. It’s a very common experience for a lot of people. Then it’s natural then to say, well, I didn’t enjoy that experience. I want to go back to being an IC. But I also love how at some point you noticed the impact you could have by not just focusing on yourself and your work but also helping other people and that natural tendency to fall into leadership roles and more scope. At what point did you then start to perhaps lead or manage other managers?Theresa Neate: It was probably three years ago. In a little bit in REA (Real Estate Australia) group but more so in Slalom as a consultant. By that time I had wholeheartedly and truly embraced my place as a leader at the table. Because I felt like I really belonged now and I really had value to add, I could uplift others in their leadership journeys as well. The more I do it the more I love it. It’s really interesting that you feel so empowered to make people’s lives better and so for three years now. Full time.Patrick Kua: Yeah. That’s amazing. I think it’s also a unique thing for a lot of people who manage managers of wanting to uplift people into that leadership role. I think when I’ve spoken to some people or worked with other people who are managing other managers, they think, well, managers are independent, they don’t need any support. They don’t need that uplifting. I really like that focus that you have on really trying to grow and and help people on that journey as well. Probably a reflection on what was missing for you when you’re in that first-time role as well. Can you tell us a story about how you’ve perhaps grown a leader? What was your general approach and how did that, what did that journey look like?Theresa Neate: You make such a good point there, by the way, on that first stint where I didn’t have support as a leader in the first leadership role. It’s almost like you didn’t have modelling behaviour that was modelled to you that you could then emulate. Thank goodness you learn from your mistakes because you then learn how to lead others and how to model behaviour to them because you know for a fact, they are watching. They’re going to be doing better or worse because of that. But, in answer to your question, it’s really like an awakening where you start seeing potential in people and because you can see potential in people you invest in their ability to think beyond the scope of their current role and the scope of their current…Theresa Neate: Unfortunately people are so output focused, that they don’t embrace outcomes. A leader is about outcomes. It’s a shift. It’s a mental shift and I worked with someone some years ago, about three years ago, who wanted a role that they were not qualified for because they were all about outputs. I provided a coaching plan for them and personally did the coaching and we started talking about their personality style. Their leadership style. Also how to focus on outcomes and how an outcome is actually recognisable as being separate from an output. Having done that, that person to this day is one of the shining examples I give when people ask me for an example, there’s a perfect one who just drank it in like a sponge. And is a really really excellent leader themselves right now.Patrick Kua: What a fantastic result and that difference that you describe of helping people clarify that difference of outcome versus output. When I guess a lot of individual contributors are used to being measured by output. Of activity and keeping busy. As you say, a lot of managers have that style of velocity or points or code or whatever features and they’re not often measured or focused on the conversations around outcome and I think that’s a huge mental shift there. I love that you also put a coaching plan for somebody together as part of the investment in growing them. One thing that I heard you say was around spotting talent or future leaders. What are some things that you look for that give you an indication that somebody might be ready for a leadership or management role?Theresa Neate: There are a few criteria that are almost a deal breaker. Essential criteria that I’ll look for. The first is a growth mindset. So they are continuously seeing situations as learning opportunities as opposed to an end of the road. Their ability to take a bad deck of cards or bad hand of cards that’s been dealt to them, to then turn that around into an opportunity. That is so cool to see that. So, immediately I see potential in someone. I also see potential in someone when they start coaching others. When they show up in the workforce and they volunteer for coaching. Or another example is when they volunteer for recruitment interviews. Can I get involved in the recruitment interviews? They then start showing an interest in building the team around them, whether that be their colleagues, their peers, or somewhere else. All of those indicate enough responsibility and visibility beyond their current predicament or their current constraints. They can see the world outside of their current box. That is heaps of potential right there.Patrick Kua: Yeah, so those are really amazing signs and I recognise that as well in terms of things that I would also look for for people who are ready for that leadership/management role. One thing I’ve noticed of my career is sometimes you have people that say, well, I’m not ready to be a leader because I don’t have the title. And I think the things that you talk about are really about the behaviours before people have that title. I think there are some really good examples there that you articulate. One of the things that you talked about was also investing in people as they grow. So what are other examples of investments that you make? One thing I heard was the coaching plan. What are other things that you think about of investing in new leaders?Theresa Neate: Fundamentally we need to recognise that everyone has their own experiences, backgrounds, shaping moments, leadership style, personality style. Most of us in technology are introverts. And we show up differently. For me, it is about understanding that people are different and they’re not going to show up necessarily like the inspirational CEO of a company. You have to understand that you will find leadership dressed as something else and being able to see that. That by the way, is diversity for me. Is spotting the different personalities and human beings around you. Diversity is not just about gender. It includes approach to work and so forth. So, first thing I do is I get to know people. And I get to understand who they are as individuals. Then they will either tell me directly that they’re interested in leadership or they will just spontaneously start involving themselves in whatever is available to them. I then, depending on how keen they are by the way, because everyone has a different pace as well, have to remember that. Depending on how keen they are I will come up with either a really aggressive plan or just a slow build to what the end result will be and successful. We need to define as part of the plan as well. What the success looks like. I’m so tailored and so adaptive to the situation, that I’m not going to have a one-size fits all for anybody. I will customise whatever the situation is and the individual is, bearing in mind also, people have families, they have after work commitments. They’re not necessarily going to want to spend all their evenings and weekends reading up on stuff. So we’ll make the time available during work hours.Patrick Kua: Great. That’s such a supportive environment and I think the fact that you recognise these differences is also a sign of maturity because I think a lot of people who are successful as a engineering manager or a team lead can do so with their own style. Suddenly, when you’re in these roles you’re dealing with people who have all these different styles and being able to understand these different styles is one thing and then being able to adapt and I see some of that agile, adapting to the environment in you. And to that to the person that you’re leading, thinking about the environment and the things that they need to be successful, I think it’s a great environment that you create for people. One interesting thing that you did talk about was different leadership styles and I know that we all have our certain preferences. Have you had to deal with somebody who had a very different leadership or management style from you and what was that like?Theresa Neate: Yes, I personally have been on a journey too. My own style has changed and adapted. Back to the point of you model the behaviour you see around you. Early in my career, probably one of the reasons I failed, I was quite instructional in my style. I was quite unempowering in my leadership style and the different styles you’ll encounter are everything from coaching people who want to coach, to servant leadership, to democratic leadership, where people all have a say. There are a whole bunch of styles that you can see in the workplace. I tend to want to understand what that person wants to be when I start designing their plan for them. There’s a few things, a few little caveats, I will give them along the way. If someone says I’m a servant leader I will say you realise that that is not apathetic leadership. You are still involved as a leader. You are still showing up. When someone says they want to be a completely democratic leader, I will point out that they will need to be willing and able to make decisions when democracy fails. You want to be as adaptive to your recipient as possible but you also want to be very clear that leadership requires action and it requires direction and vision.Patrick Kua: Absolutely agree. I think one of the biggest challenges I see for new managers is being decisive. Of creating that action and not assuming the team will decide something at some point or thinking about that timebox about when would a decision need to be made. That really resonates with me as well. I also think that that instructive style of leadership is also, I recognise that in myself, in my early leadership career. I think it’s probably one of those things that everyone goes on when everyone is learning. Of being a little bit dogmatic or like, this worked for me so, of course, this is the way that you should do it as well. I think that is a great example of that personal growth journey as well of recognising actually, there are many different ways. It goes back to what you were talking about. As long as the outcome is being reached then the mechanisms of how you do that is less important from that side. Which does raise an interesting question of when you’re managing different teams with people who have different management/leadership styles where do you draw that boundary of what is maybe consistent or ways of things, because if every team is doing everything differently, that makes your life a little bit harder to understand what things to look at or what processes to step into? So do you have any framework that you think of where teams do need to do things that are similar?Theresa Neate: I will draw a line at do no harm. First, do no harm. I will require that whatever you do I will be probably more involved and more invested if I see that you are harming others in the process. So if I see someone who is completely uninvolved and completely too afraid to step up because they’re afraid of harming people, I would be much more willing to coach them and get them over that fear than anyone "
