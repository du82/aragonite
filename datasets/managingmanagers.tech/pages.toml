title = "Episode 26: Building a blameless culture, systems thinking and more with Crystal Hirschorn - The Managing Managers Podcast"
description = "Crystal Hirschorn was influenced by XP, lean and systems thinking and shares how to cultivate a blameless culture, applying systems thinking and so much more."
full_description = "Episode 26: Building a blameless culture, systems thinking and more with Crystal Hirschorn Guest BiographyCrystal is an experienced Engineering Leader having held various VP and Senior Director of Software Engineering roles, with a career spanning more than 20 years in the Technology industry. The majority of her career has been a mixture of technical leadership, hands-on software engineering, and engineering management. She has managed managers for several years. She’s a resilience engineering advocate and long-time practitioner and advocate of Lean, XP, and DevOps practices to build a successful engineering culture.She is currently the CTO at ⁠Zoa⁠ – a green energy tech start up.LinkedIn: ⁠https://www.linkedin.com/in/crystalhirschorn/⁠ Twitter: ⁠https://twitter.com/cfhirschorn⁠Links and mentionsLara Hogan (https://larahogan.me/) and Camille Fournier (https://www.camilletalk.com/) and Charity Majors (https://charity.wtf/)Team Topologies by Matthew Skelton and Manuel Pais https://www.goodreads.com/en/book/show/44135420 An Elegant Puzzle by Will Larson – https://www.goodreads.com/en/book/show/45303387 Lara Hogan’s The feedback equation (https://larahogan.me/blog/feedback-equation/) Atomic Habits by James Clear – https://www.goodreads.com/en/book/show/40121378 TranscriptPatrick Kua: Hi everyone. Welcome back to the Managing Manager’s podcast. Today we have Crystal Hirschorn. Crystal is an experienced engineering leader having held various VP and Senior Director of software engineering roles with a career spanning more than 20 years in the technology industry. The majority of her career has been a mixture of technical leadership, hands-on software engineering and engineering management. She has managed managers for several years. She’s a resilience engineering advocate and long-time practitioner and advocate of Lean, XP, and DevOps practices to build a successful engineering culture. Lots of things very close to my heart. She is currently the VP of Engineering at Zoa – an energy tech start up. Welcome to the podcast, Crystal.Crystal Hirschorn: Hi. Thanks for having me.Patrick Kua: Thank you for joining us. It’s great and I mean you have such a broad experience 20 years in tech. Lots of management there. So maybe you can give us a quick overview of how you found yourself in the management track?Crystal Hirschorn: Sure. I’ll try and keep it brief. 20 years feels like a long time. It is a long time. So I started out as a software engineer, like many of us. I did that for a really long time. In fact I did all sorts of that kind of thing like frontend, backend, platform, infra over those years. But what I found, I think, and probably quite naturally is that I think with a lot of us that move into management is that you want to lead the team. Coach the team and push them to be the best that they can be. So I think that before I became a full-time manager I was finding myself becoming tech lead of multiple teams. In fact, right from my early career. In fact, being a team lead within a few years. And then becoming more like an engineering manager but also a tech lead at the same time. You know back in the day when these roles maybe weren’t so well defined.Patrick Kua: Yeah, everything merged together right.Crystal Hirschorn: A bit of a tech lead. A bit of an engineering manager. And then more formally becoming a full-time engineering manager at the very tail end of my time when I was at the BBC and BBC News. But also still doing some hands-on development there. So I was leading across about 6 or 7 teams I think at the time. Delivering the elections, web and mobile and TV. Even having to work with some of the TV side of the broadcast. That was really cool. Then I felt, yeah, this is probably something I want to go into full time. Then when I went to Conde Nast, which is a couple of companies back, that’s when I fully went into full-time management as a Director of Engineering. Then went from there to VP of Engineering and various other things.Patrick Kua: Great. Can you remember when you first started managing managers? Was that at Conde Nast or I heard you also leading multiple teams at the BBC?Crystal Hirschorn: I think in a technical sense, you would probably say Conde Nast is where it officially happened on the org chart. But I think it definitely happened at the BBC because of the election result. It’s the tier one event of the year right. And so it has to go. It’s almost like… there’s no alternative. I mean we always had backups of what we would do. Backup strategies of failovers and stuff. But the intention is that you don’t have to ever resort to that. So coordination was a big concern there. Obviously to deliver on an election and to have things be in real time on the broadcast and on the web and on mobile. It’s a significant effort. But it’s also working across different disciplines. Like I had to work really closely with editorial there as well as design and ux but also more on the platform’s operations side. Like how are we going to keep this live and stable and make sure that we have the capacity? And even working with our cloud provider to make sure that we had event management teams in place to make sure that everything went smooth. And it did. I did that 3 times in a row in fact,Patrick Kua: Wow!Crystal Hirschorn: But there were like 6 or 7 teams so each had managers.Patrick Kua: Yeah, great.Crystal Hirschorn: It wasn’t officially like I’m their manager. But at least for that event I guess you could say it was.Patrick Kua: Yeah I mean it sounds like there’s a lot of responsibility. And a lot of things that go wrong. And yeah, not something that you can necessarily do by yourself with so many disciplines and really so many things going on with so many different teams. When you were starting to perhaps lead other leaders and manage other managers and you transitioned from being just a lead or a manager of one team, were there any differences that surprised you as you transition to leading other leaders or managing other managers?Crystal Hirschorn: Oh yeah, for sure. There’s a few that I can think of. I think when you’re managing one team, your scope is probably quite a lot more narrow in some ways and you’re focused on having one high performing team. And delivering well. And maybe you’re not tasked with seeing the bigger picture. Whereas definitely delivering on an election, you have to see the whole picture. And you have to know what’s at stake. You have to know how to motivate other managers as well. But also coordinate them in a way that creates alignment and flow essentially. Flow between teams. When you see me present at conferences I talk a lot about things like team topologies and organisational flow. Having been a longtime software engineer before this, there’s just so many things that are translatable in terms of things that made sense as an engineer and now makes sense in a systems thinking capacity. This is how you can create efficient flow through your organisation. I think there was a lot of that thinking happening at the BBC.Crystal Hirschorn: It was my first real foray into that. But it’s funny. I think back to that and think like I’m surprised I wasn’t more daunted sometimes. I just found it quite… I was like this is cool. This is exciting. But also I guess I have an experimentation mindset. Like let’s try this and see if it works and if not we’ll try something different. It’s a bit like that iterative mindset. But yeah, things like that. Like motivating people. That you have to motivate teams. A lot of coaching as well goes into it. I think to create a team of teams culture like where everybody’s high performing. You have to also coach the leaders around you to step up for their teams as well.Patrick Kua: Yeah. I mean I heard a couple of things where it feels like you gravitate naturally towards leading or wanting to have greater impact. And having that background as an engineer helps you perhaps empathise with people at different levels. Either managers who are managing other teams or yourself and individual contributors. Then, as you mentioned, is that more holistic systems thinking. You know what you’re trying to achieve but you can now put all those pieces together and create flow that maybe other people can’t. And it feels like you had a really good experience early on as well as being in that environment where you could be rewarded perhaps for thinking more holistically. Versus here is a team. Work on deliverables in your box and not necessarily see the whole organisation.Crystal Hirschorn: Yeah, definitely. I think not everybody is given that opportunity. So I think I was quite lucky in that regard. Obviously I was given that task to do because somebody must have seen something in me. That they felt confident I could do it. There was obviously a buildup to that point where I was asked to do that. But I have to say, I think it’s also about showing that proactive attitude and also you have to show results. Was I able to lead other teams well? Yes. Was I able to do that across a couple of teams? Yes. OK. Probably can step up into this as well. It’s not like I was there by myself. I think that’s the other key thing I’d say as well as. You figure out who are the other leaders around you. You become a cohort essentially.Crystal Hirschorn: You become the first team mindset. That was, again, probably where that really started baking in for me was… back in those days when I was running those projects was because it’s like, well, if I don’t have the lead on the editorial side, the product side, myself, delivery, UX and design, this is going nowhere. Then also even across to the broadcast side as well. So I think again, it’s quite an interesting thing to teach to other leaders on levels below you as well, when you step into the leadership track, whether that’s on the IC path or manager is your first team is a different team now. And you have to understand what that means for you. I think that’s a thing that’s worth coaching into people.Patrick Kua: That’s great. And the first team concept is something that has popped up many times in these conversations with managers of managers. And today we have quite a lot of extra resources for managers and leaders. bBut probably in your early journey there wasn’t so much. So what were some of the things that helped you transition? One of those things that I heard was that first team of other people and maybe similar or different roles. What other things helped you on your leadership/management journey?Crystal Hirschorn: Sure. I mean so many things. There’s one that I’d like to mention because I think it’s one of those things that probably people don’t mention so much. But having good managers and bad managers is helping.Patrick Kua: Oh yeah.Crystal Hirschorn: Because I think with good managers you are like, what could I replicate? What would I want to be like?And bad managers can tell you what you don’t want to do. You don’t want to be. I think they can both be just as valuable, especially in hindsight. So I think I’ve had a mix of both but some of them have been quite big picture thinkers. Quite aspirational thinkers. But also people who didn’t really see the boundaries. Actually, to be honest, like there’s a couple in particular where I think they really moulded me in quite a big way even today. I tried to tell them that when I saw them. I don’t think they knew how much of an impression they had because again they were quite experimental minded and like no boundaries. Let’s just do it. Let’s just go for it. I happened to be coached by them and to work with them as a manager. The other thing I’d say is like there were resources around. I’ll mention the key ones that were around obviously.Crystal Hirschorn: Lara Hogan and Camille Fournier wrote quite a lot of stuff around engineering management. Even Charity Majors happen to be a pretty important person. Like an inspiration to me anyway. And the way she looks at software engineering. It’s again moulded me quite a bit. Then, much later, was the devops topologies and team topologies stuff. And stuff around systems thinking. I read a lot. That’s one thing I’d say. What is this phrase, “Leaders are readers,” and I think that that’s really key. It’s a daily habit. Like I try to read every day. And try to just educate myself. But I think it’s more than that. For me, it’s more that reading and research is interesting. But I think it’s more interesting to see how it’s put into practice. Because there’s a lot of stuff out there where you think… interesting. I wonder how this would go in practice. And a lot of it sometimes it’s counter to what you would expect. So I think that’s also probably one of the reasons why I like leading organisations and teams. Is just… see what happens.Patrick Kua: Yeah, absolutely. And that really resonates a lot with my own experiences. I still remember when I read the original XP book. Sounds really good, right? But back then it was like a dirty word. Do not talk about agile. Do not talk about XP.Crystal Hirschorn: Yeah. That’s it. Yeah, I didn’t mention that actually. That’s quite a key one. I talked about management. But in terms of my own philosophy around software engineering. Yeah. Lean. I was cast in the days of lean and XP and true agile, as I put it. The early 2000s is when I really started out as a software engineer. And yeah, that had such a huge impact. It still does now. It’s totally the way that I think. I can’t think differently. Basically iterative development and lead time to customers and customer value. That’s all just in my mind all of the time. bBut it’s it’s interesting to take that philosophy and bake that into a culture basically.Patrick Kua: Yeah that’s really exciting. Great. Let’s talk about maybe one of your passions. I heard you say systems thinking and more holistic thinking. I know in your talks, you often talk about sociotechnical systems and how that affects cultures. So maybe for our listeners then how would you describe a sociotechnical system? Why is it relevant to managers?Crystal Hirschorn: Well. I mean particularly as managers we are managing people, right? I mean, at least not yet, the software doesn’t build itself. Systems don’t design themselves. They’re all… honestly they’re all a reflection of how humans think cognitively. Whether we like it or not, what we ship and what we deliver is a reflection of cognitive systems. I do think we have to look at both aspects when we’re designing and building organisations essentially. How does work get delivered? How do we operate the things that we build? How do we scale? We can’t just do one side of the equation. They both have to come together. Again this comes back to the systems thinking.Crystal Hirschorn: There’s the world. There’s the industry. There’s our customers. Then there’s us. You have to take that bigger step back and say, okay, well how do all these things fit together and how do they flow? T"
