title = "Episode 17: A unique leadership journey and avoiding swirl with Sally Lait - The Managing Managers Podcast"
description = "Sally shares her unique journey into tech and how she found herself managing other managers and how to avoid swirl when managing other managers."
full_description = "Episode 17: A unique leadership journey and avoiding swirl with Sally Lait Guest BiographySally Lait is an Engineering Director for Trust & Safety at Bumble Inc. – encouraging kind connections that demonstrate integrity, equality, confidence, and respect during all stages of any relationship, through our apps like Bumble Date, Bumble For Friends, Badoo, Fruitz, Official etc. Prior to that she’s been VP of Engineering at Farewill, led engineering in Operations and Financial Crime as well as Monzo’s web discipline, ran a digital transformation consultancy, and worked for a global digital agency. What’s really important to Sally is building a strong culture, and creating supportive and inclusive environments for people and teams to thrive and do fantastic technical work. She’s a strong advocate for building software and teams alike with empathy, responsibility, and accessibility in mind.Social media links:Website – https://sallylait.com/Mastodon – https://mastodon.social/@sallyLinkedIn – https://www.linkedin.com/in/sallylait/Links and mentionsLara Hogan’s article on calendar defragmentationTranscriptPatrick Kua: Hi everyone. Welcome to the Managing Managers podcast. Today we have Sally Lait. She’s an Engineering Director for Trust & Safety at Bumble Inc. – encouraging kind connections that demonstrate integrity, equality, confidence, and respect during all stages of any relationship, through our apps like Bumble Date, Bumble For Friends, Badoo, Fruitz, Official and more. Prior to that she’s been VP of Engineering at Farewill, led engineering in Operations and Financial Crime as well as Monzo’s web discipline, ran a digital transformation consultancy, and worked for a global digital agency. What’s really important to Sally is building a strong culture, and creating supportive and inclusive environments for people and teams to thrive and do fantastic technical work. She’s a strong advocate for building software and teams alike with empathy, responsibility, and accessibility in mind. Welcome to the podcast Sally.Sally Lait: Thank you very much. It’s great to be here. I know we’ve been talking about this for a while. So it’s great to finally make it happen.Patrick Kua: I’m really excited to talk to you about your story and you’ve got such a fascinating background across the different companies and your experiences, so why don’t you tell us about how you got into tech and how you especially started to get into the leadership or management track.Sally Lait: Absolutely. Yeah, well, it all started out for me when I was hanging out on message boards. Originally back in the day. All the people there, all the cool kids had their own website so that was my spark to get into tech in the first place. I then followed that on because I was thinking about what to do at uni and I knew that I wanted to go and do something related to computers and the internet in particular so I did an internet computing course. But actually had a bit of rubbish time and when I actually started my year in industry I decided to drop out. I instead, did Open University, which started my love of remote as well, interestingly. So I got the paperwork but then I realised I was just learning so much more on the job doing the work day in day out, so I decided to continue working. Basically so I started out as a backend, as a developer at an agency that did a lot of flash work at the time.Patrick Kua: I remember that.Sally Lait: Yeah. Exactly. I think a lot of us do. A lot of us don’t. And yeah, decided to become a bit more generalist as well though because HTML5 really took off. The front end really matured. Became really exciting. And as part of that I eventually moved into a solutions architect role as well and then I got offered the chance to start managing. I think when my manager’s role became available and they approached me to see if I was interested in that and I think a large part of what gave me that opportunity was because I’d focused on really growing my core skills like my communication, my leadership skills as well as the pure tech. So at that point I decided to take the leap and went from there really.Patrick Kua: That’s fantastic. I love how you have a slightly untraditional way into tech and still working in tech which I think is fantastic. I think we need more people to share their stories because I know of so many successful people who haven’t taken that traditional route and still continue to work in tech. So one thing I understand is that you’ve had a baby quite recently. So firstly, congratulations!Sally Lait: Thank you very much.Patrick Kua:And I understand also you went then through a job hunt. So how did you end up in the role that you’re currently in now?Sally Lait: Yeah, it was a period of lots of change in my life. This is my first baby and I’ve always been somebody who’s been really passionate about my career. I really enjoy it. It’s been quite a core part of my identity as well. So when I was thinking about leave and trying to plan and get ready I really didn’t know how I would feel after the baby was born. I didn’t know whether I’d be one of those people that just wanted to come back a couple of weeks afterwards or if I’d want to be off forever and just you know, look after my kids. So I tried to actually keep my mind really open. So we planned for me to be off for the full amount of time and I did take that in the end. But then I was a little bit naive and I had an extra gap between when my child could start nursery and when I needed to go back to work.Sally Lait: So I had been thinking a lot about what I wanted that balance between work and life to be like. So it felt like a really good opportunity to make some changes. So I spoke to my employer at the time and that then I decided to take some interviews and it was definitely a learning experience to be interviewing whilst also caring for a young child. So I wrote a blog post about that. But yeah, the Bumble opportunity really stood out because trust and safety is such an exciting problem space. It’s got some overlaps with my experience and the areas I’ve worked in before, particularly in Monzo. But also just for me the opportunity to work somewhere with very visible women. And not only women, but women parents as well in leadership roles. A lot of the company values hugely resonated with me. It gave me such confidence to make that change. It was a really a period of lots of thinking and lots of introspection. But I couldn’t be happier for having made that change.Patrick Kua: I’m really pleased for you and I think we don’t really talk about parenting and tech that often. I don’t have kids so I can’t really talk about it from my experience. But I remember talking to a friend recently who’s job hunting here in Berlin and there’s not many good interview processes, particularly in startup land for parents. Particularly young children or fresh babies and I think we can definitely do more to support people looking for those sorts of roles and even think about some of those part-time roles which may be more suitable, or you know, be more flexible around some of that as well. But I’d love to hear a bit more about the trust and safety role and your role that you have, so tell us a little bit about what your role is about, what you’re responsible for, what does your current org look like?Sally Lait: Okay, so as trust and safety we basically work across the range of the Bumble Inc brands and we have a mission in our area to help grow kind, healthy and equitable connections by designing and operationalising the safest and the most trusted connections platform in the industry. So I am so lucky that I get to work, I know that everybody always says it’s about their team, but I generally have a fantastic team. So I’m responsible for the tech team. That spans all kinds of different shapes of software engineer, data science, machine learning people and we’ve got engineering managers, data science manager. So in terms of my org structure I’ve got multiple managers reporting into me both directly and indirectly. So I’m not actually managing ICs which is a first me. I’ve usually sort of done a bit of both and had a bit of a mix. And I then report into one of our VPs. He leads our core services and data platform part of the business who then reports him to the CTO. So it’s a part of the business that I’ve played a large role in forming since I’ve come in as well because there’s been lots of expansion. Lots of pulling together the different disciplines. So that’s a really key thing that I’m working on into the future as well.Patrick Kua: Wow. It sounds like a really diverse role and also a lot of touch points across different product lines. Across different teams. I can imagine you’ve got a lot of touch points both with your peers and other people across the business, so what’s your strategy for keeping aligned given the number of touch points you do have across both your organisation and other parts of the business?Sally Lait: I think it’s a super interesting space. We’ve got loads of operational elements and it’s quite similar to the time that I spent at Monzo. I worked in customer operations and financial crime as well. For us cross-functional isn’t just product, engineering and design working together in the classic triangle. It’s everything from our member safety organisation who have folks that work on policies, who have folks who work on the customer support side, the moderation side. We’ve got relationships with legal. We’ve got more traditional relationships as well with people like the Head of Data science on a very across the organisation level. I think it’s so important to me to build those relationships. To build the trust because when we’re working in these problem spaces, it’s never a purely tech solution to a problem. Extremely rarely should I say is it just a pure tech solution. It’s so important to make sure that we’re communicating. That we’ve got visibility. That we’re collaborating. We also have loads of different people in different time zones as well. And because we’ve got multiple officers. Just thinking about how we can actually collaborate has been a really important pillar that I’ve tried to set up and coming into this role and being very deliberate about the rituals, the communication channels, things like that.Sally Lait: So some of my closest peers, people like our product director Michaela, who’s just going out on maternity leave, which is very sad but absolutely thrilled for her. But also just the team that I work with directly is always really important to me so I’m investing lots of time as well trying to help to develop our engineering managers and to give them some of my experience as well. But also just to learn from them because we’ve got people who have such fantastic domain expertise as well. So it’s very much a sort of collaborative effort when it comes to being cross-functional for me.Patrick Kua: Great. I heard there’s some really interesting things that you talked about such as setting up some communication channels and also dealing with lots of time zones.Sally Lait: Yeah.Patrick Kua: So what are some of the things that have worked for you in your organisation? Which channels have you set up and how does that work across the time zones that you’re in?Sally Lait: Well I think whenever you come into businesses that have gone through a lot of change. So we’ve opened offices. We’ve changed the way that we’ve operated. We’ve grown as a company and matured a little bit. It’s great to have pause points and to be quite deliberate about things. So I’m quite a big believer in trying to kill meetings that we don’t need.Patrick Kua: I love it.Sally Lait: As I’m sure a lot of people are. I love the idea of, I think it was first, Lara Hogan that I came across it from, and the idea of the calendar defrag. Taking everything out. Really reassessing what problems you’re trying to solve and who needs to attend. Whether there’s other ways that you can solve that need. And then starting to take those building blocks and put it back in at the right cadence with the right people at the right times. That kind of thing. So a lot of that really fundamental thinking about what are we trying to solve for? What do we need to do? But not only that. Just how can we also build some relationships? How can we not miss out on the nice to haves and the fluffier side of things as well? So being quite deliberate about the cultural side too? I think the other part of it is a very practical stuff of giving visibility at the right times. So things like our reporting channels that we have on slack. Making sure that we have. Are they open? Are they private? Do we have the right people who can collaborate or just come across things and be able to ask questions and things like that and try to foster that culture where that’s possible? So they’re just a few examples. But it’s by no means… the work is never done in this area. I’m sure you’d agreePatrick Kua: Yes.Sally Lait: But it’s something that I really really like getting quite deliberate about.Patrick Kua: Oh great. I love the idea of killing meetings. I can imagine that’s hard because people are used to this. I know in shopify, I think the founder, Tobi is famous for resetting everyone’s calendars at the beginning of the year. That’s quite extreme I think. How did you go about doing it considering that maybe some people really wanted those meetings? How did you broach that subject with people?Sally Lait: Well I think for me, it’s always about getting different people’s requests and looking through it. So I don’t want to be, rightly or wrongly, that’s not how I operate in terms of coming in and sweeping everybody’s calendar out. So for me that was never going to work. I have things that I find set me up for success. But I’m really open to the fact that I might not have seen the best way to do something. So I’ve invited a lot of input from other people in terms of seeing if I could learn from them as well. But I’m also mindful of the fact that when you’re at different levels, so if you’re at a manager of manager’s level, you have a different level of visibility. You have different time pressures and other forums that you’re in generally. Whereas actually when it comes down to things like the team rituals, I’m a lot less opinionated, generally. And so I like to provide some nudges. Some questions. Maybe for the folks to ask themselves some principles that they might want to think about. And again get them thinking a little bit differently about why maybe it’s right to let go of a meeting or why it might be good to consider doing something a little bit differently. But in general it’s a balance for me between me going, hey, folks this is what I would find useful. Here are some things that I think you might find useful. But let’s fill in the gaps together.Patrick Kua: Great. Excellent. Speaking of meetings and time zones for you? What does your time"
