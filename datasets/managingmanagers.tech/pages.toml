title = "Episode 8: Introspection, spotting strengths and building great teams, not just good teams with Tramale Turner - The Managing Managers Podcast"
description = "Guest Biography Tramale is a highly experienced and motivated technical professional and is currently SVP of Engineering at ActionIQ. He has previously worked as CTO at Taxbit and Head of Engineering at Stripe. Prior to Stripe Tramale has held engineering leadership roles at companies such as F5 Networks and Nintendo, and technical and marketing leadership"
full_description = "Episode 8: Introspection, spotting strengths and building great teams, not just good teams with Tramale Turner Guest BiographyTramale is a highly experienced and motivated technical professional and is currently SVP of Engineering at ActionIQ. He has previously worked as CTO at Taxbit and Head of Engineering at Stripe. Prior to Stripe Tramale has held engineering leadership roles at companies such as F5 Networks and Nintendo, and technical and marketing leadership roles at Critical Mass and Volkswagen.He has a passion for developing technology leaders at all levels, and is determined to hear underrepresented voices amplified in our industry.Social media links:Twitter – https://twitter.com/shidoshi LinkedIn – https://www.linkedin.com/in/tramale-turner-31b24a TranscriptPatrick Kua: Welcome to the Managing Managers podcast. I’m your host, Patrick Kua, founder of the Tech Lead Academy and curator of the newsletter for leaders in tech, Level Up. In this podcast, I’m chatting with senior engineering managers, directors, VPs of engineering and others who have walked the path of managing other managers, where we will uncover some great stories and lessons learnt.Let’s get started.Patrick Kua: Hi everyone. Welcome to today’s managing managers podcast. I’m delighted to be joined by Tramale Turner. Tramale is a highly experienced and motivated technical professional and is currently SVP of Engineering at ActionIQ. He has previously worked as CTO at Taxbit and Head of Engineering at Stripe. Prior to Stripe Tramale has held engineering leadership roles at companies such as F5 Networks and Nintendo, and technical and marketing leadership roles at Critical Mass and Volkswagen.He has a passion for developing technology leaders at all levels, and is determined to hear underrepresented voices amplified in our industry.Welcome to the podcast for Tramale.Tramale Turner: Thank you for having me. Really excited to be here.Patrick Kua: So you’ve got such an amazing breadth of so many different roles and also really interesting companies. Everything from things like Nintendo, F5 which I remember as hardware and like networking devices, all the way to really modern SAAS products like Stripe and Taxbit. Tell us a little bit about your leadership journey. How did you find yourself on the management track?Tramale Turner: I think when I first even considered becoming a manager I, of course, didn’t have the I think wealth of knowledge that we have about the practice today especially within engineering. So I considered it a part of the promotion path. I was an individual contributor and I was looking at my career trying to understand or predestined where I might end up one day. What would it mean to be quote unquote successful? So I had the complete wrong perspective as we know today that management is indeed a career change. But suffice to say at that time, what I was really focused on was developing myself, developing my career and when a leadership role became available to me. To be clear I had managed people previously but I had never really considered myself a manager of people if that makes sense. It was more happenstance where I was an individual contributor that like many do, I presumed to be decent at my job and then somehow find myself leading other people without any training or without any coaching or mentoring and ultimately Volkswagen was the the organization where I was actually hired into a management role. The fact is that I was actually an individual contributor with a manager’s title and so I was banded as a manager and I was leveled accordingly.Tramale Turner: The intent was for me to be a contributor and to drive impact through influence. Which was my my very first good lesson in leading people. But to make a very long story as short as possible, ultimately, that was my first foray into really focused leadership and leadership development. One of the things I appreciate about my time at Volkswagen is that there was this scaffolding and really excellent treatment of helping people who were intended to be people leaders or people influencers to develop their skills and their talents to work on introspection. To understand the principles of people leadership and and ultimately I was of course a people leader at Volkswagen as well. But that’s that’s really how my management journey or leadership, perhaps more appropriate, journey began.Patrick Kua: Oh wonderful. That is such a classic story I think of people finding themselves leading or managing others without a lot of support and I’m really pleased you ended up in a place where it sounds like there was quite a lot of support for you to grow and probably also have people around you in similar roles. I can only imagine how big Volkswagen was back then as well. Still very large, but, people in similar roles who could then share and swap experiences. I’m really happy that you had that support at some point early in your leadership management career.Tramale Turner: Indeed. Indeed and you’re correct. It was an organization of 380,000 people I think at that time.Patrick Kua: That’s phenomenal.Tramale Turner: It had its own leadership development institute and all sorts of things that I believe persists to this day. But yes, indeed, I agree with you. It was a phenomenal experience. But and perhaps we’ll get to the conversation later in this discussion. We’ll talk. Though it was a great experience and a great learning for me. Certainly not my favorite job.Patrick Kua: Yeah, every every place has its tradeoffs right?Tramale Turner: That’s right.Patrick Kua: I think the the amazing thing about really large companies is they can invest in large departments like training. At the same time there are tradeoffs that come with that size and scale of momentum I can imagine. Can you remember when you started to manager other managers? At what point was that and what was that transition like for you?Tramale Turner: Yeah I think pretty early on. I think in my management journey I got the opportunity to start hiring other managers. At the tail end of my time at Volkswagen I started to really understand what it meant to scale oneself and to deliver outsized impact through, again, those those motions of influence and direct guidance and having an ability to hopefully find people who were, quite frankly, more adept at certain aspects of what the organization needed than you could be. As I left Volkswagen and went to my my next career inflection and perhaps a quick side note. One of the interesting things perhaps about my career is that in addition to being an engineering leader and individual contributor within engineering, I’ve also been a marketer. So I’ve been an account director twice in my career and when I left Volkswagen as an engineer I went to an agency as an account director. As an account director, I was managing account managers and other contributors within the the agency’s framework. That was really interesting. It was a very different type of environment. Very different type of education.But I think the the leadership journey was quite frankly very similar to the the overarching principles that we expect when leading other leaders and helping those leaders to understand what the the execution mode for the organization is. Whether it’s the thing that we all here collaboratively really intend on delivering. Getting that focus on. What is the organizational bound? What is the north star? As we might say. How do we coalesce and build a structure so that we might be able to better do that and to serve the needs of our our users or our customers or our clients or whatever that you may be using as efficiently and effectively as possible? That foray from Volkswagen into account directorship and then I think springing forth from there, once that happened, I don’t think I ever really stopped managing managers and have been thus, doing so, perhaps some for the better part of 14 or 15 years now.Patrick Kua: That’s really impressive. I think out of a lot of the things that you said there’s quite a few things I’d love to unpack. I heard there’s a few things around scaling oneself and I’d love to dive into that a little bit more. About your approach to hiring other managers because I think that’s an interesting challenge for people who have to manage other managers. And then also that transition to working in an agency which I can imagine is a very different environment. Different characters. But maybe let’s go to the first part around scaling yourself. This is what leaders do. What’s your take on this as you were on that journey? What were some things that you reminded yourself of how do you learn to scale yourself? What does that mean practically for you?Tramale Turner: Yeah. I think the most important thing when we start having this conversation. The most axiomatic fundamental principle is, what is it that you know? What are you good at? What are the things that drive you? Motivate you? That you want to accomplish within the context of the organization or whatever situation they may may be? What does that really, if again, to borrow from what you just said, if you start to unpack those things about yourself, what does that really mean? You need to do it in order to understand deeply those different principles. And that is introspection from my perspective. That you must be deeply aware. I think leaders of all levels need to be able to do this, but you must be deeply aware of what your strengths are, what your opportunities for improvement are, how you are perceived when you present yourself. Even your body language and how you start to show up in front of others, all of those things are really critical. What you start to understand is what your limitations are. And what your limitations are again within the bounds in the context of the thing that you’re trying to do. Of course we are talking about engineering leaders principally here and in that context of building great software, building great tools, building great experiences such that they resonate with others and that you are able to continue to grow.Tramale Turner: Hopefully with a successful or even if you’re regressing to the mean of mediocrity, you’re still trying to fight for success and drive towards some modicum of being able to sustain or grow the organization that you’re in. You can’t do that alone. We all know that the most important things in any endeavor are capital. You have to be able to fund your endeavors. And people. You need people that can specialize. That can optimize. That can drive. That can help grow your organization and no one can do it alone. When I started to make that inflection and started to make that transition to managing others, one of the things beyond introspection that I learned is that you gotta be able to build great teams. Not good teams. I think that’s a really important delineation. Anyone can build a good team. You find folks who are competent, capable, excited, bring them on. What you will find is that can often be a failure mode because you are, in some ways, I don’t want to make it sound pejorative, and say that you’re compromising per se, but you are perhaps not seeking to drive the outcomes for your organization beyond what even you can perceive. And I think when you take a step back and you holistically look at the problem that you have or the opportunity, perhaps better said, you have in front of you, what you start to realize is that oh, I don’t want just folks who are good at their job and who are perhaps excited to to be in this space.Tramale Turner: I want people who are driven. Who are, to use a controversial word, passionate, who have this expectation that they along with the the first team, that hopefully you can build with them, are going to do things unexpected and outsized and things that will drive the organization well beyond where, again, it even believes it can go. That’s a great team. If you’re laser focused on building something like that then I think that you are able to overcome all of the different obstacles, vacillations the peaks and valleys that running an organization will entail. But I’ll stop there so that we can we can go deeper into any space you like.Patrick Kua: Yeah, now that’s great and really resonates as well. Maybe I’m biased because I like that strengths-based focus. I think one of those things that can identify with you, is as you said, self-awareness of what you’re good at and also where your gaps are, and to understand what is needed in that situation. And then also to start to identify the strengths in other people to understand how they work well as a great team and the opportunities that you can bring as well. So I really love that approach. You talked about that hiring of managers and I think that’s an interesting question because I think a lot of people as I transitioned into being a manager and let’s talk about engineering managers, since that’s the general target audience I’m talking to here, what makes a great engineering manager for you and how do you hire for that?Tramale Turner: Yeah I think managing managers is an interesting abstraction because if you are in a certain context, let’s say a small startup. A new bootstrap organization. Something that’s you know, maybe maximum 50 to 70 people or so, the context you’re going to be operating in is very different and managing managers in that situation may mean that you, as a director, or you as a VP Eng are still actively contributing. But there is a failure mode there. There is typically, many of us in this industry find our way to the path, the manager’s path, to borrow from Camille Fournier, is through being an excellent individual contributor. It’s often difficult for folks who have traveled the path of being deeply invested in building experiences for folks to building people. When that dichotomy of what is the difference between building software and building people? When you’re faced with that question and the conundrum, it’s difficult because there are a ton of books and experiential features that allow us to to build our skills as engineers and indeed, working right in front of the computer, it’s somewhat special because it’s a creative pursuit. I liken it to just about any other creative pursuit. Where you may be a musician, a painter, a writer. But you can go deeply into the practice and develop your skills at your pace and in a way that helps you Manage your own way of learning and growing and development. When you’re dealing with people that’s quite different. Because people won’t wait for you to be good as a manager.Patrick Kua: Absolutely not. They won’t.Tramale Turner: They will not. You need to understand that the context is very different. So again to to go back to where I began, when you’re in a small organization, understanding that yes, you may need to still contribute because that’s just what the size of your organization requires. But you need to also understand that you lik"
