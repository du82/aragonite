title = "Episode 19: Finding a manager of managers role with Dr Claire Knight - The Managing Managers Podcast"
description = "This episode covers how other managers approach problems differently, benefits of an external coach, having a physical outlet to balance out stress and more."
full_description = "Episode 19: Finding a manager of managers role with Dr Claire Knight Guest BiographyDr Claire Knight is a Senior Director of Engineering; Ecosystem & Emerging Products at Netlify. She served plenty of time in the coal code mine before making the move into wrangling folks rather than just bits. With many years of engineering leadership at companies such as GitHub and Six to Start, Claire now leads many engineering teams at Netlify, defines strategy and expansion, with particular focus on the platform and SDK. Claire lives in Barkshire, UK, with her husband and three cats who from time to time also like to be involved in video calls. When not working, she likes to lift heavy things, only to put them down again and is a 2023 AWPC World Champion Powerlifter.Social media links:Linkedin – https://www.linkedin.com/in/ckclaireknight/ Twitter –https://twitter.com/krider2010 Threads – https://www.threads.net/@krider2010 Instagram – https://www.instagram.com/krider2010 Mastodon – https://hachyderm.io/@krider2010Links and mentionsAnnie Duke’s Thinking in Bets – https://www.goodreads.com/book/show/35957157-thinking-in-bets Camille Fournier’s The Managers’ Path – https://www.goodreads.com/book/show/33369254-the-manager-s-pathTranscriptPatrick Kua: Hi everyone. Welcome to the Managing Managers podcast and I’m delighted to have Dr Claire Knight today. Dr Claire Knight is a Director of Engineering; Ecosystem & Emerging Products at Netlify. She served plenty of time in the coal code mine before making the move into wrangling folks rather than just bits. With many years of engineering leadership at companies such as GitHub and Six to Start, Claire now leads many engineering teams at Netlify, defines strategy and expansion, with particular focus on their platform and SDK. Claire lives in Berkshire, UK, with her husband and three cats, who from time to time also like to be involved in video calls. When not working, she likes to lift heavy things, only to put them down again and is a 2023 AWPC World Champion Powerlifter. Welcome to the podcast.Claire Knight: Thank you very much for having me. Great to be here.Patrick Kua: Wonderful. You’ve got such an amazing history and diverse career in tech. I love that. If I understand it right, one of the first things that you were doing was typing in and contributing code to printed magazines. So that’s quite a history. Tell us how you ended up in the management track.Claire Knight: Yeah, yeah. So yeah, just showing my age there with the printed magazines when we had to go buy them and type them in. They weren’t even, yeah, well, maybe we had tapes. We had tapes for some stuff. I ended up in the management track almost accidentally although I absolutely love being here now, otherwise I wouldn’t have made this my career. But it was case of almost stepping into the voids that existed in some companies and realising there’s a combination and there’s different skills obviously, but combination of project management and being able to perceive how people are feeling and behaving and trying to share that upwards and a bunch of those things at various sizes of company that honestly made me go, you know what? I can see these people doing really cool tech stuff and I’m not going to get there anymore. I’m not motivated enough to learn the bits I need. But I am motivated enough to learn all of these things around how do I do people stuff? How I handle this ambiguity. What does taking a chance mean when you’re managing people versus, ok, let’s deploy this code and see what happens? So that’s a super high level version of that. But yeah, I’ve been involved since I was a teen because my Dad was in mainframes back in the day. So he got one of the early Amstrads. So that’s how I started out.Patrick Kua: Well, that’s quite a lot of history. I do remember, at least with a Commodore 64, typing some stuff in with cassettes. But I didn’t get to play with an Amstrad.Claire Knight: We were super fancy. We had the one with the three inch disc thing that it had as well as the tape player.Patrick Kua: Oh great, excellent. So given that you’ve been in management for a while, can you remember when you made that transition from managing individual contributors or managing a team to managing other managers?Claire Knight: Yeah, that was only three years ago. So it’s not that, compared to my early history, it is not that long ago. I think it came about because, well, I sought the growth. It was one step of it because I’ve gotten to the point where I might, OK, I’d done my team. The team is executing really well. Everything’s moving along. I don’t really have major worries. Usual things. Every quarter of the planning stuff. Then I’m like, I don’t have enough to do. I didn’t see the opportunity to get that where I was. So that’s when I started exploring that. I certainly can’t say I’ve enough to do now. I have plenty to do. I’m not good at being bored. It was a case of, okay, I’ve done it a few times now. I’ve got a team running smoothly. The day to day of running a team. I feel comfortable with it and I personally wanted more of a challenge. Much like engineers want to progress. I wanted to progress in a different way. Then I got that opportunity. It’s definitely different, managing managers and having to worry about multiple teams rather than just one.Patrick Kua: Great. And can you tell us a little bit more about how you got that opportunity? Was it an internal transition? Was it an external transition? How did you find out about that and how do you then end up in that role?Claire Knight: It was a bit of both. I can’t stop being an engineer. It depends. It was a case of where I’ve been given a cross-team initiative by my skip to challenge me and have growth. And actually that went really well. I enjoyed having then more to do, as I said. Then when that was coming to an end, I’m, well what now? So then, when I was looking for other roles, I was looking for that next step up. I know some people say don’t job hop. Do it internally if you can. But I’d done it internally. I just hadn’t got the official title. So I’d already figured out how to do a bit more stakeholder management. A bit more cross company collaboration. That kind of thing.Claire Knight: So then when I went looking for my next role I was able to get one where it was, hey you’re gonna come in, you’ll have two teams. I actually merged them back into one temporarily because I can’t be in multiple ceremonies all of the time. Then hire managers and grow this thing out back when we were all exploding in growth unlike now. So that’s how it went. By that metric I succeeded in the sense that I went from 10 people and one team, through to 4 with 25, I think it was, by the time I left.Patrick Kua: That’s great. Yeah, and it’s great that you had that informal experience. Maybe without the official title. Had some chance to build up some of those skills. I heard leading across the organisation, cross-departmental and probably having to influence quite a lot. When you did transition into that formal role and it sounds like in a new company context, what surprised you about the difference of managing managers versus managing individuals?Claire Knight: I’d already learnt the overall scene I got from an engineering perspective. About one of my very early learnings as a mid-level developer, my tech lead said to me, there’s nothing wrong with this person’s PR. It’s just not how you would have done it. That has truly stuck with me for the last fifteen years. I had to remind myself about that because I might have done something a bit faster or something else a bit slower, or I would have planned it differently. And I’ve had to learn to let people be themselves in how they manage because everybody has their own style. For me to make them clones of me is not ideal at all.Claire Knight: So that was something that was interesting for me. And for people that you hire in you can screen for characteristics that you look for. But when you inherit managers you have to learn their working style. Learn What they’re doing. And course correction is different. I think with an engineering thing, it’s like not this PR is broken, but like I think we need to move more in this direction. Again it’s more influence than telling or trying to get them to see the benefit and I would say that definitely having a coach has helped me accelerate that perspective on things.Patrick Kua: Great. Can you tell us more about your coach? Is this an internal coach? Or is this external coach that’s independent from the company that you’re working with?Claire Knight: It’s external. Yeah. I’ve had a break for a while. I had it when I was going into senior manager and then I’ve had it again now I’m officially a director. I’ve definitely had mentors internally within companies. I’ve reached out to people above me and alongside me. But having somebody external means they’ve got no skin in the game in the conversations. That allows you to maybe be a bit more honest about certain things or to even vent honestly. Sometimes that’s what you need.Patrick Kua: Yeah, absolutely. I mean a common theme I hear talking to people in your role is that loneliness. It’s difficult to be open with some themes, as you say. Maybe it’s involving some of your team or a peer. And you’re worried about how that might affect some of your relationships. And having that external definitely gives you that independent space and as you said, a good opportunity to vent or rant sometimes. Heavily needed.Claire Knight: And interestingly in one situation, about six months ago, it was a case of you need to use more mouth words. Like you need to speak up here. I’m like, oh okay. I was almost playing it too nice. I needed to get my point across in a different way.Patrick Kua: Got it. Excellent and then with your coach, that’s a great aspect of having some support. As you stepped into that formal role of managing other managers, what other elements would you describe as part of your support network or your support structure?Claire Knight: I definitely keep in contact with engineering leaders at other companies I’ve worked at. Not all of them, all of the time. tThat will be a bit weird. But yeah, in a few, X slacks where we talk or occasionally hop on a call. I do find that very very valuable because, again, they’re outside of my day-to-day. But also exactly the sorts of problems I might be facing and the people side of it in a general sense. So that’s been invaluable. You mentioned in the intro actually about powerlifting, that is one of the ways I cope. That’s where I go to switch off. That’s my mental health break. As well as a physical health break.Patrick Kua: That’s great. How many days a week are you training? Or is it different, I guess, as you head into competition time?Claire Knight: No, it’s generally three days a week. Because I’m doing big lifts. We’ve already alluded to my age with typing and programs, so recovery and everything else is a little bit slower the older you are. So you just have to be smarter about how you do it. But yeah, those three days, at least for those 3 hours, I absolutely can’t think about work because I’m having to focus very hard on exactly what I’m doing otherwise I’ll hurt myself.Patrick Kua: Yeah, absolutely. It’s great to have that physical distraction versus the other mental distraction of other hobbies. So I think that’s a great balance of activities.Claire Knight: Yeah. You get the… I know not everybody enjoys exercise but this is one form that I do enjoy. I definitely say do something you enjoy. I also get the endorphins from exercise as well. I do feel that taking that break and then get back online doing some work, I can be really quite productive in those afternoons.Patrick Kua: Excellent. Was that a hobby that you started picking up as you started to move into management or is it something that you’ve always been doing?Claire Knight: I came to it later in life. I think I always wanted to. I played with it a little bit years ago. But it’s an intimidating place up until you get a certain level of confidence and then you’re just, like, I don’t care anymore. I had a coach that did kettlebell type stuff and then I got into that and I’m, like, actually I really enjoyed the barbell stuff more. I enjoy the process more. Earlier this year I changed coaches to powerlifting specific. Everybody thinks you get to a certain level, you know it all. You don’t. You have to talk to people. You have to learn from other people.Patrick Kua: Yeah, there is always some aspect that you learn from different people. Personally I’ve also just found that just having a different perspective is also good right? You have people that are focused on one element and maybe you try somebody else and you actually get a very different perspective.Claire Knight: Yeah. It’s been an interesting path but one that I’ve stuck with this for nearly two years now. I’m on a three day a week cycle. I enjoy the process. That’s what’s important to me. If I don’t enjoy the process I’m not going to turn up am I?Patrick Kua: Yeah, absolutely. It’s a bit like a lot of work. If you don’t enjoy the environment, it’s hard to turn up. That gives us a good pivot point into your current role then, as director of engineering at Netlify. Can you tell us a little bit about what your org structure looks like?Claire Knight: Yeah. So I’ve got four/five, depending on your definition, teams under me at the moment. I have a product counterpart and each of my EMs has a product counterpart. So it’s a fairly standard hierarchical tree. Myself and my product counterpart report into the SVP of Engineering. Standard engineering hierarchy that you’ve probably seen in a bunch of places. Design and docs and things are adjacent. They’re not embedded within the teams because they’re a smaller team serving all of engineering. But I’ve got all of the engineering and product stuff so they work together.Patrick Kua: Excellent. And how many peers, in terms of perhaps, other engineering directors do you have?Claire Knight: Five. There’s a couple of folks that I don’t interact with as much just because of where my area is and what it does. But then there’s others that I do talk to more. Although we speak at least monthly. But there’s some that get the daily pings on slack that kind of thing. I also work closely with my product peer. He and I will talk about a bunch of things.Patrick Kua: Yeah, excellent. Let’s talk about maybe some of the ceremonies then. So can you tell us a little bit about the ceremonies that you run with your team in terms of, I’m guessing, EMs? What ceremonies do you run with your product counterpart?Claire Knight: Yeah, so I try to have a staff meeting for each person. Because I think talking about people’s issues and individuals sometimes needs to be distinct from let’s talk about Q4 planning or whatever the other conversations would be. Also again it’s trying to keep those conver"
