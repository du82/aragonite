title = "Episode 23: The many flavours of managing managers with Maggie Litton - The Managing Managers Podcast"
description = "In this podcast episode, Maggie Litton highlights the wide variety of managing manager roles in different companies and contexts."
full_description = "Episode 23: The many flavours of managing managers with Maggie Litton Guest BiographyMaggie loves building organisations that enable people to do useful things. She’s worked at Fortune 500 enterprises and startups of all stages. She specialises in optimising remote organisations and reducing accidental complexity. Maggie is currently Director of Engineering at HashiCorp.Social media links:LinkedIn: https://www.linkedin.com/in/maggielitton/ Email: maggielitton@gmail.comLinks and mentionsGood Strategy, Bad Strategy – https://www.goodreads.com/en/book/show/11721966 When the movie isn’t like the book: failure modes in strategic alignment: https://leaddev.com/videos/when-movie-isnt-book-failure-modes-strategic-alignmentTranscriptPatrick Kua: Hi everyone. Welcome to the managing managers podcast. Today we have Maggie Litton. Maggie loves building organisations that enable people to do useful things. She’s worked at Fortune 500 enterprises and startups of all stages. She specialises in optimising remote organisations and reducing accidental complexity and is currently director of engineering at HashiCorp. Welcome to the podcast.Maggie Litton: Thank you! Thanks so much Pat for having me.Patrick Kua: It’s great to have you on and I’d love to hear about your leadership journey. Tell us about how you ended up in management.Maggie Litton: Sure. I would say that it’s an accident. bBut it’s probably more an accident that I ended up in the tech industry. Not so much an accident that I ended up in management because the IC path was not going to be a very long one for me, given my background. Like I said I landed in the tech industry by accident. My programming skills were very self-taught and haphazard. If I was really gonna be serious about an IC career I would have needed to go back to school, get some more formal training. At that point in my life I’d already been through 3 different college degrees and I just didn’t want to do that. So management was just an easier path for me. Also my first job was at a small startup and nobody else wanted to do the management and nobody else really had any training or experience doing it. And I did at that point. In a former life I had been a manager at a couple of different places. So I filled a need there that nobody else was filling at the time.Maggie Litton: But really I think the two biggest reasons that drove me personally into it were… First of all wanting to know what the hell was going on. I felt like going into management was maybe the best or only way to really figure out where is this coming from? How do all these pieces fit together? Turns out I think I was right about that. And lastly I had a really strong desire to make things less stupid. I find especially as things get bigger, there’s a tendency for things to get stupid. You have to make compromises and I really wanted to try to be more thoughtful about those kinds of things or at least understand what is at the source of the stupidity.Patrick Kua: Yeah I mean it’s such a great example and fantastic that you’ve had a great career without needing to be an individual contributor. I think we have such a great place for people who come from so many different backgrounds and can be really successful. So I think that’s a really good demonstration of that. And what I heard there in terms of the two motives of, as you said, or what I heard, the seeing the overview. Or seeing a bigger picture. I think that’s definitely something that a lot of leaders and managers appreciate. But also that other side of as you said is a bit less stupid. I love the phrase and, you know, I was talking to a leader recently about the moving towards a mean of mediocrity. I think that’s such a great opportunity as a manager of either understanding what’s causing that or also being able to influence that. That’s really fantastic. It sounds also like your team was probably very lucky to have you. Somebody who was an experienced manager versus some poor IC thrown into it who don’t have any of those skills.Maggie Litton: Well I was very lucky to have them as well. I want to say that. I feel very grateful for that opportunity. That career change that really did send me in a completely different direction.Patrick Kua: Great. Excellent! So I understand a little bit about how you got into management. Maybe you could talk about how you ended up being a director? So what happened there if you can remember back to your first time?Maggie Litton: Sure. So I think really it was a lot of time spent in management roles. Which led to a lot of pattern matching abilities for me. Once I had done that at a number of different places with a number of different stages, naturally some of those companies themselves started to grow. And my career grew with them. So my first director roles tended to be at places where I might have started out as a manager but the company grew. We grew and divided teams and suddenly it was bigger. Then I moved from there to being a director at companies that were so small that really the line between director and manager was probably pretty fuzzy. From there I moved on to companies where I really was getting director roles in orgs that were already big enough to need a director and I wasn’t coming in as a manager and growing with the company. Does that answer the question?Patrick Kua: Yeah. Absolutely. I’ve talked to a number of people, particularly in rapid growth environments and that’s a very common journey. I think where everyone’s growing. So we need somebody who can manage other managers all of a sudden. I find it fascinating because you’ve played a director role in several different companies. And it’d be interesting to hear if you think about some of those differences of the director role across those companies, what are some differences that stand out for you?Maggie Litton: Yeah. That’s a great question, actually. It has been quite different. So at the first couple of director roles I had, like I said, were very small startups. By that, I mean, there were less than definitely 50 people in engineering. In some cases maybe less than 50 people at the entire company. Initially at least. The fabulous thing about being a director at that stage is just the autonomy I had. I could just do stuff. I didn’t have to ask. I could put things in place without a lot of consensus building. That part was fabulous. It was also sometimes tiring to have to constantly be building the road in front of you. Not necessarily reinventing the wheel. Building the wheel constantly because you have nothing when you’re that small. There was also the anxiety of just being at such a small company where you don’t know if it’s going to work out yet. There were times when we didn’t know if we were gonna make payroll next month.Maggie Litton: Then later on in my career probably one of the most unique roles I had and one of the biggest learning experiences for me was being a director at a smallish startup that was not really engineering centric. That was really the first and only time I had worked at a place like that. It was very educational for me because in hindsight I feel like I was not the right leader for that organisation. I was too engineering-centric. To give you an example of what I mean by that I can remember one of the major tasks we had was to move an app that had been running on-prem. And by on-prem I really mean like on a single person’s laptop. And turning that into a service running on AWS. And colleagues in other departments like marketing or finance or sales asking me totally legitimate questions like, “What is the cloud? What does that mean? Why does this need to be in the cloud?” And I did not do a good job answering those questions.Maggie Litton: I had never been asked questions that fundamental I guess before. I did a disservice to my fellow directors and executives because I don’t feel like I did a good enough job answering their questions and I think that led to me being very well liked and respected within my own department and being distrusted is probably too strong a word but I think people outside of engineering were wary of engineering because we seemed like a black box that they didn’t understand. In retrospect I think I also did not have a solid enough understanding of how was engineering and technology going to fit into the business plan for that company. As engineers, obviously we really thought we were central. Everything about that company. And in retrospect, I don’t think that company was a tech company. It was very useful though to be some place where you’re not the centre of attention. I think I learned a lot from that. I also had the luxury and the fabulous opportunity of being at a successful SaaS startup in a hypergrowth phase. The joys of working somewhere with product market fit that is growing.Patrick Kua: So exciting.Maggie Litton: Yeah. It’s amazing and it was such a relief to be in that position. In that phase it’s both overwhelming because you are growing really quickly. Things are changing all the time. You never quite have enough structure in place to handle the level of activity going on. I spent a lot of time hiring there. A lot of time doing org design for really the first time because I had an org that was big enough to need that. I’m a huge fan of a team topologies philosophy at that time and had a lot of opportunities to experiment, excuse me, with different team structures in that organisation. So that was a lot of fun.Maggie Litton: Now at HashiCorp. I’m at a public company for the first time in a really really long time. And depending on your perspective, maybe it’s a mid-sized company. It feels like a mid-size company to me. Compared to places I’ve been more recently. It is very different to be at a public company again. It’s also different to be in a place that is not in a hypergrowth phase. In fact, this is the first place I’ve been in a long time where we’ve been through a round of downsizing and the focus is more on how do we make the folks that we did hire over the last few years productive when working on a gnarly legacy system that we’re trying to rearchitect on the fly. So more about how do we onboard people so that they can be effective? How do we introduce, say the staff engineer role, which my org did not have? So it’s a bit of a mix of putting new things in place like the staff engineer role, while also having a lot of the basic corporate structures in place already. So a mix of both.Patrick Kua: That’s fantastic. And thank you for the sort of contrasting different experiences. Giving us that sample of what it’s like to be in a place that’s not so much of a tech company retrospectively but lots of great learnings. And thank you for sharing those experiences there all the way to the hypergrowth scaling to what you describe now as the public company where I can imagine there’s the normal rhythm and routine, given that there are expectations from public companies to fulfil and their duties also to the public. So great extreme and a big variety of different experiences. So thank you for sharing. Let’s talk about your current organisation then. So maybe you can explain a little bit about the shape of your current org structure?Maggie Litton: Sure. So HashiCorp works with what they call an EPD triad and that’s Eng-Product-Design. So each of our product lines really consists of the 3 leaders from those groups working together in a tight organisation. My org right now is about 35 people or so. It’s 4 engineering teams. I have 4 line managers and 4 ICs reporting to me. Those ICs are a mix of staff and principal level engineers. We are a remote first org, which has been the norm in my career honestly. I’ve almost always worked at remote first places. And my org is almost entirely located in North America so although we are remote, the time zone spread is not too wide compared to the other places. And my org works on a product called Consul which has both a self-managed flavour and a cloud version. I work primarily with the self-managed product right now but the goal is to morph that into a much more cloud based business over time.Patrick Kua: Great. That’s a really clear crystal picture. I can imagine what your organisation looks like. And with the EPD or engineering, product, design, so outside of those other roles, product and design, who are other people who would consider maybe peers and who do you interact with outside of that trio in your group?Maggie Litton: Sure. The folks that I work with the most are probably my peers in the customer support organisation. Definitely. Because obviously we’re trying to stay in touch with what customers are doing with the product. What issues are they having that helps inform what we need to do better within engineering. Also definitely the head of what we call our SME group subject matter experts. These are really a mix of folks who are in the field organisation in some capacity. So biz development. Might be a solutions engineer. Or solutions architect. Sales. Things like that. I work pretty closely with my counterparts there as well. Partly because Consul… it’s been around a while but it has gone through some pivots in its life as a product. I find that we’re in a phase right now where we’re really having to reintroduce the field org to the product. So we want to make sure that people understand it. They know how to use it. They know how to tell a good story about it.Patrick Kua: Great. Excellent! Very crystal clear picture. Thank you. I find it really fascinating and I think it’s really good that your team is really connected to customer services. And also I guess the full lifecycle. Everything from business development to field people to the people who are using it and I think that’s such a healthy place that many organisations aspire to but many organisations don’t get to. So I think that’s a great place that your group is in.Maggie Litton: Yeah I have to say that that’s probably the closest I’ve worked. Particularly with field organisations of anywhere in my career. I have found that very rewarding. It hasn’t always been rewarding in other places. It’s sometimes a source of tension and I feel really good about that relationship in my current role. So that’s been a pleasure.Patrick Kua: That’s fantastic. Maybe going to the topic of managing managers. So what’s maybe a current challenge that you have or you own as a director and not something that one of your engineering managers would take? So just help us understand what you’re maybe responsible for that maybe one of your EMs aren’t?Maggie Litton: Sure. A great example is we recently needed to overhaul our on-call practices and incident response. We had things in place. But honestly it was primarily just a couple of the engineers who’d worked on the product longest being over relied on. Basically. So we really needed to professionalise our on-call support. I tried coaching my EMs on that initially because I wanted to "
