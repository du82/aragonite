title = "Episode 30: Measuring productivity with Laura Tacho - The Managing Managers Podcast"
description = "Guest Biography Laura Tacho is CTO at DX, a developer experience company. She’s been building developer tools and working on improving developer productivity for over 10 years, all the way from the heyday of IaaS and PaaS on cloud, through Docker and containers, CI/CD, and now as part of DX. She’s also an executive coach"
full_description = "Episode 30: Measuring productivity with Laura Tacho Guest BiographyLaura Tacho is CTO at DX, a developer experience company. She’s been building developer tools and working on improving developer productivity for over 10 years, all the way from the heyday of IaaS and PaaS on cloud, through Docker and containers, CI/CD, and now as part of DX. She’s also an executive coach for engineering leaders and an expert in building world-class engineering organisations that consistently deliver outstanding results. Laura has coached CTOs and other engineering leaders from startups to the Fortune 500, and also facilitates a popular course on metrics and engineering team performance.LinkedIn: https://www.linkedin.com/in/lauratacho/ Twitter: https://x.com/rhein_wein Website: https://lauratacho.com/ Links and mentionsDORA metrics come from the Accelerate book – https://itrevolution.com/product/accelerate/ The SPACE of Developer Productivity paper – ​​https://queue.acm.org/detail.cfm?id=3454124DevEx: What Actually Drives Productivity: The developer-centric approach to measuring and improving productivity paper – https://dl.acm.org/doi/10.1145/3595878 Measuring developer productivity with the DX Core 4 – https://getdx.com/research/measuring-developer-productivity-with-the-dx-core-4/ TranscriptPatrick Kua: Hi, everyone. Welcome back to the Managing Managers podcast. Today, I’m delighted to have Laura Tacho as our guest today. Laura Tacho is the CTO at DX, a developer experience company. She has been building developer tools and working on improving developer productivity for over 10 years, all the way from the heyday of IaaS and PaaS on cloud, through Docker and containers, CI/CD, and now as part of DX.Patrick Kua: She is also an executive coach for engineering leaders and an expert in building world-class engineering organisations that consistently deliver outstanding results. Laura has coached CTOs and other engineering leaders from startups to the Fortune 500, and also facilitates a popular course on metrics and engineering team performance. Welcome to the podcast, Laura.Laura Tacho: Hi, Pat. So great to be here.Patrick Kua: It’s great to have you on and we have lots of interesting topics to talk about, I think today. But I’d love to hear just a short overview of perhaps your leadership journey and what you’re up to day to day today.Laura Tacho: Yeah, you know. I was thinking about this because I often don’t think about where it all began. I was thinking about when did I actually have my first direct report? And I realised I had not acknowledged that I, in fact, as a very recent college grad, had my first direct report. I was a video editor. I had one or two people reporting to me. But I think back to that time and think, man, what a beautiful time that I didn’t know and I didn’t know.Patrick Kua: Lovely.Laura Tacho: I can’t imagine it. Needless to say, I took a break from managing people because I went deep into individual contributor. I, as you said, in that very lovely intro, have been in engineering for a long time, but working a lot in developer tooling for the last 12, 13 years. I was working at HP Cloud back when they had a public cloud. And then this interesting thing called Docker came on the scene.Patrick Kua: It changed a lot.Laura Tacho: It did. It changed a lot of things.Laura Tacho: So I started working on open source tooling. Developer tooling for Docker and my leadership journey really started there because in addition to project leadership, there was also a community aspect of it. Of being a community leader and figuring out a way to bring people together to solve interesting problems. So at that time, I didn’t have any formal reporting lines into me, but was really exercising a lot of those leadership, not management, but leadership skills. And then later on, a few years later, I became a manager-manager. And since then, I’ve been responsible for managing teams, teams of teams, lots of different levels of teams, different sizes.Laura Tacho: And now I’ve landed at DX, which is really exciting because one thing I really enjoy about DX is getting the breadth of scope into our partner companies and being able to see how leadership works there. Being a partner for their executive team, their directors of platform engineering, whoever it is that we’re working with. That’s been very rewarding. It’s also my first role as CTO, which is very exciting for me.Patrick Kua: Very exciting.Laura Tacho: I was really, really happy to join. It’s been a year already almost.Patrick Kua: Wow, congratulations! Time goes by really quickly.Laura Tacho: Thank you. It really does. It really does.Patrick Kua: Excellent. We’ll come back to DX. I think that’s really interesting, particularly with developer metrics and productivity.Laura Tacho: Mm hmm.Patrick Kua: And I want to say how I really love that differentiation you have between the leadership and management. In that, you’re right, as a community leader, you don’t have that authority over people. So you really had to exercise a lot of those leadership skills. And I think a lot of people don’t really appreciate that when they fall into their first management role. Sometimes people don’t have those opportunities to exercise or practise their leadership skills. They’re just jumping straight into that management role. And I love how you differentiate between those two.Laura Tacho: I think that’s a very common question I get, is for people who might be a team lead or a senior engineer who are looking for their first management role. And they ask, “What can I do? I don’t check any of these boxes here.” And I say, “Well, don’t you?” And differentiating between leadership and management is, it’s also a skill that people need to learn about and practice because different companies really talk about it in different ways. But I think when you can understand the difference, it opens up a lot of doors for you because you understand how your skills can can cross-supply to many different contexts.Patrick Kua: Absolutely, absolutely. You mentioned that you’re CTO for DX, but one of the things you didn’t mention was that you also coach CTO. So maybe you can explain how you fell into that part?Laura Tacho: Yeah. I was at CloudBees. I was a senior director. I was managing managers. And I found, one day, I looked at my calendar and thought, “Wow, I have quite a few meetings this week that are managers from not my reporting line coming to me for advice on things.” And I thought, “I wonder if this is one of those superpowers that I hear people talking about all the time. There’s something that I can do really well.”Laura Tacho: “That people trust me to do, that not a lot of other people can do well,” because it is you know it is a particular set of skills. And when I realised that, I thought instead of feeling shame maybe or feeling wanting to reject that part. Because I think that’s very common for engineering leaders to have a bit of an identity crisis when you realise that actually the management part of your job or the leadership part of your job is something you’re really, really good at because we all want to be like the best technical leader and have all that cool answers to all the hard, quote unquote, hard problems of technical problems. I just thought, what if I really embrace this and did it more? So I started mentoring or coaching people from outside of my company. And then when the time came during the pandemic and I thought, “Wow, I just want to get out of the corporate world for a little bit.” I thought, “Why not just make my whole job this one thing that I’m really good at?”Laura Tacho: And that’s been quite a rewarding journey. Again for that breadth. But also the longevity of those relationships. I have some clients I’ve been working with for three, four years.Patrick Kua: Amazing.Laura Tacho: And really seeing them go through all the ups, all the downs, twists and turns. It’s been really rewarding. I’m sure you can relate to that as well.Patrick Kua: Yeah, absolutely. I personally, I also enjoy seeing their personal growth and as you say, being there through their ups and downs, helping them through their challenges. And yeah, I think it’s great that you leaned into that superpower or that awareness versus, as you mentioned, how a lot of people tend to go, well, actually, this is uncomfortable dealing with people or management. Let me go back to the technical side.Patrick Kua: I think that’s really fantastic. And we definitely need people in our industry like yourself who can help other people through that. You’ve been mentoring and coaching a lot of different people, particularly managers of managers. So what are some of the common failure modes that you’ve noticed as people transition from managing individual contributors to managing other managers?Laura Tacho: When you’re managing individual contributors, you’re responsible for some systems, but mostly people. Think smaller systems. And really when you level up to managing managers, you’re responsible for systems just very broadly.Laura Tacho: But there’s still that individual connection that you need to have to people. And I think that’s a very difficult space to operate in, which is you’re responsible for this whole system, but you still need to have these very personal relationships in order for the system to keep functioning. But to get to a very clear answer. 100%, the skill that I see missing even from managers of managers, CTOs that I’ve coached, who have been a CTO for 25 years… setting clear expectations is by far the skill that is missing because where do you learn that? When do you sit down in a chair or aside from working from a coach and really learn, ok, did I set an expectation clearly enough? How could I redo that? What should I do differently? What have I learned? It’s just not something that we practice a lot as leaders.Patrick Kua: Yeah, absolutely. And I don’t know of any course that is really about here’s how you set expectations, right?Laura Tacho: I guess and someone listening, if you want to make that course…Patrick Kua: I guess how does it manifest itself? So I guess what do you send us in the conversations you have where people aren’t setting expectations well?Laura Tacho: Part of it is what I call the micromanagement spiral. I think especially in engineering, because it is such a creative endeavour and there’s a lot of knowledge work. We’re trying to close the gap between what we know now and what we need to know in order to solve this really complex problem. We want to leave the door open for a lot of creativity in there. So as a leader or even as a CTO or as a director or whatever you are, you might say, “Go build the ship.” We need to cross the river when, in fact, or here’s a more concrete example. We need to move this from whatever it is we’re doing now, and we’re going to implement it on whatever cloud with a cloud vendor.Laura Tacho: Okay. You might know that all these other divisions in your company are using AWS. But you withhold that information because what if Google actually has something that’s turnkey and you want to just be able to do it. So then your team goes off and does the stuff.Laura Tacho: And they come back to you and say, “Oh yeah, Google Cloud actually is the best one here.” And you’re like, “Okay, well that’s not going to work because we have AWS over here.” If you would have told people at the beginning but that was an expectation that you had, they would have behaved differently.Patrick Kua: Yeah.Laura Tacho: So what happens is we leave the door open because we don’t want to stifle creativity or restrict options.Laura Tacho: Our team acts accordingly. Vague expectations, get vague results. And so they might come to us with something, which is not what we’re expecting. And then we have to go into the details and say, no, not like this, like this. No, do it faster. Okay. Now I need an update every other day or whatever it is. And you’ve become the very micromanager that you absolutely hate and that you tried to avoid.Laura Tacho: Then the guilt sets in. The next time you have an opportunity to set an expectation, you say, “Oh, I don’t want to… That felt bad for me. It felt bad for the team. I’m going to go back to being, “Go cross the river and I’m not going to tell you how to build the boat.” And the cycle just repeats itself again.Laura Tacho: So CTOs and managers of managers. Because you’re leading this system of people, there is often desire to be more of an inspirational leader and not one that’s doing pace setting or really direct coaching. But you got to meet in the middle somewhere. Like giving people enough context and setting a clear expectation isn’t micromanagement. It’s just setting people up for success. And so that’s a skill that’s, I think, very difficult to figure out how to do it in a way that’s going to be well-received as a manager of managers when you are a little bit more removed from the day-to-day work.Patrick Kua: Yeah, great. Yeah. And I’ve definitely seen that pendulum, as you mentioned, or the spiral that you talk about moving from one extreme to the other of, oh, I’ve been a very micro manager, let me let now just give as much freedom. And then actually I haven’t expressed my expectations. And I think one contributing factor that I’ve noticed, particularly with managing managers, is the time element. Is I think without enough time to really reflect on what you want, it’s then harder to actually explain and set those expectations. It’s that gut feel.Laura Tacho: Yeah.Patrick Kua: And you hope that people run with that, but that then makes it a lot harder.Laura Tacho: Yeah I think dipping into the metrics topic here quickly, in one of my previous cohorts, I had a leader. A manager of managers, and I asked him in one of the discussions, “What do you hope that your engineering managers are doing with these metrics once you have them set up?” And he paused and he said, “Well, I would hope that they would… dot dot.” And I said, “I’m just going to stop you right there.”Laura Tacho: Because if you’re answering this question with, I hope that they might do something. It means that you don’t know what you want them to do. And if you don’t know what should happen with these, there’s no way in hell that they’re going to know what should happen with these.Laura Tacho: So, it starts with you. You need to get your story straight. Basically. Figure out what it is that you want to happen because you need to lead with conviction and purpose and people can’t look to you if you haven’t figured that out. So take the , whatever it is, a half hour. I mean, sometimes it’s much longer, but figure out what it is that you want because if you don’t know, they there’s no way for them to know. And I’ll know it when I see it isn’t a valid answer in a lot of these situations.Patrick Kua: Yeah. No, no, that doesn’t really work.Laura Tacho: Yeah.Patrick Kua: Now, as we were preparing "
