title = "Episode 6: Evolving the EM role, goal setting and finding support as a manager of managers with Gabriel Michels - The Managing Managers Podcast"
description = "Director of Engineering at Choco, Gabriel Michels, discusses the evolution of the EM role, where to get support and setting appropriate goals."
full_description = "Episode 6: Evolving the EM role, goal setting and finding support as a manager of managers with Gabriel Michels BiographyGab has been in the industry since 15 years. He started his adventure at RTL, rode the wave of browser games at Bigpoint and Gamesys, and started and failed a startup. Today Gab is on the journey to transition the food industry to more sustainable food systems with Choco. He has seen the company’s birth as a software engineer from day 1 and today is a Director of Engineering.LinkedInInstagramLinks and MentionsProject DrawdownKatz Orange – Restaurant in BerlinTrillion Dollar Coach: The Leadership Playbook of Silicon Valley’s Bill CampbellPiergiorgio Niero or @pigiuzLeadDev slackRands Leadership slackShortcut to Tech Leadership workshopManaging Humans: Biting and Humorous Tales of a Software Engineering Manager by Michael LoppHigh Output Management by Andrew S GroveGood to Great: Why Some Companies Make the Leap… and Others Don’t by Jim CollinsRange: Why Generalists Triumph in a Specialized World by David EpsteinRadical Candor: Be a Kickass Boss Without Losing Your Humanity by Kim ScottRiding the rollercoaster of emotions as a leader talk at LeadDev by Gabriel MichelsTranscriptPatrick Kua: Welcome to the Managing Managers podcast. I’m your host, Patrick Kua, founder of the Tech Lead Academy and curator of the newsletter for leaders in tech, Level Up. In this podcast, I’m chatting with senior engineering managers, directors, VPs of engineering and others who have walked the path of managing other managers, where we will uncover some great stories and lessons learnt.Let’s get started.Hi, today we have Gab Michels. Gab has been in the industry since 15 years and started his adventure at RTL, rode the wave of browser games at Bigpoint and Gamesys and started and failed a startup. Today, Gab is on the journey to transition the food industry to more sustainable food systems with Choco. Here’s seen the company’s birth as a software engineer from day one and today is a Director of Engineering.Welcome, Gab, to the podcast.Gabriel Michels: Thank you for having me. It’s an absolute pleasure being here and just speaking to you, having a conversation and let’s see where this brings us.Patrick Kua: Love it. Great. So the podcast is around managing managers and I think part of that is hearing about the leadership career journey. So I know you started off doing a bit of front end development and you started your own startup. So tell us more about that journey and how you ended up at Choco.Gabriel Michels: Yes. So I’ve been basically around working as an engineer since 2004 more or less. Or at least 2004 I started my apprenticeship, like in Germany you have this model where you work and you also go to school at the same point that goes over three years and actually I was starting off as a media designer. But like I did like all the different steps in my company so like one part of the journey was actually going through engineering. And at that point, you know, some people might say, “Is that even engineering?”I started off with Flash, you know. In the early days when it was everywhere in web and like that’s what primarily dominated also my career for a long bit, right? So from the moment this Steve Jobs said, “Okay, we’re not supporting Flash.” Flash was considered dying. But I think it’s still held on for like another five to ten years.I don’t know. Something like that. It was really long.Patrick Kua: Absolutely. I mean, I think it shut down probably about five years ago or three years ago. So there was still a lot of Flash out there. You’re right up until I recently.Gabriel Michels: Yeah, exactly. So I did that a lot. So after my journey at RTL, I moved to Bigpoint. I did some browser games when that was a thing. There was even like before all the mobile games, etc. Like Farmerrama. All these Bigpoint games and then also moving to London for an online gambling company called Gamesys. So I continued the Flash journey there and at that company, that’s when all the rats jumped off the sinking ship and went over to other technologies.So, at that point, I went to another niche technology language. It was called hacks. Barely anyone knows this for tech. It had a similar concept to, let’s say, TypeScript these days, right? But that overall brought me then to the other web technologies like React and everything in regards to web. Overall when I left London, I decided to move back to Germany for my own startup. A friend of mine dragged me into an adventure, you know. You start conversations and then actually it looks like that’s okay, you’re just advising and suddenly you’re one step through the door.So I was like, okay, now one step through the door, let’s see where this takes us. When we started the startup, it was also only just six months full-time and maybe, in total a year, with the side by side with my main job. But that’s what we did then in Berlin for six months full time. The startup was called Zoe. It was more based on like building an application for culture building inside of bigger startups. And a classic startup mistakes came the way. You know, like going all in without any clients and living off of your own money and savings. And then, you know, and eventually like I was quite burned at that point. Like exhausted at the very least. So I decided to take a break and after that, that’s what’s then brought me to Choco.The advisor of the startup was Daniel Khachab, who’s our CEO at Choco. By coincidence, the day that I decided to not pursue/continue with the startup, Dan had a dinner with me, randomly. I said, “Man, I need a break. I need to get my life straight in all dimensions.” He was like, “OK. I understand. I was there at some point as well. But how about you join my startup, that is about to launch.” And so that’s how I eventually made it to Choco.Patrick Kua: Wow, did you have a break in between? Like, or did you jump straight from your startup into a new startup?Gabriel Michels: It was three weeks. A three weeks break that I took. But yeah, it was in the intense time.Patrick Kua: Okay. Wow. So tell us more about what Choco does. I understand sustainable food, but explain it to the other people who are going to be listening to the podcast.Gabriel Michels: Yes. So our vision is to enable a sustainable food system, right? So why is that important and what does that mean first of all, right? So if we take, if we look at food waste, for instance, 24% of greenhouse gases comes actually from food waste, right? So this is from something called Project Drawdown, that did an analysis. So 24% is of greenhouse gases is food waste and 40% of all food produced goes to waste, right? So and 75% of that 40% is actually inside of the supply chain.So there’s actually no accountability, no visibility, right? It’s a very old school industry that operates with pen and paper, right? So where do we come into play, right? So we are trying to help digitize and empower the value adding businesses inside of the supply chain to run their businesses more efficiently, increase their profits and eliminate food waste along the way, right? So right now we are at the end of the supply chain, helping restaurants and their vendors to run their ordering management and their operations more efficiently. So that we can little by little go down the supply chain.Patrick Kua: Well, it’s a fantastic cause and, you know, given the current environment, it makes total sense. That’s really exciting to hear what the business is doing and also, from what I understand, it’s grown quite a lot in that time. So if I understand it right, you’ve been there for about five years(ish). You started as the second employee and a software engineer and now you’re a director of engineering. What has that journey been like? What size is Choco now?(ish) And what’s your tech team look like?Gabriel Michels: Yes. So the journey. I started off basically as the first software engineer alongside the CTO back then, right? So we were sitting in a little space, in Katz Orange. It’s a restaurant here in Berlin.PK: I love itGabriel Michels: The founder, no, owner of Katz Orange was an angel investor in Choco. So he provided us with some space and in the first year we were like, I think, we started off in April officially and then, we, by end of the year we were like 15 people in total. Of those 15 people we were four engineers in the early days, right?Nowadays we are looking at around 100 people in the tech organization or we call it EPD. Engineer, product and design. And yeah, multiple teams, a lot of learnings along the way, right? So in the early days you just need to wear multiple hats and figure things out even though you don’t know what’s what’s going on, right? I often say that I was a full stack developer, just because you had to firefight everything that comes here, right? Yeah.Patrick Kua: Amazing. It sounds like it’s a very large EPM organization now. Let’s talk a little bit about your transition as you moved into that Director of Engineering role. Did you end up being an engineering manager, leading teams or how did you make that transition into your current role?Gabriel Michels: Yeah, so. I think, you know, the CEO Daniel has more of an ops, ops heavy background, coming from sales. The ops organization in the first year grew quite fast. The tech side of things actually grew quite slow, right? So I recall, I think, by beginning of 2019 we were maybe like five people on the tech side and we had already like 30 people in the rest of the organization, right?Patrick Kua: WowGabriel Michels: Well, we were like, “Okay, there are other things that need to get picked up aside/alongside coding itself, right?” So there were just areas that needed attention. You know, people management, hiring, especially organizational tasks and set up. In one day, actually, because of this, we were also looking for a Head of Engineering role. So there was a JD (Job Description) open. I looked at this, reading the responsibilities. Actually in the previous companies, I don’t have a classic tech background, tech startup background with engineering management roles, etc. I was reading the responsibilities and I was thinking, “Well I can do this.”I don’t have formal leadership experience but it sounds like something that would excite me. Then, I started, I was on holiday and I started digging into the engineering manager path. So that’s when I found out how do I become a Head of Engineering, right? And then I found out, okay the previous step is Engineering Manager. So I came back from holiday and proposed to the CTO back, saying, “How about I take all the managerial task and just become the Engineering Manager for the organization that we are now. I will do hiring, etc, etc. So that’s how it eventually evolved into the Engineering Manager path.Patrick Kua: And if you remember at that time, as you transitioned to that Engineering Manager role, how many people were in the tech group at that time?Gabriel Michels: I think we were around 10, like, 8 to 10.Patrick Kua: So a very large team still?Gabriel Michels: It was a large team, you know. Also we had barely any processes. We had this master squad with 15 people sitting inside. So it was quite funny as well. Quite a journey. And then until end of the year, we grew to 25, right? And it was actually not necessarily classic engineering management, like having clear scope in any other bigger tech organization where, okay you have your PM and you drive things forward.I was eventually already managing the organization as a whole from an engineering perspective. So that’s when, at some point, I got trusted to do more and get more responsibility. And match my responsibilities, actually, with the Director title. At some point Dan called me during COVID and said, “Congratulations! You’re a Director now. Figure it out.” So here I am, figuring it out.Patrick Kua: Amazing. Along that journey, you probably, I mean. To go from 25 to about sort of 100 total now, you know, that’s quite a lot of growth. So you probably would have had to do things like hire other managers or leaders or grow people. So what was the mix of that and what does the organization look like now?Gabriel Michels: So right now, of those 100 people. So we have three domains. So we have the buyer side, which are the restaurants, cafes, etc. We have the vendor side, which are the suppliers, receiving the orders and then we have the platform teams, right? And so my responsibility is taking care of the buyer side of things and all the engineering managers of my domain, which is three at the moment, report to myself. Then I have a vendor counterpart as well. So we have multiple teams inside of these groups or domains, and then we have platform teams where the customers are obviously the product teams with the cloud platform and data platform to enable them.Patrick Kua: Amazing, yeah, so. Those three engineering managers that report to you. Are they people you grew into that role or people you had to hire or a mix.Gabriel Michels: Yeah it’s actually a mix. So I think in the early days, there was a lot of figuring out what is actually engineering management as a whole.Patrick Kua: Everyone goes on that journeyGabriel Michels: Yeah and it seemed everything that I found in the internet was that different companies did it differently. I think that is actually valid that at different stages, you have different needs towards engineering managers. The first group of engineering managers were actually grown from internally. It was people who were really good around people and really was seeking to grow into that role. Whatever that meant at that time, right. Later on, you don’t have any more people who are seeking to go down that path or maybe it also did not really promote it internally yet or help people grow into that direction, so you look eventually outwards. We hired obviously also people from the outside.That’s I think is always interesting because that’s the first time you confront yourself with, okay, how do other people actually run this role of engineering management?Patrick Kua: Yeah absolutely and as you were talking about how you kind of need to reflect and, well, “What does an engineering manager look like in your environment knowing it’s different in other environments?” That’s also an challenge I think a lot of people have when hiring an engineering manager, of trying to find the right sort of shape. Yeah how do you find when you were recruiting your first engineering manager? Did you find that you had people who had very different expectations or different skill set matches? Or did you find people who fit generally pretty well to the shape of engineering manager that you were looking for?Gabriel Michels: I think so we started quite late hiring for engineering managers I would say. The first group, as I said, was hired internally. It really, to go back to the point of how it evolved, the "
