title = "Episode 31: Closing Episode - The Managing Managers Podcast"
description = "Transcript Patrick Kua: I started this podcast project as a way of creating more support for senior leaders in tech. Since then, I've had the opportunity to chat with so many interesting leaders and managers about their experience managing managers. We've covered a lot of the differences, similarities, and challenges of what it means to"
full_description = "Episode 31: Closing Episode TranscriptPatrick Kua: I started this podcast project as a way of creating more support for senior leaders in tech. Since then, I’ve had the opportunity to chat with so many interesting leaders and managers about their experience managing managers. We’ve covered a lot of the differences, similarities, and challenges of what it means to transition into a managing manager’s role. And I’ve certainly heard many bits of practical advice that I feel you can apply immediately.Patrick Kua: The goal that I set out with at the start of this project has now been fulfilled. And I hope that this podcast continues to provide useful information to those of you who are thinking of, or are currently in a managing manager’s role. While there are many more people I could talk to, I feel we’ve covered many of the fundamentals and significantly added to the body of knowledge out there.Patrick Kua: With my goal achieved, I’m pausing this podcast and calling at least season one of this podcast complete. While I never say never to future episodes, I’ll be focusing my attention on my other projects and you can hear more from me in my weekly newsletter Level Up or through the training and coaching I offer at the TechLead Academy.Patrick Kua: Thank you very much for being a listener to this podcast. Please do share it with those you think could benefit. And if you’d ever like to reach out to me, the best way to reach me is either via LinkedIn or via email at pat@patkua.com. Goodbye for now.Related"
