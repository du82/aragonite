title = "Episode 27: The challenges of being a middle manager and more with Lena Reinhard - The Managing Managers Podcast"
description = "Guest Biography Lena Reinhard has dedicated her career to helping technology leaders build successful engineering organisations. Her background includes roles as VP Engineering at CircleCI and Travis CI, along with being a co-founder and CEO of a SaaS startup. She's committed her career to supporting leaders and their teams during times of rapid change and"
full_description = "Episode 27: The challenges of being a middle manager and more with Lena Reinhard Guest BiographyLena Reinhard has dedicated her career to helping technology leaders build successful engineering organisations. Her background includes roles as VP Engineering at CircleCI and Travis CI, along with being a co-founder and CEO of a SaaS startup. She’s committed her career to supporting leaders and their teams during times of rapid change and tough market conditions. Lena’s supported with a diverse range of companies across the globe, from early-stage startups, scale-ups, to corporations, and NGOs. She now works as a leadership coach, management trainer, and organisational developer, and hosts the podcast “Leadership Confidential” with real talk about leadership beyond the clichés, challenges of leading teams and organisations, and how to deal with them. Social links:Website: https://www.lenareinhard.com/Podcast: http://leadership-confidential.com LinkedIn: https://www.linkedin.com/in/lenareinhardLinks and mentionsArticle: How to communicate a decision you disagree with Kübler-Ross model (also called the 5 stages of grief)Bridges Transition ModelTalk: Strategic thinking for the busy leader and with accompanying blog post including strategy templateTranscriptPatrick Kua: Hi everyone. Welcome back to the managing managers podcast. Today I’m delighted to have Lena Reinhard. Lena Reinhard has dedicated her career to helping technology leaders build successful engineering organisations. Her background includes roles as VP engineering at CircleCI and TravisCI. Along with being a co-founder and CEO of a SaaS startup. She’s committed her career to supporting leaders and their teams during times of rapid change and tough market conditions. Lina is supported with a diverse range of companies across the globe from earlystage startups, scaleups to corporations and NGOs. She now works as a leadership coach, management trainer and organisational developer. Welcome to the podcast Lena.Lena Reinhard: Thank you for having me. Excited to be here.Patrick Kua: It’s great to have you. You have such a wide range of experience and support other leaders. But I’d love to hear a little bit about your leadership journey. So can you give us a quick overview?Lena Reinhard: That is a great question that I’m immediately struggling with. I would say I’m probably an accidental leader. At the same time I have been one my entire life but often without knowing it. So I’m a pretty shy person. I’m more of an introvert. Even though you might not necessarily expect that if you see me on stage. But it took me a while to get there. I think I’ve often associated leadership with various stereotypicals of masculine, coded aggressive styles and approaches. Whereas I’ve quite early on in my life actually been able to help groups find direction. Come together. I would, in any group project, I was in. It’s almost a stereotype in hindsight. But I was the person who ended up running it. Of course including everyone, making sure people are heard and whatnot and at some point I ended up having a title that was associated with a leadership role. I was surprised that I ended up there and it took me a long time to wrap my head around how I got there. How to even make sense of that and then also how to deal with that and how to especially how to act in a way that I would do with the title, the role and most of all the people I’ve worked with justice.Patrick Kua: Amazing. It sounds like it’s a common path, I think. Of the accidental leader. Or you get given a title of something that you feel that maybe other people see you’ve been doing but you feel, is it really me? In time it does look like you have been doing a lot of demonstration of leadership. Of bringing groups together and helping them move forward. I’m sure a lot of people are really thankful for that. So great overview. Can you remember when you first started managing other managers and do you remember when that was?Lena Reinhard: I think it was pretty early on in my journey as a leader. A big part of that is that I did the leadership journey backwards. So I started as CEO in my first official leadership role. Which, I think, is not necessarily how people do it. But I co-founded a startup and we ended up being co-CEOs there. But I was the person with my former business partner and I was the person who ended up building and then running a large engineering organisation as part of a bigger long-term consulting project that we were doing. And that was when I ended up in my first leadership role. One part was the employees that we had in the company. But the bigger one was the engineers working with that NGO. So I think we started with 4 or 5 folks and then grew the team to 60 plus within just a couple months.Patrick Kua: Wow.Lena Reinhard: And that also meant relatively soon hiring people who were in management. But honestly it was my first formal management role. I was doing my best but the majority of it was just having a team that was killing it. So for me, it wasn’t even that I really realised, hey, there’s different approaches for how to manage and what not. A lot of that I really only unravelled after. My initial experience of all of this was honestly leading through instinct and, again, just having fantastic teams to work with. The reason I mentioned this is that the next role I took on after was as an engineering manager. And very intentionally so. Stepping down to a much lower level. A very different pace of working and then became VP engineering again from there. But that also meant that, yeah, I took on the roles a bit backwards than maybe the traditional path. As much as there is one. yeah, so.Patrick Kua: Straight into the fire. And then pulling back a little bit.Lena Reinhard: Just like saying yes. And then figuring it out.Patrick Kua: I mean it sounds like a fantastic growth opportunity.Lena Reinhard: Oh yes. So much growth. I think the slight strain in the voice is entirely intentional. And therefore I would also say, for me, there is a bit of a difference and when I managed managers for the first time in a way where I was at least, aware, is the wrong word, but where I was much more intentional about what that entailed and where I had a clearer sense in what I knew I was doing. Not that I always did it but I tried. That was I think about two and a half years after my initial stint in leadership.Patrick Kua: Yeah, great. Maybe fast forward to your current role. So you’re independent, if I understand it right and helping other people. So can you explain how you ended up pivoting into what you’re currently doing then?Lena Reinhard: I think it was a year ago that a coaching client, who knew my background, they asked me, hey Lena, how’s the new job going. It stumped me because I realised that the work doesn’t feel very different in the sense that… So I do coaching. But only as part of it. The coaching is quite similar to the one on ones I used to run in the sense that I work with people on ultimately helping them develop the tools to tackle the challenges that they’re facing in the role and to achieve their goals and to support their organisation in succeeding. Of course, there is the huge difference that I’m not entangled in an organisational power dynamic. I’m not their boss. I’m not the person deciding over their promotion. I bring an outside perspective which is a great luxury and honestly one of the greatest and most intriguing parts of this job. I can’t lie. But at the same time there is a similar relationship at least in a lot of respects to the one I had with my direct reports.Lena Reinhard: Especially with folks who I work with longer term. The second part is that I also do a lot of organisational development work. Which means that basically, typically companies approach me and say, hey we have a conundrum. A challenge. A problem. Something we don’t understand. For example, we’ve hired all these people but we’re not getting the results that we expected we would. What’s happening? Or, hey, we’re having a new strategic plan for our organisation. But we’re struggling to figure out how to move our organisation from where it’s at to where it needs to be. Help us figure that out. So that’s the work that honestly I would be doing quite a lot in my VP level roles where it’s about an organisation as a system and that’s both the engineering organisation but then also in the context of the larger company.Lena Reinhard: Debugging a system in the same way as you would a technical system. Like what’s causing friction? Where are things that are just hard? It’s usually just a lot of complexity in untangling that. Therefore the work is a bit different in that I mean my day is still a lot of 1-1s honestly. And especially when I’m doing these organisational development projects, a lot of the work is basically talking with the employees throughout the entire hierarchy of the organisation. That also means again, my schedule hasn’t changed much. Of course, there is a very different position in terms of how I actually work and also honestly the luxury of working with dozens of organisations at once which is quite fun. I forgot your question. I’m sorry.Patrick Kua: Fascinating. No, no that helps her understand the pivot into your current place and what you’re doing as well.Lena Reinhard: Oh yes, the pivot. So to actually answer the question the way I pivoted was basically I felt in my previous role the organisation was in a place where it was possible for me to step down and honestly was also I thought a good idea for me to step down and make room for others. I was also at a point just in my life where I felt ready to explore something different. And at the same time something that’s very close to just domain space that I really care about, which is tech leadership and how to do it well. So that’s how.Patrick Kua: That’s fantastic.Lena Reinhard: Then I posted something on Linkedin and here we are.Patrick Kua: It’s good that you’ve got all that work and it sounds like the day-to-day I heard wasn’t so different in terms of one to ones and the coaching minus the power dynamic. Plus the benefit of having that outside perspective. Then with organisational development. The nudging or coaching, well, probably first seeing different parts of that system.Lena Reinhard: Yeah, exactly. So diagnosis.Patrick Kua: Exactly. Then understanding how to help ah organisations improve aspects to that. In your role you probably work with a lot of leaders at different levels and so what would you describe as some major differences for people who manage other managers, like a director, versus those who manage a team directly like an engineering manager? What do you think are some of those key differences?Lena Reinhard: I would say one is just the context. The context typically becomes much broader and at the same time also increases in depth a little bit. In the sense that you typically then have multiple teams that you’re at least indirectly overseeing. And the second aspect that I think is crucial is that basically, the way you create success shifts dramatically from working with people very directly to ultimately coaching coaches. To also work with that increased context. Working with many more people who are outside of your direct purview. I think that’s where we talk a lot about leading through influence. That’s where that becomes really crucial which also means having political sammy and being able to navigate. Like build good relationships with people. Be able to get stuff done when that’s usually just not that easy. Most organisations make it shockingly hard to get things done. But they’re also not doing that because it’s fun but because it’s just the way that things go. So I think that’s another big one.Lena Reinhard: So the approaches that you have to use to succeed just differ greatly. I would honestly say the step to managing managers is comparably large to moving from being an engineer to an engineering manager. If not even greater. The tricky part is that it looks so similar to an engineering manager role from very far away to the outside. But it’s really not.Lena Reinhard: I think the other important part that gets tricky is that your boss is probably going to become a bit tricky to work with. In the sense that you’re likely reporting and like many bosses at that level are really good. I’ve worked for some of them. But I’ve also been a boss that probably wasn’t super great for the people reporting to me in the sense that your boss probably doesn’t have a lot of time. Your boss probably doesn’t have a lot either to say or to offer in terms of career management. Career development Career management. There’s often a much greater expectation on people managing managers. Basically figure it out and get stuff done. And to not need a lot of guidance or support. I don’t necessarily think that’s great. But it’s also the reality a lot of people are dealing with. So there’s often times also much greater ambiguity that comes with that. And stuff just takes longer. Is harder. And you’re in the middle of things. You have this great translation function between executives that are just throwing stuff at you and are telling you… You’re competent. You have experience. You’ll figure it out. And employees or line managers who want support. Need support. Deserve support. But are also operating at a vastly different context level and that translation function can get very tricky.Patrick Kua: Yeah. Yeah that’s great. And you’ve covered quite a lot of ground. On previous episodes we’ve talked about some of those themes as well. So some of the things like that coaching aspect, needing to deal with more ambiguity, those longer feedback loops. And, of course, as you mentioned, your manager, which you often don’t expect to be a great manager. But you hope. But, as you mentioned, it’s the reality where they often just don’t have the time or the bandwidth to really support you. And you’re expected to be a lot more independent. One area that we haven’t really covered a lot is around that context switching. As you mentioned at a manager or manager, you end up with a lot more scope. Multiple teams and that can often be a struggle for an EM that’s moved into a director role and suddenly they’re switching topics and teams. What do you think helps people deal with that context switching? What has helped you in the past of dealing with team or theme topic context switching given it’s a necessity of that role?Lena Reinhard: I honestly think that’s even a really good first step. Basically knowing. That is a huge challenge. That your context explodes and it usually grows exponentially in those roles. Not in a linear way. Just even from the very operational. Like suddenly your organisation is larger which also means there’s going to be more things that come from an HR perspective. Or in terms of just people that need things and it’s your job to support them. To the stra"
