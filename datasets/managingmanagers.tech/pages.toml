["https://managingmanagers.tech/episodes/episode-015-maria-gutierrez"]
title = "Episode 15: Greater scope, systems and what is a VP of Engineering and Operations with Maria Gutierrez - The Managing Managers Podcast"
description = "Guest Biography Maria Gutierrez is an Engineering executive and advisor with over 20 years of experience working at companies ranging from early-stage to large public tech companies. A big focus of her work is building healthier and more impactful Product and Engineering organisations at scale. Social media links: Twitter: https://twitter.com/mariagutierrez LinkedIn: https://www.linkedin.com/in/mariagutierrez/ Links and mentions"
full_description = "Episode 15: Greater scope, systems and what is a VP of Engineering and Operations with Maria Gutierrez Guest BiographyMaria Gutierrez is an Engineering executive and advisor with over 20 years of experience working at companies ranging from early-stage to large public tech companies. A big focus of her work is building healthier and more impactful Product and Engineering organisations at scale.Social media links:Twitter: https://twitter.com/mariagutierrezLinkedIn: https://www.linkedin.com/in/mariagutierrez/Links and mentionsCamille Fournier’ The Manager’s Path – https://www.goodreads.com/en/book/show/33369254 Patrick Lencioni’s The Advantage – https://www.goodreads.com/book/show/12975375-the-advantageSystems Thinking Course at the Tech Lead Academy – https://techlead.academy/p/systems-thinkingTranscriptPatrick Kua: Hi everyone. I’m really thankful that Maria Gutierrez can join us today. She’s an engineering executive and advisor with over 20 years of experience working at companies ranging from early stage to large public tech companies. A big focus of her work is building healthier and more impactful product and engineering organisations at scale, which I’m pretty sure we could all use. Hi Maria! Welcome to the podcast.Maria Gutierrez: Hi Pat. Thanks for having me here.Patrick Kua: Excellent. I mean you’ve got such an amazing background in your career so far. You’ve done so many different roles. Worked at so many well-known companies like Adobe, Living Social, Freeagent, Intercom, Twitter and more. So maybe you can tell us… go back in time and tell us how you first started getting into management. So what was your first time managing other people?Maria Gutierrez: I have to really go back because I think I’ve been around the block for a little while now. But I think that the first time that I started to consider becoming a manager was when I was at Adobe. I was an individual contributor. My manager had started to talk to me about the idea of maybe, looking into getting into management. At the time I wasn’t very keen on it. I was like, no, no I feel like I have a lot more to learn.Patrick Kua: Like a lot of people.Maria Gutierrez: On the technical side. But I think in hindsight one thing he did that was brilliant, is like, okay, well take your time. Let’s explore what that’d look like and he put me through some management training that Adobe was making available to employees just to see if, kind of, I was interested in the topics. Whilst I didn’t decide to continue at Adobe as a manager, from there I moved to LivingSocial and, again, I joined as a technical lead and I was very much in my mind I want to be an engineer. Build them. Fixing things. I don’t know if you remember Living Social. That was about 2011 and it was one of the original unicorns. So it was super rapid growth when I joined. The team that I was working on, we were like about 5 or 6 people and in no time we were 20 people and growing and more.Maria Gutierrez: It became very clear, very quickly, that actually me taking on that management position would be very helpful for the team, who was at the time and my manager had taken more responsibilities. The org was growing quite a lot so he was like, hey Maria, maybe you should be considering taking that on. It felt right at the time. It really felt like it was the right thing for me to contribute to the team. And that was when I was very grateful that I had done a little bit of management training before and I had the opportunity as well at Adobe to lead the intern cohort a few times so I already knew a little bit of what I was getting myself into. So yeah, I’m very grateful that I was able to do that and not just dive into the deep end without any context whatsoever of what to expect.Patrick Kua: Which is a lot of the experience a lot of first time managers have. Now it’s a little bit different because there’s a little bit more effort in training people. But back then, such a great opportunity to have some of that training before stepping and dipping your toes into trying out management. So I understand that was your first management role a long time ago. Do you remember when you started to transition into managing other managers or leaders?Maria Gutierrez: Yeah. It was very quickly after because we were growing very very quickly. So my team got quite big. I ended up with about I think twelve people or whatever and we started to consider, ok, maybe we need to split. We were building different products. So we brought in another manager to manage part of the team and then that person was reporting to me whilst I was still responsible for one of the teams and very quickly that became like 3 teams and 4 teams. I think you know from being a baby manager, first-time manager, to becoming a manager of managers was not a very long time. Like I think it was probably within the year in all that happened.Patrick Kua: Wow. That’s a really rapid journey there and can you remember anything that really surprised you about managing managers versus managing individual contributors of that time?Maria Gutierrez: I think this is the biggest problem. Because if you take into account that I had transitioned from an IC to a manager not that long ago. The way that I measure my contribution, some value, was still very much through understanding in depth the systems what we were trying to build. Getting close to the details of what the team was doing and the technical challenges. So when you become a manager you have to go through that first phase, okay, Maria you can’t be on everything. You need to enable everybody. But actually moving into a manager of managers, there’s another layer of abstraction in there. It did take me a minute to figure out. Okay, how do I now understand what’s going on in these other teams. In this first team I had a lot of context and I knew exactly the product and the systems, etc, but as we build new things and I haven’t been there from the beginning it is a little bit more of a challenge to get, you know, the data that you feel comfortable having. And so that was the journey of, like ok, how do I let go? How do I start gathering information about what’s important from the other managers? So that was definitely the biggest shock to the system.Patrick Kua: Yeah. You’re right. Absolutely, which is that extra, what you described, as the extra layer of abstraction. Another point of indirection there. And with a number of different teams, you probably also have teams that are maybe working differently in different fashions, so how do you adjust for that, or how did you adjust for that in your system of collecting information because I’m guessing each team had a slightly different process or way of working?Maria Gutierrez: I think that was the… and not even just the teams. Even just the managers had different approaches. We all had, you know, had different managers that we had to learn from or come from different companies that approached their problems differently. And aligning to those expectations was probably one of the big challenges for me. I knew my winning formula. I think at the beginning, you just want to force your winning formula on other people and you realise that actually that might be the winning formula for me but not necessarily for other people with other styles or ways to see the problems. And really trying to understand, ok, why are people doing things in this way? What can I learn from it? But also, how do we set the right boundaries, contexts and expectations? So regardless of your style or your approach, at least there’s a common understanding of what is expected and what we’re trying to do. I think that was my very first dive into the wonderful world of setting expectations with your team. Creating career ladders, etc. To be able to codify that a little bit.Patrick Kua: Yeah, great. I heard you say there around setting expectations and boundaries with managers. What’s a concrete example? So what’s a type of conversation that you would have setting expectations and boundaries with a manager?Maria Gutierrez: I think it’s like trying to understand what, first, the role. And responsibility. Depending on where you work and the type of teams that you manage. I’ve managed a lot of product engineering teams. So the engineering manager normally works with a product leader or a design leader. And just like even, different people, depending on their strengths, take different approaches. That’s something like that clarification. Okay, now what are you here to do? What are the things that you are driving? For me, it is in 3 areas. Around setting the charter and like being clear about what the team is trying to do. Is that well-communicated, understood by the team? But also by the people that interface with the team. Then how do we do execution? So for me, the managers and the models that have operated. And I’m a big fan that they are delivery managers as well. So they’re not just responsible for the people and their growth and their performance but they’ve also got skin in the game. They are responsible for getting those products and those things out of the door. So what are our commitments to delivery? Are we doing that well or not? And the quality of the product that we’re building isn’t hitting the bar and are we responding to incidents or any of the issues that we hear from customers, etc? Then the people side of things. Are you hiring people that we need? And are you doing that in a timely manner? How are you onboarding people to be productive immediately? How are you managing performance, growth like rewarding that or not. So for me, those are like the 3 pieces that I try to make sure that we are aligned on what is expected and what we’re doing as a group.Patrick Kua: Yeah, amazing. I think it’s great that you can articulate those 3 areas for managers because I think when I talk to a lot of engineering managers, they get thrown in and they just are expected to know what’s right. And fingers crossed, that they get some feedback at some point. But setting those expectations upfront with, what is the shape of the role? What does that look like in your organisation and giving people that reinforcement? I can see so much value in helping people understand that. How they know that they’re functioning well within their organisation. One of the things I heard you say was around thinking about that evaluation part and that’s an interesting thing because typically you’re not really going to be involved in the day-to-day with your managers. So you’ve set some expectations with what is the shape of this engineering manager role. How do you know that they’re doing those roles well when you’re not there to see some of their results?Maria Gutierrez: That’s a problem that I deal with a lot. So as well as managers I’ve managed especially this past five, six years, quite a lot of program managers and operations people, etc. And that’s like the typical. They are everywhere but they’re not working with you very very closely. So for me, it’s two ways. I understand their peers. What is the feedback from their peer group? What is the feedback from the stakeholders that depend on their work? What is the perception outside of the team of what is happening and the performance of that person? And then skip levels like which are also very important. Is like, okay how is the team doing? How are they seeing the contributions of their manager to help them do their job and to set them up for success? So having you know a way to pick up on those things and actively ask for that feedback is the only way that I can triangulate a little bit of what’s happening here. I’m hearing you. Hearing them here and there and just trying to bring the full picture together.Patrick Kua: Great. I do love that triangulation metaphor of, you know, you’re almost emitting sounds to try to work out the shape of something that you have a good idea but you don’t really, can’t firsthand see it. So I think it makes sense.Maria Gutierrez: One of my favourite things is when people that work with my team provide unsolicited feedback about those folks. I think you get that when you start investing in those relationships with the people around the group and suddenly people know that you’re probably going to ask them this time, so they probably sometimes just go more proactively to let you know those things. So you have to negotiate chasing them.Patrick Kua: Yeah, great. Yeah, it definitely makes your job a lot easier if people are bringing you the information instead of always having to ask for it. Absolutely. So you’ve done a lot of managing manager roles in your career. What would you describe as other differences between managing a team of individual contributors and managing other managers?Maria Gutierrez: I think the bigger one is the scope of the work that you’re doing. Like when you are managing your team you have normally a more limited scope. Suddenly you are now working on a portfolio of products. Or if it’s a product, many different aspects of it and the complexity normally of how those things come together is different. Instead of thinking as well as maybe about a system or two that you’re responsible for. Now you’re responsible for a distributed team system and you need to figure out, OK, what are the right technical decisions as well that we need to make here. So I think that this scope is definitely one of the challenges. Is like you need to start to think more systems versus individual solutions. Then what we said before, the visibility of the work and even your own expertise on those areas. I remember the first time that I was asked to manage. I was at LivingSocial and I had been managing a product. A team with different types of features and different solutions but they were all a stack that I was very familiar with.Maria Gutierrez: Like product development. That it was very familiar and then I took on internal tools. Suddenly I had to manage our Salesforce engineers and administrators. I had no clue. It’s like I don’t even know what’s going on here. Is that like, oh, now you are responsible for something that not just that you don’t know in detail. It’s like even the domain is new to you. You have to then go back to those first principles of what you expect from those people to ensure that you actually are on top of what’s going on there. And if there are any risks and that you start exploring and identify where you actually need to build good domain expertise. So having, you know, that ability to pick up quickly context and understanding and know what new things from the domain you need to learn is also different from just a specific team. The last one would be assessing from afar. Like you were saying any organisational dysfunctions. You are not there day-to-day. So you go by what you hear or maybe that spidey sense, in that something is not quite right over there. What’s your framework to start figuring out what is happening and w"
