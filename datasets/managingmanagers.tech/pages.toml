title = "Episode 22: Ethical engineering management with David Yee - The Managing Managers Podcast"
description = "Listen to this episode to learn how delegation differs for managers of managers, the focus on principles over tasks, how to adapt your management style and more"
full_description = "Episode 22: Ethical engineering management with David Yee Guest BiographyDavid Yee is VP of Engineering at the New York Times. As an engineering leader, he’s built and scaled teams at both small and enormous companies in the worlds of journalism, music, and art—with an emphasis on product-oriented engineering and humane management.His career has included roles as Chief Architect and co-founder at 20 by 200, co-founder and CTO at Editorially, and Engineering Director of Chorus at Vox MediaSocial media links:Website: http://tangentialism.com/ Twitter: https://twitter.com/tangentialismMastodon: https://yee.camp/@david LinkedIn: https://www.linkedin.com/in/david-yee-3643651/Links and mentionsCamille Fournier’s book, The Manager’s Path – https://www.goodreads.com/en/book/show/33369254TranscriptPatrick Kua: Hi everyone. Welcome to the Managing Managers podcast. Today we have David Yee. David Yee is VP of Engineering at the New York Times. As an engineering leader, he’s built and scaled teams at both small and enormous companies in the worlds of journalism, music, and art—with an emphasis on product-oriented engineering and humane management. His career has included roles as Chief Architect and co-founder at 20 by 200, co-founder and CTO at Editorially, and Engineering Director of Chorus at Vox Media. Welcome David to the podcast.David Yee: Hi Pat. It’s good to be here.Patrick Kua: Wonderful to have you on board and you’ve got some really interesting experience across lots of really interesting industries as well. I’d love to hear about your story about how you first found yourself in management. How did you make that transition the first time?David Yee: If I go back a little bit before the scope of my bio. I mean the last time I was just an engineer. I think I was at Hearst Digital Media, so Hearst Magazine here in New York. I remember my manager at the time coming to me and saying, hey, you’re doing a great job. Would you be interested in actually being the manager of this team of engineers? It was really just one team of engineers at the time. I remember thinking I don’t really want to do that. It’s really a lot of what we sometimes hear from engineers. I really just want to follow the IC (individual contributor) track which I did. Which is the right decision for a lot of people at a lot of times. I became the tech lead there and that was great. I found myself at my next job which was a startup not having a choice in the matter. It was a startup. We were 3 people and we needed to scale. Great news and the person who was going to do that work was going to be me. Becoming a manager in that space went about, as I imagine it does for a lot of startup engineers, which is like, I’ll do it. I can tell people what to do and I can hire people and I can figure out how good they are at being engineers. But I’m just going to keep doing my thing. I’m going to pretend it’s not happening and it’s more or less what I did.Patrick Kua: Wow.David Yee: So that was the start of it.Patrick Kua: Yeah. I mean that’s quite a long time ago and I know that your management journey has grown. You’ve evolved and developed a big leadership toolkit. At what point did you start to manage managers? Was it in the same startup or was it in a different company?David Yee: No, that came later. From 20×200, I started Editorially. From Editorially we were acquired by Vox Media. At Vox started out as an engineering manager working on their content management product. Then at the time when I joined there were exactly 2 managers of engineers for, I think, at the time it was a 30 or 40 engineer team. That’s not a best a best practice. tThat’s certainly not something that served those managers well or their engineers well. So as they thought about restructuring the management team, we moved into a situation where I was going to be a Director of Engineering. It was really at Vox Media that I began to manage managers. At the time picking up 3 managers in that process.Patrick Kua: And what was that experience for you like as you transitioned to managing managers?David Yee: At the time it felt totally fine, right? It felt like I know how to do this. I manage people today. I’m going to manage these people. I’m not going to micromanage. I’m gonna take 2 engineers and promote them to managers. I just had it all figured out. At the time it felt fine. When I look back on it, there’s so much that I didn’t understand about what was happening there. I don’t think I truly understood what it meant to be a manager until I was managing managers. It was interesting. I had 1 seasoned manager reporting to me and so with that manager I said okay, well you more or less have this figured out. It was mainly one on ones. Tell me what you need. What’s going wrong? What are you doing about it? Then I had 2 first-time managers reporting to me. What it looked like a lot was like me going around them and not quite letting go and keeping an eye on the dashboards and getting in the weeds and so here I was saying well I’m not going to really micromanage and nonetheless I hadn’t set this expectation either for myself or for my staff of how far I was going to be from stuff. That was when I first realised it’s a different job. This is not the same as managing engineers?Patrick Kua: What brought you to that realisation? Was it some feedback? Was it, a it’s not working how it is after some time or how did you come across that realisation that it’s a different type of role?David Yee: Well I mean it first came to my attention because one of the new managers I had promoted didn’t want to be a manager. Which is great and there’s a whole other lesson in there about giving engineers the opportunity when you can to try out management and giving them a really clean out. For what that would look like that allows them to make the transition back safely. But I think when one of them went back to being an engineer I remember thinking, how much of this was he doesn’t like doing it and how much of it was what it looked like to be supported in that work and what it looks like to be supported as a manager and what it looks like for me… to what delegation really looks like. For me, at least in my career, you reach several moments both as an individual contributor and as a manager where you have to think about delegation but the rubber meets the road as a director because it is the same task. You are asking somebody to perform the same task as you at a different level. It’s not really what it’s like as a manager managing engineers and so I really wrestled for a while with understanding what delegation looked like. I realised that I didn’t fully understand it.Patrick Kua: Thank you for sharing that interesting insight. One thing I heard you say was around that support. So fast forward. You’ve got lots more management experience for managing other managers. What would you do differently managing a first time engineering manager?David Yee: I’ve continued to do that. I just do it in a very different way. First is to stay close in the right ways and to focus on principles is a different task than focusing on tasks. Let me give you an example of the contrast a little bit. With the first time I helped an engineer become a manager. I put them in a managerial role. I said, well, here’s what I expect you to do. Do this, this and this. Run one on ones. Set up a standing meeting with your product partner. Make sure the trains run on time. I didn’t talk about the principles. So the principles would come along the way. How is this going? Okay, let’s talk about this instead. Now I think I would focus more on the principles. This is what I expect of an engineering manager and in that there’s two ways I talk about that. First is that your job can look a lot of different ways but you bring together 3 things. People, problems and time. Your job is to navigate the space between those things.David Yee: So tell me how you think about that? How do you think about how long it should take to do something? How do you think about how many engineers need to work on a specific product? We can talk about those kinds of things. Then the second way of thinking about it is that you are building great teams. You’re building great engineers who build great software. If you stand back and you hold those 2 sets of things in place then what you actually can coach is the tasks as opposed to coaching the principles. So I would probably start there. I think I did the right thing at the time, which is to say, let’s give this a try for ninety days. You see how you think. You can back out of it if you want. I’ll be there to catch you. I’ll maintain biweekly or monthly cadence conversations with the team and I think that part would stay. But I think I would lead with principles rather than tasks.Patrick Kua: Yeah, it’s a great approach. I love that you can articulate what those principles are. I think that sometimes the challenge for probably some of the newer manager of managers is the reflection of, well, what is exactly the principles that I’m looking for innately. But as you have to articulate them to somebody else then you realise maybe I don’t know how to succinctly put it that way. I think there’s also an interesting thing here where you have managers perhaps at different levels. So the principles and the coaching on tasks are probably very useful for those first time managers. What would be different about perhaps a really experienced manager? How would you approach that?David Yee: That’s a good question. I mean what’s interesting about experienced managers… it gets back to what you just said. Like one of the things that’s really interesting about management when you’re doing it is that unless you’re articulating that work to somebody else, I’m probably not the only person, the only engineering manager who would say there are times when I don’t know what my job is. Like I just don’t know what it is. That was true when I was an engineering manager too, and to a certain extent there’s to varying degrees, all of us walk through our day-to-day at moments doubting whether we’re doing the job correctly. Because we’re in positions of authority we have to project that we do think we’re doing it correctly. So with an experienced manager in many cases, they’ve gotten very good at projecting that they know what they’re doing. So with an experienced manager, for me, I think the job ends up creating a sense of vulnerability in our conversations. Because I’ve been in this situation before, and I often continue to find myself in the situation where I have to tell my manager, I’ve got this. Don’t worry about it. If something is wrong I will tell you. That’s fine and I believe it. But at the same time, my job here is to help you read your room and to give you context that you might not have.David Yee: I might not always know what context to give you. So I have to create that sense of vulnerability with experienced managers while at the same time really honouring that contract and say I’m going to stay away. I hired you because I know you’re already good. There are managers that I’ve hired that I’m very very proud of. And just won’t get in the weeds but at the same time have to say things like, there are times when I have to raise my eyebrows, and said what’s true about this? How do you feel about what’s going on right now? Creating an opportunity to explore doubt.Patrick Kua: Yeah. I think what you describe there is a really good example. I think of adapting that style to supporting a different type of manager with more experience. In the example that you gave I think it really really nails it. You talked about both hiring managers and also growing managers or picking potential engineers who have that management. What is it that you’re looking for in a potential engineering manager of what makes them potentially great as an engineering manager?David Yee: First of all, it depends on the organisation I’m working in. Second of all it depends a little bit on what the team needs. However, there is a consistency to my hiring in that I tend to look for people who are capable of interrogating and understanding ambiguity. We often talk about this for engineering directors and for VPs, the higher up you go, the more ambiguous things are. But even at the line, you’re dealing with human beings. We want things to be systemic. We want things to work in lockstep. We want the trains to run on time and for your agile processes to run smoothly. But at the end of the day these are human beings who are building software. So that introduces a tremendous amount of ambiguity into your day.David Yee: When do you break the rules? Why do you break the rules? How do you infer that somebody is thriving and delivering a lot of work? How do you discern whether they are burning out and delivering a lot of work? I look for people who are capable of understanding systems of human beings and understanding human beings at the same time and sometimes finding the juncture between those two things and how they sometimes conflict.Patrick Kua: I think that’s a great summary as well. Of dealing with ambiguity and, you’re right, I know this from personal experience as well. As you mentioned as your scope increases the ambiguity and uncertainty increases with that role. I think back to the days of when I was an engineer I would be like here’s a nice user story. Let’s get the acceptance criteria and nail it all down, right? So it’s very clear and you don’t really get that when you’re in those management roles alone in higher levels. You’d never have the time. You never have all the information and you definitely have to deal with a lot of ambiguity. So I really love that.David Yee: Yeah. People. It’s true. I mean it’s not a particularly easy role to take up. I always talk about this. Like if I had a really gnarly engineering problem, it would keep me up and then I would solve it and I would sleep well at night. When I have a really gnarly people problem, a really gnarly person problem, human problem I can get to the end of it but I never really, you never, really solve anything. You have to wrestle with the circumstance. You have to wrestle with the consequences and so that is something it takes some time to get through.Patrick Kua: Absolutely. The emotional side if you really care as a manager I think makes a huge difference as well. I’d like to jump to a topic on your website. So on your website it says, if we should ever meet, we should talk about ethical engineering management. So this is a fairly new term for me. I mean I understand ethics and it’s very rare to see them together in that phrase. So what do you mean by that phrase?David Yee: It’s funny. I was thinking about how I infrequently update my website. The phrase ethical engineering management, to me, does leap out as like a statement from the past that I still believe in. But it’s gained a lot of nuance and complexity since I first wrote that sent"
