title = "Episode 18: Onboarding and prioritising time in a 2000-person eng org with Thiago Ghisi - The Managing Managers Podcast"
description = "Thiago covers his background from a consulting to management, onboarding in various contexts and why its easier as a director than an engineering manager."
full_description = "Episode 18: Onboarding and prioritising time in a 2000-person eng org with Thiago Ghisi Guest BiographyThiago Ghisi is an engineering leader who has worked at places like Apple, ThoughtWorks and Amex. He is currently a Director of Engineering at Nubank and also runs a podcast, “Engineering Advice You Didn’t Ask For”Social media links:LinkedIn – https://www.linkedin.com/in/thiagoghisi Twitter – https://twitter.com/thiagoghisiLinks and mentionsSmall Bets – https://smallbets.co/ Mark Horstman’s The Effective Manager – https://www.goodreads.com/en/book/show/27316166 David Marquet’s Turn the Ship Around – https://www.goodreads.com/book/show/16158601-turn-the-ship-around Engineering Advice You Didn’t Ask For – https://engineeringadvice.dev/TranscriptPatrick Kua: So I’m very excited to have today, Thiago Ghisi. Thiago is an engineering leader who has worked at places like Apple, ThoughtWorks and Amex. He is currently a Director of Engineering at Nubank and also runs a podcast called, “Engineering Advice You Didn’t Ask For.” Hi Thiago, how are you doing?Thiago Ghisi: Hello Patrick. Doing amazing. Thank you so much for the invite. It’s a pleasure to be here.Patrick Kua: Wonderful. I find it interesting that you also run your podcast. So maybe just a quick, why did you end up doing that podcast on that topic?Thiago Ghisi: Yes, so it’s quite a story there actually. So last year I was on a mini sabbatical and I joined this community called is Small Bets. It is a community of people that are trying to do entrepreneurship online. With a philosophy of trying out a lot of small things and then we found out a group of former managers and engineers there and we had this idea, OK, why don’t we try this as a small bet and see how it goes. And then we try to monetise at some point. We ended up doing a season last year. 10 episodes. We did a season this year as well. This year is actually a premium on substack. So but I think that the reason was basically there seems that not a lot of people are talking about this openly. Like about management. And this seems that we have a lot of experience. So it’s not only myself. It’s myself and other four leaders. Some more on the IC (individual contributor) track. Some more on the management track.Thiago Ghisi: And it’s been fun for us to connect as well. So those are more conversational. Debating on a topic and you usually get to really honest opinions that are often not shared. I mean at any other place we have seen. Just because some of us actually move to different companies or actually changed tracks after being a Director+ for a couple of years so that gives us some, I would say, transparency, that you cannot actually have or see what the company or if you’re still attached to your current experience.Patrick Kua: Fantastic! It’s such a great idea and I completely agree with you, which is that transparency of people who are in those roles. You don’t really sometimes know what’s going on in their world and there’s not really a lot of podcasts that are talking about engineering management, leadership in our field, given the number of people I’m sure in those roles. So I think there are always places for more voices and that’s why I invited you to the podcast. I’d like to hear about your own story. So how did you start getting into leadership? You were a developer at some point. So what made you go down the management track?Thiago Ghisi: I think on my side I was more doing, let’s say pretty much, the management job but I was you senior engineer right? My day to day was… I feel that like… back, ten years ago engineering management was not a thing. Even staff engineering was not defined right? So we had tech leads, whatever. But I think engineering management as a career got formalised. It’s getting more clear. The responsibilities. The career ladder. How you move. I think over the last couple of years, right? But on my side, if I go back a little bit, I was at ThoughtWorks. At ThoughtWorks I was able to see a lot of good consultants working with clients and doing things, that for me, it just became normal. Like facilitating a discussion or a retrospective. Or running a discovery or a lean inception right?Thiago Ghisi: I got inspired by that and then I joined a startup. That was the time I moved to New York. 2014. Then I just kept doing that at that startup. We only had engineers and the CTO. There was no managers. So I was interviewing people. I was trying to put some processes to prioritise bugs. To do things that we used to do at ThoughtWorks with our, let’s say, clients at the time. Then I became the person that the team would like, “Hey, can you come here for us to discuss this? It’s getting really contentious. Can you try to facilitate?” So I was playing that role and I actually got invited at that startup to be the director of engineering. That was the first manager. But I was almost 3 years there. Was burning out. And I decided to move and that’s when I actually joined American Express. Then there, two months in, my manager, my engineering manager, that was already the title, left. I joined the company and started doing exactly the same things that I used to do at ThoughtWorks and then I did at Voxy, that was the startup. Then two months in my manager left and I was in a good position and people already seeing why is this engineer doing those things. It’s weird here, right? Because in a big corporation, it was, if you are an engineer, you sit on the backseat. You’re not the one running a meeting with all the directors and giving your opinions. I was doing that because that was just normal for me. Then my manager left and I was offered the the opportunity to start to lead a pretty big squad at the time on a really big project.Patrick Kua: How big was that squad?Thiago Ghisi: It was 12 people.Patrick Kua: Oh yeah, it’s quite big.Thiago Ghisi: It was a mix of iOS, Android, and backend and it was on a death march, I would say, to deliver a big project. But that was fun and I got some really good manager support. That was the end of 2016. In 2017 I started my journey and that was really stressful. Especially because I had never managed people directly. So it’s one thing when you are, let’s say, the consultant, when you are the one facilitating meetings here and there. Partnering up with the product managers right? The other thing is when people start to report to you and start doing one on ones. Start doing feedback. Promotions. I think that was a great learning and I think the the pressure to deliver at the same time was also great to almost hone some other skills on how to break down projects, how to manage dependencies. When you work on a big corporation a big part of this management is to work across business areas, business units, and get the end to end to work.Patrick Kua: Yeah. And that is a lot of dependencies I can imagine. A lot of navigating an organisation. What I find fascinating with your story is, as both a consultant and then also in your startup, of you improving things about how the team’s working, as you said aren’t necessarily things that perhaps engineers normally focus on. When you find yourself in that more formal role it sounds like you had those activities or experiences underneath your belt. Then it was just the people management side which is perhaps the newer aspects and to a certain degree, that’s a much better place than a lot of other first time managers who are learning everything at the same time. I heard you say you had some good support, so what were some concrete things that helped you through that journey?Thiago Ghisi: Yeah. So I think as you said, I think, since the beginning of my career I was super into process, right? So Kanban, and even looking at the more traditional models, improving the efficiency of the flow and looking deeper than most engineers look at agile methodologies and all that. But regarding the support, so I think it is great when you, it was great that I joined as an engineer and then quickly transitioned to management. And that transition was not official. Let’s say at the beginning. It was like, okay, you’re going to join. You’re going to start to act as a manager but we need to fix the promotion process. Whatever it is and technically there was still an overlap of time where some of the engineers were reporting to the director at the time but I feel that I had my director at the time had my back. I felt that he was there and he was so confident that I would be able to get things done and move through the challenge. I think having that safety net with you was super helpful even though I think there were stressful times.Thiago Ghisi: There were things that were new to me and were new to him as well. I think more of the sense of support and I think the other thing was that this manager of mine at the time he had a lot of context. He was at the company for 10+ years and he had been growing at a really fast pace. Also he knew how to navigate into the org. How to get things done. A context that I had never worked in before in a really big corporation where you have a lot of dependencies. Where in order to do something on the mobile app, was our context there, you had to involve sometimes the mainframe, security, networking, right? It was something that he was super fluent to navigate (in) and I could rely a lot on him on things that I was missing. He would join standups here and there. He would give feedback and pick up things for him to do, so it was great to learn by example because I was also new in the organisation. I had never done a project of that magnitude in that organisation before and not even in my career before. Because I mean as a consultant you work on big things, but you’re smaller, or you just get a chunk of an initiative. I think we’re also aligned on the philosophy of management. I remember that one thing he said to me at the beginning was, I look at managers as servant leaders. That you are there to empower the people and serve the team. I think that was a really good framing. It was just a good moment and good support.Patrick Kua: That’s fantastic. I’m so happy that you were able to have a good first experience in an official management role. Where you had somebody who had your back. Who was role modelling and who complimented a lot of the things that you were trying to learn and grow in that area. So I think that’s fantastic. Let’s fast forward a little bit and going through that experience of being a first time manager. At what point did you start to manage other managers?Thiago Ghisi: That was probably almost 3 years after. It was mid-2019. It was great that I had that time. It was not something that I picked up right away because I felt that during that time being a first-level manager and getting those big projects done and getting some process changes and getting to know other managers. Getting to also know the senior leadership. Getting to know the VP. Having a chance to work on improving our career ladder. Our promotion process. Taking a few engineers to promotions and seeing some big, let’s say, be able to contribute more at the org level, a manager was essential for me to be able to then onboard new managers under me.Thiago Ghisi: Yeah, that was 3 years after. I have been managing other managers since then but I actually had a moment when I Amex and joined Apple that I went back to be a line manager. To be a direct manager, I actually found, weirdly enough, that it was much harder than before. I felt that I was not that ready to be a direct manager. Then when I left Apple and joined Nubank I joined again to be a manager of managers and I feel that are more effective. I feel that my skills are better used as a manager of managers with a slightly bigger scope than being the line manager than trying to do things that I used to do as a director. So I think that’s something that’s funny. You would think that the more you grow, the easier it is to move backwards. I have seen how things work. I have had bigger orgs now. Now we’re going to go to manage a direct team of engineers on a new project. That should be a piece of cake. But it was not the case at all. I actually found that I was struggling. The other side is I think joining as direct manager directly, not as an IC was my first time so I had to learn the codebase, the infrastructure side, the process. I didn’t have that onboarding experience of an engineer that when I joined Amex, I think that helped me a lot to be at the same page. When you join as a manager you usually are put to task right away. And you have to learn the technical side on the side. But that takes a while and the bigger the context, the bigger the org, that is a big learning curve.Patrick Kua: Yeah, great experience and also a great reflection on those differences. What’s a concrete example of something that you think is different for managing managers and managing individual contributors?Thiago Ghisi: So I feel that one thing that’s big is you are on the day to day, helping to break down tasks and running standups and removing blockers. Giving feedback I think that doesn’t change. But I think as a manager of managers I think you’re not as involved on those things and you’re focusing more on a little bit broader issues because your scope is bigger, you have managers you can delegate things to. As a line manager you have to do everything. You don’t have many people to delegate to. Especially if you have a team that’s not that big. Also the other thing is if you don’t have a good PM (Product Manager) partner, things are much harder as a direct manager. Also it depends on how much are you expected to code or to contribute as a line manager. As a tech lead manager, TLM. You’re expected to be a lot closer to the day to day than as a manager of managers. Not that you are not expected. But you’re looking more at how things are going to integrate. Head count issues. Hiring. You look at things that, as a line manager, you’re not getting a big portion of your time.Thiago Ghisi: I think you also start to develop more relationships across. Because those are going to be key for you to deliver those projects. To get to know your peers. Your partners in other areas. You get slightly big blockers and you try to, let’s say, sell things to the senior leadership to get whatever new tooling, new things. You’re thinking a little bit more ahead of time. You’re planning for next year. You’re looking for things that are bit more long term. You still do a lot of people management but you’re more, to some engineers, more as a mentor. More as someone that’s giving additional insights. Not someone that is managing the day to day.Patrick Kua: I guess what I’m hearing here, is that your experience, particularly as a manager of a direct team is directly affected by the composition and context of that team. If you’re having to code. If you’re dealing with a relatively junior or small team. Lots of things and you also ha"
