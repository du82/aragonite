title = "Episode 24: Designing Team APIs as a manager of managers and more with Jess Mink - The Managing Managers Podcast"
description = "Learn about their perspective on how engineering managers differ from other managers, experience leading product and how the role varies across organisations."
full_description = "Episode 24: Designing Team APIs as a manager of managers and more with Jess Mink Guest BiographyJess is passionate about building strong, productive technical organizations that are focused on outcomes. While some people are fascinated by architecting code Jess loves to understand and debug human systems. Developer tools and health tech companies speak to them and despite seeking engineering roles they have a habit of taking on product roles when needed. They’ve worked at companies such as Auth0, FOLX and Amazon and held roles from Director of Engineering to VP of Product. They are currently Director of Platform Engineering at Honeycomb.io. In their spare time they volunteer doing Search and Rescue.Social media links:LinkedIn: https://www.linkedin.com/in/jessica-mink/Links and mentionsThe Manager’s Path – https://www.goodreads.com/book/show/33369254-the-manager-s-path5 Dysfunctions of a Team – https://www.goodreads.com/book/show/21343.The_Five_Dysfunctions_of_a_TeamGood Strategy, Bad Strategy – https://www.goodreads.com/book/show/11721966-good-strategy-bad-strategyWill Larson on Engineering Strategy – https://lethain.com/tags/strategyTranscriptPatrick Kua: Hi everyone. Welcome back to the Managing Managers podcast. Today I’m really excited to have Jess Mink. Jess is passionate about building strong productive technical organisations that are focused on outcomes. While some people are fascinated by architecting code, Jess loves to understand and debug human systems. Developer tools and health tech companies speak to them and despite seeking engineering roles, they have a habit of taking on product roles when needed. They’ve worked at companies such as Auth0, FOLX and Amazon and held roles from Director of Engineering to VP of Product. They are currently Director of Platform Engineering at Honeycomb.io. In their spare time they volunteer doing search and rescue. Welcome to the podcast Jess.Jess Mink: Thank you! I’m so excited to be here.Patrick Kua: It’s really great to have you on the podcast and such a really rich history. Lots of different roles. Lots of different companies. So very excited to get into that and also very wide range of interests. Love that. Maybe you can give us a quick overview of your journey in tech so far.Jess Mink: Yeah. I got lucky. I ended up at a magnet school that was tech-focused in high school. Oh, I’ll go to college for that. Once I figure out what I want to do it’ll be great. Programming’s fine. Then went and worked at Amazon. Didn’t love it. Went and worked at a startup. It was okay. But I was realising people are really the part that speaks to me a lot more than the coding. So after that I worked real hard and I was able to get a management role with some great sponsorship and then life got wild. I happened to know a physician who was starting a startup and he recruited me originally to be CTO and then at the last minute it switched to VP of Product which I was wildly unqualified for. So that was a wild ride to go from my first time being an engineering manager to being a VP of a department I’d never been a member of before. Then from there I went to more traditional director of engineering type roles. So I’ve had 3 different director of engineering roles that are all really different.Patrick Kua: Wow. That’s really fantastic and great that you found your calling, I guess, dealing with the people. We need more people who think about that in tech. Not just the tech but also have that tech background. You also bring this unique perspective of bringing in product which I’d love to explore in this podcast as well. Given that you’ve had a number of different roles, can you remember when you first started managing other managers?Jess Mink: Yeah. In that VP of Product role at Call9, I technically was managing other managers but they only had one employee, so it wasn’t really deeply managing other managers. The first place where I got to do that in a really deep way was at Auth0. I had 5 different managers with 7 different teams and they were almost all first time managers. So it was a really interesting challenge.Patrick Kua: Wow! Very exciting. I could imagine those people probably would have needed a lot of support. Was there any surprises for you in that experience, the first time managing five first time managers?Jess Mink: Oh my goodness. So many. So many. First, how much I could trust my instincts. Another is how little control you have. You’re both coach and accountability at the same time and you have to really think about what’s the API you need a team to provide you? And being really crisp about that. And then how much flexibility are you going to allow in implementation and being really clear about that. I think really helps a team know where they can innovate and what the guidelines are so they don’t get frustrated trying to change things that they can’t or feel they can’t change things that they could.Patrick Kua: Amazing. I love the way that you use the term API and implementation. I’d love to delve into that. But firstly let’s talk a little bit about the five first time managers because I heard you say, trying to find the right level of detail or interface but also there’s going to be differences amongst the managers that you had in terms of, I don’t know, style or preferences. How similar or different were they and how did you deal with that – the set of differences?Jess Mink: There were definitely differences. They weren’t completely across the map. But they were definitely strong differences. They were each facing different challenges. Whether it was being a brand new manager and building confidence. Or not having as strong of a technical background. Or being really worried about politics of the company and being really caught up in that. Or having trouble building confidence in senior leadership or communication or poor performers on the team. Each of them had a different challenge they were working through.Patrick Kua: All right, great. Then let’s go back to this API. So I mean you’ve managed managers for quite some time now and you did say part of the challenge is defining your API with a manager. In that context what do you mean by an API and can you give us a concrete example?Jess Mink: Yeah. So if you think about why we have a company. We have a company because we want to do something that’s bigger than an individual can do. Then we have multiple teams because we’re trying to do something that’s bigger than a single team can do. So we need to structure it so the teams are all working together towards a common goal. Which means interoperability between the different teams is super important. So certain parts that I would consider part of the API is: Where is your work visible? How do new projects get proposed? How does code reviews work? All those things that impact other teams. So that people know how to operate in the space and they don’t need a personal relationship with someone on that team to be able to collaborate effectively.Patrick Kua: Great. Yeah. I love the use of that I can see some of those thinking organisationally. Maybe the influence on Amazon as well in terms of interfaces and data contracts first.Jess Mink: I left there pretty quickly. It was not for me.Patrick Kua: Just good design principles. But the other thing I heard was around the implementation detail. Because I’m sure you’ve got opinions and preferences about how people implement certain things. So is there anything where you give either very strong guidance or things that you like to encourage in your engineering managers?Jess Mink: Yeah. Having a retro every two weeks is something I really really strongly recommend because that’s the way that you build that feedback loop and the team can iterate on their own process. You don’t ship something and walk away and never see what the impact is on customers. You need to keep iterating on your team’s process. That’s how people on the team feel they have agency and they understand why the pieces are there. So that’s a thing that’s arguably in implementation detail. But I really really strongly advocate for them.Patrick Kua: I’m a huge fan of retrospectives. So I love it.Jess Mink: They’re so Important. It’s an oil change, right? If you’re doing them a lot, they can feel boring and nothing real comes up. But they bring the things to the surface and they also build a culture of bringing things up and understanding that there’s agency. So they’re just so critical that way.Patrick Kua: Absolutely.Jess Mink: Another implementation detail that I feel is important is knowledge sharing. I think it’s really important to make sure that people can go on vacation. If only one person knows a system they’re going to have a hard time stepping away. Also people need to learn to feel good in their job. You want to make sure you don’t end up in a situation where the longer someone’s been at a company the more toil and maintenance work they’re doing because that’s just encouraging people to leave. So there’s a lot of different reasons why knowledge sharing is important for organisational resiliency.Patrick Kua: Great and I love that focus. I can imagine some of that tension because a manager might be going, oh it’s easy because that person knows it and it just gets it done. But yeah, there’s that risk and the other consequence that you’re always managing against.Jess Mink: Yeah, whenever you have only one person who knows how to do something and you keep throwing those types of projects to them I think of that as taking on organisational debt. Just like you can take on tech debt. Yes, you’re moving faster in the short term but you’re setting yourselves up for long-term pain.Patrick Kua: Absolutely agree. Let’s explore a little bit more about that first situation with the five first time managers. That’s kind of a unique situation because you know everyone needs support. How did they end up in that role and how did you support them?Jess Mink: Yeah. They were a little late hiring a director. Which is fine. That’s a thing that happens. Either companies are late or early and they’re usually late because you’re facing this. Do I hire someone who’s overhead, or do I hire someone who can actually code? And move the product roadmap forward. So the product roadmap usually wins.Patrick Kua: Always does.Jess Mink: Yeah. Yup. Each of them needed different support and they weren’t all successful. Most of them were. So there was a certain amount of setting expectations. I focused a lot on setting them up as a team. We worked through the 5 dysfunctions of a team as a group. I had them meet without me once a week too to talk through problems and peer support each other. I did a lot of trying to identify different people’s strengths and weaknesses and set them up as coaches for each other on those strengths. So if you think of just setting up a coaching relationship. Person A is person B’s coach, that implies a power dynamic. But if you say person A is coaching person B in communication and person B could actually be coaching person A in technical vision. That really helps identify people’s strengths and weaknesses and how to lean on each other. So I set up this network of coaching between the 5 managers as well including external resources too. But I worked really hard on setting them up as a cohesive team and they actually still all talk to each other and have a signal group together. It’s great.Patrick Kua: Oh, that’s great. That’s an amazing result and I can see the acknowledgement of strengths or weaknesses. But also focusing on building that team which sounds like it was very successful.Jess Mink: Yeah. And then since they were all first-time managers I did a little bit more top-down. I was like, each of you are having a retro at least once a week. Each of you are putting your work on the board. Each of you are implementing a certain amount of pairing. Everyone’s working on the same project. We’re not going to have a project per person. Then what I did is I looked at basically where are the fires? Who needs support right now. Then I did either a lot of coaching. A lot of reading the slack channel. Sitting in on meetings. In some cases I actually temporarily took over the team and had the manager shadow to see how it worked. If I really needed to swoop in a sudden way. I don’t recommend that but in an emergency it can smooth things out and buy someone more time. So there were a lot of different strategies depending on what each person needed. It was a bit wild. There was a lot. It was a lot going on at once.Patrick Kua: Yeah. I can imagine. But I could also imagine with the right sets of people they could also see tremendous growth in everyone at the same time.Jess Mink: Absolutely. And I think in that role I had a product partner and each of the managers had a product partner. So I also did a lot of really clear collaboration with my product partner. About where I thought each team was and what they were working on. So I was able to also get her perspective and her guidance on what she was seeing. Because different roles are going to be able to gather different types of data.Patrick Kua: Absolutely. I heard you say that you provided external resources or support as well. What were some concrete examples you were thinking of?Jess Mink: So books and articles are easy ones. Suggesting conferences is a good one. Either here’s a link. Go look at the Lead Developer. I’m sure they have a talk about subject x right? Go watch it. Or let’s get you a ticket and you can go. So different levels of investment depending on the time and the budget at the moment. I currently have someone I’ve got set up with a coach. I also like to set up cross-org relationships if someone’s working on… say someone really is trying to gain more business context and I know of a salesperson who’s really curious about what’s going on in engineering. Pairing them up can really help with getting a broader picture for both people.Patrick Kua: Fantastic. That’s a really great concrete set of ideas and examples and also a wide variety of different resources that you can support your team with that mean less work for you to a certain degree.Jess Mink: Well. Each person learns differently. So I think it’s important to see people’s learning style and what resonates for them.Patrick Kua: Absolutely. Totally agree. You were just talking about your product counterpart. So maybe that’s a good time to segue into your experience because you’ve played a number of roles. So let’s talk about the VP of product role that you were responsible for the first time. Can you talk about that experience? I heard it was a surprise. How did you fall into that? What were some of your expectations or expectations of the role?Jess Mink: I was wildly underqualified for that role. I’m just going to put that out there. There are roles that maybe you should say no to. It was really good for my career and I learned a lot but I think it maybe would"
