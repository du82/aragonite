title = "Episode 12: Learning to be a manager of manager on the job with Vitor Reis - The Managing Managers Podcast"
description = "Guest Biography Vitor Reis is a hands-on engineering lead with 14 years of experience in multiple industries. For the past 7 years he has been developing a platform for logistics at Delivery Hero, creating teams that work well together and deliver impactful things on time, developing products & tech running on over thousands of hosts"
full_description = "Episode 12: Learning to be a manager of manager on the job with Vitor Reis Guest BiographyVitor Reis is a hands-on engineering lead with 14 years of experience in multiple industries. For the past 7 years he has been developing a platform for logistics at Delivery Hero, creating teams that work well together and deliver impactful things on time, developing products & tech running on over thousands of hosts in 5 data centres serving 50+ countries.Social media links:Website: https://vitorreis.com/Twitter: https://twitter.com/vitorreisdevLinkedIn: https://www.linkedin.com/in/vitor-dos-reisLinks and mentionsRadical Candor – https://www.goodreads.com/book/show/43263498-radical-candorNever Split the Difference – https://www.goodreads.com/book/show/123857637-never-split-the-difference The Making of a Manager – https://www.goodreads.com/book/show/38821039-the-making-of-a-manager Accelerate – https://www.goodreads.com/book/show/35747076-accelerate An Elegant Puzzle – https://www.goodreads.com/book/show/45303387-an-elegant-puzzle Manager Voltron – https://larahogan.me/blog/manager-voltron/ TranscriptPatrick Kua: Alright. Today I’m really excited to have Vitor Reis. Vitor Reis is a hands-on engineering lead with 14 years of experience in multiple industries. For the past seven years he’s been developing a platform for logistics at Delivery Hero, creating teams that work well together, and deliver impactful things on time, developing products in tech running on over thousands of hosts in five data centres and serving more than 50 countries. Welcome Vitor to the podcast.Vitor Reis: Thank you Pat. It’s a pleasure to be here.Patrick Kua: Great. Now you’re currently working for Delivery Hero. For quite some time. Over 7 years. So for the audience’s benefit, given that they might be from different parts of the world, can you tell us a little bit about what Delivery Hero does?Vitor Reis: Absolutely so a short intro about Delivery Hero. It’s the world’s leading local delivery platform. It’s operating currently in over 70 countries across Asia, Europe, Latin America, Middle East and Africa. The company started as a food delivery service in 2011 and today runs its own delivery platform on four continents. Additionally Delivery Hero is pioneering in quickcommerce, the next generation of ecommerce aiming to bring groceries and household goods to customers in under one hour and often in 20 to 30 minutes. We are headquartered here in Berlin, Germany and Delivery Hero has also been listed as a company on the stock exchange of Frankfurt since 2017.Patrick Kua: Great. Amazing short summary and also, you can see the evolution of the company throughout that as well. Which brings us onto the evolution of your journey. So tell us how you got into leading teams at the beginning and tell us a little bit about your leadership journey.Vitor Reis: Yeah, the short version of this story involves working hard and also being a little bit lucky. At the right place at the right time. My background is in computer science. I was always a continuous learner and always interested in the leadership topic. I communicated this very early to my manager. I worked in different areas of the team to gain a more generalistic experience of the business, of the processes, and I was really focusing on a personal level to be ready to step in this next role. Even though at many times, the role was just not there and it was not open. Until one day that the role was there and it was open. I felt, or the team felt, that I was the best person to take that role.Vitor Reis: If I go back more, I worked in companies of different sizes, and different industries. So in the beginning with enterprise resource planning. I was doing software for pharmaceutical companies. For supermarkets. This thing kind of thing. Then I pivoted into education and banking. So this was a period of my career that I did a lot of .Net development. Really heavy Microsoft stack. I did a very interesting project once with a big bank. We were modernising their old mainframe architecture, written in COBOL to a service-oriented architecture based on the web. So a lot of learning. At some point I did the pivot a little bit, let’s say, more open source technologies. Java and a few other programming languages. This was more or less at the same time that I ended up relocating to FoodPanda, which is a company that later on was acquired by Delivery Hero and I’ve been with them since quite a time.Patrick Kua: Amazing. So quite a broad range of industries. Different tech stacks as well and lots of different roles. When you think about how you were leading teams at what point did you, how much leadership experience or management and experience did you have before you found yourself in a role where you were starting to manage other managers?Vitor Reis: Yeah, it’s quite interesting topic. In my private life I was always trying to step in naturally in these leadership opportunities. On my hobbies. With my group of friends. Let’s organise an activity. Let’s organise a sport. I was also having a music hobby in the past and okay, let’s try to organise a band. Let’s try to get people to figure out a schedule where we can practise. So in these opportunities I always try to take opportunities whenever it makes sense. Of course professionally it’s a much harder situation. I think also when I relocated to the team in Delivery Hero, it was my first international experience. I was also working on my communication skills. On my English as my second language. So I had a much larger room of skills to cover until I could be ready for taking the leadership role in such a multinational multicultural company.Vitor Reis: But yeah, eventually I got to this opportunity. It all started very small. A small team. Let’s hire 1 to 3 engineers. Let’s do this PoC (Proof Concept). There’s a well-defined goal that we need to achieve. At the time it was a build versus buy type of product. So we wanted to rewrite an in-house project. Slowly that allowed me to experience hands-on and really learn what this role is about in the context of a company.Patrick Kua: Great. When you were leading that team were you also the manager or were you more the tech lead? Lead without the management duties? Or what was the mix of that role at that time?Vitor Reis: That was a very interesting learning because it was a moment in time that I referred that I noticed that different companies have completely different definitions of the role. Here in Delivery Hero the tech lead is an engineering manager and engineering manager is expected to be a tech lead. So usually are aiming for more or less a fifty fifty profile that has good communication and people management skills. But it’s also very hands-on technically.Vitor Reis: In this particular role, I started first as just the senior software engineer in the team that was entitled to be the tech lead. I was involved in the hiring process. Hiring some engineers and I was slowly getting involved into the people management and then in a very short period of time when we built confidence as a team with my manager that things were going on the right track. So they, let’s say, validated this tech lead position with an engineering management career change.Patrick Kua: Got it. Excellent. So if I understand it right? Then the engineering manager at Delivery Hero is expected to be quite technical. Hands on half-time and then you were slowly getting involved in the people management side as you transitioned to that role. Was that right?Vitor Reis: Absolutely right. So as an engineering manager I was still accountable for doing the architecture, figuring out what will be the approach and even doing some coding in the early stage. It took me some time to also learn that I could actually help the team more by doing a different set of tasks. And leaving their whole coding part to them. So this was when I worked in pivoting a little bit. Okay, maybe I’m going to prepare the description of the tasks better and maybe I’m going to communicate the roadmap more efficiently because these were tasks that only I could do.Patrick Kua: Great. Excellent! Thank you. If you think about that role that you had and your role now where you’re leading other managers, what time frame were you talking about and how did that transition look for you?Vitor Reis: Yeah, so that’s also quite an interesting question. I think I had a relatively fast transition through all these management roles. There are many reasons for that. I think at first I was in this interim tech lead or interim engineering manager stage for a timeline around 6-12 months. Then this was officialised as an engineering manager role which stayed for another 6-12 months. Then we had an opportunity in an area of our business that demanded a larger scope. Then I also transitioned there and I took a senior engineering manager role later on.Patrick Kua: Got it. Then in that senior engineeringing manager role how many, I guess, other teams were you responsible for? Did you pick up 2 at the beginning or how did that look for you? Was it really rapid, here’s a few teams please take care of them?Vitor Reis: Yeah, this was a very crazy transition because I was living my life. You know, my own team. I built it from scratch. We were shipping things. Things were stable. I was, okay, now, I’m going to get some time to stabilise and focus on the stability part of it, which is quite nice. One day my manager and his manager invited me for a chat and they broke the news that 2 senior leaders, my manager and another senior leader would be leaving the organisation. They have different plans. They wanted to relocate back to their countries for one being family reasons, another because he wanted to launch his own business. Then they offered me to take one of the teams that this senior lead was doing. So at this time it was going from 1 team to 2 teams.Vitor Reis: But the crazy thing was that three weeks later they invited me again for a chat. They say, hey, there is this other team that we lost the engineering manager four months ago. We were hiring a pipeline. We had somebody on the final stage. We were really convinced that this person would accept the offer. But it turned out that the person didn’t accept the offer. Now we don’t have anybody else on the pipeline. It’s probably going to take another three to four months to find somebody else and another three to four months for this person to start. We cannot afford this so can you take this additional third team on an interim basis and we’ll figure out something?Vitor Reis: So then this was the moment that my task was essentially, figure out which team is the most complicated to hire for. I would be that team interim manager for a period of time. And I was trying to backfill two other engineering managers’ roles. All of this happened a little bit organically from that point because it was a crazy period. The workload was very high. At some point I think I had 16 direct reports. Their performance review cycle was one of the most intense experiences of my life around this point in time. But eventually it stabilised. Then we could build up from there.Patrick Kua: Yeah. I mean that does sound like a very intense period. Both because of the short-term nature of suddenly 2 teams and 3 teams and then without the extra support there of having engineering managers in there. Having those 16 direct reports. Having been in places like this before I can empathise with how difficult that is. That’s quite the shock to the system. What was your strategy or how did you keep above water considering that there were probably lots of things going on? Can you remember some of the coping mechanisms or your general approach of how you’re going to deal with this?Vitor Reis: Yeah. I think this was a very complex period. I had to learn on the job and with very limited support because, as I mentioned, my manager was about to exit the organisation and we were also running a hiring process to hire another manager for myself. Later on, I also had to help that person to onboard. But my previous manager, around this time, he gave me a good recommendation. He said, look, you’re loading into a lot of responsibilities on yourself. So try to manage the commitments and try to figure out a sustainable way. Try to delegate whenever possible. This is when he also gave me the recommendation, hey maybe you would like to read this book. It’s called Radical Candor. I think it’s going to help you a lot. Then I remember me rushing through the audio book and later on buying the physical copy and again that book specifically gave me the tools and the frameworks that I could put in place to generate a little bit more structure and try to bring things to a manageable state.Patrick Kua: Wow. Yeah, it’s a great book. We’ll make sure that it gets captured in the show notes as well. And one thing I heard you say was part of your role was trying to also hire engineering managers. To take care of maybe one of the other teams. Had you hired for an engineering manager role before? Obviously you’d been on the other side but what was your experience of running the interviews for engineering managers? Did you have a good idea about what you were looking for or was that also something new for you as you were learning in that role?Vitor Reis: Absolutely. All learning on the role. I think that’s what made it a bit of a challenge. I think we had a pretty clear view on what profile we wanted because we wanted this. Somebody that has hands-on experience. Has been an engineer. Himself or herself for a period of time. But also is a good communicator and has these people skills. This proved to be a very challenging task because we felt that we were finding the 2 extremes. So either, it was someone really technical but the communication skills were not really there. Or they were a really good communicator that did not have so much hands-on experience. So this posted quite a big challenge. But also we had, I think a very good team spirit during this whole process. So I was seeking for the guidance of more experienced people managers in my organisation and they gave me good advice. We were able to co-create the hiring process together.Patrick Kua: Amazing. Yeah, and if I understand it right? Delivery Hero probably was quite large back then as well. So having that support network of experienced people managers something that I hear helped you throughout that.Vitor Reis: Absolutely. Around the time we were already a company listed in the public stock exchange. So we already had a relatively large community of leads. The challenges with this I think it is that leadership can be quite lonely at times and quite often we live in silos. I remember that there were a couple of initiatives that we were trying to introduce to break the silos. One of them was the tech leads breakfast that was running once a month and we would just meet and talk about o"
