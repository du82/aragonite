description = "About the podcast In my experience, many people struggle from transitioning from individual contribution to leading or managing a team of individual contributors (ICs). Fortunately there are many resources out there now to help people make that transition, but in my training and coaching experiences, another struggle is for those who transition from managing a"
full_description = 'About the podcastIn my experience, many people struggle from transitioning from individual contribution to leading or managing a team of individual contributors (ICs). Fortunately there are many resources out there now to help people make that transition, but in my training and coaching experiences, another struggle is for those who transition from managing a team of ICs, and start managing other managers. These roles are sometimes called an Engineering Manager, Senior Engineering Manager, Director, VP of Engineering or CTO (and more) depending on organisation size and context.This podcast is a project supported by the Tech Lead Academy and me, aimed at amplifying the stories of experienced leaders and managers in tech.About the hostPatrick Kua is a seasoned technology leader with 20+ years of experience. His current mission is accelerating the growth of technical leaders through coaching, mentoring and training. He has had many years of hands-on experience, leading, managing and improving complex organisations and software systems as the CTO and Chief Scientist of N26 (Berlin, Germany) and as a Technical Principal Consultant at ThoughtWorks. He is a frequent keynote and conference speaker, author of three books including The Retrospective Handbook, Talking with Tech Leads and Building Evolutionary Architectures and runs the free popular newsletter for leaders in tech, “Level Up” (http://levelup.patkua.com) and the Tech Lead Academy, offering online training for technical leaders. You can find him online on twitter as @patkua or running his very popular “Shortcut to Tech Leadership” workshop.<img data-recalc-dims="1" fetchpriority="high" decoding="async" width="300" height="300" src="https://i0.wp.com/managingmanagers.tech/wp-content/uploads/2023/09/PatKua500x500.jpg?resize=300%2C300&#038;ssl=1" alt="" class="wp-image-215 lazyload" srcset="https://i0.wp.com/managingmanagers.tech/wp-content/uploads/2023/09/PatKua500x500.jpg?resize=300%2C300&amp;ssl=1 300w, https://i0.wp.com/managingmanagers.tech/wp-content/uploads/2023/09/PatKua500x500.jpg?resize=150%2C150&amp;ssl=1 150w, https://i0.wp.com/managingmanagers.tech/wp-content/uploads/2023/09/PatKua500x500.jpg?w=500&amp;ssl=1 500w" sizes="(max-width: 300px) 100vw, 300px" />'
