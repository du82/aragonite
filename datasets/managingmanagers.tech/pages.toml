title = "Episode 13: Digging your well, the Staff Engineering Manager and managing burnout with Anjuan Simmons - The Managing Managers Podcast"
description = "Guest Biography Anjuan Simmons has led software development teams for over two decades, and he excels at shipping features that customers love while also managing healthy teams. Anjuan’s goal is to help everyone he meets become the best possible version of who they are meant to be. Social media links: Website: https://anjuansimmons.com/ Twitter: https://twitter.com/anjuan Instagram:"
full_description = "Episode 13: Digging your well, the Staff Engineering Manager and managing burnout with Anjuan Simmons Guest BiographyAnjuan Simmons has led software development teams for over two decades, and he excels at shipping features that customers love while also managing healthy teams. Anjuan’s goal is to help everyone he meets become the best possible version of who they are meant to be.Social media links:Website: https://anjuansimmons.com/Twitter: https://twitter.com/anjuanInstagram: https://www.instagram.com/anjuan/LinkedIn: https://www.linkedin.com/in/anjuan/Links and mentionsLara Hogan on 1-1s – https://larahogan.me/resources/one-on-ones/ The Staff Engineer book by Will Larson – https://staffeng.com/ The Staff Engineer’s Path by Tanya Reilly – https://www.goodreads.com/en/book/show/61058107TranscriptPatrick Kua: Hi everyone. Welcome back to the Managing Managers podcast. I’m really excited to have Anjuan Simmons with us today. Anjuan Simmons has led software development teams for over two decades and he excels at shipping features that customers love while also managing healthy teams. Anjuan’s goal is to help everyone he meets become the best possible version of who they are meant to be. I think that’s a really wonderful goal for all types of managers and leaders and I’m excited to have him here. So welcome Anjuan to the podcast.Anjuan Simmons: Thank you Pat. I am so happy to be here with you.Patrick Kua: Now you’ve got such a great amount of experience. Particularly managing and leading other teams. I’d loved to hear how you got into leadership in your own career. So when did you start going down that leadership track?Anjuan Simmons: You know it’s really funny because in many ways I did not have much of a choice. So I started my career at Accenture. Anderson Consulting at the time and the consulting model was very much you come in as an analyst. I was a fresh college grad from UT (University of Texas) Austin and I had no experience. So they bring you in. They make you credible. They put you in front of clients and you’re supposed to solve their problems. You eventually get promoted. The idea is that as you go from analyst to consultant, is that you will eventually become a manager. That model is very much up or out, meaning that if you did not hit the promotion points, you were pretty much asked to leave. So this is, again I’m old, this is the late 1990s. That model fortunately has decreased in its usage but in many ways, part of my job, as a consultant at Accenture, was to make those promotion marks. That means that I eventually had to take on leading teams and becoming a manager and managing individual contributors and helping them be successful the way that I was successful as an IC.Patrick Kua: Wow. Did you have a lot of support when you were being pushed into that management track or was it a pretty much you have to do this by yourself and if you don’t then you’re out?Anjuan Simmons: It was a mix. I think that if you were able to have mentors at Accenture, if you were able to have peers, you also were being promoted then you could construct some sort of playbook. Of course we had really good documentation. To date that time we used Lotus Notes back then for data.Patrick Kua: Oh yeah. I remember Lotus Notes.Anjuan Simmons: So you could read documentation about like here are the things that are expected of an analyst, of a consultant, of a manager. When you get promoted to manager you went to what was called “new manager school,” where you learned about the art of career management and the art of managing large projects. I would say I had support. But it was very much, you had to figure it out. So I think that I was very lucky to be able to give in the opportunity to lead teams that were composed of people who I enjoyed working with. I also had really good managers as well, who served as really good role models for my development into a leader.Patrick Kua: Yeah that’s such an important aspect of having great role models. That support network of mentors or people who are also going through that transition. It also sounds like you got to do some training, which not a lot of managers sometimes do when they’re in their first. It sounds like you had a generally pretty good experience even though there was lots of learning at that time as well. So let’s fast forward a little bit and then how long was it until you were starting to manage other managers or at what point were you leading other leaders?Anjuan Simmons: So going to managing other managers, that happened at Accenture as well. The way that Accenture works is that you’re put on large projects. So I was put on a large project. Once I was there for about three or four years where we were working with a large telecom company and that was the time where we were going with the offshore model. So I had a local team in the United States that I was managing. ICs. But I had a manager in India where we had a team of engineers and one of our indian development centres or IDCs. And so I was managing managers in India who had huge teams of engineers while I had a smaller team in what’s called the onshore team. So that was the onshore-offshore time if you were working in technology in the mid, let’s say the early 00s. 2003, 2004, 2005. This was a very common model that I think has kind of gone in and out of vogue. But that was my first time where I was not directly managing the software engineers who were doing the work. I had to work through a layer of managers to be able to do that.Patrick Kua: Wow. Can you remember what some of your surprises were when you started managing through other managers?Anjuan Simmons: I think that some of the surprises that I encountered when I started managing other managers were really around two things. One is, you’re not close to the work anymore. When you are the manager of a team, you are very close to the work. You can see the work almost every day. You’re talking to the people who do the work almost every day. So you have a very tactile exposure to that team. When you go one degree of separation up, you no longer have that. I think that that’s a big adjustment to be able to, I think, that the biggest adjustment is being responsible for the work without the day-to-day interaction of what the work is doing. That was a big adjustment.Anjuan Simmons: I think the other big adjustment was the importance of frameworks. Because when you are a manager you know how performance management works. You know how work may work. How you structure the work and what you do with the work. But when you’re managing managers you really have to be responsible for understanding what’s working with these processes? Are we really having robust career management tools? Do people know what’s expected of them? Then you’re responsible for making sure that those processes and frameworks are working and if they’re not working you have to often manage up to explain why it’s not working. Get the capital you need from the upper parts of the company to make a change and then explain that change to your manager. So I think that those are the two things that were really surprising that I really struggled early on making those things effective and efficient.Patrick Kua: Yeah. That’s an amazing insight. I can definitely empathise and relate to the distance thing that you’re talking about. Of being further away from people doing the work and then also knowing about the frameworks or the processes and making sure that those things are also working and are aligned. I find it’s fascinating as well, you’re right, I think at that time, with that nearshore or offshore model. I guess one of the other interesting things that you probably encountered was also managing people from different cultures. Was that also something that was very new and different given that they were probably in a different time zone and just very different culturally?Anjuan Simmons: Absolutely. It’s funny because the first, I would say, month or so of that project, I had no way of meeting the people who were doing the work. We all got on these very late night calls using a telephone system. This was way before Zoom. Way before Microsoft Teams. Way before we had easy ways to do video. So we spent a lot of time communicating over phone calls. You can do a little bit with that. You can make progress. You can understand what the team is doing. What the work is doing. But it’s really hard to understand what’s going on. There were, I think, differences in how we thought about the work. We being the near shore team and how the team over in Bangalore thought about the work. So you really had to understand those changes in how people think about work. There were all these holidays in India that I didn’t know about. It’s like, oh, the team’s going to be gone for a week in the middle of this month where I thought we were going to get a lot done because there are these state holidays that they have, that we don’t have. So even understanding holidays and how they differ between holidays in the states and holidays in different countries. Those things you have to navigate. Because you have to respect those holidays but you also have to plan for them too. But I really was served well by the fact that after that first month or so the company actually flew the engineers over to Houston, where I was leading the local team, and we got to meet face to face. I got to know, not just names in a spreadsheet, but faces and how they operated. Because even though they all came from that part of India and that culture, you also realise that these people are different. They have different personalities. How they receive feedback. How they need guidance. So that was invaluable for my success and so I absolutely had to navigate the different cultural aspects of that team. But I was able to do that really effectively when they came to the same place where I was, and we could work together for a few weeks. We could do planning before they went back to Bangalore to do the rest of the project.Patrick Kua: Yeah I can imagine what that was like when you get to meet those people for the first time in person. Also, as you said, the tools and technology weren’t really there around video conferencing. I think I can remember the brand of the phone, with that sort of star phone, that you typically have in conference rooms. I can imagine that’s probably where you huddled with all your managers quite often. But so different today when you can do everything with video conferencing and Miro or other boards, where you can interact at the same time. It’s much much richer but I can imagine it would have been such a different experience back then. What would you say as a manager of individual contributors, as you built up some of that management skill, what helped you as you transition to managing other managers?Anjuan Simmons: I think that there are a few skills that really translate well when you’re making the leap between managing ICs and managing managers. One is people management. My people management style is very much high trust. Meaning that I assume that you’re doing what I’ve asked you to do unless you prove otherwise. I assume that you have good intentions unless you prove otherwise. That high trust, leading the trust, aspect of what I brought to my role into my team as a manager, translated very well to managing managers. With my managers, hey, same thing, I trust you. Not only that but I really do care about you. I think it’s easy to say that as maybe a throw away line. But I very much invest in the people that I managed. In my mind if you manage the people, and if you take care of the people, then there’s really no problem that you cannot solve. If you don’t manage the people well, then all those problems become even harder to solve. So I believe that people management very much translates well going from managing ICs to managing managers.Anjuan Simmons: I also think that one thing that helped me is that I do love building software. I love writing code. I love delivering features to users that they really enjoy because at the end of the day if you’re doing it the right way we build software to solve problems and ideally, you’re getting a really good view of what people are using now and the ways that that’s not working for them. Then when you create a solution you can create an even better way of solving those problems in a way that hopefully is less painful than the current state. I just love doing that. I love seeing feedback from customers and how the teams that I’m leading are solving their very real problems. So those really translate well. So whether you’re directly managing the people doing the work or managing the manager doing the work, all that. You get echoes of all that even when you become someone who’s managing managers. I also think that one of the things that translates well, at least for me, is I’ve always been curious about institutions and how they work. Even when you’re a manager, you have to be aware of them. But when you manage managers you really have direct contact with the rhythm of the business. You have very direct contact with often the leaders of the business. My early curiosity about well why do we do these things? Or why does performance management happen in these ways? Why do we do an annual review at the end of the year? Why do we do mid-year reviews? Why don’t we do this and that? I think that if you have that curiosity as an IC or as a manager then that might be a bellwether that hey you may have a really strong capability to manage managers because at the end of the day I’m responsible for the environment that my teams operate in and helping the managers focus and explain that environment to the ICs. That’s all processes. That’s all the mechanics of the work. Not just the building software/shipping code. So I think that those are the things that really translate well for me when I manage managers.Patrick Kua: I really love that focus on the people. As you say, knowing those people and being able to manage them well as individual contributors and managers. Managers are also people. Then a lot of those skills I can see translate really well. And you know that curiosity, as well, I think that’s a really interesting aspect to managing. Of really understanding the rest of the company, the rest of the context in which you’re operating. Given that you might be operating in a really large context or a smaller context if it’s a smaller startup. But that curiosity given that other departments run their teams differently and you might need to abide by certain policies that you don’t really understand but being able to have that context and share that. I can see that being really really valuable. One thing I heard you say was around thinking about you’re responsible for managers and I think one of those difficulties sometimes with managing managers is you’re not necessarily there on the day-to-day with the team. So what ar"
