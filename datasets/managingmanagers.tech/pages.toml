title = "Episode 29: What CTOs look for in a manager of managers with Meri Williams - The Managing Managers Podcast"
description = "We chat about everything from being a non-executive director, traps of first-time directors, and what to look for when interviewing managers of managers."
full_description = "Episode 29: What CTOs look for in a manager of managers with Meri Williams Guest BiographyMeri is an experienced CTO and leader of technology organisations, currently leading the technology team at Pleo. They particularly enjoy helping others to level up as technical leaders and managers of organisations, and works as a CTO coach and tech advisor to various companies in this capacity through micro-consultancy ChromeRose. They have led teams ranging in size from 30 to 300, in a range of organisations from Procter & Gamble, to the Government Digital Service, award-winning online print company MOO, mobile-first challenger bank Monzo and patient-inspired AI-driven rare disease treatment discovery company Healx, amongst others.A published author and international speaker, they are the chair of The Lead Developer conference, and a tech advisor for Kindred Capital. Together with their wife, they run micro-charity One Goes Up to help young women & enby folks pursue STEM education & careers.Social links:Meri’s LinkedIn: https://www.linkedin.com/in/meriwilliams/Links and mentionsLeadDev – https://leaddev.com/ Patrick Lencioni – https://en.wikipedia.org/wiki/Patrick_LencioniTranscriptPatrick Kua: Hi everyone. Welcome back to the Managing Managers podcast. Today I’m delighted to have Meri Williams join our podcast. Meri is an experienced CTO and leader of technology organisations, currently leading the technology team at Pleo. They particularly enjoy helping others to level up as technical leaders and managers of organisations and works as a CTO coach and tech advisor to various companies in this capacity through micro consultancy Chromerose. They’ve led teams ranging in size from 30 to 300 in a range of organisations from Procter& Gamble, to the Government Digital Service, award-winning online print company Moo, mobile-first challenger bank Monzo, and patient-inspired AI-driven rare disease treatment discovery company Healx, amongst others. A published author and international speaker, they are also the chair of the Lead Developer conference and a tech advisor for Kindred Capital. Together with their wife, they run microcharity One Goes Up to help young women and enby folk pursue STEM education and careers. Welcome to the podcast, Mary.Meri Williams: Thanks for having me, Pat.Patrick Kua: It’s really delightful to have you on and you’ve got such a broad, long management history and we’ve worked a little bit together with things like the Lead Dev. So I’m excited to have you here. And you’ve been a geek, and a manager, that’s your tagline. Geek Manager. You started off with Procter and Gamble, lots and lots of CTO roles at MOO, Monzo, Healx, and now Pleo, as well as all these part-time roles like a non-executive director and technology advisor and chair. So we could definitely spend a whole episode covering each one of these different roles, but let’s focus in on your current situation.Patrick Kua: So for some, I know being a CTO is often more than a full-time job. There’s a lot of responsibilities, and yet you do all these other activities. What is it that you enjoy doing about other roles like a non-executive director, advisor, and chair on top of being a CTO?Meri Williams: I like the breadth of experiences that it gives me access to. I get to meet a lot of different people, see a lot of different businesses. I do joke that I have ADHD and it shows in my career. I think that’s very evident from the wide variety of things that I do. I didn’t actually know I was ADHD until relatively recently. I’ve always enjoyed having lots of things on when I was at school. I did lots of different societies and sports and that stuff. So I think I’m just someone who, always having a deadline is actually very healthy for me, and doing lots of things means something is always urgent. Something is always a deadline. Something is always important as well.So I enjoy the variety that it exposes me to.Patrick Kua: Fantastic. And that is quite a lot of variety as well. I think also it’s interesting with the recent diagnosis with ADHD, I think there’s a lot of people in technology who have something similar. And I think it’s really great to demonstrate you can be really successful. Do a lot of these roles given that situation. Given that you do have all these things, how do you go about juggling these roles and also having a good work-life balance?Meri Williams: The not very secret key to it is I have an EA (Executive Assistant) at work and I have an EA for my non-Pleo things. A lass called Beth, who’s really fantastic. And so I have effectively outsourced a lot of dealing with my inbox and my calendar and all of that stuff. Just because it got very overwhelming at a certain point. So I joke that Beth and Olga, who are the two assistants, they run my life and they’re a little better at remembering that I have limitations than I am. They’re really good at going, hey, you’ve got a board meeting that week and this other thing for Lead Dev and this other thing. We need to schedule you some rest as well.Meri Williams: And so they’re really, really brilliant at that and that helps a lot. And then sadly, I have a disability, I’ve got something called Ehlers-Danlos Syndrome, and that has just forced me to be much better at work-life balance. Because if I overdo it, then I can end up in bed for weeks at a time. So I have to be much more careful in my energy and my exertion. My joints will dislocate and that stuff. So I end up in a lot of pain if I’m not careful with it.Meri Williams: So that has taught me the hard way that I have to balance things a little bit more.Patrick Kua: Yeah, learning through experience and that sounds like a really challenging situation. At the same time, it’s great that you know your limits. I think some people sometimes discover them and maybe never realise them as well. I think it’s interesting you’ve also been working with, I guess, two EAs. If I understand it right, you’ve been working with Beth, your personal EA, a little bit longer. Meri Williams: Yeah.Patrick Kua: Maybe you can talk a little bit about how you found Beth and how long you’ve been working with her and how does that work with the second EA?Meri Williams: So I found Beth in a really weird way, in that I’m friends with her mom. When she became a virtual assistant, I actually known her years. She was at my wedding as like a six/seven year old. Because I’d known her mom for so long. And she actually studied drama school and then became a virtual EA on the side. And so when she became a virtual EA, her mom was helping her get the word out that she was available. And I was like, okay, that sounds like a brilliant idea. I need help. And so she’s been helping me for a number of years now. Probably about five years. And it works really, really well. She’s got access to my personal calendar. She can’t see my full work calendar for security reasons, but she can see free/busy. And then she just coordinates with Olga, who’s my Pleo EA for anything that’s needed during business hours. Meri Williams: But most of my stuff that I do for non-Pleo things… Pleo’s in Copenhagen. Is the headquarters. And so tend to do 8am till 4pm for Pleo. And then four till six, I’ll do anything that’s outside of Pleo. In the rest of the day. And then just spread it over the late afternoons as needed. Patrick Kua: Great. I hear a little bit of time boxing. Slicing and that mental switch, perhaps between one context and another, I think that can be very helpful for a lot of people. And with Olga, the new EA, how long have you been working with her for? And I’m guessing that there’s also probably some different styles between EA’s. How did that work for you? How long did it take for you to get into the groove? Meri Williams: Yeah. So I’ve been working with her since I’ve been at Pleo. For about 18 months. And it did take a while to get into the groove. I’m definitely someone who… I’m autistic as well as ADHD. So I like things to be organised. And it took a little while for us to get into the rhythm of the next three weeks being well-enough organised. And not just being, like, this week’s crisis all the time. But that’s improved. And it’s definitely working a lot better now. Patrick Kua: Amazing. You strike me as somebody who is self-aware and you can express what you want. And I think that probably helps also withcommunicating the things that you want and what works for you. Meri Williams: Yeah, I think the other thing was accepting which things I’m not good at. I’m not brilliant at responding to email in a timelymanner. I read everything as it comes in, but I don’t always find time to respond. And so just accepting that and almost delegating the responding to organise things or set stuff up has really helped as well. Patrick Kua: Great. Lots of self awareness and that’s very useful. I think a lot of leaders struggle with email and chat, like Slack, for instance. Meri Williams: For the record, it’s a huge privilege to have help like this. And that wasn’t something I always had in my career. I think earlier in my career, I dealt with it in a different way. I had to time box certain times a day for dealing with email. Responding to email. Making sure that my calendar was correct. I did a lot of the Getting Things Done, that GTD book. A lot of those rituals of having a Monday morning planning and Friday afternoon retro. Those things really helped me when I was a little more junior and didn’t have the privilege of help. Patrick Kua: Amazing. This is a concept I think of the virtual assistant. I think popularised by the four hour work week, I think it was. But was there any trigger event other than the opportunity that Beth was coming into the market. Or you were like, oh yeah, now’s the time. I could use some help. Meri Williams: I mean, I’d had a really amazing EA called Kathryn when I was at MOO. And so I think that was how I realised that it could be transformative. Prior to that, I just didn’t really understand what an EA would do. I was like, you know, I can check my calendar and go to things on time. I don’t need someone to remind me of what’s in my diary. And it was really through working with Kathryn that I was like, oh, this makes such a difference to have somebody else taking the full emotional load or the mental load of what are you going to be doing? What’s important this week? Do you have enough time? Meri Williams: Like the best question that Kathryn would ask me and she would just say, have you got time for what’s most important this week? That really made me go, oh, shit, no. I’ve got time for whatever’s in my diary this week. I don’t have time for what’s most important. And then sitting down every week and re-jigging my life to be more around importance than around urgency was the thing that really made a big difference. And then having had that experience at work, Kathryn actually came with me to Monzo, which was fantastic. And then,yeah, got Beth on the side to make sure that I wasn’t being an undue burden on my day job person by having too much of this other stuff going on.Patrick Kua: amazing. And I think that’s a great journey as well. Of really focusing on the things that are important. And also the high leverage things around what you talked about, where you can spend your time best with what your skills are. Then delegate some of the things to somebody else who can take care of things that you know that you’re not so good at. Meri Williams: Yeah, absolutely. Patrick Kua: Great. So let’s talk about a few of the other roles or extra things that you play on top of your CTO role. Because I think that’s probably quite curious for a lot of the listeners here around what does, for instance, a non-executive director do or an advisor. So let’s maybe start about a non-executive director. So how did you get involved in that? And I guess what are some of the things that you do as part of that role? Meri Williams: Yeah, so I got involved as a non-executive director at Flagstone through the advisory role that I play for Kindred. So they’re VC in London. They were one of Flagstone’s early investors. And when Flagstone started looking for independent directors, my name came up and so I interviewed for the role. And what a non-executive director does is essentially be an independent balance on the board of a company. And so our role is to be independent. To try to act in the best interest of the company, obviously. But to bring external perspective and to bring the experience of our previous roles. So I’m a non-executive director very much with the lens of being a technologist. They are very much a technology company. But a lot of the other board members are not technologists by background. And so that’s the primary hat that I’m wearing when I’m in that board role. Meri Williams: Obviously, I’m trying to be a good general board member, but I’m also particularly there for the technology skills. Patrick Kua: And so being a board member, that means that you have to attend a few board meetings. How often do they run for you? And what’s the time commitment there? Meri Williams: So it’s about a day a month. And there are quarterly board meetings that are about half a day each. And then I coach and mentor the CTO and the CPO, the Chief Product Officer. And so I meet with them quite regularly. I actually had one of those meetings earlier today, where we were talking about rebooting their data function and some stuff around how to hire technical product managers and a couple of other challenges that they’re facing. Patrick Kua: Great. That’s an extra value add. Is that something that you volunteered to set up as part of your role? Or how did that form that coaching relationship? Meri Williams: So yeah, it was one of the asks when I joined. They wanted to, and I think this is quite common for CEOs, right? Is that they have a bunch of specialists reporting into them, but they’re not specialists in those same functions. And so they wanted somebody who could act as a one up to the CTO and CPO and bring that perspective. I’m not their line manager. And I don’t have any execution or responsibilities in that way. But I’m just bringing that guidance and advice from having been in some slightly bigger similar roles. Patrick Kua: Fantastic. And I can imagine the particularly the CTO and also the other board members who don’t have that technology background and appreciate that different perspective and the experience you bring. Meri Williams: Yeah, they do. It’s very nice to be appreciated in that way as well, right? Because I think a lot of the time as as a senior tech tech leader, you can find yourself almost struggling to be heard in some circumstances. And so being on a board where they’re desperate for that perspective is really, really, really nice. Patrick Kua: That’s fantastic. And how does that differ from perhaps the advisory roles that you play? How would you compare and contrast the two differences? Is "
