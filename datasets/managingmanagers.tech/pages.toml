title = "Episode 14: Naturally growing into a managing managers role with Alexandra Sunderland - The Managing Managers Podcast"
description = "Guest Biography Alexandra Sunderland is an engineering leader with over a decade of experience working in both hybrid and remote roles, at companies ranging from 10-person startups to public corporations. She is currently a Director of Engineering at Fellow.app, where she is helping to build the future of work. She prides herself on building emotionally-intelligent"
full_description = "Episode 14: Naturally growing into a managing managers role with Alexandra Sunderland Guest BiographyAlexandra Sunderland is an engineering leader with over a decade of experience working in both hybrid and remote roles, at companies ranging from 10-person startups to public corporations. She is currently a Director of Engineering at Fellow.app, where she is helping to build the future of work. She prides herself on building emotionally-intelligent processes for teams, and sharing her knowledge of management through conference talks and written works. Alexandra is the author of the book “Remote Engineering Management”, the guide for empathetic and people-first management in a remote world.Social media links:Website: https://www.alexandras.dev/Twitter: https://twitter.com/alexandras_dev LinkedIn: https://www.linkedin.com/in/alexandrasunderland GitHub: https://github.com/alexandra03Links and mentionsRemote Engineering Management: Managing an Engineering Team in a Remote-First World – https://www.goodreads.com/book/show/62208246-remote-engineering-managementJulie Zhuo’s Making of a Manager – https://www.goodreads.com/book/show/38821039-the-making-of-a-managerNaNoWriMo (https://nanowrimo.org/)Engineering Manager Essentials – https://patkua.com/em-essentialsTranscriptPatrick Kua: Hi everyone. Today we have Alexandra Sunderland. Alexandra Sunderland is an engineering leader with over a decade of experience working in both hybrid and remote roles at companies ranging from 10 person startups to public corporations. She is currently a director of engineering at Fellow.app where she is helping to build the future of work. She prides herself on building emotionally intelligent processes for teams and sharing her knowledge of management through conference talks and written works. Alexandra is the author of the book, Remote Engineering Management: The Guide for Empathic and People-First Management in a Remote World. Welcome to the podcast Alexandra.Alexandra Sunderland: Thanks so much. It’s great to be here.Patrick Kua: It’s really wonderful and I think your book resource is going to be a fantastic resource given our current day and age. We’ll get to that a little bit more but first I’d love to hear a little bit about your leadership story. So how did you start getting into leading teams?Alexandra Sunderland: Yeah, well I’ve been an engineer for quite a while now. I started about eleven years ago as an engineer. Went remote almost right away and I joined the company I currently work, at Fellow. I joined about five years ago as employee number twelve. Engineer number four. So very very early on and the great thing about working at startups that early is that there’s so much room for growth and so much room for creating processes and building up teams. When I joined, I was an engineer but very quickly turned into a manager within the first year or two, I think, of joining. Because the team was growing so much over time. It got to a point where I think there were 10 people reporting to the CTO and so we just needed to do a split because that was too many people reporting to one person. I naturally became the first engineering manager there and then a little bit after that I grew to have nine people reporting to me which was too many for me to manage at that point. So we split the teams again and kept doing this over and over until I ended up managing a team of managers a little while ago. But I feel like we’re always growing as a team and so I’m always on the lookout for new people to help develop skills of leadership because I know there’s going to be more opportunities very quickly for them to move into that role too.Patrick Kua: Yeah I mean that is such a fantastic opportunity as you describe with startups getting in really early. Particularly as they’re growing of just having more opportunities. Obviously the timing becomes a little bit hard when suddenly, yeah, you have nine people that you have to manage. It’s quite a large group. Needing to split that. wWhat was your transition into managing a team? Like what sort of support did you have as you transitioned into managing people for the first time?Alexandra Sunderland: I think. It felt like a very natural transition to me because even as an engineer I had been doing a lot of management related tasks. So I had been creating onboarding processes. I had been setting up the interview process and making sure that everything was going very smoothly with the team. So it felt very natural and I didn’t get the, as most people don’t get, I didn’t get any sort of formal training or anything like that at the time. But I did have a lot of support from our CEO and CTO. They were sending me so many book recommendations to read about how to be a great leader and a great manager and came across your resources as well actually. And watched a lot of your talks and read some of your works.Patrick Kua: Thank you.Alexandra Sunderland: All of that was very helpful.Patrick Kua: Oh that’s really fantastic to hear and there are so many good resources out there today and a lot of people don’t know about them. Unfortunately. Until you find yourself in those roles. But it’s great that you had people who redirected you and pointed you at these resources as well. Let’s talk about that transition as you started to lead other managers or manage other managers. So what was that transition point like? So you had a team you were managing. It grew really rapidly. What was that timeframe before you decided to split that team and how did you decide to split it?Alexandra Sunderland: Well I don’t even remember now because there was a period of time where I think every 3-6 months we were doing like a little bit of a reorg on the engineering side because we were just hiring at such a rapid pace. And because we were a startup as well the needs of the business were constantly changing. So there would be one period of time where we’d be really focused on app development and then the next where we’d really want to focus on our notes editor or calendar or whatever it is. So it felt like the team structure was just always evolving to best support that. So I think that when I started managing managers might have been, if I’m getting the timeline right, it might have been actually a year ago. Now I remember. Yes it was a year ago that I started managing managers. It felt very natural because I had started to take on a lot of the product engineering type of decisions being made. So I was doing a lot of work directly with the design leaders. The product leaders. It felt very natural for me to look after all the teams that related to product engineering very specifically. Because I love that side of things. I see code. I love code. But I see it more as a tool to create a great product instead of code being beautiful for the sake of code. So I took over that side of things while our CTO kept the teams related to SRE, infrastructure. The more, like, heavy duty code that I’m not quite as well versed in as he is.Alexandra Sunderland: So the transition went very well though. I think what we ended up doing is dividing up the team so that I manage the Enterprise team, the Apps team and the Meetings team. Which I find is a very cool concept of a team because we’re… so Fellow is a meeting management platform, where we help you create agendas, take notes, do all these things related to meetings. And this is such a core concept to us. So we created just a meetings team overall that looks after the notes editor, the calendar and all of these things. So I took on these teams and he took on the growth engineering team and the SRE team.Patrick Kua: Amazing and it sounds like some of your interests also gravitate towards that product space of thinking more holistically. I heard you say code is not just about code. It’s really a means to an end. Of solving some problem. It’s nice that it’s beautiful, but it’s not really The only thing that matters. What were some things that helped you transition into that area? Was that already something that you’d taught with your manager around? Around wanting to have more ownership of the product? Or was that just something that you started to keep helping out because it was kind of needed?Alexandra Sunderland: It was a little bit of need based and also it’s something that I really wanted. Because I love it when teams work really efficiently together and I really really love communicating with other teams and making sure that things are going well. So I was seeing that we were kind of falling through the cracks in some places because there was this division originally of, you know, like I’ll manage the Enterprise Team. He’ll manage whatever other teams we had at the time. Both kind of product related and it felt like not everyone was always on the same page. Things weren’t going super smoothly. So I was naturally stepping up and creating new ways of communicating with a product team. Making sure that everything was going very well.Patrick Kua: I was just trying to understand how you found yourself in that space? If it was something that you’re pushed into or more of your own interest? It sounds like it was something that you were, once again, filling in a need of what the business needed. And then somebody gave you that official title. Saying, hey, you’re already doing these things. Do more of it.Alexandra Sunderland: Yes. Yeah, and so I at some points asked for the ability to manage all of these other teams because I felt like if everything falls under one person then it will go more smoothly. In January of this year I think is when we made that change, so that everything that’s under product engineering would fall under me.Patrick Kua: Amazing. And if you think about some of the responsibilities or activities that you do now managing others managers, that you wouldn’t do as a, say, engineering manager, what would be some concrete examples?Alexandra Sunderland: I think in my case, a lot of the things that I do now are very similar to what I was doing before as an engineering manager. Probably because we were a startup and you take on a lot more responsibility when you’re a growing team and there’s needs. So even as an engineering manager, I was creating the career ladder. I was creating the onboarding process. I was doing a lot of those things that typically don’t fall on managers. But what I find myself doing a lot more now as a director is taking on business critical decisions and making sure that they’re executed on. Instead of being given a decision and told to see it through. There’s something exciting about that but also something incredibly stressful.Patrick Kua: Scary.Alexandra Sunderland: It’s so scary. Just making a decision but also not having direct control over its outcome anymore because you’re trusting your teams to follow through on it and make something happen. So that is something that is very different from what I was doing before.Patrick Kua: That’s a really great example. It resonates with a lot of people in a director-like role of where you have more scope, but ironically less direct control. You have these objectives that you need to deliver and you need to see these out. What are some of the things that help you influence and give you confidence that things are on track? So can you think of an example where you have a critical business decision that you need to make happen now and how do you make sure that happens?Alexandra Sunderland: I think that we have a lot of checkpoints set up between me and the managers of different teams which help out a lot with that. So, for example, every Monday morning we have a Dev Lead sync meeting where it’s me and all the other engineering managers in the company. Our CTO included. That’s where we’ll talk through some of those decisions that’ve been made. How they’re going. How they’re being carried out and just for more visibility for everyone in the company. Or everyone on the engineering leadership team. 1-1s are also a great place to really drive down a decision. Make sure that it’s being followed through and ask deeper questions. But something that I love as well for understanding what’s going on within the company is that almost all of our channels in Slack are public. So unless there is a reason that some information needs to be kept private. Which is a very rare reason. Then we default to public always and that means that any project that’s going on. Any sort of initiative. Whatever it is will have a slack channel that’s public that I’ll join. Maybe I’ll mute it so I don’t get the little red dot all the time that’s like constantly interrupting me. But I will have that insight to be able to, at any moment, go see what is going on with this. Is progress being made? Are the decisions being carried through?Alexandra Sunderland: And within all those slack channels too, like for a project, we’ll set up automations. Because remote work sometimes it’s hard to update people on what’s going on and to remember to communicate, so one of the things I love that we’ve done is set up these workflows in Slack where every day at a certain time there will be an automated message posted just saying how are you feeling about the projects? What’s going on? What issues are you running into that we can solve together?Patrick Kua: I love it.Alexandra Sunderland: Yeah, it’s great. Everyone will reply to that. We have different versions of this too where sometimes we do like the stoplight method. Where people are supposed to react with from red to green, how are you feeling about the situation?Patrick Kua: The pulse of the day.Alexandra Sunderland: Yeah, it’s so useful. Because if you’re feeling bad about something you might not always say it. But if you put like a red emoji. I think this project is off track. That opens a conversation and people are going to talk about it sooner than the weekly check in or whatever it is that you do.Patrick Kua: No, that’s great. You’re really building into some of the tools and really taking advantage of that. I think that’s such a great idea and exactly what you talked about when people are remote is people forget about things. People in different time zones and just having that heartbeat regular cadence is really nice to have some of that tooling in place. One of the things I heard you say and I find it interesting that everything is public, which is, there’s probably a lot of information. In your role you also probably are interested in a lot of information but you can’t read everything. So what’s your strategy for dealing with so many different teams? So many different topics? How do you manage your time as a director?Alexandra Sunderland: Yeah, oh it’s so hard because at first when I became a director I felt kind of odd to be handing over the teams to other people because I’m not directly involved in the work anymore. So at first I went through a phase of like I need to know everything that’s going on because I need informa"
