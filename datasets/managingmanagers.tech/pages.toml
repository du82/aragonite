title = "Episode 10: Peer mentoring, building a support group and managing up with Nickolas Means - The Managing Managers Podcast"
description = "Guest Biography Nickolas Means is an engineer turned engineering leader who’s been leading teams at companies large and small for the last decade. He’s a student of disasters like airplane crashes and a fantastic storyteller, who I’ve been able to see and hear firsthand at several LeadDev conferences. He’s currently VP of Engineering at Sym,"
full_description = "Episode 10: Peer mentoring, building a support group and managing up with Nickolas Means Guest BiographyNickolas Means is an engineer turned engineering leader who’s been leading teams at companies large and small for the last decade. He’s a student of disasters like airplane crashes and a fantastic storyteller, who I’ve been able to see and hear firsthand at several LeadDev conferences. He’s currently VP of Engineering at Sym, which builds the most developer-friendly way to secure your production infrastructure and has his own podcast called Managing Up.Social media links:Website: https://nmeans.dev/Managing Up Podcast: https://managingup.show/Twitter: https://twitter.com/nmeans Mastodon: https://ruby.social/@nmeans LinkedIn: https://www.linkedin.com/in/nickolasmeans/ Links and mentionsBrene Brown – The Power of Vulnerability TED Talk https://www.ted.com/talks/brene_brown_the_power_of_vulnerability?language=en Sarah Drasner’s Book – Engineering Management for the Rest of Us: https://www.engmanagement.dev/Lara Hogan’s Book – Resilient Management – https://resilient-management.com/Camille Fournier’s Book – The Manager’s Path – https://www.oreilly.com/library/view/the-managers-path/9781491973882/Turn the Ship Around by David Marquet – https://www.goodreads.com/nl/book/show/16158601Nickolas Mean’s Eiffel’s Tower talk at LeadDev London 2019 – https://www.youtube.com/watch?v=RNGZTkM2xOULara Hogan’s Manager Voltron – https://larahogan.me/blog/manager-voltron/ Herb Cohen’s books – You can negotiate anything (https://www.goodreads.com/en/book/show/2232479), Negotiate This!: By Caring, But Not T-H-A-T Much (https://www.goodreads.com/book/show/921166.Negotiate_This_)Annie Duke’s Thinking in Bets Book – https://www.goodreads.com/book/show/35957157-thinking-in-betsTranscriptPatrick Kua: Hi everyone. Today we have Nickolas Means and Nickolas Means is an engineer turned engineering leader, who’s been leading teams at companies large and small for the last decade. He’s a student of disasters like airplane crashes and a fantastic storyteller, who I’ve been able to see and hear personally at several LeadDev conferences. He’s currently VP of engineering at Sym, which builds the most developer-friendly way to secure your production infrastructure and has his own podcast called Managing Up. Welcome to the podcast Nick.Nickolas Means: Thanks so much for having me on Pat. I’m excited to be here.Patrick Kua: Me too. You’ve got such an amazing set of experiences particularly leading other people. So could you give us a bit of a short overview of your leadership journey and maybe also when you started managing other managers?Nickolas Means: Yeah, for sure. So I spent about 10 years as an engineer. 6 or 7 of that at a small company where I was the only engineer. Also managed the phone systems and the warehouse systems and all the things. Then in a standard software team environment for a while. And got to see some different management approaches, some different cultures. Got to see some cultures that were pretty typical ten years ago. You know, very much the loudest voice in the room won the arguments. what we would consider tech bro culture now. And at the same time saw or heard a podcast recording featuring Alex Harms on agile communication. In that podcast, she introduced Brene Brown and the power of vulnerability. Brene’s famous TED talk that she did a while back. And all that got mashed together in my head and made me go, there has to be a better way to do this than what I’m seeing right now. There has to be a better way to lead teams than this yell until we reach consensus. So around that time I changed jobs. I intentionally, as I was changing spoke to my soon to be boss and said I really want to try my hand at management. And his response was well there’s only 4 engineers right now, so that doesn’t really make sense but I’ll keep that in mind as we grow. And lo and behold in less than a year I was in that first manager role. Fast forward a year from then our VP of Engineering had left. I’m still in the middle of trying to figure out how to be an engineering manager and I found myself promoted to VP Of Engineering and managing managers for the first time. Patrick Kua: This happens quite frequently. At that point, how many people did you have to manage in terms of managers.Nickolas Means: So at that point I had… There were 4 managers that I was managing and the overall dev team was around 20. Everybody was functioning as a tech lead. So all of the managers were in those fifty fifty roles where you’re supposed to do half coding and half leadership that never really quite seemed to work out that way.Patrick Kua: Got it. And then in terms of the experience of the managers. Were they similar to you in terms of just working out what this means?Nickolas Means: Pretty much. Yeah. I had one that had done a little bit of management before but everybody was similarly green and had been promoted from the ranks.Patrick Kua: Got it. And then how long had you been working with them before you transitioned into this role?Nickolas Means: Let’s see. I was one of the first 4 engineers hired and they would have all come in. I think the other managers all came in in the second crop of engineers we hired. so I’d been working with them all for at least a year at that point.Patrick Kua: Got it. Okay. I think one of those interesting dynamics is when your peers and then you move into managing them. That can sometimes be a bit awkward. How did that turn out for you and those people?Nickolas Means: Yeah. That was one of the things I was most concerned about moving into that actually. But one of the reasons I got the managing managers role in the first place was that I had been doing peer mentoring sessions all along with all of the other managers in the company. Selfishly, trying to learn myself. I was more motivated around comparing notes. What’s going well on your team? Here’s what’s going well on my team. But the initiative of setting up those peer mentoring sessions and the way that some of my management philosophy had grown through the organisation. My boss thought that I think you can probably do this role. I think it’s going to feel pretty natural to everybody if you step into it. So I don’t think that’s something you really should be worried about at all and that turned out to be the case.Patrick Kua: Great. I love the idea particularly of that peer mentoring idea. What were the mechanics of you running those sessions? What was their cadence and how did you run it? Was it a bit more ad hoc or was it planned?Nickolas Means: Yeah I mean I’m a big proponent of anything that you want to happen needs to be on your schedule. So they were all on my schedule on an every other week basis. And it was, I think, I just did 30 minute sessions. It was just really open agenda. What do you want to talk about? What’s going Well? What’s not going well? Here’s what I’m struggling with. Do you have any ideas that could help me? Really no formal format at all. Just peer mentoring and chatting.Patrick Kua: Great. Excellent. A great way of building community and also knowledge sharing across all of you.Nickolas Means: Yeah, it was really great. A lot of my early growth as a manager I would attribute to those peer mentoring sessions. Because you shift into that management role for the first time and suddenly you’re feeling pretty alone in a way that you may never have before professionally. You have to go and find that community somewhere. Because we don’t as humans don’t learn very well solitary. We need community to learn.Patrick Kua: Absolutely. Stepping into that VP of Engineering role, there’s one of you. So alone again. Where did you go for your support and how did you learn that now that you probably didn’t have a mentoring group around you?Nickolas Means: I didn’t at first. That was one of the big struggles. It was easier to find that community when there were other managers in the organisation that I could talk to. It probably meant that I kept that relationship a little bit more peer than I otherwise might have. Because I was still depending on the managers that I had had those peer relationships with all along to continue helping me grow and helping me figure out how to do my job. I was fortunate enough that they were gracious to help me do that. But really, the first time that I found that community was at LeadDev. When I spoke at LeadDev for the first time, suddenly I’m in a room full of people that are all facing the same struggles. None of which work at my company and I started building a good community there.Patrick Kua: Great. In terms of connecting to that community, what channels did you use and how often did you reach out to people?Nickolas Means: One of the reasons I got into speaking at conferences in the first place is that I’m a fairly hopeless introvert at big events like that. It was a way to conveniently bypass the small talk that introverts don’t really like to do most of the time. Because if you get on stage and you talk then suddenly people want to talk to you about the thing that you talked about on stage and you’re prepared to have that conversation. It’s much less social pressure. So some of the relationships that I formed at that first LeadDev, some of the folks that I met that first time, I would just reach out when I would hit choppy water and need help and try to figure out how to navigate something.Patrick Kua: That’s great. Yeah I mean I think we share quite a lot of similarities. That introvert thing. It’s very true, when you’re speaking, it makes it a lot easier for people to come to you around a topic instead of you having to break ice with people. I think a lot of people get surprised that a lot of speakers are actually introverts. Particularly at things like LeadDev where, you know, typical manager conference. People think everyone needs to be an extrovert which is often not the case. Nickolas Means: Yeah, absolutely. I mean I went to so many conferences and couldn’t figure out why people enjoyed conferences so much until I started speaking.Patrick Kua: I could definitely relate. Let’s talk a little bit about your first experiences when you were to reflect back on managing other managers. Were there any big surprises for you or what were some unknown unknowns when you went into that role?Nickolas Means: I mean I think that the thing that surprised me most was probably the feedback loop. When you step into being a manager for the first time I like to talk to new managers about what I call meta productivity. So this idea that you need to start finding satisfaction in the work that other people are doing. You need to be able to find your professional happiness in watching your team do great work versus typically, as an engineer, being happy with doing the work that you’re doing hands on. Well then you step into a managing manager’s role and suddenly you’re into meta meta productivity. Those feedback loops just grind to an absolute halt. It’s really difficult when you first start, or at least it was for me, when I first started managing managers to figure out, OK, how do I even have an impact in this role? What can I do that’s going to make a difference for anybody?Patrick Kua: Yeah, and if you were to maybe guess like time spans of feedback loop comparing maybe individual contributors and managers to managing managers, what were the relative sizes of those feedback loops for you?Nickolas Means: I mean I think when you’re managing managers some of it is dependent on the cadence at which your organisation operates. We were on a quarterly planning cycle and that was really the effective feedback loop that I could see for myself is, did we deliver software effectively this quarter? Did we deliver it more effectively than we did last quarter? Which itself is a very subjective measurement. I mean there’s no way to objectively say, oh yes, we absolutely did better this quarter than we did last quarter. So you’re still dealing with squishy stuff that you’re looking at and trying to find some truth in. But at least as a manager your cadence and improvement is 1-1 to 1-1. You can usually see somebody start to apply a little bit of what you say from 1-1 to the next. Managing managers, you’re generally not in planning meetings. You’re generally not in meetings that your managers are leading. I mean sometimes you drop in, but that like a Schrodinger’s thing. It tends to change the meeting when you show up. Patrick Kua: Absolutely.Nickolas Means: So if you’re there to observe it, it’s going to be a different meeting than if you weren’t there to observe it. Patrick Kua: Absolutely. Those power dynamics make a big difference.Nickolas Means: They do for sure and so it’s tough to get that feedback. Even the same feedback loop you get as a manager.Patrick Kua: Yeah, absolutely. One of the things that some managers of managers do are things like skip levels in terms of trying to shortcut some of the feedback loop and get direct stuff. Is that something that you were doing in that role back then and how frequent were you doing skip one to ones?Nickolas Means: It was. But I had so many people that I did maybe one a quarter with each of my report’s reports. So I could get a little bit. But you don’t get the longitudinal feedback that way. If I had a manager that was particularly having trouble, I might talk a little more frequently with their team lead and try to figure out what was going on in that situation. But really, I wasn’t doing a whole lot of that at that point. I would develop that skill set a little bit more later on in further managing managers’ roles than I did in that first one.Patrick Kua: Got it. Excellent. One other thing I heard you say which I think is what a lot of directors or VPs struggle with, is talking about that productivity and measuring. You often have this relative view of seeing these different teams. For you, what are some signals of things that you look for, knowing that teams are being more productive or how do you go about thinking about that philosophy today?Nickolas Means: That’s a great question. Again. It’s so tempting to look at metrics and let metrics guide you on this. They can be helpful but they always only tell part of the story. So anytime you see an anomaly in the metrics you have to dig in to try to figure out why that’s happening. The thing I tend to look for more than anything. I have a very high agency, high autonomy leadership style. That’s the style that I want the leaders that I manage to build as well. And so a lot of what I’m looking for is how fluidly is your team working. Are they getting along? Are they able to do projects together? Or is there this constant chaos bubbling up from the team that you manage because you’re really struggling to get them to work together? That for me has proven to be a pretty reliable leading indicator of how much work a team is going to be able to get done.Patrick Kua:"
