title = "Pricing: Mailchimp Transactional Email | Mandrill | Mailchimp"
description = """
Find pricing for transactional emails from Mailchimp. Determine your monthly cost
with our pricing calculator."""
full_description = '''Email Marketing Email Marketing Email & SMS New! Websites Transactional Email Email Marketing Email & SMS New! Websites Transactional Email Transactional email plans designed for developers What is Transactional Email? Transactional email plans designed for developers What is Transactional Email? Enter your estimated sends per month Dedicated IP for $29.95 / month (Optional) Your Plan Try for free* Each block is a credit for 25,000 emails Each block is a credit for 25,000 emails Total Blocks Emails per Month Price Per Block 1 to 20 blocks 1 to 500k emails $20/block 21 to 40 blocks 500k to 1M emails $18/block 41 to 80 blocks 1M to 2M emails $16/block 81 to 120 blocks 2M to 3M emails $14/block 121 to 160 blocks 3M to 4M emails $12/block 161+ blocks 4M+ emails $10/block *New transactional email users can get up to 500 free email sends to their verified domain. Restrictions apply. Learn more <p class="body"> <span class="h5"><sup>$</sup>{{total}}</span> /month | {{block_count}} {{block_plural}} @ ${{per_block}}/block </p> <p><span class="h4"><sup>$</sup>{{total}}</span></p> <p class="mini">Estimated Cost Per Month</p> <p class="mini">+ your <a href="/pricing/">Mailchimp Monthly Plan</a></p> <p class="body"><em>Really? That&rsquo;s <a href="http://hyperboleandahalf.blogspot.com/2010/04/alot-is-better-than-you-at-everything.html" alt="alot is better than you at everything" target="_blank" rel="noopener noreferrer">alot</a> of emails.</em></p> <p class="body"> <span class="h5">+ {{cost}}</span> /month | Dedicated IP Address </p> Made for developers to send emails that reach inboxes Global infrastructure Benefit from automatic SPAM loop registration and pre-warmed dedicated IPs. Learn more Scalable analytics Get transactional email analytics from your dashboard, export API or webhooks. Learn more Email options Customize sending and receiving for your transactional emails. Learn more Developer guides Get started with guides and a deep knowledge base. Learn more API reference Use API documentation with all calls, parameters, and sample code. Learn more Start sending transactional emails Try for free Request a demo Restrictions apply. Learn more. FAQS What is a transactional email? A transactional email is an email that is sent to an individual recipient following a commercial transaction or specific action performed by that person, such as a purchase in your connected store or a password reset request. Do I need a Mailchimp account to send transactional emails? Yes, you need a Mailchimp account. Transactional Email is available as an add-on to Standard and Premium plans, or the legacy Monthly Plan. However, new transactional email users can try our free demo with certain limits. Learn more about the demo here What is included in the Transactional Email demo? New transactional email users can send up to 500 transactional emails to any email address on a verified domain—without buying transactional email blocks or upgrading a plan. For new Transactional Email users only. Learn more What payment methods do you offer? We accept all major credit cards, PayPal, and (in select countries) direct debit. We also support transactions in a range of currencies. Is pricing different for API or SMTP? No—the price is the same for sending emails using APIs or SMTP service. Can I buy email blocks smaller than 25,000 emails? No, we only have blocks with 25,000 emails. What happens if I run out of email blocks? Set your account to automatically purchase email blocks when you reach your predefined limit, or opt for an alert that you're running low. Transactional sends are calculated in real time, so the system will stop sending emails when you’re out of blocks. What happens to unused emails? Unused emails in a block don’t roll over month to month. What if I need help? Contact our award winning Support team, and they can take care of you. Contact support Mailchimp for agencies If you’re an agency, you probably want an agency account. Get Started You’ll be in good company'''
