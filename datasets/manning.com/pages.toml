description = "Manning is an independent publisher of computer books, videos, and courses."
full_description = "In Spring 2000 Manning was the first publisher to offer unprotected PDF eBooks and remained the only one to do so for several years. No longer did customers have to hassle with DRM schemes, nor wait for books to ship or have to make a trip to the bookstore -- a first step toward what proved to be a large shift in publishing was taken. The eBooks were sold from our website only, until we began offering ePubs for sale in Apple's iBookstore in November 2010. Unprotected PDF is also the format we used to launch our groundbreaking MEAP program, starting with Eclipse in Action in 2003. The first MEAPs were offered to the public after the manuscripts were developed, edited and typeset—that is, when they were nearly complete. Even though that gave our readers access to the content many months before publication, because our books are on cutting-edge topics they wanted even earlier access to them. Currently, the MEAP program gives readers unprotected PDFs of chapters as they are written. In May 2010, Manning began offering eBooks in ePub format as well as PDF. We were slow to adopt this new mobile format, thinking readers would not want to read technical books on screens as small as the iPhone's, but we recognized that we were wrong and have since embraced the mobile reading medium. We now include all available formats in the purchase of a Manning eBook. liveBook is our free online reading platform, offering instant access to all Manning books from any device. You can read the books you own in full and search the complete content of our entire library. liveBook also includes handy features such as bookmarks, commenting, one-click code copy, in-line exercises, and options for sharing content with other readers. Discover more on our About liveBook page. Exclusivity ---Our eBooks are only available on manning.com, in the Apple iBookstore, and at Safari Books Online. Books in MEAP are available ONLY from manning.com. Portability ---Why carry a printed copy, when you are already carrying your laptop, reading, or mobile device? Get a Manning eBook and add zero weight. You can download it many times, and you can put it on different devices."
