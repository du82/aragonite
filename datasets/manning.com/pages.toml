Implement DOD in Unity and other object-oriented engines</li>
</ul>

Modern games need to be smooth, high-framerate experiences with deep gameplay that keeps users hooked for years. Data-oriented design takes advantage of modern CPUs to upgrade game performance,  easily outpacing traditional object-oriented programming. DOD uses arrays instead of objects, avoids design patterns and subroutines, and utilizes pure atomic functions as much as possible. Plus, because you’re only thinking about data and logic, DOD-games take less manpower and time than building with OOP. Data-Oriented Design for Games</i> reveals how you can bring this powerful programming approach to your own projects. You’ll discover both the essential theory behind DOD, and put it into practice to develop a complete game project."""
