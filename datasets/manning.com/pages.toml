description = """
Use Data-Oriented Design to deliver games with outstanding performance while using less time and resources.</b>

Data-Oriented Design (DOD) has become standard practice for AAA games and indie devs who need to squeeze every drop of performance out of hardware and deliver games on a rapid schedule. DOD is a programming practice that streamlines the way your code accesses, stores, and uses data, taking advantage of modern CPU architecture and accelerating the dev process. Data-Oriented Design for Games</i> is a unique and comprehensive guide to architecting and coding games using DOD principles.

