full_description = "Obituary writing is more about life than death: the last word, a testament to a human contribution.Yet who gets remembered inherently involves judgment. To look back at the obituary archives can, therefore, be a stark lesson in how society valued various achievements and achievers.Since 1851, The New York Times has published thousands of obituaries: of heads of state, opera singers, the inventor of Stove Top stuffing and the namer of the Slinky. The vast majority chronicled the lives of men, mostly white ones; even in the last two years, just over one in five of our subjects were female. Charlotte Brontë wrote “Jane Eyre”; Emily Warren Roebling oversaw construction of the Brooklyn Bridge when her husband fell ill; Madhubala transfixed Bollywood; Ida B. Wells campaigned against lynching. Yet all of their deaths went unremarked in our pages, until now.Below you’ll find obituaries for these and others who left indelible marks but were nonetheless overlooked. We’ll be adding to this collection each week, as Overlooked becomes a regular feature in the obituaries section, and expanding our lens beyond women. One morning, when Gregor Samsa woke from troubled dreams, he found himself transformed in his bed into a horrible vermin. He lay on his armour-like back, and if he lifted his head a little he could see his brown belly, slightly domed and divided by arches into stiff sections. The bedding was hardly able to cover it and seemed ready to slide off any moment. His many legs, pitifully thin compared with the size of the rest of him, waved about helplessly as he looked. And it's a funny sort of business to be sitting up there at your desk, talking down at your subordinates from up there, especially when you have to go right up close because the boss is hard of hearing. Well, there's still some hope; once I've got the money together to pay off my parents' debt to him"
