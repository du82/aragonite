title = "Version v7.12.0 | Mantine"
description = "React components and hooks library with native dark theme support and focus on usability, accessibility and developer experience"
full_description = '''Version v7.12.0Release dateAugust 6th, 2024Source codeRelease on GitHubNotifications at any position It is now possible to display notifications at any position on the screen with @mantine/notifications package: top-lefttop-rightbottom-leftbottom-righttop-centerbottom-centerDemo.tsximport { Button } from '@mantine/core'; import { notifications } from '@mantine/notifications'; const positions = [ 'top-left', 'top-right', 'bottom-left', 'bottom-right', 'top-center', 'bottom-center', ] as const; function Demo() { const buttons = positions.map((position) => ( <Button key={position} onClick={() => notifications.show({ title: `Notification at ${position}`, message: `Notification at ${position} message`, position, }) } > {position} </Button> )); return <Group>{buttons}</Group>; }Expand code Subscribe to notifications state You can now subscribe to notifications state changes with useNotifications hook: Show notificationNotifications state[]Notifications queue[]Demo.tsxfunction Demo() { const [counter, { increment }] = useCounter(); const notificationsStore = useNotifications(); const showNotification = () => { notifications.show({ title: `Notification ${counter}`, message: 'Most notifications are added to queue', }); increment(); }; return ( <> <Button onClick={showNotification} mb="md"> Show notification </Button> <Text>Notifications state</Text> <Code block>{JSON.stringify(notificationsStore.notifications, null, 2)}</Code> <Text mt="md">Notifications queue</Text> <Code block>{JSON.stringify(notificationsStore.queue, null, 2)}</Code> </> ); }Expand code SemiCircleProgress component New SemiCircleProgress component: LabelFill directionRight to leftLeft to rightOrientationUpDownFilled segment colorSizeThicknessValueDemo.tsximport { SemiCircleProgress } from '@mantine/core'; function Demo() { return ( <SemiCircleProgress fillDirection="left-to-right" orientation="up" filledSegmentColor="blue" size={200} thickness={12} value={40} label="Label" /> ); }Expand code Tree checked state Tree component now supports checked state: srcnode_modulespackage.jsontsconfig.jsonDemo.tsxdata.tsimport { IconChevronDown } from '@tabler/icons-react'; import { Checkbox, Group, RenderTreeNodePayload, Tree } from '@mantine/core'; import { data } from './data'; const renderTreeNode = ({ node, expanded, hasChildren, elementProps, tree, }: RenderTreeNodePayload) => { const checked = tree.isNodeChecked(node.value); const indeterminate = tree.isNodeIndeterminate(node.value); return ( <Group gap="xs" {...elementProps}> <Checkbox.Indicator checked={checked} indeterminate={indeterminate} onClick={() => (!checked ? tree.checkNode(node.value) : tree.uncheckNode(node.value))} /> <Group gap={5} onClick={() => tree.toggleExpanded(node.value)}> <span>{node.label}</span> {hasChildren && ( <IconChevronDown size={14} style={{ transform: expanded ? 'rotate(180deg)' : 'rotate(0deg)' }} /> )} </Group> </Group> ); }; function Demo() { return <Tree data={data} levelOffset={23} expandOnClick={false} renderNode={renderTreeNode} />; }Expand code Disable specific features in postcss-preset-mantine You can now disable specific features of the postcss-preset-mantine by setting them to false in the configuration object. This feature is available starting from postcss-preset-mantine@1.17.0. module.exports = { 'postcss-preset-mantine': { features: { // Turn off `light-dark` function lightDarkFunction: false, // Turn off `postcss-nested` plugin nested: false, // Turn off `lighten`, `darken` and `alpha` functions colorMixAlpha: false, // Turn off `rem` and `em` functions remEmFunctions: false, // Turn off `postcss-mixins` plugin mixins: false, }, }, }; Help Center updates Server components guide has been updated to include Component.extend usage in server components. A guide on applying input focus styles has been updated to work correctly with PasswordInput and other components in which the input selector is not used for actual input element. The guide on how to disable all inputs in the form now includes additional instructions for use-form. New Can I have color schemes other than light and dark? guide explains the difference between color scheme and theme and why Mantine does not support custom color schemes. New Why VSCode cannot autoimport Text component? guide explains why VSCode cannot automatically import Text component. New Are Mantine components accessible? question New How can I focus the first input with error with use-form? question New How to scroll to the top of the form if the form is submitted with errors? question New Why my notifications are displayed at a wrong position? question New Why my screen is completely empty after I've added notifications package? question New Why can I not use value/label data structure with Autocomplete/TagsInput? question New Why FileButton does not work in Menu? question New How can I display different elements in light and dark color schemes? question Other changes use-interval hook now supports autoInvoke option to start the interval automatically when the component mounts. use-form with mode="uncontrolled" now triggers additional rerender when dirty state changes to allow subscribing to form state changes. ScrollArea component now supports onTopReached and onBottomReached props. The functions are called when the user scrolls to the top or bottom of the scroll area. Accordion.Panel component now supports onTransitionEnd prop that is called when the panel animation completes. PreviousVersion v7.13.0NextVersion v7.11.0Welcome to Mantine, React components library that you always wished forBuild fully functional accessible web applications faster than everAboutContributeAbout MantineChangelogGitHub ReleasesCommunityChat on DiscordFollow on XFollow on GithubGitHub discussionsProjectMantine UIHelp CenterGithub organizationnpm organizationBuilt by Vitaly Rtishchev and these awesome peopleJoin Discord communityFollow Mantine on X'''
