title = "Version v7.17.0 | Mantine"
description = "React components and hooks library with native dark theme support and focus on usability, accessibility and developer experience"
full_description = '''Version v7.17.0Release dateFebruary 18th, 2025Source codeRelease on GitHubPortal reuseTargetNode prop Portal component now supports reuseTargetNode prop which allows to reuse the same target node for all instances. This option is more performant than the previous behavior, it is recommended to be enabled. This option will be enabled by default in the 8.0 major release. To enable reuseTargetNode option in all components that depend on Portal, add the following code to your theme: import { createTheme, Portal } from '@mantine/core'; export const theme = createTheme({ components: { Portal: Portal.extend({ defaultProps: { reuseTargetNode: true, }, }), } }); Example usage. In the following example, all three paragraphs will be rendered in the same target node: import { Portal } from '@mantine/core'; function Demo() { return ( <> <Portal reuseTargetNode> <p>First</p> </Portal> <Portal reuseTargetNode> <p>Second</p> </Portal> <Portal reuseTargetNode> <p>Third</p> </Portal> </> ); } use-form formRootRule formRootRule is a special rule path that can be used to validate objects and arrays alongside with their nested fields. For example, it is useful when you want to capture a list of values, validate each value individually and then validate the list itself to not be empty: NameStatusActiveAdd employeeSubmitDemo.tsximport { IconTrash } from '@tabler/icons-react'; import { ActionIcon, Button, Group, Switch, Text, TextInput } from '@mantine/core'; import { formRootRule, isNotEmpty, useForm } from '@mantine/form'; import { randomId } from '@mantine/hooks'; function Demo() { const form = useForm({ mode: 'uncontrolled', initialValues: { employees: [{ name: '', active: false, key: randomId() }], }, validate: { employees: { [formRootRule]: isNotEmpty('At least one employee is required'), name: isNotEmpty('Name is required'), }, }, }); const fields = form.getValues().employees.map((item, index) => ( <Group key={item.key} mt="xs"> <TextInput placeholder="John Doe" withAsterisk style={{ flex: 1 }} key={form.key(`employees.${index}.name`)} {...form.getInputProps(`employees.${index}.name`)} /> <Switch label="Active" key={form.key(`employees.${index}.active`)} {...form.getInputProps(`employees.${index}.active`, { type: 'checkbox' })} /> <ActionIcon color="red" onClick={() => form.removeListItem('employees', index)}> <IconTrash size={16} /> </ActionIcon> </Group> )); return ( <form onSubmit={form.onSubmit(() => {})}> {fields.length > 0 ? ( <Group mb="xs"> <Text fw={500} size="sm" style={{ flex: 1 }}> Name </Text> <Text fw={500} size="sm" pr={90}> Status </Text> </Group> ) : ( <Text c="dimmed" ta="center"> No one here... </Text> )} {fields} {form.errors.employees && ( <Text c="red" size="sm" mt="sm"> {form.errors.employees} </Text> )} <Group justify="space-between" mt="md"> <Button variant="default" onClick={() => { form.insertListItem('employees', { name: '', active: false, key: randomId() }); form.clearFieldError('employees'); }} > Add employee </Button> <Button type="submit">Submit</Button> </Group> </form> ); }Expand code Another example is to validate an object fields combination: First nameLast nameSubmitDemo.tsximport { Button, Text, TextInput } from '@mantine/core'; import { formRootRule, isNotEmpty, useForm } from '@mantine/form'; function Demo() { const form = useForm({ mode: 'uncontrolled', initialValues: { user: { firstName: '', lastName: '', }, }, validate: { user: { [formRootRule]: (value) => value.firstName.trim().length > 0 && value.firstName === value.lastName ? 'First name and last name cannot be the same' : null, firstName: isNotEmpty('First name is required'), lastName: isNotEmpty('Last name is required'), }, }, }); return ( <form onSubmit={form.onSubmit(() => {})}> <TextInput label="First name" placeholder="First name" {...form.getInputProps('user.firstName')} /> <TextInput label="Last name" placeholder="Last name" mt="md" {...form.getInputProps('user.lastName')} /> {form.errors.user && ( <Text c="red" mt={5} fz="sm"> {form.errors.user} </Text> )} <Button type="submit" mt="lg"> Submit </Button> </form> ); }Expand code isJSONString and isNotEmptyHTML form validators New isJSONString and isNotEmptyHTML form validators: isNotEmptyHTML checks that form value is not an empty HTML string. Empty string, string with only HTML tags and whitespace are considered to be empty. isJSONString checks that form value is a valid JSON string. import { isJSONString, useForm } from '@mantine/form'; const form = useForm({ mode: 'uncontrolled', initialValues: { json: '', html: '', }, validate: { json: isJSONString('Invalid JSON string'), html: isNotEmptyHTML('HTML cannot be empty'), }, }); Popover onDismiss Popover now supports onDismiss prop, which makes it easier to subscribe to outside clicks and escape key presses to close popover: import { useState } from 'react'; import { Button, Popover } from '@mantine/core'; function Demo() { const [opened, setOpened] = useState(false); return ( <Popover opened={opened} onDismiss={() => setOpened(false)} > <Popover.Target> <Button onClick={() => setOpened((o) => !o)}> Toggle popover </Button> </Popover.Target> <Popover.Dropdown>Dropdown</Popover.Dropdown> </Popover> ); } MantineProvider env MantineProvider component now supports env prop. It can be used in test environment to disable some features that might impact tests and/or make it harder to test components: transitions that mount/unmount child component with delay portals that render child component in a different part of the DOM To enable test environment, set env to test: import { MantineProvider } from '@mantine/core'; function Demo() { return ( <MantineProvider env="test"> {/* Your app here */} </MantineProvider> ); } use-file-dialog hook New use-file-dialog allows capturing one or more files from the user without file input element: Pick filesDemo.tsximport { Button, Group, List } from '@mantine/core'; import { useFileDialog } from '@mantine/hooks'; function Demo() { const fileDialog = useFileDialog(); const pickedFiles = Array.from(fileDialog.files || []).map((file) => ( <List.Item key={file.name}>{file.name}</List.Item> )); return ( <div> <Group> <Button onClick={fileDialog.open}>Pick files</Button> {pickedFiles.length > 0 && ( <Button variant="default" onClick={fileDialog.reset}> Reset </Button> )} </Group> {pickedFiles.length > 0 && <List mt="lg">{pickedFiles}</List>} </div> ); }Expand code Remix deprecation Remix is deprecated, the documentation related to Remix integration was removed, use React Router instead. To simplify maintenance, Remix/React Router templates were archived and will not be updated. Help center updates I get hydration warning about data-mantine-color-scheme attribute, what does it mean? question How can I apply styles to all Mantine components? question Other changes Tooltip now supports customizing middlewares ScrollArea now supports overscrollBehavior prop Affix now supports theme.spacing values for position prop Anchor now supports underline="not-hover" option to display underline only when the link is not hovered PreviousRich text editorNextVersion v7.16.0Welcome to Mantine, React components library that you always wished forBuild fully functional accessible web applications faster than everAboutContributeAbout MantineChangelogGitHub ReleasesCommunityChat on DiscordFollow on XFollow on GithubGitHub discussionsProjectMantine UIHelp CenterGithub organizationnpm organizationBuilt by Vitaly Rtishchev and these awesome peopleJoin Discord communityFollow Mantine on X'''
