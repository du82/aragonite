title = "MantineProvider | Mantine"
description = "React components and hooks library with native dark theme support and focus on usability, accessibility and developer experience"
full_description = '''MantineProvider MantineProvider provides a theme object context value, manages color scheme changes and injects CSS variables. It must be rendered at the root of your application and should be used only once. Usage import { createTheme, MantineProvider } from '@mantine/core'; const theme = createTheme({ /** Your theme override here */ }); function Demo() { return ( <MantineProvider theme={theme}> {/* Your app here */} </MantineProvider> ); } MantineProvider props MantineProvider supports the following props: interface MantineProviderProps { /** Theme override object */ theme?: MantineThemeOverride; /** Used to retrieve/set color scheme value in external storage, by default uses `window.localStorage` */ colorSchemeManager?: MantineColorSchemeManager; /** Default color scheme value used when `colorSchemeManager` cannot retrieve value from external storage, `light` by default */ defaultColorScheme?: MantineColorScheme; /** Forces color scheme value, if set, MantineProvider ignores `colorSchemeManager` and `defaultColorScheme` */ forceColorScheme?: 'light' | 'dark'; /** CSS selector to which CSS variables should be added, `:root` by default */ cssVariablesSelector?: string; /** Determines whether theme CSS variables should be added to given `cssVariablesSelector`, `true` by default */ withCssVariables?: boolean; /** Determines whether CSS variables should be deduplicated: if CSS variable has the same value as in default theme, it is not added in the runtime. `true` by default. */ deduplicateCssVariables?: boolean; /** Function to resolve root element to set `data-mantine-color-scheme` attribute, must return undefined on server, `() => document.documentElement` by default */ getRootElement?: () => HTMLElement | undefined; /** A prefix for components static classes (for example {selector}-Text-root), `mantine` by default */ classNamesPrefix?: string; /** Function to generate nonce attribute added to all generated `<style />` tags */ getStyleNonce?: () => string; /** Function to generate CSS variables based on theme object */ cssVariablesResolver?: CSSVariablesResolver; /** Determines whether components should have static classes, for example, `mantine-Button-root`. `true` by default */ withStaticClasses?: boolean; /** Determines whether global classes should be added with `<style />` tag. Global classes are required for `hiddenFrom`/`visibleFrom` and `lightHidden`/`darkHidden` props to work. `true` by default. */ withGlobalClasses?: boolean; /** Environment at which the provider is used, `'test'` environment disables all transitions and portals */ env?: 'default' | 'test'; /** Your application */ children?: React.ReactNode; } theme Pass theme object override to theme prop. It will be merged with the default theme and used in all components. import { createTheme, MantineProvider } from '@mantine/core'; const theme = createTheme({ fontFamily: 'Open Sans, sans-serif', primaryColor: 'cyan', }); function Demo() { return ( <MantineProvider theme={theme}> {/* Your app here */} </MantineProvider> ); } colorSchemeManager colorSchemeManager is used to retrieve and set color scheme value in external storage. By default, MantineProvider uses window.localStorage to store color scheme value, but you can pass your own implementation to colorSchemeManager prop. You can learn more about color scheme management in the color schemes guide. import { localStorageColorSchemeManager, MantineProvider, } from '@mantine/core'; const colorSchemeManager = localStorageColorSchemeManager({ key: 'my-app-color-scheme', }); function Demo() { return ( <MantineProvider colorSchemeManager={colorSchemeManager}> {/* Your app here */} </MantineProvider> ); } defaultColorScheme defaultColorScheme value is used when colorSchemeManager cannot retrieve the value from external storage, for example during server side rendering or when the user hasn't selected a preferred color scheme. Possible values are light, dark and auto. By default, color scheme value is light. You can learn more about color scheme management in the color schemes guide. import { MantineProvider } from '@mantine/core'; function Demo() { return ( <MantineProvider defaultColorScheme="dark"> {/* Your app here */} </MantineProvider> ); } cssVariablesSelector cssVariablesSelector is a CSS selector to which CSS variables should be added. By default, it is :root. MantineProvider generates CSS variables based on given theme override and cssVariablesResolver, then these variables are rendered into <style /> tag next to your application. You can learn more about Mantine CSS variables in the CSS variables guide. import { MantineProvider } from '@mantine/core'; function Demo() { return ( <MantineProvider cssVariablesSelector="html"> {/* Your app here */} </MantineProvider> ); } withCssVariables withCssVariables determines whether theme CSS variables should be added to given cssVariablesSelector. By default, it is set to true, you should not change it unless you want to manage CSS variables via .css file (Note that in this case you will need to generate all theme tokens that are not a part of the default theme on your side). import { MantineProvider } from '@mantine/core'; function Demo() { return ( <MantineProvider withCssVariables={false}> {/* Your app here */} </MantineProvider> ); } deduplicateCssVariables deduplicateCssVariables determines whether CSS variables should be deduplicated: if CSS variable has the same value as in default theme, it is not added in the runtime. By default, it is set to true. If set to false, all Mantine CSS variables will be added in <style /> tag even if they have the same value as in the default theme. import { MantineProvider } from '@mantine/core'; function Demo() { return ( <MantineProvider deduplicateCssVariables={false}> {/* Your app here */} </MantineProvider> ); } getRootElement getRootElement is a function that returns the root application (usually html) element to set data-mantine-color-scheme attribute. Default value is () => document.documentElement which means that data-mantine-color-scheme attribute will be added to <html /> tag. You can learn more about color scheme management in the color schemes guide. import { MantineProvider } from '@mantine/core'; const getRootElement = () => typeof window === 'undefined' ? undefined : document.body; function Demo() { return ( <MantineProvider getRootElement={getRootElement}> {/* Your app here */} </MantineProvider> ); } classNamesPrefix classNamesPrefix is a prefix for components static classes (for example {selector}-Text-root). Default value is mantine – all components will have mantine- prefix in their static classes. import { MantineProvider, Text } from '@mantine/core'; function Demo() { return ( <MantineProvider> <Text>Just some text</Text> </MantineProvider> ); } In this case (default classNamesPrefix), Text component will have the following classes: mantine-focus-auto – global utility class m-3nrA4eL – component class, usually a random string, with this class library styles are applied mantine-Text-root – component static class, part of Styles API With classNamesPrefix you can change only static class: import { MantineProvider, Text } from '@mantine/core'; function Demo() { return ( <MantineProvider classNamesPrefix="app"> <Text>Just some text</Text> </MantineProvider> ); } Now Text component will have the following classes: mantine-focus-auto – classNamesPrefix does not impact global utility classes – it is static and cannot be changed m-3nrA4eL – classNamesPrefix does not impact library class – it is static and cannot be changed app-Text-root – component static class has classNamesPrefix instead of mantine withStaticClasses withStaticClasses determines whether components should have static classes, for example, mantine-Button-root. By default, static classes are enabled, to disable them set withStaticClasses to false: import { MantineProvider } from '@mantine/core'; function Demo() { return ( <MantineProvider withStaticClasses={false}> {/* Your app here */} </MantineProvider> ); } withGlobalClasses withGlobalClasses determines whether global classes should be added with <style /> tag. Global classes are required for hiddenFrom/visibleFrom and lightHidden/darkHidden props to work. By default, global classes are enabled, to disable them set withGlobalClasses to false. Note that disabling global classes may break styles of some components. import { MantineProvider } from '@mantine/core'; function Demo() { return ( <MantineProvider withGlobalClasses={false}> {/* Your app here */} </MantineProvider> ); } getStyleNonce getStyleNonce is a function to generate nonce attribute added to dynamic generated <style /> tags. cssVariablesResolver cssVariablesResolver is a function to generate CSS variables styles based on the theme object. You can learn more about Mantine CSS variables in the CSS variables guide. env env prop can be used in test environment to disable some features that might impact tests and/or make it harder to test components: transitions that mount/unmount child component with delay portals that render child component in a different part of the DOM To enable test environment, set env to test: import { MantineProvider } from '@mantine/core'; function Demo() { return ( <MantineProvider env="test"> {/* Your app here */} </MantineProvider> ); } Note that env="test" is indented to be used in test environment only with Jest or Vitest, do not use it in the development or production environments. It is also not recommended to be used with end-to-end testing tools like Cypress or Playwright.NextTheme objectWelcome to Mantine, React components library that you always wished forBuild fully functional accessible web applications faster than everAboutContributeAbout MantineChangelogGitHub ReleasesCommunityChat on DiscordFollow on XFollow on GithubGitHub discussionsProjectMantine UIHelp CenterGithub organizationnpm organizationBuilt by Vitaly Rtishchev and these awesome peopleJoin Discord communityFollow Mantine on X'''
