title = "Functions reference | Mantine"
description = "React components and hooks library with native dark theme support and focus on usability, accessibility and developer experience"
full_description = "Functions reference This guides contains a list of functions exported from Mantine packages that are not documented anywhere else. clamp clamp function is exported from @mantine/hooks. It clamps number within the inclusive lower and upper bounds. import { clamp } from '@mantine/hooks'; // With both min and max boundaries clamp(10, 0, 5); // 5 clamp(100, 0, 5); // 5 clamp(-100, 0, 5); // 0 // With only min boundary clamp(10, 0, undefined); // 10 clamp(-100, 0, undefined); // 0 // With only max boundary clamp(0, undefined, 5); // 0 clamp(10, undefined, 5); // 5 lowerFirst lowerFirst function is exported from @mantine/hooks. It converts first character of a string to lower case. import { lowerFirst } from '@mantine/hooks'; lowerFirst('Mantine'); // mantine lowerFirst('mantine'); // mantine upperFirst upperFirst function is exported from @mantine/hooks. It converts first character of a string to upper case. import { upperFirst } from '@mantine/hooks'; upperFirst('Mantine'); // Mantine upperFirst('mantine'); // Mantine randomId randomId function is exported from @mantine/hooks. It generates random id with mantine- prefix. import { randomId } from '@mantine/hooks'; randomId(); // mantine-d7h137oav randomId(); // mantine-1q2j3j4j5 range range function is exported from @mantine/hooks. It generates array of numbers from start to end (inclusive). import { range } from '@mantine/hooks'; range(0, 5); // [0, 1, 2, 3, 4, 5] range(5, 0); // [5, 4, 3, 2, 1, 0] shallowEqual shallowEqual function is exported from @mantine/hooks. It performs shallow equal check of two objects. import { shallowEqual } from '@mantine/hooks'; shallowEqual({ a: 1 }, { a: 1 }); // true shallowEqual({ a: 1 }, { a: 2 }); // falsePreviousTesting with VitestNext6.x to 7.x migrationWelcome to Mantine, React components library that you always wished forBuild fully functional accessible web applications faster than everAboutContributeAbout MantineChangelogGitHub ReleasesCommunityChat on DiscordFollow on XFollow on GithubGitHub discussionsProjectMantine UIHelp CenterGithub organizationnpm organizationBuilt by Vitaly Rtishchev and these awesome peopleJoin Discord communityFollow Mantine on X"
