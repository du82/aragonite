title = "Usage with Redwood | Mantine"
description = "React components and hooks library with native dark theme support and focus on usability, accessibility and developer experience"
full_description = '''Usage with RedwoodJS Get started with a templateThe easiest way to get started is to use one of the templates. All templates are configured correctly: they include PostCSS setup, ColorSchemeScript and other essential features. Some templates also include additional features like Jest, Storybook and ESLint.If you are not familiar with GitHub, you can find a detailed instruction on how to bootstrap a project from a template on this page.redwood-templateRedwoodJS template with basic setupUse template Generate new application Follow Redwood getting started guide guide to create new Redwood application: yarn create redwood-app my-redwood-project --typescript Installation Note that it is recommended to use yarn instead of npm to install dependencies. Open web directory before installing dependencies: cd web Choose packages that you will use in your application:PackageDescription@mantine/hooksHooks for state and UI management@mantine/coreCore components library: inputs, buttons, overlays, etc.@mantine/formForm management library@mantine/datesDate inputs, calendars@mantine/chartsRecharts based charts library@mantine/notificationsNotifications system@mantine/code-highlightCode highlight with your theme colors and styles@mantine/tiptapRich text editor based on Tiptap@mantine/dropzoneCapture files with drag and drop@mantine/carouselEmbla based carousel component@mantine/spotlightOverlay command center@mantine/modalsCentralized modals manager@mantine/nprogressNavigation progressInstall dependencies:yarnnpmyarn add @mantine/core @mantine/hooksExpand code PostCSS setup Install PostCSS plugins and postcss-preset-mantine: yarnnpmyarn add --dev postcss postcss-preset-mantine postcss-simple-varsExpand code Create postcss.config.js file in web directory with the following content: module.exports = { plugins: { 'postcss-preset-mantine': {}, 'postcss-simple-vars': { variables: { 'mantine-breakpoint-xs': '36em', 'mantine-breakpoint-sm': '48em', 'mantine-breakpoint-md': '62em', 'mantine-breakpoint-lg': '75em', 'mantine-breakpoint-xl': '88em', }, }, }, }; Setup Add styles imports, MantineProvider and ColorSchemeScript to web/src/App.tsx file: // Import styles of packages that you've installed. // All packages except `@mantine/hooks` require styles imports import '@mantine/core/styles.css'; import { FatalErrorBoundary, RedwoodProvider } from '@redwoodjs/web'; import { RedwoodApolloProvider } from '@redwoodjs/web/apollo'; import FatalErrorPage from 'src/pages/FatalErrorPage'; import Routes from 'src/Routes'; import { ColorSchemeScript, MantineProvider } from '@mantine/core'; const App = () => ( <FatalErrorBoundary page={FatalErrorPage}> <RedwoodProvider titleTemplate="%PageTitle | %AppTitle"> <ColorSchemeScript /> <MantineProvider> <RedwoodApolloProvider> <Routes /> </RedwoodApolloProvider> </MantineProvider> </RedwoodProvider> </FatalErrorBoundary> ); export default App; All set! Start development server: yarn rw devPreviousUsage with GatsbyNextUsage with StorybookWelcome to Mantine, React components library that you always wished forBuild fully functional accessible web applications faster than everAboutContributeAbout MantineChangelogGitHub ReleasesCommunityChat on DiscordFollow on XFollow on GithubGitHub discussionsProjectMantine UIHelp CenterGithub organizationnpm organizationBuilt by Vitaly Rtishchev and these awesome peopleJoin Discord communityFollow Mantine on X'''
