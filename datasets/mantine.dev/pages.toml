title = "Version v7.5.0 | Mantine"
description = "React components and hooks library with native dark theme support and focus on usability, accessibility and developer experience"
full_description = '''Version v7.5.0Release dateJanuary 26th, 2024Source codeRelease on GitHubDonutChart component New DonutChart component: Demo.tsxdata.tsimport { DonutChart } from '@mantine/charts'; import { data } from './data'; function Demo() { return <DonutChart data={data} />; }Expand code PieChart component New PieChart component: Demo.tsxdata.tsimport { PieChart } from '@mantine/charts'; import { data } from './data'; function Demo() { return <PieChart data={data} />; }Expand code @mantine/dates value formatter DatePickerInput, MonthPickerInput and YearPickerInput now support valueFormatter prop. valueFormatter is a more powerful alternative to valueFormat prop. It allows formatting value label with a custom function. The function is the same for all component types (default, multiple and range) – you need to perform additional checks inside the function to handle different types. Example of using a custom formatter function with type="multiple": Pick 2 dates or morePick 2 dates or moreDemo.tsximport dayjs from 'dayjs'; import { useState } from 'react'; import { DatePickerInput, DateFormatter } from '@mantine/dates'; const formatter: DateFormatter = ({ type, date, locale, format }) => { if (type === 'multiple' && Array.isArray(date)) { if (date.length === 1) { return dayjs(date[0]).locale(locale).format(format); } if (date.length > 1) { return `${date.length} dates selected`; } return ''; } return ''; }; function Demo() { const [value, setValue] = useState<Date[]>([]); return ( <DatePickerInput label="Pick 2 dates or more" placeholder="Pick 2 dates or more" value={value} onChange={setValue} type="multiple" valueFormatter={formatter} /> ); }Expand code @mantine/dates consistent weeks You can now force each month to have 6 weeks by setting consistentWeeks: true on DatesProvider. This is useful if you want to avoid layout shifts when month changes. March 2025MoTuWeThFrSaSu242526272812345678910111213141516171819202122232425262728293031123456Demo.tsximport { DatePicker, DatesProvider } from '@mantine/dates'; function Demo() { return ( <DatesProvider settings={{ consistentWeeks: true }}> <DatePicker /> </DatesProvider> ); }Expand code Charts series label It is now possible to change series labels with label property in series object. This feature is supported in AreaChart, BarChart and LineChart components. Demo.tsxdata.tsimport { AreaChart } from '@mantine/charts'; import { data } from './data'; function Demo() { return ( <AreaChart h={300} data={data} dataKey="date" type="stacked" withLegend legendProps={{ verticalAlign: 'bottom' }} series={[ { name: 'Apples', label: 'Apples sales', color: 'indigo.6' }, { name: 'Oranges', label: 'Oranges sales', color: 'blue.6' }, { name: 'Tomatoes', label: 'Tomatoes sales', color: 'teal.6' }, ]} /> ); }Expand code Charts value formatter All @mantine/charts components now support valueFormatter prop, which allows formatting value that is displayed on the y axis and inside the tooltip. Demo.tsxdata.tsimport { AreaChart } from '@mantine/charts'; import { data } from './data'; function Demo() { return ( <AreaChart h={300} data={data} dataKey="date" type="stacked" valueFormatter={(value) => new Intl.NumberFormat('en-US').format(value)} series={[ { name: 'Apples', color: 'indigo.6' }, { name: 'Oranges', color: 'blue.6' }, { name: 'Tomatoes', color: 'teal.6' }, ]} /> ); }Expand code Headings text wrap New Title textWrap prop sets text-wrap CSS property. It controls how text inside an element is wrapped. Lorem, ipsum dolor sit amet consectetur adipisicing elit. Quasi voluptatibus inventore iusto cum dolore molestiae perspiciatis! Totam repudiandae impedit maxime!Text wrapWrapBalanceDemo.tsximport { Title } from '@mantine/core'; function Demo() { return ( <Title order={3} textWrap="wrap"> Lorem, ipsum dolor sit amet consectetur adipisicing elit. Quasi voluptatibus inventore iusto cum dolore molestiae perspiciatis! Totam repudiandae impedit maxime! </Title> ); }Expand code You can also set textWrap on theme: import { createTheme, MantineProvider, Title } from '@mantine/core'; const theme = createTheme({ headings: { textWrap: 'wrap', }, }); function Demo() { return ( <MantineProvider theme={theme}> <Title>Some very long title that should wrap</Title> </MantineProvider> ); } If set on theme, textWrap is also applied to headings in TypographyStylesProvider mod prop All components now support mod prop, which allows adding data attributes to the root element: import { Box } from '@mantine/core'; <Box mod="data-button" />; // -> <div data-button /> <Box mod={{ opened: true }} />; // -> <div data-opened /> <Box mod={{ opened: false }} />; // -> <div /> <Box mod={['button', { opened: true }]} />; // -> <div data-button data-opened /> <Box mod={{ orientation: 'horizontal' }} />; // -> <div data-orientation="horizontal" /> Documentation updates New testing with Vitest guide NativeSelect with dividers demo Popover shift and flip middlewares documentation Combobox props related to Popover documentation Loading styles from CDN guide Anchor now includes additional documentation on how to use Text props Pagination now includes props tables for all compound components A more detailed breakdown of browser support has been added to the about page Help center updates New articles added to the help center: Can I use Mantine with Astro? How can I contribute to the library? How can I add dynamic CSS styles? How can I load fonts in Next.js? How can I load fonts in Vite? Is there a floating action button component? How to change inputs placeholder color? I do not have styles in my dates components... Other changes Checkbox.Group, Radio.Group and Switch.Group now support readOnly prop ActionIcon now has loading state animation SegmentedControl now supports withItemsBorder prop which allows removing border between items Progress now supports transitionDuration prop which controls section width animation duration Textarea and JsonInput components now support resize prop, which allows setting resize CSS property on the input @mantine/hooks package now exports readLocalStorageValue and readSessionStorageValue function to get value from storage outside of React components PreviousVersion v7.6.0NextVersion v7.4.0Welcome to Mantine, React components library that you always wished forBuild fully functional accessible web applications faster than everAboutContributeAbout MantineChangelogGitHub ReleasesCommunityChat on DiscordFollow on XFollow on GithubGitHub discussionsProjectMantine UIHelp CenterGithub organizationnpm organizationBuilt by Vitaly Rtishchev and these awesome peopleJoin Discord communityFollow Mantine on X'''
