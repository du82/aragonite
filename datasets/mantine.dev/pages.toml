title = "Colors | Mantine"
description = "React components and hooks library with native dark theme support and focus on usability, accessibility and developer experience"
full_description = '''Colors Mantine uses open-color in default theme with some additions. Each color has 10 shades. Colors are exposed on the theme object as an array of strings, you can access color shade by color name and index (0-9), colors with larger index are darker: import { useMantineTheme } from '@mantine/core'; function Demo() { const theme = useMantineTheme(); return ( <div style={{ backgroundColor: theme.colors.blue[1], color: theme.colors.blue[9], }} > This is a blue theme </div> ); } Colors are also exposed as CSS variables: .demo { color: var(--mantine-color-red-5); background: var(--mantine-color-grape-9); border: rem(1px) solid var(--mantine-color-blue-1); } Adding extra colors You can add any number of extra colors to theme.colors object. This will allow you to use them in all components that support color prop, for example Button, Badge and Switch. Ocean blue buttonBright pink buttonDemo.tsximport { Group, Button, MantineProvider, createTheme } from '@mantine/core'; const theme = createTheme({ colors: { 'ocean-blue': ['#7AD1DD', '#5FCCDB', '#44CADC', '#2AC9DE', '#1AC2D9', '#11B7CD', '#09ADC3', '#0E99AC', '#128797', '#147885'], 'bright-pink': ['#F0BBDD', '#ED9BCF', '#EC7CC3', '#ED5DB8', '#F13EAF', '#F71FA7', '#FF00A1', '#E00890', '#C50E82', '#AD1374'], }, }); function Demo() { return ( <MantineProvider theme={theme}> <Group> <Button color="ocean-blue">Ocean blue button</Button> <Button color="bright-pink" variant="filled"> Bright pink button </Button> </Group> </MantineProvider> ); }Expand code 10 shades per color Colors override must include at least 10 shades per color. Otherwise, you will get a TypeScript error and some variants will not have proper colors. If you only have one color value, you can either pick the remaining colors manually or use the colors generator tool. You can add more than 10 shades per color: these values will not be used by Mantine components with the default colors resolver, but you can still reference them by index, for example, color="blue.11". Virtual colors Virtual color is a special color which values should be different for light and dark color schemes. To define a virtual color, use virtualColor function which accepts an object with the following properties as a single argument: name – color name, must be the same as the key in theme.colors object light – a key of theme.colors object for light color scheme dark – a key of theme.colors object for dark color scheme To see the demo in action, switch between light and dark color schemes (Ctrl + J): This box has virtual background color, it is pink in dark mode and cyan in light modeApp.tsxDemo.tsximport { createTheme, MantineProvider, virtualColor } from '@mantine/core'; import { Demo } from './Demo'; const theme = createTheme({ colors: { primary: virtualColor({ name: 'primary', dark: 'pink', light: 'cyan', }), }, }); function App() { return ( <MantineProvider theme={theme}> <Demo /> </MantineProvider> ); }Expand code colorsTuple Use colorsTuple function to: Use single color as the same color for all shades Transform dynamic string arrays to Mantine color tuple (the array should still have 10 values) import { colorsTuple, createTheme } from '@mantine/core'; const theme = createTheme({ colors: { custom: colorsTuple('#FFC0CB'), dynamic: colorsTuple( Array.from({ length: 10 }, (_, index) => '#FFC0CB') ), }, }); Supported color formats You can use the following color formats in theme.colors: HEX: #fff, #ffffff RGB: rgb(255, 255, 255), rgba(255, 255, 255, 0.5) HSL: hsl(0, 0%, 100%), hsla(0, 0%, 100%, 0.5) OKLCH: oklch(96.27% 0.0217 238.66), oklch(96.27% 0.0217 238.66 / 0.5) Example of adding oklch color to theme: FilledOutlineLightDemo.tsximport { MantineProvider, createTheme, Group, Button } from '@mantine/core'; const theme = createTheme({ colors: { 'oklch-blue': [ 'oklch(96.27% 0.0217 238.66)', 'oklch(92.66% 0.0429 240.01)', 'oklch(86.02% 0.0827 241.66)', 'oklch(78.2% 0.13 243.83)', 'oklch(71.8% 0.1686 246.06)', 'oklch(66.89% 0.1986 248.32)', 'oklch(62.59% 0.2247 250.29)', 'oklch(58.56% 0.2209 251.26)', 'oklch(54.26% 0.2067 251.67)', 'oklch(49.72% 0.1888 251.59)', ], } }); function Demo() { return ( <MantineProvider theme={theme}> <Group> <Button color="oklch-blue">Filled</Button> <Button color="oklch-blue" variant="outline"> Outline </Button> <Button color="oklch-blue" variant="light"> Light </Button> </Group> </MantineProvider> ); }Expand code primaryColor theme.primaryColor is a key of theme.colors, it is used: As a default value for most of the components that support color prop To set default focus ring outline color Primary buttonBlue buttonDemo.tsximport { Group, Button, MantineProvider, createTheme } from '@mantine/core'; const theme = createTheme({ primaryColor: 'bright-pink', colors: { 'bright-pink': ['#F0BBDD', '#ED9BCF', '#EC7CC3', '#ED5DB8', '#F13EAF', '#F71FA7', '#FF00A1', '#E00890', '#C50E82', '#AD1374'], }, }); function Demo() { return ( <MantineProvider theme={theme}> <Group> <Button>Primary button</Button> <Button color="blue">Blue button</Button> </Group> </MantineProvider> ); }Expand code CSS color values at theme.primaryColor Value of theme.primaryColor must be a key of theme.colors object. For example, blue, orange or green. You cannot assign CSS color values, for example, the following code will throw an error during theme merging: import { MantineProvider } from '@mantine/core'; function Demo() { return ( <MantineProvider theme={{ primaryColor: '#CEFEDC', // This will throw an error }} > {/* Your app here */} </MantineProvider> ); } primaryShade theme.primaryShade is a number from 0 to 9. It determines which shade will be used for the components that have color prop. #primary-color-demo-root{--mantine-scale: 1;--mantine-cursor-type: default;--mantine-color-scheme: light dark;--mantine-webkit-font-smoothing: antialiased;--mantine-moz-font-smoothing: grayscale;--mantine-color-white: #fff;--mantine-color-black: #000;--mantine-line-height: 1.55;--mantine-font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif, Apple Color Emoji, Segoe UI Emoji;--mantine-font-family-monospace: Menlo, Monaco, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, Courier New, monospace;--mantine-font-family-headings: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif, Apple Color Emoji, Segoe UI Emoji;--mantine-heading-font-weight: 700;--mantine-heading-text-wrap: wrap;--mantine-radius-default: calc(0.25rem * var(--mantine-scale));--mantine-primary-color-filled: var(--mantine-color-blue-filled);--mantine-primary-color-filled-hover: var(--mantine-color-blue-filled-hover);--mantine-primary-color-light: var(--mantine-color-blue-light);--mantine-primary-color-light-hover: var(--mantine-color-blue-light-hover);--mantine-primary-color-light-color: var(--mantine-color-blue-light-color);--mantine-breakpoint-xs: 36em;--mantine-breakpoint-sm: 48em;--mantine-breakpoint-md: 62em;--mantine-breakpoint-lg: 75em;--mantine-breakpoint-xl: 88em;--mantine-spacing-xs: calc(0.625rem * var(--mantine-scale));--mantine-spacing-sm: calc(0.75rem * var(--mantine-scale));--mantine-spacing-md: calc(1rem * var(--mantine-scale));--mantine-spacing-lg: calc(1.25rem * var(--mantine-scale));--mantine-spacing-xl: calc(2rem * var(--mantine-scale));--mantine-font-size-xs: calc(0.75rem * var(--mantine-scale));--mantine-font-size-sm: calc(0.875rem * var(--mantine-scale));--mantine-font-size-md: calc(1rem * var(--mantine-scale));--mantine-font-size-lg: calc(1.125rem * var(--mantine-scale));--mantine-font-size-xl: calc(1.25rem * var(--mantine-scale));--mantine-line-height-xs: 1.4;--mantine-line-height-sm: 1.45;--mantine-line-height-md: 1.55;--mantine-line-height-lg: 1.6;--mantine-line-height-xl: 1.65;--mantine-shadow-xs: 0 calc(0.0625rem * var(--mantine-scale)) calc(0.1875rem * var(--mantine-scale)) rgba(0, 0, 0, 0.05), 0 calc(0.0625rem * var(--mantine-scale)) calc(0.125rem * var(--mantine-scale)) rgba(0, 0