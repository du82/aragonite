title = "Version v7.2.0 | Mantine"
description = "React components and hooks library with native dark theme support and focus on usability, accessibility and developer experience"
full_description = '''Version v7.2.0Release dateNovember 7th, 2023Source codeRelease on GitHubCommunity templates You are welcome to share your GitHub templates with the community. Community templates are featured on the getting started page. You can find a guide on how to create and submit a template here. Examples of templates that you can submit: Next.js pages router + MDX + Mantine blog template Next.js app router + Mantine + styled-components template Vite + Mantine + Emotion template NumberFormatter component New NumberFormatter component allows to format numbers with thousands separators, decimal separators, and custom number of decimal places. It supports the same formatting related props as NumberInput component. $ 1,000,000Demo.tsximport { NumberFormatter } from '@mantine/core'; function Demo() { return <NumberFormatter prefix="$ " value={1000000} thousandSeparator />; }Expand code Form actions @mantine/form package now exports createFormActions function that can be used to change form state from anywhere in your application. The mechanism of form actions is similar to notifications system, modals manager and other similar packages. To use form actions, set name property in use-form settings: import { useForm } from '@mantine/form'; export interface DemoFormValues { name: string; age: number; } function Demo() { const form = useForm<DemoFormValues>({ name: 'demo-form', initialValues: { name: '', age: 0, }, }); } Then call createFormActions function with the same form name as specified in useForm settings: // Import type of form values from the file where you defined useForm import { createFormActions } from '@mantine/form'; import type { DemoFormValues } from './DemoForm'; export const demoFormActions = createFormActions<DemoFormValues>('demo-form'); After that, you can use demoFormActions to change form state from anywhere in your application. For example, after a fetch request or after a user interaction with a component that does not have access to the form state: import { useEffect } from 'react'; import { Button } from '@mantine/core'; import { demoFormActions } from './demoFormActions'; function ExternalComponent() { useEffect(() => { fetch('/api/user') .then((res) => res.json()) .then((res) => demoFormActions.setValues({ name: res.name, age: res.age, }) ); }, []); return ( <Button onClick={() => demoFormActions.reset()}> Reset demo form </Button> ); } Table data prop Table component now supports data prop which can be used to generate table rows from given data: Some elements from periodic tableElement positionAtomic massSymbolElement name612.011CCarbon714.007NNitrogen3988.906YYttrium56137.33BaBarium58140.12CeCeriumDemo.tsximport { Table, TableData } from '@mantine/core'; const tableData: TableData = { caption: 'Some elements from periodic table', head: ['Element position', 'Atomic mass', 'Symbol', 'Element name'], body: [ [6, 12.011, 'C', 'Carbon'], [7, 14.007, 'N', 'Nitrogen'], [39, 88.906, 'Y', 'Yttrium'], [56, 137.33, 'Ba', 'Barium'], [58, 140.12, 'Ce', 'Cerium'], ], }; function Demo() { return <Table data={tableData} />; }Expand code Table sticky header Table component now supports stickyHeader prop, which can be used to make the table header stick to the top of the table: Element positionElement nameSymbolAtomic mass6CarbonC12.0117NitrogenN14.00739YttriumY88.90656BariumBa137.3358CeriumCe140.12Scroll page to see sticky theadDemo.tsximport { Table } from '@mantine/core'; const elements = [ { position: 6, mass: 12.011, symbol: 'C', name: 'Carbon' }, { position: 7, mass: 14.007, symbol: 'N', name: 'Nitrogen' }, { position: 39, mass: 88.906, symbol: 'Y', name: 'Yttrium' }, { position: 56, mass: 137.33, symbol: 'Ba', name: 'Barium' }, { position: 58, mass: 140.12, symbol: 'Ce', name: 'Cerium' }, ]; function Demo() { const rows = elements.map((element) => ( <Table.Tr key={element.name}> <Table.Td>{element.position}</Table.Td> <Table.Td>{element.name}</Table.Td> <Table.Td>{element.symbol}</Table.Td> <Table.Td>{element.mass}</Table.Td> </Table.Tr> )); return ( <Table stickyHeader stickyHeaderOffset={60}> <Table.Thead> <Table.Tr> <Table.Th>Element position</Table.Th> <Table.Th>Element name</Table.Th> <Table.Th>Symbol</Table.Th> <Table.Th>Atomic mass</Table.Th> </Table.Tr> </Table.Thead> <Table.Tbody>{rows}</Table.Tbody> <Table.Caption>Scroll page to see sticky thead</Table.Caption> </Table> ); }Expand code Usage with Sass It is now possible to use Mantine with Sass. You can find documentation on this page. Note that it is still required to set up postcss-preset-mantine in order for all functions to work properly. Sass can be used as a replacement for CSS modules – it supports all features that CSS modules support. You can find examples of Mantine + Sass usage in separate branches of templates: Next.js app router + Sass example Vite + Sass example Inline loaders Loader component now supports children prop. The prop allows overriding the default loader with any React node. It is useful in components that support loaderProps (Button, LoadingOverlay, Dropzone, etc.) – with loaderProps.children you can now display any React node instead of the loader. First name *Last name *Email *Password *Confirm Password *I agree to sell my soul and privacy to this corporationToggle overlayDemo.tsximport { useDisclosure } from '@mantine/hooks'; import { LoadingOverlay, Button, Group, Box } from '@mantine/core'; function Demo() { const [visible, { toggle }] = useDisclosure(false); return ( <> <Box pos="relative"> <LoadingOverlay visible={visible} loaderProps={{ children: 'Loading...' }} /> {/* ...other content */} </Box> <Group justify="center"> <Button onClick={toggle}>Toggle overlay</Button> </Group> </> ); }Expand code lightHidden and darkHidden props All Mantine components now support lightHidden and darkHidden props that can be used to hide components in a specific color scheme: Visible in dark color scheme onlyVisible in light color scheme onlyDemo.tsximport { Button } from '@mantine/core'; function Demo() { return ( <> <Button color="cyan" lightHidden> Visible in dark color scheme only </Button> <Button color="pink" darkHidden> Visible in light color scheme only </Button> </> ); }Expand code light-root and dark-root mixins New light-root and dark-root mixins were added to postcss-preset-mantine. These mixins can be used to add color scheme specific styles to the :root/html element. Note that to use these mixins, you need to update postcss-preset-mantine to 1.9.0 or higher. :root { @mixin light-root { --color: red; } @mixin dark-root { --color: blue; } } Documentation updates New Styles overview guide New Usage with Sass guide Storybook guide was updated to use new @storybook/addon-styling-webpack with separate instructions for Vite and other frameworks CSS modules guide now includes new section about global class names reference with :global selector Getting started guide now includes new section about setting up VS Code with PostCSS Language Support and CSS Variable Autocomplete extensions Popover documentation now includes a guide on how to use nested popovers AspectRatio documentation now includes a guide on how to use it in flexbox containers Additional AppShell.Section documentation was added 8 new Checkbox examples and demos were added Other changes Dropzone now supports loaderProps prop to pass props down to the Loader component theme.variantColorResolver now supports hoverColor prop, which allows controlling color property when the component is hovered. New property is supported in Button and ActionIcon components. Flex is now a polymorphic component – it accepts renderRoot and component props Checkbox root element now has data-checked attribute when the checkbox is checked Checkbox and Radio components now support changing icon color with iconColor prop use-form now supports onValuesChange option which can be used to sync form values with external state PreviousVersion v7.3.0NextVersion v7.1.0Welcome to Mantine, React components library that you always wished forBuild fully functional accessible web applications faster than everAboutContributeAbout MantineChangelogGitHub ReleasesCommunityChat on DiscordFollow on XFollow on GithubGitHub discussionsProjectMantine UIHelp CenterGithub organizationnpm organizationBuilt by Vitaly Rtishchev and these awesome peopleJoin Discord communityFollow Mantine on X'''
