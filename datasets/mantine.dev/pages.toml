["https://mantine.dev/styles/styles-api"]
title = "Styles API | Mantine"
description = "React components and hooks library with native dark theme support and focus on usability, accessibility and developer experience"
full_description = '''Styles API What is Styles API The styles API is a set of props and techniques that allows you to customize the style of any element inside a Mantine component – inline or using the theme object. All Mantine components that have styles support Styles API. Styles API selectors Every Mantine component that supports the styles API has a set of element names that can be used to apply styles to inner elements inside the component. For simplicity, these elements names are called selectors in Mantine documentation. You can find selectors information under the Styles API tab in a component's documentation. Example of Button component selectors: SelectorStatic selectorDescriptionroot.mantine-Button-rootRoot elementloader.mantine-Button-loaderLoader component, displayed only when loading prop is setinner.mantine-Button-innerContains all other elements, child of the root elementsection.mantine-Button-sectionLeft and right sections of the buttonlabel.mantine-Button-labelButton children You can use these selectors in classNames and styles in, both, component props and theme.components: import { Button, createTheme, MantineProvider } from '@mantine/core'; function ClassNamesDemo() { return ( <Button classNames={{ root: 'my-root-class', label: 'my-label-class', inner: 'my-inner-class', }} > Button </Button> ); } function StylesDemo() { return ( <Button styles={{ root: { backgroundColor: 'red' }, label: { color: 'blue' }, inner: { fontSize: 20 }, }} > Button </Button> ); } const theme = createTheme({ components: { Button: Button.extend({ classNames: { root: 'my-root-class', label: 'my-label-class', inner: 'my-inner-class', }, styles: { root: { backgroundColor: 'red' }, label: { color: 'blue' }, inner: { fontSize: 20 }, }, }), }, }); function ProviderDemo() { return ( <MantineProvider theme={theme}> <Button>Button</Button> </MantineProvider> ); } classNames prop With the classNames prop you can add classes to inner elements of Mantine components. It accepts an object with element names as keys and classes as values: Floating label inputDemo.tsxDemo.module.cssimport { useState } from 'react'; import { TextInput } from '@mantine/core'; import classes from './Demo.module.css'; function Demo() { const [value, setValue] = useState(''); const [focused, setFocused] = useState(false); const floating = focused || value.length > 0 || undefined; return ( <TextInput label="Floating label input" labelProps={{ 'data-floating': floating }} classNames={{ root: classes.root, input: classes.input, label: classes.label, }} onFocus={() => setFocused(true)} onBlur={() => setFocused(false)} value={value} onChange={(event) => setValue(event.currentTarget.value)} /> ); }Expand code classNames in theme.components You can also define classNames in theme.components to apply them to all components of a specific type: import { useState } from 'react'; import { createTheme, MantineProvider, TextInput, } from '@mantine/core'; // Styles are the same as in previous example import classes from './Demo.module.css'; const theme = createTheme({ components: { TextInput: TextInput.extend({ classNames: { root: classes.root, input: classes.input, label: classes.label, }, }), }, }); function Demo() { return ( <MantineProvider theme={theme}> {/* Your app here */} </MantineProvider> ); } Components CSS variables Most of Mantine components use CSS variables to define colors, sizes, paddings and other properties. You can override these values using a custom CSS variables resolver function in theme.components or by passing it to the vars prop. You can find CSS variables information under the Styles API tab in a component's documentation. Example of Button component CSS variables: SelectorVariableDescriptionroot--button-bgControls background--button-bdControl border--button-hoverControls background when hovered--button-colorControl text color--button-hover-colorControl text color when hovered--button-radiusControls border-radius--button-heightControls height of the button--button-padding-xControls horizontal padding of the button--button-fzControls font-size of the button--button-justifyControls justify-content of inner element Example of a custom CSS variables resolver function used to add more sizes to the Button component: XXL ButtonXXS ButtonMantineProvider.tsxInline.tsximport { Button, Group, MantineProvider, createTheme } from '@mantine/core'; const theme = createTheme({ components: { Button: Button.extend({ vars: (theme, props) => { if (props.size === 'xxl') { return { root: { '--button-height': '60px', '--button-padding-x': '30px', '--button-fz': '24px', }, }; } if (props.size === 'xxs') { return { root: { '--button-height': '24px', '--button-padding-x': '10px', '--button-fz': '10px', }, }; } return { root: {} }; }, }), }, }); function Demo() { return ( <MantineProvider theme={theme}> <Group> <Button size="xxl">XXL Button</Button> <Button size="xxs">XXS Button</Button> </Group> </MantineProvider> ); }Expand code styles prop The styles prop works the same way as classNames, but applies inline styles. Note that inline styles have higher specificity than classes, so you will not be able to override them with classes without using !important. You cannot use pseudo-classes (for example, :hover, :first-of-type) and media queries inside the styles prop. Gradient buttonDemo.tsximport { Button } from '@mantine/core'; function Demo() { const gradient = 'linear-gradient(45deg, var(--mantine-color-pink-filled) 0%, var(--mantine-color-orange-filled) 50%, var(--mantine-color-yellow-filled) 100%)'; return ( <Button radius="md" styles={{ root: { padding: 2, border: 0, backgroundImage: gradient, }, inner: { background: 'var(--mantine-color-body)', color: 'var(--mantine-color-text)', borderRadius: 'calc(var(--button-radius) - 2px)', paddingLeft: 'var(--mantine-spacing-md)', paddingRight: 'var(--mantine-spacing-md)', }, label: { backgroundImage: gradient, WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', }, }} > Gradient button </Button> ); }Expand code styles prop usage Some examples and demos in the documentation use the styles prop for convenience, but it is not recommended to use the styles prop as the primary means of styling components, as the classNames prop is more flexible and has better performance. Styles API based on component props You can also pass a callback function to classNames and styles. This function will receive theme as first argument and component props as second. It should return an object of classes (for classNames) or styles (for styles). You can use this feature to conditionally apply styles based on component props. For example, you can change the TextInput label color if the input is required or change the input background color if the input is wrong: Required input *Input with errorDemo.tsxDemo.module.cssimport cx from 'clsx'; import { MantineProvider, createTheme, TextInput } from '@mantine/core'; import classes from './Demo.module.css'; const theme = createTheme({ components: { TextInput: TextInput.extend({ classNames: (_theme, props) => ({ label: cx({ [classes.labelRequired]: props.required }), input: cx({ [classes.inputError]: props.error }), }), }), }, }); function Demo() { return ( <MantineProvider theme={theme}> <TextInput required label="Required input" placeholder="Required input" /> <TextInput error label="Input with error" placeholder="Input with error" mt="md" /> </MantineProvider> ); }Expand code Static classes Every component that supports Styles API also includes static classes that can be used to style component without using classNames or styles props. By default, static classes have .mantine-{ComponentName}-{selector} format. For example, root selector of Button component will have .mantine-Button-root class. You can use static classes to style a component with CSS or any other styling solution: .mantine-Button-root { background-color: red; } The prefix of static classes can be changed with classNamesPrefix of MantineProvider. Components classes Classes of each component are available in the Component.classes object. For example, you can find the classes of Button in Button.classes: KeyClassrootm_77c9d27dinnerm_80f1301blabelm_811560b9sectionm_a74036aloaderm_a25b86eegroupm_80d6d844groupSectionm_70be2a01 You can use these classes to create components with the same styles as Mantine components: import { Button } from '@mantine/core'; function Demo() { return <button type="button" className={Button.classes.root} />; }PreviousResponsive stylesNextdata-* attributesWelcome to Mantine, React components library that you always wished forBuild fully functional accessible web applications faster than everAboutContributeAbout MantineChangelogGitHub ReleasesCommunityChat on DiscordFollow on XFollow on GithubGitHub discussionsProjectMantine UIHelp CenterGithub organizationnpm organizationBuilt by Vitaly Rtishchev and these awesome peopleJoin Discord communityFollow Mantine on X'''
