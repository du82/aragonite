title = "Testing with Jest | Mantine"
description = "React components and hooks library with native dark theme support and focus on usability, accessibility and developer experience"
full_description = "Testing with Jest This guide will help you setup Jest and React Testing Library for your project. Note that this guide only covers shared logic that can be applied to any framework, and it does not cover initial setup of Jest and React Testing Library as it may vary depending on the framework you are using. Custom render All Mantine components require MantineProvider to be present in the component tree. To add MantineProvider to the component tree in your tests, create a custom render function: // ./test-utils/render.tsx import { render as testingLibraryRender } from '@testing-library/react'; import { MantineProvider } from '@mantine/core'; // Import your theme object import { theme } from '../src/theme'; export function render(ui: React.ReactNode) { return testingLibraryRender(<>{ui}</>, { wrapper: ({ children }: { children: React.ReactNode }) => ( <MantineProvider theme={theme}>{children}</MantineProvider> ), }); } It is usually more convenient to export all @testing-library/* functions that you are planning to use from ./testing-utils/index.ts file: import userEvent from '@testing-library/user-event'; export * from '@testing-library/react'; export { render } from './render'; export { userEvent }; Then you should import all testing utilities from ./testing-utils instead of @testing-library/react: import { render, screen } from '../test-utils'; import { Welcome } from './Welcome'; describe('Welcome component', () => { it('has correct Next.js theming section link', () => { render(<Welcome />); expect(screen.getByText('this guide')).toHaveAttribute( 'href', 'https://mantine.dev/guides/next/' ); }); }); Mock WEB APIs Most of Mantine components depend on browser APIs like window.matchMedia or ResizeObserver. These APIs are not available in jest-environment-jsdom environment and you will need to mock them in your tests. Create jest.setup.js file in your project root and add the following code to it: import '@testing-library/jest-dom'; const { getComputedStyle } = window; window.getComputedStyle = (elt) => getComputedStyle(elt); window.HTMLElement.prototype.scrollIntoView = () => {}; Object.defineProperty(window, 'matchMedia', { writable: true, value: jest.fn().mockImplementation((query) => ({ matches: false, media: query, onchange: null, addListener: jest.fn(), removeListener: jest.fn(), addEventListener: jest.fn(), removeEventListener: jest.fn(), dispatchEvent: jest.fn(), })), }); class ResizeObserver { observe() {} unobserve() {} disconnect() {} } window.ResizeObserver = ResizeObserver; Then add it as a setup file in your jest.config.js: const config = { setupFilesAfterEnv: ['<rootDir>/jest.setup.js'], // ... rest of your config }; Framework specific setup Jest setup for different frameworks may vary and usually change over time. To learn how to setup Jest for your framework, either check Jest and React Testing Library documentation or check one of the premade templates. Most of the templates include Jest setup, and you can use them as a reference. Testing examples You can find testing examples in Mantine Help Center: How can I test Modal/Drawer/Popover components? How can I test Select/MultiSelect components? PreviousUsage with JavaScriptNextTesting with VitestWelcome to Mantine, React components library that you always wished forBuild fully functional accessible web applications faster than everAboutContributeAbout MantineChangelogGitHub ReleasesCommunityChat on DiscordFollow on XFollow on GithubGitHub discussionsProjectMantine UIHelp CenterGithub organizationnpm organizationBuilt by Vitaly Rtishchev and these awesome peopleJoin Discord communityFollow Mantine on X"
