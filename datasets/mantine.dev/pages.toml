title = "Usage with Remix | Mantine"
description = "React components and hooks library with native dark theme support and focus on usability, accessibility and developer experience"
full_description = '''Usage with React Router Generate new application Follow React Router getting started guide guide to create new React Router application: npx create-react-router@latest my-react-router-app Installation Choose packages that you will use in your application:PackageDescription@mantine/hooksHooks for state and UI management@mantine/coreCore components library: inputs, buttons, overlays, etc.@mantine/formForm management library@mantine/datesDate inputs, calendars@mantine/chartsRecharts based charts library@mantine/notificationsNotifications system@mantine/code-highlightCode highlight with your theme colors and styles@mantine/tiptapRich text editor based on Tiptap@mantine/dropzoneCapture files with drag and drop@mantine/carouselEmbla based carousel component@mantine/spotlightOverlay command center@mantine/modalsCentralized modals manager@mantine/nprogressNavigation progressInstall dependencies:yarnnpmyarn add @mantine/core @mantine/hooksExpand code PostCSS setup Install PostCSS plugins and postcss-preset-mantine: yarnnpmyarn add --dev postcss postcss-preset-mantine postcss-simple-varsExpand code Create postcss.config.cjs file at the root of your application with the following content: module.exports = { plugins: { 'postcss-preset-mantine': {}, 'postcss-simple-vars': { variables: { 'mantine-breakpoint-xs': '36em', 'mantine-breakpoint-sm': '48em', 'mantine-breakpoint-md': '62em', 'mantine-breakpoint-lg': '75em', 'mantine-breakpoint-xl': '88em', }, }, }, }; Setup Add styles imports, MantineProvider and ColorSchemeScript to app/root.tsx: // Import styles of packages that you've installed. // All packages except `@mantine/hooks` require styles imports import '@mantine/core/styles.css'; import { Links, Meta, Outlet, Scripts, ScrollRestoration, } from "react-router"; import { ColorSchemeScript, MantineProvider, mantineHtmlProps } from '@mantine/core'; export function Layout({ children }: { children: React.ReactNode }) { return ( <html lang="en" {...mantineHtmlProps}> <head> <meta charSet="utf-8" /> <meta name="viewport" content="width=device-width, initial-scale=1" /> <ColorSchemeScript /> <Meta /> <Links /> </head> <body> <MantineProvider>{children}</MantineProvider> <ScrollRestoration /> <Scripts /> </body> </html> ); } // ... other app/root.tsx content All set! Start development server: npm run devNextMantineProviderWelcome to Mantine, React components library that you always wished forBuild fully functional accessible web applications faster than everAboutContributeAbout MantineChangelogGitHub ReleasesCommunityChat on DiscordFollow on XFollow on GithubGitHub discussionsProjectMantine UIHelp CenterGithub organizationnpm organizationBuilt by Vitaly Rtishchev and these awesome peopleJoin Discord communityFollow Mantine on X'''
