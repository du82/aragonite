atorimport '@mantine/core/styles/Indicator.css';Inputimport '@mantine/core/styles/Input.css';InlineInputimport '@mantine/core/styles/InlineInput.css';Kbdimport '@mantine/core/styles/Kbd.css';Listimport '@mantine/core/styles/List.css';Loaderimport '@mantine/core/styles/Loader.css';LoadingOverlayimport '@mantine/core/styles/LoadingOverlay.css';Markimport '@mantine/core/styles/Mark.css';Menuimport '@mantine/core/styles/Menu.css';Modalimport '@mantine/core/styles/Modal.css';NavLinkimport '@mantine/core/styles/NavLink.css';Notificationimport '@mantine/core/styles/Notification.css';NumberInputimport '@mantine/core/styles/NumberInput.css';Overlayimport '@mantine/core/styles/Overlay.css';Paginationimport '@mantine/core/styles/Pagination.css';Paperimport '@mantine/core/styles/Paper.css';PasswordInputimport '@mantine/core/styles/PasswordInput.css';Pillimport '@mantine/core/styles/Pill.css';ModalBaseimport '@mantine/core/styles/ModalBase.css';PillsInputimport '@mantine/core/styles/PillsInput.css';PinInputimport '@mantine/core/styles/PinInput.css';Popoverimport '@mantine/core/styles/Popover.css';Progressimport '@mantine/core/styles/Progress.css';Radioimport '@mantine/core/styles/Radio.css';Ratingimport '@mantine/core/styles/Rating.css';RingProgressimport '@mantine/core/styles/RingProgress.css';ScrollAreaimport '@mantine/core/styles/ScrollArea.css';SegmentedControlimport '@mantine/core/styles/SegmentedControl.css';SemiCircleProgressimport '@mantine/core/styles/SemiCircleProgress.css';SimpleGridimport '@mantine/core/styles/SimpleGrid.css';Skeletonimport '@mantine/core/styles/Skeleton.css';Sliderimport '@mantine/core/styles/Slider.css';Spoilerimport '@mantine/core/styles/Spoiler.css';Stackimport '@mantine/core/styles/Stack.css';Stepperimport '@mantine/core/styles/Stepper.css';Tableimport '@mantine/core/styles/Table.css';Tabsimport '@mantine/core/styles/Tabs.css';Textimport '@mantine/core/styles/Text.css';ThemeIconimport '@mantine/core/styles/ThemeIcon.css';Timelineimport '@mantine