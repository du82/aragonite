title = "Usage with Next.js | Mantine"
description = "React components and hooks library with native dark theme support and focus on usability, accessibility and developer experience"
full_description = '''Usage with Next.js Get started with a templateThe easiest way to get started is to use one of the templates. All templates are configured correctly: they include PostCSS setup, ColorSchemeScript and other essential features. Some templates also include additional features like Jest, Storybook and ESLint.If you are not familiar with GitHub, you can find a detailed instruction on how to bootstrap a project from a template on this page.next-app-templateNext.js template with app router and full setup: Jest, Storybook, ESLintUse templatenext-pages-templateNext.js template with pages router and full setup: Jest, Storybook, ESLintUse templatenext-app-min-templateNext.js template with app router and minimal setup – no additional tools included, only default Next.js configurationUse templatenext-pages-min-templateNext.js template with pages router and minimal setup – no additional tools included, only default Next.js configurationUse templatenext-vanilla-extract-templateNext.js template with Vanilla extract exampleUse template Generate new application Follow create-next-app guide to create new Next.js application: yarnnpmyarn create next-app --typescriptExpand code Installation Choose packages that you will use in your application:PackageDescription@mantine/hooksHooks for state and UI management@mantine/coreCore components library: inputs, buttons, overlays, etc.@mantine/formForm management library@mantine/datesDate inputs, calendars@mantine/chartsRecharts based charts library@mantine/notificationsNotifications system@mantine/code-highlightCode highlight with your theme colors and styles@mantine/tiptapRich text editor based on Tiptap@mantine/dropzoneCapture files with drag and drop@mantine/carouselEmbla based carousel component@mantine/spotlightOverlay command center@mantine/modalsCentralized modals manager@mantine/nprogressNavigation progressInstall dependencies:yarnnpmyarn add @mantine/core @mantine/hooksExpand code PostCSS setup Install PostCSS plugins and postcss-preset-mantine: yarnnpmyarn add --dev postcss postcss-preset-mantine postcss-simple-varsExpand code Create postcss.config.cjs file at the root of your application with the following content: module.exports = { plugins: { 'postcss-preset-mantine': {}, 'postcss-simple-vars': { variables: { 'mantine-breakpoint-xs': '36em', 'mantine-breakpoint-sm': '48em', 'mantine-breakpoint-md': '62em', 'mantine-breakpoint-lg': '75em', 'mantine-breakpoint-xl': '88em', }, }, }, }; Setup with pages router Add styles imports and MantineProvider to the pages/_app.tsx file: // Import styles of packages that you've installed. // All packages except `@mantine/hooks` require styles imports import '@mantine/core/styles.css'; import type { AppProps } from 'next/app'; import { createTheme, MantineProvider } from '@mantine/core'; const theme = createTheme({ /** Put your mantine theme override here */ }); export default function App({ Component, pageProps }: AppProps) { return ( <MantineProvider theme={theme}> <Component {...pageProps} /> </MantineProvider> ); } Create pages/_document.tsx file with ColorSchemeScript component. Note that it is required even if you use only one color scheme in your application. import { Head, Html, Main, NextScript } from 'next/document'; import { ColorSchemeScript, mantineHtmlProps } from '@mantine/core'; export default function Document() { return ( <Html lang="en" {...mantineHtmlProps}> <Head> <ColorSchemeScript defaultColorScheme="auto" /> </Head> <body> <Main /> <NextScript /> </body> </Html> ); } All set! Start development server: npm run dev Setup with app router Add MantineProvider, ColorSchemeScript and styles imports to the app/layout.tsx file: // Import styles of packages that you've installed. // All packages except `@mantine/hooks` require styles imports import '@mantine/core/styles.css'; import { ColorSchemeScript, MantineProvider, mantineHtmlProps } from '@mantine/core'; export const metadata = { title: 'My Mantine app', description: 'I have followed setup instructions carefully', }; export default function RootLayout({ children, }: { children: React.ReactNode; }) { return ( <html lang="en" {...mantineHtmlProps}> <head> <ColorSchemeScript /> </head> <body> <MantineProvider>{children}</MantineProvider> </body> </html> ); } All set! Start development server: npm run dev app + pages router together If you use both app and pages router in one application, you need to setup both pages/_app.tsx and app/layout.tsx files as described above. Next.js Link with polymorphic components import Link from 'next/link'; import { Button } from '@mantine/core'; function Demo() { return ( <Button component={Link} href="/hello"> Next link button </Button> ); } Server components All Mantine components use useContext hook to support default props and Styles API. Mantine components cannot be used as server components. It means that components will render both on the server and client. Entry points of all @mantine/* packages (index.js files) have 'use client'; directive at the top of the file – you do not need to add 'use client'; to your pages/layouts/components. Compound components in server components Some components like Popover have associated compound components (Component.XXX), where XXX is a compound component name. Compound components cannot be used in server components. Instead, use ComponentXXX syntax or add 'use client'; directive to the top of the file. Example that will not work in server components: import { Popover } from '@mantine/core'; // This will throw an error export default function Page() { return ( <Popover> <Popover.Target>Target</Popover.Target> <Popover.Dropdown>Dropdown</Popover.Dropdown> </Popover> ); } Example with 'use client'; directive: 'use client'; import { Popover } from '@mantine/core'; // No error export default function Page() { return ( <Popover> <Popover.Target>Target</Popover.Target> <Popover.Dropdown>Dropdown</Popover.Dropdown> </Popover> ); } Example with ComponentXXX syntax: import { Popover, PopoverDropdown, PopoverTarget, } from '@mantine/core'; // No error export default function Page() { return ( <Popover> <PopoverTarget>Trigger</PopoverTarget> <PopoverDropdown>Dropdown</PopoverDropdown> </Popover> ); } app router tree shaking To enable tree shaking with app router, enable experimental optimizePackageImports feature in your next.config.mjs: export default { // ...other configuration experimental: { optimizePackageImports: ['@mantine/core', '@mantine/hooks'], }, }; Troubleshooting If you have any issues with Mantine in your Next.js application, please check Help Center article that covers most common issues with app router and server components.PreviousIcons librariesNextUsage with ViteWelcome to Mantine, React components library that you always wished forBuild fully functional accessible web applications faster than everAboutContributeAbout MantineChangelogGitHub ReleasesCommunityChat on DiscordFollow on XFollow on GithubGitHub discussionsProjectMantine UIHelp CenterGithub organizationnpm organizationBuilt by Vitaly Rtishchev and these awesome peopleJoin Discord communityFollow Mantine on X'''
