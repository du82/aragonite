title = "Version v7.13.0 | Mantine"
description = "React components and hooks library with native dark theme support and focus on usability, accessibility and developer experience"
full_description = '''Version v7.13.0Release dateSeptember 26th, 2024Source codeRelease on GitHubContainer queries support in Grid You can now use container queries in Grid component. With container queries, all responsive values are adjusted based on the container width, not the viewport width. Example of using container queries. To see how the grid changes, resize the root element of the demo with the resize handle located at the bottom right corner of the demo: .__m__-R58tbblu6{--grid-gutter:var(--mantine-spacing-md);}.__m__-Rrd8tbblu6{--col-flex-grow:auto;--col-flex-basis:100%;--col-max-width:100%;}@container mantine-grid (min-width: 300px){.__m__-Rrd8tbblu6{--col-flex-grow:auto;--col-flex-basis:50%;--col-max-width:50%;}}@container mantine-grid (min-width: 400px){.__m__-Rrd8tbblu6{--col-flex-grow:auto;--col-flex-basis:25%;--col-max-width:25%;}}1.__m__-R1bd8tbblu6{--col-flex-grow:auto;--col-flex-basis:100%;--col-max-width:100%;}@container mantine-grid (min-width: 300px){.__m__-R1bd8tbblu6{--col-flex-grow:auto;--col-flex-basis:50%;--col-max-width:50%;}}@container mantine-grid (min-width: 400px){.__m__-R1bd8tbblu6{--col-flex-grow:auto;--col-flex-basis:25%;--col-max-width:25%;}}2.__m__-R1rd8tbblu6{--col-flex-grow:auto;--col-flex-basis:100%;--col-max-width:100%;}@container mantine-grid (min-width: 300px){.__m__-R1rd8tbblu6{--col-flex-grow:auto;--col-flex-basis:50%;--col-max-width:50%;}}@container mantine-grid (min-width: 400px){.__m__-R1rd8tbblu6{--col-flex-grow:auto;--col-flex-basis:25%;--col-max-width:25%;}}3.__m__-R2bd8tbblu6{--col-flex-grow:auto;--col-flex-basis:100%;--col-max-width:100%;}@container mantine-grid (min-width: 300px){.__m__-R2bd8tbblu6{--col-flex-grow:auto;--col-flex-basis:50%;--col-max-width:50%;}}@container mantine-grid (min-width: 400px){.__m__-R2bd8tbblu6{--col-flex-grow:auto;--col-flex-basis:25%;--col-max-width:25%;}}4Demo.tsximport { Grid } from '@mantine/core'; function Demo() { return ( // Wrapper div is added for demonstration purposes only. // It is not required in real projects. <div style={{ resize: 'horizontal', overflow: 'hidden', maxWidth: '100%' }}> <Grid type="container" breakpoints={{ xs: '100px', sm: '200px', md: '300px', lg: '400px', xl: '500px' }} > <Col span={{ base: 12, md: 6, lg: 3 }}>1</Col> <Col span={{ base: 12, md: 6, lg: 3 }}>2</Col> <Col span={{ base: 12, md: 6, lg: 3 }}>3</Col> <Col span={{ base: 12, md: 6, lg: 3 }}>4</Col> </Grid> </div> ); }Expand code CompositeChart component New CompositeChart component allows using Line, Area and Bar charts together in a single chart: Demo.tsxdata.tsimport { CompositeChart } from '@mantine/charts'; import { data } from './data'; function Demo() { return ( <CompositeChart h={300} data={data} dataKey="date" unit="$" maxBarWidth={30} series={[ { name: 'Tomatoes', color: 'rgba(18, 120, 255, 0.2)', type: 'bar' }, { name: 'Apples', color: 'red.8', type: 'line' }, { name: 'Oranges', color: 'yellow.8', type: 'area' }, ]} /> ); }Expand code Points labels LineChart and AreaChart now support withPointLabels prop to display labels on data points: Demo.tsxdata.tsimport { LineChart } from '@mantine/charts'; import { data } from './data'; function Demo() { return ( <LineChart h={300} data={data} dataKey="date" withLegend withPointLabels series={[ { name: 'Apples', color: 'indigo.6' }, { name: 'Oranges', color: 'blue.6' }, ]} /> ); }Expand code ScatterChart also supports point labels, but also allows to control which axis should display labels with pointLabels prop: Demo.tsxdata.tsimport { ScatterChart } from '@mantine/charts'; import { data } from './data'; function Demo() { return ( <ScatterChart h={350} data={data} dataKey={{ x: 'age', y: 'BMI' }} xAxisLabel="Age" yAxisLabel="BMI" pointLabels="x" /> ); }Expand code BarChart: Mixed stacks You can now control how BarChart series are stacked by setting stackId property in series object: Demo.tsxdata.tsimport { BarChart } from '@mantine/charts'; import { data } from './data'; function Demo() { return ( <BarChart h={300} data={data} dataKey="month" series={[ { name: 'Smartphones', color: 'violet.6', stackId: 'a' }, { name: 'Laptops', color: 'blue.6', stackId: 'b' }, { name: 'Tablets', color: 'teal.6', stackId: 'b' }, ]} /> ); }Expand code BarChart: Minimum bar size BarChart now supports minBarSize prop to set the minimum size of the bar in px: Demo.tsxdata.tsimport { BarChart } from '@mantine/charts'; import { data } from './data'; function Demo() { return ( <BarChart h={300} data={data} dataKey="month" minBarSize={10} series={[ { name: 'Smartphones', color: 'violet.6' }, { name: 'Laptops', color: 'blue.6' }, { name: 'Tablets', color: 'teal.6' }, ]} /> ); }Expand code New demo: Custom Tabs variant A new example of adding a custom variant to Tabs component with FloatingIndicator: First tabSecond tabThird tabFirst tab contentSecond tab contentThird tab contentDemo.tsxDemo.module.cssimport { useState } from 'react'; import { FloatingIndicator, Tabs } from '@mantine/core'; import classes from './Demo.module.css'; function Demo() { const [rootRef, setRootRef] = useState<HTMLDivElement | null>(null); const [value, setValue] = useState<string | null>('1'); const [controlsRefs, setControlsRefs] = useState<Record<string, HTMLButtonElement | null>>({}); const setControlRef = (val: string) => (node: HTMLButtonElement) => { controlsRefs[val] = node; setControlsRefs(controlsRefs); }; return ( <Tabs variant="none" value={value} onChange={setValue}> <Tabs.List ref={setRootRef} className={classes.list}> <Tabs.Tab value="1" ref={setControlRef('1')} className={classes.tab}> First tab </Tabs.Tab> <Tabs.Tab value="2" ref={setControlRef('2')} className={classes.tab}> Second tab </Tabs.Tab> <Tabs.Tab value="3" ref={setControlRef('3')} className={classes.tab}> Third tab </Tabs.Tab> <FloatingIndicator target={value ? controlsRefs[value] : null} parent={rootRef} className={classes.indicator} /> </Tabs.List> <Tabs.Panel value="1">First tab content</Tabs.Panel> <Tabs.Panel value="2">Second tab content</Tabs.Panel> <Tabs.Panel value="3">Third tab content</Tabs.Panel> </Tabs> ); }Expand code New demo: Custom slider Example of use-move hook usage to create a custom slider: 3070Demo.tsxDemo.module.cssimport { useState } from 'react'; import { IconGripVertical } from '@tabler/icons-react'; import { clamp, useMove } from '@mantine/hooks'; import classes from './Demo.module.css'; function Demo() { const [value, setValue] = useState(0.3); const { ref } = useMove(({ x }) => setValue(clamp(x, 0.1, 0.9))); const labelFloating = value < 0.2 || value > 0.8; return ( <div className={classes.root}> <div className={classes.track} ref={ref}> <div className={classes.filled} style={{ width: `calc(${value * 100}% - var(--thumb-width) / 2 - var(--thumb-offset) / 2)`, }} > <span className={classes.label} data-floating={labelFloating || undefined} data-filled> {(value * 100).toFixed(0)} </span> </div> <div className={classes.empty} style={{ width: `calc(${(1 - value) * 100}% - var(--thumb-width) / 2 - var(--thumb-offset) / 2)`, }} > <span className={classes.label} data-floating={labelFloating || undefined}> {((1 - value) * 100).toFixed(0)} </span> </div> <div className={classes.thumb} style={{ left: `calc(${value * 100}% - var(--thumb-width) / 2)` }} > <IconGripVertical stroke={1.5} /> </div> </div> </div> ); }Expand code Help Center updates New How to integrate custom input with use-form hook? question New Can I remove MultiSelect placeholder when the component has selected values? question New How can I load fonts in Remix? question New My styles are overridden by Mantine components styles, what should I do? question New Why I cannot use one polymorphic component in component prop of another polymorphic component? question New Can I use an array of strings as a list in use-form? question Other changes New demo has been added to Chip component with an example of how to deselect radio chip BarChart now supports maxBarWidth prop to set the maximum width of each bar in px PreviousVersion v7.14.0NextVersion v7.12.0Welcome to Mantine, React components library that you always wished forBuild fully functional accessible web applications faster than everAboutContributeAbout MantineChangelogGitHub ReleasesCommunityChat on DiscordFollow on XFollow on GithubGitHub discussionsProjectMantine UIHelp CenterGithub organizationnpm organizationBuilt by Vitaly Rtishchev and these awesome peopleJoin Discord communityFollow Mantine on X'''
