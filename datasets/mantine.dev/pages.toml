["https://mantine.dev/changelog/7-0-0"]
title = "Version v7.0.0 | Mantine"
description = "React components and hooks library with native dark theme support and focus on usability, accessibility and developer experience"
full_description = '''Version v7.0.0Release dateSeptember 18th, 2023Source codeRelease on GitHubMigration to native CSS Mantine no longer depends on Emotion for styles generation. All @mantine/* packages are now shipped with native CSS files which can be imported from @mantine/{package}/styles.css, for example: import '@mantine/core/styles.css'; This change improves performance, reduces bundle size of the library and allows using Mantine in environments where CSS-in-JS is not supported (or supported with limitations), for example, Next.js app directory. Important breaking changes: createStyles function is no longer available, use CSS modules or any other styling solution of your choice instead Components no longer support sx prop. You can use className or style props instead. styles prop no longer supports nested selectors It is now recommended to use CSS modules to style Mantine components. To update your project to CSS modules, follow the 6.x → 7.x migration guide. Vanilla extract integration If you prefer CSS-in-JS syntax for styling, you can use Vanilla extract as a TypeScript CSS preprocessor. You will be able to use most of Mantine styling features with Vanilla extract. System color scheme support All components now support system color scheme – when colorScheme value is auto, components will use prefers-color-scheme media query to determine if the user prefers light or dark color scheme. Note that auto is not the default value. You need to set it manually to enable system color scheme support both on MantineProvider and in ColorSchemeScript: import { ColorSchemeScript, MantineProvider } from '@mantine/core'; function Demo() { return ( <> <ColorSchemeScript defaultColorScheme="auto" /> <MantineProvider defaultColorScheme="auto"> {/* Your app here */} </MantineProvider> </> ); } Built-in color scheme manager MantineProvider now comes with a built-in color scheme manager. It is no longer required to use any other components to set up color scheme logic. Color scheme can be changed with useMantineColorScheme hook: LightDarkAutoClearDemo.tsximport { useMantineColorScheme, Button, Group } from '@mantine/core'; function Demo() { const { setColorScheme, clearColorScheme } = useMantineColorScheme(); return ( <Group> <Button onClick={() => setColorScheme('light')}>Light</Button> <Button onClick={() => setColorScheme('dark')}>Dark</Button> <Button onClick={() => setColorScheme('auto')}>Auto</Button> <Button onClick={clearColorScheme}>Clear</Button> </Group> ); }Expand code CSS modules and PostCSS preset CSS modules is now the recommended way to style Mantine components, although it is not required – you can choose any other styling solution of your choice. It is also recommended to use postcss-preset-mantine. It includes mixins and functions to simplify styling of Mantine components. postcss-preset-mantine is included in all templates. Global styles Mantine no longer includes normalize.css. Instead, it uses a bare minimum set of global styles. These styles are part of the @mantine/core package and are applied automatically when you import @mantine/core/styles.css in your application. Note that these styles cannot be decoupled from the rest of the library. Mantine as a headless UI library You can now use Mantine as a headless library. To achieve that, just do not import @mantine/*/styles.css in your application. Then you will be able to apply styles with Styles API. createTheme function createTheme function is a replacement for MantineThemeOverride type. Use it to create a theme override, it will give you autocomplete for all theme properties: import { createTheme, MantineProvider } from '@mantine/core'; const theme = createTheme({ fontFamily: 'sans-serif', primaryColor: 'orange', }); function Demo() { return ( <MantineProvider theme={theme}> {/* Your app here */} </MantineProvider> ); } Components extend functions All components that support default props or Styles API now have a static extend function which allows getting autocomplete when customizing defaultProps, classNames and styles of the component on theme: import { createTheme, MantineProvider, TextInput, } from '@mantine/core'; import classes from './Demo.module.css'; const theme = createTheme({ components: { TextInput: TextInput.extend({ styles: (t, props) => ({ input: { fontSize: props.size === 'compact' ? t.fontSizes.sm : undefined, }, }), classNames: { root: classes.root, input: classes.input, label: classes.label, }, defaultProps: { size: 'compact', }, }), }, }); function Demo() { return ( <MantineProvider theme={theme}> {/* Your app here */} </MantineProvider> ); } classNames based on component props You can now get component props in classNames and styles to conditionally apply styles. This feature is a more powerful replacement for styles params. Required input *Input with errorDemo.tsxDemo.module.cssimport cx from 'clsx'; import { MantineProvider, createTheme, TextInput } from '@mantine/core'; import classes from './Demo.module.css'; const theme = createTheme({ components: { TextInput: TextInput.extend({ classNames: (_theme, props) => ({ label: cx({ [classes.labelRequired]: props.required }), input: cx({ [classes.inputError]: props.error }), }), }), }, }); function Demo() { return ( <MantineProvider theme={theme}> <TextInput required label="Required input" placeholder="Required input" /> <TextInput error label="Input with error" placeholder="Input with error" mt="md" /> </MantineProvider> ); }Expand code Components CSS variables You can now customize components CSS variables to change component styles based on its props. For example, it can be used to add new sizes: XXL ButtonXXS ButtonMantineProvider.tsxInline.tsximport { Button, Group, MantineProvider, createTheme } from '@mantine/core'; const theme = createTheme({ components: { Button: Button.extend({ vars: (theme, props) => { if (props.size === 'xxl') { return { root: { '--button-height': '60px', '--button-padding-x': '30px', '--button-fz': '24px', }, }; } if (props.size === 'xxs') { return { root: { '--button-height': '24px', '--button-padding-x': '10px', '--button-fz': '10px', }, }; } return { root: {} }; }, }), }, }); function Demo() { return ( <MantineProvider theme={theme}> <Group> <Button size="xxl">XXL Button</Button> <Button size="xxs">XXS Button</Button> </Group> </MantineProvider> ); }Expand code New variants system All components now have data-variant attribute on the root element, even if the component does not have any predefined variants. You can use it to apply styles to all components of the same type on theme: Demo.tsxDemo.module.cssimport { Input, MantineProvider, createTheme } from '@mantine/core'; import classes from './Demo.module.css'; // It is better to add new variants in theme.components // This way you will be able to use them in anywhere in the app const theme = createTheme({ components: { Input: Input.extend({ classNames: classes }), } }); function Demo() { return ( <MantineProvider theme={theme}> <Input variant="underline" placeholder="Underline input" /> <Input variant="filled" placeholder="Filled input" mt="md" /> </MantineProvider> ); }Expand code New sizes system There are multiple ways to customize component sizes: With data-size attribute With component CSS variables With static CSS variables Example of customizing Button size with data-size attribute: Demo.tsxDemo.module.cssimport { Input, createTheme, MantineProvider } from '@mantine/core'; import classes from './Demo.module.css'; const theme = createTheme({ components: { Input: Input.extend({ classNames: classes }), }, }); function Demo() { return ( <MantineProvider theme={theme}> <Input placeholder="Size XXL" size="xxl" /> <Input placeholder="Size XXS" size="xxs" mt="md" /> </MantineProvider> ); }Expand code theme.variantColorResolver Button, Badge, ActionIcon, ThemeIcon and other components now support custom variants with variantColorResolver – it supports both changing colors of existing variants and adding new variants. Lime filled buttonOrange light buttonDanger buttonDemo.tsximport { Button, Group, MantineProvider, defaultVariantColorsResolver, VariantColorsResolver, parseThemeColor, rgba, darken, } from '@mantine/core'; const variantColorResolver: VariantColorsResolver = (input) => { const defaultResolvedColors = defaultVariantColorsResolver(input); const parsedColor = parseThemeColor({ color: input.color || input.theme.primaryColor, theme: input.theme, }); // Override some properties for variant if (parsedColor.isThemeColor && parsedColor.color === 'lime' && input.variant === 'filled') { return { ...defaultResolvedColors, color: 'var(--mantine-color-black)', hoverColor: 'var(--mantine-color-black)', }; } // Completely override variant if (input.variant === 'light') { return { background: rgba(parsedColor.value, 0.1), hover: rgba(parsedColor.value, 0.15), border: `1px solid ${parsedColor.value}`, color: darken(parsedColor.value, 0.1), }; } // Add new variants support if (input.variant === 'danger') { return { background: 'var(--mantine-color-red-9)', hover: 'var(--mantine-color-red-8)', color: 'var(--mantine-color-white)', border: 'none', }; } return defaultResolvedColors; }; function Demo() { return ( <MantineProvider theme={{ variantColorResolver }}> <Group> <Button color="lime.4" variant="filled"> Lime filled button </Button> <Button color="orange" variant="light"> Orange light button </Button> <Button variant="danger">Danger button</Button> </Group> </MantineProvider> ); }Expand code rem units scaling It is now possible to scale rem units. It is useful when you want to change font-size of html/:root element and preserve Mantine components sizes. For example, if you would like to set html font-size to 10px and scale Mantine components accordingly, you need to set scale to 1 / (10 / 16) (16 – default font-size) = 1 / 0.625 = 1.6: :root { font-size: 10px; } import { createTheme, MantineProvider } from '@mantine/core'; const theme = createTheme({ scale: 1.6, }); function Demo() { return ( <MantineProvider theme={theme}> {/* Your app here */} </MantineProvider> ); } color prop improvements All components that support color prop now support the following color values: Key of theme.colors, for example, blue theme.colors index reference, for example, blue.5 Any valid CSS color value, for example, #fff, rgba(0, 0, 0, 0.5), hsl(0, 0%, 100%) Filled variantTheme colorHex colorLight variantTheme colorHex colorOutline variantTheme colorHex colorDemo.tsximport { Group, Button, Text } from '@mantine/core'; function Demo() { return ( <> <Text size="sm" mb={5} fw={500}> Filled variant </Text> <Group> <Button color="cyan">Theme color</Button> <Button color="#1D72FE">Hex color</Button> </Group> <Text size="sm" mb={5} mt="md" fw={500}> Light variant </Text> <Group> <Button variant="light" color="cyan"> Theme color </Button> <Button variant="light" color="#1D72FE"> Hex color </Button> </Group> <Text size="sm" mb={5} mt="md" fw={500}> Outline variant </Text> <Group> <Button variant="outline" color="cyan"> Theme color </Button> <Button variant="outline" color="#1D72FE"> Hex color </Button> </Group> </> ); }Expand code Components classes Classes of each component are now available in Component.classes object. For example, you can find Button classes in Button.classes: KeyClassrootm_77c9d27dinnerm_80f1301blabelm_811560b9sectionm_a74036aloaderm_a25b86eegroupm_80d6d844groupSectionm_70be2a01 You can use these classes to create components with the same styles as Mantine components: import { Button } from '@mantine/core'; function Demo() { return <button type="button" className={Button.classes.root} />; } Theme object changes theme.lineHeight is now theme.lineHeights – it is now possible to specify multiple line heights. theme.lineHeights values are used in the Text component. theme.colorScheme is no longer available, use useMantineColorScheme to get color scheme value theme.dir is no longer needed, direction is now managed by DirectionProvider theme.loader was removed, you can now configure default loader with default props of Loader component theme.transitionTimingFunction was removed theme.focusRingStyles was replaced with theme.focusClassName theme.activeStyles was replaced with theme.activeClassName theme.globalStyles was removed theme.fn functions were removed, some of the functions are available as standalone utilities New theme.scale property controls rem units scaling New theme.fontSmoothing property determines whether font smoothing styles should be applied to the body element New theme.variantColorResolver property allows customizing component colors per variant Colors generator New @mantine/colors-generator package is now available to generate color palettes based on single color value. It is also available as online tool. Note that it is usually better to generate colors in advance to avoid contrast issues. import { generateColors } from '@mantine/colors-generator'; import { createTheme, MantineProvider } from '@mantine/core'; const theme = createTheme({ colors: { 'pale-blue': generateColors('#375EAC'), }, }); function Demo() { return ( <MantineProvider theme={theme}> {/* Your app here */} </MantineProvider> ); } New setup for RTL @mantine/core package now exports DirectionProvider component, which should be used to configure the direction of the application. useDirection hook can be used to toggle direction. All components now include RTL styles by default, it is no longer required to set up additional plugins. See RTL documentation to learn more. React 18+ only Starting from version 7.0 Mantine no longer supports older React versions. The minimum supported version is now React 18. It is required because Mantine components now use useId and useSyncExternalStore hooks, which are available only in React 18. left and right section Components that previously had rightSection and icon props, now use leftSection instead of icon. Example of Button sections: import { Button } from '@mantine/core'; function Demo() { return ( <Button leftSection="left" rightSection="right"> Label </Button> ); } NumberInput changes NumberInput was migrated to react-number-format. It now supports more features and has improvements in cursor position management. Due to migration, some of the props were renamed – follow the documentation to learn about the changes. With prefixWith suffixDemo.tsximport { NumberInput } from '@mantine/core'; function Demo() { return ( <> <NumberInput label="With prefix" placeholder="Dollars" prefix="$" defaultValue={100} mb="md" /> <NumberInput label="With suffix" placeholder="Percents" suffix="%" defaultValue={100} mt="md" /> </> ); }Expand code Loader changes Loader component is now built with CSS only. This change improves performance and reduces HTML output of the component. ColorSizexssmmdlgxlTypeOvalBarsDotsDemo.tsximport { Loader } from '@mantine/core'; function Demo() { return <Loader color="blue" />; }Expand code Theme object no longer supports theme.loader property – it is also now possible to add custom loaders on theme w'''
