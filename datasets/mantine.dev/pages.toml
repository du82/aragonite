["https://mantine.dev/changelog/7-11-0"]
title = "Version v7.11.0 | Mantine"
description = "React components and hooks library with native dark theme support and focus on usability, accessibility and developer experience"
full_description = '''Version v7.11.0Release dateJune 26th, 2024Source codeRelease on GitHubwithProps function All Mantine components now have withProps static function that can be used to add default props to the component: import { IMaskInput } from 'react-imask'; import { Button, InputBase } from '@mantine/core'; const LinkButton = Button.withProps({ component: 'a', target: '_blank', rel: 'noreferrer', variant: 'subtle', }); const PhoneInput = InputBase.withProps({ mask: '+7 (000) 000-0000', component: IMaskInput, label: 'Your phone number', placeholder: 'Your phone number', }); function Demo() { return ( <> {/* You can pass additional props to components created with `withProps` */} <LinkButton href="https://mantine.dev"> Mantine website </LinkButton> {/* Component props override default props defined in `withProps` */} <PhoneInput placeholder="Personal phone" /> </> ); } Avatar initials Avatar component now supports displaying initials with auto generated color based on the given name value. To display initials instead of the default placeholder, set name prop to the name of the person, for example, name="John Doe". If the name is set, you can use color="initials" to generate color based on the name: JDJMALSCMJKKTSDemo.tsximport { Avatar, Group } from '@mantine/core'; const names = [ 'John Doe', 'Jane Mol', 'Alex Lump', 'Sarah Condor', 'Mike Johnson', 'Kate Kok', 'Tom Smith', ]; function Demo() { const avatars = names.map((name) => <Avatar key={name} name={name} color="initials" />); return <Group>{avatars}</Group>; }Expand code BubbleChart component New BubbleChart component: Demo.tsxdata.tsimport { BubbleChart } from '@mantine/charts'; import { data } from './data'; function Demo() { return ( <BubbleChart h={60} data={data} range={[16, 225]} label="Sales/hour" color="lime.6" dataKey={{ x: 'hour', y: 'index', z: 'value' }} /> ); }Expand code BarChart waterfall type BarChart component now supports waterfall type which is useful for visualizing changes in values over time: Demo.tsxdata.tsimport { BarChart } from '@mantine/charts'; import { data } from './data'; function Demo() { return ( <BarChart h={300} data={data} dataKey="item" type="waterfall" series={[{ name: 'Effective tax rate in %', color: 'blue' }]} withLegend /> ); }Expand code LineChart gradient type LineChart component now supports gradient type which renders line chart with gradient fill: Demo.tsxdata.tsimport { LineChart } from '@mantine/charts'; import { data } from './data'; function Demo() { return ( <LineChart h={300} data={data} series={[{ name: 'temperature', label: 'Avg. Temperature' }]} dataKey="date" type="gradient" gradientStops={[ { offset: 0, color: 'red.6' }, { offset: 20, color: 'orange.6' }, { offset: 40, color: 'yellow.5' }, { offset: 70, color: 'lime.5' }, { offset: 80, color: 'cyan.5' }, { offset: 100, color: 'blue.5' }, ]} strokeWidth={5} curveType="natural" yAxisProps={{ domain: [-25, 40] }} valueFormatter={(value) => `${value}°C`} /> ); }Expand code Right Y axis LineChart, BarChart and AreaChart components now support rightYAxis prop which renders additional Y axis on the right side of the chart: Demo.tsxdata.tsimport { LineChart } from '@mantine/charts'; import { data } from './data'; function Demo() { return ( <LineChart h={300} data={data} dataKey="name" withRightYAxis yAxisLabel="uv" rightYAxisLabel="pv" series={[ { name: 'uv', color: 'pink.6' }, { name: 'pv', color: 'cyan.6', yAxisId: 'right' }, ]} /> ); }Expand code RadarChart legend RadarChart component now supports legend: Demo.tsxdata.tsimport { RadarChart } from '@mantine/charts'; import { data } from './data'; function Demo() { return ( <RadarChart h={300} data={data} dataKey="product" withPolarRadiusAxis withLegend series={[ { name: 'Sales January', color: 'blue.6', opacity: 0.2 }, { name: 'Sales February', color: 'orange.6', opacity: 0.2 }, ]} /> ); }Expand code TagsInput acceptValueOnBlur TagsInput component behavior has been changed. Now By default, if the user types in a value and blurs the input, the value is added to the list. You can change this behavior by setting acceptValueOnBlur to false. In this case, the value is added only when the user presses Enter or clicks on a suggestion. Value IS accepted on blurValue IS NOT accepted on blurDemo.tsximport { TagsInput } from '@mantine/core'; function Demo() { return ( <> <TagsInput label="Value IS accepted on blur" placeholder="Enter text, then blur the field" data={['React', 'Angular', 'Svelte']} acceptValueOnBlur /> <TagsInput label="Value IS NOT accepted on blur" placeholder="Enter text, then blur the field" data={['React', 'Angular', 'Svelte']} acceptValueOnBlur={false} mt="md" /> </> ); }Expand code Transition delay Transition component now supports enterDelay and exitDelay props to delay transition start: Open dropdownDemo.tsximport { useState } from 'react'; import { Button, Flex, Paper, Transition } from '@mantine/core'; export function Demo() { const [opened, setOpened] = useState(false); return ( <Flex maw={200} pos="relative" justify="center" m="auto"> <Button onClick={() => setOpened(true)}>Open dropdown</Button> <Transition mounted={opened} transition="pop" enterDelay={500} exitDelay={300}> {(transitionStyle) => ( <Paper shadow="md" p="xl" h={120} pos="absolute" inset={0} bottom="auto" onClick={() => setOpened(false)} style={{ ...transitionStyle, zIndex: 1 }} > Click to close </Paper> )} </Transition> </Flex> ); }Expand code Documentation updates New segmented progress example has been added to Progress component documentation Select, TagsInput and MultiSelect components documentation now includes additional demo on how to change the dropdown width New DatePicker example for excludeDate prop Other changes Pagination component now supports hideWithOnePage prop which hides pagination when there is only one page Spoiler component now supports controlled expanded state with expanded and onExpandedChange props Burger component now supports lineSize prop to change lines height Calendar, DatePicker and other similar components now support highlightToday prop to highlight today's date PreviousVersion v7.12.0NextVersion v7.10.0Welcome to Mantine, React components library that you always wished forBuild fully functional accessible web applications faster than everAboutContributeAbout MantineChangelogGitHub ReleasesCommunityChat on DiscordFollow on XFollow on GithubGitHub discussionsProjectMantine UIHelp CenterGithub organizationnpm organizationBuilt by Vitaly Rtishchev and these awesome peopleJoin Discord communityFollow Mantine on X'''
