title = "Button | Mantine"
description = "Button component to render button or link"
full_description = '''ButtonButton component to render button or linkImportimport { Button } from '@mantine/core';SourceView source codeDocsEdit this pagePackage@mantine/coreDocumentationPropsStyles APIUsage ButtonVariantDefaultFilledLightOutlineSubtleTransparentWhiteColorSizexssmmdlgxlRadiusxssmmdlgxlDemo.tsximport { Button } from '@mantine/core'; function Demo() { return <Button variant="filled">Button</Button>; }Expand code Full width If fullWidth prop is set Button will take 100% of parent width: Full width buttonDemo.tsximport { Button } from '@mantine/core'; function Demo() { return <Button fullWidth>Full width button</Button>; }Expand code Left and right sections leftSection and rightSection allow adding icons or any other element to the left and right side of the button. When a section is added, padding on the corresponding side is reduced. Note that leftSection and rightSection are flipped in RTL mode (leftSection is displayed on the right and rightSection is displayed on the left). GalleryDownloadVisit galleryDemo.tsximport { Group, Button } from '@mantine/core'; import { IconPhoto, IconDownload, IconArrowRight } from '@tabler/icons-react'; function Demo() { return ( <Group justify="center"> <Button leftSection={<IconPhoto size={14} />} variant="default"> Gallery </Button> <Button rightSection={<IconDownload size={14} />}>Download</Button> <Button variant="light" leftSection={<IconPhoto size={14} />} rightSection={<IconArrowRight size={14} />} > Visit gallery </Button> </Group> ); }Expand code Sections position justify prop sets justify-content of inner element. You can use it to change the alignment of left and right sections. For example, to spread them across the button set justify="space-between". If you need to align just one section to the side of the button set justify to space-between and add empty <span /> to the opposite section. Button labelButton labelButton labelButton labelJustifyCenterSpace-betweenDemo.tsximport { Button } from '@mantine/core'; import { IconPhoto } from '@tabler/icons-react'; function Demo() { const icon = <IconPhoto size={14} />; return ( <> <Button justify="center" fullWidth leftSection={icon} rightSection={icon} variant="default"> Button label </Button> <Button justify="center" fullWidth leftSection={icon} variant="default" mt="md"> Button label </Button> <Button justify="center" fullWidth rightSection={icon} variant="default" mt="md"> Button label </Button> <Button justify="center" fullWidth rightSection={icon} leftSection={<span />} variant="default" mt="md" > Button label </Button> </> ); }Expand code Compact size Button supports xs – xl and compact-xs – compact-xl sizes. compact sizes have the same font-size as xs – xl but reduced padding and height. Regular mdCompact mdSizexssmmdlgxlDemo.tsximport { Button, Group } from '@mantine/core'; function Demo() { return ( <Group justify="center"> <Button size="md">Regular md</Button> <Button size="compact-md">Compact md</Button> </Group> ); }Expand code Gradient variantWhen variant prop is set to gradient, you can control gradient with gradient prop, it accepts an object with from, to and deg properties. If thegradient prop is not set, Button will use theme.defaultGradient which can be configured on the theme object. gradient prop is ignored when variant is not gradient.Note that variant="gradient" supports only linear gradients with two colors. If you need a more complex gradient, then use Styles API to modify Button styles. Gradient buttonGradient fromGradient toGradient degreeDemo.tsximport { Button } from '@mantine/core'; function Demo() { return ( <Button variant="gradient" gradient={{ from: 'blue', to: 'cyan', deg: 90 }} > Gradient button </Button> ); }Expand code Disabled state To make Button disabled, set disabled prop, this will prevent any interactions with the button and add disabled styles. If you want the button to just look disabled but still be interactive, set data-disabled prop instead. Note that disabled styles are the same for all variants. Disabled buttonDemo.tsximport { Button } from '@mantine/core'; function Demo() { return <Button disabled>Disabled button</Button>; }Expand code Disabled state when Button is link <a /> element does not support disabled attribute. To make Button disabled when it is rendered as a link, set data-disabled attribute instead and prevent default behavior in onClick event handler. Disabled linkDemo.tsximport { Button } from '@mantine/core'; function Demo() { return ( <Button component="a" href="https://mantine.dev" data-disabled onClick={(event) => event.preventDefault()} > Disabled link </Button> ); }Expand code Customize disabled styles To customize disabled styles, it is recommended to use both &:disabled and &[data-disabled] selectors: &:disabled is used to style the button when disabled prop is set and also when the button is disabled by the parent component (for example, when disabled prop is set on a <fieldset /> element which contains Button). &[data-disabled] is used to style the button when it is not actually disabled but should look like it is (for example, data-disabled should be used if you need to use Tooltip with disabled Button or when Button is used as a link) Disabled with stylesDemo.module.cssDemo.tsx.button { &:disabled, &[data-disabled] { border-color: light-dark(var(--mantine-color-gray-3), var(--mantine-color-dark-4)); background-color: transparent; } }Expand code Disabled button with Tooltip onMouseLeave event is not triggered when Button is disabled, so if you need to use Tooltip with disabled Button you need to set data-disabled prop on Button instead of disabled. Note that it is also required to change onClick event handler to (event) => event.preventDefault() as Button is not actually disabled and will still trigger onClick event. Disabled button with tooltipDemo.tsximport { Button, Tooltip } from '@mantine/core'; function Demo() { return ( <Tooltip label="Tooltip for disabled button"> <Button data-disabled onClick={(event) => event.preventDefault()}> Disabled button with tooltip </Button> </Tooltip> ); }Expand code Loading state When loading prop is set, Button will be disabled and Loader with overlay will be rendered in the center of the button. Loader color depends on Button variant. Filled buttonLight buttonOutline buttonLoading stateDemo.tsximport { Button, Group, Switch } from '@mantine/core'; import { useDisclosure } from '@mantine/hooks'; function Demo() { const [loading, { toggle }] = useDisclosure(); return ( <> <Group> <Button loading={loading}>Filled button</Button> <Button variant="light" loading={loading}> Light button </Button> <Button variant="outline" loading={loading}> Outline button </Button> </Group> <Switch checked={loading} onChange={toggle} label="Loading state" mt="md" /> </> ); }Expand code Loader props You can customize Loader with loaderProps prop, it accepts all props that Loader component has: Loading buttonDemo.tsximport { Button } from '@mantine/core'; function Demo() { return ( <Button loading loaderProps={{ type: 'dots' }}> Loading button </Button> ); }Expand code Styles APIButton supports Styles API, you can add styles to any inner element of the component withclassNames prop. Follow Styles API documentation to learn more. /* * Hover over selectors to apply outline styles * */Your emailComponent Styles APIHover over selectors to highlight corresponding elementsrootRoot elementloaderLoader component, displayed only when `loading` prop is setinnerContains all other elements, child of the `root` elementsectionLeft and right sections of the buttonlabelButton childrenDemo.module.cssDemo.tsx/* * Hover over selectors to apply outline styles * */Expand code Example of customizing Button with Styles API and data-* attributes: 12Send files3Send filesDemo.module.cssDemo.tsx.root { border-top-left-radius: var(--mantine-radius-xl); border-bottom-left-radius: var(--mantine-radius-xl); padding-left: 4px; /* The following styles will be applied only when button is disabled */ &[data-disabled] { /* You can use Mantine PostCSS mixins inside data attributes */ @mixin light { border: 1px solid var(--mantine-color-gray-2); } @mixin dark { border: 1px solid var(--mantine-color-dark-4); } /* You can target child elements that are inside .root[data-disabled] */ & .section[data-position='left'] { opacity: 0.6; } } } .section { /* Apply styles only to left section */ &[data-position='left'] { --section-size: calc(var(--button-height) - 8px); background-color: var(--mantine-color-body); color: var(--mantine-color-text); height: var(--section-size); width: var(--section-size); display: flex; align-items: center; justify-content: center; border-radius: var(--mantine-radius-xl); } &[data-position='right'] { @mixin rtl { transform: rotate(180deg); } } }Expand code Custom variants To add new Button variants, use data-variant attribute. Usually new variants are added on theme, this way they are available in all Button components in your application. Danger variantPrimary variantDemo.tsxDemo.module.cssimport { Group, Button, MantineProvider, createTheme } from '@mantine/core'; import classes from './Demo.module.css'; const theme = createTheme({ components: { Button: Button.extend({ classNames: classes, }), }, }); function Demo() { return ( <MantineProvider theme={theme}> <Group> <Button variant="danger">Danger variant</Button> <Button variant="primary">Primary variant</Button> </Group> </MantineProvider> ); }Expand code Customize variants colors You can customize colors for Button and other components variants by adding variantColorResolver to your theme. Lime filled buttonOrange light buttonDanger buttonDemo.tsximport { Button, Group, MantineProvider, defaultVariantColorsResolver, VariantColorsResolver, parseThemeColor, rgba, darken, } from '@mantine/core'; const variantColorResolver: VariantColorsResolver = (input) => { const defaultResolvedColors = defaultVariantColorsResolver(input); const parsedColor = parseThemeColor({ color: input.color || input.theme.primaryColor, theme: input.theme, }); // Override some properties for variant if (parsedColor.isThemeColor && parsedColor.color === 'lime' && input.variant === 'filled') { return { ...defaultResolvedColors, color: 'var(--mantine-color-black)', hoverColor: 'var(--mantine-color-black)', }; } // Completely override variant if (input.variant === 'light') { return { background: rgba(parsedColor.value, 0.1), hover: rgba(parsedColor.value, 0.15), border: `1px solid ${parsedColor.value}`, color: darken(parsedColor.value, 0.1), }; } // Add new variants support if (input.variant === 'danger') { return { background: 'var(--mantine-color-red-9)', hover: 'var(--mantine-color-red-8)', color: 'var(--mantine-color-white)', border: 'none', }; } return defaultResolvedColors; }; function Demo() { return ( <MantineProvider theme={{ variantColorResolver }}> <Group> <Button color="lime.4" variant="filled"> Lime filled button </Button> <Button color="orange" variant="light"> Orange light button </Button> <Button variant="danger">Danger button</Button> </Group> </MantineProvider> ); }Expand code autoContrastButton supports autoContrast prop and theme.autoContrast. If autoContrast is set either on Button or on theme, content color will be adjusted to have sufficient contrast with the value specified in color prop.Note that autoContrast feature works only if you use color prop to change background color. autoContrast works only with filled variant. DefaultAuto contrastDemo.tsximport { Button, Group } from '@mantine/core'; function Demo() { return ( <Group> <Button color="lime.4">Default</Button> <Button color="lime.4" autoContrast> Auto contrast </Button> </Group> ); }Expand code Button.Group FirstSecondThirdOrientationHorizontalVerticalDemo.tsximport { Button } from '@mantine/core'; function Demo() { return ( <Button.Group> <Button variant="default">First</Button> <Button variant="default">Second</Button> <Button variant="default">Third</Button> </Button.Group> ); }Expand code Note that you must not wrap child Button components with any additional elements: import { Button } from '@mantine/core'; function Demo() { return ( <Button.Group> <div> <Button>This will not work</Button> </div> <Button>Buttons will have incorrect borders</Button> </Button.Group> ); } Button.GroupSection Use Button.GroupSection component to render sections that are not buttons inside Button.Group: 135Demo.tsximport { IconChevronDown, IconChevronUp } from '@tabler/icons-react'; import { Button } from '@mantine/core'; import { useCounter } from '@mantine/hooks'; function Demo() { const [value, { increment, decrement }] = useCounter(135, { min: 0 }); return ( <Button.Group> <Button variant="default" radius="md" onClick={decrement}> <IconChevronDown color="var(--mantine-color-red-text)" /> </Button> <Button.GroupSection variant="default" bg="var(--mantine-color-body)" miw={80}> {value} </Button.GroupSection> <Button variant="default" radius="md" onClick={increment}> <IconChevronUp color="var(--mantine-color-teal-text)" /> </Button> </Button.Group> ); }Expand code Polymorphic componentButton is a polymorphic component – its default root element is button, but it can be changed to any other element or component with component prop:import { Button } from '@mantine/core'; function Demo() { return <Button component="a" />; }You can also use components in component prop, for example, Next.js Link:import Link from 'next/link'; import { Button } from '@mantine/core'; function Demo() { return <Button component={Link} href="/" />; }Polymorphic components with TypeScriptNote that polymorphic components props types are different from regular components – they do not extend HTML element props of the default element. For example, ButtonProps does not extend React.ComponentPropsWithoutRef'<'div'>' although button is the default element.If you want to create a wrapper for a polymorphic component that is not polymorphic (does not support component prop), then your component props interface should extend HTML element props, for example: import type { ButtonProps, ElementProps } from '@mantine/core'; interface MyButtonProps extends ButtonProps, ElementProps<'a', keyof ButtonProps> {}If you want your component to remain polymorphic after wrapping, use createPolymorphicComponent function described in this guide. Get element refimport { useRef } from 'react'; import { Button } from '@mantine/core'; function Demo() { const ref = useRef<HTMLButtonElement>(null); return <Button ref={ref} />; }PreviousActionIconNextCloseButtonWelcome to Mantine, React components library that you always wished forBuild fully functional accessible web applications faster than everAboutContributeAbout MantineChangelogGitHub ReleasesCommunityChat on DiscordFollow on XFollow on GithubGitHub discussionsProjectMantine UIHelp CenterGithub organizationnpm organizationBuilt by Vitaly Rtishchev and these awesome peopleJoin Discord communityFollow Mantine on X'''
