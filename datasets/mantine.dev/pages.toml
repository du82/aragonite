["https://mantine.dev/changelog/7-10-0"]
title = "Version v7.10.0 | Mantine"
description = "React components and hooks library with native dark theme support and focus on usability, accessibility and developer experience"
full_description = '''Version v7.10.0Release dateMay 23rd, 2024Source codeRelease on GitHubTree component New Tree component: srcnode_modulespackage.jsontsconfig.jsonDemo.tsxDemo.module.cssdata.tsimport { IconFolder, IconFolderOpen } from '@tabler/icons-react'; import { Group, RenderTreeNodePayload, Tree } from '@mantine/core'; import { CssIcon, NpmIcon, TypeScriptCircleIcon } from '@mantinex/dev-icons'; import { data, dataCode } from './data'; import classes from './Demo.module.css'; interface FileIconProps { name: string; isFolder: boolean; expanded: boolean; } function FileIcon({ name, isFolder, expanded }: FileIconProps) { if (name.endsWith('package.json')) { return <NpmIcon size={14} />; } if (name.endsWith('.ts') || name.endsWith('.tsx') || name.endsWith('tsconfig.json')) { return <TypeScriptCircleIcon size={14} />; } if (name.endsWith('.css')) { return <CssIcon size={14} />; } if (isFolder) { return expanded ? ( <IconFolderOpen color="var(--mantine-color-yellow-9)" size={14} stroke={2.5} /> ) : ( <IconFolder color="var(--mantine-color-yellow-9)" size={14} stroke={2.5} /> ); } return null; } function Leaf({ node, expanded, hasChildren, elementProps }: RenderTreeNodePayload) { return ( <Group gap={5} {...elementProps}> <FileIcon name={node.value} isFolder={hasChildren} expanded={expanded} /> <span>{node.label}</span> </Group> ); } function Demo() { return ( <Tree classNames={classes} selectOnClick clearSelectionOnOutsideClick data={data} renderNode={(payload) => <Leaf {...payload} />} /> ); }Expand code form.getInputNode New form.getInputNode(path) handler returns input DOM node for the given field path. Form example, it can be used to focus input on form submit if there is an error: Your name *Your email *SubmitDemo.tsximport { Button, Group, TextInput } from '@mantine/core'; import { isEmail, isNotEmpty, useForm } from '@mantine/form'; function Demo() { const form = useForm({ mode: 'uncontrolled', name: 'register-form', initialValues: { name: '', email: '', }, validate: { name: isNotEmpty('Name is required'), email: isEmail('Invalid email'), }, }); return ( <form onSubmit={form.onSubmit( (values) => console.log(values), (errors) => { const firstErrorPath = Object.keys(errors)[0]; form.getInputNode(firstErrorPath)?.focus(); } )} > <TextInput withAsterisk label="Your name" placeholder="Your name" key={form.key('name')} {...form.getInputProps('name')} /> <TextInput withAsterisk label="Your email" placeholder="your@email.com" mt="md" key={form.key('email')} {...form.getInputProps('email')} /> <Group justify="flex-end" mt="md"> <Button type="submit">Submit</Button> </Group> </form> ); }Expand code Container queries in SimpleGrid You can now use container queries in SimpleGrid component. With container queries, grid columns and spacing will be adjusted based on the container width, not the viewport width. Example of using container queries. To see how the grid changes, resize the root element of the demo with the resize handle located at the bottom right corner of the demo: .__m__-R5adbblu6{--sg-spacing-x:calc(0.625rem * var(--mantine-scale));--sg-spacing-y:calc(0.625rem * var(--mantine-scale));--sg-cols:1;}@container simple-grid (min-width: base){.__m__-R5adbblu6{--sg-spacing-x:calc(0.625rem * var(--mantine-scale));--sg-spacing-y:calc(0.625rem * var(--mantine-scale));--sg-cols:1;}}@container simple-grid (min-width: 300px){.__m__-R5adbblu6{--sg-spacing-x:var(--mantine-spacing-xl);--sg-spacing-y:var(--mantine-spacing-xl);--sg-cols:2;}}@container simple-grid (min-width: 500px){.__m__-R5adbblu6{--sg-cols:5;}}12345Demo.tsximport { SimpleGrid } from '@mantine/core'; function Demo() { return ( // Wrapper div is added for demonstration purposes only, // it is not required in real projects <div style={{ resize: 'horizontal', overflow: 'hidden', maxWidth: '100%' }}> <SimpleGrid type="container" cols={{ base: 1, '300px': 2, '500px': 5 }} spacing={{ base: 10, '300px': 'xl' }} > <div>1</div> <div>2</div> <div>3</div> <div>4</div> <div>5</div> </SimpleGrid> </div> ); }Expand code Checkbox and Radio indicators New Checkbox.Indicator and Radio.Indicator components look exactly the same as Checkbox and Radio components, but they do not have any semantic meaning, they are just visual representations of checkbox and radio states. Checkbox.Indicator component: Demo.tsximport { Checkbox, Group } from '@mantine/core'; function Demo() { return ( <Group> <Checkbox.Indicator /> <Checkbox.Indicator checked /> <Checkbox.Indicator indeterminate /> <Checkbox.Indicator disabled /> <Checkbox.Indicator disabled checked /> <Checkbox.Indicator disabled indeterminate /> </Group> ); }Expand code Radio.Indicator component: Demo.tsximport { Radio, Group } from '@mantine/core'; function Demo() { return ( <Group> <Radio.Indicator /> <Radio.Indicator checked /> <Radio.Indicator disabled /> <Radio.Indicator disabled checked /> </Group> ); }Expand code Checkbox and Radio cards New Checkbox.Card and Radio.Card components can be used as replacements for Checkbox and Radio to build custom cards/buttons/etc. that work as checkboxes and radios. Components are accessible by default and support the same keyboard interactions as input[type="checkbox"] and input[type="radio"]. Checkbox.Card component: @mantine/coreCore components library: inputs, buttons, overlays, etc.Demo.tsxDemo.module.cssimport { useState } from 'react'; import { Checkbox, Group, Text } from '@mantine/core'; import classes from './Demo.module.css'; function Demo() { const [checked, setChecked] = useState(false); return ( <Checkbox.Card className={classes.root} radius="md" checked={checked} onClick={() => setChecked((c) => !c)} > <Group wrap="nowrap" align="flex-start"> <Checkbox.Indicator /> <div> <Text className={classes.label}>@mantine/core</Text> <Text className={classes.description}> Core components library: inputs, buttons, overlays, etc. </Text> </div> </Group> </Checkbox.Card> ); }Expand code Checkbox.Card component with Checkbox.Group: Pick packages to installChoose all packages that you will need in your application@mantine/coreCore components library: inputs, buttons, overlays, etc.@mantine/hooksCollection of reusable hooks for React applications.@mantine/notificationsNotifications systemCurrentValue: –Demo.tsxDemo.module.cssimport { useState } from 'react'; import { Checkbox, Group, Stack, Text } from '@mantine/core'; import classes from './Demo.module.css'; const data = [ { name: '@mantine/core', description: 'Core components library: inputs, buttons, overlays, etc.', }, { name: '@mantine/hooks', description: 'Collection of reusable hooks for React applications.' }, { name: '@mantine/notifications', description: 'Notifications system' }, ]; function Demo() { const [value, setValue] = useState<string[]>([]); const cards = data.map((item) => ( <Checkbox.Card className={classes.root} radius="md" value={item.name} key={item.name}> <Group wrap="nowrap" align="flex-start"> <Checkbox.Indicator /> <div> <Text className={classes.label}>{item.name}</Text> <Text className={classes.description}>{item.description}</Text> </div> </Group> </Checkbox.Card> )); return ( <> <Checkbox.Group value={value} onChange={setValue} label="Pick packages to install" description="Choose all packages that you will need in your application" > <Stack pt="md" gap="xs"> {cards} </Stack> </Checkbox.Group> <Text fz="xs" mt="md"> CurrentValue: {value.join(', ') || '–'} </Text> </> ); }Expand code Radio.Card component: @mantine/coreCore components library: inputs, buttons, overlays, etc.Demo.tsxDemo.module.cssimport { useState } from 'react'; import { Radio, Group, Text } from '@mantine/core'; import classes from './Demo.module.css'; function Demo() { const [checked, setChecked] = useState(false); return ( <Radio.Card className={classes.root} radius="md" checked={checked} onClick={() => setChecked((c) => !c)} > <Group wrap="nowrap" align="flex-start"> <Radio.Indicator /> <div> <Text className={classes.label}>@mantine/core</Text> <Text className={classes.description}> Core components library: inputs, buttons, overlays, etc. </Text> </div> </Group> </Radio.Card> ); }Expand code Radio.Card component with Radio.Group: Pick one package to installChoose a package that you will need in your application@mantine/coreCore components library: inputs, buttons, overlays, etc.@mantine/hooksCollection of reusable hooks for React applications.@mantine/notificationsNotifications systemCurrentValue: –Demo.tsxDemo.module.cssimport { useState } from 'react'; import { Radio, Group, Stack, Text } from '@mantine/core'; import classes from './Demo.module.css'; const data = [ { name: '@mantine/core', description: 'Core components library: inputs, buttons, overlays, etc.', }, { name: '@mantine/hooks', description: 'Collection of reusable hooks for React applications.' }, { name: '@mantine/notifications', description: 'Notifications system' }, ]; function Demo() { const [value, setValue] = useState<string | null>(null); const cards = data.map((item) => ( <Radio.Card className={classes.root} radius="md" value={item.name} key={item.name}> <Group wrap="nowrap" align="flex-start"> <Radio.Indicator /> <div> <Text className={classes.label}>{item.name}</Text> <Text className={classes.description}>{item.description}</Text> </div> </Group> </Radio.Card> )); return ( <> <Radio.Group value={value} onChange={setValue} label="Pick one package to install" description="Choose a package that you will need in your application" > <Stack pt="md" gap="xs"> {cards} </Stack> </Radio.Group> <Text fz="xs" mt="md"> CurrentValue: {value || '–'} </Text> </> ); }Expand code bd style prop New bd style prop can be used to set border CSS property. It is available in all components that support style props. Border width value is automatically converted to rem. For border color you can reference theme colors similar to other style props: import { Box } from '@mantine/core'; function Demo() { return <Box bd="1px solid red.5" />; }PreviousVersion v7.11.0NextVersion v7.9.0Welcome to Mantine, React components library that you always wished forBuild fully functional accessible web applications faster than everAboutContributeAbout MantineChangelogGitHub ReleasesCommunityChat on DiscordFollow on XFollow on GithubGitHub discussionsProjectMantine UIHelp CenterGithub organizationnpm organizationBuilt by Vitaly Rtishchev and these awesome peopleJoin Discord communityFollow Mantine on X'''
