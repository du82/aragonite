["https://mantine.dev/styles/css-variables"]
title = "CSS variables | Mantine"
description = "React components and hooks library with native dark theme support and focus on usability, accessibility and developer experience"
full_description = '''Mantine CSS variables MantineProvider exposes all Mantine CSS variables based on the given theme. You can use these variables in CSS files, style prop or any other styles. Note that not all values are documented on this page, you can find full list of variables on this page. Typography variables Typography variables control font family, font size, line height, font weight, and other text-related properties of all Mantine components. Font family The following CSS variables are used to assign font families to all Mantine components: VariableDefault value--mantine-font-familyControls font-family property of most Mantine componentssystem sans-serif fonts--mantine-font-family-monospaceControls font-family property of code blockssystem monospace fonts--mantine-font-family-headingsControls font-family property of headingssystem sans-serif fonts You can control these variables in the theme. Note that if theme.headings.fontFamily is not set, --mantine-font-family-headings value will be the same as --mantine-font-family. import { createTheme } from '@mantine/core'; const theme = createTheme({ // Controls --mantine-font-family fontFamily: 'Arial, sans-serif', // Controls --mantine-font-family-monospace fontFamilyMonospace: 'Courier New, monospace', headings: { // Controls --mantine-font-family-headings fontFamily: 'Georgia, serif', }, }); If you want to use system fonts as a fallback for custom fonts, you can reference DEFAULT_THEME value instead of defining it manually: import { createTheme, DEFAULT_THEME } from '@mantine/core'; const theme = createTheme({ fontFamily: `Roboto, ${DEFAULT_THEME.fontFamily}`, }); You can reference font family variables in your CSS: .text { font-family: var(--mantine-font-family); } .code { font-family: var(--mantine-font-family-monospace); } .heading { font-family: var(--mantine-font-family-headings); } And in ff style prop: ff="text" will use --mantine-font-family variable ff="monospace" will use --mantine-font-family-monospace variable ff="heading" will use --mantine-font-family-headings variable import { Text } from '@mantine/core'; function Demo() { return ( <Text ff="monospace"> This text uses --mantine-font-family-monospace variable </Text> ); } Font size Font size variables are used in most Mantine components to control text size. The variable that is chosen depends on the component and its size prop. VariableDefault value--mantine-font-size-xs0.75rem (12px)--mantine-font-size-sm0.875rem (14px)--mantine-font-size-md1rem (16px)--mantine-font-size-lg1.125rem (18px)--mantine-font-size-xl1.25rem (20px) You can reference font size variables in CSS: .demo { font-size: var(--mantine-font-size-md); } And in fz style prop: import { Text } from '@mantine/core'; function Demo() { return ( <Text fz="xl"> This text uses --mantine-font-size-xl variable </Text> ); } To define custom font sizes, can use theme.fontSizes property: import { createTheme } from '@mantine/core'; const theme = createTheme({ fontSizes: { xs: '0.5rem', sm: '0.75rem', md: '1rem', lg: '1.25rem', xl: '1.5rem', }, }); Note that theme.fontSizes object is merged with the DEFAULT_THEME.fontSizes – it is not required to define all values, only those that you want to change. import { createTheme } from '@mantine/core'; // Changes only xs font size, // other values will be taken from the DEFAULT_THEME const theme = createTheme({ fontSizes: { xs: '0.5rem', }, }); You can add any number of additional font sizes to the theme.fontSizes object. These values will be defined as CSS variables in --mantine-font-size-{size} format: import { createTheme } from '@mantine/core'; const theme = createTheme({ fontSizes: { xxs: '0.125rem', xxl: '2rem', }, }); After defining theme.fontSizes, you can reference these variables in your CSS: .demo { font-size: var(--mantine-font-size-xxs); } Case conversion Case conversion (camelCase to kebab-case) is not automatically applied to custom font sizes. If you define theme.fontSizes with camelCase keys, you need to reference them in camelCase format. For example, if you define { customSize: '1rem' }, you need to reference it as --mantine-font-size-customSize. Line height Line height variables are used in Text component. In other components, line-height is either calculated based on font size or set to --mantine-line-height, which is an alias for --mantine-line-height-md. VariableDefault value--mantine-line-height1.55--mantine-line-height-xs1.4--mantine-line-height-sm1.45--mantine-line-height-md1.55--mantine-line-height-lg1.6--mantine-line-height-xl1.65 You can reference line height variables in your CSS: .demo { line-height: var(--mantine-line-height-md); } And in lh style prop: import { Text } from '@mantine/core'; function Demo() { return ( <Text lh="xl"> This text uses --mantine-line-height-xl variable </Text> ); } To define custom line heights, you can use theme.lineHeights property: import { createTheme } from '@mantine/core'; const theme = createTheme({ lineHeights: { xs: '1.2', sm: '1.3', md: '1.4', lg: '1.5', xl: '1.6', }, }); Headings theme.headings controls font-size, line-height, font-weight and text-wrap CSS properties of headings in Title and TypographyStylesProvider components. VariableDefault valueGeneral variables--mantine-heading-font-weightControls font-weight property of all headings if not overridden700--mantine-heading-text-wrapControls text-wrap property of all headingswraph1 heading--mantine-h1-font-size2.125rem (34px)--mantine-h1-line-height1.3--mantine-h1-font-weight700h2 heading--mantine-h2-font-size1.625rem (26px)--mantine-h2-line-height1.35--mantine-h2-font-weight700h3 heading--mantine-h3-font-size1.375rem (22px)--mantine-h3-line-height1.4--mantine-h3-font-weight700h4 heading--mantine-h4-font-size1.125rem (18px)--mantine-h4-line-height1.45--mantine-h4-font-weight700h5 heading--mantine-h5-font-size1rem (16px)--mantine-h5-line-height1.5--mantine-h5-font-weight700h6 heading--mantine-h6-font-size0.875rem (14px)--mantine-h6-line-height1.5--mantine-h6-font-weight700 These variables are used in Title component, order prop controls which heading level to use. For example, order={3} Title will use: --mantine-h3-font-size --mantine-h3-line-height --mantine-h3-font-weight This is h1 titleThis is h2 titleThis is h3 titleThis is h4 titleThis is h5 titleThis is h6 titleDemo.tsximport { Title } from '@mantine/core'; function Demo() { return ( <> <Title order={1}>This is h1 title</Title> <Title order={2}>This is h2 title</Title> <Title order={3}>This is h3 title</Title> <Title order={4}>This is h4 title</Title> <Title order={5}>This is h5 title</Title> <Title order={6}>This is h6 title</Title> </> ); }Expand code You can reference heading variables in your CSS: .h1 { font-size: var(--mantine-h1-font-size); line-height: var(--mantine-h1-line-height); font-weight: var(--mantine-h1-font-weight); } And in fz and lh style props: import { Box } from '@mantine/core'; function Demo() { return ( <Box fz="h1" lh="h1"> This text uses --mantine-h1-* variables </Box> ); } To change heading styles, can use theme.headings property: import { createTheme } from '@mantine/core'; const theme = createTheme({ headings: { sizes: { h1: { fontSize: '2rem', lineHeight: '1.5', fontWeight: '500', }, h2: { fontSize: '1.5rem', lineHeight: '1.6', fontWeight: '500', }, }, // ... }, }); theme.headings object is deeply merged with the DEFAULT_THEME.headings object – it is not required to define all values, only those that you want to change. import { createTheme } from '@mantine/core'; // Changes only font-size of h1, // other values will be taken from the DEFAULT_THEME const theme = createTheme({ headings: { sizes: { h1: { fontSize: '2rem', }, }, }, }); Font smoothing Font smoothing variables control -webkit-font-smoothing and moz-osx-font-smoothing CSS properties. These variables are used to make text look better on screens with high pixel density. Font smoothing variables are controlled by theme.fontSmoothing theme property, it is true by default. If theme.fontSmoothing is false, both variables will be set to unset. VariableDefault value--mantine-webkit-font-smoothingControls -webkit-font-smoothing CSS propertyantialiased--mantine-moz-font-smoothingControls -moz-osx-font-smoothing CSS propertygrayscale If you need to override font smoothing values, the best way is to disable theme.fontSmoothing and set global styles on the body element: import { createTheme } from '@mantine/core'; // Disable font smoothing in your theme const theme = createTheme({ fontSmoothing: false, }); // Add global styles to your project with desired font smoothing values body { -webkit-font-smoothing: subpixel-antialiased; -moz-osx-font-smoothing: auto; } Colors variables Colors variables are controlled by theme.colors and theme.primaryColor. Each color defined in theme.colors object is required to have 10 shades. Theme color can be referenced by its name and shade index, for example, --mantine-color-red-6. You can define new colors on the theme object or override existing colors: import { createTheme } from '@mantine/core'; const theme = createTheme({ colors: { demo: [ '#FF0000', '#FF3333', '#FF6666', '#FF9999', '#FFCCCC', '#FFEEEE', '#FFFAFA', '#FFF5F5', '#FFF0F0', '#FFEBEB', ], }, }); The code above will define the following CSS variables: VariableDefault value--mantine-color-demo-0#FF0000--mantine-color-demo-1#FF3333--mantine-color-demo-2#FF6666--mantine-color-demo-3#FF9999--mantine-color-demo-4#FFCCCC--mantine-color-demo-5#FFEEEE--mantine-color-demo-6#FFFAFA--mantine-color-demo-7#FFF5F5--mantine-color-demo-8#FFF0F0--mantine-color-demo-9#FFEBEB Variant colors Some Mantine components like Button or Badge have variant prop that in combination with color prop controls the component text, background and border colors. For each variant and color, Mantine defines a set of CSS variables that control these colors. For example, for the default blue color the following CSS variables are defined: VariableDefault valueFilled variant--mantine-color-blue-filledBackground color of filled variantvar(--mantine-color-blue-6)--mantine-color-blue-filled-hoverBackground color of filled variant on hovervar(--mantine-color-blue-7)Light variant--mantine-color-blue-lightBackground color of light variantrgba(34, 139, 230, 0.1)--mantine-color-blue-light-hoverBackground color of light variant on hoverrgba(34, 139, 230, 0.12)--mantine-color-blue-light-colorText color of light variantvar(--mantine-color-blue-6)Outline variant--mantine-color-blue-outlineBorder color of outline variantvar(--mantine-color-blue-6)--mantine-color-blue-outline-hoverBorder color of outline variantrgba(34, 139, 230, 0.05) For example, if you use Button component the following way: import { Button } from '@mantine/core'; function Demo() { return ( <Button color="pink" variant="filled"> Filled pink button </Button> ); } The component will have the following styles: Background color will be var(--mantine-color-pink-filled) Background color on hover will be var(--mantine-color-pink-filled-hover) Text color will be var(--mantine-color-white) Border color will be transparent Note that the variables above are not static, they are generated based on the values of theme.colors and theme.primaryShade. Additionally, their values are different for dark and light color schemes. Variant colors variables are used in all components that support color prop, for example, Button, Badge, Avatar and Pagination. Colors values that are used by these components are determined by cssVariablesResolver described below and variantColorResolver. Primary color variables Primary color variables are defined by theme.primaryColor (which must be a key of theme.colors). The following CSS variables are defined for the primary color: VariableDefault value--mantine-primary-color-{shade}Shade is 0-9 to reference specific primary color shadevar(--mantine-color-{primaryColor}-{shade})--mantine-primary-color-filledBackground color of filled variantvar(--mantine-color-{primaryColor}-filled)--mantine-primary-color-filled-hoverBackground color of filled variant on hovervar(--mantine-color-{primaryColor}-filled-hover)--mantine-primary-color-lightBackground color of light variantvar(--mantine-color-{primaryColor}-light)--mantine-primary-color-light-hoverBackground color of light variant on hovervar(--mantine-color-{primaryColor}-light-hover)--mantine-primary-color-light-colorText color of light variantvar(--mantine-color-{primaryColor}-light-color) You can reference primary color variables in CSS: .demo { color: var(--mantine-primary-color-0); background-color: var(--mantine-primary-color-filled); } Other color variables The following colors are used in various Mantine components. Note that default values are provided for the light color scheme, dark color scheme values are different. VariableDefault value--mantine-color-whiteValue of theme.white#fff--mantine-color-blackValue of theme.black#000--mantine-color-textColor used for text in the body elementvar(--mantine-color-black)--mantine-color-bodyBody background colorvar(--mantine-color-white)--mantine-color-errorColor used for error messages and statesvar(--mantine-color-red-6)--mantine-color-placeholderColor used for input placeholdersvar(--mantine-color-gray-5)--mantine-color-dimmedColor used for dimmed textvar(--mantine-color-gray-6)--mantine-color-brightColor used for bright textvar(--mantine-color-black)--mantine-color-anchorColor used for linksvar(--mantine-primary-color-6)--mantine-color-defaultBackground color of default variantvar(--mantine-color-white)--mantine-color-default-hoverBackground color of default variant on hovervar(--mantine-color-gray-0)--mantine-color-default-colorText color of default variantvar(--mantine-color-black)--mantine-color-default-borderBorder color of default variantvar(--mantine-color-gray-4) Spacing variables theme.spacing values are used in most Mantine components to control paddings, margins, and other spacing-related properties. The following CSS variables are defined based on theme.spacing: VariableDefault value--mantine-spacing-xs0.625rem (10px)--mantine-spacing-sm0.75rem (12px)--mantine-spacing-md1rem (16px)--mantine-spacing-lg1.25rem (20px)--mantine-spacing-xl2rem (32px) To define custom spacing values, use theme.spacing property: import { createTheme } from '@mantine/core'; const theme = createTheme({ spacing: { xs: '0.5rem', sm: '0.75rem', md: '1rem', lg: '1.5rem', xl: '2rem', }, }); Border radius variables Mantine components that support radius prop use border radius variables to control border radius. The following CSS variables are defined based on theme.radius: VariableDefault value--mantine-radius-xs0.125rem (2px)--mantine-radius-sm0.25rem (4px)--mantine-radius-md0.5rem (8px)--mantine-radius-lg1rem (16px)--mantine-radius-xl2rem (32px) Additionally, --mantine-radius-default variable is defined based on theme.defaultRadius value. If radius prop on components is not set explicitly, --mantine-radius-default is used instead. To define custom border radius'''
