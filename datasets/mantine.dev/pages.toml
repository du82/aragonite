title = "Usage with Gatsby | Mantine"
description = "React components and hooks library with native dark theme support and focus on usability, accessibility and developer experience"
full_description = '''Usage with Gatsby Get started with a templateThe easiest way to get started is to use one of the templates. All templates are configured correctly: they include PostCSS setup, ColorSchemeScript and other essential features. Some templates also include additional features like Jest, Storybook and ESLint.If you are not familiar with GitHub, you can find a detailed instruction on how to bootstrap a project from a template on this page.gatsby-templateGatsby template with basic setupUse template Generate new application Follow Gatsby quick start guide to create new Gatsby application: yarnnpmyarn create gatsbyExpand code When asked "Would you like to install a styling system?", select PostCSS. Installation Choose packages that you will use in your application:PackageDescription@mantine/hooksHooks for state and UI management@mantine/coreCore components library: inputs, buttons, overlays, etc.@mantine/formForm management library@mantine/datesDate inputs, calendars@mantine/chartsRecharts based charts library@mantine/notificationsNotifications system@mantine/code-highlightCode highlight with your theme colors and styles@mantine/tiptapRich text editor based on Tiptap@mantine/dropzoneCapture files with drag and drop@mantine/carouselEmbla based carousel component@mantine/spotlightOverlay command center@mantine/modalsCentralized modals manager@mantine/nprogressNavigation progressInstall dependencies:yarnnpmyarn add @mantine/core @mantine/hooksExpand code PostCSS setup Install PostCSS plugins and postcss-preset-mantine: yarnnpmyarn add --dev postcss postcss-preset-mantine postcss-simple-varsExpand code Create postcss.config.cjs file at the root of your application with the following content: module.exports = { plugins: { 'postcss-preset-mantine': {}, 'postcss-simple-vars': { variables: { 'mantine-breakpoint-xs': '36em', 'mantine-breakpoint-sm': '48em', 'mantine-breakpoint-md': '62em', 'mantine-breakpoint-lg': '75em', 'mantine-breakpoint-xl': '88em', }, }, }, }; Setup Create src/theme.ts file with your theme override: // src/theme.ts import { createTheme } from '@mantine/core'; export const theme = createTheme({ fontFamily: 'serif', // ... other theme override properties }); Create gatsby-ssr.tsx with the following content: import { ColorSchemeScript, MantineProvider } from '@mantine/core'; import { theme } from './src/theme'; export const onPreRenderHTML = ({ getHeadComponents, replaceHeadComponents, }) => { const headComponents = getHeadComponents(); replaceHeadComponents([ ...headComponents, <ColorSchemeScript key="color-scheme-script" />, ]); }; export const wrapPageElement = ({ element }) => { return <MantineProvider theme={theme}>{element}</MantineProvider>; }; Create gatsby-browser.tsx with the following content: // Import styles of packages that you've installed. // All packages except `@mantine/hooks` require styles imports import '@mantine/core/styles.css'; import { MantineProvider } from '@mantine/core'; import { theme } from './src/theme'; export const wrapPageElement = ({ element }) => { return <MantineProvider theme={theme}>{element}</MantineProvider>; }; All set! Start development server: npm run develop CSS modules By default, Gatsby has different syntax for importing CSS modules: // Default syntax – will not work in Gatsby import classes from './Demo.module.css'; // Gatsby syntax import * as classes from './Demo.module.css';PreviousUsage with React RouterNextUsage with RedwoodWelcome to Mantine, React components library that you always wished forBuild fully functional accessible web applications faster than everAboutContributeAbout MantineChangelogGitHub ReleasesCommunityChat on DiscordFollow on XFollow on GithubGitHub discussionsProjectMantine UIHelp CenterGithub organizationnpm organizationBuilt by Vitaly Rtishchev and these awesome peopleJoin Discord communityFollow Mantine on X'''
