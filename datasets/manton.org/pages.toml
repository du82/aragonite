full_description = "Dave Winer mentions some of Mar 24, 2002 Dave Winer mentions some of the thought his team put into making Radio Userland respond quickly to the user. Thank you. The thing that makes this possible (that most other apps don’t have, whether they are web-based or not) is the events page, a human-readable log of events and actions taken on your behalf by Radio. Instead of interrupting the user with error messages or “your blog has been published” notifications, those messages are hidden until asked for. It would be nice if the user could tell at a glance if there were any fatal errors, though. On the desktop web site home page, add a more useful summary to the events area: “Events: 23 since midnight (1 fatal error)”, with a hyperlink to the specific problem events. (Maybe the software already does this?) Manton Reece @manton"
