["https://www.manton.org/2003/08/18/austin-sketch-group.html"]
title = """
Manton Reece
\t\t- Austin Sketch Group"""
full_description = "Austin Sketch Group Aug 18, 2003 A new sketch group officially started up yesterday, led by local artist John Rubio. The first meeting was at Opal Divines. We passed around sketchbooks and discussed art, comics, animation, and how the digital world has effected independent artists. Some people brought laptops, some brought prints. Most everyone sketched. Rick gave out copies of his comic book, Budget Strips; Justin had his Flash short films on his PowerBook; Ismael showed some framed prints inspired by doodles; and John and Jasun both had great sketchbooks. About a dozen people showed up, an incredible mix of talented artists. I’ve been trying to get in the habit of keeping a sketchbook and drawing more regularly, so it was a big inspiration. Manton Reece @manton"
author = "Manton Reece"
