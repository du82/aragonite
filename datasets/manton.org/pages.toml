["https://www.manton.org/2004/10/28/ghost-in-the.html"]
title = """
Manton Reece
\t\t- Ghost in the Shell, Shark Tale, and a pumpkin"""
full_description = "Ghost in the Shell, Shark Tale, and a pumpkin Oct 28, 2004 Today is International Animation Day. My membership in ASIFA-Hollywood provides few perks since I live a couple states away from the Los Angeles area. They still send me announcements for LA screenings and lectures, though, as if to taunt me. A few weeks ago I saw Ghost in the Shell 2 and Shark Tale. I was expecting to be really impressed with Ghost in the Shell, but instead was somehow numbed by the visuals and confused by the story. I think it was a good film, but I’m not entirely sure. Certainly some of the scenes were excellent, but overall the story didn’t hold together for me. I had to work too hard to take it all in. I hadn’t planned on seeing Shark Tale until DVD, if then. Everything about this film looked bad, and I fully expected it to bomb. It ended up doing very well at the box office a few weeks in a row, and I found myself laughing at all the right points. I put it in the same category as Shrek; a fun film but not a great or lasting one. Have a happy halloween weekend. Manton Reece @manton"
author = "Manton Reece"
year_published = 2004
