\t\t- Yesterday I finished reading Steven"""
full_description = "Yesterday I finished reading Steven May 3, 2002 Yesterday I finished reading Steven Johnson’s Emergence: The Connected Lives of Ants, Brains, Cities, and Software. It was one of those rare books that leaves you with a dozen different things to think about. It’s a fascinating book, and the topics are woven together beautifully. I get the feeling that Johnson did thorough research, planned out the entire structure of the book, but then wrote many sections straight through without stopping to edit – it flows with a rhythm and pace that makes for an easy read. A related ant story in the news two weeks ago: “A supercolony of ants has been discovered stretching thousands of miles from the Italian Riviera along the coastline to northwest Spain.” Manton Reece @manton"
