\t\t- Respect to Dave"""
full_description = "Respect to Dave May 2, 2005 Dave Winer turned 50 today. I first met Dave over 9 years ago, back when the free release of Frontier ruled web application development and automation on the Mac. I ran the frontier-talk mailing list for a time, was active in that community, and built a bunch of great stuff on top of his work. A lot has changed since then, both on my platform of choice and in the tasks that Dave has tackled. While I haven’t kept in touch with him, I am usually quick to defend his record. If you ever find yourself upset with Dave, take a deep breath and then disagree in a way that shows some respect for what he’s been able to accomplish. Manton Reece @manton"
