["http://www.manton.org/2016/04/libraries-for-30-days-wrap-up.html"]
title = """
Manton Reece
\t\t- Libraries for 30 days wrap-up"""
full_description = "Libraries for 30 days wrap-up Apr 18, 2016 After trying to work from a new coffee shop I had never been to before, every day for 30 days, I loved the routine of getting out of the house so much that I set on another challenge: visiting 30 libraries. This proved to be more difficult, mostly because of the extra driving required, but I wrapped it up yesterday. I’ve put together a web page of all the libraries, with photos and links to the microblog posts for each day. The posts are also tagged with #newlibraries. After wrapping up libraries, I thought I’d make it a trilogy of 30-day endeavors, with a final 30 days of working from city parks. This was a suggestion from Daniel Hedrick, who had worked from parks before, tethering to his iPhone since there’s usually no wi-fi. I loved the idea right away because it fit so well with the goal of getting out of the house and discovering something new in my own city. I even spent a couple hours earlier in the month researching parks and planning out whether I could do it. But now that it has come to it… I am really burned out on commuting. Finding new coffee shops and libraries has been a great experience. There are several wonderful places that I know I will return to again, and I never would have found them otherwise. I just need a little break from the forced routine of driving somewhere new each day. Maybe I’ll pick up the parks idea next year. Manton Reece @manton"
author = "Manton Reece"
year_published = 2016
clearnet = "http://www.manton.org/2016/04/libraries-for-30-days-wrap-up.html"
