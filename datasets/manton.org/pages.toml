["https://www.manton.org/2019/09/21/the-enchanted-world.html"]
title = """
Manton Reece
\t\t- The Enchanted World"""
full_description = "The Enchanted World Sep 21, 2019 I almost forgot to post to my blog for the 6th day of trying games on Apple Arcade. Remember those sliding block puzzles? The Enchanted World is that but set in a wonderful fantasy design where your character moves through the story using magic to set the world right. I was going to stop my micro review there, but after I started playing the game I came across the story of the developer and designer who created it. Apple featured them in this newsroom blog post: For creators and friends Ivan Ramadan and Amar Zubcevic, both 33, the game is much more than that: It’s a metaphor for a child growing up in a time of war. Both Ramadan and Zubcevic grew up in Sarajevo during the conflicts in the Balkans in the 1990s, and both had parents that used creativity to shield them from the violence and danger around them. There’s also a longer feature on CNET about the developers. Manton Reece @manton"
