["https://www.manton.org/2002/03/25/i-saw-revolution.html"]
title = """
Manton Reece
\t\t- I saw Revolution OS at"""
full_description = "I saw Revolution OS at Mar 25, 2002 I saw Revolution OS at the Alamo Drafthouse here in Austin on Saturday. A really great film, and very approachable – it doesn’t matter if you’ve never heard of Richard Stallman or don’t know what a kernel is. Certainly the filmmakers didn’t entirely know the culture before starting the documentary, and I think that’s what makes the film work: It doesn’t take itself too seriously, and it’s not invested in the open source movement’s success or failure. They’re just showing a slice of time in which the landscape of server operating systems was completely changed, and having some fun in the process. Manton Reece @manton"
