["https://www.manton.org/categories/february-challenge"]
title = """
Manton Reece
\t\t- February Challenge"""
full_description = "End of the MetroRail line while they rip up the road around the station at the convention center. → 10:45 PM, Feb 23 Downtown can sometimes seem like a bit of a spectacle: new construction, partiers enjoying Austin, scooters everywhere. But there are still a few quiet, abandoned corners not quite rebuilt, like this place on the way to dinner. → 11:59 PM, Feb 22 Sounds like progress is being made to get the Zilker Zephyr running again. It has been closed for nearly a year. Snapped this photo of the unused tracks last weekend while we were walking on the trail. → 11:52 PM, Feb 21 Thinking of “scale” earlier tonight while I was driving, the sky lit up in color. And then minutes later when I had parked the car it was over. Just caught the very end of the sunset for this shot. → 10:58 PM, Feb 20 Somewhere up there in the sky… space. I was so busy today I almost skipped the photo challenge, but noticed this photo I shot quickly a few nights ago from the Congress Avenue bridge. → 11:59 PM, Feb 19 More coffee for the photo challenge. Cool drink outside Bakery Lorraine while we waited for our Apple Store appointment to see if the dead Apple TV was fixable. Spoiler: it wasn’t. → 4:16 PM, Feb 17 For today’s photo challenge: balance. My glasses balancing on the “nosey” holder at my desk. I got this as a present a few years ago and still use it every day. → 11:03 PM, Feb 15 I usually order an iced coffee, but need a little warmth on a cold morning. Coffee at Red Horn. → 8:50 AM, Feb 14 “Rise up! I will fight for this land, but there’s only one man who can give us a command so we can rise up.” → 9:47 PM, Feb 13 I don’t have any particular attachment to Sticker Mule, and in fact once tried to switch to another sticker company, but they make it really easy to re-order stickers. New batch just arrived for IndieWebCamp Austin! → 11:04 PM, Feb 12 My go-to smoothie lately: one frozen banana, frozen blueberries, a little plain yogurt, peanut butter, sometimes kale, and almond milk. Apparently everything we buy is HEB-branded now. → 2:08 PM, Feb 11"
