["https://www.manton.org/2006/02/22/austin-on-rails.html"]
title = """
Manton Reece
\t\t- Austin on Rails"""
full_description = "Austin on Rails Feb 22, 2006 About 20 people met at the Frog Design building downtown a few months ago for the first Austin Ruby on Rails user group meeting, and by the third meeting that number had doubled. Founders Damon, Robert Rasmussen, and Rob Jones have done a great job getting the group off the ground and lining up interesting topics. Last night was our fourth meeting. Bruce Tate gave a talk on his experience ramping up a Rails team and comparisons to the Java world. As a new experiment on the agenda, afterwards some of us stuck around to hack together a member directory for the web site. I didn’t actively participate in the coding efforts, but I had a good time meeting new people. As usual, it was all followed by drinks at Hickory Street Bar & Grill, where topics of discussion ranged from refactoring to Perl to C++ windowing toolkits to AppleGuide. You know there’s some real substance to Rails when it brings together such a diverse group. Also just announced: the Rails Happy Hour at SXSW. Should be fun. Bruce Tate answers questions after his presentation Manton Reece @manton"
author = "Manton Reece"
year_published = 2006
