["https://www.manton.org/categories/arcade"]
title = """
Manton Reece
\t\t- Arcade"""
full_description = "Wrapping up Apple Arcade trial When Apple Arcade launched, I thought it would be fun to try a new game each day for 30 days. And it was fun! For… 18 days. On Saturday I sat down to play my 19th pick, Oceanhorn 2, and realized that playing a new game each day wasn’t working. Unlike visiting 30 coffee shops, 30 libraries, and 30 parks — where each series of blog posts I explored Austin and got a lot out of it — playing video games has proven to be too big of a time commitment for me right now. I love video games and there are some great games in Apple Arcade, but if I’m on my phone for an hour I need to be using that time for something work-related. It was creating too much extra stress for too little return. Oceanhorn 2 is also a good place to wrap up this experiment because it’s one of my favorites. It’s heavily inspired by Zelda. I’m going to enjoy playing it a little bit more over the next week or so. All the other games I’ve played are collected in this category on my blog. → 9:44 AM, Oct 7 Agent Intercept is a combination of racing game and spy story, with new missions released every day. @andynicolaides has a nice review over at thedent.net, including gameplay video. 🕹️ → 11:05 PM, Oct 4 Playing a new game each day means I just can’t get very far if there’s any depth to the game. Cat Quest II is like that. There’s a lot of polish, nice backgrounds with a watercolor look, and it starts quickly and would be a lot of fun to finish if I had time. 🕹️ → 8:40 PM, Oct 2 The look of Towaga: Among Shadows reminds me just a little of Don Bluth’s Dragon’s Lair. Completely different type of game — really not even close to the same thing — but also clearly hand-drawn with a lot of nice details, almost like a 80s cel animation throwback. I like it. 🕹️ → 8:25 PM, Oct 1 Playing a new Apple Arcade game each day, I barely have time to scratch the surface of most games, so I tried for Way of the Turtle to get much farther into it. Starts simple but there’s nice potential for level design as you unlock the different shells and wall-jump. 🕹️ → 10:46 PM, Sep 30"
author = "Manton Reece"
year_published = 2025
clearnet = "https://www.manton.org/categories/arcade"
