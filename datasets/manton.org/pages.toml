["http://www.manton.org/2016/03/30-days-of-libraries-week-1.html"]
title = """
Manton Reece
\t\t- 30 days of libraries, week 1"""
full_description = "30 days of libraries, week 1 Mar 27, 2016 After wrapping up 30 days of new coffee shops, last week I started visiting a library every day to work. Libraries and coffee shops don’t have that much in common, but they do share a couple basic traits that are necessary for working on a laptop or iPad: wi-fi and tables. In fact, I’ve found that it’s even easier to find an open table or couch in a library than in a busy coffee shop. So far, so good. In the first week, I’ve visited Cedar Park Public Library, Wells Branch Community Library, Little Walnut Creek Branch, North Village Branch, Old Quarry Branch, Howson Branch, Westbank Community Library, and Yarborough Branch. I also heard from readers who wanted to see more than the text microblog posts I did for coffee shops, so I’ve been trying to take more photos. These photos are tagged with #newlibraries too, so they’ll show up together with the library text posts. (Photos can be browsed over the web, but they don’t show up in the default RSS feed. The microblog posts also have their own feed.) As I mention on episode 15 of Timetable, working out of the house in the morning helped provide some structure to the work day. I’d use the morning for writing blog posts and catching up on email, and the afternoon to focus on code. For libraries, I’m going one step further and only bringing the iPad Pro with me. This means that I’m using a small range of apps — Editorial, Mail, Safari, Slack — and reinforces the idea that I’m supposed to be writing. Manton Reece @manton"
