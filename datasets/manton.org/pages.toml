["https://www.manton.org/replies"]
title = """
Manton Reece
\t\t- Replies"""
full_description = "@robertbreen Thanks for your patience and for the very clear example... I've confirmed it's a bug with category changes when there is no other edit to the blog post text. Sorry! I'm fixing it, and I'll also re-publish your blog so it's all current. → 6:40 PM, Mar 1 @bobschulties Yeah, I refreshed my memory on a bunch of this before finishing that blog post and I was surprised how young he was. → 5:49 PM, Mar 1 @Bobfa I try myself to ignore a good portion of the news. Staying informed at a high level without getting overwhelmed. → 10:10 AM, Mar 1 @isaact There's an even easier fix if you add something like this to your custom CSS: .post__thumbnail-wrapper { display: none } → 5:12 PM, Feb 28 @isaact Thanks for letting me know, the new thumbnails we started generating of web pages are being inserted into the theme. That's surprising! But I see in that theme why it's happening... I'm going to submit a pull request to that theme. We could also fork the theme and make a new one with the change. If you want to fix this yourself, you can edit your custom theme and edit the single.html template to remove the if .Params.thumbnail section. → 5:10 PM, Feb 28 @robertbreen Rebuilding shouldn't be necessary for that. Do you mind letting me know next time it happens and I'll see if I can tell why it's happening? → 2:58 PM, Feb 28 @drwalt Thanks. It’s happening to at least a couple other people, but still seems very rare. Hopefully can track down the cause soon. → 2:10 PM, Feb 28 @drwalt Sorry, we’ve been trying to figure this out and we can’t reproduce it. If you edit the post to add back the paragraph breaks, does it stick? Also remind me what operating system and web browser you’re using? → 12:45 PM, Feb 28 @apoorplayer Yeah, it's a real problem because unlike traditional software, with web apps you have to be on the latest version. There's no way to keep using the old version or old terms. I don't know what the solution is other than to change terms very rarely and carefully (and only for the better for users). → 10:25 AM, Feb 28"
