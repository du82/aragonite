Manton Reece
\t\t- At the SXSW keynote the"""
full_description = "At the SXSW keynote the Mar 13, 2002 At the SXSW keynote the other day, Jeff Veen pointed at his slides and said that they’d all be online by the next day. I smiled, thinking to myself there is no way those will be online within a week, if ever. So far that prediction has been correct. But as he was giving his talk, I recognized some of the slides from other Adaptive Path presentations. A Pattern Language, a book mentioned in Veen’s slides, is also on the just updated Joel Spolsky book recommendations. It seems everywhere I look I see this book now. Maybe I should finally read it. Manton Reece @manton"
