full_description = "Finished reading: Locke Lamora and the Bottled Serpent by Scott Lynch. Great to have another Gentleman Bastard story. Split into two parts in Grimdark Magazine. 📚 → 3:21 PM, Feb 26 Also on Bluesky Finished reading: Empire of Exiles by Erin M Evans. This was excellent. Starts like a murder mystery set in a fantasy world, with unique magic. 📚 → 3:48 PM, Feb 23 Also on Bluesky Finished reading: The Lost Bookshop by Evie Woods. Not all of it worked for me but I’ll read almost any book about books. Also some nice historical fiction-y bits weaved in. 📚 → 4:32 PM, Feb 16 Also on Bluesky Finished reading: Wind and Truth by Brandon Sanderson. Not even sure what to say. Still letting the end of the first arc sink in. 📚 → 8:47 PM, Feb 3 Also on Bluesky Found this first edition, signed copy of A Song for Arbonne at Half Price Books the other day and had to get it. Read it so long ago that it’ll be like reading it for the first time. I’m always on the lookout for old Kay books, they seem in short supply. 📚 → 12:09 PM, Dec 29 Also on Bluesky I’m falling well short of my reading goals this year. My currently reading list keeps getting bigger, but I’m not finishing anything. For the rest of 2024, just want to finish Wind and Truth. 📚 → 2:47 PM, Dec 22 Also on Bluesky It kind of snuck up on me… It’s Wind and Truth release day. Looking forward to starting it this weekend. 📚 → 10:09 AM, Dec 6 Also on Bluesky Finished reading: Sourdough by Robin Sloan. Enjoyed this so much. Just the book I needed this week. 📚 → 3:03 PM, Nov 9 Also on Bluesky Finished reading: The Mountain in the Sea by Ray Nayler. This was brilliant. I may need to read it again… Sometimes my mind would wonder, thinking about the future. 📚 → 10:26 AM, Nov 1 Also on Bluesky Finished reading: Boom Town by Sam Anderson. Could not ask for a more perfect book to finish before driving up to Oklahoma City. Great mix of basketball and the history of the city going back to the founding. 📚 → 9:07 PM, Oct 29 Also on Bluesky"
