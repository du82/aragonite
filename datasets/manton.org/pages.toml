["http://www.manton.org/2016/03/whats-next-after-30-days-of-coffee.html"]
title = """
Manton Reece
\t\t- What&#039;s next after 30 days of coffee"""
full_description = "What&#039;s next after 30 days of coffee Mar 19, 2016 Yesterday I wrapped up my endeavor to visit a new coffee shop every day for a month, making sure it was a place that I had never been to before. Every day I published a short microblog post about my visit. As I was nearing the end of the 30 days, I felt a little bummed out that it would be coming to an end. It was a lot of fun and gave my day a good structure. I knew right away that I wanted to fill the next 30 days with something else, but probably not with drink or food again. I had a few ideas, including one outside that will be be better when the weather gets warmer. For this next month, though, I’ve decided to work from libraries. So that’s where I am right now. Day 1 of 30, sitting in a comfy chair typing on my iPad at the Cedar Park Public Library. It’s a nice space and they even have an “internet cafe” outside the main books section. I’ll be trying to follow the same routine as before: morning out of the house for writing, afternoon usually back at my desk for coding. And as before, I’ll blog each day and tag all the blog posts. Here we go! Manton Reece @manton"
