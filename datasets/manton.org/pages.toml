["https://www.manton.org/2025/02/27/nick-heer-is-impressed-with.html"]
title = "Manton Reece"
full_description = "Feb 27, 2025 Nick Heer is impressed with Alexa+, except: But there is no part of me that would ever want Alexa or any other voice-controlled assistant buying tickets to a show, or booking a vacation rental, or even buying groceries. I also don’t trust AI for this. And yet, in 1995 a lot of people didn’t trust entering credit cards on the web. I’m open to the possibility that in 10 years, AI buying things for us will be normal. Also on Bluesky Manton Reece @manton But there is no part of me that would ever want Alexa or any other voice-controlled assistant buying tickets to a show, or booking a vacation rental, or even buying groceries. I also don’t trust AI for this. And yet, in 1995 a lot of people didn’t trust entering credit cards on the web. I’m open to the possibility that in 10 years, AI buying things for us will be normal."
