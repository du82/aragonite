full_description = "Every so often a web Mar 22, 2002 Every so often a web site will add something small that makes all the difference. Today the example of this for me was the Sample Code section of the Apple Developer site. A new popup menu allows quick viewing of source files before downloading the full archive. This change took minimal effort for Apple to implement, but it will save developers from having to download lots of small archives (cluttering up their desktop) just to find the piece of sample code they were looking for. Manton Reece @manton"
