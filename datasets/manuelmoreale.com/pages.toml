["https://manuelmoreale.com/a-ko-fi-psa"]
title = "A Ko-Fi PSA – Manu"
description = "Quick PSA for the very kind people who decided to support what I do over on Ko-Fi. I recently noticed that some memberships were getting stuck with a …"
full_description = "A Ko-Fi PSAQuick PSA for the very kind people who decided to support what I do over on Ko-Fi. I recently noticed that some memberships were getting stuck with a pending label even though they were working fine in the months before. Apparently, that’s caused by a bug—probably on the Ko-Fi side but still can’t say for sure—and if you were a supporter affected by this you probably didn’t even get an email notification from them. So your membership might have expired without you realising it. So if you happen to support creators on Ko-Fi maybe give your dashboard a check to make sure everything is in order. All my supporters are listed on the supporters page so if you see your name there it means everything is in order. It honestly sucks that in 2024 there’s not a good way to support creators with small donations. The “one a month” model is great from a human perspective but financially it’s quite awful: a 1 USD donation, after fees and taxes, becomes more like a 0.60 USD donation but it is what it is. I’m still grateful to the 93 people who are currently supporting what I'm doing here."
