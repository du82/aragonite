["https://manuelmoreale.com/a-comment-on-the-apple-ipad-ad-controversy"]
title = "A comment on the Apple iPad ad controversy – Manu"
description = "I usually don’t write about this kind of stuff, primarily because I find these internet controversies to be quite boring. The probably appropriate …"
full_description = "A comment on the Apple iPad ad controversyI usually don’t write about this kind of stuff, primarily because I find these internet controversies to be quite boring. The probably appropriate response to an Apple ad is “meh, whatever” and that was—and still is—my reaction. The ad is uninspiring but there’s one creative aspect of it that bothers me: I don’t understand the connection between the hydraulic press and the visual images of destroying everything to the alleged capabilities of the iPad. Like, I get what they’re trying to communicate but the visual metaphor they decided to use makes no sense to me. That’s the part I just don’t get. But as they say there's no such thing as bad publicity."
