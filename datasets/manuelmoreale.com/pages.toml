["https://manuelmoreale.com/a-bit-of-this-a-bit-of-that"]
title = "A bit of this, a bit of that – Manu"
description = "It’s November, almost midday and I’m already eating lunch. Weird, I know. It’s the first blog post I have written on my iPad and I have to admit, iA …"
full_description = '''A bit of this, a bit of thatIt’s November, almost midday and I’m already eating lunch. Weird, I know. It’s the first blog post I have written on my iPad and I have to admit, iA Writer on iPad is not bad. This post is not about anything specific and I’ll probably ramble quite a lot. This is just so you know what to expect. Unexpected generosity For the past 8 days I’ve been running an experiment on my thegallery.io that essentially consisted in asking people for money. The site is growing, expenses are growing and since I really dislike advertisements I decided to experiment with the site and see what happens. And the result was quite surprising. Dozens of people have donated and I received a lot of supporting messages along with the donations. And that’s great. We’re talking about a few hundred dollars in total so no one is going to get rich here, but it helps and also helps the mood. Is it sustainable? Obviously not. Still, it was a very nice experiment and I'm happy with the result. I'll keep it going until the end of the month and then the site will go back to its normal state. Maybe I'll do it again next year, we'll see. This is how my experiment looks like I need sunlight Winter has yet to arrive and I'm already tired of these days with pretty much no sunlight. It also doesn't help that I'm in a terribly bad mood and I'm starting to feel a lot of "freelancer fatigue". I need to do something to get my life back on track but I don't know where to start. I guess I'm not the only one though. Anyway, thank you for reading this.'''
