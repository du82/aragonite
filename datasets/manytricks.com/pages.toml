["https://manytricks.com/usher"]
title = "Usher · Many Tricks"
description = "macOS media shoebox with support for video playback, tagging, smart playlists, digital covers, and more."
full_description = "If you're a collector of digital things—be they movies, video clips, photographs, PDFs or whatever else you can think of—Usher will help you get the most out of your collection. Usher makes it easy to organize, browse, and view all of your media files. Watch Usher uses Apple's QuickTime technology, so it can play back any media file that you can watch in QuickTime Player. For media files that aren't directly supported by QuickTime, Usher allows you to choose an external player, such as IINA or VLC. You can watch video in Usher's main window, in a separate window, or in full-screen mode. In the first two modes, you can choose between the QuickTime-style hovering controls, or fixed controls outside the playback area. Identify Once your collection has reached a certain size, watching becomes difficult without some way of identifying individual media files…and this task is one of Usher's strengths. You can use Tags to help categorize movies, much like you use keywords in Photos to organize photos. Beyond Tags, Usher's Properties are multiple-value fields that can, for instance, store the entire cast for a movie in one Property. If your media files have existing metadata, such as Cast or Director, from a tool such as Subler, Usher can read those fields, too. Usher also includes a free-form auto-expanding Notes field, so if you like to keep notes about your media files, you can store a near-limitless amount of text for each one. This text is fully searchable, too, meaning you can use the Notes field in Smart Playlists. Organize For the ultimate in organization, you can sort your media files into folders, and/or use playlists and Smart Playlists to create filtered lists based on Tags, Properties, and other values like last playback date. Playlists and Smart Playlists in Usher work just like they do in Music and Photos, so if you're comfortable there, you'll be right at home in Usher. But the best part is that Smart Playlists can even be automatically subdivided by metadata fields you select, as seen in the Recently Added playlist in the screenshot."
