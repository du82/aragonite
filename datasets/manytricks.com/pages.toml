["https://manytricks.com/resolutionator"]
title = "Resolutionator · Many Tricks"
description = "Switch display resolutions from the menu bar of with a simple keystroke."
full_description = "“This is the best app ever. Everybody should buy at least 10 licenses!”—Peter M. and Rob G., unbiased users Resolutionator makes it simple to use any of your display's available resolutions. Need more space for a project? A quick click of a menu bar icon—or press of a keyboard shortcut—lets you easily switch to any available resolution. No more time-consuming trips through System Preferences. Designed with retina displays in mind, Resolutionator may also bring additional capabilities to your non-retina display, but we can't guarantee that. So we suggest everyone try the demo before purchasing, to make sure Resolutionator works well with your display(s). If you're a menu bar utility person, Resolutionator's pre-set for your preferences: It ships in menu bar mode, giving you quick mouse fling-and-click access to all your resolutions. If you've got multiple displays, you can access all of them through the same menu, as seen in the screenshot. Contrast that with the Displays System Preferences panel method, which requires mousing to each display to change its resolution. Depending on your Mac's display(s), you may see tons of options in Resolutionator's menu, making it tricky to find the one you want. Hold down the Option key, though, and you can pin resolutions so that they always show at the top of the list: If you prefer the keyboard, assign a hot key of your choosing and switch resolutions via this handy pop-up panel: It may appear you can only switch resolutions on one display, but fear not! Tap the left arrow to reveal all attached displays; you can then change the resolution on any of them from that same panel. Depending on your display, macOS may offer three to five resolution choices; these are the choices you'll see by default in Resolutionator. If that's not enough for you, though, Resolutionator can show all the resolutions your display reports it's capable of producing, as seen in the movie at right. Just tell Resolutionator to show non-retina and/or silly resolutions in its preferences, and you'll see—depending on your display's capabilities—many more available resolutions."
