title = "Butler · Many Tricks"
description = "Butler is a do-it-all utility for macOS. Launcher, macros, pop-up folders, multiple clipboards, music controller, and more. It's the original many-tricks pony."
full_description = "Butler's purpose is to ease all those routine tasks you do every day: controlling iTunes, opening programs and documents, switching users, searching for stuff on the web, and more. Butler 4.4.8 requires macOS 10.13 High Sierra or newer. Visit the museum if you are running an older macOS version. Butler includes a 60-day money-back guarantee. If you're not satisfied with your purchase, simply email us for a refund. Butler's purpose is to ease all those routine tasks you do every day: controlling iTunes, opening programs and documents, switching users, searching for stuff on the web, and more. Butler lets you arrange your tasks in its fully customizable configuration. There, you can assign one or more triggers to a given task: Due to its unique variety of triggers and tasks, Butler is more flexible than any other productivity tool you've seen before. That's why we call it the original many tricks pony. So don't worry if you don't have a use for all of its features right from the beginning. Just start using Butler and discover a new feature every day. And if you want to, you can look at some screenshots first. Great software should do its job efficiently, have a clear interface, and be enjoyable to use. We try our best to meet these objectives with our apps. More about us…"
