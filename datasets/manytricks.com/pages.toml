["https://manytricks.com/osticket/kb"]
title = "Many Tricks · Support"
description = "customer support platform"
full_description = "Featured Questions How can I find/update the latest version of my Many Tricks' apps? How do I copy my licenses to another computer? What are the terms of your software license? How can I get Moom's pop-up palette to appear? Why isn't my upgrade license working on a new Mac? Did you lose your license? Use license lookup to retrieve previously purchased licenses. Or do you need help with something else? We use a combination of in-app help, Frequently Asked Questions (FAQ), and individual tickets to help answer your questions about and solve your problems with our apps. As a first step, please check the Help menu in the app—we provide extensive help in every one of our apps, and often, you'll find the answer to your question in the help. If help isn't helpful, try searching the FAQ: Search Alternatively, you can browse by category: All Apps (20) Butler (8) Desktop Curtain (1) Keymou (2) Leech (5) Menuwhere (5) Moom (32) Name Mangler (10) Resolutionator (1) Time Sink (7) Usher (9) Witch (27) If none of the above answers your question, you can open a ticket or send an email to support@manygoodthings.com.orgtricks.com for personalized help. Every support request is assigned a unique ticket number which you can use to track the progress and responses online. To make status updates work, a valid email address is required when you submit a ticket. We will never share, sell, or otherwise distribute your data. Open a New Ticket Check Ticket Status Featured Questions How can I find/update the latest version of my Many Tricks' apps? How do I copy my licenses to another computer? What are the terms of your software license? How can I get Moom's pop-up palette to appear? Why isn't my upgrade license working on a new Mac?"
