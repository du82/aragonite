["https://manytricks.com/timesink"]
title = "Time Sink · Many Tricks"
description = "Automatically track time spent in macOS apps and windows. Create pools of related windows, view and export reports. Track where your time really goes."
full_description = "Have you ever wondered exactly where all your time goes while you're sitting there at your Mac? You sit down to work at 8am, and suddenly it's lunchtime…where did the time go? Wonder no longer: Time Sink tracks your activity, and reveals exactly what you've been working on—or not working on—throughout the day. Time Sink tracks the time you spend in macOS apps—and their associated windows—as you use your Mac. It does this automatically, so you can work without thinking about time tracking. To help you track related activities, Time Sink uses Pools, which are simply collections of related windows. Creating a Pool is as simple as dragging and dropping a window (or app) from the Apps section styleof the Time Sink window to the Pools section. Just start an ad hoc timer to track that time. When finished, Time Sink will add the timer's name and duration to the chosen pool. Time Sink can also automatically create ad hoc timers based on when you become idle and start working again. If you've ever been curious about where your time goes while using your Mac, Time Sink is an easy-to-use yet powerful tool to help you answer that question. Give it a test drive yourself now and see where you're spending your time. Time Sink 2.2.3 requires macOS 10.9 Mavericks or newer. You can try it for free. The release notes are an interesting read. And for the nostalgically inclined, you can still download older versions of Time Sink. Great software should do its job efficiently, have a clear interface, and be enjoyable to use. We try our best to meet these objectives with our apps. More about us…"
author = "Many Tricks"
