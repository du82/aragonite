["https://manytricks.com/privacy"]
title = "Many Tricks · Privacy: Cookies and Data"
full_description = "To make this site work properly, we sometimes place small data files called cookies on your computer or device—most any website does this in today's environment. A cookie is a small text file that a website saves on your computer or mobile device when you visit the site. It enables the website to remember your actions and preferences (such as login, language, font size and other display preferences) over a period of time, so you don’t have to keep re-entering them whenever you come back to the site or browse from one page to another. We use a third-party service to track and report on which services create cookies on the Many Tricks site. You can see a full list of those services, and why they use cookies, by viewing our Cookie Detail page. Our site's cookies are not strictly necessary for our site to work, but they will provide you with a better browsing experience. You can delete or block these cookies, but if you do that, some features of this site may not work as intended. You can control and/or delete cookies as you wish — for details, see aboutcookies.org. You can delete all cookies that are already on your computer, and you can set most browsers to prevent them from being placed. If you do this, however, you may have to manually adjust some preferences every time you visit our site, and some services and functionalities may not work. As a general statement, we do not directly collect much personal information on either our web site visitors or our customers. Here is a complete list of what may be collected and under what situations: The data for our blog and ticket systems resides on our server; FastSpring's data is not on our server. We do not sell, transfer, or give away any of the data we directly hold, and FastSpring's privacy page covers their data usage rules. We may occasionally contact customers via email in the event of an issue with one of our apps, but this would be done directly by us, not by transferring an email list to a third party. Great software should do its job efficiently, have a clear interface, and be enjoyable to use. We try our best to meet these objectives with our apps. More about us…"
