title = "Keymou · Many Tricks"
description = "Control your mouse via your keyboard."
full_description = "Sometimes using the keyboard is just more convenient than a mouse or trackpad: Keymou gives you full control over your mouse pointer via keyboard shortcuts. Keymou 1.2.11 requires macOS 10.13 or newer. Please see the museum if you are running an older macOS version. Keymou will work for 1000 uses in demo mode. After that, you will have to purchase a license in order to continue using Keymou. Keymou includes a 60-day money-back guarantee. If you're not satisfied with your purchase, simply email us for a refund. Sometimes using the keyboard is just more convenient than a mouse or trackpad: Keymou gives you full control over your mouse pointer via keyboard shortcuts. Move: Move in the specified direction, with a user-configurable step size, acceleration, and optionally confine movement to the current display. Move by Division: Easily move around the screen and yet quickly zero in on your target by subdividing your screen with each move. For a brief demonstration, watch this movie. In addition to these listed actions, you can also center the mouse, scroll, and send all the clicks—click, double-click, and right-click. Find the mouse by highlighting it: Use one of three eye-catching images to highlight the mouse whenever it moves, only when it's moved by Keymou, or temporarily after a period of inactivity. Great software should do its job efficiently, have a clear interface, and be enjoyable to use. We try our best to meet these objectives with our apps. More about us…"
