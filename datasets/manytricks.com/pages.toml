["https://manytricks.com/moom"]
title = "Moom · Many Tricks"
description = "Move, zoom, and snap windows. Arrange windows in layouts. Auto-adjust to display setups."
full_description = '''With its wide variety of window management tools, Moom makes moving and resizing windows fast, easy, and if you're as geeky as we are, even fun. Scroll down to learn more and see all the main features in action. Hover the mouse over any window's green—or red or yellow, your choice!—button, and Moom's pop-up palette appears. Sure, this pop-up has been there for years, but now it's fully customizable. Need more icons? Add up to 61 separate actions to the pop-up, including Folders and Layouts…and even Grids. If you work with a standard set of apps and windows—and especially if you do so on a laptop that occasionally connects to an external display—Moom's saved layouts make it super simple to restore order to a chaos-filled desktop. Lay out your windows as you want them, then save a layout. Activate the layout at any time to restore order to chaos. The new "any window" saved layouts are just that: Layouts that affect the N most recently used windows, where N is the number of windows in the saved layout. These saved layouts are completely independent of apps—they don't associate a set of apps with the saved windows. Save a layout with five open windows, and your five most recently used windows will be moved into that layout's locations when you activate the layout. An extensive custom actions list helps you manage your windows quickly and efficiently…and perhaps even funnly? You can even chain actions together (see below) for some true window management power. And if you have so many custom actions that your collection is a mess, folders and menu separators can clean it right up. Start by customizing each snap region to do what you want—including adding Folder and Layout custom actions, which mean a single drop zone can support more than one action. What's a Drop Zone? It's a window's location in a saved layout, and you can now use any saved layout as the source of drop zone targets. Put a saved layout into one of Moom's window snapping zones, and its window positions become available as drop targets: Drag the window to the snap zone, then drop the window into one of the outlined locations that appear.'''
