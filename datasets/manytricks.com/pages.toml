["https://manytricks.com/blog"]
title = "Tales of a Running Bird"
full_description = "Name Mangler 3.9.3 released February 16th, 2025 by Rob Griffiths Name Mangler 3.9.3 (release notes) is out, and it fixes a crashing issue related to QuickLook for users of macOS 11 and earlier. (Thanks, Nicole G. for telling us about this one!) If you’re a user of an older macOS release and you can’t launch Name Mangler to check for updates, just download a new copy of the app from the Name Mangler page (you won’t lose your settings). App Store users should see the update in the App Store app, if not now then shortly. Posted in Name Mangler, Products | No Comments » Key Codes, Keymou, and Leech updated February 14th, 2025 by Rob Griffiths The final updates of the week are to Key Codes 2.2.2 (release notes), Keymou 1.2.11 (release notes), and Leech 3.2.11 (release notes), all of which are available now (or should be soon for App Store users, if not yet). All three feature our new in-app help, and various minor updates to keep pace with changes in macOS. As usual, direct customers can get the newest versions by checking for updates from within the app, or by downloading a fresh copy of the app from its web page (you won’t lose your settings). App Store users should see an update available in the App Store app. Posted in Key Codes, Keymou, Leech, Products | No Comments » Name Mangler 3.9.2 released February 13th, 2025 by Rob Griffiths Name Mangler 3.9.2 is out (release notes), with some updates and fixes that may be of interest to photographers, along with our all-new in-app help (now available online, too). On the photography front, we added a new metadata field, Exposure Time Denominator, which is just what it says it is. We also added the missing Lens metadata item, and fixed overly-aggressive rounding when adding various photo-related metadata like Exposure Time. App Store customers should see the update either now or shortly in the App Store app, and direct customers can check for updates within Name Mangler, or download a fresh copy of the app from our site (you won’t lose your settings). Posted in Name Mangler, Products | No Comments » Desktop Curtain and Time Sink updated February 12th, 2025 by Rob Griffiths Today we released Desktop Curtain 3.2 (release notes) and Time Sink 2.2.4 (release notes), which are minor updates to two of our longstanding apps. You can check out the release notes pages for all the details on each app—the changes are mostly of a housekeeping nature to keep up with changes in macOS, but here are a couple highlights: Desktop Curtain gains a new Cover Widgets curtain level, to cover desktop widgets. We fixed a couple pesky bugs in Time Sink, one of which prevented captured screenshots from stopping at the limit you’d set. Both apps feature our new in-app help system, which is totally reorganized for easier reference to the various sections of help…and is also available online: See Desktop Curtain help and Time Sink help. App Store users should see the updates shortly, if not already, in the App Store app. Direct customers can check for updates within the apps, or just download fresh copies (you won’t lose your settings) from each app’s web page. These are just the first two of what will be updates to all our apps, as we roll out various fixes, features, and the new help system in each one. Stay tuned! Posted in Desktop Curtain, Products, Time Sink | No Comments » Usher 2.3 is out December 17th, 2024 by Rob Griffiths Usher 2.3 is out, and it’s basically a maintenance update with a whole slew of minor fixes and changes. A couple of the highlights include the ability to locate missing satellites, the addition of width, height, and resolution as columns (and sorting criteria), and a couple fixes for minor macOS Sequoia glitches. As usual, you can update within the app, or by downloading a fresh copy of the app from Usher’s page (you won’t lose your settings). Posted in Keymou, Menuwhere, Products, Usher | No Comments » An update on some recent Chrome issues in Witch November 13th, 2024 by Rob Griffiths Recently, we’ve been made aware of two issues in Chrome (and probably Chromium and any other Chrome-based browser). The following are both issues in Chrome version 131.0.6778.70, and possibly some slightly earlier releases: Witch can only list Chrome’s tabs if they’re in the foreground; once you switch Chrome to the background, you’ll only see one tab. We can’t work around this one, unfortunately. We’ve reported the bug, so hopefully it will garner some attention and get fixed soon. If not, though, we’re stuck, as we can’t see a good way around the problem within Witch’s code. If you use named windows (Window > Name Window…), those custom names no longer show in Witch. Instead, you get the window title, as you do for unnamed windows. This is a very recent regression, and the good news is that it’s already been fixed in Chromium, so that fix should be making its way to Chrome soonish. (If it doesn’t, we have a workaround ready to go, but we’d rather not use it if we don’t have to.) When/if these issues are resolved in Chrome, we’ll update this post. But for now, if you’re a Chrome-using Witch user, you’ll run into both of these issues. Tags: Chrome, Witch Posted in Products, Witch | 1 Comment » Download new license files for your Many Tricks apps November 6th, 2024 by Rob Griffiths We have always provided new license file download links to customers who have lost their license files. However, due to limitations with our cart provider’s interface, there was no way for a user to ask for a new download link on their own—we had to process every request. And if you live a time zone much different than ours, that meant waiting. And waiting. And waiting. And nobody likes waiting, especially not when the app you want to use isn’t in a licensed state. So we’re happy to announce that you can now request your own new license file download links. Bookmark this page for future use: License Lookup Enter the email address used for purchasing to receive new links for each app you’ve purchased, or if you have the order number (starts with “MAN” followed by a series of numbers), you can enter that to receive just that one purchase’s license file download links. You also have to complete a hopefully-very-simple captcha before submitting your request. This feature has been oft-requested, but it took us a while to create a solution because our cart provider has no way to do this programmatically. So behind the scenes, your request is being processed right here on my desk, by a five-year-old laptop that watches for inbound email and then runs a macro to replicate the manual tasks needed to send out license file download links. Yes, it’s a bit Rube Goldbergian, but it works quite well, and I love the fact that a Mac is involved in processing requests for Mac software license files! If you have any troubles with the new tool, please let us know. Posted in Behind the Scenes, Company News | No Comments » Moom 4.1.3 released November 5th, 2024 by Rob Griffiths Moom 4.1.3 is out, with a number of minor fixes and a more-informative “Layout doesn’t apply” dialog. Full details, as always, can be found in the release notes. Moom should inform you of the update, unless you disabled update checking. If you did that, select Moom > Check for Updates from the menu. You can also install a fresh copy of the app from our site (you won’t lose your settings), but the update method is definitely simpler. Posted in Moom, Products | No Comments » Moom 4.1.1 (and 4.1.2) released September 16th, 2024 by Rob Griffiths Although only a minor bump in version number, Moom 4.1.1 contains a good number of improvements, including the biggie: Moom 4 is aware of macOS Sequoia’s snap-related features, and automatically disables them when the corresponding Moom features are active. You can also now drop windows on partially obscured target areas in drop zones, and we improved things in a number of other areas—check out the release notes for all the details. Moom 4.1.1 can be downloaded from our site (you won’t lose your settings), or you can update within the app itself via the update checker in the gear icon menu in Moom’s Settings window. Note: We released 4.1.2 to fix a regression in “Move to Other Display” that affected some users. Posted in Moom, Products | 8 Comments » Access Moom’s custom actions via pop-up menus August 29th, 2024 by Rob Griffiths If you’re a keyboard-oriented Mac user, Moom 4 speaks your language. Every custom action can have its own keyboard shortcut, for starters. And, of course, there’s Keyboard mode, with even more keyboard-centric powers. Keyboard access to all custom actions One of the new keyboard-focused features in Moom 4 is hiding at the bottom of the Keyboard section of Moom’s Settings window: The “Access custom actions via hot key” keyboard shortcut box. This feature isn’t enabled by default (and it’s independent of Moom’s Keyboard mode), but in the above screenshot, it has been assigned a Shift-Control-Option-M shortcut. Read the rest of this entry » Posted in How To, Moom, Products | Comments Off on Access Moom’s custom actions via pop-up menus « Older Entries"
