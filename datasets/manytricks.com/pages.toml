["https://manytricks.com/namemangler"]
title = "Name Mangler · Many Tricks"
description = "macOS batch file renaming utility. Rename thousands of files at once. Preview new filenames. See pop-up previews with content. Save droplets for reuse."
full_description = "Name Mangler is designed to make it super easy to rename batches of files—anywhere from a few to tens of thousands—in one quick operation. Tell Name Mangler which files to rename, set up your rules, then click one button and it's done. Name Mangler makes most renaming tasks as easy as choosing your desired action from a pop-up menu, then configuring a few options for the chosen action. For example, the Change Case action offers the ability to change filenames to lowercase, to uppercase, or to title case. Configure the chosen action, check the preview of the files' new names, click the Rename button, and that's all there is to it. Name Mangler is really fast. Watch the progress bar at right to see just how fast—that's 15,000 files being renamed in under three seconds. That speed is sustained, too, as seen in the graph at right. Whether you're renaming 25 files or 25,000 files, Name Mangler will get the job done incredibly quickly. Tested on a 2021 MacBook Pro with an M1 Pro CPU. Renaming speed will vary with Mac model, drive speed, etc. Need to massage your files in more than one way? No need to run Name Mangler multiple times on the same files. Just add another step—or ten—to your action, and Name Mangler will do everything for you, all in one pass. Steps can be rearranged, added, or deleted at any time, and Name Mangler will instantly reflect the changes you make. Need access to your files' metadata? No problem; Name Mangler contains over 150 metadata fields available for use in your renaming actions. Certain numeric and date metadata values can even be formatted to your specifications. All of this is available through the normal renaming interface, via an intuitive and blindingly-fast metadata browser. Just start typing, and the browser will quickly isolate matching fields. Name Mangler's elephant-like memory means you can easily access any previously-used renaming action, and reuse it with a couple of mouse clicks. By default, Name Mangler remembers your last 50 renaming actions, but you can increase or decrease this value (or set it to unlimited or off) in the preferences."
author = "Many Tricks"
year_published = 2025
