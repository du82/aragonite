["https://mapeditor.org/2010/06/30/tiled-qt-050-released.html"]
title = "Tiled Qt 0.5.0 released | Tiled"
description = "At long last I managed to finish another release, with the main aim to add the last glaring missing features compared to the old Java version. This included mostly tileset management, and support for input/output plugins. There have also been some new contributors. Andrew G. Crowell made the layer actions accessible via a right-click menu and in a small toolbar. Michael Woerister enhanced the object properties dialog with additional fields to change the position and size. Finally, Janis Kirsteins added a Latvian translation. Thanks! Also thanks to all the existing translators who have updated their translation to the new release! The full list of changes: Added support for import and export plugins Added support for external tilesets Added undo for adding tilesets and ability to remove tilesets Added error handling to the New Tileset dialog Added ability to change tileset order by dragging them around Added option to draw the tile grid when saving as image Added a context menu and tool buttons to the layer dock Added Latvian translation Added an install target to the Makefile Open local files when they are dropped onto Tiled Allow changing position and size of objects in the Object Properties dialog Fixed rendering issues with tiles wider than the tile width of the map Fixed eraser and fill tool working on invisible layers Fixed a crash when using some tools when no map is loaded Fixed compile errors related to detecting static builds Fixed the Save dialog not suggesting any particular file extension Updated Japanese, Dutch, German, Brazilian Portuguese, French, Portuguese and Spanish translations As needed to allow plugins, part of Tiled is now in a small shared library. In the future I intend to also move the map reader and renderer into this library so that it can be re-used by games implemented using Qt. I'm also adding a Java version of this library."
full_description = "At long last I managed to finish another release, with the main aim to add the last glaring missing features compared to the old Java version. This included mostly tileset management, and support for input/output plugins. There have also been some new contributors. Andrew G. Crowell made the layer actions accessible via a right-click menu and in a small toolbar. Michael Woerister enhanced the object properties dialog with additional fields to change the position and size. Finally, Janis Kirsteins added a Latvian translation. Thanks! Also thanks to all the existing translators who have updated their translation to the new release! The full list of changes: Added support for import and export plugins Added support for external tilesets Added undo for adding tilesets and ability to remove tilesets Added error handling to the New Tileset dialog Added ability to change tileset order by dragging them around Added option to draw the tile grid when saving as image Added a context menu and tool buttons to the layer dock Added Latvian translation Added an install target to the Makefile Open local files when they are dropped onto Tiled Allow changing position and size of objects in the Object Properties dialog Fixed rendering issues with tiles wider than the tile width of the map Fixed eraser and fill tool working on invisible layers Fixed a crash when using some tools when no map is loaded Fixed compile errors related to detecting static builds Fixed the Save dialog not suggesting any particular file extension Updated Japanese, Dutch, German, Brazilian Portuguese, French, Portuguese and Spanish translations As needed to allow plugins, part of Tiled is now in a small shared library. In the future I intend to also move the map reader and renderer into this library so that it can be re-used by games implemented using Qt. I'm also adding a Java version of this library."
