full_description = 'The tiled module is the main entry point and provides properties, functions and signals which are documented below. Currently selected asset, or null if no file is open. Can be assigned any open asset in order to change the active asset, or a newly created asset to open it in the editor. Note that normally it is not necessary to use this path, since the "ext:" prefix can be used to refer to files shipping with extensions. Also, there is a __filename property containing the full file path of the currently evaluated file. Also note that a Tiled project can have its own additional extensions directory, to make it easier to share extensions with a team or keep them under version control. List of supported map format names. Use mapFormat to get the corresponding format object to read and write files. List of supported tileset format names. Use tilesetFormat to get the corresponding format object to read and write files. Closes the given asset without checking for unsaved changes (to confirm the loss of any unsaved changes, set activeAsset and trigger the "Close" action instead). Creates a color with the RGB value r, g, b, and the alpha-channel (transparency) value of a (which defaults to 1.0). When no compression method is given, defaults to Zlib compression. The compression level defaults to the default for the respective method. Outputs the given text in the Console window as error message and creates an issue in the Issues window. Executes the first custom command with the given name, as if it was triggered manually. Works also with commands that are not currently enabled. Extends the menu with the given ID. Supports both a list of items or a single item. Available menu IDs can be obtained using the tiled.menus property. If a menu item does not include a before property, the value is inherited from the previous item. When this property is not set at all, the items are appended to the end of the menu. Example that adds a custom action to the "Edit" menu, before the "Select All" action and separated by a separator:'
