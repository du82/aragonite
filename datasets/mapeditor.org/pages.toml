["https://mapeditor.org/docs/scripting"]
title = "Tiled Scripting API"
description = "Documentation for Tiled Scripting API"
full_description = 'Scripts can be used to implement custom map formats, custom actions, and new tools. Scripts can also automate actions based on signals. TypeScript type definitions for this API are available by installing the @mapeditor/tiled-api package, which allows you to write scripts using TypeScript and can provide auto-completion in your editor (also when using plain JavaScript). Used in FileEdit and in tiled.promptOpenFile and related methods. The filter is given in a format like "Images (*.png *.xpm *.jpg)". A polygon is not strictly a custom type. It is an array of objects that each have an x and y property, representing the points of the polygon. To modify the polygon of a MapObject, change or set up the polygon array and then assign it to MapObject.polygon.'
