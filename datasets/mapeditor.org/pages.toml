["https://mapeditor.org/2013/07/29/mac-os-x-daily-builds-thanks-to-new.html"]
title = "Mac OS X daily builds thanks to new sponsor | Tiled"
description = "Tiled daily builds have been available since a while for Windows, Ubuntu, Fedora and several other GNU/Linux distributions. Now there are daily builds available for Mac OS X as well! These builds have been made possible by Steffen Itterheim from Kobold Kit, who sent me his Mac mini with a fresh install of Mac OS X 10.8. In addition he also offered to host the builds on his server. A huge thanks to Steffen for this amazing contribution! Having access to a Mac of course has some other advantages as well. New releases will now always be available for OS X immediately, while before it would usually take a few days. Also, I should now be able to reproduce (and hopefully fix) issues that only happen on OS X. If you're a Mac OS X user who enjoys making maps with Tiled, be sure to check out Steffen's Kobold Touch and Kobold Kit game engines. They integrate very well with Tiled and add new features based on custom properties like parallax scrolling and physics, and should be a quick way to get a headstart on your game."
full_description = "Tiled daily builds have been available since a while for Windows, Ubuntu, Fedora and several other GNU/Linux distributions. Now there are daily builds available for Mac OS X as well! These builds have been made possible by Steffen Itterheim from Kobold Kit, who sent me his Mac mini with a fresh install of Mac OS X 10.8. In addition he also offered to host the builds on his server. A huge thanks to Steffen for this amazing contribution! Having access to a Mac of course has some other advantages as well. New releases will now always be available for OS X immediately, while before it would usually take a few days. Also, I should now be able to reproduce (and hopefully fix) issues that only happen on OS X. If you're a Mac OS X user who enjoys making maps with Tiled, be sure to check out Steffen's Kobold Touch and Kobold Kit game engines. They integrate very well with Tiled and add new features based on custom properties like parallax scrolling and physics, and should be a quick way to get a headstart on your game."
