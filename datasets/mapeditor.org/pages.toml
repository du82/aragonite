["https://mapeditor.org/2011/07/23/tiled-qt-070-released.html"]
title = "Tiled Qt 0.7.0 released | Tiled"
description = "Tiled currently seems to be on a biannual release schedule regarding its new feature releases, though this is entirely unintentional. The important part is that quite some nice features have been developed again! It's now finally possible to select multiple objects and copy/paste them. A bunch of other productivity enhancements were also made like cropping to selection, shortcuts to change layer, improved hand scrolling with spacebar, toggling visibility of other layers, etc. A new feature was added that required changing the map format a little as well. Tiled is now able to flip tiles horizontally and vertically (using the 'x' and 'y' keys repectively). This information is stored in the highest two bits of the global tile IDs, so that tile layer data remains compatible if you don't use this feature. The full list of changes: Added support for horizontal and vertical flipping of tiles (sponsored by Zipline Games) Added copy/paste support for objects Added merge layer down action Added Show or Hide all Other Layers action (by Christophe Conceicao) Added actions to select the previous/next layer Added Crop to Selection action Added a Lua export plugin (sponsored by Zipline Games) Added Droidcraft plugin to read and export the map files (by seeseekey) Added option to turn off grid in the tileset view (by Gregory Nickonov) Added hand scrolling while holding the spacebar Made the object context menu available in all object tools Display tile coordinates also when using object tools Various improvements to running external commands (by Jeff Bland) Automapping stability and memory consumption improvements (by Stefan Beller) Objects that fall outside of the map on resize are now removed (by Stefan Beller) Fixed problems with watching tilesets multiple times Fixed several issues related to restoring previously opened files (by Stefan Beller) Updated Brazilian Portuguese, Chinese, German, Spanish, Japanese, Hebrew, Portuguese, Dutch and French translations (thanks to all translators!) Lastly I want to say, Tiled is shaped by your feedback and those who help improve it. If you have an itch or a suggestion, please do report an issue. Or better yet, fork Tiled on github and work with us on the next release!"
