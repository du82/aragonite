["https://www.mapeditor.org/docs/scripting/classes/World.html"]
title = "World | Tiled Scripting API"
description = "Documentation for Tiled Scripting API"
full_description = "A world defined in a .world file, which is a JSON file that tells Tiled which maps are part of the world and at what location. The maps that are explicitly added to this world. It does not include those maps which match due to patterns defined on the world. The patterns that are configured for this map. These patterns will be used to automatically match maps in your project. Add a map to this world by its file name. The position and size is specified in pixels by the given rect. Add the given map to this world. The position is given in pixels. The map size will be set automatically. Returns all maps that are part of this world, either directly referenced or matched by one of the patterns. Creates a single undo command that wraps all changes applied to this asset by the given callback. Recommended to avoid spamming the undo stack with small steps that the user does not care about. Returns any maps that intersect with the given rect. This is a filtered version of the results from allMaps. Modifications to the properties will not affect the original object. Does not include inherited values (see resolvedProperties). Returns the value of the custom property with the given name, or undefined if no such property is set on the object. Does not include inherited values (see resolvedProperty). object properties are returned as MapObject when possible, or ObjectRef when the object could not be found. Returns all custom properties set on this object. Modifications to the properties will not affect the original object. Includes values inherited from object types, templates and tiles where applicable. Returns the value of the custom property with the given name, or undefined if no such property is set. Includes values inherited from object types, templates and tiles where applicable. Errors are reported by the UI. When an editor is open for this asset, this editor is activated when an error is reported. Only supported with the editor running, not when running scripts on the CLI. Also, the asset should already have an associated file."
