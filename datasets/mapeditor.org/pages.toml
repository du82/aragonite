["https://mapeditor.org/2013/07/27/tiled-qt-091-released.html"]
title = "Tiled Qt 0.9.1 released | Tiled"
description = "This is mostly a bug fixing release, adding only some minor things here and there. Notable changes include making sure the JSON format stores everything, fixing string quoting issues in the Lua export and allowing double-click on objects to open their properties dialog. And for those who like to have a lot of maps open at the same time, Tiled should now close a lot faster. Here's the full list of changes: Added saving of map background to JSON format (by Petr Viktorin) Added saving of terrain information to JSON format (by Petr Viktorin) Object Selection tool now always start selecting objects when holding Shift Increased maximum for tileset margin and spacing to 9999 Some updates to libtiled-java (by Oskar Wiksten) Install the automappingconverter application (relevant on Linux) Avoid using Windows 95 style (was used on some Linux desktop environments) Removed layer name checks from the Flare export plugin (by Stefan Beller) Double-clicking an object now opens the Object Properties dialog Fixed Object Properties dialog not remembering its size Fixed object drawing order for image saving and mini-map Fixed some plurals in English translation Fixed line widths when zooming in Qt 5 Fixed updating of image layer when its opacity or image is changed Fixed display of grid in tileset view on certain zoom levels Fixed save in wrong format after opening a map with plugin (by Mike Hendricks) Fixed closing Tiled being very slow with many maps Fixed saving of image layer properties in the Lua format Fixed escaping of special characters in the Lua format Fixed handling of relative paths for image layers in the JSON plugin Meanwhile, a lot of new features have already been added for the next feature release of Tiled. I have described some of them in the first Tiled development update and I plan to blog about some other new stuff soon. Don't be afraid to try a daily build! Apart from being able to try the new features, it is also your chance of providing feedback before they enter a stable release."
