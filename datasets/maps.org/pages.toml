title = "Advancing Research – Multidisciplinary Association for Psychedelic Studies – MAPS"
full_description = "Advancing Research MAPS spent decades developing MDMA-assisted therapy as a means to Set the Setting for the clinical utilization of psychedelic-assisted therapies. With the road paved for the next generation of research and drug development, MAPS now stewards the research landscape we helped cultivate.We are dedicated to fostering new research directions that Prioritize Public Benefit, supporting international researchers and pilot programs, and ensuring the accessibility and culturally appropriate integration of psychedelics as a tool for individual and community wellness. We practice Open Science, Open Books, and center research that contributes to knowledge in the public domain. Click the button below to learn more about current MAPS research initiatives. Tenets of Research Stewardship We fill gaps in the ecosystem to Prioritize Public Benefit, rather than profitWe accelerate new research to inform public knowledge and sensible policy reformWe maximize access domestically and globally to work toward Healing for All We Accelerate Psychedelic Research FundingMAPS is proud to fund and support researchers worldwide to advance our collective understanding of the potential applications and risks associated with psychedelics. We award grants and provide fiscal sponsorship to independent research projects aligned with MAPS’ mission. Details about future RFPs for grant funding will be released in 2025. Click here to learn more about our Fiscal Sponsorship program. IncubatingMAPS initiates projects that open new research directions or set regulatory precedents. We strive to lay the groundwork for new or challenging research fields by fostering studies that expand our collective knowledge of the possible uses and delivery of psychedelics. EducatingMAPS provides international therapist education programs to equip care providers with the fundamentals and best practices of psychedelic-assisted therapies to increase awareness and activate potential research initiatives across the globe.Click here for more information on our International Therapist Education Program. ConsultingMAPS is building the capacity to expand our regulatory, protocol, and diversity consultation services to select independently funded researchers and MAPS grantees. Browse by substance MDMA MDMA-assisted therapy can help heal psychological disorders and trauma. Learn about our studies and find resources like our Investigator’s Brochure and treatment manual. LEARN MORE Cannabis Cannabis treatment shows progress for symptoms of PTSD in war veterans. LEARN MORE LSD A pilot study of LSD-assisted therapy demonstrated a reduction in anxiety among people with a life-threatening illness. LEARN MORE Ibogaine New Zealand and Mexico studies show ibogaine can help opioid and alcohol addiction. LEARN MORE Ayahuasca Our study suggested ayahuasca-assisted therapy may be useful for treating drug addiction. LEARN MORE See moreSee lessLatest News See what’s happening in today’s psychedelic science news. MAPS Successfully Clears Path for Cannabis Research through FDA Formal DisputeNovember 20, 2024FOR IMMEDIATE RELEASE: November 20, 2024 The U.S. Food and Drug Administration (FDA) Division of Psychiatry Products has cleared the Multidisciplinary Association for Psychedelic Studies (MAPS)’ Phase …Read moreplaceholder thumbnailSetback Or Opportunity? FDA Rejects MDMA For PTSD | ForbesAugust 29, 2024Read moreplaceholder thumbnailDespite FDA setback, psychedelic pioneer Rick Doblin is unfazed about MDMA’s prospects – The Washington PostAugust 27, 2024Read moreMAPS Awards Grant for Pilot MDMA-assisted Massed Exposure Therapy TrialAugust 26, 2024FOR IMMEDIATE RELEASE: August 27, 2024 The Multidisciplinary Association for Psychedelic Studies (MAPS) awarded Emory University researchers a $200,000 grant for a pilot study examining MDMA-assisted Massed …Read moreMAPS Statement on FDA Complete Response Letter on MDMA-Assisted Therapy for PTSD New Drug ApplicationAugust 9, 2024