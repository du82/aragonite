title = "About MAPS – Multidisciplinary Association for Psychedelic Studies – MAPS"
full_description = "About MAPS Who we are Researchers of Psychedelics, Leaders of Change. Founded in 1986, MAPS is a 501(c)(3) nonprofit research and educational organization that develops medical, legal, and cultural contexts for people to benefit from the careful uses of psychedelics and marijuana. MAPS previously sponsored the most advanced psychedelic-assisted therapy research in the world and continues to support psychedelic and marijuana research with a focus on the people and places most impacted by trauma. MAPS incubated Lykos Therapeutics, a drug-development public benefit company, and The Zendo Project, a leader in psychedelic harm reduction. Philanthropic donors and grantors have given more than $140 million to advance psychedelic research, change drug policy, and shape culture. Take a TripDown Memory Lane. After decades of fundamental research, there was a cultural struggle over psychedelics in the United States. Just as psychiatrists, psychologists, and other researchers were making incredible headway on their studies of compounds like LSD and psilocybin (among others), the U.S. government criminalized these substances, blocking research across the globe.Enter our founder, Rick Doblin, Ph.D.. Knowing the DEA would move onto criminalizing MDMA, Rick (along with Alise Agar and Debby Harlow) started a nonprofit in 1984, the Earth Metabolic Design Lab. They filed a lawsuit to prevent the DEA’s effort to classify MDMA as a Schedule I substance. Unfortunately, the DEA rejected the recommendation of the judge to keep the therapeutic use of MDMA legal. But hope was not lost.By creating MAPS in 1986, Rick was able to continue researching the healing potential of MDMA and other psychedelics. Over the course of the past 37 years, MAPS has raised over $140 million for psychedelic research and education. 1972The AwakeningOur founder, Rick Doblin, Ph.D., has his first experience with LSD, giving him a glimpse of the profound connection between heart and mind made possible by psychedelics. From that moment on, Rick dedicated his life to becoming a legal psychedelic therapist, envisioning a healthier, more sustainable and loving world. 1986MAPS is BornOne year after MDMA is deemed illegal by the FDA, Rick founded MAPS as a research and educational organization with the goal of proving to the world (and the US government) that when coupled with therapy, psychedelics were an effective PTSD treatment. 1990Changein the WindThe FDA introduces a new group to oversee psychedelic research protocols, opening the doors to modern psychedelic science. This year also marks the first major psychedelic conference hosted by MAPS, “Regulation or Prohibition: Psychedelics in the 1990s.” 2004Let the Trials BeginUnder the leadership of drug development expert, Amy Emerson, MAPS begins focusing on clinical trials to study the effect of MDMA-assisted therapy on PTSD. 2014MAPS PBCis BornIn 2014, the MAPS Public Benefit Corporation (MAPS PBS) was founded in anticipation of FDA approval of MDMA-Assisted Therapy for PTSD. This year is also when MAPS published results from the first study of LSD therapy in over 40 years. MAPS PBC was renamed Lykos Therapeutics in early 2024. 2017Psychedelic Science 2017 is BornIn this historic six-day global gathering, the international scientific community came together to share and discuss research for psychedelic-assisted therapy. With over 3,000 attendees, Psychedelic Science 2017 featured simultaneous tracks of presentations by leading and up-and-coming international researchers in the multidisciplinary field of psychedelic science and medicine. 2019TEDmeets MAPSMAPS founder Rick Doblin, Ph.D., presented the first official TED Talk about psychedelics. MAPS published results from the combined analysis of six Phase 2 studies of MDMA-assisted therapy for PTSD. 20212021& BeyondWith Nature Medicine’s publication of our first FDA Phase 3 trial of MDMA-assisted therapy for PTSD, MAPS continues to be the leader of psychedelic research. OurNever-EndingDedication to Diversity At MAPS, we’re committed to creating an inclusive workplace, and fully recognize that diversity is not just a goal, but an ongoing mission. We provide equal employment opportunities to support a work environment free from discrimination on the basis of race, religious creed, color, national origin, ancestry, physical disability, mental disability, medical condition, genetic information, marital status, sex, gender, gender identity, gender expression, age, sexual orientation, military and veteran status, arrest or conviction record, and any other basis prohibited by law.The MovementIn Action Our job is incomplete until we’re able to provide access and education to everyone. The MAPS Policy & Advocacy Department works with a wide range of communities to make psychedelic research, education, and care more accessible. Thanks to our work with various advocacy groups, we continue to work towards decriminalisation and regulation of all drugs. Only when we start with social, radical, and environmental justices can we offer true healing to everyone who needs it. Learn MoreThe MindsBehind The Movement Over the past three decades, we’ve assembled a team of passionate professionals who have helped facilitate groundbreaking studies, policy change, and radical healing. Meet the TeamBoard of DirectorsRick Doblin, Ph.D., Founder and PresidentRick Doblin, Ph.D., is the Founder and President of the Multidisciplinary Association for Psychedelic Studies (MAPS). He received his doctorate in Public Policy from Harvard’s Kennedy School of Government, where he wrote his dissertation on the regulation of the medical uses of psychedelics and marijuana and his Master’s thesis on a survey of oncologists about smoked marijuana vs.…Meet RickDavid Bronner, Board of DirectorsIndependent Voting Member David Bronner is Cosmic Engagement Officer (CEO) of Dr. Bronner’s, the top-selling brand of natural soaps in North America and producer of a range of organic body care and food products. He is a grandson of company founder, Emanuel Bronner, and a fifth-generation soapmaker. David and Michael established Dr. Bronner’s as a…Meet DavidVicky Dulai, Board ChairIndependent Voting Member Vicky Dulai is an independent psychedelic philanthropic consultant. She advises philanthropists and foundations about emerging opportunities in psychedelic research, treatment, and therapist training. Vicky is the founder of Compassion For Addiction, a non-profit dedicated to a trauma informed and psychedelic medicine approach to treating addiction. She was the first female board member…Meet VickyMeet the Board"
