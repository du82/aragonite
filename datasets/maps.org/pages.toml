full_description = "Our Team Board of DirectorsRick Doblin, Ph.D., Founder and PresidentRick Doblin, Ph.D., is the Founder and President of the Multidisciplinary Association for Psychedelic Studies (MAPS). He received his doctorate in Public Policy from Harvard’s Kennedy School of Government, where he wrote his dissertation on the regulation of the medical uses of psychedelics and marijuana and his Master’s thesis on a survey of oncologists about smoked marijuana vs.…Meet RickDavid Bronner, Board of DirectorsIndependent Voting Member David Bronner is Cosmic Engagement Officer (CEO) of Dr. Bronner’s, the top-selling brand of natural soaps in North America and producer of a range of organic body care and food products. He is a grandson of company founder, Emanuel Bronner, and a fifth-generation soapmaker. David and Michael established Dr. Bronner’s as a…Meet DavidVicky Dulai, Board ChairIndependent Voting Member Vicky Dulai is an independent psychedelic philanthropic consultant. She advises philanthropists and foundations about emerging opportunities in psychedelic research, treatment, and therapist training. Vicky is the founder of Compassion For Addiction, a non-profit dedicated to a trauma informed and psychedelic medicine approach to treating addiction. She was the first female board member…Meet VickyMeet the BoardStaffRick Doblin, Ph.D., Founder and PresidentRick Doblin, Ph.D., is the Founder and President of the Multidisciplinary Association for Psychedelic Studies (MAPS). He received his doctorate in Public Policy from Harvard’s Kennedy School of Government, where he wrote his dissertation on the regulation of the medical uses of psychedelics and marijuana and his Master’s thesis on a survey of oncologists about smoked marijuana vs.…Meet RickKris Lotlikar, Executive DirectorKris Lotlikar serves as the Executive Director of MAPS, overseeing financing and strategic direction of MAPS’ organizations globally. Since joining the MAPS, Kris helped shepherd Lykos Therapeutics into the leading psychedelic drug development company, raising over $100 million for MAPS and Lykos Therapeutics. Kris’s passion and expertise is in building high-performing organizations in nascent and…Meet KrisBetty Aldworth, Director of Communications & EducationBetty Aldworth serves as the Director of Communications & Education at MAPS. With the Communications team, Betty works to share MAPS’ story with our audiences and generate support for psychedelic research and reform through the media. Betty also works with colleagues and allies across the drug policy reform movement to Illustrate the promise of a…Meet BettySee all Staff"
