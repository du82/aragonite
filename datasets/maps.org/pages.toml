full_description = "Ayahuasca Banisteriopsis caapi and Psychotria viridis Formula: C12H16N2 Drug class: Psychedelic; tryptamine Other names: Aya; Hoasca; Brew; Grandmother Onset of action: 20-60 minutes Peak: 3-5 hoursAyahuasca Ayahuasca is a psychoactive brew or tea most commonly derived from Banisteriopsis caapi, a vine containing monoamine oxidase inhibitors (MAOIs), and the leaves of Psychotria viridis or other plant containing N,N-dimethyltryptamine (DMT), and often several other admixture plants.Did you know? Ayahuasca is legal in many countries in South America. MAPS completed the first North American observational study of the safety and long-term effectiveness of ayahuasca treatment for addiction and dependence.In the United States, the União do Vegetal and the Santo Daime Church have been granted legal freedom to use ayahuasca for religious purposes, though DMT, the principally active ingredient, remains a Schedule I controlled substance.See moreSee lessStudiesAyahuasca-Assisted Treatment for Addiction: British Columbia, CanadaThe DropSee the latest in ayahuasca news.placeholder thumbnailRed Table Talk with the Smith Family: The Miracle Treatment We Almost Couldn’t Tell You AboutNovember 10, 2021Summary: On a new episode of Red Table Talk, Jaden Smith, Jada Pinkett Smith, and Gammy Norris speak with author Michael Pollan, journalist Lisa Ling, oncologist Paul Song, and entrepreneur Bob Parsons …Read moreplaceholder thumbnailWIRED: Big Tech’s Psychedelics GriftNovember 7, 2021Summary: WIRED investigates the growth of support for psychedelic medicine, highlighting how entrepreneurs from the technology industry are contributing to the field through philanthropic contributions …Read moreCNBC: Psychedelic Trips Could Soon Be Part of Therapy — Here’s What Those Sessions Will Look LikeJuly 24, 2021Summary: Cory Stieg of CNBC Make It illustrates the details of psychedelic-assisted therapy sessions, pulling from the expertise of MAPS-sponsored researcher Jennifer M