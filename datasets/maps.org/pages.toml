["https://maps.org/about-maps/global-affiliates"]
title = "Global Affiliates – Multidisciplinary Association for Psychedelic Studies – MAPS"
full_description = "Global Affiliates MAPS Global Affiliates are independent organizations with independent governance and strategy from MAPS, but with aligned missions focused on a shared commitment to psychedelic research, education, and policy reform. These affiliates are founded by groups of highly motivated experts in-country who have coalesced to promote education on psychedelics, support initiating research, and collaborate with networks of drug policy reformers. MAPS does not define governance, strategy, or mission for MAPS Global Affiliates but does, at times, offer limited operational support and strategic advice. Founded in 2011 Working with partners in government, business, and the community, MAPS Canada is committed to advancing psychedelic medicine by supporting scientific, multidisciplinary research; advocating for drug policy reform; offering public education; and supporting equitable access to legal and regulated psychedelic medicine in Canada. Founded in 2021 MAPS Israel is an Israeli non-profit organization dedicated to advancing psychedelic research and educational programs. Drawing on expertise in medicine, psychology, culture, ethics and law, MAPS Israel focuses on pioneering new studies for conditions such as post-traumatic stress disorder, treatment-resistant depression , eating disorders, and other medical indications.At the forefront of innovation, MAPS Israel is leading the development of cutting-edge treatments and educational initiatives. By exploring the potential of psychedelic therapies, we aim to provide hope and healing for individuals coping with various forms of trauma. Through initiatives like the ‘HealingOct7’ program, which focuses on group MDMA-assisted therapy for collective trauma, and groundbreaking research on sexual trauma and therapist experience, MAPS Israel is shaping a future where psychedelic therapies offer transformative solutions for those in need. Founded in 2021 MAPS Deutschland aims to continue the successful work of MAPS in Germany. The association’s aim is to promote science and research in the possibilities of using psychedelic substances to support therapeutic treatments, to educate the public in a responsible manner, and to develop recommendations and guidelines."
year_published = 2025
