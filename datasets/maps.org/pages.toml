title = "Careers – Multidisciplinary Association for Psychedelic Studies – MAPS"
full_description = "Careers MAPS advances equity and inclusion in the workplace by providing equal employment opportunity to support a work environment free from discrimination on the basis of race, religious creed, color, national origin, ancestry, physical disability, mental disability, medical condition, genetic information, marital status, sex, gender, gender identity, gender expression, age, sexual orientation, military and veteran status, arrest or conviction record, and any other basis prohibited by law. The organization also provides reasonable accommodations for qualified applicants and employees with disabilities. This equal employment opportunity policy applies to all aspects of employment, including recruitment, selection, advancement, training, problem resolution, and separation from employment. Through this policy, MAPS strives to establish and maintain an equitable and accessible work environment that is supportive and free from discrimination.Explore Job Opportunities You are already authorized to work in the United States if you are a citizen, a lawful permanent resident (i.e. a Green Card holder), or have nonimmigrant visa that authorizes you to work for a specific employer (for example, you have an H-1B, L-1B, O, or P visa) . However, if you are a refugee, asylum seeker, hold a U visa, have a pending Form I-485, (Application to Register Permanent Residence or Adjust Status), have a pending Form I-589 (Application for Asylum and for Withholding of Removal) or have a nonimmigrant status that allows you to be in the United States but does not allow you to work in the United States without first seeking permission from USCIS (such as an F-1 or M-1 student), then you will need to apply for a “Work Authorization Document.” For more information please visit: https://www.uscis.gov/i-765."
