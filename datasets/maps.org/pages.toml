title = "Multidisciplinary Association for Psychedelic Studies – MAPS – Psychedelic Research for Psychological Healing"
description = "We are a hub for psychedelic education. Register for the largest psychedelic gathering in history!"
full_description = "New from MAPS: Integration Station A collection of articles, resources, and downloadable exercises to help you explore psychedelic integration Explore Join the Movement Subscribe to get all the latest updates, calls to action, and psychedelic information delivered right to your inbox. This Valentine’s Day, we’re grateful to all of our friends and supporters. We appreciate you ❤️ Explore this art at Facebook.com/PsytScene Holiday Giving Support MAPS this holiday season in our quest to expand psychedelic access. Donate Now Plus, we’re giving away up to 200 newly designed t-shirts, starting with new recurring donors. Register now for PS2025MAPS is a nonprofit organization that provides public resources and leadership as we work together to create legalresponsibleevidence–based pathways to psychedelics. AttendWe are a hub for psychedelic education. Register for the largest psychedelic gathering in history! ResearchWe incubated the world’s most advanced psychedelic-assisted therapy research. Policy ReformWe advocate for the dignity and rights of all people who use drugs, free from fear and stigma. Harm ReductionHarm reduction saves lives. Learn about safety in therapy or provide peer support through The Zendo Project. Begin Your Journey Curious about psychedelics?MAPS is your trusted source for evidence-based information about psychedelic substances and integrated treatments What every therapist needs to know.Resources for mental and behavioral health professionals Be the BridgeBuild the movement for psychedelic medicine and policy reform. Get the GearWear, tote, and read your way through the psychedelic renaissance. Health EquityMental health is a human right. Charting a course for the future of psychedelics Since 1986 History Since 1986, MAPS has worked tirelessly to build and share the blueprint for ending psychedelic prohibition. This MAPS blueprint is being used throughout the world to take an evidence-based approach to psychedelic healing. As a nonprofit, MAPS has relied on the support of people like you to pursue our mission, build a movement, and change the way people think about, talk about, and consume psychedelics through research, education, and advocacy. Values Working to end psychedelic prohibition requires transparency and perseverance. Our work relies on the support of people from all backgrounds with all types of experience and contributions to share. Our approach is informed by our Seven Principles. We strive to embody an unwavering commitment to equity and compassion. Moreover, we are committed to a culture of curiosity and a long-term vision informed by research. Impact MAPS has incubated what will likely be the first psychedelic-assisted therapy to obtain government approval in the US. Thanks to our community of supporters and dedicated team, we have been able to spread this playbook widely, develop groundbreaking psychedelic education, and host the largest gathering of the Psychedelic Renaissance. Ultimately, we aim to end drug prohibition everywhere and unlock the healing potential of psychedelics for all who seek their benefit. Vision We envision a world where psychedelics and marijuana are safely and legally available for beneficial uses—where research is governed by rigorous scientific evaluation of their risks and benefits. Our priority is public benefit, and our approach reflects this commitment to community over profit. Our work is intended to support the rights and dignity of all those who use these drugs free from fear and stigma. WATCHWATCH Discover MAPS’ Published Titles ADD TO CART ADD TO CART The Healing Journey $16.95 ADD TO CART ADD TO CART LSD Psychotherapy $19.95 ADD TO CART ADD TO CART Drawing it Out: Befriending the Unconscious $19.95 ADD TO CART ADD TO CART Manual of Psychedelic Support $19.95 ADD TO CART ADD TO CART The Pot Book $24.99 ADD TO CART ADD TO CART The Secret Chief Revealed $13.95 ADD TO CART ADD TO CART The Ketamine Papers $27.95 ADD TO CART ADD TO CART The 