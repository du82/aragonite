["https://mar.codes/about"]
title = "About | Marcos Griselli"
description = "An iOS development blog about UIs and automation."
full_description = "👋 Hey there, I'm Marcos an iOS/Swift developer from Buenos Aires 🇦🇷 Here's a list of the projects/companies I worked on: Open Source Libraries ViewAnimator ViewAnimator let's you animate an entire view hierarchy with just one line of code. It uses delays to generate a 'cascade' of animations which are eye-catching when adding content to a table or collection view. It is built based on UIView animations API so it's implementation is similar to the native solution. Easy Transitions Easy Transitions was created for a talk I gave at NSConf 2018. The concept of the library is to be able to build reusable interactive transitions in the same way that we'd use the animations API. And provide default implementations of the most common interactions that drive transitions and use them with one-line setup in our transitions. Sizes With all the new device sizes testing our applications on every combination of device and font size possible became a huge task. Sizes aims to drastically reduce this time by resizing our app to the different iOS devices available and easily change between dynamic font categories while we run the app. SwipeableTabBarController As the name describes SwipeableTabBarController is a UITabBarController implementation where you can swipe between tabs interactively with different types of transitions. Apps and Companies Lyft A ride whenever you need one. lyft.com → Ella - Sight Singing Ella is a sight-singing ear-training app that helps you improve your musical ear with fun and engaging exercises. ellaapp.io → Chet - Ear Training Chet is an ear training game for musicians of all levels. Compete with other musicians to achieve high scores in a wide variety of challenges that test your ear. chetapp.io → Design+Code Design+Code is an interactive book that teaches how to design for iOS, draw user interfaces from scratch and code in Swift 4 using Xcode 9. You can watch, read, bookmark and check your progress all in one app. designcode.io → Toptal I freelanced at Toptal for over 3 years working on multiple projects for different companies around the globe. I was exposed to various ways of working as well as different programming languages and frameworks. I highly recommend Toptal if you're considering freelancing as a career path. toptal.com → Tictapps This was my first software development job. A software factory focused on mobile apps both Android and iOS. A great environment full of young people making their initial steps in the industry. tictapps.com → Community BA:Swiftable BA:Swiftable is an all Apple related technologies conference. 2019 marked our first edition and it was done in Buenos Aires, Argentina. We had speakers from all around the world and over 330 attendees. What makes Swiftable special is that it wasn't just a 2-day conference but a week full of activities to fully experience the Argentinean life. Day events like tours and nightly activities in the form of dinners and parties made this event like no other. I was one of the organizers and host alongside Josefina Bustamante and Facundo Menzella. You can check the conference videos on our YouTube channel and the photo albums day 1 and day 2 + after party. swiftable.io → Swift BA SwiftBA is a local meetup in Buenos Aires, Argentina. We get together once every 2/3 months at a company that opens their doors to host the event and have a night of iOS/Swift related talks, foods and drinks. SwiftBA talks are recorded and uploaded to it's YouTube channel. All the talks are in Spanish. I'm currently one of the organizers alongside Pablo Villar. @Swift_BA → Podcasts Swift Coders podcast #59 iPhreaks podcast #224 Mobile DevOps is a thing! by Bitrise Talks Exploring interactive transitions Evolving with Swift"
