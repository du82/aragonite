title = "German | -Wmarc"
description = "Posts about German written by marcmutz"
full_description = "Heise Developer: GoingNative 2012 — Gegenwart und Zukunft von C++ 2012-02-10 Leave a comment For you German speakers out there, my sixth Heise Developer article, “GoingNative 2012 — Gegenwart und Zukunft von C++” just went live on Heise’s site. It’s a sum-up of the GoingNative 2012 conference that happened on Feb 2nd-3rd. There won’t be an English translation later, since it’d be outdated by the time it appeared. The talks are in English, and you can download them all from Microsoft’s Channel9 page, though. From the article: Die Qualität der Vorträge war durchweg hoch, wenn auch Nichtmuttersprachler einigen Vortragenden nur schwer folgen konnten. Die Konferenz macht Lust auf ein Jahr mit mehr C++-Konferenzen als seit 1999 üblich. Besonders hängen blieben das Versprechen auf schnelle Adoption des neuen Standards, auch von Clang und Microsoft, und der Versuch, die C++-Standardbibliothek in den nächsten Jahren massiv zu erweitern. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3e4aef166c', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Rate this: Filed under C++, C++0x, German, Heise Developer Tagged with C++, C++11, conference, GN12, GoingNative12, Heise, Heise Developer, planetkde GoingNative12 @ KDAB, Berlin 2012-01-31 Leave a comment For everyone interested in C++11, and as suggested by Herb Sutter, KDAB will show the live stream of the GoingNative12 C++ conference in it’s training facilities at Tempelhofer Ufer 11 in Berlin this Thursday and Friday (Feb 2nd and 3rd). The show is scheduled to run from 18:30 to 02:15 (CET) each day. We invite everyone to join us, but please drop us a note at berlin(at)kdab.com so we can plan ahead. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3e4aef26b6', { sectionId: '370373', format: 'inread' }); }); Rate this: Filed under C++0x, English, German Tagged with C++, C++11, GoingNative12, planetkde Heise Developer: Mythos Proxy-Style 2011-10-31 4 Comments For you German speakers out there, my fifth Heise Developer article, “Mythos Proxy-Style: Wie eine verspätete Klasse neues Licht auf ein bekanntes Entwurfsmuster wirft” just went live on Heise’s site. It examines the implementation of QProxyStyle in Qt 4.6 and, from that analysis, derives an important caveat regarding the applicability of a certain well-known design pattern. This is the German translation of an unpublished English-language original, which I will publish here after a grace period. From the article: In der Qt-Gemeinde existiert ein Mythos: “QProxyStyle”. Auf der einen Seite stehen Entwickler wie David Faure, seines Zeichens KDE-Urgestein und geschätzter Kollege des Autors, die behaupten, ein QProxyStyle sei unmöglich. Auf der anderen Seite stehen Entwickler von Qt-Erweiterungen, die einen QProxyStyle entwickelt haben wollen. Eine Spurensuche im Märchenwald deckt interessante Komplikationen bei der Anwendung eines bekannten Entwurfsmusters auf. Rate this: Filed under C++, German, Heise Developer, Qt Tagged with C++, Decorator Pattern, Heise, Heise Developer, KDTools, planetkde, Proxy Pattern, QProxyStyle, QStyle, Qt, QWidget, Qxt, QxtProxyStyle Heise iX: QtQuick article, KDAB whitepaper; Qt Containers update 2011-10-18 Leave a comment Together with my fellow KDABians Stephen Kelly and Volker Krause, I wrote a whitepaper on QtQuick usage in the KOMO project. From the whitepaper: Developing a serious and large application from scratch, or from an existing desktop application, presents a different set of challenges compared to your normal smart-phone ‘app’. Portability to different platforms, and long-term maintainability in the face of ever-changing mobile target platforms suddenly come into play. This paper attempts to summarize the experience we gathered using the new declarative GUI framework, QtQuick, in this project. Unfortunately, recent events (read: Tizen) have already invalidated much of the content in the supplemental box on the future of Qt, but that’s the bane of everyone writing about Qt’s future these days… Get the English version (with slightly more details) at http://www.kdab.com/whitepapers, or read the German version (with better editing) in the current print issue of German computer magazine iX: http://www.heise.de/ix/inhalt/2011/11/114/. In other news: I’ve updated “Understand the Qt Containers” with a discussion of the differences between STL and Qt containers regarding size types, associative container insertions, and error handling. I also mention QT_STRICT_ITERATORS now. Rate this: Filed under Akonadi, English, German, Qt Tagged with Heise, iX, KDE, planetkde, QML, Qt, whitepaper Heise Developer: Gelernt aus Fehlern 2011-09-21 1 Comment For you German speakers out there, Heise Developer just published a re-issue of my C++0x overview article from the 2009 Programmieren Heute, called “Gelernt aus Fehlern“. Compared to the print version, we’ve updated the content in some places, such as spending less time on the removal of concepts and more about the adoption of the new standard, as well as turning the Top 10 into a Top 11 to celebrate the new standard 🙂 From the article: Die spannendste Frage wird sein, wie schnell sich C++11 gegen seinen Vorgänger C++98 wird durchsetzen können. Es war in den vergangenen zwei Dekaden regelmäßig notwendig, C++-Neuerungen konservativ einzusetzen, da Compiler den Standard nur zögerlich umgesetzt haben. […] Hier muss sich die C++-Gemeinde umgewöhnen. Neuerungen wie Lambdas und auto machen C++11 zu einer deutlich produktiveren Sprache, als C++98 es war. Es gilt nun, diese Produktivitätssteigerung im Alltag auch zu nutzen, um gegen Java und .NET zu bestehen. Ein weiteres Jahrzehnt der Zersplitterung und Inkompatibilität könnte die momentan exzellente Ausgangsposition von C++ schnell wieder zunichte machen. Hope you like it. Rate this: Filed under C++, C++0x, German, Heise Developer Tagged with C++, Heise, Heise Developer, planetkde Translated: Pimp My Pimpl (part 2) 2011-08-14 Leave a comment I’m happy to report that I finally sat down to translate the second part of my Heise Developer article on the Pimpl Idiom to English. Please find it here. Rate this: Filed under Boost, C++, C++0x, English, German, Heise Developer, Qt Tagged with BC, C++, exception, Heise, Heise Developer, pimpl, planetkde, Qt, virtual function Translated: Pimp My Pimpl (part 1) 2011-04-16 Leave a comment I’m happy to report that I finally sat down to translate the first part of my Heise Developer article on the Pimpl Idiom to English. Please find it here. Rate this: Filed under Boost, C++, C++0x, English, German, Heise Developer, Qt Tagged with BC, C++, exception, Heise, Heise Developer, pimpl, planetkde, Qt, virtual function Gpg4win 2.1.0 released 2011-03-15 Leave a comment From the announcement: we are pleased to announce the availability of the new stable Gpg4win release: Version 2.1.0. The download is available via the new gpg4win website: http://www.gpg4win.org/download.html +++ Do you like Gpg4win? To help furthering this project, please consider to sponsor the development. Thank you! See http://www.gpg4win.org . +++ A German press release about Gpg4win 2.1.0 – created in cooperation with the German Federal Office for Information Security (BSI) – is released today: https://www.bsi.bund.de/ContentBSI/Presse/Pressemitteilungen/Presse2011/Gpg4win_neue_Version_15032011.html Rate this: Filed under English, German, Gpg4win Tagged with Gpg4win, KDE, planetkde, release Gpg4win 2.1.0-rc1 released 2010-12-21 Leave a comment From the announcement: we are pleased to announce the availability of the first release candidate of Gpg4win 2.1.0. The download is available via the usual download page: http://www.gpg4win.org/download.html This version is intended for trying out and testing the forthcoming major version 2.1.0. There are a lot of improvements and bug fixes, particularly in Kleopatra, Pinentry and GnuPG. Rate this: Filed under English, German, Gpg4win Tagged with Gpg4win, KDE, planetkde, release Heise Developer: Pimp My Pimpl (part 2) 2010-11-15 3 Comments For you German speakers out there, my third Heise Developer article, “Pimp my Pimpl: Vor- und Nachteile des d-Zeiger-Idioms, Teil 2“, just went live on Heise’s site. [[EDIT 2011-08-14: An English translation is now available]] It’s part two of a two-part article focusing on the advantages and disadvantages of the pimpl idiom. You can find part one here. Even if you don’t speak German, you might be interested in the sample source code. From the article: Nachdem ein erster Artikel auf heise Developer zunächst das klassische Pimpl-Idiom vorgestellt und dessen Vorteile herausgestellt hat, geht es im zweiten Teil darum, typische Nachteile zu mindern, die beim Einsatz von Pimpl unweigerlich entstehen. Rate this: Filed under C++, German, Heise Developer Tagged with C++, Heise, Heise Developer, pimpl, planetkde ← Older posts Top PostsPimp My Pimpl — ReloadedUnderstand the Qt containersHeise Developer: Pimp My Pimpl (part 2)Pimp My PimplTranslated: Pimp My Pimpl (part 2)Akonadi Boost C++ C++0x Effective Qt English German Gpg4win Heise Developer Private Practice Qt StackOverflow.widget.widget_media_image { overflow: hidden; }.widget.widget_media_image img { height: auto; max-width: 100%; }Monthly January 2021 (1) September 2016 (1) March 2016 (1) February 2012 (1) January 2012 (1) November 2011 (3) October 2011 (2) September 2011 (3) August 2011 (3) July 2011 (2) April 2011 (2) March 2011 (1) December 2010 (1) November 2010 (1) October 2010 (2) September 2010 (1) August 2010 (3) July 2010 (7) Blogroll Romain's Blog Thomas' Blog Kevin's Blog Stephen's Blog David's Blog __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-286348-67c3e4af084d0', location: 140, formFactor: '003', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); });"
