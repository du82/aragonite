title = "Heise Developer: Pimp My Pimpl (part 1) | -Wmarc"
description = '''For you German speakers out there, my second Heise Developer article, "Pimp my Pimpl: Vor- und Nachteile des d-Zeiger-Idioms, Teil 1", just went live on Heise's site. [[EDIT 2011-04-16: An English version is now available] It's part one of a two-part article focusing on the advantages and disadvantages of the pimpl idiom. From the article:…'''
full_description = '''← Gpg4win 2.1.0-beta1 released Top 5 reasons you should love your ternary operator → Heise Developer: Pimp My Pimpl (part 1) 2010-10-05 7 Comments For you German speakers out there, my second Heise Developer article, “Pimp my Pimpl: Vor- und Nachteile des d-Zeiger-Idioms, Teil 1“, just went live on Heise’s site. [[EDIT 2011-04-16: An English version is now available] It’s part one of a two-part article focusing on the advantages and disadvantages of the pimpl idiom. From the article: Als bekanntes C++-Idiom erlaubt Pimpl es dem Klassenautor, die Schnittstelle von der Implementierung einer Klasse in einem Maße zu trennen, wie das in C++ eigentlich nicht vorgesehen ist. Als positiver Nebeneffekt beschleunigt der Einsatz von d-Zeigern Übersetzungsläufe, erleichtert die Implementierung von Transaktionssemantik und erlaubt durch erweiterte Mittel der Komposition mitunter zur Laufzeit effizientere Implementierungen. Nicht alles ist jedoch gut beim Einsatz von d-Zeigern: Neben der zusätzlichen Private-Klasse und deren dynamischer Speicheranforderung bereiten die geänderte const-Methoden-Semantik und Allokationssequenzfehler Sorgen. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3e4fb893fe', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3e4fb89443', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Rate this:Share this:TwitterRedditEmailPrintLike Loading... Related Filed under C++, German, Heise Developer Tagged with C++, Heise, Heise Developer, pimpl, planetkde About marcmutzMarc Mutz is a Principal Software Engineer with The Qt Company. 7 Responses to Heise Developer: Pimp My Pimpl (part 1) Fazer says: 2010-10-05 at 16:09 Can we count on English translation of your article? 🙂 Reply marcmutz says: 2010-10-26 at 11:58 Yes, I have obtained permission to publish an English version on this blog. It will happen sometime during December, probably. Reply Matthias Pospiech says: 2010-10-06 at 14:01 Really interesting to read. I would like to know if this way of accessing variables makes any difference in speed if I use this for CPU consuming calculations, where the variable access is made via pimpl idiom. Not long ago someone told me that in his company this would not be used because of the decrease in speed in algorithms. Reply marcmutz says: 2010-10-06 at 14:10 Yeah, it’s a trade-off, as usual. If you have simple data classes, then pimpl produces noticeable overhead (not only through the indirection, but also because you can’t have inline functions anymore). If you can, moving the function onto the Private class is one option to get some speed back. Reply peterbite says: 2010-10-26 at 11:39 When is the second part of the article due? I can’t wait! Reply marcmutz says: 2010-10-26 at 13:19 Probably next week. Reply Pingback: Translated: Pimp My Pimpl (part 1) « -Wmarc Leave a comment Cancel reply Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); This site uses Akismet to reduce spam. Learn how your comment data is processed. Top PostsPimp My Pimpl — ReloadedUnderstand the Qt containersHeise Developer: Pimp My Pimpl (part 2)Pimp My PimplTranslated: Pimp My Pimpl (part 2)Akonadi Boost C++ C++0x Effective Qt English German Gpg4win Heise Developer Private Practice Qt StackOverflow.widget.widget_media_image { overflow: hidden; }.widget.widget_media_image img { height: auto; max-width: 100%; }Monthly January 2021 (1) September 2016 (1) March 2016 (1) February 2012 (1) January 2012 (1) November 2011 (3) October 2011 (2) September 2011 (3) August 2011 (3) July 2011 (2) April 2011 (2) March 2011 (1) December 2010 (1) November 2010 (1) October 2010 (2) September 2010 (1) August 2010 (3) July 2010 (7) Blogroll Thomas' Blog Stephen's Blog David's Blog Kevin's Blog Romain's Blog __AT