full_description = "Partially-Formed @ Meeting C++ 2021 talk is now online 2021-01-21 1 Comment My talk “Partially-Formed Objects For Fun And Profit” from Meeting C++ 2020 is now online here: https://www.youtube.com/watch?v=9OQKZl7ha7g From the abstract: Lately, partially-formed states have gained some traction as the natural state of moved-from objects. Alexander Stepanov, in his landmark book Elements of Programming (EoP), defines them as a state in which the only valid operations are assignment and destruction. This state was, and continues to be, essential to high-performance code, and to the C++ guarantee of “don’t pay for what you don’t use”. We will also show how developers that feel uneasy about the partially-formed state can avoid them at little to no cost, neither in code readability, nor performance, and use these examples to propose a new (or old) paradigm for API design: safe and unsafe functions (in the Sean Parent sense). A longer version of the talk, in which I also cover the Bonus Slides, for which I didn’t have time in the Meeting C++ version, is available from the MUC++ YouTube channel: https://www.youtube.com/watch?v=HcSAIZafNZU __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3e4ac59ca1', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Rate this: Filed under C++0x, English Tagged with Partially-Formed State, planetkde RFC: How to fix a tricky leak in QFormLayout? 2016-09-28 Leave a comment We have a nasty leak in QFormLayout::setWidget(). In setWidget(), we create the QWidgetItemV2 corresponding to the passed QWidget, and pass that on to Private::setItem, which has a bunch of error returns (guard clauses) that do not delete the item, among them negative row index and cell already occupied. We could easily fix that missing delete, but this function is also used by setLayout(), say, where the item is the layout. Conceptually deleting that item (= the nested layout) is completely OK, because the user should be able to rely on the form layout to take ownership of the nested layout, without ifs and buts. But then we have code in tst_qformlayout that breaks. Simplified, it reads: QFormLayout layout; QHBoxLayout l4; layout.addLayout(-1, QFormLayout::FieldRole, &l4); I guess you spot the problem? If l4 had been added, everything would’ve been peachy: The QHBoxLayout destructor unregistered itself from layout, which does not attempt to delete l4 when it itself is deleted. But if l4 is not added for some reason, like in the test code above, the fixed code will attempt to delete l4, which is undefined behaviour, of course (double-delete). I think such broken code deserves to be broken, for the greater good of fixing a resource leak. Esp. since a double-delete should complain much louder than a leak, and the API user can do something about the double-delete while she can’t do anything about the leak (the pointer is not reachable from outside QFormLayout). I feel uneasy about adding this to 5.6 LTS, though, so I’ll make a minimal fix there, just for setWidget(). What do you think about the larger fix? __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3e4ac5ad6d', { sectionId: '370373', format: 'inread' }); }); Rate this: Filed under English, Qt Tagged with leak, planetkde, QFormLayout, Qt, RFC Effective Qt @ Meeting C++ 2015: talk is now online 2016-03-01 Leave a comment Effective Qt continues as a conference-driven series! After the guys at Qt World Summit last year managed to mess up the recording of exactly one of the many, many talks there (my Effective Qt one, of course), this is to let you know that Jens Weller of Meeting C++ has uploaded the recording of my Effective Qt talk to his conference channel on YouTube. I talk about Q_FOREACH vs. C++11 range-for, QLatin1String vs. QStringLiteral, as well as, of course, how bad QList is. Enjoy! Rate this: Filed under C++, Effective Qt, English, Qt Tagged with C++, conference, Effective Qt, Meeting C++, planetkde, Qt GoingNative12 @ KDAB, Berlin 2012-01-31 Leave a comment For everyone interested in C++11, and as suggested by Herb Sutter, KDAB will show the live stream of the GoingNative12 C++ conference in it’s training facilities at Tempelhofer Ufer 11 in Berlin this Thursday and Friday (Feb 2nd and 3rd). The show is scheduled to run from 18:30 to 02:15 (CET) each day. We invite everyone to join us, but please drop us a note at berlin(at)kdab.com so we can plan ahead. Rate this: Filed under C++0x, English, German Tagged with C++, C++11, GoingNative12, planetkde Wild Beasts 2011-11-28 Leave a comment In “Private Practice: Taming Templates”, I had (deliberately, of course :)) hidden a bug in the implementation of KDGenericFactory. I’ve now added a discussion about the bug and its fix. Rate this: Filed under C++, English, Private Practice, Qt Tagged with C++, casting, KDTools, planetkde, QObject Private Practice: What’s in a Proxy-Style? 2011-11-24 Leave a comment A new session in the private practice, “What’s in a Proxy Style?”, examines QProxyStyle and derives some important caveat when applying a classical Design Pattern. This is the original-language version of my recent Mythos Proxy-Style article. Rate this: Filed under C++, English, Private Practice, Qt Tagged with C++, Decorator Pattern, KDTools, planetkde, Proxy Pattern, QProxyStyle, QPushButton, QStyle, Qt, Qxt, QxtProxyStyle, virtual function Private Practice: Taming Templates 2011-11-18 Leave a comment I’ve started a new column, Private Practice, that looks at existing implementations and examines them. The first Private Practice article, Taming Templates, examines techniques to control template code bloat. There’s nothing particularly earth-shattering in there, but I noticed that a lot of people don’t seem to be aware of the fact that templates can cause a lot of duplicated code, so I thought I’d write about it. Even if they haven’t been released under the Private Practice banner, the following articles also fit that category well: Mythos Proxy-Style [[Update 2011-11-24: EN version now available as “What’s in a Proxy-Style?”]] Dem Elfenbeinturm entreißen Rate this: Filed under C++, C++0x, English, Private Practice, Qt Tagged with C++, KDTools, planetkde, Qt, templates Heise iX: QtQuick article, KDAB whitepaper; Qt Containers update 2011-10-18 Leave a comment Together with my fellow KDABians Stephen Kelly and Volker Krause, I wrote a whitepaper on QtQuick usage in the KOMO project. From the whitepaper: Developing a serious and large application from scratch, or from an existing desktop application, presents a different set of challenges compared to your normal smart-phone ‘app’. Portability to different platforms, and long-term maintainability in the face of ever-changing mobile target platforms suddenly come into play. This paper attempts to summarize the experience we gathered using the new declarative GUI framework, QtQuick, in this project. Unfortunately, recent events (read: Tizen) have already invalidated much of the content in the supplemental box on the future of Qt, but that’s the bane of everyone writing about Qt’s future these days… Get the English version (with slightly more details) at http://www.kdab.com/whitepapers, or read the German version (with better editing) in the current print issue of German computer magazine iX: http://www.heise.de/ix/inhalt/2011/11/114/. In other news: I’ve updated “Understand the Qt Containers” with a discussion of the differences between STL and Qt containers regarding size types, associative container insertions, and error handling. I also mention QT_STRICT_ITERATORS now. Rate this: Filed under Akonadi, English, German, Qt Tagged with Heise, iX, KDE, planetkde, QML, Qt, whitepaper C++98 Support Costs Extra! 2011-09-20 27 Comments I should note, right up front, that this post reflects my personal opinion and not that of my employer. In particular, KDAB currently does not require extra payment for C++98 support, even though, as this post will make abundantly clear, I personally wouldn’t mind if it did :). So, the new C++ standard is finalised and voted on unanimously. Does that mean that we’ll have another decade of C++ incompatibilities ahead of us? My answer to that is: That depends on us. Will we adopt C++11 faster than C++98? Our compilers do. Will we make use of the new productivity gains (auto, range-for, lambdas, …) or will we continue to castrate our code to work with 15-year-old compilers? The answers of the majority of C++ programmers will determine how the next decade goes for all of us. In this post, I’ll argue (strongly) for dropping C++98 support asap, and using C++11 to the fullest possible extent in all our projects. This includes dropping support for compilers and platforms that don’t (yet) support C++11 to the extent required by a particular project instead of #ifdefing our way around it, as we (as an industry) have done for the past 30 years. Will these compilers and platforms be left out in the cold? Not really: they will have older versions of libraries and programs to support them. But yes, newer versions will require an up-to-date C++ compiler. Is this realistic? I think it is. Essentially, we have this situation already now. Many projects require fairly recent versions of libraries, precisely because 1) there’s not much point in supporting older versions, and 2) supporting many versions of one library with the same code-base is fairly expensive. I’ve tried. Gpgme++ theoretically supports gpgme’s that can be considered stone-aged. Has anyone ever tested this? Hmmm… How many Mac applications still support OS X 10.2? 10.3? 10.4? Half of the web doesn’t work anymore on KDE 3.5’s Konqueror. Then why should we be so conservative when it comes to C++, the very core of what we work with? It’s not even customer-visible. Why do we accept an STL shipping in 2011 that is basically unchanged from the mid-1990s? Why do we #ifdef our way around MSVC6 problems in 2011? Why do we care about the quirks of GCC 3.3, or heaven forbid, 2.95? My new-year’s resolution (ok, it’s a bit early, but hey): stop it! C++11 support in C++ compilers now is much stronger than C++98 support was in 1998 in the then-C++-compilers. I fully expect every C++ compiler to have caught up on final C++11 with its next major release, except for source-code invisible changes like the new memory model. I want Qt 5 to require a C++11 compiler. I want KDE 5 to require a C++11 compiler. I will lobby inside KDAB to do the same. Why? Because I’m a programmer, and we’re lazy. I want to use auto. If you make me type std::map<std::string,std::string>::const_iterator instead of auto, it’s more work, less fun, so you should need to pay extra. I want to use lambdas. If you make me write struct ByName : std::binary_function<Foo,Foo,bool> { result_type operator()( const Foo & lhs, const Foo & rhs ) const { return lhs.name() < rhs.name() ; } }; instead of [](const Foo &lhs, const Foo &rhs) { return lhs.name() < rhs.name() ; }, it’s more work, less fun, so you should need to pay extra. C++11 is a much more productive language than C++98. We as an industry can, however, only reap that productivity gain if we stop throwing C++ productivity out of the window by the bucket-load in the hopeless pursuit of compatibility with non-standard implementations. The worst offender, Microsoft, has seen the light. Their current compilers are very standards-compliant, and actively maintained. I hope that Apple won’t be the next blocker: By choosing Clang over GCC for—apparently—political reasons (GCC 4.2 was the last GCC with GPLv2), they have lost at least one year of C++11 support that GCC and VC are ahead of Clang. Let’s hope Clang catches up soon. [[EDIT 2011-09-21: If you think that VC isn’t implementing C++11 fast enough, you can make yourselves heard here: http://visualstudio.uservoice.com, in particular here and here.]] [[EDIT 2012-03-30: Microsoft has announced that the VC++ compiler will have a faster release cycle than Visual Studio. That makes me hope that we’ll see a “reasonably conforming” (Sutter) VC++ a long time before 2014. Also, Clang++ 3.1 has caught up a lot with GCC (http://clang.llvm.org/cxx_status.html#cxx11, 3.1 currently shows up as “SVN”); it seems tooling will indeed not be the problem, after all.]] Rate this: Filed under C++, C++0x, English Tagged with C++, compiler, planetkde Early-Bird Registration open for “In-depth Multi-Threading with Qt” @ DevDays 2011-09-20 Leave a comment I’ll be giving a two-day “In-depth multi-threading with Qt” training just after the DevDays in Munich, ie. Oct 27th-28th. The training language will be English. The training material is the one from the usual Qt training, but “seriously expanded” to fill the two-day schedule. From the announcement: This two-day training teaches how to use multithreading with the primitives provided by Qt. Participants will gain insight into multithreading problems in general, and how they pertain to Qt programs in particular. Examples include how to offload work from the GUI thread, how to increase throughput to the maximum in your application, and optimal strategies for communication between threads. The training covers topics such as cross-thread signal/slot connections, QThreadPool, QObjects and multithreading, QtConcurrent, QFuture, and Qt atomic operations. Participants are expected to have a working knowledge of C++ and Qt. Prior experience with multithreaded programming is recommended, but not necessary. The course will start with a one hour multithreading refresher. To book, visit http://www.kdab.com/schedule. Until October 1st, you’ll save 200€ on the early-bird offer. Just use d94ec6fd in the Voucher(s) field. Hope to see you there! Rate this: Filed under C++, English, Qt Tagged with C++, KDAB, multithreading, planetkde, training ← Older posts Top PostsPimp My Pimpl — ReloadedUnderstand the Qt containersHeise Developer: Pimp My Pimpl (part 2)Pimp My PimplTranslated: Pimp My Pimpl (part 2)Akonadi Boost C++ C++0x Effective Qt English German Gpg4win Heise Developer Private Practice Qt StackOverflow.widget.widget_media_image { overflow: hidden; }.widget.widget_media_image img { height: auto; max-width: 100%; }Monthly January 2021 (1) September 2016 (1) March 2016 (1) February 2012 (1) January 2012 (1) November 2011 (3) October 2011 (2) September 2011 (3) August 2011 (3) July 2011 (2) April 2011 (2) March 2011 (1) December 2010 (1) November 2010 (1) October 2010 (2) September 2010 (1) August 2010 (3) July 2010 (7) Blogroll Kevin's Blog Thomas' Blog Stephen's Blog David's Blog Romain's Blog __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-286348-67c3e4ac68cab', location: 140, formFactor: '003', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); });"
