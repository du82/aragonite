title = "August | 2011 | -Wmarc"
description = "3 posts published by marcmutz during August 2011"
full_description = "Understand the Qt Containers: The Data 2011-08-19 Leave a comment This is just a short heads-up to those that have asked for quantitative measurements. I’ve begun updating “Understand the Qt Containers” with a section on data. As of now, the memory and append performance is in. I’ll re-run the iteration test over the night once more (I’ve detected an anomaly that I’d like the verify first), and re-add them again, when done. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3e47ebcbd9', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Rate this: Filed under Boost, C++, C++0x, Effective Qt, English, Qt Tagged with Boost.Foreach, C++, container, Effective Qt, planetkde, QList, Qt, QTypeInfo, QVariant, QVector Effective Qt: Understand the Qt Containers 2011-08-15 3 Comments The third of my Effective Qt columns, “Understand the Qt Containers“, just went live on my site. If you know me, you will know what awaits you there 🙂 I hope I have not disappointed you. That said, this is just a first part. I plan to eventually extend it to cover more containers (currently, just QVector and QList), and give more data and assembler code for the containers I’ve already described. These are the guidelines this item covers: Remember that QList has nothing to do with std::list, and QSet has nothing to do with std::set. Be aware of the two Qt container APIs, Qt-ish and STL-compatible, and avoid mixing their use in the same project. Familiarise yourself with the STL containers and the additional features they offer. Prefer member-swap over assignment wherever possible to express move semantics. Use C++11 rvalue move semantics if the class and the compiler support them. [[EDIT 2011-08-25: new]] Always use constBegin()/constEnd() (cbegin()/cend()) when assigning the result to a const_iterator. Avoid modifying a container (remove/insert elements) while iterating. If you have to, use an STL algorithm, such as one of the std::remove() family. Prefer the STL-compatible iterators over the Java-style ones. If you do use the Java-style iterators, avoid using the mutating ones. Prefer to use const references as the first argument of Q_FOREACH, unless the element type is customarily passed by value. Familiarise yourself with BOOST_FOREACH, and the additional features it offers. Declare your enums and QFlags as Q_PRIMITIVE_TYPE if there’s a chance they will be held in Qt containers. Declare your value-types Q_MOVABLE_TYPE if there’s a chance they will be held in Qt containers. Don’t change the classification of a type if you need to maintain binary compatibility. Prefer vector (std or Q) over QList. Avoid QList<T> where T is not declared as either Q_MOVABLE_TYPE or Q_PRIMITIVE_TYPE or where sizeof(T) != sizeof(void*) (remember to check both 32 and 64-bit platforms). [[EDIT 2011-08-16: new]] Avoid using vectors of types for which Qt APIs customarily use QList, and for which QList is not inefficient. Hope you enjoy! __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3e47ebdf49', { sectionId: '370373', format: 'inread' }); }); Rate this: Filed under Boost, C++, C++0x, Effective Qt, English, Qt Tagged with Boost.Foreach, container, Effective Qt, planetkde, QList, Qt, QTypeInfo, QVector Translated: Pimp My Pimpl (part 2) 2011-08-14 Leave a comment I’m happy to report that I finally sat down to translate the second part of my Heise Developer article on the Pimpl Idiom to English. Please find it here. Rate this: Filed under Boost, C++, C++0x, English, German, Heise Developer, Qt Tagged with BC, C++, exception, Heise, Heise Developer, pimpl, planetkde, Qt, virtual function Top PostsPimp My Pimpl — ReloadedUnderstand the Qt containersHeise Developer: Pimp My Pimpl (part 2)Pimp My PimplTranslated: Pimp My Pimpl (part 2)Akonadi Boost C++ C++0x Effective Qt English German Gpg4win Heise Developer P