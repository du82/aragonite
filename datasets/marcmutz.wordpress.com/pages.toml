full_description = '''← Heise iX: QtQuick article, KDAB whitepaper; Qt Containers update Private Practice: Taming Templates → Heise Developer: Mythos Proxy-Style 2011-10-31 4 Comments For you German speakers out there, my fifth Heise Developer article, “Mythos Proxy-Style: Wie eine verspätete Klasse neues Licht auf ein bekanntes Entwurfsmuster wirft” just went live on Heise’s site. It examines the implementation of QProxyStyle in Qt 4.6 and, from that analysis, derives an important caveat regarding the applicability of a certain well-known design pattern. This is the German translation of an unpublished English-language original, which I will publish here after a grace period. From the article: In der Qt-Gemeinde existiert ein Mythos: “QProxyStyle”. Auf der einen Seite stehen Entwickler wie David Faure, seines Zeichens KDE-Urgestein und geschätzter Kollege des Autors, die behaupten, ein QProxyStyle sei unmöglich. Auf der anderen Seite stehen Entwickler von Qt-Erweiterungen, die einen QProxyStyle entwickelt haben wollen. Eine Spurensuche im Märchenwald deckt interessante Komplikationen bei der Anwendung eines bekannten Entwurfsmusters auf. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3e486b344e', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3e486b3482', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Rate this:Share this:TwitterRedditEmailPrintLike Loading... Related Filed under C++, German, Heise Developer, Qt Tagged with C++, Decorator Pattern, Heise, Heise Developer, KDTools, planetkde, Proxy Pattern, QProxyStyle, QStyle, Qt, QWidget, Qxt, QxtProxyStyle About marcmutzMarc Mutz is a Principal Software Engineer with The Qt Company. 4 Responses to Heise Developer: Mythos Proxy-Style dipesh says: 2011-11-01 at 13:10 Great article. Thanks! Reply Martin 