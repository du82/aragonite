full_description = "Wild Beasts 2011-11-28 Leave a comment In “Private Practice: Taming Templates”, I had (deliberately, of course :)) hidden a bug in the implementation of KDGenericFactory. I’ve now added a discussion about the bug and its fix. Rate this: Filed under C++, English, Private Practice, Qt Tagged with C++, casting, KDTools, planetkde, QObject Private Practice: What’s in a Proxy-Style? 2011-11-24 Leave a comment A new session in the private practice, “What’s in a Proxy Style?”, examines QProxyStyle and derives some important caveat when applying a classical Design Pattern. This is the original-language version of my recent Mythos Proxy-Style article. Rate this: Filed under C++, English, Private Practice, Qt Tagged with C++, Decorator Pattern, KDTools, planetkde, Proxy Pattern, QProxyStyle, QPushButton, QStyle, Qt, Qxt, QxtProxyStyle, virtual function Private Practice: Taming Templates 2011-11-18 Leave a comment I’ve started a new column, Private Practice, that looks at existing implementations and examines them. The first Private Practice article, Taming Templates, examines techniques to control template code bloat. There’s nothing particularly earth-shattering in there, but I noticed that a lot of people don’t seem to be aware of the fact that templates can cause a lot of duplicated code, so I thought I’d write about it. Even if they haven’t been released under the Private Practice banner, the following articles also fit that category well: Mythos Proxy-Style [[Update 2011-11-24: EN version now available as “What’s in a Proxy-Style?”]] Dem Elfenbeinturm entreißen __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3e4a9dba57', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Rate this: Filed under C++, C++0x, English, Private Practice, Qt Tagged with C++, KDTools, planetkde, Qt, templates Top PostsPimp My Pimpl — 