full_description = '''← RFC: How to fix a tricky leak in QFormLayout? Partially-Formed @ Meeting C++ 2021 talk is now online 2021-01-21 1 Comment My talk “Partially-Formed Objects For Fun And Profit” from Meeting C++ 2020 is now online here: https://www.youtube.com/watch?v=9OQKZl7ha7g From the abstract: Lately, partially-formed states have gained some traction as the natural state of moved-from objects. Alexander Stepanov, in his landmark book Elements of Programming (EoP), defines them as a state in which the only valid operations are assignment and destruction. This state was, and continues to be, essential to high-performance code, and to the C++ guarantee of “don’t pay for what you don’t use”. We will also show how developers that feel uneasy about the partially-formed state can avoid them at little to no cost, neither in code readability, nor performance, and use these examples to propose a new (or old) paradigm for API design: safe and unsafe functions (in the Sean Parent sense). A longer version of the talk, in which I also cover the Bonus Slides, for which I didn’t have time in the Meeting C++ version, is available from the MUC++ YouTube channel: https://www.youtube.com/watch?v=HcSAIZafNZU __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3e4a2a135d', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3e4a2a138b', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Rate this:Share this:TwitterRedditEmailPrintLike Loading... Related Filed under C++0x, English Tagged with Partially-Formed State, planetkde About marcmutzMarc Mutz is a Principal Software Engineer with The Qt Company. One Response to Partially-Formed @ Meeting C++ 2021 talk is now online Pingback: Links 23/1/2021: Chromium Pains and New Debian Maintainers | Techrights Leave a comment Cancel repl