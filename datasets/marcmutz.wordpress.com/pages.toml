full_description = "Partially-Formed @ Meeting C++ 2021 talk is now online 2021-01-21 1 Comment My talk “Partially-Formed Objects For Fun And Profit” from Meeting C++ 2020 is now online here: https://www.youtube.com/watch?v=9OQKZl7ha7g From the abstract: Lately, partially-formed states have gained some traction as the natural state of moved-from objects. Alexander Stepanov, in his landmark book Elements of Programming (EoP), defines them as a state in which the only valid operations are assignment and destruction. This state was, and continues to be, essential to high-performance code, and to the C++ guarantee of “don’t pay for what you don’t use”. We will also show how developers that feel uneasy about the partially-formed state can avoid them at little to no cost, neither in code readability, nor performance, and use these examples to propose a new (or old) paradigm for API design: safe and unsafe functions (in the Sean Parent sense). A longer version of the talk, in which I also cover the Bonus Slides, for which I didn’t have time in the Meeting C++ version, is available from the MUC++ YouTube channel: https://www.youtube.com/watch?v=HcSAIZafNZU __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3e4a0daf9b', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Rate this: Filed under C++0x, English Tagged with Partially-Formed State, planetkde Top PostsPimp My Pimpl — ReloadedUnderstand the Qt containersHeise Developer: Pimp My Pimpl (part 2)Pimp My PimplTranslated: Pimp My Pimpl (part 2)Akonadi Boost C++ C++0x Effective Qt English German Gpg4win Heise Developer Private Practice Qt StackOverflow.widget.widget_media_image { overflow: hidden; }.widget.widget_media_image img { height: auto; max-width: 100%; }Monthly January 2021 (1) September 2016 (1) March 2016 (1) February 2012 (1) January 2012 (1) November 2011 (3) October 2011