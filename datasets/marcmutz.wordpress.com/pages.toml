["https://marcmutz.wordpress.com/2010/08/24/a-case-against-direct-initialisation-%e2%80%94-the-sequel"]
title = "A case against direct initialisation — the sequel | -Wmarc"
description = "A few days ago, I wrote about why I consider the commonly seen rule to prefer direct initialisation over copy initialisation false advice. Sometimes, you feel something, based on your experience, and can't quite pinpoint it, or recall where the feeling comes from. Yet, you're perfectly certain it makes sense. I thought I had collected…"
full_description = '''← A case against direct initialisation Gpg4win 2.1.0-beta1 released → A case against direct initialisation — the sequel 2010-08-24 6 Comments A few days ago, I wrote about why I consider the commonly seen rule to prefer direct initialisation over copy initialisation false advice. Sometimes, you feel something, based on your experience, and can’t quite pinpoint it, or recall where the feeling comes from. Yet, you’re perfectly certain it makes sense. I thought I had collected enough reasons to explain why I don’t like direct initialisation (with one argument, you don’t have much choice with more than one :)), but as you can see from the comments, not everyone agrees they’re sufficient. Today, I recalled a fourth reason to despise direct initialisation. Try the following program in Qt 3: #define QT_NO_CAST_ASCII #include <qstring.h> int main() { QString s1 = "foo"; QString s2( "bar" ); return 0; } You would rightfully expect that both of the statements in main() fail to compile. After all, by defining QT_NO_CAST_ASCII, I (thought I) disabled the const char* → QString conversion for good. Sure enough, that’s what happens for the first statement. But the compiler always tries to make sense of your feeble scribblings into a text editor, and in this case, it found that it could make the second statement compile by going via std::string(const char*) and QString(std::string). Oops. Of course, this is really a bug in QString, as the QString(std::string) constructor should have been under QT_NO_CAST_ASCII protection, too. But given that even the Trolls managed to let that one slip through, before you throw the first stone, consider whether you yourself would have managed to call that bug. To summarise: If you use direct initialisation, T t(u), you effectively allow the compiler to use two user-defined conversions to go from a U u to a T. The mediator type is not visible in the actual source code. With copy initialisation, T t = u, only one user-defined conversion is allowed (as usual), and it must either be U::operator T(), or T(U). I don’t know about you, but I don’t like my compiler second-guessing me at every opportunityinitalisation, and I would hate for it to make an error of mine compile by inserting a double conversion via an expensive third type. So, I take my compiler on the short leash and give it copy initialisation statements wherever possible. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3e4ee199f8', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3e4ee19a34', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Rate this:Share this:TwitterRedditEmailPrintLike Loading... Related Filed under C++, English, Qt Tagged with C++, constructor, direct initialisation, planetkde, QString, Qt, std::string About marcmutzMarc Mutz is a Principal Software Engineer with The Qt Company. 6 Responses to A case against direct initialisation — the sequel Peter says: 2010-08-24 at 10:29 Seems fixed in 4.6. But isn’t it better than disabling the std::string ctor to make the ctor explicit when the macro is set ? #ifdef QT_NO_CAST_ASCII explizit #endif QString(const std::string&); Reply marcmutz says: 2010-08-24 at 10:50 Yes, it’s fixed in Qt 4. Qt 3 didn’t have (m)any explicit constructors, probably due to compiler limitations. That said, making the QString(std::string) constructor explicit doesn’t help in this case, because that one is explicitly called in the source. It’s the const char* → std::string conversion that is implicit, and std::string(const char*) isn’t explicit (by design). Reply Peter says: 2010-08-24 at 11:00 Ah, OK. I would love a GCC option to disable implicit casts. But I assume then no existing code would compile, so a warning would already help a lot ( but would also produce much “warning noise”). Maybe such a compiler flag could be added to clang, the only readable compiler code. Reply The User says: 2010-08-24 at 16:15 Well, C++ has weak typing, for a lot of cases implicit casts allow much more elegant code… Reply The User says: 2010-08-24 at 16:23 I think a QString-constructor behaving like QString::fromUtf8 would be just fine… Reply Calvin Culus says: 2010-08-25 at 01:30 This is a case against macros, not against direct initialization. Reply Leave a comment Cancel reply Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); This site uses Akismet to reduce spam. Learn how your comment data is processed. Top PostsPimp My Pimpl — ReloadedUnderstand the Qt containersHeise Developer: Pimp My Pimpl (part 2)Pimp My PimplTranslated: Pimp My Pimpl (part 2)Akonadi Boost C++ C++0x Effective Qt English German Gpg4win Heise Developer Private Practice Qt StackOverflow.widget.widget_media_image { overflow: hidden; }.widget.widget_media_image img { height: auto; max-width: 100%; }Monthly January 2021 (1) September 2016 (1) March 2016 (1) February 2012 (1) January 2012 (1) November 2011 (3) October 2011 (2) September 2011 (3) August 2011 (3) July 2011 (2) April 2011 (2) March 2011 (1) December 2010 (1) November 2010 (1) October 2010 (2) September 2010 (1) August 2010 (3) July 2010 (7) Blogroll Kevin's Blog Stephen's Blog David's Blog Romain's Blog Thomas' Blog __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-286348-67c3e4ee20771', location: 140, formFactor: '003', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); });'''
