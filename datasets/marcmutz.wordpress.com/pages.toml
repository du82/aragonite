full_description = '''Heise Developer: Dem Elfenbeinturm entreißen 2010-07-21 3 Comments A little belatedly, I guess, but here we go: For you German speakers out there, my first Heise Developer article, “Dem Elfenbeinturm entreißen: Über den praxisrelevanten Einsatz der Template-Metaprogrammierung“, “just” went live on Heise’s site. It shows how to use TMP to convert from QVariant to boost::variant<>. Even if you don’t speak German, you might be interested in the sample source code: ftp://ftp.heise.de/pub/ix/developer/elfenbein.zip. From the article: Als Ansatz für eine Konvertierungsfunktion lässt sich Folgendes schreiben. template <typename T_Variant> T_Variant qvariant2variant( const QVariant & qv ) { for( T : types(T_Variant) ) if ( qv.type() == T ) return T_Variant( qvariant_cast<T>( qv ) ); throw bad_cast( "..." ); }; Es fehlen noch zwei Dinge, um aus dem Pseudocode “richtigen” Code zu erstellen: Erstens ein Weg, um einen Typ T auf den dazugehörigen QVariant-internen Diskriminator abzubilden. Das leistet das Funktions-Template qMetaTypeId() […]. Zweitens ein Weg, um “für jeden Typ T, den T_Variant enthalten kann”, abzubilden. Das lässt sich mit TMP lösen (Stichwort: Liste von Typen), was die Aufgabe für den Rest des Artikels sein wird. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3e4e61df2c', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Rate this: Filed under Boost, C++, German, Heise Developer, Qt Tagged with Boost.Variant, Heise, Heise Developer, QVariant, Template Metaprogramming, TMP Top PostsPimp My Pimpl — ReloadedUnderstand the Qt containersHeise Developer: Pimp My Pimpl (part 2)Pimp My PimplTranslated: Pimp My Pimpl (part 2)Akonadi Boost C++ C++0x Effective Qt English German Gpg4win Heise Developer Private Practice Qt StackOverflow.widget.widget_media_image { overflow: hidden; }.widget.widget_media_ima