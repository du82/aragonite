title = "Heise Developer: Dem Elfenbeinturm entreißen | -Wmarc"
description = '''A little belatedly, I guess, but here we go: For you German speakers out there, my first Heise Developer article, "Dem Elfenbeinturm entreißen: Über den praxisrelevanten Einsatz der Template-Metaprogrammierung", "just" went live on Heise's site. It shows how to use TMP to convert from QVariant to boost::variant<>. Even if you don't speak German, you might…'''
full_description = '''Heise iX: iX Spezial “Programmieren Heute” available as eBook → Heise Developer: Dem Elfenbeinturm entreißen 2010-07-21 3 Comments A little belatedly, I guess, but here we go: For you German speakers out there, my first Heise Developer article, “Dem Elfenbeinturm entreißen: Über den praxisrelevanten Einsatz der Template-Metaprogrammierung“, “just” went live on Heise’s site. It shows how to use TMP to convert from QVariant to boost::variant<>. Even if you don’t speak German, you might be interested in the sample source code: ftp://ftp.heise.de/pub/ix/developer/elfenbein.zip. From the article: Als Ansatz für eine Konvertierungsfunktion lässt sich Folgendes schreiben. template <typename T_Variant> T_Variant qvariant2variant( const QVariant & qv ) { for( T : types(T_Variant) ) if ( qv.type() == T ) return T_Variant( qvariant_cast<T>( qv ) ); throw bad_cast( "..." ); }; Es fehlen noch zwei Dinge, um aus dem Pseudocode “richtigen” Code zu erstellen: Erstens ein Weg, um einen Typ T auf den dazugehörigen QVariant-internen Diskriminator abzubilden. Das leistet das Funktions-Template qMetaTypeId() […]. Zweitens ein Weg, um “für jeden Typ T, den T_Variant enthalten kann”, abzubilden. Das lässt sich mit TMP lösen (Stichwort: Liste von Typen), was die Aufgabe für den Rest des Artikels sein wird. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3e46eb4032', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3e46eb407e', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Rate this:Share this:TwitterRedditEmailPrintLike Loading... Related Filed under Boost, C++, German, Heise Developer, Qt Tagged with Boost.Variant, Heise, Heise Developer, QVariant, Template Metaprogramming, TMP About marcmutzMarc Mutz is a Principal Software Engineer with The Qt Company. 3 Responses to Heise Developer: Dem Elfenbeinturm entreißen jjost says: 2011-05-23 at 10:48 Wow, thanks! I’m currentlty working on a project using both QVariant and boost::variant and wondered if there was a generic and elegant way to convert between the two. The boost::variant to QVariant was easy to figure using a boost visitor, but the other way around I wouldn’t have found without your article! It even allowed me to practise some german since quite a while :] Reply jjost says: 2011-05-23 at 14:42 Mmh, I think there might be a little error in your code if you want it to work properly with user-defined types stored in QVariant ( e.g. defined using Q_DECLARE_METATYPE ) : you shouldn’t compare the metatype of each type using QVariant::type() (which will always return QVariant::UserType for user-defined types) but rather use QVariant::userType() which will return the actual ID of the metatype (== the same value that would be returned by qMetaTypeId ) : // the static_cast is there to fix a signed/unsigned warning if ( static_cast( qv.userType() ) == qMetaTypeId() ) return T_Variant( qvariant_cast( qv ) ); else return qvariant2variant_helper( qv ); Reply Pingback: Private Practice: Taming Templates « -Wmarc Leave a comment Cancel reply Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); This site uses Akismet to reduce spam. Learn how your comment data is processed. Top PostsPimp My Pimpl — ReloadedUnderstand the Qt containersHeise Developer: Pimp My Pimpl (part 2)Pimp My PimplTranslated: Pimp My Pimpl (part 2)Akonadi Boost C++ C++0x Effective Qt English German Gpg4win Heise Developer Private Practice Qt StackOverflow.widget.widget_media_image { overflow: hidden; }.widget.widget_media_image img { height: auto; max-width: 100%; }Monthly January 2021 (1) September 2016 (1) March 2016 (1) February 2012 (1) January 2012 (1) November 2011 (3) October 2011 (2) September 2011 (3) August 2011 (3) July 2011 (2) April 2011 (2) March 2011 (1) December 2010 (1) November 2010 (1) October 2010 (2) September 2010 (1) August 2010 (3) July 2010 (7) Blogroll Kevin's Blog Romain's Blog Stephen's Blog David's Blog Thomas' Blog __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-286348-67c3e46eba09c', location: 140, formFactor: '003', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); });'''
