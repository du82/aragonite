full_description = '''Heise Developer: GoingNative 2012 — Gegenwart und Zukunft von C++ 2012-02-10 Leave a comment For you German speakers out there, my sixth Heise Developer article, “GoingNative 2012 — Gegenwart und Zukunft von C++” just went live on Heise’s site. It’s a sum-up of the GoingNative 2012 conference that happened on Feb 2nd-3rd. There won’t be an English translation later, since it’d be outdated by the time it appeared. The talks are in English, and you can download them all from Microsoft’s Channel9 page, though. From the article: Die Qualität der Vorträge war durchweg hoch, wenn auch Nichtmuttersprachler einigen Vortragenden nur schwer folgen konnten. Die Konferenz macht Lust auf ein Jahr mit mehr C++-Konferenzen als seit 1999 üblich. Besonders hängen blieben das Versprechen auf schnelle Adoption des neuen Standards, auch von Clang und Microsoft, und der Versuch, die C++-Standardbibliothek in den nächsten Jahren massiv zu erweitern. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3e4a7a5ffd', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Rate this: Filed under C++, C++0x, German, Heise Developer Tagged with C++, C++11, conference, GN12, GoingNative12, Heise, Heise Developer, planetkde Heise Developer: Mythos Proxy-Style 2011-10-31 4 Comments For you German speakers out there, my fifth Heise Developer article, “Mythos Proxy-Style: Wie eine verspätete Klasse neues Licht auf ein bekanntes Entwurfsmuster wirft” just went live on Heise’s site. It examines the implementation of QProxyStyle in Qt 4.6 and, from that analysis, derives an important caveat regarding the applicability of a certain well-known design pattern. This is the German translation of an unpublished English-language original, which I will publish here after a grace period. From the article: In der Qt-Gemeinde existiert ein Mythos: “QProxyStyle”. Auf der einen Seite stehen Entwickler wie David Faure, seines Zeichens KDE-Urgestein und geschätzter Kollege des Autors, die behaupten, ein QProxyStyle sei unmöglich. Auf der anderen Seite stehen Entwickler von Qt-Erweiterungen, die einen QProxyStyle entwickelt haben wollen. Eine Spurensuche im Märchenwald deckt interessante Komplikationen bei der Anwendung eines bekannten Entwurfsmusters auf. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3e4a7a7062', { sectionId: '370373', format: 'inread' }); }); Rate this: Filed under C++, German, Heise Developer, Qt Tagged with C++, Decorator Pattern, Heise, Heise Developer, KDTools, planetkde, Proxy Pattern, QProxyStyle, QStyle, Qt, QWidget, Qxt, QxtProxyStyle Heise Developer: Gelernt aus Fehlern 2011-09-21 1 Comment For you German speakers out there, Heise Developer just published a re-issue of my C++0x overview article from the 2009 Programmieren Heute, called “Gelernt aus Fehlern“. Compared to the print version, we’ve updated the content in some places, such as spending less time on the removal of concepts and more about the adoption of the new standard, as well as turning the Top 10 into a Top 11 to celebrate the new standard 🙂 From the article: Die spannendste Frage wird sein, wie schnell sich C++11 gegen seinen Vorgänger C++98 wird durchsetzen können. Es war in den vergangenen zwei Dekaden regelmäßig notwendig, C++-Neuerungen konservativ einzusetzen, da Compiler den Standard nur zögerlich umgesetzt haben. […] Hier muss sich die C++-Gemeinde umgewöhnen. Neuerungen wie Lambdas und auto machen C++11 zu einer deutlich produktiveren Sprache, als C++98 es war. Es gilt nun, diese Produktivitätssteigerung im Alltag auch zu nutzen, um gegen Java und .NET zu bestehen. Ein weiteres Jahrzehnt der Zersplitterung und Inkompatibilität könnte die momentan exzellente Ausgangsposition von C++ schnell wieder zunichte machen. Hope you like it. Rate this: Filed under C++, C++0x, German, Heise Developer Tagged with C++, Heise, Heise Developer, planetkde Translated: Pimp My Pimpl (part 2) 2011-08-14 Leave a comment I’m happy to report that I finally sat down to translate the second part of my Heise Developer article on the Pimpl Idiom to English. Please find it here. Rate this: Filed under Boost, C++, C++0x, English, German, Heise Developer, Qt Tagged with BC, C++, exception, Heise, Heise Developer, pimpl, planetkde, Qt, virtual function Translated: Pimp My Pimpl (part 1) 2011-04-16 Leave a comment I’m happy to report that I finally sat down to translate the first part of my Heise Developer article on the Pimpl Idiom to English. Please find it here. Rate this: Filed under Boost, C++, C++0x, English, German, Heise Developer, Qt Tagged with BC, C++, exception, Heise, Heise Developer, pimpl, planetkde, Qt, virtual function Heise Developer: Pimp My Pimpl (part 2) 2010-11-15 3 Comments For you German speakers out there, my third Heise Developer article, “Pimp my Pimpl: Vor- und Nachteile des d-Zeiger-Idioms, Teil 2“, just went live on Heise’s site. [[EDIT 2011-08-14: An English translation is now available]] It’s part two of a two-part article focusing on the advantages and disadvantages of the pimpl idiom. You can find part one here. Even if you don’t speak German, you might be interested in the sample source code. From the article: Nachdem ein erster Artikel auf heise Developer zunächst das klassische Pimpl-Idiom vorgestellt und dessen Vorteile herausgestellt hat, geht es im zweiten Teil darum, typische Nachteile zu mindern, die beim Einsatz von Pimpl unweigerlich entstehen. Rate this: Filed under C++, German, Heise Developer Tagged with C++, Heise, Heise Developer, pimpl, planetkde Heise Developer: Pimp My Pimpl (part 1) 2010-10-05 7 Comments For you German speakers out there, my second Heise Developer article, “Pimp my Pimpl: Vor- und Nachteile des d-Zeiger-Idioms, Teil 1“, just went live on Heise’s site. [[EDIT 2011-04-16: An English version is now available] It’s part one of a two-part article focusing on the advantages and disadvantages of the pimpl idiom. From the article: Als bekanntes C++-Idiom erlaubt Pimpl es dem Klassenautor, die Schnittstelle von der Implementierung einer Klasse in einem Maße zu trennen, wie das in C++ eigentlich nicht vorgesehen ist. Als positiver Nebeneffekt beschleunigt der Einsatz von d-Zeigern Übersetzungsläufe, erleichtert die Implementierung von Transaktionssemantik und erlaubt durch erweiterte Mittel der Komposition mitunter zur Laufzeit effizientere Implementierungen. Nicht alles ist jedoch gut beim Einsatz von d-Zeigern: Neben der zusätzlichen Private-Klasse und deren dynamischer Speicheranforderung bereiten die geänderte const-Methoden-Semantik und Allokationssequenzfehler Sorgen. Rate this: Filed under C++, German, Heise Developer Tagged with C++, Heise, Heise Developer, pimpl, planetkde Heise Developer: Dem Elfenbeinturm entreißen 2010-07-21 3 Comments A little belatedly, I guess, but here we go: For you German speakers out there, my first Heise Developer article, “Dem Elfenbeinturm entreißen: Über den praxisrelevanten Einsatz der Template-Metaprogrammierung“, “just” went live on Heise’s site. It shows how to use TMP to convert from QVariant to boost::variant<>. Even if you don’t speak German, you might be interested in the sample source code: ftp://ftp.heise.de/pub/ix/developer/elfenbein.zip. From the article: Als Ansatz für eine Konvertierungsfunktion lässt sich Folgendes schreiben. template <typename T_Variant> T_Variant qvariant2variant( const QVariant & qv ) { for( T : types(T_Variant) ) if ( qv.type() == T ) return T_Variant( qvariant_cast<T>( qv ) ); throw bad_cast( "..." ); }; Es fehlen noch zwei Dinge, um aus dem Pseudocode “richtigen” Code zu erstellen: Erstens ein Weg, um einen Typ T auf den dazugehörigen QVariant-internen Diskriminator abzubilden. Das leistet das Funktions-Template qMetaTypeId() […]. Zweitens ein Weg, um “für jeden Typ T, den T_Variant enthalten kann”, abzubilden. Das lässt sich mit TMP lösen (Stichwort: Liste von Typen), was die Aufgabe für den Rest des Artikels sein wird. Rate this: Filed under Boost, C++, German, Heise Developer, Qt Tagged with Boost.Variant, Heise, Heise Developer, QVariant, Template Metaprogramming, TMP Top PostsPimp My Pimpl — ReloadedUnderstand the Qt containersHeise Developer: Pimp My Pimpl (part 2)Pimp My PimplTranslated: Pimp My Pimpl (part 2)Akonadi Boost C++ C++0x Effective Qt English German Gpg4win Heise Developer Private Practice Qt StackOverflow.widget.widget_media_image { overflow: hidden; }.widget.widget_media_image img { height: auto; max-width: 100%; }Monthly January 2021 (1) September 2016 (1) March 2016 (1) February 2012 (1) January 2012 (1) November 2011 (3) October 2011 (2) September 2011 (3) August 2011 (3) July 2011 (2) April 2011 (2) March 2011 (1) December 2010 (1) November 2010 (1) October 2010 (2) September 2010 (1) August 2010 (3) July 2010 (7) Blogroll Kevin's Blog David's Blog Thomas' Blog Stephen's Blog Romain's Blog __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-286348-67c3e4a7ae1b7', location: 140, formFactor: '003', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); });'''
