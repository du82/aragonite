title = "July | 2011 | -Wmarc"
description = "2 posts published by marcmutz during July 2011"
full_description = "Effective Qt: Prefer to use normalised signal/slot signatures 2011-07-26 Leave a comment The second of my Effective Qt columns, “Prefer to use normalised signal/slot signatures“, just went live on my site. There is only one guideline this item covers: Prefer normalised signal/slot signatures in connect statements. Hope you enjoy! Rate this: Filed under C++, Effective Qt, English, Qt Tagged with connect, Effective Qt, normalisation, planetkde, QMetaObject, QObject, signal, slot On a Friday in July… 2011-07-25 I usually don’t write or comment upon politics or news, but Friday’s attacks strike too close to heart to be left uncommented. Having lived in Oslo for two years or so a few years back, I was shocked when my mom called me on Friday and said “did you hear about the Oslo bombing”? No, I hadn’t. I switched on the TV, and went to www.nrk.no to find out what had happened. At first glance, it seemed that Norway had gotten away lucky: An apparently huge blast, in the capital’s centre, almost at rush hour, yet only seven dead. I texted my friends in Oslo and even though they are living or working near the blast site, they and theirs were unharmed. That was then. As I write this, we’re up to almost a hundred dead, with quite a few persons still unaccounted for. We know that the bombing in Oslo was just the prelude for a killing spree on Utøya, where a peaceful youth-get-together was underway. We know that the — predictable — initial commentators blaming Islamic terror were, for once, wrong, and we have to deal with the fact that this was an act by a Norwegian (dare I say Arian?) who cut’n’pasted together a 1500-page manifest while planning the killing for nine years. But I don’t want to speculate on politics and police tactics. My thoughts go out, instead, to the Norwegian people. Many will find that they have lost someone they knew, or know someone who lost someone, when the names of the victims will be published after their next-of-kins have been informed. I’m desperately hoping that none of my friends and none of the Trolls will be among those. That’s selfish, in a way, but it’s all I’m currently capable of. The rest is deep sadness, and the hope that Norway doesn’t come out of this changed to the worse, and instead will continue to be the best country in the world to live in. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3e47c4ccb5', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3e47c4ccde', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Rate this: Filed under English Tagged with attack, bombing, Norway, planetkde Top PostsPimp My Pimpl — ReloadedUnderstand the Qt containersHeise Developer: Pimp My Pimpl (part 2)Pimp My PimplTranslated: Pimp My Pimpl (part 2)Akonadi Boost C++ C++0x Effective Qt English German Gpg4win Heise Developer Private Practice Qt StackOverflow.widget.widget_media_image { overflow: hidden; }.widget.widget_media_image img { height: auto; max-width: 100%; }Monthly January 2021 (1) September 2016 (1) March 2016 (1) February 2012 (1) January 2012 (1) November 2011 (3) October 2011 (2) September 2011 (3) August 2011 (3) July 2011 (2) April 2011 (2) March 2011 (1) December 2010 (1) November 2010 (1) October 2010 (2) September 2010 (1) August 2010 (3) July 2010 (7) Blogroll Stephen's Blog Thomas' Blog Kevin's Blog David's Blog Romain's Blog __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-286348-67c3e47c4eac3', location: 140, formFactor: '003', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); });"
