["https://marco.org/2010/12"]
title = "December 2010 – Marco.org"
full_description = "The Big Economic Story, and Why Obama Isn’t Telling It → December 1, 2010 ∞https://marco.org/2010/12/01/the-big-economic-story-and-why-obama-isnt-telling-it By Robert Reich: Unless the President and Democrats explain why the economy still stinks for most Americans and offer a plan to fix it, the Republican explanation and solution – it’s big government’s fault, and all we need do is shrink it – will prevail. That will mean more hardship for tens of millions of Americans. It will make it harder to remedy the bad economy. And it will set Republicans up for bigger wins in the future. I’m tired of seeing the same story play out: Republicans present a coherent and incendiary (and usually completely false) narrative that appeals to the ignorant and is repeated often enough by the media that it’s perceived as truth, and the Democrats respond with ineffective “compromise” and a complete lack of a competing narrative. One of the reasons I have little hope for U.S. politics is that the Democrats are chronically ineffective at pursuing a significantly different agenda than the Republicans. We have two political parties in name only — they both pursue the same wealth-concentrating, corporatist agenda, but at least the Republicans don’t fill us with false hope for positive change before they screw us a little more each year. One Foot Tsunami: Giant Pandas Are Poorly Designed → December 6, 2010 ∞https://marco.org/2010/12/06/one-foot-tsunami-giant-pandas-are-poorly-designed Paul Kafasis teaches us why giant pandas “are simply not good at making more pandas.” I argued that pandas suck at life three years ago, and it’s good to get more support for the cause. What’s wrong with OpenID? → December 8, 2010 ∞https://marco.org/2010/12/08/whats-wrong-with-openid The short answer is that OpenID is the worst possible “solution” I have ever seen in my entire life to a problem that most people don’t really have. That’s what’s “wrong” with it. (via Alex Payne)"
