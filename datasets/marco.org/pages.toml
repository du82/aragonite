["https://marco.org/2008/03"]
title = "March 2008 – Marco.org"
full_description = "March 1, 2008 ∞https://marco.org/2008/03/01/newsfire-is-now-free-for-those-new-to-this NewsFire is now FREE! For those new to this, NewsFire is a news reader for blogs, news sites, and anything else that publishes an ‘RSS’ syndication feed. It watches for news so you don’t have to. When a new story is published, NewsFire brings it to your attention with some super-slick animation. Unlike other readers, NewsFire is designed with a deliberately minimal interface. The news is what matters and it takes center stage. This is huge news for any Mac users in need of a great RSS reader. (Especially those who think NetNewsWire isn’t great.) I bought my copy in 2004 with no regrets. The addiction is spreading March 1, 2008 ∞https://marco.org/2008/03/01/the-addiction-is-spreading Within 18 months of getting my Powerbook in Pittsburgh, I had convinced three coworkers to get their own. More recently, I ordered my Mac Pro with the January update. Then we got two of them at work. Now this. Apple should give me a commission. (Payable in Apple Store credit, of course.) March 1, 2008 ∞https://marco.org/2008/03/01/when-youre-young-you-look-at-television-and When you’re young, you look at television and think, ‘There’s a conspiracy. The networks have conspired to dumb us down.’ But when you get a little older, you realize that’s not true. The networks are in business to give people exactly what they want. That’s a far more depressing thought. Conspiracy is optimistic! You can shoot the bastards! We can have a revolution! But the networks are really in business to give people what they want. It’s the truth. — Steve Jobs in Wired (thanks, livejamie) March 1, 2008 ∞https://marco.org/2008/03/01/the-internet-lets-me-buy-just-what-i-need-when-i The internet lets me buy just what I need when I remember I need it and get on with my life. — Dawn. And that’s the retailers’ worst nightmare: not that internet shopping will undercut their prices, but that it will reduce unnecessary impulse buys."
