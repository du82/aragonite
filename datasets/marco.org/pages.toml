["https://marco.org/2010/08"]
title = "August 2010 – Marco.org"
full_description = "August 1, 2010 ∞https://marco.org/2010/08/01/past-branding-efforts-like-discover-columbus-and Past branding efforts like ‘Discover Columbus’ and ‘Surprise, It’s Columbus’ have fizzled and failed to lure tourists to the city, which boasts ‘the most accurate replica’ of the Santa Maria, one of Christopher Columbus’s ships. — Columbus Insists, There’s Lots of There There My home city has a bit of a branding problem. Columbus is a great city to live, work, and grow up in. It’s full of good office jobs with plenty of affordable houses in nice, safe neighborhoods with great schools. But there’s no reason to go to Columbus unless you live there or are visiting someone who does. I don’t think the city can really change that. Nobody cares about the Santa Maria, not even the people who live there. There’s nothing wrong with being what Columbus is — a nice place to live. Why does it need to be a tourist destination? That said, “Surprise, It’s Columbus” is the worst, most ill-suited, and most hilarious city motto I’ve ever heard. August 2, 2010 ∞https://marco.org/2010/08/02/given-how-well-jeff-bezos-usually-prioritizes Given how well Jeff Bezos usually prioritizes reading and legibility, why are his announcements on the Amazon frontpage always images of poorly rendered text? August 2, 2010 ∞https://marco.org/2010/08/02/the-world-is-more-addictive-than-it-was-40-years The world is more addictive than it was 40 years ago. And unless the forms of technological progress that produced these things are subject to different laws than technological progress in general, the world will get more addictive in the next 40 years than it did in the last 40. — Paul Graham: The Acceleration of Addictiveness August 4, 2010 ∞https://marco.org/2010/08/04/we-got-the-all-my-friends-are-dead-book-via We got the All My Friends Are Dead book (via). It’s awesome. August 4, 2010 ∞https://marco.org/2010/08/04/a-stimulus-too-small-to-significantly-reduce A stimulus too small to significantly reduce unemployment, a TARP that didn’t trickle down to Main Street, financial reform that doesn’t fundamentally restructure Wall Street, and health-care reforms that don’t promise to bring down health-care costs have all created an enthusiasm gap. They’ve fired up the right, demoralized the left, and generated unease among the general population. — Robert Reich: The Origins of the Enthusiasm Gap"
