["https://marco.org/2009/02"]
title = "February 2009 – Marco.org"
full_description = "February 1, 2009 ∞https://marco.org/2009/02/01/gary-vaynerchuks-talk-at-web-2-0-expo-ny-via Gary Vaynerchuk’s talk at Web 2.0 Expo NY (via keynotekid). My favorite part starts at 14:18, when an audience member asks how you get money to start your own business/blog/whatever. This guy’s incredibly motivating. The only sports discussion you’ll ever see on my blog February 1, 2009 ∞https://marco.org/2009/02/01/the-only-sports-discussion-youll-ever-see-on-my-blog Dilemma: I want the Steelers to win because I used to live in Pittsburgh. But if AZ gets one more TD for a 21-20 win, I’ll win the party pool for $100. Don’t tell anyone I know in Pittsburgh, but I’d rather have the cash. Edit: Well that was short-lived. Back to talking about computers and coffee. February 2, 2009 ∞https://marco.org/2009/02/02/i-love-you-ars-but-this-hurts I love you, Ars, but this hurts. February 2, 2009 ∞https://marco.org/2009/02/02/ok-your-error-page-is-awesome OK, your error page is awesome. The Case Against Everything Buckets → February 2, 2009 ∞https://marco.org/2009/02/02/the-case-against-everything-buckets Rather than forcing the user to figure out the rhyme and reason of their data (for example, by putting receipts in a financial management application and addresses in an address book), Everything Buckets cry: “throw it all in here! Search it! Maybe I’ll corrupt my proprietary database, but maybe I won’t and you’ll have the joy of sifting through a mire of RTF documents. Doesn’t that sound great?” By Alex Payne. Escaping the Caboose → February 2, 2009 ∞https://marco.org/2009/02/02/escaping-the-caboose I’m an information junky. I read a lot of RSS in a day, and I make an effort to stay on top of what is going on. I spend time reading RSS. A little too much time, I came to realize. There are two ways to interpret this situation: a) I should spend less time reading RSS. It is “wrong” to be obsessed with information. -OR- b) I am filling this want in an inefficient way. I spent a lot of time thinking it was option a, and let me tell you, those thoughts got me nowhere. Enough of that. I found this article with a vanity search for Instapaper on Technorati. It’s really great: this quote doesn’t do it justice. Read it."
