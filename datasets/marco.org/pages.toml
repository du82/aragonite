["https://marco.org/2008/01"]
title = "January 2008 – Marco.org"
full_description = "January 1, 2008 ∞https://marco.org/2008/01/01/what-an-incredibly-strange-guy What an incredibly strange guy. January 2, 2008 ∞https://marco.org/2008/01/02/ians-keeping-my-ichat-bonjour-list-chipper Ian’s keeping my iChat Bonjour list chipper. Amazon’s MP3 store is better than I thought January 2, 2008 ∞https://marco.org/2008/01/02/amazons-mp3-store-is-better-than-i-thought Availability is much better than I expected. They’ve had about 2/3 of the albums I’ve searched for. Pricing is fantastic — every album I’ve searched for has cost $8-10, and those are all 256 kbit/s MP3s with no DRM. Apple has not been able to negotiate similar availability for iTunes Plus (DRM-free 256 kbit/s AACs). I’ve only ever found one iTunes Plus album in my searches. None of my sought albums, with or without DRM, cost less than $10. Apple should be worried. iTunes isn’t losing most of its business anytime soon, but this is a significant long-term threat — especially if Amazon continues to negotiate better distribution deals from the labels. Good bad idea January 2, 2008 ∞https://marco.org/2008/01/02/good-bad-idea What if people had to pay some small fee (maybe $0.25) to leave a comment on a website, and the author could choose to refund the money if the comment was useful to the discussion? What I Want for Christmas: Not a Damn Thing → January 2, 2008 ∞https://marco.org/2008/01/02/what-i-want-for-christmas-not-a-damn-thing I was going to write something about this, but this guy said it better than I was going to. When I really want something, I buy it. […] What this means for everyone else, however, is that all the really obvious stuff to get me is taken off the table, because I’ve already gone out and gotten it. Done and done. What’s left then is a whole bunch of stuff I don’t really want, and I don’t see why people should feel obliged to buy me something I don’t really want, just because it’s the holidays. Too bad it’s too late for this year. Thanks for the link, Peroty."
