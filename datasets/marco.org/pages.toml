title = "October 2008 – Marco.org"
full_description = "Declaring Dashboard bankruptcy October 4, 2008 ∞https://marco.org/2008/10/04/declaring-dashboard-bankruptcy The wedding was great! Thanks for the unexpectedly large number of reblogs on that last post. For the first time since Tumblr started, I have to declare Dashboard bankruptcy. I absolutely cannot possibly catch up with everything since I was last here 2 weeks ago. This bothers me more than you probably expect, unless you have the same must-see-everything RSS-reader-like compulsion that I do. So I’m starting here: ____________________________________________ I have to skip everything between this line and 2 weeks ago. Let me know if I missed anything really cool. (And don’t even get me started on email…) Wow, this was an expensive time to leave society for 2 weeks October 4, 2008 ∞https://marco.org/2008/10/04/wow-this-was-an-expensive-time-to-leave-society-for-2 I just lost a lot of money in stock-based accounts. Even the most conservative stocks and mutual funds have bombed recently, and there’s no end in sight. I’m fairly new to this world, but I don’t want to ride this down any more… I think I’ll pull most of it out soon/now and buy back in when the market’s in an upswing. Is my only hope a 4% CD at this point, or am I missing better options? (Also, screw taboos. I’m talking about money. Next, I’ll address religion, politics, and whatever diseases killed your loved ones.) Timelessness and the value of content October 4, 2008 ∞https://marco.org/2008/10/04/timelessness-and-the-value-of-content Editing the submission queue for Give Me Something To Read has reinforced my increasing realization that hardly any professional-content sites (news sites, high-profile blogs, etc.) actually have anything to say of lasting value. Two weeks of submissions accumulated during my vacation (over 600 links). Normally, I put 4-6 articles per weekday on GMSTR, and I try to be very picky, so I should have a buildup of 40-60 great articles in these submissions. But many of them are time-sensitive, so their value two weeks later is greatly diminished. I’ll probably end up getting around 25 good picks, but there’s a lot of subject-matter repetition within my picks so far, having pruned through about half of the queue. The internet and blogs are great platforms to deliver news and related commentary. But can’t we find more to say that will still matter in two weeks, two years, or two decades? I’m going to try."
