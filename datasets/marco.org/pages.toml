["https://marco.org/2009/04"]
title = "April 2009 – Marco.org"
full_description = "Monitor return rates soar amidst dead pixel pandemic → April 1, 2009 ∞https://marco.org/2009/04/01/monitor-return-rates-soar-amidst-dead-pixel-pandemic Shit, this problem’s affecting my laptop screen. It’s going to be a huge wait to get this serviced at the Dell store. April 1, 2009 ∞https://marco.org/2009/04/01/gotta-have-the-morning-joe Gotta have the morning ‘joe. 10.5.7 extension hints at upcoming Nehalem-based Xserve → April 1, 2009 ∞https://marco.org/2009/04/01/10-5-7-extension-hints-at-upcoming-nehalem-based-xserve Given the recent Mac Pro refresh, however, it would seem that it’s time for a server update. A refresh may indeed be around the corner—AppleInsider has pointed to references in a file distributed as part of the 10.5.7 beta that hint at a new Xserve model with Xeon processors based on Intel’s “Nehalem” architecture. This is obviously Ars Technica’s April Fool’s joke. News flash! An Xserve update is probably coming since the Mac Pro was updated! It will probably feature the same CPUs! Do you believe the rumors? Speculation is running rampant! This is the biggest news of the year. Stop the presses! April 1, 2009 ∞https://marco.org/2009/04/01/strategery-2-is-awesome-it-has-quickly Strategery ($2) is awesome — it has quickly become my most-played iPhone game. It’s like a simple, fast version of Risk. Once you get good, you can breeze through a round in a few minutes. And there are a lot of different options (map size, army placement, land-grab mode) that significantly change how it plays and which strategies are effective, giving lots of replay value. Quick tips and notes: You can just tap the “Shake it for a new map” area instead of shaking the phone. Medium-sized maps seem best. Large is too large and the end-game gets ridiculous. I climbed up to Brutal difficulty pretty quickly, and it’s very satisfying — I don’t need it to be any easier or harder than that. I can manage almost a 1:1 win/loss ratio (currently 45:51). Make sure you read the “Learn how to play” overview. There are a few significant mechanical differences from Risk, such as how the number of bonus armies is calculated (number of countries in largest contiguous group) and how the dice-roll winner is determined (sum vs. sum, not highest-vs.-highest). My favorite configuration: Brutal, Medium, Blue goes first ON, Manual bonus army placement, Winner keeps all OFF, Land grab ON. Go get it."
