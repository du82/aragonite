["https://marco.org/2010/05"]
title = "May 2010 – Marco.org"
full_description = "May 1, 2010 ∞https://marco.org/2010/05/01/maybe-i-would-have-done-better-sitting-with-the Maybe I would have done better sitting with the normal kids at lunch and not taking a handicapped bus twice a week to hang out with every nerd my age in town. — Meaghan O’Connell on the social dilemma of “gifted” programs. May 3, 2010 ∞https://marco.org/2010/05/03/it-felt-like-there-had-been-a-massive-evacuation It felt like there had been a massive evacuation, followed by an aerial bombing, and no one had returned. Far from the interstate, the ghetto received little through-traffic. I wondered if being out of sight of the highway kept these areas looking the way they did. Far more people travel by car than by train. If more people saw these neglected places, would they stay the way they are? — Emily Guerin: The Northeast Corridor By Rail Stack Overflow raises $6 million → May 4, 2010 ∞https://marco.org/2010/05/04/stack-overflow-raises-6-million The problem is that, golly gee, why just programmers? Surely there are people out there in different professions–you know, candlestick makers, robotics engineers, and designers of favicons–who could use a site much like Stack Overflow to get answers to their hard questions. And some of these people must have questions, themselves, about candlesticks, positronic brains, and teeny tiny pixels, and they must be frustrated when they go to a bulletin-board site and the right answer is buried on page 50. So we created Stack Exchange to bring the technology behind Stack Overflow to a much wider variety of sites. We tried charging for Stack Exchange, and that didn’t work so well. So we asked ourselves, “How would the people of 1999 solve this problem?” And the best answer we could come up with was, let’s make the damn thing free, and get some VC somewhere to pay for it. I’ve been following Stack Overflow since its announcement, mostly by listening to every episode of the podcast. (Really. Even when Jeff says something I don’t like about PHP.) I’ve used the site to get answers numerous times, nearly always starting from Google and finding myself there from the first cluster of hits. And the Stack Overflow results are always of higher quality and relevance than anything else in Google’s first few pages. So I’m happy to be tangentially involved with Stack Overflow’s next steps on their “board of advisors”, which means I get to sound like I do a lot of work but really just share my experience and opinion whenever they ask (and sometimes when they don’t). The Stack Overflow team and investors comprise such a wealth of wisdom and ability that I have no doubts about their future success."
year_published = 2010
