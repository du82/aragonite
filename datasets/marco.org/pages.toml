["https://marco.org/2010/01"]
title = "January 2010 – Marco.org"
full_description = "January 4, 2010 ∞https://marco.org/2010/01/04/much-of-what-we-called-depression-was-really Much of what we called ‘depression’ was really dissatisfaction, a result of setting a bar impossibly high or expecting treasures that we weren’t willing to work for. — Mitch Albom (via Casey Liss) How to wash dishes in an office January 4, 2010 ∞https://marco.org/2010/01/04/how-to-wash-dishes-in-an-office Stack as many dishes, glasses, and mugs in the sink as you can get to fit in it. Be sure to include as much leftover food as possible, especially if it came from the ocean. There should be no more than 1 inch of clearance between the top of the stack and the faucet’s opening. Saturate the sponge, then hide it somewhere in the middle of the stack. Pour coffee over the stack. January 4, 2010 ∞https://marco.org/2010/01/04/soulver-for-iphone-the-iphone-port-of-my-favorite Soulver for iPhone, the iPhone port of my favorite calculation scratchpad, was just released. I’ve been beta-testing it for months (and may have bugged them into making it in the first place), and its beta version (“Sums”) was even in my First & 20 profile. Soulver for Mac is always open on all of my computers — home, work, and laptop. It’s a calculator, a numeric scratchpad, and a simple spreadsheet all in one simple, fast, inexpensive program with almost no interface. Nobody ever knows what it is, but everyone who sees me use it always asks, “Hey, what’s that?” And when they see what it does, they instantly download their own demo copy. If you frequently perform calculations throughout the day, you need to try Soulver. If you like it, buy it. And strongly consider the iPhone version as a Calculator replacement. There aren’t any good apps for that January 4, 2010 ∞https://marco.org/2010/01/04/there-arent-any-good-apps-for-that I was recently on a trip and wanted to find a good Euchre game for my iPhone. I bought all of them that looked remotely legitimate. (One advantage of App Store pricing is that you can generally buy an entire category of games for under $10 and delete the ones that suck without feeling too badly ripped off. I only had a few minutes before leaving the data coverage area, so I didn’t have time to do much research.) I figured that I’d find one great Euchre game in the bunch. Nope. They’re all terrible. So I lowered my standards. Euchre isn’t as well-known as most card games. How about Hearts? A ton of people know how to play Hearts. It came with Windows for Workgroups 3.11. There’s one passable Hearts game. Of over 100,000 available iPhone apps, none of them is a playable Euchre game, and only one of them is a tolerable Hearts game. Don’t get discouraged if your app idea is taken. (It probably is.) There’s still room in the App Store for high-quality apps and games to be made in nearly every category."
