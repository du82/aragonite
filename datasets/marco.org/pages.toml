["https://marco.org/2010/11"]
title = "November 2010 – Marco.org"
full_description = "November 1, 2010 ∞https://marco.org/2010/11/01/google-hasnt-yet-provided-any-direction-on Google hasn’t yet provided any direction on Android as a tablet platform, which means that the Tab is held back by lagging application support and software that doesn’t fully take advantage of the extra screen real estate. — Part of the conclusion of Engadget’s Samsung Galaxy Tab review. This is going to plague every Android tablet until Google takes a clear, bold stance by making their own tablet versions of Android’s built-in apps — which may never happen. There’s likely to be a big chicken-and-egg problem: Google probably won’t care to devote any resources to good tablet interfaces for Android software unless one of the hardware tablets takes off, but none of the tablets are likely to take off with half-assed tablet interfaces on its software. It sounds like today’s Galaxy Tab is the Android equivalent of “just a big iPod Touch”, and it’s up to Google — not Samsung — to make it more meaningful. This is the kind of problem that Apple simply doesn’t face in their products: by keeping it all under the same roof and having a ruthless dictator with high standards and great taste at the top, they would never release hardware that begs for software. They’d just hold the hardware back until the software was ready — and not just running, but thoughtfully tailored for the device. Geek Luddites → November 4, 2010 ∞https://marco.org/2010/11/04/geek-luddites Watts Martin’s analysis of the migration toward “app console” hardware: The model we’re moving toward, though, is premised on the idea that computers shouldn’t require routine tech support. Again, look back at game consoles: an Xbox 360 or Playstation 3 is a fully programmable computer with networking capability, offline storage, removable media, the whole shebang, yet all of that is invisible to the user. What file system does a Playstation use and what directories does it put your downloaded games in? The correct answer is: “Who gives a shit?” And if what you do with a computer is spreadsheets and flow charts and word processing documents and slide presentations, web browsing and media watching and game playing, even recording music and editing photographs and writing text adventures, there’s an excellent case to be made that you should not have to give a shit about any of that, either. But right now—no matter what platform you’re using—you kinda do. Not only do I think he’s correct, but this is a great migration for the industry. Think of how many people are so afraid of their PCs that they only do the bare minimum with them and never venture into unknown territory because they’re afraid of “breaking” their computers. How many of them recently bought iPads and have become much more confident and adventurous with usage and applications, since Apple tricked them into thinking that the iPad isn’t a computer?"
