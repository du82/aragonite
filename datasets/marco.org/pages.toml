["https://marco.org/2008/12"]
title = "December 2008 – Marco.org"
full_description = "December 1, 2008 ∞https://marco.org/2008/12/01/beer-regulates-the-bowels-prevents [Beer] regulates the bowels, prevents constipation, and becomes in this way a valuable substitute for vegetables. — United States Sanitary Commission, here (via voodoopuff) I wasn’t going to read it when I first saw it on Tumblr. I didn’t read it before approving it for Give Me Something To Read. But now I’m interested. Our wedding photos → December 1, 2008 ∞https://marco.org/2008/12/01/our-wedding-photos I realized that I never posted these. Oops. I’m a guy, give me a break. Our photographer was Ian Jenkins. (Also, check out the slick Mobile Me photo gallery interface. Generating this was one click with iPhoto. Even as a geek with a lot of surplus web hosting and the ability to create my own basic gallery, this is far better and easier than doing it myself.) MySQL creator: version 5.1 released with “fatal bugs” → December 1, 2008 ∞https://marco.org/2008/12/01/mysql-creator-version-5-1-released-with-fatal-bugs He blames Mårten Mickos, the senior vice president of Sun’s database group and former CEO of MySQL AB. According to Widenius, Mickos no longer treats quality as a priority and unilaterally chose a premature GA release date because “he needs something he can sell.” Suddenly I’m very satisfied with the 5.0 series I’ve been using. MySQL wants you to pay a ton of money for frequent/recent updates, so I’ve been using the excellent and completely legal Proven Scaling mirror to get the most recent stable 5.0.x versions. December 1, 2008 ∞https://marco.org/2008/12/01/the-band-the-night-they-drove-old-dixie The Band — The Night They Drove Old Dixie Down Inspired by Ted’s post of the same song, except that I like this version better. It’s from their famous last concert, The Last Waltz (DVD, Blu-ray, 2-CD set, 4-CD set… but unfortunately not available for download from Amazon MP3 or iTunes). If you like classic rock, you need to see this concert. If you might like classic rock, this will make you like it. If your parents like classic rock, it’s a great gift. What I really love about this is that it’s a bunch of musicians. Not pop stars, not marketing creations, and not “performers”. Just musicians with real talent and real soul. That’s too rare in today’s mainstream music."
