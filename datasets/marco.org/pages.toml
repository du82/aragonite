["https://marco.org/2010/09"]
title = "September 2010 – Marco.org"
full_description = "September 1, 2010 ∞https://marco.org/2010/09/01/googles-adsense-click-solicitation-policy-of Google’s AdSense [click solicitation] policy of Don’t Ask/Don’t Tell is hypocritical, but then so too are most of Google’s other opaque policies. Everything with Google is algorithmic yet the algorithm is never defined. Enforcement, too, follows yet another unpublished algorithm. Google seems open to the idea of its partners being a little bad while never defining exactly how much bad is too much bad. Presumably we’re deemed not smart enough to understand. Google benefits from click fraud so it tolerates it to some degree, with that degree never being fully defined, either. — Cringely: I’m with stupid September 1, 2010 ∞https://marco.org/2010/09/01/tiff-wrote-up-a-great-report-of-our-first Tiff wrote up a great report of our first backpacking trip. I’ve been at a loss of what to say about it. The hostile trail kicked our asses much more than any of us anticipated, and there were some pretty miserable times on the hikes, but the trip overall was such a great time with our friends that we’d definitely do it again… on a more hiker-friendly trail. I feel different after having done this, but I can’t put my finger on why. It’s a good thing. I’ve never pushed myself this hard, physically, and I’ve never been in a situation like this in which the only reasonable way out is to use my own (hurting, blistered) feet to descend 3,000 feet of altitude over five miles of slippery, steep rocks before nightfall. It certainly gave me some perspective. September 1, 2010 ∞https://marco.org/2010/09/01/wow-that-is-what-i-was-looking-for Wow. (That is what I was looking for.) September 1, 2010 ∞https://marco.org/2010/09/01/why-yes-i-was-doing-some-testing Why, yes, I was doing some testing. The Talk Show #6: The Kids Are Gonna Love This → September 1, 2010 ∞https://marco.org/2010/09/01/the-talk-show-6-the-kids-are-gonna-love-this Dan Benjamin and John Gruber discuss the outcome of today’s Apple event. This show is so good that I sponsored it for Instapaper. I like how John interpreted it: “If you’re not using Instapaper, shame on you.”"
