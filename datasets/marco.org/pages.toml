["https://marco.org/2010/04"]
title = "April 2010 – Marco.org"
full_description = "April 1, 2010 ∞https://marco.org/2010/04/01/one-of-the-problems-with-pageview-billing-is-that One of the problems with pageview billing is that it incentivizes publishers to distract you while reading. Every time they distract you and get you to click on something else, they make money. But if you’re simply reading their content, they make less. So they take every possible opportunity to try to get you to read their stories, and then, once you try to do exactly that, they try to get you to abandon what you’re reading before you’ve gotten very far so you can go view something else before abandoning it and continuing the cycle. You’re not readers to them. You’re “eyeballs”. You’re not customers. You’re the product. They really hate when you actually read their content. That’s what they’re communicating by distraction-oriented design: “We don’t respect you, and we’re trying to aggravate you as much as possible, but not quite enough that you’ll stop coming.” April 2, 2010 ∞https://marco.org/2010/04/02/the-recording-surface-of-a-bd-r-disc-a-difficult The recording surface of a BD-R disc, a difficult but immensely satisfying photo to take. I added a Blu-ray burner to my computer this week, now that they’ve come down to sane prices and I actually have a use for one. Our photography (especially now that Tiff’s shooting professionally) generates very large volumes of RAW files from the 5D Mark II, which run about 25 MB each. A single wedding can easily result in 15 GB of photos after picking and postprocessing. Optical media is excellent for long-term archival storage, especially if you migrate everything to a modern format once or twice per decade. But from such large files, even recordable DVDs at 4.7 or 8.5 marketing-GB can’t hold entire events. Fortunately, Blu-ray raised the limits by packing 25 GB into each layer. At the time of writing, the 50 GB, double-layered discs are still a fairly prohibitive $16 each, but the single-layered 25 GB discs are down to $2-3, making them cheaper per GB than high-quality DVD+R discs — and, most significantly, they store five times as much data than DVDs in each case, sleeve, or whatever you’re keeping them in. Installing it into my 2008 Mac Pro was, fortunately, uneventful after I got the required SATA and Molex-to-SATA-power cables (previously). I followed this guide to access the extra SATA ports and this guide to route the cable (steps 1-4 only). An 18” SATA cable with a right-angle connector on the motherboard end was just long enough. Mac software support is better than I expected, but still immature. Pipe Mac BlurayRipper Pro to MakeMKV to HandBrake, and you can convert1 a movie to a reasonably sized .M4V file for your laptop, iPhone, iPad!, or Apple TV. The result looks much better than DVD rips, even when sized down to fit within the Apple TV’s maximum supported resolution of 960x540. But using three different tools reminds me of the bad old days of DVD ripping and wastes a lot of time and space, so I’d love to see Mac BlurayRipper Pro or HandBrake incorporate the full functionality of converting a Blu-ray movie to an Apple-device-friendly H.264 MP4 file. It’s much simpler for data discs, since Finder has native support for Blu-ray burning. It works exactly like CD and DVD burning: insert a blank disc, and you get a popup (“You have inserted a blank BD.”) asking what you’d like to do with it. Make a burn folder, or use the Burn option from a folder’s gear menu in 10.6, and it burns the disc like any other. It’s a bit buggy: my first two discs were coasters. Finder had auto-selected 10X as the burn speed, so I went with it, but it hung2 halfway through burning each disc without explanation. The discs were labeled for 4X, so I went with that on the third try, and it worked. Normally, the disc, drive, and burning software coordinate to agree on the maximum burn speed supported by the media, but somebody’s doing it wrong here. But given that no Mac has ever shipped with a Blu-ray drive, nor has a Blu-ray drive ever been offered as an option, this is still pretty great despite the bugs. Including the “Verifying” reading pass, burning a mostly full 25 GB BD-R disc at 4X takes about 45 minutes. (Wikipedia says the actual burn was probably 24 minutes.) This definitely isn’t for everyone, but if you’re one of the rare geeks who has a decent reason to get one and the knowledge and tolerance to install it and deal with its bugs, it’s a cool new toy. I haven’t tried to just burn the Blu-ray data back to a BD-R disc to play in Blu-ray players, so that may not work. I can’t get past the piracy guilt of that now, as a computing adult. I just like the ability to format-shift as I please. For instance, I recently ripped my entire DVD box set of The Wire, manually setting titles and episode numbers for each episode to form a proper “TV show” in iTunes, so we could watch it on the Apple TV without constantly switching discs, navigating menus, and forgetting which episode we’re on. It’s such a nicer experience that I plan to do the same thing with every TV series that we own on DVD. Now that I know that I can do this with Blu-ray discs as well, I’ll start buying them. Previously, the lack of this ability was holding me back. I don’t want to buy a movie or TV show that I can only play on a physical disc in my PS3. ↩︎ It was fully responsive and was even able to cancel the burn, but the progress bar stopped advancing at around 46% and got stuck for over a half hour each time, despite the drive spinning loudly at full speed the entire time, before I gave up and canceled them. Curiously, nothing relevant was logged to the system console during any part of the burn. ↩︎"
