["https://marco.org/2007/08"]
title = "August 2007 – Marco.org"
full_description = "Mac OS X Leopard receives UNIX 03 certification → August 1, 2007 ∞https://marco.org/2007/08/01/mac-os-x-leopard-receives-unix-03-certification This gets cooler as you get nerdier. August 1, 2007 ∞https://marco.org/2007/08/01/why-would-anyone-outside-of-geeks-like-us-give-a Why would anyone outside of geeks like us give a shit about this? — Scott Heiferman at the Betaworks conference today, on a big concern of modern web development 50 Reasons Why People Aren’t Using Your Website → August 1, 2007 ∞https://marco.org/2007/08/01/50-reasons-why-people-arent-using-your-website Wow. Who knew Scott Heiferman had a fantastic blog? Coding Horror: Yes, but what have you done? → August 1, 2007 ∞https://marco.org/2007/08/01/coding-horror-yes-but-what-have-you-done August 1, 2007 ∞https://marco.org/2007/08/01/i-first-realized-the-worthlessness-of-stuff-when-i I first realized the worthlessness of stuff when I lived in Italy for a year. All I took with me was one large backpack of stuff. The rest of my stuff I left in my landlady’s attic back in the US. And you know what? All I missed were some of the books. By the end of the year I couldn’t even remember what else I had stored in that attic. And yet when I got back I didn’t discard so much as a box of it. Throw away a perfectly good rotary telephone? I might need that one day. — Paul Graham: Stuff InterNetwork and social-network portability → August 1, 2007 ∞https://marco.org/2007/08/01/internetwork-and-social-network-portability Another instance of “Web 2.0 thinkers” in denial (or ignorance) of reality. August 1, 2007 ∞https://marco.org/2007/08/01/brand-is-the-thing-that-lets-me-charge-more-money Brand is the thing that lets me charge more money for the same thing as the guy next to me. — Emil Rensing’s version of a Fred Seibert quote August 1, 2007 ∞https://marco.org/2007/08/01/youve-lost-youve-had-sixteen-years-to-try-and You’ve lost. You’ve had sixteen years to try and build a desktop operating system, and you still can’t get your shit together. Nobody wants your software. It’s not Microsoft’s fault. It’s yours. Because trust me, if you truly developed a kick-ass OS with tens of thousands of drivers and easy installation and reliable performance, you’d be winning. But you’re not. — Fake Steve on desktop Linux (via Cameron)"
