["https://marco.org/2008/07"]
title = "July 2008 – Marco.org"
full_description = "July 1, 2008 ∞https://marco.org/2008/07/01/only-follow-the-people-who-are-adding-to-your-day Only follow the people who are adding to your day. Remove the ones who aren’t. Even if they’re friends. — Rands on Twitter, which I believe applies perfectly to Tumblr as well Sad Trombone beats Tumblr for simplicity → July 1, 2008 ∞https://marco.org/2008/07/01/sad-trombone-beats-tumblr-for-simplicity New Y Combinator startup Sad Trombone launched recently with what might be the simplest blogging platform to date. Yes, it’s even easier to use than Tumblr, which has a cult-following of users who like to post lots of pictures and short messages. Here’s how you use Sad Trombone: push the “play!” button. You’re done. Is this a lot like Tumblr? Yes, although the fast 0-step account registration is a great way to help this spread via mobile devices (you have to create an account on Tumblr’s website first, then you can start emailing to a unique email id). Sad Trombone also has a huge ad and Digg/Del.icio.us spam links, something Tumblr is just starting to roll out to zero users. Another great thing about Sad Trombone - you can press the “play!” button as many times as you want to hear the “sad trombone” clip indefinitely (I wish Tumblr had that feature). If you choose to copy and paste the URL, you can also spam your friends and coworkers with Sad Trombone. The services are otherwise somewhat similar. AT&T announces iPhone 3G plans, 8 a.m. launch time on July 11 → July 1, 2008 ∞https://marco.org/2008/07/01/at-t-announces-iphone-3g-plans-8-a-m-launch-time-on Existing AT&T customers who are not currently eligible for an upgrade discount can purchase iPhone 3G for $399 for the 8GB model or $499 for the 16GB model. Both options require a new two-year service agreement. That’s for people who are in the middle of an AT&T contract (except iPhone owners), like if you just started an AT&T contract with a free RAZR a few months ago. In the future, AT&T will offer a no-contract-required option for $599 (8GB) or $699 (16GB). There we go: that’s the real price of the new iPhone if you need to buy one without a contract subsidy (e.g. if you drop yours in the toilet). That’s comparable to most smartphones. Most dumbphones are in the $300 range."
