title = "May 2007 – Marco.org"
full_description = "May 1, 2007 ∞https://marco.org/2007/05/01/you-have-microsoft-and-at-t-complaining-about You have Microsoft and AT&T complaining … about Google and antitrust. — John Battelle to Google CEO Eric Schmidt Amazon S3 changes its pricing: mostly cheaper May 1, 2007 ∞https://marco.org/2007/05/01/amazon-s3-changes-its-pricing-mostly-cheaper Link Old pricing: $0.20/GB transferred either direction $0.15/GB/month stored No fixed cost per request New pricing, effective June 1: $0.10/GB uploaded to S3 $0.18-$0.13/GB downloaded from S3, getting cheaper as your volume increases $0.00001 per upload request (a penny for 1,000) $0.000001 per download request (a penny for 10,000) This is great news for almost anyone (including Davidville!) using S3 to store medium-size to large files, since it’s cheaper for most transfers and only penalizes very high volumes of tiny transfers (with the per-request fees). But most websites and services use S3 to host images, video, or other large media types that are uploaded once and downloaded a bunch of times. For that, this pricing is FAR cheaper, especially if you can break the 50 TB/month bracket to get $0.13 per additional GB. Mission Accomplished? → May 1, 2007 ∞https://marco.org/2007/05/01/mission-accomplished “Today (May 1) is the fourth anniversary of one of the most dishonest propaganda speeches in modern American history — President Bush did his flight suit strut on the deck of the U.S.S. Abraham Lincoln in front of a banner proclaiming ‘Mission Accomplished.’” (reblogged from azspot, thanks) SPAM.com → May 1, 2007 ∞https://marco.org/2007/05/01/spam-com This is disturbing. (reblogged from sillydoggies, thanks) May 1, 2007 ∞https://marco.org/2007/05/01/crocheted-happy-foods-thanks-serious-eats Crocheted happy foods (thanks Serious Eats) The True Story of Audion → May 1, 2007 ∞https://marco.org/2007/05/01/the-true-story-of-audion A behind-the-scenes retrospective on the Mac equivalent of Winamp, including what happened when iTunes came out. (reblogged from shelbot, thanks)"
