["https://marco.org/2009/10"]
title = "October 2009 – Marco.org"
full_description = "October 1, 2009 ∞https://marco.org/2009/10/01/via-doodlepipski-innocentdestruction-modern (via doodlepipski, innocentdestruction) Modern interaction. October 1, 2009 ∞https://marco.org/2009/10/01/and-yet-this-principle-is-built-into-the-very And yet this principle is built into the very structure of the things they teach you to write in high school. The topic sentence is your thesis, chosen in advance, the supporting paragraphs the blows you strike in the conflict, and the conclusion— uh, what is the conclusion? I was never sure about that in high school. It seemed as if we were just supposed to restate what we said in the first paragraph, but in different enough words that no one could tell. Why bother? — Paul Graham: The Age of the Essay New slogan ideas October 1, 2009 ∞https://marco.org/2009/10/01/new-slogan-ideas The Democratic Party: Depressingly Ineffective.™ The Democratic Party: We Won’t Put Up Much Of A Fight.™ The Democratic Party: Wait, We Won?™ The Democratic Party: We’ll Forgive Our Opponents Repeatedly So You Don’t Have To.™ The Democratic Party: Defeat You Can Believe In.™ The Democratic Party: How Much More Of A Majority And Public Support Do We Need To Get Anything Done?™ October 1, 2009 ∞https://marco.org/2009/10/01/when-people-talk-about-search-being-a-great When people talk about search being a great business model (for, say, Twitter), they should distinguish between search with puchasing intent, which is an incredible business model, and search without purchasing intent, which is a terrible one. — Chris Dixon: Online advertising is all about purchasing intent October 2, 2009 ∞https://marco.org/2009/10/02/cd-makin-i-think-im-in-love-with-your-new CD Makin’ “I think I’m in love… with your new CD recorder.” (via inky in #tumblrs) Lowering the bar October 2, 2009 ∞https://marco.org/2009/10/02/lowering-the-bar Walt Mossberg likes the HTC Hero and calls it “a worthy competitor to the iPhone, the BlackBerry and the Pre”. John Gruber points out: Thank goodness they boogered up the front display with big “HTC” and “Sprint” logos. It retails for $280 but there’s a $100 mail-in rebate, and only ships with 2 GB of built-in storage. That compares really poorly to the $99 no-rebate-necessary 8 GB iPhone. It doesn’t sound like a “worthy competitor to the iPhone” so far. Let’s see what else Mossberg had to say about the Hero: …after a year, Android has less than 10% of the 85,000 apps the iPhone now offers. …the Hero’s price is a bit deceptive. The Hero’s hardware isn’t especially beautiful. It’s a dull grey, noticeably thicker than the iPhone, with a smaller screen and six buttons plus a trackball… It comes with just two gigabytes of memory… One big drawback is battery life. I sometimes found the touch screen unresponsive, requiring multiple pokes at an icon. It sounds like the Hero is a decent phone when compared to other Android phones, but I’m not seeing how this effectively competes with the iPhone. How many iPhone owners or holdouts are going to consider an alternative that costs more, has worse battery life and less storage, is thicker and uglier, doesn’t work very well, and also doesn’t have a physical keyboard? By what standards is this a “worthy competitor”? And what would the tech press say if the next iPhone was uglier, cost more with a deceptive rebate arrangement, and had a flaky touch screen?"
