["https://marco.org/2009/06"]
title = "June 2009 – Marco.org"
full_description = "June 1, 2009 ∞https://marco.org/2009/06/01/its-hard-to-recover-from-that-without-a-reboot It’s hard to recover from that without a reboot. Daring Fireball: Why Palm’s WebOS ‘Media Sync’ iTunes Integration Can’t Be Legit → June 1, 2009 ∞https://marco.org/2009/06/01/daring-fireball-why-palms-webos-media-sync-itunes In terms of legal risk, this move almost makes me think that Palm is trying to provoke Apple into filing a lawsuit. Good points in the rest of the article, but I disagree on this. Palm’s recent rhetoric, publicly calling Apple a monopolist at every chance, hints at a different angle. Palm is calling Apple’s bluff. They’re saying, “Go ahead. Block us. I dare you.” Blocking a competitor in that fashion could be seen as illegal anti-competitive behavior by a monopoly. Sure, it probably wouldn’t hold up in court. But it would be an expensive ride, and Apple would get tons of bad press along the way — right when Palm, the “good guy”, has a nice new alternative product for the angry people to adopt instead of the evil monopolist’s product. I bet, in the short term, that Apple won’t block the Pre’s fake-iPod sync mechanism to avoid the shitstorm that Palm would try to create. Apple’s the top dog now, and every pressured journalist and penny-scraping network-blog “reporter” on the planet wants an excuse to prove that they’re evil. The last thing Apple wants to do is give them — or the Department of Justice — anything to shout the M-word about. Oh yeah, about those Verizon iPhone rumors. June 1, 2009 ∞https://marco.org/2009/06/01/oh-yeah-about-those-verizon-iphone-rumors I don’t see it happening. Not until LTE, and we’re nowhere near that. In trying to trace the source, the most direct statement I can find is from <a href=http://wiki.twit.tv/wiki/MacBreak_Weekly_142”>Scott Bourne on MacBreak Weekly #142. It sounds like the Verizon marketing department has been telling some untrustworthy employees something along the lines of, “We’ll have an iPhone in June.” He repeated that wording a number of times, quoting his source verbatim, so I’m confident that the wording is probably correct. And the wording is very important: “We’ll have an iPhone in June.” An iPhone. Not the iPhone. That’s a critical article. Now, if this is taken literally, it sounds like Apple will launch a separate iPhone model (as would be necessary) for Verizon in June. This contradicts Tim Cook’s recent statements, and a different explanation for Apple to interact with Verizon — an LTE iPhone, once the network’s deployed in at least another few years — is better corroborated by recent statements and implications from both parties. Another explanation for this rumor is that Verizon’s marketing department is saying something along the lines of, “We’ll have an iPhone[-equivalent] in June.” In other words, they’re going to have a hot new smartphone this summer, like they do every summer, and they’re going to market the hell out of it as an iPhone replacement or killer, like they do every summer. Given that the source is supposedly the marketing department, and Verizon is still deluded to the core about the quality of their devices, and this is a much simpler explanation, and it won’t contradict common sense or recent statements from either company, which is more likely?"
