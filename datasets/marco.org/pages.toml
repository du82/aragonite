["https://marco.org/2009/07"]
title = "July 2009 – Marco.org"
full_description = "July 1, 2009 ∞https://marco.org/2009/07/01/im-relieved-that-the-majority-of-technological I’m relieved that the majority of technological advancement happened before I was born, as I can’t imagine having to use such basic equipment every day. — Giving up my iPod for a Walkman (via Instapaper) July 1, 2009 ∞https://marco.org/2009/07/01/my-answer-to-that-is-that-daring-fireball-is My answer to that is that Daring Fireball is decidedly not free. It’s simply a question of who gets charged. Readers don’t, but sponsors and advertisers do. What makes it work so well (so far) is that this makes everyone happy. I’m earning a nice salary. Readers get to read my writing in exchange for a small portion of their attention which I direct toward ads. And sponsors and advertisers are happy to pay a fair price to reach an audience of good-looking, intelligent readers such as yourself. But there’s nothing free about it. — John Gruber (via chrisbowler) July 1, 2009 ∞https://marco.org/2009/07/01/hey-guys-i-thought-my-photo-was-boring-so-i Hey guys, I thought my photo was boring so I spruced it up a bit. Now it’s hip internet art! What do you think? Will this earn me 1000 notes and a bunch of Flickr group invitations? July 2, 2009 ∞https://marco.org/2009/07/02/steve-rubel-interviewed-me-about-instapaper-today Steve Rubel interviewed me about Instapaper today after an insightful discussion about Tumblr, publishing, and communities. July 2, 2009 ∞https://marco.org/2009/07/02/normally-id-take-the-extra-30-seconds-to-pixelate Normally I’d take the extra 30 seconds to pixelate someone’s last name and personal email address, but I don’t think someone who would send this email to a stranger about a free web service will mind. Most of the emails I get are very nice, but occasionally one slips through that makes me question what, exactly, convinced someone that writing and sending it would be productive. (For whatever it’s worth, here are my browser stats from the month before I started displaying the not-supporting-IE message.)"
