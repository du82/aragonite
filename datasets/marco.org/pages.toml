["https://marco.org/2009/05"]
title = "May 2009 – Marco.org"
full_description = "May 1, 2009 ∞https://marco.org/2009/05/01/i-find-mac-os-x-to-be-the-least-frustrating-of-the I find Mac OS X to be the least frustrating of the currently available options, but the buck certainly doesn’t stop there. We have miles and miles to go in terms of making computing better. I want my socks blown off, and I don’t care whether it’s Apple, Microsoft, Google, or the open source movement that does it, as long as someone does. — Steven Frank May 1, 2009 ∞https://marco.org/2009/05/01/vimeo-usually-makes-good-policy-decisions-but Vimeo usually makes good policy decisions. But their complete prohibition of anything that can remotely be considered for commercial purposes, even with a paid Plus account, doesn’t strike me as particularly necessary. I really don’t see why this is the right move. I need to find somewhere else to host the Instapaper demo video. (We should move the Tumblr v5 intro video, too. I hope we’re allowed to keep the Vimeo API integration…) Where should I go? Well, YouTube has HD now… I just hate to go without all of the niceties that Vimeo offers, especially their excellent player interface and transcoding quality, because Instapaper Pro costs money and Tumblr is incorporated. Should I just install the JW player and host the video directly in the most mediocre way possible, or is there somewhere else that’s good at hosting commercially-natured embeddable product-demo videos with a tastefully designed player? May 1, 2009 ∞https://marco.org/2009/05/01/yes-he-stole-65-billion-from-some-already-quite Yes, he stole $65 billion from some already quite wealthy people. I know that’s upsetting to them because rich guys like Bernie are not supposed to be stealing from their own kind. Crime, thievery, looting — that’s what happens on the other side of town. The rules of the money game on Park Avenue and Wall Street are comprised of things like charging the public 29% credit card interest, tricking people into taking out a second mortgage they can’t afford, and concocting a student loan system that has graduates in hock for the next 20 years. Now that’s smart business! And it’s legal. That’s where Bernie went wrong — his scheming, his trickery was an outrage both because it was illegal and because he preyed on his side of the tracks. Had Mr. Madoff just followed the example of his fellow top one-percenters, there were many ways he could have legally multiplied his wealth many times over. Here’s how it’s done. First, threaten your workers that you’ll move their jobs offshore if they don’t agree to reduce their pay and benefits. Then move those jobs offshore. Then place that income on the shores of the Cayman Islands and pay no taxes. Don’t put the money back into your company. Put it into your pocket and the pockets of your shareholders. There! Done! Legal! — Michael Moore (via azspot, read the whole article)"
