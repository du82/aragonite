["https://marco.org/2009/01"]
title = "January 2009 – Marco.org"
full_description = "The code that allegedly broke the Zune → January 1, 2009 ∞https://marco.org/2009/01/01/the-code-that-allegedly-broke-the-zune Via jstn. while (days > 365) { if (IsLeapYear(year)) { if (days > 366) { days -= 366; year += 1; } } else { days -= 365; year += 1; } } Out of curiosity, why was this being rewritten by Freescale or Microsoft at all? This has been a solved problem for a very long time. (Also, this is very ugly C style in many places. I expected better from Microsoft.) January 1, 2009 ∞https://marco.org/2009/01/01/larchmont-morning-rush-hour Larchmont, morning rush hour. January 1, 2009 ∞https://marco.org/2009/01/01/park-avenue-morning-rush-hour Park Avenue, morning rush hour. Game Nights January 1, 2009 ∞https://marco.org/2009/01/01/game-nights Tiff: This year, I really want to start a monthly game night as a potential on-going open-to-all meet-up event. I’m thinking different board games, teams, pizza, beer, fun, competition. Think about it. Anyone want to join? Games could include: Puerto Rico Settlers of Catan Rock Band 1 & 2 Any game made for the Xbox 360 or Wii Total Annihilation or Moonbase Commander? (hey, I can dream) January 1, 2009 ∞https://marco.org/2009/01/01/our-office-yesterday-hd-december-31 Our office yesterday (HD): December 31, 2008. Starring, in order of appearance: Marco Arment (me) Jacob Bijani David Karp Please excuse my poor video shooting skills, shaky hands, and editing. Shot with the 5D Mark II and the EF 24-105 f/4 L IS, but stabilization was turned off because I forgot to turn it back on after the tripod shots. Overdraft “protection” January 1, 2009 ∞https://marco.org/2009/01/01/overdraft-protection Daniel Jalkut: Annoyed that Bank of America offers free overdraft protection service, but I have to sign up. 3 bankcard purchases each cost me extra $35. I don’t think you’re understanding it properly. It’s a very misleading name. Overdraft protection lets you overdraw your account, through checks or check-card purchases, and still lets the transaction clear to the recipient. The bank just effectively issues you a temporary loan for the difference and lets the transaction through normally instead of refusing it. So it’s unlikely that you’ll ever bounce a check or get your card refused, therefore saving you from ramifications of that from the money’s recipients. That’s what you’re being “protected” from. By “free”, they mean that they aren’t charging you interest on these temporary loans. But the bank still charges you fees if your balance is less than $0. That’s considered a separate risk that you’re not being protected from. So if you overdraw, you’ll still pay that wonderful $35-per-transaction fee. Nice, huh? You really have to give them credit for this one. This took balls. Fortunately, you can go into the branch and easily negotiate those fees away if you’ve only done it one or two times and you’re otherwise in good standing. I learned this lesson a few years ago and have done as much as possible on my American Express card (Blue Cash). I only use the Bank of America check-card where American Express isn’t accepted."
