["https://marco.org/2007/12"]
title = "December 2007 – Marco.org"
full_description = "December 1, 2007 ∞https://marco.org/2007/12/01/toldorknown-new-rochelle-do-you-know-rob-and toldorknown: “New Rochelle?!! Do you know Rob and Laura Petrie?” Nope, although that’s pretty cool. I don’t live in New Rochelle, actually - that’s just where the management company’s office is. I live here. The Secret to Raising Smart Kids → December 1, 2007 ∞https://marco.org/2007/12/01/the-secret-to-raising-smart-kids Thanks, dailymeh. A brilliant student, Jonathan sailed through grade school. He completed his assignments easily and routinely earned As. Jonathan puzzled over why some of his classmates struggled, and his parents told him he had a special gift. In the seventh grade, however, Jonathan suddenly lost interest in school, refusing to do homework or study for tests. As a consequence, his grades plummeted. His parents tried to boost their son’s confidence by assuring him that he was very smart. But their attempts failed to motivate Jonathan. nostrich: Sounds exactly like my experience in school. Me too, except that I was able to figure out the tests pretty well until college, where I was able to barely scrape by with around a C average. Before that, I went to an incredibly easy Catholic elementary school where I was the only smart person (which actually sucks), then a quality-imbalanced high school that had great academic strengths in all of the subjects and honors levels I wasn’t taking. I can’t study, pay attention to anything I don’t care about, or motivate myself to do something I don’t think is worth doing. December 1, 2007 ∞https://marco.org/2007/12/01/the-brand-name-version-of-the-generic-version-of The brand-name version of the generic version of the brand-name product December 1, 2007 ∞https://marco.org/2007/12/01/melting-chocolate-bunnies-thanks Melting Chocolate Bunnies (thanks, cultrvultr). WOW. Incredible. ben-well-i-can-always-make-up-something-at-least December 1, 2007 ∞https://marco.org/2007/12/01/ben-well-i-can-always-make-up-something-at-least"
