title = "There is an uncomfortable subtext to the Agile debate. It is usually positioned as… – Marco.org"
full_description = "January 3, 2007 ∞https://marco.org/2007/01/03/there-is-an-uncomfortable-subtext-to-the-agile There is an uncomfortable subtext to the Agile debate. It is usually positioned as developer-friendly, letting us work faster without having to endure endless management meetings and design discussions. From the management perspective, however, Agile is sold as a way to make developers interchangeable. That is the holy grail of IT management for big organizations: How to achieve consistent, good (if not great) results independent of the talent of the underlying team. — Mike-O-Matic, who I admire for his consistent and shameless self-promotion on the Joel Reddit"
