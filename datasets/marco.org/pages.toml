full_description = "April 1, 2008 ∞https://marco.org/2008/04/01/its-from-a-blog-i-get-in-the-mail It’s from a blog I get in the mail. — Tiff, referring to Apple Mail’s RSS feature, right after I commend her for getting into blog-reading and RSS. April 1, 2008 ∞https://marco.org/2008/04/01/this-took-me-2-hours-im-so-proud-its-so This took me 2 hours. I’m so proud! It’s so slick. Just wait until you see it on your iPhone. “Stuff White People Like” bought by Target → April 1, 2008 ∞https://marco.org/2008/04/01/stuff-white-people-like-bought-by-target Starting April 1st, 2008 the nation’s second largest retailer will use the site as a promotional tool. “We are thrilled at the opportunity,” says Ennis Blentic, Senior VP of Marketing at Target. “It’s a great chance for us to connect with some of our most valued customers and let them know about our great product line for 2008 and beyond.” April 1, 2008 ∞https://marco.org/2008/04/01/improv-everywhere-launches-new-site-design Improv Everywhere launches new site design 3G iPhone released today! → April 1, 2008 ∞https://marco.org/2008/04/01/3g-iphone-released-today In typical “release Tuesday” fashion, Steve Jobs unveiled the next generation iPhone this morning in Cupertino, CA in front of a small invite-only audience. As expected the new iPhone runs on AT&T’s 3G network, has an 8 megapixel camera on the front with video capture capabilities, and has an integrated Twitter client. Steve Jobs’ “one more thing” was a new application from Apple called iGetShitDone (iGSD). And here I was, predicting that we wouldn’t see it until June. Never underestimate Apple! April 1, 2008 ∞https://marco.org/2008/04/01/after-a-bit-of-a-slow-period-the-daily-puppy-has After a bit of a slow period, The Daily Puppy has redeemed itself. April 1, 2008 ∞https://marco.org/2008/04/01/id-hate-to-have-april-1-as-my-birthday-everyone I’d hate to have April 1 as my birthday. Everyone would always pretend to forget or that they didn’t buy me presents, and then suddenly be all APRIL FOOLS HAPPY BIRTHDAY. And then I’d kill them. — Courtney Johnston"
