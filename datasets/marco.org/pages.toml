full_description = "September 1, 2007 ∞https://marco.org/2007/09/01/tiff-hates-the-daily-puppy Tiff hates The Daily Puppy. September 1, 2007 ∞https://marco.org/2007/09/01/stairbags-a-great-invention-idea Stairbags - A great invention idea. September 1, 2007 ∞https://marco.org/2007/09/01/after-the-influx-from-new-socks-day-my-sock After the influx from New Socks Day, my sock drawer has a bit of a capacity problem. (Photo by Tiff) I’m Not Sure NBC Could Have Screwed This iTunes Thing Up Any Worse → September 2, 2007 ∞https://marco.org/2007/09/02/im-not-sure-nbc-could-have-screwed-this-itunes-thing Quick Daring Fireball article. Agreed - NBC would have been far better off just staying quiet. Daily Kos: “We Are Going To Hit Iran. Bigtime” → September 2, 2007 ∞https://marco.org/2007/09/02/daily-kos-we-are-going-to-hit-iran-bigtime I have a friend who is an LSO on a carrier attack group that is planning and staging a strike group deployment into the Gulf of Hormuz. (LSO: Landing Signal Officer- she directs carrier aircraft while landing) She told me we are going to attack Iran. She said that all the Air Operation Planning and Asset Tasking are finished. That means that all the targets have been chosen, prioritized, and tasked to specific aircraft, bases, carriers, missile cruisers and so forth.I asked her why she is telling me this.Her answer was really amazing. (thanks John Brissenden) September 2, 2007 ∞https://marco.org/2007/09/02/our-apartments-floors-are-really-uneven-near-the Our apartment’s floors are really uneven near the edges. (Featuring Tiff and an old TV cart I got at Wal-Mart for $20 in college) IKEA loves us September 2, 2007 ∞https://marco.org/2007/09/02/ikea-loves-us In a single 1-bedroom apartment, we have: 5 bookcases (assorted members of the BILLY series) 3 desks (two GALANTs, one MIKAEL) 4 lamps (two ÅRSTIDs, two NOTs) dresser (MALM) dining table with 4 chairs (JOKKMOKK) coffee table (discontinued series, silver metal legs with glass top) 2 side tables (same series as the coffee table) A bunch of accessores: boxes, cable managers, etc. We’ve followed a lot of their instructions over the years."
