["https://marco.org/2007/03"]
title = "March 2007 – Marco.org"
full_description = "March 4, 2007 ∞https://marco.org/2007/03/04/enderle-and-khanna-are-arguing-that-the-iphone-is Enderle and Khanna are arguing that the iPhone is insecure because it doesn’t (at least yet) allow for third-party software, which means you can’t install third-party software designed to let you securely install additional third-party software. — Daring Fireball: More Crap From Rob Enderle on the iPhone March 5, 2007 ∞https://marco.org/2007/03/05/object-oriented-programming-generates-a-lot-of Object-oriented programming generates a lot of what looks like work. — Paul Graham March 6, 2007 ∞https://marco.org/2007/03/06/tumblrs-latest-feature-mobile-phone-uploads Tumblr’s latest feature: Mobile phone uploads! Now cellphone cameras suck slightly less. March 6, 2007 ∞https://marco.org/2007/03/06/tumblr-makes-what-is-entertaining-and-creative-in Tumblr makes what is entertaining and creative in blogging frictionless and either does away with or automates the less engaging parts of the process. — baldur in the comments on the Davidville Blog It’s a sad day in Columbus: Wendy’s closes its original restaurant → March 7, 2007 ∞https://marco.org/2007/03/07/its-a-sad-day-in-columbus-wendys-closes-its-original Snap Preview on every Wordpress blog… March 7, 2007 ∞https://marco.org/2007/03/07/snap-preview-on-every-wordpress-blog Does anyone think this is a good idea? What the hell are you people thinking? March 7, 2007 ∞https://marco.org/2007/03/07/somehow-i-dont-think-the-ipod-hifi-is-backlogged Somehow, I don’t think the iPod HiFi is backlogged because of demand. — New Apple products soon? Signs point to “Yes” March 7, 2007 ∞https://marco.org/2007/03/07/cocoamysqls-gui-had-an-interesting-interpretation CocoaMySQL’s GUI had an interesting interpretation of this MySQL command. March 7, 2007 ∞https://marco.org/2007/03/07/j4cbo-in-sa-forums-i-am-a-font j4cbo in SA Forums: I am a font The holy grail of PHP XML processing! March 8, 2007 ∞https://marco.org/2007/03/08/the-holy-grail-of-php-xml-processing libxml_use_internal_errors(true) This single function, added in PHP 5.1.0, will save me so much grief, it’s beyond words. Ever use $dom->loadHTML($crappy_html_code) to get a website’s content into an XML DOM for parsing or other processing? Normally, every unescaped ampersand and misplaced P tag would generate a PHP warning, just like xsltproc, which made it extremely difficult to use these functions without having a bunch of special-case error-handling routines to ignore these pointless warnings. Now, we can turn those stupid warnings off, and can safely call ->loadHTML() on anything and have it quietly return false if it has so much trouble that it actually matters."
