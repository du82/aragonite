["https://marco.org/2009/09"]
title = "September 2009 – Marco.org"
full_description = "September 1, 2009 ∞https://marco.org/2009/09/01/interestingly-enough-we-discovered-that-most Interestingly enough, we discovered that most people who carry a Windows phone don’t realize it’s running Windows Mobile. We also heard from many people considering their very first smartphone purchase that they’d very strongly consider a phone running Windows because it’s a brand they know and trust. You’ll see us try to simplify our branding so it’s easier for people to know when they’re carrying a Windows phone and easier to find them in stores. — The Windows Blog September 1, 2009 ∞https://marco.org/2009/09/01/inbox-zero-s-a-term-that-geeks-use-so-we-can [Inbox Zero]’s a term that geeks use so we can convince ourselves that we’re winning the battle against communication overload. We’re not winning. We’re just selectively forgetting certain emails, half-responding to others, and if worse comes to worse, switching communication platforms. That’s not winning, that’s running. — MG Siegler I don’t think this is a problem with the concept of Inbox Zero and other task-management philosophies. Rather, it’s the most common failure case, and it’s a failure that I haven’t been able to overcome for email no matter which strategy or methodology I’ve employed. I hereby admit defeat. I’m Marco, and despite my best intentions, I will probably never have the time to respond to your email. September 2, 2009 ∞https://marco.org/2009/09/02/it-is-not-your-facebook-profile-it-is It is not ‘your’ Facebook profile. It is Facebook’s profile about you. — The New York Times: Facebook Exodus (via Katie Schenk) September 3, 2009 ∞https://marco.org/2009/09/03/what-bothers-me-most-about-snow-leopard-is-this What bothers me most about Snow Leopard is this simple indicator that shows that I’ve just moved to a different virtual desktop with Spaces using the convenient Ctrl+arrow keyboard shortcut. Not that there’s anything wrong with the indicator itself, but because its continued presence means that I’m about to be mildly inconvenienced. A significant portion of the times that I switch Spaces with the keyboard, this icon gets stuck on screen and it won’t release its keyboard capture. Other keyboard commands do absolutely nothing until I launch Activity Monitor (entirely using the mouse, which is incredibly frustrating) and force-quit the Dock process. This was one of two annoying bugs in the last developer-preview build before Snow Leopard’s release. They fixed the other one, but this remains."
