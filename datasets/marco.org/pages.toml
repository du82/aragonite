["https://marco.org/2009/12"]
title = "December 2009 – Marco.org"
full_description = "December 1, 2009 ∞https://marco.org/2009/12/01/its-2009-and-i-just-aimed-a-tv-antenna-this-is It’s 2009 and I just aimed a TV antenna. This is the only position that gives a useful level of reception. December 2, 2009 ∞https://marco.org/2009/12/02/simple-budget-question-should-we-now-believe-that Simple budget question: Should we now believe that escalating the Afghanistan War at the same annual cost of universal health care will save more than 45,000 Americans a year (i.e. the number of Americans who die every year for lack of health insurance)? — David Sirota: Some Simple Questions After Obama’s Afghanistan War Speech (the whole list is good) December 2, 2009 ∞https://marco.org/2009/12/02/im-proud-to-say-that-i-live-in-new-york-i-love I’m proud to say that I live in New York. I love it here, and wouldn’t want to live anywhere else. But that’s despite the state government, not because of it. The New York state government has always been dysfunctional and ineffective. This is tragic, but unsurprising. I don’t think anyone familiar with the New York legislature expected it to pass. December 3, 2009 ∞https://marco.org/2009/12/03/one-of-the-niceties-of-lightroom-3-and-maybe One of the niceties of Lightroom 3 (and maybe older versions, I don’t know): a Dock-icon progress bar to indicate the progress of long import/export operations and an optional sound alert (ding!) when they’re done. After using the Lightroom 3 beta for a few weeks, I’m sold. It’s much faster, more stable (even in beta), more polished, and more robust than Aperture. Apple should consider its ass thoroughly kicked on this one. December 3, 2009 ∞https://marco.org/2009/12/03/keep-this-checked-my-entire-message-search Keep this checked. My “Entire Message” search in Mail.app hasn’t worked for a long time, always just inexplicably returning zero results for any search. Today it was finally causing enough of an inconvenience that I searched for a fix. I learned that for “Entire Message” searches, Mail just uses Spotlight on the message files. So if you leave this box unchecked* in Spotlight’s preferences, “Entire Message” searches simply won’t work, and neither Mail nor Spotlight felt it necessary to tell me this. (You also need to ensure that ~/Library/Mail isn’t excluded from settings in that Privacy tab.) I was impatient, so after fixing that setting, I told Spotlight to manually import the messages immediately: mdimport ~/Library/Mail As soon as that completed, “Entire Message” searches started working. * I had unchecked it because mail messages always cluttered up the results when I was simply trying to launch an app or find a document."
