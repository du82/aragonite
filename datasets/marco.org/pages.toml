["https://marco.org/2007/07"]
title = "July 2007 – Marco.org"
full_description = "Universal Music threatens iTMS pullout → July 2, 2007 ∞https://marco.org/2007/07/02/universal-music-threatens-itms-pullout “No! We don’t want to sell our music legally online for competitive prices on reasonable terms!” July 2, 2007 ∞https://marco.org/2007/07/02/95-of-buyers-purchased-the-8gb-model 95% of buyers purchased the 8GB model — 500,000 iPhones sold so far (told you so) Psst, Michael Moore: Health costs screw business, too. → July 2, 2007 ∞https://marco.org/2007/07/02/psst-michael-moore-health-costs-screw-business-too Slate. How to get an iPhone without a service contract → July 2, 2007 ∞https://marco.org/2007/07/02/how-to-get-an-iphone-without-a-service-contract Block AT&T from accessing your credit report and sign up for a month-to-month GoPhone plan. July 2, 2007 ∞https://marco.org/2007/07/02/apple-on-their-website-have-a-video-of-someone Apple, on their website, have a video of someone rapidly typing on the iPhone, with a speed approaching that of a touch typist. I found myself achieving the speed of a salmon with arthritis. — Tog Coding Horror: Avoiding Walled Gardens on the Internet → July 2, 2007 ∞https://marco.org/2007/07/02/coding-horror-avoiding-walled-gardens-on-the-internet iPhone parts cost about $220 → July 2, 2007 ∞https://marco.org/2007/07/02/iphone-parts-cost-about-220 This is leading the internet to speculate that Apple is pocketing the rest as profit. But that’s nowhere near the case. In reality, Apple is using it to begin to recoup the massive cost of developing the iPhone’s software. July 2, 2007 ∞https://marco.org/2007/07/02/tiff-got-me-a-hat-so-i-stop-sunburning-my-head Tiff got me a hat so I stop sunburning my head. Bush Spares Libby 30-Month Jail Term → July 2, 2007 ∞https://marco.org/2007/07/02/bush-spares-libby-30-month-jail-term One criminal gives another a free pass. Apple imitation July 2, 2007 ∞https://marco.org/2007/07/02/apple-imitation It’s hilarious to see awful consumer electronics manufacturers attempt to copy Apple products, completely missing the point. “The iPhone has a touchscreen? We can do that! Here’s a touchscreen app launcher for Windows Mobile or the God-forsaken Verizon/LG/Motorola OS! And here’s a bunch of extra features and buttons, because more is better! It’s just like the iPhone!” Apple is a software company. The hardware just packages up the software nicely and gives it some pretty inputs and outputs. The prettiness is partly functional and partly for marketing. But copying the prettiness without copying the immense attention to detail and interface quality is asinine. It’s like when Windows “power users” hack the XP themes to make it look like OS X, then they tell themselves (and the internet) that it’s just as good and now they don’t need to buy a Mac. Touchscreens, multi-touch, flick-scrolling, and anything else they copy still can’t make a Motorola or LG phone as usable as an iPhone. If this sounds ridiculous now, just ask Creative, Sony, Microsoft, Panasonic, Philips, iriver, Cowon, Meizu, SanDisk, TrekStor, Archos, Rio, Samsung, and Toshiba how well their portable audio players are doing."
