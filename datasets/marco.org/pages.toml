["https://marco.org/2008/06"]
title = "June 2008 – Marco.org"
full_description = "June 1, 2008 ∞https://marco.org/2008/06/01/and-thats-why-the-air-conditioning-is-on And that’s why the air conditioning is on. June 1, 2008 ∞https://marco.org/2008/06/01/orangesunshine-shine-trey-anastasio-and-the orangesunshine: Shine - Trey Anastasio and The Undectet Trey is offering a free mp3 download from his forthcoming album Original Boardwalk Style. You can order the entire album from Trey’s online store. CD ordered. June 1, 2008 ∞https://marco.org/2008/06/01/gender-by-kristen-caston-via-ego-technique Gender, by Kristen Caston (via ego-technique) Review: Sex And The City movie June 1, 2008 ∞https://marco.org/2008/06/01/review-sex-and-the-city-movie Absolutely, surprisingly, stunningly terrible. I cannot believe how bad this movie was. And I liked the show. I bought all of the DVDs for Tiff and we watched the entire series together. Some of the many flaws: WAY TOO LONG. 2 hours, 20 minutes. We got bored at 45 minutes. It didn’t get any better after that. Nothing really happens. There are no surprises. There’s no character change. Just… nothing. It’s a series of fluffy, meaningless girls-night-out montages (or events that should have been summarized by montages). What’s left of the “plot” is predictable and dull. The acting is bad. The writing is awful. Carrie and Miranda look ghoulish and unnatural with the amount of makeup caked onto both of them to make them look like they did 8 years ago. It’s not well-made. It looked pretty low-budget. There are a handful of stupid cheap-laugh devices thrown in and beaten to death. Dog-humping, pants-shitting… I’m not kidding. Did I mention how LONG it was? Do not see this movie. I don’t care how much you liked the show. Absolutely do not see this movie. June 1, 2008 ∞https://marco.org/2008/06/01/im-now-officially-launching-give-me-something-to I’m now officially launching Give Me Something To Read: an Instapaper feature, and a standalone site, featuring some popular articles every weekday that Instapaper users saved for reading later. These articles are hand-picked for interesting medium- and long-form reading, like good magazine articles. They’re also usually optimized for mobile reading. Like saved articles on Instapaper, the Text button on each article shows a mobile-optimized, text-only version. While it works on most mobile devices, it’s especially designed for ideal font rendering and readability on the iPhone. When you’re logged into Instapaper, each article gets a 1-click Read Later button (as pictured). But you don’t need to be an Instapaper member to use the other functionality. Give Me Something To Read is a Tumblr-powered tumblelog, so you can choose to follow it with Tumblr, or you can subscribe to its RSS feed. I’d love feedback."
