title = "February 2008 – Marco.org"
full_description = "Democratize Democracy: Give to a Campaign → February 1, 2008 ∞https://marco.org/2008/02/01/democratize-democracy-give-to-a-campaign Dan: These are my thoughts on why, if you’re in the U.S., you should not only vote but give (something) to a campaign. The basic argument is that the more money raised in small donations ($25, $10, $5) the less damage money will do to politics. As anybody who’s read this tumblelog in the past few months has notices, I’m a big fan of Obama’s—and if you’re still reading, there’s a better than even chance that you are as well. Ad buys in some of the Super Tuesday states are a expensive—so if you’ve been quietly supportive for a while and are willing to donate a few dollars it could go a long way. Think of it as buying your candidate a cup of coffee—or maybe a well deserved drink. Microsoft offers $44.6B for Yahoo → February 1, 2008 ∞https://marco.org/2008/02/01/microsoft-offers-44-6b-for-yahoo What a miserable idea: let’s combine two bloated, mediocre, ineffective web companies in an effort to beat a much more successful one. If anything shows that Microsoft lacks direction and vision, this is it. I’ve seen better focus and organization from AOL. Lost seasons 4-5 == The Matrix 2-3 February 1, 2008 ∞https://marco.org/2008/02/01/lost-seasons-4-5-the-matrix-2-3 Having just watched the season 4 premiere of Lost, I think I’m going to regret the show ever crossing this point. Motivated by a Tax, Irish Spurn Plastic Bags → February 2, 2008 ∞https://marco.org/2008/02/02/motivated-by-a-tax-irish-spurn-plastic-bags “In 2002, Ireland passed a tax on plastic bags; customers who want them must now pay 33 cents per bag at the register. There was an advertising awareness campaign. And then something happened that was bigger than the sum of these parts. Within weeks, plastic bag use dropped 94 percent. Within a year, nearly everyone had bought reusable cloth bags, keeping them in offices and in the backs of cars. Plastic bags were not outlawed, but carrying them became socially unacceptable — on a par with wearing a fur coat or not cleaning up after one’s dog.” Via my sister, Christine: I was living in Ireland in 2002, and I can attest: It literally was within weeks that plastic bags disappeared from the cityscapes. Then, it was only a 5-cent charge per bag. It really was a beautiful and inspiring thing to witness. Tiff and I stopped using them a few months back and switched to canvas. I don’t know anyone who made this switch and regretted it: in addition to the environmental benefits, you can just carry so much more in canvas, and much more comfortably. The hard part is remembering to bring the canvas bags with you, but we devised a pretty good system for that, too: whenever we forgot to bring them, we had to buy more. So now we have about 8 of them and have gotten pretty good at remembering to bring a few with us. (Tip: keep them in the car.)"
