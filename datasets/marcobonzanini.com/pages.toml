full_description = "About Me I’m a Data Science consultant, corporate trainer and author based in London, UK. I specialise in the Python for Data Science (PyData) software stack.With 20 years of experience in the tech industry, I provide consulting, coaching and training services in the data science space through my company Bonzanini Consulting Ltd.Backed by a PhD in Information Retrieval, I specialise in text analytics applications, and I’ve enjoyed working on a broad range of information management and data science projects, including flight safety, social media data, behavioural data, biomedical data and recruitment data.I’m the author of “Mastering Social Media Mining with Python“, “Data Analysis with Python” and “Practical Python Data Science Techniques“, published by Packt Publishing.I currently serve as organiser of the PyData London meetup and conference series (largest Python user group in Europe) and I regularly speak at international tech events.Contact Please get in touch to discuss how I can help your company with any of the following services.– Training: I have successfully run a broad range of corporate training courses, in person and remote, spanning from Python programming foundations to specialised Data Analytics and Machine Learning classes. The training curricula I currently curate are listed on http://bonzaniniconsulting.com and I’m happy to discuss any customisation your team might need.– Consulting: I offer expert consulting for projects in the Data Science space, helping your team to develop new Intellectual Property, turning your vision of the data products into reality.– Coaching: when senior data science staff isn’t available, I collaborate with teams of software engineers, data analysts and data scientists, providing Data Science leadership in order to accellerate and de-risk the delivery of your data projects.– Speaking: I deliver Data Science presentations and keynotes at private and public tech events, for technical and non-technical a