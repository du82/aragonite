full_description = "My Top 10 Reads of the Week October 06, 2022 1 minute read Welcome to my weekly digest! Here you will find some of the best articles, posts and projects I’ve found this week: PostgreSQL inside a web browser is possible thanks to WASM and the teams at Supabase and Snaplet. It’s open source too! Maigret automates dossier collection starting from a username only. Reddit database has two tables (dated 2010). How To Legally Own Another Person by N.N. Taleb. What are the Main Differences Between Douyin vs Tiktok? If you haven’t heard about Douyin before, this might interest you. Open Prompts contains lots of prompts used to generate images with stable diffusion-like models. Bonus: it’s open data. Introduction to Lockfree Algorithms Backblaze Drive Stats for Q2 2022 for some cool data about drive failure. Kialo helps you explore debates about all sorts of topics. “The last remaining member of an uncontacted indigenous group in Brazil has died, officials say.” Tags: Algorithms, Databases, Machine Learning, Security, Society Categories: News Updated: October 06, 2022 Previous Next Joining the Now Page movement February 25, 2025 1 minute read I just added a /now page to my blog. Here’s why, what’s on it, and why you might want one too. PostgreSQL Fixtures Editor February 24, 2025 2 minute read I built a VS Code extension to make editing PostgreSQL fixtures easier. Here’s why I made it, how it works, and how you can use it. Automating Callbacks to Async/Await Migrations for Mocha Tests: Part 2 October 20, 2023 12 minute read In this second part we will go deeper into AST editing techniques and show how to automatically migrate tests that use the supertest NPM library. Automating Callbacks to Async/Await Migrations for Mocha Tests: Part 1 October 14, 2023 16 minute read Doing this migration in a large codebase can be tedious but necessary. The article will show you how to automate this task using JS code transformation tools."
