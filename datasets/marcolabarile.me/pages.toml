full_description = "Python Quickstart for Experienced Engineers January 16, 2023 1 minute read Python is not only a language, some may consider it a way of life. Its rich ecosystem of libraries and its wide range of applications can make it difficult to just get started and familiarize with it. So I’ve done some reasearch for you, an experienced programmer looking to get into Python. Let’s dive in: Use pyenv to manage Python installations. Install it then install a Python 3.* version using its CLI. Download and install PyCharm. Follow the official Python 3 tutorial. Code a simple but fun project with Python. Some ideas: If you’re into NLP, build a spelling corrector. If you’re looking for CRUD Web APIs, go for the FastAPI tutorial. Don’t write a blog post about learning Python. This will save ~1h of your time. Tags: Python Categories: Tutorial Updated: January 16, 2023 Previous Next Joining the Now Page movement February 25, 2025 1 minute read I just added a /now page to my blog. Here’s why, what’s on it, and why you might want one too. PostgreSQL Fixtures Editor February 24, 2025 2 minute read I built a VS Code extension to make editing PostgreSQL fixtures easier. Here’s why I made it, how it works, and how you can use it. Automating Callbacks to Async/Await Migrations for Mocha Tests: Part 2 October 20, 2023 12 minute read In this second part we will go deeper into AST editing techniques and show how to automatically migrate tests that use the supertest NPM library. Automating Callbacks to Async/Await Migrations for Mocha Tests: Part 1 October 14, 2023 16 minute read Doing this migration in a large codebase can be tedious but necessary. The article will show you how to automate this task using JS code transformation tools."
