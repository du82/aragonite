title = "Published my notes on OAuth 2.0 and OpenID Connect - MARCO LABARILE"
description = "Senior Backend Engineer.Ex-founder and CTO.Blogging about my adventures in cyberspace and meatspace."
full_description = "Published my notes on OAuth 2.0 and OpenID Connect March 08, 2020 1 minute read I’ve recently added new topics to my public notes: JWT (JSON Web Token), a standard for creating JSON access tokens that can assert a number of claims. OAuth 2.0, is an open framework that allows to securely obtain authorization to access resources via HTTP. OpenID Connect, an authentication protocol. It builds upon OAuth 2.0 and JWT to provide users one login for multiple sites. When I was reading about these topics online, I did not find any comprehensive sequence diagrams which were also up to date with the OAuth 2.0 and OpenID Connect specifications. With these notes, I’m trying to offer a high-level yet not-too-abstract view on these topics. As always, you can let me know if you find any mistakes in my notes by creating a PR in the notes’ GitHub repository. Tags: JWT, OAuth, OpenID Connect, Software Architecture Categories: My notes Updated: March 08, 2020 Previous Next Joining the Now Page movement February 25, 2025 1 minute read I just added a /now page to my blog. Here’s why, what’s on it, and why you might want one too. PostgreSQL Fixtures Editor February 24, 2025 2 minute read I built a VS Code extension to make editing PostgreSQL fixtures easier. Here’s why I made it, how it works, and how you can use it. Automating Callbacks to Async/Await Migrations for Mocha Tests: Part 2 October 20, 2023 12 minute read In this second part we will go deeper into AST editing techniques and show how to automatically migrate tests that use the supertest NPM library. Automating Callbacks to Async/Await Migrations for Mocha Tests: Part 1 October 14, 2023 16 minute read Doing this migration in a large codebase can be tedious but necessary. The article will show you how to automate this task using JS code transformation tools."
