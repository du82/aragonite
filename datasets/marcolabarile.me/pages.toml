full_description = "Joining the Now Page movement February 25, 2025 1 minute read I recently added a /now page to my blog. It’s a simple page where I share what I’m currently doing, thinking about or focusing on in my life. It’s inspired by nownownow.com, a movement started by Derek Sivers to encourage people to keep an updated, personal status page—kind of like an “about me”, but for the present moment. Most personal sites have an /about page, but that’s usually static. A /now page, though, is dynamic. It reflects what’s happening in my life right now, not just who I am. I like the idea because it keeps my blog personal and it might help create connections with visitors. If you have a personal website or blog, I highly recommend adding a /now page. It’s easy to set up, and it gives visitors a better sense of what you’re actually doing. Let me know if you end up making one too, because I’d definitely read it to satisfy my curiosity. I’m not kidding, I’ve spent way too much time reading other people’s /now pages. Tags: Blogging Categories: My Projects Updated: February 25, 2025 Previous Next PostgreSQL Fixtures Editor February 24, 2025 2 minute read I built a VS Code extension to make editing PostgreSQL fixtures easier. Here’s why I made it, how it works, and how you can use it. Automating Callbacks to Async/Await Migrations for Mocha Tests: Part 2 October 20, 2023 11 minute read In this second part we will go deeper into AST editing techniques and show how to automatically migrate tests that use the supertest NPM library. Automating Callbacks to Async/Await Migrations for Mocha Tests: Part 1 October 14, 2023 15 minute read Doing this migration in a large codebase can be tedious but necessary. The article will show you how to automate this task using JS code transformation tools. My Top 10 Reads of the Month August 26, 2023 1 minute read Have a look at the best articles, posts, projects and stories I’ve found this month. Featured topics: programming, science, security, AI."
