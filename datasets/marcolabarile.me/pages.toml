full_description = "Resuming blogging activity October 04, 2022 2 minute read It’s been a couple of very intensive years: from switching to a permanent tech lead role to co-founding my first startup and being a CTO for the first time in my life. Add some social life, gym, and hobbies to this and you will have little time left to write meaningful blog posts. So I’m trying to get back to blogging from time to time and I have some ideas to work on. Weekly digests of my reads I love to keep up with the latest tech news and read up on lots of topics. I aim to publish a weekly post to share the articles I’ve read and found most interesting during the week. Bug fixes and Style improvements Some minor features of my blog theme require updating (e.g. social share buttons), so I’m thinking about reviewing them and removing the ones I don’t need. I also gathered some tips on how I might improve the blog’s style and readability. For example, this is the first post I’m writing with the automated assistance of Grammarly (I’m already starting to like it). Quirky tricks and knowledge These years, I have been solving all kinds of problems. I think some of them deserve their blog post. It would also be another way to give back to the community. I’m looking forward to my blogging comeback. See you in the next post! Tags: Blogging Categories: My Projects Updated: October 04, 2022 Previous Next Joining the Now Page movement February 25, 2025 1 minute read I just added a /now page to my blog. Here’s why, what’s on it, and why you might want one too. PostgreSQL Fixtures Editor February 24, 2025 2 minute read I built a VS Code extension to make editing PostgreSQL fixtures easier. Here’s why I made it, how it works, and how you can use it. Automating Callbacks to Async/Await Migrations for Mocha Tests: Part 2 October 20, 2023 12 minute read In this second part we will go deeper into AST editing techniques and show how to automatically migrate tests that use the supertest NPM library. Automating Callbacks to Async/Await Migrations for Mocha Tests: Part 1 October 14, 2023 16 minute read Doing this migration in a large codebase can be tedious but necessary. The article will show you how to automate this task using JS code transformation tools."
