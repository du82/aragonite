full_description = "Interesting technologies - 10/2018 October 14, 2018 1 minute read Some interesting technologies as of October 2018: Deep image reconstruction from human brain activity researched by the Kamitani Lab at Kyoto University. Dataset search powered by Google, currently in beta. Wasabi, a dynamic analysis framework for WebAssembly. Everybody Dance Now, this paper presents a simple method for do as I do motion transfer. NVIDIA vid2vid, high-resolution photorealistic video-to-video translation using Pytorch. The Sound of Pixels, a system that learns to locate image regions which produce sounds and separate the input sounds. Walt, a JavaScript-like syntax for WebAssembly text format. JavaScript Visualizer, a tool for visualizing Execution Context, Hoisting, Closures, and Scopes in JavaScript. kube-score, a tool that does static code analysis of your Kubernetes object definitions. BrainNet, a multi-person brain-to-brain interface for direct collaboration between brains. Rosetta, Facebook’s production system for extracting text (OCR) from uploaded images. Pi-hole, network-wide ad blocking via your own linux hardware. Wasmjit, a small embeddable WebAssembly runtime. Its core is written in C90 and is easily portable to most environments. Tags: AdBlocking, Javascript, Kubernetes, Machine Learning, WebAssembly Categories: News Updated: October 14, 2018 Previous Next Joining the Now Page movement February 25, 2025 1 minute read I just added a /now page to my blog. Here’s why, what’s on it, and why you might want one too. PostgreSQL Fixtures Editor February 24, 2025 2 minute read I built a VS Code extension to make editing PostgreSQL fixtures easier. Here’s why I made it, how it works, and how you can use it. Automating Callbacks to Async/Await Migrations for Mocha Tests: Part 2 October 20, 2023 12 minute read In this second part we will go deeper into AST editing techniques and show how to automatically migrate tests that use the supertest NPM library. Automating Callbacks to Async/Await Migrations for Mocha Tests: Part 1 October 14, 2023 16 minute read Doing this migration in a large codebase can be tedious but necessary. The article will show you how to automate this task using JS code transformation tools."
