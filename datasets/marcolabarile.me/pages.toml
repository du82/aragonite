title = "OAuth 2.0 - Marco Labarile - Notes"
description = "Notes about various topics, courses, books, etc."
full_description = "OAuth 2.0¶ OAuth 2.0 is an open framework that allows to securely obtain authorization to access resources via HTTP. For example, you can tell Google that Trello is allowed to access your Google Calendar in order to associate tasks with dates, without sharing your Google password with Trello. This is possible because Trello can send OAuth 2.0 tokens to Google which prove your consent. OAuth 2.0 is not considered to be a protocol because the specification is rather vague. In fact, this is one of the reasons why Eran Hammer resigned from his role of lead author for OAuth 2.0. In the following sections we will go through the main concepts of the OAuth 2.0 framework. Purpose¶ One of the best analogies is to consider an OAuth 2.0 token to be the valet key to your car. By using the valet key, the valet can start and move (for a limited distance) your car but he can't access the trunk. An OAuth 2.0 token serves the same purpose of the valet key. As a resource owner, you decide which data each consumer is allowed to access from your service providers. You can give each consumer a different valet key, while being sure that none of these consumers has access to your full key or to any data from which they can build a full key. Roles¶ Roles identify the actors that can participate in OAuth 2.0 flows. There are 4 roles: Resource Owner: the user who is giving authorization to access his account information. Client: the application that attempts to get access to the user's account. It needs the user's permission in order to get this access. Authorization Server: the server that allows users to approve or deny an authorization request. Resource Server: the server that consumes the user's information. This is how OAuth 2.0 roles would be translated in our example: Endpoints¶ Endpoints are URIs that define the location of authorization services. In OAuth 2.0, there are 3 endpoints: The Authorization endpoint is on the authorization server. It's used for the resource owner's log in and grants authorization to the client application. The Redirect endpoint is on the client application. The resource owner is redirected to this endpoint after having granted authorization at the authorization endpoint. The Token endpoint is on the authorization server. This is where the client application exchanges some secret information for an access token. Note that some OAuth 2.0 grants don't involve all these endpoints but just some of them. This is how the OAuth 2.0 endpoints would be translated in our Trello example: Scopes¶ Scopes can be used to limit a client's access to the user's resources. Basically: A client can request one or more scopes. The requested scopes are presented to the user in the consent screen. If the user gives his consent, the access token issued to the application will be limited to those scopes. The OAuth 2.0 specification does not define any specific values for scopes, since they are highly dependent on the service provider. For example, these are the scopes for the Google Calendar's API: Grants¶ Authorization grants are methods for a client to get an access token. The access token proves that a client has the permission to access the user's data. Authorization grants are also known as flows. OAuth 2.0 recommends to use one of the following grants: Authorization code Authorization code with PKCE Client credentials Device authorization Refresh token But there are also some grants whose usage is discouraged by the OAuth 2.0 Security Best Current Practice document: Implicit grant Password grant Authorization code grant¶ The Authorization code grant has been designed for clients which can securely store a client secret. This grant is typically used when the client is a web server. Here's how the Authorization code grant would work in our Trello example: The user clicks on a button in the Trello's web app in order to connect his Google account to Trello. The Trello web app requests an authorization code. This operation can be done in several ways (e.g. redirection, link on HTML button). The code can be retrieved by making a HTTP GET request to the Google account's authorization endpoint with these parameters: client_id: the public id of the client. This was determined by the authorization server when the client was registered. response_type: specifies the grant type. By setting this parameter to code, the client indicates that it wants to start an authorization code grant. state: used to prevent CSRF attacks. redirect_uri: this is where the user will be sent after he approves the permission request. scope: describes the scope of the authorization (optional). The Google account server responds with the consent screen page. The user examines the requested permissions in the consent screen and then gives consent to Trello. The Google account server redirects the user to the redirect_uri on the client with these parameters: code: the authorization code. state: the state that was previously set for this authorization request. Trello now has the authorization code and exchanges it for the access token to the user's Google account by making a HTTP POST request: code: the authorization code. grant_type: specifies the grant type. By setting this parameter to authorization_code, the client indicates that it wants to complete an authorization code grant. redirect_uri: the uri where the authorization code has been previously sent. client_id: the public id of the client. This was determined by the authorization server when the client was registered. client_secret: the private secret stored by the client. It was associated by the authorization server to the client_id when the client was registered. Trello uses the access token to create an event in the user's Google Calendar. You can try the Authorization code grant in the OAuth.net playground. Proof Key for Code Exchange (PKCE)¶ PKCE extends the Authorization code grant to securely perform the code exchange with clients that cannot privately store the authorization code. This technique can be applied to any client, although it's typically used when the client is a mobile or a web browser application. Here's how the Authorization code grant with PKCE would work in our Trello example: The user clicks on a button in the Trello's web app in order to connect his Google account to Trello. The Trello web app generates a code verifier (i.e. a cryptographically secure random string) and the respective code challenge, which can be an hash of the code verifier or the code verifier itself. This code must be saved in the web app for later use. The Trello web app requests an authorization code. This operation can be done in several ways (e.g. redirection, link on HTML button). The code can be retrieved by making a HTTP GET request to the Google account's authorization endpoint with these parameters: client_id: the public id of the client. This was determined by the authorization server when the client was registered. response_type: specifies the grant type. By setting this parameter to code, the client indicates that it wants to start an authorization code grant. state: used to prevent CSRF attacks. redirect_uri: this is where the user will be sent after he approves the permission request. scope: describes the scope of the authorization (optional). code_challenge: used to send the code challenge previously generated by the Trello web app. code_challenge_method: if it's set to S256, indicates that the code verifier will be hashed with SHA256 and then base64-url-encoded into the code challenge. Otherwise, the secret code will be used as the code challenge. The Google account server responds with the consent screen page. The user examines the requested permissions in the consent screen and then gives consent to Trello. The Google account server redirects the user to the redirect_uri on the client with these parameters: code: the authorization code. state: the state that was previously set for this authorization request. Trello now has the authorization code and exchanges it for the access token to the user's Google account by making a HTTP POST request: code: the authorization code. grant_type: specifies the grant type. By setting this parameter to code, the client indicates that it wants to complete an authorization code grant. redirect_uri: the uri where the authorization code has been previously sent. client_id: the public id of the client. This was determined by the authorization server when the client was registered. code_verifier: the code verifier that was initially generated by the Trello client. Google Account will check whether it matches the challenge that was specified by Trello in the authorization request. If an attacker intercepted the authorization code, it won't be able to exchange it for an access token. Trello uses the access token to create an event in the user's Google Calendar. You can try the Authorization code grant with PKCE in the OAuth.net playground. Client credentials grant¶ The Client credentials grant is used when clients need to be authorized to act on behalf of a service account rather than a human user. For example, let's suppose that Trello has a system-internal service that computes statistics about users to create some reports. In order to do so, the Report service needs to be authorized to read the Trello users' data. Here's how the client credentials grant would work in this example: The Report service requests the access token that represents its service account by making a HTTP POST request: grant_type: specifies the grant type. By setting this parameter to client_credentials, the client indicates that it wants to complete a client credentials grant. client_id: the public id of the client. This was determined by the authorization server when the client was registered. client_secret: the private secret stored by the client. It was associated by the authorization server to the client_id when the client was registered. The Report service uses the access token to read the Trello users' data. Device authorization grant¶ The Device authorization grant has been designed for devices with limited input capabilities. For example, let's suppose we are using a Trello app for Apple TV and you want to authorize the app to access your Google Calendar's data. Here's how the device authorization grant would work in this case: The user clicks on a button in the Trello's web app in order to connect his Google account to Trello. The Trello app requests a device code with a HTTP POST request to the device endpoint on the authorization server: client_id: the public id of the client. This was determined by the authorization server when the client was registered. The authorization server responds with the requested data: device_code: a code representing the device, to be later displayed to the user. user_code: a code representing the user, to be later displayed to the user. verification_uri: represents the URL the user must visit to enter the user_code and device_code. interval: the minimum amount of time in seconds that the client should wait between polling requests to the token endpoint. expires_in: the lifetime in seconds of the device_code and user_code. (optional) The Trello app displays a message to the user, instructing him to visit the verification_url and the insert the user_code and device_code. The user visits the verification_uri, then approves the authorization request by inserting the user_code and device_code. While the Trello app was waiting for the user to approve the authorization request, it was polling the token endpoint with an HTTP POST request: grant_type: set this parameter to urn:ietf:params:oauth:grant-type:device_code to complete a device authorization grant. client_id: the public id of the client. This was determined by the authorization server when the client was registered. device_code: a code representing the device. After the user approved the request, the token endpoint responds with the access token. The Trello app uses the access token to create an event in the user's Google Calendar. You can try the Device authorization grant in the OAuth.net playground. Refresh token grant¶ The Refresh token grant has been designed to exchange a refresh token for an expired access token. Here's how this grant would work in our Trello example: Trello requests the authorization server to refresh an expired token with a HTTP POST request: grant_type: set this parameter to refresh_token to request a token refresh. refresh_token: refresh token. This token was initially returned by the authorization server alongside the access token. client_id: the public id of the client. This was determined by the authorization server when the client was registered. client_secret: the private secret stored by the client. It was associated by the authorization server to the client_id when the client was registered. This parameter can be omitted if the client does not have a client secret. The token endpoint responds with the new access token. The response may not contain a new refresh token, meaning that the existing refresh token is still valid. The Trello app uses the new access token to create an event in the user's Google Calendar. Implicit grant¶ The Implicit grant has been designed to immediately return an access token to the client, without first performing a code exchange. This grant was the recommended choice for native and JavaScript applications. But now its usage is discouraged because returning access tokens in a HTTP redirect brings several security risks to your application. These kinds of applications should instead use the Authorization code flow with PKCE. Here's how the Implicit grant would work in our Trello example: The user clicks on a button in the Trello's web app in order to connect his Google account to the Trello web app. The Trello web app requests the token by making a HTTP GET request to the Google account's authorization endpoint with these parameters: client_id: the public id of the client. This was determined by the authorization server when the client was registered. response_type: specifies the grant type. By setting this parameter to token, the client indicates that it wants to use the implicit grant. state: used to prevent attackers from crafting redirect URLs with malicious tokens. redirect_uri: this is where the user will be sent after he approves the permission request. scope: describes the scope of the authorization (optional). The Google account server responds with the consent screen page. The user examines the requested permissions in the consent screen and then gives consent to the Trello web app. The Google account server redirects the user to the redirect_uri on the client. This URL uses the hash character (#) to specify parameters so that they are not sent to the server. These are the parameters received by the client: access_token: the OAuth 2.0 access token. token_type: set to Bearer to indicate that the access token must be used with the"
