full_description = "My Top 10 Reads of the Week October 22, 2022 1 minute read Welcome to my weekly digest! Here you will find some of the best articles, posts and projects I’ve found this week: Google announced KataOS, an operating system almost entirely implemented in Rust. GitHub Copi­lot inves­ti­ga­tion. What if Copilot could damage open source communities? Posthog is an open source suite of product and data tools. Self-hosting means you don’t have to share your product’s data with other companies. cs-video-courses is an open collection of Computer Science courses with video lectures. DarkForestSim is a visual simulation of the Dark Forest Hypothesis. The Synthetic Party is a new political party in Denmark lead by Leader Lars, an AI chatbot. Scaling with more nodes might worsen the performance of distributed atomic commitments. Here’s why. Why a failed startup might be good for your career after all. This article shows the results of a research on startup founders seniority increase after leaving a startup. It confirms what I’ve seen so far in my social circle. WebVM: Linux virtualization in webassembly with full networking via tailscale. AlphaTensor results explained in layman’s terms. Tags: AI, Career, Learning, Rust, Society, WebAssembly Categories: News Updated: October 22, 2022 Previous Next Joining the Now Page movement February 25, 2025 1 minute read I just added a /now page to my blog. Here’s why, what’s on it, and why you might want one too. PostgreSQL Fixtures Editor February 24, 2025 2 minute read I built a VS Code extension to make editing PostgreSQL fixtures easier. Here’s why I made it, how it works, and how you can use it. Automating Callbacks to Async/Await Migrations for Mocha Tests: Part 2 October 20, 2023 12 minute read In this second part we will go deeper into AST editing techniques and show how to automatically migrate tests that use the supertest NPM library. Automating Callbacks to Async/Await Migrations for Mocha Tests: Part 1 October 14, 2023 16 minute read Doing this migration in a large codebase can be tedious but necessary. The article will show you how to automate this task using JS code transformation tools."
