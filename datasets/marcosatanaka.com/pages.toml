["https://marcosatanaka.com/blog/creative-selection.html"]
title = "Creative Selection, por Ken Kocienda"
full_description = "Já se perguntou como deve ser o desenvolvimento de software na Apple? Como os engenheiros trabalham para criar features usadas por milhões de pessoas todos os dias? Ken Kocienda tem a resposta. Seu livro recém lançado, Creative Selection: Inside Apple’s Design Process During the Golden Age of Steve Jobs, traz suas experiências como ex-engenheiro de software da Apple. Ele trabalhou no projeto e criação de softwares como o navegador Safari e o teclado touch screen do iPhone e iPad. No livro ele explica como o time decidiu qual mecanismo de renderização usar de base para o Safari, como foi portar o software do KDE para o macOS, e como eles conseguiram uma performance três vezes melhor que o principal concorrente da época, Internet Explorer. Os capítulos mais legais do livro são aqueles onde ele explica (profundamente) como foi criar o software do teclado do iPhone, as decisões de projeto que o time teve de fazer, e como o processo criativo para produtos como este funciona na Apple. Um misto de seleção acumulativa, demonstrações e feedback. E há outros bem curiosos também, como a experiência de apresentar uma demo pra ninguém mais ninguém menos que o próprio Steve Jobs! É um livro muito interessante. Ele explica coisas que usamos no nosso dia a dia e não paramos pra pensar, mas que são incrivelmente complexas e bem pensadas. Eu comprei a versão áudio livro da Audible (que inclusive é narrada pelo próprio autor), e há também a versão normal na Amazon."
year_published = 2025
