title = "What’s New in MusicSmart for iOS 18, iPadOS 18, and tvOS 18"
full_description = "Controls iOS 18 iPadOS 18 New Control for viewing music credits in Control Center. You can use it to create a music-focused group with various attributes and quickly see a specific credit for the current song. App Intents New App Shortcut to view liner notes and credits for the currently playing song. Just say “Siri, explore current song with MusicSmart” or access it from Spotlight or the Shortcuts app (figure 1). A hint is shown in the main app using the system’s default Siri UI to let users know about this new interaction (figure 2). Spotlight As you use MusicSmart to read liner notes and credits, tracks and artists will be indexed for Spotlight and the new Apple Intelligence semantic index. You can touch and hold tracks to preview their liner notes (figure 2). Tapping a track or artist will take you to the corresponding page in MusicSmart. Translate Liner notes, artist bio, and podcast descriptions can now be translated using Apple’s built-in Translate framework. Apple TV tvOS 18 MusicSmart on Apple TV now has a new tab view for switching between Trending Songs, Now Playing, and Search. Previously, users could only see liner notes and credits for the songs they were currently playing. Now, with the new search functionality, they can look up and access any song."
