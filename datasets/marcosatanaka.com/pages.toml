title = "What’s New in MusicBox for iOS 18 and iPadOS 18"
full_description = "Controls iOS 18 iPadOS 18 New Control to quickly play a random item from Control Center. Customize parameters like Tag, Smart Search, or status to create music-focused groups with your favorite tracks. New Control for quickly starting playback of a favorite album, playlist, or station — ideal for a music-focused group in Control Center. App Intents New intent for navigating to search results for the specified search term, which integrates MusicBox’s search functionality with Siri and Apple Intelligence. iOS 18 iPadOS 18 New App Shortcut to quickly view and access your latest music items. Just say “Siri, show music in MusicBox” or access it from Spotlight or the Shortcuts app. You can also use it as a shortcut in Control Center to view and open MusicBox items from anywhere. demo New App Shortcut to view a random new item with a single tap. Just say “Siri, open a random music in MusicBox” or access it from Spotlight or the Shortcuts app. Spotlight MusicBox’s content is now searchable in Spotlight. This will be especially useful for the upcoming semantic index and Apple Intelligence features."
