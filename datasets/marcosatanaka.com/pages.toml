["https://marcosatanaka.com/blog/play-premium-renewals.html"]
title = "Play Premium Renewals"
full_description = "The first year of annual renewals is probably one of the most anticipated and daunting milestones for a subscription-based app, especially when it’s something we’ve never experienced with other apps before. Maintaining existing users is just as important, if not more so, than acquiring new ones, so providing ongoing value and communicating it is crucial for the app to succeed. I released Play Premium almost a year ago, so the first-year renewal is coming up soon. Inspired by Casey Liss and Callsheet, which went through this a few months ago, I created this post to summarize how Play has evolved over the past year, highlighting all the new features and improvements, including: 27 updates each for iOS and macOS, totaling 54 releases Over 100 new features, improvements, and bug fixes Day-one support for iOS and iPadOS 18 Day-one support for Apple Vision Pro and visionOS Your support is what makes all of this possible, and I hope you’re enjoying Play Premium so far. It helps me keep improving the app and rolling out new features and updates regularly, ensuring users always get a better and well-maintained app. I have exciting plans for the upcoming year, and I’d love to have you along for the journey! ❤️ Here’s the complete changelog for the iOS app over the past year: Version 2.3.6 Released October 22, 2024 Support for playback speeds faster than 2x. To configure, go to Settings → Video Player. Better chapter extraction from video descriptions with some specific formats.PLAY PREMIUM New button for moving a channel to a folder from within the context menu.PLAY PREMIUM Ability to unfollow a channel without exiting the search results in Channels Inbox.PLAY PREMIUM Temporarily remove support for widget accented mode due to a system issue that stops links from opening their associated items. Editing an Auto-Tagging condition and changing the 'When' attribute no longer unnecessarily clears the 'Contains' field. Fixed an issue that caused videos marked as watched through Shortcuts to not update the Date Watched attribute correctly. Version 2.3.5 Released September 26, 2024 Channels InboxPLAY PREMIUM You can now customize the double-tap gesture between “Save for Later”, “Watch on YouTube”, or “Watch in App”. To configure, go to Settings → Channels Inbox → Gestures. Related settings are now conveniently accessible in Settings → Channels Inbox. Chapters and Recommendations are now displayed when previewing new videos that were not saved for later. When importing from Google Takeout, you now have the option to overwrite existing channels. This will remove any channels you follow in Play that are not included in your Google Takeout archive. Included the ability to add a channel to a folder right when following it. Video Details The video player now shows a warning when the creator disabled watching outside YouTube. Added a dedicated button to open the video in its source app. To configure, go to Settings → Video Details → Actions. Added the ability to edit video description. Fixed an issue where video notes could briefly duplicate while typing. Auto-Tagging Saving an Auto-Tagging will now automatically apply it to existing videos. Version 2.3.4 Released September 24, 2024 Support for tinted widgets. Fix a bug that could cause some recommended videos to miss metadata during addition. Version 2.3.1 Released September 19, 2024 Chapters and Timestamps: Play will detect and extract chapters listed in the video description, enabling you to easily navigate to specific sections.PLAY PREMIUM Recommended By: Likewise, videos suggested by the creator in the description are now shown in a dedicated section, making it easier to add them to your queue.PLAY PREMIUM The video player now stays visible while scrolling through the description and other video attributes. Improvements in playback position syncing. Stability was greatly improved on the iPad. Version 2.3.0 Released September 16, 2024 Play 2.3.0 adds support for the latest features introduced in iOS and iPadOS 18. It offers controls for Control Center, includes new app icons that match your Home Screen style, and deeply integrates with Spotlight. It also brings new forms of interaction via App Shortcuts that allows you to add and retrieve data using Siri, Spotlight, the Shortcuts app, and more. And you can now translate video descriptions to your preferred language. Check out the dedicated page to learn more about the new features introduced in this update. Version 2.2.5 Released September 06, 2024 New setting for inline video playback on iPhone. Go to Settings → Video Player → Auto Enter Fullscreen to configure. New button to watch in Picture in Picture (PiP) mode. By default, PiP automatically starts when you swipe away a fullscreen video, but you can now also activate it from the player’s toolbar (Player Settings → Enter PiP). iPad now uses the native system player when watching in fullscreen. iPad now takes advantage of all available space to display video details and the inline player. iPad now properly supports Picture in Picture (PiP) mode. The player now saves your playback position when exiting the detail view as well as when pausing the video. The modal video details screen (available only when “Tap to Watch” is enabled in Settings → Video List) now uses the app’s tint color. Version 2.2.4 Released September 02, 2024 Built-in Player: The video player now features a new toolbar to control playback, skip back and forward, adjust speed, and more. In Progress: A new playlist for videos you’ve started but haven’t finished. Playback Speed: You can now change the playback speed for all videos in Settings → Video Player. Fixed an issue where videos from channels with similar names were displayed under both channels in the “New by Creator” section. Version 2.2.3 Released July 19, 2024 New option to show video descriptions in Channels Inbox.PLAY PREMIUM Moved the Edit button to the top bar in Channels Inbox for easier access.PLAY PREMIUM Added a “New Folder” button to the Channels Inbox menu for quick access.PLAY PREMIUM The video description is now directly below the artwork and title for better visibility. Added a quick view option for notes when tapping and holding a video. The Show Full Title preference configured in Settings → Video Details → Metadata is now separate from the one in the video list. Play now suggests channels as you type when setting an Auto-Tagging condition by channel. New URL scheme for viewing video details: play://view?id= Improved iconography to clarify certain actions. Added “Open Details” as a swipe option in lists. Version 2.2.2 Released June 28, 2024 Fixed an issue that could group videos from channels with similar names in the New by Channel section. Version 2.2.1 Released June 5, 2024 Pinned Tags and Smart Searches now sync across platforms, and there’s no limit to the number of items you can pin. You can now follow a channel by searching its name, without needing to copy and paste the URL (though that’s still an option if you want to follow a specific channel directly).PLAY PREMIUM Redesigned My Channels view to highlight the different options for following channels and playlists.PLAY PREMIUM Version 2.2.0 Released May 31, 2024 New option to hide titles in grid view, for a cleaner look. The notes text editor now features live markdown syntax highlighting and improved controls. New option in Settings → Video Details → Metadata to always show the full video description. Search now offers title, channel, notes, description, and tag as categories for more granular control. Manage Videos now offers more filters and lets you play all selected videos on YouTube. Deleting items is now safer and less likely to be done accidentally. New button to edit a video’s channel by touching and holding it in Channels Inbox.PLAY PREMIUM You can now choose a tag when saving multiple videos in Channels Inbox.PLAY PREMIUM Revamped UI when adding items from the share sheet. Added links to some examples of shortcuts you can create using Play’s actions in the Help section. Improved Play’s initial launch experience. Version 2.1.9 Released May 21, 2024 New optional layout for Channels Inbox that groups new videos by channel and provides categories such as All, Today, and Slow Feeds.PLAY PREMIUM You can now organize your Channels Inbox subscriptions into folders.PLAY PREMIUM Channels Inbox now supports per-channel settings to filter new videos according to their title and description.PLAY PREMIUM Added the ability to edit the channel name in Channels Inbox.PLAY PREMIUM Performance improvements when refreshing Channels Inbox.PLAY PREMIUM New button in the video’s context menu to quickly filter by that creator. Version 2.1.8 Released May 1, 2024 Over 2x faster performance when finding new videos from channels you follow in Channels Inbox.PLAY PREMIUM Fixed an issue where the Delete Videos Above would be disabled after saving a video for later using the double tap or swipe gesture.PLAY PREMIUM Version 2.1.7 Released Apr 22, 2024 Fixed an issue where the app could crash when launched by users with numerous tags and tag folders. Version 2.1.6 Released Apr 20, 2024 You can now customize the sorting order of your Channels Inbox.PLAY PREMIUM Added the ability to share the video directly from Channels Inbox.PLAY PREMIUM New button for adding a tag to a video saved for later when swiping in Channels Inbox.PLAY PREMIUM Tag and Smart Search folders can now be edited and deleted from the sidebar.PLAY PREMIUM Tag folders now display the item count.PLAY PREMIUM The video list now indicates which videos have a star rating or notes. Included buttons to help with Markdown formatting while editing a note. The Find Video shortcut action now supports filtering by URL. Resolved a problem where the Manage Tags screen would unexpectedly close while modifying video tags. Resolved a problem where the New by Creator section would lost the selected item when changing the count of videos to watch. Version 2.1.5 Released Apr 1, 2024 The list of supported streaming services has been significantly expanded. If Play couldn’t fetch metadata for a video you tried to add before, there’s a good chance it can now handle it. Play now also supports a wide range of content types, including articles, posts, and so on. This opens up various possibilities, such as saving links to movie reviews, Instagram Reels, social network posts with an embedded video, and so on. New context menu action available in Channels Inbox to Delete Videos Above.PLAY PREMIUM Version 2.1.4 Released Mar 27, 2024 The video player now dynamically expands to fit the available space, ideal for a more immersive experience on iPad. Version 2.1.3 Released Mar 20, 2024 You can now choose between Thumbnail and Color & Icon for the Tag, Smart Search, and Creator sections on the Start Screen. Go to Settings → Start Screen to configure. Improved the UI for managing Tag and Smart Search folders in Settings. Settings now shows a live preview of the selected layout. Improved animations throughout the app. Fixed an issue that could cause the Watched list to not be sorted in reverse chronological order. Version 2.1.2 Released Mar 12, 2024 Shared videos now include the Start At attribute in the URL. Added a shortcut action to recover recently removed videos from your Channels Inbox.PLAY PREMIUM Fixed an issue when trying to add items from Disney+. Fixed an issue that could cause performance issues when importing channels from Google Takeout.PLAY PREMIUM Version 2.1.1 Released Mar 4, 2024 Import your YouTube channels using Google Takeout.PLAY PREMIUM Select and manipulate multiple videos at once in the Channels Inbox.PLAY PREMIUM The Start Screen now shows thumbnails for each Tag, Smart Search, and Creator. You can now view the number of videos on each Smart Search. Watch a random new item when pressing and holding a Tag or Smart Search. Fixed an issue where Smart Searches, when filtering by durations shorter than a specified amount, failed to save the selected comparison condition. Version 2.0.9 Released Feb 10, 2024 Follow YouTube playlists: you can now follow a specific playlist to get new videos as they are published.PLAY PREMIUM Pin up to two Tags or Smart Searches at the top of the start screen for quick access. Smart Search now supports filtering by video duration, description, and URL. Smart Search now supports filtering videos that do not include a specific tag. Smart Search now supports customizing the criteria between Contains and Doesn’t Contains when filtering by video title, channel, description, URL, or notes. Drag and drop a tag into a video to assign while in grid view. New Watch in App button when pressing and holding a video throughout the app. The Actions section now shows a button to quickly access Manage Videos. New Set Start At Position shortcut to save the current playback position for the video that’s currently playing, or for a specific video by ID. Fix: dragging a video to a tag no longer changes its added time and status. Version 2.0.7 Released Jan 27, 2024 Customize swipe gestures in the Channels Inbox list. Go to Channels → More → Swipe Actions... to customize.PLAY PREMIUM Tags now show their associated folder names across the app.PLAY PREMIUM Quickly create or update an Auto-Tagging rule for a specific channel. Press and hold a tag in the Manage Tags view to use. Support for watching videos in the DuckDuckGo browser. Configure in Settings → General → Watch With. Fixed an issue that caused the iPad app to don’t play videos in fullscreen when Stage Manager was active. Version 2.0.5 Released Jan 09, 2024 Added the ability to watch new videos from your channels inline, without having to first save them for later.PLAY PREMIUM The Get Videos shortcut action now supports filtering by multiple tags. List and Dense List layouts can now show the complete video title. Configure in Settings → Video List. Fixed a crash when trying to set the Start At attribute on videos that have a 0:00 length. Version 2.0.4 Released Dec 12, 2023 Interactive widget for tracking newly released videos from channels you follow.PLAY PREMIUM Added an option to show the full video title in the Channels Inbox.PLAY PREMIUM Added Date Watched as a possible attribute for filtering and sorting videos in the Find Video shortcut action. You can now quickly follow a channel from the video details screen.PLAY PREMIUM Rows in the New by Channel section now support the Play All New on YouTube action. Fix: When the Mark as Watched parameter is enabled, selecting Play All New on YouTube will now accurately play the selected tag and smart search. Fix: The Channels Inbox status bar now converts the elapsed time into hours if it has been more than 60 minutes since the last update. Version 2.0.3 Released Dec 6, 2023 Follow channels from your existing videos in Manage Channels → Import From URL → Add Existing Channels.PLAY PREMIUM You can now merge two different Tags. Go to Settings → Ta"
