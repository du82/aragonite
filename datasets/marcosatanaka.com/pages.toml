title = "Press Kit | Play"
full_description = "About Play Core Features Links Screenshots iPhone iPad Mac Apple TV Apple Vision Pro Lifestyle Videos Price and Availability Release Date Questions Add videos from any app or website. Watch supported YouTube videos in-app for a native experience. Organize them with tags, add markdown notes, assign a star rating, and more. Follow YouTube channels and playlists to get new videos as they’re released. Organize your channels into folders, configure per-channel filters, and hide shorts. Play is very customizable, allowing you to pick your layout, tint color, and so on. iCloud keeps everything up-to-date. Add videos from your Mac, iPhone, iPad, and Apple Vision Pro, and watch them later on your Apple TV. Play also supports interactive widgets, so you can quickly view and access your videos from the Home Screen and Desktop. Play is a modern app that supports the latest system features. It is available for the iPhone, iPad, Mac, Apple Vision Pro, and Apple TV. Add Videos: Add from another apps using the Share Sheet, drag and drop, or import from a YouTube playlist. Watch In-App: Watch supported YouTube videos in-app using the native system player. Follow Channels: Follow YouTube channels and playlists to get new videos as they’re released. Easily save videos you want to watch and delete the rest. Manage Your Subscriptions: Organize your YouTube subscriptions into folders. Configure per-channel settings to filter new videos according to their title and description. You can also hide YouTube Shorts. Tags: Create and assign tags to organize your videos. Auto-Tagging: Automatically tag videos based on rules you set. Smart Search: Create custom video lists tailored to your unique preferences. Focus Filter: Configure a Focus mode to limit the videos and tags shown in Play. App Shortcuts: Automate workflows using Play’s actions and data. Interactive Widgets: Add and customize interactive widgets to your Home Screen, Lock Screen, and Desktop. Highly Customizable: Enjoy multiple layout choices, personalize your metadata shown, control the sidebar contents, and more - tailor your experience down to the finest detail. iCloud: Your database is automatically synced to your iPhone, iPad, Mac, Apple Vision Pro, and Apple TV. Downie Integration: Download videos using Downie directly from Play on your Mac. Apple TV: Easily access and watch videos on your Apple TV."
