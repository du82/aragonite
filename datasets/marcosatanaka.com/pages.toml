title = "Press Kit | MusicBox"
full_description = "About MusicBox Core Features Links Screenshots iPhone iPad Mac Apple TV Lifestyle Price and Availability Release Date Questions MusicBox is an award-winning, flexible listen later app that you can use to: Keep track of new music you want to listen to later. Catalog and organize favorite albums, songs, artists, playlists, and radio stations. Categorize music with tags, assign notes, manage metadata, and more. MusicBox collects relevant metadata of albums and songs and is deeply integrated into the system with features such as Interactive Widgets, Share Sheet, App Shortcuts, iCloud, and more. It supports a wide range of platforms, and you can also add music manually by filling in all the required fields. Check out everything new in MusicBox for iOS 18 and iPadOS 18. Core Features MusicBox is a modern app that supports the latest system features: Interactive Widgets, App Shortcuts, Action Extension, Context Menu, iCloud sync, dark mode, and more. It is available for the iPhone, iPad, Mac, and Apple TV. Multiple Services: MusicBox supports albums and songs from Apple Music, Spotify, Deezer, Discogs, Bandcamp, Songwhip, AllMusic, RYM, and Odesli. Users can also add music from other platforms by manually filling in all the required fields. Easy to Add: Add music from the Share Sheet, via drag and drop, with Shazam, by searching, or by importing from a playlist. Tags: Apply tags to categorize your music and make it easier to find. Auto-Tagging: Automatically tag albums and songs based on rules you set. Deep Search: Search your music by attributes such as title, artist, genre, record label, tags, type, and notes. Smart Search: Automatically filter albums and songs based on a set of rules. Focus Filter: Configure a Focus mode to limit the videos and tags shown in Play. App Shortcuts: Automate workflows using MusicBox's actions and data. Interactive Widgets: Add and customize interactive widgets to your Home Screen, Lock Screen, and Desktop. Shazam: Easily bookmark music playing around you. iCloud: Your database is automatically synced to your iPhone, iPad, Mac, and Apple TV."
