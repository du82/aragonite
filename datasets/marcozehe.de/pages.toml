full_description = "Welcome on Marco's Accessibility BlogHelping to make accessibility accessible since 2007. Here you'll find lots of content on the topic of accessibility, and other technology I find interesting. 25 years of Help Tech and MeIn this blog post, I highlight my special relationship to Braille displays of the Handy Tech brand. The occasion is an anniversary.tagged with: #BrailleHow to use Element and Matrix with a screen readerIn this blog post, I give an introduction to the Matrix communication network and the most popular client named Element. I will show you the main elements of the web and desktop user interface and how you can quickly navigate around it using a screen reader.tagged with: #Chat, #Elementio, #MatrixorgMy Journey To GhostIn this post, I discuss some aspects of my migration of this blog from WordPress to Ghost, and what pitfalls I encountered.tagged with: #Wordpress, #GhostWelcome to Marco's Accessibility Blog 2.0!This blog has launched on a new platform. Find out a bit about the background and motivation in this post.tagged with: #Blogging, #Ghost, #Jamstack, #Eleventy, #Hugo, #Gatsbyjs, #Netlify, #OpensourceThe focus of this blog is changingRecently, Mozilla introduced an official blog about all things accessibility. This blog is transitioning to a pure personal journal.tagged with: #GeneralWhat's new for accessibility in Gutenberg 7.2Gutenberg 7.2 has just been released as a plugin. The development cycle was longer than usual. As a result, this version contains a lot of changes. Several of them improve Gutenberg’s accessibility.tagged with: #GutenbergMerry Christmas, everyone!To everyone who celebrates it, a very merry Christmas!tagged with: Happy ChanukkaWishing all of my readers who celebrate it, a very happy Chanukka!tagged with: #HappychanukkaWordPress accessibility team member, Gutenberg contributorMy recentfrequentblogging about Gutenberg has led to some really productive changes.tagged with: #A11y, #GutenbergRecap: The web accessibility basicsToday, I am just quickly going to recommend you an old, but all-time reader favorite post of mine I published 4 years ago. And it is as current today as it was then, and most of it already was in the year 2000. Yes, I’m talking about the basics of web accessibility.tagged with: #A11y, #Css, #Html, #WebdevOlder entries"
