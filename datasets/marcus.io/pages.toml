["https://marcus.io/blog/a11y-app-specific-app-idea"]
title = "Building accessible-app.com: A specific app idea · marcus.io"
description = "As outlined in the last #accessibleapp …"
full_description = '''Building accessible-app.com: A specific app idea August 30th, 2018 Caution! This article was published over a year ago, and hasn't been updated since. Situation, software and support of the topic below could have changed in the meantime. As outlined in the last #accessibleapp blog post, the project has a backlog repository on GitHub where everyone can join in and comment on existing, or suggest new features. Even though we are still early in the planning phase, favourite features are emerging for the first iteration of demo app. The task is now to glue these features together to a demo app. This is part 3 of an article series on building "accessible-app.com". Read the other posts: Very first steps Further steps together → A specific app idea Project status, side benefits, and Routes Let's start building Dialogs and Modals Hello, Vue implementation Menu Buttons New menu button for Accessibook's shopping cart Accessible Animations The shopping cart and aria-live regions The current state of the VueJS implementation of #accessibleapp What do you mean by "demo app"? # One of the main aims of this project is to offer concrete (development) advice on building an inclusive web app. I think, to offer concrete advice, you have to do this with an concrete example. The example of choice for the todomvc.com team was a todo app. But I think, #accessibleapp should find an own example case. My idea: A Bookstore app # One idea could be to glue all of the current favourites together in a bookstore single page app. And not just any bookstore, but an online store where you can get great accessibility resources. Here's a wireframe how this app could look like: Legend for this sketch: Off Canvas drawer holding a main menu (see backlog issue #15) This button could open a pop over menu (with links like "Past orders", "Log out"), (see backlog issue #6) This link stands for "Keyboard accessibility / focus management" (see backlog issue #2) This Button opens a modal window (see backlog issue #3) with information about the particular book This button puts the selected book into your shopping cart. Two things should then happen: - Adding to cart should be announced via an `aria-live` region <a href="https://github.com/accessible-app/backlog/issues/9">(see backlog issue #9)</a> - The shopping cart (another pop over menu (link:https://github.com/accessible-app/backlog/issues/6 text:(backlog issue #6)] should open and receive keyboard focus <a href="https://github.com/accessible-app/backlog/issues/2">(backlog issue #6)</a> The list of books should be sortable by year of publication, price, title, author (see backlog issue #12) As always, I'm eager what you think of it. Is it scalable enough? I think so, since we would establish a general e-commerce context. If you'd like to share feedback, feel free to do that in the aforementioned backlog repo, or ping me on Twitter or Mastodon. Thanks! Oh, and since you are here and show interest in building inclusive web applications: Last week, I had the opportunity to talk with Michael Berger from Basecamp and his efforts to approving the software's accessibility: "Improving Basecamp's accessibility - Interview with Michael Berger on how to make an existing web app more inclusive" x'''
author = "Marcus Herrmann"
year_published = 2018
year_updated = 2018
