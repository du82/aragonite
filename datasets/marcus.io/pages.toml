["https://marcus.io/notes/linkedin-formatting"]
title = 'LinkedIn "Formatting" · marcus.io'
description = "Being on LinkedIn, I see many people …"
full_description = 'LinkedIn "Formatting" November 9th, 2024 #semantics #exclusion Being on LinkedIn, I see many people trying to emphasise certain word or phrases 𝐥𝐢𝐤𝐞 𝐭𝐡𝐢𝐬 (like this), making them appear "bold" or "italic". The problem with this strategy is that this is a hack that excludes screen-reader users, employing only fake text. While sighted users may see "just" differently formatted text, users of NVDA, JAWS, VoicerOver and company perceive these "formatted" text as what it really is - a bunch of Unicode symbols. Way more on this topic in an (automatically translated) article fellow colleague Joschi Kuphal wrote months ago. It hurts me even more when web accessibility professionals or even events catering to the blind or visually impaired use this "strategy": I may ask too much, but please learn about the typical barriers of the medium you use including how to avoid them (and supplying alternative texts to images neither new nor impossible on said platform. But often it appears like its some form of "secret knowledge"). Otherwise, your commitment to inclusion you state may feel a bit performative and shallow (to me).'
