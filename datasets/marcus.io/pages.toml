title = '''Quick overview of "What's New In WCAG 2.2" explainer posts · marcus.io'''
description = "Sometimes it's the best method of …"
full_description = '''Quick overview of "What's New In WCAG 2.2" explainer posts October 5th, 2023 #accessibility #wcag22 #overview Caution! This article was published over a year ago, and hasn't been updated since. Situation, software and support of the topic below could have changed in the meantime. Sometimes it's the best method of learning when different people with different teaching styles teach the same subject. Since Web Content Accessibility Guidelines 2.2 has landed just recently, and it is really important to get a grip regarding the testing of the new success criteria, here's an overview of recommended and – in my opinion – valuable explainers by fellow members of the accessibility community: Hidde de Vries # If you in a hurry and just want to gain a quick overview of what is new in 2.2, please head to Hidde's blog. Tetralogical, Patrick H. Laucke # A self-proclaimed high-level overview of what WCAG 2.2 brings and how it differs from older versions. TGPi, James Edwards # James' deep dive into the new criteria and, most of all, how to test them was and is my go-to studying ressource about the topic: "New Success Criteria in WCAG 2.2". W3C's Web Accessibility Initiative # It would be silly not to mention the "official informative" resource about WCAG's new version: New in 2.2. Update 2023-10-06: # WCAG 2.2 and conformant focus indicators, Sara Soueidan # In this article, Sara does not describe the WCAG 2.2 update as a whole, but one aspect of it very thourougly: A guide to designing accessible, WCAG-conformant focus indicators Update 2023-10-10: # Intopia Videos # In their "WCAG 2.2 at a glance" series, Intopia puts a spotlight on single new success criteria in video form on their YouTube channel. Currently released: 3.2.6 Consistent Help 3.3.7 Redundant Entry LevelAccess # WCAG 2.2 AA: Summary and Checklist for Website Owners is a short, but condensed overview of what WCAG 2.2 brings and what conformance level is quoted in the majority of referencing laws and standards (it's AA). I plan to frequently update this listing post, please check again later. x'''
