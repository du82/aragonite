full_description = '''Hello, I'm Marcus, a freelance web developer and accessibility auditor, author of Accessible Vue, and Web Accessibility Specialist from Berlin, Germany. Welcome to my blog 👋. Latest blog posts Accessible status messages with Vue Announcer v2 May 18th, 2020 #accessibility #vue #aria #live-regions While accessibility is of course more than "making a website compatible with screen readers", this article is about the challenges developers face when dealing with the dynamic nature of web apps – and tools at their disposal to improve the experience of all users. … → Read more about Accessible status messages with Vue Announcer v2 Disclosure widgets in Vue.js February 17th, 2020 #accessibility #vue #aria #disclosure-widgets A disclosure is a foundational widget pattern for accessibility. But how exactly is it structured and how can it be implemented in Vue.js? In general, a disclosure widget consists of two parts. A container element, starting hidden, and a button above it. When the … → Read more about Disclosure widgets in Vue.js Change of ebook plans February 10th, 2020 #writing #accessible-vue #meta Just a month ago I wrote in my 2019 retrospective for the first time in this blog about my plans to release an ebook. The idea is actually six months old and my intention back then was to do the following: Writing an ebook about web accessibility in German Covering … → Read more about Change of ebook plans Improved accessible routing in Vue.js (updated) January 27th, 2020 #accessibility #vue #routing I've written about accessible routing in Vue.js before and tried to sketch an accessible strategy for "page" changes in this particular framework – but frankly, the advice I was giving in said article originated from what I learned from what I read and found looking … → Read more about Improved accessible routing in Vue.js (updated) Follow up on my spiegel.de notes: Interview with Daniel Schulz from SPIEGEL Tech Lab January 16th, 2020 #interview #spiegel Following the publication of my "Accessibility notes on the www.spiegel.de relaunch", it was a little bit by chance, and a little bit due to Twitter that I was able to contact a member of the spiegel.de NextGen team. Though Daniel Schulz came into the project … → Read more about Follow up on my spiegel.de notes: Interview with Daniel Schulz from SPIEGEL Tech Lab ← Newer Posts Older Posts →'''
