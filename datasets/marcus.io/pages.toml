full_description = '''Blog On Certification January 15th, 2025 #accessibility #certs #meta First of all: This text is not about the organisation providing and "running" these certifications, them being gate-keepers or consisting of people with disabilities - or not (this is a whole other article). Nor it is the topic of this text the exact way of verifying … → Read more about On Certification 80 / 20 accessibility August 16th, 2024 #accessibility #meta #pareto Many people are confronted with the topic of web accessibility for the first time as a result of the EAA (European Accessibility Act) ( why this confrontation didn't happen much earlier is another matter...) and are downright afraid of the topic, its complexity and … → Read more about 80 / 20 accessibility Best intention barriers (ARIA edition) May 11th, 2024 #aria #accessibility In my experiences as an auditor (for WCAG and EN 301 549) I stumble over a large number of barriers. Heck, my job is to find and to help the website developer and owner to get rid of them to make their web project more inclusive and – in the truest sense of the word - … → Read more about Best intention barriers (ARIA edition) Happy (?) belated new year January 6th, 2024 #meta #yearly-recap I know, I'm late for my 2023 blog post. But somehow, stacking the usual end-of-year-stress on top of the self-made urge to write up a retrospecitive post does not really work. Also, I have my fair share of retrospectives at the end of the year traditionally, with New … → Read more about Happy (?) belated new year Quick overview of "What's New In WCAG 2.2" explainer posts October 5th, 2023 #accessibility #wcag22 #overview Sometimes it's the best method of learning when different people with different teaching styles teach the same subject. Since Web Content Accessibility Guidelines 2.2 has landed just recently, and it is really important to get a grip regarding the testing of the new … → Read more about Quick overview of "What's New In WCAG 2.2" expl