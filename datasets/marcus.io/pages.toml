full_description = '''Articles tagged with: 'meta' My 2020 December 21st, 2020 #yearly-recap #meta Already in the last end-of-year blog posts, I have focused on the positives rather than the negatives. And if I hadn't already done so in past yearly reviews, I would start this year. This time of the year has enough 2020 retrospectives that are more or less garbage … → Read more about My 2020 Making RSS more visible again with a /feeds page May 31st, 2020 #feeds #meta A few years ago you could easily tell if a page offered an RSS feed. Browsers (at least good ones) had a feed symbol close to their location bar, and if you were really lucky (or used a really good browser), that indicator was even a button, empowering you to subscribe … → Read more about Making RSS more visible again with a /feeds page Change of ebook plans February 10th, 2020 #writing #accessible-vue #meta Just a month ago I wrote in my 2019 retrospective for the first time in this blog about my plans to release an ebook. The idea is actually six months old and my intention back then was to do the following: Writing an ebook about web accessibility in German Covering … → Read more about Change of ebook plans Progress on accessible-app.com January 9th, 2020 #meta #a11yapp Just a quick heads-up: Accessible App (finally) received a content update, and it's a new pattern called "Showing progress". It deals with communicating interstitial (or: loading) states of web apps to screen readers by using the <progressbar> … → Read more about Progress on accessible-app.com 2019 retrospective January 1st, 2020 #yearly-recap #meta Another year passed by, and I really notice some truth in the saying that the older you get, the more life seems to accelerate. Although there were many (new) things in both my private and professional life, 2019 seems to have come and gone in an absurd pace. But in … → Read more about 2019 retrospective ← Newer Posts →'''
