["https://mariadb.com/privacy-policy"]
title = "Privacy Policy | MariaDB"
description = "MariaDB’s privacy policy, including data collection and security, data processing, and cookies."
full_description = '.mdb-section iframe { max-width: 100% !important; } [class*="bg-g-"], [class*="bg-g-"] h1, [class*="bg-g-"] h2, [class*="bg-g-"] h3, [class*="bg-g-"] p { color: #fff; } This Privacy Policy applies to information we collect, when you access or use any of our websites and products, when you communicate to our staff, or when you otherwise interact with us (collectively, the “Services”). This Privacy Policy describes how MariaDB collects, and processes your information, and what choices you have with respect to the information, as well as your rights relating to the collection and processing of your information. When we refer to MariaDB we refer to all MariaDB plc entities and other affiliates (“MariaDB” or “we” or “us”) and the mariadb.com or other MariaDB websites (“Site” or “Sites”). In order to use MariaDB Sites, Services and/or to provide any personal information to us, you must accept the practices described in this Privacy Policy. If you do not accept these practices, you must not access or use any MariaDB Sites or Services or provide us with your personal information. What Information Do We Collect? Personal Information In describing the information we collect, the term “personal information” refers to information that tells us specifically who you are, such as your name, company name, phone number, email or postal address. In many cases we need this information to provide the products or services that you have requested. Unless necessary to provide our products and services, the amount of personal information that you choose to disclose to MariaDB is completely up to you. The only way we know something about you personally is if you provide it to us. In order to process certain transactions, we may also need to collect payment information from you (e.g., credit card information) which will not be shared with anyone outside of MariaDB, its affiliates and the financial institutions and vendors used to process payments. We do not intentionally collect any sensitive information, such as information concerning race, religion, health, sexual orientation or political beliefs. Please do not send any sensitive personal information to us. Voluntary Information We receive and store any information you voluntarily communicate to us in connection with your use of our Sites or which you may voluntarily communicate to us in any other fashion. You may choose not to provide certain information we request from you. However, if you so elect, we may not be able to provide our products and services, and you might not be able to access or take full advantage of the features and functionality of the Site. Once you initiate a voluntary transaction, we will ask you for certain information depending upon the nature of the transaction in question. For example: When you request our products or services, we may collect your name, job title/rank, company name, address, mobile/phone number, social media account names, and email address and any other relevant information needed to contact you. When you contact us concerning downloads or with general inquiries, we ask for the information we need in order to answer your question as quickly and as accurately as we can. We ask for your email address in order to be able to reply directly or to ask for additional information necessary to respond to your question. When you submit a request to receive our newsletter, we ask for your email address to deliver the newsletter. We may ask for your name, job title/rank, company name, email address, social media account, phone number, address and/or country to register you to attend our webinars or conferences upon your request. When you participate in chat discussions or other public forums on the Site, any information posted in these areas of the Site becomes public information, and you should exercise care when disclosing personal information. We may use information collected about you to protect our rights and to investigate and prevent fraud or other illegal activities and for any other purpose disclosed to you in connection with our Services. Other Information Log data. As with most websites and technology services delivered over the Internet, our servers automatically collect information when you access or use our Sites or Services and record it in log files. This log data may include the Internet Protocol (IP) address, the address of the web page visited before using the Site or Services, browser type and settings, the date and time the Services were used, information about browser configuration and plugins, language preferences and cookie data. Device information. MariaDB collects information about devices accessing the Services, including type of device, what operating system is used, device settings, application IDs, unique device identifiers and crash data. Whether we collect some or all of this other information often depends on the type of device used and its settings. Location information. We receive information from you, your customer and other third-parties that helps us approximate your location. We may, for example, use a business address submitted by your employer, or an IP address received from your browser or device to determine approximate location. MariaDB may also collect location information from devices in accordance with the consent process provided by your device. Cookie information. MariaDB uses cookies and similar technologies in our Sites and Services that help us collect Other Information. The Sites and Services may also include cookies and similar tracking technologies of third parties, which may collect Other Information about you via the Sites and Services and across other websites and online services. For more details about how we use these technologies, please see our Cookie Policy. Information from third parties. From time to time, we may also receive personal information about you from our business partners and affiliates and add it to our account information about you. Cookies At MariaDB, we believe in being transparent about how we collect and use data. This policy provides information about how and when we use cookies for these purposes. What is a Cookie? Cookies are small text files sent by us to your computer or mobile device. They are unique to your account or your browser. Session-based cookies last only while your browser is open and are automatically deleted when you close your browser. Persistent cookies last until you or your browser delete them or until they expire. Web beacons are small graphic images or other web programming code which may be included in the website and any of our email messages. To find out more about cookies, visit our Cookie Policy. How Do We Process The Information We Collect? General Until you initiate a voluntary transaction with us, we do not collect any personal information about you. The information we collect is used to provide you with our products and Services; enable us to communicate with you; process requests for information or otherwise as necessary to perform an agreement between you and MariaDB; improve or add features, functionality and content to our Site; provide you with a more personalized experience at the Site. We may also use your Information to send you marketing offers related to our new products, services and/or special offers or updates or improvements to our existing products and Services as long as you have expressly consented to receiving these or in case we have received your information in the course of a purchase of our products and Services and we limit such marketing communication to similar MariaDB products and services. You may opt-out at any time from receiving marketing information from us in the manner described below. Email and Other Correspondence We may send you email or other forms of correspondence that are intended to notify you of our new products, services, special offers or updates or improvements to our existing products and services. You have the right to “opt-out” and prohibit use of your personal information for direct marketing purposes. If you prefer not receive any such email correspondence or marketing information concerning our products and services, please contact us at privacy@mariadb.com or click “unsubscribe” as instructed in any email from us. Using Your Personal Information The information that we collect from you via the Site and otherwise is an integral part of our business, and MariaDB is not in the business of selling or renting your personal information to third parties. We may share information collected about you with any member of our group of companies. This information shall be transferred in order to allow us to provide our Services to you, where other companies within our group perform components of the full Service offering. Such other services include customer support, internal audit, training and professional services. Transferring Information Internationally Our products and services may be provided using members of our group of companies and third parties acting on our behalf located in various countries around the world that may be located in countries outside of the European Economic Area (EEA), or countries deemed by the European Commission to have satisfactory data protection. These other countries may not offer the same level of protection for the information collected about you, although we will at all times continue to collect, store and use your information in accordance with this Privacy Policy and the General Data Protection Regulation (GDPR). MariaDB will ensure we share data only with those organizations that satisfy an adequate level of data protection in line with applicable data protection legislation. Partners and Third Parties MariaDB may submit personal information to the extent necessary to third parties as required or necessary to fulfill its Services and/or for performance of obligations. For example, MariaDB may share personal information with its partners to enable a partner to provide support to a customer or where required to make a sale in a particular country. From time to time MariaDB may employ or engage other companies and individuals to perform services on our behalf. Examples include provision of accounting, legal and financial services, fulfilling orders, shipping packages, sending postal mail and e-mail, processing credit card payments, and providing customer service. Such third parties may have access to your personal information if such is required in order to perform their service functions and may not use such information for any other purposes. MariaDB maintains ownership and control of the information so used. Additionally, if you attend or sponsor a MariaDB event such as a user conference, MariaDB may share your personal information with other sponsors or attendees for marketing purposes. We may also share information collected about you with third parties who we partner with for advertising campaigns, contests, special offers or other events or activities in connection with our Services, unless you choose to opt out of such communications. In any case, we will always ensure that your information will only be processed in connection with the Services and in accordance with this Privacy Policy and applicable data protection legislation. Sale of Business As we develop, expand and improve our lines of business, we may disclose information collected about you with third parties in connection with any merger, sale of company shares or assets, financing, acquisition, divestiture, or dissolution of all or a portion of our business. You acknowledge that any acquirer or successor of MariaDB may continue to use your information as set forth in this policy. Disclosure Required by Law We may also disclose information collected about you if (i) disclosure is necessary to comply with any applicable law or regulation; (ii) to enforce applicable terms and conditions or policies; (iii) to protect the security or integrity of our Services; and (iv) if we believe such disclosure is necessary to protect our rights. Disclosure With Your Consent Other than as described in the foregoing, you will receive prior notice from us in the event we propose to share your personal information with third parties, and you will have a reasonable opportunity to give us such explicit consent. “Opt Out” and Complaint Procedures In addition to the options made available to you when we collect information (if any), you may elect to “opt out” of having your personal information shared with third parties (except for uses specifically requested by you and necessary business uses). You must submit a request (by mail, email, fax, or telephone) to us in one of the following ways: By Mail: MariaDB, 699 Veterans Blvd. Redwood City, CA 94063, United States By Email: privacy@mariadb.com By Phone: +1 855-562-7423 We will update the specific records related to your request as promptly as practical. Note, however, that you may receive additional communications after you submit your request while we process the request. Your Right to Data Access, Inquiries and Complaints We want any information you provide to be correct so you have the right to request the correction or update of personal information that we hold about you. You have the right to direct us not to perform any of the procedures of collecting, storing or sharing of your information at any time. In such a case, you may not be able to engage in an activity on the Site or MariaDB may not be able to provide its products and services to you. You also may object to the use of your personal information for marketing purposes at any time without giving reasons via email at privacy@mariadb.com. GDPR affords EU data subjects with additional rights that are summarized below. In order to assert any of these rights, please contact us at privacy@mariadb.com at any time. Right of Confirmation: You have the right to obtain from us confirmation as to whether or not personal data concerning you are being processed. Right to Access Your Data: You can ask us for a copy of your personal data and can ask for a copy of personal data you provided in machine readable format. Object to, or Limit or Restrict, Use of Data: You can ask us to stop using all or some of your personal data or to limit our use of it. Amend Data: You can request the correction or update of personal data that we hold about you. Right to Erasure (Right to Be Forgotten): You can ask us to erase or delete all or some of your personal data. Right to Individual Decision Making, Including Profiling: You have the right not to be subject to a decision based solely on an automated processing, including profiling. Right to Withdraw Consent: Where consent forms the basis for processing, you shall have the right to withdraw your consent to our further processing as described in this Privacy Policy. In such case, please note that we may no longer be able to provide you with the Services you have requested and may th'
