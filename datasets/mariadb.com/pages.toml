1999년 창립 이래 코오롱그룹 및 전 산업 영역에 걸쳐 IT컨설팅, 시스템 통합, IT 아웃소싱, 솔루션 사업을 펼치고 있으며,
IT서비스부문의 국제표준인 ISO20000 인증에 걸맞은 세계 수준의 IT서비스를 제공하고 있습니다.
