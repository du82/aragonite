r right 20px; } .version-select-wrap select:focus { box-shadow: none; outline: none; border: 2px solid #E5E1E5; } .download-bar { padding: 20px 30px; border-radius: 0 0 10px 10px; } .tile-large { background-image: linear-gradient(-31deg, #F4F2F4 0%, #fff 100%); -webkit-box-shadow: 2px 4px 10px 0 rgb(66 79 98 / 20%); box-shadow: 2px 4px 10px 0 rgb(66 79 98 / 20%); border-radius: 12px; padding: 30px; } .cloud-img-gallery a:first-child { padding-right: 5px; } .cloud-img-gallery a:nth-child(2) { padding-left: 5px; } .cloud-img-gallery a:first-child, .cloud-img-gallery a:nth-child(2) { width: 50%; flex-basis: 50%; } .cloud-img-gallery a:nth-child(3) { width: 60%; flex-basis: 60%; margin-top: 10px; } .cloud-img-gallery a img { max-width: 100%; } .badge-wrap { top: -11px; left: -3px; } .badge-wrap span.badge { font-size: 10px; } .icon-docs { cursor: pointer; } code[class*=language-] { display: inline-block; border: 0; font-size: 12px; } code[class*=language-] span { font-size: 12px; } @media (min-width: 992px) { #downloadsTabs .nav-item > a { font-size: 16px; padding: 1.7rem 1.6rem; } .downloads-tab-content .sub-tabs .nav-item a { font-size: 14px; padding: 1.5rem 1.5rem; } .tab-content-inner { padding: 80px; } .tile-large { padding: 50px; } } Download MariaDB products and tools for development and production Free MariaDB Community MariaDB Enterprise Platform Repo Setup Connectors Community Server MaxScale ColumnStore Download MariaDB Community Server: Lightweight but powerful, innovative but mature, and 100% open source MariaDB Community Server sets the standard for open source relational databases, with Oracle Database compatibility (e.g., sequences and PL/SQL), temporal tables, transparent sharding, instant schema changes, point-in-time rollback and modern SQL (i.e., common table expressions, window functions, JSON functions and more). MariaDB Community Server now includes ColumnStore for real-time analytics at scale. It’s the best way to get started, when it’s time for 