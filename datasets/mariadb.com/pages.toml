e applications and usages that will help you gain an understanding of how to take advantage of MariaDB Connector/Python. Simple API application: A Python application that uses Flask to expose endpoints that can be used to perform simple CRUD operations with MariaDB Connector/Python. Data Visualization: Using MariaDB Connector/Python, the libraries Plotly and Pandas are used to demonstrate data analysis and visualization. GitHub Flights A web application, backed by the power of MariaDB connectors and MariaDB ColumnStore database, that allows you to analyze over 180 million flight records from the United States Department of Transportation in real time without needing to add any indexes. Node.js (Basic) Python (Basic) Places A web application backed by the power, performance, and simplicity of MariaDB, allows you to record all of your favorite locations using both structured (relational) and semi-structured (JSON) data. Java (JDBC + Spring) Java (R2DBC + Spring) Node.js (Basic) Python (Basic) TODO A web application that introduces you to the power, performance and simplicity of MariaDB through simple CREATE-READ-UPDATE-DELETE (CRUD) operations. C++ C# (Dapper) C# (Entity Framework) Java (JDBC + Spring) Java (R2DBC + Spring) Node.js (Basic) Node.js (Sequelize) Python (Basic) Python (SQLAlchemy) .resource-block-bg .img-bg-cover { min-height: 100%; } Resources webinar Deep Dive: Taking Advantage of MariaDB Connector for Python Deep Dive: Taking Advantage of MariaDB Connector for Python Learn More webinar Columnar Storage + Python: Powering Modern Data Science and Analytics Columnar Storage + Python: Powering Modern Data Science and Analytics Learn More webinar Deep Dive: Taking Advantage of MariaDB Connector for Python Deep Dive: Taking Advantage of MariaDB Connector for Python Learn More DOCUMENTATION The official MariaDB documentation provides the most robust and extensive reference material on MariaDB features and capabilities. View Python Documentation GET STARTED WI