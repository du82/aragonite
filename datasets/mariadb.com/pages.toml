["https://mariadb.com/docs/server/products/mariadb-maxscale"]
title = "MariaDB MaxScale — MariaDB Documentation"
description = "MariaDB is the leading enterprise open source database with features previously only available in costly proprietary databases. Enterprise grade, wallet friendly."
full_description = "MariaDB MaxScale This page is part of MariaDB's Documentation. The parent of this page is: Products Topics on this page: Overview Scheduled Releases Latest Software Releases Available Documentation Deployment Service Management Connect and Query Security Architecture What's New Overview MariaDB MaxScale is an advanced proxy, router, and load balancer: MaxScale performs automated failover for MariaDB replication. When the primary server fails, MaxScale promotes a replica to be the new primary and redirects the remaining replicas to it. MaxScale's ReadWriteSplit router performs query-based load balancing. ReadWriteSplit routes each write statement to the current primary server and load balances read statements by routing them to the replica servers. MaxScale's ReadConnRoute router performs connection-based load balancing. ReadConnRoute routes each connection to a single primary or replica node, depending on configuration. MaxScale can import data from Kafka and export data into Kafka. MaxScale's KafkaCDC router streams data from MariaDB database products to a Kafka broker. MaxScale's KafkaImporter router streams data from Kafka to MariaDB database products. MaxScale provides built-in mechanisms to perform server maintenance without disruption to applications or client. Servers can be set to maintenance mode using the command-line interface with MaxCtrl, using web browser with MaxGUI, and using REST API. MaxScale's Cache filter can improve SELECT performance by caching and reusing results. Security and traffic controls for database connections and queries can be implemented with MaxScale. MaxScale's QLAfilter can be used to create an audit trail by logging all queries. MaxScale's RegexFilter can also perform audit logging or protect against SQL injection by matching queries against a regular expression and performing various actions on the query, such as logging it, modifying it, or routing it to a specific server. MariaDB MaxScale can be deployed in the cloud or on-premises. Scheduled Releases MariaDB MaxScale follows the MariaDB Enterprise release schedule, which can be found herehere. Latest Software Releases Release Series Latest Release Date Latest Release 24.02 2024-12-09 MariaDB MaxScale 24.02.4 23.08 2024-12-09 MariaDB MaxScale 23.08.8 23.02 2024-12-09 MariaDB MaxScale 23.02.12 22.08 2024-12-09 MariaDB MaxScale 22.08.15 6 2024-03-11 MariaDB MaxScale 6.4.15 2.5 2023-10-25 MariaDB MaxScale 2.5.29 2.4 2022-01-10 MariaDB MaxScale 2.4.19 Available Documentation Deployment Deploy ColumnStore Object Storage Topology Deploy ColumnStore Shared Local Storage Topology Deploy Galera Cluster Topology Deploy Primary/Replica Topology Deploy Xpand Topology Service Management Administrative Tools for MariaDB MaxScale Connect and Query Connect and Query Security Authentication with MariaDB MaxScale Data-in-Transit Encryption for MariaDB MaxScale Enabling TLS for MaxScale's REST API Enabling TLS on MaxScale Architecture MariaDB MaxScale Architecture What's New See the MariaDB MaxScale 24.02 Changelog for a list of what's new in MaxScale 24.02 and prior versions."
