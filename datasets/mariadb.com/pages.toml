title = "MariaDB ColumnStore (Analytics) — MariaDB Documentation"
description = "MariaDB is the leading enterprise open source database with features previously only available in costly proprietary databases. Enterprise grade, wallet friendly."
full_description = '''MariaDB ColumnStore (Analytics)MariaDB Server (SQL Database Server)MariaDB SkySQL previous releaseMariaDB SkySQL DBaaSMariaDB SkySQLMariaDB SkySQL ObservabilityMariaDB SkySQL Cloud BackupMariaDB GeospatialMariaDB Xpand (Distributed SQL) This page is part of MariaDB's Documentation. Topics on this page: Overview Get Started Working with SkySQL Service Management Connect and Query Data Operations Security Launch-Time Selections Partner Integrations Latest Software Releases Table of Contents Additional Resources Latest Software Releases Documentation Topics Additional Resources SkySQL Services SkySQL Documentation Topics Resources Assistance Latest Software Releases Table of Contents Additional Resources Comments Overview MariaDB ColumnStore extends MariaDB Enterprise Server with distributed, columnar storage and a massively parallel processing (MPP) shared nothing architecture, transforming it into a standalone or distributed data warehouse for ad hoc SQL queries and advanced analytics without the need to create indexes. With MariaDB ColumnStore running in SkySQL you get a cloud data warehouse and DBaaS in one service. ColumnStore is available in new release of SkySQL through the ColumnStore Data Warehouse topology. For additional information, see MariaDB SkySQL DBaaS. MariaDB Enterprise Server is a premium version of MariaDB Community Server that runs in any cloud and includes additional enterprise features like: enhancements for commercial production deployment such as advanced audit capabilities and the MaxScale database proxy long-term maintenance and support backports to bring popular new features to customers running on older MariaDB Enterprise Server releases Companies who switch to MariaDB Enterprise Server from legacy databases save up to 90% of total database costs. Enterprise Server is available in new release of SkySQL through the Enterprise Server With Replica(s) topology or Enterprise Server Single Node topology. For additional information, see MariaDB SkySQL DBaaS. Enterprise Server is available in previous release of SkySQL through the Primary/Replica topology or Single Node Transactions topology. For additional information, see MariaDB SkySQL previous release. Release Notes Power Tier MariaDB SkySQL is a cloud database service (DBaaS) from MariaDB Corporation: MariaDB SkySQL delivers MariaDB Enterprise Server, MariaDB Xpand, and MariaDB ColumnStore for modern applications MariaDB SkySQL runs on expert-maintained cloud infrastructure Questions? See our FAQ or contact us A new SkySQL release is now available to explore. Detailed information is available in MariaDB SkySQL DBaaS documentation. This documentation covers the previous release of SkySQL. The previous release of SkySQL was last updated: 2022-08-02 (What's New?) MariaDB Xpand is chosen by developers when creating large, mission-critical, read/write scale applications which require ACID-level consistency and enterprise-grade reliability. Xpand combines the scalability of a NoSQL database with the robustness of a SQL database. As with MariaDB Enterprise Server and ColumnStore, Xpand is front-ended by MaxScale database proxy for high availability, disaster recovery and enhanced security. Xpand can be deployed in the cloud as a SkySQL database service on AWS or Google Cloud and runs across multiple public cloud regional centers and on-premise for multi-cloud and hybrid operations. Xpand is available in new release of SkySQL through the Xpand Distributed SQL topology. For additional information, see MariaDB SkySQL DBaaS. Xpand is available in previous release of SkySQL through the Distributed Transactions topology. For additional information, see MariaDB SkySQL previous release. MariaDB SkySQL DBaaS MariaDB SkySQL Observability MariaDB SkySQL Cloud Backup MariaDB Geospatial MariaDB SkySQL Observability. This page will redirect. if (window.pathInfo.silo == 'skysql-observability') location.href = '../skysql-dbaas/service-management/nr-monitoring/observability'; MariaDB SkySQL Cloud Backup is a backup and recovery solution offered by MariaDB. Features Release Notes Signup to enable Cloud Backup service Backup Management Agent Installation MariaDB Geospatial is available as a service in MariaDB SkySQL and on premises. With MariaDB's geospatial data service, you'll be able to: Publish (and manage) even Petabytes of geospatial data via REST APIs Create streaming web services for any application Protect your services with our geospatial security gateway Get your data to the people who need it Focus on your customers, not your infrastructure For next steps, see "Geospatial Data Service (Contact Us)". Get Started QuickstartQuickstart will get you up and running with MariaDB SkySQL. We'll launch a service, then perform a simple test from Java, Node.js, PHP, Python, or a desktop client. query, monitor, scale, and replicate data to another region. Working with SkySQL Register for a MariaDB ID Access SkySQL Portal Settings Notifications Billing Scale Fabric Choose a SkySQL Release Contact Support Service Management Service Launch Monitoring Service Details Self-Service Operations Autonomous Configuration Management Alerts Logs Service Availability (SLA) Connect and Query Client Connections Serverless Analytics Query Editor Notebook NoSQL Interface Data Operations Xpand Global Replication Backup/Restore Data Import / Data Load Data Export Replication Security User Management Firewall Private Connections SkySQL Portal Enterprise Authentication (SSO) Launch-Time Selections Workload Type Topology Cloud Provider Region Hardware Architecture Instance Size Power Tier Auto-Scaling of Nodes Auto-Scaling of Storage Storage Configuration Replica Count Xpand Node Count Software Version Service Name Disable SSL/TLS NoSQL Interface Partner Integrations MindsDB Partner Integration Qlik Partner Integration Striim Partner Integration Latest Software Releases Version Release Date MariaDB Enterprise Server 11.4.4-2 2025-01-16 Mari