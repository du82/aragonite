["https://mariadb.com/products/enterprise/galera-cluster"]
title = "MariaDB Galera Cluster Multimaster | MariaDB"
description = "MariaDB Galera Cluster multimaster synchronous replication for MariaDB Enterprise Server multi-node HA and scalability in local, WAN and cloud deployments."
full_description = '.mdb-section iframe { max-width: 100% !important; } [class*="bg-g-"], [class*="bg-g-"] h1, [class*="bg-g-"] h2, [class*="bg-g-"] h3, [class*="bg-g-"] p { color: #fff; } MariaDB Galera Cluster, an open source active-active, multimaster synchronous replication solution for MariaDB Enterprise Server in combination with MariaDB MaxScale, provides high availability, scalability and automated failover for mission-critical transactional workloads. Galera Cluster provides parallel replication and data consistency across all nodes and automatically manages the identification and removal of failed nodes as well as rejoining new or repaired nodes. With Galera Cluster, there’s no chance of lost transactions and significant replica lag or client latency. [class*="bg-g-"], [class*="bg-g-"] h1, [class*="bg-g-"] h2, [class*="bg-g-"] h3, [class*="bg-g-"] p { color: #fff; } Why choose Galera Cluster .basic-column .icon { font-size: 50px; } Fault tolerance If one or more MariaDB Enterprise Server nodes fail, the remaining nodes will continue to operate and failed nodes are automatically taken offline, repaired and reintroduced into the cluster – all without intervention from the application level or any developer intervention. Multimaster Unlike MariaDB primary/replica topologies that optimize for read-intensive applications, Galera Cluster is multimaster – all nodes accept write and read operations and synchronize to ensure data consistency across all nodes. .basic-column .icon { font-size: 50px; } Load balancing While MaxScale provides read/write splitting for parallel read operations with a single primary and multiple read replicas, Galera Cluster extends distributed load balancing and parallel processing to read and write operations, improving horizontal scale out. Low latency and improved performance Replicated nodes can be placed across a wide area network (WAN), allowing clients to be located closer to node connections thereby improving performance and reducing response times for end-user web services, particularly read operations. .testimonial-slider-bg .img-bg-cover{ max-height: 100%; min-height: 100%; object-fit: unset; } .slick-dots { text-align: center; } I would not hesitate in working again with MariaDB and would highly recommend them. Jan van der Venn, Chief Technology Officer, Greetz [class*="bg-g-"], [class*="bg-g-"] h1, [class*="bg-g-"] h2, [class*="bg-g-"] h3, [class*="bg-g-"] p { color: #fff; } Customer Stories .basic-column .icon { font-size: 50px; } Greetz’s successfully migrates from Oracle RAC to Galera Cluster Read Now Ingenico Financial Solutions provides high availability e-Money solutions with MariaDB Read Now [class*="bg-g-"], [class*="bg-g-"] h1, [class*="bg-g-"] h2, [class*="bg-g-"] h3, [class*="bg-g-"] p { color: #fff; } HIGH AVAILABILITY WITH MULTIMASTER CLUSTERING AND AUTOMATIC FAILOVER In the example topology below, a mission-critical transactional workload is supported by MariaDB through MariaDB MaxScale, Enterprise Server and Galera Cluster, deployed as a multimaster cluster, consisting of five database nodes and MaxScale to support front-end load balancing and automatic failover. .resource-block-bg .img-bg-cover { min-height: 100%; } Resources White Paper The Ultimate Guide to Database High Availability with MariaDB The Ultimate Guide to Database High Availability with MariaDB Learn More webinar Global Data Replication with Galera for Ansell Guardian Global Data Replication with Galera for Ansell Guardian Learn More webinar Under the Hood: Galera Cluster Under the Hood: Galera Cluster Learn More Get Started Download Enterprise Server Contact Us'
