description = "MariaDB is the leading enterprise open source database with features previously only available in costly proprietary databases. Enterprise grade, wallet friendly."
full_description = "MariaDB Connector/Node.js This page is part of MariaDB's Documentation. The parent of this page is: MariaDB ConnectorsProgramming Languages Topics on this page: Overview API-Specific Documentation Resources Overview Node.js developers can connect to MariaDB database products through a native MariaDB Connector. Using MariaDB Connector/Node.js you can connect to MariaDB database products to use and administer databases from within your Node.js application. Connector MariaDB Connector/Node.js Supported Versions MariaDB Connector/Node.js 3.3MariaDB Connector/Node.js 3.3 Programming Language JavaScript Programming Language Version Connector/Node.js 3.3: Node.js 18, 20 API Promise API Callback API Supports TLS Yes Supports Connection Pools Yes License GNU Lesser General Public License v2.1 API-Specific Documentation MariaDB Connector/Node.js is available through two distinct API's: Promise and Callback. Promise API The Promise API is an asynchronous API that is based on Promise and can be used to connect using MariaDB Connector/Node.js from within your Node.js application. Callback API The Callback API is an asynchronous API that is based on the traditional callback functions and can be used to connect using MariaDB Connector/Node.js from within your Node.js application. Callback API additionally provides compatibility with the mysql and mysql2 APIs. Resources Callback API Install MariaDB Connector/Node.js Promise API Release notesRelease notes Setup for Examples Upgrade"
