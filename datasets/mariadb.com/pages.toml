description = """
Profelis had been established in 2007 aiming to be an innovative company and to provide cost-effective solutions. Profelis develops software and also provides consulting services especially on the integration of free and open-source software, operating systems and database migration for Turkey’s major institutions and organizations. Profelis has international experience on the establishment of security systems, incident response, and design disaster recovery centers.
Some of the prominent products and services of Profelis:

SambaBox – Enterprise Directory Solution: A scalable, cost-effective and user-friendly directory solution, developed by Profelis.
PassBox – Password Reset Service: A fast, secure and easy password reset product, developed by Profelis.
Zimbra Profelis Edition: E-mail service that is based on Zimbra OSE, and developed by Profelis for corporate use.
Linux Operation Center: A comprehensive support and maintenance service for enterprises that use Linux on their servers.
Database Operation Center: A comprehensive support and maintenance service for companies that use PostgreSQL on their databases.
Zabbix Monitoring Service: A service for enterprises who need extensive and continuous system monitoring."""
