r-2 .circle .bar .progress{ background-color: #63bbb9; /* background: linear-gradient(90deg, rgb(14, 100, 136) 0%, rgb(150, 221, 207) 100%); */ background: linear-gradient(-269deg, #2F99A3 0%, #0E6488 20%, #003545 100%); } .counter-2 .circular .number{ color: #0E6488; } .counter-3 .circular .number{ color: #ABC74A; } .circle .left .progress{ z-index:1; animation: left 0.5s linear both; } @keyframes left{ 100%{ transform: rotate(180deg); } } .circle .right { transform: rotate(180deg); z-index:3; } .circle .right .progress{ animation: right 0.5s linear both; animation-delay:0.5s; } @keyframes right{ 100%{ transform: rotate(180deg); } } Join the Team That’s Revolutionizing the Database We are a diverse team that is passionate about building the most secure, reliable and trusted open source database. Our team is dedicated to providing the best support and services to our customers, and we have the brightest database engineers building new features for modern data management. 20+ const numbone = document.querySelector("#counter_01"); let counterOne = 0; setInterval(() => { if(counterOne == 20 ){ clearInterval(); }else{ counterOne+=1; numbone.textContent = counterOne + "+"; } }, 2); Countries 200+ const numb = document.querySelector("#counter_02"); let counter = 0; setInterval(() => { if(counter == 200 ){ clearInterval(); }else{ counter+=1; numb.textContent = counter + "+"; } }, 2); Employees 1 Mission Agile, Startup Culture Ask anyone on our team, “Why MariaDB?” and the answer is the same. We joined MariaDB to be part of an agile start-up company with a family ethos that is passionate about open source databases. Work with Smart, Motivated People We’ve brought together the brightest minds from companies like Oracle®, RedHat®, HP®, Sybase®, Nokia®, MySQL®, Sun® and Microsoft® to support a common goal – to enable our customers to unleash the power of their data. Global Perspective With offices and employees around the globe, we challenge each other to think broadly and be bold. We bring together a diverse set of backgrounds and experience to unite around a common mission – to build the best database that powers the most relied upon and heavily used applications around the world. .testimonial-slider-bg .img-bg-cover{ max-height: 100%; min-height: 100%; object-fit: unset; } With MariaDB, we get a fast, well-oiled and secure solution with top-notch support. William Wood, DBA expert and author of “Migrating to MariaDB” MariaDB’s technology provides us with the high availability and auto-failover capabilities we were searching for. Open Positions Engineering Senior C++ Database Engine Developer Remote -- Croatia Senior C++ Database Engine Developer Remote - Bulgaria Senior C++ Database Engine Developer Remote - Serbia Senior Server Database Engineer Remote - India Server Database Engineer Bengaluru - Office G&A Financial Analyst Bengaluru - Office Lead Financial Analyst Remote - US Senior Corporate Accounting Manager Remote - US MariaDB Talent Community MariaDB Talent Community - General Application Remote -- World Wide Marketing Senior Manager, Product Marketing Milpitas, CA - HQ Product Product Manager Bengaluru - Office Sales OEM Account Executive Remote - US Senior Manager, Global Revenue Enablement Austin, TX - Office Enterprise Account Executive Remote - India Partner Manager Remote - Singapore Business Development Representative (Bilingual) London, England - Office Commercial Account Executive (Nordics) London, England - Office Account Executive (Public Sector) Remote - US Business Development Representative (BDR) Remote - US Director, Enterprise Accounts - North America Austin, TX - Office Regional Account Manager Remote - US Sales Engineer Remote - Singapore Senior Sales Engineer Remote - India Customer Success Engineer (Bilingual) London, England - Office Support and Services Enterprise Architect Singapore Professional Services Consultant Remote - Serbia Professional Services Consultant Remote -- Croatia Professional Services Consultant Remote - Bulgaria Professional Services Consultant Austin, TX - Office Professional Services Consultant Remote - US Senior Support Engineer Remote - Bulgaria Don’t see what you’re looking for? Submit a general application and let us know why you’re a good fit for MariaDB. Maybe your dream job is just about to be posted. Submit a General Application MariaDB does not accept unsolicited resumes from staffing companies, including recruitment agencies and / or head hunting companies. Any recruiter, person or organization that submits a resume to this career site or directly to MariaDB does so with knowledge that the candidate’s CV becomes MariaDB’s property. MariaDB has the right to hire that applicant at its sole discretion without the recruiter, person or organization receiving any fee. Details of all applications are kept on file for six months from the date of application. MariaDB is an equal opportunities employer.'
