title = "Enterprise Database Products | MariaDB"
description = "Learn more about MariaDB’s enterprise database products that provide organizations operational agility, enterprise reliability & collaborative innovation."
full_description = '.mdb-section iframe { max-width: 100% !important; } [class*="bg-g-"], [class*="bg-g-"] h1, [class*="bg-g-"] h2, [class*="bg-g-"] h3, [class*="bg-g-"] p { color: #fff; } Enterprise-Grade without the Enterprise Cost MariaDB offers a complete database solution that delivers best-in-class performance, data security, replication, clustering and high availability for production workloads. Get started within minutes with a database platform that provides the peace of mind organizations need to power mission-critical applications at a fraction of the cost of proprietary databases. MariaDB Enterprise Platform consists of MariaDB Enterprise Server, MariaDB MaxScale, MariaDB ColumnStore, MariaDB Enterprise Cluster (powered by Galera), connectors, and tools as well as support and services that ensure customers can grow their business, confidently. .basic-column .icon { font-size: 50px; } Enterprise Server MariaDB Enterprise Server is our core open source database that supports transactional, analytical and mixed workloads for relational, JSON and vector data models. It runs anywhere – public, private and hybrid cloud. Learn More MaxScale MariaDB MaxScale is an advanced database proxy for MariaDB databases, providing them with enterprise high availability, scalability and security while abstracting away the underlying database infrastructure to simplify app development and administration. Learn More ColumnStore MariaDB ColumnStore extends MariaDB Server with distributed, columnar storage and massively parallel processing (MPP), transforming it into a standalone or distributed data warehouse for interactive, ad hoc analytics without the need to create indexes. Learn More Enterprise Cluster MariaDB Enterprise Cluster, an open source active-active, multi-master synchronous replication solution that provides high availability, scalability and automated failover for mission-critical transactional workloads. Learn More [class*="bg-g-"], [class*="bg-g-"] h1, [class*="bg-g-"] h2, [class*="bg-g-"] h3, [class*="bg-g-"] p { color: #fff; } Built for the community .basic-column .icon { font-size: 50px; } Community Server Intended for non-production applications and downloaded over 1 billion times, MariaDB Community Server is one of the most popular database servers. Created by MySQL’s original developers, MariaDB is compatible with MySQL and Oracle and is the default choice over MySQL in Linux distributions. Learn More Get Started Download MariaDB Contact Us'
