nsultant Remote - Bulgaria Professional Services Consultant Austin, TX - Office Professional Services Consultant Remote - US Senior Support Engineer Remote - Bulgaria Don’t see what you’re looking for? Submit a general application and let us know why you’re a good fit for MariaDB. Maybe your dream job is just about to be posted. Submit a General Application MariaDB does not accept unsolicited resumes from staffing companies, including recruitment agencies and / or head hunting companies. Any recruiter, person or organization that submits a resume to this career site or directly to MariaDB does so with knowledge that the candidate’s CV becomes MariaDB’s property. MariaDB has the right to hire that applicant at its sole discretion without the recruiter, person or organization receiving any fee. Details of all applications are kept on file for six months from the date of application. MariaDB is an equal opportunities employer.'
