["https://mariadb.com/about-us/partners/hasura"]
title = "Hasura | MariaDB"
description = """
With the rise of cloud-native and rich frontend frameworks, developers can now build, ship and iterate on applications extremely fast. However, data and event delivery have emerged as the key remaining bottleneck where teams spend months architecting and building custom backends and APIs to enable their developers to get on with the business of building digital products.
Hasura makes data access easy, by instantly composing GraphQL and REST APIs that are backed by a customer’s databases and services so that developers (or API consumers) can get productive immediately. The nature of GraphQL itself and Hasura’s dynamic approach combine to make integration and iteration incredibly simple. Hasura’s latest integration for MySQL and MariaDB enables even more developers to instantly generate APIs on top of the data critical to their applications, reducing backend development cycles by ~75% and speeding up time to market for digital products built on MariaDB SkySQL."""
