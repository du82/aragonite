full_description = '''MariaDB Deployment This page is part of MariaDB's Documentation. The parent of this page is: MariaDB ColumnStore (Analytics)MariaDB Server (SQL Database Server)MariaDB Xpand (Distributed SQL) Topics on this page: Overview Transactional (OLTP) Transactional (OLTP) Analytical (OLAP, Data Warehousing, DSS) Hybrid Workloads Spider Topologies Single Node Topologies MariaDB Community Server MariaDB Community Server with ColumnStore MariaDB Enterprise ColumnStore with Local Storage MariaDB Enterprise ColumnStore with Object Storage MariaDB Enterprise Server Deployment Practices Deployment Methods Support Overview Procedures are provided to download, install, set-up, configure, and test MariaDB products. Upgrade instructions are also available. MariaDB products can be deployed in many different topologies. The topologies on this page are representative. MariaDB products can be deployed to form other topologies, leverage advanced product capabilities, or combine the capabilities of multiple topologies. Transactional (OLTP) Topology Diagram Features Xpand Topology Distributed SQL Elastic scale-out and scale-in Highly available and fault tolerant Automated provisioning of new nodes Scales reads and writes Synchronous replication with automatic rebalancing Xpand 5.3, MaxScale 2.5 Xpand 6.0, MaxScale 6 Xpand 6.1, MaxScale 22.08 Transactional (OLTP) Topology Diagram Features Primary/Replica Topology MariaDB Replication Highly available Asynchronous or semi-synchronous replication Automatic failover via MaxScale Manual provisioning of new nodes from backup Scales reads via MaxScale Enterprise Server 10.3+, MaxScale 2.5+ Galera Cluster Topology Multi-Primary Cluster Powered by Galera for Transactional/OLTP Workloads InnoDB Storage Engine Highly available Virtually synchronous, certification-based replication Automated provisioning of new nodes (IST/SST) Scales reads via MaxScale Enterprise Server 10.3+, MariaDB Enterprise Cluster (powered by Galera), MaxScale 2.5+ Analytical (OLAP, Data Warehousing, DSS) Topology Diagram Features ColumnStore Object Storage Topology Columnar storage engine with S3-compatible object storage Highly available Automatic failover via MaxScale and CMAPI Scales reads via MaxScale Bulk data import Enterprise Server 10.5, Enterprise ColumnStore 5, MaxScale 2.5 Enterprise Server 10.6, Enterprise ColumnStore 23.02, MaxScale 22.08 ColumnStore Shared Local Storage Topology Columnar storage engine with shared local storage Highly available Automatic failover via MaxScale and CMAPI Scales reads via MaxScale Bulk data import Enterprise Server 10.5, Enterprise ColumnStore 5, MaxScale 2.5 Enterprise Server 10.6, Enterprise ColumnStore 23.02, MaxScale 22.08 Hybrid Workloads Topology Diagram Features HTAP Topology Single-stack hybrid transactional/analytical workloads ColumnStore for analytics with scalable S3-compatible object storage InnoDB for transactions Cross-engine JOINs Enterprise Server 10.5, Enterprise ColumnStore 5, MaxScale 2.5 Enterprise Server 10.6, Enterprise ColumnStore 23.02, MaxScale 22.08 Spider Topologies Topology Diagram Features Spider Federated Topology Read from and write to tables on remote ES nodes Spider Node uses Spider storage engine for Federated Spider Tables Federated Spider Table is a "virtual" table Spider uses MariaDB foreign data wrapper to query Data Table on Data Node Data Node uses non-Spider storage engine for Data Tables Supports transactions Enterprise Server 10.3+, Enterprise Spider Spider Sharded Topology Shard tables for horizontal scalability Spider Node uses Spider storage engine for Sharded Spider Tables Sharded Spider Table is a partitioned "virtual" table Spider uses MariaDB foreign data wrapper to query Data Tables on Data Nodes for each partition Data Node uses non-Spider storage engine for Data Tables Supports transactions Enterprise Server 10.3+, Enterprise Spider Single Node Topologies MariaDB Community Server MariaDB Community Server 10.5 MariaDB Community Server 10.6 MariaDB Community Server with ColumnStore MariaDB Community Server with ColumnStore 5 MariaDB Community Server with ColumnStore 6 MariaDB Enterprise ColumnStore with Local Storage MariaDB Enterprise ColumnStore 5 with Local Storage MariaDB Enterprise ColumnStore 22.08 with Local Storage MariaDB Enterprise ColumnStore 23.10 with Local Storage For high availability and scalability, instead see "ColumnStore Shared Local Storage Topology". MariaDB Enterprise ColumnStore with Object Storage MariaDB Enterprise ColumnStore 5 with Object Storage MariaDB Enterprise ColumnStore 22.08 with Object Storage MariaDB Enterprise ColumnStore 23.10 with Object Storage For high availability and scalability, instead see "ColumnStore Object Storage Topology". MariaDB Enterprise Server MariaDB Enterprise Server 10.2 MariaDB Enterprise Server 10.3 MariaDB Enterprise Server 10.4 MariaDB Enterprise Server 10.5 MariaDB Enterprise Server 10.6 MariaDB Enterprise Server 11.4 Deployment Practices Best Practices Customer Download Token Supply Chain Security Deployment Methods Deploy from Binary Tarball Deploy from Package Tarball Deploy from Repository (APT, YUM, ZYpp) Deploy from Repository Mirror Deploy with Docker Deploy in the cloud on MariaDB SkySQL DBaaS Support Obtaining support from MariaDB Corporation Compatibility'''
