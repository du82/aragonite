full_description = "#home-dg .left-half-hover { background-image: linear-gradient(-2deg, #ABC74A 0%, #D4ED7E 100%); z-index: 2; } #home-dg .right-half-hover { background-image: -webkit-gradient(linear, left bottom, left top, from(#82CEC2), color-stop(72%, #96DDCF)); background-image: linear-gradient(0deg, #82CEC2 0%, #96DDCF 72%); z-index: 2; } .z-index-5 { z-index: 5; } @media (min-width: 1200px) { .dg-cell-inner span { font-size: 2.125rem; } } @media (max-width: 767.98px) { #home-dg .left-half-hover, #home-dg .right-half-hover { display: none !important; } } Webinar On Demand Real-World Testing, Zero Production Risk: New Features with MariaDB Enterprise Platform Watch Now Webinar On Demand MariaDB Databases 101 Watch Now MariaDB database software is the heartbeat of critical services people rely on every day MariaDB Products .card-flipper-hover{ height: 380px; } .card-flipper-hover .product-card-side-2-inner { opacity: 0; z-index: -1; transition: opacity .25s ease-in-out; } .card-flipper-hover:hover .product-card-side-1-inner { display: none; } .card-flipper-hover:hover .product-card-side-2-inner { opacity: 1; z-index: 9; } MariaDB Enterprise MariaDB Enterprise The most secure and stable way to run MariaDB databases for commercial use cases. MariaDB Enterprise Server is a premium version of MariaDB Community Server. It runs anywhere – public, private and hybrid cloud. It supports transactional, analytical, and mixed workloads for relational and JSON data models. Popular new features are often backported, allowing access to new capabilities faster without having to upgrade to new versions. Explore Enterprise Server MariaDB Community MariaDB Community MariaDB Server is a foundational element for applications used by people everyday. It’s a favorite among developers for its ease of use, flexibility and unrivaled innovation in open source software. Downloaded over 1 billion times and the default over MySQL in Linux distributions, the MariaDB database is an icon in the database industry. Explore Community Server Availability is critical for us, but it’s more than just availability; it’s…about the people behind MariaDB. MariaDB’s technology provides us with the high availability and auto-failover capabilities we were searching for. Webinar Modernizing the Use of Open Source Databases Modernizing the Use of Open Source Databases Watch Now Migration Guide Migrate from MySQL to MariaDB Migrate from MySQL to MariaDB Read Now Migration Guide Migrate from Oracle to MariaDB Migrate from Oracle to MariaDB Read Now Dive Deeper into MariaDB Resources Why MariaDB? We are the developers and experts behind the wildly popular open source relational MariaDB database. Our database products are cloud-native and deliver the high availability and scalability global enterprises rely on to run their business. MariaDB meets customers where they are, with flexible deployment options, support for multiple workloads (transactions and analytics), multiple data types (relational and JSON) and advanced enterprise capabilities – all at a fraction of the cost of legacy databases. See what MariaDB can do for you Resources Contact Us"
