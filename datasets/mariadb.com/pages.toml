["https://mariadb.com/de/cookie-policy"]
title = "Cookie Policy | MariaDB"
description = "Definition of MariaDB website cookies and their uses."
full_description = '.mdb-section iframe { max-width: 100% !important; } [class*="bg-g-"], [class*="bg-g-"] h1, [class*="bg-g-"] h2, [class*="bg-g-"] h3, [class*="bg-g-"] p { color: #fff; } Effective: May 23, 2018 At MariaDB, we believe in being transparent about how we collect and use data. This policy provides information about how and when we use cookies for these purposes. What is a cookie? Cookies are small text files sent by us to your computer or mobile device. They are unique to your account or your browser. Session-based cookies last only while your browser is open and are automatically deleted when you close your browser. Persistent cookies last until you or your browser delete them or until they expire. Web beacons are small graphic images or other web programming code which may be included in the website and any of our email messages. Does MariaDB use cookies? Yes. MariaDB uses cookies and similar technologies like single-pixel gifs and web beacons. We use both session-based and persistent cookies. MariaDB sets and accesses our own cookies on the domains operated by MariaDB and its corporate affiliates (collectively, the “Sites”). In addition, we use third-party cookies, like Google Analytics. Some cookies may not be related to MariaDB. When you visit a page on our site with content embedded from, for example, YouTube or Facebook, cookies may be stored on your computer from these websites. We do not control the dissemination of such third-party cookies and you should check these third-party websites for more information about these cookies and their privacy policy. How is MariaDB using cookies? Some cookies are associated with your account and personal information in order to remember that you are logged in and which area of the site you are logged into. Other cookies are not tied to your account but are unique and allow us to carry out analytics and customization, among other similar things. Cookies can be used to recognize you when you visit a Site or use our Services, remember your preferences, and give you a personalized experience that’s consistent with your settings. Cookies also make your interactions faster and more secure. Uses of cookies We may use cookies and web beacons for the following purposes: Necessary cookies for a properly functioning website (authentication, security, etc): If you’re signed in to our Services and Sits, cookies help us show you the right information you are entitled to see as well as personalize your experience. We use cookies to enable and support our security features, and to help us detect malicious activity. Preferences, features and services: Cookies can tell us which language you prefer and what your communications preferences are. They can help you fill out forms on our Sites more easily. They also provide you with features, insights, and customized content. Statistics, performance, analytics and research: Cookies help us learn how well our Sites and Services perform. We also use cookies to understand, improve, and research products, features, and services, including to create logs and record when you access our Sites and Services from different devices, such as your work computer or your mobile device. Marketing: We may use cookies to help us deliver marketing campaigns and track their performance (e.g., a user visited our Help Center and then made a purchase). Similarly, our partners may use cookies to provide us with information about your interactions with their services, but use of those third-party cookies would be subject to the service provider’s policies. We may use cookies to help us deliver marketing campaigns and track “their performance” (e.g., a user visited our Help Center and then made a purchase). Similarly, our partners may use cookies to provide us with information about your interactions with their services, but use of those third-party cookies would be subject to the service provider’s policies. How are cookies used for advertising purposes? Cookies and other ad technology such as beacons, pixels, and tags help us market more effectively to users that we and our partners believe may be interested in MariaDB. They also help provide us with aggregated auditing, research, and reporting, and know when content has been shown to you. Visit our Cookie Settings page to view all cookies that are being used on our site. What can you do if you don’t want cookies to be set or want them to be removed, or if you want to opt out of interest-based targeting? MariaDB has provided a cookie consent notice on our website to comply with the General Data Protection Regulation in the European Union. Visitors coming from these countries will see a disclosure notice when visiting our website for the first time, or if they don’t already have cookies set from our website(s). These visitors will need to consent to the usage of cookies and can view details on these cookies as well as opt in or out of non-necessary cookies. You may view your settings or change your consent at any time on our Cookie Settings page. In general, for any user, you can control cookies on your computer through your web browsers that give you the ability to manage cookies to suit you. In some browsers you can set up rules to manage cookies on a site-by-site basis, giving you more fine-grained control over your privacy. What this means is that you can disallow cookies from all sites except those that you trust. Google Chrome Internet Explorer Mozilla Firefox Safari (Desktop) Safari (Mobile) Android Browser Opera Opera Mobile For other browsers, please consult the documentation that your browser manufacturer provides. You may opt-out of third-party cookies from Google Analytics on its website. You can opt out of interest-based targeting provided by participating ad servers through the Digital Advertising Alliance (http://youradchoices.com). In addition, on your iPhone, iPad or Android, you can change your device settings to control whether you see online interest-based ads. If you are not in the EU and you do not consent to our use of the cookies, you must disable the cookies by deleting them or changing your cookie settings on your computer, mobile device or other device or you must stop using the Services. If you limit the ability of websites and applications to set cookies, you may worsen your overall user experience and/or lose the ability to access the services, since it will no longer be personalized to you. It may also stop you from saving customized settings, like login information. Does MariaDB respond to “do not track” signals? Our Sites and Services do not collect personal information about your online activities over time and across third-party websites or online services. Therefore, “do not track” signals transmitted from web browsers do not apply to our Sites or Services, and we do not alter any of our data collection and use practices upon receipt of such a signal.'
