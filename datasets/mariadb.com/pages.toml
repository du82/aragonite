title = "MariaDB: The database for all | MariaDB"
description = "MariaDB is one of the most popular open source databases in the world. Learn about MariaDB: the cloud-native relational database that’s been downloaded over 1B times."
full_description = '''.grey-to-white { background-image: -webkit-gradient(linear, left top, left bottom, color-stop(6%, #fff), color-stop(98%, #dbdbdb)); background-image: linear-gradient(-180deg, #fff 6%, #dbdbdb 98%); } #we-are-mariadb h2, #careers-teaser h2 { color: #fff; } #customers h2 { color: #424F62; } #photo-gallery { line-height: 0; -webkit-column-count: 5; -webkit-column-gap: 0px; -moz-column-count: 5; -moz-column-gap: 0px; column-count: 5; column-gap: 0px; background-color: #000; } .bg-wawe { top: -20%; } .circular{ height:250px; width: 250px; position: relative; /* transform:scale(2.5); -webkit-filter: blur(0px); */ } .circular .inner{ position: absolute; z-index: 6; top: 50%; left: 50%; height: 200px; width: 200px; margin: -100px 0 0 -100px; background: #fff; border-radius: 100%; } .circular .number{ position: absolute; top:50%; left:50%; transform: translate(-50%, -50%); z-index:7; font-size:65px; color:#2F99A3; } .circular .bar{ position: absolute; height: 100%; width: 100%; background: transparent; -webkit-border-radius: 100%; clip: rect(0px, 250px, 250px, 125px); } .circle .bar .progress{ position: absolute; height: 100%; width: 100%; -webkit-border-radius: 100%; clip: rect(0px, 125px, 250px, 0px); background-color: #63bbb9; /* background: linear-gradient(90deg, rgb(14, 100, 136) 0%, rgb(150, 221, 207) 100%); */ background: linear-gradient(-269deg, #5CC9D0 0%, #2F99A3 20%, #2F99A3 100%); } .counter-2 .circle .bar .progress{ background-color: #63bbb9; /* background: linear-gradient(90deg, rgb(14, 100, 136) 0%, rgb(150, 221, 207) 100%); */ background: linear-gradient(-269deg, #2F99A3 0%, #0E6488 20%, #003545 100%); } .counter-2 .circular .number{ color: #0E6488; } .counter-3 .circular .number{ color: #ABC74A; } .circle .left .progress{ z-index:1; animation: left 0.5s linear both; } @keyframes left{ 100%{ transform: rotate(180deg); } } .circle .right { transform: rotate(180deg); z-index:3; } .circle .right .progress{ animation: right 0.5s linear both; animation-delay:0.5s; } @keyframes right{ 100%{ transform: rotate(180deg); } } Databases are key to the success of any business. They are the heartbeat of all applications, whether it’s mobile, web or IoT. If you’re using a cellphone, filling a prescription or making a financial transaction, you will find a MariaDB database behind it. With over 1 billion downloads, nearly 200,000 open source contributions and by reaching over 1 billion users through Linux distributions, MariaDB is not only serving the relational database market, we are helping to shape its future. Who we are With headquarters in Silicon Valley and Ireland, MariaDB collaborates with customers to solve their data storage and access challenges at a fraction of the cost of legacy databases. MariaDB has more than 600 customers around the world. 1B+ const numb = document.querySelector("#counter_01"); let counter = 0; setInterval(() => { if(counter == 1 ){ clearInterval(); }else{ counter+=1; numb.textContent = counter + ""; } }, 2); DOWNLOADS MariaDB has been downloaded over 1 billion times 600+ const numbTwo = document.querySelector("#counter_02"); let counterTwo = 0; setInterval(() => { if(counterTwo == 600 ){ clearInterval(); }else{ counterTwo+=1; numbTwo.textContent = counterTwo + "+"; } }, 2); CUSTOMERS Over 600 customers trust their business to MariaDB 200+ const numbThree = document.querySelector("#counter_03"); let counterThree = 0; setInterval(() => { if(counterThree == 200 ){ clearInterval(); }else{ counterThree+=1; numbThree.textContent = counterThree + "+"; } }, 2); EMPLOYEES We have over 200 people contributing to our success Our history The MariaDB database was born after Oracle acquired MySQL. With the original core MySQL team, we have added functionality to the MariaDB database that competes with legacy database systems like Oracle at a fraction of the cost. We have added columnar analytics, JSON functionality and Oracle compatibility, and we offer a fully managed cloud database service that offers the full breadth of MariaDB database solutions supporting private, public, hybrid and multicloud strategies. Today, the MariaDB database is recognized as a distinct database around the world. MariaDB is the new “M” in the LAMP stack, it’s the default over MySQL in the majority of Linux distributions, it’s replacing Oracle and other legacy databases at increasing rates and it’s available in every cloud. MariaDB is everywhere. From startups to global companies, join these leading brands that trust their business to MariaDB. Browse Customer Stories Industry Recognition #homepage-slider .flip-card-inner-top { border-top-left-radius: 14px; border-top-right-radius: 14px; } #homepage-slider .icon-arrow-left:before { font-weight: bolder; } .flip-card-inner .slide-title { margin-bottom: 35px; } .flip-card-inner .flip-card-padding { padding-bottom: 55px; padding-top: 60px; padding-left: 20px; padding-right: 20px; } .award-img-wrap { height: 200px; } .award-img-wrap img { max-height: 100%; } .award-sub-title { font-size: 1.125rem; } MariaDB makes DBTA's Big Data 50 List MariaDB is a "Leader" in the G2 Grid for Relational Databases MariaDB Careers Be part of the exceptional team building the database for all. MariaDBers for the most part work remotely with several hubs that offer a space for collaboration and face-to-face engagement. We offer many opportunities throughout the year for team building and skills development. Come work with us! View Positions WITH an ocean of possibilities, See what you can do with MariaDB. Resources Contact Us'''
