["https://mariadb.com/products/maxscale"]
title = "MariaDB MaxScale Database Proxy | MariaDB"
description = "MariaDB MaxScale is an advanced database proxy, providing high availability, scalability, security and integration services. Try MaxScale today!"
full_description = '.mdb-section iframe { max-width: 100% !important; } [class*="bg-g-"], [class*="bg-g-"] h1, [class*="bg-g-"] h2, [class*="bg-g-"] h3, [class*="bg-g-"] p { color: #fff; } Run in Production with Confidence MariaDB MaxScale is an essential element to any production database environment. If you are looking for enterprise high availability, scalability, security and integration services, MaxScale with MariaDB Enterprise Server is your key to success. [class*="bg-g-"], [class*="bg-g-"] h1, [class*="bg-g-"] h2, [class*="bg-g-"] h3, [class*="bg-g-"] p { color: #fff; } What are the Key Elements of MaxScale? MariaDB MaxScale is an advanced database proxy for MariaDB Enterprise Server that lets you avoid downtime, provide consistent performance, stop denial-of-service-attacks and includes NoSQL and stream data integrations. Key elements of MaxScale include: .basic-column .icon { font-size: 50px; } Automatic failover Orchestrates primary and replica databases transparently to applications with automatic promotion and connection migration in the event of a failure or outage. Flexible database architecture options Use MaxScale with MariaDB Server, MariaDB Server with ColumnStore for analytics or MariaDB Enterprise Cluster (powered by Galera) for multi-master clustering. SQL aware load balancer Achieve read/write splits seamlessly and achieve horizontal scalability. .basic-column .icon { font-size: 50px; } Built-in memory caching Improve application performance by avoiding latency and reducing query delays. Workload capture and replay Identify potential issues without impacting production by replaying a full production workload on a test system. Diff router Run workloads to multiple database servers to assess system behavior without the need to move data to test environments. [class*="bg-g-"], [class*="bg-g-"] h1, [class*="bg-g-"] h2, [class*="bg-g-"] h3, [class*="bg-g-"] p { color: #fff; } MaxScale Capabilities Unmatched performance with built-in high availability MaxScale includes several high availability features such as automatic failover, transaction replay, connection migration, session restore and more. With these powerful features, application users won’t see service interruptions if an infrastructure failure happens. Watch a demonstration of automatic failover with MaxScale https://mariadb.com/wp-content/uploads/2024/02/mariadb-maxscale-high-availability-automatic-failover-demo.mp4 Effortless and transparent read scaling MaxScale features a Read/Write Split Router for query-based load balancing. MaxScale also includes cooperative locking, which allows you to scale up to multiple MaxScale instances and eliminate a single point of failure without causing conflict. These scalability features make your environment far more adaptable to changes, meaning developers without database experience can easily scale their environments up or down as needed. Read more about MaxScale’s Read/Write Split Router GO TO DOCUMENTATION Strengthen your database security MaxScale includes TLS encryption and query throttling to limit the maximum query frequency of a database session. This feature prevents rogue sessions (client-side errors) and DDoS attacks. Learn How to Secure MaxScale For A Worry-Free Ultra-Secure Environment https://mariadb.com/wp-content/uploads/2024/01/mariadb-maxscale-security.mp4 Manage your database infrastructure from a single location With MaxScale, admins can easily understand and change their database infrastructure. They can perform transparent topology changes, such as promoting/demoting replicas or executing a manual failover. MaxScale also enables single-click replica rebuild. MaxScale also features a robust web interface for monitoring your database configuration with dashboards, visual maps, logs, diagnostics and more. Watch A Demo of MaxScale’s User-Friendly GUI https://mariadb.com/wp-content/uploads/2024/01/mariadb-maxscale-gui-demo.mp4 Simplify your database management with flexible tools MaxScale includes performance testing tools such as workload capture replay and diff router that allows alternatives to analyzing your system, whether in test environments or directly against the server. [class*="bg-g-"], [class*="bg-g-"] h1, [class*="bg-g-"] h2, [class*="bg-g-"] h3, [class*="bg-g-"] p { color: #fff; } Integrations that Fit Any Use Case We engineered MaxScale with an extensible architecture to easily support plugins and third-party functionality. Here are a few key integrations available with MaxScale: .basic-column .icon { font-size: 50px; } Converting MongoDB NoSQL With MaxScale, you can use MariaDB Enterprise Server as the backend of an application with a MongoDB client library. This integration makes converting from NoSQL protocol commands into the equivalent SQL simple. Caching for active transactions To maintain consistent performance, MaxScale automatically caches active transactions, either in-memory or with shared storage such as Redis or Memcached. Kafka streaming MaxScale makes it simple to publish data changes to external systems with Kafka. It reads data changes in MariaDB Enterprise Server, converts them into JSON objects and then streams them to a Kafka broker. .resource-block-bg .img-bg-cover { min-height: 100%; } Resources White Paper The Ultimate Guide to Database High Availability with MariaDB The Ultimate Guide to Database High Availability with MariaDB Learn More Datasheet MariaDB MaxScale MariaDB MaxScale Learn More webinar Maximizing MariaDB MaxScale: Effortless Database High Availability, Simple Setup Maximizing MariaDB MaxScale: Effortless Database High Availability, Simple Setup Learn More Get Started Download MaxScale Contact Us'
