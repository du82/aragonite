["https://mariadb.com/products/enterprise"]
title = "Production-Grade Open Source Database: MariaDB Enterprise | MariaDB"
description = "Learn why MariaDB Enterprise is the production-grade open source database for hybrid transactional / analytical processing at scale. One database. Any workload."
full_description = '''.mdb-section iframe { max-width: 100% !important; } .page-sub-nav a, .page-sub-nav a:visited { -webkit-transition: color 150ms ease-in-out; transition: color 150ms ease-in-out; } .page-sub-nav a:hover { color: #0e6488 !important; } .page-sub-nav ul li:not(:last-child)::after { position: absolute; content: ''; width: 1px; height: 18px; background-color: #424f62; top: 7px; right: 0; } Overview Components Capabilities Use Cases Comparison [class*="bg-g-"], [class*="bg-g-"] h1, [class*="bg-g-"] h2, [class*="bg-g-"] h3, [class*="bg-g-"] p { color: #fff; } A DATABASE Solution YOU CAN BET YOUR BUSINESS ON MariaDB Enterprise Platform is engineered to deliver best-in-class performance, data security, replication, clustering and high availability for production workloads in any cloud – private, public, hybrid or multicloud. MariaDB Platform consists of MariaDB Enterprise Server, MariaDB MaxScale, MariaDB ColumnStore and MariaDB Enterprise Cluster (powered by Galera). .basic-column .icon { font-size: 50px; } Enterprise Server MariaDB Enterprise Server is our core open source database that supports transactional, analytical and mixed workloads for relational, JSON and vector data models. It runs anywhere – public, private and hybrid cloud. Learn More MaxScale MariaDB MaxScale is an advanced database proxy for MariaDB databases, providing customers with enterprise high availability, scalability and security while abstracting away the underlying database infrastructure to simplify app development and administration. Learn More .basic-column .icon { font-size: 50px; } ColumnStore MariaDB ColumnStore extends MariaDB Server with distributed, columnar storage and massively parallel processing (MPP), transforming it into a standalone or distributed data warehouse for interactive, ad hoc analytics without the need to create indexes. Learn More Enterprise Cluster MariaDB Enterprise Cluster, an open source active-active, multi-master synchronous replication solution that provides high availability, scalability and automated failover for mission-critical transactional workloads. Learn More [class*="bg-g-"], [class*="bg-g-"] h1, [class*="bg-g-"] h2, [class*="bg-g-"] h3, [class*="bg-g-"] p { color: #fff; } Capabilities .basic-column .icon { font-size: 50px; } Scalability Scale out databases/data warehouses with parallel query and scale out reads with replication or multi-writer clustering. Learn More High availability Maintain continuous availability and hide failures from applications using multi-writer clustering and zero-interruption failover features such as transaction replay. Learn More Disaster recovery Recover from accidental/malicious data loss with MariaDB Flashback (i.e., online rollback), and be prepared for outages by taking online, non-blocking backups (full and incremental). Learn More .basic-column .icon { font-size: 50px; } Security Prevent data breaches and DDoS attacks, while protecting sensitive/personal information with full end-to-end encryption, dynamic data masking, query throttling and fine-grained privileges. Learn More Oracle compatibility Take advantage of Oracle Database and PL/SQL compatible data types, sequences, triggers and stored procedures to simplify migration. Learn More JSON + Relational Data Enjoy greater schema flexibility and faster development with hybrid relational/JSON data models, storing data as JSON and querying it with a complete set of JSON functions. Learn More .basic-column .icon { font-size: 50px; } Vector Vector Search is a new feature of MariaDB Enterprise Server that turns it into a relational vector database for AI applications. Natively integrated, it enables retrieval of complex data types without the need to integrate multiple databases. [class*="bg-g-"], [class*="bg-g-"] h1, [class*="bg-g-"] h2, [class*="bg-g-"] h3, [class*="bg-g-"] p { color: #fff; } Use Cases .basic-column .icon { font-size: 50px; } Transactions Deploy as a replicated or clustered database (relational, document or hybrid) for fast, reliable and scalable transaction processing using modern SQL and Oracle Database compatibility. Learn More Analytics Deploy as a standalone or distributed data warehouse for interactive analytics using a columnar data format, and support for low-cost object storage in the cloud. Learn More Smart transactions Deploy as a hybrid database with row and columnar storage to deliver insightful customer experiences by infusing standard transactions with more powerful, real-time analytics. Learn More [class*="bg-g-"], [class*="bg-g-"] h1, [class*="bg-g-"] h2, [class*="bg-g-"] h3, [class*="bg-g-"] p { color: #fff; } Comparison MariaDB enterprise database solutions replace enterprise open source and proprietary databases in businesses every day, from growing startups to the largest Fortune 500 and Global 2000 companies in the world. With more advanced features and reliability than other enterprise open source databases, and more innovation that proprietary databases, real businesses choose MariaDB. .basic-column .icon { font-size: 50px; } Enterprise open source MariaDB is the leader in enterprise open source databases, with unique innovations such as scalable transactions and columnar storage for analytics, world-class support and proven reliability. See the Comparison Proprietary MariaDB provides customers with the same high availability, disaster recovery and security features found in proprietary databases so they can invest in development instead of expensive licensing and fees. See the Comparison Get Started Download Enterprise Platform Contact Us'''
