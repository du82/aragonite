full_description = '.mdb-section iframe { max-width: 100% !important; } [class*="bg-g-"], [class*="bg-g-"] h1, [class*="bg-g-"] h2, [class*="bg-g-"] h3, [class*="bg-g-"] p { color: #fff; } MariaDB Community Server is one of the most popular database servers in the world. The MariaDB database has been downloaded over 1 billion times and is the default over MySQL in the Linux distributions. Created by MySQL’s original developers, MariaDB is compatible with MySQL and Oracle, and is guaranteed to always be open source. Download Community Server [class*="bg-g-"], [class*="bg-g-"] h1, [class*="bg-g-"] h2, [class*="bg-g-"] h3, [class*="bg-g-"] p { color: #fff; } Key Features .basic-column .icon { font-size: 50px; } Modern SQL Support for modern SQL features such as common table expressions (CTEs), Window functions, temporal data tables and JSON functions. MariaDB’s SQL dialect is compatible with MySQL but extends it with columnar storage and other functionality. Pluggable Storage Engines InnoDB, Aria, ColumnStore, MyRocks, and countless third-party engines allow the MariaDB frontend to extend beyond pure transaction processing. Columnar Storage for Analytics MariaDB ColumnStore plugs into MariaDB Community Server for columnar analytics (MPP) or hybrid smart transactions (HTAP). .basic-column .icon { font-size: 50px; } Clustering Galera Cluster engine for replication and state transfer. High Availability MariaDB MaxScale provides a database proxy capable of failover and transaction replay. [class*="bg-g-"], [class*="bg-g-"] h1, [class*="bg-g-"] h2, [class*="bg-g-"] h3, [class*="bg-g-"] p { color: #fff; } Open Source MariaDB Community Server is released under the GNU Public License v2. Throughout its history, MariaDB has shown its commitment to open source and the open source community. MariaDB Community Server is guaranteed open source, forever. In addition, commercially developed components such as MariaDB’s MaxScale are released under the Business Source License (BSL). The source code is always available and after a period of time, the license converts to GPL assuring the software is forever available to the community. [class*="bg-g-"], [class*="bg-g-"] h1, [class*="bg-g-"] h2, [class*="bg-g-"] h3, [class*="bg-g-"] p { color: #fff; } Community Supported MariaDB sports a vibrant community with countless resources to learn and get involved. You can fork MariaDB on GitHub, join the mailing lists or read the documentation. Books .basic-column .icon { font-size: 50px; } Getting Started with MariaDB Daniel Bartholomew MariaDB Essentials Emilien Kenler and Federico Razzoli Migrating to MariaDB William Wood R2DBC Revealed Robert Hedgpeth .resource-block-bg .img-bg-cover { min-height: 100%; } Blogs Blog Post Delivering Faster Innovation to MariaDB’s Community Delivering Faster Innovation to MariaDB’s Community Learn More Blog Post Benchmark: MariaDB vs MySQL on Commodity Cloud Hardware Benchmark: MariaDB vs MySQL on Commodity Cloud Hardware Learn More Blog Post Introducing JSON Tables Introducing JSON Tables Learn More [class*="bg-g-"], [class*="bg-g-"] h1, [class*="bg-g-"] h2, [class*="bg-g-"] h3, [class*="bg-g-"] p { color: #fff; } Training Courses .basic-column .icon { font-size: 50px; } MariaDB Standard DBA Teaches the essentials of DBA tasks, and extends administration skills. Besides concepts, essential tools, and optimal use of resources, you’ll thoroughly review core administrative tasks: backups and restoration, monitoring and maintaining databases, and user security. Course Fact Sheet MariaDB Cluster Covers everything you need to set up and run a highly available, multi-master cluster using MariaDB Cluster. We’ll train you in the basics of MariaDB Cluster architecture and functionality, as well as more advanced techniques for configuring and administering a MariaDB Cluster. Course Fact Sheet MariaDB MaxScale Teaches DBAs how to set up and use MariaDB MaxScale to manage a cluster of database servers. You’ll see how to split database traffic between servers, automatically manage database failover, and stream large amounts of data to other applications using MaxScale. Course Fact Sheet Go Pro(duction) Learn about MariaDB Enterprise Contact Us'
