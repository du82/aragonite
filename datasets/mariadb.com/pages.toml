full_description = "MariaDB Connector/Python This page is part of MariaDB's Documentation. The parent of this page is: MariaDB ConnectorsProgramming Languages Topics on this page: Overview Resources Overview Python developers can connect to MariaDB database products through a native MariaDB Connector. Using MariaDB Connector/Python you can connect to MariaDB database products to use and administer databases from within your Python application. Connector/Python is compliant with the Python Database API Specification v2.0 (PEP 249) . Connector MariaDB Connector/Python Supported Versions MariaDB Connector/Python 1.1MariaDB Connector/Python 1.1 MariaDB Connector/Python 1.0MariaDB Connector/Python 1.0 Programming Language Python Programming Language Version Python 3 (CPython 3.7 or later) API Python DB API 2.0 (PEP-249) Supports TLS Yes Supports Connection Pools Yes License GNU Lesser General Public License v2.1 Resources Code example Install MariaDB Connector/Python Development with MariaDB Connector/Python (field information) Connect Connection pools Transactions DML (SELECT, INSERT, UPDATE, DELETE) DDL (ALTER TABLE, TRUNCATE TABLE) Setup for examples MariaDB Connector/Python 1.0 Release NotesMariaDB Connector/Python 1.0 Release Notes MariaDB Connector/Python 1.1 Release NotesMariaDB Connector/Python 1.1 Release Notes"
