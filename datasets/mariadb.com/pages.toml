full_description = ".hub-sidebar, .hub-nav-container { width: 313px; } .hub-nav-container { background: #f9f9f9; } .hub-nav-container li.current-menu-item { border-left: 4px solid #00838f; font-weight: 700; } .hub-nav-container li a { color: #424f62; } @media (min-width: 992px) { .side-by-side-buttons a { margin-right: 15px; } .hub-nav-container li span { font-size: 17px; } .hub-nav-container li i { font-size: 22px; } .hub-nav-container li i.icon-tag-right { font-size: 20px; } } Home Sample Apps Developer Toolkits Blog Posts Webinars GitHub Developer Samples MariaDB on YouTube MariaDB Community Slack Download MariaDB .hub-sidebar, .hub-nav-container { width: 313px; } .hub-nav-container { background: #f9f9f9; } .hub-nav-container li.current-menu-item { border-left: 4px solid #00838f; font-weight: 700; } .hub-nav-container li a { color: #424f62; } @media (min-width: 992px) { .side-by-side-buttons a { margin-right: 15px; } .hub-nav-container li span { font-size: 17px; } .hub-nav-container li i { font-size: 22px; } .hub-nav-container li i.icon-tag-right { font-size: 20px; } } .journey-column { border-top: 15px solid; } .img_tile span, .content_tile p { font-size: 18px; } .img_tile .journey-column:hover { box-shadow: 0 6px 19px 0 rgba(0,0,0,.2), 0 8px 26px 0 rgba(0,0,0,.2) !important; transition: box-shadow .13s ease-in-out; } .tile-thumbnail img { max-height: 275px; } Bookings A web application, backed by the power of MariaDB, that unleashes the power of smart transactions on hundreds of millions of records with sub-second query performance without having to add any indexes! GitHub MariaDB HTAP Quickstart MariaDB Hybrid Transactional/Analytical Processing (HTAP) combines row-based storage and column-based storage to create truly robust, innovative and truly modern applications. This example walks through the process of downloading, installing and configuring a MariaDB HTAP solution using a Docker image. GitHub Creating Microservices with .NET and MariaDB This repository provides a simple example of a microservice architecture using a Microsoft .NET solution with Entity Framework and MariaDB that contains: Two microservice (.NET Web API) projects One API Gateway (Ocelot) project GitHub MariaDB Connector/Python Samples A respository containing sample applications and usages that will help you gain an understanding of how to take advantage of MariaDB Connector/Python. Simple API application: A Python application that uses Flask to expose endpoints that can be used to perform simple CRUD operations with MariaDB Connector/Python. Data Visualization: Using MariaDB Connector/Python, the libraries Plotly and Pandas are used to demonstrate data analysis and visualization. GitHub Introduction to MariaDB and Object-Relational Mapping Introductory samples and walk-throughs for using Object-Relational Mapping (ORM) libraries with MariaDB connectors. ORM Library Samples: Sequelize (Node.js) Django (Python – Coming soon!) SQLAlchemy (Python – Coming soon!) GitHub Modern SQL Samples and Apache Zeppelin MariaDB implements more of the standard SQL specification than any other open source database, adding support for common table expressions (CTEs), window functions, temporal data tables and many other features over the last few years. GitHub MariaDB + PL/SQL A respository containing code samples for getting started using PL/SQL with MariaDB. Includes samples for the following: Conditional statements Loops / Cursors Stored Procedures Functions Packages Triggers Exception Handling And more! GitHub MariaDB + NoSQL Connect to and communicate with a MariaDB database instance using a NoSQL driver and MariaDB MaxScale’s NoSQL Listener. The nosqlprotocol module allows a MariaDB server or cluster to be used as the backend of an application using a MongoDB client library. Internally, all documents are stored in a table containing two columns; an id column for the object id and a doc column for the document itself. GitHub MariaDB JSON Samples A respository containing code samples for getting started using JSON with MariaDB. Includes samples for the following: Storing JSON documents in MariaDB Reading and writing data into JSON documents Creating performance enhancing indexes for JSON data Enforcing data integrity on JSON data And more! GitHub MariaDB JSON Quickstart This repository uses the official MariaDB Docker image to demonstrate how to manage semi-structured, via JavaScript Objection Notation (JSON), within a MariaDB database. GitHub Orders A web application that introduces you to the power, performance and simplicity of MariaDB by simulating online e-commerce (ordering) traffic. GitHub Flights A web application, backed by the power of MariaDB connectors and MariaDB ColumnStore database, that allows you to analyze over 180 million flight records from the United States Department of Transportation in real time without needing to add any indexes. Node.js (Basic) Python (Basic) .resource-block-bg .img-bg-cover { min-height: 100%; } Resources webinar Modern Apps: Enriching the User Experience with Hybrid Transactional/Analytical Processing (HTAP) Modern Apps: Enriching the User Experience with Hybrid Transactional/Analytical Processing (HTAP) Learn More Get Started with MariaDB Download MariaDB Docker Container"
