["https://mariadb.com/about-us/leadership"]
title = "MariaDB Leadership Team | MariaDB"
description = "MariaDB is one of the most popular database servers in the world. Meet the leadership team at the helm of MariaDB."
full_description = "#leadership-team .person-headshot .person-headshot-hover, .person-model-body, #engineering-leadership .person-headshot .person-headshot-hover, .person-model-body.leaderships { background: linear-gradient(226.17deg, #5cc9d0 0%, #2f99a3 100%); } #board-of-directors .person-headshot .person-headshot-hover, .person-model-body.directors { background: linear-gradient(320.66deg, #abc74a 0%, #d4ed7e 100%); } .person-headshot-hover { display: none; } .person-headshot:hover .person-headshot-hover { display: flex; } .model-content-wrap .title { letter-spacing: 0.5px; } .model-close-wrap { top: 20px; right: 30px; } .model-close-wrap .close { opacity: 1; font-size: 2rem; } .person-headshot-img { width: 265px; height: 265px; } @media (min-width: 992px) { .model-content-wrap p { line-height: 30px; } } View Bio Rohit de Souza Chief Executive Officer x Rohit de Souza Chief Executive Officer Rohit de Souza joins MariaDB as Chief Executive Officer. Rohit brings over 25 years of blue chip, strategic technology and change management experience to the role, having driven results at both large enterprise technology companies and smaller, early-stage ventures in a global context. Prior to joining MariaDB, Rohit was the the Senior Vice President and General Manager of two major business units at Micro Focus comprising about $1.3 billion in revenue. Here, he was responsible for transforming these businesses, returning them to growth and preparing them to be independent standalone businesses. He also helped drive the combination of Micro Focus with OpenText. Prior to Micro Focus, Rohit served as Chief Executive Officer & President of Actian Corporation, a relational database company headquartered in Palo Alto, California. At Actian, Rohit oversaw the transformation of the company, its return to profitable growth and its focus on the core vision of hybrid enterprise data management. Rohit also drove the strategic acquisition of Actian, by HCL Technologies, a $9 billion global SI with commitment to investing in breakthrough, innovative software technology, providing customers and employees with long term stability. Prior to Actian, Rohit held multiple leadership positions at Hewlett-Packard, Siebel, Oracle, Booz Allen & Hamilton and Intel, where in each instance he contributed to the accelerated growth and market success of the firm. Rohit holds dual master’s degrees in engineering from the University of California at Berkeley and an undergraduate degree in engineering from Madras University in India. View Bio Conor McCarthy Chief Financial Officer x Conor McCarthy Chief Financial Officer Conor McCarthy has over 30 years of experience as a CFO in areas such as corporate strategy and corporate finance including capital raising. Conor most recently served as the CFO of Ideanomics, a NASDAQ listed cleantech company, where he developed the revenue models for vehicle-as-a-service and charging-as-a-service products. He was also CFO of OS33, a private equity backed FinTech SaaS platform for compliance and productivity enablement for the wealth management industry. Prior to that, he served as the CFO of Intent Media from May 2016 to July 2018, the CFO of Convergex Group from June 2014 to July 2015 and the CFO and Finance Director of the Americas for GFI Group, Inc., a NYSE listed fintech wholesale money broker with revenues of almost $1 billion (now part of BGC Partners, NASDAQ: BGCP), from March 2005 to June 2014. Conor holds a CA from the Institute of Chartered Accountants in Ireland. He started his career as an auditor with KPMG in Ireland before transitioning into financial services, working as CFO, treasurer, and in other executive finance roles, with trading and brokerage firms, as well as high growth technology companies supporting the SaaS industry. View Bio Mike Mooney Chief Revenue Officer x Mike Mooney Chief Revenue Officer Mike serves as chief revenue officer (CRO) at MariaDB, offering strong sales leadership experience in both startup and public software companies. He has more than 20 years’ experience providing customer-focused go-to-market (GTM) leadership for B2B companies during transformational periods and times of high growth, resulting in customer and market momentum, revenue growth, and customer satisfaction and retention. Prior to joining MariaDB, he served as CRO at several San Francisco Bay Area companies, including Kentik, Outreach, Centrify and Imperva, leading one organization through a successful IPO and several through acquisitions. View Bio Vikas Mathur Chief Product Officer x Vikas Mathur Chief Product Officer Vikas Mathur leads product and engineering for MariaDB. Vikas brings to the role his passion for delivering value in products by focusing on customer needs, as well as leveraging best practices in AI/Gen-AI, data platforms and enterprise readiness. Vikas is a seasoned executive with 25+ years of enterprise growth experience in product management, R&D, GTM strategy and business development. Previously, he was at OpenText/MicroFocus where he was the Vice President of Product and Engineering for their IT Operations Management business with ~$550M in revenue, and led a global engineering team with hubs in India, China, Romania, Germany and the US. Prior to OpenText, Vikas was SVP of Products at Actian, a PE-backed database company with transactional, embedded, object, and columnar database products including Ingres. Prior to Actian, Vikas held various leadership and individual contributor roles in Strategy, GTM, and R&D at HP, A.T. Kearney, Sun Microsystems, and Apple. Vikas graduated with an MBA from Haas School of Business, University of California, Berkeley. He also holds a M.S. in Computer Engineering from University of Kentucky, Lexington, and a B.E. in Electronics Engineering from Punjab Engineering College, Chandigarh. Vikas lives in Sunnyvale, CA with his wife and two daughters and enjoys playing tennis and hiking on trails around the Bay Area. View Bio Michael “Monty” Widenius Chief Technology Officer x Michael “Monty” Widenius Chief Technology Officer Michael “Monty” Widenius is the “spiritual father” of MariaDB, a renowned advocate for the open source software movement and one of the original developers of MySQL, the predecessor to MariaDB. He is co-founder and CTO at MariaDB, and was previously co-founder at SkySQL, and the CTO of MySQL AB until its sale to Sun Microsystems (now Oracle). Monty was also the founder of TCX DataKonsult AB, a Swedish data warehousing company. He was awarded the Finnish Software Entrepreneur of the Year prize in 2003. In 2015, Monty was selected as one of the 100 most influential persons in the Finnish IT market. Monty studied at the Helsinki University of Technology and lives in Finland. View Bio Hans van Dijk VP, Support and Services x Hans van Dijk VP, Support and Services Hans van Dijk is a dynamic and results-oriented executive with over 25 years of experience in support, customer success, IT operations, and strategic business development. He has successfully driven large-scale transformations, integrated cross-functional teams, and optimized resource management. Known for building strong relationships with clients, Hans consistently leads teams to exceed business goals and deliver outstanding results. View Bio Iris Herrera Whitney VP, Marketing x Iris Herrera Whitney VP, Marketing Iris Herrera Whitney has over 15 years of experience working in communications and marketing across high tech B2B companies and government agencies. While she can keep up with all the industry lingo (DBA, API, RDBMS, oh my!), she would rather dream up a creative angle that cuts through the noise. As VP of marketing at MariaDB plc, she oversees all of marketing and brand. She also works closely with executives and senior leaders to ensure meaningful stories are being told. Previously, Iris worked at a public relations agency building awareness and defining new industries for clients in the tech sector. She started her career in California state politics where she believed (naively?) she could help change the world, giving voices to people and organizations at the place where laws were being made. She earned a bachelor’s degree in political science and philosophy at the University of California, Davis. Iris is a lifelong resident of the SF Bay Area where she lives with her family, including two kids who are always testing boundaries. View Bio Bill Munger VP, Global Human Resources x Bill Munger VP, Global Human Resources As VP of HR, Bill Munger has 30 years of experience in the HR world working for large public technology companies as well as several technology startups. Prior to joining MariaDB, Bill led the HR team at ChargePoint, Inc. as they transitioned from a pre-IPO company to going public in early 2021. Bill holds a bachelor’s degree in HR and an MBA from Kellogg’s Graduate School of Management at Northwestern University."
