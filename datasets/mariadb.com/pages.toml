["https://mariadb.com/products/columnstore"]
title = "SQL and Ad Hoc Analytics with MariaDB ColumnStore | MariaDB"
description = "MariaDB ColumnStore offers distributed, columnar storage and a massively parallel processing shared-nothing architecture for ad hoc SQL queries & advanced analytics."
full_description = '''.mdb-section iframe { max-width: 100% !important; } [class*="bg-g-"], [class*="bg-g-"] h1, [class*="bg-g-"] h2, [class*="bg-g-"] h3, [class*="bg-g-"] p { color: #fff; } MariaDB ColumnStore extends MariaDB Enterprise Server with distributed, columnar storage and a massively parallel processing (MPP) shared nothing architecture, transforming it into a standalone or distributed data warehouse for ad hoc SQL queries and advanced analytics without the need to create indexes. .basic-column .icon { font-size: 50px; } Columnar Data is stored in a columnar format for fast analytics and with up to 90% compression, reducing disk I/O and size of data on disk. Distributed Data can be distributed across multiple database instances and queried in parallel to increase query performance and support massive datasets. Cloud-Native Data can be stored on Amazon S3 compatible object storage, on premises or in the cloud, to benefit from low-cost, unlimited storage. See What's New in ColumnStore .resource-block-bg .img-bg-cover { min-height: 100%; } Customers Customer Story Institute for Health Metrics and Evaluation (IHME) Institute for Health Metrics and Evaluation (IHME) Learn More Customer Story How Pixid dropped Oracle and went hybrid with MariaDB How Pixid dropped Oracle and went hybrid with MariaDB Learn More [class*="bg-g-"], [class*="bg-g-"] h1, [class*="bg-g-"] h2, [class*="bg-g-"] h3, [class*="bg-g-"] p { color: #fff; } real-world analytics use cases MariaDB ColumnStore supports our customers across various industries and delivers reduced costs, increased performance and better scalability than alternative solutions. .basic-column .icon { font-size: 50px; } Financial Services Analyze millions of quotes for trading in tens of milliseconds to estimate price point, profitability, and risk. MariaDB in Financial Services Healthcare Analytics Analyze disparate and diverse data across multiple database instances and increase query performance and support massive datasets. IHME Case Study .basic-column .icon { font-size: 50px; } Retail Analyze customer behavior for retail use cases such as cross-sell/up-sell, customer loyalty and churn. Manufacturing Analyze ERP and IoT data to predict points of component and systems failure thereby increasing uptime and reducing maintenance costs. [class*="bg-g-"], [class*="bg-g-"] h1, [class*="bg-g-"] h2, [class*="bg-g-"] h3, [class*="bg-g-"] p { color: #fff; } MODERN ANALYTICS CAPABILITIES .basic-column .icon { font-size: 50px; } Standard SQL Analyze large amounts of data with standard SQL, including joins with other tables (row or columnar). Kafka and Spark connectors Use Kafka and Spark connectors to ingest streaming data and publish machine learning results for interactive, ad hoc analysis. Direct data loading CLI import tools as well as C, Java and Python connectors bypass the SQL layer to load data directly to storage from anywhere. [class*="bg-g-"], [class*="bg-g-"] h1, [class*="bg-g-"] h2, [class*="bg-g-"] h3, [class*="bg-g-"] p { color: #fff; } CORE COMPONENTS For Analytics MariaDB ColumnStore: A specialized storage engine for scalable, high-performance analytics without the need for complex schemas and indexes – distributed, columnar storage with parallel query processing. MariaDB MaxScale database proxy: Provides enterprise high availability, scalability, security and integration services, simplifying application development and DB administration. MariaDB Enterprise Server: A modern, general-purpose database engineered for performance, reliability, security and extensibility with a modular architecture. Bulk data adapters: C++, Java and Python libraries for enabling developers and data scientists to collect and write data to storage on demand, bypassing the SQL interface for higher throughput. Streaming data adapters: Apache Kafka and MariaDB MaxScale services for importing data from MariaDB or Apache Kafka in near real time – automatically, transparently and continuously. .resource-block-bg .img-bg-cover { min-height: 100%; } Resources White Paper MariaDB: Analytics Use Cases MariaDB: Analytics Use Cases Learn More Datasheet MariaDB for Analytics + Spark MariaDB for Analytics + Spark Learn More White Paper Developer Toolkit: How to Unlock Scalable, Real-Time Analytics with Columnar Storage Developer Toolkit: How to Unlock Scalable, Real-Time Analytics with Columnar Storage Learn More .resource-block-bg .img-bg-cover { min-height: 100%; } Blogs Blog Post See Columnar Storage for Analytics in Action and Get an Overview of MariaDB Community Server 10.5 See Columnar Storage for Analytics in Action and Get an Overview of MariaDB Community Server 10.5 Learn More Blog Post What's New in MariaDB Enterprise Server 10.6 What's New in MariaDB Enterprise Server 10.6 Learn More Blog Post Analytics for All Analytics for All Learn More More ColumnStore Blogs Get Started MariaDB Server downloads include ColumnStore for real-time analytics at scale. Download Enterprise Server Contact Us'''
