["https://mariadb.com/openworks/sessions-on-demand/how-qberg-scaled-with-mariadb"]
title = "How QBerg scaled to store data longer, query it faster | MariaDB"
description = "QBerg presents a real-world case study of scaling with MariaDB."
full_description = "How QBerg scaled to store data longer, query it faster Speakers Germán Castro Pérez, CTO at QBerg Vittorio Guglielmo, Infrastructure System Manager at QBerg Session Abstract The continuous increase in terms of services and countries to which QBerg delivers its services requires an ever-increasing load of resources. During the last year QBerg has reached a critical point, storing so much transactional data that standard relational databases were unable to meet the SLAs, or support the features, required by customers. As an example, they had to cap web analytics to running on a maximum of four months of history. The introduction of MariaDB ColumnStore, flanked by existing MariaDB Server databases, not only will allow them to store multiple years’ worth of historical data for analytics – it decreased overall processing time by one order of magnitude right off the bat. The move to a unified platform was incremental, using MariaDB MaxScale as both a router and a replicator. QBerg is now able to replicate full InnoDB schemas to MariaDB ColumnStore and incrementally update big tables without impacting the performance of ongoing transactions. View presentation slides"
author = "https://www.facebook.com/MariaDB.dbms"
year_published = 2019
year_updated = 2019
