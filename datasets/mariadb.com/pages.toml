 animation-delay:0.5s; } @keyframes right{ 100%{ transform: rotate(180deg); } } Databases are key to the success of any business. They are the heartbeat of all applications, whether it’s mobile, web or IoT. If you’re using a cellphone, filling a prescription or making a financial transaction, you will find a MariaDB database behind it. With over 1 billion downloads, nearly 200,000 open source contributions and by reaching over 1 billion users through Linux distributions, MariaDB is not only serving the relational database market, we are helping to shape its future. Who we are With headquarters in Silicon Valley and Ireland, MariaDB collaborates with customers to solve their data storage and access challenges at a fraction of the cost of legacy databases. MariaDB has more than 600 customers around the world. 1B+ const numb = document.querySelector("#counter_01"); let counter = 0; setInterval(() => { if(counter == 1 ){ clearInterval(); }else{ counter+=1; numb.textContent = counter + ""; } }, 2); DOWNLOADS MariaDB has been downloaded over 1 billion times 600+ const numbTwo = document.querySelector("#counter_02"); let counterTwo = 0; setInterval(() => { if(counterTwo == 600 ){ clearInterval(); }else{ counterTwo+=1; numbTwo.textContent = counterTwo + "+"; } }, 2); CUSTOMERS Over 600 customers trust their business to MariaDB 200+ const numbThree = document.querySelector("#counter_03"); let counterThree = 0; setInterval(() => { if(counterThree == 200 ){ clearInterval(); }else{ counterThree+=1; numbThree.textContent = counterThree + "+"; } }, 2); EMPLOYEES We have over 200 people contributing to our success Our history The MariaDB database was born after Oracle acquired MySQL. With the original core MySQL team, we have added functionality to the MariaDB database that competes with legacy database systems like Oracle at a fraction of the cost. We have added columnar analytics, JSON functionality and Oracle compatibility, and we offer a fully managed cloud database service that offers the full breadth of MariaDB database solutions supporting private, public, hybrid and multicloud strategies. Today, the MariaDB database is recognized as a distinct database around the world. MariaDB is the new “M” in the LAMP stack, it’s the default over MySQL in the majority of Linux distributions, it’s replacing Oracle and other legacy databases at increasing rates and it’s available in every cloud. MariaDB is everywhere. From startups to global companies, join these leading brands that trust their business to MariaDB. Browse Customer Stories Industry Recognition #homepage-slider .flip-card-inner-top { border-top-left-radius: 14px; border-top-right-radius: 14px; } #homepage-slider .icon-arrow-left:before { font-weight: bolder; } .flip-card-inner .slide-title { margin-bottom: 35px; } .flip-card-inner .flip-card-padding { padding-bottom: 55px; padding-top: 60px; padding-left: 20px; padding-right: 20px; } .award-img-wrap { height: 200px; } .award-img-wrap img { max-height: 100%; } .award-sub-title { font-size: 1.125rem; } MariaDB makes DBTA's Big Data 50 List MariaDB is a "Leader" in the G2 Grid for Relational Databases MariaDB Careers Be part of the exceptional team building the database for all. MariaDBers for the most part work remotely with several hubs that offer a space for collaboration and face-to-face engagement. We offer many opportunities throughout the year for team building and skills development. Come work with us! View Positions WITH an ocean of possibilities, See what you can do with MariaDB. Resources Contact Us'''
