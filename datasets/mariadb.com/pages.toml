r right 20px; } .version-select-wrap select:focus { box-shadow: none; outline: none; border: 2px solid #E5E1E5; } .download-bar { padding: 20px 30px; border-radius: 0 0 10px 10px; } .tile-large { background-image: linear-gradient(-31deg, #F4F2F4 0%, #fff 100%); -webkit-box-shadow: 2px 4px 10px 0 rgb(66 79 98 / 20%); box-shadow: 2px 4px 10px 0 rgb(66 79 98 / 20%); border-radius: 12px; padding: 30px; } .cloud-img-gallery a:first-child { padding-right: 5px; } .cloud-img-gallery a:nth-child(2) { padding-left: 5px; } .cloud-img-gallery a:first-child, .cloud-img-gallery a:nth-child(2) { width: 50%; flex-basis: 50%; } .cloud-img-gallery a:nth-child(3) { width: 60%; flex-basis: 60%; margin-top: 10px; } .cloud-img-gallery a img { max-width: 100%; } .badge-wrap { top: -11px; left: -3px; } .badge-wrap span.badge { font-size: 10px; } .icon-docs { cursor: pointer; } code[class*=language-] { display: inline-block; border: 0; font-size: 12px; } code[class*=language-] span { font-size: 12px; } @media (min-width: 992px) { #downloadsTabs .nav-item > a { font-size: 16px; padding: 1.7rem 1.6rem; } .downloads-tab-content .sub-tabs .nav-item a { font-size: 14px; padding: 1.5rem 1.5rem; } .tab-content-inner { padding: 80px; } .tile-large { padding: 50px; } } Download MariaDB products and tools for development and production Free MariaDB Community MariaDB Enterprise Platform Repo Setup Connectors Community Server MaxScale ColumnStore Download MariaDB Community Server: Lightweight but powerful, innovative but mature, and 100% open source MariaDB Community Server sets the standard for open source relational databases, with Oracle Database compatibility (e.g., sequences and PL/SQL), temporal tables, transparent sharding, instant schema changes, point-in-time rollback and modern SQL (i.e., common table expressions, window functions, JSON functions and more). MariaDB Community Server now includes ColumnStore for real-time analytics at scale. It’s the best way to get started, when it’s time for production, we recommend MariaDB Enterprise Server (available with subscription). Release notes Installation Instructions Show All Files Docker Installation Product Community Server Version 11.7.2-GA 11.8.1-Development (non-production) 11.4.5-GA 10.11.11-GA 10.6.21-GA 10.5.28-GA OS Debian 11 Bullseye (64-bit ARM) Debian 11 Bullseye (64-bit x86) Debian 12 Bookworm (64-bit ARM) Debian 12 Bookworm (64-bit x86) MS Windows (64-bit x86) RHEL 8 / Alma 8 / Rocky 8 (64-bit ARM) RHEL 8 / Alma 8 / Rocky 8 (64-bit x86) RHEL 9 / Alma 9 / Rocky 9 (64-bit ARM) RHEL 9 / Alma 9 / Rocky 9 (64-bit x86) SLES 15 (64-bit x86) Ubuntu 20.04 Focal (64-bit ARM) Ubuntu 20.04 Focal (64-bit x86) Ubuntu 22.04 Jammy (64-bit ARM) Ubuntu 22.04 Jammy (64-bit x86) Ubuntu 24.04 Noble (64-bit ARM) Ubuntu 24.04 Noble (64-bit x86) Community Server https://dlm.mariadb.com/4181751/MariaDB/mariadb-11.7.2/winx64-packages/mariadb-11.7.2-winx64.msi 75.41 MB Download MariaDB MaxScale: The world's most advanced database proxy and query router MariaDB MaxScale is an essential component of MariaDB Enterprise Platform. In addition to providing mission-critical applications with enterprise features like automatic failover, it supports workload-based query routing for hybrid transactional/analytical processing (HTAP). MariaDB MaxScale is available to all customers with an enterprise subscription. For the most recent MaxScale releases, please visit the MaxScale downloads under the MariaDB Enterprise Platform tab. Installation Instructions Show All Files Docker Installation Version 24.02.4-GA 23.08.8-GA 23.02.12-GA 22.08.15-GA 21.06.18-GA OS Debian 11 Bullseye (64-bit ARM) Debian 11 Bullseye (64-bit x86) Debian 12 Bookworm (64-bit ARM) Debian 12 Bookworm (64-bit x86) RHEL 8 / Alma 8 / Rocky 8 (64-bit ARM) RHEL 8 / Alma 8 / Rocky 8 (64-bit x86) RHEL 9 (64-bit PPC64LE) RHEL 9 / Alma 9 / Rocky 9 (64-bit ARM) RHEL 9 / Alma 9 / Rocky 9 (64-bit x86) SLES 15 (64-bit ARM) SLES 15 (64-bit x86) Ubuntu 20.04 Focal (64-bit ARM) Ubuntu 20.04 Focal (64-bit x86) Ubuntu 22.04 Jammy (64-bit ARM) Ubuntu 22.04 Jammy (64-bit x86) Ubuntu 24.04 Noble (64-bit ARM) Ubuntu 24.04 Noble (64-bit x86) Download MariaDB MaxScale https://dlm.mariadb.com/3993858/MaxScale/24.02.4/rhel/8/x86_64/maxscale-24.02.4-1.rhel.8.x86_64.rpm 84.32 MB Download MariaDB ColumnStore: Distributed, columnar storage and processing for scalable analytics MariaDB ColumnStore extends MariaDB Community Server with distributed storage and massively parallel processing to support scalable, high-performance analytics. It can be deployed in addition to InnoDB to accelerate analytical queries, or for hybrid transactional and analytical processing (HTAP), or as a standalone columnar database for interactive, ad hoc analytics at scale. ColumnStore can optionally use object storage services in public or private clouds to lower costs and store an unlimited amount of data. Release notes Installation Instructions Docker Installation MariaDB ColumnStore Enterprise Server MaxScale ColumnStore ColumnStore Cluster Manager MariaDB Enterprise Server: Enhanced, hardened and secured for mission-critical applications MariaDB Enterprise Server is a hardened version of MariaDB Community Server built for production deployments. It undergoes extensive QA, is configured for production by default and includes enterprise features to improve operating efficiency at scale and support the most secure environments. MariaDB Enterprise Server is available to all subscription customers. Interested in an Enterprise subscription? Contact us to get started. Customer Login MariaDB MaxScale: The world’s most advanced database proxy and query router MariaDB MaxScale is an essential component of MariaDB Enterprise. It not only provides mission-critical applications with enterprise features including automatic failover and denial-of-service protection, it supports workload-based query routing for hybrid transactional/analytical processing. Interested in an Enterprise subscription? Contact us to get started. Customer Login MariaDB ColumnStore: Distributed, columnar storage and processing for scalable analytics MariaDB ColumnStore extends MariaDB Server with distributed storage and massively parallel processing to support scalable, high-performance analytics. It can be deployed in addition to InnoDB to accelerate analytical queries, or for hybrid transactional and analytical processing (HTAP), or as a standalone columnar database for interactive, ad hoc analytics at scale. ColumnStore can optionally use object storage services in public or private clouds to lower costs and store an unlimited amount of data. Interested in an Enterprise subscription? Contact us to get started. Customer Login MariaDB ColumnStore Cluster Manager Cluster Manager API (CMAPI) is a RESTful server that allows the clustering of multinode ColumnStore deployments Interested in an Enterprise subscription? Contact us to get started. Customer Login MariaDB may be deployed for production environments using native package management tools apt and yum. As Debian and Ubuntu users (apt) and CentOS, RHEL, Fedora, and SuSE users (yum) you may use our universal configurator to set up your production server's MariaDB package repository configuration. Once configured, you can use your native (apt/yum) package management tools to install and update MariaDB software. Installation Instructions apt/yum repo setup https://dlm.mariadb.com/3/MariaDB/mariadb_repo_setup 17.58 KB Download Data Access Lightweight, advanced connectors for high-performance data access and data streaming. MariaDB Connector/C is a high-performance client library with advanced functions, bulk operations, asynchronous/non-blocking APIs and multiple options for encrypted connections via TLS/SSL. MariaDB Connector/C is LGPL. Release notes Show All Files Product C connector Java 8+ connector ODBC connector Python connector Node.js connector C++ connector R2DBC connector Version 3.4.4-GA 3.3.14-GA 3.1.27-GA OS Debian 