["https://mariadb.com/developers/resources/sample-apps"]
title = "MariaDB Sample Apps & Code Examples | MariaDB"
description = "MariaDB sample apps in various programming languages (Java, Python, php, C++, .NET/C# and JavaScript/Node.js)."
full_description = ".hub-sidebar, .hub-nav-container { width: 313px; } .hub-nav-container { background: #f9f9f9; } .hub-nav-container li.current-menu-item { border-left: 4px solid #00838f; font-weight: 700; } .hub-nav-container li a { color: #424f62; } @media (min-width: 992px) { .side-by-side-buttons a { margin-right: 15px; } .hub-nav-container li span { font-size: 17px; } .hub-nav-container li i { font-size: 22px; } .hub-nav-container li i.icon-tag-right { font-size: 20px; } } .journey-column { border-top: 15px solid; } .img_tile span, .content_tile p { font-size: 18px; } .img_tile .journey-column:hover { box-shadow: 0 6px 19px 0 rgba(0,0,0,.2), 0 8px 26px 0 rgba(0,0,0,.2) !important; transition: box-shadow .13s ease-in-out; } .tile-thumbnail img { max-height: 275px; } Home Sample Apps Developer Toolkits Blog Posts Webinars GitHub Developer Samples MariaDB on YouTube MariaDB Community Slack Download MariaDB MariaDB Sample Apps Bookings A web application, backed by the power of MariaDB, that unleashes the power of smart transactions on hundreds of millions of records with sub-second query performance without having to add any indexes! GitHub MariaDB HTAP Quickstart MariaDB Hybrid Transactional/Analytical Processing (HTAP) combines row-based storage and column-based storage to create truly robust, innovative and truly modern applications. This example walks through the process of downloading, installing and configuring a MariaDB HTAP solution using a Docker image. GitHub Creating Microservices with .NET and MariaDB This repository provides a simple example of a microservice architecture using a Microsoft .NET solution with Entity Framework and MariaDB that contains: Two microservice (.NET Web API) projects One API Gateway (Ocelot) project GitHub MariaDB Connector/Python Samples A respository containing sample applications and usages that will help you gain an understanding of how to take advantage of MariaDB Connector/Python. Simple API application: A Python application that uses Flask to expose endpoints that can be used to perform simple CRUD operations with MariaDB Connector/Python. Data Visualization: Using MariaDB Connector/Python, the libraries Plotly and Pandas are used to demonstrate data analysis and visualization. GitHub Introduction to MariaDB and Object-Relational Mapping Introductory samples and walk-throughs for using Object-Relational Mapping (ORM) libraries with MariaDB connectors. ORM Library Samples: Sequelize (Node.js) Django (Python - Coming soon!) SQLAlchemy (Python - Coming soon!) GitHub Modern SQL Samples and Apache Zeppelin MariaDB implements more of the standard SQL specification than any other open source database, adding support for common table expressions (CTEs), window functions, temporal data tables and many other features over the last few years. GitHub MariaDB + PL/SQL A respository containing code samples for getting started using PL/SQL with MariaDB. Includes samples for the following: Conditional statements Loops / Cursors Stored Procedures Functions Packages Triggers Exception Handling And more! GitHub MariaDB + NoSQL Connect to and communicate with a MariaDB database instance using a NoSQL driver and MariaDB MaxScale's NoSQL Listener. The nosqlprotocol module allows a MariaDB server or cluster to be used as the backend of an application using a MongoDB client library. Internally, all documents are stored in a table containing two columns; an id column for the object id and a doc column for the document itself. GitHub MariaDB JSON Samples A respository containing code samples for getting started using JSON with MariaDB. Includes samples for the following: Storing JSON documents in MariaDB Reading and writing data into JSON documents Creating performance enhancing indexes for JSON data Enforcing data integrity on JSON data And more! GitHub MariaDB JSON Quickstart This repository uses the official MariaDB Docker image to demonstrate how to manage semi-structured, via JavaScript Objection Notation (JSON), within a MariaDB database. GitHub Orders A web application that introduces you to the power, performance and simplicity of MariaDB by simulating online e-commerce (ordering) traffic. GitHub Flights A web application, backed by the power of MariaDB connectors and MariaDB ColumnStore database, that allows you to analyze over 180 million flight records from the United States Department of Transportation in real time without needing to add any indexes. Node.js (Basic) Python (Basic) Places A web application backed by the power, performance, and simplicity of MariaDB, allows you to record all of your favorite locations using both structured (relational) and semi-structured (JSON) data. Java (JDBC + Spring) Java (R2DBC + Spring) Node.js (Basic) Python (Basic) Wordle-style Game Clone: MariaDB Edition A Wordle clone implemented with Spring Boot, R2DBC, MariaDB, and Svelte. GitHub Sequelize (Node.js) Quickstart A collection of code samples that demonstrate the process of quickly getting started with Sequelize, a promise-based Node.js object-relational mapping (ORM) library, to connect to and communicate with a MariaDB using the MariaDB Node.js connector. Samples include examples on how to: Configure a Node.js application to connect to and communicate with MariaDB Manage data stored within a MariaDB database using JavaScript models Set up model associations GitHub MariaDB ColumnStore Quickstart This tutorial will demonstrate how to quickly get started with MariaDB ColumnStore. a columnar storage engine that utilizes a massively parallel distributed data architecture. Samples include examples on how to: Create a MariaDB ColumnStore Docker container using the official MariaDB Docker image Import data into a ColumnStore table Query data within a ColumnStore table GitHub PHP Quickstart A short tutorial with instructions on how to set up a simple web application that demonstrates how to quickly connect to and communicate with a MariaDB database using PHP (via mysqli). GitHub TODO A web application that introduces you to the power, performance and simplicity of MariaDB through simple CREATE-READ-UPDATE-DELETE (CRUD) operations. C++ C# (Dapper) C# (Entity Framework) Java (JDBC + Spring) Java (R2DBC + Spring) Node.js (Basic) Node.js (Sequelize) Python (Basic) Python (SQLAlchemy) Java Quickstart A collection of code samples that demonstrate how to quickly get started with Java and MariaDB using the JDBC and R2DBC drivers. Samples include examples on how to: Open and close database connections Execute SQL statements Create and manage connection pools GitHub Python Quickstart A collection of code samples that demonstrate how to quickly get started with Python and MariaDB using the MariaDB Python connector (driver). Samples include examples on how to: Open and close a connection to a MariaDB database Execute SQL statements Use SQL parameters within queries GitHub Node.js Quickstart A collection of code samples that demonstrate how to quickly get started with Node.js and MariaDB using the Node.js connector (driver). Samples include examples on how to: Establish a connection to a MariaDB database Create a database and table Insert records into a table Read records from a table Update records in a table Delete records from a table GitHub"
