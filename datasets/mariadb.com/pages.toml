ity Server 10.6 MariaDB Community Server with ColumnStore MariaDB Community Server with ColumnStore 5 MariaDB Community Server with ColumnStore 6 MariaDB Enterprise ColumnStore with Local Storage MariaDB Enterprise ColumnStore 5 with Local Storage MariaDB Enterprise ColumnStore 22.08 with Local Storage MariaDB Enterprise ColumnStore 23.10 with Local Storage For high availability and scalability, instead see "ColumnStore Shared Local Storage Topology". MariaDB Enterprise ColumnStore with Object Storage MariaDB Enterprise ColumnStore 5 with Object Storage MariaDB Enterprise ColumnStore 22.08 with Object Storage MariaDB Enterprise ColumnStore 23.10 with Object Storage For high availability and scalability, instead see "ColumnStore Object Storage Topology". MariaDB Enterprise Server MariaDB Enterprise Server 10.2 MariaDB Enterprise Server 10.3 MariaDB Enterprise Server 10.4 MariaDB Enterprise Server 10.5 MariaDB Enterprise Server 10.6 MariaDB Enterprise Server 11.4 Deployment Practices Best Practices Customer Download Token Supply Chain Security Deployment Methods Deploy from Binary Tarball Deploy from Package Tarball Deploy from Repository (APT, YUM, ZYpp) Deploy from Repository Mirror Deploy with Docker Deploy in the cloud on MariaDB SkySQL DBaaS Support Obtaining support from MariaDB Corporation Compatibility'''
