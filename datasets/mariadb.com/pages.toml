full_description = '.hub-sidebar, .hub-nav-container { width: 313px; } .hub-nav-container { background: #f9f9f9; } .hub-nav-container li.current-menu-item { border-left: 4px solid #00838f; font-weight: 700; } .hub-nav-container li a { color: #424f62; } @media (min-width: 992px) { .side-by-side-buttons a { margin-right: 15px; } .hub-nav-container li span { font-size: 17px; } .hub-nav-container li i { font-size: 22px; } .hub-nav-container li i.icon-tag-right { font-size: 20px; } } Home Sample Apps Developer Toolkits Blog Posts Webinars GitHub Developer Samples MariaDB on YouTube MariaDB Community Slack Download MariaDB [class*="bg-g-"], [class*="bg-g-"] h1, [class*="bg-g-"] h2, [class*="bg-g-"] h3, [class*="bg-g-"] p { color: #fff; } GETTING STARTED WITH MARIADB MariaDB sets the standard for open-source relational databases, with MySQL and Oracle Database compatibility (e.g., sequences and PL/SQL), temporal tables, transparent sharding, instant schema changes, point-in-time rollback, and modern SQL (i.e., common table expressions (CTEs), window functions, JSON functions and more). MariaDB also includes pluggable storage engines like ColumnStore, which can be used to work with massive amounts of data to provide real-time analytics at scale. Download MariaDB Docker Container .journey-column { border-top: 15px solid; } .img_tile span, .content_tile p { font-size: 18px; } .img_tile .journey-column:hover { box-shadow: 0 6px 19px 0 rgba(0,0,0,.2), 0 8px 26px 0 rgba(0,0,0,.2) !important; transition: box-shadow .13s ease-in-out; } RESOURCES BY LANGUAGE Java JavaScript / Node.js Python C++ .NET / C# PHP .journey-column { border-top: 15px solid; } .img_tile span, .content_tile p { font-size: 18px; } .img_tile .journey-column:hover { box-shadow: 0 6px 19px 0 rgba(0,0,0,.2), 0 8px 26px 0 rgba(0,0,0,.2) !important; transition: box-shadow .13s ease-in-out; } MARIADB FEATURES AND FUNCTIONALITY MariaDB MaxScale MariaDB MaxScale is an advanced database proxy, and a core component of all MariaDB servers. Learn more Connectors MariaDB Connectors are lightweight and advanced database drivers for high-performance data access by applications on macOS, Linux, Windows on ARM and Intel processors. MariaDB provides several native connectors that support languages like C, C++, Java, Python and more. Learn more Modern SQL MariaDB implements more of the standard SQL specification than any other open source database, adding support for PL/SQL, managing JSON data, common table expressions (CTEs), window functions, temporal tables and many other features over the last few years. Learn more JSON JavaScript Object Notation (JSON) is fast becoming the standard format for data interchange and for unstructured data. MariaDB includes a large variety of pre-defined functions that allow you to manage JSON data. Learn more Temporal Tables Temporal tables function as versioned tables that can be used to access and modify past data, and find what changes have been made and when. Learn more .journey-column { border-top: 15px solid; } .img_tile span, .content_tile p { font-size: 18px; } .img_tile .journey-column:hover { box-shadow: 0 6px 19px 0 rgba(0,0,0,.2), 0 8px 26px 0 rgba(0,0,0,.2) !important; transition: box-shadow .13s ease-in-out; } MariaDB Workloads Transactional MariaDB is the leading enterprise open source database, featuring Oracle Database compatibility (PL/SQL), sharding, temporal tables, dynamic data masking and point-in-time rollback. Learn more Analytical/Data Warehousing MariaDB can be deployed as a columnar database for real-time analytics at scale, using distributed data and massively parallel processing (MPP) to perform interactive, ad hoc queries on hundreds of billions of rows with standard SQL. Learn more HTAP MariaDB supports Hybrid Transactional/Analytical Processing (HTAP), which allows you to combine the power and reliability of row-based storage with scalability with the performance of column-based storage to create truly robust, innovative and truly modern applications. Learn more Get Started Download MariaDB Docker Container'
