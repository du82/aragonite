["https://mariadb.com/products/enterprise/enterprise-server"]
title = "Production-Grade Open Source Database: MariaDB Enterprise | MariaDB"
description = "Learn why MariaDB Enterprise Server is the production-grade open source database for hybrid transactional / analytical processing at scale."
full_description = '''.mdb-section iframe { max-width: 100% !important; } [class*="bg-g-"], [class*="bg-g-"] h1, [class*="bg-g-"] h2, [class*="bg-g-"] h3, [class*="bg-g-"] p { color: #fff; } ULTIMATE PEACE OF MIND MariaDB Enterprise Server is a premium version of MariaDB Community Server that delivers peace of mind with a reliable, stable and secure database that is backed by long term support to ensure application continuity. It runs anywhere – public, private and hybrid cloud. With its purpose-built storage engine architecture, MariaDB Enterprise Server supports transactional, analytical and mixed workloads for relational, JSON and vector data models. Popular new features are backported to older release versions so customers do not have to upgrade to the latest version to experience the newest innovation. What's New in Enterprise Server 10 Reasons to Switch to MariaDB .resource-block-bg .img-bg-cover { min-height: 100%; } CUSTOMERs Customers choose MariaDB Enterprise Server because of its enterprise-grade reliability, stability and long-term support for mission-critical applications. Customer Story ServiceNow powers highly available, massive-scale cloud infrastructure with MariaDB ServiceNow powers highly available, massive-scale cloud infrastructure with MariaDB Learn More Customer Story Development Bank of Singapore (DBS) migrates to MariaDB Development Bank of Singapore (DBS) migrates to MariaDB Learn More [class*="bg-g-"], [class*="bg-g-"] h1, [class*="bg-g-"] h2, [class*="bg-g-"] h3, [class*="bg-g-"] p { color: #fff; } Enterprise Features .basic-column .icon { font-size: 50px; } Enterprise Audit Collect detailed connection information and create granular audit rules and templates using JSON documents stored in system tables. Enterprise Backup Take backups on large databases without blocking writes and interrupting applications, or blocking important schema changes. Enterprise Cluster Deploy secure multi-writer clusters with encrypted transaction buffers and default configurations optimized for production. .basic-column .icon { font-size: 50px; } Enterprise Federation Consolidate data access by using MariaDB Enterprise Server to access tables in other databases using standard ODBC connections. Hashicorp Vault Manage encryption keys outside of the database for maximum security and easier, more sophisticated key management. [class*="bg-g-"], [class*="bg-g-"] h1, [class*="bg-g-"] h2, [class*="bg-g-"] h3, [class*="bg-g-"] p { color: #fff; } Capabilities .basic-column .icon { font-size: 50px; } Scalability Scale out databases/data warehouses with parallel query and scale out reads with replication or multi-writer clustering. Learn More Disaster recovery Recover from accidental/malicious data loss with MariaDB Flashback (i.e., online rollback), and be prepared for outages by taking online, non-blocking backups (full and incremental). Learn More .basic-column .icon { font-size: 50px; } Oracle Database compatibility Take advantage of Oracle Database and PL/SQL compatible data types, sequences, triggers and stored procedures to simplify migration. Learn More JSON + relational data Enjoy greater schema flexibility and faster development with hybrid relational/JSON data models, storing data as JSON and querying it with a complete set of JSON functions. Learn More .basic-column .icon { font-size: 50px; } Vector search Build AI applications to help LLMs deliver more accurate and contextually relevant results without the need to integrate multiple databases through native vector search capabilities. [class*="bg-g-"], [class*="bg-g-"] h1, [class*="bg-g-"] h2, [class*="bg-g-"] h3, [class*="bg-g-"] p { color: #fff; } Use Cases .basic-column .icon { font-size: 50px; } Transactions Deploy as a replicated or clustered database (relational, document or hybrid) for fast, reliable and scalable transaction processing using modern SQL and Oracle Database compatibility. Learn More Analytics Deploy as a standalone or distributed data warehouse for interactive analytics using a columnar data format, and support for low-cost object storage in the cloud. Learn More Smart transactions Deploy as a hybrid database with row and columnar storage to deliver insightful customer experiences by infusing standard transactions with more powerful, real-time analytics. Learn More .resource-block-bg .img-bg-cover { min-height: 100%; } Resources White Paper The Ultimate Guide to Database High Availability with MariaDB The Ultimate Guide to Database High Availability with MariaDB Learn More webinar Improve performance and scalability with workload-optimized storage engines Improve performance and scalability with workload-optimized storage engines Learn More White Paper Guide to Hybrid Relational+JSON Data Modeling Guide to Hybrid Relational+JSON Data Modeling Learn More Get Started Download Enterprise Server Contact Us'''
