["https://mariadb.com/openworks/sessions-on-demand/ccv-migrates-payment-processing-system-to-mariadb"]
title = "CCV: migrating our payment processing system to MariaDB | MariaDB"
description = "CCV shares how they are using MariaDB to meet critical high availability requirements, including geographic replication, zero data-loss, zero downtime (planned and unplanned) and no single point of failure anywhere."
full_description = "CCV: migrating our payment processing system to MariaDB Speakers Ernst Wernicke, Senior Database and Storage Specialist, CCV Harry Dijkstra, Senior Database Specialist, CCV Session Abstract CCV is a Dutch payment processor and loyalty provider. CCV's current payment processing platform is built on top of Microsoft SQL Server, but they are currently in the process of migrating it to MariaDB. This migration project is in progress and first production transactions are expected to run in 2020. In this session, Ernst Wernicke and Harry Dijkstra of CCV share how they are using MariaDB to meet critical high availability requirements, including geographic replication, zero data-loss, zero downtime (both planned and unplanned) and no single point of failure anywhere. View presentation slides"
author = "https://www.facebook.com/MariaDB.dbms"
year_published = 2019
