ords from a table GitHub Sequelize (Node.js) Quickstart A collection of code samples that demonstrate the process of quickly getting started with Sequelize, a promise-based Node.js object-relational mapping (ORM) library, to connect to and communicate with a MariaDB using the MariaDB Node.js connector. Samples include examples on how to: Configure a Node.js application to connect to and communicate with MariaDB Manage data stored within a MariaDB database using JavaScript models Set up model associations GitHub Introduction to MariaDB and Object-Relational Mapping Introductory samples and walk-throughs for using Object-Relational Mapping (ORM) libraries with MariaDB connectors. ORM Library Samples: Sequelize (Node.js) Django (Python – Coming soon!) SQLAlchemy (Python – Coming soon!) GitHub Bookings A web application, backed by the power of MariaDB, that unleashes the power of smart transactions on hundreds of millions of records with sub-second query performance without having to add any indexes! GitHub TODO A web application that introduces you to the power, performance and simplicity of MariaDB through simple CREATE-READ-UPDATE-DELETE (CRUD) operations. C++ C# (Dapper) C# (Entity Framework) Java (JDBC + Spring) Java (R2DBC + Spring) Node.js (Basic) Node.js (Sequelize) Python (Basic) Python (SQLAlchemy) Places A web application backed by the power, performance, and simplicity of MariaDB, allows you to record all of your favorite locations using both structured (relational) and semi-structured (JSON) data. Java (JDBC + Spring) Java (R2DBC + Spring) Node.js (Basic) Python (Basic) Flights A web application, backed by the power of MariaDB connectors and MariaDB ColumnStore database, that allows you to analyze over 180 million flight records from the United States Department of Transportation in real time without needing to add any indexes. Node.js (Basic) Python (Basic) MariaDB + NoSQL Connect to and communicate with a MariaDB database instance using a NoSQL driver and MariaDB MaxScale’s NoSQL Listener. The nosqlprotocol module allows a MariaDB server or cluster to be used as the backend of an application using a MongoDB client library. Internally, all documents are stored in a table containing two columns; an id column for the object id and a doc column for the document itself. GitHub Orders A web application that introduces you to the power, performance and simplicity of MariaDB by simulating online e-commerce (ordering) traffic. GitHub DOCUMENTATION The official MariaDB documentation provides the most robust and extensive reference material on MariaDB features and capabilities. View JavaScript / Node.js Documentation Get Started with MariaDB Download MariaDB Docker Container'
