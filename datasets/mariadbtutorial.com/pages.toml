["https://www.mariadbtutorial.com/mariadb-aggregate-functions/mariadb-min"]
title = "MariaDB min"
description = "In this tutorial, you will learn how to use MariaDB min() function to find the minimum value in a set."
full_description = 'MariaDB min() FunctionSummary: in this tutorial, you will learn how to use the MariaDB min() function to find the minimum value in a set.Introduction to MariaDB min() functionThe min() is an aggregate function that returns the minimum value in a set.Here is the syntax of the min() function:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }max(expression) Code language: SQL (Structured Query Language) (sql)Note that the min() function returns null if the set of input values is empty. Like the max() function, the min() function ignores null values.MariaDB min() function examplesWe’ll use the tables countries and regions in the sample database to demonstrate the min() function:A) Using MariaDB min() function to get the minimum value exampleThe following example uses the min() function to get the smallest area of all countries:select min(area) from countries; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="70" height="34" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Min-Function-example.png" alt="MariaDB Min Function example" class="wp-image-672"/>To get the full information of countries that have the smallest areas, you use this query:select name, area from countries where area = ( select min(area) from countries ); Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="234" height="39" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Min-Function-with-subquery.png" alt="MariaDB Min Function with subquery" class="wp-image-673"/>B) Using MariaDB min() function with a group by clause exampleThe min() function is often used with a group by clause to return the minimum value for each group.For example, the following statement uses the min() function with the group by clause to find the smallest countries in each region:select region_id, min(area) from countries group by region_id; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="175" height="261" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Min-Function-with-group-by-clause.png" alt="MariaDB Min Function with group by clause" class="wp-image-674"/>In this example:First, the group by clause divides the countries by regions into groups.Second, the min() function returns the smallest area for each group.To include the region name, you can join the table countries with the table regions as shown in the following query:select regions.name region, min(area) from countries inner join regions using (region_id) group by regions.name order by region; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="250" height="360" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Min-Function-with-group-by-and-join-clauses.png" alt="MariaDB Min Function with group by and join clauses" class="wp-image-675" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Min-Function-with-group-by-and-join-clauses.png 250w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Min-Function-with-group-by-and-join-clauses-208x300.png 208w" sizes="(max-width: 250px) 100vw, 250px" />C) Using MariaDB min() function with a having clause exampleFor example, the following statement finds all regions whose largest countries have areas greater less than 100,000 km2:select regions.name region, min(area) from countries inner join regions using (region_id) group by regions.name having min(area) < 100000 order by region; Code language: SQL (Structured Query Language) (sql)In this tutorial, you learned how to use the MariaDB min() function to find the maximum value in a set of values.Was this tutorial helpful ? Yes No Send Cancel'
