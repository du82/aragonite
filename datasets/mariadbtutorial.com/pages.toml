["https://www.mariadbtutorial.com/mariadb-basics"]
title = "MariaDB Basics"
description = "This MariaDB basics section helps you learn how to query data from tables, manage databases and tables."
full_description = "MariaDB BasicsSection 1. Querying dataSelect – learn how to use a simple select statement to query the data from a table.Section 2. Sorting dataOrder By – show you how to sort a result set returned by a query.Section 3. Filtering dataWhere – learn how to filter rows based on specified conditions.Distinct – select distinct rows from a table.Between – show you how to query data based on a range.In – learn how to determine if a value matches any value in a list.Like – show you how to query rows based on a specified pattern.Limit – show you how to limit rows returned by a queryIs Null – check if a value is null or not.Section 4. Joining tablesTable & Column Aliases – introduce you to table and column aliases.Join – introduce you to the joins supported in MariaDB including inner join, left join, right join, and cross join.Inner join – query rows from a table that have matching rows in another table.Left join – retrieve all rows from the left table that has matching rows from the right table or null in case there is no matching rows.Section 5. Grouping dataGroup By – show you how to group data.Having – guide you on filtering groups a specified condition. Section 6. SubqueriesSubqueries – learn how to use subqueries for querying data from tables.Section 7. Common Table ExpressionsCommon Table Expression or CTE – learn how to use the common table expression.Section 8. Set operatorsUnion – combine two or more result sets of multiple queries into a single result set.Intersect – learn how to use get the intersection of two or more result set.Except – show you how to subtract a result set from another.Section 9. Modifying data in MariaDBInsert – insert a single row into a table using various syntaxes of the insert statement.Insert Multiple Rows – insert multiple rows into a table using a single insert statement.Insert Into select – insert the result set of a query into a table.Update – update existing data in a table.Delete – remove one or more rows from a table.Section 11. MariaDB data typesMariaDB data types – introduce you to various data types in MariaDB.Section 12. Managing MariaDB databases and tablesSelect a MariaDB database – show you how to select a particular database as the current database.Create Database – show you how to create a new database in the MariaDB Server.Alter Database – guide you on how to change the character set and collation of a database.Drop Database – learn how to drop an existing database.Show databases – list databases from a MariaDB server.Create Table – show you how to create a new table in a database.MariaDB storage engines – introduce you to storage engines supported by MariaDB.Alter table – guide you on how to change the structure of an existing table.Drop table – show you how to remove an existing table from a database.Show tables – show tables, views, and sequences from a database.Truncate table – show you how to use the delete all data from a table more efficiently.Section 13. MariaDB constraintsPrimary key – learn how to use a primary key constraint to define a primary key for a table.Foreign key – show you how to define a foreign key for a table using the foreign key constraint.Check constraint – show you how to use the check constraints to ensure the data integrity of a column or a group of columns.Unique constraint – learn how to use unique constraint to enforce the uniqueness of values in a column or a group of columns.Not Null constraint – guide you on how to use not null constraints to ensure values stored in columns are not null."
