["https://www.mariadbtutorial.com/mariadb-basics/mariadb-drop-database"]
title = "MariaDB Drop Database"
description = "In this tutorial, you will learn how to use the MariaDB drop database statement to drop a database from the MariaDB Server."
full_description = "MariaDB Drop DatabaseSummary: in this tutorial, you will learn how to use the MariaDB drop database statement to drop a database from the MariaDB Server.Introduction to MariaDB drop database statementThe drop database statement deletes a database from the current MariaDB server. This action cannot be undone, therefore, you should be very careful with this statement.Here is the syntax of the drop database statement:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }drop database [if exists] database_name; Code language: SQL (Structured Query Language) (sql)In this syntax:First, specify the name of the database that you want to remove after the drop database keywords.Second, use the if exists to conditionally drops the database only if it exists. If you drop a nonexisting database without the if exists option, MariaDB will issue an error. However, if you use the if exists option MariaDB issues a note instead.To execute the drop database statement successfully, you need to have the drop privilege on the database that you want to delete.MariaDB drop database statement exampleFirst, show all databases in the current MariaDB server:mysql> show databases; +--------------------+ | Database | +--------------------+ | crm | | information_schema | | mysql | | nation | | performance_schema | | test | +--------------------+ 6 rows in set (0.00 sec) Code language: SQL (Structured Query Language) (sql)Second, drop the crm database by using the drop database statement:mysql> drop database crm; Query OK, 0 rows affected (0.02 sec) Code language: SQL (Structured Query Language) (sql)In this tutorial, you learned how to use the MariaDB drop database statement to drop a database from the MariaDB Server.Was this tutorial helpful ? Yes No Send Cancel"
