["https://www.mariadbtutorial.com/mariadb-basics/mariadb-insert-multiple-rows"]
title = "MariaDB Insert Multiple Rows Into a Table"
description = "In this tutorial, you will learn how to use the MariaDB insert statement to insert multiple rows into a table."
full_description = '''MariaDB Insert Multiple RowsSummary: in this tutorial, you will learn how to use the MariaDB insert statement to insert multiple rows into a table.Introduction to MariaDB insert multiple rows statementTo insert multiple rows into a table using a single insert statement, you use the following syntax:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }insert into table_name(column_list) values (value_list_1), (value_list_2), (value_list_3), ...; Code language: SQL (Structured Query Language) (sql)In this syntax:First, specify the name of the table and a list of columns in parentheses.Second, specify a list of comma-separated lists of values that correspond to the columns. Each element of the list maps to a row in the table.MariaDB insert multiple rows exampleWe’ll use the contacts table for the demonstration. Note that the contacts table was created in the insert statement tutorial.create table if not exists contacts( id int auto_increment, first_name varchar(50) not null, last_name varchar(50) not null, full_name varchar(101) as (concat(first_name, ' ', last_name)) virtual, phone varchar(100), contact_group varchar(50) default 'General', primary key(id) ); Code language: SQL (Structured Query Language) (sql)A) Inserting multiple rows into a table exampleThe following statement inserts three rows into the contacts table:insert into contacts(first_name, last_name, phone, contact_group) values ('James','Smith','(408)-232-2352','Customers'), ('Michael','Smith','(408)-232-6343','Customers'), ('Maria','Garcia','(408)-232-3434','Customers'); Code language: SQL (Structured Query Language) (sql)MariaDB will issue the following message:Affected rows: 3 Found rows: 0 Warnings: 0 Duration for 1 query: 0.016 sec. Code language: SQL (Structured Query Language) (sql)It means that the three rows have been inserted successfully.The following query shows the contents of the contacts table:select * from contacts; Code language: SQL (Structured Query Language) (sql)B) Inserting multiple rows into a table and returning inserted id exampleWhen you insert multiple rows into a table that has an auto_increment column, the last_insert_id() function returns the first generated id, not the last id. In addition, it does not return all the inserted ids.Let’s see the following example.First, insert two rows into the contacts table:insert into contacts(first_name, last_name, phone, contact_group) values ('James','Johnson','(408)-232-4523','Customers'), ('Mary','Rodriguez','(408)-232-4532','Customers'); Code language: SQL (Structured Query Language) (sql)Second, query the contents of the contacts table:select * from contacts; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="531" height="182" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Insert-multiple-rows-example.png" alt="MariaDB Insert multiple rows example" class="wp-image-303" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Insert-multiple-rows-example.png 531w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Insert-multiple-rows-example-300x103.png 300w" sizes="(max-width: 531px) 100vw, 531px" />Third, get the insert id using the last_insert_id() function:select last_insert_id(); Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="99" height="39" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Insert-multiple-rows-and-last_insert_id-example.png" alt="MariaDB Insert multiple rows and last_insert_id example" class="wp-image-305"/>The returned id is 7, not 8.In this tutorial, you learned how to use the MariaDB insert statement to insert multiple rows into a table.Was this tutorial helpful ? Yes No Send Cancel'''
