["https://www.mariadbtutorial.com/mariadb-date-functions"]
title = "MariaDB Date Functions"
description = "This page provides you with the most commonly used MariaDB date functions that allow you to manipulate dates effectively."
full_description = "MariaDB Date FunctionsThis page provides you with the most commonly used MariaDB date functions. FunctionDescriptioncurdate()return the current date of the server on which the MariaDB Server runsdatediff()return the number of days between two datesday()return the day of the month of a datedate_add()add an interval to a datedate_sub()subtract an interval from a datedate_format()return a date formatted by a specific formatdayname()return the weekday name of a datedayofweek()return the weekday index of a dateextract()extract a component e.g., day, month, and year from a datelast_day()return the last day of the month of a datenow()return the current date and time at which the SQL command executesmonth()return an integer that represents a month of a datestr_to_date()return a date converted from a stringsysdate()return the current datetimediff()return the difference between the two time values or datetime valuestimestampdiff()return the difference between two timestampsweek()return the week number of a dateweekday()return the weekday of a dateyear()return the year of a date"
