["https://www.mariadbtutorial.com/mariadb-basics/mariadb-between"]
title = "MariaDB Between"
description = "In this tutorial, you will learn how to use the MariaDB between operator to test if a value is between two other values."
full_description = '''MariaDB BetweenSummary: in this tutorial, you will learn how to use the MariaDB between operator to test if a value is between two other values.Introduction to MariaDB between operatorThe MariaDB between operator is a logical operator that returns true if a value is between two valuesThe between operator is typically used in the where clause to form a search condition.Here is the syntax of the between operator:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }expression between low and high Code language: SQL (Structured Query Language) (sql)In this syntax, low and high are literal values or expressions. The low value must be less than the high value.The between operator returns true if the expression is less than or equal to the high value and greater than or equal to the low value.In other words, the between operator is syntactic sugar of the following expression:expression >= low and expression <= high Code language: SQL (Structured Query Language) (sql)To negate the between operator, you use the not operator.expression not between low and high Code language: SQL (Structured Query Language) (sql)The not between returns true if the expression is not between two other values, or:expression < low or expression > high Code language: SQL (Structured Query Language) (sql)MariaDB between operator examplesWe’ll use the countries table form the sample database for the demonstration:<img decoding="async" width="144" height="184" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/countries.png" alt="" class="wp-image-144"/>A) Using the MariaDB between operator with numbers exampleThe following example uses the between operator to find countries that have areas between 1,566,500 and 2,780,400:select name, area from countries where area between 1566500 and 2780400 order by area; Code language: SQL (Structured Query Language) (sql)Note that the above query is equivalent to the following query: select name, area from countries where area >= 1566500 and area <= 2780400 order by area; Code language: SQL (Structured Query Language) (sql)B) Using MariaDB between operator with dates exampleThe following statement uses the between operator to find countries which have national days that fall between August 17, 1945 and November 09, 1953:select name, national_day from countries where national_day between '1945-08-17' and '1953-11-09' order by national_day; Code language: SQL (Structured Query Language) (sql)<img decoding="async" class="alignnone size-full wp-image-183" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-between-example.png" alt="mariadb between example" width="176" height="248">C) Using MariaDB not between operator exampleThe following statement uses the not between operator to find countries whose national does not fall between August 17, 1945 and November 09, 1953:select name, national_day from countries where national_day not between '1945-08-17' and '1953-11-09' order by national_day; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="248" height="291" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-not-between-example.png" alt="mariadb not between example" class="wp-image-184"/>In this tutorial, you have learned how to use the MariaDB between operator to test if a value is between two other values.Was this tutorial helpful ? Yes No Send Cancel'''
