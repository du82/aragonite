["https://www.mariadbtutorial.com/mariadb-aggregate-functions/mariadb-group_concat"]
title = "MariaDB group_concat() Aggregate Function By Practical Examples"
description = "In this tutorial, you'll learn how to use the MariaDB group_concat() aggregate function to concatenate strings in a group."
full_description = '''MariaDB group_concat() FunctionSummary: in this tutorial, you’ll learn how to use the MariaDB group_concat() aggregate function to concatenate strings in a group.An overview of the MariaDB group_concat() functionThe MariaDB group_concat() is an aggregate function that concatenates a group of strings into a single string.Here is the syntax of the group_concat() function:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }group_concat( [distinct] expression [,expression...] [order by sort_expression [asc | desc],...] Code language: SQL (Structured Query Language) (sql)[separator sep] );In this syntax:The distinct clause eliminates duplicate strings before concatenating them.The order by clause sorts the values in ascending or descending order before concatenation.The separator clause specifies a separator between string elements in the result string. The default separator is a comma (,).The group_concat() returns null if either the set of input strings is empty or all arguments are null. The group_concat() function ignores null values.MariaDB group_concat() function examplesWe’ll use the tables languages, country_languages, countries from the sample database for the demonstration.The following statement uses the group_concat() function to return the countries and their languages:select countries.name country, group_concat(language) languages from countries inner join country_languages using (country_id) inner join languages using (language_Id) group by country; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="480" height="359" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-group_concat-example.png" alt="MariaDB group_concat example" class="wp-image-697" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-group_concat-example.png 480w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-group_concat-example-300x224.png 300w" sizes="(max-width: 480px) 100vw, 480px" />To sort the languages in each country, you use the order by clause in the group_concat() function:select countries.name country, group_concat( language order by language ) languages from countries inner join country_languages using (country_id) inner join languages using (language_Id) group by country; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="479" height="358" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-group_concat-with-order-by-example.png" alt="MariaDB group_concat with order by example" class="wp-image-698" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-group_concat-with-order-by-example.png 479w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-group_concat-with-order-by-example-300x224.png 300w" sizes="(max-width: 479px) 100vw, 479px" />To place the official language at the beginning and other languages at the end of the list, you use the order by clause:select countries.name country, group_concat( language order by official desc, language asc ) languages from countries inner join country_languages using (country_id) inner join languages using (language_Id) group by country; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="482" height="361" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-group_concat-with-order-by-example-2.png" alt="MariaDB group_concat with order by example 2" class="wp-image-699" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-group_concat-with-order-by-example-2.png 482w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-group_concat-with-order-by-example-2-300x225.png 300w" sizes="(max-width: 482px) 100vw, 482px" />If you want to use the separator (/) instead of the comma (,), you use the separator clause as shown in the following example:select countries.name country, group_concat( language order by official desc, language asc separator '/' ) languages from countries inner join country_languages using (country_id) inner join languages using (language_Id) group by country; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="479" height="358" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-group_concat-with-a-separator-example.png" alt="MariaDB group_concat with a separator example" class="wp-image-700" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-group_concat-with-a-separator-example.png 479w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-group_concat-with-a-separator-example-300x224.png 300w" sizes="(max-width: 479px) 100vw, 479px" />In this tutorial, you learned how to use the MariaDB group_concat() function to concatenate strings in a group into a single string with some options.Was this tutorial helpful ? Yes No Send Cancel'''
