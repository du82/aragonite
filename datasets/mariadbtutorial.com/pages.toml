["https://www.mariadbtutorial.com/mariadb-basics/mariadb-insert-into-select"]
title = "MariaDB Insert Into Select Statement By Practical Examples"
description = "In this tutorial, you will learn how to use the MariaDB insert into select statement to insert result sets of a query into a table."
full_description = 'MariaDB Insert Into SelectSummary: in this tutorial, you will learn how to use the MariaDB insert into select statement to insert result sets of a query into a table.The value list of an insert statement can be either literal values or the result set of a query.The following shows the syntax of the insert statement whose value list comes from a select statement:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }insert into table_name(column_list) select select_list from table_name ...; Code language: SQL (Structured Query Language) (sql)In this syntax:First, specify the name of the table and a list of columns that you want to insert data.Second, specify the select statement that returns a result set whose columns are corresponding to the column_list;The insert into select statement can be very useful to copy data from one table to another table or to insert a summary data from tables into a table.MariaDB insert into select examplesWe’ll use the tables countries and regions from the sample database for the demonstration:A) Inserting rows from a table into another table exampleFirst, create a new table called small_countries:create table small_countries( country_id int primary key, name varchar(50) not null, area decimal(10,2) not null, ); Code language: SQL (Structured Query Language) (sql)Second, insert countries whose areas are less than 50,000 km2 from the countries table into the small_countries table:insert into small_countries (country_id,name,area) select country_id, name, area from countries where area < 50000; Code language: SQL (Structured Query Language) (sql)Third, query data from the small_countries table:select * from small_countries; Code language: SQL (Structured Query Language) (sql)<img decoding="async" class="alignnone size-full wp-image-311" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Insert-Into-Select.png" alt="MariaDB Insert Into Select" width="419" height="340" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Insert-Into-Select.png 419w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Insert-Into-Select-300x243.png 300w" sizes="(max-width: 419px) 100vw, 419px" />B) Inserting summary data of tables into another table exampleFirst, create a table called region_areas that stores names and areas of regions.create table region_areas( region_name varchar(100) not null, region_area decimal(15,2) not null, primary key(region_name) ); Code language: SQL (Structured Query Language) (sql)Second, query data from tables countries and regions and insert it into the table region_areas:insert into region_areas (region_name, region_area) select regions.name, sum(area) from countries inner join regions using (region_id) group by regions.name; Code language: SQL (Structured Query Language) (sql)Third, query data from the region_areas table:select * from region_areas order by region_area; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="277" height="265" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Insert-Into-Select-inserting-summary-data.png" alt="MariaDB Insert Into Select - inserting summary data" class="wp-image-312"/>In this tutorial, you have learned how to use the MariaDB insert into select statement to insert a result set of a query into a table.Was this tutorial helpful ? Yes No Send Cancel'
