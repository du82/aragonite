["https://www.mariadbtutorial.com/getting-started/install-mariadb"]
title = "Install MariaDB"
description = "In this tutorial, you will learn step by step how to download and install MariaDB on your system."
full_description = '''Install MariaDBSummary: in this tutorial, you will learn step by step how to download and install MariaDB on your system.Download MariaDBTo download MariaDB, you go to the download page and select the latest version to download:Download MariaDBInstall MariaDBTo install MariaDB on Windows, you follow these steps:Step 1. Start installationDouble-click the installer to start the installation process.Step 2. Accept the end-user license agreementRead the end-user license agreement and click the Next button:<img decoding="async" width="495" height="387" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/Install-MariaDb-Windows-step-2.png" alt="Install MariaDB Windows step 2" class="wp-image-48" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/Install-MariaDb-Windows-step-2.png 495w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/Install-MariaDb-Windows-step-2-300x235.png 300w" sizes="(max-width: 495px) 100vw, 495px" />Step 3. Select featuresChoose the directory that stores the MariaDB files and click the Next button. The default location on Windows is C:\Program Files\MariaDB 10.4\.<img decoding="async" width="495" height="387" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/Install-MariaDb-Windows-step-3.png" alt="Install MariaDb Windows step 3" class="wp-image-49" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/Install-MariaDb-Windows-step-3.png 495w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/Install-MariaDb-Windows-step-3-300x235.png 300w" sizes="(max-width: 495px) 100vw, 495px" />Step 4. Set root’s passwordType a password for the root user account. You will use this password to connect to MariaDB later. The root user is the default user of the MariaDB, which has all privileges.If you don’t want the root user to login from a remote machine, you need to uncheck the Enable access from remote machines for 'root' user checkbox.The Use UTF8 as the default server's character set option allows you to use the UTF8 as the default character set when you create new databases and tables.Once you complete selecting all options, click the Next button to go to the next step.<img decoding="async" width="493" height="385" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/Install-MariaDb-Windows-step-4.png" alt="" class="wp-image-50" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/Install-MariaDb-Windows-step-4.png 493w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/Install-MariaDb-Windows-step-4-300x234.png 300w" sizes="(max-width: 493px) 100vw, 493px" />Step 5. Configure DatabaseIn this step:First, install MariaDB as a service by selecting the Install as service option. It allows you to rename the service name.Second, configure the port for the MariaDB. By default, MariaDB uses 3306 port. However, you can change it to your port if you want.Third, specify the parameters for the Innodb engine including buffer pool size and page size. 16KB page size is suitable for most databases.Finally, click the Next button to go to the next step.<img decoding="async" width="493" height="385" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/Install-MariaDb-Windows-step-5.png" alt="" class="wp-image-51" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/Install-MariaDb-Windows-step-5.png 493w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/Install-MariaDb-Windows-step-5-300x234.png 300w" sizes="(max-width: 493px) 100vw, 493px" />Step 6. Submit usage informationIf you want to submit anonymous usage information so that MariaDB developers can improve the system, check the checkbox and click the Next button.<img decoding="async" width="495" height="387" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/Install-MariaDb-Windows-step-6.png" alt="" class="wp-image-53" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/Install-MariaDb-Windows-step-6.png 495w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/Install-MariaDb-Windows-step-6-300x235.png 300w" sizes="(max-width: 495px) 100vw, 495px" />Step 7. Ready to install MariaDBClick the Install button to start installing MariaDB<img decoding="async" width="493" height="385" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/Install-MariaDb-Windows-step-7.png" alt="Install MariaDB Windows step 7" class="wp-image-54" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/Install-MariaDb-Windows-step-7.png 493w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/Install-MariaDb-Windows-step-7-300x234.png 300w" sizes="(max-width: 493px) 100vw, 493px" />It will take a few minutes depending on the system.<img decoding="async" width="493" height="385" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/Install-MariaDb-Windows-step-7-1.png" alt="" class="wp-image-55" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/Install-MariaDb-Windows-step-7-1.png 493w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/Install-MariaDb-Windows-step-7-1-300x234.png 300w" sizes="(max-width: 493px) 100vw, 493px" />Step 8. Complete the MariaDB setupClick the Finish button to complete MariaDB setup<img decoding="async" width="493" height="385" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/Install-MariaDb-Windows-step-8.png" alt="Install MariaDB Windows step 8" class="wp-image-56" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/Install-MariaDb-Windows-step-8.png 493w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/Install-MariaDb-Windows-step-8-300x234.png 300w" sizes="(max-width: 493px) 100vw, 493px" />You can find the MariaDB tools in the startup menu:<img decoding="async" width="271" height="256" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/Install-MariaDB.png" alt="Install MariaDB" class="wp-image-57"/>In this tutorial, you have learned step by step how to install MariaDB on Windows.Was this tutorial helpful ? Yes No Send Cancel'''
