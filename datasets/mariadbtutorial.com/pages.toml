["https://www.mariadbtutorial.com/mariadb-aggregate-functions/mariadb-max"]
title = "MariaDB Max Aggregate Function By Practical Examples"
description = "In this tutorial, you will learn how to use MariaDB max() function to find the maximum value in a set."
full_description = 'MariaDB max() FunctionSummary: in this tutorial, you will learn how to use MariaDB max() function to find the maximum value in a set.Introduction to MariaDB max() functionThe max() is an aggregate function that returns the maximum value in a set.The following illustrates the syntax of the max() function:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }max(expression) Code language: SQL (Structured Query Language) (sql)The max() function returns null if the set is empty. The max() function ignores null values.MariaDB max() function examplesWe’ll use the tables countries and regions in the sample database to demonstration the max() function:A) Using MariaDB max() function to get the highest value exampleThe following example uses the max() function to get the largest area of all countries:select max(area) from countries; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="97" height="40" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Max-Function-Example.png" alt="MariaDB Max Function Example" class="wp-image-663"/>To find the country that has the largest area, you use the above query as a subquery:select name, area from countries where area = ( select max(area) from countries ); Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="225" height="41" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Max-Function-subquery.png" alt="MariaDB Max Function subquery" class="wp-image-664"/>B) Using MariaDB max() function with a group by clause exampleThe max() function is often used with a group by clause to find the maximum value for each group.For example, the following example uses the max() function with the group by clause to find the largest countries in each region:select region_id, max(area) from countries group by region_id; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="190" height="222" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Max-Function-group-by-clause.png" alt="MariaDB Max Function group by clause" class="wp-image-662"/>In this example:First, the group by clause divides the countries by regions into groups.Second, the max() function returns the largest areas for each group.To get the region name instead of id, you can join the table countries with the table regions:select regions.name region, max(area) from countries inner join regions using (region_id) group by regions.name order by region; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="258" height="258" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Max-Function-group-by-with-join.png" alt="" class="wp-image-665" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Max-Function-group-by-with-join.png 258w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Max-Function-group-by-with-join-150x150.png 150w" sizes="(max-width: 258px) 100vw, 258px" />C) Using MariaDB max() function with a having clause exampleYou can use the max() function in the having clause to filter groups. For example, the following statement finds all regions which have the largest regions greater than 1,000,000 km2:select max(area), regions.name region from countries inner join regions using (region_id) group by regions.name having max(area) > 1000000 order by region; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="260" height="317" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Max-Function-group-by-and-having.png" alt="" class="wp-image-666" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Max-Function-group-by-and-having.png 260w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Max-Function-group-by-and-having-246x300.png 246w" sizes="(max-width: 260px) 100vw, 260px" />In this tutorial, you learned how to use the MariaDB max() function to find the maximum value in a set of values.Was this tutorial helpful ? Yes No Send Cancel'
