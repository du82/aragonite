["https://www.mariadbtutorial.com/getting-started/connect-to-mariadb"]
title = "How to Connect to MariaDB"
description = "In this tutorial, you will learn how to connect to the MariaDB server using the mysql command-line program."
full_description = "Connect to MariaDBSummary: in this tutorial, you will learn how to connect to the MariaDB server using the mysql command-line program.To connect to MariaDB, you can use any MariaDB client program with the correct parameters such as hostname, user name, password, and database name.In the following section, you will learn how to connect to a MariaDB Server using the mysql command-line client.Connecting to the MariaDB server with a username and passwordThe following command connects to the MariaDB server on the localhost:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }mysql -u [username] -p [password] Code language: SQL (Structured Query Language) (sql)In this command:-u specifies the username-p specifies the password of the usernameNote that the password is followed immediately after the -p option.For example, this command connects to the MariaDB server on the localhost:mysql -u root -p S@cure1PassCode language: SQL (Structured Query Language) (sql)In this command, root is the username and S@cure1Pass is the password of the root user account.Notice that using the password on the command line can be insecure. Typically, you leave out the password from the command as follows:mysql -u root -pCode language: SQL (Structured Query Language) (sql)It will prompt for a password. You type the password to connect to the MariaDB server:Enter password: ******** Code language: SQL (Structured Query Language) (sql)Once you are connected, you will see a welcome screen with the following command line:mysql>Code language: SQL (Structured Query Language) (sql)Now, you can start using any SQL statement. For example, you can show all databases in the current server using the show databases command as follows:show databases;Code language: SQL (Structured Query Language) (sql)Here is the output that shows the default databases:+--------------------+ | Database | +--------------------+ | information_schema | | mysql | | performance_schema | | test | +--------------------+ 4 rows in set (0.01 sec) Code language: SQL (Structured Query Language) (sql)Connecting to the MariaDB server on a specific hostTo connect to MariaDB on a specific host, you use the -h option:mysql -u [username] -p [password] -h [hostname]Code language: SQL (Structured Query Language) (sql)For example, the following command connects to the MariaDB server with IP 172.16.13.5 using the root account:mysql -u root -p -h 172.16.13.5Code language: SQL (Structured Query Language) (sql)It will also prompt for a password:Enter password: ******** Code language: SQL (Structured Query Language) (sql)Note that the root account must be enabled for remote access in this case.Connecting to a specific database on the MariaDB serverTo connect to a specific database, you specify the database name after all the options:mysql -u [username] -p[password] -h [hostname] database_nameCode language: SQL (Structured Query Language) (sql)The following command connects to the information_schema database of the MariaDB server on the localhost:mysql -u root -p -h localhost information_schema Enter password: ********Code language: SQL (Structured Query Language) (sql)The mysql client command-line default parametersWhen you type the mysql command with any option, mysql client will accept the default parameters.mysqlCode language: SQL (Structured Query Language) (sql)In this case:The hostname is localhostThe username is either the login name on Linux or ODBC on WindowsNo password is sentThe client will connect to the server without any particular database.In this tutorial, you will learn how to connect to the MariaDB server using the mysql command-line client.Was this tutorial helpful ? Yes No Send Cancel"
