["https://www.mariadbtutorial.com/mariadb-basics/mariadb-intersect"]
title = "MariaDB Intersect"
description = "In this tutorial, you will learn how to use the MariaDB intersect operator to combine result sets of two or more queries."
full_description = 'MariaDB IntersectSummary: in this tutorial, you will learn how to use the MariaDB intersect operator to combine result sets of two or more queries.Introduction to MariaDB intersect operatorThe MariaDB intersect operator combines result sets of two or more select statements and returns the distinct rows from the queries’ result sets.Here is the syntax of the MariaDB intersect operator:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }select-statement1 intersect select-statement2 intersect select-statement3 ... [order by sort_expression]; Code language: SQL (Structured Query Language) (sql)In this syntax:First, specify queries that you want to combine their result sets.Second, connect two queries by the intersect operator.The select statements such as select-statement1, select-statement2, etc., must follow these requirements:The select lists of the select statements must have the same number of columns.The data types of the corresponding columns must be the same.The intersect operator returns the distinct rows that are returned by all the queries.The intersect operator uses column names of the first select statement as the column names of the final result set.The order by clause of the individual select statement has no effect on the order of rows in the final result. If you want to sort the final result set, you can use a global order by clause that appears on the last select statement.The following picture illustrates the intersect operation:MariaDB intersect operator exampleSee the following tables guests and vips from the sample database.<img decoding="async" width="129" height="122" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-guests-table-data.png" alt="MariaDB guests table data" class="wp-image-395"/><img decoding="async" width="138" height="121" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-vips-table-data.png" alt="" class="wp-image-396"/>This example uses the intersect operator to find contacts who are both guests and vips:select name from guests intersect select name from vips order by name; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="58" height="59" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-intersect-example.png" alt="MariaDB intersect example" class="wp-image-394"/>In this tutorial, you have learned about the MariaDB intersect operator and how to use it to combine result sets of queries.Was this tutorial helpful ? Yes No Send Cancel'
