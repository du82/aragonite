["https://www.mariadbtutorial.com/mariadb-basics/mariadb-is-null"]
title = "MariaDB Is Null - Checking If a Value is Null or Not"
description = "In this tutorial, you will learn how to use the MariaDB is null and is not null operators to check if a value is null or not."
full_description = '''MariaDB Is NullSummary: in this tutorial, you will learn how to use the MariaDB is null and is not null operators to check if a value is null or not.Introduction to MariaDB is null operatorIn MariaDB, null is a maker that indicates an unknown value, missing value, or inapplicable value.null does not equal to any value, even itself. Therefore, you cannot use any comparison operator (=, >, <, >=, <=, !=) to compare null with another value.To check if a value is null or not, you use the is null operator:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }expression is null Code language: SQL (Structured Query Language) (sql)The is null returns true if the expression is null; otherwise, it returns false.Note that in MariaDB, a value of 0 is considered false and non-zero values considered true.The following example illustrates the result of the is null operator when comparing zero, empty string, and null with null:select 0 is null, '' is null, null is null; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="214" height="42" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-is-null-example.png" alt="mariadb is null example" class="wp-image-210"/>To negate the is null operator, you use the is not null operator:value is not null Code language: SQL (Structured Query Language) (sql)The expression returns true if the value is not null; otherwise, it returns false.The following example shows the result of zero, empty string, and null when comparing with null using the is not null operator:select 0 is not null, '' is not null, null is not null; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="281" height="43" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-is-not-null-example-2.png" alt="" class="wp-image-214"/>MariaDB is null operator examplesLet’s use the countries table from the sample database to demonstrate the is null operator.A) Using the MariaDB is null operator exampleThe following example uses the is null operator to find the countries that have unknown national days:select name, national_day from countries where national_day is null order by name; Code language: SQL (Structured Query Language) (sql)B) Using the MariaDB is not null operator exampleThe following example uses the is not null operator to find countries that have national days recorded:select name, national_day from countries where national_day is not null order by name; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="283" height="42" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-is-not-null-example-1.png" alt="mariadb is not null example" class="wp-image-212"/>In this tutorial, you have learned how to use the MariaDB is null operator to check if a value is null or not.Was this tutorial helpful ? Yes No Send Cancel'''
