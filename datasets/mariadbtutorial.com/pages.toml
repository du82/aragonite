["https://www.mariadbtutorial.com/mariadb-basics/mariadb-order-by"]
title = "MariaDB Order By"
description = "In this tutorial, you will learn how to use the MariaDB order by clause to sort a result set by values in one or more columns in ascending or descending order."
full_description = 'MariaDB Order BySummary: in this tutorial, you will learn how to use the MariaDB order by clause to sort the result of a query.Introduction to MariaDB order by clauseThe select statement returns a result set whose rows are not in any specific order. To sort the rows of a result set by values in one or more columns, you use the order by clause.The following shows the syntax of the select statement with an order by clause:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }select select_list from table_name order by sort_expression1 [asc | desc], sort_expression2 [asc | desc], ...; Code language: SQL (Structured Query Language) (sql)The order by clause appears at the end of a select statement.In this syntax:First, specify one or more sort expression sort_expression1, sort_expression2, … which can be columns or expressions by which you want to order.Then, use asc or desc to sort the rows in the result set in ascending order (asc) or descending order (desc).The order by clause uses asc by default.MariaDB evaluates clauses of the select statement in the following orders: from, select and order by:<img decoding="async" width="531" height="84" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-order-by.png" alt="mariadb order by" class="wp-image-179" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-order-by.png 531w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-order-by-300x47.png 300w" sizes="(max-width: 531px) 100vw, 531px" />MariaDB order by clause examplesWe’ll use the countries table from the sample database for the demonstration.<img decoding="async" width="144" height="184" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/countries.png" alt="" class="wp-image-144"/>A) Using MariaDB order by clause to sort rows by one column exampleThe following select statement returns the names and areas of countries:select name, area from countries order by name; Code language: SQL (Structured Query Language) (sql)As you can see, the order of rows in the result set is not specified.The following select statement uses the order by clause to sort countries by name:select name, area from countries order by name; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="336" height="331" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-order-by-one-column-asc-example.png" alt="mariadb order by - one column asc example" class="wp-image-159" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-order-by-one-column-asc-example.png 336w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-order-by-one-column-asc-example-300x296.png 300w" sizes="(max-width: 336px) 100vw, 336px" />The order by clause sorted the countries by name in ascending order because it uses asc by default.To sort the countries by name in descending order, you use the desc option:select name, area from countries order by name desc; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="404" height="331" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-order-by-one-column-desc-example.png" alt="mariadb order by - one column desc example" class="wp-image-161" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-order-by-one-column-desc-example.png 404w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-order-by-one-column-desc-example-300x246.png 300w" sizes="(max-width: 404px) 100vw, 404px" />B) Using MariaDB order by clause to sort a result set by two columns exampleThe following statement uses the order by clause to sort countries by name and region_id:select name, region_id from countries order by region_id, name; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="340" height="314" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-order-by-two-columns.png" alt="mariadb order by - two columns" class="wp-image-163" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-order-by-two-columns.png 340w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-order-by-two-columns-300x277.png 300w" sizes="(max-width: 340px) 100vw, 340px" />In this statement, the order by sorts the rows in the following sequence:First, sort the countries by values in region_id column from low to high.Then, sort the sorted countries by values in the name column alphabetically.MariaDB order by clause with null valuesThe null is a special value in MariaDB. The null indicates that a value is missing or not applicable.MariaDB treats null as the lowest value so when you sort by a column that has null values, null values appear first in the result set.The following statement uses the order by clause to sort countries by national days:select name, national_day from countries order by national_day; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="378" height="293" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-order-by-with-null-values.png" alt="mariadb order by - with null values" class="wp-image-164" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-order-by-with-null-values.png 378w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-order-by-with-null-values-300x233.png 300w" sizes="(max-width: 378px) 100vw, 378px" />If you use the desc in this case, the null values will appear last in the result set:select name, national_day from countries order by national_day desc; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="302" height="291" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-order-by-with-null-desc.png" alt="mariadb order by - with null desc" class="wp-image-165" title="mariadb order by - with null desc" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-order-by-with-null-desc.png 302w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-order-by-with-null-desc-300x289.png 300w" sizes="(max-width: 302px) 100vw, 302px" />In this tutorial, you have learned how to use the MariaDB order by clause to sort a result set by values in one or more columns in ascending or descending order.Was this tutorial helpful ? Yes No Send Cancel'
