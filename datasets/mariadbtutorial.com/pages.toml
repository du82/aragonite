["https://www.mariadbtutorial.com/mariadb-basics/mariadb-in"]
title = "MariaDB IN Operator By Practical Examples"
description = "In this tutorial, you will learn how to use the MariaDB in operator to match a value with a list of values."
full_description = '''MariaDB InSummary: in this tutorial, you will learn how to use the MariaDB in operator to match a value with a list of values.Introduction to MariaDB in operatorThe MariaDB in is a logical operator that compares a value with a list of values:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }expression IN (v1, v2, v3, ...) Code language: SQL (Structured Query Language) (sql)The in operator returns true if expression matches any values in the list i.e., v1, v2, v3, etc.The value list can be a comma-separated list of literal values or a result set of another select statement.expression in (select-statement) Code language: SQL (Structured Query Language) (sql)The select statement inside parentheses must return a list of values of one column, or the query will result in an error.Logically, the in operator is equivalent to the following expressions:expression = v1 or expression = v2 or expression = v3 or ... Code language: SQL (Structured Query Language) (sql)Therefore, you can replace an expression with multiple or operators with the in operator to make the code cleaner.not in operatorThe not operator negates the in operator:expression NOT IN (v1, v2, v3, ...) Code language: SQL (Structured Query Language) (sql)It is syntactic sugar of the following expression:expression <> v1 AND expression <> v2 AND expression <> v3 AND ... Code language: SQL (Structured Query Language) (sql)The in operator is often used in the where clause of the select, delete, and update statements.MariaDB in operator examplesWe’ll use the countries table from the nation sample database to demonstrate the in operator.<img decoding="async" width="144" height="184" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/countries.png" alt="" class="wp-image-144"/>A) Using the MariaDB in operator with a list of numeric valuesThe following example uses the in operator to find countries whose region id is in a list of 1, 2, and 3:select name, region_id from countries where region_id in (1,2,3) order by name; Code language: SQL (Structured Query Language) (sql)It is equivalent to the following query:select name, region_id from countries where region_id = 1 or region_id = 2 or region_id = 3 order by name; Code language: SQL (Structured Query Language) (sql)B) Using the MariaDB in operator with a select statementThe following statement returns a list of region id of regions in Asia:select region_id from regions where name like '%Asia%'; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="96" height="84" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-in-region-id-list.png" alt="MariaDB in - region id list" class="wp-image-196"/>You can use the returned id list as the input of the in operator as shown in the following query:select name, region_id from countries where region_id in ( select region_id from regions where name like '%Asia%' ) order by name;Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="181" height="377" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-in-with-a-subquery.png" alt="MariaDB in with a subquery" class="wp-image-197" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-in-with-a-subquery.png 181w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-in-with-a-subquery-144x300.png 144w" sizes="(max-width: 181px) 100vw, 181px" />In this tutorial, you have learned how to use the MariaDB in operator to match a value with a list of values.Was this tutorial helpful ? Yes No Send Cancel'''
