["https://www.mariadbtutorial.com/mariadb-basics/mariadb-show-tables"]
title = "MariaDB Show Tables"
description = "In this tutorial, you will learn how to use the MariaDB show tables statement to list tables, views, and sequences in a specific database."
full_description = "MariaDB Show TablesSummary: in this tutorial, you will learn how to use the MariaDB show tables statement to list tables, views, and sequences in a specific database.Introduction to the MariaDB show tables statementThe show tables statement allows you to list the non-temporary tables, views, and sequences from a database.Here is the syntax of the show tables statement:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }show [full] tables Code language: SQL (Structured Query Language) (sql)[from database_name] [like ‘pattern’ | where search_expression];If you already selected a database, the show tables statement returns the tables, views, and sequences in the current database:show tables; Code language: SQL (Structured Query Language) (sql)In case you haven’t connected to any particular database, you can use the from clause to specify the name of the database from which you want to show the tables, views, and sequences:show tables from database_name; Code language: SQL (Structured Query Language) (sql)The full option instructs the show tables statement to include an additional column called table_type in the result set. The table_type can be the base table, view, or sequence.show full tables from database_name; Code language: SQL (Structured Query Language) (sql)The like or where clause allows you to specify a search condition to find tables, views, and sequences. You cannot use both of these clauses at the same time.You use the like clause when you want to match tables, views, and sequences by a pattern. And you use the where clause when you want to form a more complex search condition.MariaDB show tables statement exampleLet’s take some examples of using the show tables statement.A) Using MariaDB show tables statement to list tables in the current databaseFirst, connect to the nation sample database.Second, use the show tables statement to list all tables, views, and sequences in the nation database:show tables; Code language: SQL (Structured Query Language) (sql)Third, use the show tables statement with the full option:show full tables; Code language: SQL (Structured Query Language) (sql)B) Using MariaDB show tables statement with a like clauseThe following statement uses the show tables with a like clause to find tables, view, and sequences whose names start with the word country:show full tables like 'country%' Code language: SQL (Structured Query Language) (sql)C) Using MariaDB show tables statement with a where clauseThe following statement uses the show tables statement with a where clause to list all tables in the nation database:show full tables where table_type = 'base table'; Code language: SQL (Structured Query Language) (sql)And this statement lists all views in the nation database:show full tables where table_type = 'view'; Code language: SQL (Structured Query Language) (sql)In this tutorial, you learned how to use the MariaDB show tables statement to list tables, views, and sequences in a specific database.Was this tutorial helpful ? Yes No Send Cancel"
