["https://www.mariadbtutorial.com/mariadb-basics/mariadb-insert"]
title = "Learn MariaDB Insert Statement By Practical Examples"
description = "In this tutorial, you will learn how to use the MariaDB insert statement to insert a new row into a table."
full_description = '''MariaDB InsertSummary: in this tutorial, you will learn how to use the MariaDB insert statement to insert a row into a table.Introduction MariaDB insert statementThe insert statement allows you to add a new row to a table. The following shows the syntax of the insert statement:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }insert into table_name(column_list) values(value_list); Code language: SQL (Structured Query Language) (sql)In this syntax:First, specify the name of the table that you want to insert data after the insert into keywords.Second, specify a list of columns of the table within parentheses after the table name.Third, specify a list of values in parentheses, which follows the values keyword. The number of values must be the same as the number of specified columns. In addition, the column and the value list must be in the same order.Even though the column list is optional, you should always include it in the insert statement. It is a good programming practice.If you skip any column of a table in the column list, you must ensure that the omitted column has a default value or an error will occur.MariaDB uses the following value to insert into the column if you don’t specify the column in the column list:The next sequential integer if the column has auto_increment property.The NULL if the column is a nullable columnThe default value if the column explicitly specifies a default value.The generated value if the column is a generated column.To insert multiple rows into a table using a single statement, see the insert multiple rows tutorial.MariaDB insert statement examplesThe following statement creates a new table called contacts to store the contact information:create table contacts( id int auto_increment, first_name varchar(50) not null, last_name varchar(50) not null, full_name varchar(101) as (concat(first_name, ' ', last_name)) virtual, phone varchar(100), contact_group varchar(50) default 'General', primary key(id) ); Code language: SQL (Structured Query Language) (sql)In the contacts table:The id column is an auto_increment column, therefore, MariaDB will automatically insert the next sequential integer if you don’t explicitly specify a value in the insert statement.The full_name is a generated column whose value is derived from the first name and last name columns.The contact_group column has a default value as 'General'. If you don’t explicitly specify a value when you insert or update this column, MariaDB will use this default value.A) Simple MariaDB insert exampleThe following statement uses the insert statement to add a new row to the contacts table:insert into contacts(first_name, last_name, phone) values('John','Doe','(408)-934-2443'); Code language: SQL (Structured Query Language) (sql)MariaDB issued the following message:Affected rows: 1 Found rows: 0 Warnings: 0 Duration for 1 query: 0.000 sec. Code language: SQL (Structured Query Language) (sql)It means that one row has been inserted into the contacts table.This query selects data from the contacts table:select * from contacts; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="478" height="41" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-insert-example.png" alt="mariadb insert example" class="wp-image-295" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-insert-example.png 478w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-insert-example-300x26.png 300w" sizes="(max-width: 478px) 100vw, 478px" />B) Using MariaDB insert to add a row to a table and return the inserted id exampleThe following query uses the insert statement to add a new row to the contacts table:insert into contacts(first_name, last_name, phone, contact_group) values('Jane','Doe','(408)-456-8934','Leads'); Code language: SQL (Structured Query Language) (sql)To get the inserted id, you use the last_insert_id() function:select last_insert_id(); Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="97" height="38" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-insert-example-with-last_insert_id.png" alt="mariadb insert example with last_insert_id" class="wp-image-296"/>The following query returns rows from the contacts table:select * from contacts; Code language: SQL (Structured Query Language) (sql)<img decoding="async" class="alignnone size-full wp-image-297" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-insert-example-2.png" alt="mariadb insert example 2" width="469" height="58" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-insert-example-2.png 469w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-insert-example-2-300x37.png 300w" sizes="(max-width: 469px) 100vw, 469px" />C) Using MariaDB insert statement and the default keyword exampleIf you specify a column that has a default value in the column list and you want to use its default value when inserting a new row into the table, you can use the default keyword in the value list. See the following example:insert into contacts(first_name, last_name, phone, contact_group) values('Roberto','carlos','(408)-242-3845',default); Code language: SQL (Structured Query Language) (sql)In this example, we explicitly include the contact_group in the column list and use the default keyword to instructs MariaDB to use the column’s default value.MariaDB insert into set statementMariaDB provides an alternative syntax for inserting a new row into a table using the set clause:insert into table_name set column1 = value1, column2 = value2, ...; Code language: SQL (Structured Query Language) (sql)In this syntax, you don’t have to put the columns and values in order.Note that this syntax is specific to MariaDB and MySQL. Other database management systems may not support it.The following example uses the insert into set statement to add a new row to the contacts table:insert into contacts set first_name = 'Jonathan', last_name = 'Van'; Code language: SQL (Structured Query Language) (sql)In this tutorial, you have learned how to use the MariaDB insert statement to insert a new row into a table.Was this tutorial helpful ? Yes No Send Cancel'''
