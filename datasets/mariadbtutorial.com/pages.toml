["https://www.mariadbtutorial.com/mariadb-basics/mariadb-inner-join"]
title = "MariaDB Inner Join"
description = "In this tutorial, you will learn how to use the MariaDB inner join clause to query data from multiple tables."
full_description = 'MariaDB Inner JoinSummary: in this tutorial, you will learn how to use the MariaDB inner join clause to query data from multiple tables.Introduction to MariaDB inner join clauseThe inner join clause is a type of joins that allows you to query data from multiple tables.Suppose that you use the inner join clause to retrieve data from two tables t1 and t2; the following illustrates the syntax of the inner join:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }select select_list from t1 inner join t2 on join_condition; Code language: SQL (Structured Query Language) (sql)In this syntax, the inner join clause compares each row from the t1 table with every row from the t2 table. If a pair of rows causes the join_condition to evaluate to true, the inner join clause creates a new row whose columns are derived from rows in both tables and includes this row in the result set.The following diagram illustrates the inner join operation:Typically, you join tables by matching rows using the equality operator (=) and use primary key columns of the first table (t1) to match with foreign key columns of the second table (t2).select select_list from t1 inner join t2 on t1.column1 = t2.column1; Code language: SQL (Structured Query Language) (sql)If columns for equality matching have the same names, you can use the using syntax:select select_list from t1 inner join t2 using (column1); Code language: SQL (Structured Query Language) (sql)To join more three or more tables, you just need to add more inner join clauses as shown in the following query:select select_list from t1 inner join t2 on join_condition2 inner join t3 on join_condition2 ...; Code language: SQL (Structured Query Language) (sql)MariaDB inner join clause examplesLet’s take some examples of using the inner join clause.A) Using the MariaDB inner join to join two tables exampleThe following statement uses the inner join clause to retrieve data from the tables countries and regions:<img decoding="async" width="344" height="184" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/countries-regions.png" alt="countries regions" class="wp-image-233" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/countries-regions.png 344w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/countries-regions-300x160.png 300w" sizes="(max-width: 344px) 100vw, 344px" />select c.name country, r.name region from countries c inner join regions r on r.region_id = c.region_id order by c.name; Code language: SQL (Structured Query Language) (sql)In this example, the values in the region_id columns in both tables countries and regions are used for matching.Because the column names for matching have the same name, you can use the using syntax:select c.name country, r.name region from countries c inner join regions r using (region_id) order by c.name; Code language: SQL (Structured Query Language) (sql)B) Using the MariaDB inner join to join three tables exampleConsider the following three tables countries, regions, and continents from the sample database:<img decoding="async" width="544" height="184" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/countries-regions-continents.png" alt="countries regions continents" class="wp-image-277" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/countries-regions-continents.png 544w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/countries-regions-continents-300x101.png 300w" sizes="(max-width: 544px) 100vw, 544px" />The following example uses the inner join clauses to retrieve data from three tables countries, regions, and continents:select c.name country, r.name region, t.name continent from countries c inner join regions r using (region_id) inner join continents t using (continent_id) order by c.name; Code language: SQL (Structured Query Language) (sql)In this tutorial, you will learn how to use the MariaDB inner join clause to query data from multiple tables.Was this tutorial helpful ? Yes No Send Cancel'
