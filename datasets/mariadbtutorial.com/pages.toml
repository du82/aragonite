full_description = "MariaDB Aggregate FunctionsThis section introduces you to the most commonly used MariaDB aggregate functions including avg(), count(), max(), min(), and sum().Aggregate functionDescriptionavg()return the average of non-null numbersbit_and()return bitwise ANDbit_or()return bitwise OR.bit_xor()return bitwise XOR.count()return the number of rows in a tablegroup_concat()return a concatenated string from a group with various optionsmax()return the maximum value in a setmin()return the minimum value in a setstddev()return the population standard deviation.stddev_pop()return the population standard deviation.stddev_samp()return the sample standard deviation.sum()return the sum of valuesvar_pop()return the population standard variance.varp_sam()return the sample variance.variance()return the population standard variance."
