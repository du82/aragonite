["https://www.mariadbtutorial.com/mariadb-basics/mariadb-update"]
title = "MariaDB Update Statement By Practical Examples"
description = "In this tutorial, you will learn how to use the MariaDB update statement to modify data in a table."
full_description = '''MariaDB UpdateSummary: in this tutorial, you will learn how to use the MariaDB update statement to modify data in a table.Introduction to MariaDB update statementThe update statement allows you to modify data of one or more columns in a table. The following shows the syntax of the update statement:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }update table_name set column1 = value1, column2 = value2, ... [where search_condition]; Code language: SQL (Structured Query Language) (sql)In this syntax:First, specify the name of the table in which you want to update data after the update keyword.Second, specify one or more columns with new values in the set clauseThird, use an optional where clause to specify which rows you want to modify data. If you skip the where clause, the update statement will modify the data of all rows in the table.MariaDB update statement examplesWe’ll use the table contacts created in the previous tutorial for the demonstration:create table if not exists contacts( id int auto_increment, first_name varchar(50) not null, last_name varchar(50) not null, full_name varchar(101) as (concat(first_name, ' ', last_name)) virtual, phone varchar(100), contact_group varchar(50) default 'General', primary key(id) ); Code language: SQL (Structured Query Language) (sql)Here are the contents of the contacts table:select * from contacts; Code language: SQL (Structured Query Language) (sql)A) Using MariaDB update to modify a single row exampleThe following example uses the update statement to change the last name of the row with id 1 to 'Smith';update contacts set last_name = 'Smith' where id = 1; Code language: SQL (Structured Query Language) (sql)MariaDB issued the following message:Affected rows: 1 Found rows: 0 Warnings: 0 Duration for 1 query: 0.000 sec. Code language: SQL (Structured Query Language) (sql)The number of affected rows is 1. It means that one row has been updated successfully.To verify the update, you can use the following query:select * from contacts where id = 1; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="483" height="38" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-update-modify-one-row.png" alt="MariaDB update - modify one row" class="wp-image-368" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-update-modify-one-row.png 483w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-update-modify-one-row-300x24.png 300w" sizes="(max-width: 483px) 100vw, 483px" />B) Using MariaDB update to modify multiple rows exampleThe following example uses the update statement to modify the phone area code of contacts in the 'Customers' group from 408 to 510:update contacts set phone = replace(phone,'(408)','(510)') where contact_group = 'Customers'; Code language: SQL (Structured Query Language) (sql)In this example, the where clause returns all contacts whose groups are 'Customers'. The set clause uses the replace() function that replaces the string '(408)' in the phone column with the string '(510)'.To verify the update, you can query the contacts whose groups are 'Customers':select * from contacts where contact_group = 'Customers'; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="520" height="121" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-update-modify-multiple-rows-example.png" alt="MariaDB update - modify multiple rows example" class="wp-image-369" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-update-modify-multiple-rows-example.png 520w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-update-modify-multiple-rows-example-300x70.png 300w" sizes="(max-width: 520px) 100vw, 520px" />C) Using MariaDB update to modify all rows exampleThe following example uses the update statement to replace all the character '-' in the phone column with space:update contacts set phone = replace(phone,'-',' ') Code language: SQL (Structured Query Language) (sql)The update statement in this example does not use a where clause, therefore, it updates all rows of the contacts table.This query returns all rows from contacts table:select * from contacts; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="513" height="178" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-update-modify-all-rows-example.png" alt="MariaDB update - modify all rows example" class="wp-image-370" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-update-modify-all-rows-example.png 513w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-update-modify-all-rows-example-300x104.png 300w" sizes="(max-width: 513px) 100vw, 513px" />In this tutorial, you have learned how to use the MariaDB update statement to modify data of the existing rows in a table.Was this tutorial helpful ? Yes No Send Cancel'''
