["https://www.mariadbtutorial.com/mariadb-views"]
title = "An Essential Guide to MariaDB Views"
description = "In this tutorial, you will learn about MariaDB views and their advantages including simplicity, consistency, and security."
full_description = 'MariaDB ViewsSummary: in this tutorial, you will learn about the MariaDB views and their advantages including simplicity, consistency, and security.Introduction to MariaDB ViewsSee the following countries, regions, and continents tables from the sample database.The following statement uses inner join clauses to find the detailed country information including regions and continents:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }select c.name country, r.name region, t.name continent, area from countries c inner join regions r using (region_id) inner join continents t using (continent_id) order by country; Code language: SQL (Structured Query Language) (sql)To reuse this query, you may save it into a text file. Whenever you want to use the query, you can open the file, copy and paste the content of the query, and execute it.MariaDB provides a better way to save and share a query across application through a view.A view is a query that you can assign it a name. Sometimes, a view is known as a named query.MariaDB stores a view as an object in the data dictionary so that you can reference it like a table.Because you can use the name of a view as a table, a view is often referred to as a virtual table.A view is a virtual, not a real table because it does not store the data. When you use the select statement to query data from a view, MariaDB executes a query that defines the view to select data from the underlying tables.The underlying tables to which a view refers is called base tables.The following picture illustrates a view based on multiple tables:<img decoding="async" width="531" height="343" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-view.png" alt="mariadb view" class="wp-image-323" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-view.png 531w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-view-300x194.png 300w" sizes="(max-width: 531px) 100vw, 531px" />Creating a MariaDB viewTo create a view in MariaDB, you use the create view statement. For example, the following statement creates a view called country_details based on the query above:create view country_details as select c.name country, r.name region, t.name continent, area from countries c inner join regions r using (region_id) inner join continents t using (continent_id) order by country; Code language: SQL (Structured Query Language) (sql)Note that the new part is:create view country_details as Code language: SQL (Structured Query Language) (sql)Once the view is created, you can use it in the select statement as if it was a table. For example, you can view the contents of the base tables via the view as follows:select * from country_details; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="566" height="237" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-view-example.png" alt="mariadb view example" class="wp-image-362" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-view-example.png 566w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-view-example-300x126.png 300w" sizes="(max-width: 566px) 100vw, 566px" />The advantages of using MariaDB viewsMariaDB views provide the following advantages:SimplicityViews allow you to encapsulate complex queries with joins to simplify the table access. Instead of typing a long and complex query in multiple applications, you can create a view based on the query and use the view name in the applications.SecurityIn terms of security, you can grant a user account to access partial data of the base tables through a view. By doing this, you can hide the sensitive data from the users who do not have the privilege to view it.ConsistencyViews can be used to encapsulate business logic and formulas and make them consistent across applications.In this tutorial, you learned about the MariaDB view and its advantages including simplicity, consistency, and security.Managing MariaDB viewsCreate view – show you how to use the create view statement to create a new view in a database.Drop view – learn how to remove one or more views from a database.'
