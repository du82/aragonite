["https://www.mariadbtutorial.com/mariadb-basics/mariadb-group-by"]
title = "MariaDB Group By"
description = "In this tutorial, you will learn how to use the MariaDB group by clause to group data."
full_description = 'MariaDB Group BySummary: in this tutorial, you will learn how to use the MariaDB group by clause to group data.Introduction to MariaDB group by clauseThe group by clause groups rows of a result into groups. The following illustrates the syntax of the group by clause:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }select select_list from table_name group by column1, column2,...; Code language: SQL (Structured Query Language) (sql)The group by is often used with aggregate functions including count(), min(), max(), sum(), and avg() to find properties of groups such as the number of elements (count), the total of values (sum), the maximum element (max), the minimum element (min), and the average of elements (avg).The following shows the syntax of the group by clause used with an aggregate function:select column1, aggregate_function(column2) from table_name group by column1; Code language: SQL (Structured Query Language) (sql)In this syntax, the group by clause groups rows into groups and the aggregate function is applied to each group to return the summary row.MariaDB group by clause examplesWe’ll use the countries and regions tables from the nation sample database for the demonstration.A) Using the MariaDB group by clause with the count() function exampleThe following statement uses the group by clause with the count() function to get the number of countries in each region:select region_id, count(country_id) from countries group by region_id order by region_id; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="221" height="330" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Group-By-with-Count-example.png" alt="MariaDB Group By with Count example" class="wp-image-242" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Group-By-with-Count-example.png 221w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Group-By-with-Count-example-201x300.png 201w" sizes="(max-width: 221px) 100vw, 221px" />In this example:First, the group by clause divides the countries by regions.Then, the count() function is applied to each region to return the number of countries.To make the output more meaningful, you can join the countries table with the regions table:select regions.name, count(country_id) country_count from countries inner join regions using (region_id) group by regions.name order by regions.name; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="287" height="334" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Group-By-with-join-example.png" alt="MariaDB Group By with join example" class="wp-image-243" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Group-By-with-join-example.png 287w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Group-By-with-join-example-258x300.png 258w" sizes="(max-width: 287px) 100vw, 287px" />B) Using the MariaDB group by clause with the sum() functionThe following example uses the group by clause with the sum() function to calculate the total area of countries in each region:select regions.name region, sum(area) region_area from countries inner join regions using (region_id) group by regions.name order by region_area desc; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="286" height="332" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Group-By-with-sum-example.png" alt="MariaDB Group By with sum example" class="wp-image-244" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Group-By-with-sum-example.png 286w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Group-By-with-sum-example-258x300.png 258w" sizes="(max-width: 286px) 100vw, 286px" />C) Using the MariaDB group by clause with themin() and max() functionsThe following example uses the group by clause with the min() and max() functions to find the minimum and maximum areas of countries in each region:select regions.name region, min(area) smallest_country_area, max(area) largest_country_area from countries inner join regions using (region_id) group by regions.name order by regions.name; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="467" height="335" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Group-By-with-min-and-max-example.png" alt="MariaDB Group By with min and max example" class="wp-image-245" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Group-By-with-min-and-max-example.png 467w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Group-By-with-min-and-max-example-300x215.png 300w" sizes="(max-width: 467px) 100vw, 467px" />D) Using the MariaDB group by clause with the avg() functionThe following example uses the group by clause with the avg() function to calculate the average area of countries in each region:select regions.name region, avg(area) avg_area from countries inner join regions using (region_id) group by regions.name order by avg_area desc; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="305" height="332" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Group-By-with-avg-example.png" alt="MariaDB Group By with Avg function example" class="wp-image-246" title="MariaDB Group By with Avg function example" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Group-By-with-avg-example.png 305w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Group-By-with-avg-example-276x300.png 276w" sizes="(max-width: 305px) 100vw, 305px" />In this tutorial, you have learned how to use the MariaDB group by clause to group data.Was this tutorial helpful ? Yes No Send Cancel'
