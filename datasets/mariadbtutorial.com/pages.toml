["https://www.mariadbtutorial.com/mariadb-basics/mariadb-limit"]
title = "MariaDB Limit Offset Explained By Practical Examples"
description = "In this tutorial, you will learn how to use the MariaDB limit clause to specify the number of rows returned by a query."
full_description = 'MariaDB LimitSummary: in this tutorial, you will learn how to use the MariaDB limit clause to specify the number of rows returned by a query.Introduction to MariaDB limit clauseThe limit clause allows you to specify the number of rows returned by a select statement.Here is the syntax of the limit clause:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }select select_list from tale_name order by sort_expression limit n [offset m]; Code language: SQL (Structured Query Language) (sql)In this syntax:n is the number of rows to returnm is the number of rows to skip before returning the n rows.The select statement returns rows in an unspecified order, therefore, the limit clause without an order by clause will return a result of unspecified rows.It is a good practice to always use the limit clause with an order by clause to make returned rows predictable.MariaDB provides an alternative syntax of the limit clause as follows:LIMIT m, n; Code language: SQL (Structured Query Language) (sql)The syntax means skipping m rows and returning the next n rows.MariaDB limit clause examplesWe’ll use the countries table from the sample database to demonstrate the limit clause:<img decoding="async" width="144" height="184" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/countries.png" alt="" class="wp-image-144"/>A) Using the MariaDB limit clause examplesThe following statement returns all rows from the countries table sorted by the country name:select name from countries order by name; Code language: SQL (Structured Query Language) (sql)To select only the first 5 countries, you add the limit clause to the above query:select name from countries order by name limit 5; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="115" height="124" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Limit-first-5-countries.png" alt="MariaDB Limit - first 5 countries" class="wp-image-201"/>To skip the first 5 countries and select the next 10 countries, you use the offset clause:select name from countries order by name limit 10 offset 5; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="147" height="232" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Limit-limit-10-offset-5.png" alt="MariaDB Limit - limit 10 offset 5" class="wp-image-202"/>The following query uses the alternative limit syntax:select name from countries order by name limit 5, 10; Code language: SQL (Structured Query Language) (sql)B) Using MariaDB limit clause to get the top-N rows exampleThe limit clause is very handy to make the top-N report e.g., the top 10 largest countries:select name, area from countries order by area desc limit 10; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="244" height="230" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Limit-top-10-largest-countries.png" alt="MariaDB Limit - top 10 largest countries" class="wp-image-204"/>In this example:First, sort the countries by areas from large to small.Second, select only the first 10 countries.C) Using the MariaDB limit clause to select the nth row exampleYou can use the limit clause to get the nth row. For example, to get the 2nd largest country, you use the following statement:select name, area from countries order by area, name limit 1,1; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="195" height="37" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Limit-2nd-largest-country.png" alt="MariaDB Limit - 2nd largest country" class="wp-image-205"/>First, the query sorts countries by areas. Then, it skips the first row and picks the second one, which is the second largest country.Note that if two or more 2nd largest countries have the same area, the query can only return the first one.In this tutorial, you have learned how to use the MariaDB limit clause to specify the number of rows returned by a query.Was this tutorial helpful ? Yes No Send Cancel'
