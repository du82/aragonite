["https://www.mariadbtutorial.com/mariadb-basics/mariadb-left-join"]
title = "MariaDB Left Join"
description = "In this tutorial, you will learn how to use the MariaDB left join clause to query data from multiple tables."
full_description = 'MariaDB Left JoinSummary: in this tutorial, you will learn how to use the MariaDB left join clause to query data from multiple tables.Introduction to MariaDB left join clauseSuppose that you use the left join clause to retrieve data from two tables t1 and t2. Here is the syntax of the left join clause for joining two tables:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }select select_list from t1 left join t2 on join_condition; Code language: SQL (Structured Query Language) (sql)In this syntax, the left join starts selecting data from the left table t1. It compares each row from t1 with every row from t2.If both rows cause the join condition to evaluate to true, the left join combines columns of rows from both tables into a new row and includes this row in the result set.In case the rows are not matched, the left join still creates a new row whose columns are the combination of columns from both tables. However, it uses null values for the columns in the right table.The following diagram illustrates the left join operation:In general, you join tables by matching rows using the equality operator (=) and use the primary key columns of the left table (t1) to match with the foreign key columns of the right table (t2).select select_list from t1 left join t2 on t1.column1 = t2.column1; Code language: SQL (Structured Query Language) (sql)In case the columns for equality matching have the same names, you can use the using syntax:select select_list from t1 left join t2 using (column1); Code language: SQL (Structured Query Language) (sql)If you want to join three or more tables, you just need to add the left join clauses to the select statement:select select_list from t1 left join t2 on join_condition2 left join t3 on join_condition2 ...; Code language: SQL (Structured Query Language) (sql)MariaDB left join clause exampleConsider the following tables countries and country_stats from the sample database.<img decoding="async" width="354" height="184" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/countries-country_stats.png" alt="countries country_stats" class="wp-image-281" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/countries-country_stats.png 354w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/countries-country_stats-300x156.png 300w" sizes="(max-width: 354px) 100vw, 354px" />This example finds the countries and their GDP by joining the countries table with the country_stats table using the left join clause:select name, year, gdp from countries c left join country_stats s on s.country_id = c.country_id order by name; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="392" height="319" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-left-join-example.png" alt="MariaDB left join example" class="wp-image-285" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-left-join-example.png 392w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-left-join-example-300x244.png 300w" sizes="(max-width: 392px) 100vw, 392px" />Here is an equivalent query that uses the using syntax:select name, year, gdp from countries left join country_stats using (country_id) order by name; Code language: SQL (Structured Query Language) (sql)To find countries that do not have GDP information, you use the following query:select name, year, gdp from countries left join country_stats using (country_id) where gdp is null order by name; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="396" height="277" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-left-join-find-unmatching-rows.png" alt="MariaDB left join find unmatching rows" class="wp-image-286" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-left-join-find-unmatching-rows.png 396w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-left-join-find-unmatching-rows-300x210.png 300w" sizes="(max-width: 396px) 100vw, 396px" />In this tutorial, you will learn how to use the MariaDB left join clause to query data from multiple tables.Was this tutorial helpful ? Yes No Send Cancel'
