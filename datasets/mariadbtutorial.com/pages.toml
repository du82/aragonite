["https://www.mariadbtutorial.com/mariadb-basics/mariadb-distinct"]
title = "MariaDB Distinct"
description = "In this tutorial, you will learn how to use the MariaDB distinct to select distinct rows from a table."
full_description = 'MariaDB DistinctSummary: in this tutorial, you will learn how to use the MariaDB distinct to select distinct rows from a table.Introduction to the MariaDB distinct optionA select statement may return some identical rows. To explicitly specify that you want to remove duplicate rows from the result set, you use the distinct option:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }select distinct column_name from table_name; Code language: SQL (Structured Query Language) (sql)In this syntax, the distinct keyword appears after the select keyword and before columns or expressions of the select list.The query will return only distinct values from the column_name in the table_name.The distinct option can also be applied to multiple columns as shown in the following statement:select distinct column1, column2,... from table_name; Code language: SQL (Structured Query Language) (sql)In this case, the query will use the combinations of values in all the columns, which appear after the distinct option, to evaluate the distinction of rows.Note that if you want to select distinct values of some columns only, you use the group by clause.MariaDB distinct examplesWe’ll use the country_stats table from the nation sample database for demonstration:<img decoding="async" width="144" height="124" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/country_stats.png" alt="country_stats" class="wp-image-107"/>A) Using the MariaDB distinct with one columnThe values in the year column repeats for each country.select year from country_stats order by year; Code language: SQL (Structured Query Language) (sql)The following statement uses the distinct option to select the distinct years from the the year column:select distinct year from country_stats order by year desc; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="61" height="253" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Distinct-with-one-column.png" alt="" class="wp-image-225"/>MariaDB distinct with nullIn MariaDB, the distinct option treats null values the same. In other words, if you use the select distinct to query data from a column that has null values, the distinct option will keep only one null value.See the countries table from the sample database:<img decoding="async" width="144" height="184" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/countries.png" alt="" class="wp-image-144"/>The following statement uses the distinct option to select unique national days:select distinct national_day from countries; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="92" height="273" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Distinct-with-Nulls.png" alt="MariaDB Distinct with Nulls" class="wp-image-226"/>Even though, many rows have null values in the national_day column, the distinct option keeps only one value.In this tutorial, you will learn how to use the MariaDB distinct to select distinct rows from a table.Was this tutorial helpful ? Yes No Send Cancel'
