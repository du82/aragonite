["https://www.mariadbtutorial.com/mariadb-basics/mariadb-select"]
title = "MariaDB Select Statement"
description = "In this tutorial, you will learn how to use the MariaDB select statement to query data from a table."
full_description = 'MariaDB SelectSummary: in this tutorial, you will learn how to use the MariaDB select statement to query data from a table.Introduction to MariaDB select statementThe MariaDB select statement retrieves data from one or more tables. Here is the simplest syntax of the select statement:select select_list from table_name; In this syntax:First, specify a list of comma-separated columns or expressions from which you want to retrieve data. The columns must be available in the table_name.Then, specify the name of the table from which you want to query data.Even though the select clause appears before the from clause, when evaluating the select statement, MariaDB evaluates the from clause before the select clause:<img decoding="async" width="300" height="75" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-select-300x75.png" alt="mariadb select" class="wp-image-147" title="mariadb select" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-select-300x75.png 300w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-select.png 335w" sizes="(max-width: 300px) 100vw, 300px" />MariaDB select statement examplesWe’ll use the countries table from the nation sample database for the demonstration.<img decoding="async" width="144" height="184" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/countries.png" alt="" class="wp-image-144"/>A) Using MariaDB select statement to query data from one column exampleThe following statement uses the select statement to retrieve data from the name column in the countries table:select name from countries; In this example:First, specify the name column of the countries table in the select clause.Then, specify the countries table in the from clause.The select statement returns a set of result rows which is often called a result set.B) Using the MariaDB select statement to query data from multiple columns exampleThis statement uses the select statement to retrieve data from the name, area, and national_day columns of the countries table:select name, area, national_day from countries; <img decoding="async" width="442" height="378" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-select-multiple-columns-example.png" alt="mariadb select multiple columns example" class="wp-image-149" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-select-multiple-columns-example.png 442w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-select-multiple-columns-example-300x257.png 300w" sizes="(max-width: 442px) 100vw, 442px" />In this example, the column names are separated by commas in the select clause.C) Using the MariaDB select statement to query data from all columns of a table exampleTo select data from all columns of a table, you specify all the column names in the select clause:select country_id, name, area, national_day, country_code2, country_code3, region_id from countries; <img decoding="async" width="784" height="339" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-select-all-columns-example.png" alt="mariadb select all columns example" class="wp-image-148" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-select-all-columns-example.png 784w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-select-all-columns-example-300x130.png 300w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-select-all-columns-example-768x332.png 768w" sizes="(max-width: 784px) 100vw, 784px" />To make it more convenient, MariaDB provides the star (*) shorthand:select * from countries; In this example, the star ( *) is the shorthand for all columns of the countries table.The select * is called select star or select all.Note that it is a good practice to use the select * only for adhoc queries. If you embed the select statement in the application’s code, you should explicitly specify the names of columns from which you want to retrieve data.D) Using the MariaDB select statement with expression only exampleIn MariaDB, the from clause is optional. It is convenient if you want to call a function or evaluate an expression.The following select statement uses the now() function to return the current timestamp of the server:select now(); In this tutorial, you have learned how to the simple form of the MariaDB select statement to query data from a table.Was this tutorial helpful ? Yes No Send Cancel'
