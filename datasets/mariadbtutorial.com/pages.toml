["https://www.mariadbtutorial.com/mariadb-basics/mariadb-show-databases"]
title = "MariaDB Show Databases"
description = "In this tutorial, you will learn how to use the MariaDB show databases statement to list all databases from the server."
full_description = '''MariaDB Show DatabasesSummary: in this tutorial, you will learn how to use the MariaDB show databases statement to list all databases from the server.Introduction to MariaDB show databases statementThe show databases statement allows you to list the databases on a MariaDB server.The following illustrates the syntax of the show databases statement:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }show databases [like 'pattern' | where search_expression]; Code language: SQL (Structured Query Language) (sql)In this syntax, the like or where clause specifies a condition to search for the databases. They cannot be used at the same time.If you skip the like or where clause, the show databases statement lists all databases in the MariaDB server.Notice that the show databases statement only returns the databases that you have some kind of privilege unless you have the global show databases privilege.The show schemas is a synonym for show databases, therefore, you can use them interchangeably.MariaDB show databases statement examplesLet’s take some examples of using the show databases statement.A) MariaDB show databases exampleFirst, show all databases in the server:show databases; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="131" height="104" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-show-databases-example.png" alt="MariaDB show databases example" class="wp-image-572"/>Then, create a new database called testdb:create database testdb; Code language: SQL (Structured Query Language) (sql)Finally, use the show databases statement again:show databases; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="139" height="116" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-show-databases-example-2.png" alt="MariaDB show databases example" class="wp-image-573"/>B) MariaDB show databases statement with the like clause exampleThe following statement uses the like clause to find the database with the name nation:show databases like 'nation'; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="116" height="39" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-show-databases-like-example.png" alt="MariaDB show databases like example" class="wp-image-574"/>The following example uses the like clause to show all databases whose names end with the word schema:show databases like '%schema'; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="132" height="58" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-show-databases-with-like-clause-example.png" alt="MariaDB show databases with like clause example" class="wp-image-575"/>C) MariaDB show databases with the where clause exampleThe following example shows how to use the where clause to find user-created databases:show databases where `database` not in ('information_schema', 'mysql', 'performance_schema'); Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="71" height="58" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-show-databases-where-clause.png" alt="MariaDB show databases where clause" class="wp-image-576"/>It is important to put the `database` under the backquotes ( `), because it is a keyword in MariaDB; or you will get an error.In this tutorial, you learned how to use the MariaDB show databases statement to list all databases from the server.Was this tutorial helpful ? Yes No Send Cancel'''
