["https://www.mariadbtutorial.com/getting-started/mariadb-sample-database"]
title = "MariaDB Sample Database"
description = "In this tutorial, you will learn about a MariaDB sample database nation and how to load the sample database into the MariaDB server."
full_description = 'MariaDB Sample DatabaseSummary: in this tutorial, you will learn about a MariaDB sample database nation and how to load the sample database into the MariaDB server.Introduction to the MariaDB sample databaseThe nation database has six tables that store basic information on countries, regions, languages, and statistics.The following picture illustrates the nation sample database:The countries tableThe countries table stores basic information on countries including the country name, the area in km2, independent year, 2-digit and 3-digit country codes, and region.<img decoding="async" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/countries.png" alt="countries" class="wp-image-106"/>.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }create table countries ( country_id int auto_increment, name varchar(50) not null, area decimal(10,2) not null, national_day date, country_code2 char(2) not null unique, country_code3 char(3) not null unique, region_id int not null, foreign key(region_id) references regions(region_id), primary key(country_id) );Code language: SQL (Structured Query Language) (sql)The country_stats tableThe country_stats table stores country’s statistics by year such as population and GDP.<img decoding="async" width="144" height="124" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/country_stats.png" alt="country_stats" class="wp-image-107"/>create table country_stats( country_id int, year int, population int, gdp decimal(15,0), primary key (country_id, year), foreign key(country_id) references countries(country_id) ); Code language: SQL (Structured Query Language) (sql)The country_languages tableEach country may have one or more languages. The country_languages table stores the relationships between countries and languages tables.<img decoding="async" width="144" height="104" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/country_languages.png" alt="" class="wp-image-108"/>create table country_languages( country_id int, language_id int, official boolean not null, primary key (country_id, language_id), foreign key(country_id) references countries(country_id), foreign key(language_id) references languages(language_id) );Code language: SQL (Structured Query Language) (sql)The languages tableThe languagestable stores the names of languages.<img decoding="async" width="144" height="84" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/languages.png" alt="languages" class="wp-image-109"/>create table languages( language_id int auto_increment, language varchar(50) not null, primary key (language_id) );Code language: SQL (Structured Query Language) (sql)The continents tableThe contients table store information on the continents.<img decoding="async" width="144" height="84" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/continents.png" alt="continents" class="wp-image-110"/>create table continents( continent_id int auto_increment, name varchar(255) not null, primary key(continent_id) );Code language: SQL (Structured Query Language) (sql)The regions tableThe regions table stores information on regions. A region belongs to one continent. And one continent may have multiple regions.<img decoding="async" width="144" height="104" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/regions.png" alt="" class="wp-image-111"/>create table regions( region_id int auto_increment, name varchar(100) not null, continent_id INT NOT NULL, primary key(region_id), foreign key(continent_id) references continents(continent_id) );Code language: SQL (Structured Query Language) (sql)In addition to the tables related to nations, the sample database has two additional tables vips and guests. These simple tables are for demonstration in various tutorials such as joins, union, intersect, and except.The vips table:create table vips( vip_id int primary key, name varchar(100) not null );Code language: SQL (Structured Query Language) (sql)The guests table:create table guests( guest_id int primary key, name varchar(100) not null );Code language: SQL (Structured Query Language) (sql)Load the MariaDB sample databaseTo load the MariaDB sample database, you follow these steps:First, download the sample database file:Download MariaDB Sample DatabaseNext, unzip the file to a directory e.g., c:\mariadb\nation.sqlAfter that, connect to the MariaDB server with the root user account, type the password and press the Enter keyboard.mysql -u root -p Enter password: ********Then, load the database by using the source command:mysql>source c:\mariadb\nation.sqlCode language: SQL (Structured Query Language) (sql)Finally, select the nation database and display tables of the database:mysql> use nation; Database changed mysql> show tables; +-------------------+ | Tables_in_nation | +-------------------+ | continents | | countries | | country_languages | | country_stats | | guests | | languages | | region_areas | | regions | | vips | +-------------------+ 9 rows in set (0.00 sec)Code language: SQL (Structured Query Language) (sql)In this tutorial, you have learned about a MariaDB sample database nation and how to load the sample database into the MariaDB server.Was this tutorial helpful ? Yes No Send Cancel'
