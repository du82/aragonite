["https://www.mariadbtutorial.com/mariadb-basics/mariadb-like"]
title = "MariaDB Like"
description = "In this tutorial, you will learn how to use the MariaDB like operator to search for strings that match a specific pattern."
full_description = '''MariaDB LikeSummary: in this tutorial, you will learn how to use the MariaDB like operator to search for strings that match a specific pattern.Introduction to MariaDB like operatorThe MariaDB like operator is a logical operator that returns true if a string matches a specific pattern.A pattern includes regular characters and special characters. The special characters are called wildcards.MariaDB supports two wildcards: percent (%) and underscore (_):The percent wildcard (%) matches any string of zero or more characters.The underscore (_) wildcard matches any single character.The following illustrates the syntax of the like operator:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }expression like pattern Code language: SQL (Structured Query Language) (sql)The like operator is used in the where clause of the select, update, and delete statements to form a predicate for filtering rows based on a pattern.MariaDB like operator examplesWe’ll use the countries table from the sample database to demonstrate the like operator.<img decoding="async" width="144" height="184" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/countries.png" alt="" class="wp-image-144"/>A) Using the MariaDB like operator with the percentage (%) wildcard examplesThis statement uses the percentage (%) wildcard to find countries whose names start with the letter 'D':select name from countries where name like 'd%' order by name; Code language: SQL (Structured Query Language) (sql)The following example finds countries whose names end with the string 'tan':select name from countries where name like '%tan' order by name; Code language: SQL (Structured Query Language) (sql)The following statement finds countries whose names contain the string 'state':select name from countries where name like '%state%' order by name; Code language: SQL (Structured Query Language) (sql)B) Using the MariaDB like operator with the _ wildcard examplesThe following example finds countries whose names start with any character, followed by the n character, and ends with any number of characters:select name from countries where name like '_n%' order by name; Code language: SQL (Structured Query Language) (sql)The escape clauseSometimes, the data that you want to match may contain the wildcard characters such as 10% or 10_12.MariaDB uses the backslash character (\) as the default escape character.The following statement returns 1 because V_2019 matches the pattern '%\_20%'. The \ is the escape character that instructs the like operator to treat the underscore _ as a regular character.select 'V_2019' like '%\_20%'; Code language: SQL (Structured Query Language) (sql)To change the default escape character, you use the escape clause:expression like pattern escape escape_characters Code language: SQL (Structured Query Language) (sql)The following statement uses the escape clause to change the default character to #:select 'V_2019' like '%#_20%' escape '#'; Code language: SQL (Structured Query Language) (sql)In this tutorial, you have learned how to use the MariaDB like operator to check if a value matches a specific pattern.Was this tutorial helpful ? Yes No Send Cancel'''
