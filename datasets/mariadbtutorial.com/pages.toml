["https://www.mariadbtutorial.com/mariadb-basics/mariadb-where"]
title = "MariaDB Where"
description = "In this tutorial, you will learn how to use the MariaDB where clause to filter rows returned by a query."
full_description = '''MariaDB WhereSummary: in this tutorial, you will learn how to use the MariaDB where clause to filter rows returned by a query.Introduction to MariaDB where clauseThe where clause is an optional clause of the select statement, which specifies a search condition for selecting rows.Here is the syntax of a select statement with a where clause:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }select select_list from table_name where search_condition order by sort_expression; Code language: SQL (Structured Query Language) (sql)In this syntax, you specify a search condition to select rows from a table.If a row causes the search_condition to evaluate to true, the where clause includes the row in the result set.The search condition may consist of one or multiple logical expressions. A logic expression always evaluates to one of three values true, false, or unknown. The logical expressions in the where clause is also known as predicates.In the select statement, the where clause appears after the from clause and before the order by clause.MariaDB evaluates the clauses in the select statement that consists of select, from, where, and order by clauses in the following sequence: from, where, select, order by:In addition to the select statement, you can use the where clause in the update or delete statement to specify rows to update or delete.MariaDB where clause examplesAll the following examples will use the countries table from the sample database:A) Using the MariaDB where clause with the equal (=) operatorThe following example uses the where clause to select countries that have the region id 2:select name, area, region_id from countries where region_id = 2 order by name; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="312" height="315" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-where-with-equal-operator.png" alt="mariadb where with equal operator" class="wp-image-168" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-where-with-equal-operator.png 312w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-where-with-equal-operator-150x150.png 150w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-where-with-equal-operator-297x300.png 297w" sizes="(max-width: 312px) 100vw, 312px" />B) Using the MariaDB where clause with comparison operatorsThe following statement uses the where clause to find countries whose areas are greater than 2,000,000 km2:select name, area from countries where area > 2000000 order by area; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="367" height="337" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-where-with-greater-than-operator.png" alt="mariadb where with greater than operator" class="wp-image-169" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-where-with-greater-than-operator.png 367w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-where-with-greater-than-operator-300x275.png 300w" sizes="(max-width: 367px) 100vw, 367px" />C) Using the MariaDB where clause with the and operatorThe and operator combines boolean expressions and only returns true if both expressions return true.The following example uses the where clause with the and operator to find countries that are in region id 1 and have areas greater than 2,000,000 km2:select name, area, region_id from countries where region_id = 2 and area > 2000000 order by name; Code language: SQL (Structured Query Language) (sql)<img decoding="async" class="alignnone size-full wp-image-170" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-where-with-and-operator.png" alt="mariadb where with and operator" width="294" height="64">C) Using the MariaDB where clause with the or operatorLike the and operator, the or operator is used to combine logical expressions. However, the or operator returns true if at least one of the expressions returns true.The following statement uses the or operator in the where clause to find countries that locate in region 2 or have areas greater than 2,000,000 km2:select name, area, region_id from countries where region_id = 2 or area > 2000000 order by name; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="213" height="270" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-where-with-or-operator.png" alt="mariadb where with or operator" class="wp-image-171"/>D) Using the MariaDB where clause to find rows whose values are between two valuesThe between operator returns true if a value is between two values:expression between low and high Code language: SQL (Structured Query Language) (sql)It is a shortcut of:expression >= low and expression <= high Code language: SQL (Structured Query Language) (sql)For example, this statement uses the between operator in the where clause to find countries that have areas between 1,001,449 and 1,566,500 km2:select name, area from countries where area between 1001449 and 1566500 order by area; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="211" height="274" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-where-with-betwen-operator.png" alt="mariadb where with betwen operator" class="wp-image-172"/>E) Using the MariaDB where clause to find rows whose values are in a listTo check if a value is in a list of value, you use the in operator:expression in (value1, value2,...) Code language: SQL (Structured Query Language) (sql)The in operator returns true if the expression evaluates to one of the value list value1, value2, …The following statement uses the in operator in the where clause to find countries whose country codes are in the US, FR and JP country codes:select name, country_code2 from countries where country_code2 in ('US','FR','JP') order by name; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="233" height="86" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-where-with-IN-operator.png" alt="mariadb where with IN operator" class="wp-image-175"/>F) Using the MariaDB where clause to find rows based on a patternThe like operator returns true if a value matches a specific patternexpression LIKE pattern; Code language: SQL (Structured Query Language) (sql)To construct a pattern, you use two wildcards:% matches one or more characters_ matches one characterThe following example uses the like operator in the where clause to find countries whose names start with the letter J:select name from countries where name like 'J%' order by name; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="74" height="83" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/mariadb-where-with-like-operator.png" alt="mariadb where with like operator" class="wp-image-174"/>In this tutorial, you will have learned how to use the MariaDB where clause to specify a search condition for selecting rows.Was this tutorial helpful ? Yes No Send Cancel'''
