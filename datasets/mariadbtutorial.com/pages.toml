["https://www.mariadbtutorial.com/mariadb-basics/mariadb-drop-table"]
title = "MariaDB Drop Table"
description = "In this tutorial, you will learn how to use the MariaDB drop table statement to remove a table from a database."
full_description = "MariaDB Drop TableSummary: in this tutorial, you will learn how to use the MariaDB drop table statement to remove a table from a database.Introduction to MariaDB drop table statementThe drop table statement removes a table from a database. The following shows the syntax of the drop table statement:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }drop table [if exists] table_name; Code language: SQL (Structured Query Language) (sql)In this syntax, you specify the name of the table that you want to remove after the drop table keywords.The if exists option conditionally drops the table only if it exists.To execute the drop table statement successfully, you need to have the drop privilege for the table that you want to drop.To drop multiple tables at once, you use the following syntax:drop table [if exists] table1, table2, ...; Code language: SQL (Structured Query Language) (sql)In this syntax, you specify a comma-list of tables that you want to remove after the drop table keywords.It is important to note that when you drop a table, MariaDB will retain all user privileges on the removed table. In case you create a new table with the same name as the table that you dropped, all the privileges on the dropped table will apply to the new table. It could be a potential security risk that you should be aware of.MariaDB drop table statement exampleLet’s take some examples of using the drop table statement.A) Using MariaDB drop table to drop one tableFirst, create a new table called cities for the testing purpose:create table cities( id int primary key, city_name varchar(100) not null, area decimal(15,2) ); Code language: SQL (Structured Query Language) (sql)Second, drop the cities table using the drop table statement:drop table cities; Code language: SQL (Structured Query Language) (sql)B) Using MariaDB drop table to drop multiple tablesFirst, create two tables called mountains and oceans:create table mountains( id int primary key, mountain_name varchar(100) not null, height decimal(15,2) ); create table oceans( id int primary key, ocean_name varchar(100) not null, square decimal(15,2) ) Code language: SQL (Structured Query Language) (sql)Second, use the drop table statement to remove both mountains and oceans at once:drop table mountains, oceans; Code language: SQL (Structured Query Language) (sql)In this tutorial, you learned how to use the MariaDB drop table statement to remove one or more tables from a database.Was this tutorial helpful ? Yes No Send Cancel"
