["https://www.mariadbtutorial.com"]
title = "MariaDB Tutorial"
description = "The MariaDB tutorial website provides you with practical knowledge and skills to master MariaDB quickly."
full_description = 'MariaDB TutorialMariaDB is an open-source relational database management system (RDBMS), a highly compatible drop-in replacement of MySQL.MariaDB was developed as a software fork of MySQL in 2009 in response to Oracle’s acquisition of MySQL. MariaDB intends to remain free, open-source software under the GNU General Public License.The MariaDB tutorial website provides you with practical knowledge and skills to master MariaDB quickly. To get the best out of the tutorials, you should be familiar with RDBMS concepts. However, it is not required.What you’ll learnInteract with MariaDB including selecting, inserting, updating, and deleting data.Utilize views to simplify the query and improve the security.Leverage triggers to automate some database tasks.Use indexes to improve the query performance.Use stored procedures and functions to wrap the business logic in the database layer.<img decoding="async" src="https://www.mariadbtutorial.com/wp-content/uploads/2021/05/getting-started-with-mariadb.svg" width ="90" height="90" alt="Getting Started with MariaDB"> Getting Started with MariaDBThis section helps you get started with MariaDB by providing you with the easy-to-follow steps of installing and connecting to the MariaDB server.<img decoding="async" src="https://www.mariadbtutorial.com/wp-content/uploads/2021/05/mariadb-basics.svg" width ="90" height="90" alt="MariaDB Basics"> MariaDB BasicsThis MariaDB basics section helps you learn how to query data from tables, manage databases and tables.<img decoding="async" src="https://www.mariadbtutorial.com/wp-content/uploads/2021/05/mariadb-views.svg" width ="90" height="90" alt="MariaDB Views"> MariaDB ViewsIn this tutorial, you will learn about MariaDB views and their advantages including simplicity, consistency, and security.<img decoding="async" src="https://www.mariadbtutorial.com/wp-content/uploads/2021/05/mariadb-triggers.svg" width ="90" height="90" alt="MariaDB Triggers"> MariaDB TriggersIn this tutorial, you will learn about MariaDB triggers and the main differences between triggers and stored procedures.<img decoding="async" src="https://www.mariadbtutorial.com/wp-content/uploads/2021/05/mariadb-indexes.svg" width ="90" height="90" alt="MariaDB Indexes"> MariaDB IndexesThis section teaches you about MariaDB indexes including creating new indexes, removing existing indexes, and listing all indexes in the database.<img decoding="async" src="https://www.mariadbtutorial.com/wp-content/uploads/2021/05/mariadb-aggregate-functions.svg" width ="90" height="90" alt="MariaDB Aggregate Functions"> MariaDB Aggregate FunctionsThis section introduces you to the most commonly used MariaDB aggregate functions including avg(), count(), max(), min(), and sum().'
year_published = 2025
year_updated = 2024
