["https://www.mariadbtutorial.com/mariadb-basics/mariadb-not-null"]
title = "MariaDB Not Null Constraint"
description = "In this tutorial, you will learn how to use a not null constraint for a column to ensure values stored in the column are not null."
full_description = '''MariaDB Not NullSummary: in this tutorial, you will learn how to use a not null constraint for a column to ensure values stored in the column are not null.Introduction to the MariaDB not null constraintThe not null is a domain integrity constraint that ensures values stored in a column are not null.Here is the syntax of defining a not null constraint:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }column_name datatype not null; Code language: SQL (Structured Query Language) (sql)If you insert or update null to a column that has a not null constraint, MariaDB rejects the change and issues an error.The following statement creates a table called courses:create table courses( course_id int auto_increment, course_name varchar(100) not null, summary varchar(255), primary key(course_id) ); Code language: SQL (Structured Query Language) (sql)The course_id is the primary key of the courses table, therefore, it doesn’t accept null values because it has an implicit not null constraint.The course_name has the not null constraint so it also doesn’t accept null values.This statement attempts to insert a null value into the course_name column:insert into courses(course_name) values(null); Code language: SQL (Structured Query Language) (sql)MariaDB issued the following error:SQL Error (1048): Column 'course_name' cannot be null Code language: SQL (Structured Query Language) (sql)Adding a not null constraint to an existing columnTo add a not null constraint to an existing column, you follow these steps:First, update null values to a non-null value if available.Second, modify the column to include a not null constraint.For example, to add a not null constraint to the summary column of the courses table, you use these steps:First, update null values in the summary column to non-null values:update courses set summary = 'N/A' where summary is null; Code language: SQL (Structured Query Language) (sql)Second, modify the summary column to include a not null constraint:alter table courses modify summary varchar(255) not null; Code language: SQL (Structured Query Language) (sql)Removing a not null constraintTo remove a not null constraint from a column, you use the alter table modify statement:alter table table_name modify column_name datatype; Code language: SQL (Structured Query Language) (sql)For example, the following statement removes the not null constraint from the summary column of the courses table:alter table courses modify summary varchar(255); Code language: SQL (Structured Query Language) (sql)To verify whether the not null constraint has been removed, you can use the describe statement:describe courses; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="472" height="84" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Not-Null-Constraint-Example.png" alt="MariaDB Not Null Constraint Example" class="wp-image-516" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Not-Null-Constraint-Example.png 472w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Not-Null-Constraint-Example-300x53.png 300w" sizes="(max-width: 472px) 100vw, 472px" />or use show create table statement:show create table courses; Code language: SQL (Structured Query Language) (sql)In this tutorial, you have learned how to use the not null constraint for a column to ensure values stored in the column are not null.Was this tutorial helpful ? Yes No Send Cancel'''
