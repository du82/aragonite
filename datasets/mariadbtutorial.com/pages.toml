["https://www.mariadbtutorial.com/mariadb-basics/mariadb-having"]
title = "MariaDB Having"
description = "In this tutorial, you will learn how to use the MariaDB having clause to specify a search condition for groups."
full_description = 'MariaDB HavingSummary: in this tutorial, you will learn how to use the MariaDB having clause to specify a search condition for groups.Introduction to MariaDB having clauseThe where clause allows you to specify a search condition for filtering rows returned by the select statement. However, it cannot be used for filtering summarized rows created by the group by clause.To specify a search condition for filtering summarized rows generated by the group by clause, you use the having clause.The following illustrates the syntax of the having clause:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }select select_list from table_name group by column1, column2, ... having search_condition; Code language: SQL (Structured Query Language) (sql)The having clause appears immediately after the group by clause. To form the having clause, you specify a search_condition that may consist of one or more Boolean expressions. The select statement will return only groups (or rows) which cause the search_condition to evaluate to true.MariaDB having clause examplesWe’ll use the countries and regions tables from the nation sample database:A) Using the MariaDB having clause to filter group exampleThe following example uses the having clause to find regions that have more than 10 countries:select regions.name region, count(country_id) country_count from countries inner join regions using (region_id) group by (regions.name) having count(region_id) > 10 order by country_count desc; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="280" height="192" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Having-example.png" alt="MariaDB Having example" class="wp-image-239"/>B) Using the MariaDB having clause with a complex condition exampleThe following example uses the having clause to find countries that have more than 10 countries and total areas greater than 1,000,000 km2:select regions.name region, count(country_id) country_count, sum(area) area from countries inner join regions using (region_id) group by (regions.name) having count(region_id) > 10 and area > 1000000 order by area desc, country_count desc; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="392" height="166" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Having-complex-condition-example.png" alt="MariaDB Having - complex condition example" class="wp-image-240" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Having-complex-condition-example.png 392w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Having-complex-condition-example-300x127.png 300w" sizes="(max-width: 392px) 100vw, 392px" />In this tutorial, you have learned how to use the MariaDB having clause to specify a search condition for groups.Was this tutorial helpful ? Yes No Send Cancel'
