["https://www.mariadbtutorial.com/mariadb-aggregate-functions/mariadb-sum"]
title = "MariaDB sum() Function"
description = "In this tutorial, you will learn how to use the MariaDB sum() function to calculate the sum of values."
full_description = 'MariaDB sum() FunctionSummary: in this tutorial, you will learn how to use the MariaDB sum() function to calculate the sum of values.Introduction to MariaDB sum() functionThe MariaDB sum() is an aggregate function that returns the sum of numbers.Here is the syntax of the sum() function:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }sum(all | distinct expression) Code language: SQL (Structured Query Language) (sql)The sum() function takes a set of numbers and returns a total of them.The distinct option instructs the sum() function to ignore duplicates and calculates the total of distinct values while the all option enables the sum() function to calculate the total of values including duplicates. By default, the sum() function uses the all option.If the set of input numbers is empty or all values in the set are null, the sum() function returns null.Similar to the avg() function, the sum() function ignores null values.MariaDB sum() function illustrationFirst, create a new table called sum_demos:create table sum_demos(c int); Code language: SQL (Structured Query Language) (sql)Second, insert some rows into the sum_demos table:insert into sum_demos(c) values(10),(20),(30),(30),(NULL); Code language: SQL (Structured Query Language) (sql)Third, query data from the sum_demos table:select c from sum_demos; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="69" height="118" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-sum-function-demo-table.png" alt="MariaDB sum function demo table" class="wp-image-641"/>Fourth, use the sum() function to return the sum of values, including duplicates, in the c column of the sum_demos table:select sum(c) from sum_demos; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="58" height="40" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-sum-function-demo.png" alt="MariaDB sum function demo" class="wp-image-642"/>In this example, the sum() function calculates the total of all values including the duplicates because it uses the all option by default.Finally, use the distinct option in the sum() function to calculate the sum of distinct values.select sum(distinct c) from sum_demos; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="93" height="39" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-sum-distinct-demo.png" alt="MariaDB sum distinct demo" class="wp-image-643"/>In this example, the sum() ignores one duplicate value (30) in its calculation because of the distinct option.MariaDB sum() function examplesWe’ll use the table countries and regions for the demonstration.<img decoding="async" width="344" height="184" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/countries-regions.png" alt="countries regions" class="wp-image-233" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/countries-regions.png 344w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/countries-regions-300x160.png 300w" sizes="(max-width: 344px) 100vw, 344px" />A) Using MariaDB sum() function to calculate the sum of valuesThis example uses the sum() function to calculate the total areas of all countries in the countries table:select sum(area) from countries; Code language: SQL (Structured Query Language) (sql)<img decoding="async" class="alignnone size-full wp-image-645" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-sum-function-total-area.png" alt="MariaDB sum function - total area" width="101" height="41">B) Using MariaDB sum() function with the group by clause exampleThe sum() function is often used in conjunction with the group by clause to calculate the total for each group.For example, the following statement returns the total area for each region:select region_id, sum(area) region_area from countries group by region_id order by region_id; Code language: SQL (Structured Query Language) (sql)In this example:First, the group by clause divides the countries by regions.Then, the sum() function calculates the total areas for each region.To make the output more meaningful, you can join the countries table with the regions table:select regions.name region, sum(area) region_area from countries inner join regions using (region_id) group by regions.name order by region; Code language: SQL (Structured Query Language) (sql)<img decoding="async" class="alignnone size-full wp-image-646" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-sum-function-with-group-by-and-join-clauses.png" alt="MariaDB sum function with group by and join clauses" width="257" height="297">C) Using MariaDB sum() function with the having clauseThe following statement uses the sum() function in the having clause to find regions whose total areas are greater than 10,000,000 km2:select regions.name regions, sum(area) region_area from countries inner join regions using (region_id) group by regions.name having sum(area) > 10000000 order by region_area; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="256" height="136" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-sum-function-with-group-by-and-having-clauses.png" alt="MariaDB sum function with group by and having clauses" class="wp-image-647"/>In this tutorial, you learned how to use the MariaDB sum() function to calculate the sum of values.Was this tutorial helpful ? Yes No Send Cancel'
