["https://www.mariadbtutorial.com/mariadb-basics/mariadb-except"]
title = "MariaDB Except Operator By Practical Examples"
description = "In this tutorial, you will learn how to use the MariaDB except operator to return the difference between two or more result sets."
full_description = 'MariaDB ExceptSummary: in this tutorial, you will learn how to use the MariaDB except operator to return the difference between two or more result sets.Introduction to MariaDB except operatorThe except operator compares result sets of two (or more) select statements and returns the distinct rows from the first select statement which are not output by the second select statement.Simply put, the except operator subtracts the result set of a query from another.The following illustrates the syntax of the except operator:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }select-statement except select-statement; Code language: SQL (Structured Query Language) (sql)In this syntax:First, specify at least two or more select statements that you want to compare their result sets.Second, use the except operator to connect two select statements.The columns of the select statements must meet the following rules:The number and order of columns must be the same in the select statements.The data types of the corresponding columns must be the same.The following picture illustrates the except operation of the two result sets T1 (1,2,3) and T2 (2,3,4):MariaDB except operator exampleWe’ll use the guests and vips tables from the sample database for the demonstration:<img decoding="async" width="129" height="122" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-guests-table-data.png" alt="MariaDB guests table data" class="wp-image-395"/><img decoding="async" width="138" height="121" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-vips-table-data.png" alt="" class="wp-image-396"/>The following example uses the except operator to find names of the guests that are not in the vips table:select name from guests except select name from vips order by name; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="60" height="77" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-except-example.png" alt="MariaDB except example" class="wp-image-399"/>In this tutorial, you learned how to use the MariaDB except operator to return the difference between two or more result sets.Was this tutorial helpful ? Yes No Send Cancel'
