["https://www.mariadbtutorial.com/mariadb-window-functions"]
title = "MariaDB Window Functions"
description = "This page provides you with the MariaDB windows functions."
full_description = "MariaDB Window FunctionsThis page provides you with the MariaDB windows functions.NameDescriptioncume_dist()return the cumulative distribution of a value in a set.dense_rank()assign a rank to every row within its partition. Rows with the same values receive the same rank. The function returns no gaps in the sequence of ranked values.first_value()returns the value of the specified expression with respect to the first row in the window frame.lag()return the value from the Nth row before the current row in a partition.last_value()return the value of the specified expression with respect to the last row in the window frame.lead()return the value from the nth row after the current row in a partition.nth_value()return the value of the nth row in the partition.ntile()divide rows into a specified number of ranked groups.percent_rank()return the percentile rank of every row in the partition.rank()assign a rank to every row within its partition. The function creates gaps if two or more rows receive the same rank.row_number()assign a sequential integer to each row in its partition"
