["https://www.mariadbtutorial.com/mariadb-basics/mariadb-cte"]
title = "MariaDB CTE"
description = "In this tutorial, you will learn how to use a MariaDB common table expression or CTE to form a query."
full_description = "MariaDB CTESummary: in this tutorial, you will learn how to use a MariaDB common table expression or CTE to form a query.Introduction to MariaDB common table expression or CTEA common table expression or CTE allows you to create a temporary result set within a query.A CTE is like a derived table in that it is not stored as a database object and exists only during the execution of a query.Unlike a derived table, you can reference a CTE within a query multiple times. In addition, you can reference a CTE within itself. This CTE is known as a recursive CTE.A CTE can be used toReference a result set multiple times in the same statement.Substitute a view to avoiding creating a view.Create a recursive query.Simplify a complex query by breaking it into multiple simple and logical building blocks.The following illustrates the syntax of common table expression:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }with cte_name as ( cte_body ) cte_usage; Code language: SQL (Structured Query Language) (sql)In this syntax:First, specify the name of the CTE between the with and as keywords.Second, form the body of the CTE within the parentheses, which can be a select statement.Third, specify a statement that uses the CTE.Note that SQL standard introduced CTE in 1999 and MariaDB implemented it since version 10.2.2MariaDB CTE examplesWe’ll use the tables countries and country_stats from the sample database for the demonstration.The following example uses a common table expression to return the top 10 largest economies in 2018:with largest_economies as ( select country_id, gdp from country_stats where year = 2018 order by gdp desc limit 10 ) select name, gdp from countries inner join largest_economies using (country_id); Code language: SQL (Structured Query Language) (sql)In this example:The name of the CTE is largest_economies. The CTE body has a query that selects the top 10 countries that has the biggest GDP in 2018.The outer query joins the countries table with the CTE to get the country names.The above CTE is similar to the following query that uses a derived table:select name, gdp from ( select country_id, gdp from country_stats where year = 2018 order by gdp desc limit 10 ) t inner join countries using (country_id); Code language: SQL (Structured Query Language) (sql)In this tutorial, you learned how to use a MariaDB common table expression or CTE to form a query.Was this tutorial helpful ? Yes No Send Cancel"
