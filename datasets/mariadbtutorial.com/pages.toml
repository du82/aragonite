["https://www.mariadbtutorial.com/mariadb-aggregate-functions/mariadb-avg"]
title = "MariaDB avg() Function Explained By Practical Examples"
description = "In this tutorial, you will learn how to use the MariaDB avg() function to calculate the average value of a set."
full_description = 'MariaDB avg() FunctionSummary: in this tutorial, you will learn how to use the MariaDB avg() function to calculate the average value of a set.An overview of MariaDB avg() functionThe MariaDB avg() is an aggregate function that accepts a set of numbers and returns the average.The following illustrates the syntax of the avg() function:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }avg(expression) Code language: SQL (Structured Query Language) (sql)The avg() function returns null if the set is empty. It ignores null values in the input arguments.MariaDB avg() illustrationFirst, create a new table called avg_demos:create table avg_demos( c int ); Code language: SQL (Structured Query Language) (sql)Second, insert some rows into the avg_demos table:insert into avg_demos(c) values(10),(20),(30),(null); Code language: SQL (Structured Query Language) (sql)Third, view the data of the avg_demos table:select c from avg_demos; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="68" height="102" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-avg-sample-table.png" alt="MariaDB avg sample table" class="wp-image-607"/>Finally, calculate the average values in the c column of the avg_demos table using the avg() function:SELECT avg(c) FROM avg_demos; Code language: SQL (Structured Query Language) (sql)Here is the output:<img decoding="async" width="76" height="40" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-avg-function-result.png" alt="MariaDB avg function result" class="wp-image-606"/>In this example, the avg() function calculates the average as follows:First, ignore the null values.Then, divide the sum of all values by the number of values (10+20+30) / 3 = 20.MariaDB avg() examplesWe’ll use the table countries and regions from the sample database.A) Using MariaDB avg() function to calculate the average of valuesThe following example uses the avg() function to calculate the average area of all countries:select avg(areas) avg_area from countries; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="109" height="40" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-avg-average-of-values.png" alt="MariaDB avg - average of values" class="wp-image-604"/>To make the result more readable, you use the cast expression as follows:select cast(avg(area) as dec(10,0)) avg_area from countries; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="73" height="39" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-avg-average-with-cast.png" alt="MariaDB avg - average with cast" class="wp-image-608"/>The cast truncates all numbers after the decimal point.B) Using MariaDB avg() function with the group by clause exampleThe avg() function is often used in conjunction with the group by clause to find the average value for each group.The following example calculates the average country area of each region:select region_id, cast(avg(area) as dec(10,2)) avg_country_area from countries group by region_id order by region_id; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="206" height="248" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-avg-function-group-by.png" alt="MariaDB avg function - group by" class="wp-image-609"/>In this example:First, the group by clause group countries by region idSecond, the avg() function calculates the average area for each group (or region)To get the region names, you can join the countries table with the regions table:select regions.name as region, cast(avg(area) as dec(10,2)) avg_country_area from countries inner join regions using (region_id) group by regions.name order by region; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="275" height="263" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-avg-function-group-by-with-join.png" alt="MariaDB avg function - group by with join" class="wp-image-610"/>C) Using MariaDB avg() function with the having clause exampleThe following example uses the avg() function with the group by and having clauses to find regions whose the average country areas are between 200,000 and 1,000,000 km2:select regions.name as region, cast(avg(area) as dec(10,2)) avg_country_area from countries inner join regions using (region_id) group by regions.name having avg(area) between 200000 and 1000000 order by region; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="279" height="178" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-avg-function-with-having-clause-example.png" alt="MariaDB avg function with having clause example" class="wp-image-611"/>D) Using MariaDB avg() function with other aggregate functionsThe following example finds all regions whose the number of countries is greater than 10 and the average country area is greater than 100,000:select regions.name as region, count(*) country_count, cast(avg(area) as dec(10,2)) avg_country_area from countries inner join regions using (region_id) group by regions.name having count(*) > 10 and avg(area) > 100000 order by avg_country_area; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="376" height="141" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-avg-function-with-count-function-example.png" alt="MariaDB avg function with count function example" class="wp-image-612" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-avg-function-with-count-function-example.png 376w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-avg-function-with-count-function-example-300x113.png 300w" sizes="(max-width: 376px) 100vw, 376px" />In this tutorial, you learned how to use the MariaDB avg() function to calculate the average value of a set.Was this tutorial helpful ? Yes No Send Cancel'
