["https://www.mariadbtutorial.com/mariadb-basics/mariadb-union"]
title = "MariaDB Union - Combining Result Sets Into a Single Result Set"
description = "In this tutorial, you will learn how to use the MariaDB union operator to combine result sets of two or more queries to a single result set."
full_description = '''MariaDB UnionSummary: in this tutorial, you will learn how to use the MariaDB union operator to combine result sets of two or more queries to a single result set.Introduction to MariaDB union operatorThe union operator combines the result sets of two or more select statements into a single result set.The following illustrates the syntax of the union operator:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }select-statement1 union [all | distinct] select-statement2 union [all | distinct] ... Code language: SQL (Structured Query Language) (sql)[order by sort_expression][limit row_count, offset]In this syntax:First, specify at least two select statements that you want to combine their result sets.Second, use the union operator to connect two select statements.The select lists of the select statements must have the same number of columns. In addition, the corresponding columns of the first select statement must have the same data type as the columns of the second select statement.The union operator uses the column names of the first select statement as the column names of the final result set.all vs. distinctWhen evaluating the above query, MariaDB evaluates each select statement individually and combines rows of each result set.The distinct option instructs the union operator to remove duplicate rows from the final result set while the all option retains the duplicates.The following pictures illustrate the union and union all of two result sets:<img decoding="async" width="592" height="172" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Union-All.png" alt="MariaDB Union All" class="wp-image-406" title="MariaDB Union All" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Union-All.png 592w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Union-All-300x87.png 300w" sizes="(max-width: 592px) 100vw, 592px" />The distinct or all option is optional. By default, the union operator uses the all option if you don’t explicitly specify either all or distinct.union and order byThe select-statements may have order by clauses. However, these order by clauses do not affect the order of rows in the final result set.The query that contains union operators can have a global order by clause that appears at the end of the statement. This order by clause will determine the order of rows in the final result set.MariaDB union examplesWe’ll use the guests and vips tables from the sample database for the demonstration.A) Simple MariaDB union exampleThe following statement uses the union operator to combine result sets of the guests and vips table:select vip_id id name, 'vip' as type from vips union select guest_id name, 'guest' from guests; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="166" height="221" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Union-example.png" alt="MariaDB Union example" class="wp-image-388"/>In addition to the identity and name columns of the vips and guests tables, we also add the type column that specifies the type of contacts.B) MariaDB union distinct exampleThe following example uses the union operator to return distinct names from the vips and guests tables:select name from guests union select name from vips order by name; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="88" height="182" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Union-distinct-example.png" alt="MariaDB Union distinct example" class="wp-image-389"/>The query above is equivalent to the following one that uses the distinct option explicitly:select name from guests union distinct select name from vips order by name; Code language: SQL (Structured Query Language) (sql)C) MariaDB union all exampleThis example uses the union all to returns all names from the vips and guests tables, including duplicates:select name from guests union all select name from vips order by name; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="84" height="220" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-Union-all-example.png" alt="MariaDB Union all example" class="wp-image-390"/>union vs. joinA join combines columns of two or more tables while a union combine rows of the result sets of two or more select statements.Simply put, a join appends result sets horizontally while a union appends result sets vertically.In this tutorial, you learned how to use the MariaDB union and union all operators to combine result sets of two or more select statements into a single result set.Was this tutorial helpful ? Yes No Send Cancel'''
