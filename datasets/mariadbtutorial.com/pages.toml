["https://www.mariadbtutorial.com/mariadb-aggregate-functions/mariadb-count"]
title = "MariaDB count() Aggregate Function By Practical Examples"
description = "In this tutorial, you will learn how to use the MariaDB count() function to return the number of rows in a table."
full_description = 'MariaDB count() FunctionSummary: in this tutorial, you will learn how to use the MariaDB count() function to return the number of rows in a table.An overview of the MariaDB count() functionThe MariaDB count() is an aggregate function that returns the number of rows in a table.Here is the syntax of the count() function:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }count( all | distinct expression) Code language: SQL (Structured Query Language) (sql)The count() function accepts a set of rows and returns the number of rows in the set.The count(expression) is the same as count(all expression) that returns the number of non-null values including duplicates.The count(distinct expression) returns the number of unique non-null values.The count(*) returns the number of values including nulls.MariaDB count() function illustrationFirst, create a new table called count_demos:create table count_demos( c int ); Code language: SQL (Structured Query Language) (sql)Second, insert some rows into the count_demos table:insert into count_demos(c) values(1),(2),(3),(null),(3); Code language: SQL (Structured Query Language) (sql)Third, query data from the count_demos table:select c from count_demos; Code language: SQL (Structured Query Language) (sql)Fourth, the following statement uses the count(*) function to return the number of rows in the count_demos table:select count(*) row_count from count_demos; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="77" height="41" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-count-function-count-star-demo.png" alt="MariaDB count function count star demo" class="wp-image-631"/>Fifth, this example uses the count(distinct expression) to return the number of non-null rows in the count_demos table:select count(c) row_count from count_demos; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="79" height="42" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-count-function-count-expr-demo.png" alt="MariaDB count function count expr demo" class="wp-image-630"/>Sixth, this statement uses the count(distinct expression) to return the number of unique and non-null rows from the count_demos table:select count(distinct c) row_count from count_demos; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="78" height="41" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-count-function-count-distinct-demo.png" alt="" class="wp-image-629"/>MariaDB count() function examplesWe’ll use the table countries and regions from the sample database for the demonstration.<img decoding="async" width="344" height="184" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/countries-regions.png" alt="countries regions" class="wp-image-233" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/countries-regions.png 344w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/countries-regions-300x160.png 300w" sizes="(max-width: 344px) 100vw, 344px" />A) Using MariaDB count(*) function to return the number of rows in a tableThis example uses the count(*) function to get the number of rows in the countries table:select count(*) country_count from countries; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="97" height="41" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-count-function-count-countries.png" alt="MariaDB count function count countries" class="wp-image-628"/>To get the number of countries that have national day recorded, you use a where clause:select count(*) country_count from countries where national_day is not null; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="97" height="38" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-count-function-count-with-where.png" alt="" class="wp-image-635"/>B) Using the MariaDB count() function with a group by clauseThe count() function is often used with a group by clause to find the number of values for each group.For example, the following statement uses the count(expression) to find the number of countries in each region:select region_id, count(country_id) country_count from countries group by region_id order by region_id; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="190" height="262" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-count-function-count-with-group-by.png" alt="" class="wp-image-633"/>In this example:First, the group by clause divides countries by region id into groups.Second, the count() function returns the number of countries in each group.To get the region names and the number of countries in each region, you add a join clause to the above query:select regions.name region, count(country_id) country_count from countries inner join regions using (region_id) group by regions.name order by region; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="256" height="259" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-count-function-count-with-group-by-and-join.png" alt="" class="wp-image-632"/>B) Using the MariaDB count() function with a having clauseThe following statement uses the count() function in the having clause to find regions that have more than 10 countries:select regions.name region, count(country_id) country_count from countries inner join regions using (region_id) group by regions.name having count(country_id) > 10 order by country_count; Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="255" height="181" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-count-function-count-with-having.png" alt="MariaDB count function count with having" class="wp-image-634"/>In this tutorial, you learned how to use the MariaDB count() function to find the number of rows in a table.Was this tutorial helpful ? Yes No Send Cancel'
