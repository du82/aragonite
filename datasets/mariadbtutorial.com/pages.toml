["https://www.mariadbtutorial.com/mariadb-basics/mariadb-subqueries"]
title = "MariaDB Subqueries"
description = "In this tutorial, you will learn about the MariaDB subqueries to form more complex queries."
full_description = 'MariaDB SubqueriesSummary: in this tutorial, you will learn about the MariaDB subqueries to form more complex queries.What is a subqueryA subquery is a query nested in another query.See the following countries table from the sample database:<img decoding="async" width="144" height="184" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/countries.png" alt="" class="wp-image-144"/>Suppose that you want to find countries whose areas are bigger than 5,000,000 km2. To achieve this, you may come up with these steps:First, find identifications of countries whose areas are greater than 5,000,000:.wp-block-code { border: 0; padding: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } .wp-block-code > span { display: block; overflow: auto; } .shcb-language { border: 0; clip: rect(1px, 1px, 1px, 1px); -webkit-clip-path: inset(50%); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; word-wrap: normal; word-break: normal; } .hljs { box-sizing: border-box; } .hljs.shcb-code-table { display: table; width: 100%; } .hljs.shcb-code-table > .shcb-loc { color: inherit; display: table-row; width: 100%; } .hljs.shcb-code-table .shcb-loc > span { display: table-cell; } .wp-block-code code.hljs:not(.shcb-wrap-lines) { white-space: pre; } .wp-block-code code.hljs.shcb-wrap-lines { white-space: pre-wrap; } .hljs.shcb-line-numbers { border-spacing: 0; counter-reset: line; } .hljs.shcb-line-numbers > .shcb-loc { counter-increment: line; } .hljs.shcb-line-numbers .shcb-loc > span { padding-left: 0.75em; } .hljs.shcb-line-numbers .shcb-loc::before { border-right: 1px solid #ddd; content: counter(line); display: table-cell; padding: 0 0.75em; text-align: right; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; white-space: nowrap; width: 1%; }select country_id from countries where area > 5000000;Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="94" height="157" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-subqueries-find-country-id.png" alt="MariaDB subqueries - find country id" class="wp-image-595"/>Then, use these ids in the following query to get the countries’ information:select name, area from countries where country_id in (12,15,31,38,42,182,224) order by area, name;Code language: SQL (Structured Query Language) (sql)<img decoding="async" width="228" height="161" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-subqueries-find-countries.png" alt="MariaDB subqueries - find countries" class="wp-image-597"/>This approach has some issues:First, if the country’s areas are updated, you need to update your second query.Second, you need to execute two queries to the database server and manually update the ids in the second query to get the result.Subqueries can help resolve these issues. Instead of executing two queries at different time, you nest the first query in the second query as follows:select name, area from countries where country_id in ( select country_id from countries where area > 5000000 ) order by area, name;Code language: SQL (Structured Query Language) (sql)The following query is called a subquery:select country_id from countries where area > 5000000Code language: SQL (Structured Query Language) (sql)And the query that includes the subquery is known as the outer query.<img decoding="async" width="410" height="325" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-subqueries.png" alt="MariaDB subqueries" class="wp-image-598" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-subqueries.png 410w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/MariaDB-subqueries-300x238.png 300w" sizes="(max-width: 410px) 100vw, 410px" />This tutorial focuses on the three types of subqueries: scalar subqueries, row subqueries, and the subqueries that appears in the from clause of a select statementScalar queriesA scalar subquery returns a single value. A scalar subquery can be used in an SQL statement where a literal or single column value is used.The following query returns the largest area of all countries:select max(area) from countries; Code language: SQL (Structured Query Language) (sql)Since the query returns a single value, you can use it as a subquery to find the country that has the largest area:select * from countries where area = ( select max(area) from countries ); Code language: SQL (Structured Query Language) (sql)Row subqueriesA row subquery returns a single row.See the following countries and country_stats tables:<img decoding="async" width="354" height="184" src="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/countries-country_stats.png" alt="countries country_stats" class="wp-image-281" srcset="https://www.mariadbtutorial.com/wp-content/uploads/2019/10/countries-country_stats.png 354w, https://www.mariadbtutorial.com/wp-content/uploads/2019/10/countries-country_stats-300x156.png 300w" sizes="(max-width: 354px) 100vw, 354px" />The following statement returns the average population and GDP of all countries in 2018:select avg(population), avg(gdp) from country_stats where year = 2018; Code language: SQL (Structured Query Language) (sql)This query returns a row that consists of two columns. You can use this query as a subquery to find countries whose population and GDP are greater than the average population and GDP of all countries in 2018:select name from country_stats inner join countries using (country_id) where year = 2018 and (population, gdp) > ( select avg(population), avg(gdp) from country_stats where year = 2018) order by name; Code language: SQL (Structured Query Language) (sql)Subqueries in the from clauseTypically, you place a table in the from clause of a select statement.Since a query also returns a result set which is the same as a virtual table, you can place a subquery in the from clause.select select_list from (subquery) as table_alias ...; Code language: SQL (Structured Query Language) (sql)A subquery that appears in the from clause is commonly called a derived table. A derived table must have an alias or you will get a syntax error.For example, the following statement returns the average area of all regions:select avg(region_area) from ( select sum(area) region_area from countries group by region_id ) t; Code language: SQL (Structured Query Language) (sql)In this example:First, the subquery returns the total area for each region.Then, the outer query calculates the average area of all regions.In this tutorial, you learned about the MariaDB subquery to form more complex queries.Was this tutorial helpful ? Yes No Send Cancel'
