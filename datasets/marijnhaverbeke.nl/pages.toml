title = "A Gentle Introduction to Machine Fundamentals"
full_description = '''A Gentle Introduction to Machine Fundamentals Topic: Machine language programming, computer graphics Author: Marijn Haverbeke Date: January 18th 2011 This article is an elaboration of part of Eloquent JavaScript's introduction. Like that website, this page has an interactive coding environment to help you get a feel for the subject. The text aims to be readable even for people with little to no existing knowledge of the subject, and to work towards its conclusion without detours. As such, some of the less interesting complexities of real machines are glossed over. Why Computers Are Interesting A clockwork represents just activity, going round and round without story or direction. A book is just information, passive and only meaningful when interpreted by an external observer. A computer is an artifact of a different kind, which unites activity and information. Its actions are driven by the information it retains, and this information is written by its own action. An elementary computer has two parts, a memory (information) and a processor (action). Memory is the easiest of the two to describe. A memory chip contains a number of words, each capable of retaining a number. Each word has an address. The processor is connected to the memory with a bus, a connection through which it can tell the memory chip to retrieve the number at a given address, or to store a new value at some specific address. Memory words each hold a fixed number of bits. See Wikipedia if you wonder what bits are and how they relate to numbers. Memory words in contemporary computers are typically 64 or 32 bits in size. The processor's behaviour is somewhat more complicated. It goes through a cyclic pattern where, at the start of each cycle, it fetches an instruction from memory, which will determine what it does next. To know from which address it should fetch its instruction, it keeps an internal counter, called the program counter, which refers to a memory address. The fetched instruction is executed, and then the program counter is updated to refer to the next instruction. Thus, a program is executed one instruction at a time, from top to bottom. If memory simply contains numbers, how can instructions, which can be executed, be held in it? Any information can be encoded as a number. A typical instruction, such as "copy the content of memory location 1 to memory location 2", could be encoded by having a number to identify the "copy from memory to memory" operation, say 30, followed by the numbers 1 and 2 which provide the actual memory locations. The processor is wired to understand these instruction codes, and can to take the right action for each of them. Some cleverness is usually applied to not make an instruction take up three separate memory words by packing it together in the minimum amount of required words. The set of instruction codes that a processor understands is its instruction set. There are various types of processors in use, each with its own instruction set. A useful computer can be built even on a very small instruction set. Typical instructions deal with processing numbers—moving them around, as in the example we saw, or performing arithmetic operations on them. An instruction could say, for example, "add 10 to the word in memory location 2". A program that goes linearly through a sequence of instructions could be useful for simple data processing, but for real programs you need an additional ingredient: control flow. It must be possible for the program to influence the program counter based on the current situation. Branching instructions can be used to express something like "if memory location 2 contains the number 0, set the program counter to 51". Memory location 51 and up should then contain the program that will be executed when memory location 2 contains 0. The Mechanical Turtle Having a memory unit and a processor with a small instruction set immediately makes all kinds of wondrous programs possible. The best way of really seeing this is not by reading dry theory, but by writing actual programs. First, we'll need a machine to practice with. In the early 1980s, my uncle Bert was working for a firm that had gotten an odd order from the US military. They wanted 5000 small, programmable, mechanical turtles. Each turtle was to be equipped with a tiny ball-point pen. What they were to be used for was never specified. When Reagan was elected, the project was quickly scrapped ("not lethal enough"). The turtles were put in storage, and most of them ended up being swiped by employees. My uncle left a box of them at my place—I'll lend you one to experiment with. First Program Turtles use a very simple processor, which understands 22 different instructions. Take a look at this simple (and useless) program: inc [4] 1 cmp [4] 10 ifless 0 end value 0 The program repeatedly adds 1 to the value at memory location 4 (which starts out holding 0). Once this value reaches 10, it stops skipping back to instruction 0, and hits the end instruction, causing execution to halt. This program is expressed using short mnemonic words, not binary codes. A notation like this is typically called assembly language, and a computer program, the assembler, is used to convert such a program into actual machine instructions. Let us quickly go over the program. The first line takes care of adding 1 to the counter at memory location 4. An assembly language typically provides some notation to distinguish memory references, raw numbers, and other elements. In this case, brackets around a number mean that it is a memory reference, whereas a plain number indicates the number itself. So you could say inc [4] [5] to add the content of memory location 5 to location 4. Doing inc 1 [4] is illegal—the result of the addition has to be stored somewhere, so the first operand must be a memory location. There are instructions dec, mult, div, and mod, which work similar to inc, except that they, respectively, subtract, multiply, divide, and take the modulo (remainder of division) of their operands. The next line, cmp [4] 10 compares the value in memory location 4 with the number 10, and saves the result internally in the processor. A cmp is typically followed by instruction like ifless, which looks at this saved value in order to determine whether to jump to another instruction or not. If ifless finds that for the last compare operation, the left hand operand was less than the right hand one, it will update the program counter with its operand. (There are also ifeq, ifneq, and ifnless.) If not, the processor simply continues with the next instruction. The value 0, used as operand to ifless, will cause the program to jump all the way back to the first instruction. And the next instruction is end, which indicates that the program is finished and the processor can stop executing it. Under the end instruction there is a line value 0. This is not an instruction, but simply a way to cause a number to be stored at that memory location. This is the fifth command in the program, so in a zero-based addressing scheme, it will set the value of memory location 4. Basically, this line initialises the counter. Note that this assumes each instruction takes a single memory word. This is the case in this machine, but, for practical reasons, very few real machines work like this. Memory locations in the turtle machine can hold either an instruction or a number. Trying to execute a number will cause the machine to halt. Numbers can be either integers or floating point (fractional) numbers. The same instructions operate on both. This is also something that's rare in real machines, which usually have different instructions for dealing with non-integer numbers. Using the Turtle Unless you saw a warning at the top of this page, there is a widget peeking out at the right edge of your screen. This is the Turtle Control Panel, used to edit and run programs. You can click it to make it pop out (and click outside of it to hide it again). Every example has a triangle to the left of it that will load the program into the panel. This panel works like this: you enter (or load) a program into the text box on the left. Then, when you click the round button on the bottom, this program is converted to a memory image for the turtle, meaning it is distilled down to a sequence of instructions and numbers. This image in then loaded into a turtle, which starts running it. The button can be pressed again to stop a program, which might be useful when a program goes out of control and enters an infinite loop. The area on the left displays the picture the turtle drew. The tabs to the side of the picture allow you to also inspect any log output produced, or inspect the memory of the turtle as it looked at the end of the run. The bottom tab, Help briefly describes all instructions and syntactic conventions that can be used in your programs. Output The instructions we discussed so far allow the turtle to do all kinds of things, but none of these are externally observable. That makes the machine rather pointless. To get it to do something interesting, we need output instructions. Regular computers usually have monitors for output, as well as a variety of other devices—printers, drives, sound devices, and so on. There are typically special instructions that send data to output hardware. Some machines model output hardware as special memory, so that, for example, you can change what is shown on the screen by writing new colour data to the right address. Our turtle just has a few simple instructions to make it draw things. There is line, which makes it move forward a distance specified by the instruction's operand (or backward, for a negative operand), drawing a line. The turn instruction causes it to turn a given amount of degrees—positive values turn right, negative values left. We could draw a triangle like this: line 50 turn 120 line 50 turn 120 line 50 end The move instruction works like line, but only causes the turtle to move, without drawing. This draws a line with a gap in it: line 30 move 10 line 30 end Finally, to help track down problems in programs, there is a log instruction, which takes a single operand and logs that operand's current value to the output tab of the control panel. Labelling Having to count memory addresses as we are writing a program is very, very awkward. If we wanted to extend the program we started with to log its counter each time it incremented it, we'd add an extra instruction. This instruction takes up a memory position, which causes the counter value to be bumped to memory location 5. We now have to update all occurrences of [4] with [5]. In a bigger program, this becomes utterly unworkable. Since we already have a program converting the assembly language text to the actual memory image, we might as well let that program do the counting for us. Almost every assembler (which is what such a program is typically called) provides a way to label locations in your program, and then refer to these labels instead of to the raw addresses. We could write our count-and-log program like this: start: inc [counter] 1 log [counter] # (counter) cmp [counter] 10 ifless start end counter: value 0 A word followed by a colon indicates a label. These do not appear in the generated image, they are only used during assembly. Wherever a number can occur, you may use a label name to refer to the memory location marked with that label. If the label start occurs in a program, its address, rather than 0, is used as the start value of the program counter. Thus, we could have moved the counter value to the top of the program (above the start label) without causing anything to break. In fact, this counter declaration now looks a lot like a variable declaration in a regular programming language. And that is really all that global variables are in languages like C are: labelled memory locations. The part after the # character in the log line is a comment. Anything between a # and the end of a line is ignored by the assembler. This can be used to add remarks to a program. A comment after a log instruction is treated specially—it is saved and written out together with the logged value. Programmed Drawing If we combine our loop program with some output instructions, we can start drawing interesting things. This program draws a star with 24 points by repeatedly drawing lines, moving back to its start position, and turning 15 degrees. count: value 24 start: line 60 move -60 turn 15 dec [count] 1 cmp [count] 0 ifneq start end Try playing with this program. For example, see what happens when you change the first 60 to 70. The great thing about generating graphics with a computer is that often, doing something strange or making a mistake will make the resulting picture more interesting. Here is another neat one: size: value 0 start: line [size] turn 89.5 inc [size] 2 cmp [size] 300 ifless start end You can tweak the turn angle or the size increase to vary the shape. Do you see why it produces a shape like this? Abstraction If you've ever programmed before, you will know that a non-trivial program requires the programmer to organise the program into procedures (functions) that isolate certain piece of functionality, and that can be invoked from other pieces of program without knowing much about their internals. How would we do this in raw machine code? We want to draw a series of triangles, each a bit smaller than the previous one. So we will have a loop to go over the triangles. Inside this loop, we could put the raw triangle-drawing code, but that's exactly what we want to avoid—we want to delegate the drawing to another piece of code. A very primitive attempt could look like this: triangle_size: value 100 triangle: line [triangle_size] turn 120 line [triangle_size] turn 120 line [triangle_size] turn 120 goto afterdraw start: goto triangle afterdraw: turn -15 move 20 dec [triangle_size] 5 cmp [triangle_size] 0 ifneq start end The triangle 'procedure' handles the drawing of the triangle, and then skips back to the loop. The goto instruction is a control flow instruction like the if... instructions, but it always makes the jump, rather than only when a condition holds true. This procedure can not be used by any other piece of program though. It uses the global triangle_size to determine the size of the triangle and, more disturbingly, it always jumps back to to the afterdraw label in this particular loop. If we wanted to use it in more than one way, it has to be able to return to the code that invokes it, rather than to a fixed address. One way to do this would be to have the invoking code give it a return address in a memory location reserved for this purpose. triangle_size: value 0 triangle_return: value 0 triangle: line [triangle_size] turn 120 line [triangle_size] turn 120 line [triangle_size] turn 120 goto [triangle_return] size: value 100 start: set [triangle_size] [size] set [triangle_return] afterdraw goto triangle af'''
