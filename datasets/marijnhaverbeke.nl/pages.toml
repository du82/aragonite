["https://marijnhaverbeke.nl/postmodern"]
title = "Postmodern"
full_description = '''Postmodern Table of Contents Reference Dependencies License Download and installation Quickstart Connections Single Long Life Connections With No Multi-threading or Executable Creation Multiple Connections, Multi-threading or Executable Creation Pooling Connections Basic Queries DAO Classes Define-Dao-Class Macro (New to version 1.33.12) Table Creation With SQL or S-SQL With a Previously Created DAO Inserting Data Authentication Data Types Data Types Passing Parameters as Text or Binary Caveats and to-dos Timezones and Simple-Date and Local-Time Simple-Date Library Use Local-Time Library Use Portability Reserved Words Things that should be implemented Resources Running tests Version 1.33.12 Postmodern is a Common Lisp library for interacting with PostgreSQL databases. Features are: Efficient communication with the database server without need for foreign libraries. Support for UTF-8 on Unicode-aware Lisp implementations A syntax for mixing SQL and Lisp code Convenient support for prepared statements and stored procedures A metaclass for simple database-access objects The biggest differences between this library and clsql or cl-dbi are that Postmodern has no intention of being portable across different SQL implementations (it embraces non-standard PostgreSQL features), and approaches extensions like lispy SQL and database access objects in a quite different way. This library was written because the CLSQL approach did not really work for me. Your mileage may vary. Reference The reference manuals for the different components of Postmodern are kept in separate files. For using the library in the most straightforward way, you only really need to read the Postmodern reference and glance over the S-SQL reference. The simple-date reference explains the time-related data types included in Postmodern, and the CL-postgres reference might be useful if you just want a low-level library for talking to a PostgreSQL server. Postmodern S-SQL Simple-date CL-postgres Some specific topics in more detail S-SQL Examples Array-Notes Creating Tables Database Access Object (Dao) Classes Dynamic Queries Interval Notes Isolation Notes Dependencies The library depends on usocket (except on SBCL and ACL, where the built-in socket library is used), md5, closer-mop, bordeaux-threads if you want thread-safe connection pools, and CL+SSL when SSL connections are needed. As of version 1.3 it also depends on ironclad, base64 and uax-15 because of the need to support scram-sha-256 authentication. Postmodern itself is split into four different packages, some of which can be used independently: Simple-date is a very basic implementation of date and time objects, used to support storing and retrieving time-related SQL types. It is not loaded by default and you can use local-time instead. CL-postgres is the low-level library used for interfacing with a PostgreSQL server over a socket. S-SQL is used to compile s-expressions to strings of SQL code, escaping any Lisp values inside, and doing as much as possible of the work at compile time. Finally, Postmodern itself is a wrapper around these packages and provides higher level functions, a very simple data access object that can be mapped directly to database tables and some convient utilities. It then tries to put all these things together into a convenient programming interface.itself is the library that tries to put all these things together into a convenient programming interface. License Postmodern is released under a zlib-style license. Which approximately means you can use the code in whatever way you like, except for passing it off as your own or releasing a modified version without indication that it is not the original. The functions execute-file.lisp were ported from pgloader with grateful thanks to Dimitri Fontaine and are released under a BSD-3 license. Download and installation We suggest using quicklisp.org for installation. A git repository with the most recent changes can be viewed or checked out at: > git clone https://github.com/marijnh/Postmodern Quickstart This quickstart is intended to give you a feel of the way coding with Postmodern works. Further details about the workings of the library can be found in the reference manuals linked below. Assuming you have already installed quicklisp, load postmodern. (ql:quickload :postmodern) (use-package :postmodern) Connections Single Long Life Connections With No Multi-threading or Executable Creation If you have a PostgreSQL server running on localhost, with a database called 'testdb' on it, which is accessible for user 'foucault' with password 'surveiller', there are two basic ways to connect to a database. If your role/application/database(s) looks like a 1:1 relationship and you are not using threads and you are not going to create an executable, you can connect like this: (connect-toplevel "testdb" "foucault" "surveiller" "localhost") This will establish a connection to be used by all code, except for that wrapped in a with-connection form, which takes the same arguments but only establishes the connection within that lexical scope. This method is often used in development or debugging. Connect-toplevel will maintain a single connection for the life of your running lisp instance. If the server is not on localhost, replace that string with a string containing the ip address of the server: (connect-toplevel "testdb" "foucault" "surveiller" "216.27.61.135") If the Postgresql server is running on a port other than 5432, you would also pass the appropriate keyword port parameter. E.g.: (connect-toplevel "testdb" "foucault" "surveiller" "localhost" :port 5434) Ssl connections would similarly use the keyword parameter :use-ssl and pass :no, :try, :require, :yes, or :full :try means if the server supports it :require means use provided ssl certificate with no verification :yes means verify that the server cert is issued by a trusted CA, but does not verify the server hostname :full means expect a CA-signed cert for the supplied hostname and verify the server hostname When using ssl, you can set the cl-postgres exported variables *ssl-certificate-file*, *ssl-key-file* and *ssl-root-ca-file* to provide client key, certificate files and root ca files. They can be either NIL, for no file, or a pathname. Multiple Connections, Multi-threading or Executable Creation If you have multiple roles connecting to one or more databases, i.e. 1:many or many:1, (in other words, changing connections) or you are using threads (each thread must have its own connection) or you are going to create an executable, then you can use the with-connection form which establishes a connection with a lexical scope is more appropriate. (with-connection '("testdb" "foucault" "surveiller" "localhost") ...) The same additional parameters apply to specifying ports or establishing an ssl connection For other connection options, please see https://marijnhaverbeke.nl/postmodern.html#function-connection If you are creating a database, you need to have established a connection to a currently existing database (typically "postgres"). Assuming the foucault role is a superuser and you want to stay in a development connection with your new database afterwards, you would first use with-connection to connect to postgres, create the database and then switch to connect-toplevel for development ease. (with-connection '("postgres" "foucault" "surveiller" "localhost") (create-database 'testdb :limit-public-access t :comment "This database is for testing silly theories")) (connect-toplevel "testdb" "foucault" "surveiller" "localhost") Note: (create-database) functionality is new to postmodern v. 1.32. Setting the :limit-public-access parameter to t will block connections to that database from anyone who you have not explicitly given permission (except other superusers). Pooling Connections A word about Postgresql connections. Postgresql connections are not lightweight threads. They actually consume about 10 MB of memory per connection. In addition, any connections which require security (ssl or scram authentication) will take additiona time and create more overhead. Postgresql can be tuned to limit the number of connections allowed at any one time. It defaults to 100. The parameter is set in the postgresql.conf file. Depending on the size of your server and what you are doing, the sweet spot generally seems to be between 200-400 connections before you need to bring in connection pooling. If your application is threaded, each thread should use its own connection. Connections are stateful and attempts to use the same connection for multiple threads will likely have problems. If you have an application like a web app which will make many connections, you also generally do not want to create and drop connections for every query. The usual solution is to use connection pools so that the application is grabbing an already existing connection and returning it to the pool when finished, saving connection time and memory. To use postmodern's simple connection pooler, the with-connection call would look like: (with-connection '("testdb" "foucault" "surveiller" "localhost" :pooled-p t) ...) The maximum number of connections in the pool is set in the special variable *max-pool-size*, which defaults to nil (no maximum). Basic Queries Now for a basic sanity test which does not need a database connection at all: (with-connection '("testdb" "foucault" "surveiller" "localhost") (query "select 22, 'Folie et déraison', 4.5")) ;; => ((22 "Folie et déraison" 9/2)) Query is the basic way to send queries to the database. Please see the documentation for query for details on return types, parameterized queries, etc. The same query can be expressed in s-sql like this: (query (:select 22 "Folie et déraison" 4.5)) ;; => ((22 "Folie et déraison" 9/2)) In many contexts, query strings and lists starting with keywords can be used interchangeably. The lists will be compiled to SQL. The S-SQL manual describes the syntax used by these expressions and provides many examples. Lisp values occurring in them are automatically escaped. In the above query, only constant values are used, but it is possible to transparently use run-time values as well: (defun database-powered-addition (a b) (query (:select (:+ a b)) :single)) (database-powered-addition 1030 204) ;; => 1234 That last argument, :single, indicates that we want the result not as a list of lists (for the result rows), but as a single value, since we know that we are only selecting one value. Some other options are :rows, :row, :column, :alists, :plists, :array-hash, :json-strs, :json-str, :json-array-str, :dao, :vectors and :none. These, and others, and their precise effect is documented in the Postmodern reference manual under Queries You do not have to pull in the whole result of a query at once, you can also iterate over it with the doquery macro: (doquery (:select 'x 'y :from 'some-imaginary-table) (x y) (format t "On this row, x = ~A and y = ~A.~%" x y)) DAO Classes You can work directly with the database or you can use a simple database-access-class (aka dao) which would cover all the fields in a row. This is what a database-access class looks like: (defclass country () ((name :col-type string :initarg :name :reader country-name) (inhabitants :col-type integer :initarg :inhabitants :accessor country-inhabitants) (sovereign :col-type (or db-null string) :initarg :sovereign :accessor country-sovereign)) (:metaclass dao-class) (:keys name)) The above defines a class that can be used to handle records in a table named 'country' with three columns: name, inhabitants, and sovereign. The :keys parameter specifies which column(s) are used for the primary key. Once you have created the class, you can return an instance of the country class by calling (get-dao 'country "Croatia") You can also define classes that use multiple columns in the primary key: (defclass points () ((x :col-type integer :initarg :x :reader point-x) (y :col-type integer :initarg :y :reader point-y) (value :col-type integer :initarg :value :accessor value)) (:metaclass dao-class) (:keys x y)) In this case, retrieving a points record would look like the following where 12 and 34 would be the values you are looking to find in the x column and y column respectively.: (get-dao 'points 12 34) Consider a slightly more complicated version of country: (defclass country-c () ((id :col-type integer :col-identity t :accessor id) (name :col-type string :col-unique t :check (:<> 'name "") :initarg :name :reader country-name) (inhabitants :col-type integer :initarg :inhabitants :accessor country-inhabitants) (sovereign :col-type (or db-null string) :initarg :sovereign :accessor country-sovereign) (region-id :col-type integer :col-references ((regions id)) :initarg :region-id :accessor region-id)) (:metaclass dao-class) (:table-name countries)) In this example we have an id column which is specified to be an identity column. Postgresql will automatically generate a sequence of of integers and this will be the primary key. We have a name column which is specified as unique and is not null and the check will ensure that the database refuses to accept an empty string as the name. We have a region-id column which references the id column in the regions table. This is a foreign key constraint and Postgresql will not accept inserting a country into the database unless there is an existing region with an id that matches this number. Postgresql will also not allow deleting a region if there are countries that reference that region's id. If we wanted Postgresql to delete countries when regions are deleted, that column would be specified as: (region-id :col-type integer :col-references ((regions id) :cascade) :initarg :region-id :accessor region-id) Now you can see why the double parens. We also specify that the table name is not "country" but "countries". (Some style guides recommend that table names be plural and references to rows be singular.) More detailed information on DAO classes is found here: Database Access Object (Dao) Classes Define-Dao-Class Macro (New to version 1.33.12) New to Postmodern version 1.33.12 (thank you Killianmh) is a macro that makes defining a dao class slightly easier. It is like defclass except two postmodern specific changes: The dao-class metaclass options is automatically added. If second value in a slot is not a keyword, it is assumed to be col-type. Example: (define-dao-class id-class () ((id integer :initarg :id :accessor test-id) (email :col-type text :initarg :email :accessor email)) (:keys id)) Table Creation With SQL or S-SQL You can create tables directly without the need to define a class, and in more complicated cases, you may need to use the s-sql :create-table operator or plain vanilla sql. Staying with examples that will match our slightly more complicated dao-class above (but ignoring the fact that the references parameter would actually require us to create the regions table first) and '''
