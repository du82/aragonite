["https://marijnhaverbeke.nl/cl-javascript"]
title = "CL-JavaScript"
description = """
Runs the given code. code can be a
  string or a stream. compile and optimize
  determine whether the code should be compiled, and if, whether it
  should be optimized, before it is run. When
  wrap-parse-errors is given, parse errors are wrapped in
  js-condition objects, and
  can be caught by JavaScript catch forms."""
full_description = "JavaScript is the new BASIC—a universal scripting language. CL-JavaScript allows you to add user scripting to your Common Lisp application without requiring your poor users to learn Common Lisp. It is a JavaScript to Common Lisp translator, runtime, and standard library. We are ECMAScript 3 compatible, with some of the ECMAScript 5 extensions. By using the Lisp compiler to compile JavaScript (and by using some clever tricks for the things that Lisp normally isn't good at), this implementation manages to be faster than most of the 2009 generation of JavaScript engines. The new generation (V8, Jägermonkey) beats it by, depending on the benchmark, a factor 4 or so. 09-01-2012: Version 0.12.01: Follow changes in parse-js, add Function.prototype.bind, getter/setter support, small fixes. 08-12-2010: Version 0.10.12: Implements ECMA5-style array, string, and Object constructor methods, as well as a JSON object. Rough support for CommonJS modules. Adds correct length (arity) properties to function objects. 15-11-2010: Version 0.10.11: The first release on the new project page. Our API can be considered more or less stable now, and there are no serious gaps left in our ECMAScript 3 support. CL-JavaScript was created by Alan Pavičić, Iva Jurišić, and Marijn Haverbeke. It is released under a MIT-style licence. Development takes place on github. Any releases we make are listed under News. The latest release is always linked from cl-javascript.tgz. CL-JavaScript depends on parse-js, CL-PPCRE, and optionally local-time (you won't have a Date object if your ASDF can not find local-time). Because emulating IEEE 754 floating point special values (NaN, Infinity) in software is painfully inefficient, CL-JavaScript includes some non-portable code to directly use machine floats in SBCL and Allegro Common Lisp. There is fallback code present for other implementations, but since the developers don't develop on those, that might not be very well tested. It is recommended, if you really want to use the system on another implementation, to try and add native float support for that implementation."
