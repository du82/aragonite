["http://marijnhaverbeke.nl/cps"]
title = "Continuation-Passing Style, and why JavaScript developers might be interested in it"
full_description = "Topic: JavaScript, 'AJAX', continuations Audience: JavaScript programmers Author: Marijn Haverbeke Date: July 24th 2007 Most programmers, at least those whose interests go beyond just Java or PHP, will at some point have come across the concept of continuations. When I read the Scheme Revised Report for the first time, I was rather bewildered by that part of the language. To recap: Scheme's call-with-current-continuation function makes it possible to capture a computation, a state of the call stack as it were, and resume that same state at a later time. On top of such a primitive, various form of exception handling and C-like longjmp tricks can be implemented. In most real Scheme programs I have seen, stack-unwinding tricks that other languages would handle with try/catch or similar are the only applications of call-with-current-continuation. The canonical example application of continuations, 'non-deterministic programming' ― basically a way to abstract backtracking in a search algorithm ― is not something that is very hard to do without continuations. Some people even advocate removing continuations from the Scheme standard entirely, on the basis that they are hard to implement efficiently. They conflict with the 'call stack' model of computation, and combine very poorly with dynamically-scoped cleanup code such as C++ destructors or other languages' finally clauses. Because of these things, I used to consider continuations mostly a toy. But a very cute toy. I was delighted to see, for example, that in a language that does not support call-with-current-continuation but does have closures, any code can be converted to continuation-passing style by a rather simple transformation. If we have a JavaScript program... This can be transformed as follows: We add an extra argument to every function, which will be used to pass the function's continuation. This continuation is a function value representing the actions that must happen after the function 'returns'. The stack becomes obsolete in continuation-passing style ― when a function calls another function, that is the last thing it does. Instead of waiting for the called function to return, it puts any work it wants to do afterwards into a continuation, which it passes to the function."
year_published = 2025
