title = "My Principles for Web Development  |  mariohamann.com"
description = 'Reflecting what "Quality in Web Development" means to me.'
full_description = '''1 July 2023 My Principles for Web Development Having had some discussions this week, here my personal perspective on what "Quality in Web Development" means to me: 🤝 Accessibility: Equal access, regardless of disabilities or limited resources. ♻️ Sustainability: Efficient, simplified architecture and features. 😊 Enjoyability: Intuitive, appealing and valuable user experiences. 🫡 Trustworthiness: Respect for security, privacy and reliability. (I'm updating this post from time to time. This is v6) What do you miss? How do you tackle this? Which principles do you follow? Join the discussion on Mastodon. Reactions on Mastodon Post: 14 9 3'''
