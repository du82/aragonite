title = "หนังสือนอกจากจะให้ความรู้แล้วยังเป็นสิ่งมีค่าควรที่จะเก็บรักษาไว้"
description = "หนังสือเล่มโปรดของเราในวันนี้อาจเป็นของหายากในวันข้างหน้าก็เป็นได้"
full_description = "มาทำความรู้จักความสำคัญของหนังสือให้มากขึ้น หนังสือนักเป็นสิ่งสำคัญมากสำหรับชีวิตประจำวันอย่างทุกคน นั้นเกิดตั้งแต่สมัยเด็กที่เราต้องเจอกับการเรียนเพราะหนังสือเองล่ะที่ทำให้เราเติบโตและมีความรู้จนถึงทุกวันนี้ได้ หนังสือเปรียบเสมือนสมองส่วนหนึ่งของเราที่จะทำพาความรู้มาให้ยังตัวมนุษย์เอง ซึ่งเกิดจากการคิดในสิ่งที่ได้อ่านหรือสิ่งที่เกิดขึ้น ประสบการ์ณจากชีวิตจริงสู่กระดาษที่พิมไปด้วยความรู้ สติปัญญา และความฉลาดมากมีของเราเอง นั่นก็เป็นส่วนหนึ่งที่เป็นความรู้จากหนังสือทั้งนั้น แต่เดิมไม่เคยมีหนังสือมาก่อนแต่ทำการสลักไว้กับฝาผนังเพื่อให้ลูกหลานของแต่ละคนได้เข้าใจชีวิตความเป็นมาในแต่ละยุคสมัยหนังสือมีประโยชน์มากมายต่าง มนุษย์เรามีความต้องการความอยากรู้อยากเห็นและจึงต้องแสวงหาสิ่งที่อยากรู้นั้นอีกด้วยต่างๆ อย่างการเดินทาง ถามไถ่ และก็ทำการบันทึกลงไว้ในหนังสือเพื่อให้รู้ถึงสิ่งที่เกิดขึ้นมาแล้ววันนั้น แต่สิ่งสำคัญนั้นอยู่ที่การหาจากหนังสือเพราะส่วนใหญ่แล้วจะมีบันทึกต่างๆ เพื่อนำไปสู่ความรู้ที่เป็นจริงในอนาคตได้ นั่นคือการอ่านนั่นเอง จนสมัยนี้มีหนังสือเกิดขึ้นมากมายทั่วทุกมุมโลกไม่ว่าจะเขียนขึ้นเองหรือไม่มีที่อ้างอิงใดๆ เกิดจากจินตนาการล้วนแล้วแต่ความคิดมนุษย์โดยสิ้นเชิง อย่าง การ์ตูนที่สมัยนี้เป็นที่นิยมในกลุ่มวัยรุ่นเด็กเล็กแดงที่สร้างมาเพื่อให้อ่านได้สบายๆ เกิดความเพลิดเพลิน แต่บ้างแล้ว ผู้ปกครองบางท่านอาจจะมองว่าการอ่านการ์ตูนจะทำให้เด็กรุนแรงตาม แต่หนังสือนั้นไม่ได้สอนให้คนเป็นเช่นนั้น แต่สร้างมาเพื่อให้รู้สิ่งที่เกิดขึ้นไปแล้ว และนำมาแก้ไขในปัจจุบัน แต่ก็ไม่ค่อยมีใครเคยคิดเช่นนี้ ว่าหนังสือนั้นทำมาเพื่อจดประสงค์แค่ให้ความรู้แก่ประชาชน แต่ไม่ได้รู้ถึงว่าหนังสือนั้นบอกอนาคตเพื่อปรับปรุงเปลี่ยนตนเองให้ดียิ่งๆขึ้นไป"
year_published = 2025
clearnet = "https://markbattypublisher.com"
