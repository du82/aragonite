ign Systems September 10 2019 A few weeks ago I presented at Adobe Fonts for under a fiver October 23 2019 After 24 years of using Adobe design software products – starting with Photoshop 2, today, I've finally cut the chord and cancelled my subscription to Creative Cloud. Design muscles October 23 2019 In 1984 my uncle's mother died. She lived in a tiny bungalow at the end of a small street with a long garden leading on to a golf course. It was always raining in 1984. On this day it was drizzling with heavy grey skies. The trees at the end of the garden complaining as much as the adults in the house sorting through a lifetime of stuff. Designers are people, too November 05 2019 Design teams in large organisations are scaling faster every year. These are organisations that have heavily invested in design as a differentiator and in doing so are struggling to provide the best management structure and processes to help brilliant designers to do amazing work. My growing fear is that this is at the expense of the work, but also of the health and wellbeing of swathes of designers. Diamond discussions November 07 2019 Yesterday, I was pondering on how discussion frameworks can help streamline all sorts of things within design. Discussion guides help keep user research focussed and the results comparable. Kickoff meeting agenda guides can accelerate projects and are designed to uncover project difficulties before you start. The Five Whys is designed to really get to the heart of a problem and help the receiver to work through a potential solution in answering. Diamond discussions is a discussion framework to help you get from A to B to solve problems faster. The day I fixed my RSS feeds November 12 2019 I fixed my RSS feeds! Hurray! To be honest I didn't know they were broken until a couple of friends let me quietly know. The surprising thing was the amount of users I'd be neglecting and the amount of subsequent bandwidth this website used since fixing them! Progressive brand enhancement in design systems February 07 2020 How does your design system turn the brand dial up or down in a diverse organisation? On design tasks February 24 2020 I talk about design tasks and why they are a terrible idea, how organisations can do better, and how designers might approach interviewing in a slightly different way. You've found yourself leading a remote design team March 05 2020 My own firehose March 05 2020 reset April 20 2021 Problem space. Shipping space. April 30 2021 Finsihed May 14 2021 Optical Size tweaking for dark mode May 21 2021 The pros and cons of remote office work May 25 2021 The problem with UX/UI portfolios June 16 2021 The morning test June 30 2021"
