["https://markboulton.co.uk/journal/handbook"]
title = "Handbook - Mark Boulton"
full_description = "Handbook Years ago, I started writing down the things I’ve learnt being a designer and running teams and companies. Mostly so I could articulate a challenge, a thought, a mistake. Like a little handbook. I found it the other day, and listening to the talks for the past couple of days at Leading Design has spurred me into action to add to them, but also to type them out, and publish them here. I miss writing. I think it’s one of the most under-valued skills a designer can have. Writing something down in as few words as possible, encapsulating a thought, message, or idea, is a skill that takes decades of practice. And I’m out of practice. So bear with me whilst I shake off the rust in public and share what I’ve learnt. Please don’t take me for being rude, but it’s not for you. It’s for me. Warts and all. Here’s what I have managed to decipher so far from my scrappy little notebook. I’ll update this as I go. Weeds Crucible Crit Cake Collaborating Offer Recipe Measure Units Gains Landings Dent Make Gravity Mass Sizing Gut Ego Screw Simmer Rest Jelly Run Ebb Things Boards Words Ways Magic November 07 2024 Tags that this post has been filed under. #Journal #Handbook ← An Anchor Weeds →"
