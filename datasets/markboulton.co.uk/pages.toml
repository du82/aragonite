["https://markboulton.co.uk/journal/the-morning-test"]
title = "The morning test - Mark Boulton"
full_description = "The morning test Does it pass the morning test? The morning brings clarity. A step back. A precious moment unencumbered by the work of the day. Chasing a solution like following the string. One poor design decision leading to another. Before I know it, the work is myopic and unfocussed. Chasing my tail all day long. And, often, I’m blind to it. The morning provides a pause that I take advantage of every day. Looking at the work from the day before and asking the simple question: Does it pass? No? In the bin it goes. Yes? On we go. June 30 2021 Tags that this post has been filed under. #Journal #Design ← Weeknote 36 Weeknote 37 →"
