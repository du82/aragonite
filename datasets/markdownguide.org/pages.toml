["https://markdownguide.org/tools/typora"]
title = "Typora Markdown Reference | Markdown Guide"
description = "Typora is a simple and configurable editor designed for notes and documents."
full_description = "Typora is a simple and configurable document editor that provides excellent Markdown support. This application is ideal for students and professionals who need to write essays and reports. It might be difficult using Typora for multi-file projects or for website publishing. Typora stands out by offering a variety of settings without sacrificing the simplicity of a barebones interface. Newcomers to Markdown may appreciate the keyboard shortcuts for formatting options as well as the intuitive live editor that hides the Markdown formatting syntax after you type it. See the Typora Markdown reference for the official documentation. The Typora documentation indicates that the application generally uses GitHub Flavored Markdown (GFM). Typora provides a variety of themes for when you export your documents. If you know CSS, you can customize these themes. Open the Preferences window and see the settings under Appearance > Themes. Typora provides strict mode settings for users who want to enforce syntax limitations on headings, ordered lists, and unordered lists. For example, you could configure unordered lists to only use hyphens and not asterisks. Configure these settings in the Preferences window under Markdown > Syntax Preference. See the Typora documentation for additional information. You can disable Typora’s live editor by selecting View > Source Code Mode. This will reveal all of the Markdown formatting that’s hidden by the live editor. Typora provides a wide variety of export options under File > Export for when you’re ready to publish your Markdown document. Some of the export options, like Microsoft Word and LaTeX format, require Pandoc. Learn Markdown in 60 pages. Designed for both novices and experts, The Markdown Guide book is a comprehensive reference that has everything you need to get started and master Markdown syntax. Don't stop now! 🚀 Star the GitHub repository and then enter your email address below to receive new Markdown tutorials via email. No spam!"
