["https://markdownguide.org/tools/stackedit"]
title = "StackEdit Markdown Reference | Markdown Guide"
description = "StackEdit is a powerful online Markdown editor you can use anywhere."
full_description = "StackEdit is a powerful online Markdown editor. Like Dillinger, it loads right in your web browser, so there’s no need to download and install an application on your computer. StackEdit has a wide variety of features and configurable options for power users, making it in many ways a better all-around option than comparable desktop applications. StackEdit’s Markdown support is excellent. Features include the ability to sync and save files to third-party services, output to various file formats using custom templates, and configure metadata properties for files. (Note that you must subscribe to StackEdit to output to some of the file formats, like PDF.) LaTeX and UML diagrams are also supported. You can apparently use StackEdit without an internet connection. StackEdit is limited by a lack of documentation. Users are left to discover and toy around with many of the application’s features on their own. That’s a shame, because the undocumented features are essentially unusable by all but the most advanced users. For example, you can create your own templates for exported files, but there’s no information about what templating language is used, and no guidance on how to create your own templates. There is a community support forum, but users shouldn’t have to read through questions and answers to figure out how to do something simple. Learn Markdown in 60 pages. Designed for both novices and experts, The Markdown Guide book is a comprehensive reference that has everything you need to get started and master Markdown syntax. Don't stop now! 🚀 Star the GitHub repository and then enter your email address below to receive new Markdown tutorials via email. No spam!"
