description = "Dawin is a web-based RTL Markdown editor designed for using anywhere."
full_description = "Dawin (aka Writer in Arabic Language) is an online right to left (RTL) Markdown editor (for Arabic, Persian, etc.). Like StackEdit, it loads right in your web browser without having to install anything. Dawin has two panes: The editor on the right, and the live preview on the left. The split panes make it easy to see what Markdown-formatted text looks like. Dawin provides excellent Markdown support and has export options for HTML and Markdown files. And since Dawin loads in your web browser, you can preview it on your browser or your phone and install it wherever you want — it also works offline (PWA). For those reasons, Dawin is best used for experimentation and quick note taking. Learn Markdown in 60 pages. Designed for both novices and experts, The Markdown Guide book is a comprehensive reference that has everything you need to get started and master Markdown syntax. Don't stop now! 🚀 Star the GitHub repository and then enter your email address below to receive new Markdown tutorials via email. No spam!"
