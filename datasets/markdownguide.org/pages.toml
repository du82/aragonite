["https://markdownguide.org/tools/madoko"]
title = "Madoko Markdown Reference | Markdown Guide"
description = "Madoko is an application for writing professional articles and more."
full_description = "Madoko is a fast Markdown processor for writing professional articles, books, manuals, webpages and presentations, with a focus on simplicity and plain text readability. You can use Madoko to write complex documents in Markdown and get beautiful PDF and HTML output. Madoko is a Javascript Markdown processor written in Koka. It started out as a demo program for the new, strongly typed, Koka language and the name comes from “Markdown in Koka.” Madoko can both be run locally as a command-line program or on Madoko.net to take advantage of storage and collaboration features. Madoko integrates seamlessly with Dropbox, Github, and OneDrive. It automatically synchronizes all changes in the cloud. This way, your document is always available from any device. The online editor can also edit files on the local disk, or run LaTeX locally, using the Madoko local program. Madoko implements extensions like Github Flavored Markdown, pandoc, Markdown Extra, and multi-markdown, and it adds other useful features for writing academic and industrial documents. In Madoko, tabs are considered to be equivalent to 4 spaces. It’s best to configure your editor to view tabs as 4 spaces wide or documents may look off. Learn Markdown in 60 pages. Designed for both novices and experts, The Markdown Guide book is a comprehensive reference that has everything you need to get started and master Markdown syntax. Don't stop now! 🚀 Star the GitHub repository and then enter your email address below to receive new Markdown tutorials via email. No spam!"
