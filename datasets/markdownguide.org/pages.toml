full_description = "Learn Markdown in 60 pages. The Markdown Guide book includes everything you need to get started and master Markdown syntax. If you're looking for an in-depth guide for more Markdown tips and tricks, I highly recommend the unofficial but authoritative Markdown Guide. The Markdown Guide is awesome. I keep it open in a browser tab for reference while working on my guides. The perfect book form teaching resource for Markdown — concise, mapping functionality, extensions, and best practices. Not a long read, but if you like documentation in book format (I do), this is the book for Markdown syntax. If you’re working with Markdown, then do yourself a favour and check out The Markdown Guide... It’s excellent. A terrific reference—straightforward and well organized, briskly paced, and featuring a spot-on instructive tone that conveys friendly engagement. If you're not completely satisfied with The Markdown Guide, I'll refund your money, no questions asked. Matt Cone is a technical writer at Fastly. He has experience creating documentation for organizations like Linode and the U.S. Department of Health and Human Services. Matt's first book, Master Your Mac, was published by No Starch Press. To get in touch with Matt, visit https://www.mattcone.com."
