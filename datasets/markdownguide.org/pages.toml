["https://www.markdownguide.org/tools/reddit"]
title = "Reddit Markdown Reference | Markdown Guide"
description = "Reddit is a popular online community that supports posting in Markdown."
full_description = "With Markdown, Reddit text formatting is a breeze. All Reddit users have the option of writing comments and posts in Markdown. The popular news website has developed its own Markdown processor called “snoomark” which is based on GitHub-Flavored Markdown. Some have started referring to this as “Reddit-flavored Markdown.” For a deep dive into Reddit’s Markdown support, see this wiki article. By default, Reddit disables Markdown support for new posts and comments. You can switch from the rich text editor to Markdown by clicking the Switch to markdown link, as shown below. To permanently save this setting, you can enable the Default to Markdown setting in User Settings > Feed Settings. Enabling that setting will automatically enable Markdown for new posts or comments. Learn Markdown in 60 pages. Designed for both novices and experts, The Markdown Guide book is a comprehensive reference that has everything you need to get started and master Markdown syntax. Don't stop now! 🚀 Star the GitHub repository and then enter your email address below to receive new Markdown tutorials via email. No spam!"
