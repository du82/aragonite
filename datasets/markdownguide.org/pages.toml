full_description = "Bear is a macOS and iOS application designed for one thing: note taking. It’s like Evernote, but without the bloat. There aren’t a lot of whizbang features in Bear. Instead, Bear consistently delivers on all of its promises. Tags, search, and syncing all work flawlessly. The application is intuitive, and that’s exactly what you want when you’re taking notes. Bear doesn’t automatically enable support Markdown by default, but you can enable it in the preferences. The application has a hybrid live editor and text editor — you can see both the Markdown syntax and the way the formatting changes the text. It takes a while to get used to, but it’s useful if you’re just getting started with Markdown. To enable Markdown support in Bear, open the Preferences window. On the General tab, turn on the setting for Markdown compatibility mode. Learn Markdown in 60 pages. Designed for both novices and experts, The Markdown Guide book is a comprehensive reference that has everything you need to get started and master Markdown syntax. Don't stop now! 🚀 Star the GitHub repository and then enter your email address below to receive new Markdown tutorials via email. No spam!"
