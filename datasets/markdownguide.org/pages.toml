title = "Obsidian Markdown Reference | Markdown Guide"
description = "Obsidian is a Markdown note-taking application loaded with features."
full_description = "Obsidian is a relatively new entrant in the increasingly crowded Markdown knowledge base and note-taking market. Obsidian’s excellent Markdown support and its simple, straightforward design makes it a standout application in the category. Desktop and mobile applications are available. Obsidian sports virtually all of the standard fare common to the other applications in this category, but it ups the ante by including a number of other features for power users. There’s a visually-striking graph view that’s a kind of “mind map” of all your files stored in Obsidian, a “Markdown format importer” that can find and replace certain Markdown syntax elements in your files, and support for math and diagram syntax. That really just scratches the surface of Obsidian’s capabilities. Obsidian is extensible, and there are hundreds of free community plugins available within the application. Two other features are worth mentioning. Obsidian provides a simple way to publish notes to the internet, and it stores all of your files in plaintext Markdown files containing only the text you enter. Learn Markdown in 60 pages. Designed for both novices and experts, The Markdown Guide book is a comprehensive reference that has everything you need to get started and master Markdown syntax. Don't stop now! 🚀 Star the GitHub repository and then enter your email address below to receive new Markdown tutorials via email. No spam!"
