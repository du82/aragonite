full_description = "Simplenote is a basic note-taking application developed by Automattic, the same company that created WordPress. The application is free and available on every platform, including Linux. It’s also open source. You can use Simplenote in your web browser. After you download the application, you’ll be prompted to create an account. That account is used to back up your notes to Automattic’s servers and synchronize your notes across all of your other devices. Note that Automattic doesn’t encrypt your content on their servers. You can’t disable the synchronizing feature. Export options are limited, but the Publish to Web feature allows you to share your notes on the internet with a public URL. To enable Markdown support in Simplenote, create a note, click the Info icon, and then select Markdown Formatted. The currently selected note and any new notes you create in the future will have this setting enabled automatically. Simplenote doesn’t use a live editor. You’ll continue to see the Markdown-formatted text after you’ve typed it. To preview Markdown documents in Simplenote, click the Preview Markdown icon — it looks like an eye. Learn Markdown in 60 pages. Designed for both novices and experts, The Markdown Guide book is a comprehensive reference that has everything you need to get started and master Markdown syntax. Don't stop now! 🚀 Star the GitHub repository and then enter your email address below to receive new Markdown tutorials via email. No spam!"
