["https://markmap.js.org/docs/markmap"]
title = "markmap - markmap docs"
full_description = "Close ||| markmap JSON Options Magic Comments faq Packagesmarkmap-autoloader markmap-lib markmap-render markmap-view markmap-cli markmap-toolbar coc-markmap GuidesUse with Node markmap What is markmap? Markmap is a combination of Markdown and mindmap. It parses Markdown content and extracts its intrinsic hierarchical structure and renders an interactive mindmap, aka markmap. The easiest way to use it is to load your Markdown content into the 👉 try it out page. You can also try it in: VSCode 🚀 command-line: see markmap-cli Vim / Neovim: see coc-markmap Programmatic Usage Basically we use markmap-lib to preprocess Markdown into structured data, then render the data into interactive SVG with markmap-view. See the relevant packages for more details. Demos markmap with React: https://stackblitz.com/edit/markmap-react?file=src%2Fmarkmap-hooks.tsx markmap with Vue: https://stackblitz.com/edit/markmap-vue?file=src/app.vue markmap auto-loader: https://stackblitz.com/edit/markmap-autoloader?file=index.html Support See FAQ for answers to your questions. If you still need help, feel free to ask in GitHub Discussions. Credits This project is heavily inspired by dundalek's markmap. Designed with ♥ by gera2ld"
