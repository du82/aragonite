["https://markmap.js.org/api/functions/markmap-view.defaultColorFn.html"]
title = "defaultColorFn | markmap"
description = """
Given a value in the input domain, returns the corresponding value in the output range.
If the given value is not in the scale’s domain, returns the unknown; or, if the unknown value is implicit (the default),
then the value is implicitly added to the domain and the next-available value in the range is assigned to value,
such that this and subsequent invocations of the scale given the same input value return the same output value.
Parametersx: stringA value from the domain.
Returns stringDefined in packages/markmap-view/src/constants.ts:8"""
full_description = "Given a value in the input domain, returns the corresponding value in the output range. If the given value is not in the scale’s domain, returns the unknown; or, if the unknown value is implicit (the default), then the value is implicitly added to the domain and the next-available value in the range is assigned to value, such that this and subsequent invocations of the scale given the same input value return the same output value. Returns an exact copy of this ordinal scale. Changes to this scale will not affect the returned scale, and vice versa. The first element in domain will be mapped to the first element in the range, the second domain value to the second range value, and so on. Domain values are stored internally in an InternMap from primitive value to index; the resulting index is then used to retrieve a value from the range. Thus, an ordinal scale’s values must be coercible to a primitive value, and the primitive domain value uniquely identifies the corresponding range value. Setting the domain on an ordinal scale is optional if the unknown value is implicit (the default). In this case, the domain will be inferred implicitly from usage by assigning each unique value passed to the scale a new value from the range. Note that an explicit domain is recommended to ensure deterministic behavior, as inferring the domain from usage will be dependent on ordering. The first element in the domain will be mapped to the first element in range, the second domain value to the second range value, and so on. If there are fewer elements in the range than in the domain, the scale will reuse values from the start of the range. Sets the output value of the scale for unknown input values and returns this scale. The implicit value enables implicit domain construction. scaleImplicit can be used as a convenience to set the implicit value."
year_published = 2025
clearnet = "https://markmap.js.org/api/functions/markmap-view.defaultColorFn.html"
