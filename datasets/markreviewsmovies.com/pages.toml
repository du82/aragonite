["http://www.markreviewsmovies.com/reviews/M/millersinmarriage.htm"]
title = "MILLERS IN MARRIAGE - Mark Reviews Movies"
full_description = '''Cast: Gretchen Mol, Julianna Margulies, Edward Burns, Minnie Driver, Benjamin Bratt, Morena Baccarin, Campbell Scott, Patrick Wilson, Brian d'Arcy James Writer/director Edward Burns follows the romantic woes of three siblings in Millers in Marriage. It seems like an easy, character-based bit of drama, except that so much of it feels disconnected. Those siblings, for example, never have a scene together. It's not as if they're estranged or anything, either, because Eve (Gretchen Mol), Maggie (Julianna Margulies), and Andy (Burns) are very much curious and concerned about each other's lives. They all live in New York City, at least for part of the year, but while pairs of them meet up in the country upstate for single scenes, there's never a moment when the movie gives us a sense that there is any real connection between all of them. The casting of three actors who look nothing like each other, by the way, doesn't exactly help matters, but that's a minimal concern compared to how disjointed the characters and story come across in Burns' script. Instead, we spend time with each sibling on their own, as each one tries to figure out what to do next with his or her love life. Eve, a former musician whose disbanded rock group had a hit or two during the 1990s, is in a terrible marriage to Scott (Patrick Wilson), a manager of musical acts, who has promised to get sober a few too many times for Eve to believe him anymore. Sure enough, Scott pours himself a drink shortly upon returning home to the couple's apartment, after he didn't contact Eve for three days while on tour with a band. As for Maggie, she's a successful author, currently finishing her newest book at a second home in upstate New York. Maggie is married to Nick (Campbell Scott), who's also a writer, but he's currently suffering from a sort of existential form of writer's block. Believing that he would have written "the Book" by now if he had it in him, Nick now just spends his days hanging around the house, refusing to go anywhere, focusing on cooking for him and his wife, and becoming sensitive whenever the subject of writing is raised.'''
