["http://www.markreviewsmovies.com/reviews/P/paddington3.htm"]
title = "PADDINGTON IN PERU - Mark Reviews Movies"
full_description = '''Cast: Hugh Bonneville, Emily Mortimer, Madeleine Harris, Samuel Joslin, Antonio Banderas, Olivia Colman, Julie Walters, Carla Tous, Jim Broadbent, Hayley Atwell, the voices of Ben Whishaw, Imelda Staunton Paddington in Peru has some mighty big shoes�or, better, a peacoat�to fill, following the surprising achievement of its great predecessor Paddington 2. There's a mostly new team of filmmakers this time around, and in the spirit of the title character, one wants to hope for the best for them as they take over the tale of the kind-hearted bear. It brings no pleasure to say that this movie falls well short of the previous two. Paddington, the creation of the late Michael Bond, is a simple character with simple means and goals. An adventure for him is the stuff of everyday life, being a talking bear from Peru who unexpectedly finds himself in London as the ward of an ordinary British family. The first miscalculation of this screenplay, written by a trio of newcomers to the series (Mark Burton, Jon Foster, and James Lamont), is to take Paddington out of the city and return him to the jungle of his homeland. To be clear, the basic idea of such an adventure is fine in theory, but the screenplay here takes the notion of an adventure for Paddington (voiced by Ben Whishaw) to some extremes. The adventure matters more than the characters this time, as Paddington and his adoptive family the Browns find themselves on roaring rapids, lost in the rainforest, and contending with a couple of villains who, to be fair, don't know any better than to be greedy and heartless. When the bear gives one of those baddies his trademarked "hard stare" to point out how impolite the antagonist is being, it's a legitimately funny and pleasant moment, because it's as if the filmmakers have finally remembered the character at the heart of this story�the one they've gone so far out of their way to ignore. Our beloved bear is still the same good-natured and optimistic creature, of course, which is why he ends up in Peru in the first place. The opening scenes remind us of the slapstick humor from the previous films, as Paddington attempts to get his passport picture taken at a photo booth with much trouble, and catches us up on the rest of his London-based family. The Browns have changed quite a bit, and that's not even taking into consideration that Mary Brown is now played by Emily Mortimer (a fine choice).'''
