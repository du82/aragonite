["http://www.markreviewsmovies.com/reviews/S/slylives.htm"]
title = "SLY LIVES! (AKA THE BURDEN OF BLACK GENIUS) - Mark Reviews Movies"
full_description = '''At its core, Sly Lives! (aka The Burden of Black Genius) is a traditional sort of biographical documentary. The subject is Sly Stone, best known as the frontman and musical mastermind of Sly and the Family Stone, and his story is more or less a familiar one in the realm of sudden fame. Because the film is directed by musician Ahmir "Questlove" Thompson, though, it's more probing and curious about the nature of celebrity and the influence of Stone's music than that broad description of the documentary might make it seem. Thompson either didn't receive or, as might be the case after hearing the breadth of the central figure's story, didn't ask for access to Stone, who is still alive and seemingly enjoying a private existence in his early 80s. There are some more recent photos of the man, presumably provided by his children or found on social media, and all things considered, he looks to be in good health and of good spirits. Considering all of those things that the film recounts over the course of his rocky career, it's genuinely nice to see him like that. That feeling is partly how we know the film succeeds at its main goal, which is to tell Stone's story with a level of understanding that wasn't always offered to the musician when he likely needed it the most. Like so many artists who have celebrity thrust upon them, Stone didn't know how to handle the attention and scrutiny of the spotlight. Thompson and his multiple interview subjects, musicians who admire and/or worked with the man, argue that Stone's position was unique. There had never been the equivalent of a "Black Elvis" before Stone, so even if the man wanted to seek advice about how navigate this world of overwhelming fame, there'd be no one to ask. What made Stone unique as a musician was both his undeniable musical talent�in the practical sense of being able to play several instruments, as well as in understanding music on a compositional level and in how to produce it for recording�and the times in which he was at the height of his fame. It was the late 1960s when Sly and the Family Stone came to prominence, off the popularity of "Dance to the Music," and in a time of social and cultural turmoil and division, Stone formed a band made up diverse musicians�Black and white, men and women.'''
