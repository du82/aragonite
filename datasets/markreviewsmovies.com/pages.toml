["http://www.markreviewsmovies.com/reviews/A/accidentalgetawaydriver.htm"]
title = "THE ACCIDENTAL GETAWAY DRIVER - Mark Reviews Movies"
full_description = "Based on a true and genuinely frightening story, The Accidental Getaway Driver doesn't take the path one might expect from its premise. It seems like one for a harrowing thriller, but co-writer/director Sing J. Lee's movie attempts to dig into the hidden humanity beneath that setup. It's hard at times to entirely see that quality. Undoubtedly, Lee and Christopher Chen's script, adapting a magazine article by Paul Kix, does find a surprising degree of human connection within this tale. The ending here is quite subdued and sweet, which might be last thing one might expect to be saying about a movie in which an older man is taken hostage by three desperate criminals. The man is Long (Hiep Tran Nhia), a Vietnamese immigrant living in California and working as a cab driver, presumably catering to other local Vietnamese speakers in the area, since he knows only a little English. There's very little introduction to the character, except for his job, that he lives in an apartment complex, and that there's no one at home waiting for him on what can be late-night calls from people in need of a ride. While out shopping at a grocery store, Long receives one of those calls. Three men need to get somewhere, but while Long turns down the job initially, the persistent caller eventually offers to pay the driver double his usual fee. It's an offer he can't pass up. The three men are T�y (Dustin Nguyen), Eddie (Phi Vu), and Aden (Dali Benssalah). The first two have a Vietnamese background, with T�y instructing Long to stop at a local shop and then drive them around while they wait for someone to answer a call with their next location. The whole thing is very suspicious. Long can sense it, and as soon as he asks the men to let him drop them off so that he can go home, T�y pulls out a pistol and aims it at the driver. Part of the tension here�beyond the obvious, of course, that this innocent man has been abducted and is being held against his will�is that we know more about just how dangerous the situation is for Long than the driver can comprehend. Once mastermind Aden realizes that his hostage almost exclusively speaks and understands Vietnamese, he begins to explain the trio's plans and his own plans for Long in English. Here, it seems, are pure villains, capable of violence and willing to enact it on this innocent man, simply because he took a call and was willing to help them."
