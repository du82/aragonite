["http://www.markreviewsmovies.com/reviews/M/mydeadfriendzoe.htm"]
title = "MY DEAD FRIEND ZOE - Mark Reviews Movies"
full_description = "Cast: Sonequa Martin-Green, Natalie Morales, Ed Harris, Morgan Freeman, Utkarsh Ambudkar, Gloria Reuben For as much unspoken pain and regret as there is in My Dead Friend Zoe, co-writer/director Kyle Hausmann-Stokes' film never feels hopeless. Both qualities come from the story's main character, a U.S. Army veteran dealing with post-traumatic stress disorder following the death of her friend. The grief and guilt belong to her, as well as a few other characters in this story, but so, too, does the desire to help others who need it. Watching the film, we become invested in the possibility that Merit (Sonequa Martin-Green) might finally learn to help herself and accept that others want to do the same for her. Considering the severity of the subject matter, it is a surprise how warm, tender, and humorous Hausmann-Stokes' debut feature can be. To be sure, the screenplay by the director and A.J. Bermudez, inspired by the former's own time in and colleagues within the military, cuts right to both the gimmick and the trauma of its story, but it never allows itself to play games with the former or wallow in the latter. Merit's attitude has a lot to do with that approach. We first meet her serving as a mechanic in Afghanistan, relegated to glorified guard duty at an out-of-the-way outpost. She and Zoe (Natalie Morales), who appears to be Merit's only real friend overseas, spend their time listening to music, singing along, and talking about their post-military plans. Merit wants to go to college, but Zoe doesn't see many options or opportunities after her tour of duty is complete. After that brief introduction, the film arrives in its present day, as Merit is present for a group therapy session, ordered by a judge after a work-related incident and led by Dr. Cole (Morgan Freeman). It would be erroneous to say that Merit participates in the group, because she doesn't say anything about herself and is often distracted whenever other veterans at the sessions are speaking. That's because Merit is too busy listening to Zoe, who makes sarcastic comments and is impatient for the session to end. As the title lets us know, Zoe isn't actually there. She's only in Merit's head, because, at some point before this and after the prologue, Zoe died. Whatever happened to her friend, Merit refuses to even acknowledge Zoe's existence, either as a real person from her past or as a figment of her guilt-stricken imagination. She definitely won't say why Zoe is dead, and while that's the central mystery of the plot, there is much more going on here than just a series of flashbacks leading us to that revelation."
