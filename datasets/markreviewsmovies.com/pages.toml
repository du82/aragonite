["http://www.markreviewsmovies.com/reviews/U/unbreakableboy.htm"]
title = "THE UNBREAKABLE BOY - Mark Reviews Movies"
full_description = '''Cast: Zachary Levi, Meghann Fahy, Jacob Laval, Drew Powell, Gavin Warren, Patricia Heaton, Todd Terry, Peter Facinelli Unsure of whose story it wants to tell, The Unbreakable Boy goes for cheap and often disingenuous sentimentality. It's a story filled with characters who must have some depth, beyond the fact that they're based on real people, but in writer/director Jon Gunn's movie, they possess the thoughtfulness of greeting cards. Initially, it's the story of Austin (Jacob Laval), a 13-year-old boy who has spent his life with two medical conditions. He has osteogenesis imperfecta�"brittle bone disease" in more common parlance�and is on the autism spectrum. In a rush of back story, Austin takes us through his entire life before his first day in eighth grade, and despite so many broken bones (starting with a couple of broken ribs while he was born), the kid has a positive attitude about everything. Explaining his neurodevelopmental issue, Austin explains that, while some on the spectrum don't speak much, he loves to talk all the time about whatever might be on his mind. He's a good kid, obviously, and apart from one moment when his anger gets the better of him, the movie treats the character with such wide-eyed admiration and reverence that it might double-back and become a bit patronizing about him. Gunn's screenplay doesn't feel that way from the start, because it gives Austin his voice and allows the character to speak exclusively for himself and his experiences. Eventually, though, Austin starts to become more of a plot device and a means for another character to have his story told than the actual protagonist of what starts as the boy's own tale. That other character is Austin's father Scott (Zachary Levi), who goes through his own gauntlet of challenges and setbacks and changes. From the introduction, we learn, via Austin, that his father and mother Teresa (Megann Fahy), one of two characters who seem a lot more interesting than Scott but remain shoved in the background, had a slightly unorthodox romance. They met in a store, where she was working and he was browsing with his best and invisible (Don't ask, because the movie mostly bypasses this very odd detail) friend Joe (Drew Powell). After going on three dates, Teresa was pregnant before they could have a fourth one.'''
