["http://www.markreviewsmovies.com/reviews/G/gorge.htm"]
title = "THE GORGE - Mark Reviews Movies"
full_description = "MPAA Rating: (for intense sequences of violence and action, brief strong language, some suggestive material and thematic elements) For a while, it almost doesn't matter what's in the gorge at the, by way of the sheer scope of some of the framing here, sometimes-literal center of The Gorge. Screenwriter Zach Dean and director Scott Derrickson take a story revolving around a strange puzzle, involving the decades-long cover-up of something unspeakable, and focus it on a pair of lost, lonely, and psychologically wounded characters. That's an unexpected surprise, although the story's inevitable turn toward revealing the truth of that central mystery takes it to slightly disappointing and familiar ideas and action. First and for a while, though, there are simply the main characters, which is something, to be sure, in what becomes a loud and frantic chase/fight through a kind of hell. The basic premise is that there exists a gorge somewhere in some undisclosed location. Following the end of World War II and in the nascent period of the Cold War, the gorge was discovered, was explored, and became a source of great but uniting terror for countries on both sides of that political conflict. There was something in that deep, expansive chasm, and after a joint military expedition resulted in thousands of soldiers presumably dying inside the misty ravine, the operation became an international effort to ensure that nothing could escape the place and no one could find it. It's properly enigmatic and spooky stuff, told to Levi (Miles Teller), an elite sniper who was in the U.S. military and now does occasional contract work for private security firms, when he arrives on one side of the gorge. He has been recruited by the mysterious Bartholomew (Sigourney Weaver), because pretty much everything is a riddle in the early stages of the story, to spend a year standing guard in a tower over the western edge of the chasm. With no family or friends or personal connections of any kind of which to speak, Levi is the perfect candidate to drop everything for this job and possibly die doing it. Early on, the film lets us know this is a suicide mission. It's just that no one who takes the gig is aware of that fact until it's too late."
