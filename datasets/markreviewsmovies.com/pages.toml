["http://www.markreviewsmovies.com/reviews/D/deadthing.htm"]
title = "THE DEAD THING - Mark Reviews Movies"
full_description = "At first, The Dead Thing is a look at the numbing state of modern living�especially the contemporary dating scene. Alex (Blu Hunt), our main character, is an average young woman, living however she can in Los Angeles. She has a thankless, meaningless job of scanning things for some corporate entity and for some unknowable reason. She lives with her best friend in a house that the friend's mother bought for her. As for Alex's love life, it amounts to a string of dates and sexual encounters with assorted and quickly forgotten men, whom she finds by way of an app on her phone. Co-writer/director Elric Kane makes this study intriguing by way of dramatizing it as a series of patterns. We feel the grind, the absence of fulfillment, and the continual disappointment of this character's existence, simply by way of the movie's rhythm and visual repetition (Alex sitting in the same bar, saying and hearing the same things to and from man after man who are only distinct in the appearance). There is, though, no set pattern in the screenplay by Kane and Webb Wilcoxen, which keeps evolving and surprising. As strange as it may seem from a description of the early section of the film, the end goal here is a horror tale. Through all of that stories developments and revelations, though, Kane and Wilcoxen never lose sight of the material's themes about modernity. It just becomes more sinister and more allegorical, as the real horror here remains on an existential level. That path, ironically, begins with some optimism. After that string of dates and one-night affairs, Alex finds Kyle (Ben Smith-Petersen) on the dating app. He's a good-looking guy who appears as nice as anyone can from a single photo. He is holding a cat, after all. She messages him. Kyle responds, and the two arrange to meet at, of course, Alex's bar of choice. This date's different from the rest, however. Kyle is upfront about some things, such as admitting that the cat from the picture isn't actually his, and Alex feels comfortable and safe enough with the guy to explain her job and living situations�as well as how grating and deadening the routine, the disappointments, and the inability to see any future for herself are. They share something in the conversation and the silences, so when Kyle says they don't really need to talk anymore, Alex is more than happy to bring him back to her place�well, the room she has in the house belonging to her friend Cara (Katherine Hughes)."
