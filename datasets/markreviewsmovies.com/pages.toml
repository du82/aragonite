["http://www.markreviewsmovies.com/reviews/C/captainamerica4.htm"]
title = "CAPTAIN AMERICA: BRAVE NEW WORLD - Mark Reviews Movies"
full_description = "Cast: Anthony Mackie, Harrison Ford, Danny Ramirez, Shira Haas, Carl Lumbly, Tim Blake Nelson, Giancarlo Esposito, Xosha Roquemore, J�hannes Haukur J�hannesson, William Mark McCullough, Takehiro Hira, Liv Tyler Captain America: Brave New World is nothing extravagant, but that's what makes it feel different among its more recent peers in the so-called Marvel Cinematic Universe. Maybe the franchise's still-ongoing obsessions with multiverses and too many television shows to keep up with have been more tiring and tiresome than they seemed. This stripped-down, bare-bones, and mostly self-contained superhero adventure might be the most revolutionary thing the series could do at this point. That probably says more about the state of these movies, of course, but even looking at co-writer/director Julius Onah's superhero political thriller on its own terms, the film is fine enough in doing what it sets out to do. If we're all basically grading entries in this franchise on the curve of them being nothing to little more than comic-book fun, this installment meets those basic requirements at least, too. For some, it will also be the first opportunity to see a new Captain America in action, and that's worth something. Anthony Mackie's Sam Wilson, previously the Falcon, takes over from his super-serum-powered predecessor, following way too much to recap in a review. After all, that would mean having to describe the events of the first three Captain America movies, those last two revolving around the Avengers, and an entire TV miniseries in which Sam wrestled with the burden of inheriting the star-emblazoned shield. Thankfully, the screenplay, written by four others (Rob Edwards, Malcolm Spellman, Dalan Musson, and Peter Glanz) apart from the director, throws us right into the action. That's the tradition of comic books, which could have long histories of issue-spanning and hero-crossover events but knew each new book could be the first one someone was going to read or had read in a while. There's plenty of back story from the previous movies and the new Cap's TV series at play here, but the script is smart enough to catch everyone up with the fundamentals as those elements arise within the narrative."
