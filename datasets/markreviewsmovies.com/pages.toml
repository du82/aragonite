["http://www.markreviewsmovies.com/reviews/T/timestalker.htm"]
title = "TIMESTALKER - Mark Reviews Movies"
full_description = "The tone of Timestalker exists somewhere between comedy and sincerity, or better, it all depends on what mood writer/director Alice Lowe wants to create at any given moment. The story here is suited to either approach, to be sure. It follows a woman or, more accurately, her consciousness/soul over the course of several centuries, as her reincarnated forms keep falling and/or settling for the wrong men at different periods of history. This is, admittedly, kind of amusing, especially since the various incarnations of poor Agnes (Lowe) have a bad habit of putting those men above her own happiness, her own desires, and her very life. Agnes dies a lot here, almost always while trying to protect or save various versions of the same guy. It might seem romantic, except that the man in question has almost no interest in her no matter the era in which the two find themselves. That man is Alex (Aneurin Barnard), who exists, at assorted times, as a sectarian prophet, a highway robber, and a rock star. In every period, Alex wants to be famous, and in every one, Agnes is either the only one who notices him or, as his celebrity grows with each reincarnation, the one who believes to adore and admire him the most. That central joke certainly holds some promise, because the whole conceit takes on levels of absurdity and tragedy as these several Agneses keep going through the same motions over and over again. Each one also suspects that something might be amiss with her feelings for the guy and with the sinking notion that she is doomed for loving him. People want what they want and love whom they love, though, and within the schematic of Lowe's screenplay, that is equal parts absurd and tragic. The problem, beyond the tonal shifts between the comedic and the existentially dire, is that the gag quickly becomes repetitive. Lowe has an intriguing premise in mind, but its execution is so shallow that it stops being funny and never quite offers much insight or actual variety within the time-spanning narrative."
