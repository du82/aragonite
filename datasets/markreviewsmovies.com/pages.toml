["http://www.markreviewsmovies.com/reviews/M/monkey.htm"]
title = "THE MONKEY - Mark Reviews Movies"
full_description = "Cast: Theo James, Tatiana Maslany, Christian Convery, Colin O'Brien, Elijah Wood, Rohan Campbell, Sarah Levy, Osgood Perkins, Tess Degenstein, Danica Dreyer, Adam Scott MPAA Rating: (for strong bloody violent content, gore, language throughout and some sexual references) The filmmaking of Osgood Perkins might seem too formally precise for him to make a comedy, but here's The Monkey, which is genuinely funny in a demented, morbid, and horrific sort of way. It's an expansion/riff on a Stephen King short story, which wasn't going for laughs, but Perkins has found them anyway. In retrospect, playing this material as comedy makes almost too much sense. For those who don't know the source material, it involves a toy monkey�the kind that would bang a pair of cymbals when wound up with a key in its back. Every time it would clang those percussion instruments, someone or something would die�or, at least, that's what the protagonist believed. It's not meant to be funny, of course, but if one takes the premise seriously and draws it out to some more considerable length, it would probably seem pretty silly. Perkins realizes that and simply transforms the whole thing into a farce about fate, fathers, and, most importantly, flesh being pierced, ripped, burned, demolished, exploded, and otherwise destroyed. The deaths here and so gory and so over-the-top that one doesn't know whether to be disgusted or to laugh. Perkins' philosophy seems to be that both should be the appropriate reaction. The story begins with a prologue that will probably sound like the setup to a joke. A commercial airline pilot (played by a barely recognizable Adam Scott) walks into a pawn shop with a toy monkey. He's desperate to get rid of the thing, although the store owner doesn't seem particularly interested in the toy or too worried about the fact that the pilot is covered in blood (It's not his, the pilot insists, as if that makes it better). Those who know what's in store from the King tale might notice a slew of very sharp objects in the shop, and that's part of the warped game Perkins plays here. When you know a violent death is inevitable, everything in the background starts to look like an instrument of doom."
