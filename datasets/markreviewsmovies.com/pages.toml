["http://www.markreviewsmovies.com/reviews/N/noaddress.htm"]
title = "NO ADDRESS - Mark Reviews Movies"
full_description = "Cast: Isabella Ferreira, William Baldwin, Lucas Jade Zumann, Xander Berkeley, Kristanna Loken, Ashanti, Patricia Velasquez, Beverly D'Angelo Just as there's not one reason for homelessness, there's not a single solution to the problem. Don't tell that to the people behind No Address, which is a well-meaning but wholly na�ve attempt to dramatize, not only a single community of the unhoused in an anonymous city in the United States, but also some very particular answer to the problem more generally. For the most part, though, the movie almost seems to believe that a person's belief should be enough. Yes, the filmmakers have a religious angle going here, since every answer to the characters' problems�well, the ones who survive�rests in an overtly Christian organization within the story. Surely, groups like this one must do good work in many cases, so it's not the religious affiliation that's the issue. No, it goes deeper than that for this movie. For one thing, the movie has an almost romanticized perspective on homeless status, as odd as that may sound. It's odder seeing it in practice in this movie, as the characters form a tight-knit family (and talk about it at every available moment), find themselves going out of their way to stay without a home in certain cases, and seem more productive and happier in this particular state of uncertainty. For that matter, the screenplay by director Julia Verdin and James J. Papa actually gives us the beginnings of a literal romance between two of the main characters�one that's only possible because they're both forced out of troubling home lives. The central character of the interconnected cast, perhaps, is Lauren (Isabella Ferreira), whom we meet in a prologue showing her as a kid. Her mother dies, leaving her an orphan and putting her into the foster care system. On the day of her high school graduation, Lauren returns to her current foster home to find all of her possessions in garbage bags on the front porch. The foster family has kicked her out, because, as a disembodied voice from inside the house yells, they won't be receiving any money from the system for her."
