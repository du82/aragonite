["http://www.markreviewsmovies.com/reviews/R/riffraff-2025.htm"]
title = "RIFF RAFF (2025) - Mark Reviews Movies"
full_description = "Cast: Ed Harris, Miles J. Harvey, Lewis Pullman, Gabrielle Union, Bill Murray, Pete Davidson, Jennifer Coolidge, Emanuela Postacchini, Michael Angelo Covino, P.J. Byrne, Brooke Dillman The characters in Riff Raff come first, which would seem a benefit. The problem, though, is that the characters of John Pollono's screenplay never feel authentic, and there are so many of them that the degree of inauthenticity here becomes overwhelming. Director Dito Montiel has assembled a very solid cast, at least, so there is a sense of promise as each new character is introduced. With so many characters played by just as many notable actors, the odds would seem that one of them might stand out among the crowd and apart from the familiar plot that does emerge. That kind of bet should be a safe one. Instead, the central gimmick appears to be that every one of these characters has to possess only one defining characteristic and at least one level of eccentricity to go with it. We could start with any of them, perhaps, especially since the story itself doesn't exactly have a single protagonist to propel the plot. Maybe Pollono's story would have been helped by a trickier or showier or more convoluted narrative, if only so that these characters could fit better within it or come across as more grounded than everything surrounding them. Let's begin, then, with the character whose narration opens the movie. He's DJ (Miles J. Harvey), a teenager whom we first meet talking about family and how everything that will eventually go wrong in the story has to do with family. It must be bad, since our first glimpse of the teen, a smart kid with an interest in science and making topographical maps, is of him pointing a gun at someone's head. That man is Vincent (Ed Harris), DJ's adoptive father and the second husband of the teenager's mother Sandy (Gabrielle Union). This raises a few questions about the relationship between Vincent and Sandy, who have quite the age gap and deep differences in personality, and surely, Pollono seems to believe that he answers all of those curiosities by pointing out that Sandy's first husband, DJ's father, was a philanderer who died in a car accident while with another woman. That certainly explains why a woman like Sandy is single, without addressing a single component about how or why a guy like Vincent would be next in line."
