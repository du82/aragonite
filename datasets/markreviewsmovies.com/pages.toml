["http://www.markreviewsmovies.com/reviews/C/coldwallet.htm"]
title = "COLD WALLET - Mark Reviews Movies"
full_description = '''John Hibey's screenplay for Cold Wallet seems to know what it's talking about when it comes the world of cryptocurrency. It's filled with technical jargon and the parlance of online discussions on the subject, and we believe that its main characters have become so invested in their digital investments that they can't see an obvious joke of a scam when it's staring them right in the face. They've invested in a new type of cryptocurrency that only promises a great return on the real or digital money they're putting into it. If they had some understanding of the basics and history of economics, they might realize that putting a lot into Tulips isn't the best idea. Hibey and director Cutter Hodierne are a bit cheeky like that on occasion in what becomes a fairly standard thriller about questionable people doing questionable things. Indeed, the cryptocurrency at the center of the plot is called "Tulip," and after its value drops to zero and the online exchange service for the currency shuts down, our trio of na�ve but still wronged protagonists meet in an empty parking lot to come up with a plan. That they're meeting near the shuttered storefronts of a couple of businesses, which became big news when online traders tried to boost the stock prices of those companies, can't be missed. The movie's winkingly cynical edge, though, remains in the background of this story, which has a clever and pointed premise but can't follow through on it. Basically, it revolves around our three anti-heroes deciding to take back the money they lost by holding the cryptocurrency creator hostage and forcing him to give back all the real funds he stole. There are several ways Hibey's screenplay could have proceeded from that idea, and the writer seems to think that trying most of them is the best approach. It's a takedown of the shady promises and practices of an unregulated crypto market on one hand and a comedic take on a hostage thriller, in which the abductors aren't exactly up to that task, on the other. The movie tries to give itself a few other hands, too, while trying to be a legitimate thriller and also a serious look at desperate people pushed beyond their moral limits.'''
year_published = 2025
