["http://www.markreviewsmovies.com/reviews/O/oldguy.htm"]
title = "OLD GUY - Mark Reviews Movies"
full_description = "Cast: Christoph Waltz, Lucy Liu, Cooper Hoffman, Ryan McParland, Ann Akinjirin, Jason Done, Tpmy Hirst. Kate Katzman, Conor Mullen, Rory Mullen The three main actors in Old Guy are too good for it. The filmmakers should be grateful that the trio agreed to something so utterly predictable and generic. Making Christoph Waltz an aging hit man, desperately trying to prove his worth while his body undermines his attempts, is a fine idea, to be sure. Casting Cooper Hoffman, a young actor who's showing considerable promise (not to mention an increasing resemblance to his late, great father), as the Waltz character's reckless trainee is a smart move, too. Director Simon West also has Lucy Liu on board for this movie, and one really wishes somebody had given Greg Johnson's screenplay a once-over as soon as she was cast as the potential love interest for the older assassin. Instead, Liu, who can bring so much cutting intelligence to a role, just has to hang around with little to do until the movie decides the likely-romantic-partner angle is finally worth paying off. It's such a waste. Look, Waltz and Hoffman are underutilized here, too, as they bicker and banter between scenes of mob politics and killings that go wrong. The obvious joke of the movie is that Waltz's Danny Dolinski is a hitman from an older time, when professional killers had some decorum and, as odd as it may seem, sense of morality. He doesn't kill innocent people, even if they get in the way of his assignment, because to do so would be uncouth. Meanwhile, Hoffman's Wihlborg is a rising star, apparently, in the underworld of contract murder, but he has a bad habit of killing bystanders on every job he has taken. The innocent casualties, in fact, exceed the actual number of assignments he has performed. The two men are going to clash, beyond the fact that Danny's boss is clearly trying to arrange for Wihlborg to become his replacement. In theory, the setup is worthwhile, especially because the filmmakers were smart or lucky enough to land the cast they have for this material. The big problem, beyond the fact that the intriguing characters simply become stock ones and pawns for the plotting, is that neither Johnson nor West seem to know what to actually do with this premise."
