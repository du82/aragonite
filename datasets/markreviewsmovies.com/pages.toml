["http://www.markreviewsmovies.com/reviews/C/cleaner-2025.htm"]
title = "CLEANER - Mark Reviews Movies"
full_description = "After everyone does so many variations on a tried-and-sometimes-true formula, it's probably inevitable that we'd find ourselves back at where it began. Simon Uttley's screenplay for Cleaner takes the now-standard plot of a one-person army facing up against a team of criminals in a single location, but this time, it's set in a skyscraper�again. There are a few twists to that familiar setup, though, and they make a bit of difference in this clever riff on material that could have attempted to coast on its premise and hoped for the best. No, Uttley and director Martin Campbell have a few tricks up their sleeves, and it's just enough for this film to stand on its own merits and without too much harping on about how we've definitely seen this story before. The first distinction is its protagonist, a former military woman named Joey, played by Daisy Ridley with a cool charm that gradually transforms into a hardened sense of determination. It must be tough for an actor to come out the other end of some of the biggest movies in the world and try to find some way not to be pigeonholed by that, but Ridley keeps doing interesting things with her still-blossoming career. Here, her performance makes a good case that she could be an action star, but let's not start trying to force her into a slightly different box than the one she's clearly working to put on a shelf. Her Joey, who has a childhood love�or, better, means of escaping troubling situations�for heights, works as a window cleaner at a fancy skyrise in the heart of London. It's home to residential apartments and the offices of an energy company, but none of that means much to Joey. She just needs the job to survive and to spend the day hanging from the side of the building, dozens of floors above the street, in order to clear her head of all the problems and complications facing her. The suspense starts almost immediately upon Joey's late arrival at work. Then again, that might just be a healthy fear of heights talking, because the character, unknown to her, will spend probably a bit more than half of the film outside the skyscraper�either connected to a line tied to the roof or in an automated cradle that rises and descends like an open-air elevator. Obviously, most of these sights are achieved with visual effects, considering how much peril Joey faces while stuck on the outside of the building as chaos erupts inside it. They're convincing, though�dizzyingly so at times."
year_published = 2025
