["http://www.markreviewsmovies.com/reviews/E/everyoneisgoingtodie.htm"]
title = "EVERYONE IS GOING TO DIE - Mark Reviews Movies"
full_description = "The first act of Everyone Is Going to Die is unsettling for the right reasons. The second act is worrisome for some confusing ones, and the third is disturbing on account of the terrible implications of what happens and is revealed in writer/director Craig Tuohy's home-invasion thriller. The movie attempts to take a big swing in its themes of trauma and revenge, but it somehow smacks itself right in the face. Until then, the movie is admirably simple, to-the-point, and filled with some dread. The story focuses on Daniel (Brad Moore), a man who's living it up in his remote, two-story house in the countryside of England. He clearly has money and spends it on all sorts of pleasures, from booze, to recreational drugs, and, presumably, women on occasion. His introduction sees him irritated with the presence of the woman currently sleeping in his bed. He forgets and doesn't seem to notice that she can't leave until he unties her from his bedpost. That's Daniel, apparently, in a nutshell, and the rest of what we learn before the home invaders arrive only cements that initial impression. He's divorced, has a teenage daughter whom he only occasionally sees, and is determined to make a multi-million-dollar real estate deal go through with a business partner. This weekend, though, is dedicated to Daniel's daughter Imogen (Gledisa Arthur), whose 16th birthday has arrived and who's staying with her father to celebrate. Before we learn too much about their relationship, however, Imogen spots a person standing in the garden. As Daniel tells the individual to leave and threatens to call the cops, the trespasser turns, revealing a face covered by deformed mask, fashioned after the traditional tragedy one of theater. That's when someone else, wearing a matching comedy mask, sneaks in behind Daniel and Imogen. She has a shotgun. The two intruders, a pair of women appropriately referred to as Comedy (Jaime Winstone) and Tragedy (Chiara D'Anna), do pretty much what we expect from outset. They're not here to steal anything from Daniel, which they prove when Comedy smashes a smartwatch he offers them to leave with something of value. They're not here to kill the father or daughter, either�or, at least, not right away. Indeed, Comedy seems to have some lesson to teach the man, as she scolds him for forgetting to get his daughter a birthday cake and makes Imogen watch as the invaders dump out her father's box of toys for his sexual proclivities."
