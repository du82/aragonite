["http://www.markreviewsmovies.com/reviews/Q/quietones-2025.htm"]
title = "THE QUIET ONES (2025) - Mark Reviews Movies"
full_description = '''Cast: Gustav Giese, Reda Kateb, Amanda Colin, Christopher Wagelin, Jens Hult�n, Granit Rushiti, Amin Ahmed, Camilla Lau The Quiet Ones dramatizes the most substantial heist in the history of Denmark, carried out by more than two dozen men from within the country and beyond. Director Frederik Louis Hvild's movie, however, opens with far less successful and much deadlier one. Despite that early and unsettling glimpse at the potential human toll of such actions, the rest of the movie is so caught up in the particulars and personalities of those who will commit the big robbery that it loses any sense of the likely or real consequences of the deed. The movie doesn't need to do that, of course, but the opening scene of Anders Frithiof August's screenplay is so strikingly haunting that its impact on what follows here cannot be ignored. Hvild captures that failed robbery in a one-take, seen entirely inside the armored truck that a group of men, wearing masks and armed with automatic weapons and explosives, try to infilitrate. The perspective belongs entirely to the two guards inside the truck, with one talking about her troubled relationship with her teenage daughter and the other excited to be on his first day on the job. After the would-be thieves block the truck's escape with a pair of cars and threaten to blow up the vehicle, the new guy gets out, leaving his partner exposed, and with the sounds of police sirens approaching, the robbers execute the rookie as he tries to escape and the woman as she pleads for her life. It's difficult to shake that scene, but the filmmakers go ahead as if none of it matters. It certainly doesn't to Slimani (Reda Kateb), known as "the Moroccan" within his criminal circle, who waits about a year to go about planning another robbery. He enlists Kasper (Gustav Giese), a former boxer who's trying to return to the ring after some kind of setback. Kasper has a wife (played by Camilla Lau) and young daughter, but while his motive for eventually and begrudgingly accepting a spot on Slimani's team of thieves is to better the lives of his family, it's telling how little the wife and child actually matter to the story.'''
