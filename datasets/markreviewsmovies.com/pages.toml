["http://www.markreviewsmovies.com/reviews/I/invader-2025.htm"]
title = "INVADER - Mark Reviews Movies"
full_description = "The likely subtext of Invader suggests a subversive take on a go-to thriller conceit. Writer/director Mickey Keating's movie is about, as the title tells us, a home invasion, and there's clearly something to the point that the homeowners and a relative trying to figure out what has happened to her family members are of a Hispanic background. Meanwhile, the eponymous invader, played by an uncredited Joe Swanberg, is a plain, anonymous white guy who violently takes over the house. There are some similarly loaded moments throughout the movie (Note, for example, which U.S. President is on a TV in the backdrop of one scene and the context of when he's talking), but the entire thing, really, is loaded with a pretty clear political idea. If only the movie trusted that more to actually make it part of the actual text of the story, Keating might have been on to something. Instead, the filmmaker teases us with those ideas, while also delaying and evading the actual thriller elements of his movie. It's one thing for a filmmaker to hold back on what really is meant to be said within a movie. It's entirely another thing for a movie to hold back on the sole purpose of its existence. The story here opens with that invader breaking into an apartment and proceeding to break everything he can within that space. This guy isn't motivated by money or stealing anything of value within this home. No, he's focused entirely on destruction�closing a door, for example, just so he can slam his body into it and dislodge it from its hinges. He's sending a message, although what that might be for his victims is left something of a mystery. Based on the stuff we can gather from the later crime, it might simply be one of violently taking control over something he believes to be his or stating in no uncertain terms that he doesn't see these people as welcome in this place. Really, though, the invader becomes nothing more than a creepily anonymous and violently determined villain. We never learn his name or anything else about him, and his voice is only heard in ferocious screams or some put-upon na�vet� near the end of the movie. If he's meant to represent what seems to be obvious from some specific details of the plot and other characters, Keating refuses to put that up front or, for that matter, even to confirm it by way of his actions, which are as broad and predictable as the story itself."
