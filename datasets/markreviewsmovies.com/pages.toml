["http://www.markreviewsmovies.com/reviews/U/universallanguage.htm"]
title = "UNIVERSAL LANGUAGE - Mark Reviews Movies"
full_description = "Cast: Matthew Rankin, Pirouz Nemati, Rojina Esmaeili, Sobhan Javadi, Mani Soleymanlou, Danielle Fichaud If there is a universal language in Universal Language, it might be melancholy, but then again, there are characters here who are perfectly content. Maybe it's the general absurdity of life, because here's a story that's about seemingly unconnected people connecting in strangely unexpected ways�including, but not limited to, a bill of currency frozen in a block of ice, a glasses-stealing turkey, and a tour guide whose sights of interest include a briefcase that has been sitting on the same bus bench for almost four decades. Then again, co-writer/director Matthew Rankin's film is also quite grounded in everyday concerns, such as wanting or needing that frozen bill, and in how there is meaning in these assorted connections. Trying to place the mood of this film is almost as difficult as attempting to explain its story, which subtly weaves through time and features several characters who seem like jokes, only for some of them and their actions to take the spotlight by the tale's end. This is not a criticism of the film, of course, because that confusion and the sense of surprise is clearly built into this narrative. It wants us to engage with these characters, this setting, and the nebulous feeling the story creates beyond some fanciful comedy about life in modern-day Winnipeg. It's funny enough that the underlying sincerity of this material is sneaky and becomes fairly poignant by the end. The story does begin in Winnipeg, although it will move to somewhere in Quebec and to a different time period without us even really noticing the shift. We meet a schoolteacher named M. Bilodeau (Mani Soleymanlou), who has returned from a trip away from the city to try to control a disorderly group of eclectic students. All of them have dreams, whether that be to become a fashion photographer (That kid is dressed like he belongs in the 1960s and carries a camera everywhere) or to become a famous comedian (That child is dressed like Groucho Marx). The teacher, when he's not shooting down their ambitions, only wishes his class would disrupt learning and interrupt him in French."
