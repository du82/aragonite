["http://www.markreviewsmovies.com/reviews/Y/youmeandher.htm"]
title = "YOU, ME & HER - Mark Reviews Movies"
full_description = "Cast: Selina Ringel, Ritesh Rajan, Sydney Park, Graham Sibley, Anna Campbell, Roberto Aguire, Marianna Burelli, Fiorella Vescovi Garc�a, Gerry Bednob, Hern�n Mendoza You, Me & Her is funny and insightful when it isn't specifically trying to be those things. When the movie does blatantly go for comedy and wisdom, it's a strained effort. The setup is simple, familiar stuff at first. It revolves around Mags (Selina Ringel) and Ash (Ritesh Rajan), who have been married for several years, had a kid about a year or so ago, and are preparing for their first vacation alone since becoming parents. The relationship isn't what it used to be, if the opening combination of Ash's trip to the bathroom to watch porn on his phone and Mags' frustration that her husband didn't even ask if she was interested in having sex is any indication. The movie, written by Ringel and directed by Dan Levy Dagerman (her husband, by the way, which is at least superficially relevant given the material), feels authentic in such little moments but also a bit distancing in its more significant details. It's easy enough to relate to the gap that has formed between the lead characters, as professional problems and a difficulty communicating and the struggles of raising a first child make it difficult for the two to find time for themselves alone and as a couple. Then again, Mags is apparently wealthy, with a cushy job working for her father's financial firm. Sure, money doesn't solve every problem, but it's na�ve or disingenuous to suggest that it doesn't help quite a bit. It's tough, for example, to see new parenthood as much of a strain on these two when they have an au pair (played by Fiorella Vescovi Garcia) doing most of the work of caring for and tending to their young son. The well-to-do backdrop here is definitely a double-edged sword, because, while it does create that odd distance between us and the characters, it does give Ash, who's trying to get his cannabis-growing business off the ground, a bit more depth than just some stereotypically slacker husband. He feels insufficient as a marital and parenting partner, simply because Mags can afford everything she and her family could ever want or need."
