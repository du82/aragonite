["http://www.markreviewsmovies.com/reviews/E/exhusbands.htm"]
title = "EX-HUSBANDS - Mark Reviews Movies"
full_description = "Cast: Griffin Dunne, James Norton, Miles Heizer, Rosanna Arquette, Richard Benjamin, Eisa Davis, John Ventimiglia, Pedro Fontaine, Lou Taylor Pucci, Echo Kellum, Ian Owens, Simon Van Buyten, Nate Mann, Rachel Zeiger-Haag Three generations of men, all of them with some issues about romance or marriage or commitment or something along those lines, figure into the story of Ex-Husbands. Writer/director Noah Pritzker's narrative doesn't have much of a through line, apart from its weekend-getaway and sitcom-like miscommunication setup, but that feels quite appropriate for these particular characters. They're all aimlessly trying to figure out things about themselves and why their lives are currently such a mess. The film matches that energy. Take our central character Peter Pearce (Griffin Dunne), a man in his 60s who learns that his father Simon (Richard Benjamin) has decided it's time for a divorce from Peter's mother�the father's wife of 65 years. Even after all that time, Simon is somehow convinced that there are better things and true love ahead of him, believing he somehow has another 20 or 30 years of life left in him. Peter points out that his father would 110 if his most generous estimate is accurate, and that level of essentially delusional stubbornness pretty much gets at the core or, at least, part of all of the main characters here. The other two are Peter's adult sons with Maria (Rosanna Arquette), his own wife of 35 years, who decides its time for them to divorce a few years after Simon's announcement and the death of Peter's mother. Peter's own slightly delusional belief is that there's still a chance for a reconciliation with Maria, who already has a divorce settlement arranged with her attorney and keeps asking Peter to go over it. Sure, we've already entered clich�d and/or jokey territory with this story, but just as some of the best jokes have some degree of truth in them, some clich�s exist because they're true, too. Sometimes, they're also worth laughing at, as is occasionally the case here."
