["http://www.markreviewsmovies.com/reviews/S/slothstory.htm"]
title = "A SLOTH STORY - Mark Reviews Movies"
full_description = "The members of the sloth family at the center of A Sloth Story are no stereotypical sloths. They are fast, except when it comes to cooking, and work hard, running a restaurant in an out-of-the-way locale in Australia. They're an interesting bunch, and if director Tania Vincent, Erica Harrison, and Ryan Greaves' screenplay actually focused on them instead of a generic plot, this animated movie might have been on to something. We do get to know Laura (voice of Teo Vergara), the young daughter of the three-toed clan, and her family a bit before that plot get in motion. The characterizations are, unfortunately, about as shaky as the intentionally jittery animation, which actually gives the movie a bit of a personality�with its stop-and-go movement and punctuating motion lines. It's a shame that can't be said of the rest of the material. After finding success in a remote location among other animals who like to take things a bit more slowly, Laura and the rest end up having to abandon their restaurant and home after a sudden, devastating destroys the structure. Father Luis (voice of Ben Gorro�o) constructs a makeshift food truck from the ruins, with the big plan of driving to the city, finding a new piece of property, and running a new restaurant using all of their familiar kitchenware and appliances. Laura's mother Gabriella (voice of Olivia V�squez) is hesitant, because she's not a fan of change and worries that the sloths aren't prepared for the fast pace of Sanctuary City. That premise alone is somewhat promising, if only because it suggests that there could be more to these characters, who also include Laura's older brother Mani (voice of Facundo Herrera), who's not nearly as ambitious as his sister and a bit of slacker in his own right. Once they arrive in the bustling metropolis, though, the script mostly comes to a halt in letting us see these characters as they are and try to adapt to a new lifestyle. Instead, we're introduced to a routine villain. She's a cheetah named Dotti Pace (voice of Leslie Jones), the head of a chain of fast-food restaurants in the city. That character and her enterprise offer some broad satire about the industry, from the fact that Zoom Fuel franchises only have two menu items (fired directly into the mouths of customers), to Dotti's philosophy that food doesn't need to taste good as long as it provides a boost of energy, and to, well, not much else, actually."
