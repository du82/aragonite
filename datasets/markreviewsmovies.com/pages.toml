["http://www.markreviewsmovies.com/reviews/I/iloveyouforever.htm"]
title = "I LOVE YOU FOREVER - Mark Reviews Movies"
full_description = "On paper, Finn (Ray Nicholson) is the perfect sort of boyfriend. He has a well-paying job as a TV journalist, allowing him a luxurious lifestyle, and as his work requires, he seems to really listen to and engage with other people, especially those close to him. He's smart and funny and handsome, as well as affectionate and attentive and awfully charming. I Love You Forever presents a guy who seems too good to be true to Mackenize (Sofia Black-D'Elia), the lovelorn protagonist of what looks like to be a typical romantic comedy. That's because it is all phony in increasingly uncomfortable and distressing ways. The film, co-written and co-directed by Cazzie David and Elisa Kalani, is sort of a takedown of the high expectations established by decades of seemingly innocent romantic comedies. Here's the flip side, essentially, of the traditional male lead of such a story�the one who is the perfect sort of boyfriend, because he's romantic in all the right ways or because whatever superficial problems he might possess in his life are hiding just how ideal a mate he could be. Finn's character suggests that those superficial issues aren't just skin-deep, while the kind of actions so often romanticized in romantic comedies would probably point to unhealthy behavior. What's fascinating about the film, a feature debut for both of its filmmakers, is how the tone here shifts in subtle ways, until it's difficult to remember just how breezily and light-heartedly the tale begins. We meet Mackenzie, a law student who might like a serious or serious-ish romantic relationship if one came along. At the moment, she's in a relationship of sexual convenience with Jake (Raymond Cham Jr.), who isn't looking for any kind of commitment and can barely commit an ounce of attention to Mackenzie whenever he wants her to come over to his place. Everything changes for her, though, when she meets Finn, in a genuine meet-cute from your average romantic comedy, at a birthday outing for her roommate Ally (David). They almost bump into each other just outside the restroom at a club, and soon enough, Finn has found his way over to Mackenzie again. They talk in an easy and amusing and clearly loaded sort of way, and after Mackenzie and Ally and their mutual friend Lucas (Jon Rudnitsky) realize that Finn is legitimate dating material, Mackenzie is quick to accept a dinner date with the guy."
