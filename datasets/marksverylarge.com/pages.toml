["https://www.marksverylarge.com/1998/10/10/37"]
title = "37. “Lemmings” Video  |  Mark's Very Large National Lampoon Site"
full_description = '''Q: I want to know if they ever released or plan to release a video of the “Lemmings” show on video. A: The most recent issue of National Lampoon carries an ad for a videotape of Lemmings for $49.95. (Thanks to John Hyde for pointing this out to me.) (Update 3/2001): They also appear to be selling this tape on the official National Lampoon site. Update: Naturally, here in the future, you can watch the whole thing on YouTube for free. Tapes? Seriously? Pirated DVDs are frequently offered on eBay. Caveat emptor: the first one I bought stalled every 2.5 minutes. When the seller refused to give me a refund, I returned the disc and packaging to him drilled full of holes and cut into several pieces. I eventually found a functioning copy with good picture and sound; "good," considering what a bargain basement production the video was in the first place. Original material (excluding quoted material) © 1997-2024 Mark Simonson. Mark's Very Large National Lampoon Site is not affiliated with National Lampoon or National Lampoon Inc. Click here for the real thing.'''
