["https://www.marksverylarge.com/2010/09/15/for-fans"]
title = "My Skype Call with Rick Meyerowitz  |  Mark's Very Large National Lampoon Site"
full_description = "For fans of the National Lampoon, Rick Meyerowitz‘s new book, Drunk Stoned Brilliant Dead: The Writers and Artists Who Made the National Lampoon Insanely Great, is easily the biggest thing to happen in the last 30 years. It’s a large-format book with over 300 pages of lavishly reproduced material, mainly from the first decade of the magazine, and dozens of essays and stories written by former Lampoon writers and artists. This is the book I’ve long wished someone would write, and who better to do it than the artist who created the Mona Gorilla. I spoke to Rick last Friday, via Skype. It didn’t take much to get him talking about the book and about National Lampoon. I had a long list of questions. I managed to ask only a few of them. Mostly I just sat back and said “yeah” every fifteen seconds and he somehow answered them all anyway…. Rick: My partner, Maira Kalman, and I were just at the printer picking up a print of our parody New York City subway map. I had this notion to replace every single name on the map with the name of a food. We wound up with “The New York City Sub-Culinary Map”. The New Yorker‘s online store is going to sell it. I was telling Sean Kelly about it the other day, and he said, you would have done this for the Lampoon if there was still a Lampoon. I said, yeah, but they wouldn’t have paid. All these guys I’ve spoken to [for the book]—Ted Mann, Brian McConnachie, John Weidman—if there was a Lampoon, that would be home for their ideas. But that doesn’t mean they haven’t had Lampoon ideas. We have to water them down to publish them. You look at The New Yorker and see when they run the occasional Sam Gross cartoon how funny it is, but it’s not a Lampoon idea. His real home was at the National Lampoon. Rick: (laughs) I spoke at the Sun Valley writers’ festival a couple of weeks ago, in Idaho. I gave a talk about the book and I discovered that they’re not going to laugh a whole lot over Chris Cerf’s rather intellectual script of the “Constitutional Comics”. But when I showed that tampon cartoon by Sam Gross, people screamed their heads off. They fell out of their chairs. I loved that. And I thought, put more Sam Gross and Charlie Rodrigues cartoons in my talk."
