full_description = "“COVER: Winner of this month’s Kwicky Kover Kontest is Rick “By-the-Numbers” Meyerowitz. Using a split-nib garden trowel and melted Crayola, Rick masterfully evokes that sense of elemental crudity that covers us, like Saran Wrap, from sea to shining sea.” Editorial, By Doug KenneyIt would seem Americans have cornered the market on bad taste, given its successes in Vietnam, but vulgarity knows no national boundarys Horrorscope, Text uncredited [Doug Kenney]; Illustration by Gail BurwenPredictions of the futures of various famous people supposedly based on tarot cards. Mrs. Agnew’s Diary, Uncredited [Doug Kenney]Judy and Spiggy hang out at a party thrown by Pat and Dick in the Green Room. I am Curious (Big Yaller), By Henry Beard; Illustration by B. JohannsenJuvenile classics with sex scenes added to to promote reading. Take Me Out to the War Game, By Gerald Aster; Illustration by B. JohannsenPlay-by-play action on a Vietnam battlefield in the style of a sports broadcast. The Liz ‘n’ Dick Gift Catalog, By Douglas Kenney; Collages by Tom DimondA catalog of tacky gifts made from priceless works of art sold at extremely high prices. Nixon’s Dream Supreme Court, By Nicholas Fish [Henry Beard]A list of dubious jurors supposedly found on a scrap of paper accidentally left by Nixon at the Lincoln Memorial. The World’s 7 Worst Restaurants, By Mark Smith (Photography by Fred Schultze)A critical survey featuring some of the most disgusting food photography ever published. Ye Olde Colonial Inne Menu, By Mark Smith [?]; Illustrations by Gail BurwenUnremarkable dining fare presented in pseudo-colonial style. Il Detergenta, By Henry Beard; Illustration by Gail BurwenA thoroughly confused soap opera (peppered with ads for alarmingly hazardous household cleaners) in which the characters spend all their time trying to sort out the plot. Pass the Arsenic, S’il Vous Plait, By Richard Alsop; Illustration by Charles E. White IIIThe writings of Emily Post applied to an absurdly tasteless situation."
