["https://www.marksverylarge.com/page/2"]
title = "Mark's Very Large National Lampoon Site"
full_description = "If you look at the site navigation to the right (or the “Mobile-Friendly Menu” above for you smartphone users), you’ll see a new category listed: Bookshelf. This will provide quick access to anything I have or will post here having to do with books by or about National Lampoon contributors. Currently, it will only show what I’ve written about so far, which I admit is a bit random and incomplete. But I plan to add listings to all the books I know about and where to get them (if they are still in print). Update 1/21/24: I’ve reworked the idea for Bookshelf. It’s now a list of books by staff and contributors not published by National Lampoon, plus books about National Lampoon and/or people who worked there. More info here. This is something I’ve personally been waiting for for a long time. Poor Helpless Comics! The Cartoons (and More) of Ed Subitzky is a newly published collection of comics (and more) by Ed Subitzky. It’s fairly large format, soft cover, 184 pages. Subitzky’s drawing style is minimal. As he says in the book, the characters are almost not there. It’s all about the words and what the characters are doing and, above all, the humor. The book contains what seems like most of Subitzky’s cartoons and writing from National Lampoon, where he was a contributor for over two decades, starting in the April 1972 (“25th Anniversary”) issue with “Anti-Comics!”, a strip in which the words are the characters and the speech balloons are filled with drawings of people and places. It also contains some of his post-Lampoon comics, which have appeared in The New York Times and most recently The American Bystander. Subitzky’s comic strips often had a sort of “meta” angle to them—they were often about the form of the comic strip itself, with strips such as “Moebius Strip Comics!”, “Eight-Way Comics!”, and “Crossword Puzzle Comics!”—where you had to fill in the word balloons based on a list of clues—or “Background Music Comics!” which included a musical score which you were supposed to play on a piano or other instrument as you read."
