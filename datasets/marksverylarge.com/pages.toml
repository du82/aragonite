["https://www.marksverylarge.com/staff-contributors/henry-n-beard"]
title = "Henry N. Beard  |  Mark's Very Large National Lampoon Site"
full_description = "One of the founders of the National Lampoon, along with Doug Kenney and Rob Hoffmann. Prior to NatLamp, Beard had collaborated with Kenney at the Harvard Lampoon during the late ’60s, producing nationally distributed parodies of Life and Time magazines and a book-length parody of The Lord of the Rings called Bored of the Rings. Beard was the calm center of the magazine, according to known sources, and was (still is) a master at parody. One of his favorite techniques was the reversed premise (for example: a “news” item about a vat of mercury tainted by tuna). Beard was responsible for the “News on the March” section, which really came into its own as the follies of the Nixon administration escalated to the Watergate scandal. Beard, Kenney, and Hoffmann had a 5-year buyout clause in their contract with NatLamp‘s publisher, 21st Century Communications. The three excercised the option when the time came, to the tune of $7-million divided among them. Kenney stayed on for another year, while Hoffmann had left in 1971. Inexplicably, Beard said his good-byes and walked out the door, never to return. After leaving NatLamp, Beard apparently took some time off. Then, in 1981, he began authoring and co-authoring humor books. Beard’s post-NatLamp writing is recognizable, but more mainstream. Of the over 30 titles he has produced, few could be considered political satire. Nonetheless, I can always count on anything he writes to put me in stitches. Note: “Hugo Flesch” is not a pseudonym used by Henry Beard, as I had previously stated on this page. Hugo Flesch is a real and talented writer who wrote a number of very funny articles for National Lampoon (sometimes collaborating with Beard) including such classics as “Chums In the Dark,” “Printout: The Magazine Written by Computers for Computers,” and “Does the Name Pavlov Ring a Bell?” I based my erroneous assertion on some admittedly thin circumstantial evidence in the way certain articles in the magazine were credited. It’s not my habit to make such bold, baseless assertions, but in this case, that’s exactly what I did. My apologies to Hugo, and also to his sister Abigail who brought this to my attention. —MS"
year_published = 2025
clearnet = "https://www.marksverylarge.com/staff-contributors/henry-n-beard"
