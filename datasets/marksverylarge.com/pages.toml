["https://www.marksverylarge.com/1998/03/27/11"]
title = "11. “Vacation ’58”  |  Mark's Very Large National Lampoon Site"
full_description = '''Q: I’ve been trying to convince my friends that “Vacation” started out as a short story in the magazine in the 70’s. What issue was that in? A: The story—which was indeed the basis for “National Lampoon’s Vacation”—was called “Vacation ’58” by John Hughes and first appeared in the September 1979 (Fall Potpourri) issue. It was also reprinted in the July 1983 (Vacation!) issue to promote the release of the movie. Yhea I have that problem too. In this age of TV and instant-direct-to-video movies, no one wants to believe anything ever appeared in print. Flash Bazbo Or that the story -- a vicious satire of Jean Shepherd -- was darker and funnier than the movie. I swear, there are two John Hugheses, and the one who wrote for NL died in a car accident before the guy who took his name started writing Molly Ringwald vehicles. i am too trying to find out what the original addition was called. i remember reading the story on a road trip. Any one know the the magazines's title which held this short story? In case it's not clear, the magazine was National Lampoon. The article was called "Vacation '58" and appeared in the September 1979 issue (of National Lampoon). Wow. Last comment 2008! The movie could not effectively convey the imagery and writing. For ex. when Clark forgets to put Aunt Edna's dog in the car. Original material (excluding quoted material) © 1997-2024 Mark Simonson. Mark's Very Large National Lampoon Site is not affiliated with National Lampoon or National Lampoon Inc. Click here for the real thing.'''
