["https://www.marksverylarge.com/bookshelf/if-you-dont-buy-this-book-well-kill-this-dog-life-laughs-love-death-at-national-lampoon"]
title = "If You Don’t Buy This Book, We’ll Kill This Dog! Life, Laughs, Love, & Death at National Lampoon  |  Mark's Very Large National Lampoon Site"
full_description = "Straight from the horse’s mouth, here is the most complete (as of 1994) account of the history of National Lampoon, written by its long-time publisher. Simmons has a tendency to ramble, but the material is so fascinating, in the end it doesn’t matter. Reading his account of the ill-fated take-over by actor Tim Matheson and Dan Grodnik and the subsequent sale of the magazine to J2 Communications is like watching a car accident in slow motion, with the survivors walking away with little more than the name plate. In addition to the magazine, other NatLamp enterprises (such as the stage shows, movies, and television shows) are covered in detail. Finally, the book contains anecdotes and personal sketches of virtually everyone associated with Lampoon, many of whom went on to much bigger things. Original material (excluding quoted material) © 1997-2024 Mark Simonson. Mark's Very Large National Lampoon Site is not affiliated with National Lampoon or National Lampoon Inc. Click here for the real thing."
