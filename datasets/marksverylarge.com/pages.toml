title = "32. “The Sunshine Room”  |  Mark's Very Large National Lampoon Site"
full_description = "Q: I was wondering if you knew in which issue the story “The Sunshine Room” (or it could be “Our Lady of St. Pistacio”) written by NatLamp editor Larry Sloman appeared. A: I looked, but couldn’t find it. Sloman became editor with the December ’84 issue and wrote for the magazine at least through the early ’90s. I checked issues back to ’77 and I didn’t see anything by him before he was editor. Sorry. (Know the answer to this question? Use the comments below and take a shot at it.) Original material (excluding quoted material) © 1997-2024 Mark Simonson. Mark's Very Large National Lampoon Site is not affiliated with National Lampoon or National Lampoon Inc. Click here for the real thing."
