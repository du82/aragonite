["https://www.marksverylarge.com/2006/08/16/josh-karp"]
title = "Interview: Josh Karp, Author of New Doug Kenney Book  |  Mark's Very Large National Lampoon Site"
full_description = "Josh Karp, author of “A Futile and Stupid Gesture: How Doug Kenney and National Lampoon Changed Comedy Forever,” graciously agreed to an interview. This is somewhat of a departure from my usual news items, which lately have been short and infrequent. So this is a pretty big deal. But then, I think this book is a pretty big deal. If you have any interest in Doug Kenney or National Lampoon, you will love this book. In my opinion, this is one of the best, if not the best, books on National Lampoon written yet. As promised, here is the interview. Josh: When I was 14, my dad got me a job in the mailroom of the law firm that represented his company. The guy who ran the mailroom had every Lampoon ever published and brought them to work. This was 1980, right around the time Doug died and somehow I read the Esquire article about him dying [Death of a Comic Genius, by Robert Sam Anson, August 1981], and it always stuck with me. So, 23 years later, when I was looking for my first book project, I thought, I can’t believe nobody did a book about this guy, or really about Lampoon, which was really the cornerstone of much of my worldview in many ways. Or at least my sense of humor. J: Some of my friend’s older brothers read it, so I’d seen it. But when I was 12, I saw Animal House, and then when I was 14, I spent the summer in the law firm mailroom, reading every single issue of the magazine. So, no, I wasn’t a regular reader during the 1970s. In fact, my single favorite Lampoon piece at that time (other than the High School Yearbook Parody) Was Ted Mann and Tod Carroll’s “O.C. and Stiggs.” which I thought was the funniest thing in the world when I was 20. M: I was amazed at the shear number of people you interviewed for the book. Were people reluctant or eager to talk to you? J: Both. Lots of the people who were being interviewed only about Doug were reluctant. Many of them felt really burned by the Esquire piece and it’s depiction of Doug, so that was hard to crack. And others, for varying reasons, were not interested in talking. But many, many were really excited to talk and helped me crack some of those who didn’t want to talk. Some who initially didn’t want to talk—like Brian McConnachie—wound up being some of my favorite people and interviews."
