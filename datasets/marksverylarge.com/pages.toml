["https://www.marksverylarge.com/staff-contributors/mod"]
title = "Michael O’Donoghue  |  Mark's Very Large National Lampoon Site"
full_description = "O’Donoghue was among the original contributors to National Lampoon when it began in 1970. It would be no exaggeration to say the brilliance of the early years of the magazine was largely due to his presence. Prior to writing for NatLamp, O’Donoghue had been a contributor to Evergreen Review and the East Village Other. (At Evergreen Review, he gained notoriety for creating as series of comic-book-style stories called Phoebe Zeit-Geist. The series was drawn by Frank Springer, who would also later appear in National Lampoon.) He was brought to the attention of Beard and Kenney by Christopher Cerf and George Trow, fellow Harvard Lampoon alums. Cerf was at Random House at the time, and had published a book by O’Donoghue called “The Incredible, Thrilling Adventures of the Rock” which may have inspired the “pet rock” craze. Trow had written a screenplay with him for a movie called “Savages.” Some classic O’Donoghue pieces include “Tarzan of the Cows,” a comic book parody in which the infant Lord Greystoke survives a plane crash not in Africa, but in rural Wisconsin; and “The Vietnamese Baby Book,” a vividly anti-war parody of the familiar “baby book” diary, in which the unfortunate parents fill in items such as “baby’s first shrapnel.” With fellow staffer Tony Hendra, O’Donoghue wrote and produced NatLamp’s first comedy album, “Radio Dinner” in 1972. O’Donoghue had earned a reputation for having a volitile temper. After a falling out in 1973 with Hendra, who was kept out of his way by being assigned to the Lemmings stage review, he created the first special National Lampoon issue comprised entirely of new material, The National Lampoon Encyclopedia of Humor. Lavishly produced and ad-free, it was a big success. When Hendra had unexpected success with Lemmings, O’Donoghue was furious. In order to appease him, and given his brilliant work on “Radio Dinner,” O’Donoghue was assigned to produce the National Lampoon Radio Hour."
year_published = 2025
clearnet = "https://www.marksverylarge.com/staff-contributors/mod"
