["https://www.marksverylarge.com/issue-index/1971-08"]
title = "August 1971, Vol. 1, No. 17 / Bummer  |  Mark's Very Large National Lampoon Site"
full_description = "“COVER: This month’s cover is by Kelly Freas, a brilliant artist currently responsible for much of the best illustration in the science-fiction field, but probably most well known for the many cover renditions of a familiar mascot that he did during the fifties and sixties for one of the popular children’s magazines of the day.” Portrait of Lt. Calley in the guise of Alfred E. Newman with the caption, “What, My Lai?” In case you didn’t catch it, the cover note is referring to the fact that Freas was a frequent cover artist for Mad magazine. Hot Flashes, Text and photos uncredited; Illustration by Marvin MattlesonPress photos (some doctored) with humorous captions Mrs. Agnew’s Diary, Uncredited (Doug Kenney); Illustration by Marvin MattlesonThe Agnews and the Nixons attend a rocket launch escorted by Dr. Werner von Braun News of the Month, Uncredited (Henry Beard); Illustration by Marvin MattlesonGerman companies try to exploit the “nostalgia” craze in advertisements; A mysterious chemical slick of the coast of California; Grisley mass-murder of 346,782 Vietnanmese under investigation; Advantages of the Soviet justice system; Flowing lava and Mafiosi compared, accompanied by study questions Defeat Comics, By Michael O’Donoghue and George W. S. Trow; Illustrated by Crag W. GraniteWar comc book parody in which four brothers join up hoping to become heroes in Vietnam only to end up as drug addicts, traitors and black marketeers. Includes ad for Lt. Calley’s Kill the Children Federation and Madame Ky’s Puzzle Page which contains puzzles such as “How many dead Vietcong can you find in this picture?” Welfare Monopoly, By John WeidmanParody of the Monopoly board game in which one player is a slum lord and the rest of the players are renters on Welfare As the Monk Burns, By John BoniTV soap opera set amidst murder and mayhem in a war ravaged village in Vietnam Canada Supplement, By Sean Kelly, Anne Beatts, and Michel Choquette; Illustrations by Chas B Slackman, Joe Orlando, L. Ross, and Al RossiA potpourri of short articles about Canada, “The Retarded Giant on Your Doorstep” including: Americans, Know Your Canada, interesting facts and a guide to language; Canadian History at a Glance, including a Cwick Canada Cwiz (actually Canada jokes); Northern Lights, some famous Canadians (better known for their success in the U.S.); Canada, As Modern As Today, photos from the ’40s supposedly showing how “up-to-date” Canada is; Canada’s “Rye” Sense of Humour, Acollection of Canadianized non-jokes; Canada, Daybed of Democracy, Canada’s role as a source of armaments for the U.S.; Shinney: The Real Hockey Tourists Never See, A short story by a world traveler who passes himself off as a Québeçois to discover the real Canada; The Quest for a Canadian Identity, Results of an opion pole; How to tell if you’re Canadian; Honourary Canucks; Toronto, Someplace Like Home, A photo essay on the “exciting” lifestyle enjoyed by Torontans; An RCMP Poster depicting a pig on horseback; and The Frog Prince: A Canadian Fairy Tale, a comic featuing Pierre Trudeau"
