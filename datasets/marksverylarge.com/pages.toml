["https://www.marksverylarge.com/2024/12/09/radio-hour-available-online"]
title = "Radio Hour Available Online  |  Mark's Very Large National Lampoon Site"
full_description = "Years ago, there was a site called Egg City Radio where you could download a set of .zip files containing all the episodes of National Lampoon Radio Hour. I used to direct people there when asked, but never posted a link here because I didn’t want to bring it to the attention of certain lawyers. Unfortunately, the site disappeared a few years ago. However, I’ve discovered another site, called Radio Echoes, that hosts all the shows individually for streaming or download. I feel like I’m taking a chance by posting it here, but I’m less worried about publicizing things like that nowadays. Hopefully, it will still be there when you click on the link. (Knock on wood.) Mark - Thanks for posting this link! It's always good to see this radio series get some recognition. A quick spot check of a few of these links leads me to think that these are FM radio airchecks, recorded back in the day. Many are from WRVR out of New York City. As with all such vintage airchecks, the audio recording quality can vary from pretty good to merely adequate. One minor quibble - several of the episode identification details as posted are in error, misidentifying the specific program. If this level of detail matters to you, you should check the aircheck's listing info against the program content listing as has been posted here on this website so to ensure the program's listing detail accuracy. Thanks for the clarifications, Dave! To be honest, I didn't do any checking for quality or accuracy, compared to the listings you compiled for me here. Original material (excluding quoted material) © 1997-2024 Mark Simonson. Mark's Very Large National Lampoon Site is not affiliated with National Lampoon or National Lampoon Inc. Click here for the real thing."
