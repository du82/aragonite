full_description = "Deteriorata, Performed by Norman Rose; back-up vocals by Melissa Manchester; bass: John “Cooker” LoPresti; drums: Jim Payne; keyboard: Milissa Manchester; guitar: Christopher Guest; music composed and arranged by Christopher Guest; lyrics by Tony HendraA parody of “Desiderata,” the then-popular dorm poster which was turned a minor hit record by Les Crane. Deteriorata was also sold as a poster. Phono Phunnies, Performed by Christopher Guest and Michael O’DonoghuePhono Phunnies were the audio version of the magazine’s popular Foto Funnies feature. Catch It and You Keep It, Performed by Jackson Beck, Christpher Guest, Jack Marks, Jill André, Windy Craig, and others; from an idea by Benjie AerensonTV game show parody where audience members try to catch valuable prizes (including electric knives, dinette sets, even a house) thrown down from the top of the CBS building. Magical Misery Tour (Bootleg Record), Performed by Tony Hendra (as John Lennon), Melissa Manchester (as Yoko Ono); piano: Melissa Manchester; drums: Jim Payne; bass: John “Cooker” LoPresti; composed by Christopher Cerf; arranged by Christopher GuestJohn Lennon’s own words are turned against him, making him out as an ungrateful prima donna, in this spooky parody. Those Fabulous Sixties, Performed by Christopher Guest (as Bob Dylan)Parody of a K-Tel-type television ad in which Bob Dylan hawks a collection of protest songs Profiles in Chrome, Performed by Jackson Beck, Christopher Guest, Jill André, Jack Marks, Norman Rose, Alex Bennett, Michael O’Donoghue, Tony Hendra, and Windy Craig (as Richard Nixon)When the Democrats nominate a Pontiac GTO for the ’72 Presidential election, Nixon counters by transforming himself into a car. The piece ends with America The Beautiful played on car horns. Suport Your Locol Polece (PSA), Performed by “Loren Order” (as Frank Rizzo)Includes the notorious phrase “[… world of] morons, psychopaths, andmental defectives”. Pull the Tregros, Performed by Diana Reed (as Joan Baez); guitar: Frani Bell; bass: Dean Munson; composed by Tony Hendra; arranged by Christopher GuestJoan Baez parody in which she encourages blacks to riot in prisons while she cheers them on from a safe distance"
