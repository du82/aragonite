["https://www.marksverylarge.com/1998/03/12/9"]
title = "9. “First Blowjob”  |  Mark's Very Large National Lampoon Site"
full_description = '''Q: Many moons ago National Lampoon published a short story titled “First Blowjob.” It was by either Doug Kenney or Ed Subitzky—I don’t recall. I’ve been looking for it for a long time, but with no luck. A: That story (by Doug Kenney) first appeared in “The National Lampoon Encyclopedia of Humor,” a special issue which was published in 1973. It also appeared in the hardcover “10th Anniversary Anthology” and the paperback anthology “A Dirty Book.” "Why, that-that sounds positively disgusting!" "It sure is," Dad said, puffing his pipe alight, "just ask your mother." Chuck's final line is classic, too, but I won't spoil it. It's highly original and, by today's standards, one of the most mysogynist and offensive pieces the NL ever published, and they published a lot. Original material (excluding quoted material) © 1997-2024 Mark Simonson. Mark's Very Large National Lampoon Site is not affiliated with National Lampoon or National Lampoon Inc. Click here for the real thing.'''
