["https://www.marksverylarge.com/books-anthologies/songbook"]
title = "National Lampoon Songbook (1976)  |  Mark's Very Large National Lampoon Site"
full_description = "Edited by Sean Kelly; Music Arrangements by Dan Fox; Copy edited by Louise Gikow; Designed by Pellegrini, Kaestle & Gross, Inc. COVER: Illustration by Randall Enos, Gahan Wilson, Bobby London, Jeff Jones, Shary Flenniken, and Charles Rodrigues. Parody of the ubiquitous dorm poster “Desiderata,” which also was set to music and was a minor hit recording by Les Crane. A recording of this, featuring Melissa Manchester and Norman Rose, appears on Radio Dinner. (1972) Parody of the classic ’50s death song genre. From Lemmings. A recording of this, featuring Alice Playten, appears on the Lemmings album. (1973) Parody of John Denver and the back-to-nature movement. From Lemmings. A recording of this, featuring Chevy Chase, appears on the Lemmings album. (1973) The album cover illustration from the Lemmings cast recording. Depicts a Woodstock-like festival attended by lemmings. Parody of Bob Dylan. From Lemmings. A recording of this, performed by Christopher Guest, appears on the Lemmings album. (1973) A parody of Joan Baez. First appeared on the Radio Dinner album (performed by Diana Reed), but was also featured in the Lemmings stage show. (1972) Parody of Joe Cocker and Leon Russell. From Lemmings. Performed by John Belushi and Paul Jacobs on the album. (1973) Heavy metal parody. The climactic closing number of Lemmings during which the entire audience is supposed to “off” itself. Performed by the cast, featuring John Belushi on lead vocal, on the album. (1973) First appeared in the June 1971 (Religion for Fun and Prophet) issue. Later performed on the National Lampoon Radio Hour by Christopher Guest. (1973) The illustration which accompanied Overdose Heaven in the June 1971 (Religion for Fun and Prophet) issue. Done in the style of a religious tryptych painting of martyred saints. Illustration from Playdead magazine in the January 1973 (Death) issue. A sketch based on this was performed in the Lemmings stage show. From the November 1972 (Decadence) issue. A parody of the “cut-out” insert from the Beatles’ Sgt. Pepper album."
