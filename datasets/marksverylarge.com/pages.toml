["https://www.marksverylarge.com/bookshelf/going-too-far-the-rise-and-demise-of-sick-gross-black-sophomoric-weirdo-pinko-anarchist-underground-anti-establishment-humor"]
title = "Going Too Far: The Rise and Demise of Sick, Gross, Black, Sophomoric, Weirdo, Pinko, Anarchist, Underground, Anti-Establishment Humor  |  Mark's Very Large National Lampoon Site"
full_description = "A fascinating and entertaining chronicle of what former Lampoon editor Hendra calls “Boomer humor,” from its birth (Mort Sahl) to its death (Saturday Night Live). Contains an extensive history of the National Lampoon from his point of view as an insider. Probably the most cogent analysis of what made the magazine what it was in its most fertile period. Unlike some of the books in this category (I’m looking at you, Matty Simmons), it features an extensive index, making it easy to look up exactly what you’re looking for—especially for a book of this size (nearly 500 pages). This book was my primary source of information about National Lampoon during the early years of this website and was partly the inspiration for starting it in the first place. Original material (excluding quoted material) © 1997-2024 Mark Simonson. Mark's Very Large National Lampoon Site is not affiliated with National Lampoon or National Lampoon Inc. Click here for the real thing."
