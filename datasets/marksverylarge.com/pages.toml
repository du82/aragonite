full_description = "Q: I remember a series of stories called “large dangerous things that go fast” and “small dangerous things that go fast” I think Hunter Thompson might have even wrote them. I would love to get may hands on a copy, there is a great story about waking up moonshine blind ! A: That appeared in the March ’77 (Science and Technology) issue. It was written in a Thompson-esque style. Thompson never wrote for NatLamp. (Thanks to both Joshua Fiero and Kurt Meyer for this answer.) CAN YOU GIVE ME THE EMAIL ADDRESS FOR MR. SEAN KELLY OF THE NATIONAL LAMPOON HE TAUGHT ME ENGLISH LITERATURE (EARLY 1970) AT LOYOLA COLLEGE IN MONTREAL It was written by P.J. O'Rourke; those stories can currently be found here: http://www.bizbag.com/O'Rourke/O'Rourke-Poisonous%20Junk.htm (and if the copyright gestapo remove that site, try the Way Back Machine at archive.org). Original material (excluding quoted material) © 1997-2024 Mark Simonson. Mark's Very Large National Lampoon Site is not affiliated with National Lampoon or National Lampoon Inc. Click here for the real thing."
