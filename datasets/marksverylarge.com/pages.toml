["https://www.marksverylarge.com/issue-index/1970-11"]
title = "November 1970, Vol. 1, No. 8 / Nostalgia  |  Mark's Very Large National Lampoon Site"
full_description = "“COVER: Our Norman Rockwellesque fantasy was executed by Lou Glanzman, whose 47 Time covers to date make him one of America’s most successful (and overpaid) illustrators in the biz. If you want to know what he looks like in real life, take a look at the triumphant Dad to the left of the barber. “Speaking of overpaid illustrators, the editors wish to thank the gang at Cloud for getting us through our first dark days and hope, despite the growing clamor for their ballpoints that forced them to drop our art directorship like a live grenade, that their scrawls will continue to have a home in our flimsy pages.” Michael Gross took over as Art Director with this issue, bringing the new logo with the filled-in OOs and a more sophisticated look to the magazine. Letters, From the Editors Mrs. Agnew’s Diary, Uncredited [Doug Kenney]Martha Mitchell invites Judy to sneak into a Women’s Liberation Front meeting with her. ContestRumor Derby: Contestants are asked to send in their favorite rumors in two different categories—existing or proposed. First prize is a one-year subscription to the National Lampoon. Horrorscope, Uncredited [Doug Kenney]The futures of various celebrities are predicted using samples of their handwriting. The Dink Patrol and the Love Slaves of Xuyan Than Phu, By Michael O’Donoghue; Illustration uncredited (Bruce Minney)“Guts Magazine True Combat Story”—Memoirs of a berzerk GI in Vietnam. Those Fabulous Fifties, Uncredited [Doug Kenney and Michael Gross]Section opener featuring a cut-out Dick Clark party mask. The Teen-age Death Song Game, By Christopher Cerf; Illustration uncredited [probably by Michael Gross]A board game based on teen-age death songs of the ’50s and ’60s such as Teen Angel, Tell Laura I Love Her, Honey, and Patches. Free Fifties Gifts, Uncredited [Doug Kenney and Michael Gross]Things to cut out including a “Get Out of Korea” bumper sticker, an American Communist Party membership card, an Alan Freed payola check, and Buick holes to paste onto your VW."
