["https://www.marksverylarge.com/issue-index/1972-12"]
title = "December 1972, Vol. 1, No. 33 / Easter  |  Mark's Very Large National Lampoon Site"
full_description = "“COVER: This month’s cover is by Rick Meyerowitz and is entitled ‘The Old Switcheroo Lives, But Can We Make a T-Shirt Out of It?’ One might make the observation that if that bunny rabbit is really crammed into the cover as it appears, why then is the logo dropping down instead of being forced up as physics would dictate? Our Design Director Michael Gross explains: ‘Yeah, well, maybe so, but bunny rabbits don’t have lumps on the tops of their heads. If they had lumps on the tops, we could force the logo up; but they don’t, so it’s got to go down.” News on the March, Uncredited [Henry Beard]; Illustration by Marvin Mattleson, Photographs uncredited The Golden, Wonderful Treasure of the Most Expensive Christmas Giftbooks of All Time, By Gerry Sussman; Photograph uncredited Funny Pages, Featuring “Nuts” by Gahan Wilson; “Trots and Bonnie” by Shary Flenniken; “Do-It-Yourself Comics!” by Ed Subitzky; “Idyl” by Jeff Jones; “Earl D. Porker, Social Worker” and “Bill–The Story of a Newt Who Was Eaten by His Suit” by M. K. Brown; “Dirty Duck” by Bobby London; “Chicken Gutz” and an untitled strip by Randall Enos; and “Vinny Shinblind, the Invisible Sex Maniac” by Susan Harris and Peter Bramley Original material (excluding quoted material) © 1997-2024 Mark Simonson. Mark's Very Large National Lampoon Site is not affiliated with National Lampoon or National Lampoon Inc. Click here for the real thing."
