["https://www.marksverylarge.com/issue-index/1972-11"]
title = "November 1972, Vol. 1, No. 32 / Decadence  |  Mark's Very Large National Lampoon Site"
full_description = "“COVER: This month’s cover is entitled ‘The Lady of the Bathwater’ and was photographed by Steve Meyers. By now the astute reader is probably wondering, ‘If this, as it would certainly appear to be, is intended as an off-the-wall parody of Sir Walter Scott’s Lady of the Lake, then why the fuck is a man’s hand holding the sword?’ The explanation is simple. Michael O’Donoghue, who came up with the idea, turned the entire project over to Art Director Michael Gross. O’Donoghue didn’t bother to go over every detail with Gross because he figured any schoolboy has read King Arthur, not realizing that Gross, who’s still trying to finsh a Blackhawk comic he bagan some months ago, thinks that King Arthur is a seaport in Texas. When he saw the cover, O’Donoghue, always considerate of other’s feelings, slow to condemn and quick to forgive, just didn’t have the heart to tell Gross that his is a stupid, illiterate, cloddish, defective, imbecilic, retarded, dense, moronic, subnormal, feeble-minded dolt who’s about as bright as a night-light and as sharp as a napkin. Your brain belongs in Forest Lawn, you beef-witted dumbhead!!! News on the March, Uncredited [Henry Beard]; Illustration by Marvin Mattleson, Photographs uncredited Fredrick’s of Toyland, By Michael O’Donoghue and Mary Jenifer Mitchell; Illustrated by Neke Carson Chickmeat, Fish & Poultry, By Anne Beatts and Michael O’Donoghue; Illustrations by Michael Doret and Charles White III U.S. Army Decorations and Badges for the War in Vietnam (1962-1972), Illustrated by [?] Mayo and Warren Sattler Funny Pages, Featuring “Nuts” by Gahan Wilson; “Chicken Gutz” by Randall Enos; “Trots and Bonnie” by Shary Flenniken; “Idyl” by Jeff Jones; “Dirty Duck” by Bobby London; “Polaroid Pornographic Comics!” by Ed Subitzky; an untitled strip by Randall Enos; and “The Aesop Brothers, Siamese Twins” by Rodrigues Original material (excluding quoted material) © 1997-2024 Mark Simonson. Mark's Very Large National Lampoon Site is not affiliated with National Lampoon or National Lampoon Inc. Click here for the real thing."
