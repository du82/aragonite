["https://www.marksverylarge.com/issue-index/1972-07"]
title = "July 1972, Vol. 1, No. 28 / Surprise!  |  Mark's Very Large National Lampoon Site"
full_description = "“COVER: Once again our own Art Director, Michael “Has Anybody Got an Eraser?” Gross, elbows his way into your home with this month’s cover. His last (“Is Nothing Sacred?” January, ’72) sold literally dozens after being made into a handsome wall poster. Come to think of it, his career has been looking pretty grim generally, particularly since Frederick’s of Hollywood started using photographs instead of free-lance art in their rubber-frock catalogues. The cover shows a giant panda near the Washington Monument. Several Chinese soldiers and a tank are emerging. News on the March, Uncredited [Henry Beard]; Illustration by Marvin Mattleson, Photographs uncredited Saigon Times Refugee Pages, By John Boni and Henry Beard; Cartoon by Randall Enos, Photographs uncredited Funny Pages, Features “Nuts” by Gahan Wilson; “Prophet & Loss” by Peter Bramley; “Reverse Censorship Comics!” by Ed Subitzky; “Chicken Gutz” by Randall Enos; “Alice Pajamas” by C. Barsotti; “Idyl” by Jeff Jones; “Mercury, God’s Own Messenger” by M. K. Brown; “Shab” by B. Kliban; “Doctor Colon’s Monster” by Rodrigues; and “americarnal” by Bill Lee Original material (excluding quoted material) © 1997-2024 Mark Simonson. Mark's Very Large National Lampoon Site is not affiliated with National Lampoon or National Lampoon Inc. Click here for the real thing."
