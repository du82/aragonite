["https://www.marksverylarge.com/1997/11/17/2"]
title = "2. “Telejester”  |  Mark's Very Large National Lampoon Site"
full_description = "Q: I am looking for a Chris Miller story, “Telejester”, wherein (among other things) Richard Nixon has a large key in his back, and he must be wound up periodically. I think it also appeared in an anthology of Miller’s short stories. A: The issue you want is August ’73 (Strange Beliefs) issue. I’m not aware of a Chris Miller anthology per se, but it did also appear in the NatLamp anthology “This Side of Parodies.” Also, Chris has a website (www.chrismillerwriter.com) and has been posting his classic short stories periodically. Update: Sadly, Chris’s website no longer exists. I was reminded of Telejester when I heard about the bulge on President Bush's back. I decided that the Telejester had been re-incarnated and had updated his vision to show us the President's battery pack. Original material (excluding quoted material) © 1997-2024 Mark Simonson. Mark's Very Large National Lampoon Site is not affiliated with National Lampoon or National Lampoon Inc. Click here for the real thing."
