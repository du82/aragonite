["https://www.marksverylarge.com/about-this-site"]
title = "About This Site  |  Mark's Very Large National Lampoon Site"
full_description = "Mark’s Very Large National Lampoon Site is an unauthorized guide to what I consider the best years of National Lampoon magazine—roughly 1970-1975. You won’t find much here about the movies, later years of the magazine (it ceased publication in 1999), or its current incarnation (although there is some of that, too). It is also a tribute to the talented writers and artists who put the magazine together in those early years. This site has no connection or affiliation with National Lampoon, Inc. I began working on this site in 1996 as a hands-on way to learn web design. I chose National Lampoon since, at the time, there was nothing about it on the Web. More importantly, it happened to be a topic which permanently occupied a large and otherwise useless portion of my brain. It has since gotten completely out of hand to become the award-winning, fan-pleasing resource it is today. As for me, I am a former magazine art director and graphic designer, but since 2005 I’ve been almost exclusively designing typefaces and developing fonts). As an art director and designer, I was heavily influenced by National Lampoon during my formative years. It wasn’t my only influence, but it was a big one. This site is a hobby for me. If you want to see what I do when I’m not wasting my time here, check out www.marksimonson.com. I also have an “art” site (www.marksimonson.art) where I post caricatures and other stuff. It’s very common on the Web to make pages that are very busy and full of “eye candy”—spinning logos, animated buttons, faux 3-D effects, and so on. Instead, I’ve chosen to emulate the clean, straightforward look and feel of the National Lampoon itself in hopes of recreating to some degree its early ’70s milieu. I have the tools at my disposal to create a virtual Photoshop plug-in theme park online, but it would be wrong. [Note: I originally wrote this in 1997. If you remember what the web looked like back then, you have my sympathies.—MS] I’ve worked on this site with various tools over the years, starting with PageMill back in 1997, then DreamWeaver, then parts of it in Movable Type (a blogging engine) with parts hand-coded in BBEdit. As of February 2017, I’ve switched to WordPress. Graphics were created mostly in Adobe PhotoShop and Adobe Illustrator. Internet/FTP support from Panic Software’s Transmit."
