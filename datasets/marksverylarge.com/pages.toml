["https://www.marksverylarge.com/page/29"]
title = "Mark's Very Large National Lampoon Site"
full_description = "I started tracking visitors to Mark’s Very Large National Lampoon Site about a month ago. So far, there are about 30-40 visitors a day; about 450 different visitors over the last month. After careful thought and consideration, I have decided to put something useful in place of the gratuitous cover page which has graced this site since it began. Over the last few months, as people have discovered this site, I’ve received many queries and tidbits of information from visitors. Up to now, I’ve kept it all to myself. This seemed a waste, so I came up with this news page idea. This is now the default page on Mark’s Very Large National Lampoon Site. Smart web surfers should now bookmark this page instead of the About This Site page for all the latest developments. And it won’t just be stuff about the site. It will include anything I feel is relevant. I will try to update it at least once a month or sooner, if events merit. Mark's Very Large Plug. You might think, as you wade through this site, that I have no life. Not true. I spend about two days a year working on Mark's Very Large National Lampoon Site. The rest of the time I make fonts. You can see my real website here. I also have an “art” website where I post caricatures and other stuff. For Lampoon-related stuff and site updates, follow me on X (Twitter). Also, check out my YouTube channel, where I post videos related to National Lampoon. Original material (excluding quoted material) © 1997-2024 Mark Simonson. Mark's Very Large National Lampoon Site is not affiliated with National Lampoon or National Lampoon Inc. Click here for the real thing."
