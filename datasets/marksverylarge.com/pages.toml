["https://www.marksverylarge.com/issue-index/1971-02"]
title = "February 1971, Vol. 1, No. 11 / Head Issue  |  Mark's Very Large National Lampoon Site"
full_description = "“COVER: This month’s excursion into hardcore Xerography is brought to you through the magic of Sagebrush Studios, whose managers have never ever even seen any dope, much less smoked this illegal substance. However, they do know a guy who actually uses it and they got their research material from this guy and also by raking up piles of old Reader’s Digests, igniting them and inhaling the fumes.” Editorial, By Doug KenneyA thoughtful defense of the idea of making drugs legal is interupted by a neurological siezure mid-paragraph, and then finishes as if nothing happened. ContestReaders are asked to submit headlines in the style of the National Enquirer for real news events, current or historical. Contest ResultsRumors–actual (category I) and bogus (category II). Category I winner: “If you fart, burp, and sneeze at the same time, you will die.” Category II winner: “As late as 1963, farmers in rural Iowa refused to abandon their victory gardens and peach pit stockpiles, maintaining that World War II was still going on. Even today, bewildered motorists report sniping activity around Council Bluffs.” Mrs. Agnew’s Diary, Uncredited [Doug Kenney]Judy’s correspondence school course in writing fails to get her published in the National Review; Spiggy is irate when there is a rumor that Dick will be dumping him when he runs for re-election; Dick (pretending to be Hank) calls to reassure him; Spiggy is not fooled and, enraged, runs out of the house in his pajamas, and is stopped by the police before getting to Dick’s. Horrorscope, Uncredited [Doug Kenney]The futures of famous people are predicted by means of casting lots. News of the Month, By Henry Beard, Hugo Flesch and Rick MeyerowitzResults of new poll reveal that most Americans are not at home; Nixon combats the coming flue season using the same (futile) tactics as he has used in the war in Vietnam; A computer scientists conducts experiments on a monkey by subjecting it to various computer “foul-ups” involving multiple subscription offers to Life, mis-matched computer dates, and bills for long distance calls it never made; New trend in which various politicians and criminals are now doing product endorsements; Conservation groups concerned over where Nixon will dump Agnew in ’72; Pentagon claims that My Lai massacre was in fact a hippie-type ritual slaying."
