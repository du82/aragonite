["https://www.marksverylarge.com/issue-index/1973-10"]
title = "October 1973, Vol. 1, No. 43 / Banana  |  Mark's Very Large National Lampoon Site"
full_description = "“COVER: This month’s cover, to give credit where it’s due, was Michael O’Donoghue’s idea BRILLIANTLY executed by the lovely and talented Mara McAfee. As is obvious, it’s one of the best covers we’ve had in months. Perhaps years. Others, whose names you’d recognize in an instant, sneered at the idea when it was first presented. They are the kind of people who pronounce the ‘Van Gogh’ name ‘Van GOCK’ (as if a Brillo Pad were lodged in the throat). They are the kind of people who discuss the role of insanity in the creative process. They are the kind of people who don’t know shit about good covers.” The cover is a mock self-portrait of Van Gogh holding his severed ear in his hand. In the ear is a banana. The blurb at the top reads, “Banana. What? Banana Issue. What? BANANA ISSUE. What?” It’s a reference to the old joke: “You have a banana in your ear!” “What?” “I said you have a BANANA IN YOUR EAR!” “What? I can’t hear you—I have a banana in my ear!” Funny Pages, Featuring “Nuts” by Gahan Wilson; “The Aesop Brothers, Siamese Twins” by Rodrigues; “One Year Affair” (four episodes) by Ralph Reese and Byron Preiss; “Trots and Bonnie” by Shary Flenniken; “Famous Comic Artists School” by Bruce Cochran; “Idyl” by Jeff Jones; “Chicken Gutz” by Randall Enos; “Cheech Wizard” by Vaughn Bodé; and “Dirty Duck” by Bobby London Original material (excluding quoted material) © 1997-2024 Mark Simonson. Mark's Very Large National Lampoon Site is not affiliated with National Lampoon or National Lampoon Inc. Click here for the real thing."
