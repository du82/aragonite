["https://www.marksverylarge.com/1999/01/10/45"]
title = "45. “Thanksgiving Memory”  |  Mark's Very Large National Lampoon Site"
full_description = '''A: The story you’re looking for was “Thanksgiving Memory” by Chris Miller which appeared in the July ’74 issue. Supposedly, the magazine got in trouble with Miller when it printed his draft before he was finished with the piece. It was a while before he appeared in the magazine again. Was that the story where the grandmothers tit fell into the gravy boat and every one at the table ended up having sex with each other? I think the neighbor showed up at the door, saw the father screwing the turkey, and when asked if she would like to join in answered she was a vegetarian? When I was 15, I thought that Thanksgiving story was just about the funniest thing I had ever read. I would love to read it again. Anybody know where I might find it? Good God! That was the most insane thing I ever read. I think it was my first experience with The National Lampoon, and my best friend showed me the article and said, "You've got to read this. It's totally sick." It was. I remember my friend had to stop driving his car and pull over because I was reading this out loud and we were laughing so hard that tears were streaming down our faces. Having sex with your Thanksgiving dinner had never occured to me before this. Original material (excluding quoted material) © 1997-2024 Mark Simonson. Mark's Very Large National Lampoon Site is not affiliated with National Lampoon or National Lampoon Inc. Click here for the real thing.'''
