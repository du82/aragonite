["https://www.marksverylarge.com/issue-index/1973-09"]
title = "September 1973, Vol. 1, No. 42 / Postwar  |  Mark's Very Large National Lampoon Site"
full_description = "“COVER: This month’s cover is by Michael Gross. Frankly, when it came in I thought it was a stiff, but Michael redid the guy’s head, put a hat on him, and now it’s better. A little Balkan if you know what I mean, but better. Michael Gross, by the way, didn’t invite me to his party.” The cover is a parody of WWII American propaganda posters. It shows Tojo, Hitler, and Mussolini fleeing from a cream pie-weilding average American citizen. Whitedove Comics, By Henry Beard; Illustrated by Francis Hollidge; T.G.I.F. Joe® Ad, By P. J. O’Rourke; Illustrations and photographs uncredited Nazi Regalia for Gracious Living, By Bruce McCall; Photographs by Dick Frank; Product “manufactured” by Harry Fischman, Alan Rose, Celia Bau, and David Kaestle; Illustrations by Elizabeth Benett Life Magazine, September 28, 1943, By George W. S. Trow, Bruce McCall, and Henry Beard; Illustrations by Bruce McCall, Warren Sattler [?], and others uncredited; Photographs by Larry Couzens, David Kaestle, and others uncredited Funny Pages, Featuring “Nuts” by Gahan Wilson; “Idyl” by Jeff Jones; “Cheech Wizard” by Vaughn Bodé; “Trots and Bonnie” by Shary Flenniken; “Chicken Gutz” by Randall Enos; “Dirty Duck and Weevil” by Bobby London; “One Year Affair” by Byron Preiss and Ralph Reese; and “The Aesop Brothers, Siamese Twins” Original material (excluding quoted material) © 1997-2024 Mark Simonson. Mark's Very Large National Lampoon Site is not affiliated with National Lampoon or National Lampoon Inc. Click here for the real thing."
