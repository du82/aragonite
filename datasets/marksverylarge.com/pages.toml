["https://www.marksverylarge.com/issue-index/1971-05"]
title = "May 1971, Vol. 1, No. 14 / The Future  |  Mark's Very Large National Lampoon Site"
full_description = "“COVER: This month’s cover was the result of close teamwork between artist Gray Morrow and photographer Neil Armstrong, and , in case you didn’t notice, the only thing that went right with this pig-iron albatross of an issue. Better luck next month, Hank and Doug.” Letter From the Editor, By Doug KenneyIn a top-secret project, a man has been sent one year into the future and back. While the excact data from the experiment are still classified, Kenney offers readers a list of specific precautions for the coming year Mrs. Agnew’s Diary, Uncredited (Doug Kenney); Illustration by Marvin MattlesonDavid and Julie pay Judy and Spiggy a suprise visit Horrorscope, Uncredited (Doug Kenney); Illustration by Marvin MattlesonThe futures of various celebrities seen through a crystal ball Contest Results, Illustration uncredited (probably Michael Gross)Results of the Trygve Lie Memorial International Pun Toss & Yokohama Throw–two pages of puns submitted by readers News of the Month, Uncredited (Henry Beard); Illustration by Marvin MattlesonJean-Claude Duvalier wins Haiti election by a 2,143,296 to 0 landslide; Advertising ideas for the U.S. Army; Following the Beatles’ break up, other groups, such as the Supreme Court, The Joint Chiefs of Staff, and the Democratic Party are rumored to be calling it quits; Breakdown of planned government expenditures to find a cure for cancer The 1906 National Lampoon, By Doug Kenney; Cover illustration by Michael Gross“Droll Caprice—Saucy Wit” Toilets of the Extraterrestrials, Cartoons by Peter BramleyThe appearance of the creatures which use these plumbing devices is tactfully left to the imagination of the reader Special “IF” Section, By Henry BeardA full-sized pull-out newsprint broadside featuring page 1 and 2 of the May 12, 1971 edition of The New York World-–a newspaper which went out of business near the turn of the century. The stories and photos appear to be from an alternate version of the 20th century where World War II and the Vietnam War never happened; the Bolshevik Revolution failed; and Richard Nixon is a patent attorney who happens to be mentioned in a small item about a beached whale"
