["https://www.marksverylarge.com/1998/03/18/10"]
title = "10. “Class of ’86”  |  Mark's Very Large National Lampoon Site"
full_description = "Q: There was a movie that appeared on Showtime called National Lampoon’s Class of ’86. Very funny. Do you know it ? Do you know where I can get a copy? A: From Kit Lively (with thanks): “Class of ’86” is a performance of the National Lampoon stage show from 1986, and it is very funny. It’s basically a collection of skits detailing how crappy the world had become by 1986 (if only they could see us now), sort of from the view point of a couple of hippies who had supposedly been on a severe acid trip since 1966. It’s available on Paramount Home Video, and in fact Reel.com has it for sell as well. A new copy will run you $25.99, and a used copy is $8.99. Update: And, of course, if you’re reading this sometime in the 21st century, you can watch it for free on YouTube. Original material (excluding quoted material) © 1997-2024 Mark Simonson. Mark's Very Large National Lampoon Site is not affiliated with National Lampoon or National Lampoon Inc. Click here for the real thing."
