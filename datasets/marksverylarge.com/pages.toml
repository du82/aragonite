["https://www.marksverylarge.com/answers"]
title = "Answers  |  Mark's Very Large National Lampoon Site"
full_description = "The most recent questions are at the top of the page. Unanswered questions are in red. Click here to see only Unanswered Questions. (Tip: You can use the Find command in your web browser to search this page, or use the Search box at the bottom of the menu to search the entire site.) Q. I am trying to locate the issue where Norm Appleton plays trick on his kids and an Indian boy who could not speak English well. Norm of course plays does many pranks. In the end the Indian boy suddenly is able to identify Norm as the one who did the pranks. There was also a word that Norm or the Indian boy used and I believe I was “sneep.” It was a short story that appeared approximately between 1977 to 1984. I have been trying to find it for years. If you know of that issue, please let me know. A. The story was called “My Life of Practical Joking” by John Stemp. The story doesn’t actually involve Norm or the Appleton kids, but it is accompanied by several Appletons comic strips where Norm plays practical jokes on his kids, all written and drawn by B.K. Taylor. However, the story does mention a Syrian kid the author took on a snipe hunt when he was a boy scout who pronounced the word snipe as “sneep.” So that’s probably what you’re remembering. Q. I’m looking for a cartoon that was in National Lampoon of a boy peeing on a Christmas tree and his sister is yelling to their mom saying, “Mom, he’s peeing on the Christmas tree!” If you could find it that it would wonderful! A. Indeed, but I couldn’t. If anyone else remembers this and knows which issue it appeared in, please comment below. Q. A cartoon by Tom Cheney that I always loved was, I’m pretty sure, in the Lampoon, but I don’t know what issue. It’s a drawing of a restaurant kitchen, and a waiter is popping his head through the kitchen door and he says, “Everyone’s complaining that the food tastes like shit, and the champagne is piss warm” or something along those lines. In the cartoon you see a chef sitting on a pot, and another chef peeing into a champagne bottle. I hope you can help."
