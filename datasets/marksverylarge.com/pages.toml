["https://www.marksverylarge.com/2024/01/09/brian-mcconnachie-r-i-p"]
title = "Brian McConnachie, R.I.P.  |  Mark's Very Large National Lampoon Site"
full_description = "McConnachie was known for his offbeat style of humor, which tended toward the absurd. The former Madison Avenue ad man’s entree into writing for the Lampoon was sending poorly-drawn cartoons to the magazine, some of which were published. Eventually, at the invitation of Henry Beard, he joined the staff as a writer. Some of McConnachie’s most memorable pieces were “Amish in Space,” a sci-fi comic parody, Guns and Sandwiches magazine, the ultimate special-interest magazine, Pamplemousse, an absurd and slapstick parody of Papillon, Kit ’n’ Kaboodle, a “funny animal”/Tom and Jerry-type comic book with realistic violence (very likely the inspiration for Itchy and Scratchy on The Simpsons), and Negligent Mother, a parody of women’s magazines. After leaving National Lampoon, McConnachie joined the writing staff for Saturday Night Live and later SCTV. He also wrote for kid’s shows Shining Time Station and Noddy, and acted in over a dozen films, including Caddyshack, Strange Brew, and several of Woody Allen’s. Most recently, he has been Head Writer for The American Bystander, a humor magazine he originally tried to launch in the early 1980s, but which was successfully re-launched in 2015 and continues to be published. At the time of this writing, I haven’t found any obits for Brian. But when I do, I will append them here. Hollywood Reporter obit: https://www.hollywoodreporter.com/tv/tv-news/brian-mcconnachie-dead-sctv-saturday-night-live-1235783464/ Original material (excluding quoted material) © 1997-2024 Mark Simonson. Mark's Very Large National Lampoon Site is not affiliated with National Lampoon or National Lampoon Inc. Click here for the real thing."
