full_description = "“COVER: Readers searching for the answer to the question ‘Who draws more covers for the National Lampoon than any other New-York-based illustrator working out of a brownstone on East Forty-ninth Street with the initials D.H.?’ will find a clue on the half-shell, just above the D.H. signature. Painting by Dick Hess, decoration by Sandro Botticelli. As the cover proclaims, this month’s theme is ‘Men!,’ as in ‘Hooray for men!’ or ‘Oh, men!’ Take it as you like it.” The cover is a parody of the well-known Botticelli Venus. The figure has a copy of Playboy in his hand. Norman the Barbarian, By Sean Kelly; Illustrated by Barry Smith, lettering by Sam Rosen. Ad for “Rockwell Home Orifice Protection System”, By Ed Bluestone and Anne Beatts. Men’s Pages, Featuring: Mr., By George W. S. Trow, Photographs uncredited; Odd Man Out, By Michel Choquette, Illustrated by Ralph Reese; and A Clean Breast, By George W. S. Trow Funny Pages, Featuring “Nuts” by Gahan Wilson; “Doctor Colon’s Monster” by Rodrigues; “Famous Comic Artists School” by Bruce Cochran; “Idyl” by Jeff Jones; “Beastiality Comics!” by Ed Subitzky; “Cheech Wizard” by Vaugn Bode; “The Beer Drinker” by Bruce Cochran; and “Sid, the Amoeba” by B. Kliban Original material (excluding quoted material) © 1997-2024 Mark Simonson. Mark's Very Large National Lampoon Site is not affiliated with National Lampoon or National Lampoon Inc. Click here for the real thing."
