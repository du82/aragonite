["https://www.marksverylarge.com/2006/11/14/the-real-animal-house"]
title = "The Real Animal House  |  Mark's Very Large National Lampoon Site"
full_description = "is Chris Miller’s new book recounting his days in the Alpha Delta Phi fraternity at Dartmouth College in the early sixties. Several short stories about those experiences were published in National Lampoon in the early seventies and became, in part, the inspiration for the movie Animal House, one of the most popular comedy films of all time. The book is both less and more than the movie—they are really two separate stories with some common elements. One (the movie) is mostly fiction, and the other (Chris’s new book) mostly true. Chris’s book also goes far beyond what could be shown in a Hollywood movie. If you ever read any of the many short stories he wrote for National Lampoon, this will come as no surprise. Mark: Congratulations on the book. It seems to be doing pretty well. What’s been the reaction so far? Chris: The reaction has been a real enthusiastic one because of the terrific review that was in The New York Times by Chris Buckley. C: I’ve hardly ever seen a review that was so one hundred percent positive on something. You could have knocked me over with a feather. M: In the reviews I’ve seen, it seems like people either like it a lot or they don’t like it at all. C: Maybe that’s just those speaking up, but that’s how people have always reacted to National Lampoon and to Animal House, and to that kind of humor. It got reviewed in the Dartmouth newspaper, and, oh boy, they panned it. Calling it shallow, and all it’s about is this that and the other thing and I don’t know. These people don’t get it. They’re too serious or something. M: Yeah. There was a short review in Entertainment Weekly, and I wondered if the guy actually read the whole book. C: I wondered that too and with the review from Kirkus. I had the strong feeling with the Kirkus review that they hadn’t read the whole thing. C: We got that great review and, immediately, you can see the reach of The New York Times because everybody starts buying it on Amazon. And by eight o’clock that night, we were number 26 on Amazon, five days after the book is released. So that was amazing. By now were down to 88 or something because I guess you have to keep doing publicity for these things. Tomorrow, in fact, I’m on Bill O’Reilly’s show, The O’Reilly Factor, of all things. [Note: Chris’s appearance on O’Reilly’s was postponed until Monday, Nov. 20.–MS]"
