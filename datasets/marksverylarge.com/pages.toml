["https://www.marksverylarge.com/issue-index/1971-09"]
title = "September 1971, Vol. 1, No. 18 / Kids  |  Mark's Very Large National Lampoon Site"
full_description = "“COVER: This month’s test for color blindness (if you can’t see the very funny joke written in red behind the cat, check with your optometrist) is by Marvin Mattleson. Says Mattleson: ‘Doing a cover for your magazine was a big break for me. Thanks to you, I have received many important and lucrative offers from prestige publications and high-class book companies. In my first month, I grossed more than I did in a whole week in my previous job. I strongly recommend your magazine to other artists!'” Letter From the Editor, By Michael O’DonoghueA rather long-winded joke about a cattle drive which crosses paths with a Dixieland band Hot Flashes, Uncredited; Illustration by Marvin MattlesonPress photos accompanied by humorous captions Mrs. Agnew’s Diary, Uncredited (Doug Kenney); Illustration by Marvin MattlesonThose “awful” Chinese; Dick sends Spiggy to campaign in obscure foreign countries; everyone attends a wedding and gets looped News of the Month, Uncredited (Henry Beard); Illustration by Marvin MattlesonNixon announces his plans for the “So-So Society”; A chain letter enticing recipients to kill Vietnamese circulates in Vietnam; FTC to investigate religions for possible fraudulant claims; Telephone Company plans ad campaign to discourage phone use; Sharks place ban on eating people because of health risks; Solutions to Queen Elizabeth’s financial woes; Arizona man arrested for his part in the My Lai massacre—voting for Lyndon Johnson My Weekly Reader: The Children’s Tabloid, By George W. S. Trow and Anne BeattsParody of My Weekly Reader featuring sensationalistic stories about children Children’s Letters to the Gestapo, By Michael O’DonoghueKids say the darndest things to Heinrich Himmler, offering to turn in their parents, making “cute” racists remarks, etc. Eloise at the Hotel Dixee, By Michael O’DonoghueParody of the Eloise childrens’ books in which Eloise lives in a seedy hotel populated by prostitutes and drunks Creative Playthings, By Gerald SussmanSocially relevant toys for the seventies such as Martin Luther King Logs, Ralph Nader Chemistry Set, Norman Podhoretz Hand Puppets, Psychic Wholeness Costumes, etc."
