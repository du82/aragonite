["https://www.marksverylarge.com/2025/02/24/david-kaestle-interview"]
title = "David Kaestle Interview  |  Mark's Very Large National Lampoon Site"
full_description = "Well, not with David himself. He died in 2004. Jack Urso, who runs a website about the Hot Hero Sandwich TV series (1979-80), has done an interview with David Kaestle Jr and Louisa Kaestle, the son and widow of David Kaestle, who was an art director at National Lampoon from 1972-74. It gives an overview of his life and work both before and after the Lampoon, which included designing the logo for Hot Hero Sandwich. I exchanged emails with David in 2002, hoping to get information from him about his time at National Lampoon for my website. He was said he was busy and would get back to me in a couple of weeks. Sadly, that was the last I heard from him. So Jack’s interview is about the next best thing. In my opinion, David was the best designer who ever worked for National Lampoon. Although he’s usually listed as an art director, he was responsible for the design of the 1964 High School Yearbook Parody, The Encyclopedia of Humor, and many other special projects in addition to the magazine itself. Michael Gross was a great art director, but I believe David was responsible for the magazine’s excellent use of type and getting every last detail of its parodies right. (I am a typeface designer and former magazine art director and designer, so you can take my word on this.) Original material (excluding quoted material) © 1997-2024 Mark Simonson. Mark's Very Large National Lampoon Site is not affiliated with National Lampoon or National Lampoon Inc. Click here for the real thing."
