["https://www.marksverylarge.com/2004/01/25/david-kaestle-remembered"]
title = "David Kaestle, R.I.P.  |  Mark's Very Large National Lampoon Site"
full_description = "“David was my oldest and dearest friend and shared the art directing responsibilities for National Lampoon for several years. I am often credited as the design force behind the magazine, but many of the best-known (and best art directed) NatLamp products were the work of David. We alternated doing the magazine and the many special publications being ground out by a brilliant overworked staff. David’s finest work was the High School Yearbook Parody (for which I am often mistakenly credited). He also took over the magazine while I worked on Lemmings. That was our flawlessly intermingled role, functioning at it’s best. “David and I went on to start a design company with National Lampoon as one of our clients, continuing a tradition of art direction that could be from either one of us…like Siamese design twins. “David was the finest man I have ever known. His modesty and integrity were unmatched. He did little to promote his own role at NatLamp and I hope this note will bring credit where it is deserved. “David, you are loved and missed by everyone who ever had the privilege of knowing and working with you. Hi! I Just completed an interview with David Kaestle Jr and Louisa Kastle, the son and widow of David Kaestle. An overview of his life and work. David did the logo for the Hot Hero Sandwich TV series, which is the focus of my website - though this article is largely about the other things Kaestle has done.. https://hotherosandwichproject.blogspot.com/2025/02/hot-hero-sandwich-project-in.html Best, Jack Urso, Editor, Hot Hero Sandwich Project Thanks, Jack! I exchanged emails with David about a year before he died, hoping to interview him about his time at National Lampoon. He was said he was too busy at the time but would get back to me when he had a chance. Sadly, it never happened. So I'm glad you did this interview. It's the next best thing to what I was hoping to get from David. If you don't mind, I'll post a link as a News item on the main page here."
year_published = 2025
