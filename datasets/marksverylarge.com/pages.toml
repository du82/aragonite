["https://www.marksverylarge.com/2024/08/27/chris-miller-campus-talk-1977"]
title = "Chris Miller Campus Talk, 1977  |  Mark's Very Large National Lampoon Site"
full_description = "Chris Miller was a frequent contributing writer (and later editor) of National Lampoon during the 1970s. He’s best known for his satirical short stories, often revolving around the topic of sex. During his time with the magazine, Chris went on the road to college campuses around the U.S., giving talks about humor and satire, which included reading some of his short stories from the magazine. This is an audio recording of one of those talks, from early 1977, sent to me by the person who recorded it, who wishes to remain anonymous. The talk contains adult themes, and is not suitable for young or sensitive individuals. NSFW, as they say. Keep in mind that this was the seventies, when attitudes about sex were quite different from today. Consider yourself forewarned. If you’re a fan of the magazine and Chris’s stories from back then, never mind. You know what you’re in for. (The newspaper clipping shown in the video is about an earlier campus appearance Chris made in 1975. Read more about it here.) Original material (excluding quoted material) © 1997-2024 Mark Simonson. Mark's Very Large National Lampoon Site is not affiliated with National Lampoon or National Lampoon Inc. Click here for the real thing."
