["https://www.marksverylarge.com/2025/01/17/christmas-vacation-2-the-death-of-national-lampoon"]
title = "Christmas Vacation 2 / The Death of National Lampoon  |  Mark's Very Large National Lampoon Site"
full_description = "I just discovered this three-year-old video, which is something of a post-mortem of the National Lampoon brand, and it’s pretty good. It looks at the history of National Lampoon‘s foray into movies, pegging Christmas Vacation 2 (2003) as the best example to illustrate what went wrong. I’ve never seen this movie—or any of the “National Lampoon” movies beyond European Vacation (1985)—so it was like looking under a rock I’ve been avoiding for decades. And, well, it’s kind of disgusting. But this guy’s analysis is sound. I will add one thing he doesn’t mention. Henry Beard, NatLamp‘s first managing editor, was against doing movies. Ironically, it was his departure in 1975 (along with co-founders Doug Kenney and Rob Hoffman), taking a $7-million buy-out clause, that left the magazine strapped for cash, which in turn led them to start making movies in order to make money to keep the magazine afloat. Original material (excluding quoted material) © 1997-2024 Mark Simonson. Mark's Very Large National Lampoon Site is not affiliated with National Lampoon or National Lampoon Inc. Click here for the real thing."
year_published = 2025
clearnet = "https://www.marksverylarge.com/2025/01/17/christmas-vacation-2-the-death-of-national-lampoon"
