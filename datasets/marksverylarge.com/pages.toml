["https://www.marksverylarge.com/issue-index/1971-10"]
title = "October 1971, Vol. 1, No. 19 / Back-to-School  |  Mark's Very Large National Lampoon Site"
full_description = "“COVER: This month’s cover is the result of teamwork, pure and simple, and we’d like to take this opportunity to tip our hats to a few of the forgotten men who make covers like this possible: Mike O’Donoghue had the orignal ‘brainstorm,’ and NatLamp design honcho Mike Gross gets an assist for a strong follow-through; Dick Hess, perennial high-scoring penster, inked the drawing, and Bob Pike, who is being traded to Elmira College for a tripod and some F-stops, came through with some nice camerawork in the third quarter; Art Director’s Workshop put together a 2 on 1 silkscreen, and Ellen Taurins, playing in the cleanup spot, came up with the big gun (a Bostitch Stapomatic) in the final minutes to sort of wrap things up. Good work, all of you!” The cover is made to look like a matchbook cover advertisement for a diploma mill. The young woman is saying, “Sorry, fella, but if you don’t have a high-school diploma, kiss off!” Mrs. Agnew’s Diary, Uncredited (Doug Kenney); Illustration by Marvin MattlesonThe Agnews’ monthly card party with the Nixons and the Mitchells is interupted by an angry phone call from Chaing Kai-shek, who is all in a huff over Hank Kissinger’s trip to Red Communist China News of the Month, Uncredited (Henry Beard); Illustration by Marvin MattlesonSodomy charges against Al Capp deemed likely to be a “bum rap”; Secret Dept. of Defense documents reveal proposed plans to use heroin to entice new recruits in an all-volunteer army The School of Hard Sell, By George W. S. Trow and Michael O’DonoghueMadison Avenue-style ads for college courses Right On! The Campus War Game, By Michel Choquette, Anne Beatts, and Sean KellyA strategy & tactics-style board game that pits radical students against the college administration MAD Parody, By John Boni, Sean Kelly, and Henry Beard; Illustrations by Joe Orlando, Ralph Reese, John Romita, John Lewis, Ernie Colon, Al Weiss, Babi Jery, and Stuart SchwartzbergCover: A worried-looking Alfred E. Newman with the caption, “What, Me Funny?”; “Citizen Gaines,” a movie parody; “You Know You’ve Really Outgrown MAD When…”; “The Lighter Side of Dave Berg”; and more"
