["https://www.marksverylarge.com/staff-contributors/gross"]
title = "Michael Gross  |  Mark's Very Large National Lampoon Site"
full_description = "Gross majored in fine art at Pratt Institute in the ’60s, left school to do art direction at magazines such as Cosmopolitan and Eye, and was responsible for some award-winning design work for the 1968 Mexico City Olympics. He joined the staff of National Lampoon as art director in the fall of 1970. Gross brought a professional, Madison Avenue style to the magazine, replacing the wacky comic book look of Cloud Studios, the group of “underground” artists who had been hired when the magazine started. Instead of trying to make it look “funny,” his approach was to present the material in a straight-forward, almost dead-pan manner, and, in the case of parody, to mimic the target down to the smallest detail, sometimes using special paper stocks or inserts. The effect was sophisticated, funnier, and much more subversive. His first full issue was the November 1970 “Nostalgia” issue and from the Norman Rockwell parody on the cover to the “1956 Ezra Taft Benson High School Yearbook” parody (which was expanded upon later with the 1964 High School Yearbook Parody), the tone of the magazine was set for years to come. The editors soon discovered that Gross could faithfully imitate graphically anything they threw at him. Under his capable direction, sales of the magazine started to pick up for the first time. David Kaestle was brought in as a partner in 1972 to art direct special projects (including the Encyclopedia of Humor and the 1964 High School Yearbook Parody) and soon, with the growth of the magazine, the two were art directing alternate issues to manage the workload. They were able to get many well-known and talented artists to work for the magazine and garnered many design and art direction awards during this period. In 1974, the graphic design magazine Print featured a cover story on National Lampoon. Accompanying the article was a parody of Print magazine itself, created by the editors and art staff of National Lampoon. Gross and Kaestle left the magazine at the end of 1974 and formed Pellegrini, Kaestle, & Gross, Inc., which contributed to the magazine on special projects through the late ’70s."
year_published = 2025
clearnet = "https://www.marksverylarge.com/staff-contributors/gross"
