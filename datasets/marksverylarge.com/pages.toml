["https://www.marksverylarge.com/sources"]
title = "Sources  |  Mark's Very Large National Lampoon Site"
full_description = "In addition to issues of National Lampoon, the following works have been of help in compiling this site, and are recommended if you can find them: Mr. Mike: The Life and Work of Michael O’Donoghue from National Lampoon to Saturday Night Live, the Man Who Made Comedy Dangerous By Dennis Perrin, Avon Books, 1998. This biography of the man who set the tone for National Lampoon in its formative years focuses mainly on his life and work up until his final break with Saturday Night Live in 1982. It covers in meticulous detail (including excerpts) his early career in experimental theater and as a struggling writer; his four-year reign at National Lampoon; and his ground-breaking (and ultimately co-opted) work for Saturday Night Live. (The last twelve years of his life, which were much less public, fly by in only one chapter.) Perrin’s account of O’Donoghue’s Lampoon days compliments the accounts given in Hendra’s and Simmons’ books (see below) without being redundant. The story of O’Donoghue’s early life and career puts his later work in context and gives it greater meaning. The parade of alliances, tantrums, and feuds is presented in all its tragic drama, and much of the book is devoted to his personal eccentricities and foibles. O’Donoghue’s work is presented as is without much explanation as to why so many found his work both brilliant and funny (as if it went without saying), and this is the only real shortcoming of this riveting book. If You Don’t Buy This Book, We’ll Kill This Dog! Life, Laughs, Love, & Death at National LampoonBy Matty Simmons, Barricade Books, 1994. Straight from the horse’s mouth, here is the most complete (as of 1994) account of the history of National Lampoon, written by its long-time publisher. Simmons has a tendency to ramble, but the material is so fascinating, in the end it doesn’t matter. Reading his account of the ill-fated take-over by actor Tim Matheson and Dan Grodnik and the subsequent sale of the magazine to J2 Communications is like watching a car accident in slow motion, with the survivors walking away with little more than the name plate. In addition to the magazine, other NatLamp enterprises (such as the stage shows, movies, and television shows) are covered in detail. Finally, the book contains anecdotes and personal sketches of virtually everyone associated with Lampoon, many of whom went on to much bigger things. This book is a great read for any fan of National Lampoon."
