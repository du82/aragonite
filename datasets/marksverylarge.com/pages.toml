["https://www.marksverylarge.com/1998/08/06/30"]
title = "30. O.C. and Stiggs Movie  |  Mark's Very Large National Lampoon Site"
full_description = 'Q: Do you know anything about the movie “O.C. and Stiggs”? I know ABC distributed it, but I can not find it anywhere. Also, in which issues did the O.C. and Stiggs appear? A: The O.C. and Stiggs movie, written by NatLamp editors Ted Mann and Tod Caroll and directed by Robert Altman was released in 1987. It was not produced as a National Lampoon movie even though it was based on articles that appeared in the magazine. NatLamp publisher Matty Simmons was not interested in it as a movie and allowed Mann and Caroll to try to get it produced on their own, which they did. O.C. and Stiggs first appeared in the July ’81 (Endless, Mindless Summer Sex) issue in two articles, “Summer Fun with O.C. and Stiggs” and “Some Real Stupid Guys That O.C. and Stiggs Know Go to the Beach.” They also appeared in “The O.C. and Stiggs Annual Gash Report 1981” in the February ’82 (The Sexy Issue), “The O.C. and Stiggs Guaranteed Method of Porking the Vice-President’s Wife” in the June ’82 (Do It Yourself) issue, and, finally, there was a special “O.C. and Stiggs” issue in October ’82 (The Utterly Monstrous, Mind-Roasting Summer of O.C. and Stiggs). The movie was an atrocity; OC and Stiggs were essentially Leopold and Loeb in the stories, and Mann/Carroll realized no mainstream studio would distribute a version close to the original stories. As I recall, OC and Stiggs were based on the characters Hock and Wickheiser in an earlier short story by Mann or Carroll who go on a similar rampage (tape recorded narrative transcribed) but die at the end like Butch and Sundance. In any case, the sole appeal of the characters was their complete disregard for everything else; the stories had the warmth and sentiment of Trainspotting. In the movie, we have to be given reasons to hate the Schwabs. "The Utterly Monstrous, Mind-Roasting Summer of O.C. and Stiggs" from October 1982 was the last gasp of the National Lampoon I knew and loved. I sort of got off the train after that. Was the "O.C. & Stiggs" movie ever in theatres, or did it go straight to video?'
