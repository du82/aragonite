["https://www.marksverylarge.com/2025/01/24/frazetta-the-national-lampoon"]
title = "Frazetta & the National Lampoon  |  Mark's Very Large National Lampoon Site"
full_description = "Celebrated fantasy illustrator Frank Frazetta’s granddaughter Sara has a YouTube channel where she does excellent video presentations about her grandfather’s life and work. Most recently, she did one about Frazetta’s relationship with the National Lampoon, where he did several covers and inside illustrations. As you can imagine, I know a lot about National Lampoon and its history, but much of what she presents is new even to me. She does a concise and accurate job of describing the magazine and some of the people who worked for it, including art director Michael Gross, and goes into detail about how he was hired and what he (and his wife) thought of the magazine. Original material (excluding quoted material) © 1997-2024 Mark Simonson. Mark's Very Large National Lampoon Site is not affiliated with National Lampoon or National Lampoon Inc. Click here for the real thing."
