["https://www.marksverylarge.com/1998/10/09/36"]
title = "36. “Disco Beaver From Outer Space”  |  Mark's Very Large National Lampoon Site"
full_description = '''A: (2005 Update) My previous answer to this question was so full of corrections and corrected corrections that I decided to start over. What follows is (knock on wood) definitive: “Disco Beaver From Outer Space” was produced for HBO in 1978 and aired in 1979. It featured performances by Lynn Redgrave (special guest star), Rodger Bumpass, Peter Ebling, Alice Playten, James Widoes, Lee Wilkof, Michael Simmons and Slewfoot (a C&W band), Sarah Durkee, Tony Hendra, and Sean Kelly. It was produced by Tony Hendra and Matty Simmons was executive producer. It was directed by Joshua White, written by Peter Ebling, Jeff Greenfield, Ted Mann, Harry Shearer, and John Weidman, with songs by Peter Ebling, Sean Kelly, and Tony Hendra. The title song “Disco Beaver From Outer Space” was performed by Alice Playten. Numerous outdoor shots were filmed on location in New York City. (Sources: Michael Simmons, Matty Simmon’s book “If You Don’t Buy This Book, We’ll Kill This Dog!”, Mike Galos, and Guy H.) 2017 Update: Of course, these days you can watch the entire thing for free on YouTube. Somewhere in our collection we have a deteriorating copy of Disco Beaver from Outer Space. On Beta. We would LOVE to find this film on a more up to date medium. Sure, it's politically incorrect in so many ways, but it's LAMPOON. Which means it's FUNNY. I really wish I had a copy of DBFOS. I saw this in 1978 and I still remember many of the gags...Rocky Roccoco Pizza I think got its name from this show. Helping Horny Hands...ha ha! The Home of Tomorrow. What a great show! I remember watching Disco Beaver from Outer Space, a few times on HBO when visiting friends in Manhattan in 1978. The Anita Bryant "Homo No Mo" sketch was hilarious! I recall the 'Beaver' also tryin' to hump some chick in a fur coat. Screw PC, it was funny stuff! I never saw disco beaver, but I was in it(and some photo funnies). I worked for lampoon (21st century communications was the corporate name) and weasled my way into a few bit parts-the jogging scene, a disco scene (I was wearing an animal house t-shirt I think)and some scene with a pakistani street person carrying a couple of shopping bags. The first jogging shoes I ever wore was during the jogging scene, and I was kind of upset that they wouldn't let me keep 'em! I have no idea if any of my footage made it in. The word at the time was that the movie was so awful no distributor would touch it and that's how it got to hbo. At the time, hbo wasn't so picky.'''
year_published = 2025
clearnet = "https://www.marksverylarge.com/1998/10/09/36"
