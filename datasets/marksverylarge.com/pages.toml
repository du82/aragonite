title = "January 1971, Vol. 1, No. 10 / Women’s Liberation  |  Mark's Very Large National Lampoon Site"
full_description = "“COVER: The Kong-size cutie mounting the Entire State Building is the work of photographer George Adams, contributor to Playboy, Evergreen and other dubious publications, and Consulting Dean to the Kwik-Pix Academy of Snazzy Snaps, Inc. Mr. Adams created this interesting compsition with trick photography involving, among other things, a stuffed and shrunken gorilla, a specially-designed rubber torso and a number of perverted f-stops.” Editorial, By Doug KenneyLess-than-sincere denials of sexism within the mostly-male staff of National Lampoon and an account of the negotiations when the female members of the staff went on strike. Mrs. Agnew’s Diary, Uncredited [Doug Kenney]; Spot illustration by David JohnsonJudy secretly dips into the grocery money to enroll in a Famous Writers School correspondence course hoping to break into the “wide-open” field of poetry; Pat and Dick throw a costume party for New Year’s Eve–Dick seems to be wearing what he usually wears, but everyone applauds him anyway. Contest; Spot illustration by David JohnsonReaders are invited to send in their best puns using place names in the “Trygve Lie Memorial International Pun Toss & Yokohama Throw.” Results are given for the Anti-Drugs Contest in which readers were invited to finish the sentence, “I will never smoke dope because ___.” First prize went to Howard Franklin for “I will never smoke dope because drugs do the darndest things.” News of the Month, Uncredited [Henry Beard]; Spot illustration by David JohnsonSuggestions for applying American election practices to eventual “free elections” once the war in Vietnam is over; List of end-of-the-year special books, including “Art by the Astronauts” and “The Deluxe Illustrated Report of the President’s Commission on Pornography, edited and with an introduction by Ralph Ginzburg”; Precautions for parents or children assembling plastic kits (“You will probably need a complete set of Phillips screwdrivers, a pair of industrial wire cutters, a small anvil and a chain saw, so get these now. You will also need something to cut your finger with and a sofa to ruin.”); The latest trends in “freeway living”; Tests finding that marijuana injected in rats causes birth defects suggests further study on the effects of intervenous doses of cheese, dead insects, etc."
