["https://www.marksverylarge.com/1998/01/05/8"]
title = "8. “The Mad Vandal”  |  Mark's Very Large National Lampoon Site"
full_description = '''Q: I use to listen to the National Lampoon Radio Hour in the mid-’70s with my brother. We were trying to remember a skit called “The Mad Vandal” and if it was part of the NLRH. A: Yes, there was indeed a “Mad Vandal” bit, in fact, it was a two-show serial and was broadcast in June of ’74 and was written by Doug Kenney. It was based on the 1964 High School Yearbook Parody which had an ongoing gag in which a “mad vandal” terrorized the school by playing practical jokes on students and faculty invariably featuring human excrement. In the yearbook parody, no one knew who it was, but it’s apparent that it was the school’s principal. In the Radio Hour serial, the Mad Vandal is unveiled in the end. According to the High School Yearbook parody, it was 'The Mad Crapper' not Vandal and it was the school principal Humphrey J. Cornholt. He even 'signed' Larry Kroger's signature book with a s**t smear and "Ha Ha The Mad Crapper Strikes Again." I noticed that too when it was first broadcast. The only thing I can guess is that the word "crapper" was considered inappropriate for airplay in the Seventies, so they changed it to "vandal". Original material (excluding quoted material) © 1997-2024 Mark Simonson. Mark's Very Large National Lampoon Site is not affiliated with National Lampoon or National Lampoon Inc. Click here for the real thing.'''
