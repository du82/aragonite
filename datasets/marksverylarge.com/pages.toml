title = "March 1971, Vol. 1, No. 12 / Culture  |  Mark's Very Large National Lampoon Site"
full_description = "“COVER: The Mona Gorilla by Ricardo da Meyerowitz is reproduced with the kind permission of the National Lampoon Traveling Exhibition entitled The Gorilla in Art. The reconverted bookmobile will also display such masterpieces as Duchamp’s Gorilla Descending a Staircase, Picasso’s Gorillica, the original manuscript of Kant’s Critique of Pure Gorilla, a recording of Schubert’s Unfinished Gorilla and a videotaping of Sir Kenneth Clark’s cultural series Gorillisation. Gorilla my dreams, I love you…” Mrs. Agnew’s Diary, Uncredited (Doug Kenney); Illustration uncredited (probably Michael Gross)Judy has lunch with Pat and Trish; Hank drops by and upsets Pat; Judy is left alone with Trish and tries to explain the birds and bees to her with disasterous results News of the Month, Uncredited (Henry Beard); Illustration uncredited (probably Michael Gross)Suggestions for the Pompidieu government to rename things French in honor of Charles de Gaulle; Quebeqoises, however, pass; 5,000 gallons of mercury is accidentally tainted with tuna; Nixon administration clarifies rather wide bounds supposedly agreed to by Hanoi as justification for bombing North Vietnam; An example of the type of file kept on private citizens—in this case “Eugene V. MacArthur”—proves reassuring; In the wake of Playboy magazine’s announcement that it would no longer retouch out pubic hair in its nude photography, other national magazines announce similar “taste innovations” Horrorscope, Uncredited (Doug Kenney); Illustration by Michael GrossPredictions about famous people based on scapulimancy, the observation and minipulation of the shoulder blade How to Write Good, By Michael O’Donoghue; Illustrations by Joe OrlandoAbsurd advice to the budding writer. For instance, in the absence of a satisfactory ending, he suggests having all the characters run over by a truck. The Mantovani Strain, By Gordon CotlerA parody of Michael Crichton’s The Andromeda Strain in which middle-American blandness suddenly and mysteriously spreads through Manhattan."
