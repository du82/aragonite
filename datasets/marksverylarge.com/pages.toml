["https://www.marksverylarge.com/1999/02/10/48"]
title = "48. Uncle Buckle, the Safety Buffalo  |  Mark's Very Large National Lampoon Site"
full_description = '''Q: I remember an issue from 1975 (?) that had a story about kids in a driver’s education class. I remember a character called Uncle Buckle the Safety Buffalo. Can you tell me which issue this story was in? A: Pretty good guess. It was the April ’75 (Car Sickness) issue, titled “Driver’s Ed” written by P.J. O’Rourke; produced and directed by Peter Kleinman. Thanks for posting this. My kids didn't believe me when I told them about Uncle Buckle, so this proved me not to be a lier (or smoking something). As I recall, this was pretty funny. As an avid National Lampoon reader of the 70's, I don't recall much detail except for the Safety Buffalo and the famous yearbook edition (anyone have any idea on where I can find a copy of that?) The Yearbook Parody has been reissued and is available in the usual places (Barnes and Noble, Amazon, Borders, etc.). Let's nor forget Uncle Buckle's sidekick, Sergant Seatbelt of the Ohio Highway Patrol. Dressed as an SS officer, it was a takeoff on the notorious Ohio speeding ticket corps of the period. Perhaps my favorite line from the magazine: "You know, if Jimmy (?) had been wearing his seatbelt, the Negroes wouldn't have been able to pull him from the car." Uncle Buckle returned to investigate the perils of the playground with the help of Lieutenant Helpful in the September 1976 (Latest Issue) ish, written by PJ O'Rourke and directed by Pendar Ness. I fondly remember the "Driver's Ed" piece with Uncle Buckle from my own childhood, so I was pretty much floored when one of my kids came home with a children's book called "Officer Buckle and Gloria" ( see http://www.libsci.sc.edu/miller/Officer_Buckle.htm -- there's a video, too! ). In the book, Officer Buckle is a police safety officer, who goes to schools to deliver useful tips such as "don't sit on a tack." Gloria is his dog, who begins to act out all the hypothetical safety problems (Google found an odd little clip of Gloria pretending to be electrocuted...). It's actually an OK book; in fact, it won a Caldecott medal. But a safety officer named "Buckle" -- Peggy Rathmann, were you a NatLamp reader?'''
year_published = 2025
clearnet = "https://www.marksverylarge.com/1999/02/10/48"
