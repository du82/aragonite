title = "June 1971, Vol. 1, No. 15 / Religion for Fun and Prophet  |  Mark's Very Large National Lampoon Site"
full_description = "“COVER: Our thanks and a tip of the NatLamp Weejun goes this month to Edward Sorel for his vivid portrait of Andrei Gromyko slinging his views from Aix to Trenton, New Jersey. Mr. Sorel has been in the satire biz longer than he cares to mention, has a delightful new book out written by the charming Mrs. Sorel and entitled Word People, and by the time he reads this will probably still not have received his pitiful check. Just sent out in the mail this morning, Ed. Honest.” Letter From the Editor, By Doug KenneyA little parable about a bearded “hippie” dude who got busted by the Establishment—but not the one you’re probably thinking of Horrorscope, Uncredited (Doug Kenney); Illustration by Marvin MattlesonCelebrities’ futures revealed using fortune cookies News of the Month, Uncredited (Henry Beard); Illustration by Marvin MattlesonProposal to use the SST for public transportation in order to get government funding; Several rumors; The creed of the United States Marine; Some new ethnic organizations seeking recognition, including a group composed of 4 million Germans who claim to have plotted together to assassinate Hitler; Hope for phones having trouble achieving dial tone Mrs. Agnew’s Diary, Uncredited (Doug Kenney); Illustration by Marvin MattlesonJudy gives us a daft peek at Hank Kissinger’s creepy subterrainean command center The Judaic-Judaic Tradition, Cartoons by Arnold Roth“A look at the old-time religion as seen through rosen-colored glasses” Foto Funnies, Uncredited (features Doug Kenney); Illustration by Marvin MattlesonA woman who reads the Whole Earth Catalog shows guy (played by Kenney) she knows how to use it Utopia Four Comics, By Sean Kelly; Art by Joe Orlando, Lettering by John CostanzaMarshall McLuhan, Kate Millet, Charles Reich, and Buckminster Fuller, as a team of super heroes, utterly fail to quell a ghetto riot Lamentations II, By Tony HendraSupposedly a lost book of the Bible, recently unearthed, which casts the rest of the Bible in rather dubious light"
