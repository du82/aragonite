["https://www.marksverylarge.com/staff-contributors/bktaylor"]
title = "B.K. Taylor  |  Mark's Very Large National Lampoon Site"
full_description = "B. K. (Bob) Taylor’s work first appeared in the 1975 special edition “National Lampoon’s Very Large Book of Comical Funnies” with the comic strip “The Appletons,” a family feature which supposedly ran in the 1950s. In October 1976, Taylor’s “Timberland Tales” first appeared in the “Funny Pages” section of the National Lampoon. Over the next ten years, both strips ran in that section regularly, alternating from issue to issue. “The Appletons: A Saga of an American Family” featured Helen, the earnest and clueless mom; Kathy and Bobby, the mischievous and somewhat less clueless kids; and Norm, the mischievous and subversive dad (imagine Ward Cleaver with a penchant for elaborate and dangerous practical jokes). “Timberland Tales” featured Doctor Rogers, an earnest Mark Trail-type; his girlfriend Kathleen; Maurice the Indian Boy (“some call him the joker”), an unbelievably naive and bulbous teenager; and Constable Tom (“rumored to have a small amount of brain damage”), a dimwitted, musclebound Canadian Mountie. The latter two characters were featured much more frequently. Taylor’s style is reminiscent of early Mad artists Wallace Wood and Bill Elder, combining deadpan delivery with slapstick humor. I Think He’s Crazy!By B.K. Taylor, with a forward by Tim Allen and a “backward” by R.L. Stine, 2019 Original material (excluding quoted material) © 1997-2024 Mark Simonson. Mark's Very Large National Lampoon Site is not affiliated with National Lampoon or National Lampoon Inc. Click here for the real thing."
