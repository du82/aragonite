["https://www.marksverylarge.com/issue-index/1971-12"]
title = "December 1971, Vol. 1, No. 21 / A Heart-warming Christmas  |  Mark's Very Large National Lampoon Site"
full_description = "“COVER: This month’s moving reaffirmation of the Christmas spirit oozed from and personable writer/illustrator of innumerable unpleasantries (‘The Disrespectful Summons’ in NatLamp’s last issue) including his own books, among them The Phantom Toll Booth, The Gilded Bat, and The Curious Sofa.” The cover depicts a poor family visited by a rich man bearing extravagant, useless gifts. Each item in the scene is numbered with a corresponding description in the caption below. The Adventures of Cynthia Goodhead, By Jon SurgalCynthia writes Sha-Na-Na for advice on how she can get an orgasm and relates some surprising things she has learned about Bob Dylan from a mysterious dumpster diver. Mrs. Agnew’s Diary, Uncredited (Doug Kenny); Illustration by Marvin MattlesonSpiggy is concerned that Dick is not planning to have him as a running-mate in ’72. When Dick offers him the post of head of the AEC, Spiggy reveals some incriminating video tape in his posession concerning Dick, Bebe Rebozo and a shower stall and gets an upgrade to Supreme Court Justice. The Unforgiving Minute, By Paul Krassner; Illustration by Marvin MattlesonA review of the stage play “Lenny” delivered posthumously by Lenny Bruce himself. The Story of Jessica Christ, By Tony Hendra; (Illustration appears to be uncredited)Done in the style and format of a Sunday school textbook, answers the question, “What if Jesus had been a woman?” Boys’ Romance Comics, By Doug Kenney; Illustrated by Joe OrlandoRomance comic parody titled “Blind Date With Love” in which a hapless teen takes a blind date to the prom. The puffed up first person narrative contrasts sharply with the humiliating reality protrayed in the accompanying panels. Features an ad for the “Atomic Zit-Lifter” and a grossly unsympathetic advice column called “Ask Uncle Bob.” Christmas Story, Written and illustrated by Arnold RothThe sad tale of Santa’s Christmas visit to modern America where he encounters a cult of pot-heads, a bitter, decadant Bob Cratchit, militant feminists, militant blacks, Jesus freaks, and paranoid flag-wavers."
