["https://www.marksverylarge.com/1997/10/30/1"]
title = "1. “That’s Not Funny, That’s Sick!”  |  Mark's Very Large National Lampoon Site"
full_description = '''A: I do not know where to find copies of the 1977 NatLamp LP “That’s Not Funny, That’s Sick!” (it was originally issued as an LP, and later on cassette) but it is available on compact disc from Amazon.com. “That’s Not Funny, That’s Sick!” was released in 1977 on Label 21 Records. It stars Brian Doyle-Murray, Bill Murray, Christopher Guest and features Richard Belzer, Rhonda Coullet, Gracie Whitebread, Pat Bright, Bob Dryden, George Agoglia, Tony Hendra, Sid Davis, Larraine Newman, Anna Uppstrom, John Dunn, and John Weidman. It was written by Brian Doyle-Murray, Bill Murray, Richard Belzer, Christopher Guest, John Weidman, Bob Tischler, Tony Hendra, Harold Ramis, Doug Kenney, and Bruce McCall; produced and engineered by Bob Tischler. The cover illustration (the infamous double-amputee frog cartoon) was by Sam Gross. Bits include The Dick Ballentine Phone-In Show (Belzer), Listener-Sponsored Radio (Bill Murray), Mr. Roberts (Mr. Rogers parody with Guest and Bill Murray) where he interviews a bass player (my favorite line: Mr. Roberts: Well, we’re gonna go to the Magic Kingdom. Bass Player: Ah, no, man. It’s too early for me. I gotta drive.), “Height Report Disco” (Bill Murray and Donna Detroit), Humpback Whales with Gas (Hendra), 2015-Year-Old Man (Belzer), Monolithic Oil Corporation Spot, and others. Some of the bits originally aired on the National Lampoon Radio Hour. 4-CD set now out has at least highlights from "TNFTS," as well as excerpts from Radio Dinner, Sex Drugs Rock&Roll and the End of the World, and some bits from the Radio Hour. Kind of patchwork (I bought it for Deteriorata and Magical Misery Tour basically), but it has at least some of the sketches you're asking about. Try Jerry's Records in Sq. Hill, Pittsburgh, Pa.. You can probably get the vinyl for no more than $5.00. His number is 412 422 4533. Or just look him up in Goldmine Magazine. A recent YouTube post features Michael Simmons, National Lampoon Editor, author of the popular column "Drinking Tips and Other War Stories" in a Foto Funny where he proves that a sobered up drunk can be as boring and obnoxious as an inebriated one. (Feb. 1988 .) The rare audio clip is Michael Simmons and Slewfoot, Live at the Other End, 1977. Michael, now a rock journalist for Mojo, the LA Weekly and other publications, consented to the post adding, "I don't know whether to kiss or kill you." http://www.youtube.com/watch?v=_SCdBArYbi8'''
year_published = 2025
clearnet = "https://www.marksverylarge.com/1997/10/30/1"
tags = ["comments", "funny,", "sick!”", "that’s", "“that’s"]
language = "en"
