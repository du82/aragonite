["https://www.marksverylarge.com/nlrh-intro"]
title = "National Lampoon Radio Hour  |  Mark's Very Large National Lampoon Site"
full_description = "The National Lampoon Radio Hour ran from November 17, 1973 to December 28, 1974, and was broadcast weekly on hundreds of radio stations throughout the U.S. It was one of the best radio comedy shows ever produced, and introduced many talented and now well-known perfomers to a national audience for the first time. Among the performers that appeared regularly or irregularly were Chevy Chase, John Belushi, Christopher Guest, Michael O’Donoghue, Bill Murray, Brian Doyle-Murray, Gilda Radner, Harry Shearer, Harold Ramis, Joe Flaherty, Richard Belzer, Tony Scheuren, Windy Craig, Flo & Eddie, George Coe, Gary Goodrow, Norman Rose, and Alice Playten, just to name a few. The show was the brainchild of NatLamp editor Michael O’Donoghue. After the success of the comedy album Radio Dinner, he was able to convince publisher Matty Simmons to let him do a weekly radio show. Teaming up with producer Bob Tischler, the talented engineer who had worked with O’Donoghue and Tony Hendra on Radio Dinner, the show successfully transfered the humor of the magazine to a radio format. The show was initially recorded at Bell Sound, but within a few months, a recording studio was built several floors above the magazine’s editorial offices on Madison Avenue in New York. Like the magazine, the show had a highly professional, understated style which hightened the effect of its often shocking sense of humor. The show used up an incredible amount of material each week and strained the resources of the magazine. As a result, it was cut to a half hour after 13 shows. It also had a hard time retaining national sponsors, partly due to the content of the show, and consequently did not do very well financially. O’Donoghue, drained of energy and patience, left the show—and the magazine—for good on Easter Sunday in 1974. John Belushi took over as creative director of the show for the remainder of its run. The difficulty in sustaining the show is evident in its increasing reliance on rerunning bits and even entire shows. Some of the later shows also feel more improvisational, with performers doing their favorite stock characters. This in itself wasn’t bad, but it made the show feel less varied as it wore on. I was still shocked and disappointed when, at the close of the December 1974 Christmas Show, Bill Murray, doing his “evil Santa” character, announced that the next show would be their last. The final show reprised the best bits from its entire run, ending with Michael O’Donoghue’s cryptic inside joke, “Honk! Honk! Why, it’s Wobbles the Goose!”"
