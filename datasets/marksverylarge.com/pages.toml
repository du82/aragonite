["https://www.marksverylarge.com/1998/05/05/17"]
title = "17. Loompanics Unlimited  |  Mark's Very Large National Lampoon Site"
full_description = "Q: The Library of Congress lists a reference to “Index to the National Lampoon by Michael Hoy (Loompanics), first four years only.” Have you heard of it? I was wondering if you know Michael Hoy, or if you had any assistance from him or “Loompanics Unlimited”? A: Don’t know him, but I have heard of Loompanics Unlimited and the Index. In the early ’70s, they used to run a small typewritten ad in the back of National Lampoon offering it. I get their catalog occasionally which seems to specialize in subversive literature, but I’ve never seen the Index for sale in it. Original material (excluding quoted material) © 1997-2024 Mark Simonson. Mark's Very Large National Lampoon Site is not affiliated with National Lampoon or National Lampoon Inc. Click here for the real thing."
