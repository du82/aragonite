["https://www.marksverylarge.com/where"]
title = "Where To Find Stuff  |  Mark's Very Large National Lampoon Site"
full_description = "Since I put up this site, many people have written to me asking where they can find or buy such-and-such issue, recording, whatever. The answer is, I really don’t know much about where you can find these things nowadays. My own collection was amassed years ago, when many of the items were new or not that old. I had a subscription to the magazine from 1974 on, and sent away for practically all the back issues NatLamp had available at the time. I also picked up a few early issues (at a premium) in the mid-seventies from a magazine/book store that carried a lot of used magazines and comic books. Since that time, I have not spent much time looking, and in fact, had not really looked at my own collection much until recently. The National Lampoon Complete DVD-ROM. This disc contains PDF files of all the regular monthly issues of the magazine, from the first issue (April 1970) to the last (November 1998). (Special issues and books are not included, unfortunately.) The scans are not super-high-resolution, but good enough for reading. Some of the issues they scanned from had pages missing, so a few things are missing here and there. Even so, it’s the easiest way to get back issues of the magazine if you just want to read them, and takes up a lot less space than the real thing. It may help you decide whether or not to acquire copies of the real thing. Because the PDFs were scanned using OCR, nearly all of the text is searchable from your favorite PDF reader software. I use this feature all the time to help answer questions that come up on the Answers page. The disc is unfortunately long out of print. You can still get it from Amazon for rather ridiculous prices if you want the actual disc and packaging, but happily some kind soul has made it available for download on the Internet Archive. Hopefully, it will continue to be available there. The Internet. If you found my site, you probably have heard about the internet. Here are some places on the internet where you might find old NatLamps ‘n’ stuff:"
