["https://www.marksverylarge.com/unanswered"]
title = "Unanswered  |  Mark's Very Large National Lampoon Site"
full_description = "Unanswered questions only. The most recent questions are at the top of the page. Click here to see All Questions. (Tip: You can use the Find command in your web browser to search this page, or use the Search box at the bottom of the menu to search the entire site.) Q. I’m looking for a cartoon that was in National Lampoon of a boy peeing on a Christmas tree and his sister is yelling to their mom saying, “Mom, he’s peeing on the Christmas tree!” If you could find it that it would wonderful! A. Indeed, but I couldn’t. If anyone else remembers this and knows which issue it appeared in, please comment below. Q. A cartoon by Tom Cheney that I always loved was, I’m pretty sure, in the Lampoon, but I don’t know what issue. It’s a drawing of a restaurant kitchen, and a waiter is popping his head through the kitchen door and he says, “Everyone’s complaining that the food tastes like shit, and the champagne is piss warm” or something along those lines. In the cartoon you see a chef sitting on a pot, and another chef peeing into a champagne bottle. I hope you can help. A. Sorry, I wasn’t able to find it, although it sounds vaguely familiar. If anyone else knows, please post a comment below. Q. My brother used to read the National Lampoon and would like to know which issue prognosticated what the Rolling Stones would look like in 50 years and the McDonalds customers served sign with tons of 0’s. A. I don’t remember either of those appearing in National Lampoon. I did a text search of the National Lampoon Complete DVD, but the closest I could find to the first one was a cartoon piece (by Buddy Hickerson) in the October 1985 issue called “When Rock Stars Were Kids”. It features Prince, Cyndi Lauper, Mick Jagger, etc., but no one else from the Stones. Q. I might not have that quote exactly right, but I keep thinking about a back-of-the book Lampoon comic strip from back in the day depicting his campaign staff bringing their presidential candidate on stage—who has a rat hanging out of his mouth. Afterwards they agree, “I don’t think anyone noticed.” It was sometime in the 70s, most likely when Nixon was prez."
