["https://www.marksverylarge.com/1998/07/02/25"]
title = "25. JFK Issue  |  Mark's Very Large National Lampoon Site"
full_description = "A: That would be February ’77—“Grand Fifth Term Inaugural Issue: JFK’s First 6,000 Days” which featured a silver-haired JFK on the cover. The whole issue was a big “what if…” about how things might have turned out had the assassin’s bullet missed JFK and hit Jackie instead. A very good issue—neatly skewering the Kennedy myth: US steers clear of Vietnam, but ends up in Northern Ireland instead. Original material (excluding quoted material) © 1997-2024 Mark Simonson. Mark's Very Large National Lampoon Site is not affiliated with National Lampoon or National Lampoon Inc. Click here for the real thing."
