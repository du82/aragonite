["https://marp.app/blog/marpit-v2-marp-core-v2-and-marp-cli-v1"]
title = "Marpit v2, Marp Core v2, and Marp CLI v1 | Blog | Marp"
description = "I'm so glad to announce shipping Marpit framework v2, Marp Core v2, and Marp CLI v1! Especially, Marp CLI is getting stable now!"
full_description = '''I'm so glad to announce shipping Marpit framework v2, Marp Core v2, and Marp CLI v1! Especially, Marp CLI is getting stable now! They are major update that may be including some breaking changes. However, we have not intended to include any drastic changes. We have recognized well that user hates to break the existing slide. The biggest reason why bumped major version is ending support for outdated Node.js 10. It has reached to End-of-Life and we are just following that. Marpit and Marp Core still can use in EOL Node 10, but we are just making a window time for transition. By the security reason, we don't recommend to use outdated Node.js. Release notes Marpit framework: v2.0.0 Breaking Marpit requires Node.js >= 10 to install (#284) Fixed Reset CSS columns in advanced background (#283) Changed Upgrade to PostCSS 8 (#260, #284) Upgrade Node and dependent packages to the latest version (#285) Removed Remove deprecated markdownItPlugins, the getter of plugin interface for markdown-it (#286) Marp Core: v2.0.0 Added Allow color customization through CSS variables in Gaia and Uncover theme (#209, #221) May break appearance of existing presentation if you have a slide with custom style. Changed Upgrade Marpit to v2.0.0 (#220) Upgrade Node LTS and dependent packages to the latest version (#222) Marp CLI: v1.0.0 Breaking Dropped Node 10 support (#338) Added Build Docker container image for ARM64 (#328, #339) Allow MARP_USER env for Docker image to set an explicit UID/GID (#334 by @davebaird) Test against Node 16 for Windows (#338) Changed Upgrade Marpit v2.0.0 and Marp Core v2.0.0 (#338) Upgrade Node and dependent packages to the latest version (#338) What's Next? I've posted about the unified docs, and future plans for our toolset in the last article. But it was a mistake! Marp team is still alone and I cannot take full-time working for that, so the most of planned features are delayed. Sorry for late. For helping us, contribution in Marp discussion forum will be good start. Marpit framework v3 We have ve already started for working Marpit v3 on v3 branch. It's going to be rewritten fully by TypeScript. We are planning to separate Marp slide specific plugins internally, for improvement of collaboration with other slide renderers. In addition, I want to support async conversion by returning Promise in render(). We also had considered about changing Markdown parser, but we decided not to change. Some Marp users are depending on third party plugins, and it would make a lot of breakings if changed. Thanks Over 5 years have passed from the first release of classic Marp. For keeping maintainability for long time, Marp ecosystem is still aiming to "minimal". And now, Marp has used by projects hosted on Microsoft, Google, and Facebook. In the last year, we opened our discussion forum to accept asking and reporting for the whole of Marp toolset. And we have received many feedbacks and contributions from users. Thanks for our community! Marp will keep a growth with users.'''
