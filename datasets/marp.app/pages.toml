description = """
Marp CLI v2 has supported brand-new page transitions for the bespoke HTML template. You can use this stable transition support in either Marp CLI v2.4.0+ or Marp for VS Code v2.5.0+.
Effective transitions will help make a dramatic presentation. Adding a touch of effects to slides is often common in great talks. By viewing HTML slide in the browser that supports View Transitions API (Chrome 110+), or Marp CLI with --preview option, you can start to use varied 33 transition effects out of the box, by just a simple definition transition directive.
Built-in transitions should be useful for 90% of Marp users. But what you can do if there are no effects you are satisfied with? Make your effects in CSS! Marp can register your custom animation set declared in CSS as a named transition, and use it in the Markdown slide."""
full_description = "Marp CLI v2 has supported brand-new page transitions for the bespoke HTML template. You can use this stable transition support in either Marp CLI v2.4.0+ or Marp for VS Code v2.5.0+. Effective transitions will help make a dramatic presentation. Adding a touch of effects to slides is often common in great talks. By viewing HTML slide in the browser that supports View Transitions API (Chrome 110+), or Marp CLI with --preview option, you can start to use varied 33 transition effects out of the box, by just a simple definition transition directive. Built-in transitions should be useful for 90% of Marp users. But what you can do if there are no effects you are satisfied with? Make your effects in CSS! Marp can register your custom animation set declared in CSS as a named transition, and use it in the Markdown slide. We are so excited to introduce a stable release of Marp Core v3, and Marp CLI v2 update with an entirely new slide transition experiment. Marp Core v3: MathJax rendering as default, updated default theme, and new components for auto-scaling. Marp CLI v2: Bundled core v3, and brand-new slide transition experiment with 33 built-in effects + CSS custom transitions. We are continuing development to make stable Marp tools. And today, I'm happy to announce Marp for VS Code has reached to the stable release v1! Tools of Marp ecosystem are made for potentially covering various situations, and especially Marp for VS Code is made for the daily use for the most of users. This extension can change the familiar Markdown preview into slides preview during editing Marp Markdown. You can write and edit slides by text rapidly together with checking the appearance of slides, and export into PDF/PPTX easily. Custom theme support is useful to create your own theme with CSS. In this release, we have added IntelliSense extension for Marp directives and got more affinity with VS Code features. It provides better experience as integrated environment to write the presentation. I'm so glad to announce shipping Marpit framework v2, Marp Core v2, and Marp CLI v1! Especially, Marp CLI is getting stable now! They are major update that may be including some breaking changes. However, we have not intended to include any drastic changes. We have recognized well that user hates to break the existing slide. The biggest reason why bumped major version is ending support for outdated Node.js 10. It has reached to End-of-Life and we are just following that. Marpit and Marp Core still can use in EOL Node 10, but we are just making a window time for transition. By the security reason, we don't recommend to use outdated Node.js."
