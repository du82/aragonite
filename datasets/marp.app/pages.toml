["https://marp.app/blog/the-story-of-marp-next"]
title = "The story of Marp Next | Blog | Marp"
description = "Today, I'm so excited to introduce the story of Marp Next! The full-rewritten Marp is not only just a writer. To be usable in various situations, we build a brand-new Marp ecosystem consisted of multiple modules."
full_description = '''The first version of Marp was released at almost 3 years ago. At first, it was started from a simple tool for personal usage called "mdSlide". And now, Marp has been used by a lot of users who would recognize the real value of the presentation writer. Marp is amassed around 8,000 stars until now. However, our headache brought from lacked maintainability to develop. We had received so many requests to the old Marp app, and it has to evolve to keep providing the best writing environment of presentation deck. Today, I'm so excited to introduce the story of Marp Next! The full-rewritten Marp is not only just a writer. To be usable in various situations, we build a brand-new Marp ecosystem consisted of multiple modules. They are developed with JavaScript and TypeScript, and much more maintainable than the previous Marp. Marp ecosystem Marp Next has two core components: Marpit framework and Marp Core. Tools by Marp ecosystem are usually based on these. Marpit Marpit is the skinny framework for creating HTML slide deck from Markdown. It is designed to convert Markdown into only minimum assets consisted of static HTML and CSS, and the output can convert into PDF slide deck by printing through Chrome / Chromium. Marpit has created for using as the base of Marp ecosystem, but it is also independent framework. You may integrate Marpit's Markdown conversion with your tool, even if it's not Marp: reveal.js, WebSlides, and so on. Marpit Markdown: Keep compatibillity with a plain Markdown document We had received many requests to the old Marp, about the additional syntax to help creating beautiful slide deck. On the other hand, we also have received a request that must respect Markdown syntax strictly. We have to deal with these contradicted issues. Additional syntax provided by Marpit should never break CommonMark document. Thus, the result of rendering keeps looking nice even if you open the Marpit Markdown in a general Markdown editor. And you can even extend the additional syntax via markdown-it plugins if you need. Theme CSS: Design your deck with clean markup Marpit has the theming system to allow designing everything of slides by CSS. The old Marp had the limited theming system and required deep diving to internal for customization: Build system, Sass, the logic of Marp app, and so on. So we had to create a brand-new theming system for easy customization of theme with only general CSS knowledge. Marpit's it only requires a pure CSS, and no additional knowledges! You have only to focus styling HTML semantic elements. It means that you can create theme CSS from now! In addition, Marpit has the pixel-perfect slide system like PowerPoint and Keynote. Theme creator never needs to worry about the responsive layout, and could provide design exactly as the author wanted with less effort. Inline SVG slide (Experimental) Our unique idea is wrapping each slides by inline SVG. It might feel a bit strange, but makes many advantages. Supports pixel-perfect scaling via style definition and realizes Zero-JS slide deck. Isolates Markdown contents and prevents that injected DOM by Marpit's advanced feature breaks design defined in theme CSS. Thanks to the power of SVG, we can keep a framework simple and maintainable. Marp Core is based on inline SVG slide by default. Marp Core Marp Core is a base converter for our projects extended from Marpit. In short, it is a battery-included Marpit. Marpit only has bare essential features, so it might have not enough to start writing your deck. Marp Core provides the practical syntax, additional features, and built-in themes. Many of the features are based on the old desktop app, and have improved to be suitable to Marpit. Of course, we added the new features for creating more beautiful deck. Built-in themes (Default, Gaia, and new Uncover theme) Included Emoji support 😁 KaTeX Math typesetting size global directive Auto scaling features (new) Fitting header via <!-- fit --> annotation Scale-down overflowed fence, code, and math block Applications Marp CLI Marp CLI is a CLI interface of Marpit and Marp Core converter. It's a Swiss-Army knife for Marp slide deck! You can use it right now by running npx @marp-team/marp-cli if Node.js is installed. Export to HTML, PDF, and image Watch the change of your Markdown and theme (--watch) Open preview window for presentation (--preview) Full-customizable engine based on Marpit framework Marp had a text editor originally, but you might think that want to write the slide deck with your favorite editor. If you use Vim, you would feel uncomfortable not to be usable Vim style key-binding. From now on, use Marp CLI's watch mode together with original Vim! And Marp CLI can create really practicable static HTML as like as a presentation mode! It is powered by deep integration with Bespoke.js. Thanks to Netlify, Now, and more hosting services, Marp CLI also brings a efficient Git management for creating slide deck just like GitPitch. I've created an example slide managed via GitHub repository as a good starter to help writing your slide deck. Try to use it via "Deploy to Netlify" button on README! Marp Web (tech demo) Marp Web is a Web interface of Marp presentation writer. It allows writing your slide deck as like as a traditional desktop app. The current Marp Web is just a tech demo. We are planning to re-implement Marp Web based on well-known framework (like React) for building SPA. Progressive Web Apps It made some strong oppositions by users that is using Marp in offline when an idea of migration to web-based app is proposed for keeping maintainability of Marp. It was caused that a thinking of PWA was not general at that time. And 2 years later, the time has come to use PWA! After the first access to https://web.marp.app/, Marp Web would be ready to use in both of online and offline. Online resources to use the web interface would be cached in your browser, and use them when network is offline. Use via any devices By migrating to the web-based app, Marp will be able using in mobile device: Android and iOS. That's sure it's well suited to the tablet device like iPad. Marp Web would work also in Chrome OS well. Marp especially has many users in the field of education, and supporting Chrome OS that has large share in its field is meaningful. Blazing-fast live preview ⚡️ We think Marp's important feature is a blazing-fast live preview. In the web-based app, realizing the same feature had many difficulties. In currently published tech-demo, you can try Marp's really fast preview on the web. The preview applies as soon as typing, and it would not block your typing even if you have a large Markdown slides over than 100 pages. Integrations The modulized Marp Core brought Marp integrations for some tools. Marp for VS Code Honestly, I don't think to want to make a new editor because there are many great Markdown editors in the world. I had been thinking it would be awesome if Marp could integrate with a something else powerful Markdown editor. And now, Marp can use in Visual Studio Code! It was realized because VS Code is using the same Markdown engine (markdown-it) as Marpit framework. Of course you can export slides as PDF and HTML easily, powered by Marp CLI. Marp React & Marp Vue (In development) Marp's blazing fast live-preview is not only for ours! We provide Marp renderer component into React and Vue. Both Marp React and Marp Vue have supported the incremental update using framework's virtual DOM, and they are been easy to build your app. Especially, Marp React would become to the base of the future of Marp Web. Migration plan Desktop app (yhatt/marp) If you are using an old Marp application, you should migrate to use Marp Next tools. I NEVER recommend continue to use the old Marp, because its maintainance has stopped 2 years ago and there is concern about security issues. In future, the main interface would become to Marp Web. We have bet to PWA technology that has a lot of advantages. The desktop app is planned as "Marp Desktop" but it just may become a wrapper of Web interface. I would stop publishing the old Marp and archive its repository if Marp Web has grown to become replacable the old Marp. Your slide deck Your Markdown slides written in the old Marp syntax should rewrite to suit to the brand-new Marp ecosystem. In a new Marp, we have reconsidered Markdown syntax based on feedback to the old Marp app. So, some syntaxs are losing compatibillity. Syntax In Marp Core, non-whitelisted HTML elements are disabled by default because of security reason. Currently our whitelist includes only <br> element. Some Marp Next tools has provided preference to enable HTML, but you should take care for enabling HTML in untrusted Markdown. Directives Directives would be parsed by YAML parser tuned for Marp (Marpit). Thus spot directive prefix * is changed to _ for keeping YAML syntax. $ prefix no longer required to global directives. Slide size still can choose from "16:9" and "4:3", through size global directive (provided by Marp Core). If you want to use custom size or you're using Marpit framework, please use theme CSS. page_number directive is renamed to paginate. template directive is renewed to use class directive. It can define HTML class per slides. prerender directive is removed. It brings user confusing about exported PDF quality. Image Background image ![bg]() has no filter applied by default. Try using ![bg opacity]() if you want. The inline image is no longer scalable by percentage ![50%](). (It's not supported in Firefox) Instead you can use width (w) and height (w) keyword to resize image as like as ![width:300px](). ![center]() won't work. It requires changing image to the block element and brings confusion to theme author. You can tweak style if you still want. <style> img[alt~='center'] { display: block; margin-left: auto; margin-right: auto; }</style>Copy Try Marp Next! Marp Next just focuses to build the ecosystem for Markdown slide deck with pure open source. We expect to expand Marp productivity together with open source community. We still have stood at the beginning of the brand-new ecosystem. Are you interested to Marp team and our ecosystem? We welcome to start your contribution! See our contributing guideline and get started! PS. GitHub Sponsors is also good contribution if you want to help my working for open source.'''
