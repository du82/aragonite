title = "Marp: Markdown Presentation Ecosystem"
description = "Marp (also known as the Markdown Presentation Ecosystem) provides an intuitive experience for creating beautiful slide decks. You only have to focus on writing your story in a Markdown document."
full_description = ".marp_svg__d{fill:none;stroke:#000;stroke-linecap:square;stroke-miterlimit:10;stroke-width:5px}Marp:Markdown Presentation EcosystemGet started!Find Marp tools on GitHub!Create beautiful slide decks using an intuitive Markdown experienceMarp (also known as the Markdown Presentation Ecosystem) provides an intuitive experience for creating beautiful slide decks. You only have to focus on writing your story in a Markdown document.The slides above are from generated directly from Marp CoreShow Markdown example...---theme: gaia_class: leadpaginate: truebackgroundColor: #fffbackgroundImage: url('https://marp.app/assets/hero-background.svg')---![bg left:40% 80%](https://marp.app/assets/marp.svg)# **Marp**Markdown Presentation Ecosystemhttps://marp.app/---# How to write slidesSplit pages by horizontal ruler (`---`). It's very simple! :satisfied:```markdown# Slide 1foobar---# Slide 2foobar```Based on CommonMarkIf you know how to write a document with Markdown, you already know how to write a Marp slide deck. Marp's format is based on CommonMark, a consistent Markdown specification. The only important difference is a ruler --- for splitting pages.Directives and extended syntaxSometimes simple text content isn't enough to emphasize your voice, so Marp supports a variety of directives and extended syntax (image syntax, math typesetting, auto-scaling, etc...) to create beautiful slides.Built-in themes and CSS themingOur core engine has 3 built-in themes called default, gaia, and uncover, to tell your story beautifully. If you'd rather customize your design, you can use Marp to tweak styles with Markdown, or create your own Marp theme with plain CSS.Export to HTML, PDF, and PowerPointHave you finished writing? It's time to share your deck! Marp can convert Markdown into presentation-ready HTML, PDF and PowerPoint files directly! (Powered by Google Chrome / Chromium)Marp family: The official toolsetThe Marp ecosystem contains a rich toolset to assist your work. Marp for VS Code is an extension that allows you to edit and preview slide Markdown and custom theming within VS Code. Marp CLI is a command line tool allows you to convert Markdown with a simple CLI interface. ... and much more!Pluggable architectureAs a matter of fact, Marp is essentially just a converter for Markdown. The Marp ecosystem is built on the Marpit framework, a skinny framework for creating HTML/CSS slide decks. It has a pluggable architecture and any developer can extend features via plugins.Fully open-sourceThe Marp team loves open source! All tools and related libraries are built by the Marp team and are MIT-licensed.Tools and integrationsMarp for VS CodeCreate slide decks written in Marp Markdown right in VS CodeEnhance VS Code's Markdown preview pane to support writing your beautiful presentations. You can preview the slide deck output as soon as you edit its Markdown.VS MarketplaceGitHubMarp CLIA CLI interface for Marp and Marpit based convertersThe Marp CLI is the swiss army knife of the Marp ecosystem. Convert your Markdown into various formats, watch changes, launch server for on-demand conversion, and customize the core engine.ReleasesnpmGitHubFor developersMarp CoreThe core of the Marp converterAll official Marp tooling uses this core as the engine. It is based on the Marpit framework and includes some extra features to help create beautiful slide decks.npmGitHubMarpit frameworkThe skinny framework for creating slide decks from MarkdownMarpit (independented from Marp) is the framework that transforms Markdown and CSS themes to slide decks composed of HTML/CSS. It is optimized to output only the minimum set of assets required.DocumentationnpmGitHubFind all of the Marp tools, integrations, and examples in the GitHub repository!Check out Marp GitHub repository..."
