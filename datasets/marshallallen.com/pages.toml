["https://www.marshallallen.com/about-marshall"]
title = "Marshall Allen | About Marshall"
description = "Award-winning ProPublica journalist and Never Pay First Bill author, Marshall Allen, share tactics and strategies that equip families and employers to save big money with better health care benefits."
full_description = "Hey, I’m Marshall Allen. I’ve spent more than fifteen years investigating the health care industry as a journalist, exposing the insidious ways the system preys on vulnerable Americans: price gouging, sloppy billing, fraud, insurance denials, unnecessary treatment and more. I wish I could say I’ve seen it all, but I haven’t. It sours me when I hear about people getting beaten down by the system. It’s become my personal mission to help individuals and employers understand the health care system and show how they can overcome the bullying and win. People who push back are getting great health care at a much lower cost. I love highlighting real-life examples of these victories so everyone can see how it's done.FEATURED ONSubscribe to my newsletter JoinWhat People Say Marshall Allen is one of the most influential and insightful journalists of our era. Never Pay The First Bill is a road map on how everyone can get a better deal on health care.Dr. Marty Makary — Johns Hopkins Bloomberg School of Public Health, Best-selling Author of The Price We Pay Marshall Allen tells it like it is in health care. He is competent, unbiased and his advice is accurate. If there was ever a practical guide that people could act on TODAY, it’s Never Pay the First Bill.Dr. Eric Bricker — Co-Founder of Compass Professional Health Services, Chief Medical Officer of AhealthcareZ.com In Never Pay the First Bill, Marshall Allen educates David on how to hurl stones at the healthcare system's Goliaths and defeat them. Rather than being powerless, Allen points out the advantages patients and employers have to triumph. Fighting back isn't easy, but it's better than being abused. Readers will never again be taken advantage of by the rigged medical system.Dr. Robert Pearl — Former CEO of The Permanente Medical Group, Author of Uncaring: How the Culture of Medicine Kills Doctors and PatientsCONTACT MESubmitThanks for submitting!FOLLOW MESubscribe to my Newsletter SHARE WITH MEShare Your Story"
