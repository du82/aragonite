["https://martin.kleppmann.com/2019/03/25/papoc-interleaving-anomalies.html"]
title = "Interleaving anomalies in collaborative text editors — Martin Kleppmann’s publications"
full_description = "Interleaving anomalies in collaborative text editors Martin Kleppmann, Victor B. F. Gomes, Dominic P. Mulligan, and Alastair R. Beresford 6th Workshop on Principles and Practice of Consistency for Distributed Data (PaPoC), Dresden, Germany, March 2019. Paper (open access) Paper (version of record) doi:10.1145/3301419.3323972 Slides Abstract Collaborative text editors allow two or more users to concurrently edit a shared document without merge conflicts. Such systems require an algorithm to provide convergence, ensuring all clients that have seen the same set of document edits are in the same state. Unfortunately convergence alone does not guarantee that a collaborative text editor is usable. Several published algorithms for collaborative text editing exhibit an undesirable anomaly in which concurrently inserted portions of text with a well-defined order may be randomly interleaved on a character-by-character basis, resulting in an unreadable jumble of letters. Although this anomaly appears to be known informally by some researchers in the field, we are not aware of any published work that fully explains or addresses it. We show that several algorithms suffer from this problem, explain its cause, and also identify a lesser variant of the anomaly that occurs in another algorithm. Moreover, we propose a specification of collaborative text editing that rules out the anomaly, and show how to prevent the lesser anomaly from occurring in one particular algorithm. Errata A few years after publication, we learned about some serious flaws in this paper: The definition of non-interleaving in Section 2.1 cannot be guaranteed by any algorithm. The algorithm presented in Section 3.1 does not guarantee convergence. Please see the Fugue paper for more details."
