["https://martin.kleppmann.com/2020/11/18/distributed-systems-and-elliptic-curves.html"]
title = "New courses on distributed systems and elliptic curve cryptography — Martin Kleppmann’s blog"
full_description = "New courses on distributed systems and elliptic curve cryptography Published by Martin Kleppmann on 18 Nov 2020. I have just published new educational materials that might be of interest to computing people: a new 8-lecture course on distributed systems, and a tutorial on elliptic curve cryptography. Distributed Systems Since last year I have been delivering an 8-lecture undergraduate course on distributed systems at the University of Cambridge. The first time I delivered it, I inherited the slides and exercises from the people who lectured it in previous years (Richard Mortier, Anil Madhavapeddy, Robert Watson, Jean Bacon, and Steven Hand), and I just used those materials with minor modifications. It was a good course, but it was getting quite dated (e.g. lots of material on CORBA, which is now of mostly historical interest). Therefore, this year I decided to do a thorough refresh of the course content, and wrote a brand new set of slides and lecture notes. Also, due to the pandemic we are not having any in-person lectures, so I recorded videos for all of the lectures. I decided to make all of this available publicly under a creative commons CC BY-SA license, which means that you’re welcome to use it freely (including incorporating it into your own work), provided that you give credit to me, and that you share your derived work under the same license. The result is here: Lecture notes (PDF) (including exercises) Slides: slideshow and printable (PDF) Lecture videos (YouTube) Course web page Solution notes for the exercises are available on demand (email me and convince me that you’re not a student trying to cheat). Cambridge supervisors can download the solution notes directly (Raven login required). The course is primarily designed for Cambridge undergraduate students, and it includes some cross-references to other courses. Many other courses also make their notes or slides publicly available, so you can still look them up if you’re not at Cambridge by going to the course web pages. (Many lecturers restrict their video recordings to Cambridge users only, so those might not be publicly available.) The distributed systems course comprises about 7 hours of video and 87 pages of lecture notes. It covers the following topics: Introduction: distributed systems, computer networks, and RPC System models: network faults, crash and Byzantine faults, synchrony assumptions Physical clocks, clock synchronisation, and causality Logical time, broadcast protocols (reliable, FIFO, causal, total order) Replication, quorum protocols, state machine replication Consensus, details on the Raft consensus algorithm Replica consistency, two-phase commit, linearizability, eventual consistency Case studies: collaboration software, Google’s Spanner The main focus of this course is on understanding the algorithms and the principles that allow us to build robust and reliable distributed systems. It uses examples of practical systems as motivation, and the videos include a few live demos of real distributed systems in action. The aim is to convey the fundamentals without being excessively theoretical; there are a few mathematical proofs in the exercises, but most of the discussion is informal and example-based. The level of this course is intended for second-year undergraduates. Our students at this level have reasonable fluency with mathematical notation, and some background in programming languages and operating systems, so that’s what this course assumes. Elliptic Curve Cryptography Another document I’m releasing today is called Implementing Curve25519/X25519: A Tutorial on Elliptic Curve Cryptography. There’s no video for this one, just a 30-page PDF. Many textbooks cover the concepts behind Elliptic Curve Cryptography (ECC), but few explain how to go from the equations to a working, fast, and secure implementation. On the other hand, while the code of many cryptographic libraries is available as open source, it can be rather opaque to the untrained eye, and it is rarely accompanied by detailed documentation explaining how the code came about and why it is correct. This tutorial bridges the gap between the mathematics and implementation of elliptic curve cryptography. It is written for readers who are new to cryptography, and it assumes no more mathematical background than most undergraduate computer science courses. Starting from first principles, this document shows how to derive every line of code in an implementation of the X25519 Diffie-Hellman key agreement scheme, based on the widely-used Curve25519 elliptic curve. The implementation is based on Dan Bernstein et al.’s TweetNaCl. It is fast and secure; in particular, it uses constant-time algorithms to prevent side-channel attacks. I wrote this because I wanted to learn how real implementations of ECC work, but I couldn’t find good resources that explained it, so I wrote the document as I figured it out step-by-step from a number of sources (and by doing a lot of the calculations myself). I hope others will also find it useful. If you found this post useful, please support me on Patreon so that I can write more like it! To get notified when I write something new, follow me on Bluesky or Mastodon, or enter your email address: I won't give your address to anyone else, won't send you any spam, and you can unsubscribe at any time."
