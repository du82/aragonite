title = "Martin Kleppmann’s website"
full_description = "Hello! I’m Dr. Martin Kleppmann. Briefly about myself: I am an Associate Professor at the University of Cambridge, working on local-first collaboration software and distributed systems security. I teach Concurrent and Distributed Systems and Cryptography and Protocol Engineering, and I'm one of the people behind the Automerge open source project. I was previously a research fellow in the Systems Research Group at TU Munich (2022–2023), and at the University of Cambridge (2015–2022). Before that I was a software engineer and startup founder: I co-founded Rapportive (acquired by LinkedIn in 2012) and Go Test It (acquired by Red Gate Software in 2009). In 2017 I published a book for O’Reilly, called Designing Data-Intensive Applications. It covers the architecture of a broad range of databases and distributed data processing systems, and it has thousands of five-star reviews on Amazon. A second edition co-authored with Chris Riccomini is due to appear in late 2025, and is now in early release. I have composed several musical works, including “Die Türme des Februar” (in German), a musical-dramatic adaptation of the book by Tonke Dragt, which premiered in 2007 with a cast of 150 people. If you have found my work useful, please support me on Patreon. The income from Patreon goes towards supporting my research collaborators. Thank you to my supporters! Feel free to contact me. Recent blog posts Things I have written recently. 05 Jul 2024: Pudding: user discovery for anonymity networks 04 Jan 2024: 2023 year in review 12 Oct 2022: Verifying distributed systems with Isabelle/HOL 03 Jan 2022: Book Review: The Future of Fusion Energy 01 Sep 2021: Several podcast interviews Full archive Highlights Older articles that have remained popular. 02 Dec 2020: Using Bloom filters to efficiently synchronise hash graphs 18 Nov 2020: New courses on distributed systems and elliptic curve cryptography 29 Sep 2020: Writing a book: is it worth it? 18 Jan 2018: Should you put several event types in the same Kafka topic? 08 Feb 2016: How to do distributed locking 11 May 2015: Please stop calling databases CP or AP 04 Mar 2015: Turning the database inside-out with Apache Samza 25 Nov 2014: Hermitage: Testing the “I” in ACID 05 Dec 2012: Schema evolution in Avro, Protocol Buffers and Thrift 07 Mar 2011: Accounting for Computer Scientists 05 May 2010: Valuation caps on convertible notes, explained with graphs Conference talks Events where I will be speaking or have spoken: 30 May 2024 at Local-First Conference 27 Feb 2024 at Local First (LoFi) meetup 06 Nov 2023 at IETF-118 Decentralization of the Internet Research Group 19 Oct 2023 at KASTEL Distinguished Lecture Series 27 Sep 2023 at ACM Tech Talks Full archive YouTube playlist of my talks Publications Work-in-progress drafts: Matthew Weidner and Martin Kleppmann. The Art of the Fugue: Minimizing Interleaving in Collaborative Text Editing. Preprint arXiv:2305.00583, November 2023. Books: Martin Kleppmann and Mitch Seymour. Secret Colors: A Gentle Introduction to Cryptography. Round Robin Publishing, April 2022. Martin Kleppmann. Designing Data-Intensive Applications. O’Reilly Media, March 2017. Peer-reviewed papers in journals and top-tier conferences: Joseph Gentle and Martin Kleppmann. Collaborative Text Editing with Eg-walker: Better, Faster, Smaller. 20th European Conference on Computer Systems (EuroSys), March 2025. doi:10.1145/3689031.3696076 Ceren Kocaoğullar, Daniel Hugenroth, Martin Kleppmann, and Alastair R. Beresford. Pudding: Private User Discovery in Anonymity Networks. IEEE Symposium on Security and Privacy (S&P), May 2024. doi:10.1109/SP54263.2024.00167 Geoffrey Litt, Sarah Lim, Martin Kleppmann, and Peter van Hardenberg. Peritext: A CRDT for Collaborative Rich Text Editing. Proceedings of the ACM on Human-Computer Interaction (PACMHCI), Volume 6, Issue CSCW2, Article 531, November 2022. doi:10.1145/3555644 Matthew Weidner, Martin Kleppmann, Daniel Hugenroth, and Alastair