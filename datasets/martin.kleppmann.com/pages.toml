["https://martin.kleppmann.com/2018/03/20/security-protocols-workshop.html"]
title = "From Secure Messaging to Secure Collaboration — Martin Kleppmann’s publications"
full_description = "From Secure Messaging to Secure Collaboration Martin Kleppmann, Stephan A. Kollmann, Diana A. Vasile and Alastair R. Beresford 26th International Workshop on Security Protocols, Cambridge, UK, March 2018. This paper received a Best Presentation Award. Paper (open access) Paper (version of record) doi:10.1007/978-3-030-03251-7_21 Slides Abstract We examine the security of collaboration systems, where several users access and contribute to some shared resource, document, or database. To protect such systems against malicious servers, we can build upon existing secure messaging protocols that provide end-to-end security. However, if we want to ensure the consistency of the shared data in the presence of malicious users, we require features that are not available in existing messaging protocols. We investigate the protocol failures that may arise when a new collaborator is added to a group, and discuss approaches for enforcing the integrity of the shared data."
