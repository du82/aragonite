full_description = "Die Türme des Februar: Eine Musical-Adaption Martin Kleppmann and Norbert Locher In Helma van Lierop-Debrauwer and Jana Mikota (eds). „Ich bin eine Märchenerzählerin. So wurde ich geboren.“ Universitätsverlag Siegen, April 2023. Paper (open access) doi:10.25819/ubsi/10415 Abstract Wir berichten über unsere Erfahrungen mit der Schaffung einer Bühnenfassung von Tonke Dragts Die Türme des Februar (nl. 1973, dt. 2004). Uraufgeführt wurde dieses Werk 2007 im Rahmen eines Projekts, welches zwei Gymnasien, einen Konzertchor sowie diverse Solisten umfassten. Etwa 150 Personen in allen Altersgruppen, von zehnjährigen Schüler:innen bis hin zu Ruheständler:innen, waren an den Aufführungen beteiligt. In diesem Kapitel schreiben wir über die pädagogische Konzeption hinter diesem Projekt sowie unsere Erkenntnisse über die Umsetzung eines Romans in eine Bühnenfassung."
