title = "About Martin Bean"
description = "About Martin Bean, his work, books he’s been involved with, and talks he has given."
full_description = 'About Hi! I’m Martin Bean, an experienced web developer and team lead based in the UK. Day to day I work with PHP, Laravel, JavaScript and TypeScript, and AWS. I have over 15 years’ experience in building web-based solutions and APIs for companies of all sizes, from start-ups to Fortune 500 companies. Outside of my full time role I run a company called Your Fight Site, where I help independent professional wrestling and combat sport promoters through two products: a multi-tenant CMS, and a video on demand platform called Your Fight Site VOD In my spare time I pursue an interest in reverse engineering, particularly PlayStation® 1 video games. This has been a hugely interesting and rewarding endeavour, where I’ve gone from knowing little about a computer’s internals to gaining a high-level understanding of hardware architecture, CPUs and registers, and both MIPS assembly and the C programming language. I’m a lifelong learner with a thirst for knowledge, and enjoy sharing this knowledge and enthusiam in both my work and my spare time. I’m also active in developer communities such as Stack Overflow and the Laracasts forums If you think I would make a great addition to your team, then I’m open to new roles and project engagements. Feel free to contact me for a no obligation chat. Books I was privileged to be involved in the creation of the following printed books: Technical Editor, Design Patterns in PHP and Laravel (Apress, 2017) { "@context": "http://schema.org/", "@type": "Book", "author": { "@type": "Person", "name": "Kelt Dockins" }, "bookFormat": "Paperback", "editor": { "@type": "Person", "name": "Martin Bean", "url": "/" }, "isbn": "9781484224502", "name": "Design Patterns in PHP and Laravel", "numberOfPages": 238, "publisher": { "@type": "Organization", "name": "Apress", "url": "https://www.apress.com" } } Contributor, A Field Guide to Freelancer Finances (FreeAgent, 2016) { "@context": "http://schema.org/", "@type": "Book", "bookFormat": "Pa