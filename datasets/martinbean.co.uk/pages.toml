full_description = "‘Video Streaming with Laravel’ course details Published 01 Mar 2022 by Martin Bean Recently on Twitter, I announced that I’d be creating my first premium video course covering how to build a subscription-based video streaming website with Laravel, Mux, and Stripe: 📢 Ever wanted to build your own @netflix or @laracasts? I’ll soon be recording a premium video course on creating a video streaming website with @laravelphp, @muxhq and @stripe. Join my newsletter to hear when, and for an exclusive early access discount!https://t.co/hltsjyWDsS— Martin Bean (@martinbean) February 7, 2022 I’ve started a newsletter where I’ll be sending updates and announcements for this course, as well as of course exclusive subscriber-only discounts and early access to the course. If you missed the first issue of the newsletter, then in it I announced what we’ll be covering, as well as the reasons I’ve decided to make this course, and when it will be ready. The course will touch on both front- and back-end development, using Laravel, Vue.js, Mux, and Stripe. So, without further ado, here is the outline! What the course will cover Installing and setting up Laravel 9 Building a multi-part video uploader with Vue.js Creating assets in Mux for videos Subscribing to Mux webhooks to know when video assets are ready Creating an admin panel to edit video details and to publish videos Creating Stripe subscriptions with Laravel Cashier And much more in between. So if you’ve ever wanted to build your own Netflix or even Laracasts, this is the course for you! I’ll be sending the second issue in the next couple of days, so if you’re interested in learning more then you can sign up here: https://www.getrevue.co/profile/martinbean"
