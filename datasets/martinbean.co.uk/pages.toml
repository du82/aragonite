["https://martinbean.co.uk/blog/2016/10/20/implementing-adr-in-laravel"]
title = "Implementing ADR in Laravel - Blog - Martin Bean"
description = "An example of implementing the Action–Domain–Responder pattern in Laravel."
full_description = '''Implementing ADR in Laravel Published 20 Oct 2016 by Martin Bean The MVC pattern has become widespread in web development, but it was never meant to be used in websites and web applications. Different people have different interpretations of MVC, and what code should go where. To this end, a newer pattern meant to build upon MVC but more suited to web applications is ADR: Action–Domain–Responder. ADR groups the functionality of applications into actions. Actions execute any business logic for that action, before passing the result to a responder where it is presented as a response. As first glance, it seems similar to MVC but it provides a more clear separation of concerns, and there’s no argument as to what goes where. For example, in an MVC application, where do you set response headers? The controller? A view class? There’s no definitive answer whereas with ADR there is: the responder class. Giving the similarities, it’s also easy to convert an existing MVC application to follow the ADR pattern. So let’s look at implementing the ADR pattern in Laravel. Directory Structure As we’re not going to be using MVC, we can be a bit more creative in where to store things. A good idea is to keep action, domain, and responder classes together. So if we had a blog, a simple directory structure may look like this: /app /Blog /Actions ListPostsAction.php ViewPostAction.php /Domain /Collections PostCollection.php /Entities Post.php /Repositories PostRepository.php /Responders ListPostsResponder.php ViewPostResponder.php This makes searching for classes relating to a certain part of your business domain easier. “I need to find a blog action class. Well that will be in app/Blog/Actions.” Routing From version 8, Laravel no longer requires your controller classes to reside in a particular directory, so you can use the new class-based syntax to reference your actions as controllers: use App\Blog\Actions\ListPostsAction; use App\Blog\Actions\ViewPostAction; Route::get('/blog', ListPostsAction::class); Route::get('/blog/{article}', ViewPostAction::class); Actions As above, actions are just classes that represent one specific action in your application. Listing blog posts is one such action, so we name the class accordingly. An implementation may look like this: namespace App\Blog\Actions; use App\Blog\Domain\Repositories\PostRepository; use App\Blog\Responders\ListPostsResponder; class ListPostsAction { protected $posts; protected $responder; public function __construct(PostRepository $posts, ListPostsResponder $responder) { $this->posts = $posts; $this->responder = $responder; } public function __invoke() { $posts = $this->posts->all(); return $this->responder($posts); } } As the action class would be resolved by Laravel’s service container during routing, we can type-hint the dependencies our actions needs in its constructor. So we inject a post repository and the action’s corresponding responder class. In the __invoke method (where the action does its work), we simply retrieve a collection of posts and then pass it to our (not-yet-existing) responder class. Let’s create that class! Responders A responder class takes some domain data and displays it. It’s only job is to make a response, so it’s akin to a presenter in that instance. As it only has one job, I make the class invokable (meaning it only has a single method: __invoke). namespace App\Blog\Responders; use Illuminate\Database\Eloquent\Collection; class ListPostsResponder { public function __invoke(Collection $posts) { return view('post.index', compact('posts')); } } Nothing too advanced here. The responder is given a collection of Post models and renders it in a view. Responders are where you perform any logic related to returning a response. So it’s here you’d set any headers (i.e. cache expiration) or render a JSON representation if requested by the user: use Illuminate\Http\JsonResponse; use Illuminate\Http\Request; use Illuminate\Support\Collection; class ListPostsResponder { protected $request; public function __construct(Request $request) { $this->request = $request; } public function __invoke(Collection $posts) { if ($this->request->expectsJson()) { return new JsonResponse([ 'data' => $posts, ]); } return view('post.index', compact('posts')); } } The ListPostsResponder and its dependencies will be resolved by the service container, so we can inject the current Request instance. Conclusion Following the ADR pattern will see an increase in the number of classes in your application (as each action has its own class, rather than being a method in a controller class), but it does mean each class has a single responsibility and is named after the task it’s performing. In a large codebase, it can become difficult to track down which controller an action is in, especially if working with many people who have different ideas of how things should be structured. What are your thoughts on ADR? Are you already using it? Think it may be appropriate for your next project? I would love to hear your thoughts in the comments.'''
