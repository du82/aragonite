["https://martinbean.co.uk/blog/2018/10/16/using-private-repositories-in-composer-on-heroku"]
title = "Using Private Repositories in Composer on Heroku - Blog - Martin Bean"
description = "How to use private packages on Bitbucket as Composer dependencies for PHP projects on Heroku."
full_description = '''Using Private Repositories in Composer on Heroku Published 16 Oct 2018 by Martin Bean I’m a big fan of Heroku. I enjoy writing code, but I don’t enjoy wrangling servers to run my code. Heroku is a “platform-as-a-service” (PaaS) provider, meaning it provides a hosting platform and all you have to do is push code; it will configure load-balanced servers and services for you. Another service I use is Bitbucket. Bitbucket is great for hosting private repositories if you’re boot-strapping or don’t want to pay GitHub for private repositories. I use Bitbucket to host the source code for my personal projects that are closed source. If you’re working on personal projects then you may also host the source code of packages in private repositories. To use these private packages as Composer dependencies in an application you deploy to Heroku, you’ll need to go through some configuration steps. The steps are roughly: Create an OAuth consumer in your Bitbucket account. Add a COMPOSER_AUTH environment variable to your Heroku application. Set the repository URL in your composer.json file. Create an OAuth consumer in Bitbucket Sign in to your Bitbucket account: https://bitbucket.org/account/signin/ Click your avatar in the bottom-left of the screen. Click on “Bitbucket settings”. Choose “OAuth” from the “Access Management” section. Click the “Add consumer” button under the “OAuth consumers” heading. Set the name to “Heroku” and add a dummy callback URL; something like “https://example.com” is fine. Give the consumer the read repositories permission, and click “Save”. You’ll now have a new consumer. Make a note of its Key and Secret values. Add environment variable to Heroku You’ll now need to add a COMPOSER_AUTH environment variable to your Heroku application. As the name suggests, it specifies to Composer how to authenticate access private repositories. Documentation for this environment variable (and other available variables) is here: https://getcomposer.org/doc/03-cli.md#composer-auth The environment variable’s value with be a JSON object. The object should look like this: { "bitbucket-oauth": { "bitbucket.org": { "consumer-key": "XXX", "consumer-secret": "XXX" } } } Obviously, replace the XXX values with the key and secret that was generated when you created your OAuth consumer on Bitbucket. Now, set the environment variable in your Heroku app. You can either use the Heroku dashboard or the Heroku CLI. Setting an environment variable using the CLI looks like this: $ heroku config:set COMPOSER_AUTH='{ \ "bitbucket-oauth": { \ "bitbucket.org": { \ "consumer-key": "XXX", \ "consumer-secret": "XXX" \ } \ } \ }' --app name-of-your-app Be sure to use the actual name of your application for the --app flag. Configure the repository URL The final step to be able to use a private hosted package is to add to your composer.json file as a dependency, and set its URL. Add a repositories key to your composer.json file if one does not exist already. It should be an array of objects. Each object should have a type and a url value. For packages hosted on Bitbucket, the type would be vcs and the URL would be the HTTPS URL of the repository, i.e. { "repositories": [ { "type": "vcs", "url": "https://bitbucket.org/your-username/your-repository-name.git" } ] } It’s important you use the HTTPS URL, as the SSH URL does not work when authenticating using OAuth. Finally, add the name of your package as it is in its own composer.json file as a dependency of your application: { "require": { "your-vendor-name/your-package-name": "dev-master" }, "repositories": [ { "type": "vcs", "url": "https://bitbucket.org/your-username/your-repository-name.git" } ] } Commit the changes. Finishing up Now, when you next deploy your application to Heroku (using git push heroku), if your consumer key and secret, repository URL, and package name are all correct; Heroku should use OAuth to authenticate with Bitbucket and be able to pull down your package’s source code!'''
