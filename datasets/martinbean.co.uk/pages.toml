["https://martinbean.co.uk/blog/2018/06/15/protect-eloquent-models-from-being-updated-or-deleted"]
title = "Protect Eloquent Models From Being Updated or Deleted - Blog - Martin Bean"
description = "How to protect Eloquent models in your Laravel application from being updated or deleted."
full_description = '''Protect Eloquent Models From Being Updated or Deleted Published 15 Jun 2018 by Martin Bean Some times in applications, you define models that are meant to be created only and never updated nor deleted. Things like audit logs, balance adjustments, etc. Once created, these models should exist and never be altered or discarded. I faced this scenario in an application recently. I had Charge and Refund models. Similar to Stripe’s entities of the same name, a charge could be created but should then never be updated and deleted (and the same with refunds). The reason being: these models are related to accounting. We should never change financial data after the fact. To stop instances of these models from being updated or deleted, I created some traits that I can apply to my models. They look like this: namespace App\Models\Concerns; trait CannotBeDeleted { final public function delete() { throw new \RuntimeException('Model cannot be deleted.'); } } namespace App\Models\Concerns; trait CannotBeUpdated { final public function update(array $attributes = [], array $options = []) { throw new \RuntimeException('Model cannot be updated.'); } final protected function performUpdate(Builder $query) { throw new \RuntimeException('Model cannot be updated.'); } } When applied to an Eloquent model… namespace App\Models; use App\Models\Concerns\CannotBeDeleted; use App\Models\Concerns\CannotBeUpdated; use Illuminate\Database\Eloquent\Model; class Charge extends Model { use CannotBeDeleted; use CannotBeUpdated; } …they override Eloquent’s methods for deleting and updating. Overriding the performUpdate() method means it’ll also catch any attempts to update instances using save() calls. It’s also possible to combine these traits in a third trait: namespace App\Models\Concerns; trait CanOnlyBeCreated { use CannotBeDeleted; use CannotBeUpdated; } This means you only need to apply a single trait to your model if you wish: namespace App\Models; use App\Models\Concerns\CanOnlyBeCreated; use Illuminate\Database\Eloquent\Model; class Charge extends Model { use CanOnlyBeCreated; } Let me know what you think of this approach or if you have your own, alternative solution to this problem.'''
