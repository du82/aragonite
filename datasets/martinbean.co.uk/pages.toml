["https://martinbean.co.uk/blog/2016/11/07/remove-add-to-itunes-as-a-spoken-track-on-macos"]
title = "Remove “Add to iTunes as a Spoken Track” in macOS - Blog - Martin Bean"
description = "How to remove the annoying “Add to iTunes as a Spoken Track” context menu item in macOS."
full_description = "Remove “Add to iTunes as a Spoken Track” in macOS Published 07 Nov 2016 by Martin Bean If you’re a web developer and use macOS then I’m sure you’ve done it: hit “Add to iTunes as a Spoken Track” from the context menu instead of “Inspect” in Google Chrome. Luckily, this menu item can be removed. And it’s not in the place you would expect it to be. Open System Preferences. Choose Keyboard. Select the Shortcuts tab. Choose Services from the left-hand pane. Within the Text group you will see Add to iTunes as a Spoken Track. Un-check. And that’s it! No more accidentally adding highlighted text as a spoken track to iTunes!"
