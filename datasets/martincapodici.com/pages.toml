full_description = 'How to make Windows 11 livable Posted on June 1, 2023June 5, 2023 by Martin Bring back the old File Explorer right-click menu Enable the old menu for the explorer shell. The one that had everything on it rather than just 6 or so things! Like this: To do this, run these from the “cmd” command prompt. (This will close any explorer windows by the way). reg.exe add "HKCU\Software\Classes\CLSID\{86ca1aa0-34aa-4e8b-a509-50c905bae2a2}\InprocServer32" /f /ve taskkill /f /im explorer.exe explorer Add VSCode to the context menu Want this? (The bottom option below) The easiest way to do this is check the 2 options when installing: If you have already installed VSCode, no problem. Just download the installer and install again! Install 7z Install 7z to extract zip, 7z, tar and gz files: https://www.7-zip.org/download.html More to come…'
