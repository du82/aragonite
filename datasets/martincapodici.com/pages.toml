full_description = "Learning List Posted on April 10, 2023July 27, 2023 by Martin This is the stuff I want to read and learn at the moment: General Learning Stuff Effective Spaced Repetition – https://borretti.me/article/effective-spaced-repetition – because I think this will speed up my learning of other topics. Update: I have read most of this (all of the text and maybe 10 of the examples), and am trying it in practice now. http://blog.ezyang.com/2019/05/pytorch-internals/ How to code in Python 3 – https://www.digitalocean.com/community/books/digitalocean-ebook-how-to-code-in-python – to speed up when I need to do Python machine learning exercises. Voice Training | Free your voice to empower your personality – https://www.udemy.com/course/voice-training-free-your-voice-to-empower-your-personality/ – because I would like to create some Youtube programming videos, and I want them to be great. Machine Learning CSC 321 Winter 2018 – Intro to Neural Networks and Machine Learning – https://www.cs.toronto.edu/~rgrosse/courses/csc321_2018/ – so I can keep up when studying Neural Networks: Zero to Hero There is a git repo of answers here https://github.com/liuguanxiong/CSC321 by Guanxiong Liu Neural Networks: Zero to Hero – https://github.com/karpathy/nn-zero-to-hero Blog Post: LLM Engineering https://huyenchip.com/2023/04/11/llm-engineering.html https://www.deeplearningbook.org/ https://towardsdatascience.com/perplexity-intuition-and-derivation-105dd481c8f3 https://towardsdatascience.com/the-intuition-behind-shannons-entropy-e74820fe9800 TBC Some course on calculus / linear algebra to brush up TBC Some course on PyTorch Computers in general cpu.land – a small course about learning how Linux works in more detail"
