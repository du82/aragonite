["https://martincapodici.com/2023/07/19/modal-com-and-nanogpt-continued-producing-output-using-tiktoken-for-bigger-tokens"]
title = "Modal.com and NanoGPT continued: producing output; using tiktoken for bigger tokens – Martin Capodici"
