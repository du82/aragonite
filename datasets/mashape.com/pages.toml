full_description = "Gunjan AggarwalGunjan Aggarwal brings extensive experience in leading HR functions for large scale corporate enterprises, across a diversity of international and vertical industries. As Chief People Officer at Kong, she oversees the company’s global people strategy, recruitment, and drives innovative initiatives that foster employee growth and organizational success.Gunjan joins Kong from Confluent, where she served as their Chief People Officer and was instrumental in scaling the company’s talent strategy post-IPO. She was also the Chief People Officer at RingCentral and RELX Group, a FTSE 15 data analytics company. Throughout her career, Gunjan has been a passionate advocate for innovation, authentic leadership, and a diverse culture.Gunjan holds a BS in Electronics & Communications from Jamia Millia Islamia (JMI) in New Delhi, where she graduated Summa Cum Laude. She earned an MBA in HR from XLRI Jamshedpur, where she was the valedictorian for two consecutive years and won the Citibank Leadership Award. Additionally, she has received academic training in HR management at Harvard University.Gunjan also serves as an advisor to Canvas Space, a Web 3.0 startup helping creators monetize their creations. In the past, Gunjan has contributed her expertise as an advisory board member to CanGrade, a Harvard-based analytics recruiting startup, and Rubia, a non-profit supporting Afghan women. She currently resides with her family in the San Francisco Bay Area."
