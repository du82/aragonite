["https://mashape.com/compliance"]
title = "Trust and Compliance at Kong  | Kong Inc."
full_description = "Kong KonnectKong Konnect is an API lifecycle management platform designed from the ground up for the cloud native era and delivered as a service. This platform lets you build modern applications better, faster, and more securely. The control plane is hosted in the cloud by Kong, while you can choose to either host the data plane yourself in your preferred network environment or let Kong manage it for you in the cloud. Learn more here. Kong Gateway EnterpriseKong Gateway Enterprise is a fast, feature-advanced, and secure API management solution built on Kong Gateway, the world’s most adopted and performant API gateway. An API gateway is a reverse proxy that lets you manage, configure, and route requests to your APIs. Kong MeshKong Mesh is an enterprise service mesh that runs on both Kubernetes and virtual machines (VMs) on any cloud and multi-cluster. Built on top of CNCF’s Kuma and Envoy, Kong Mesh enables microservices transformation. Kong InsomniaKong Insomnia is a collaborative API client and design tool for quickly building and testing APIs. The open source product is offered for free or with a limited SaaS service for a monthly per-user fee. It’s also offered to enterprise customers. Please contact your sales representative — or see the introduction to Kong’s offerings for Legal and Procurement teams."
