full_description = "Joe EskenaziJoe Eskenazi brings over 20 years of diverse experience in sales and business development, with a focus on building high-performance sales organizations and driving accelerated revenue growth. As Chief Revenue Officer at Kong, he oversees the company’s global sales strategy and functions, including Direct Sales, Sales Engineering, Sales and Business Development Representatives, Channels, Revenue Operations, and Enablement.Prior to joining Kong, Joe served as the SVP of Sales & Success for the Americas at Sprinklr. There, he played a key role in scaling Sprinklr’s revenue engine from its early stages through its IPO, helping Sprinklr reach over $700 million in annual recurring revenue. Joe has also held key leadership and individual contributor positions at Tenfold, Fuze, Aggregate Knowledge (Neustar), Adchemy (acquired by Walmart Labs), IBM, and RCM Technologies. He has extensive experience in both SaaS and on-premises enterprise technology solutions, managing multi-million dollar deals with companies ranging from mid-market to Fortune 100. Joe holds an MBA from the USC Marshall School of Business and a BA in Communications, with a minor in Sports Management, from the University of California, Santa Barbara."
