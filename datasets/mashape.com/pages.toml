title = "Kong Inc."
full_description = "Brand Guidelines These guidelines describe the ethos of the Kong brand and provide a common framework for the cohesive and meaningful use of the brand across the Kong community. Brand Assets All elements of the official Kong logo are available for download here. Do not edit, change, distort, recolor or reconfigure the logo in any way. Kong BrandThese guidelines describe the ethos of the Kong brand and provide a common framework for the cohesive and meaningful use of the brand across the Kong community.Brand Guidelines These guidelines describe the ethos of the Kong brand and provide a common framework for the cohesive and meaningful use of the brand across the Kong community.Brand Assets All elements of the official Kong logo are available for download here. Do not edit, change, distort, recolor or reconfigure the logo in any way.Use of brand elementsGeneralDo not use Kong’s name, logos or screenshots (“brand elements”) in ways that may be confusing, misleading or suggestive of Kong’s sponsorship, endorsement or affiliation. For example, your name and logo should be more prominent than the Kong name or logo. And be sure not to edit or change the Kong logo — we like it how it is!Advertising, Promotional and Sales MaterialsCheck with us before using the Kong logo on any outside websites, products, packaging, manuals or for other commercial or product use. It’s ok to say in text “works with Kong” or “compatible with Kong” (as long as it’s true!).Education and Instruction (eBooks, Guides, Publications and Conferences)You can use Kong’s brand elements for educational and instructional purposes, but it should not be confusing or misleading, or suggest Kong’s sponsorship. We generally do not allow use of our logos or screenshots on book covers, for example. When using our brand elements, be sure to include the following statement (or a similar statement) in your printed materials: “(Title) is not affiliated with or otherwise sponsored by Kong, Inc.”Products, Websites, Names and LogosDo not use Kong’s name as a part of another company or service name, website name, trade name or product name. Also do not use our logo or incorporate our logo into another one. Don’t use a domain name containing “kong” or any confusingly similar words.Linking to KongIf you are a user of Kong and would like to use the Kong logo to link to our site, you can do so as long as it meets the rest of these brand guidelines. For example, “we use Kong! [linked logo or link near logo]” or “here’s a photo set (running on Kong!).”MerchandiseWhile we make lots of t-shirts and other swag with our logo on them, we generally do not allow third parties to make, sell or give away anything with the Kong name or logo on it.By using Kong brand elements, you agree to the Kong Inc. Terms of Service, these Kong branding guidelines, and all Kong rules and policies, as may be updated from time to time. You also acknowledge that Kong is the sole owner of Kong trademarks, promise not to interfere with Kong’s rights in them and acknowledge that goodwill derived from their use accrues only to Kong. Kong may review the use of branding elements at any time and reserves the right to terminate or modify any use."
