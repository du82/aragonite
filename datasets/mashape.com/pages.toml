["https://mashape.com/company/press-room/press-release/kong-expands-in-london-"]
title = "Kong Expands in London to Meet Growing Demand for API Platform Solutions   | Kong Inc."
full_description = "October 16, 20242 min readKong Expands in London to Meet Growing Demand for API Platform Solutions LONDON, October 16, 2024 – Kong Inc., a leading developer of cloud API technologies, today announced the expansion of its London office in The Halkin on 10 Lower Thames Street. Backed by high profile investors including A16z and Jeff Bezos, this latest growth comes as the company continues to attract attention across the UK for its cloud-native API platform, particularly in sectors such as financial services, pharmaceuticals, e-commerce, and government. Kong’s expanded London base reflects the company’s commitment to enabling organisations to become API-first, helping them securely accelerate AI adoption and to build the digital infrastructure necessary for the future. The new London office will continue to serve as a hub for Kong’s growing team, which now includes around 70 employees in the UK. Kong has seen significant customer growth across the UK and Europe, with its customer base in the region expanding by 90% in the past fiscal year. The company plans to invest more than $3M into the region over the next year. “We are thrilled to continue to grow our presence in London, which will better equip our teams to serve our growing customer base in the UK,” said Carl Mattsson, Vice President & GM of EMEA at Kong. “We aim to delight our customers with the best, and most performant API technology platform solutions available today. Our tools enable them to leverage AI and APIs to create new business opportunities, speed up time to market, and deliver superior products and services.”Kong’s API platform, including its flagship solution Kong Konnect, the API platform for AI, is critical for companies looking to securely adopt AI and integrate GenAI applications. The industry leading Kong AI Gateway provides developers with the tools to build safe and secure AI applications, ensuring seamless integration, robust AI traffic management, and advanced security features that improves data privacy, security, and compliance, all while optimising performance of APIs and AI capabilities at scale.As part of its expansion, Kong is actively hiring across all departments in the UK, including Sales, Engineering, and Customer Experience. For more information on open roles and to apply, please visit https://konghq.com/careers. About Kong Inc.Kong Inc., a leading developer of cloud API technologies, is on a mission to enable companies around the world to become “API-first” and securely accelerate AI adoption. Kong helps organizations globally — from startups to Fortune 500 enterprises — unleash developer productivity, build securely, and accelerate time to market. For more information about Kong, please visit www.konghq.com or follow us on X @thekonginc.Press Contact:Kelley FlynnPress@konghq.com"
