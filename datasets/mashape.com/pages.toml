["https://mashape.com/blog/learning-center/what-is-a-service-mesh"]
title = "Beginner's Guide: What is a Service Mesh?   | Kong Inc."
description = "Learn about service mesh, its use cases, and benefits in this informative article. Discover how service mesh can enhance your network architecture. Learn more!"
full_description = "Learning CenterJuly 24, 202421 min readWhat is a Service Mesh?KongA service mesh is a mechanism for managing communications between the various individual services that make up modern applications in a microservice-based system.When a service mesh is applied, all inter-service communication is routed through proxies, which can be used to implement networking features such as encryption and load balancing. The service mesh decouples the network logic from the application or business logic of each microservice so that it can be implemented and managed consistently across the whole system.The dedicated infrastructure layer of the service mesh is something of a complimentary piece of technology to an API gateway. But a service mesh only handles communication between services that make up a system, while an API gateway decouples the underlying system from the API that is exposed to clients (which can be other systems within the organization or external clients).The difference between API gateway vs service mesh is sometimes characterized as north-south (API gateway) versus east-west (service mesh) communication, but that's not strictly accurate.While the service mesh pattern was designed to handle network connectivity between microservices, it can also be applied to other architectures (monolithic, mini-services, serverless) wherever there are multiple services communicating across a network.In this article, we'll explore what a service mesh is, how it works, and how it can efficiently handle challenges like routing or load balancing. We'll also learn about the different components in a service mesh and see benefits and challenges a service mesh imposes and how you can overcome them.How Does a Service Mesh Work?Service mesh implementations usually have two main components: the data plane and the control plane.The data plane is a network proxy replicated alongside each microservice (known as a sidecar), which manages all inbound and outbound network traffic on behalf of the microservice. As part of this, it may perform service discovery, load balancing, security and reliability functions. The service and sidecar should be deployed on the same host and if your deployment is containerized in the same pod.The Data PlaneThe data plane is made up of services running alongside sidecar proxies. The services handle business logic, while proxies sit between them and other services. All traffic, ingress, and egress occur through the proxies, which are responsible for routing (proxying) traffic to other services.Fig. 1: Service mesh data planeMany features provided by the service mesh work at the request level, making sidecars Layer 7 proxies. By operating at this layer, service meshes provide capabilities like intelligent load balancing based on observed latency, or provide sensible and consistent timeouts for requests.Sidecars also provide functionality at the connection level. For example, sidecars can provide functionality like Mutual Transport Layer Security (mTLS), allowing each party in the communication to validate the certificate of the other.The Control PlaneProxies need to be configured. This is done through the control plane, which consists of several services that provide administrative functionality over the service mesh and provides an interface to configure the behavior of the data plane and for the proxies to coordinate their actions.Fig. 2: Service mesh architectureOperators interact with the service mesh through the control plane by using a CLI or API. For example, operators work through the control plane to define routing rules, create circuit breakers, or enforce access control.Depending on the implementation, you can use the control plane to export observability data such as metrics, logs, and traces.Fig. 3: How a service mesh worksTo learn more about how a service mesh works, see Understanding a Service Mesh Architecture.How is Service Mesh different from an API Gateway?At first glance, the functionality of a service mesh and an API gateway seem to be quite similar. However, they have some key differences that make each of them important in specific use cases. Both a service mesh and an API gateway handle a control plane. While the service mesh controls internal service-to-service communication between applications, an API gateway routes external client requests to the appropriate backend service. The traffic management of the service mesh is known as east-west traffic control inside a cluster, while API gateways handle north-south traffic. The API gateway controls regulation of API services like authentication and authorization. In contrast, a service mesh handles functions like load balancing and encryption between services.Another distinction between an API gateway and a service mesh is the layer at which they operate. A service mesh primarily works and exists at L4, but it can also do select functions at L7 like request-level metrics and tracing. An API Gateway almost exclusively operates at L7, handling HTTP/HTTPS requests into the cluster. Despite where they operate, their placement in a Kubernetes system is distinct. An API gateway acts as a wall on the edge of a system between the Kubernetes service and additional microservices. The service mesh is in its own unique instance as a sidecar proxy, and it is not exposed to external clients. Understanding Service Mesh vs MicroservicesIn a microservice architecture, an application is broken up into multiple loosely coupled services that communicate over a network. Each microservice is responsible for a specific element of business logic. For example, an online shopping system might include individual services to handle stock control, shopping cart management, and payments.Microservices provide several advantages over a traditional, monolithic design. As each service is developed and deployed independently, teams can embrace the benefits of agile practices and roll out updates more frequently. Individual services can be scaled independently, and if one service fails, it does not take the rest of the system down with it.Manage Network CommunicationService mesh was introduced as a way of managing the communication between the services in a microservice-based system.As the individual services are often written in different languages, implementing network logic as part of each service can duplicate effort. Even if the same code is reused by different microservices, there's a risk of inconsistencies as changes must be prioritized and implemented by each team alongside enhancements to the microservices core functionality.Just as a microservice architecture enables multiple teams to work concurrently on different services and deploy them separately, using a service mesh enables those teams to focus on delivering business logic and not concern themselves with the implementation of networking functionality. With a service mesh, network communication can be simplified into one inclusive client with automated processes, freeing up available human resources. Why Do You Need a Service Mesh?Once upon a time, programs were developed and deployed as a single application. Called monolithic architecture, this traditional approach worked fine for simple applications, but it becomes a burden as applications grow complex and the codebase swells.That's why modern organizations typically move from monolithic architecture to microservices architectures. By allowing teams to independently work on the application in small parts (called microservices), applications can be modularly developed as a collection of services. But as the number of services grow, you need to ensure connection between services is fast, smooth, and resilient.Enter service mesh.Service Mesh: Benefits and ChallengesDistributed systems split applications into distinct services. While this architectural type has many advantages (like faster development time, making changes easier to implement, and ensuring resilience), it also introduces some challenges (like service discovery, efficient routing, and intelligent load balancing). Many of these challenges are cross-cutting, requiring multiple services to implement such functionalities independently and redundantly.The service mesh layer allows applications to offload those implementations to the platform level. It also provides distinct advantages in the areas of observability, reliability, and security.Improved Observability and MonitoringOne primary benefit of the service mesh is to enhance observability. A system is considered observable if you can understand its internal state and health based on its external outputs. As the connective tissue between services, a service mesh can provide data about the system's behavior with minimal changes to application code.Distributed tracingDistributed tracing is an essential feature provided by service meshes. It helps users to gain visibility into the complex interactions between microservices. When a new request enters the system, the service mesh assigns it a unique trace ID that is then propagated to respective services that can best handle it. Each service also generates span IDs for the parts of the request it processes. The service mesh sidecars automatically instrument these requests, capturing timing data and metadata without requiring code changes. This trace data is sent to a centralized tracing system for storage and analysis.The trace function interface gives developers a window into the data tracing process. Here, users can view the end-to-end flow of requests, see all services involved, and identify any performance bottlenecks or errors. Using a service mesh, distributed tracing can be implemented consistently across all services, ultimately providing the observability needed to troubleshoot and optimize microservice applications.Real-time metrics and loggingA service mesh provides comprehensive, real-time metrics, giving the user deep visibility into the behavior and health of their microservices. This can include request volume, latency, error rates, resource utilization, and traffic breakdowns. These can be done individually by service, version, or protocol. Detailed access, transaction, and error logs with stack traces are also captured.These metrics and logs are exposed in standard formats, allowing easy integration with monitoring and logging systems like Prometheus, Grafana, Elasticsearch, or Splunk. By automatically instrumenting services and centralizing telemetry, a service mesh greatly simplifies observability without requiring developers to instrument each service individually.This real-time observability enables proactive issue identification, incident investigation, performance optimization, and data-driven decision making for operating microservices applications at scale. The granular insights provided by the service mesh are critical for understanding and managing complex distributed systems.Traffic monitoring and analysisService meshes offer detailed traffic metrics and insights, enabling operators to understand service interactions within a microservices architecture. These metrics include bandwidth usage, request volume, traffic distribution by protocol, and service dependencies.Analyzing these metrics empowers operators to identify performance bottlenecks, optimize resource allocation, ensure fair traffic distribution, and detect anomalies. The service mesh also provides visibility into communication patterns, aiding in architecture design and evolution.Integrating with service mesh dashboards and external traffic analysis platforms allows for interactive data exploration and AI/ML-driven recommendations, facilitating traffic optimization at scale.Increased Resilience and ReliabilityA service mesh also helps improve system reliability. By offloading fault tolerance concerns to a service mesh, services can focus on differentiating business logic. The service mesh can handle retrying requests transparently, without other services even being aware if dependencies are experiencing issues.Automatic Retries & TimeoutsInstead of making users manually resolve request issues, a service mesh can automatically handle retries and timeouts for failed requests between services. When a request cannot process due to a network issue or unavailable service, the service mesh can intelligently retry the request a configurable number of times before returning an error to the client. Giving this function to a service mesh takes one more thing off the plate of the developers, and can keep the request process going instead of having recurring downtimes until a user can respond to it. Additionally, a service mesh allows operators to set specified timeout thresholds for requests. If a service takes too long to respond, the mesh can automatically cancel the request and return an error to save time and allocation. By canceling the request loop at an ideal time, the service mesh ultimately prevents cascading failures and helps maintain the overall responsiveness of the system even if some services are experiencing issues.Fault Tolerance & Failure InjectionWith a service mesh, users can stress test their applications to see when they fail and how that cascades throughout their services. This is known as failure injection, and it is a key concept of chaos engineering. Here, developers intentionally introduce faults to create failures in their systems, and it ultimately identifies weaknesses within their system. By doing this, users can aim to strengthen their services and improve resilience by introducing instances of fault tolerance. A service mesh provides detailed metrics and logs for its applications through purposeful failure injections. This way developers can preemptively anticipate fault points and proactively create tolerable limits. By leveraging these capabilities, microservices architectures can achieve higher levels of resilience and reliability, ensuring graceful recovery from failures.Health Checks & Self HealingWith a service mesh, users can continuously monitor the health of services using probes to validate availability and readiness. When a service fails one of the predetermined health checks, the mesh automatically removes it from the load balancing pool. These measures aim to prevent traffic from being routed to unhealthy instances and lessening the available resources for necessary functions. By using these health failsafes, the mesh ensures failures won’t propagate and continue to maintain the overall reliability of the system.Ideally, these previously failing services will heal themselves over time until they once again pass the health checks. Then, the service mesh will automatically reintroduce it to the load balancing pool. This is known as the self-healing feature of the service mesh, as it does not require any manual intervention from developers. This dynamic process improves the system's overall resilience and ability to recover from failures.By using these health checks and self-healing"
