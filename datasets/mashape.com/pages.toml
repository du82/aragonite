full_description = '''November 5, 20242 min readKong Wins Best in API Gateway at API World 2024Kong AI Gateway is recognized as a leading solution in the global API ecosystemSAN FRANCISCO, November 5, 2024 – Kong Inc., a leading developer of cloud API technologies, has won a 2024 API Award for its Kong AI Gateway solution. This prestigious award celebrates the incredible technical innovation, reception, and solutions in the global API and software integration industry. This recognition comes on the heels of Kong being positioned by Gartner® as a Leader in the 2024 Magic Quadrant for API Management. Kong AI Gateway is an API gateway to govern and secure generative AI workloads across any cloud environment.The solution enables developers to integrate one or more LLMs into their products and ship AI capabilities faster, while at the same time offering architects and platform teams a secure solution that helps ensure visibility, control and compliance on every AI request. “Developers across industries are relying on AI today to help them work more efficiently and create better user and customer experiences,” said Marco Palladino, CTO and Co-Founder, Kong. “Kong AI Gateway provides them with the AI infrastructure they need to unlock GenAI at scale and be successful. It's an honor to have our technology recognized by API World for being the best API Gateway solution in the market today.”Recent updates to the solution introduced new semantic capabilities to enhance AI and API infrastructure including Semantic Caching, which accelerates AI responses by up to 20x while reducing computational overhead, making GenAI applications faster and more cost-effective. As well as, Semantic Prompt Guard, which helps ensure robust security by intelligently blocking inappropriate prompts, and Semantic Routing, which simplifies AI model selection for developers."Today’s digital enterprise & consumer apps are increasingly powered by API-centric architecture and platforms. Kong AI Gateway’s 