full_description = '''Eight of the world's ten highest mountains — including the highest, Mount Everest — are within Nepal, one of the richest countries in the world in terms of bio-diversity. China and the Himalayas lie to the north of this high, high country, with India squeezing it upward from the south, east, and west. Kathmandu, the capital and largest city, is known as the "city of temples" — it's also the country's hotspot for art, culture, and history. Outside the urban buzz, the hiking is virtually unparalleled: We'll show you treks you don't need to train for, treks with no crowds, and — of course — what to do besides hiking. Or glamping on Mount Everest. (Yep.)'''
