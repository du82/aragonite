["https://matadornetwork.com/destinations/africa"]
title = "Africa travel guide: Everything you need to know about visiting Africa"
description = "How to travel to Africa, including the best places to visit like Cape Town in South Africa, and the Serengeti in Tanzania and Kenya."
full_description = '''Mention Africa to anyone and you're bound to get their own version of "Africa" that involves some combination of the following: The Sahara desert spanning Algeria, Chad, Egypt, Libya, Mali, Mauritania, Morocco, Niger, Western Sahara, Sudan and Tunisia, historical archives in Egypt and Mali, prime wildlife viewing to spot the "Big 5" in East Africa (Kenya, Tanzania) and Southern Africa (Namibia, Botswana, Zambia, South Africa), tracking gorillas and other primates in Central Africa (Uganda, Rwanda), dramatic landscapes and sand dunes along Namibia's coastline, climbing Mount Kilimanjaro, opportunities to volunteer, study abroad, and cultural exchange programs. With over 6,000 unique ethnic groups and languages, various climates ranging from arid deserts in the North, mangrove rainforests in the West, mountainous regions in the East, and wildlife-rich savannahs in the South, its no wonder trying to describe Africa in a few sentences seems impossible. Be honest, you'd totally take a mud bath with a baby rhino if you could. Find out more about Meimei's story here.'''
