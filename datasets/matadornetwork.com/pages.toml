["https://matadornetwork.com"]
title = "Matador - Your guide to Modern Adventure"
description = "Matador is a global media brand for modern adventurers. From city guides to original shows, we'll stoke your curiosity about the world."
full_description = '''If you could break out of your everyday routine and go travel, how deep would your travels take you? Meet Gareth Leonard, a native New Yorker who set out to answer this question. He left an unhappy conventional life to pursue his travel dreams, and has some encouraging words for fellow aspiring travelers. Luxury off the Grid is a deep dive into the world’s most incredible off-grid adventure tourism operations. Along the way, we’ll meet visionaries who have devoted their lives to creating otherworldly eco-resorts. We’ll stay in luxury lodgings where gourmet food is prepared right from the local landscape. And we’ll take bush planes, helicopters, and riverboats to access truly remote wilderness. From the Mekong River to the Great Bear Rainforest to deep in the Alaskan Bush, join us for a look at paradise on earth. With all of the negative press Iran gets in the media, Dutch filmmaker Reinier van Oorsouw decided to visit the country with one question: Is it really that bad? From the iconic Sonar festival in Reykjavik to tiny gatherings in caves, we follow leading Icelandic musicians and artists to learn how this country of only 300,000 has such an outsized impact on music worldwide. Rani is a 17-year-old in Mumbai. Like most girls her age, she likes Instagram, boys and good food. But Rani is also the daughter of a sex worker, and she grew up hearing, “a whore’s daughter can only be a whore.” "The press trip to the Maldives was amazing. I feel like the Matador team coordinated everything well on their end. From the original pitch email to connecting me to the press contact for the trip, everything was thorough and smooth." "Flying business class was once of a lifetime experience! All my friends back home were SO JEALOUS of my trip! Everything was fully planned out and I was taken care of. It's always been a dream of mine to create travel content, and I'm grateful I got this opportunity to do it with Matador Network. Can't wait to do it again!"'''
