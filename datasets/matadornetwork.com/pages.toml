ective tissue between our clients, our engineering team, and our social/performance marketing teams Required Skills: Outstanding written communication skills in emails, direct and succinct in your communications Native English speaker with flawless grammar Highly self-motivated and ambitious, you like taking on big challenges and setting the bar high Diligent and able to thrive in both solo and team settings Outstanding presentation skills via Zoom and Teams Organized, detail-oriented, adept at multitasking, and able to stay organized across hundreds of client contacts Qualifications/Experience/Education: Bachelor’s Degree or equivalent professional experience Top notch written communication skills with a proven track record in successful sales and/or account management Extensive experience in project management with dozens of simultaneous clients Nuts and Bolts: Independent contractor Part-time position (about 20 hours/week) 100% remote – work from anywhere in the world (candidates must be based in a North American time zone) Competitive base salary paid monthly. Compensation is a set hourly rate and is based on experience How to Apply: To apply, please submit your resume, compensation expectations, and cover letter highlighting your qualifications and enthusiasm for this role to careers@matadornetwork.com. Please put Customer Success Manager in the subject​ line. Our mission: We aim to empower a diverse generation of modern adventurers to share their stories and travel fearlessly. Diversity at Matador: Beyond our passion for travel, Matador values diversity, equity, and inclusion and is actively working to spread these values through the travel industry. We are committed to hiring a diverse workforce to elevate and empower a wide array of viewpoints; candidates for this position should fully embrace this mission. Frontend/PHP Web Developer Matador Network is a dynamic global media company focused on travel andadventure. We are renowned for uncovering the world’s most captivating destinations and experiences and telling human-driven stories through articles and videos that are consumed by an audience of over 100M people/month. We believe travel is the ultimate force for good and our platform exists to inspire curiosity and encourage millions of people to explore more often and with an open mind. As we’ve grown, we’ve expanded our scope to include podcasts, a social team who oversees 15M+ followers, a tech arm that runs the world’s #1 AI-powered travel agent (GuideGeek), and a 24+ person content studio that partners with many of the world’s biggest brands and destinations on custom video productions and branded entertainment. At Matador, we envision a world where travel is a transformative experience that enables us to find the humanity in each other, everywhere. It has the power to connect, heal, and inspire us to plan new adventures that have a positive impact on the world. Summary: The Frontend/PHP Web Developer possesses a passion for web development and user interface design, coupled with a solid background in full-stack development, especially in PHP environments. We are seeking a highly skilled and experienced Frontend/PHP Web Developer to focus on crafting flawless web experiences using HTML, CSS, JavaScript, PHP, MySQL, and WordPress. Key Responsibilities: Develop and maintain website architecture and frontend interfaces using HTML, CSS, and JavaScript. Implement server-side code and database solutions using PHP and MySQL. Customize and manage WordPress installations, themes, and plugins. Collaborate with the design team to translate visual concepts into functional online experiences. Ensure cross-platform optimization for mobile and responsiveness of applications. Manage project priorities, deadlines, and deliverables within specified timeframes. Conduct website performance tests and troubleshoot any user-facing issues. Required Skills: Strong proficiency in HTML, CSS, JavaScript, PHP, MySQL, and WordPress. Excellent