full_description = '''1.7 million live within its city limits, with another 19 million scattered along the outskirts. Squint a little, and the Manila Bay skyline could pass for New York. Despite the capital city's urban landscape, the Philippines' access to nature is nearly unrivaled. The archipelago is made up of some 7,600 islands, one of which is regarded as the "dreamiest island in the world." Here you can trek through mountains and along rice terraces, eat your weight in mangoes, and island-hop until your dreams come true. You can also ride a giant unicorn-zilla float, should that be your speed. Start scrolling below, and you'll see all that's possible.'''
