full_description = "Privacy Policy Effective Date: March 4, 2025 INTRODUCTION Matador Ventures, Inc. (“Matador”, “we”, “us” and/or “our”) is committed to protecting your privacy. We have prepared this Privacy Policy to describe to you our practices regarding the Personal Data (as defined below) we collect from users of any of our mobile applications (“Apps”) or our websites, including those located at: MatadorNetwork.com and www.creatorthepodcast.com. The Apps and websites are collectively referred to as “Site and Services” (as defined in the Matador Terms of Service). Capitalized terms not defined in this Privacy Policy have the meanings given in our Terms of Service located at www.MatadorNetwork.com/content/tos. PARTICULARLY IMPORTANT INFORMATION WHO WE ARE: For the purpose of applicable data protection legislation, the data controller of your personal data is Matador. You can contact us at consent@matadornetwork.com or the mailing address at the end of this document. MUST READ SECTIONS: We draw your attention in particular to the sections entitled “International Data Transfer” and “Your Rights.” CHANGES TO THIS POLICY We will post any modifications or changes to the Policy on our Site and Services. We reserve the right to modify the Policy at any time, so we encourage you to review it frequently. The “Last Updated” legend above indicates when this Policy was last changed. If we make any material change(s) to the Policy, we will notify you via a notice on our Site and Services prior to such changes(s) taking effect. 1. PURPOSES OF PROCESSING What is personal data? We collect information about you in a range of forms, including personal data. As used in this Policy, “personal data” is as defined in the General Data Protection Regulation 2018 and any successor legislation, this includes any information which, either alone or in combination with other information we hold about you, identifies you as an individual, including, for example, your name, postal address, email address and telephone number. Why do we need your personal data? We will only process your personal data in accordance with applicable data protection and privacy laws. We need certain personal data in order to provide you with access to our Site and Services. If you created a profile/registered with us, you will have been asked to tick to agree to provide this information in order to access our services, purchase our products, view our content. This consent provides us with the legal basis we require under applicable law to process your data. You maintain the right to withdraw such consent at any time. If you do not agree to our use of your personal data in line with this Policy, please do not use our Site and Services. 2. COLLECTING YOUR PERSONAL DATA We collect information about you in the following ways: Information You Give Us. This includes: the personal data you provide when you register to use our Site and Services, including your‎ name, postal address, email address, telephone number, username, password and demographic information (such as your gender); the personal data that may be contained in any video, comment or other submission you upload or post to our Site and Services; the personal data you provide when registering for an account we run on our Site and Services; the personal data you provide when you report a problem with our Site and Services or when we provide you with customer support; the personal data you provide when registering and using Matador Creators, including: username, first name, last name, password, referred by, age range, country of residence, Specialty (photography, writing, video), Phone number, skype, website urls, social urls, bio, links to content they have produced, profile photo, current location, hometown, timezone, languages spoken; the personal data you provide when you access and use GuideGeek, including WhatsApp account information, profile, and any information you type into the chatbox; the personal data you provide when you download, register and use the Travelstoke App, including: name, email, password, current location (automatic), profile image, languages spoken, interests, countries visited, cities visited, hometown, bio; the personal data you provide when you make a purchase thorough our Site and Services; and the personal data you provide when you correspond with us by phone, email or otherwise. Information from Social Networking Sites. Our Site and Services include interfaces that allow you to connect with social networking sites (each a “SNS”). If you connect to a SNS through our Site and Services, you authorize us to access, use and store the information that you agreed the SNS could provide to us based on your settings on that SNS. We will access, use and store that information in accordance with this Policy. You can revoke our access to the information you provide in this way at any time by amending the appropriate settings from within your account settings on the applicable SNS. Information Automatically Collected. We automatically log information about you and your computer or mobile device when you access our Site and Services. For example, when visiting our Site and Services, we log your computer or mobile device operating system name and version, manufacturer and model, browser type, browser language, screen resolution, the website you visited before browsing to our Site and Services, pages you viewed, how long you spent on a page, access times and information about your use of and actions on our Site and Services. We collect this information about you using cookies. Please refer to the sections on cookies, Flash Technology and Pixel Tags below. Automated Decision Making and Profiling. We do not use your personal data for the purposes of automated decision-making. However, we may do so in order to fulfill obligations imposed by law, in which case we will inform you of any such processing and provide you with an opportunity to object. 3. COOKIES What are cookies? We may collect information using “cookies.” Cookies are small data files stored on the hard drive of your computer or mobile device by a website. We may use both session cookies (which expire once you close your web browser) and persistent cookies (which stay on your computer or mobile device until you delete them) to provide you with a more personal and interactive experience on our Site and Services. We use two broad categories of cookies: (1) first party cookies, served directly by us to your computer or mobile device, which are used only by us to recognize your computer or mobile device when it revisits our Site and Services; and (2) third party cookies, which are served by service providers on our Site and Services, and can be used by such service providers to recognize your computer or mobile device when it visits other websites. Cookies we use Our Site and Services use the following types of cookies for the purposes set out below: Essential Cookies: These cookies are essential to provide you with services available through our Site and Services and to enable you to use some of its features. For example, they allow you to log in to secure areas of our Site and Services and help the content of the pages you request load quickly. Without these cookies, the services that you have asked for cannot be provided, and we only use these cookies to provide you with those services. Functionality Cookies: These cookies allow our Site and Services to remember choices you make when you use our Site and Services, such as remembering your language preferences and remembering your login details. The purpose of these cookies is to provide you with a more personal experience and to avoid you having to re-enter your preferences every time you visit our Site and Services. Analytics and Performance Cookies: These cookies are used to collect information about traffic to our Site and Services and how users use our Site and Services. The information gathered does not identify any individual visitor. It includes the number of visitors to our Site and Services, the websites that referred them to our Site and Services, the pages they visited on our Site and Services, and other similar information. We use this information to help operate our Site and Services more efficiently, to gather broad demographic information and to monitor the level of activity on our Site and Services. Social Media Cookies: These cookies are used when you share information using a social media sharing button or “like” button on our Site and Services or you link your account or engage with our content on or through a social networking website such as Facebook, Twitter or Google+. The social network will record that you have done this. Advertising Cookies: If there is advertising on the Site, such advertising may employ the use of Cookies or other methods to track hits and click-throughs. If you click on these advertisements, these companies may place a persistent Cookie on your computer which may allow them to display further advertisements to you. We are not responsible for advertiser Cookies or how the information gathered through their use might be used. For more information about these companies’ separate privacy policies, you should contact the company directly. Should you have any complaints about the privacy practices of any of these companies, you should contact consent@MatadorNetwork.com. Disabling cookies You can typically remove or reject cookies via your browser settings. In order to do this, follow the instructions provided by your browser (usually located within the “settings,” “help” “tools” or “edit” facility). Many browsers are set to accept cookies until you change your settings. Further information about cookies, including how to see what cookies have been set on your computer or mobile device and how to manage and delete them, visit www.allaboutcookies.org and youronlinechoices.eu. If you do not accept our cookies, you may experience some inconvenience in your use of our Site and Services. For example, we may not be able to recognize your computer or mobile device and you may need to log in every time you visit our Site and Services. 4. FLASH TECHNOLOGY We may also use Flash cookies (which are also known as Flash Local Shared Object (“LSOs”) on our Site and Services to collect and store information about your use of our Site and Services. Unlike other cookies, Flash cookies cannot be removed or rejected via your browser settings. If you do not want Flash cookies stored on your computer or mobile device, you can adjust the settings of your Flash player to block Flash LSO storage using the tools contained in the Website Storage Settings Panel at https://www.macromedia.com/support/documentation/en/flashplayer/help/settings_manager07.html. You can also control Flash LSOs by going to the Global Storage Settings Panel at https://www.macromedia.com/support/documentation/en/flashplayer/help/settings_manager03.html and following the instructions. Please note that setting the Flash Player to restrict or limit acceptance of Flash LSOs may reduce or impede the functionality of some Flash applications, including, potentially, Flash applications used in connection with our Site and Services. 5. PIXEL TAGS We may also use pixel tags (which are also known as web beacons and clear GIFs) on our Site and Services to track the actions of users on our Site and Services. Unlike cookies, which are stored on the hard drive of your computer or mobile device by a website, pixel tags are embedded invisibly on webpages. Pixel tags measure the success of our marketing campaigns and compile statistics about usage of our Site and Services, so that we can manage our content more effectively. The information we collect using pixel tags is not linked to our users’ personal data. 6. DO NOT TRACK SIGNALS Some Internet browsers may be configured to send “Do Not Track” signals to the online services that you visit. We currently do not respond to do not track signals. 7. ADVERTISING Generally. We may use other companies to serve third-party advertisements when you visit and use the Site and Services. These companies may collect and use click stream information, browser type, time and date, subject of advertisements clicked or scrolled over during your visits to the Site and Services and other websites in order to provide advertisements about goods and services likely to be of interest to you. These companies typically use tracking technologies to collect this information. Other companies’ use of their tracking technologies is subject to their own privacy policies. Mobile. We use the Google Places API(s) for location searches and as a result also use the Google Maps/Google Earth API(s). Use of this feature is also subject to the Google privacy policy, which can be found at http://www.google.com/privacy.html, and which policy is incorporated into this Privacy Policy by this reference. 8. USING YOUR PERSONAL DATA We may use your personal data as follows: to operate, maintain, and improve our Site and Services, products, and services; to manage your account, including to communicate with you regarding your account, if you have an account on our Site and Services; to operate and administer any promotions you participate in on our Site and Services; to respond to your comments and questions and to provide customer service; to send information including technical notices, updates, security alerts, and support and administrative messages; with your consent, to send you marketing e-mails about upcoming promotions, and other news, including information about products and services offered by us and our affiliates. You may opt-out of receiving such information at any time: such marketing emails tell you how to “opt-out.” Please note, even if you opt out of receiving marketing emails, we may still send you non-marketing emails. Non-marketing emails include emails about your account with us (if you have one) and our business