full_description = '''You've probably heard of the Rohingya exodus from Myanmar, and maybe — because of it — you've put the country on your "Don't Go" list. But before you practice your own travel boycott, read about why they don't work. And why they negatively affect groups in dire need of your tourism dollars and attention. 135 different ethnic groups call this country home, making it one of the most culturally diverse countries in current existence. The monasteries are gorgeous. The street food? Incredible. The anti-aging beer, well, it's something. Though you've seen the headlines, read a little deeper to see why Myanmar is worth a second look.'''
