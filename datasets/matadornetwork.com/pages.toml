["https://matadornetwork.com/content/about"]
title = "Matador - This is what we are all about"
description = "Matador is the world's largest independent travel publisher. Since 2006, we’ve redefined travel media by developing a global network of editors, writers, photographers, and filmmakers who’ve pushed the limits of what's possible as travel storytellers."
full_description = "At Matador, we envision a world where travel is a transformative experience that enables us to find the humanity in each other, everywhere. It has the power to connect, heal, and inspire us to plan new adventures that have a positive impact on the world. We fund and produce original premium shows and mini-documentaries about amazing people we meet around the world, as well as some of the inspiring global citizens from our 600-person Influencer team. Rani is a 17-year-old in Mumbai. Like most girls her age, she likes Instagram, boys and good food. But Rani is also the daughter of a sex worker, and she grew up hearing, “a whore’s daughter can only be a whore.” We started Matador out of the belief that travel content should speak to more than hotel reviews and all-inclusive resort packages. Our editorial team focuses on the experiences that make travel special, the places you have yet to discover, and the people you’ll meet along the way. Matador's city and country guides are all you need to plan where to stay, eat, and party on your next trip. You’ll also get deep insights on the local culture, neighborhoods, and vibe, as well as tips on safety, local language, currency, and tipping."
