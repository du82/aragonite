["https://math-comp.github.io/papers.html"]
title = "Mathematical Components: Research Papers"
full_description = "Mathematical Components: Research Papers Table of Contents Mathematics Programming and Algorithms Other Applications Tooling This is a list of research papers and theses using the Mathematical Components libraries and published (among others) in the following venues: ITP = Interactive Theorem Proving (was TPHOLs until 2009) CPP = Certified Programs and Proofs CICM = Conference on Intelligent Computer Mathematics IJCAR = International Joint Conference on Automated Reasoning ICFP = International Conference on Functional Programming FSCD = International Conference on Formal Structures for Computation and Deduction TACAS = International Conference on Tools and Algorithms for the Construction and Analysis of Systems ESOP = European Symposium on Programming POPL = Principles of Programming Languages PPDP = Principles and Practice of Declarative Programming JAR = Journal of Automated Reasoning JFP = Journal of Functional Programming LMCS = Logical Methods in Computer Science Your paper/thesis is not in the list? You have a suggestion about the organization of this page? Please, send us a message or issue/PR on github. Mathematics Quentin Vermande. Décomposition Algébrique Cylindrique en Coq/Rocq. 36es Journées Francophones des Langages Applicatifs (JFLA 2025). pdf Reynald Affeldt. Prouver que π est irrationnel avec MathComp-Analysis. 36es Journées Francophones des Langages Applicatifs (JFLA 2025). pdf Florent Hivert. Machine Checked Proofs and Programs in Algebraic Combinatorics. CPP 2025. pdf Reynald Affeldt, Zachary Stone. A Comprehensive Overview of the Lebesgue Differentiation Theorem in Coq. ITP 2024. pdf Assia Mahboubi, Matthieu Piquerez. A First Order Theory of Diagram Chasing. 32nd EACSL Annual Conference on Computer Science Logic (CSL 2024). pdf Benoît Guillemet, Assia Mahboubi, Matthieu Piquerez. Machine-Checked Categorical Diagrammatic Reasoning. FSCD 2024. pdf Yoshihiro Ishiguro, Reynald Affeldt. The Radon-Nikodým Theorem and the Lebesgue-St