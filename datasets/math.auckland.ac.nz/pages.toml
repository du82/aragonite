full_description = "Breadcrumbs List. Show Truncated Breadcrumbs. Home Science About the faculty You are currently on: Department of Mathematics page. Open sub navigation overlay. Department of Mathematics Te Kura Mātauranga Pāngarau | Mathematics has been called the language of the universe. It provides concepts and techniques fundamental to many branches of social and natural sciences. About the department Our people Study Mathematics Mathematics research Forms and guides Maths in society: Engagement and impact About Te Kura Mātauranga Pāngarau Our department is one of the most diverse within the University, with our courses connecting a broad range of disciplines and faculties. Haere mai | Welcome Play Video Maths and the America's Cup Dan Bernasconi, Head of Design at Emirates Team New Zealand, explains the significant role mathematics plays in sailing, boat design, and the America's Cup. Study Mathematics We offer a wide range of courses in Pure Mathematics, Applied Mathematics and Mathematics Education. Hōpara kōwhiringa | Explore options Our students and graduates Meet our students and graduates and find out where their Mathematics degree has taken them. Pānui tonu | Read more High achiever makes his mark at the Simon Marais Mathematics Competition Bachelor of Science graduate Johnathan Leung represented the University of Auckland at the 2021 Simon Marais Mathematics Competition (SMMC) in October. Pānui tonu | Read more Maths in society: Engagement and impact Maths isn't just theoretical, it helps us to engage with the world and have an impact. Pānui tonu | Read more Pedram Hekmati at WOMAD 2024 Dr Pedram Hekmati shows audiences the interlinked beauty of maths and music at WOMAD 2024. Pānui tonu | Read more Margaret and John Kalman Trust Teacher Prizes and Teacher Fellowships The Margaret and John Kalman Charitable Trust offers Teacher Excellence Prizes and Fellowships each year to mathematics teachers. Pānui tonu | Read more Take 10 with Mathematics Discover