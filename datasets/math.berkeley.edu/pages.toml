["http://math.berkeley.edu/~gbergman/papers/arXiv.html"]
title = "Notes on posting to the arXiv"
full_description = '''Contents: A. Background and generalities. B. Registering on the arXiv. C. Preparing to post an article. D. Posting your article. E. Links to some arXiv pages. As of June 2012, the choices of archive are (and have been since at least July 2010): "Computer Science", "Mathematics", "Nonlinear Sciences", "Physics", "Quantitative Biology", "Quantitative Finance" and "Statistics". The choices for Archive are as listed above (Computer Science, Mathematics, etc.). The choices for Subject Class are given by a drop-down menu. This page contains detailed descriptions of the Subject Classes offered by the Mathematics archive. (The drop-down menu will just show their titles, e.g., "Number Theory", while when the item is posted, the abbreviation, e.g., math.NT for "Archive: Mathematics; Subject class: number theory", will appear.) Your choice of subject class may be altered by the arXiv staff before your posting appears. (For instance, not seeing any "universal algebra" classification, I classified one of my papers as "General Mathematics"; but they moved it to "Rings and algebras". Since then, they have made it clear, as it was not at the time, that "Rings and algebras" includes universal algebra.) The File(s) to upload will include at least your TeX source file(s). If those call on a particular journal's style class, the style class file needs to be loaded as well; if you have a separate bibliography file, it should also be. You will specify these files to the arXiv using the "Browse" feature provided there, uploading them one by one. In your Abstract, mathematical symbols placed between dollar-signs will be interpreted as in TeX by the program MathJax. This feature was added late in 2013, and I don't have too much experience with it. Certainly you should remember that it won't be able to handle macros that you have defined if you don't include the TeX definitions. It also doesn't treat material not between dollar signs as TeX does, so, for instance, a "~" intended to keep two words on the same line will simply appear as "~". I also find that it doesn't understand "\nolinebreak" within mathematical formulas. I haven't posted any recent article whose title contained mathematical symbols, so I don't know whether MathJax would be applied to these as well.'''
year_published = 2025
clearnet = "http://math.berkeley.edu/~gbergman/papers/arXiv.html"
