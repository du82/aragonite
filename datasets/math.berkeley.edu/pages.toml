["https://math.berkeley.edu/courses"]
title = "Courses in Math | Department of Mathematics"
full_description = "Background image: Courses in Math Courses Overview Enrollment Course Offerings Tutoring Archives Textbooks Math Courses Overview Course information for specific Semesters: Schedules and course announcements: Under the heading Course Offerings in the menu at left you will find a link for the current term (= Semester or Summer Session), and, as the time approaches, will show links for coming terms as well. Clicking on one of these links will bring you to a schedule of math classes for that term, including (except in the case of summer sessions) the instructors' course announcements, with information on teaching philosophy, grading policy, etc. It will also open two further links on that menu: to a textbook-list and a list of course web-pages. Course Archives: These give some of the same information for past terms. Office Hours of math faculty and GSI's are listed for the current term. The Schedule of Classes for the Berkeley campus gives campus-wide course information: schedules, current enrollment figures, dates and times of Final Exams, etc. Further material on courses: The Berkeley Academic Guide (previously called the General Catalog) has descriptions of all our courses and general information about our Department. Our Placement Exam for Freshman Mathematics courses is recommended for deciding which course you are ready for. Honors sections exist for several of our upper division courses. Past midterm and final examinations, submitted on a voluntary basis by instructors at the end of each semester, are maintained online by the Mathematics Department. Links to petition forms for Math 49, Math 196 (Honors Thesis), Math 197 (Field Study), and Math 199 (Supervised Independent Study) Mathematics Department guidelines, policies and procedures for arranging DeCal Courses can be found here. To proposes a DeCal, please use our Math DeCal Course Submission Portal to submit all of the required documentation. You must be logged into your BConnected account (Bmail) to review the policy document and access the submission portal. Related information: Tutoring: We have information for students who need tutoring and students interested in doing tutoring work. Summer Session courses are open, on a pay-by-course basis, to both Berkeley and non-Berkeley students. Please apply and enroll through the Summer Sessions portal. Concurrent Enrollment: This system, run by UC Berkeley Extension, similarly allows non-Berkeley students to enroll during the regular semester in most regular Berkeley courses on a pay-by-course basis. Programs of study in Mathematics: For information, click on Undergraduate or Graduate."
