title = "SSH Access - UCB Math Wiki"
full_description = 'SSH Access From UCB Math Wiki Jump to: navigation, search SSH You must use an ssh client to log in to a Math Department server using ssh. From Windows machines One client which seems to work quite well is putty, which you can download for free from http://www.chiark.greenend.org.uk/~sgtatham/putty/ . From other machines Any machine other than Windows should have a native ssh client. From a terminal window (shell), type ssh USERNAME@login.math.berkeley.edu If you want to login and use the graphical user interface (GUI) of programs (e.g. Maple) then try ssh -tCX USERNAME@login.math.berkeley.edu ssh -X beyonce Then for example type xmaple. Note that the above command opens a terminal session on the HPC server beyonce using login as an SSH gateway. --Steve Sizemore - Unix System Manager 03:47, 19 March 2009 (UTC) Retrieved from "/computing/wiki/index.php?title=SSH_Access&oldid=3898"'
