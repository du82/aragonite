["http://math.berkeley.edu/~gbergman/958_scanner.html"]
title = "How to use the large Canon photocopier in room 958 as a scanner."
full_description = 'Note that because the photocopier does not have a secure password system, we may not, under campus security policy, use it to e-mail a scanned file directly to an address outside the math.berkeley.edu system. However, we may send files from the scanner to our math.berkeley.edu accounts, then e-mail them to other addresses. (2) Touch "Send", the 3rd button at top of the screen. You will get a box asking you to "Specify the destination". (3a) If the address you want is registered on the machine, touch the "Address Book" button. The Address Book is alphabetized by first letter in the entry (e.g., "Leonhard Euler e_pi_i@math.berkeley.edu" would appear under "L"). Touch the appropriate 3-letter button, then the appropriate letter among the three buttons that appear at the bottom of the screen. If the address you want is not in the first screenfull, you can move to it using the "Down" and "Up" buttons on the right. Locate the address you want, touch it so that it is highlighted, then touch the button "OK" at the lower right. You will be returned to the screen you got in step (2), but with "Specify the destination" replaced by the destination you have chosen. (3b) If you want to send to an address that is not in the Address Book (but is in the math.berkeley.edu domain), touch the "E-mail" button instead. You will get a screen with a field for the address; touch the "button" to the left of that field and you will get a keyboard screen; type the address, then press the "OK" button. You will be returned to the screen you got in step (2), but with "Specify the destination" replaced by the address you have typed. Notes on the keyboard screen: "@" is at the lower right, where one would expect the right shift key to be. The address you type in is shown in the panel at the top of the screen. Above the keyboard are "<" and ">", allowing you to move the cursor to insert characters, and "Backspace", allowing you to delete characters. You can also click on the field "Alphanumeric" at the upper right and change it temporarily to "Symbol" if you need [, ], ^, etc.. Hint for faster 1-finger typing: While typing each character, think of where the next one will be found.'
