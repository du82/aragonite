["https://math.berkeley.edu/about/history/viewpoints"]
title = "Other Viewpoints | Department of Mathematics"
full_description = 'Nobody is neutral about Berkeley. At a party of Swedish Professors, you might hear Berkeley described as "the only small town in America with its own foreign policy." Wear a Berkeley T-shirt to watch the Palio in Siena and you could very well hear "Ciao, Berzerkeley!" We have collected a few of these points of view, notably from Bishop George Berkeley from whom Berkeley gets its name, Jack London, John Kenneth Galbraith, and Ansel Adams. But, of course, you should form one of your own. Nobody is neutral about Berkeley. At a party of Swedish Professors, you might hear Berkeley described as "the only small town in America with its own foreign policy." Wear a Berkeley T-shirt to watch the Palio in Siena and you could very well hear "Ciao, Berzerkeley!" We have collected a few of these points of view, notably from Bishop George Berkeley from whom Berkeley gets its name, Jack London, John Kenneth Galbraith, and Ansel Adams. But, of course, you should form one of your own.'
