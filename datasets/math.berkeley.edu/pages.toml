["http://math.berkeley.edu/computing/wiki/index.php/TeX_(generally)"]
title = "TeX (generally) - UCB Math Wiki"
full_description = '''TeX (generally) From UCB Math Wiki Jump to: navigation, search TeX (generally) We use the TeX Live distribution of TeX and related files. The particulars of which version and where it is located depend on the machine in use. On login.math and beyonce.math: The version currently in use is the 2013 version, with some later changes (hence it identifies itself as "2014-dev"). This was implemented in the first week of March, 2014. You can browse local documentation on TeX Live and its packages by going to /local/depot/texlive-2013. On keira.math and office machines running local copies of Ubuntu Linux: These machines run the 2009 version. You can browse local documentation by going to the directory /usr/local/texmf-texlive. Files of particular interest to beginners include: The Not So Short Introduction to LaTeX2e—an introduction to the LaTeX language LaTeX tips Table of Mathematical Symbols More good starting points for TeX and LaTeX information are: TeX Users Group Home Page The best online information about TeX. It indexes useful information if you don't know what TeX is, if you want to learn TeX and/or LaTeX, or if you've been using them for years. In particular, see their web page on help and documentation. They also run one of the main sites of the Comprehensive TeX Archive Network. TeX Live Home Page. LaTeX home page. Donald E. Knuth's home page. Free math fonts for TeX and LaTeX Some WikiBooks are also available for TeX: LaTeX TeX TeX for the Impatient Links Links to special topics on TeX include: Writing your thesis in TeX: the ucbthesis document class ucbthesis readme file (links to documentation) a sample thesis Preparing your Ph.D. dissertation using LaTeX Preparing your master's thesis using LaTeX Writing letters in TeX: the ucbletter document class Using TeX to create pdf files Spell-checking TeX files Installing local macro packages (e.g., ucbthesis or ucbletter) on your machine at home Adding Fonts to TeX and Adding Macro Packages to TeX (on the math department network) Adding Fonts to XeTeX Converting From LaTeX 2.09 to LaTeX 2e Some Samples Some TeX samples are available: latex Writing a thesis in LaTeX (same as the above link) latex Writing a letter or memo in LaTeX tex and amstex latex A sample MetaPost document, with a label tex and amstex latex A sample embedded MetaPost figure tex amstex latex Using Ralph Smith's Formal Script (rsfs) fonts for nicer script characters amstex latex Using Cyrillic text amstex latex Using Cyrillic symbols latex Using Romanian characters amstex latex Bold Greek letters Retrieved from "/computing/wiki/index.php?title=TeX_(generally)&oldid=3723"'''
