["https://math.berkeley.edu/about/news"]
title = "News & Announcements | Department of Mathematics"
full_description = '''News February 5, 2025 Simons Institute Smale@95: A Conference in Honor of Steve Smale A two-day conference to celebrate Steve Smale on his 95th birthday This two-day conference will celebrate Steve Smale on his 95th birthday by covering topics relating to some of his contributions to the world of mathematics and to the world of mineral collecting. For more information please visit: Smale@95: A Conference in Honor of Steve Smale. December 18, 2024 Congratulations to Professor Olga Holtz for her UC Multicampus Research Program Award Congratulations to Professor Olga Holtz Please join us in congratulating Professor Olga Holtz for her UC Multicampus Research Program Award. Please read more about these awards at: UC awards $15.5M in research grants to tackle big questions in health, AI, agriculture and climate justice. December 12, 2024 News from the AMS Congratulations to Professor Ken Ribet for being awarded the 2025 AMS Leroy P. Steele Prize for Seminal Research Professor Ribet to Receive 2025 AMS Steele Prize for Seminal Research Professor Ken Ribet will receive the 2025 AMS Leroy P. Steele Prize for Seminal Contribution to Research for a groundbreaking 1976 paper "A modular construction of unramified p-extensions of Q(μp)." You can read more about it at News from the AMS. November 19, 2024 Congratulations to Miller Research Fellow Rohil Prasad - 2024 Brin Prize for Young Mathematicians Please join my in congratulating Miller Research Fellow Rohil Prasad, who was awarded the 2024 Brin Prize for Young Mathematicians on Saturday. You can read more about the prize here: https://science.psu.edu/math/research/dynsys/dynamical-systems-prize-young-mathematicians Congratulations Rohil! November 13, 2024 Congratulations to Thomas Brown! We are excited to share with you that our very own Thomas Brown, Lead Undergraduate Major Advisor in the Department of Mathematics, is the recipient of one of UC Berkeley's 2024 Excellence in Advising and Student Services Awards in the category of "Outstanding Advisor or Student Services Staff". Please join me in congratulating Thomas on this well deserved recognition. April 29, 2024 The Department of Mathematics welcomes Dr. Christian Gaetz as its newest faculty member We are very excited to announce that Dr. Christian Gaetz will be joining the Department of Mathematics as our newest faculty member this Fall. March 14, 2024 Happy Big Give 2024 and Pi Day! Happy Pi Day and Big Give 2024! Join us in celebrating today by helping the Department of Mathematics reach it's Big Give donor match goal of 40 gifts to the Friends of Mathematics Fund so we can unlock a $10,000 gift from Doug and Cristina McBeth. Follow this link to donate to the Math Department and show your support for our students. Thank you for all of your support! March 3, 2024 https://sloan.org/fellowships/2024-Fellows Congratulations to Michael Lindsey on his Sloan Research Fellowship! Please join the Department of Mathematics in congratulating Michael Lindsey who has been chosed as a 2024 Sloan Research Fellow. Congratulations Michael! The Sloan Research Fellow is awarded to early-career scholars who represent the most promising scientific researchers working today. To read the announcement and learn more about the award, please refer to the links below. February 22, 2024 Congratulations to the 84th Annual Putnam Competition Winners! Announcement of Winners of the 84th Putnam Competition The William Lowell Putnam Mathematical Competition is the preeminent mathematics competition for undergraduate college students in the United States and Canada. The competition consists of two 3-hour sessions, during each session, participants work individually on 6 challenging mathematical problems. Students Ranked in the Top 200 Theodore Lysek, Noah Mart, Jianzhi Wang January 8, 2024 Congratulations to Professor Bernd Sturmfels who will receive an honorary degree at U Chicago's 2024 convocation Professor Bernd Sturmfels will Receive the Honorary Degree of Doctor of Scienceat at U Chicago's 2024 Convocation The department of Mathematics congratulates Professor Bernd Sturmfels who will receive the Honorary Degree of Doctor of Science at U Chicago's Convocation ceremony in June 2024. December 11, 2023 Congratulations to Professor Sunčica "Sunny" Čanić on being awarded the 2024 AWM-SIAM Sonia Kovalevsky Lecture prize! Congratulations to Professor Sunčica "Sunny" Čanić on being awarded the 2024 AWM-SIAM Sonia Kovalevsky Lecture prize. You can read more about Sunny's prize here. November 9, 2023 Berkeley mathematician Svetlana Jitomirskaya awarded inaugural Barry Prize Svetlana Jitomirskaya, UC Berkeley professor of mathematics, has been awarded the American Academy of Sciences and Letters' inaugural 2023 Barry Prize for Distinguished Intellectual Achievement. November 6, 2023 Congratulations to Asst. Professor Yunqing Tang on being awarded the 2024 AWM Research Prize in Algebra and Number Theory!! The Association for Women in Mathematics is pleased to announce that the recipient of the 2024 AWM Research Prize in Algebra and Number Theory will be Yunqing Tang, Assistant Professor at UC Berkeley. Tang is recognized for her breakthrough work in arithmetic geometry, including results on the Grothendieck-Katz p-curvature conjecture, a conjecture of Ogus on algebraicity of cycles, arithmetic intersection theory, and the unbounded denominators conjecture of Atkin and Swinnerton-Dyer. September 29, 2023 Congratulations to Professor Ruixiang Zhang who will receive the 2023 SASTRA Ramanujan Prize! The 2023 SASTRA Ramanujan Prize The Department of Mathematics congratulates Professor Ruixian Zhang who will be awarded with the 2023 SASTRA Ramanujan Prize. For more details please see: Mathematician Ruixiang Zhang to receive 2023 Sastra Ramanujan Prize September 14, 2023 The Department of Mathematics congratulates Professor Hannah Larson on being awarded the 2024 Maryam Mirzakhani New Frontiers Prize! The 2024 Maryam Mirzakhani New Frontiers Prize Congratulations to Hannah Larson on being awarded the 2024 Maryam Mirzakhani New Frontiers Prize. For more details please see: https://breakthroughprize.org/Laureates/3/L3956. September 13, 2023 Congratulations to Professor William "Velvel" Kahan for reciept of an IEEE Milestone Plaque for the development of the Intel 8087 floating point coprocessor We are excited to announce that the IEEE History Committee has voted to award an IEEE Milestone Plaque for the development of the Intel 8087 floating point coprocessor to our own Professor Emeritus William "Velvel" Kahan, who was the main designer of the 8087’s data types and arithmetic. This design became the basis of the IEEE 754 Floating Point Standard, an effort led by Prof. Kahan, for which he received the 1989 Turing Award, and which was also recognized by an IEEE Milestone Plaque earlier this year, mounted on the 3rd floor of Soda Hall. May 4, 2023 Congratulations to our Department Manager Brian Underwood for winning a 2023 Chancellor’s Outstanding Staff Award! Congratulations to Brian Underwood! The Department of Mathematics congratulates Brian Underwood for winning a 2023 Chancellor's Outstanding Staff Awards (COSAs). March 29, 2023 Fall 2021 Quantitative Reasoning Exam will be held Wed. Aug. 25th from 5-6:30PM in 939 Evans Hall Please bring a photo ID with you to the exam. We will provide you with a pencil. Good luck! You may visit Q.R. Exam page for more information about requirements and resources. March 6, 2023 Professor Michael Lindsey received the John Todd Award. Congratulations! John Todd Award is awarded every three years by the Oberwolfach Foundation to young excellent mathematicians working in numerical analysis. More about the Award. February 16, 2023 Professor Yunqing Tang was awarded a Sloan Research Fellowship. Congratulations! The Department of Mathematics congratulates Professor Yunqing Tang for awarding a 2023 Sloan Research Fellowship. For more information visit Six young faculty members named 2023 Sloan Research Fellows 1 of 9 News (Current page) 2 of 9 News 3 of 9 News 4 of 9 News 5 of 9 News 6 of 9 News 7 of 9 News 8 of 9 News 9 of 9 News next › News last » News News Archive'''
