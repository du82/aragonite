["https://math.berkeley.edu/about/events/qr-exam"]
title = "Quantitative Reasoning (QR) Exam | Department of Mathematics"
full_description = '''The Quantitative Reasoning (QR) Exam is typically scheduled during or before the first week of each semester's instruction. For Fall 2024, the QR exam will be held remotely on Wednesday, January 15, 2025, from 5:00-6:30 pm. The Quantitative Reasoning Exam is an L&S College requirement designed to ensure that students graduate with a basic understanding and competency in mathematics, statistics, or computer science. The requirement may be satisfied by an exam or by taking an approved course. Coursework used to satisfy Quantitative Reasoning must be completed with a letter grade of C- or higher. To register for the exam, please click here. For questions, please contact the Undergraduate Advising Office at ug-advising@math.berkeley.edu. Please include "Quantitative Reasoning" or "QR Exam" in the subject line. Receipt of a minimum score of 20 (out of 45) on this exam will fulfill the QR requirement of the College of Letters & Science. This multiple-choice exam covers precalculus topics ranging from rational expressions, exponents & radicals, linear equations, inequalities, absolute values, polynomials, functions, trigonometry, geometry, to logarithmic & exponential functions. To download PDF files of a sample question set and solutions, click on the corresponding links at the bottom of this page. You can also access learning modules and practice exams on the testing platform's website here. Additionally, two Department of Mathematics faculty members recently created some materials that you might find helpful as you prepare to take the exam. To gain access to their pre-calc prep videos and worksheets, self-enroll into this bcourse site. These materials are from a 3 weeks summer course which covered most of those topics on the QR but the department is making the materials available to anyone interested in them. For additional information on the College of Letters & Science Quantitative Reasoning requirement visit Berkeley L&S Advising | Quantitative Reasoning. Documents: Sample QR Questions Sample QR Solutions'''
