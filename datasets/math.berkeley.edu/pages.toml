["http://math.berkeley.edu/computing/wiki/index.php/Access_to_MathSciNet_and_UC_eLinks_from_Home"]
title = "Access to MathSciNet and UC eLinks from Home - UCB Math Wiki"
full_description = 'Access to MathSciNet and UC eLinks from Home From UCB Math Wiki Jump to: navigation, search Even if you are not on campus, you can still remotely access all the services and subscriptions that are available when you are physically on the campus network. Examples of such services are: MathSciNet, UC eLinks, JStor, etc. There are two basic ways to do this (see the University library help page for details): The first method is to use library EZproxy (JavaScript) server (see this help page). Basically, when you click on a resource link found in OskiCat, via "Start your search" on the Library home page, Databases A-Z or eJournals (UC eLinks), you will be prompted to authenticate. You may authenticate via CalNet, or via your PIN / Cal 1 card number. You no longer need to configure your browser to use the old library proxy. The other is by connecting using a Virtual Private Network which will establish a secure tunnel to the campus. To do this you must install special software on your computer, the GlobalProtect VPN Client. Retrieved from "/computing/wiki/index.php?title=Access_to_MathSciNet_and_UC_eLinks_from_Home&oldid=3915"'
