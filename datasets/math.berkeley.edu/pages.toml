["https://math.berkeley.edu/about/events/cal-day"]
title = "Cal Day | Department of Mathematics"
full_description = "The Department of Mathematics presents Cal Day 2024 April 13, 2024 Mathematics Information Session with Professor Richard Bamler, Department of Mathematics /Major Advisors Description: Learn about the objectives and requirements of the mathematics major and the opportunities open to mathematics students at Berkeley. Staff advisors will also be available to answer questions.Audience: New admits.Time/Location: 9:30 a.m. - 10:30 a.m. Location: 10 Evans Hall. Simplifying Geometries via Geometric Flows, Professor Richard Bamler Description: Imagine that you have two inflatable beach toys: a beach ball and an inner tube. In their deflated, crumpled state, it's hard to distinguish between them—they both exhibit irregular geometries. However, as you inflate them, the crumples smoothen out, and distinctive shapes emerge. The beach ball becomes perfectly round, while the inner tube takes on its own rotationally symmetric form. So through this inflation process, each object acquires a unique inherent geometry that depends on its underlying topology (the loose underlying structure) and which therefore makes them easily identifiable from one another. Mathematically, such a geometric deformation is captured by a geometric flow, which evolves according to an equation that is similar to a heat equation. Two notable examples of geometric flows are the Ricci Flow and Mean Curvature Flow. These flows have received significant attention in recent decades and have played a pivotal role in resolving fundamental conjectures like the Poincaré Conjecture. In this talk, I'll provide an overview of these geometric flows and describe some of their applications. I will also highlight some more recent work in the area. Audience: New admits.Time/location: 11:00 a.m. - 12:00 p.m., Location: 60 Evans Hall. Proving the impossible: Kontsevich, Graham, or Conway?, Professor Zvezdelina Stankova, Berkeley Math Circle Founder and Director Description: Is it possible to prove that something is impossible? Of course! This is the bread-and-butter of a mathematician's daily professional routine, whether in the classroom field or in the research arena. In this talk, we will discuss some simple-looking games attributed to iconic figures in mathematics and see how quickly they lead to hard and even unsolved problems. Bring the best mathematician's tools: a pencil and an eraser, and get ready to experience a UC Berkeley class in MATH 74: Transition to Upper-Division Mathematics and beyond. Audience: New admits. Time/Location: 1:00 - 2:00 p.m. Location: 60 Evans Hall. Mathematics Information Tables Description: Talk to advisers in the Department of Mathematics and get comprehensive information about the major and minor programs.Audience: New admits.Time/Location: 10:45 a.m. - 4:00 p.m. Eastside of Evans Hall (outside). Ask The Mathematician with Professor George Bergman Description: A Cal Day Favorite! Find out everything you always wanted to know about mathematics (but couldn’t find anyone to ask).Audience: New admits.Time/Location: 10:45 a.m. - 4:00 p.m. East side of Evans Hall (outside). MUSA (Mathematics Undergraduate Student Association) Description: Meet current mathematics students. The Math Undergraduate Student Association (MUSA) serves the undergraduate math community at UC Berkeley, providing a range of opportunities to connect and expand horizons. Hear the perspectives and experiences of students in one of the top mathematics departments in the country. We'd love to have you join us!Audience: New admits.Time/Location: 10:00 a.m. - 4:00 p.m. East entrance of Evans Hall (outside). Gender Equity in Mathematics (GEM) Description: GEM is a student organization that serves to support women and other underrepresented genders interested in mathematics at Berkeley. We host weekly meetings that alternate between academic opportunities and social events, in addition to offering a variety of other programs. Visit our table to learn more and ask us questions. We look forward to meeting you!Audience: New admits.Time/Location: 10:00 a.m. - 4 p.m. East entrance of Evans Hall (outside). Berkeley Mathematics Tournament (BMT) Description: BMT is a UC Berkeley student-led organization that aims to spread mathematics and the spirit of mathematical competition globally by presenting students with interesting, original, hand-crafted problems. As of 2024, we are one of the largest student-run math competitions on the West Coast with over 2,000 contestants. Audience: New admits. Time/Location: 10:00 a.m. - 4 p.m. East entrance of Evans Hall (outside). Mathematical and Physical Sciences (MPS) Student Panel, Math PEER Advisors Description: Current Berkeley MPS students will share information about course planning, research and career development opportunities, and what it’s like to be a student at Berkeley.Audience: New admits.Time/Location: 2:30 - 3:30 p.m. 1 Pimentel. Cal Events App Check out the full Cal Day schedule on the Cal Events app. You can also view the Cal Day app web version Parking Free parking is open to Cal Day attendees at the following designated lots:Stadium Parking Garage (7am to 4pm only):For admitted students and their families to easily access the Chancellor’s Morning Welcome at California Memorial Stadium. Please note this parking lot has approximately 400 spots and fills up very quickly, most likely by 7:30am.Underhill Garage (7am to 4pm) *Largest lot on campusSouthside Lots:RSF GarageBancroft/Fulton East (next to Legends Aquatic Center)Ellsworth StructureNorthside Lots:Genetics GarageUpper Hearst StructureLower Hearst StructureFoothill LotWitter LotBowles LotBotanical Garden LotClark Kerr Lot You can view a PDF Map of Cal Day Parking here: Parking Map."
