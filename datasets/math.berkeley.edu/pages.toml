["http://math.berkeley.edu/computing/wiki/index.php/Software"]
title = "Scientific Software - UCB Math Wiki"
full_description = '''Scientific Software From UCB Math Wiki (Redirected from Software) Jump to: navigation, search Software Available on Linux Servers Mathematica and Maple are available on the HPC server beyonce (accessible from campus network) and thin client server twiggy (accessible from thin client computer lab 744) with command line names math and maple, respectively. MATLAB is available on beyonce, and twiggy with command line name matlab. Octave is a free program that runs most MATLAB code — available on beyonce, and twiggy with command line name octave. SageMath is a free mathematics software built on top of many existing open-source packages: NumPy, SciPy, matplotlib, Sympy, Maxima, GAP, FLINT, R and many more — available on beyonce, and twiggy with command line name sage. Bertini is a free program for numerical solution of systems of polynomial equations. It is available on beyonce with command line name bertini. Singular is a free program for computational commutative algebra. It is available on beyonce, and twiggy with command line name Singular. Macaulay 2 is another free program for computational commutative algebra. It is available on beyonce with command line name M2. MAGMA does computations with many algebraic objects. Not free, but available on beyonce with command line name magma. Check out the Math Computing Cheat Sheet. The Math department's HPC server beyonce may be accessed off-campus via login. See here for instructions on connecting to login from your personal computer. See also the list of text editors for various operating systems. Software for Mac Computers MacPorts is a program for MacOS X which makes it easy to install and update most of the free software packages above and many others as well. Homebrew is an alternative quite popular package manager for MacOS. Retrieved from "/computing/wiki/index.php?title=Scientific_Software&oldid=3901"'''
