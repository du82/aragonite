["http://math.berkeley.edu/computing/wiki/index.php/Math_Computing_Cheat_Sheet"]
title = "Math Computing Cheat Sheet - UCB Math Wiki"
full_description = '''Math Computing Cheat Sheet From UCB Math Wiki Jump to: navigation, search Contents 1 CalNet 2 Email 3 Web 4 Printing 4.1 Public Printers 4.2 Printing Tasks 5 Network 6 Public Unix Servers 7 Non-free Math Software CalNet Task URL Remarks get Cal 1 card https://cal1card.berkeley.edu/ all students, faculty, and staff are required to get the Cal 1 card activate CalNet ID https://calnetweb.berkeley.edu/calnet-me/info-new-users/activate-calnet-id all students, faculty, and staff are required to have a valid CalNet ID test CalNet ID https://auth.berkeley.edu/cas/login?service=https%3A%2F%2Fbpr.calnet.berkeley.edu%2Faccount-manager%2Flogin%2Fcas&renew=true verify if you remember your CalNet ID and pass-phrase correctly change recovery email https://calnetweb.berkeley.edu/calnet-me/manage-my-calnet-account#recovery set up or change non-Berkeley email address where CalNet account notifications will be sent reset CalNet ID pass-phrase https://calnetweb.berkeley.edu/calnet-me/manage-my-calnet-account#forgot requires prior setup of recovery email update directory listing https://calnet.berkeley.edu/directory/update/ keep your public information up-to-date Email Task URL Your email addresses Remarks create bMail account https://calmail.berkeley.edu/manage/account/create_account jane.doe@berkeley.edujdoe@math.berkeley.edu requires CalNet authentication you have to accept the terms of service your @math alias is created by department access email from computer https://bconnected.berkeley.edu/ jane.doe@berkeley.edu requires CalNet authentication accept the terms of service when login the first time acquire @math email alias and Unix login jdoe@math.berkeley.edu send a message to Jasan Fujii jaifuj@berkeley.edu, or see Jasan in 920 Evans OR send a message to request@math.berkeley.edu create @math alias (i.e. send emails from your @math alias) https://bconnected.berkeley.edu/ jdoe@math.berkeley.edu click on the "gear" icon in the right corner of bMail screen click on "See all settings" select the Accounts tab click "Add another email address" enter your @math address in the "Email address" field. ensure "Treat as an alias." is checked, and click "Next Step". make @math alias default https://bconnected.berkeley.edu/ jdoe@math.berkeley.edu click on the "gear" icon in the right corner of bMail screen click on "See all settings" select the Accounts tab find your @math alias in the "Send mail as" section and click on the link "make default" get on mail list https://groups.google.com/my-groups faculty@math.berkeley.edupostdoc@math.berkeley.eduallgrads@math.berkeley.eduvisitors@math.berkeley.edu make sure you are subscribed to one of the department mailing lists send a message to request@math.berkeley.edu if not sure check expiry information https://calnetweb.berkeley.edu/calnet-people/info-new-users/grace-periods jane.doe@berkeley.edujdoe@math.berkeley.edu your CalNet (and bMail) account expires after a predefined grace period join alumni network https://cal.berkeley.edu/ jane.doe@berkeley.edujdoe@math.berkeley.edu if you are a UC Berkeley alum your may join alumni network @Cal and get your "lifetime" bMail account @berkeley.edu @math.berkeley.edu alias Web Task URL Remarks read department web pages http://math.berkeley.edu no authentication required edit your official page /people/path-to-your-page contact the graduate advisor. [1] create/edit your personal page /~your-unix-login replace your-unix-login with your Unix login name, e.g. jdoe create public_html folder in your Unix home create/edit index.html file in the above folder make sure the file/folder permissions are right read more in the Webpage Guide Printing Public Printers Queue Name Location Maker & Model Printer Queue URL 958_large 958 Evans Hall Canon iR-ADV 8295 https://printserver.math.berkeley.edu:631/printers/958_large 958_small 958 Evans Hall Canon iR-ADV 6275 https://printserver.math.berkeley.edu:631/printers/958_small 1002 1002 Evans Hall HP LaserJet M602 https://printserver.math.berkeley.edu:631/printers/1002 838 838 Evans Hall HP LaserJet M608 https://printserver.math.berkeley.edu:631/printers/838 744 744 Evans Hall HP LaserJet M607 https://printserver.math.berkeley.edu:631/printers/744 Printing Tasks Additional printing instructions available at Mathematics Public Printing Task Commands Remarks print a document from a GUI application (e.g. standalone PDF reader) press Ctrl-P (in Unix or Windows) press Command-P (in MacOS) select the queue name from the above list of public printers please consider the environment before printing printing books is not allowed use Canon copiers for instructional jobs when printing many copies of an item, print one copy, then use the copiers to create the rest send large jobs to one of Canon printers use two-sided printing option (save trees) sometimes, a (malformed) PDF document won't print from the web browser, but prints OK from a standalone PDF viewer (e.g. Mac Preview or Linux Document Viewer) the Canon printers won't print A4 paper size PDF documents without shrinking or cropping the documents to fit the US Letter size print a document from Unix command line lpr -P queue file replace queue with the queue name from the above list of public printers replace file with the file path of the document to print check the print queue status from Unix command line lpq -P queue replace queue with the queue name from the above list of public printers cancel the job from Unix command line lprm job replace job with the job number from the above output of lpq command you have to own the job in order to able to cancel it add a printer to personal Windows computer go to Add Printer dialogue click "The printer that I want isn't listed" under "Select a shared printer by name" use the "Printer Queue URL" from the above list of public printers for driver, and select "Microsoft", then "Microsoft PS Class Driver" (see remarks) do not use PCL printer drivers, use Postscript drivers instead it is recommended to install the HP universal Postscript driver for HP printers it is recommended to install the Canon Postscript driver for imageRunner Advance printers add a printer to personal Mac computer go to the list of printers in System Preferences click on + sign click on the IP tab select IPP protocol type printserver.math.berkeley.edu in Address type printers/queue in Queue type queue in Name select Generic Postscript Printer click on Add button and check the Duplex Printing Unit click on OK button replace queue with the queue name from the above list of public printers Generic Postscript driver generally works fine for both HP and Canon printers but does not support some features download and install a proper Canon Postscript driver if you want to use the stapler function Network Network Type URL Remarks eduroam WiFi https://technology.berkeley.edu/wi-fi requires (eduroam) authentication encrypted (secure) network Ethernet wired requires hardware (a.k.a. MAC) address registration student personal computers are not eligible for wired network access faculty and long term visitors should send the office number and MAC address of their computer Ethernet port to request@math.berkeley.edu VPN virtual private network https://security.berkeley.edu/services/bsecure/bsecure-remote-access-vpn creates secure tunnel to campus network from off-campus locations requires installation of GlobalProtect VPN client on your personal device requires 2-step CalNet authentication while establishing VPN connection remember the name of VPN server vpn.berkeley.edu Public Unix Servers Name Resources Purpose Remarks login.math.berkeley.edu 8 CPU cores, 8GB RAM SSH gateway Good for Worldwide access to Unix shell command line interface (CLI) Text editing, emailing, Tex/LaTeX writing Worldwide SCP/SFTP access to home directory Access to personal web pages ~/public_html Access to other otherwise unreachable public servers Not so good for Any serious computing Graphics user interface (GUI) twiggy.math.berkeley.edu 32 CPU cores, 92GB RAM Virtual desktop (thin client server) Good for Graphics user interface (GUI) access (via thin clients) Worldwide access to Unix shell command line interface (CLI) and graphics user interface (GUI) (via X2Go and TigerVNC client) Internet browsing, emailing, Tex/LaTeX writing Interactive scientific computing Access to commercial scientific software High performance computing (via SSH Access to beyonce) Not so good for Supercomputing beyonce.math.berkeley.edu 64 CPU cores, 224GB RAM High performance computing Good for Parallel computing Non-interactive computational jobs (via screen utility) CLI access to scientific (including commercial) software Application programming: C/C++, Fortran, Python, R, etc. Temporary storage of massive computational data Not so good for GUI computing Supercomputing Non-free Math Software Name Servers Can be installed on personal computer? Licensing Model Remarks MATLAB beyonce.math.berkeley.edu twiggy.math.berkeley.edu Yes (see remarks) Campus wide license, see https://software.berkeley.edu/matlab. Department pays for server licenses. Personal licenses are not covered. Access from thin client computer Terminal: use matlab -nojvm command from Unix shell GUI: find "matlab" in the Applications menu Remote access via SSH See SSH Access, use terminal command matlab Installation on personal computer (non-free) Get the chart string (COA) from your research administrator Follow appropriate link on Software Central MATLAB page Install MATLAB after getting personal activation key Mathematica beyonce.math.berkeley.edu twiggy.math.berkeley.edu Yes Campus wide license, see https://software.berkeley.edu/mathematica. Department pays for its share including personal licenses. Access from thin client computer Terminal: use math command from Unix shell GUI: find "mathematica" in the Applications menu Remote access via SSH See SSH Access, use terminal command math Installation on personal computer Follow appropriate link on Software Central Mathematica page Install Mathematica after getting personal activation key Alpha Pro Wolfram Alpha cloud N/A Campus wide license, see https://software.berkeley.edu/mathematica. Access to Alpha Pro is covered by department. Access from any computer with browser (sign in required) http://www.wolframalpha.com/pro/ Getting personal account Fill the web form at Wolfram User Portal Maple beyonce.math.berkeley.edu twiggy.math.berkeley.edu No Department site license. Department covers (local area network) floating licenses. Access from thin client computer Terminal: use maple command from Unix shell GUI: find "maple" in the Applications menu Remote access via SSH See SSH Access, use terminal command maple Installation on office computer connected to Ethernet Send request to request@math.berkeley.edu MAGMA beyonce.math.berkeley.edu No Department site license sponsored by Simons Institute. Access from thin client computer Terminal only: use magma command from Unix shell Remote access via SSH See SSH Access, use terminal command magma Installation on office computer connected to Ethernet Send request to request@math.berkeley.edu Retrieved from "/computing/wiki/index.php?title=Math_Computing_Cheat_Sheet&oldid=3952"'''
