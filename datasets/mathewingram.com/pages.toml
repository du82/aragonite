title = "mathewingram.com/work – Links that interest me and maybe you"
description = "Links that interest me and maybe you"
full_description = "Posted on March 5, 2025March 5, 2025His blood helped save the lives of more than 2 million babies From the BBC: “One of the world’s most prolific blood donors – whose plasma saved the lives of more than two million babies – has died. James Harrison died in his sleep at a nursing home in New South Wales, Australia on 17 February, his family said on Monday. He was 88. Known in Australia as the man with the golden arm, Harrison’s blood contained a rare antibody, Anti-D, which is used to make medication given to pregnant mothers whose blood is at risk of attacking their unborn babies. The Australian Red Cross Blood Service paid tribute to Harrison, saying he pledged to become a donor after receiving transfusions while undergoing a major chest surgery when he was 14. He started donating his blood plasma when he was 18 and continued doing so every two weeks until he was 81. In 2005, he had the world record for most blood plasma donated. His daughter and two of his grandchildren are also recipients of anti-D immunisations.” How a walnut tree played a critical role in convicting a man of mass murder From the Dublin Review of Books: “Thirty-five years have now passed since civil war erupted in the Balkans. In 1990, the Yugoslav federation began to tear itself apart, with insurrections breaking out in most of its six constituent republics. One story from the Yugoslav civil war connects a small valley in rural England with a mass grave in Croatia. At its heart is a dreadful crime – involving murder, betrayal and deceit – and a struggle between those who sought to reveal the truth, and those who wanted to deny and suppress it. That conflict was resolved by a most unlikely witness: a walnut tree. One spring morning in 1998, Paul Tabbush was at work at the Bedgebury Pinetum in Kent – one of the world’s largest collections of tree specimens – when he received an unexpected phone call. Prof Tabbush was head of silviculture and seed research with the British Forestry Commission. To his astonishment, the phone call he received that morning came from an investigator with the War Crimes Tribunal in The Hague.” Note: This is a version of my When The Going Gets Weird newsletter, which I send out via Ghost, the open-source publishing platform. You can see other issues and sign up here. Continue reading “His blood helped save the lives of more than 2 million babies”Also on: website Bluesky"
