["https://mathiasbynens.be/notes/csp-reports"]
title = "Processing Content Security Policy violation reports · Mathias Bynens"
full_description = '''Processing Content Security Policy violation reports Published 19th September 2013 · tagged with CSP, PHP, security Content Security Policy can be used to generate reports describing attempts to attack your site. This post briefly explains how this works, and presents a simple example script that can be used to process these reports. How CSP’s report-uri directive works CSP violation reporting can be enabled by specifying one or more endpoints using the report-uri policy directive: Content-Security-Policy: default-src self; report-uri /csp-hotline.php Now, whenever someone visits your site, and his browser blocks scripts, styles, fonts, or other resources based on your CSP configuration, it makes an HTTP POST request to /csp-hotline.php passing along a JSON-formatted report of the violation. The earlier CSP configuration example blocks any resources that are not on the same origin as the current document. Let’s say this policy is in effect on https://example.com. In that case, if an attempt is made to load a script from, say, http://evilhackerscripts.com, the browser POSTs the following data to https://example.com/csp-hotline.php: {"csp-report":{"document-uri":"https://example.com/foo/bar","referrer":"https://www.google.com/","violated-directive":"default-src self","original-policy":"default-src self; report-uri /csp-hotline.php","blocked-uri":"http://evilhackerscripts.com"}} …which can be pretty-printed as: { "csp-report": { "document-uri": "https://example.com/foo/bar", "referrer": "https://www.google.com/", "violated-directive": "default-src self", "original-policy": "default-src self; report-uri /csp-hotline.php", "blocked-uri": "http://evilhackerscripts.com" }} This data can then be processed by a server-side script (in this case, https://example.com/csp-hotline.php). I’d like to show you a minimal example of such a script. Example script Here’s a simple script that sends an email for each CSP violation that gets reported. I’m using PHP, but the example below should give you a good indication on how to implement this in your language of choice. <?php // Note: this script requires PHP ≥ 5.4.// Specify the email address that receives the reports.define('EMAIL', 'mathias@example.com');// Specify the desired email subject for violation reports.define('SUBJECT', 'CSP violation');// Send `204 No Content` status code.http_response_code(204);// Get the raw POST data.$data = file_get_contents('php://input');// Only continue if it’s valid JSON that is not just `null`, `0`, `false` or an// empty string, i.e. if it could be a CSP violation report.if ($data = json_decode($data)) { // Prettify the JSON-formatted data. $data = json_encode( $data, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES ); // Mail the CSP violation report. mail(EMAIL, SUBJECT, $data, 'Content-Type: text/plain;charset=utf-8');}?> This can easily be extended to write the report info to a log file, or to store it in a database. To verify the script works as intended, either visit a page on your site that violates your CSP settings, or submit a dummy report through curl and see if you get an email or not: curl -H 'Content-Type: application/csp-report;charset=utf-8' --data '{"csp-report":{"document-uri":"https://example.com/foo/bar","referrer":"https://www.google.com/","violated-directive":"default-src self","original-policy":"default-src self; report-uri /csp-hotline.php","blocked-uri":"http://evilhackerscripts.com"}}' 'https://example.com/csp-hotline.php' The email messages sent by this script look something like this: Report-only mode It’s possible to run CSP in “report-only” mode. In that case, CSP generates violation reports without actually blocking any content on your site. This gives you the opportunity to “dry-run” a CSP configuration, getting notified whenever a violation is encountered. To enable “report-only” mode, simply send the Content-Security-Policy-Report-Only header instead of the Content-Security-Policy header: Content-Security-Policy-Report-Only: default-src self; report-uri /csp-hotline.php The CSP header generator tool includes a checkbox to enable/disable report-only mode. Check it out! About me Hi there! I’m Mathias. I work on Chrome at Google. HTML, CSS, JavaScript, Unicode, performance, and security get me excited. Follow me on Twitter, Bluesky, and GitHub. Comments Caleb wrote on 19th September 2013 at 20:12: This is great, thank you very much Mathias! I’ve been looking for an easy “how to” for CSP reporting and this is really helpful. Mike West wrote on 20th September 2013 at 10:52: Nice work! Note also that both Chrome and Firefox have adopted some of the 1.1 bits of the reporting structure: we both now send line numbers and filenames for script-driven violations, for instance. :) Mathan wrote on 9th October 2013 at 09:33: Any idea to get CSP reports as mail in Ruby? mark wrote on 25th October 2013 at 08:33: I’ve got CSP on my site as well. I’m wondering if you also get a lot of false positives due to Chrome and Firefox plugins creating these violations? And if so, how do you filter them? Ignacio Coloma wrote on 8th December 2013 at 18:52: The report Content-Type has switched to application/csp-report. This is already in Chrome stable, but not yet in Firefox. mark: Please note that false reports generated by browser plugins are considered as bugs by both Chrome and Firefox teams. Mathias wrote on 8th December 2013 at 19:01: Ignacio: Thanks for the heads up on the new Content-Type! I’ve updated the curl example accordingly. c0nrad wrote on 7th September 2014 at 23:13: That’s pretty nifty, but on most websites you’re probably going to get a lot of reports. I build a website to address this: https://caspr.io/. Basically you set your report-uri to a caspr endpoint, and it collects/aggregates them for you. Also it’s open source: https://github.com/c0nrad/caspr Marco wrote on 15th October 2014 at 10:52: Nice! Why not add some extra information about the client? I am adding this: foreach (getallheaders() as $name => $value) { $vars .= "$name: $value\r\n";} Scott Helme wrote on 21st May 2015 at 10:16: I’ve recently launched a new service over at https://report-uri.io/ that allows a site to easily set up CSP and HPKP violation reporting and I thought you might be interested to know about it! Thanks for a great blog on CSP reporting. Leave a comment Comment on “Processing Content Security Policy violation reports” Name * Email * Website Your input will be parsed as Markdown. Spammer? (Enter ‘no’) *'''
