aaaaaaaaaaaaaaaaaaaaaaaatczlqqs 💥 bMob/6%C,=?an0fCtl^Ochosen-prefix_hash_collisions_ftw_aaaaaaaaaaaaaaaaaaaaaaaaxtjsnyi 💥 E0|^i;HKYSht*@T'FAqcchosen-prefix_hash_collisions_ftw_aaaaaaaaaaaaaaaaaaaaaaaazjcrflx 💥 `]|D]>=4b8O>0{vwZ],echosen-prefix_hash_collisions_ftw_aaaaaaaaaaaaaaaaaaaaaaaazxwmsbm 💥 G0FFrj-[w]m pfx>W$Un… About me Hi there! I’m Mathias. I work on Chrome at Google. HTML, CSS, JavaScript, Unicode, performance, and security get me excited. Follow me on Twitter, Bluesky, and GitHub. Comments Thomas Geraghty wrote on 25th March 2014 at 15:17: Cool article as always! I’m just curious as to why you switched from Node to Python for the brute force collisions? I’m not trying to push some sort of Lang A vs. Lang B agenda, just wondering if there was some reasoning behind your decision to switch that I’m missing :) Mathias wrote on 25th March 2014 at 15:23: Thomas: The reason I used Python for the brute-force script is the amazingly powerful itertools.product. You could do something similar in JavaScript, but you’d have to write it yourself. On the other hand, I used Node.js to confirm the collisions because its built-in crypto module supports PBKDF2 out of the box. Solar Designer wrote on 26th March 2014 at 03:17: A couple of weeks ago, I tweeted this: scrypt(PBKDF2-HMAC-SHA256-fail-affects-scrypt-no-security-issue-bGoDFpr8) = scrypt(;`B3nR6wQ2-_LSg"mH #yszm`[#z8B&L) for any salt, N, r, p The embedded " and ` are not great, but on the other hand there’s no '. The total number of different characters in the shorter password is 26. (The total number of different characters across both passwords could be made much smaller by repeating the same character in place of the message. Then it’d probably contain only 9 different characters.) This may be usable to check whether a site uses something based on HMAC-SHA256 (with PBKDF2’s order of key and salt inputs) or not. CodesInChaos wrote on 26th March 2014 at 09:21: I chose a random long password because I preferred it looking random. More mysterious that way — a chosen password makes it too obvious it’s just a cheap trick. My code is quite similar to yours. I created a random 65-char string as starting point. Then on each iteration increment it in Base26. Compute its SHA-1 hash, check if the hash is nice and printable. Repeat. Z wrote on 26th March 2014 at 13:00: The moral of the story? Using too looooooong passwords is not as secure as one might think. I saw admins using 25-character-long passwords, while the hash was based on DES (yes, we are talking about Oracle 9 passwords). Tom wrote on 3rd March 2015 at 09:15: Z: Long passwords are still safe. Nobody has dictionaries neither uses brute force with unreadable characters… yet. David wrote on 20th November 2015 at 12:03: How useful is this… I mean is it possible to find a collision for common words such as password123 or ChangeMe? Also, how long does it take to find a collision, as a plain old brute-force against the password (with GPU) may be faster? ILGUIZ wrote on 8th'''
