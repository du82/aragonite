title = 'rel="shortcut icon" considered harmful · Mathias Bynens'
full_description = '''rel="shortcut icon" considered harmful Published 14th April 2010 · tagged with HTML Most sites use the following HTML to specify a favicon: <link rel="shortcut icon" href="/favicon.ico"> Looks okay, right? Guess what — it isn’t! Today, I learned that shortcut is not a valid link relation. Indeed, it doesn’t show up in section 4.12.5 of the HTML5 specification on ‘link types’. It is, in fact, proprietary to Internet Explorer. Without IE, rel="icon" would suffice to specify a favicon. So, do we have to use the shortcut relation to support IE? Not at all. If the shortcut value is omitted from the rel attribute, Internet Explorer ≤ 8 ignores the declaration entirely, searches for a file called favicon.ico in the site root, and uses that instead. In fact, almost every browser does that when there’s no link rel="icon" specified. Using rel="icon shortcut" won’t work in IE either, since it doesn’t treat the rel attribute as a space-separated list. Update: If the Release Candidate is any indication, IE9 won’t doesn’t require the shortcut link relation anymore if you specify type="image/x-icon". Needless to say, this still sucks — all the more reason to just name the icon favicon.ico and place it in the root of your domain. Just make sure to always put the favicon in the root directory of your site, and name it favicon.ico. This way, Internet Explorer will detect it, regardless of whether you’re specifying it in a link element or not. And if you omit the entire link rel="icon" declaration, other browsers will go looking for that file as well. Not having a favicon.ico file in your root will cause a lot of 404 errors. Almost all modern browsers look up /favicon.ico by default: Opera, Safari, Chrome, Firefox, Internet Explorer 5+. The only browser that currently doesn’t do this is SeaMonkey. (SeaMonkey does offer an “aggressively look for website icons when the page does not define one” setting, though, but it’s disabled by default. Firefox does it the other way around: it has a browser.chrome.favicons entry in about:config which can be set to false to disable this behavior, but the default value is true.) Note that this works even for icons that are not in the ICO format! Browsers that support SVG favicons look for /favicon.ico all the same, and nothing stops you from serving an SVG resource with Content-Type: image/svg+xml at that URL. It’s just a URL. File extensions don’t really matter on the web. This means you can omit the link declaration for the favicon from your HTML entirely, if you want. The only real difference is that the favicon will only be shown once the entire document has finished loading. In comparison: if you’re specifying it explicitly, the favicon is loaded as soon as the browsers parses the link rel="icon" declaration. I’d say this is a huge plus. It’s definitely worth it to defer loading the favicon so that the browser can focus on loading the document and all other assets first. If you want your favicon to load as soon as possible and/or if you insist on displaying it in SeaMonkey, you can simply use this code: <link rel="icon" href="/favicon.ico"> Another update: The HTML spec now explicitly mentions /favicon.ico: In the absence of a link with the icon keyword, for documents obtained over HTTP or HTTPS, user agents may instead attempt to fetch and use an icon with the absolute URL obtained by resolving the URL /favicon.ico against the document’s address, as if the page had declared that icon using the icon keyword. Update: For historical reasons, the HTML specification now allows the use of shortcut as a link relation if it’s immediately followed by a single U+0020 space character and the icon keyword. Of course, it’s still better not to use any HTML at all. Update: Internet Explorer 11 will support GIF or PNG favicons, not just .ico files. Yet still, /favicon.ico remains the implied default. Thanks to Anne and Sander from the #whatwg IRC channel for taking the time to explain this to me. About me Hi there! I’m Mathias. I work on Chrome at Google. HTML, CSS, JavaScript, Unicode, performance, and security get me excited. Follow me on Twitter, Bluesky, and GitHub. Comments Marcel wrote on 14th April 2010 at 23:30: Ok, nice to know. But isn't the title a little bit exaggerated? What do you mean by considering rel="shortcut icon" harmful? Harmful in the sense that an inproper use of eval can be harmful? Mathias wrote on 15th April 2010 at 08:16: Marcel: The title might be a bit exaggerated — using rel="shortcut icon" doesn’t really do any harm, but then again most of the time it doesn’t do any good either. Oh well, I just needed something that sounds good :) Diego Perini wrote on 16th April 2010 at 13:01: Mathias, icon is not an HTML4 link type either, but it is very much used/useful. shortcut is not harmful and is very useful in IE for a different scope than the URL bar graphics, see the W3C home page. I don’t want all my pages have the same favorite icon and I believe others may have the same requirements. If needed one can define new link types using the profile attribute of the HEAD element. The rel attribute in link elements accepts multiple space-separated link types as specified by W3C. Sander wrote on 16th April 2010 at 16:48: Diego: icon is defined in HTML5, though. Mathias: “Considered Harmful” Essays Considered Harmful. Mathias wrote on 16th April 2010 at 18:38: Diego: (To continue our discussion on Twitter…) Sure, if you want to use more than one favicon on the same domain, and get that working properly in IE, you’ll have to stick with rel="shortcut". My point is that for most sites, this isn’t the case — and in these cases, shortcut can and should be omitted IMHO. I understand it’s still a necessity in cases where you really need distinct icons per document, but most of the time it’s not really needed. Sander: I consider the “Considered Harmful” Essays Considered Harmful essay to be harmful. Diego Perini wrote on 19th April 2010 at 18:43: Mathias: I understand that for most sites this isn’t the case, but for the rest it is. Though understand that for sites having only one same ‘root’ directory for several different sites this will not allow for different ‘icons’ for each of the sites hosted there. All my clients sites share the same ‘root’ directory thus the same root favicon. I am not saying IE method to do it is the correct one, however I need to follow how these browsers work to make the ‘thing’ equally usable to all visiting browsers. The equivalent shortcut value for the rel attribute in HTML5 is bookmark. But I am sure bookmark icon will not work in any browser. So we need IE to catch up and allow for full path to icon resources, as all other browsers already understand that. Michael wrote on 2nd February 2011 at 14:54: I realize I’m a bit late to the party, but I just want to point out that <link rel="shortcut icon" href="..." /> passes validation, because there’s nothing wrong with using rel values that aren’t on the W3C’s list. In fact, if you look at the source code for w3.org, you’ll see that even they use the rel="shortcut icon" format. Mathias wrote on 2nd February 2011 at 14:58: Michael: Just because the validator allows it doesn’t mean it’s a good idea. The take-away is: just name your favicon favicon.ico, place it in the root of your site, and there’s no need to put anything in the HTML — especially no proprietary link relations. Mathias wrote on 18th February 2011 at 15:12: I’ve added a small note to the article now that the HTML5^H spec explicitly mentions /favicon.ico. Russell Bishop wrote on 22nd February 2011 at 15:34: I’d suspected that this was true, but never took the time to test the theory. Thanks for the info Mathias! Ilia wrote on 22nd February 2011 at 16:21: The one problem with not using the link tag for a favicon is that you are limited to the default favicon name and the ICO format, if for whatever reason you wanted to use a GIF or a PNG, or just change the name of the file you'll need the explicit specification. Of course you could argue that we shouldn't be using a GIF or a PNG for a favicon in the first place, but I just wanted to point this out. Alexandre Morgaut wrote on 22nd February 2011 at 16:29: Some cases where this tag can be useful: use of different favicons on different part of a website or component of a webapp use a diffrent icon format like one supporting animations or SVG wich provide better rendering when resized use a favicon shared over several domains or sub-domains having the favicon being supported on more browsers I prefer to have two link element to avoid compatibility issues, allowing to use the best supported format on different browsers: <link rel="icon" href="/favicon.svg" type="image/svg"><link rel="shortcut" href="/favicon.ico" type="image/x-icon"> By the way, I still highly recommend to always have a default favicon.ico file at the root of the website to prevent the loading of any 404 web page if not found (same as for the robots.txt file). Mathias wrote on 22nd February 2011 at 16:38: Alexandre: In all those cases, you will indeed need to specify the icons in the HTML. However, if all you want is a single .ico file to be your favicon, it’s actually beneficial to not use HTML at all (as explained in the article). having the favicon being supported on more browsers I’m not sure what you mean here. Other than SeaMonkey, all browsers that display favicons fetch /favicon.ico by default (and chances are SeaMonkey will do this too now that the spec explicitly mentions it). The ICO format is supported by every browser that actually uses it (e.g. Mobile Safari doesn’t use favicons at all so it doesn’t really matter if they support it or not). Were you talking about supporting SeaMonkey, or something else? Could you be more specific? By the way, I still highly recommend to always have a default favicon.ico file at the root of the website to prevent the loading of any 404 web page if not found (same as for the robots.txt file). Yeah, me too. This is also mentioned in the article. :) maht wrote on 22nd February 2011 at 16:48: Why on earth is the HTML spec having anything to do with favicon.ico, that’s insidious mission creep! Karl wrote on 22nd February 2011 at 16:56: Putting a link to link to /favicon.ico is indead pointless, but that is missing the point of link and the WKL issue, aka squatting the name space. Now imagines that there are users sharing a common domain such as… http://example.org/user1/http://example.org/user2/ There is a practical usage for link to authorize each users to have its own icon. User #1 can specify: <link rel="shortcut icon" href="/user1/CrazyCow.ico"> …and user #2 can specify: <link rel="shortcut icon" href="/user2/FabulousTroubador.ico"> Nick Sergeant wrote on 22nd February 2011 at 17:02: Ilia: You can actually have a GIF or PNG be the actual file format and still have a name of favicon.ico. We do it all the time. MyFreeWeb wrote on 22nd February 2011 at 17:31: How about putting a link rel="shortcut" in a conditional comment? That’s extra bytes, but that would be very right. Some IEFML (IE Fucked Markup Language) embedded in a HTML comment. P.S. Your blog is the first blog I’m commenting on that has email and url inputs. Yay, nice iOS keyboards for these inputs ^^ Alexandre Morgaut wrote on 22nd February 2011 at 18:03: Mathias: having the favicon being supported on more browsers Two precisions about this use case: First, I’m an old web developer ;-) and I had to face Firefox versions which didn’t support the ICO format. Also note that the ICO format can be more or less supported and some browsers may expect specific sizes to be present in the ICO file (8×8 or 16×16, I don’t remember). The ICO format is not as rich as some others, so if you want to take advantage of the SVG format, you will still have to provide an ICO version for IE. This is one of the reasons why I’m used to create two <link> tags for specific favicons. Mathias wrote on 22nd February 2011 at 19:34: Nick: You can actually have a GIF or PNG be the actual file format and still have a name of favicon.ico. We do it all the time. Sure you can, but the icon won’t show up in IE then. Philip Tellis wrote on 1st March 2011 at 09:40: Isn’t it also important to have your favicon on a cookie-less domain? In many cases, the size of cookies could actually be larger than the favicon itself. Phil Smith wrote on 20th April 2011 at 16:51: Looking at the 3 biggest on the Internet {Apple, Google, and Microsoft} shows that the root directory is where they place and name the icon and that "NO CODE" is needed to add to the webpages. http://www.apple.com/favicon.ico http://www.google.com/favicon.ico http://www.microsoft.com/favicon.ico Michael Mahemoff wrote on 18th May 2011 at 16:14: One exception is dynamic favicons, which have many valid uses, e.g. to get the user’s attention or show status info. Dynamically updating favicon requires changing the link tag. Olivier Allais wrote on 16th June 2011 at 16:39: According to https://html.spec.whatwg.org/multipage/links.html#rel-icon there’s no need to use the shortcut keyword. But what puzzles me is the sizes attribute? Mathias wrote on 16th June 2011 at 19:01: Olivier: […] there’s no need to use the shortcut keyword. Exactly, that’s what this post is about. […]what puzzles me is the sizes attribute […] The sizes attribute can be used to define the sizes of icons for visual media. Touch icons are the perfect use case. Max Shomeah wrote on 8th November 2011 at 23:06: Btw, what if you add several link tags with both icon and shortcut icon set? This can be useful if you want your icon be placed at static files storage, like CDN instead of site root. Rajeesh wrote on 15th September 2012 at 21:42: I was wondering why HTML5 Boilerplate doesn’t use the <link> tag for the favicon. Thanks for the info! :) Nick Moline wrote on 3rd April 2013 at 03:28: As has been stated here, just relying on favicon.ico’s existence seems poor advice. It requires browsers to make a blink request to an arbitrary URL after the page is loaded with no reason other than because some engineer at Microsoft in 1999 decided to write support for looking for a file named favicon.ico (favorites icon, when no other browser other than IE calls them favorites) is ludicrous. We should be convincing web developers to move TOWARDS specifying the shortcut icon in hopes that browsers can eventually stop doing a wasted URL grab for a URL that may or may not (in practicality probably not) be there. Mathias wrote on 3rd April 2013 at 12:06: Nick: I’m afraid that ship has sailed. As explained in this post, all browsers already request /favicon.ico by default, and no amount of developer advocacy and evangelism will change that. phc wrote on 18th June 2013 at 07:17: Well, I may be late for the cake, but I still enjoyed scrolling down the years. Whether to use <link rel> is the choice per designer, and the same goes for the syntax. In most cases invalid anyway. image/x-ic'''
