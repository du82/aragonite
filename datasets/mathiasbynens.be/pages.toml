["https://mathiasbynens.be/notes/javascript-properties"]
title = "Unquoted property names / object keys in JavaScript · Mathias Bynens"
full_description = '''Unquoted property names / object keys in JavaScript Published 5th March 2012 · tagged with JavaScript Fun fact: var foo = { H̹̙̦̮͉̩̗̗ͧ̇̏̊̾Eͨ͆͒̆ͮ̃͏̷̮̣̫̤̣Cͯ̂͐͏̨̛͔̦̟͈̻O̜͎͍͙͚̬̝̣̽ͮ͐͗̀ͤ̍̀͢M̴̡̲̭͍͇̼̟̯̦̉̒͠Ḛ̛̙̞̪̗ͥͤͩ̾͑̔͐ͅṮ̴̷̷̗̼͍̿̿̓̽͐H̙̙̔̄͜: 42 }; is valid JavaScript. It may not be immediately obvious, but the real surprise here is that the Cthulhu-esque property name is not surrounded by quotes. Intrigued by this, and having written about the similar topic of JavaScript identifiers before, I decided to look into valid property names in JavaScript. When do they need to be quoted? When can the quotes be omitted? And in which cases can dot notation be used instead of bracket notation to get or set a property based on its name? Valid property names Looking at the ECMAScript spec grammar, we can see that a property name can be either an identifier name (i.e. identifiers + reserved words), a string literal, or a numeric literal. Identifier names are a superset of identifiers; any valid identifier and any reserved word is a valid identifier name. A string literal is any valid string, encapsulated in either single (') or double (") quotes. 'foo', "bar", 'qu\'ux', "" (the empty string), and 'Ich \u2665 B\xFCcher' are all valid string literals. A numeric literal can be either a decimal literal (e.g. 0, 123, 123., .123, 1.23, 1e23, 1E-23, 1e+23, 12, but not 01, +123 or -123) or a hex integer literal (0[xX][0-9a-fA-F]+ in regex, e.g. 0xFFFF, 0X123, 0xaBcD). Technically, octal literals (0[0-7]+ in regex, e.g. 010, 012, 01) are valid numeric literals too, but as they’re not allowed in strict mode it’s probably best to avoid them altogether. The spec defines property names as strings: The Property Identifier type is used to associate a property name with a Property Descriptor. Values of the Property Identifier type are pairs of the form (name, descriptor), where name is a String and descriptor is a Property Descriptor value. This can make the use of numeric literals as property names a bit confusing. For example, if you were to use the number .12e3 as an (unquoted) property name, it would be coerced into a string first, and the actual object key would become '120'. var object = { .12e3: 'wut'};object[.12e3]; // 'wut'object['.12e3']; // undefinedobject['120']; // 'wut'// Let’s try another numeric literal:object = { 12e34: 'heh'};object[12e34]; // 'heh'object['12e34']; // undefinedobject[1.2e35]; // 'heh'object['1.2e35']; // undefinedobject[1.2e+35]; // 'heh'object['1.2e+35']; // 'heh' While you can easily check the string value of any number — String(number) or (number).toString() — it’s definitely simpler to just stick to string literals or identifier names for property names. Note: ECMAScript 3 didn’t allow the use of unquoted reserved words as property names. Here’s the full list of ES3 reserved words: abstract, boolean, break, byte, case, catch, char, class, const, continue, debugger, default, delete, do, double, else, enum, export, extends, false, final, finally, float, for, function, goto, if, implements, import, in, instanceof, int, interface, long, native, new, null, package, private, protected, public, return, short, static, super, switch, synchronized, this, throw, throws, transient, true, try, typeof, var, void, volatile, while, and with. Avoid using these as unquoted property names if backwards compatibility is a concern. When can the quotes be omitted? Unless an object key is a numeric literal or a valid identifier name, you need to quote it to avoid a syntax error from being thrown. In other words, quotes can only be omitted if the property name is a numeric literal or a valid identifier name. Of course, if the property name is a string literal, it’s already quoted by definition. var object = { // `abc` is a valid identifier; no quotes are needed abc: 1, // `123` is a numeric literal; no quotes are needed 123: 2, // `012` is an octal literal with value `10` and thus isn’t allowed in strict mode; but if you insist on using it, quotes aren’t needed 012: 3, // `π` is a valid identifier; no quotes are needed π: Math.PI, // `var` is a valid identifier name (although it’s a reserved word); no quotes are needed var: 4, // `foo bar` is not a valid identifier name; quotes are required 'foo bar': 5, // `foo-bar` is not a valid identifier name; quotes are required 'foo-bar': 6, // the empty string is not a valid identifier name; quotes are required '': 7}; JSON only allows string literals that are quoted in double quotes (") as property names. When can dot notation be used? To get or set a value from an object based on a property name, you can always use bracket notation. Let’s say we want to get the value for the property name abc from the object in the previous example this way: object['abc']; // 1 Bracket notation can safely be used for all property names. As you may know, there is an alternative that can be used in some cases: dot notation. object.abc; // 1 Dot notation can only be used when the property name is a valid identifier name. It cannot be used for property names that are numeric literals, or for strings that aren’t valid identifier names. Unquoted JavaScript property name validator I made a tool that will tell you if any given property name can be used without quotes and/or with dot notation. Try it at mothereff.in/js-properties. About me Hi there! I’m Mathias. I work on Chrome at Google. HTML, CSS, JavaScript, Unicode, performance, and security get me excited. Follow me on Twitter, Bluesky, and GitHub. Comments Jim wrote on 14th May 2012 at 16:12: Very clear explanation. So for JSON, the property should always be quoted with ""? Mathias wrote on 14th May 2012 at 16:20: Jim: Yes. bird wrote on 26th August 2012 at 02:07: Could you explain why the number .12e3 implicitly converts to the string "120"? Thank you very much. Mathias wrote on 26th August 2012 at 08:32: bird: That is explained in the article. Look for String(number). hite wrote on 26th June 2013 at 09:30: I still don’t understand why object['1.2e+35'] is 'heh' while object['1.2e35'] is undefined. It confuses me so much. I tried the following: >>> String('1.2e+35')"1.2e+35">>> String('1.2e35')"1.2e35">>> Number('1.2e+35').toString()"1.2e+35">>> Number('1.2e35').toString()"1.2e+35">>> parseFloat('1.2e36')1.2e+36>>> parseFloat('1.2e+36')1.2e+36 Both of them appear to be exactly the same, but object['1.2e35'] != object['1.2e+35']. Mathias wrote on 26th June 2013 at 11:33: hite: object[1.2e35] == object[1.2e+35] is always true, since in both cases, the property with the name '1.2e+35' is accessed. The result of object['1.2e35'] == object['1.2e+35'] cannot be guaranteed since '1.2e35' and '1.2e+35' are different strings, and therefore different property names. anonymous wrote on 15th December 2015 at 02:46: ƒ = { π: Math.PI, ø: [], Ø: NaN, e: 2.7182818284590452353602874713527, root2: 2.7182818284590452353602874713527, α: 2.5029, δ: 4.6692, ζ: 1.2020569, φ: 1.61803398874, γ: 1.30357, K: 2.6854520010, oo: 9999999999e999*9999999999e9999, A: 1.2824271291, C10: 0.12345678910111213141516171819202122232425252728293031323334353637, c: 299792458}; Gopal Yadav wrote on 28th June 2016 at 07:39: Thanks for the clear explanation, your post is very helpful to understand this special concept. I am concerned about what happens when we use bracket to get value of property from an object and when we use dot operator to get value of a property from an object. How Javascript understands thing and how it works? Can you please explain. Thanks in advance :) Leave a comment Comment on “Unquoted property names / object keys in JavaScript” Name * Email * Website Your input will be parsed as Markdown. Spammer? (Enter ‘no’) *'''
