title = "Dear Google, please fix plain text emails in Gmail · Mathias Bynens"
full_description = '''Dear Google, please fix plain text emails in Gmail Published 4th July 2014 · tagged with Email By default, composing a new email in Gmail results in an HTML email under the hood — even if you don’t use any formatting. Luckily, it’s possible to opt-out of that and use plain text email instead. In the ‘new email’ window, click the downwards arrow and check ‘Plain text mode’. Gmail remembers your preference, so any new emails you compose after that are automatically in plain text mode, too. The problem Unfortunately, Gmail hard-wraps emails that are composed in plain text mode before sending them. If you would send this message, for example: Lorem ipsum dolor sit amet, consectetuer adipiscing elit, sed diam nonummy nibh euismod tincidunt ut laoreet dolore magna aliquam erat volutpat. Ut wisi enim ad minim veniam, quis nostrud exerci tation ullamcorper suscipit lobortis nisl ut aliquip ex ea commodo consequat. What would actually get sent is the following: Lorem ipsum dolor sit amet, consectetuer adipiscing elit, sed diamnonummy nibh euismod tincidunt ut laoreet dolore magna aliquam eratvolutpat. Ut wisi enim ad minim veniam, quis nostrud exerci tationullamcorper suscipit lobortis nisl ut aliquip ex ea commodo consequat. Here’s a screenshot of such an email, in Gmail: And here’s what that same email looks like in another email client (in this case, OS X’s Mail.app): Instead of filling up the available screen width and letting the text flow naturally, the automatically inserted hard breaks ensure no line is longer than 78 characters. This is especially annoying when viewing such emails on small viewports, e.g. on a smartphone: Combined with the auto-wrapping due to the small viewport, there are now two lines in the message with just one word on them. This behavior annoys pretty much anyone who sends plain text emails from the Gmail web client. Google’s justification Since I’m a Google Apps for Business customer, I get to file support tickets in hopes of getting issues like these fixed. So I did — I asked whether the hard-wrapping behavior for plain text emails could be disabled. After some painful back-and-forth, this was the response of the Google Enterprise Support team: The 78 characters per line is not a limitation implemented by Google, but rather an internet standard for plain text messages (RFC 2822) recommended and promoted by the Internet Engineering Task Force (IETF). It’s true that section 2.1.1 of RFC 2822 recommends a maximum of 78 characters per line (excluding the CRLF newline characters that end each line) in the source of email messages. But if this is what causes the broken behavior in Gmail, how come other mail clients don’t have the same issue? They have to respect the line length limit too, right? The solution Sure enough — the problem can be solved without violating any standards and without exceeding the 78-characters-per-line limit. It is perfectly possible to send non-hard-wrapped plain text emails by using the Quoted-Printable encoding as defined by RFC 2045. In fact, Gmail already kind of supports this: it’s capable of decoding and displaying Quoted-Printable-encoded emails flawlessly, and it encodes HTML emails with it before sending them — it just doesn’t do the same thing for plain text emails (yet). Here’s what the source of a plain text email composed in Gmail looks like. Note that it contains hard line breaks to satisfy the 78-characters-per-line limit: Content-Type: text/plain; charset=UTF-8 Lorem ipsum dolor sit amet, consectetuer adipiscing elit, sed diamnonummy nibh euismod tincidunt ut laoreet dolore magna aliquam eratvolutpat. Ut wisi enim ad minim veniam, quis nostrud exerci tationullamcorper suscipit lobortis nisl ut aliquip ex ea commodo consequat. With Quoted-Printable encoding, it could look like this instead: Content-Type: text/plain; charset=UTF-8Content-Transfer-Encoding: quoted-printableLorem ipsum dolor sit amet, consectetuer adipiscing elit, sed diam nonummy =nibh euismod tincidunt ut laoreet dolore magna aliquam erat volutpat. Ut wi=si enim ad minim veniam, quis nostrud exerci tation ullamcorper suscipit lo=bortis nisl ut aliquip ex ea commodo consequat. This way, the lines wrap nicely (no forced line breaks) when viewing the email in Gmail or in another mail client. Summary Dear Gmail team, please consider Quoted-Printable-encoding plain text emails composed using the Gmail web interface as shown in the above example, just like you do for HTML emails. That way, no hard-wrapping of the email’s actual contents is necessary. Thanks! About me Hi there! I’m Mathias. I work on Chrome at Google. HTML, CSS, JavaScript, Unicode, performance, and security get me excited. Follow me on Twitter, Bluesky, and GitHub. Comments Thomas Broyer wrote on 4th July 2014 at 10:52: …or use the 10-year-old RFC 3676 format=flowed (which, by the way, itself builds on the 15-year-old RFC 2646). Not sure how many mail clients support those RFCs though… Alex wrote on 4th July 2014 at 11:11: Notably, Outlook does the same, so that’s probably why Gmail does it as well. Henri Sivonen wrote on 4th July 2014 at 12:18: You should be asking for format=flowed instead of Quoted-Printable. Update: Oh, I now see that I should have reloaded to see Thomas Broyer already mentioned format=flowed. It is supported by Apple Mail. Lack thereof in other clients continues to irk me even though I abandoned Apple Mail years ago. Mathias wrote on 4th July 2014 at 13:14: Thomas and Henri: Agreed, format=flowed support would be even better! But like you said a) it doesn’t work in all major email clients, and b) it’s trickier to implement, especially in Gmail’s case: they already have a working Quoted-Printable implementation. Let’s take it one step at a time :) Aaron Meurer wrote on 4th July 2014 at 17:28: Would that cause it to screw up the formatting of any code in an email? Mathias wrote on 4th July 2014 at 17:42: Aaron: The current behavior alters the formatting of the email’s content, in a way that cannot be undone, yes. Álvaro G. Vicario wrote on 5th July 2014 at 17:26: I wonder if their broken Reply-To support is also the result of a misinterpreted RFC… sigh Bijan Vakili wrote on 6th July 2014 at 14:34: This would be nice as an advanced feature, but there is a valid argument against making it the default: Studies have shown that reading lines of text within the 60-100 character width improves accuracy, speed and is less fatiguing than longer, or shorter lines. Note this topic’s been out there for some time. Some wrote on 6th July 2014 at 15:18: Bijan, please look at the example image from the smartphone. Did you notice how the lines breaks at odd places? The device can only show a limited number of characters, so it has to break the lines, but still breaks it at the place where Google has put the line breaks. Mikel wrote on 6th July 2014 at 15:28: Bijan, the point of quoted-printable or format=flowed is the receiver’s mail app is free to wrap at any width. The easiest way to do this is to shrink the window to a size you find comfortable, but some mail apps provide more powerful ways. Without quoted-printable or format=flowed, the mail app has to assume the line breaks have to go where the sender’s mail app put them. Guillermo wrote on 6th July 2014 at 15:48: I like the way it is, and I really prefer that over emails that have lines of 2000 characters. If you don’t want the standard text-wrap, just don’t use the plain text mode. HTML mode solves that problem. Mathias wrote on 6th July 2014 at 16:01: Guillermo: Most of the emails I send contain no formatting whatsoever, except for indentation, paragraphs and other formatting that can be represented just fine using plain text. Why should I wastefully send unneeded markup that makes the size of my email several times larger than what’s actually needed? Scuzzball wrote on 6th July 2014 at 16:21: Guillermo: Many things require plain text emails, such as the Debian mailing lists. This seems to be standard for many mailing lists. bobbyi_settv wrote on 6th July 2014 at 17:17: This doesn’t even mention the most annoying part of the line wrapping which is how it interacts with Gmail’s “Undo Send” feature. If you notice an error in your email and click Undo, they bring you back to the compose mode with the hard newlines still inserted. If you edit the email and send, they now add more hard newlines for where the new line endings are and you end up with a mix of tiny lines and normal lines looking like your email is written in free verse. foobar wrote on 6th July 2014 at 17:18: Well, your criticism of Google’s defect is perfectly valid, but your suggestion is just as broken as the current state of affairs. The correct way to display a mail that’s not format=flowed is as-is (after MIME decoding), without any changes in line breaks. Reflowing of long lines in such a mail is essentially a defect in the MUA, and can be quite annoying for some uses (exceptions might apply if the line is too wide for the viewport, but the width of the viewport is something quite different from the optimal reading width, which should be used for paragraph wrapping). QP encoding does solve the “transmission of long lines via email” problem, but what you are transmitting is still a line, while what you want to transmit is a reflowable paragraph, which does not exist as such in “normal” plain text emails. The only sane solution is format=flowed, as that explicitly allows reflowing for MUA capable of doing so, but still keeps the text readable in MUAs that don’t understand format=flowed by keeping the lines reasonably short, and also keeps the quoting intact for both reflowing and non-reflowing UAs. Radu Grigore wrote on 6th July 2014 at 21:52: I think a) insertion of \n should be an option the sender has, and b) reflowing lines should be an option the receiver has. In particular, the smartphone app should give the user the option to reflow plain text. In fact, it should probably be the default. foobar wrote on 6th July 2014 at 23:07: Radu: No, the point of email is that it is an interoperable system, and encoding or decoding choices for the user to make are a sign of a design flaw and not a solution, as that would mean that users have to manually ensure that their choice matches the choice of the person they are communicating with. The sending MUA should encode the input in a way that conveys the meaning that the user intended according to the standard and the receiving MUA should decode the mail and display it so that it conveys what the mail means according to the standard, then everything would be fine. There might be an argument for having smartphone MUAs automatically reflow plaintext emails if there isn’t enough space for 80 columns due to the lack of any unambiguous paragraph encoding in “normal” plaintext emails, as that was a use case not anticipated by the old standard. But it should come with an easily accessible toggle in case you get a mail where line breaks are significant. Radu Grigore wrote on 6th July 2014 at 23:53: foobar: I don’t care about how this is implemented, encoding/decoding mumbo-jumbo. I like short lines. If Gmail would stop inserting \n, I would type them myself. I understand if other people dislike Gmail being proactive and editing their email, so I think those people should be able to ask Gmail not to do so. On the receiving end, if you see funny lines on the screen you should be able to ask for a reflow. Whether Gmail inserts \n or not has nothing to do with whether my email looks funny: as I said, I'd be perfectly willing to include the newlines myself. That shouldn’t cause immeasurable pain to receivers with tiny smartphones. Again: the sender should have control over what message gets sent. The receiver should have control over how the message is displayed. I’m talking about the message. I don’t care about how the message is encoded. foobar wrote on 7th July 2014 at 01:21: Radu: No, you are probably thinking about it at the wrong level of abstraction if you think about “inserting \ns”. That’s already part of the encoding process. The user enters text and splits it into paragraphs and possibly lines. That’s what needs to be encoded so that after it has been decoded at the other end, the user again sees those paragraphs and lines. What kinds of (control) characters are needed in order to make that happen in a backward compatible way with all kinds of recipients is a matter of the respective email standards and none of the user’s business. Ultimately, it is somewhat of a confusion to say “The sender should have control over what message gets sent. The receiver should have control over how the message is displayed.”. The structure of the message is part of the message, in the sense that it can be semantically relevant, and as such has to be reproduced by the receiving MUA in order to not lose information. If the receiving user has to instruct the MUA how to decode the mail into paragraphs and/or lines, that’s a workaround for a broken encoding mechanism. The mail itself should indicate what is a praragraph and therefore can be reflowed and what is a line and therefore can not, without any need for user intervention. I agree that the problem is that Gmail is editing the mail. They split a paragraph(!) that the user entered into a series of lines(!) and send that instead. If the user composes a paragraph, they need to encode a paragraph and not silently convert it to something else. Tetsuo Shima wrote on 7th July 2014 at 04:06: I too feel the same way. I wish everything was plain text. Kevin wrote on 7th July 2014 at 04:15: They also mess up when plaintext emails use > for quoting or if they have inline attachments. Gmail just doesn’t play well with plaintext email, I’m afraid. Tried bringing it up a few years ago but they didn’t really care to fix it: https://groups.google.com/a/googleproductforums.com/d/msg/gmail/-/jLE7_XtZR8oJ. Evan wrote on 7th July 2014 at 06:13: There’s a really simple solution for this, actually: stop using Gmail. Radu Grigore wrote on 7th July 2014 at 09:11: foobar: The right level of abstraction, when designing what the user should see, is to ignore all encoding/decoding. I understand that “inserting \n” isn’t quite “inserting \n”, but the result of broken encoding/encoding. That, however, is completely irrelevant to me as a user. What I see is that the message gets edited. They split a paragraph(!) that the user entered into a series of lines(!) and send that instead. Actually, they split a line into a series of lines. Plain text has no concept of paragraph. That’s where the problem lies, and that’s why the receiver should be able to choose when reflowing is done. You seem to think that a paragraph is a long line. I, on the other hand, often use the convention that a paragraph is something separated by two or more newlines. Eli Barzilay wrote on 7th July 2014 at 09:25: Um, they don’t need to implement QP encoding — they already do that, only for '''
