title = "JavaScript engine fundamentals: optimizing prototypes · Mathias Bynens"
full_description = "JavaScript engine fundamentals: optimizing prototypes Published 16th August 2018 · tagged with JavaScript, performance This article describes some key fundamentals that are common to all JavaScript engines — and not just V8, the engine the authors (Benedikt and Mathias) work on. As a JavaScript developer, having a deeper understanding of how JavaScript engines work helps you reason about the performance characteristics of your code. Previously, we discussed how JavaScript engines optimize object and array access through the use of Shapes and Inline Caches. This article explains optimization pipeline trade-offs and describes how engines speed up accesses to prototype properties. Note: If you prefer watching a presentation over reading articles, then enjoy the video below! If not, skip the video and read on. Optimization tiers and execution trade-offs Our previous article discussed how modern JavaScript engines all have the same overall pipeline: We also pointed out that although the high-level pipeline is similar between engines, there are often differences in the optimization pipeline. Why is that? Why do some engines have more optimization tiers than others? It turns out there is a trade-off between quickly getting code to run, or taking some more time but eventually running the code with optimal performance. An interpreter can produce bytecode quickly, but bytecode is generally not very efficient. An optimizing compiler on the other hand takes a little longer, but eventually produces much more efficient machine code. This is exactly the model that V8 uses. V8’s interpreter is called Ignition, and it’s the fastest interpreter of all the engines (in terms of raw bytecode execution speed). V8’s optimizing compiler is named TurboFan, and it eventually generates highly-optimized machine code. This trade-off between startup latency and execution speed is the reason why some JavaScript engines choose to add optimization tiers in between. For example, SpiderMonkey adds a Baseline tier in between the interpreter and their full IonMonkey optimizing compiler: The interpreter generates bytecode quickly, but the bytecode executes relatively slowly. Baseline takes a little longer to generate code, but it offers better run-time performance. And finally, the IonMonkey optimizing compiler takes the longest to produce machine code, but that code can run very efficiently. Let’s take a look at a concrete example and see how the pipelines in the different engines deal with it. Here’s some code that gets repeated often, in a hot loop. let result = 0;for (let i = 0; i < 4242424242; ++i) { result += i;}console.log(result); V8 starts running the bytecode in the Ignition interpreter. At some point the engine determines that the code is hot and starts up the TurboFan frontend, which is the part of TurboFan that deals with integrating profiling data and constructing a basic machine representation of the code. This is then sent to the TurboFan optimizer on a different thread for further improvements. While the optimizer is running, V8 continues executing the bytecode in Ignition. At some point the optimizer is done and we have executable machine code, and the execution can continue with that. Update: As of Chrome 91 (released in 2021), V8 has an additional compiler called Sparkplug in between the Ignition interpreter and the TurboFan optimizing compiler. The SpiderMonkey engine also starts running the bytecode in the interpreter. But it has the additional Baseline tier, which means hot code is first sent to Baseline. The Baseline compiler generates Baseline code on the main thread and continues execution once ready. If Baseline code is run for a while, SpiderMonkey eventually fires up the IonMonkey frontend, and kicks off the optimizer — very similarly to V8. It keeps running in Baseline while IonMonkey is optimizing. Finally, when the optimizer is done, the optimized code is executed instead of the Baseline code. Chakra’s architecture is very similar to SpiderMonkey’s, but Chakra tries to run more things concurrently to avoid blocking the main thread. Instead of running any part of the compiler on the main thread, Chakra copies out the bytecode and the profiling data that the compiler likely needs and sends it to a dedicated compiler process. When the generated code is ready, the engine starts to run this SimpleJIT code instead of the bytecode. The same goes for the FullJIT. The benefit of this approach is that the pause times where the copy happens are usually much shorter compared to running the full compiler (frontend). But the downside of this approach is that the copy heuristic might miss some information that would be required for a certain optimization, so it’s trading code quality for latency to some extent. In JavaScriptCore, all optimizing compilers run fully concurrent with the main JavaScript execution; there’s no copy phase! Instead, the main thread merely triggers compilation jobs on another thread. The compilers then use a complicated locking scheme to access profiling data from the main thread. The advantage of this approach is that it reduces the jank caused by JavaScript optimization on the main thread. The downside is that it requires dealing with complex multithreading issues and paying some locking cost for various operations. We’ve talked about the trade-off between generating code quickly like with an interpreter, or generating quick code with an optimizing compiler. But there is another trade-off: memory usage! To illustrate that, here’s a simple JavaScript program that adds two numbers together. function add(x, y) { return x + y;}add(1, 2); Here’s the bytecode we generate for the add function using the Ignition interpreter in V8: StackCheckLdar a1Add a0, [0]Return Don’t worry about the exact bytecode — you don’t really need to read it. The point is that it’s just four instructions! When the code becomes hot, TurboFan generates the following highly-optimized machine code: leaq rcx,[rip+0x0]movq rcx,[rcx-0x37]testb [rcx+0xf],0x1jnz CompileLazyDeoptimizedCodepush rbpmovq rbp,rsppush rsipush rdicmpq rsp,[r13+0xe88]jna StackOverflowmovq rax,[rbp+0x18]test al,0x1jnz Deoptimizemovq rbx,[rbp+0x10]testb rbx,0x1jnz Deoptimizemovq rdx,rbxshrq rdx, 32movq rcx,raxshrq rcx, 32addl rdx,rcxjo Deoptimizeshlq rdx, 32movq rax,rdxmovq rsp,rbppop rbpret 0x18 That’s a lot of code, especially when compared to the four instructions we had in the bytecode! In general, bytecode tends to be a lot more compact than machine code, especially optimized machine code. On the other hand, bytecode needs an interpreter to run, whereas the optimized code can be executed directly by the processor. This is one of the main reasons why JavaScript engines don’t just “optimize everything”. As we saw earlier, generating optimized machine code takes a long time, and on top of that, we just learned that optimized machine code also requires more memory. Summary: The reason JavaScript engines have different optimization tiers is because of a fundamental trade-off between generating code quickly like with an interpreter, or generating quick code with an optimizing compiler. It’s a scale, and adding more optimization tiers allows you to make more fine-grained decisions at the cost of additional complexity and overhead. In addition, there’s a trade-off between the optimization level and the memory usage of the generated code. This is why JavaScript engines try to optimize only hot functions. Optimizing prototype property access Our previous article explained how JavaScript engines optimize object property loads using Shapes and Inline Caches. To recap, engines store the Shape of the object separately from the object’s values. Shapes enable an optimization called Inline Caches or ICs for short. Combined, Shapes and ICs can speed up repeated property accesses from the same place in your code. Classes and prototype-based programming Now that we know how to make property access fast on JavaScript objects, let’s look at one of the more recent additions to JavaScript: classes. Here’s what the JavaScript class syntax looks like: class Bar { constructor(x) { this.x = x; } getX() { return this.x; }} Although this appears to be a new concept in JavaScript, it’s merely syntactic sugar for prototype-based programming that has been used in JavaScript forever: function Bar(x) { this.x = x;}Bar.prototype.getX = function getX() { return this.x;}; Here, we assign a getX property on the Bar.prototype object. This works in exactly the same way as with any other object, because prototypes are just objects in JavaScript! In prototype-based programming languages like JavaScript, methods are shared via the prototypes, while fields are stored on the actual instances. Let’s zoom in on what happens behind the scenes when we create a new instance of Bar called foo. const foo = new Bar(true); The instance created from running this code has a shape with a single property 'x'. The prototype of foo is the Bar.prototype that belongs to the class Bar. This Bar.prototype has a shape of its own, containing a single property 'getX' whose value is the function getX that just returns this.x when called. The prototype of Bar.prototype is the Object.prototype that’s part of the JavaScript language. The Object.prototype is the root of the prototype tree and thus its prototype is null. If you create another instance of the same class, both instances share the object shape, as we discussed earlier. Both instances point to the same Bar.prototype object. Prototype property access Ok, so now we know what happens when we define a class and we create a new instance. But what happens if we call a method on an instance, like we’re doing here? class Bar { constructor(x) { this.x = x; } getX() { return this.x; }}const foo = new Bar(true);const x = foo.getX();// ^^^^^^^^^^ You can think of any method call as two individual steps: const x = foo.getX();// is actually two steps:const $getX = foo.getX;const x = $getX.call(foo); Step 1 is to load the method, which is just a property on the prototype (whose value happens to be a function). Step 2 is to call the function with the instance as the this value. Let’s walk through that first step, which is loading the method getX from the instance foo. The engine starts at the foo instance and realizes there is no 'getX' property on foos shape, so it has to walk up the prototype chain for it. We get to Bar.prototype, look at its prototype shape, and see that it has the 'getX' property at offset 0. We look up the value at this offset in Bar.prototype and find the JSFunction getX that we were looking for. And that’s it! JavaScript’s flexibility makes it possible to mutate prototype chain links, for example: const foo = new Bar(true);foo.getX();// → trueObject.setPrototypeOf(foo, null);foo.getX();// → Uncaught TypeError: foo.getX is not a function In this example, we call foo.getX() twice, but each time it has a completely different meaning and result. This is why, although prototypes are just objects in JavaScript, speeding up prototype property access is even more challenging for JavaScript engines than speeding up own property access on regular objects. Looking at programs in the wild, loading prototype properties is a very frequent operation: it happens every time you call a method! class Bar { constructor(x) { this.x = x; } getX() { return this.x; }}const foo = new Bar(true);const x = foo.getX();// ^^^^^^^^^^ Earlier, we discussed how engines optimize loading regular, own properties through the use of Shapes and Inline Caches. How can we optimize repeated loads of prototype properties on objects with similar shapes? We saw above how the property load happens. In order to make that fast for repeated loads in this particular case, we need to know these three things: The shape of foo does not contain 'getX' and did not change. This means no one altered the object foo by adding or deleting a property, or by changing one of the property attributes. The prototype of foo is still the initial Bar.prototype. This means no one changed foos prototype by using Object.setPrototypeOf() or by assigning to the special __proto__ property. The shape of Bar.prototype contains 'getX' and did not change. This means no one altered the Bar.prototype by adding or deleting a property, or by changing one of the property attributes. In the general case, that means we have to perform 1 check on the instance itself, plus 2 checks for each prototype up to the prototype which holds the property we’re looking for. 1+2N checks (where N is the number of prototypes involved) might not sound too bad for this case, because the prototype chain is relatively shallow — but engines often have to deal with much longer prototype chains, like in the case of common DOM classes. Here’s an example of that: const anchor = document.createElement('a');// → HTMLAnchorElementconst title = anchor.getAttribute('title'); We have an HTMLAnchorElement and we call the getAttribute() method on it. The prototype chain of this simple anchor element already involves 6 prototypes! Most of the interesting DOM methods are not on the direct HTMLAnchorElement prototype, but higher up in the chain. The getAttribute() method is found on the Element.prototype. That means each time we call anchor.getAttribute(), the JavaScript engine needs to… check that 'getAttribute' is not on the anchor object itself, check that the direct prototype is HTMLAnchorElement.prototype, assert absence of 'getAttribute' there, check that the next prototype is HTMLElement.prototype, assert absence of 'getAttribute' there as well, eventually check that the next prototype is Element.prototype, and that 'getAttribute' is present there. That’s a total of 7 checks! Since this kind of code is pretty common on the web, engines apply tricks to reduce the number of checks necessary for property loads on prototypes. Going back to the earlier example, we perform a total of 3 checks when accessing 'getX' on foo: class Bar { constructor(x) { this.x = x; } getX() { return this.x; }}const foo = new Bar(true);const $getX = foo.getX; For each object involved up until the prototype that carries the property, we need to do shape checks for absence. It’d be nice if we could reduce the number of checks by folding the prototype check into the absence check. And that’s essentially what engines do with a simple trick: instead of storing the prototype link on the instance itself, engines store it on the Shape. Each shape points to the prototype. This also means that every time the prototype of foo changes, the engine transitions to a new shape. Now we only need to check the shape of an object to both assert absence of certain properties and also guard the prototype link. With this approach, we can reduce the number of checks required from 1+2N to 1+N for faster property access on prototypes. But that’s still quite expensive, since it’s still linear in the length of the prototype chain. Eng"
