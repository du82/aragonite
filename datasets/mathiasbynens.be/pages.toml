["https://mathiasbynens.be/notes/apache-allowoverride-all"]
title = "Apache’s AllowOverride All doesn’t do what you think it does · Mathias Bynens"
full_description = "Apache’s AllowOverride All doesn’t do what you think it does Published 10th March 2009 · tagged with Apache I just had to set up an Apache server for a school project. Because I like to use .htaccess files to set rewrite rules and fiddle with some other options, some extra modules had to be loaded in addition to the standard batch. Checking which modules are currently loaded can easily be done using phpinfo(), as explained in this post about enabling mod_rewrite in Apache. Activating Apache modules is easy: simply open up the httpd.conf file in the /conf/ folder of your Apache installation, and uncomment (or add) the appropriate lines. Commented lines always start with a hash (#).Basically, to load mod_negotiation (for MultiViews) and mod_rewrite (for rewrite rules), you simply add the following lines to httpd.conf: LoadModule negotiation_module modules/mod_negotiation.soLoadModule rewrite_module modules/mod_rewrite.so So far, so good. Apache is instructed to load the extra modules; we should now be able to use MultiViews and rewrite rules by defining them in a .htaccess file.However, when I tried using Options +MultiViews, all I got was one of those infamous “500 Internal Server Error” pages. The error log said something among the lines of .htaccess: Option MultiViews not allowed here. Google wasn’t really helpful in this case. At first, all I could find was someone having the same problem. I couldn’t find any solutions until I actually started browsing old #apache IRC logs. Turns out Apache has a default setting in httpd.conf which specifies the settings that can be overriden by what’s written in your .htaccess file: AllowOverride. Your httpd.conf might contain something like this: <Directory /> Options FollowSymLinks AllowOverride All Order deny,allow Deny from all</Directory> Contrary to what you may think, the All parameter doesn’t really mean “[allow overriding] all options”, since it doesn’t include the MultiViews option! The key here is to use AllowOverride Options=All,MultiViews. Together with all other groupings of directives, this is the code we need: <Directory /> Options FollowSymLinks AllowOverride AuthConfig FileInfo Indexes Limit Options=All,MultiViews Order deny,allow Deny from all</Directory> About me Hi there! I’m Mathias. I work on Chrome at Google. HTML, CSS, JavaScript, Unicode, performance, and security get me excited. Follow me on Twitter, Bluesky, and GitHub. Comments Jean Delvare wrote on 26th June 2010 at 10:38: I had the exact same problem, and your solution works just fine. Very useful article, thanks! Sean Wragg wrote on 18th September 2010 at 03:36: I was having this exact issue. Great post - very helpful! Thanks Sebastian Wojtowicz wrote on 17th September 2011 at 16:21: Had the error because FLOW3 has Options -MultiViews in its .htaccess. Now I have set this rule in my Apache’s .conf file for the FLOW3 folder: AllowOverride FileInfo Options=MultiViews And it works. Thanks! Sebastiaan van Parijs wrote on 6th April 2012 at 16:11: Nice to see a fellow FLOW3 developer having the same issue here. Thanks for the blog post (& comment of a fellow community member). Michał Roszka wrote on 27th March 2014 at 23:24: Good catch, Mathias! Thank you for a helpful post. For the sake of my curiosity I did a little research about it. It turns out, this has been the case since the very early releases of the Apache HTTP server, including 1.3. And this actually has been documented since forever. The documentation clearly says that All means All options except for MultiViews. Yet, for some reason it is somewhat difficult to catch it while reading the documentation. :-) James C wrote on 2nd May 2014 at 18:24: Excellent. This fixed my issue, thank you Jiri Svejda wrote on 13th November 2014 at 15:17: Thank you so much! This helped me immensely. Your solution is the only one that worked for me. Keep it up, you're awesome! Sebastian wrote on 6th November 2015 at 19:46: Really helpful! Thank you! Leave a comment Comment on “Apache’s AllowOverride All doesn’t do what you think it does” Name * Email * Website Your input will be parsed as Markdown. Spammer? (Enter ‘no’) *"
