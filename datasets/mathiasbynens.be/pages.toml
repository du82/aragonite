title = "Bulletproof HTML5 <details> fallback using jQuery · Mathias Bynens"
full_description = '''Bulletproof HTML5 <details> fallback using jQuery Published 25th April 2010 · tagged with CSS, HTML, JavaScript, jQuery The HTML5 <details> element is currently not natively supported in any browser natively supported in Chrome 12 and up. This makes it a little hard to guess how exactly this new element will behave, but reading the spec gives us a pretty good idea. What’s clear is the following: A details element represents a disclosure widget from which the user can obtain additional information or controls. This information is hidden by default. It can be made visible by adding the boolean open attribute to the <details> element. After that, the user can toggle the visibility by clicking the <summary>. The summary element represents a summary, caption, or legend for the rest of the contents of the summary element’s parent details element, if any. If there is no child summary element, the user agent should provide its own legend (e.g. “Details”). Note that while the spec describes what should happen in case the <summary> element is omitted, it’s still invalid to do so. It appears to me the summary element should be keyboard accessible as well. You should be able to tab through all different interactive elements (such as links, buttons, form elements), and guess what — summary is one of them. After focusing it with the keyboard, it would be nice to just hit Enter or Space to toggle visibility of the <details> element’s contents. The HTML spec doesn’t say anything about this matter, though. Note that details got included into HTML5 because it’s such a common behavior for web sites and apps — so common it should be possible to do this without the need for additional scripting to make the whole thing work. However, HTML5 is still a work in progress. The <details> element is not even implemented yet. In the meantime, it’s important to provide a fallback/polyfill when using new features that aren’t (fully) supported cross-browser. CSS, JavaScript, and jQuery to the rescue Luckily it’s pretty easy to make <details> work cross-browser using a combination of CSS, (plain) JavaScript, and jQuery. Detecting native <details> support with JavaScript First, let’s add class="no-details" to the html element if JavaScript is enabled and the browser does not support <details> natively. This will allow us to write CSS specifically for the occasion our scripts will actually be executed. Adding the class can be done in various ways, but the one I prefer is by placing the following snippet in the <head>: <script> // Don’t use this! See note below. if (!('open' in document.createElement('details'))) { document.documentElement.className += ' no-details'; }</script> Update: Chrome 10 recognizes the open attribute for <details> elements, even though it doesn’t support rendering the element correctly yet. This means the above feature detection method has become unreliable. I’ve now created a more robust feature test for <details>/<summary> support: var isDetailsSupported = (function(doc) { var el = doc.createElement('details'); var fake; var root; var diff; if (!('open' in el)) { return false; } root = doc.body || (function() { var de = doc.documentElement; fake = true; return de.insertBefore(doc.createElement('body'), de.firstElementChild || de.firstChild); }()); el.innerHTML = '<summary>a</summary>b'; el.style.display = 'block'; root.appendChild(el); diff = el.offsetHeight; el.open = true; diff = diff != el.offsetHeight; root.removeChild(el); if (fake) { root.parentNode.removeChild(root); } return diff;}(document)); So after that, we can just do something like: <script> if (!isDetailsSupported) { document.documentElement.className += ' no-details'; }</script> Note that Modernizr currently doesn’t detect <details> support. I’m sure it will be included soon. Update: My feature test for <details> is now included in the Modernizr repository. Adding some basic style Now we can add some fundamental styling to the details element and its children. /* Default browser styles for <details> and <summary> */details { display: block; }summary { display: list-item; }/* The following styles will only get applied if JavaScript is enabled and <details> is not natively supported *//* Add focus styles (for keyboard accessibility) */.no-details summary:hover, .no-details summary:focus { background: #ddd; }/* The following styles are not really needed, since the jQuery script takes care of hiding/displaying the elements. *//* However, we’re still gonna use CSS as well to prevent FOUC in browsers that understand these selectors. *//* Remember: by default (and probably most of the time), the contents of the <details> element are hidden. *//* Hide all direct descendants of every <details> element *//* Note that IE6 doesn’t support the child selector; we’ll work around that using jQuery later */.no-details details > * { display: none; }/* Make sure summary remains visible */.no-details details summary { display: list-item; }/* Apply a pointer cursor upon hover to indicate it’s a clickable element. These styles can be applied regardless of whether the fallback is needed */summary { cursor: pointer; } The jQuery magic I’ve written a jQuery plugin that makes it very easy to emulate <details>/<summary> in browsers that don’t support these elements yet. Check out the code on GitHub. After including jQuery and the plugin, you can just write something like this to emulate <details>/<summary> where necessary: $('details').details(); The result of the feature test is stored in $.fn.details.support, which will be true if the browser natively supports <details> and <summary>, and false otherwise: // Conditionally add a classname to the `<html>` element, based on native support$('html').addClass($.fn.details.support ? 'details' : 'no-details'); The plugin will also add the appropriate ARIA annotations for optimal accessibility. This will be done even in browsers that natively support <details>, just in case. Demo I’ve put up a demo page with heavily commented source code as well. Enjoy! This fallback works in all A-grade browsers, including IE6. It will only be executed if the <details> element is not natively supported in the browser. If it isn’t, and JavaScript is disabled, all elements will still be visible to the user. Note that you should never pull in a 25 KiB JavaScript library just to make <details> work — this solution should only be used in cases where jQuery is used already. Of course it’s possible to rewrite this as plain JavaScript, but I’ll leave that as an exercise to the reader ;) About me Hi there! I’m Mathias. I work on Chrome at Google. HTML, CSS, JavaScript, Unicode, performance, and security get me excited. Follow me on Twitter, Bluesky, and GitHub. Comments riddle wrote on 25th April 2010 at 21:31: This is a neat demo, exactly what early HTML5 adopters should be doing. Spot on :) I’d like to suggest how it should look. There is no information about this part in the spec, but I’ve seen “disclosure widget” used in another spec – The Apple HIG. In OS X, this is a disclosure widget: It’s pretty obvious what it will do when clicked. I think it’s a good starting point. Remy Sharp wrote on 26th April 2010 at 14:22: Sorry, but I’m going to call you out on the bulletproof bit. Why I wouldn’t call this bullet proof: you’re relying on jQuery — that’s 25k + your code just to enable details by itself — that’s a lot of code for such as small effect (though to your credit — you are suggesting that someone doesn’t include jQuery just to produce this effect at the very end of your post). As for the rewrite for sans-jQuery — I wrote this last year and dropped it recently into a gist: http://gist.github.com/370590 Mathias wrote on 26th April 2010 at 14:38: Remy: By ‘bulletproof’ I mean it works cross-browser, degrades gracefully without JavaScript and/or CSS, and doesn’t interfere with future native implementations. Requiring jQuery doesn’t make it any less bulletproof, it just adds a dependency. Yes, this script requires jQuery, but it can be rewritten into plain JavaScript, as I indeed noted in my post (and as you already did last year!). I strongly agree my jQuery solution should never be used in the case where jQuery isn’t already included. I’m liking your version in plain JavaScript — however, unless I’m missing something it doesn’t seem to check for native support, which renders it ‘not bulletproof’ as well. Your implementation is very likely to break when browsers start supporting <details>. FYI, your script doesn’t seem to work in any version of Internet Explorer. Shelley wrote on 26th April 2010 at 14:50: Did you test with a details element that only contains text? Mathias wrote on 26th April 2010 at 15:16: Shelley: Ah, gotcha! I hadn’t thought of that, thanks. Of course, that didn’t work since details > * { display: none; } doesn’t apply to direct child text nodes. This is now fixed. I’ve added two examples to the demo page as well to demonstrate this functionality. Shelley wrote on 26th April 2010 at 16:34: Cool, but where’s the ARIA annotation? Mathias wrote on 26th April 2010 at 21:11: Shelley: Which ARIA roles would you suggest? role="button" for the <summary> element? Which ARIA properties did you have in mind? Should aria-expanded be used as an attribute to the <details> element? If aria-hidden is used, should it be an attribute to the <details> element? Or should a new element be created to wrap the contents? I discussed this with some people with a far better understanding of the WAI-ARIA spec than myself, and Benjamin Hawkes-Lewis suggested the following: <details role="section" aria-expanded="false" aria-labelledby="label"> <summary id="label" role="button" aria-controls="content">Summary goes here</summary> <div id="content" aria-hidden="true">Content goes here</div></details> Shelley wrote on 26th April 2010 at 22:50: What you need to do is ask Ian Hickson and the HTML WG what the ARIA mapping is going to be. Otherwise, we’re all just guessing, because it’s an ill-defined object in the HTML5 spec. What H-L suggests is pretty much what I have for my demonstrations on removing the details element from the HTML spec. You can see four different types at http://burningbird.net/html5/. The two I incorporated were aria-expanded and aria-hidden. I’m not sure you need a button role, because it’s not a button. The tabindex should make it keyboard focusable, and NVDA at least says it is clickable. Do not use section. Section is an abstract, ontological role. The Illinois Center for Information Technology Accessibility uses roles of application, tab, and tablist for an accordion and tabbed page, and this is nothing more than a singular accordion panel. So I’d incorporate these. Again, though, until this is recorded in the HTML5 spec, what you use may or may not be equivalent to HTML5 details. Unless I can convince the powers-that-be to dump the thing, for the ill-defined thing it is. No offense to your and Remy’s hard work trying to come up with an emulation. Benjamin Hawkes-Lewis wrote on 26th April 2010 at 23:52: I’m not sure you need a button role, because it’s not a button. Interesting. Seems to me the disclosure clickable is a button as WAI-ARIA defines it (“An input that allows for user-triggered actions when clicked or pressed”). Whether the addition of this role annotation is actually necessary or helpful is a subtly different question though. Do not use section. Section is an abstract, ontological role. Oops — good point. I think its concrete child group might be applicable though. The Illinois Center for Information Technology Accessibility uses roles of application, tab, and tablist for an accordion and tabbed page, and this is nothing more than a singular accordion panel. I find a tablist containing only one tabitem slightly odd, like an ol with a single li. Where you have a list (especially a nested list) of details elements, WAI-ARIA tree and treeitem annotations might also be appropriate. While I imagine it might be pretty straightforward to implement details natively (for example, as an OS X Disclosure Triangle mapped directly to the AXDisclosureTriangle role in the Apple Accessibility API), I don’t think it’s going to be trivial to come up with one satisfactory ARIA mapping that will cover all the ways developers could fake details with CSS and JS. Shelley wrote on 27th April 2010 at 01:10: We really can’t emulate details, because there is no accessibility attached to details. We’re not even completely sure of the element’s behavior, or what action triggers the behavior. Now, if we’re concerned about the appropriate use of ARIA annotation for existing implementations of this type of functionality, then we’re looking at a different thing. For instance, this is a behavior, but applied to a table, it has one connotation, when applied to form elements, or a menu, there are different connotations. And different ARIA annotations to match. If the item is a popup menu, there is one set of roles and states, as demonstrated here: http://test.cita.illinois.edu/aria/menubar/menubar1.php However, if the context of use differs, then there will be different roles and states. We keep trying to attach semantics to the behavior, when we need to attach semantics to the use. And we won’t know the use, until it’s actually used. Still, we do have states that map to the behavior: aria-hidden, aria-expanded, aria-haspopup, and others. Mathias, I would recommend looking at the code for jQuery UI. It has implemented ARIA states into many of the effects. I bet it could be an excellent guide. Benjamin Hawkes-Lewis wrote on 27th April 2010 at 09:04: We really can’t emulate details, because there is no accessibility attached to details. We’re not even completely sure of the element’s behavior, or what action triggers the behavior. Now, if we’re concerned about the appropriate use of ARIA annotation for existing implementations of this type of functionality, then we’re looking at a different thing. For instance, this is a behavior, but applied to a table, it has one connotation, when applied to form elements, or a menu, there are different connotations. And different ARIA annotations to match. I think that’s right, although I suspect that defining any particular behavioral implementation of details semantics would be inappropriate for the HTML5 spec. (Just as with input type="file".) Ryan wrote on 27th April 2010 at 16:48: Totally going away from where this thread is headed, but aren’t the arrows backwards based on state? The arrows should point down when expanded, not to the right. Vice versa for collapsed. Mathias wrote on 27th April 2010 at 17:04: Ryan: D’oh! Thanks, it’s fixed now. Steve wrote on 28th April 2010 at 04:12: Really handy technique thank you. Been looking into HTML5 and the worry about a fallback is there. Bramus! wrote on 29th April 2010 at 23:26: Neat! Webstandard-Blog wrote on 30th April 2010 at 08:50: Very interesting, but I think it will take some tim'''
