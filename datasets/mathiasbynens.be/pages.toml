full_description = "This document loads a raw JSON resource using Ajax, then parses that data through JSON.parse(), and finally displays (part of) the data in an alert box. See Loading JSON-formatted data with Ajax and responseType='json' for more information. (function() { var getJSON = function(url, successHandler, errorHandler) { var xhr = typeof XMLHttpRequest != 'undefined' ? new XMLHttpRequest() : new ActiveXObject('Microsoft.XMLHTTP'); xhr.open('GET', url, true); xhr.onreadystatechange = function() { var status; var data; // http://xhr.spec.whatwg.org/#dom-xmlhttprequest-readystate if (xhr.readyState == 4) { // `DONE` status = xhr.status; if (status == 200) { data = JSON.parse(xhr.responseText); successHandler && successHandler(data); } else { errorHandler && errorHandler(xhr.status); } } }; xhr.send(); }; getJSON('https://mathiasbynens.be/demo/ip', function(data) { alert('Your public IP address is: ' + data.ip); }); }());"
