title = "How to enable Safari Reader on your site? · Mathias Bynens"
full_description = '''How to enable Safari Reader on your site? Published 10th June 2010 · tagged with HTML, iOS, macOS Yesterday, Mike Taylor raised a very interesting question on Twitter: Anybody know what Safari 5 requires for a page to be Reader-ifiable? I noticed Reader was already working on this site for most blog posts. For example, the article about the three levels of HTML5 usage triggers the Reader badge in Safari’s address bar. I concluded the use of the <article> element to wrap the actual content must be one of the things that trigger it. Further investigation However, there’s more to it than just using the right markup. For example, Reader doesn’t work on this page containing my notes on document.head, even though the markup is similar to that of any other article on this site. It seems as if the length of the content is important as well. But how does Safari measure content length? Does the number of children of the wrapper element matter? How about the number of characters inside? Rob Flaherty decided to investigate this further and created some test documents. He made some interesting observations: You need a wrapper element around the actual content, other than <body>. It doesn’t really matter which element you choose, as long as it’s not <p>. Reader requires at least five child elements inside the wrapper. Using double line breaks (<br><br>) inside an element makes it count as two elements. Reader doesn’t seem to work for local files. All valid points, except “Reader requires at least five child elements inside the wrapper”, which doesn’t seem to be true. The number of child elements doesn’t matter, the content length seems to be measured another way. I’ll get to that later. Clayton Ferris did some additional testing, and concluded the following: It looks like that Safari Reader will detect a <div> or block level element that contains a header element (<h1> to <h6>), followed by a certain amount of text. The reader badge will appear when the content text (not including the header) is more than 2,000 characters. Sadly, none of Clayton’s statements seem to be true. I created some quick test cases to demonstrate it’s just not that simple: Test 1: 3 paragraphs, 1,863 characters (including heading and line breaks); Reader fails. Test 2: same as test 1, but with <p>.</p> added — 4 paragraphs, 1,866 characters; Reader works. Test 3: test without any heading elements — 6 paragraphs, 3,718 characters; Reader works. This also proves that there is no fixed amount of paragraphs (or other elements) needed to enable Reader; it all depends on the contents. Reader and the Readability bookmarklet Apple attributes Arc90’s Readability experiment in the Safari Acknowledgements (Safari › Help › Acknowledgements or file:///Applications/Safari.app/Contents/Resources/Acknowledgments.html on Mac). This bookmarklet seems to be what Reader is based on, so it’s probably a good idea to dive in the source code. For example, every paragraph containing double line breaks (<br>) counts as two paragraphs — this confirms what Rob concluded after his tests. Direct child text nodes and <div>s that don’t have block-level child elements count as paragraphs as well. It turns out Readability then loops through all these ‘paragraphs’ and assigns a score to them based on how ‘content-y’ they look. This score is determined by things like the number of commas, class names used in the markup, etc. The content’s length appears to be measured by using .innerText; for every 100 characters inside a paragraph, that paragraph’s score goes up. Eventually, the number of elements is counted, adding their individual scores. I think it’s safe to assume Safari Reader is triggered based on this algorithm. Conclusion This definitely needs more investigating, but so far, these appear to be the most important factors for Safari’s Reader functionality to kick in: Use the right markup, i.e. make sure the most important content is wrapped inside a container element. Whether you use <article>, <div> or even <span> doesn’t seem to matter — as long as it’s not <p>. The content needs to be long enough. Use enough words, use enough paragraphs, use enough punctuation. Every paragraph should have at least 100 characters. Reader doesn’t work for local documents. About me Hi there! I’m Mathias. I work on Chrome at Google. HTML, CSS, JavaScript, Unicode, performance, and security get me excited. Follow me on Twitter, Bluesky, and GitHub. Comments Niels Matthijs wrote on 10th June 2010 at 14:08: One thing you seem to have missed is that the reader fails when it has multiple possible reader sections on one page. The reader works on my blog, unless the article has a somewhat populated comment section. At that time there are two areas competing for the reader’s attention, and It appears to drop the functionality completely in such a case. Still, interesting stuff, comes very close to what I’d figured out myself (minus the math and points system that is :)). Mathias wrote on 10th June 2010 at 14:32: Niels: If there are multiple possible content sections on the page, the Reader will always target the one with the highest ‘score’. Safari Reader indeed doesn’t seem to be working for the latest article on your blog. However, the fact that there are multiple possible content sections has nothing to do with this. I quickly made a test case based on your article without the comments section, and as you can see, Reader still doesn’t work. Niels Matthijs wrote on 10th June 2010 at 14:44: It seems to dislike all my “work” posts btw. Which is strange, because there are plenty of them that feature more content, more paragraphs, more data. One thing that’s different between the two is that I use extra wrappers for underlying sections (an extra wrapper div for each section starting with an h2 for example). My personal blog posts almost never feature subsections. My guess: it does not count all paragraphs nested within a certain div, only the paragraphs on the same level? Would suck though. Rob Flaherty wrote on 10th June 2010 at 16:04: Great post! Brilliant idea checking out the Acknowledgements and the Readability bookmarklet. It’s interesting that the Readability bookmarklet works on all of the test pages that fail. Actually it works on just about any page. I’m a little surprised the test case based on Niels’ article fails. Too many nested divs trips up the algorithm? George Terezakis wrote on 10th June 2010 at 20:37: Another interesting thing to look into would be the way Reader deduces multi-page articles such as this one. I reckon that it’s looking for a series of 2 or more consecutive links to pages that use the same base URL as the current one, with a increasing numeral as an argument. Marc wrote on 10th June 2010 at 23:55: Niels: I’d noticed the same thing; a design I'm working on has rather long articles (each wrapped in an <article>) broken down into sections, each of which is wrapped in a <section> and <div> tag, then headed within that with an <h2> (the <article> and <section> tags are purely future-looking semantic structure, for the heck of it; they serve no useful purpose). With this layout, depending on the content of the largest of the <div> sections Reader may or may not even appear, and on those it does it only shows the content of the largest <div>. For example on a page where the largest chunk contains about 8,600 characters and 22 <p> elements, no Reader is offered at all. On a nearly identical one with a main section of 5,800 characters and 13 <p> elements, Reader is offered, but only displays that, ignoring the other 3,000 characters of main content on the page. It would have been nice had the feature assumed <article> to be meaningful, and filtered down to, say, all the subheadings and paragraphs within it that look ‘content-y’. Maybe in a future version. Gino Marckx wrote on 11th June 2010 at 19:59: Check this out: http://www.nytimes.com/2010/06/11/education/11cheat.html Safari reader even detects multiple pages. Please keep digging, I'm very interested in how to update my sites. Scot Hacker wrote on 14th June 2010 at 18:36: Same question as George. I run a site with multi-page tutorials. Reader does kick in for the tutorial pages, but does not detect that they’re multi-page (it only renders one page at a time in Reader). What’s the secret to Reader detecting that a “next page” link really does go to the next page of the current article? Jorix wrote on 15th June 2010 at 00:44: Good post! Could be relevant in the future. David Smith wrote on 16th June 2010 at 01:57: Very useful article - thanks. Joachim Van Hove wrote on 17th June 2010 at 22:41: Nice post. Looking forward to some more digging. Thomas Viktil wrote on 27th August 2010 at 23:02: I just discovered that the Reader is enabled when I’m logged in to WordPress’ wp-admin. I just wrote a couple of notes on a future article, saved it as a draft and voila! The Reader button appears. I clicked it and the only thing it displayed was ‘Edit’ (since I was editing a post). Ondrej wrote on 18th October 2010 at 09:07: I just tested Reader function in our CMS and found out that you just need one big text: one paragraph with length longer than 600 characters. Two paragraphs with length 300+300 don’t work. bo wrote on 4th April 2011 at 19:41: I can’t make heads or tails… On one of my pages it selects a particular div, if I add content to the div or recreate it in another location, it still selects the original. How can I create a div that will absolutely be the one selected? Also, it looks as if the content is being cached. If I make changes to the immediately ‘readable’ are, they do not get updated in the reader. Even if I add all the right elements to increase the ‘score’. bob wrote on 26th April 2011 at 16:29: How much do I hate Reader? Plenty. The free web needs ads to pay for some of the work. This knocks out an important column supporting their work. Wow. One more reason almost everything good will end up behind a paywall. burki wrote on 16th September 2011 at 20:47: Does anyone know a WordPress theme that does NOT allow Safari reader mode? Simply: I hate it. iTux wrote on 2nd October 2011 at 06:26: http://itux.idev.pro/test-safari-reader — using only: <h1> and <p> :) Anonymous wrote on 30th October 2011 at 21:22: The Reader function is very unstable in iOS 5 on iPhone. It shows up or doesn’t show up on exactly the same site, so it is inconsistent. Peter Blair wrote on 14th December 2011 at 13:05: We have produced a website containing my experience of having a serious stroke and the various ways I have learned to “get round” all the things I can no longer do easily. Some of the pages work with Safari Reader and some don’t and we found out about Safari long after we did the website. Can anyone explain how to activate the Reader facility because I have learning difficulties as a result of the stroke, and the Reader facility is a godsend and may help others with reading difficulties. Marco Marasco wrote on 22nd February 2012 at 17:12: Hi, any news about how to disable Safari Reader? Test 1 is still working on my iPhone. Mathias wrote on 22nd February 2012 at 17:27: Marco: It’s not possible to disable Safari Reader. Dimitar Panov wrote on 4th March 2012 at 16:11: bob: I think if the site has a well optimized mobile version, that has good readability, the visitors won't feel a need to use the Safari Reader functionality. I use it almost only on sites without mobile version, or on mobile sites with very small font size. Dan wrote on 22nd March 2012 at 16:13: I struggled with this for some time, but I finally took the <ul> tags out of my story, and it worked. The first page it worked on is at http://www.danmanning.com/washington. I tried it again on another page, testing it first with the <ul> markings in (Reader didn’t work) and then took the <ul> tags out and reloaded the page. It worked. sam wrote on 26th May 2012 at 19:16: Thank you so much for the info. I had issues making it work on my site and now, it is fixed. Thanks again. treas0n wrote on 14th June 2012 at 04:16: I thought this was interesting… This triggers Reader on iOS 5: http://pastebin.com/raw.php?i=4jSrGiGw And this doesn’t trigger Reader on iOS 5: http://pastebin.com/raw.php?i=VtYJ3Ap3 Looks to me like content length is irrelevant with the <article> tag, and the cutoff is 350px tall. hrp wrote on 20th September 2012 at 19:43: Also the page must be served by a web server (no file://). robert wrote on 29th October 2012 at 15:35: Microsoft is demonized for adding freestyle “features” like this one. But I think this is even worse, because hundred people are not yet able to explain how it works. This is not a cool feature. HTML has invented <link rel="…" href="..."> to explicitly define alternate views, and it works in a predictable way, you don’t need to count your commas or pray to your saints. vic wrote on 20th January 2013 at 02:00: A belated comment on this, but just recently upgraded my iPad to iOS 5, and discovereded Reader. My site’s (WP iFeature theme) pages and posts all seem to trigger it… And some paragraphs contain fewer than 100 characters, so that criterium doesn’t seem to apply. COLDFIRE wrote on 19th March 2013 at 09:50: Update: Safari Reader now works for Test 1 too. eric wrote on 28th August 2013 at 14:47: The source code also must be stored in UTF-8 to be recognized. Not only <meta http-equiv="Content-Type" content="text/html; charset=utf-8">! mike bayer wrote on 9th September 2013 at 20:19: I’m getting the impression based on my blog that reader also fails if your post has code sections using <pre> tags, or perhaps very wide code sections that employ in-place horizontal scrolling. But I haven’t looked into it deeply. Lucas wrote on 8th November 2013 at 16:52: One note I would add. It does only work on http:// not on https:// secured connection. Mathias wrote on 8th November 2013 at 16:53: Lucas: I cannot reproduce that. Safari Reader seems to work fine on https://mega.co.nz/#blog_22, for example. Martijn wrote on 10th November 2013 at 20:12: None of the three tests trigger Reader on my Safari 7. The extra test case from comment 2 does trigger Reader this time around. Does anyone know if more recent research has been done? Shraftali wrote on 24th February 2014 at 18:10: I ran some tests using OS X Mavericks + Safari 7.0.1 and it looks like it can work on the localhost, and triggering the Reader button based on two things: 1. Content height if it is higher then the half of available browser height. 2. Content need to be in some wrapper tag, doesn’t matter what (tested to work with P, DIV, ARTICLE). Stijn De Lathouwer wrote on 17th June 2014 at 22:21: There seems to be a difference on iOS 7 between iPad and iPhone. Does anyone have any experience with this? Can’t seem to find a starting point on why this isn’t working. https://stackoverflow.com/q/23920850 JValenzuela wrote on 1st August 2014 at 10:15: And what about SafariContentReader? The SafariContentReade'''
