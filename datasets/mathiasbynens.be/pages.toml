title = "ES2015 const is not about immutability · Mathias Bynens"
full_description = '''ES2015 const is not about immutability Published 4th February 2016 · tagged with JavaScript This seems to be a very common misconception that just won’t die. I keep running into it in blog posts, Twitter discussions, and even books. Here’s my attempt at setting things straight. const creates an immutable binding ES2015 const does not indicate that a value is ‘constant’ or immutable. A const value can definitely change. The following is perfectly valid ES2015 code that does not throw an exception: const foo = {};foo.bar = 42;console.log(foo.bar);// → 42 The only thing that’s immutable here is the binding. const assigns a value ({}) to a variable name (foo), and guarantees that no rebinding will happen. Using an assignment operator or a unary or postfix -- or ++ operator on a const variable throws a TypeError exception: const foo = 27;// Any of the following uncommented lines throws an exception.// Assignment operators:foo = 42;foo *= 42;foo /= 42;foo %= 42;foo += 42;foo -= 42;foo <<= 0b101010;foo >>= 0b101010;foo >>>= 0b101010;foo &= 0b101010;foo ^= 0b101010;foo |= 0b101010;// Unary `--` and `++`:--foo;++foo;// Postfix `--` and `++`:foo--;foo++; ES2015 const has nothing to do with immutability of values. So, how to make a value immutable? Primitive values, i.e. numbers, strings, booleans, symbols, null, or undefined, are always immutable. var foo = 27;foo.bar = 42;console.log(foo.bar);// → `undefined` To make an object’s values immutable, use Object.freeze(). It has been around since ES5 and is widely available nowadays. const foo = Object.freeze({ 'bar': 27});foo.bar = 42; // throws a TypeError exception in strict mode; // silently fails in sloppy modeconsole.log(foo.bar);// → 27 Note that Object.freeze() is shallow: object values within a frozen object (i.e. nested objects) can still be mutated. The MDN entry on Object.freeze() provides an example deepFreeze() implementation that can be used to make object values fully immutable. Still, Object.freeze() only works on property-value pairs. There is currently no way to make other objects such as Dates, Maps, or Sets fully immutable. There is a proposal to add immutable data structures to a future version of ECMAScript. const vs. let The only difference between const and let is that const makes the contract that no rebinding will happen. Everything I wrote here so far are facts. What follows is entirely subjective, but bear with me. Given the above, const makes code easier to read: within its scope, a const variable always refers to the same object. With let there is no such guarantee. As a result, it makes sense to use let and const as follows in your ES2015 code: use const by default only use let if rebinding is needed (var shouldn’t be used in ES2015) Do you agree? Why (not)? I’m especially interested in hearing from developers who prefer let over const (i.e. even for variables that are never rebound). If you’re using let without rebinding, why are you using let in the first place? Is it because of the “const is for constants” misunderstanding, or is there another reason? Let me know in the comments! About me Hi there! I’m Mathias. I work on Chrome at Google. HTML, CSS, JavaScript, Unicode, performance, and security get me excited. Follow me on Twitter, Bluesky, and GitHub. Comments Gijs wrote on 4th February 2016 at 14:00: I think it’s a matter of opinion whether this: let foo;if (something) { foo = 5;} else { foo = 10;} …is easier to read / “better” than: if (something) { var foo = 5;} else { foo = 10;} I certainly got used to the latter over the course of the pre-ES6 years, and don’t see the point in the extra line in the first example. But then that’s probably just me. :-) Mathias wrote on 4th February 2016 at 14:11: Gijs: IMHO the former is much more readable, but in such a situation I tend to use the ternary operator, which avoids the issue altogether: const foo = something ? 5 : 10; Anyway, I’m more interested in how people use let vs. const. A lot of developers seem to use let by default for some reason, and I wonder if the whole “const is for constants!” misunderstanding is to blame. Gijs wrote on 4th February 2016 at 14:29: Mathias: Right, I mean, clearly the example is overly simplistic — once ternaries start going over 2-3 lines the if…else version is easier to follow. The point being that IMO the var hoisting means there is still space for var over let in certain situations. Using let for globals is also problematic because of the global lexical scope (see also https://esdiscuss.org/topic/global-lexical-tier), so that’s another reason to use var in some circumstances. Mathias wrote on 4th February 2016 at 14:51: Gijs: I strongly prefer declaring the variable outside of the if block — it’s much more readable that way, IMHO. But hey, to each their own. :) The global let problem is interesting, but it shouldn’t impact how developers write their code. Creating global variables has always been a bad practice, except when exporting a library — and with ES6 modules and <script type=module> (and a transpiler until all browsers support it), that problem’s solved. MaxArt wrote on 4th February 2016 at 17:17: Keep in mind that Object.freeze does not “deep-freeze” an object, i.e. object values of a frozen object won’t be frozen as well. Mathias wrote on 4th February 2016 at 17:25: MaxArt: Good point! It’s explained on the MDN page I linked to, but you’re right — I should’ve mentioned this in the write-up explicitly. Fixed. redoPop wrote on 4th February 2016 at 21:41: Kyle Simpson did a great job making the case against using const by default then switching to let if needed: The mindset I have to be in to realize that a const should no longer be a const, and to then responsibly analyze the potential risk areas I am introducing by changing const back to let / var — and quite possibly needing to refactor the surrounding code more heavily to reduce those risks! — is way more than just a casual and quick, "replace const with let". (Context, and his complete post, is here.) So far I agree with his recommendation to use const only for variables you're planning to treat as non-reassignable. Patrick Mueller wrote on 4th February 2016 at 22:18: From your second example: This code does not actually throw an exception: const foo = 27;// Any of the following uncommented lines throws an exception.// Assignment operators:foo = 42; …but this will: 'use strict'; // <<<<<<<<<<<<<<---------------------!!!!!!!!!!!!!!!!const foo = 27;// Any of the following uncommented lines throws an exception.// Assignment operators:foo = 42; I’ve seen some folks confused by this… including myself. I’ve finally switched over to the 'use strict' life-style. Mathias wrote on 4th February 2016 at 22:30: Patrick: That code should throw an exception, even in sloppy mode, as per the spec. Perhaps you are thinking of the legacy (non-standard) const behavior that used to be in Firefox and is still in stable Chromium at the moment? D wrote on 4th February 2016 at 22:37: To reproduce it in the Chrome Dev console: bar = function() { 'use strict'; const foo = 1; foo = 2; }()Uncaught TypeError: Assignment to constant variable.(…) Moritz wrote on 4th February 2016 at 23:12: I totally agree with the const and let usage, but don’t understand why we shouldn’t use var anymore? Why is const and var not a thing? I was under the impression that let behaves the same as var, but is block-scoped and not function-scoped. Mathias wrote on 4th February 2016 at 23:21: Moritz: Why would you still use var (and the annoying hoisting behavior that comes with it)? There’s nothing about var that const/let can’t do better. If you need function scoping, create the const/let at the top of the function. dino wrote on 4th February 2016 at 23:27: Moritz: The only feature var has is hoisting and it’s a feature most people didn’t want to use before. It’s confusing and all linters report it. In the middle of const and let, a var might become something obviously used for hoisting. But it’s too early. Moritz wrote on 4th February 2016 at 23:30: Mathias: I can’t think of a reason to use var instead of let either. I guess it just feels weird to abandon it entirely. I might also feel sorry for it, haha :D But there is also no downside in using var though (if function scoping isn’t seen as a downside)? Does code with mixed var/let look messy? Michael J. Ryan wrote on 5th February 2016 at 01:21: Personally, I still use var a lot out of habit, I understand how it works, and how the declaration and scoping works… That said, I still think there is value in var, as a global/leaky variable, such as variables where the binding will change that are scoped at the module level, even if they are exposed via say… var foo;export setFoo = (newfoo) => foo = newfoo;export getFoo = () => foo; In this case it’s intentionally variant, leaky and loosely bound scope. I tend to mostly use let when I intentionally want a closed scope, var the rest of the time, and even then, most of the time I want to use scoping, I get that through Array.prototype.forEach/map/reduce anyway. Mathias wrote on 5th February 2016 at 01:45: Michael: It’s still unclear why you would use var in that example — you could just use let. Block-scoping does not prevent the variable from being used in an inner scope! Ruslan wrote on 5th February 2016 at 07:36: To me, current const state is like we had with CSS IDs 10 years ago. There were lots of “CSS classes or IDs” articles, but at the end everybody started to use IDs only for JS binding or writing tests. The same is now happening with const — it’s just easier to use let everywhere and not think about whether the variable can be rebound or not. I’ve been also coding in Ruby, Python and PHP, and none of those languages has such mixed variable declaration as some people want to do in ES6. So I use const only for constants + they are always in UPPER_CASE_FORMAT. Mathias wrote on 5th February 2016 at 08:09: Ruslan: const is not (just) for constants, though, as this article explains. Andrea wrote on 5th February 2016 at 09:16: I’m a victim of the “const is for constants” misunderstanding. I’ve recently started using ES6 and even more recently realized how const really works… It’s confusing at first. Balint Erdi wrote on 5th February 2016 at 10:25: I’ve also followed this “school of thought” but Matt Beale’s recent post made me think a lot about this. I encourage you to give it a read. His points related to this post are made in the “Constantly const” section. Cheers! dSebastien wrote on 5th February 2016 at 10:57: Nice article. As far as I’m concerned, var clearly does not exist anymore :) Rob C wrote on 5th February 2016 at 13:23: My approach to ES6 thus far has been the same as per your recommendation: use const by default only use let if rebinding is needed. …and so far so good in strict mode! It appears to be the general recommendation out there: Nicholas Zakas summarises similarly here in Understanding ES6 Axel Rauschmayer also here in Exploring ES6 And yes, I’ve found that I no longer use var. Mathias wrote on 5th February 2016 at 13:53: Rob C: It seems Understanding ES6 is mistaken about what const does, though: The current best practice for block bindings is to use const by default and only use let when you know a variable’s value needs to change. This ensures a basic level of immutability in code that can help prevent certain types of errors. This reasoning is incorrect; const and let don’t have anything to do with whether the value of the variable changes. Joseph N. Musser II wrote on 5th February 2016 at 14:16: I’m surprised that people find this unintuitive. It would be unhelpful and unwieldy if const obj could somehow affect whether obj.value was const. This maps quite 1:1 to the readonly concept in C# and other languages. Andre Behrens wrote on 5th February 2016 at 14:55: I would say if we don’t want to fool people into thinking const is for constants, then const was a poor syntactic choice. On our team, we treat it as a constant by convention, and everyone knows what that means. Kind of like _quasiPrivate variables. For us, const means “I intend this to be constant”. It would be nice for the language not to have features that require this much explanation. Jonathan Cutrell wrote on 5th February 2016 at 15:11: I think probably the most compelling use case for const is going to be magic numbers. const E = 2.7182818284; Though it is confusing. I think, ultimately, using const is going to be a mental trigger for future devs of that code — “hey, don’t re-assign this”. But that also requires that they know a particular thing is a const, which most people signify with caps. Perhaps you could use const for things like window as well, so that it can only be modified, not reassigned to null or something. This may help avoid some negative scenarios. Ville wrote on 5th February 2016 at 15:17: Seems several people in the comments don’t understand what const means even after reading the article. Shelley Powers wrote on 5th February 2016 at 15:55: The use of var within a function anywhere is perfectly fine. Yes, it is. Until the minds behind ECMAScript decide to jump into the shark tank and deprecate var, it is a functioning part of the language. The new let and const are additions to the language, not replacements. Not unless, again, they want to come out and say, “var is going away”. The use of var outside of a function in client-side (browser-based) JavaScript clutters the global namespace and should be discouraged… when we’re assured that applications using let will continue to work for the majority of browser users. If we want block-level scoping than of course use let or const. If the browser allows it. However, the use of var and let in Node has different effects. Point of fact, the use of let requires strict mode which can have other effects on the application. Some would say this is a good thing, but the effects could lead to unexpected results. No one has been able to definitively say that the use of let or const improves program performance, or even increases the reliability of the application. So saying “never use var” or “always use const” is an opinion, not a statement based on imperative testing, or even strong anecdotal observation. As for const in ES6, I would suggest it was not cleanly defined. David Walsh wrote on 5th February 2016 at 16:05: Shelley: Please have a read (or re-read) of JavaScript: The Good Parts. Just because you can use some feature of the language doesn’t mean you should. As to your other points: Of course TC39 is not going to break backwards compatibility by deprecating var. Of course you should not use ES6 features in ES5 environments like the browser. You should always be writing strict mode friendly code. The non-strict features are terrible and unnecessary. (Again see the aforementioned book.) It’s not a question of performance. let and const weren’t introduced for performance reasons. Their use isn’t advocat'''
