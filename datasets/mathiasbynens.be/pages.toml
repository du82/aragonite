["https://mathiasbynens.be/notes/javascript-unicode"]
title = "JavaScript has a Unicode problem · Mathias Bynens"
full_description = '''JavaScript has a Unicode problem Published 20th October 2013 · tagged with JavaScript, Unicode The way JavaScript handles Unicode is… surprising, to say the least. This write-up explains the pain points associated with Unicode in JavaScript, provides solutions for common problems, and explains how the ECMAScript 6 standard improves the situation. Unicode basics Before we take a closer look at JavaScript, let’s make sure we’re all on the same page when it comes to Unicode. It’s easiest to think of Unicode as a database that maps any symbol you can think of to a number called its code point, and to a unique name. That way, it’s easy to refer to specific symbols without actually using the symbol itself. Examples: A is U+0041 LATIN CAPITAL LETTER A. a is U+0061 LATIN SMALL LETTER A. © is U+00A9 COPYRIGHT SIGN. ☃ is U+2603 SNOWMAN. 💩 is U+1F4A9 PILE OF POO. Code points are usually formatted as hexadecimal numbers, zero-padded up to at least four digits, with a U+ prefix. The possible code point values range from U+0000 to U+10FFFF. That’s over 1.1 million possible symbols. To keep things organised, Unicode divides this range of code points into 17 planes that consist of about 65 thousand code points each. The first plane (U+0000 → U+FFFF) and is called the Basic Multilingual Plane or BMP, and it’s probably the most important one, as it contains all the most commonly used symbols. Most of the time you don’t need any code points outside of the BMP for text documents in English. Just like any other Unicode plane, it groups about 65 thousand symbols. That leaves us about 1 million other code points (U+010000 → U+10FFFF) that live outside the BMP. The planes these code points belong to are called supplementary planes, or astral planes. Astral code points are pretty easy to recognize: if you need more than 4 hexadecimal digits to represent the code point, it’s an astral code point. Now that we have a basic understanding of Unicode, let’s see how it applies to JavaScript strings. Escape sequences You may have seen things like this before: >> '\x41\x42\x43''ABC'>> '\x61\x62\x63''abc' These are called hexadecimal escape sequences. They consist of two hexadecimal digits that refer to the matching code point. For example, \x41 represents U+0041 LATIN CAPITAL LETTER A. These escape sequences can be used for code points in the range from U+0000 to U+00FF. Also common is the following type of escape: >> '\u0041\u0042\u0043''ABC'>> 'I \u2661 JavaScript!''I ♡ JavaScript!' These are called Unicode escape sequences. They consist of exactly 4 hexadecimal digits that represent a code point. For example, \u2661 represents U+2661 WHITE HEART SUIT. These escape sequences can be used for code points in the range from U+0000 to U+FFFF, i.e. the entire Basic Multilingual Plane. But what about all the other planes — the astral planes? We need more than 4 hexadecimal digits to represent their code points… So how can we escape them? In ECMAScript 6 this will be easy, since it introduces a new type of escape sequence: Unicode code point escapes. For example: >> '\u{41}\u{42}\u{43}''ABC'>> '\u{1F4A9}''💩' // U+1F4A9 PILE OF POO Between the braces you can use up to six hexadecimal digits, which is enough to represent all Unicode code points. So, by using this type of escape sequence, you can easily escape any Unicode symbol based on its code point. For backwards compatibility with ECMAScript 5 and older environments, the unfortunate solution is to use surrogate pairs: >> '\uD83D\uDCA9''💩' // U+1F4A9 PILE OF POO In that case, each escape represents the code point of a surrogate half. Two surrogate halves form a single astral symbol. Note that the surrogate code points don’t look anything like the original code point. There are formulas to calculate the surrogates based on a given astral code point, and the other way around — to calculate the original astral code point based on its surrogate pair. Using surrogate pairs, all astral code points (i.e. from U+010000 to U+10FFFF) can be represented… But the whole concept of using a single escape to represent BMP symbols, and two escapes for astral symbols, is confusing, and has lots of annoying consequences. Counting symbols in a JavaScript string Let’s say you want to count the number of symbols in a given string, for example. How would you go about it? My first thought would probably be to simply use the length property. >> 'A'.length // U+0041 LATIN CAPITAL LETTER A1>> 'A' == '\u0041'true>> 'B'.length // U+0042 LATIN CAPITAL LETTER B1>> 'B' == '\u0042'true In these examples, the length property of the string happens to reflect the number of characters. This makes sense: if we use escape sequences to represent the symbols, it’s obvious that we only need a single escape for each of these symbols. But this is not always the case! Here’s a slightly different example: >> '𝐀'.length // U+1D400 MATHEMATICAL BOLD CAPITAL A2>> '𝐀' == '\uD835\uDC00'true>> '𝐁'.length // U+1D401 MATHEMATICAL BOLD CAPITAL B2>> '𝐁' == '\uD835\uDC01'true>> '💩'.length // U+1F4A9 PILE OF POO2>> '💩' == '\uD83D\uDCA9'true Internally, JavaScript represents astral symbols as surrogate pairs, and it exposes the separate surrogate halves as separate “characters”. If you represent the symbols using nothing but ECMAScript 5-compatible escape sequences, you’ll see that two escapes are needed for each astral symbol. This is confusing, because humans generally think in terms of Unicode symbols or graphemes instead. Accounting for astral symbols Getting back to the question: how to accurately count the number of symbols in a JavaScript string? The trick is to account for surrogate pairs properly, and only count each pair as a single symbol. You could use something like this: var regexAstralSymbols = /[\uD800-\uDBFF][\uDC00-\uDFFF]/g;function countSymbols(string) { return string // Replace every surrogate pair with a BMP symbol. .replace(regexAstralSymbols, '_') // …and *then* get the length. .length;} Or, if you use Punycode.js (which ships with Node.js), make use of its utility methods to convert between JavaScript strings and Unicode code points. The punycode.ucs2.decode method takes a string and returns an array of Unicode code points; one item for each symbol. function countSymbols(string) { return punycode.ucs2.decode(string).length;} In ES6 you can do something similar with Array.from which uses the string’s iterator to split it into an array of strings that each contain a single symbol: function countSymbols(string) { return Array.from(string).length;} Or, using the spread operator ...: function countSymbols(string) { return [...string].length;} Using any of those implementations, we’re now able to count code points properly, which leads to more accurate results: >> countSymbols('A') // U+0041 LATIN CAPITAL LETTER A1>> countSymbols('𝐀') // U+1D400 MATHEMATICAL BOLD CAPITAL A1>> countSymbols('💩') // U+1F4A9 PILE OF POO1 Accounting for lookalikes But if we’re being really pedantic, counting the number of symbols in a string is even more complicated. Consider this example: >> 'mañana' == 'mañana'false JavaScript is telling us that these strings are different, but visually, there’s no way to tell! So what’s going on there? As my JavaScript escapes tool would tell you, the reason is the following: >> 'ma\xF1ana' == 'man\u0303ana'false>> 'ma\xF1ana'.length6>> 'man\u0303ana'.length7 The first string contains U+00F1 LATIN SMALL LETTER N WITH TILDE, while the second string uses two separate code points (U+006E LATIN SMALL LETTER N and U+0303 COMBINING TILDE) to create the same glyph. That explains why they’re not equal, and why they have a different length. However, if we want to count the number of symbols in these strings the same way a human being would, we’d expect the answer 6 for both strings, since that’s the number of visually distinguishable glyphs in each string. How can we make this happen? In ECMAScript 6, the solution is fairly simple: function countSymbolsPedantically(string) { // Unicode Normalization, NFC form, to account for lookalikes: var normalized = string.normalize('NFC'); // Account for astral symbols / surrogates, just like we did before: return punycode.ucs2.decode(normalized).length;} The normalize method on String.prototype performs Unicode normalization, which accounts for these differences. If there is a single code point that represents the same glyph as another code point followed by a combining mark, it will normalize it to the single code point form. >> countSymbolsPedantically('mañana') // U+00F16>> countSymbolsPedantically('mañana') // U+006E + U+03036 For backwards compatibility with ECMAScript 5 and older environments, a String.prototype.normalize polyfill can be used. Accounting for other combining marks This still isn’t perfect, though — code points with multiple combining marks applied to them always result in a single visual glyph, but may not have a normalized form, in which case normalization doesn’t help. For example: >> 'q\u0307\u0323'.normalize('NFC') // `q̣̇`'q\u0307\u0323'>> countSymbolsPedantically('q\u0307\u0323')3 // not 1>> countSymbolsPedantically('Z͑ͫ̓ͪ̂ͫ̽͏̴̙̤̞͉͚̯̞̠͍A̴̵̜̰͔ͫ͗͢L̠ͨͧͩ͘G̴̻͈͍͔̹̑͗̎̅͛́Ǫ̵̹̻̝̳͂̌̌͘!͖̬̰̙̗̿̋ͥͥ̂ͣ̐́́͜͞')74 // not 6 You could use a regular expression to remove any combining marks from the input string instead if a more accurate solution is needed. // Note: replace the following regular expression with its transpiled equivalent// to make it work in old environments. https://mths.be/bwmvar regexSymbolWithCombiningMarks = /(\P{Mark})(\p{Mark}+)/gu;function countSymbolsIgnoringCombiningMarks(string) { // Remove any combining marks, leaving only the symbols they belong to: var stripped = string.replace(regexSymbolWithCombiningMarks, function($0, symbol, combiningMarks) { return symbol; }); // Account for astral symbols / surrogates, just like we did before: return punycode.ucs2.decode(stripped).length;} This function removes any combining marks, leaving only the symbols they belong to. Any unmatched combining marks (at the start of the string) are left intact. This solution works even in ECMAScript 3 environments, and it provides the most accurate results yet: >> countSymbolsIgnoringCombiningMarks('q\u0307\u0323')1>> countSymbolsIgnoringCombiningMarks('Z͑ͫ̓ͪ̂ͫ̽͏̴̙̤̞͉͚̯̞̠͍A̴̵̜̰͔ͫ͗͢L̠ͨͧͩ͘G̴̻͈͍͔̹̑͗̎̅͛́Ǫ̵̹̻̝̳͂̌̌͘!͖̬̰̙̗̿̋ͥͥ̂ͣ̐́́͜͞')6 Accounting for other types of grapheme clusters The above algorithm is still an oversimplification — it fails for grapheme clusters such as நி (ந + ி), Hangul made of conjoining Jamo such as 깍 (ᄁ + ᅡ + ᆨ), emoji sequences such as 👨‍👩‍👧‍👦 (👨 + U+200D ZERO WIDTH JOINER + 👩 + U+200D ZERO WIDTH JOINER + 👧 + U+200D ZERO WIDTH JOINER + 👦), or other similar symbols. Unicode Standard Annex #29 on Unicode Text Segmentation describes an algorithm for determining grapheme cluster boundaries. For a completely accurate solution that works for all Unicode scripts, implement this algorithm in JavaScript, and then count each grapheme cluster as a single symbol. There is a proposal to add Intl.Segmenter, a text segmentation API, to ECMAScript. Reversing strings in JavaScript Here’s an example of a similar problem: reversing a string in JavaScript. How hard can it be, right? A common, very simple, solution to this problem is the following: // naive solutionfunction reverse(string) { return string.split('').reverse().join('');} It seems to work fine in a lot of cases: >> reverse('abc')'cba'>> reverse('mañana') // U+00F1'anañam' However, it completely messes up strings that contain combining marks or astral symbols. >> reverse('mañana') // U+006E + U+0303'anãnam' // note: the `~` is now applied to the `a` instead of the `n`>> reverse('💩') // U+1F4A9'��' // `'\uDCA9\uD83D'`, the surrogate pair for `💩` in the wrong order To reverse astral symbols correctly in ES6, the string iterator can be used in combination with Array.from: // slightly better solution that relies on ES6 StringIterator and `Array.from`function reverse(string) { return Array.from(string).reverse().join('');} That still doesn’t solve the issues involving combining marks, though. Luckily, a brilliant computer scientist named Missy Elliot came up with a bulletproof algorithm that accounts for these issues. It goes: I put my thang down, flip it, and reverse it. I put my thang down, flip it, and reverse it. And indeed: by swapping the position of any combining marks with the symbol they belong to, as well as reversing any surrogate pairs before further processing the string, the issues are avoided successfully. Thanks, Missy! // using Esrever (https://mths.be/esrever)>> esrever.reverse('mañana') // U+006E + U+0303'anañam'>> esrever.reverse('💩') // U+1F4A9'💩' // U+1F4A9 Issues with Unicode in string methods This behavior affects other string methods, too. Turning a code point into a symbol String.fromCharCode allows you to create a string based on a Unicode code point. But it only works correctly for code points in the BMP range (i.e. from U+0000 to U+FFFF). If you use it with an astral code point, you’ll get an unexpected result. >> String.fromCharCode(0x0041) // U+0041'A' // U+0041>> String.fromCharCode(0x1F4A9) // U+1F4A9'' // U+F4A9, not U+1F4A9 The only workaround is to calculate the code points for the surrogate halves yourself, and pass them as separate arguments. >> String.fromCharCode(0xD83D, 0xDCA9)'💩' // U+1F4A9 If you don’t want to go through the trouble of calculating the surrogate halves, you could resort to Punycode.js’s utility methods once again: >> punycode.ucs2.encode([ 0x1F4A9 ])'💩' // U+1F4A9 Luckily, ECMAScript 6 introduces String.fromCodePoint(codePoint) which does handle astral symbols correctly. It can be used for any Unicode code point, i.e. from U+000000 to U+10FFFF. >> String.fromCodePoint(0x1F4A9)'💩' // U+1F4A9 For backwards compatibility with ECMAScript 5 and older environments, use a String.fromCodePoint() polyfill. Getting a symbol out of a string If you use String.prototype.charAt(position) to retrieve the first symbol in the string containing the pile of poo character, you’ll only get the first surrogate half instead of the whole symbol. >> '💩'.charAt(0) // U+1F4A9'\uD83D' // U+D83D, i.e. the first surrogate half for U+1F4A9 There’s a proposal to introduce String.prototype.at(position) in ECMAScript 7. It would be like charAt except it deals with full symbols instead of surrogate halves whenever possible. >> '💩'.at(0) // U+1F4A9'💩' // U+1F4A9 For backwards compatibility with ECMAScript 5 and older environments, a String.prototype.at() polyfill/prollyfill is available. Getting a code point out of a string Similarly, if you use String.prototype.charCodeAt(position) to retrieve the code point of the first symbol in the string, you’ll get the code point of the first surrogate half instead of the code point of the pile of poo character. >> '💩'.charCodeAt(0)0xD83D Luckily, ECMAScript 6 introduces String.prototype.codePointAt(position), which is like charCodeAt except it deals with fu'''
