["https://mathiasbynens.be/notes/dropquest-2012"]
title = "How to speedrun Dropbox’s Dropquest 2012 · Mathias Bynens"
full_description = '''How to speedrun Dropbox’s Dropquest 2012 Published 14th May 2012 · tagged with Dropquest, JavaScript Are you a Dropbox user? By completing this year’s Dropquest, you can get 1 GB of extra Dropbox storage space, for free. Dropquest 2012 ends June 2. I had the feeling that the riddles were harder than last year. Also, the Dropbox team made it harder to share answers, by creating up to three variations of some riddles. As a result, even with the right answers, it takes much longer to complete this year’s Dropquest. (For comparison: Dropquest 2011 could easily be completed in just a few seconds.) Just like last year, Dropquest walkthroughs aren’t hard to find. However, those guides aren’t as efficient as I’d like them to be. While struggling to find the answer for chapter 4 — I like to believe I got to level 7 before the walkthroughs caught up with me — I found that you can advance to level 5 without knowing the correct answer, simply by changing the URL (replacing /chapter4 with /chapter5). This appears to be the only chapter that can effectively be skipped — I guess the Dropbox team forgot to add a check for this. Later in the quest, there’s a puzzle that combines a sudoku with a slider puzzle. These things can take quite some time, even if you know the correct solutions. It turns out that under the hood, similar code as last year’s was used: there’s some JavaScript that redirects you to a new page as soon as you successfully solve the puzzle. The new URL is the same as the URL of the current step, only with a query string containing information on how you solved the test appended to it. if (is_done()) { location.href = "chapter14?moves=%s".format(moves.join(''));} The query string contains a list of numbers: one for every move you made to complete the test. This list is then processed server-side, to see if the moves form a truly valid solution. Only if this is the case, you’ll be redirected (again), this time to the next step in the quest. I simply set a breakpoint on the line starting with location.href, so that I could inspect the value of the moves array. This allowed me to get the full URL before continuing to the next page. That said, I’ve compiled this speed guide on how to complete Dropquest 2012 as fast as possible. How to complete Dropquest 2012 using the minimum number of steps required First, you’ll need a Dropbox account. If you don’t already have one, sign up through this referral link to start off with an extra 500 MB. You’ll need to log in to your account before you can participate in Dropquest. For one of the steps, your account needs to have a verified email address. Simply share a folder using the web interface to have Dropbox send the verification email if you haven’t done that already. After that, it’s simple. Just follow these steps in the correct order. If there’s a link, click it; if not, just do what it says. https://www.dropbox.com/dropquest2012/ https://www.dropbox.com/dropquest2012/prologue https://www.dropbox.com/dropquest2012/chapter1#repair Enter “38645” or “46637” or “64529” until you get the green “Password received” message. https://www.dropbox.com/dropquest2012/crane#repair Enter “smudges”. https://www.dropbox.com/dropquest2012/chapter5#repair Enter “madlib”. https://www.dropbox.com/events?ns=false&n=0&d=11-28-2001 https://www.dropbox.com/events?ns=false&n=0&d=3-21-2005 https://www.dropbox.com/events?ns=false&n=0&d=1-7-2003 https://www.dropbox.com/dropquest2012/aligned#repair https://www.dropbox.com/dropquest2012/leading#repair https://www.dropbox.com/dropquest2012/dealing#repair Of those last three URLs, find the one that didn’t return a 404 error. Enter “triumphant”. https://www.dropbox.com/referrals Invite boxer@dropbox.com or flash@dropbox.com or savior@dropbox.com (separately!) until you get redirected to the Chapter 10 page. Remember the email address you entered. Enter “mexico” or “argentina” or “korea”. Enter “southpole”. https://www.dropbox.com/home/Dropquest%202012/Captain's%20Logs Click Chapter 12.txt → More → Previous Versions → Restore. https://www.dropbox.com/help Click the shield icon (the icon, not the text right next to it). Clicking this link will solve the sudoku/slider puzzle for you. https://www.dropbox.com/home/Dropquest%202012 Create a new folder and share it with the same email as before (boxer@dropbox.com or flash@dropbox.com or savior@dropbox.com). https://www.dropbox.com/share Click the biggest rainbow icon on the page. Enter “shanghai”. https://www.dropbox.com/home/Dropquest%202012/Spring%20Cleaning ⌘ + Click {1,3,6,8,9}.jpg and move them to the Category 1 folder. Shift + Click the first and last of the other JPEGs to select the remaining files, and drag them all to the Category 2 folder. http://db.tt/72j933 http://db.tt/94j964 http://db.tt/q2j9j4 https://www.dropbox.com/dropquest2012/apollo13#repair Enter “abusively”. Enter “faced”, “based”, “badge”, “macau”, or “adage”. Enter “machu picchu”. Enter “colosseum”. https://www.dropbox.com/dropquest2012/finish Following these steps, you can easily complete Dropquest 2012 in two or three minutes. Enjoy! About me Hi there! I’m Mathias. I work on Chrome at Google. HTML, CSS, JavaScript, Unicode, performance, and security get me excited. Follow me on Twitter, Bluesky, and GitHub. Comments Benjamin Parry wrote on 14th May 2012 at 17:04: I feel like such a fraud. Thanks. ツ Matt Curtis wrote on 14th May 2012 at 17:06: This is fantastic. Thanks for putting this together. James wrote on 14th May 2012 at 17:49: Thanks! Francesco wrote on 14th May 2012 at 17:51: Awesome, thanks. Joel wrote on 14th May 2012 at 19:30: Step http://db.tt/72j933 after moving JPGs in “Spring Cleaning” does not work for me. Regards. Mathias wrote on 14th May 2012 at 19:33: Joel: Only one of those three short URLs will work. Which one that is for you, I can’t say — it’s randomized. But simply opening all three URLs ensures that the correct page has been loaded (as well as two other pages that 404, but that doesn’t matter). Dan wrote on 14th May 2012 at 19:40: https://www.dropbox.com/share Click the biggest rainbow icon on the page. Nothing happens when I click that button. I see two rainbow buttons: http://cl.ly/463l360L3b3j2f3K3843 Both didn’t work for me. Joel wrote on 14th May 2012 at 20:03: Mathias: Thanks for the answer, but none of the three links worked for me. :( Mathias wrote on 14th May 2012 at 20:46: Dan and Joel, retry the previous step, or try starting over. If you do it right, it does work. Joel wrote on 14th May 2012 at 20:56: Mathias: It worked. Awesome. Thank you very much. Dan wrote on 14th May 2012 at 20:56: Mathias: You were right, it seems I missed something. Everything worked now, thanks a lot. :) Danny wrote on 14th May 2012 at 20:57: Thanks Mathias! One can always use the extra space. Debsel wrote on 15th May 2012 at 00:43: What did I miss, I got only 850 MB :S step 9: 100 MB step 13: 125 MB step 16: 125 MB step 18: 150 MB step 20: 175 MB step 24: 200 MB Debsel wrote on 15th May 2012 at 00:43: Oops, never mind — I looked with eyes closed. XD I oversaw step 2 (50 MB) and step 7 (75 MB). Morgan Roderick wrote on 15th May 2012 at 16:54: Can someone share the Spring Cleaning folder, or does anyone know which step it gets created on? Mathias wrote on 15th May 2012 at 16:59: Morgan: The “Spring Cleaning” folder gets created as soon as you enter “shanghai” in the previous chapter. If something went wrong, try repairing your Dropquest folder and start over from there. David Levine wrote on 15th May 2012 at 17:12: This worked great. Thank you so much. I tried using something else yesterday and it was confusing at some parts. This made it really simple to just get 1 GB. Pietje Puk wrote on 16th May 2012 at 11:37: Great, thanks Mathias. I did the first puzzle, but on the second ran into inconsistencies in the assignment, so thought: what the hell, this ain't right, so why do it right? Jonas wrote on 16th May 2012 at 13:57: Thanks a lot! tony wrote on 16th May 2012 at 18:17: Thanks Mathias. Only prob was repairing the Dropquest folder during the Chapter 18 puzzle to create the Spring Cleaning folder. matthew wrote on 16th May 2012 at 20:04: Hmmm… All three of the short URLs 404 for me :( Thanks for this guide. Wish I could finish it. Edit: Figured this out. Don’t forget to allow popups from Dropbox :) Raimond wrote on 17th May 2012 at 15:12: I also have the problem that Dropbox says: the “Spring Cleaning” folder doesn’t exist. I also don’t know how to repair my Dropquest folder. I started over, but now I can not invite 1 of the 3 email adresses, because these are already in my list as referral. All the 3 adresses, so Dropbox says: someone already has invited these addresses. Raimond wrote on 17th May 2012 at 15:38: I started over, but now I can not invite 1 of the 3 emailadresses, because these are already in my list as referral. Al the 3 adresses, so dropbox says: someone already has invited thes adresses Mathias wrote on 17th May 2012 at 16:21: Raimond: To repair your Dropquest folder, go to e.g. chapter one and click the “Repair” link at the bottom of the page. Bob wrote on 17th May 2012 at 20:17: Looks like the step for the Spring Cleaning folder is no longer working. The short URLs are 404-ing and I do have pop-ups enabled. I’ve repaired my DQ folder twice now. Are they wise to this? Edit: Ok… I take it back. The only way I was able to get it to work is to move each file one by one (Spring Cleaning) in the web interface. When I moved the files on my Mac using my Dropbox folder it didn’t work. Only one of the three short URLs worked for me. All is well now… Complete! Mathias wrote on 17th May 2012 at 20:36: Bob: Yeah, you have to use the web interface to move the files, else it won’t work. I just retested everything for the 12th time using a new test Dropbox account (that I deleted afterwards) and I found that if you follow the steps correctly, everything works fine. Sorr wrote on 17th May 2012 at 21:17: Man you are awesome, thanks! Ian Reijnders wrote on 18th May 2012 at 20:07: Mathias: Till now it worked awsome but both of the three short URLs give a 404 error :( Mike wrote on 19th May 2012 at 00:06: Worked a charm, thanks. I thought I was doing well, albeit cheating, until I placed well north of 100,000th place. :( Tris wrote on 19th May 2012 at 01:22: FYI — for those getting all 404s, don’t use Internet Explorer. Worked perfectly in Chrome. JM wrote on 19th May 2012 at 05:27: Thanks! I would never have gotten this done by myself… Mathias wrote on 19th May 2012 at 11:29: Mike: Your ranking in the Dropquest Wall of Fame has nothing to do with the time it took you to complete it. The first person to finish Dropquest since it started is ranked first, the one after that second, etc. — regardless of how long it took them. Jo wrote on 19th May 2012 at 13:16: Can you complete on an iPad? I was going well until I hit the Help page, and I can’t see the shield anywhere. Mathias wrote on 19th May 2012 at 15:33: Jo: Sadly, mobile devices get served a special layout, where the icon is not available. You could try using Opera Mini instead, or just use a desktop browser. Hugo wrote on 20th May 2012 at 14:11: Hello Mathias! I’ve been following your guide carefully, but I’m stuck in the rainbow step. I’ve created a folder inside Dropquest 2012, shared it with the given emails, however when I click the rainbow picture and nothing happens! I don’t understand what’s wrong. Hope you can help. Thanks in advance. Mathias wrote on 21st May 2012 at 07:26: Hugo: In general, if something went wrong, try repairing your Dropquest folder and start over from a few chapters back. Did you share the folder with the given emails one by one or did you enter all the email addresses at once? Magne wrote on 21st May 2012 at 21:41: Thank you! This was awesome. And btw, repairing the folder worked for me Mathias. The repair button is at the bottom right screen on every chapter page. Go to one of those right before the rainbow picture step. Hugo wrote on 21st May 2012 at 22:10: I made it to the end! Thanks a lot, now I got a total of 24.85 GB of Dropbox free space! Anyone got more? Mathias wrote on 22nd May 2012 at 08:31: Hugo: How did you get the extra 850 MB? I “only” have 24 GB of free space. Wai wrote on 22nd May 2012 at 10:51: Done 5-6 puzzles, spent several hours. Enjoyed using your tips to earn the 1 GB extra storage. Costis wrote on 22nd May 2012 at 19:16: Mathias: I can't share the folder with the given emails. It states that they're already invited by others. I used the email function and invited them seperately. Stuck at the invite step. Already rebuilded the quest twice too. Costis wrote on 22nd May 2012 at 19:18: Raimond: did you manage to fix your problem with referrals ? Costis wrote on 22nd May 2012 at 19:35: Mathias: I've got 21.4GB, any ideas how to reach 24.85? I've invited the max amount of refers as well as completed the dropquest 1+2, and the twitter stuff. what's left ? Larry wrote on 23rd May 2012 at 19:26: worked great in Firefox, thanks. IE did not allow me to do it. Jennifer wrote on 23rd May 2012 at 21:04: Thanks, that was VERY helpful, and I got my 1GB. Sultec wrote on 24th May 2012 at 02:20: Thanks, worked easily. You must be a fine programmer/developer. Hugo wrote on 25th May 2012 at 00:00: Well, I've completed all referrals, I also participated in the "DCIM picture upload" beta, where I got 5GB, dropquest 2012, facebook, twitter and those basic ways to get more space provided in the official website.. I guess it was all. Rion wrote on 28th May 2012 at 15:00: thank you =D, it was really useful, I wanted to do it by my self but I don't have the time Josh wrote on 29th May 2012 at 03:50: Awesome! Thanks. 4g0st1n0 wrote on 29th May 2012 at 20:11: This worked great. Thank you so much. Fofer wrote on 3rd June 2012 at 04:54: Thanks for this, I am now happily up to a total of 26 GB of free Dropbox space. Rene wrote on 4th June 2012 at 07:59: Great! Thanks a lot — must have been hard work! mballisto wrote on 4th June 2012 at 20:46: Thanks, worked fantastically. beecher wrote on 7th June 2012 at 17:15: Thanks, it worked flawlessly ! Roberto B. wrote on 8th June 2012 at 11:25: Moving JPGs into the Category_ folders did absolutely nothing, until I switched browser (from Firefox to Chrome, in my case, but it could be just due to different configurations). I hope this could be useful to somebody else. Thanks for the help. Cam wrote on 9th June 2012 at 15:11: A double big THANKS! =D Leave a comment Comment on “How to speedrun Dropbox’s Dropquest 2012” Name * Email * Website Your input will be parsed as Markdown. Spammer? (Enter ‘no’) *'''
