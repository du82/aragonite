["https://mathiasbynens.be/notes/dropquest-2011"]
title = "Completing Dropbox’s Dropquest 2011 in 60 seconds · Mathias Bynens"
full_description = "Completing Dropbox’s Dropquest 2011 in 60 seconds Published 16th January 2011 · tagged with Dropquest, JavaScript Update: There’s now a speedrun guide for Dropquest 2012 as well. Enjoy! Dropbox organized a scavenger hunt named Dropquest the other day. The first 81 people to complete all steps won some nice prizes, but everyone participating in the quest can get 1 GB of extra Dropbox storage space. Dropquest ends January 29th 26th. I placed 826th with a recorded time of 02:20:01. That’s quite a while, but given the circumstances I’m pretty happy about my ‘score’. The timer starts as soon as you load the first step, and I could only really start doing the quest about 30 minutes after I did that. The entire Dropbox website (including the blog and the forums, which were needed for the quest to solve clues) was under heavy traffic at the time. I wasted a lot of time reloading pages over and over again, hoping not to end up with another error message. Also, I did take some breaks to investigate the HTML and JavaScript source code used in Dropquest. After I finished, it didn’t take very long until people started writing up Dropquest walkthroughs and guides explaining all the different steps in detail. However, those guides still require you to solve some of the puzzles manually. To complete step 6, you need to solve a click-and-drag puzzle, and step 10 is a 9×9 sudoku. These things can take quite some time, even if you know the correct solutions. As I mentioned, during the quest I was constantly viewing the HTML source to look for possible exploits. I noticed that for both step 6 and 10, the Dropbox team had written a piece of JavaScript that would redirect you to a new page as soon as you’d successfully solve the puzzle. The new URL was the same as the URL of the current step, only with a query string containing information on how you solved the test appended to it. For the click-and-drag puzzle in step 6, the query string contained a list of numbers: one for every move you made to complete the test. location.href = 'r?moves=%s'.format(moves.join('')); For step 10, the query string basically contains the solution to the sudoku. location.href = 'b?board=%s'.format(answer.join('')); These query strings are then processed server-side, to see if they are truly a valid solution. Only if this is the case, you’ll be redirected (again), this time to the next step in the quest. Once I figured this out, I quickly created a local copy of the HTML and JavaScript files for steps 6 and 10, and made it so that it wouldn’t redirect after successful completion, but instead log the URL it would otherwise redirect to. Easy enough. It seemed like a fun idea to create a list with only the minimum number of steps required to solve Dropquest 2011. How to complete Dropquest 2011 using the minimum number of steps required First, you’ll need a Dropbox account. If you don’t already have one, sign up through this referral link to start off with an extra 250 MB. You’ll need to log in to your account before you can participate in Dropquest. After that, it’s simple. Just follow these steps in the correct order. If there’s a link, click it; if not, just do what it says. https://www.dropbox.com/dropquest2011 https://www.dropbox.com/dropquest2011/D Clicking here will solve the puzzle in step 6 for you Enter “33739” Clicking here will solve the sudoku in step 10 for you https://www.dropbox.com/dropquest2011/x https://www.dropbox.com/dropquest2011/h Enter “baff1e” Enter “Drew Houston” Share a new folder named “1F75CC” with dropquest@dropbox.com https://www.dropbox.com/about https://www.dropbox.com/dropquest2011/R https://www.dropbox.com/dropquest2011/t Enter “badcabbage” Enter “1133471056” Enter “Dr0pbox heaRts U” Following these steps, it should be pretty easy to beat my score by a factor of 100. Enjoy! About me Hi there! I’m Mathias. I work on Chrome at Google. HTML, CSS, JavaScript, Unicode, performance, and security get me excited. Follow me on Twitter, Bluesky, and GitHub. Comments nilo wrote on 16th January 2011 at 19:48: Just what I needed. Thanks a lot! Max wrote on 16th January 2011 at 21:15: You are awesome. Thanks man! Barnaby Walters wrote on 16th January 2011 at 21:53: That’s great, and I love the free space but… I do feel bad to not have figured it out myself :( Glenda Carl wrote on 16th January 2011 at 22:40: Thanks for your help! You've probably enabled me to keep my job, because Dropquest was a great way for me to procrastinate this weekend. Cas wrote on 17th January 2011 at 10:34: Thanks for sharing Mathias! Appreciated! Lukesaysmoo wrote on 17th January 2011 at 19:50: Thanks Mathias! Alec wrote on 17th January 2011 at 20:53: Thanks man! But I have the urge to go over it again just to solve it myself.... redhotbeani wrote on 17th January 2011 at 22:02: Thank you for this great walkthrough. Jeremy wrote on 18th January 2011 at 00:55: Greatly appreciate you taking the time to post this guide up! Clarence wrote on 18th January 2011 at 01:43: Thanks for taking the time to write this up. You rock! Akent wrote on 18th January 2011 at 03:32: That damn sudoku puzzle. I gave up on it after a hour. Thanks for the support. Ubiquitous wrote on 18th January 2011 at 05:26: Your walk-through worked perfectly, and it inspired me to create an iMacro — so if you’re truly lazy, you can download it here: Dropquest 2011 iMacro. ~ I finished with a time of 27 seconds. portlandia wrote on 18th January 2011 at 05:46: Thanks for the walkthrough! Kookaburra wrote on 18th January 2011 at 13:49: Spot on, really helped! Good work fella. Yabayaba wrote on 18th January 2011 at 13:58: Thanks for tips, but using this method gets you 1GB. For more space, goto https://www.dropbox.com/gs and also https://www.dropbox.com/free. Douglas wrote on 18th January 2011 at 18:12: You ROCK and RULE! Douglas wrote on 18th January 2011 at 18:14: Lol i also had a sudoku solver i coded in C Mathias wrote on 18th January 2011 at 18:21: Douglas: There are online sudoku solvers as well. This one, for example: http://www.decabit.com/Sudoku/Solver.aspx cjn wrote on 18th January 2011 at 20:11: Thanks a million... er, more like a gigabyte! Toph wrote on 18th January 2011 at 21:09: Google goggles also solves sudoku puzzles! just take a picture of it. :) Mathias wrote on 18th January 2011 at 23:52: Toph: Just tried it. Can you get it to work with the Dropquest sudoku? I couldn’t. Seems like Google Goggles only recognizes numerical sudoku puzzles. Dennis wrote on 19th January 2011 at 00:42: pretty cool - thanks! Hector Garcia wrote on 19th January 2011 at 12:07: Thanks a lot! Frederik wrote on 19th January 2011 at 13:53: Thanks for the walkthrough! Hammy Havoc wrote on 19th January 2011 at 20:32: Cheers! Absolutely great for scoring a few colleagues some extra space. With much love, Hammy Josep wrote on 20th January 2011 at 00:25: Thanks a lot! very useful! Hansjuerg Wuethrich wrote on 20th January 2011 at 14:23: Yeahhhhhhhh thank you very much! You are my hero of the day!!! Aengus wrote on 21st January 2011 at 14:26: Thanks… The other walkthroughs around the place are not nearly as clear as this. Cheers! Yaron wrote on 22nd January 2011 at 02:33: Hilarious (and brilliant)! Thanks! Mieux wrote on 22nd January 2011 at 14:09: Thanks a lot. I did it in 00:04:45! Jani Bee wrote on 22nd January 2011 at 14:37: This is awesome for those of us who can’t afford to buy / upgrade to their paid package :) Other than earning max points by inviting others of course! Many thanks and hugs for passing these cool nopz super cool tips for us Grace wrote on 22nd January 2011 at 14:43: Hi, Thanks for making this accessible for us blind people. I am very glad that I can get my free extra space just like everyone else. Richard wrote on 24th January 2011 at 18:38: I was pretty slow, but finished nonetheless :-) You placed #129576 with a time of 00:13:18 Thanks a lot for this post! Comments have been closed for this entry."
