["https://mathworld.wolfram.com/about"]
title = "About MathWorld"
full_description = "TOPICS Algebra Applied Mathematics Calculus and Analysis Discrete Mathematics Foundations of Mathematics Geometry History and Terminology Number Theory Probability and Statistics Recreational Mathematics Topology Alphabetical Index New in MathWorld About MathWorld MathWorld is the web's most extensive mathematical resource, provided as a free service to the world's mathematics and internet communities as part of Wolfram Research's commitment to education and educational outreach. MathWorld has been assembled for more than 25 years by Eric W. Weisstein with assistance from thousands of contributors. Since its contents first appeared online in 1995, MathWorld has emerged as the destination of choice for mathematical information among both the mathematics and educational communities. Its entries are extensively referenced in online resources, journals and books spanning all educational levels, including those read by researchers, elementary school students and teachers, engineers and hobbyists. The technology behind MathWorld is heavily based on Wolfram Mathematica. In addition to being indispensable in the derivation, validation and visualization of MathWorld's content, Mathematica is also used to build the website itself, a feat possible thanks to its advanced mathematical typesetting and data-processing capabilities. In January 2022, an upgraded and redesigned MathWorld site was released. While the site's content and features remain unchanged, it now boasts a responsive design that provides mobile-friendly and fully scalable text, equations and figures to a new generation of on-the-go readers. On behalf of the MathWorld team and Wolfram Research, thanks for using MathWorld."
year_published = 2025
clearnet = "https://mathworld.wolfram.com/about"
