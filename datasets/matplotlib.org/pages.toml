full_description = '''Third-party and user-contributed packages# A list of packages that extend Matplotlib. These are maintained and distributed independently from Matplotlib so go to the website listed for instructions. Please contribute your package by opening a pull-request at matplotlib/mpl-third-party using the template in the readme If you need help making a package, see matplotlib/matplotlib-extension-cookiecutter where we give you a template to make it easy! You can find more packages at PyPI using the Framework :: Matplotlib trove classifier. Alternative APIs # HoloViews High-level API providing composable multidimensional or columnar data objects that visualize themselves. hvPlot Composable, interactive Pandas and Xarray .plot() objects. pandas Tabular data analysis and manipulation tool providing a .plot() API for Matplotlib plotting. plotnine A grammar of graphics for Python. Xarray Multi-dimensional data analysis and manipulation tool providing a .plot() API for Matplotlib plotting. Animations # animatplot Interactive animated plots. celluloid Matplotlib animations made easy. gif Ultra-lightweight animated GIF API. manimplotlib Collection of scripts to animate Matplotlib plots with manim. mpl-animators Create interactive animations of N-dimensional data, and of World Coordinate System (WCS) objects from Astropy. numpngw Write animated pngs. streamjoy Enjoy animating images into GIFs and MP4s in parallel. xmovie A simple way of creating beautiful movies from Xarray objects. Colormaps and styles # Aquarel Simplified wrapper for flexible styling and theming. CMasher Scientific colormaps for making accessible, informative and 'cmashing' plots. cmcrameri Fabio Crameri's perceptually uniform colormaps for geosciences. cmocean Perceptually uniform colormaps for oceanographic variables. cmweather Color vision deficiency friendly colormaps for weather/climate variables. cmyt Colormaps from the yt project. Colorcet Perceptually uniform continuous colormaps and perceptually distinct categorical color sets. distinctipy Qualitative colormaps of any length, generated to be maximally distinct. Farrow&Ball Matplotlib Color palettes inspired by British paint manufacturer Farrow and Ball. mpl-visual-context Collection of patheffects and more mplcyberpunk Cyberpunk / neon-glow look for plots. pypalettes Large (+2500) collection of colormaps. SciencePlots Matplotlib styles for scientific figures. tastymap colormaps cooked for your palate. TUEplots Light-weight Matplotlib styles for figures used in scientific publications. viscm Tool for analyzing colormaps and creating new colormaps. Development tools with built-in Matplotlib rendering # JupyterLab Web-based interactive development environment for notebooks, code, and data. marimo Open source reactive notebook that can be deployed as an app. Jupyter Notebook Web-based interactive development environment for notebooks, code, and data. pycharm Python IDE for data science and web development. spyder Open source, community-developed scientific environment and IDE written in Python, for Python. vscode Streamlined code editor with support for development operations like debugging, task running, and version control. Documentation # Sphinx-Gallery Create Matplotlib galleries for your sphinx-built documentation. Domain-specific libraries # ArviZ Exploratory analysis of Bayesian models with Python. Astropy Astronomy processing and graphics (including mapping). BG Heatmaps Brain heatmap visualizations. colorio Tools for working with colors and color spaces. cplot Plot complex-valued functions. datamapplot Plotting clustered and labelled data maps. DNA Features Viewer Visualize DNA features, e.g. from GenBank or Gff files, or Biopython SeqRecords. grplot Complete and attractive statistical graphs in one function. Hockey Rink A Python library for plotting hockey rinks with Matplotlib. HyperSpy Multidimensional data analysis, e.g. hyperspectral imaging. librosa Audio signal processing with waveform and spectrogram displays. marsilea Declarative creation of composable visualization. MetPy A Python toolkit for meteorological applications. microfilm 2D image plots and animations for multi-channel microscopy data. mir_eval Evaluation tools and display helpers for audio annotations. mplfinance Utilities for the visual analysis of financial data. mplhep Set of helpers for Matplotlib to more easily produce plots typically needed in high energy physics. mplsignal Utility functions for signal processing plots. mplsoccer Plot soccer/football pitches and charts. MyForestPlot A flexibly-customizable Python tool to create a forest plot. NetworkX Working with and plotting network graphs. planetMagFields Routines to easily access information about magnetic fields of planets in our solar system and visualize them in both 2D and 3D. Py-ART The Python ARM Radar toolkit, used to analyze and plot weather radar data. pyCircos A visualization tool for designing circos plots. pyGenomeViz A genome visualization python package for comparative genomics. pymatviz A toolkit for visualizations in materials informatics. PyPlutchik Python visualisation for Plutchik annotated corpora. pytransform3d Work with, plot, and animate rigid transformations in 3D. seaborn High-level interface for drawing attractive statistical graphics. seaborn-image High-level API for drawing informative and attractive images. sunpy Solar physics processing, plotting, and colormaps. TULIPS Visualization of the physics of stars. Yellowbrick Visual analysis and diagnostic tools to facilitate machine learning model selection. Experimental projects that may be merged upstream eventually # mpl-gui Prototype for a pyplot alternative. mpl-qtthread Prototype for an approximately thread-safe Qt backend. GUI applications # Glue Easily linking visualizations of scientific datasets across many files. Lumen Declarative YAML or GUI specification for apps/dashboards with Matplotlib and other plots. mpl-multitab Tabbed figure manager for Matplotlib using PyQt. Pylustrator Interactive editor to style Matplotlib plots. PyNanoLab PySide6 GUI for data analysis and visualisation with Matplotlib and Pandas. PySimpleGUI Create custom GUIs quickly & easily on top of Tkinter, Qt, wxPython or Remi. sview-gui PyQt5 GUI for data visualisation of CSV file or pandas DataFrames. Interactivity # kivy_matplotlib_widget Convert your matplotlib graph into full interactive graph. mpl-draggable-line A Draggable line widget for Matplotlib. mpl-image-labeller Easily apply classification labels to images. mpl-image-segmenter Manually segment images with Matplotlib. mpl-interactions Interactive widgets for responsive plots. mpl-point-clicker Record click locations on a figure. Supports multiple classes. mpl_widget_box GUI-neutral widgets for Matplotlib, with legend-like layout and more. mplcursors Interactive data selection cursors. mpldatacursor Interactive data selection cursors. mplinorm Interactive contrast adjustment for Matplotlib images. Panel Dashboards and web apps using Matplotlib and other figures. Quibbler Effortlessly make your Matplotlib graphics interactive. Mapping # cartopy Produce maps and other geospatial data analyses. EOmaps A library to create interactive maps of geographical datasets. GeoPandas Pandas extended to support geographical data and algorithms. geoplot High-level Python geospatial plotting library based on Cartopy. GeoViews High-level geographic plotting built on Cartopy and Matplotlib. mplsteronet Lower-hemisphere equal-area and equal-angle stereonets. prettymaps Minimal Python library to draw customized maps from OpenStreetMap data. ridge_map Library for making ridge plots of... ridges. Miscellaneous # matplotcheck A package designed to test Matplotlib plots. matplotx Useful styles and extensions for Matplotlib. Plot types # Blume Alternate table artist. dataclocklib Data clock charts using matplotlib. Datashader Server-side rendering of large datasets as Matplotlib figures. matplotlib-venn Plotting area-weighted two- and three-circle Venn diagrams. mpl-scatter-density 2D histograms for large collections of point data. mpl_chord_diagram Drawing chord diagrams with matplotlib. mpl-sankey Sankey "alluvial" diagrams, with a data-centric API. mpl_stereo See your data in 3D by making stereograms and anaglyphs. plottable Beautifully customized tables with Matplotlib. PyUpSet UpSet suite of visualization methods. S3Dlib 3D surface and line object classes. Windrose Create windrose plots. yt Package for analyzing and visualizing volumetric data. Plotting utilities # adjustText Draw many text artists so that they do not overlap. brokenaxes Plots with breaks in the axes. FigPager Save plots with single or multiple pages. Flexitext Draw text with multiple styles in Matplotlib. grid-strategy Create a grid of subplots based on the number of axes to be plotted. HighlightText Make effective annotations easier in Matplotlib. legendkit Legend made easy for matplotlib. matplotlib-label-lines Label line using matplotlib. matplotlib-scalebar Display a scale bar. matplotview A library for creating lightweight views of Matplotlib axes. mpl-probscale Real probability scales for Matplotlib. mpl-template Templating engine for consistent plots. MPL Table Create custom table using Matplotlib. patchworklib A subplot manager for intuitive layouts. ProPlot A lightweight Matplotlib wrapper for making beautiful, publication-quality graphics. skunk Insert SVG images into Matplotlib elements. Can be used to also compose Matplotlib plots by nesting them. svgpath2mpl Parse SVG paths into Matplotlib Path objects for plotting. tikzplotlib Save figures as TikZ/PGFplots. Rendering backends # gr Graphic kernel system backend. mplcairo Improved backend for cairo. wxmplot Tighter integration with wxPython.'''
