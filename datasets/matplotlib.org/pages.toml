full_description = '''matplotlib.figure# matplotlib.figure implements the following classes: FigureTop level Artist, which holds all plot elements. Many methods are implemented in FigureBase. SubFigureA logical figure inside a figure, usually added to a figure (or parent SubFigure) with Figure.add_subfigure or Figure.subfigures methods. Figures are typically created using pyplot methods figure, subplots, and subplot_mosaic. fig, ax = plt.subplots(figsize=(2, 2), facecolor='lightskyblue', layout='constrained') fig.suptitle('Figure') ax.set_title('Axes', loc='left', fontstyle='oblique', fontsize='medium') (Source code, 2x.png, png) Some situations call for directly instantiating a Figure class, usually inside an application of some sort (see Embedding Matplotlib in graphical user interfaces for a list of examples) . More information about Figures can be found at Introduction to Figures. Figure# Figure class# Figure The top level container for all the plot elements. Adding Axes and SubFigures# Figure.add_axes Add an Axes to the figure. Figure.add_subplot Add an Axes to the figure as part of a subplot arrangement. Figure.subplots Add a set of subplots to this figure. Figure.subplot_mosaic Build a layout of Axes based on ASCII art or nested lists. Figure.add_gridspec Low-level API for creating a GridSpec that has this figure as a parent. Figure.get_axes List of Axes in the Figure. Figure.axes List of Axes in the Figure. Figure.delaxes Remove the Axes ax from the figure; update the current Axes. Figure.subfigures Add a set of subfigures to this figure or subfigure. Figure.add_subfigure Add a SubFigure to the figure as part of a subplot arrangement. Saving# Figure.savefig Save the current figure as an image or vector graphic to a file. Annotating# Figure.colorbar Add a colorbar to a plot. Figure.legend Place a legend on the figure. Figure.text Add text to figure. Figure.suptitle Add a centered super title to the figure. Figure.get_suptitle Return the suptitle as string or an empty string if not set. Figure.supxlabel Add a centered super xlabel to the figure. Figure.get_supxlabel Return the supxlabel as string or an empty string if not set. Figure.supylabel Add a centered super ylabel to the figure. Figure.get_supylabel Return the supylabel as string or an empty string if not set. Figure.align_labels Align the xlabels and ylabels of subplots with the same subplots row or column (respectively) if label alignment is being done automatically (i.e. the label position is not manually set). Figure.align_xlabels Align the xlabels of subplots in the same subplot row if label alignment is being done automatically (i.e. the label position is not manually set). Figure.align_ylabels Align the ylabels of subplots in the same subplot column if label alignment is being done automatically (i.e. the label position is not manually set). Figure.align_titles Align the titles of subplots in the same subplot row if title alignment is being done automatically (i.e. the title position is not manually set). Figure.autofmt_xdate Date ticklabels often overlap, so it is useful to rotate them and right align them. Figure geometry# Figure.set_size_inches Set the figure size in inches. Figure.get_size_inches Return the current size of the figure in inches. Figure.set_figheight Set the height of the figure in inches. Figure.get_figheight Return the figure height in inches. Figure.set_figwidth Set the width of the figure in inches. Figure.get_figwidth Return the figure width in inches. Figure.dpi The resolution in dots per inch. Figure.set_dpi Set the resolution of the figure in dots-per-inch. Figure.get_dpi Return the resolution in dots per inch as a float. Subplot layout# Figure.subplots_adjust Adjust the subplot layout parameters. Figure.set_layout_engine Set the layout engine for this figure. Figure.get_layout_engine Discouraged or deprecated# Figure.tight_layout Adjust the padding between and around subplots. Figure.set_tight_layout [Deprecated] Set whether and how Figure.tight_layout is called when drawing. Figure.get_tight_layout Return whether Figure.tight_layout is called when drawing. Figure.set_constrained_layout [Deprecated] Set whether constrained_layout is used upon drawing. Figure.get_constrained_layout Return whether constrained layout is being used. Figure.set_constrained_layout_pads [Deprecated] Set padding for constrained_layout. Figure.get_constrained_layout_pads [Deprecated] Get padding for constrained_layout. Interactive# See also Event handling and picking Figure.ginput Blocking call to interact with a figure. Figure.add_axobserver Whenever the Axes state change, func(self) will be called. Figure.waitforbuttonpress Blocking call to interact with the figure. Figure.pick Process a pick event. Modifying appearance# Figure.set_frameon Set the figure's background patch visibility, i.e. whether the figure background will be drawn. Figure.get_frameon Return the figure's background patch visibility, i.e. whether the figure background will be drawn. Figure.set_linewidth Set the line width of the Figure rectangle. Figure.get_linewidth Get the line width of the Figure rectangle. Figure.set_facecolor Set the face color of the Figure rectangle. Figure.get_facecolor Get the face color of the Figure rectangle. Figure.set_edgecolor Set the edge color of the Figure rectangle. Figure.get_edgecolor Get the edge color of the Figure rectangle. Adding and getting Artists# Figure.add_artist Add an Artist to the figure. Figure.get_children Get a list of artists contained in the figure. Figure.figimage Add a non-resampled image to the figure. Getting and modifying state# See also Interactive figures Figure.clear Clear the figure. Figure.gca Get the current Axes. Figure.sca Set the current Axes to be a and return a. Figure.get_tightbbox Return a (tight) bounding box of the figure in inches. Figure.get_window_extent Get the artist's bounding box in display space. Figure.show If using a GUI backend with pyplot, display the figure window. Figure.set_canvas Set the canvas that contains the figure Figure.draw Draw the Artist (and its children) using the given renderer. Figure.draw_without_rendering Draw the figure with no output. Figure.draw_artist Draw Artist a only. SubFigure# Matplotlib has the concept of a SubFigure, which is a logical figure inside a parent Figure. It has many of the same methods as the parent. See Nested Axes layouts. (Source code, 2x.png, png) SubFigure class# SubFigure Logical figure that can be placed inside a figure. Adding Axes and SubFigures# SubFigure.add_axes Add an Axes to the figure. SubFigure.add_subplot Add an Axes to the figure as part of a subplot arrangement. SubFigure.subplots Add a set of subplots to this figure. SubFigure.subplot_mosaic Build a layout of Axes based on ASCII art or nested lists. SubFigure.add_gridspec Low-level API for creating a GridSpec that has this figure as a parent. SubFigure.delaxes Remove the Axes ax from the figure; update the current Axes. SubFigure.add_subfigure Add a SubFigure to the figure as part of a subplot arrangement. SubFigure.subfigures Add a set of subfigures to this figure or subfigure. Annotating# SubFigure.colorbar Add a colorbar to a plot. SubFigure.legend Place a legend on the figure. SubFigure.text Add text to figure. SubFigure.suptitle Add a centered super title to the figure. SubFigure.get_suptitle Return the suptitle as string or an empty string if not set. SubFigure.supxlabel Add a centered super xlabel to the figure. SubFigure.get_supxlabel Return the supxlabel as string or an empty string if not set. SubFigure.supylabel Add a centered super ylabel to the figure. SubFigure.get_supylabel Return the supylabel as string or an empty string if not set. SubFigure.align_labels Align the xlabels and ylabels of subplots with the same subplots row or column (respectively) if label alignment is being done automatically (i.e. the label position is not manually set). SubFigure.align_xlabels Align the xlabels of subplots in the same subplot row if label alignment is being done automatically (i.e. the label position is not manually set). SubFigure.align_ylabels Align the ylabels of subplots in the same subplot column if label alignment is being done automatically (i.e. the label position is not manually set). SubFigure.align_titles Align the titles of subplots in the same subplot row if title alignment is being done automatically (i.e. the title position is not manually set). Adding and getting Artists# SubFigure.add_artist Add an Artist to the figure. SubFigure.get_children Get a list of artists contained in the figure. Modifying appearance# SubFigure.set_frameon Set the figure's background patch visibility, i.e. whether the figure background will be drawn. SubFigure.get_frameon Return the figure's background patch visibility, i.e. whether the figure background will be drawn. SubFigure.set_linewidth Set the line width of the Figure rectangle. SubFigure.get_linewidth Get the line width of the Figure rectangle. SubFigure.set_facecolor Set the face color of the Figure rectangle. SubFigure.get_facecolor Get the face color of the Figure rectangle. SubFigure.set_edgecolor Set the edge color of the Figure rectangle. SubFigure.get_edgecolor Get the edge color of the Figure rectangle. Passthroughs# SubFigure.set_dpi Set the resolution of parent figure in dots-per-inch. SubFigure.get_dpi Return the resolution of the parent figure in dots-per-inch as a float. FigureBase parent class# class matplotlib.figure.FigureBase(**kwargs)[source]# Base class for Figure and SubFigure containing the methods that add artists to the figure or subfigure, create Axes, etc. add_artist(artist, clip=False)[source]# Add an Artist to the figure. Usually artists are added to Axes objects using Axes.add_artist; this method can be used in the rare cases where one needs to add artists directly to the figure instead. Parameters: artistArtistThe artist to add to the figure. If the added artist has no transform previously set, its transform will be set to figure.transSubfigure. clipbool, default: FalseWhether the added artist should be clipped by the figure patch. Returns: ArtistThe added artist. add_axes(*args, **kwargs)[source]# Add an Axes to the figure. Call signatures: add_axes(rect, projection=None, polar=False, **kwargs) add_axes(ax) Parameters: recttuple (left, bottom, width, height)The dimensions (left, bottom, width, height) of the new Axes. All quantities are in fractions of figure width and height. projection{None, 'aitoff', 'hammer', 'lambert', 'mollweide', 'polar', 'rectilinear', str}, optionalThe projection type of the Axes. str is the name of a custom projection, see projections. The default None results in a 'rectilinear' projection. polarbool, default: FalseIf True, equivalent to projection='polar'. axes_classsubclass type of Axes, optionalThe axes.Axes subclass that is instantiated. This parameter is incompatible with projection and polar. See axisartist for examples. sharex, shareyAxes, optionalShare the x or y axis with sharex and/or sharey. The axis will have the same limits, ticks, and scale as the axis of the shared Axes. labelstrA label for the returned Axes. Returns: Axes, or a subclass of AxesThe returned Axes class depends on the projection used. It is Axes if rectilinear projection is used and projections.polar.PolarAxes if polar projection is used. Other Parameters: **kwargsThis method also takes the keyword arguments for the returned Axes class. The keyword arguments for the rectilinear Axes class Axes can be found in the following table but there might also be other keyword arguments if another projection is used, see the actual Axes class. Property Description adjustable {'box', 'datalim'} agg_filter a filter function, which takes a (m, n, 3) float array and a dpi value, and returns a (m, n, 3) array and two offsets from the bottom left corner of the image alpha float or None anchor (float, float) or {'C', 'SW', 'S', 'SE', 'E', 'NE', ...} animated bool aspect {'auto', 'equal'} or float autoscale_on bool autoscalex_on unknown autoscaley_on unknown axes_locator Callable[[Axes, Renderer], Bbox] axisbelow bool or 'line' box_aspect float or None clip_box BboxBase or None clip_on bool clip_path Patch or (Path, Transform) or None facecolor or fc color figure Figure or SubFigure forward_navigation_events bool or "auto" frame_on bool gid str in_layout bool label object mouseover bool navigate bool navigate_mode unknown path_effects list of AbstractPathEffect picker None or bool or float or callable position [left, bottom, width, height] or Bbox prop_cycle Cycler rasterization_zorder float or None rasterized bool sketch_params (scale: float, length: float, randomness: float) snap bool or None subplotspec unknown title str transform Transform url str visible bool xbound (lower: float, upper: float) xlabel str xlim (left: float, right: float) xmargin float greater than -0.5 xscale unknown xticklabels unknown xticks unknown ybound (lower: float, upper: float) ylabel str ylim (bottom: float, top: float) ymargin float greater than -0.5 yscale unknown yticklabels unknown yticks unknown zorder float See also Figure.add_subplot pyplot.subplot pyplot.axes Figure.subplots pyplot.subplots Notes In rare circumstances, add_axes may be called with a single argument, an Axes instance already created in the present figure but not in the figure's list of Axes. Examples Some simple examples: rect = l, b, w, h fig = plt.figure() fig.add_axes(rect) fig.add_axes(rect, frameon=False, facecolor='g') fig.add_axes(rect, polar=True) ax = fig.add_axes(rect, projection='polar') fig.delaxes(ax) fig.add_axes(ax) add_gridspec(nrows=1, ncols=1, **kwargs)[source]# Low-level API for creating a GridSpec that has this figure as a parent. This is a low-level API, allowing you to create a gridspec and subsequently add subplots based on the gridspec. Most users do not need that freedom and should use the higher-level methods subplots or subplot_mosaic. Parameters: nrowsint, default: 1Number of rows in grid. ncolsint, default: 1Number of columns in grid. Returns: GridSpec Other Parameters: **kwargsKeyword arguments are passed to GridSpec. See also matplotlib.pyplot.subplots Examples Adding a subplot that spans two rows: fig = plt.figure() gs = fig.add_gridspec(2, 2) ax1 = fig.add_subplot(gs[0, 0]) ax2 = fig.add_subplot(gs[1, 0]) # spans two rows: ax3 = fig.add_subplot(gs[:, 1]) add_subfigure(subplotspec, **kwargs)[source]# Add a SubFigure to the figure as part of a subplot arrangement. Parameters: subplotspecgridspec.SubplotSpecDefines the region in a parent gridspec where the subfigure will be placed. Returns: SubFigure Other Parameters: **kwargsAre passed to the SubFigure object. See also Figure.subfigures add_subplot(*args, **kwargs)[source]# Add an Axes to the figure as part of a subplot arrangement. Call signatures: add_subplot(nrows, ncols, index, **kwargs) add_subplot(pos, **kwargs) add_subplot(ax) add_subplot() Parameters: *argsint, (int, int, index), or '''
