full_description = "Copywriting/Editing Copywriting I have close to a decade of experience writing content for various businesses, including legal firms, tourism companies, health websites, and more. Here is a selection of some of the writing I’ve done: Airlink Alaska: “The Northwest Passage and the Arctic Circle“ Alaska Chaga: “Chaga and Hair“ Alaska Arctic Tours: “What it’s Like Living in the Arctic Circle“ Chena Aurora View Lodge: “The Klondike Gold Rush and Alaska“ My rate for writing is currently $.06 per word, though my rates are negotiable and I offer discounts for bulk orders and repeat customers. To hire me, click here to email me. Use subject line “Writing.” Editing I have several years of experience as a copyeditor and book editor. In my capacity as editor-in-chief of Terror House Press, I am responsible for editing all of the company’s books and all submissions published at Terror House Magazine. Outside of Terror House, I’ve also served as an editor or assistant editor for various websites. My standard rate for editing is $.03 per word, though like with writing, my rates are negotiable. I also offer discounts for volume buyers and small publishers. To hire me, click here to email me. Use subject line “Editing.”"
