full_description = "Terms of Use General Disclaimer By accessing this website, you (the User) agree to the below Terms of Conditions and Use (“Terms”). The Terms apply to all web content appearing at MattForney.com. If you do not agree to the Terms of Use, you are an unauthorized user of the Site and must leave immediately. Unauthorized use of the Site is a felony under the Computer Fraud and Abuse Act, 18 U.S.C. 1030. Additionally, please read the site’s Privacy Policy, located here. MattForney.com and all information contained within should be read with a critical eye. No one that writes, has written for or is affiliated with this site is trained or licensed to give relationship, fitness, financial or any other form of advice. Nothing written here should be taken at face value. If you don’t like or agree with the content of this website, go away and don’t come back. The writer of this site and any of its affiliates are not responsible for any negative consequences in your life resulting from reading this site. Acting upon any information or advice presented on this site is done at your own risk. Simply put, if you hurt yourself or are easily offended, don’t bother trying to sue me because it’s your own damn fault. Image Disclaimer All pictures on MattForney.com are found via Google Images or Imgur.com, or are taken by the author of the post. If you are the owner of an image and would like it removed, fill out the contact form and specify the URL of the image in question. If you would like to use one of my photographs, ask me first. FTC Disclaimer Part of my income is derived from affiliate marketing. From time to time, I may promote certain books, products or services to you, the User. If you decide to purchase a product or service using one of the links I provide, I may receive monetary compensation in the form of a commission. The majority of commission payments are used to keep this site running. If I decide that a product or service is worth your money, I will often link to it with an affiliate URL so that I do receive commissions from any purchases. The author of this site is never paid to endorse products or write posts. Rest assured that if I promote a product or service on this website, I own it, use it, or otherwise believe in the quality or value of said product/service. E.U. Users MattForney.com is based in the U.S. and is not specifically targeted at users in the European Union. However, be aware that MattForney.com (and all other WordPress-based websites) utilize cookies. According to the site Cookie Law Info, WordPress uses cookies in the following ways: Logging into WordPress. As no outside entities log into this site, this does not apply to the general user. However, cookies are a necessary function as WordPress won’t work without them. Visitors who leave a comment on a blog post will also have a cookie set on their computer. This is not strictly necessary and is a user preference. I reserve the right to change this policy at any time. I encourage you to check this page occasionally for the most current information. If you have any questions, concerns or suggestions about my Terms of Use, please feel free to email me anytime."
