full_description = "Privacy Policy In addition to this Privacy Policy, please read the Terms of Use located here. MattForney.com Respects Your Privacy Any personal information you provide to us including and similar to your name, address, telephone number and e-mail address will not be released, sold or rented to any entities or individuals outside of MattForney.com. External Sites MattForney.com is not responsible for the content of any external websites linked to within our pages. You are advised to read the privacy policy of external sites before disclosing any personal information. Cookies A “cookie” is a small data text file that is placed in your browser and allows MattForney.com to recognize you each time you visit this site. Cookies themselves do not contain any personal information, and MattForney.com does not use cookies to collect personal information. Third-Party Transactions MattForney.com occasionally uses third-party financial services to process transactions. Any credit card or financial information you enter into a third-party form is sent directly to that third-party and is never stored on MattForney.com’s servers. Analytics MattForney.com utilizes Google Analytics to gather information about the site’s visitors. Google Analytics is a free service run by Google. Data collected by this service is used only for internal review and will not be sold or given to any entities or individuals outside of MattForney.com. Remember the Risks Whenever You Use the Internet While I do my very best to protect your personal information, I cannot guarantee the security of any information that you transmit to MattForney.com and you are solely responsible for maintaining the secrecy of any passwords or other account information. In addition, other websites or services that may be accessible through MattForney.com have separate data and privacy practices independent of myself, and therefore I disclaim any responsibility or liability for their policies or actions. Please contact those vendors and others directly if you have any questions about their privacy policies. Finally, I reserve the right to change this privacy policy at any time. I encourage you to check this page occasionally for the most current information. If you have any questions, concerns or suggestions about my privacy policy, please feel free to email me anytime."
