full_description = "Interview at LitReactor: “Requiem For Elizabeth V. Aldrich (October 9th, 1992—July 10th, 2022)” Hi! If you're new here, you may want to subscribe to my RSS feed, DLive channel, Telegram channel, Twitch channel, and YouTube channel, as well as follow me on Anchor. Thanks for visiting!Last month, writer Elizabeth Victoria Aldrich, author of the novel Ruthless Little Things, unexpectedly passed away. Lizzie was a contributor to Terror House Magazine and a close friend of mine, and her loss was a significant blow both due to her immense talent and her relentless positivity and promotion of other writers in our scene. I contributed a quote to Gabriel Hart’s LitReactor memorial piece about Lizzie; you can read the article here. Share this:PrintEmailFacebookRedditTumblrTwitterMoreLinkedInPinterestPocketTelegramWhatsAppLike this:Like Loading..."
