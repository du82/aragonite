a transformations on the key and output before printing it. the applied transformation is either reverse or xor base on a random number % 2. reverse and xor are both methods of ``nuts_and_bolts::StorageMethod``` for which we do not have the source. For reverse we assume it will just reverse the string (sorry :)) For xor we need to follow the breadcrumbs to nuts_and_bolts::StorageMethod<_>::xor -> nuts_and_bolts::StorageMethod<_>::xor_inner -> for_each void __thiscall <core::slice::iter::IterMut<T>_as_core::iter::traits::iterator::Iterator>::for_each (<core::slice::iter::IterMut<T>_as_core::iter::traits::iterator::Iterator> *this,IterMut<u8> self, Option<&mut_u8> param_3) { <core::slice::iter::IterMut<T>_as_core::iter::traits::iterator::Iterator> *local_40; Option<&mut_u8> local_38; {closure_env#0}<64> local_30 [8]; Option<&mut_u8> local_28; Option<&mut_u8> local_20; Option<&mut_u8> local_8; local_40 = this; local_38 = param_3; while (param_3 = next((<core::slice::iter::IterMut<T>_as_core::iter::traits::iterator::Iterator> *)&local_40, (IterMut<u8> *)param_3), param_3 != (Option<&mut_u8>)0x0) { local_28 = param_3; local_20 = param_3; local_8 = param_3; nuts_and_bolts::StorageMethod<_>::xor_inner::{{closure}}(local_30,(u8 *)param_3); } return; } and then nuts_and_bolts::StorageMethod<_>::xor_inner::{{closure}} void nuts_and_bolts::StorageMethod<_>::xor_inner::{{closure}}({closure_env#0}<64> *param_1,u8 *v) { *v = *v ^ 0xd; return; } from there i took another shortcut: the first half of the output (0, 1, 2) is potentially a hint on the transformations to apply but: rev(rev(str)) == str xor(xor(str, 0xd), 0xd) == str so maybe i can just try to bruteforce it, there’s only 16 possibilites: from Crypto.Cipher import AES from pwn import xor # from output.txt key = bytearray([101, 19, 249, 222, 49, 245, 116, 246, 138, 161, 222, 65, 116, 18, 61, 227, \ 218, 154, 107, 172, 132, 119, 92, 126, 137, 33, 97, 243, 195, 200, 118, 12]) msg = bytearray([196, 182, 72, 102, 37, 214, 250