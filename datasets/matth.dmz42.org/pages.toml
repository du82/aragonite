title = "Flare-On 11 - #9 serpentine"
description = """
“serpentine” was the 9th and penultimate challenge from Google/FLARE’s Flare-On 2024 - and arguably the hardest challenge of these past couple of years (at least in my opinion).
Some information may be presented in a simplistic or incomplete way, as I tried to stay focused on the main points for this challenge. However, it’s very possible I got something slightly wrong or made a mistake, so feel free to point it out."""
full_description = '''Nov 9, 2024 Flare-On 11 - #9 serpentine “serpentine” was the 9th and penultimate challenge from Google/FLARE’s Flare-On 2024 - and arguably the hardest challenge of these past couple of years (at least in my opinion). Some information may be presented in a simplistic or incomplete way, as I tried to stay focused on the main points for this challenge. However, it’s very possible I got something slightly wrong or made a mistake, so feel free to point it out. NOTE: The whole thing needs unicorn 2.0.1 (i have some instruction caching issue with 2.1+) and Triton needs python 3.11 at the time of writing. If you want to quickly get started and follow along, install anaconda, download the requirements.txt from my repository and run the following commands: conda create -n "fl311" python=3.11.10 conda activate fl311 pip install -r requirements.txt 1. Untangling The Spaghetti 1.1 Quick Peek The program expects a 32 bytes key as parameter, it is copied at address 0x14089b8e8 (that i labelled INPUT_KEY), execution is then transfered to some code region. Providing the wrong key prints the message "Wrong Key", we can follow string references up to that function, next to which we find the show_flag function: The EXEC_CODE pointer is initialized within the first TLS callback: We now know its source (0x140097af0) and size (0x800000) - and it welcomes us with a nice HLT instruction… Debugging confirms that code execution is correctly transfered to the allocated buffer and that the HLT instruction triggers an exception, as expected, meaning that we’ll probably have to deal with some kind of exception based obfuscation. 1.2 Exception Handling The main function does a call to SetUnhandledExceptionFilter, sadly for us, the referenced handler doesn’t do much: void mw::Unhandled_Exception_Filter(void) { std::puts("Unexpected exception occurred."); exit(1); return; } We’ll find some luck in __scrt_common_main_seh() calling _initterm(), which will loop around a list of function pointers and call them before main(). The last 2 functions are the interesting ones: The first one will initialize a global pointer to RtlInstallFunctionTableCallback (easier done through debugging than by following the code… :): if ((((*exportName == 'R') && (exportName[3] == 'I')) && (exportName[10] == 'F')) && ((exportName[0x12] == 'T' && (exportName[0x17] == 'C')))) break; The 2nd one will call RtlInstallFunctionTableCallback undefined8 mw::constructor::install_function_table_callback(void) { if (RtlInstallFunctionTableCallback != NULL) { /* NTSYSAPI BOOLEAN RtlInstallFunctionTableCallback( [in] DWORD64 TableIdentifier, [in] DWORD64 BaseAddress, [in] DWORD Length, [in] PGET_RUNTIME_FUNCTION_CALLBACK Callback, [in] PVOID Context, [in] PCWSTR OutOfProcessCallbackDll ); */ (*RtlInstallFunctionTableCallback)(EXEC_CODE | 3,EXEC_CODE,0x2e4d26,PTR_callback_handler_1400245b0,0,0); } return 0; } If like me you never encountered RtlInstallFunctionTableCallback, the MSDN is very clear: Adds a dynamic function table to the dynamic function table list. Thank you, very helpful :-) Hopefully the remarks section gives more information and we can start being scared: Function tables are used on 64-bit Windows to determine how to unwind or walk the stack. These tables are usually generated by the compiler and stored as part of the image. However, applications must provide the function table for dynamically generated code. For more information about function tables, see the architecture guide for your system. This function is useful for very dynamic code. The application specifies the memory range for the generated code, but does not need to generate a table until it is needed by an unwind request. At that time, the system calls the callback function with the Context and the control address. The callback function must return the runtime function entry for the specified address. This hints us towards the fact the exceptions will not be handled by a single static handler and that we’ll have to put in some work. 1.3 Callback The Callback parameter of RtlInstallFunctionTableCallback() is a pointer to a GET_RUNTIME_FUNCTION_CALLBACK whose definition looks like PRUNTIME_FUNCTION GET_RUNTIME_FUNCTION_CALLBACK ( _In_ DWORD64 ControlPc, _In_opt_ PVOID Context ); This function will be called for any exception happening between the BaseAddress and BaseAddress + Size parameters of RtlInstallFunctionTableCallback, namely any exception happening between 0x14089b8e0 and 0x14089b8e0 + 0x2e4d26 and will return a pointer to a RUNTIME_FUNCTION structure of the form: typedef struct _IMAGE_RUNTIME_FUNCTION_ENTRY { DWORD BeginAddress; DWORD EndAddress; union { DWORD UnwindInfoAddress; DWORD UnwindData; } DUMMYUNIONNAME; } RUNTIME_FUNCTION, *PRUNTIME_FUNCTION, _IMAGE_RUNTIME_FUNCTION_ENTRY, *_PIMAGE_RUNTIME_FUNCTION_ENTRY; It has a single mandatory argument ControlPC which is the address where the exception happened. Our callback function dynamically creates a RUNTIME_FUNCTION struct and populates its fields based on the address of the crash: /* BeginAddress = crash offset in shellcode EndAddress = crash offset in shellcode + 1 UnwindData = EndAddress + 1 + byte [crash_rip + 1] */ PRUNTIME_FUNCTION mw::callback_handler(longlong exception_RIP) { PRUNTIME_FUNCTION runtime_func; uint alignment; runtime_func = (PRUNTIME_FUNCTION)operator_new(0xc); runtime_func->BeginAddress = (int)exception_RIP - (int)EXEC_CODE; runtime_func->EndAddress = runtime_func->BeginAddress + 1; runtime_func->UnwindData = runtime_func->EndAddress + 1 + (uint)*(byte *)(exception_RIP + 1); alignment = (uint)((runtime_func->UnwindData & 1) != 0); runtime_func->UnwindData = runtime_func->UnwindData + alignment; return runtime_func; } From the above function, we can infer the following structure in the code: [ HLT ] HLT instruction, trigger an exception [ JUNK_SIZE ] One byte indicating the number of junk bytes [ JUNK ] -+ [ JUNK ] | ... | JUNK_SIZE bytes of junk [ JUNK ] -+ [ UNWIND_INFO ] UNWIND_INFO structure At this stage, reading the x64 exception handling documentation is a must - even though my initial thought was something like “baaah screw this, we don’t need it”. Well, yes we need it. 1.4 Unwinding All of this is nice but we still dont know what code will be executed after the instruction triggers. If we put a breakpoint in KiUserExceptionDispatcher and trace it far enough, we see that eventually the flow is transfered back to our code region of interest. We need to understand where and how, and for this we need to keep digging and understand what this UNWIND_INFO structure is. The structure is documented here and can be a bit tricky to parse. Its size depends on the Count of unwind codes field and what they are not saying is that while each unwind code is a USHORT, the array size should be DWORD aligned. In simpler terms, if the struct says there’s 3 unwind codes, the array size will be of 4 unwind codes, the latest one being to be discarded. Luckily for us the first UNWIND_INFO struct we encounter has 0 unwind code, so we dont have to deal with it now. The last DWORD of the structure is the offset of the actual exception handler that needs to be executed, and just like that we know where code execution continues after the execution. // bear in mind that 0x140097af0 is considered offset 0 The exception handler is an EXCEPTION_ROUTINE as documented here, whose prototype is typedef EXCEPTION_DISPOSITION (*PEXCEPTION_ROUTINE) ( IN PEXCEPTION_RECORD ExceptionRecord, IN ULONG64 EstablisherFrame, IN OUT PCONTEXT ContextRecord, IN OUT PDISPATCHER_CONTEXT DispatcherContext ); At this stage, I started to draft my plan: shove all the code to the unicorn emulator HOOK_CODE to catch the HLT instructions get the UNWIND_INFO address parse it to grab the exception handler address set RIP to that address continue execution profit (maybe ?) that should give me a trace (that i was unable to get with x64dbg - because of skill issues, not the tool), from which i may be able to understand what’s the code actually doing. I worked until it didn’t, and that was fairly quickly :-) The actual code is scattered around exceptions handlers, and it turned out we actually need to do something with the unwind codes. 1.5 Unwinding (For Real) So what is unwinding ? Stack unwinding is the process in programming where the runtime system reverses (or “unwinds”) the call stack to clean up resources and execute any necessary destructors or exception handlers after an exception is thrown. This happens sequentially from the point of the exception back through each previous function call, releasing resources at each level until a suitable catch block is found or the program terminates. (thank you ChatGPT). Unwinding is the process of undoing the changes that have been made to the stack by any function call. Unwind codes describe what needs to be done in order to undo those changes. The UNWIND_CODE structure: In our case, we’re only interested in a limited number of Unwind operation codes: UWOP_PUSH_MACHFRAME UWOP_PUSH_NONVOL UWOP_ALLOC_LARGE UWOP_ALLOC_SMALL UWOP_SET_FPREG They are all documented here. For example, UWOP_PUSH_NONVOL: Push a nonvolatile integer register, decrementing RSP by 8. The operation info is the number of the register. In order to reverse that we have to pop that register off the stack and increment RSP by 8, easy, but what wasn’t clear to me is that these operations are not done on actual registers, but within a CONTEXT struct that is created when the exception occured in order to save the CPU context (makes sense). After reading reactos source code, libunwindstack and crawling the depths of github, each opcode can be implemented as follow (in the more or less pythonic pseudocode): # UWOP_PUSH_MACHFRAME offset = 0x20 if unwind_op_info == 1 else 0x18 context.regs[RSP] = mem_read_qword(context.regs[RSP] + offset) # UWOP_PUSH_NONVOL reg = REGS(unwind_op_info) v = mem_read_qword(context.regs[RSP]) # v = [rsp] context.regs[reg] = v # regX = v context.regs[RSP] += 8 # rsp += 8 # UWOP_ALLOC_LARGE This one requires 2 or 3 slots depending on the OpInfo field # alloc size = next slot * 8 if unwind_op_info == 0: size = USHORT(unwind_codes.read(2)) * 8 node += 1 # alloc size = next 2 slot elif unwind_op_info == 1: size = UINT(unwind_codes.read(4)) node += 2 context.regs[RSP] += size # UWOP_ALLOC_SMALL size = unwind_op_info * 8 + 8 context.regs[RSP] += size # UWOP_SET_FPREG context.regs[RSP] = context.regs[REGS(frame_reg)] context.regs[RSP] -= frame_offset * 16 1.6 CONTEXT We already mentionned that a CONTEXT struct is saved whenever an exception occurs and that the unwinding takes place within that structure. It is important because the code that interests us is using that CONTEXT struct to pass information between the different exception handlers. When tracing the code we can see things like this, which in this specific case is loading the saved r13 register from the saved context to rdi. >> 0x600001a7 mov rbp, qword ptr [r9 + 0x28] ; DISPATCHER_CONTEXT->ContextRecord [...] >> 0x602e4e8c mov rdi, qword ptr [rbp + 0xe0] ; ContextRecord.R13 r9 holds the fourth argument to our EXCEPTION_ROUTINE, which is a pointer to a DISPATCHER_CONTEXT structure. typedef struct _DISPATCHER_CONTEXT { ULONG64 ControlPc; ULONG64 ImageBase; PRUNTIME_FUNCTION FunctionEntry; ULONG64 EstablisherFrame; ULONG64 TargetIp; PCONTEXT ContextRecord; PEXCEPTION_ROUTINE LanguageHandler; PVOID HandlerData; } DISPATCHER_CONTEXT, *PDISPATCHER_CONTEXT; 1.7 Stitching It All Together Turned out our emulator needs to do a little bit more than initially expected. Whenever we encounter a HLT instruction we need to: Save a CONTEXT structure with the current CPU state Compute the address of RUNTIME_FUNCTION.UnwindData for our crash location Parse the UNWIND_INFO structure at that location Apply all the UNWIND_OPCODE to our saved CONTEXT struct Save that CONTEXT struct to memory and make sure the EXCEPTION_ROUTINE handler can access it (we need R9 = DISPATCHER_CONTEXT address and R9+0x28 = CONTEXT address) When running the emulator with the input key AAAABBBBCCCCDDDDaaaabbbbccccdddd we can see something like (full trace here): mapping .text @ 0x140001000 (sz: 0x16000) mapping .rdata @ 0x140017000 (sz: 0xb000) mapping .data @ 0x140022000 (sz: 0x885000) mapping .pdata @ 0x1408a7000 (sz: 0x2000) mapping .rsrc @ 0x1408a9000 (sz: 0x1000) >> 0x140001642 lea rcx, [rip + 0x89a29f] >> 0x140001649 call qword ptr [rip + 0x89a291] >> 0x60000000 hlt saving context... CTX rax: 0x0000000000000000 rcx: 0x000000014089b8e8 rdx: 0x0000000000000000 rbx: 0x0000000000000000 CTX rsp: 0x00000000067ffea8 rbp: 0x0000000000000000 rsi: 0x0000000000000000 rdi: 0x0000000000000000 CTX r8: 0x0000000000000000 r9: 0x0000000000000000 r10: 0x0000000000000000 r11: 0x0000000000000000 CTX r12: 0x0000000000000000 r13: 0x0000000000000000 r14: 0x0000000000000000 r15: 0x0000000000000000 CTX: rip: 0x0000000060000000 mxcsr: 0x00000000 flag: 1 / opcodes: 0 exception_handler: 0x98 CTX rax: 0x0000000000000000 rcx: 0x000000014089b8e8 rdx: 0x0000000000000000 rbx: 0x0000000000000000 CTX rsp: 0x00000000067ffea8 rbp: 0x0000000000000000 rsi: 0x0000000000000000 rdi: 0x0000000000000000 CTX r8: 0x0000000000000000 r9: 0x0000000000000000 r10: 0x0000000000000000 r11: 0x0000000000000000 CTX r12: 0x0000000000000000 r13: 0x0000000000000000 r14: 0x0000000000000000 r15: 0x0000000000000000 CTX: rip: 0x0000000060000000 mxcsr: 0x00000000 HANDLER ADDR: 0x60000098 context to mem... >> 0x60000098 call 0x602e4d27 >> 0x602e4d27 pop qword ptr [rip + 0x33] >> 0x602e4d27 pop qword ptr [rip + 0x33] >> 0x602e4d2d push rax >> 0x602e4d2e mov rax, 0 >> 0x602e4d35 mov ah, byte ptr [rip - 0x15] >> 0x602e4d3b lea eax, [eax + 0x7f497049] >> 0x602e4d42 mov dword ptr [rip + 1], eax >> 0x602e4d42 mov dword ptr [rip + 1], eax >> 0x602e4d48 pop rax >> 0x602e4d49 movabs r11, 0x10add7f49 >> 0x602e4d53 mov dword ptr [rip - 0x14], 0x676742dd >> 0x602e4d53 mov dword ptr [rip - 0x14], 0x676742dd >> 0x602e4d5d push rax >> 0x602e4d5e movabs rax, 0x6000009d >> 0x602e4d68 lea rax, [rax + 5] >> 0x602e4d6c xchg qword ptr [rsp], rax >> 0x602e4d70 ret >> 0x600000a2 push r11 >> 0x600000a4 push 0x73775436 >> 0x600000a9 push 0x68a04c43 >> 0x600000ae push 0x12917ff9 >> 0x600000b3 call 0x602e4d96 >> 0x602e4d96 pop qword ptr [rip + 0x32] >> 0x602e4d9c push rax >> 0x602e4d9d mov rax, 0 >> 0x602e4da4 mov ah, byte ptr [rip - 0x4a] >> 0x602e4daa lea eax, [eax + 0x2443e448] >> 0x602e4db1 mov dword ptr [rip + 1], eax >> 0x602e4db1 mov dword ptr [rip + 1], eax >> 0x602e4db7 pop rax >> 0x602e4db8 add qword ptr [rsp + 0x18], 0x35ac399f >> 0x602e4dc1 mov dword ptr [rip - 0x13], 0x62cf7984 >> 0x602e4dc1 mov dword ptr [rip - 0x13], 0x62cf7984 >> 0x602e4dcb push rax >> 0x602e4dcc movabs rax, 0x600000b8 >> 0x602e4dd6 lea rax, [rax + 4] >> 0x602e4dda xchg qword ptr [rsp], rax >> 0x602e4dde ret >> 0x600000bc call 0x602e4dff >> 0x602e4dff pop qword ptr [rip + 0x2e] >> 0x602e4dff pop qword ptr [rip + 0x2e] >> 0x602e4e05 push '''
