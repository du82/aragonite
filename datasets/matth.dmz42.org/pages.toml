title = "Reversing Firmwares from FS and BDCOM Switches"
description = """
I recently had to buy a new 24x1G fanless switch for my home network. I had a mikrotik switch for years (which i was happy with but suffered a power surge) and wanted to try something new so I ended up with a FS S3700-24T4F.
Their CLI is close to Cisco’s IOS, it’s overall a fun device for home network and not too expensive. Found few small bugs here and there without really looking for them but in the end nothing too annoying in my context."""
full_description = '''Jan 11, 2022 Reversing Firmwares from FS and BDCOM Switches I recently had to buy a new 24x1G fanless switch for my home network. I had a mikrotik switch for years (which i was happy with but suffered a power surge) and wanted to try something new so I ended up with a FS S3700-24T4F. Their CLI is close to Cisco’s IOS, it’s overall a fun device for home network and not too expensive. Found few small bugs here and there without really looking for them but in the end nothing too annoying in my context. Looking at the form factor and the number of BDCOM reference in the firmware, it’s most likely a rebranded BDCOM S2528-C. 1. Scope The following seems applicable to most BDCOM switches and to FS S3150, S3260, S3400 and S3700 (rebranded BDCOM ?) This is not a full analysis of the firmware, but that should be enough information to easily get started with reversing them. 2. First look You can either get the firmware straight from the switch via TFTP (i had issue with SCP) or from their websites: BDCOM: https://sites.google.com/bdcom.cn/international/download/firmware/switch FS: https://img-en.fs.com/file/user_manual/poe+-series-switches-fsos-v2-2-0d-a79995-software.zip There’s usually 2 files: Switch#dir Directory of /: 1 Switch.bin <FILE> 4352907 THU JAN 01 00:02:10 1970 0 web.wrp <FILE> 30740 THU JAN 01 00:02:13 1970 Switch.bin is the actual firmware web.wrp is a password protected rar containing some branding/customs for the web interface % file Switch.bin web.wrp Switch.bin: data web.wrp: RAR archive data, v2.0, os: Win32 % unrar l web.wrp UNRAR 6.10 beta 2 freeware Copyright (c) 1993-2021 Alexander Roshal Archive: web.wrp Details: RAR 4 Attributes Size Date Time Name ----------- --------- ---------- ----- ---- * I.A.... 660 2021-01-08 15:17 cn.png * I.A.... 674 2021-01-08 15:17 en.png * I.A.... 52920 2021-01-08 15:17 extipaclitem.asp * I.A.... 824 2021-01-08 15:17 footer.asp * I.A.... 1795 2021-01-08 15:17 icon.png * I.A.... 1141 2021-01-08 15:17 index.asp * I.A.... 37192 2021-01-08 15:17 logo.asp * I.A.... 1057 2021-01-08 15:17 logo.gif * I.A.... 2594 2021-01-08 15:17 nav.png * I.A.... 36188 2021-01-08 15:18 navbar.asp * I.A.... 9753 2021-01-08 15:17 nav_style.css * I.A.... 3899 2021-01-08 15:17 tabctrl.asp ----------- --------- ---------- ----- ---- 148697 12 3. Extracting Switch.bin The Switch.bin has 2 parts. The first part starts with the magic “BDCO\x00” and possibly contains some informations like base address and maybe some code responsible for loading the rest of the firmware (unconfirmed). The 2nd part starts at offset 0x2030 and is identified by a “SYS\x00” marker. At offset 0x2040 is a rar file. % hexdump -C Switch.bin | more --- 1st part --- 00000000 42 44 43 4f 00 00 00 03 80 00 80 00 80 00 80 00 |BDCO............| 00000010 00 40 16 a2 00 00 20 40 02 02 00 44 07 e5 00 02 |.@.... @...D....| 00000020 05 0e 19 0f ee 3f 5a 73 00 00 00 00 00 00 00 02 |.....?Zs........| 00000030 00 02 1e fd 00 02 8c 12 00 02 78 c9 00 02 e8 92 |..........x.....| 00000040 00 02 ba 94 00 02 45 f6 00 02 c3 5f 00 02 90 f1 |......E...._....| 00000050 00 02 4d d1 00 00 f6 ed 00 00 fc 89 00 00 f8 d9 |..M.............| 00000060 00 02 b5 32 00 02 cd b6 00 02 bd c6 00 02 a4 69 |...2...........i| 00000070 00 02 d5 cf 00 02 0f f2 00 01 a8 41 00 02 e8 cc |...........A....| 00000080 00 01 12 e7 00 01 18 d2 00 02 13 de 00 01 f6 07 |................| 00000090 00 02 2e ba 00 02 7f 17 00 01 1d b7 00 01 6a 1c |..............j.| 000000a0 00 00 ec 16 00 00 6e 61 00 00 e0 3e 00 00 cf 58 |......na...>...X| 000000b0 00 00 c7 e1 00 00 e2 29 00 00 00 00 00 00 00 00 |.......)........| 000000c0 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 |................| * 00001030 cd 67 79 69 ec a8 3e d3 41 66 81 8c b9 2c 6d 10 |.gyi..>.Af...,m.| 00001040 4a db 4a 70 07 49 f0 fd 88 97 71 06 c1 8f d2 59 |J.Jp.I....q....Y| 00001050 4d 92 e6 b3 fc 3f 46 a6 cc 7d 25 b3 96 b4 41 8d |M....?F..}%...A.| 00001060 c8 8d a7 f6 94 54 80 86 b3 47 aa ff a8 dc 73 09 |.....T...G....s.| 00001070 f5 60 4e 8c 00 00 00 00 00 00 00 00 00 00 00 00 |.`N.............| 00001080 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 |................| * --- 2nd part --- 00002030 53 59 53 00 00 00 00 00 00 00 00 00 00 00 00 00 |SYS.............| --- RAR file --- 00002040 52 61 72 21 1a 07 00 cf 90 73 00 00 0d 00 00 00 |Rar!.....s......| 00002050 00 00 00 00 e0 8d 74 80 80 25 00 c4 1e 02 00 00 |......t..%......| 00002060 00 08 00 02 53 ed 8e e8 28 73 45 52 14 33 05 00 |....S...(sER.3..| While this is true for most the files i could get my hands on, some of them like FSOS_2.2.0D_75857.bin are different: no rar file at 0x2040 1st part contains more data (i mean less NULL bytes) hence my previous assumption about the first part of the bin file. the following will split the first part and the rar file: #!/usr/bin/env python import sys with open(sys.argv[1], "rb") as fp: with open('out_1.bin', 'wb') as fp_out: fp_out.write(fp.read(0x2030)) assert fp.read(16) == b'SYS\x00' + b'\x00'*12 with open("out_2.bin", "wb") as fp_out: fp_out.write(fp.read()) % ./extract.py Switch.bin % unrar l out_2.bin UNRAR 6.10 beta 2 freeware Copyright (c) 1993-2021 Alexander Roshal Archive: out_2.bin Details: RAR 4 Attributes Size Date Time Name ----------- --------- ---------- ----- ---- ..A.... 524288 2021-02-05 14:25 .temp ..A.... 524288 2021-02-05 14:25 .temp ..A.... 524288 2021-02-05 14:25 .temp ..A.... 524288 2021-02-05 14:25 .temp ..A.... 524288 2021-02-05 14:25 .temp ..A.... 524288 2021-02-05 14:25 .temp ..A.... 524288 2021-02-05 14:25 .temp ..A.... 524288 2021-02-05 14:25 .temp ..A.... 524288 2021-02-05 14:25 .temp ..A.... 524288 2021-02-05 14:25 .temp ..A.... 524288 2021-02-05 14:25 .temp ..A.... 524288 2021-02-05 14:25 .temp ..A.... 524288 2021-02-05 14:25 .temp ..A.... 524288 2021-02-05 14:25 .temp ..A.... 524288 2021-02-05 14:25 .temp ..A.... 524288 2021-02-05 14:25 .temp ..A.... 524288 2021-02-05 14:25 .temp ..A.... 524288 2021-02-05 14:25 .temp ..A.... 524288 202