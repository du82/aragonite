full_description = '''May 21, 2022 HackTheBox CTF Cyber Apocalypse 2022: Intergalactic Chase (Reverse) Hack The Box was hosting a CTF event and we played together with some friends. Here are some writeups for some of the reversing challenges i solved. There’s often shortcuts taken and (un)educated guesses involved, some ugly Z3 and angr for additionnal fun… 0. TOC Without A Trace (413 solves) Teleport (307 solves) Rebuilding (463 solves) Nuts and Bolts (60 solves) Shuffleme (28 solves) Snake Code (281 solves) Freaky Forum Interception (32 solves) Indefinite (58 solves) 1. Without A Trace Original file here. The check_password function calls ptrace(PTRACE_ME) and uses the return value as part of the flag decryption loop. It’s a classic antidebug trick, as if the process is already being debugged, the ptrace call will fail (a process can only be traced once) and the decrypted result will be garbage. ulong check_password(char *param_1) { int iVar1; long ptrace_result; undefined4 extraout_var; long in_FS_OFFSET; uint n; undefined8 stack_string; undefined8 local_30; undefined8 local_28; undefined2 local_20; undefined local_1e; long local_10; ptrace_result = ptrace(PTRACE_TRACEME,0,0,0); stack_string = 0x1c4b0d0b043d2b37; local_30 = 0x200f0a204c12204c; local_28 = 0x184f18200a204b1d; local_20 = 0x24f; local_1e = 0; for (n = 0; n < 0x1a; n = n + 1) { *(byte *)((long)&stack_string + (long)(int)n) = *(byte *)((long)&stack_string + (long)(int)n) ^ (char)ptrace_result + 0x7fU; } /* strcmp */ iVar1 = strcmp(param_1,(char *)&stack_string); return CONCAT44(extraout_var,iVar1) & 0xffffffffffffff00 | (ulong)(iVar1 == 0); } One way of going around that is to manipulate the ptrace return value to simulate a sucessful call. We can just break at strcmpafterwards and dump the string… % gdb ./without_a_trace pwndbg: loaded 198 commands. Type pwndbg [filter] for a list. pwndbg: created $rebase, $ida gdb functions (can be used with print/break) Reading symbols from ./without_a_trace... (No debugging symbols found in ./without_a_trace) pwndbg> break ptrace Breakpoint 1 at 0x730 pwndbg> run Starting program: ./without_a_trace [+] Primary Mothership Tracking Panel [X] Unusual activity detected |-------] Unrecognised login location: Earth [X] Please verify your identity by entering your password > dsdsdsdsdsds Breakpoint 1, ptrace (request=PTRACE_TRACEME) at ../sysdeps/unix/sysv/linux/ptrace.c:30 pwndbg> finish pwndbg> set $rax=0 pwndbg> break strcmp Breakpoint 2 at 0x7ffff7f282a0: file ../sysdeps/x86_64/multiarch/strcmp-avx2.S, line 106. pwndbg> c Continuing. pwndbg> x/s $rsi 0x7fffffffe340: "HTB{tr4c3_m3_up_b4_u_g0g0}" 2. Teleport Original files here. undefined8 main(int argc,char **argv) { int iVar1; undefined8 uVar2; uint i; if (argc == 2) { strncpy(INPUT,argv[1],100); for (i = 0; i < 0x2b; i = i + 1) { (*(code *)(&PTR_FUN_00303020)[(int)i])(); } iVar1 = _setjmp((__jmp_buf_tag *)&DAT_003031a0); if (iVar1 == 100) { puts("Looks good to me!"); } else { if (iVar1 != 0x65) { /* WARNING: Subroutine does not return */ longjmp((__jmp_buf_tag *)(&DAT_00303300 + (long)iVar1 * 200),1); } puts("Something\'s wrong..."); } uVar2 = 0; } else { puts("Missing password"); uVar2 = 0xffffffff; } return uVar2; } we want to reach the Looks good to me, just throw it angr and reuse some old script… #!/usr/bin/env python3 import angr import claripy import logging # by default, angr will set PIE binary base at 0x400000 BASE_ADDR = 0x400000 def rebase(addr): return BASE_ADDR + addr def main(): p = angr.Project('teleport') # 64 bytes argv[1] argv1 = claripy.BVS("argv1", 8*64) initial_state = p.factory.entry_state(args=["./teleport", argv1]) sm = p.factory.simulation_manager(initial_state) # 0x1732 = good boy # 00101732 48 8d 3d ec 00 00 00 LEA argc,[s_Looks_good_to_me!_00101825] # 00101739 e8 a2 f2 ff ff CALL <EXTERNAL>::puts # 0x1740 = nop # 00101740 48 8d 3d f0 00 00 00 LEA argc,[s_Something's_wrong..._00101837] # 00101747 e8 94 f2 ff ff CALL <EXTERNAL>::puts sm.explore(find=rebase(0x1732), avoid=rebase(0x1740)) if not len(sm.found): print("no solution") return 1 found = sm.found[0] solution = found.solver.eval(argv1, cast_to=bytes) solution = solution[:solution.find(b'\x00')] return solution if __name__ == "__main__": print([main()]) % python solve02.py WARNING | 2022-05-21 10:11:38,350 | cle.loader | The main binary is a position-independent executable. It is being loaded with a base address of 0x400000. WARNING | 2022-05-21 10:11:39,063 | angr.storage.memory_mixins.default_filler_mixin | The program is accessing memory with an unspecified value. This could indicate unwanted behavior. WARNING | 2022-05-21 10:11:39,064 | angr.storage.memory_mixins.default_filler_mixin | angr will cope with this by generating an unconstrained symbolic variable and continuing. You can resolve this by: WARNING | 2022-05-21 10:11:39,064 | angr.storage.memory_mixins.default_filler_mixin | 1) setting a value to the initial state WARNING | 2022-05-21 10:11:39,064 | angr.storage.memory_mixins.default_filler_mixin | 2) adding the state option ZERO_FILL_UNCONSTRAINED_{MEMORY,REGISTERS}, to make unknown regions hold null WARNING | 2022-05-21 10:11:39,064 | angr.storage.memory_mixins.default_filler_mixin | 3) adding the state option SYMBOL_FILL_UNCONSTRAINED_{MEMORY,REGISTERS}, to suppress these messages. WARNING | 2022-05-21 10:11:39,064 | angr.storage.memory_mixins.default_filler_mixin | Filling memory at 0x7fffffffffeff4c with 4 unconstrained bytes referenced from 0x400a25 (PLT.__cxa_finalize+0x15 in teleport (0xa25)) WARNING | 2022-05-21 10:11:39,147 | angr.storage.memory_mixins.default_filler_mixin | Filling memory at 0x7ffffffffff0000 with 28 unconstrained bytes referenced from 0x78a620 (strncpy+0x0 in libc.so.6 (0x8a620)) [b'HTB{h0pp1ng_thru_th3_sp4c3_t1m3_c0nt1nuum!}\x80\x80'] not much reversing needed… 3. Rebuilding Original files here. same as Teleport, just fix the find and avoid offsets… #!/usr/bin/python import angr import claripy import logging BASE_ADDR = 0x400000 def rebase(addr): return BASE_ADDR + addr def main(): p = angr.Project('rebuilding') argv1 = claripy.BVS("argv1", 8*0x21) initial_state = p.factory.entry_state(args=["./rebuilding", argv1]) sm = p.factory.simulation_manager(initial_state) sm.explore(find=rebase(0x000009f2), avoid=rebase(0x00000a05)) if not len(sm.found): print("no solution") return 1 found = sm.found[0] solution = found.solver.eval(argv1, cast_to=bytes) solution = solution[:solution.find(b'\x00')] return solution if __name__ == "__main__": print([main()]) % python solve02.py WARNING | 2022-05-21 10:20:18,366 | cle.loader | The main binary is a position-independent executable. It is being loaded with a base address of 0x400000. WARNING | 2022-05-21 10:20:19,039 | angr.storage.memory_mixins.default_filler_mixin | The program is accessing memory with an unspecified value. This could indicate unwanted behavior. WARNING | 2022-05-21 10:20:19,040 | angr.storage.memory_mixins.default_filler_mixin | angr will cope with this by generating an unconstrained symbolic variable and continuing. You can resolve this by: WARNING | 2022-05-21 10:20:19,040 | angr.storage.memory_mixins.default_filler_mixin | 1) setting a value to the initial state WARNING | 2022-05-21 10:20:19,040 | angr.storage.memory_mixins.default_filler_mixin | 2) adding the state option ZERO_FILL_UNCONSTRAINED_{MEMORY,REGISTERS}, to make unknown regions hold null WARNING | 2022-05-21 10:20:19,040 | angr.storage.memory_mixins.default_filler_mixin | 3) adding the state option SYMBOL_FILL_UNCONSTRAINED_{MEMORY,REGISTERS}, to suppress these messages. WARNING | 2022-05-21 10:20:19,040 | angr.storage.memory_mixins.default_filler_mixin | Filling memory at 0x7fffffffffeff6c with 4 unconstrained bytes referenced from 0x400745 (_start+0x5 in rebuilding (0x745)) WARNING | 2022-05-21 10:20:19,180 | angr.storage.memory_mixins.default_filler_mixin | Filling memory at 0x7ffffffffff0000 with 62 unconstrained bytes referenced from 0x78a410 (strlen+0