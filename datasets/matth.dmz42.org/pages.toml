full_description = '''Nov 14, 2022 Flare-On 9 Writeups Here are (some ?) writeups for this year Flare-On challenge. I’ll add more in the coming days. For reference here is my timing: 0. TOC Flaredle PixelPoker Magic 8 Ball darn_mice T8 a la mode anode backdoor encryptor Nur getraumt The challenge that shall not be named 1. Flaredle 1.1 Challenge Prompt Welcome to Flare-On 9! You probably won’t win. Maybe you’re like us and spent the year playing Wordle. We made our own version that is too hard to beat without cheating. 1.2 Solution Small javascript webapp where we need to guess a word. Open script.js, starts with: import { WORDS } from "./words.js"; const NUMBER_OF_GUESSES = 6; const WORD_LENGTH = 21; const CORRECT_GUESS = 57; let guessesRemaining = NUMBER_OF_GUESSES; let currentGuess = []; let nextLetter = 0; let rightGuessString = WORDS[CORRECT_GUESS]; find correct flag condition: if (guessString === rightGuessString) { let flag = rightGuessString + '@flare-on.com'; toastr.options.timeOut = 0; toastr.options.onclick = function() {alert(flag);} toastr.success('You guessed right! The flag is ' + flag); guessesRemaining = 0 return } we know that rightGuessString = WORDS[CORRECT_GUESS] and that CORRECT_GUESS = 57, so we can just pick it up in the array from words.js % cat -n words.js | grep " $((57+1))" # because array starts at 0 58 'flareonisallaboutcats', flag: flareonisallaboutcats@flare-on.com 2. PixelPoker 2.1 Challenge Prompt I said you wouldn’t win that last one. I lied. The last challenge was basically a captcha. Now the real work begins. Shall we play another game? 2.2 Solution launching the executable, we get this fancy looking window. We need to click the right pixel, and we have 10 attempts. Following the entry point, we find the main function, which in turn calls the following function: void FUN_00401120(HINSTANCE param_1) { WNDCLASSEXW wc; wc.cbSize = 0x30; wc.style = 3; wc.lpfnWndProc = WindowProc; /* Window Procedure */ wc.cbClsExtra = 0; wc.cbWndExtra = 0; wc.hInstance = param_1; wc.hIcon = LoadIconW(param_1,(LPCWSTR)0x6b); wc.hCursor = LoadCursorW(NULL,(LPCWSTR)0x7f00); wc.hbrBackground = (HBRUSH)0x6; wc.lpszMenuName = (LPCWSTR)0x6d; wc.lpszClassName = (LPCWSTR)&DAT_004131b0; wc.hIconSm = LoadIconW(wc.hInstance,(LPCWSTR)0x6c); RegisterClassExW(&wc); return; } which registers a window class, with lpfnWndProc pointing the Window Procedure that will handle our window events. References from MSDN: Writing the Window Procedure WM_LBUTTONDOWN message With the above references, we can retype the WindowProc prototype in ghidra, as well as use the appropriate WM_* constants on the uMsg comparisons and then focus on the click events: LRESULT WindowProc(HWND hwnd,uint uMsg,WPARAM wParam,LPARAM lpParam) { // snip sVar1 = (short)((uint)lpParam >> 0x10); if (uMsg == WM_MOUSEMOVE) { update_window_title(buff,0x104,"PixelPoker (%d,%d) - #%d/%d",(int)(short)lpParam,(int)sVar1,TRIES,10); SetWindowTextA(hwnd,buff); return 0; } if (uMsg == WM_LBUTTONDOWN) { px_x = (uint)(short)lpParam; px_y = (uint)sVar1; if (TRIES == 10) { MessageBoxA(NULL,"Womp womp... :(","Please play again!",0); DestroyWindow(hwnd); } else { TRIES = TRIES + 1; if ((px_x == s_FLARE-On_00412004._0_4_ % DAT_00413280) && (px_y == s_FLARE-On_00412004._4_4_ % DAT_00413284)) { if (0 < (int)DAT_00413284) { iVar7 = 0; uVar4 = DAT_00413280; uVar5 = DAT_00413284; do { iVar6 = 0; if (0 < (int)uVar4) { do { FUN_004015d0(iVar6,iVar7); iVar6 = iVar6 + 1; uVar4 = DAT_00413280; uVar5 = DAT_00413284; } while (iVar6 < (int)DAT_00413280); } iVar7 = iVar7 + 1; } while (iVar7 < (int)uVar5); } } else if ((px_x < DAT_00413280) && (px_y < DAT_00413284)) { FUN_004015d0(px_x,px_y); } } update_window_title(buff,0x104,"PixelPoker (%d,%d) - #%d/%d",px_x,px_y,TRIES,10); SetWindowTextA(hwnd,buff); pHVar2 = GetDC(hwnd); BitBlt(pHVar2,0,0,DAT_00413280,DAT_00413284,DAT_00413278,0,0,0xcc0020); ReleaseDC(hwnd,pHVar2); return 0; } We can see than we the mouse is moved around the window (WM_MOUSEMOVE), the window title is updated with x/y coordinates. On the click event (WM_LBUTTONDOWN), there’s a conditionnal check: if ((px_x == s_FLARE-On_00412004._0_4_ % DAT_00413280) && (px_y == s_FLARE-On_00412004._4_4_ % DAT_00413284)) { which leads further down to some RC4 routine. Let’s run it in a debugger and patch the 2 following conditionnal jumps. Fire x32dbg, set 2 breakpoints: bp 00401486 bp 0040149d Continue execution and click anywhere. On the 2 breakpoints, modify the Zero Flag (ZF) and then watch the flag: 3. Magic 8 Ball (coming soon ?) 4. darn_mice 4.1 Challenge Prompt “If it crashes its user error.” -Flare Team 4.2 Solution When we run the executable with an arguments it prints something and exits: C:\Users\me\Desktop>darn_mice.exe aaa On your plate, you see four olives. You leave the room, and a mouse EATS one! We can find these strings in ghidra and follow the XREF to this function: void __cdecl main(PUCHAR input_string) { size_t len; undefined extraout_DL; undefined extraout_DL_00; undefined uVar1; undefined uVar2; uint n; char some_array [36]; uint stack_cookie; code *buffer; stack_cookie = DAT_00419178 ^ (uint)&stack0xfffffffc; buffer = NULL; some_array[0] = '\x50'; some_array[1] = 0x5e; some_array[2] = 0x5e; some_array[3] = 0xa3; some_array[4] = 0x4f; some_array[5] = 0x5b; some_array[6] = 0x51; some_array[7] = 0x5e; some_array[8] = 0x5e; some_array[9] = 0x97; some_array[10] = 0xa3; some_array[11] = 0x80; some_array[12] = 0x90; some_array[13] = 0xa3; some_array[14] = 0x80; some_array[15] = 0x90; some_array[16] = 0xa3; some_array[17] = 0x80; some_array[18] = 0x90; some_array[19] = 0xa3; some_array[20] = 0x80; some_array[21] = 0x90; some_array[22] = 0xa3; some_array[23] = 0x80; some_array[24] = 0x90; some_array[25] = 0xa3; some_array[26] = 0x80; some_array[27] = 0x90; some_array[28] = 0xa3; some_array[29] = 0x80; some_array[30] = 0x90; some_array[31] = 0xa2; some_array[32] = 0xa3; some_array[33] = 0x6b; some_array[34] = 0x7f; some_array[35] = 0; print