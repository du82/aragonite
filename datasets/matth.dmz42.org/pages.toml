full_description = '''Nov 8, 2021 The Return of the Malwarebytes Crackme Malwarebytes released their 3rd crackme, here’s my entry for the writeup contest. You can find the original announcement here and the contest summary here. 0. First Look Running the crackme, we understand we’ll be asked to find 3 passwords. Only the first button is enabled, so they will most likely need to be found in order Loading the binary into PE-bear reveals it’s a Dot Net binary so let’s open it in dnSpy It opens nicely, so far, so good. 1. Level 1 Browsing a little bit in dnSpy we quickly find the code behind the 3 buttons, so let’s start with the first one: It’s basically calling a decode function with a resource named mb_logo_star as first parameter and our input password as 2nd parameter. The resulting array is then resized to 241152 bytes and if its crc32 is 2741486452 the bytes are written to %TEMP%/level2.exe and the newly created binary is executed. It’s safe to assume the decode function will use our input password to somehow decrypt an executable. Let’s start by extracting the resource, which is easily done with dnSpy: and look at the decode function it uses LSB (Least Significant Bits) steganography to hide data: each pixel is represented by 3 color bytes Red, Green and Blue the least 3 significant bits of the red and green values, and the 2 least significant bits of the blue are used to encode a total of 8bits per pixel the resulting byte is then XOR’d with our input password let’s start by extracting the data with a simple script: #!/usr/bin/env python3 from PIL import Image bm = Image.open("mb_logo_star").convert('RGB') with open('l1_extract.bin', 'wb') as fp: for i in range(bm.width): for j in range(bm.height): r, g, b = bm.getpixel((i, j)) num2 = r & 7 num3 = (g & 7) << 3 num4 = (b & 3) << 6 b = num2 | num3 | num4 fp.write(b.to_bytes(1, 'little')) One thing with PE files, is that they contain quite a lot of contiguous NULL bytes, which if we are lucky could reveal the XOR key straight away % xxd l1_extract.bin| more [snip] 00000270: 845e 6b65 65a0 5c67 6f6b 6e67 21f9 6273 .^kee.\gokng!.bs 00000280: 795f 6c65 7665 6c5f 6f6e 655f 216c 6d2f y_level_one_!lm/ 00000290: 5d06 3a08 000d 655f 6061 725f 7085 5c61 ].:...e_`ar_p.\a 000002a0: 6e74 5f6b 65fb 735f 676f 696e 6721 6561 nt_ke.s_going!ea 000002b0: 7379 5f6c 2576 652e 5f6f 6e65 5f61 6c6d sy_l%ve._one_alm 000002c0: 6f73 745f 646f 6e65 5f78 6f72 5f70 655f ost_done_xor_pe_ 000002d0: 616e 645f 6b65 6570 5f67 6f69 6e67 2165 and_keep_going!e 000002e0: 6173 795f 6c65 7665 6c5f 6f6e 655f 616c asy_level_one_al 000002f0: 6d6f 7374 5f64 6f6e 655f 786f 725f 7065 most_done_xor_pe 00000300: 5f61 6e64 5f6b 6565 705f 676f 696e 6721 _and_keep_going! 00000310: 6561 7379 5f6c 6576 656c 5f6f 6e65 5f61 easy_level_one_a 00000320: 6c6d 6f73 745f 646f 6e65 5f78 6f72 5f70 lmost_done_xor_p 00000330: 655f 616e 645f 6b65 6570 5f67 6f69 6e67 e_and_keep_going 00000340: 2165 6173 795f 6c65 7665 6c5f 6f6e 655f !easy_level_one_ 00000350: 616c 6d6f 7374 5f64 6f6e 655f 786f 725f almost_done_xor_ 00000360: 7065 5f61 6e64 5f6b 6565 705f 676f 696e pe_and_keep_goin 00000370: 6721 6561 7379 5f6c 6576 656c 5f6f 6e65 g!easy_level_one 00000380: 5f61 6c6d 6f73 745f 646f 6e65 5f78 6f72 _almost_done_xor 00000390: 5f70 655f 616e 645f 6b65 6570 5f67 6f69 _pe_and_keep_goi 000003a0: 6e67 2165 6173 795f 6c65 7665 6c5f 6f6e ng!easy_level_on 000003b0: 655f 616c 6d6f 7374 5f64 6f6e 655f 786f e_almost_done_xo 000003c0: 725f 7065 5f61 6e64 5f6b 6565 705f 676f r_pe_and_keep_go 000003d0: 696e 6721 6561 7379 5f6c 6576 656c 5f6f ing!easy_level_o 000003e0: 6e65 5f61 6c6d 6f73 745f 646f 6e65 5f78 ne_almost_done_x 000003f0: 6f72 5f70 655f 616e 645f 6b65 6570 5f67 or_pe_and_keep_g 00000400: 3ae2 82ec 646d 37f8 79d4 64ee 0669 eda6 :...dm7.y.d..i.. 00000410: 6a6e 659f 1470 076f 1b14 be24 6f06 0dbe jne..p.o...$o... it’s easy to notice the repeating string: easy_level_one_almost_done_xor_pe_and_keep_going! which turns out to be the correct key: 2. Level 2 We can confirm that the crackme spawned a new process (in this case with procmon from the sysinternals suite): At this stage if we input some random password for level2, we get an error and the crackme exits We can suspect it’s because of procmon running: if we retry when it’s not running, it does not happen. The only way to know for sure is to take a look at this level2.exe, but first let’s have a look at the action performed when we click the 2nd button of the crackme: it tries to connect to named pipe crackme_pipe, then writes our input password to it, reads something back, checks the CRC, and if it matches an expected value, calls LoadNext.load(level2.exe_process, what_was_read_from_the_pipe) LoadNext.Load() will use the data read from the pipe to decrypt and load a Dot Net assembly: and then call the RunMe.Invoke(instance, level2.exe_process) - most likely injecting code in the level2.exe process. the key and IV are derived from the SHA256 hash of the password supplied to AES.decryptContent: We can assume the flow for level2 is: frontend: write input_password to pipe level2.exe: read input_password from pipe, do something and write something back to the pipe frontend: read something from the pipe frontend: derive AES IV and key from what was read from the pipe frontend: decrypt a Dot NET assembly frontend: probably do some code injection of some sort ? Time to look at level2.exe, we should find some code related to named pipes for sure. 2.1 Exploring level2.exe We can either XOR the content we extracted from the image with the password #1 and trim it to the correct size, or just copy the executable from %TEMP% - both work, but the second is a lesser effort. This time it’s not a Dot NET binary, so let’s open it with our favorite disassembler/decompiler. From the entry point, we can navigate down to the main function, which roughly look like this: int __cdecl main_0(int argc, const char **argv, const char **envp) { struct _PEB *v4; // eax _DWORD *v5; // ecx int v6; // eax int v7; // eax size_t v8; // esi int (__stdcall *function_pointer)(int, void **, _DWORD, size_t *, int, int); // eax int v10; // eax int (*v11)(void); // ecx size_t v12; // [esp+8h] [ebp-4E4C0h] BYREF void *v13; // [esp+Ch] [ebp-4E4BCh] BYREF char buffer[320692]; // [esp+10h] [ebp-4E4B8h] BYREF // register a Vectored Exception Handler AddVectoredExceptionHandler(1u, Handler); // do something with a buffer memset(buffer, 0, 0x4E4B2u); if ( !sub_4011D0(&unk_414000, 160345, buffer, 320690, &Size) ) return -3; // direct access to the PEB v4 = NtCurrentPeb(); if ( v4 ) v5 = *(v4->ImageBaseAddress + 3); else v5 = 0; v6 = 0; do { if ( !v5 ) break; if ( !v5[6] ) break; v5 = *v5; ++v6; } while ( !v6 ); v7 = v5[6]; v8 = Size; // somehow get a function pointer if ( v7 && (function_pointer = sub_401250(v7, 0xF4DD3DAD)) != 0 ) { v13 = 0; v12 = v8; // execute this function v10 = function_pointer(-1, &v13, 0, &v12, 1060864, 64); v11 = 0; if ( !v10 ) v11 = v13; dword_43BAE0 = v11; if ( v11 ) { // copy "buffer" somewhere else memmove(v11, buffer, Size); // and execute it dword_43BAE0(); return 0; } } else { dword_43BAE0 = 0; } return -4; } At first glance there’s nothing much involving some sort of password checking or named pipe operation, however a few things stand out straight away: it registers a Vectored Exception Handler (VEH) via the AddVectoredExceptionHandler(1, Handler) call SEH/VEH can be used to obfuscate control flow (luckily there’s no such thing here - we’ll see what it is used for later on). it is directly accessing the PEB (Process Environment Block) PEB via FS:[0x30] and then _PEB_LDR_DATA via PEB+0xC probably to get a list of loaded DLLs // direct access to the PEB v4 = NtCurrentPeb(); if ( v4 ) v5 = *(v4->ImageBaseAddress + 3); else v5 = 0; v6 = 0; do { if ( !v5 ) break; if ( !v5[6] ) break; v5 = *v5; ++v6; } while ( !v6 ); v7 = v5[6]; it is dynamically getting a function pointer, based on a value which look like a hash // somehow get a function pointer if ( v7 && (function_pointer = sub_401250(v7, 0xF4DD3DAD)) != 0 ) { v13 = 0; v12 = v8; // execute this function v10 = function_pointer(-1, &v13, 0, &v12, 1060864, 64); it’s transfering execution into memory dword_43BAE0 = v11; if ( v11 ) { // copy "buffer" somewhere else memmove(v11, buffer, Size); // and execute it dword_43BAE0(); return 0; } So it seems that it is using API hashing, a technique commonly used in malware to obfuscate API calls in order to unpack a second stage payload and transfert excution to it. Let’s dive into both. 2.2 API Hashing API hashing is a common and pretty well documented technique, which dynamically resolves API functions. As a result instead of directly calling: CreateThread(*params); one would do something like: ptr_CreateThread = get_func_by_hash(kernel32.dll, 0x11fc85fd); ptr_CreateThread(*params); with 0x11fc85fd being a precalculated hash value of some sort for the string “CreateThread”. I will not go into greater details of the internals of this technique as i am not the most skilled person to do so and would probably give incorrect information. It is also pretty well documented all over the internet, but basically, and i hope i am not already giving wrong information: access the PEB from where get a list of loaded dll with their base address from the base dll address, it can loop over the dll exports list for each export, calculate the hash of the name if this hash matches the hash we’re looking for, returns the address of the function references: https://0xevilc0de.com/locating-dll-name-from-the-process-environment-block-peb/ https://www.ired.team/offensive-security/code-injection-process-injection/finding-kernel32-base-and-function-addresses-in-shellcode It’s fair to say it makes static analysis more complicated. From here we could reverse the hashing algorithm and apply it to all exports of common DLLs. That would give us a list of common API funtions with their hash and an easy way to find a function name from its hash. This is for example what FLARE-IDA is doing with shellcode_hashes. It’s great if there’s a lot of such obfuscated calls (note that you don’t need IDA to use it, you can just directly query the sqlite db). The function hashing algorithm used here looks like this: def func_hash(func_name): h = 0xf00df00d for c in func_name: h = ((h << 5 | h >> 0x1b) & 0xffffffff) ^ ord(c) return h In our case, there’s only a pair of such calls, so we can just go with dynamic analysis instead. Inside this function: // do something with a buffer if ( !sub_4011D0(&unk_414000, 160345, buffer, 320690, &Size) ) there’s such call: function_pointer = get_function_by_hash(v8, 0x3AC473D1); if ( function_pointer ) { if ( !function_pointer(258, a3, a4, a1, a2, a5) ) result = 1; } and inside the main function as first identified: // somehow get a function pointer if ( v7 && (function_pointer = get_function_by_hash(v7, 0xF4DD3DAD)) != 0 ) { v13 = 0; v12 = v8; // execute this function v10 = function_pointer(-1, &v13, 0, &v12, 0x103000, 0x40); So let’s run level2.exe in x32dbg and hope we’ll not get caught by some antidebug trick at this stage. The goal is here is to break after the calls to get_func_by_hash and examine EAX, which should contain the address of the resolved API function. The first call resolves to RtlDecompressBuffer The 2nd call to NtAllocateVirtualMemory We can even verify our reversed hash function: >>> hex(func_hash("RtlDecompressBuffer")) '0x3ac473d1' >>> hex(func_hash("NtAllocateVirtualMemory")) '0xf4dd3dad' If we put all the pieces together, the main function: decompresses a buffer reserves a new memory region with RWX permissions (0x40) copies the uncompress buffer to this region transfers execution in there memset(UncompressedBuffer, 0, 320690u); if ( !decompress_buffer(CompressedBuffer, 160345, UncompressedBuffer, 320690, &FinalUncompressedSize) ) return -3; [...] NtAllocateVirtualMemory(-1, &shellcode, 0, &FinalUncompressedSize, 0x103000, 0x40); memmove(shellcode, UncompressedBuffer, FinalUncompressedSize); shellcode(); 2.3 Unpacking the 2nd stage In order to unpack the second stage, we can break right before the control flow is transfered to the shellcode: if we inspect the memory at shellcode address, we notice that it starts with the magic MZ bytes and that there’s something which looks like a DOS stub, so it seems we’re getting a another PE file. From here we can right click on the shellcode address, select follow in memory map then dump memory to file The resulting file seems to be a valid PE: 2.4 Bonus: PE to Shellcode It’s interesting to note that the 2nd stage payload we dumped is a PE file, however execution is directly transfered to it, like it would be with a shellcode, not with a PE. It is normally not possible because a PE file must first go through a loader which will map memory, apply relocations etc… the executable code is not starting at offset 0. However the PE header have been modified so it can actually be executed. The CALL EBX jumps to a piece of code handling the relocations before transfering execution to the original PE entry point: as compared to a normal PE header: I suspect it’s the work of Hasherezade’s PE to Shellcode, the loader looks similar to this. Pretty neat trick. 2.5 Analyzing the 2nd stage Let’s now have a look at the dumped content. I will only mostly use already cleaned code from here. Again we can navigate from the entry point down to the main function: int __cdecl main(int argc, const char **argv, const char **envp) { void *v3; // eax void *dbg_check; // edi int v6; // esi v3 = operator new(1u); if ( v3 ) dbg_check = initialize_hashes_and_check_for_debugger(v3); else dbg_check = 0; if ( !dbg_check ) return -1; v6 = stage2_and_3_lets_go("\\\\.\\pipe\\crackme_pipe", 1337); __free(dbg_check); return v6; } Seeing the string "\\\\.\\pipe\\crackme_pipe" we know we’re on the right track, but let’s start with the first function call 2.6 Anti debug The first function is responsible for initializing a list of hashes and performing some antidebug checks: void *__thiscall initialize_hashes_and_check_for_debugger(void *this) { unsigned int *table_pointer; // esi int table_size; // edi void *v4; // ecx char v6[8]; // [esp+Ch] [ebp-98h] BYREF void *_this; // [esp+14h] [ebp-90h] int process_hash[34]; // [esp+18h] [ebp-8Ch] BYREF _this = this; table_pointer = process_hash; table_size = 34; process_hash[0] = 0xC81D63C9; process_hash[1] = 0x5B2839AC; process_hash[2] = 0x17DAD73F; process_hash[3] = 0x72C7241C; process_hash[4] = 0x58E483ED; process_hash[5] = 0x82134662; process_hash[6] = 0x34204667; process_hash[7] = 0x4CD53A71; process_hash[8] = 0x34206499; process_hash[9] = 0xFFDEB191; process_hash[10] = 0x7AC6410B; process_hash[11] = 0xEA3503AA; process_hash[12] = 0xCCFA2924; process_hash[13] = 0x3A09FFBC; process_hash[14] = 0x38EA0C1B; process_hash[15] = 0x58E479EC; process_hash[16] = 0x1B964E1A; process_hash[17] = 0x707F9D9A; process_hash[18] = 0xF5A79701; process_hash[19] = 0x9F5473B; process_hash[20] = 0xBA'''
