t expected a m but got a t (test) from our test file. We can use to that to bruteforce the flag char by char, by always checking the last xor sequence of the trace: #!/bin/bash # get these last 3 lines from the trace: # 0.001937 006981 - case OP_PUSH_8: r1.i=154 // yr_execute_code() # 0.001944 006981 - case OP_PUSH_8: r1.i=247 // yr_execute_code() # 0.001952 006981 - case OP_BITWISE_XOR: // yr_execute_code() # # extract the 2 values (154 and 247), xor them and convert to char get_next() { ./yara-4.2.3/yara -C flag.yarc test.txt 2>&1 | grep -B2 OP_BITWISE_XOR: | tail -3 \ | sed -n 's/.*r1.i=\([0-9]*\).*$/\1/p' | xargs \ | python -c "x,y=[int(_) for _ in input().split()]; print(chr(x^y), end='')" 2>/dev/null } rm -f test.txt # # get flag char by char # flag="" for x in $(seq 32); do c="`get_next`" flag="${flag}${c}" echo $flag > test.txt cat test.txt done running this script gives the flag: % sh bruteforce.sh f fl fla flag flag{ flag{m flag{m3 flag{m33 flag{m33t flag{m33t_ flag{m33t_m flag{m33t_me flag{m33t_me_ flag{m33t_me_1 flag{m33t_me_1n flag{m33t_me_1n_ flag{m33t_me_1n_7 flag{m33t_me_1n_7h flag{m33t_me_1n_7h3 flag{m33t_me_1n_7h3_ flag{m33t_me_1n_7h3_a flag{m33t_me_1n_7h3_ar flag{m33t_me_1n_7h3_ar3 flag{m33t_me_1n_7h3_ar3n flag{m33t_me_1n_7h3_ar3n4 flag{m33t_me_1n_7h3_ar3n4} flag{m33t_me_1n_7h3_ar3n4}} flag{m33t_me_1n_7h3_ar3n4}}} flag{m33t_me_1n_7h3_ar3n4}}}} flag{m33t_me_1n_7h3_ar3n4}}}}} flag{m33t_me_1n_7h3_ar3n4}}}}}} reversectf 1574 Words 2022-11-21 14:00 +0100'''
