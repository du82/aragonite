O............| | here? | | or here?| It loads fine in Ghidra: langage: MIPS:BE:32:default:default base address: 0x80008000 From there everything is smooth. even the decompiler works quite fine: 5. Quick Analysis For Fun 5.1 Decrypting Type 7 Passwords By default, passwords are in clear text in the config, however you can change that by using service password-encryption. I made a tool to decrypt/encrypt such passwords, which is available here. 5.2 web.wrp Since all strings references are correct, if we search for web.wrp we see it’s only referenced in a single function. Doesn’t take much work from here to figure the password for the rar file is bdcom312 % unrar x -pbdcom312 ../web.wrp UNRAR 6.10 beta 2 freeware Copyright (c) 1993-2021 Alexander Roshal Extracting from ../web.wrp Extracting cn.png OK Extracting en.png OK Extracting extipaclitem.asp OK Extracting footer.asp OK Extracting icon.png OK Extracting index.asp OK Extracting logo.asp OK Extracting logo.gif OK Extracting nav.png OK Extracting navbar.asp OK Extracting nav_style.css OK Extracting tabctrl.asp OK All OK 5.3 HTTP Server It uses GoAhead-Webs version 2.1.8 which is a popular http server for embedded devices. This particular version can be found here. There’s an ASP style server page. All ASP functions are registered like this: void ASP_register_all_functions(void) { ASP_register_one_func(s_aspGenerateWebTitleInfoJS_80ce14c8,FUN_809a4bd0); ASP_register_one_func(s_aspGenerateAboutInfoJS_80ce14e4,FUN_809a4de0); ASP_register_one_func(s_aspGenerateWebParamsJS_80ce14fc,FUN_8095d068); ASP_register_one_func(s_aspGenerateUserPrivilegeJS_80ce1514,FUN_8096c908); ASP_register_one_func(s_aspGenerateRingInterfaceInfoJS_80ce1530,FUN_8097f680); ASP_register_one_func(s_aspGenerateInterfaceInfoJS_80ce1550,FUN_80964138); ASP_register_one_func(s_aspGenerateSystemStateJS_80ce156c,FUN_8095d24c); ASP_register_one_func(s_aspGenerateRangeOfVariableJS_80ce1588,FUN_8095d700); ASP_register_one_func(s_aspGenerateUMJS_80ce15a8,FUN_8095d758); ASP_register_one_func(s_aspGenerateFunctionGobackUrlJS_80ce15b8,FUN_8095deb0); // [...] ASP_register_one_func(s_aspGenerateDhcpdIPBindInfoJS_80ce2e1c,FUN_80980c58); ASP_register_one_func(s_aspGenerateAccessRestrictInfoJS_80ce2e3c,FUN_8098c904); return; } The same with all forms actions: void http_register_all_goform_funcs(void) { http_register_one_goform_func(s_formTest_80cd9c5c,http_asp_formTest); http_register_one_goform_func(s_langform_80cd9c68,&LAB_8092cb9c); http_register_one_goform_func(s_WebAdminDelete_80cd9c74,&LAB_8092d4c4); http_register_one_goform_func(s_WebAdminConfig_80cd9c84,FUN_8092d790); http_register_one_goform_func(s_SysClockConfig_80cd9c94,&LAB_8092dca0); http_register_one_goform_func(s_BackupFirmware_80cd9ca4,FUN_8092e37c); http_register_one_goform_func(s_UpdateFirmware_80cd9cb4,FUN_8092e400); http_register_one_goform_func(s_BackupConfigFile_80cd9cc4,FUN_8092e540); http_register_one_goform_func(s_UpdateConfigFile_80cd9cd8,FUN_8092e5ac); // [...] http_register_one_goform_func(s_RestoreConfigFile_80cd9cec,FUN_8092e898); http_register_one_goform_func(s_RebootDevice_80cd9d00,FUN_8092e7cc); http_register_one_goform_func(s_CustomerinfoRestoreConfig_80cdaa68,FUN_8092f858); http_register_one_goform_func(s_AccessRestrictConfig_80cdaa84,&LAB_8093dc90); return; } The HTTP code is easy to follow, especially with the source code next to it… 6. Debugging It’s possible to enable core dump (core_dump enable) and read core files with show break (should you crash the switch :-): Switch#show break ========================================================= BreakNum: 1 Exception Type:2-TLB miss exception (load or instruction fetch) TaskID=826380b0, TaskName=HTTD date: 2021-8-25 time: 17:13:23 zero at v0 v1 00000000 811c0000 00000016 00000af2 a0 a1 a2 a3 80cdd9f4 00000000 8099d5fc 00000000 t0 t1 t2 t3 00000000 1000fc00 1000fc01 00005000 t4 t5 t6 t7 00000140 00000002 02beff43 00000000 s0 s1 s2 s3 80cdab10 00000000 0000003c 86b591f0 s4 s5 s6 s7 87a18b78 000000