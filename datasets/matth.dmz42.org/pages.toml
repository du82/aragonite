full_description = '''Nov 21, 2022 Square CTF 2022: Yet Another Reversing Activity This was one of the reversing challenge during Square CTF, i found it interesting and unusual as it involves YARA. 1. Description Supposedly this file can recognize a flag. But what could it be? 2. Introduction The file given is a compiled YARA rule. From their website: YARA is a tool aimed at (but not limited to) helping malware researchers to identify and classify malware samples. With YARA you can create descriptions of malware families (or whatever you want to describe) based on textual or binary patterns. Each description, a.k.a. rule, consists of a set of strings and a boolean expression which determine its logic. Let’s see an example: rule silent_banker : banker { meta: description = "This is just an example" threat_level = 3 in_the_wild = true strings: $a = {6A 40 68 00 30 00 00 6A 14 8D 91} $b = {8D 4D B0 2B C1 83 C0 27 99 6A 4E 59 F7 F9} $c = "UVODFRYSIHLNWPEJXQZAKCBGMT" condition: $a or $b or $c } The obvious goal of the challenge is to find a flag that matches the rule in flag.yarc. 3. Preparation I tried a YARA decompiler i found somewhere on github but it was kind of old and just didn’t work for the version of YARA used for this challenge, so i started to dig in the YARA source code. Compiled YARA rules apparently contain some kind of bytecode and fortunately for us, there’s some debug only waiting to be enabled. The function yr_execute_code() in libyara/exec.c has all of it: int yr_execute_code(YR_SCAN_CONTEXT* context) { // cut for brevity while (!stop) { // Read the opcode from the address indicated by the instruction pointer. opcode = *ip; // Advance the instruction pointer, which now points past the opcode. ip++; switch (opcode) { case OP_NOP: YR_DEBUG_FPRINTF(2, stderr, "- case OP_NOP: // %s()\n", __FUNCTION__); break; case OP_HALT: YR_DEBUG_FPRINTF(2, stderr, "- case OP_HALT: // %s()\n", __FUNCTION__); assert(stack.sp == 0); // When HALT is reached the stack should be empty. stop = true; break; // etc... } } After a few grep here in there, turning debug mode can be done by passing the --with-debug-verbose=8 to the configure script (8 is kind of arbitrary here). It’s best done by editing the build.sh script: #!/bin/sh ./bootstrap.sh ./configure --with-debug-verbose=8 make then rebuild YARA: yara-4.2.3% ./bootstrap.sh yara-4.2.3% ./build.sh 4. Solution Now that we have our debug build, we can try it on a random file. We know the flag has a format like flag{....}, so we can use it as a test input file: % echo "flag{test}" > test.txt % ./yara-4.2.3/yara -C flag.yarc test.txt 0.000000 006981 + yr_initialize() { 0.001316 006981 - hash__initialize() {} 0.001332 006981 } // yr_initialize() 0.001434 006981 - yr_scanner_create() {} 0.001485 006981 + yr_scanner_scan_mem(buffer=0x7f91d236d000 buffer_size=11) { 0.001492 006981 + yr_scanner_scan_mem_blocks() { 0.001505 006981 - _yr_get_first_block() {} = 0x7ffc0c7f9650 // default iterator; single memory block, blocking 0.001517 006981 + _yr_scanner_scan_mem_block(block_data=0x7f91d236d000 block->base=0x0 block->size=11) { 0.001532 006981 } = 0 AKA ERROR_SUCCESS 0 // _yr_scanner_scan_mem_block() 0.001542 006981 - _yr_get_next_block() {} = (nil) // default iterator; single memory block, blocking 0.001549 006981 - _yr_get_file_size() {} = 11 // default iterator; single memory block, blocking 0.001556 006981 + yr_execute_code() { 0.001576 006981 - case OP_INIT_RULE: // yr_execute_code() 0.001583 006981 - case OP_PUSH_8: r1.i=0 // yr_execute_code() 0.001590 006981 - case OP_INT8: // yr_execute_code() 0.001595 006981 - _yr_get_first_block() {} = 0x7ffc0c7f9650 // default iterator; single memory block, blocking 0.001604 006981 - case OP_PUSH_8: r1.i=95 // yr_execute_code() 0.001612 006981 - case OP_PUSH_8: r1.i=57 // yr_execute_code() 0.001619 006981 - case OP_BITWISE_XOR: // yr_execute_code() 0.001627 006981 - case OP_INT_EQ: // yr_execute_code() 0.001634 006981 - case OP_JFALSE: // yr_execute_