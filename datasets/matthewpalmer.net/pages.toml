["https://matthewpalmer.net/blog/2014/10/29/an-analysis-of-home-screen-layouts/index.html"]
title = "An Analysis of Home Screen Layouts — Matthew Palmer"
full_description = "As you could imagine, home screens are an act of balancing simplicity and speed. I’ve analysed a couple of the most common techniques. This is appealing because of its perfect symmetry on both axes. It features an extremely quick, constant time lookup for your top eight apps, then increasingly slower access to other apps—proportional to how many screenfuls you have. This approach becomes less practical on larger screen iPhones, where the top left corner touch is slowed by the necessary hand-shimmy. It’s about as minimal as a home screen can get. Minimal, but slow. Side swipes and folder-traversals are costly. I categorise these as an unbalanced extension of the Single Row Method. The N-Rows Method features—you guessed it—a couple of rows. For lower values of N, the time to access an app is high, with efficiency increasing over time as muscle memory develops. For N between 2 and 4, we achieve peak balance between minimalism and priority. This comes at the cost of symmetry and depth of access. Management of secondary and tertiary home screens becomes a big issue. This is a hugely cluttered look, balanced against the speed gained from having fewer side-swipes and folder traverals. Fewer swipes come at the cost of visually scanning for an app within a page—a frustrating time-waster. What’s more, you tend to lose track of an app’s spatial location when things are so full. This is the caveman of the bunch: utilitarian, but comes with a club draped over its shoulder. Folders are the hard disk of iOS home screens. Unless they’re for back up, or to hide stuff you’re never going to access, they’re just incredibly slow. You might as well search for something in Spotlight before you go swiping through folders. They do keep a home screen layout clean though. In-page ordering of apps is a mostly subjective topic. I think it feels faster to have your most used posts in the corners (6 and 6 Plus owners: beware). And some apps just feel better in certain spots—for me, it’s social networking (Combust, Tweetbot) in the top left corner, and Settings in the bottom right. That’s how it’s meant to be."
year_published = 2014
