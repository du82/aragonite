["https://matthewpalmer.net/blog/2022/11/21/best-launcher-app-macos-launchbar-alfred/index.html"]
title = "What is the best launcher app for macOS? — Matthew Palmer"
full_description = "Launcher apps help you do stuff on your Mac really quickly, without taking your hands off the keyboard. Hit a keyboard shortcut to open the launchbar, search for what you want, and hit return. They make complex tasks really easy. Then you use the launchbar to to open apps and folders, execute scripts, do calculations, search the web, and on and on… I personally use launcher apps for three things: opening apps, quickly navigating to folders in Finder, and opening my projects’ folders in specific apps like VS Code, Sublime Text, and iTerm. I built FastFolderFinder with those three tasks in mind. Plus it’s super fast and the fuzzy search is great. If you want something simple and easy, maybe try FastFolderFinder. Otherwise, use Alfred, LaunchBar, or Quicksilver. You’ll be able to find your files, launch apps, do calculations, search the web, and a lot more, all from one launchbar. The only downside is that there are a lot of settings to tweak. There are like 15 different panels within the “Features” section of the app’s preferences window. Check out the screenshot below. It’s a bit simpler to customise, a bit cheaper, but still offers a tonne of functionality and power. The only thing I didn’t like about it was that some of the “how it works” part of the design didn’t match my expectations for how an app should work. For example, hiding the launchbar takes multiple Esc keypresses, the text input box doesn’t have a cursor I-beam, and the default font feels off. Quicksilver is the oldest, most mature app launcher app on the Mac. For me, it basically defined the category for a lot of years. It’s free to download, has a bunch of powerful features, and can be fully customised to do anything you want. Its default UI style doesn»t quite “blend in” with the system, but the default theme choices are pretty good, and with the Powerpack it’s customisable enough to get it looking the way you want. And with the Powerpack you get Workflows, which are a feature that’s only available in Alfred."
