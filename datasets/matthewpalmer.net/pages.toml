["https://matthewpalmer.net/blog/2019/08/20/squarespace-affiliate-marketing-program-guide/index.html"]
title = "How to Set Up an Affiliate Marketing Program on Squarespace — Matthew Palmer"
full_description = "In this guide, we’re going to set up a complete Squarespace affiliate marketing program using Peach’s. This tutorial takes about ten minutes – after that, you’ll have your affiliate program up and running. Add bloggers, Instagrammers, YouTubes, and authors to your affiliate program. They’ll share your store with their audience. You’ll pay them a commission on any sales. Affiliate programs let you dramatically increase the reach of your store without buying expensive ads or running complicated marketing programs. Say you know an influential person in your industry – a popular blogger, an Instagram personality, etc. You want to reward that person for sharing your product in a way that’s incredibly beneficial to you both. But neither of you really know how much you should pay for a sponsored post (and sponsored posts are risky… what if they’ve bought fake followers?) Instead, you add them to your affiliate program, and offer them a commission on any sales they send to you. They share your products with their followers, their followers buy your products, you reward the affiliate. Affiliate programs are well-suited to most types of businesses. In particular, industries like fashion, beauty, technology, food, and lifestyle brands. The key question to ask is this: does your industry have highly influential people who can organically share your products with their audience? Affiliate programs are when you pay the affiliate a commission based on referred sales to your store. Say, you pay them 20% of sales of all the customers they send to you. Referral programs are more of a friend-to-friend exchange. You can offer a customer a discount off their next order if they tell a friend about your store. This often looks like “Send a friend $10 off, and you’ll get $10 off your next order.” You typically wouldn’t pay a referrer a percentage commission in a referral program. (Would a referrer really be encouraged by a 10% commission on a $25 order?) These are much more natural, small-scale interactions between regular people. Anyone can sign up for the referral program – they don’t need to be able to reach a large audience… they just send a message to their friends."
year_published = 2020
