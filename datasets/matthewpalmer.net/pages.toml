["https://matthewpalmer.net/blog/2014/02/19/how-to-deploy-node-js-apps-on-digitalocean-with-dokku/index.html"]
title = "How to Deploy Node.js Apps on DigitalOcean with Dokku — Matthew Palmer"
full_description = "DigitalOcean is a great place to host your web apps, being cheaper than other, managed services like Nodejitsu or Heroku. It has a $5/month plan, and using the DigitalOcean promo code OMGSSD10 gives you $10 credit (two months) for free to try it out. This might expire, so Google for promo codes if it has. Nodejitsu and Heroku justify their higher pricetag by offering better support and ease of deployment—the former is hard to gauge, but the complexities of the latter, when using DigitalOcean, can be mitigated thanks to Dokku. Dokku is an awesome abstraction of Docker. Basically, Dokku provides a better interface to app deployment, comparable to the offerings of Heroku and Nodejitsu. It works for any VPS, but I like DigitalOcean. Here is a guide on how to set up and deploy your first application to DigitalOcean using Dokku. Add a credit card—I would love to not have to do this, but they don’t charge you. Don’t forget to use the free promo code. Click SSH Keys in the sidebar. Setting up an SSH key first isn’t mandatory, but it’s better in the long run. Generate an SSH key. Note: I didn’t use the default /Users/username/.ssh/id_rsa because I prefer to name my SSH keys more explicitly. I recommend saving it to /Users/username/.ssh/id_rsa_digitalocean_appname—the rest of the guide assumes the keys are saved to this location. Click Add SSH Key at the top of the DigitalOcean SSH Key page. Paste the contents in. Name it something explicit. SSH into your new Droplet. Your IP address is available from the DigitalOcean website; it’s in the top information bar. If prompted, enter the password emailed to you. You might have to have your password reset and then emailed to you. Do this from the Access tab in the main DigitalOcean web interface. Everything should be configured properly by default, but if it isn’t, you can change your settings here. Hit Finish Set up. Create a garden-variety Node.js application, such as the Hello World example on the Node.js homepage. You can also use your own."
year_published = 2014
