["https://matthewpalmer.net/blog/2013/10/06/my-problem-with-the-breaking-bad-finale/index.html"]
title = "My Problem With the Breaking Bad Finale — Matthew Palmer"
full_description = "My primary issue with the ending of Breaking Bad, my second favourite show on TV, is the dissonance between the final episode and the rest of season five. Throughout the last few seasons, we’ve seen Walt transform into a monster. A monster whom we are not meant to emulate. For nearly two whole seasons, Vince Gilligan has been convincing us of the dangers of hubris, greed and vanity. In the final episode, Walt wins. Walt achieves a significant majority of the goals he set at the outset: His only original goal which was not fulfilled was having his family not hate him, and to have the cancer catch up to him before the police did. While not all of Walt’s money reaches his family, he wanted enough to make them comfortable. Eleven million dollars sates all of those desires. This proud, murderous, poisoner, abuser of children, self-deifying, monster wins at the end of the series. Gilligan, again and again, has warned us not to follow Walt’s path. And yet there are no significant, lasting repercussions for him. The high school chemistry teacher has transformed into an empirical megalomaniac and he has not faced any consequences. Those whom he loves have suffered, but what’s Gilligan’s message there? Don’t be associated with meth kingpins? Seeing his family destroyed is not a significant consequence for Walt, just as they weren’t the sole contributors to his initial motivations; he said so himself. Both his family’s and Jesse’s ultimate freedom were orchestrated by Walt. Again, Walt gets what he wants. The villain got what he wanted. In the finale, Gilligan inadvertently suggests that doing awful things brings the consequences one wants. My issue is not solely with the finale, which was a strong episode, but the way it fits with the rest of the series, in which Gilligan has portrayed that Walt’s hubris was his hamartia. Walt’s pride was certainly his fatal flaw, but he experienced no downfall at the end of the series. The penultimate episode, in which Walt sinks deeply, is discordant with the finale, in which Walt rises. Despite his immoral actions, Walt will become the greatest meth cook in history, which is exactly what he wanted. All of Gilligan’s warnings are nullified by that fact."
