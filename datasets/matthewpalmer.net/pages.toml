["https://matthewpalmer.net/blog/2014/01/19/remap-keyboard-keys-caps-lock-os-x-mavericks/index.html"]
title = "Remapping Keyboard Keys on Mac OS X Mavericks — Matthew Palmer"
full_description = "Here’s how to remap any of your keyboard keys to any combination of keys on Mac OS X. Initially, I wanted to remap the Caps Lock key to Command+R for two reasons: Here are the steps and workarounds I used to get what I wanted. I’ve essentially remapped the Insert, Home, Page Up, Delete, End and Page Down, and Caps Lock keys into a useful macro block. Not exactly perfect, right? There’s a very limited selection of keys you can remap to. Don’t worry, with a little .xml hacking we can get it to do what we want (in a way). For those of you who are happy to just use it like this, don’t worry about the next bit. For this section, we are going to introduce user-defined key remapping. So, eventually, we worked out a way to remap any key we want to another key or combination of keys. It works really well, and it’s probably good for RSI or something. At the very least, we’ve satisfied our laziness. For more information on the full power of the private.xml file, check out the reference manual (thanks to @jnlevitan for the tip)."
