["https://matthewpalmer.net/blog/2017/12/01/emoji-bullet-list-launch/index.html"]
title = "Emoji Bullet List ⚡ Behind the Scenes — Matthew Palmer"
full_description = "Our @buffer Social blog numbers for October:🖥️ 1,431,160 sessions👀 1,702,867 pageviews🔍 80% search traffic🕑 4m 24s average time on page🏀 12% inverse bounce rate💰 1,641 signups directly from the blogP.S. What else would you want me to share? Painful to write, though. Like, I know emoji better than most, and I struggle to quickly pick out the right emoji to go with each line. I built Emoji Bullet List to make creating emoji dot point lists really easy. Just copy in your list, hit the big “Emojify” button, quickly choose from the suggested emoji if the first suggestion doesn’t fit your needs, and hit “Copy” to get an emojified list back. Too easy! This idea originated as a nice-to-have feature for Rocket, but I realised I could use Rocket’s emoji keyword/phrase dataset to build this into a web app. More people can access it, it’s a bit easier to use, and hopefully a few more people will find Rocket because of it. I added unremarkable-yet-incredibly-useful logging with ten lines of JavaScript that lets me see in detail how (anonymised) users are interacting with the app. (This is great for low volume apps, but I don’t do this for services running at scale.) There are a bunch of fancier ways using external services or adding full user tracking, but honestly there’s nothing more fun than tailing your logs in realtime while someone is successful with your app. I even saw one person come in, play around with the app for a minute, and click on the link to my Twitter profile. I opened up Twitter, and 30 seconds later I had a tweet from them about how much they liked the app 😁. (As a side note, you’ll notice attackers and bots trying to crawl your site for security vulnerabilities. /manager/assets/modext/modx.jsgrps-min.js, /media/system/js/core.js, /privacy_policy.php (why!?), /a2billing/common/javascript/misc.js, are some common ones.) I’ve got a dead simple deployment strategy that’s great for small apps. Put this in a file called node-simple-redeploy.sh (or whatever) in your project."
