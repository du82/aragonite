["https://matthewpalmer.net/blog/2017/06/18/anker-powercore-20100-macbook-pro-2016/index.html"]
title = "Anker Battery Pack for Macbook Pro Review – Anker PowerCore 20100 — Matthew Palmer"
full_description = "I’m travelling around for a while, and I’ve been on the hunt for a good way to give my 13-inch 2016 MacBook Pro (Touch Bar edition) a bit of extra charge. There’s information scattered around the internet on what works and what doesn’t, and I wanted to collect it here so that you don’t have to do as much research as I did. The short story: the Anker PowerCore+ 20100 with USB-C is the best way to charge a 2016 MacBook Pro using an external battery pack. I’ve used the Anker for about four months now while travelling around the US. It’s survived camping trips to Washington and Yellowstone, domestic and international flights (N.B. it has to go in your carry-on), buses, trains, hostels in Nashville and hikes in Austin. Here’s what I’ve found: It takes a long time to refill the battery on the Anker brick. At least overnight if you use the regular MacBook charger. The Anker USB-C Rapid Charger improves the charge time here if you need it (which you do). The “user interface” on the thing sucks. If you want to charge something, press the button on the front to make the lights come on. Then plug in your device. If you want to charge the brick itself, plug it in and maybe press the button. (I haven’t figured this out yet, after four months.) It holds about a MacBook Pro’s worth of battery charge when full. This is at least six full iPhone 5 charges (I actually ended up needing to charge my phone way more often than my laptop when I was travelling, so this was super handy) Overall, I highly recommend the Anker power brick. It’s reassuring to know you always have a power source when you need it. The Anker does the job it’s meant to, holds enough power, is well built, and has saved me more than a handful of times."
