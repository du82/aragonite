["https://matthewpalmer.net/blog/2013/04/16/mad-men-season-6-episode-3-analysis-and-review/index.html"]
title = "Mad Men Season 6 Episode 3 Analysis — Matthew Palmer"
full_description = "I thought this was, as always for Mad Men, a strong episode. The most prevalent themes present were the notions of false love and prostitution, nature and betrayal. Nature is a new addition into the Mad Men fold, and I’m not quite sure of the deeper meaning. Mostly, however, these themes are facades - a thin veil of makeup for the characters’ inner blemishes. This has been a consistent part of Don’s character throughout the series, but as we see Pete and Peggy grow to become more like Don, they will replicate his subterfuge. I feel the transformation of Pete and Peggy into different aspects of Don will be a major plot point for this season, while Don’s decay will become increasingly prevalent. Firstly, we see Pete and Trudy hosting a dinner party. Both are flirting, much like the Don and Betty situation of a few seasons prior. Both seem superficially happy during these scenes, but as soon as the front door shuts, they let their frustrations out. Trudy is unhappy with their guests, but adopted a ‘housewife’ attitude so as to please the guests. Pete is generally unhappy. What does Pete want? What event will make him content? Where will he find happiness? “A temporary bandage on a permanent wound” is the perfect analysis of Pete’s character, but whence did this wound come? This sense of inadequacy is delineated by the malfunctioning remote, which, like the leaky faucet, represents Pete’s inability to control his life. Nature makes its first appearance as well, with a pastel, hideously designed representation of nature being printed on the couch, and a gilded flower entwining the lamp behind Pete. Pete finds himself trapped between false-nature, a suburban household and a desire to be in the city. We see this theme of nature again in the episode, so if you think of any good meaning behind it, please let me know. Next, we see Don in the elevator with Dr. Al Rosen. Elevators are becoming increasingly noticeable in Mad Men; I think Don will get caught cheating in an elevator or reveal himself in the elevator. A fatal blunder will cause him to metaphorically plummet down an empty shaft as was alluded to last season."
year_published = 2013
