["https://matthewpalmer.net/blog/2018/09/28/top-free-countdown-timer-apps-mac/index.html"]
title = "Top 4 Free Timer Apps for Mac — Matthew Palmer"
full_description = "Maybe you’re looking for the best free Pomodoro timer, a great minimalist countdown clock, or a productivity time tracker. Whenever I’m working, I’ve got a timer running. It’s my #1 tip for staying focused and getting a lot done in a short amount of time. Obvious disclaimer – I built Horo. Why did I build it? I believe that if starting a timer takes you more than a second, your timer app sucks. Horo is a simple, easy app that lets you type what time you want (“1m 30s”, “1.5h”), hit Return, and then your timer starts. It’s neat, it’s free, and it shows the timer in the menu bar so you can glance back at it easily. Be Focused is a great, full-featured Pomodoro-style timer. To change the time interval of an individual timer, you have to change the presets in the app’s preferences. This can be a bit annoying, but the benefit is that the app has awesome tracking of the number of times you’ve completed a timer. This, and the built- in break tracking, makes Be Focused a great work timer. If you find yourself using the same four or five time intervals over and over again, this is the app for you. The UI’s looking a little old, but the app itself works great. The Pro version ($2.99) gives you more formatting options for the timer in the menu bar, and you can set presets."
