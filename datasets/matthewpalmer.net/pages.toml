["https://matthewpalmer.net/blog/2014/01/19/my-iphone-home-screen-layout-apps/index.html"]
title = "My Somewhat Unconventional iPhone Home Screen — Matthew Palmer"
full_description = "My iPhone set-up attempts to maintain two axes of symmetry: horizontal symmetry is achieved by restricting icons to three screens, with my centre screen as a primary default view, and its adjacent screens on either side identically laid out; I get vertical symmetry on the centre screen, but have to acquiesce to efficiency on the other screens, which have two rows on top and one in the tray. On the fourth screen go apps that I’m developing, which creates an imbalance, but can’t be any other way. My ‘home’ screen—that is, my most visited screen—isn’t the first page of the iOS home screen list; I use the middle screen of three app pages, because it gives me fast access to other pages of apps, without feeling claustrophobic. It has never made sense to me why power users have a linear screen ranking (i.e. most important apps on the first screen, second tier on the second screen, and so on), rather than having the centre screen as the top rung, and branching off from there, which minimises horizontal swipes to access your least-used apps. Top-left, my premiere app slot, goes to Tweetbot, because I use it slightly more often than anything else, and it has a lovely icon. I resisted buying the old version, mostly because I thought it was over-designed. I still have problems with the current version: I don’t understand why there needs to be a search bar at the top of each scroll view in the app. The app’s great in almost every other way. I can’t wait for an iPad version. Instagram, which needs an updated icon, comes next, followed by Snapchat and Clear. I use Clear for short notes, reminders and obviously todos; Downcast and Clear battle for the top-right slot regularly, but when I need to access Clear, I need to do it quickly. I generally open Downcast in a much more recumbent position. It’s a shame that I have to use Clear Plus in order to have sync and parity between my iPhone and iPad, but that’s an unfortunate consequence of Realmac splitting their app versions."
