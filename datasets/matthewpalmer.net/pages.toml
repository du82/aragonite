["https://matthewpalmer.net/blog/2019/03/11/free-squarespace-referral-program/index.html"]
title = "How to Set Up a Squarespace Referral Program — Matthew Palmer"
full_description = "This guide is going to teach you how to set up a referral program (like “refer a friend and get $20 off your next order”) for your Squarespace store. (What’s the difference between a referral program and an affiliate program? A referral program lets regular customers share your store with their friends to earn rewards. An affiliate program lets influential people earn commissions from sharing your store with their large audience.) Studies have shown that 9 out of 10 people trust recommendations from their friends above any other source when it comes to making purchases. So if you can get one of your customers to recommend a product to their friend, odds are pretty good I’m a small business owner, so I know first-hand that you’re probably not in business for the drive-by customers. What keeps you going are the people who come back, who love your products, and who rave about you. You need to reward people like that! First rule of economics is that people respond to incentives – so it makes sense that you should thank and reward your biggest fans. Hands up – who’s burnt some money trying out AdWords? Or – shudders – you paid for a TV ad. Outdated. Modern businesses with modern products need modern marketing. There’s a reason Uber, Dropbox, and fast growing tech companies have refer-a-friend programs. They work. They’re a million times cheaper, and a million times more effective than buying ads. We’re going to use a Peach’s Squarespace referral program to set this up. Peach’s is a platform that plugs right in to your Squarespace site and adds refer-a-friend functionality. This whole thing takes you about 10 minutes, and after that you’ll have a working refer-a-friend program. After you sign up, the site will take you through to the form where you create your referral program. I usually set my referral programs up like “Reward customers who refer a friend with a $20 discount on their next order of $30 or more.” The other popular option for stores that want to grow more quickly is used by companies like Uber and American Express."
year_published = 2019
