["https://matthewpalmer.net/fastfolderfinder"]
title = "FastFolderFinder – A lightning-fast launchbar for apps and folders on your Mac"
description = "FastFolderFinder is a Mac app that gives you a lightning-fast fuzzy search bar to quickly find and open apps and folders on your Mac"
full_description = "FastFolderFinder is a Mac app that gives you a lightning-fast fuzzy search bar to quickly launch apps and find and open folders on your Mac. It helps you jump around your Mac’s filesystem faster, without taking your hands off the keyboard. It’s way faster than having to click through your entire directory structure in Finder. Hit your FastFolderFinder keyboard shortcut (like ⇧-⌘-O, though you can customise it), and FastFolderFinder’s launchbar will appear. From there, search for the folder or app you want to open. Hit Return to open your result – or tweak FastFolderFinder to launch any app with a custom shortcut action! FastFolderFinder makes it way faster to navigate your Mac’s folders and apps. You don’t have to futz around clicking through Finder or use the unreliable Finder search behavior. Plus, you can set up custom shortcut actions within FastFolderFinder. Open folders straight from FastFolderFinder into your code editor, terminal, copy the result’s path, or run bash scripts. Yes! Simply add “/Applications” and “/System/Applications” to your Search Locations and apps will be included in your search results. Spotlight — I don’t know if it’s just me, but lately Spotlight a) has gotten really slow, and b) doesn’t have good file or folder search. FastFolderFinder is way better at that. LaunchBar/Alfred/Quicksilver — These are great general purpose launcher apps with a tonne of functionality and tweakability. For me, it’s too much tweaking. I just want find my folders and launch apps quickly. So I built FastFolderFinder. You can tweak FastFolderFinder to suit your Mac, but to get started I use and recommend the following preferences: Folders > Search Locations /Users/your_username (your home directory) /Applications (to launch apps quickly) /System/Applications (for other system apps) Shortcut Actions Return – Open in Default App Command-Return – Show Parent in Finder Option-Return – Copy Path to Clipboard Shift-Return – Open Application with Visual Studio Code Option-Shift-Return – Open Application with Terminal"
