["https://matthewpalmer.net/blog/2020/09/29/how-to-set-up-milestone-referral-program-prelaunch-squarespace/index.html"]
title = "How to set up a subscriber milestone referral program on Squarespace to grow your mailing list — Matthew Palmer"
full_description = "Want to get more email subscribers for your site, store, or service? Generate positive word of mouth on social media? Spread organically through your biggest fans’ social networks? If so, you should run a milestone referral program. Encourage people to sign up for your email newsletter, and give them rewards for any friends they get to sign up as well. In this guide, we’re going to set up a complete milestone referral marketing program using Peach’s. A subscriber milestone referral program lets you give rewards to people who refer their friends to sign up for your mailing list or email newsletter. It’s often used for products that are pre-launch. You’ll create a landing page for your product, connect a referral program, and let people earn early access, discounts, or merch for telling their friends about you. When you’re pre-launch, a subscriber milestone referral program helps you build excitement and viral interest in your products. It lets customers get a sneak peek into your business, and sign up to be notified when your product is available. If you’ve already got a great online store, but you want to do more email marketing, a newsletter milestone referral program will help you grow your mailing list much faster than traditional methods. Since you reward people for sharing as well as signing up, you’ll reach many more people than just your site’s regular visitors. And email marketing is one of the most underrated marketing methods. It’s cheap, super effective, and high quality – way better than running expensive ads on social media. You just need to have a solid mailing list to send to! In this guide, we’ll use Squarespace. (But Peach’s works with any website builder! You’ll just need to translate them for your platform.) What rewards will get people excited about your products and your brand? What’s a cool enough reward to make people want to tell their friends about you? For Harry’s (the company that makes razors and shaving products), they had four milestones in their program. When someone referred five friends, they’d get free shave cream. At 10 and 25 referrals, subscribers got a free razor. And at 50 referrals, they got free shaving for a year."
