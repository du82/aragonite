["https://matthewpalmer.net/blog/2014/10/11/maybe-centralised-is-better/index.html"]
title = "Maybe Centralised is Better — Matthew Palmer"
full_description = "Maybe the reason decentralised networks, like Tent, haven’t taken off is because they just aren’t as good. Since centralised networks have risen, decentralised ones have not. All of the major decentralised networks we have today are from before the modern era of the social internet. Maybe the point of a decentralised network is that there doesn’t need to be one. But who’s the person working late to make it better? Who really, truly has a vested interested, but is also non-partisan? An interesting parallel is Tweetbot 3’s iOS 8 update. They swapped the ‘Send to Instapaper’ button for a default iOS Share Sheet. This is great, and the right thing to do by all accounts, except for one thing: sending an article to Instapaper now blocks the UI with a transparent overlay. It’s no one’s fault—Instapaper has to do it and Tweetbot can’t stop them. But because no one was in charge it sort of just happened. And the user has a worse experience as a result. This concerns me. I love the idea of decentralised networks, and there are so many advantages, but the fact that there aren’t any new, interesting ones is worrying. What else is the cause?"
year_published = 2014
