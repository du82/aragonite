["https://matthewpalmer.net/blog/2019/01/10/free-refer-a-friend-program-gumroad/index.html"]
title = "Set Up a Free Refer-a-Friend Program on Gumroad — Matthew Palmer"
full_description = "Uber, Dropbox, and a zillion other companies run promotions like “Tell a friend about us and get a $5 credit when they sign up.” But referral programs are very difficult to create and maintain yourself, especially if you’re not a software developer. Luckily, if you sell things through Gumroad (or a bunch of other services), Peach’s free refer-a-friend software lets you set one up. It takes like ten minutes. It’s free. It increases sales. I wrote a book about Kubernetes that I sell through Gumroad, and I wanted to set up a refer-a-friend program. Here’s how I did it. Open up your product in Gumroad, navigate to the checkout configuration, flip the little toggle that says ‘Preview’, and under ‘More information’ add the field for ‘Referral Code’ On the next step, enter the URL of the page where you sell your product and how many friends need to be referred for your customer to get rewarded. On the last step, authorize Peach’s to use your Gumroad account. It uses this to create coupon codes and track who has been referred. Somewhere on your site (for example) paste in the form embed code from the Peach’s console. This code loads the form that people will use to sign up for your refer-a-friend system. Once you’re done, reload the page where you added the code. Your page will get a fancy new form where people can sign up for a refer-a-friend program. In the Peach’s console, choose which product you want to set up the refer-a-friend program for, select the custom field you created in step 1, and enter your discount. Then click ‘Save’. Two, copy and paste the code from the Peach’s console to your site, right below your Gumroad checkout button. After that’s done, fill out your form from step 4 where people sign up to your refer-a-friend program. Grab the link that’s generated, and visit it. Then start the Gumroad checkout process. You’ll see a neat little pop up that you’ve been referred by a friend. Back in the Peach’s settings screen, click the button that says ‘Send Test Email’. This will send you an email with a link to purchase your product with the discount applied. Click that link and check everything looks good!"
