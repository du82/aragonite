title = "Start With the Go Standard Library · Matthew Sanabria"
description = "Matthew Sanabria's website."
full_description = 'Matthew Sanabria/ Posts/ Start With the Go Standard Library/ Start With the Go Standard Library 7 February 2024·Updated: 23 December 2024·14 mins Table of Contents What is a Standard Library? Why Start With the Go Standard Library? The Go Standard Library vs. Third-Party Packages What Logger Should I Use? What Web Framework Should I Use? What Object–Relational Mapping (ORM) Should I Use? Final Thoughts When starting a project, new Gophers often ask the following questions. What logger should I use? What web framework should I use? What object–relational mapping (ORM) should I use? These questions are well-intentioned but they all miss a key aspect about Go. Go has a great standard library. Let’s understand why. Note: Don’t forget to initialize a Go module in your current working directory using go mod init if you want to follow along. What is a Standard Library? #A standard library is library of packages that are included with a programming language. These packages can be used without downloading additional source code. The following program prints Hello, world! in bold, red text using the fmt package from the Go standard library. Excuse the overly verbose comments about terminal escape sequences. This example was updated to address feedback on lobste.rs that I ended up agreeing with. Thank you, dhnaranjo! package main import ( "fmt" // Imported from the Go standard library. ) func main() { // Print "Hello, world!" using bold, red text using terminal escape // sequences. Terminal escape sequences start with `Esc[` and end with `m`. // `\033` is the octal representation for Esc. Styles within a sequence are // delimited with `;`. The normal pattern is to enable some styles with an // escape sequence, print your text with those styles, and disable the // styles with another escape sequence. fmt.Println("\033[1;31mHello, world!\033[0m") // │ │ │ // │ │ └── Reset all styles. // │ └─────────────────────── Use normal red foreground color. // └───────────────────────── Use bold font. } You can run this program and see the bold, red Hello, world! text. > go run . Hello, world! Contrast this with the following program that uses the third-party github.com/fatih/color package. This code is much simpler as the complexity of terminal escape sequences has been abstracted into the github.com/fatih/color package. package main import ( "github.com/fatih/color" // Imported from the downloaded source code. ) func main() { // Prints `Hello, world!` in bold, red text. c := color.New(color.FgRed).Add(color.Bold) c.Println("Hello, world!") } Even though the github.com/fatih/color package gave us simpler code for terminal escape sequences, its source code is not in the Go standard library. You must download its source code and all its dependencies before it can be used. > go run . go: downloading github.com/fatih/color v1.16.0 go: downloading github.com/mattn/go-colorable v0.1.13 go: downloading github.com/mattn/go-isatty v0.0.20 go: downloading golang.org/x/sys v0.14.0 Hello, world! Documentation for both the Go standard library and third-party packages can be found at pkg.go.dev. Standard library: pkg.go.dev/std Third-party packages: pkg.go.dev Why Start With the Go Standard Library? #When deciding whether to use the Go standard library or a third-party package, one might think the decision comes down to the quality of the package. While quality is a factor, generally speaking, there isn’t much of a quality difference between the Go standard library and well-written, well-maintained third-party packages. Determining the quality of a package can be both objective and subjective depending on the metric being measured. Luckily there are many resources out there to help you, including the popular OpenSSF Scorecard. Quality aside, I recommend new Gophers start with the Go standard library for the following reasons. Stability - The stability of the Go standard library is in its name— standard. The Go standard library exposes a standard set of APIs that rarely change, making them a great candidate for building higher level abstractions. Combine that with Go’s Backward Compatibility and the stability of the Go standard library really shines. Comprehensive - The Go standard library has packages for almost anything. There are packages for logging, interacting with the OS, communicating over the network, and much more. The Go standard library also exposes interfaces such as io.Reader that programs can implement to provide custom behavior that’s compatible with standard library APIs. Maintainability - The best code is the code that you can use but don’t have to maintain. The Go standard library is maintained by engineers that are paid to work on Go. This means you don’t have to worry about a package in the standard library being out of date or incompatible with your version of Go. No Dependencies - You don’t have to download additional source code to use the Go standard library, it’s already there with your installation of Go. This means fewer dependencies in your code which can lead to quicker CI/CD build times and fewer security vulnerabilities. Reduced Lock-In - Many third-party packages maintain API compatibility with the Go standard library. Others don’t. Using the Go standard library can make it easier to migrate from the standard library to compatible third-party packages and vice versa. The Go Standard Library vs. Third-Party Packages #Now that we have a better understanding of the Go standard library let’s answer some of those questions that new Gophers tend to ask. We’ll use a question-driven approach, comparing the Go standard library to third-party packages. What Logger Should I Use? #Standard library: log log/slog Third-party packages: github.com/hashicorp/go-hclog github.com/sirupsen/logrus go.uber.org/zap Prior to Go 1.21 the standard library only had the log package, which did not support log levels or structured logging. For those unfamiliar, structured logging is the ability to log information in a machine-readable format that can be parsed by your favorite log aggregation tool. Usually structured logs are emitted using JSON syntax and contain key-value pairs of information. Since the log package doesn’t support log levels or structured logging, third-party packages became the primary way to log in Go. In Go 1.21, the log/slog package was introduced with support for log levels and structured logging. I recommend new Gophers start with log/slog for their logging needs. This code example shows the API differences between log, log/slog, and go.uber.org/zap. package main import ( "log" "log/slog" "os" "go.uber.org/zap" ) const ( // Simulate information from an HTTP request. method = "GET" path = "/api/v1/users" ) func main() { // log stdLog := log.New(os.Stdout, "", log.LstdFlags) stdLog.Printf("request received: method=%s path=%s", method, path) // log/slog stdSLog := slog.New(slog.NewJSONHandler(os.Stdout, &slog.HandlerOptions{})) stdSLog.Info("request received:", "method", method, "path", path, ) // go.uber.org/zap zapLogger, _ := zap.NewProduction() defer zapLogger.Sync() zapLogger.Info("request received:", zap.String("method", method), zap.String("path", path), ) } This code example highlights the log package’s lack of support for key-value pairs when compared to log/slog and go.uber.org/zap. Running the code shows how different the log output is from the log/slog and go.uber.org/zap output. > go run . 2024/02/04 22:20:03 request received: method=GET path=/api/v1/users {"time":"2024-02-04T22:20:03.140393797-05:00","level":"INFO","msg":"request received:","method":"GET","path":"/api/v1/users"} {"level":"info","ts":1707103203.1404333,"caller":"helloworld/main.go:32","msg":"request received:","method":"GET","path":"/api/v1/users"} What Web Framework Should I Use? #Standard library: net/http Third-party packages: github.com/dimfeld/httptreemux github.com/gin-gonic/gin github.com/go-chi/chi github.com/gobuffalo/buffalo github.com/gofiber/fiber github.com/gorilla/mux github.com/labstack/echo This question can be difficult to answer, especially for engineers coming from web frameworks like Next.js, Laravel, Django, Ruby on Rails, etc. Go doesn’t have a web framework as extensive as those from other languages. The closest you’ll find is github.com/gobuffalo/buffalo, but even that isn’t as featureful as something like Ruby on Rails. Instead of a web framework, Go encourages you to choose an HTTP multiplexer and extend it as needed. That’s why the list of third-party packages above is primarily filled with HTTP multiplexers instead of web frameworks. Want to use net/http with React? Sure thing! How about github.com/go-chi/chi with Go templates? Go for it! The truth is it doesn’t matter much what HTTP multiplexer you use, so choose the one that you’re most familiar with and can get help with when needed. I recommend new Gophers running Go 1.22 or later start with net/http for their HTTP multiplexing needs. In Go 1.22, the net/http package received major quality of life updates such as the ability to register an HTTP handler with an HTTP method and the ability to use and retrieve URL path variables. These updates make the net/http package an attractive choice compared third-party packages. Prior to Go 1.22, the net/http package didn’t support these features, making third-party packages the popular route (pun intended) for Gophers. If you’re working on a project that isn’t on Go 1.22 or later then I recommend choosing a third-party package for your HTTP multiplexing needs. I personally like github.com/go-chi/chi, but github.com/labstack/echo and github.com/gofiber/fiber are also popular choices, especially for those familiar with Express. This code example shows the API differences between Go 1.22’s net/http, github.com/go-chi/chi, and github.com/labstack/echo. package main import ( "encoding/json" "fmt" "net/http" "os" "os/signal" "syscall" "github.com/go-chi/chi" "github.com/labstack/echo" ) type Response struct { ID string `json:"id"` HTTPMux string `json:"http_mux"` } func main() { // net/http stdMux := http.NewServeMux() stdMux.HandleFunc("GET /api/v1/{id}", func(w http.ResponseWriter, r *http.Request) { id := r.PathValue("id") resp := Response{ID: id, HTTPMux: "net/http"} if err := json.NewEncoder(w).Encode(resp); err != nil { // Handle error. } }) // github.com/go-chi/chi chiMux := chi.NewMux() chiMux.Get("/api/v1/{id}", func(w http.ResponseWriter, r *http.Request) { id := chi.URLParam(r, "id") resp := Response{ID: id, HTTPMux: "github.com/go-chi/chi"} if err := json.NewEncoder(w).Encode(resp); err != nil { // Handle error. } }) // github.com/labstack/echo echoMux := echo.New() echoMux.GET("/api/v1/:id", func(ctx echo.Context) error { id := ctx.Param("id") resp := Response{ID: id, HTTPMux: "github.com/labstack/echo"} return ctx.JSON(http.StatusOK, resp) }) // Start all three HTTP multiplexers asynchronously. for i, mux := range []http.Handler{stdMux, chiMux, echoMux} { go func(portOffset int, mux http.Handler) { server := http.Server{ Addr: fmt.Sprintf(":%d", 3000+portOffset), Handler: mux, } fmt.Printf("Listening on %s...\n", server.Addr) _ = server.ListenAndServe() }(i, mux) } shutdown := make(chan os.Signal, 1) signal.Notify(shutdown, syscall.SIGTERM, syscall.SIGINT) fmt.Println("Press Ctrl+C to stop.") <-shutdown } I know that’s a lot of code, but I wanted you to see that there are minimal API differences across packages. They all support URL path variables and follow the same basic structure to create HTTP handlers. The noteworthy differences are: net/http registers an HTTP handler with an HTTP method by specifying the HTTP method within HandleFunc (e.g., HandleFunc("GET /foo", ...)). The other packages expose specific .GET, .POST, etc. methods for this. github.com/labstack/echo does not use the http.HandlerFunc function signature from the Go standard library. Instead it uses a custom function signature that returns an error, which can make error handling easier at the cost of API compatibility with the Go standard library. If you’re running Go 1.22, you can run this code like so. > go run . Listening on :3001... Listening on :3000... Listening on :3002... Press Ctrl+C to stop. Note: Ensure your go.mod file contains go 1.22 or later otherwise Go will use the older Go 1.21 and earlier net/http behavior. See the Go modules documentation for more information on why this is necessary. > cat go.mod module github.com/sudomateo/website go 1.22 ... From another terminal you can connect to each endpoint to see its response. > curl http://localhost:3000/api/v1/1337 {"id":"1337","http_mux":"net/http"} > curl http://localhost:3001/api/v1/1337 {"id":"1337","http_mux":"github.com/go-chi/chi"} > curl http://localhost:3002/api/v1/1337 {"id":"1337","http_mux":"github.com/labstack/echo"} What Object–Relational Mapping (ORM) Should I Use? #Standard library: database/sql Third-party packages: github.com/gobuffalo/pop github.com/jmoiron/sqlx github.com/sqlc-dev/sqlc gorm.io/gorm This question can also be difficult to answer, especially if engineers have strong opinions about writing SQL. I’ve witnessed many engineers spend more time debating this question than building their application. Before I answer this question let’s define what an object-relational mapping is. An object-relational mapping is a way to map objects in a programming language (i.e., Go structs) into database relations (i.e., tables) and vice versa. For example, an object-relational mapping takes the following Go struct. type Avenger struct { ID int Name string Age int } And maps its fields to the columns in the following database table. CREATE TABLE avengers ( id SERIAL, name TEXT NOT NULL, age INT NOT NULL, PRIMARY KEY (id) ); This allows you to interact with your database from your code without needing to understand how to serialize and deserialize the raw bytes to and from the database. Like most terms in the technology industry, object-relational mapping is overloaded. Most programming languages have functionality in their standard library to interact with a database using a database driver and raw SQL queries. Isn’t that an object-relational mapping? Not quite. An object-relational mapping extends and abstracts the standard library APIs, providing a new API using the programming language itself without the engineer needing to write any SQL. In practice it looks something like this. Database interaction using the standard library. type Avenger struct { ID int Name string Age int } row := db.QueryRow("SELECT * FROM avengers WHERE id = 1") if err := row.Err(); err != nil { // Handle error. } var a Avenger if err := row.Scan(&a.ID, &a.Name, &a.Age); err != nil { // Handle error. } Database interaction using an object-relational mapping. type Avenger struct { gorm.Model ID int Name string Age int } var a Avenger result := db.First(&a, 1) if err := Result.Error; err != nil { // Handle error. } The standard library interaction: Requires you to write the raw SQL query Scans individ'
