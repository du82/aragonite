title = "Unlimited Bowling. · Matthias Ott"
description = "Matthias Ott is an independent user experience designer and developer from Stuttgart, Germany. Besides design practice he teaches Interface Prototyping at the Muthesius Academy of Fine Arts and Design, Kiel."
full_description = 'Unlim­it­ed Bowling. Published by Matthias Ott Monday, 19 November 2018 #blogging #prototyping #publishing #Seth Godin Last weekend, I listened to a highly interesting episode of the Chase Jarvis Live Show, a podcast featuring interviews with creators, innovators, and entrepreneurs. The episode’s guest was Seth Godin and as you might expect, he dropped a lot of knowledge and good advice. And while there was a whole lot more to take away from the interview, I especially liked what Seth said about content creation, using the analogy of bowling: One of the dri­vers of bowl­ing is you got­ta pay by the game. So if I only got three games, I got­ta be care­ful with my rolls. What would hap­pen if you had unlim­it­ed bowl­ing? If you had unlim­it­ed bowl­ing, you could prac­tice dif­fer­ent shots, you could prac­tice dif­fer­ent approach­es, don’t wor­ry about it! […] That’s where we live now: Unlim­it­ed bowling. So we got­ta decide: Are we just con­stant­ly try­ing to get it just right down the cen­ter – which is bor­ing and isn’t gonna get us any­where. Or do we have the guts to say: You know, this might not work. But I’m gonna per­sis­tent­ly and con­sis­tent­ly and gen­er­ous­ly bring it forward. […] If you’re ask­ing for a guar­an­tee, you’re in the wrong line. This advice is gold if you are writing a blog, for example. What you write is totally up to you. And because you have unlimited shots on the Web, you can try out different formats, different styles, different topics. Regardless of what other people might think and although it might not work. But this advice is also gold when you are prototyping user interfaces. Because prototypes are so inexpensive compared to high-fidelity solutions, you can easily try out different approaches to solving your problem, although it might not work. That’s where we live now: Unlimited prototyping. ~ Have you published a response to this? Send me a webmention by letting me know the URL. Ping! 6 Webmentions ᴀ;xᴇ