description = "Matthias Ott is an independent user experience designer and developer from Stuttgart, Germany. Besides design practice he teaches Interface Prototyping at the Muthesius Academy of Fine Arts and Design, Kiel."
full_description = "Blue Eyes, Brown Eyes Published by Matthias Ott Sunday, 7 June 2020 #100 days of writing #exercise #psychology #racism Joschi Kuphal shared an amazing video on Twitter this morning. It is a documentary about an exercise that the school teacher, lecturer, and diversity trainer Jane Elliot devised in response to the assassination of Martin Luther King, Jr. in 1968. The exercise is called “Blue Eyes–Brown Eyes” and in it, Elliot uses the eye color of students to separate them into two groups: One with blue eyes and one with brown eyes. The group with the blue-eyed students – which turn out to be predominantly white – are then treated as being inferior throughout the exercise to make them feel the effects of racism and discrimination. The exercise received much public attention, especially in the 1970s and 1980s, and although scientific studies showed no evidence for long-term effects to reduce racism, the immediate effects of the exercise are obvious and fascinating to watch: https://www.youtube.com/watch?v=jPZEJHJPwIw - This is the eleventh post of my 100 days of writing series. You can find a list of all posts here. ~ Have you published a response to this? Send me a webmention by letting me know the URL. Ping! 4 Webmentions ilithya As usual thanks for sharing. I haven't seen this video before nor knew about Jane Elliott. Powerful stuff. Will also share. Likes ilithya Rudiger Meyer Reposts Matthias Ott More Notes Owning It Continue reading Free Audio Plugins: Accusonus ERA 6 Bundle Continue reading ilithya As usual thanks for sharing. I haven't seen this video before nor knew about Jane Elliott. Powerful stuff. Will also share."
