["https://matthiasott.com/notes/copy-that"]
title = "Copy That. · Matthias Ott"
description = "Matthias Ott is an independent user experience designer and developer from Stuttgart, Germany. Besides design practice he teaches Interface Prototyping at the Muthesius Academy of Fine Arts and Design, Kiel."
full_description = "Copy That. Published by Matthias Ott Wednesday, 20 March 2019 #copying #design #development #learning When I was in school our art teacher used to say: Kopieren heißt kapieren. Which translates to something along the lines of “copying something means understanding it.” What he meant is that if you want to understand how a piece of art was created, if you want to understand the technique the artist used, or aspects like form, composition, materials, and use of color, you will learn the most by getting your hands dirty and copying and dissecting the piece down to the last detail. So I spent a considerable amount of time copying Max Beckmann and other expressionists as well as the Cubist style of Georges Braque and Pablo Picasso. And my teacher was right: By copying Cubism as good as I could, I learned a lot about the characteristics of the painting techniques like, for example, the interplay of the different layers of shades of brown and grey, and how an illusion of sculptural three-dimensionality and movement is created through light and shadows on geometric shapes. Copying is an incredibly useful tool for learning. The process of copying something makes it your experience. By deconstructing it you gain a tangible understanding of the thought process of the creator(s) and how all the individual pieces come together to form something new and special. And by reassembling those elements again and recreating the piece, you acquire the necessary technical abilities – and make them your own. Copying itself is an art. Copying has a bad reputation, though. Because often, it is understood as simply stealing an idea or concept. Of course, you should always credit people accordingly and respect the license under which a piece of work is published before you take and manipulate someone else’s work. Copying must not be theft. But that doesn’t prevent you from thoroughly analyzing something and then building your own thing based on what you learned. Nothing is completely new and even the most sophisticated innovation could not have happened without so many ideas that came before it. In the end, every new idea is just a combination of other ideas and your personal experience. So the next time you see something that excites and amazes you, ask yourself: How was this done? How would I do it? Then, View Source (or use the DevTools), build prototypes and demos, and learn from copying and deconstructing the most advanced solutions out there. And then, apply it to your work in new and unseen ways. ~ Have you published a response to this? Send me a webmention by letting me know the URL. Ping! 8 Webmentions Revelino matthiasott.com/notes/copy-that Likes Brian Takle Marcus Herrmann Andrew Nguyen Mattia Compagnucci Calum Ryan Hennie Martens Reposts Mattia Compagnucci More Notes Owning It Continue reading Free Audio Plugins: Accusonus ERA 6 Bundle Continue reading"
