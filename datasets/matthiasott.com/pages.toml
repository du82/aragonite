description = "Matthias Ott is an independent user experience designer and developer from Stuttgart, Germany. Besides design practice he teaches Interface Prototyping at the Muthesius Academy of Fine Arts and Design, Kiel."
full_description = ''':focus-vis­i­ble Is Here Published by Matthias Ott Saturday, 10 October 2020 #a11y #accessibility #browsers #css #focus #ui #usability One of the most important features of a website that is built with accessibility in mind is that it can be navigated with a keyboard. Most blind users and many users with motor disabilities rely on keyboard navigation, either with a standard keyboard or with a device that mimics the functionality of a keyboard. Providing strong visual indicators that highlight the element that currently has keyboard focus is therefore indispensable. In CSS, the focus styles for an element can be changed via the :focus pseudo-class. a:focus { outline: 3px solid blue; } Hiding Focus Styles Is Bad Practice Besides accessibility requirements, there are also design considerations to be made, though: For some users, a strong visual focus indicator once they click an element with a mouse or touch it with their finger can be irritating or feel “clunky”. Often, the focus highlight is only visible for a short time just before a page change occurs. This is an additional visual change in the interface that users have to process and understand. Without the knowledge that this highlight around the element is actually an accessibility feature, people might be distracted or irritated. Sometimes, it is even perceived as an error. And while some designers certainly are far more sensitive to the aesthetic qualities of an interface than its users – and would be well-advised to get used to a bit more accessibility-oriented, contrasted designs –, it is still relatable that focus indicators might feel like an intrusive break in an otherwise carefully balanced visual design if the designers missed to actively style them. Many clients and designers, therefore, insist that developers remove the focus styles altogether for purely aesthetic reasons. a:focus { outline: none; } Don’t do this. It is an uninformed decision that actively excludes people and should not be an acceptable solution in 2020 anymore. We have to do better. But how? One way out of this dilemma would be to consciously design the focus state of an element so that it is perceived as a natural part of the transition from one state of the interface to the next. This, however, is not always easy or possible. :focus-visible to the Rescue Luckily, there is now another option: The :focus-visible pseudo-class. According to the spec, “the intent of :focus-visible is to allow authors to provide clearly identifiable focus styles which are visible when a user is likely to need to understand where the focus is, and not visible in other cases.” Or, in other words, it lets you show focus styles only when they are needed, using the same heuristic that the browser uses to decide whether to show the default focus indicator: /* Hide focus styles if they're not needed, for example, when an element receives focus via the mouse. */ :focus:not(:focus-visible) { outline: 0; } /* Show focus styles on keyboard focus. */ :focus-visible { outline: 3px solid blue; } In October 2020, Chrome 86 shipped with support for :focus-visible, Firefox also supports it since version 85, and older versions of Firefox support it via the :-moz-focusring pseudo-class since 2011. Support in WebKit is also coming, thanks to a recent initiative by Igalia. Edit: Support for :focus-visible shipped in Safari 15.4. So there is no need to hold back. You can start using :focus-visible now! Once more, progressive enhancement is your friend here. You can define regular focus styles for non-supporting browsers and then overwrite them for browsers that support :focus-visible. :focus { outline: 3px solid blue; } :focus:not(:focus-visible) { outline: 0; } :focus-visible { outline: 3px solid blue; } You can try it out in this Codepen: See the Pen :focus-visible Demo by Matthias Ott (@matthiasott) on CodePen. Note that :focus-visible always applies in combination with :focus. So if you inspect it in Chrome’s Developer Tools, for example, make sure to tick both boxes to see the appropriate focus styles. A Polyfill for Older Browsers If you need to support a wider range of browsers, including Safari, there is also a polyfill. It simply adds a focus-visible class to all focused elements in situations in which otherwise the :focus-visible pseudo-selector would match. Once the script is added to your page, the code looks much like in the examples above. The only difference is that now we are using classes to define the visible focus styles in our CSS: .js-focus-visible :focus:not(.focus-visible) { outline: none; } .js-focus-visible .focus-visible { outline: 3px solid blue; } If you decide to use the polyfill, make sure to pay attention to how it behaves in combination with your existing focus styles. It might still be a valid choice to only use the polyfill until Safari also adds support for :focus-visible. But regardless of which method you decide to use, it is fabulous that we now have a solution to a problem that was often “fixed” by developers and designers by making websites less accessible. :focus-visible now offers a solution that is accessible and makes users, designers, and developers happy. Further reading With :focus-visible, you can have focus styles when it makes sense, by Hidde de Vries The Focus-Indicated Pseudo-class: :focus-visible, W3C CSS Selectors Level 4 Giving users and developers more control over focus :focus-visible and backwards compatibility, by Patrick H. Lauke focus-visible Polyfill Can I use :focus-visible CSS pseudo-class? Navigate using just your keyboard, by Dave Rupert Focusing on Focus Styles, by Eric Bailey - This is the 62nd post of my 100 days of writing series. You can find a list of all posts here. ~ Have you published a response to this? Send me a webmention by letting me know the URL. Ping! 1038 Webmentions Matthias Ott Also added it to the list of links at the bottom of my :focus-visible post from a while ago… ✅; matthiasott.com/notes/focus-vi… Matthias Ott ????;????; Just updated my post on :focus-visible – because Safari 15.4 added support as well! &#x1f973;&#x1f64c; Matthias Ott Glad it was helpful, Amber! ????; Arnaud Delafosse If you've been asked to remove "that ugly border" on links and buttons by someone who knows nothing about #a11y, you can still style your own focus ring with :focus-visible and not exclude people using keyboard navigation.&#x1f44d; matthiasott.com/notes/focus-vi… + tpgi.com/focus-visible-… Marcus Herrmann Maybe your code example could feature outline-color: transparent; instead of outline: 0;&#x1f642;Background: Windows High Contrast Mode and, let's say, IE11: nicchan.me/blog/tips-for-… Matthias Ott Thanks a lot Marcus! This makes a lot of sense – I’ll change that! ????; Matthias Ott Just updated my post on :focus-visible from last year and included the latest updates: Full support in Firefox 85 and progress on an upcoming WebKit implementation! &#x1f389; Hyeonseok Shin ????; 브;라;우;저;에;서; 키;보;드; 포;커;스;와; 마;우;스; 포;커;스;를; 구;별;해;서; 넣;으;려;나; 보;네;요;. matthiasott.com/notes/focus-vi… devolute Just read a Reddit thread full of devs saying how `:focus-visible` isn't supported so don't bother. Now #Chrome 86 supports it so that's half the world. Plan ahead for new #a11y features, dum dums. Just added it to a client site. Nice guide by @m_ott here: matthiasott.com/notes/focus-vi… Alex Moldovan :focus-visible Is Here, by @m_ott matthiasott.com/notes/focus-vi… kiril delovski :focus-visible Is Here, by @m_ott matthiasott.com/notes/focus-vi… Halfvet De :focus-visible pseudo-class is gelanceerd en maakt een deel van de :focus-stijlen overbodig. matthiasott.com/notes/focus-vi… Darren McMillan :focus-visible is here, I don't really see the need for it myself I think we can manage fine with :hover :focus having accessibility and good UX, but knock yourself out... matthiasott.com/notes/focus-vi… \\ uto-usui // :focus-visible 使;っ;て;、;マ;ウ;ス;と;キ;ー;ボ;ー;ド;の;フ;ォ;ー;カ;ス;ス;タ;イ;ル;を;コ;ン;ト;ロ;ー;ル;す;