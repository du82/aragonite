title = "CSS Custom Properties Fail Without Fallback · Matthias Ott"
description = "Matthias Ott is an independent user experience designer and developer from Stuttgart, Germany. Besides design practice he teaches Interface Prototyping at the Muthesius Academy of Fine Arts and Design, Kiel."
full_description = 'CSS Cus­tom Prop­er­ties Fail With­out Fallback Published by Matthias Ott Friday, 12 June 2020 #cascade #color #css #custom properties #variables Today I learned! Jeremy Keith wrote about an interesting detail about CSS custom properties, also known as CSS variables, that he learned from Lea Verou: They don’t support the Cascade when a value is invalid. Or, as Lea writes in her article Hybrid positioning with CSS variables and max(): The brows­er doesn’t know if your prop­er­ty val­ue is valid until the vari­able is resolved, and by then it has already processed the cas­cade and has thrown away any poten­tial fallbacks. Jeremy goes on to explain that this is the reason why using the color() function will fall back successfully if you use it like this: /* CSS */ p { background-color: red; background-color: color(display-p3 1 0 0); } But it will fail if you use a custom property like so: /* CSS */ :root { --myvariable: color(display-p3 1 0 0); } p { background-color: red; background-color: var(--myvariable); } What happens is that the browser first figures out the cascade and then looks at the custom properties. If a property is invalid “at computed-value time”, there is no fallback value because the browser has already thrown away the other values. So in the example above, the browser will not display the red background-color, but instead unset it. A lot of people are switching from Sass to using CSS custom properties these days. And unless you still have to support IE11, you can totally do that because browser support is solid. So it will only be a matter of time until using CSS variables will have be the new normal. Knowing that they fail all that gracefully is an important thing to know, though. Especially if you are using them to use features that are only supported by a few browsers, like the new color functions color(), lab(), or lch(). But what can you do? Do we have to wait and skip using custom properties for values that might fail? Not really. As I wrote in my recent post about the new color functions coming to CSS, you could use supports() to check for support before setting the properties: /* CSS */ :root { --myvariable: red; } @supports (color: color(display-p3 1 0 0)) { :root { --myvariable: color(display-p3 1 0 0); } } p { background-color: var(--myvariable); } Another option would be to use a media-query like color-gamut. But if you want to set many values at once in one ruleset, supports() might be the better solution. Sara Soueidan recently wrote about how she defines Global and Component Style Settings with CSS Variables . In such a case, you could rely on a feature query using supports() to set all the custom properties for supporting browsers. /* CSS */ :root { /* UI Colors */ --color--primary: rgb(217,0,189); --color--secondary: rgb(242,199,0); } @supports (color: lch(50% 132 334)) { :root { /* UI Colors for browsers that support LCH colors */ --color--primary: lch(50% 132 334); --color--secondary: lch(82% 132 86); } } - This is the 16th post of my 100 days of writing series. You can find a list of all posts here. ~ Have you published a response to this? Send me a webmention by letting me know the URL. Ping! 32 Webmentions Matthias Ott FYI: matthiasott.com/notes/css-cust… Joulse CSS Custom Properties Fail Without Fallback matthiasott.com/notes/css-cust… Matthias Ott Halftime Friday Front-End CSS Custom Properties Fail Without Fallback, by @m_ott matthiasott.com/notes/css-cust… Refresh Detroit CSS Custom Properties Fail Without Fallback matthiasott.com/notes/css-cust… #CSS Katherine matthiasott.com/notes/css-cust… Ann #CSS Custom Properties Fail Without Fallback matthiasott.com/notes/css-cust… Gary Stevens frontendfront: CSS Custom Properties Fail Without Fallback matthiasott.com/notes/css-cust… Front-End Front CSS Custom Properties Fail Without Fallback matthiasott.com/notes/css-cust… Matthias Ott Thanks for sharing! &#x1f64c; Chris Heilmann &#x1f449;&#x1f3fb; “CSS Custom Properties Fail Without Fallback” &#x1f517; matthiasott.com/notes/css-cust… Cascade first, custom properties second... Jacky CSS Custom Properties Fail Without Fallback · Matthias Ott – User Experience Designer matthiasott.com/notes/css-cust… Jens Grochtdreis CSS Custom Properties Fail Without Fallback · Matthias Ott matthiasott.com/notes/css-cust… Chiyana Simões ????; CSS Custom Properties Fail Without Fallback · Matthias Ott – User Experience Designer matthiasott.com/notes/css-cust… Resoource CSS Custom Properties Fail Without Fallback matthiasott.com/notes/css-cust… #CSS #frontend #webdev #code Kilian Valkhof @m_ott should your @supports example here have "--myvariarable: red" in non-supports part? matthiasott.com/notes/css-cust… Jeremy Keith 13 June 2020 | 17:49 CSS Custom Properties Fail Without Fallback · Matthias Ott – User Experience Designer June 13th, 2020 Matthias has a good solution for dealing with the behaviour of CSS custom properties I wrote about: first set your custom properties with the fallback and then use feature queries (@supports) to override those values. Jeremy Keith I’m getting an error when I try to send a webmention to that URL from adactio.com/links/17004 > Internal Server Error > Undefined index: photo adactio.com/notes/17007 Matthias Ott Oh… ? Thank you for reporting, Jeremy. I’ll look into it this evening! Have a nice weekend! Adactio Links CSS Custom Properties Fail Without Fallback · Matthias Ott – User Experience Designer matthiasott.com/notes/css-cust… Likes daniel haim Fernando Mateus Dave ????; Leigh Dragoon - Author/Webdev ✡;️; ????; ????;????;‍????; Manuel Matuzović; ル;ル;ー;シ;ュ; Gaël Poupard Johan Bové Alejandro Hernández Reposts Manuel Matuzović; ル;ル;ー;シ;ュ; Matthias Ott More Notes Owning It Continue reading Free Audio Plugins: Accusonus ERA 6 Bundle Continue reading'
