title = "Shitty Code Prototypes · Matthias Ott"
description = "Matthias Ott is an independent user experience designer and developer from Stuttgart, Germany. Besides design practice he teaches Interface Prototyping at the Muthesius Academy of Fine Arts and Design, Kiel."
full_description = "Shit­ty Code Prototypes Published by Matthias Ott Thursday, 29 September 2022 #code #design #engineering #process #prototyping I love building prototypes. They allow me to explore and sketch ideas, test my assumptions, and try out things at an early stage to make better design decisions. Prototyping is the single best tool we have in our toolbox as designers and developers. And because anything can be a prototype, I use whatever gets the job done: Sometimes, I grab a pen and do a series of rough sketches. Sometimes, I use prototyping software like Adobe XD or ProtoPie to try out an idea for an interaction. And sometimes, I write code. Prototyping with code is my favorite way to build prototypes whenever I want to work with the real material of the Web and sketch out an idea in the browser with HTML, CSS, and JavaScript. Maybe it’s a layout that uses CSS Grid, a GSAP animation test, or a little interactive component. Whatever it is, I try to focus on the essence of what I want to try out and learn. What I don’t focus on, however, is code quality. And this is where it can get complicated. What I’ve experienced several times now, is that other team members will misunderstand this conscious decision to not write production code in a prototype. Some engineers will wonder why code prototypes were created when they can’t even reuse the code of those prototypes in production. To project managers, it sometimes feels like we are doing work twice and are wasting precious time and budget. Maybe the problem also lies in how differently designers and developers understand prototypes. Here’s Bill Buxton quoting a junior industrial designer: Engi­neers view pro­to­types as part of the process of build­ing things. Design­ers build pro­to­types to crit­i­cize and tear apart.” Maybe that’s it: To me, a prototype is a means to an end, a rough sketch, a shitty first draft. It will probably even be thrown away once we’ve found what we were looking for. A code prototype is not a first step in the process of building the final thing, it is a tool that helps you decide whether and how you should build something in the first place. A prototype lets us make better design decisions at any step of the process because we can see what works. And to see what works, we don’t need production-ready code. A shitty code prototype will do. ~ Have you published a response to this? Send me a webmention by letting me know the URL. Ping! 10 Webmentions Luis Orduz Some code is meant to be replaced or thrown away. Just gotta make sure it doesn't reach production. matthiasott.com/notes/shitty-c… Walter Ebert Walter Ebert @walterebert@mastodon.social Follow Apparently, some engineers expect prototypes to be re-usable ????; Maybe the term Proof of Concept (PoC) would be better at setting expectations. Maybe not ????; https://matthiasott.com/notes/shitty-code-prototypes Oct 03, 2022, 17:02 · · 0 · 0 · 0 Sign in to participate in the conversation Apparently, some engineers expect prototypes to be re-usable &#x1f928; Maybe the term Proof of Concept (PoC) would be better at setting expectations. Maybe not &#x1f937; https://matthiasott.com/notes/shitty-code-prototypes Mike-麥;-Mai/index.html I basically make wireframes in codepen &#x1f601; Matthias Ott &#x1f4af;&#x1f4af;&#x1f4af;&#x1f4af; Matthias Ott ☺;️; Danke! &#x1f64c; September was quite busy so there wasn’t much time to write. Looking forward to write a little bit more again soon… Frank Rausch I enjoy your articles a lot. Keep writing these!&#x1f44c; Likes Charles Bauer Matt O'Leary Trent Walton Chris Price ????;️;‍????; More Notes Owning It Continue reading Free Audio Plugins: Accusonus ERA 6 Bundle Continue reading"
