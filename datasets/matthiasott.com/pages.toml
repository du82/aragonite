["https://matthiasott.com/notes/out-there"]
title = "Out there. · Matthias Ott"
description = "Matthias Ott is an independent user experience designer and developer from Stuttgart, Germany. Besides design practice he teaches Interface Prototyping at the Muthesius Academy of Fine Arts and Design, Kiel."
full_description = 'Out there. Published by Matthias Ott Friday, 14 September 2018 #community #expectations #sharing #writing Recently, I read two posts within a few days that both resonated a lot with me. The topic of both pieces was the same: Writing. Or more specifically, writing on your own site. The first piece, “Just write.”, is by Sara Soueidan and if you haven’t read the article, I highly encourage you to do so. Besides the general advice that you should just write, no matter if people read it or not, what stuck in my mind the most were those two short sentences: Once I got over my own obsta­cles, I stopped feel­ing like I was oblig­at­ed to meet oth­er people’s expec­ta­tions. I start­ed enjoy­ing writ­ing again. Over the last two and a half years, I have published a few articles on this site. Most of them were quite lengthy, but I was fine with that, mostly because I cared deeply about the topics and also wanted to explore them for me. The feedback I received for those articles was very positive (thank you all ;) ) and I still feel that starting to write on my own site was one of the best decisions of my life. So if you think about starting to write yourself, I can only join Sara in saying: Just write. But if you take a look at my site, you’ll see that the last article dates back to January 2018. What happened? Looking back, it was a combination of a few things. One is that I started writing a monthly newsletter about prototyping for the Web, Prototyping.news, which I really enjoy, and another being the feeling that each new article had to be at least as good as the one before. I felt “like I was obligated to meet other people’s expectations” – if only a small but lovely group of people. While this can be a good thing and there is generally nothing wrong with aiming high, it can also have the effect that you start to constantly question yourself and your writing. As a result, the draft of an article about prototyping is still on my computer, waiting to be finished since the beginning of the year. The second post I wanted to share with you is by Tobias Tom. The post is not an article, it’s a quick note on his site, so short that I can share it in its entirety with you: Start­ing today I’ll try again to use this thing more again. More short notes, more links, and even more how-tos. Why? Because if one word or link helps some­one else out there, it’s bet­ter then nothing. I’ll also try to force it into my habit. Start­ing goal is one post a day. Includ­ing the week­ends. Phew. This quick note somehow is like a self-fulfilling prophecy: Even the smallest post can help someone else out there. In this case, this someone is me, seeing that others struggle to publish regularly, too. But no matter what expectations you think there are, it is important to get your thoughts out of your head. Even the rough and unfinished ones. You need to share your experiences because you never know whom it will help. So starting tonight, you can expect (haha) more posts from me again. Because I now understand that the most important thing about writing – just like with any type of work – is to get it out there. ~ Have you published a response to this? Send me a webmention by letting me know the URL. Ping! 16 Webmentions @matthiasott Out there by @matthiasott https://matthiasott.com/notes/out-there Out there. · Matthias Ott – User Experience Designer @matthiasott@mastodon.social Yes, go for it! Alex Cio Great challenge! I think writing is a super cool habit for summarizing your thoughts as well as put out information for others. I will soon to start a blog on my website too! Calum Ryan "You need to share your experiences because you never know whom it will help." – @m_ott » (matthiasott.com/notes/out-there) (calumryan.com/note/1900) Calum Ryan "You need to share your experiences because you never know whom it will help." – @m_ott » (https://matthiasott.com/notes/out-there) Likes Matthias Ott Holger Bartel Zockrates Laboratories Nürnberg Digita