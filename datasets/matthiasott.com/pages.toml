x (7) #variable fonts (1) #web (11) #Web (1) #webfonts (3) #webmention (1) #webp (1) #websites (2) #wireframes (1) #workshops (1) #writing (1) Dark Mode: How Users Think About It and Issues to Avoid https://www.nngroup.com/articles/dark-mode-users-issues/ An in-depth look at dark mode. Summary: it is popular, but not essential. Users like dark mode but maintain similar behaviors without it. They think about it at the system level, not the application level. If you choose to support dark mode, test your design to avoid common dark-mode issues. #ui #design #a11y #accessibility #ux #dark mode Green Web Directory https://www.thegreenwebfoundation.org/directory/ For every country, the Green Web Directory lists the hosting providers that provided evidence of their green services. #climate #climate change #web #hosting #energy transformation #renewables #climate action Gravity https://www.gravityclimate.com Gravity is a platform for carbon management, purpose-built for companies with complex value chains. It lets you calculate the carbon footprint of your organization and helps you identify areas to reduce emissions effectively.“Gravity's platform quickly ingests, calculates, and distributes key emissions data about our businesses.” #tools #platform #climate #climate change #economy #data #carbon management Observable https://observablehq.com With 200,000+ community examples, Observable is the fastest way to build custom data visualizations, apps, and dashboards to uncover deeper insights. From the creators of D3. #tools #data #dataviz #dashboards #data visualization Accessibility Developer Guide https://www.accessibility-developer-guide.com The «Accessibility Developer Guide» is an initiative of «Access for all», Swiss Foundation for technology adapted to people with disabilities. It is developed and maintained in collaboration with a number of acclaimed web agencies. The vision behind the Accessibility Developer Guide is to bridge the gap between providers of websites and users with special needs. #a11y #accessibility #Web #development #inclusive design #tools Building Web Layouts For Dual-Screen And Foldable Devices https://www.smashingmagazine.com/2022/03/building-web-layouts-dual-screen-foldable-devices/ Stephanie Stimac: “Dual-screen devices have been on the market for nearly three years. In that time new web platform technologies have been built with developer feedback to enable layout on the web that adapts to these devices. These web platform capabilities integrate with existing concepts, such as the viewport and media queries, so that developers and designers can spend more time ideating about how to leverage two displays to create enhanced experiences rather than learning a new set of code to build them.” #css #css grid #browsers #devices #responsive #rwd The Elements of UI Engineering https://overreacted.io/the-elements-of-ui-engineering/ A brilliant post by Dan Abramov on common UI and design / engineering problems and how trying to solve them is often a greater lesson than only learning about a new technology. “Learning comes from exploring the problem space and trying different possible tradeoffs.” #learning #ui #design #ui engineering Accessibility, Back to the Future | Bruce Lawson | Monki Gras 2019 https://www.youtube.com/watch?v=T2CjuAwrAq8 Bruce says: When Sir Uncle Timbo invented the Web it was accessible by default. Developers, we broke it. Dull Old Web Farts like me wagged our fingers and advised developers to Be Nice To Cripples and sometimes shook our fists and shouted “Be careful of lawsuits”. But by going back to basics, I’ll show you how accessibility means inclusion, and makes the web better for all – not just disabled people, but billions of new customers. So, fire up the flux capacitor and let’s go. NB: I’ll still wag my finger a bit, for old times’ sake. #accessibility #a11y #talks A Chaotic Good Guide to Image Performance, Part 1 https://cloudinary.com/blog/a_chaotic_good_guide_to_image_performance_part_1 A great guide to image performance by Mat Marquis. #performance #image #web #image optimization Very Dictionary https://www.verydictionary.com/ Do you use “very” very often? This very nice website provides very good alternatives to “very” so you don't have to use “very” less often. Very useful …ermm… advantageous! #writing #tools #style The business value of design https://www.mckinsey.com/business-functions/mckinsey-design/our-insights/the-business-value-of-design How do the best design performers increase their revenues and shareholder returns at nearly twice the rate of their industry counterparts? The McKinsey Design Index (MDI) highlights four key areas of action companies must take to join the top quartile of design performers. What they found and point out in their report: There is a strong correlation between high MDI scores and superior business performance. #design #business Personal sites https://personalsit.es/ A directory of personal websites by Andy Bell #websites #takebackyourweb The Learning/Doing Gap https://seths.blog/2019/06/the-learning-doing-gap/ A nice post by Seth Godin about a huge mistake our society often makes: We separate learning from doing. What happens if the learning we do is accomplished by always engaging in it in conjunction with our doing? #learning #education webmention.app https://webmention.app/ Automate your outgoing webmentions – a platform agnostic service that will check a given URL for links to other sites, discover if they support webmentions, then send a webmention to the target. #webmention #indieweb #websites #takebackyourweb Should I Use JavaScript to Load My Web Fonts? https://www.filamentgroup.com/lab/js-web-fonts.html Recently, browser support for new and safer CSS-only strategies have left some developers wondering: are JavaScript methods to load web fonts necessary? Are they useful? Zach Leatherman takes a closer look. #performance #webfonts #javascript Font-display, by @notwaldorf https://font-display.glitch.me/ A small and concise explainer on font loading with the font-display property by Monica Dinculescu on Glitch. #fonts #webfonts #performance #css High Resolution: Interview with Tom Kelley https://www.highresolution.design/16-tom-kelley-ideo/ A great interview with IDEO's Tom Kelley on design, design thinking, and what it takes to build your creative confidence. #design #design thinking CREATIVE LEADERSHIP today http://creativeleadership.com/ A blog on creative leadership by John Maeda from 2009 to mid-2015. #design #leadership Working with Charles and Ray Eames http://streetfurniture.com/au/working-charles-ray-eames/ Australian architect Darrel Conybeare joined the Eames office in Venice, California, in 1967, as a young graduate of the Architecture and Civic Design Masters program at the University of Pennsylvania. The next three years were beyond his greatest expectations …“I learned [about] the importance of building prototypes at both small scale and full size for all design outputs, products and graphic elements; and, ultimately, that there is no substitute for simple hard work in tackling any design challenge.” #design #prototyping #process Device Agnostic https://www.trentwalton.com/2014/03/10/device-agnostic/ A wonderful piece by Trent Walton about why we should build websites that are built to face the reality of the Web's inherent variability. #web #design #foundations #principles #responsive FeedBase http://feedbase.io/ FeedBase is a database of feeds to separate the management of your #RSS subscription list from feed readers, by @davewiner. #rss #information #social In Defense of Design Thinking, Which Is Terrible https://www.subtraction.com/2018/04/02/in-defense-of-design-thinking-which-is-terrible/ “If you have an idea—a force of nature—like technology, it becomes most powerful when it’s democratized, when it gets out there into the world and in the hands of millions of people. I believe this is true of design, too.”This is a must-read by @khoi Vinh. #design #design thinking Card Sorting: Uncover Users' Mental Models for Better Information Architecture https://www.nngroup.com/articles/card-sorting-definition/ Card sorting is an effective technique to understand if your information architecture matches the mental model of your users. This article by @kwsherwin covers all the basics. #testing #ux #ia #navigation Running in Circles – Why Agile Isn’t Working and What We Do Differently https://m.signalvnoise.com/running-in-circles-aae73d79ce19 Ryan Singer explains how, at Basecamp, they use the so called uphill phase to learn – through prototypes – what’s hard and what’s possible in a project. #process #design #agile #iterative #prototyping Design Principles https://principles.design/ An open source collection of design principles and methods managed by @benbrignell #design #principles Planning for Accessibility, by @laurakalbag https://alistapart.com/article/planning-for-accessibility “Accessibility isn’t a line item in an estimate or a budget—it’s an underlying practice that affects every aspect of a project.” This article is an excerpt from @laurakalbag’s new book, Accessibility for Everyone. #a11y #inclusive design Sketching Interfaces Generating code from low fidelity wireframes. https://airbnb.design/sketching-interfaces/ The @Airbnb design team has built a prototype that renders hand-drawn wireframes into working UI components #prototyping #sketching #wireframes #machine learning #ui HEAD – A free guide to <head> elements https://gethead.info/ #html #tags #meta #head Essential Image Optimization – An eBook by @addyosmani https://images.guide/ In 2017, image optimization should be automated. Addy Osmani looks at ways to reduce image size through modern compression techniques with minimal impact to quality. #image #optimization #compression #performance #build pipeline How to Run a Good Workshop http://scottberkun.com/2013/run-a-good-workshop/ Scott Berkun shares his 10 rules of running a good workshop. Rule 