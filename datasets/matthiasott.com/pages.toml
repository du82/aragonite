["https://matthiasott.com/notes/100-days-of-writing"]
title = "100 Days of Writing · Matthias Ott"
description = "Matthias Ott is an independent user experience designer and developer from Stuttgart, Germany. Besides design practice he teaches Interface Prototyping at the Muthesius Academy of Fine Arts and Design, Kiel."
full_description = "100 Days of Writing Published by Matthias Ott Tuesday, 26 May 2020 #100 days of writing #challenge #writing So, I haven’t written in a while. Or, to be more precise: I haven’t finished a written piece in a while. That is not because I didn’t write at all, but in the current situation, I simply decided to prioritize family and work over writing, which is still kind of a hobby for me. I started a few posts from time to time but then didn’t take the time to edit and finish them. This bugs me. I genuinely love to write. Thinking about what to write is interesting already but when you start to put your thoughts on, well, virtual paper, something amazing happens. Just like with design work, the end result is never what you expected it to be when you started the piece. The act of writing is always exciting and surprising. Especially when you try to let the words just pour out. It sounds like a platitude, but the older I get, the more I realize how true it is: The journey really is the reward. In some of my previous posts on this site, I wrote about what I learned from reading and listening to books and podcasts on writing. One of the first pieces of advice was to just start writing. Regardless of whether you are in the mood or not. Regardless of whether you think you have something to write about. If you want to be a better writer – write. But somehow, I did not practice what I preach. I’ll change that today. Starting today, I will post a shorter – or sometimes maybe even longer – piece on this site for 100 days. I have no idea what I will write about yet. Some posts will surely be about the Web, about design, and about coding. But others might also be about an observation I made that day or something I learned or enjoyed. I might share insights from books and podcasts or also a chocolate cake recipe. We’ll see. What will I learn from this? Will my writing improve? Will I think more about what to write? Will I make it a habit? Will you enjoy what you read? Will I fail? I don’t know. All I know is that I already like the idea of writing more and seeing where this leads me. I’m actually excited! Let’s do this. I’ll see you tomorrow. P.S. If you want me to write about a particular topic, just drop me a note or write me on my twttr. Posts I wrote thus far Day 1: The Curse of Knowledge Day 2: Digital Type Specimens Day 3: The Details Day 4: The Beautiful Day 5: Change and the Status Quo Day 6: The Right Way to Use fonts.com Web Fonts Day 7: World Wide Gamut Web Day 8: Fuck it, why wait? Day 9: The Shortcut Boomerang Day 10: Designing and Making Day 11: Blue Eyes, Brown Eyes Day 12: Balancing Risk Day 13: Welcome to the 21st Century Day 14: The Importance of Being Inauthentic Day 15: Building the Inclusive Web Together Day 16: CSS Custom Properties Fail Without Fallback Day 17: The Web of Privilege Day 18: Resilient Systems vs Humans Day 19: There Is No Secret Code Day 20: Feck Perfuction Day 21: Smooth Operations Day 22: Release Day 23: Becoming a Tyrant Day 24: Debugging HTML With Advanced CSS Selectors Day 25: What Would This Look Like If It Were Easy? Day 26: Go Deep Day 27: The Web in the Age of Ubiquity Day 28: Milton Glaser – Ten Things I Have Learned Day 29: Fussy Web, True Meaning. Day 30: 85 Percent Day 31: Thoughts on Writing: Read It Out Loud Day 32: One Egg Day 33: TeamOps Day 34: Necessity Is the Ultimate Teacher Day 35: Don’t Assume, Validate. Day 36: The New Urgency of Climate Change Day 37: Fear Day 38: Useless Is Useful Day 39: Scrolling Elements Into View Day 40: Wicked Design Day 41: Always at Your Service Day 42: Their Fault Day 43: Progressive Day 44: Hell Yeah or No Day 45: The Idea Machine Day 46: Lateral Thinking With Withered Technology Day 47: Range Day 48: Finite and Infinite Games Day 49: Gall’s Law Day 50: Halftime Day 51: How I Structure My CSS (for Now) Day 52: Fading Music in and Out in an Online Workshop (On a Mac) Day 53: BICEPS: Six Core Needs for Humans at Work Day 54: Design Debt Day 55: The Thing With Leading in CSS Day 56: Aspect Ratio in CSS: Hacks and a New Property Day 57: Your Brain Is Plastic Day 58: AVIF: A New Image Format Day 59: CSS Custom Properties With @property Day 60: Design and the 80/20 Principle Day 61: On the Design Systems Between Us Day 62: :focus-visible Is Here Day 63: Painting With the Web Day 64: Better Options ~ Have you published a response to this? Send me a webmention by letting me know the URL. Ping! 97 Webmentions Matthias Ott Better Options Matthias Ott Painting With the Web Matthias Ott Design and the 80/20 Principle Matthias Ott CSS Custom Properties With @property NouranMhmoud 100 Days of Writing, by @m_ott matthiasott.com/notes/100-days… Christophe Coevoet @m_ott on the page matthiasott.com/notes/100-days…, the link to the article for Day 56 has the wrong URL, leading to a 404 (I found the right URL by going to the index of the notes instead) Matthias Ott Aspect Ratio in CSS: Hacks and a New Property Matthias Ott The Thing With Leading in CSS Matthias Ott Design Debt Matthias Ott Halftime Matthias Ott Finite and Infinite Games Matthias Ott Range Matthias Ott Lateral Thinking With Withered Technology Matthias Ott The Idea Machine Matthias Ott Progressive Matthias Ott Their Fault Matthias Ott Always at Your Service Matthias Ott Wicked Design Matthias Ott Fear Matthias Ott Don’t assume, validate. Matthias Ott Necessity Is the Ultimate Teacher Matthias Ott TeamOps Matthias Ott Thoughts on Writing: Read It Out Loud Matthias Ott 85 Percent Francesco Schwarz ????; 100 Days of Writing I just discovered Matthias Ott’s challenge of wiriting something every day for 100 days just recently. Since May 27 he’s constantly outputting such good content that it leaves me deeply impressed. What will I learn from this? Will my writing improve? Will I think more about what to write? Will I make it a habit? Will you enjoy what you read? Will I fail? I don’t know. All I know is that I already like ... Matthias Ott Milton Glaser – Ten Things I Have Learned Matthias Ott The Web in the Age of Ubiquity Jeremy Keith 100 tunes We got a headstart on the lockdown. A week before the UK government finally stopped dilly-dallying (at the expense of tens of thousands of lives), Clearleft became a remote-only company. At the beginning of this stay-at-home time, I started recording a tune a day. I wasn’t sure how long I’d keep it up, but I’ve managed to keep it going the whole time. Yesterday I recorded my 100th tune. It’s funny how ... Matthias Ott Go Deep Matthias Ott Debugging HTML With Advanced CSS Selectors Matthias Ott Becoming a Tyrant Matthias Ott Release Matthias Ott Smooth Operations Matthias Ott Feck Perfuction Matthias Ott There Is No Secret Code Matthias Ott Resilient Systems vs Humans Matthias Ott Building the Inclusive Web Together Matthias Ott The Importance of Being Inauthentic Matthias Ott Welcome to the 21st Century Matthias Ott Balancing Risk Matthias Ott The Shortcut Boomerang Matthias Ott World Wide Gamut Web Matthias Ott Change and the Status Quo Matthias Ott Thank you Ilithya! ????; I’ll definitely write about editing and how I finish my longer posts (at least once a year… ????;). And the suggestion to write about habits and hobbies is also really good! Flo About how to find a topic to write about?! ????; ilithya - Everything and nothing. - How to compromise with one self to finish a long post (more than 10min read)... I would like to read that, as I am struggling finishing one of those... get super distracted easily. - Personal: lifestyle outside tech world... healthy habits, hobbies Matthias Ott The Details Matthias Ott ????; So what should I write about next… Hidde Someone will have to do it, Matthias! Matthias Ott Thank you, Hidde! I’m already looking forward to creating the photo for this post… ????; Hidde Best of luck on this project, I admire you for it. Looking forward to the chocolate cake recipe ????; Matthias Ott The Curse of Knowledge Kev Quirk If you want me to add your site to the blogroll, let me know. ????; Matthias Ott Oh, that’s nice! A great idea – and people are posting quite a bit under the hashtag. ????; I’ll have a look at it! Kev Quirk That’s great to hear, as I really enjoy your writing. I had a similar idea about a month ago and it’s seems to have morphed into a bit of a beast. I called it #100DaysToOffload it even had it’s own site now! 100daystooffload.com Lukáš Petr Good luck! That’s a great idea. I once did a 14-day challenge - 1 blog post a day. It was good, but quite stressful. Also, I do daily journaling (just 10+ minutes a day): lukaspetr.com/i-kept-my-writ… Matthias Ott Great! ????; I still remember when I learned (super basic) juggling one summer as a kid. I managed to juggle four scarves or three balls in the end – and it was so much fun! Matthias Ott Thank you Mike! ????; Flo My goal: rock solid with 4 balls and as many tricks as possible with 3. I bet you can still juggle 3 balls within 30 mins of practice. ????; Manuel Matuzović; Looking forward to what you’ll come up with on slow days. ????; Flo ????; I recently started 100 days of juggling … but intentionally more. Mike Acler Hats off & good luck with this, Matthias! These public commitments are the best! Matthew Roach That’s a lot of days.. But I'll look forward to seeing them in my RSS reader each day Likes Matthias Ott Tamas Sari Eric Zieger jens Manuel Matuzović; Michael Scharnagl Marc Hinse Björn Stierand Mike Acler Zoran Zlokapa Reposts Matthias Ott Matthias Ott Matthias Ott Matthias Ott Matthias Ott Matthias Ott Matthias Ott Matthias Ott Matthias Ott Matthias Ott Matthias Ott Matthias Ott Matthias Ott Matthias Ott Matthias Ott Matthias Ott Matthias Ott Matthias Ott Matthias Ott Matthias Ott Matthias Ott Matthias Ott Matthias Ott Matthias Ott More Notes Owning It Continue reading Free Audio Plugins: Accusonus ERA 6 Bundle Continue reading"
