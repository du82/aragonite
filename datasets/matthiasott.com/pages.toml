["https://matthiasott.com/notes/adding-json-feed-to-my-craft-cms-site"]
title = "Adding JSON Feed to My Craft CMS Site · Matthias Ott"
description = "A short write-up of what JSON Feed is and how I added support for it to my Craft CMS site."
full_description = "Adding JSON Feed to My Craft CMS Site Published by Matthias Ott Monday, 12 June 2017 #craft #feed #format #JSON #standards #syndication Despite the proclaimed death of RSS I know a lot of people who still love to read their feeds on a daily basis. So feeds are definitely here to stay and providing your readers with different ways of consuming your content is also an important part of a website, especially if you consider yourself (and your site) part of the open web. Recently, Manton Reece and Brent Simmons announced an interesting new feed format called JSON Feed. As its name implies, JSON Feed is similar to RSS or Atom, but it uses JSON as the format for syndication. This has some advantages over XML, for example that it is far easier to read and write. Manton and Brent also have the hope that the lightness, simplicity, and flexibility of JSON Feed will encourage people to develop for the open web. And JSON Feed indeed is not complicated at all. For an overview of the structure, have a look at the spec. There is a JSON Feed Viewer, made by Maxime Vaillancourt, that showcases some feeds and is also great for testing your own feed, once it’s ready. Besides that, popular feed readers like Inoreader or Feedbin already added support for JSON Feed. So I decided to give it a go and implement JSON Feed on my own site, too. Just to get an idea of what’s possible, I first looked at some sites that already provide a JSON feed, e.g. the sites of John Gruber (who also talked with the co-authors of JSON Feed on his The Talk Show podcast) and Jeremy Keith. After that, I evaluated different ways to easily provide the feed with Craft CMS, the content management system I use for my website. For one, you could simply output a frontend template under a route, for example “/articles/feed.json”. But I decided to use a more flexible solution: The Element API plugin. Element API is a powerful plugin vor Craft that makes it really easy to create a JSON API for your entries. You simply define an array of API endpoints in a single PHP file within your craft/config folder and the plugin will do the rest automatically for you. There is also a basic example of how you can set up a JSON Feed with Element API, which is a good starting point. With Element API, setting up a JSON Feed for my articles section turned out to be really easy. The only part that needed more care was to find the best way to pull out matrix blocks. I now simply loop through the blocks and add the individual data to the response string. If you also need to parse markdown, the parseMarkdown() function of the StringHelper class is really useful. So you can now subscribe to my JSON feed for the articles section or have a look at it in the JSON Feed Viewer. If you have any feedback or encounter any problems, please let me know. Within the next days, I will also add feeds for the notes and links sections. ~ Have you published a response to this? Send me a webmention by letting me know the URL. Ping! 17 Webmentions Rhys Jones Nice one! As long as it’s still valid I’m happy. Craft CMS Yep; order of properties never matters to JS objects / JSON Craft CMS Limitation of the JSON serializer lib Element API uses, Fractal. (Metadata is merged in after items.) Shouldn’t matter to readers though. Matthias Ott Just found it but you beat me to it, @craftcms ;) Yes, as JSON is “an unordered set of name/value pairs”, it shouldn’t matter. Rhys Jones Did the same and noticed your JSON feed also outputs the items before title, feed url, etc. Any idea why Craft does this? Matthias Ott Thanks! I have no idea tbh. But now I'm curious – I'll look into it…! ;) Nathan Gathright Very nice! Since Manton's @microdotblog is already JSON Feed, do you know if it'll require any extra work to support? Likes Manton Reece Chris Aldrich JSON Feed Reader Gunnar Bittersmann Jean-Luc Esser Conor McAfee Linus Lundahl Vienna.html in Nathan Gathright Reposts Craft CMS More Notes Owning It Continue reading Free Audio Plugins: Accusonus ERA 6 Bundle Continue reading"
