35F18 standard lens (fixed focal length, 35 mm, F 1.8, APS-C)the camera is placed behind my desk on a Walimex Video Tripod with fluid headit is connected to the great ATEM Mini switcher by Blackmagicbut because my model seems to have a color issue when used as a webcam via USB-C, I run the HDMI signal of the ATEM Mini into an Elgato Cam Link 4KI can see myself in a Walimex camera field monitor placed directly above the camera (my actual model is not available anymore, this one comes close)To be able to quickly turn the camera setup or the lights on or off, I installed a few meross WLAN smart plugs that I control via HomeKit on my iPhone 11 Lighting Key light: Aputure Amaran 200d S LED Video Light with an Aputure Light Dome SE SoftboxFill light: F&V K4000 LED light panel with a F&V KS-1 SoftboxAdditional colored lighting via two Boling BL-P1 RGB LED lights Software I listed most of the software I use regularly in this post: My Favorite Mac Apps in 2023 Pen & Paper My favorite pen for writing and sketching is the amazing LAMY swift rollerball pen in black. And I usually write everything down into LEUCHTTURM1917 plain notebooks. #carbonads {margin-top: 0.5rem; margin-left: 4rem} Connect with me Email mail@matthiasott.com mail@matthiasott.com Mastodon @matthiasott on Mastodon @matthiasott GitHub @matthiasott on GitHub @matthiasott Keybase @matthiasott on Keybase @matthiasott RSS Subscribe via RSS/Atom Subscribe'
