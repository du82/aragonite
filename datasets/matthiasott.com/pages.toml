full_description = '''Privacy Policy .container > * { max-width: 75ch; } Last Updated: October 14th, 2023 Please read this Privacy Policy carefully before using the Platform (as defined below). This Privacy Policy describes how we might collect, store, use, and share information, governs how we treat this information, and lets you know your associated rights. This Privacy Policy applies to the Website https://matthiasott.com (the “Website”), the services and information available via the Website, including Matthias’s email newsletters and any online location controlled by us that links to this Privacy Policy (collectively, the “Services”). The Services, together with the Website, are referred to as the “Platform”. We are committed to protecting your privacy and believe that you should have full control over your private data. We will not use or share your information with anyone except as described in this Privacy Policy. By using this website, you agree to the collection and use of information in accordance with this policy. If you do not agree with our policies and practices, please do not use our Services. We recommend that you read this Privacy Policy in full to ensure you are fully informed. The responsible data controller for the Platform and all related services is Matthias Ott: Matthias Ott Hauptstr. 58 73773 Aichwald GERMANY If you still have any questions or concerns, please contact us at legal@matthiasott.com. Summary of Key Points This summary provides key points from our privacy notice, but you can find out more details about any of these topics by clicking the link following each key point or by using our table of contents below to find the section you are looking for. What personal information do we process? When you visit, use, or navigate our Services, we may process personal information depending on how you interact with us and the Services, the choices you make, and the products and features you use. Learn more about personal information you disclose to us. Do we process any sensitive personal information? We do not process sensitive personal information. Do we receive any information from third parties? We do not receive any information from third parties. How do we process your information? We process your information to provide, improve, and administer our Services, communicate with you, for security and fraud prevention, and to comply with law. We may also process your information for other purposes with your consent. We process your information only when we have a valid legal reason to do so. Learn more about how we process your information. In what situations and with which parties do we share personal information? We may share information in specific situations and with specific third parties. Learn more about when and with whom we share your personal information. How do we keep your information safe? We have organizational and technical processes and procedures in place to protect your personal information. However, no electronic transmission over the internet or information storage technology can be guaranteed to be 100% secure, so we cannot promise or guarantee that hackers, cybercriminals, or other unauthorized third parties will not be able to defeat our security and improperly collect, access, steal, or modify your information. Learn more about how we keep your information safe. What are your rights? Depending on where you are located geographically, the applicable privacy law may mean you have certain rights regarding your personal information. Learn more about your privacy rights. How do you exercise your rights? The easiest way to exercise your rights is by submitting a data subject access request, or by contacting us. We will consider and act upon any request in accordance with applicable data protection laws. Want to learn more about what we do with any information we collect? Review the privacy notice in full. Navigating this Privacy Policy To help you navigate our Privacy Policy, we have divided the Policy into numbered sections. The sections are as follows: Your Consent to This Privacy Policy The Information We Collect How We Process and Use This Information What Legal Bases Do We Rely on to Process Your Information? When and With Whom We Share This Information Is Your Information Transferred Internationally?How Long Do We Keep Your Information? Keeping Your Data Safe Do We Collect Information From Minors? Accessing and Updating Your Information What Are Your Privacy Rights? Controls For Do-Not-Track Features Notice of Privacy Rights to California Residents Notice of Privacy Rights to Virginia Residents Do Other Regions Have Specific Privacy Rights? Third-Party Sites Adobe Typekit Webfonts Complaints Changes to This Privacy Policy Contact Us You may also print a copy of this Privacy Policy using the “Print” feature available from most web browsers. 1. Your Consent to This Privacy Policy By using the Platform, or otherwise providing information to us, you agree to this Privacy Policy. If you do not agree with this Privacy Policy, please do not use the Platform. You may withdraw your consent by requesting deletion of your information or otherwise exercising your rights in accordance with Section 11 (What Are Your Privacy Rights?). 2. The Information We Collect In Short: We collect personal information that you provide to us. Our Platform gives us the opportunity to communicate with people interested in Matthias’s blog, newsletters, podcast, and his other activities and interests. The Platform also provides you with opportunities to participate in exchanges on these topics and to receive additional information on all of the above. To provide these Services, and to otherwise conduct our business via the Platform, we rely on information provided by and collected from our users. This information consists of the following: 2.1 Personal Information. We collect personal information that you voluntarily provide to us when you express an interest in obtaining information about us or our products and Services, when you participate in activities on the Services, or otherwise when you contact us. The personal information that we collect depends on the context of your interactions with us and the Services, the choices you make, and the products and features you use. The personal information we collect may include the following: Your name, Your email address, Your social media handle (e.g., if you engage with us on social media), and Your billing and/or shipping address and payment card information, which is collected and processed by our third-party payment processor. We do not have access to your full payment card information. 2.2 Sensitive Information. We do not process sensitive information. 2.3 Payment Data. We may collect data necessary to process your payment if you make purchases, such as your payment instrument number, and the security code associated with your payment instrument. All payment data is stored by Stripe, Inc.. You may find their privacy notice link(s) here: https://stripe.com/privacy. All personal information that you provide to us must be true, complete, and accurate, and you must notify us of any changes to such personal information. 2.4 Webmentions. By supporting Webmentions on your website, you explicitly signal your wish for linked websites to process and publish your public replies to their content. You can at any time request the removal of one or all Webmentions originating from your website. An incoming Webmention request is by design a request for publishing a comment from elsewhere on the web; this is what the protocol was designed for and why it is active on your website. Commonly, received Webmentions are displayed as comments on a web page. This means that a copy of your content is displayed on the website you link to in your own post. The personal data being processed and published might include: Your name The profile picture from your website The URL of your website Personal information you include in your post Legal Basis: The publishing of incoming Webmentions is based on the legitimate interest to enable interaction with the readers of this website (Art. 6(1) lit. f GDPR), following the design intention of the Webmention protocol. 2.4 Automatically Collected Technical and Device-Related Information. In Short: Some information — such as your Internet Protocol (IP) address and/or browser and device characteristics — is collected automatically when you visit our Services. We automatically collect certain information when you visit, use, or navigate the Services. This information does not reveal your specific identity (like your name or contact information) but may include device and usage information, such as your IP address, browser and device characteristics, operating system, language preferences, referring URLs, device name, country, location, information about how and when you use our Services, and other technical information. This information is primarily needed to maintain the security and operation of our Services, and for our internal analytics and reporting purposes. We do not use any tracking technology, like advertising cookies, that might be used to personally identify you or create user profiles across the World Wide Web. The information we collect includes: Log and Usage Data. Log and usage data is service-related, diagnostic, usage, and performance information our servers automatically collect when you access or use our Services and which we record in log files. Depending on how you interact with us, this log data may include your IP address, device information, browser type, and settings and information about your activity in the Services (such as the date/time stamps associated with your usage, pages and files viewed, searches, and other actions you take such as which features you use), device event information (such as system activity, error reports (sometimes called "crash dumps"), and hardware settings). Device Data. We collect device data such as information about your computer, phone, tablet, or other device you use to access the Services. Depending on the device used, this device data may include information such as your IP address (or proxy server), device and application identification numbers, location, browser type, hardware model, Internet service provider and/or mobile carrier, operating system, and system configuration information. Device identifiers, such as cookies; 2.5 Anonymous Information. Our Platform also collects, processes, and/or uses information that does not identify you or your devices, including Personal Information that has been made anonymous by: (i) removing identifying fields and aggregating the information with other information so that individual subjects of the information cannot be re-identified, or (ii) anonymizing the information with techniques that remove or perturb the identifying data so as to prevent re-identification of the anonymized information (collectively, “Anonymous Information”). Information that meets these criteria might include, for example, statistical information (e.g., page views and hit counts), and general tracking information about how the Website is used. 3. How We Process and Use This Information In Short: We process your information to provide, improve, and administer our Services, communicate with you, for security and fraud prevention, and to comply with law. We may also process your information for other purposes with your consent. We process your personal information for a variety of reasons, depending on how you interact with our Services, including: To deliver and facilitate delivery of services to the user. We may process your information to provide you with the Services you request and, specifically, to allow Matthias to send you email with information, for example, about his activities, recommendations, interviews, blog posts, and news, and to allow you to receive Matthias’s podcasts.To send administrative information to