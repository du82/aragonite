full_description = "Books I Will Def­i­nite­ly Maybe Read in 2017 Published by Matthias Ott Friday, 13 January 2017 #books #reading It’s that time of year when most people publish their „books I have read“ articles. Tim for example, and also Jeremy. I for myself am what you could call a book taster. There are a lot of books on my shelves that I started reading but somehow never finished. But this year this is going to change. Maybe. So here’s my list of books I want to finish in 2017. By pure chance, a lot of them have the word “design” in their title. ;) Inclusive Design Patterns by Heydon Pickering (I’m already halfway through this one!!!!!) Resilient Web Design by Jeremy Keith Adaptive Web Design by Aaron Gustafson The Shape of Design by Frank Chimero Pricing Design by Dan Mall Demystifying Public Speaking by Lara Hogan Design for Real Life by Eric Meyer & Sara Wachter-Boettcher Just Enough Research by Erica Hall Responsive Design: Patterns and Principles by Ethan Marcotte The Smashing Book 5: Real-Life Responsive Web Design by Daniel Mall, Sara Soueidan, Zoe M. Gillenwater, Bram Stein, Yoav Weiss, Tom Maslen, Matt Gaunt, Andrew Clarke, and others. High Performance Images by Colin Bendell, Tim Kadlec, Yoav Weiss, Guy Podjarny, Nick Doyle, and Mike McCall SVG Animations by Sarah Drasner Designing Design by Kenya Hara Less and More, the Design Ethos of Dieter Rams by Klaus Klemp, Keiko Ueki-Polet (editors) Thoughts on Design by Paul Rand Design for Dasein by Thomas Wendt The Design of Everyday Things: Revised and Expanded Edition by Don Norman Design for the Real World by Victor Papanek Die Kunst der Typografie (the art of typography) by Paul Renner Designing for the Digital Age by Kim Goodwin How to Make Sense of Any Mess by Abby Covert Digital Design Theory: Readings from the Field by Helen Armstrong Undercover User Experience Design by Cennydd Bowles and James Box User Story Mapping by Jeff Patton Designing UX: Prototyping by Ben Coleman Prototyping for Designer