full_description = 'Free Audio Plu­g­ins: Accu­sonus ERA 6 Bundle Published by Matthias Ott Thursday, 21 November 2024 #audio #internet archive #plugins #podcasting #recording #video #voice I’ve been down in an audio plugin rabbit hole lately. More on that in a later blog post. But I just stumbled upon a set of free plugins that might be of interest to you, if you are doing voice recordings of any kind – be it a podcast, voice over, or, let’s say, video tutorials. There are, of course, many more free plugins for that use case. Again, I might cover more of them in separate blog posts, also to document my own research. Let me know if that sounds remotely interesting. But back to the plugins I wanted to talk about: the Accusonus ERA 6 Bundle. Accusonus was a company founded in 2013 by Alex Tsilfidis and Elias Kokkinis in Greece. The company produced sophisticated audio restoration plugins that removed noise, clicks, hum, reverb from recordings, and improved the sound of voice recordings in various other ways, including the use of AI. In 2022, Meta bought the company, and after that, Accusonus’s products were sunset and all traces of the company quickly got erased from the Web. However, shortly before they vanished, Accusonus made their ERA 6 Bundle of audio repair tools available for free. And those audio plugins can still be downloaded from the Internet Archive. The bundle, which is Apple Silicon compatible but also available for Windows, includes plugins like De-Breath, Mouth De-Clicker, De-Esser (Pro), Noise Remover (Pro), Reverb Remover (Pro), Plosive Remover, Voice Leveler, and many more. I just gave most of them a try in Reaper – and they seem to do an amazing job! You can download the installers from the Internet Archive. ~ Have you published a response to this? Send me a webmention by letting me know the URL. Ping! 0 Webmentions ¯\_(ツ)_/¯ More Notes Owning It Continue reading How to Set Your Domain as Your Bluesky Handle Continue reading'
