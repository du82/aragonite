["https://matthiasott.com/notes/necessity-is-the-ultimate-teacher"]
title = "Necessity Is the Ultimate Teacher · Matthias Ott"
description = "Matthias Ott is an independent user experience designer and developer from Stuttgart, Germany. Besides design practice he teaches Interface Prototyping at the Muthesius Academy of Fine Arts and Design, Kiel."
full_description = "Neces­si­ty Is the Ulti­mate Teacher Published by Matthias Ott Tuesday, 7 July 2020 #learning #necessity #projects Remember that thing you wanted to learn? You know what I mean. That thing that keeps on nagging in the back of your head. That thing that comes to mind now and then and reminds you that there are so many things that you could explore. You know it would be interesting and, almost certainly, fun to learn it. But somehow, you never started. Learning to draw. Learning to sing. Learning to write. Learning to debate. Learning to speak in public. Learning to say no. Learning to design. Learning to code. Learning to fly. There are so many opportunities to learn out there. Yet most of the time, we seem to learn only the things that are really necessary at this very moment. Suddenly, learning something becomes essential for survival. When there are no excuses and no alternatives, learning something and staying at it is suddenly much easier. So if you want to learn something, create necessity. Start a small project that presents you with real challenges and problems to solve. Sign up for a course, book a workshop, set yourself a deadline. Find something that excites your curiosity and is endlessly interesting but also lets you work hands-on and solve real problems as you go. You’ll discover that it is now much easier to overcome the first hurdle of learning something: Getting started. And you’ll discover that only by having to solve real problems, you’ll go deep and learn by experience – which is where true learning happens. Necessity is the ultimate teacher. - This is the 34th post of my 100 days of writing series. You can find a list of all posts here. ~ Have you published a response to this? Send me a webmention by letting me know the URL. Ping! 2 Webmentions Quantum Eraser “So if you want to learn something, create necessity” matthiasott.com/notes/necessit… Reposts Matthias Ott More Notes Owning It Continue reading Free Audio Plugins: Accusonus ERA 6 Bundle Continue reading"
