full_description = "One Egg Published by Matthias Ott Thursday, 2 July 2020 The kids wanted pancakes. But there was only one egg left. Usually, I use four eggs to make pancakes. But the kids wanted pancakes. So I made pancakes. With only one egg. They turned out delicious. Sometimes, one egg is enough. Sometimes, you should just try although the conditions seem less than ideal. - This is the 32nd post of my 100 days of writing series. You can find a list of all posts here. ~ Have you published a response to this? Send me a webmention by letting me know the URL. Ping! 11 Webmentions @mateng @mateng &#x1f601; Hope that one egg was enough, though? @jonhicks @raf Haha, amazing! &#x1f601; But it is @jonhicks’s fault! https://mastodon.social/@jonhicks/113287577755874807 @matthiasott @matthiasott We talked about making eggs for breakfast 5 minutes ago and I told my family: There's only one egg left. So we decided to make one egg. It's a universal phenomenon. @matthiasott @matthiasott THIS IS YOUR FAULT https://mastodon.cloud/@raf/113288905866010945 Rafal (@raf@mastodon.cloud) @matthiasott @matthiasott egg and cheeeeese and bacon @matthiasott @matthiasott or even zero -- vegan pancakes are delicious. Jeremy Keith Sometimes, one egg is enough. In France, one egg is un oeuf. Likes Ivana Isadora Devcic Señor Rolando Nensi Keller Reposts Matthias Ott More Notes Owning It Continue reading Free Audio Plugins: Accusonus ERA 6 Bundle Continue reading @jonhicks @raf Haha, amazing! &#x1f601; But it is @jonhicks’s fault! https://mastodon.social/@jonhicks/113287577755874807 @matthiasott @matthiasott We talked about making eggs for breakfast 5 minutes ago and I told my family: There's only one egg left. So we decided to make one egg. It's a universal phenomenon. @matthiasott @matthiasott THIS IS YOUR FAULT https://mastodon.cloud/@raf/113288905866010945 Rafal (@raf@mastodon.cloud)"
