ore fleeting, less fleshed-out thoughts. But I still remember that reading it gave me a sense of excitement knowing there were more people around than just me clicking away on their personal websites. To me these are the last great remnants of the idealised, ... Likes alwillis Matrixes Scott Kellum :typetura: Nicolas Friedli Theresa O’Connor Ruben Arakelyan :ruby: More Notes Owning It Continue reading Free Audio Plugins: Accusonus ERA 6 Bundle Continue reading"
