["https://matthiasott.com/notes/analytics-analysis"]
title = "Analytics Analysis · Matthias Ott"
description = "Matthias Ott is an independent user experience designer and developer from Stuttgart, Germany. Besides design practice he teaches Interface Prototyping at the Muthesius Academy of Fine Arts and Design, Kiel."
full_description = "Ana­lyt­ics Analysis Published by Matthias Ott Tuesday, 7 February 2023 #analytics #cookie-free #GDPR #privacy #tools When it comes to tracking and analyzing a website‘s traffic, Google Analytics (GA) seems to be the obvious choice: everyone knows it, it’s powerful, it’s free, it’s used by millions of sites. 53 % of sites worldwide, to be precise. No wonder many clients ask for it and many people who build websites willingly add it to the sites they build and sell. There are, however, a lot of downsides that come with using GA. And some of them are actually real downers. Using GA can be bad for the performance of your site, you are giving all the stats about your site to the largest ad-tech firm in the world for free (that companies readily do this still blows my mind), and most people will never use it for more than to occasionally access a few (often partially inaccurate) stats, also lacking any proper strategy on which insights they really want to collect and how to translate those insights into real action. The most daunting drawbacks, however, are related to privacy and regulations like GDPR. When you add GA to a site, it will transfer personal information to Google, so you not only have to adjust your privacy policy accordingly but also obtain consent from your users. The same goes for the cookies that GA stores on your users’ machines. Using GA means that your site needs a cookie consent banner – lovely! Looks like there are many good reasons to look for alternatives to Google Analytics. And thankfully, there are quite a few these days, many of which not only provide a nice set of features but are also privacy-focused and often even cookie-free. Here’s a short list of some interesting options. Many of them were suggested to me by all the lovely people who replied to a post of mine on Mastodon. By the way: if you ask a question on Mastodon, you’ll receive so many helpful answers – it’s wild! Imagine Twitter but with real human interaction. Plausible Simple Analytics Fathom Matomo Cabin Umami Pirsch Also, Pelle shared a link to a longer list of European alternatives to GA. ~ Have you published a response to this? Send me a webmention by letting me know the URL. Ping! 35 Webmentions @matthiasott @matthiasott I’m on team Plausible. Does the tiny job I need, very well. #WikiParty@michaelgraaf@campaign.openworlds.info RT @matthiasott@mastodon.social ✍;️; New post: Analytics Analysis There are many privacy-first, cookie-free alternatives to Google Analytics available these days. Time to use them! matthiasott.com/notes/analytic… mastodon.social/@matthiasott/1… @matthiasott @matthiasott The title is a little misleading. Many of these are not real GA alternatives. But then again, most people only use a fraction of the features. Matomo is pretty close in terms of features. The rest are great analytics tools but not very comparable to GA. @matthiasott @matthiasott big +1 to Plausible. Strikes a really nice balance of simplicity and utility due to how filtering works. @matthiasott @matthiasott are you looking only for JS based frontend solutions, or would you consider backend solutions like Netlify Analytics, more based on server/edge logs? @nhoizey @nhoizey I don’t care! ????; It depends on the project and what insights you want to get. So if server/logs-based solutions are sufficient, e.g. for getting page views, that’s even better I guess. Likes Alex ☑;️; David Díaz Danilo Vega Ruben Borg Nielsen Tommi Typographica Rainer Klute Andy Dehnart Chris Noah Liebman Mike Aparicio ADHDel Ain Tohvri Chris M. DutyBard Bastian Allgeier Ryan Christensen Patrick Hill Pelle Wessman Reposts Alex ☑;️; Alistair Shepherd Daniel Lil PWA #WikiParty JJ Korewa Watashi Matthias Ott Holger Bartel Amanda Carson More Notes Owning It Continue reading Free Audio Plugins: Accusonus ERA 6 Bundle Continue reading"
