full_description = '''<img src="/assets/pictures/_blogHeaderImage800/into-the-personal-website-verse-wide-01.jpg" alt="Into The Personal Website Verse Wide 01" width="800" height="320"> Into the Personal-Website-Verse 12 May 2019 #blogging #indieweb #letsfixit #personal #web #websites More and more people are rediscovering their personal websites as an alternative to social media that provides more control and freedom of expression. It's time to connect our sites even further and create a decentralized fabric of interconnected personal sites that enables each individual to engage in an open discussion – answering, challenging, and acknowledging the ideas of others through a universe of personal sites. Continue reading <img src="/assets/pictures/_blogHeaderImage800/saving-web-workflows-prototyping.jpg" alt="Saving Web Workflows Prototyping" width="800" height="320"> Sav­ing Your Web Work­flows with Prototyping 11 January 2018 #design #development #process #prototyping #web Our static tools and linear workflows aren’t the right fit for the flexible, diverse reality of today’s Web. Making prototyping a central element of your workflows will radically change how you approach problem solving and save you a lot of headaches. But most importantly, you will be creating the right products and features in a way that resonates with the true nature of the Web. A discourse on processes, flexibility, the Web as a material, and how we build things. Continue reading <img src="/assets/pictures/_blogHeaderImage800/resolving-gridlock-01.jpg" alt="Resolving Gridlock 01" width="800" height="320"> Resolv­ing CSS Gridlock 30 July 2017 #css #grid #layout #process #prototyping CSS Grid will radically change the way we do layout on the Web. But for this change to happen, we will need to learn how to play this new instrument. Continue reading <img src="/assets/pictures/_blogHeaderImage800/beyond-tellerrand-welcome-back.jpg" alt="Beyond Tellerrand Welcome Back" width="800" height="320"> Off the Beat­en Track 9 July 2017 #community #conferences #ideas #inspiration When designing and building things for the web, it’s tempting to fall into the trap of doing things the We-have-always-done-it-that-way™. But good design isn't about being right. It's about finding useful, accessible, memorable, entertaining, and appropriate solutions to real problems. A look at three ideas and three inspiring talks from beyond tellerrand 2017. Continue reading'''
