title = "Balancing Risk · Matthias Ott"
description = "Matthias Ott is an independent user experience designer and developer from Stuttgart, Germany. Besides design practice he teaches Interface Prototyping at the Muthesius Academy of Fine Arts and Design, Kiel."
full_description = "Bal­anc­ing Risk Published by Matthias Ott Monday, 8 June 2020 #100 days of writing #decisions #risk Life is full of risks. The risk to make a wrong decision. The risk to lose. The risk to fail. The risk to mention too many risks in the first paragraph of a blog post. There are some risks that most of us understandably want to reduce as much as possible. The risk to die, for example. Then, there are also risks worth taking. Why are they “worth” it? Not because there is no risk involved at all, but because the return, the utility, outweighs the potential damage. But because we are risk-averse beings, we overestimate potential losses and also the risk of losing in itself. Consequently, we often shy away to take even the smallest risks. Publishing that blog post? Singing a song at a birthday party? Speaking in front of people? This all can seem quite risky. But is it, really? Risk can never be eliminated completely. So instead of not doing the things that include some risk, why not accept the risk and try to evaluate more closely? Just because something seems like it has a high possibility of failure, doesn’t mean it is not worth trying, for example. If the potential return is huge, ask yourself: What is the worst that could possibly happen? If “the worst” isn’t actually that bad, then maybe the risk is still worth taking. We have to make many decisions every day, and if we can’t eliminate risk, the best strategy might be to balance the risks in ways that keep the big upside while reducing the downside. - This is the twelfth post of my 100 days of writing series. You can find a list of all posts here. ~ Have you published a response to this? Send me a webmention by letting me know the URL. Ping! 1 Webmention Reposts Matthias Ott More Notes Owning It Continue reading Free Audio Plugins: Accusonus ERA 6 Bundle Continue reading"
