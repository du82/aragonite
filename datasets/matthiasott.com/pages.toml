["https://matthiasott.com/articles/beyond-tellerrand-2016"]
title = "Beyond Tellerrand 2016 · Matthias Ott"
description = "Lately, I travelled to Düsseldorf and attended the IndieWebCamp and also beyond tellerrand, a conference about design, development, and all things web. I’ll say it plain: If you never have been at a conference, you should go. If you never have been at beyond tellerrand, you should definitely go as soon as possible. Here's why."
full_description = '''<img src="/assets/pictures/_blogHeaderImage1280/btconf-2016.jpg" alt="Btconf 2016" width="1280" height="512"> Beyond Teller­rand 2016 Published by Matthias Ott Monday, 16 May 2016 #btconf #community #conferences #inspiration Lately, I travelled to Düsseldorf and attended the IndieWebCamp and also beyond tellerrand, a conference about design, development, and all things web. I’ll say it plain: If you never have been at a conference, you should go. If you never have been at beyond tellerrand, you should definitely go as soon as possible. Because it's an event that is special in many ways. Here's to the curious First of all, there is the great variety of topics. Conference organizer Marc Thiele repeatedly manages to get speakers from the most diverse fields of work to his events, so the name (“beyond tellerrand” loosely translates to “beyond one's own nose”) really says it all. Beyond tellerrand allows you to hear talks about user experience design, image performance optimization, time and creativity, game design, typography, the reinvention of normal, the security issues of AngularJS, CSS animation, great advice to young (and not so young) designers, the internet of things, type design of a coding font, progressive enhancement, and the work of Mr. Bingo – all on the same track. The diversity of the topics of the talks at beyond tellerrand is maybe unparalleled and each one of the talks was interesting and entertaining but most importantly: highly relevant in covering current topics. The only topic that I missed a little this time was accessibility, but Heydon Pickering will surely tackle that at the next beyond tellerrand in Berlin (07–09 Nov 2016). Marc Thiele opens beyond tellerrand DUS 2016 – once again he created a wonderful event with outstanding speakers. Jeremy Keith emphasized the importance of building resilient experiences with the help of pro­gressive enhance­ment. David Jonathan Ross talked about fonts for code and his work on the font family Input. Dominic Wilcox showed his wonderful work. Here, it's a robot spoon that gets happier as children eat their breakfast. Val Head did a great job explaining meaningful animation – including some CSS live coding. What happens if you have such a diverse mixture of speakers and topics is this: You are continuously confronted with new things, with new thoughts, new concepts, and new ways of approaching problems. And not only do you learn something new by that, you also challenge your assumptions, you start thinking in new ways, you sometimes even rewire your brain. But hey: You could just as well stay at home and watch most of the talks on Vimeo. So why go there after all? Here's to the people The answer is: people. The web community is a vibrant community that to a great extent exists in the digital space. However, the real-world experience of a conference is something that is hardly reproduced in a purely virtual space. The atmosphere at beyond tellerrand is really relaxed, open, and welcoming, so you will surely have a lot of nice and inspiring conversations between the talks – and in the evenings too, of course. ;) During the four days at the IndieWebCamp and beyond tellerand, I got to know so many nice and interesting people, and enjoyed the most diverse and inspiring talks, so that I left Düsseldorf deeply satisfied and full of new ideas (although they are only new combinations of old ones…). Thanks to everyone I had the chance to meet! See you in Berlin! ~ Have you published a response to this? Send me a webmention by letting me know the URL. Ping! 25 Webmentions mir Nanu two Bernie & Bernie's Mittens among BeyondTellerrand audience Der komische Typ verfolgt mich schon länger anscheinend; sogar auf meiner Lieblingskonferenz. (Original-Foto: M.Ott) Matthias Ott 23 May 2016 | 07:55 @m_ott Which is technically correct, because of the different sources, but still looks a bit strange / may not be easily comprehensible. Matthias Ott 23 May 2016 | 07:55 @m_ott Hm. @netzintelligenz now liked two tweets that mention the same article. That's why he appears twice in the #webmention section. Webrocker 23 May 2016 | 07:53 Beyond Tellerrand 2016 - Matthias Ott Matthias wrote a nice summary of this year's Beyond Tellerrand Conference in Düsseldorf: […] During the four days at the IndieWebCamp and beyond tellerand, I got to know so many nice and interesting people, and enjoyed the most diverse and inspiring talks, so that I left Düsseldorf deeply satisfied and full of new ideas (although they are only new combinations of old ones…). Thanks to everyone I had the ... beyond tellerrand 22 May 2016 | 22:45 “So why go there after all? […] The answer is: people.” This! Thanks, Matthias!twitter.com/m_ott/status/7… Likes Bea David Stefan Grund sascha assbach IndieWebCamp Christopher Murphy Sebastian Lasse ن Tinker Tom Ralf Göke Galla TomWithTheWeather codebear Joschi Kuphal 吉 beyond tellerrand Ralf Göke Christian Walter Valentin Wölm Pascal Orth Oliver Beckenhaub Reposts Christian Walter 18 May 2016 | 00:03 Pascal Orth 16 May 2016 | 17:28 More Articles Into the Personal-Website-Verse More and more people are rediscovering their personal websites as an alternative to social media that provides more control and freedom of expression. It's time to connect our sites even further and create a decentralized fabric of interconnected personal sites that enables each individual to engage in an open discussion – answering, challenging, and acknowledging the ideas of others through a universe of personal sites. Continue reading Saving Your Web Workflows with Prototyping Our static tools and linear workflows aren’t the right fit for the flexible, diverse reality of today’s Web. Making prototyping a central element of your workflows will radically change how you approach problem solving and save you a lot of headaches. But most importantly, you will be creating the right products and features in a way that resonates with the true nature of the Web. A discourse on processes, flexibility, the Web as a material, and how we build things. Continue reading'''
