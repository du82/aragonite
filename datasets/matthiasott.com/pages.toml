ott.com/articles/going… dirk döring If you care about your future web life, read this. Going Indie. matthiasott.com/articles/going… Steffen Rademacker Thanks a lot for that :) (und jetzt hab ich n Busta Rhymes Ohrwurm, nur weil ich Protect ya neck falsch gelesen hab… Clau di "We have lost control. Not only if you are part of a minority [...] you need to take action." #privacy matthiasott.com/articles/going… Dennis Frank What measures do you take to protect your privacy? — “Going Indie. Step 1: Securing Privacy” by @m_ott matthiasott.com/articles/going… Sven Read First part of @m_ott series on building a better & safer web for all. matthiasott.com/articles/going… Anselm Hannemann It’s up to us now to recognise the errors we make and amend the decisions to create a better … matthiasott.com/articles/going… by @m_ott Likes levent sönmez Marco Hengstenberg tom hermans Carolyn UpGuard Eddie Hinkle Michael Marquardt Samrat Chowdhery ryanshull Alessandro Piva Morris Brodersen Lu Fehr Benjamin Glock Jo Ippen Matthew Roach Lennart Ziburski Rodney Rehm Frederic Hemberger Steffen Rademacker Dennis Frank Joschi Kuphal 吉; Gunnar Bittersmann Marc Hinse Anselm Hannemann dirk döring Tom Tinkerson Florian Weil Reposts levent sönmez Holger Bartel Matthias Ott Going Indie. Step 2: Reclaiming Content Christian Walter baptiste aurenche Thomas gratier Sven Gunnar Bittersmann SELFHTML Jo Ippen Bastian Allgeier Marc Hinse Steffen Rademacker Dennis Frank Joschi Kuphal 吉; Tom Tinkerson Florian Weil More Articles Into the Personal-Website-Verse More and more people are rediscovering their personal websites as an alternative to social media that provides more control and freedom of expression. It's time to connect our sites even further and create a decentralized fabric of interconnected personal sites that enables each individual to engage in an open discussion – answering, challenging, and acknowledging the ideas of others through a universe of personal sites. Continue reading Saving Your Web Workflows with Prototyping Our static tools and linear workflows aren’t the right fit for the flexible, diverse reality of today’s Web. Making prototyping a central element of your workflows will radically change how you approach problem solving and save you a lot of headaches. But most importantly, you will be creating the right products and features in a way that resonates with the true nature of the Web. A discourse on processes, flexibility, the Web as a material, and how we build things. Continue reading'''
