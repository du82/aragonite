["https://matthiasott.com/notes/leaving-twitter-behind"]
title = "Leaving Twitter Behind · Matthias Ott"
description = "Matthias Ott is an independent user experience designer and developer from Stuttgart, Germany. Besides design practice he teaches Interface Prototyping at the Muthesius Academy of Fine Arts and Design, Kiel."
full_description = '''Leav­ing Twit­ter Behind Published by Matthias Ott Friday, 18 November 2022 #indieweb #open web #publishing #Twitter #websites Twitter is not well. Many of us were worried that Elon Musk might rapidly change the face of the platform. But only very few expected things to go down so rapidly. After the latest deadline to respond whether they want to stay, it looks like about 75 % of the remaining workforce has not opted in to the tech billionaire‘s “extremely hardcore” Twitter 2.0 and will therefore leave the company. From the outside, it all looks like a complete mess and that it’s only a matter of time until we see a data breach or a major outage, because nobody can guarantee the stability of the platform anymore. The Nest We Built For many of us, Twitter was a special place on the Web. It was the place where not only celebrities, politicians, or journalists were commenting on the latest trends in society. It was also the home of the majority of the Web community. On Twitter, we would meet people who shared our values and interests, we got to know peers in our industry, and many of the people we briefly tweeted with at first became good online – or even offline – friends over the years. Despite many questionable management decisions or problems with moderation, despite changes to the timeline and many failed attempts to introduce new features, Twitter prevailed because of the people on the platform who made this comparatively small social network relevant and interesting. Now that everything seems to go up in flames, people are posting farewell messages or are retweeting some of their favorite tweets for a last time. There are lots of emotions involved, which just shows that many of us would have loved to see this place thrive just a little longer. But what I also noticed is that many of those who are jumping ship and getting an account on Mastodon, are mentioning that “it feels like the early Twitter from 2009”. There was something missing that they now recognize while scrolling down a much calmer, chronological timeline again. Because, as sad as all this is, Twitter already had already become but a shadow of it’s former self. Many people had already turned their back on the attention-sucking algorithmic version of what had once been a place to have amazing conversations. Those who stayed didn’t do it because Twitter was becoming better, but because they still valued their remaining friends on the site and, maybe, also because they kept clinging to the memory of early Twitter, unwilling to let go. Maybe the Twitter we all loved was long gone, anyway. A Reset The end of Twitter as we know it might be a perfect time to take a step back and review our use of social media in general. Whenever a site like Twitter goes down, it takes a vast amount of data and a large chunk of our collective web history down with it. And that’s also true for all the other social media platforms people are now starting to use as alternatives. There is one place, however, that will stay with you whatever happens to all the platforms you post on: your personal website. So if you don’t have your own website yet, get a domain today, own your content, and publish on your own site. This doesn’t mean that you need to stop using social media or that you should use solely your website instead of other tools of communication. But think about the things that you would like to preserve or share that aren’t ephemeral and temporary. For those things, those thoughts, a personal website is the perfect place. Plus, it is the perfect playground to explore new web technologies or try out new stuff. The possibilities are endless. Spreading Our Wings In every ending there is a new beginning. The end of Twitter is also a huge opportunity to start something new and amazing, to build new communities and new tools for communicating online. It is a chance to explore new ways to connect our websites to each other, develop new formats for publishing our thoughts, or rediscover alternative ways to discover content, like RSS. And, if you look closely, you can already see and feel a spark of enthusiasm all around. People are linking to their blogs, are sending out their newsletters, or are suddenly reviving old side-projects. Almost as if they just needed permission to finally move on. The end of Twitter could prove to be a blessing for the Open Web. Or, to quote Brent Simmons: “The web is wide open again, for the first time in what feels like forever.” ~ Have you published a response to this? Send me a webmention by letting me know the URL. Ping! 40 Webmentions @matthiasott @matthiasott I like this little paradoxon &#x1f605; @matthiasott @matthiasott "... The end of Twitter as we know it might be a perfect time to take a step back and review our use of social media in general." Well, that's the main point, I guess. @matthiasott @matthiasott > There was something missing that they now recognize while scrolling down a much calmer, chronological timeline again. https://matthiasott.com/notes/leaving-twitter-behind Yeah, also back in 2005-2009 there was a sense of hanging out with friends, which is what Mastodon has been for me the last few years. It feels good! Leaving Twitter Behind · Matthias Ott – User Experience Designer Alexander Lehner See you on Mastodon &#x1f44d; Markus Eicher Thanks for this article, Matthias. &#x1f4aa; I like the positive tone and find it inspiring to see and embrace the chances there are. It not even depends on the final faith of #Twitter imo. The #Twitter desaster only accelerates the process of changing our thinking about the use of web. Stéphane Deschamps Nov 18, 2022, 11:07 Matthias Ott @matthiasott@mastodon.social ✍;️; New post: Leaving Twitter Behind #twittermigration https://matthiasott.com/notes/leaving-twitter-behind 1 Stéphane Deschamps @accessiblestef@toot.cafe Follow @matthiasott > There was something missing that they now recognize while scrolling down a much calmer, chronological timeline again. https://matthiasott.com/notes/leaving-twitter-behind Yeah, also back in 2005-2009 there was a sense of hanging out with friends, which is what Mastodon has been for me the last few years. It feels good! Nov 18, 2022, 11:24 · · Web · 0 · 0 · 0 Sign in to participate in the conversation @matthiasott > There was something missing that they now recognize while scrolling down a much calmer, chronological timeline again. https://matthiasott.com/notes/leaving-twitter-behind Yeah, also back in 2005-2009 there was a sense of hanging out with friends, which is what Mastodon has been for me the last few years. It feels good! Likes Marco Schaefer rtud Kristof Zerbe Donncha Ó Caoimh Malcolm Blaney Björn Jacob Moena ????;????; Piyush Chandwani :mastodon: Blueberry Michael Scharnagl Giant Meteor Cultist Alexander Lehner Kathy Carbone Maurice Campobasso Fernando Mateus Lippe Michelle Barker Markus Eicher Alexander Lehner Centurion Libros Chad Robinson Jérôme Gamez (@jerome@social.gamez.name) Marco Heine Reposts Matthias Ott Alexander Lehner Robert Vinet ????; ronin3510 Jeff T. Sane wccbh Holger Bartel Frederic Markus Eicher Centurion Libros Jérôme Gamez (@jerome@social.gamez.name) More Notes Owning It Continue reading Free Audio Plugins: Accusonus ERA 6 Bundle Continue reading'''
