title = "CSS Custom Properties With @property · Matthias Ott"
description = "Matthias Ott is an independent user experience designer and developer from Stuttgart, Germany. Besides design practice he teaches Interface Prototyping at the Muthesius Academy of Fine Arts and Design, Kiel."
full_description = 'CSS Cus­tom Prop­er­ties With @property Published by Matthias Ott Monday, 21 September 2020 #animation #css #custom properties #Houdini Una Kravets has written an excellent article about a feature that has been released with Chrome 85: The @property syntax of the Properties and Values API. The Properties and Values API is part of CSS Houdini, the next generation of additions to CSS allowing developers to extend the language directly at the engine level. With the @property syntax, you can declare a variable including a type, an initial value, and even control inheritance. This is how it looks like: @property --colorPrimary { syntax: "<color>"; initial-value: magenta; inherits: false; } The initial value ensures that if someone tries to give the --colorPrimary an invalid value that doesn’t match the type specified by syntax, like “20px” or “border-box”, there is still a fallback. But there is more. The new @property syntax fixes a fundamental problem of custom properties: You could not animate them. While it was possible to animate a property that used a custom property, it wasn’t possible to animate the custom property itself because the custom property was read as a string. Animating a background property, for example, would work: button { --color: green; background: var(--color); transition: background .4s ease; } button:hover { --color: blue; } But not if you wanted to apply the transition to the custom property, --color: button { --color: green; background: var(--color); transition: --color .4s ease; } button:hover { --color: blue; } With the new @property syntax, this now changes, because if you define a type (like length, number, percentage, color, and many more) for the custom property, the browser now knows how to transition it. The prime example that Una shows is that it is now possible to animate something that couldn’t be animated before: Gradients. See the Pen Gradient Transitions with @property by Matthias Ott (@matthiasott) on CodePen. .cp_embed_wrapper {margin: 0.5rem 0 2rem} When I played around with the feature myself, however, I noticed that using relative units like rems with a type of length did not work properly when I tried to calculate a font-size in Chrome 85. It worked well when I used an absolute length in px, though. Maybe I’m also overlooking something here – and if I am, please tell me – but it seems as if the new feature still needs a few more iterations until it fully works as expected. See the Pen @property Custom Property Test: rem font-size by Matthias Ott (@matthiasott) on CodePen. Once browser support has gotten better, the @property syntax might make many things around custom properties much more convenient. In particular when creating animations, the possibility to transition the computed value of the custom property will come in handy. - This is the 59th post of my 100 days of writing series. You can find a list of all posts here. ~ Have you published a response to this? Send me a webmention by letting me know the URL. Ping! 6 Webmentions Likes Jason Neel Bernd Artmüller ????; AlaaMU Alexey Reposts Michael Klöpzig Matthias Ott More Notes Owning It Continue reading Free Audio Plugins: Accusonus ERA 6 Bundle Continue reading'
