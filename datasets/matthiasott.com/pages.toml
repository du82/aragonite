title = "42 for 42 · Matthias Ott"
description = "Matthias Ott is an independent user experience designer and developer from Stuttgart, Germany. Besides design practice he teaches Interface Prototyping at the Muthesius Academy of Fine Arts and Design, Kiel."
full_description = "42 for 42 Published by Matthias Ott Monday, 8 January 2024 #life lessons #lists ol { list-style-position: outside; padding-left: 1em; } ol li { margin-bottom: 0.5em; } I’m turning 42 today and yes, I am as surprised about that number as you are. If 42 really is the answer to life, the universe, and everything, then maybe it makes sense to look back on what the old lad actually learned in all those years. So, here is a list of 42 life lessons, similar to the one Chris wrote when he was still 40. Incomplete and mostly unstructured. For my younger self as much as for my children and anyone reading this. Don’t panic. Love yourself. Take care of yourself. You can only help others if you are strong yourself. Love your family. Love your friends. Respect is everything. Be patient with yourself and others. Be generous. It will make others and you happy. Time is precious. Spend it with the people you love the most. Children grow up incredibly fast. Enjoy every moment you have with them. Be there. It is true: You will regret the things you didn’t do more than the things you did do. And time flies so much faster than you think. Before you know it, you won’t be able to do many of the things you thought you had an endless amount of time for. So do the things you dream of now. Don’t think small. Seriously, don’t. You can do more and be more than others make you think. Or, to quote Rick Rubin: “However you frame yourself as an artist, the frame is too small.” Even if you don’t want to admit it to yourself, you are still full of fear. Fear of being judged and criticized, fear of what others may think, fear of failure. And everyone around you is full of fear, too. It is one of the primary forces behind human action – or rather inaction. The fear will never go away completely. But the more you do things despite of being afraid, the easier they will become. Fear also means that what you are up to is actually important. Framing it as “excitement” also helps. Every time you do something you are afraid of, you will grow. So step out of your comfort zone. You will be fine. If you are enthusiastic about something, go for it. Go all in. Go deep. If you have an idea, write it down immediately. Don’t try to remember it. You will forget it. Don’t let other people tell you what you are good at or who you are. You can do and learn almost anything. Follow your curiosity. The older you get, the more you’ll find out about who you are. This is fun (most of the time). There is a beast in all of us. Be aware of that. Controlling your emotions and your anger will make you a better person. We all make mistakes along the way. A lot of mistakes. That’s okay as long as we constantly try to learn from them. Remember: The first draft of anything is shit. You don’t have to be friends with everyone. Some people are just different than you, a very few are toxic. There is no need to pander to them or trying to please them. Do your taxes in time. You cannot know what works and what sticks. So play and try out everything. Never stop prototyping. Getting started is more important than finding the right productivity method or framework or tool. Start today and try to optimize along the way. Football is life. The rest is mere details. Write as much as you can. It clarifies your thinking, it makes you a better communicator, and it will open so many doors. Also: there is no such thing as writers block. Don’t be scared to write in a language that is not your first language. You’ll grow. Enjoy the process. It will not only lead to better outcomes, but it will also make you happier. The journey really is the reward. Don’t work for assholes. Be very careful in what you say yes to. In the beginning of your career, you’ll probably have to say yes more often, but you’ll actually also learn a lot from whatever you will do. Later, you should only say yes if you feel good about it. Learn to politely say no to everything else. Pay attention to your gut feeling. It is a good indicator and often there is some truth to it, especially with growing experience. If you don’t have a good feeling about something, take a second to investigate and identify why that is. Don’t spend your money on useless things. Be very careful about what to buy. If possible, don’t pick the cheapest option. If you can afford it, investing in better food, better furniture, or tools always pays off. All designers should learn how to code. Everyone should. Our brain is fascinating and highly malleable up into old age. But it is also fragile. So take good care of it. Your body will age. It really, actually will. You can’t start to take care of it soon enough. Exercise. Eat much, much, much more plants. This hasn’t anything to do with being a vegetarian, a vegan, or any other box you think people will put you into. No, it will actually make you healthier, happier, and stronger. There are billions of bacteria in your gut that influence what food you like, how well your immune system works, and how happy you are. They weigh about as much as your brain. Feeding them with good stuff will make you happy. Smoking is a really stupid idea. Alcohol is completely unnecessary. As much as your parents, your family, your friends, society, and, above all, advertising want to make you think it is something that everyone does and a beer here and there is totally fine, it will slowly creep into your daily habits and constantly occupy your liver, which then can’t take care of the other stuff. It will disrupt your sleep and destroy all positive effects of the little exercise or sports you have time for. Any amount of it also kills your cells. Everywhere in your body and in your brain. Just don’t buy it anymore. You will feel so much better. Coffee is great. Try not to drink it in the first 1.5 hours after getting up and four hours before bed time. Sleep is not the cousin of death. Sleep deprivation is. Sorry, Nas. Sleep at least 6.5 to 8 hours a night. Listen to as much music as you possibly can. RTJ! 👉🏻🤛🏿 If you learn an instrument, try to play it at often as possible. Once it becomes second nature, you will be able to do magical things with it. Don’t do it like me and try to do only what’s necessary. Try to master it. Mastering something takes time and a lot of practice. Don’t believe you can do something only because you are “talented”. If you don’t put in the time and effort, you won’t become great at it. Farts are hilarious. Get a personal website. When in doubt, make a list. If it turns out to be longer than expected and you still feel like you can’t cut it down, great! ~ Have you published a response to this? Send me a webmention by letting me know the URL. Ping! 69 Webmentions Cam Pegg Forty-fucking-seven. Damn, dude. I’m at the point where it’s starting to stretch the truth to say that I’m in my mid-forties, which is more than a little weird to think about. Anyway, I’ve always enjoyed reading peoples’ birthday lists (Kevin Kelly, Ben Werdmuller, Matthias Ott, for example), so as I begin my forty-eighth trip around the sun, I thought I’d put one of my own together. With only a ... @matthiasott @matthiasott Alles Gute! &#x1f389; So viele gute Ideen in der Liste. Kann ich alles unterschreiben. @matthiasott @matthiasott I like 44 a lot! ♥️ @matthiasott @matthiasott Wonderful list, happy birthday! @matthiasott @matthiasott is this available on medium? (kidding) happy belated birthday! @matthiasott @matthiasott alles Gute! @matthiasott @matthiasott Häppi Börsdai! @sarajw @sarajw Sänk Juh! &#x1f64f;&#x1f601; @hexagoncircle @hexagoncircle Thanks a lot, Ryan! &#x1f917; @matthiasott @matthiasott Great list and a very happy birthday to you! &#x1f973; @noleli @noleli Thank you, Noah! ???? @jeremy @jeremy Thanks, Jeremy! ???? @matthiasott @matthiasott very happy birthday! @matthiasott @matthiasott Happy Birthday! &#x1f382; @matthiasott @matthiasott Happy birthday, Matthias!&#x1f389;&#x1f389; @shadeed9 @shadeed9 Thank you, Ahmad! &#x1f64f; Hope you’re well! @helhum @helhum Freut mich, dass er Dir gefallen hat! ???? @matthiasott @matthiasott Wunderbarer Artikel, danke! @matthiasott @matthiasott While reading, this suddenly appeared in my mind: https://www.youtube.com/watch?v=S-YsGdjkIgw (only people our age will remember this song &#x1f643;) Everybody's Free (To Wear Sunscreen) @fernandomateus @fernandomateus &#x1f601; Thank you, Fernando! Have a great day as well! @pawelgrzybek @pawelgrzybek Thank you, Paweł! &#x1f917; @matthiasott @matthiasott Happy birthday, Matthias &#x1f917; Look at you, I was 15 when you were born, and now you’re teaching me about personal websites and lots of other things. Wish you a great day &#x1f973; @matthiasott @matthiasott happy birthday Matthias. Awesome list! @matthiasott @matthiasott alles Gute! Hoffe du hast einen wunderbaren Tag. Willkommen im 42er Club! @nilsbinder @nilsbinder Vielen lieben Dank, Nils! &#x1f917; Hoffe Du hast ebenfalls einen wunderbaren Tag und bist gut ins neue Jahr gekommen! @matuzo @matuzo Vielen Dank! Einen wunderschönen Tag Dir und der Family! &#x1f917;&#x1f389; @mia @mia Thank you, Miriam! &#x1f917; @mwichary @mwichary Thank you, Marcin! &#x1f917; @matthiasott @matthiasott Alles Gute zum Geburtstag!&#x1f382;&#x1f389;❤️ @matthiasott @matthiasott Happy Birthday &#x1f973; @matthiasott @matthiasott Thanks for this! I'm certainly far from being your age at this point, but I will definitely be bookmarking this for later! @matthiasott @matthiasott Happy birthday! Likes Matt Stein Jeff Triplett Max Böck Sara Joy to the World ✨ Metamere Johnny Hill ✌️ Calum Ryan Björn Timo Tijhof Ondrej Sevcik Ahmad Shadeed Helmut Hummel ???? Fernando Mateus ???? Attila Gonda Nils Binder Binh ATL Manuel Matuzović Sathish Paul Miriam (still) Apple Annie :prami: Noah Jacobus Patrick Boivin Zach Leatherman :verify: Thomas Randolph :thomas: Lynn Fisher Reposts Matt Stein Jeremy Neander Matthias Ott It's a me, Mauro Helmut Hummel ???? Christoph Zillgens Michael Sean Becker Manuel Matuz