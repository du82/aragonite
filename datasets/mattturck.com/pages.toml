description = "My colleague Shivon Zilis has been obsessed with the Terry Kawaja chart of the advertising ecosystem for a while, and a few weeks ago she came up with the great idea of creating a similar one for the big data ecosystem.  Initially, we were going to do this as an internal exercise to make sure we und"
full_description = "A chart of the big data ecosystem TwitterLinkedinFacebook My colleague Shivon Zilis has been obsessed with the Terry Kawaja chart of the advertising ecosystem for a while, and a few weeks ago she came up with the great idea of creating a similar one for the big data ecosystem. Initially, we were going to do this as an internal exercise to make sure we understood every part of the ecosystem, but we figured it would be fun to “open source” the project and get people’s thoughts and input. So here is our first attempt. A few things became apparent very quickly: 1) Many companies don’t fall neatly into a specific category 2) There’s only so many companies we can fit on the chart — subcategories as NoSQL or advertising applications, for example, would almost deserve their own chart. 3) The ecosystem is evolving so quickly that we’re going to need to update the chart often – companies evolve (e.g., Infochimps), large vendors make aggressive moves in the space (VMWare with Serengeti and the Citas acquisition) What do you think? (click on the bottom right to expand) TwitterLinkedinFacebook Posted on June 29, 2012August 20, 2015Categories Big Data Upendra Shardanand says: June 29, 2012 at 3:19 pm Hi Matt – I’d add Daylife under Applications / publishers tools — Big Data x Big Content. IMHO 🙂 Reply mattturck says: July 2, 2012 at 1:30 pm That is very interesting Upendra. Had missed the Big Data angle to Daylife — in what way(s) are you a big data company? Reply Francois says: June 29, 2012 at 3:29 pm Yes ! That was badly needed ! I would add SAP in cross infrastructure / analytics category (in this context, specially because of their solution HANA = real-time, big data). Reply dataAngel says: July 2, 2012 at 5:10 pm HANA isn’t truly a Big Data offering since they are in-memory and limited to only 1TB as a result. Reply Sam says: June 29, 2012 at 3:43 pm I’d suggest adding python / scikit – learn under the open source stat packages. Reply Cathy says: June 29, 2012 at 3:44 pm Upon first glance, you may consider adding Pervasive Software, Cirro, and Kitenga to Analytics Solutions, FeedZai and ParStream to Real-Time, IBM Infosphere BigInsights and Greenplum HD/MR to Hadoop Related, Actuate and Quantum 4D to Data Visualization. Will suggest more later. Cathy Reply"
