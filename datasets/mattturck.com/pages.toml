title = "AI – Matt Turck"
description = "VC at FirstMark"
full_description = "AI in 2024: Never a Dull Moment In AI, it’s been the year of big, bigger and biggest. My colleague Aman Kabeer and I just did a fun episode of The MAD Podcast where we discussed what we’re seeing in the market, our favorite trends and new stories, and where we see things going. Here’s the video, and I summarized below a few highlights: Continue reading “AI in 2024: Never a Dull Moment” Posted on November 10, 2024November 11, 2024Categories AILeave a comment on AI in 2024: Never a Dull Moment Is SaaS dead? Many SaaS stocks have been getting clobbered in public markets. Some see the “end of software“. Is SaaS dead? What seems to be happening: tough macro, cost cutting AI sucking the air out of the room SaaS vendors perceived as “last generation” despite best efforts to add AI quickly enterprise budgets for AI are not net new, they’re taken from somewhere (SaaS budgets cut) Bulk of budgets going to OpenAI/Azure etc because low hanging fruit to “do AI” (knowledge bot, coding) for the more specialized enterprise apps, customers feel like they can/should “build” internally rather than “buy” What happens next: customers realize that “build” is a headache, not always the best option OpenAI / Azure etc can’t / doesn’t want to build hundreds of problem specific/ vertical specific apps Takes time, but legacy and new SaaS companies truly become AI-first (not just marketing), abstract away complexity of deploying LLMs macro environment eventually rebounds AIaaS becomes the new SaaS – what is old is new (unedited Sat morning thoughts) Question is what happens to all current SaaS unicorns and public companies as this transition happens (unedited Saturday morning thoughts) Posted on June 8, 2024June 8, 2024Categories AILeave a comment on Is SaaS dead? MAD 2024: Trends in AI & Data (video) As a companion to the 2024 MAD (ML, AI & Data) Landscape (blog post, PDF, interactive website), my colleague Aman and I had a fun chat about some key trends we see in data and AI. Some topics we covered: The impact of open source in AI The future of AI agents Where are we in the AI hype cycle? The emerging AI stack Will AI kills SaaS? Is the Modern Data Stack dead? Continue reading “MAD 2024: Trends in AI & Data (video)” Posted on June 8, 2024June 8, 2024Categories AILeave a comment on MAD 2024: Trends in AI & Data (video)"
