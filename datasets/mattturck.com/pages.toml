title = "IPO – Matt Turck"
description = "VC at FirstMark"
full_description = "Quick S-1 Teardown: Cerebras Look up in the sky! It’s a bird! It’s a plane! It’s… an IPO. The Cerebras S-1 filing is interesting in many ways, but certainly one is that, well, it is an (upcoming) IPO in the first place. In a context where tech IPOs have been at an all time low, with a very modest uptick in 2024 (Reddit, Rubrik, etc), the fact that a VC-backed tech startup has filed is rare enough to be exciting and newsworthy on its own. The other unmistakable part of the filing is that Cerebras is a “pure play AI” company, in a context where there’s been a dearth of such companies in public markets, outside of Palantir and arguably a couple of others, like C3 AI or recent entrants like Tempus AI and Astera Labs. For the most part, public market investors have had very limited options to play the Generative AI wave: essentially NVIDIA, and indirect bets on AI through the hyperscalers. (This scarcity of AI stocks and to some extent, data infra stocks, is a reality we captured in 2021 through our MAD Public Company Index, that will soon be worth updating as hopefully more IPOs happen). Continue reading “Quick S-1 Teardown: Cerebras” Posted on October 1, 2024October 2, 2024Categories IPOLeave a comment on Quick S-1 Teardown: Cerebras Quick S-1 Teardown: Klaviyo Is this it? Are we back? Everyone in the startup and venture world has been waiting for months for the re-opening of the IPO window. After a record breaking 2021 (1035 IPOs, beating the previous record of 480 in 2020), 2022 saw a dramatic decline (181 IPOs) and 2023 so far has not been much better. Common wisdom in the market over the last few months has been that Q4 2023 would be the time the IPO window would cautiously re-open for technology companies (recent non-tech IPOs like restaurant chain Cava being considered non-representative). And it would be crucial that some of the very best companies (the usual suspects being Stripe, Databricks and Instacart) would go out first, to pave the way for a bigger wave of quality companies right behind them. Well, this week has been an exciting one – on Monday, ARM filed its F-1 (here) and just today (Friday August 25), both Instacart (here) and Klaviyo (here) filed their S-1s. It’s going to be exciting to see what happens this Fall in IPO land. New IPO filings also mean fresh opportunities for the time-honored VC tradition of S-1 breakdowns, even though timing is unfortunate given summer vacation schedule – here and here. Consistent with my general investing focus on data and ML/AI, I’m going to pick Klaviyo for this first breakdown of 2023, as it’s a heavily data-driven business. As I did in the past (see the S-1 quick teardowns for Snowflake, Palantir, Confluent, C3, nCino), this is meant as a QUICK breakdown – mostly unedited notes and off-the-cuff thoughts, in bullet point format. Let’s dig in. Continue reading “Quick S-1 Teardown: Klaviyo” Posted on August 25, 2023September 2, 2023Categories IPO4 Comments on Quick S-1 Teardown: Klaviyo"
