["https://mattturck.com/data2021"]
title = "Red Hot:  The 2021 Machine Learning, AI and Data (MAD) Landscape – Matt Turck"
description = """
Full resolution version of the landscape image here







It’s been a hot, hot year in the world of data, machine learning and AI. 



Just when you thought it couldn’t grow any more explosively, the data/AI landscape just did: rapid pace of company creation, exciting new product and project launch"""
full_description = "Red Hot: The 2021 Machine Learning, AI and Data (MAD) Landscape TwitterLinkedinFacebook Full resolution version of the landscape image here It’s been a hot, hot year in the world of data, machine learning and AI. Just when you thought it couldn’t grow any more explosively, the data/AI landscape just did: rapid pace of company creation, exciting new product and project launches, a deluge of VC financings, unicorn creation, IPOs, etc. It has also been a year of multiple threads and stories intertwining. One story has been the maturation of the ecosystem, with market leaders reaching large scale and ramping up their ambitions for global market domination, in particular through increasingly broad product offerings. Some of those companies, such as Snowflake, have been thriving in public markets (see our MAD Public Company Index), and a number of others (Databricks, Dataiku, Datarobot, etc.) have raised very large (or in the case of Databricks, gigantic) rounds at multi-billion valuations and are knocking on the IPO door (see our Emerging MAD company Index – both indexes will be updated soon). But at the other end of the spectrum, this year has also seen the rapid emergence of a whole new generation of data and ML startups. Whether they were founded a few years or a few months ago, many experienced a growth spurt in the last year or so. As we will discuss, part of it is due to a rabid VC funding environment and part of it, more fundamentally, is due to inflection points in the market. In the last year, there’s been less headline-grabbing discussion of futuristic applications of AI (self-driving vehicle, etc.), and a bit less AI hype as a result. Regardless, data and ML/AI-driven application companies have continued to thrive, particularly those focused on enterprise use cases. Meanwhile, a lot of the action has been happening behind the scenes on the data and ML infrastructure side, with entire new categories (data observability, reverse ETL, metrics stores, etc.) appearing and/or drastically accelerating. To keep track of this evolution, this is our eighth annual landscape and “state of the union” of the data and AI ecosystem – co-authored this year with my FirstMark colleague John Wu. (For anyone interested, here are the prior versions: 2012, 2014, 2016, 2017, 2018, 2019 (Part I and Part II) and 2020.) For those who have remarked over the years how insanely busy the chart is, you’ll love our new acronym – Machine learning, Artificial intelligence and Data (MAD) – this is now officially the MAD landscape! We’ve learned over the years that those posts are read by a broad group of people, so we have tried to provide a little bit for everyone – a macro view that will hopefully be interesting and approachable to most; and then a slightly more granular overview of trends in data infrastructure and ML/AI for people with deeper familiarity with the industry. This (long!) post is organized as follows: The macro view: making sense of the ecosystem’s complexityFinancings, IPOs and M&A The 2021 landscape — for those who don’t want to scroll down, *** HERE IS THE LANDSCAPE IMAGE IN HIGH RESOLUTION***Key trends in data infrastructureKey trends in analytics & enterprise AI Quick notes: My colleague John and I are early stage VCs at FirstMark, and we invest very actively in the data/AI space. Our portfolio companies are are noted with an (*) in this postWe run a big meetup-type series called Data Driven NYC – if you want to join our events by Zoom (or attend when we resume in-person events, hopefully soon), enter your email address on this page: Data Driven NYCYou can also *subscribe* to our YouTube channel Let’s dig in. The Macro View: Making Sense of the Ecosystem’s Complexity Let’s start with the high level view of the market. As the number of companies in the space keeps increasing every year, the inevitable questions are: why is this happening? How long can it keep going? Will the industry go through a wave of consolidation? Rewind: The Megatrend Readers of prior versions of this landscape will know that we are relentlessly bullish on the data/AI ecosystem. As we said in prior years, the fundamental trend is that every company is becoming not just a software company, but also a data company. Historically, and still today in many organizations, data has meant transactional data stored in relational databases, and perhaps a few dashboards for basic analysis of what happened to the business in recent months. But companies are now marching towards a world where data and artificial intelligence are embedded in myriad internal processes and external applications, both for analytical and operational purposes. This is the beginning of the era of the intelligent, automated enterprise – where company metrics are available in real time, mortgage applications get automatically processed, AI chatbots provide customer support 24/7, churn is predicted, cyber threats are detected in real time, supply chains automatically adjust to demand fluctuations, etc. This fundamental evolution has been powered by dramatic advances in underlying technology – in particular a symbiotic relationship between data infrastructure on the one hand, and machine learning and AI on the other. Both areas have had their own separate history and constituencies, but have increasingly operated in lockstep over the last few years. The first wave of innovation was the “Big Data” era, in the early 2010s, where innovation focused on building technologies to harness the massive amounts of digital data created every day. Then, it turned out that if you applied Big Data to some decade-old AI algorithms (deep learning), you got amazing results, and that triggered the whole current wave of excitement around AI. In turn, AI became a major driver for the development of data infrastructure: if we can build all those applications with AI, then we’re going to need better data infrastructure – and so on and so forth. Fast forward to 2021, the terms themselves (Big Data, AI, etc.) have experienced the ups and downs of the hype cycle, and today you hear a lot of conversations around automation, but fundamentally this is all the same megatrend. The Big Unlock A lot of today’s acceleration in the data/AI space can be traced to the rise of cloud data warehouses (and their lakehouse cousins, more on this later) over the last few years. It is ironic because data warehouses address one of the most basic, pedestrian but also fundamental needs in data infrastructure: where do you store it all? Storage and processing are at the bottom of the data/AI “hierarchy of needs” – see Monica Rogati’s famous blog post here – meaning, what you need to have in place before you can do any fancier stuff like analytics and AI. You’d figure that, 15+ years into the whole Big Data revolution, that need had been solved a long time ago, but it hadn’t. In retrospect, the initial success of Hadoop was a bit of a headfake for the space — Hadooop, the OG Big Data technology, did try to solve the storage and processing layer. It did play a really important role in terms of conveying the idea that real value could be extracted from massive amounts of data, but its overall technical complexity ultimately limited its applicability to a small set of companies, and it never really achieved the market penetration that even the older data warehouses (e.g. Vertica) had a few decades ago. Today, cloud data warehouses (Snowflake, Amazon Redshift and Google BigQuery) and lakehouses (Databricks) provide the ability to store massive amounts of data in a way that’s useful, not completely cost-prohibitive and doesn’t require an army of very technical people to maintain. In other words, after all these years, it is now finally possible to store and process Big Data. That is a big deal, and has proven to be a major unlock for the rest of the data/AI space, for several reasons. First, the rise of data warehouses considerably increases market size not just for its category, but for the entire data and AI ecosystem. Because of their ease of use and consumption-based pricing (where you pay as you go), data warehouses become the gateway to every company becoming a data company. Whether you’re a Global 2000 company or an early stage startup, you can now get started building your core data infrastructure with minimal pain. (Even FirstMark, a venture firm with several billion under management and 20-ish team members, has its own Snowflake instance). Second, data warehouses have unlocked an entire ecosystem of tools and companies that revolve around them: ETL, ELT, reverse ETL, warehouse-centric data quality tools, metrics stores, augmented analytics, etc. Many refer to this ecosystem as the “modern data stack” (which we discussed in our 2020 landscape). A number of founders saw the emergence of the modern data stack as an opportunity to launch new startups, and it is no surprise that a lot of the feverish VC funding activity over the last year has focused on modern data stack companies. Startups that were early to the trend (and played a pivotal role in defining the concept) are now reaching scale, including DBT Labs, a provider of transformation tools for analytics engineers (see our Fireside Chat with Tristan Handy, CEO of DBT Labs and Jeremiah Lowin, CEO of Prefect) and Fivetran, a provider of automated data integration solutions that streams data into data warehouses (see our Fireside Chat with George Fraser, CEO of Fivetran), both of which raised large rounds recently (see Financing section). Third, because they solve the fundamental storage layer, data warehouses liberate companies to start focusing on high-value projects that appear higher in the hierarchy of data needs. Now that you have your data stored, it’s easier to focus in earnest on other things like real-time processing or augmented analytics or machine learning. This in turn increases market demand for all sorts of other data and AI tools and platforms. A flywheel gets created where more customer demand creates more innovation from data and ML infrastructure companies. As they have such a direct and indirect impact on the space, data warehouses are an important bellwether for the entire data industry – as they grow, so does the rest of the space. The good news for the data and AI industry is that data warehouses and lakehouses are growing very fast, at scale. Snowflake, for example, showed a 103% year-over-year growth in their most recent Q2 results, with an incredible net revenue retention of 169% (which means that existing customers keep using and paying for Snowflake more and more over time). Snowflake is targeting $10B in revenues by 2028. There’s a real possibility they could get there sooner. Interestingly, with a consumption-based pricing where revenues start flowing only after the product is fully deployed, the company’s current customer traction could be well ahead of its more recent revenue numbers. This could certainly be just the beginning of how big data warehouses could become. Some observers believe that data warehouses and lakehouses, *collectively*, could get to 100% market penetration over time (meaning, every relevant company has one), in a way that was never true for prior data technologies like traditional data warehouses such as Vertica (too expensive and cumbersome to deploy) and Hadoop (too experimental and technical). While this doesn’t mean that every data warehouse vendor, and every data startup, or even market segment, will be successful, directionally this bodes incredibly well for the data/AI industry as a whole. The Titanic Shock: Snowflake vs Databricks Snowflake has been the poster child of the data space recently. Their IPO in September 2020 was the biggest software IPO ever (we had covered it at the time in our Quick S-1 Teardown: Snowflake). At the time of writing, and after some ups and downs, it is a $95B market cap public company. However, Databricks is now emerging as a major industry rival. On August 31st, the company announced a massive $1.6B financing round at a $38B valuation, just a few months after a $1B round announced in February 2021 (at a measly $28B valuation). Up until recently, Snowflake and Databricks were in fairly different segments of the market (and in fact were close partners for a while). Snowflake, as a cloud data warehouse, is mostly a database to store and process large amounts of structured data – meaning, data that can fit neatly into rows and columns. Historically, it’s been used to enable companies to answer questions about past and current performance (“which were our top fastest growing regions last quarter?”), by plugging in business intelligence (BI) tools. Like other databases, it leverages SQL, a very popular and accessible query language, which makes it usable by millions of potential users around the world. Databricks came from a different corner of the data world. It started in 2013 to commercialize Spark, an open source framework to process large volumes of generally unstructured data (any kind of text, audio, video etc). Spark users used the framework to build and process what became known as “data lakes”, where they would dump just about any kind of data without worrying about structure or organization. A primary use of data lakes was to train ML/AI applications, enabling companies to answer questions about the future (“which customers are the most likely to purchase next quarter?”, i.e. predictive analytics). To help customers with their data lakes, Databricks created Delta, and to help them with ML/AI, it created ML Flow. For the whole story on that journey, see my Fireside Chat with Ali Ghodsi, CEO, Databricks. More recently, however, the two companies have converged towards one another. Databricks started adding data warehousing capabilities to its data lakes, enabling data analysts to run standard SQL queries, as well as adding business intelligence tools like Tableau or Microsoft Power BI. The result is what Databricks calls the “lakehouse” – a platform meant to combine the best of both data warehouses and data lakes. As Databricks made its data lakes look more like data warehouses, Snowflake has been making its data warehouses look more like data lakes. It announced support for unstructured data such as audio, video, pdfs, imaging data in November 2020 and launched it in preview just a few days ago. And where Databricks has been adding BI to its AI capabilities, Snowflake is adding AI to its BI compatibility. Snowflake has been building close partnerships with top enterprise AI platforms. Snowflake invested in Dataiku, and named it its Data Science Partner of the Year. It also invested in ML platform rival DataRobot. Ultimately, both Snowflake and Databricks want to be the center of all things data: one repository to store all data, whether structured or unstructured, and run all analytics, whether historical (business intelligence) or predictive (data science, ML/AI). Of course, there’s no"
