["https://mattturck.com/category/uncategorized"]
title = "Uncategorized – Matt Turck"
description = "VC at FirstMark"
full_description = "Synthesia’s Series C – And a Few Lessons Learned Building a Generative AI Startup Synthesia, the market leader in AI video generation, is announcing this morning an exciting $90M Series C financing. This is a great milestone for the company, making it a newly-minted unicorn and adding strong new partners (Accel, Nvidia, and some great individuals) to the team. Beyond the fundraising momentum and accolades, however, Synthesia has first and foremost been building a really impressive business. Over 35% of the Fortune 100 now use Synthesia’s enterprise offering, and over 50,000 businesses use its self-serve product. Much to their credit, the company’s founders (Victor, Steffen, Lourdes and Matthias) were very early to the Generative AI wave, starting the company at a time (2017) when there was significant technology risk and limitations, to the point that what they were doing was probably a bit weird, if not outright crazy. Several years later, by the time FirstMark led the Series A early 2021, the term “generative AI” was still not a thing – my blog post announcing the round used the term “video as code” and in my 2021 MAD landscape, Synthesia appeared in a box we called “synthetic media”, for lack of a better term. Anecdotally, this Series C is another example of the growth market showing some sign of life lately, at least for A+ companies, in the same vein as Pigment’s recent announcement, albeit perhaps less surprisingly given the hype around Generative AI. Given the explosion of Generative AI and the flood of brand new startups that were created in the space over the last 6 months, there are interesting early lessons to learn from Synthesia’s journey so far: Continue reading “Synthesia’s Series C – And a Few Lessons Learned Building a Generative AI Startup” Posted on June 13, 2023June 13, 2023Categories UncategorizedLeave a comment on Synthesia’s Series C – And a Few Lessons Learned Building a Generative AI Startup Pigment’s Series C – And a Few Thoughts on the Growth Market Pigment just closed an exciting $88M Series C (TechCrunch coverage here). The company is rapidly emerging as the global leader in the next generation of business planning platforms (aka Anaplan replacement), a testament to the power of a world-class team delivering great execution consistently over years. While we at FirstMark are certainly excited to have been a part of the journey as investors since the seed round, this round is also noteworthy in terms of what it may (or may not) signal about the broader market. A few thoughts: Growth market: The last 18 months have been incredibly slow in the growth market. Yet this growth round at Pigment was completely preemptive, and highly competitive, involving a number of top firms. What does it mean for the growth market? Maybe it’s an example of continued flight to quality during a downmarket phase – investors seeking A+ companies. But maybe it’s also a sign of the growth market coming back to life, progressively. I certainly get an impression, talking to my growth friends, that everyone is antsy to do more deals after largely sitting on their hands for the last 18 months, and the market has recalibrated somewhat to more reasonable levels. The obvious caveat is that one shouldn’t derive pattern from a small n, but anectodally, another portfolio company of mine will also announce a growth round soon. Continue reading “Pigment’s Series C – And a Few Thoughts on the Growth Market” Posted on June 8, 2023June 8, 2023Categories UncategorizedLeave a comment on Pigment’s Series C – And a Few Thoughts on the Growth Market"
