title = "“In Conversation” Series – Matt Turck"
description = "VC at FirstMark"
full_description = 'In Conversation with Florian Douetteau, Co-Founder & CEO, Dataiku (podcast + video) An overnight success 10 years in the making, Dataiku, the leading enterprise AI platform targeting Global 2000 companies, was named “Partner of the Year” for data science, machine learning and AI by BOTH Snowflake and Databricks at their respective annual summit a few days ago. The company, in which we’ve been proud investors since leading the Series A in 2016, has scaled impressively over the years, reaching $200M in ARR at the end of 2022, with a team of over 1,200 people. It was a pleasure welcoming back CEO Florian Douetteau, for a conversation where we covered: * Dataiku’s centralized approach to enterprise AI * Emerging use cases for Generative AI in the enterprise * Some leadership lessons learned along the way Here are the links to the podcast (subscribe! give us 5 stars! etc), and the YouTube video: Continue reading “In Conversation with Florian Douetteau, Co-Founder & CEO, Dataiku (podcast + video)” Posted on July 9, 2023July 9, 2023Categories "In Conversation" Series, Data Driven NYCLeave a comment on In Conversation with Florian Douetteau, Co-Founder & CEO, Dataiku (podcast + video) In Conversation with Spencer Kimball, CEO, Cockroach Labs Cockroach Labs, the ambitious database company with a funny name, has gone from strength to strength over the last few years. Started with three ex-Googlers in 2014, it successfully navigated in its early years the perilous waters of being an early database company that customers need to trust for mission-critical applications. Over time, it’s gained tremendous momentum with a now long list of marquee customers, and was most recently valued at $5B. In part because we at FirstMark are proud investors in the company, we’ve featured Cockroach Labs several times at Data Driven NYC over the years: in 2014 (video), 2018 (video) and 2020 (video), and it’s been really fun to see their tremendous progress. It was great to host CEO Spencer Kimball once again and check in on the latest, as well as lessons learned building a successful open source enterprise software company. We covered a bunch of really interesting things, including: The origins of the companyThe evolution of the database market from SQL to NoSQL to NewSQL to cloudThe current opportunity around serverlessOpen source license questionsGo to market: community led, bottoms up, top down?Who’s the perfect first sales hire for an enterprise software company Video and transcript below! Continue reading “In Conversation with Spencer Kimball, CEO, Cockroach Labs” Posted on November 17, 2022November 17, 2022Categories "In Conversation" Series, Data Driven NYCLeave a comment on In Conversation with Spencer Kimball, CEO, Cockroach Labs'
