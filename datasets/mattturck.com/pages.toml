full_description = "AI in 2024: Never a Dull Moment In AI, it’s been the year of big, bigger and biggest. My colleague Aman Kabeer and I just did a fun episode of The MAD Podcast where we discussed what we’re seeing in the market, our favorite trends and new stories, and where we see things going. Here’s the video, and I summarized below a few highlights: Continue reading “AI in 2024: Never a Dull Moment” Posted on November 10, 2024November 11, 2024Categories AILeave a comment on AI in 2024: Never a Dull Moment Quick S-1 Teardown: Cerebras Look up in the sky! It’s a bird! It’s a plane! It’s… an IPO. The Cerebras S-1 filing is interesting in many ways, but certainly one is that, well, it is an (upcoming) IPO in the first place. In a context where tech IPOs have been at an all time low, with a very modest uptick in 2024 (Reddit, Rubrik, etc), the fact that a VC-backed tech startup has filed is rare enough to be exciting and newsworthy on its own. The other unmistakable part of the filing is that Cerebras is a “pure play AI” company, in a context where there’s been a dearth of such companies in public markets, outside of Palantir and arguably a couple of others, like C3 AI or recent entrants like Tempus AI and Astera Labs. For the most part, public market investors have had very limited options to play the Generative AI wave: essentially NVIDIA, and indirect bets on AI through the hyperscalers. (This scarcity of AI stocks and to some extent, data infra stocks, is a reality we captured in 2021 through our MAD Public Company Index, that will soon be worth updating as hopefully more IPOs happen). Continue reading “Quick S-1 Teardown: Cerebras” Posted on October 1, 2024October 2, 2024Categories IPOLeave a comment on Quick S-1 Teardown: Cerebras Is SaaS dead? Many SaaS stocks have been getting clobbered in public markets. Some see the “end of software“. Is SaaS dead? What seems to be happening: tough macro, cost cutting AI sucking the air out of the room SaaS vendors perceived as “last generation” despite best efforts to add AI quickly enterprise budgets for AI are not net new, they’re taken from somewhere (SaaS budgets cut) Bulk of budgets going to OpenAI/Azure etc because low hanging fruit to “do AI” (knowledge bot, coding) for the more specialized enterprise apps, customers feel like they can/should “build” internally rather than “buy” What happens next: customers realize that “build” is a headache, not always the best option OpenAI / Azure etc can’t / doesn’t want to build hundreds of problem specific/ vertical specific apps Takes time, but legacy and new SaaS companies truly become AI-first (not just marketing), abstract away complexity of deploying LLMs macro environment eventually rebounds AIaaS becomes the new SaaS – what is old is new (unedited Sat morning thoughts) Question is what happens to all current SaaS unicorns and public companies as this transition happens (unedited Saturday morning thoughts) Posted on June 8, 2024June 8, 2024Categories AILeave a comment on Is SaaS dead?"
