title = "Internet of Things: Are We There Yet? (The 2016 IoT Landscape) – Matt Turck"
description = "Is the Internet of Things the world’s most confusing tech trend? On the one hand, we’re told it’s going to be epic, and soon – all predictions are either in tens of billions (of connected devices) and trillions (of dollars of economic value to be created). On the other hand, the dominant feeling exp"
full_description = "Internet of Things: Are We There Yet? (The 2016 IoT Landscape) TwitterLinkedinFacebook Is the Internet of Things the world’s most confusing tech trend? On the one hand, we’re told it’s going to be epic, and soon – all predictions are either in tens of billions (of connected devices) and trillions (of dollars of economic value to be created). On the other hand, the dominant feeling expressed by end users (including at this year’s CES show, arguably the bellwether of the industry) is essentially “meh” – right now the IoT feels like an avalanche of new connected products, many of which seem to solve trivial, “first world” problems: expensive gadgets that resolutely fall in the “nice to have” category, rather than “must have”. And, for all the talk about a mega tech trend, things seem to be moving at the speed of molasses, with little discernible progress year on year. Part of the problem is perhaps one of semantics. While gadgets are indeed part of the category (and quite often very large markets onto themselves), the Internet of Things (which we define as any “connected hardware” other than desktops, laptops and smartphones) is a much broader, and deeper, trend that cuts across both the consumer, enterprise and industrial spaces. Fundamentally, the Internet of Things is about the transformation of any physical object into a digital data product. Once you attach a sensor to it, a physical object (whether a tiny one like a pill that goes through your body, or a very large one like a plane or building) starts functioning a lot like any other digital product – it emits data about its usage, location and state; it can be tracked, controlled, personalized and upgraded remotely; and, when coupled with all the progress in Big Data and artificial intelligence, it can become intelligent, predictive, collaborative and in some cases autonomous. An entirely new way of interacting with our world is emerging. The importance of the IoT perhaps emerges more clearly when you think about it as the final chapter of “software eats the world”, where everything gets connected. Just as for the Big Data world, the annual update to our Internet of Things Landscape (scroll below for the 2016 version) is a great opportunity to check in on the industry. In 2013, we were trying to make sense of the Internet of Things; in late 2014, it seemed that the IoT had reached escape velocity. In 2016, the IoT space continues to hold considerable promise, but equally, and unsurprisingly, there’s no shortage of obstacles – there is a long road ahead and this trend will unfold over many years, possibly decades. What’s taking so long? Remember the Internet in 1999? Or, if you’re younger, mobile phones in 2007? This is essentially where the Internet of Things is today. In 1999, the Internet had already many signs of greatness (Google and Amazon were getting in full swing) but was often a frustrating experience (oh, the joys of “dialing up”), or possibly a scary one (putting my banking details into this website, really?). In 2007, mobile phones had already achieved many of the key progress (smaller form factor, Internet connectivity through WAP sites) and the first iPhone was just being released but it was hard to fully imagine the breadth of the smartphone revolution that was about to take place. The IoT today is largely at this inflection point where “the future is already here but it is not evenly distributed”. From ingestibles, wearables, AR/VR headsets to connected homes and factories, drones, autonomous cars and smart cities, a whole new world (and computing paradigm) is emerging in front of us. But as of right now, it just feels a little patchy, and it doesn’t always look good, or work great – yet. There are two broad categories of reasons that slow down progress. One is simply the general immaturity of the ecosystem – par for the course for any emerging space, where a lot of aspects need to be figured out at the same time. A fundamental aspect of the vision of the IoT is not just for devices to be connected to the Internet, but also for devices to be connected seamlessly to one another – but as of now, interoperability largely does not exist, a blatant and abundantly documented issue: too many standards and not enough people agreeing among them. There is a whole list of other difficult technical problems. Start with connectivity for example – it remains often surprisingly difficult to connect things to the Internet, particularly in industrial contexts (hot, humid environments with no cell or WiFi connectivity and/or far away from urban centers). A lot of Big Data related questions need to be figured out, including how to process data locally, at the sensor or network level (what’s known as “fog computing”, still an early space) to minimize the need to have to send gigantic amounts of data to the cloud – it is unclear whether the current data infrastructure would be able to withstand the tidal wave of data created by the IoT otherwise. Security and privacy issues are fundamentally important and companies are just starting to get a sense of the various ways trouble can appear – those concerns will increasingly move to the top of everyone’s agenda in the near future. Regulations and laws also need to adapt: with the emergence of drones/UAVs and autonomous vehicles, regulators are confronted with an entirely new set of problems and are understandably cautious. All of those are solvable problems, but finding solutions will require time. The other category of issues has to do with the fact that, unlike the Internet, the IoT has to deal not just with bits, but with atoms. The Internet was an unbelievably unique opportunity to invent a whole new universe online with remarkably little friction, as (almost) everything is software. In sharp contrast, the IoT has its feet firmly planted in our daily reality, and needs to deal with the laws of physics, distance and time. Before they can become those magically smart and collaborative products, connected devices are first and foremost hardware products. And, as many new IoT entrepreneurs and VCs have had to (re-)learn over the last 2 or 3 years, building a great hardware product takes a very long time. It’s also a very unforgiving process. As one can’t iterate as fast with hardware as with software, there’s no such thing as a Minimum Viable Product, or a “f*ck it, ship it” mentality in hardware. Once the product goes into manufacturing, there’s no turning back, and any mistake in design requires a redo that can cost months of delays. At least based on the conversations I have with entrepreneurs and VCs, it seems that it takes the average IoT startup a solid 18 to 24 months to actually ship their first product (my impression, not based on actual data). However hard it might be, shipping is only part of the battle, as distribution comes next – while online sales are great, to truly move units, a startup needs to work with retailers, who have their own priorities and time constraints. It may take another year or two until a startup has truly “nailed” distribution across multiple channels and start selling in large quantities. All of this also affects price: it is hard for IoT startups to offer cheap products because of the cost of the various hardware components and because retailers put additional pressure on margins – this in turns slows down consumer appetite (high price is the #1 deterrent to adoption of consumer IoT products according to this 2016 Accenture survey). Every startup wants to get as fast as possible to the critical mass stage where the product delivers an amazing experience through software, data and community and where the business starts benefitting from economies of scale and data network effects, but the tough reality is that many (most) startups today are in the trench warfare phase where they need to successfully deal with manufacturing and distribution. In addition, outside of new spaces such as AR, VR and drones, most new connected products are meant to replace existing “analog” objects. As a result, large-scale adoption of the IoT is going to be somewhat subjected to natural cycles of replacement of those existing products. Certainly, tech enthusiasts and other early adopters will not wait, but on the whole consumers and enterprises are unlikely to rip and replace their existing equipment overnight, particularly when it comes to more expensive items. Consumers may replace their phones every year or two, but locks, kitchen appliances and cars often last a decade or more. In the industrial world, machines can last 15 or 20 years. Of course, many startups have created solutions to retrofit their products on existing hardware, so there is a path to quicker adoption. But the gigantic upgrade required to truly transition to an IoT world may not be fully completed until connectivity is built natively into the next generations of homes (e.g. new condos coming with full home automation pre-installed), vehicles or factories. Some parts of the ecosystem may buck the trend and move comparatively faster. For example, there are reasons to believe that autonomous vehicles could arrive sooner than expected – some observers predict the emergence private/public partnerships allowing for the full-scale, real-life use of fully autonomous vehicles in pilot cities in the US in the next 12-18 moths. If something like this happened, this whole segment could accelerate quickly, particularly if manufacturers are able to prove that autonomous cars are in fact miuch safer than human drivers. But even so, our world’s infrastructure would need to evolve to allow for mass-scale adoption of autonomous cars, which would still take years (for interesting takes on this question, see here and here). Sustaining the startup “Big Bang” Progress may seem slow to end users, but the IoT startup ecosystem is booming. This is a broad market – in some ways a collection of distinct markets that have a lot in common, but also follow different dynamics to some extent. However, we see new companies appearing and young startups scaling across the board. As of the beginning of 2016, we are perhaps 3 or 4 years into an explosion of startup activity in the IoT (technically, the second one after an earlier false start), particularly on the consumer IoT side. Incubators (both hardware specific and now generalists like Y Combinator and Techstars) crank out legions of startups. Crowdfunding (despite not being the silver bullet it once appeared to be) provides early financing. The large Chinese contract manufacturers demonstrate openness to working with startups and sometimes invest in them. Service providers such as Dragon Innovation do a lot of hand holding. While the Silicon Valley engine keeps producing exciting companies, IoT entrepreneurship is a broader, more global phenomenon. Mattermark’s list of the top 100 IoT companies (here) has a majority (52 companies) located outside the Bay Area. In our 2016 IoT Landscape, over 150 companies are located outside the US. Anecdotally, there was a whopping 160 French startups represented at this year’s CES. And of course, China has become the workshop of the entire hardware world. Separately, it is also worth noting that hardware entrepreneurship is also comparatively diverse with many female CEOs in particular (see here). Venture capital dollars in the space have continued to increase: $1.8 billion in 2013, $2.59 billion in 2014 and $3.44 billion in 2015, according to CB Insights (whose list of IoT companies is less broad than our landscape). The number of deals has decreased slightly (307 in 2013, 380 in 2014 and 322 in 2015), presumably reflecting a natural evolution towards proportionally less seed deals and more dollars going towards a smaller number of later stage companies. As recently as 18 months ago, when the space was still very much in its infancy, there was a relative dearth of companies at the Series B (or later) level. But since the last version of our landscape, this has changed very noticeably, with a whole group of companies raising mid to late stage rounds, including for example: Sigfox ($115M Series D in February 2015), 3D Robotics ($50M Series C in Feb 2015), Peloton ($30M Series C in April 2015), Canary ($30M Series B in June 2015), littleBits ($47M Series B in July 2015), Netatmo ($33M Series B in November 2015), Athos ($35M Series C in November 2015), Greenwave ($45M Series C in January 2016), Jawbone ($165M Series E+ in January 2015), FreedomPop ($50M Series D in January 2016), Razer ($75M Series C in February 2016) and Ring ($61M Series C in March 2016). However, on the whole, hardware is a little bit of an acquired taste for most VCs (for my thoughts on how VCs view the space, see here). The Fitbit IPO in 2015 was an important moment in demonstrating that an IoT startup could be wildly successful and offer sound financial metrics (FitBit is very profitable whereas most SaaS companies are not), but many traditional VCs still view hardware startups with a suspicious eye, and IoT investments often remain largely experimental. Hardware startups are much less capital intensive than in the past, but from what we see in the market, it still takes a solid $10M in combined financing for a hardware startup to truly get going (ship and get early sales traction beyond pre-orders), at least in the US (a number of European companies have had to do it with less, as VC financing at those levels was less of an option). Fortunately for the space, strategic/corporate investors have been stepping in in a major way. In fact, again according to CB Insights (here), the top two most active investors in the space are corporate: Intel Capital and Qualcomm Ventures, with Cisco also appearing in the top 10 alongside traditional VC funds. Verizon Ventures, GE Ventures, Comcast Ventures, Samsung Ventures are also active. This is true internationally as well Netatmo’s Series B round was led by industrial company Legrand and Sigfox Series D round was led by Telefonica and other leading telecom companies. Asian investors have been active as well, with FoxConn occasionally leading rounds and Singapore’s EDBI being a significant late stage investor, for example. If the VC financing market continues to cool down in the US, the impact on the IoT ecosystem could be significant. In tough markets, emerging areas tend to be disproportionally affected, and historically corporate and foreign investors have tended to be less active in turbulent times – but perhaps the startup financing landscape has evolved to a point where this will be not the case this time. For now, with startup creation and funding in full swing, we can barely keep track of all new IoT startups appearing on the market. Certain areas, particularly on the consumer IoT side (most blatantly, wearables, fitness and home automation) are now overcrowded, inevitably raising the specter of failure and forced consolidation. The enterprise and industrial side"
