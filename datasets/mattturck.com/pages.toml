full_description = "My VC resolutions for 2022 TwitterLinkedinFacebook 1. Be a mentor: give interns the chance to ghost-write my meme tweets and Web3 thought leadership posts 2. Improve work/life balance: minimize non-public effort, such as board work, due diligence 3. Show humility: use the word “humbled” more often 4. Think ahead: e.g., take pics with early stage founders for future “how it started, how it’s going” IPO posts 5. Be proactive: e.g, remove names of unsuccessful investments from all my social profiles 6. Listen more: speaking 90% of the time in meetings is too much – 80% is plenty 7. Share knowledge: be better at telling founders what to do based on my own experience as a founder 17 years ago in a different industry 8. Add value: reply to every single founder question with 🚀🚀🚀 Happy new year everyone, let’s go! TwitterLinkedinFacebook Posted on January 3, 2022January 3, 2022Categories j/k"
