["https://maurathomas.com/books/from-to-do-to-done"]
title = "From To-Do to Done | Maura Thomas"
description = "From To-Do to Done How to go from busy to productive by mastering your to-do list. ARE YOU BUSY, BUT NOT PRODUCTIVE? This is not another book on time management; this is a book on how to take back control of your busy life. Not only will you be focusing on the things that truly matter, but you will feel more in control"
full_description = "From To-Do to Done How to go from busy to productive by mastering your to-do list. ARE YOU BUSY, BUT NOT PRODUCTIVE? This is not another book on time management; this is a book on how to take back control of your busy life. Not only will you be focusing on the things that truly matter, but you will feel more in control and less overwhelmed, and feel a greater sense of accomplishment by focusing on what is truly important to you. Order Your Copy Now How Does It Work? Productivity expert, Maura Thomas takes you through exercises to help you clear your mind of all the things that are distracting you and keeping you up at night. You’ll learn a better way to store, organize, and prioritize all of your commitments in all parts of your life. You’ll also learn how to be more productive with your calendar, the tools you’ll need to succeed, and strategies to be more proactive and less reactive. The ultimate goal is accomplishing more of your most significant results, personally and professionally. Meet the Author Maura Nevel Thomas is an award-winning international speaker, trainer, and author on individual and corporate productivity and work-life balance, and the most widely-cited authority on Attention Management™. She has trained thousands of individuals at hundreds of organizations on her proprietary Empowered Productivity™ System, a process for achieving significant results and living a life of choice. She appears weekly in business outlets such as Fast Company, Inc., Forbes, and the Harvard Business Review. Other Books in the Empowered Productivity Series Buy The Book"
