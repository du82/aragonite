description = "The Happy Inbox: How to have a stress-free relationship with your email and overcome your communication clutter Reduce anxiety caused by digital and paper clutter. Create an ability to retrieve information you need quickly. Gain the opportunity to spend less time managing communication clutter and more time working"
full_description = "The Happy Inbox: How to have a stress-free relationship with your email and overcome your communication clutter Reduce anxiety caused by digital and paper clutter. Create an ability to retrieve information you need quickly. Gain the opportunity to spend less time managing communication clutter and more time working toward your goals! Order Your Copy Now Get ready to learn how to conquer the distractions caused by information and communication overload, and how to get out from under “communication clutter,” so you can live a life of choice—one of action, not reaction. Feeling buried by communication clutter is that it’s that state of feeling like you are always owing return communication to someone. It’s the subtle sense of anxiety caused by your backlog of email, taunting you with the little red indicators on the communication apps on your phone—texts, voicemails, missed calls, social media notifications—plus the mountain of outstanding email piling up in your inbox even as you read this. Order Your Copy Now! Order Your Copy Now “I am a huge fan of your work, and I have recommended your books and site to dozens of colleagues.” – Michelle LatimerSpringfield, VA Maura Nevel Thomas is an award-winning international speaker and trainer on individual and corporate productivity and work-life balance, and the most widely-cited authority on Attention Management™. Her clients include the likes of the U.S. Army, Old Navy, and the American Heart Association. She is a TEDx Speaker, founder of Regain Your Time, author of Personal Productivity Secrets and Work Without Walls, and was recently named a Top Leadership Speaker for 2018 in Inc. Magazine. Maura is frequently cited as an expert in major business outlets including Forbes, Fast Company, and Huffington Post, and she’s also a regular contributor to the Harvard Business Review, with articles there viewed over a million times. Other Books in the Empowered Productivity Series Buy The Book"
