title = "About Maura | Maura Thomas"
description = "Meet Maura The Leading Expert on Attention Management™ and Personal Productivity. Empowering Achievement An acclaimed expert in individual and corporate productivity, Maura has dedicated her career to helping people harness their time, energy, and unique capabilities to accomplish more with less stress. She is an"
full_description = "Meet Maura The Leading Expert on Attention Management™ and Personal Productivity. Empowering Achievement An acclaimed expert in individual and corporate productivity, Maura has dedicated her career to helping people harness their time, energy, and unique capabilities to accomplish more with less stress. She is an award-winning international speaker, trainer, and author and the most widely-recognized authority on attention management. A Journey of Discovery Beginning in the 1990s, with a drive to understand what strategies truly elevate personal effectiveness and why they worked where other strategies failed, Maura attended every seminar and digested every piece of literature on personal productivity. It was her job to study, understand, internalize, and articulate all aspects and methodologies of personal productivity and effectiveness that existed, everywhere in the world. This provided her with an extensive education on the topic. Her relentless pursuit of the most valuable insights for herself and others ultimately laid the foundation for her Empowered Productivity System™. Her framework distills the essence of those insights, her personal experience, and more into a transformative approach to achievement. Since its inception, Maura’s system has not only fueled and supported her own success as a speaker, trainer, and author, but has also transformed the lives of countless professionals. Teaching Professionals Worldwide Now, in addition to continuing to digest every piece of new literature on personal productivity, she’s producing them too. From the initial 30-minute speech that she delivered to anyone who would listen in the mid 2000s, to an ever-expanding range of speeches, training programs, articles, books, workbooks, and other helpful resources, Maura and her work have become the go-to authority on Attention Management and personal productivity. She is a media favorite, featured in hundreds of national business outlets, including The Wall Street Journal, NPR, Fast Company, Entrepreneur, US News and World Report, and the Huffington Post. She also is a regular columnist for both Forbes and the Harvard Business Review. Maura was the first person to coin the phrase “Attention Management” in the context of personal productivity. Since she published her first article on the topic in 2010, she has been on a mission to retire the phrase “Time Management” from common language and replace it with the phrase “Attention Management.” Recognized by Global Gurus as one of the Top Ten Time Management Experts of 2024 Learn More As seen in Read and follow Maura on Forbes | Read Maura’s articles in Harvard Business Review Continually Learning as Things Change With every client engagement and from recent research on personal and corporate productivity and performance, Maura continues to learn more about how to help people achieve in their unique environment. And as digital advancements redefine our work tools, Maura has adeptly integrated these technologies into the Empowered Productivity System and her training programs. From traditional paper methods to the latest digital platforms, she ensures that her her system and programs evolve, enabling clients to achieve remarkable outcomes. A Unique and Valuable Perspective Maura understands that true learning and change begins where people are in the given moment. Because of this, she makes a point in her programs to listen carefully then apply her unique insights to help participants understand how they can move forward from where they are in that moment. Having learned from countless experts and worked with many thousands of professionals in hundreds of organizations over the last several decades, she has gained deep and varied insights that are relevant in a large and ever expanding range of work environments and individual situations. Because of the unique and insightful perspective she is able to provide, participants always leave her sessions armed with relevant, practical steps they can immediately take in their unique situation to get on the path toward lasting change. Beyond Productivity For Maura, productivity is not just about achieving more; it’s about making a meaningful impact. Based in Austin, Texas, she leverages her abilities and success to contribute to the community and the world at large. From leadership roles in local organizations to volunteering with global initiatives like the Climate Project, Maura’s commitment to social impact is unwavering. Giving Back Maura believes in giving back! She has sat on the boards and been actively involved in several local non-profits, and at least one training per quarter is offered pro bono to local charities. In addition, Regain Your Time donates a percentage to charity of all training and speaking fees received. Below are some recipients of pro bono speaking services or other volunteer activities. Embrace Your Genius Maura’s mission isn’t just about helping people manage time and tasks; it’s about unleashing potential. With a vision that every individual possesses unique talents, her mission is to empower them to offer those gifts to their organization, their family, their community, and ultimately the world. She believes that when people make themselves more effective, great things happen. “I want to help you unleash your genius. All of the things that make you YOU, your best self in service to the world.” – Maura Nevel Thomas The Team Always looking to be efficient and productive, Maura’s extended team consists of a group of talented freelance professionals and outsourcing companies. Outsourcing is the growth model that has been the best fit, eliminating the time, effort, and overhead involved in retaining a staff. This is a list of individuals and companies employed and recommended by Maura: Shawn Thomas, Chief Operating Officer and Coaching Lead Shana Burg, Content Marketing & Copywriting Rebecca Metz, Website Design & Management Erin Peereboom, Instructional Design Cassidy Risien, Office Administrator and Client Liaison Rita Kerins, Research & Editing"
