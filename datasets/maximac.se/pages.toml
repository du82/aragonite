description = "Så var det dags att testa den senaste skapelsen från svenska Sudio. Jag blev grymt imponerad av Sudio T2 som jag använt flitigt utan problem sedan mitt senaste test av Sudiolurar."
full_description = 'Sudio E3 ännu ett snäpp skönareSå var det dags att testa den senaste skapelsen från svenska Sudio. Jag blev grymt imponerad av Sudio T2 som jag använt flitigt utan problem sedan mitt senaste test av Sudiolurar. Går det verkligen att toppa dem ljudmässigt var min tanke när jag packade upp nya Sudio E3?<img decoding="async" aria-describedby="caption-attachment-23667" class="wp-image-23667 size-full" src="https://maximac.se/wp-content/uploads/2024/03/sudio-e3-1.jpg" alt="Sudio E3" width="2000" height="1500" srcset="https://maximac.se/wp-content/uploads/2024/03/sudio-e3-1.jpg 2000w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-1-300x225.jpg 300w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-1-640x480.jpg 640w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-1-768x576.jpg 768w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-1-1536x1152.jpg 1536w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-1-973x730.jpg 973w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-1-508x381.jpg 508w" sizes="(max-width: 2000px) 100vw, 2000px" />Kartong är ett utmärkt packmaterial som är återvinningsbart.<img decoding="async" aria-describedby="caption-attachment-23668" class="wp-image-23668 size-full" src="https://maximac.se/wp-content/uploads/2024/03/sudio-e3-2.jpg" alt="Sudio E3" width="2000" height="1500" srcset="https://maximac.se/wp-content/uploads/2024/03/sudio-e3-2.jpg 2000w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-2-300x225.jpg 300w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-2-640x480.jpg 640w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-2-768x576.jpg 768w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-2-1536x1152.jpg 1536w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-2-973x730.jpg 973w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-2-508x381.jpg 508w" sizes="(max-width: 2000px) 100vw, 2000px" />Silkespapper är snygg utfyllnad som ger förväntan på innehållet.<img decoding="async" aria-describedby="caption-attachment-23669" class="wp-image-23669 size-full" src="https://maximac.se/wp-content/uploads/2024/03/sudio-e3-3.jpg" alt="Sudio E3" width="2000" height="1500" srcset="https://maximac.se/wp-content/uploads/2024/03/sudio-e3-3.jpg 2000w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-3-300x225.jpg 300w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-3-640x480.jpg 640w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-3-768x576.jpg 768w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-3-1536x1152.jpg 1536w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-3-973x730.jpg 973w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-3-508x381.jpg 508w" sizes="(max-width: 2000px) 100vw, 2000px" />Sudio E3 har likt Apples AirPods små stjälkar som sticker ut på änden.<img decoding="async" aria-describedby="caption-attachment-23670" class="wp-image-23670 size-full" src="https://maximac.se/wp-content/uploads/2024/03/sudio-e3-4.jpg" alt="Sudio E3" width="2000" height="1500" srcset="https://maximac.se/wp-content/uploads/2024/03/sudio-e3-4.jpg 2000w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-4-300x225.jpg 300w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-4-640x480.jpg 640w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-4-768x576.jpg 768w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-4-1536x1152.jpg 1536w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-4-973x730.jpg 973w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-4-508x381.jpg 508w" sizes="(max-width: 2000px) 100vw, 2000px" />Laddningsetui som är ytterligare förfinat från Sudio T2.<img decoding="async" aria-describedby="caption-attachment-23671" class="wp-image-23671 size-full" src="https://maximac.se/wp-content/uploads/2024/03/sudio-e3-5.jpg" alt="Sudio E3" width="2000" height="1500" srcset="https://maximac.se/wp-content/uploads/2024/03/sudio-e3-5.jpg 2000w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-5-300x225.jpg 300w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-5-640x480.jpg 640w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-5-768x576.jpg 768w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-5-1536x1152.jpg 1536w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-5-973x730.jpg 973w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-5-508x381.jpg 508w" sizes="(max-width: 2000px) 100vw, 2000px" />Allt som behövs med enkel och tydlig användarmanual.<img decoding="async" aria-describedby="caption-attachment-23672" class="wp-image-23672 size-full" src="https://maximac.se/wp-content/uploads/2024/03/sudio-e3-6.jpg" alt="Sudio E3" width="2000" height="1500" srcset="https://maximac.se/wp-content/uploads/2024/03/sudio-e3-6.jpg 2000w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-6-300x225.jpg 300w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-6-640x480.jpg 640w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-6-768x576.jpg 768w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-6-1536x1152.jpg 1536w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-6-973x730.jpg 973w, https://maximac.se/wp-content/uploads/2024/03/sudio-e3-6-508x381.jpg 508w" sizes="(max-width: 2000px) 100vw, 2000px" />Generöst med eartips för att passa alla öron.Laddad och klarDen korta laddkabeln har vanlig USB i ena änden och USB-C i den andra till laddetuiet. Som med de flesta batteridrivna prylar var lurarna laddade och klara att använda direkt. En snabb genomgång av manualen visade på enkel hantering med touchkontrollerna. Enklare än för Sudio T2 och mer distinkta kontroller.Små lätta molnDet första som slog mig var hur ledigt och lätt de direkt passade för mina öron. De hamnar på plats och sen känns det knappt att de är där. Sudio T2 behöver vridas in för att sitta bra. Hur låter de då? Jo tack, de låter riktigt bra.De har inte riktigt samma djupbas som Sudio T2, vilket hör ihop med att de inte sitter lika tätt intryckta i örongången. Men det är å andra sidan det som gör att Sudio E3 känns så naturliga och lättsamma. Det går säkert att få mer och djupare bas med lite trixande med olika storlekar på öronpropparna men då är risken att man tappar den lättsamma känslan.De har fullt register och låter som Sudio ska, naturligt med riktigt bra ljudbild och inte ett dugg tröttande. Man vill bara lyssna mer och mer vilket är det jag alltid värderar högst när det gäller ljudkvalitet. Jag gick igenom låt efter låt i den spellista jag använder för att bedöma ljud, med sånt som jag vet hur det ska låta när det låter bra.Bara du slog en signalTestade såklart även att ringa med dem och det är samma där. Rent, naturligt och icketröttande ljud. Brusreduceringen är antingen på eller av, vilket gjorde den enklare att hantera än för Sudio T2. Att använda Siri och kontrollera uppspelningen var också enkelt och logiskt med touchkontrollerna. Det enda i övrigt jag skulle kunna önska är ett lite större urval av färger. Sudio E3 finns i svart eller krämvitt och det är väl i och för sig de färger som visat sig vara mest populära.Sudio E3 har upp till sex och en halv timmes speltid och rejäl räckvidd med Bluetooth. Jag kunde ledigt gå från ena änden av min drygt 100 kvadratmeters boning till den andra utan minsta hicka i anslutningen med min iPhone 13 på maximalt avstånd.Kostar en slant men passa påSudio E3 kostar 1299 kronor med fri frakt. Använder du koden maximac2024 får du under en begränsad tid 15 procents rabatt och landar då på lite drygt 1100 kronor istället. Rekommenderas som ett välljudande och välsittande alternativ till Apples AirPods.24 mars, 2024i testairpods apple sudio sudio e3 sudio t2 unboxing uppackning ← Föregående inlägg Nästa inlägg →'
