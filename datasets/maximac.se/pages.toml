title = "Apple har tyvärr tappat det | MaxiMac"
description = "Vid veckans iPadevent blottade Apple flera saker som visar på tondövt anslag. För det första själva uppställningen av förvirrande iPadmodeller och för det andra den smaklösa reklamfilm som krossade…"
full_description = "Apple har tyvärr tappat detVid veckans iPadevent blottade Apple flera saker som visar på tondövt anslag. För det första själva uppställningen av förvirrande iPadmodeller och för det andra den smaklösa reklamfilm som krossade fysiska uttryck för kreativitet.Jag fullkomligt älskar iPad och det är den Applepryl jag använder allra mest ända sedan den introducerades. Den plats som iPad har bland Apples prylar är, ska och har enligt min mening alltid varit den ursprungliga. En liten handhållen skärm som visar mer än en iPhone men är enklare och smidigare än en Mac. Jag är också övertygad om att det är så majoriteten av alla iPad används. Till att snurra runt på interwebben, hantera bilder och sociala medier samt köpa grejer på nätet.Jag förstår nyttan och finessen med en iPad Pro som har exakt färgåtergivning och mer kraft för grafiska formgivare, fotografer och andra kreativa proffs som ibland behöver något enklare än en Mac men mer avancerat än en vanlig iPad. Men jag utgår också från att alla dessa har en Mac som huvudsaklig arbetsmaskin. Sedan återstår frågan varför iPad air överhuvudtaget finns i denna uppställning. De modellval som finns idag är onödiga och förvirrande.Hela idén med att försöka göra en iPad till något som nästan, men bara nästan är en Mac är förfelad och faller inom kategorin – bara för att det går att göra så gör vi det. Det tillhör inte Apples kärna att tänka så, men det görs alltmer i takt med att hårdvara och mjukvara blir allt mer kapabel. Mycket hänger nu på vad Apple kommer att följa upp med vid sommarens WWDC. Både vad gäller de olika operativsystemen men även AI som lär bli huvudnumret.Apple skulle må bra av att fokusera istället för att diversifiera och fragmentera. Det som Steve Jobs gjorde så djärvt och framgångsrikt efter sin återkomst till ett konkursmässigt Apple 1997. Det är idag svårt att se någon tydlig linje i vad Apple vill erbjuda. Fördelen med ett starkt samspelande ekosystem av olika produktfamiljer med olika styrkor är och har länge varit Apples största tillgång. Men det börjar bli knepigt att se den röda tråden med produkter som inte har en tydlig nisch utan mer hamnar just i kategorin – vi gör det bara för att vi kan (hej Apple Vision Pro).Sedan kommer vi till det jag nuddat vid nyligen. Att Apples reklam allt för ofta missar målet, vad det nu är. Det var rent plågsamt att se Apples monsterpress krossa ikoniska prylar för skapande och inspiration och försöka tuta i oss att allt det kan ersättas med en iPad, hur tunn och kraftfull den än må vara. På vems sida står Apple? Den som vill ha verktyg för att uttrycka sig eller den som tror sig ta genvägar genom att köpa nya dyra prylar?Den närmaste tiden får utvisa om Apple på riktigt har tappat det eller om detta bara är ett gupp på vägen mot något som vi ännu inte ser konturerna av.”Apple’s reveal of the new iPad Pro and iPad Air gave us a confusing mess of expensive accessories and compatibility problems, along with a tone-deaf Crush ad.”12 maj, 2024i spaningai apple ipad mac steve jobs vision pro wwdc ← Föregående inlägg Nästa inlägg →"
