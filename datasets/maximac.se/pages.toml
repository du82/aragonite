full_description = 'Etikett: apple watchSida 1 av 11 En dag i Tim Cooks livApples boss Tim Cook är privat en väldigt privat person. När det gäller jobbet är han inte oväntat morgontidig och disciplinerad med strikta egna rutiner. Tims fokus på… <img width="508" height="286" src="https://maximac.se/wp-content/uploads/2021/12/apple-watch-508x286.jpg" class="attachment-post-thumb size-post-thumb wp-post-image" alt="Apple Watch blinkar grönt" decoding="async" srcset="https://maximac.se/wp-content/uploads/2021/12/apple-watch-508x286.jpg 508w, https://maximac.se/wp-content/uploads/2021/12/apple-watch-300x169.jpg 300w, https://maximac.se/wp-content/uploads/2021/12/apple-watch-640x360.jpg 640w, https://maximac.se/wp-content/uploads/2021/12/apple-watch-768x432.jpg 768w, https://maximac.se/wp-content/uploads/2021/12/apple-watch-1536x864.jpg 1536w, https://maximac.se/wp-content/uploads/2021/12/apple-watch-2048x1153.jpg 2048w, https://maximac.se/wp-content/uploads/2021/12/apple-watch-973x548.jpg 973w" sizes="(max-width: 508px) 100vw, 508px" /> Apple Watch blinkar gröntAlla som har en Apple Watch vet att den ibland blinkar med ett intensivt grönt sken från baksidan. Att det har att göra med hur den mäter pulsen… <img width="508" height="285" src="https://maximac.se/wp-content/uploads/2016/01/apple-twitter-508x285.png" class="attachment-post-thumb size-post-thumb wp-post-image" alt="Apple Twitter" decoding="async" srcset="https://maximac.se/wp-content/uploads/2016/01/apple-twitter-508x285.png 508w, https://maximac.se/wp-content/uploads/2016/01/apple-twitter-300x168.png 300w, https://maximac.se/wp-content/uploads/2016/01/apple-twitter-768x431.png 768w, https://maximac.se/wp-content/uploads/2016/01/apple-twitter-640x359.png 640w, https://maximac.se/wp-content/uploads/2016/01/apple-twitter-973x546.png 973w, https://maximac.se/wp-content/uploads/2016/01/apple-twitter.png 2000w" sizes="(max-width: 508px) 100vw, 508px" /> Apple köpte TwitterApple köpte all annonsplats på Twitter i samband med presentationen av nya iPhone och Apple Watch. Apple använde dessutom specialfunktionen ❤️ heart for reminder för att leverera löpande uppdateringar. Totalt… <img width="508" height="491" src="https://maximac.se/wp-content/uploads/2018/08/gather-round-apple-event-508x491.jpg" class="attachment-post-thumb size-post-thumb wp-post-image" alt="Gather Round Apple Special Event" decoding="async" srcset="https://maximac.se/wp-content/uploads/2018/08/gather-round-apple-event-508x491.jpg 508w, https://maximac.se/wp-content/uploads/2018/08/gather-round-apple-event-300x290.jpg 300w, https://maximac.se/wp-content/uploads/2018/08/gather-round-apple-event-768x742.jpg 768w, https://maximac.se/wp-content/uploads/2018/08/gather-round-apple-event-640x618.jpg 640w, https://maximac.se/wp-content/uploads/2018/08/gather-round-apple-event-973x940.jpg 973w, https://maximac.se/wp-content/uploads/2018/08/gather-round-apple-event.jpg 1360w" sizes="(max-width: 508px) 100vw, 508px" /> Gather round för nya iPhone 12 septemberDen 12 september är det dags för inbjudna gäster och media att samlas i Steve Jobs Theater vid Apple Park i Cupertino. Det blir alldeles säkert nya modeller… <img width="508" height="339" src="https://maximac.se/wp-content/uploads/2018/08/apple-q3-2018-508x339.png" class="attachment-post-thumb size-post-thumb wp-post-image" alt="Apple Q3 2018" decoding="async" srcset="https://maximac.se/wp-content/uploads/2018/08/apple-q3-2018-508x339.png 508w, https://maximac.se/wp-content/uploads/2018/08/apple-q3-2018-300x200.png 300w, https://maximac.se/wp-content/uploads/2018/08/apple-q3-2018-768x512.png 768w, https://maximac.se/wp-content/uploads/2018/08/apple-q3-2018-640x427.png 640w, https://maximac.se/wp-content/uploads/2018/08/apple-q3-2018.png 900w" sizes="(max-width: 508px) 100vw, 508px" /> Apples kvartalsrapport Q3 2018Ny kvartalsrapport och nya rekordsiffror från Apple, som vanligt. iPhone och tjänstesektorn går urstarkt. Intäkterna har ökat 17 procent sedan motsvarande kvartal föregående år. <img width="508" height="339" src="https://maximac.se/wp-content/uploads/2018/03/apple-microled-facility-508x339.jpg" class="attachment-post-thumb size-post-thumb wp-post-image" alt="Apple MicroLED facility Santa Clara" decoding="async" srcset="https://maximac.se/wp-content/uploads/2018/03/apple-microled-facility-508x339.jpg 508w, https://maximac.se/wp-content/uploads/2018/03/apple-microled-facility-300x200.jpg 300w, https://maximac.se/wp-content/uploads/2018/03/apple-microled-facility-768x512.jpg 768w, https://maximac.se/wp-content/uploads/2018/03/apple-microled-facility-640x427.jpg 640w, https://maximac.se/wp-content/uploads/2018/03/apple-microled-facility-973x649.jpg 973w, https://maximac.se/wp-content/uploads/2018/03/apple-microled-facility.jpg 1280w" sizes="(max-width: 508px) 100vw, 508px" /> Apple utvecklar egna bildskärmar med MicroLEDMark Gurman rapporterar om Apples ansträngningar att utveckla bildskärmar med MicroLED som ger klara fördelar jämfört med OLED som idag används för Apple Watch och iPhone X. Vid… <img width="508" height="286" src="https://maximac.se/wp-content/uploads/2017/12/apple-watch-3-508x286.jpg" class="attachment-post-thumb size-post-thumb wp-post-image" alt="Apple Watch series 3" decoding="async" srcset="https://maximac.se/wp-content/uploads/2017/12/apple-watch-3-508x286.jpg 508w, https://maximac.se/wp-content/uploads/2017/12/apple-watch-3-300x169.jpg 300w, https://maximac.se/wp-content/uploads/2017/12/apple-watch-3-768x432.jpg 768w, https://maximac.se/wp-content/uploads/2017/12/apple-watch-3-640x360.jpg 640w, https://maximac.se/wp-content/uploads/2017/12/apple-watch-3-973x547.jpg 973w, https://maximac.se/wp-content/uploads/2017/12/apple-watch-3.jpg 2048w" sizes="(max-width: 508px) 100vw, 508px" /> Apple Watch är hetaste julklappen för aktivitetApple Watch har tagit över från iPod som hetaste julklappen till hyfsat rimligt pris. Apple har släppt fyra nya korta reklamspottar som inte alls oväntat fokuserar på aktivitet… <img width="508" height="286" src="https://maximac.se/wp-content/uploads/2017/10/apple-watch-series-3-508x286.jpg" class="attachment-post-thumb size-post-thumb wp-post-image" alt="Apple Watch Series 3" decoding="async" srcset="https://maximac.se/wp-content/uploads/2017/10/apple-watch-series-3-508x286.jpg 508w, https://maximac.se/wp-content/uploads/2017/10/apple-watch-series-3-300x169.jpg 300w, https://maximac.se/wp-content/uploads/2017/10/apple-watch-series-3-768x432.jpg 768w, https://maximac.se/wp-content/uploads/2017/10/apple-watch-series-3-640x360.jpg 640w, https://maximac.se/wp-content/uploads/2017/10/apple-watch-series-3-973x547.jpg 973w, https://maximac.se/wp-content/uploads/2017/10/apple-watch-series-3.jpg 2048w" sizes="(max-width: 508px) 100vw, 508px" /> Apple Watch Series 3 uppackad och testadMike har packat upp och gått igenom det som är nytt med Apple Watch Series 3. Apple Watch hittade formen från start och blir vassare för varje generation. <img width="508" height="339" src="https://maximac.se/wp-content/uploads/2017/09/DSCF2956-508x339.jpg" class="attachment-post-thumb size-post-thumb wp-post-image" alt="Steve Jobs Theater" decoding="async" srcset="https://maximac.se/wp-content/uploads/2017/09/DSCF2956-508x339.jpg 508w, https://maximac.se/wp-content/uploads/2017/09/DSCF2956-300x200.jpg 300w, https://maximac.se/wp-content/uploads/2017/09/DSCF2956-768x512.jpg 768w, https://maximac.se/wp-content/uploads/2017/09/DSCF2956-640x427.jpg 640w, https://maximac.se/wp-content/uploads/2017/09/DSCF2956-973x649.jpg 973w, https://maximac.se/wp-content/uploads/2017/09/DSCF2956.jpg 1800w" sizes="(max-width: 508px) 100vw, 508px" /> Steve Jobs Theater är perfekt för sitt syfteGårdagens Apple event med nya iPhone, Apple Watch och Apple TV med mera innebar premiär för Apple Park och Steve Jobs Theater. Dan Frommer tog en serie sköna… <img width="508" height="282" src="https://maximac.se/wp-content/uploads/2017/09/apple-iphone-generations-508x282.jpg" class="attachment-post-thumb size-post-thumb wp-post-image" alt="Apple iPhone generations" decoding="async" srcset="https://maximac.se/wp-content/uploads/2017/09/apple-iphone-generations-508x282.jpg 508w, https://maximac.se/wp-content/uploads/2017/09/apple-iphone-generations-300x167.jpg 300w, https://maximac.se/wp-content/uploads/2017/09/apple-iphone-generations-768x427.jpg 768w, https://maximac.se/wp-content/uploads/2017/09/apple-iphone-generations-640x356.jpg 640w, https://maximac.se/wp-content/uploads/2017/09/apple-iphone-generations-973x541.jpg 973w, https://maximac.se/wp-content/uploads/2017/09/apple-iphone-generations.jpg 1800w" sizes="(max-width: 508px) 100vw, 508px" /> Snart får vi se iPhone 8, iPhone 8 Plus och iPhone XMed presentation i egna Steve Parks Theater vid Apple Park så har vi inte kunnat följa förberedelserna inför föreställningen visuellt som tidigare. Däremot har någon illbatting inom Apple… <img width="508" height="318" src="https://maximac.se/wp-content/uploads/2017/08/apple-lets-meet-at-our-place-508x318.png" class="attachment-post-thumb size-post-thumb wp-post-image" alt="Apple Event" decoding="async" srcset="https://maximac.se/wp-content/uploads/2017/08/apple-lets-meet-at-our-place-508x318.png 508w, https://maximac.se/wp-content/uploads/2017/08/apple-lets-meet-at-our-place-300x188.png 300w, https://maximac.se/wp-content/uploads/2017/08/apple-lets-meet-at-our-place-768x480.png 768w, https://maximac.se/wp-content/uploads/2017/08/apple-lets-meet-at-our-place-640x400.png 640w, https://maximac.se/wp-content/uploads/2017/08/apple-lets-meet-at-our-place.png 800w" sizes="(max-width: 508px) 100vw, 508px" /> Apple presenterar nya iPhone vid Steve Jobs Theater 12 septemberApple har gått ut med inbjudan till sitt första event vid Apple Park, Steve Jobs Theater, 12 september 10:00 lokal tid. Nya iPhone och iOS 11 står absolut… <img width="508" height="285" src="https://maximac.se/wp-content/uploads/2017/05/nikelab-apple-watch-508x285.jpg" class="attachment-post-thumb size-post-thumb wp-post-image" alt="NikeLab Apple Watch" decoding="async" srcset="https://maximac.se/wp-content/uploads/2017/05/nikelab-apple-watch-508x285.jpg 508w, https://maximac.se/wp-content/uploads/2017/05/nikelab-apple-watch-300x169.jpg 300w, https://maximac.se/wp-content/uploads/2017/05/nikelab-apple-watch-768x431.jpg 768w, https://maximac.se/wp-content/uploads/2017/05/nikelab-apple-watch-640x360.jpg 640w, https://maximac.se/wp-content/uploads/2017/05/nikelab-apple-watch-973x547.jpg 973w, https://maximac.se/wp-content/uploads/2017/05/nikelab-apple-watch.jpg 1280w" sizes="(max-width: 508px) 100vw, 508px" /> NikeLab Apple Watch uppackad och genomgångenMike har tagit en titt på NikeLab Apple Watch som såldes i begränsad upplaga. Det är en snygg liten pärla som sålt slut och nu borde vara hyfsat exklusiv. Äldre inlägg →'
