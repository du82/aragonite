full_description = 'KontaktMaxiMac grundades 2005 och drivs sedan starten med ambitionen att ge intressanta perspektiv på Applevärlden. Jag brukade så gott som varje dag plöja igenom hundratals artiklar från en mängd källor för att vaska fram sådant jag gillar, gärna sådant som inte någon av de andra teknikprylbloggarna i Sverige redan rapporterat om.Nu är uppdateringstakten väldigt mycket lägre här, med mer fokus på spaningar och tips kring sådant jag snubblat över eller grottat ned mig i.Webbplatsen använder minimalt med påhäng och det enda som antagligen sätter en kaka till kaffet borde vara tipsfunktionen Buy me a coffee! Gillar du inte cookies är det bara att slå av dem i webbläsaren eller bygga en tidsmaskin och transportera dig tillbaks till förra seklet.<img decoding="async" class="alignright size-medium wp-image-6113" style="border-style: initial; border-color: initial;" title="John" src="https://maximac.se/wp-content/uploads/2010/05/lillajohn-300x300.jpg" alt="" width="200" height="200" srcset="https://maximac.se/wp-content/uploads/2010/05/lillajohn-300x300.jpg 300w, https://maximac.se/wp-content/uploads/2010/05/lillajohn-150x150.jpg 150w, https://maximac.se/wp-content/uploads/2010/05/lillajohn.jpg 604w" sizes="(max-width: 200px) 100vw, 200px" />Är du intresserad av sponsring genom produkttester eller andra samarbeten så får du gärna höra av dig.Har du tips, förslag på samarbete eller annat kul att komma med så kan du nå mig på cubexpert@gmail.comJag hoppas att du gillar MaxiMac och hittar för dig intressanta, oväntade och roliga små brottstycken av Applevärlden här.John Sandström@cubexpert'
