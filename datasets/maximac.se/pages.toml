["https://maximac.se/2024/05/apple-ai-blir-forhoppningsvis-inte-en-flortig-siri"]
title = "Apple ai blir förhoppningsvis inte en flörtig Siri | MaxiMac"
description = "Vi är många som väntar med spänning på att Apple ska presentera sin version av generativ artificiell intelligens under WWDC24. Allt pekar mot att det kan bli det viktigaste klivet för Apple på länge."
full_description = 'Apple ai blir förhoppningsvis inte en flörtig SiriVi är många som väntar med spänning på att Apple ska presentera sin version av generativ artificiell intelligens under WWDC24. Allt pekar mot att det kan bli det viktigaste klivet för Apple på länge. Technördar har länge varit upphetsade över AI men hur kan de nya förmågorna tämjas och göras mer praktiskt användbara för den stora användarskaran?Jag är tveksam till att Apples version får namnet Siri AI som Randy Vazquez föreslår, även om Siri och Spotlight blir naturliga gränssnitt för mycket av det nya. Apple ai är mitt tips som samlingsnamn för de olika förmågor som utvecklare kommer att få tillgång till att använda i sina appar.<img decoding="async" class="alignnone size-full wp-image-23707" src="https://maximac.se/wp-content/uploads/2024/05/apple-ai.png" alt="Apple ai" width="2000" height="2000" srcset="https://maximac.se/wp-content/uploads/2024/05/apple-ai.png 2000w, https://maximac.se/wp-content/uploads/2024/05/apple-ai-300x300.png 300w, https://maximac.se/wp-content/uploads/2024/05/apple-ai-640x640.png 640w, https://maximac.se/wp-content/uploads/2024/05/apple-ai-150x150.png 150w, https://maximac.se/wp-content/uploads/2024/05/apple-ai-768x768.png 768w, https://maximac.se/wp-content/uploads/2024/05/apple-ai-1536x1536.png 1536w, https://maximac.se/wp-content/uploads/2024/05/apple-ai-88x88.png 88w, https://maximac.se/wp-content/uploads/2024/05/apple-ai-973x973.png 973w, https://maximac.se/wp-content/uploads/2024/05/apple-ai-508x508.png 508w" sizes="(max-width: 2000px) 100vw, 2000px" />Sen hoppas jag verkligen att den konversationella delen av Apple ai i form av Siri inte blir av den lismande, flörtiga sorten som GPT-4o visade upp nyligen. Bridget Carey har helt rätt analys och tankar kring hur Apple bör positionera sig där med Siri.Apples trumfkort är dessutom som alltid att stenhårt hålla kvar vid säker och krypterad hantering i våra enheter med starkt skydd för personlig integritet.”After a week of cringeworthy AI news, CNET’s Bridget Carey worries Apple might ruin Siri if it starts sounding like other AI assistants and forgetting what really matters.” 17 maj, 2024i spaningai apple bridget carey gpt-40 randy vazquez siri spotligth wwdc ← Föregående inlägg Nästa inlägg →'
