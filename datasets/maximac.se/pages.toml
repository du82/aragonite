["https://maximac.se/2024/01/det-nya-aret-borjar-med-ny-iphone"]
title = "Det nya året börjar med ny iPhone | MaxiMac"
description = "Ända sedan iPhone 13 släpptes i favoritfärgen grönt har jag suktat efter en. Nu var priset rätt och behovet av bättre kamera uppenbart."
full_description = 'Det nya året börjar med ny iPhoneJag slog till på en ny iPhone 13 till mig själv i julhelgen. Sedan ägnades en del av förra årets sista dag och det nya årets första dag till att ställa in den med bantad mängd appar och nya fräscha inställningar. Det får väl bli ett generellt nyårslöfte. Att styra upp saker och livet så att det fungerar smidigt utan onödiga distraktioner.<img decoding="async" class="alignnone size-full wp-image-23621" src="https://maximac.se/wp-content/uploads/2024/01/IMG_6442-scaled.jpg" alt="" width="2560" height="1920" srcset="https://maximac.se/wp-content/uploads/2024/01/IMG_6442-scaled.jpg 2560w, https://maximac.se/wp-content/uploads/2024/01/IMG_6442-300x225.jpg 300w, https://maximac.se/wp-content/uploads/2024/01/IMG_6442-640x480.jpg 640w, https://maximac.se/wp-content/uploads/2024/01/IMG_6442-768x576.jpg 768w, https://maximac.se/wp-content/uploads/2024/01/IMG_6442-1536x1152.jpg 1536w, https://maximac.se/wp-content/uploads/2024/01/IMG_6442-2048x1536.jpg 2048w, https://maximac.se/wp-content/uploads/2024/01/IMG_6442-973x730.jpg 973w, https://maximac.se/wp-content/uploads/2024/01/IMG_6442-508x381.jpg 508w" sizes="(max-width: 2560px) 100vw, 2560px" />Ända sedan iPhone 13 släpptes i favoritfärgen grönt har jag suktat efter en. Nu var priset rätt och behovet av bättre kamera uppenbart. Men som alltid med den teknik vi idag tar (alltför) givet kan det vara bra att reflektera lite över hur extremt långt vi nått på kort tid. Cray-1 var världens snabbaste och garanterat snyggaste superdator 1976. Men givetvis inte ens nära en iPhone 13 vad gäller kapacitet.Historien bakom Cray och dess skapare Seymour Cray är riktigt fascinerande. Ännu ett exempel på hur enskilda individer på rätt plats med rätt driv och uppbackning kan göra storverk.”Eventually, eighty Cray-1s were sold, making it one of the most successful supercomputers in history. It is perhaps best known for its unique shape, a relatively small C-shaped cabinet with a ring of benches around the outside covering the power supplies and the cooling system.”1 januari, 2024i historiaapple cray cray-1 iphone iphone 13 seymour cray ← Föregående inlägg Nästa inlägg →'
