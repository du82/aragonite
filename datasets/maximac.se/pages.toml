title = "Sudio K2 kompetent och prisvärd heltäckande hörlur | MaxiMac"
description = "Så var det dags att testa ännu en hörlur från svenska Sudio. Den här gången gäller det Sudio K2, en enkel heltäckande hörlur med brusreducering. Jag var nyfiken på den här efter att mestadels ha…"
full_description = 'Sudio K2 kompetent och prisvärd heltäckande hörlurSå var det dags att testa ännu en hörlur från svenska Sudio. Den här gången gäller det Sudio K2, en enkel heltäckande hörlur med brusreducering. Jag var nyfiken på den här efter att mestadels ha testat iöratlurar från Sudio.<img decoding="async" class="alignnone size-full wp-image-23725" src="https://maximac.se/wp-content/uploads/2024/11/IMG_2204.jpeg" alt="Sudio K2" width="2000" height="1500" srcset="https://maximac.se/wp-content/uploads/2024/11/IMG_2204.jpeg 2000w, https://maximac.se/wp-content/uploads/2024/11/IMG_2204-300x225.jpeg 300w, https://maximac.se/wp-content/uploads/2024/11/IMG_2204-640x480.jpeg 640w, https://maximac.se/wp-content/uploads/2024/11/IMG_2204-768x576.jpeg 768w, https://maximac.se/wp-content/uploads/2024/11/IMG_2204-1536x1152.jpeg 1536w, https://maximac.se/wp-content/uploads/2024/11/IMG_2204-973x730.jpeg 973w, https://maximac.se/wp-content/uploads/2024/11/IMG_2204-508x381.jpeg 508w" sizes="(max-width: 2000px) 100vw, 2000px" />Som alltid är det plastfri förpackning som gäller, med silkespapper som en extra touch.<img decoding="async" class="alignnone size-full wp-image-23726" src="https://maximac.se/wp-content/uploads/2024/11/IMG_2206.jpeg" alt="" width="2000" height="1500" data-wp-editing="1" srcset="https://maximac.se/wp-content/uploads/2024/11/IMG_2206.jpeg 2000w, https://maximac.se/wp-content/uploads/2024/11/IMG_2206-300x225.jpeg 300w, https://maximac.se/wp-content/uploads/2024/11/IMG_2206-640x480.jpeg 640w, https://maximac.se/wp-content/uploads/2024/11/IMG_2206-768x576.jpeg 768w, https://maximac.se/wp-content/uploads/2024/11/IMG_2206-1536x1152.jpeg 1536w, https://maximac.se/wp-content/uploads/2024/11/IMG_2206-973x730.jpeg 973w, https://maximac.se/wp-content/uploads/2024/11/IMG_2206-508x381.jpeg 508w" sizes="(max-width: 2000px) 100vw, 2000px" />Sudio K2 kommer med en praktisk förvaringspåse. Bra när den ska samsas med annat bös i en väska eller ryggsäck.<img decoding="async" class="alignnone size-full wp-image-23727" src="https://maximac.se/wp-content/uploads/2024/11/IMG_2208.jpeg" alt="" width="2000" height="1500" srcset="https://maximac.se/wp-content/uploads/2024/11/IMG_2208.jpeg 2000w, https://maximac.se/wp-content/uploads/2024/11/IMG_2208-300x225.jpeg 300w, https://maximac.se/wp-content/uploads/2024/11/IMG_2208-640x480.jpeg 640w, https://maximac.se/wp-content/uploads/2024/11/IMG_2208-768x576.jpeg 768w, https://maximac.se/wp-content/uploads/2024/11/IMG_2208-1536x1152.jpeg 1536w, https://maximac.se/wp-content/uploads/2024/11/IMG_2208-973x730.jpeg 973w, https://maximac.se/wp-content/uploads/2024/11/IMG_2208-508x381.jpeg 508w" sizes="(max-width: 2000px) 100vw, 2000px" />Svart hårdplast i klassisk design som sitter bra på huvudet och över öronen. Muffarna runt öronen kan kännas lätt svettiga efter ett tag.<img decoding="async" class="alignnone size-full wp-image-23728" src="https://maximac.se/wp-content/uploads/2024/11/IMG_2209.jpeg" alt="" width="2000" height="1500" srcset="https://maximac.se/wp-content/uploads/2024/11/IMG_2209.jpeg 2000w, https://maximac.se/wp-content/uploads/2024/11/IMG_2209-300x225.jpeg 300w, https://maximac.se/wp-content/uploads/2024/11/IMG_2209-640x480.jpeg 640w, https://maximac.se/wp-content/uploads/2024/11/IMG_2209-768x576.jpeg 768w, https://maximac.se/wp-content/uploads/2024/11/IMG_2209-1536x1152.jpeg 1536w, https://maximac.se/wp-content/uploads/2024/11/IMG_2209-973x730.jpeg 973w, https://maximac.se/wp-content/uploads/2024/11/IMG_2209-508x381.jpeg 508w" sizes="(max-width: 2000px) 100vw, 2000px" />Liten laddkabel med USB-A och USB-C samt enkel analog hörlurskabel följer med. Kontrollerna är föredömligt enkla och logiska med röst som bekräftar det som valts. Knappen för av/på och enhetsparande kunde dock ha fått vara mer framträdande. Den är svår att känna sig fram till när den är kloss mot resten av höljet.Hur låter Sudio K2Så till det för mig viktigaste. Hur låter Sudio K2 med musik? Första intrycket var att den lät lite tunt med dämpat mellanregister. När jag sedan började lyssna igenom min spellista Så ska det låta föll ljudet på plats. Lite högre volym och allt lät som jag förväntar mig från Sudio. Det jag kan konstatera med alla Sudiolurar under senare år är att de inte har ett tröttande ljud utan att man gärna lyssnar länge.Sudio K2 kommer inte riktigt upp i klassen från Sudios bästa iöratlurar men ger mycket bra ljud för pengarna. De fungerar också precis som väntat bra vid telefonsamtal. Att kåporna är heltäckande hjälper till att skapa en helt egen ostörd ljudrymd, med eller utan brusreduceringen som fungerar riktigt bra.SammanfattningSudio K2 är perfekta som extra budgetlur för att hålla omgivningen störningsfri och slippa bli störd. De här kommer jag att slänga med mig när jag flyger för att få lugn och ha liggandes hemma för att ta på mig när jag kollar Youtube på iPad medan dottern ser film i den öppna planlösningen.Batteritiden är också rejält tilltagen så att man sällan behöver fundera på laddning. De enligt min mening alltför täta muffarna gör dock att det inte är en hörlur att ha på sig någon längre tid i sträck, men gärna grabbar tag i när det behövs avskild lyssning.Sudio K2 kostar just nu under 680 kr i svart eller krämvitt utförande.10 november, 2024i testsudio sudiok2 unboxing ← Föregående inlägg Nästa inlägg →'
