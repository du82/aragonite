title = "John Ternus kan ta över Apple efter Tim Cook | MaxiMac"
description = "Kan det vara dags för generationsskifte hos Apple? Tim Cook har gjort ett fenomenalt jobb med att ta över efter den karismatiske Steve Jobs."
full_description = "John Ternus kan ta över Apple efter Tim CookKan det vara dags för generationsskifte hos Apple? Tim Cook har gjort ett fenomenalt jobb med att ta över efter den karismatiske Steve Jobs och byggt upp Apple till den dominans företaget har. Men de flesta i kretsen kring Steve Jobs har varit med länge nu och kanske inte är lika pepp som förr.En stark kandidat att ta över efter Tim Cook är John Ternus som länge varit ansvarig för Apples hårdvara. Han syns alltmer vid produktintroduktioner och hanterar media mycket väl. Kan det tänkas att Tim Cook som sin sista stora insats vid WWDC24 lanserar Apple AI och sedan lämnar över till John Sternus att styra skutan?”John Ternus is Apple’s senior vice president of Hardware Engineering, reporting to CEO Tim Cook. John leads all hardware engineering, including the teams behind iPhone, iPad, Mac, AirPods, and more.”15 maj, 2024i spaningapple john ternus randy vazquez steve jobs tim cook wwdc ← Föregående inlägg Nästa inlägg →"
