["http://maxogden.com/little-coders"]
title = "Max Ogden's Website"
full_description = '''My first foray into programming was in 1999 and happened accidentally inside the Starcraft custom level editor. I would sit, fully immersed in a paracosm, and create complex storylines that the player could play through, one small objective at a time. You could specify, for instance, that if a Zergling walks onto a particular platform then an event should trigger. You could subscribe other elements of the game to listen for events on that platform and perform other callbacks. I was getting exposed to event based publish/subscribe asynchronous programming without realizing it. When my older brother asked me how to get his nine year old interested in programming, I told him to look for a programming environment that sacrifices practicality for imagination. Nine year olds aren't worried about vendor lock in or job security, they are only going to get hooked if the feel like they are playing a video game (in my case with Starcraft I was literally playing a video game). A good example of this mentality is Hackety Hack by _why the lucky stiff. Hackety Hack aims to "offer a place for plainspeople to tinker with code". Here is a wonderful video from the Art && Code Symposium where _why talks about his thoughts on programming education for youngsters and shows off Hackety Hack. Highly recommended viewing. Near the end of the above video, _why describes a card game called Kaxxt that is designed to get little coders introduced to fundamental programming concepts. At it's core Kaxxt is about robots, lazers and pyramids. What nine year old wouldn't want to play that? When kids play this game they get exposed to ideas such as enumerability or thinking recursively, much in the same fashion that The Little Schemer tries to "present abstract concepts in a humorous and easy-to-grasp fashion". The Flash game Lightbot also comes to mind. In Lightbot, you visually program an animated robot through a series of puzzles. It seems that robots and lazers may be the key to connecting with today's youth.'''
