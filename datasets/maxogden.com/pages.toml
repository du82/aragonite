["https://maxogden.com/node-distributed-systems"]
title = "Max Ogden's Website"
full_description = "The great thing about node (and it's streams) is that its easy to plug different modules together into powerful pipelines. For example in Dat we use rabin to chunk a file stream and then pipe into a merkle tree generator (merkle-tree-stream): It's basically unix pipes all over again. To work with streams in various ways, try out the mississippi module. For node and streams skill building, NodeSchool is great for an intro to most of the skills you will need. After getting through NodeSchool, this P2P workshop by mafintosh is a good challenge. It's doable once you have a basic knowledge of Node. In the workshop you build a peer to peer chat system piece by piece using network streams, DNS, LevelDB and append-only log based message replication. It's best to try with friends, so you can chat with each other as you go through the lessons. For some authors who write distributed systems modules, start with these (not an exhaustive list by any means):"
