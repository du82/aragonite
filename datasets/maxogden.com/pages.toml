title = "Max Ogden's Website"
full_description = "A Node.js case study: Collaboration in a large open source project. Public lecture at the Estonian IT College in Tallinn, Sept 2012 Ogden talked about Code For America, an initiative that “enlists the brightest minds of the web industry into public service to use their skills to solve core problems facing our communities.” He talked about Paul Otlet, the forgotten father of information science, who may have pioneered the idea of the “like” button and the concept of recommendation systems. He talked in the context of libraries – imagine Netflix for public libraries, or an anthropomorphized library pushing book recommendations to you based on geolocation. How can we capitalize on the curiosity gap and encourage kids to seek information and collaborate? The spirit of open government is not about accessibility to data, but rather collaboration, and that is the engine behind Code for America. - Georgy Cohen"
