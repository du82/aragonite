["https://maxogden.com/portland-fiber"]
title = "Max Ogden's Website"
full_description = '''Yesterday I got Gigabit fiber Internet installed at home in Portland, OR from CenturyLink. If you haven't checked out how fiber works here's a good intro video. The variety that CenturyLink offers is a passive optical network consisting of fiber optic cables strung up on telephone poles around town. Gigabit fiber probably isn't practical for most Internet users today because it's more bandwidth than most Internet applications know what to do with. However, in a few years time, as more people get retina screens, 4K TVs, 8TB hard drives and neighbors with fiber Internet who stream super-HD video then there will hopefully be a tipping point. And the fiber infrastructure is relatively future-proof. My day job is to work on data replication tools for really large scientific datasets so I jumped at the opportunity to get it at home. CenturyLink costs $109 a month (for the first year) and Google Fiber is $70 a month. Both offer 1000mbps up/1000mpbs down (133MB/s) with no download/upload limits or caps. CenturyLink's ToS states "Residential 1 Gbps plans are not subject to download limits" and this has been verified by the Seattle Mayor's office. Google Fiber's ToS also states they do "not employ volume-based data caps". CenturyLink seems to be quite secretive when it comes to disclosing the price after the first 12 months. From looking at my first bill it seems their 'standard rate' for gigabit appears to be $153.95, and they give a $44.00 per month discount for the first 12 months of service. This information isn't advertised publicly on their website (from what I can tell). The only major difference (beyond price) that I can find is that Google Fiber specifically prohibits commercial servers, but CenturyLink does not seem to. CenturyLink's FTTH (Fiber To The Home) service seems to currently be in most of inner SE Portland (where I live). Google Fiber isn't in Portland yet, and might never be. If I had the choice between Google Fiber and CenturyLink on my block, I would pick Google because of the price. That being said I am still incredibly excited to get gigabit internet direct to my home for less than some of my friends pay for their cell phone.'''
year_published = 2019
clearnet = "https://maxogden.com/portland-fiber"
