["http://maxogden.com/fast-webview-applications"]
title = "Max Ogden's Website"
full_description = "Embedded mobile WebViews have bad default behaviors that result in slow applications. To help fix the bad defaults I started some new libraries, ViewKit and masseuse.js, and found some helpful libraries written by others. Additionally, all of the specific things covered in this article have associated code examples available in https://github.com/maxogden/fast-webview-applications-presentation Having been recently tasked with writing an iPhone application I found myself at a fork in the road. Going down the path of Objective-C meant diving head first into a painful world of static typing, subclassing, IDEs, closed source frameworks and cultish fanaticism. The other path, JavaScript and HTML5, is one I have been working with every day for years. For me the natural choice would be to work with the tools I knew best, but I also recognized that most developers who write iPhone applications choose Objective-C so there would be a lot (see: tons) of rough edges along the road less traveled. I ended up using Cordova (formerly PhoneGap). The name Cordova comes from the street in Vancouver, Canada that was home to the software developers who built the framework, but the project's goals actually remind me a lot of the Spanish city of Cordoba (Cordova is actually the English form of Cordoba according to Encyclopedia Britannica). Around 1000 years ago Spain was filled, like much of pre-enlightenment western Europe, with people who got all of their information from the church. Then Muslims from northern Africa started moving into southern Spain and spread their ideology: to seek knowledge through science. Cordoba quickly became the most incredible city in the world with paved streets, street lights (gas powered), public hospitals, universities, medical schools, restaurants and the world’s largest library. The whole Objective-C vs JavaScript debate is a modern version of what happened in Spain back in the day. Then: The church delivered the facts and you weren't encouraged to modify them. Now: Apple delivers SDKs and developers aren't allowed to modify them. Then: Cordoba made giant leaps and bounds due to a culture of open science. Now: JavaScript has created of the largest open source projects and fastest growing package repositories."
