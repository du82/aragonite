["http://maxogden.com/tessel-powered-plant-watering-system"]
title = "Max Ogden's Website"
full_description = '''Warning Do not try this at home without the help of an electronics expert. Solid state relays switch high voltage and can cause bodily harm if used improperly. I have been looking for a way to do hobby electronics projects using JavaScript running on microcontrollers. You can control an Arduino remotely from a laptop over USB with libraries like johnny-five, but you can't keep your code running after you close your laptop since the Arduino can't run JavaScript. The Tessel is a microcontroller that runs Node code on the board. The team at Tessel wrote a JS to Lua compiler and then they run Lua directly on the Tessel hardware. It's not the fastest thing in the world, but it opens up most of npm to run on a wi-fi enabled, USB powered microcontroller the size of an Arduino. I would also recommend using a junction box/electronics enclosure for housing the SSR along the lines of this one. The key is the solid state relay. For background on how these works check out this excellent article, but the short version is that they let you use a small voltage (3.3V or 5V such as those available in "digital out" pins in microcontrollers) to turn on and off high voltage circuits such as 110V or 220V (wall outlets). Instead of using an SSR directly as I did you could also purchase a PowerSwitch Tail, which is a pre-made, safely housed relay enclosure that comes to you already built. To build the 'circuit', I simply cut the dimmer slider portion off of the Lamp Dimmer, stripped the ends off of the wires, and connected them to the SSR instead. Where there used to be a dimmer slider the circuit there is now the SSR. The flow of electricity is roughly: Wall -> Dimmer -> SSR -> Pump. The tessel is connected to the SSR and can turn it on and off at will. Again, I can't stress enough that you should really not try this on your own unless you have someone who is experienced with Solid State Relays and 110V/220V electricity. The tessel is running a small HTTP server written in Node that turns the G3 GPIO pin on or off. When it is on it outputs 3.3V to the SSR, which tells the SSR to turn on voltage, which turns on the pump.'''
