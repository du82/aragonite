["https://maxogden.com/a-month-of-modules"]
title = "Max Ogden's Website"
full_description = '''I work on a distributed team with two other developers. The three of us are in three different cities. This month mafintosh came out and stayed in my guest room for the month. I wanted to take the time to document what we wrote during his trip to give a little insight into what is it like to work in an "open source first" way. Most of these were written for use cases involving our day job, dat. Some, such as the Playback video player, were written for fun. Run airpaste on two computers that are on the same network and airpaste opens a two way binary pipe. Uses mdns (aka Bonjour) to connect peers. A module to control a webcam in my backyard from node. The webcam points at some catnip in my yard and motion detects cats. Play videos on your chromecast when nothing else is playing. I use it to play the captured cat videos from the catnip cam. Protocol Buffer Streaming. A standard way to serialize protobuf data. We use protobufs for almost all data interchange now. We are getting friends to implement pbs in Golang and C++. A simple stream module to go through items in stream one at a time. We factored this out of our sorted-*-stream modules above. We rewrote our deploy tools, and produced a series of small modules that can compose together into deploy pipelines. We're calling the system taco Like airpaste or blecat but over webrtc. Uses github usernames for auth/discovery. Opens a duplex stream to someone over webrtc.'''
year_published = 2019
