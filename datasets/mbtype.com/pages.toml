full_description = "ConcourseStylesCharsSampleFeaturesPDF$119 Also availableAdvocateCentury SupraEquityHeliotropeHermes MaiaTriplicateValkyrieLibrary (8 families) translatedutchenglishfrenchgermanicelandicitalianpolishportuguesespanishswahiliswedish The purpose of this paper is to characterize simple sabotage, to outline its possible effects, and to present suggestions for inciting and executing it.Sabotage varies from highly technical acts that require detailed planning and the use of specially-trained operatives, to innumerable simple acts which the ordinary individual citizen-saboteur can perform.This paper is primarily concerned with the latter type. It is executed by an ordinary citizen who may or may not act individually and without the necessity for active connection with an organizedWhere destruction is involved, the weapons of the citizen-saboteur are salt, nails, candles, pebbles, thread, or any other materials he might normally be expected to possess as a householder or as a worker in his particular occupation.Their arsenal is the kitchen shelf, the trash pile, their own usual kit of tools and supplies. The targets of their sabotage are usually objects to which they have normal and inconspicuous access in everyday life.A second type requires no destructive tools whatsoever and produces physical damage, if any, by highly indirect means.It is based on universal opportunities to make faulty decisions, to adopt a noncooperative attitude, and to induce others to follow suit.Making a faulty decision may be simply a matter of placing tools in one spot instead of another. A non-cooperative attitude may involve nothingThis type of activity, sometimes referred to as the human element, is frequently responsible for accidents, delays, and general obstruction even under normal conditions.The potential saboteur should discover what types of faulty decisions and the operations are normally found in this kind of work and should then devise his sabotage so as to enlarge that “margin for error.”Multiplied by thousands of citizen-saboteurs, these acts can be an effective weapon against the enemy. Gains should be stated as specifically as possible for the area addressed.Purposeful stupidity is contrary to human nature. The ordinary citizen needs pressure, stimulation or assurance, and information and suggestions regarding feasible methods of simple sabotage.Slashing tires, draining fuel tanks, igniting fires, starting arguments, acting stupidly, short-circuiting electric systems, abrading machine partsActs of simple sabotage are occurring throughout America. An effort should be made to add to their efficiency.Occurring on a wide scale, this will be a constant and tangible drag on the war effort of the enemy. It may also have secondary results.It may also have secondary results of more or less value. Widespread practice will harass and demoralize enemy administrators and police.To incite the citizen to active practice over sustained periods is a special problem. The citizen performs according to his own initiative and inclination.Success may embolden the saboteur to find colleagues who can assist him in sabotage of greater dimensions.The purpose of this paper is to characterize simple sabotage, to outline its possible effects, and to present suggestions for inciting and executing it.Sabotage varies from highly technical acts that require detailed planning and the use of specially-trained operatives, to innumerable simple acts which the ordinary individual citizen-saboteur can perform.This paper is primarily concerned with the latter type. It is executed by an ordinary citizen who may or may not act individually and without the necessity for active connection with an organizedWhere destruction is involved, the weapons of the citizen-saboteur are salt, nails, candles, pebbles, thread, or any other materials he might normally be expected to possess as a householder or as a worker in his particular occupation.Their arsenal is the kitchen shelf, the trash pile, their own usual kit of tools and supplies. The targets of their sabotage are usually objects to which they have normal and inconspicuous access in everyday life.A second type requires no destructive tools whatsoever and produces physical damage, if any, by highly indirect means."
