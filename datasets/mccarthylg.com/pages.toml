full_description = 'See how stress free working with great lawyers can be. We’re a boutique firm with big-time experience. We’ve represented Y Combinator startups and Fortune 50 Companies. We offer accessible, top-end expertise on cutting-edge questions of technology and the law. And we offer sensible, grounded corporate legal advice to a wide range of businesses. If that sounds like what your business needs, we invite you to learn more to see if McCarthy Law Group is the right fit for you. Contact Us As featured in: <img decoding="async" src="https://mccarthylg.com/wp-content/uploads/2022/02/1.fw_.png" alt="" id="5928"/><img decoding="async" src="https://mccarthylg.com/wp-content/uploads/2022/02/6.fw_.png" alt="" id="5934"/><img decoding="async" src="https://mccarthylg.com/wp-content/uploads/2022/02/5.fw_.png" alt="" id="5933"/><img decoding="async" src="https://mccarthylg.com/wp-content/uploads/2022/02/4.fw_.png" alt="" id="5932"/><img decoding="async" src="https://mccarthylg.com/wp-content/uploads/2022/02/3.fw_.png" alt="" id="5931"/><img decoding="async" src="https://mccarthylg.com/wp-content/uploads/2022/02/2.fw_.png" alt="" id="5929"/><img decoding="async" src="https://mccarthylg.com/wp-content/uploads/2021/05/EIClogonewnew.png" alt="" id="6342"/><img decoding="async" src="https://mccarthylg.com/wp-content/uploads/2021/05/business-insider-e1708345786894.png" alt="" id="6341"/> The Most Popular Blog Post Ever on Web Scraping and the Law In August 2023, I wrote a blog post that was unusual for me. Rather than cover a case or a particular legal issue, I wrote a long rant about hypocrisy in the legal world of web scraping. It became perhaps the most popular thing I have ever written. To this day, it is one of the highest-traffic blog posts in the 20-year history of Professor Eric Goldman’s Technology & Marketing Blog. It was featured on Tyler Cowan’s Marginal Revolution. It shot straight to the top of Hacker News. I suspect it’s the most popular piece of writing ever on web… Read More Six Web-Scraping Legal Trends for Q1 2024 2024 is going to be a massive year for web-scraping legal decisions. There will be substantive decisions in all the major generative AI cases. Big-name scraper Bright Data is in legal battles with Twitter and Facebook. Ryanair and Booking.com are locked in a legal struggle. And so on. With all that, I suspect this is going to be the most important year ever for the law of web scraping. Here are some trends I’m looking for in early 2024. The Pendulum Shifts? Not too long ago, I was writing about how bleak things were looking for web scrapers in the… Read More Arbitration for Thee but Not for Me It is common knowledge among lawyers that online platforms have broad leeway to enforce arbitration agreements in their online ToS. But one wrinkle that is perhaps not as well known is that many companies selectively draft their online contracts to compel arbitration when they prefer it, while still allowing them to avail themselves of traditional courts it suits their preferences. If you know the types of claims that your users will likely have against you, and you know the types of claims that you will likely have against your users and other third parties, it is possible to draft online… Read More Why Online Contracts Are Eating the Law Online contracts are a farce. Everyone knows they’re a farce. But every year, more areas of the law are consumed by the law of online contracts. — In 2011, Marc Andreesen wrote a landmark blog post called, “Why software is eating the world.” It was so prescient that the phrase is now embedded in the Silicon Valley lexicon. He predicted that software would soon revolutionize many industries, even those that we do not perceive as “tech,” by eating much of the value chain in sectors that provide traditional brick-and-mortar services. Airbnb ate much of the hotel industry. It did not… Read More Can an LLC use a SAFE? The short answer is: That’s not what they were designed for. The longer answer is that you shouldn’t use a standard SAFE note to raise capital with an LLC, because it specifically contemplates a type of investment that LLCs cannot do. Namely, a priced, preferred stock round with a venture-capital firm. Most venture capital firms are legally prohibited from investing in pass-through entities, which includes almost all LLCs (unless you’re the very rare LLC that is taxed as a C-corp). It is at least theoretically possible to modify a SAFE note to contemplate a priced-preferred ownership round with a person… Read More I Want to Limit My Liability to the Maximum Extent Possible One of the more common refrains I hear from clients is the phrase “I want to limit my liability to the maximum extent possible.” And I think most lawyers are thrilled when they hear this, because it means the client is risk averse and wants legal services. But the expression always gives me pause. I get it. No one wants to get sued. But the business world is competitive, cutthroat, and outsized profits are not easy to find. Outsized profits require some risk. I can draft you an Abrams tank of a contract. And if you are a large, enterprise… Read More Recent Blog Posts and Writing Featured on Other Sites Time to catch up on cross referencing some of my more recent writing and blog posts on other sites. Last fall, I wrote two big pieces on Eric Goldman’s Law and Technology Blog. The first breaks down the key summary judgment ruling in the hiQ Labs, Inc. v. LinkedIn Corp. case. The second breaks down some of the more popular misconceptions about the law related to web scraping. Last month, I wrote about an interesting case out of South Carolina that addresses whether government restrictions on web scraping implicate the First Amendment. The short answer is that it does! Finally,… Read More View More'
