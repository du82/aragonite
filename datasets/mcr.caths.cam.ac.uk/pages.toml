["https://mcr.caths.cam.ac.uk/about"]
title = "About  | St Catharine's College MCR"
description = """
Sam Ryan          Co-President <mcr.president@caths.cam.ac.uk>          Hey! I'm Sam your Co-President for 2023-24. 

I'm currently in my 4th year of my PhD in Astronomy focusing on the history and structure of the Milky Way using the European Space Agency's Gaia satellite, a field which we call Galactic Archaeology. 

Previously I was Formal Hall Officer and Co-President last year. I've been with the College since 2020 so I've spent quite a bit of time here. So if you have any questions about Catz or about Cambridge as a city or university don't hesitate to ask me.

As Co-President I'll be working with Jessica and College to make sure as many of you have a fantastic year. Representing our postgraduate community and making sure our views are heard. So if you have any questions about the MCR or any issues please do email us or if you see me in person say hi and ask then.

Looking forward to seeing everyone this year!          Studying: PhD Astronomy          Preferred pronoun: He/Him"""
full_description = "Here you can meet the MCR Committee and get to know a little about them and their responsibilities, along with their email addresses for contacting them. You can get in touch with all of us at once by emailing caths-mcr-committee@lists.cam.ac.uk. Hey! I'm Sam your Co-President for 2023-24. I'm currently in my 4th year of my PhD in Astronomy focusing on the history and structure of the Milky Way using the European Space Agency's Gaia satellite, a field which we call Galactic Archaeology. Previously I was Formal Hall Officer and Co-President last year. I've been with the College since 2020 so I've spent quite a bit of time here. So if you have any questions about Catz or about Cambridge as a city or university don't hesitate to ask me. As Co-President I'll be working with Jessica and College to make sure as many of you have a fantastic year. Representing our postgraduate community and making sure our views are heard. So if you have any questions about the MCR or any issues please do email us or if you see me in person say hi and ask then. Looking forward to seeing everyone this year! Hi, I am Jessica, a third year PhD student in developmental psychology at the Centre for Family Research. After being Food & Drinks officer for the MCR last year, this year I'll your MCR president together with Sam. We'll be trying our best to make sure you have a great time at Catz. We're an active but chill MCR that will try to make a difference when it comes to your experience in Cambridge with lots of activities! Just reach out with any questions, we're all very happy to help! Hello there! My name is Paula Teeuwen. Currently, I am in the third year of my PhD in Chemistry, where I am focusing on metal organic cages. These are self-assembled materials in the shape of polyhedra. Alongside the PhD I teach undergraduates by demonstrating lab courses, supervising taught courses and supervising part III students / interns. In my free time I like to hang out with friends, go to our awesome Catz MCR events and chill with the Dutch Society (of which I am also in the committee). Besides that, I love speed- and inline skating. While the first is not really possible in the UK (no proper ice-rinks), I like to do the latter in the weekends by skating to St Ives and back. I joined St Catharine's College two years ago and I have loved my time here ever since. This year, like last year, I am representing our postgraduate students as MCR Secretary. As the secretary I will prepare agendas and keep minutes of the MCR committee and open meetings. Additionally, I circulate our weekly newsletter (during term-time) to keep our members up-to-date about events, news or other relevant information."
