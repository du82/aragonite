["https://mcr.caths.cam.ac.uk"]
title = "Home  | St Catharine's College MCR"
full_description = "St Catharine's College MCR is the society for graduate students at the college. Along with organising social events for graduate students throughout the year, it functions as a link between its members and the college and University authorities, drawing attention to important issues and helping all graduates get the most out of their time in Cambridge. An online guide is available for new and current students. It is packed with a wealth of information about shops, services and life in Cambridge. Along with looking at the events calendar, there is also an email list that anyone (even non-MCR members) can subscribe to. If you would like to be on it, please email the MCR Presidents (mcr.president@caths.cam.ac.uk). St Catharine's is home to a number of societies which organise public lectures, concerts, book-signings and so on, which are open to graduate students at the college. These events are a great way to get to know the college, as well as stimulating in their own right. In order to contact the MCR Committee, you can email all of us at caths-mcr-committee@lists.cam.ac.uk, individually by finding our emails here, or anonymously by using the system here. MCR, St Catharine’s College, Cambridge CB2 1RL, UK Email: mcr.secretary@caths.cam.ac.uk Made with and node.js by souradip. Privacy policy. Data protection (GDPR) policy."
year_published = 2025
clearnet = "https://mcr.caths.cam.ac.uk"
