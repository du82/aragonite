d the link you have followed. We may share information with third parties for the purposes of displaying more relevant advertising based on your interests. You can find more information about the individual cookies we use and the purposes for which we use them in the table below: You can control and manage cookies in various ways. Please keep in mind that removing or blocking cookies can negatively impact your user experience and parts of our website may no longer be fully accessible. Most browsers automatically accept cookies, but you can choose whether or not to accept cookies through your browser controls, often found in your browser’s “Tools” or “Preferences” menu. For more information on how to modify your browser settings or how to block, manage or filter cookies can be found in your browser’s help file or through such sites as: www.allaboutcookies.org. Many of the third party advertising and other tracking services listed above offer you the opportunity to opt out of their tracking systems. You can read more about the information they collect and how to opt out through the privacy policy links listed above. You can block cookies by activating the setting on your browser that allows you to refuse the setting of all or some cookies. However, if you use your browser settings to block all cookies (including essential cookies) you may not be able to access all or parts of our website. Except for essential cookies, all cookies will expire between 30mins and a 2 year period. Cookie Domain Description _shopify_y meantime-brewing-company.myshopify.com This cookie is associated with Shopify''s analytics suite. __cfduid .appsolve.io The cookie is used by cdn services like CloudFare to identify individual clients behind a shared IP address and apply security settings on a per-client basis. It does not correspond to any user ID in the web application and does not store any personally identifiable information. __cfduid .getvitals.io The cookie is used by cdn services like 