title = """
Returns Policy
 – Meantime Brewing Company"""
description = "CHANGES BEFORE THE GOODS ARE DISPATCHED If you wish to cancel or amend an order, please email us at shop@meantimebrewing.com. RETURNS AFTER GOODS ARE DISPATCHED If you would like to return any of your items within 14 calendar days of receipt, please email shop@meantimebrewing.com prior to sending your parcel. Please qu"
full_description = '''<link href="//www.meantimebrewing.com/cdn/shop/t/18/assets/section-main-page.css?v=848677459125201531698926247" rel="stylesheet" type="text/css" media="all" /> <link href="//www.meantimebrewing.com/cdn/shop/t/18/assets/component-rte.css?v=69919436638515329781698926247" rel="stylesheet" type="text/css" media="all" />.section-template--21582037975351__main-padding { padding-top: 21px; padding-bottom: 21px; } @media screen and (min-width: 750px) { .section-template--21582037975351__main-padding { padding-top: 28px; padding-bottom: 28px; } } Returns Policy CHANGES BEFORE THE GOODS ARE DISPATCHED If you wish to cancel or amend an order, please email us at shop@meantimebrewing.com. RETURNS AFTER GOODS ARE DISPATCHED If you would like to return any of your items within 14 calendar days of receipt, please email shop@meantimebrewing.com prior to sending your parcel. Please quote your name, order number and reference, and which product you wish to return. When your goods arrive back with us we can arrange for a refund or exchange. Please note that the shipping fee is non refundable and if your order was placed with free shipping then a restocking fee of £5 per case of beer or £1 per merchandise item will be deducted from the refundable amount. If you decide to cancel, you may return the goods to us at your own expense. Please ensure that the goods are packaged adequately to protect against damage as we may deduct the reduction in value for any damaged goods returned. The returned item is your responsibility until it reaches us. Please return goods to: FAO Fuller's Brewery Online Shop Team, Fuller's Griffin Brewery, Chiswick Lane South, London. W4 2QB Please ensure you retain proof of postage. FAULTY OR DAMAGED GOODS If the goods are faulty or broken, please contact us at shop@meantimebrewing.com quoting your name, order number and reference, address and telephone number together with details of the product and the problem. We will replace the goods or refund you in accordance with your legal rights. This cancellation policy does not affect your legal rights. If the goods are faulty or misrepresented, we will deal with the matter in accordance with your legal rights and advise on how to proceed.'''
