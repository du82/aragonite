["https://meantimebrewing.com/pages/delivery-info"]
title = """
Delivery Info
 – Meantime Brewing Company"""
description = "Where do you deliver?  We deliver to UK Mainland addresses excluding Northern Ireland, the Channel Islands, the Isle of Man and the Scottish islands. How much is delivery?  We offer FREE delivery to most UK Mainland addresses for orders over £50. For orders under £50, delivery costs £5.95. Please proceed to the checkou"
full_description = '<link href="//www.meantimebrewing.com/cdn/shop/t/18/assets/section-main-page.css?v=848677459125201531698926247" rel="stylesheet" type="text/css" media="all" /> <link href="//www.meantimebrewing.com/cdn/shop/t/18/assets/component-rte.css?v=69919436638515329781698926247" rel="stylesheet" type="text/css" media="all" />.section-template--21582037975351__main-padding { padding-top: 21px; padding-bottom: 21px; } @media screen and (min-width: 750px) { .section-template--21582037975351__main-padding { padding-top: 28px; padding-bottom: 28px; } } Delivery Info Where do you deliver? We deliver to UK Mainland addresses excluding Northern Ireland, the Channel Islands, the Isle of Man and the Scottish islands. How much is delivery? We offer FREE delivery to most UK Mainland addresses for orders over £50. For orders under £50, delivery costs £5.95. Please proceed to the checkout to calculate the cost of delivery for your order How long will it take? We offer free next working day delivery for all orders over £50 placed before 12 noon.If an order is placed on a Friday morning it will be delivered the following Monday. If an order is placed on a Friday afternoon, it will be delivered the following Tuesday. If an order is placed on a weekend it will be delivered the following Tuesday. Who will deliver my items? Our courier partner DHL UK. What if I am out? All deliveries will be delivered to your door or left in a safe place. We may ask for you to sign for your delivery and may ask for ID to verify age. If you are out when the courier arrives, the courier may leave a card with a contact number for you to call. In the event you are asked by a courier to re-arrange a delivery, you are responsible to arrange this delivery. What if my order didn’t arrive? Please contact us right away so we can investigate! Either email shop@meantimebrewing.com or phone 0208 293 1111 (Opt 1) Important, please note: We do everything we can to meet the delivery times specified in this section. However, delivery times may be affected by factors beyond our control and therefore they cannot be guaranteed. We will inform you if we become aware of an unexpected delay We are unable to accept liability for any delays. Last Updated: 01/03/2022'
