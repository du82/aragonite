title = """
About
 – Meantime Brewing Company"""
description = "Browse our range of Meantime beers online, glassware & merch. Plus FREE UK delivery on order over £50. Stock up on your favorite craft beer online London Lager ✓ London Pale Ale ✓  Easytime Lager ✓  Anytime IPA ✓ Yakima Red ✓  and more brilliant brews from Meantime Brewing Company"
full_description = '''.section-template--21582037877047__1663854584ec112e5c-padding { padding-top: calc(0px * 0.75); padding-bottom: calc(0px * 0.75); } @media screen and (min-width: 750px) { .section-template--21582037877047__1663854584ec112e5c-padding { padding-top: 0px; padding-bottom: 0px; } } @media screen and (max-width: 749px) { .page-about .about-intro { background-image: url(//www.meantimebrewing.com/cdn/shop/t/18/assets/asset--about-intro-mobile.png?v=159537100534208307191698926247); }} @media screen and (min-width: 750px) { .page-about .about-intro { background-image: url(//www.meantimebrewing.com/cdn/shop/t/18/assets/asset--about-intro.png?v=152132026946571919231698926247); }} It's About Time... Producing great beer takes time - and no one knows this better than our founder, Alistair Hook.Started in 1999 in a Greenwich flat, Meantime Brewing Co was founded on a pioneering spirit and the belief that time is best spent doing what you love. <link href="//www.meantimebrewing.com/cdn/shop/t/18/assets/component-rte.css?v=69919436638515329781698926247" rel="stylesheet" type="text/css" media="all" /> <link href="//www.meantimebrewing.com/cdn/shop/t/18/assets/section-rich-text.css?v=155250126305810049721698926247" rel="stylesheet" type="text/css" media="all" />.section-template--21582037877047__16638451427b491afd-padding { padding-top: 30px; padding-bottom: 39px; } @media screen and (min-width: 750px) { .section-template--21582037877047__16638451427b491afd-padding { padding-top: 40px; padding-bottom: 52px; } } BORN IN GREENWICH. THE HOME OF TIME. Brewed with time, passion and dedication, Alistair’s innovative and high-quality beers led to one of the first major craft breweries that sparked the craft beer movement - and made settling for average beer a thing of the past.Alistair’s core belief and pioneering mission still drives today. And though we may have outgrown Alistair’s flat, you’ll still find us spending every available minute and second producing the most game-changing brews we can.So crack open a cold one and let’s all cheers to time well spent! Shop Now <link href="//www.meantimebrewing.com/cdn/shop/t/18/assets/component-slider.css?v=95971316053212773771698926247" rel="stylesheet" type="text/css" media="all" />.section-template--21582037877047__16638458568568213b-padding { padding-top: 60px; padding-bottom: 60px; } @media screen and (min-width: 750px) { .section-template--21582037877047__16638458568568213b-padding { padding-top: 80px; padding-bottom: 80px; } } Time For Meantime Is... Our HomeMeantime was born in Greenwich, the home of time and a pioneering maritime history. A place of diverse contrasts built on honest industry and creative community, where 300-year-old architecture meets the modern London skyline. Our CraftThe fifth ingredient in Meantime beers is time. The time building brewing skill and expertise, the time to source the best British, German and American ingredients, and the time to push the boundaries of brewing with new recipes. Ours To EnjoyTime is our most valuable commodity, so we believe in choosing to spend it well. We valuetime shared, spending time with our friends, and coming together as a community to build connections through great beer.Shop Now <link href="//www.meantimebrewing.com/cdn/shop/t/18/assets/component-slider.css?v=95971316053212773771698926247" rel="stylesheet" type="text/css" media="all" />.section-template--21582037877047__166385382140078463-padding { padding-top: 60px; padding-bottom: 27px; } @media screen and (min-width: 750px) { .section-template--21582037877047__166385382140078463-padding { padding-top: 80px; padding-bottom: 36px; } } Official Beer Partnerships 1 / of 3 <link href="//www.meantimebrewing.com/cdn/shop/t/18/assets/component-rte.css?v=69919436638515329781698926247" rel="stylesheet" type="text/css" media="all" /> <link href="//www.meantimebrewing.com/cdn/shop/t/18/assets/section-rich-text.css?v=155250126305810049721698926247" rel="stylesheet" type="text/css" media="all" />.section-template--21582037877047__166385367325596d98-padding { padding-top: 0px; padding-bottom: 39px; } @media screen and (min-width: 750px) { .section-template--21582037877047__166385367325596d98-padding { padding-top: 0px; padding-bottom: 52px; } } Charlton FC Learn More <link href="//www.meantimebrewing.com/cdn/shop/t/18/assets/component-slider.css?v=95971316053212773771698926247" rel="stylesheet" type="text/css" media="all" />.section-template--21582037877047__166385352296e361c1-padding { padding-top: 27px; padding-bottom: 27px; } @media screen and (min-width: 750px) { .section-template--21582037877047__166385352296e361c1-padding { padding-top: 36px; padding-bottom: 36px; } } 1 / of 3 .section-template--21582037877047__1663854031a9e72fa3-padding { padding-top: 54px; padding-bottom: 60px; } @media screen and (min-width: 750px) { .section-template--21582037877047__1663854031a9e72fa3-padding { padding-top: 72px; padding-bottom: 80px; } } .newsletter-form__field-wrapper { display: flex; gap: 8px; } .newsletter-form__field-wrapper .button.button--primary { background: rgb(var(--color-base-text)); } .newsletter-form__field-wrapper .field::after { box-shadow: none; } Hop On Our Mailing List Email Join'''
