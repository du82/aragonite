k', function() { player.enterFullScreen() }); document.addEventListener('keypress', function (event) { // do not capture events from input fields if (event.target.tagName === 'INPUT') { return; } switch(event.key) { case 'k': case ' ': event.preventDefault(); player.paused ? player.play() : player.pause(); break; case 'f': player.fullscreen(); //event.preventDefault(); break; default: // forward other events to player mediaElement.dispatchEvent(event); console.log(event); } }); } }); }); }) Saal 1 Science Playlists: '38c3' videos starting here / audio 41 min 2024-12-30 3.5k Fahrplan How do you think? People can experience thoughts, feelings, and sensory inputs very differently. While context and substances are known to promote changes in perception and thinking, the biological basis is very diverse, contrary to what is often assumed. Brain cells come in extraordinary varieties in size, shape, and complexity. Their synaptic connectivity provides the foundation of all our sensory input, motor output, cognitive functions, and thoughts. In short: They shape us. This talk gives an introduction about the extent of variability in neuronal patterns that underlies neurodiversity and critically discusses the idea of neurodivergence, diagnosis criteria in Autism and ADHD from a biological and first person-perspective. We find that biological variability of brains is an evolutionary feature that helps us to adapt to our environment but comes with certain risks and downsides in our modern society. While many things are still unknown, scientists have identified genes and environmental impacts that shape our network architecture during brain development and which help to explain why we think and experience the world so differently. This talk gives an introduction about the extent of variability in neuronal patterns that underlies neurodiversity and critically discusses the idea of neurodivergence, diagnosis criteria in Autism and ADHD from a biological and affected person-perspective. It aims to clear up stereotypes, dogmas that still stick in our society and provides latest insights from science and community about what makes our brains work so differently. Licensed to the public under http://creativecommons.org/licenses/by/4.0 Download Video MP4 WebM Download 1080p eng-deu 1019 MB Download 576p eng-deu 158 MB Download 1080p eng-deu 417 MB Download 576p eng-deu 145 MB These files contain multiple languages. This Talk was translated into multiple languages. The files available for download contain all languages as separate audio-tracks. Most desktop video players allow you to choose between them. Please look for "audio tracks" in your desktop video player. Subtitles eng Help us to improve these subtitles! Audio Download mp3 eng 37 MB Download mp3 deu 37 MB Download opus eng 30 MB Download opus deu 26 MB Embed <iframe width="1024" height="576" src="https://media.ccc.de/v/38c3-all-brains-are-beautiful-the-biology-of-neurodiversity/oembed" frameborder="0" allowfullscreen></iframe> Share: $(function() { $('.share').on('click', 'a.popup', function (e) { window.open(this.href, 'share it', 'width=800,height=420,resizable=yes'); e.preventDefault(); }); $("textarea.share").on('focus', function() { $(this).select(); }); $('.share').on('click', '[data-share=mastodon]', function (e) { e.stopPropagation(); mastodonShare(this.dataset.text, this.dataset.url); e.preventDefault(); }) }); Tags 38c3 436 2024 Science Saal 1'''
