description = "Radwegweiser finden sich überall in Deutschland, so auch in Lübeck und Umgebung. Sie bilden ein Netz aus Strecken, aus die für das Radfah..."
full_description = '''Ausgeschilderte Radnetze in OSM Von Radwegweisern aufgespannte Netze – wie in OSM abbilden und nutzen? Jens-Uwe Hagenah $(function() { var params = new URLSearchParams(window.location.hash && window.location.hash.split('#')[1]); var stamp = params.get('t'), lang = params.get('l'), srt = params.get('s'), $video = $('video'), promises = []; $('video source').each(function() { var $source = $(this); // Prop always presents the fully resolved URL promises.push( MirrorbrainFix.selectMirror($source.prop('src'), function(mirror) { $source.attr('src', mirror); }) ); }); $.when.apply($, promises).done(function() { $('video').mediaelementplayer({ usePluginFullScreen: true, enableAutosize: true, stretching: 'responsive', features: ['skipback', 'playpause', 'jumpforward', 'progress', 'current', 'duration', 'tracks', 'volume', 'speed', 'sourcechooser', 'fullscreen', 'postroll', 'timelens'], skipBackInterval: 15, startLanguage: lang, success: function (mediaElement, originalNode, player) { window.mediaElement = mediaElement; window.player = player; if (srt || srt === "") { var subtitles = player.tracks.filter(x => x.kind === 'subtitles'); var track = subtitles.filter(x => x.srclang === srt); console.log(track); if (track) { player.setTrack(track[0].trackId); } else { player.setTrack(subtitles[0].trackId); } } mediaElement.addEventListener('canplay', function () { if (stamp) { mediaElement.setCurrentTime(stamp); stamp = null; } }); mediaElement.addEventListener('playing', function () { $.post("/public/recordings/count", {event_id: $video.data('id'), src: mediaElement.src}); }, false); function updateHash() { var l = player.options.startLanguage || ''; var hash = (l ? '#l='+l+'&t=' : '#t=') + Math.round(mediaElement.currentTime); if (srt) { hash += '&s=' + srt; } window.location.replaceHash(hash); } mediaElement.addEventListener('pause', updateHash, false); mediaElement.addEventListener('seeked', updateHash, false); // see https://github.com/voc/voctoweb/pull/447 mediaElement.firstChild.addEventListener('dblclick', function() { player.enterFullScreen() }); document.addEventListener('keypress', function (event) { // do not capture events from input fields if (event.target.tagName === 'INPUT') { return; } switch(event.key) { case 'k': case ' ': event.preventDefault(); player.paused ? player.play() : player.pause(); break; case 'f': player.fullscreen(); //event.preventDefault(); break; default: // forward other events to player mediaElement.dispatchEvent(event); console.log(event); } }); } }); }); }) AMS3 Playlists: 'nook24' videos starting here / audio 44 min 2024-11-09 2025-01-19 465 Fahrplan Radwegweiser finden sich überall in Deutschland, so auch in Lübeck und Umgebung. Sie bilden ein Netz aus Strecken, aus die für das Radfahren besonders geeignet sind. Sie tun dies ebenso wie Knotenpunkt-Netzwerke z.B. in den Niederlanden. Der Vortrag soll einführen, wie sich ein Netz aus verbundenen Wegweisern um Routing nutzen ließe. Damit wäre ein Radfahren von Wegweiser zu Wegweiser möglich. Unterwegs zeigen aufgestellte Wegmarken/ Zwischenwegweiser die Verbindung von einem Wegweiser zum nächsten ohne z.B. auf eine gedruckte Karte oder ein Smartphone zu schauen. In dem Vortrag wird ein neues Schema vorgestellt, wie sich jeweils die benachbarten Wegweiser und ihre zugehörigen Strecken in OSM abbilden lassen und wie diese Daten exemplarisch zum Routing bei Online-Diensten oder offline auf dem Smartphone nutzen ließen. Der Vortrag orientiert sich als Beispiel des Routings an der Strecke vom Markt in Bad Schwartau zum Markt in Eutin und zeigt welche Strecken daraus resultieren und wie sich diese z.B. von denen eines großen Anbieters unterscheiden. Die Nights of Open Knowledge (Nook) in Lübeck ist eine offene Vortragsveranstaltung, die einem weiten Publikum Einblicke in die verschiedene Bereiche der Informatik, aber auch technikfremde Themen bietet. Die NooK wird vom Chaotikum e.V. aus Lübeck und der Studierendenschaft der Uni Lübeck veranstaltet. https://nook-luebeck.de/ This work is licensed under a Creative Commons Attribution-NonCommercial-NoDerivatives 4.0 International License (CC BY NC ND 4.0). https://creativecommons.org/licenses/by-nc-nd/4.0/ CC BY NC ND 4.0 Download Video MP4 WebM Download 1080p deu 161 MB Download 576p deu 68 MB Download 1080p deu 179 MB Download 576p deu 87 MB Audio Download mp3 deu 40 MB Download opus deu 25 MB Embed <iframe width="1024" height="576" src="https://media.ccc.de/v/2024-11-09-ausgeschilderte-radnetze-in-osm/oembed" frameborder="0" allowfullscreen></iframe> Share: $(function() { $('.share').on('click', 'a.popup', function (e) { window.open(this.href, 'share it', 'width=800,height=420,resizable=yes'); e.preventDefault(); }); $("textarea.share").on('focus', function() { $(this).select(); }); $('.share').on('click', '[data-share=mastodon]', function (e) { e.stopPropagation(); mastodonShare(this.dataset.text, this.dataset.url); e.preventDefault(); }) }); Tags nook24 1552 2024 AMS3'''
