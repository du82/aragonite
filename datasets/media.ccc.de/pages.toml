ener('dblclick', function() { player.enterFullScreen() }); document.addEventListener('keypress', function (event) { // do not capture events from input fields if (event.target.tagName === 'INPUT') { return; } switch(event.key) { case 'k': case ' ': event.preventDefault(); player.paused ? player.play() : player.pause(); break; case 'f': player.fullscreen(); //event.preventDefault(); break; default: // forward other events to player mediaElement.dispatchEvent(event); console.log(event); } }); } }); }); }) Willem van Oranje Talks Playlists: 'hackerhotel2025' videos starting here / audio 37 min 2025-02-16 165 Fahrplan Nuclear fusion is a clean safe energy. Fusing hydrogen nuclei to release an enormous amount of energy. This talk will cover: - A recap of the physics that makes fusion work - How to build a fusion reactor at home - How nuclei collide and what is needed to the coulomb barrier - Challenges in how to scale it up and make it generate more power - How far are we to have fusion energy on the power grid - Current technical challenges in fusion - How we can solve problems using machine learning Nuclear fusion promises a clean, safe, and abundant source of energy by fusing hydrogen isotopes to release more power than is put in. In this talk, we will start by clarifying the fundamental physics of fusion—how overcoming the Coulomb barrier allows two hydrogen nuclei to fuse. We will then explore the path to industrial-scale fusion power, focusing on international prototypes such as ITER, designed to demonstrate an energy output of Q=10 (50 MW in, 500 MW out). Alongside the incredible engineering achievements involved in building such large machines, we will discuss the complexities of controlling high-temperature plasmas, mitigating disruptions, and managing edge-localized modes (ELMs). Throughout the talk, we will highlight novel control and diagnostic strategies, including machine-learning-based models that can aid real-time plasma monitoring and regulation. Ultimately, we will address how these technologies, with deeper physical understanding, can bring us closer to fusion’s full potential as a reliable and low-waste energy source. Licensed to the public under http://creativecommons.org/licenses/by/4.0 Download Video MP4 WebM Download 1080p eng 447 MB Download 576p eng 99 MB Download 1080p eng 294 MB Download 576p eng 87 MB Audio Download mp3 eng 34 MB Download opus eng 23 MB Embed <iframe width="1024" height="576" src="https://media.ccc.de/v/2025-203-how-thermonuclear-fusion-works-free-energy-without-waste/oembed" frameborder="0" allowfullscreen></iframe> Share: $(function() { $('.share').on('click', 'a.popup', function (e) { window.open(this.href, 'share it', 'width=800,height=420,resizable=yes'); e.preventDefault(); }); $("textarea.share").on('focus', function() { $(this).select(); }); $('.share').on('click', '[data-share=mastodon]', function (e) { e.stopPropagation(); mastodonShare(this.dataset.text, this.dataset.url); e.preventDefault(); }) }); Tags 203 2025 hackerhotel2025 Talks Willem van Oranje hackerhotel2025-eng Day 3'''
