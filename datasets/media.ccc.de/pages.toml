full_description = '''This site offers a wide variety of video and audio material distributed by the Chaos Computer Club provided in native formats (usually MPEG and/or Vorbis families) for online viewing. Older, archived recordings might require proprietary players. The media files on this site can also be downloaded for offline consumption which includes lecture slides (PDF) and subtitles (SRT/WebVTT). The license displayed in the actual video file applies, typically the corresponding logo and licence URL are displayed as part of the outro or intro, or the file's metadata. If there is no license encoded in the video file we suggest you ask the event organizers, reachable via the "Fahrplan" link below the individual video. If you are anyhow related to the Chaos Computer Club and would like us to convert and publish your video material on this website, feel free to contact us. Whilst we hope you find the provided video material interesting and informative we can give no assurances or warranty regarding its quality. The opinions expressed in the video material do not necessarily state or reflect those of the Chaos Computer Club. Please use the issue tracker on GitHub to let us know about errors media.ccc.de . The latest source code version of this platform is also hosted on GitHub and ready to expect your pull-requests. You can download all files directly from our CDN. The MP4 files might contain multiple audio tracks when we were provided live translations e.g. from c3lingo. Some files even contain an additional video track with only the slides. Most desktop video players allow you to choose between them. Please look for the "tracks selection" in your desktop video player e.g. VLC. Subtitles are provided by c3subtitles and should be automatically found, when you drop them beside the video files. While browsing through the website normally we do not save any information wich could be used to identify a person. The log files are anonymized before they are saved and we do not have a de-anonymized version of the them. The anonymized log-files may be used to plot usage statistics.'''
