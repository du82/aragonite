Als die Kommentarspalten brannten – 11 Monate Einsatz in Gaza

- media.ccc.de"""
description = "Der Krieg in Gaza als Reaktion auf die Terrorattacke vom 7. Oktober läuft mittlerweile über ein Jahr. Cadus ist seit Februar diesen Jahre..."
full_description = '''Als die Kommentarspalten brannten – 11 Monate Einsatz in Gaza Sebastian Jünemann, Anna-Lea Göhl and Nic Zemke $(function() { var params = new URLSearchParams(window.location.hash && window.location.hash.split('#')[1]); var stamp = params.get('t'), lang = params.get('l'), srt = params.get('s'), $video = $('video'), promises = []; $('video source').each(function() { var $source = $(this); // Prop always presents the fully resolved URL promises.push( MirrorbrainFix.selectMirror($source.prop('src'), function(mirror) { $source.attr('src', mirror); }) ); }); $.when.apply($, promises).done(function() { $('video').mediaelementplayer({ usePluginFullScreen: true, enableAutosize: true, stretching: 'responsive', features: ['skipback', 'playpause', 'jumpforward', 'progress', 'current', 'duration', 'tracks', 'volume', 'speed', 'sourcechooser', 'fullscreen', 'postroll', 'timelens'], skipBackInterval: 15, startLanguage: lang, success: function (mediaElement, originalNode, player) { window.mediaElement = mediaElement; window.player = player; if (srt || srt === "") { var subtitles = player.tracks.filter(x => x.kind === 'subtitles'); var track = subtitles.filter(x => x.srclang === srt); console.log(track); if (track) { player.setTrack(track[0].trackId); } else { player.setTrack(subtitles[0].trackId); } } mediaElement.addEventListener('canplay', function () { if (stamp) { mediaElement.setCurrentTime(stamp); stamp = null; } }); mediaElement.addEventListener('playing', function () { $.post("/public/recordings/count", {event_id: $video.data('id'), src: mediaElement.src}); }, false); function updateHash() { var l = player.options.startLanguage || ''; var hash = (l ? '#l='+l+'&t=' : '#t=') + Math.round(mediaElement.currentTime); if (srt) { hash += '&s=' + srt; } window.location.replaceHash(hash); } mediaElement.addEventListener('pause', updateHash, false); mediaElement.addEventListener('seeked', updateHash, false); // see https://github.com/voc/voctoweb/pull/447 mediaElement.firstChild.addEventListener('dblclick', function() { player.enterFullScreen() }); document.addEventListener('keypress', function (event) { // do not capture events from input fields if (event.target.tagName === 'INPUT') { return; } switch(event.key) { case 'k': case ' ': event.preventDefault(); player.paused ? player.play() : player.pause(); break; case 'f': player.fullscreen(); //event.preventDefault(); break; default: // forward other events to player mediaElement.dispatchEvent(event); console.log(event); } }); } }); }); }) Saal GLITCH Ethics, Society & Politics Playlists: '38c3' videos starting here / audio 52 min 2024-12-27 2024-12-30 3.0k Fahrplan Der Krieg in Gaza als Reaktion auf die Terrorattacke vom 7. Oktober läuft mittlerweile über ein Jahr. Cadus ist seit Februar diesen Jahres in Gaza im Einsatz. Auch seit Februar diesen Jahres teilen wir wie so viele andere die Erfahrung, das vor dem Hintergrund unseres Einsatzes fernab von Gaza sich leidenschaftlich „politisch“ auseinandergesetzt wird. Nicht ÜBER unseren Einsatz wohlgemerkt, sondern darüber, ob wir jetzt die eine oder andere Seite genug verurteilen würden für die Art und Weise wie der Krieg geführt wird. In unserem Talk „Als die Kommentarspalten brannten – 11 Monate Einsatz in Gaza“ sprechen wir über die Herausforderungen, die unseren Einsatz tatsächlich begleiten. Cadus ist seit Februar 2024 in Gaza im Einsatz. Unsere Arbeit dort umfasst die Stabilisierung schwerstverletzter Zivilist*innen, medical evacuations und Unterstützung/medizinische Absicherung der Einsätze des United Nations Mine Action Service. Dieser Einsatz ist in Bezug auf die Herausfoderungen auf vielen Ebenen noch einmal deutlich anspruchsvoller als das, was wir als CADUS aus anderen Kriegsgebieten gewohnt sind. Seit Februar haben wir mehr als 3500 schwerstverletzte Patient*innen behandelt und mehrere hundert Menschen innerhalb Gazas und aus Gaza heraus evakuiert. Wir beleuchten unseren Katastrophenhilfe-Einsatz aus drei unterschiedlichen Blickwinkeln. Sebastian wird über die logistischen und administrativen Herausforderungen unseres Einsatzes reden. Wie geht das, in einem der aktuell gefährlichsten Kriegsgebiete einen Hilfseinsatz zu starten und am laufen zu halten? Vor allem unter Berücksichtigung der bestehenden umfassenden Embargos und der Behinderungen humanitärer Hilfe Anna-Lea berichtet darüber, wie wir unsere Teams auf den Einsatz vorbereiten, wie wir versuchen sie während des Einsatzes zu unterstützen, und wie ein Nachsorgeangebot aussehen kann (und muss) für Leute die freiwillig in so einen Einsatz gehen. Mit Nic Zemke hatten wir passend zum 38c3 einen echten Nerd im Einsatz, der darüber sprechen wird wie derzeit Hilfsorganisationen und Vereinte Nationen KML-Files mit überlebenswichtigen Informationen über WhatsApp hin und her schicken und wie wir ein für die Seenotrettung entwickeltes Geoinformationssystem in kürzester Zeit so umgebaut haben, dass die Koordination von Hilfseinsätzen bald hoffentlich weniger Fehleranfällig läuft. Licensed to the public under http://creativecommons.org/licenses/by/4.0 Download Video MP4 WebM Download 1080p deu-eng 1602 MB Download 576p deu-eng 204 MB Download 1080p deu-eng 673 MB Download 576p deu-eng 181 MB These files contain multiple languages. This Talk was translated into multiple languages. The files available for download contain all languages as separate audio-tracks. Most desktop video players allow you to choose between them. Please look for "audio tracks" in your desktop video player. Subtitles deu Help us to improve these subtitles! Audio Download mp3 deu 48 MB Download mp3 eng 48 MB Download opus deu 30 MB Download opus eng 30 MB Embed <iframe width="1024" height="576" src="https://media.ccc.de/v/38c3-als-die-kommentarspalten-brannten-11-monate-einsatz-in-gaza/oembed" frameborder="0" allowfullscreen></iframe> Share: $(function() { $('.share').on('click', 'a.popup', function (e) { window.open(this.href, 'share it', 'width=800,height=420