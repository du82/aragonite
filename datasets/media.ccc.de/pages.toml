l/447 mediaElement.firstChild.addEventListener('dblclick', function() { player.enterFullScreen() }); document.addEventListener('keypress', function (event) { // do not capture events from input fields if (event.target.tagName === 'INPUT') { return; } switch(event.key) { case 'k': case ' ': event.preventDefault(); player.paused ? player.play() : player.pause(); break; case 'f': player.fullscreen(); //event.preventDefault(); break; default: // forward other events to player mediaElement.dispatchEvent(event); console.log(event); } }); } }); }); }) AMS1 Playlists: 'nook24' videos starting here / audio 43 min 2024-11-08 2025-01-15 356 Fahrplan Analoge Spiele gewinnen zunehmend an Popularität. Das ist nicht erst seit der Corona-Pandemie so. Allerdings hat das Brettspiel durch sie nochmal besonders an Beliebtheit gewonnen. Auch die Wissenschaft interessiert sich mittlerweile für Spiele und wird immer häufiger auch zum Thema in Brettspielen selbst. In meinem Vortrag möchte ich euch einen Überblick über Wissenschaften im Brettspiel und das Brettspiel in der Wissenschaft geben. Wie baue ich ein stabiles Ökosystem und entdecke spielerisch die Zusammenhänge unserer heimischen Flora und Fauna? Wie ist die Energiewende zu schaffen? Brauche ich einen Druckanzug, um am heimischen Wohnzimmertisch die Tiefsee zu erforschen? Kann ich die Evolutionstheorie an einem Abend durchspielen? Ich werde euch einige Spiele vorstellen, mit denen diese Fragen beantwortet werden können und in denen gleichermaßen wissenschaftliche wie gesellschaftlich relevante Themen aufgegriffen werden. Die Nights of Open Knowledge (Nook) in Lübeck ist eine offene Vortragsveranstaltung, die einem weiten Publikum Einblicke in die verschiedene Bereiche der Informatik, aber auch technikfremde Themen bietet. Die NooK wird vom Chaotikum e.V. aus Lübeck und der Studierendenschaft der Uni Lübeck veranstaltet. https://nook-luebeck.de/ This work is licensed under a Creative Commons Attribution-NonCommercial-NoDerivatives 4