() { player.enterFullScreen() }); document.addEventListener('keypress', function (event) { // do not capture events from input fields if (event.target.tagName === 'INPUT') { return; } switch(event.key) { case 'k': case ' ': event.preventDefault(); player.paused ? player.play() : player.pause(); break; case 'f': player.fullscreen(); //event.preventDefault(); break; default: // forward other events to player mediaElement.dispatchEvent(event); console.log(event); } }); } }); }); }) Playlists: 'datengarten' videos starting here / audio 54 min 2024-02-28 2024-02-29 641 Fahrplan Um die Energiewende voranzutreiben, wird die Kernfusion oft als das ultimative Kraftwerk und als die Lösung all unserer energetischen Probleme angesehen, dennoch blieb diese Technologie seit 1960 stets “dreißig Jahre entfernt”. Um die Frage zu beantworten, ob ein echtes Fusionskraftwerk bald wirtschaftlich Energie produzieren könnte, betrachten wir den Fusionsreaktor von den Grundlagen physikalischer Prozesse der Fusion bis zum Aufbau und den technischen und politischen Problemen beim Bau eines Fusionsreaktors, der ja am Ende diesen Prozess auf der Erde durchführen soll, um – so hofft man – nachhaltig an große Mengen elektrischer Energie zu gelangen. Um stabile Fusion zu erreichen, sind ein besonders heißes Plasma und starker magnetischer Einschluss wichtig. Dabei gibt es zwischen den Modellen Stellarator und Tokamak Unterschiede, jeweils mit ihren eigenen Vorzügen und Nachteilen. Die betrachteten Modelle verwenden verschiedene Heizmethoden, um das Plasma über Strom, Strahlung und Teilcheneinschuss heizen. Um einen ausreichend starken magnetischen Einschluss zu erreichen, sind nicht nur sehr starke und supraleitende Spulen vonnöten, sondern auch spezielle Vorrichtungen, welche das Plasma in Schichten aufteilen. Hier spielt auch die Turbulenz (der Übergang von geordneten, in chaotische Ströme) eine große Rolle. Wir wollen die theoretischen Aspekte anhand von den Fusionsexperimenten JET, ITER und Wendelstein 7x betrachten und im praktischen Kontext mit neueren Ansätze seitens Firmen außerhalb der Grundlagenforschung vergleichen, bei denen aus Forschersicht nebensächliche Details wie ingenieurtechnische Sicherheitsmaßnahmen und Beschaffung und Entsorgung der nötigen Grund- und Abfallstoffe große Bedeutung zufallen. Daher gehört zu einer realistischen Abwägung der Praktikabiliät – kurzum, ob uns die Fusion vor der Klimakatastrophe retten kann – auch eine Betrachtung des politischen Einflusses und allgemeiner finanzieller Schwierigkeiten der Grundlagenforschung zur Fusion und deren Umsetzung und die Übergabe an die Privatwirtschaft. – Der Referent bringt Erfahrungen aus mehreren Praktika am IEK 4 des Forschungszentrums Jülich und das IPP Greifswald mit, wo das Fusionsexperiment Wendelstein 7x steht. Download Video MP4 WebM Download 1080p deu 248 MB Download 576p deu 93 MB Download 1080p deu 245 MB Download 576p deu 111 MB Subtitles Help us to subtitle this talk! Audio Download mp3 deu 49 MB Download opus deu 30 MB Embed <iframe width="1024" height="576" src="https://media.ccc.de/v/dg-110/oembed" frameborder="0" allowfullscreen></iframe> Share: $(function() { $('.share').on('click', 'a.popup', function (e) { window.open(this.href, 'share it', 'width=800,height=420,resizable=yes'); e.preventDefault(); }); $("textarea.share").on('focus', function() { $(this).select(); }); $('.share').on('click', '[data-share=mastodon]', function (e) { e.stopPropagation(); mastodonShare(this.dataset.text, this.dataset.url); e.preventDefault(); }) }); Tags datengarten 110 2024'''
