rFullScreen() }); document.addEventListener('keypress', function (event) { // do not capture events from input fields if (event.target.tagName === 'INPUT') { return; } switch(event.key) { case 'k': case ' ': event.preventDefault(); player.paused ? player.play() : player.pause(); break; case 'f': player.fullscreen(); //event.preventDefault(); break; default: // forward other events to player mediaElement.dispatchEvent(event); console.log(event); } }); } }); }); }) Saal 1 Ethics, Society & Politics Playlists: '38c3' videos starting here / audio 40 min 2024-12-29 2024-12-30 8.8k Fahrplan Wie Rechtspopulisten in Österreich innerhalb von 5 Jahren zurück zu alter Größe kamen und sogar die Wahl gewannen. Die Ibiza-Affäre gilt als einer der größten politischen Skandale in der Geschichte der Zweiten Republik Österreich. Das heimlich aufgezeichnete Ibiza-Video zeigt den damaligen FPÖ-Chef Heinz-Christian Strache und FPÖ-Politiker Johann Gudenus in einer Villa mit einer vermeintlichen Nichte eines russischen Oligarchen. Seit dem ist viel passiert. Zu wenig hat sich zum Guten gewandt aber immerhin ist mittlerweile zumindest oberflächlich klarer geworden wie sehr die einzelnen Skandale die die Alpenrepublik erschütterten seit dem in einander verwoben sind. Die Umwälzungen der letzten Jahre nicht nur in Österreich erlauben es Parallelen zu ziehen auch über die Landesgrenzen hinweg. Die Kausen um den früheren Wirecard Vorstand Jan Marsalek, seines Zeichens zufällig auch Österreicher, lassen sich mit dem Gesamteindruck von Ibiza schlüssig verknüpfen. Die geopolitischen Umwälzungen wie auch die politischen Herausforderungen die selbige für Europa mit sich bringen sollten am Beispiel von der Alpenrepublik nicht nur als Belustigung dienen. Wie schnell und wie weit eines der Vorbilder der EU Länder unter den richtigen Gegebenheiten und Einflüssen sich zum Paria wandeln kann sollte als ernstzunehmende Warnung auch in Deutschland verstanden werden. Wenn die Säulen der Demokratie ins Wanken geraten ist es oft sehr viel schneller beim Ernstfall als die meisten es sich einreden wollen. Österreich mag klein sein, manchmal auch speziell aber die Faktoren die innerhalb kürzester Zeit von einem Musterschüler ein Sorgenkind machten sind nicht kleinzureden. Fünf Jahre später, im September 2024, wurde die FPÖ mit 29,2 Prozent erstmals Sieger bei einer Parlamentswahl. Mittlerweile steht sie in Prognosen bei über 35% und der allgemeine politische Diskurs hat sich meilenweit verschoben. Es ist Vorsicht geboten. Nicht nur in Österreich Licensed to the public under http://creativecommons.org/licenses/by/4.0 Download Video MP4 Download 1080p deu-eng 794 MB These files contain multiple languages. This Talk was translated into multiple languages. The files available for download contain all languages as separate audio-tracks. Most desktop video players allow you to choose between them. Please look for "audio tracks" in your desktop video player. Subtitles deu Help us to improve these subtitles! Embed <iframe width="1024" height="576" src="https://media.ccc.de/v/38c3-5-jahre-nach-ibiza/oembed" frameborder="0" allowfullscreen></iframe> Share: $(function() { $('.share').on('click', 'a.popup', function (e) { window.open(this.href, 'share it', 'width=800,height=420,resizable=yes'); e.preventDefault(); }); $("textarea.share").on('focus', function() { $(this).select(); }); $('.share').on('click', '[data-share=mastodon]', function (e) { e.stopPropagation(); mastodonShare(this.dataset.text, this.dataset.url); e.preventDefault(); }) }); Tags 38c3 967 2024 Ethics, Society & Politics Saal 1'''
