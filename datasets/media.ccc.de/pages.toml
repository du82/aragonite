ment.firstChild.addEventListener('dblclick', function() { player.enterFullScreen() }); document.addEventListener('keypress', function (event) { // do not capture events from input fields if (event.target.tagName === 'INPUT') { return; } switch(event.key) { case 'k': case ' ': event.preventDefault(); player.paused ? player.play() : player.pause(); break; case 'f': player.fullscreen(); //event.preventDefault(); break; default: // forward other events to player mediaElement.dispatchEvent(event); console.log(event); } }); } }); }); }) AM3 Playlists: 'nook24' videos starting here / audio 89 min 2024-11-08 2025-01-15 497 Fahrplan Kaum eine Website wird so regelmäßig aufgerufen und durchsucht wie der Speiseplan der Mensa. Für viele Studierende bildet das Mittagessen einen Baustein im regelmäßigen Tagesablauf, insbesondere in der Vorlesungszeit. Vier bis fünf Gerichte pro Tag mal fünf Wochentage mal 50 Wochen im Jahr – da kommt schon eine ganze Menge Essen zusammen. Da fragt man sich doch: Was können wir mit diesen Daten eigentlich alles anstellen? In diesem Talk schauen wir uns an, wie man sich explorativ einem Datensatz mit gewöhnlichen, öffentlichen Daten nähern kann und wie man diese Daten überhaupt bekommt. Hierbei geht es sowohl um die offensichtlichen Erkenntnisse als auch um die versteckten Zusammenhänge, die erst mit mehr und mehr Daten sichtbar und zu interessanten Geschichten werden. Auf den Geschmack gekommen? Dich erwartet ein wilder Ritt durch verworfene Ideen, überraschende Erkenntnisse und Hintergründe aus der Welt der studentischen Verpflegung auf dem Campus. Die Technik kommt nicht zu kurz – für Liebhaber von Diagrammen bis zu KI-Enthusiasten kratzen wir uns zusammen, was immer uns auf der Reise hilft. Frei nach dem Motto: Neugier ersetzt jede Profession! 01:07:45 Korrektur: Die Daten zu Artikeln, Einkauf, Speiseplangestaltung bis zu den Kassiervorgängen werden in einem Warenwirtschaftssystem digital bearbeitet. Es erfolgt entgegen der Schlussfolgerung keine manuelle Eingabe der Gerichte in die Speisepläne der Mensa. Die Nights of Open Knowledge (Nook) in Lübeck ist eine offene Vortragsveranstaltung, die einem weiten Publikum Einblicke in die verschiedene Bereiche der Informatik, aber auch technikfremde Themen bietet. Die NooK wird vom Chaotikum e.V. aus Lübeck und der Studierendenschaft der Uni Lübeck veranstaltet. https://nook-luebeck.de/ This work is licensed under a Creative Commons Attribution-NonCommercial-NoDerivatives 4.0 International License (CC BY NC ND 4.0). https://creativecommons.org/licenses/by-nc-nd/4.0/ CC BY NC ND 4.0 Download Video MP4 WebM Download 1080p deu 593 MB Download 576p deu 151 MB Download 1080p deu 454 MB Download 576p deu 195 MB Audio Download mp3 deu 82 MB Download opus deu 51 MB Embed <iframe width="1024" height="576" src="https://media.ccc.de/v/2024-11-08-feed-me-21-e2-80-93-mensa-analytics/oembed" frameborder="0" allowfullscreen></iframe> Share: $(function() { $('.share').on('click', 'a.popup', function (e) { window.open(this.href, 'share it', 'width=800,height=420,resizable=yes'); e.preventDefault(); }); $("textarea.share").on('focus', function() { $(this).select(); }); $('.share').on('click', '[data-share=mastodon]', function (e) { e.stopPropagation(); mastodonShare(this.dataset.text, this.dataset.url); e.preventDefault(); }) }); Tags nook24 1559 2024 AM3'''
