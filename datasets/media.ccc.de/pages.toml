full_description = '''A fully free BIOS with GNU Boot neox and GNUtoo $(function() { var params = new URLSearchParams(window.location.hash && window.location.hash.split('#')[1]); var stamp = params.get('t'), lang = params.get('l'), srt = params.get('s'), $video = $('video'), promises = []; $('video source').each(function() { var $source = $(this); // Prop always presents the fully resolved URL promises.push( MirrorbrainFix.selectMirror($source.prop('src'), function(mirror) { $source.attr('src', mirror); }) ); }); $.when.apply($, promises).done(function() { $('video').mediaelementplayer({ usePluginFullScreen: true, enableAutosize: true, stretching: 'responsive', features: ['skipback', 'playpause', 'jumpforward', 'progress', 'current', 'duration', 'tracks', 'volume', 'speed', 'sourcechooser', 'fullscreen', 'postroll', 'timelens'], skipBackInterval: 15, startLanguage: lang, success: function (mediaElement, originalNode, player) { window.mediaElement = mediaElement; window.player = player; if (srt || srt === "") { var subtitles = player.tracks.filter(x => x.kind === 'subtitles'); var track = subtitles.filter(x => x.srclang === srt); console.log(track); if (track) { player.setTrack(track[0].trackId); } else { player.setTrack(subtitles[0].trackId); } } mediaElement.addEventListener('canplay', function () { if (stamp) { mediaElement.setCurrentTime(stamp); stamp = null; } }); mediaElement.addEventListener('playing', function () { $.post("/public/recordings/count", {event_id: $video.data('id'), src: mediaElement.src}); }, false); function updateHash() { var l = player.options.startLanguage || ''; var hash = (l ? '#l='+l+'&t=' : '#t=') + Math.round(mediaElement.currentTime); if (srt) { hash += '&s=' + srt; } window.location.replaceHash(hash); } mediaElement.addEventListener('pause', updateHash, false); mediaElement.addEventListener('seeked', updateHash, false); // see https://github.com/voc/voctoweb/pull/447 mediaElement.firstChild.addEventListener('dblclick', function() { player.enterFullScreen() }); document.addEventListener('keypress', function (event) { // do not capture events from input fields if (event.target.tagName === 'INPUT') { return; } switch(event.key) { case 'k': case ' ': event.preventDefault(); player.paused ? player.play() : player.pause(); break; case 'f': player.fullscreen(); //event.preventDefault(); break; default: // forward other events to player mediaElement.dispatchEvent(event); console.log(event); } }); } }); }); }) Stage YELL Playlists: '38c3' videos starting here / audio 31 min 2024-12-29 2024-12-30 1.6k Fahrplan In this talk we will first show you that a fully free BIOS firmware, is not only possible but also necessary to guarantee your freedom, technological independence and security in the long run. We will then present GNU Boot, a 100% free boot firmware distribution that accomplished these goals. The presentation will be held by Adrien Bourmault, one of the GNU Boot maintainers, whom will dive into the project's origins, goals and current status. It's getting harder and harder to find hardware that works with 100% free (as in freedom) software. To counter this, the promotion and development of fully free boot firmware is ever more crucial. Firmwares are software that sit in between the hardware and the operating system. They play a crucial role in making our computers work. However most of the time they are proprietary (nonfree). This limits users' freedom who are forced to trust black boxes. Being able to use 100% free firmwares can not only guarantee security but also enable transparency and control by the community. In this talk we will look at what is a boot firmware, and why it is essential that it is free software, and how it works in practice. We will also look at GNU Boot, a fully free boot firmware distribution: we will look at how the project is organized, what are features it provides, and its role within the movement for a fully free software BIOS/UEFI replacement. Licensed to the public und