full_description = '''AI Meets Git: Unmasking Security Flaws in Qodo Merge Nils Amiet $(function() { var params = new URLSearchParams(window.location.hash && window.location.hash.split('#')[1]); var stamp = params.get('t'), lang = params.get('l'), srt = params.get('s'), $video = $('video'), promises = []; $('video source').each(function() { var $source = $(this); // Prop always presents the fully resolved URL promises.push( MirrorbrainFix.selectMirror($source.prop('src'), function(mirror) { $source.attr('src', mirror); }) ); }); $.when.apply($, promises).done(function() { $('video').mediaelementplayer({ usePluginFullScreen: true, enableAutosize: true, stretching: 'responsive', features: ['skipback', 'playpause', 'jumpforward', 'progress', 'current', 'duration', 'tracks', 'volume', 'speed', 'sourcechooser', 'fullscreen', 'postroll', 'timelens'], skipBackInterval: 15, startLanguage: lang, success: function (mediaElement, originalNode, player) { window.mediaElement = mediaElement; window.player = player; if (srt || srt === "") { var subtitles = player.tracks.filter(x => x.kind === 'subtitles'); var track = subtitles.filter(x => x.srclang === srt); console.log(track); if (track) { player.setTrack(track[0].trackId); } else { player.setTrack(subtitles[0].trackId); } } mediaElement.addEventListener('canplay', function () { if (stamp) { mediaElement.setCurrentTime(stamp); stamp = null; } }); mediaElement.addEventListener('playing', function () { $.post("/public/recordings/count", {event_id: $video.data('id'), src: mediaElement.src}); }, false); function updateHash() { var l = player.options.startLanguage || ''; var hash = (l ? '#l='+l+'&t=' : '#t=') + Math.round(mediaElement.currentTime); if (srt) { hash += '&s=' + srt; } window.location.replaceHash(hash); } mediaElement.addEventListener('pause', updateHash, false); mediaElement.addEventListener('seeked', updateHash, false); // see https://github.com/voc/voctoweb/pull/447 mediaElement.firstChild.addEventListener('dblclick', function() { player.enterFullScreen() }); document.addEventListener('keypress', function (event) { // do not capture events from input fields if (event.target.tagName === 'INPUT') { return; } switch(event.key) { case 'k': case ' ': event.preventDefault(); player.paused ? player.play() : player.pause(); break; case 'f': player.fullscreen(); //event.preventDefault(); break; default: // forward other events to player mediaElement.dispatchEvent(event); console.log(event); } }); } }); }); }) Saal ZIGZAG Security Playlists: '38c3' videos starting here / audio 40 min 2024-12-29 910 Fahrplan The whole world is talking about AI, and developers are no exception. When a developer hears about a tool that can help them handle git pull requests using AI, it is likely that they will start using it for their open source project. This is precisely what's happening with Qodo Merge (formerly PR-Agent), an open source tool that can help review and handle git pull requests by using AI to provide feedback and suggestions to developers. It is getting adopted by more and more open source projects, including popular ones. It is so easy to add new features by relying on external tools, yet the consequences on security can be catastrophic. Indeed, if the tool contains security vulnerabilities, the project using it may become vulnerable too and may grant anyone permissions to perform unexpected actions without realizing it. But everyone wants to use AI so security may be overlooked. We found multiple vulnerabilities in Qodo Merge that may lead to privilege escalation on Gitlab, getting write access to Github repositories and leaking Github repository secrets. Additionally we found multiple high profile Github repositories using Qodo Merge with a configuration that makes them vulnerable, such as highly popular projects, government official repositories, self-driving automotive industry projects, blockchains and more. In this talk we go through what Qodo Merge is, how it can be used, how it works, how it can be exploited, what projects are affected and what are the impacts. We also mention remediation steps to fix these issues. Qodo (formerly CodiumAI) develops an open source tool called Qodo Merge (formerly PR-Agent). This tool can be setup to automatically analyze pull requests on a Gitlab, Github or Bitbucket project. Qodo Merge uses AI to perform various tasks that may help a developer handle a pull request, such as: * Summarizing a pull request * Suggesting code changes to improve a pull request * Generating a CHANGELOG file entry for a pull request * Answering questions about a pull request * and more In this talk, we describe vulnerabilities we found in Qodo Merge that may lead to privilege escalation on Gitlab, write access to Github repositories and leaking secrets of Github repositories. We mention popular open source projects that are vulnerable because they started using Qodo Merge, and discuss how to protect your project from these attacks. We also talk about the multiple ways we tried to report those vulnerabilities to the developers of Qodo Merge and the lack of a way for security people to contact them. Finally, we describe the current security posture of the project regarding the vulnerabilities we found. Licensed to the public under http://creativecommons.org/licenses/by/4.0 Download Video MP4 WebM Download 1080p eng-deu-fra 429 MB Download 576p eng-deu-fra 158 MB Download 1080p eng-deu-fra 305 MB Download 576p eng-deu-fra 158 MB These files contain multiple languages. This Talk was translated into multiple languages. The files available for download contain all languages as separate audio-tracks. Most desktop video players allow you to choose between them. Please look for "audio tracks" in your desktop video player. Subtitles eng Help us to improve these subtitles! Audio Download mp3 eng 37 MB Download mp3 deu 37 MB Download opus eng 25 MB Download opus deu 26 MB Embed <iframe width="1024" height="576" src="https://media.ccc.de/v/38c3-a