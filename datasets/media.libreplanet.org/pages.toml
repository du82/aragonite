title = "Decentralizing the Internet with FreedomBox — GNU MediaGoblin"
full_description = "FreedomBox is a personal server with a free software stack running the Universal OS that hosts on demand applications such as file sharing, shared calendaring, instant messaging, secure voice conference calling, blog and wiki. Unlike proprietary service platforms, FreedomBox software guarantees its users' rights, and works only for them, an indispensable attribute in the post-Snowden world. The session demonstrates important applications of FreedomBox with the goal to engage the listeners into using, building and contributing to FreedomBox. LibrePlanet is the Free Software Foundation's annual conference. The FSF campaigns for free/libre software, meaning it respects users' freedom and community. We believe that users are entitled to this; all software should be free. That term was coined to reject our views. It refers to similar practices, but usually presented solely as advantageous, without talking of right and wrong. Richard Stallman launched the free software movement in 1983 by announcing development of the free operating system, GNU. By 1992, GNU was nearly operational; one major essential component was lacking, the kernel. In 1992, Torvalds freed the kernel Linux, which filled the last gap in GNU. Since then, the combined GNU/Linux system has run in millions of computers. Nowadays you can buy a new computer with a totally free GNU/Linux system preinstalled. The views of the speaker do not represent the Free Software Foundation. The Foundation supports the free software cause and freedom to share, and basic freedoms in the digital domain, but has no position on other political issues."
