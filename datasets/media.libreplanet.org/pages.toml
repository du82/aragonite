title = "Debian community in Brazil — GNU MediaGoblin"
full_description = "Let's see what the Debian Brazil Community has been doing for Debian and free software in Brazil, meet our group and I will show the events and activities organized by us. Presented by: I'm a Debian developer contributing with packaging free software, and translating Debian to Portuguese. I'm a free software enthusiast and I have been organizing free software events for many years. I was one of main organizers of DebConf19 - The Debian Conference in 2019 in Curitiba - Brazil. I have been working as systems administration engineer at Collabora. I’m a member of the Debian Brazil Community. video · LibrePlanet 2024 video · FSF · LibrePlanet 2024 · LibrePlanet · lp2024 · libreplanet-conference LibrePlanet is the Free Software Foundation's annual conference. The FSF campaigns for free/libre software, meaning it respects users' freedom and community. We believe that users are entitled to this; all software should be free. That term was coined to reject our views. It refers to similar practices, but usually presented solely as advantageous, without talking of right and wrong. Richard Stallman launched the free software movement in 1983 by announcing development of the free operating system, GNU. By 1992, GNU was nearly operational; one major essential component was lacking, the kernel. In 1992, Torvalds freed the kernel Linux, which filled the last gap in GNU. Since then, the combined GNU/Linux system has run in millions of computers. Nowadays you can buy a new computer with a totally free GNU/Linux system preinstalled. The views of the speaker do not represent the Free Software Foundation. The Foundation supports the free software cause and freedom to share, and basic freedoms in the digital domain, but has no position on other political issues."
