["https://media.libreplanet.org/u/libreplanet/m/digital-colonialism-surveillance-capitalism-and-a-libre-software-future"]
title = "Digital colonialism, surveillance capitalism, and a libre software future — GNU MediaGoblin"
full_description = "Why are most mainstream platforms free of charge? Why is the answer to this first question a threat to humanity's future? What can we do about it? With a historic perspective, citing authors like Shoshana Zuboff, Marshall McLuhan, and Yanis Varoufakis, I try to give a perspective of how dystopian digital platforms nowadays are personal data extraction machines, how this machine works, the power of media (after S.Freud and E.Bernays), and why it is so critical for the future of humanity to choose libre software and ethical platforms. Jose Castro has been a GNU/Linux user since 2001. Jose has worked sporadically on computer areas as web developer, monkey and programmer. He also works on permaculture design and land development. Since the pandemic Jose has been solo campaigning for libre software and ethical use of digital platforms with the aim of non-techie people, giving talks and generating material. You can check out Jose's website if you want to know more. video · LibrePlanet 2023 video · FSF · LibrePlanet 2023 · LibrePlanet · lp2023 · libreplanet-conference · charting-the-course · workshop LibrePlanet is the Free Software Foundation's annual conference. The FSF campaigns for free/libre software, meaning it respects users' freedom and community. We believe that users are entitled to this; all software should be free. That term was coined to reject our views. It refers to similar practices, but usually presented solely as advantageous, without talking of right and wrong. Richard Stallman launched the free software movement in 1983 by announcing development of the free operating system, GNU. By 1992, GNU was nearly operational; one major essential component was lacking, the kernel. In 1992, Torvalds freed the kernel Linux, which filled the last gap in GNU. Since then, the combined GNU/Linux system has run in millions of computers. Nowadays you can buy a new computer with a totally free GNU/Linux system preinstalled. The views of the speaker do not represent the Free Software Foundation. The Foundation supports the free software cause and freedom to share, and basic freedoms in the digital domain, but has no position on other political issues."
