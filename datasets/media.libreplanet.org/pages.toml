["https://media.libreplanet.org/u/libreplanet/m/experience-around-floss-tools-and-social-movements-in-mexico-7b5e"]
title = "Experience around FLOSS tools and social movements in Mexico — GNU MediaGoblin"
full_description = "We want to share experiencies around Mexican social movements migrating to free software and/or using other free tools. People of different social processes are increasingly adopting FLOSS in their daily activity to communicate and organize. Most of the motivation came from digital security awareness but some times it goes a little further (like be congruence with the defense of human rights). In the way of facilitating those processes we have seen some advantages and disadvantages and receive some feedback we want to share with the rest of the community. Specially interesting for developers and technical facilitators who want to share their own experiences in this topics and strengthen links between FLOSS technical communities and Latin American social movements. Intend to generate some ideas for improving the linkages between both spaces not only for the software itself but emphasizing the political aspects they share and how to empower grassroots movements using free/libre tools. LibrePlanet is the Free Software Foundation's annual conference. The FSF campaigns for free/libre software, meaning it respects users' freedom and community. We believe that users are entitled to this; all software should be free. That term was coined to reject our views. It refers to similar practices, but usually presented solely as advantageous, without talking of right and wrong. Richard Stallman launched the free software movement in 1983 by announcing development of the free operating system, GNU. By 1992, GNU was nearly operational; one major essential component was lacking, the kernel. In 1992, Torvalds freed the kernel Linux, which filled the last gap in GNU. Since then, the combined GNU/Linux system has run in millions of computers. Nowadays you can buy a new computer with a totally free GNU/Linux system preinstalled. The views of the speaker do not represent the Free Software Foundation. The Foundation supports the free software cause and freedom to share, 