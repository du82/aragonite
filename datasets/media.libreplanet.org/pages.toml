["https://media.libreplanet.org/u/libreplanet/m/accesskit-a-shared-accessibility-glue-layer-for-the-whole-community"]
title = "AccessKit: A shared accessibility glue layer for the whole community — GNU MediaGoblin"
full_description = "In non-web applications, accessibility has long been confined to only a handful of the largest, most well-resourced UI toolkits, leaving a large proportion of free software inaccessible to disabled people. AccessKit aims to solve this problem by providing an accessibility abstraction and glue layer that can be reused by many toolkits across programming languages. Our aim is to do for accessibility what libraries such as SDL have done for graphics, input, and windowing. This talk will cover what we've accomplished so far, what's next, and how the community can help. Matt is a visually impaired developer who has been working in accessibility for over 20 years. He spent most of that time so far working on proprietary software, but he is now the lead developer of AccessKit, a free accessibility glue layer for multiple platforms and programming languages. video · LibrePlanet 2024 video · FSF · LibrePlanet 2024 · LibrePlanet · lp2024 · libreplanet-conference LibrePlanet is the Free Software Foundation's annual conference. The FSF campaigns for free/libre software, meaning it respects users' freedom and community. We believe that users are entitled to this; all software should be free. That term was coined to reject our views. It refers to similar practices, but usually presented solely as advantageous, without talking of right and wrong. Richard Stallman launched the free software movement in 1983 by announcing development of the free operating system, GNU. By 1992, GNU was nearly operational; one major essential component was lacking, the kernel. In 1992, Torvalds freed the kernel Linux, which filled the last gap in GNU. Since then, the combined GNU/Linux system has run in millions of computers. Nowadays you can buy a new computer with a totally free GNU/Linux system preinstalled. The views of the speaker do not represent the Free Software Foundation. The Foundation supports the free software cause and freedom to share, and basic freedoms in the digital domain, but has no position on other political issues."
