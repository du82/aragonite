["https://media.libreplanet.org/u/libreplanet/m/f-as-in-freedom-d977"]
title = "F as in Freedom — GNU MediaGoblin"
full_description = "Note: This video contains frequent use of profane language, in the context of an analysis of microblog comments by free software community members. Projects with a significant number of contributors and users will face decisions where they are no longer able to fulfill the needs and desires of all stakeholders. When this happens some people become upset. A subset of those people become so upset they vent their frustrations on Twitter. I have collected tweets that express a negative sentiment towards decisions made within free software communities and by decision makers for free software projects. These were then categorized based on the decision type (e.g. licensing) and outcome (e.g. switching licenses). I hope to create a greater community understanding of decision making processes, develop a discussion about how communities and decision makers can move forward to better balance the wants and needs of stakeholders, and make a few crass jokes that possibly violate the Code of Conduct. LibrePlanet is the Free Software Foundation's annual conference. The FSF campaigns for free/libre software, meaning it respects users' freedom and community. We believe that users are entitled to this; all software should be free. That term was coined to reject our views. It refers to similar practices, but usually presented solely as advantageous, without talking of right and wrong. Richard Stallman launched the free software movement in 1983 by announcing development of the free operating system, GNU. By 1992, GNU was nearly operational; one major essential component was lacking, the kernel. In 1992, Torvalds freed the kernel Linux, which filled the last gap in GNU. Since then, the combined GNU/Linux system has run in millions of computers. Nowadays you can buy a new computer with a totally free GNU/Linux system preinstalled. The views of the speaker do not represent the Free Software Foundation. The Foundation supports the free software cause and freedom to share, and basic freedoms in the digital domain, but has no position on other political issues."
