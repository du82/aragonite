["https://media.libreplanet.org/u/libreplanet/m/finding-a-job-while-caring-about-free-software"]
title = "Finding a job while caring about free software — GNU MediaGoblin"
full_description = "Ian was an FSF volunteer before joining the FSF in May 2017 as a senior systems administrator. He's also a free software developer and has contributed to various projects including GNU Emacs. A panel of people who care about software freedom, and have have somewhat recently gone through a job search. They will discuss and share their experience, offer some advice, and involve the audience. There are a vast array of ways to advance free software while looking after your finances, but in this talk, our focus will be on finding employment doing technical work and issues encountered there. For example: How much conflict with free software values do you accept in a company and for what price? What about ethical differences between your individual work vs the employer's overall business model? video · LibrePlanet 2023 video · FSF · LibrePlanet 2023 · LibrePlanet · lp2023 · libreplanet-conference · charting-the-course LibrePlanet is the Free Software Foundation's annual conference. The FSF campaigns for free/libre software, meaning it respects users' freedom and community. We believe that users are entitled to this; all software should be free. That term was coined to reject our views. It refers to similar practices, but usually presented solely as advantageous, without talking of right and wrong. Richard Stallman launched the free software movement in 1983 by announcing development of the free operating system, GNU. By 1992, GNU was nearly operational; one major essential component was lacking, the kernel. In 1992, Torvalds freed the kernel Linux, which filled the last gap in GNU. Since then, the combined GNU/Linux system has run in millions of computers. Nowadays you can buy a new computer with a totally free GNU/Linux system preinstalled. The views of the speaker do not represent the Free Software Foundation. The Foundation supports the free software cause and freedom to share, and basic freedoms in the digital domain, but has no position on other po