title = "Beyond reproducible builds — GNU MediaGoblin"
full_description = '''This presentation describes how the Debian reproducible builds team made 85% of the Debian archive reproducible, what steps are left to reach 100% and what steps are needed beyond reproducible builds, so that every user can easily and meaningful benefit from them. This presentation is largely about the Debian work on the area, but it also portrays other projects work on reproducible builds, as our goal is to make reproducible builds the norm for free software: "It's not free software if it's not reproducible." LibrePlanet is the Free Software Foundation's annual conference. The FSF campaigns for free/libre software, meaning it respects users' freedom and community. We believe that users are entitled to this; all software should be free. That term was coined to reject our views. It refers to similar practices, but usually presented solely as advantageous, without talking of right and wrong. Richard Stallman launched the free software movement in 1983 by announcing development of the free operating system, GNU. By 1992, GNU was nearly operational; one major essential component was lacking, the kernel. In 1992, Torvalds freed the kernel Linux, which filled the last gap in GNU. Since then, the combined GNU/Linux system has run in millions of computers. Nowadays you can buy a new computer with a totally free GNU/Linux system preinstalled. The views of the speaker do not represent the Free Software Foundation. The Foundation supports the free software cause and freedom to share, and basic freedoms in the digital domain, but has no position on other political issues.'''
