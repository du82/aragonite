["https://media.libreplanet.org/u/libreplanet/m/for-us-by-us-free-technology-community-science-and-the-pursuit-of-environmental-problem-solving"]
title = "For us, by us: Free technology, community science, and the pursuit of environmental problem solving — GNU MediaGoblin"
full_description = "In a world increasingly defined by environmental deregulation, how can free tools and technology alter the ability for communities to be part of the solution? This talk will explore a decade of work where community science and free technology have been used to support people in addressing environmental concerns. Focusing on the work of Public Lab, the talk will take us from the 2010 BP oil disaster through the rapid growth of free technology for environmental monitoring, and take a closer look at the challenges we face going forward with data, hardware, and governance. hardware · Shannon Dosemagen · public invention · keynote · Free the Future · LibrePlanet conference · LibrePlanet 2020 video · LibrePlanet 2020 · LibrePlanet · lp2020 · video · FSF · LibrePlanet keynote · LibrePlanet 2020 keynote LibrePlanet is the Free Software Foundation's annual conference. The FSF campaigns for free/libre software, meaning it respects users' freedom and community. We believe that users are entitled to this; all software should be free. That term was coined to reject our views. It refers to similar practices, but usually presented solely as advantageous, without talking of right and wrong. Richard Stallman launched the free software movement in 1983 by announcing development of the free operating system, GNU. By 1992, GNU was nearly operational; one major essential component was lacking, the kernel. In 1992, Torvalds freed the kernel Linux, which filled the last gap in GNU. Since then, the combined GNU/Linux system has run in millions of computers. Nowadays you can buy a new computer with a totally free GNU/Linux system preinstalled. The views of the speaker do not represent the Free Software Foundation. The Foundation supports the free software cause and freedom to share, and basic freedoms in the digital domain, but has no position on other political issues."
