["https://media.libreplanet.org/u/libreplanet/m/bigcode-open-and-responsible-research-on-code-generating-ai-systems"]
title = "BigCode: Open and responsible research on code-generating AI systems — GNU MediaGoblin"
full_description = "While code-generating AI systems like CoPilot have emerged as a powerful tool for professional developers, there are growing legal and ethical concerns around the development of these models. Questions have been raised as to whether these AI models respect current free software licenses---both for model training and generation---and what the social impact of this technology is on the free software community. The BigCode project is a scientific collaboration (with over 350 participants) working on the responsible development of code-generating AI systems. In this talk, we discuss how we navigate the legal-ethics-governance aspects around the development of these models, including how we developed a permissively licensed code dataset, give developers the option to remove their code from the training data, redact personally identifiable information (PII), and attribute generated programs to the original code snippet. video · LibrePlanet 2023 video · FSF · LibrePlanet 2023 · LibrePlanet · lp2023 · libreplanet-conference · charting-the-course LibrePlanet is the Free Software Foundation's annual conference. The FSF campaigns for free/libre software, meaning it respects users' freedom and community. We believe that users are entitled to this; all software should be free. That term was coined to reject our views. It refers to similar practices, but usually presented solely as advantageous, without talking of right and wrong. Richard Stallman launched the free software movement in 1983 by announcing development of the free operating system, GNU. By 1992, GNU was nearly operational; one major essential component was lacking, the kernel. In 1992, Torvalds freed the kernel Linux, which filled the last gap in GNU. Since then, the combined GNU/Linux system has run in millions of computers. Nowadays you can buy a new computer with a totally free GNU/Linux system preinstalled. The views of the speaker do not represent the Free Software Foundation. The Foundation