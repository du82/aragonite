["https://media.libreplanet.org/u/libreplanet/m/free-software-forever"]
title = "Free software forever — GNU MediaGoblin"
full_description = "As free software activists, do we focus on our own project-based communities or should we be looking outside? If free software is to succeed (forever!) I believe we need to do both. Maintaining our ideals as we take free software to new places, introduce it to new people, and bend it to new purposes depends on our willingness to grow both individually and collectively. Change is never simple so I hope that we will be gentle with each other as we try new things and work to build an even bigger movement. LibrePlanet 2018 video · LibrePlanet 2018 · LibrePlanet · lp2018 · video · LibrePlanet keynote · LibrePlanet 2018 keynote LibrePlanet is the Free Software Foundation's annual conference. The FSF campaigns for free/libre software, meaning it respects users' freedom and community. We believe that users are entitled to this; all software should be free. That term was coined to reject our views. It refers to similar practices, but usually presented solely as advantageous, without talking of right and wrong. Richard Stallman launched the free software movement in 1983 by announcing development of the free operating system, GNU. By 1992, GNU was nearly operational; one major essential component was lacking, the kernel. In 1992, Torvalds freed the kernel Linux, which filled the last gap in GNU. Since then, the combined GNU/Linux system has run in millions of computers. Nowadays you can buy a new computer with a totally free GNU/Linux system preinstalled. The views of the speaker do not represent the Free Software Foundation. The Foundation supports the free software cause and freedom to share, and basic freedoms in the digital domain, but has no position on other political issues."
