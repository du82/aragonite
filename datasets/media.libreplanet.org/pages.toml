["https://media.libreplanet.org/u/libreplanet/m/education-and-the-future-of-software-freedom"]
title = "Education and the future of software freedom — GNU MediaGoblin"
full_description = "Erin Rose Glass is a researcher and educator who has worked across universities, community colleges, academic libraries, and industry to promote technical literacy focused on ethics, user governance, and community values. She has co-founded a variety of community-driven ed tech initiatives that center ethics and user freedom, including Social Paper, a platform for socializing student writing funded by the National Endowment for the Humanities, and KNIT, a digital commons shared between UC San Diego and the San Diego Community College District. Her research publications focus on the intellectual and political stakes of digital infrastructure related to education and research, including her dissertation, Software of the Oppressed: Reprogramming the Invisible Discipline, which examines the history of ed tech in higher education through Paulo Freire’s philosophy of critical pedagogy. More recently, she led the Developer Education team at DigitalOcean before joining Chainguard, a start up focused on software supply chain security. She lives in California with her family and pack of fluffy creatures, big and small. As the political stakes of digital technology become increasingly apparent, it’s clear that an ethical approach to software use and development is more important than ever. While a number of organizations and advocates are doing important work to advance ethical forms of software practice, we continue to miss one of the key sites where software habits and expectations are reinforced and normalized at scale, that is, institutions of education. In this talk, I will discuss the inadvertent role higher education plays in teaching students to passively accept broad forms of digital surveillance and control through its use of popular educational technologies like learning management systems, word processing software, and test taking tools, and how this submission leads to the broader mass helplessness in the face of current technological struggles. Starting with my chance encounter with free software as a humanities graduate student, I will highlight a range of promising contemporary examples of experiments in higher education that push against exploitative trends in educational technology and expose students to the differentiating value and possibility of software freedom. As we chart the course of the future of software, these examples shine light on the importance of educational institutions in the struggle for software freedom and the urgent need for broader community support to help sustain and encourage these precarious endeavors."
year_published = 2025
clearnet = "https://media.libreplanet.org/u/libreplanet/m/education-and-the-future-of-software-freedom"
