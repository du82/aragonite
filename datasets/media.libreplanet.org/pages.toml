["https://media.libreplanet.org/u/libreplanet/m/cultivating-a-welcoming-free-software-community-that-lasts"]
title = "Cultivating a welcoming free software community that lasts — GNU MediaGoblin"
full_description = "Description: For forty years, the free software movement has been driven by a passionate community of hackers who care deeply about user freedom and privacy. Meanwhile, the strategies and tools that other software communities use to organize, promote, and execute projects has changed significantly. In this talk, we will discuss how to cultivate a welcoming community that attracts a new generation of passionate users, contributors, and maintainers to free software projects. I will take inspiration from other successful projects to illustrate a human-centered process that streamlines contributions, strengthens maintainership, and creates a feeling of shared ownership for all users. David Wilson is a free software developer and video creator residing in Athens, Greece. He created the System Crafters channel and community to teach others how to craft their computing experience using free software tools like GNU Emacs and GNU Guix. You can learn more about it at https://systemcrafters.net. LibrePlanet 2024 keynote · libreplanet-conference · lp2024 · LibrePlanet · LibrePlanet 2024 · FSF · LibrePlanet 2024 video · video LibrePlanet is the Free Software Foundation's annual conference. The FSF campaigns for free/libre software, meaning it respects users' freedom and community. We believe that users are entitled to this; all software should be free. That term was coined to reject our views. It refers to similar practices, but usually presented solely as advantageous, without talking of right and wrong. Richard Stallman launched the free software movement in 1983 by announcing development of the free operating system, GNU. By 1992, GNU was nearly operational; one major essential component was lacking, the kernel. In 1992, Torvalds freed the kernel Linux, which filled the last gap in GNU. Since then, the combined GNU/Linux system has run in millions of computers. Nowadays you can buy a new computer with a totally free GNU/Linux system preinstalled. The views of the speaker do not represent the Free Software Foundation. The Foundation supports the free software cause and freedom to share, and basic freedoms in the digital domain, but has no position on other political issues."
year_published = 2025
