["https://media.libreplanet.org/u/libreplanet/m/bridging-the-digital-divide-in-education-with-free-software-and-hardware"]
title = "Bridging the digital divide in education with free software and hardware — GNU MediaGoblin"
full_description = "Sripath Roy Koganti is the General Secretary of Swecha AP, from Andhra Pradesh, India. Swecha’s motto is “Technology for Society,” and they use a free software development model. In this talk, Sripath discusses how computers, tablets, and mobile phones open a vast world of knowledge to students everywhere – and how it is critical to make sure that ALL students, including underprivileged students in underfunded schools, have access to these precious resources. He also introduces the BalaSwecha project, which applies the power of free software, free hardware designs, and freely licensed educational materials to bridge the digital divide. FSF · video · lp2021 · LibrePlanet · LibrePlanet 2021 · LibrePlanet 2021 video · LibrePlanet conference · Empowering Users LibrePlanet is the Free Software Foundation's annual conference. The FSF campaigns for free/libre software, meaning it respects users' freedom and community. We believe that users are entitled to this; all software should be free. That term was coined to reject our views. It refers to similar practices, but usually presented solely as advantageous, without talking of right and wrong. Richard Stallman launched the free software movement in 1983 by announcing development of the free operating system, GNU. By 1992, GNU was nearly operational; one major essential component was lacking, the kernel. In 1992, Torvalds freed the kernel Linux, which filled the last gap in GNU. Since then, the combined GNU/Linux system has run in millions of computers. Nowadays you can buy a new computer with a totally free GNU/Linux system preinstalled. The views of the speaker do not represent the Free Software Foundation. The Foundation supports the free software cause and freedom to share, and basic freedoms in the digital domain, but has no position on other political issues."
