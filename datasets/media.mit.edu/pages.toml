["https://media.mit.edu/articles/designing-for-outer-space"]
title = "Designing for outer space — MIT Media Lab"
description = "With NASA planning permanent bases in space and on the moon, MIT students develop prototypes for habitats far from planet Earth."
full_description = "Work for a Member company and need a Member Portal account? Register here with your company email address. A new MIT course this spring asked students to design what humans might need to comfortably work in and inhabit space. The time for these creations is now. While the NASA Apollo missions saw astronauts land on the moon, collect samples, and return home, the missions planned under Artemis, NASA’s current moon exploration program, include establishing long-term bases in orbit as well as on the surface of the moon. The cross-disciplinary design course MAS.S66/4.154/16.89 (Space Architectures) was run in parallel with the departments of Architecture, and Aeronautics and Astronautics (AeroAstro), and the MIT Media Lab’s Space Exploration Initiatives group. Thirty-five students from across the Institute registered to imagine, design, prototype, and test what might be needed to support human habitation and activities on the moon. “A lot of students at MIT are excited about space,” says Jeffrey Hoffman, one of the course instructors and professor of the practice in AeroAstro. Before teaching at MIT, Hoffman was a NASA astronaut who flew five missions aboard the space shuttle. “Certainly in AeroAstro, half the students want to be astronauts eventually, so it’s not like they hadn’t thought about living in space before. This was an opportunity to use that inspiration and work on a project that might become an actual design for real lunar habitats.” MIT’s history with NASA, and with the Apollo missions in particular, is well documented. NASA’s first major contract for the Apollo program was awarded to MIT in 1961. Dava Newman, director of the MIT Media Lab and former NASA deputy administrator, was also a course instructor. Preparing students for the next phase of working and living in space was the goal of this class. In addition to the Artemis missions, the rise of commercial spaceflight foretells the need to investigate these designs. “MIT Architecture has always succeeded best at the intersection of research and practice,” says Nicholas de Monchaux, a course instructor and architecture department head. “With more and more designers being called on to design for extreme environments and conditions — including space — we see an important opportunity for research, collaboration, and new forms of practice, including an ongoing collaboration with the Media Lab and AeroAstro on designing for extreme environments.”"
author = "Skylar Tibbits"
year_published = 2025
clearnet = "https://media.mit.edu/articles/designing-for-outer-space"
