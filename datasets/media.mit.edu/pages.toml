["https://media.mit.edu/articles/brain-controlled-bionic-limbs-are-inching-closer-to-reality"]
title = "Brain-controlled prosthetic limbs take  steps closer to reality — MIT Media Lab"
description = "In a cover story, Science News highlights research from the Media Lab’s Biomechatronics group and the K. Lisa Yang Center for Bionics at MIT"
full_description = "Work for a Member company and need a Member Portal account? Register here with your company email address. The word bionic conjures sci-fi visions of people enhanced to superhuman levels. It’s true that engineering advances such as better motors and batteries, together with modern computing, mean that the required mechanical and electronic systems are no longer a barrier to advanced prostheses. But the field has struggled to integrate these powerful machines with the human body. That’s starting to change. A recent clinical trial tested one new integration technique, which involves surgically reconstructing muscle pairs that give recipients a sense of the position and movement of a bionic limb. Signals from those muscles control robotic joints, so the prosthesis is fully under control of the user’s brain. The system enabled people with below-knee amputations to walk more naturally and better navigate slopes, stairs and obstacles, researchers reported in July in Nature Medicine. Engineers have typically viewed biology as a fixed limitation to be engineered around, says bioengineer Tyler Clites, who helped develop the technique several years ago while at MIT. “But if we look at the body as part of the system to be engineered in parallel with the machine, the two will be able to interact better.” Song, H., Hsieh, TH., Yeon, S.H. et al. Continuous neural control of a bionic limb restores biomimetic gait after amputation. Nat Med (2024). https://doi.org/10.1038/s41591-024-02994-9 A new surgical procedure gives people more neural feedback from their residual limb. With it, seven patients walked more naturally"
author = "Hugh Herr"
year_published = 2025
