full_description = 'Work for a Member company and need a Member Portal account? Register here with your company email address. Seven MIT faculty members are among the 250 leaders from academia, the arts, industry, public policy, and research elected to the American Academy of Arts and Sciences, the academy announced April 24. One of the nation’s most prestigious honorary societies, the academy is also a leading center for independent policy research. Members contribute to academy publications, as well as studies of science and technology policy, energy and global security, social policy and American institutions, the humanities and culture, and education. “We honor these artists, scholars, scientists, and leaders in the public, non-profit, and private sectors for their accomplishments and for the curiosity, creativity, and courage required to reach new heights,” says David Oxtoby, president of the academy. “We invite these exceptional individuals to join in the academy’s work to address serious challenges and advance the common good.” Since its founding in 1780, the academy has elected leading thinkers from each generation, including George Washington and Benjamin Franklin in the 18th century, Maria Mitchell and Daniel Webster in the 19th century, and Toni Morrison and Albert Einstein in the 20th century. The current membership includes more than 250 Nobel and Pulitzer Prize winners. Professor Machover also held a commencement seminar, titled "Sound Futures: How Music and Technology Will Shape AI, Health, and Community.” Machover’s Overstory Overture is a 30-minute work, for a single voice, chamber ensemble, and electronics. Join Professor Tod Machover and artist Zoe Laughlin in episode 2, "Material World," of the PBS Series CONFLUENCE'
