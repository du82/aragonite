["https://media.mit.edu/articles/first-ai-education-summit-is-an-international-push-for-ai-fluency"]
title = "First AI + Education Summit is an international push for “AI fluency” — MIT Media Lab"
description = "The three-day, hands-on conference hosted by the MIT RAISE Initiative welcomed youths and adults from nearly 30 countries."
full_description = "Work for a Member company and need a Member Portal account? Register here with your company email address. This summer, 350 participants came to MIT to dive into a question that is, so far, outpacing answers: How can education still create opportunities for all when digital literacy is no longer enough — a world in which students now need to have AI fluency? The AI + Education Summit was hosted by the MIT RAISE Initiative (Responsible AI for Social Empowerment and Education) in Cambridge, Massachusetts, with speakers from the App Inventor Foundation, the Mayor’s Office of the City of Boston, the Hong Kong Jockey Club Charities Trust, and more. Highlights included an onsite “Hack the Climate” hackathon, where teams of beginner and experienced MIT App Inventor users had a single day to develop an app for fighting climate change. In opening remarks, RAISE principal investigators Eric Klopfer, Hal Abelson, and Cynthia Breazeal emphasized what new goals for AI fluency look like. “Education is not just about learning facts,” Klopfer said. “Education is a whole developmental process. And we need to think about how we support teachers in being more effective. Teachers must be part of the AI conversation.” Abelson highlighted the empowerment aspect of computational action, namely its immediate impact, that “what’s different than in the decades of people teaching about computers [is] what kids can do right now.” And Breazeal, director of the RAISE Initiative, touched upon AI-supported learning, including the imperative to use technology like classroom robot companions as something supplementary to what students and teachers can do together, not as a replacement for one another. Or as Breazeal underlined in her talk: “We really want people to understand, in an appropriate way, how AI works and how to design it responsibly. We want to make sure that people have an informed voice of how AI should be integrated into society. And we want to empower all kinds of people around the world to be able to use AI, harness AI, to solve the important problems of their communities.”"
author = "Cynthia Breazeal"
year_published = 2024
clearnet = "https://media.mit.edu/articles/first-ai-education-summit-is-an-international-push-for-ai-fluency"
