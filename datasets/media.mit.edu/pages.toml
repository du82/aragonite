["https://media.mit.edu/articles/mit-scientists-learn-how-to-control-muscles-with-light"]
title = "MIT scientists learn how to control muscles with light — MIT Media Lab"
description = "A new study suggests optogenetics can drive muscle contraction with greater control and less fatigue than electrical stimulation."
full_description = "Work for a Member company and need a Member Portal account? Register here with your company email address. For people with paralysis or amputation, neuroprosthetic systems that artificially stimulate muscle contraction with electrical current can help them regain limb function. However, despite many years of research, this type of prosthesis is not widely used because it leads to rapid muscle fatigue and poor control. MIT researchers have developed a new approach that they hope could someday offer better muscle control with less fatigue. Instead of using electricity to stimulate muscles, they used light. In a study in mice, the researchers showed that this optogenetic technique offers more precise muscle control, along with a dramatic decrease in fatigue. “It turns out that by using light, through optogenetics, one can control muscle more naturally. In terms of clinical application, this type of interface could have very broad utility,” says Hugh Herr, a professor of media arts and sciences, co-director of the K. Lisa Yang Center for Bionics at MIT, and an associate member of MIT’s McGovern Institute for Brain Research. Optogenetics is a method based on genetically engineering cells to express light-sensitive proteins, which allows researchers to control activity of those cells by exposing them to light. This approach is currently not feasible in humans, but Herr, MIT graduate student Guillermo Herrera-Arcos, and their colleagues at the K. Lisa Yang Center for Bionics are now working on ways to deliver light-sensitive proteins safely and effectively into human tissue. Herr is the senior author of the study, which appears today in Science Robotics. Herrera-Arcos is the lead author of the paper. For decades, researchers have been exploring the use of functional electrical stimulation (FES) to control muscles in the body. This method involves implanting electrodes that stimulate nerve fibers, causing a muscle to contract. However, this stimulation tends to activate the entire muscle at once, which is not the way that the human body naturally controls muscle contraction."
author = "Hugh Herr"
year_published = 2025
clearnet = "https://media.mit.edu/articles/mit-scientists-learn-how-to-control-muscles-with-light"
