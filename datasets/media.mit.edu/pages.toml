["https://media.mit.edu/articles/second-round-of-seed-grants-awarded-to-mit-scholars-studying-the-impact-and-applications-of-generative-ai"]
title = "Second round of seed grants awarded to MIT scholars studying the impact and applications of generative AI — MIT Media Lab"
