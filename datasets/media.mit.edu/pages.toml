["https://media.mit.edu/articles/new-training-approach-could-help-ai-agents-perform-better-in-uncertain-conditions"]
title = "New training approach could help AI agents perform better in uncertain conditions — MIT Media Lab"
description = "Sometimes, it might be better to train a robot in an environment that’s different from the one where it will be deployed."
full_description = '''Work for a Member company and need a Member Portal account? Register here with your company email address. A home robot trained to perform household tasks in a factory may fail to effectively scrub the sink or take out the trash when deployed in a user’s kitchen, since this new environment differs from its training space. To avoid this, engineers often try to match the simulated training environment as closely as possible with the real world where the agent will be deployed. However, researchers from MIT and elsewhere have now found that, despite this conventional wisdom, sometimes training in a completely different environment yields a better-performing artificial intelligence agent. Their results indicate that, in some situations, training a simulated AI agent in a world with less uncertainty, or “noise,” enabled it to perform better than a competing AI agent trained in the same, noisy world they used to test both agents. “If we learn to play tennis in an indoor environment where there is no noise, we might be able to more easily master different shots. Then, if we move to a noisier environment, like a windy tennis court, we could have a higher probability of playing tennis well than if we started learning in the windy environment,” explains Serena Bono, a research assistant in the MIT Media Lab and lead author of a paper on the indoor training effect. She was recognized for her significant contributions in establishing the field of social robotics and human-robot interaction. This year, Personal Robots PhD student Ishaan Grover will be representing the Media Lab as he presents his team's project, Catalan.AI Haar Horowitz, Adam, Ishaan Grover, Pedro Reynolds-Cuéllar, Cynthia Breazeal, and Pattie Maes. "Dormio: Interfacing with dreams." In Extended Abstracts of the 2018 CHI Conference on Human Factors in Computing Systems, pp. 1-10. 2018.'''
author = "Cynthia Breazeal"
year_published = 2023
