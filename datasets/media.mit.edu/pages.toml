["https://media.mit.edu/articles/engineers-enable-a-drone-to-determine-its-position-in-the-dark-and-indoors"]
title = "Engineers enable a drone to determine its position in the dark and indoors — MIT Media Lab"
description = "A new low-power system using radio frequency waves takes a major step toward autonomous, indoor drone navigation."
full_description = "Work for a Member company and need a Member Portal account? Register here with your company email address. In the future, autonomous drones could be used to shuttle inventory between large warehouses. A drone might fly into a semi-dark structure the size of several football fields, zipping along hundreds of identical aisles before docking at the precise spot where its shipment is needed. Most of today’s drones would likely struggle to complete this task, since drones typically navigate outdoors using GPS, which doesn’t work in indoor environments. For indoor navigation, some drones employ computer vision or lidar, but both techniques are unreliable in dark environments or rooms with plain walls or repetitive features. MIT researchers have introduced a new approach that enables a drone to self-localize, or determine its position, in indoor, dark, and low-visibility environments. Self-localization is a key step in autonomous navigation. The researchers developed a system called MiFly, in which a drone uses radio frequency (RF) waves, reflected by a single tag placed in its environment, to autonomously self-localize. Because MiFly enables self-localization with only one small tag, which could be affixed to a wall like a sticker, it would be cheaper and easier to implement than systems that require multiple tags. In addition, since the MiFly tag reflects signals sent by the drone, rather than generating its own signal, it can be operated with very low power. Two off-the-shelf radars mounted on the drone enable it to localize in relation to the tag. Those measurements are fused with data from the drone’s onboard computer, which enables it to estimate its trajectory. The researchers conducted hundreds of flight experiments with real drones in indoor environments, and found that MiFly consistently localized the drone to within fewer than 7 centimeters. “As our understanding of perception and computing improves, we often forget about signals that are beyond the visible spectrum. Here, we’ve looked beyond GPS and computer vision to millimeter waves, and by doing so, we’ve opened up new capabilities for drones in indoor environments that were not possible before,” says Fadel Adib, associate professor in the Department of Electrical Engineering and Computer Science, director of the Signal Kinetics group in the MIT Media Lab, and senior author of a paper on MiFly."
author = "Fadel Adib"
year_published = 2023
clearnet = "https://media.mit.edu/articles/engineers-enable-a-drone-to-determine-its-position-in-the-dark-and-indoors"
