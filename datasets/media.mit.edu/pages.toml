["https://media.mit.edu/articles/researchers-leverage-shadows-to-model-3d-scenes-including-objects-blocked-from-view"]
title = "Researchers leverage shadows to model 3D scenes, including objects blocked from view — MIT Media Lab"
description = "This technique could lead to safer autonomous vehicles, more efficient AR/VR headsets, or faster warehouse robots."
full_description = "Work for a Member company and need a Member Portal account? Register here with your company email address. Imagine driving through a tunnel in an autonomous vehicle, but unbeknownst to you, a crash has stopped traffic up ahead. Normally, you’d need to rely on the car in front of you to know you should start braking. But what if your vehicle could see around the car ahead and apply the brakes even sooner? Researchers from MIT and Meta have developed a computer vision technique that could someday enable an autonomous vehicle to do just that. They have introduced a method that creates physically accurate, 3D models of an entire scene, including areas blocked from view, using images from a single camera position. Their technique uses shadows to determine what lies in obstructed portions of the scene. They call their approach PlatoNeRF, based on Plato’s allegory of the cave, a passage from the Greek philosopher’s “Republic” in which prisoners chained in a cave discern the reality of the outside world based on shadows cast on the cave wall. By combining lidar (light detection and ranging) technology with machine learning, PlatoNeRF can generate more accurate reconstructions of 3D geometry than some existing AI techniques. Additionally, PlatoNeRF is better at smoothly reconstructing scenes where shadows are hard to see, such as those with high ambient light or dark backgrounds. In addition to improving the safety of autonomous vehicles, PlatoNeRF could make AR/VR headsets more efficient by enabling a user to model the geometry of a room without the need to walk around taking measurements. It could also help warehouse robots find items in cluttered environments faster. “Our key idea was taking these two things that have been done in different disciplines before and pulling them together — multibounce lidar and machine learning. It turns out that when you bring these two together, that is when you find a lot of new opportunities to explore and get the best of both worlds,” says Tzofi Klinghoffer, an MIT graduate student in media arts and sciences, affiliate of the MIT Media Lab, and lead author of a paper on PlatoNeRF."
author = "Ramesh Raskar"
year_published = 2024
clearnet = "https://media.mit.edu/articles/researchers-leverage-shadows-to-model-3d-scenes-including-objects-blocked-from-view"
