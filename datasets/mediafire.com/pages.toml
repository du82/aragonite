title = "File sharing and storage made simple"
description = "MediaFire is a simple to use free service that lets you put all your photos, documents, music, and video in a single place so you can access them anywhere and share them everywhere."
full_description = '''Policy Violation About UsCareersAdvertisingPressBlogToolsPoliciesPolicy ViolationAbuseCopyrightTrademarkIntellectual PropertyCounterclaimRepeat offendersAccount SuspensionSubscriptionsCreditsHelp Center Copyright Copyright is a form of protection so creators and subsequent owners of original works can control how the works are used. Copyright infringement occurs when a copyrighted work is reproduced, distributed, performed, publicly displayed, or made into a derivative work without the permission of the copyright owner. Violating the copyright owner’s rights can lead to suspension of that Content in your account on MediaFire, a strike and account suspension. These acts can be criminal. Additionally, copyright owners can take civil action against you and possibly be awarded monetary damages. MediaFire complies with the Digital Millennium Copyright Act (DMCA) and promptly suspends Content from access when properly notified. To file a copyright infringement notification with MediaFire, you will need to send a written notification that includes substantially the information required by and stated in Section 512(c)(3) of the Digital Millennium Copyright Act. Persons or entities who have large numbers of files or a frequent need to notify MediaFire of copyright infringement may apply to MediaFire for access to MediaFire's DMCA Dynamic Notification System. Filings may be made by submitting a: Email buseaay@ediafiremay.omcay Written request to: MediaFire Attn: Copyright 4747 Research Forest Dr.Ste 180-265The Woodlands, Texas 77381-4902 Required Information: Identify yourself as either: a) The owner of a copyrighted work(s), or b) A person "authorized to act on behalf of the owner of an exclusive right that is allegedly infringed." Include a physical or electronic signature. Identify the copyrighted work claimed to have been infringed. Identify the Content that is claimed to be infringing or to be the subject of the infringing activity and that is to be suspended or access to which is to be disabled, as well as information reasonably sufficient to permit MediaFire to locate the Content. Providing URLs are required to help us locate the Content. Provide contact information that is reasonably sufficient to permit us to contact you, such as an address, telephone number, and a valid email address. State that you have a good faith belief that use of the Content in the manner complained of is not authorized by the copyright owner, its agents, or the law. State that the information in the notification is accurate and under penalty of perjury the complaining party is authorized to act on behalf of the owner of an exclusive right that is allegedly infringed. The information provided in this legal notice will be forwarded to the person who provided the allegedly infringing Content. See "Counterclaim". Upon receipt of valid notification, as required by law, we will suspend access to Content from our website. If a counterclaim is not filed, or is unsuccessful, access to the Content is permanently suspended from our Service. Contact information of the party reporting the file, which may include name, email address and physical address will be given to anyone attempting to access the Content. Users who have the same Content in their account will receive a warning that the file has been reported for copyright infringement and distribution will be restricted. You, the reporting party, may be contacted asking you to notify MediaFire to release the Content for distribution. If you feel the request is valid, email buseaay@ediafiremay.omcay and provide links to those particular files. In accordance with our Terms of Service and Privacy Policy, non-public information about MediaFire account holders is not released except as lawfully required by appropriate legal process such as a subpoena, court order, or other valid legal process. For further legal process, see Table 1 about information retention.'''
