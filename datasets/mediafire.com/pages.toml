full_description = "Subscriptions About UsCareersAdvertisingPressBlogToolsPoliciesPolicy ViolationSubscriptionsCreditsHelp Center Subscriptions General MediaFire offers 2 subscription levels, Professional and Business. All services offer additional features over the Free services such as custom branding, detailed analytics, distribution through direct linking and more. Business services additionally offer multi-user accounts and customized subdomains. For more details on premium services, please visit our upgrade page. All services are subscriptions based and there is no obligation term. MediaFire accepts all major credit cards. Money Back Guarantee MediaFire offers a 30-Day Money Back Guarantee from the date the subscription begins. Billing When you sign up for a MediaFire service you are billed at the beginning of service delivery. Customers signing up for yearly service are billed for the initial 12 months of service at the time of signup. Users signing up for monthly and quarterly subscriptions are billed according to the day of the month when they signed up. If you sign up on the 8th day of the month for a monthly subscription, you will be billed on the 8th of the month. If you signed up for a quarterly subscription on the 8th of the month, you will be billed on the 8th day of the first month in the quarter. Cancellation The easiest way to cancel your subscription is by visiting your Settings page while logged in to your account. After you cancel your subscription, your services will continue until the end of th period for which you have paid. When that period expires, your account will be returned to a non-premium account."
