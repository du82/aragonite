h Oct 2024 NH Court Rules Union Leader Op-ed “Merely Expressive Rhetoric … Not Designed to Assert Factual Allegations” William L. Chapman Op-ed charged plaintiff with supporting white supremist ideology. TOPICS : Defamation, Opinion Oct 2024 Brett Favre’s Defamation Suit Gets Sacked by Fifth Circuit Mark Fijman The court concluded that Mississippi defamation law protected Sharpe’s pointed commentary as non-actionable opinion based on disclosed factual premises. TOPICS : Defamation Sep 2024 Discovery Trumps Statute of Limitations in Libel Suits Jack Greiner The Ohio Supreme Court recently decided that a libel plaintiff could bring a lawsuit well beyond the expiration of the one-year statute of limitations if the plaintiff didn’t know about the libel until after the statute had run. TOPICS : Defamation Sep 2024 Strange Facts, But Wire Service Defense Wins the Day in Florida Charles Glasser While the facts of the case are almost one-in-a-million, the legal issues – involving libel by embedding allegedly defamatory tweets written by others – is something we are dealing with more and more frequently. TOPICS : Defamation, Section 230 Sep 2024 Journalist Prevails on Fair-Report Privilege Defense After Unsealing Critical Court Records Matthew S.L. Cate and Robert S. Gutierrez A series of news articles fairly and accurately reported on criminal proceedings, even if they deployed “some literary license” in reporting that a disbarred California lawyer was “linked to [a] black eye,” a district court judge ruled in August. TOPICS : Defamation left_arrow_default Prev 1 2 3 … 89 90 91 Next right_arrow_default"
