["https://medialaw.org/events/type/digital-conference"]
title = "Digital Conference Archives - Media Law Resource Center"
description = "NEXT CONFERENCE: May 8, 2025 Perennial topics covered at this conference include: Section 230 and related reform efforts; Computer Fraud and Abuse Act decisions impacting automated online data collection; the challenges of content moderation; California and other state privacy law compliance; European regulations and legislative developments; and digital copyright. In recent years, this conference has also covered such issues as anonymous online speech and the legal issues surrounding “deepfake” videos, and featured speakers like former Yale Law School Dean Robert Post and Facebook’s Head of Global Policy, Monika Bickert. Notably, in 2016, the Legal Frontiers in Digital Media conference was the first event to feature the advocates on opposing sides of the San Bernardino iPhone unlocking controversy, Ted Boutrous and U.S. Attorney for the Central District of California, Eileen M. Decker."
full_description = "HomeEventsDigital Conference Digital Conference Convened in the Bay Area every May in partnership with the Berkeley Center for Law & Technology, Legal Frontiers in Digital Media explores emerging legal issues at the intersection of digital media, freedom of speech, and law. NEXT CONFERENCE: May 8, 2025 Perennial topics covered at this conference include: Section 230 and related reform efforts; Computer Fraud and Abuse Act decisions impacting automated online data collection; the challenges of content moderation; California and other state privacy law compliance; European regulations and legislative developments; and digital copyright. In recent years, this conference has also covered such issues as anonymous online speech and the legal issues surrounding “deepfake” videos, and featured speakers like former Yale Law School Dean Robert Post and Facebook’s Head of Global Policy, Monika Bickert. Notably, in 2016, the Legal Frontiers in Digital Media conference was the first event to feature the advocates on opposing sides of the San Bernardino iPhone unlocking controversy, Ted Boutrous and U.S. Attorney for the Central District of California, Eileen M. Decker. Past Events Tuesday, May 14 San Francisco, CA Legal Frontiers in Digital Media 2024 The Media Law Resource Center and the Berkeley Center for Law & Technology are proud to present the next in this series of conferences that explore emerging legal issues surrounding digital content in today's multi-platform world. Thursday, May 18 San Francisco Legal Frontiers in Digital Media 2023 Our annual conference for legal practitioners on emerging issues at the intersection of digital media, freedom of speech and the law May 19-20, 2022 Legal Frontiers in Digital Media 2022 The annual conference on emerging legal issues at the intersection of digital media, freedom of speech, and law. May 18-20, 2021 Zoom Legal Frontiers in Digital Media 2021 Annual conference on emerging legal issues at the intersection of digital media, freedom of speech, and law. See All Events"
