["https://medialaw.org/about-mlrc"]
title = "About MLRC: Old Version - Media Law Resource Center"
description = "These include News and analysis of legal, legislative and regulatory developments; Litigation resources and practice guides; National and international media law conferences and meetings. MLRC also works with its membership to respond to legislative and policy proposals, and speaks to the press and public on media law and First Amendment issues. MLRC was founded in..."
full_description = "About MLRC: Old Version MLRC is a non-profit membership organization for content providers and distributors in all media and their lawyers, providing a wide range of information and support on law and policy issues related to media and technology. These include News and analysis of legal, legislative and regulatory developments;Litigation resources and practice guides; National and international media law conferences and meetings. MLRC also works with its membership to respond to legislative and policy proposals, and speaks to the press and public on media law and First Amendment issues. MLRC was founded in 1980 by leading American publishers and broadcasters to assist in defending and protecting free press rights under the First Amendment. Today MLRC is supported by leading publishers, broadcasters, and cable programmers, internet operations, media and professional trade associations, and media insurance professionals in America and around the world. The MLRC’s Defense Counsel Section includes more than 200 law firms worldwide that specialize in media defense representation. Our members include ABC News, Associated Press, The Atlantic, Bloomberg, BuzzFeed, CBSViacom, CNN, Disney, Dow Jones, ESPN, Facebook, Greenpeace, Financial Times, Fox, Gannett, Google, HBO, Hearst, MacMillan, Meredith, NBCUniversal, Netflix, New York Times, New Yorker, NPR, Penguin Random House, Penske Media, Reuters, Univision, VICE, Vox, and The Washington Post. MLRC Leadership MLRC is governed by two oversight boards: a general Board of Directors, comprised of in-house media attorneys; and the Defense Counsel Section Executive Committee, comprised of outside counsel. Staff and Contact Information Staff bios and general contact information. Member Directory Search member firms in the 50-States and around the world. MLRC Listserv A private listserv for members to write informally among themselves. To sign-up, email medialaw@medialaw.org. Member Job Board Listings of jobs at member organizations. To submit an opening, email medialaw@medialaw.org. Annual Gala Dinner Every year more than 600 members and friends gather to support MLRC at a gala dinner featuring distinguished speakers, including prominent journalists and editors, media executives, entertainers, and newsmakers. Awards MLRC honors attorneys, journalists, jurists and others who have furthered freedom of the press and the First Amendment. MLRC Institute The MLRC Institute is a 501(c)(3) non-profit created by MLRC in 1988 to sponsor and support First Amendment education and research projects for journalists and the general public."
