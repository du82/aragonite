["https://medialaw.org/job-listing/attorney-daily-wire"]
title = "Attorney, Daily Wire - Media Law Resource Center"
description = "The Daily Wire is looking for an experienced and driven litigator with outstanding writing skills, First Amendment, and journalism experience to join our team as the  Associate General Counsel – Director of Litigation. The Attorney – Litigation & News will provide pre-publication review, as well as strategic direction and management for litigation matters, including First..."
full_description = "Attorney, Daily Wire The Daily Wire is looking for an experienced and driven litigator with outstanding writing skills, First Amendment, and journalism experience to join our team as the Associate General Counsel – Director of Litigation. The Attorney – Litigation & News will provide pre-publication review, as well as strategic direction and management for litigation matters, including First Amendment and media disputes, editorial and copyright matters, regulatory actions, and other legal proceedings. PRIMARY RESPONSIBILITIES Litigation Strategy Management Develop and implement strategic litigation plans and case management strategies to achieve favorable outcomes for the organization. Provide leadership and guidance to in-house legal teams and external counsel in all phases of litigation, including case assessment, discovery, motion practice, trial preparation, and settlement negotiations. Direct and supervise the handling of litigation matters, ensuring compliance with legal and ethical standards, litigation budgets, outside counsel guidelines, and deadlines. Identify opportunities for strategic litigation to advance the company’s mission and interests. Case Evaluation and Risk Assessment Assess legal claims and potential risks associated with litigation matters, providing sound legal advice and risk analysis to senior management and key stakeholders. Conduct comprehensive legal research and analysis on complex legal issues, statutes, regulations, and case law relevant to litigation matters. Dispute Resolution and Settlement Negotiations Develop and execute strategies for alternative dispute resolution (ADR) methods, such as mediation and arbitration, to resolve legal disputes efficiently and cost-effectively. Negotiate settlements and agreements with opposing parties, ensuring favorable terms, and protecting the organization’s interests while minimizing exposure to legal and financial risks. Legal Review and Clearance Review and analyze editorial content, articles, publications, and multimedia materials for legal compliance, including accuracy, fairness, defamation, privacy, copyright infringement, and other legal risks. Provide timely and practical legal advice and guidance to editorial teams on legal issues, ethical guidelines, and best practices related to content creation, publication, distribution, and social media engagement. Develop policies and procedures for handling claims, complaints, and requests for removal or correction. Training and Education Provide legal training and education to editorial staff on relevant legal topics, including free speech, copyright law, defamation law, privacy law, and intellectual property rights. Develop and deliver educational materials, presentations, and workshops to enhance legal awareness and compliance among editorial teams. Other Duties as Assigned Additional functions and requirements may be assigned by supervisors as deemed appropriate. REQUIRED EDUCATION/EXPERIENCE/SKILLS/COMPETENCIES Education Juris Doctor required with strong academic credentials from an ABA-accredited law school and current bar admission in at least one state bar. Demonstrated Skills/Abilities/Competencies 8+ years of relevant experience, including at least 4 years of reputable law firm experience (2+ years in-house experience is a plus) Experience practicing law with a focus on media, publishing, First Amendment issues, intellectual property, or related fields Strong understanding of copyright law, defamation law, privacy law, and other legal issues relevant to editorial content creation and publication Outstanding critical thinking, issue-spotting, and creative problem-solving High ethical standards Excellent communication, advocacy, drafting, analytical, and problem-solving skills Ability to work collaboratively with cross-functional teams and provide practical legal advice in a fast-paced environment Strong understanding of government processes, regulatory frameworks, and public policy issues relevant to the organization’s industry and operations, with the ability to effectively engage with government officials and stakeholders at all levels Ability to tailor constructive, practical business-oriented solutions to business needs A collaborative and team-focused attitude Flexibility and ability to pivot and juggle multiple tasks according to fast-paced, quickly-changing business needs Proficient with Microsoft Office and G-Suite Reports to: General Counsel Start date: Immediate Employment type: Full-time; Non-Exempt Compensation: Dependent upon experience Benefits: Health insurance options (medical through BlueCross Blue Shield; dental and vision through Guardian); Paid Time Off; 401k (5% match) For more information and to apply, click here."
