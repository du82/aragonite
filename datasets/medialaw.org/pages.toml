["https://medialaw.org/committee/advertising-and-commercial-speech-committee"]
title = "Advertising and Commercial Speech Committee - Media Law Resource Center"
description = "The Committee aims to provide timely information and valuable insight to members relevant to their advertising content and practices.  This includes examining the latest developments and trends in content creation and monetization, intellectual property issues, challenges with advertising and commercial speech in the age of digital and emerging technologies, data privacy implications, and applicable regulatory..."
full_description = "Advertising and Commercial Speech Committee The Committee seeks to discuss and consider legal, regulatory, and other issues facing media companies related to advertising and commercial speech. Committee Roster The Committee aims to provide timely information and valuable insight to members relevant to their advertising content and practices. This includes examining the latest developments and trends in content creation and monetization, intellectual property issues, challenges with advertising and commercial speech in the age of digital and emerging technologies, data privacy implications, and applicable regulatory guidance and consumer protection issues. Recognizing that developments in this space can rapidly change, the Committee provides membership alerts and articles published in the MediaLawLetter when appropriate. Committee Reports Advertising Law SummaryThe Summary covers areas for which the advertiser and/or publisher could be liable. It ranges from the content of the advertisements (discrimination to defamation) to the manner and placement of advertising."
year_published = 2023
