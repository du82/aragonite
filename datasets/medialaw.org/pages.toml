full_description = "Next Generation Committee The Next Generation Committee provides a forum for lawyers of any age who have been practicing media law for a decade or less. Committee Roster The Committee aims to increase the involvement of Next Generation lawyers in MLRC through attendance at general MLRC events and Next Generation-specific events, writing for MLRC publications, and helping MLRC identify up-and-coming and developing issues in media law. The Committee also provides resources and opportunities for Next Gen media lawyers, such as professional development, mentoring, socializing and publications geared to those who are fresh to the media law practice. To join this or any other committee, email us."
