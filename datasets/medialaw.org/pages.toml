full_description = "HomeEventsLatin American Media Law Conference2025 Miami Media Law Conference 2025 Miami Media Law Conference Thursday March 6, 2025Holland & Knight, 701 Brickell Ave, Miami, FL Registration Speakers & Faculty Bios MLRC invites you to attend a full day of sessions and networking with colleagues from Florida, Latin America and beyond. Location & Parking The conference is at: Holland & Knight, 701 Brickell Ave, Miami, FL 33131. You will need to provide at the lobby security desk. That will give you access to the 33rd floor – where conference is taking place. On-site paid parking is available. FOLLOW SIGNS IN PARKING GARAGE FOR 701 BRICKELL AND NOT 777 BRICKELL. Parking is plentiful on higher floors and rooftop. The Nearest Metromover station is the Eighth Street Station if you prefer public transportation. Conference Program March 6 9:30-10:00 – Registration 10:00am – Welcome & Introductions 10-11:00 Privacy and Security: Hot topics for media companies, including the privacy litigation landscape, legislative developments, state enforcement, and AI governance. Moderator: Hilary Lane, Ballard Spahr. Panelists: Cameron Scullen, Senior Legal Counsel, FIFA (Americas); Steven Blickensderfer, Lead Privacy Counsel, Krafton; Paula Mena Baretto, Campos Mellos Advogados (Brazil). 11:15-11:45 The Persecution and Prosecution of Journalists in Latin America.Q&A with journalist Javier Garza, founder news platform EnRe2Laguna, co-host Expansión Daily, one of the most popular news podcasts in México. Via Zoom. 12:00-1:00 Timely First Amendment issues from Trump’s pushback against free press and speech to the Dominion and Smartmatic cases against FOX.Moderator: George Freeman, MLRC. Panelists: Professor Clay Calvert, University of Florida; Tom Julin, Gunster.1:00-2:00 Lunch at Holland & Knight Including remarks from Roland Sanchez-Medina, Jr., President of the Florida Bar 2:10-2:45 Gustavo Lopez, Senior Counsel, Legal & Compliance, FIFA (Americas), on legal and business issues surrounding the 2026 World Cup in the Americas. 2:45-3:45 Attacks on Free Expression in Florida, and what to do about them.Moderator: David Karp, Carlton Fields. Panelists: Alex Pickett, Courthouse News Service; David Smiley, Miami Herald politics editor; Daniel Tilley, legal director ACLU of Florida. 4:00-5:00 Intellectual Property Issues, with a look at how fair use and other copyright issues differ in the US and Latin America.Moderator: Cindy Gierhart, Holland & Knight. Panelists: Roxana Kahale, Kahale Abogados (Argentina); Ana Siegel, GESA Globalist Ventures LLC; Rosalio Mata, Senior Counsel Amazon MGM: Sergio Gómez Martínez, Ojeda, Ojeda y Asociados (Mexico). 5:00-6:00pm End of Conference Reception at Holland & Knight The conference is approved for 6 hours of Florida CLE. Click to Register Our Sponsors"
