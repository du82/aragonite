full_description = "HomeDefamationAnti-SLAPP Anti-SLAPP Jan 2025 Fox News SLAPPs Defamation Suit, Wins Attorney Fees in District Court Matt Kristoffersen A former Hunter Biden business partner faced a double loss in the Southern District of New York late last year. Anthony Bobulinski’s $30 million defamation lawsuit against Fox News’s Jessica Tarlov, filed after the co-host of “The Five” said that a Trump Super PAC paid his legal fees, couldn’t survive a motion to dismiss under… TOPICS : Anti-SLAPP, Defamation Jan 2025 Ohio Enacts Anti-SLAPP Law Kevin T. Shook For years, the absence of an Anti-SLAPP law left Ohio news outlets vulnerable to lawsuits bankrolled by powerful interests seeking to suppress truthful reporting. The state's new law aims to level the playing field. TOPICS : Anti-SLAPP, Defamation Jan 2025 In Texas, Free-Speech Advocates Gear Up for Another Anti-SLAPP Fight Laura Prather and Reid Pillifant With big money and political influence still pushing SB 336, free speech advocates expect another bitter fight that could go the full 140 days. TOPICS : Anti-SLAPP, Defamation Dec 2024 Utah Court Dismisses Defamation Suit Against Newspaper Under Uniform Public Expression Protection Act Jeffrey J. Hunt, David C. Reymann, and Tammy M. Frisby A Utah state district court recently dismissed a defamation lawsuit brought against a weekly newspaper in what is believed to be the first application of the state’s new Uniform Public Expression Protection Act (UPEPA) to news reporting. TOPICS : Anti-SLAPP, Defamation Oct 2024 Publishers Win Anti-SLAPP Motion and Fee Award in Lawsuit Over Book Cover David Aronoff and Josh Bornstein The lawsuit involved claims by plaintiff Patrick Wizmann, who alleged that a statement written on the dust jacket of the book Dreams Don’t Die is allegedly false and misleading. TOPICS : Anti-SLAPP, Defamation Aug 2024 “Vanderpump Rules” Revenge Porn Lawsuit May Proceed, Judge Rules Matt Kristoffersen Judge Crowley reasoned that Madix did not have her boyfriend’s consent to access the contents of his phone. TOPICS : Anti-SLAPP, First Amendment, Privacy Aug 2024 Pennsylvania Enacts Anti-SLAPP Statute Michael Berry The new law is the culmination of more than a decade of lobbying by free-speech advocates from across the political spectrum. TOPICS : Anti-SLAPP, Defamation Jul 2024 Fox News Dismissed from Lawsuit in Less Than 90 Days with Public Apology Reid Pillifant Garcia’s counsel publicly pilloried Fox—the first named defendant in the case—for its supposedly shoddy journalism. There was just one problem: Fox News Network had been careful not to publish Garcia’s image before it could be verified. As a result, Fox never published Garcia’s image. TOPICS : Anti-SLAPP, Defamation Jul 2024 NY Appellate Court Affirms Dismissal of Claims and Award of Attorney’s Fees in Favor of Media Karim A. Abdulla TOPICS : Anti-SLAPP, Defamation, Truth Jul 2024 First Anti-SLAPP Win under NJ’s New UPEPA Law Bruce S. Rosen Nine months after New Jersey enacted its first anti-SLAPP law, essentially adopting the Uniform Public Expression Protection Act, a New Jersey trial court was the first to dismiss a SLAPP action. TOPICS : Anti-SLAPP, Defamation left_arrow_default 1 2 3 … 21 22 23 Next right_arrow_default"
