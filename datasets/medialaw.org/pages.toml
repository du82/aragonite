full_description = "HomeAccess / FOIA Access / FOIA Jan 2025 New Jersey Supreme Court Ensures Body-Worn Camera Video Access CJ Griffin The first New Jersey Supreme Court decision interpreting the state’s new Body-Worn Camera Law scales back prior case law that limited access to criminal investigation records and provides clarity regarding some of the law’s provisions. TOPICS : Access / FOIA, Government Records Nov 2024 Florida Court Denies Sheriff’s Motion to Close Courtroom Sarah Papadelias The Court found that the Sheriff had “failed to articulate any basis … to shield the video from public view or to exclude the media from the pretrial detention hearing.” TOPICS : Access / FOIA, Government Records Nov 2024 Right to Access Juvenile Records Blooms in Ohio Supreme Court Jack Greiner In a recent case, the Ohio Supreme Court ruled that an Ohio statute that mandated sealing the records of a juvenile proceeding upon a finding of non-delinquency violated the Open Courts provision of the Ohio Constitution. TOPICS : Access / FOIA, Government Records Sep 2024 Government Contractors Must Respond to Public Record Requests, Georgia Supreme Court Rules Peter Canfield On August 13, 2024, the Supreme Court of Georgia unanimously reaffirmed the public’s right under Georgia law to demand records from state and local agencies’ private contractors. TOPICS : Access / FOIA, Government Records Aug 2024 Copyright Law Used to Deny Access to Covenant School Shooter’s Manifesto Douglas R. Pierce TOPICS : Access / FOIA, Copyright, Government Records Jul 2024 Court Orders D.C. Police to Produce Thousands of Records About Monitoring Citizens’ Social Media Accounts Alia Smith The MPD produced more than 160,000 records totaling roughly 700,000 pages, which shed significant light on how MPD keeps tabs on citizens, including those engaged in lawful protest activity, through its monitoring of social media accounts. The District also agreed to pay $400,000 in attorneys’ fees. TOPICS : Access / FOIA, Government Records Jul 2024 American Survivors of Israel’s Deadly 1967 Attack on the U.S.S. Liberty Still Seek Answers Caesar Kalinowski IV Kinnucan’s lawsuit forced the disclosure of hundreds of documents previously withheld by the government for decades. But NSA has repeatedly stalled and even unilaterally decided to “reprocess” her request after briefing on the case had commenced in the Ninth Circuit. The reason for the delay seems clear; time is running out. TOPICS : Access / FOIA, Government Records Jul 2024 Media Rallies to Support Citizen Journalist in SCOTUS Qualified Immunity Case Jeffrey J. Pyle More than thirty journalists and media organizations filed amicus briefs in support of Priscilla Villarreal, a citizen journalist who was arrested for requesting and reporting truthful information from a police officer. TOPICS : Courtroom Access, Newsgathering May 2024 To Seal or Not to Seal—That is the Question Mackenzie Arnold The Fifth Circuit vacated and remanded an order from a district court that unsealed a now-settled case allegedly involving revenge porn because the district court applied the incorrect standard for sealing judicial documents. TOPICS : Access / FOIA, Government Records May 2024 Ohio Supreme Court Brings Curtain Down On Covid Data John C. Greiner & Darren W. Ford In a decision that could have far-reaching implications for Ohioans' right to know, the Court held that the Ohio Department of Health must withhold official cause of death information contained in ODH's Electronic Death Registration System from the public. TOPICS : Access / FOIA, Government Records left_arrow_default 1 2 3 … 28 29 30 Next right_arrow_default"
