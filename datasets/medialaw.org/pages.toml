["https://medialaw.org/job-listing/senior-staff-attorney-first-amendment-coalition"]
title = "Senior Staff Attorney, First Amendment Coalition - Media Law Resource Center"
description = "The First Amendment Coalition (FAC) seeks a California lawyer with substantial litigation experience, especially in public records cases, to join our growing team as a senior staff attorney. Nonpartisan and nonprofit, FAC believes that the broadest range of engaged and informed communities is essential to the health of our democracy—that the values expressed by the First Amendment..."
full_description = "Senior Staff Attorney, First Amendment Coalition The First Amendment Coalition (FAC) seeks a California lawyer with substantial litigation experience, especially in public records cases, to join our growing team as a senior staff attorney. Nonpartisan and nonprofit, FAC believes that the broadest range of engaged and informed communities is essential to the health of our democracy—that the values expressed by the First Amendment provide a blueprint for an inclusive, equitable society and a responsive, accountable government. To that end, FAC educates, advocates and litigates to protect and promote government transparency and First Amendment protections for all. FAC’s legal work is focused on enhancing public access to federal, state and local government records and proceedings and protecting the First Amendment rights of free speech and press. FAC also defends press independence by providing legal assistance to journalists served with subpoenas for their confidential sources or newsgathering materials. The Senior Staff Attorney will report to FAC’s Legal Director and work with other staff to expand FAC’s strategic litigation program by bringing a substantial number of new cases seeking public records and recovering appropriate fees and costs. Core responsibilities Expanding FAC’s impact by identifying, developing and pursuing a substantial number of civil cases, especially under the California Public Records Act, but also potentially including the Brown Act, Freedom of Information Act, California reporter’s shield law or First Amendment; Case management, including formulating and implementing discovery plans, tracking and meeting deadlines, taking and responding to discovery, communicating with clients and counsel, negotiating potential settlements and recovering costs and fees. Conducting or supervising fact investigation and document review; Researching or supervising research into relevant law; Drafting or supervising the drafting of pleadings, briefs (direct or amicus) or demand letters; Working constructively with cooperating counsel or other allies and partners; Drafting public communications such as press releases and participating in interviews with journalists about pending matters; Supervision of legal fellows and support staff on specific projects. Additional responsibilities Assisting with responses to queries sent to FAC’s Legal Hotline regarding access to public records and governmental meetings in California; access to court documents and proceedings in California and federal courts; and First Amendment protections for freedom of speech and freedom of the press; Helping maintain FAC’s educational resources such as public records guides; Participating in workshops and trainings on open government, press freedom and First Amendment issues; Other tasks as assigned. Qualifications Member of California State Bar in good standing; At least seven years of litigation experience in California courts, including cases brought under the California Public Records Act or federal Freedom of Information Act; Outstanding skills in research, analysis, legal writing and oral communication; Demonstrated ability to work independently but also collaboratively and collegially with a small staff of lawyers and non-lawyers; Demonstrated initiative in developing cases, acting decisively and diligently while exercising seasoned ethical, strategic and professional judgment; Demonstrated experience in working autonomously under general supervision without hands-on management; Excellent time management skills with demonstrated ability to prioritize and balance multiple tasks across different cases and projects. Collaborative and solution-oriented mindset for addressing and resolving conflicts or challenges; Willingness to travel as needed for litigation or other professional reasons. Salary and benefits Salary up to $125,000 depending on experience. FAC pays 85% of health insurance and offers a 401(k) retirement plan with a 5% employer match. Paid time off includes four weeks of vacation time per year, plus the week between Christmas and New Year’s Day, when FAC’s offices are closed, as well as 10 paid holidays and 10 sick days per year. Employees choose a computer and related office equipment of their preference and receive a monthly stipend for a cell phone reimbursement. Program staff can also receive budget and time for professional development opportunities such as conferences and training. FAC also has a pro bono membership with Practising Law Institute providing free access to CLE programs. About FAC FAC is a small but growing organization with a 37-year history working across California to stand up for free speech, a free press and public participation in civic affairs. FAC is committed to a diverse and inclusive staff, one that reflects the state and country we serve. Freedom of information, expression, and of the press are universal ideals but diversity of life experiences can make a big difference in how FAC identifies and litigates legal issues, serves our varied constituencies, and arrives at policy positions on the rights and ideals we care about. To that end, we deliberately seek applicants who can bring different perspectives and experiences to better inform our work promoting and defending free expression, a free press and the public’s right to know. Read more about our commitment to diversity, equity and inclusion in this summary of our Strategic Plan, and about our work across California in our latest Impact Report. Location We welcome candidates who will work remotely but require this position to be based in California. Candidates who want to work from the San Francisco Bay Area will have access to a FAC office in San Rafael (Marin County). Our fully remote team meets multiple times a year, and all employees are expected to attend those gatherings, with costs covered by FAC. Application deadline Applicants are encouraged to submit materials as soon as possible; applications will be accepted through March 14, 2025. How to apply: Please submit a resume and a cover letter through Bamboo HR describing your interest in working for the First Amendment Coalition and how your skills and experiences fit the desired qualifications. You should address your cover letter to David Loy, Legal Director. Application materials are not accepted via email. Please use the BambooHR link above. If you have any questions regarding FAC’s Senior Staff Attorney position or the application process, please email srstaffattorney@firstamendmentcoalition.org. Inquiries will be treated as confidential."
year_published = 2025
year_updated = 2025
