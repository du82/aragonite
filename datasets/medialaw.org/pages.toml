full_description = "HomeDigital Media Digital Media Dec 2024 TikTok Falls Under the Long Shadow of Holder Jeff Hermes This case presents what I have started to think about as a First Amendment checksum error: If you interpret the First Amendment as not only permitting but actually justifying greater government control over the content of speech, then you know there is an error in your analysis even if you can’t pinpoint it. TOPICS : Digital Media, First Amendment Oct 2024 Third Circuit Cites First Amendment to Limit § 230 Protection Jeff Hermes In its opinion in Anderson v. TikTok, the Third Circuit held that Section 230 offers no protection for the sua sponte recommendation of content by social media platforms. TOPICS : Digital Media, Section 230 Sep 2024 9th Circuit Affirms Dismissal of Claimed Censorship Case Against Facebook and Fact-Checking Organizations Brought by RFK, Jr. Group Daniela Abratt-Cohen The Court held the district court properly dismissed a case filed by Children’s Health Defense, a nonprofit organization founded by Robert F. Kennedy, Jr., that advocates against vaccines, finding that it failed to a state a claim that fact-checks, and other restrictions, regarding its ability to post and fundraise on Facebook violated the First Amendment… TOPICS : Digital Media, First Amendment, Section 230 Sep 2024 Strange Facts, But Wire Service Defense Wins the Day in Florida Charles Glasser While the facts of the case are almost one-in-a-million, the legal issues – involving libel by embedding allegedly defamatory tweets written by others – is something we are dealing with more and more frequently. TOPICS : Defamation, Section 230 Jul 2024 NetChoice v. Moody: A Strong Statement of First Amendment Rights, But the Devil is in the Details Jeff Hermes On the surface, this ruling appears to ensure that the First Amendment protects the editorial discretion of platforms just as it has protected the editorial discretion of newspapers. But with a caveat in a concurrence from Justice Barrett and comments from the other four justices challenging the Court’s decision to apply the law based on… TOPICS : Digital Media, First Amendment Jun 2024 Federal Court Holds That Copyright Act Preempts X’s Web Scraping Claims Jeremy Goldman In a blockbuster ruling that is bound to have far-reaching implications, including in the swarm of copyright infringement cases brought against AI platforms, a California federal court recently dismissed a complaint that X Corp. brought against web scraping company Bright Data. TOPICS : Copyright, Digital Media, Intellectual Property Jun 2024 AI and Child Safety Lead Discussion at 2024 MLRC Digital Conference Michael Norwick Much of the content of this year’s conference encompassed two red hot topics: the uncertainty and quickly evolving issues surrounding generative AI, and the wave of legislation and litigation in the name of child safety. TOPICS : Digital Media, MLRC News May 2024 With the ELVIS Act, Tennessee Shows its Burning Love for Recording Artists David Zeitlin and Robb Harvey Tennessee, home to both Music City® (Nashville) and the Blues (Memphis), has taken a swing at regulating generative AI’s potential harm to musicians and recording artists. TOPICS : Intellectual Property, Right of Publicity, Section 230 Apr 2024 Authors’ Vicarious Infringement Claims Against ChatGPT Dismissed Matt Kristoffersen The U.S. District Court for the Northern District of California recently dismissed most of a collection of claims brought by a group of authors against OpenAI, alleging that the artificial intelligence company infringes their copyright when it uses their works to train its large language model ChatGPT. TOPICS : Digital Media, Intellectual Property Apr 2024 The Supreme Court Rules on Social Media Blocking Jeff Hermes In a unanimous ruling, the U.S. Supreme Court enunciated the standards by which a court should determine whether a public official’s action in preventing someone from commenting on the official’s social media page constitutes state action. TOPICS : Digital Media, First Amendment left_arrow_default 1 2 3 … 24 25 26 Next right_arrow_default"
