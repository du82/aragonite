["https://medialaw.org/events"]
title = "Events - Media Law Resource Center"
description = """
Monday, March 3 at 1pm ET / 10am PT
\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t
\t\t\t\t\t\t\t\t\t\tTrump’s Consumer Protection Claims Against the Press
\t\t\t\t\t\t\t\t\t\tAre these just doomed end-runs around defamation law intended to harass the media, or could these claims have teeth (especially when Trump cherry-picks the judges)?  How can the press prepare for similar claims in the future? With Robert Corn-Revere, FIRE; Prof. Clay Calvert, University of Florida."""
full_description = "Events MLRC produces industry-leading conferences and events on a wide range of topics. Our events bring together our members to study particular issues of importance, and to celebrate the First Amendment. Monday, March 3 at 1pm ET / 10am PT Trump’s Consumer Protection Claims Against the Press Are these just doomed end-runs around defamation law intended to harass the media, or could these claims have teeth (especially when Trump cherry-picks the judges)? How can the press prepare for similar claims in the future? With Robert Corn-Revere, FIRE; Prof. Clay Calvert, University of Florida. calendar Tuesday, March 4 at 1pm ET / 10am PT Newsgathering Committee Meeting: Controlling White House Press Pool Access – Escalating Tensions A very timely discussion with guests including Guardian US columnist Margaret Sullivan, legal scholar Eugene Volokh, and Chuck Tobin, Partner, Ballard Spahr LLP. Moderated by Newsgathering Committee Co-chair Mickey H. Osterreicher. Wednesday, March 5 at 1pm ET / 10am PT Navigating Immigration Changes / Impact of Immigration-Related Executive Orders on Media Employers Join the Employment Law Committee & Diverse Voices Committee for a timely discussion on the potential impact of recent presidential executive orders addressing immigration on media organizations. March 6, 2025 2025 Miami Media Law Conference MLRC invites you to attend a full day of sessions and networking with colleagues from Florida, Latin America and beyond. Thursday, March 13 at 2pm ET / 11am PT Data Privacy Presentation: Overview of US Law on Restricted Transfers of Sensitive Data In April, a new DOJ rule will restrict transfers of bulk U.S. “sensitive data” to certain “countries of concern,” including China. Marci Rozen (ZwillGen) will examine potential impact of the rule on media companies, including restrictions on using certain pixels & other online advertising technology & newly-required diligence processes for vendor & advertising partner relationships. See All Events CONFERENCES & MEETINGS Zoom Series MLRC Institute Entertainment Conference Committee Meetings Digital Conference Annual Dinner London Conference Latin America Conference Media Law Conference"
