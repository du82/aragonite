full_description = "HomeMLRC PublicationsFox News SLAPPs Defamation Suit, Wins Attorney Fees in District Court January 2025 Fox News SLAPPs Defamation Suit, Wins Attorney Fees in District Court By Matt Kristoffersen PUBLISHED IN: MediaLawLetter January 2025 TOPICS : Anti-SLAPP, Defamation A former Hunter Biden business partner faced a double loss in the Southern District of New York late last year. Anthony Bobulinski’s $30 million defamation lawsuit against Fox News’s Jessica Tarlov, filed after the co-host of “The Five” said that a Trump Super PAC paid his legal fees, couldn’t survive a motion to dismiss under New York’s Anti-SLAPP statute, District Judge J. Paul Oetken ruled. Log in to access all contentUsernamePasswordAntispam 1Antispam 2Antispam 3LoginReset Log-injQuery(document).ready(function() {pc_login_smalls_display_check();pc_lf_labels_h_check();});Not a member yet?Join MLRC today!We provide you with essential tools to advance First Amendment and media rights, and a supportive community in which to discuss emerging legal issues and the future of communication.Sign Up"
