["https://medialaw.org/job-listing/legal-fellow-washington-university-school-of-law-first-amendment-clinic-2"]
title = "Legal Fellow, Washington University School of Law First Amendment Clinic - Media Law Resource Center"
description = "The First Amendment Clinic at Washington University School of Law seeks a full-time Legal Fellow. This is a one-year position with the option to extend to a second year, contingent upon job performance and continued funding.  The First Amendment Clinic’s mission is to defend and advance the rights of free speech, press, assembly, and petition..."
full_description = "Legal Fellow, Washington University School of Law First Amendment Clinic The First Amendment Clinic at Washington University School of Law seeks a full-time Legal Fellow. This is a one-year position with the option to extend to a second year, contingent upon job performance and continued funding. The First Amendment Clinic’s mission is to defend and advance the rights of free speech, press, assembly, and petition through regional litigation and advocacy, while providing law students with the practice experience to become leaders on First Amendment issues. The Clinic takes on a wide array of cases and controversies, including litigating First Amendment violations by raising claims under 42 U.S.C. § 1983 and defending against libel claims and newsgathering torts. The Clinic has successfully represented a range of clients, including citizens challenging their denials of access to public board meetings, musicians challenging municipal policies that prevented them from playing on public sidewalks, a homeless veteran who was repeatedly arrested under an unconstitutional content-based solicitation ordinance, a local political activist who was blocked from the Twitter account of her elected official because she questioned one of his policy positions, and a journalist seeking to unseal court records. The Clinic and the legal fellow position are supported by the Stanton Foundation. Under the direction of the Clinic’s Director, the Fellow will be expected to: (1) engage in substantial legal work, including intake/case evaluation, client interviewing and counseling, fact investigation, drafting pleadings and other legal filings, participating in discovery, and making court appearances; and (2) help supervise law students by providing feedback on their written work, client interaction, and oral advocacy. The Fellow will also assist with coalition building and managing referral relationships with public interest organizations, law firms, and other stakeholders committed to protecting expressive freedoms. Candidates must possess a J.D. degree from an ABA-accredited law school and must be admitted or eligible to practice law in Missouri (i.e., must be a member of the Missouri bar, able to become a member within six months of starting the position, or eligible for a certificate to supervise students as a law teacher pursuant to Missouri Supreme Court Rule 13.06). Candidates should possess a strong academic record; excellent written and oral communication skills; strong organizational and time-management skills; an ability to build and maintain relationships with both students and community/professional partners; and an interest in First Amendment law. Preference will be given to candidates who have at least two years of litigation or clerkship experience. The proposed start date for this position is July 1, 2025. Applications will be considered on a rolling basis. For fullest consideration, apply by March 10, 2025. Applicants should submit a cover letter (briefly describing the candidate’s interest and qualifications), resume, and at least two references at this link. Questions about the position may be directed to Lisa Hoppenjans, Director, First Amendment Clinic, at lhoppenjans@wustl.edu. Washington University is an Equal Opportunity Employer. All qualified applicants will receive consideration for employment without regard to race, color, religion, age, sex, sexual orientation, gender identity or expression, national origin, genetic information, disability, or protected veteran status."
year_published = 2025
year_updated = 2025
