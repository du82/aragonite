full_description = "HomeIntellectual Property Intellectual Property Jan 2025 Ninth Circuit Reverses Copyright Lawsuit Against Aritzia, Opening Up Possibility of Copyright Protection for Kinetic Sculpture Rachel Oh The Ninth Circuit noted that “copyrightability of kinetic and manipulable sculptures” is “an area of copyright law that has not yet received much attention” and “may be better informed with a more complete factual record.” TOPICS : Copyright, Intellectual Property Oct 2024 Court Applies Rogers v. Grimaldi to Dismiss Trademark Case Over Book Cover and Use of Photographs Elizabeth Schilken In a ruling reaffirming the vitality of the Rogers v. Grimaldi test on motions to dismiss, a federal judge has dismissed a lawsuit alleging the bestselling memoir Surviving to Drive, authored by Formula 1 racing figure Guenther Steiner, infringed the trademarks of a corporate sponsor. TOPICS : Intellectual Property, Trademark Sep 2024 George Santos Loses Cameo Copyright Case Raphael Holoszyc-Pimentel, Eric Feder, and Nathan Siegel Santos sued after the show Jimmy Kimmel Live! used short videos of Santos saying absurd things in exchange for money on the site Cameo—videos that Kimmel allegedly tricked Santos into making. The defendants moved to dismiss Santos’ complaint on the grounds that they made a fair use of Santos’ videos. TOPICS : Copyright, Intellectual Property Aug 2024 Copyright Law Used to Deny Access to Covenant School Shooter’s Manifesto Douglas R. Pierce TOPICS : Access / FOIA, Copyright, Government Records Jul 2024 Vidal v. Elster, or, What Happens When the Supreme Court Lacks a Fundamental Theory of the First Amendment Jeff Hermes The Court’s struggle to find a deciding principle stems directly from the siloing of First Amendment law into discrete doctrines – public forums, government benefits, and so on. The fact that this case did not neatly fit into these categories is what led Justice Thomas to abandon logic for history, Justice Kavanaugh to give up… TOPICS : First Amendment, Trademark Jun 2024 Federal Court Holds That Copyright Act Preempts X’s Web Scraping Claims Jeremy Goldman In a blockbuster ruling that is bound to have far-reaching implications, including in the swarm of copyright infringement cases brought against AI platforms, a California federal court recently dismissed a complaint that X Corp. brought against web scraping company Bright Data. TOPICS : Copyright, Digital Media, Intellectual Property Jun 2024 Supreme Court Provides for Broader Availability of Damages in Copyright Suits Sean M. Callagy and Bridgette C. Gershoni The Supreme Court issued a 6-3 decision in Warner Chappell Music, Inc. v. Nealy, No. 22-1078, holding that damages are available under the Copyright Act for acts of infringement that predate the initiation of suit by more than three years. TOPICS : Copyright, Intellectual Property May 2024 Top Gun Lawsuit Shot Down Matt Kristoffersen The 1983 magazine article “Top Guns” and Paramount Pictures’ recent blockbuster movie Top Gun: Maverick are not substantially similar under copyright law, a California federal judge ruled this month. TOPICS : Copyright, Intellectual Property May 2024 With the ELVIS Act, Tennessee Shows its Burning Love for Recording Artists David Zeitlin and Robb Harvey Tennessee, home to both Music City® (Nashville) and the Blues (Memphis), has taken a swing at regulating generative AI’s potential harm to musicians and recording artists. TOPICS : Intellectual Property, Right of Publicity, Section 230 Apr 2024 Authors’ Vicarious Infringement Claims Against ChatGPT Dismissed Matt Kristoffersen The U.S. District Court for the Northern District of California recently dismissed most of a collection of claims brought by a group of authors against OpenAI, alleging that the artificial intelligence company infringes their copyright when it uses their works to train its large language model ChatGPT. TOPICS : Digital Media, Intellectual Property left_arrow_default 1 2 3 … 26 27 28 