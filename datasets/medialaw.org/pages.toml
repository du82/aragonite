full_description = "HomeDefamation Defamation Jan 2025 Former Northwestern Baseball Coach’s Defamation Claim Dismissed with Prejudice Julia Dacy The Tribune argued that the Illinois innocent construction rule required dismissal of all claims because the statements describing Foster’s coaching style as tough or demanding did not necessarily call into question his integrity or ability to do his job. TOPICS : Defamation Jan 2025 Defamation Lawsuit against Baby Reindeer Survives Motion to Dismiss Rachel Oh The court held that plaintiff, Scottish law graduate Fiona Harvey, sufficiently pled that the series was “of and concerning” her and published with actual malice. Key to the court’s ruling was an opening title card stating “this is a true story” which it found outweighed a disclaimer at the end of each episode that the… TOPICS : Defamation, Emotional Distress, Right of Publicity Jan 2025 Court Dismisses Implied Defamation Claims Brought by Former Principal in New York Philharmonic Kate Bolger and Mary Goetz The opinion from the Southern District of New York found that neither a longform article nor statements made by its author on a podcast intended to imply defamatory statements about the plaintiff. TOPICS : Defamation Jan 2025 Fox News SLAPPs Defamation Suit, Wins Attorney Fees in District Court Matt Kristoffersen A former Hunter Biden business partner faced a double loss in the Southern District of New York late last year. Anthony Bobulinski’s $30 million defamation lawsuit against Fox News’s Jessica Tarlov, filed after the co-host of “The Five” said that a Trump Super PAC paid his legal fees, couldn’t survive a motion to dismiss under… TOPICS : Anti-SLAPP, Defamation Jan 2025 Ohio Enacts Anti-SLAPP Law Kevin T. Shook For years, the absence of an Anti-SLAPP law left Ohio news outlets vulnerable to lawsuits bankrolled by powerful interests seeking to suppress truthful reporting. The state's new law aims to level the playing field. TOPICS : Anti-SLAPP, Defamation Jan 2025 In Texas, Free-Speech Advocates Gear Up for Another Anti-SLAPP Fight Laura Prather and Reid Pillifant With big money and political influence still pushing SB 336, free speech advocates expect another bitter fight that could go the full 140 days. TOPICS : Anti-SLAPP, Defamation Dec 2024 Utah Court Dismisses Defamation Suit Against Newspaper Under Uniform Public Expression Protection Act Jeffrey J. Hunt, David C. Reymann, and Tammy M. Frisby A Utah state district court recently dismissed a defamation lawsuit brought against a weekly newspaper in what is believed to be the first application of the state’s new Uniform Public Expression Protection Act (UPEPA) to news reporting. TOPICS : Anti-SLAPP, Defamation Dec 2024 Second Circuit Affirms Dismissal of Defamation Case Against Newsweek Cameron Stracher and Sara Tesoriero The Second Circuit has affirmed the dismissal of a defamation claim against Newsweek on substantial truth and fair report grounds. TOPICS : Defamation, Fair Report & Other Privileges, Truth Dec 2024 Sarah Palin’s Second Chance to Try Libel Case Against The New York Times Set for April Tim Tai The move comes after a panel of the U.S. Court of Appeals for the Second Circuit threw out a jury verdict and the judge’s own Rule 50 decision for The Times in August, reviving Palin’s case. TOPICS : Defamation Dec 2024 Defamation Suit Over Nancy Grace True Crime Show and Podcast Dismissed Mary Ellen Roy and Elana Beiser Considering the allegedly defamatory statements as a whole in the context in which they were made, the Court held that they are not defamatory because they are not “of and concerning” the Plaintiffs, are substantially true, and/or are opinion on disclosed facts. TOPICS : Defamation, Truth left_arrow_default 1 2 3 … 89 90 91 Next right_arrow_default"
