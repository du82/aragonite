full_description = "HomeDefamation Defamation Sep 2024 Maine Libel Decision Favoring Media Organizations Affirmed Cynthia Counts and Rachel Werthehimer The First Circuit affirmed the summary judgment decision of the District of Maine that dismissed defamation claims filed by a former Veterans Administration podiatrist against four media organizations and four reporters. TOPICS : Defamation Aug 2024 Analyst Report and New York Times Article About Crypto Crash Not Defamatory Dana Green Having failed to show that Arkham’s report was published with actual malice, the court readily found that Dfinity also failed to establish that The Times’s summary of those same allegations was published with actual malice. TOPICS : Defamation Aug 2024 “Vanderpump Rules” Revenge Porn Lawsuit May Proceed, Judge Rules Matt Kristoffersen Judge Crowley reasoned that Madix did not have her boyfriend’s consent to access the contents of his phone. TOPICS : Anti-SLAPP, First Amendment, Privacy Aug 2024 Docuseries Not Defamatory as a Matter of Law Emmy Parsons A Florida state court recently held that a docuseries titled Paul T. Goldman did not defame the woman on whom one of the main characters was based, holding that the series was not capable of defamatory meaning and was not “of and concerning” the plaintiff. TOPICS : Defamation, Defamatory Meaning Aug 2024 Pennsylvania Enacts Anti-SLAPP Statute Michael Berry The new law is the culmination of more than a decade of lobbying by free-speech advocates from across the political spectrum. TOPICS : Anti-SLAPP, Defamation Jul 2024 Capitol “Rioter” Suit Against CNN Dismissed Matt Kristoffersen “At bottom, the Court agrees with CNN that Plaintiff Jacob Hiles ‘essentially is trying to blame CNN for taking his own words at face value,’” Judge Allen wrote in her decision granting summary judgment. “Under the circumstances of this case, CNN was entitled to do so, and its reporting is protected by the fair report… TOPICS : Defamation Jul 2024 Fox News Dismissed from Lawsuit in Less Than 90 Days with Public Apology Reid Pillifant Garcia’s counsel publicly pilloried Fox—the first named defendant in the case—for its supposedly shoddy journalism. There was just one problem: Fox News Network had been careful not to publish Garcia’s image before it could be verified. As a result, Fox never published Garcia’s image. TOPICS : Anti-SLAPP, Defamation Jul 2024 NY Appellate Court Affirms Dismissal of Claims and Award of Attorney’s Fees in Favor of Media Karim A. Abdulla TOPICS : Anti-SLAPP, Defamation, Truth Jul 2024 First Anti-SLAPP Win under NJ’s New UPEPA Law Bruce S. Rosen Nine months after New Jersey enacted its first anti-SLAPP law, essentially adopting the Uniform Public Expression Protection Act, a New Jersey trial court was the first to dismiss a SLAPP action. TOPICS : Anti-SLAPP, Defamation Jun 2024 Texas Court of Appeals Dismisses Claims by Politically Connected Entrepreneur on Statute of Limitations Grounds Marc Fuller and Maggie Burreson A Texas court of appeals rejected a telehealth company’s attempt to evade the state’s one-year statute of limitations on defamation claims by relabeling its claims as business disparagement and other torts. TOPICS : Anti-SLAPP, Defamation left_arrow_default Prev 1 2 3 4 … 89 90 91 Next right_arrow_default"
