full_description = "HomeDefamationFair Report & Other Privileges Fair Report & Other Privileges Dec 2024 Second Circuit Affirms Dismissal of Defamation Case Against Newsweek Cameron Stracher and Sara Tesoriero The Second Circuit has affirmed the dismissal of a defamation claim against Newsweek on substantial truth and fair report grounds. TOPICS : Defamation, Fair Report & Other Privileges, Truth May 2024 Montana Supreme Court Applies N.Y. Fair Report Privilege to Dismiss Libel Claim by Montana Plaintiff Adam I. Rich and Laura R. Handman The Montana Supreme’s Court’s decision is the first by any high court to find that a publisher’s home state has the most significant interest in applying its fair report privilege. TOPICS : Defamation, Fair Report & Other Privileges Mar 2024 Broadcaster Wins Summary Judgment and Attorneys’ Fees Under New York’s Expanded Anti-SLAPP Statute Jacquelyn Schell and Chad Bowman The news reports about sexual assault claims against the Catholic Church were protected by the fair report privilege and plaintiff failed to adduce any evidence of gross irresponsibility. TOPICS : Anti-SLAPP, Defamation, Fair Report & Other Privileges Aug 2023 Article Tying Nursing Home Magnate to Human Trafficking, Medicaid Fraud & Elder Abuse Protected As Fair Report, True, and Opinion Alia Smith Judge Azrack held that the challenged statements – concerning the poor quality of some of Landa’s nursing homes and alleged financial and other improprieties – were fair reports under N.Y. Civil Rights Law § 74, were substantially true, or were non-actionable opinions. TOPICS : Defamation, Fair Report & Other Privileges, Opinion, Truth Apr 2023 Long-Run Effects of Dominion v. Fox George Freeman The judge’s decision to dismiss any argument based on the neutral reportage privilege was a lost opportunity. It could have corrected one of the few areas where good journalism and the law diverge. TOPICS : Defamation, Fair Report & Other Privileges, MLRC News Mar 2023 Satanic Temple Lawsuit Against Newsweek Magazine Largely Dismissed Cameron Stracher and Sara Tesoriero The Southern District of New York held that twenty-one of the twenty-two statements were not defamatory as a matter of law. TOPICS : Defamation, Fair Report & Other Privileges, Jurisdiction, Opinion Mar 2023 New York First Department Affirms Dismissal of “Brooklyn Land Shark” Case Matthew Leish A defendant who prevails on an anti-SLAPP motion to dismiss may recover its attorneys’ fees without the need to file a counterclaim or a separate lawsuit. TOPICS : Anti-SLAPP, Defamation, Fair Report & Other Privileges Oct 2022 N.C. Court of Appeals Affirms Dismissal of Libel Suit Against WRAL Mary Aline Fertin The Court of Appeals of North Carolina affirmed the dismissal of a libel suit against WRAL over its coverage of Crystal Mangum’s murder conviction. TOPICS : Defamation, Fair Report & Other Privileges Sep 2022 Anti-SLAPP Tactical Considerations in New York State Versus Federal Courts David S. Korzenik The court had no difficulty concluding the article was a matter of legitimate public concern, a fair report of the prior proceedings, and published without actual malice. The significance of the decision, however, also lies in its approach to the recovery of legal fees under the New York SLAPP statute. TOPICS : Anti-SLAPP, Defamation, Fair Report & Other Privileges Sep 2022 New Jersey State Court Imposes Sanctions Against Counsel for Pursuing Frivolous Defamation Claims Elizabeth Seidlin-Bernstein A pair of recent decisions from a New Jersey trial court highlights the state’s strong legal protections for freedom of speech and the press. TOPICS : Defamation, Fair Report & Other Privileges left_arrow_default 1 2 3 … 7 8 9 Next right_arrow_default"
