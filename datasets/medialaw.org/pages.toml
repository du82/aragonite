full_description = "HomeInternational International Dec 2024 Australia Adopts Statutory Tort for Serious Invasions of Privacy Patrick Considine and Peter Bartlett This new cause of action empowers individuals to sue another person or entity where that person or entity invaded the individual’s privacy by intruding upon their seclusion or misusing information relating to them. TOPICS : International, Privacy Jul 2024 A View from the Northern Ireland Bench Mr. Justice Adrian Colton I am delighted to be able to provide a perspective from the Northern Ireland Bench on freedom of expression, the right to privacy and the protection of reputation. TOPICS : International Jun 2024 A Cautionary Tale for Defamation Plaintiffs: Going Back to the Lion’s Den to Retrieve Your Hat Marlia Saunders and Amelia CausleyTodd The outcome is hugely significant because it's the first time a court has made a finding about what happened at Parliament House on that night over 5 years ago – and provides long overdue vindication for Brittany Higgins. TOPICS : Defamation, International Mar 2024 Anti-SLAPP Developments in the UK and Europe and What It’s Like Being Slapped in Greece David Hooper There are things to learn from the markers set out by the EU and Council of Europe as to the identifying features of SLAPPs and how to produce a draft law acceptable to a wide spectrum of differing approaches to anti-SLAPP law. TOPICS : Anti-SLAPP, Defamation, International Feb 2024 Happy Slam, Happy Conference George Freeman Executive director on MLRC's dynamic inaugural conference in Sydney. TOPICS : International, MLRC News Jul 2023 Maine Governor Vetoes Legislation Requiring News Outlets to Establish Unconstitutional Censorship Process for “Foreign Government-Influenced” Political Communications Sigmund D. Schutz, Alexandra A. Harriman, and Margeaux E. Lavoie No state has come closer than Maine to imposing on news outlets constitutionally fraught and onerous obligations to police and censor foreign-influenced spending on political advertising. TOPICS : First Amendment, International Jul 2023 Charity’s Defamation Claim Against Canadian Public Broadcaster Can Continue in U.S. Federal Court Sam Lachman The Court dismissed the charity’s claims for breach of contract, promissory estoppel, and negligent misrepresentation for lack of subject-matter jurisdiction, leaving its defamation claim to proceed to discovery. At issue is TOPICS : Anti-SLAPP, Defamation, International Feb 2023 A Muslim Musician Is on Death Row for Singing on What’s App Richard Winfield The Nigerian musician, Yahaya Sharif-Aminu, was expressing his religious beliefs in his lyrics which praised a Nigerian imam whom he sang was superior to the Prophet Mohammad. TOPICS : International Oct 2022 Australia’s Trial of the Century: Ben Roberts-Smith v. Fairfax Media Peter Bartlett Australian lawyer gives context about complex case pitting Australia’s most decorated soldier against experienced journalists who allege he committed war crimes in Afghanistan. TOPICS : Defamation, International Jun 2022 Banks v. Cadwalladr – Meaning, Intention & Public Interest Emma Linch The length and detail of the judgment demonstrates the level of detail required to succeed in a public interest defence. TOPICS : Defamation, Defamatory Meaning, International left_arrow_default 1 2 3 4 5 6 Next right_arrow_default"
