title = "Committee Meetings Archives - Media Law Resource Center"
description = """
Tuesday, March 4 at 1pm ET / 10am PT
\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t
\t\t\t\tNewsgathering Committee Meeting: Controlling White House Press Pool Access – Escalating Tensions
\t\t\t\tA very timely discussion with guests including Guardian US columnist Margaret Sullivan, legal scholar Eugene Volokh, and Chuck Tobin, Partner, Ballard Spahr LLP. Moderated by Newsgathering Committee Co-chair Mickey H. Osterreicher."""
full_description = '''HomeEventsCommittee Meetings Committee Meetings Upcoming Events Tuesday, March 4 at 1pm ET / 10am PT Newsgathering Committee Meeting: Controlling White House Press Pool Access – Escalating Tensions A very timely discussion with guests including Guardian US columnist Margaret Sullivan, legal scholar Eugene Volokh, and Chuck Tobin, Partner, Ballard Spahr LLP. Moderated by Newsgathering Committee Co-chair Mickey H. Osterreicher. Wednesday, March 5 at 1pm ET / 10am PT Navigating Immigration Changes / Impact of Immigration-Related Executive Orders on Media Employers Join the Employment Law Committee & Diverse Voices Committee for a timely discussion on the potential impact of recent presidential executive orders addressing immigration on media organizations. Thursday, March 13 at 2pm ET / 11am PT Data Privacy Presentation: Overview of US Law on Restricted Transfers of Sensitive Data In April, a new DOJ rule will restrict transfers of bulk U.S. “sensitive data” to certain “countries of concern,” including China. Marci Rozen (ZwillGen) will examine potential impact of the rule on media companies, including restrictions on using certain pixels & other online advertising technology & newly-required diligence processes for vendor & advertising partner relationships. Past Events Monday, February 24 at 12pm ET / 9am PT Media Deals Committee Meeting Please join us at 9am PT/noon ET on Monday February 24th to welcome our incoming co-chairs, Kristel Tupja and Alex Robbins, and to discuss planning for 2025. Wednesday, February 19 at 1pm ET / 10am PT Criminal Law Committee: Mind Your Digital Footprint / Best Practices in Digital Security for Journalists What journalists need to know about their digital security amid increased threats of subpoenas & seizures of their newsgathering information; the pros & cons of different platforms & apps, settings to watch, & how to know if data has truly been deleted.; & strategies for communications with confidential sources & accessing hacked materials. Tuesday, February 18 at 1pm ET / 10am PT Anti-SLAPP Committee Meeting Matt Schafer on the petition filed by Steve Wynn; Eric Weslander on his pending puppy mill case under the Kansas anti-SLAPP law; Tanvi Valsangikar on Bobulinsk v. Tarlov; Greg Leslie on “fake electors” case; & Laura Prather on Texas Anti-SLAPP fight. Thursday, February 13 at 1pm ET / 10am PT Internet & Technology Law Committee and Media Copyright and Trademark Committee: AI Copyright Litigation — The Latest Developments Join us for a timely discussion on the rapidly evolving landscape of AI copyright litigation. Thursday, February 6 at 1pm ET / 10am PT Sports Committee Meeting A conversation led by Prof. Jodi Balsam of Brooklyn Law School regarding how the new presidential administration will affect the sports industry. Wednseday, January 29 at 12pm ET / 9am PT Employment Committee Meeting Please join the Employment Committee for our first meeting of 2025. We look forward to meeting our new members, catching up with old members and discussing ideas for programming, partnerships, and topics for the coming year. We look forward to seeing you! Tuesday, January 28 at 12pm ET / 9am PT Arbitration 101: Things to Know When Including and Drafting Arbitration Clauses We will be welcoming Mikaël Schinazi, an international arbitration lawyer at Jones Day, based in the Paris office. A member of the New York and Paris bars, Mikaël advises and represents companies, sovereign States, and State-owned entities in high-stakes international disputes. Wednesday, January 22 at 1pm ET / 10am PT Diverse Voices Committee: First Meeting of 2025 In this session, we will do a quick overview of Diverse Voices’ last year of growth, and then pivot to a discussion on potential programming for the year ahead, opportunities for member involvement, and ideas for partnerships and collaboration with other committees. Thursday, January 16 at 3pm ET / 12pm PT Entertainment Law & Copyright Trademark Joint Committee Panel: Copyrighted Content in the Background How have courts addressed claims challenging copyright-protected material that is visible in the background of a film or television program? What about claims involving copyright-protected music that can be heard in the background of a documentary film? Tuesday, January 7 at 10am ET / 7am PT International Committee Meeting: Cross-Border Vetting The International Committee will reprise its annual lively and informative discussion of global pre-publication review. Co-chairs Katharine Larsen of Reuters News and Pia Sarma of News UK will host with discussion to feature Anshika Misra of AZB & Partners (Mumbai) looking at recent developments in India. Thursday, December 19 at 3pm ET / 12pm PT Insurance Committee Meeting & Virtual Holiday Party "Newsrooms are playing Russian Roulette with Libel Insurance;" Safety issues in the wake of the United Healthcare CEO murder; 2024 Developments; Insurance concerns & conditions; 2025 Predictions; How year end & first of the year renewals are going; How payment of year end law firm bills is going; Committee plans & suggestions. Monday, December 16 at 1pm ET / 10am PT Anti-SLAPP Committee Meeting The MLRC Anti-SLAPP Committee's last meeting of the year. With guest speakers: Steve Zansberg of Zansberg Beylkin; Emmy Parsons of Ballard Spahr; Jeff Nye of SSP Law; and Mara Gassmann of the RCFP. Friday, December 13 at 1pm ET / 10am PT Consumer Reviews & Testimonials; “Click to Cancel” & California’s Amended Automatic Renewal Law Analysis of the FTC’s Final Rule on Consumer Reviews & Testimonials, led by Katherine Surprenant of Klaris Law. Plus an overview by Terri Seligman & Kate Patton of Frankfurt Kurnit Klein + Selz of the FTC’s “Click to Cancel” Rule & California’s amended Automatic Renewal Law, including their practical implications & key takeaways for compliance. Tuesday, December 10 at 1pm ET / 10am PT Look Back, Look Ahead with the Employment Committee We catch up with one another and discuss key employment law developments from 2024 such as non-compete agreement challenges and where things currently stand and the influence of federal agencies in shaping employment law after the U.S. Supreme Court’s decision in Loper Bright Enterprises v. Raimondo, and what may be on the horizon for 2025. November 2024 Litigation Committee Meeting: Actual Malice Practice Guide Preview All MLRC members are invited to this exciting preview of the update to MLRC’s Actual Malice Guide. Vedder Price lawyers Blaine Kimrey and Bryan Clark will preview the updated guide, an essential litigation tool, which will be released soon. November 2024 Insurance Committee Meeting Topics to include: Paul Gladder and the closing of the Vett News CX product; impact of recent elections on federal funding for public TV and radio; availability of media liability insurance coverage for claims insurance of disinformation; and more. November 2024 International Committee Meeting: Keeping Journalists Safe — Lessons from Standing with Evan Join committee co-chair Katharine Larsen in conversation with Jake Goldstein and Craig Linder, the in-house lawyers at Dow Jones who handled the Evan Gershkovich illegal detention and dramatic release, as they focus on the crucial issue of safety of journalists. October 2024 Tackling Disinformation in Elections and Synthetic Data Ginny Badanes (Microsoft Democracy Forward) & Jenni Katzman, (Microsoft US Govt. Affairs) discuss work Microsoft & the tech sector have undertaken to drive awareness of deepfakes & influence campaigns, align commitments for responsible AI use in elections, & develop standards that allow digital consumers to track & authenticate online content as synthetic data generation increases. October 2024 Sports Committee Meeting Turner Broadcasting/Warner Bros. Discovery’s lawsuit for breach of contract against the NBA for failure to adhere to the Right of First Refusal clause in the parties’ media rights agreement; & MLB Players Inc.’s lawsuits against sports betting companies regarding the improper usage of MLB players’ name, image, & likeness rights to promote online sportsbooks. October 2024 Insurance Committee Meeting Baby Reindeer case; Video sync claims; Defamation or Intellectual Property claims regarding political content; New trends and developments in insurance so far in 2024; Insurance Committee plans and committee member suggestions for the remainder of 2024. October 2024 The New Legislative Model Designed to Limit Recording Police The Diverse Voices, Criminal Law, and Newsgathering Committees discuss the new template for legislation states are using to pass laws designed to limit the ability to record police in public. With Grayson Clary (RCFP), Alanah Odoms (ACLU of Louisiana), & Mickey Osterreicher (NPPA). October 2024 Employment Law Committee Meeting A roundtable discussion on thorny labor law related topics led by Kai Falkenberg, General Counsel at The Guardian US. September 2024 Internet & Tech Law Committee Meeting: Balancing the Risk of Disinformation Barbara McQuade, University of Michigan Law School professor, MSNBC legal analyst, and former U.S. attorney for the Eastern District of Michigan will join us to discuss the proliferation of misinformation and disinformation and how to weigh the challenges and possible strategies for balancing the concerns of regulating the internet. September 2024 Next Gen General Body Meeting On the Agenda: 2024 survey results; our priorities moving into 2025; and future events including upcoming panels and social events! September 2024 Media Copyright & Trademark Committee Meeting: Hachette v Internet Archive The 2nd Circuit’s recent decision in Hachette Book Group, Inc. et al. v. Internet Archive affirmed the grant of summary judgment to 4 book publishers in their infringement suit against the Internet Archive concerning its “Free Digital Library” program. What does it mean for the fair use doctrine, AI, & copyright law in general? September 2024 AI and Political Advertising | Advertising & Legislative Affairs Committees Lauren Feiner, senior policy reporter (The Verge), Larry Huynh, President (American Association of Political Consultants), & Kate Belinski, partner (Ballard Spahr LLP) discuss AI in political advertising, including deepfakes & the threat to elections, how campaigns are thinking about AI, & efforts by states to regulate the use & disclosure of AI in advertising. August 2024 MLRC California Chapter August Meeting Can you SLAPP an idea theft claim? And can you really get sued for reproducing a centuries-old work of art in your own creative work? Join the MLRC California Chapter to discuss these two hot questions. August 2024 Republican & Democratic National Conventions: Election Access & Security Concerns (Part 2) In part 2, State Legislative Affairs and Criminal Law committees will recap access to the RNC, look ahead to the DNC kicking off in Chicago on August 19, including the CPD's latest plans to handle protestors & journalists, & invite discussion on access concerns heading into the November elections. August 2024 Anti-SLAPP Laws in Pennsylvania, Minnesota & Maine On the agenda: reports on the recently enacted anti-SLAPP laws in Pennsylvania, Minnesota and Maine. All are welcome! August 2024 Pre-Pub / Pre-Broadcast Committee Panel: AI in the Newsroom How newsrooms are utilizing AI right now; Possible benefits of this innovation as well as causes for concern; How newsrooms can best educate themselves about AI tools; Navigating how to disclose AI usage to the public; & how to protect journalism from outside use of AI—i.e., deepfakes, scraping, etc. July 2024 Tech Law 101 Tech Law 101 will provide a broad overview of the hottest issues right now in technology law, covering three topics: The Communications Decency Act (“CDA”) Section 230; regulation & litigation surrounding content moderation; & generative AI. July 2024 Media Law 101: Entertainment This presentation covers basic but important issues to be aware of in the entertainment law world, including issues relating to the use of materials subject to copyright and trademarks, the risks involving references to real people and things, how best to use and rely upon releases and disclaimers, and more. July 2024 Media Law 101: Newsgathering New to newsgathering or need a refresher? This seminar addresses best practices for gathering news in public and private spaces. The presentation will touch on issues presented when working with confidential sources, reporting on social media, recording audio and video and much more! July 2024 Sports Committee Inaugural Meeting: Paris Olympics Committee co-chairs Christopher Chase and Steve Smith lead a discussion about Rules 40 and 50 of the Olympic Charter (which govern sponsor’s references to “Olympic-related terms” and athletes’ rights to free expression); handling legal disputes at the Games; and U.S. arbitrations over making the team. Guest speaker: Bob Latham of Jackson Walker. July 2024 Movement Journalism A discussion on legal and ethical concerns related to movement journalism, led by Diverse Voices committee member Samantha Hamilton. July 2024 Media Law 101: Pre-Publication / Pre-Broadcast A rollicking introduction to the pitfalls and joys of getting everything from investigations to celebrity news out into the world in a time of eye-popping judgments. Aimed at summer associates, junior associates, or anyone looking for a bird's eye view of our practices. We have a vetting hypothetical that will help guide our discussions. July 2024 Republican & Democratic National Conventions: Election Access & Security Concerns (Part 1) Join the State Legislative Affairs and Criminal Law Committees for part one of a two-part series on access and security concerns ahead of the conventions. June 2024 Anti-SLAPP Committee Meeting Dr. Chelsea B. Polis and her attorney Dori Hanswirth on a SLAPP suit filed against Dr. Polis in retaliation for her publicly identifying false data claims by a tech company offering birth control products; and Matt Schafer, Laura Prather and Bruce Rosen on recent SLAPP victories. All are welcome! May 2024 Diss Tracks & Defamation: Diverse Voices & Entertainment Committees Joint Meeting Kendrick Lamar and Drake recently released rapid fire diss tracks that became increasingly serious, including allegations of domestic violence, pedophilia, & secret children. Though unlikely, a defamation suit isn’t out of the question. Adam Rich covers the hurdles these two public figures may face if they decide to take their battle to the courtroom. May 2024 Newsgathering 201 Are you a working practitioner who wants a more in-depth dive into newsgathering issues? Join the Newsgathering Committee & Kristi Ramsay (Senior Counsel, CNN) to cover hypotheticals involving ethical & legal issues that journalists face & how counsel may advise them. May 2024 Advertising & Commercial Speech: Influencer Marketing The importance of crafting contracts with influencers; main '''
year_published = 2024
year_updated = 2024
