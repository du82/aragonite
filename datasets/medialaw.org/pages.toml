["https://medialaw.org/job-listing/attorney-sourcebooks-penguin-random-house"]
title = "Attorney, Sourcebooks / Penguin Random House - Media Law Resource Center"
description = "Sourcebooks/Penguin Random House is looking for a knowledgeable, proactive, business-minded and self-motivated attorney to join its legal team working with Sourcebooks based out of Naperville, Illinois. This position will interface directly with Sourcebooks’ publishing and business teams, counseling clients on various legal and commercial risks related to media, intellectual property and general business issues. The..."
full_description = "Attorney, Sourcebooks / Penguin Random House Sourcebooks/Penguin Random House is looking for a knowledgeable, proactive, business-minded and self-motivated attorney to join its legal team working with Sourcebooks based out of Naperville, Illinois. This position will interface directly with Sourcebooks’ publishing and business teams, counseling clients on various legal and commercial risks related to media, intellectual property and general business issues. The ideal candidate will assist the Legal team’s efforts to partner strategically with the company’s publishing and business units, acting as a general business and legal advisor and consulting resource to help facilitate the client’s publishing and business objectives. This position will be in the office, in Naperville, 2-3 days per week. The salary range for this role is $130,000 to $170,000 (salarly will commensurate with experience). Key Responsibilities: Conduct pre-publication review of non-fiction and fiction books and associated promotional materials Counsel clients on intellectual property matters including copyright and trademark, and media-related matters including defamation, privacy, access and other First Amendment issues Identify and analyze legal issues, help determine business terms and structure transactions, and provide advice to colleagues that balance business objectives and legal risks Work on a variety of media related matters, including claims handling and litigation support Assist in and ultimately work independently on the review, drafting and negotiation of a variety of contracts including licensing agreements, consulting agreements, vendor agreements, and technology agreements, as needed Provide strategic, legal and business advice and counsel on tight timelines to business units and senior management on wide array of legal and business issues, including business risks, contract interpretation, and other issues Assist in compliance efforts including providing training and presentations to business units as necessary Support the Legal team in addressing new or special projects that arise with the evolving needs of the business Requirements: J.D. from a top A.B.A. accredited law school. Admitted and member in good standing with at least one U.S. State Bar 3-6 years of relevant in-house law department and/or law firm experience (in-house experience a plus) Exceptional writing, drafting and communication skills Highly analytical with exceptional business and legal issue identification, creativity and problem-solving skills Practical, business-oriented and creative problem solver who can deliver clear, strategic advice to clients in a timely manner Ability to operate autonomously while being a team player who brings a positive, “can do” attitude to the workplace and works collaboratively with other members of the Legal team and with clients Results-oriented with excellent time management and work prioritization skills Familiarity with digital technologies and related legal issues including intellectual property, data privacy and business models a plus Must be flexible with the ability to manage multiple projects simultaneously and operate in a faced paced entrepreneurial environment Detail-oriented, organized, efficient and resourceful with strong follow-through skills Excellent interpersonal skills & the ability to work effectively with employees at all levels and establish strong client relationships Our culture demands driven, energetic thinkers who possess leadership qualities and the desire for aggressive personal growth. If you possess these qualities, we encourage you to apply. Please send your resume and a cover letter outlining your experience and interest in the position. Only those including cover letters and salary requirements will be considered. For more information and to apply, click here."
