full_description = "All Articles Everything MLRC has published, in any publication, since 2017. recently published Nov 2024 Ten Questions to a Media Lawyer David Hosp Boston lawyer on his start in media law, important cases, his sideline as an author of legal thrillers, watching family perform at Lollapalooza and more. TOPICS : Career Development, MLRC News Nov 2024 2024 DCS Committee Reports MLRC Defense Counsel Committees file brief reports on last year's meetings, publications and special events, and look ahead to 2025. TOPICS : MLRC News Nov 2024 DCS Annual Meeting On November 7, 2024, MLRC held its Annual Defense Counsel Section Meeting at the offices of Patterson Belknap in New York. TOPICS : MLRC News Nov 2024 MLRC 2024 Annual Meeting The Annual Meeting of the Media Law Resource Center, Inc. was held on November 6, 2024, at Gotham Hall in New York. TOPICS : MLRC News Nov 2024 Florida Court Denies Sheriff’s Motion to Close Courtroom Sarah Papadelias The Court found that the Sheriff had “failed to articulate any basis … to shield the video from public view or to exclude the media from the pretrial detention hearing.” TOPICS : Access / FOIA, Government Records Nov 2024 Right to Access Juvenile Records Blooms in Ohio Supreme Court Jack Greiner In a recent case, the Ohio Supreme Court ruled that an Ohio statute that mandated sealing the records of a juvenile proceeding upon a finding of non-delinquency violated the Open Courts provision of the Ohio Constitution. TOPICS : Access / FOIA, Government Records Nov 2024 Federal Court Enjoins California Ban on Deepfake Election Parodies Matt Kristoffersen Plaintiff Christopher Kohls, who has produced ostensibly humorous, computer-manipulated videos like Kamala Harris making statements that she is “the ultimate diversity hire,” argued that the law is an overbroad, content-based restriction on speech — and that it inappropriately limits false statements about the government. Judge Mendez agreed. TOPICS : First Amendment Nov 2024 Supreme Court Vacates and Remands Fifth Circuit Decision in Case Involving Retaliatory Arrest Emily Hockett This summary decision, taken together with the Supreme Court’s per curiam decision in Gonzalez, suggest that retaliatory arrest claims can be maintained regardless of probable cause if a plaintiff can show objective evidence that officials rarely, if ever, enforce the law at issue in similar circumstances. TOPICS : Newsgathering Nov 2024 Threats to the Media in the Second Trump Term George Freeman While we can also draw on his first term as a guide, the sad truth is that this second administration is likely to be far worse and far more hostile to the press and to First Amendment values: He’s learned from his first four years; he will only have yes-men surrounding him, no experts and… TOPICS : Defamation, First Amendment, MLRC News, Newsgathering Oct 2024 Third Circuit Cites First Amendment to Limit § 230 Protection Jeff Hermes In its opinion in Anderson v. TikTok, the Third Circuit held that Section 230 offers no protection for the sua sponte recommendation of content by social media platforms. TOPICS : Digital Media, Section 230 Oct 2024 Court Applies Rogers v. Grimaldi to Dismiss Trademark Case Over Book Cover and Use of Photographs Elizabeth Schilken In a ruling reaffirming the vitality of the Rogers v. Grimaldi test on motions to dismiss, a federal judge has dismissed a lawsuit alleging the bestselling memoir Surviving to Drive, authored by Formula 1 racing figure Guenther Steiner, infringed the trademarks of a corporate sponsor. TOPICS : Intellectual Property, Trademark Oct 2024 Publishers Win Anti-SLAPP Motion and Fee Award in Lawsuit Over Book Cover David Aronoff and Josh Bornstein The lawsuit involved claims by plaintiff Patrick Wizmann, who alleged that a statement written on the dust jacket of the book Dreams Don’t Die is allegedly false and misleading. TOPICS : Anti-SLAPP, Defamation Oct 2024 Court Dismisses Libel Claim by Former Nonprofit Leader Accused of Bad-Boss Behavior Matthew S.L. Cate and Alia L. Smith A former executive director of a non-profit research group focused on gender equality failed to state a libel claim arising from an article about her embattled leadership and working conditions during her tenure, a district court judge ruled in September. TOPICS : Defamation, Truth Oct 2024 Court Dismisses Defamation Claims Brought By Buffalo Strip Club Owner Daniela Abratt-Cohen A Buffalo strip club owner who alleged he had been defamed by news articles about his arrest cannot proceed with his claims after a Miami judge ruled that the reporting at issue was substantially true, privileged as an official report, and protected by the wire service defense. TOPICS : Defamation, Truth Oct 2024 London Conference a Resounding Success with Engaging Panels, Fun Receptions George Freeman MLRC executive director on the various panels and parties constituting MLRC's latest biennial London Conference. TOPICS : MLRC News Oct 2024 NH Court Rules Union Leader Op-ed “Merely Expressive Rhetoric … Not Designed to Assert Factual Allegations” William L. Chapman Op-ed charged plaintiff with supporting white supremist ideology. TOPICS : Defamation, Opinion Oct 2024 Brett Favre’s Defamation Suit Gets Sacked by Fifth Circuit Mark Fijman The court concluded that Mississippi defamation law protected Sharpe’s pointed commentary as non-actionable opinion based on disclosed factual premises. TOPICS : Defamation Sep 2024 Ten Questions to a Media Lawyer Jennifer Dukarski Michigan lawyer on notable cases, the future of AI, karaoke picks, and more. TOPICS : Career Development Sep 2024 Government Contractors Must Respond to Public Record Requests, Georgia Supreme Court Rules Peter Canfield On August 13, 2024, the Supreme Court of Georgia unanimously reaffirmed the public’s right under Georgia law to demand records from state and local agencies’ private contractors. TOPICS : Access / FOIA, Government Records Sep 2024 Minnesota Court of Appeals Enjoins Trial Court from Enforcing Prior Restraint Orders Against Broadcast Station Isabella Salomão Nascimento The appellate court’s order enjoined the trial court judge from enforcing a pair of orders that prohibited a local television station from reporting on a document it legally obtained from the online court docket and that went so far as to require the document’s destruction. TOPICS : Prior Restraint « Prev12345...Next »163 Our most recent issues MediaLawLetter February 2025 Feb 2025 MediaLawLetter January 2025 Jan 2025 MediaLawLetter December 2024 Dec 2024 Articles & Reports – Newsgathering Committee – MLRC Panic Book Dec 2024 MediaLawLetter November 2024 Nov 2024"
