full_description = "HomeMLRC PublicationsMediaLawLetter MediaLawLetter The MediaLawLetter is the leading professional news source for developments in media law and policy, with reports on decisions and statutory developments. 2025 Feb 2025 MediaLawLetter February 2025 Reporting developments through February 28. Jan 2025 MediaLawLetter January 2025 Texas Free-Speech Advocates Gear Up for Another Anti-SLAPP Fight; Fox News SLAPPs Defamation Suit, Wins Attorney Fees; Court Dismisses Implied Defamation Claims Brought by Former NY Philharmonic Musician; Ninth Circuit Opens Up Possibility of Copyright Protection for Kinetic Sculpture; and more. 2024 Dec 2024 MediaLawLetter December 2024 TikTok Falls Under the Long Shadow of Holder; Sarah Palin’s Second Chance to Try Libel Case Against The New York Times Set for April; Second Circuit Affirms Dismissal of Defamation Case Against Newsweek; ten questions for Florida lawyer Mark Caramanica and more. Nov 2024 MediaLawLetter November 2024 Threats to the Media in the Second Trump Term; Supreme Court Vacates and Remands Fifth Circuit Decision in Case Involving Retaliatory Arrest; Federal Court Enjoins California Ban on Deepfake Election Parodies; MLRC Annual Dinner; Ten Questions for David Hosp and more! Oct 2024 MediaLawLetter October 2024 Favre’s Defamation Suit Sacked by Fifth Circuit; Publishers Win Anti-SLAPP Motion and Fee Award in Lawsuit Over Book Cover; Third Circuit Cites First Amendment to Limit § 230 Protection; London Conference Recap, and more. Aug 2024 MediaLawLetter August 2024 Analyst Report and New York Times Article About Crypto Crash Not Defamatory; Pennsylvania Enacts Anti-SLAPP Statute; “Vanderpump Rules” Revenge Porn Lawsuit May Proceed, Judge Rules; First Amendment Threats from a Second Trump Term; Ten Questions for Ballard's Mike Berry and more. Jul 2024 MediaLawLetter July 2024 NetChoice v. Moody: A Strong Statement of 1A Rights, But Devil is in the Details; Media Supports Citizen Journalist in SCOTUS Qualified Immunity Case; Fox News Dismissed from Lawsuit with Public Apology; MLRC Conferences in Dublin and Sydney; Ten Questions for Freedom Forum's Kevin Goldberg and more. Jun 2024 MediaLawLetter June 2024 NRA v. Vullo: The Supreme Court on Government Coercion and the First Amendment; Defamation Claims Against ProPublica and Houston Chronicle Dismissed; False Light Claim Against New York Magazine Over “The Case of the Fake Sherlock” Dismissed; Supreme Court Provides for Broader Availability of Damages in Copyright Suits; Ten Questions for DWT'S Kate Bolger and more. May 2024 MediaLawLetter May 2024 Montana Supreme Court Applies N.Y. Fair Report Privilege to Dismiss Libel Claim; Louis Farrakhan’s $4.8 Billion Defamation Lawsuit Against Jewish Groups Dismissed; Top Gun Lawsuit Shot Down; No Cameras in the Courtroom for Trump Trial; Ten Questions for CNN's Drew Shenkman and more. Apr 2024 MediaLawLetter April 2024 DC Court Holds Journalist in Contempt for Refusing to Disclose Confidential Sources; Court Quashes Prosecution Subpoena to New Yorker Journalist; The Supreme Court Rules on Social Media Blocking; Entertainment Conference Recap; Ten Questions for Aussie Lawyer Michael Cameron and more. left_arrow_default 1 2 3 … 69 70 71 Next right_arrow_default"
