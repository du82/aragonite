full_description = "HomeIntellectual PropertyCopyright Copyright Jan 2025 Ninth Circuit Reverses Copyright Lawsuit Against Aritzia, Opening Up Possibility of Copyright Protection for Kinetic Sculpture Rachel Oh The Ninth Circuit noted that “copyrightability of kinetic and manipulable sculptures” is “an area of copyright law that has not yet received much attention” and “may be better informed with a more complete factual record.” TOPICS : Copyright, Intellectual Property Sep 2024 George Santos Loses Cameo Copyright Case Raphael Holoszyc-Pimentel, Eric Feder, and Nathan Siegel Santos sued after the show Jimmy Kimmel Live! used short videos of Santos saying absurd things in exchange for money on the site Cameo—videos that Kimmel allegedly tricked Santos into making. The defendants moved to dismiss Santos’ complaint on the grounds that they made a fair use of Santos’ videos. TOPICS : Copyright, Intellectual Property Aug 2024 Copyright Law Used to Deny Access to Covenant School Shooter’s Manifesto Douglas R. Pierce TOPICS : Access / FOIA, Copyright, Government Records Jun 2024 Federal Court Holds That Copyright Act Preempts X’s Web Scraping Claims Jeremy Goldman In a blockbuster ruling that is bound to have far-reaching implications, including in the swarm of copyright infringement cases brought against AI platforms, a California federal court recently dismissed a complaint that X Corp. brought against web scraping company Bright Data. TOPICS : Copyright, Digital Media, Intellectual Property Jun 2024 Supreme Court Provides for Broader Availability of Damages in Copyright Suits Sean M. Callagy and Bridgette C. Gershoni The Supreme Court issued a 6-3 decision in Warner Chappell Music, Inc. v. Nealy, No. 22-1078, holding that damages are available under the Copyright Act for acts of infringement that predate the initiation of suit by more than three years. TOPICS : Copyright, Intellectual Property May 2024 Top Gun Lawsuit Shot Down Matt Kristoffersen The 1983 magazine article “Top Guns” and Paramount Pictures’ recent blockbuster movie Top Gun: Maverick are not substantially similar under copyright law, a California federal judge ruled this month. TOPICS : Copyright, Intellectual Property Mar 2024 Supreme Court, Second Circuit Consider Copyright Infringement Statute of Limitation Implications Gillian Vernick Neither case squarely presented the question of when a copyright claim ‘accrues,’ understood by many federal circuits as when the copyright owner first “discovers” the allegedly infringing use. However, the challenges that both cases raise about the discovery rule’s application may hint at its potential impermanence. TOPICS : Copyright, Intellectual Property Mar 2024 Fourth Circuit Rules Against News Org’s Use of Ted Nugent Photograph Jamie Ehrlich and Cynthia A. Gierhart The Fourth Circuit ruled that a news organization’s use of a photograph of musician Ted Nugent did not constitute fair use, siding with the photographer who argued that the news organization did not alter or add any new expression required to overcome the requirements for proper attribution. TOPICS : Copyright, Intellectual Property Dec 2023 Federal Court Dismisses Copyright Lawsuit Against Friends, Sex and the City, Other Shows Elizabeth A. McNamara and Meenakshi Krishnan The Court found that no lay observer could find any substantial similarities between the protectible material of Lee’s work and the four shows. TOPICS : Copyright, Idea Theft, Intellectual Property Nov 2023 California Federal Court Grants Summary Judgment for Defendants in Ad Astra Copyright / Idea Theft Case David Aronoff and Josh Bornstein Plaintiff alleged that Ad Astra infringed his copyright in and stole ideas from his unproduced spec screenplay entitled Cosmic Force. However, in granting summary judgment the Court ruled that these claims failed to raise genuine issues warranting a trial. TOPICS : Copyright, Idea Theft, Intellectual Property left_arrow_default 1 2 3 … 18 19 20 Next right_arrow_default"
