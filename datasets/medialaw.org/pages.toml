description = "The Reporters Committee for Freedom of the Press is seeking an attorney with at least 12 years of experience to serve as its Local Legal Initiative (LLI) Director. This position presents a unique opportunity to help oversee a mission-driven legal team working to provide direct legal services to support state and local journalism across the..."
full_description = "Local Legal Initiative Director, RCFP The Reporters Committee for Freedom of the Press is seeking an attorney with at least 12 years of experience to serve as its Local Legal Initiative (LLI) Director. This position presents a unique opportunity to help oversee a mission-driven legal team working to provide direct legal services to support state and local journalism across the United States. The LLI Director will work closely with and be responsible for assisting the Vice President of Legal Programming in managing the Reporters Committee’s LLI legal portfolio, including developing and implementing LLI program priorities, and overseeing RCFP attorney development, and legal fellowship and summer legal intern hiring.Experience representing journalists and news organizations in matters involving access to judicial records/proceedings, freedom of information, libel, and other newsgathering and First Amendment matters, is required. View the full job posting and apply."
