full_description = "HomeDefamationTruth Truth Dec 2024 Second Circuit Affirms Dismissal of Defamation Case Against Newsweek Cameron Stracher and Sara Tesoriero The Second Circuit has affirmed the dismissal of a defamation claim against Newsweek on substantial truth and fair report grounds. TOPICS : Defamation, Fair Report & Other Privileges, Truth Dec 2024 Defamation Suit Over Nancy Grace True Crime Show and Podcast Dismissed Mary Ellen Roy and Elana Beiser Considering the allegedly defamatory statements as a whole in the context in which they were made, the Court held that they are not defamatory because they are not “of and concerning” the Plaintiffs, are substantially true, and/or are opinion on disclosed facts. TOPICS : Defamation, Truth Oct 2024 Court Dismisses Libel Claim by Former Nonprofit Leader Accused of Bad-Boss Behavior Matthew S.L. Cate and Alia L. Smith A former executive director of a non-profit research group focused on gender equality failed to state a libel claim arising from an article about her embattled leadership and working conditions during her tenure, a district court judge ruled in September. TOPICS : Defamation, Truth Oct 2024 Court Dismisses Defamation Claims Brought By Buffalo Strip Club Owner Daniela Abratt-Cohen A Buffalo strip club owner who alleged he had been defamed by news articles about his arrest cannot proceed with his claims after a Miami judge ruled that the reporting at issue was substantially true, privileged as an official report, and protected by the wire service defense. TOPICS : Defamation, Truth Jul 2024 NY Appellate Court Affirms Dismissal of Claims and Award of Attorney’s Fees in Favor of Media Karim A. Abdulla TOPICS : Anti-SLAPP, Defamation, Truth Jun 2024 Newsweek Wins Dismissal on Substantial Truth Cameron Stracher and Sara Tesoriero Judge Buchwald held that technical inaccuracies in Newsweek’s reporting about a guilty plea entered by Plaintiff Olivet University did not give rise to a defamation claim where the gist of the allegedly defamatory statement was substantially true. TOPICS : Defamation, Truth Jun 2024 Houston Appeals Court (Finally) Dismisses Defamation Claims Against ProPublica and Houston Chronicle Reid Pillifant In its decision, the First District Court of Appeals in Houston found that Defendants’ reporting on the plaintiff’s career as a heart surgeon and the concerns that had been raised about some of his practices and procedures, as well as his failure to follow protocols in clinical trials, was substantially true. TOPICS : Anti-SLAPP, Defamation, Truth Oct 2023 NBCUniversal Wins Dismissal of January 6 Activist’s Defamation Complaint Natalie J. Spears, Samuel Fifer, Gregory R. Naron and Jessica Laurin Meek In a strongly worded opinion, Judge Bataillon of the District of Nebraska granted NBCU’s motion to dismiss with prejudice on substantial truth grounds. TOPICS : Defamation, Truth Aug 2023 Colorado Court Grants Anti-SLAPP Motions of Media Defendants Sued for Reporting on Health Company Fallout With State Steve Zansberg and Lauren Russell On August 15, a trial judge in Arapahoe County, Colorado became the fourth state jurist to dismiss libel claims against media companies applying Colorado’s anti-SLAPP Act, passed into law in 2019. TOPICS : Anti-SLAPP, Defamation, Truth Aug 2023 Article Tying Nursing Home Magnate to Human Trafficking, Medicaid Fraud & Elder Abuse Protected As Fair Report, True, and Opinion Alia Smith Judge Azrack held that the challenged statements – concerning the poor quality of some of Landa’s nursing homes and alleged financial and other improprieties – were fair reports under N.Y. Civil Rights Law § 74, were substantially true, or were non-actionable opinions. TOPICS : Defamation, Fair Report & Other Privileges, Opinion, Truth left_arrow_default 1 2 3 … 10 11 12 Next right_arrow_default"
