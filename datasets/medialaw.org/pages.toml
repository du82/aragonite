full_description = "HomePrivacy Privacy Jan 2025 Defamation Lawsuit against Baby Reindeer Survives Motion to Dismiss Rachel Oh The court held that plaintiff, Scottish law graduate Fiona Harvey, sufficiently pled that the series was “of and concerning” her and published with actual malice. Key to the court’s ruling was an opening title card stating “this is a true story” which it found outweighed a disclaimer at the end of each episode that the… TOPICS : Defamation, Emotional Distress, Right of Publicity Dec 2024 Australia Adopts Statutory Tort for Serious Invasions of Privacy Patrick Considine and Peter Bartlett This new cause of action empowers individuals to sue another person or entity where that person or entity invaded the individual’s privacy by intruding upon their seclusion or misusing information relating to them. TOPICS : International, Privacy Aug 2024 “Vanderpump Rules” Revenge Porn Lawsuit May Proceed, Judge Rules Matt Kristoffersen Judge Crowley reasoned that Madix did not have her boyfriend’s consent to access the contents of his phone. TOPICS : Anti-SLAPP, First Amendment, Privacy Jun 2024 Court Dismisses False Light Claim Against New York Magazine Over “The Case of the Fake Sherlock” Kaitlin Gurney, Chad Bowman, and Isabella Salomão Nascimento In a decision reaffirming the Third Circuit’s actual malice pleading requirement, a Pennsylvania judge granted Vox’s motion to dismiss a renowned armchair detective’s false light invasion of privacy claim. TOPICS : False Light, Privacy May 2024 With the ELVIS Act, Tennessee Shows its Burning Love for Recording Artists David Zeitlin and Robb Harvey Tennessee, home to both Music City® (Nashville) and the Blues (Memphis), has taken a swing at regulating generative AI’s potential harm to musicians and recording artists. TOPICS : Intellectual Property, Right of Publicity, Section 230 Mar 2024 Jury Awards $25M in Damages, Including $20M in Punitive Damages, for The Oklahoman’s Misattribution of Racial Slur Michael Norwick Actual malice finding and massive punitive award comes notwithstanding the Gannett-owned newspaper’s correction of the error within two and a half hours. TOPICS : Defamation, Emotional Distress Jan 2024 Lawsuit Over Alleged CIA Spying on Assange Visitors May Proceed in Part Matt Kristoffersen Four Americans may now proceed with their lawsuit against the Central Intelligence Agency for allegedly copying data from their devices while visiting Wikileaks founder Julian Assange. TOPICS : Audio/Videotaping, Newsgathering, Privacy Dec 2023 Another Unconstitutional Defamation Bill Proposed in Florida Jim Lake Proposed 2024 legislation would penalize use of anonymous sources and codify the ability of defamation plaintiffs to sue anywhere in the state for speech posted online. TOPICS : Defamation, Privacy Nov 2023 Defamation Action Against The National Enquirer Dismissed on Summary Judgment Robert S. Gutierrez After more than three years of litigation with three successive law firms, talent manager Michael Sanchez’s defamation action against the National Enquirer was dismissed on summary judgment in August by Judge Dolly Gee. Yet it was not until October that the storied lawsuit was officially over. TOPICS : Defamation, Emotional Distress Oct 2023 Utah State Records Panel Rules that Public Universities Must Disclose NIL Contracts Jeffrey J. Hunt and Maria J. DeMarco A government body — perhaps for the first time — has ruled that name, image, and likeness contracts that college athletes submit to public universities are public records and not protected from disclosure under the Family Education Rights and Privacy Act (FERPA). TOPICS : Access / FOIA, Privacy, Right of Publicity left_arrow_default 1 2 3 … 23 24 25 Next right_arrow_default"
