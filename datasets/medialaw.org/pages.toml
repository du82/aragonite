full_description = "HomeFirst Amendment First Amendment Jan 2025 Truth, Information Quality, and the Increasingly Complex Work of the MLRC Jeff Hermes The value of truth is not always as useful a signpost as it once was when thinking about the First Amendment. TOPICS : First Amendment, MLRC News Dec 2024 TikTok Falls Under the Long Shadow of Holder Jeff Hermes This case presents what I have started to think about as a First Amendment checksum error: If you interpret the First Amendment as not only permitting but actually justifying greater government control over the content of speech, then you know there is an error in your analysis even if you can’t pinpoint it. TOPICS : Digital Media, First Amendment Nov 2024 Federal Court Enjoins California Ban on Deepfake Election Parodies Matt Kristoffersen Plaintiff Christopher Kohls, who has produced ostensibly humorous, computer-manipulated videos like Kamala Harris making statements that she is “the ultimate diversity hire,” argued that the law is an overbroad, content-based restriction on speech — and that it inappropriately limits false statements about the government. Judge Mendez agreed. TOPICS : First Amendment Nov 2024 Threats to the Media in the Second Trump Term George Freeman While we can also draw on his first term as a guide, the sad truth is that this second administration is likely to be far worse and far more hostile to the press and to First Amendment values: He’s learned from his first four years; he will only have yes-men surrounding him, no experts and… TOPICS : Defamation, First Amendment, MLRC News, Newsgathering Sep 2024 Court SLAPPs County’s Suit to Restrain Publication of Text Messages Linda Riedemann Norbut In a significant victory for press freedom and a reaffirmation of First Amendment protections, a Florida court recently dismissed a lawsuit filed by Escambia County seeking to compel the return of text messages from County Commissioner Jeff Bergosh’s personal phone. TOPICS : First Amendment, Prior Restraint Sep 2024 9th Circuit Affirms Dismissal of Claimed Censorship Case Against Facebook and Fact-Checking Organizations Brought by RFK, Jr. Group Daniela Abratt-Cohen The Court held the district court properly dismissed a case filed by Children’s Health Defense, a nonprofit organization founded by Robert F. Kennedy, Jr., that advocates against vaccines, finding that it failed to a state a claim that fact-checks, and other restrictions, regarding its ability to post and fundraise on Facebook violated the First Amendment… TOPICS : Digital Media, First Amendment, Section 230 Sep 2024 Stars and Stripes and the Union Jack George Freeman MLRC Executive Director on how flag burning could influence the presidential election; and ponders just what makes London, site of the upcoming MLRC Conference, such an unusually pleasurable city. TOPICS : First Amendment, MLRC News Aug 2024 First Circuit Denies Qualified Immunity in First Amendment Retaliation Case Marc J. Randazza The decision in Berge v. Sch. Comm. of Gloucester, (1st Cir. July 15, 2024), underscores the robustness of free speech protections and marks a rare application of an exception to qualified immunity where the public official’s acts were obviously unconstitutional. TOPICS : First Amendment Aug 2024 “Vanderpump Rules” Revenge Porn Lawsuit May Proceed, Judge Rules Matt Kristoffersen Judge Crowley reasoned that Madix did not have her boyfriend’s consent to access the contents of his phone. TOPICS : Anti-SLAPP, First Amendment, Privacy Aug 2024 Beware the Attacks on the First Amendment by a Trump Presidency George Freeman The MLRC stands ready to help in whatever way it can. TOPICS : First Amendment, MLRC News left_arrow_default 1 2 3 4 5 6 Next right_arrow_default"
