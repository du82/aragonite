title = "MLRC Bulletin Archives - Media Law Resource Center"
description = "Supreme Court and First Amendment Developments\t\tFree Speech and Media Law in the Supreme Court’s 2022-2023 Term; Warhol Foundation v. Goldsmith Roundtable Discussion; Free Speech in the “Free State”"
full_description = "HomeMLRC PublicationsMLRC Bulletin MLRC Bulletin The Bulletin is an in-depth journal on media law developments and trends, including regularly updated studies of media libel, privacy and related trials. 2023 Jul 2023 Supreme Court and First Amendment Developments Free Speech and Media Law in the Supreme Court’s 2022-2023 Term; Warhol Foundation v. Goldsmith Roundtable Discussion; Free Speech in the “Free State” 2022 Dec 2022 Year End Articles Satire and Political Cartoons by Roslyn A. Mazer and Terry Anderson; The Internet Has Failed Us as a Society: A Debate featuring barristers Gavin Millar KC and Hugh Tomlinson KC, Professor Jane Kirtley, and Times columnist Hugo Rifkind; Actual Malice, Ariel Sharon, and the Future of the Right to be Wrong by Denver Nicks Dec 2022 Best of the MLRC Zoom Series 2022 Q&A's with Judge Michael Luttig, Professors Eric Goldman and Amy Gajda, and legendary journalists Ted Koppel and Ken Aulleta. Mar 2022 New York Times v. Sullivan: The Case for Preserving an Essential Precedent MLRC has asked multiple experts to examine each of the major contentions that undergird the Justices’ calls for Sullivan to be revisited. Collectively, they make an unassailable case that Sullivan’s rendition of the First Amendment-based limitations on libel law was correct when the case was decided and that it remains equally correct today. 2021 Dec 2021 Conversations with First Amendment Scholars 2021 Conversations with Professor Cass Sunstein; Professor Nadine Strossen (former President of the ACLU); University of Missouri Law School Dean Lyrissa Lidsky; and author and Davis Wright Tremaine partner Robert Corn-Revere. Oct 2021 Emerging Trends in Applying the Rhetorical Hyperbole Defense Dan Novack, Clay Calvert and others on rhetorical hyperbole as a defamation defense. Jun 2021 Bulletin 2021: Legal Frontiers in Digital Media EU Regulation of Digital Services; Social Media Blocking by Govt Officials; Meta’s Oversight Board at Six Months; Managing Compliance with State Privacy Laws; Will Constitutional Roadblocks and a Lack of Consensus Stall Section 230 Reform? 2020 Dec 2020 MLRC Bulletin 2020 Issue 3 “Conversations with Journalists,” is a compilation of discussions we had with some of our county’s most celebrated reporters, editors and opinion writers, including: Bob Woodward, Maggie Haberman, Nick Kristof, Len Downey, and Emily Bazelon. Nov 2020 MLRC Bulletin 2020 Issue 2 Q&A with top legal scholars discussing their work, particularly as it relates to freedom of speech and of the press. Eugene Volokh, Lee Bollinger & Geoffrey Stone, Tim Wu, Jamal Greene, RonNell Anderson Jones and Erwin Chemerinsky Jul 2020 MLRC Bulletin 2020 Issue 1 A collection of articles on tech and the law: Section 230 and Political Neutrality; The Internet National Emergency Library; CCPA Litigation; Scraping Photos from Public Websites. left_arrow_default 1 2 3 … 12 13 14 Next right_arrow_default"
