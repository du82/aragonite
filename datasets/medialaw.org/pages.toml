["https://medialaw.org/committee/media-deals-committee-2"]
title = "Media Deals Committee - Media Law Resource Center"
description = "We hold regular calls, providing updates on developing and emerging technologies and their implications for content creators; briefs on case law arising from transactional disputes; training sessions with drafting practice tips; and invite guest speakers to share industry insights throughout. We consider media rights and deals from the perspectives of the buyer/seller; licensor/licensee and distributor/producer,..."
full_description = "Media Deals Committee The Media Deals Committee is a resource for the day-to-day transactional work of media & entertainment in-house counsel and attorneys. Whether you regularly draft film/tv or audio production, advertising or event related agreements; navigate complex IP licenses or advise on M&A IP issues; negotiate talent releases, or simply want to learn more about these practice areas, we welcome you to join the first MLRC committee focused on deal making in media & entertainment. We hold regular calls, providing updates on developing and emerging technologies and their implications for content creators; briefs on case law arising from transactional disputes; training sessions with drafting practice tips; and invite guest speakers to share industry insights throughout. We consider media rights and deals from the perspectives of the buyer/seller; licensor/licensee and distributor/producer, always with a view to supporting attorneys regardless of which side of the media transaction their clients fall on."
