title = "All Articles - Media Law Resource Center"
description = """
Houston Appeals Court (Finally) Dismisses Defamation Claims Against ProPublica and Houston Chronicle\t\t\t\t\t\t\t\tReid Pillifant
\t\t\t\t\t\t\t\tIn its decision, the First District Court of Appeals in Houston found that Defendants’ reporting on the plaintiff’s career as a heart surgeon and the concerns that had been raised about some of his practices and procedures, as well as his failure to follow protocols in clinical trials, was substantially true.
\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t
\t\t\t\t\t\t\t\t\t\tTOPICS : Anti-SLAPP, Defamation, Truth"""
full_description = "All Articles Everything MLRC has published, in any publication, since 2017. recently published Jun 2024 Houston Appeals Court (Finally) Dismisses Defamation Claims Against ProPublica and Houston Chronicle Reid Pillifant In its decision, the First District Court of Appeals in Houston found that Defendants’ reporting on the plaintiff’s career as a heart surgeon and the concerns that had been raised about some of his practices and procedures, as well as his failure to follow protocols in clinical trials, was substantially true. TOPICS : Anti-SLAPP, Defamation, Truth Jun 2024 NRA v. Vullo: The Supreme Court on Government Coercion and the First Amendment Jeff Hermes The Supreme Court’s decision in Vullo does not upend the law, instead reaffirming Bantam Books and cautioning lower courts to take a holistic approach to the facts rather than considering discrete factors or actions in isolation. TOPICS : First Amendment May 2024 Ten Questions to a Media Lawyer Drew Shenkman CNN lawyer on his start in the business, hiring outside counsel, Atlanta must-sees and more. TOPICS : Career Development, MLRC News May 2024 Top Gun Lawsuit Shot Down Matt Kristoffersen The 1983 magazine article “Top Guns” and Paramount Pictures’ recent blockbuster movie Top Gun: Maverick are not substantially similar under copyright law, a California federal judge ruled this month. TOPICS : Copyright, Intellectual Property May 2024 To Seal or Not to Seal—That is the Question Mackenzie Arnold The Fifth Circuit vacated and remanded an order from a district court that unsealed a now-settled case allegedly involving revenge porn because the district court applied the incorrect standard for sealing judicial documents. TOPICS : Access / FOIA, Government Records May 2024 Ohio Supreme Court Brings Curtain Down On Covid Data John C. Greiner & Darren W. Ford In a decision that could have far-reaching implications for Ohioans' right to know, the Court held that the Ohio Department of Health must withhold official cause of death information contained in ODH's Electronic Death Registration System from the public. TOPICS : Access / FOIA, Government Records May 2024 With the ELVIS Act, Tennessee Shows its Burning Love for Recording Artists David Zeitlin and Robb Harvey Tennessee, home to both Music City® (Nashville) and the Blues (Memphis), has taken a swing at regulating generative AI’s potential harm to musicians and recording artists. TOPICS : Intellectual Property, Right of Publicity, Section 230 May 2024 Louis Farrakhan’s $4.8 Billion Defamation Lawsuit Against Jewish Groups Dismissed Nathan Siegel and Adam Rich The court held that Farrakhan failed to plead a defamation claim because the challenged statements were protected opinion, and that he also failed to plead falsity or actual malice. TOPICS : Defamation, Opinion May 2024 Maine Becomes Seventh State to Enact Uniform Public Expression Protection Act (UPEPA) Sigmund D. Schutz and Alexandra A. Harriman UPEPA aims to provide a clear framework for the efficient review and dismissal of SLAPPs. TOPICS : Anti-SLAPP, Defamation May 2024 Montana Supreme Court Applies N.Y. Fair Report Privilege to Dismiss Libel Claim by Montana Plaintiff Adam I. Rich and Laura R. Handman The Montana Supreme’s Court’s decision is the first by any high court to find that a publisher’s home state has the most significant interest in applying its fair report privilege. TOPICS : Defamation, Fair Report & Other Privileges May 2024 No Cameras in the Courtroom for Trump Trial Is A Travesty George Freeman Why we should be hitting these walls despite a history of thousands of trials being televised without a problem really is inexplicable. TOPICS : Courtroom Access, MLRC News Apr 2024 Regina Thomas Elected New MLRC Board Chair George Freeman At a recent MLRC Board meeting, Regina Thomas was unanimously elected as the Board’s new Chair. TOPICS : MLRC News Apr 2024 Ten Questions to a Media Lawyer Michael Cameron News Corp. Australia lawyer on his start in media law, big cases, differences between legal cultures in New York and Sydney, Australia must-sees and more. TOPICS : Career Development, MLRC News Apr 2024 Authors’ Vicarious Infringement Claims Against ChatGPT Dismissed Matt Kristoffersen The U.S. District Court for the Northern District of California recently dismissed most of a collection of claims brought by a group of authors against OpenAI, alleging that the artificial intelligence company infringes their copyright when it uses their works to train its large language model ChatGPT. TOPICS : Digital Media, Intellectual Property Apr 2024 Texas Federal District Court Grants Access to Previously Sealed Judicial Records in True the Vote Litigation Zachary Belew In granting the motion to unseal, the court held that the “public access presumption” outweighed any confidentiality interest True the Vote asserted because True the Vote did not “articulate any specific harm created by the disclosure.” TOPICS : Access / FOIA Apr 2024 Connecticut Supreme Court Reaffirms Public Right to Access Cold Case Records Stephanie Rice The Supreme Court of Connecticut issued a ruling of first impression defining the scope of an exception to the state FOIA law allowing police to withhold investigative information “to be used in a prospective law enforcement action” if disclosure would be “prejudicial to such action.” TOPICS : Access / FOIA, Government Records Apr 2024 D.C. Circuit Reinforces FOIA’s Foreseeable Harm Requirement Stephen Stich Match The statute now generally requires agencies to show both that an exemption applies and that disclosure would cause recognized harm. But despite being on the books for eight years, the D.C. Circuit’s ruling is only one of a handful to grapple with the requirement. TOPICS : Access / FOIA, Government Records Apr 2024 Eleventh Circuit Declares Florida’s “Stop W.O.K.E. Act” a Constitutional Sin Daniela Abratt-Cohen In Honeyfund.com, Inc. v. Governor of Fla., the Court found unconstitutional a Florida law that prohibits mandatory workplace meetings and trainings that endorse a viewpoint the government finds offensive. TOPICS : First Amendment Apr 2024 Texas Appellate Court Rejects LLC Plaintiff’s Bid for Statewide Venue in Defamation Case Marc Fuller A Texas court of appeals recently clarified the state’s venue statute governing libel and slander claims, rejecting an interpretation that would have given limited liability companies, partnerships, and other business entities the ability to file suit almost anywhere in the state. TOPICS : Defamation, Jurisdiction Apr 2024 Court Quashes Prosecution Subpoena to New Yorker Journalist Fabio Bertoni Judge Schofield held that, even though the government sought solely to authenticate non-confidential, on-the-record statements that were published in The New Yorker article, it must meet the heightened standard required for confidential information, because confidential source information is within the scope of a potential defense cross-examination of the reporter. TOPICS : Reporters Privilege 1« Prev...34567...Next »163 Our most recent issues MediaLawLetter February 2025 Feb 2025 MediaLawLetter January 2025 Jan 2025 MediaLawLetter December 2024 Dec 2024 Articles & Reports – Newsgathering Committee – MLRC Panic Book Dec 2024 MediaLawLetter November 2024 Nov 2024"
