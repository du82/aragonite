full_description = "HomeMLRC News MLRC News Feb 2025 A Movie on How ABC Covered the Massacre of Israeli Athletes at the 1972 Munich Olympics George Freeman The film presents many journalistic ethical questions which perhaps first played out in this dramatic 1972 situation, but have recurred often since then; and, perhaps most important in these depressing times where the media has been beaten down by everyone from the President to voices of public opinion, it makes journalists look good, if not… TOPICS : MLRC News Jan 2025 Truth, Information Quality, and the Increasingly Complex Work of the MLRC Jeff Hermes The value of truth is not always as useful a signpost as it once was when thinking about the First Amendment. TOPICS : First Amendment, MLRC News Dec 2024 Santa’s Gift List for Media Players Naughty and Nice George Freeman MLRC executive director dons his Santa cap and distributes gifts to the year's biggest newsmakers. TOPICS : MLRC News Nov 2024 MLRC Annual Dinner A stellar panel of journalists discussed How the Media Covered the Presidential Election – and the political, legal and journalistic questions surrounding the campaign and election of Donald Trump. TOPICS : MLRC News Nov 2024 Ten Questions to a Media Lawyer David Hosp Boston lawyer on his start in media law, important cases, his sideline as an author of legal thrillers, watching family perform at Lollapalooza and more. TOPICS : Career Development, MLRC News Nov 2024 2024 DCS Committee Reports MLRC Defense Counsel Committees file brief reports on last year's meetings, publications and special events, and look ahead to 2025. TOPICS : MLRC News Nov 2024 DCS Annual Meeting On November 7, 2024, MLRC held its Annual Defense Counsel Section Meeting at the offices of Patterson Belknap in New York. TOPICS : MLRC News Nov 2024 MLRC 2024 Annual Meeting The Annual Meeting of the Media Law Resource Center, Inc. was held on November 6, 2024, at Gotham Hall in New York. TOPICS : MLRC News Nov 2024 Threats to the Media in the Second Trump Term George Freeman While we can also draw on his first term as a guide, the sad truth is that this second administration is likely to be far worse and far more hostile to the press and to First Amendment values: He’s learned from his first four years; he will only have yes-men surrounding him, no experts and… TOPICS : Defamation, First Amendment, MLRC News, Newsgathering Oct 2024 London Conference a Resounding Success with Engaging Panels, Fun Receptions George Freeman MLRC executive director on the various panels and parties constituting MLRC's latest biennial London Conference. TOPICS : MLRC News left_arrow_default 1 2 3 … 8 9 10 Next right_arrow_default"
