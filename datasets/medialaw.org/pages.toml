full_description = "All Articles Everything MLRC has published, in any publication, since 2017. recently published Jul 2024 First Amendment Lawsuit Forces Jail Policy Changes, Prompts National Call to Action Paula Knudsen Burke A journalist’s First Amendment lawsuit against a county in western Pennsylvania has resulted in a settlement agreement requiring local officials to revise policies that prevent jail employees from speaking publicly without the warden’s permission. TOPICS : First Amendment, Newsgathering Jul 2024 Capitol “Rioter” Suit Against CNN Dismissed Matt Kristoffersen “At bottom, the Court agrees with CNN that Plaintiff Jacob Hiles ‘essentially is trying to blame CNN for taking his own words at face value,’” Judge Allen wrote in her decision granting summary judgment. “Under the circumstances of this case, CNN was entitled to do so, and its reporting is protected by the fair report… TOPICS : Defamation Jul 2024 Fox News Dismissed from Lawsuit in Less Than 90 Days with Public Apology Reid Pillifant Garcia’s counsel publicly pilloried Fox—the first named defendant in the case—for its supposedly shoddy journalism. There was just one problem: Fox News Network had been careful not to publish Garcia’s image before it could be verified. As a result, Fox never published Garcia’s image. TOPICS : Anti-SLAPP, Defamation Jul 2024 NY Appellate Court Affirms Dismissal of Claims and Award of Attorney’s Fees in Favor of Media Karim A. Abdulla TOPICS : Anti-SLAPP, Defamation, Truth Jul 2024 First Anti-SLAPP Win under NJ’s New UPEPA Law Bruce S. Rosen Nine months after New Jersey enacted its first anti-SLAPP law, essentially adopting the Uniform Public Expression Protection Act, a New Jersey trial court was the first to dismiss a SLAPP action. TOPICS : Anti-SLAPP, Defamation Jul 2024 Media Rallies to Support Citizen Journalist in SCOTUS Qualified Immunity Case Jeffrey J. Pyle More than thirty journalists and media organizations filed amicus briefs in support of Priscilla Villarreal, a citizen journalist who was arrested for requesting and reporting truthful information from a police officer. TOPICS : Courtroom Access, Newsgathering Jul 2024 Vidal v. Elster, or, What Happens When the Supreme Court Lacks a Fundamental Theory of the First Amendment Jeff Hermes The Court’s struggle to find a deciding principle stems directly from the siloing of First Amendment law into discrete doctrines – public forums, government benefits, and so on. The fact that this case did not neatly fit into these categories is what led Justice Thomas to abandon logic for history, Justice Kavanaugh to give up… TOPICS : First Amendment, Trademark Jul 2024 MLRC and the Historic Commonwealth: Conferences in Sydney and Dublin George Freeman In January MLRC held a full-day Conference in Sydney, drawing some 125 Australian lawyers. Then last month, in Dublin, we presented the eighth in a series of European Conferences. TOPICS : MLRC News Jul 2024 NetChoice v. Moody: A Strong Statement of First Amendment Rights, But the Devil is in the Details Jeff Hermes On the surface, this ruling appears to ensure that the First Amendment protects the editorial discretion of platforms just as it has protected the editorial discretion of newspapers. But with a caveat in a concurrence from Justice Barrett and comments from the other four justices challenging the Court’s decision to apply the law based on… TOPICS : Digital Media, First Amendment Jun 2024 Texas Court of Appeals Dismisses Claims by Politically Connected Entrepreneur on Statute of Limitations Grounds Marc Fuller and Maggie Burreson A Texas court of appeals rejected a telehealth company’s attempt to evade the state’s one-year statute of limitations on defamation claims by relabeling its claims as business disparagement and other torts. TOPICS : Anti-SLAPP, Defamation Jun 2024 Federal Court Holds That Copyright Act Preempts X’s Web Scraping Claims Jeremy Goldman In a blockbuster ruling that is bound to have far-reaching implications, including in the swarm of copyright infringement cases brought against AI platforms, a California federal court recently dismissed a complaint that X Corp. brought against web scraping company Bright Data. TOPICS : Copyright, Digital Media, Intellectual Property Jun 2024 Supreme Court Provides for Broader Availability of Damages in Copyright Suits Sean M. Callagy and Bridgette C. Gershoni The Supreme Court issued a 6-3 decision in Warner Chappell Music, Inc. v. Nealy, No. 22-1078, holding that damages are available under the Copyright Act for acts of infringement that predate the initiation of suit by more than three years. TOPICS : Copyright, Intellectual Property Jun 2024 Court Holds Information, Like Unicorns, Should Be Free: Unicorn Riot and the Minnesota Shield Law Christopher Proczko The Minnesota Court of Appeals issued a precedential opinion strengthening the protections of Minnesota’s shield law. The decision is a welcome reinforcement to the media’s protections against third-party subpoenas. TOPICS : Reporters Privilege Jun 2024 A Cautionary Tale for Defamation Plaintiffs: Going Back to the Lion’s Den to Retrieve Your Hat Marlia Saunders and Amelia CausleyTodd The outcome is hugely significant because it's the first time a court has made a finding about what happened at Parliament House on that night over 5 years ago – and provides long overdue vindication for Brittany Higgins. TOPICS : Defamation, International Jun 2024 Campus Protests, Hate Speech & the First Amendment — A Timely Zoom Call Revisited George Freeman The call featured four experts making thoughtful and nuanced points, which I thought was worth summarizing here. At the same time, I offer a few thoughts of my own, not necessarily my conclusions, but simply ideas to mull over. TOPICS : First Amendment, MLRC News Jun 2024 Ten Questions to a Media Lawyer Kate Bolger DWT partner on her start in the business, memorable cases, firm life post-pandemic, and things to do in New York City. TOPICS : Career Development, MLRC News Jun 2024 AI and Child Safety Lead Discussion at 2024 MLRC Digital Conference Michael Norwick Much of the content of this year’s conference encompassed two red hot topics: the uncertainty and quickly evolving issues surrounding generative AI, and the wave of legislation and litigation in the name of child safety. TOPICS : Digital Media, MLRC News Jun 2024 New Jersey Supreme Court Upholds Limits on NDAs Raymond Baldino The New Jersey Supreme Court clarified the scope of a recently enacted ban on non-disclosure agreements in connection with discrimination, harassment, and retaliation claims. TOPICS : First Amendment, Prior Restraint Jun 2024 Court Dismisses False Light Claim Against New York Magazine Over “The Case of the Fake Sherlock” Kaitlin Gurney, Chad Bowman, and Isabella Salomão Nascimento In a decision reaffirming the Third Circuit’s actual malice pleading requirement, a Pennsylvania judge granted Vox’s motion to dismiss a renowned armchair detective’s false light invasion of privacy claim. TOPICS : False Light, Privacy Jun 2024 Newsweek Wins Dismissal on Substantial Truth Cameron Stracher and Sara Tesoriero Judge Buchwald held that technical inaccuracies in Newsweek’s reporting about a guilty plea entered by Plaintiff Olivet University did not give rise to a defamation claim where the gist of the allegedly defamatory statement was substantially true. TOPICS : Defamation, Truth 1« Prev...23456...Next »163 Our most recent issues MediaLawLetter February 2025 Feb 2025 MediaLawLetter January 2025 Jan 2025 MediaLawLetter December 2024 Dec 2024 Articles & Reports – Newsgathering Committee – MLRC Panic Book Dec 2024 MediaLawLetter November 2024 Nov 2024"
