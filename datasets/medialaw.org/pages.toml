full_description = "HomeMLRC PublicationsMediaLawLetterMediaLawLetter December 2024 December 2024 MediaLawLetter December 2024 PUBLICATION: MediaLawLetter in this issue Santa’s Gift List for Media Players Naughty and Nice George Freeman MLRC executive director dons his Santa cap and distributes gifts to the year's biggest newsmakers. TOPICS : MLRC News TikTok Falls Under the Long Shadow of Holder Jeff Hermes This case presents what I have started to think about as a First Amendment checksum error: If you interpret the First Amendment as not only permitting but actually justifying greater government control over the content of speech, then you know there is an error in your analysis even if you can’t pinpoint it. TOPICS : Digital Media, First Amendment Sarah Palin’s Second Chance to Try Libel Case Against The New York Times Set for April Tim Tai The move comes after a panel of the U.S. Court of Appeals for the Second Circuit threw out a jury verdict and the judge’s own Rule 50 decision for The Times in August, reviving Palin’s case. TOPICS : Defamation Second Circuit Affirms Dismissal of Defamation Case Against Newsweek Cameron Stracher and Sara Tesoriero The Second Circuit has affirmed the dismissal of a defamation claim against Newsweek on substantial truth and fair report grounds. TOPICS : Defamation, Fair Report & Other Privileges, Truth Utah Court Dismisses Defamation Suit Against Newspaper Under Uniform Public Expression Protection Act Jeffrey J. Hunt, David C. Reymann, and Tammy M. Frisby A Utah state district court recently dismissed a defamation lawsuit brought against a weekly newspaper in what is believed to be the first application of the state’s new Uniform Public Expression Protection Act (UPEPA) to news reporting. TOPICS : Anti-SLAPP, Defamation Defamation Suit Over Nancy Grace True Crime Show and Podcast Dismissed Mary Ellen Roy and Elana Beiser Considering the allegedly defamatory statements as a whole in the context in which they were made, the Court held that they are not defamatory because they are not “of and concerning” the Plaintiffs, are substantially true, and/or are opinion on disclosed facts. TOPICS : Defamation, Truth Australia Adopts Statutory Tort for Serious Invasions of Privacy Patrick Considine and Peter Bartlett This new cause of action empowers individuals to sue another person or entity where that person or entity invaded the individual’s privacy by intruding upon their seclusion or misusing information relating to them. TOPICS : International, Privacy Ten Questions to a Media Lawyer Mark Caramanica Florida lawyer on his start in the business, key cases, favorite podcasts and karaoke picks. TOPICS : Career Development"
