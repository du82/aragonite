María Jesús Ledesma-Carbayo 4 Universidad Politécnica de Madrid: Universidad Politecnica de Madrid; Find this author on Google ScholarFind this author on PubMedSearch for this author on this siteMiguel Luengo-Oroz 3 Spotlab; Find this author on Google ScholarFind this author on PubMedSearch for this author on this siteORCID record for Miguel Luengo-OrozFor correspondence: miguel@spotlab.orgJose M. Rubio 5 Instituto de Salud Carlos III Find this author on Google ScholarFind this author on PubMedSearch for this author on this siteMaria Flores-Chavez 5 Instituto de Salud Carlos III Find this author on Google ScholarFind this author on PubMedSearch for this author on this site AbstractInfo/HistoryMetricsData/Code Preview PDF AbstractChagas disease affects 6–7 million people worldwide and causes approximately 12,000 deaths annually. Diagnostic methods vary by disease stage, with serological tests commonly used in the chronic phase, while microscopy and molecular techniques like PCR and LAMP are employed in the acute phase. While microscopy remains the most accessible tool in resource constrained settings, its effectiveness depends on skilled personnel, creating diagnostic bottlenecks. To overcome these limitations, we developed a portable, smartphone-integrated AI system for real-time Trypanosoma cruzi detection in microscopy images. The platform combines a 3D-printed microscope adapter which aligns the smartphone camera with microscope ocular to digitize images, telemedicine-enabled annotation workflows, and lightweight AI models (SSD-MobileNetV2, YOLOv8) deployed on smartphone for real-time analysis. Trained on a diverse dataset of human samples (478 images from 20 samples), including thick/thin blood smears and cerebrospinal fluid) and murine thin smears (570 images from 33 samples), the SSD-MobileNetV2 model achieved 86% precision, 87% recall, and 86.5% F1-score on human samples, demonstrating robust performance across variable imaging conditions. This system enables rapid, accurate parasite detection in field settings without advanced infrastructure, addressing critical gaps in early diagnosis and monitoring. Its modular design allows adaptation to other pathogens and cellular structures, offering a scalable solution for neglected tropical disease diagnostics. By bridging AI innovation with microscopy, this approach holds promise for advancing equitable healthcare delivery in endemic regions and aligning with global health priorities.Competing Interest StatementLL, ND, DBP, ED, RVL, LP, RMM, MJL-C, MLO work for Spotlab and/or hold shares or phantom shares of Spotlab. The rest of the authors declare no competing interests.Funding StatementYesAuthor DeclarationsI confirm all relevant ethical guidelines have been followed, and any necessary IRB and/or ethics committee approvals have been obtained.YesThe details of the IRB/oversight body that provided approval or exemption for the research described are given below:Ethical approval was obtained from the Comité Bioética de la Facultad de Medicina (approved on 30/10/2020), Universidad Mayor de San Simón, Bolivia and from the Research Ethics Committee (REC) Instituto de Salud de Carlos III, Spain (CEI PI 74_2020)I confirm that all necessary patient/participant consent has been obtained and the appropriate institutional forms have been archived, and that any patient/participant/sample identifiers included were not known to anyone (e.g., hospital staff, patients or participants themselves) outside the research group so cannot be used to identify individuals.YesI understand that all clinical trials and any other prospective interventional studies must be registered with an ICMJE-approved registry, such as ClinicalTrials.gov. I confirm that any such study reported in the manuscript has been registered and the trial registration ID is provided (note: if posting a prospective study registered retrospectively, please provide a statement in the trial ID field explaining why the study was not registered in advance).Yes I have followed all appropriate research reporting guidelines, such as any relevant EQUATOR Network research reporting checklist(s) and other pertinent material, if applicable.YesData AvailabilityThe microscopy image dataset and associated annotations, along with the model will be shared. Copyright The copyright holder for this preprint is the author/funder, who has granted medRxiv a license to display the preprint in perpetuity. It is made available under a CC-BY 4.0 International license. <p><a href="http://medRxiv.disqus.com/?url=https%3A%2F%2Fwww.medrxiv.org%2Fcontent%2F10.1101%2F2025.03.03.25323227v1" class="" data-icon-position="" data-hide-link-title="0">View the discussion thread.</a></p> Back to top PreviousNext Posted March 04, 2025. Download PDF Data/Code Email Thank you for your interest in spreading the word about medRxiv.NOTE: Your email address is requested solely to identify you as the sender of this article. Your Email * Your Name * Send To * Enter multiple addresses on separate lines or separate them with commas. You are going to email the following Artificial Intelligence algorithm for real-time detection and counting of Trypanosoma cruzi parasites using smartphone microscopy Message Subject (Your Name) has forwarded a page to you from medRxiv Message Body (Your Name) thought you would like to see this page from the medRxiv website. Your Personal Message CAPTCHAThis question is for testing whether or not you are a human visitor and to prevent automated spam submissions. Share Artificial Intelligence algorithm for real-time detection and counting of Trypanosoma cruzi parasites using smartphone microscopy Lin Lin, Ana Valeria Solano, Fabiola Gonzales, Mary Cruz Torrico, Daniel Illanes, Nuria Díez, David Bermejo-Peláez, Elena Dacal, Ramón Vallés-López, Lucia Pastor, Roberto Mancebo-Martín, María Jesús Ledesma-Carbayo, Miguel Luengo-Oroz, Jose M. Rubio, Maria Flores-Chavez medRxiv 2025.03.03.25323227; doi: https://doi.org/1