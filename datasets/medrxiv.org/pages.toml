ces between words must be replaced by an underscore ("_") within the URL. For instance, the most recent 30 posts for the combined Pain Medicine and Palliative Medicine subject categories are available in this feed: http://connect.medrxiv.org/medrxiv_xml.php?subject=pain_medicine+palliative_medicine Twitter New papers are tweeted on https://twitter.com/medrxivpreprint'
