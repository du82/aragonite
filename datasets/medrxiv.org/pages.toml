full_description = '''!function(t){if(t("body.context-submit-a-manuscript").length>0){t("div.region-inner.region-content-inner h1.title").remove();var e='<div style="width:40%;"><a id="main-content"></a><h1 class="title" id="page-title" style="float:left;">Submission Guide</h1><h1 class="title" id="page-title" style="float:right;margin-\n\nright:15px;"><a href="/about/FAQ" style="color:#0062a0;font-size:85%;">[FAQ]</a></h1>';t("div.region-inner.region-content-inner ").prepend(e)}}(jQuery); #csh-container { width:100%; margin:0 auto; background:#fff; } #csh-col1 { float:left; width:40%; padding-right:100px; background:#fff; margin-bottom:65px; min-width:280px; } #csh-col2 { float:left; width:40%; padding-left:10px; background:#fff; margin-top:-55px; min-width:280px; } #csh-col2 ul { margin:0; padding:0; list-style:none; } #csh-col2 li { padding-bottom:10px; } div.about-section { margin-bottom:30px; } #csh-button { padding-top:0; padding-bottom:20px; } span.csh-inst { font-style:italic; } h2.csh-top { margin-top:0; } #csh-col2 table { border:none; } #csh-col2 td { color: #333333; } #csh-col2 tr:hover td, tr.even:hover td.active, tr.odd:hover td.active { background: #ffffff; } a.csh-button-st { font-weight:bold; color:#BC2635; } medRxiv (pronounced "med-archive") is a free online archive and distribution server for complete but unpublished manuscripts (preprints) in the medical, clinical, and related health sciences. Preprints are preliminary reports of work that have not been certified by peer review. They should not be relied on to guide clinical practice or health-related behavior and should not be reported in news media as established information. medRxiv was founded by Cold Spring Harbor Laboratory (CSHL), a not-for-profit research and educational institution, Yale University, and BMJ, a global healthcare knowledge provider. The server is owned and operated by CSHL. No endorsement of a manuscript’s methods, assumptions, conclusions, or scientific quality by CSHL, Yale University, or BMJ is implied by its appearance in medRxiv. A manuscript may be submitted prior to, or concurrently with, submission to a journal but will not be posted if it has already been accepted for publication, published, or posted elsewhere. A manuscript may be deposited in medRxiv in draft or final form provided that it concerns a relevant scientific field and that all its authors have consented to its deposition. The manuscript must not have been posted elsewhere, nor should it have been accepted for publication in a journal. Authors wishing to deposit preprints must first register on the site. There is no charge for registration or manuscript deposition. medRxiv is a mechanism for sharing results of research studies performed in the health sciences. Original research articles, systematic reviews and meta-analyses, data articles, and articles describing methodological research/investigations or clinical research design protocols may be posted on medRxiv. By contrast, narrative reviews and hypotheses, case reports, editorial/commentary/opinion articles, correspondence relating to articles elsewhere that does not itself include new research, and laboratory protocols that are not themselves part of a research paper being submitted to medRxiv are not appropriate and will be declined. All manuscripts uploaded to medRxiv undergo a basic screening process for offensive and/or non-scientific content and for material that might pose a health risk. Manuscripts are not certified by peer review before being posted online. medRxiv reserves the right to decline to post any preprint for any reason. Manuscripts are not typeset before being posted online. The author’s manuscript is either submitted as, or automatically converted into, a PDF file. Preprints appear in medRxiv in the order in which they were approved for posting. They are retrievable via the web interface at no charge. Submission Format The simplest way to deposit a manuscript on medRxiv is to upload a single PDF including the text and any figures/tables. All manuscripts should include the title, author names and affiliations, and abstract on the title page. Supplemental data should be created in a separate file or files. Alternatively, you may upload a Word file containing the main text (plus any tables) and separate figure files, from which a single PDF will be created. An automated PDF-conversion engine is responsible for the conversion and it can process many figure file formats, including JPEG, TIFF, EPS, PowerPoint. The following formats are not compatible, however: PICT, Bitmap, Excel, PSD. For these files, you will need to convert them to PDF or another acceptable file format. LaTeX files should be converted to PDF prior to submission. Supplementary Material and Data Sharing Authors are free to include Supplemental Material such as additional tables and MPEG files. Large datasets, however, should be deposited in the appropriate scientific community database (e.g., clinical trial data sharing sites, Protein Data Bank [PDB], GenBank, NIH sites such as BioLINCC). (See "Revisions" guidelines below.) Authors should abide by all relevant community guidelines for use and acknowledgment of data resources (e.g., the Fort Lauderdale guidelines), obtaining permission where required and citing the appropriate laboratory, website, and accession numbers, including clinical trial registration information. They may also include links to data or clinical protocols deposited elsewhere. At submission authors must include a statement regarding the availability of all data referred to in the manuscript, along with links to any data hosted in an external repository. Citation Preprints deposited in medRxiv can be cited using their digital object identifier (DOI). medRxiv DOIs assigned prior to December 11, 2019, have a simple eight-digit suffix, whereas those assigned after this date will also include the date stamp for the day of submission approval (see below). Revised versions of manuscripts retain the same DOI assigned to the first version. Example: Author AN, Author BT. 2019. My article title. medRxiv doi: 10.1101/2019.12.11.12345678 If there are multiple versions of the preprint and you wish to cite a specific version, you can do so by adding the version-specific URL. Example: doi: 10.1101/2019.12.11.12345678 version 2, https://www.medrxiv.org/content/10.1101/2019.12.11.12345678v2 Ethics and Reporting Authors should declare at submission that all relevant ethical guidelines have been followed, all necessary IRB and/or ethics committee approvals have been obtained, all necessary patient/participant consent has been obtained and the appropriate institutional forms archived. Any clinical trials described should be registered with an internationally recognized trial registry and the trial ID included in the manuscript. Authors should include a competing interest statement, including explicit acknowledgment of whether the authors or their institutions received any payments or services in the past 36 months from a third party that could be perceived to influence, or give the appearance of potentially influencing, the submitted work. Authors should also provide a funding statement with details of all funding that supported the work presented, including explicit acknowledgment of whether the authors or their institutions at any time received payment or services from a third party for any aspect of the submitted work. Terms of distribution After a manuscript is deposited in medRxiv, it is citable and cannot be removed. The copyright remains with the author, who is asked to select from several distribution/reuse options under which to make the manuscript available (CC BY, CC BY-NC, CC BY-ND, CC BY-NC-ND, CC0, or no reuse). By posting on medRxiv, authors consent to text mining of their work (e.g., by search engines or researchers). medRxiv reserves the right to identify and remove any preprints for any reason, and in particular preprints that contain plagiarized material or describe experimental work that is not performed in accordance with the relevant ethical standards for research using animals or human subjects. Revisions Authors are free to submit a revised version of a manuscript at any time (prior to acceptance at a journal) by clicking on “Submit a revision” within the Author Area. The new version will use the same DOI as the original submission, which also will remain accessible on the medRxiv site. If there are changes to any Supplemental data, please resubmit all Supplemental files for the article. If there are no changes to Supplemental data, there is no need to resubmit Supplemental files. Withdrawals Authors may request to have their manuscript marked as “Withdrawn” if they no longer stand by their findings/conclusions or acknowledge fundamental errors in the manuscript. In these cases, a statement explaining the reason for the withdrawal is posted on the medRxiv manuscript page to which the DOI defaults. The original manuscript is still accessible via the Info/History tab on medRxiv. In extremely rare, exceptional cases, preprints may be removed for legal reasons. List of Publishers' Preprint Policies Many research journals allow posting on preprint servers such as medRxiv prior to publication. A list of journal policies can be found on Wikipedia and SHERPA/RoMEO. Authors should consult these lists, journal websites, and other sources of information before posting on medRxiv. Direct Transfer from medRxiv to Journals (M2J) medRxiv can save authors time in submitting papers to journals by transmitting their manuscript files and metadata directly from medRxiv. This means authors do not have to spend time re-loading manuscript files and re-entering author information at the journal. Partners currently participating in M2J are listed below. Age and Ageing American Journal of Epidemiology The American Journal of Human Genetics Antimicrobial Agents and Chemotherapy Archives of Disease in Childhood 