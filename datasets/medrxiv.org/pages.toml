title = "Optimizing blood pressure in acute intracerebral hemorrhage: protocol for a prospective individual participant data meta-analysis of the four INTERACT trials | medRxiv"
description = """
Abstract The Optimising Blood Pressure in acute intracerebral hemorrhage (ICH) study aims to conduct an IPDMA of pooling the four INTERACT trial to provide reliable information on the optimal blood pressure (BP) treatment target for patients with acute ICH. This protocol outlines the methods for the systematic review, research questions, and the approach to statistical analysis. An intention-to-treat principle (ITT) will be applied in all analyses. Baseline characteristics will be summarised by treatment group. BP lowering treatment effect on the outcomes will be analysed by means of an ordinal logistic regression, and on the secondary and safety outcomes will be analysed by means of a binary logistic regression. Primary outcome is an ordinal distribution of modified Rankin Scale (mRS) scores at 90 days; secondary outcomes include change (absolute and relative, defined as an increase by >33%) in hematoma volume from the baseline and 24 hours CT scans and safety events within 90 days.

### Competing Interest Statement

The authors have declared no competing interest.

### Funding Statement

This study did not receive any funding

### Author Declarations

I confirm all relevant ethical guidelines have been followed, and any necessary IRB and/or ethics committee approvals have been obtained.

Yes

The details of the IRB/oversight body that provided approval or exemption for the research described are given below:

This individual pooled data study is using the existing dataset which waived ethical approval for this work.

I confirm that all necessary patient/participant consent has been obtained and the appropriate institutional forms have been archived, and that any patient/participant/sample identifiers included were not known to anyone (e.g., hospital staff, patients or participants themselves) outside the research group so cannot be used to identify individuals.

Yes

I understand that all clinical trials and any other prospective interventional studies must be registered with an ICMJE-approved registry, such as ClinicalTrials.gov. I confirm that any such study reported in the manuscript has been registered and the trial registration ID is provided (note: if posting a prospective study registered retrospectively, please provide a statement in the trial ID field explaining why the study was not registered in advance).

Yes

I have followed all appropriate research reporting guidelines, such as any relevant EQUATOR Network research reporting checklist(s) and other pertinent material, if applicable.

Yes

All data produced in the present study are available upon reasonable request to the authors"""
