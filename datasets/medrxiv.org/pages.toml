title = "Validation of the Enhanced Recovery After Surgery (ERAS) database in Alberta, Canada | medRxiv"
description = """
Background: The Enhanced Recovery After Surgery (ERAS) Interactive Audit System (EIAS) is a retrospectively collected database containing information about the preoperative, intraoperative, and postoperative components of surgical patient care. EIAS was created to allow centers that have adopted ERAS protocols to assess their performance. To have confidence in the data collected by EIAS, its completeness, accuracy and validity must be assessed. This study aims to assess the validity of the Alberta EIAS when compared to the gold standard measurement for patient data, the patient electronic medical record (EMR). Methods: Four sites that implemented ERAS across Alberta were included, with 20 to 60 patient EMRs pulled from each site. Data on fourteen pre-specified variables was abstracted from patient EMRs and compared to the corresponding variables from EIAS. Validation criteria included (I) accuracy (agreement between EMR and EIAS) and (II) missingness (percent of data that was missing in patients EMR and EIAS). The estimates of accuracy were compared to estimates of accuracy from two other EIAS validation studies using meta-analysis. Results: A total of 113 patient charts were reviewed across four sites. Agreement between chart review and EIAS was 73.6% (59.9% - 87.3%) with a mean sensitivity of 70.3 and mean specificity of 50.1. Agreement between chart review and EIAS was better among outcomes (agreement for re-operation was 93.7%) than it was for accuracy of documentation of the ERAS elements (mean agreement=73.6%). Agreement varied by site (68.5% to 94.4%) and reviewer (68.0% to 96.6%). Across all fifteen ERAS elements, a mean of 11.4% of data was missing, with re-operation having the greatest proportion of missing data (15.9%) and termination of drains and early mobilization with the lowest proportion of missing data (9.7%). Estimates of accuracy were not different between studies (I2=56.4%, p=0.101). Conclusions: In Alberta, EIAS is an accurate and complete source of data suggesting that EIAS is a valid and reliable source of data to explore patient outcomes and adoption of ERAS guidelines. This study found that data abstractors that are medically trained, and trained in standardized data abstraction are important determinants of generating high quality data, highlighting the need for adequate resources for data collection.

### Competing Interest Statement

The authors have declared no competing interest.

### Funding Statement

This study was funded through a project grant from the Canadian Institutes for Health Research to Khara Sauro. The funder played no role in the design, data collection, analysis or interpretation of the findings.

### Author Declarations

I confirm all relevant ethical guidelines have been followed, and any necessary IRB and/or ethics committee approvals have been obtained.

Yes

The details of the IRB/oversight body that provided approval or exemption for the research described are given below:

This study was approved by the University of Calgary Conjoint Health Research Ethics Board (REB21-1021).

I confirm that all necessary patient/participant consent has been obtained and the appropriate institutional forms have been archived, and that any patient/participant/sample identifiers included were not known to anyone (e.g., hospital staff, patients or participants themselves) outside the research group so cannot be used to identify individuals.

Yes

I understand that all clinical trials and any other prospective interventional studies must be registered with an ICMJE-approved registry, such as ClinicalTrials.gov. I confirm that any such study reported in the manuscript has been registered and the trial registration ID is provided (note: if posting a prospective study registered retrospectively, please provide a statement in the trial ID field explaining why the study was not registered in advance).

Yes

I have followed all appropriate research reporting guidelines, such as any relevant EQUATOR Network research reporting checklist(s) and other pertinent material, if applicable.

Yes

Deidentified data can be made available upon reasonable request to the corresponding author."""
