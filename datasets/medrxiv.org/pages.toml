["https://medrxiv.org/content/10.1101/2025.03.03.25323227v1"]
title = "Artificial Intelligence algorithm for real-time detection and counting of Trypanosoma cruzi parasites using smartphone microscopy | medRxiv"
description = """
Chagas disease affects 6–7 million people worldwide and causes approximately 12,000 deaths annually. Diagnostic methods vary by disease stage, with serological tests commonly used in the chronic phase, while microscopy and molecular techniques like PCR and LAMP are employed in the acute phase. While microscopy remains the most accessible tool in resource constrained settings, its effectiveness depends on skilled personnel, creating diagnostic bottlenecks. To overcome these limitations, we developed a portable, smartphone-integrated AI system for real-time Trypanosoma cruzi detection in microscopy images. The platform combines a 3D-printed microscope adapter which aligns the smartphone camera with microscope ocular to digitize images, telemedicine-enabled annotation workflows, and lightweight AI models (SSD-MobileNetV2, YOLOv8) deployed on smartphone for real-time analysis. Trained on a diverse dataset of human samples (478 images from 20 samples), including thick/thin blood smears and cerebrospinal fluid) and murine thin smears (570 images from 33 samples), the SSD-MobileNetV2 model achieved 86% precision, 87% recall, and 86.5% F1-score on human samples, demonstrating robust performance across variable imaging conditions. This system enables rapid, accurate parasite detection in field settings without advanced infrastructure, addressing critical gaps in early diagnosis and monitoring. Its modular design allows adaptation to other pathogens and cellular structures, offering a scalable solution for neglected tropical disease diagnostics. By bridging AI innovation with microscopy, this approach holds promise for advancing equitable healthcare delivery in endemic regions and aligning with global health priorities.

### Competing Interest Statement

LL, ND, DBP, ED, RVL, LP, RMM, MJL-C, MLO work for Spotlab and/or hold shares or phantom shares of Spotlab. The rest of the authors declare no competing interests.

### Funding Statement

Yes

### Author Declarations

I confirm all relevant ethical guidelines have been followed, and any necessary IRB and/or ethics committee approvals have been obtained.

Yes

The details of the IRB/oversight body that provided approval or exemption for the research described are given below:

Ethical approval was obtained from the Comité Bioética de la Facultad de Medicina (approved on 30/10/2020), Universidad Mayor de San Simón, Bolivia and from the Research Ethics Committee (REC) Instituto de Salud de Carlos III, Spain (CEI PI 74_2020)

I confirm that all necessary patient/participant consent has been obtained and the appropriate institutional forms have been archived, and that any patient/participant/sample identifiers included were not known to anyone (e.g., hospital staff, patients or participants themselves) outside the research group so cannot be used to identify individuals.

Yes

I understand that all clinical trials and any other prospective interventional studies must be registered with an ICMJE-approved registry, such as ClinicalTrials.gov. I confirm that any such study reported in the manuscript has been registered and the trial registration ID is provided (note: if posting a prospective study registered retrospectively, please provide a statement in the trial ID field explaining why the study was not registered in advance).

Yes

I have followed all appropriate research reporting guidelines, such as any relevant EQUATOR Network research reporting checklist(s) and other pertinent material, if applicable.

Yes

The microscopy image dataset and associated annotations, along with the model will be shared."""
