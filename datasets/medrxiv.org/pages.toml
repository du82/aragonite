full_description = '''!function(t){if(t("body.context-content").length>0){t("div.region-inner.region-content-inner h1.title").remove();var e='<div style="width:40%;"><a id="main-content"></a><h1 class="title" id="page-title" style="float:left;">About medRxiv</h1><h1 class="title" id="page-title" style="float:right;margin-\n\nright:15px;"><a href="/about/FAQ" style="color:darkblue;font-size:85%;">[FAQ]</a></h1>';t("div.region-inner.region-content-inner ").prepend(e)}}(jQuery); #csh-container { width:100%; margin:0 auto; background:#fff; } #csh-col1 { float:left; width:40%; padding-right:100px; min-width:280px; background:#fff; } #csh-col2 { float:left; width:40%; padding-left:10px; min-width:280px; background:#fff; margin-bottom:20px; } #csh-col2 ul { margin:0; padding:0; list-style:none; } #csh-col2 li { padding-bottom:4px; } #csh-col2 ul#csh-list li { line-height:120%; margin:0; padding:0; padding-bottom:6px; font-size:100%; } div.about-section { margin-bottom:30px; } #csh-button { padding-top:0; padding-bottom:15px; } span.csh-inst { font-style:italic; } h2.csh-top { margin-top:0; } #csh-col1 table { border:none; font-size:100%; } #csh-col1 td { color: #333333; } #csh-col1 tr:hover td, tr.even:hover td.active, tr.odd:hover td.active { background: #ffffff; } #csh-col2 table { border:none; font-size:100%; } #csh-col2 td { color: #333333; } #csh-col2 tr:hover td, tr.even:hover td.active, tr.odd:hover td.active { background: #ffffff; } a.csh-button-st { font-weight:bold; color:#BC2635; } medRxiv (pronounced "med-archive") is a free online archive and distribution server for complete but unpublished manuscripts (preprints) in the medical, clinical, and related health sciences. Preprints are preliminary reports of work that have not been certified by peer review. They should not be relied on to guide clinical practice or health-related behavior and should not be reported in news media as established information. medRxiv is for the distribution of preprints - complete but unpublished manuscripts - that describe human health research conducted, analyzed, and interpreted according to scientific principles. Research articles, systematic reviews and meta-analyses, clinical research design protocols and data articles may be posted. MedRxiv is not intended for case reports (single or in series), narrative reviews (see below), editorials, letters, opinion pieces and hypotheses that lack data, work not premised on modern biology/physiology or allopathic medicine, laboratory protocols/recipes, theses, term papers, textbook excerpts or individual components of research articles such as figures, tables, and datasets. medRxiv was founded by Cold Spring Harbor Laboratory (CSHL), a not-for-profit research and educational institution, Yale University, and BMJ, a global healthcare knowledge provider. The server is owned and operated by CSHL. medRxiv provides a platform for researchers to share, comment, and receive feedback on their work prior to journal publication. medRxiv aims to improve the openness and accessibility of scientific findings, enhance collaboration among researchers, document provenance of ideas, and inform ongoing and planned research through more timely reporting of completed research. medRxiv is a non-profit community resource and is not linked to any one publisher or journal. Articles are not peer-reviewed, edited, or typeset before being posted online. However, all articles undergo a basic screening process for offensive and/or non-scientific content and for material that might pose a health risk or be considered dual use research of concern, and are checked for plagiarism. No endorsement of a manuscript’s methods, assumptions, conclusions, or scientific quality by CSHL, Yale University, or BMJ is implied by its appearance in medRxiv. A manuscript may be submitted prior to, or concurrently with, submission to a journal but will not be posted if it has already been accepted for publication, published, or posted elsewhere. Authors may submit a revised version of a manuscript to medRxiv at any time (prior to the manuscript's acceptance for publication in a journal). Once posted on medRxiv, manuscripts receive a digital object identifier (DOI), so are discoverable, citable, and indexed by numerous search engines and third-party services and cannot be removed. medRxiv reserves the right to decline to post any preprint for any reason. PRIVACY POLICY: COLLECTION AND USE OF PERSONAL DATA Cold Spring Harbor Laboratory is committed to protecting the privacy of authors, medRxiv Affiliates, and other users of the medRxiv submission system and website. Click to read the full Privacy Policy. INQUIRIES For information about manuscript submission or any other aspect of medRxiv, please contact medrxiv@cshl.edu. TEXT & DATA MINING medRxiv provides free and unrestricted access to all articles posted on the server. We believe this should apply not only to human readers but also to machine analysis of the content. A growing variety of resources have been created to facilitate this access. DIRECT TRANSFER FROM MEDRXIV TO JOURNALS (M2J) medRxiv can save authors time in submitting papers to journals by transmitting their manuscript files and metadata directly from medRxiv. This means authors do not have to spend time re-loading manuscript files and re-entering author information at the journal. Partners currently participating in M2J are listed below. Age and Ageing American Journal of Epidemiology The American Journal of Human Genetics Antimicrobial Agents and Chemotherapy Archives of Disease in Childhood BJGP Open Blockchain in Healthcare Today The BMJ BMJ Connections Clinical Genetics and Genomics BMJ Evidence-Based Medicine BMJ Global Health BMJ Health & Care Informatics BMJ Innovations BMJ Leader BMJ Medicine BMJ Military Health BMJ Neurology Open BMJ Nutrition, Prevention & Health BMJ Open BMJ Open Diabetes Research & Care BMJ Open Gastroenterology BMJ Open Ophthalmology BMJ Open Quality BMJ Open Respir