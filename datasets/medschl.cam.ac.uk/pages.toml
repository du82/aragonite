["https://www.medschl.cam.ac.uk/study/new-taught-mphils-2025"]
title = "New taught MPhils 2024-25 | School of Clinical Medicine"
description = "We have six new taught MPhils available for entry in October 2025. You can also browse our current postgraduate taught degrees (MPhil and MSt)."
full_description = '''We have six new taught MPhils available for entry in October 2025. You can also browse our current postgraduate taught degrees (MPhil and MSt). MPhil in Stem Cell Medicine mphil_in_stem_cell_medicine.png Embark on a transformative journey in the field of stem cell research with the newly introduced taught MPhil in Stem Cell Medicine at the University of Cambridge's Clinical School. This cutting-edge programme is designed to bridge the gap in research skills training, offering students the chance to engage in individual projects within a world-renowned research group. Delve deep into the realms of stem cell biology, from understanding its role in normal development to its implications in various diseases. Gain hands-on experience and theoretical knowledge while being mentored by experts at Europe’s largest Stem Cell Institute. Unleash your potential in this dynamic and rapidly advancing field with our innovative MPhil programme. Contact phd@stemcells.cam.ac.uk for more details. Apply for the MPhil in Stem Cell Medicine here. MPhil in Translating Devices and Advanced Therapies Research Join the taught MPhil in Translating Devices and Advanced Therapies Research, a programme tailored for those passionate about advancing medical technology and therapies. Ideal for professionals in clinical practice, academia, or industry seeking expertise in navigating complex interventions, this course offers insights from leading experts through lectures, workshops, and online modules. Delve into case studies of successful medical device and cell/gene therapy projects and gain essential knowledge on areas such as clinical trial conduct, regulatory frameworks, statistical analyses, and more. Elevate your understanding of healthcare innovation with this comprehensive and practical course. Contact ClinNeuroTaught@medschl.cam.ac.uk for more details. Apply for the MPhil in Translating Devices and Advanced Therapies Research here. MPhil in Foundations of Clinical Psychology mphil_in_foundations_of_clinical_psychology.png Our new taught MPhil programme offers foundational training in Clinical Psychology. Tailored for aspiring leaders in the field, this dynamic programme offers a unique blend of cutting-edge teaching, hands-on research, and a clinically relevant work placement. While it doesn't confer practitioner status or graduate basis for British Psychological Society (BPS) registration, it's your launchpad into the world of Clinical Psychology, whether you're aiming for a DClinPsych or a PhD. Our course emphasises evidence-based therapies and a deep understanding of mental health complexities, preparing students for leadership roles in tackling mental health inequalities. Don't miss your chance to shape the future of mental health. Contact ClinPsychMphil@medschl.cam.ac.uk for more details. Apply for the MPhil in Foundations of Clinical Psychology here. MPhil in Cognitive Neuroscience mphil_in_cognitive_neuroscience.png Our one-year Master’s in Cognitive Neuroscience is an innovative, research-focussed training programme designed to immerse students in the forefront of cognitive neuroscience. Students will receive comprehensive training in cognitive neuroscience methods — from neuroimaging to brain stimulation and computational modelling — coupled with training in major theoretical advances from some of the world’s leading cognitive neuroscientists. At the heart of the course is a nine-month research placement in a lab, which will be independently designed and driven by the student. Our Master’s is aimed particularly at students who aspire to: Pursue doctoral training in cognitive neuroscience or brain sciences more broadly (PhD) Continue or commence clinical training in psychology, medicine, or related fields Pursue industry or policy work related to health innovation or technology, particularly in relation to mental health, neurotechnology, education or other cognitive science-relevant areas. Contact mphil@mrc-cbu.cam.ac.uk for more details. Apply for the MPhil in Cognitive Neuroscience here. MPhil in Molecular Mechanisms of Human Disease mphil_in_molecular_mechanisms_of_human_disease.png The Cambridge Institute for Medical Research (CIMR) and the MRC Mitochondrial Biology Unit (MBU) at the University of Cambridge are offering a one-year Master’s level course for our graduate program in "The Molecular Mechanisms of Human Disease". This course provides an in-depth understanding of how fundamental pathways of cellular homeostasis are disrupted in genetic and infectious diseases. The course covers both practical and theoretical aspects of research and spans disease diagnosis and identification, lab-based mechanistic studies, and how potential therapeutics are developed. This taught MPhil comprises three major elements: taught material delivered by local researchers who are internationally recognised experts in the field biostatistics training, and a 32-week research project in a world-leading laboratory. Contact phdadmin@cimr.cam.ac.uk for more details. Apply for the MPhil in Molecular Mechanisms of Human Disease here. MPhil in Obesity, Endocrinology and Metabolism mphil_in_obesity_endocrinology_and_metabolism.png A full-time taught MPhil in Obesity, Endocrinology & Metabolism providing the highest quality postgraduate training in the physiology and pathophysiology of energy balance and metabolism, as well as in new and emerging treatments for obesity and related metabolic diseases (e.g., type 2 diabetes). This taught MPhil comprises three major elements: taught material delivered by local researchers who are internationally recognised experts in the field biostatistics training, and a 32-week research project in a world-leading laboratory. Contact Metabolism_MPhil@medschl.cam.ac.uk for more details. Apply for the MPhil in Obesity, Endocrinology and Metabolism here.'''
