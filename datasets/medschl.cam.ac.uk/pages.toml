["https://medschl.cam.ac.uk/clinical-academic-training/specialised-foundation-programme"]
title = "Specialised Foundation Programme | School of Clinical Medicine"
description = "This programme is for doctors who are considering a career path as a clinical academic."
full_description = 'The UK Foundation Programme are revising the application process for their Specialist Foundation Programme (SFP). The SFP is well supported in the University’s academic departments. The Cambridge Biomedical Campus gives you access to outstanding researchers and leading clinicians in their field. This programme is for doctors who are considering a career path as a clinical academic. Your employment as an SFP trainee is with NHS England and the Foundation Programme. The Cambridge SFP scheme is linked with District General Hospital (DGH) posts in F1 in either the East Anglia Foundation School (EAFS) or Essex, Bedfordshire and Hertfordshire (EBH). Between 2009 and 2024, 325 trainees have joined our programme. Most trainees who complete their SFP at Cambridge continue to an academic pathway. Out of our total trainees with a known destination: under half went on to an Academic Clinical Fellowship programme over half took an academic route Available posts Vacancies are advertised on Oriel in September for posts starting in August the next year. We offer 24 posts each year. NHS England announced that one third of these posts will be awarded to successful graduates from local medical schools. The remaining two thirds will be managed by NHS England through the preference informed allocation process. Each of our posts is linked with a defined speciality: Medicine Neurocritical Care and Pain Neurosciences Surgery ‘Choice’ If you choose a ‘Choice’ post, you can choose from: Clinical Radiology Experimental Medicine Haematology Medical Microbiology Oncology Paediatrics Psychiatry Transplant and Regeneration General Practice You will be supported by an academic lead for each speciality. You are expected to start your academic project in an area directly related to your chosen specialty. During your second year you will get the opportunity to spend a 4-month rotation on protected academic research. The remaining five rotations will be clinical attachments. In your two Foundation years, you’ll follow the same curriculum and must achieve the same outcomes as other foundation doctors. Eligibility You can learn more about the eligibility information on the UK Foundation Programme website. Apply Recruitment to the UK Foundation Programme (UKFP) is managed by NHS England (East of England). They have made changes to the application process. You are strongly advised to read the guidance and support materials on the UKFP website. In 2024 the allocation process for the main Foundation Programme was changed to a Preference Informed Allocation (PIA) method. In 2025 applications to the Specialised Foundation Programmes will be incorporated into the main Foundation Programme allocation process. To apply you’ll need to: Read the support and guidance materials Register for an Oriel account Fill in the eligibility application form Upload supporting evidence Submit your application Applications are usually open from September to August. Applications submitted after the deadline will not be considered. Vacancies for the SFP programme are advertised on Oriel in September each year for posts commencing the following August. Funding There are no bursaries for additional funding available. Contact us Help with your application If you need help with your application, please email: england.foundation.eoe@nhs.net. Training pathways or post options If you need help with pathways and options, please email: awm41@cam.ac.uk - Professor Andrew McCaskie, the Specialised Foundation Fellowship Programme Director cato@medschl.cam.ac.uk Less than Full Time (LTFT) If you need to change hours to less than full time, please contact england.foundation.eoe@nhs.net You might also be interested in our Academic Clinical Fellowship (ACF) programme. ACF posts are for 3 years and offer 25% research time. Statutory leave You can contact HR in your NHS Trust to discuss leave. Access to University of Cambridge resources SFPs are not employed by the University of Cambridge. If you are affiliated on an academic rotation with one of our departments, you can arrange a "Visiting Researcher" agreement and a @cam.ac.uk email address. This will give you access to lots of University resources.'
