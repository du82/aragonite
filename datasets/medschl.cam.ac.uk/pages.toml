description = "Study one of our medicine courses and you can learn in primary, community–based and hospital care."
full_description = "Study one of our courses and you can learn in primary, community–based and hospital care. Medicine, MB and BChir (undergraduate) Study medical sciences for the first 3 years, then apply your knowledge as a clinical student on a placement for the last 3 years. Apply for our Undergraduate Medicine, MB and BChir course Learn more about the course content View the course timetable Medicine (Graduate course), MB and BChir Study this accelerated, 4 year course if you already have an undergraduate degree with 2.1 or above and you’re a home fee status student. Apply for our Medicine (Graduate course), MB and BChir course Learn more about the course content Clinical School MB/PhD Programme The MB/PhD course leads to the MB, BChir and PhD degrees. It's designed for medical students who are interested in academic or research careers. You can integrate a three-year period of research with your clinical education. Learn more about the course content and apply Postgraduate taught degrees MPhil in Obesity, Endocrinology and Metabolism MPhil in Cognitive Neurosciences MSt in Clinical Medicine MPhil in the Molecular Mechanisms of Human Disease MPhil in Population Health Sciences MPhil in Genomic Medicine MSt Genomic Medicine MPhil in Stem Cell Medicine MPhil in Translating Devices and Advanced Therapies Research MPhil in Foundations of Clinical Psychology Postgraduate research degrees PhD and MPhil application process Before you apply you should decide which theme or area you want to research. When you have decided, you can apply for: Doctor of Philosophy (PhD) Master of Philosophy (MPhil) Postgraduate research degrees PhD under Special Regulations Doctor of Medical Science (MedScD) Doctor of Science (ScD MD (Doctor of Medicine) Master of Surgery (MBChir) by Research (clinicians only) MRes in Genomic Medicine MRes + PhD in Cardiovascular Research MRes + PhD in Cancer Biology (part-time) MRes + PhD Programme in Cancer Biology Postgraduate funded degrees Cambridge 