inical Medicine, and Addenbrooke’s Hospital Main Outpatients Entrance. The Clinical School tries to ensure that the cost of the elective is as reasonable as possible. Accommodation in Cambridge is very expensive, but the Clinical School provides good value, basic accommodation (self-catering, non-serviced), in an excellent location, which means that elective students do not need to spend money on travel. You will be sharing a flat with 3 other elective students. We are unable to provide individual or ensuite accommodation. When possible, we try to accommodate specific requirements but please be aware that these may not always be achievable. Students are responsible for reporting any issues with the accommodation as soon as possible, both to the Electives Administrator, and to reception at Grantchester House. Click here to view photos of Grantchester House accommodation. Your room You’ll have a private bedroom, which is lockable. The bedroom includes: a single bed with mattress, pillow and headboard wash b"
