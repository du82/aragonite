["https://medschl.cam.ac.uk/elective-placements"]
title = "Elective placements | School of Clinical Medicine"
description = "Elective placements are for medical students who are based outside of Cambridge. They take place at Addenbrooke’s Hospital."
full_description = "Elective placements are for medical students who are enrolled in an institution other than the University of Cambridge. They take place at Addenbrooke’s Hospital. Electives are a maximum of 6 weeks in length. It is sometimes possible to do a 4- or 5-week elective, however, we ask that all students start their placement on the first day of the block. We are no longer accepting applications for the 2025 programme. Applications for the 2026 programme will open at 9am (UK) 10th February 2025 and close at 12pm (UK) 10 July 2025. The link to the application form will be added to this page when applications open. Places are limited. Applications for Block 1 and 2 of the 2026 program will be processed earlier. This is so successful students have enough time to complete other application stages. If you're interested in applying to one of these blocks, please make sure to submit your application by 12pm (UK) on April 10th, 2025. After this deadline, you can still apply to Blocks 1 and 2, but all eligible applicants will automatically be added to a waiting list. We'll contact them in the event of a cancellation. To be eligible for an Elective Placement, you'll need to meet our entry requirements and pay fees. On this page: Entry requirements What you'll be doing Facilities How to apply Choosing a speciality Accommodation English language requirements Visa requirements Occupational health requirements Entry requirements You must: be studying at a university listed on the World Directory of Medical Schools be in the last 18 months of your degree meet our English language requirements pass our health assessment The School of Clinical Medicine does not sign placement or partnership agreements with other institutions. Please confirm, prior to applying, that your university does not require such an agreement to be signed. What you’ll be doing During the placement you’ll be assigned to one of the hospital’s departments. Although each placement is different, you’ll usually: attend ward rounds and department briefings shadow staff members at different levels of seniority observe and be invited to take part in medical procedures (depending on your skills level) join day shifts (some specialities may also ask if you wish to attend night shifts, this would be at your own discretion) You will not be able to attend the teaching sessions and seminars offered to our Cambridge medical students, unless your supervisor invites you. You'll have the same access to the clinical environment as Cambridge medical students. You'll be expected to operate within the General Medical Council’s framework for student doctors. All patient activity should be restricted to carrying out, according to instructions and under supervision, only those tasks that have been authorised by the named supervisor (or other medically registered practitioner). You can arrive on the Friday evening before your placement starts. We'll have a Welcome Pack ready for you, which includes all the information you need to know about your stay with us. First Day Arrangements On your first day, you'll have two important appointments to attend: Electives Administrator: They'll process your arrival documentation, answer any questions you may have, and provide you with essential information. Occupational Health: You'll also need to attend an appointment with Occupational Health, which will be booked in advance. Some students may require a chest x-ray appointment as part of the onboarding process. Meeting Your Supervisor After completing these appointments, you'll meet with your supervisor or one of their colleagues. They'll discuss and confirm your placement arrangements, including your timetable and any other essential details. Leaving your placement and confirmation of attendance When it's time for you to leave, please return your keys and NHS card to us. Before you leave the Electives Administrator will give you two copies of a Confirmation of Attendance letter. Each letter will carry the official stamp of the School of Clinical Medicine. The School of Clinical Medicine does not provide any other documentation; supervisors may sign feedback forms if necessary. Liability and Indemnity The School of Clinical Medicine does not provide liability or indemnity cover for medical students during their elective placements. We strongly recommend taking out personal insurance to cover yourself against any unforeseen circumstances during your placement. Facilities You’ll have access to: on-site accommodation staff areas specific to your hospital rotation inside Addenbrooke’s Hospital our IT systems and receive a dedicated email account the Hospital campus, which includes shops, restaurants and sports facilities the University of Cambridge Medical Library the student common room How to apply Stage 1 In Stage 1, you’ll need to: choose your preferred speciality complete the Google application form If you need to make changes to your completed form, please email us at cambridge.electives@medschl.cam.ac.uk. To submit an amendment, use the following subject line: 'Amendment to application <First Name> <Surname>'. Ensure your submission is made on time to meet the deadline. pay a non-refundable application fee of £66 by the deadline. To proceed with your application, please follow the link to our payment platform, which is located at the end of the form. If you're applying for multiple Elective Blocks, you'll only need to pay the application fee once. You’ll also need to provide: proof of your English language proficiency an official transcript. This must not include any 'fails' (unless the subject was sat again and passed). It needs to be on headed paper, and stamped. The transcript must be in English. If the original is in a different language, a certified translated copy must be submitted with it. a reference letter from your university. This needs to be on headed paper, stamped, and signed by your university's Dean (or alternative senior faculty member at your university). The letter must include the date you’re graduating, an assessment of your character, academic abilities and English proficiency, as well as confirmation that the elective is a compulsory part of the course you’re studying. If you’re successful in Stage 1, you’ll receive a Provisional Offer letter inviting you to complete Stage 2 of the application process. We aim to contact all applicants within four weeks of the application deadline. If all available placements for Stage 1 have been filled when you submit your application, you'll be added to a waiting list. You'll receive a letter informing you that you've been placed on the waiting list. If a placement becomes available due to a cancellation, we'll contact you promptly to offer you a place. Stage 2 Students will be given one month from the issuing of the Provisional Offer letter to complete Stage 2. We recommend preparing all necessary documents and information before submitting your application. In Stage 2, you’ll have to: complete a health assessment submit an original colour copy of DBS/police check or equivalent in English. If the original copy is in a different language, a certified translated copy must be submitted with it submit a certified copy of your passport submit evidence that you’ve had a COVID-19 vaccination complete our standard visitor visa form (only for students who do not hold a UK or Irish passport) sign the Confirmation Agreement pay a non-refundable administrative and occupational health fee of £613 Stage 3 Students who have successfully completed Stage 2 by the deadline will receive a final confirmation letter. Two months before the start of the placement, students will have to pay a non-refundable accommodation fee of £960. Choosing a speciality Each elective block has a limited number of places - no more than 8 students per block. The specialties listed below are final. If a speciality is listed more than once in one Block, it means that that department can host more than one student in that block. If a speciality is not included in the list, it means that the department has not provided availability to host elective students. We have fixed block dates and are unable to provide flexibility in terms of scheduling. If your university requires longer placements or different dates, please be aware that we cannot accommodate these requests. Additionally, it is not possible for a placement to overlap two blocks. All students must commit to the designated dates for their chosen block. To apply for a placement, list your preferred number on the application form. For example, if you want to pick Rehab Medicine in Block 1, you will have to write '1.6'. You can select up to 5 preferred specialties from each Block (i.e. 1.3, 1.6, 1.4, etc.). If you are interested in more than one Block, you will have to submit a separate application for each. You can apply for more than one Block to enhance your chances of being selected, but please be aware that you will only be chosen for one. It is NOT possible to attend more than one Block. After the deadline, eligible students with complete stage 1 applications will be allocated places using a random system. Specialities will then be assigned to the students with places, in priority order, based on the preferences they expressed. Block 1: 05 January to 13 February 2026 1.1 Haematology 1.2 Haematology 1.3 Rheumatology 1.4 Neurology 1.5 Endocrinology- Institute of Metabolic Science 1.6 Rehabilitation Medicine 1.7 General surgery- Upper GI surgery 1.8 General surgery- Upper GI surgery 1.9 ENT 1.10 ENT 1.11 Plastic Surgery 1.12 Plastic Surgery 1.13 Plastic Surgery 1.14 Plastic Surgery 1.15 Radiology Block 2: 16 February to 27 March 2026 2.1 Haematology 2.2 Haematology 2.3 Neurology 2.4 Neurosurgery- Paediatric Neurosurgery 2.5 Endocrinology- Institute of Metabolic Science 2.6 Rehabilitation Medicine 2.7 General surgery- Upper GI surgery 2.8 General surgery- Upper GI surgery 2.9 Department of Medicine for the Elderly- Geriatric Medicine 2.10 Plastic Surgery 2.11 Plastic Surgery 2.12 Plastic Surgery 2.13 Plastic Surgery 2.14 Surgery- Trauma and Orthopaedics Block 3: 30 March to 08 May 2026 3.1 Haematology 3.2 Haematology 3.3 Neurology 3.4 Neurosurgery- Paediatric Neurosurgery 3.5 Endocrinology- Institute of Metabolic Science 3.6 Rehabilitation Medicine 3.7 General surgery- Upper GI surgery 3.8 General surgery- Upper GI surgery 3.9 ENT 3.10 ENT 3.11 Plastic Surgery 3.12 Plastic Surgery 3.13 Plastic Surgery 3.14 Plastic Surgery 3.15 Emergency Department- Emergency Medicine 3.16 Emergency Department- Emergency Medicine 3.17 Emergency Department- Emergency Medicine 3.18 Emergency Department- Emergency Medicine 3.19 Emergency Department- Emergency Medicine Block 4: 11 May to 19 June 2026 4.1 Haematology 4.2 Haematology 4.3 Rheumatology 4.4 Neurology 4.5 Endocrinology- Institute of Metabolic Science 4.6 Rehabilitation Medicine 4.7 General surgery- Upper GI surgery 4.8 General surgery- Upper GI surgery 4.9 ENT 4.10 ENT 4.11 Paediatrics 4.12 Paediatrics 4.13 Department of Medicine for the Elderly- Geriatric Medicine 4.14 Plastic Surgery 4.15 Plastic Surgery 4.16 Plastic Surgery 4.17 Plastic Surgery 4.18 Emergency Department- Emergency Medicine 4.19 Emergency Department- Emergency Medicine 4.20 Emergency Department- Emergency Medicine 4.21 Emergency Department- Emergency Medicine 4.22 Emergency Department- Emergency Medicine 4.23 Radiology Block 5: 22 June to 31 July 2026 5.1 Haematology 5.2 Haematology 5.3 Rheumatology 5.4 Neurology 5.5 Neurosurgery- Paediatric Neurosurgery 5.6 Endocrinology- Institute of Metabolic Science 5.7 Rehabilitation Medicine 5.8 General surgery- Upper GI surgery 5.9 General surgery- Upper GI surgery 5.10 ENT 5.11 ENT 5.12 Paediatrics 5.13 Paediatrics 5.14 Paediatrics 5.15 Paediatrics 5.16 Plastic Surgery 5.17 Plastic Surgery 5.18 Plastic Surgery 5.19 Plastic Surgery 5.20 Emergency Department- Emergency Medicine 5.21 Emergency Department- Emergency Medi