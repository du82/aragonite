["https://meethack.it/rules"]
title = "Rules and Code of Conduct | Meethack"
full_description = "Rules and Code of ConductIllegal activities: Engaging in any illegal activities, including but not limited to hacking without permission, unauthorized access to systems, distribution of malicious software and theft of devices, is strictly prohibited.Respect: All participants must treat each other with respect and courtesy, regardless of differences in opinion, background or skill level.Respect for the space: The venue where we gather must be treated with respect at all times. This includes keeping the area clean and tidy, following any posted rules or guidelines, and being mindful of noise levels.No flames or personal attacks: Disagreements are natural, but personal attacks, insults or flaming will not be tolerated. Discussions should remain constructive and focused on the topic at hand.Marketing or promotion: Meethack is a place for learning, collaboration and sharing knowledge, not for promoting products, services or companies that are hiring. Marketing or promotional activities are only permitted if explicitly authorized by the organizers beforehand. Unauthorized marketing or promotion is prohibited.Authority of organizers: The organizers of Meethack have final authority in all matters related to the HackerSpace. This includes enforcing the rules, resolving disputes and making decisions regarding membership. Failure to comply with organizer directives may result in expulsion from the group.Right to ban or remove: The organizers reserve the right to ban or remove any participant who violates the rules or disrupts the harmony of the Meethack community. This action may be taken temporarily or permanently, depending on the severity of the infraction.Participant agreement: By participating in Meethack events and group chat, attendees confirm that they have read, understood and agree to abide by the rules outlined in this code of conduct. They also acknowledge and release the staff from any liability associated with their participation."
year_published = 2025
