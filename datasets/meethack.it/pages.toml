["https://meethack.it/about"]
title = "About | Meethack"
full_description = "AboutMeethack is a Turin HackerSpace that brings together professionals, students, enthusiasts and anyone who wants to know more about Cyber Security.The evenings in which we meet include vulnerability research (web and binary), pentests and research on IoT and mobile devices, CTF challenges, talks and much more!We meet every Monday in Turin, kindly hosted by the Toolbox Coworking in via Agostino da Montefeltro, 2. Booking on Meetup is mandatory to participate!We invite you to join the Telegram group where the community shares its passion and where we organizers send news and communications."
