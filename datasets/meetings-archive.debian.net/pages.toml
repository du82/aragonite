["https://meetings-archive.debian.net/about/index.html"]
title = "About the mirror.accum.se file archive"
full_description = 'For larger files (like .iso images) we use http redirects to send these off to one of the offloaders. The choice of which offloader to redirect to is done by a perl program and is cached in apache as a dbm-cached rewrite rule. To keep cache size reasonably low a certain URL is always redirected to the same offloader. As a precaution against nosey users, the offloaders redirect directory indexes back to the main frontends. And as a precaution against stupid download agents we limit the max connections per IP to 10, and we always deliver data from cache if the data is cached, even if the user agent sends "Cache-control: no cache" or similar.'
