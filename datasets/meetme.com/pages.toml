full_description = "Términos y Condiciones Terms of Service for MeetMe Last Updated: December 3, 2024 Personas suscritas de Arizona, California, Colorado, Connecticut, Illinois, Iowa, Minnesota, Nueva York, California del Norte, Ohio y Rhode Island: la persona que ha adquirido la suscripción tiene la posibilidad de anularla sin penalidad ni obligaciones en cualquier momento previo a la medianoche del tercer día laborable posterior a la fecha de suscripción, con la excepción de domingos y festivos. Al anular la suscripción, los usuarios pueden solicitar un reembolso enviando un correo electrónico al departamento de servicios para miembros de The Meet Group a support@themeetgroup.com o enviando por correo postal una nota con firma y fecha que afirme que quien ha adquirido la suscripción desea anular el acuerdo u otro mensaje con el mismo efecto. Te pedimos que incluyas también tu nombre y la dirección de correo electrónico, el número de teléfono o cualquier otro elemento de identificación único que hayas usado al crear tu cuenta. La nota debe enviarse a la siguiente dirección: The Meet Group, Attn: Cancellations, 100 Union Square Drive, New Hope, PA 18938, USA. La empresa lleva a cabo sus operaciones, en parte, en 100 Union Square Drive, New Hope, PA 18938, EE. UU. Al enviar una carta a The Meet Group Terms Inquiries, 100 Union Square Drive, New Hope, PA 18938, USA, puedes solicitar que te enviemos estas Condiciones de uso a tu correo electrónico. Si te has suscrito por medio de un servicio externo (como el App Store de Apple o Google Play), debes usar el mismo servicio para anular la suscripción. Si te has suscrito con tu Apple ID, los reembolsos son responsabilidad de Apple y no de The Meet Group. Para solicitar un reembolso a Apple, ingresa a tu cuenta de Apple en tu teléfono o a https://getsupport.apple.com. Únicamente para personas suscritas de California: De conformidad con la sección 1789.3 del Código Civil de California, tienes la posibilidad de presentar reclamaciones ante la Unidad de Asistencia en caso de Reclamaciones de la División de Servicios al Consumidor del Departamento de Asuntos de Consumidores de California al enviar una carta a Consumer Information Division, 1625 North Market Blvd., Suite N112 Sacramento, CA 95834, o llamar al +1 (800) 952-5210. Personas suscritas de Wisconsin: ANULACIÓN Y REEMBOLSOS. Derecho de anulación. Puedes anular el contrato hasta la medianoche del tercer día laborable posterior a la fecha en que lo firmaste. Si decides anular el contrato, puedes hacerlo al notificar a The Meet Group por correo postal a la dirección que figura en el contrato (The Meet Group, Attn: Cancellations, 100 Union Square Drive, New Hope, PA 18938, USA) en el transcurso del plazo previamente detallado. Si anulas tu suscripción, los pagos que hayas hecho se reembolsarán en el transcurso de los 21 días posteriores al envío de la carta para anularla. Del mismo modo, The Meet Group anulará las eventuales deudas que tengas y se llevarán a cabo las acciones pertinentes para que no tengas la obligación de pagarlas. Si te has suscrito por medio de un servicio externo (como el App Store de Apple o Google Play), debes usar el mismo servicio para anular la suscripción. Si te has suscrito con tu Apple ID, los reembolsos son responsabilidad de Apple y no de The Meet Group. Para solicitar un reembolso a Apple, ingresa a tu cuenta de Apple en tu teléfono o a https://getsupport.apple.com. Índice A. Condiciones generales de uso 1. INTRODUCCIÓN 2. REQUISITOS PARA LA CREACIÓN DE UNA CUENTA Y USO DE MEETME 3. REGISTRO 4. SUSCRIPCIONES Y MONEDA DENTRO DE LA APLICACIÓN 4.1. SUSCRIPCIONES 4.2. DERECHO A CANCELAR LA SUSCRIPCIÓN 4.3. CREDITS Y REGALOS VIRTUALES 4.4. DIAMANTES 5. POLÍTICA DE PREVENCIÓN DE SPAM 6. CONTENIDO 7. DISPONIBILIDAD DEL SERVICIO 8. TRANSACCIONES CON ANUNCIANTES Y CONTENIDO DE TERCEROS 9. CONTROLES DE ANTECEDENTES PENALES Y VERIFICACIÓN DE IDENTIDAD 10. ADVERTENCIA DE FOTOSENSIBILIDAD: LEER ANTES DE COMENZAR A REPRODUCIR CONTENIDO 11. EXCLUSIÓN DE GARANTÍAS 12. LIMITACIÓN DE LA RESPONSABILIDAD 13. EXCLUSIONES Y LIMITACIONES 14. INDEMNIZACIONES 15. LEGISLACIÓN APLICABLE Y JURISDICCIÓN 16. ACUERDO DE ARBITRAJE, RENUNCIA A ACCIONES COLECTIVAS Y RENUNCIA A JUICIOS CON JURADO 17. Nota sobre la Ley de Derechos de Autor en la Era Digital 18. ACUERDO COMPLETO 19. NUESTRA INFORMACIÓN DE CONTACTO 20. CONDICIONES ADICIONALES PARA DESCARGAS A TRAVÉS DEL APP STORE DE APPLE 21. CONDICIONES ADICIONALES PARA DESCARGAS A TRAVÉS DE GOOGLE PLAY 22. INFORMACIÓN SOBRE EL DERECHO DE RESCISIÓN DE RESIDENTES DEL EEE Y EL REINO UNIDO B. Condiciones de uso de la Suscripción a un Streamer 1. Sujeto de la Suscripción a un Streamer 1.1. Beneficios 1.2. Vínculo contractual 2. Requisitos 3. Suscripción a un Streamer 3.1. Contratación de la suscripción 3.2. Facturación, pagos y renovación 3.3. Cancelación 3.4. Suscripciones a varios Streamers 3.5. Derechos de cancelación específicos de países o regiones 4. Cancelación o suspensión 5. Contenido generado por Streamers 6. Propiedad intelectual 6.1. Propiedad 6.2. Uso de contenido 7. Suspensión o cancelación de Streamer 8. Derecho de rescisión o anulación (para UE y Reino Unido): C. Condiciones de uso para Streamers 1. Sujeto del uso como Streamer que permite suscripciones 1.1. Características para Streamers 1.2. Vínculo contractual 1.3. Recompensas con Diamantes 2. Requisitos 3. Suscripción como Streamer 4. Cancelación 5. Cancelación o suspensión 6. Tu contenido 7. Suspensión o cancelación A. Condiciones generales de uso 1. INTRODUCCIÓN Estas Condiciones generales de uso («CGU») son un acuerdo jurídico entre tú y The Meet Group, Inc. («TMG», «nosotros», «nos», «nuestro») que se aplica a tu acceso a la aplicación móvil y al sitio web de MeetMe y/o tu uso de estas herramientas («MeetMe») que ponemos a tu disposición («los Servicios»). Si tienes alguna pregunta o algún comentario sobre estas CGU, escríbenos a support@themeetgroup.com. Al aceptar estas CGU, acceder a MeetMe o usar esta herramienta, o manifestar de algún otro modo tu consentimiento en relación con estas CGU, aceptas estar sujeto a (i) estas CGU, (ii) nuestras Directrices de la Comunidad, y (iii) eventuales condiciones adicionales o especiales para cualquiera de las características adicionales que se publiquen de vez en cuando (en adelante denominados en conjunto el «Acuerdo»). Si no estás de acuerdo (o no puedes cumplir) con las disposiciones de estas CGU u otras disposiciones del Acuerdo, no podrás acceder a MeetMe o usar esta herramienta. Para obtener más información acerca de cómo tratamos tus datos personales, consulta nuestra Política de privacidad. EL APARTADO A CONTINUACIÓN CON EL TÍTULO «ACUERDO DE ARBITRAJE, RENUNCIA A ACCIONES COLECTIVAS Y RENUNCIA A JUICIOS CON JURADO» INCLUYE UN ACUERDO DE ARBITRAJE VINCULANTE, ASÍ COMO UNA RENUNCIA A ACCIONES COLECTIVAS Y A JUICIOS CON JURADO, QUE AFECTAN TUS DERECHOS LEGALES. POR ESO, ES NECESARIO QUE LO LEAS CON ATENCIÓN. Nos reservamos el derecho a cambiar estas CGU en cualquier momento. La responsabilidad de mantenerte informado acerca de estos cambios es exclusivamente tuya. Si realizamos algún cambio sustancial en las CGU, te notificaremos cuando abras MeetMe. Si no estás de acuerdo con alguna de las disposiciones de las CGU o algún eventual cambio o ya no estás conforme con MeetMe por algún motivo, tu única opción es dejar de usar MeetMe. Si continúas usando MeetMe después de la publicación de una modificación en las CGU, se considerará que estás de acuerdo con los cambios. El término «Usuarios» en estas CGU abarca a todos los usuarios finales de MeetMe, incluidos los usuarios finales que realizan transmisiones en directo a través de MeetMe («Streamers»). MeetMe funciona dentro de una red de otras aplicaciones que son propiedad de TMG y/o Socios de transmisiones en directo o que están operadas por ellos («Red de transmisión en directo»). Para obtener más información sobre los Socios de transmisiones en directo de la Red de transmisión en directo, haz clic aquí. 2. REQUISITOS PARA LA CREACIÓN DE UNA CUENTA Y USO DE MEETME Para registrarte en MeetMe, debes tener, como mínimo, 18 años. Si tienes menos de 18 años, no puedes acceder a MeetMe o usar la herramienta. Al acceder a los Servicios y/o completar el proceso de registro de MeetMe, confirmas que tienes 18 años o más y que puedes quedar sujeto a este Acuerdo y que así será. MeetMe es para tu uso personal y no puede utilizarse con otra finalidad. MeetMe no puede utilizarse en combinación con una actividad comercial sin nuestra autorización explícita por escrito. Las empresas y otras organizaciones no pueden convertirse en Usuarios de MeetMe ni utilizar MeetMe sin nuestra autorización explícita por escrito. Nos reservamos el derecho a investigar eventuales sospechas de usos no autorizados de MeetMe y queda a nuestra discreción exclusiva la posibilidad de buscar la aplicación de remedios legales, civiles o penales o de adoptar medidas cautelares, entre otras. MeetMe no puede utilizarse si lo prohíbe la legislación del país pertinente. Asimismo, se deben cumplir todas las disposiciones locales relacionadas con la conducta online y el contenido aceptable. 3. REGISTRO Para acceder a MeetMe y utilizar la herramienta, en primer lugar, debes registrarte. Para hacerlo, debes escoger una opción de registro disponible (correo electrónico, SMS, Iniciar sesión con Apple, Iniciar sesión con Google o Facebook, por ejemplo) e ingresar las credenciales de acceso, como la dirección de correo electrónico y una contraseña que hayas elegido. La responsabilidad de mantener la confidencialidad de tu contraseña y las credenciales de tu cuenta es exclusivamente tuya. Además, eres responsable de todas las actividades de tu cuenta y las actividades provocadas de forma culposa dentro de tu cuenta. En caso de que alguien esté usando tu cuenta sin autorización o se haya vulnerado de algún otro modo la seguridad, debes notificarnos de inmediato una vez que te des cuenta. Para eliminar tu cuenta, ingresa a la configuración y selecciona la opción para eliminarla. Es posible que eliminemos tu cuenta si permanece inactiva por más de dos años. Para prevenir la eliminación, debes iniciar sesión, como mínimo, una vez cada dos años. 4. SUSCRIPCIONES Y MONEDA DENTRO DE LA APLICACIÓN 4.1. SUSCRIPCIONES Las suscripciones están disponibles en diversos paquetes de un mes, tres meses o seis meses, por ejemplo. Las compras de suscripciones realizadas, facturadas, cobradas o renovadas pueden anularse o cancelarse como se describe en estas CGU. Si adquieres la suscripción a través del App Store de Apple o de Google Play, tu compra estará sujeta a los estándares y principios técnicos establecidos por Apple o Google, sobre los que no tenemos control. Tu suscripción se renovará de forma automática por el mismo tiempo que estableciste para tu suscripción original, a menos que desactives la característica de renovación automática, como mínimo, 24 horas antes de que termine el plazo de tu suscripción actual. Esto se debe a que es posible que se te cobre la renovación en el transcurso de las 24 horas previas a que termine el plazo de tu suscripción actual. Para gestionar tu suscripción y desactivar la renovación automática, ingresa a la configuración de tu cuenta en Apple o Google. Asimismo, puedes seguir las instrucciones sobre cómo cancelar una suscripción detalladas por Apple (https://getsupport.apple.com/) o Google (https://support.google.com/googleplay/). Las suscripciones no pueden cancelarse si ya están en curso, pero sí puede cancelarse en cualquier momento la renovación automática. Si te has suscrito a través del App Store de Apple, los reembolsos son responsabilidad de Apple y no nuestra. Para solicitar un reembolso a Apple, sigue las instrucciones detalladas previamente. El resto de los usuarios puede solicitar un reembolso enviándonos un correo electrónico a support@themeetgroup.com o enviando por correo postal una nota con firma y fecha que afirme que se quiere anular el acuerdo u otro mensaje con el mismo efecto. Te pedimos que incluyas también tu nombre y la dirección de correo electrónico, el número de teléfono o cualquier otro elemento de identificación único que hayas usado al crear tu cuenta. La nota debe enviarse a la siguiente dirección: The Meet Group, Attn: Cancellations, 100 Union Square Drive, New Hope, PA 18938, USA. Tanto Apple como Google ofrecen «pruebas gratuitas» de suscripciones para personas que usan aplicaciones por primera vez y es posible que aprovechemos esta posibilidad. A modo de ejemplo, de vez en cuando, es posible que ofrezcamos una semana gratis a las personas que se suscriban por primera vez. Estas pruebas están limitadas a usuarios que no se hayan suscrito previamente, es decir que no tengan una cuenta actual ni una cuenta anterior de MeetMe. Si ya te habías suscrito en algún momento e intentas solicitar una prueba gratuita, es posible que Apple o Google detecten que no reúnes los requisitos correspondientes. Si es así, puede ser que no se te conceda la prueba gratuita y se te cobre de inmediato por tu primer mes de suscripción. Esta es una característica controlada por el App Store de Apple o Google Play, según la plataforma que uses para MeetMe. En general, las compras de suscripciones no son reembolsables (a menos que se apliquen condiciones especiales para los reembolsos en tu región) ni transferibles, ni siquiera si expiran o dejan de ofrecerse. Nos reservamos el derecho a modificar el precio de compra de las suscripciones en cualquier momento, así como las características incluidas en las suscripciones. Asimismo, nos reservamos el derecho a dejar de crear suscripciones en cualquier momento y establecer fechas de caducidad para las suscripciones. Las suscripciones no pueden canjearse por sumas de dinero o un valor monetario. Si eliminas tu cuenta o se cancela por algún motivo, perderás todo el tiempo restante de la suscripción sin reembolsos