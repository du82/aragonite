title = "Política de Privacidade - MeetMe"
description = "Revise a Política de Privacidade da MeetMe para entender como coletamos, usamos e protegemos suas informações pessoais, garantindo ao mesmo tempo uma experiência segura ao usuário."
full_description = "Política de privacidade Last Updated: December 30, 2024 Uma Política de Privacidade separada aplica-se aos utilizadores do EEE, da Suíça e do Reino Unido. Pode aceder à mesma mais abaixo ou clicar em aqui. Índice I. Política de privacidade 1. Âmbito de aplicação 2. Informações pessoais recolhidas 3. Finalidades da recolha e do tratamento 4. Divulgação de informações pessoais 5. Cookies, segmentação e análise 6. As suas opções de privacidade 7. Ligações e caraterísticas externas 8. Conteúdo gerado pelo utilizador 9. Segurança 10. Privacidade das crianças 11. Alterações à presente política 12. Contactar-nos 13. Informações adicionais sobre privacidade para determinadas jurisdições II. Política de privacidade para utilizadores com residência no Espaço Económico Europeu, na Suíça ou no Reino Unido 1. Âmbito de aplicação 2. Informações pessoais recolhidas 3. Finalidades da recolha e do tratamento 4. Divulgação de informações pessoais 5. Transferências de dados pessoais no contexto de países localizados fora do EEE/Reino Unido/CH 6. Cookies, segmentação e análise 7. As suas opções de privacidade 8. Período de armazenamento de informações pessoais 9. Ligações e caraterísticas externas 10. Conteúdo gerado pelo utilizador 11. Segurança 12. Privacidade das crianças 13. Alterações à presente política 14. Contactar-nos 15. Informações adicionais sobre privacidade para determinadas jurisdições I. Privacy Policy The Meet Group, Inc., as suas marcas, afiliadas e subsidiárias (“TMG“,” “we,” “our,” ou “us“) valoriza a sua privacidade. Esta Política de Privacidade (“Policy“) descreve como a TMG recolhe, utiliza, divulga e processa as informações pessoais descritas nesta Política, bem como os direitos e escolhas que tem relativamente a essas informações pessoais. Para obter informações adicionais sobre as opções de privacidade que tem relativamente às suas informações pessoais, consulte Secção 6. As suas opções de privacidade, bem como Secção 13. Informações adicionais sobre privacidade para determinadas jurisdições, que inclui informações adicionais sobre direitos de privacidade para residentes de determinadas jurisdições. Se for residente na Califórnia, consulte Secção 13.B. Informações adicionais para residentes na Califórnia para obter informações sobre as categorias de informações pessoais que recolhemos e os seus direitos ao abrigo das leis de privacidade da Califórnia. Para utilizadores do Skout ou MeetMe: Quando cria um perfil no Skout ou MeetMe, as suas informações pessoais podem ficar visíveis para os utilizadores de ambas as plataformas. Da mesma forma, quando utiliza a funcionalidade em direto disponível no MeetMe, Skout e Tagged, algumas das suas informações pessoais, como o nome de utilizador, nome, idade, sexo e orientação sexual, de acordo com as suas definições de privacidade, podem ser visíveis também para os utilizadores de outras aplicações de que somos proprietários e de outras aplicações e sítios Web que não são da nossa propriedade e com os quais partilhamos a nossa plataforma em direto. Estes outros utilizadores estão localizados em todo o mundo. Para obter uma lista dos nossos actuais parceiros em direto, clique em aqui para MeetMe e Skout, e aqui para Tagged. Não pode optar por não utilizar esta funcionalidade se optar por utilizar o serviço em direto. A sua utilização dos nossos Serviços está sujeita aos nossos Termos e Condições , incluindo os termos aplicáveis que regem as limitações de danos e a resolução de litígios. 1. Âmbito de aplicação Exceto se descrito de outra forma abaixo, esta Política aplica-se às informações pessoais que a TMG recolhe e processa relacionadas com: visitantes do nosso site onde esta Política é publicada, incluindo qualquer um dos nossos sites que ligam ou publicam esta Política (os “Sites“); indivíduos que transferem e utilizam as nossas aplicações móveis (“Aplicações Móveis“); indivíduos que se registam ou participam nos nossos eventos, inquéritos, pesquisas, promoções e sorteios realizados por nós; clientes actuais, antigos e potenciais, fornecedores e prestadores de serviços e parceiros comerciais; e indivíduos que comuniquem ou interajam ou se envolvam connosco ou com os serviços disponíveis através dos nossos Sites, Aplicações Móveis ou outros serviços online (coletivamente referidos como os “Serviços “). 2. Informações pessoais recolhidas Conforme descrito abaixo, podemos recolher informações pessoais diretamente do utilizador, de fontes de terceiros e automaticamente através da sua utilização dos nossos Serviços. Informações pessoais recolhidas diretamente do utilizador. Embora as informações pessoais que recolhemos variem em função da sua utilização dos nossos Serviços e das nossas interações consigo, em geral, podemos recolher as seguintes categorias de informações pessoais diretamente do utilizador: Informações de contacto. Quando nos contactar, incluindo se nos enviar uma mensagem ou se se inscrever para saber mais sobre os nossos Serviços, poderemos recolher o seu nome, endereço de correio eletrónico, número de telefone ou outros identificadores semelhantes, bem como a sua mensagem, a natureza do seu pedido de informação e quaisquer outras informações que decida fornecer. Informações da conta e do perfil. Quando o utilizador se inscreve numa conta relacionada com os nossos Serviços, podemos recolher o seu nome, endereço de e-mail, número de telefone, endereço (por exemplo, código postal), nome de utilizador e palavra-passe, data de nascimento, etnia e sexo, imagem e fotografia de perfil e informações sobre o endereço de faturação, bem como quaisquer outras informações fornecidas no âmbito da criação ou manutenção da sua conta, ou que o utilizador nos envie através da sua conta. Compras, Pagamentos e Recompensas. Quando o utilizador efectua uma compra ou pagamento através dos nossos Serviços, podemos recolher informações como o tipo de pagamento, detalhes do cartão de pagamento, faturação, endereço de envio, informações de compra e quaisquer outras informações financeiras ou comerciais necessárias para facilitar os nossos Serviços. Comunicações e interações. Quando nos envia um e-mail, telefona ou comunica ou interage connosco ou com outros utilizadores do TMG, incluindo se se inscrever nas nossas listas de correio, preencher formulários nos nossos Sites ou Aplicações Móveis, interagir com as nossas páginas de redes sociais, publicar uma crítica ou testemunho, submeter conteúdo em quaisquer grupos de discussão online ou introduzir informações em campos de comentários públicos, blogues ou fóruns comunitários patrocinados por ou afiliados ao TMG, podemos recolher, receber e manter registos dos seus detalhes de contacto, comunicações e interações, as suas publicações ou submissões e as nossas respostas, se aplicável. Informações promocionais. Se o utilizador concordar em receber comunicações de marketing da nossa parte, poderemos recolher o seu nome, endereço de correio eletrónico, número de telefone, preferências e, se relevante, informações sobre a sua conta e perfil, incluindo os Serviços e funcionalidades que utiliza. Se participar em actividades especiais, ofertas, programas ou promoções que oferecemos, também podemos recolher determinados detalhes de contacto, a sua idade e quaisquer outras informações que possam ser exigidas por lei. Se ganhar uma promoção, também poderemos ter de recolher determinadas informações fiscais e/ou renúncias e libertações, dependendo do prémio. Respostas e feedback. Se participar em inquéritos, questionários ou actividades ou iniciativas de investigação conduzidas por nós, por exemplo, para satisfação do utilizador ou outros fins semelhantes, poderemos recolher as suas respostas e comentários, bem como quaisquer outras informações que decida fornecer. Eventos e detalhes de registo. Também podemos recolher informações pessoais relacionadas com a sua participação nos nossos eventos, bem como outros pedidos que nos envie relacionados com os nossos Serviços. Por exemplo, se o utilizador se inscrever ou participar num evento que organizamos ou patrocinamos, poderemos recolher informações relacionadas com a sua inscrição e participação nesse evento. Preferências e outros pedidos. Também podemos recolher informações sobre as suas preferências, incluindo preferências de comunicação, preferências relacionadas com a sua utilização dos nossos Serviços e quaisquer outras preferências ou pedidos que forneça quando interage connosco. Informações sobre desenvolvimento comercial. Para avaliar e procurar potenciais oportunidades de negócio, podemos recolher e receber informações pessoais sobre clientes actuais, antigos e potenciais, fornecedores e prestadores de serviços, parceiros comerciais, incluindo informações de contacto e outros identificadores semelhantes, informações empresariais e profissionais e registos de comunicações. Informações biométricas recolhidas com o consentimento do utilizador para fins limitados. Geralmente, não recolhemos informações biométricas dos utilizadores. No entanto, em determinadas circunstâncias, podemos pedir-lhe que autorize o processamento de informações e identificadores biométricos para combater contas fraudulentas (incluindo bots) e outras utilizações indevidas dos nossos Serviços, para efeitos de estimativa e verificação da idade e para efeitos de verificação do perfil. Para mais informações, consulte o nosso Aviso específico sobre dados biométricos, que pode ser acedido em aqui. Informações pessoais recolhidas de terceiros. Também podemos recolher e receber determinadas informações pessoais sobre si a partir de fontes de terceiros, tais como parceiros comerciais, clientes e outros utilizadores do TMG, fornecedores de análise de dados e marketing, sistemas operativos e plataformas de redes sociais, bases de dados públicas e fornecedores e prestadores de serviços que prestam serviços ou desempenham funções em nosso nome. Por exemplo, podemos recolher o seu nome, detalhes de contacto e outras informações semelhantes de parceiros comerciais e fornecedores e prestadores de serviços para fins de fornecimento dos nossos Serviços. Além disso, podemos recolher as seguintes informações de fontes de terceiros: Informações de registo em redes sociais e plataformas. Ao utilizar os nossos Serviços, o utilizador pode optar por partilhar informações ou conteúdos, iniciar sessão ou iniciar sessão nos Serviços através de várias plataformas de redes sociais, serviços de redes sociais ou outras funcionalidades ou serviços integrados de terceiros. Quando o utilizador se liga aos nossos Serviços utilizando as suas contas de redes sociais ou outros serviços e funcionalidades integrados semelhantes, podemos recolher ou receber informações pessoais sobre o utilizador que este tenha fornecido a essa conta, serviço ou funcionalidade de rede social. Por exemplo, podemos recolher informações da sua conta e perfil, como o seu nome, e-mail, ID de utilizador, fotografia de perfil, lista de amigos e outras informações semelhantes disponíveis no seu perfil. O utilizador deve verificar as suas definições de privacidade em cada plataforma de redes sociais, funcionalidade ou serviço integrado para compreender melhor a forma como as suas informações pessoais podem ser utilizadas, divulgadas ou processadas por estas partes. Informações de referência. Podemos oferecer-lhe a possibilidade de convidar amigos ou referir outros utilizadores para aceder ou utilizar os nossos Serviços. Ao fazê-lo, poderemos recolher e receber determinadas informações pessoais sobre si, incluindo de outros utilizadores e clientes actuais ou potenciais do TMG que se envolvam de forma semelhante nestas actividades. Informações sobre contactos e potenciais clientes. Podemos receber de terceiros informações sobre potenciais clientes que possam estar interessados nos nossos Serviços. Também podemos colaborar com terceiros para melhorar ou atualizar as informações dos nossos clientes. Por exemplo, podemos receber determinadas informações pessoais de fornecedores de análise de dados e de marketing com o objetivo de alcançar novos clientes, ou de parceiros comerciais, fornecedores e prestadores de serviços com o objetivo de prestar os nossos Serviços. Informações pessoais recolhidas automaticamente. Nós e os nossos fornecedores de serviços terceiros podemos recolher automaticamente ou derivar informações pessoais sobre o utilizador relacionadas com a sua utilização dos nossos Serviços, incluindo através da utilização de cookies, pixel tags e outras tecnologias semelhantes. As informações pessoais que podemos recolher automaticamente incluem: Dispositivo e informações de navegação. Quando o utilizador utiliza os nossos Serviços, podemos recolher o tipo de browser, nome de domínio, visualizações de página, tempos de acesso, carimbos de data/hora, sistema operativo, idioma, tipo de dispositivo, ID única, fornecedor de serviços de Internet, URLs de referência e de saída, dados de clickstream, sistema operativo, idioma e informações semelhantes sobre dispositivos e navegação. Actividades e utilização. Também podemos recolher informações de atividade relacionadas com a sua utilização dos Serviços, tais como informações sobre as hiperligações clicadas, pesquisas, funcionalidades utilizadas, itens visualizados, tempo despendido nos Serviços, as suas interações connosco e com outros utilizadores dos Serviços e outras informações de atividade e utilização semelhantes. Informações de localização. Também podemos recolher ou derivar informações gerais de localização sobre o utilizador, por exemplo, através do seu endereço IP. Para mais informações sobre a nossa utilização de cookies e outras tecnologias semelhantes, consulte Secção 5. Cookies, direcionamento e análise abaixo. 3. Finalidades da recolha e do tratamento De um modo geral, podemos recolher, utilizar, divulgar e processar as categorias de informações pessoais que recolhemos para os seguintes fins Serviços e suporte. Para fornecer e operar os nossos Serviços, gerir a sua conta, comunicar com o utilizador sobre a sua utilização dos Serviços, fornecer resolução de problemas, apoio técnico ou para fins de apoio semelhantes, e para responder às suas questões, satisfazer os seus pedidos, facilitar o processamento de pagamentos e, de outro modo, gerir as nossas operações diárias. Análise e melhoria. Para compreender melhor como os utilizadores acedem e utilizam os Serviços, e para outros fins de investigação e análise, tais como avaliar e melhorar o Site, os nossos Serviços e as operações comerciais, incluindo para desenvolver os nossos Serviços e as suas funcionalidades, e para fins de controlo de qualidade interno e formação. Comunicação. Para responder às suas questões, enviar-lhe materiais solicitados e boletins informativos, bem como informações e materiais relativos aos nossos Serviços e ofertas. Também podemos utilizar estas informações para enviar informações administrativas ao utilizador, por exemplo, informações sobre os Ser"
