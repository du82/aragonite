["https://www.meetme.com/it/termsandconditions"]
title = "Termini e condizioni - MeetMe"
description = "Leggi i Termini e Condizioni di MeetMe per comprendere le linee guida per l'utilizzo dei nostri servizi e le tutele legali in vigore per gli utenti."
full_description = "Condizioni Generali di Contratto Terms of Service for MeetMe Last Updated: December 3, 2024 Abbonati in Arizona, California, Colorado, Connecticut, Illinois, Iowa, Minnesota, New York, North Carolina, Ohio e Rhode Island: l’acquirente può annullare l’abbonamento, senza penalità o obblighi, in qualsiasi momento entro la mezzanotte del terzo giorno lavorativo successivo alla data di sottoscrizione, escluse le domeniche e i giorni festivi. Per annullare l’abbonamento, gli utenti possono richiedere un rimborso contattando il Servizio Soci di The Meet Group all’indirizzo support@themeetgroup.com, o inviando o consegnando una comunicazione firmata e datata che dichiari che l’acquirente sta annullando il presente accordo o contenga parole di significato analogo. L’utente è inoltre pregato di includere nome, indirizzo e-mail e numero di telefono o l’identificatore univoco utilizzato per la registrazione del proprio account. Tale comunicazione deve essere inviata a: The Meet Group, Attn: Cancellations, 100 Union Square Drive, New Hope, PA 18938, USA. L’attività aziendale è condotta, in parte, all’indirizzo: 100 Union Square Drive, New Hope, PA 18938, USA. È possibile ricevere le presenti Condizioni Generali di Contratto via e-mail, inviando una lettera all’indirizzo: The Meet Group, Inc.100 Union Square Drive, New Hope, PA 18938, USA. Se la sottoscrizione è avvenuta tramite un servizio esterno (ad es. App Store di Apple, Google Play), è necessario effettuare l’annullamento tramite tale servizio esterno. Se la sottoscrizione è avvenuta tramite l’Apple ID, i rimborsi saranno gestiti da Apple, non da The Meet Group. È possibile richiedere un rimborso da Apple tramite il proprio account Apple dal proprio telefono o all’indirizzo https://getsupport.apple.com. Solo per gli abbonati in California: in base al Cod. civile Cal. Code §1789.3, l’utente può presentare un reclamo all’Unità di assistenza ai reclami della Divisione dei servizi ai consumatori del Dipartimento degli affari dei consumatori della California, contattandola per iscritto all’indirizzo Consumer Information Division, 1625 North Market Blvd., Suite N112 Sacramento, CA 95834; o telefonicamente al numero (800) 952-5210. Per gli abbonati in Wisconsin: ANNULLAMENTO E RIMBORSI. Diritto di annullamento. All’utente è consentito annullare il presente contratto entro la mezzanotte del terzo giorno successivo alla data di firma del contratto. Se entro questo periodo di tempo l’utente decide di annullare il presente contratto, può inviare o consegnare una comunicazione scritta a The Meet Group all’indirizzo riportato sul contratto (The Meet Group, Attn: Cancellations, 100 Union Square Drive, New Hope, PA 18938, USA) entro il termine precedentemente indicato. In caso di annullamento, qualsiasi pagamento effettuato verrà rimborsato entro 21 giorni dalla consegna della comunicazione di annullamento, e qualsiasi prova di debito eseguita dall’utente sarà annullata da The Meet Group; inoltre saranno presi accordi per sollevare l’utente da qualsiasi ulteriore obbligo di pagamento. Se la sottoscrizione è avvenuta tramite un servizio esterno (ad es. App Store di Apple, Google Play), è necessario effettuare l’annullamento tramite tale servizio esterno. Se la sottoscrizione è avvenuta tramite l’Apple ID, i rimborsi saranno gestiti da Apple, non da The Meet Group. È possibile richiedere un rimborso da Apple tramite il proprio account Apple dal proprio telefono o all’indirizzo https://getsupport.apple.com. Indice A. Termini di servizio 1. INTRODUZIONE 2. IDONEITÀ DELL’ACCOUNT E USO DI MEETME 3. REGISTRAZIONE 4. ABBONAMENTI E VALUTA IN-APP 4.1. ABBONAMENTI 4.2. DIRITTO DI DISDETTA DELL’ABBONAMENTO 4.3. CREDITS E REGALI VIRTUALI 4.4. DIAMANTI 5. POLITICA NO SPAM 6. CONTENUTI 7. DISPONIBILITÀ DEL SERVIZIO 8. RAPPORTI CON GLI INSERZIONISTI E I CONTENUTI DI TERZI 9. NESSUN CONTROLLO DEI PRECEDENTI PENALI O DI VERIFICA DELL’IDENTITÀ 10. AVVISO DI FOTOSENSIBILITÀ: LEGGERE PRIMA DI GIOCARE