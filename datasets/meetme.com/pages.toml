["https://www.meetme.com/pt-br/privacypolicy"]
title = "Política de Privacidade - MeetMe"
description = "Revise a Política de Privacidade da MeetMe para entender como coletamos, usamos e protegemos suas informações pessoais, garantindo ao mesmo tempo uma experiência segura ao usuário."
full_description = "Política de Privacidade Last Updated: December 30, 2024 Uma Política de Privacidade separada se aplica a usuários no EEE, Suíça e Reino Unido. Você pode acessá-la abaixo ou clicar aqui. Índice I. Política de Privacidade 1. Âmbito 2. Informações pessoais coletadas 3. Objetivos da coleta e do processamento 4. Divulgação de informações pessoais 5. Cookies, segmentação e análise 6. Suas escolhas de privacidade 7. Links e recursos externos 8. Conteúdo gerado pelo usuário 9. Segurança 10. Privacidade infantil 11. Alterações a esta Política 12. Fale conosco 13. Informações adicionais de privacidade para determinadas jurisdições II. Política de Privacidade para usuários residentes no Espaço Econômico Europeu, Suíça ou Reino Unido 1. Âmbito 2. Informações pessoais coletadas 3. Objetivos da coleta e do processamento 4. Divulgação de informações pessoais 5. Transferências de dados pessoais no contexto de países localizados fora do EEE/Reino Unido/Suíça 6. Cookies, segmentação e análise 7. Suas escolhas de privacidade 8. Período de armazenamento de informações pessoais 9. Links e recursos externos 10. Conteúdo gerado pelo usuário 11. Segurança 12. Privacidade infantil 13. Alterações a esta Política 14. Fale conosco 15. Informações adicionais de privacidade para determinadas jurisdições I. Privacy Policy O Meet Group, Inc., suas marcas, afiliadas e subsidiárias (“TMG“,” “nós,” “nosso” ou “nos“) valorizam sua privacidade. Esta Política de Privacidade (“Política“) descreve como a TMG coleta, usa, divulga e processa as informações pessoais descritas nesta Política, bem como os direitos e opções que você tem em relação a essas informações pessoais. Para obter mais informações sobre as opções de privacidade que você tem em relação às suas informações pessoais, consulte a Seção 6. Suas escolhas de privacidade e a Seção 13. Informações adicionais de privacidade para determinadas jurisdições, que incluem informações adicionais sobre direitos de privacidade para residentes de determinadas jurisdições. Se você for residente da Califórnia, consulte a Seção 13.B. Informações adicionais para residentes da Califórnia para obter informações sobre as categorias de informações pessoais que coletamos e seus direitos sob as leis de privacidade da Califórnia. Para usuários do Skout ou MeetMe: Ao criar um perfil no Skout ou MeetMe, suas informações pessoais podem ficar visíveis para usuários em ambas as plataformas. Da mesma forma, quando você usa o recurso Live disponível no MeetMe, Skout e Tagged, algumas de suas informações pessoais, como nome de usuário, idade, sexo e orientação sexual, de acordo com suas configurações de privacidade, podem ficar visíveis também para usuários de outros aplicativos de nossa propriedade e outros aplicativos e sites que não são de nossa propriedade, com os quais compartilhamos nossa plataforma ao vivo. Esses outros usuários estão localizados no mundo todo. Para obter uma lista dos nossos parceiros atuais do Live, clique aqui para MeetMe e Skout, e aqui para Tagged. Você não poderá desativar esse recurso se optar por usar o Live. O uso dos nossos Serviços está sujeito aos nossos Termos e Condições, incluindo os termos aplicáveis​que regem as limitações de danos e a resolução de disputas. 1. Âmbito Exceto conforme descrito abaixo, esta Política se aplica às informações pessoais que a TMG coleta e processa relacionadas a: visitantes do nosso site onde esta Política é publicada, incluindo qualquer um dos nossos sites que tenham links ou publiquem esta Política (os “Sites“); indivíduos que baixam e usam nossos aplicativos móveis (“Aplicativos Móveis“); indivíduos que se registram ou participam de nossos eventos, pesquisas, promoções e sorteios conduzidos por nós; clientes atuais, antigos e potenciais, fornecedores e prestadores de serviços e parceiros de negócios; e indivíduos que se comunicam ou de outra forma interagem ou se envolvem conosco ou com os serviços disponíveis por meio de nossos Sites, Aplicativos Móveis ou outros serviços on-line (coletivamente chamados de “Serviços“). 2. Informações pessoais coletadas Conforme descrito abaixo, podemos coletar informações pessoais diretamente de você, de fontes terceirizadas e automaticamente por meio do uso de nossos Serviços. Informações pessoais coletadas diretamente de você. Embora as informações pessoais que coletamos variem dependendo do uso dos nossos Serviços e das nossas interações com você, em geral, podemos coletar as seguintes categorias de informações pessoais diretamente de você: Informações de contato. Quando você entra em contato conosco, inclusive se você nos envia uma mensagem ou se inscreve para saber mais sobre nossos Serviços, podemos coletar seu nome, endereço de e-mail, número de telefone ou outros identificadores semelhantes, bem como sua mensagem, a natureza de sua consulta e qualquer outra informação que você escolher fornecer. Informações de conta e perfil. Quando você cria uma conta em conexão com nossos Serviços, podemos coletar seu nome, endereço de e-mail, número de telefone, endereço (por exemplo, CEP), nome de usuário e senha, data de nascimento, etnia e gênero, imagem e foto do perfil e informações de endereço de cobrança, bem como quaisquer outras informações fornecidas em conexão com a criação ou manutenção da sua conta, ou que você nos envie por meio da sua conta. Compras, pagamentos e recompensas. Quando você faz uma compra ou pagamento usando nossos Serviços, podemos coletar informações como tipo de pagamento, dados do cartão de pagamento, cobrança, endereço de entrega, informações de compra e quaisquer outras informações financeiras ou comerciais necessárias para facilitar nossos Serviços. Comunicações e interações. Quando você envia um e-mail, liga, se comunica ou interage conosco ou com outros usuários da TMG, inclusive se você se inscreve em nossas listas de e-mail, preenche formulários em nossos Sites ou Aplicativos Móveis, interage com nossas páginas das redes sociais, publica uma avaliação ou depoimento, envia conteúdo em qualquer grupo de discussão on-line ou insere informações em campos de comentários públicos, blogs ou fóruns da comunidade patrocinados ou afiliados à TMG, podemos coletar, receber e manter registros de seus dados de contato, comunicações e interações, suas publicações ou envios e nossas respostas, se aplicável. Informações promocionais. Se você concordar em receber nossas comunicações de marketing, poderemos coletar seu nome, endereço de e-mail, número de telefone, preferências e, se relevante, informações sobre sua conta e perfil, incluindo os Serviços e recursos que você usa. Se você participar de atividades especiais, ofertas, programas ou promoções que oferecemos, também poderemos coletar determinados dados de contato, sua idade e quaisquer outras informações que possam ser exigidas por lei. Se você ganhar uma promoção, também poderemos precisar coletar certas informações fiscais e/ou isenções e liberações, dependendo do prêmio. Respostas e comentários. Se você participar de pesquisas, questionários, atividades ou iniciativas de pesquisa conduzidas por nós, como para satisfação do usuário ou outros propósitos semelhantes, poderemos coletar suas respostas e comentários, e qualquer outra informação que você escolher fornecer. Detalhes de eventos e inscrições. Também podemos coletar informações pessoais relacionadas à sua participação em nossos eventos e outras solicitações que você nos enviar relacionadas aos nossos Serviços. Por exemplo, se você se inscrever em ou participar de um evento que organizamos ou patrocinamos, poderemos coletar informações relacionadas à sua inscrição e participação em tal evento. Preferências e outras solicitações. Também podemos coletar informações sobre suas preferências, incluindo preferências de comunicação, preferências relacionadas ao uso de nossos Serviços e quaisquer outras preferências ou solicitações que você fornecer ao interagir conosco. Informações sobre desenvolvimento de negócios. Para avaliar e buscar possíveis oportunidades de negócios, podemos coletar e receber informações pessoais sobre clientes atuais, antigos e potenciais, fornecedores e prestadores de serviços, parceiros comerciais, incluindo informações de contato e outros identificadores semelhantes, informações empresariais e profissionais e registros de comunicações. Informações biométricas coletadas com seu consentimento para fins limitados. Geralmente não coletamos informações biométricas dos usuários. No entanto, em determinadas circunstâncias, podemos solicitar que você consinta com o processamento de informações e identificadores biométricos para combater contas fraudulentas (incluindo bots) e outros usos indevidos de nossos Serviços, para fins de estimativa e verificação de idade e para fins de verificação de perfil. Mais detalhes são fornecidos em nosso Aviso Específico sobre Dados Biométricos, que pode ser acessado aqui. Informações pessoais coletadas de terceiros. Também podemos coletar e receber certas informações pessoais sobre você de fontes terceirizadas, como parceiros de negócios, clientes e outros usuários da TMG, provedores de análise de dados e marketing, sistemas operacionais e plataformas de redes sociais, bancos de dados públicos e fornecedores e prestadores de serviços que fornecem serviços ou executam funções em nosso nome. Por exemplo, podemos coletar seu nome, dados de contato e outras informações semelhantes de parceiros comerciais, fornecedores e prestadores de serviços para fins de fornecimento de nossos Serviços. Além disso, podemos coletar as seguintes informações de fontes terceirizadas: Informações de registro em redes sociais e plataformas. Ao usar nossos Serviços, você pode optar por compartilhar informações ou conteúdo, fazer login ou se inscrever nos Serviços usando várias plataformas de redes sociais, serviços de redes sociais ou outros recursos de terceiros ou serviços integrados. Quando você se conecta aos nossos Serviços usando suas contas de redes sociais ou outros serviços e recursos integrados semelhantes, podemos coletar ou receber informações pessoais sobre você que você forneceu àquela conta de rede social, serviço ou recurso. Por exemplo, podemos coletar informações da sua conta e perfil, como seu nome, e-mail, ID de usuário, foto do perfil, lista de amigos e outras informações semelhantes disponíveis no seu perfil. Você deve verificar suas configurações de privacidade em cada plataforma de rede social, recurso ou serviço integrado para entender melhor como suas informações pessoais podem ser usadas, divulgadas ou processadas por essas partes. Informações de referência. Podemos oferecer a você a possibilidade de convidar amigos ou indicar outros usuários para acessar ou usar nossos Serviços. Ao fazer isso, podemos coletar e receber certas informações pessoais sobre você, inclusive de outros usuários e clientes atuais ou potenciais da TMG que também se envolvem nessas atividades. Informações sobre leads e perspectivas. Podemos receber informações de leads e perspectivas de terceiros sobre clientes em potencial que possam estar interessados em nossos Serviços. Também podemos interagir com terceiros para aprimorar ou atualizar as informações dos nossos clientes. Por exemplo, podemos receber certas informações pessoais de provedores de análise de dados e marketing para alcançar novos clientes, ou de parceiros de negócios, fornecedores e prestadores de serviços para fornecer nossos Serviços. Informações pessoais coletadas automaticamente. Nós e nossos provedores de serviços terceirizados podemos coletar ou deduzir automaticamente informações pessoais sobre você relacionadas ao seu uso de nossos Serviços, inclusive pelo uso de cookies, pixel tags e outras tecnologias semelhantes. As informações pessoais que podemos coletar automaticamente incluem: Informações sobre o dispositivo e navegação. Quando você usa nossos Serviços, podemos coletar informações sobre o tipo de navegador, nome de domínio, visualizações de página, horários de acesso, registros de data/hora, sistema operacional, idioma, tipo de dispositivo, ID exclusivo, provedor de serviços de Internet, URLs de referência e saída, dados de fluxo de cliques, sistema operacional, idioma e informações semelhantes sobre dispositivo e navegação. Atividades e uso. Também podemos coletar informações de atividades relacionadas ao seu uso dos Serviços, como informações sobre links clicados, pesquisas, recursos usados, itens visualizados, tempo gasto nos Serviços, suas interações conosco e outras pessoas dentro dos Serviços e outras informações semelhantes de atividade e uso. Informações de localização. Também podemos coletar ou derivar informações gerais de localização sobre você, como por meio do seu endereço IP. Para obter mais informações sobre nosso uso de cookies e outras tecnologias semelhantes, consulte a Seção 5. Cookies, segmentação e análise abaixo. 3. Objetivos da coleta e do processamento Geralmente, podemos coletar, usar, divulgar e processar as categorias de informações pessoais que coletamos para os seguintes propósitos: Serviços e suporte. Para fornecer e operar nossos Serviços, gerenciar sua conta, comunicar-nos com você sobre seu uso dos Serviços, fornecer solução de problemas, suporte técnico ou para fins de suporte semelhantes, e responder às suas perguntas, atender às suas solicitações, facilitar o processamento de pagamentos e executar nossas operações diárias. Análise e melhoria. Para entender melhor como os usuários acessam e usam os Serviços e para outros fins de pesquisa e análise, como avaliar e melhorar o Site, nossos Serviços e operações comerciais, incluindo o desenvolvimento de nossos Serviços e seus recursos, e para fins de controle de qualidade interno e treinamento. Comunicação. Para responder às suas perguntas, enviar materiais e boletins informativos solicitados, bem como informações e materiais relacionados aos nossos Serviços e ofertas. Também podemos usar essas informações para enviar informações administrativas a você, por exemplo, informações sobre os Serviços e alterações em nossos termos, condições e políticas. Personalização e customização. Para personalizar o conteúdo que podemos enviar ou exibir nos Serviços, inclusive para oferecer customização de localização e personalizar suas experiências e ofertas. Marketing e publicidade. Para fins de marketing, publicidade e promoção. Por exemplo, para enviar a você informações promocionais sobre nossos Serviços, incluindo informações sobre eventos, webinars, apresentações, vendas, ofertas, descontos e novas ofertas da TMG, bem como qualquer outra informação que você se inscrever para receber. Pesquisas. Para administrar pesquisas e questionários, como para pesquisa de mercado, satisfação do usuário ou outros propósitos semelhantes. Desenvolvimento de insights e aprimoramento de dados. Podemos combinar informações pessoais coletadas por meio dos Serviços com outras informações que nós ou terceiros coletamos sobre você em outr"
