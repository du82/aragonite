["https://www.meetme.com/en/privacypolicy"]
title = "Privacy Policy - MeetMe"
description = "Review MeetMe's Privacy Policy to understand how we collect, use, and protect your personal information while ensuring a secure user experience."
full_description = "Privacy Policy Last Updated: December 30, 2024 A separate Privacy Policy applies to users in the EEA, Switzerland, and the UK. You can access it further below or click here. Table of Contents I. Privacy Policy 1. Scope 2. Personal Information Collected 3. Purposes for Collection and Processing 4. Disclosures of Personal Information 5. Cookies, Targeting, and Analytics 6. Your Privacy Choices 7. External Links and Features 8. User Generated Content 9. Security 10. Children’s Privacy 11. Changes to this Policy 12. Contact Us 13. Additional Privacy Information for Certain Jurisdictions II. Privacy Policy for users having their residence in the European Economic Area, Switzerland or the United Kingdom 1. Scope 2. Personal Information Collected 3. Purposes for Collection and Processing 4. Disclosures of Personal Information 5. Transfers of personal data in the context of countries located outside the EEA/UK/CH 6. Cookies, Targeting, and Analytics 7. Your Privacy Choices 8. Storage Period of Personal Information 9. External Links and Features 10. User Generated Content 11. Security 12. Children’s Privacy 13. Changes to this Policy 14. Contact Us 15. Additional Privacy Information for Certain Jurisdictions I. Privacy Policy The Meet Group, Inc., its brands, affiliates, and subsidiaries (“TMG“,” “we,” “our,” or “us“) values your privacy. This Privacy Policy (“Policy“) describes how TMG collects, uses, discloses, and otherwise processes personal information described in this Policy, as well as the rights and choices you have regarding such personal information. For additional information about the privacy choices you have regarding your personal information, please review Section 6. Your Privacy Choices, as well as Section 13. Additional Privacy Information for Certain Jurisdictions, which includes additional information about privacy rights for residents of certain jurisdictions. If you are a resident of California, please refer to Section 13.B. Additional Information for California Residents for information about the categories of personal information we collect and your rights under California privacy laws. For users of Skout or MeetMe: When you create a profile on Skout or MeetMe, your personal information may be visible to users on both platforms. Similarly, when you use the live feature which is available on MeetMe, Skout and Tagged, some of your personal information like username, name, age, gender and sexual orientation in accordance with your privacy settings may be visible also to users of other applications we own, and other applications and websites not owned by us with which we share our live platform. These other users are based worldwide. For a list of our current live partners, click here for MeetMe and Skout, and here for Tagged. You may not opt out of this feature if you choose to use live. Your use of our Services is subject to our Terms and Conditions, including their applicable terms governing limitations on damages and the resolution of disputes. 1. Scope Except as otherwise described below, this Policy applies to the personal information TMG collects and processes related to: visitors of our website where this Policy is posted, including any of our websites that link to or post this Policy (the “Sites“); individuals who download and use our mobile applications (“Mobile Apps“); individuals who register for or participate in our events, surveys, research, promotions, and sweepstakes conducted by us; current, former, and prospective customers, vendors and service providers, and business partners; and individuals who communicate or otherwise interact or engage with us or the services available through our Sites, Mobile Apps, or other online services (collectively referred to as the “Services“). 2. Personal Information Collected As further described below, we may collect personal information directly from you, from third-party sources, and automatically through your use of our Services. Personal Information Collected Directly from You. While the personal information we collect varies depending upon your use of our Services and our interactions with you, in general, we may collect the following categories of personal information directly from you: Contact Information. When you contact us, including if you send us a message or sign up to learn more about our Services, we may collect your name, email address, phone number, or other similar identifiers, as well as your message, the nature of your inquiry, and any other information you so choose to provide. Account and Profile Information. When you sign up for an account in connection with our Services, we may collect your name, email address, phone number, address (e.g., zip code), username and password, date of birth, ethnicity, and gender, profile image and photo, and billing address information, as well as any other information provided in connection with creating or maintaining your account, or that you otherwise submit to us through your account. Purchases, Payments, and Rewards. When you make a purchase or payment through our Services, we may collect information such as payment type, payment card details, billing, shipping address, purchasing information, and any other financial or commercial-related information necessary for facilitating our Services. Communications and Interactions. When you email, call, or otherwise communicate or interact with us or with other TMG users, including if you sign up for our mailing lists, complete forms on our Sites or Mobile Apps, interact with our social media pages, post a review or testimonial, submit content in any online discussion groups, or otherwise enter information into public-facing comment fields, blogs, or community forums sponsored by or affiliated with TMG, we may collect, receive, and maintain records of your contact details, communications and interactions, your posts or submissions, and our responses, if applicable. Promotional Information. If you agree to receive marketing communications from us, we may collect your name, email address, phone number, preferences, and if relevant, information about your account and profile, including the Services and features you use. If you participate in special activities, offers, programs, or promotions we offer, we may also collect certain contact details, your age, and any other information that may be required by law. If you win a promotion, we may also need to collect certain tax information and/or waivers and releases, depending on the prize. Responses and Feedback. If you participate in surveys, questionnaires, or research activities or initiatives conducted by us, such as for user satisfaction or other similar purposes, we may collect your responses and feedback, and any other information you choose to provide. Events and Registration Details. We may also collect personal information related to your participation in our events as well as other requests that you submit to us related to our Services. For example, if you register for or attend an event that we host or sponsor, we may collect information related to your registration for and participation in such event. Preferences and Other Requests. We also may collect information about your preferences, including communications preferences, preferences related to your use of our Services, and any other preferences or requests you provide when interacting with us. Business Development Information. To assess and pursue potential business opportunities, we may collect and receive personal information about current, former, and prospective customers, vendors and service providers, business partners, including contact information and other similar identifiers, company and professional information, and communications records. Biometric Information Collected with Your Consent for Limited Purposes. We do not generally collect biometric information from users. However, in certain circumstances, we may ask you to consent to our processing biometric information and identifiers to fight fraudulent accounts (including bots) and other misuse of our Services, age estimation and verification purposes and profile verification purposes. Further details are provided in our Biometric Data Specific Notice which can be accessed here. Personal Information Collected from Third Parties. We may also collect and receive certain personal information about you from third party sources, such as from business partners, customers and other TMG users, data analytics and marketing providers, operating systems and social media platforms, public databases, and vendors and service providers who provide services or perform functions on our behalf. For example, we may collect your name, contact details, and other similar information from business partners and vendors and service providers for purposes of providing our Services. In addition, we may collect the following information from third-party sources: Social Media and Platform Registration Information. While using our Services, you may choose to share information or content, log into, or sign on to the Services through various social media platforms, social networking services, or other third-party features or integrated services. When you connect to our Services using your social media accounts or other similar integrated services and features, we may collect or receive personal information about you that you have provided to that social media account, service, or feature. For example, we may collect information from your account and profile, such as your name, email, user ID, profile picture, friend list, and other similar information available on your profile. You should check your privacy settings on each social media platform, feature, or integrated service to better understand how your personal information may be used, disclosed, or otherwise processed by these parties. Referral Information. We may offer you the ability to invite friends or refer other users to access or use our Services. In doing so, we may collect and receive certain personal information about you, including from other current or prospective TMG users and customers who similarly engage in these activities. Lead and Prospect Information. We may receive lead and prospect information from third parties about prospective customers that may be interested in our Services. We may also engage with third parties to enhance or update our customer information. For example, we may receive certain personal information from data analytics and marketing providers for purposes of reaching new customers, or from business partners, vendors and service providers for purposes of providing our Services. Personal Information Collected Automatically. We and our third-party service providers may automatically collect or derive personal information about you related to your use of our Services, including through the use of cookies, pixel tags, and other similar technologies. The personal information we may automatically collect includes: Device and Browsing Information. When you use our Services, we may collect browser type, domain name, page views, access times, date/time stamps, operating system, language, device type, unique ID, Internet service provider, referring and exiting URLs, clickstream data, operating system, language, and similar device and browsing information. Activities and Usage. We also may collect activity information related to your use of the Services, such as information about the links clicked, searches, features used, items viewed, time spent within the Services, your interactions with us and others within the Services, and other similar activity and usage information. Location Information. We also may collect or derive general location information about you, such as through your IP address. For more information about our use of cookies and other similar technologies, please see Section 5. Cookies, Targeting, and Analytics below. 3. Purposes for Collection and Processing Generally, we may collect, use, disclose and otherwise process the categories of personal information we collect for the following purposes: Services and Support. To provide and operate our Services, manage your account, communicate with you about your use of the Services, provide troubleshooting, technical support, or for similar support purposes, and to respond to your inquiries, fulfill your requests, facilitate payment processing, and to otherwise run our day-to-day operations. Analytics and Improvement. To better understand how users access and use the Services, and for other research and analytical purposes, such as to evaluate and improve the Site, our Services, and business operations, including to develop our Services and its features, and for internal quality control and training purposes. Communication. To respond to your questions, send you requested materials and newsletters, as well as information and materials regarding our Services and offerings. We may also use this information to send administrative information to you, for example, information regarding the Services and changes to our terms, conditions, and policies. Customization and Personalization. To tailor content we may send or display on the Services, including to offer location customization and to otherwise personalize your experiences and offerings. Marketing and Advertising. For marketing, advertising, and promotional purposes. For example, to send you promotional information about our Services, including information about TMG events, webinars, presentations, sales, deals, discounts, and new offerings, as well as any other information that you sign up to receive. Research and Surveys. To administer surveys and questionnaires, such as for market research, user satisfaction, or other similar purposes. Insight Development and Data Enhancement. We may combine personal information collected through the Services with other information that we or third parties collect about you in other contexts. In most cases, the information that we may combine with the personal information collected through the Services for market research, such as demographic information, does not directly identify consumers. Planning and Managing Events. For event planning and other management-related purposes, such as event registration and attendance, connecting you with other event attendees and TMG users, and contacting you about relevant events, presentations, and our Services. We may also use personal information for purposes of facilitating special events, sweepstakes, contests, and promotions, which may have their own specific rules to participate. Security and Protection of Rights. To protect the Services and our business operations, our rights and those of our stakeholders and investors, to prevent and detect fraud, unauthorized activities and access, and other misuse of our Site, including where we believe necessary to investigate, prevent or take action regarding illegal activities, suspected f"
