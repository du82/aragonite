["https://www.meetme.com/pt-br/communityguidelines"]
title = "Diretrizes da comunidade para MeetMe"
description = "Saiba como o site MeetMe promove uma comunidade amigável e respeitosa. Explore nossas diretrizes, valores e regras em MeetMe"
full_description = "Diretrizes da comunidade Última atualização: 3 de dezembro de 2024 Diretrizes da comunidade separadas se aplicam aos usuários do EEE. Você pode acessá-las mais abaixo ou clicar em aqui. Índice MeetMeDiretrizes da comunidade MeetMe Diretrizes da comunidade para usuários no EEE MeetMeDiretrizes da comunidade Defendemos a liberdade de expressão e acreditamos que é melhor para todos nós quando todos têm voz. Acreditamos que uma rica diversidade de perspectivas e experiências enriquece toda a nossa comunidade. Para proteger tanto a experiência do usuário quanto a segurança, existem algumas restrições sobre o conteúdo e o comportamento que permitimos. Reconhecemos que o abuso pode acontecer e que alguns grupos serão desproporcionalmente afetados pelo abuso, especialmente quando esse abuso for de gênero, sexualidade ou raça, ou direcionado a grupos historicamente subrepresentados ou marginalizados. Comprometemo-nos a combater atos abusivos, principalmente quando motivados por ódio, preconceito ou intolerância, e principalmente quando o abuso busca silenciar as vozes daqueles que historicamente estão subrepresentados. Se você vir algo na MeetMe que viole ou infrinja nossas diretrizes, use a função de denúncia no aplicativo. Nossas Diretrizes da Comunidade fazem parte destes TCGs. Conteúdos e comportamento 1. Conteúdo adulto Você não pode postar ou transmitir material adulto. Consideramos material adulto qualquer coisa pornográfica e/ou qualquer coisa que possa ter a intenção de despertar excitação sexual. Alguns exemplos específicos incluem, mas não estão limitados a: Nudez total ou parcial, incluindo “closes” (com ou sem roupa) de genitais, nádegas ou seios. Essas partes do corpo não devem ser a coisa mais proeminente em uma foto ou em uma tela; “Testar os limites” seja através de nudez como muito decote, shorts muito apertados, tangas ou roupas muito apertadas ou muito transparentes; Gestos obscenos ou sujos (incluindo apontar o dedo médio); Pretensão de um ato sexual; e Relação sexual ou qualquer outro ato sexual envolvendo humanos, representações de animais com características humanas, desenhos animados, hentai ou anime. 2. Violência gráfica Você não pode postar ou transmitir qualquer material graficamente violento ou excessivamente cruel. Consideramos material violento qualquer coisa que represente graficamente a morte, violência, procedimentos cirúrgicos ou ferimentos graves a humanos ou animais. Alguns exemplos específicos incluem, mas não estão limitados a: Cenas de crimes ou acidentes horríveis; Confrontos físicos violentos; Fluidos corporais como sangue, fezes, sêmen etc.; Órgãos internos ou ossos expostos; Danos físicos graves, incluindo feridas expostas, ossos quebrados etc.; Torturas e mortes de animais; e Animais gravemente feridos ou mutilados 3. Atividades ou produtos perigosos Você não pode postar ou transmitir qualquer material que descreva atividades ou produtos nocivos. Alguns exemplos específicos incluem, mas não estão limitados a: Promover a automutilação, suicídio, distúrbios alimentares ou outros atos que possam resultar em lesões graves ou morte; “Testes de coragem”, jogos, batalhas ou competições perigosos; Intoxicantes e drogas; e Transmitir enquanto dirige um veículo de qualquer tipo (incluindo bicicletas). 4. Bens e serviços ilegais ou regulamentados Você não pode postar ou transmitir, qualquer material que descreva quaisquer bens ou serviços ilegais ou regulamentados. Alguns exemplos específicos incluem, mas não estão limitados a: Falsificação e serviços relacionados; Tráfico humano; Drogas (incluindo maconha) e/ou acessórios relacionados; Instrumentos ou serviços financeiros, Jogos de azar; Produtos feitos de espécies ameaçadas ou protegidas; Prostituição ou serviços sexuais; Bens roubados; e Armas, incluindo armas de fogo, munições e explosivos, e instruções de fabricação de armas (por exemplo, bombas, pistolas impressas em 3D etc.) 5. Uso não autorizado Você não deve usar a MeetMe para qualquer propósito ilegal ou para apoiar atividades ilegais. Ao usar a MeetMe, você concorda com todas as leis aplicáveis que regem seu comportamento on-line e seu conteúdo. 6. Propriedade intelectual Você não pode postar ou transmitir qualquer material que você não tenha o direito de publicação ou que viole uma patente, marca registrada, segredo comercial, direito autoral, privacidade ou outro direito de propriedade de qualquer pessoa. 7. Uso não autorizado Você não pode postar ou transmitir a voz ou imagem de outra pessoa sem o consentimento dela. Da mesma forma, você não pode postar ou transmitir quaisquer gravações ou imagens de outra pessoa se a gravação e distribuição foram feitas sem o consentimento da mesma. 8. Informações privadas Você não pode postar ou transmitir informações privadas de outra pessoa sem a permissão dela. Isso inclui fotos, vídeos e outros dados pessoais. Você não pode ameaçar publicar, nem encorajar outros a publicar. 9. Spam e segurança Você não deve usar a MeetMe para enviar spam. Você não pode registrar contas automaticamente ou publicar qualquer material, de forma automática, sistemática ou programática. Você não pode carregar ou transmitir nenhum vírus de software, malware ou outro código de computador, arquivos ou programas prejudiciais, nem coletar dados, usar robôs ou quaisquer outros métodos semelhantes de coleta ou extração de dados. Você não pode interromper a MeetMe ou sobrecarregar desproporcionalmente a MeetMe (ou qualquer outra pessoa usando a MeetMe) ou sobrecarregar as redes associadas à MeetMe. Você não pode violar as medidas de segurança nem tentar burlar as medidas de segurança. 10. Publicidade Você não pode postar ou transmitir publicidade não solicitada ou não autorizada, materiais promocionais, spam, correntes, esquemas de pirâmide ou qualquer outra forma de solicitação, nem incentivar concursos, brindes ou loterias/jogos não autorizados. 11.Falsa identidade Você não pode se passar por qualquer pessoa, grupo ou organização de forma a enganar, confundir ou fraudar outras pessoas. 12. Violência e lesões físicas Você não pode fazer ameaças específicas de violência ou desejo de danos físicos graves, morte ou doença de qualquer indivíduo ou grupo. Isso inclui, mas não se limita a, ameaçar ou promover o terrorismo. Você não pode promover ou encorajar o suicídio ou a automutilação. 13. Menores de idade Você não pode postar ou transmitir conteúdo que represente menores de idade (menores de 18 anos) ou permitir que menores apareçam em sua transmissão. Isso também se aplica se eles forem seus próprios filhos e também se você tiver permissão para fazê-lo. 14. Perigo para o bem-estar infantil e exploração sexual Você não pode postar ou transmitir material adulto. Consideramos material adulto qualquer coisa pornográfica e/ou qualquer coisa que possa ter a intenção de despertar excitação sexual. Alguns exemplos específicos incluem, mas não estão limitados a: Representação visual de um menor envolvido em atos sexualmente explícitos ou sexualmente sugestivos; Representações ilustradas, geradas por computador ou outras representações de menores em um contexto sexualmente explícito ou envolvidos em um ato sexualmente explícito; e Links para provedores de terceiros que apresentem material que retrata a exploração sexual de crianças. O seguinte comportamento também não é permitido na MeetMe: Fantasiar sobre a exploração sexual de crianças ou incentivar a exploração sexual de crianças; Manifestar desejo de receber material contendo exploração sexual de crianças; Recrutar, solicitar ou manifestar interesse em: (1) envolver-se em atividade sexual comercial envolvendo uma criança, ou (2) abrigar ou transportar uma criança para fins sexuais; Envolver um menor em conversas sexualmente explícitas; e Identificar supostas vítimas de exploração sexual infantil pelo nome ou foto. 15. Comportamento abusivo Você não pode assediar outra pessoa ou encorajar outras pessoas a assediar alguém. Consideramos qualquer tentativa de hostilizar, intimidar ou silenciar uma voz um comportamento abusivo. Você não pode assediar ninguém enviando diretamente conteúdo sexual não solicitado, assediando alguém de maneira sexualmente explícita ou se envolvendo em outra conduta sexual imprópria. Você não pode postar ou transmitir conteúdo que explore outras pessoas (incluindo extorsão por dinheiro, extorsão por ameaças, etc.), humilhe ou intimide outras pessoas, ou humilhe ou intimide vítimas de eventos trágicos (ou seus amigos ou familiares). O contexto desempenha um papel na avaliação de comportamento abusivo e na determinação da aplicação de medidas de políticas apropriadas. Os fatores que consideramos incluem, mas não estão limitados a: O comportamento é dirigido a uma pessoa ou a um grupo de pessoas; e A denúncia foi feita pela pessoa que foi alvo do abuso ou por uma testemunha. 16. Comportamento de ódio e assédio moral. Você não deve promover violência contra, ameaçar violência contra, ou assediar outros com base em raça, religião, etnia, origem, orientação sexual, gênero, identificação de gênero, idade, deficiência, doença grave, condição de veterano ou qualquer outra característica relacionada à discriminação ou marginalização sistêmica. Você pode não ter imagens ou símbolo de ódio em sua foto de perfil ou em seu perfil. Você não pode usar seu nome de usuário, nome de exibição ou perfil para se envolver em comportamento abusivo, como expressar assédio ou ódio direcionado a qualquer pessoa, grupo ou categoria protegida. Alguns conteúdos podem ser considerados odiosos quando vistos individualmente, mas no contexto da conversa podem ser entendidos de forma diferente. Por exemplo, membros de uma categoria protegida podem se referir uns aos outros usando termos que normalmente seriam considerados termos depreciativos. Quando estes termos são utilizados de forma consensual, a intenção por trás deles não é a desvalorização, mas significa uma recuperação dos termos que historicamente têm sido utilizados para desvalorizar as pessoas. Você não precisa ser membro de um público de ódio para que possamos agir. Não pedimos às pessoas que provem ou refutem sua participação em um grupo protegido e não coletaremos essas informações por conta própria. Comportamentos que consideramos odiosos incluem, mas não estão limitados a: a. Ameaças de violência Você não pode fazer ameaças deviolência contra um alvo identificável. Ameaças de violência são declarações claras de intenção de ferir alguém, resultando em lesões corporais graves e duradouras, das quais uma pessoa pode morrer ou ser gravemente ferida, por exemplo “Vou matar você.” Temos uma política de tolerância zero com ameaças de violência. Contas que acreditamos compartilhar ameaças de violência serão banidas imediata e permanentemente. b. Desejar, esperar ou incitar danos graves a uma pessoa ou grupo de pessoas. Você não pode postar ou transmitir conteúdo que expresse desejos, esperanças ou desejos de morte, danos físicos graves e duradouros ou doenças graves contra qualquer pessoa ou grupo. Isso inclui, mas não se limita a: Esperar que alguém morra devido a uma doença grave, por exemplo, “Espero que você tenha câncer e morra”; Desejar que alguém seja vítima de um acidente grave, por exemplo, “Gostaria que na próxima vez que você disser algo assim, que você seja atropelado por um carro”; e Dizer que um grupo de pessoas merece lesões corporais graves, por exemplo, “Se esse grupo de manifestantes não se calar, eles merecem ser fuzilados.” c. C. Assassinato em massa, atos de violência ou tipos específicos de violência Você não pode publicar ou transmitir conteúdo que promova assassinato em massa, violência ou tipos específicos de violência contra qualquer pessoa ou grupo. Isso inclui, mas não se limita a enviar a alguém o seguinte: Conteúdo retratando vítimas do holocausto; e Conteúdo retratando linchamentos. d. Conteúdo que incite medo em um grupo de pessoas Você não pode direcionar conteúdo a indivíduos para incitar medo ou preconceito contra um grupo de pessoas, incluindo alegações de que membros de um grupo se envolvem em atividades perigosas ou ilegais, por exemplo, “todos [grupo religioso] são terroristas”. e. Uso repetido e/ou não consensual de termos racistas, palavrões, imagens racistas e sexistas ou outro material depreciativo. Você não pode segmentar indivíduos com linguagem figurativa, humilhante, repetida ou outro conteúdo destinado a desumanizar, degradar ou promover preconceito ou prejudicial contra um grupo protegido. Isso inclui, por exemplo, atribuir deliberadamente o sexo errado ou usar o nome antigo de uma pessoa transgênero. f. Imagens de ódio Você não pode publicar ou transmitir qualquer logotipo, símbolo ou imagem projetada para promover hostilidade e injustiça contra outras pessoas com base em raça, religião, etnia, nacionalidade, orientação sexual, gênero, idade, deficiência, doença grave, condição de veterano ou qualquer outra característicos e que estão ligados à discriminação e exclusão sistemáticas. Alguns exemplos de imagens de ódio incluem, entre outros: Símbolos historicamente associados a grupos de ódio, por exemplo, a suástica nazista Imagens que retratam outras pessoas como menos humanas ou alteradas para incluir símbolos de ódio, por exemplo, alterando imagens de indivíduos para retratar características dos animais; e Imagens alteradas para mostrar símbolos de ódio ou referências a assassinatos em massa por um grupo protegido específico, por exemplo, alterando imagens de pessoas para mostrar estrelas de Davi amarelas relacionadas ao holocausto. 17. Uso abusivo da opção de denúncia Todos os usuários têm a oportunidade de nos denunciar conteúdos ilegais e impróprios dentro da nossa plataforma. No entanto, não é permitido o uso abusivo da opção de denúncia. O envio de repetidas denúncias ou reclamações claramente infundadas pode, portanto, levar a consequências em nossa plataforma. Vamos informá-lo ou alertá-lo a respeito antes de tomar uma decisão. O uso da opção de denúncia é classificado como abusivo principalmente com base no número de denúncias ou reclamações claramente infundadas enviadas em um determinado período de tempo. No entanto, uma conduta como o envio de várias denúncias injustificadas por meio do botão de denúncia só será considerada abusiva se as denúncias ou reclamações forem claramente infundadas, ou seja, se nossa equipe de moderação notar imediatamente que não há conteúdo impróprio ou ilegal. Caso contrário, investigaremos cada denúncia com mais detalhes. Se essas denúncias ou reclamações claramente infundadas forem feitas várias vezes em um mesmo período, serão consideradas um uso abusivo. O uso abusivo resulta em um bloqueio temporário ou permanente do nosso serviço, dependendo da gravidade. 18. Emendas Estas diretrizes não são exaustivas e temos o direito de tomar quaisquer decisões sobre a aplicabilidade desta diretriz – em forma ou conteúdo – a nosso exclusivo e absoluto critério. As consequências da violação da"
