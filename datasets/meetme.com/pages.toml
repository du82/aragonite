full_description = "Naleving 1. Klokkenluidersregeling/Duitse Supply Chain Due Diligence Act Verantwoordelijk handelen vereist een houding en gedijt op continuïteit. Hiervoor hebben we een reeks waarden die we willen naleven als dochteronderneming van ProSiebenSat.1 Media SE. We hebben een sociale verantwoordelijkheid en nemen deze zeer serieus – vooral door onze eis voor compliant gedrag in de dagelijkse praktijk. Informatie over ons Compliance Management Systeem als dochteronderneming van ProSiebenSat.1 Media SE vindt u hier . Via deze link kun je ook ons klokkenluidersysteem bereiken, met name in verband met de Duitse Supply Chain Sourcing Obligations Act (Lieferkettensorgfaltspflichtengesetz). 2. Wet digitale diensten Tussen februari 2024 en augustus 2024 lag het gemiddelde aantal gebruikers dat zich binnen de Europese Unie (EU) aanmeldde bij MeetMe en actief gebruikmaakte van hun profiel, aanzienlijk lager dan 45 miljoen."
