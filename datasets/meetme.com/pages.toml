["https://www.meetme.com/it/privacypolicy"]
title = "Informativa sulla privacy - MeetMe"
description = "Consulta l'Informativa sulla privacy di MeetMe per comprendere come raccogliamo, utilizziamo e proteggiamo i tuoi dati personali, garantendo al contempo un'esperienza utente sicura."
full_description = "Informativa sulla privacy Last Updated: December 30, 2024 Agli utenti nello Spazio Economico Europeo (SEE), in Svizzera e nel Regno Unito si applica un’informativa sulla privacy separata, consultabile più avanti o cliccando qui. Indice I. Informativa sulla privacy 1. Finalità 2. Informazioni personali raccolte 3. Finalità della raccolta e del trattamento 4. Divulgazione di informazioni personali 5. Cookie, contenuti mirati e analisi 6. Scelte di privacy dell’utente 7. Link e funzioni di terze parti 8. Contenuti generati dall’utente 9. Sicurezza 10. Privacy dei minori 11. Modifiche alla presente informativa 12. Contatti 13. Informazioni aggiuntive sulla privacy valide per alcune giurisdizioni II. Informativa sulla privacy per gli utenti residenti nello Spazio Economico Europeo, in Svizzera o nel Regno Unito 1. Finalità 2. Informazioni personali raccolte 3. Finalità della raccolta e del trattamento 4. Divulgazione di informazioni personali 5. Trasferimento di dati personali nell’ambito di Paesi al di fuori di SEE/UK/CH 6. Cookie, contenuti mirati e analisi 7. Scelte di privacy dell’utente 8. Periodo di conservazione delle informazioni personali 9. Link e funzioni di terze parti 10. Contenuti generati dall’utente 11. Sicurezza 12. Privacy dei minori 13. Modifiche alla presente informativa 14. Contatti 15. Informazioni aggiuntive sulla privacy valide per alcune giurisdizioni I. Privacy Policy The Meet Group, Inc., i suoi marchi, le sue affiliate e controllate (“TMG“,” “noi,” “nostro/a/i/e,” o “ci“) hanno a cuore la privacy dei propri utenti. La presente Informativa sulla privacy (“Informativa“) descrive in che modo TMG raccoglie, utilizza, divulga e altrimenti tratta le informazioni personali descritte nella presente Informativa, e i diritti e le scelte dell’utente in relazione a tali informazioni personali. Per ulteriori informazioni in merito alle scelte di privacy dell’utente in relazione alle proprie informazioni personali, consultare la Sezione 6., Scelte di privacy dell’utente e la Sezione 13. Informazioni aggiuntive sulla privacy valide per alcune giurisdizioni, che comprendono informazioni aggiuntive sui diritti di privacy per i residenti di determinate giurisdizioni. Per i residenti in California, consultare la Sezione 13.B. Informazioni aggiuntive per i residenti in California, contenente informazioni sulle categorie di informazioni personali da noi raccolte e sui diritti dell’utente ai sensi delle leggi sulla privacy vigenti in California. Per gli utenti di Skout o MeetMe: le informazioni personali dell’utente che crea un profilo su Skout o MeetMe potrebbero essere visibili agli utenti di entrambe le piattaforme. Allo sesso modo, se si utilizza la funzione Live disponibile su MeetMe, Skout e Tagged, a seconda delle impostazioni sulla privacy selezionate, alcune informazioni personali come nome utente, nome, età, genere e orientamento sessuale potrebbero essere visibili anche ad utenti di altre applicazioni di nostra proprietà e di altre applicazioni e siti web non di nostra proprietà, ma con le quali condividiamo la nostra piattaforma Live. Tali altri utenti sono distribuiti in tutto il mondo. La lista dei nostri attuali partner Live è disponibile qui per MeetMe e Skout, e qui per Tagged. Non è possibile disattivare tale funzione se si sceglie di usare la funzione Live. L’uso dei nostri Servizi è soggetto alle nostre Condizioni Generali di Contratto, comprese le clausole applicabili in riferimento alle limitazioni sui danni e la risoluzione delle controversie. 1. Finalità Salvo diversamente indicato di seguito, la presente Informativa si applica alle informazioni personali raccolte e trattate da TMG in relazione a: visitatori del nostro sito web, dove è pubblicata la presente Informativa, compreso ogni altro nostro sito web che rimanda a questa Informativa o sul quale questa Informativa è pubblicata (“Siti“); individui che scaricano o utilizzano le nostre applicazioni mobili (“App mobili“); individui che si registrano o partecipano a eventi, ricerche, offerte promozionali e lotterie condotti da noi; clienti attuali, precedenti o potenziali, fornitori e prestatori di servizi, partner commerciali; individui che comunicano o interagiscono in altro modo o entrano in contatto con noi o con i servizi disponibili tramite i Siti, le App mobili o altri servizi online da noi offerti (indicati collettivamente come “Servizi“). 2. Informazioni personali raccolte Come descritto di seguito, possiamo raccogliere informazioni personali direttamente dall’utente, da fonti terze e, in modo automatico, dall’uso dei nostri Servizi da parte dell’utente. Informazioni personali raccolte direttamente dall’utente. Sebbene le informazioni personali che raccogliamo variano a seconda dell’uso dei nostri Servizi e delle nostre interazioni con l’utente, in generale possiamo raccogliere direttamente dall’utente le seguenti categorie di informazioni personali: Informazioni di contatto. Quando l’utente ci contatta, anche inviando un messaggio o registrandosi per avere ulteriori informazioni sui nostri Servizi, possiamo raccogliere informazioni quali: nome, indirizzo e-mail, numero di telefono o altri identificativi di questo tipo, e ancora il messaggio, la natura della richiesta e qualsiasi altra informazione comunicata dall’utente. Informazioni su account e profilo. Quando l’utente crea un account in relazione ai nostri Servizi, possiamo raccogliere informazioni quali: nome, indirizzo e-mail, numero di telefono, indirizzo (ad es. codice postale), nome utente e password, data di nascita, appartenenza etnica, genere, immagine e foto del profilo, indirizzo di fatturazione e qualsiasi altra informazione fornita nell’ambito della creazione e della gestione dell’account o fornita dall’utente in altro modo tramite il proprio account. Acquisti, pagamenti e ricompense. Quando l’utente effettua un acquisto o un pagamento tramite i nostri Servizi, possiamo raccogliere informazioni quali: modalità di pagamento, dettagli della carta utilizzata, indirizzo di fatturazione e di consegna, informazioni di acquisto e qualsiasi altra informazione finanziaria o relativa alla transazione economica necessaria per agevolare i nostri Servizi. Comunicazioni e interazioni Quando l’utente si mette in contatto con noi telefonicamente, via e-mail o in altro modo, oppure interagisce con noi o col altri utenti TMG, anche iscrivendosi alle nostre mailing list o compilando moduli sui nostri Siti o sulle nostre App mobili, o interagisce sulle nostre pagine di social media, pubblica una recensione o una testimonianza, invia contenuti in qualsiasi gruppo di discussione online, o immette in altro modo informazioni nei campi per i commenti aperti al pubblico, nei blog o nei forum della community sponsorizzati da o affiliati con TMG, possiamo raccogliere, ricevere e tenere traccia dei dati di contatto, delle comunicazioni, delle interazioni, dei post o dei commenti dell’utente e, se del caso, delle nostre risposte. Informazioni promozionali. Qualora l’utente accetti di ricevere comunicazioni commerciali da parte nostra, possiamo raccogliere informazioni quali: nome, indirizzo e-mail, numero di telefono, preferenze dell’utente e, se pertinenti, informazioni sull’account e sul profilo dell’utente, compresi i Servizi e le funzioni utilizzate. Qualora l’utente partecipi ad attività speciali, offerte, programmi o promozioni da noi proposti, possiamo inoltre raccogliere alcuni dati di contatto, l’età e qualsiasi altra informazione richiesta dalla legge. Nel caso in cui l’utente vinca una promozione, potremmo inoltre dover raccogliere alcune informazioni fiscali e/o rinunce e autorizzazioni, a seconda del premio. Risposte e feedback. Qualora l’utente partecipi a sondaggi, questionari o attività di ricerca o iniziative condotte da noi, riguardanti ad esempio la soddisfazione degli utenti o altre finalità di questo tipo, possiamo raccogliere le risposte e i feedback dell’utente, nonché qualsiasi altra informazione l’utente decida di fornire. Eventi e dati di registrazione. Possiamo inoltre raccogliere informazioni personali relative alla partecipazione dell’utente ai nostri eventi e ad altre richieste inviateci dall’utente in relazione ai nostri Servizi. Ad esempio, se l’utente si iscrive o partecipa a un evento tenuto o sponsorizzato da noi, possiamo raccogliere informazioni relative alla sua iscrizione e partecipazione a tale evento. Preferenze e altre richieste. Possiamo inoltre raccogliere informazioni riguardanti le preferenze dell’utente, comprese le preferenze di comunicazione, le preferenze riguardanti l’uso dei nostri Servizi e qualsiasi altra preferenza o richiesta fornita dall’utente durante le sue interazioni con noi. Informazioni sullo sviluppo commerciale Al fine di valutare e perseguire potenziali opportunità commerciali, possiamo raccogliere e ricevere informazioni personali riguardanti clienti attuali, precedenti e potenziali, fornitori e prestatori di servizi, e partner commerciali, comprese le informazioni di contatto e altri identificatori simili, informazioni aziendali e professionali e registri di comunicazioni. Informazioni biometriche raccolte con il consenso dell’utente per scopi limitati. In generale non raccogliamo informazioni biometriche dagli utenti. Tuttavia, in alcune circostanze, possiamo chiedere all’utente di acconsentire al trattamento di informazioni e identificativi biometrici per combattere account fraudolenti (compresi i bot) e altri usi impropri dei nostri Servizi, per la stima e la verifica dell’età e per la verifica del profilo. Per ulteriori dettagli consultare la nostra Informativa specifica sui dati biometrici, disponibile qui. Informazioni personali raccolte da terze parti. Possiamo raccogliere e ricevere alcune informazioni personali riguardanti l’utente da fonti terze, come partner commerciali, clienti e altri utenti TMG, fornitori di analisi dei dati e di servizi di marketing, sistemi operativi e piattaforme di social media, database pubblici e fornitori e prestatori di servizi che forniscono servizi o svolgono funzioni per nostro conto. Ad esempio, possiamo raccogliere il nome dell’utente, i suoi dati di contatto e altre informazioni di questo tipo da partner commerciali e da fornitori e prestatori di servizi ai fini della fornitura dei nostri Servizi. Inoltre, possiamo raccogliere da fonti terze le seguenti informazioni: Informazioni relative alla registrazione ai social media e ad altre piattaforme. Durante l’utilizzo dei nostri Servizi, l’utente può scegliere di condividere informazioni o contenuti, di accedere o registrarsi ai Servizi attraverso varie piattaforme di social media, servizi di social networking o altre funzioni o servizi integrati di terze parti. Quando l’utente si connette ai nostri Servizi tramite i propri account di social media o altre funzioni e servizi integrati di questo tipo, possiamo raccogliere o ricevere informazioni personali riguardanti l’utente fornite dall’utente all’account, al servizio o alla funzione di social media in questione. Ad esempio, possiamo raccogliere dall’account e dal profilo dell’utente informazioni quali: nome, indirizzo e-mail, user ID, immagine del profilo, elenco degli amici e altre informazioni di questo tipo disponibili sul profilo dell’utente. Suggeriamo di controllare le impostazioni sulla privacy di ciascuna piattaforma, funzione o servizio integrato di social media al fine di una migliore comprensione dell’uso, della divulgazione e in generale del trattamento delle informazioni personali da parte di tali parti. Informazioni relative alle segnalazioni. Offriamo all’utente la possibilità di invitare amici o segnalare ad altri utenti l’accesso e l’uso dei nostri Servizi. Nel far ciò possiamo raccogliere e ricevere alcune informazioni personali riguardanti l’utente, comprese le informazioni fornite da altri utenti e clienti TMG, attuali o potenziali, che prendono parte a tali attività. Informazioni su lead e prospect. Possiamo ricevere da terzi informazioni su lead e prospect riguardanti potenziali clienti interessati ai nostri Servizi. Possiamo inoltre collaborare con terzi per migliorare o aggiornare le nostre informazioni sui clienti. Ad esempio, possiamo raccogliere alcune informazioni personali da fornitori di analisi dei dati e di servizi di marketing per raggiungere nuovi clienti, o da partner commerciali e da fornitori e prestatori di servizi ai fini della fornitura dei nostri Servizi. Informazioni personali raccolte in modo automatico. Noi e i nostri prestatori di servizi terzi possiamo raccogliere o ricavare automaticamente le informazioni personali dell’utente relative all’utilizzo dei nostri Servizi, anche attraverso l’uso di cookie, tag di pixel e altre tecnologie di questo tipo. Le informazioni personali raccolte in modo automatico comprendono: Informazioni sul dispositivo e sulla navigazione. Quando l’utente utilizza i nostri Servizi, possiamo raccogliere informazioni quali: nome del browser, nome del dominio, visualizzazione delle pagine, orari di accesso, indicazioni di data/ora, sistema operativo, lingua, tipo di dispositivo, ID univoco, provider di servizi internet, URL di riferimento e di uscita, dati del flusso di navigazione, sistema operativo, lingua e altre informazioni di questo tipo su dispositivo e navigazione. Attività e utilizzo Possiamo inoltre raccogliere informazioni in relazione all’utilizzo dei nostri Servizi da parte dell’utente, ad esempio informazioni riguardanti link cliccati, ricerche, funzioni utilizzate, elementi visualizzati, tempo trascorso all’interno dei Servizi, interazioni con noi e con altri all’interno dei Servizi e altre informazioni di questo tipo in merito ad attività e utilizzo. Informazioni sulla posizione. Possiamo inoltre raccogliere o ricavare informazioni sulla posizione generale dell’utente, ad esempio attraverso il suo indirizzo IP. Per maggiori informazioni sull’uso dei cookie e di altre tecnologie simili da parte nostra, consultare la Sezione 5. Cookie, contenuti mirati e analisi. 3. Finalità della raccolta e del trattamento In generale possiamo raccogliere, utilizzare, divulgare e trattare in altro modo le categorie di informazioni personali che raccogliamo per le seguenti finalità: Servizi e assistenza. Per fornire e far funzionare i nostri Servizi, gestire l’account dell’utente, comunicare con l’utente in merito all’utilizzo dei Servizi, fornire risoluzione dei problemi, assistenza tecnica o per scopi di assistenza analoghi, e per rispondere alle domande dell’utente, soddisfare le sue richieste, agevolare l’elaborazione dei pagamenti e in generale per svolgere le nostre operazioni quotidiane. Analisi e miglioramenti. Per meglio comprendere in che modo gli utenti accedono e utilizzano i Servizi e per altri scopi di ricerca e analisi, ad esempio per valutare e migliorare il Sito, i nostri Servizi e le operazioni commerciali, nonché per sviluppare i nostri Servizi e le relative funzioni, per il controllo qualità interno"
year_published = 2025
