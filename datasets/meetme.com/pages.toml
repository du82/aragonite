description = "Leia os Termos e Condições da MeetMe para entender as diretrizes de uso dos nossos serviços e as proteções legais em vigor para os usuários."
full_description = "Termos e Condições Terms of Service for MeetMe Last Updated: December 3, 2024 Assinantes no Arizona, Califórnia, Colorado, Connecticut, Illinois, Iowa, Minnesota, Nova York, Carolina do Norte, Ohio e Rhode Island: Você, o comprador, pode cancelar sua assinatura, sem penalidade ou obrigação, a qualquer momento antes da meia-noite do terceiro dia útil após a data da assinatura, exceto domingos e feriados. Para cancelar a assinatura, os usuários podem solicitar um reembolso entrando em contato com os Serviços para Membros do The Meet Group em support@themeetgroup.com, ou enviando ou entregando uma notificação assinada e datada que declare que você, o comprador, está cancelando este contrato, ou palavras de efeito semelhante. Inclua também seu nome e endereço de e-mail, número de telefone ou outro identificador exclusivo que você usou para criar sua conta. Este aviso deverá ser enviado para: The Meet Group, Attn: Cancellations, 100 Union Square Drive, New Hope, PA 18938, EUA. Os negócios da empresa são conduzidos, em parte, em 100 Union Square Drive, New Hope, PA 18938, EUA. Você pode receber estes termos de uso por e-mail enviando uma carta para The Meet Group Terms Inquiries, 100 Union Square Drive, New Hope, PA 18938, EUA. Se você assinou usando um Serviço Externo (por exemplo, Apple App Store, Google Play), você deve cancelar por meio do seu Serviço Externo. Se você assinou pelo seu ID Apple, os reembolsos serão administrados pela Apple, não pelo The Meet Group. Você pode solicitar um reembolso da Apple por meio da sua conta Apple no seu telefone ou em https://getsupport.apple.com. Somente para assinantes da Califórnia: De acordo com o Código Civ. Cal. §1789.3, você pode relatar reclamações à Unidade de Assistência a Reclamações da Divisão de Serviços ao Consumidor do Departamento de Assuntos do Consumidor da Califórnia entrando em contato por escrito na Consumer Information Division, 1625 North Market Blvd., Suite N112 Sacramento, CA 95834, ou pelo telefone (800) 952-5210. Assinantes em Wisconsin: CANCELAMENTO E REEMBOLSOS. Direito de cancelamento. Você tem permissão para cancelar este contrato até meia-noite do terceiro dia após a data em que assinou o contrato. Se, dentro desse período, você decidir cancelar este contrato, poderá fazê-lo notificando o The Meet Group por escrito, enviado ou entregue ao The Meet Group no endereço indicado no contrato (The Meet Group, Attn: Cancellations, 100 Union Square Drive, New Hope, PA 18938, EUA), dentro do período descrito anteriormente. Se o cancelamento for feito, todos os pagamentos feitos pelo usuário serão reembolsados em até 21 dias após a entrega do aviso de cancelamento, e qualquer prova de dívida executada pelo usuário será cancelada pelo The Meet Group e serão tomadas providências para isentá-lo de qualquer obrigação adicional de pagamento. Se você assinou usando um Serviço Externo (por exemplo, Apple App Store, Google Play), você deve cancelar por meio do seu Serviço Externo. Se você assinou pelo seu ID Apple, os reembolsos serão administrados pela Apple, não pelo The Meet Group. Você pode solicitar um reembolso da Apple por meio da sua conta Apple no seu telefone ou em https://getsupport.apple.com. Índice A. Termos de Serviço 1. INTRODUÇÃO 2. ELEGIBILIDADE DA CONTA E USO DE MEETME 3. REGISTRO 4. ASSINATURAS E MOEDA NO APLICATIVO 4.1. ASSINATURAS 4.2. DIREITO DE CANCELAR A ASSINATURA 4.3. CREDITS E PRESENTES VIRTUAIS 4.4. DIAMANTES 5. POLÍTICA DE NÃO SPAM 6. CONTEÚDO 7. DISPONIBILIDADE DO SERVIÇO 8. NEGOCIAÇÕES COM ANUNCIANTES E CONTEÚDO DE TERCEIROS 9. SEM VERIFICAÇÃO DE ANTECEDENTES CRIMINAIS OU DE IDENTIDADE 10. AVISO DE FOTOSSENSIBILIDADE: LER ANTES DE REPRODUZIR 11. ISENÇÃO DE GARANTIAS 12. LIMITAÇÃO DE RESPONSABILIDADE 13. EXCLUSÕES E LIMITAÇÕES 14. INDENIZAÇÃO 15. LEI APLICÁVEL E FORO 16. ACORDO DE ARBITRAGEM, RENÚNCIA A AÇÕES COLETIVAS E RENÚNCIA A JULGAMENTOS COM JÚRI 17. Aviso da Lei de Direitos Autorais do Milênio Digital 18. CONTRATO INTEGRAL 