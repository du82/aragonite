n kontrol edilen bir özelliktir. Genel olarak, satın alınan abonelikler, süreleri dolsa veya iptal edilseler bile iade edilemez (bölgenizde iade için özel koşullar geçerli değilse) ve devredilemez. Abonelik satın alma fiyatını ve aboneliklere dahil edilen özellikleri her zaman değiştirebiliriz. Abonelik vermeyi herhangi bir zamanda durdurma ve abonelikler için son kullanma tarihleri belirleme hakkını saklı tutarız. Abonelikler herhangi bir para tutarı veya maddi değer karşılığında kullanılamaz. Hesabınızı silerseniz veya hesabınız herhangi bir nedenle sonlandırılırsa kullanılmamış abonelik süresinin tamamını, geri ödeme veya başka bir tazminat olmaksızın kaybedersiniz. 4,2.ABONELİĞİ SONLANDIRMA HAKKI Aboneliğinizi kabul tarihinden itibaren on dört (14) gün içinde herhangi bir nedenle sonlandırma (veya abonelikten cayma) hakkına sahipsiniz. Avrupa Ekonomik Alanı sakinleri için, bu hakla ilgili daha fazla bilgi için lütfen Bölüm 22’ye bakın. Ayrıca, yasanın gerektirdiği durumlarda, abonelik süresi içinde vefat etmeniz halinde mirasçılarınız, aboneliğinizin kullanılmamış kısmı için geri ödeme talep etme hakkına da sahiptir. Bu haklardan herhangi birini kullanabilmek için siz (veya uygulanabilir ise mirasçılarınız), aboneliğinizi sonlandırma kararınızı açık bir şekilde beyan eden bir bildirimle bize, The Meet Group, Inc., 100 Union Square Drive, New Hope, PA 18938, Attention: Member Services adresine iadeli taahhütlü mektup göndererek veya support@themeetgroup.com adresine e-posta göndererek bildirimde bulunmalısınız. Sonlandırma süresine uyabilmek için, on dört günlük sonlandırma süresi dolmadan önce sonlandırma hakkınızı kullandığınıza dair bildirimde bulunmalısınız. Aboneliğinizi sonlandırırsanız (veya abonelikten cayarsanız) aldığımız ödemeleri, kullandığınız Credits miktarını düşerek iade edeceğiz. Credits satın almanızı sonlandırmak (veya caymak) isterseniz aldığımız ödemeleri, kullandığınız Credits miktarını düşerek iade edeceğiz. Android kullanıcısıysanız orijin