mento non utilizzato senza possibilità di rimborso o di altra forma di risarcimento. 4.2. DIRITTO DI DISDETTA DELL’ABBONAMENTO L’utente ha il diritto di disdire (o di recedere da) il proprio abbonamento entro quattordici (14) giorni dall’accettazione per qualsiasi motivo. Gli utenti residenti nello Spazio Economico Europeo sono pregati di consultare la Sezione 22 per ulteriori informazioni su questo diritto. Inoltre, se previsto dalla legge, gli eredi dell’utente hanno il diritto di richiedere il rimborso della parte non utilizzata dell’abbonamento, in caso di decesso dell’utente durante il periodo di abbonamento. Per esercitare uno di questi diritti, l’utente (o, se del caso, i suoi eredi) devono inviare una comunicazione tramite raccomandata all’indirizzo The Meet Group, Inc.100 Union Square DriveNew Hope, PA 18938, Attention: Member Services, o tramile e-mail all’indirizzo support@themeetgroup.com con una chiara dichiarazione della propria decisione di disdire l’abbonamento. Al fine di rispettare la sc"
