 RIGHTS. PLEASE READ IT CAREFULLY. We reserve the right to change these TOS at any time. You are responsible to keep yourself apprised of any such changes. If we make any material change to the TOS, we will notify you of such change when you open MeetMe. If you object to any Terms of Service of the TOS or any subsequent changes or you become dissatisfied with MeetMe in any way, your only option is to stop using MeetMe. Your continued use of MeetMe after we post revised TOS means that you agree to the revisions. We use the term “Users” in these TOS to include all end users of MeetMe, including end users who are streaming or broadcasting through MeetMe (“Streamers”). MeetMe operates within a network of other applications owned or operated by TMG and/or Live Partners (“Live Network”). To find out which Live Partners are in the Live Network, please click here. 2. ACCOUNT ELIGIBLITY AND USE OF MEETME You must be at least 18 years old to register for MeetMe. If you are under the age of 18, you may not access or use MeetMe. By accessing the Services and/or completing the registration process for MeetMe, you represent that you are 18 years of age or older and can and will be legally bound by this Agreement. MeetMe is for your personal use only and you may not use it for any other purpose. You may not use MeetMe in connection with any commercial activity without our express written approval. Companies and other organizations may not become Users of MeetMe nor use MeetMe without our express written approval. We reserve the right to investigate any suspected unauthorized uses of MeetMe and we may take action in our sole discretion, including without limitation seeking legal, civil, criminal, or injunctive relief. You may not use MeetMe where prohibited by law, and you agree to comply with all local rules regarding online conduct and acceptable content. 3. REGISTRATION To access and use MeetMe you will need to register. To do this, you will need to choose an available registration option, such as email, SMS, Sign in with Apple, Sign in with Google or Facebook, and provide login credentials, such as email address and a password of your choice. You are responsible for keeping your password and account credentials confidential. Furthermore, you are responsible for any and all culpably caused activities that occur under your account. You agree to immediately notify us of any unauthorized use of your account or any other breach of security once you receive knowledge of it. You can delete your account by going to Settings and selecting the option to delete your account. We may delete your account if you are inactive for more than two years. To prevent this you have to log in at least once every two years. 4. SUBSCRIPTIONS AND IN-APP CURRENCY 4.1. SUBSCRIPTIONS You may purchase a subscription product in various packages, such as one-month, three-month, or six-month subscriptions. A purchase of a subscription concluded, billed, charged, renewed and can be cancelled or terminated as described in these TOSs. If you purchase through the Apple App Store or Google Play, your purchase is subject to the technical standards and principles established by Apple or Google, over which we have no control. Your subscription will renew automatically for the same amount of time as your original subscription unless you switch off the auto-renew feature at least 24 hours before the end of your current subscription. This is because your account may be charged for renewal within 24 hours prior to the end of your current subscription period. You can manage your subscription and switch off auto-renewal by accessing your Apple or Google account settings. You can also follow the instructions how to cancel a subscription provided by Apple (https://getsupport.apple.com/) or Google (https://support.google.com/googleplay/). You may not cancel your current subscription during the subscription period, although you may cancel automatic renewal at any time. If you subscribed through the Apple App Store, refunds are handled by Apple, not us. You can request a refund from Apple as described above. All other users may request a refund by contacting us at support@themeetgroup.com, or by mailing or delivering a signed and dated notice that states that you are cancelling this agreement, or words of similar effect. Please also include your name and the email address, phone number, or other unique identifier you used to sign up for your account. This notice shall be sent to: The Meet Group, Attn: Cancellations, 100 Union Square Drive, New Hope, PA 18938, USA. Both Apple and Google facilitate “free trials” of subscription products for first-time users and we may take advantage of that ability. For example, from time to time we may offer a free initial week to first-time subscribers. Eligibility for any such trial is limited to users who have not previously subscribed, through either a current or prior MeetMe account. If you are a previous subscriber and try to claim a free trial, you should be aware that Apple or Google may recognize your ineligibility. If so, you may not receive a free trial, but instead may be charged immediately for your first subscription month. This is a feature controlled by the Apple App Store or the Google Play Store, depending on which platform you use for MeetMe. Generally, purchases of subscriptions are non-refundable (unless special terms for refunds apply in your region) and non-transferable, even if they expire or are discontinued. We may change the purchase price for subscriptions at any time, as well as the features included in subscriptions. We reserve the right to stop issuing subscriptions at any time and to set expiration dates for subscriptions. Subscriptions may not be redeemed for any sum of money or monetary value. If you delete your account or your account is terminated for any reason, you will lose all unused subscription time without refund or other compensation. 4.2. RIGHT TO TERMINATE SUBSCRIPTION You have the right to terminate (or withdraw from) your subscription within fourteen (14) days of acceptance, for any reason. For residents of the European Economic Area, please refer to section 22 for further information on this right. In addition, where required by law, your estate is entitled to claim a refund of the unused portion of your subscription if you die during the term of the subscription. In order to exercise either of these rights, you (or, if applicable, your estate) must notify us by registered mail at The Meet Group, Inc., 100 Union Square Drive, New Hope, PA 18938, Attention: Member Services, or by email at support@themeetgroup.com with a clear declaration of your decision to terminate your subscription. In order to meet the termination deadline, you should send us notification of your exercise of the right of termination prior to the expiration of the fourteen-day termination period. If you terminate (or withdraw) from your subscription, we will refund the payments we have received from you, minus any amount of Credits that you have consumed. If you wish to terminate (or withdraw from) your purchase of Credits, we will refund the payments we have received from you, minus any amount of Credits that you have consumed. If you are an Android user, we will use the same means of payment that you used for the original transaction. If you are an iOS, personal computer, or mobile web user, we will refund you by paper check or PayPal if you provide the proper contact information to process these payments. In no case will you be charged for this refund. 4.3. CREDITS AND VIRTUAL GIFTS You can purchase or otherwise obtain “Credits” from us. Credits give you a limited, non-transferable, non-sublicensable, revocable right to activate in-app features like virtual gifts on MeetMe. Virtual gifts are live animations which are provided by MeetMe. You may trigger a virtual gift in the stream of a Streamer within the Live Network. If you purchase through the Apple App Store or Google Play, your purchase is subject to the technical standards and principles established by Apple or Google, over which we have no control. If you trigger a virtual gift, this does not create a contractual relationship between you and the Streamer in whose stream the gift is triggered. Whether and to what extent a Streamer receives diamonds is entirely at our discretion. Credits are non-refundable even if they expire, are revoked or are discontinued. The price for each virtual gift will be displayed at the point of purchase. All sales of Credits are final, and we do not offer credit or refund for any purchased Credits. When you receive virtual gifts from other Users, you do not own them. Instead, you receive a specified corresponding number of Diamonds which may be used as set forth below. We are not responsible for repairing or replacing virtual gifts or providing you or any third party with any credit or refund in the event that we modify, suspend, or terminate the virtual gift program, or for "
