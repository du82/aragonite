full_description = "Uyumluluk Sorumlu eylem bir tutum gerektirir ve süreklilikle gelişir. Bunun için ProSiebenSat.1 Media SE’nin bir yan kuruluşu olarak yaşamak istediğimiz bir dizi değerimiz var. Sosyal bir sorumluluğumuz var ve bunu çok ciddiye alıyoruz – özellikle de günlük işlerde uyumlu davranış talebimiz aracılığıyla. ProSiebenSat.1 Media SE’nin bir iştiraki olarak Uyum Yönetim Sistemimiz hakkındaki bilgilere buradan ulaşabilirsiniz. Özellikle Alman Tedarik Zinciri Tedarik Yükümlülükleri Yasası (Lieferkettensorgfaltspflichtengesetz) ile bağlantılı olarak ihbar sistemimize de bu bağlantı üzerinden ulaşabilirsiniz. Şubat 2024 ile Ağustos 2024 arasında, Avrupa Birliği (AB) içinde MeetMe e giriş yapan ve profilini aktif olarak kullanan kullanıcıların ortalama sayısı 45 milyondan önemli ölçüde düşüktü."
