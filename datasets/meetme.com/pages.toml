title = "Privacybeleid - MeetMe"
description = "Bekijk het privacybeleid van MeetMe om te begrijpen hoe wij uw persoonlijke gegevens verzamelen, gebruiken en beschermen en tegelijkertijd een veilige gebruikerservaring garanderen."
full_description = "Privacybeleid Last Updated: December 30, 2024 Voor gebruikers in de EER, Zwitserland en het VK is een apart privacybeleid van toepassing. Dit kunt u hieronder vinden of klik hier. Inhoudsopgave I. Privacybeleid 1. Toepassingsgebied 2. Verzamelde persoonlijke informatie 3. Doeleinden voor verzameling en verwerking 4. Bekendmaking van persoonsgegevens 5. Cookies, targeting en analytics 6. Uw privacykeuzes 7. Externe koppelingen en functies 8. Door gebruikers gegenereerde inhoud 9. Beveiliging 10. Privacy van kinderen 11. Wijzigingen in dit Beleid 12. Contact 13. Aanvullende privacyinformatie voor bepaalde rechtsgebieden II. Privacybeleid voor gebruikers die woonachtig zijn in de Europese Economische Ruimte, Zwitserland of het Verenigd Koninkrijk 1. Toepassingsgebied 2. Verzamelde persoonlijke informatie 3. Doeleinden voor verzameling en verwerking 4. Bekendmaking van persoonsgegevens 5. Doorgifte van persoonsgegevens van gebruikers uit landen buiten de EER/VK/CH 6. Cookies, targeting en analytics 7. Uw privacykeuzes 8. Bewaartermijn van persoonlijke informatie 9. Externe koppelingen en functies 10. Door gebruikers gegenereerde inhoud 11. Beveiliging 12. Privacy van kinderen 13. Wijzigingen in dit Beleid 14. Contact 15. Aanvullende privacyinformatie voor bepaalde rechtsgebieden I. Privacy Policy De Meet Group, Inc. en haar merken, filialen en dochterondernemingen (‛TMG’, ‛wij’, ‛ons’ of ‛onze’) hechten waarde aan uw privacy. In dit privacybeleid (‛Beleid’) wordt beschreven hoe TMG de in dit beleid beschreven persoonlijke informatie verzamelt, gebruikt, openbaar maakt en op andere wijze verwerkt, evenals de rechten en keuzes die u hebt met betrekking tot dergelijke persoonlijke gegevens. Aanvullende informatie over de privacykeuzes die u hebt met betrekking tot uw persoonlijke gegevens kunt u vinden in paragraaf 6. Uw privacykeuzes, evenals paragraaf 13. Aanvullende privacyinformatie voor bepaalde rechtsgebieden, die aanvullende informatie bevat over de privacyrechten van inwoners van bepaalde rechtsgebieden. Als u in Californië woont, raadpleeg dan paragraaf 13.B. Aanvullende informatie voor inwoners van Californië voor informatie over de categorieën persoonlijke informatie die wij verzamelen en uw rechten volgens de privacywetgeving van Californië. Voor gebruikers van Skout of MeetMe: Wanneer u een profiel aanmaakt op Skout of MeetMe, kunnen uw persoonlijke gegevens zichtbaar zijn voor gebruikers op beide platforms. Evenzo, wanneer u de live-functie gebruikt die beschikbaar is op MeetMe, Skout en Tagged, kunnen sommige van uw persoonlijke gegevens zoals gebruikersnaam, naam, leeftijd, geslacht en seksuele geaardheid in overeenstemming met uw privacy-instellingen ook zichtbaar zijn voor gebruikers van andere applicaties die wij bezitten, en andere applicaties en websites die geen eigendom van ons zijn maar waarmee wij ons live-platform delen. Deze andere gebruikers kunnen zich over de gehele wereld bevinden. Voor een lijst van onze huidige live partners, klik hier voor MeetMe en Skout, en hier voor Tagged. U kunt deze functie niet uitschakelen als u ervoor kiest om live te gaan. Uw gebruik van onze Diensten is onderworpen aan onze Algemene Voorwaarden, met inbegrip van de toepasselijke voorwaarden inzake schadebeperking en geschillenbeslechting. 1. Toepassingsgebied Tenzij hieronder anders beschreven, is dit Beleid van toepassing op de persoonsgegevens die TMG verzamelt en verwerkt met betrekking tot: bezoekers van onze website waar dit Beleid is geplaatst, met inbegrip van onze websites die een link bevatten naar dit Beleid of dit Beleid plaatsen (de ‛Sites’); personen die onze mobiele applicaties (‛Mobiele Apps’) downloaden en gebruiken; personen die zich registreren voor of deelnemen aan evenementen, enquêtes, onderzoeken, promoties en sweepstakes die door ons worden uitgevoerd; huidige, voormalige en toekomstige klanten, verkopers en serviceproviders en zakelijke partners; en personen die met ons communiceren of anderszins interageren of zich bezighouden met ons of de diensten die beschikbaar zijn via onze Sites, Mobiele Apps of andere online diensten (gezamenlijk aangeduid als de ‛Diensten’). 2. Verzamelde persoonlijke informatie Zoals hieronder verder wordt beschreven, kunnen wij persoonsgegevens rechtstreeks van u verzamelen, uit bronnen van derden of ook automatisch door uw gebruik van onze Diensten. Direct verzamelde persoonlijke informatie. Hoewel de persoonlijke informatie die wij verzamelen varieert afhankelijk van uw gebruik van onze Diensten en onze interacties met u, kunnen wij in het algemeen de volgende categorieën persoonlijke informatie rechtstreeks van u verzamelen: Contactgegevens. Wanneer u contact met ons opneemt, inclusief als u ons een bericht stuurt of u aanmeldt om meer over onze Diensten te weten te komen, kunnen wij uw naam, e-mailadres, telefoonnummer of andere vergelijkbare identificatiegegevens verzamelen, evenals uw bericht, de aard van uw vraag en alle andere informatie die u vrijwillig verstrekt. Account- en profielinformatie. Wanneer u zich aanmeldt voor een account in verband met onze Diensten, kunnen wij uw naam, e-mailadres, telefoonnummer, adres (bijv. postcode), gebruikersnaam en wachtwoord, geboortedatum, etniciteit en geslacht, profielafbeelding en foto, en factuuradresgegevens verzamelen, evenals alle andere informatie die u verstrekt in verband met het aanmaken of onderhouden van uw account, of die u anderszins via uw account aan ons verstrekt. Aankopen, betalingen en beloningen. Wanneer u een aankoop of betaling doet via onze Diensten, kunnen wij informatie verzamelen zoals het type betaling, betaalkaartgegevens, facturerings- en verzendadres, aankoopinformatie en alle andere financiële of commerciële informatie die nodig is voor het faciliteren van onze Diensten. Communicatie en interacties. Wanneer u ons een e-mail stuurt, ons belt of op andere wijze met ons of met andere TMG-gebruikers communiceert of interageert, inclusief als u zich aanmeldt voor onze mailinglijsten, formulieren invult op onze Sites of Mobiele Apps, interageert met onze sociale mediapagina’s, een recensie of getuigenis plaatst, inhoud indient in online discussiegroepen of anderszins informatie invoert in openbare commentaarvelden, blogs of gemeenschapsforums gesponsord door of verbonden aan TMG, kunnen wij bestanden verzamelen, ontvangen en bijhouden met betrekking tot uw contactgegevens, communicatie en interacties, uw berichten of inzendingen en, in voorkomend geval, onze reacties daarop. Promotionele informatie. Als u ermee instemt om marketingcommunicatie van ons te ontvangen, kunnen wij uw naam, e-mailadres, telefoonnummer, voorkeuren en, indien relevant, informatie over uw account en profiel verzamelen, met inbegrip van de Diensten en functies waarvan u gebruikmaakt. Als u deelneemt aan speciale activiteiten, aanbiedingen, programma’s of promoties die wij aanbieden, kunnen wij ook bepaalde contactgegevens, uw leeftijd en andere wettelijk verplichte informatie verzamelen. Als u een promotie wint, moeten wij mogelijk ook bepaalde belastinggegevens en/of verklaringen van afstand en vrijwaringen verzamelen, afhankelijk van de prijs. Reacties en feedback. Als u deelneemt aan enquêtes, vragenlijsten of onderzoeksactiviteiten of -initiatieven die door ons worden uitgevoerd, zoals onderzoeken naar gebruikerstevredenheid en andere soortgelijke doeleinden, kunnen wij uw antwoorden en feedback verzamelen, evenals alle andere informatie die u verkiest te verstrekken. Evenementen en registratiegegevens. Wij kunnen ook persoonsgegevens verzamelen met betrekking tot uw deelname aan onze evenementen en andere verzoeken die u bij ons indient in verband met onze Diensten. Als u zich bijvoorbeeld registreert voor of deelneemt aan een evenement dat wij organiseren of sponsoren, kunnen wij informatie verzamelen met betrekking tot uw registratie voor en deelname aan een dergelijk evenement. Voorkeuren en andere verzoeken. Wij kunnen ook informatie verzamelen over uw voorkeuren, waaronder communicatievoorkeuren, voorkeuren met betrekking tot uw gebruik van onze Diensten, alsmede andere voorkeuren of verzoeken die u in uw interactie met ons opgeeft. Informatie over bedrijfsontwikkeling. Om potentiële zakelijke kansen te beoordelen en na te streven, kunnen wij persoonlijke informatie verzamelen en ontvangen over huidige, voormalige en toekomstige klanten, verkopers en dienstverleners, en zakelijke partners, waaronder contactgegevens en andere soortgelijke identificatoren, bedrijfs- en professionele informatie en communicatiebestanden. Biometrische informatie verzameld met uw toestemming voor beperkte doeleinden. Over het algemeen verzamelen wij geen biometrische gegevens van gebruikers. Evenwel kunnen wij u onder bepaalde omstandigheden vragen om toestemming te geven voor het verwerken van biometrische gegevens en identificatoren om frauduleuze accounts (inclusief bots) en ander misbruik van onze Diensten, leeftijdsschatting en verificatiedoeleinden, en profielverificatiedoeleinden te bestrijden. Meer informatie kunt u vinden in onze specifieke kennisgeving over biometrische gegevens, die u hier kunt openen. Persoonsgegevens verzameld van derden. Wij kunnen ook bepaalde persoonsgegevens over u verzamelen of ontvangen van derden, zoals zakelijke partners, klanten en andere TMG-gebruikers, leveranciers van gegevensanalyses en marketing, besturingssystemen en platforms voor sociale media, openbare databases, en verkopers en dienstverleners die namens ons diensten verlenen of functies uitvoeren. Wij kunnen bijvoorbeeld uw naam, contactgegevens en andere soortgelijke informatie verzamelen van zakelijke partners, verkopers en dienstverleners ten behoeve van het leveren van onze Diensten. Daarnaast kunnen wij de volgende informatie van derden verzamelen: Registratiegegevens van sociale media en platforms. Tijdens het gebruik van onze Diensten kunt u ervoor kiezen om informatie of inhoud te delen en om u aan te melden bij of in te loggen op de Diensten via verschillende sociale mediaplatforms, sociale netwerkservices of andere functies of geïntegreerde diensten van derden. Wanneer u verbinding met onze Diensten maakt via uw sociale media-accounts of via andere vergelijkbare geïntegreerde diensten en functies, kunnen wij persoonlijke informatie over u verzamelen of ontvangen die u hebt verstrekt aan die sociale media-account, dienst of functie. Zo kunnen wij bijvoorbeeld informatie van uw account en profiel verzamelen, zoals uw naam, e-mailadres, gebruikers-ID, profielfoto, vriendenlijst en andere soortgelijke informatie die op uw profiel beschikbaar is. Controleer uw privacy-instellingen op elk platform voor sociale media, functie of geïntegreerde dienst om beter te begrijpen hoe uw persoonlijke gegevens door deze partijen worden gebruikt, bekendgemaakt of anderszins worden verwerkt. Verwijzingsinformatie. Wij kunnen u de mogelijkheid bieden om vrienden uit te nodigen of andere gebruikers door te verwijzen voor toegang tot of gebruik van onze Diensten. In een dusdanig geval kunnen wij bepaalde persoonsgegevens over u verzamelen en ontvangen, waaronder van andere huidige of potentiële gebruikers en klanten van TMG die zich op vergelijkbare wijze met deze activiteiten bezighouden. Lead- en prospectinformatie. Het is mogelijk dat wij lead- en prospectinformatie ontvangen van derden over potentiële klanten die wellicht geïnteresseerd zijn in onze Diensten. Wij kunnen ook samenwerken met derden om onze klantinformatie te verbeteren of bij te werken. Wij kunnen bijvoorbeeld bepaalde persoonlijke informatie van leveranciers van gegevens- en marketinganalyses ontvangen die ons in staat stelt om nieuwe klanten of zakelijke partners, verkopers en dienstverleners voor het leveren van onze Diensten te benaderen. Automatisch verzamelde persoonlijke informatie. Wij en onze externe dienstverleners kunnen automatisch persoonlijke informatie over u verzamelen of afleiden met betrekking tot uw gebruik van onze Diensten, onder meer door het gebruik van cookies, pixeltags en andere soortgelijke technologieën. De persoonlijke informatie die wij automatisch kunnen verzamelen, omvat: Apparaat- en browserinformatie. Wanneer u onze Diensten gebruikt, kunnen wij browsertype, domeinnaam, bekeken pagina’s, toegangstijden, datum/tijdstempels, besturingssysteem, taal, apparaattype, unieke ID, internet-serviceprovider, verwijzende en verlatende URL’s, clickstreamgegevens, besturingssysteem, taal en soortgelijke informatie van uw apparaat en browser verzamelen. Activiteiten en gebruik. Wij kunnen ook activiteitsinformatie verzamelen met betrekking tot uw gebruik van de Diensten, zoals informatie over de links waarop u klikt, zoekopdrachten, gebruikte functies, bekeken items, de tijd die u binnen de Diensten doorbrengt, uw interacties met ons en met anderen binnen de Diensten en andere soortgelijke activiteits- en gebruiksinformatie. Locatiegegevens. Wij kunnen ook algemene locatiegegevens over u verzamelen of afleiden, bijv. via uw IP-adres. Meer informatie over ons gebruik van cookies en andere soortgelijke technologieën kunt u vinden in paragraaf 5. Cookies, targeting en analytics hieronder. 3. Doeleinden voor verzameling en verwerking In het algemeen kunnen wij de door ons verzamelde categorieën persoonlijke gegevens verzamelen, gebruiken, openbaar maken en anderszins verwerken voor de volgende doeleinden: Diensten en ondersteuning. Om onze Diensten te leveren en te onderhouden, uw account te beheren, met u te communiceren over uw gebruik van de Diensten, problemen op te lossen, technische ondersteuning te bieden en voor andere soortgelijke ondersteuningsdoeleinden, en om op uw vragen te reageren, aan uw verzoeken te voldoen, de verwerking van betalingen te vergemakkelijken en om onze dagelijkse activiteiten anderszins uit te voeren. Analytics en verbetering. Om beter begrip te verkrijgen over hoe gebruikers toegang verwerven en gebruik maken van de Diensten en voor andere onderzoeks- en analysedoeleinden, zoals het evalueren en verbeteren van de Site, onze Diensten en onze bedrijfsvoering, met inbegrip van het ontwikkelen van onze Diensten en de functies daarvan, alsmede voor interne kwaliteitscontrole en trainingsdoeleinden. Communicatie. Om te reageren op uw vragen, om u door u aangevraagde materialen en nieuwsbrieven alsmede informatie en materialen met betrekking tot onze Diensten en aanbiedingen toe te sturen. Wij kunnen deze gegevens ook gebruiken om u administratieve informatie te sturen, bijvoorbeeld informatie over de Diensten en wijzigingen in onze voorwaarden, bepalingen en beleidsregels. Aanpassing en personalisatie. Om inhoud die wij verzenden of op de Diensten weergeven aan te passen, inclusief het aanbieden van locatieaanpassing en andere personalisatie van uw ervaringen en aanbiedingen. Marketing en advertenties. Voor marketing-, reclame- en promotiedoeleinden. Bijvoorbeeld om u promotionele informatie toe te sturen met betrekking tot "
