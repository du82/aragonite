title = "Política de privacidad - MeetMe"
description = "Revise la Política de privacidad de MeetMe para comprender cómo recopilamos, usamos y protegemos su información personal mientras garantizamos una experiencia de usuario segura."
full_description = "Política de privacidad Last Updated: December 30, 2024 Los usuarios ubicados en el EEE, Suiza y Reino Unido están amparados por una Política de privacidad distinta. Más adelante puedes acceder a esta Política de privacidad o también puedes verla haciendo clic aquí. Índice I. Política de privacidad 1. Alcance 2. Datos personales recogidos 3. Finalidad de la recogida y el tratamiento de los datos 4. Comunicación de datos personales 5. Cookies, segmentación de mercado y análisis 6. Tus opciones de privacidad 7. Enlaces externos y características 8. Contenido generado por usuarios 9. Seguridad 10. Privacidad de menores de edad 11. Cambios en la Política 12. Contacto 13. Información de privacidad adicional para jurisdicciones específicas II. Política de privacidad para usuarios con residencia en el Espacio Económico Europeo, Suiza o el Reino Unido 1. Alcance 2. Datos personales recogidos 3. Finalidad de la recogida y el tratamiento de los datos 4. Comunicación de datos personales 5. Transferencias de datos personales en el contexto de países ubicados fuera del EEE o distintos a Suiza y al Reino Unido 6. Cookies, segmentación de mercado y análisis 7. Tus opciones de privacidad 8. Plazo de conservación de los datos personales 9. Enlaces externos y características 10. Contenido generado por usuarios 11. Seguridad 12. Privacidad de menores de edad 13. Cambios en la Política 14. Contacto 15. Información de privacidad adicional para jurisdicciones específicas I. Privacy Policy The Meet Group, Inc., sus marcas, sus filiales y sus empresas subsidiarias (en adelante, «TMG», «nosotros», «nuestro» o «nos») valoran su privacidad. En esta Política de privacidad (en adelante denominada simplemente «la Política»), se describe cómo TMG recoge, usa, comunica y trata de otros modos los datos personales descritos en la Política, así como los derechos y las opciones que tienes en relación con dichos datos personales. Para obtener más información sobre las opciones de privacidad relativas a tus datos personales, consulta el Apartado 6. Tus opciones de privacidad, así como el Apartado 13. Información de privacidad adicional para jurisdicciones específicas, donde se incluye información adicional sobre los derechos de privacidad de residentes de determinadas jurisdicciones. Si eres residente de California, consulta el Apartado 13.B. Información adicional para residentes de California para obtener más información sobre las categorías de datos personales que recogemos y tus derechos según la legislación de privacidad de California. Usuarios de Skout o MeetMe: cuando creas un perfil en Skout o MeetMe, es posible que los usuarios de ambas plataformas puedan ver tus datos personales. Del mismo modo, al usar la característica de transmisión en directo disponible en MeetMe, Skout y Tagged, es posible que algunos de tus datos personales, como el nombre de usuario, tu nombre, tu edad, el género y la orientación sexual según tu configuración de privacidad, se muestren a usuarios de otras aplicaciones nuestras y otras aplicaciones y sitios web que no nos pertenecen, pero con los que compartimos nuestra plataforma de transmisión en directo. Estos otros usuarios pueden estar en cualquier parte del mundo. Para acceder a una lista de nuestros socios actuales en las transmisiones en directo, haz clic aquí para MeetMe y Skout o aquí para Tagged. Si quieres usar la opción de transmisión en directo, debes aceptar también estas condiciones. El uso de nuestros servicios está sujeto a nuestros Términos y Condiciones, incluidas las condiciones pertinentes relativas a las limitaciones de daños y la resolución de conflictos. 1. Alcance Con la excepción de lo detallado más adelante, esta Política se aplica a los datos personales que TMG recoge y trata en relación con las personas que ingresan a nuestro sitio web donde está publicada esta Política, incluidos nuestros sitios enlazados con la Política o que la tienen publicada (en adelante, «los Sitios»), las personas que descargan y usan nuestras aplicaciones móviles (en adelante, «las Aplicaciones móviles»), las personas que se inscriben o participan en nuestros eventos, encuestas, estudios, promociones y los sorteos que realizamos, los clientes, proveedores generales y proveedores de servicios actuales, pasados y futuros y los socios comerciales, las personas que se comunican o interactúan de algún otro modo con nosotros o los servicios disponibles a través de nuestros Sitios, Aplicaciones móviles u otros servicios online (denominados en conjunto como «Servicios»). 2. Datos personales recogidos Como se describe más adelante, es posible que recojamos datos personales directamente provistos por ti, a través de terceros y de forma automática por medio de tu uso de nuestros Servicios. Datos personales que recogemos directamente provistos por ti. Si bien los datos personales que recogemos varían según tu uso de nuestros Servicios y nuestras interacciones contigo, en general, es posible que recojamos las siguientes categorías de datos personales provistos directamente por ti: Información de contacto. Al contactar con nosotros, por ejemplo, si nos envías un mensaje o te registras para obtener más información sobre nuestros Servicios, es posible que recojamos tu nombre, dirección de correo electrónico, número de teléfono u otros elementos similares de identificación, así como tu mensaje, el motivo de tu consulta y cualquier otra información que decidas incluir. Información de la cuenta y del perfil. Al crear una cuenta para acceder a nuestros Servicios, es posible que recojamos tu nombre, dirección de correo electrónico, número de teléfono, dirección (por ejemplo, código postal), nombre de usuario y contraseña, fecha de nacimiento, origen étnico, género, imagen y foto de perfil, y los datos de la dirección de facturación, así como cualquier otra información provista en el marco de la creación o del mantenimiento de tu cuenta o que nos envíes de algún otro modo a través de tu cuenta. Compras, pagos y recompensas. Al realizar una compra o un pago a través de nuestros Servicios, es posible que recojamos datos, como el modo de pago, los datos de la tarjeta de pago, la dirección de facturación y de envío, información sobre la compra y cualquier otro tipo de información financiera o comercial que sea necesaria para proveer nuestros Servicios. Comunicaciones e interacciones. Al enviarnos un correo electrónico, llamarnos o comunicarte o interactuar de algún otro modo con nosotros o con otros usuarios de TMG, incluido si te registras para recibir nuestras novedades por correo electrónico, rellenas formularios en nuestros Sitios o Aplicaciones móviles, ingresas a nuestras páginas en redes sociales, publicas una opinión o un comentario, envías contenido en algún grupo de debate online o ingresas información de alguna otra manera en campos de comentarios públicos, blogs o foros de la comunidad patrocinados por TMG o asociados a TMG, es posible que recojamos, recibamos y mantengamos un registro de tus datos de contacto, las comunicaciones e interacciones, tus publicaciones y el contenido enviado, y nuestras respuestas, si las hay. Información para promociones. Si aceptas que te enviemos comunicaciones de mercadotecnia, es posible que recojamos tu nombre, dirección de correo electrónico, y número de teléfono, tus preferencias y, si es necesario, información sobre tu cuenta y perfil, incluidos los Servicios y las características que usas. Si participas en actividades, ofertas, programas o promociones especiales que ofrezcamos, es posible que también debamos recoger algunos datos de contacto, tu edad y otros datos que exija la ley. Si ganas algún premio, es posible que debamos recoger algunos datos fiscales, así como la información de eventuales renuncias a derechos o exenciones de responsabilidad, según el premio respectivo. Respuestas y opiniones. Si participas en encuestas, cuestionarios, estudios o iniciativas que organicemos, por ejemplo, para saber el grado de satisfacción de nuestros clientes o con fines similares, es posible que recojamos tus respuestas y opiniones, así como cualquier otra información que decidas añadir. Datos relacionados con eventos e inscripciones. Es posible que también recojamos datos personales relativos a tu participación en nuestros eventos, así como otras solicitudes que nos envíes en relación con nuestros Servicios. Por ejemplo, si te inscribes o participas en un evento que organizamos o patrocinamos, es posible que recojamos información relacionada con tu inscripción y tu asistencia al evento. Preferencias y otras solicitudes. Es posible que también recojamos información sobre tus preferencias, incluidas las preferencias de comunicación, preferencias relacionadas al uso de nuestros servicios y otro tipo de preferencias y solicitudes ingresadas al interactuar con nosotros. Información de desarrollo comercial. Con el objetivo de valorar y aprovechar potenciales oportunidades comerciales, es posible que recojamos y recibamos datos personales de clientes, proveedores generales y proveedores de servicios actuales, pasados y futuros, socios comerciales, incluida la información de contacto y otros elementos similares de identificación, información empresarial y profesional, y registros de comunicaciones. Datos biométricos recogidos con tu consentimiento para fines limitados. En general, no recogemos datos biométricos de usuarios. Sin embargo, en determinadas circunstancias, es posible que solicitemos tu consentimiento para tratar información biométrica y elementos de identificación, con el fin de prevenir la creación de cuentas falsas (incluidos bots) y otros usos indebidos de nuestros Servicios, para estimar edades y con fines de verificación general y de verificación de perfiles. Para obtener más información, puedes acceder a nuestro documento específico relativo a datos biométricos aquí. Datos personales recogidos a través de terceros. Es posible también que recojamos y recibamos determinados datos personales concernientes a tu persona a través de terceros, como socios comerciales, clientes y otros usuarios de TMG, proveedores de análisis de datos y mercadotecnia, sistemas operativos y plataformas de redes sociales, bases de datos públicas, y proveedores generales y proveedores de servicios que nos ofrezcan servicios o lleven a cabo acciones en representación nuestra. A modo de ejemplo, es posible que recojamos tu nombre, tus datos de contacto y otros datos similares a través de socios comerciales, proveedores generales y proveedores de servicios con la finalidad de ofrecerte nuestros Servicios. Asimismo, es posible que también recojamos los siguientes datos a través de terceros: Información de registro en redes sociales y plataformas. Al utilizar nuestros Servicios, es posible que decidas compartir información o contenido, iniciar sesión o registrarte a través de diversas plataformas de redes sociales, servicios de establecimiento de contactos sociales u otras características o servicios integrados de terceros. Al conectarte a nuestros Servicios por medio de tus cuentas de redes sociales u otros servicios y características integrados similares, es posible que recojamos o recibamos datos personales que hayas ingresado en esa cuenta de la red social, el servicio o la característica. A modo de ejemplo, es posible que recojamos datos de tu cuenta y perfil, como tu nombre, dirección de correo electrónico, ID de usuario, foto de perfil, lista de amigos y otros datos similares disponibles en tu perfil. Para comprender mejor cómo cada plataforma de redes sociales, característica o servicio integrado puede utilizar, comunicar o tratar de otro modo tus datos personales, consulta tu configuración de privacidad en las páginas correspondientes. Información de recomendaciones. Es posible que te ofrezcamos la posibilidad de invitar amigos o que les recomiendes a otros usuarios que accedan a nuestros Servicios o los usen. Al hacer esto, es posible que recojamos y recibamos determinados datos personales sobre ti, así como de otros usuarios actuales o futuros de TMG y de clientes que participan en estas actividades de forma similar. Información sobre potenciales clientes. Es posible que recibamos información sobre potenciales clientes que podrían estar interesados en nuestros Servicios a través de terceros. Además, existe la posibilidad de que trabajemos con terceros para mejorar o actualizar nuestra base de datos de clientes. A modo de ejemplo, es posible que recibamos determinados datos personales a través de proveedores de análisis de datos y mercadotecnia con la finalidad de captar nuevos clientes, o a través de socios comerciales, proveedores generales y proveedores de servicios para poder ofrecer nuestros Servicios. Datos personales recogidos de manera automática. Es posible que tanto nosotros como nuestros proveedores de servicios externos recojamos u obtengamos de forma automática datos personales relacionados con tu uso de nuestros Servicios, por ejemplo, por medio del uso de cookies, píxeles de seguimiento y otras tecnologías similares. Entre la información personal que potencialmente recojamos de forma automática se encuentran los siguientes datos: Información de dispositivos y navegación. Al utilizar nuestros Servicios, es posible que recojamos datos como el tipo de navegador, el nombre del dominio, las páginas visitadas, los horarios de acceso, los sellos de fecha y hora, el sistema operativo, el idioma, el tipo de dispositivo, la ID única, el proveedor de Internet, la URL desde la que accedes y a la que ingresas después, datos sobre los diferentes clics que has hecho, e información similar relativa al dispositivo y a la navegación. Actividades y uso. También es posible que recojamos datos de la actividad relacionados con tu uso de los Servicios, como información sobre los enlaces en los que has hecho clic, las búsquedas, las características usadas, los elementos vistos, el tiempo que has dedicado a los Servicios, tus interacciones con nosotros y otras personas dentro de los Servicios y otros datos similares sobre la actividad y el uso. Información de la ubicación. También es posible que recojamos u obtengamos información general sobre tu ubicación, por ejemplo, a través de tu dirección IP. Para obtener más información sobre nuestro uso de cookies y otras tecnologías similares, consulta el Apartado 5. Cookies, segmentación de mercado y análisis más abajo. 3. Finalidad de la recogida y el tratamiento de los datos En general, es posible que recojamos, usemos, comuniquemos y tratemos de algún otro modo las categorías de datos personales que recogemos con las siguientes finalidades: Servicios y soporte. Para ofrecer y gestionar nuestros Servicios, gestionar tu cuenta, comunicarnos contigo sobre tu uso de los Servicios, ayudar a resolver problemas, ofrecer soporte técnico, o con fines de soporte similares, y para responder a tus consultas, cumplir con tus solicitudes, facilitar el tratamiento de pagos y llevar a cab"
