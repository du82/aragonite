 assinatura atual. Isso ocorre, porque sua conta pode ser cobrada pela renovação dentro de 24 horas antes do término do seu período de assinatura atual. Você pode gerenciar sua assinatura e desativar a renovação automática acessando as configurações da sua conta Apple ou Google. Você também pode seguir as instruções sobre como cancelar uma assinatura fornecidas pela Apple (https://getsupport.apple.com/) ou Google (https://support.google.com/googleplay/). Você não pode cancelar sua assinatura atual durante o período de assinatura, embora possa cancelar a renovação automática a qualquer momento. Se você assinou pela Apple App Store, os reembolsos serão administrados pela Apple, não por nós. Você pode solicitar um reembolso da Apple conforme descrito acima. Todos os outros usuários podem solicitar um reembolso entrando em contato conosco pelo e-mail support@themeetgroup.com, ou enviando ou entregando uma notificação assinada e datada informando que você está cancelando este contrato, ou palavras de efeito semelhante. Inclua também seu nome e endereço de e-mail, número de telefone ou outro identificador exclusivo que você usou para criar sua conta. Este aviso deverá ser enviado para: The Meet Group, Attn: Cancellations, 100 Union Square Drive, New Hope, PA 18938, EUA. Tanto a Apple quanto o Google facilitam “testes gratuitos” de produtos de assinatura para usuários iniciantes, e podemos tirar proveito dessa possibilidade. Por exemplo, podemos oferecer periodicamente uma semana inicial gratuita para assinantes de primeira viagem. A elegibilidade para qualquer teste é limitada a usuários que não tenham assinado anteriormente, por meio de uma conta atual ou anterior da MeetMe. Se você já é assinante e tenta solicitar um teste gratuito, saiba que a Apple ou o Google podem reconhecer sua inelegibilidade. Se for esse o caso, você pode não receber um teste gratuito, mas poderá ser cobrado imediatamente pelo seu primeiro mês de assinatura. Este é um recurso controlado pela Apple App Store ou pela Google Play Store, dependendo da plataforma que você usa para MeetMe. Geralmente, as compras de assinaturas não são reembolsáveis​(a menos que termos especiais para reembolsos se apliquem à sua região) e não são transferíveis, mesmo que expirem ou sejam descontinuadas. Podemos alterar o preço de compra das assinaturas a qualquer momento, bem como os recursos incluídos nas assinaturas. Reservamo-nos o direito de interromper a emissão de assinaturas a qualquer momento e de definir datas de expiração para as assinaturas. As assinaturas não podem ser resgatadas por nenhuma quantia em dinheiro ou valor monetário. Se você excluir sua conta ou ela for encerrada por qualquer motivo, você perderá todo o tempo de assinatura não utilizado, sem reembolso ou outra compensação. 4.2. DIREITO DE CANCELAR A ASSINATURA Você tem o direito de rescindir (ou cancelar) sua assinatura dentro de quatorze (14) dias da aceitação, por qualquer motivo. Para residentes do Espaço Econômico Europeu, consulte a seção 22 para obter mais informações sobre esse direito. Além disso, quando exigido por lei, seu espólio tem o direito de reivindicar um reembolso da parte não utilizada de sua assinatura se você morrer durante o prazo da assinatura. Para exercer qualquer um desses direitos, você (ou, se aplicável, seu espólio) deve nos notificar por carta registrada para The Meet Group, Inc., 100 Union Square Drive, New Hope, PA 18938, Attention: Member Services, ou por e-mail para support@themeetgroup.com com uma declaração clara de sua decisão de rescindir sua assinatura. Para cumprir o prazo de rescisão, você deve nos enviar uma notificação sobre o exercício do direito de rescisão antes do término do período de rescisão de quatorze dias. Se você rescindir (ou cancelar) sua assinatura, reembolsaremos os pagamentos que recebemos de você, menos qualquer quantia de Credits que você tenha consumido. Se você desejar rescindir (ou cancelar) de sua compra de Credits, reembolsaremos os pagamentos que recebemos de você, menos qualquer quantia de Credits que você tenha consumido. Se você for um usuário do Android, usaremos o mesmo meio de pagamento que você usou na transação original. Se você for um usuário de iOS, computador pessoal ou web móvel, nós o reembolsaremos por cheque ou PayPal se você fornecer as informações de contato corretas para processar esses pagamentos. Em nenhuma circunstância você será cobrado por este reembolso. 4.3. CREDITS E PRESENTES VIRTUAIS Você pode comprar ou obter “Credits” de nós. Credits lhe dá um direito limitado, intransferível, não sublicenciável e revogável de ativar recursos no aplicativo, como presentes virtuais na MeetMe. Presentes virtuais são animações ao vivo fornecidas pela MeetMe. Você pode ativar um presente virtual na transmissão de um Streamer dentro da Rede Live. Se você comprar pela Apple App Store ou Google Play, sua compra estará sujeita às normas e aos princípios técnicos estabelecidos pela Apple ou Google, sobre os quais não temos controle. Se"
