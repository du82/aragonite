full_description = "Conformité Une action responsable exige une attitude et se nourrit de continuité. Pour cela, nous avons un ensemble de valeurs que nous voulons vivre en tant que filiale de ProSiebenSat.1 Media SE. Nous avons une responsabilité sociale et nous la prenons très au sérieux, notamment en exigeant un comportement conforme dans nos activités quotidiennes. Vous trouverez des informations sur notre système de gestion de la conformité en tant que filiale de ProSiebenSat.1 Media SE à l’adresse suivante : ici. Vous pouvez également accéder à notre système de dénonciation via ce lien, en particulier dans le cadre de la loi allemande sur les obligations d’approvisionnement de la chaîne d’approvisionnement (Lieferkettensorgfaltspflichtengesetz). Entre février 2024 et août 2024, le nombre moyen d’utilisateurs qui se sont connectés à MeetMe et ont utilisé activement leur profil au sein de l’Union européenne (UE) était considérablement inférieur à 45 millions."
