["https://www.meetme.com/it/communityguidelines"]
title = "Linee guida della community per MeetMe"
description = "Scoprite come MeetMe promuove una comunità amichevole e rispettosa. Esplora le nostre linee guida, i valori e le regole su MeetMe"
full_description = "Linee guida della community Ultimo aggiornamento: 03.12.2022 Agli utenti del SEE si applicano linee guida comunitarie separate. È possibile accedervi più avanti o fare clic su qui. Indice MeetMeLinee guida della community MeetMe Linee guida della community per gli utenti del SEE MeetMe Community Guidelines Siamo a favore della libertà di espressione e crediamo che per noi tutti sia meglio che ognuno possa esprimere la propria opinione. Crediamo che la molteplicità dei punti di vista e delle esperienze arricchisca tutta la comunità. Affinché rimangano protette sia l’esperienza dell’utente che la sicurezza sono presenti alcune limitazioni relativamente ai contenuti e ai comportamenti da noi autorizzati. Sappiamo che ci possono essere abusi e che taluni gruppi ne possano essere colpiti in modo sproporzionato, in particolare quando tali abusi riguardano genere, sessualità o colore della pelle o sono indirizzati contro gruppi o gruppi periferici storicamente sotto-rappresentati. Ci obblighiamo a combattere contro i comportamenti indebiti, in particolare se motivati da odio, pregiudizi o intolleranza e anche se l’obiettivo dell’abuso è quello di far tacere la voce di coloro che sono storicamente sotto-rappresentati. Se in MeetMe vedi qualcosa che infrange o viola le nostre linee guida, utilizza la funzione messaggi interna all’App. Le presenti Community Guidelines sonoparte delle nostre Condizioni generali. Contenuti e comportamenti 1. Contenuti vietati ai minori Non puoi pubblicare o streammare materiali vietati ai minori. Intendiamo come tali tutti i materiali pornografici e/o tutto ciò che ha l’obiettivo di provocare un eccitamento sessuale. nudità completa o parziale, incluse riprese ravvicinate (sia da vestiti che non) di genitali, didietro o seni. queste parti del corpo non possono essere le più importanti su una foto o uno schermo; “testare i limiti” sia con nudità che con scollature eccessive, pantaloncini troppo corti, perizoma o vestiti troppo attillati o troppo trasparenti; gesti osceni o indecenti (tra i quali mostrare il dito medio); finzione di attività sessuali; e rapporti sessuali o altre attività sessuali che riguardano esseri umani, rappresentazioni di animali con tratti umani, fumetti, hentai o anime. 2. Violenza grafica Non puoi pubblicare o streammare materiali grafici violenti o eccessivamente sanguinari. Materiale violento è, per noi tutti, ciò che rappresentano graficamente la morte, la violenza, procedimenti chirurgici o lesioni gravi su esseri umani e animali. A titolo esemplificativo e non esaustivo si riportano alcuni esempi specifici: reati gravi o scene di incidenti; contrapposizioni fisicamente violente; liquidi del corpo quali sangue, feci, sperma ecc.; organi interni od ossa esposti; danni corporali gravi, incluse ferite visibili, ossa rotte ecc.; persecuzione e uccisione di animali; e animali gravemente feriti o mutilati. 3. Attività o prodotti pericolosi Non puoi pubblicare o streammare materiali che rappresentano attività o prodotti pericolosi. A titolo esemplificativo e non esaustivo si riportano alcuni esempi specifici: promozione di attività di autolesionismo, suicidio, disturbi alimentari o di altre attività che possono determinare la morte o essere causa di lesioni gravi; “prove di coraggio” pericolose, giochi, battaglie o gare; sostanze stupefacenti pericolose; e streammare mentre si sta guidando un veicolo di qualsiasi tipo (inclusa una bicicletta). 4. Merci e prestazioni illegali e regolamentate. Non puoi pubblicare o streammare materiali rappresentano merci o prestazioni illegali o regolamentate. A titolo esemplificativo e non esaustivo si riportano alcuni esempi specifici: falsificazioni e prestazioni a ciò relative; traffico di persone; droghe (inclusa la marijuana) e attrezzi per drogarsi o accessori a ciò relativi; strumenti finanziari e prestazioni; giochi d’azzardo; prodotti di tipo pericoloso o protetti; prostituzione o prestazioni sessuali; merci rubate; e armi, incluse armi da fuoco, munizioni, esplosivi e suggerimenti relativi alla produzione di armi (ad es. bombe, pistole da stampa 3D ecc.) 5. Utilizzo non autorizzato Non puoi utilizzare MeetMe a fini illeciti o per supportare attività illegali. Utilizzando MeetMe accetti tutte le leggi esistenti che regolano il tuo comportamento online così come i tuoi contenuti. 6. Proprietà intellettuale Non puoi pubblicare o streammare alcun materiale per il quale non possiedi i diritti di pubblicazione o che viola i diritti relativi a un brevetto, un marchio, un segreto commerciale, il diritto d’autore, la sfera privata o altri diritti di proprietà di una persona. 7. Utilizzo non autorizzato Non puoi pubblicare la voce o l’immagine di un’altra persona senza il suo consenso. Non puoi, di conseguenza, pubblicare o streammare registrazioni o immagini di un’altra persona se la registrazione o la distribuzione sono avvenute senza il suo consenso. 8. Informazioni private Non puoi pubblicare o streammare informazioni private di un’altra persona senza il suo permesso. Tra queste sono incluse foto, video e altri dati personali. 9. Spam e sicurezza Non puoi utilizzare MeetMe per inviare spam. Non puoi registrare automaticamente alcun account o pubblicare alcun materiale in modo automatico, sistematico o programmatico. Non puoi caricare o trasmettere virus per software, malware o altri codici dannosi per programmi, file o programmi né raccogliere dati ovvero utilizzare robot e o metodologie di estrazione od ottenimento di dati. Non puoi provocare anomalie in MeetMe o caricarlo in modo sproporzionato (esattamente come un’altra persona che utilizza MeetMe) oppure caricare le reti che sono in collegamento con MeetMe. Non puoi violare le misure di sicurezza di MeetMe né provare a forzarle. 10. Pubblicità Non puoi pubblicare o streammare pubblicità non richiesta o vietata, materiali pubblicitari, spam, catene di sant’Antonio, sistemi a piramide o altre forme di pubblicità per conquistare clienti né incitare illecitamente a fare gare, campagne regali, lotterie/giochi d’azzardo. 11. Falsificazione dell’identità. Non puoi imitare persone, gruppi od organizzazioni in modo tale da confondere intenzionalmente o da truffare altre persone. 12. Violenza e lesioni fisiche Non puoi fare specifiche minacce di violenza o comunicare il desiderio di gravi danni fisici, di morte o malattia di un individuo o di un gruppo. Tra tali minacce vi è anche compresa quella di terrorismo o di sostegno al terrorismo. Non puoi pubblicizzare o incoraggiare atti di suicidio o autolesionismo. 13. Minorenni Non puoi pubblicare o streammare contenuti che mostrano minorenni (età inferiore a 18 anni) né far comparire nel tuo stream alcun minorenne. Ciò si applica anche ai tuoi figli pur in presenza del loro consenso. 14. Pericoli al benessere dei bambini e sfruttamento sessuale Non puoi pubblicare o streammare alcun materiale che renda i minorenni (età inferiore a 18 anni) strumenti sessuali ovvero che promuova o esalti lo sfruttamento sessuale di bambini. Di seguito sono indicati alcuni esempi di contenuti che rappresentano e incoraggiano lo sfruttamento dei bambini: rappresentazione visiva di un minorenne che compie attività sessualmente esplicite o che suggeriscono un’attività sessuale; rappresentazioni illustrate, generate da computer o di altro tipo di minorenni in un contesto esplicitamente sessuale o durante un’attività esplicitamente sessuale; e collegamenti a provider terzi che presentano materiali che mostrano lo sfruttamento sessuale di bambini. Da MeetMe non sono consentiti inoltre i seguenti comportamenti: fantasticare sullo sfruttamento sessuale dei bambini o incoraggiare a sfruttare sessualmente i bambini; Esprimere il desiderio di ricevere materiale che ha come contenuto lo sfruttamento sessuale di bambini; Reclutare, pubblicizzare o manifestare interesse per: (1) un’attività a scopo di commercio sessuale con un bambino o (2) ospitare o trasportare un bambino per motivi sessuali; coinvolgere un minorenne in una conversazione con contenuti sessualmente espliciti; e identificare probabili vittime di sfruttamento sessuale in età infantile con nome o foto. 15. Abusi nel comportamento Non puoi infastidire un’altra persona o incitare altri a infastidire qualcuno. Consideriamo qualsiasi tentativo di vessare, intimidire o far tacere una voce come un comportamento indebito. Non puoi infastidire nessuno direttamente inviando contenuti sessualmente non desiderati, facendo di qualcuno un oggetto sessuale in modo esplicito o mostrando altri comportamenti illeciti di tipo sessuale. Non puoi pubblicare alcun contenuto che preveda lo sfruttamento di altri (ad esempio estorsione di denaro, estorsione tramite minacce ecc.), umili o vessi altri ovvero umili o vessi le vittime di avvenimenti tragici (o gli amici o le famiglie). Il contesto gioca, nella valutazione dei comportamenti indebiti e per la determinazione di provvedimenti esecutivi adatti della linea guida, un ruolo. I fattori che teniamo in considerazione sono, a titolo di esempio: Se il comportamento è indirizzato a una persona o a un gruppo di persone; e Se la comunicazione è stata effettuata dalla persona obiettivo dell’abuso o da un testimone. 16. Comportamenti di odio e mobbing Non puoi incoraggiare la violenza nei confronti delle persone, minacciarli con la violenza ovvero discriminare sistematicamente o marginalizzare altre persone per motivi di razza, religione, etnia, provenienza, orientamento sessuale, genere, identificazione sessuale, età, inabilità, malattia grave, status di reduce o altre caratteristiche. Non puoi avere nella tua immagine del profilo o nel tuo profilo alcuna immagine o simbolo che alimentano l’odio. Non puoi utilizzare il tuo nome utente, il nome visualizzato o il profilo per commettere abusi, ad es. per infastidire in modo mirato o esprimerti con odio contro una persona, un gruppo o una categoria protetta. Alcuni contenuti potrebbero essere considerati singolarmente come carichi di odio ma, nel contesto di una conversazione, essere valutati in modo differente. I membri di una categoria protetta, ad esempio, potrebbero designarsi vicendevolmente con termini che, normalmente, sarebbero considerati dispregiativi. Quando tali termini sono utilizzati di comune accordo, l’intenzione nascosta non è dispregiativa, bensì segnala una riconquista degli stessi che, storicamente, erano stati utilizzati per disprezzare una persona. Non devi essere il membro di un gruppo colpito dall’odio affinché noi assumiamo provvedimenti. Non chiediamo alle persone di mostrare l’appartenenza a un gruppo protetto o a confutarla e noi stessi non raccoglieremo tali informazioni. I comportamenti che riteniamo carichi di odio sono, a titolo di esempi non esaustivi: a. Minacce di violenza Non puoi minacciare un obiettivo identificato. Le minacce di violenza esprimono chiaramente l’intenzione di ferire qualcuno in modo tale da provocargli danni corporali gravi e permanenti, per i quali una persona potrebbe morire o rimanere seriamente lesionata, ad es.: “Ti ammazzo.” Nei confronti delle minacce di violenza abbiamo tolleranza zero. Gli account che, a nostro parere, condividono minacce di violenza saranno chiusi subito e definitivamente. b. Desiderare o sperare che una persona o un gruppo subisca gravi danni o incitare in tal senso Desiderare o sperare che una persona o un gruppo subisca gravi danni o incitare in tal senso. Non puoi pubblicare o streammare contenuti che esprimano il desiderio o la speranza di morte, danni corporali seri e permanenti o grave malattia ai danni di una persona o un gruppo di persone. Tra di essi, a titolo di esempio, vi sono: sperare che qualcuno gravemente malato muoia, ad es.: “Spero che che ti venga un cancro e crepi”; desiderare che qualcuno sia vittima di un grave incidente, ad es.: “Spero che ti investano la prossima volta che dici qualcosa del genere”; e dire che un gruppo di persone si merita lesioni corporali gravi, ad es.: “Se questo gruppo di dimostranti non tace merita i proiettili.“ c. Stragi, attività violente o tipi specifici di violenza. Non puoi pubblicare o streammare contenuti che promuovono stragi, atti violenti o tipi specifici di violenza nei confronti di una persona o un gruppo. Fra di essi, a titolo di esempio, vi è l’invio a una persona di quanto segue: contenuti che rappresentano le immagini dell’olocausto; e contenuti che rappresentano linciaggi. d. Comportamenti che alimentano la paura nei confronti di un gruppo di persone. Comportamenti che alimentano la paura nei confronti di un gruppo di persone. Non puoi inviare contenuti a persone singole con lo scopo di alimentare pregiudizi che provocano paure nei confronti di un gruppo di persone, inclusa l’affermazione che i membri di un gruppo partecipino ad attività pericolose o illegali, ad es.: “tutti [i gruppi religiosi] sono terroristi.“ e. Ripetizione e/o utilizzo non concordato di termini razzisti, epiteti ingiuriosi, espressioni razziste e metaforicamente sessiste o di altro materiale denigratorio. Non puoi indirizzare in modo mirato, contro le persone, umiliazioni ripetute, espressioni metaforiche o altri contenuti con lo scopo di disumanizzare, denigrare o promuovere pregiudizi negativi o dannosi nei confronti di un gruppo protetto. Sono compresi in tali comportamenti, ad esempio, l’attribuzione del genere sbagliato o l’utilizzo del vecchio nome per indicare un transgender. f. Immagini piene d’odio Non puoi pubblicare o streammare loghi, simboli o immagini il cui obiettivo è quello di promuovere ostilità e ingiustizie nei confronti di altri per motivi di razza, religione, etnia, origine, orientamento sessuale, genere, età, inabilità, malattia grave, stato di reduce o di altra caratteristiche che sono in collegamento a fatti di sistematica discriminazione ed emarginazione. Alcuni esempi, tra gli altri, di immagini piene di odio sono le seguenti: Simboli che, storicamente, sono in relazione a gruppi d’odio, ad esempio la croce uncinata nazista Immagini che rappresentano altre persone in modo meno umano o che sono state modificate in modo tale da contenere simboli pieni d’odio, ad es. la modificazione di immagini di individui in modo tale da rappresentare caratteristiche animalesche; e Immagini che rappresentano altre persone in modo meno umano o che sono state modificate in modo tale da contenere simboli pieni d’odio, ad es. la modificazione di immagini di individui in modo tale da rappresentare caratteristiche animalesche; e 17. Uso illecito dello strumento di segnalazione Tutti gli utenti hanno la possibilità di segnalarci contenuti illegali e inappropriati notati all’interno della nostra piattaforma. Non è tuttavia ammesso l’uso illecito dello strumento di segnalazione. L’invio di segnalazioni o reclami spesso palesemente infondati può quindi avere delle conseguenze sulla nostra piattaforma. Provvederemo a segnalartelo/avvisarti prima di una nostra decisione in merito. Il caso di uso illecito dello strumento di s"
