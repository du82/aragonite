["https://www.meetme.com/fr/privacypolicy"]
title = "Politique de confidentialité - MeetMe"
description = "Consultez la politique de confidentialité de MeetMe pour comprendre comment nous collectons, utilisons et protégeons vos informations personnelles tout en garantissant une expérience utilisateur sécurisée."
full_description = "Politique de confidentialité Last Updated: December 30, 2024 Pour les utilisateurs situés dans l’EEE, la Suisse et le Royaume-Uni, une politique de confidentialité spécifique s’applique. Tu peux la retrouver plus loin ci-dessous ou en cliquant ici. Sommaire I. Politique de confidentialité 1. Portée 2. Informations à caractère personnel recueillies 3. Finalités du recueil et du traitement 4. Divulgation des données à caractère personnel 5. Cookies, ciblage et analyses 6. Tes options en matière de protection des données 7. Liens externes et fonctionnalités 8. Contenus générés par l’utilisateur 9. Sécurité 10. Protection de la sphère privée des enfants 11. Modifications à la présente directive 12. Contact 13. Informations complémentaires sur la protection des données pour certaines juridictions II. Politique de confidentialité pour les utilisateurs domiciliés dans l’Espace Économique Européen, en Suisse ou au Royaume-Uni 1. Portée 2. Informations à caractère personnel recueillies 3. Finalités du recueil et du traitement 4. Divulgation des données à caractère personnel 5. Transfert des données à caractère personnel vers des pays hors EEE/UK/CH 6. Cookies, ciblage et analyses 7. Tes options en matière de protection des données 8. Durée de conservation des données à caractère personnel 9. Liens externes et fonctionnalités 10. Contenus générés par l’utilisateur 11. Sécurité 12. Protection de la sphère privée des enfants 13. Modifications à la présente directive 14. Contact 15. Informations complémentaires sur la protection des données pour certaines juridictions I. Privacy Policy The Meet Group, Inc., ses marques, ses entreprises associées et ses filiales (« TMG », « nous », « notre » ou « nos ») accordent de l’importance à ta sphère privée. La présente politique de confidentialité (« directive ») décrit comment TMG collecte, utilise, divulgue et traite les données à caractère personnel décrites dans cette directive, ainsi que tes droits et options. Tu peux retrouver d’autres informations sur les options qui s’offrent à toi en matière de protection de tes données personnelles au paragraphe 6. Tes options en matière de protection des données ainsi qu’au paragraphe 13. Informations complémentaires sur la protection des données pour certaines juridictions qui contient des informations supplémentaires sur les droits en matière de protection des données des résidents de certains pays. Si tu es domicilié(e) en Californie, merci de lire le paragraphe 13.B. Informations complémentaires pour les résidents de Californie pour obtenir des informations sur les catégories de données à caractère personnel que nous recueillons et sur tes droits relatifs à la loi de protection des données californienne. Pour les utilisateurs de Skout ou MeetMe : si tu as créé un profil sur Skout ou MeetMe, tes données à caractère personnel peuvent être visibles des utilisateurs des deux plateformes. Si tu utilises la fonction Live de MeetMe, Skout ou Tagged, certaines de tes données à caractère personnel comme ton nom d’utilisateur, nom, âge, sexe et orientation sexuelle peuvent, en accord avec tes paramètres de confidentialité, être également visibles des utilisateurs d’autres applications qui nous appartiennent ou d’autres applications et sites internet qui ne nous appartiennent pas mais avec lesquels nous partageons notre plateforme Live. Ces autres utilisateurs peuvent être situés dans le monde entier. Tu trouveras une liste de nos partenaires Live actuels ici pour MeetMe et Skout et ici pour Tagged. Tu ne peux pas désactiver cette fonctionnalité si tu optes pour l’utilisation de Live. Cette utilisation de nos services est régie par nos Conditions Générales de Vente, y compris les dispositions en vigueur sur les limitations de dommages et intérêts et le règlement des litiges. 1. Portée Sauf décision contraire, cette directive s’applique aux données à caractère personnel collectées et traitées par TMG concernant les personnes suivantes : les visiteurs de notre site internet sur lequel cette directive est publiée, y compris l’ensemble de nos sites internet contenant un lien hypertexte vers cette directive ou où elle est publiée (« sites ») ; les personnes qui téléchargent et utilisent nos applications mobiles (« applications mobiles ») ; les personnes qui s’inscrivent ou participent aux évènements, sondages, enquêtes, actions promotionnelles et jeu-concours organisés par nos soins ; nos clients actuels, anciens ou potentiels, nos revendeurs, prestataires de services et partenaires commerciaux ainsi que les personnes qui communiquent avec nous ou les services disponibles sur nos sites, applications mobiles ou autres services en ligne ou encore interagissent ou entrent en contact avec nous (rassemblées sous le terme « services »). 2. Collecte des données à caractère personnel Comme décrit ci-après, nous pouvons collecter des données à caractère personnel provenant directement de toi, de tiers ou recueillies automatiquement lorsque tu utilises nos services. Données à caractère personnel provenant directement de toi. Les données à caractère personnel que nous recueillons varient en fonction des services que tu utilises et de notre interaction avec toi, mais en général nous sommes susceptibles de recueillir les catégories de données personnelles suivantes : Informations de contact. Lorsque tu entres en contact avec nous, par exemple lorsque tu nous envoies un message ou lorsque tu t’enregistres pour en apprendre davantage sur nos services, nous pouvons collecter ton nom, ton adresse email, ton numéro de téléphone ou tout autre moyen d’identification similaire, ainsi que ton message, la nature de ta demande et toutes les autres informations que tu nous as données. Informations de compte et de profil. Lorsque tu t’inscris pour bénéficier d’un compte en rapport avec nos services, nous pouvons recueillir ton nom, ton adresse e-mail, ton numéro de téléphone, ton adresse (par exemple ton code postal), ton nom d’utilisateur et ton mot de passe, ta date de naissance, ton appartenance ethnique et ton sexe, ton avatar et ta photo de profil et ton adresse de facturation ainsi que toutes les autres informations que tu mets à notre disposition pour la création ou la gestion de ton compte ou que tu nous transmets par ailleurs à travers ton compte. Achats, paiements et remboursements. Lorsque tu effectues un achat ou un paiement à travers nos services, nous pouvons recueillir des informations telles que le mode de règlement, les informations de carte bancaire, l’adresse de facturation et de livraison, le détail des achats et autres informations financières ou commerciales qui sont nécessaires à notre fourniture de service. Communication et interaction. Lorsque tu nous envoies un e-mail, tu nous contacte par téléphone ou communique et interagis d’une toute autre façon avec nous ou les autres utilisateurs des services TMG, par exemple lorsque tu t’inscris à nos mailinglists, lorsque tu remplis des formulaires sur nos sites internet ou applications mobiles, lorsque tu interagis sur nos réseaux sociaux, lorsque tu écris un avis ou un commentaire, lorsque tu soumets du contenu dans des discussions de groupe en ligne ou encore lorsque tu donnes des informations dans les champs de commentaire accessibles au public, les blogs et forums communautaires exploités par TMG ou en lien avec TMG, nous pouvons recueillir, recevoir et conserver tes informations de contact, tes communications et interactions, tes contributions ou soumissions ainsi que tes réponses éventuelles. Informations à finalité marketing. Lorsque tu acceptes de recevoir des communications commerciales de notre part, nous pouvons recueillir ton nom, ton adresse e-mail, ton numéro de téléphone, tes préférences et le cas échéant les informations sur ton compte et ton profil, y compris les services et fonctionnalités que tu utilises. Lorsque tu participes à des activités, offres, programmes ou action commerciales particulières que nous proposons, nous sommes susceptibles de recueillir également certaines informations de contact, ton âge et d’autres informations requises par la loi. Si tu gagnes lors d’une action de promotion, nous sommes également susceptibles de collecter en fonction du gain certaines données fiscales et/ou déclarations de renonciation et autorisations. Réponses et commentaires. Lorsque tu participes à un sondage, un questionnaire, une enquête ou une initiative que nous réalisons, par ex. pour la satisfaction des utilisateurs ou des fins similaires, nous pouvons recueillir tes réponses et tes commentaires ainsi que toutes les autres informations fournies par tes soins. Détails relatif aux évènements et inscription. Nous pouvons également recueillir des données à caractère personnel en rapport avec ta participation à nos évènements ainsi que d’autres demandes que tu nous adresses en rapport avec nos prestations. Lorsque tu t’inscris par exemple à un évènement organisé ou sponsorisé par nos soins ou que tu y participes, nous pouvons recueillir des informations en lien avec cette inscription et cette participation à cet évènement. Préférences et autres souhaits. Nous pouvons également collecter des informations sur tes préférences, y compris tes préférences en matière de communication, en rapport avec l’utilisation que tu as de nos services et d’autres préférences ou demandes que tu nous communiques lors des interactions avec toi. Informations relatives au développement commercial. Dans le but d’évaluer et développer de nouvelles opportunités commerciales, nous pouvons recueillir et conserver des données à caractère personnel sur les clients actuels, anciens et potentiels, les fournisseurs et prestataires, partenaires commerciaux, y compris des informations de contact et autres identificateurs similaires, des informations sur l’entreprise et la profession ainsi que des archives de communication. Données biométriques collectées avec ton accord à des fins précises. En règle générale, nous ne collectons pas de données biométriques auprès des utilisateurs. Dans certaines circonstances, nous sommes néanmoins susceptibles de te demander ton consentement pour le traitement de données biométriques et identificateurs afin de lutter contre des comptes frauduleux (parmi lesquels des bots) et autres utilisations abusives de nos services, pour estimer et contrôler ton âge et pour vérifier des profils. Tu trouveras de plus amples détails ici dans notre politique spécifique aux données biométriques. Données à caractère personnel provenant de fournisseurs tiers. Nous pouvons également collecter et conserver certaines données à caractère personnel te concernant provenant de tiers, par ex. de partenaires commerciaux, de clients et autres utilisateurs des services TMG, de prestataires en analyse des données et marketing, de systèmes d’exploitation et plateformes de médias sociaux, de bases de données publiques ainsi que de fournisseurs et prestataires qui réalisent des prestations ou exécutent des fonctions en notre nom. Ainsi, nous pouvons recueillir ton nom, tes coordonnées de contact ou autres informations similaires de la part de partenaires commerciaux, fournisseurs et prestataires dans le but de fournir nos services. De plus, nous pouvons collecter les informations suivantes auprès de tiers : Informations sur l’inscription à des réseaux sociaux et plateformes. Lorsque tu utilises nos services, tu peux choisir de nous communiquer des informations et contenus, de t’inscrire à des services ou de t’inscrire via différentes plateformes de médias sociaux, services de réseaux sociaux ou autres fonctions et services intégrés de fournisseurs tiers. Si tu te connectes à nos services par le biais de tes comptes de réseaux sociaux ou autres services et fonctions similaires intégrés, nous pouvons recueillir et conserver des données à caractère personnel te concernant et que tu as mis à disposition de ces comptes, services ou fonctions de réseaux sociaux. Ainsi, nous pouvons par ex. recueillir des données provenant de ton compte et ton profil, tels que ton nom, ton adresse e-mail, ton identifiant, ta photo de profil, ta liste d’amis et autres informations similaires disponibles sur ton profil. Tu dois vérifier tes paramètres de confidentialité sur chacune de ces plateformes de réseaux sociaux, chacune de ces fonctions et chacun de ces services intégrés pour comprendre précisément comment ces différents tiers utilisent, divulguent ou traitent tes données à caractère personnel. Informations de recommandation. Éventuellement, nous t’offrons la possibilité d’inviter des amis ou inciter d’autres utilisateurs à visiter ou utiliser nos services. Pour cela, nous pouvons collecter et conserver certaines données à caractère personnel te concernant mais concernant également d’autres utilisateurs et clients actuels ou futurs des services TMG qui participent de la même façon à ces activités. Informations sur les leads et clients potentiels. Nous sommes susceptibles d’obtenir des informations provenant de tiers sur les clients potentiels intéressés par nos prestations. Nous pouvons également collaborer avec des tiers pour élargir ou actualiser nos informations client. Ainsi, nous pouvons obtenir par exemple certaines données à caractère personnel de la part de prestataires en analyses de données et marketing afin de recruter de nouveaux clients ou de la part de partenaires commerciaux, fournisseurs et prestataires pour fournir nos services. Données à caractère personnel recueillies automatiquement. Nous ou nos fournisseurs tiers pouvons recueillir ou déduire automatiquement des données à caractère personnel te concernant en rapport avec ton utilisation de nos services, également à travers l’utilisation de cookies, pixel tags et autres technologies similaires. On trouve parmi les données à caractère personnel que nous pouvons recueillir automatiquement : Informations sur le matériel et la navigation. Lorsque tu utilises nos services, nous pouvons recueillir le type de navigateur, le nom de domaine, les pages consultées, les temps de recherche, la date et l’heure, le système d’exploitation, la langue, le type d’appareil, l’ID unique, le fournisseur d’accès internet, les liens entrants et sortants, les données clickstream, le système d’exploitation, la langue et les informations similaires relatives à l’équipement et au navigateur. Activités et utilisation. Nous pouvons également recueillir des informations liées à l’activité en rapport avec ton utilisation des services, par ex. des informations sur les liens visités, recherches effectuées, fonctions utilisées, éléments affichés, le temps passé dans le cadre des services utilisés, tes interactions avec nous et les autres durant ces services ainsi que d’autres informations similaires sur l’activité et l’utilisation. Informations de localisation. Nous pouvons également collecter ou déduire des informations d’ordre général sur ta localisation, par ex. à travers ton adresse IP. Tu trouveras de plus am"
year_published = 2025
