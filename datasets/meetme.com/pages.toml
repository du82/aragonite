["https://www.meetme.com/es/communityguidelines"]
title = "Normativa de la comunidad para MeetMe"
description = "Descubra cómo MeetMe fomenta una comunidad amistosa y respetuosa. Explora nuestras directrices, valores y normas en MeetMe"
full_description = "Normativa de la comunidad Última actualización: 3 de diciembre de 2024 A los usuarios del EEE se les aplican unas directrices comunitarias independientes. Puede acceder a ellas más abajo o hacer clic en aquí. Índice MeetMeNormativa de la comunidad MeetMe Directrices comunitarias para usuarios del EEE MeetMeNormativa de la comunidad Defendemos la libertad de expresión y creemos que lo mejor para todo el mundo es que cada cual tenga su voz. Creemos que la existencia de diferentes puntos de vista y experiencias enriquecen nuestra comunidad. Para poder mantener tanto la experiencia de usuario como la seguridad, existen restricciones relativas al comportamiento y al contenido. Somos conscientes de que pueden darse abusos y de que muchos grupos se ven desproporcionadamente afectados por ellos, sobre todo cuando se trata de sexo, sexualidad o color de piel, y también cuando se dirigen contra grupos marginales o históricamente minorizados. Nos comprometemos a luchar contra todo tipo de abusos, especialmente aquellos motivados por el odio, los prejuicios o la intolerancia, y también en concreto cuando el objetivo del abuso sea acallar las voces de grupos históricamente minorizados. Si adviertes algún comportamiento en MeetMe que infrinja o atente contra nuestra normativa, utiliza la función de notificación dentro de la aplicación. Esta normativa de contenidos y conducta forma parte de nuestras Condiciones de servicio . Contenido y conducta 1. Contenido para adultos Está prohibido publicar o transmitir material para adultos. El material para adultos es cualquier contenido pornográfico y/o que pueda estar destinado a provocar excitación sexual. Algunos ejemplos incluyen pero no se limitan a: la desnudez total o parcial, incluidos los primeros planos (con o sin ropa) de genitales, nalgas o pechos. Estas partes del cuerpo no deben ser lo más destacado en una fotografía o en una pantalla; «poner a prueba los límites», ya sea a través de la desnudez, el escote excesivo, pantalones demasiado cortos, tangas o ropa demasiado ajustada o traslúcida; los gestos obscenos o indecentes (incluida la señal del dedo medio); la simulación de un acto sexual; y las relaciones sexuales o cualquier otro acto sexual que involucre a seres humanos, la representación de animales con rasgos humanos, dibujos animados, hentai o anime. 2. Violencia gráfica Está prohibido publicar o transmitir material que contenga violencia gráfica o que sea excesivamente sanguinario. Consideramos material violento a todo lo que represente gráficamente la muerte, la violencia, los procedimientos quirúrgicos o las lesiones graves a las personas o los animales. Algunos ejemplos incluyen pero no se limitan a: crímenes atroces o escenas de accidentes; enfrentamientos violentos; fluidos corporales, como sangre, heces, esperma, etc.; órganos internos o huesos expuestos; daños físicos severos, incluidas heridas visibles, huesos rotos, etc.; la tortura y matanza de animales; y animales gravemente heridos o mutilados. 3. Actividades o productos peligrosos Está prohibido publicar o transmitir material que muestre actividades o productos peligrosos. Algunos ejemplos incluyen pero no se limitan a: la promoción de la autolesión, el suicidio, los trastornos alimentarios u otros actos que puedan causar lesiones graves o la muerte; «pruebas de valor», juegos, luchas o concursos peligrosos; drogas y estupefacientes peligrosos; y la transmisión mientras se conduce un vehículo de cualquier tipo (incluidas las bicicletas). 4. Bienes y servicios ilegales o regulados Está prohibido publicar o transmitir material que muestre bienes o servicios ilegales o regulados. Algunos ejemplos incluyen pero no se limitan a: la falsificación y los servicios relacionados con ella; la trata de personas; drogas (incluida la marihuana) y elementos para el consumo de drogas o accesorios relacionados; instrumentos o servicios financieros; los juegos de azar; los productos derivados de especies en peligro o protegidas; la prostitución o los servicios sexuales; las mercancías robadas; y las armas, incluidas las armas de fuego, las municiones y los explosivos y las instrucciones para la fabricación de armas (por ejemplo, bombas, pistolas de impresión 3D, etc.) 5. Uso indebido Está prohibido el uso de MeetMe con fines ilícitos o para promover actividades ilegales. Al utilizar MeetMe, aceptas todas las leyes aplicables que regulan tu comportamiento online y tu contenido. 6. Propiedad intelectual Está prohibido publicar o transmitir contenido no autorizado o que viole una patente, una marca registrada, un secreto comercial, el derecho de autor, la esfera privada o cualquier otro derecho de propiedad de una persona. 7. Uso no autorizado Está prohibido publicar o transmitir la voz o la imagen de otra persona sin su consentimiento previo. Del mismo modo, está prohibido publicar o transmitir grabaciones o imágenes de otra persona si la grabación y la difusión se llevaron a cabo sin su consentimiento. 8. Información privada Está prohibido publicar o transmitir información privada de otras personas sin su autorización. Esto comprende fotografías, vídeos y otros datos personales. También está prohibido amenazar con su publicación o incentivar a otros para que la realicen. 9. Spam y seguridad Está prohibido el uso de MeetMe para enviar spam. Está prohibido registrar cuentas automáticamente o publicar material de forma automática, sistemática o programada. Está prohibido cargar o transmitir material que contenga virus de software, malware u otros códigos informáticos, archivos o programas dañinos, recopilar datos y utilizar robots o métodos similares para obtener información. Está prohibido interferir con MeetMe o imponer una carga excesiva a MeetMe (o a cualquier persona que utilice MeetMe) o cargar las redes conectadas a MeetMe. Está prohibido violar o intentar vulnerar las medidas de seguridad. 10. Publicidad Está prohibido publicar o transmitir cualquier tipo de publicidad no solicitada o no autorizada, material de promoción, spam, cartas en cadena, sistemas piramidales o cualquier otra forma de captación de clientes y convocar a concursos, campañas de regalos o loterías/juegos de azar no autorizados. 11. Suplantación de identidad Está prohibido suplantar la identidad de cualquier persona, grupo u organización con el fin de inducir a error, confundir o engañar a otros. 12. Violencia y lesiones físicas Está prohibido realizar amenazas concretas de violencia o manifestar el deseo de que cualquier persona o grupo sufra daños físicos graves, la muerte o padezca una enfermedad. Esto incluye pero no se limita a las amenazas y la promoción del terrorismo. Está prohibido fomentar o instigar al suicidio o las autolesiones. 13. Menores de edad Está prohibido publicar o transmitir contenidos en los que aparezcan menores de edad (menores de 18 años) y tampoco deben aparecer menores de edad en tu transmisión. Esto también se aplica si se trata de tus propios hijos e incluso si cuentas con autorización para hacerlo. 14. Puesta en peligro del bienestar de los menores y explotación sexual. Está prohibido publicar o transmitir material que contenga actos de índole sexual con menores de edad (personas menores de 18 años) o que promueva o exalte la explotación sexual de niños. Algunos ejemplos de contenidos que representan o promueven la explotación sexual de niños incluyen pero no se limitan a: la representación visual de una persona menor de edad realizando actos sexualmente explícitos o sugestivos; la representación ilustrada, generada por ordenador o de otro tipo de menores de edad en un contexto sexualmente explícito o durante un acto sexualmente explícito; y enlaces a proveedores terceros que presentan material que muestra la explotación sexual de niños. MeetMe tampoco permite los siguientes comportamientos: fantasear con la explotación sexual de niños o promoverla; manifestar el deseo de obtener material relacionado con la explotación sexual de niños; contratar, promocionar o manifestar interés en: (1) actos sexuales comerciales que involucren niños o (2) acoger o transportar a un niño con fines sexuales; involucrar a un menor de edad en una conversación sexualmente explícita; e identificar a las presuntas víctimas de explotación sexual infantil por su nombre o su fotografía. 15. Comportamiento abusivo Está prohibido acosar a otra persona o incentivar a alguien para que lo haga. Cualquier intento de acosar, intimidar o acallar la voz de otra persona será considerado un comportamiento abusivo. stá prohibido acosar directamente a otra persona enviando contenido sexual no solicitado, cosificando a alguien de forma sexualmente explícita o a través de cualquier otro comportamiento sexual inapropiado. Está prohibido publicar o transmitir contenido con el fin de explotar a otra persona (incluidas la extorsión de dinero, la extorsión mediante amenazas, etc.) y humillar o acosar a otros, en particular a las víctimas de acontecimientos trágicos (así como a sus familiares o amigos). El contexto desempeña un papel importante al momento de evaluar las conductas abusivas y determinar las medidas de ejecución adecuadas en virtud de la normativa. Algunos factores que tomamos en consideración incluyen pero no se limitan a: si la conducta se dirige a una persona o un grupo de personas; y si la denuncia fue presentada por la víctima del abuso o por un testigo. 16. Comportamiento hostil y acoso. Está prohibido promover la violencia contra las personas, amenazar con ella o acosar a otros por motivos de raza, religión, etnia, nacionalidad, orientación sexual, género, identificación de género, edad, discapacidad, enfermedad grave, estado de veterano o cualquier otra característica relacionada con la discriminación o la marginación sistémica. Está prohibido utilizar imágenes o símbolos de odio en la foto de perfil o en el perfil. Está prohibido utilizar el nombre de usuario, el nombre para mostrar o el perfil para practicar comportamientos abusivos, como, por ejemplo, expresar acoso u odio hacia cualquier persona, grupo o categoría protegida. Algunos contenidos considerados odiosos al analizarlos de forma individual pueden ser valorados de otro modo en el contexto de una conversación general. De este modo, por ejemplo, los miembros de una categoría protegida pueden referirse entre sí utilizando términos que normalmente se consideran despectivos. Cuando estas denominaciones se utilizan de forma consensuada, la intención subyacente deja de ser despectiva y supone más bien una reconquista de los términos históricamente utilizados para desvalorizar a las personas. No es necesario ser parte de un grupo destinatario del odio para que tomemos medidas. No exigimos a las personas que prueben o refuten su pertenencia a un grupo protegido ni tampoco recabaremos esta información por nuestra cuenta. Los comportamientos que consideramos odiosos incluyen pero no se limitan a los siguientes: a. Amenazas de violencia Está prohibido formular amenazas de violencia contra un destinatario identificable. Las amenazas de violencia son expresiones claras de la intención de dañar a alguien provocándole daños corporales graves y duraderos que podrían tener como consecuencia la muerte o lesiones graves, como, por ejemplo, «Te mataré». Tenemos una política de tolerancia cero con las amenazas de violencia. Las cuentas que a nuestro entender compartan amenazas de violencia serán bloqueadas de forma inmediata y permanente. b. El deseo, la esperanza o la incitación a causar daños graves a una persona o un grupo de personas. Está prohibido publicar o transmitir contenido en el cual se expresen deseos, esperanzas o anhelos de muerte, daños corporales graves y duraderos o enfermedades graves contra cualquier persona o grupo. Esto incluye pero no se limita a: la esperanza de que alguien fallezca a causa de una enfermedad grave, por ejemplo, «Espero que te enfermes de cáncer y mueras» desear que alguien sea víctima de un accidente grave, por ejemplo, «Espero que la próxima vez que digas algo así te atropelle un coche»; y decir que un grupo de personas merece sufrir lesiones corporales graves, por ejemplo, «Si este grupo de manifestantes no se calla, hay que acabar con ellos» c. Homicidios en masa, actos de violencia o tipos específicos de violencia. Está prohibido publicar o transmitir contenido que promueva el homicidio en masa, los actos de violencia o tipos específicos de violencia contra cualquier persona o grupo. Esto incluye pero no se limita a enviar a cualquier persona: contenido que muestre a las víctimas del holocausto; y contenido que muestre linchamientos. d. Contenido que fomente el miedo a un grupo de personas. Está prohibido enviar contenido a los particulares con el fin de fomentar el miedo o la creación de estereotipos contra un grupo de personas, incluida la afirmación de que los miembros de un grupo participan en actividades peligrosas o ilegales, por ejemplo, «Todos [grupo religioso] son terroristas». e. Uso repetido y/o no consensuado de términos racistas, sobrenombres ofensivos, expresiones metafóricas racistas y sexistas o cualquier otro material denigrante. Está prohibido someter a las personas a humillaciones repetidas, expresiones metafóricas u otros contenidos que tengan como fin deshumanizar, denigrar o fomentar la creación de estereotipos negativos o dañinos contra un grupo protegido. Esto incluye, por ejemplo, la atribución intencional del género equivocado o el uso del nombre antiguo de una persona transgénero. f. Imágenes de odio. Está prohibido publicar o transmitir logotipos, símbolos o imágenes cuyo fin sea promover la hostilidad y la injusticia contra otros por motivos de raza, religión, etnia, nacionalidad, orientación sexual, género, edad, discapacidad, enfermedad grave, estado de veterano o cualquier otra característica relacionada con la discriminación o la exclusión sistémica. Algunos ejemplos de material gráfico de odio son, entre otros: os símbolos relacionados históricamente con grupos de odio, por ejemplo, la esvástica las imágenes que presenten a las personas como menos humanas o que hayan sido alteradas para incluir símbolos de odio, por ejemplo, imágenes de individuos con rasgos de animales; Las imágenes alteradas para mostrar símbolos de odio o referencias a homicidios en masa de un determinado grupo protegido, por ejemplo, imágenes de personas a las que se añadió la estrella de David amarilla relacionada con el holocausto 17. Uso indebido de la opción de denuncia Todos los usuarios tienen la posibilidad de informarnos sobre contenidos ilegales e inapropiados dentro de nuestra plataforma. Sin embargo, no está permitido hacer un uso indebido de la opción de denuncia. El envío repetitivo de denuncias o quejas manifiestamente infundadas puede acarrear consecuencias en nuestra plataforma. Te informaremos o advertiremos antes de tomar una decisión. El uso indebido de la opción de denuncia se determina, en particular, por el número de denuncias o q"
