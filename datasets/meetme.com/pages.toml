full_description = "Conformidade 1. Whistleblower System/ German Supply Chain Due Diligence Act Uma atuação responsável requer uma atitude e prospera na continuidade. Para isso, temos um conjunto de valores que queremos viver enquanto filial da ProSiebenSat.1 Media SE. Temos uma responsabilidade social e levamos isso muito a sério – especialmente através da nossa exigência de um comportamento compatível no dia a dia da empresa. Informações sobre o nosso Sistema de Gestão de Conformidade como subsidiária da ProSiebenSat.1 Media SE podem ser encontradas em aqui. Também pode aceder ao nosso sistema de denúncias através desta ligação, especialmente em relação à lei alemã sobre as obrigações de fornecimento da cadeia de abastecimento (Lieferkettensorgfaltspflichtengesetz). 2. Digital Services Act Entre fevereiro de 2024 e agosto de 2024, o número médio de usuários que efetuaram login na MeetMe e usaram ativamente seu perfil na União Europeia (UE) foi consideravelmente inferior a 45 milhões."
