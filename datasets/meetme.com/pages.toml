full_description = "Conformità 1. Whistleblower System/ German Supply Chain Due Diligence Act Un’azione responsabile richiede un atteggiamento e si basa sulla continuità. Per questo, abbiamo una serie di valori che vogliamo vivere come filiale di ProSiebenSat.1 Media SE. Abbiamo una responsabilità sociale e la prendiamo molto sul serio, soprattutto attraverso la richiesta di un comportamento conforme nelle attività quotidiane. Le informazioni sul nostro sistema di gestione della conformità come filiale di ProSiebenSat.1 Media SE sono disponibili su qui. A questo link è inoltre possibile accedere al nostro sistema di whistleblower, in particolare in relazione alla legge tedesca sugli obblighi di approvvigionamento della catena di fornitura (Lieferkettensorgfaltspflichtengesetz). 2. Digital Services Act Tra febbraio 2024 e agosto 2024, il numero medio di utenti che hanno effettuato l’accesso a MeetMe e utilizzato attivamente il proprio profilo all’interno dell’Unione Europea (UE) è stato notevolmente inferiore a 45 milioni."
