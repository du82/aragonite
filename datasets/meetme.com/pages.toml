tted to cancel this contract until midnight of the 3rd day after the date on which you signed the contract. If within this time period you decide you want to cancel this contract, you may do so by notifying The Meet Group by any writing mailed or delivered to The Meet Group at the address shown on the contract (The Meet Group, Attn: Cancellations, 100 Union Square Drive, New Hope, PA 18938, USA.), within the previously described time period. If you do so cancel, any payments made by you will be refunded within 21 days after notice of cancellation is delivered, and any evidence of any indebtedness executed by you will be canceled by The Meet Group and arrangements will be made to relieve you of any further obligation to pay the same. If you subscribed using an External Service (e.g., Apple App Store, Google Play), you must cancel through your External Service. If you subscribed through your Apple ID, refunds are handled by Apple, not The Meet Group. You can request a refund from Apple through your Apple account on your phone or at https://getsupport.apple.com. Table of Contents A. Terms of Service 1. INTRODUCTION 2. ACCOUNT ELIGIBLITY AND USE OF MEETME 3. REGISTRATION 4. SUBSCRIPTIONS AND IN-APP CURRENCY 4.1. SUBSCRIPTIONS 4.2. RIGHT TO TERMINATE SUBSCRIPTION 4.3. CREDITS AND VIRTUAL GIFTS 4.4. DIAMONDS 5. NO SPAM POLICY 6. CONTENT 7. AVAILABILITY OF SERVICE 8. DEALINGS WITH ADVERTISERS AND THIRD-PARTY CONTENT 9. NO CRIMINAL BACKGROUND OR IDENTITY VERIFICATION CHECKS 10. PHOTOSENTIVTIY WARNING: READ BEFORE PLAY 11. DISCLAIMER OF WARRANTIES 12. LIMITATION OF LIABILITY 13. EXCLUSIONS AND LIMITATIONS 14. INDEMNITY 15. GOVERNING LAW AND VENUE 16. ARBITRATION AGREEMENT, CLASS ACTION WAIVER AND JURY TRIAL WAIVER 17. Digital Millennium Copyright Act Notice 18. ENTIRE AGREEMENT 19. Our CONTACT INFORMATION 20. ADDITIONAL TERMS FOR APPLE APP STORE DOWNLOADS 21. ADDITIONAL TERMS FOR GOOGLE PLAY APP DOWNLOADS 22. INFORMATION ON THE RIGHT OF WITHDRAWAL FOR EEA AND UK RESIDENTS B.