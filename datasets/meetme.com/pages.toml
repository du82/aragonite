LIDADE DA CONTA E UTILIZAÇÃO DE MEETME O utilizador deve ter pelo menos 18 anos de idade para se registar em MeetMe. Se o utilizador tiver menos de 18 anos, não poderá aceder ou utilizar MeetMe. Ao aceder aos Serviços e/ou concluir o processo de registo para MeetMe, o utilizador declara que tem 18 anos de idade ou mais e que pode e será legalmente vinculado pelo presente Acordo. MeetMe destina-se apenas a uso pessoal do utilizador e não pode ser utilizado para qualquer outro fim. O utilizador não pode utilizar MeetMe em ligação com qualquer atividade comercial sem a nossa autorização expressa por escrito. As empresas e outras organizações não podem tornar-se Utilizadores de MeetMe nem utilizar MeetMe sem a nossa aprovação expressa por escrito. Reservamo-nos o direito de investigar quaisquer suspeitas de utilizações não autorizadas de MeetMe e podemos tomar medidas à nossa inteira discrição, incluindo, sem limitação, a procura de reparação legal, civil, criminal ou injuntiva. O utilizador não pode utilizar o MeetMe onde for proibido por lei e concorda em cumprir todas as regras locais relativas à conduta online e ao conteúdo aceitável. 3. REGISTO Para aceder e utilizar MeetMe, terá de se registar. Para tal, terá de escolher uma opção de registo disponível, como e-mail, SMS, Iniciar sessão com a Apple, Iniciar sessão com o Google ou Facebook, e fornecer credenciais de início de sessão, como o endereço de e-mail e uma palavra-passe à sua escolha. O utilizador é responsável por manter a confidencialidade da sua palavra-passe e das credenciais da conta. Além disso, o utilizador é responsável por todas e quaisquer actividades causadas por culpa que ocorram na sua conta. O utilizador concorda em notificar-nos imediatamente de qualquer utilização não autorizada da sua conta ou de qualquer outra violação de segurança assim que tiver conhecimento da mesma. Pode apagar a sua conta indo às Definições e selecionando a opção para apagar a sua conta. Podemos apagar a sua conta se estiver inativo durante mais de dois anos. Para evitar esta situação, tem de iniciar sessão pelo menos uma vez de dois em dois anos. 4. SUBSCRIÇÕES E MOEDA IN-APP 4.1. SUBSCRIÇÕES O utilizador pode adquirir um produto de subscrição em vários pacotes, tais como subscrições de um mês, três meses ou seis meses. A compra de uma subscrição é concluída, facturada, cobrada, renovada e pode ser cancelada ou rescindida conforme descrito nos presentes Termos de Serviço. Se comprar através da Apple App Store ou do Google Play, a sua compra está sujeita às normas e princípios técnicos estabelecidos pela Apple ou pelo Google, sobre os quais não temos qualquer controlo. A sua subscrição será renovada automaticamente pelo mesmo período de tempo que a sua subscrição original, a menos que desactive a funcionalidade de renovação automática pelo menos 24 horas antes do fim da sua subscrição atual. Isto deve-se ao facto de a sua conta poder ser cobrada pela renovação nas 24 horas anteriores ao fim do período da sua subscrição atual. Pode gerir a sua subscrição e desativar a renovação automática acedendo às definições da sua conta Apple ou Google. Também pode seguir as instruções sobre como cancelar uma subscrição fornecidas pela Apple (https://getsupport.apple.com/) ou pela Google (https://support.google.com/googleplay/). O utilizador não pode cancelar a sua subscrição atual durante o período de subscrição, embora possa cancelar a renovação automática em qualquer altura. Se efectuou a subscrição através da Apple App Store, os reembolsos são tratados pela Apple e não por nós. O utilizador pode solicitar um reembolso à Apple, conforme descrito acima. Todos os outros utilizadores podem solicitar um reembolso contactando-nos através de support@themeetgroup.com, ou enviando por correio ou entregando uma notificação assinada e datada que declare que está a cancelar este contrato, ou palavras de efeito semelhante. Inclua também o seu nome e o endereço de correio eletrónico, número de telefone ou outro identificador exclusivo que utilizou para se registar na sua conta. Este aviso deve ser enviado para: The Meet Group, Attn: Cancellations, 100 Union Square Drive, New Hope, PA 18938, EUA. Tanto a Apple como a Google facilitam “testes gratuitos” de produtos de subscrição para os primeiros utilizadores e poderemos tirar partido dessa possibilidade. Por exemplo, ocasionalmente, poderemos oferecer uma semana inicial gratuita aos subscritores pela primeira vez. A elegibilidade para qualquer teste está limitada a utilizadores que não tenham subscrito anteriormente, através de uma conta MeetMe atual ou anterior. Se o utilizador for um subscritor anterior e tentar solicitar um teste gratuito, deverá estar ciente de que a Apple ou a Google poderão reconhecer a sua inelegibilidade. Nesse caso, o utilizador poderá não receber um teste gratuito, mas poderá ser cobrado imediatamente pelo primeiro mês de subscrição. Esta é uma funcionalidade controlada pela Apple App Store ou pela Google Play Store, consoante a plataforma que utiliza para MeetMe. Geralmente, as compras de subscrições não são reembolsáveis (a menos que se apliquem termos especiais para reembolsos na sua região) e não são transferíveis, mesmo que expirem ou sejam descontinuadas. Podemos alterar o preço de compra das subscrições em qualquer altura, bem como as funcionalidades incluídas nas subscrições. Reservamo-nos o direito de interromper a emissão de subscrições em qualquer altura e de definir datas de expiração para as subscrições. As subscrições não podem ser trocadas por qualquer quantia em dinheiro ou valor monetário. Se o utilizador eliminar a sua conta ou se a sua conta for encerrada por qualquer motivo, perderá todo o tempo de subscrição não utilizado sem reembolso ou outra compensação. 4.2. DIREITO DE RESCINDIR A SUBSCRIÇÃO O utilizador tem o direito de rescindir (ou desistir) da sua subscrição no prazo de catorze (14) dias após a aceitação, por qualquer motivo. Para os residentes do Espaço Económico Europeu, consulte a secção 22 para obter mais informações sobre este direito. Além disso, quando exigido por lei, o seu património tem direito a solicitar o reembolso da parte não utilizada da sua subscrição se falecer durante o período da subscrição. Para exercer qualquer um destes direitos, o utilizador (ou, se aplicável, o seu património) deve notificar-nos por correio registado para The Meet Group, Inc., 100 Union Square Drive, New Hope, PA 18938, Attention: Member Services, ou por e-mail para support@themeetgroup.com com uma declaração clara da sua decisão de terminar a subscrição. Para cumprir o prazo de rescisão, o utilizador deve enviar-nos uma notificação do exercício do direito de rescisão antes do termo do período de rescisão de catorze dias. Se o utilizador terminar (ou desistir) da sua subscrição, reembolsaremos os pagamentos que recebemos do utilizador, menos qualquer montante de Credits que tenha consumido. Se o utilizador pretender terminar (ou desistir) da sua compra de Credits, ree"
