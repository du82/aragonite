["https://www.meetme.com/fr/communityguidelines"]
title = "Règles de la communauté pour MeetMe"
description = "Découvrez comment MeetMe favorise une communauté amicale et respectueuse. Découvrez nos lignes directrices, nos valeurs et nos règles à l'adresse suivante MeetMe"
full_description = "Règles de la communauté Dernière mise à jour : 3 décembre 2024 Des lignes directrices communautaires distinctes s’appliquent aux utilisateurs de l’EEE. Vous pouvez les consulter ci-dessous ou cliquer sur ici. Sommaire MeetMeRègles de la communauté MeetMe Règles de la communauté pour les utilisateurs de l’EEE MeetMeRègles de la communauté Nous soutenons la liberté d’expression et pensons qu’il est préférable pour nous tous que chacun ait une voix. Nous pensons que la multitude des points de vue et des expériences permet d’enrichir l’ensemble de notre communauté. Pour protéger à la fois l’expérience utilisateur et la sécurité, il existe certaines restrictions quant au contenu et au comportement autorisé. Nous sommes conscients que des abus peuvent survenir et que certains groupes en seront affectés de manière disproportionnée, notamment si ces abus relèvent du sexe, de la sexualité ou de la couleur de peau, ou s’ils visent spécifiquement des groupes historiquement sous-représentés ou marginalisés. Nous nous engageons à lutter contre les actes abusifs, en particulier lorsqu’ils sont motivés par la haine, les préjugés ou l’intolérance, et en particulier quand les abus ont pour but de faire taire les voix des personnes historiquement sous-représentées. Si tu remarques, sur MeetMe, quoique que ce soit susceptible d’enfreindre nos directives ou de ne pas les respecter, alors utilise la fonction de signalement dans l’application. Ces directives Community Guidelines font partie intégrante de nos Conditions générales. Contenus et comportement 1. Contenu réservé aux adultes Tu ne dois pas publier ou diffuser des supports réservés aux adultes. Le matériel réservé aux adultes désigne pour nous tout ce qui a trait à la pornographie et/ou tout ce qui peut avoir pour but de provoquer une excitation sexuelle. Quelques exemples spécifiques incluent, mais sans s’y limiter : La nudité totale ou partielle, y compris les gros plans (vêtus ou non) sur les parties génitales, les fesses ou la poitrine. Ces parties du corps ne doivent pas apparaître sur une photo ou sur un écran ; « Tester ses limites », peu importe que ce soit par la nudité comme un décolleté trop plongeant, un short trop court, un string ou des vêtements trop étroits ou trop transparents ; Des gestes ou sales (y compris le doigt d’honneur) ; Simulation d’un acte sexuel ; et Rapport sexuel, ou tout autre acte sexuel impliquant des individus, la représentation d’animaux ayant des traits humains, des dessins animés, des hentai ou des anime. 2. Violence graphique Tu ne dois pas diffuser de contenu graphiquement violent ou trop sanglant. Nous considérons comme contenu violent, tout ce qui représente graphiquement la mort, la violence, des procédures chirurgicales ou des blessures graves sur des personnes ou des animaux. Quelques exemples spécifiques incluent, mais sans s’y limiter : Des crimes atroces ou des scènes d’accident ; Des altercations physiques violentes ; Des fluides corporelles, telles que le sang, les matières fécales, le sperme, etc. ; Des organes internes ou os ouverts ; Des lésions physiques importantes, y compris des plaies visibles, des os cassés, etc. ; La torture et la mise à mort d’animaux ; et Des animaux gravement blessés ou mutilés. 3. Activités ou produits dangereux Tu ne dois pas publier ou diffuser de contenu représentant des activités ou produits dangereux. Quelques exemples spécifiques incluent, mais sans s’y limiter : Encourager l’automutilation, le suicide, les troubles alimentaires ou tout autre acte susceptible d’entraîner des blessures graves ou la mort ; Des « démonstrations de courage » dangereuses, des jeux, des batailles ou des concours ; Des drogues et stupéfiants dangereux ; et La diffusion de contenu au volant d’un véhicule de tout type (y compris en vélo). 4. Marchandises et prestations illégales ou réglementées. Tu ne dois pas publier ou diffuser de contenu représentant des marchandises ou prestations illégales ou réglementées. Quelques exemples spécifiques incluent, mais sans s’y limiter : Des contrefaçons et les prestations afférentes ; Le commerce d’êtres humains ; Drogues (y compris la marijuana) et matériels de drogue, ou accessoires connexes ; Instruments financiers ou prestations, Jeux de hasard ; Produits issus d’espèces menacées ou protégées ; Prostitution ou services sexuels ; Marchandises dérobées ; et Armes, y compris armes à feu, munitions et explosifs, et instructions pour la fabrication d’armes (par exemple, bombes, pistolets imprimés en 3D, etc.) 5. Utilisation non autorisée Tu ne dois pas utiliser MeetMe à des fins illégales ou pour soutenir des activités illégales. En utilisant MeetMe, tu acceptes toutes les lois applicables régissant ton comportement en ligne et ton contenu. 6. Propriété intellectuelle Tu ne dois pas publier ou diffuser de contenu pour lequel tu ne disposes pas des droits de publication, ou qui porte atteinte à un brevet, une marque, un secret commercial, un droit d’auteur, la vie privée ou tout autre droit exclusif d’une personne. 7. Utilisation non autorisée Tu ne dois pas publier ou diffuser la voix ou l’image d’une autre personne sans son consentement. En conséquence, tu ne dois pas non plus publier ou diffuser des enregistrements ou des images d’une autre personne si les enregistrements et la diffusion ont eu lieu sans son consentement. 8. Informations privées Tu ne dois pas publier ou diffuser d’information privée d’une autre personne sans son autorisation. Cela inclut les photos, vidéos et toute autre donnée personnelle. Tu ne dois pas non plus menacer de publier ni encourager les autres à le faire. 9. Spam et sécurité Tu ne dois pas utiliser MeetMe pour envoyer des spams. Tu ne dois pas enregistrer automatiquement des comptes ou publier du contenu, systématiquement ou par programme. Tu ne dois pas télécharger ou transmettre de virus logiciels, de logiciels malveillants ou d’autres codes, fichiers ou programmes informatiques nuisibles, ni collecter des données, utiliser des robots ou des méthodes similaires de collecte ou d’extraction de données. Tu ne dois pas perturber MeetMe, ni lui imposer une charge disproportionnée (pas plus qu’à une autre personne utilisant MeetMe), ni imposer une charge aux réseaux associés à MeetMe. Tu ne dois pas enfreindre, ni tenter d’enfreindre, les mesures de sécurité de MeetMe. 10. Publicité Tu ne dois pas publier ou diffuser des publicités non sollicitées ou non autorisées, du contenu promotionnel, des spams, des chaînes de lettres, des systèmes pyramidaux ou toute autre forme de démarchage, ni solliciter sans autorisation des concours, des offres de cadeaux ou des loteries/jeux de hasard. 11. Usurpation d’identité Tu ne dois pas imiter une personne, un groupe ou une organisation dans le but d’induire en erreur, de troubler ou de tromper les autres. 12. Violence et blessures physiques Tu ne dois pas exprimer de menaces spécifiques de violence ou de souhait de blessures physiques graves, de mort ou de maladie d’un individu ou d’un groupe. Cela inclut, mais sans s’y limiter, la menace ou la promotion du terrorisme. Tu ne dois pas promouvoir ou encourager le suicide ou l’automutilation. 13. Personnes mineures Tu ne dois pas publier ou diffuser du contenu montrant des personnes mineures (moins de 18 ans), ni faire apparaître des personnes mineures dans ton stream. Il en va de même s’il s’agit de tes propres enfants, et même si tu as l’autorisation de le faire. 14. Mise en danger du bien-être de l’enfant et exploitation sexuelle Tu ne dois pas publier ou diffuser de contenu sexualisant des personnes mineures (moins de 18 ans) ou encourageant ou glorifiant l’exploitation sexuelle des enfants. Des exemples de contenus représentant ou encourageant l’exploitation sexuelle des enfants incluent, mais sans s’y limiter : La représentation visuelle d’une personne mineure dans des positions sexuellement explicites ou suggestives ; Les représentations illustrées, générées par ordinateur ou autres, de personnes mineures dans un contexte sexuellement explicite, ou au cours d’un acte sexuellement explicite ; et Des liens vers des prestataires tiers présentant du contenu montrant des enfants victimes d’exploitation sexuelle. Les comportements suivants ne sont pas non plus autorisés par MeetMe : Fantasmer sur l’exploitation sexuelle des enfants ou encourager l’exploitation sexuelle des enfants ; Exprimer le souhait d’obtenir du contenu sur l’exploitation sexuelle des enfants ; Recrutement, publicité ou manifestation d’intérêt pour : (1) un acte sexuel contre rémunération avec un enfant, ou (2) héberger ou de transporter un enfant à des fins sexuelles ;< Impliquer une personne mineure dans une relation sexuellement explicite ; et Identifier les victimes présumées d’exploitation sexuelle au cours de leur enfance par leur nom ou leur photo. 15. Comportement abusif Tu ne dois pas harceler une autre personne ni inciter qui que ce soit à harceler quelqu’un. Nous considérons toute tentative de harcèlement, d’intimidation ou de réduction au silence comme un comportement abusif. Tu ne dois pas harceler directement qui que ce soit en envoyant des contenus sexuels non désirés, en en faisant un objet d’une manière sexuellement explicite ou en adoptant d’autres comportements sexuels répréhensibles. Tu ne dois pas publier ou diffuser de contenu exploitant des individus (y compris l’extorsion d’argent, l’extorsion par la menace, etc.), qui humilie ou harcèle les autres, ou qui humilie ou harcèle les victimes d’événements tragiques (ou leurs amis ou familles). Le contexte contribue à évaluer les comportements abusifs et à déterminer les mesures d’exécution appropriées de la directive. Parmi les facteurs que nous prenons en compte figurent notamment, mais sans s’y limiter : Le comportement vise une personne ou un groupe d’individus ; et Le signalement a été fait par la personne qui a été la cible de l’abus ou par un témoin. 16. Comportement haineux et harcèlement moral Tu ne dois pas encourager la violence contre les personnes, menacer de le faire ou harceler d’autres personnes en raison de la race, de la religion, de l’ethnie, de l’origine, de l’orientation sexuelle, du sexe, de l’identification de genre, de l’âge, d’un handicap, d’une maladie grave, du statut d’ancien combattant ou d’autres traits caractéristiques liés à la discrimination systémique ou à la marginalisation. Tu ne dois pas avoir d’images ou de symboles incitant à la haine sur ta photo de profil ou sur ton profil. u ne dois pas utiliser ton nom d’utilisateur, ton pseudo ou ton profil pour te comporter de manière abusive, comme pour exprimer un harcèlement ciblé ou une haine envers une personne, un groupe ou une catégorie protégée. Certains contenus peuvent être considérés comme haineux lorsqu’ils sont consultés individuellement, mais ils peuvent être évalués différemment dans le contexte global du divertissement. Par exemple, les membres d’une catégorie protégée pourraient se désigner entre eux par des termes généralement considérés comme péjoratifs. Lorsque ces termes sont utilisés de manière consensuelle, l’intention qui les sous-tend n’est pas de dévaloriser, mais de se réapproprier des termes qui ont été historiquement utilisés pour dévaloriser les personnes. Tu n’as pas besoin d’être membre d’un groupe victime de comportements haineux pour que nous prenions des mesures. Nous ne demandons pas aux personnes de prouver ou de réfuter leur appartenance à un groupe protégé et nous n’obtiendrons pas cette information par nous-mêmes. Les comportements que nous considérons comme haineux, par exemple, ne se limitent pas à la haine : a. Menaces de violence Les menaces de violence sont des déclarations claires de l’intention d’infliger des blessures à un individu, entraînant des dommages physiques graves et persistants pouvant provoquer le décès ou des blessures graves, par exemple « Je vais te tuer ». Nous appliquons une politique de tolérance zéro à l’égard des menaces de violence. Les comptes qui, selon nous, partagent des menaces de violence seront immédiatement et définitivement bloqués. b. Souhaiter, espérer ou inciter à ce qu’une personne ou un groupe de personnes subisse des blessures graves. Tu ne dois pas publier ou diffuser des publicités non sollicitées ou non autorisées, du contenu promotionnel, des spams, des chaînes de lettres, des systèmes pyramidaux ou toute autre forme de démarchage, ni solliciter sans autorisation des concours, des offres de cadeaux ou des loteries/jeux de hasard. Espérer qu’un individu meurt d’une maladie grave, par exemple « J’espère que tu auras un cancer et que tu mourras » ; Souhaiter qu’un individu soit victime d’un accident grave, par exemple « J’espère que la prochaine fois que tu diras quelque chose comme ça, tu te feras écraser par une voiture » ; et Dire qu’un groupe de personnes mérite de souffrir de graves blessures physiques, par exemple « Si ce groupe de manifestants ne se tait pas, ils méritent de se faire tirer dessus ».“ c. Meurtres de masse, actes de violence ou violences spécifiques Tu ne dois pas publier ou diffuser de contenu encourageant des meurtres de masse, actes de violence ou violences spécifiques. Cela inclut, mais sans s’y limiter, envoyer à quelqu’un : Des contenus représentant des victimes de l’Holocauste ; et Des contenus représentant des lynchages. d. Contenu attisant la peur d’un groupe de personnes Tu ne dois pas adresser de contenu à des individus dans le but de susciter la peur ou des préjugés anxiogènes à l’encontre d’un groupe de personnes, y compris en affirmant que les membres d’un groupe sont impliqués dans des activités dangereuses ou illégales, par exemple « tous les [groupe religieux] sont des terroristes ». e. Termes racistes répétés et/ou utilisés de manière non consensuelle, noms injurieux, expressions imagées racistes et sexistes ou autre matériel dégradant. Tu ne dois pas proférer des humiliations répétées, des expressions imagées ou d’autres contenus qui ont pour but de déshumaniser, de rabaisser ou de formuler des préjugés négatifs ou nuisibles à l’égard d’un groupe protégé, en visant spécifiquement des personnes. Il peut notamment s’agir d’attribuer volontairement le mauvais sexe ou d’utiliser l’ancien nom d’une personne transgenre. f. Images haineuses Tu ne dois pas publier ou diffuser des logos, symboles ou images dont l’objectif est de promouvoir l’hostilité et l’injustice envers autrui sur la base de la race, de la religion, de l’ethnie, de l’origine, de l’orientation sexuelle, du sexe, de l’âge, d’un handicap, d’une maladie grave, du statut d’ancien combattant ou de toute autre caractéristique, et qui sont liés à la discrimination et à l’exclusion systématiques. Quelques exemples d’images haineuses : Symboles historiquement associés à des groupes haineux, par exemple la croix gammée nazie Images représentant d’autres personnes comme moins humaines ou modifiées de manière à inclure des symboles haineux, par exemple en modifiant des images d’"
