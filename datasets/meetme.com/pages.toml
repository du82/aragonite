title = "MeetMe Políticas de cumplimiento"
description = "Descubra el enfoque de MeetMe en materia de responsabilidad social y compromisos éticos."
full_description = "Cumplimiento 1. Whistleblower System/ German Supply Chain Due Diligence Act La actuación responsable requiere una actitud y se nutre de la continuidad. Para ello, tenemos una serie de valores que queremos vivir como filial de ProSiebenSat.1 Media SE. Tenemos una responsabilidad social y nos la tomamos muy en serio, especialmente a través de nuestra exigencia de un comportamiento conforme en la actividad diaria. Encontrará información sobre nuestro sistema de gestión del cumplimiento como filial de ProSiebenSat.1 Media SE en aquí. También puede acceder a nuestro sistema de denuncia de irregularidades a través de este enlace, especialmente en relación con la Ley alemana de Obligaciones de Abastecimiento en la Cadena de Suministro (Lieferkettensorgfaltspflichtengesetz). 2. Digital Services Act Entre febrero de 2024 y agosto de 2024, el número promedio de usuarios que iniciaron sesión en MeetMe y usaron activamente su perfil dentro de la Unión Europea (UE) fue considerablemente inferior a 45 millones."
