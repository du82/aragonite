qui. 2. IDONEITÀ DELL’ACCOUNT E USO DI MEETME Per registrarsi a MeetMe è necessario avere almeno 18 anni. I visitatori di età inferiore a 18 anni non possono accedere a MeetMe né utilizzare MeetMe. Accedendo ai Servizi e/o completando la procedura di registrazione per MeetMe, l’utente dichiara di avere almeno 18 anni e di poter essere legalmente vincolato dal presente Accordo. MeetMe è destinato esclusivamente all’uso personale dell’utente e non può essere utilizzato per altri scopi. Non è possibile utilizzare MeetMe in relazione a qualsiasi attività commerciale senza il nostro espresso consenso scritto. Non è consentito a società o ad altre organizzazione di diventare Utenti di MeetMe o di utilizzare MeetMe senza il nostro espresso consenso scritto. Ci riserviamo il diritto di indagare su qualsiasi sospetto uso non autorizzato di MeetMe e possiamo prendere provvedimenti a nostra esclusiva discrezione, inclusa, a titolo esemplificativo, la richiesta di rimedi legali, civili, penali o ingiuntivi. L’utente non può utilizzare MeetMe dove vietato dalla legge e accetta di rispettare tutte le norme locali relative alla condotta online e ai contenuti accettabili. 3. REGISTRAZIONE Per accedere a e utilizzare MeetMe è necessario registrarsi. Per far ciò, l’utente dovrà scegliere una delle opzioni disponibili, vale a dire registrazione via e-mail, SMS o tramite Apple, Google o Facebook, e fornire credenziali di accesso, vale a dire indirizzo e-mail e una password a scelta. L’utente è responsabile della riservatezza della password e delle credenziali del proprio account. L’utente è inoltre responsabile di tutte le attività colpevolmente causate che si verificano sul suo account. L’utente accetta di comunicarci immediatamente qualsiasi uso non autorizzato del proprio account o qualsiasi altra violazione della sicurezza non appena ne venga a conoscenza. L’utente può eliminare il proprio account andando su Impostazioni e selezionando l’opzione relativa all’eliminazione dell’account. Qualora l’utente rimanga inattivo per più di due anni, possiamo provvedere all’eliminazione dell’account. Per impedire che ciò avvenga è necessario effettuare l’accesso al proprio account almeno una volta ogni due anni. 4. ABBONAMENTI E VALUTA IN-APP 4.1. ABBONAMENTI L’utente può acquistare un prodotto in abbonamento in vari pacchetti, come ad esempio un abbonamento della durata di un mese, di tre mesi o di sei mesi. L’acquisto di un abbonamento è stipulato, fatturato, addebitato, rinnovato e può essere annullato o disdetto come descritto nei presenti TdS. Se l’acquisto è stato effettuato tramite l’App Store di Apple o Google Play, è soggetto agli standard tecnici e ai principi stabiliti da Apple o Google, sui quali non abbiamo alcun controllo. L’abbonamento si rinnova automaticamente per lo stesso periodo di tempo dell’abbonamento originale, a meno ché la funzione di rinnovo automatico non venga disattivata almeno 24 ore prima della scadenza dell’abbonamento in corso. Ciò in quanto l’addebito del conto dell’utente per il rinnovo dell’abbonamento potrebbe avvenire nelle 24 ore precedenti la scadenza dell’abbonamento in corso. È possibile gestire l’abbonamento e disattivare il rinnovo automatico tramite le impostazioni dell’account Apple o Google. È inoltre possibile seguire le istruzioni su come annullare un abbonamento fornite da Apple (https://getsupport.apple.com/) o Google (https://support.google.com/googleplay/). Potrebbe non essere possibile annullare l’abbonamento in corso durante il periodo di validità dell’abbonamento; tuttavia è possibile annullare il rinnovo automatico in qualsiasi momento. Se la sottoscrizione è avvenuta tramite l’App Store di Apple, i rimborsi saranno gestiti da Apple, non da noi. È possibile richiedere un rimborso da Apple con le modalità descritte in precedenza. Tutti gli altri utenti possono richiedere un rimborso contattandoci all’indirizzo support@themeetgroup.com, o inviando o consegnando una comunicazione firmata e datata che