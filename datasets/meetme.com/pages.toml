 você não poderá acessar ou usar MeetMe. Todas as informações sobre como processamos suas informações pessoais podem ser encontradas em nossa Política de Privacidade. A SEÇÃO ABAIXO INTITULADA “ACORDO DE ARBITRAGEM, RENÚNCIA DE AÇÃO COLETIVA E RENÚNCIA A JULGAMENTOS COM JÚRI” CONTÉM UM ACORDO DE ARBITRAGEM VINCULANTE, AÇÃO COLETIVA E RENÚNCIA DE JULGAMENTO POR JÚRI QUE AFETAM SEUS DIREITOS LEGAIS. LEIA-O ATENTAMENTE. Reservamo-nos o direito de alterar estes Termos de Serviço a qualquer momento. Você é responsável por se manter informado sobre tais alterações. Se fizermos qualquer alteração material nos TOS, notificaremos você sobre tal alteração quando você abrir o MeetMe. Se você se opuser a quaisquer Termos de Serviço dos TOS ou quaisquer alterações subsequentes ou ficar insatisfeito com a MeetMe de alguma forma, sua única opção é parar de usar a MeetMe. Seu uso continuado da MeetMe após publicarmos os TOS revisados​significa que você concorda com as revisões. Usamos o termo “Usuários” nestes TOS para incluir todos os usuários finais da MeetMe, incluindo usuários finais que estão reproduzindo ou transmitindo por meio da MeetMe (“Streamers”). A MeetMe opera dentro de uma rede de outros aplicativos de propriedade ou operados pela TMG e/ou parceiros de Live (“Rede Live”). Para descobrir quais parceiros de Live estão na Rede Live, clique aqui. 2. ELEGIBILIDADE DA CONTA E USO DE MEETME Você deve ter pelo menos 18 anos para se registrar na MeetMe. Se você tiver menos de 18 anos, não poderá acessar ou usar a MeetMe. Ao acessar os Serviços e/ou concluir o processo de registro na MeetMe, você declara que tem 18 anos ou mais e pode e estará legalmente vinculado a este Contrato. A MeetMe destina-se apenas ao seu uso pessoal e você não pode usá-la para nenhuma outra finalidade. Você não pode usar MeetMe em conexão com nenhuma atividade comercial sem nossa aprovação expressa por escrito. Empresas e outras organizações não podem se tornar Usuários da MeetMe nem usar a MeetMe se