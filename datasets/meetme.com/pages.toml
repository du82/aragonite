title = "Community Guidelines voor MeetMe"
description = "Ontdek hoe MeetMe een vriendelijke en respectvolle gemeenschap bevordert. Bekijk onze richtlijnen, waarden en regels op MeetMe"
full_description = "Community Guidelines Last Updated: December 3, 2024 Voor gebruikers in de EER gelden aparte communautaire richtsnoeren. U kunt deze hieronder verder raadplegen of hier klikken op Community Guidelines . Table of Contents MeetMeCommunity Guidelines MeetMe Community Guidelines voor gebruikers in de EER MeetMeCommunity Guidelines We are committed to free expression, and we believe everyone is best served when everyone has a voice. We believe a rich diversity of viewpoints and experiences enriches our entire community. In order to protect the experience and safety of our users, however, there are some limitations on the type of content and behavior that we allow. In particular, we recognize that abuse can happen, and it can happen to some groups disproportionately, especially when based on sex, sexuality, color, or targeted at marginalized or historically underrepresented groups. We are committed to combating abusive conduct, particularly when motived by hatred, prejudice or intolerance, particularly abuse that seeks to silence the voices of those who have been historically marginalized. If you see something on MeetMe that you believe violates our policies, please report it to us. This Content and Conduct Policy is part of our Terms of Service. Inhoud en gedrag 1. Voor minderjarigen ongeschikte inhoud Je mag geen voor minderjarigen ongeschikt materiaal (adult content) posten of streamen. Voor minderjarigen ongeschikt materiaal is voor ons elk pornografisch materiaal en/of alles, wat eventueel de bedoeling heeft seksuele opwinding te veroorzaken. Een paar specifieke voorbeelden daarvan, maar niet daartoe beperkt, zijn: volledige of gedeeltelijke naaktheid, met inbegrip van close-ups (ongeacht gekleed of ongekleed) van geslachtsdelen, zitvlak of borsten. Deze lichaamsdelen dienen niet het voornaamste onderdeel op een foto of op een beeldscherm te zijn; ‘grenzen aftasten’, ongeacht of dit gebeurt door naaktheid zoals te laag decolleté, te nauwe shorts, tanga’s of te nauwe en te doorzichtige kleding; obscene of vieze gebaren (waaronder het opsteken van de middelvinger); een seksuele handeling nadoen; en tonen van geslachtsverkeer of enige andere seksuele handeling van mensen, dieren met menselijke trekken, met inbegrip van cartoons, Hentai of Anime. 2. Grafisch geweld Je mag geen grafisch gewelddadig of bovenmatig bloeddorstig materiaal posten of streamen. Gewelddadig materiaal is voor ons alles waarbij dood, geweld, chirurgische ingrepen of zwaar letsel van mensen of dieren grafisch wordt getoond. Een paar specifieke voorbeelden daarvan, maar niet daartoe beperkt, zijn: gruwelijke misdaden of beelden van ongelukken; heftige psychische confrontaties; lichaamsvocht zoals bloed, fecaliën, sperma enz.; blootliggende interne organen of botten; zwaar lichamelijk letsel, met inbegrip van zichtbare wonden, gebroken botten enz.; martelen of doden van dieren; en zwaargewonde of verminkte dieren. 3. Gevaarlijke activiteiten of producten Je mag geen materiaal posten of streamen in de vorm van gevaarlijke activiteiten of producten. Een paar specifieke voorbeelden daarvan, maar niet daartoe beperkt, zijn: stimulering van zelfverminking, zelfmoord, eetstoornissen of andere handelingen waarbij zware verwondingen of dood kunnen optreden; gevaarlijke ‘weddenschappen’, spelletjes, gevechten of wedstrijden; gevaarlijke verdovende middelen; en streamen tijdens het besturen van een voertuig van welke aard dan ook (waaronder fietsen). 4. Illegale of gereglementeerde goederen of diensten Je mag geen materiaal posten of streamen in de vorm van illegale of gereglementeerde goederen of diensten. Een paar specifieke voorbeelden daarvan, maar niet daartoe beperkt, zijn: desbetreffende vervalsingen en diensten; mensenhandel; drugs (waaronder marihuana) en gebruiksvoorwerpen voor drugs of daarmee samenhangend toebehoren; financiële instrumenten of diensten; kansspelen; producten van bedreigde of beschermde diersoorten; prostitutie of seksuele diensten; gestolen goederen; en wapens, waaronder vuurwapens, munitie en explosieven en instructies voor het vervaardigen van wapens (bijv. bommen, pistolen d.m.v. 3D-printen enz.) 5. Onrechtmatig gebruik Je mag MeetMe niet voor onrechtmatige doeleinden of ter ondersteuning van illegale activiteiten gebruiken. Als je MeetMe gebruikt, ga je akkoord met alle toepasselijke wetten die je online gedrag en inhoud regelen. 6. Intellectuele eigendom Je mag geen materiaal posten of streamen waarvan je niet de publicatierechten hebt of waarvan het gebruik een schending oplevert van een octrooi, een merk, een bedrijfsgeheim, het auteursrecht, de privésfeer of andere eigendomsrechten. 7. Onbevoegd gebruik Je mag de stem of foto van andere personen niet zonder hun toestemming posten of streamen. Dienovereenkomstig mag je ook geen opnames of foto’s van andere personen posten of streamen als de opnames en de distributie daarvan heeft plaatsgevonden zonder hun toestemming. 8. Privé-gegevens Je mag geen privé-gegevens van andere personen posten of streamen zonder hun toestemming. Daaronder vallen ook foto’s, video’s en andere persoonsgegevens. Evenmin mag je dreigen deze gegevens openbaar te maken en anderen aanmoedigen deze openbaar te maken. 9. Spam en veiligheid Je mag MeetMe niet gebruiken om spam te versturen. Je mag accounts niet automatisch registreren of materiaal automatisch, systematisch of programmatisch openbaar maken. Je mag geen softwarevirus, malware of andere schadelijke computercodes, bestanden of programma’s uploaden of overdragen en evenmin gegevens verzamelen, robots of andere methodes voor datamining of extractie van gegevens gebruiken. Je mag MeetMe niet storen of MeetMe buitensporig belasten (en evenmin andere personen die MeetMe gebruiken) of netwerken belasten die met MeetMe in verbinding staan. 10. Reclame Je mag geen ongevraagde of ongeoorloofde reclame, reclamemateriaal, spam, kettingbrieven, pyramidesystemen of een andere vorm van klantenwerving posten of streamen noch onbevoegd oproepen tot wedstrijden, geschenkacties of loterijen/kansspelen. 11. Valse identiteit Je mag geen personen, groepen of organisaties imiteren op een manier die bedoeld is om anderen te misleiden, in de war te brengen of te bedriegen. 12. Geweld en fysieke verwonding Je mag geen specifieke dreigingen met geweld of de wens naar zwaar lichamelijk letsel, dood of ziekte van een individu of een groep uiten. Dit omvat, maar is niet beperkt tot, het dreigen met terrorisme of het stimuleren daarvan. Je mag geen zelfmoord of zelfverminking promoten of dit aanmoedigen. 13. Minderjarigen Je mag geen inhoud posten of streamen waarop minderjarigen (leeftijd onder de 18 jaar) te zien zijn en evenmin minderjarigen in je stream laten verschijnen. Dit geldt tevens als het gaat om je eigen kinderen en ook als je daarvoor toestemming hebt. 14. In gevaar brengen van kinderen en seksuele uitbuiting Je mag geen materiaal posten of streamen dat minderjarigen (personen jonger dan 18 jaar) seksualiseert of seksuele uitbuiting van kinderen stimuleert of verheerlijkt. Inhoud die seksuele uitbuiting van kinderen toont of stimuleert omvat bijvoorbeeld, maar is niet beperkt tot: visuele weergave van een minderjarige persoon bij seksueel expliciete of seksueel suggestieve handelingen; afbeeldingen, computergegeneerde of andere weergaven van minderjarigen in een expliciet seksuele context of tijdens een seksueel expliciete handeling; en links naar websites van derden die materiaal presenteren dat seksuele uitbuiting van kinderen toont. Het volgende gedrag is bij MeetMe evenmin toegestaan: fantaseren over seksuele uitbuiting van kinderen of het aanmoedigen kinderen seksueel uit te buiten; uiten van de wens om materiaal te ontvangen dat seksuele uitbuiting van kinderen als inhoud heeft; aanwerving van, promoten van of tonen van interesse in: (1) een commerciële seksuele handeling met een kind of (2) huisvesting of vervoer van een kind om seksuele redenen; het betrekken van een minderjarige in een seksueel expliciet gesprek; en het identificeren van vermoedelijke slachtoffers van seksuele uitbuiting tijdens de kindertijd door naam of foto. 15. Gevallen van misbruik Je mag andere personen niet lastig vallen of anderen ertoe aanzetten, iemand lastig te vallen. We beschouwen elke poging om iemand te pesten, te intimideren of tot zwijgen te brengen als misbruik. Je mag niemand direct lastig vallen door ongewenste seksuele inhoud te versturen, iemand op seksuele wijze tot object te maken of ander seksueel ongepast gedrag te vertonen. Je mag geen inhoud posten of streamen waardoor anderen worden uitgebuit (waaronder afpersing van geld, chantage door bedreiging enz.), anderen worden vernederd of gepest, of slachtoffers van tragische gebeurtenissen (of hun vrienden of familie) worden vernederd of gepest. Bij de beoordeling of er sprake is van gedrag dat misbruik oplevert en bij de bepaling van geschikte handhavingsmaatregelen van de richtlijnen wordt gekeken naar de context. De factoren waarmee we rekening houden omvatten, maar zijn niet beperkt tot: Het gedrag is gericht op een persoon of een groep mensen; en De melding is gedaan door de persoon die het doelwit was van het misbruik of door een getuige. 16. Haatdragend gedrag en mobbing Je mag geen geweld tegen mensen stimuleren, daarmee dreigen of andere mensen lastig vallen door systematische discriminatie of marginalisatie op grond van ras, religie, etniciteit, afkomst, seksuele geaardheid, geslacht, geslachtsidentificatie, leeftijd, handicap, ernstige ziekte, veteranenstatus of andere karakteristieke eigenschappen. Je mag geen haatdragende afbeeldingen of symbolen in je profielfoto of je profiel hebben. Je mag je gebruikersnaam, schermnaam of je profiel niet gebruiken om je verkeerd te gedragen, bijvoorbeeld voor gerichte intimidatie of het uitdrukken van haat ten aanzien van een persoon, groep of een beschermde categorie. Bepaalde inhoud kan afzonderlijk bezien worden beschouwd als haatdragend, maar kan anders worden beoordeeld in de context van het volledige gesprek. Zo kunnen bijvoorbeeld personen die tot een beschermde categorie behoren, zich onderling met begrippen aanspreken die normaal gesproken worden beschouwd als minachtende begrippen. Als deze benamingen met wederzijds goedvinden worden gebruikt is de onderliggende bedoeling niet minachtend, maar betekent dit een herovering van begrippen die in het verleden werden gebruikt om mensen te kleineren. Je hoeft niet tot de groep te behoren die het doelwit is van haat om ons tot het treffen van maatregelen te bewegen. We vragen mensen niet om aan te tonen dan wel te weerleggen dat ze behoren tot een beschermde groep en zullen deze informatie niet zelf inwinnen. Gedrag dat door ons als haatdragend wordt beschouwd is bijvoorbeeld, maar niet beperkt tot: a. Bedreigingen met geweld Je mag een identificeerbaar doelwit niet met geweld dreigen. Bedreigingen met geweld zijn duidelijke verklaringen van de intentie om iemand verwondingen toe te brengen, die kunnen leiden tot ernstig en blijvend letsel, waardoor een persoon kan sterven of ernstig gewond kan raken, bijv. “Ik ga je doden”. We hebben een nultolerantiebeleid wat betreft bedreigingen met geweld. Accounts die naar onze mening bedreigingen met geweld delen, worden onmiddellijk en blijvend geblokkeerd. b. Een persoon of een groep van personen ernstige schade toewensen, dit hopen of daartoe oproepen. Je mag geen inhoud posten of streamen waarin de wens, hoop of het verlangen naar de dood, ernstig of blijvend letsel of een ernstige ziekte van een persoon of een groep wordt uitgedrukt. Dit omvat, maar is niet beperkt tot: hopen dat iemand sterft tengevolge van een ernstige ziekte, bijv. “Ik hoop dat je kanker krijgt en sterft”; wensen dat iemand het slachtoffer wordt van een ernstig ongeluk, bijv. “Ik wil dat je wordt aangereden door een auto als je nog eens zoiets zegt”; en zeggen dat een groep van personen ernstig lichamelijk letsel verdient, bijv. “Als deze groep demonstranten niet hun mond houdt, dan verdienen ze het om te worden neergeschoten.” c. Massamoord, gewelddadigheden of speciale vormen van geweld. Je mag geen inhoud posten of streamen die massamoord, gewelddadigheden of speciale vormen van geweld stimuleert jegens een persoon of een groep. Dit omvat, maar is niet beperkt tot, het naar iemand verzenden van het volgende: inhoud waarin slachtoffers van de holocaust worden getoond; en inhoud waarin lynchmoorden worden getoond. d. Inhoud die angst voor een bepaalde groep mensen aanwakkert Je mag geen inhoud aan individuen richten om angst of angst veroorzakende voordelen tegen een groep mensen aan te wakkeren, waaronder de bewering dat de degenen die bij een groep behoren, deelnemen aan gevaarlijke of illegale activiteiten, bijv. “Alle [religieuze groep] zijn terroristen.” e. Herhaalde en/of niet met wederzijds goedvinden gebruikte racistische begrippen, scheldnamen, racistische en seksistische visuele uitingen en ander denigrerend materiaal. Je mag geen herhaalde vernederingen, visuele uitingen of andere inhoud doelbewust tegen personen richten die de intentie hebben om te ontmenselijken, te denigreren of negatieve of schadelijke vooroordelen te stimuleren ten aanzien van een beschermde groep. Dit omvat bijvoorbeeld het doelbewust toewijzen van het verkeerde geslacht of het gebruiken van een oude naam van een transgender persoon. f. Haatdragende afbeeldingen Je mag geen logo’s, symbolen of afbeeldingen posten of streamen die tot doel hebben vijandigheid en ongerechtigheid te stimuleren tegen anderen op grond van ras, religie, etniciteit, afkomst, seksuele geaardheid, geslacht, geslachtsidentificatie, leeftijd, handicap, ernstige ziekte, veteranenstatus of andere karakteristieke eigenschappen en die verband houden met systematische discriminatie en buitensluiting. Een paar voorbeelden van haatdragend beeldmateriaal zijn onder andere: symbolen, die historisch gezien geassocieerd worden met haatgroepen, bijv. het nazi-hakenkruis; afbeeldingen die anderen als minder menselijk weergeven en zo zijn veranderd, dat ze haatdragende symbolen vervatten, bijv. afbeeldingen van individuen die zo zijn veranderd dat ze dierlijke kenmerken weergeven; en afbeeldingen die zo zijn veranderd dat ze haatdragende symbolen of verwijzingen bevatten naar massamoord of een bepaalde beschermde groep, bijv. afbeeldingen van individuen die zo zijn veranderd dat ze gele Davidsterren tonen met een verwijzing naar de holocaust. 17. Misbruik van de meldmogelijkheid Alle gebruikers hebben de mogelijkheid om ons illegale en ongepaste inhoud binnen ons platform te melden. Misbruik van de meldmogelijkheid is echter niet toegestaan. Het herhaaldelijk indienen van meldingen of klachten die overduidelijk ongegrond zijn, kan dan ook leiden tot sancties op ons platform. We zullen je hierop wijzen of je waarschuwen voordat we een beslissing nemen. Of er sprake is van misbruik van de meldmogelijkheid wordt met name bepaald door het aantal kennelij"
