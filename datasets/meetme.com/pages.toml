title = "Community Guidelines für MeetMe"
description = "Lerne, wie MeetMe eine freundliche und respektvolle Gemeinschaft fördert. Erkunde unsere Richtlinien, Werte und Regeln für MeetMe"
full_description = "Community Guidelines Stand: 3 Dezember 2024 Für Nutzer im EWR gelten gesonderte Community Guidelines. Du findest sie unten oder klick hier. Inhaltsverzeichnis MeetMe Community Guidelines MeetMe Community Guidelines für Nutzer im EWR MeetMe Community Guidelines Wir stehen hinter der freien Meinungsäußerung und glauben, dass es für uns alle am besten ist, wenn jeder eine Stimme hat. Wir glauben, dass eine reiche Vielfalt an Sichtweisen und Erfahrungen unsere gesamte Gemeinschaft bereichert. Damit sowohl Nutzererlebnis als auch die Sicherheit geschützt bleiben, gibt es einige Einschränkungen bezüglich von uns zugelassenem Inhalt und Verhalten. Uns ist bewusst, dass Missbrauch geschehen kann und, dass einige Gruppen unverhältnismäßig von Missbrauch betroffen sein werden, besonders wenn dieser Missbrauch auf Geschlecht, Sexualität oder Hautfarbe abzielt oder gezielt gegen historisch unterrepräsentierte Gruppen oder Randgruppen gerichtet ist. Wir verpflichten uns dazu, missbräuchliche Handlungen zu bekämpfen, insbesondere wenn sie durch Hass, Vorurteile oder Intoleranz motiviert sind und auch insbesondere wenn es das Bestreben des Missbrauchs ist, die Stimmen derjenigen zum Schweigen zu bringen, die historisch unterrepräsentiert sind. Wenn du bei MeetMe etwas siehst, das unsere Richtlinien verletzt oder gegen die Richtlinien verstößt, dann verwende bitte die Meldefunktion. Diese Richtlinie zu Inhalt und Verhalten ist Teil unserer Geschäftsbedingungen. Inhalte und Verhalten 1. Nicht-jugendfreie Inhalte Du darfst kein nicht-jugendfreies Material posten oder streamen. Nicht-jugendfreies Material ist für uns alles Pornografische und/oder alles, was möglicherweise die Absicht hat, sexuelle Erregung zu erzeugen. Einige spezifische Beispiele umfassen, sind jedoch nicht beschränkt auf: volle oder teilweise Nacktheit, einschließlich Nahaufnahmen (egal, ob bekleidet oder unbekleidet) von Genitalien, Gesäß oder Brüsten. Diese Körperteile sollten nicht das Prominenteste auf einem Foto oder auf einem Bildschirm sein; „Grenzen testen“ egal, ob durch Nacktheit wie zu viel Ausschnitt, zu knappe Shorts, Strings oder zu enge oder zu durchsichtige Kleidung; obszöne oder schmutzige Gesten (einschließlich Zeigen des Mittelfingers); Vorspielen einer sexuellen Handlung; und Geschlechtsverkehr oder jede andere sexuelle Handlung, die Menschen, Darstellung von Tieren mit menschlichen Zügen, Cartoons, Hentai oder Anime umfasst. 2. Grafische Gewalt Du darfst kein grafisch gewalttätiges oder übermäßig blutrünstiges Material posten oder streamen. Gewalttätiges Material ist für uns alles, was den Tod, Gewalt, chirurgische Verfahren oder schwere Verletzungen an Menschen oder Tieren grafisch darstellt. Einige spezifische Beispiele umfassen, sind jedoch nicht beschränkt auf: grausame Verbrechen oder Unfallszenen; heftige physische Auseinandersetzungen; Körperflüssigkeiten wie Blut, Fäkalien, Sperma usw.; offenliegende innere Organe oder Knochen; starke körperliche Schädigungen, einschließlich sichtbarer Wunden, gebrochener Knochen usw.; Tierfolter und -tötung; und schwerverletzte oder verstümmelte Tiere 3. Gefährliche Aktivitäten oder Produkte Du darfst kein Material posten oder streamen das gefährliche Aktivitäten oder Produkte darstellt. Einige spezifische Beispiele umfassen, sind jedoch nicht beschränkt auf: Förderung von Selbstverletzung, Suizid, Essstörungen oder andere Handlungen, bei denen schwere Verletzungen oder Tod auftreten können; gefährliche ‚Mutproben‘, Spiele, Schlachten oder Wettbewerbe; gefährliche Rausch- und Betäubungsmittel; und Streamen während des Führens eines Fahrzeugs jeglicher Art (einschließlich Fahrräder). 4. Illegale oder regulierte Waren und Dienstleistungen Du darfst kein Material posten oder streamen, das illegale oder regulierte Waren oder Dienstleistungen darstellt. Einige spezifische Beispiele umfassen, sind jedoch nicht beschränkt auf: Fälschungen und Dienstleistungen diesbezüglich; Menschenhandel; Drogen (einschließlich Marihuana) oder damit zusammenhängendes Zubehör; Finanzinstrumente oder Dienstleistungen, Glücksspiel; Produkte aus gefährdeten oder geschützten Arten; Prostitution oder sexuelle Dienstleistungen; gestohlene Waren; und Waffen, einschließlich Feuerwaffen, Munition und Sprengstoffe, und Anweisungen zur Waffenherstellung (z.B. Bomben, Pistolen aus 3D Druck, etc.) 5. Unberechtigte Verwendung Du darfst MeetMe nicht für rechtswidrige Zwecke oder zur Unterstützung illegaler Aktivitäten verwenden. Indem du MeetMe benutzt, stimmst du allen geltenden Gesetzen zu, die dein Verhalten online sowie deine Inhalte regeln. 6. Geistiges Eigentum Du darfst kein Material posten oder streamen, zu dem du nicht die Veröffentlichungsrechte hast, oder das ein Patent, eine Marke, ein Geschäftsgeheimnis, das Urheberrecht, die Privatsphäre oder andere proprietäre Rechte einer Person verletzt. 7. Unautorisierte Nutzung Du darfst die Stimme oder das Bild einer anderen Person nicht ohne deren Einverständnis posten oder streamen. Dementsprechend darfst du auch keine Aufnahmen oder Bilder einer anderen Person posten oder streamen, wenn die Aufnahmen und die Verteilung ohne deren Einverständnis geschah. 8. Private Information Du darfst keine privaten Informationen einer anderen Person ohne deren Erlaubnis posten oder streamen. Das schließt Fotos, Videos und andere personenbezogenen Daten mit ein. Du darfst ebenso wenig mit der Veröffentlichung drohen noch andere zu einer Veröffentlichung ermutigen. 9. Spam und Sicherheit Du darfst MeetMe nicht verwenden, um Spam zu verschicken. Du darfst keine Accounts automatisch registrieren oder Material, automatisch, systematisch oder programmatisch veröffentlichen. Du darfst keine Software-Viren, Malware oder anderen schädlichen Computercode, Dateien oder Programme hochladen oder übermitteln und ebenso wenig Daten sammeln, Roboter oder ähnliche Datengewinnungs- oder Extraktionsmethoden verwenden. Du darfst MeetMe nicht stören oder MeetMe unverhältnismäßig belasten (ebenso wenig wie eine andere Person, die MeetMe nutzt) oder die Netzwerke, die mit MeetMe in Verbindung stehen belasten. Du darfst weder gegen die Sicherheitsmaßnahmen verstoßen noch versuchen, die Sicherheitsmaßnahmen zu durchbrechen. 10. Werbung Du darfst keine unerbetene oder unerlaubte Werbung, Werbematerialien, Spam, Kettenbriefe, Pyramidensysteme oder eine andere Form von Kundenwerbung posten oder streamen, noch unbefugt zu Wettbewerben, Geschenkaktionen oder Lotterien/Glückspielen aufrufen. 11. Identitätstäuschung Du darfst keine Personen, Gruppen oder Organisationen in einer Weise imitieren, die beabsichtigt irrezuführen, zu verwirren oder andere zu betrügen. 12. Gewalt und physische Verletzung Du darfst keine spezifischen Androhungen von Gewalt oder den Wunsch nach schweren körperlichen Schäden, Tod oder Krankheit eines Individuums oder einer Gruppe kommunizieren. Dies beinhaltet, ist aber nicht beschränkt auf, Androhen von Terrorismus oder dessen Förderung. Du darfst Suizid oder Selbstverletzung nicht bewerben oder dazu ermutigen. 13. Minderjährige Du darfst Inhalte, die Minderjährige (unter dem Alter von 18 Jahren) zeigen, nicht posten oder streamen und ebenfalls keine Minderjährigen in deinem Stream erscheinen lassen. Das gilt ebenso, wenn es sich um deine eigenen Kinder handelt und auch, wenn du die Erlaubnis dazu hast. 14. Kindeswohlgefährdung und sexuelle Ausbeutung Du darfst kein Material posten oder streamen, das Minderjährige (Personen unter 18 Jahren) sexualisiert oder das die sexuelle Ausbeutung von Kindern fördert oder verherrlicht. Beispiele für Inhalte, die die sexuelle Ausbeutung von Kindern darstellen oder fördern, beinhalten, sind jedoch nicht beschränkt auf: Visuelle Darstellung einer minderjährigen Person in sexuell expliziten oder sexuell suggestiven Handlungen; Bebilderte, computergenerierte oder andere Darstellungen von Minderjährigen in einem sexuell expliziten Kontext, oder während einer sexuell expliziten Handlung; und Links zu Drittanbietern, die Material präsentieren, das die sexuelle Ausbeutung von Kindern zeigt. Das folgende Verhalten ist bei MeetMe ebenfalls nicht gestattet: Fantasieren über die sexuelle Ausbeutung von Kindern oder Ermutigung, Kinder sexuell auszubeuten; Äußern des Wunsches, Material zu erhalten, welches die sexuelle Ausbeutung von Kindern zum Inhalt hat; Rekrutierung, Werbung oder Bekundung von Interesse in: (1) einer kommerziellen sexuellen Handlung mit einem Kind, oder (2) ein Kind aus sexuellen Gründen zu beherbergen oder zu transportieren; Einen Minderjährigen in eine sexuell explizite Unterhaltung zu involvieren; und Mutmaßliche Opfer von sexueller Ausbeutung im Kindesalter durch Namen oder Foto zu identifizieren. 15. Missbräuchliches Verhalten Du darfst eine andere Person nicht belästigen oder andere dazu animieren, jemanden zu belästigen. Wir betrachten jeden Versuch zu schikanieren, einzuschüchtern, oder eine Stimme zum Verstummen zu bringen als missbräuchliches Verhalten. Du darfst niemanden direkt belästigen, indem du unerwünschte sexuelle Inhalte sendest, jemanden in sexuell expliziter Weise zum Objekt machst oder anderes sexuelles Fehlverhalten an den Tag legst. Du darfst keine Inhalte posten oder streamen, die andere ausbeuten (einschließlich Erpressung von Geld, Erpressung durch Drohung, etc.), andere demütigen oder schikanieren, oder Opfer von tragischen Ereignissen (oder deren Freunde oder Familien) demütigen oder schikanieren. Der Kontext spielt bei der Bewertung für missbräuchliche Verhaltensweisen und bei der Bestimmung geeigneter Durchsetzungsmaßnahmen der Richtlinie eine Rolle. Faktoren, die wir berücksichtigen, sind beispielsweise, jedoch nicht beschränkt auf: Das Verhalten ist auf eine Person oder eine Gruppe von Menschen gerichtet; und Die Meldung wurde von der Person gemacht, die Ziel des Missbrauchs war oder von einem Zeugen gemacht. 16. Hasserfülltes Verhalten und Mobbing Du darfst keine Gewalt gegen Menschen fördern, damit drohen oder andere Menschen aufgrund von Rasse, Religion, Ethnie, Herkunft, sexueller Orientierung, Geschlecht, Geschlechtsidentifikation, Alter, Behinderung, schwerer Krankheit, Veteranenstatus oder anderen charakteristischen Merkmalen im Zusammenhang mit systemischer Diskriminierung oder Marginalisierung belästigen. Du darfst keine hassschürenden Bilder oder Symbole in deinem Profilbild oder in deinem Profil haben. Du darfst deinen Benutzernamen, Anzeigename oder dein Profil nicht verwenden, um dich missbräuchlich zu verhalten, wie z.B. um gezielte Belästigungen oder Hass gegen eine Person, Gruppe oder geschützte Kategorie auszudrücken. Einige Inhalte könnten in Einzelbetrachtung als hasserfüllt angesehen werden, im Kontext der gesamten Unterhaltung aber anders zu bewerten sein. So könnten zum Beispiel Mitglieder einer geschützten Kategorie sich untereinander mit Begriffen bezeichnen, die typischerweise als abwertende Begriffe betrachtet werden. Wenn diese Bezeichnungen einvernehmlich genutzt werden, ist die Intention dahinter keine Abwertung, sondern bedeutet eine Rückeroberung der Begriffe, die historisch dazu verwendet wurden, Menschen abzuwerten. Du musst kein Mitglied einer Zielgruppe von Hass sein, damit wir Maßnahmen ergreifen. Wir bitten Menschen nicht ihre Zugehörigkeit zu einer geschützten Gruppe zu beweisen oder zu widerlegen und wir werden diese Information nicht selbst einholen. Verhaltensweisen, die wir als hasserfüllt betrachten, sind zum Beispiel aber nicht limitiert auf: a. Gewaltandrohungen Du darfst keine Gewaltandrohungen gegen ein identifizierbares Ziel aussprechen. Gewaltandrohungen sind klare Aussagen des Vorsatzes, jemandem Verletzungen zuzufügen, die zu schweren und anhaltenden körperlichen Schäden führen, an denen eine Person sterben könnte oder erheblich verletzt werden könnte, z. B. „Ich werde dich töten.“ Wir haben eine Nulltoleranz-Politik gegenüber Gewaltandrohungen. Accounts, die unserer Auffassung nach Gewaltandrohungen teilen, werden sofort und permanent gesperrt. b. Einer Person oder einer Personengruppe schweren Schaden wünschen, darauf hoffen oder dazu aufrufen Du darfst keine Inhalte posten oder streamen die Wünsche, Hoffnungen, oder Verlangen nach Tod, ernsten und anhaltenden körperlichen Schäden oder einer schweren Krankheit gegen eine Person oder Gruppen ausdrücken. Dies beinhaltet, ist jedoch nicht beschränkt auf: Hoffen, dass jemand aufgrund einer schweren Krankheit stirbt, z. B. „Ich hoffe, dass du Krebs bekommst und stirbst“; Wünschen, dass jemand Opfer eines schweren Unfalls wird, z. B. „Ich wünschte, dass du beim nächsten Mal, wenn du sowas sagst von einem Auto überfahren wirst“; und Sagen, dass eine Gruppe von Personen schwere körperliche Verletzungen verdient, z. B. „Wenn diese Gruppe von Demonstranten nicht den Mund hält, dann verdienen sie es, erschossen zu werden.“ c. Massenmord, Gewalttätigkeiten oder spezifische Arten der Gewalt Du darfst keine Inhalte posten oder streamen, die Massenmord, Gewalttätigkeiten oder spezifische Arten der Gewalt an einer Person oder einer Gruppe fördert. Dies beinhaltet, ist jedoch nicht beschränkt darauf, jemandem Folgendes zu senden: Inhalte, die die Opfer des Holocaust darstellen; und Inhalte, die Lynchmorde darstellen. d. Inhalte, die Angst vor einer Gruppe von Menschen schüren Du darfst keine Inhalte an Einzelpersonen richten, um Angst oder angsterzeugende Vorurteile gegen eine Gruppe Menschen zu schüren, inklusive der Behauptung, dass die Mitglieder einer Gruppe sich an gefährlichen oder illegalen Aktivitäten beteiligen, z.B. „alle [religiöse Gruppe] sind Terroristen.“ e. Wiederholte und/oder nicht einvernehmlich gebrauchte rassistische Begriffe, Schimpfnamen, rassistische und sexistische bildliche Ausdrücke oder anderes herabwürdigendes Material. Du darfst keine wiederholten Erniedrigungen, bildlichen Ausdrücke oder anderen Inhalte, die beabsichtigen zu entmenschlichen, herabzuwürdigen oder negative oder schädliche Vorurteile einer geschützten Gruppe gegenüber zu fördern, gezielt gegen Personen richten. Dies beinhaltet die gezielte Zuweisung des falschen Geschlechts oder die Verwendung des alten Namens einer als Transgender-Person. f. Hasserfüllte Bilder Du darfst keine Logos, Symbole oder Bilder posten oder streamen, deren Zweck darin besteht, die Feindseligkeit und Ungerechtigkeit gegen andere aufgrund von Rasse, Religion, Ethnie, Herkunft, sexueller Orientierung, Geschlecht, Alter, Behinderung, schwerer Krankheit, Veteranenstatus oder eines anderen Merkmals zu fördern und die im Zusammenhang mit systematischer Diskriminierung und Ausgrenzung stehen. Einige Beispiele für hasserfülltes Bildmaterial sind, neben anderen: Symbole, die historisch mit Hassgruppen in Zusammenhang stehen, z. B. das Nazi Hakenkreuz Bilder, die andere als weniger menschlich darstellen oder so verändert wurden, dass sie hasserfüllte Symbole beinhalten, z. B. Bilder von Individuen zu verändern, um tierische Merkmale darzustellen; und Bilder, die so verändert wurden,"
