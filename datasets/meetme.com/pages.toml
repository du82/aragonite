full_description = "Datenschutzhinweise Last Updated: December 30, 2024 Für Nutzer im EWR, in der Schweiz und im Vereinigten Königreich gelten gesonderte Datenschutzhinweise. Du kannst sie weiter unten aufrufen oder hier klicken. Inhaltsverzeichnis I. Datenschutzhinweise 1. Umfang 2. Erfasste personenbezogene Daten 3. Zwecke der Erfassung und Verarbeitung 4. Offenlegung personenbezogener Daten 5. Cookies, Targeting und Analysen 6. Deine Datenschutzoptionen 7. Externe Links und Funktionen 8. Nutzergenerierte Inhalte 9. Sicherheit 10. Schutz der Privatsphäre von Kindern 11. Änderungen an dieser Richtlinie 12. Kontakt 13. Zusätzliche Informationen zum Datenschutz für bestimmte Gerichtsbarkeiten II. Datenschutzhinweise für Nutzer mit Wohnsitz im Europäischen Wirtschaftsraum, in der Schweiz oder im Vereinigten Königreich 1. Umfang 2. Erfasste personenbezogene Daten 3. Zwecke der Erfassung und Verarbeitung 4. Offenlegung personenbezogener Daten 5. Übermittlung personenbezogener Daten in Länder außerhalb von EWR/UK/CH 6. Cookies, Targeting und Analysen 7. Deine Datenschutzoptionen 8. Aufbewahrungsfrist für personenbezogene Daten 9. Externe Links und Funktionen 10. Nutzergenerierte Inhalte 11. Sicherheit 12. Schutz der Privatsphäre von Kindern 13. Änderungen an dieser Richtlinie 14. Kontakt 15. Zusätzliche Informationen zum Datenschutz für bestimmte Gerichtsbarkeiten I. Privacy Policy The Meet Group, Inc., ihre Marken, verbundenen Unternehmen und Tochtergesellschaften („TMG“, „wir“, „unser“ oder „uns“) legen Wert auf deine Privatsphäre. Diese Datenschutzhinweise („Richtlinie“) beschreiben, wie TMG die in dieser Richtlinie beschriebenen personenbezogenen Daten sammelt, verwendet, offenlegt und anderweitig verarbeitet, sowie deine Rechte und Optionen. Weitere Informationen über die Optionen, die du in Bezug auf den Schutz deiner personenbezogenen Daten hast, findest du in Abschnitt 6. Deine Datenschutzoptionen sowie Abschnitt 13. Zusätzliche Informationen zum Datenschutz für bestimmte Gerichtsbarkeiten, die weitere Angaben über die Datenschutzrechte der Einwohner bestimmter Länder enthalten. Wenn du deinen Wohnsitz in Kalifornien hast, lies bitte Abschnitt 13.B. Zusätzliche Informationen für Einwohner von Kalifornien, um Details über die Kategorien von personenbezogenen Daten, die wir erfassen, und deine Rechte gemäß den kalifornischen Datenschutzgesetzen zu erhalten. Für Nutzer von Skout oder MeetMe: Wenn du ein Profil auf Skout oder MeetMe erstellst, können deine personenbezogene Daten für Nutzer auf beiden Plattformen sichtbar sein. Wenn du die Live-Funktion von MeetMe, Skout und Tagged nutzt, können einige deiner personenbezogenen Daten wie Nutzername, Name, Alter, Geschlecht und sexuelle Orientierung in Übereinstimmung mit deinen Datenschutzeinstellungen auch für Nutzer anderer Anwendungen, die uns gehören, und anderer Anwendungen und Websites, die uns nicht gehören und mit denen wir unsere Live-Plattform teilen, sichtbar sein. Diese anderen Nutzer sind weltweit ansässig. Eine Liste unserer aktuellen Live-Partner findest du hier für MeetMe und Skout und hier für Tagged. Du kannst diese Funktion nicht deaktivieren, wenn du dich für die Live-Nutzung entscheidest. Deine Nutzung unserer Dienste unterliegt unseren Allgemeinen Geschäftsbedingungen, einschließlich der geltenden Bestimmungen über Schadensersatzbeschränkungen und die Beilegung von Streitigkeiten. 1. Umfang Sofern nachstehend nicht anders festgelegt, gilt diese Richtlinie für die personenbezogenen Daten, die TMG in Bezug auf folgende Personen sammelt und verarbeitet: Besucher unserer Website, auf der diese Richtlinie veröffentlicht ist, einschließlich aller unserer Websites, die mit dieser Richtlinie verlinkt sind oder diese veröffentlichen (die „Seiten“); Personen, die unsere mobilen Anwendungen („Mobile Apps“) herunterladen und nutzen; Personen, die sich für unsere Veranstaltungen, Umfragen, Untersuchungen, Werbeaktionen und Gewinnspiele, die von uns durchgeführt werden, registrieren oder daran teilnehmen; derzeitige, ehemalige und potenzielle Kunden, Verkäufer und Dienstleister sowie Geschäftspartner und Personen, die mit uns oder den über unsere Seiten, Mobile Apps oder andere Online-Dienste verfügbaren Diensten kommunizieren oder anderweitig mit uns interagieren oder in Verbindung treten (zusammenfassend als die „Dienste“ bezeichnet). 2. Erhebung personenbezogener Daten Wie weiter unten beschrieben, können wir personenbezogene Daten direkt von dir, aus Drittquellen und automatisch durch deine Nutzung unserer Dienste erfassen. Direkt von dir erfasste personenbezogene Daten. Die von uns erfassten personenbezogenen Daten variieren zwar je nach deiner Nutzung unserer Dienste und unserer Interaktion mit dir, aber generell können wir die folgenden Kategorien von personenbezogenen Daten direkt von dir erfassen: Kontaktdaten. Wenn du mit uns in Kontakt trittst, beispielsweise, wenn du uns eine Nachricht sendest oder dich anmeldest, um mehr über unsere Dienste zu erfahren, können wir deinen Namen, deine E-Mail-Adresse, deine Telefonnummer oder andere ähnliche Identifizierungsmerkmale sowie deine Nachricht, die Art deiner Anfrage und alle anderen von dir angegebenen Informationen erfassen. Konto- und Profilinformationen. Wenn du dich für ein Konto in Verbindung mit unseren Diensten anmeldest, können wir deinen Namen, deine E-Mail-Adresse, deine Telefonnummer, deine Adresse (z. B. Postleitzahl), deinen Nutzernamen und dein Passwort, dein Geburtsdatum, deine ethnische Zugehörigkeit und dein Geschlecht, dein Profilbild und -foto und deine Rechnungsadresse sowie alle anderen Informationen erfassen, die du uns in Verbindung mit der Erstellung oder Verwaltung deines Kontos zur Verfügung stellst oder die du uns anderweitig über dein Konto übermittelst. Käufe, Zahlungen und Rückerstattungen. Wenn du einen Kauf oder eine Zahlung über unsere Dienste tätigst, können wir Informationen wie Zahlungsart, Zahlungskartendetails, Rechnungs- und Lieferadresse, Kaufinformationen und andere finanzielle oder handelsbezogene Informationen erfassen, die für die Erbringung unserer Dienste erforderlich sind. Kommunikation und Interaktion. Wenn du uns eine E-Mail schreibst, anrufst oder anderweitig mit uns oder anderen TMG-Nutzern kommunizierst oder interagierst, z. B. wenn du dich in unsere Mailinglisten einträgst, Formulare auf unseren Websites oder mobilen Apps ausfüllst, mit unseren Social-Media-Seiten interagierst, eine Bewertung oder ein Feedback abgibst, Inhalte in Online-Diskussionsgruppen einreichst oder anderweitig Informationen in öffentlich zugängliche Kommentarfelder, Blogs oder Community-Foren eingibst, die von TMG betrieben werden oder mit TMG verbunden sind, können wir deine Kontaktdaten, Kommunikationen und Interaktionen, deine Beiträge oder Einsendungen sowie gegebenenfalls unsere Antworten erfassen, empfangen und aufbewahren. Informationen zu Werbezwecken. Wenn du dich damit einverstanden erklärst, Marketingmitteilungen von uns zu erhalten, können wir deinen Namen, deine E-Mail-Adresse, deine Telefonnummer, deine Präferenzen und gegebenenfalls Informationen über dein Konto und Profil, einschließlich der von dir genutzten Dienste und Funktionen, erfassen. Wenn du an besonderen von uns angebotenen Aktivitäten, Angeboten, Programmen oder Werbeaktionen teilnimmst, erfassen wir möglicherweise auch bestimmte Kontaktdaten, dein Alter und andere gesetzlich vorgeschriebene Informationen. Wenn du bei einer Werbeaktion gewinnst, müssen wir je nach Gewinn möglicherweise auch bestimmte Steuerinformationen und/oder Verzichtserklärungen und Freigaben einholen. Antworten und Feedback. Wenn du dich an Umfragen, Fragebogen oder Studien oder Initiativen beteiligst, die von uns durchgeführt werden, z. B. zu Zwecken der Nutzerzufriedenheit oder zu ähnlichen Zwecken, können wir deine Antworten und dein Feedback sowie alle anderen von dir bereitgestellten Informationen erfassen. Details zu Veranstaltungen und Anmeldung. Wir können auch personenbezogene Daten im Zusammenhang mit deiner Teilnahme an unseren Veranstaltungen sowie andere Anfragen, die du uns im Zusammenhang mit unseren Dienstleistungen übermittelst, erfassen. Wenn du dich beispielsweise für eine von uns veranstaltete oder gesponserte Veranstaltung anmeldest oder daran teilnimmst, können wir Informationen im Zusammenhang mit deiner Anmeldung und Teilnahme an einer solchen Veranstaltung erfassen. Präferenzen und sonstige Wünsche. Wir können auch Informationen über deine Präferenzen sammeln, einschließlich Kommunikationspräferenzen, Präferenzen in Bezug auf deine Nutzung unserer Dienste und andere Präferenzen oder Anfragen, die du bei der Interaktion mit uns mitteilst. Informationen zur Geschäftsentwicklung. Um potenzielle Geschäftsmöglichkeiten zu bewerten und zu erschließen, können wir personenbezogene Daten über aktuelle, ehemalige und potenzielle Kunden, Lieferanten und Dienstleister, Geschäftspartner, einschließlich Kontaktinformationen und andere ähnliche Identifikatoren, Unternehmens- und Berufsinformationen sowie Kommunikationsaufzeichnungen erfassen und erhalten. Biometrische Daten, die mit deinem Einverständnis für bestimmte Zwecke gesammelt werden. Wir sammeln im Allgemeinen keine biometrischen Daten von Nutzern. Unter bestimmten Umständen werden wir dich jedoch möglicherweise um deine Zustimmung zur Verarbeitung biometrischer Daten und Identifikatoren bitten, um betrügerische Konten (einschließlich Bots) und anderen Missbrauch unserer Dienste zu bekämpfen, das Alter zu schätzen und zu verifizieren sowie Profile zu überprüfen. Weitere Einzelheiten findest du hier in unseren gesonderten Hinweisen zu biometrischen Daten. Von Drittanbietern erfasste personenbezogene Daten. Wir können auch bestimmte personenbezogene Daten über dich aus Drittquellen sammeln und erhalten, z. B. von Geschäftspartnern, Kunden und anderen TMG-Nutzern, Datenanalyse- und Marketinganbietern, Betriebssystemen und Social-Media-Plattformen, öffentlichen Datenbanken sowie von Anbietern und Dienstleistern, die in unserem Auftrag Dienstleistungen erbringen oder Funktionen ausführen. So können wir beispielsweise deinen Namen, deine Kontaktdaten und andere ähnliche Informationen von Geschäftspartnern, Anbietern und Dienstleistern zum Zwecke der Bereitstellung unserer Dienste erfassen. Darüber hinaus können wir die folgenden Informationen aus Drittquellen sammeln: Informationen zur Registrierung für soziale Medien und Plattformen. Bei der Nutzung unserer Dienste kannst du wählen, ob du Informationen oder Inhalte weitergibst, dich bei den Diensten anmeldest oder du dich über verschiedene Social-Media-Plattformen, Social-Networking-Dienste oder andere Funktionen oder integrierte Dienste von Drittanbietern anmelden möchtest. Wenn du dich über deine Social-Media-Konten oder andere ähnliche integrierte Dienste und Funktionen mit unseren Diensten verbindest, können wir personenbezogene Daten über dich erfassen oder erhalten, die du diesem Social-Media-Konto, -Dienst oder dieser -Funktion zur Verfügung gestellt hast. So können wir beispielsweise Daten aus deinem Konto und Profil erfassen, wie z. B. deinen Namen, deine E-Mail-Adresse, deine Nutzer-ID, dein Profilbild, deine Freundesliste und andere ähnliche Informationen, die in deinem Profil verfügbar sind. Du solltest deine Datenschutzeinstellungen auf jeder sozialen Medienplattform, jeder Funktion oder jedem integrierten Dienst überprüfen, um genau zu verstehen, wie deine personenbezogenen Daten von diesen Parteien verwendet, offengelegt oder anderweitig verarbeitet werden können. Empfehlungsinformationen. Eventuell bieten wir dir die Möglichkeit, Freunde einzuladen oder andere Nutzer für den Zugang zu unseren Diensten oder deren Nutzung zu werben. Dabei können wir bestimmte personenbezogene Daten über dich sammeln und erhalten, auch von anderen derzeitigen oder künftigen TMG-Nutzern und -Kunden, die sich in ähnlicher Weise an diesen Aktivitäten beteiligen. Informationen zu Leads und potenziellen Kunden. Wir erhalten möglicherweise von Dritten Informationen über potenzielle Kunden, die an unseren Dienstleistungen interessiert sind. Wir können auch mit Dritten zusammenarbeiten, um unsere Kundeninformationen zu erweitern oder zu aktualisieren. So können wir beispielsweise bestimmte personenbezogene Daten von Datenanalyse- und Marketinganbietern erhalten, um neue Kunden zu gewinnen, oder von Geschäftspartnern, Anbietern und Dienstleistern, um unsere Dienste bereitzustellen. Automatisch erfasste personenbezogene Daten. Wir und unsere Drittanbieter können automatisch personenbezogene Daten über dich im Zusammenhang mit deiner Nutzung unserer Dienste erfassen oder ableiten, auch durch die Verwendung von Cookies, Pixel-Tags und anderen ähnlichen Technologien. Zu den personenbezogenen Daten, die wir automatisch erfassen können, gehören: Geräte- und Browsing-Informationen. Wenn du unsere Dienste nutzt, können wir Browsertyp, Domainname, Seitenaufrufe, Zugriffszeiten, Datums-/Zeitstempel, Betriebssystem, Sprache, Gerätetyp, eindeutige ID, Internetdienstanbieter, weiterleitende und ausgehende URLs, Clickstream-Daten, Betriebssystem, Sprache und ähnliche Geräte- und Browsinginformationen erfassen. Aktivitäten und Nutzung. Wir können auch Aktivitätsinformationen im Zusammenhang mit deiner Nutzung der Dienste erfassen, wie z. B. Informationen über angeklickte Links, Suchvorgänge, verwendete Funktionen, angezeigte Elemente, die im Rahmen der Dienste verbrachte Zeit, deine Interaktionen mit uns und anderen innerhalb der Dienste sowie andere ähnliche Aktivitäts- und Nutzungsinformationen. Standortinformationen. Wir können auch allgemeine Standortinformationen über dich sammeln oder ableiten, z. B. über deine IP-Adresse. Weitere Informationen über unsere Verwendung von Cookies und anderen ähnlichen Technologien findest du unten in Abschnitt 5. Cookies, Targeting und Analysen. 3. Zwecke der Erfassung und Verarbeitung Im Allgemeinen können wir die von uns