title = "Gizlilik Politikası - MeetMe"
description = "Güvenli bir kullanıcı deneyimi sağlarken kişisel bilgilerinizi nasıl topladığımızı, kullandığımızı ve koruduğumuzu anlamak için MeetMe Gizlilik Politikasını inceleyin."
full_description = "Gizlilik Politikası Last Updated: December 30, 2024 AEA, İsviçre ve Birleşik Krallık’taki kullanıcılar için ayrı bir Gizlilik Politikası geçerlidir.Aşağıda daha fazla bilgiye erişebilir veya buraya tıklayabilirsiniz. İçindekiler I. Gizlilik Politikası 1. Kapsam 2. Toplanan Kişisel Bilgiler 3. Toplama ve İşleme Amaçları 4. Kişisel Bilgi Açıklamaları 5. Çerezler, Hedefleme ve Analizler 6. Gizlilik Seçimleriniz 7. Harici Bağlantılar ve Özellikler 8. Kullanıcı Tarafından Üretilen İçerik 9. Güvenlik 10. Çocukların Mahremiyeti 11. Bu politikadaki değişiklikler 12. Bizimle İletişim Kurun 13. Belirli Yargı Bölgeleri için Ek Gizlilik Bilgileri II. Avrupa Ekonomik Alanı, İsviçre veya Birleşik Krallık’ta İkamet Eden Kullanıcılar için Gizlilik Politikası 1. Kapsam 2. Toplanan Kişisel Bilgiler 3. Toplama ve İşleme Amaçları 4. Kişisel Bilgi Açıklamaları 5. Avrupa Ekonomik Alanı, Birleşik Krallık veya İsviçre dışında bulunan ülkeler bağlamında kişisel verilerin aktarılması 6. Çerezler, Hedefleme ve Analizler 7. Gizlilik Seçimleriniz 8. Kişisel Bilgileri Saklama Süresi 9. Harici Bağlantılar ve Özellikler 10. Kullanıcı Tarafından Üretilen İçerik 11. Güvenlik 12. Çocukların Mahremiyeti 13. Bu politikadaki değişiklikler 14. Bizimle İletişim Kurun 15. Belirli Yargı Bölgeleri için Ek Gizlilik Bilgileri I. Privacy Policy Meet Group, Inc., markaları, bağlı kuruluşları ve iştirakleri (“TMG” veya “biz“) gizliliğinize değer verir. Bu Gizlilik Politikası (“Politika“), TMG’nin bu Politikada açıklanan kişisel bilgileri nasıl topladığını, kullandığını, ifşa ettiğini ve başka şekillerde işlediğini, ayrıca bu tür kişisel bilgilerle ilgili sahip olduğunuz hakları ve seçenekleri açıklar. Kişisel bilgilerinizle ilgili gizlilik tercihlerinize dair ek bilgi için lütfen Bölüm 6. Gizlilik Tercihleriniz ve Bölüm 13. Belirli Yargı Yetki Bölgeleri için Ek Gizlilik Bilgileri başlıklarını inceleyin. Bu bölümler, belirli yargı yetki bölgelerinde yaşayanlar için gizlilik hakları hakkında ek bilgiler içermektedir. Kaliforniya sakiniyseniz topladığımız kişisel bilgi kategorileri ve Kaliforniya gizlilik yasaları kapsamındaki haklarınız hakkında bilgi almak için Bölüm 13.B. Kaliforniya Sakinleri için Ek Bilgiler başlıklarına bakın. Skout veya MeetMe kullanıcıları için: Skout veya MeetMe’de bir profil oluşturduğunuzda, kişisel bilgileriniz iki platformdaki kullanıcılar tarafından da görülebilir. Benzer şekilde, MeetMe, Skout ve Tagged’de bulunan canlı özelliğini kullandığınızda, gizlilik ayarlarınıza uygun olarak kullanıcı adı, ad, yaş, cinsiyet ve cinsel yönelim gibi bazı kişisel bilgileriniz, sahip olduğumuz diğer uygulamaların kullanıcıları ve canlı platformumuzu paylaştığımız bize ait olmayan diğer uygulamalar ve internet siteleri tarafından da görülebilir. Bu diğer kullanıcılar dünya genelinde bulunmaktadır. Mevcut canlı ortaklarımızın bir listesi için MeetMe ve Skout için buraya, Tagged içinse buraya tıklayın. Canlı özelliğini kullanmayı seçerseniz bu özellikten çıkma seçeneğiniz olmayabilir. Hizmetlerimizi kullanmanız, zarar sınırlamaları ve ihtilafların çözümüyle ilgili geçerli hükümler de dahil olmak üzere Hüküm ve Koşullarımıza tabidir. 1.Kapsam Aşağıda aksi belirtilmedikçe bu Politika, TMG’nin şu kişilerle ilgili topladığı ve işlediği kişisel bilgiler için geçerlidir: bu Politikaya bağlantı veren veya yayımlayan diğer internet sitelerimiz de dahil olmak üzere (“Siteler”) bu Politikanın yayımlandığı internet sitemizin ziyaretçileri; mobil uygulamalarımızı (“Mobil Uygulamalar”) indiren ve kullanan bireyler; düzenlediğimiz etkinliklere, anketlere, araştırmalara, promosyonlara ve çekilişlere kaydolan veya katılan bireyler; mevcut, eski ve potansiyel müşteriler, tedarikçiler, hizmet sağlayıcılar ve iş ortakları ve Sitelerimiz, Mobil Uygulamalarımız veya diğer çevrim içi hizmetlerimiz (toplu olarak “Hizmetler” olarak adlandırılacaktır) aracılığıyla bizimle iletişim kuran veya etkileşime giren bireyler. 2.Toplanan Kişisel Bilgiler Aşağıda daha ayrıntılı olarak açıklandığı gibi, kişisel bilgileri doğrudan sizden, üçüncü taraf kaynaklardan ve Hizmetlerimizi kullanmanız yoluyla otomatik olarak toplayabiliriz. Doğrudan Sizden Toplanan Kişisel Bilgiler. Topladığımız kişisel bilgiler, Hizmetlerimizi kullanımınıza ve sizinle etkileşimlerimize bağlı olarak değişmekle birlikte, genel olarak, aşağıdaki kişisel bilgi kategorilerini doğrudan sizden toplayabiliriz: İletişim Bilgileri.Bize bir mesaj göndermeniz veya Hizmetlerimiz hakkında daha fazla bilgi edinmek için kaydolmanız da dahil olmak üzere bizimle iletişime geçtiğinizde, adınızı, e-posta adresinizi, telefon numaranızı veya diğer benzer tanımlayıcılarınızı, mesajınızı, sorgunuzun niteliğini ve vermeyi seçtiğiniz diğer bilgileri toplayabiliriz. Hesap ve Profil Bilgileri. Hizmetlerimizle bağlantılı olarak bir hesaba kaydolduğunuzda, adınızı, e-posta adresinizi, telefon numaranızı, adresinizi (örneğin posta kodu), kullanıcı adınızı ve şifrenizi, doğum tarihinizi, etnik kökeninizi ve cinsiyetinizi, profil resminizi ve fotoğrafınızı ve fatura adresi bilgilerinizi ve ayrıca hesabınızın oluşturulması veya sürdürülmesi ile bağlantılı olarak sağlanan veya hesabınız aracılığıyla bize başka bir şekilde gönderdiğiniz diğer bilgileri toplayabiliriz. Satın Almalar, Ödemeler ve Ödüller. Hizmetlerimiz aracılığıyla bir satın alma veya ödeme yaptığınızda, ödeme türü, ödeme kartı bilgileri, faturalandırma, gönderim adresi, satın alma bilgileri ve Hizmetlerimizi kolaylaştırmak için gerekli olan diğer finansal veya ticari bilgiler gibi bilgileri toplayabiliriz. İletişimler ve Etkileşimler. E-posta listelerimize kaydolmanız, Sitelerimiz veya Mobil Uygulamalarımızdaki formları doldurmanız, sosyal medya sayfalarımızla etkileşimde bulunmanız, bir inceleme veya referans göndermeniz, herhangi bir çevrim içi tartışma grubuna içerik göndermeniz veya TMG tarafından desteklenen veya TMG ile bağlantılı herkese açık yorum alanlarına, bloglara veya topluluk forumlarına başka bir şekilde bilgi girmeniz de dahil olmak üzere, bize veya diğer TMG kullanıcılarına e-posta gönderdiğinizde, bizi aradığınızda veya başka bir şekilde iletişim kurduğunuzda veya etkileşimde bulunduğunuzda, iletişim bilgilerinizin, iletişimlerinizin ve etkileşimlerinizin, gönderilerinizin veya gönderimlerinizin ve varsa yanıtlarımızın kayıtlarını toplayabilir, alabilir ve saklayabiliriz. Promosyon Bilgileri. Bizden pazarlama iletişimi almayı kabul ederseniz adınızı, e-posta adresinizi, telefon numaranızı, tercihlerinizi ve uygunsa kullandığınız Hizmetler ve özellikler de dahil olmak üzere hesabınız ve profilinizle ilgili bilgileri toplayabiliriz. Sunduğumuz özel etkinliklere, tekliflere, programlara veya promosyonlara katılırsanız belirli iletişim bilgilerini, yaşınızı ve yasaların gerektirebileceği diğer bilgileri de toplayabiliriz. Bir promosyon kazanırsanız ödüle bağlı olarak belirli vergi bilgilerini ve/veya feragat ve ibranameleri de toplamamız gerekebilir. Yanıtlar ve Geri Bildirim. Anketlere, soru listelerine veya kullanıcı memnuniyeti ya da benzer amaçlar için yürüttüğümüz araştırma faaliyetlerine veya girişimlerine katılırsanız yanıtlarınızı, geri bildirimlerinizi ve sağlamayı tercih ettiğiniz diğer bilgileri toplayabiliriz. Etkinlikler ve Kayıt Ayrıntıları. Hizmetlerimizle ilgili etkinliklerimize katılımınıza ilişkin kişisel bilgilerinizi ve bize ilettiğiniz diğer taleplerle ilgili bilgileri de toplayabiliriz. Örneğin, ev sahipliği yaptığımız veya sponsor olduğumuz bir etkinliğe kaydolur veya katılırsanız, bu etkinliğe kaydınız ve katılımınızla ilgili bilgileri toplayabiliriz. Tercihler ve Diğer Talepler. Ayrıca, iletişim tercihleri, Hizmetlerimizi kullanımınızla ilgili tercihler ve bizimle etkileşim kurarken sağladığınız diğer tercihler veya talepler de dahil olmak üzere tercihleriniz hakkında bilgi de toplayabiliriz. İş Geliştirme Bilgileri. Potansiyel iş fırsatlarını değerlendirmek ve takip etmek amacıyla, mevcut, önceki ve potansiyel müşteriler, satıcılar ve hizmet sağlayıcılar, iş ortakları hakkında kişisel bilgiler toplayabilir ve alabiliriz. Bu bilgiler iletişim bilgileri ve benzer tanımlayıcılar, şirket ve mesleki bilgiler ile iletişim kayıtlarını içerebilir. Sınırlı Amaçlarla Rızanızla Toplanan Biyometrik Bilgiler. Kullanıcılardan genellikle biyometrik bilgi toplamıyoruz. Ancak, belirli durumlarda, sahte hesaplarla (botlar dahil) ve hizmetlerimizin diğer kötüye kullanım şekilleriyle mücadele etmek, yaş tahmini ve doğrulama ile profil doğrulama amaçları için biyometrik bilgilerinizin ve tanımlayıcılarınızın işlenmesine onay vermenizi isteyebiliriz. Daha fazla ayrıntı, burada erişilebilen Biyometrik Verilere Özel Bildirimimizde belirtilmiştir. Üçüncü Taraflardan Toplanan Kişisel Bilgiler.Üçüncü taraf kaynaklardan, örneğin iş ortakları, müşteriler ve diğer TMG kullanıcıları, veri analizleri ve pazarlama sağlayıcıları, işletim sistemleri ve sosyal medya platformları, kamu veri tabanları ile bizim adımıza hizmet sunan veya işlevler gerçekleştiren satıcılar ve hizmet sağlayıcılarından sizinle ilgili bazı kişisel bilgileri toplayabilir ve alabiliriz. Örneğin, yeni müşterilere ulaşmak amacıyla veri analitiği ve pazarlama sağlayıcılarından ya da hizmetlerimizi sunmak amacıyla iş ortakları, satıcılar ve hizmet sağlayıcılardan belirli kişisel bilgiler alabiliriz. Ayrıca, üçüncü taraf kaynaklardan aşağıdaki bilgileri de toplayabiliriz: Sosyal Medya ve Platform Kayıt Bilgileri. Hizmetlerimizi kullanırken, çeşitli sosyal medya platformları, sosyal ağ hizmetleri veya diğer üçüncü taraf özellikleri ya da entegre hizmetler aracılığıyla bilgi veya içerik paylaşmayı, Hizmetlere giriş yapmayı veya oturum açmayı tercih edebilirsiniz. Sosyal medya hesaplarınızı veya diğer benzer entegre hizmetleri ve özellikleri kullanarak Hizmetlerimize bağlandığınızda, bu sosyal medya hesabına, hizmetine veya özelliğine sağladığınız kişisel bilgileri toplayabilir veya alabiliriz. Örneğin, adınız, e-posta adresiniz, kullanıcı kimliğiniz, profil resminiz, arkadaş listeniz ve profilinizde bulunan diğer benzer bilgiler gibi bilgileri hesabınızdan ve profilinizden toplayabiliriz. Kişisel bilgilerinizin bu taraflarca nasıl kullanılabileceğini, ifşa edilebileceğini veya başka bir şekilde işlenebileceğini daha iyi anlamak için her sosyal medya platformunda, özelliğinde veya entegre hizmetinde gizlilik ayarlarınızı kontrol etmelisiniz. Yönlendirme Bilgileri. Size arkadaşlarınızı davet etme veya diğer kullanıcıları Hizmetlerimize erişmeleri veya Hizmetlerimizi kullanmaları için yönlendirme olanağı sunabiliriz. Bunu yaparken, diğer mevcut veya potansiyel TMG kullanıcıları ve bu faaliyetlerde benzer şekilde yer alan müşteriler de dahil olmak üzere sizinle ilgili belirli kişisel bilgileri toplayabilir ve alabiliriz. Potansiyel Müşteri ve Muhtemel Müşteri Bilgileri. Hizmetlerimizle ilgilenebilecek potansiyel müşteriler hakkında üçüncü taraflardan müşteri adayı ve potansiyel müşteri bilgileri alabiliriz. Ayrıca müşteri bilgilerimizi geliştirmek veya güncellemek için üçüncü taraflarla iletişim de kurabiliriz. Örneğin, yeni müşterilere ulaşmak amacıyla veri analizleri ve pazarlama sağlayıcılarından ya da Hizmetlerimizi sunmak amacıyla iş ortakları, satıcılar ve hizmet sağlayıcılardan belirli kişisel bilgiler alabiliriz. Otomatik Olarak Toplanan Kişisel Bilgiler. Biz ve üçüncü taraf hizmet sağlayıcılarımız, çerezlerin, piksel etiketlerinin ve diğer benzer teknolojilerin kullanımı da dahil olmak üzere, Hizmetlerimizi kullanımınızla ilgili kişisel bilgileri otomatik olarak toplayabilir veya türetebiliriz. Otomatik olarak toplayabileceğimiz kişisel bilgiler şunları içerir: Cihaz ve Tarama Bilgileri. Hizmetlerimizi kullandığınızda, tarayıcı türü, alan adı, sayfa görünümleri, erişim saatleri, tarih/saat damgaları, işletim sistemi, dil, cihaz türü, benzersiz kimlik, İnternet servis sağlayıcısı, yönlendiren ve çıkan URL’ler, tıklama akışı verileri, işletim sistemi, dil ve benzeri cihaz ve tarama bilgilerini toplayabiliriz. Faaliyetler ve Kullanım. Ayrıca, tıklanan bağlantılar, aramalar, kullanılan özellikler, görüntülenen ögeler, Hizmetlerde geçirilen süre, bizimle ve Hizmetlerdeki diğer kişilerle etkileşimleriniz ve diğer benzer faaliyet ve kullanım bilgileri gibi Hizmetleri kullanımınızla ilgili faaliyet bilgilerini de toplayabiliriz. Konum Bilgileri. Sizin hakkınızda IP adresiniz gibi genel konum bilgilerini de toplayabilir veya türetebiliriz. Çerezleri ve benzer teknolojileri kullanımımız hakkında daha fazla bilgi için aşağıdaki Çerezler, Hedefleme ve Analitik başlıklı 5. bölüme bakın. 3. Toplama ve İşleme Amaçları Genel olarak, topladığımız kişisel bilgilerin kategorilerini aşağıdaki amaçlarla toplayabilir, kullanabilir, ifşa edebilir ve diğer şekillerde işleyebiliriz: Hizmetler ve Destek.Hizmetlerimizi sunmak ve işletmek, hesabınızı yönetmek, Hizmetleri kullanımınız hakkında sizinle iletişim kurmak, sorun giderme, teknik destek veya benzer destek amaçları sağlamak, sorularınıza yanıt vermek, taleplerinizi karşılamak, ödeme işlemlerini kolaylaştırmak ve günlük operasyonlarımızı yürütmek için. Analizler ve İyileştirme. Kullanıcıların Hizmetlere nasıl eriştiğini ve bunları nasıl kullandığını daha iyi anlamak ve Hizmetlerimizi ve özelliklerini geliştirmek de dahil olmak üzere Siteyi, Hizmetlerimizi ve ticari operasyonları değerlendirmek ve iyileştirmek gibi diğer araştırma ve analitik amaçlar ve dahili kalite kontrol ve eğitim amaçları için. İletişim.Sorularınıza yanıt vermek, talep ettiğiniz materyalleri ve bültenleri göndermek, ayrıca hizmetlerimiz ve sunduklarımız hakkında bilgi ve materyaller sağlamak için. Bu bilgileri, hizmetler ve şartlarımızda, koşullarımızda ve politikalarımızda yapılan değişiklikler gibi idari bilgileri size göndermek için de kullanabiliriz. Özelleştirme ve Kişiselleştirme. Konum özelleştirmesi sunmak ve deneyimlerinizi ve tekliflerinizi başka bir şekilde kişiselleştirmek de dahil olmak üzere Hizmetler üzerinde gönderebileceğimiz veya görüntüleyebileceğimiz içeriği uyarlamak için. Pazarlama ve Reklam Yapma.Pazarlama, reklam yapma ve promosyon amacıyla. Örneğin, hizmetlerimizle ilgili tanıtım bilgileri, TMG etkinlikleri, web seminerleri, sunumlar, satışlar, fırsatlar, indirimler ve yeni tekliflerle ilgili bilgiler ile almak için kaydolduğunuz diğer bilgileri size göndermek için. Araştırma ve Anketler. Pazar araştırması, kullanıcı memnuniyeti veya diğer benzer amaçlar için anketler ve soru listeleri uygulamak. İç Görü Geliştirme ve Veri İyileştirme. Hizmetler aracılığıyla toplanan kişisel bilgileri, bizim veya üçüncü tarafların başka bağlamlarda sizin hakkınızda topladığı diğer bilgilerle birleştirebiliriz. Çoğu durumda, demografik bilgiler gibi pazar araştırmaları için Hizmetler aracılığıyla toplanan kişisel bilgilerle birleştirebileceğimiz bilgiler, tüketicileri doğrudan tanımlamaz. Etkinliklerin Planlanması ve Yönetilmesi. Etkinlik planlaması ve yönetimle ilgili diğer amaçlar için, örneğin etkinlik kaydı ve katılımı, sizi diğer etkinlik katılımcıları ve TMG kullanıcılarıyla bağlantılandı"
