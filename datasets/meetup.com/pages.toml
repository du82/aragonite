title = "San Francisco Movie Club | Meetup"
description = """
Greetings, SF Bay Area Movie Lovers! We are a movie loving meetup group hosting in-person movie watching and discussion events in San Francisco. Typical events involve watching a movie at a theater followed by discussion at a nearby bar, cafe, or restaurant.
My goal is to foster a community of movie lovers that regularly meets to watch and discuss movies of all kinds. I hope that some of the active members will eventually step up and host events so that more people can participate.
Let me know if you have any suggestions/feedback!
We also have a Discord community where you can chat with other local movie lovers about other movies you've been watching: https://discord.gg/aXYUY8etq9
-Kees"""
