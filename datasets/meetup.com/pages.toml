["https://www.meetup.com/new-to-nashville-music-industry-networking/events/306141611"]
title = "Women's Music Industry Support Group, Mon, Mar 10, 2025, 7:00 PM   | Meetup"
description = """
### **Women's Music Industry Support Group**

We're inviting women from all corners of the music industry - business, creative, touring, and PR - for a monthly support grou"""
full_description = '''Women's Music Industry Support GroupHosted ByJuliana L.Details### Women's Music Industry Support Group We're inviting women from all corners of the music industry - business, creative, touring, and PR - for a monthly support group. This is a safe and confidential space where you can share the highs and lows of your journey, be yourself, and connect with others who could become part of your support system. Each month, we’ll focus on a different topic, from jealousy to burnout to motherhood. This month, we'll look at "Breaking Barriers in Music: Facing Inequality and Taking Action." With International Women’s Day on March 8th, this is the perfect time to reflect on where we stand and what still needs to change. The theme for IWD 2025 is #AccelerateAction, a reminder that at the current pace, gender equality in the world won’t be achieved until 2158. In the music industry, many of us still encounter pay gaps, limited leadership opportunities, and systemic biases that hold women back. Have you ever felt overlooked for opportunities? Struggled to be taken seriously in a male-dominated space? Wondered how to push for fair pay without risking relationships? Whether you’ve faced these challenges firsthand or want to be part of the solution, you’re not alone. We’re creating space to share experiences, discuss the barriers that still exist, and explore the actions - big and small - we can take to accelerate change. Whether you choose to share or simply listen, rest assured that every participant signs a confidentiality agreement, ensuring that what’s said in the room stays in the room. Free tea and coffee will be available, or BYOB, so you can settle in and make yourself at home. The discussion will be moderated by Femke, an award-winning songwriter, producer, and record label owner. Femke also serves on the boards of the Helping Music Foundation and the Recording Academy and is a passionate advocate for women and mothers in music. Join us for a cozy evening of sharing and support as we navigate these challenges together. Let’s keep the momentum of International Women’s Day going and take action to create real change in our industry. For location and parking information, please visit [homeformusic.org/location](http://%20homeformusic.org/location).Events in Nashville, TNLocals & New in TownMusiciansMusic IndustryWomen's EmpowermentWomen's SupportNew to Nashville Music Industry NetworkingSee more eventsNew to Nashville Music Industry Networkingpublic groupMonday, March 10, 20257:00 PM to 9:00 PM CDTHOME - Helping Our Music Evolve615 Main St g1 · Nashville, TNNew to Nashville Music Industry Networkingpublic groupWomen's Music Industry Support GroupFREEAttend'''
