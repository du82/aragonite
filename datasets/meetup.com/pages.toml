title = "Urban Diversion Bay Area Social Adventure Club | Meetup"
description = '''
## Who Are We
We are an active social club where members have a variety of activities, events, and trips to choose from.
The Urban Diversion team consists of staff and hosts dedicated to creating a community where people can come together in a fun, adventurous, and respectful environment of like-minded people. The UD team doesn't just organize and plan events - we participate and have fun right alongside you, so it always feels like a group of friends and friends of friends!
We welcome members of all ages and have members aged 20-50+ though the majority of our members are young professionals.
## Our Mission
"To inspire lifelong connections and community through unforgettable experiences and adventures."
## Why a Membership?
We operate on a membership model to cultivate a close-knit community of friends, ensuring you'll consistently see familiar faces at every event. Prior to forming UD, we attended several meetups but found many to be fairly transient. This led us to meet many people but not form deep friendships. Urban Diversion was formed with the intent to building lasting relationships. Many of our members have been attending events for years.
Membership involves a monthly fee that sustains our vibrant community and facilitates the formation of genuine, enduring friendships.
To become part of our community on MeetUp, please start by becoming a member at http://www.urbandiversion.com.
## Our Events
From waterfall hikes to sushi & sake classes; bungee jumping or a wild NYE party; backpacking Tahoe to wine tasting or even International travel... Urban Diversion has something for everyone.'''
