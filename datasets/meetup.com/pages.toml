["https://meetup.com/nashville-spanish-english-conversation-group"]
title = "Nashville Spanish-English Conversation Group | Meetup"
description = '''
Welcome to the Nashville Spanish-English Conversation Group!!
Our group is made up of individuals of all ages, backgrounds, and Spanish & English language levels.
We meet on Thursdays for a language exchange. During these meetings, we speak Spanish for the first hour and English for the second. People of all Spanish/English levels are welcome.
The only requirements are: 1) a desire to learn/practice English/Spanish, 2) a willingness to help others learn/practice English/Spanish, and 3) a respectful attitude. We are all learning here and we will make mistakes!
Our goal is to create a safe space to practice speaking English/Spanish in a low stress environment so that we can feel more comfortable speaking English/Spanish out in the world.
Through learning about each other's languages, countries, and cultures many of us have become great friends.
We enjoy spending time with each other so we sometimes have more activity focused meetups (normally on the weekends) outside of our Thursday language exchanges. These activities are scheduled at random - according to group member interests and organizer availability. Please feel free to suggest an activity focused meetup to any of the organizers.
During our weekend meetups there will not be an "official" 'Spanish Hour' or 'English Hour', however, the unofficial language of all of our meetings is Spanglish so it is possible to practice English/Spanish at any of our events.
We ask that you RSVP responsibly, show up on time(ISH), and have a profile picture that clearly shows your face in order to make finding each other easier.
This group is growing rapidly.
So, it is possible that unfortunate events between group members could possibly occur. Please report any unwelcome or aggressive comments or actions to one of the organizers immediately. It is our intention to create an environment where everyone feels safe - all the time.
Welcome to the group. We hope to meet you soon!!
Join our group/invite friends on
FACEBOOK: @NashvilleSpanishEnglishConversationClub \
https://www.facebook.com/NashvilleSpanishEnglishConversationClub/
INSTAGRAM:
@nashvillespanishenglish'''
