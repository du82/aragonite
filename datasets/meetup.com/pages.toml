title = "CAYR Connections: Neurodiversity Book Club (Hybrid), Sun, Mar 2, 2025, 1:00 PM   | Meetup"
description = "**This event is held by CAYR Connections, a sponsor of the Chicago Neurodiverse Social Club. Check them out, and RSVP at: https://www.cayrconnections.org/events/neurodivers"
full_description = '''CAYR Connections: Neurodiversity Book Club (Hybrid)Hosted ByAudrey K. and EricaDetailsThis event is held by CAYR Connections, a sponsor of the Chicago Neurodiverse Social Club. Check them out, and RSVP at: https://www.cayrconnections.org/events/neurodiversity-book-club-1 This is a HYBRID event -- the in-person meeting will take place at the Oak Park Public Library. We will also have a virtual option using Zoom. Join the online discussion group before the event for excerpts, questions, and comments about the book! You should be automatically invited to join the online forum when you RSVP for the event. You do not need to read the book to attend the event. If you don't finish the book, no worries! About the book: "Throughout my life I have been told directly and indirectly that dyslexia is found in particular people... [In fact] dyslexia can be found in someone like me. It isn't just 'okay' but something to be proud of. This book has been written because I want people to know that dyslexia can be found in people of every colour, creed, or circumstance." In this book, rising star entrepreneur Onyinye Udokporo shares her story of growing up dyslexic in a society where neurodivergence was always presented as a white male issue. Onyinye discusses her experience of being diagnosed at 11 years old, starting a business the following year, gaining a scholarship to a prestigious boarding school and going on to complete two degrees by the age of 22, while also being honest about the difficulties she faced throughout including with bullying and anxiety. She shares the tips she picked up over the years for thriving with dyslexia and the strategies she used to overcome her difficulties in reading and writing well, staying organised and speaking with confidence. Illuminating wider issues of systemic racism in the educational sector and providing a timely reminder that dyslexia can be found in any community and culture, this is an empowering story of surviving and thriving in the face of adversity.Events in Oak Park, ILAutismBook ClubADD/ADHDPersonal DevelopmentDyslexia and Learning DisabilitiesChicago Neurodiverse Social ClubSee more eventsChicago Neurodiverse Social Clubpublic groupSunday, March 2, 20251:00 PM to 2:30 PM CSTOak Park Public Library834 Lake St. · Oak Park, ILChicago Neurodiverse Social Clubpublic groupCAYR Connections: Neurodiversity Book Club (Hybrid)FREE30 spots leftAttend'''
