full_description = "Historic Downtown Miami WalkHosted ByLorraineDetailsThe Magic City didn't get its name because Miami was as flashy back then as it is now. Nope. In 1896 we went from 300 families to a boom of 10,000 in just three years. Come walk downtown with Historian Cesar Becerra, as he peels back the layers of history in downtown. Joining him is special guest guide William Keddell, expert in archeology and well known advocate for conscientious excavation on Native American sites! We will meet in the main plaza of the Cultural Center right smack in the middle between the HistoryMiami Museum and the main branch of the Miami Dade County Public Library. Take the MetroRail (service every 20 mins on weekends) to Government Center or park at the back of the cultural center. The plaza is above street level. Take the steps or the ramp. FEE: $10 members & $20 non-FTA members (Membership is $40/yr; www.floridatrail.org) Group Size: 30 MAX PAY VIA ZELLE to 305-213-1500 When: Sunday March 2nd, 2025 Where: 101 W. Flagler St, Miami FL 33130 Time and duration: 10:00am - 1:00pm Bring/wear: water and snacks, comfortable shoes, hat and sunscreen, weather-appropriate clothing Contact person: Susan Manns Chair, FTA Big Cypress ChapterEvents in Miami, FLFlorida Trail Association - Big Cypress ChapterSee more eventsFlorida Trail Association - Big Cypress Chapterpublic groupSunday, March 2, 202510:00 AM to 1:00 PM ESTHistory Miami MuseumWe'll Meet at History Miami Museum / Library Courtyard [101 W Flagler St, Miami, FL 33130] · Miami, FLFlorida Trail Association - Big Cypress Chapterpublic groupHistoric Downtown Miami WalkFREEAttend"
