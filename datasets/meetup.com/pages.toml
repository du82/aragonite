title = "Benchmarking Usability and the Cognitive A11y Frontier, Tue, Mar 4, 2025, 7:30 PM   | Meetup"
description = """
This event will be online and in-person. **The speaker and live stream starts at 7:30 pm ET**. In-person attendees may arrive as early as 7 pm ET.

**Description**
Join Fab"""
full_description = "Benchmarking Usability and the Cognitive A11y FrontierHosted ByThomas L. and 3 othersDetailsThis event will be online and in-person. The speaker and live stream starts at 7:30 pm ET. In-person attendees may arrive as early as 7 pm ET. Description Join Fable co-founders Abid Virani and Alwar Pillai as they explore the future of usability benchmarking through an accessibility lens. This talk will delve into the Accessible Usability Scale (AUS) — its adoption, industry data on assistive technologies, and the key UX challenges faced by diverse user groups. Abid and Alwar will also discuss how Fable is advancing accessibility usability research to address the cognitive inclusive digital future. Attendees will: Learn from accessibility thought leaders driving innovation in usability benchmarking. Gain unique insights into industry trends and real-world data on assistive technology usage. Understand the challenges and solutions for addressing cognitive accessibility in UX design. There will be time for your questions. Presenter bios Alwar Pillai is the Co-Founder and CEO of Fable, a leading accessibility platform powered by people with disabilities. Before founding Fable, Alwar led large-scale accessibility initiatives in both the public and private sector. From her UX and design experience, Alwar learned that the experiences of people with disabilities need to be central to improving digital accessibility. Alwar has been celebrated as one of Forbes’ Top 30 Under 30 Social Entrepreneurs, and one of The Globe and Mail’s Top 50 Changemakers. Alwar has an M.Des. in Inclusive Design where she focused on designing social applications for seniors with mild cognitive impairments and is currently leading Fable’s Cognitive Accessibility Working Group. Abid Virani is the Co-Founder and COO at Fable. Informed by experiences spanning the non-profit sector, international development initiatives, and digital product development, Abid is a strong advocate of accessibility and inclusive design. Abid has been celebrated as one of Forbes’ Top 30 Under 30 Social Entrepreneurs and an Emerging Innovator in North America by Ashoka Changemakers Accessibility The presentation will have human captions [CC], not automatic captions. There will be an ASL interpreter. For Aira Visual Interpreter access for the Blind and Low Vision community, download the Aira Explorer app on the Apple App Store or Google Play. For access in the physical space, the A11yNYC geofence should apply automatically. To access the online webinar for audio description, use the A11yNYC Access Offer to call, or simply inform your Visual Interpreter that you'd like that offer applied when you connect. Please let us know about any other accessibility requirements two weeks before the event. Livestream YouTube link. Provided by Internet Society Accessibility SIG. Location details The event is on the 4th floor. Everyone must be accompanied to the event on the 4th floor. Because everyone needs to be escorted, please arrive early or on time. When you enter the ground floor, a representative from A11yNYC will be there to provide elevator access. Attendees can enter on the third floor and go up the staircase, or request accommodation to go directly to the 4th floor. Thanks to Ben Ogilvie for making this possible! Let us know if you're coming! The building is near several transit stops: 6 train Spring Street (non-accessible stop): 100 feet Canal Street (accessible stop): 0.4 miles NQRW trains Prince Street (non-accessible stop): 0.2 miles Canal Street (accessible stop): 0.3 miles M1 / M55 Bus lines Broadway/Spring Street stop: 500 feet Cabs and rideshares can let passengers out right near the building entrance Accreditation All A11yNYC meetups are pre-approved for IAAP Continuing Accessibility Education Credits (CAEC). Sponsors Thanks to AKQA, Deque, Evinced, Equal Entry, and Fable for sponsoring. Want to be a sponsor? Contact meryl@equalentry.comEvents in New York, NYAccessibilityWeb AccessibilityWeb TechnologyTechnologyA11yNYC - Accessibility New York CitySee more eventsA11yNYC - Accessibility New York Citypublic groupTuesday, March 4, 20257:30 PM to 9:00 PM EST72 Spring St72 Spring St · New York, NYA11yNYC - Accessibility New York Citypublic groupBenchmarking Usability and the Cognitive A11y FrontierFREEAttend"
