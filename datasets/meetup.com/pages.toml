["https://meetup.com/chicago-neurodiverse-social-club"]
title = "Chicago Neurodiverse Social Club | Meetup"
description = '''
The Chicago Neurodiverse Social Club (formerly the Oak Park and River Forest Neurodiverse Social Club) seeks to introduce neurodiverse adults to each other and provide social support and connection. The club is intended to act as both a support group and a social club. This group is open to any adult (18+) in the Chicago area who is diagnosed with or is seeking a diagnosis for a neurodiverse condition. The group is also open to self-diagnosed individuals.
Neurodiverse conditions include Autism Spectrum Disorders, ADD/ADHD, Dyslexia, or any developmental, mental health, or cognitive condition. What’s important is that you consider yourself to fall under the "neurodiverse" label and are seeking connection with people who share in your life experiences.
Future events may include game nights, support group meetings, nights out on the town, and coffee chats. Let us know if you have an event you'd like to see us hold! Please contact the group organizers if you will need any accessibility accommodations to participate. Efforts will be made to choose event locations that are easily accessible. Most of our events in Oak Park are easy to reach via CTA's Green Line.
If you're interested in volunteering with us, please fill out this volunteer interest form: https://forms.gle/LSGD6SHkH4KE6LvHA
The Chicago Neurodiverse Social Club is proudly supported by Come As You Are (CAYR) Connections! CAYR Connections is a local non-profit based in Oak Park, IL that seeks to improve the lives of the neurodivergent community. They provide access to resources, increase community awareness around neurodivergent issues, and create community spaces for neurodivergent individuals and their families. Please check them out at this link! CAYR Connections is a great resource if you have children who are not old enough to attend this group.'''
full_description = '''Chicago Neurodiverse Social ClubChicago, IL, US1,452 members · Public groupOrganized by Audrey KoziolShare:Join this groupAboutEventsMembersPhotosDiscussionsMoreJoin this groupWhat we’re aboutThe Chicago Neurodiverse Social Club (formerly the Oak Park and River Forest Neurodiverse Social Club) seeks to introduce neurodiverse adults to each other and provide social support and connection. The club is intended to act as both a support group and a social club. This group is open to any adult (18+) in the Chicago area who is diagnosed with or is seeking a diagnosis for a neurodiverse condition. The group is also open to self-diagnosed individuals. Neurodiverse conditions include Autism Spectrum Disorders, ADD/ADHD, Dyslexia, or any developmental, mental health, or cognitive condition. What’s important is that you consider yourself to fall under the "neurodiverse" label and are seeking connection with people who share in your life experiences. Future events may include game nights, support group meetings, nights out on the town, and coffee chats. Let us know if you have an event you'd like to see us hold! Please contact the group organizers if you will need any accessibility accommodations to participate. Efforts will be made to choose event locations that are easily accessible. Most of our events in Oak Park are easy to reach via CTA's Green Line. If you're interested in volunteering with us, please fill out this volunteer interest form: https://forms.gle/LSGD6SHkH4KE6LvHA The Chicago Neurodiverse Social Club is proudly supported by Come As You Are (CAYR) Connections! CAYR Connections is a local non-profit based in Oak Park, IL that seeks to improve the lives of the neurodivergent community. They provide access to resources, increase community awareness around neurodivergent issues, and create community spaces for neurodivergent individuals and their families. Please check them out at this link! CAYR Connections is a great resource if you have children who are not old enough to attend this group.Upcoming events (4+)See allSun, Mar 2, 2025, 1:00 PM CSTCAYR Connections: Neurodiversity Book Club (Hybrid)Oak Park Public Library, Oak Park, ILThis event is held by CAYR Connections, a sponsor of the Chicago Neurodiverse Social Club. Check them out, and RSVP at: https://www.cayrconnections.org/events/neurodiversity-book-club-1 This is a HYBRID event -- the in-person meeting will take place at the Oak Park Public Library. We will also have a virtual option using Zoom. Join the online discussion group before the event for excerpts, questions, and comments about the book! You should be automatically invited to join the online forum when you RSVP for the event. You do not need to read the book to attend the event. If you don't finish the book, no worries! About the book: "Throughout my life I have been told directly and indirectly that dyslexia is found in particular people... [In fact] dyslexia can be found in someone like me. It isn't just 'okay' but something to be proud of. This book has been written because I want people to know that dyslexia can be found in people of every colour, creed, or circumstance." In this book, rising star entrepreneur Onyinye Udokporo shares her story of growing up dyslexic in a society where neurodivergence was always presented as a white male issue. Onyinye discusses her experience of being diagnosed at 11 years old, starting a business the following year, gaining a scholarship to a prestigious boarding school and going on to complete two degrees by the age of 22, while also being honest about the difficulties she faced throughout including with bullying and anxiety. She shares the tips she picked up over the years for thriving with dyslexia and the strategies she used to overcome her difficulties in reading and writing well, staying organised and speaking with confidence. Illuminating wider issues of systemic racism in the educational sector and providing a timely reminder that dyslexia can be found in any community and culture, this is an empowering story of surviving and thriving in the face of adversity.9 attendees+4AttendSat, Mar 8, 2025, 6:00 PM CSTHobby and Craft Night Henry C Palmisano, Chicago, ILJoin the Chicago Neurodiverse Social Club for a hobby and craft night! Are you someone who likes to draw, sew, cross-stitch, paint, knit, carve wood, write, or any other personal hobby that can be done indoors? Or, are you someone who'd like to learn how to do one of the above? Bring your work and come hang out with us and potentially learn a new skill! Drinks and snacks provided, but please bring any craft or hobby materials you may need, or want to teach others about. This board game night is hosted by the Chicago Neurodiverse Social Club, which is for neurodiverse adults in the Chicago area. The event is in Bridgeport in Chicago, and the exact address will be provided the day of, for people who have RSVP'd via the event comments around 3-4pm. The Palmisano park address currently listed in the location is very close to the actual address, and is listed for planning purposes. Please contact the group if you have any accessibility concerns.35 attendees+30AttendSat, Mar 15, 2025, 3:00 PM CDTNeurodiverse Support Group Meeting (Oak Park)Oak Park Public Library, Oak Park, ILThis meeting is a combined support group/social connection opportunity for neurodiverse adults (18+) in the Chicago area, hosted by the Chicago Neurodiverse Social Club at the Main Branch of the Oak Park Public Library. Feel free to bring a coffee or other beverage. We will be getting to know one another, discussing challenges and wins in our lives, and possibly splitting into multiple groups based on attendance. Meeting schedule is (usually) as follows: 3:00-3:10pm: Arrivals and general chit-chat 3:10-3:15pm: Introductions and group announcements 3:15-4:15pm: Support group 4:15-4:20pm: Wins/successes share 4:20-4:30pm: Wrap up and attendee departure Garage and street parking are available at the Main Branch of Oak Park Public Library. Please contact the group if you have accessibility concerns or any questions!35 attendees+30AttendSat, Mar 22, 2025, 7:00 PM CDTSpecial Interest/Hobby Presentation NightTangible Books, Chicago, ILJoin the Chicago Neurodiverse Social Club for a special interest and hobby presentation night at Tangible Books in Bridgeport! This event will feature 6-8 presenters who will each give a 8-10 minute presentation on a topic they're passionate about (hopefully with some slides and demos!). Please send Audrey a message (or ask in the comments below) if you'd like to give a presentation! Any topic you're interested in is OK, as long as it's "generally" safe for work. Several presentation slots are already taken. A laptop and projector will be available for any accompanying PowerPoint or slide deck you want to bring. Feel free to bring a physical demo or model if you'd like! If you'd like to bring a loved one or friend for moral support, please feel free :) Drinks and snacks provided (but you're welcome to bring some too). Street parking available. Please contact the group if you have any accessibility concerns or questions!40 attendees+35AttendPast events (78)See allSat, Mar 1, 2025, 1:00 PM CSTNeurodiverse Support Group Meeting (Logan Square)This event has passed48 attendees+43OrganizerAudrey Koziol MessageMembers (1,452)See allLCMLGroup linksRelated topicsADD/ADHDPersonal DevelopmentADHDSelf-Help & Self-ImprovementDyslexia and Learning DisabilitiesAsperger SyndromeSelf-EmpowermentSelf ExplorationSocial AnxietyMental IllnessCommunity BuildingAutismWellnessBrain InjuryConfidence and Self-Esteem'''
