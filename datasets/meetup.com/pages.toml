["https://meetup.com/sf-sketchers"]
title = "SF Sketchers | Meetup"
description = "We get together on weekends to wander around San Francisco, sketching people and places, natural and urban. We usually sketch for 2-3 hours, then sit down in a cafe to share sketches and chat. Sometimes we join up with other sketching groups or do field trips outside the city. Everyone welcome."
full_description = '''SF SketchersSan Francisco, CA, US5,085 members · Public groupOrganized by Laurie Wigham and 14 othersShare:Join this groupAboutEventsMembersPhotosDiscussionsMoreJoin this groupWhat we’re aboutWe get together on weekends to wander around San Francisco, sketching people and places, natural and urban. We usually sketch for 2-3 hours, then sit down in a cafe to share sketches and chat. Sometimes we join up with other sketching groups or do field trips outside the city. Everyone welcome. Upcoming events (4+)See allSun, Mar 2, 2025, 10:30 AM PSTPresidio Middle SchoolPresidio Middle School, San Francisco, CALets sketch Presidio Middle School! The building has a lot of decorative elements: two lions near the entrance, figures on top of the columns and a beautiful portal. Lets meet at Clement & 30th at 10:30 am, come back to the same spot at 12:30 to share sketches. Please note that the panther sculpture is in the school yard and is not easily accessible. You can see it through the bars from the 29th avenue closer to Geary, but it's pretty far.B14 attendees+9AttendMon, Mar 3, 2025, 8:00 AM UTCVirtual Event: Draw 100 People in One Week, 2025Link visible for attendeesIt's on again! Montreal sketcher Marc Taro Holmes is inviting sketchers around the world to join him for the 9th annual #OneWeek100People challenge, March 3-9 2025. 40 attendees+35AttendMon, Mar 3, 2025, 5:00 PM UTCMonday Morning Zoom Sketch GroupLink visible for attendeesStart your Monday sketching with pencil, pen or watercolor. We'll take turns posing for seven minutes each with a different theme each week. We are always fully clothed. At the end of each session we share our work. Beginning or experienced artists are welcome. We'll do every Monday from 9AM - 11AM. IMPORTANT! You will receive an email with the Zoom link, so make sure that Meetup.com has your correct email address. Also check that your Settings are turned on to receive Mailing list messages "As they are sent" (it's the last one on the list of email settings). ZOOM TIPS ◦ Make sure you have updated your browser (Chrome works best) and your operating system ◦ If you are on a tablet, download the Zoom app before entering the room. ◦ If you are new to Zoom please read: https://support.zoom.us/hc/en-us/articles/200941109-Attendee-Controls-in-a-Meeting ◦ Set up a free zoom account if you’ve had trouble accessing Zoom events in the past. If you already have a Zoom account, make sure you've upgraded to version 5. ZOOM ETIQUETTE ◦ Arrive at the waiting room 5 to 10 minutes before the start time. ◦ We can chat while drawing, but remember to mute yourself if there's a lot of background noise or you need to shuffle things around or talk to someone at home.7 attendees+2AttendWed, Mar 5, 2025, 1:00 PM PSTPortrait Party with Victoria Fong & the Sunset SketchersNeeds locationIt’s time for our Annual Portrait Party! As part of the “Draw 100 People in One Week" from March 3-9 this year, we will meet to draw each other at Victoria’s place at 1 Lomita Avenue, San Francisco. You will be able to sketch other sketchers in timed 5- or 10-minute sketches, and you will take a turn as a model (fully clothed!) while others sketch you. Please be sure to RSVP soon as seating is limited to 15. (You may get to knock out 15 of the 100 this way!) Indoor/outdoor seating will be provided depending on the weather and attendee preferences. If you have questions, please contact Victoria at 415-203-2584. We look forward to your joining to sketch other fellow sketchers!15 attendees+10AttendPast events (1710)See allSat, Mar 1, 2025, 10:30 AM PSTFirst Saturday Urban SketchingThis event has passed16 attendees+11OrganizersLaurie Wigham and 14 othersMessageMembers (5,085)See allGroup linksFind us also atFlickrRelated topicsFigure DrawingArtistsPaintingLandscape PaintingPlein Air PaintingFine ArtsFree-hand DrawingDrawingWritingArtArt Walks and ToursWalkingUrban SketchingSketchingField Sketching'''
