["https://www.meetup.com/san-francisco-city-steps/events/306403358"]
title = "From The Glen to The Mountain (with 2 tiled stairways), Sun, Mar 2, 2025, 10:00 AM   | Meetup"
description = "We're starting this walk a bit earlier than usual because it's Oscars night. We'll be just over three hours, so you'll have plenty of time to get home, change into your bal"
full_description = '''From The Glen to The Mountain (with 2 tiled stairways)Hosted ByElizabethDetailsWe're starting this walk a bit earlier than usual because it's Oscars night. We'll be just over three hours, so you'll have plenty of time to get home, change into your ballgown, and practice your acceptance speech Let's do a bit of up and down through some of San Francisco's nicest open space parks. On this walk, we'll start at the Glen, trek up to the mountain, and see some of the city's quiet and peaceful neighborhoods. We walk in a loop, so we'll start and end in the same place. We meet at the corner of O'Shaughnessy and Woodside in front of the entrance to the Ruth Asawa School of the Arts at McAteer. You will see a small, grassy plaza next to the school sign. We begin walking at 10:00 AM and head into Glen Canyon Park. This part of the hike is mostly downhill, but there is a rocky uphill cliff section to be traversed as well. We walk along small uneven paths, wide open fire roads, and the occasional wooden bridge. We leave the canyon and make our way to the peak of Mt Davidson, the highest point of of the city. We'll take a short detour to enjoy the newest TILED STAIRCASE at Elk. This section of the walk goes through small winding streets in quiet neighborhoods. It's a steep uphill to the top (how uphill? Trucks not advised on any of these streets). As an incentive, about 1/2 way up, we come across a lovely surprise: another TILED STAIRCASE. We'll spend a few minutes exploring this hidden gem before making that last push to the mountain top. Once we make it to the top and enjoy the incredible views, we head back to our starting point through the paths along the mountain. This part is all downhill (I promise). Mt. Davidson trails can be wet even in dry weather. Some of the paths may be a bit mucky in parts. Restrooms: There is a shopping plaza across the street. Mollie Stone's, Starbucks, and CVS each has a restroom. There is one restroom break planned, at the bottom of Glen Canyon about 45 minutes in. Getting there: Woodside and O'Shaugnessy is part of a 4 way intersection with Portola and Twin Peaks. Buses #36 (Teresita) #44 O'Shaughnessy, #48 Quintara, and #52 (Excelsior) each have a stop there. Bus #43 Masonic stops at Portola and Laguna Honda, a few blocks away. The Forest Hill underground station is about a 10 minute walk from our starting point. BART users should exit at Glen Park Station and transfer to a 36, 44, or 52. Parking is neighborhood only. The immediate area has a 2 hour limit, but you should be able to find unlimited parking within a few blocks. There is a parking turnout for about 10 cars on O'Shaughnessy, just past our meeting spot. Don't park at the shopping plaza- it's metered and they ticket. In the past, people have been able to park at the school lot, but that rule may have changed.. Dogs are always welcome on my walks. Please follow our doggie guest rules. They must remain on leash and not be disruptive. They'll love the Canyon and the Mountain, but the appeal of Tiled Steps will probably be lost on them. Dress for the weather and wear sturdy shoes. SAFETY: You are responsilble for your own safety at all San Francisco City Steps events. Your "yes" RSVP indicates that yo have read and agree to the liability policy that can be found at the bottom of every Meetup.com page. THINGS TO BRING: Water A snack you can eat while walking (No lunch break) Hand sanitizer Camera Walking poles if you are a bit unsteady on the trails Sense of camaraderie, adventure, and fun! We walk in a mist or drizzle, but rain (not forecast) or high winds cancel.Events in San Francisco, CAAdventureNew In TownOutdoorsSocialWalkingSan Francisco City StepsSee more eventsSan Francisco City Stepspublic groupSunday, March 2, 202510:00 AM to 10:01 AM PSTO'Shaughnessy Boulevard & Woodside Avenue · San Francisco, CASan Francisco City Stepspublic groupFrom The Glen to The Mountain (with 2 tiled stairways)FREE20 spots leftAttend'''
