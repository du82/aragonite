title = "Private Tour of the Historic Chicago Theater with Guide-Leyla Royale, Sun, Mar 2, 2025, 9:50 AM   | Meetup"
description = "I'm excited to announce that I've arranged for another exclusive, private backstage tour of the Chicago Theater for our group! This extensive and engaging tour is perfect f"
full_description = '''Private Tour of the Historic Chicago Theater with Guide-Leyla RoyaleHosted ByGiovina R.DetailsI'm excited to announce that I've arranged for another exclusive, private backstage tour of the Chicago Theater for our group! This extensive and engaging tour is perfect for architecture, history and theater enthusiasts alike. Leyla Royale, our professional guide from Effing Chicago & Chicago for Chicagoans, will share her wealth of knowledge and insider stories. Many of you will remember Leyla from our fantastic tour over the last couple of years. For those who couldn't make it or who are new to the group, this is a wonderful opportunity to experience the theater's hidden corners and rich history. PLEASE NOTE THAT THE TOUR WILL TAKE PLACE ON A SUNDAY MORNING AND COSTS $30 PER PERSON IN CASH, PAYABLE AT THE START OF THE EVENT. Whether you're a first-timer on Leyla's tours or have enjoyed her expertise before, I'm confident you'll have a fantastic time. With many new members in our group, I wanted to offer this fabulous tour again for everyone to enjoy! The tour is approx. 2 hrs & includes walking through the building and climbing stairs so wear good walking shoes! The elevator is available for those unable to climb stairs. This is a joint event with several other meetup groups, so it is multi-group event! EVERYONE MUST CHECK IN WITH ME FIRST. WE WILL MEET AT THE FRONT DOORS OF THE THEATER ON STATE STREET. $30 UPFRONT CASH PAYMENT DUE AT THE START OF THE TOUR. We will be in for treat, as Leyla will play one of the two theater organs for us during the tour! After the tour, some of us will get lunch at nearby at Elephant & Castle, located at 185 N Wabash Ave. All are welcome to join! If Elephant & Castle is too busy, we can hit something else nearby, so we have options. https://www.elephantcastle.com/en/menus/food.html The grandeur of The Chicago Theatre often leaves its visitors breathless. The elegant lobby, majestic staircase and beautiful auditorium complete with murals above the stage and on the ceiling, are components of an amazing building called “the Wonder Theatre of the World” when it opened on October 26, 1921 The Chicago Theatre was the first large, lavish movie palace in America and was the prototype for all others. This beautiful movie palace was constructed for $4 million by theatre owners Barney and Abe Balaban and Sam and Morris Katz and designed by Cornelius and George Rapp. It was the flagship of the Balaban and Katz theatre chain. The 3,600-seat auditorium is seven stories high, more than one-half of a city block wide, and nearly as long. The vertical sign “C-H-I-C-A-G-O,” at nearly six stories high, is one of the few such signs in existence today. A symbol of State Street and Chicago, the sign and marquee are landmarks in themselves, as is the 29-rank Wurlitzer theatre pipe organ. In 1986, Chicago Theatre Restoration Associates, with assistance from the City of Chicago, bought and saved the theatre from demolition and began a meticulous 9-month multi-million-dollar restoration undertaken by Chicago architects Daniel P. Coffey & Associates, Ltd. and interior design consultants A.T. Heinsbergen & Co. of Los Angeles, interior design consultants. The Chicago Theatre reopened on September 10, 1986 with a gala performance by Frank Sinatra. https://www.msg.com/the-chicago-theatre/history/ ​Leyla Royale is a tour guide & historian with 10+ years of experience. She focuses on movie theatre history as well as the weird ways people in Chicago have died. A member of the Effing Chicago tour collective & creator of Dead in Chicago, she is also a proud board member of Chicago for Chicagoans. Leyla worked as an usher & tour guide at the Chicago Theater from 2008 until about 2015. She is also a cellist, proud preservationist, wannabe flying trapeze artist, and even plays the organ! For more info about Chicago for Chicagoans, click here: http://www.chicagoforchicagoans.org For more info about Effing Chicago click here: http://effingchicago.com/ For more info about Dead in Chicago click here: https://www.deadinchicago.com/ If you are taking public transportation, please check Google Maps for directions or use CTA trip planner. https://www.transitchicago.com/planatrip/ If you drive, there is metered street parking a few blocks away & parking garages. Best to use SpotHero or ParkWhiz for the cheapest & safest option! PLEASE KEEP RSVP UP TO DATE AND DO NOT BE A NO SHOW!Events in Chicago, ILArchitectureArt Walks and ToursExploringTheaterTours" ¡ ᗯᗩᑎTEᗪ TO ᗪO TᕼᗩT . . . ᒍᑌᔕT ᑎOT ᗩᒪOᑎE ! ! ! ℠ " ChicagoSee more events" ¡ ᗯᗩᑎTEᗪ TO ᗪO TᕼᗩT . . . ᒍᑌᔕT ᑎOT ᗩᒪOᑎE ! ! ! ℠ " Chicagopublic groupSunday, March 2, 20259:50 AM to 12:50 PM CSTChicago Theater175 N State St · Chicago, IL" ¡ ᗯᗩᑎTEᗪ TO ᗪO TᕼᗩT . . . ᒍᑌᔕT ᑎOT ᗩᒪOᑎE ! ! ! ℠ " Chicagopublic groupPrivate Tour of the Historic Chicago Theater with Guide-Leyla RoyaleFREE50 spots leftAttend'''
