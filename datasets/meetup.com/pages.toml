full_description = "Second Saturday of the Month - Live and In Person #18Hosted ByMark S.DetailsTHIS IS AN IN-PERSON MEETUP! It's the last day of Standard Time until November! We'll play from The Daily Ukulele (the Yellow Book) and The Daily Ukulele Leap Year Edition (the Blue Book). Please bring your instrument(s), a floor or table music stand, your singing voices, and your fabulous ukulele spirit! We'll play music from 5:00 pm to 7:30 pm, with a short intermission. The dropbox link to The Daily Ukulele. https://www.dropbox.com/s/ln4hr6ir3caqs5s/DAILY%20UKULELE%20-%20BOOK%20ONE.pdf?dl=0 The dropbox link to the Daily Ukulele - Leap Year Edition: https://www.dropbox.com/s/7z6mz62rzg8smyj/Daily_Ukulele_Leap_Year.pdf?dl=0 We'll go around the room so that everyone can pick songs to play. If you pick a song, you will be encouraged (but not required) to lead it. If you'd like to let the group know in advance which songs you plan to select, please post the songs you choose in the comments, and we'll play one of those songs each time it's your turn to pick a song. You can also brings songs to share that are not in the Yellow Book or the Blue Book; just please bring enough copies of the sheet music to share. A voluntary donation of $5 to defray Meetup website costs and to tip our hosts is appreciated. San Francisco Ukulele Rebellion logo kazoos will be available for purchase. IMPORTANT NOTICE: I do not disclose the location of our in-person jams on the Meetup website. While the date and time of these in-person meetups will still be posted here, I'll be notifying people of the location of these meetups using an email distribution list. If you'd like to be on this list, please email me at sfukerebellion@yahoo.com from the email address you'd like me to add to the distribution list. COVID UPDATE: San Francisco, like the rest of the country, experienced a Covid-19 summer surge, and flu season, when Covid cases historically increase, will be upon us by November. Several people I know who live in the Bay Area have tested positive for Covid recently. I think it's still safe for us to meet, but I strongly encourage people to observe social distancing and other measures, like masking, that have been shown to inhibit the spread of Covid. For the safety of others in the group, please don't attend this meetup if you are not feeling well or if you are experiencing Covid-like symptoms. I won't require people to test for Covid, but I strongly encourage you to test for Covid on Saturday afternoon. From what I understand, most of the people I know who have gotten Covid recently got it from someone who didn't even know they had it at the time of exposure. Thank you in advance for your thoughtfulness.Events in San FranciscoUkuleleAcoustic JamsFolk MusicSongwritingSan Francisco Ukulele Rebellion!See more eventsSan Francisco Ukulele Rebellion!public groupSaturday, March 8, 20255:00 PM to 8:00 PM PSTNeeds a locationSan Francisco Ukulele Rebellion!public groupSecond Saturday of the Month - Live and In Person #18FREEAttend"
