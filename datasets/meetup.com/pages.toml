["https://meetup.com/chicago-anime-hangouts"]
title = "Chicago Anime Hangouts | Meetup"
description = """
This group is for fans of Japanese anime, manga, and media. We gather to discuss our favorite shows, share recommendations, and more.
Join us on Discord or WhatsApp (LinkTree for photo albums/groupchats - we have ones for outdoors/food/general).
---
We hope it provides a safe space for people who like all things anime, including cosplay, gaming, and geek culture. With this group, you can expect events like conventions, films at local theaters, seasonal anime screenings, arcade nights, and more!
Our reoccurring events include the following:

Seasonal Anime Screening (once a season)
Picnic/Potluck (once a season)
Arcade Nights (every month)
Bring Your Own Manga Book Club (every month at a new coffee shop)

If you have any event suggestions feel free to message to the organizers. If you would like to host events, don't hesitate to reach out. :D
We have a girl's group (get in touch with Neikey, one of our organizers), and a guy's group (get in touch with Mike, one of our organizers) to provide a safe space for people and allow people to hang out offline.
---
Don't Forget To Be Awesome!
(All of our members must adhere to our Code of Conduct.)
---
Cover image is inspired by INT'L Cafe Chicago."""
full_description = '''Chicago Anime HangoutsChicago, IL, US1,463 members · Public groupOrganized by Mike and 6 othersShare:Join this groupAboutEventsMembersPhotosDiscussionsMoreJoin this groupWhat we’re aboutThis group is for fans of Japanese anime, manga, and media. We gather to discuss our favorite shows, share recommendations, and more. Join us on Discord or WhatsApp (LinkTree for photo albums/groupchats - we have ones for outdoors/food/general). --- We hope it provides a safe space for people who like all things anime, including cosplay, gaming, and geek culture. With this group, you can expect events like conventions, films at local theaters, seasonal anime screenings, arcade nights, and more! Our reoccurring events include the following: Seasonal Anime Screening (once a season) Picnic/Potluck (once a season) Arcade Nights (every month) Bring Your Own Manga Book Club (every month at a new coffee shop) If you have any event suggestions feel free to message to the organizers. If you would like to host events, don't hesitate to reach out. :D We have a girl's group (get in touch with Neikey, one of our organizers), and a guy's group (get in touch with Mike, one of our organizers) to provide a safe space for people and allow people to hang out offline. --- Don't Forget To Be Awesome! (All of our members must adhere to our Code of Conduct.) --- Cover image is inspired by INT'L Cafe Chicago.Upcoming events (4+)See allSun, Mar 2, 2025, 1:00 PM CSTBring Your Own Manga Book Club @ Ipsento 606 (Bucktown)Ipsento 606, Chicago , ILhi - bring what you've been reading whether it's manga, light novels, manhwa, and more. hope to talk about what we've been reading, exchange recommendations, and more. just show up :D organizers will decide on what to do if not adequate seating (colectivo logan square has 2 stories / is a stop away on blue line) this will be a reoccurring monthly event, where we will be trying out new coffee shops, and venues while talking about anime. --- The word “ipsento” is the combination of two latin roots, ipse meaning "self", and sentio meaning "to discover". We believe that self-discovery happens through experience, whether it be traveling the world in search of the finest coffees, splitting a mini-donut with your little one or meeting for your first coffee with “the one”. That’s why our mission is to engage people with an immensely satisfying experience. ​ The craft of coffee brewing runs in our cores. At ipsento care deeply about the quality and taste of each cup. We are proud to be involved in the whole coffee making process — from picking the best beans to roasting and bringing out the unique flavors and aromas. We can’t wait to welcome you for a comforting cup of coffee. ~~~ we hope to see you there!26 attendees+21AttendWed, Mar 5, 2025, 5:30 PM CSTNourishing Hope - Online Market Evening Packing (Volunteer) (West Town)1716 W Hubbard St, Chicago, ILmeetup for chicago anime hangouts! hope to have conversations about anime, and manga and more. just show up :D just note that this is the first event focused around volunteering, and helping people, so be prepared to learn more about the non-profit we're working with in addition to the socializing aspect, and getting a meal or dessert afterwards. Nourishing Hope is an established Chicago food pantry, providing free food in a comfortable person-focused environment, with social and mental health services. INSTRUCTIONS FOR SIGNING UP TO VOLUNTEER AT BOTTOM description: come help us pack orders for Nourishing Hope's Online Market! Then we will load orders into the van for distribution. Volunteers are encouraged to wear comfortable clothing and closed toed shoes. Gloves provided at individual shifts. schedule: 5:30: get trained to help load orders and pack for Nourishing Hope. post-meetup: open to walk to Sabroso! Mexican Grill (624 N Ashland Ave, Chicago, IL 60622 - 8 minute walk away) to grab a light meal, or grab smoothies/dessert nearby. we hope to see you there! 9 attendees+4AttendWed, Mar 5, 2025, 6:00 PM CSTBoard Games (Dice Dojo) (Edgewater)Chicagoland Games: The Dice Dojo, Chicago, ILboard game meetup for chicago anime hangouts! hope to play some board games and have conversations about anime, and manga and more. just show up :D dice dojo has 1000+ games in their demo library. please support them if there’s a game you like and want to purchase. feel free to bring what you'd like to play! schedule: 6:00 pm: show up / checkin and get started with board games. their board game night starts at 5:00 from my understandingsing (?) name tags will be brought to indicate who's apart of the meetup. --- hope to see you there! --- CB5 attendeesAttendSat, Mar 8, 2025, 4:00 PM CSTInternational Food Series: VenezuelaBien MeSaBe, Chicago, ILThis is the first of our series of internationalnal food restaurants where we try food from another culture each month with a different country. This event we will be focusing on Venezuelan dishes. We accept recommendations for future10 attendees+5AttendPast events (122)See allSat, Mar 1, 2025, 3:30 PM CSTIce Skating @ McFetridge Sports Center (Irving Park)This event has passed23 attendees+18OrganizersMike and 6 othersMessageMembers (1,463)See allBWFMLEGroup linksFind us also atFacebookInstagramRelated topicsAnimeSci-Fi/FantasyCosplayComic BooksAnime & MangaGeeks & NerdsAnime ConventionsMangaJapanese FilmsJapanese CultureJapanese FoodJapaneseGeek CultureAnime CosplayAnime Music'''
