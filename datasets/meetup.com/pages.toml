full_description = '''Moral Responsibility (2)Hosted ByRodrigo V.DetailsThis week we'll discuss Moral Responsibility (2). "Making judgments about whether a person is morally responsible for their behavior, and holding others and ourselves responsible for actions and the consequences of actions, is a fundamental and familiar part of our moral practices and our interpersonal relationships. ... For a long time, the bulk of philosophical work on moral responsibility was conducted in the context of debates about free will and the threat that determinism might pose to free will. A largely unquestioned assumption was that free will is required for moral responsibility, and the central questions had to do with the ingredients of free will and with whether their possession is compatible with determinism. Recently, however, the literature on moral responsibility has addressed issues that are of interest independently of worries about determinism. Much of [today's reading] will deal with these latter aspects of the moral responsibility debate." See the SEP: https://plato.stanford.edu/entries/moral-responsibility/ If it's your first time, don't feel obligated to read anything in advance, but bring your iPad or tablet, if you have one. All are welcome, if philosophically inclined. Try to arrive early. We start the discussion at 12:15pm, exactly. Here's a little something about skepticism and something more on other philosophical topics. We are closer to Hawthorne than to Kuhn. If the meeting is full, join the waitlist and check again on Sunday morning. You may find a spot has opened up. Also, see what meetings are coming up in the weeks ahead.Events in San Francisco, CASan Francisco PhilosophySee more eventsSan Francisco Philosophypublic groupSunday, March 2, 202512:15 PM to 2:15 PM PSTEvery week on Sunday until March 8, 2025Aquitaine Wine Bar & Bistro216 Church St · San Francisco, CASan Francisco Philosophypublic groupMoral Responsibility (2)FREE15 spots leftAttend'''
