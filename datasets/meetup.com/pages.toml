title = "MLOps Days NYC: AI/ML gathering, Tue, Mar 4, 2025, 4:00 PM   | Meetup"
description = """
Join us in the heart of New York City for a free ML/AI mega-meetup featuring an incredible lineup of ML experts, data scientists, and DevOps professionals.
Dive into scalin"""
full_description = "MLOps Days NYC: AI/ML gatheringHosted ByMLOps C.DetailsJoin us in the heart of New York City for a free ML/AI mega-meetup featuring an incredible lineup of ML experts, data scientists, and DevOps professionals. Dive into scaling AI in production, optimizing ML workflows, and more in data science. This is a great opportunity to mingle with the best tech minds NYC has to offer over some good food. Register now on LUMA and save your spot! Featuring: AIOps at Reasonable Scale by Ciro Greco, Founder and CEO @ Bauplan This session explores the unique security challenges of ML systems in the GenAI era and provides actionable strategies to safeguard them. Learn why traditional approaches fall short and how to fortify your ML lifecycle to stay ahead in an evolving threat landscape. We have pioneered the concept of “ML for the 99%” with the ML at reasonable scale series, and recently discussed what changed with the new AI wave (spoiler: not much, the fundamentals stay!). In the talk, we review the basics of ML in production and stress what changed and what didn’t in the era of LLMs. Protecting ML Systems in the GenAI Era by Yuval Fernbach, VP, CTO MLOps @ JFrog Generative AI and machine learning systems are reshaping industries but also introducing new security risks. The reliance on vast data, rapid deployment cycles, and automated pipelines in MLOps has expanded the attack surface, exposing vulnerabilities to data poisoning, adversarial inputs, and pipeline exploitation. This session explores the unique security challenges of ML systems in the GenAI era and provides actionable strategies to safeguard them. Learn why traditional approaches fall short and how to fortify your ML lifecycle to stay ahead in an evolving threat landscape. Integrating Tech to Unlock Generative AI by Liron Freind Saadon, Head of Dev Rel @ NVIDIA An Ideal MLOps platform in the Generative Al era is a comprehensive solution that supports the entire machine learning lifecycle, from data preparation and model development to model deployment and monitoring. It should provide seamless integration of tools and technologies that enable organizations to build, deploy, and manage machine learning models with ease. In this talk, we'll review some of the tools and solutions that exist to build, deploy, and scale GenAl workloads across different environments successfully. Human-in-the-loop feedback, agentic systems by Ari Kaplan, Head of Evangelism, Databricks Discover how incorporating continuous human guidance ensures ethical, accurate, and context-aware outputs, while autonomous agentic systems push the boundaries of Al, enabling proactive decision-making and complex problem-solving. Networking/Happy Hour Register now on LUMA and save your spot! 4:00 PM - 4:15 PM Arrival and Sign in 4:15 PM - 4:30 PM AIOps at Reasonable Scale 4:50 PM - 5:30 PM Protecting ML Systems in the GenAI Era 5:30 PM - 6:00 PM Fireside Chat with Industry leaders 6:00 PM - 6:45 PM Integrating Tech to Unlock Brought to you by JFrog! Register now on LUMA and save your spot!Events in New York, NEAI/MLMachine LearningArtificial IntelligenceData ScienceDevOpsNYC MLOps CommunitySee more eventsNYC MLOps Communitypublic groupTuesday, March 4, 2025 at 4:00 PM to Tuesday, March 4, 2025 at 7:00 PM EST45 Rockefeller Plaza, New York, NY 1002045 Rockefeller Plaza, New York, NY 10020 · New York, NeNYC MLOps Communitypublic groupMLOps Days NYC: AI/ML gatheringFREEAttend"
