full_description = '''Wine Festival with Live DJ - 50% Off Admission!Hosted ByDarren �.DetailsDon't miss this event! Taste some of the best wines of the world including some with a perfect rating of 100 points! 135 of the top wineries of the world will all converge up in San Francisco at Fort Mason on March 2nd. There will be 248 wines available to taste in a 3 hour period. Only wines that have scored a minimum of 92 points will be available to taste. Fort Mason is a great place to attend a wine festival. Besides the wine, a spread of breads, cheeses, and small bites are included in the price of admission. ENTERTAINMENT There will be a live DJ during the entirety of this event. This is much better than having a dead DJ. MEET JAMES SUCKLING Also, you will have a chance to meet James Suckling and his wife. "James Suckling is one of today’s leading wine critics, whose views are read and respected by wine lovers, serious wine collectors, and the wine trade worldwide. He is currently the wine editor for Asia Tatler and its nine luxury magazines in the region, including Hong Kong Tatler, China Tatler, Singapore Tatler, and Thailand Tatler. However, most of his time is spent working for his own website, JamesSuckling.com, as well as promoting his 100 Points wine glass with Lalique, the famous French crystal house." PRICING General admission tickets are $120 per ticket or two tickets for $200 total. SPECIAL PRICING FOR MEETUP MEMBERS The venue is generously offering our group a 50% discount on single general admission ticket purchases. Thus, the price is only $60 per person. PROMO CODE FOR MEETUP MEMBERS Input the following promo code when purchasing your ticket. "GREATWINES50" LINK TO PURCHASE TICKETS / ADDITIONAL INFO https://tickets-usa.jamessuckling.com/event/great-wines-world-san-francisco-2025-uw9xs5 SCHEDULE 3:00 PM - Wine Tasting Starts 4:00 PM - Meet New Friends from the Group - Location TBD 6:00 PM - Wine Tasting Ends PARTICIPATING WINERIES: --- NORTH AMERICA --- 