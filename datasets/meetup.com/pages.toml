full_description = "Leveraging GenAI for Real-World Impact & Architectural Insights w/ NX LibrariesHosted ByHeather S.Details📌 Building Smarter Apps: Leveraging GenAI for Real-World Impact with Karnik Modi AI is rapidly transforming businesses across industries, revolutionizing everything we do. But how can organizations effectively leverage AI to solve real-world challenges and drive innovation? In this session, we’ll explore how DigitalOcean’s GenAI platform makes AI more accessible, cost-effective, and easy to implement. Join us to discover how AI can unlock new opportunities for businesses of all sizes, and how you can get started with GenAI at DigitalOcean today! 📌 Mastering Monorepos: Architectural Insights with NX Libraries & Graph with Katalina Gable In modern development, managing a growing codebase efficiently is crucial for team productivity. NX provides a powerful framework to optimize monorepos, but how do you truly leverage its architecture for large-scale applications? In this talk, we’ll dive into the NX graph and library structure, exploring how they streamline development in a team environment. Through a live demo, you’ll see firsthand the advantages of NX’s caching, affected tests, and affected builds, demonstrating how these features enhance CI/CD efficiency and developer experience. Whether you're working in Angular( this demo), React, or Node.js, this session will equip you with the best practices for modularization, helping your team scale faster while maintaining code quality. Get ready to rethink how you structure your projects with NX! --------------------------------------------------------------------------------- Do you have something you'd like to share at an upcoming meetup? We are always looking for presenters and hosts. If you're interested, feel free to message us on Discord or email [heather@bitovi.com](http://mailto:heather@bitovi.com/)! We're so lucky to have support from various sponsors throughout the year. Bitovi, a digital product consultancy, is our primary sponsor.Events in Chicago, ILChicago JavaScript Meetup GroupSee more eventsChicago JavaScript Meetup Grouppublic groupTuesday, March 11, 2025 at 5:30 PM to Tuesday, March 11, 2025 at 8:00 PM CDT200 E Randolph St200 E Randolph St · Chicago, ILChicago JavaScript Meetup Grouppublic groupSponsorsSee allBitoviBitovi collaborates with companies to create amazing web apps.SponsorsSee allBitoviBitovi collaborates with companies to create amazing web apps.Leveraging GenAI for Real-World Impact & Architectural Insights w/ NX LibrariesFREEAttend"
