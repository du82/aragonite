full_description = "Enhancing LLM Applications with Retrieval Augmented GenerationHosted ByCharlie A. and 2 othersDetailsPresenters: Armelle Le Guelte and Rohit Venkat - Data Scientists at Xsolis As large language models (LLMs) become central to modern AI applications, organizations face challenges regarding knowledge freshness, accuracy, and domain adaptation. Retrieval augmented generation (RAG) has emerged as a transformative approach that addresses these limitations, dynamically incorporating external knowledge to reduce hallucinations, improve factual accuracy, and enable LLMs to work effectively with private or domain-specific data. This presentation explores the architectural principles of RAG, including vector databases, retrieval systems, and prompting techniques using frameworks like LangChain. We’ll demonstrate how RAG enhances AI applications through real-world case studies and conclude with a forward-looking discussion on emerging trends shaping the next generation of intelligent AI systems. As always free food and drinks. Come at 6PM to socialize and 6:30pm is the presentation.Events in Nashville, TNArtificial IntelligenceData AnalyticsData SciencePredictive AnalyticsData ManagementData Science NashvilleSee more eventsData Science Nashvillepublic groupMonday, March 17, 2025 at 6:00 PM to Monday, March 17, 2025 at 8:00 PM CDTTech Hill Commons500 Interstate Blvd S Suite 210 · Nashville, TNData Science Nashvillepublic groupEnhancing LLM Applications with Retrieval Augmented GenerationFREEAttend"
