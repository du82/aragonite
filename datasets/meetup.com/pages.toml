full_description = "Sunday Upper Hudson West Side Greenway | Walk & Talk New & Native New Yorkers Hosted ByOlisa .DetailsJoin us for 5.6 mile walk from 96th Street to 22nd Street. We will take in a brisk walk along Manhattan's Water-Front and take photos ending west side walk. The Manhattan Waterfront Greenway is a definite way for walking or cycling. We will only be doing 5.3 miles then ending at 96th Street. This is a perfect opportunity to see Manhattan, as I have loved it for years. This is along the park walks and statue filled walks facing our Neighbor State New Jersey. Gentle Suggestion: • Layer up in clothing (near water - massive winds & temperature) • Wear comfortable clothing • Skincare methods for cold weather: • Hats & Gloves (hands will get cold) • Empty back-pack to toss layers if too warm once walking The usual social distancing rules apply. Good Habits to Conduct during Walks • Bring hand sanitizer (always) • Stay home if you're not feeling well • Be on time. If there is a stop to eat, it is optional. This is not a guarantee Thank you Olisa (718) 737-1200 Suggestion from the organizer: Best ways to contact her WhatsApp (we have a group on their and conversation can be more private.) You have the option of Facebook to communicate. I usually post photos and positive affirmations & (dark humor). Weekend commute can be altered due to track work - show up early, organizer will be most likely be there. Please note that 1/3 of these people will pull a no-show. I know. it is a shame. But there will not be a waitlist.Events in New York, NYEvenings and Weekends in New York CitySee more eventsEvenings and Weekends in New York Citypublic groupSunday, March 2, 202510:15 AM to 1:15 PM ESTEvery 1st Sunday of the month until May 9, 2025Starbucks @ West 95th Street 2521 Broadway · New York, NYEvenings and Weekends in New York Citypublic groupSunday Upper Hudson West Side Greenway | Walk & Talk New & Native New Yorkers FREEAttend"
