full_description = '''Connection via Jenga (member hosted)Hosted ByKyle C.DetailsLooking to make real connections, not just acquaintances? If you're someone who's tired of the usual mixer vibe where you end up making small talk but not much else, or if you're new to the area and want to meet people who are also looking to build friendships, we’ve got something different for you. Join us for a unique outdoor social event in Alamo Square, where we'll combine the classic game of Jenga with conversation prompts from the Fast Friends procedure—scientifically­-backed questions designed to help people connect more deeply, quickly. Whether you’re a newcomer or just looking for a fresh way to meet others, this event is your chance to skip the awkward surface-level chats and dive into more meaningful conversations. Each block you pull will prompt you to share something personal, from your favorite memories to what you value most in friendships. This simple twist on a classic game will help you connect in a way that feels natural and fun. What to expect: - A relaxed, outdoor atmosphere where you can enjoy the park while getting to know people. - The opportunity to have real conversations that go beyond the usual "What do you do?". - Bring your own snacks and drinks (no alcohol, please) to make it a laid-back hangout! Please note: You’ll have the choice to share as much or as little as you feel comfortable with. The goal is to create a space for genuine connection, and while the prompts are designed to encourage vulnerability, there's no pressure. Attendance is also capped to keep the setting a bit more intimate. I will set up two tables with Jenga on the grass somewhere in Alamo Square. I will comment the exact location once the tables are set up. Come join us, meet new people, and break the ice in a fun, no-pressure way!Events in San Francisco, CAFun TimesHanging OutNew In TownYoung ProfessionalsSingles 20's-30's20 & 30-somethings friends & fun in SFSee more events20 & 30-somethings friends & fun in SFpublic groupSunday, March 2, 2025 at 2:00 PM to Sunday, March 2, 2025 at 4:00 PM PSTAlamo Square ParkAlamo Square Park · San Francisco, CA20 & 30-somethings friends & fun in SFpublic groupConnection via Jenga (member hosted)FREE25 spots leftAttend'''
