full_description = "Spacebridge: Let's send something to (near) space!Hosted ByElan and 2 othersDetailsSpace is awesome but why should NASA Ames get all the fun? San Francisco deserves another space program. To this end Noisebridge is stepping up to the challenge and reviving the Spacebridge program!! All are welcome - from fledgling space enthusiasts to seasoned astronauts! This will be a cross-disciplinary project-based learning experience involving: electronics, software, radio operation, fabrics, treasure hunting (downed weather balloons are considered salvage), and more! We are gearing up for our third high altitude balloon launch in early March! This time, we are planning to collaborate with another Bay Area high altitude ballooning group to create a temporary balloon-based radio mesh network across the San Francisco bay. To prepare we need to: Upgrade our lift gas fill system Test our environmental sensors and GPS Update our Meshtastic configuration settings Other short-term goals: Upgrade our ground system to automatically aim at the balloon Test the aerodynamic behavior of various payload configurations with/without a parachute Design a remotely-triggered flight termination system If any of that sounds fun, come on over and give us a hand. If you have a different idea, or you just want to hang out and chat about space/balloons, that's alright too!Events in San Francisco, CAElectronics3D PrintingComputer ProgrammingSpace ExplorationAerospaceNoisebridge HackerspaceSee more eventsNoisebridge Hackerspacepublic groupSunday, March 2, 20254:00 PM to 7:00 PM PSTEvery week on Sunday until August 8, 2025Noisebridge272 Capp St, Noisebridge · San Francisco, CANoisebridge Hackerspacepublic groupSpacebridge: Let's send something to (near) space!FREEAttend"
