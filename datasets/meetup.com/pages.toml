full_description = "Miami Tech + Startups Social in BrickellHosted ByGozelDetails🎤 Special Guest Speaker: Olivia Gaudree, Partner and VP Operations, Fuel Venture Capital. ​Connect with Startup Founders, Investors, and Tech Professionals. Don’t miss your chance to meet Olivia and other key players in the Miami Tech Startup scene! ​Get ready for a night of ideas, inspiration, and plenty of socializing. We host Tech Socials in a fun and welcoming social atmosphere. ​​​​ ​About our Guest Speaker: ​ ![img]([https://images.lumacdn.com/cdn-cgi/image/format=auto](https://images.lumacdn.com/cdn-cgi/image/format=auto),fit=cover,dpr=2,quality=75,width=800,height=597.8567399887197/editor-images/yi/[0dc7787f-b698-40f1-a128-c3a15afab8e1.jpg](0dc7787f-b698-40f1-a128-c3a15afab8e1.jpg)) ​Olivia Gaudree is a partner at Fuel Venture Capital and Vice President of Operations. As VP of Operations, Olivia is responsible for planning, directing, coordinating, and overseeing operations at Fuel VC to meet current and future needs of the company. Olivia works closely with the General Partners to support the goal setting and performance management processes for the firm, align initiatives to those goals, and drive the successful execution of cross-functional programs. Additionally, she oversees the growth metrics of Fuel Venture Capital investments and allocations. ​ Prior to stepping into an operational role,Oliviawas responsible for assessing and analyzing investment opportunities that flow through the deal screening process, assisting in the detailed analysis conducted on prospective companies. Before joining Fuel Venture Capital in 2018,Oliviainterned at Thomson Reuters’s New York City office in the firm’s Financial and Risk Division. She also worked at boutique hedge fund Blue Shores Capital as an equity Research intern, performing directed equity research projects. That environment, along with her prior internships, helped to guide her toward venture capital. She was recognized as one of the Top Innovators Under 25 by the South Florida Business Journal. Olivia graduated from Florida State University with a bachelors of science in finance. ​About the Tech + Startups Community: ​​​Launched in 2023, we are a community of 10,000+ Startup Founders, Tech Professionals, and Investors. We are active in 21 cities in 6 countries including NYC, Miami, Zurich, London, Dubai, Bogota, Boston, DC, Atlanta, Chicago, LA and SF. ​We are hosting the Tech + Startups Community Conference at Miami Dade College - Wolfson Campus in Downtown Miami on May 1, 2025. Join 500+ Startup Founders, Investors, Tech Professionals. ![img]([https://images.lumacdn.com/cdn-cgi/image/format=auto](https://images.lumacdn.com/cdn-cgi/image/format=auto),fit=cover,dpr=2,quality=75,width=800,height=800/editor-images/ci/[cd04dde7-6744-48b4-a101-0b4c987fdadd.jpg](cd04dde7-6744-48b4-a101-0b4c987fdadd.jpg)) ​Learn more about the Upcoming Conference: [https://www.techandstartups.com/community-conference-miami​](https://www.techandstartups.com/community-conference-miami) ​​ ​Recent podcast with Denis Hiller, our Founder & CEO : From $295M Exit to Building the Future ​​Join us for an electric and exciting evening of Founders, Tech Professionals, and Investors. Let's share ideas. ​​Details: ​​Tech, Drinks, and Startups in Miami. Our goal is to be a catalyst, a way for you to meet fun and interesting people in Miami's Tech Scene. ​​​​This group may fit if you: ​​​​​​Work In Tech or Tech Startups ​​​​​​Looking for Co-Founders, pitch an idea or MVP, funds, launch or to hire and scale ​​​​​​An Angel Investor ​​​​​​A Venture Capitalist ​​​​​​Work in Academia ​​​​​​Service provider to the tech industry ​​​​​​Love AI, SaaS, Fintech, Web3 Location AlmaRosa Restaurant & Lounge 1250 S Miami Ave, Miami, FL 33130, USAEvents in Miami, FLInformation TechnologyTechnologyInternet StartupsTechnology ProfessionalsTechnology StartupsMiami Tech & Startup SocialSee more eventsMiami Tech & Startup Socialpublic groupTuesday