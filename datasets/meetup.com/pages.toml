["https://meetup.com/modernistfiction"]
title = "Modernist Fiction, Its Origins and Beyond... and other stuff | Meetup"
description = '''
This group started in May 2011, and we've read novels by Joyce, Malraux, Kafka, Wright, Mishima, Faulkner, Nabokov, Unamuno, Ellison, Hamsun, Woolf, Biely, Gide, and many others.  We try to have a good time discussing the books without descending to small talk, think critically without descending to pedantry, etc.
Also, as the title shows, we've expanded our reading list since the group started.  We don't really want to title the group something as vague as "Chicago Literature Group," etc., and modernist fiction and poetry still make up most of the reading list.  But if some group members are excited about reading something else, be it Goethe or Ovid, Wallace or Perec, we're interested in that too.  Feel free to make suggestions.'''
full_description = '''Modernist Fiction, Its Origins and Beyond... and other stuffChicago, IL, US3,041 members · Public groupOrganized by Erik Christianson and 18 othersShare:Join this groupAboutEventsMembersPhotosDiscussionsMoreJoin this groupWhat we’re aboutThis group started in May 2011, and we've read novels by Joyce, Malraux, Kafka, Wright, Mishima, Faulkner, Nabokov, Unamuno, Ellison, Hamsun, Woolf, Biely, Gide, and many others. We try to have a good time discussing the books without descending to small talk, think critically without descending to pedantry, etc. Also, as the title shows, we've expanded our reading list since the group started. We don't really want to title the group something as vague as "Chicago Literature Group," etc., and modernist fiction and poetry still make up most of the reading list. But if some group members are excited about reading something else, be it Goethe or Ovid, Wallace or Perec, we're interested in that too. Feel free to make suggestions.Featured eventMon, Mar 17, 2025, 12:00 AM UTCThomas Pynchon's Gravity's Rainbow Part 1: Beyond the Zero Episodes 1-10Link visible for attendeesPlease join us for a 10 part discussion and read through of Thomas Pynchon's 1973 postmodernist masterpiece Gravity's Rainbow. “A screaming comes across the sky. It has happened before, but there is nothing to compare it to now.” Gravity's Rainbow is a 1973 novel by the American writer Thomas Pynchon. The narrative is set primarily in Europe at the end of World War II, and centers on the design, production and dispatch of V-2 rockets by the German military. In particular, it features the quest undertaken by several characters to uncover the secret of a mysterious device named the "Schwarzgerät" ("black device"), slated to be installed in a rocket with the serial number "00000". Time named Gravity's Rainbow one of its "All-Time 100 Greatest Novels", a list of the best English-language novels from 1923 to 2005 and it is considered by many critics to be one of the greatest American novels ever written. The plot of the novel is complex, containing over 400 characters and involving many different threads of narrative which intersect and weave around one another. The recurring themes throughout the plot are the V-2 rocket, interplay between free will and Calvinistic predestination, breaking the cycle of nature, behavioral psychology, sexuality, paranoia and conspiracy theories such as the Phoebus cartel and the Illuminati. Gravity's Rainbow also draws heavily on themes that Pynchon had probably encountered at his work as a technical writer for Boeing, where he edited a support newsletter for the Bomarc Missile Program support unit. The Boeing archives are known to house a vast library of historical V-2 rocket documents, which were probably accessible to Pynchon. The novel is narrated by many distinct voices, a technique further developed in Pynchon's much later novel Against the Day. The style and tone of the voices vary widely: Some narrate the plot in a highly informal tone, some are more self-referential, and some might even break the fourth wall. Some voices narrate in drastically different formats, ranging from movie-script format to stream of consciousness prose. The narrative contains numerous descriptions of illicit sexual encounters and drug use by the main characters and supporting cast, sandwiched between dense dialogues or reveries on historic, artistic, scientific, or philosophical subjects, interspersed with whimsical nonsense-poems and allusions to obscure facets of 1940s pop culture. Many of the recurring themes will be familiar to experienced Pynchon readers, including the singing of silly songs, recurring appearances of kazoos, and extensive discussion of paranoia. According to Richard Locke, megalomaniac paranoia is the "operative emotion" behind the novel, and an increasingly central motivator for the many main characters. In many cases, this paranoia proves to be vindicated, as the many plots of the novel become increasingly interconnected, revolving around the identity and purpose of the elusive 00000 Rocket and Schwarzgerät. Please read up to page 71 in the 1973 760 page edition, or page 72 in the 2006 Penguin Deluxe Classics Paperback starting from Episode 1 to Episode 10. 1973 760 page edition Amazon Purchase Link: https://www.amazon.com/Gravitys-Rainbow-Classic-20th-Century-Penguin/dp/0140188592 776 page Penguin Deluxe Edition Amazon Purchase Link: https://www.amazon.com/Gravitys-Rainbow-Penguin-Classics-Deluxe/dp/0143039946 Annotations Amazon Purchase Link: https://www.amazon.com/Gravitys-Rainbow-Companion-Contexts-Pynchons/dp/082032807319 attendees+14AttendUpcoming events (4+)See allSun, Mar 2, 2025, 7:00 PM UTCChinese Literature Seminar: Plum in the Golden Vase Chapters 1-5Link visible for attendeesWe will begin a Chinese Literature Seminar starting in March 2023 to December 2025 where we will read the Six Classical Chinese Novels along with the 120 Short Stories of the San Yan. The Six Classical Novels of Chinese Literature consisting of Romance of the Three Kingdoms, Water Margin, Journey to the West, Dream of the Red Chamber, the Scholars, and the Plum in the Golden Vase are widely considered among the greatest and longest novels ever written. In this fourth part of this new series, we will now try to read the Plum in the Golden Vase. Written in the late 16th Century and first published sometime between December 28, 1617 and January 25, 1618 by an anonymous author only known by his pseudonym Lanling Xiaoxiao Sheng or the Scoffing Scholar of Lanling. The Scoffing Scholar of Lanling was a literary genius, but also a dirty minded $&@#£¥. As David Tod Roy says in his introduction: "The work is a landmark in the development of narrative art, not only from a specifically Chinese perspective, but in a world-historical context... Although its importance in the history of Chinese fiction has long been acknowledged, the comprehensiveness and seriousness of its indictment of the Chinese society of its time and the innovative quality of its experimental literary technique have not yet been adequately appreciated." Review from Goodreads: "David Tod Roy's translation of the 金瓶梅 into English is the culmination of some two decades of work, with the fruit of his efforts being the first truly complete English edition of the work. This new edition, however, attempts to translate everything. This includes the poetry and puns, of course, with Chinese puns being notoriously difficult to translate. But further on, there are references to ancient Chinese astrology, medicine, religious texts, imperial succession, makeup, foodstuffs, architecture, and folklore. He follows the novel's rapid vacillations in tone, moving from Tang poetry to vulgar cursing in the space of sentences. Even ordinary couplets or seemingly ordinary turns of phrase are annotated, leaving the entire book an exercise in the thickets of intertextuality, the book itself composed of fragments of other works. Is it one of the six great novels? I'm not sure - I can't say. Who can read it? I doubt even a specialized Chinese reader would be able to understand all of these references. Maybe a group effort might be enough. Or an abridged version, but that would ruin the symmetry of the structure. There is precious little like it." The novel consists of 100 chapters over 2492 pages that focuses on the life of the main character Hsi-men Ch'ing, who is a corrupt merchant with a harem of six wives and concubines. The erotic realism for which the novel is so notorious, turns out on closer inspection to be a powerful metaphor and condemnation of the government corruption of the ruling Ming dynasty and a parable against human sexual excess which continues onto this day. Please read the Introduction and Chapters 1-5. Volume 1: https://www.amazon.com/gp/offer-listing/0691016143/ref=dp_olp_new?ie=UTF8&condition=new Volume 2: https://www.amazon.com/gp/offer-listing/0691126194/ref=sr_1_3_olp?ie=UTF8&qid=1519612792&sr=8-3&keywords=plum+in+the+golden+vase Volume 3: https://www.amazon.com/gp/offer-listing/0691150184/ref=sr_1_5_olp?ie=UTF8&qid=1519612792&sr=8-5&keywords=plum+in+the+golden+vase Volume 4: https://www.amazon.com/gp/offer-listing/0691169829/ref=sr_1_2_olp?ie=UTF8&qid=1519612792&sr=8-2&keywords=plum+in+the+golden+vase Volume 5: https://www.amazon.com/gp/offer-listing/0691169837/ref=sr_1_4_olp?ie=UTF8&qid=1519612792&sr=8-4&keywords=plum+in+the+golden+vase12 attendees+7AttendMon, Mar 3, 2025, 1:00 AM UTCGeorge Steiner's Tolstoy or Dostoevsky Part 4Link visible for attendeesPlease join us for a discussion and read through of George Steiner's classic study Tolstoy or Dostoevsky. Please read Chapter 4 for this Meetup. George Steiner's Tolstoy or Dostoevsky has become a classic among scholars of Russian literature. An essay in poetic and philosophic criticism that bears mainly on the Russian masters, Tolstoy or Dostoevsky deals also with larger themes: the epic tradition extending from Homer to Tolstoy; the continuity of a "tragic world view" from Oedipus Rex to King Lear and The Brothers Karamazov; the contrasts between the epic and dramatic modes, between irreconcilably opposed views of God and of history. Amazon Purchase Link: https://www.amazon.com/Tolstoy-Dostoevsky-Essay-Criticism-Second/dp/030006917014 attendees+9AttendTue, Mar 4, 2025, 1:00 AM UTCAnton Chekhov Seminar Session 41Link visible for attendeesPlease join us for a complete read through over the next several months of a complete set of 201 short stories by Anton Chekhov continuing with Stories 176-178: The Head Gardener's Story, Three Years, and The Helpmate. Online Text Link: https://www.ibiblio.org/eldritch/ac/jr/7 attendees+2AttendTue, Mar 4, 2025, 1:30 AM UTCThe Faulkner Group: Light in AugustLink visible for attendeesHey all! Come join us as we go through the work of this Modernist giant, William Faulkner! We will follow the chronology of his publication, now onto The short stories. This will be a discussion group, so make sure to do the reading beforehand and come with questions! We will stick closely to the text, and try to understand what Faulkner is showing us and telling us through his words. Try to get the vintage edition, so we can all stay on the same page. See schedule below: Light in August M7: Ch 1-2 M8: 3-4 M9: 5-7 M10: 8-10 M11: 11-12 M12: 13-15 M13: 16-18 M14: 19-end Absalom! Absalom! M15: 3-69 M16: 70-140 M17: 141-234 M18: 235-end M19: Barn Burning The Wild Palms The Tall Men The Bear Go Down, Moses10 attendees+5AttendPast events (1235)See allSun, Mar 2, 2025, 1:00 AM UTCJane Austen 250: Sense and Sensibility Part 2 Chapters 14-26This event has passed10 attendees+5OrganizersErik Christianson and 18 othersMessageMembers (3,041)See allPRYGroup linksRelated topicsReadingSocialWritingLiteratureBook ClubFictionPhilosophy'''
