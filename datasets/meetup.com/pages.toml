full_description = '''Bring Your Own Manga Book Club @ Ipsento 606 (Bucktown)Hosted ByKG and Nikhil S.Detailshi - bring what you've been reading whether it's manga, light novels, manhwa, and more. hope to talk about what we've been reading, exchange recommendations, and more. just show up :D organizers will decide on what to do if not adequate seating (colectivo logan square has 2 stories / is a stop away on blue line) this will be a reoccurring monthly event, where we will be trying out new coffee shops, and venues while talking about anime. --- The word “ipsento” is the combination of two latin roots, ipse meaning "self", and sentio meaning "to discover". We believe that self-discovery happens through experience, whether it be traveling the world in search of the finest coffees, splitting a mini-donut with your little one or meeting for your first coffee with “the one”. That’s why our mission is to engage people with an immensely satisfying experience. ​ The craft of coffee brewing runs in our cores. At ipsento care deeply about the quality and taste of each cup. We are proud to be involved in the whole coffee making process — from picking the best beans to roasting and bringing out the unique flavors and aromas. We can’t wait to welcome you for a comforting cup of coffee. ~~~ we hope to see you there!Events in Chicago , ILAnimeCosplayAnime & MangaComic BooksSci-Fi/FantasyChicago Anime HangoutsSee more eventsChicago Anime Hangoutspublic groupSunday, March 2, 20251:00 PM to 4:00 PM CSTIpsento 6061813 N Milwaukee Ave, Chicago, IL 60647 · Chicago , ilChicago Anime Hangoutspublic groupBring Your Own Manga Book Club @ Ipsento 606 (Bucktown)FREEAttend'''
