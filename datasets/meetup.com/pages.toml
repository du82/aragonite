description = """
Welcome to the Chicago Black People Meet Up! This group is for Black individuals in the Chicagoland area or those traveling into town, who are looking to connect with others who share similar interests. Whether you're into music, food, fitness, or just looking for new friends, this is the place for you.  Join us for exciting events, stimulating discussions, and the opportunity to make new friends. Join us for a variety of activities and events where you can meet new people, have fun, and build a strong community. Let's come together to celebrate our culture and build lasting friendships!
Together we can build a strong community of black professionals, creatives, and all-around awesome people in the Windy City. I can’t wait to meet you all!"""
full_description = "Chicago Black People Meet UpChicago, IL, US441 members · Public groupOrganized by Tyrone K. Murphy and 1 otherShare:Join this groupAboutEventsMembersPhotosDiscussionsMoreJoin this groupWhat we’re aboutWelcome to the Chicago Black People Meet Up! This group is for Black individuals in the Chicagoland area or those traveling into town, who are looking to connect with others who share similar interests. Whether you're into music, food, fitness, or just looking for new friends, this is the place for you. Join us for exciting events, stimulating discussions, and the opportunity to make new friends. Join us for a variety of activities and events where you can meet new people, have fun, and build a strong community. Let's come together to celebrate our culture and build lasting friendships! Together we can build a strong community of black professionals, creatives, and all-around awesome people in the Windy City. I can’t wait to meet you all!Upcoming events (4+)See allSun, Mar 2, 2025, 12:00 PM CSTMimosa or Michelada? Mexican Brunch at La LunaLa Luna, Chicago, ILI'm telling you...I'm telling you! I've been here over 5+ times, I'll go for dinner and run it back for brunch in the morning. Come for the food and stay for the mimosa, michelada or tequila...(we listen and we don't judge, mkay). This place is located in Pilsen, street parking is very limited. I advise you to arrive 20 min early to park. Trust me on this. Seating is maxed out at 8, so please only RSVP if you plan on attending. Join the waitlist in case seats open up. You are responsible for your own tab, taxes and gratuity. If you have any questions, feel free to leave a comment or send me a DM.8 attendees+3AttendSat, Mar 8, 2025, 8:00 PM CSTWe Always Bounce Black: A Black Excellence Comedy RevueThe Second City, Chicago, ILHey guys, I had the pleasure is seeing their first show of the year! I believe you guys will enjoy it as well. This is an ALL-black cast. You will see sketches, songs, comedy and so much more. The show is about 2 hours long with a 15-minute intermission They have a humble food menu and a full bar I recommend you arrive 15 to 30 minutes early so you can park, find the place, and so we can walk in together. Enter on Wells Street. Tickets is about $49 They have a parking garage. There is also street parking. If you require wheelchair assistance, you will be helped. Please DM me for any questions or concerns. Afterwards, there is a restaurant on the 2nd floor of this building. We can hang there afterwards7 attendees+2AttendThu, Mar 13, 2025, 6:30 PM CDTComedy Show at the Laugh FactoryLaugh Factory, Chicago, ILAt this point, I need to laugh to keep from crying... so let's head to the Laugh Factory! I scored us some free tickets and a section, so let's show up and show out! You will need a ticket to attend which you can get at the link below, use code: MEETUP for your free tickets. Be sure to RSVP so I can get a head count for our seating. 21 attendees+16AttendSat, Mar 15, 2025, 8:00 PM CDTSushiDOKKU BOOZE BOX SpeakeasyBooze Box, Chicago, ILBest Maki Rolls I've ever had... do I need to say more? I've eaten in their main dining room, but let's head back to their hidden speakeasy to enjoy some sushi, sake and their DJ. Sushi Dokku’s menu consists of Chef dressed Nigiri Bites, Maki Rolls & Japanese Small Plates. Booze Box offers one of the best selections of Sake and Japanese Whisky in the city. RSVP only if you plan on coming. The reservation allows up to 5 people to come. For parties of 6+ there is a $25 deposit, per person and the max is 8 people. If more than 5 people would like to come, I will add an event fee for $25. Your deposit secures your reservation and will be applied to your final bill. The money goes directly to the venue and is non-refundable, if you are a no show. (Their policy, not mine.) You are responsible for your own tab, taxes and gratuity. I will close the RSVP 2 weeks prior to the meetup date, to finalize the reservation. If you have any questions, feel free to leave a comment or send me a DM.8 attendees+3AttendPast events (42)See allFri, Feb 28, 2025, 7:30 PM CSTSOFAR SOUNDS: Live Music at the MuseumThis event has passed9 attendees+4OrganizersTyrone K. Murphy and 1 otherMessageMembers (441)See allAGroup linksRelated topicsCouplesBlack ExpressionsSingle ProfessionalsEating & DrinkingDrinking GamesCouples Meeting Other CouplesBlack CouplesFoodieBlackologyYoung Professional SinglesSocial DrinkingBlack ProfessionalsYoung Entrepreneur"
