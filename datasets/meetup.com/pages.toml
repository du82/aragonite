radual. You'll enjoy great views of the Russian Ridge area, the Stanford Dish, and the Bay; on a clear day, you might even be able to see the SF skyline. AllTrails info: N46 attendees+41AttendWed, Mar 12, 2025, 5:00 PM PDT[After work hike] Rancho San Antonio Open Space PreserveRancho San Antonio Open Space Preserve, Los Altos, CAShort after-work hike with gradual inclines, nice tree cover, and great bay views. If there's interest, we'll consider repeating this event once or twice a month. AllTrails link: https://www.alltrails.com/trail/us/california/pge-wildcat-high-meadow-and-lower-meadow-trail-loop Length: 5.3 miles Elevation gain: 921 ft N20 attendees+15AttendSat, Mar 15, 2025, 9:00 AM PDT[Scenic Moderate hike] Miwok and Coastal Trail LoopTennessee Valley Parking Lot, Mill Valley, CADescription: Hike in the Marin Headlands with incredible coastal views! This is a moderate hike, but there are a couple of steep inclines, so be ready for a great workout! The trail is pretty exposed; sun protection is recommended. AllTrails info: 28 attendees+23AttendTue, Mar 25, 2025, 5:00 PM PDT[After work hike] Rancho San Antonio Open Space PreserveRancho San Antonio Open Space Preserve, Los Altos, CAShort after-work hike with gradual inclines, nice tree cover, and great bay views. If there's interest, we'll consider repeating this event once or twice a month. AllTrails link: https://www.alltrails.com/trail/us/california/pge-wildcat-high-meadow-and-lower-meadow-trail-loop Length: 5.3 miles Elevation gain: 921 ft Meeting place: Lot 6 (we'll meet near the restrooms area). Park in any lot and then head over to Lot 6. Note that the starting point is slightly different from from what's shown in AllTrails We'll meet at 5 PM and start the hike at 5:05 PM sharp. Latecomers will have to catch up on their own. LEGAL DISCLAIMER The hosts of Every Trail events are not hiking professionals; we have no wilderness expertise and we are not trained medical professionals. When you join this group, 