Chicago"""
full_description = '''Board Game Night in Fulton MarketHosted ByKatie and 2 othersDetailsHey there, Chicago Social Club! Join us for an unforgettable night of awesome board and card games with great food and cool people, all in the heart of the city! Chicago Loop Games is a team of board and card game fans who take what they love about game nights to the middle of the city one night every month. We pride ourselves on having games that bring maximum fun for everyone, but by all means, bring your favorites to share too! See our game library here: https://docs.google.com/spreadsheets/d/1W9ixUENzmtKQQwCNdx01MuNWaeGoJ4OjMjc5-MK5p0I/edit#gid=913707947 About Our Venue: This month, we'll be at Time Out Market in the Fulton Market neighborhood of Chicago, near the Morgan Green and Pink line CTA station. Time Out aims to take the already lush culinary landscape of Fulton Market to the next level, and "encompasses the best food, drinks and culture that Chicago has to offer." We highly encourage attendees to buy dinner here so we can continue to host events here in the future. We will likely settle in one of the dining areas upstairs and will post to this event page where we are once we are settled in. If there is any other information you should know about our venue, we will let you know as soon as we can. Check out our venue here: https://www.timeoutmarket.com/chicago/ We host this event in collaboration with multiple other groups on Meetup, so if you happen to see this event in more than one place, that's on purpose and please RSVP to only one of them. Chicago Loop Games is committed to creating a positive, inclusive environment for all attendees, regardless of our differences. By attending/participating in our event, you agree to abide by our group's code of conduct. You can read it here:[ https://docs.google.com/document/d/1sJovbngdLJLf17UQXhi7_Mdcmf1i10lZyMXQC0BxeM4/edit#heading=h.be8lm6ep9gte](https://docs.google.com/document/d/1sJovbngdLJLf17UQXhi7_Mdcmf1i10lZyMXQC0BxeM