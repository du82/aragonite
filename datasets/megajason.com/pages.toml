description = "To use Fastmail with Snipe-IT you’ll have to fill in the outgoing mail server settings in the Snipe-IT configuration file (probably called .env in the top-level directory of your Snipe-IT ins…"
full_description = "Use Fastmail with Snipe-IT By Jason Doolittle | January 7, 2020 1 Comment To use Fastmail with Snipe-IT you’ll have to fill in the outgoing mail server settings in the Snipe-IT configuration file (probably called .env in the top-level directory of your Snipe-IT installation). For the password, you’ll need to (and want to) generate an application specific password on the fastmail website. To generate the password, log into you fastmail account and do the following: Open the menu at the top left and click the settings icon (it looks like a gear). At the left, under account, click on “Password and Security.” In the middle at the bottom there will be a section called “App Passwords.” Click “Manage” at the right of this section to manage your app passwords. When you are in the App Passwords page, enter your fastmail account password at the top in order to make changes. Click the button labeled “New App Password.” Under “Name,” select “Custom” and give it a name like “snipeit” or something like that. Under “Access,” select “SMTP.” This means that the password you are about to generate can only be used to send mail and not to read or download mail. Click “Generate Password.” Record the password for use in the next section. Once you have the password, you can fill in the outgoing mail server settings in .env as follows: # -------------------------------------------- # REQUIRED: OUTGOING MAIL SERVER SETTINGS # -------------------------------------------- MAIL_DRIVER=smtp MAIL_HOST=smtp.fastmail.com MAIL_PORT=587 MAIL_USERNAME=your_fastmail_username MAIL_PASSWORD=your_fastmai_app_password MAIL_ENCRYPTION=TLS MAIL_FROM_ADDR=you@example.com MAIL_FROM_NAME='Snipe-IT' MAIL_REPLYTO_ADDR=you@example.com MAIL_REPLYTO_NAME='Snipe-IT' MAIL_BACKUP_NOTIFICATION_ADDRESS=you@example.com Fill in MAIL_FROM_ADDR, MAIL_REPLY_TO_ADDR and MAIL_BACKUP_NOTIFICATION_ADDRESS in whichever way makes sense for you. If you aren’t sure, you can probably just set them all to your email address. Share this:Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window) Related Category: Uncategorized"
