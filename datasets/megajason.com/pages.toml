title = "POE Injector for Samsung SLS-BU102 – Jason's Web Site"
description = "The Samsung SLS-BU102 is a 4G LTE network extender. I became responsible for some of these that are used in a business to improve Verizon mobile service. One of them was not working due to a damage…"
full_description = "POE Injector for Samsung SLS-BU102 By Jason Doolittle | August 31, 2021 0 Comment The Samsung SLS-BU102 is a 4G LTE network extender. I became responsible for some of these that are used in a business to improve Verizon mobile service. One of them was not working due to a damaged POE injector. The model of the damaged POE injector is no longer manufactured so I couldn’t just purchase a direct replacement. I contacted Verizon for a recommendation for a replacement injector. They were unable to provide any information and referred me to Samsung. Samsung referred me back to Verizon. Super helpful. The SLS-BU102 requires a passive POE injector that can supply at least 60W. It is (apparently) unable to negotiate with an 802.3 compliant injector to get the higher power that it needs. So, while it will run if you plug it into, say, an 802.3bt compliant device, it will not be stable because it (again, apparently) won’t tell the injector to upgrade to the 802.3bt power level. Ask me how I know this. Anyway, I ended up finding one that worked. It is the Phihong POE90U-560-R. Check Octopart to find a supplier: Phihong POE90U-560-R at Octopart. Other devices in the same product line should work fine, including the 60W versions. I only tried the 90W, but the original damaged one was 60W. In case these specific products aren’t available when you read this, you are looking for: A passive POE injector (so not 802.3-something something POE++ or whatever)At least 60WThe POE injector should output 56V DC on all 4 pairs.The DC voltage polarity should be positive (+) on wires 3, 6, 4, and 5 and negative (-) on wires 1, 2, 7, and 8. Share this:Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window) Related Category: Uncategorized Tags: Network Administration, POE, Samsung, SLS-BU102, Verizon"
