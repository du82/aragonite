full_description = "TSM Goups for Pandaria Crafted PVP Gear By Jason Doolittle | July 20, 2020 0 Comment These are the crafted PVP sets from Mists of Pandaria. They are cheap to craft, but the recipes are a pain to get so they can sell for many times the crafting cost on the AH. There is a set for each class (except Demon Hunters which weren’t around during MoP). These TSM groups don’t include all of the Crafted Dreadful or Crafted Malevolent items because some of them have duplicate appearances. For example there are 2 different paladin sets (a str set for prot and ret and an int set for holy…this was back when armor had only 1 primary stat, so you had to have different sets for different specs) but, since they both have the same appearance, we only need to include one of them for the purposes of selling them on the transmog market. An exception to this is the paladin chest. There is a dress/robe version and a tunic/chestplate version (there might be some other variations I haven’t noticed yet). Both are included in the groups Crafted Dreadful Gladiator’s Links to Wowhead: Death Knight: Dreadful Gladiator’s Dreadplate Armor Druid: Dreadful Gladiator’s Dragonhide Armor Hunter: Dreadful Gladiator’s Chain Armor Mage: Dreadful Gladiator’s Silk Armor Monk: Dreadful Gladiator’s Ironskin Armor (Recolor) Paladin: Dreadful Gladiator’s Scaled Armor Priest: Dreadful Gladiator’s Satin Armor Rogue: Dreadful Gladiator’s Leather Armor Shaman: Dreadful Gladiator’s Ringmail Armor Warlock: Dreadful Gladiator’s Felweave Armor Warrior: Dreadful Gladiator’s Plate Armor Here is the TSM string for the Crafted Dreadful sets (also includes cloaks): group:Crafted Dreadful`Cloaks,i:93420,i:93437,i:93607, group:Crafted Dreadful`Death Knight,i:93453,i:93454,i:93455,i:93456,i:93457,i:93543,i:93545,i:93547, group:Crafted Dreadful`Druid,i:93458,i:93459,i:93460,i:93461,i:93462,i:93465,i:93472,i:93473, group:Crafted Dreadful`Hunter,i:93489,i:93491,i:93493,i:93494,i:93495,i:93496,i:93497,i:93498, group:Crafted Dreadful`Mage,i:93428,i:93431,i:93435,i:93499,i:93500,i:93501,i:93502,i:93503, group:Crafted Dreadful`Monk,i:93504,i:93505,i:93506,i:93517,i:93519,i:93521,i:93523,i:93525, group:Crafted Dreadful`Paladin,i:93527,i:93532,i:93534,i:93537,i:93538,i:93539,i:93540,i:93541,i:93542, group:Crafted Dreadful`Priest,i:93430,i:93433,i:93436,i:93550,i:93551,i:93552,i:93553,i:93554, group:Crafted Dreadful`Rogue,i:93566,i:93567,i:93568,i:93569,i:93570,i:93571,i:93572,i:93573, group:Crafted Dreadful`Shaman,i:93575,i:93578,i:93584,i:93585,i:93586,i:93587,i:93588,i:93589, group:Crafted Dreadful`Warlock,i:93616,i:93617,i:93618,i:93619,i:93429,i:93432,i:93434,i:93615, group:Crafted Dreadful`Warrior,i:93544,i:93546,i:93548,i:93620,i:93621,i:93622,i:93623,i:93624 Crafted Malevolent Gladiator’s Links to Wowhead: Death Knight: Malevolent Gladiator’s Dreadplate Armor Druid: Malevolent Gladiator’s Dragonhide Armor Hunter: Malevolent Gladiator’s Chain Armor Mage: Malevolent Gladiator’s Silk Armor Monk: Malevolent Gladiator’s Ironskin Armor Paladin: Malevolent Gladiator’s Scaled Armor Priest: Malevolent Gladiator’s Satin Armor Rogue: Malevolent Gladiator’s Leather Armor Shaman: Malevolent Gladiator’s Ringmail Armor Warlock: Malevolent Gladiator’s Felweave Armor Warrior: Malevolent Gladiator’s Plate Armor Here is the TSM string for the Crafted Malevolent sets (also includes cloaks and shields): group:Crafted Malevolent`Cloaks,i:98756,i:98772,i:98913, group:Crafted Malevolent`Death Knight,i:98784,i:98785,i:98786,i:98787,i:98788,i:98859,i:98861,i:98863, group:Crafted Malevolent`Druid,i:98789,i:98790,i:98791,i:98792,i:98793,i:98796,i:98802,i:98803, group:Crafted Malevolent`Hunter,i:98815,i:98817,i:98819,i:98820,i:98821,i:98822,i:98823,i:98824, group:Crafted Malevolent`Mage,i:98763,i:98766,i:98770,i:98825,i:98826,i:98827,i:98828,i:98829, group:Crafted Malevolent`Monk,i:98830,i:98831,i:98832,i:98838,i:98839,i:98840,i:98841,i:98842, group:Crafted Malevolent`Paladin,i:98843,i:98848,i:98850,