["https://www.megajason.com/2019/02/09/three-broomsticks-etched-glass-mugs-harry-potter-inspired"]
title = "Three Broomsticks Etched Glass Mugs – Harry Potter Inspired – Jason's Web Site"
description = "Video Supplies This section contains affiliate links which means I’ll get a small referral fee (at no additional cost to you) if you buy something after following the link (More information).…"
full_description = "Three Broomsticks Etched Glass Mugs – Harry Potter Inspired By Jason Doolittle | February 9, 2019 0 Comment Video Supplies This section contains affiliate links which means I’ll get a small referral fee (at no additional cost to you) if you buy something after following the link (More information). A glass, preferably with straight sides to make applying the mask easier (or possible). I used Irish coffee mugs from Crate and Barrel. Armour Etch glass etching cream (or similar). Something to act as a resist (the mask or stencil that covers the parts you don’t want etched) for the etchant. I’m using adhesive vinyl cut on a Cricut Maker. There are other options. I also used some masking tape to cover the rest of the mug. Something to apply the etching cream. I used popsicle sticks and cotton swabs. Some people like to use a brush. Goggles and Gloves (I like the orange ones but they have other colors) A well-ventilated work area. Sorry I don’t have a link to that, but this fan might help. Three Broomsticks Logo I searched the Internet for a Three Broomsticks design that would work for this, but I didn’t find anything suitable. I used what I found as inspiration to make my own…which is right here. Steps This project is pretty straightforward: Prepare the resist (the mask or stencil). Apply the mask to the mug. The Irish coffee mug (at least all the ones I have seen) has an obvious seam. I sized my vinyl mask so that if I lined up the edge of the vinyl with the seam, the design would end up right where I wanted it. Notice that the etching cream contains dangerous chemicals. Put on your goggles and gloves and make sure your work area is well ventilated. Apply the etching cream to the mug. I used the popsicle sticks to scoop the cream out of the bottle and spread it over the mug. Then I used the cotton swabs to push the etchant around to make sure I every corner and edge of the design was covered. Let the etching cream sit for 10 minutes (less time might work fine, but 10 minutes worked for me). Move the etching cream around (with your cotton swab or brush) a few times during the etch, making sure to push the cream in all directions and into every corner and edge of the design. Rinse the cream off with lots of water. You’ll need to wipe over it with your (gloved) fingers to get it all off. Remove the mask from the mug and thoroughly clean the mug. Share this:Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window) Related Category: Uncategorized Tags: crafts, diy, Harry Potter"
