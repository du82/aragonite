title = "Use ddclient with multiple different dynamic DNS services – Jason's Web Site"
description = "Previously, I wrote about how to use ddclient with changeip.com.  Now, even though I had decided to make the change from DynDNS.com to changeip.com I wanted my DynDNS.com free domain names to remai…"
full_description = "Use ddclient with multiple different dynamic DNS services By Jason Doolittle | March 15, 2011 2 Comments Previously, I wrote about how to use ddclient with changeip.com. Now, even though I had decided to make the change from DynDNS.com to changeip.com I wanted my DynDNS.com free domain names to remain active for a transitional period, mostly because other people were using them. So, the question: how do I get one instance of ddclient to update 2 different dynamic dns services? Like this: #ddclient.conf #I left these at their defaults daemon=1200 # check every 20 min syslog=yes # log update msgs to syslog mail=root # mail all msgs to root mail-failure=root # mail failed update msgs to root pid=/var/run/ddclient.pid # record PID in file. #tell ddclient how to get your ip address use=web, web=ip.changeip.com #the login details for the first service (here DynDNS.com) protocol=dyndns2 # default protocol server=members.dyndns.org:8245 # default server (bypassing proxies) login=dyndnsUsername # default login password=dyndnsPass # default password #the domain name you want to update at the first service first.service.domain.name #login details for the second service (here changeip.com) protocol=dyndns2 server=nic.changeip.com # default server (bypassing proxies) login=changeipLogin # default login password=changeipPass # default password #the domain name you want to update at the second service second.service.domain.name This is kinda covered in ddclient’s documentation, but as with a lot of documentation, reading it doesn’t really lend much confidence until you already know how to use it. So anyway, this works. Share this:Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window) Related Category: Linux Tags: changeip.com, ddclient, Dynamic DNS, Linux"
