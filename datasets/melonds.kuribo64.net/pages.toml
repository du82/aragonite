["https://melonds.kuribo64.net/faq.php"]
title = "Howto/FAQ - melonDS"
full_description = "This page contains all the information you may need to get melonDS going. If you still need something, don't hesitate to ask on our forums! First of all, melonDS requires BIOS and firmware dumps from a DS or if you want to emulate the DSi, melonDS requires the BIOS, firmware and NAND image. We haven't gotten around to making alternate BIOS/firmware yet. So, you will need to obtain those: You can then configure the BIOS and Firmware by going to Emu Settings -> DS-mode and then navigate to the paths of each file. As of melonDS 0.9, melonDS can also emulate the DSi. To get the DSi BIOS, firmware and NAND image, you need these files: This is where you map keyboard and joystick input. To map a button, click it, then press the desired key or joystick button. You can press Escape to cancel the mapping process, leaving the previous mapping unchanged. Joystick mappings can also be cleared by pressing Backspace. As of 0.8.1, it is possible to map keys with modifiers (Ctrl+Z, Shift+Q, Ctrl+Alt+K...). Key mappings can also be cleared by pressing Backspace, just like for joystick mappings. And joystick mappings can have both a button/hat direction and axis assigned; mapping one type will leave the other mapping type intact (for example mapping a button leaves the axis mapping intact). Pressing Backspace clears both mappings. This functions the same as input config, but pertains to hotkeys, which are like special buttons controlling the emulator's features (for example, fullscreen, closing the lid, playing a microphone sample, ...). Use System -> Run with no ROM loaded. If you already had a ROM loaded, you can use System -> Stop to unload it. melonDS uses raw save files, which should be compatible with most other emulators. Note that melonDS determines the save memory type (and thus protocol) from the size of the save file, so it is important that the file be exactly the correct size. Since version 0.9.1 the easiest way to use a savefile from DeSmuME, DraStic or a flashcard is by using the Import savefile function found in melonDS. Otherwise you can either use the Export backup memory feature (for DeSmuME), or open the .dsv save file in a hex editor, remove excess bytes at the end until the size is a power of two, and save with a .sav extension."
