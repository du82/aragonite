["https://memcached.org/blog/extstore-cloud"]
title = "memcached - a distributed memory object caching system"
full_description = "For better or worse, a large use case for key/value stores in the cloud are session caches. These objects are ephemeral, frequently updated, largeish blobs of data associated with a user’s login session. The unstructured data and TimeToLive limitations make them a poor fit for a primary database. Web site owners will often set up a memcached instance just to handle sessions. We will focus on session data, however the instance could handle other data at the same time. Lets assume you have a website which has grown from a single droplet. You have a $20 per month instance with 3.5G of RAM dedicated to memcached (though we recommend you run with multiple, in case one fails!). You notice recently that users have been unable to stay logged in from day to day, and your DB usage is rising. For many session implementations, if the session objects goes away, the user is logged out or the DB suffers a large hit to regenerate it. Thus, it is important to keep sessions around for as long as they’re useful. Extstore requires keeping the key and metadata of an object in RAM, while pointing the value to storage. This is a poor fit for small objects. Session data can get quite large, so lets check first. With a quick check, we can see that most of the assigned memory is ending up in objects using 26k-42k of memory, with most of them at 32k. Keys and metadata in memcached can’t be more than 300 bytes even in extreme cases, so most of the space is the item value. A good (if contrived) fit for extstore! You can and should look over or graph the counters from stats items and stats slabs. In this case, we could find that slab class 26, 27 and 28 also have a high eviction count. We’re throwing sessions away early! Currently, we have 3.5G of RAM cache via a $20 droplet. As of writing, a $10 droplet comes with 2G of RAM, and 50G of SSD backed disk space. Lets try tripling the available cache space for half the cost. As extstore is still new, may have to build memcached yourself to enable it. This might not be necessary by the time you read this, so please check memcached -h to see if extstore is supported before manually building anything."
year_published = 2025
clearnet = "https://memcached.org/blog/extstore-cloud"
