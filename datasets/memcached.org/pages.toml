["https://memcached.org/blog/paper-review-memc3"]
title = "memcached - a distributed memory object caching system"
full_description = "Here we analyze one of the earlier papers which made significant performance and memory efficiency modifications to memcached. We focus on how the paper applies to real-world industry and what it provided at the time of original publication. The MemC3 Paper states it was presented in April 2013. Unusually, the paper also cites the specific version of memcached tested: 1.4.13. That version was released on February 2nd, 2012. A google citations search yields over 300 results, split among patents and papers. Publications as recent as 2019 and 2020 cite this paper, though often in lists of examples of similar systems or experiments. Since this was one of the early multithreaded optimization papers for memcached it is frequently compared to across many dozens of works. MemC3’s abstract claims to make algorithmic and engineering improvements to the original memcached, with a 30% reduction in memory for small objects and 3x network throughput. It achieves this with a novel cuckoo hash table and a version of the CLOCK algorithm to replace the doubly-linked LRU in memcached. We thus have two separate primary claims: A compact hash table which allows concurrent readers with a single concurrent writer. Improving thread scalability with less memory overhead than a chained hash table. Using a CLOCK algorithm to replace LRU locks and 16 bytes of LRU pointers with a single bit. Combined with the hash table atomics, they also remove the 16 bit reference counter from every object. Yes! The code is available online. Based on 1.4.13 yet modified from a tarball rather than a git clone. Most papers don’t specify what versions of or start arguments to the software they compare against, let alone provide working source code. We were able to build the software and test it. To fix a startup issue, we had to comment a single pthread CPU affinity line; which is fine since we didn’t end up testing performance. Simply put, the cuckoo hashing and CLOCK replacement seem to work as advertised; generally memory efficient while avoiding global locks."
year_published = 2025
