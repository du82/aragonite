title = "Seven Classics on War and Politics | Memorable Press"
full_description = "Home > Collections > Seven Classics on War and Politics Seven Classics on War and Politics Updated 28-Jun-2024 Contents New Modern Edition The Collection - Seven Classics Ebook Edition Paperback Edition Audiobook Edition Short URL to this page New Modern Edition Seven Classics on War and Politics - New Modern Edition A new translation by Jeff Mcneill Copyright © 2019 by Classics Press LLC Classics on War and Politics Series Ebook ISBN 978-1-938412-07-3 Print ISBN 978-1-938412-28-8 Audio ISBN 978-1-938412-46-2 The Seven Classics on War and Politics is a new edition of seven classic works of political and military science. These classics are already available in English editions, but in a format that is difficult to read and understand. Most of these are in English translations that are very old, or miss out on the fundamental insights. Many include a lot of excess commentary which is mostly unnecessary and unhelpful. Our editing process reduces the repetition and unnecessary commentary and cruft, and clarify what is essential and insightful in the works using modern English prose. This process is an abridgement: > [C]ondensing or reduction of a book or other creative work into a shorter form while maintaining the unity of the source. The goal of this project is to produce a collection of works with clear and modern English that showcases the timeless insights which these classics have within them. We also want to provide several different formats for these works, including: Ebook Paperback Audiobook The Collection - Seven Classics Volume Title Availability Origins Vol. 1 The Art of War by Sun Tzu, 3rd Edition published in the USA 2019-10-15 Original work in ancient Chinese by Sun Tzu (544–496 BCE), published in premodern China, 5th c. BCE Vol. 2 The Analects by Confucius published in the USA 2018-11-28 Original work in ancient Chinese by Confucius (551-479 BCE), published in premodern China, 5th c. BCE Vol. 3 The Arthashastra by Chanakya (Kautilya) published in the USA 2019-01-06 Original work in Sanskrit by Chanakya (Kautilya) (4th c. BCE), published in premodern India, 4th c. BCE Vol. 4 Meditations of Marcus Aurelius published in the USA 2019-01-20 Original work in Koine Greek by Marcus Aurelius (121-180 CE), published in premodern Italy, 180 CE Vol. 5 The Prince by Niccolo Machiavelli published in the USA 2019-04-14 Original work in Italian by Niccolo Machiavelli (1469-1527 CE), published in premodern Italy, 1532 Vol. 6 The Book of Five Rings by Miyamoto Musashi published in the USA 2019-04-14 Original work in Japanese by Miyamoto Musashi (1584-1645), published in premodern Japan, 1645 Vol. 7 Hagakure (Bushido) The Way of the Samurai by Yamamoto Tsunetomo published in the USA 2019-04-14 Original work in Japanese by Yamamoto Tsunetomo (1659-1719), published in premodern Japan, 1716 Vol. 8 Seven Classics on War and Politics published in the USA 2019-10-25 This is an international collection, with two books from China, one from India, two from Europe, and two from Japan. The books also span over 2,000 years of history. Some of these books are focused on war and military science (Art of War, Book of Five Rings, Hagakure), others are more self-reflective and develop an ethical philosophy (Analects, Meditations), and others still are focused more on politics and ruling (Arthashastra, The Prince). Each of these works provides a unique and historical perspective regarding these topics, and they complement each other in tracing deep insight into the nature of leadership, war, and politics. Ebook Edition Availability 25 October 2019 Paperback Edition Availability early November 2019 Audiobook Edition Availability January 2020 Short URL to this page memorablepress.com/war-and-politics 7 Classics on War and Politics was crowdfunded on Kickstarter."
