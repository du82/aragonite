["https://www.memrise.com/de/ueber-uns"]
title = "Über uns | Memrise"
full_description = "Memrise ist eine Sprachlern-App, mit der das Lernen das Gegenteil vom Lernen mit Lehrbüchern ist: Es macht Spaß und ist effektiv. Memrise wurde 2010 gegründet und ist bereits beachtlich gewachsen; über 50 Millionen Menschen in 189 Ländern lernen Sprachen mit uns, um sich zu verbessern und sich mit anderen Menschen und der Welt um sie herum zu vernetzen. Die Kurse bei Memrise haben etwas, das Lehrbücher nicht haben: Echte gesprochene Sprache. Unsere hausinternen Linguisten sind nicht nur Experten auf ihrem Gebiet, sondern auch mit Leidenschaft darum bemüht, dir die Sprache beizubringen, die sie selbst im Alltag sprechen. Um noch eins draufzusetzen, sind unsere Kurse vollgepackt mit Tausenden von Videos von Muttersprachlern, die ihre Muttersprache in ihren jeweiligen Heimatorten sprechen. So kannst du lernen, authentische Stimmen und Akzente zu verstehen, während du die Landschaften und Umgebungen siehst und ein Gespür für die Kultur bekommst. Memrise ist aus einer Mischung aus Technologie und Wissenschaft aufgebaut, die dein Gehirn anspornt. Das wiederholte Lesen endloser Listen mit Wörtern und Phrasen ist langweilig, und dein Gehirn weiß das. Wir wissen, dass dein Gehirn es lieber mag, Gerlerntes mithilfe vielfältiger Methoden und zu bestimmten Zeiten zu nutzen, da dies spannender und effektiver ist! Wer war in der Schule schon mal gelangweilt? Wir alle! Was eigentlich komisch ist, denn am besten lernt man, wenn man dabei so viel Spaß hat, dass man ganz aufmerksam ist. Diesen Test müssen alle unsere Inhalte bestehen, bevor sie in die App kommen und von Millionen Menschen gelernt werden. Entweder mit Spaß, oder gar nicht."
