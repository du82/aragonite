["https://www.memrise.com/blog/new-progress-tracking-for-language-learning"]
title = "Changes ahead: A smarter way to track your language learning progress"
description = "A new system to track your language learning progress. With a proficiency level framework and points-based system, it's easy to know where' you're at."
full_description = "Español (México) | Español (Europa) | Français | Deutsch | Português | Português Brasileiro |Italiano | 한국어 | 日本語 | Polski | हिन्दी | Norsk | Svenska | Dansk | Nederlands | Русский | Bahasa Indonesia | Türkçe | Tiếng Việt | العربية | 中文（简体） | 中文（繁體） | Previously, our home screen featured a weekly goal tracker suggesting you learn 35 words, watch 5 videos, and have 5 conversations with MemBot. While well-intentioned, many of you found this approach confusing and restrictive, and we heard your concerns about feeling lost and unsure about your progress. We’re redefining how progress is tracked to address this, grounding it firmly in Memrise’s language learning pedagogy. To truly speak a new language like a native, you need to: With this in mind, our new system introduces a proficiency-level framework and a point-based progression system: To read how many points each activity is awarded, and more detail on how levels and stages are defined, you can go here. When this update rolls out, we will convert all the hard work you’ve already put into Memrise into the new point system. You’ll start at a proficiency level that truly reflects your learning so far. We assure you that none of your previous efforts will be lost. Instead, they’ll be recognized and quantified to give you a jump start in our new system. We understand that some of you appreciated the structure of weekly goals. While these are being phased out, this new system will keep you motivated daily and weekly, offering a clearer and more flexible path to fluency. In addition to the new tracking system, we’re introducing two features designed to help you make better progress and have a clearer understanding of your learning journey: This significant change will be introduced in stages, starting with iOS users in early June, followed shortly by Android and web users. We’ll share specific dates as soon as we can! It will roll out first to all users who opted into the current Memrise app version. If you’re unsure if that’s you, or if you’re still in the older Memirse experience here’s what they look like:"
