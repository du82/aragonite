["https://www.memrise.com/blog/major-update-a-new-version-of-the-app-is-coming"]
title = "Major update: a new version of the app is coming!"
description = "TL;DR: If you have an older version of the Memrise app (see screenshots), you won’t want to miss this update."
full_description = 'Español (México) | Español (Europa) | Français | Deutsch | Português | Português Brasileiro |Italiano | 日本語 | Polski | Nederlands | Русский | Türkçe | Tiếng Việt | العربية | 中文（简体） | 中文（繁體） | By this September we will have moved all users from an older version of Memrise experience to our new and improved app design. This is the biggest update we’ve made to date. You’ll go from learning and reviewing with flashcards and isolated practice modes to a fully integrated approach that guides you through what you really need to do to be fluent in the language: learning vocabulary, understanding how the language is used in real life, and having the ability to talk and interact with native speakers. Things will look and work differently. Here you’ll find all the information about how the new design works, which features are being retired, which are new and any other questions you might have. Here are some quick answers to questions that we think will be top of mind for you. For more detailed information on each of them, keep scrolling through. Is the app free to use? Yes, the app is free to use! We’ve added a massive amount of new learning content, and most of it is available for free. Upgrading to Memrise Pro unlocks premium content and removes ads, providing an enhanced learning experience. When will this change happen? The move will start in August. We will keep you updated with specific dates and more detailed information via email. Please keep an eye on your inbox for further updates. Will I lose my progress? No, your progress will not be lost. However, the new app design includes an update to the way we track learning progress, as well as a new way of structuring all the content you learn, so things will look and feel different when you first use this version. Will all the features in the older version of the app still be there? While some features from the older app version will no longer exist in the same form, their core functionality will still be available. For instance, "Learn with Locals" videos can now be found within the Learn and Review sessions, and you can still practice your pronunciation with MemBot in the Conversations tab, instead of using the Pronunciation mode. For a summary of changes in features, scroll to the bottom of this post.'
