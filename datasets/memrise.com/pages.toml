["https://www.memrise.com/no"]
title = "Lær et språk. Memrise er autentisk, nyttig og tilpasset."
description = """
Prøv Memrise. Du får fremdrift i løpet av få minutter, og den har sine egne triks til å få deg til å memorere ord og forstå dem. De lokale videoene for uttale er også en vinner    @khouryrt"""
full_description = "Lær mer, raskere, med en læringsalgoritme utviklet med den aller beste forskningen på kognitiv vitenskap Prøv Memrise. Du får fremdrift i løpet av få minutter, og den har sine egne triks til å få deg til å memorere ord og forstå dem. De lokale videoene for uttale er også en vinner Memrise har vunnet hjertet mitt. Jeg har brukt denne appen en stund nå, og da jeg dro til Frankrike trodde de at jeg var en del av lokalbefolkningen, basert på uttalen Memrise lærte meg. Den beste appen for å lære nye språk. Denne appen er så undervurdert, jeg hadde aldri hørt om den i hele mitt liv før jeg lette på internett for å finne ut hvordan man enklere kan lære spansk, den er så mye bedre enn alle andre programmer. Jeg liker spesielt funksjonen lær med lokalbefolkningen! Jeg ble nylig introdusert for min kjærestes libanesiske familie, og jeg ønsket å gjøre et godt inntrykk. Jeg brukte denne appen i bare noen få minutter om dagen i en uke og lærte noen nøkkelfraser, for å få familiens velsignelse. Denne appen er kjærestevennlig og godkjent av mor! To år siden ble jeg grinete fordi jeg kun snakket ett språk. Så på bursdagen min begynte jeg å lære tysk via Memrise. Fortsatte hver dag i to år. I går fikk jeg en e-post fra en tysk venn, og jeg trengte ikke å rulle nedover til oversettelsen hans. Veldig stolt, faktisk. Ny i Japan. Det å flytte til et annet land er vanskelig, og endrer livet. Det er ekstremt vanskelig når en ønsker å lære mest mulig, og være en del av det landet. Så langt, ved å bruke denne appen, lærer jeg mer og får økt selvtillit, slik at jeg kan kommunisere med lokalbefolkningen. Jeg kommer til å vise denne appen til barna mine. Arigatou. Jeg ble aldri helt fortrolig med fransk på skolen, men etter én økt med Memrise, ble jeg hektet. Jeg elsker at jeg kan lytte til ordet eller frasen, uttalt av personer med fransk morsmål. Jeg er så imponert med fremdriften med prøveøktene at jeg abonnerte for tolv måneder og har bestemt meg for også å lære italiensk."
