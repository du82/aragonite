["https://www.memrise.com/blog/changes-to-memrise-update-from-our-ceo"]
title = "Changes to Memrise: update from our CEO"
description = "An update from Memrise CEO, Steve Toy, on the recent updates to our website and apps."
full_description = "I am Steve Toy, Memrise’s CEO. Ultimately, I am responsible for what happens here, both the good and the bad. I am dropping in to own up to the recent missteps I have made in communicating with all of you about the evolution of Memrise. Everyone here at Memrise and I listen to what you all have to say on this and many other channels. Clearly, I am not responding well enough to eliminate the confusion you are all experiencing. For that, I apologize. If I were to attempt to boil down all that we are doing here at Memrise into the fewest possible words, it might look something like this… If we don’t do this, we will continue depositing you all into real-world situations with an incredible vocabulary but no ability to actually use the words you have learned because you have had no chance to practice. Over the last 18-24 months, we have used a host of new AI technologies to create features that give you the ability to hear and use the words you are learning with, among other things, the integration of YouTube videos and LLM-driven chatbots that can talk with you 24/7 without a lick of human judgment and infinite patience. We also rely on real-time advanced AI services, which makes offline mode for many of our features impossible. This 👆 is where the fork in the road has occurred. This is the root cause of the pain you are all dealing with. I have failed to explain to you and all of our users that we cannot deliver these next-generation language learning technologies while maintaining tens of thousands of dictionaries. Your progress in Memrise Official courses will make the transition to the new experience, though it will be visualized very differently. While here, I want to give you more info about the immediate issue, where the app tossed you into our new experience and then let you back into the legacy experience. This happened because we started a migration process and then stopped it because of the confusion it was causing. We are listening to you all and the pain that this is causing. We are not ignoring you, though it might seem like it now. We want to do everything we can to ease that pain."
