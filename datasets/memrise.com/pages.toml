full_description = "Diese Cookie-Richtlinie („Richtlinie“) erläutert die Cookies und andere Technologien, die Memrise Limited („Memrise“) auf seinen Webseiten https://www.memrise.com und https://decks.memrise.com (die „Website”) einsetzt, sowie Ihre Optionen. Diese Richtlinie ist Bestandteil unserer Datenschutzrichtlinie.Bei Ihrem ersten Aufruf unserer Website werden Sie aufgefordert, unserer Verwendung von Cookies und anderen Technologien gemäß dieser Richtlinie zuzustimmen, und wenn Sie damit einverstanden sind, werden diese auf Ihrem Computer gespeichert. Ein „Cookie“ ist eine kleine Informationsdatei, die von Internetseiten, die Sie besuchen, an Ihren Browser gesendet wird. Die Website verwendet Cookies und andere Technologien, um in Übereinstimmung mit unserer Datenschutzrichtlinie für Sie die Nutzung unsere Dienste bei zukünftigen Besuchen zu erleichtern, den Verkehr auf unserer Website zu überwachen und Lehrinhalte auf Sie anzupassen.Einige Cookies verfallen nach Ablauf einer bestimmten Zeit oder beim Logout (Sitzungscookie), andere verbleiben einen längeren Zeitraum auf Ihrem Computer oder Ihrem Endgerät (permanente Cookies). Die Website verwendet Erstanbieter-Cookies (Cookies, die direkt von Memrise platziert werden) sowie Drittanbieter-Cookies wie nachstehend erläutert. Art: Unbedingt erforderlichZweck: Um Nutzern die Dienste über unsere Website zur Verfügung zu stellen und um einige ihrer Funktionen, wie die Möglichkeit sich einzuloggen und den Zugang zu geschützten Bereichen, zu verwenden. Diese Cookies werden von Memrise bereitgestellt und sind für die Nutzung der Website notwendig. Ohne diese Cookies würden grundlegende Funktionen unserer Website nicht funktionieren. Abmeldung: Da diese Cookies für die Bereitstellung der Website und unserer Dienste unbedingt erforderlich sind, können Sie sie nicht ablehnen. Art: Analysen/LeistungZweck: Um das Verhalten der Nutzer auf unserer Website besser nachvollziehen zu können und um unsere Dienste entsprechend zu verbessern:Google Analytics. Um zu erfahren, wie Google über unsere Website gesammelte Daten verwendet, besuchen Sie https://policies.google.com/privacy/partners. Erfahren Sie mehr über den Verfall dieser Cookies: https://developers.google.com/analytics/devguides/collection/analyticsjs/cookie-usage.Segment. Um zu erfahren, wie Segment über unsere Website gesammelte Daten verwendet, besuchen Sie https://segment.com/docs/legal/privacy/.Abmeldung: Um zu verhindern, dass Google Analytics über unsere Website Daten sammelt, können Sie unter folgendem Link das Deaktivierungs-Add-on von Google Analytics für Ihren aktuellen Webbrowser verwenden: https://tools.google.com/dlpage/gaoptout.Sie können Segment-Cookies blockieren oder löschen, indem Sie die Browsereinstellung wie im Abschnitt „Ihre Optionen“ unten erläutert ändern."
