["https://www.memrise.com/pl"]
title = "Poznaj język obcy. Zacznij poznawać świat. | Memrise"
description = """
Świetna aplikacja. To od niej zacząłem naukę jęz. hiszpańskiego i kontynuuję do dziś. Bardzo gorąco polecam. Mnóstwo ciekawych słów i zwrotów bardzo przydatnych w dalszej nauce. Dziękuję!    Patryk W"""
full_description = "Ucz się więcej i szybciej z pomocą algorytmu nauki stworzonego z najlepszym wykorzystaniem kognitywistyki. Trenuj swoją pamięć długoterminową przy użyciu metody, która jest szybsza i lepsza od tradycyjnego uczenia się na pamięć. Nie trać czasu na zwroty, których tak naprawdę się nie używa. Poznaj język, którym faktycznie mówią ludzie. Eksploruj te tematy, które pasują do Twoich potrzeb: od wakacyjnych pogawędek aż po poznawanie rodziny partnera. Świetna aplikacja. To od niej zacząłem naukę jęz. hiszpańskiego i kontynuuję do dziś. Bardzo gorąco polecam. Mnóstwo ciekawych słów i zwrotów bardzo przydatnych w dalszej nauce. Dziękuję! Korzystam już od wielu lat! :) Dzięki tej aplikacji w większości nauczyłam się języka norweskiego (w wersji znam ang i chce się uczyć norweskiego), teraz w polskiej wersji uczę się hiszpańskiego. Najlepsza aplikacja, jaką miałam, przerobiłam dużo innych, ale wszystkie się chowają. Dla mnie bomba taka aplikacja, korzystam z niej już ponad rok i efekty są zauważalne, zarówno w posługiwaniu się językami, jak i w akcencie podczas mówienia. Bardzo fajna aplikacja. Myślę, że jedna z najlepszych, na jakiej się uczyłam. Uczę się z przyjemnością każdego dnia i rozwijam cztery podstawowe umiejętności. Polecam wszystkim. Świetna aplikacja, której używam od 3 lat. Zdecydowanie warta swojej ceny, po 2 intensywnych miesiącach do końca licencjatu praktycznie nie musiałem uczyć się francuskiego na zajęcia. Wspaniała aplikacja! Bogata i logicznie pogrupowana baza słówek, świetna opcja nagrań z wymową miejscowych, masa różnorodnych rodzajów ćwiczeń sprawia, że idealnie można dzięki niej szlifować język. Sama wykorzystałam Memrise do rosyjskiego i jestem zachwycona! Jest bardzo pomocna, co chwilę powtórzenia, wymowa, pisownia itd.☺ Jak na razie najlepsza aplikacja, jaką miałem 😉"
