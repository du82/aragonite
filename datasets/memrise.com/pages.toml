full_description = '''Memrise finds you thousands of authentic video lessons to learn Galician, featuring the exact words you’ve just learned. Memrise provides you with unlimited human-like conversation practice, to improve your Galician learning (powered by GPT-3). hbspt.cta._relativeUrls=true;hbspt.cta.load(6968579, 'bc1e8c88-2166-4701-9ec6-9eca362af8a5', {"useNewLoader":"true","region":"na1"}); hbspt.cta._relativeUrls=true;hbspt.cta.load(6968579, 'bc1e8c88-2166-4701-9ec6-9eca362af8a5', {"useNewLoader":"true","region":"na1"}); First, Memrise teaches you Galician words and phrases that you’re actually going to use in the real world. What’s more, you’ll see videos of native speakers using this vocab with their own pronunciation. Our lessons are fully personalised and based on your unique interests. Next, Memrise presents you with 1000s of immersive lessons using video content from YouTube, Tiktok and other sources, that suit your current level and interests. Research shows that by watching videos at just above your level, you maximise speed of learning. Finally, Memrise helps you practice speaking Galician with our unique AI language partner, MemBot. With MemBot, you can practice your spoken language skills anytime, anywhere, on-demand. Dive into a series of exciting conversations, games and missions. From one moment to the next, MemBot can play the role of a friendly barista in Tokyo or a friend organizing a party in Osaka! All our videos are filtered to match the words you’ve learned and throughout the product you’ll be supported with tools should you need a little extra help! To replicate that experience as much as possible, our content is taught through native speakers pronouncing the words you’re learning. What’s more, our Galician lessons are created by expert linguists who are up-to-date with modern day language. We use AI to recommend you this content, as well as to help you practice your speaking in a relaxed environment. The best way to build confidence before you do the real thing!'''
