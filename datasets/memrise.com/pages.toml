["https://www.memrise.com/id"]
title = "Belajar bahasa asing dengan Memrise. Percakapan harian, mudah dipakai."
description = """
Coba Memrise deh. Progres langsung kelihatan dan dia tuh ada trik unik yang bikin kamu bisa hafal kata dan paham maknanya. Video orang lokal apalagi deh chef kiss banget.     @khouryrt"""
full_description = "Belajar lebih banyak, lebih cepat, berkat algoritme belajar yang didasarkan pada ilmu kognitif terkemuka. Coba Memrise deh. Progres langsung kelihatan dan dia tuh ada trik unik yang bikin kamu bisa hafal kata dan paham maknanya. Video orang lokal apalagi deh chef kiss banget. Aku cinta banget ama Memrise. Aku pakai aplikasi ini udah cukup lama. Waktu main ke Prancis ada orang lokal yang mengira aku orang sana, gara-gara pakai cara pengucapan yang di Memrise. Aplikasi terbaik untuk belajar bahasa baru. Tak banyak yang tahu soal aplikasi ini. Saya sendiri belum pernah dengar Memrise sampai saya cari di internet apa sih yang bisa bikin belajar bahasa Spanyol lebih gampang. Ini jauh lebih baik daripada program sejenis. Fitur paling berfaedah itu belajar dengan orang lokal! Baru-baru ini saya dikenalkan ke keluarga pacar. Mereka asal Lebanon dan saya ingin disambut baik oleh mereka. Saya belajar cuma beberapa menit tiap hari selama seminggu. Cukup untuk belajar beberapa kata yang semoga bisa diterima baik sama keluarga si dia. Hasilnya bisa dibilang baik: Calon mama mertua setuju! Dua tahun lalu aku agak kesal karena kok selama ini cuma bisa satu bahasa. Pas ultah, aku mulai kursus bahasa Jerman di Memrise. Tiap hari belajarnya, tekun selama dua tahun. Kemarin dapat email dari teman orang Jerman dan aku bisa baca tanpa perlu scroll ke bawah untuk baca terjemahan yang dia sediakan. Bangga banget. Saya baru pindah ke Jepang. Pindah ke negara baru itu amat menantang. Sulit sekali menyeimbangkan belajar sepanjang waktu dan jadi bagian dari komunitas di negeri itu. Sejauh ini, berkat aplikasi ini saya jadi belajar lebih banyak dan lebih pede saat berkomunikasi dengan orang lokal. Nanti saya bakal kasih tahu aplikasi ini ke anak-anak saya. Arigatou. Di sekolah ada sih pelajaran bahasa Prancis, tapi tak pernah bisa masuk otak. Baru satu sesi di Memrise, eh kok bisa ya? Suka sekali pas aku bisa dengar kata atau frasa yang diucapkan oleh orang asli Prancis. Saking terkesannya dengan kemajuanku pas belajar di sesi gratis, aku langsung langganan setahun dan sekalian mau belajar bahasa Italia."
