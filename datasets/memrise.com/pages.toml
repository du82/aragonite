["https://www.memrise.com/sv"]
title = "Lär dig ett språk. Memrise är autentisk, användbar och skräddarsydd."
description = """
Testa Memrise. Du gör framsteg på bara några minuter. Och Memrise har sina små trix som hjälper dig förstå och komma ihåg orden. Lokalbefolkningens videos för uttal är superba de också.     @khouryrt"""
full_description = "Testa Memrise. Du gör framsteg på bara några minuter. Och Memrise har sina små trix som hjälper dig förstå och komma ihåg orden. Lokalbefolkningens videos för uttal är superba de också. Jag älskar verkligen Memrise. Jag har använt den här appen ett tag nu, och när jag åkte till Frankrike trodde folk att jag var fransk, tack vare mitt uttal som jag lärt mig av Memrise. Bästa appen för att lära sig nya språk. Den här appen är en doldis. Jag hade aldrig hört talas om den innan jag började leta på nätet efter ett lättare sätt att lära sig spanska. Den är så mycket bättre än alla andra kurser. Jag gillar särskilt funktionen lär med lokalbefolkningen! Jag blev nyligen presenterad för min pojkväns libanesiska familj, och ville göra ett gott intryck. Jag jobbade med den här appen några minuter om dagen i en vecka, och lärde mig lite nyckelfraser för att imponera på familjen. Den här appen är flickväns-vänlig och mamma-godkänd! För två år sedan blev jag irriterad på att jag bara kunde ett språk. På min födelsedag började jag en Memrise-kurs i tyska. Jobbade på varenda dag i två år. Igår fick jag ett mejl från en tysk kompis, och behövde inte skrolla ner till hans översättning. Rätt stolt faktiskt. Ny i Japan. Det är tufft att flytta till ett annat land, hela livet förändras. Det är extremt svårt när man försöker lära sig allt och bli en del av landet. Hittills har den här appen hjälpt mig att lära mig mer, och få bättre självförtroende så att jag kan kommunicera med lokalbefolkningen. Jag kommer visa den för mina barn. Arigatou. Jag greppade aldrig franska i skolan, men efter 1 lektion med Memrise var jag helt fast. Jag älskar att jag kan lyssna på äkta fransmän när de säger ord eller fraser. Jag är så imponerad över mina egna framsteg bara efter provlektionerna, att jag har skaffat en årsprenumeration och bestämt mig för att lära mig italienska också. Jag laddade ner den för att min tjej är från Sverige, och jag såg hur hon lyste upp varje gång jag sa ett ord på hennes språk. Så nu, efter att ha använt den runt tio minuter om dagen i fyra månader, nu är jag i Sverige (helt sjukt, jag vet) (jag är från USA) och nu är folk superimponerade över “hur bra” jag talar språket, och jag kan få dem att skratta på svenska och allting."
