["https://www.memrise.com/de/team"]
title = "Team | Memrise"
full_description = "Mit einem fantastischen (wachsenden!) 55-köpfigen Team, das insgesamt über 45 Sprachen spricht und an einem Produkt arbeitet, dass Lernen unterhaltsam und mühelos macht, haben wir uns zu einem starken, innovativen, funktionsübergreifenden, fokussierten und eng vernetzten Team entwickelt. Millionen von Menschen befinden sich auf einer Sprachlern-Reise mit Memrise, und es ist unsere Verantwortung, daraus die beste und bereichernste Erfahrung wie nur möglich zu machen. Deshalb haben wir uns darauf fokussiert, wissenschaftliche Erkenntnisse über das Lernen mit durchdachtem Design, erstklassiger Technologie und wunderbaren, bestechenden Inhalten zu kombinieren. All dies mit dem Ziel, Menschen mit sinnvollen, langfristig effektiven Sprachlern-Erfahrungen zu versorgen, die ihre Weltsicht bereichern werden. Mit einem fantastischen (wachsenden!) 55-köpfigen Team, das insgesamt über 45 Sprachen spricht und an einem Produkt arbeitet, dass Lernen unterhaltsam und mühelos macht, haben wir uns zu einem starken, innovativen, funktionsübergreifenden, fokussierten und eng vernetzten Team entwickelt. Abgesehen von der Arbeit sind wir ein lustiger Haufen, der mit Neugier auf die Welt blickt und leidenschaftlich auf die Veränderung der Sprachlern-Landschaft hinarbeitet. Wir arbeiten nicht nur als Team, sondern spielen auch im Team, mit regelmäßigen Firmen-Events, inspirierenden Vorträgen und wöchentlichen Mittagessen, ganz zu schweigen von den Box-Sessions, Yoga, Sprachunterricht und Malkursen, die ebenfalls vor Ort stattfinden. Wir wissen, dass man mehr Zeit auf der Arbeit verbringt als zu Hause, deshalb möchten wir dafür Sorgen, dass man auf der Arbeit so viel Spaß wie möglich hat. Unser wachsendes Team war schon in vielen wunderschönen Gebäuden in London beheimatet, die zur Neugier, Zusammenarbeit und zum unablässigen Streben nach Spitzenleistungen anregen. Für etwas mehr als sechs glorreiche Jahre war unser Büro in einer umfunktionierten Kapelle zwischen den Gemeinden Hackney und Tower Hamlets ansässig."
