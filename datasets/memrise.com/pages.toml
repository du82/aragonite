["https://www.memrise.com/de"]
title = "Sprachen lernen. Welten eröffnen. | Memrise"
description = """
Ich finde die App super, um Vokabeln und einfache Grammatikregeln zu lernen. Ich lerne Koreanisch mit Memrise. Man sollte sich auch noch andere Quellen zum Lernen suchen, aber man bekommt schon gute Grundlagen im Hören, Lesen und Sprechen.    Debby Föll"""
full_description = "Lerne schneller mehr mit einem Lernalgorithmus, der in Zusammenarbeit mit den besten Kognitionswissenschaften entwickelt wurde. Trainiere dein Langzeitgedächtnis mit einer Methode, die schneller und besser ist als das traditionelle Auswendiglernen. Verschwende keine Zeit mit Sätzen, die Leute eigentlich nie sagen. Lerne die Sprache, die Leute wirklich benutzen. Finde die Inhaltsthemen, die deinen Bedürfnissen entsprechen: vom Urlaubs-Smalltalk bis zum Treffen mit der Familie deines Partners. Ich finde die App super, um Vokabeln und einfache Grammatikregeln zu lernen. Ich lerne Koreanisch mit Memrise. Man sollte sich auch noch andere Quellen zum Lernen suchen, aber man bekommt schon gute Grundlagen im Hören, Lesen und Sprechen. Eine gute App die den face-to-face Kurs gut ergänzt. Im Moment ist der Spaßfaktor noch völlig gegeben. Zwei Jahre später bin ich in der dritten Sprache immer noch dabei. Das sagt wohl alles. Bin inzwischen sehr zufrieden, daher 5 Sterne. Weiter so! Ich habe das Ziel, Spanisch zu lernen! Da ich kein geduldiger Mensch bin, möchte ich nicht 6 Jahre dafür brauchen (wie beim Englisch Unterricht in der Schule). Merke jetzt schon wie gut die App ist! Ich kann schon innerhalb von 10 Min 14 Wörter schreiben, sprechen und weiß deren Bedeutung!"
