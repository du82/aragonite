full_description = "Follow this blog post for updates to the Memrise apps. We’ll always update this page first. Last updated: 4th November 2024 Earlier this year, we shared that community courses would be moving to their own dedicated site. Since March 31, 2024, these courses have been available exclusively on community-courses.memrise.com, no longer accessible via memrise.com or our mobile apps. We know this change has affected each of you differently, depending on your personal learning paths. Your patience and support throughout this transition mean a lot to us. Initially, we planned to keep these courses available on the separate site until the end of 2024. We’re now extending access through 2025 to give you more time with these resources. Earlier this year we announced the retirement of community courses from the main Memrise product. From the 31st of March of 2024, they will be moved to a separate website and will no longer be accessible on memrise.com or the mobile apps. This change could affect you differently, depending on the courses you are learning. Here, you’ll find all the information you need to understand what’s going on and what you need to do. If you’re already familiar with these changes and would like to head over to the new Community Courses website, tap the button above. Community courses are word lists but don't have any of the video content that word lists in the main Memrise product have. All non-language lists, like Geography or Biology, are community courses. All community courses are moving to a new website: community-courses.memrise.com This site is live and you can try it out now by clicking here. After the 31st of March, 2024, none of these courses will be available on memrise.com or the mobile apps. A: Community courses are word lists that let you learn facts and word translations, but don't have any of the video content that word lists in the main Memrise product have. All non-language lists, like Geography or Biology, are community 