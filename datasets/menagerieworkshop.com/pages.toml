["http://menagerieworkshop.com/how-to-commission-us/termsconditionswarranty"]
title = "Terms|Conditions|Warranty – Menagerie Workshop"
description = "Concept Art: Menagerie Workshop Requires 2 view (Front and back) concept art in order to begin your commission.  We provide this service free of charge.  When you commission us, we will work with y…"
full_description = "Terms|Conditions|Warranty Concept Art: Menagerie Workshop Requires 2 view (Front and back) concept art in order to begin your commission. We provide this service free of charge. When you commission us, we will work with you to create a reference sheet that will have all the information we need to bring your character to life. Please be aware that changes made to a character design may change the price (if changing markings or other things affecting complexity and production time). Prices: Price quotes are subject to change. Our price quotes are good for 30 days. Menagerie Workshop reserves the right to deny service to anyone. Shipping: All suits are shipped FedEx Ground Domestically and USPS Internationally. Shipping is not included with the price of your costume and will be billed after costumes have shipped. Shipping times vary. Menagerie Workshop is not responsible for tariffs, customs, duties, or any other fees associated with importing our product to another country. Payments: Menagerie Workshop requires a 30% non-refundable deposit to hold a spot in the queue. Final payments must be received before your costume is started. If you need your costume by a specific date, be sure to plan ahead. Payment in full must be received on the first of the month before your commission month. (For example, if your completion date is October, payment is due September 1st) Your payment due date can be found on your invoice. Late payments will result in a later completion date. We are willing to work with you if you are unable to pay by your scheduled completion date, but please note that if we haven’t received communication from you in 12 months from your scheduled completion date, your commission may be cancelled or you may incur a price increase on your costume that reflects our current pricing structure. We accept personal checks, credit cards, Debit cards, money orders and PayPal. Menagerie Workshop is not responsible for payments lost in the mail. Refunds and Warranty: If at any point you wish to cancel your commission before completion, you will be refunded the full amount minus the nonrefundable 30% deposit. The deposit is non-refundable because it covers the cost of your concept art, materials ordered and taxes. The deposit will not be refunded for any reason. Refunds may take up to 90 days. No refunds will be issued after we have begun work on your costume. Menagerie Workshop costumes are guaranteed to be free from manufacturing defect for 30 days. If you have an issue with your costume upon receiving it, please contact us IMMEDIATELY so we can arrange to make changes. If you are sending a costume back to us to be altered because we have made a mistake, Menagerie Workshop will reimburse the return shipping up to $50. If you have damaged your costume outside the 30 day warranty period, we do repairs for $40/hour + materials cost and shipping. Normal wear and tear and any damages due to negligence are not included in the warranty. Any modifications made to the costume by anyone other than Menagerie Workshop (or its affiliates with specific prior written permission) voids your warranty and may result in MenagerieWorkshop denying future modifications, repairs or refurbishments on your costume. Costumes from Menagerie Workshop are wearable art, not clothing and should be treated as such. Timeline: Quoted times are subject to change and are not guaranteed. Although we do our best to keep to our schedule, WE DO NOT GUARANTEE COMMISSION DEADLINE COMPLETION. The best way to help ensure that you receive your costume by a specific date is to select your completion month at least 3 months before your event. (For example, if you want your costume to be completed by Further Confusion, which is in January, you will want to choose a fall month as your completion month.) Age: All customers must be at least 18 years of age before sending any payments. If under 18, a parent or guardian must contact us. Sizing: A measurement sheet must be filled out by the commissioner to help us properly size the costume for you. While we try to get the sizing right the first time, your costume may not fit perfectly the first time around. We will fix any sizing errors due to our own error free of charge if notified within 7 days after you receive the costume. Please keep in mind that these costumes are wearable art and have range of motion more similar to a business suit than a sports uniform. If you have specific mobility requirements in mind, please let us know when filling out your quote form so we can discuss how to serve you best! Performance: The commissioner understands that fursuiting and mascotting can be a dangerous activity (dangers including but by no means limited to overheating, exhaustion, and dehydration). Menagerie Workshop is not responsible for any injury or death of any performer resulting from improper use of one of our costumes. Know your limits, play it safe, stay hydrated & have a great time! Contract: By sending us your first payment, you are officially agreeing to a commission from Menagerie Workshop and agreeing to all the terms of service listed above. Menagerie Workshop reserves the right to refuse service to anyone."
year_published = 2016
year_updated = 2021
