["http://menagerieworkshop.com/how-to-commission-us/frequently-asked-questions"]
title = "Frequently Asked Questions – Menagerie Workshop"
description = "Q: Do you accept payment plans? YES! Once you have paid your 30% down payment you can pay your suit in whatever increments suit your budget.  Please keep in mind that costumes must be paid for in f…"
full_description = "Frequently Asked Questions Q: Do you accept payment plans? YES! Once you have paid your 30% down payment you can pay your suit in whatever increments suit your budget. Please keep in mind that costumes must be paid for in full before production starts. The total balance must be received at least 30 days prior to the desired completion date. Q: Do you require a duct tape dummy? No! We do not require a duct tape dummy. We prefer to work off measurements. Once you have paid your 30% deposit, we will have you take a few simple measurements for us to determine the sizing for your costume. Q: How does your queue work? Once you pay your 30% deposit, you will officially be in the queue. Your costume must be paid off 100% by the month prior to your costume’s scheduled construction month to ensure you keep your place in the queue. Fall behind on payment? No problem – just let us know as soon as possible so we can adjust the schedule for our other commissioners and we can talk about moving you back in the queue. Q: Do you make moving jaws? We only offer moving jaws on our realistic style heads. Where is MenagerieWorkshop located? We are located near Boulder, CO, USA. Q: Is the workshop open to the public? Nope. Sorry! Q: Do you ship internationally? Yes! We ship costumes all over the world. Keep in mind there can be a tariff to import goods into your country. Q: How much does shipping cost? Shipping varies depending on your location but is usually between $30-$200. Q: Will you make me a fursuit of a character from movies or video games? No, we do not make copyrighted characters from movies, tv, or video games (unless you’re the copyright holder!). Q: How much do your fursuit heads weigh? Our toony heads typically weigh between 1-2 lbs. Our realistic heads weigh around 2-4 lbs. Q: Do you send WIP photos? We don’t email WIP photos, but you can follow us on twitter @menagerieworks for workshop updates and some WIP photos. We also have a very active private telegram group with lots of WIPS photos and a posted weekly schedule. Once you commission us, you will be provided the link to join the group! Q: Will you update a costume I purchased from another fursuit maker? Nope, sorry. We only work on costumes produced by us. We do not offer tailoring, fixes or updates to costumes made by other makers. Q: Do you hand sew markings or airbrush them? It depends on your budget. Airbrushing is cheaper, but sewn-in markings last longer! Some questions to ask yourself are: how often do you plan to wear the costume, and how often will you wash it? Feel free to ask for quotes both ways when you fill out our official quote form (link to quote form) to help you make your decision!"
