["https://menagerieworkshop.com/how-to-commission-us"]
title = "How to Commission Us – Menagerie Workshop"
description = "Step One: Fill out our quote form located HERE Our quote form is only open when we are open for commissions!  Once you fill out the form, you will receive a response within 24 hours.   We work on a…"
full_description = "How to Commission Us Step One: Fill out our quote form located HERE Our quote form is only open when we are open for commissions! Once you fill out the form, you will receive a response within 24 hours. We work on a hybrid system of first come first served and selecting costumes that we think will work well in our style. We will let you know if we don’t think your character is a good fit for us! Our spots fill very quickly! You have 24 hours to respond to the quote email. If we don’t hear from you within that time frame, your slot may no longer be available. Step Two: Pay your 30% deposit. Menagerie Workshop accepts credit cards, PayPal, and personal checks. Once you have confirmed you are ready to move forward with your fursuit or custom mascot, we will give you detailed payment instructions. After the deposit is paid, you officially have a spot in the queue! Step Three: Official Commissioner Form After you pay your 30% deposit, you will receive a link to our commissioner form that will collect the necessary information to complete your commission. You will also receive a link to our measurement form. We do NOT require a duct tape dummy. The measurement form will give us all the information we need to make a well-fitting fursuit. Step Four: Design In order to create the best costume possible, Menagerie Workshop offers a complementary reference of your character. By working with you to create a new fursuit specific reference, we are able to make sure you have a realistic expectation of what the final product will look like. Step Five: Production! When we are about to start production we will notify you via email. We often use messenger apps such as Telegram to keep in contact with you as we create your character. After we make your costume you will be notified via email that is has shipped. We charge shipping after your costume has shipped because shipping cost varies."
