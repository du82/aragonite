["https://menagerieworkshop.com/how-to-commission-us/the-commission-process"]
title = "The Commission Process – Menagerie Workshop"
description = "Step One: Fill out our quote form located HERE Please note that we are currently working on a better system for accepting commissions.  Not everyone who fills out the quote form will have their cos…"
full_description = "The Commission Process Step One: Fill out our quote form located HERE Please note that we are currently working on a better system for accepting commissions. Not everyone who fills out the quote form will have their costume accepted. This system is likely to change in the next 12 months! For the most up to date information, check out our twitter @menagerieworks. Step Two: Pay your 30% deposit. Menagerie Workshop accepts credit cards, PayPal, and personal checks. Once you have confirmed you are ready to move forward with your fursuit or custom mascot, we will give you detailed payment instructions. After the deposit is paid, you officially have a spot in the queue! Step Three: Official Commissioner Form After you pay your 30% deposit, you will receive a link to our commissioner form that will collect the necessary information to complete your commission. You will also receive a link to our measurement form. We do NOT require a duct tape dummy. The measurement form will give us all the information we need to make a well-fitting fursuit. Step Four: Design In order to create the best costume possible, Menagerie Workshop offers a complementary reference of your character. By working with you to create a new fursuit specific reference, we are able to make sure you have a realistic expectation of what the final product will look like. Step Five: Waiting for your production Month Usually it will be approximately six months until we start work on your costume. You can keep an eye on where you are in the queue by visiting our Current Commissioner Queue page. Step Six: Production! When we are about to start production we will notify you via email. We often use messenger apps such as Telegram to keep in contact with you as we create your character. After we make your costume you will be notified via email that is has shipped. We charge shipping after your costume has shipped because shipping cost varies."
year_published = 2016
year_updated = 2018
