title = "Darinka Zobenica"
full_description = "Guided a talented team of artists, designers, and fellow programmers in the creation of a captivating Slavic-inspired point-and-click adventure game, set in a magical medieval forest. Over the course of 6 months, we crafted a 1-hour gameplay experience, rich with encounters with enchanting creatures and protectors. Rooted in Slavic folklore, the game follows the journey of Zorya, our intrepid protagonist. It was an incredible journey, made possible by the dedication of a remarkable team and the invaluable input of friends who aided in testing. I'm immensely grateful for their contributions. Participated in a Ubisoft-sponsored guest course during college, where we crafted a sidescrolling platformer from scratch using a barebones C++ engine over a semester. Working in a team of 3, I focused on developing state machines for movement and animation, implementing parallax background, and contributing to collision mechanics. The game centers around a tiny wizard exploring picturesque natural terrain, acquiring new abilities along the path. Although it's a prototype with roughly 5 minutes of gameplay, it showcases the foundations of a charming and dynamic gaming experience. Analyzed how optimizing a probability matrix that guides generation of a maze for various factor affects people's perception of the maze itself. Optimized for length of the correct path, number of turns, and length of detours using a genetic algorithm. Found a weak correlation between the chosen factors and people's scores according to results of a self-report survey we held. An educational simulation of a famous gametheoretical concept made in C++ using Qt. The user can adjust the amount of food in a given simulation, and choose from several strategies submitted to Axelrod's first tournament, set population numbers for each strategy, and watch them battle for dominance. An analysis of a speed dating dataset from a Colombian experiment to see how traits such as race, income, shared interests, and age differences affect partner choice. Data was analyzed using SPSS Modeler. It turned out that age difference and ethnicity were the best predictors of the dates wishing to see each other again, while income and common interests were less important."
