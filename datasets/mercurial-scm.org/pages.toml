["https://mercurial-scm.org"]
title = "Mercurial SCM"
full_description = "Mercurial SCM# Work easier, Work faster Mercurial is a free, distributed source control management tool. It efficiently handles projects of any size and offers an easy and intuitive interface. Quick Start Clone a project and push changes hg clone https://www.mercurial-scm.org/repo/hello cd hello # (edit files) hg add (new files) hg commit -m 'My changes' hg push Create a project and commit hg init (project-directory) cd (project-directory) # (add some files) hg add hg commit -m 'Initial commit' How you can benefit from Mercurial It is fast and powerful Mercurial efficiently handles projects of any size and kind. Every clone contains the whole project history, so most actions are local, fast and convenient. Mercurial supports a multitude of workflows and you can easily enhance its functionality with extensions. Learn more » It is easy to learn You can follow our simple guide to learn how to revision your documents with Mercurial, or just use the quick start to get going instantly. A short overview of Mercurial’s decentralized model is also available. Learn more » And it just works Mercurial strives to deliver on each of its promises. Most tasks simply work on the first try and without requiring arcane knowledge. Learn more »"
