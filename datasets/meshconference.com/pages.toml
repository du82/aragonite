llaborate, and shape Canada’s future. Chris Hogg Love0 mesh 2024 September 27, 2024 The Future of Work is an Entanglement of HR, IT, and Design The future of work is built on a three-legged stool: HR, IT, and design. mesh conference Love0 mesh 2024 September 26, 2024 Redefining Innovation: mesh conference to dive into digital transformation in the built environment in Toronto After captivating the audience virtually at the Calgary 2024 mesh conference, Kamales Lardi is back by popular demand—this time in person at mesh Toronto. mesh conference Love0 Get tickets Speakers View Larger More Details Tina Mathas Strategist, innovator, and leadership coach Love18 View Larger More Details Cathy O’Neil CEO, ORCAA and best-selling author Love17 View Larger More Details Katie Calhoun Consultant and former VP, Getty Images Love17 View Larger More Details Christian Ortiz Chief Executive Officer, MOD ATLAS MEDIA Love17 View Larger More Details Sarah Coleman Communications lead, CSV Midstream Solutions Love12 View Larger More Details Chris Hogg President, Digital Journal Group Love16 See more speakers What to expect Expert keynotes Hear from industry leaders on learning, challenges and managing DX. Practical workshops Choose from a selection of seminars on how to manage DX. Cross-industry panels Hear from a cross section of people who have lived in the DX trenches. Wow factor Experience surprise and delight moments that happen when you mesh people together. On-site demos See hands-on examples of new tech, platforms and digital tools. Networking Make connections, get inspiration and meet other DX leaders. Get tickets Attendees come to mesh for two reasons. We blow your mind on day one with ideas and inspiration, and on day two we produce practical workshops so you can tackle digital transformation when you get back to work. We are the only digital transformation event that brings people from multiple industries, so you’ll cross-pollinate and find inspiration and ideas from people you don’t typically connect with — creatives, public sector employees, technologists, developers, business strategists and more. Why attend mesh Convince your boss The mesh innovation showcase This program intended to recognize innovation and digital transformation leaders from underrepresented communities across Canada. Called the mesh innovation showcase, the program is run in collaboration with The51, The A100, and Platform Calgary. Learn more about the mesh innovation showcase. Connecting Canadians mesh is a national event hosted in two Canadian cities — Calgary and Toronto. Bridging the East and West is both a requirement, and our commitment. Creating space for people to learn, build, and scale innovation takes dedication and teamwork, and a lot of amazing people. Given that a lot of geography separates us as Canadians, we have committed to looking for ways to connect our country’s digital transformation ecosystems so we can achieve our mission. One important way we do that is by bridging the East and the West, which we do by hosting in more than one city. We have teams, collaborators, partners and friends in Calgary and Toronto whose networks extend out from each city so we ensure mesh is meaningful and impactful on a local, regional, and national scale. Thank you Get tickets Bad news, good news. You’ve almost reached the end of the mesh home page (bad). You can find more with the navigation above (good). Even better? You can use the form below 👇 and have the latest mesh news delivered to your inbox. hbspt.forms.create({ region: "na1", portalId: "23802982", formId: "7d1aa308-7969-4075-845e-27fda10a8cdb" }); We put sponsors and speakers in front of millions of people each month via our media partner Digital Journal. Covering all things innovation and digital transformation, Digital Journal reaches senior-level decision-makers coast, to coast, to coast. Moore Carlyle Consulting (MCC) delivers creative direction and execution for mesh. As a full-service event agency, MCC transforms mesh into a true experience for attendees in both Calgary and Toronto. Sponsors and speakers are supported by DJG who produce content for brands at mesh. DJG produces high-quality, audience-centric content for brands including content marketing and live content creation.'
