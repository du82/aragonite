["https://metafilter.com/207868/Finding-groups-by-their-agreement"]
title = "Finding groups by their agreement | MetaFilter"
description = "Analyzing UK people by their opinions doesn’t reconstruct generational cohorts . Preliminary research? Better-than-average marketing research? Common fallacies rediscovered?"
full_description = '''Finding groups by their agreement March 2, 2025 12:36 PM Subscribe Analyzing UK people by their opinions doesn’t reconstruct generational cohorts. Preliminary research? Better-than-average marketing research? Common fallacies rediscovered?The Mefi bait might be this: On average, the generations have a Group Cohesion Score of +1.3, making them only marginally more like-minded than the nation as a whole. For Gen Z, this score falls to +0.2. People born between 1997 and 2013 have no stronger connection to each other than to the rest of the country. but some of the groups *with* cohesion… Orangina drinkers? Karass or granfalloon? posted by clew (11 comments total) 12 users marked this as a favorite (adsbygoogle = window.adsbygoogle || []).push({}); The strong group cohesion of Orangina drinkers makes intuitive sense to me, as clearly these are people making the right decisions in life.posted by Kattullus at 12:44 PM on March 2 [4 favorites] I only drink orangina when going on holiday in or through France. Buying it in Sainsbury's would ruin the allure.posted by biffa at 1:06 PM on March 2 [9 favorites] Looking at cohesion by profession, Marketing is by far the most like-minded industry that TGI measures.... We like to style ourselves as free thinkers, mavericks and crazies, but the grim truth is that we’re a more insular profession than farming and boast more conformists than the military. The funniest part of this is the idea that the average marketing professional's self conception is that of "free thinker," but I guess we all think we are the specialest snowflakes.posted by the primroses were over at 1:25 PM on March 2 [13 favorites] When will people ever realize that class groupings like these and all others are just big abstractions that don’t correlate with reality. They are abstractions, loose terms that stand in for groupings of individuals. Lazy or evil ways to categorize people to serve some need or desire.posted by njohnson23 at 1:47 PM on March 2 [2 favorites] Fun article, but this report is pretty hard to interpret beyond the "horoscope" level as well. 1. Very few modern models of behavior (whether commercial or academic) are defined on generation. Still, generations aren't totally meaningless - it is literally true that people who saw the Berlin Wall come down have something distinctly in common from people who were not born at that time. Or that people who grew up before a polio vaccine had different childhood experiences than people who grew up after that vaccine. Lifestage matters - a boomer is less likely to be having a baby right now than a millenial/GenZ, and "likelihood of having a baby" absolutely is a meaningful behavioral predictor. And plenty of research shows distinct differences in social and cognitive processing across the lifespan. Since age correlates with generation, there are going to be meaningful insights that can arise even though the generational "bands" are quite large. Anyway, most market segmentation uses age, but only as one of of many variables because even though this article keeps saying that "marketing" is focused on generational estimates, actual market segmentation is far more sophisticated than that (see point 2). 2. I'm assuming the TGI dataset they're referring to is from Kantar, which at least means there's a chance the sampling was done decently well in terms of size and demographic representativeness. But why does Kantar, a multi-national marketing research firm, have a large UK data set with 419 attitude measures? Because no serious marketer defines their strategy or customer insights specifically on "generation," marketing already uses multifaceted data like Kantar's. 3. Okay, back to the points of this particular analysis. The base level of agreement seems impressively high - 48%! The differences they're showing as "high" are 5-6% points above and below FORTY-EIGHT percent base agreement. My first question would be to know the descriptives on each question - do each of those 419 lifestyle questions have the same level of variance? - and what the average level of variance might be. Because I'd like to know whether a few percentage points either way is just noise. Is +5 actually usefully better than +2?posted by BlueBlueElectricBlue at 1:58 PM on March 2 [6 favorites] Looking forward to a future coalition government between the Orangina Drinkers Party and the Daily Nut Eaters.posted by automatronic at 2:57 PM on March 2 [3 favorites] You're all individuals!posted by Artful Codger at 2:58 PM on March 2 [1 favorite] If America’s millennials declared their independence and founded The Republic of Avocadonia, they would be the 19th largest country in the world Avocadonia!posted by HearHere at 3:40 PM on March 2 [2 favorites] I'd love to know how many of the whole cohort belong to these groups, like 'people who floss'. Aren't we all supposed to? Also which weird group will I most identify with being a part of? Now I want to know.posted by dowcrag at 11:43 PM on March 2 It's the UK, so anything that doesn't explicitly reference social class is bound to be nonsense. Class is also a good explanation for the cohesion of orangina drinkers. I strongly suspect they're buying it in Waitrose and not Asda.posted by plonkee at 8:47 AM on March 3 plonkee, feast your eyes on the figure titled "Group Cohesion by Social Grade" -- which is high for grade A, lower for each less powerful grade, and switches from positive to negative between C1 and C2. making me wonder, (a) is the result from social class the real point of the article; (b) how did Marketing come out even more cohesive than class A? How much is Marketing a subset of class A? and (c) If people from other classes chose the questions, would the results be different?posted by clew at 12:08 PM on March 3 [1 favorite] « Older Don Ellis | Log, baby log Newer » (adsbygoogle = window.adsbygoogle || []).push({}); You are not currently logged in. Log in or create a new account to post comments. Related Posts “You know what they say—strict parents raise... September 21, 2024 You know what’s grinding? A crisis. July 29, 2024 Over $100? Time to bring out the Big Guns June 5, 2024 Parents are skeptical about sleepovers January 17, 2023 "The End of Friendly Generational Relations" November 3, 2019 (adsbygoogle = window.adsbygoogle || []).push({}); Tags Statistics groups generations millennials GenZ opinions advertising Share Facebook'''
