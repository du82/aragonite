is 1998 film Ronin wound up on several lists of the "best car chases on film". He was supposed to helm the upcoming Exorcist prequel, but failing health forced him to step aside. Despite the dodgy source material, I would have really liked to see Frankenheimer's take on it. He'll be missed. posted by toddshot on Jul 6, 2002 - 33 comments Besides being great directors, what do Wong Kar Wai, John Frankenheimer, Guy Ritchie, Ang Lee, and Alejandro González Iñárritu all have in common? BMW is cool. ...and Ang Lee is too, the Incredible Hulk, nice touch. posted by tomplus2 on May 16, 2001 - 10 comments Page: 1'''
