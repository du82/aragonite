title = "Next stop: Mare Crisium near Mons Latreille | MetaFilter"
description = "With a suite of NASA science and technology on board, Firefly Aerospace is targeting no earlier than 3:34 a.m. EST Sunday, March 2, to land their Blue Ghost lunar lander on the Moon. Blue Ghost..."
full_description = '''Next stop: Mare Crisium near Mons Latreille March 1, 2025 4:52 PM Subscribe With a suite of NASA science and technology on board, Firefly Aerospace is targeting no earlier than 3:34 a.m. EST Sunday, March 2, to land their Blue Ghost lunar lander on the Moon. Blue Ghost is slated to touch down near Mare Crisium, in the northeast quadrant on the near side of the Moon, as part of NASA’s CLPS (Commercial Lunar Payload Services) initiative and Artemis campaign to establish a long-term lunar presence. Live coverage of the landing, jointly hosted by NASA and Firefly, will air on NASA+ starting at 2:20 a.m. EST, approximately 75 minutes before touch down on the Moon’s surface.Lunar landing, previously posted by chavenet (17 comments total) 8 users marked this as a favorite (adsbygoogle = window.adsbygoogle || []).push({}); after seeing,, on T.V., all the moon landings, by Apollo 15, I remember looking up at the Moon that July hoping that one day people would live on the moon even if there was real no purpose, perhaps it might break away from the Earth's orbit and travel the Stars on a Grand adventure. godspeed Blue ghost.posted by clavdivs at 5:48 PM on March 1 [2 favorites] perhaps it might break away from the Earth's orbit and travel the Stars on a Grand adventure. I have good news for you.posted by Lemkin at 6:26 PM on March 1 [2 favorites] I'm so overdue on my space posts.posted by doctornemo at 6:42 PM on March 1 [4 favorites] Right now I think there are three craft on their way to the moon and one shooting past it.posted by doctornemo at 6:42 PM on March 1 [2 favorites] when the seven planets were to align, I went outside on my deck and it was cloudy and I thought a doctornemo post on space by now would be good. I will not lie about space because I believe that Neil Armstrong is the best astronaut that ever lived.posted by clavdivs at 6:50 PM on March 1 [2 favorites] US firm Firefly makes its first moon landing with uncrewed Blue Ghost spacecraftposted by chavenet at 1:52 AM on March 2 Firefly's page about Blue Ghost has a neat animation of the landing and spacecraft.posted by Brandon Blatcher at 3:36 AM on March 2 [2 favorites] I hate to milkshake duck these folks, but...posted by CynicalKnight at 5:47 AM on March 2 [1 favorite] I hate to milkshake duck these folks, but... posted by CynicalKnight A touch eponhysterial.posted by doctornemo at 5:55 AM on March 2 [1 favorite] https://www.nasa.gov/news-release/touchdown-carrying-nasa-science-fireflys-blue-ghost-lands-on-moon/posted by doctornemo at 5:55 AM on March 2 [1 favorite] You know what I'm really waiting for with all the upcoming Moon landing stuff? Video from a spacecraft on the surface taking video of another spacecraft landing. We have old video from the 70s of Apollo 15, 16, and 17 lifting off from the Moon, but the video quality isn't great. Imagine capturing a landing from another craft that's on the surface with a GOPro technology!!! That would be spectacular, similar to the Perseverance rover landing on Mars!posted by Brandon Blatcher at 6:26 AM on March 2 [3 favorites] Nice! I'm not a huge fan of private space stuff, but any progress is always good.posted by sotonohito at 11:07 AM on March 2 [1 favorite] I read on article about this that mentioned "It carried a vacuum to suck up moon dirt". Vacuum. On the moon. Where there's approximately no atmosphere. How the heck is that supposed to work, bring air with you? Turns out, yes. https://www.nasa.gov/missions/artemis/clps/nasa-lander-to-test-vacuum-cleaner-on-moon-for-sample-collection/posted by fings at 1:26 PM on March 2 [3 favorites] My brain, it wants to interpret this as a hopeful event, a sign that despite everything that's going on we're still striving to learn more about the universe, looking for things we can do and use to make life better back on earth for the rest of us. But my heart? It's full-on "Whitey On The Moon" time in there.posted by MarchHare at 5:09 PM on March 2 [4 favorites] I read on article about this that mentioned "It carried a vacuum to suck up moon dirt". Vacuum. On the moon. Oh my god, it's Mega Maid. She's gone from suck to blow!posted by Literaryhero at 10:03 PM on March 2 [3 favorites] Scott Manley: Blue Ghost Landed On The Moon - But Can We Figure Out Where?posted by Pendragon at 3:30 AM on March 4 Firefly Aerospace: Moon Landing - Firefly Blue Ghost Makes History. Scott Manley: Blue Ghost's Landing Video Reveals Exactly Where It Landed On The Moon.posted by Pendragon at 11:07 PM on March 4 « Older The Making of Big Green | A far-out cognitive model and moral philosophy Newer » (adsbygoogle = window.adsbygoogle || []).push({}); You are not currently logged in. Log in or create a new account to post comments. Related Posts belters expanse trajectory: working up the Epstein... April 14, 2013 One small clarification for a man, one giant scene... January 7, 2013 "I can barely hear you, let alone see you..." December 21, 2010 Happy 40th anniversary, mankind. July 2, 2009 NASA Challenges Moon Hoax Conspiracy November 7, 2002 (adsbygoogle = window.adsbygoogle || []).push({}); Tags LunarLanding Firefly BlueGhost NASA Space SpaceTravel Science Share Facebook'''
