["https://metafilter.com/207882/How-do-you-make-a-decision-Weekly-Free-Thread"]
title = "How do you make a decision? (Weekly Free Thread) | MetaFilter"
description = "How to master decision making in a world of uncertainty What kinds of decisions are you trying to make lately and you don't know what to do about them? Commiserate, ask for advice, or just talk..."
full_description = '''How do you make a decision? (Weekly Free Thread) March 3, 2025 10:48 AM Subscribe How to master decision making in a world of uncertainty What kinds of decisions are you trying to make lately and you don't know what to do about them? Commiserate, ask for advice, or just talk about whatever else is going on for you in this week's free thread. posted by jenfullmoon (79 comments total) 9 users marked this as a favorite (adsbygoogle = window.adsbygoogle || []).push({}); Most of my current decisions involve pretty mundane things: Will we be able to get the screened-in porch built before the end of this year's summer? Now that we've canceled an SF trip, where we can go in Canada that we haven't seen it yet (and to give money to our own country)? Should I go ahead and book another consultation with a tattoo artist even though my current WIP isn't finished yet? This past weekend was great! It was KCFF (Kingston Canadian Film Festival) time in the city; Shepherd and I went to a Q&A with actor Jay Baruchel. It was hosted by Elamin Abdulmahmoud, who was delightfully charming. The next day we went to the premiere screening of Still Alive in Kingston, directed by Jay Middaugh, local filmmaker and neighbour. (I was delighted when there was a series of shots of our street! I had no idea!) Shepherd and I tend to be pretty much hermits so getting out and seeing familiar faces and supporting a local festival felt good.posted by Kitteh at 11:02 AM on March 3 [6 favorites] Oh boy, decisions! That's where I'm a Viking! One of my grand axioms of life is that if you do or say anything decisively enough, everyone else will follow you. It's horrifyingly true (politics, the oligarchy) but also a cause for optimism for the little guys like us. You really can confidently swagger your way through a LOT of life's problems, you just have to trick yourself into believing it first.posted by phunniemee at 11:02 AM on March 3 [25 favorites] I am having a terrible time just now with making decisions about what to do with the rest of my life -- when to retire, where to live, with whom to live, etc. I can't even decide if it's time to decide. Meanwhile people were yelling outside my workplace on Saturday, and more is planned for tomorrow.posted by JanetLand at 11:29 AM on March 3 [11 favorites] At my midlife juncture where the matrix of family and career decisions is massive, I sometimes get anxious when I try to control it. In these moments I reconnect with my younger self and make decisions in the manner I always have: stay true to myself, and follow my heart. It has yet to fail. It probably helps that I'm an applied mathematician who specializes in probability theory, so my heart has a razor sharp grasp of uncertainty, and highly tuned priors.posted by Alex404 at 11:32 AM on March 3 [5 favorites] I recently had to apply for a position I mistakenly thought I could be promoted to. If I don't get it, I have to decide if I want to stay in a place that doesn't believe in me or move on. It's really weighing heavily upon my mood.posted by tommasz at 11:33 AM on March 3 [4 favorites] How do you make a decision? My handy-dandy Jump To Conclusions mat!posted by Greg_Ace at 11:48 AM on March 3 [4 favorites] I think a key to making good decisions is to not lie to yourself. Last week I forced myself to confront the fact that, despite my best efforts to support them, my old strawberries had failed to winter over. They were dying, and I was just fooling myself by refusing to accept this, thinking I saw "new growth" where there was none. So I "retired" the old plants and put in new young ones. The old strawberries made me sad, but the sight of the new ones cheer me greatly. It was the right decision.posted by SPrintF at 11:51 AM on March 3 [10 favorites] I'm currently in the sort of life rut where it seems that I'm mainly just reacting to one demand after another - some planned, most popups. So not too many decisions to be made, other than to just keep on keepin' on. OK, one good decision; on Wednesday, after hearing an interview with her on the radio, we decided to grab tickets to go see Jane Bunnett and Maqueque and friends "Warm Winds of Cuba" show on Saturday. And it was great. So... good decision.posted by Artful Codger at 11:53 AM on March 3 [3 favorites] Hamlet had 40 people in the audience on Sunday, closing day. We filmed it, but we shall see if we actually receive a film of it (I've been burned on that before). The cast party went well. I am happy to report that our crankiest cast member elected to not go to the cast party, which was probably a relief for everyone. I like her, but the sheer amount of PISSED OFF and FED UP she had going on with the director was quite a lot. Some people cannot put on a fake face or even a neutral one, what can you do. (The bitch face she was making was actually kind of hilarious after awhile :) The cast photo when the director got up to stand by her, OH MY!) My mom and her boyfriend came and Mom, who is not into my acting, actually complimented me. Her boyfriend said this was the happiest he'd ever seen me and I need to stop mucking around with being in the background. I agree, it's just getting others to see me that way. I wish more people had seen that show, but almost all of my friends are not into seeing me in shows these days...oh well. But I did an excellent job and I can act, thank you very much. Even the costume designer told my mom I was a very good actress! My two issues for prompting this idea: (a) My cousin's wedding is on a PRIME theater show night in mid-May. I have no choice but to go, my mom will scream forever if I do not and it's also very close to where I live. However, you cannot miss a show night and thus I am screwed out of auditioning for a lot of shows. I REALLY wanted to do one that finished before the wedding, but they extended the show date by a week and thus I can't do it now *cry.* The alternate show I was going to audition for if I didn't get into the one I wanted (call it Show A) is still available, but they moved it to mid-June. I want to audition for another play in mid-May post-wedding, but unfortunately alternate show and new play overlap by three weeks and that is also a no-go. I know very little about the alternative show--it's a home-grown--but they are probably easier to get into/have more parts than the one I like better. I've seen Show B, I'm show friends with the director of Show B and he said "you'd better!" go to the audition, but there's not as many parts for women, I dunno if I'd get one, no guarantees. It's a gamble to turn down a more "sure thing" to wait around for a less sure thing, and I do not like it. There are no other shows available to audition for right now given the time constraints, so if I don't do Show A, it means I have months of boring break and I have no idea if I could even get into Show B in the first place. I don't want to not be doing anything for 3-6 months and I dislike gambling. Even my online theater group is taking a break this spring. FOO ON BREAK, I DON'T WANT A BREAK for longer than oh, a week. I want to work on getting better parts, not sitting on my butt/stalling on cleaning my house. (b) I have confirmed that a theater acquaintance has a crush on me and I am still trying to figure out that situation. I don't know him very well, he seems nice, very complimentary, went to my show twice. He was a bit overenthusiastic in texting at first, then has dialed it way down, so I dunno if he's just theater tired or has lost interest or is trying not to be annoying (probably the latter?). He's having tech week this week so that's a factor. I'm debating whether or not to just ask him out and see how this goes after tech week--try a show that runs on a Thursday--but I'm not sure how this goes since I haven't had anyone like me back in literal decades, he doesn't know my actual ancient age, etc. If it doesn't work out, eh, I'll be fine since this hasn't gone too far on an attachment level, and I have low expectations. Just not sure how to manage something like that, is all.posted by jenfullmoon at 11:57 AM on March 3 [10 favorites] In all seriousness, I've found that surprisingly many (though certainly not all) decisions can be postponed indefinitely; usually with the result that the issue gets worked out on its own, or the decision is made for you by circumstances that were beyond your control to begin with. Sometimes the issue is actually so insignificant that postponing the decision results in absolutely no consequences whatsoever.posted by Greg_Ace at 12:11 PM on March 3 [15 favorites] I recently got engaged which means the start of wedding planning and all the decisions that go into that. I saw someone somewhere say you should choose two or three parts of the wedding to really care about, so mine are food anddddd I guess getting as much extended family there as possible. My mom is ten steps ahead of me and is already thinking about the logistics of getting an airbnb since they're not nearby. We don't even have a date yet! I'm hoping I can delegate some things that aren't super important to me to my mom, since her instinct is going to be to take charge. With any luck this means we will stress each other out less. Whew! So much to think about!posted by extramachine at 12:14 PM on March 3 [5 favorites] Y’all it is a very bizarre time to be trying to have a (second) baby with our surrogate. My anxiety brain is like “Really? REALLY? New person in THIS world??????” But the process began long before *waves hands around* all this. There’s no new decision to be made until if/after she’s born, and boy howdy is it gonna be one doozy after another in a two-dad household.posted by BuddhaInABucket at 12:20 PM on March 3 [6 favorites] Ask a Dog!posted by ginger.beef at 12:21 PM on March 3 [3 favorites] My wife and I made a (fairly) major decision this morning. As of today, we are putting all significant expenditures on hold. We need to understand how the changes in Washington are going to affect us here. We were in the process of buying a new car; that is now canceled. We don't watch the news or listen to politics but enough filters through to make us very concerned. I predict this decision will be in effect for a very long time. Uncertain times indeed!!posted by Rivvo at 12:29 PM on March 3 [10 favorites] FWIW about a month back I made a decision on the spot to walk out of a "dream" job. It was dramatic, but I worked some rationalization into that moment. I realized this producer is yelling at me... *again*. Tired of getting yelled at, I simply walked up to the other producer, extended a firm handshake saying 'goodbye', and I walked out, revealing not much more than something along the lines of: 'I need to cool down'. To prevent this from being an impulsive on the spot decision I rationalized that I could reflect the next day and negotiate, not showing my cards. As in - I did not say anything precise on that spot, in that moment, I just needed these people realize that I *can* walk out. But the next day the decision felt good, and the negotiation with them only revealed how cynical it all is - I realized they're never going to treat me with respect, and that I lose more staying and putting up with it and having a job, than I do not having one at all and seeking better opportunities. Month and a half later - I *am* still in a difficult situation and yet a twice-as-good opportunity (if not more) has popped up. Absolutely everyone around me (except parents) congratulated me on the decision. This confirmed that it was the best job ever but that it was also the worst job ever. And that's the thing: before this I messed around with a six months notice and all the anxious psychological damage that all of that entails. This time it was instant - right here, right now. Next time? Even faster. Life. Is. Too. Short. Whatever you're dealing with - do it now. Your loved ones will support you far more for it, and you'll be a far more interesting, mysterious, fascinating human being by grabbing your genitals and facing the unknown. Change your patterns, do the wedding, do the baby, spend the money, save the money, go to school, quit school - you'll figure out a great explanation later.posted by mit5urugi at 12:32 PM on March 3 [11 favorites] I have hated this winter more than any other since 2009. Saturday was the first of March and the weather finally became amenable to doing a spot of hillwalking. After a winter of eight funerals/cremations, several friends and former work colleagues becoming ill with conditions of varying severity, and weather which seemed relentlessly cold, grey and damp, it was uplifting to stride to the Worcestershire beacon and enjoy the view towards Wales in one direction, and eastern England in the other. Also, the occasional tree. I still can't see Titterstone Clee, though.posted by Wordshore at 12:35 PM on March 3 [12 favorites] We saw Moonlight on the IMAX re-release thing last week, and man that movie is breathtaking.posted by Gorgik at 12:37 PM on March 3 [1 favorite] Pretty much most of my decisions revolve around "how much money will this cost", and secondary "how much time will this take away from other things". Otherwise, I'm pretty impulsive and it's worked well for me, when people start asking about my life they eventually get to a "you've led a very interesting life" territory. Most of it isn't that interesting, just weird and creative and I don't do the same thing forever ever (is that ADD? I'm not sure). My wife is an equal impulsive-decision-maker and she frequently says "do it" to anything I say I'm thinking of doing, and vice versa (but always conditional on the money thing). Film student update: The first weekend of filming the independent romance film is almost in the can (a couple hours tonight) which is about half of the film, all at the main characters' home, then we move to other locations. I kept to my lighting plans as best I could, keeping an eye on where highlights fall on everyone's faces so I'm pretty confident it will look good. The "dad" is an extremely black man, and they put him in a black afro wig, so I'm a little worried about how we're going to pick him up or if he's going to look like a Sideshow Bob silhouette, but I think we got him pretty good. I'm noticing a "slash of light" -- a line of highlight on the face from forehead to nose to chin, with some cheekbone -- that seems to be the key thing I'm striving for in giving a dark-skinned face some shape. I got to use my steadicam with mixed results, due to cramped quarters and fast movement; the cramped house also involved script changes and different blocking to fit the filming location (an AirBnB with cranky duplex neighbors), so a lot of camera positioning was completely on the fly, just get it as good as possible. One scene ended up just the main 5 characters standing in a row, saying their lines with no blocking, and while none of that is anything I could control --'''
