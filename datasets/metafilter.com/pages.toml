title = "Log, baby log | MetaFilter"
description = "A rarely used amendment to the Endangered Species Act allows for the creation of a committee nicknamed 'the God Squad' to take unprecedented action during emergencies like hurricanes and..."
full_description = '''Log, baby log March 2, 2025 4:38 PM Subscribe A rarely used amendment to the Endangered Species Act allows for the creation of a committee nicknamed "the God Squad" to take unprecedented action during emergencies like hurricanes and wildfires. Trump wants to convene this committee to bypass endangered species protections and other environmental regulations to ramp up timber production across 280 million acres of national forests and other public lands. Likely fallout includes increase fire risk, additional global warming, species extinction, pollution, increased wildfire intensity and richer oligarchs. posted by CheeseDigestsAll (21 comments total) 7 users marked this as a favorite (adsbygoogle = window.adsbygoogle || []).push({}); Let's be clear , the pull quote: "Mr. Trump’s plan follows recommendations found in Project 2025, a conservative policy blueprint published by the Heritage Foundation."posted by lalochezia at 4:40 PM on March 2 [10 favorites] I'm starting to think these guys don't have our best interests at heart.posted by Literaryhero at 4:45 PM on March 2 [4 favorites] And flooding. When you clearcut, you get floods.posted by ocschwar at 4:47 PM on March 2 [4 favorites] And landslides.posted by mollweide at 4:48 PM on March 2 [4 favorites] American conservatism is a death cult.posted by reedbird_hill at 5:05 PM on March 2 [9 favorites] Where is he gonna find the labor for clear cutting timber since he just cut the forest service? I'm also not an expert so I'm genuinely curious, but lumber mills and infrastructure for hauling timber doesn't exist at a large scale in the US. If the answer is privatize and give out contracts... This still takes massive public works projects. But again, please tell me if I'm missing some info here.posted by ajarbaday at 5:17 PM on March 2 [5 favorites] This is what happens when legislators leave behind gaping loopholes. Someone of bad faith walks through them.posted by criticalyeast at 5:21 PM on March 2 [3 favorites] Christ, what an assholeposted by Windopaene at 6:43 PM on March 2 [5 favorites] The Forest Service doesn’t do logging itself. It builds roads and sells leases so that private companies can do the logging. At present there isn’t really unmet demand in the US for more scraggly fir and cedar, so any additional harvest will just get shipped overseas as raw logs, producing basically zero jobs and serving only to transform our forests into more dollars in Weyerhaeuser’s pockets. The only upside is that some rural schools in Oregon and Washington might be a little better funded.posted by Just the one swan, actually at 7:01 PM on March 2 [10 favorites] OK, so this doesn't really belong in this thread, but it is related. I used to take a road trip every year from Seattle to either Minnesota or Atlanta. Yellowstone was always a stop. One day I will see Steamboat erupt, (missed it by like 9 hours on my last trip). And I am planning to head to MN this summer for my 40 year college reunion, (wow, I am too old)). And with all the firings, not so sure I want to wait in line for two hours to get in the park, (even if it is the coolest place I have every been to). I am SO ANGRY!!! I think Teddy Roosevelt would agree with my saying, "FUCK THESE FUCKING FUCKS". These are our lands. Stop wanting to give them away to the highest bidders. Ugh, have to stop now before I start quoting Woodie Guthrie and just fall into despair at all this shit. No, too late. Find a way to #Resist.posted by Windopaene at 8:16 PM on March 2 [4 favorites] Where is he gonna find the labor for clear cutting timber since he just cut the forest service? You only need the forest service if you care what and how trees are harvested. If you just want to open the forests to a free for all then they aren't needed.posted by Mitheral at 8:17 PM on March 2 [2 favorites] I hate it here I hate it here I hate it here. Clean air and water my ass. They are also rescinding NEPA by the way. It will be gone in 30 days. This is the policy that requires federal agencies to assess environmental impacts before taking action and allows 30 days for public comment. I learned about it on Tumblr, here's instructions for how to register your dissent on regulations.gov: NEPA dissentposted by subdee at 9:27 PM on March 2 [6 favorites] It's just as effective to spike a felled log as to spike a living tree, assuming you've access. I've no idea if tree spinking ever achieves much, but maybe it'd lower the value if exported to Europe. It'd maybe do little if exported to China, although maybe they'd exploit the opertunity to pay less. If someone needs to seriously damage a diesel engine, then supposedly DEF fluids (AdBlue) or sodium silicate in the fuel system works nicely, maybe most effective short-term.posted by jeffburdges at 2:27 AM on March 3 [3 favorites] It's just as effective to spike a felled log as to spike a living tree, assuming you've access. I've no idea if tree spinking ever achieves much, but maybe it'd lower the value if exported to Europe. It'd maybe do little if exported to China, although maybe they'd exploit the opertunity to pay less. Say no to tree spiking. The victim will always be an innocent worker, not a decision maker. It is mostly a beat-up accusation anyway designed to alienate people against tree huggers. Don't give the accusation common credence.posted by Thella at 2:56 AM on March 3 [3 favorites] It'd be most effective if saw mills abroad simply complained of spiked trees, and negotiated for lower prices. U.S. Forest Product Exports Set Record suggest China could make (false) spiking calims all by themselves, but corroboration by saw mills elsewhere helps enormously. Accusations matter less now, so activist could really do whatever they have risk tolerance for. Afaik injuries appear mostly theoretical, but that's also why tree spiking looks ineffective: saw blades are cheap. Instead, direct action might be more effective by simply damaging the big tree harvesters though, hence DEF fluids (AdBlue) or sodium silicate. Also, half those trees wind up as pulp and paper, but spiking does nothing against chippers. You'd need heartwood to absorb something that messes up the sodium hydroxide and sodium sulfide reactions in the first phase of the Kraft process.posted by jeffburdges at 3:43 AM on March 3 [2 favorites] It's so on brand for TFG to wake up one day, learn about robber barons, and decide they're history's forgotten heroes. I'm almost surprised it's not his kid's actual name.posted by OHenryPacey at 7:10 AM on March 3 [3 favorites] DEF is funny because it'll take 3 or 4 sabotages before management stops blaming the workers for doing it by mistake.posted by ryanrs at 10:40 AM on March 3 [3 favorites] Tree spiking is performative (and ineffective) and likely to kill loggers - I've worked in forestry. Better to do a Louigi, or intefere in the O-Ring sales/production/supply chain; logging cannot proceed without hydraulics, and O-Rings are the cheapest weakest link.posted by unearthed at 10:43 AM on March 3 [2 favorites] On the other hand o-rings are used in practically everything moving a fluid from the the engines in trucks that bring food to the pipes that supply oxygen in hospitals so maybe attacking our o-ring architecture is not the best move.posted by Mitheral at 1:02 PM on March 3 [1 favorite] yeah don't try to disrupt the supply chain of something that costs $0.10, weighs 1 gram, and has a shelf-life of 10 yearsposted by ryanrs at 2:33 PM on March 4 They deserve whatever they get.posted by aiq at 3:44 PM on March 4 « Older Finding groups by their agreement | Before Hitler: Your Turn Newer » (adsbygoogle = window.adsbygoogle || []).push({}); You are not currently logged in. Log in or create a new account to post comments. Related Posts “I am not an artifact” May 5, 2024 Nothing runs like a deer September 3, 2018 The Homeless in America's National Forests August 22, 2016 ForestFilter September 14, 2008 Pay to play... September 17, 2004 (adsbygoogle = window.adsbygoogle || []).push({}); Tags USPolitics forests PublicLands ClimateChange logging EndangeredSpecies RapeAndPillage Share Facebook'''
