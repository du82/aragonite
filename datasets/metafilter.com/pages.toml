title = '"Tell her I exploded, and tell her it was very sad" | MetaFilter'
description = "George Lowe, iconic baritone voice of cult TV classic Space Ghost Coast to Coast, dead at 67"
full_description = '''"Tell her I exploded, and tell her it was very sad" March 4, 2025 1:42 PM Subscribe George Lowe, iconic baritone voice of cult TV classic Space Ghost Coast to Coast, dead at 67Personal tribute from DJ Marvin Boone: I’m beyond devastated. My Zobanian brother and best friend for over 40 years, George Lowe, has passed away after a long illness. A part of me had also died. He was a supremely talented Artist and Voice actor. A true warm hearted Genius. Funniest man on Earth too. I’ve stolen jokes from him for decades. He stole some of mine. He was also the voice of Space Ghost and so much more. Pweeloto. Previously (in 2016): Voice actor and animator C. Martin Croker has died. Known best for his work at Cartoon Network's Williams Street, Croker voiced such classic characters as Zorak , Moltar , Dr. Weird and Steve Ghost Planet Central - a charmingly old-school source of episode and interview transcripts S7E3: Knifin' Around (ft. Thom Yorke and Björk). The rest of the series is also available free on Adult Swim's website. Space Ghost Coast To Coast - George Lowe Recording Session Interview with a 17-year-old superfan in 2004 George Lowe on the Adult Swim Podcast (2015) - on "Michael Stipe, his friendship with Clay Croker, his love of folk art, and his experience as an amateur surgeon" That time C-SPAN interviewed Space Ghost Space Ghost in the Country (h/t zaixfeep) posted by Rhaomi (30 comments total) 16 users marked this as a favorite (adsbygoogle = window.adsbygoogle || []).push({}); .posted by whuppy at 1:55 PM on March 4 .posted by Darkest Timeline at 2:00 PM on March 4 aw, man, sad news but nice to think of him/the show. .posted by LobsterMitten at 2:00 PM on March 4 . . [randomly points wrist cuff at headstone]posted by Atreides at 2:20 PM on March 4 [3 favorites] .posted by dragonplayer at 2:25 PM on March 4 .posted by The Great Big Mulp at 2:32 PM on March 4 . (one of my favorite shows, highly influenced my sense of humor)posted by Doleful Creature at 2:42 PM on March 4 Sad to hear this. SGC2C was emblematic of a period in TV where there were shows that seemed like they were made without any sort of corporate supervision or predetermined demographic and were thus amazing. George's voice lent gravitas to some decidedly zero-gravitas hijinks.posted by subocoyne at 2:53 PM on March 4 [6 favorites] .posted by gc at 3:11 PM on March 4 .posted by Hairy Lobster at 3:13 PM on March 4 .posted by brachiopod at 3:40 PM on March 4 What a shame and thanks for posting this - I was wondering if I should put an obit post together but I wasn't sure I'd be able to resist using the title "Not getting enough oxygen" which I think straddles the border between "tempting" and "tasteless" but this title is much better. And, yeah, SGC2C was so much chaotic fun - it definitely felt like the network was letting do whatever they wanted. Lowe worked in Boston radio for a while afterwards, doing voice work for WZLX and whenever I heard him on the air I would smile thinking of SGC2C. .posted by rmd1023 at 3:47 PM on March 4 [2 favorites] .posted by JoeXIII007 at 3:59 PM on March 4 floating asteroid, need to buy some school supplies, you're soaking in it.posted by Horkus at 4:04 PM on March 4 [2 favorites] .posted by BlackLeotardFront at 4:27 PM on March 4 .posted by inexorably_forward at 4:51 PM on March 4 🚀👻posted by GenjiandProust at 5:49 PM on March 4 .posted by dannyboybell at 6:30 PM on March 4 .posted by detachd at 6:38 PM on March 4 As a parent, you make an effort to get your kid interested in the old media you enjoyed. In terms of my daughter, sometimes it worked (King of the Hill), sometimes it didn't (Terry Pratchet) and sometimes it REALLY worked, as with Space Ghost Coast to Coast. My daughter and I will raise a glass of Kentucky Shark brand liquor (good thing it's fictional!) and toast his passing tonight.posted by AlonzoMosleyFBI at 6:41 PM on March 4 [2 favorites] Space Ghost was a formative show for me in the 1990s and Lowe's voice sold the lunacy with authority. . Say hi to Banjo for me, King of the Sea Monkeys.posted by myopicman at 7:05 PM on March 4 [1 favorite] . C'mon, fight me!posted by sunimplodes at 8:24 PM on March 4 .posted by neuracnu at 8:52 PM on March 4 I'll be humming this song all day.posted by late afternoon dreaming hotel at 10:01 PM on March 4 He had the same birthday as my friend and he died on mine. Freaky! One of the all-time great voices and deliveries, I just looked up what he was up to not two weeks ago. .posted by rhizome at 1:30 AM on March 5 . DragonCon won't be the same without him. Really nice guy.posted by lordrunningclam at 4:02 AM on March 5 .posted by wicked_sassy at 4:07 AM on March 5 There are some voices that really stick in your head. Mel Blanc, Paul Frees, Bea Benaderet, June Foray, George Lowe. I like to envision a Voice Actors’ Heaven where all the characters they voiced live on forever. .posted by kinnakeet at 4:46 AM on March 5 👻posted by Gelatin at 5:13 AM on March 5 .posted by Robin Kestrel at 6:13 AM on March 5 « Older Tom Petty truly belonged among the wildflowers | There’s no magic here Newer » (adsbygoogle = window.adsbygoogle || []).push({}); You are not currently logged in. Log in or create a new account to post comments. Related Posts "Greetings, citizen! Are you getting enough oxygen?" April 18, 2024 Classic Megaposts Remixed February 26, 2022 50 years of BIRDMAAAN! Hero of earth, failed... September 29, 2017 It all started with a strange disturbance on... September 10, 2011 Get your Saturday morning on September 22, 2009 (adsbygoogle = window.adsbygoogle || []).push({}); Tags GeorgeLowe SpaceGhost SpaceGhostCoastToCoast Obituary RIP VoiceActing CartoonNetwork AdultSwim Television 90s 00s Interview Podcast LinkMe Share Facebook'''
