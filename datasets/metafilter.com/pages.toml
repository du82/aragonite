title = "Popular Favorites | MetaFilter"
full_description = '''var sid = 1; function filter(sel) { var subd = {mefi:"www", ask:"ask", meta:"metatalk", fanfare:"fanfare"}; var f = sel.options[sel.selectedIndex].value if (f=="") { document.location = '//www.metafilter.com/favorites/all'; } else { document.location = '//' + subd[f] + '.metafilter.com/popular.mefi?site='+f; } } Popular Favorites Showing posts and comments from: All Sites Metafilter Ask Metafilter Metatalk FanFare Popular posts and comments marked as a favorite most often in the past seven days. Also check out a curated list of highlights at Best Of MetaFilter. You can subscribe to popular posts across all sites via RSS or Twitter and Comments via RSS. Comments Popular Posts The She Made Him Do It Theory of Everything "The rhetoric and logic of the abuse of power operates similarly at all scales, which is why I've found feminism such useful equipment for understanding authoritarians in public and political life. Because no matter what abusers take from their victims, they don't want to take the blame. And one of the prerogatives of power is to be in charge of blame, and abusers routinely exercise that power to make their own acts someone else's fault." posted by Leeway to MetaFilter on Feb 27 at 9:50 AM 46 users marked this as a favorite The world is riddled with maggots A song by Chumbawamba that isn't Tubthumping Chumbawamba is often thought of as a one hit wonder, but there's a lot more to them. They're anti-fascist, pro-union, and loved to do protest songs. This one is even more relevant now. posted by mike3k to MetaFilter on Mar 3 at 5:40 PM 40 users marked this as a favorite “You’re either going to make a deal or we’re out.” Trump Administration Live Updates: Trump and Vance Loudly Berate Zelensky in Oval Office (SLNYT, archive.ph) posted by box to MetaFilter on Feb 28 at 12:20 PM 40 users marked this as a favorite February 28th Economic Blackout USA people! Buy NOTHING Feb 28 2025. Not anything. 24 hours. No spending. Buy the day before or after but nothing. NOTHING. February 28 2025. Not gas. Not milk. Not something on a gaming app. Not a penny spent. (Only option in a crisis is local small mom and pop. Nothing. Else.) Promise me. Commit. 1 day. 1 day to scare the shit out of them that they don't get to follow the bullshit executive orders. They don't get to be cowards. If they do, it costs. It costs. posted by subdee to MetaFilter on Feb 27 at 12:58 PM 37 users marked this as a favorite Robert Bringhurst's "The Elements of Typographic Style" The Elements of Typographic Style is a book on typography and style by Canadian typographer, poet and translator Robert Bringhurst. ... A history and guide to typography, it has been praised by Hermann Zapf, who said "I wish to see this book become the Typographers' Bible." Jonathan Hoefler and Tobias Frere-Jones consider it "the finest book ever written about typography." ... Because of its status as a respected and frequently cited resource, typographers and designers often refer to it simply as Bringhurst.* posted by Lemkin to MetaFilter on Mar 3 at 8:19 PM 34 users marked this as a favorite Japanese pencils The golden age of Japanese pencils "It was the summer of 1952, and the executives of Tombow Pencil were about to revolutionize the Japanese pencil industry—or, possibly, fall flat on their faces. Hachiro Ogawa, the son of founder Harunosuke Ogawa, was Tombow's managing director, and he had just finished a years-long project, at enormous cost, to make the best pencil Japan had ever seen." [via] posted by dhruva to MetaFilter on Mar 3 at 9:57 AM 32 users marked this as a favorite Latest Zero Day: CVE-2025-HEGSETH Defense Secretary Pete Hegseth last week ordered U.S. Cyber Command to stand down from all planning against Russia, including offensive digital actions, according to three people familiar with the matter. posted by rambling wanderlust to MetaFilter on Mar 1 at 5:51 AM 32 users marked this as a favorite And so it begins The Tariff Wars have started. (slCBC) posted by Kitteh to MetaFilter on Mar 4 at 5:18 AM 32 users marked this as a favorite Engineer's Disease* Writ Large (Which We're All Now Suffering From) Silicon Valley's Reading List Reveals Its Political Ambitions [ungated] - "The tech 'canon' of books and ideas over-indexes on great men and celebrates small teams that changed the world." posted by kliuless to MetaFilter on Feb 26 at 11:59 PM 31 users marked this as a favorite Pass the Palissy Plate Bernard Palissy (1510 – c. 1589) was a Renaissance man in more ways than one; over the course of his life, he did work as a potter and ceramicist, garden designer, glassblower, hydraulics engineer, painter, surveyor, and naturalist. He is probably best known for his ceramics - dishes and platters decorated with hyper-realistic shells, snails, ferns, fish, frogs, seaweed, and other aquatic life, all cast from specimens Palissy collected and meticulous observations he'd made from specimens he'd collected. posted by EmpressCallipygos to MetaFilter on Feb 26 at 7:04 AM 30 users marked this as a favorite "Free speech and free markets." Jeff Bezos bans Washington Post opinion writers from opposing ‘free speech and free markets’ "In a move promoted as supporting freedom of speech, The Washington Post will no longer publish opinion columns that oppose the core views of Post owner and Amazon executive chair Jeff Bezos, Bezos has reportedly told staff. " (The Verge link, does not appear to be paywalled.) Opinions editor David Shipley, who is not "hell yes" over this, has now left (NYT). posted by jenfullmoon to MetaFilter on Feb 26 at 9:58 AM 30 users marked this as a favorite Kate can walk but often uses a wheelchair to get around. Here's why One in three wheelchair users are ambulatory (eg can walk a few steps). This article explains why people who can stand up for a brief moment still need a wheelchair due to severe pain; balance issues; falls; or severe exhaustion. posted by chariot pulled by cassowaries to MetaFilter on Mar 3 at 12:02 AM 29 users marked this as a favorite Timeline Cleanse NHK World presents A Cat's-Eye View of Japan, 42 5-minute episodes showing various places in Japan as seen by the cats who live there. posted by carrienation to MetaFilter on Mar 4 at 4:48 PM 29 users marked this as a favorite Moonspotting Ramadan mubarak - either a little late or right on time! For many especially in the US, Ramadan started last night. For some folks, though. it starts tonight (for this poster, 15 minutes from now, God willing). It all depends on whom you trust to see the moon... or to inform you about calculations about the moon's position. posted by rabia.elizabeth to MetaFilter on Mar 1 at 10:11 AM 29 users marked this as a favorite NYT review of MeFi's own Omar El Akkad's New Book Irish author Fintan O'Toole reviews One Day Everyone Will Have Always Been Against This by MeFi's own pre-eminent science fiction author Omar El Akkad for the New York Times. posted by y2karl to MetaFilter on Mar 2 at 5:20 PM 27 users marked this as a favorite Never gonna give up dancing at the Pink Pony Club Because somebody might need this today: Rick Astley covers Chappell Roan's Pink Pony Club. posted by signal to MetaFilter on Mar 4 at 4:16 PM 26 users marked this as a favorite The most beautiful invention of all time Its design is a chef's kiss. It can scale from love note to embracing the world. And it united countries and continents in the aftermath of war. In this short SLYT, mathematician Hannah Fry explains why she adores A4. posted by Thella to MetaFilter on Mar 3 at 5:31 PM 26 users marked this as a favorite The clarity of crossword clues meets the parsability of LISP Want to iteratively unpack a series of cryptic clues to collapse a horrifying nest of brackets to resolve down to a heavily obscured headline? Want to do it once a day? Good news: Bracket City is here to make you feel alternately like an entire idiot and then kind of a genius. posted by cortex to MetaFilter on Feb 25 at 9:46 PM 25 users marked this as a favorite "I am quite absurdly in love with him." Letters and diaries tell the story of the love between two survivors of the final Scott expedition to the South Pole. via the Atavist. posted by Well I never to MetaFilter on Mar 3 at 4:47 PM 25 users marked this as a favorite Before Hitler: Your Turn January, 1928: It is a bright time for German democracy. After a period of struggle, inflation is finally under control, and the economy is expanding steadily. In foreign policy, we have reached agreements with the Western powers and the Soviet Union that might make genuine peace a reality. Now, the task of Social Democracy is to prepare for the next election. The bourgeois-right government of Wilhelm Marx is unpopular, and we stand to gain. Social Democracy: An Alternate History: Help navigate the Social Democratic Party (SPD) through political and economic crises, contentious parliamentary elections, and the ominous rise of the Nazis in the waning years of the Weimar Republic. A text adventure simulation by Autumn Chen. posted by Rhaomi to MetaFilter on Mar 2 at 4:52 PM 24 users marked this as a favorite [more posts] Posts Popular Comments when you're a billionaire cis guy they let you get as much gender affirming care as you can afford [view] posted by BungaDunga to MetaFilter on Mar 3 at 10:00 AM 101 users marked this as a favorite I didn't cancel my subscription when that thing happened, or when that other thing happened, but I cancelled it today. [view] posted by box to MetaFilter on Feb 26 at 10:03 AM 57 users marked this as a favorite This is all starting to seem like the collapse of the free press in Russia, with all the major media outlets under the ownership of pro-regime oligarchs. [view] posted by Mr. Excellent to MetaFilter on Feb 26 at 10:22 AM 56 users marked this as a favorite Knowing how to write a simple shell script is as much a part of basic literacy as knowing how to write a 5 paragraph essay It... is not. I 