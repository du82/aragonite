title = "Posts tagged with sequel | MetaFilter"
full_description = '''var subd="www"; function incFav(b){b=b.replace(/^\s*|\s*$/g,"");var a=b.split(":"),c=a[0],e=a[1];b=a[2];var d=a[3],f=a[4],g=a[5],h=a[6];a=document.getElementById("favmsg"+d+c);pmlink=document.getElementById("plusminus"+d+c);if(g==1){pmlink.innerHTML="+";pmlink.title="Save this post as a favorite";c="addFav("+c+","+e+","+d+","+f+",'"+h+"');return false;"}else{pmlink.innerHTML="&minus;";pmlink.title="Remove this post as a favorite";c="delFav("+c+","+e+","+d+","+f+",'"+h+"');return false;"}pmlink.onclick=new Function(c);if(b=="You already made this a favorite."){a.hasChildNodes()&&a.removeChild(a.firstChild);a.appendChild(document.createTextNode(" "+b))}if(b==parseInt(b)){a.hasChildNodes()&&a.removeChild(a.firstChild);a.appendChild(document.createTextNode(g==1?" Favorite removed!":" Favorite added!"))}}; 46 posts tagged with sequel. Displaying 1 through 46 of 46. Subscribe: John Frankenheimer's "French Connection II" "Hackman was fantastic here, never stopping with the full-blown intensity, consistently providing Doyle with a vital integrity that always made you care, no matter how harsh the character spoke or behaved. And it goes without saying that Frankenheimer, ever the reliable craftsman, shot the hell out of the film with his director of photography Claude Renoir, giving it that rough and tumble 70’s aesthetic that we all love so much in present day. Many, many people have seen The French Connection. Not enough people have seen French Connection II. I’d like that to change."- Nick Clement [more inside] posted by Lemkin on Feb 28, 2025 - 7 comments Sometimes things are okay After nearly twenty years contending with pastel trickster gods [previously], limited-animation cryptids [previously], absurdist undersea novelty songs, assorted devious traps, and most recently a 40-minute magnum opus featuring a nonbinary pangolin anthropologist, tutelary weasels, a lovelorn starfish, and a world-ending cube [previously], Charlie the Unicorn finally enjoys a moment of peace. [more inside] posted by Rhaomi on Dec 25, 2024 - 5 comments The moral of Romeo and Juliet is that they die at the end In 1985, Folgers Coffee aired "Peter Comes Home For Christmas", a heartwarming ad about bringing family together. A quarter century later, they aired the remake, "Coming Home" -- a headscratching ad that brought family a little too close together. GQ's 10th anniversary retrospective [previously] thoroughly explored the ad's background and cultural impact, from "subtle" recuts and parodies to fanart and an entire genre of "Folgerscest" stories. Four years later, voluble and hyperkinetic YouTuber-musician extraordinaire CJ the X went on a sincerely empathetic deep dive into the greatest of these works -- the sweeping romantic tragedy "A Home For All Seasons" -- and what it says about the nature of love, grief, and how the relentless march of time brings bittersweet closure to us all. #buyfolgerstoday posted by Rhaomi on Dec 24, 2024 - 28 comments Are the fires of Hell a-glowing? More than two decades after the original film popularized the "fast zombie" craze, we finally have our first look at Danny Boyle's long-awaited return to horror, and one of the best trailers in years: 28 YEARS LATER. Though the trailer's terrifying, cultlike atmosphere and snatches of atavistic violence are intriguing, the real star is the soundtrack: a tinny, 110-year-old poetry reading whose hypnotically repetitive words tromp relentlessly from prim recitation to jangling nerves to a hysterical, nightmarish climax. The poem, Rudyard Kipling's "Boots", was originally written to memorialize (and echo) the wretched forced marches of the Second Boer War (as former Navy SEAL Jocko Willink recites/explains), its grim refrain a verse from Ecclesiastes on the inevitability of death. The howling rendition from the trailer, made by early film star Taylor Holmes in 1915, has long been used by elite SERE training schools to psychologically break recruits. 2spooky4u? There are plenty of alternatives: pioneering composer Kay Swift at age 14 (1911) - the sonorous Peter Dawson (1930) - the melodramatic Eric Woodburn (1935) - the operatic Leonard Warren (1951) - folksy anarchist Leslie Fish (1991) - or cleanse the palette with the goofy Red Skelton parody, "Frogs." posted by Rhaomi on Dec 10, 2024 - 89 comments Dancing hands? Daft Hands - Harder, Better, Faster, Stronger is a classic and well-liked YouTube video from the early days of YouTube in 2007 (previously). But there's also a more experimental followup(?) from 2018 that received a more... mixed... response: Daft Hands 2 - The Daftening (tw skull). Some YouTube comments "beggining of the video: omg finally a sequel after 10 years / finished the video: i'm spooked" and "So glad i turned on post notifications lmao / Edit: Ok never mind I wish I never saw this.". The pinned comment is "2X speed / You’re welcome... |:)" posted by skynxnex on Dec 6, 2024 - 10 comments A bigger, better train for Conductor Whiskers Yesterday, mobile game developer Hit-Point quietly announced Neko Atsume 2, coming this summer to Android and iOS. [more inside] posted by May Kasahara on Feb 22, 2024 - 21 comments Vince Gilligan was absolutely not under the influence of any drugs ... ... during the writing process for this production. Breaking Bad 2 (official trailer). WARNING: pretty damned graphic etc. posted by philip-random on Aug 24, 2023 - 26 comments just revel in the absurdity and exhilaration of it all The Legend of Zelda: Tears of the Kingdom changes the conversation By Mike Mahardy [Polygon] “If, as with music, movies, TV, or books, we can look at Tears of the Kingdom as a dialogue between creator and audience, then Nintendo has effectively changed the conversation. Historically, when Zelda players asked Nintendo, “Can I do this?” the answer was usually “no” or “not yet.” Breath of the Wild often answered in the affirmative, but Tears of the Kingdom takes that response one step further: When pressed as to whether something is possible in this enormous, absurd, mysterious world, Nintendo doesn’t just try to say “yes.” It strains to say “yes, but also...”” posted by Fizz on May 13, 2023 - 183 comments Link will be taking to the skies on May 12, 2023! The Legend of Zelda: Tears of the Kingdom [Official Trailer #2] [Official Trailer #1] [First Look/Teaser] “After years of waiting, Nintendo finally pulled back the curtain a little more on what fans can expect from The Legend of Zelda: Tears of the Kingdom. A snazzy new gameplay trailer revealed a ton, including a world that’s more than just a reskin of the one from Breath of the Wild. It starts with an unknown voice calling on its minions to destroy the world, followed later on by Zelda warning Link that he might not be table to take on the new threat poised by the strange zombified demon who sure bears a resemblance to Ganondorf from earlier Zelda games. Plus there’s Link riding a hot air balloon, tractor, and more. Previous trailers made it clear that Link will be taking to the skies in much of Tears of the Kingdom, both in terms of teleporting up to floating islands and making use of a new glider to cover long distances. The hero of time also sports a new magic glove this time around which augments some of the physics-based abilities from the first game and even includes a flamethrower mode.” [via: Kotaku] posted by Fizz on Feb 17, 2023 - 77 comments Best golf movie ever? Caddyshack. Worst golf movie ever? Caddyshack 2 Sports Illustrated from 2020: The Inside Story of Caddyshack II, One of the Worst Sequels in History [more inside] posted by porn in the woods on Mar 14, 2022 - 46 comments Another day in Pontypool Originally released back in 2008, Canadian indie horror flick Pontypool [trailer] is a modern zombie tale quite unlike any other. Loosely based on a dense, complicated novel by Tony Burgess and inspired by Orson Welles' War of the Worlds, it tells the story of Grant Mazzy, a grumbling yet likable radio host (played by veteran character actor Stephen McHattie) whose penchant for philosophical ramblings gets him booted from Toronto to the sleepy winter pastures of Pontypool, Ontario. One bleak morning, as the outspoken Mazzy chafes against no-nonsense producer Sydney Briar (played by McHattie's wife Lisa Houle!), disturbing news begins rolling in of a series of bizarre and violent incidents sweeping the town. Trapped in their church basement broadcasting booth, Mazzy, Briar, and intern Laurel-Ann Drummond struggle to understand the odd nature of the crisis and warn the wider world before it's too late. But this is no ordinary virus, and they find their efforts may be causing far more harm than good. You can watch the film on YouTube or Kanopy, but if you're pressed for time you can also experience it in its more logical form: as a one-hour BBC radio drama [Archive.org audio version] voiced by the original cast (albeit with a different ending). And after the credits, make sure not to miss the film's playful non-sequitur coda [analysis] -- which was spun off into the buckwild 2020 "sequel" Dreamland starring McHattie, Houle, Juliette Lewis, and Henry Rollins. [more inside] posted by Rhaomi on Feb 24, 2022 - 28 comments This Post is Contractually Obligated to have a Title Hey, remember that Blazing Saddles TV series that ran for four seasons? [more inside] posted by GhostintheMachine on Jan 31, 2021 - 31 comments REꓷЯUM Doctor Sleep [YouTube][Trailer] posted by Fizz on Jun 13, 2019 - 45 comments “COME, LINK…. LET US AWAKEN…TOGETHER!!” The Legend of Zelda: Link’s [re:]Awakening [YouTube][Switch Trailer] [Original Gameboy Gameplay] “Nintendo is bringing the 1993 Game Boy classic adventure The Legend of Zelda: Link’s Awakening to Nintendo Switch later this year. The re-release is more than just a Virtual Console-style release, it’s a complete 3D “reimagining” of the classic Zelda adventure. As Link, players will once again return to the island of Koholint for new adventures. While the new Link’s Awakening will retain the top-down — and occasionally side-scrolling — view of the Game Boy original, the Switch remake will use 3D models and employ a stylish, toy-like aesthetic.” [via: Polygon] [more inside] posted by Fizz on Feb 21, 2019 - 32 comments Every con has its pros. OCEAN'S 8 [YouTube][Trailer] Starring Sandra Bullock, Cate Blanchett, Anne Hathaway, Mindy Kaling, Sarah Paulson, Awkwafina, with Rihanna and Helena Bonham Carter. posted by Fizz on Dec 20, 2017 - 96 comments Mr. Vampire (and kin) - experience the adventure! Embrace the darkness! Clear some time for kung fu comedy with spooks and spirits, because here comes Mr. Vampire (YT, trailer)! While the Sammo Hung production isn't the first Hong Kong comedy horror fighting film to feature a jiangshi, or hopping corpses or vampires of Chinese folklore, it's the one that created a franchise and inspired numerous sequels and tributes. As a successful special effects driven 80’s comedy, it is often compared to Ghostbusters, but, you know, with martial arts. Let's dive into the world of Chinese folklore in HK comedy horror! [more inside] posted by filthy light thief on Oct 14, 2017 - 12 comments Hella....yeah! Life is Strange: Before the Storm: Life sucks when you’re a teenager, man [Ars Technica] “Following the surprise success of 2015's Life Is Strange—Dontnod's episodic tale of teenage rebellion—we expected publisher Square Enix to return with a sequel. Less expected, though, was the E3 2017 reveal of Life Is Strange: Before the Storm, a prequel that tells the story of series star Chloe Price during her formative years. Dontnod isn't behind the prequel, with development duties instead handed off to Deck Nine Games. While the cynics out there may call this a cash-in, Before the Storm has its moments—at least if the E3 demo is anything to go by. The biggest change—aside from a range of new locations alongside familiar ones—is that Before the Storm ditches the time travel mechanic of the original and lays the teenage melodrama on thick. The strength of Life Is Strange was always in its writing, where it masterfully touched on complex topics like addiction, cyberbullying, and suicide. Before the Storm deals with its own difficult themes.” [more inside] posted by Fizz on Jun 15, 2017 - 19 comments "I did your job once. I was good at it." The new Blade Runner 2 trailer is out. Replicants and their opponents are at it again. [more inside] posted by doctornemo on May 8, 2017 - 121 comments Everybody get up, it's time to slam now It was twenty years ago today Michael Jordan taught the toons to play They've never gone out of style Even though we thought we’d wait a while So may I introduce to you The act you've known for all these years Bugs et cetera vs. the Monstars again posted by Etrigan on Nov 16, 2016 - 27 comments ᵒᴼᵒ☼)===> 'The Rocketeer' Reboot in the Works From Disney [The Hollywood Reporter] “The new take keeps the story in a period setting and offers a fresh view on the characters. Set six years after the original Rocketeer and after Secord has vanished while fighting the Nazis, an unlikely new hero emerges: a young African-American female pilot, who takes up the mantle of Rocketeer in an attempt to stop an ambitious and corrupt rocket scientist from stealing jet-pack technology in what could prove to be a turning point in the Cold War.” posted by Fizz on Jul 30, 2016 - 51 comments My other lawn, its shredded First Trailer for Netflix's 'Crouching Tiger, Hidden Dragon' Sequel Debut posted by infini on Dec 7, 2015 - 49 comments Old habits ...die hard. Somebody took out a full page ad in The Hollywood Reporter to pitch a Die Hard sequel posted by The Whelk on Nov 12, 2015 - 60 comments 웃 i am not here and this is not really happening. After the triumph of OK Computer, Radiohead fell into a creative tailspin -- and frontman Thom Yorke into a nervous breakdown. Exhausted from touring, hounded by press, and jaded by copycats, he escaped into the electronica scene pioneered by Kraftwerk and Warp Records -- fertile ground, the band discovered. Trading spacey rock for apocalyptic brooding, they teased their new sound not with singles or music videos but with innovative web streaming and cryptic, dreamlike "blips" -- winterlands, flocks of cubes, eyeballs, bears. After nearly breaking up over tracklist angst, they cut the kid in half. Thus fifteen years ago today, Kid A and (later) Amnesiac debuted, a confounding mix of electronic fugue, whalesong, pulsing IDM, drunken piano, and epic jazz funeral whose insights into anxiety, political dysfunction, and climate crisis would make it one of the most revered albums of the twenty-first century. See the documentary Reflections on Kid A for interviews and live cuts, or look inside for much more. [more inside] posted by Rhaomi on Oct 2, 2015 - 63 comments "The movies’ premise is ludicrously simple (emphasis on ludicrous):" Universal Soldier may be the only series whose DTV sequels are its best work '''
