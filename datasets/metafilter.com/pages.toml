title = "Just one more sprite bro | MetaFilter"
description = "Nine is a deceptively simple demo breaking free of the Commodore 64's famous 8 hardware sprite limit. Its creator has made an accessible explanation of the numerous tricks used to make it..."
full_description = '''Just one more sprite bro March 2, 2025 4:05 AM Subscribe Nine is a deceptively simple demo breaking free of the Commodore 64's famous 8 hardware sprite limit. Its creator has made an accessible explanation of the numerous tricks used to make it possible. posted by grahamparks (29 comments total) 17 users marked this as a favorite (adsbygoogle = window.adsbygoogle || []).push({}); The only way of discovering the limits of the possible is to venture a little way past them into the impossible. -- Arthur C Clarke Human ingenuity never ceases to amaze me. The greatest creativity comes from pushing through seemingly impossible constraints. This was a fun watch for a Sunday morning. Thanks for sharing.posted by robot_jesus at 4:44 AM on March 2 The greatest creativity comes from pushing through seemingly impossible constraints. Yep. Now we just brute force everything and everything is terrible. It's kind of funny. We started 3D with RISC chips programmatically calculating the color of each pixel and writing it to the frame buffer (i.e. Acorn, SuperFX, 32X, V1000), then we accelerated the pipeline in hardware using fixed function ASICs to speed things up, and now we've gone full circle back to basically calculating the color of each pixel using raw ALUs.posted by Your Childhood Pet Rock at 4:54 AM on March 2 Would somebody very kind mind summarizing what was in the video in text?posted by seanmpuckett at 5:48 AM on March 2 [1 favorite] Check out the author's blog for some more text-centric explanation (though it also embeds the video) The auto-generated transcript of the video seems pretty reasonable in quality, so you might also give that a look if you don't care to watch the (whole) explainer video. Anyway, here's my human summary: The video starts with a discussion of the limitations and quirks of the Vic-II graphics chip. For folks who don't know the Commodore's graphics system well (like me) this explains why some things that didn't even look like special tricks were actually tricky. Then each of the major tricks is explained in turn: Basic sprite multiplexing, placing sprites over the left/right border while still showing the magician by seamlessly transitioning the magician from character graphics to sprite graphics (this is the one I didn't even realize "was a trick", but I did after the explanations). The bulk of the video, though, covers the more involved tricks to create the part of the video where the moving numbers don't have a clean vertical separation, such that they all appear "on the same raster line". This part is achieved through a number of different effects, with the part where the numbers are ALSO above the top black border is the most intricate. This is also the part that the text portion of the article spends a lot of time on.posted by the antecedent of that pronoun at 6:09 AM on March 2 [2 favorites] "One thing you should have been asking yourself throughout the demo..." There was a question, but not that one. I was asking "What has his involvement with the C64 been throughout his lifetime? Did he have his love for "8-bit computers and the sounds they make" before he met the C64, or did it arise from the relationship with the C64?"posted by the Real Dan at 8:39 AM on March 2 I don't know Linus's full history but his page on csdb shows involvement in the scene going back to '97 (attended Hype 97) and has music going back to at least 2001. Personally, I became a fan of lft around the time of a mind is born (2017).posted by the antecedent of that pronoun at 9:01 AM on March 2 [5 favorites] a mind is born is mind-blowing.posted by mayoarchitect at 9:41 AM on March 2 [1 favorite] This is the first Linus demo that I found underwhelming. Yes, it's absurdly clever if you know the weird quirks of the Vic-II chip, but it needed the explanation to show why it was clever.posted by scruss at 9:57 AM on March 2 [2 favorites] The music in this demo is really good. The comparison to a magic trick is very apt - magicians will repeat the same effect in different ways so even if you suspect a single move, the next time will appear to disprove your ideas. Here, the trick starts off with a simple effect. Nine sprites are pretty easy to achieve if they don't overlap vertically. But then they start moving in ways that require more tricky but still known tricks. And then they start doing what should be impossible as they overlap the top border region which all overlapping. The explanation of the effort it took to get this simple looking effect is mind-blowing. I think it was Penn Jillette who said that if the only way you can explain a magic trick is by imagining the magician practicing for a thousand hours then the magician has probably practiced for a thousand hours. I don't know how long this took but the precise timing required to get the masking right must have taken not a little effort.posted by AndrewStephens at 10:22 AM on March 2 [3 favorites] I think that's fair, scruss (though I loved it to start and merely loved it better when the explanation dropped). The Massively Interleaved Sprite Crush effect from Lunatico is possibly another effect that would leave you saying: I don't see the big deal. The "it's only 256 bytes" aspect of a mind is born is pretty easy to explain, vs all the tricks that go into MILC or nine.posted by the antecedent of that pronoun at 10:24 AM on March 2 how useful are these techniques for actual games? is there any CPU left to do anything? The greatest creativity comes from pushing through seemingly impossible constraints....Yep. Now we just brute force everything and everything is terrible. I think this is a fucking wretched take. cheap CPU democratizes technical creativity. one shouldn't have to be a nine-woz boffin in order to make a computer do fun / beautiful things. To lament that reeks of gatekeeping. I apologize if I've misunderstood your point with this hot take.posted by Sauce Trough at 10:46 AM on March 2 I posted about this yesterday on our blog Set Side B! I considered posting it here too, but I constantly ask myself when posting something here if it's too obscure for most people to enjoy? Often I stray in the side of posting it anyway, and it'll be mostly ignored. It's good to see some discussion on this here.posted by JHarris at 11:20 AM on March 2 [2 favorites] To Sauce Trough first paragraph: Maybe? But as the explainer video makes clear, the digits at the top of the screen are possible because they constructed their digit graphics carefully, and the effect wouldn't work with arbitary graphics. To their second paragraph: I think that's not giving Your Chilldhod Pet Rock enough credit? The whole point of this demo is to present something that shouldn't be possible. It's a magician's trick, and that's interesting for itself. On any other hardware it would be unremarkable. That's proof that there's something to what they say. But it's not like you're wrong, either. It's nice that people who haven't been studying an old hardware platform for 40 years can also make art. Anyway, back to the VIC-II chip. My favorite trick is that someone discovered how to do much more flexible scrolling with the chip, nearly NES-style, full second-screen scrolling. That's always been the biggest barrier to doing Mario-style games on the Commodore 64, that the offscreen "buffer" amounts to one or two columns of characters. But it's possible to scroll the screen more arbitrarily, but with bizarre consequences. Doing that messes with the timing of the VIC-II chip; the VIC-II chip is also responsible for refreshing the C64's Dynamic RAM; the trick means that some of memory misses its refresh time limit; meaning, doing this causes some of the bits of the computer's memory to lose their data, possibly/probably resulting in program crashing unless the code takes special pains, like not using that portion of memory or else storing data there where the high-order bit isn't important.posted by JHarris at 12:26 PM on March 2 [1 favorite] I'll have a look at that link in full, JHarris, but it seems that brings us full circle back to Linus, who wrote up the "Safe VSP" technique in 2013. Now, from what I saw the 2015 article you linked seems to think VSP is inherently unsafe (and this would be after Linus' Safe VSP), so now I'm curious to read through it all for myself.posted by the antecedent of that pronoun at 12:57 PM on March 2 [1 favorite] oh hey look at that, "kudos to lft" just below where I'd scrolled to in the bumbershootsoft article.posted by the antecedent of that pronoun at 12:58 PM on March 2 The only thing I remember/understood about sprites on the C64 was that the byte or variable or chunk of memory that contained the sprite's y-coordinate was too small to contain all the values needed for the whole screen. So just to move a sprite from one side of the screen to the other, you had to be constantly keeping track of whether it was on the left or right side of a line about 3/4 of the way across and tell the computer whether y=12 meant this y=12 or the other y=12. Or do what I did which was make a game where the sprite only needed to go 3/4 of the way across the screen.posted by straight at 2:09 PM on March 2 [2 favorites] (please feel free to explain what I got wrong there because I'm sure something is inaccurate about it)posted by straight at 2:12 PM on March 2 Except that the "across the screen" coordinate is customarily X, that sounds exactly right. Besides which you had to do bit arithmetic because the upper bit of all the sprites' X coordinates were stored within the same register.posted by the antecedent of that pronoun at 2:15 PM on March 2 Yea, I meant to say x-coordinate (forehead palm emoji)posted by straight at 2:27 PM on March 2 [1 favorite] the antecedent of that pronoun, that sounds like the trick I was referring to, but a more refined explanation of it, so yours is probably more correct than mine.posted by JHarris at 3:46 PM on March 2 goddamn he's doing some insanely tense timing for this thing, I know enough about the c64 to be completely amazed.posted by egypturnash at 4:12 PM on March 2 [1 favorite] Amazing demo, definitely one of those magic tricks to impress other magicians. This is bringing back memories. I did not play much with the VIC II, but for me the “programming is fun” switch flipped when I found out how to play with the SN76489 sound chip in the Micro BBC computers at school. Three square wave and one noise generator, with frequencies I believe between 100 and 100,000 htz. I built the best, and probably first, command line realistic fart sound simulator. With parameters for duration, volume, root pitch, wetness, dryness, and “whistle”. It also had what I know now is called attack, decay, envelope, quantization, and brown noise (I had learned about brownian motion trying to create a “wandering” turtle in LOGO). I almost got in trouble, but the assistant principal could not keep a straight face and I was just restricted from being in the computer room during recess. I spent little time with the C64, but is it my favorite computer ever. I did spend some time playing with Agnus, Denise, and Paula on the Amiga 500.posted by Dr. Curare at 4:40 PM on March 2 [1 favorite] I never got to play with an Amiga, my family couldn't afford one even though I always wanted to use one. I wonder what would have become of my life if I had?posted by JHarris at 5:53 PM on March 2 [1 favorite] brown noise Tee heeposted by Sebmojo at 11:27 PM on March 2 I think this is a fucking wretched take. cheap CPU democratizes technical creativity. one shouldn't have to be a nine-woz boffin in order to make a computer do fun / beautiful things. To lament that reeks of gatekeeping. We have increased our computing power by 5 orders of magnitude the last 40 years and almost everything mechanical that used to have instant feedback still feels like we're wading through molasses when we put it into the digital domain with software. A good example is my car dashboard. In older cars a boost gauge is a mechanical process taken straight off the vacuum line of the manifold and you get instant feedback on the manifold pressure. In my car it's all controlled by the ECU and fed into an LCD on the dash. It has a massive delay in updating, somewhere around 500ms per frame, and it's absolutely useless. This isn't a limitation of technology. The ECU in my car has a thousand times more power than a Gameboy Advance that can drive an LCD screen of similar resolution at 60Hz. It's a limitation of economics and general care in our software design. We're given more power and instead of using it to make better things we use a substantial portion to make things cheaper. So when we do try to make better things it's all gummed up by layers of economic decisions of the past. So we get stupid things like unresponsive touch screens that are incredibly frustrating to use, even though most people can't articulate why - they just know something is wrong, compared to older tactile controls. Stupid things like noticeable shader stutter even though we have an amount of power in our hardware that was completely unimaginable only a decade ago. You're not wrong that having democratized technical creativity is awesome but what use is it if we just squander it over and over for economic reasons? We used to care about things because we had to. Our limitations forced us to be creative and build things with care. But we stopped caring about the experience when we commoditized because it was more economical and despite the hardware of today being more powerful than god we more often than not have awful experiences using most of our everyday digital devices even after decades of "innovation".posted by Your Childhood Pet Rock at 3:19 AM on March 3 [4 favorites] For another example: the humble ATM. Computing hardware and network connections are cheaper and faster than ever before, but every step of the user experience at the ATM is far slower than it was more than thirty years ago. It doesn’t need to be, but it is.posted by Songdog at 7:34 AM on March 3 [2 favorites] → I built the best, and probably first, command line realistic fart sound simulator As a BBC Micro owner, retrocomputing researcher and very childish person, this *has* to live again. What can we do to make this happen? VCF East is just over a month away, and its theme is "The Sound of Vintage" ... You know you want to ...posted by scruss at 8:01 AM on March 3 [1 favorite] We have increased our computing power by 5 orders of magnitude the last 40 years and almost everything mechanical that used to have instant feedback still feels like we're wading through molasses when we put it into the digital domain with software. Amen to that whole comment. There are a few nice exceptions. Most of you programmer types probably know about this or something better but the Everything hard drive search tool for Windows brought back for me the feeling of using an SSD for the first time. You type any s'''
