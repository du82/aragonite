full_description = "h3 { margin-top: 2em; margin-left: 20px; } h4 { margin-top: 1em; margin-left: 20px; font-size: 11pt; } .subsite-metafilter h3, .subsite-metafilter h4 { margin-left: 0; } li { margin-top: 0.5em; } .dont li strong, .do li strong { font-weight: bold; display: block; } .subsite-metafilter .do li strong, .subsite-metafilter .dont li strong { font-size: 110%; } MetaFilter Steering Committee The Steering Committee is a group of Mefites who set and implement site policies and priorities, direct and approve budget expenditures, and act as spokespeople, champions, and mediators for concerns of community members. The Steering Committee was formed in August 2022, in order to move towards a more community-governed model for MetaFilter. If you have any suggestions, feedback, questions, or concerns for the Steering Committee, please email metafiltersc@gmail.com. If you would like to volunteer to help with special projects please fill out this form. Updates Detailed agendas and minutes for the monthly Steering Committee meetings are coming soon. In the meantime, you can find major updates here: Nov 2, 2022: MetaFilter Financial Update, November 2022 Oct 24, 2022: 2022 Fundraiser announced Oct 3, 2022: Steering Committee Check-In: October 2022 Aug 29, 2022: Inaugural Steering Committee announced What the Steering Committee does The Steering Committee operates under a charter created by the Transition Team in July 2022. How Steering Committee members are chosen The members of the inaugural Steering Committee were chosen using a mix of community voting and selection by the Transition Team from a slate of self-nominated candidates."
