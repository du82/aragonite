full_description = '''var subd="www"; function incFav(b){b=b.replace(/^\s*|\s*$/g,"");var a=b.split(":"),c=a[0],e=a[1];b=a[2];var d=a[3],f=a[4],g=a[5],h=a[6];a=document.getElementById("favmsg"+d+c);pmlink=document.getElementById("plusminus"+d+c);if(g==1){pmlink.innerHTML="+";pmlink.title="Save this post as a favorite";c="addFav("+c+","+e+","+d+","+f+",'"+h+"');return false;"}else{pmlink.innerHTML="&minus;";pmlink.title="Remove this post as a favorite";c="delFav("+c+","+e+","+d+","+f+",'"+h+"');return false;"}pmlink.onclick=new Function(c);if(b=="You already made this a favorite."){a.hasChildNodes()&&a.removeChild(a.firstChild);a.appendChild(document.createTextNode(" "+b))}if(b==parseInt(b)){a.hasChildNodes()&&a.removeChild(a.firstChild);a.appendChild(document.createTextNode(g==1?" Favorite removed!":" Favorite added!"))}}; 8512 posts tagged with art. Displaying 1 through 50 of 8512. Subscribe: Robert Bringhurst's "The Elements of Typographic Style" The Elements of Typographic Style is a book on typography and style by Canadian typographer, poet and translator Robert Bringhurst. ... A history and guide to typography, it has been praised by Hermann Zapf, who said "I wish to see this book become the Typographers' Bible." Jonathan Hoefler and Tobias Frere-Jones consider it "the finest book ever written about typography." ... Because of its status as a respected and frequently cited resource, typographers and designers often refer to it simply as Bringhurst.* [more inside] posted by Lemkin on Mar 3, 2025 - 16 comments Al Schmitt For his work on more than 150 Gold and Platnium records, audio legend Al Schmitt won 22 Grammy Awards - more than any other engineer or mixer. In 2014, he became the first engineer honored with a star on the Hollywood Walk of Fame. He was beloved of his colleagues. In short, he was the GOAT. [more inside] posted by Lemkin on Mar 2, 2025 - 4 comments Don Ellis "Don Ellis led one of the most colorful big bands in the history of jazz from 1966 until 1978. Ellis's big band was distinguished by its unusual instrumentation, the exploration of uneven or odd time signatures, its occasional humor, and its openness to using rock rhythms and electronics. His orchestra achieved enormous popular appeal at a time when the influence of big band music was noticeably fading. Ellis applied his knowledge of the music of non-Western cultures to the rhythmic language of jazz. He was one of the first to have accomplished such a fusion of ideas, and his work stands as a memorial reflecting a significant stage in the evolution of jazz." [more inside] posted by Lemkin on Mar 2, 2025 - 6 comments John Frankenheimer's "French Connection II" "Hackman was fantastic here, never stopping with the full-blown intensity, consistently providing Doyle with a vital integrity that always made you care, no matter how harsh the character spoke or behaved. And it goes without saying that Frankenheimer, ever the reliable craftsman, shot the hell out of the film with his director of photography Claude Renoir, giving it that rough and tumble 70’s aesthetic that we all love so much in present day. Many, many people have seen The French Connection. Not enough people have seen French Connection II. I’d like that to change."- Nick Clement [more inside] posted by Lemkin on Feb 28, 2025 - 7 comments I would like to be less of a stranger to myself I considered Lucian Freud’s paintings of me, where I was the model, not the artist. They were all made when I was a young woman—the first when I was twenty, the last when I was twenty-seven. I have never sat for another artist since, yet the label of “muse” has stuck. It is a frustrating and corrosive feeling to be compartmentalized in this way. I wondered whether I could undermine the lazy public labeling so that I could be seen as the artist I am. from Painting Myself by Celia Paul [NYRB; ungated] posted by chavenet on Feb 26, 2025 - 6 comments Sam Rivers "Few, if any, free jazz saxophonists approached music with the same degree of intellectual rigor as Sam Rivers; just as few have managed to maintain a high level of creativity over a long life. Rivers played with remarkable technical precision and a manifest knowledge of his materials. His sound was hard and extraordinarily well-centered, his articulation sharp, and his command of the tenor saxophone complete. Rivers' playing sometimes had an unremitting seriousness that could be extremely demanding, even off-putting. Nevertheless, the depth of his artistry was considerable. Rivers was as substantial a player as avant-garde jazz ever produced." - Chris Kelsey [more inside] posted by Lemkin on Feb 24, 2025 - 3 comments Waffle’s Revenge If you didn't want clouds or houndstooth, Windows 95 offered the option to tile 8x8 pixel 1-bit patterns on your desktop. Stored as eight decimal numbers describing the bit pattern of each row. [more inside] posted by lucidium on Feb 24, 2025 - 22 comments Led Zeppelin's "Physical Graffiti" Turns 50 “Physical Graffiti remains the band’s definitive statement, and rock’s ultimate double album. Unlike some of their earlier work, it does not suffer from overfamiliarity, and is the culmination of what they had achieved up to that point. As far as many fans are concerned, the record marked the end of the band’s reign of supremacy through the first half of the decade, and while these songs have been ranked, there is not a bad note on this LP. Led Zeppelin would not reach this artistic pinnacle again.” [more inside] posted by Lemkin on Feb 24, 2025 - 23 comments Davie504's Bass Around Sthe Sworld Davie504 has successfully stopped bassists from India, Brazil, and Korea. But can even he play a 24-string bass? [more inside] posted by Lemkin on Feb 23, 2025 - 11 comments George Lynch In my dreams (no pun intended), I play rock guitar like George Lynch. [more inside] posted by Lemkin on Feb 22, 2025 - 6 comments Fiona Apple, singer Fiona Apple in the recording studio, stealing The Waterboys' "The Whole of the Moon" like a master thief. [more inside] posted by Lemkin on Feb 22, 2025 - 16 comments Samuel Roth "Though frequently remembered as a pornographer, Roth importantly shaped the Modernist movement by compelling many of its key players to think more seriously about issues of censorship, artistic freedom, and literature’s relationship to the law. Roth dedicated the first issue of Two Worlds Monthly to Joyce, “who will probably plead the cause of our time at the bar of posterity.” And indeed, Ulysses has become a testimony to the great experimental achievements of Modernism. In publishing Two Worlds Monthly, Roth hoped to carve out a sphere in which these daring Modernist authors could exercise creative freedom, particularly in scandalous yet realistic portrayals of human sexuality." [more inside] posted by Lemkin on Feb 21, 2025 - 2 comments The Savage Adventures of Flaming Carrot, The Strangest Man Alive "One of the sources of richness within the medium [of comics] has long been the play between creators who favor naturalism versus absurdity. Coming down squarely in the latter camp is Bob Burden who dreamt up one of the most surreal series in comics’ history: Flaming Carrot Comics." [more inside] posted by Lemkin on Feb 20, 2025 - 27 comments The Sign Stands in Rigid Silence FISH IS BACK [more inside] posted by Admiral Viceroy on Feb 20, 2025 - 5 comments The Peter Brötzmann Octet's "Machine Gun" "This historic free jazz album is a heavy-impact sonic assault so aggressive it still knocks listeners back on their heels decades later. Recorded in May 1968, Machine Gun captures some top European improvisers at the beginning of their influential careers, and is regarded by some as the first European — not just German or British — jazz recording. Originally self-released by Peter Brötzmann, the album eventually came out on the FMP label, and set a new high-water mark for free jazz and 'energy music' that few have approached since." - AllMusic [more inside] posted by Lemkin on Feb 20, 2025 - 13 comments The book covers of Stanisław Lem’s "Solaris" "The covers of the book depict some form of the cosmos, the planet, the ocean, and occasionally a lonely man facing it. However, while the 1960s and 1970s were characterized by hallucinogenic, sprawling, or more abstract visions, more recent editions have a more streamlined design." [more inside] posted by Lemkin on Feb 19, 2025 - 12 comments Black Flag gig flyers Black Flag gig flyers (96.4 MB PDF) [more inside] posted by Lemkin on Feb 18, 2025 - 12 comments Stanisław Lem's "A Perfect Vacuum" "A book like A Perfect Vacuum, a collection of reviews of non-existent books, is more akin to Borges than Heinlein. ... a book filled with ideas — in the form of compacted micro-books. The device of using faux-literary criticism for the launching of bold philosophical queries in miniature is novel, if not utterly brilliant. The execution is deadpan, believable, and totally hilarious." [more inside] posted by Lemkin on Feb 18, 2025 - 37 comments Write, Action, Chimera! A federation of publishers operating on different scales and with different capacities would allow for new cartographies of knowledge where non-overlapping disciplinary fragments, hypotheses, and other research ingredients from different disciplines could be put into play in a rich cognitive setting. By establishing a relative disciplinary cohabitation, a federation of publishers would be positioned to address fragments and bodies of knowledge in a horizontal fashion, while remaining totally independent from the formation and the institution of these very same disciplines. from Federating Publishers: From Conceptual Comics to a Creative Europe Initiative [e-flux] posted by chavenet on Feb 18, 2025 - 5 comments From camera angles to character development “Storyboarding is an integral part of the process,” said the exhibition’s curator Melissa Harris. “Visually setting a scene and then plotting out its ebbs and flows may help the film team consider relationships between characters, figure out how to advance the narrative, or realize how to convey the essence of a particular segment.” from From ‘Raging Bull’ to ‘Un Chien Andalou’—A New Show Traces Cinema’s Greatest Storyboards [ArtNet] posted by chavenet on Feb 17, 2025 - 4 comments The Library of Congress' unique copy of James Joyce's "Ulysses" The first edition of Ulysses was 1,000 copies. The first 100 were printed on Holland paper and signed by the author. The next 150 were printed on vergé d'Arches paper. But Copy #361 is special. posted by Lemkin on Feb 16, 2025 - 27 comments Albert King "Albert King would stand on the stage, sweat pouring from his face like a monsoon, and wring out of Lucy—a rocket-shaped 1959 Flying V—a voice as insistent as barbed wire and as electrified as a jet engine. ... he bent notes like nobody else—pulling the strings downward on Lucy’s neck to shift their tones far out of their usual place—which created a sound alternately longing and playful." [more inside] posted by Lemkin on Feb 15, 2025 - 20 comments Andrew Hill "At the age of 26, Andrew Hill altered jazz history, recording five visionary albums for Blue Note in just eight months in 1963 and 1964. In the pace and uniqueness of his achievements, he rivaled more famous labelmates such as Herbie Hancock and Wayne Shorter. Among his collaborators were Eric Dolphy, Kenny Dorham, Bobby Hutcherson, Freddie Hubbard, Joe Henderson, Richard Davis, Roy Haynes, Elvin Jones and Tony Williams. ... He left New York in 1970 and recorded sporadically for other labels over the next two decades, becoming, in Gary Giddins’ words, an 'outlying cult figure'. Anthony Braxton, in the liner notes to his Nine Compositions (Hill) 2000, wrote: 'This is a private musical universe that is not always appreciated by the greater jazz business complex'." [more inside] posted by Lemkin on Feb 15, 2025 - 4 comments Ishbel Myerscough Inside the Artist's Studio with Ishbel Myerscough [more inside] posted by Lemkin on Feb 13, 2025 - 2 comments Suzanne Ciani, Electronic Music Pioneer Suzanne Ciani: A Life in Waves [more inside] posted by Lemkin on Feb 12, 2025 - 21 comments Essential Vermeer "The primary goal of the Essential Vermeer website is to harness the extraordinary potential of the internet to provide a comprehensive and organic presentation of Vermeer's art, life, and cultural milieu. Complex art historical issues are made accessible to casual art lovers while retaining their relevance for scholars and experts. News of Vermeer-related exhibitions, publications, and multimedia events are reported in real time." posted by Lemkin on Feb 12, 2025 - 3 comments Bring me the head of Herman Melville It hasn’t always been devoid of a marker, however. Until recently, Melville’s visage graced a small plaza on Pearl St. between two skyscrapers by way of a bronze bust with a plaque informing visitors that “On this site, number 6 Pearl Street, HERMAN MELVILLE was born August 1, 1819.” ... For many years, fellow water gazers from around the world came to this plaza to pay their respects, until suddenly it was gone; both the plaque and the bust were removed and replaced with a dumb blankness matching the rest of the wall, which is how it still looks today. from Herman's Head ; or, what happened to the Melville bust at 6 Pearl St.? [All Visible Objects] [more inside] posted by chavenet on Feb 11, 2025 - 23 comments Maki-e Fountain Pens This video about maki-e fountain pens will make you sad that you don't own a maki-e fountain pen. [more inside] posted by Lemkin on Feb 11, 2025 - 17 comments Thalassa Mechane SOLSTICE - 5 (YT 10:36), a visually intricate short sci-fi film about resource extraction on another planet, and Forgotten Archives (11:11), a just released expansion of the world. [more inside] posted by lucidium on Feb 11, 2025 - 3 comments M. F. K. Fisher's "How to Cook a Wolf" "Originally published in 1942, How To Cook A Wolf is presented as a wartime cooking guide, but... its essays are an argument for living the best life that you can when everything around you goes to shit." - Emma Terhaar [more inside] posted by Lemkin on Feb 10, 2025 - 22 comments Framing emptiness: an exhibition of inscribed Renaissance frames Tanja Lemke-Mahdavi and Olaf Lemke describe their exhibition of 15th and 16th century Italian and Spanish frames with painted and gilded inscriptions, all of which once had an intimate connection with the paintings they held, explaining and commenting on them. (The Frame Blog also has an archive worth checking out) posted by brachiopod on Feb 8, 2025 - 4 comments Natalie Merchant Sings the Treasures of a Nation Library of Congress: "The singer, songwriter, activist, and folklife advocate helped us mark the opening of the new David M. Rubenstein Treasures Gallery with a very special concert presentation... Alongside a few of Natalie’s own compositions, and a few old popular compositions, the concert featured mostly traditional folksongs which have con'''
