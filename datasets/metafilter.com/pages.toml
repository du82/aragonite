full_description = '''"We still live in history —and at the mercy of biology." March 4, 2025 2:34 PM Subscribe How Covid Remade America (David Wallace-Wells, NYT gift, archive.is) posted by box (21 comments total) 7 users marked this as a favorite (adsbygoogle = window.adsbygoogle || []).push({}); It turned us into hyperindividualists. It... did not? The first thing we did was start a weekly Zoom trivia, and we made it through the worst of the pandemic by growing closer together over long distances. It broke our faith in public health. On the contrary, it improved my faith in public health, as long as competent people are at the helm. It shattered our cities and disordered society. I lived in a city (Philadelphia) the entire time, and it did not shatter. Our society, at least here, is not disordered. We have had a steady decline in violence, our public transit is now more utilized than BART, and I feel closer to my neighbors than ever before. Perhaps the biggest shock was realizing we still live in history —and at the mercy of biology. ?????posted by grumpybear69 at 2:43 PM on March 4 [24 favorites] Half the stuff in that article was stuff Trump and Republicans pushed in his first term prior to COVID, and for longer. Must be nice to be a opinion writer paid by the word with the memory of a housefly and an editorial demand to 'both sides' everything.posted by The_Vegetables at 2:47 PM on March 4 [15 favorites] Regrettably, yet another NYT article that is neither entertaining nor enlightening. It continues in the NYT spirit of both-sides-ing everything and sanewashing the policies that made COVID far worse than it ever needed to be in the US. And so I'm reiterating my request to consider single-link NYT posts no longer "best of the web" and that it should be put on the same level as the Daily Mail: the article had better be exceptional. This one isn't. Just more fash-justifying trash opinion.posted by tclark at 2:57 PM on March 4 [17 favorites] "There was a backlash to DEI" "Trust in institutions fell" "Everyone (and by everyone I mean explicitly the right) became so spoiled and self centered" WE'RE ALL LOOKING FOR THE GUY WHO DID THIS.jpegposted by Slackermagee at 3:00 PM on March 4 [16 favorites] This seems like an article that uses “our” narrowly, such that I expect a huge percentage of comments here to amount to “what do you mean, we?” On the contrary, it improved my faith in public health, as long as competent people are at the helm. This one, though, you mean… looking outside the US? Because I really don’t know how anyone on any side of the political spectrum would look at the public health response here and think “that went well.” And no, not just because of the right undermining it, there were tons of unforced errors.posted by atoxyl at 3:10 PM on March 4 [3 favorites] The public health response clearly got one huge thing wrong, the mechanism of spread, but my nonexpert sense is that that was less an unforced error than the challenge of responding to a deadly, novel pandemic. The actions of right-wing sociopaths indifferent to the death toll are a separate problem.posted by Horace Rumpole at 3:18 PM on March 4 [5 favorites] Everyone is indifferent to the death toll. Continues to be! Normalization of spread and throwing vulnerable populations to the wolves started under Biden when they realized they could score political points (?) with dramatic gestures of taking off masks in the Rose Garden. Glad it was… worth it?posted by supercres at 3:35 PM on March 4 [9 favorites] David Wallace-Wells come on, we all had the same thoughtposted by ginger.beef at 4:04 PM on March 4 [2 favorites] I dunno, I read this this morning, and it largely seemed fairly true to me. I think he attributes some things to the pandemic that aren't that pandemic-y, mostly political developments, but certainly it left a lot of us embittered and less trustful of our government and each other. If that's not true for you, that's great; I presume there are demographic factors in play that have kept some people from feeling that.posted by kittens for breakfast at 4:11 PM on March 4 [4 favorites] I had honestly forgotten about those outdoor events with everyone cordoned off in their little circles. we saw a Shakespeare play outdoors in that kind of setup, and my band put on two similar events, with the audience much further away from the stage than usual.posted by emelenjr at 4:17 PM on March 4 This felt very real to me. I don’t have this writer filed under minimizer — that’s the NYT’s other David.posted by eirias at 4:18 PM on March 4 [3 favorites] I couldn't finish it. Does it mention all the gullible dipshits who became enthralled with Russian disinformation?posted by brachiopod at 4:34 PM on March 4 [5 favorites] The public health response clearly got one huge thing wrong, the mechanism of spread I had a longer list but I will grant that a lot of it is arguably downstream of getting the mechanism of spread wrong: - confusing messaging about masks - confusing messaging about outdoor risks - in general a lot of stuff that amounted to safety theater and simultaneous neglect of important factors like ventilation - vaccine distribution snafus - confusing messaging about what the intended objective of public health interventions even was Some of these are fairer complaints than others in light of novel pandemic but it just felt so seat-of-the-pants, so consistently fighting yesterday’s battles, and most damningly I have no confidence that “next time” would be different.posted by atoxyl at 4:55 PM on March 4 [3 favorites] David Wallace-Wells is definitely not a covid minimizer at all. He has written a lot of good stuff about the pandemic, generally much more science-based than others, starting from the early days. This particular article seems kind of general and meh though. I thought his recent The Covid Alarmists Were Closer to the Truth Than Anyone Else was a lot better.posted by ssg at 4:55 PM on March 4 [1 favorite] it improved my faith in public health, as long as competent people are at the helm. I mean, yes and then no? The development and rollout of the vaccines was a miraculous public-health triumph; getting that first vaccine, at a huge mass-vaccination event, felt like yes, this is what public health is for. And the the right-wing dipshits threw shitfits about getting vaccinated and have permanently poisoned the well on ever getting decent uptake of any new vaccines -- and increasingly, of old and trusted vaccines for long-defeated diseases. I will never, ever forgive them for this.posted by We had a deal, Kyle at 4:56 PM on March 4 [9 favorites] Some of these are fairer complaints than others in light of novel pandemic but it just felt so seat-of-the-pants, so consistently fighting yesterday’s battles, and most damningly I have no confidence that “next time” would be different. A key move for me in coming to terms with my white-hot anger over pandemic mishandling was reading a book about the AIDS pandemic, written when it was still very much a novel disease with no real useful treatment. The ineptitude, the gaslighting, the disposable-minority shtick, none of it was new at all, and even though Republican horribleness was important, it wasn’t only Republicans — people on both sides of the aisle were complicit.posted by eirias at 5:27 PM on March 4 [1 favorite] While I'm against both-siderism in the current environment, Cuomo is back in the public eye as he looks to become NYC mayor, and he flubbed the situation in NY State nursing homes.posted by Schmucko at 5:40 PM on March 4 On the contrary, it improved my faith in public health, as long as competent people are at the helm. the iowa gop is advancing a bill to criminalize voluntary COVID vaccinationsposted by knock my sock and i'll clean your clock at 6:07 PM on March 4 [4 favorites] While I'm against both-siderism in the current environment, Cuomo is back in the public eye as he looks to become NYC mayor To the extent that the Democratic Party accepts people like Cuomo as a leader, I feel like both-siding is not entirely unjustified.posted by bjrubble at 7:05 PM on March 4 I hope he turns his COVID reporting into a book. His last one was eerie and terrifying.posted by mittens at 5:25 AM on March 5 [1 favorite] I get that he's looking at global trends and by those trends but this insistence that we didn't bungle the COVID response because our outcomes weren't worse than other places seems to ignore that we also had more advantages and resources to tackle this than most other places... The section about how 1 in 5 dollars of COVID relief business loans was misepent especially could have benefited from more talk about how that was done on purpose. Trump purposefully put no oversight on that program for the first 6 months so he and his cronies could do some (small scale compared to what they are doing now) looting and kleptocratic handouts.posted by subdee at 7:05 AM on March 5 « Older There’s no magic here | Never gonna give up dancing at the Pink Pony Club Newer » (adsbygoogle = window.adsbygoogle || []).push({}); You are not currently logged in. Log in or create a new account to post comments. Related Posts This Face Mask Mistake is Worse Than No Mask at All January 22, 2021 You are the globally distributed vaccine... January 21, 2021 What If Friendship, Not Marriage, Was at the... October 22, 2020 "They Were Not Simply Names on a List. They Were Us." May 23, 2020 The Virus Changed the Way We Internet April 9, 2020 (adsbygoogle = window.adsbygoogle || []).push({}); Tags DavidWallace-Wells Covid Coronavirus NewYorkTimes Share Facebook'''
