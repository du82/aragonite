full_description = '''bighorn beat brown bear but busted my bracket March 2, 2025 10:50 PM Subscribe March Mammal Madness. You (or your biology students) learn enough about sixty-five animal species to predict who would come out on top if the two encountered each other in the higher-seeded animal's habitat. These fictional encounters them play out through March. This year's bracket. BlueSky hashtag."Note: MMM includes many non-mammal species." posted by fantabulous timewaster (2 comments total) (adsbygoogle = window.adsbygoogle || []).push({}); Lots to love here. Delighted to see the geneticist's standard example species [Aa x Aa → 1AA : 2Aa : 1aa] Aardvarks Orycteropus afer in the fight. I think they are in the wrong [convergent evolution - presumably cf giant anteater Myrmecophaga tridactyla?] bin though, when there is [THE ONLY ONES This Division are mammals that are the only living species of their genus!]. Aardvarks are the only living species of their genus: Orycteropus the only living species of their family: Orycteropodidae the only living species of their Order: Tubulidentata posted by BobTheScientist at 12:08 AM on March 3 Delightful. Thank you for posting this.posted by sonofsnark at 8:41 PM on March 4 « Older Al Schmitt | Kate can walk but often uses a wheelchair to get... Newer » You are not currently logged in. Log in or create a new account to post comments. Related Posts 🐄✋🏾💃🏾 November 10, 2018 This Post Demands a Knee-Jerk Reaction August 22, 2014 Animal Spirits August 21, 2014 12 Amazing Things About Bats October 31, 2012 Little Armored One April 2, 2009 (adsbygoogle = window.adsbygoogle || []).push({}); Tags mammal madness science education Share Facebook'''
