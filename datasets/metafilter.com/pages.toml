title = "Before Hitler: Your Turn | MetaFilter"
description = "January, 1928: It is a bright time for German democracy. After a period of struggle, inflation is finally under control, and the economy is expanding steadily. In foreign policy, we have reached..."
full_description = '''Before Hitler: Your Turn March 2, 2025 4:52 PM Subscribe January, 1928: It is a bright time for German democracy. After a period of struggle, inflation is finally under control, and the economy is expanding steadily. In foreign policy, we have reached agreements with the Western powers and the Soviet Union that might make genuine peace a reality. Now, the task of Social Democracy is to prepare for the next election. The bourgeois-right government of Wilhelm Marx is unpopular, and we stand to gain. Social Democracy: An Alternate History: Help navigate the Social Democratic Party (SPD) through political and economic crises, contentious parliamentary elections, and the ominous rise of the Nazis in the waning years of the Weimar Republic. A text adventure simulation by Autumn Chen.A similar (and older) option is the 1988 DOS title Hidden Agenda, which sees you steering the government of the fictional Latin American nation of Chimerica amidst pressure from leftist revolutionaries, right-wing militarists, and intra-party conflicts. It's playable online via DOSBox emulation (if that one doesn't play nice with your browser, there are plenty of alternative sites available). If you find these too dated (or too heavy), Chen also produced The Archivist and the Revolution, another text adventure game exploring the precarious life of a trans archivist tasked with transcribing DNA-encoded history files in an oppressive post-apocalyptic police state. Despite the dire conditions, some of the multiple endings can be surprisingly powerful and hopeful. posted by Rhaomi (13 comments total) 24 users marked this as a favorite (adsbygoogle = window.adsbygoogle || []).push({}); You are standing in an open field west of a Reichstag...posted by Lemkin at 5:10 PM on March 2 [3 favorites] I see "killing baby Hitler" is not an option, so I am stumped.posted by senor biggles at 7:04 PM on March 2 [2 favorites] Going to Russia and preventing Stalin from becoming General Secretary of the Central Committee of the Soviet Union is also not an option, so you're kind of SOL there, too.posted by TheWhiteSkull at 7:20 PM on March 2 [1 favorite] install Trotsky in the Rhineland and tell the people that it's part of the reverse deal. flood the signing of the Kellogg-Briand Pact with laughing gas. extend the young plan to 100 year repayment and suspension upon economic crises, that hit in 1929, built into the clause and a way to have loans continue with repayment in material rather than gold upon said economic crisis. heavily infiltrate the newly formed SS. this is fun.posted by clavdivs at 8:26 PM on March 2 [1 favorite] Well, I built up the Reichsbanner, mended fences with the KDP, and plunged Germany into a decade long civil war. Not sure if that's better.posted by LeRoienJaune at 9:37 PM on March 2 [2 favorites] Opening your gown reveals a buffered analgesic, pocket fluff, and a republic your aunt gave you which you don't know what it is.posted by aws17576 at 9:56 PM on March 2 [5 favorites] Can I play this as a council communistposted by latkes at 11:33 PM on March 2 I suspect that the difference between me and the historic SDP is that I don't secretly agree with Hitler re: liquidating the jews and the communists.posted by eraserbones at 6:16 AM on March 3 The bourgeois-right government of Wilhelm Marx is unpopular, and we stand to gain. Why would the SDP oppose a Marxist government?posted by star gentle uterus at 7:24 AM on March 3 eraserbones, I'd like to learn more about what you're talking about. I'm aware of the SPD/KPD conflict stemming from the Spartacist uprising and continuing as political enmity through the 20s and early 30s. Could you point me to anything else about SPD antisemitism or support for murdering communists?posted by daveliepmann at 8:01 AM on March 3 Back in the dawn ages of this kind of thing, I wasted way too much time on Balance of Power before I figured out that "simulation" of geopolitics is a mug's game, that you will only ever get out of it what was brought by the developer. I get that this is more of an honest storytelling exercise but still... I think I will pass.posted by Aardvark Cheeselog at 9:11 AM on March 3 After multiple attempts to work within the democratic system, several of which either wound up resembling history (bad) or resulting in a grueling civil war (... bad?) I finally managed to get a "good" ending by just ignoring the elections and investing in police, military relations, and the SPD's paramilitary. The result was a brief civil war in which the SPD-led pro-democracy forces defeated an attempted fascist-militarist self-coup and maintained parliamentary democracy-- albeit tenuously. What this says about how to beat back the rising tide of fascism in the United States... who knows? For the life of me I couldn't get the dang Communists to be anything more than neutral. In the end they refused to join my plucky little civil war, which I guess didn't end up making much difference.posted by Method Man at 11:56 AM on March 3 It seems much of the game is what you do before the crisis hits. If things aren't working that point you end up in the painful-but-historical loop of either supporting a conservative government's destructive austerity policies, or voting against them and triggering another election which only boosts the Nazis.posted by Urtylug at 5:04 PM on March 3 « Older Log, baby log | NYT review of MeFi's own Omar El Akkad's New Book Newer » (adsbygoogle = window.adsbygoogle || []).push({}); You are not currently logged in. Log in or create a new account to post comments. Related Posts finding a voice March 7, 2021 The radical right wants to do away with democracy... April 9, 2020 In Case of Emergency, Print Money February 19, 2019 We fell, and we may never walk again. But on hands... July 3, 2018 I think there’s something very positive about... April 1, 2018 (adsbygoogle = window.adsbygoogle || []).push({}); Tags SocialDemocracy TextAdventure Simulation Game Politics History Germany WeimarRepublic Nazis Nazism GreatDepression Itchio IndieGame Educational HiddenAgenda DOS DOSBox Emulation LatinAmerica Colonialism LandReform Economics Archiving ScienceFiction DNA Transgender Trans GenderIdentity Dysphoria PostApocalyptic Satire SocialCommentary LifeSimulation AlternateHistory InteractiveFiction Share Facebook'''
