full_description = '''var subd="www"; function incFav(b){b=b.replace(/^\s*|\s*$/g,"");var a=b.split(":"),c=a[0],e=a[1];b=a[2];var d=a[3],f=a[4],g=a[5],h=a[6];a=document.getElementById("favmsg"+d+c);pmlink=document.getElementById("plusminus"+d+c);if(g==1){pmlink.innerHTML="+";pmlink.title="Save this post as a favorite";c="addFav("+c+","+e+","+d+","+f+",'"+h+"');return false;"}else{pmlink.innerHTML="&minus;";pmlink.title="Remove this post as a favorite";c="delFav("+c+","+e+","+d+","+f+",'"+h+"');return false;"}pmlink.onclick=new Function(c);if(b=="You already made this a favorite."){a.hasChildNodes()&&a.removeChild(a.firstChild);a.appendChild(document.createTextNode(" "+b))}if(b==parseInt(b)){a.hasChildNodes()&&a.removeChild(a.firstChild);a.appendChild(document.createTextNode(g==1?" Favorite removed!":" Favorite added!"))}}; 1205 posts tagged with movie. Displaying 1 through 50 of 1205. Subscribe: John Frankenheimer's "French Connection II" "Hackman was fantastic here, never stopping with the full-blown intensity, consistently providing Doyle with a vital integrity that always made you care, no matter how harsh the character spoke or behaved. And it goes without saying that Frankenheimer, ever the reliable craftsman, shot the hell out of the film with his director of photography Claude Renoir, giving it that rough and tumble 70’s aesthetic that we all love so much in present day. Many, many people have seen The French Connection. Not enough people have seen French Connection II. I’d like that to change."- Nick Clement [more inside] posted by Lemkin on Feb 28, 2025 - 7 comments The book covers of Stanisław Lem’s "Solaris" "The covers of the book depict some form of the cosmos, the planet, the ocean, and occasionally a lonely man facing it. However, while the 1960s and 1970s were characterized by hallucinogenic, sprawling, or more abstract visions, more recent editions have a more streamlined design." [more inside] posted by Lemkin on Feb 19, 2025 - 12 comments McLibel: The Motion Picture McLibel is a 2005 feature-length documentary by Franny Armstrong and Ken Loach about the libel suit brought in England by McDonald's Corporation against environmental activists Helen Steel and David Morris for publishing this. [more inside] posted by Lemkin on Feb 11, 2025 - 7 comments James Foley’s “Glengarry Glen Ross” The whole fucking movie (4K). Are you gonna watch it? Are you man enough to watch it? [more inside] posted by Lemkin on Feb 6, 2025 - 80 comments Orson Welles’ “The Trial” “When it comes to film adaptations of very famous works of literature, there’s always a lot of pressure on the artist to produce something worth its background. In this case, Welles created a technically grandiose movie loyal to Kafka’s story, but enhanced by the infusion of Welles’ own vision. The Trial stands as one of the most accomplished book-to-film adaptations, and in Welles’ rich career, it’s a film that ranks among the very best.” - Sven Miculek [more inside] posted by Lemkin on Feb 4, 2025 - 11 comments The costumes of Martin Scorsese's Casino 20 reasons why Casino is the most stylish film of all time. The Perfect Fits of Casino. Sharon Stone on the Unforgettable Fashion of Casino, 25 Years Later. 7 suiting lessons to learn from Robert De Niro in Casino. [more inside] posted by Lemkin on Feb 2, 2025 - 7 comments Winter Soldier Winter Soldier is a 1972 American documentary film, chronicling the Winter Soldier Investigation, which took place in Detroit, Michigan, from January 31 to February 2, 1971. The film documents the accounts of American soldiers who returned from the War in Vietnam and participated in this war crimes hearing.* [more inside] posted by Lemkin on Feb 2, 2025 - 10 comments And so Cronenberg spliced together an unholy beast of a film "However, it’s in 1991’s Naked Lunch that Cronenberg most openly takes a clear-eyed look at the work of the creative and, in doing so, a look at himself. In conversation with Film Comment, Cronenberg called his adaptation of William S Burroughs’ surreal classic 'a meditation on the artistic process'." posted by cupcakeninja on Feb 1, 2025 - 21 comments The Most Beautiful Boy in the World "In The Most Beautiful Boy in the World, a heart-wrenching documentary, co-directors Kristina Lindström and Kristian Petri puncture the uneasy vein of child star building, explaining how often the practice ensnares the vulnerable. They do so by telling the story of once Swedish teen idol Andrésen, who at the age of fifteen was cast as Tadzio in Italian director Luchino Visconti’s adaptation of Thomas Mann’s novel Death in Venice. The part would bring the Swedish actor fame, adulation, and adoring fans only for the ensuing noise of stardom to rupture his life, permanently." - Robert Daniels posted by Lemkin on Jan 28, 2025 - 4 comments Martin Scorsese's "The King of Comedy" "We’re talking about a black comedy that hardly delivers any laughs. A comedy that isn’t funny because it portrays the hilarious albeit sad constituent of our everyday lives, something we don’t find funny because we’re a part of it, because we give our best to help the carousel continue spinning. That’s why The King of Comedy hit a little too close to home to be universally admired at the time of its release. In its portrayal of celebrity worship and the American media culture, it’s honest, sharp and cuts deep, hurting the viewer, forcing him to think, offering the truth about society and the media bluntly, directly, without any euphemism or regard." - Cinephilia Beyond [more inside] posted by Lemkin on Jan 24, 2025 - 30 comments Martin Scorsese’s “The Color of Money” How The Color of Money’s “One For Them” Assignment Reignited Martin Scorsese’s Hunger for the Work [more inside] posted by Lemkin on Jan 22, 2025 - 13 comments 80s Teen Sex Comedies The 80s were long ago and, in terms of socially acceptable comedy, far away. (CW: Brett Kavanaugh and screen piggishness) [more inside] posted by Lemkin on Jan 16, 2025 - 64 comments Martin Scorsese's "The Last Temptation of Christ" I believe Scorsese’s question in The Last Temptation of Christ is this: Could Jesus have doubted the very purpose of his death? If so, I must ask myself: Can I allow Jesus the same shroud of uncertainty that I have? Can I allow my Messiah the messiness of being human? If I miss the aspect of God’s shared humanity, I commit myself to never understanding my own. [more inside] posted by Lemkin on Jan 16, 2025 - 62 comments Landing the Nostromo To show where the Nostromo landed on LV-426, Ridley Scott needed onscreen visuals for the ship's computers. 20th Century Fox contacted Alan Sutcliffe at System Simulations in London, who hacked together some code that generated the vector landscape and computer interface using the Frolic graphics library running on a Prime 300 at SRC and rendered the animated sequence to film using a FR80 from III. Luckily for us digital archaeologists, Sutcliffe also wrote an article for Creative Computing a few years later describing his fourteen pages of FORTRAN that created the iconic view of the landing site terrain on an distant planet. posted by autopilot on Jan 16, 2025 - 16 comments Steven Soderbergh's "Solaris" At a time when many American movies pump up every fugitive emotion into a clanging assault on the audience, Soderbergh’s Solaris is quiet and introspective. There are some shocks and surprises, but this is not Alien. It is a workshop for a discussion of human identity. It considers not only how we relate to others, but how we relate to our ideas of others. - Roger Ebert [more inside] posted by Lemkin on Jan 12, 2025 - 29 comments David Cronenberg's "Crash" Beyond the bounds of depravity: an oral history of David Cronenberg’s Crash (4K restoration trailer - technically SFW, but, you know...) [more inside] posted by Lemkin on Jan 4, 2025 - 30 comments Philip Kaufman’s “Invasion of the Body Snatchers” “Invasion of the Body Snatchers (1978): The Loss of Self” [SPOILERS] [more inside] posted by Lemkin on Dec 31, 2024 - 13 comments Are you bot-curious? Empire Wreckers has a brisk 2-hour video A Short Introduction to the First 40 Years of Transformers. Includes toys! Movies! Comics! Ball joints! Sexism! Copyright law! Product cycles! Third party figures! posted by TheophileEscargot on Dec 25, 2024 - 2 comments How Did They Ever Make A Movie Of "The Cement Garden"? In an Ian McEwan story nothing is quite as it seems, and many of the characters have a perfectly amoral willingness to break society’s rules. That is the case here. The Cement Garden is not a pleasant film, nor is there any reassurance at the end – no promise that all will eventually be well. It’s more of a seduction, like the events of the plot. It leads us into a world where some secrets are hidden and others indulged, and there is no restraint on its dark impulses. - Roger Ebert * [more inside] posted by Lemkin on Dec 25, 2024 - 10 comments Tom Harper's "War Book" War Book is nothing but people talking. And it is riveting. It is terrifying. - MaryAnn Johnson* [more inside] posted by Lemkin on Dec 24, 2024 - 15 comments Steve de Jarnatt's "Miracle Mile" Miracle Mile (1988) has the logic of one of those nightmares in which you’re sure something is terrible, hopeless and dangerous, but you can’t get anyone to listen to you. Besides, you have a sneaking suspicion that you might be mistaken. The film begins as a low-key, boy-meets-girl story, and then a telephone is answered by the wrong person and everything goes horribly wrong. Much of the movie’s diabolical effectiveness comes from the fact that it never reveals, until the very end, whether the nightmare is real, or only some sort of tragic misunderstanding. - Roger Ebert (assume spoilers everywhere, inclduing below the fold) posted by Lemkin on Dec 21, 2024 - 54 comments Begotten Begotten posted by Lemkin on Dec 19, 2024 - 14 comments Lee Savage's "Mickey Mouse in Vietnam" "Mickey Mouse in Vietnam" (1968) [more inside] posted by Lemkin on Dec 18, 2024 - 9 comments Sidney Lumet's "The Offence" ... it must be one of the most relentlessly bleak and dour movies ever released by a major American studio. ... A compelling chronicle of the crack up of a British police detective hunting a child molester, [Sidney Lumet's] The Offence makes no concessions to the audience or the studio executives - no gags, no sensational thrills, no romantic interest, no facile, convenient explanation for the horrors we are asked to contemplate. - Stephen Farber, The New York Times [more inside] posted by Lemkin on Dec 15, 2024 - 13 comments Home Alone for the holidays Patrick Explains HOME ALONE (And Why It's Great). Single link YouTube by Patrick Willems (previously) that's pretty great about a pretty great movie. posted by skynxnex on Dec 11, 2024 - 28 comments "We had been respectable, ordinary people until the comet" Carmen Maria Machado (LitHub and also Conjunctions, 12/04/2024), "Endlings": "Lorraine patted my mother's arm and assured her that she believed her. The comet had been rustling up quite a lot of supernatural activity where you least expected it." Related: Kim Masters, Ashley Cullins (THR, 12/13/2017), "War Over 'The Conjuring': The Disturbing Claims Behind a Billion-Dollar Franchise" and movies based on cases of Ed and Lorraine Warren, e.g. on Fanfare: Annabelle; The Conjuring; The Amityville Horror; The Conjuring 2; and The Conjuring: The Devil Made Me Do It. Also, personal ghost stories by other contributors to Conjunctions. And La Llorona (1960), a classic ghost story relevant to "Endlings" and in this version reviewed on Cinema Cats. CW: children are harmed in La Llorona stories and in the nonfiction article about The Conjuring. posted by Wobbuffet on Dec 4, 2024 - 6 comments “Is that an icicle in your pocket or...” [CW: implied fornication, mortality, death] Starring Lacey Chabert and Dustin Milligan, Hot Frosty is a Netflix rom-com. Stylist: Hot Frosty might look like fun festive fluff, but it deals with a complex female fantasy. Forbes: Hot Frosty currently has a 100% on Rotten Tomatoes from critics, which is not exactly what you’d expect about a magically hot snowman seducing a widow. The Wrap: It’s because this movie is, unlike the rest of the overwhelmingly chaste films in this subgenre, incredibly horny. There’s a scene where Lauren Holly (“Dumb and Dumber”) gets her car stuck in the snow and the shirtless sleetcake asks questions like “You want me to get behind you and push?” and “Are you ready for me?” before she revs her engine and moans with satisfaction. Hallmark would never. Roger Ebert review. posted by Wordshore on Nov 15, 2024 - 53 comments Which Contemporary Film Snob Director Are You? a handy flowchart It's dark, it's late, you're drunk, and you're ready to admit to MetaFilter that you're really a famous cult filmmaker. But if you're not sure, follow this handy flowchart by Adam Fromm: Which Contemporary Film Snob Director Are You? It's funny, it's clever, it's easy to navigate, it's a giant JPG image. [more inside] posted by Harvey Kilobit on Nov 11, 2024 - 41 comments "Looking for Answers at the Nancy Drew Convention" Jadie Stillwell & Nicole Blackwood (LitHub, 11/2024), "Among the Sleuths": "the fictional detective became a mythic figure long ago. She's also, fittingly, something of a mystery herself." Related: the song "Nancy Drew" by Tuscadero. r/NancyDrew on most / least favorite, love-hate, & favorite game, and issues with newer games. Gab Smolders (previously) plays Ghost Dogs of Moon Lake and Mystery of the Seven Keys. Bonita Granville's 1930s movies, e.g. Nancy Drew... Detective and Nancy Drew and the Hidden Staircase. 70s TV show. Andrea Ruggirello (2018), "The Not-So-Hidden Racism of Nancy Drew." Trailer for the recent show now on Max (r/NancyDrew's comments; Vulture review of the pilot + ND overall). Katryn Bury (2023), "Revisiting Nancy Drew from a Modern (and Disabled and Queer) Perspective." posted by Wobbuffet on Nov 