title = "Moonspotting | MetaFilter"
description = "Ramadan mubarak - either a little late or right on time! For many especially in the US, Ramadan started last night. For some folks, though. it starts tonight (for this poster, 15 minutes from now,..."
full_description = '''Moonspotting March 1, 2025 10:11 AM Subscribe Ramadan mubarak - either a little late or right on time! For many especially in the US, Ramadan started last night. For some folks, though. it starts tonight (for this poster, 15 minutes from now, God willing). It all depends on whom you trust to see the moon... or to inform you about calculations about the moon's position.More and more frequently, Muslims worldwide follow the lead of the Saudis, who have trained moonspotters at the ready on the 29th of Sha'ban (the last night of the month before Ramadan). Some Muslims even rely on calculations with respect to the moon's position rather than sightings. If you're on the school of Islam that's most popular in North Africa and southern Europe, however, last night you were waiting from word from your local moonspotters (or those in Morocco if the skies were cloudy). It's been cloudy and drizzly in southern Spain, and so those of us who follow that school waited till about 9 pm before we knew whether we'd be fasting today. Turns out, we start Ramadan tonight... in about 10 minutes, God willing. Meanwhile, Muslims in Spain who follow the national Islamic council started Ramadan fasting today! Is the discrepancy a source of controversy? In our dispute-ridden modern culture, yes, of course. But for many of us, it's part of the universe of Islam, where diversity and divergence of scholarly opinion have always been the norm. Your poster here has a few minutes to make wu'du, which I'm not going to translate right now, since its usual English translation is inaccurate AND imprecise. So I'm going to wish any Muslims reading this a Ramadan mubarak and may we all reap the unique blessings of this beautiful month. posted by rabia.elizabeth (12 comments total) 29 users marked this as a favorite (adsbygoogle = window.adsbygoogle || []).push({}); This is fascinating stuff. I knew nothing about this difference of interpretation. Thank you for sharing this here, rabia.elizabeth! Ramadan mubarak!posted by kristi at 11:15 AM on March 1 [4 favorites] I'd noticed that the local supermarkets were stocking up on the really good dates (Sukkari ftw!) so I knew that it was imminent. Ramadan kareem!posted by scruss at 11:36 AM on March 1 [5 favorites] I too have a couple kilos of the Good Dates. salam alaikumposted by seanmpuckett at 11:47 AM on March 1 [4 favorites] I, a non-Muslim, would like to post the following for the information of others like me who may be unaware of how Ramadan can affect those who observe it. I'm privileged to live in a large, Canadian cosmopolitan city and worked in an organization that valued diversity. A colleague was having a housewarming party to celebrate the purchase of a first home and invited everyone on the work team, as well as their other friends and family. The new homeowners are Hindu, originally from India, and the party was brimming with dozens of dishes of amazing and aromatic food from south Asia. There were lots of people laughing, eating, and exploring the house, encouraged by our lovely hosts. I was astonished (my ignorance showing) to see a Muslim colleague in the midst of all this. It happened to be during Ramadan. She is quite observant and I asked her, "Isn't it difficult for you to be surrounded by all this food and drink during your fast?" She assured me it was not, that she was having a wonderful time as were her two children that she'd brought with her. Then she confided that it wasn't hunger or thirst that was hard to manage; it was the fatigue. It was high summer, and the days in my part of the world in summer are very long. The sun rises around 4 am and doesn't set until about 10 pm. My friend told me of her day: She gets up about 3 am to prepare breakfast for her and her husband and complete her morning religious observances. She might go back to bed for a bit, but then has to be awake again by about 6 am to get her children ready for their day (they were too young to fast), and get herself ready to be at her desk at work for 8 am. She works until 5 pm, not eating or drinking. Luckily, we worked in an air conditioned office, because she dressed modestly with long sleeves, a floor-length skirt, and her hijab that covered her head, neck, and shoulders. Then she heads home, prepares a light supper for her children, and completes further religious observances. Then she prepares iftar, the meal that breaks the day's fast, and there are frequently guests. Iftar would be around 10 pm. She's generally up until about midnight, cleaning and doing whatever preparations are necessary for the coming day. And at 3 am, she starts this all over again. She kept this up the entire length of Ramadan. She worked as efficiently, effectively, and cheerfully as always and never once asked anyone to make allowances for her. There was only once during that Ramadan when she accepted some "help". It was a stifling hot day, even with the air conditioning, and she was getting a bad headache from the heat, her fatigue, and lack of water. Our team of six comprised five women and one man, and we were in a team meeting in a closed conference room. Our male team member insisted on leaving the room, joining the meeting with audio only from a different office, so that our teammate could loosen her hijab. So a joyful party was a welcome break for my colleague. And we had a good chuckle that her daughter's Arabic name, and my Latin name, mean the same thing in English. Ramadan Mubarak to all MeFites observing the festival.posted by angiep at 1:21 PM on March 1 [15 favorites] Ramadan Mubarak! What always surprised/fascinated me is the straight Lunar calendar used in Islam, which makes the month of fasting vary significantly with the regular Solar calendar we all use year to year. Even the Lunar calendar we use in south India is technically a solar-lunar calendar with added months interspersed in. Egypt had a Solar calendar I think because of the annual flooding of the Nile. I am surprised that this didn't crossover to the Arabian peninsula.posted by indianbadger1 at 2:42 PM on March 1 [1 favorite] Thank you for this thread and to those sharing in it. Ramadan mubarak!posted by Songdog at 4:11 PM on March 1 [1 favorite] Ramadan mubarak! Thank you for your posts, rabia.elizabeth; I've learned so much from you!posted by beaning at 5:21 PM on March 1 [1 favorite] angiep -- why is her husband not splitting duties with her? One prepares the meals in the morning, the other in the evening, or alternating days. If she was a stay at home mom, that would be one thing, but she's apparently working full time. Why is he apparently expecting her to go with *3* hours of sleep for an entire month, instead of them both going slightly short? If he's paralyzed or bedbound, I'll withdraw the objection, but that sounds like an exploitative situation, not one to coo over about how sweet tempered she is.posted by tavella at 5:39 PM on March 1 [4 favorites] Ramadan mubarak!posted by mumimor at 9:27 PM on March 1 Tavella, you make a good point, and one I thought of then and still do, occasionally; it's been over a decade since I worked with the subject of the post. It wasn't my place to argue with someone I wasn't close to about their domestic arrangements. I wondered the same thing, why her husband wasn't shouldering more of the burden, but I was just a colleague, not a close friend. I didn't think it was my place at a party to comment. It seemed to me then that my colleague wanted someone outside her faith community to know, and I was willing to listen. Sometimes an open ear is all that's required in a particular moment. My point in the post was not to "coo" about my sweet-tempered colleague or to endorse that behaviour. The few Muslims I know well enough to share their experience of Ramadan with me find great, even transcendent, joy during these days, but my limited understanding is that the month is not always easy, nor is it meant to be. My hope was that the story might encourage those of us outside Islam show a little grace, tolerance, and empathy during this month.posted by angiep at 11:40 AM on March 2 [5 favorites] This year I learned, much to my surprise and amusement, that there seems to be a consensus for the Muslim communities in Japan, South Korea, and Hong Kong, to refer to the Malaysian announcement, so Sunday it was for many of us in East/Southeast Asia (instead of Saturday for the more Western timezones which includes West Asia). There was one year (exactly) when there was a global attempt to have it fall on the same calendar date, which did happen, but I'm pretty sure the pushback has a lot to do with how even accounting for calculations, astronomical knowledge will induce a difference as to when all the important dates start etc (as it requires moon sighting as well for validation), that the various governments never really pursued it ever again - in my recollection that was a Saudi attempt at soft power, which people elsewhere entertained. In general, I think if there's any supposed push to follow Saudi times it depends very much on how established the local communities are - as it is the fact that Malaysia manage to coordinate on one timing is a miracle. Indonesia next door (what more India and Pakistan) can literally have neighbouring towns following different starts, lol. In any case it was a bit exciting this year because of a lot of the automated systems (eg google) and Saudi news were indicating a Saturday start, but we have another institution here, the horse calendar, which is a calendar that contains dates and day names for the Chinese, Tamil, Islamic, and of course Gregorian calendars (the titular horse refers to the weekend horse racing dates 😂), indicated that it was going to be Sunday. Anyway, for my timezone at least, Google lost to the horse calendar.posted by cendawanita at 3:59 AM on March 3 What always surprised/fascinated me is the straight Lunar calendar used in Islam, which makes the month of fasting vary significantly with the regular Solar calendar we all use year to year. Even the Lunar calendar we use in south India is technically a solar-lunar calendar with added months interspersed in. Egypt had a Solar calendar I think because of the annual flooding of the Nile. I am surprised that this didn't crossover to the Arabian peninsula. That reminds me of an Arab guy who was trying to introduce what he said is a 'corrected' way of understanding the calendar, with some citations from the Qur'an, and to my understanding it's derived from the fact that a lot of the Arab peoples were either already following the Jewish calendar that's also purely lunar and had adjustment extra month when needed - when Prophet Muhammad began Year One of the Hijrah that adjustment month seemed to fall away in standard practice. To this day I'm still not sure if there's a good explanation why. As it agriculturally people seemed to track roughly according to the seasons and other key dates so it wasn't like civilizational activities were on hold. But back to this guy whose name I can't recall - the main thing is that if we have a set of adjusted days/month, one major thing is having the major festivals in roughly the same time of the year, with Ramadan falling in spring (western hemisphere) and Haj season falling in autumn. So basically neither of these major rituals would fall on summer or winter when the daylight hours can be extreme. EDIT: and some Fatimids also have an adjusted calendar though these days it doesn't seem to amount to anything different with regards to keeping pace with other Muslims' timekeeping. I know the Javanese also had a hybrid calendar post-Islam that kept more accurate track with the seasons. But people, we can adapt to anything.posted by cendawanita at 4:08 AM on March 3 [1 favorite] « Older The gentry shall come down, and the poor shall... | The March of Links Newer » (adsbygoogle = window.adsbygoogle || []).push({}); You are not currently logged in. Log in or create a new account to post comments. Related Posts Francisco Franco Is Dead. Allahu Akbar. September 16, 2023 cats and their Muslim humans who just would like... May 6, 2021 The Islamic History of Coffee April 30, 2020 Habibi Funk January 4, 2016 Naturalis Historia December 16, 2013 (adsbygoogle = window.adsbygoogle || []).push({}); Tags Islam Ramadan moon schools approaches faith diversity moonsighting Malik'i Spain NorthAfrica Morocco Share Facebook'''
