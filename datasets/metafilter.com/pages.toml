title = "Do you know your ‘penis age’? | MetaFilter"
description = "Guardian: Johnson spends a reported $2m (£1.6m) a year on project Blueprint, his personal programme aimed at defying the ageing process ... For starters, he goes to bed at 8:30pm every night and..."
full_description = '''Do you know your ‘penis age’? March 3, 2025 9:49 AM Subscribe Guardian: Johnson spends a reported $2m (£1.6m) a year on project Blueprint, his personal programme aimed at defying the ageing process ... For starters, he goes to bed at 8:30pm every night and takes more than 100 pills a day ... He also eats all his meals before 11am, bathes in LED light, and spends a part of his day sitting on magnets ... Recently Johnson posted his penis data online, comparing it to data from his 19-year-old son Todger Talmage. posted by Wordshore (90 comments total) 5 users marked this as a favorite when you're a billionaire cis guy they let you get as much gender affirming care as you can affordposted by BungaDunga at 10:00 AM on March 3 [101 favorites] He's going to die of stress, living in constant fear of age. A real, "Tragedy of Plagueis the Wise" bitposted by Slackermagee at 10:02 AM on March 3 [6 favorites] I would have thought a penis tracker would be something totally different, more to dissuade wandering.posted by Capt. Renault at 10:03 AM on March 3 [12 favorites] Spending two million dollars a year on a personal project to “defy the aging process” has to be one of the most selfish things you can do with that much money. Insanely self-centered behavior.posted by Doleful Creature at 10:03 AM on March 3 [13 favorites] What a waste of time and moneyposted by Saxon Kane at 10:04 AM on March 3 [3 favorites] imho on the scale of billionaire hobbies it's probably one of the least destructive to others so on balance I support it as harm reduction, doubly so if it ends up killing him prematurelyposted by BungaDunga at 10:04 AM on March 3 [31 favorites] like, you can easily spend more than $2m a year keeping your megayacht afloat and emitting megatons of carbon. this is less badposted by BungaDunga at 10:05 AM on March 3 [28 favorites] Jesus H Christ on a popsicle stick, what a pathetic loser. Every single person I know who is obsessed with living longer does nothing good with the time they actually have. They’re hoarders of time.posted by dobbs at 10:07 AM on March 3 [17 favorites] Recently Johnson posted his penis data online, comparing it to data from his 19-year-old son. Daaaaad, you're embarrassing me!posted by box at 10:13 AM on March 3 [6 favorites] bet he dies falling down the stairs while playing with his trackerposted by kokaku at 10:14 AM on March 3 [11 favorites] i watched a netflix documentary about this fella - IMDB link. it played as equal parts: nut job, intense hobbyist, altruistic contributor to experimental/emerging science, and budding cult leader. probably not surprising, the guy is an epic narcissist. i agree with the others that have asserted he could be (while many are) doing worse things with $2m/yr.posted by rude.boy at 10:15 AM on March 3 [3 favorites] That's a new scale on the "How much does your money normalize your weirdness?" scale. Because for people who aren't billionaires, "Hey son, let's compare our penises for a few months" is DCFS time, not "profile in The Guardian" time.posted by DirtyOldTown at 10:16 AM on March 3 [29 favorites] has to be one of the most selfish things you can do with that much money it's probably one of the least destructive to others What's the income/net-worth cutoff point where Metafilter comments switch from "Hey, it's their money, they can do what they like with it" to "That rich bastard is wasting money that could be better spent elsewhere"...?posted by Greg_Ace at 10:17 AM on March 3 [5 favorites] I don't need one of those trackers to know my, uh, health.posted by grumpybear69 at 10:28 AM on March 3 [2 favorites] I think it also has to factor in the amount of harm to others it factors in - this is a relatively small amount of money of his worth that's being spent and the only person he's directly hurting is himself. But man... what a completely un-fun way to live your life.posted by drewbage1847 at 10:28 AM on March 3 [1 favorite] Why does there have to be some extensive moral justification for hating the guy ie how he "wastes his money" or "does harm"? Can we not just hate a VC influencer freak for talking extensively and publicly about pseudo science and him and his sons boners? Some of you really need a 101 on how to be a hater.posted by windbox at 10:33 AM on March 3 [42 favorites] I would like to read a run-through of the editorial process behind articles like this. There have been so many profiles of this guy, and also the two natalist grifters whose name escapes me (the ones with the round Harry Potter glasses who also abuse their kids). Why do we need another profile of this Johnson guy? There are so many fascinating people on this earth!posted by dantheclamman at 10:36 AM on March 3 [6 favorites] Who would he be comparing his penis to if he had a 19 year old daughter?posted by TedW at 10:37 AM on March 3 [2 favorites] According to my calculations, it ain’t worth it. But he also has the penis of a 22-year-old. He should give it back. To be clear, he has the penile health of someone 25 years younger. Grauniad, I love youposted by chavenet at 10:48 AM on March 3 [3 favorites] the current death rate remains steady, at 100%. Quote of the year right there.posted by heyitsgogi at 10:48 AM on March 3 [15 favorites] The 47-year-old tech millionaire claims to have the penis of a 22-year-old it was lying on a blanket next to a broken toaster oven some guy was selling it bryan had to buy it off him he wanted twenty-two bucks but bryan talked him down to seventeen bryan took it home washed it off and put it back on he was happy again completeposted by flabdablet at 10:52 AM on March 3 [48 favorites] Previously, from 2023. But he's certainly worth mocking every two years or so. Yes, "night-time erections are a significant biomarker for longevity," but I'd guess day-time ones are as well, and there's not much point in using tech to measure at night what is obvious to most men during the day. But on the serious side, some doctors say that the easy availability of erectile medication means that some men with significant underlying cardiovascular conditions are not getting the care they need. If your circulation, of whatever form, isn't what it used to be, get checked out.posted by Mr.Know-it-some at 10:52 AM on March 3 [3 favorites] cursed video from X (cw: shirtless Bryan Johnson): "Dancing improves heart health, strength, balance, bone density, and cognition. It reduces stress, anxiety, and depression... Ankle braces because of how easy it is to accidentally step on someone’s foot on a crowded floor and roll the ankle"posted by BungaDunga at 10:53 AM on March 3 [3 favorites] what a completely un-fun way to live your life. Seriously. What is he extending his life for? So he can continue going to bed at 8:30 for an extra 10-20 years? So he can continue not eating a nice dinner with friends because it's past his 11AM mealtime cut-off? So he can continue monitoring himself every moment of every day? It all seems pointless if there's no room to, you know, enjoy your life.posted by Saxon Kane at 11:01 AM on March 3 [20 favorites] That feeling of smug superiority can produce some really powerful night-time erections.posted by box at 11:06 AM on March 3 [12 favorites] I was amused to read this thinking it was Boris Johnson. Seeing the picture of Bryan now I kinda wish it WAS Boris and not this weirdo.posted by symbioid at 11:18 AM on March 3 [3 favorites] Seriously. What is he extending his life for? So he can continue going to bed at 8:30 for an extra 10-20 years? So he can continue not eating a nice dinner with friends because it's past his 11AM mealtime cut-off? So he can continue monitoring himself every moment of every day? This reminds me of a subplot at the beginning of the first Red Dwarf novel where Rimmer is spending every free moment he has aboard the ship in suspended animation and at one point he makes some smug brag to Lister about how in a year's worth of accumulated sessions he'll have only aged ten months.posted by RonButNotStupid at 11:19 AM on March 3 [5 favorites] So he was on last week's episode of the Kardashians and he implied that his erections are the result of/related to his use of a vibrating device that you sit on (the device I think was for recovering from birth?). He was also on the show Andrew Huberman, who also seems "fun".posted by armacy at 11:21 AM on March 3 [1 favorite] Hmm he might want to consider swapping it out.posted by chococat at 11:25 AM on March 3 cursed video from X (cw: shirtless Bryan Johnson) Starting to get a pretty strong vibe that "cursed" might be 2025's Word of the Yearposted by flabdablet at 11:25 AM on March 3 [3 favorites] Johnson you say?posted by 3.2.3 at 11:29 AM on March 3 [5 favorites] Johnson you say? The only way this could be more apt is if his first name was Richard.posted by vverse23 at 11:40 AM on March 3 [4 favorites] when you're a billionaire cis guy they let you get as much gender affirming care as you can afford Just thought this needed to be posted more often.posted by signal at 11:45 AM on March 3 [12 favorites] Nish Kumar may have the most compelling thinking about this guy and his inevitable death "I can't be the only person who wants , who thinks, I've never wanted someone to be hit by a car more. Like every time I hear it I'm just like, and every time people say you'll feel bad , I'm like no I will masturbate, like, if he, if he dies in a car accident"posted by stuartmm at 11:48 AM on March 3 [10 favorites] One has to wonder at this point if Johnson is interested in actually living a long time or just in living in as many people's minds as possible through the endless profiles of him.posted by ssg at 11:49 AM on March 3 [2 favorites] Hard to believe he is actually called ‘Johnson’. Does he hang out with John Thomas and Dick Hampton?posted by Phanx at 12:09 PM on March 3 [2 favorites] Seriously. What is he extending his life for? I started the Netflix doc as a hate watch, but it was more interesting than I expected. It implies pretty strongly (not only based on what he reveals but also the interviews with his family) that the guy was deeply depressed to the point of being suicidal not that long ago. A big part of it for him, besides overwork, was leaving the Mormon church (and his marriage) as an adult, and losing contact with his kids (though one has since decided to be back in his life and seems to also be questioning the church). Johnson's father had also also abandoned the church as an adult, and a lot of Johnson's personality makes more sense in this context. Anyway, like many middle-aged people before him, he addressed his midlife crisis by focusing on his physical health, except he has much, much, more money to do so. The guy is a nut (and is a fan of RFK Jr. and recently said he regrets getting the COVID vaccine despite the fact that COVID drastically aged his lungs' biomarkers), but he seems genuinely happier in his new health cult. Easy to make fun of the guy, but I find it hard to hate him after watching the doc. Sure, I'd rather he donated his wealth to medical research, but I agree this is a better way of dealing with being suicidal than buying a yacht.posted by coffeecat at 12:11 PM on March 3 [16 favorites] What is he extending his life for? So he can continue going to bed at 8:30 for an extra 10-20 years? So he can continue not eating a nice dinner with friends because it's past his 11AM mealtime cut-off? Yeah, I'm here to enjoy life, not hypermile it.posted by Greg_Ace at 12:15 PM on March 3 If you prefer, he could get into politics like those other billionaires are doing. Going to sleep early and taking a few vitamins? Good for him!posted by fragmede at 12:18 PM on March 3 [2 favorites] Assumed this was about Boris Johnson, will keep assuming so.posted by Going To Maine at 12:21 PM on March 3 [1 favorite] Hm. A billionaire with an obsession that has a relatively small blast radius? As billionaires go, the ones we don't hear about almost certainly get up to much more vile stuff.posted by tclark at 12:23 PM on March 3 (As far as pursuing immortality goes, I think the other Brian Johnson might have a better stragegy.)posted by box at 12:37 PM on March 3 [3 favorites] > Every single person I know who is obsessed with living longer does nothing good with the time they actually have. They’re hoarders of time. I am doing nearly nothing constructive to extend my own life -- but I will also, when left to my own devices, spend an entire day finely tweaking a bash script so that it feels better when I read it, or spend a week delving into corners of the internet to log on a spreadsheet all the model variations, with detailed product info, of a piece of hardware I was interested in once. Many of us have hobbies or obsessions that allow us to spend time within a comfortable mental space which looks absolutely dreary from the outside. Dude is still a wanker, though.posted by at by at 12:48 PM on March 3 [7 favorites] Grauniad, I love you. Oh, they made quite the typo on their live blog earlier today.posted by Wordshore at 1:02 PM on March 3 [6 favorites] "David, bring me the tea"posted by clavdivs at 1:17 PM on March 3 addressed his midlife crisis by focusing on his physical health, except he has much, much, more money to do so. Yes, but I would be shocked if the extra spending has even a marginal benefit. Money buys lots of health: time and space to exercise and sleep, healthy and tasty food, reduced stress and pollution, access to good health care, and people who make that easier for you (personal trainers, chefs/restaurants/home food delivery). But basically all of that is available to the typical upper-middle class or slightly rich person.posted by Mr.Know-it-some at 1:27 PM on March 3 [2 favorites] he regrets getting the COVID vaccine despite the fact that COVID drastically aged his lungs' biomarkers Is anybody actually reliable at following the evidence they carefully pursued? Is it just not a human capacity? Is it impossible to choose a measurable goal that would not itself be horrible?posted by clew at 1:38 PM on March 3 [2 favorites] Man, can we stop talking about this narcissistic, necrotizing loser? ETA: I didn't read any other comments. Or the article. I don't what any of you wanted to say. This fucker deserves none of our attention even for amusement. I sincerely believe this post should not have been made. We've all seen this asshole before. Nothing here means anything or will affect anything. We all die eventually and are preceded in death by meaning.posted by DeepSeaHaggis at 2:10 PM on March 3 [1 favorite] DeepSeaHaggis: Perhaps this is not the thread for you, buddy. I personally feel for his poor son. I believe he was injecting his son's blood for a bit there?posted by Jilder at 2:25 PM on March 3 [9 favorites] I don't what any of you wanted to say. [sic] I don't either.posted by Greg_Ace at 2:28 PM on March 3 [2 favorites] The 47-year-old tech millionaire claims to have the penis'''
