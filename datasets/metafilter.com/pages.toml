title = "About | MetaFilter"
full_description = "About Metafilter MetaFilter (MeFi) is one of the longest-running online communities. MeFi isn't only a community weblog where anyone can contribute, it is also a place where you'll find some of the most interesting stuff on the internet. Here you can expect thoughtful and varied discussions. Since 1999, we've been focused on fulfilling the web's potential to bring people together and create genuine, vibrant, good-hearted community spaces. You can join MetaFilter and support us. About Us The site is run by a small team of paid professionals providing round-the-clock moderation and support for a community of thousands of daily active members. Please check out MeFi's Community Guidelines to learn more about the dynamics of our community. Subsites Aside from MetaFilter's front page, where you can share and discuss interesting links from around the web, we have some interesting subsites. Whether you want to Ask and crowdsource answers from other community members; discuss and recommend movies, books, and other media in FanFare; share your own creative work in Projects; upload and share your own Music; look for open Jobs or talent around the globe, organize or attend all sorts of meetups, and MeFi Events IRL; or Chat live with other members, this is a place for all the good things the internet makes possible. You can also check out current experiments in Labs and join us to discuss site features, updates and policies in MetaTalk."
