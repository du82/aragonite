title = "NYT review of MeFi's own Omar El Akkad's New Book | MetaFilter"
description = "Irish author Fintan O'Toole reviews One Day Everyone Will Have Always Been Against This by MeFi's own pre-eminent science fiction author Omar El Akkad for the New York Times."
full_description = '''NYT review of MeFi's own Omar El Akkad's New Book March 2, 2025 5:20 PM Subscribe Irish author Fintan O'Toole reviews One Day Everyone Will Have Always Been Against This by MeFi's own pre-eminent science fiction author Omar El Akkad for the New York Times.Previously: Kim Stanley Robinson & Omar El Akkad discuss the climate crisis* *When it comes to apocalyptic dysfunctional eco-catastrophes MeFi's own Omar is our full service provider... ;) posted by y2karl (11 comments total) 27 users marked this as a favorite (adsbygoogle = window.adsbygoogle || []).push({}); Gift linkposted by zenzenobia at 5:36 PM on March 2 [3 favorites] I really liked American War and its stuck in my head in way that is rare. I don't think i can bring myself to read this new book. Although over the last, 16 months, I've dedicated significant effort toward divestment campaigns and other forms of protest against the US role in Israel's war on Palestinians, I have barely been able to take in any media about it. It's just too horrifying. For me, I have the ability to look away, so in fact I do. But I'm glad the book is getting attention. I've no doubt it is important, impactful, and powerful.posted by latkes at 11:17 PM on March 2 [1 favorite] Here's one way we'll look back on thisposted by chavenet at 1:43 AM on March 3 [3 favorites] He was also recently interviewed in Toronto Life as well!posted by Kitteh at 3:21 AM on March 3 [4 favorites] Thanks for that Toronto Life interview - many parts of his experience feels relatable to me.posted by cendawanita at 3:44 AM on March 3 [1 favorite] I picked this up yesterday at an indie bookstore. I've been a fan of his work since back in his Globe and Mail days. The indie bookstore had it on proud display just inside the door, the most obvious place in the shop. I went to Indigo later in the day, and it was tucked into the 'history and politics' section, not even turned to face outward. Nothing on their 'big issues', 'new nonfiction', 'proudly Canadian' etc displays. I wonder why that is. Could be just the Indigo I went to, of course. I'd be curious to find out how other stores are presenting it.posted by the one second advantage at 4:30 AM on March 3 [4 favorites] American War was a novel that felt like journalism, but it just scraped me raw. It felt real in a way that a lot of other climate fiction does not. I can't say I'm looking forward to reading One Day because it sounds like it's going to hurt...but I'm going to read it nonetheless.posted by mittens at 6:28 AM on March 3 [1 favorite] Mod note: Title corrected, comments requesting correction deleted, and typo in one of the tags has been corrected! posted by travelingthyme (staff) at 7:35 AM on March 3 [4 favorites] Thank you so much for all that.posted by y2karl at 10:23 AM on March 3 Honestly, the only reason this book has gotten any traction (and I think this is true of my whole career as an author, or what little of it there is) is because of indie bookstore support. To the best of my knowledge, my publisher bumped up the initial print run three times in the leadup to publication, mostly on the strength of bookseller responses. I know I'm preaching to the choir here, but please support your indie bookstores; they're run by people who genuinely care about what they do. (And if any of y'all end up reading this book, please lemee know what you think, even if you think it's shit).posted by Fireland at 8:40 PM on March 3 [5 favorites] Thanks for plugging the local bookstores and thanks for participating in this thread!! The way I found American War was, at the beginning of COVID, East Bay Booksellers had this deal where you tell them some books you've liked and they would sell you a surprise bag of books they thought would work with your tastes, and your book was in that bag! So yeah, fuck the internet selling books like they're toothbrushes and thank you for your work. Being an artist of any kind, or craft person, or journalist is rough as hell right now so I feel enormous gratitude for you and your work.posted by latkes at 6:53 PM on March 4 « Older Before Hitler: Your Turn | Al Schmitt Newer » (adsbygoogle = window.adsbygoogle || []).push({}); You are not currently logged in. Log in or create a new account to post comments. Related Posts You put out fresh sashimi, sometimes, arranged as... December 6, 2015 Bi-Mon-Spec-Fi-Hi-Co'mn: Set Phasers to Learn! March 31, 2014 Paolo Bacigalupi's dystopian near-future cyberpunk... October 1, 2013 She Blinded Me ... with SCIENCE! August 12, 2013 "It's a Sugar song." June 4, 2013 (adsbygoogle = window.adsbygoogle || []).push({}); Tags Science Fiction ScienceFiction ScienceFictionAuthor Omar Dystopia Dystopian Ecocastrophe Gaza Genocide WillfulObliviousness BanalEvil OmarElAkkad Share Facebook'''
