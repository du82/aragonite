full_description = '''LEAD PIPE GO February 28, 2025 8:00 PM Subscribe Pretty Pretty Please I Don't Want To Be A Magical Girl, a voice-acted animatic and pilot. 11 minutes. posted by JHarris (16 comments total) 15 users marked this as a favorite (adsbygoogle = window.adsbygoogle || []).push({}); I meant to enter "animatic" instead of "animation" but hit the Submit button a little early. It's not a full animation. Mod fix?posted by JHarris at 8:00 PM on February 28 [1 favorite] Impressive! Heartening to see people working up their own projects during this horrible last couple of years in the industry.posted by brachiopod at 8:39 PM on February 28 [2 favorites] SHOVE IT, MOON MANposted by McBearclaw at 8:42 PM on February 28 [4 favorites] i don't wanna be a magical girl either, but the ability to poof a lead pipe seems like it'd be handy lately.posted by Clowder of bats at 9:21 PM on February 28 [5 favorites] That was officially amazing.posted by Citrus at 11:21 PM on February 28 The artist, Kiana Khansmith is amazing. If anyone has a dropout subscription, their appearance on Game Changer along with Nathen Yaffe and Caldwell Tanner is delightful. Just illustrators nerding out with each other.posted by mrzarquon at 11:31 PM on February 28 [2 favorites] A clip from the gamechanger episode.posted by mrzarquon at 12:36 AM on March 1 [1 favorite] This is the best deconstruction of the genre since Madoka.posted by automatronic at 1:27 AM on March 1 [1 favorite] Mod note: Post edited per OP request, changed animation to animaticposted by Brandon Blatcher (staff) at 2:09 AM on March 1 [2 favorites] Fun! At times the patter reminded me a bit of Brendan Small/Home Movies, which is always a good thing in my book. Looking forward to more.posted by SaltySalticid at 6:10 AM on March 1 [1 favorite] mrzarquon, I found the video from her Bluesky feed! Her bio says she's a Director at Disney TV Animation!posted by JHarris at 10:12 AM on March 1 [1 favorite] Love this for all the above, but also that end credits song is just beautiful.posted by freya_lamb at 10:19 AM on March 1 [1 favorite] I don't know if this concept could sustain a whole series as it is but I liked it a lot (the whole "why am I running?" bit early on sold me on it). However, I want to see more. The art style is great -- familiar but also its own thing. It plays with the magical girl tropes so well -- both in the way anime/manga does it and how American interpretations do. The voice acting is great and makes me wish I had a lot of cool friends. (Well, OK, I do have a lot cool friends, but none of them are voice actors.) The lead pipe joke was incredible and while it was violent, I also appreciated it just leaned into goofy more than grotesque. Also, the detransformation sequence was so perfect. (I love magical girl transformation sequences.) What a wonderful 11 minutes of entertainment.posted by edencosmic at 3:10 PM on March 1 [2 favorites] I nth the detransformation sequence love! I'm not sure you can really sustain the concept for a full season, but if they can it'd be cool.posted by sotonohito at 11:20 AM on March 2 [1 favorite] A clip from the gamechanger episode. I was wondering how that was related until I saw her name as the creator! I love her humor! I would definitely watch a whole show of this. Also, more black girl protagonists!posted by numaner at 8:25 AM on March 4 [1 favorite] My favorite bit was Hoshi casually phasing through some girl on the way out of the bathroom.posted by mbrubeck at 8:47 AM on March 4 [1 favorite] « Older John Frankenheimer's "French Connection II" | How 3D models are becoming a game changer for... Newer » (adsbygoogle = window.adsbygoogle || []).push({}); You are not currently logged in. Log in or create a new account to post comments. Related Posts A Plethora of Unaired Pilots November 25, 2022 This ain't chemistry. This is Art. September 29, 2013 JollyMetaFilter July 27, 2008 Too Much Sunshine Will Make Him Explode. April 6, 2008 To Paris and back! February 9, 2006 (adsbygoogle = window.adsbygoogle || []).push({}); Tags pilot animatic video animation youtube PrettyPrettyPleaseIDontWantToBeAMagicalGirl Share Facebook'''
