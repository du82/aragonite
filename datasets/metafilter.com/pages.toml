full_description = '''↔ March 4, 2025 5:17 AM Subscribe Could time flow in both directions rather than just moving forward? A groundbreaking study from the University of Surrey suggests that under certain quantum conditions... [spacedaily/nature] posted by HearHere (27 comments total) 12 users marked this as a favorite (adsbygoogle = window.adsbygoogle || []).push({}); .ti eciton t'nod tsuj ew dna su rof sdrawkcab gniwolf SI emit ebyam roposted by heyitsgogi at 7:08 AM on March 4 [7 favorites] Hmmm, I should try this out -- I'll let you know yesterday how it goes.posted by AzraelBrown at 7:27 AM on March 4 [8 favorites] Backwards Red Dwarf episode. !ydit moorraBposted by jenfullmoon at 7:38 AM on March 4 [4 favorites] I read this next week. It's interesting.posted by Thorzdad at 8:35 AM on March 4 [3 favorites] Could someone explain what this could mean in practical terms? What are the implications of this? What, if anything, can be done with this discovery?posted by star gentle uterus at 8:47 AM on March 4 [1 favorite] Could someone explain what this could mean in practical terms? What are the implications of this? What, if anything, can be done with this discovery? posted by star gentle uterus at 11:47 AM on March 4 From a practical, real world perspective, this means we can eat an entire large pizza and then go back in time and do it again to enjoy it for a second time. It's remarkable, really.posted by glaucon at 9:12 AM on March 4 [4 favorites] Backwards Red Dwarf episode. !ydit moorraB Backwards is just how time moves in Bulgaria. And the end of that episode shows the downside of backwards time. (and the StarWars like timecard mentioning it in the next one).posted by The_Vegetables at 9:18 AM on March 4 [1 favorite] I'm going to start replacing all instances of "woke" I see or hear with "quantum" in my head. Just for fun.posted by Greg_Ace at 9:36 AM on March 4 [5 favorites] I'm going to start replacing all instances of "woke" I see or hear with "quantum" in my head. Just for fun. posted by Greg_Ace at 5:36 PM on March 4 There was a great browser extension "SJW to skeleton" that made things tolerable way back when, so your idea can probably be adapted and be just as good.posted by phax at 9:49 AM on March 4 [2 favorites] someone explain what this could mean in practical terms? "focus on having worthwhile intentions" is a good idea from an earlier comment from the paper: Any state which is a steady state of the future is also a steady state of the past. so, as above, this means if you want pizza now & some other time: have pizza 🍕posted by HearHere at 10:29 AM on March 4 [1 favorite] I appreciate the joke answers but I really would like someone with physics knowledge to explain this a little more for a layman like me.posted by star gentle uterus at 10:30 AM on March 4 [5 favorites] with physics knowledge to explain this a little more also from the paper: When the Lindblad equation reduces to the time-independent Schrödinger equation, this condition corresponds to the Hamiltonian commuting with the time-reversal operator basically, what is being described is how this equation can be extended [wiki2]posted by HearHere at 10:35 AM on March 4 Well, we could really use a rewind button about now.posted by snuffleupagus at 11:26 AM on March 4 [5 favorites] Paging physicsmattposted by lalochezia at 12:09 PM on March 4 [1 favorite] Gives me hope that I could drive to some remote location, hang out for a while and drive back, but end up in the past.posted by otherchaz at 12:48 PM on March 4 [1 favorite] Not physicsmatt but, pizza hopes aside, this, like almost all Quantum effects, happen at smaller distances than we have microscopes to see. Then it all gets averaged out and filtered up to us. Mostly. If you look in the right directions you can see Quantum effects in our World but you have to look. Or know that some clearly observable effects are Quantum based instead of some other incomprehensible Physics thing. There are plenty of other weird Quantum things that only operate on the small scale. Wouldn't be strange if time is another one. "Atoms can be in two places at the same time" https://www.sciencedaily.com/releases/2015/01/150120085919.htmposted by aleph at 12:48 PM on March 4 [1 favorite] If so, this would imply that two opposing arrows of time would have emerged from the Big Bang, which would account in turn for the maintenance of time-reversal symmetry despite the ensuing dissipative nature of the universe. We would happen to live in one of them, where dissipation and entropy increase are common experience, but unaware of the existence of the other alternative possibility. That's a hell of an idea to think about.posted by lucidium at 1:48 PM on March 4 [2 favorites] So we're on the Big Bang side of the timeline, and they're on the Big Crunch end, which oscillates back and forth? Trippy.posted by AzraelBrown at 2:04 PM on March 4 [2 favorites] .. practical terms So I'm interested in applications of metamaterials to real world problems at the metre scale so a google scholar search is worth running for any of these nano effects, as sure as eggs someone will be looking for human scale applications. "quantum" "time flow" "room scale"|"metre scale"|"metre" effects Looks like some contenders but needs some fiddling re disambiguation, eg real time flow.posted by unearthed at 2:13 PM on March 4 [1 favorite] All this effort to turn a question in a Cher song from a hypothetical into a reality?posted by pmbuko at 2:21 PM on March 4 [3 favorites] This is a complicated and tricky topic to write about. In short, there are two arrows of time. The first is the one we experience in our human-scale lives. This is the thermodynamic arrow of time. It shows up as a statistical certainty: farts and perfume diffuse through the room instead of flowing back to a concentrated point. A series of individually reversible interactions (perfectly elastic collisions, for those of your playing along at home) can still lead to an aggregated outcome that is vanishingly unlikely to unwind. The second is the weird quantum one, and isn't something we had any clue existed until 1964 (Christenson, Cronin, Fitch, Turlay). It turns out that almost every interaction we know about in physics is symmetric under time reversal. Looking at it forwards or backwards would look the same: imagine a billiard ball rolls in to frame (from the left), hits another one, and the struck one rolls out of frame (to the right). Now you watch that same movie in reverse. A ball rolls in from the right, strikes, and a ball rolls out to the left. If the balls are good enough, you won't be able to measure a difference in speed, so you have no way of telling which one was the original and which was playing backwards. Almost every interaction has this symmetry, but Cronin and Fitch won a Nobel for finding one that doesn't. I'll need to read this a little more closely, but the introduction is sloppy at best. The Standard Model is most certainly not time-reversal invariant. Like Newton's Laws, the Schroedinger Equation is good and useful, but only in limited applications. The first page of this Quantum Field Theory textbook next to my desk talks about the shortcomings of the Schroedinger equation. (My PhD research was on an experimental search for time-reversal asymmetry in the neutron, so this happens to be right over the plate for my wildly specialized training)posted by MengerSponge at 3:12 PM on March 4 [13 favorites] ↪️🍕↩️posted by clavdivs at 4:07 PM on March 4 [3 favorites] eat an entire large pizza and then go back in time and do it again to enjoy it for a second time I did that in a ferry on rough seas once.posted by HiroProtagonist at 6:43 PM on March 4 [4 favorites] “In particular, while global continuous symmetries can be directly observed — via such experiments as the Galilean ship experiment — a local continuous symmetry can have only indirect empirical evidence” [sep] a little more for a layman like me star gentle uterus, it can be helpful to have a more generalized understanding to approach unearthed's good examples of ways in which these ideas can be helpful in practice, i.e. why the fpp paper does not mention the Standard Model & instead writes “A system can be reversible (unitary) but not time-reversal symmetric” [wiki] / the shortcomings of the Schroedinger equation : there are many ways in which we can describe time evolution in quantum mechanics; they are all conceptually different but mathematically equivalent tl;dw [29:20:] "what this means is that, for a conservative system, the Hamiltonian in the Heisenberg picture [wiki] is equal to the Hamiltonian in the Schrödinger picture"posted by HearHere at 2:33 AM on March 5 [1 favorite] An agitated cat goes into scanner. A picture of the cat is then inserted, calming the cat, so that the cat can be safely carried by a human.posted by swr at 3:51 AM on March 5 [2 favorites] 😸posted by HearHere at 5:17 AM on March 5 honestly kind of mesmerized by the poetry of "farts and perfume diffuse through the room"posted by Gerald Bostock at 7:39 AM on March 5 « Older Time is eccentric and unforgiving; at least it’s... | And so it begins Newer » (adsbygoogle = window.adsbygoogle || []).push({}); You are not currently logged in. Log in or create a new account to post comments. Related Posts Does anybody really know what time it is? January 5, 2002 Giuliani is Time's Man of the Year. December 23, 2001 Metric Time... May 29, 2001 Time Digital 2026: December 6, 2000 Why, yes, I like being stupid, March 8, 2000 (adsbygoogle = window.adsbygoogle || []).push({}); Tags time Share Facebook'''
