The Motion Picture McLibel is a 2005 feature-length documentary by Franny Armstrong and Ken Loach about the libel suit brought in England by McDonald's Corporation against environmental activists Helen Steel and David Morris for publishing this. [more inside] posted by Lemkin on Feb 11, 2025 - 7 comments THE PRICEMASTER HAS SPOKEN The PriceMaster (32:23, a little NSFW) "'Everything is for sale.' 'Make me an offer!' . . . the wonderful mantras of the prophet of Captive Market Capitalism (i.e. American Style Corporate Capitalism) echo pertinently on a crisp winter day in Denton, TX in the newborn hours of the great decisive 21st Century. Members of the hallowed Fast House look on and document the unfolding." [more inside] posted by chinesefood on Feb 10, 2025 - 6 comments Primary school Lord of the Rings The Winton School in New Zealand was forced to cancel its annual musical due to COVID concerns. So they leveraged the spectacular South Island New Zealand scenery seen in Lord of the Rings, got a professional cinematographer on board, and made a full-length fantasy epic: The Great Sword of Isthgul. [more inside] posted by rednikki on Feb 10, 2025 - 5 comments A man went looking for America. And couldn't find it anywhere . . . Easy Rider (1969) trailer Easy Rider is a 1969 American road drama film written by Peter Fonda, Dennis Hopper, and Terry Southern, produced by Fonda, and directed by Hopper [more inside] posted by beesbees on Feb 8, 2025 - 45 comments James Foley’s “Glengarry Glen Ross” The whole fucking movie (4K). Are you gonna watch it? Are you man enough to watch it? [more inside] posted by Lemkin on Feb 6, 2025 - 80 comments Orson Welles’ “The Trial” “When it comes to film adaptations of very famous works of literature, there’s always a lot of pressure on the artist to produce something worth its background. In this case, Welles created a technically grandiose movie loyal to Kafka’s story, but enhanced by the infusion of Welles’ own vision. The Trial stands as one of the most accomplished book-to-film adaptations, and in Welles’ rich career, it’s a film that ranks among the very best.” - Sven Miculek [more inside] posted by Lemkin on Feb 4, 2025 - 11 comments These Other Londons London, like New York, is often too busy, and too much in flux, to play itself on film. So, time after time, filmmakers rebuild it on backlots... posted by Fiasco da Gama on Feb 4, 2025 - 7 comments The costumes of Martin Scorsese's Casino 20 reasons why Casino is the most stylish film of all time. The Perfect Fits of Casino. Sharon Stone on the Unforgettable Fashion of Casino, 25 Years Later. 7 suiting lessons to learn from Robert De Niro in Casino. [more inside] posted by Lemkin on Feb 2, 2025 - 7 comments Winter Soldier Winter Soldier is a 1972 American documentary film, chronicling the Winter Soldier Investigation, which took place in Detroit, Michigan, from January 31 to February 2, 1971. The film documents the accounts of American soldiers who returned from the War in Vietnam and participated in this war crimes hearing.* [more inside] posted by Lemkin on Feb 2, 2025 - 10 comments And so Cronenberg spliced together an unholy beast of a film "However, it’s in 1991’s Naked Lunch that Cronenberg most openly takes a clear-eyed look at the work of the creative and, in doing so, a look at himself. In conversation with Film Comment, Cronenberg called his adaptation of William S Burroughs’ surreal classic 'a meditation on the artistic process'." posted by cupcakeninja on Feb 1, 2025 - 21 comments The Most Beautiful Boy in the World "In The Most Beautiful Boy in the World, a heart-wrenching documentary, co-directors Kristina Lindström and Kristian Petri puncture the uneasy vein of child star building, explaining how often the practice ensnares the vulnerable. They do so by telling the story of once Swedish teen idol Andrésen, who at the age of fifteen was cast as Tadzio in Italian director Luchino Visconti’s adaptation of Thomas Mann’s novel Death in Venice. The part would bring the Swedish actor fame, adulation, and adoring fans only for the ensuing noise of stardom to rupture his life, permanently." - Robert Daniels posted by Lemkin on Jan 28, 2025 - 4 comments I think it's the other way around; I think I look like you. Pioneer is short film by David Lowery starring Will Oldham and Myles Brooks. It investigates fatherhood, the long history of US racial violence, and reasons we tell children stories, and perhaps tell them to ourselves. SLYT. [more inside] posted by es_de_bah on Jan 27, 2025 - 4 comments Martin Scorsese's "The King of Comedy" "We’re talking about a black comedy that hardly delivers any laughs. A comedy that isn’t funny because it portrays the hilarious albeit sad constituent of our everyday lives, something we don’t find funny because we’re a part of it, because we give our best to help the carousel continue spinning. That’s why The King of Comedy hit a little too close to home to be universally admired at the time of its release. In its portrayal of celebrity worship and the American media culture, it’s honest, sharp and cuts deep, hurting the viewer, forcing him to think, offering the truth about society and the media bluntly, directly, without any euphemism or regard." - Cinephilia Beyond [more inside] posted by Lemkin on Jan 24, 2025 - 30 comments In 2024 I saw 1,289 movies... "And it seems that I’m just getting started." Hanan Levin (MeFite growabrain) has watched more than 4000 movies in the last four years and shares short reviews, favorites, and bits of film history on an extensive and engaging set of Tumblr posts (with a bonus spreadsheet of movies watched). [via mefi projects] (growabrain previously) [more inside] posted by kristi on Jan 22, 2025 - 20 comments An abundant legacy across a range of artistic media Mr. Feiffer was primarily known as a cartoonist. His syndicated black-and-white comic strip, “Feiffer,” which astringently articulated the cynical, neurotic, aggrieved and ardently left-wing sensibilities of postwar Greenwich Village, began in The Village Voice in 1956 and ran for more than 40 years. But his career also encompassed novels, plays, screenplays, animation and children’s books. from Jules Feiffer, Acerbic Cartoonist, Writer and Much Else, Dies at 95 [The New York Times; ungated] [more inside] posted by chavenet on Jan 22, 2025 - 42 comments Martin Scorsese’s “The Color of Money” How The Color of Money’s “One For Them” Assignment Reignited Martin Scorsese’s Hunger for the Work [more inside] posted by Lemkin on Jan 22, 2025 - 13 comments A Very Short Stop-Motion Film Man sits in chair [more inside] posted by dick dale the vampire on Jan 18, 2025 - 15 comments Sm10425 "...Purpose, the meaning of music" 1977 IBM educational film, "Some call it Software." (slyt. 10:59) posted by clavdivs on Jan 17, 2025 - 4 comments 80s Teen Sex Comedies The 80s were long ago and, in terms of socially acceptable comedy, far away. (CW: Brett Kavanaugh and screen piggishness) [more inside] posted by Lemkin on Jan 16, 2025 - 64 comments Martin Scorsese's "The Last Temptation of Christ" I believe Scorsese’s question in The Last Temptation of Christ is this: Could Jesus have doubted the very purpose of his death? If so, I must ask myself: Can I allow Jesus the same shroud of uncertainty that I have? Can I allow my Messiah the messiness of being human? If I miss the aspect of God’s shared humanity, I commit myself to never understanding my own. [more inside] posted by Lemkin on Jan 16, 2025 - 62 comments “and it has haunted not just me but the birding community at large” The Wrongest Bird in Movie History is an episode of the Slate podcast Decoder Ring [transcript]. In it guest producer Forrest Wickman goes in search of the answer to a question that has bedeviled birders for a quarter-century: Why is the bird identified as a ‘Pygmy Nuthatch’ in the Charlie Angels movie neither look nor sound like a Pygmy Nuthatch? And boy, does Wickman get answers. posted by Kattullus on Jan 14, 2025 - 21 comments Steven Soderbergh's "Solaris" At a time when many American movies pump up every fugitive emotion into a clanging assault on the audience, Soderbergh’s Solaris is quiet and introspective. There are some shocks and surprises, but this is not Alien. It is a workshop for a discussion of human identity. It considers not only how we relate to others, but how we relate to our ideas of others. - Roger Ebert [more inside] posted by Lemkin on Jan 12, 2025 - 29 comments Cinematic Passion Projects & White Whales "Eggers first announced his intention to remake “Nosferatu” 10 years ago, but his affinity for the landmark 1922 horror goes back much further. Growing up in New Hampshire, Eggers first encountered Orlok as a 9-year-old, on a VHS copy of Murnau’s “Nosferatu” made from a faded 16-millimeter print. He was so compelled by Max Schreck’s performance of the titular vampire, which felt all the more eerily authentic within the degraded version of the film he saw, that in high school, he directed a stage adaptation—later staged professionally—that was both silent and black-and-white, with music playing and actors painted monochrome. (Orlok was played, of course, by Eggers himself.)" [more inside] posted by cupcakeninja on Jan 11, 2025 - 33 comments Sun Ra: A Joyful Noise The prevalence of documentaries about musicians is a curse, because most of these films do a terrible job of showcasing music. One rare and moving exception is the work of the director Robert Mugge, whose film Sun Ra: A Joyful Noise -- about the musician and bandleader whose multimedia and pan-cultural activities made him one of the prime artists of Afrofuturism -- is one of the most satisfying musical portraits I’ve ever seen. - Richard Brody, The New Yorker [more inside] posted by Lemkin on Jan 8, 2025 - 10 comments "film’s wear and tear tells a story as important as the film’s content" In the 1930s, several Japanese companies produced films made on paper (“kami firumu”) instead of celluloid. The Japanese Paper Film Project preserves the surviving movies and promotes scholarship about these films. [via] posted by jessamyn on Jan 5, 2025 - 7 comments "Nosferatu" and the Pathology of Women’s Sexual Desire "In Robert Eggers’s new film "Nosferatu" (2024), Nosferatu is the dark Count Orlok, whom the socially alienated young Ellen summons as spiritual company, and the force her older, betrothed self must confront, navigating both attraction and repulsion." [more inside] posted by cupcakeninja on Jan 5, 2025 - 16 comments David Cronenberg's "Crash" Beyond the bounds of depravity: an oral history of David Cronenberg’s Crash (4K restoration trailer - technically SFW, but, you know...) [more inside] posted by Lemkin on Jan 4, 2025 - 30 comments The power of performative social practices to actualize new worlds I have been considering how to get out of a structure in which I am forced to make sense. So, I’ve been thinking about the ways in which 20th century Caribbean poetry did a lot of work around nonsense. There’s [also] a beautiful essay [about Peruvian poetry] by José Carlos Mariátegui in defence of pure nonsense [‘Defensa del disparate puro’, 1928]. I guess it’s very dadaist in a way: destroying the order around you, clearing a path so that other kinds of relationships between objects, ideas and places can happen. from Beatriz Santiago Muñoz: ‘Destroy the Order Around You’ [Frieze] posted by chavenet on Jan 4, 2025 - 2 comments The film music of Tangerine Dream Sorcerer. Thief. The Keep. Legend. posted by Lemkin on Jan 2, 2025 - 26 comments Philip Kaufman’s “Invasion of the Body Snatchers” “Invasion of the Body Snatchers (1978): The Loss of Self” [SPOILERS] [more inside] posted by Lemkin on Dec 31, 2024 - 13 comments Days are long, but Years are short On this day over a dozen years ago, we talked about filmmaker Sam Klemke's decades-long record of year-end reviews, a series of "annual personal status updates" reflecting on the past and hoping for the future that eventually became a poignant documentary film. It's just one example of the surprising emotional power of the "time passing" montage, an under-discussed narrative art that has often been used in one form or another to convey a profound sense of the beauty, fragility, and transience of life. A reverse time lapse for your perusal: Soul (2020): Regular Old Living / Years and Years (2019) / A Ghost Story (2017) / Arrival (2016) / "A Boy and His Duck" (2015) / Interstellar (2014): Years of Messages / "If London Were Syria" (2014) / Here (2014) / Boyhood (2014): "I just thought there would be more" / Up (2009): Married Life and Stuff We Did / "Hello Halley's Comet" (2009) / Passage (2007) / The Fountain (2006) / Six Feet Under (2005): Finale / Home Movies (2004): "Brendan's Camera" / Five for Fighting - "100 Years" (2004) / Decasia (2002) / Futurama (2002): "Jurassic Bark" / Toy Story 2 (1999): "When Somebody Loved Me" / Christmas Vacation (1989): Home movies / Here (1989) / Cin'''
