full_description = '''The world is riddled with maggots March 3, 2025 5:40 PM Subscribe A song by Chumbawamba that isn't Tubthumping Chumbawamba is often thought of as a one hit wonder, but there's a lot more to them. They're anti-fascist, pro-union, and loved to do protest songs. This one is even more relevant now. posted by mike3k (26 comments total) 40 users marked this as a favorite (adsbygoogle = window.adsbygoogle || []).push({}); Thank you for this! I would like to submit as well for your consideration Chumbawamba's a capella version of Bella Ciao (available on Spotify). I've listened to it both before and after some very spicy actions so it's kind of emotionally activating for me now and it can be hard to listen to but I really really like it, it gives me the shivers.posted by an octopus IRL at 6:14 PM on March 3 [9 favorites] Chumbawamba was formed in the town I was born, in the same year I was born, but I can't find any information narrowing it down further. I could have been the cosmic blip that caused this band to form!posted by HypotheticalWoman at 6:34 PM on March 3 [5 favorites] I Wish That They'd Sack Me is the most relatable anti-work song I've ever heard.posted by L.P. Hatecraft at 6:39 PM on March 3 [1 favorite] Their English Rebel Songs album seems even more relevant lately.posted by just this guy, you know at 7:02 PM on March 3 [7 favorites] I attended a folk music festival and they played trad English folk, entirely, and I think it's their jam?posted by ginger.beef at 7:06 PM on March 3 [4 favorites] Came here to recommend English Rebel Songs. Strong second for its modern relevance. I saw this very song on Instagram recently and have been thinking about them a lot.posted by gentlyepigrams at 7:06 PM on March 3 Frowner and I were just banging on about Chumbawumba and English Rebel Songs the other day.posted by zamboni at 7:40 PM on March 3 [2 favorites] There’s a great 2-part episode of the podcast Cool People Who Did Cool Stuff about Chumbawumba (featuring guest The Guy from Eve 6) about the band, their principles, and how the royalties from Tubthumping funded a LOT of activist groups in the UK in the late 90s and early 2000sposted by Jon_Evil at 8:24 PM on March 3 [7 favorites] They also have a wonderful song, called Wagner at the Opera, based on the first time Wagner was played in a Israeli concert house and an 80 year old concentration camp survivor disturbed the concert with a football rattle.posted by razorian at 11:12 PM on March 3 [1 favorite] I posted this song on Facebook recently because it showed up in my Youtube algorithm, and I hadn't heard it in such a long time. Unfortunately it's more salient than ever and my god it would be ideal at a protest. Odd, seeing it pop up here but this is certainly the historical moment for this wonderful song.posted by Phlegmco(tm) at 11:17 PM on March 3 [1 favorite] Hanging on the Old Barbed Wire is a British soldiers' song drawing attention to the vanity and greed of the World War 1 NCOs and officers who were casually sending privates to die in the trenches. It's one of he most powerful folk songs I know, and Chumbawumba's version is excellent.posted by Paul Slade at 12:45 AM on March 4 [1 favorite] disturbed the concert with a football rattle. Almost certainly a grogger. Same thing as a football rattle, but with a very specific Jewish cultural meaning.posted by zamboni at 4:51 AM on March 4 [1 favorite] They're anti-fascist, pro-union, and loved to do protest songs (and if any Kiwi needed any more reasons to like them, they sent Winston Peters a cease and desist to get him to stop using their music).posted by ngaiotonga at 4:55 AM on March 4 [1 favorite] This should be played at a very loud volume, on repeat, outside the DOGE offices.posted by JustSayNoDawg at 6:29 AM on March 4 I saw a graphic on social media (FB link) recently for what I thought was a Chumbawamba reunion, but it turns out it is seven core members speaking at the Rebellion Literary Festival in August 2025. Ps why does autocorrect want to make the next-to-last vowel a U?posted by larrybob at 7:17 AM on March 4 I’ve been trying to convince people to listen to more Chumbawamba since at least the mid-aughts. I remember downloading Tubthumping from Limewire in my dorm room and then listening to the rest of the album and going. Oh. OH. Anyway the music in my head has been alternating between “The Day the Nazi Died” and “Enough is Enough” for most of the year. Both songs are full of good life advice.posted by athenasbanquet at 7:43 AM on March 4 [1 favorite] Don't forget the time Chumbawumba's drummer threw a bucket of iced water over Britain's deputy PM at an awards ceremony. It was a childish gesture by the band, but did give us this magnificent "Prescott Smash!!" photograph.posted by Paul Slade at 8:31 AM on March 4 I've always enjoyed Chumbawamba's soundtrack for the 2002 Revengers Tragedy, which moves the original 1606 play into a post-apocalyptic setting (a fitting soundtrack for today as well).posted by audi alteram partem at 8:57 AM on March 4 my Chumbawamba adventure started in 1986 or thereabouts when I was lucky enough to stumble upon the provocatively titled and intended Pictures of Starving Children Sell Records (basically a rip up and tear down of the LIVE-AID stuff). The lead off track How To Get Your Band On Television concludes with the following: I know there must be more Than giving just a little bit more When half of this world is so helplessly poor Starved of the real solution Charity and tradition And the cycle of hungry children Will keep on going 'round I know there must be more Will keep on going 'round I know there must be more Will keep on going 'round I know there must be more 'Till we burn the House of Commons to the ground zero punches pulled and definitely a significant piece of my ongoing socio-political education. I remember thinking, cool, this is basically CRASS with some pop sense. And then I guess I sorta forgot about them until Tubthumper showed up more than a decade later to my delight. Like running into an old friend for the first time in a long time and you pick up right where you left off.posted by philip-random at 9:20 AM on March 4 [1 favorite] Speaking of the band being thought of as one hit wonders (though I strongly disagree with Todd’s assessment of their fellow “anarchist punk” bands. And have to wonder what the band would think about his definition of “socialism”). Saw them back at the 90’s at Gilman, good times indeed. Also wonder if they know said song was adopted as the “theme song” by a Dick Tracy villian.posted by gtrwolf at 9:38 AM on March 4 He got knocked down. You'll never believe what happened next.posted by neuron at 9:56 AM on March 4 In response to Musk's recent demand for "5 accomplisments", I emailed hr@opm.com the following: 1. I drank a whisky drink. 2. I drank a vodka drink. 3. I drank a lager drink. 4. I drank a cider drink. 5. I sang a song that reminds me of the good times and a song that reminds me of the better times. Sadly, I received no reply.posted by SPrintF at 12:00 PM on March 4 [6 favorites] I started listening to them when I heard some of their other stuff on KALX and the long gone Devils Night Radio internet station. I loved the song Add Me. I had it as the page song on auto play on Myspace.posted by boilermonster at 12:22 PM on March 4 [1 favorite] Actually I meant to say “definition” of Anarchism”. (Remember folks, never comment before the coffee kicks in)posted by gtrwolf at 12:50 PM on March 4 Dunstan Bruce, one of the members of Chumbawamba, released a documentary about the band (mostly) in 2021 (called I get Knocked Down, naturally). It was introspective and excellent. Looks like it's streaming for free on Pluto and Tubiposted by Philbo at 3:51 PM on March 4 There is a wonderful last concert DVD available on youtubeposted by mbo at 5:45 PM on March 4 « Older The most beautiful invention of all time | Greater gliders' spectacular recovery after Blue... Newer » (adsbygoogle = window.adsbygoogle || []).push({}); You are not currently logged in. Log in or create a new account to post comments. Related Posts The last of the Three Marias February 4, 2025 Alive in the Hot Zone - music for the modern dark age March 10, 2021 Rot At The Bottom. Rot At The Top. November 12, 2019 it's anti-fascist, not anti-fashion December 7, 2017 500th For The Record March 16, 2005 (adsbygoogle = window.adsbygoogle || []).push({}); Tags music chumbawamba AntiFascist Share Facebook'''
