full_description = '''Recent Posts Recent Posts Popular Posts March 5 It’s a fitting moment to discuss enemy feminisms Just as the so-called “socialism of fools” comes from a truncated analysis of capitalism, resulting in national socialism (i.e., fascism), the feminism of fools, if you will, arises from bad materialism, a diagnosis of the sex/gender system that is fatally foreshortened. This leads it to form a wounded attachment to ontological womanhood. The feminism of cisness, for example, has spread like a pogrom. Today, it is unsurprising to find self-described feminists at the forefront of policymaking to deny gender-affirming health care, or to make bathrooms and sports lockers cissexual at all costs, in the name of women’s rights. from Feminist Fascisms A conversation with Sophie Lewis [The Baffler; ungated] posted by chavenet at 1:54 AM - 16 comments March 4 New Australian dinosaurs and the oldest megaraptorid fossils New Australian dinosaurs and the oldest megaraptorid fossils in the world. Australia’s first carcharodontosaur fossils unearthed along Victoria’s Cretaceous coast. posted by chariot pulled by cassowaries at 8:05 PM - 1 comment voting? The SAVE Act, if passed, would represent substantial barriers to voting for not only transgender adults but also for more than 140 million Americans who do not have a passport, as well as 21 million Americans who do not have access to their birth certificate or other documentation or the millions of Americans, including 69 million married women, who have changed their legal name [americanprogress] posted by HearHere at 6:00 PM - 27 comments The Gulf of Unreasoning Amidst a trade war with American's neighbors and partners, and a crashing economy, US President #47 will address a joint session of the US Congress starting at 9p.m. ET (watch live on YouTube) posted by Brandon Blatcher at 4:55 PM - 129 comments Timeline Cleanse NHK World presents A Cat's-Eye View of Japan, 42 5-minute episodes showing various places in