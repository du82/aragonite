title = "There’s no magic here | MetaFilter"
description = "What do you do with your unclosed browser tabs? I find that they take up a lot of screen space. So this week I figured out how to run pong inside mine."
full_description = '''There’s no magic here March 4, 2025 1:55 PM Subscribe What do you do with your unclosed browser tabs? I find that they take up a lot of screen space. So this week I figured out how to run pong inside mine. posted by chavenet (12 comments total) 4 users marked this as a favorite (adsbygoogle = window.adsbygoogle || []).push({}); AppleScript is a powerful and bizarre way to control programs on Mac; you almost write English, but it’s verbose and strict enough that mostly you end up writing Python with a lot of extra words. As someone who wrote a decent bit of AppleScript in the early aughts to automate some tasks in my undergrad math & CS computer labs, this is absolutely and hilariously true.posted by jedicus at 2:09 PM on March 4 [2 favorites] In b4: "Do You Think God Stays in Heaven Because He too Lives in Fear of What He's Created" "Your Scientists Were So Preoccupied With Whether Or Not They Could, They Didn’t Stop To Think If They Should" "7 Signs We Are in the End Times"posted by happyinmotion at 2:17 PM on March 4 [3 favorites] What do you do with your unclosed browser tabs? I find that they take up a lot of screen space. I mean...I dunno...close them?posted by Thorzdad at 2:21 PM on March 4 [5 favorites] Our engineering team has bi-weekly video calls with our product owner who shares his screen and there are, without fail every time, over 200 tabs open in his browser. Bets are placed and someone counts them silently during the meeting. It drives me nuts. I can't explain why.posted by mookoz at 2:27 PM on March 4 [2 favorites] Because you're weak and your meager stores of browser tabs will not see you through the coming winter.posted by stet at 3:01 PM on March 4 [5 favorites] Honestly folks you need to give vertical tabs a couple days and then you’ll never go back. Horizontal tabs are ridiculously stupid, even (especially) if you can use them to play pong.posted by simra at 3:19 PM on March 4 [1 favorite] God I love nerds.* (* I mean, nerds who are implementing pong in browser tabs and doom on a digital pregnancy test, not the ones who are trying to remake the world into a billionaire broligarchy hellscape.)posted by jacquilynne at 3:36 PM on March 4 [1 favorite] For Chrome tabs, there's pong. For Firefox tabs, there's Tab Stash. My excess tabs are not horizontal. They are not even vertical (though they could be). My excess open tabs are kept in a well-organized home page. Tab Stash is the way.posted by Mirth at 4:01 PM on March 4 [1 favorite] There’s no magic here There’s a little magic hereposted by They sucked his brains out! at 4:14 PM on March 4 [2 favorites] Our engineering team has bi-weekly video calls with our product owner who shares his screen and there are, without fail every time, over 200 tabs open in his browser. Apple tech eminence grise John Siracusa explains why he keeps 200 tabs open at a time.posted by Lemkin at 4:39 PM on March 4 [1 favorite] I have 316 tabs open in Firefox.posted by neuron at 4:47 PM on March 4 [2 favorites] 240 BROWSER TABS I should be able to do full HD. Hold my beer.posted by uncle harold at 10:49 PM on March 4 [2 favorites] « Older "Tell her I exploded, and tell her it was very... | "We still live in history —and at the mercy of... Newer » (adsbygoogle = window.adsbygoogle || []).push({}); You are not currently logged in. Log in or create a new account to post comments. Related Posts Gotta Catch Em All! December 16, 2010 You are not yet enlightened, Inky-san. February 23, 2008 Plasma Pong! June 28, 2007 Baer's Odyssey May 16, 2007 You won't like this August 26, 2005 (adsbygoogle = window.adsbygoogle || []).push({}); Tags Pong Snake Favicons Programming Share Facebook'''
