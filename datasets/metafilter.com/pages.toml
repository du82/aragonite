["https://metafilter.com/faq.mefi"]
title = "MetaFilter | Community Weblog"
full_description = '''Full MetaFilter FAQ > MetaFilter Questions MetaFilter FAQ You can always contact the moderators if you have a question. What is MetaFilter? What is the MetaFilter Community Foundation? How do I sign up for a MetaFilter account? Who is in charge here? Are there admins and moderators like other sites? Where are the Metafilter Community Guidelines and Content Policy? Can I give someone a gift MetaFilter account? How soon can I post after signing up? How soon can I post again after making a post? What makes a good front page post to MetaFilter? Why was my MetaFilter post deleted? Why was my MetaFilter comment deleted? How do I edit or delete my post? How do I edit or delete my comment? What are the rules about the edit function? Are posts or comments edited by mods? Someone made a official-seeming comment in small type, with square brackets. What does that mean? What is flagging? How can I flag a post/comment for the moderators to look at? What are self-links? Are self-links ever okay on any part of the site? What is double posting? Is there a statute of limitations on double posting? How can I check if something has been posted before, to avoid double posting? Can I post a fundraiser, or a petition for a worthy cause? Can I post a link to something behind a free registration? Can I post a link to just a short news bulletin if there's a breaking news story? How do I link to a specific comment? Should I use an URL shortener or link shortener, like I would on Twitter/ X? Should I include an NSFW warning if my link is not safe for work? What about spoilers? Should I include a trigger warning or content warning about upsetting content in my post? Should I add a [via] link if I found it from another site? If my post has more than one link, or the link isn't first, do I need to use the URL box? What is the etiquette concerning members' or non-members' personal details and profile information? Can I save a draft of a post or comment? What should I know about Covid-19 Coronavirus on Metafilter? How do I post a Mefi post or ask an AskMe question from my phone or tablet? How do I comment anonymously? How do I make a link? Can I use HTML in my posts? How do I create the [more inside] jump when posting? If a thread has been deleted, can I still find it someplace? If a comment has been deleted, can I still find it someplace? My post or comment got an error that begins "Your comment includes the word [x]" and I can't post it. What is My MeFi? What is My Ask? Can I choose to see only posts or questions with certain tags or in certain categories? My Mefi post or AskMe question was edited to remove my cute "more inside" play on words, wtf? My HTML seemed to work in the live preview but didn't come through correctly. Is this a bug or intentional? What does a single period in a comment by itself mean? What does a single asterisk in a comment by itself mean? What does 'threadsitting' mean? What does 'threadshitting' mean? Where can I find a list of common lingo and Mefi-specific abbreviations? What does "Pepsi Blue" mean? How does advertising on MetaFilter work? Who owns the copyright on MetaFilter content? What should I know about privacy at Metafilter? What is MetaFilter? MetaFilter (sometimes called MeFi) is a weblog anyone can contribute a link or comment to. A typical weblog is one person posting their thoughts on the unique things they find on the web. This website exists to break down the barriers between people, to extend a weblog beyond just one person, and to foster discussions among its members. MetaFilter is owned by the MetaFilter Community Foundation (MeFiCoFo), a board of volunteers from the community permalink What is the MetaFilter Community Foundation? The MetaFilter Community Foundation is a Delaware-based non-stock corporation that owns and governs the MetaFilter website via a community run model. The board is composed of members of the site who are volunteers. Originally, MetaFilter was under a single owner model. It transitioned to being a non-profit in December of 2024. You can read the history of this change looking at MetaTalk posts tagged with MeFiNonProfit. permalink How do I sign up for a MetaFilter account? Go to the New User page to read about accounts and follow the link to sign up and pay for the account. The current sign-up fee is US$5; it's a one-time fee and is the only cost associated with using the site. Once the PayPal payment is completed, your account will be active and you will be allowed to make comments on various MetaFilter threads. Please note that there is a waiting period to create a post to the front page of MetaFilter, however you can create an Ask MetaFilter post immediately. We enforce a strict rule against posting your own work or work you've contributed to or are posting about in a promotional capacity, except on MetaFilter Projects or MetaFilter Music. Posting a link to a site you're connected to, or posting for promotional purposes (except on Projects or Music), will result in a ban with no refund. If the signup fee is a financial or logistical hardship, you can drop the moderation team a line via the Contact Us form to ask about a complimentary signup. permalink Who is in charge here? Are there admins and moderators like other sites? Metafilter is run by a small staff of paid moderators ("mods"). The moderators are: taz, goodnewsfortheinsane, travelingthyme, Brandon Blatcher, and loup. There are two web developers: frimble and kirkaracha. The best way to reach a moderator is to use the Contact Us form, which emails all of the mods. The site is generally staffed around the clock, with regularly spaced gaps in coverage. The contact form will reach whoever is on duty. All the moderators are also regular site members, so you may see them around participating just like anyone else. When a moderator leaves an official moderation comment, the comment will appear in the thread but enclosed by a box, or [in small type, in square brackets], and a "staff" badge will appear in the byline next to their name. (This text is searchable, so you can find moderation comments by using your browser's "find" function to find the word "staff" on the page.) You can confirm someone is a moderator by looking at their profile page, too -- they'll have a "staff" badge under their profile picture. Some history: 1999: MetaFilter was created by Matt Haughey (mathowie); he was the sole admin of the site for the first several years. 2005: Jessamyn West (jessamyn) was hired; she was especially instrumental in establishing the culture of the new subsite, AskMetafilter. 2006, May: Paul Bausch (pb), our technical wizard, joined to keep the back end running smoothly and do bugfixes and feature builds. 2007, March: Josh Millard (cortex) started helping out around the place. 2008, May: vacapinta became the unofficial "Midnight Mod", checking in a few times during the North American night. 2011, April: Jeremy Preacher (restless_nomad) came on, originally to keep an eye on things over the weekend, although gradually shifting to weekday hours too. 2011, October: taz joined the team as the first regular non-US mod, bringing civilization to the formerly-lawless hours of North American night. 2012, October: goodnewsfortheinsane and LobsterMitten joined the team as part-timers, with a few regular shifts and some flexible coverage for other mods' hours. 2014, May: Layoffs. Due to a budget crunch, jessamyn retired, and gnfti and LM were laid off. Over the next months, site members contributed enough money to keep the site operating and even bring back the laid-off mods at sharply reduced hours. 2015, March: Mathowie retired, still the owner but handing nearly all site operations over to cortex and the remaining mods. Cortex took over most operational stuff, and LobsterMitten took over mathowie's on-site mod hours. 2016, January: Eyebrows McGee joined the staff as a part-timer and often weekend mod. 2016, May: pb retired. 2016, May: frimble joined the staff as resident tech person. 2017, July: mathowie transferred ownership of MetaFilter to cortex. 2020, Jan: restless_nomad retired 2020, June: new mods travelingthyme and loup joined the team. 2020, July: restless_nomad returned to help with administrative tasks for a limited time, jessamyn returned to a more active role 2021: restless_nomad stepped away again as planned; jessamyn reduced her role and schedule gaps were introduced 2022: cortex stepped down as owner, jessamyn took over as owner, loup took over operations, Lobster Mitten retired, Eyebrows McGee transitioned to a sub/fill-in mod 2023, February: Brandon Blatcher joined as another moderator 2023, April: Eyebrows McGee retired 2024, February: Kirkaracha joined the web development team 2024, December The site transitioned to Non-profit status permalink Where are the Metafilter Community Guidelines and Content Policy? Here's a link to the Metafilter Community Guidelines. These guidelines describe the kind of place we want Metafilter to be, and how we should aim to treat each other. The MetaFilter Content Policy discusses what sort of content on the site is unacceptable. We also have a page about Microaggressions, what they are and how to avoid them. permalink Can I give someone a gift MetaFilter account? Yes, just use this link and fill in your friend's email address. They will be able to choose their own handle once they register. The invitation will include your MetaFilter username and a link to your member profile so they know who gave them the gift. If you don't want them to know your MeFi username, you can log out before you do the transaction, and then the gift will be anonymous. permalink How soon can I post after signing up? You can comment immediately. To make a front page post to MetaFilter, you need to be a member for at least a week and you need to make a comment to the site. Even long-time members have waiting periods between posts. You can make an AskMetafilter post immediately. permalink How soon can I post again after making a post? After you have posted a thread (a post in MetaFilter, a question in AskMetafilter, etc), you have to wait this long before posting a second thread in that same area of the site. There is no similar limit for comments. MetaFilter - 12 hours AskMetafilter - no limit FanFare - no limit Projects - no limit Music - 24 hours Jobs - 24 hours between posting job Openings; you can only post one Availability total Podcast - only admins post the podcast IRL - no time limit, but you can have no more than 10 active IRL threads at a time MetaTalk - one week Note that these waiting periods are per-person, not per-account, so if you have two accounts you still can only post at these intervals. Using two accounts to get around the posting limits is against the rules and may result in your post being deleted and your second account closed. permalink What makes a good front page post to MetaFilter? A good post to MetaFilter is something that meets some of the following criteria: most people haven't seen it before, there is something interesting about the content on the page, and it might warrant discussion from others. Posts don't have to be long, and they don't have to contain multiple links or end with a discussion-sparking question. If you browse through the 'sidebar tag' from the front page or the 'bestpost' tag on MetaTalk, you'll find a number of examples of Metafilter posts that have been flagged as 'fantastic' by the community. permalink Why was my MetaFilter post deleted? When a thread is deleted, it is closed to new comments and is removed from the front page but can still be viewed at the permanent URL for the thread. There is a brief "reason for deletion" given when a MetaFilter thread is removed. The most common reasons are: - double-post - the exact link or one linking to nearly the same content has already been posted - self-link or promotional linking - you posted something to MetaFilter that is on your own site or that you contributed heavily towards, or that you're involved (professionally or otherwise) in promoting, or your post concerns a situation that you're personally involved with. - newsfilter - you posted a link to a news article without creating a post that would lead to good discussion - axegrinding - you posted on a hot-button topic that you frequently post about and/or used heavy-handed editorializing language. - broken link - you posted a link to something that is no longer available on the web - stunt post - you were doing something cutesy or pointed with your post that was making some sort of statement, not linking to something neat on the web - fundraising/promotion - you linked to a "sign this petition" or fundraising link [Kickstarter, indiegogo] Please note: post deletions are a judgement of the post, not the poster. MetaFilter is a moderated site and not all posts pass muster, but deletion is meant as a curatorial decision, not a punishment; most folks who post a fair amount will have something deleted occasionally. Unless you're actually spamming, a deletion doesn't mean you're in trouble. permalink Why was my MetaFilter comment deleted? MetaFilter is a moderated site. There are some types of comments that are either toxic to discussion or disallowed on the site entirely that may get removed by moderators. Some reasons comments may be removed are described here, and in more detail in the Metafilter Community Guidelines and its supplementary page about Microaggressions and making space for everyone. - Racist or otherwise hateful comments. This includes misgendering and slurs. It also includes ironic racism/sexism/homophobia/transphobia; people who sarcastically put on a racist voice to make a point about racism, or who make hateful comments ironically (assuming everyone should know they're joking) cause derails and make discussion difficult. - Spamming. Adding off-topic, context-free, or SEO-laden comments with undisclosed links to your own or others' sites. - Threats against oneself or others. If you're feeling suicidal or self-harming, please reach out to someone to talk one on one; Mefites have compiled a list of hotlines. Violent fantasies or "someone should assassinate that guy" type comments create problems for the site. - Making a thread all about another user; attacks on or interrogation of other users, "fuck you"s or namecalling. This includes doxxing or outing of personal information from profile pages or other sites or comment trawling a user's comments or bringing them into a thread they are not otherwise involved in. - Making a thread all about you. MetaFilter is a large community and discussion threads are for everyone. Please don't make a thread all about your own opinions and ideas at the expense of other people trying to have a discussion. - Trolling (saying something you don't mean just to rile people up or start a fight) is not okay here. If your behavior is indistinguishable from trolling, your comment may be treated accordingly. - Dismis'''
