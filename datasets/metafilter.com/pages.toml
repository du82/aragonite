["https://metafilter.com/207883/A-world-in-which-corporations-controlled-all-media-set-in-2018"]
title = "A world in which corporations controlled all media--set in 2018. | MetaFilter"
description = "The owners eventually decide that [he was] getting bigger than the game, and that his popularity as a player is a threat to their control. No, this isn't about the controversial Luka Doncic..."
full_description = '''A world in which corporations controlled all media--set in 2018. March 3, 2025 11:30 AM Subscribe The owners eventually decide that [he was] getting bigger than the game, and that his popularity as a player is a threat to their control. No, this isn't about the controversial Luka Doncic trade--it's a look at Norman Jewison's underrated movie Rollerball, which my father took me to see at the Sunnyvale drive-in theater when I was nine years old. posted by mecran01 (26 comments total) 14 users marked this as a favorite (adsbygoogle = window.adsbygoogle || []).push({}); I literally just considered watching the starting fight scene from Rollerball while flicking through Amazon Prime. I went with Dredd (2012) instead. I also first saw Rollerball at an impressionable age after being allowed access to my uncle's VCR one evening. We then re-watched the three rollerball matches in the morning. in other news, I am now totally inured to violence in film.posted by biffa at 11:52 AM on March 3 [7 favorites] Made Bach hardcore. And love, love, love those 70 sci-fi fonts.posted by Lemkin at 11:57 AM on March 3 [4 favorites] Loved Rollerball when I was like, 12. Game looked cool if you could overlook the fatalities. Missed all the corporate stuff going on, but liked Johnathan E. basically giving the finger to the bosses. Certainly seems prescient these days.posted by Windopaene at 12:01 PM on March 3 [1 favorite] I'd much rather watch a modified version of rollerball than any of the MMA/UFC stuff that's out there.posted by AJaffe at 12:31 PM on March 3 [2 favorites] in my opinion this sums it upposted by robbyrobs at 12:36 PM on March 3 Especially relevant Carlin sectionposted by mecran01 at 12:46 PM on March 3 When they announced the remake, I thought “Fuck yeah”. It was still a great premise and McTiernan had two action masterpieces to his credit. Of course, it turned out to be “Fuck no”.posted by Lemkin at 12:57 PM on March 3 I absolutely loved this movie growing up, from the opening Bach to the final freeze frame. Watching it as an adult tho, the way his actions get his best friend put in a coma and the rest of his team and the opposing team injured all to hell in the final match, while cool looking, really came across as selfish in a way that I both couldn't appreciate as a child and left a bad taste as an adult for this character who is supposed to be viewed heroically.posted by kokaku at 1:09 PM on March 3 [2 favorites] Fanfare linkposted by one for the books at 1:14 PM on March 3 [2 favorites] From the Grauniad article linked in the FF thread: Caan insisted on doing all his own stunts. "Oh man, it was great," he says. "I separated a shoulder a bit and damaged a rib but I was pretty much luckier than most." Things were spiralling into mayhem: "Naturally, I don't want to die," said stuntman Roy Scammell, "but take that out of it and it's a terrific game. I'm sure it could catch on." When the shooting ended, they arranged a full, no holds barred match and separated into two teams. "It never lasted more than 25 or 30 seconds," says Caan. "It was just one fight after another." A few years before this movie, Caan starred in one of the most sentimental sports movies ever, Brian's Song.posted by Halloween Jack at 1:32 PM on March 3 [6 favorites] As with so many of the classic movies of the 1970s, I know this one only by way of its Mad Magazine parody, Rollerbrawl. Which is very very good.posted by chavenet at 1:57 PM on March 3 [9 favorites] I saw this when I was 15 or so, and even then I could pick up on the satire. Now, as Rollerball and the NFL seem to creep closer and closer in terms of marketing and violence, it seems less satirical and more simply prescient.posted by martin q blank at 2:24 PM on March 3 [1 favorite] JOHNATHAN! JOHNATHAN! JOHNATHAN!posted by TedW at 2:35 PM on March 3 [4 favorites] full text of the original short story the film is based onposted by infinitewindow at 2:35 PM on March 3 [9 favorites] I bet those guys on jet-skis professional surfers use to get into position on really big waves were inspired by the guys on motorcycles inside the Rollerdrome, which the players used to accelerate.posted by Rash at 2:39 PM on March 3 I consider recent history—which is virtually all anyone remembers—and how the corporate wars ended, so that we settled into the Six Majors: ENERGY, TRANSPORT, FOOD, HOUSING, SERVICES, and LUXURY. Sometimes I forget who runs what—for instance, now that the universities are operated by the Majors (and provide the farm system for Roller Ball Murder), which Major runs them? SERVICES or LUXURY? Music is one of our biggest industries, but I can't remember who administers it. Narcotic research is now under FOOD, I know, though it used to be under LUXURY.posted by infinitewindow at 2:39 PM on March 3 [1 favorite] It's disquieting that some of the dystopias of the seventies feel like a better place to live than what's coming... A couple years ago, there was Rollerdrome, a video game strongly inspired by Rollerball. A bit like Tony Hawk, but with heavy ordnance: Rollerdrome Trailerposted by LaVidaEsUnCarnaval at 2:39 PM on March 3 [3 favorites] Actually, it's JONATHAN! JONATHAN! JONATHAN!posted by biffa at 2:44 PM on March 3 [2 favorites] Pony request: 15 minute edit window?posted by TedW at 2:49 PM on March 3 [1 favorite] When this movie was released on June 25, 1975 — less than two months after the fall of Saigon on April 30 — there was an athlete who was bigger than the game. Any game. Muhammad Ali. And sports owners have been absolutely determined ever since never to let it happen again.posted by jamjam at 3:17 PM on March 3 [6 favorites] I started fourth grade in the Fall of 1975 and the talk of the playground was Rollerball. It was second- or third-hand discussions, given our ages, but I was able to use my imagination. Motorcycles! Roller-skating in football pads/helmet! Metal ball from a cannon! Didn't see it until the 1980's but it stayed in my mind. Glad I was able to find it, as it was incredible! More than I hoped for. Not sure I would have understood the film when I was younger, but the onscreen message was clear to older me: the games exist to distract/mollify the public and no one person is bigger than the game. I was surprised to read that the director felt the movie was showing the "sickness and insanity of contact sports and their allure." Nearly 50(!) years later, American professional and college football are amazingly popular spectator sports in the US (despite knowing how damaging they are), with boxing and MMA also quite popular. I guess I really should have learned that my world was going to be governed by corporations.posted by bacalao_y_betun at 4:48 PM on March 3 [4 favorites] It was still a great premise and McTiernan had two action masterpieces to his credit. So... the director of the remake did a year of hard time in the slammer because he listened to his producer's phone calls? He must have had enemies in high places (like Martha Stewart).posted by ovvl at 8:56 PM on March 3 See also: 2000AD's take - Harlem Heroes And of course, the Bitmap Brothers' Speedball and Speedball 2: Brutal Deluxe (which IMO has never been bettered)posted by Molesome at 2:01 AM on March 4 [2 favorites] "When they announced the remake" - I'm often reminded of Michael Caine's good question, wondering why Hollywood doesn't remake *bad* movies? You know, to make 'em better.posted by doctornemo at 6:56 AM on March 4 I remember when this came out (I was eight). It simply made sense: -US sports culture had a deep strain of love of violence -society was heading towards corporate rule -inequality was risingposted by doctornemo at 6:58 AM on March 4 [1 favorite] Yet another movie from the 1970's where the benefits from your corporate owners (if you were a guy) included having a woman assigned to you. (ETA: just checked the fanfare link and it looks like I made the same point there a few years ago. Not that it's a peeve of mine or anything...)posted by rmd1023 at 7:39 AM on March 4 [1 favorite] « Older How do you make a decision? (Weekly Free Thread) | ¡Siempre volverá sano e contente! Newer » (adsbygoogle = window.adsbygoogle || []).push({}); You are not currently logged in. Log in or create a new account to post comments. Related Posts The chickenization of everything September 16, 2020 Your Data, Your Money, Your Laws July 11, 2019 Technological Tristesse January 17, 2019 These astroturf libertarians are the real threat... December 20, 2010 ...GE had long done business with the bin Ladens.... December 31, 2007 (adsbygoogle = window.adsbygoogle || []).push({}); Tags movies japan media corporations Share Facebook'''
