title = '''John Frankenheimer's "French Connection II" | MetaFilter'''
description = "'Hackman was fantastic here, never stopping with the full-blown intensity, consistently providing Doyle with a vital integrity that always made you care, no matter how harsh the character spoke..."
full_description = '''John Frankenheimer's "French Connection II" February 28, 2025 7:39 PM Subscribe "Hackman was fantastic here, never stopping with the full-blown intensity, consistently providing Doyle with a vital integrity that always made you care, no matter how harsh the character spoke or behaved. And it goes without saying that Frankenheimer, ever the reliable craftsman, shot the hell out of the film with his director of photography Claude Renoir, giving it that rough and tumble 70’s aesthetic that we all love so much in present day. Many, many people have seen The French Connection. Not enough people have seen French Connection II. I’d like that to change."- Nick ClementThe-Back-Row.com: While it still delivers a lot of the same thrills and excitement as its predecessor, French Connection II is not a lazy retread and does not hesitate to venture into some very dark and unexpected places. Some viewers may consider the film’s changes in tone to be jarring and find the second act too unpleasant to watch, but you’ve at least got to give French Connection II a lot of credit for being brave enough to try something different. Terrific score by the returning Don Ellis, who went way before his time. posted by Lemkin (7 comments total) 7 users marked this as a favorite (adsbygoogle = window.adsbygoogle || []).push({}); Unforgettable ending.posted by Lemkin at 7:40 PM on February 28 [1 favorite] first time I watch that I think I smoked a whole pack of cigarettes. amazing performance. one of the true great marks of an actor is be able to convincingly dish out pain and to convey pain in turn. Hackman could do both which was quite rare.posted by clavdivs at 7:59 PM on February 28 [1 favorite] apologies for focusing on a different movie ... Gene Hackman is badass apparently his dad was a racist bully. This one came from the heart.posted by philip-random at 10:51 PM on February 28 [4 favorites] I loved French Connection, but cannot say I have ever seen FCII. Guess I need to find a way to see it.posted by Thorzdad at 4:00 AM on March 1 [1 favorite] Watched tonight, I don't know if it's as good as the original, but still, Hackman! And it spends a *bunch* of time with him kicking, exquisite.posted by hap_hazard at 8:53 PM on March 1 This movie traumatised me as a kid, yeah the heroin scenes.posted by inpHilltr8r at 6:32 PM on March 2 "Yeah the heroin scenes.". But, I just watched French Connection II on YoutubeTV and it had one 0f the best last minute endings I've ever seen in a film.posted by Xurando at 8:03 PM on March 2 « Older What's in the box? | LEAD PIPE GO Newer » (adsbygoogle = window.adsbygoogle || []).push({}); You are not currently logged in. Log in or create a new account to post comments. Related Posts Zozobra, making Santa Fe's fiesta celebrations... August 19, 2015 Arthur Penn's "Night Moves" October 1, 2011 Here comes a Lion... oh yes, it's a Lion... October 1, 2011 Director John Frankenheimer is dead. July 6, 2002 Besides being great directors, what do Wong Kar... May 16, 2001 (adsbygoogle = window.adsbygoogle || []).push({}); Tags art movie film sequel genehackman johnfrankenheimer Share Facebook'''
