description = "In the 1970s, the Mar Chiquita lagoon (english), which lies in the province of Córdoba, in central Argentina, swallowed neighboring Miramar. The waters destroyed 102 hotels, 198 homes, 65..."
full_description = '''¡Siempre volverá sano e contente! March 3, 2025 1:53 PM Subscribe In the 1970s, the Mar Chiquita lagoon (english), which lies in the province of Córdoba, in central Argentina, swallowed neighboring Miramar. The waters destroyed 102 hotels, 198 homes, 65 businesses, the thermal complex, the casino, and the amphitheater, leaving Miramar on the brink of collapse. The economy was obliterated, and many families chose to leave the city, drastically reducing its population. Those who stayed rebuilt their lives in other parts of Miramar, away from the lagoon ... It wasn't until 2003 that the waters of Laguna Mar Chiquita began to recede, amid the worst drought in decades. The scene was desolate: abandoned structures covered in salt and petrified tree trunks standing crookedly as silent witnesses to what was lost. from The Return of a Lost City [The Dial] posted by chavenet (10 comments total) 13 users marked this as a favorite (adsbygoogle = window.adsbygoogle || []).push({}); Mod note: Added link to the Mar Chiquita lagoon wikipedia page in english posted by loup (staff) at 2:45 PM on March 3 Sorry to be pedantic at the outset, but the title should be: "Siempre volverás sano y contento".posted by Omon Ra at 4:07 PM on March 3 [1 favorite] If we're being pedantic, the illustration that the title comes from says "¡Siempre volverá sano y contento!" without the s which I guess is uno/a rather than vos. But things did get a little Portuguese there at the end of the phrase.posted by ssg at 5:07 PM on March 3 [2 favorites] And why not go all the way into pedantry? A laguna in Spanish is only sometimes a lagoon in English and in fact there is a Mar Chiquita lagoon in Argentina (near Buenos Aires) but it's not this one, which would just be called Mar Chiquita Lake. A laguna in Spanish can be an English lagoon, but it also can be a lake or pond that is shallow and has no outlet.posted by ssg at 5:25 PM on March 3 [2 favorites] You're right. I translated directly from the English text and didn't notice the text in the image.posted by Omon Ra at 5:26 PM on March 3 [1 favorite] I sonder, but I never did plan to go anyway...posted by rubatan at 11:29 PM on March 3 [1 favorite] I have asked the mods to correct the headline to match the lovely image of the hotel in the piece, and not in Portinhol as noted.posted by chavenet at 1:49 AM on March 4 Since it's that kind of thread, here's the first link in Spanish instead of Portuguese.posted by signal at 3:48 AM on March 4 [1 favorite] "¡Siempre volverá sano y contento!" without the s which I guess is uno/a rather than vos. It's actually usted instead of tú or vos. posted by signal at 3:51 AM on March 4 [2 favorites] donde esta los bibliothecaposted by AzraelBrown at 5:35 AM on March 4 [1 favorite] « Older A world in which corporations controlled all... | "I am quite absurdly in love with him." Newer » (adsbygoogle = window.adsbygoogle || []).push({}); You are not currently logged in. Log in or create a new account to post comments. Related Posts Drowning World July 11, 2013 "You hold your breath, it's absolutely perfect." September 23, 2011 The village that re-emerged July 26, 2011 The salvage of flight 1549. February 9, 2009 Firestorm 2003 October 26, 2003 (adsbygoogle = window.adsbygoogle || []).push({}); Tags Argentina Miramar Flooding Receding Salvage Photography Ansenuza MarChiquita Share Facebook'''
