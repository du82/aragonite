full_description = "h3 { margin-top: 2em; margin-left: 20px; } h4 { margin-top: 1em; margin-left: 20px; font-size: 11pt; } .subsite-metafilter h3, .subsite-metafilter h4 { margin-left: 0; } li { margin-top: 0.5em; } .dont li strong, .do li strong { font-weight: bold; display: block; } .subsite-metafilter .do li strong, .subsite-metafilter .dont li strong { font-size: 110%; } MeFi Global BIPOC Board The MeFi Global BIPOC Board is a working group of MeFites of Color from around the globe who meet with each other and MetaFilter moderators on a monthly basis. The purpose of this group is to provide a space for members of color to provide input on moderation policies, site feature improvements and collaborate with staff on future priorities for the site in relation to issues of race and ethnicity. Site moderators will be present at meetings to receive feedback and answer questions as needed and meetings are facilitated by travelingthyme and loup. A rotating roster will be made available so other MeFites of Color have the opportunity to join the board. This is voluntary and you will receive an honorarium for your time. Feel free to email travelingthyme with any questions! Wondering how to join? Complete this Google Form to express your interest and share your info. Board Budget Thank you to all who have contributed to the board budget! Through one-time contributions and recurring monthly contributions, MeFites have contributed nearly $700 to the budget. The honorarium rate is currently set at $50 per meeting. In order to sustain this rate and possibly increase the honoraria in the future, contributions are welcome and encouraged. For those interested in supporting the board, please make your contribution through the funding page and email travelingthyme to earmark your contribution. The meeting minutes will be posted below. All minutes have been approved by the board prior to publishing. Meeting Updates The first Global BIPOC Advisory Board meeting was held on Sunday, September 19th via Slack. Meeting Minutes #1 (pdf) (September 2020) Meeting Minutes #2 (pdf) (October 2020) Meeting Minutes #3 (pdf) (April 2021) Meeting Minutes #4 (pdf) (March 2022) Meeting Minutes #5 (pdf) (May 2022) Meeting Minutes #6 (pdf) (June 2022) Meeting Minutes #7 (pdf) (July 2022) Meeting Minutes #8 (pdf) (August 2022) Meeting Minutes #9 (pdf) (September 2022) Meeting Minutes #10 (pdf) (October 2022) Meeting Minutes #11 (pdf) (November 2022) Meeting Minutes #12 (pdf) (January 2023) Meeting Minutes #13 (pdf) (February 2023) Meeting Minutes #14 (pdf) (March 2023) Meeting Minutes #15 (pdf) (April 2023) Meeting Minutes #16 (pdf) (May 2023) Meeting Minutes #17 (pdf) (June 2023) Meeting Minutes #18 (pdf) (July 2023) Meeting Minutes #19 (pdf) (August 2023) Meeting Minutes #20 (pdf) (September 2023) Meeting Minutes #21 (pdf) (October 2023) Meeting Minutes #22 (pdf) (January 2024) Meeting Minutes #23 (February 2024): Minutes to come Meeting Minutes #24 (March 2024): Minutes to come Meeting Minutes #25 (April 2024): Minutes to come Meeting Minutes #26 (October 2024): Minutes to come Meeting Minutes #27 (November 2024): Minutes to come"
