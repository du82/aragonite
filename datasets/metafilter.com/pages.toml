full_description = '''.copy li {margin-bottom:8px;} .discount {background-color:#eee;} .discount {background-color:#023C63;} MeFi Mall Here's a list of MeFites who have stuff they make and sell online. If you're shopping anyway, check out the stuff your fellow MeFites have available. If you're a MetaFilter member with stuff for sale, you can submit your shop. There's more info in MetaTalk. Photography, Prints and Calendars mikepop: Posters, stickers, notebooks, socks (soon!) and other such things. I've taken a lot of my drawings and uploaded them (to Redbubble) so you can buy them on stuff. I'll be updating the shop soon with more and seasonal items. (If you want a drawing that's not in the shop, let me know and I'll add it) moonmilk: Farm to Scanner: I have no idea how I got these veggies wedged into my scanner, or why. Beautiful images of fresh produce from the New York City Greenmarkets, made on a desktop scanner! Featured on metafilter 11 years ago and everyone hated it then, but I finally got around to making a shop and honestly it's really good: society6.com/farmtoscanner. Mostly art prints, but you can also get a few things like pillows and phone cases. If there are any images or society6 products you want but don't see in the store, let me know. ancillary: It's often the case that the .h264-encoded video vignettes of one's life, those moving memories recorded and tucked away on mobile phones everywhere, wonder wistfully what fate awaits them. Thankfully, FlipClips exist specifically to alleviate the melancholy felt by these forgotten digital video files, thrust aside by their jpeg brethren who are gleefully t-shirted, postage-stamped, and photo-mugged/booked/pooped. In a beautifully hand-crafted, perfect-bound paper flipbook, these personal video files can live forever, batteries not required. 15% off with coupon code mefi15. millipede: http://www.ArtPal.com/artbylpd Prints and originals of my artwork gac: Unique fine-art prints, crafts, and zines from Philadelphia artists (including metafilter's own gac) at regarding.com bixfrankonis: Lemur. Cool. Now you can have your own art print of this exceedingly chill, so very relaxed, and, yes, quite real ring-tailed lemur from the Portland of Oregon. This is the one photograph I’ve shot in a decade and a half of an on-and-off, intermittent photography hobby that seemed practically to be begging for making prints available. seanmpuckett: Robot drawings! That is, drawings made by a robot -- also known as a plotter -- that I designed and built. The instructions for the robot are created by software I also designed and built. Many of the drawings are based on photographs, many of which I took myself. These are not reproductions, you get actual robot drawings! seemoorglass: I make joyful, colorful watercolor + ink originals, prints, stationery and more! Recorded Music ignignokt: I have a really long ambient concept album called The Sound of the Far Future. It starts with a lot of narration about events in our relatievly near future (10,000 to 1,000,000 years from now). Over time, the events become sparser and sparser, and the music gets gradually wilder and more entropic. Put it on while you shop or wrap presents or drink warm drinks with your loved ones in the warm, but temporary pocket of the present. Anyone who can't afford it for whatever reason and wants to download it can message me for a free copy, no questions asked. chococat: Several albums worth of recent and not-so-recent recordings. It's delicious, homemade, independent basement pop just waiting for you at fromabasement.com. Send as a gift or enjoy for yourself! Don't forget to enter the discount code "mefi" on the Bandcamp site to get 10% off anything! (Also on iTunes, Amazon and most other places you can think of.) Corduroy: Vinyls available for my (not posthumously titled) album "The Songs of Seth Thomas." You can get a **SPECIAL EDITION** record with art drawn on the cover for a bit more, the profits of which will be donated to Rainier Valley Midwives in Seattle, WA. Foosnark: Lots of spooky drone/dark ambient synth music at starthief.bandcamp.com. All of it is pay-what-you-want, including a new album, "White Bear", due to release the week of December 13. Services brainwane: Hi, I'm Sumana Harihareswara and I run Changeset Consulting, providing short-term project management and related services for free/open source software projects. Give a gift to a friend who runs a hobby software project -- buy a few hours of my time and I'll rewrite documentation, clean out the bug tracker, respond to pull requests, or otherwise lighten their load. Say you're a MeFite and I'll knock the price down. (Free initial consultations available to anyone.) ananci: I'm an experienced freelance business consultant who can help you with new business set up, marketing and sales, growth strategies, financial analysis, contract review, and / or research. I have some openings for new clients! I've worked with Mefites before, and really enjoy serving this community. iamkimiam: If you could overthink a plate of beans, then you know how much you'd benefit from giving yourself the gift of time and headspace. I'm a Transformational Coach who helps creative, purpose-driven professionals turn overthinking into expert thinking. I offer coaching and consulting packages to support you with any aspect of getting thoughts out of your head and getting your ideas heard. Mention you're a MeFite (or that you know one!) and you'll get the beanplate special discount. Learn more about what coaching is, then book here for a free 60-minute discovery call with me. Etsy, Crafts and Jewelry jenjenc: I make hand-cut ornaments out of beautiful hardwood on my scroll saw. I have lots of options for both people and pets! You pick the shape, the wood, the name/year, and on many of them, the color of rhinestone crystal embellishment. New this year, you can order directly from my website, Moonchildwoodcraft.com. Click on the red banner to shop, and enter the code "Metafilter" at checkout to save $5 on your order over $15. Crystalinne: Print With Love is closing at the end of 2019. So grab some awesome gifts and goodies before they’re gone! Limited edition shirts are 60% off in unisex XS - 3X. All prints are 25% off Hand painted coffin boxes, coffin trays, and ring boxes are 50% off. FREE US domestic shipping on all orders. Plus you can add gift wrap and upgraded shipping options at checkout! Shipping to UK, CA, and AUS available. Other world wide shipping upon request. PrintWithLove.com Sweetie Darling: Rock Springs Paper Craft: Intricate and swirly hand-marbled paper transformed into one-of-a-kind gift items, including note cards, coasters, and hand-stitched books. Great for stocking stuffers, hostess gifts, holiday swaps, and hard-to-buy-for folks. 10% discount for MeFites; enter SWEETIE at checkout. Sales tax collected on orders shipping within North Carolina. nonasuch: Handmade assemblage jewelry, incorporating vintage & antique components, found objects, and gemstone beads. nonasuch.etsy.com You can use the code INTERNETFRIENDS for a 10% discount. Thanks! cherryflute: I make knitted ornaments for flutes in many sizes (piccolo down to contrabass flute) Get #flutehats, #catonflute, #penguinonflute and/or #flutehearts- a handmade gift by me! Great gifts for flute ensembles of all sizes! [note: #flutehats and #flutehearts come in all flute sizes piccolo down to contrabass] #flutehats #catonflute #flutehearts #penguinonflute Also, if you order multiple styles, I will combine your shipping, refund you the extra shipping cost, and send the whole order together! Order 10 and get one free! obloquy: The Supernatural History Series brings the spooky past to life in vintage style! Each of these handmade paper good collections includes a new edition of a classic book, facsimile historical artifacts, and other assorted items. Choose from the Pharaoh's Curse Pack, the Zombie Horror Pack, the Ghosts of Christmas Pack and more. New illuminated manuscript greeting card sets available, too! Visit The Other Fox Shop (Etsy) and enter code MEFI13 for 13% off. d13t_p3ps1: Brain Basket Designs I make wire wrap jewelry with a wide variety of crystals and minerals, with a focus on pendants and necklaces. Use the coupon code METAFILTER to get 10% off your purchase! robocop is bleeding: The Corey Press - Hand carved madness from Salem, MA. Medieval UFO abductions, occult conspiracies, and Lovecraftian nightmares all inked and pressed to wood. Etsy | Threadless | Website magnetsphere: Everyone wants a nerdy, anatomical, cross stitch kit. Everyone! bluebamboo.etsy.com craven_morhead: I make custom light fixtures, desk items, and other handmade household items at Fox Meadow Woodworking. My work focuses on live-edge and reclaimed lumber, and I've recently finished a larger run of gift-sized products. I also do custom work, just ask! stilgar: I make jewelry, and all sorts of bicycle themed stuff. From earrings to flasks, to head badges for bicycles and wide array of stickers and vinyl decals. Future Crash I also have a shop for more...adult themed.. items. Raven's Head Toys boilermonster: If you feel a need to look like an extra from a Post Apocalyptic movie, this is the place. All the armor is made from old traffic signs or scrap metal. sucre: I’m a printmaker under the name Rare Press. I make printed goods and art prints by hand in my apartment! I carve rubber and linoleum, and sometimes draw or paint, too. Here’s my Instagram as well! norabelle: I sell posters and an increasingly infamous tea-towel featuring an infographic that contains every single Eurovision result in the history of the contest that Metafilter is so curious about. New for Christmas 2019 - there's also an infographic tea-towel summarising the league positions of the teams in the highest division of English men's association football since 1992. We call it the Top Flight Tea Towel. 15% off anything in the shop with FUEGO. Totally Flagulous watch out for turtles: Bright and colorful yarn made love in the form of women’s scarves, baby blankets, cup cozies, girls’ hairbows, and wall hangings. At my Etsy shop: https://www.etsy.com/shop/RandomOliveStitches MexicanYenta: My shop, Carizozo, is where I sell the bath and body products I started making because I live in New Mexico and I could never find anything that moisturized as well as I wanted. Body butter, solid lotion bars, organic liquid soap, and Bunny Balm. Most items are vegan, but a few use beeswax (I'm working on finding a substitute that works as well). yoga: Mile Wide Studio Modern Flair: Soft enamel pins inspired by mid century modern design. Pins are a variety of colors, metal, roughly 1"x1" and have 1 or 2 black rubber clasps. Designed by yours truly. Free shipping! augustimagination: GalaxyPeachPlaygear, quirky, nerdy, soft wristcuffs and other bondage gear (all pictures/shop content SFW), all designed and sewn by me. Happy to talk customs. Free pronoun pin if you mention your pronouns along with an order! brilliantine: I make bits and bobs out of polymer clay - primarily earrings but I'm also happy to discuss small commissions. I'm not doing shipping outside the US as a standard thing through the shop but I'm happy to work with mefites if you see something you love! gildedseason.etsy.com and @gildedseason on IG and TikTok if you want to see things that may not have been posted in the shop yet. coevals: Little Wolf Press is an Etsy shop, with digital prints, greeting cards, and original paintings. Thank you for checking it out. hilatron: Long-time lurker, infrequent poster popping up. My shop is Crafty Robot. I make irreverent, pop-culture-inspired altars in honor of beloved characters from TV and film. I'm currently stocking altars in honor of Endora from Bewitched, Morticia Addams, and Norma Desmond from Sunset Boulevard. I also have cards and hand-embroidered pendant necklaces in stock. The whole shop is 20% off through December 7, with free shipping on orders over $35. Thanks for looking! specialagentwebb: Magpie Charm. I cast handmade polyhedral dice for TTRPGs. Singles, sets, and some other shiny widgets too! rikschell: Purl's Yarn Emporium is the shop my wife and I have run since 2010. We have lots of commercial retail yarn, and yarn and kits we hand-dye and design, as well as project bags we make. There are tools and other cool stuff. If you're ambitious, you can even knit your own Earth. Enter coupon code MeFite10 at checkout for 10% off everything. haplesschild: Neverpress: The Cemetery Oracle Deck and postcards and minibooks. cortex: I've got a bunch of hand-pulled linocut prints up on my Etsy! Crows, geometry, screams into the void, we've got everything. Use the MEFIMALL code for 10% off. Vervain: At the moment, my shop (Iconologia Designs) has shirts, mugs, and other accessories with pro-vax designs. Various art prints coming soon! SunPower: Sunpower:handmade papercut 3D greeting cards.All the designs are drawn in the iPad , some are printed and hand cut with Xacto knife and other in the cricut machine. Everyone of them are individually made and assembled using foam strips to give a 3D effect and comes with the same color envelopes.If you like the design or looking for personalized designs or like different color, I can make it for you. Just let me know. Krazor: https://www.etsy.com/listing/1682028615/inaccurate-tarot-readings-dogst I'm offering tarot readings of dubious quality. Books, Magazines and Zines xingcat: Suburban Holidays, a collection of holiday plays. Holidays at home. Sometimes that's the country, sometimes the big city, but more often than not, it's the suburbs. These seven short plays, written by Patrick Cleary, cover the spectrum from heartfelt to exciting to just plain funny. Christmas, New Year's Eve, Valentine's Day, and Halloween are featured in this collection of shorts. Link to book on Amazon. veggieboy: How to Sous Vide, the new cookbook by the author of “How to Instant Pot” and “Will It Waffle?” Discover how the professional technique fits in the home kitchen and yields easy, delicious results. mishafletch: I wrote a cookbook called Cooking is Terrible, which you can purchase at many ebook stores, as a bundle with epub, mobi, and PDF, or in paperback. It's aimed at anyone for whom cooking is not constant, unrelenting joy, and especially at people with limited time and energy. ManInSuit: ManInSuit: Sheila Heti (author, of, among others, How Should A Person Be and Motherhood) had the idea to collaborate with me on a book of everything I know. That book is The Chairs Are Where The People Go. It is about improvisation, municipal politics, how to teach a charades class, running conferences, feeling like a fraud, love, quitting smoking, and other things. [Amazon USA // Canada // UK] The New Yorker said: "A triumph of what might be called conversational philosophy... The world is better for these humane and hilarious essays." churl: Metafilter was i'''
