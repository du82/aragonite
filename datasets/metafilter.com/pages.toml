["https://metafilter.com/207874/Kate-can-walk-but-often-uses-a-wheelchair-to-get-around-Heres-why"]
title = "Kate can walk but often uses a wheelchair to get around. Here's why | MetaFilter"
description = "One in three wheelchair users are ambulatory (eg can walk a few steps). This article explains why people who can stand up for a brief moment still need a wheelchair due to severe pain; balance..."
full_description = '''Kate can walk but often uses a wheelchair to get around. Here's why March 3, 2025 12:02 AM Subscribe One in three wheelchair users are ambulatory (eg can walk a few steps). This article explains why people who can stand up for a brief moment still need a wheelchair due to severe pain; balance issues; falls; or severe exhaustion. posted by chariot pulled by cassowaries (24 comments total) 29 users marked this as a favorite (adsbygoogle = window.adsbygoogle || []).push({}); Before surgery to replace my hip and correct a lifelong pelvic deformity, I could walk but it was agony. I was grateful for wheelchairs provided in stores and museums, as neither was accessible to me otherwise. I am grateful to not have been judged for choosing to not be in as much pain. I don’t understand humans anymore. Is empathy dead, or just out of fashion? Why can’t we believe that individuals know what they need? Is it anyone’s business how one does the things they need just to live their lives?posted by kinnakeet at 4:12 AM on March 3 [20 favorites] Thanks for posting, I liked the article. It's amazing how many people seem to think that walking ability is an all-or-nothing kind of thing; we should all realise that there are so many options, such as 'I can walk, but just a few steps', '... but it hurts a lot', '... but I'm wobbly and don't want to fall' or '... on a good day which is not today'.posted by Too-Ticky at 4:14 AM on March 3 [11 favorites] Conversely, I have a family member who can cover a fairly good distance in a walker, but occasionally a chair makes sense. It's situational. But, she also has her own set of issues (mostly about balance) that aren't always visible. When we research a place or building for accessibility, we've learned that "accessible" often assumes "wheelchair", which doesn't always work for her. It's not a binary yes-or-no analysis, more of a Venn diagram where her needs and the needs of "classic" wheelchair users do overlap, but aren't the exact same set of issues.posted by gimonca at 4:21 AM on March 3 [5 favorites] I work with someone with fairly significant cerebral palsy who can walk, but it’s laborious. She chooses to use a wheelchair, and it never occurred to me to question it. Seconding kinnakeet - above all in these situations I think the main operative idea should be that it’s really none of your goddamn business.posted by reedbird_hill at 4:31 AM on March 3 [8 favorites] I mean, I’ve only been in a wheelchair for short periods (hospital transport), but it’s not fun or convenient, so I assume anyone using one has a good reason. Who’d use a wheelchair for clout? They make life possible for some people but not convenient.posted by GenjiandProust at 4:39 AM on March 3 [6 favorites] This is so important for people to know, thank you for sharing.posted by ellieBOA at 4:54 AM on March 3 There's so much stigma that my mother resisted a chair -- was encouraged to resist it by her doctor and my father -- for a very long time, despite multiple relevant medical conditions and orthopedic surgeries, one of which was disastrous and almost killed her. She still resists going in public in the chair, which means in essence that she doesn't leave her assisted living facility unless she absolutely must. Yes, it would be easier if she could walk without pain or major falling risk, but we don't live in that world, we live in this one.posted by eirias at 5:02 AM on March 3 [10 favorites] Who’d use a wheelchair for clout? You asked.posted by Lemkin at 6:02 AM on March 3 [1 favorite] I use a power wheelchair when I leave my house, mainly because standing up/walking causes me to have racing heart rate and feel like my legs are going to buckle underneath me, and too much walking leaves me stuck in bed, feverish and utterly exhausted, for a week. (I have Chronic Fatigue Syndrome. Any physical exertion causes Post Exertional Malaise, or payback, and too much overdoing can cause permanent loss of functioning that lasts for weeks/months/years/decades.) Back before COVID started (when I still left my house regularly) I got so much abuse when I stood up out of my power wheelchair for 5 seconds to get something out of the bag on the the back of my powerchair or to put a jacket on/take a jacket off. Total strangers would yell "just lazy!" or "You've got to be joking me, those things [power wheelchairs] are for people who can't walk at all!" or "Just fucking walk!" (that last one was when I was seated in my power wheelchair, but someone saw my legs move while I was seated.)posted by chariot pulled by cassowaries at 6:08 AM on March 3 [26 favorites] Damn, that’s enraging. I’m sorry. Wish you really did have those cassowaries on staff.posted by eirias at 6:19 AM on March 3 [13 favorites] It's sad that this is necessary, as it seems pretty intuitive that being able to walk a short distance does not make one capable of walking long distances, and short and long vary greatly depending on the individual. Those of us who don't need wheelchairs still often use mechanical devices to travel distances that would be difficult or impossible to traverse on foot, such as cars.posted by Mr.Know-it-some at 6:38 AM on March 3 [10 favorites] I have autoimmune arthritis and have been contemplating life in a wheelchair since I was a teenager. I don't need a wheelchair or even a walker but I have chronic fatigue and pain issues that limit how far I can walk without stopping/sitting. I sometimes end up using the handicap seat on public transit and since I'm not carrying a cane or walker, I've generally gotten a lot of shit about that. But when and if I get to the point I need a wheelchair, it's going to be a bunch of shit about that. I don't know that it's gotten worse, but people are really jerkish about disability and accommodations that they don't personally benefit from. And everybody feels like they're entitled to judge you about your disabilities and tell you you're doing it wrong if you don't meet their personal stereotype of a disabled person. Sending hugs to all my ill/disabled folks who have to deal with jerks.posted by gentlyepigrams at 7:21 AM on March 3 [9 favorites] My mother in law had advanced Hepatitis C, and would use one of those scooters when I took her shopping. When we went to the Christmas Festival in Galveston, we rented a wheelchair, and that thing wasn't fun at all. (Trolly tracks and wheelchairs aren't a winning combination.) Her issue was getting tired quickly, so she could walk into stores, or walk short distances when the wheelchair kept getting stuck. I don't recall anyone complaining about the wheelchair, but she looked old and infirm (even though she was younger than I am now), and we obviously weren't having fun with it. One of the people I went to college with has a disease where his muscles calcify, and now requires a wheelchair to get around. He posts a lot on our college facebook group. It's amazing how many accessible places really aren't. (He also can't take intramuscular vaccines, so Covid was a special hell for him.)posted by Spike Glee at 7:32 AM on March 3 [1 favorite] Who’d use a wheelchair for clout? Boarded a domestic flight in a US airport recently? Disability pretenders are traveling again. They're the variant of gate lice who grab or order a wheelchair they use to qualify for early boarding.posted by Rash at 7:36 AM on March 3 My dad initially struggled with the idea that he might benefit from a wheelchair even if he doesn't technically *need* it. But once he got over his hangups, he became a big proponent of them after his hip replacement. But yeah, even though it seems obvious - just because a person can technically walk doesn't mean it's without pain or that after a relatively short distance might start to present problems for them - it's definitely something a lot of able-bodied people don't really think about until they or someone they know is that situation. I can think of wheelchair-using characters in TV/film, but I can't think of any who used a wheelchair as a supplement to what their legs could do. Anyway, this reminds me of Andrew Leland's memoir about going blind. He had a lot of internalized baggage about using a cane since technically he could see, albeit with a very limited peripheral vision. But after a close call, he decides, OK, clearly this will help me stay safe. And then he gets berated by strangers for "faking it" when they notice that he still has some sight.posted by coffeecat at 8:40 AM on March 3 [4 favorites] They make life possible for some people but not convenient. I don't think this is the right framing. If your surroundings are wheelchair-accessible, they make life incredibly convenient. If not... well, I'd say it's the surroundings that are a problem, not the chair, which after all is still way better than nothing.posted by Birds, snakes, and aeroplanes at 8:42 AM on March 3 [5 favorites] I wish I understood why some people are so convinced that everything anyone else does is in some way a scam.posted by smelendez at 8:54 AM on March 3 [4 favorites] Boarded a domestic flight in a US airport recently? Disability pretenders are traveling again. This will of course be addressed by airlines improving boarding procedures and better accommodations for wheelchair users. 🍔posted by zamboni at 9:29 AM on March 3 [1 favorite] My father for a long time could walk a limited amount depending on the day maybe 500 to 1000 metres. So he had a handicap tag for his vehicle. Here that's branded with a wheelchair even though it applies for someone like my father. He had people leave what only can be described as diatribes on his windshield for having the nerve to park in a handicap spot without a wheelchair. Or use what they though was illegal use of a handicap tag. This in addition to regular side eye looks. People can be clueless and mean.posted by Mitheral at 10:04 AM on March 3 [3 favorites] I’m pretty sure anyone who thinks a wheelchair is a lazy way to get around would be cured of that impression by trying it for a day.posted by Horace Rumpole at 10:25 AM on March 3 [11 favorites] I think the phenomenon of "disability pretenders" is um...completely made up. Pretty much all the "examples" given in the article could just as easily be people who are described in the post, I.e., folks who can walk a bit but not a lot, or can walk a lot sometimes but not all the time. It's *totally reasonable* to request a wheelchair for the long, line-filled wait at the airport to depart, and not use it when you reach your destination, where there's a lot less waiting, no worries about finding seats at the gate or getting onto the plane while everyone is waiting for you, etc. It's so frustrating that we live in a society where so many people are constantly exposed to scams that they're on the lookout for them everywhere. We got a whole nation of amateur cops trying to "catch someone in the act". There are a lot of grifts out there, but I really think the "phenomenon" of completely healthy and able-bodied people faking a disability and requesting a wheelchair to get on the plane first is vanishingly rare in practice.posted by potrzebie at 10:49 AM on March 3 [13 favorites] I sometimes use a power wheelchair (I can walk short distances without trouble, but not multiple blocks) and I've never noticed a negative reaction from a stranger seeing me do both. Maybe it's because I'm a fairly burly looking man? Maybe it's because I've only done so in Latin America and Canada (the concept of disability pretenders seems very American to me, but I see an example upthread from Australia too)? I did once meet up with someone for a date who was a little surprised to see me roll up in a wheelchair, despite photos showing me in one on my profile and words to that effect in my bio. She later told me she thought it was a joke, which was odd (would you really want to go out with someone who joked about using a wheelchair in their profile?). But it ended up being a fine date.posted by ssg at 1:22 PM on March 3 [2 favorites] I'm a user. And my experience does not Echo those above. People are kind and helpfulposted by Keith Talent at 8:00 AM on March 4 [1 favorite] Yeah, my partner became a part-time wheelchair user a few years ago, and we’ve been pleasantly surprised. We keep waiting for a shitty reaction, and it keeps not coming. To be clear, they do face problems. But the problems they have are general problems with accessibility that any wheelchair user faces, not specific grief for being ambulatory.posted by Birds, snakes, and aeroplanes at 9:37 PM on March 4 « Older bighorn beat brown bear but busted my bracket | A blame-the-system impulse Newer » (adsbygoogle = window.adsbygoogle || []).push({}); You are not currently logged in. Log in or create a new account to post comments. Related Posts I use a wheelchair and I want more bike lanes August 31, 2023 Fun outings for visitors with limited mobility April 1, 2023 I do not consider my disability a ‘special request.’ April 5, 2019 “So why the hell are there so many staircases in... July 31, 2018 Designs for sitting July 14, 2014 (adsbygoogle = window.adsbygoogle || []).push({}); Tags AmbulatoryWheelchairUsers WheelchairUsers Wheelchairs Share Facebook'''
