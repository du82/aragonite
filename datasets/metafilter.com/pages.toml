full_description = '''Recent Posts Recent Posts Popular Posts March 5 It’s a fitting moment to discuss enemy feminisms Just as the so-called “socialism of fools” comes from a truncated analysis of capitalism, resulting in national socialism (i.e., fascism), the feminism of fools, if you will, arises from bad materialism, a diagnosis of the sex/gender system that is fatally foreshortened. This leads it to form a wounded attachment to ontological womanhood. The feminism of cisness, for example, has spread like a pogrom. Today, it is unsurprising to find self-described feminists at the forefront of policymaking to deny gender-affirming health care, or to make bathrooms and sports lockers cissexual at all costs, in the name of women’s rights. from Feminist Fascisms A conversation with Sophie Lewis [The Baffler; ungated] posted by chavenet at 1:54 AM - 16 comments March 4 New Australian dinosaurs and the oldest megaraptorid fossils New Australian dinosaurs and the oldest megaraptorid fossils in the world. Australia’s first carcharodontosaur fossils unearthed along Victoria’s Cretaceous coast. posted by chariot pulled by cassowaries at 8:05 PM - 1 comment voting? The SAVE Act, if passed, would represent substantial barriers to voting for not only transgender adults but also for more than 140 million Americans who do not have a passport, as well as 21 million Americans who do not have access to their birth certificate or other documentation or the millions of Americans, including 69 million married women, who have changed their legal name [americanprogress] posted by HearHere at 6:00 PM - 27 comments The Gulf of Unreasoning Amidst a trade war with American's neighbors and partners, and a crashing economy, US President #47 will address a joint session of the US Congress starting at 9p.m. ET (watch live on YouTube) posted by Brandon Blatcher at 4:55 PM - 129 comments Timeline Cleanse NHK World presents A Cat's-Eye View of Japan, 42 5-minute episodes showing various places in Japan as seen by the cats who live there. posted by carrienation at 4:48 PM - 3 comments Never gonna give up dancing at the Pink Pony Club Because somebody might need this today: Rick Astley covers Chappell Roan's Pink Pony Club. posted by signal at 4:16 PM - 17 comments "We still live in history —and at the mercy of biology." How Covid Remade America (David Wallace-Wells, NYT gift, archive.is) posted by box at 2:34 PM - 21 comments There’s no magic here What do you do with your unclosed browser tabs? I find that they take up a lot of screen space. So this week I figured out how to run pong inside mine. posted by chavenet at 1:55 PM - 12 comments "Tell her I exploded, and tell her it was very sad" George Lowe, iconic baritone voice of cult TV classic Space Ghost Coast to Coast, dead at 67 [more inside] posted by Rhaomi at 1:42 PM - 30 comments Tom Petty truly belonged among the wildflowers I stumbled across this documentary: Tom Petty: Somewhere You Feel Free - The Making of Wildflowers, and I can't recommend it highly enough. The insights you get from Tom, the band, and producer Rick Rubin are fascinating. [more inside] posted by JonathanB at 10:11 AM - 5 comments And so it begins The Tariff Wars have started. (slCBC) [more inside] posted by Kitteh at 5:18 AM - 454 comments ↔ Could time flow in both directions rather than just moving forward? A groundbreaking study from the University of Surrey suggests that under certain quantum conditions... [spacedaily/nature] posted by HearHere at 5:17 AM - 27 comments Time is eccentric and unforgiving; at least it’s quite dependable With their uniformity and certainty, calendars feel like periodic tables of time. You can see the last days of the previous month and the first days of the following month at the beginning and end, looking a little embarrassed to be caught in a picture in which they don’t belong. But while next year’s calendar might feel full of promise (who knows what I might be up to on August 7th next year?), the next millennium’s calendar registers as eerie. I do not know what cataclysms, invasions, and extinctions will have occurred by September 20th, 3025 but I do know that it will fall on a Tuesday. from "Time" is the Most Common Noun in the English Language posted by chavenet at 2:37 AM - 5 comments March 3 Robert Bringhurst's "The Elements of Typographic Style" The Elements of Typographic Style is a book on typography and style by Canadian typographer, poet and translator Robert Bringhurst. ... A history and guide to typography, it has been praised by Hermann Zapf, who said "I wish to see this book become the Typographers' Bible." Jonathan Hoefler and Tobias Frere-Jones consider it "the finest book ever written about typography." ... Because of its status as a respected and frequently cited resource, typographers and designers often refer to it simply as Bringhurst.* [more inside] posted by Lemkin at 8:19 PM - 16 comments Greater gliders' spectacular recovery after Blue Mountains bushfires Greater gliders' spectacular recovery after Blue Mountains bushfires. The endangered marsupials' population in part of the southern Blue Mountains has increased by 45 per cent since before the fires began in 2019. (Australia). posted by chariot pulled by cassowaries at 7:36 PM - 1 comment The world is riddled with maggots A song by Chumbawamba that isn't Tubthumping Chumbawamba is often thought of as a one hit wonder, but there's a lot more to them. They're anti-fascist, pro-union, and loved to do protest songs. This one is even more relevant now. posted by mike3k at 5:40 PM - 26 comments The most beautiful invention of all time Its design is a chef's kiss. It can scale from love note to embracing the world. And it united countries and continents in the aftermath of war. In this short SLYT, mathematician Hannah Fry explains why she adores A4. [more inside] posted by Thella at 5:31 PM - 25 comments "I am quite absurdly in love with him." Letters and diaries tell the story of the love between two survivors of the final Scott expedition to the South Pole. via the Atavist. posted by Well I never at 4:47 PM - 7 comments ¡Siempre volverá sano e contente! In the 1970s, the Mar Chiquita lagoon (english), which lies in the province of Córdoba, in central Argentina, swallowed neighboring Miramar. The waters destroyed 102 hotels, 198 homes, 65 businesses, the thermal complex, the casino, and the amphitheater, leaving Miramar on the brink of collapse. The economy was obliterated, and many families chose to leave the city, drastically reducing its population. Those who stayed rebuilt their lives in other parts of Miramar, away from the lagoon ... It wasn't until 2003 that the waters of Laguna Mar Chiquita began to recede, amid the worst drought in decades. The scene was desolate: abandoned structures covered in salt and petrified tree trunks standing crookedly as silent witnesses to what was lost. from The Return of a Lost City [The Dial] posted by chavenet at 1:53 PM - 10 comments A world in which corporations controlled all media--set in 2018. The owners eventually decide that [he was] getting bigger than the game, and that his popularity as a player is a threat to their control. No, this isn't about the controversial Luka Doncic trade--it's a look at Norman Jewison's underrated movie Rollerball, which my father took me to see at the Sunnyvale drive-in theater when I was nine years old. posted by mecran01 at 11:30 AM - 26 comments How do you make a decision? (Weekly Free Thread) How to master decision making in a world of uncertainty What kinds of decisions are you trying to make lately and you don't know what to do about them? Commiserate, ask for advice, or just talk about whatever else is going on for you in this week's free thread. posted by jenfullmoon at 10:48 AM - 79 comments Japanese pencils The golden age of Japanese pencils "It was the summer of 1952, and the executives of Tombow Pencil were about to revolutionize the Japanese pencil industry—or, possibly, fall flat on their faces. Hachiro Ogawa, the son of founder Harunosuke Ogawa, was Tombow's managing director, and he had just finished a years-long project, at enormous cost, to make the best pencil Japan had ever seen." [via] posted by dhruva at 9:57 AM - 32 comments Do you know your ‘penis age’? Guardian: Johnson spends a reported $2m (£1.6m) a year on project Blueprint, his personal programme aimed at defying the ageing process ... For starters, he goes to bed at 8:30pm every night and takes more than 100 pills a day ... He also eats all his meals before 11am, bathes in LED light, and spends a part of his day sitting on magnets ... Recently Johnson posted his penis data online, comparing it to data from his 19-year-old son Todger Talmage. posted by Wordshore at 9:49 AM - 90 comments Soft, Strength, Structure The Striking Buildings of Zaha Hadid. "The Iraqi-British Zaha Hadid became famous for her intensely futuristic architecture characterized by curving façades, sharp angles, and severe materials such as concrete and steel. The structures she designed successfully accomplished what mystifies so many when they observe great architecture: She took the strongest materials in the world and manipulated them to form objects that appear soft and sturdy at the same time."Over the last two decades, her work has been honored by a long list of awards: In 2004 she was the first woman to be awarded the Pritzker Prize; in 2010 and 2011 she received the Stirling Prize, a British decoration for excellence in architecture; in 2014 her Heydar Aliyev Cultural Centre, like an undulating sheet of graph paper, won the Design Museum Design of the Year Award; and in 2016 she became the first woman to win the RIBA Gold Medal. Hadid’s projects, many of which transform depending on the viewer’s perspective, turn architectural convention on its head."(ungated link) [more inside] posted by storybored at 8:03 AM - 23 comments Alive in Kingston, but also Still Alive in Kingston Kingston, Ontario filmmaker Jay Middaugh and his love for the city in film. Jay has written and directed two movies set in Kingston; both heavily feature local musicians/bands. His first film, 2017's Live in Kingston, can be watched in its entirety at the link. (I'll also post it in FanFare.) [more inside] posted by Kitteh at 4:55 AM - 10 comments Ding-dong The Fish Doorbell has been activated again (link to Dutch news website) Peek to see if perch wants to pass, and press the bell to permit. posted by Stoneshop at 4:28 AM - 5 comments A blame-the-system impulse On the internet, where there’s no tone of voice or body language to send signals, using particularly evocative phrases is even more important than normal. Ugh, Capitalism and all its variations are a reliable way to give any statement that oomph, that hit of seriousness. It can signal that you’re one of the Good Guys, one of the people who gets it. from Ugh, Capitalism by Jeremiah Johnson [Infinite Scroll] posted by chavenet at 1:34 AM - 56 comments Kate can walk but often uses a wheelchair to get around. Here's why One in three wheelchair users are ambulatory (eg can walk a few steps). This article explains why people who can stand up for a brief moment still need a wheelchair due to severe pain; balance issues; falls; or severe exhaustion. posted by chariot pulled by cassowaries at 12:02 AM - 24 comments March 2 bighorn beat brown bear but busted my bracket March Mammal Madness. You (or your biology students) learn enough about sixty-five animal species to predict who would come out on top if the two encountered each other in the higher-seeded animal's habitat. These fictional encounters them play out through March. This year's bracket. BlueSky hashtag. [more inside] posted by fantabulous timewaster at 10:50 PM - 2 comments Al Schmitt For his work on more than 150 Gold and Platnium records, audio legend Al Schmitt won 22 Grammy Awards - more than any other engineer or mixer. In 2014, he became the first engineer honored with a star on the Hollywood Walk of Fame. He was beloved of his colleagues. In short, he was the GOAT. [more inside] posted by Lemkin at 5:49 PM - 4 comments NYT review of MeFi's own Omar El Akkad's New Book Irish author Fintan O'Toole reviews One Day Everyone Will Have Always Been Against This by MeFi's own pre-eminent science fiction author Omar El Akkad for the New York Times. [more inside] posted by y2karl at 5:20 PM - 11 comments Before Hitler: Your Turn January, 1928: It is a bright time for German democracy. After a period of struggle, inflation is finally under control, and the economy is expanding steadily. In foreign policy, we have reached agreements with the Western powers and the Soviet Union that might make genuine peace a reality. Now, the task of Social Democracy is to prepare for the next election. The bourgeois-right government of Wilhelm Marx is unpopular, and we stand to gain. Social Democracy: An Alternate History: Help navigate the Social Democratic Party (SPD) through political and economic crises, contentious parliamentary elections, and the ominous rise of the Nazis in the waning years of the Weimar Republic. A text adventure simulation by Autumn Chen. [more inside] posted by Rhaomi at 4:52 PM - 13 comments Log, baby log A rarely used amendment to the Endangered Species Act allows for the creation of a committee nicknamed "the God Squad" to take unprecedented action during emergencies like hurricanes and wildfires. Trump wants to convene this committee to bypass endangered species protections and other environmental regulations to ramp up timber production across 280 million acres of national forests and other public lands. Likely fallout includes increase fire risk, additional global warming, species extinction, pollution, increased wildfire intensity and richer oligarchs. posted by CheeseDigestsAll at 4:38 PM - 21 comments Finding groups by their agreement Analyzing UK people by their opinions doesn’t reconstruct generational cohorts. Preliminary research? Better-than-average marketing research? Common fallacies rediscovered? [more inside] posted by clew at 12:36 PM - 11 comments Don Ellis "Don Ellis led one of the most colorful big bands in the history of jazz from 1966 until 1978. Ellis's big band was distinguished by its unusual instrumentation, the exploration of uneven or odd time signatures, its occasional humor, and its openness to using rock rhythms and electronics. His orchestra achieved enormous popular appeal at a time when the influence of big band music was noticeably fading. Ellis applied his knowledge of the music of non-Western cultures to the rhythmic language of jazz. He was one of the first to have accomplished such a fusion of ideas, and his work stands as a memorial reflecting a significant stage in the evolution of jazz." [more inside] posted by Lemkin at 6:28 AM - 6 comments Just one more sprite bro Nine is a deceptively simple demo breaking free of the Commodore 64's famous 8 hardware sprite limit. It'''
