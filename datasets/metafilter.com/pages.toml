description = "Because somebody might need this today: Rick Astley covers Chappell Roan's Pink Pony Club."
full_description = '''Never gonna give up dancing at the Pink Pony Club March 4, 2025 4:16 PM Subscribe Because somebody might need this today: Rick Astley covers Chappell Roan's Pink Pony Club. posted by signal (17 comments total) 26 users marked this as a favorite (adsbygoogle = window.adsbygoogle || []).push({}); I have listened to this multiple times today. It's always easy to forgot that Rick Astley can actually really singposted by drewbage1847 at 4:34 PM on March 4 [3 favorites] I have been rickroaned!posted by Calvin and the Duplicators at 4:55 PM on March 4 [30 favorites] Goshdurnit, Calvin and the Duplicators, where were you when I was titling this post???posted by signal at 4:58 PM on March 4 [2 favorites] Just today I was telling someone that my preferred music is classical and soundtracks, but I haven't been able to get this song out my head since her Tiny Desk concert. Thanks, Rick, you're not helping. (I loved this cover, especially that he didn't gender-swap the lyrics.)posted by lhauser at 4:59 PM on March 4 It’s very soulful.posted by GenjiandProust at 5:18 PM on March 4 That was so nicely done, very unexpected!posted by Glinn at 5:22 PM on March 4 thanks for this! I loved that he went and put on a cowboy hat during the song.posted by Art_Pot at 5:24 PM on March 4 This made me so happy, thank youposted by lianove3 at 5:33 PM on March 4 I don't know what I expected, but I think this is better than any of his actual songs. He obviously really likes this song.posted by kittens for breakfast at 5:46 PM on March 4 [1 favorite] Rick Astley always seemed to handle the whole Rickrolling thing well. I mean, it probably benefited him but he also seemed to have fun with it (remember that Macy's Thanksgiving Day Parade where we all have to explain what Rickrolling was to our parents?) He does have a great voice and "Never Gonna Give You Up" is a great song. (I actually know someone who got married in the Rickroll era and they were jokingly going to include the lyrics in their vows until they realized oh, wait, we mean all of these things genuinely.)posted by edencosmic at 5:48 PM on March 4 [3 favorites] Thank you! You brightened up my gloomy evening.posted by kyraU2 at 5:54 PM on March 4 [1 favorite] That was lovely.posted by latkes at 6:21 PM on March 4 Loved this. I saw it before I got here, but I'm glad to see it here.posted by gentlyepigrams at 7:17 PM on March 4 a fitting tributeposted by ginger.beef at 8:06 PM on March 4 [1 favorite] I recommend the whole playlist of Rick Astley covers. Also, Astley and KT Tunstall singing Highway To Hell.posted by WhackyparseThis at 10:55 PM on March 4 [1 favorite] I love this so much. Rich Astley has such a great sense of humor. From the time he got Mary Berry to play the drums to the time he got Rickrolled on reddit, he is just a joy. And he's so talented!posted by ceejaytee at 5:44 AM on March 5 I'm still astonished to see people holding up their phones to take videos of entire songs. Maybe even entire concerts. Astley seems like a good dude. I'm old enough that I remember when his videos first came out and we'd watch them along with other music videos on the 17" Sony Trinitron with rabbit ears. His voice never matched the way he looked and we always thought he was a bit funny.posted by SoberHighland at 6:27 AM on March 5 « Older "We still live in history —and at the mercy of... | Timeline Cleanse Newer » (adsbygoogle = window.adsbygoogle || []).push({}); You are not currently logged in. Log in or create a new account to post comments. Related Posts Never Gonna Believe My Eyes August 20, 2017 ♭ May 20, 2016 Something For Everyone February 25, 2014 Remember when music television actually played... October 3, 2011 Nirvana vs. Rick Astley: Never Gonna Give Your... July 19, 2009 (adsbygoogle = window.adsbygoogle || []).push({}); Tags RickAstley ChappellRoan PinkPonyClub RickRoan Share Facebook'''
