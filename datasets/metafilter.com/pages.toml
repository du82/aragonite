title = "And so it begins | MetaFilter"
description = "The Tariff Wars have started. (slCBC)"
full_description = '''And so it begins March 4, 2025 5:18 AM Subscribe The Tariff Wars have started. (slCBC)Canada PM Justin Trudeau issues a statement. (There will be a press conference later this morning.) Doug Ford makes serious threats against the US about hydro, nickel, potash, etc. Americans are about to get even more hosed in the price of everything. Canadians, we are right to see the US as the enemy right now. They've been trying to annex us for a VERY long time. posted by Kitteh (454 comments total) 32 users marked this as a favorite (adsbygoogle = window.adsbygoogle || []).push({}); Trump stated there was going to be painposted by robbyrobs at 5:25 AM on March 4 [2 favorites] Did it work? Anyone? Anyone know the effects?posted by chavenet at 5:25 AM on March 4 [51 favorites] I haven’t been able to find info on Canada’s retaliatory tariffs (ie the things that are about to get more expensive for Canadian me) — they had published some figures prior to the previous deadline, but does anybody know what’s happening this time yet? They say “25 per cent tariffs against $155 billion of American goods – starting with tariffs on $30 billion worth of goods immediately, and tariffs on the remaining $125 billion on American products in 21 days’ time” — what goods, though?posted by saturday_morning at 5:26 AM on March 4 I'm guessing the Project 2025 secret playbook is "create mass economic & food precarity... force people into the streets... declare martial law & get rid of Posse Comitatus... ??? ... profit"posted by kokaku at 5:35 AM on March 4 [47 favorites] Local reporting here is that gasoline prices will take a couple of weeks before they start to go up.posted by gimonca at 5:36 AM on March 4 [1 favorite] It's all just so stupid.posted by Wretch729 at 5:39 AM on March 4 [56 favorites] what goods, though? The first tranche of retaliation includes a list of 1,256 products such as orange juice, peanut butter, wine, spirits, beer, coffee, appliances, apparel, footwear, motorcycles, cosmetics, and pulp and paper. ... The government will be consulting the public and stakeholders for a second tranche of retaliatory tariffs which will include a wide range of products imported from the U.S. such as passenger vehicles and trucks, electric vehicles, steel and aluminum products, fruits and vegetables, aerospace products, beef, pork, and dairy. [Reuters]posted by mykescipark at 5:42 AM on March 4 [6 favorites] (Here's a full list of Canadian tariffs from about a month ago.)posted by box at 5:43 AM on March 4 [2 favorites] Every country in the world would do well to invest in domestic markets, food production, and manufacturing capacity as part of their national security.posted by krisjohn at 5:44 AM on March 4 [7 favorites] Every country in the world would do well to invest in domestic markets, food production, and manufacturing capacity as part of their national security. Currently the rest of the world is probably better off doubling down on trade in many sectors, to make up for lost revenue from exports to the US.posted by UN at 5:48 AM on March 4 [25 favorites] I think the belief of the project 2025 guys is that those of us who don’t have the “hardness”* to survive the famines deserve to die and that is a culling which will leave a heartier breeding stock for the master race. *moneyposted by Jon_Evil at 5:48 AM on March 4 [47 favorites] America has no idea how badly they fucked up. I know that destroying the country is kinda the whole point, for Trump. Break everything so his criminal buddies can buy up all the pieces. But still, the effects from all this nonsense are going to be so much worse than the average citizen expects. Anyway, fuck Trump, Fuck Musk, and Fuck America. Bring on the boycotts, divestments, and sanctions. Canada will emerge from this fight stronger, and with greater economic and security ties with Europe and elsewhere, meanwhile America will be left shattered and isolated.posted by mrjohnmuller at 5:52 AM on March 4 [70 favorites] If coffee is on the list of products whose prices are going to go up - I predict some mass discontent in New England when the prices at Dunkin' go up. (I mean, the prices will go up everywhere else too, but God help you if you try to get between a guy from Boston and his Dunkie's.)posted by EmpressCallipygos at 5:53 AM on March 4 [7 favorites] Every country in the world would do well to invest in domestic markets, food production, and manufacturing capacity as part of their national security. Wait, why wouldn't everyone else benefit even more from doubling down on globalism, free trade, and a robust social safety net? I would think that greater integration means greater prosperity and peace -- whereas greater isolationism is just worse.posted by wenestvedt at 5:55 AM on March 4 [30 favorites] Last time it was about border security. This time it's about the auto manufacturing sector. And guess which American auto manufacturer doesn't have any plants in Canada or Mexico? Can you imagine any other President having the CEOs of Ford and GM screaming in their ear that this is going to be a economic disaster and just ignoring them.posted by thecjm at 6:01 AM on March 4 [8 favorites] I said to my therapist last week, "I fully expect that in three years I'm going to be either picking fruit or rendering chicken corpses. If I make my quota and attend the Praise Meeting for our Glorious Leader, I might get a fish head with my bowl of rice." My therapist: "You really think it'll take that long?"posted by outgrown_hobnail at 6:01 AM on March 4 [102 favorites] Again, I am 100% okay with any retaliatory actions. If we need to shut off or throttle hydro to the US, fine. If we need to withhold ANYTHING the US needs, fine. The US will now only respond to threats. Fuck the high road. Trump already sees us as a weak soft country. That's why he wants us. I don't want to play fair.posted by Kitteh at 6:05 AM on March 4 [61 favorites] Wait, why wouldn't everyone else benefit even more from doubling down on globalism, free trade, and a robust social safety net? Yes. This. I’m in the middle of reading Tony Judt’s Postwar, his history of Europe from 1945-2005. This is one of the biggest lessons. Isolationism in Europe before WWII resulted in stagnation and poverty across the continent. The free trade systems the countries set up after (which they did reluctantly and often only to get the investments from the Marshall Plan) resulted in an economic boom that the continent had never before seen. Trying to do everything in-house just doesn’t work anymore. The world is too complicated.posted by heyitsgogi at 6:05 AM on March 4 [43 favorites] Kitteh: fuck us up! It's the only way we might learn.posted by GCU Sweet and Full of Grace at 6:07 AM on March 4 [16 favorites] I predict some mass discontent in New England when the prices at Dunkin' go up. I mean, I guess? Never mind that hundreds of people were already out to protest J.D. Vance's ski weekend in Vermont and demonstrations in front of Tesla dealerships have already become a regular fixture. But yeah. If an SNL sketch says we're all obsessed with coffee, it must be true, amirite?posted by RonButNotStupid at 6:08 AM on March 4 [8 favorites] Wait, why wouldn't everyone else benefit even more from doubling down on globalism, free trade, and a robust social safety net? In a perfect world, sure. I worked in Korea for a little bit around 1990 and there were huge tariffs on imported goods. It certainly drove domestic production. I think for Canada, at least a secure domestic food supply is needed and that requires farming subsidies, marketing boards and laws that keep farmland from being developed.posted by brachiopod at 6:08 AM on March 4 [6 favorites] Yeah, forget the "measured response" thing, I want Canada to go apeshit. Cut off all power and oil exports. Seize American assets. Sanction the heads of American companies and ban them from entering the country. Whatever it takes. Everytime we get hit, we need to hit back twenty times harder.posted by mrjohnmuller at 6:10 AM on March 4 [39 favorites] I'm really curious (and dreading) how this is going to affect fruit prices in Canada. A lot of our fruit comes from California and Florida. But something like bananas - do those get imported straight from Central America or do they get shipped to the US first and then trucked across the border?posted by thecjm at 6:13 AM on March 4 [2 favorites] mrjohnmuller, I really didn't want to do this but I have started a savings account for citizenship renounciation. Given the cost the US makes you pay to not be a citizen, it will take me a while and if things change for the better in the meantime, I can always just dump that money into my RRSP. I am legit not kidding that I am waiting for dual citizens to be seen as traitors. And if I have to chose where my loyalties lie, I've made it pretty clear.posted by Kitteh at 6:13 AM on March 4 [14 favorites] Yeah, forget the "measured response" thing, I want Canada to go apeshit. Cut off all power and oil exports. One of the many downsides of federalism in Canada is that we could see a situation where Ontario and Quebec cut hydro electricity from crossing the border hurting the economies of the biggest provinces in the country, while Alberta still happily pipes their oil to the US.posted by thecjm at 6:15 AM on March 4 [11 favorites] >Everytime we get hit, we need to hit back twenty times harder. Cf. 'beggar thy neighbor,' Defense Scheme # 1posted by Richard Saunders at 6:15 AM on March 4 [1 favorite] What can you do? Tighten your budget. Cancel all unnecessary expenditures. (I canceled my cable TV and I live where I can't get broadcast TV). Buckle your seat belts. It's going to be a bumpy ride.posted by dances_with_sneetches at 6:16 AM on March 4 [5 favorites] Canadians, we are right to see the US as the enemy right now. They've been trying to annex us for a VERY long time. I am going to push back hard on this irresponsible framing. Half that country did not vote for this. "If some members of [x] are [y], then all members of [x] are [y]" is ignorant and unevolved no matter which group it is.posted by CynicalKnight at 6:19 AM on March 4 [10 favorites] Hey guess what? I don't care! If the US is going to paint us with the broad brush, I will happily do the same. I'm aware a huge chunk of Americans didn't vote for Trump (I'm one of them) but I am sick to my back teeth of people demanding Canada be the bigger country right now.posted by Kitteh at 6:21 AM on March 4 [42 favorites] I wonder how this will affect New Orleans' economy. We're a major port. We're also a major tourist destination and that's certainly a problem but, well, shit, one of our major tourist attractions (Mardi gras) is all about sitting on a float, throwing out super-cheap imported trinkets. I seriously doubt any of those tariffs, or other price increases related to them, will be going into our pockets rather than the state or the country's coffers.posted by egypturnash at 6:21 AM on March 4 [2 favorites] If coffee is on the list of products whose prices are going to go up Coffee is a retaliatory tariff in Canada, so coffee will go up for Canadians. Remember, when your country imposes the tariff, prices go up *for you*.posted by warriorqueen at 6:24 AM on March 4 [13 favorites] Students of US history know what happens when tariffs are imposed. Too bad so few in the government right now are students of US history.posted by tommasz at 6:26 AM on March 4 [16 favorites] I used to work for a Midwestern retailer that shipped their inventory from Asia (uh oh) by rail through Prince Rupert (uh oh) rather than deal with American west coast ports. I kinda wonder how they're restructuring logistics.posted by LionIndex at 6:27 AM on March 4 [2 favorites] The problem with a furious approach from Canada or other countries is the self-harm inflicted. It may be hard to maintain extreme measures if the economy collapses, as it could when the biggest trading partner is effectively shut out overnight. I am not saying there should be no response, by any means. There should be a swift and firm response, but don't put all your eggs in one basket. Some of the response can be retaliatory by a single country, but some should be an increase in cooperation between Europe, Canada and other countries. So, for example, the EU and Canada could synchronize tariffs on selected US products. Make specific sectors hurt. But we should also approach this creatively. US goods are one thing, but services and software are another. For example: One of the most profitable corporations in Europe and Canada is Apple. Where do Apple products come from? Not the US. They come from China. We'd effectively need to place tariffs on China to hurt a US company, and this doesn't make any sense. So what do we do here? I'm not even sure, but this is the challenge. Then there's Google and Meta and X. Canada and the EU should, in unison, pass laws to ensure social media and search cannot be monopolized by foreign owned companies, similar to laws that exist for other media (news, television). The timing is good because we actually have European alternatives right now (Canadian I don't know), which we didn't really even during Trump 1.0.posted by UN at 6:28 AM on March 4 [9 favorites] Hey guess what? I don't care! If the US is going to paint us with the broad brush, I will happily do the same. Oh yeah?! Well, we didn't elect Rob or Doug Ford..posted by DeepSeaHaggis at 6:30 AM on March 4 [3 favorites] Elbows up!posted by JoeZydeco at 6:32 AM on March 4 [5 favorites] I am going to push back hard on this irresponsible framing. Half that country did not vote for this. 2003 called. They want their "not all Americans" excuses back. It's not like the people our half of the country voted for did anything to arrest or detain Trump after January 6th anyways...posted by RonButNotStupid at 6:34 AM on March 4 [35 favorites] Hey guess what? I don't care! Oh yeah?! Well, This is exactly what I mean. Stop doing Trumps work for him.posted by CynicalKnight at 6:35 AM on March 4 [3 favorites] Oh no, will Mister Trump feel bad that Canadians don't like him? Oh no, we should consider his and Russia's fee-fees!posted by Kitteh at 6:37 AM on March 4 [9 favorites] Some of the response can be retaliatory by a single country, but some should be an increase in cooperation between Europe, Canada and other countries. I don't see any evidence that tariffs on US imports are the only Canadian response. We're also knocking down barriers to inter-provincial trade, as well as beefing up trade relationships with other countries. It's important to keep in mind that the retaliatory response is DWARFED in terms of economic impact by the American-imposed tariffs. The latter are what will kill the Canadian economy.posted by jordantwodelta at 6:37 AM on March 4 [7 favorites] I'd hoped it was obvious but I was being facetiousposted by DeepSeaHaggis at 6:37 AM on March 4 Kitteh: "Hey gue'''
