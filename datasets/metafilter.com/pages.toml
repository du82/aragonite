ical and morally adrift (ungated) - Even as Israel triggered starvation, bombed hospitals and schools, cut off aid supplies, and sent the death toll in Gaza higher and higher, J Street refused to change its approach. The group marked the October 7 anniversary by saying, “We continue to believe that stronger US leadership is needed to find diplomatic offramps, pull the region back from the brink and stop a terrible situation from becoming even worse.” Yet the organization’s make-believe mode persisted, as though Biden’s team were fully committed to restraining Israel. “In the coming days and weeks,” J Street said on October 24, “it is of the utmost urgency that the Biden administration continue to work with US allies in the region to pull every lever within reach to rein in Netanyahu—and all parties to the conflict—and pull the whole region back from the brink.” Only after 13 months of backing Biden’s pivotal support for the Israeli siege did J Street express even mild discontent with his policies enabling the nonstop horrors to continue in Gaza. In mid-November, with Biden on his way out of office, the group urged senators to vote for “at least one resolution of disapproval of proposed arms sales to Israel.” While noting that the vote on the Senate floor “will not lead to the suspension of offensive arms transfers to Israel as the procedural deadline for the votes to block the arms sales has expired,” J Street claimed that senators voting for one of the resolutions “will make clear to the Netanyahu government that Israel’s conduct of the war in Gaza…is unacceptable.” By the way, Marco Rubio just approved another $4 billion in arms to Israel under emergency powers - this is in addition to the $3 billion on Friday. Anyway, no deal in Ukraine, no deal for Gaza and the assaults on the West Bank continues, and no desire in Israel to end any of the wars it really wants to ignite with multiple neighbors. So much for that Nobel Peace Prize. These orgs are raising money for 