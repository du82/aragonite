description = "Letters and diaries tell the story of the love between two survivors of the final Scott expedition to the South Pole. via the Atavist."
full_description = '''"I am quite absurdly in love with him." March 3, 2025 4:47 PM Subscribe Letters and diaries tell the story of the love between two survivors of the final Scott expedition to the South Pole. via the Atavist. posted by Well I never (7 comments total) 25 users marked this as a favorite (adsbygoogle = window.adsbygoogle || []).push({}); Huh, was this the inspiration of the sub-plot within Kaliane Bradley's 2024 scifi novel The Ministry of Time?posted by pjenks at 5:20 PM on March 3 [2 favorites] I’m still reading the article, but I’m wondering if Carrie Vaughn’s _The Naturalist Society_ took some inspiration from this as well (it’s also a very fun book).posted by hackwolf at 6:20 PM on March 3 Poor Cherry-Garrard; "I only am escaped alone".posted by clew at 8:29 PM on March 3 [1 favorite] He discussed Jane frequently with the ship’s biologist, Lillie, a quirky fellow prone to spouting mystical theories about reincarnation when he wasn’t studying the life cycles of whales and dolphins. That would be Denis G Lillie (1884 - 1963) not to be confused with John C "talking to dolphins" Lilly (1915 - 2001) whom MetaPrev. The terrible catalogue of loss among the Terra Nova band of brothers during WWI wraps up this fascinating essay. In a way the catalogue of survivors is picked up at the start of Into the Silence by Wade Davis [MetaPrev]. The book records the next series of quixotic, high profile, terribly British, ventures into the cold: Everest up and at 'em in the 1920s.posted by BobTheScientist at 12:37 AM on March 4 [2 favorites] Lillie had confessed at one point to another shipmate that he felt his nature was “split”—that he was really a woman trapped in a man’s body, and that he blushed when he saw another man naked. This fills my trans heart with such joy - seeing written evidence of trans women in a historical document, tucked away between the lines of the story most would focus on. She was even a marine biologist - such a little snippet of the hidden lives of trans women in earlier days. The romance between Jane and Penelope is also astonishing in its depth and beauty. Seeing a gay romance hidden away to be discovered is just wonderful representation for all LGBTQ people.posted by Flight Hardware, do not touch at 4:14 AM on March 4 [11 favorites] If you are interested in a graphic novel account of this expedition, Sarah Airriess (former Disney animator) has done a bang-up job both in illustration and research (I've never seen a more amazing endnotes section) for her new book.posted by ikahime at 9:04 AM on March 4 quirky fellow prone to spouting mystical theories about reincarnation when he wasn’t studying the life cycles of whales and dolphins. ~ Past life self uncovered yet again ~posted by St. Peepsburg at 9:01 PM on March 4 [1 favorite] « Older ¡Siempre volverá sano e contente! | The most beautiful invention of all time Newer » (adsbygoogle = window.adsbygoogle || []).push({}); You are not currently logged in. Log in or create a new account to post comments. Related Posts “Are you a gay Republican or a Republican gay?” April 15, 2024 Gay Marriage, 1957 Edition July 29, 2019 “It’s not just a game… it’s a Gayme!” July 22, 2018 "The Straight Men Who Made America's First Gay... February 18, 2017 Gay Liberation October 1, 2009 (adsbygoogle = window.adsbygoogle || []).push({}); Tags gayhistory arcticexploration lovebetweenmen lgbtq queer history Share Facebook'''
