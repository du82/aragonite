title = "The Making of Big Green | MetaFilter"
description = "You like glassblowing? You like marijuana? Have I got something for you."
full_description = "The Making of Big Green March 1, 2025 3:57 PM Subscribe You like glassblowing? You like marijuana? Have I got something for you.More of their work here. posted by Lemkin (12 comments total) 4 users marked this as a favorite (adsbygoogle = window.adsbygoogle || []).push({}); Wow. All that barehanded work was unnerving. Trust amongst craftsmen, I guess.posted by kozad at 6:11 PM on March 1 [1 favorite] Glassblowing is so cool, yet scary. Those bongs are really cool, but could they make this? (From this post.)posted by TedW at 6:30 PM on March 1 [3 favorites] You like marijuana? It is relevant to my interests.posted by vrakatar at 8:24 PM on March 1 [1 favorite] but could they make this? What kind of stuff do you smoke out of that? And do you have any to share?posted by Literaryhero at 1:48 AM on March 2 [2 favorites] could they make this? I have an acquaintance who can. He's nearly 80 and has been making equipment like that for labs for over 60 years. He's still working because they can't find anyone to replace him.posted by pipeski at 11:16 AM on March 2 [4 favorites] Fancy, expensive glass bongs are nothing new and any true stoner knows just how breakable and tough to clean they are. No bigger buzzkill than when some crispy smoker starts dancing maybe and WHOOPS. They’re fun to look at, though, provided everyone is careful—which is no fun at a party. Best bong I own is a simple, ugly, super-heavy, thick-walled glass thing that’s easy to clean and, so far, unbreakable. Cost me about $15 at a Mexican market 40 years ago.posted by kinnakeet at 7:15 PM on March 2 [3 favorites] I always love seeing really lovely high quality glass bongs made by artisans (I couldn't afford them anyway) but I'm with Kinnakeet: all it takes is to be overenthusiastic whilst stoned and oh noes, the bong is broken. I have one bong--she doesn't get used much but she's pretty--and I am often tempted to purchase others.posted by Kitteh at 4:20 AM on March 3 [1 favorite] how breakable and tough to clean they are It’s the stoner equivalent of those fancy houses in Architectural Digest. No way in hell the owners are cleaning those things themselves.posted by Lemkin at 6:09 AM on March 3 [2 favorites] I can't smoke big bongs anymore: I guess has to do with being over 40 and having never been very good at inhaling all that smoke at one go (and it gets very stale very fast) and nowadays just couldn't even imagine trying. Give me my tiny spliffs and/or company that doesn't mind that I take forever with the huge bong. Very small bongs on the other hand.. they can be very nice, though even more of a pain to clean.posted by fridgebuzz at 6:12 AM on March 4 [1 favorite] This is the bong I currently covet.posted by Kitteh at 7:42 AM on March 4 [1 favorite] It has been quite some time since I partook of anything illegal, for any number of reasons, but if I did, I would want this, for old time’s sake.posted by TedW at 11:22 AM on March 4 [2 favorites] Oooh yes, TedW, that would be fun to use!posted by Kitteh at 11:53 AM on March 4 [2 favorites] « Older What ceasefire? | Next stop: Mare Crisium near Mons Latreille Newer » (adsbygoogle = window.adsbygoogle || []).push({}); You are not currently logged in. Log in or create a new account to post comments. Related Posts No thanks, I use video games to escape my reality October 21, 2013 What to do with $175,000 in weed found in your... December 6, 2012 All Cannabis Use Is Medical May 3, 2011 Harvard Scientists Build a Device to Smoke Weed... October 2, 2007 The Limits of Free Speech in Schools August 28, 2006 (adsbygoogle = window.adsbygoogle || []).push({}); Tags craft glass glassblowing drugs cannabis pot marijuana pipe bong Share Facebook"
