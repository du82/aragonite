full_description = '''Tom Petty truly belonged among the wildflowers March 4, 2025 10:11 AM Subscribe I stumbled across this documentary: Tom Petty: Somewhere You Feel Free - The Making of Wildflowers, and I can't recommend it highly enough. The insights you get from Tom, the band, and producer Rick Rubin are fascinating.As an aside, I also recommend Wildflowers & All The Rest (previously), the extended, double album version mentioned in the film, that was posthumously released in 2020. What a fantastic album. posted by JonathanB (5 comments total) 22 users marked this as a favorite (adsbygoogle = window.adsbygoogle || []).push({}); Can second JonathanB on the expanded "Wildflowers" reissue. Thanks for posting this JB, I look forward to watching.posted by kensington314 at 10:38 AM on March 4 [1 favorite] I do love that album - think it's the fullest "adult" Petty albumposted by drewbage1847 at 11:04 AM on March 4 [2 favorites] Wildflowers came out when I was in high school and remains one of my favorite albums, especially as a road trip album. Thanks for sharing this.posted by hydropsyche at 12:07 PM on March 4 [3 favorites] *goes to a room at the top of the world, turns speakers to 11*posted by HearHere at 1:06 PM on March 4 [1 favorite] Thank you for posting 🩷 I love Tom Petty since I was a teen in the 90s. My fave album is she’s the one, and I also really enjoyed his later works like Echo.posted by St. Peepsburg at 8:58 PM on March 4 « Older And so it begins | "Tell her I exploded, and tell her it was very... Newer » (adsbygoogle = window.adsbygoogle || []).push({}); You are not currently logged in. Log in or create a new account to post comments. Related Posts Bob Dylan with Tom Petty & the Heartbreakers,... November 2, 2023 Wildflowers & All The Rest October 17, 2020 I fought the law, and the law won (unless it didn't) November 11, 2015 The CD Case: like discovering that Hollywood is... July 17, 2014 "...Soon I'll find repose..." May 25, 2014 (adsbygoogle = window.adsbygoogle || []).push({}); Tags TomPetty music rock documentary Share Facebook'''
