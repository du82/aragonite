description = "Our alleged shooters--it has become clear over the past week--weren’t the thuggish murderers and rapists of fevered reactionary imagination, but Rationalists: Members of a large and loose..."
full_description = '''A far-out cognitive model and moral philosophy March 2, 2025 3:54 AM Subscribe Our alleged shooters--it has become clear over the past week--weren’t the thuggish murderers and rapists of fevered reactionary imagination, but Rationalists: Members of a large and loose community of autodidact and amateur philosophers and activists focused on self-described rationalist inquiry and self-improvement that’s become influential in A.I. research and philanthropy. from The Zizians and the Rationalist death cults by Max ReadSee also: The Delirious, Violent, Impossible True Story of the Zizians by Evan Ratliff [Wired] and Episode 434: Evil Gods Must Be Fought: The Zizian Murder Cult [Part 1] [Trueanon] posted by chavenet (50 comments total) 23 users marked this as a favorite (adsbygoogle = window.adsbygoogle || []).push({}); these people are arguably less respectable than thuggish murderersposted by AlbertCalavicci at 4:43 AM on March 2 [4 favorites] What group doesn't have cults associated with it? There were actual warnings about Ziz, not "warnings" as stated in the article. High ambitions for improvement do make people vulnerable to cults, but that might apply to progressivism, too. I don't think there are mainstream political cults, but I might be missing something.posted by Nancy Lebovitz at 4:56 AM on March 2 [3 favorites] I'm fascinated by the phrase "vegan Sith."posted by doctornemo at 5:56 AM on March 2 [8 favorites] I have been so worried that this would be used as yet another pretext to target trans people and so far, despite the current anti-trans politics, that hasn't happened and the focus has been on the Rationalist/cult aspects. Knock on wood for that to continue.posted by kokaku at 6:04 AM on March 2 [19 favorites] My reaction to such stories now is 'how do I raise my boys so that they are inoculated against this sadness'. Right now now all my money is on inculcating a cheerful sense of absurdity. Open to hearing any other ideas!posted by SnowRottie at 6:18 AM on March 2 [19 favorites] I can't think of a more polite way to say it, and I'm not sure why I should bother looking for one: the reason this story will not become part of the anti-trans dialogue is that this story is too long and complicated for anti-trans rhetoricians to process. After a few minutes, they'll just start to look for stories about transwomen using ladies' restrooms again. This is too much effort.posted by kittens for breakfast at 6:18 AM on March 2 [16 favorites] Nancy Lebovitz, above, is correct. Since at least April 2020 according to the Internet Archive, someone going under the pseudonym Apollo Mojave* has been maintaining a website about the Zizians' dangerousness. Here's the Internet Archive's capture from back then but the site is still up if you want to look at current version. *at least I'm assuming it's a pseudonym given that Apollo Mojave was the name of one of the characters in a quadrilogy by Ada Palmer. If you are interested in the question "What if there were nations, each founded by a different TESCREAL** ideology?" then... well, the quadrilogy is about that. **TESCREAL is a acronym referring to a group of loosely related ideologies: Transhumanism, Extropianism, Singularitarianism, Cosmism, Rationalism, Effective altruism, and longtermism"posted by pickles_have_souls at 6:44 AM on March 2 [12 favorites] this story is too long and complicated for anti-trans rhetoricians to process On the contrary, TERFs have been banging on about connections between transness and transhumanism for some time. It'll be the same old grist for the same sad mill.posted by mittens at 6:55 AM on March 2 [3 favorites] I mean the violence part doesn't seem to me to be out there or complicated. It's a group of people unwilling to accept coercion and willing to escalate indefinitely encountering a power structure willing to escalate violent coercion indefinitely. It's just that without some zealous belief, most people are going to accept the coercion at some point and get on with their lives. Open to hearing any other ideas! Honestly, i think the way to avoid this sort of thinking is to know effective means to oppose and resist systems you think are oppressing you rather than giving up and going out in a blaze of glory such as it is.posted by Zalzidrax at 7:12 AM on March 2 [6 favorites] I don't think there are mainstream political cults I'm sure I misunderstand you, but MAGA?posted by ginger.beef at 7:17 AM on March 2 [18 favorites] ...assuming it's a pseudonym given that Apollo Mojave was the name of one of the characters in a quadrilogy by Ada Palmer I would not be entirely surprised if that is not the only connection, because she was up to some shady `running a compound` shit in the 2000`s.posted by Weighted Companion Cube at 7:32 AM on March 2 [4 favorites] I got a bit annoyed with the conflation of the real-world challenges operating AI systems safely and securely (eg: alignment, which is not a problem that needs air quotes) and the batshit crazy thinking that seems to permeate Singularity Worshippers in the tech exec class.posted by simra at 7:33 AM on March 2 [5 favorites] how to raise good kids? have them map everything through a lens of "is this kind to everyone, not just one group or people with power"posted by seanmpuckett at 7:37 AM on March 2 [16 favorites] I think humans form cults pretty often, including militaries, political parties, many active religious groups, and some companies, so alone "cults" seem neither avoidable nor descriptive enough. I agree with kittens about this story sounds too complicated for right-wing rhetoric. Also, vegans are like 3.2% of the population in Europe now, and transgender people are like 0.1% - 0.6% of the population, so both really large diverse groups of people. Zizians#Members lists three people. As alwasy, your real question should be: Where does the magical thinking and money/power show up? Answer: ".. that’s become influential in A.I. research and philanthropy." AI pumpers and AI x-riskers wouold not usually promote random killings, but now they do transform the vast wealth from AI fund raising into delusional frantic media that facilitates further AI fund raising and power grabs by billionaries. We do not care too much that this delusional frantic media causes a few random murders, but more how AI bullshit impacts overall political alignment and resource allocation. Examples: - Europe could suffer a nuclear meltdown in part because of aging nuclear power plants being kept online to fuel AI training. That future seems unavoidable in the US now. - European leaders could inadvertently leak tactical details in the Ukraine war through collaboration with American AI companies, especially via Chat Control. I suppose the Zizians might help discredit AI bullshit, but really I'd think that work lies elsewhere.posted by jeffburdges at 7:44 AM on March 2 [4 favorites] how to raise good kids? have them map everything through a lens of "is this kind to everyone, not just one group or people with power" And crucially, "everyone" must mean "everyone who is alive right now, not some mythical 'everyone' comprised of fictional people we believe will exist in the future, and whose well-being supercedes that of the real people who are really alive today."posted by kittens for breakfast at 7:55 AM on March 2 [17 favorites] ginger.beef Yes, you did misunderstand me, and I wasn't ideally clear. I was thinking of moderate Democrats and Republicans. MAGA is radical, not mainstream. As for raising kids who aren't vulnerable to cults, cults recruit people who are desperate and/or unmoored. Poor people, people who's lost a spouse, people who've just moved, which includes college students.. This means that the good will and/or good sense needs to be stable under pressure.posted by Nancy Lebovitz at 8:12 AM on March 2 [3 favorites] >MAGA is radical, not mainstream MAGA is the movement that supports the literal president who won the popular vote and for some reason has an above 30% approval ratingposted by fomhar at 8:27 AM on March 2 [12 favorites] I would not be entirely surprised if that is not the only connection, because she was up to some shady `running a compound` shit in the 2000`s. Wait, Palmer or Mojave?posted by GenjiandProust at 8:29 AM on March 2 [8 favorites] On the contrary, TERFs have been banging on about connections between transness and transhumanism for some time. Periodic reminder that to be a TERF you have to be from the Radical Feminism region of Ideology. If you're not from there and hate trans people, you're just a sparkling bigot.posted by GCU Sweet and Full of Grace at 9:11 AM on March 2 [30 favorites] Humans evolved in personality cults and most cultures contain junkyards of their failed prophecies (which is how they persist and why they have extensive pedigrees). Though cult leaders are more studied than followers they both go hand in hand, or lock and key. Cult authority is any narcissist finding validation through a following, while the followers are seeking acceptance, with no particular background having primed them for this. The follower's problem is never solved but actually compounded after recruitment. The nightmare of seeking acceptance by threat of removal has only begun for them. They can murder because they take on a gang persona, often having never had a sense of individuality. One is in a cult when words are used to teach fanatical responsibility and never again to describe reality. Found this gem in the internet archive link above from pickles_have_souls: In the mind of a Zizian, liberalism means the same thing it does for a Communist or Nazi: an opportunity for decadence, vice, and corruption. Because we "already know" the correct moral policy is a ruthlessly enforced altruism towards all or almost all living creatures; supporting liberalism is to participate in crime on a mass scale. They believe that now is the time to [betray our corrupt society] and establish a vegan hegemony.posted by Brian B. at 9:25 AM on March 2 [5 favorites] Why So Slow? discusses research that having been responsible for taking care of younger children is a strong marker for not being vulnerable to — I think it’s impulsive violence the studies were about, but despair in the large. Might be correlation obvs. Now I’m curious about how care experience affects vulnerability to TESCREAL, etc.posted by clew at 10:11 AM on March 2 [2 favorites] Been following this one lately and it's easily one of the most cyberpunk stories I've heard in years. Unfortunately their crimes are just garden variety stupid, sad and really make it seem these folks aren't smart in any sort of way at allposted by bannana at 10:18 AM on March 2 [5 favorites] I don't think there are mainstream political cults The main religious driver of the MAGA operation is The New Apostolic Reformation, (plus Catholic integralism and some Orthodox elements - hence all the love for Russia), see Texas Observer for former The New Apostolic Reformation Wants God's Government Back Very mainstream and the main reason Trump got in.posted by unearthed at 10:56 AM on March 2 [8 favorites] But when you poke around a little bit--when you read about how “Rationalism” plays out in its communities in practice--the “movement” starts to feel a little less STEM and a lot more New Age: A suspect program for self-improvement, with existential stakes, a strong emphasis on self-experimentation, and a deleterious commitment to openness. In this sense its predecessors are not really the original enlightenment rationalists, but the dubious touchstones of ‘60s-hangover California--Scientology and Dianetics, Werner Erhard and est, the Symbionese Liberation Army and the Manson Family. I had been trying for years to figure out why the "Rationalists" annoy me so much, and this made me finally realize that they remind me of a former coworker who was raised in est and who could go from being a normal person, if a bit sheltered and self-centered, to saying the most batshit stuff so fast.posted by hydropsyche at 11:01 AM on March 2 [9 favorites] From the Wired piece, the one moment I laughed aloud: He gave off the vibe of a private investigator, and when I introduced myself he confirmed as much, declining to give his name. “You can call me … Cliff,” he said, unconvincingly. chavenet, thank you for posting this; edifying and sad.posted by brainwane at 12:07 PM on March 2 [3 favorites] "Why So Slow? discusses research that having been responsible for taking care of younger children is a strong marker for not being vulnerable to — I think it’s impulsive violence the studies were about, but despair in the large. " Has anyone done any similar research on owning pets? They've saved a lot of people.posted by aleph at 12:24 PM on March 2 [2 favorites] Every generation gets the sci-fi cult they deserve... scientology, est, rationalism...posted by kaibutsu at 12:25 PM on March 2 [2 favorites] If only the older ones wouldn't keep coming back as well!posted by aleph at 1:11 PM on March 2 [4 favorites] One of members was a graduate of a local university (to me) and made the news here.posted by Ashwagandha at 2:34 PM on March 2 [2 favorites] A few thoughts: 1. Rationalists seem like a group of people who are a) fairly smart, b) mostly trained in the applied sciences, and c) usually not trained in the sort of thinking one gets in a Humanities curriculum. When they take on the Philosophy, it's a bit like Sovereign Citizens taking on law or Alternative Medicine people taking on medicine -- you get a distorted form of the thing with no real understanding of the structure that underlies the practice. This is one reason why their manifestos are full of impenetrable jargon -- that's the way that a lot Philosophy appears to the casual reader. As a bonus, it makes it almost impossible to argue with, because you can always retreat to a position of "you don't understand my words." Also, if your credo requires frequent references to popular culture, you are likely not that rigorous a thinker. 2. This is an environment that attracts a lot of fairly bright people, many of whom have caught the brass ring of a "good job in tech" but in an environment where out of control rent, degrading infrastructure, and precarious employment undercuts their sense of self worth and stability. By the odds, some of them will be dealing with any number of other issues -- mental illness, childhood trauma, gender issues, neurodiversity, etc -- which can make them even more vulnerable, especially if they lack a social safety net. 3. In this environment, development of cult thinking seems almost certain, once you have a large enough population and enough time. Grifters looking for donations to "stop rogue AI" or other grand disasters sow seeds that grow all sorts of unintended damage. There is also a strong strain of Libertarian delusion in the group, which further destabilizes people. "The strong individual" is a great idea if you ar'''
