 to show me things that are LESS relevant to my life? Because privacy? Because the information they collect about you isn't just used for advertisements? Because the same people that collect this information are using it to destroy democracy by controlling what we see? Because Musk,... [more] posted by RonButNotStupid to MetaFilter on Feb 26 at 5:27 AM 34 users marked this as a favorite This comes immediately after, the same day it publishes a true blockbuster report on Musk's $38 Billion he's gotten from US taxpayers. No reason to believe we'll be seeing reporting like this from the Washington Post again. [view] posted by kmartino to MetaFilter on Feb 26 at 10:42 AM 32 users marked this as a favorite Which individual rights Jeff? WHOSE INDIVIDUAL RIGHTS JEFF? [Goose chasing man meme] (Saw this elsewhere, not original to me) [view] posted by Wretch729 to MetaFilter on Feb 26 at 10:10 AM 31 users marked this as a favorite imho on the scale of billionaire hobbies it's probably one of the least destructive to others so on balance I support it as harm reduction, doubly so if it ends up killing him prematurely [view] posted by BungaDunga to MetaFilter on Mar 3 at 10:04 AM 31 users marked this as a favorite On the contrary, TERFs have been banging on about connections between transness and transhumanism for some time. Periodic reminder that to be a TERF you have to be from the Radical Feminism region of Ideology. If you're not from there and hate trans people, you're just a sparkling bigot. [view] posted by GCU Sweet and Full of Grace to MetaFilter on Mar 2 at 9:11 AM 30 users marked this as a favorite Why would I want to change the ad algorithm to show me things that are LESS relevant to my life? The way I see it, ads aren't just placed to sell you things, but to manipulate you in many ways, including politically. People in different demographics will have statistical vulnerabilities to specific manipulation strategies. Cutting off... [more] posted by JHarris to MetaFilter on Feb 26 at 5:24 AM 30 users marked this as a favorite I have been rickroaned! [view] posted by Calvin and the Duplicators to MetaFilter on Mar 4 at 4:55 PM 30 users marked this as a favorite Although we do not know yet, the most likely cause seems to be complications from her recent liver transplant. Not that it's really our business, but given her young age, it might be comforting to know there is a plausible explanation beyond the usual bad ways former child actors shuffle off this mortal coil. [view] posted by DirtyOldTown to MetaFilter on Feb 26 at 11:56 AM 29 users marked this as a favorite I'm gonna put my bet on carbon monoxide poisoning. [view] posted by Barry Boterman to MetaFilter on Feb 27 at 2:19 AM 29 users marked this as a favorite Finally! The hearty defense of exploitative economic policy that our world desperately needs! Perhaps the phrase is actually a response to the system of exploiting the global working class to create a handful of obscenely wealthy men who are currently leading t'''
