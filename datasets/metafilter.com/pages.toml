description = "The Striking Buildings of Zaha Hadid. 'The Iraqi-British Zaha Hadid became famous for her intensely futuristic architecture characterized by curving façades, sharp angles, and severe materials..."
full_description = '''Soft, Strength, Structure March 3, 2025 8:03 AM Subscribe The Striking Buildings of Zaha Hadid. "The Iraqi-British Zaha Hadid became famous for her intensely futuristic architecture characterized by curving façades, sharp angles, and severe materials such as concrete and steel. The structures she designed successfully accomplished what mystifies so many when they observe great architecture: She took the strongest materials in the world and manipulated them to form objects that appear soft and sturdy at the same time."Over the last two decades, her work has been honored by a long list of awards: In 2004 she was the first woman to be awarded the Pritzker Prize; in 2010 and 2011 she received the Stirling Prize, a British decoration for excellence in architecture; in 2014 her Heydar Aliyev Cultural Centre, like an undulating sheet of graph paper, won the Design Museum Design of the Year Award; and in 2016 she became the first woman to win the RIBA Gold Medal. Hadid’s projects, many of which transform depending on the viewer’s perspective, turn architectural convention on its head."(ungated link)Interested in more? There's a book. posted by storybored (23 comments total) 13 users marked this as a favorite (adsbygoogle = window.adsbygoogle || []).push({}); book direct link [zaha-hadid-design] previously (thank you, storybored)posted by HearHere at 8:48 AM on March 3 Oh, my goodness, what beautiful work. I was somehow unfamiliar with Hadid's work. Thank you for the previously link, HearHere - there's some good stuff following the previously previously. I'm looking forward to diving into her work even more. Thank you so much for sharing this, storybored!posted by kristi at 9:37 AM on March 3 [1 favorite] Zaha Hadid defends Qatar World Cup role following migrant worker deaths "I have nothing to do with the workers," said Hadid. "I think that's an issue the government – if there's a problem – should pick up. Hopefully, these things will be resolved." Asked if she was concerned, Hadid added: "Yes, but I'm more concerned about the deaths in Iraq as well, so what do I do about that? I'm not taking it lightly but I think it's for the government to look to take care of. It's not my duty as an architect to look at it. "I cannot do anything about it because I have no power to do anything about it. I think it's a problem anywhere in the world. But, as I said, I think there are discrepancies all over the world."posted by MisantropicPainforest at 9:47 AM on March 3 [2 favorites] Zaha Hadid is everything that's wrong with the profession of architecture. Her building are bold, striking, and award-winning, according to other architects. They are also impractical, inaccessible, and unaffordable. If you think of a building as a work of art, then you'll love this. If you think of a buiilding as a physical object that serves people's needs, that has utility, that is functional, then you'll hate this.posted by happyinmotion at 10:38 AM on March 3 [6 favorites] Many Cincinnatian's were understandably surprised in 1997 when, after a lengthy selection process - first narrowed to 97, then to 12, and eventually three finalists: Daniel Libeskind, Bernard Tschumi, and Zaha Hadid - Hadid was chosen to design our first purpose-built Contemporary Arts Center. Though Hadid had been the subject of adulation, study and controversy, and international critical acclaim in her field, she had by that time only completed three freestanding buildings - and had not yet discovered the universal fame that would follow successive years of groundbreaking designs, acclaim and awards beginning in 2004. As a largely untested architect, a woman, and an Arabic Muslim, Hadid had thus far not found the construction world easy to enter. But after a 2001 groundbreaking, our renowned building opened to rave reviews on May 31, 2003 - Hadid’s first American building, and the first American museum building designed by a woman. Just one year later, In 2004, she became the first female recipient of the Pritzker Architecture Prize, which is the equivalent to the Nobel Prize for Architecture. In 2008, she was listed as one of Forbes Magazine’s “100 Most Powerful Women,” and in 2010, Time Magazine named her one of the “100 Most Influential People in the World.” She received the Stirling Prize in 2010 and 2011, and in 2012, she was made a Dame by Queen Elizabeth II for services to architecture. In 2016, she became the first woman to be individually awarded the Royal Gold Medal from the Royal Institute of British Architects.posted by thecincinnatikid at 11:01 AM on March 3 [2 favorites] Meant to add but edit timed out: Hadid's first US masterpiece joins an impressive and, to many, surprising list of Cincinnati buildings by world famous architects - many thanks to the aggressive vision of the University of Cincinnati's College of Design, Architecture, Art, and Planning (DAAP) program - including Frank Gehry, Michael Graves, Peter Eisenman, David Childs, Bernard Tschumi, Daniel Libeskind and Thom Mayne.posted by thecincinnatikid at 11:18 AM on March 3 @thecincinnatikid what do you think personally of the her Cincinnati museum? I'm curious because I've not been inside any of her buildings.posted by storybored at 11:20 AM on March 3 [1 favorite] I'm a fan and think it's impressive, especially given it's diminutive footprint and a relatively lean budget in comparison with her most well known projects. Perhaps most interesting is her vision of floating concrete and aluminum blocks and glass, and her "urban carpet" that seemingly draws the exterior sidewalks into the compact multi-story lobby and up the staircase to the galleries. Some might find the interior cold but it definitely invites a lot of visual discovery as you move through the building.posted by thecincinnatikid at 11:41 AM on March 3 [4 favorites] Zaha Hadid is everything that's wrong with the profession of architecture.posted by thecincinnatikid at 11:42 AM on March 3 [1 favorite] Zaha Hadid is everything that's wrong with the profession of architecture. Her building are bold, striking, and award-winning, according to other architects. I, for one, wonder why an architect of such prominence, who presumably has an abundance of clients, wouldn't refuse to work for corrupt savages in commemorating the architect of a savage and corrupt regime. But I guess I'm probably missing the point.posted by BReed at 11:52 AM on March 3 I was a huge fan of Hadid when I was a student, and spent hours and hours learning to understand her methods and fantastical drawing/painting style. I still love presenting her work to my young Arab students, where specially the women love seeing a role model who looks like them. Because I teach engineers, not architects, I also still enjoy explaining how she was a pioneer when it comes to integration of technology and art at every level of the proces, and how that developed over time. BUT, and you knew a BUT was coming in here, I have become more and more disappointed with her work during the years. Not as disappointed as I am with Daniel Libeskind, because she still had a sort of backbone albeit not exactly moral values (as the quote about Qatar shows). IMO, all the "starchitects" have abandoned all interest in the great challenges of our time, except to some degree Richard Rogers and Renzo Piano. And that approach to the world and to us, its inhabitants, shows in how the buildings are designed. We are not important. Also her manager and now the head of her still existing office is a despicable tech bro.posted by mumimor at 11:59 AM on March 3 [6 favorites] As a semi-former architect, her work, and the work of other prominent designers, are dead ends as far as the profession goes. The only mark these people leave are their own designs. Prior to the postmodern era, the profession of architecture had a value system, and a nominally common idea of what a good building is. You could learn how to be a competent designer. But once the modernists figured out that they weren't going to change the world, it was every designer for themself. What doesn't come across in most discussions about star architects, is the grueling toil of the architects of record. They're the local team who do the construction documents, and figure everything that's needed to get the building out of the ground and in compliance with all the codes and ordinances. Among these folks, there's a lot of concern about the issues of the day, and a lot of advocacy to the client for doing the right thing.posted by Carmody'sPrize at 2:00 PM on March 3 [4 favorites] There was a TV documentary about Hadid's first building, the fire station in Germany, which I saw long ago. Unusually for an architecture programme, there was someone involved who was an expert in the way the building was to be used. An actual fireman was going through it, pointing out places where it was a terrible fire station - for example pointing out the sharp corner of a railing where, rushing to the fire engine to go out on a call, you would run into it and do yourself an injury. That informed my opinion of Hadid's buildings then, and I have heard nothing since to change mind.posted by vincebowdren at 2:01 PM on March 3 [3 favorites] I don't think she's necessarily wrong about the situation in Qatar - if a soccer stadium is going to be built there, how do you prevent the deaths of migrant workers regardless of who the architect is? That feels like a sensationalistic thing where the press had a famous person to point at. Hadid didn't make Qatar build a soccer stadium. Don't let the IOC or FIFA award sporting events to countries with shoddy worker protection regulations if you want to minimize that problem. IMO, all the "starchitects" have abandoned all interest in the great challenges of our time Given their track record, that's probably good? I agree that Hadid did a lot of the same kind of work other starchitects do, and those aren't really doing much for people - they're showcase buildings for clients that wanted showcase buildings. I'd also be interested in knowing how her more "functional" buildings actually work - like is the BMW factory functional? Are the residential buildings and office towers she did pleasant to live or work in? How large a part did her local Architect of Record partners play in the design or keeping the guardrails up on costs and functionality? Just going through her more complete portfolio, there's a decent number of fairly quotidian projects for someone who has a reputation of doing wild stuff, and I wonder about the story behind those. On preview: An actual fireman was going through it, pointing out places where it was a terrible fire station Thank you! Not surprising though - that's on a commercial campus (like, not a municipal fire station) for a high-end furniture design company that tries to fill their campus with similar buildings. They were not trying to impress firemen when they built that.posted by LionIndex at 2:12 PM on March 3 I don't think she's necessarily wrong about the situation in Qatar - if a soccer stadium is going to be built there, how do you prevent the deaths of migrant workers regardless of who the architect is? You…boycott them? This isn’t some person going to Walmart, this was one of the most famous and powerful architects in the world designing builds that would be built by what amounts to slave labor.posted by MisantropicPainforest at 2:26 PM on March 3 [2 favorites] Thanks, storybored -- I love Hadid's work. Years ago, I did a road trip to Lansing to visit her Broad Art Museum just as it opened. It was breathtaking at every turn. Each step revealed something new, with every line and detail immaculately considered. It's all too rare to be in a space like that on this earth. It was transcendent, with hardly anything there at all, just the simplest of shapes put together by a very deft hand. It astonished me and refreshed my spirit.posted by Capt. Renault at 5:07 PM on March 3 [2 favorites] The Broad Museum is beautiful. However, according to the staff I’ve spoken with, it’s far too hard to hang the art, doesn’t have enough storage and requires an annoying amount of time to schlep art to the museum, and lacks the staging spaces needed to make event setup/breakdown seamless. The Broad opened 5 years after the New Museum of Contemporary Art, which is very staff-focused and received a good bit of fanfare for its functionality. There’s really no excuse for the Broad’s shortcomings.posted by Headfullofair at 6:36 PM on March 3 [1 favorite] Ask any museum worker in a building designed by a star architect - it probably leaks like crazy, has no accessible loading dock, or makes you come up with crazy new systems just to hang a painting. Not enough storage is a given no matter what. A former director at my museum was trying to get a second building built and had settled on Hadid for many good reasons - our current building was made by a star architect and Pritzker prize winner so it would have been cool to get the next building done by the first woman to have won the prize. But the price tag was big, donations were slow, and then the recession hit and it was all quietly dropped.posted by PussKillian at 6:43 PM on March 3 [3 favorites] If we are going to have “star architects” by definition most of their clients are going to be oligarchs. This has been true since the time of kings. I do like the idea of having designers that push new possibilities into architecture - I design (mostly) practical buildings and sometimes you want to see something that fundamentally makes no sense. A house or art barn for someone fantastically wealthy seems, in my opinion, a fine way to experiment - better than a library or public school. The only way we are to be rid of starchitects is to be rid first of the rich. Have at it, people.posted by q*ben at 10:34 PM on March 3 You…boycott them? This isn’t some person going to Walmart, this was one of the most famous and powerful architects in the world designing builds that would be built by what amounts to slave labor. Hadid designed one stadium out of the eight built for the 2022 World Cup. Boycotting would keep her hands clean, but she did not have the "power" or influence to instigate a worldwide A/E industry boycott that would prevent the stadiums from being built. The workers basically got a death sentence as soon as FIFA awarded Qatar the Cup.posted by LionIndex at 10:37 PM on March 3 They were not trying to impress firemen when they built that. They sure weren't, and they didn't. It's no longer used as a fire station.posted by GeorgeBickham at 12:38 AM on March 4 [1 favorite] The much-missed Michael Sorkin's 250 Things an Architect Should Know is a humane and restorative antidote to starchitecture.posted by GeorgeBickham at 12:43 AM on March 4 [2 favorites] I work down the street from the museum in Cincinnati. Overall I think it uses is small foot print very well. The space is very inviting to enter and the g'''
