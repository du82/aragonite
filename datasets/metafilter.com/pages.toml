description = "For his work on more than 150 Gold and Platnium records, audio legend Al Schmitt won 22 Grammy Awards - more than any other engineer or mixer. In 2014, he became the first engineer honored with a..."
full_description = '''Al Schmitt March 2, 2025 5:49 PM Subscribe For his work on more than 150 Gold and Platnium records, audio legend Al Schmitt won 22 Grammy Awards - more than any other engineer or mixer. In 2014, he became the first engineer honored with a star on the Hollywood Walk of Fame. He was beloved of his colleagues. In short, he was the GOAT.The Art of Recording a Big Band documented his recording of the Chris Walden Big Band's Full-on!. Chapter 1: Introduction Chapter 2: Miking the Instruments Chapter 3: Soundcheck Chapter 4: Setting Levels Chapter 5: Recording a Big Band & The Mix Session Ended up sounding pretty good. A sampler from just his Grammy Award winning work: George Benson - "This Masquerade" (1976) Steely Dan - "FM (No Static At All)" (1978) Toto - "Rosanna" (1982) Diana Krall - "The Night We Called It A Day" (2001) And as a bonus: Paul Anka covering Van Halen's "Jump". (No, really. It's good.) His memoir was Al Schmitt on the Record: The Magic Behind the Music. posted by Lemkin (4 comments total) 9 users marked this as a favorite (adsbygoogle = window.adsbygoogle || []).push({}); I think he could have gone further optimizing the EQ and microphone position for the cuica part in the intro to Steely Dan's "FM." It sounds too much like someone pulling a straw in and out of the lid of a takeaway soda cup.posted by Larry David Syndrome at 6:34 PM on March 2 [1 favorite] I don't know a lot about audio engineering, but that's a great interview - so many specifics. It's so interesting to know he started at age 7. Nepotism is a problem, but there's a flipside of how great it can be to get to learn about a craft from an early age. (Here's hoping, of course, that he always wanted to continue, and didn't feel pressured into it ... but it sure sounds like he still really enjoys it.) I wish everyone had the opportunity to learn real, creative crafts from a young age, to whatever extent they want to. Anyway. I love some of these albums, and I'm glad to know more about Al Schmitt. Thanks so much for posting this great collection of links, Lemkin - and for all the wonderful things you share with us here on MetaFilter.posted by kristi at 6:44 PM on March 2 [2 favorites] Whenever someone asks "what album should I listen to in order to test out a new system" my answer is "anything Al Schmitt produced". Heck, even back in '68 he had the magic - check out "Crown of Creation" by Jefferson Airplane.posted by milnak at 7:34 PM on March 2 [1 favorite] The Eldar Djangirov album "Eldar" really opened me up to how full a great jazz recording can be. Al Schmitt mixed it, but they also had the luxury of recording it at the great Sony Music Studios, taking the time out to get everything right.posted by mathjus at 7:54 AM on March 3 [1 favorite] « Older NYT review of MeFi's own Omar El Akkad's New Book | bighorn beat brown bear but busted my bracket Newer » You are not currently logged in. Log in or create a new account to post comments. Related Posts Bill Cosby Talks To Kids About Drugs February 14, 2025 Canciones De Mi Padre January 16, 2015 Sound on Sound's "Classic Tracks" August 29, 2012 (NSC) - RIP Ron Murphy, master vinyl cutter. February 13, 2008 Me and my 424 April 3, 2006 (adsbygoogle = window.adsbygoogle || []).push({}); Tags art music recording production engineering grammy Share Facebook'''
