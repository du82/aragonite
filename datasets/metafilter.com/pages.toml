title = "How 3D models are becoming a game changer for vision-impaired students | MetaFilter"
description = "How 3D models are becoming a game changer for vision-impaired students. 3D printing technology is revolutionising the way that blind and low-vision students learn about the world around them."
full_description = '''How 3D models are becoming a game changer for vision-impaired students March 1, 2025 12:37 AM Subscribe How 3D models are becoming a game changer for vision-impaired students. 3D printing technology is revolutionising the way that blind and low-vision students learn about the world around them. posted by chariot pulled by cassowaries (9 comments total) 12 users marked this as a favorite (adsbygoogle = window.adsbygoogle || []).push({}); This is really cool, and a really good application of 3D printing... I've always loved coming across the bronze or brass 3D sculptures at museums and historically important places. What is included and not in the model, the lighter patina where people have focused their touch, the cool feel of the smooth metal. It makes me wonder if there are some good resources on how to scale details and texture for touch understanding.posted by rambling wanderlust at 6:04 AM on March 1 [2 favorites] This is great! I also love how the project is involving people with low or no vision. It's interesting to hear the difference 3d models make vs 2d modelsposted by Higherfasterforwards at 7:07 AM on March 1 I work at a botanic garden. At a recent staff meeting, herbarium staff shared some new 3D models of herbarium specimens. Super cool to interact with the models as well as learn about how they are created. Everyone who touched them was impressed. Thank you for sharing this article. Got me to think about accessibility for vision-impaired people and how there are so many amazing applications for 3D printing.posted by sciencegeek at 7:15 AM on March 1 This is just great. I'm so unfamiliar with 3D printing that this surprised me: In the past, hand-crafted models were often painstakingly made by teachers, meaning supplies of aids were limited and models varied across different schools and educational settings. Shared computer files and the ability to print a 3D model at the touch of a button have eliminated some of these difficulties. I was imagining individual teachers crafting individual items for their individual classrooms. It didn't occur to me how easily the models can be shared, and replicated in whichever classrooms they'll benefit. Also, these two little lines: The school says the 3D models elicit joy in the students and spark their imagination. Things that elicit joy in students elicit joy in me. YAY. The models ... can also help enhance learning for sighted students, leading to a more inclusive classroom. This needs to be said over and over and over: so many things that were created to help folks with impairments also benefit folks without them. I do not have visual impairments but I would love a chance to touch and hold models of things I'm studying. I'm sharing this with a friend who enjoys hearing about technologies that help people as much as I do. Thank you for all the great news you bring to MetaFilter, chariot pulled by cassowaries! I love your posts, and I appreciate you.posted by kristi at 11:06 AM on March 1 [1 favorite] I had direct experience of this when working an accessibility conference in Florida a few years back. UltiMaker, who made high-end 3d printers, would always offer to ship one to our booth at any conference, anywhere in the world. They would also include a whole load of tactile models from their library. The star of the show was always the lobster: articulated, life-size and just as pointy as the real thing. I'll never forget the women who, when handed the lobster by a colleague, was like "I'd never eat at Red Lobster if I knew they were like this!" Aside from 3d printing, thermal-foamed capsule paper can be useful for making tactile diagrams or printing Braille. The TactPlus printer had just been launched at the same show that we had the lobster. I'm pleased to note that the price of this technology has come down to something approaching affordable. As an assistive technology charity, we knew that there were some vision-assistive technologies we couldn't (and shouldn't) claim to help with. Braille, for example, was right out: a typical 3d printer can't reproduce the characters at the right size.posted by scruss at 11:52 AM on March 1 [3 favorites] Braille, for example, was right out: a typical 3d printer can't reproduce the characters at the right size. You might want to take a closer look at the Bambu Labs X1 Carbon. With the 0.2mm nozzle, it is capable of reliably reproducing incredibly small details, even using basic PLA. It's certainly not the cheapest option out there, but I've been putting mine through the paces over the last month or so, and after building several 3D printers from scratch, I am just plain impressed, through and through, with how easy and approachable this printer is, how "set it and forget it" it makes 3D printing to the average consumer. It's close to magic.posted by xedrik at 2:19 PM on March 1 [1 favorite] The X1 didn't exist when I was with Makers Making Change. I don't doubt that it can produce extreme detail, but we had feedback that — no matter how fine the nozzle — the tactile feel of 3d printed Braille or diagrams wasn't pleasant. I know that the Bambu printers are fast, but they'd still be orders of magnitude slower (and more faff) than a device like the TactPlus.posted by scruss at 10:51 AM on March 2 The models ... can also help enhance learning for sighted students, leading to a more inclusive classroom. As a math educator, I concur with this. Whenever I'm doing anything in solid geometry, a physical model is absolutely useful, not just for those who rely on tactile sensations, but also because physical models are more comprehensible entirely --- you can pick them up, move them around, see how much liquid they displace to find their volume, and all sorts of things which are completely impossible for a static picture and doable but clunky for a computerized 3d model.posted by jackbishop at 11:06 AM on March 2 [2 favorites] → see how much liquid they displace to find their volume 3d printed models would not be good for this, because they're typically mostly hollow. They're not even particularly good for finding centre of mass because the fill may not be evenly spreadposted by scruss at 8:51 AM on March 4 « Older LEAD PIPE GO | Have you ever done anything successful on your own... Newer » (adsbygoogle = window.adsbygoogle || []).push({}); You are not currently logged in. Log in or create a new account to post comments. Related Posts Aki Inomata's 3D printed tiny cities on shells for... August 3, 2013 Global Accessibility Awareness Day May 9, 2013 123D Catch = My mind blown March 7, 2013 PRINTER IS JAMMED. OPEN DOOR, CLEAR FOOD, THEN... January 30, 2013 3D-Printed "Magic Arms" August 3, 2012 (adsbygoogle = window.adsbygoogle || []).push({}); Tags Blind LowVision 3DPrinting Share Facebook'''
