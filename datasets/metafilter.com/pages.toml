title = "Don Ellis | MetaFilter"
description = "'Don Ellis led one of the most colorful big bands in the history of jazz from 1966 until 1978. Ellis's big band was distinguished by its unusual instrumentation, the exploration of uneven or odd..."
full_description = '''Don Ellis March 2, 2025 6:28 AM Subscribe "Don Ellis led one of the most colorful big bands in the history of jazz from 1966 until 1978. Ellis's big band was distinguished by its unusual instrumentation, the exploration of uneven or odd time signatures, its occasional humor, and its openness to using rock rhythms and electronics. His orchestra achieved enormous popular appeal at a time when the influence of big band music was noticeably fading. Ellis applied his knowledge of the music of non-Western cultures to the rhythmic language of jazz. He was one of the first to have accomplished such a fusion of ideas, and his work stands as a memorial reflecting a significant stage in the evolution of jazz."Where to even start? "Indian Lady", 1968, Tanglewood "Bulgarian Bulge", 1969, Concord Jazz Festival. "Sweet Georgia Brown", 1976, Shirley MacLaine TV special [CW: hoofing, razzle dazzle] posted by Lemkin (6 comments total) 19 users marked this as a favorite (adsbygoogle = window.adsbygoogle || []).push({}); This is killer. Reminded me to recommend the excellent recent Tiny Desk concert by Igmar Thomas's Revive Big Band, which takes the genre into a more hip-hop inflected direction.posted by HeroZero at 7:35 AM on March 2 [4 favorites] there are very few musical genres that would not be improved by a big horn sectionposted by seanmpuckett at 7:40 AM on March 2 [5 favorites] Also notable as one of a few folks to play a four valve trumpet. The fourth valve allowed the instrument to lower any note by a quarter tone. A lot of the music he was integrating into jazz and big band was not based on the 12 note western scale so this fourth valve allowed him to hit notes in several non-western scales. Sadly, there aren't a ton of examples of him doing that but you can hear a bit of it here.posted by Siempre La Luna at 12:33 PM on March 2 [4 favorites] I played in a jazz combo in college run by Sam Falzone, who was a fantastic tenor sax player who played with Don Ellis (and wrote one of the songs ion the album "Soaring"). This is a great performance from the Ed Sullivan show. It starts off a bit in Herb Alpert territory, but then goes into outer space. The band includes Jay Graydon on guitar. He played the guitar solo on Steely Dan's "Peg." Other notable Don Ellis things: He did the score for "The French Connection", starring Gene Hackman. I don't know if any of the trumpet players aside from him used the same four-valve trumpet, but Don Ellis had some of them play a quarter tone off in the opening theme. The song "Whiplash" from the movie "Whiplash" is the first track on Don Ellis's album, "Soaring". (it was written by Hank Levy).posted by jonathanhughes at 1:25 PM on March 2 [3 favorites] Early in 1968, an hour after our ingesting acid, my best jazz buddy lit scented candles, turned off the lights, and put Electric Bath on the turntable. It immediately rocketed my 23-year-old soul into hallucinogenic heaven, teasing my opening mind with sudden realization of the true nature of music. He then, rascally for sure, put on Charles Ivesʻs quarter-tone music for two pianos. 57 years later, here I am, still inside the ever-branching tunnels of that infinite rabbit hole, still happily chasing after Mr. Ellis, Mr. Ives, and their many fellow senseis.posted by Droll Lord at 2:43 PM on March 2 [3 favorites] I cannot tell you how many times I've listened to Live At Monterrey, which goes very deep on just the truly wildest time signatures (see: 33 222 1 222, the best jam in 19/8, but maybe also the only one), and also gets into a little bit of the microtonal stuff Siempre La Luna mentioned with his extra trumpet valve- and also has him trying to explain what's going on to the crowd, which is helpful if dusty corners of music theory are not your thing.posted by dogfilter at 2:59 PM on March 2 [3 favorites] « Older Just one more sprite bro | Finding groups by their agreement Newer » (adsbygoogle = window.adsbygoogle || []).push({}); You are not currently logged in. Log in or create a new account to post comments. Related Posts I don't even mention Steamed Hams once in this post July 2, 2018 Burn each match just so, and arrange in a diamond. November 22, 2017 Carla Bley's "Escalator Over The Hill" September 11, 2010 There's more to it than "omit the instrumental part" November 2, 2009 I love "The Apartment." June 18, 2000 (adsbygoogle = window.adsbygoogle || []).push({}); Tags art music jazz bigband composition improvisation arrangement shirleymaclaine Share Facebook'''
