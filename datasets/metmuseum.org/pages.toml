full_description = "The Museum offers a variety of programs designed for K–12 educators that explore objects in The Met collection, interdisciplinary curriculum integration, and methods for teaching with works of art. Workshops Engage curriculum topics and skills through experiences with works of art. Learn more about print and online resources for K–12 educators and develop a lesson plan tailored to your students' unique needs. See upcoming workshops below and register online. Educator Workshop—Power to the People: Mexican Prints at the Vanguard Saturday, October 26, 2024, 10 am–1 pm Educator Workshop—Inspired by Ancient Egypt: Black Artists and Ancient Egypt Saturday, January 11, 2025, 10 am–1 pm Educator Workshop—Thinking Like an Architect: Harnessing the Design Process for Classroom Learning Saturday, March 8, 2025, 10 am–1 pm Educator Workshop—Invented Narratives: Chinoiserie, Women, and the Porcelain Imaginary Saturday, April 5, 2025, 10 am–1 pm Virtual Workshop Series: Exploring Sargent’s Time in Paris Wednesday, April 30, May 14, May 28, 2025, 4–5:30 pm Educator Event—Chancellor’s Day Connecting Collections Summer Institute Workshops by Request Are you interested in scheduling a workshop for a group of active K–12 educators? We can design a program supporting your specific needs. After we receive your application, Museum staff will contact you to gather more information about the group and confirm the booking. Download the application (PDF). Summer Educator Institutes Summer institutes provide an opportunity to explore a topic over an extended period of time. Learn about upcoming institutes and register online. The Met Professional Learning Community Join our professional learning community and discover how vital art is to student learning. These programs are available to active K–12 educators only. The Museum reserves the right to cancel an educator program at any time due to insufficient enrollment. For further information, please contact K–12 Educator Programs at 212-570-3985 or educatorprograms@metmuseum.org."
