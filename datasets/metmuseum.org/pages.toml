["https://metmuseum.org/about-the-met/conservation-and-scientific-research/paper-conservation"]
title = "Paper Conservation | The Metropolitan Museum of Art"
description = "The Paper Conservation Department is dedicated to the preservation, technical analysis, and research of works of art from all the Museum's curatorial departments."
full_description = "Paper Conservation The Paper Conservation Department, which is the primary division of the Sherman Fairchild Center for Works on Paper and Photographic Conservation, is dedicated to the preservation, technical analysis, and research of works of art from all the Museum’s curatorial departments to contribute to the scholarship of the collection and make objects available for exhibition, education, and study. These objects include historic, modern, and contemporary material, among which are: drawings in all media and techniques (such as chalk, charcoal, pen and ink, watercolor, and pastel), prints (such as etchings, engravings, and lithographs), Western illuminated manuscripts on parchment and paper, Indian and Islamic paintings and albums, ivory portrait miniatures, palm leaf manuscripts, papyrus, and composite objects, among which are paper-based sculpture, decorative arts objects, and ephemera. Works on paper, parchment and related natural and synthetic materials are among the most sensitive objects in The Met’s collection due to the physical and chemical nature of their substrates and the variety of organic and inorganic media comprising their design layer. To ensure their preservation, strict exhibition and storage requirements must be maintained. However, they are always on view throughout the Museum. These protocols, established by the paper conservation staff and Museum scientists, include limited display durations, periodic rotation of works on display, restrictions on travel, low light levels, storage in darkness, material specific environmental conditions and methodical handling procedures. History of the Department The paper conservation department came into existence in the 1950s to give works on paper in the Museum’s collection the specialized expertise it required. In 2001 the department moved to a state of the art facility that matched with professional evolution of the field such that the Paper Conservation Department’s conservators are highly educated professionals. Their education includes a Masters or doctorate degree that encompasses study of conservation, treatment, examination, preservation of cultural artifacts, history of materials and techniques, art history, conservation science, and instrumental analysis. Our staff includes full-time conservators and a specialist in matting and framing. The department is dedicated to the education of future conservators and hosts Fellows, interns, conservation students, and visiting scholars on a regular basis. Many art historians and conservators use the well-equipped facility on a regular basis to study works on paper. Facilities and Equipment The department’s state-of-the-art facility includes instruments for nondestructive analysis of works on paper (among them are a Raman microscope, the first to enter a North American museum), a grenze (mircrofocus) X-ray unit, stereo binocular microscopes, environmental monitoring equipment, an infrared camera with a mosaicing system, multispectral imaging, polarizing light microscopes, and photomicrographs systems. It houses a range of technical devices and equipment for conservation treatment (such as large sinks, vacuum suction tables and plates, modified water systems, chemical storage, fume hoods, air evacuations units, and mold remediation areas). Many of these instruments are made possible by the support of the department’s Visiting Committee. The department also includes a large facility for mat-cutting, storage, and display housing, and framing. Featured Projects Disrobing of Draupadi Technical examination uncovers the creative process of a work attributed to the Indian painter Nainsukh. Close Look: The Visual Games of Juan Gris Rachel Mustalish explains how the artist’s unorthodox techniques fool and delight the eye Facsimiles, Artworks, and Real Things Rebecca Capua looks at the history of facsimiles in The Met and contemporary institutions, and discusses them as objects of preservation and education and as objects of art themselves. Using the Astronomicum Caesareum Book This most sumptuous of all Renaissance instructive manuals explained the use of the astrolabe and other instruments used for computing planetary positions Our Work Research Conservation Projects and Research Learn about the various treatments and scholarly research of the Paper Conservation staff carried out on a vast collection of objects that contribute to the care and scholarship of the Met’s collection. Meet the Staff Meet the Staff Get to know the people who care for the art. Fellows Academic Fellows Learn about current and past fellows, and their research projects. Symposia and Academic Activities Symposia and Academic Activities From symposia, to lectures and classes, find out about the department’s involvement in a variety of scholarly and educational programs. Department Bibliography Department Bibliography Browse a complete bibliography of our staff's work. Dig Deeper Articles Read fresh perspectives on paper conservation at The Met. Videos Watch videos on paper conservation at The Met—behind-the-scenes work, interviews, lectures, and more. Met Publications Dive into The Met's many publications on paper conservation. The Materials and Techniques of Drawings and Prints How are artworks on paper created? This online feature illustrates the most common techniques for making prints. Stay Connected Follow Us on Instagram See the latest from Paper Conservation. @metpaperconservation Visiting Committee Visiting Committee Learn about the programs and events organized for the supporters our department."
