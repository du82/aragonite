["https://metmuseum.org/exhibitions/art-of-commerce-trade-catalogs-in-watson-library"]
title = "Art of Commerce: Trade Catalogs in Watson Library - The Metropolitan Museum of Art"
description = "Exhibition now on view at The Met"
full_description = "Art of Commerce: Trade Catalogs in Watson Library features a selection of the library’s extensive holdings of sale catalogs. Watson Library has almost two thousand trade catalogs published in many countries from the eighteenth century to the present. Objects featured include furniture, jewelry, tiles, ironwork, glasswork, lighting, stoves, tableware, textiles, decorative paper, artist’s materials, fashion, typography, automobiles, and musical instruments. Numerous catalogs illustrate works of art or related objects now in The Met collection. The library has strong holdings of Art Deco trade catalogs including Modern furniture design = Le dessin moderne des meubles—a colorful furniture portfolio by Czech architect Karel Vepřek—and Van Clef Arpels présentent, an elegantly illustrated accessories publication designed by Draeger Frères, the most innovative graphic designers and printers of the period. Both catalogs are on display in the exhibition.Trade or sale catalogs — also called commercial or manufacturer's catalogs —are printed publications advertising products of a particular trade or industry. Sale catalogs were often used in shops or showrooms to promote a company’s products. Examples include the massive Reed and Barton catalog Artistic workers in silver & gold plate from 1885 that illustrates the entire inventory of the company. Since their invention, automobiles have been creatively promoted through catalogs. Automobile catalogs in the library’s collection range from vivid brochures to oversized car showroom copies with moveable diagrams and transparencies to intrigue and persuade the customer, including 1953 Chevrolet and 1961 Buick.Sale catalogs are valuable sources for determining the date and authenticity of objects and are often highly expressive of their historical moment. They frequently represent the most innovative and creative examples of printing and graphic design, used by manufacturers and publishers to best illustrate their products. Watson’s trade catalogs include striking illustrations reproduced in lithography, chromolithography, embossing, and pochoir. Many of the catalogs in the exhibition have striking designs and demonstrate graphic innovation that can be as compelling as the objects they promote.Among the more unusual and appealing trade catalogs in the exhibition is a German Art Nouveau-inspired cake decorating book from 1910 and a baby carriage catalog from 1934 offering Art Deco styled tubular steel baby prams. These trade catalogs demonstrate the distillation of major art movements applied to quotidian objects.The earliest trade catalog in the exhibition is Muster zu Zimmer-Verzierungen und Ameublements, a neo-classical interior design catalog by luxury German manufacturer Voss und Compagnie, offering entire rooms that can be bought en masse or as separate pieces. It is illustrated with richly toned hand-colored engravings that detail the design and color of the objects.One of the library’s most fragile and weighty catalogs is Album des principaux modeles de verres: produits spéciaux en verre coulé. It is a magical trade catalog with sixty-five intact glass samples manufactured by French glassmaker Saint-Gobain. Founded during the time of Louis XIV, the company remains a manufacturer of glass for construction.The majestic ironwork catalogue of Maison Garnier has pink-tinted papers and was bound in Morocco leather as a special copy for Rémy Garnier, the son of the firm’s founder. The firm’s initials are boldly blind stamped on the cover.The most unusual and perhaps unexpected catalog, Urinoirs, illustrates the decorative ironwork structures of urinals (or pissoirs) that adorned the streets of Paris from the 1840s to the mid-twentieth century. The ornamentation of these structures demonstrates an impulse to beautify the animated street life of Paris and other cities. Many of the trade catalogs have been digitized. All of the trade catalogs in Watson Library are accessible and can be consulted in the Florence and Herbert Irving Reading Room. The thirty-three on display will be available immediately after the exhibition’s closing in early March 2025. Information on using the library is here.Marquee: Pinselfabrik Ernst Findeisen GmbH. Erstklassige Pinsel-Fabrikate Für Kunst-Handwerk u. Industrie : Ernst Findeisen, Ravensburg Ravensburg: Ernst Findeisen, early 20th century. Illustrated book, 1 volume (unpaged), W. 21 cm x H. 31 cm. Thomas J. Watson Library (TT305.3 .P56 1905). Gift of Friends of the Thomas J. Watson Library"
