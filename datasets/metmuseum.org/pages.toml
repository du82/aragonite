["https://metmuseum.org/about-the-met/collection-areas"]
title = "Collection Areas | The Metropolitan Museum of Art"
description = "African Art in The Michael C. Rockefeller Wing    The Met's collection of works by artists from across sub-Saharan Africa comprises nearly 3,000 works spanning two millennia, several hundred distinct cultures, and 39 contemporary nation states."
full_description = "The Met's collection of works by artists from across sub-Saharan Africa comprises nearly 3,000 works spanning two millennia, several hundred distinct cultures, and 39 contemporary nation states. Ever since its establishment in 1870, the Museum has acquired important examples of American art. Today, the American Wing's ever-evolving collection comprises some 20,000 works by African American, Euro American, Native American, and Latin American artists, ranging from the colonial to early-modern period. The Met's collection of ancient Near Eastern art includes more than 7,000 works ranging in date from the eighth millennium B.C. through the centuries just beyond the time of the Arab conquests of the seventh century A.D. The principal goals of the Arms and Armor Department are to collect, preserve, research, publish, and exhibit distinguished examples representing the art of the armorer, swordsmith, and gunmaker. The Met's collection of ancient American art, situated in the Michael C. Rockefeller Wing, comprises more than 6,000 works of art representing almost 5,000 years of history from North, Central, and South America and the Caribbean. The Met's collection of Asian art—more than 35,000 objects, ranging in date from the third millennium B.C. to the twenty-first century—is one of the largest and most comprehensive in the world. The Costume Institute's collection of more than 33,000 costumes and accessories represents five continents and seven centuries of fashionable dress and accessories for men, women, and children, from the fifteenth century to the present. The Met's collection of drawings and prints—one of the most comprehensive and distinguished of its kind in the world—began with a gift of 670 works from Cornelius Vanderbilt, a Museum trustee, in 1880. The Met's collection of ancient Egyptian art consists of approximately 30,000 objects of artistic, historical, and cultural importance, dating from the Paleolithic to the Roman period (ca. 300,000 B.C.–A.D. 4th century)."
