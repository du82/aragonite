["https://metmuseum.org/exhibitions/hybrid-creatures-and-creative-habitats"]
title = "Hybrid Creatures and Creative Habitats: Exploring Medieval Beasts and Where They Live at The Met Cloisters - The Metropolitan Museum of Art"
description = "Exhibition now on view at The Met"
full_description = "Animals, both real and imagined, make frequent appearances in medieval art. They are included in artworks as decorative elements, cultural and religious symbols, and as a reflection of the natural world. As part of The Met Cloisters’ commitment to serving neighbors in upper Manhattan, in winter 2025, third grade students from P. S. 48 PO Michael J. Buczek explored the hybrid creatures of The Met Cloisters and responded by creating modern medieval beasts and placing them in imagined habitats of their own.During two visits to The Met Cloisters, students noticed a griffin peering over a stone doorway, a dragon with a tightly coiled tail painted on a wall, and a magical unicorn woven into showstopping tapestries. Through close looking and a lot of sketching, students honed in on the details of what made these medieval creatures unique. They also considered how medieval artworks were made and what materials were used.Back in the classroom, the students designed their own creatures. Exploring new materials, they drew, painted, and collaged to create hybrid creatures and their habitats. On view at The Met Cloisters, their works of art combine different elements of real and mythical animals to form beasts with qualities that range from fearsome and ferocious to cute and kind—reflecting what the artists themselves might want to find in a magical creature.The Met Cloisters gratefully acknowledges P. S. 48 art teacher Félix Portela, Met teaching artist Pamela Lawton, and the entire P. S. 48 community for their support of this program.Jason Jorge, Grade 3, P. S. 48 PO Michael J. Buczek, New York City. The Lion with Polka Dots, 2025. Mixed-media collage on paper, 11 x 17 in."
year_published = 2025
clearnet = "https://metmuseum.org/exhibitions/hybrid-creatures-and-creative-habitats"
