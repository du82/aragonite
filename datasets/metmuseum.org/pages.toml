["https://metmuseum.org/exhibitions/the-calculated-curve-eighteenth-century-american-furniture"]
title = "The Calculated Curve: Eighteenth-Century American Furniture - The Metropolitan Museum of Art"
description = "Exhibition now on view at The Met"
full_description = "The 2024 reinstallation of the Anthony W. and Lulu C. Wang Galleries of Eighteenth-Century American Art of The Met’s American Wing elevates a pivotal moment in American furniture design between 1720 and 1770. This fresh installation encourages us to look closer at the materials and sculptural expression of this period, as well as the sensuality and ergonomics embedded in furniture design.The reinstalled galleries will feature iconic American furniture from the H. Eugene Bolles and Natalie Knowlton Blair collections, in addition to more recent gifts from premier collectors such as the Wangs as well as Erving and Joy Wolf. This striking display offers a counterpoint to the contextual installations of eighteenth-century furniture in the American Wing’s period rooms.Major support for The Calculated Curve: Eighteenth-Century American Furniture is provided by The Edward John and Patricia Rosenwald Foundation.Featured ContentListenThe American Wing at 100 Audio GuideBehind every artwork in the American Wing are often surprising stories of identity, time, and place. Hear historians, artists, poets, and community leaders from diverse backgrounds offer perspectives on various works. Narrated by Danielle Parker.WatchConsidering the Philadelphia TableGo behind the scenes at The Met as curator Alyce Englund and conservator Marijn Manuels explore the history of a slab table from Philadelphia.High chest of drawers (detail), 1730–50, American. The Metropolitan Museum of Art, New York, Bequest of Cecile L. Mayer, 1962"
