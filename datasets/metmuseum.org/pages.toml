["https://metmuseum.org/about-the-met/policies-and-documents/image-resources"]
title = "The Metropolitan Museum of Art"
description = "The Met presents over 5,000 years of art from around the world for everyone to experience and enjoy."
full_description = "PoliciesImage ResourcesImage and Data ResourcesOpen Access PolicyThe Metropolitan Museum of Art creates, organizes, and disseminates a broad range of digital images and data that document the rich history of the Museum, its collection, exhibitions, events, people, and activities.Images of artworks in the Museum's collection fall into two categories:images of works the Museum believes to be in the public domain, or those to which the Museum waives any copyright it might haveimages of works the Museum knows to be under copyright or other restrictionsOn February 7, 2017, The Metropolitan Museum of Art implemented a new policy known as Open Access, which makes images of artworks it believes to be in the public domain widely and freely available for unrestricted use, and at no cost, in accordance with the Creative Commons Zero (CC0) designation and the Terms and Conditions of this website.It also makes available data from the entire online collection―both works it believes to be in the public domain and those under copyright or other restrictions―including basic information such as title, artist, date, medium, and dimensions. This data is available to all in accordance with the Creative Commons Zero (CC0) designation.Watch the press conference held on February 7, 2017, to announce the new Open Access policy on The Met Museum YouTube channel.Images of Artworks in the Public DomainExplore more than 406,000 hi-res images of public-domain works from the The Met collection, all of which can be downloaded, shared, and remixed without restriction.To identify these images, look for the Open Access icon, at the lower left of the image:We've created 20 thematic sets of images to get you started: Masterpiece Paintings, Cats, Monsters and Mythological Creatures, Met-staches, New York City, Impressionism and Post-Impressionism, Winter Wonderland, Vincent van Gogh, The Pre-Raphaelite Style, Self-Portraits, Quilts, Gold, Georges Seurat, Arms and Armor, The Monuments Men at The Met, Faces from the Ancient World, Tiffany Glass, Dress to Impress, Art or Design?, and Dishes.If an image for an artwork accompanied by the OA icon is unavailable on our website, please refer to the instructions for requesting new images below.Images of Artworks Under Copyright or Other Restrictions, or Unavailable ImagesTo request images for artworks under copyright or other restrictions, or to request an image not available on our website, please use the following form to contact the Museum's image-licensing partner, Art Resource: Image Request FormArt Resource acts as the Museum's primary partner for the worldwide fulfillment of licensing requests. As the Museum's agent, Art Resource will provide (when possible) digital images made by Museum staff. A fee will be charged depending on the nature and type of the proposed use and the availability of photography of the images requested.All requests for new photography are reviewed on a case-by-case basis. Upon approval, additional fees may apply. New photography will require a minimum of six weeks. Please note that the Museum reserves the right to deny any request at its sole discretion.Instructions are included on the form, which goes directly to Art Resource once submitted. The following is the contact information for Art Resource:Art Resource, Inc.65 Bleecker Street, 12th floorNew York, NY 10012Phone: 212-505-8700Fax: 212-505-2053Email: requests@artres.comImages for Educational and Research UsesDigital images of selected works of art from the Museum's collection may be licensed by educational institutions for study and presentation purposes from Scholars Resource. These images may be used for educational purposes only and may not be published or reproduced.Scholars Resource, Inc.65 Summer PlacePortland, ME 04103Phone: 207-221-6277Fax: 207-221-5695Email: orders@scholarsresource.comCollection DataThe Museum dedicates select data of artworks in its collection―both works it believes to be in the public domain and those under copyright or other restrictions―to the public domain. You can download, share, modify, and distribute the data for any purpose, including commercial and noncommercial use, free of charge and without requiring permission from the Museum.The completeness of each object record differs, as cataloguing is ongoing. Digital images are not included in the dataset.The data is available as a Comma Separated Value (.CSV) file on GitHub, a web-based data repository and Internet hosting service. It is updated on a weekly basis.Open Access PartnersCreative CommonsThe Museum is pleased to launch its Open Access policy in partnership with Creative Commons, an international leader in open access and copyright. Creative Commons provides free copyright licenses to facilitate and standardize the sharing of creative work.Distribution PartnersThe images of artworks the Museum believes to be in the public domain, those to which it waives any copyright it might have, and our select collection data are also available on the websites of our distribution partners, including ITHAKA-Artstor and its companion service, Shared Shelf Commons; the Digital Public Library of America; Google Cultural Institute; Pinterest; and the Wikimedia communities. Learn more about The Metropolitan Museum of Art's GLAM-Wiki Projects on Wikipedia.Contact InformationFor questions about images of artworks identified by the OA icon, or about the Museum's public-domain collection data, please contact openaccess@metmuseum.org.For all other questions about rights and permissions, please contact:Digital Department - Rights and PermissionsThe Metropolitan Museum of Art1000 Fifth AvenueNew York, NY 10028Phone: 212-650-2368Fax: 212-396-5050Email: image.licensing@metmuseum.orgImage Request FormUse our image request form, which will be submitted directly to Art Resource, the Museum's primary agent for the worldwide distribution and fulfillment of all external licensing requests.Image Request FormFrequently Asked QuestionsSee the frequently asked questions about acquiring and using Museum images under the Open Access policy."
year_published = 2025
