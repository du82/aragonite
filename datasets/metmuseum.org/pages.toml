["https://metmuseum.org/exhibitions/art-of-native-america-diker-collection"]
title = "Art of Native America: The Charles and Valerie Diker Collection - The Metropolitan Museum of Art"
description = "Exhibition now on view at The Met"
full_description = "The brilliance of Native American artists from across the United States and Canada is affirmed in this installation of historical and contemporary works. Honoring the diversity of Native life, the display reveals complex perspectives on America’s past and the deep significance of these artworks to Native and non-Native communities in the present. The work of more than fifty Indigenous groups is represented, as well as major Native American aesthetic forms: painting, drawing, sculpture, textiles, quill and bead embroidery, basketry, and ceramics.Most of the items—made to be worn; to nourish; to hunt, defend, and protect; to cradle the young; and to restore balance and wellness—are from the eighteenth and nineteenth centuries. Also included are modern and contemporary artworks that demonstrate unbroken aesthetic lineages. All were created against the backdrop of ongoing Euro-American colonialism and environmental devastation. They are organized into seven geographical regions: Woodlands, Northwest Coast, Arctic, Plateau, Plains, Southwest, and California and Great Basin.This long-term installation consists primarily of promised gifts, donations, and loans from the major collectors Charles and Valerie Diker as well as other patrons. Their belief in the power of these works to broaden historical, cultural, and aesthetic understandings inspired their generosity. The presentation marks the commitment of the American Wing, established in 1924, to foregrounding Native cultural expressions and perspectives in meaningful, inclusive contexts.Accompanied by a catalogue.#ArtofNativeAmericaThis statement demonstrates our institutional commitment to respectfully recognizing the original Native American communities and their kinship ties to the lands and waters of this place.The American Wing acknowledges the sovereign Native American and Indigenous communities dispossessed from the lands and waters of this region. We affirm our intentions for ongoing relationships with contemporary Native American and Indigenous artists and the original communities whose ancestral and aesthetic items we care for.We understand that these items—vibrant expressions of Native sovereignty, identity, and connections to community and family—embody intergenerational and environmental knowledge, including origin stories, languages, songs, dances, and ties to homelands.We commit to pursuing continuous collaborations with Indigenous communities and to presenting Native American art in a manner that is inclusive of Indigenous perspectives, involves guidance from source communities, and creates space for respectful listening and thoughtful dialogue. We will work to advance Indigenous experiences in The Met’s exhibitions, collections, and programs.We will strengthen our awareness of historical and contemporary environmental issues in the New York region and throughout North America, in order to thoughtfully reckon with our institutional legacy and its impact on the lands, waters, and original peoples of this place, which are, and will always be, inextricable.The catalogue is made possible by The Andrew W. Mellon Foundation.Art of Native America: The Charles and Valerie Diker Collection is complemented by the exhibition Artistic Encounters with Indigenous America, on view at The Met Fifth Avenue from December 3, 2018, through May 13, 2019.Audio GuideFollow Tantoo Cardinal from the Metis Nations of Canada as she discusses Art of Native America: The Charles and Valerie Diker Collection with indigenous artists, curators, and more. Hear about how these works of art showcase the many traditions and histories of Indigenous groups in America, while also embracing innovation, acceptance, and reinterpretation.9801: Introduction PlayPause0:00Skip backward 10 secondsSkip backward 10 secondsSkip forward 10 secondsSkip forward 10 seconds0:00NARRATOR (TANTOO CARDINAL): Hello, my name is Tantoo Cardinal. I’m from the Metis Nations of Canada, and I’ll be your guide through the exhibition Art of Native America: The Charles and Valerie Diker Collection at The Metropolitan Museum of Art. I’d like to welcome you to the exhibition and thank our sponsors at Bloomberg Philanthropies for their generous support.We stand today on ancestral lands of the Lenape Indians. Patricia Marroquin Norby is Associate Curator of Native American Art in the Met’s American Wing:PATRICIA MARROQUIN NORBY: The American Wing acknowledges the sovereign Native American and Indigenous communities dispossessed from the lands and waters of this region. We affirm our intentions for ongoing relationships with contemporary Native American and Indigenous artists and the original communities whose ancestral and aesthetic items we care for.We understand that these items—vibrant expressions of Native sovereignty, identity, and connections to community and family—embody intergenerational and environmental knowledge, including origin stories, languages, songs, dances, and ties to homelands.We commit to pursuing continuous collaborations with Indigenous communities and to presenting Native American art in a manner that is inclusive of Indigenous perspectives, involves guidance from source communities, and creates space for respectful listening and thoughtful dialogue. We will work to advance Indigenous experiences in The Met’s exhibitions, collections, and programs.We will strengthen our awareness of historical and contemporary environmental issues in the New York region and throughout North America, in order to thoughtfully reckon with our own institutional legacy and its impact on the lands, waters, and original peoples of this place, which are, and will always be, inextricable.Hide TranscriptPlaylist9801: Introduction9802: Shirt, Seminole9803.1: Two Chitimacha Baskets With Lids, Ada Vilcon Thomas9803.2: Dante Blais Billie On Seminole History 9804: Incorporating New Materials9805: Shakhùkwiàn (Man’s Coat), Lenni Lenape/Delaware Artist9806: Comb, Haudenosaunee9807: Belt Cup, Anishinaabe Artist9808: Rattle, Tlingit Artist9809: Portrait Figure, Haida Artist9810: Mask, Yup'ik Artist9811: Snow Goggles, Thule9812: Plains Beadwork9813: Black-on-Black Jar, Maria Martinez And Julian Martinez9814: Socorro Black-On-White Storage Jar, Ancestral Pueblo9816: Joe Baker's Artistic JourneyExhibition ObjectsView allA slider containing 4 items.Press the down key to skip to the last item.Headdress frontletTsimshian , Native Americanca. 1820–40MaskYup'ik, Native Americanca. 1900Polacca polychrome water jarNampeyoca. 1895–1900Basket bowlLouisa Keyser1907Related ContentRead more on PerspectivesHear from curators, artists, and more in this series published throughout the run of the exhibition.Native PerspectivesContemporary Native artists and historians respond to eighteenth- and nineteenth-century Euro-American works in the American Wing’s collection.Marquee: Tsimshian artist. Headdress frontlet. British Columbia, ca. 1820–40. Wood, abalone shell, pigment, and nails, 7 x 6 x 1/2 in. (17.8 x 15.2 x 1.3 cm). The Metropolitan Museum of Art, New York, The Charles and Valerie Diker Collection of Native American Art, Promised Gift of Charles and Valerie Diker. Native Perspectives: Albert Bierstadt (American, 1830–1902). The Rocky Mountains, Lander's Peak (detail), 1863. Oil on canvas, 73 1/2 x 120 3/4 in. (186.7 x 306.7 cm). The Metropolitan Museum of Art, New York, Purchase, Rogers Fund, 1907 (07.123)"
