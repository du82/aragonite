["https://metmuseum.org/about-the-met/conservation-and-scientific-research/scientific-research"]
title = "Scientific Research | The Metropolitan Museum of Art"
description = "The Inside (and Outside) Scoop    Learn about the intensive analysis undertaken by The Met’s Department of Scientific Research to determine what foods were stored in nineteenth-century stoneware jars produced by enslaved artisans from Old Edgefield, South Carolina."
full_description = "Scientific Research The Department of Scientific Research comprises a team of scientists specialized in the study of works of art. Scientists collaborate with curators and conservators throughout the Museum to investigate the material aspects of works of art in The Met collection, and work with designers, registrars, collection managers, and other behind-the-scenes staff to guarantee the long-term safety of the collection. The Department also pursues innovative research in analytic techniques, preventive conservation, and treatment methodologies. In addition to their collaborative work at the Museum, department staff have created a series of partnerships with academic researchers, including scientists at City College, University of Delaware, NYU, The University of Bordeaux, and Columbia, and scientists and conservators from other leading museums' research facilities. Facilities and Equipment With a staff of fifteen and laboratories equipped for electron microscopy, Raman and infrared spectroscopy, mass spectrometry, and imaging x-ray fluorescence spectroscopy, among other techniques, the Department of Scientific Research is one of the most advanced facilities in the world for cultural heritage science. See a list of our equipment Fellowships, Internships, and Open Positions Scientific Research Fellowships If you’d like to become part of our community, join The Met’s Fellowship Program in Scientific Research and Conservation. We accept applications from recent master’s graduates, PhD candidates, postdoctoral scholars, and senior scientists and researchers. To learn more about the department’s primary areas of research interest, visit our Fellows page. Read more about The Met’s Fellowship Program or email academic.programs@metmuseum.org Internships Read more about The Met’s internships Open Positions Stay tuned for upcoming open positions. Research Highlights The Inside (and Outside) Scoop Learn about the intensive analysis undertaken by The Met’s Department of Scientific Research to determine what foods were stored in nineteenth-century stoneware jars produced by enslaved artisans from Old Edgefield, South Carolina. The Chemistry Behind the Oddy Test Developing new approaches in assessing the use of conservation materials for displaying, transporting, or storing art. Ancient Greek Sculpture in Color A collaboration reveals new research on an archaic Greek sphinx finial at The Met. Refashioning the Lavoisiers A team of experts from across The Met gains new understanding of Jacques Louis David's iconic portrait. Our Work Research Projects Research Projects Explore the department's research activities through featured project abstracts. Collaborations Research Groups Collaborations and Research Groups Learn about our partnerships with colleagues and cultural heritage institutions both at home and abroad on conservation and historic preservation projects as well as our open-access research resources. Network Initiative for Conservation Science Learn how NICS advances research and scholarship in art history, archaeology, conservation, and science by sharing The Met's cutting-edge scientific research facilities and analytical instrumentation, expertise, and resources. Events Symposia Events and Symposia From symposia, to lectures, and workshops, find out about the department’s involvement in a variety of scholarly and educational programs. Who We Are Meet Staff Meet the Staff Get to know the people who care for the art. Meet Fellows Meet the Fellows Learn about suggested fellowship project topics, current and past fellows, and their research. Dig Deeper Blog Articles Read essays published by the Department of Scientific Research. Videos Watch videos about Conservation and Scientific Research—behind-the-scenes work, interviews, lectures, and more. Met Publications Discover The Met's publications on Scientific Research, many available for download and/or purchase. Department Bibliography Browse an abridged bibliography of our staff's work. Stay Connected Follow us on Instagram See the latest from Scientific Research @metscience #TheDailyNICS. News In the News Discover our work in news interviews, articles, and videos."
