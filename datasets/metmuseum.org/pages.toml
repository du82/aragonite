["https://metmuseum.org/exhibitions/the-three-perfections-japanese-poetry-calligraphy-and-painting-from-the-mary-and-cheney-cowles-collection"]
title = "The Three Perfections: Japanese Poetry, Calligraphy, and Painting from the Mary and Cheney Cowles Collection - The Metropolitan Museum of Art"
description = "Exhibition now on view at The Met"
full_description = "In East Asian cultures, the arts of poetry, calligraphy, and painting are traditionally referred to as the “Three Perfections.” This exhibition presents over 160 rare and precious works—all created in Japan over the course of nearly a millennium—that showcase the power and complexity of the three forms of art. Examples include folding screens with poems brushed on sumptuous decorated papers, dynamic calligraphy by Zen monks of medieval Kyoto, hanging scrolls with paintings and inscriptions alluding to Chinese and Japanese literary classics, ceramics used for tea gatherings, and much more.The majority of the works are among the more than 250 examples of Japanese painting and calligraphy donated or promised to The Met by Mary and Cheney Cowles, whose collection is one of the finest and most comprehensive assemblages of Japanese art outside Japan. The exhibition is made possible by The Miriam and Ira D. Wallach Foundation FundExhibition CatalogueThis sumptuous survey examines the interrelationship of poetry, calligraphy, and painting in Japanese art through more than 100 works, including hanging scrolls, folding screens, handscrolls, and albums.Buy nowMarquee: Yosa Buson (Japanese, 1716–1783). Hanshan and Shide (detail), Edo period (1615–1868), early 1770s. Pair of hanging scrolls; ink and color on paper. Image: 55 × 23 3/16 in.(139.7 × 58.9 cm). The Metropolitan Museum of Art, New York, Mary and Cheney Cowles Collection, Gift of Mary and Cheney Cowles, 2022 (2022.432.16a, b)"
year_published = 2025
