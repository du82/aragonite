["https://metmuseum.org/press"]
title = "Press - The Metropolitan Museum of Art"
description = "The Press Room is available for use by working members of the media. Press releases on the Museum, its exhibitions, and recent news and announcements are available for viewing and downloading. Accredited press can view and request high-resolution press images for publication."
full_description = "PressPressFeaturedThe Metropolitan Museum of Art Unveils Design for New Modern and Contemporary Art WingDecember 10, 2024The Metropolitan Museum of Art Announces Ambitious Slate of Exhibitions and Special Installations Through Spring 2025December 9, 2024Browse by TopicAcquisitions Gifts and LoansEventsExhibitionsInstitutional AnnouncementsTrustee and Staff AppointmentsFrequently Asked QuestionsHow can I obtain permission to film or photograph at The Metropolitan Museum of Art and/or The Cloisters museum and gardens? Please email a detailed request to communications@metmuseum.org.How can I obtain publicity images to reproduce in a magazine, newspaper, or website?Images may be used only by accredited media in editorial coverage of Metropolitan Museum exhibitions and announcements as specified. For urgent requests, contact the Communications Office at communications@metmuseum.org.All other image requests should be directed to Art Resource through its website (http://www.artres.com), by telephone at 212-505-8700,or email at requests@artres.com. You may also submit your request using the Image Request Form available on the Met's website.How can I get a press pass to visit the Museum?The Metropolitan Museum of Art does not issue press passes, but does honor press passes issued by the city and other institutions and media outlets. Please present your press ID to our admissions staff, and they will be happy to give you complimentary admission.ContactPress requests for information, images, and interview opportunities can be directed to the Communications Department:Email: Communications@metmuseum.orgPhone: (212) 570-3951The Communications Department is located at 1000 Fifth Avenue, New York, NY 10028-0198."
