["https://metmuseum.org/join-and-give/corporate-support"]
title = "Corporate Support - The Metropolitan Museum of Art"
description = "Corporate support helps The Met fulfill its mission by funding its operating budget, education programs, and a variety of Museum-wide programs."
full_description = "SupportCorporate SupportCorporate SupportA slider containing 2 items.Press the down key to skip to the last item.Jump to:For 150 years, The Met has been able to realize its vision for the future thanks to the unwavering dedication of the business community. Today, corporate support helps The Met fulfill its mission by funding its operating budget, education programs, special exhibitions, and a variety of Museum-wide programs. We thank our corporate friends for their extraordinary commitment and loyalty to The Met.For their leadership support, we would also like to acknowledge the current corporate partners listed below:Help us bring life to over 5,000 years of art with a tax-deductible gift, or through a partnership tailored to your company's philanthropic goals. Corporate giving strengthens our community, and we welcome your support.ContactFor more information, please call or email the Development Office:Exhibition Sponsorship212-650-2390sponsor.exhibitions@metmuseum.orgBusiness Committee & Corporate Patron Program212-570-3947corporate.patrons@metmuseum.orgReal Estate Council212-570-3947realestate.council@metmuseum.orgExhibition SponsorshipSponsorship of The Met's exhibitions, performances, programs, benefit events, and new initiatives is available at various levels.Corporate sponsorship provides significant brand exposure across media, promotion through The Met's extensive global press network, creative activation and content opportunities, product development and licensing, and unparalleled access to the Museum for client and employee engagement. The Met works collaboratively with its corporate sponsors to develop partnerships that are tailored to meet strategic business objectives and marketing goals.The Met is the most visited art museum in the United States and the top tourist attraction in New York City. In addition to the 7 million on-site visitors to our galleries and events in a typical year, the Museum has nearly 38 million web visitors annually, over 11 million followers on social media, and countless more who participate in our robust slate of digital programs. We invite you to join us in a conversation about how we might deepen your company's engagement with The Met's global audience and further its philanthropic commitment to the arts.Learn more about the benefits of corporate sponsorship (PDF) or view a list of current and previous corporate sponsors (PDF).Business Committee The Met's Business Committee includes preeminent leaders from around the world, representing a broad range of industries. The Committee provides support for the Museum's ongoing programs as well as for exhibitions and educational initiatives. The Museum's annual Spring Gala hosted by the Committee honors business leaders who both personally and professionally exemplify the commitment and generosity so critical to an institution such as The Met.Join industry leaders in support of The Met, and give an online gift to fortify our missionView a list of current Business Committee members (PDF).Corporate Patron ProgramThe Met relies on its vital partnership with the corporate community to provide a foundation of operating support. Join the more than 140 Corporate Patrons who support The Metropolitan Museum of Art's Corporate Patron Program. Along with a substantial tax deduction, Corporate Patrons receive benefits corresponding to their Membership level for executives and employees—from free admission to invitations to exhibition previews as well as opportunities to entertain in the Museum's incomparable spaces.Corporate Membership LevelsChairman's Circle: $100,000Director's Circle: $60,000Leader: $35,000Partner: $25,000Sponsor: $15,000Contributor: $7,500Member: $4,000Small Business: $2,000Join our Corporate Patron community, and align your business with more than 140 others in partnership with The Met.To sign up today by mail or email, download the Corporate Patron Program Enrollment Form (PDF).Download the Corporate Patron Program Brochure (PDF) or view a list of current Corporate Patron Program members (PDF) and the full list of benefits of membership (PDF).Real Estate CouncilThe Real Estate Council promotes its industry's involvement in The Metropolitan Museum of Art, with a particular focus on the Museum's educational programs offered to millions of visitors each year. Council members receive benefits such as free admission to The Met Fifth Avenue and The Met Cloisters.Real Estate Council LevelsSponsor: $10,000Partner: $7,500Associate: $4,000Member: $2,000Support our education efforts as a Real Estate Council Member, and bring art to life for millions of annual visitors.To join today by mail or email, download the Real Estate Council Enrollment Form (PDF).Download the Real Estate Council Brochure (PDF) or view a list of current Real Estate Council members (PDF) and the full list of benefits of membership (PDF)."
