["https://metmuseum.org/exhibitions/baseball-cards-from-the-collection-of-jefferson-r-burdick"]
title = "Baseball Cards from the Collection of Jefferson R. Burdick - The Metropolitan Museum of Art"
description = "Exhibition now on view at The Met"
full_description = "The Jefferson R. Burdick collection of ephemera at The Met contains one of the most distinguished collections of historical baseball cards anywhere in the world. In 1947, Burdick (1900–1963), an electrician from Syracuse, New York, and avid collector of ephemera, began to donate in large batches his holdings of more than 300,000 trade cards, postcards, and posters to the Museum. Included in the donation were more than 30,000 baseball cards dating back to the 1880s.This exhibition features over one hundred cards dating from 1895 to 1956. Produced using a variety of printing techniques and in a range of styles, the cards feature legends of the game from a bygone era.Andy Pafko, Chicago Cubs, from the All-Star Baseball series (R401-1). Published by Leaf Gum Company. Lithograph, 2 3/8 x 2 7/8 in. (6 x 7.3 cm). Metropolitan Museum of Art, New York, The Jefferson R. Burdick Collection, Gift of Jefferson R. Burdick (Burdick 326, R401-1.48)."
