["https://metmuseum.org/about-the-met/career-opportunities"]
title = ""
description = "The Metropolitan Museum of Art provides an opportunity for employees to enrich and develop their love of the arts while contributing their specific skills and talents to the mission of the Museum. Career opportunities at The Met are as varied as the cultures represented in the Museum’s collection, and require all levels of training, experience, and education. We are committed to fostering a collaborative and respectful work environment with a staff as diverse as the audiences we engage. Our staff members are art lovers who are passionate about working toward a common goal: creating the most dynamic and inspiring art museum in the world. At The Met, every staff member – from security officers to researchers to scientists and beyond – lives by our core values of respect, inclusivity, collaboration, excellence, and integrity. If you share our community’s values, please apply to one of our exciting opportunities! Respect: Engage one another with collegiality, empathy, and kindness, always. Inclusivity: Ensure that all are and feel welcome and valued. Collaboration: Reach across boundaries to exchange ideas and work together toward our shared mission. Excellence: Lead the cultural world in quality and expertise—and inspire curiosity and creativity. Integrity: Hold ourselves to the highest moral standards, admit when we fall short, and then evolve. The Museum provides competitive compensation, and generous benefits and perks for all eligible employees. Benefits Offering may differ based on Employee Status. Transparency in Coverage UnitedHealthcare creates and publishes the Machine-Readable Files on behalf of the Metropolitan Museum of Art in compliance with the Transparency in Coverage Rule. To link to the Machine-Readable Files, please click on the URL provided: http://transparency-in-coverage.uhc.com/"
