["https://metmuseum.org/about-the-met/collection-areas/ancient-american-art"]
title = "Ancient American Art in The Michael C. Rockefeller Wing | The Metropolitan Museum of Art"
description = "The Met's collection of ancient American art comprises more than 6,000 works of art representing almost 5,000 years of history from North, Central, and South America and the Caribbean."
full_description = "Ancient American Art in The Michael C. Rockefeller Wing The galleries for Ancient American art (Galleries 356, 357, 358) in The Michael C. Rockefeller Wing have temporarily closed in preparation for the exciting new renovation project which will reenvision these collections for a new generation of visitors. While the galleries are closed a selection of works are on view in the Great Hall Balcony. A rich history of creative expression—parallel to, but independent of, the rest of the world—unfolded in North, Central, and South America America and the Caribbean thousands of years prior to European colonization. Over the course of several millennia, artists transformed select materials into monumental stone sculptures, finely crafted gold ornaments, and other works in wood, ceramic, shell, textile, and featherwork. The Met’s collection of ancient American art sheds light on how these works were commissioned, created, and animated by powerful men and women across the continents. The Museum’s holdings reflect the diversity of indigenous nations in Latin America before 1600 and celebrate the associated visual cultures, origin stories, and daily lives of the people who made them. The galleries present a journey through time and space, from the royal courts of the Classic Maya and their peers to the south, the Moche, to the massive city of Teotihuacan in central Mexico, to centers of innovative sculptural production in Western Mexico and Ecuador, and finally to the imperial capitals of the Inca and the Mexica. History of the Collection The Met began to acquire works of ancient American art in the nineteenth century. Since the opening of The Michael C. Rockefeller Wing in 1982, international collaborations with colleagues and institutions across Latin America have resulted in landmark projects, from major exhibitions to focused explorations of specific topics. The online collection features high-resolution, open-access images of works in the collection, along with cultural and chronological information. These object records—an ongoing research project—also provide data on the history of works from the time of their creation to their acquisition by the Museum. Most of the collection comes from unknown archaeological contexts. The Museum is guided by the Report of the Association of Art Museum Directors' Task Force on the Acquisition of Archaeological Materials and Ancient Art (revised 2013) and the American Association of Museums' Standards Regarding Archaeological Material and Ancient Art, see Collections Management Policy. For further reading on the history of the collection, see “Aztecs in the Empire City: ‘The People without History’ in The Met”. Explore the Collection Discover highlights from our collection. The Renovated Galleries After nearly forty years since the inauguration of The Michael C. Rockefeller Wing, The Met is creating three distinct new galleries for African Art, Ancient American Art, and Oceanic Art. Learn more about the renovation here. What Makes a Cultural Landmark? Perspectives from Mexico Join leading experts for presentations and discussion exploring cultural heritage sites in Mexico, including the region of Oaxaca and the unique relationship between its local communities, their daily lived traditions, and natural landscapes. Featured Article Moche Portrait Vessels Artists of the Moche cultures excelled at the creation of “portrait vessels,” so-called for their striking apparent resemblance to specific individuals. Related Content Publications Discover The Met’s many publications on ancient American art. Blog Articles Read fresh perspectives on ancient American art from curators and others at the Museum. Videos Watch videos on ancient American art at The Met — interviews, lectures, exhibitions previews, and more. Heilbrunn Timeline of Art History Browse richly illustrated essays on ancient American art. Stay Connected Meet the Staff Meet the Staff Get to know the people who care for the art. Meet the Fellows Meet the Fellows Meet the Fellows and learn about their research. Friends of The Michael C Rockefeller Wing Curatorial Friends Group The Friends of The Michael C. Rockefeller Wing: Art of Five Continents brings together patrons and collectors in support of the department."
