["https://metmuseum.org/exhibitions/samurai-splendor"]
title = "Samurai Splendor: Sword Fittings from Edo Japan - The Metropolitan Museum of Art"
description = "Exhibition now on view at The Met"
full_description = "After almost a century and a half of near-constant civil war and political upheaval, Japan unified under a new ruling family, the Tokugawa, in the early 1600s. Their reign lasted for more than 250 years, in an era referred to as the Edo period, after the town of Edo (present-day Tokyo) that became the new capital of Japan. The Tokugawa regime brought economic growth, prolonged peace, and widespread enjoyment of the arts and culture. The administration also imposed strict class separation and rigid regulations for all. As a result, the ruling class—with the shogun as governing military official, the daimyo as local feudal lords, and the samurai as their retainers—had only a few ways to display personal taste in public. Fittings and accessories for their swords, which were an indispensable symbol of power and authority, became a critical means of self-expression and a focal point of artistic creation.This installation explores the luxurious aspects of Edo-period sword fashion, a fascinating form of arms and armor rarely featured in exhibitions outside Japan. It presents a selection of exquisite sword mountings, fittings, and related objects, including maker’s sketchbooks—all drawn from The Met collection and many rarely or never exhibited before.This exhibition is made possible by the Vilcek Foundation.Exhibition ObjectsView allA slider containing 5 items.Press the down key to skip to the last item.Blade and Mounting for a Short Sword (Wakizashi)Japaneseblade, 16th century; mounting, 19th centuryグリ彫金具脇指拵 Blade and Mounting for a Short Sword (Wakizashi)尾張関 Owari-Sekiblade, 17th century; mounting, 19th century金魚子地秋草図金具合口拵・付銀刀 Blade and Mounting for a Dagger (Tantō)宮田信清 Miyata Nobukiyomid–late 19th centuryPortraits of Twenty-eight Metal ArtistsKitao Shigemasa彫鐫画譜 Album of Designs for Metal Carving (Chōsen Gafu)嵐山常行画 Ranzan Tsuneyukimid-19th centuryMarquee: Mounting for a short sword (wakizashi) (detail), Japanese, 19th century. Wood, brass, lacquer, copper-gold alloy (shakudō), ray skin (samé), silk, silver. The Metropolitan Museum of Art, New York, Gift of Brayton Ives and W. T. Walters, 1891 (91.2.52)"
