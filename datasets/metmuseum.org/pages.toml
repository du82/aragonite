["https://metmuseum.org/about-the-met/conservation-and-scientific-research"]
title = "Conservation and Scientific Research | The Metropolitan Museum of Art"
description = "Objects Conservation    The Department of Objects Conservation works closely with each of the Museum’s curatorial departments in their mission to preserve and study three-dimensional works of art. Staff members are active as educators, consultants, and collaborators in conservation and cultural heritage projects locally and around the world."
full_description = "Conservators and scientists collaborate with curators to study, preserve, and conserve the works in The Met collection. The Department of Objects Conservation works closely with each of the Museum’s curatorial departments in their mission to preserve and study three-dimensional works of art. Staff members are active as educators, consultants, and collaborators in conservation and cultural heritage projects locally and around the world. Paintings conservators support many different facets of the institution's activities, checking hundreds of paintings for loan and taking responsibility for many hundreds more that arrive at the Museum as honored guests to be part of temporary exhibitions and displays. The Paper Conservation Department is dedicated to the preservation, technical analysis, and research of works of art from all the Museum's curatorial departments. The Photograph Conservation Department provides preservation, conservation, and research into the history, aesthetics, and technology of images dating from the early history of the medium until the present day. The Department of Scientific Research investigates the material aspects of works of art in The Met collection. Scientists in the department cooperate with conservators and curators in studying, preserving, and conserving the works in The Met collection, and also pursue innovative research in analytical techniques, preventive conservation, and treatment methodologies. The Department of Textile Conservation is responsible for preservation, conservation, technical study, and research of the Museum’s collection of approximately 36,000 textiles, representing a broad range of textiles including tapestries, carpets, embroideries, costumes, and accessories of all periods and cultures. The Costume Institute's Conservation Department supports an active curatorial program of exhibitions, publications, and loans through its preservation, conservation, and technical research of the 35,000 objects in The Costume Institute's collection."
