full_description = "Think and look at art creatively, delve into a range of art-making practices, interact with artists, and make your own artwork inspired by 5,000 years of contemporary art. Gallery programs and these process-based workshops and events are designed for visitors of various ages and levels of experience. Spark imagination, creativity, and lifelong connections with art at The Met! Sign up for classes taught by experienced educators and teaching artists who use the entire Museum—from the studios to the galleries—as an expanded classroom. Come on over to The Met for Teen Fridays—the place to be creative, have snacks, and meet other teens with similar and different interests. Come ready to look, imagine, and create! Drop in for free, hands-on family fun. Explore a new theme every month through art making, gallery activities, and Storytime. Activate your creativity and join a community of makers for virtual, artist-led art-making sessions. For adult makers at all levels of experience. Come ready to look, imagine, and create! Drop in for free, hands-on family fun. Explore a new theme every month through art making, gallery activities, and Storytime. Create your own artwork inspired by works in The Met collection and learn new art-making methods with the guidance of expert artists and designers. For adults at all levels of experience. Be inspired by artists and original works of art! Experience The Met collection through drawing and respond to creative challenges in the galleries. Set up your studio in The Met. The Copyist Program offers time and space for artists to develop an artwork through intimate study in the Museum's galleries. Sketch in the galleries from works of art with the guidance of an artist-instructor. Attend one or all of the monthly sessions. Unleash your creativity and experiment with materials in unexpected ways during these art-making workshops in the galleries and studios. Explore art creatively through all your senses and make your own works of art during hands-on experiences that are specifically designed for people with disabilities, together with family and friends."
