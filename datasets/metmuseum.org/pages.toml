["https://metmuseum.org/events/programs/teens"]
title = "Teens | The Metropolitan Museum of Art"
description = "Check out classes, workshops, and special events designed especially for teens to develop their skills, and connect with art, ideas, and other young people."
full_description = "The Met is the place to be for teens. Check out classes, workshops, and special events designed especially for teens to develop their skills, and connect with art, ideas, and other young people. Program times and topics vary. Grab your friends and join us across social media platforms for virtual teen takeovers. Follow along for teen-only activities including art making, performances, music, and more. Come on over to The Met for Teen Fridays—the place to be creative, have snacks, and meet other teens with similar and different interests. Discover works of art from around the world and make art inspired by your ideas and The Met collection. Attend one or all of the monthly sessions. Unleash your creativity and experiment with materials in unexpected ways during these art-making workshops in the galleries and studios. Sketch in the galleries from works of art with the guidance of an artist-instructor. Attend one or all of the monthly sessions. Thinking about life beyond high school? Explore careers in the arts, hang with other teens, learn from creative professionals, and build your skills in special workshops. Join us for in-depth special summer programs that tap into your talents and invite you to explore The Met collection. Teen programs are made possible by New York Life Foundation, Stanley R. Stangren, The Enoch Foundation, Beal Family Foundation, Constance Goulandris Foundation, and Milton & Sally Avery Arts Foundation, Inc., and Yolanda Shashaty. The Teen Pass for Middle and High School Students is made possible by the Estate of Lillian Hirschmann. Free Audio Guides for New York City public high school students are made possible by the May and Samuel Rudin Family Foundation, Inc."
