["https://metmuseum.org/exhibitions/the-great-hall-commission-tong-yang-tze"]
title = "The Great Hall Commission: Tong Yang-Tze, Dialogue - The Metropolitan Museum of Art"
description = "Exhibition now on view at The Met"
full_description = "For the 2024 Great Hall Commission, Taiwanese artist Tong Yang-Tze (born 1942, Shanghai, based in Taipei) has created two monumental works of Chinese calligraphy for the Museum’s historic space. Her project is the third in the series of commissions for The Met’s Great Hall and the artist’s first major project in the United States.Tong is one of the most celebrated artists working exclusively in calligraphy today. Best known for making calligraphy in monumental scale, Tong brings Chinese characters into dialogue with three-dimensional space and pushes the conceptual and compositional boundaries of the art form, while remaining dedicated to calligraphy’s raison d’être as the art of writing. Her commitment to the written characters is rooted in her belief in their centrality in Chinese culture and calligraphy’s capacity for visual, emotional, and social impact beyond linguistic barriers. Working on the floor in her home, she manipulates the movement and tension in the brushstrokes, the foremost quality in calligraphy. The oversized characters pose physical, formal, and conceptual challenges, while they offer new compositional possibilities and viewing experience.The Great Hall Commission is part of The Met’s series of contemporary commissions in which the Museum invites artists to create new works of art, establishing a dialogue between the artist’s practice, The Met collection, the physical Museum, and The Met’s audiences.The exhibition is made possible by the Director’s Fund, Mr. T.H. Tung, Oscar L. Tang and H.M. Agnes Hsu-Tang, and Jenny Yeh, Winsing Arts Foundation.EventsView allA slider containing 1 items.Press the down key to skip to the last item.Impact and Articulation: Calligraphy as Language and FormMarch 20 6:00 PMThe Met Fifth AvenueFeatured ContentReadThe Monumental Calligraphy of Tong Yang-TzeExplore how the Taiwanese artist’s Great Hall Commission invites a transhistorical conversation about the art of writingTong Yang-Tze (Taiwanese, born 1942, Shanghai). Stones from other mountains can refine our jade, 2024. Ink on paper, 11.80 x 23.82 ft. (360.1 x 726.4 cm). Courtesy the artist. © At Ease Studio"
