["https://metmuseum.org/exhibitions/embracing-color"]
title = "Embracing Color: Enamel in Chinese Decorative Arts, 1300–1900 - The Metropolitan Museum of Art"
description = "Exhibition now on view at The Met"
full_description = "Enamel decoration is a significant element of Chinese decorative arts that has long been overlooked. This exhibition reveals the aesthetic, technical, and cultural achievement of Chinese enamel wares by demonstrating the transformative role of enamel during the Ming (1368–1644) and Qing (1644–1911) dynasties. The first transformational moment occurred in the late 14th to 15th century, when the introduction of cloisonné enamel from the West, along with the development of porcelain with overglaze enamels, led to a shift away from a monochromatic palette to colorful works. The second transformation occurred in the late 17th to 18th century, when European enameling materials and techniques were brought to the Qing court and more subtle and varied color tones were developed on enamels applied over porcelain, metal, glass, and other mediums. In both moments, Chinese artists did not simply adopt or copy foreign techniques; they actively created new colors and styles that reflected their own taste. The more than 100 objects on view are drawn mainly from The Met collection.Rotation 1: July 4, 2022-April 30, 2023Rotation 2: May 20, 2023–March 24, 2024 Rotation 3: April 13, 2024–February 16, 2025Rotation 4: March 1, 2025–January 4, 2026This exhibition is made possible by the Florence and Herbert Irving Fund for Asian Art Exhibitions.This exhibition is part of Festival of New York, a citywide celebration featuring 200+ diverse organizations with events and exhibitions from Memorial Day to Labor Day 2022.Exhibition ObjectsView allA slider containing 3 items.Press the down key to skip to the last item.Covered box with hibiscus and grapevinesChinamid-15th centuryBottle with lotuses Chinalate 15th centuryBasin with lotus pondChinalate 15th centuryMarquee: Covered box with hibiscuses and grape vines (detail). China, Ming dynasty (1368–1644), mid-15th century. Cloisonné enamel. The Metropolitan Museum of Art, New York, Promised Gift of Clara and Theodore Wang"
