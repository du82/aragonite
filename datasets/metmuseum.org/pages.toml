["https://metmuseum.org/about-the-met/collection-areas/the-robert-lehman-collection"]
title = "The Robert Lehman Collection | The Metropolitan Museum of Art"
description = "The Robert Lehman Collection is one of the most distinguished privately assembled art collections in the United States."
full_description = '''The Robert Lehman Collection The Robert Lehman Collection is one of the most distinguished privately assembled art collections in the United States. Robert Lehman's bequest to The Met, a collection of extraordinary quality and breadth acquired over the course of sixty years, is a remarkable example of twentieth-century American collecting. Spanning seven hundred years of western European art, from the fourteenth to the twentieth centuries, the 2,600 works include paintings, drawings, manuscript illumination, sculpture, glass, textiles, antique frames, maiolica, enamels, and precious jeweled objects. The collection of approximately three hundred paintings is particularly rich in the field of the Italian Renaissance, notably the Sienese school, as well as early Northern European works. Included in the 750 Old Master drawings ranging from the fifteenth to the twentieth centuries is a significant group of eighteenth-century Venetian works, as well as other distinguished Italian, French, and Northern European examples. The collection is also renowned in several areas of decorative arts: Renaissance maiolica, Venetian glass, and antique frames. Robert Lehman's parents, Philip and Carrie Lehman, laid the foundation for the collection around 1905, when they began acquiring works of art for their recently completed townhouse on West 54th Street in New York City. Robert Lehman assembled his collection with scholarly knowledge, astute connoisseurship, and skillful negotiation of the art market. Upon his death in 1969, he bequeathed 2,600 works to The Met with the stipulation that they be exhibited as a private collection, reflecting his belief that "important works of art, privately owned, should be beyond one's own private enjoyment and [that] the public at large should be afforded some means of seeing them." A new wing, erected to display the collection, opened to the public in 1975. The Robert Lehman Wing includes a central skylit gallery surrounded by a series of rooms intended to recreate the Lehman family residence. Velvet wall coverings, draperies, furniture, and rugs evoke the ambience of private interiors and serve as a backdrop for this extraordinary collection. Read more about the history of the collection. Collection Highlights View all artworks within The Robert Lehman Collection. Related Content Publications Discover The Met's many publications related to the Robert Lehman Collection. Heilbrunn Timeline of Art History Browse richly illustrated essays on objects in the Robert Lehman Collection. Blog Articles Read fresh perspectives on works in the Robert Lehman Collection from curators and others at the Museum. Videos Watch videos about the Robert Lehman Collection—interviews, lectures, exhibition previews, and more. Stay Connected Meet the Staff Meet the Staff Get to know the people who care for the art. Meet the Fellows Meet the Fellows Meet the Robert Lehman Collection fellows.'''
