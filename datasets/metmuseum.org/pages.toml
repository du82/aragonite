["https://metmuseum.org/exhibitions/ink-and-ivory-indian-drawings-and-photographs-selected-with-james-ivory"]
title = "Ink and Ivory: Indian Drawings and Photographs Selected with James Ivory - The Metropolitan Museum of Art"
description = "Exhibition now on view at The Met"
full_description = "This focused exhibition presents a selection of superlative drawings from the courts and centers of India and Pakistan (with a few related Persian works) dating from the late sixteenth to the twentieth century. These works are mainly selected from The Met collection in partnership with film director James Ivory, whose recent gift to the Museum of nineteenth-century photograph albums will also be featured in the exhibition (2021.381.1-16). The drawings will include fresh and informal preparatory exercises for paintings as well as beautifully finished works in their own right. The photographs will present the subject matter and styles that came about in the contexts of royal patronage and ceremony; views of architecture, cities, landscapes, and people, among others. As an artist and filmmaker, James Ivory will help us appreciate this material through his unique gaze. A short film — An Arrested Moment — directed by Dev Benegal, will accompany the show.The exhibition is made possible by The Hagop Kevorkian Fund.Additional support is provided by the Lavori Sterling Foundation Endowment Fund.EventsView allA slider containing 1 items.Press the down key to skip to the last item.Met Expert Talks—Ink and Ivory: Indian Drawings and Photographs Selected with James IvoryApril 1 3:00 PMThe Met Fifth AvenueBuffaloes in Combat (detail), Attributed to Miskin, India, Mughal, late sixteenth century, Ink,watercolor, and gold on paper, Harris Brisbane Dick Fund, 1983 (1983.258)"
