["https://metmuseum.org/about-the-met/internships/undergraduate-and-graduate-students"]
title = "Internships for Undergraduate and Graduate Students | The Metropolitan Museum of Art"
description = "Summer Internships for Undergraduate and Graduate Students    Ten-week paid summer internships for undergraduate and graduate students and recent graduates at The Met Fifth Avenue and The Met Cloisters."
full_description = "Internships for Undergraduate and Graduate Students Join a community of interns to gain professional skills and learn about museum practice. The Met has over forty department areas that host interns from a wide variety of academic backgrounds. These internships are available to undergraduate and graduate students, as well as recent graduates. Internships for high school students are also available. Undergraduate and Graduate Internships are made possible by Adrienne Arsht. Additional support is provided by Jack and Susan Rudin, gifts in honor of Emily K. Rafferty, The Tiffany & Co. Foundation, Judith Lee Stronach and Raymond Lifchez, Marilyn M. Simpson Charitable Trust, Ittleson Foundation, The Thorne Foundation, Mary Jaharis, Mr. and Mrs. Richard R. Chilton, Jr., Nellie and Robert Gipson, The Billy Rose Foundation, Winston Foundation, and Stefan Soloviev. Summer Internships for Undergraduate and Graduate Students Ten-week paid summer internships for undergraduate and graduate students and recent graduates at The Met Fifth Avenue and The Met Cloisters. Long-Term Internships for Recent Graduates Nine-month and twelve-month paid internships (beginning in the summer) at The Met Fifth Avenue. Fall- and Spring-Semester Internships for Undergraduate and Graduate Students Ten-week paid fall- and spring-semester internships at The Met Fifth Avenue and The Met Cloisters for students currently enrolled in degree-granting programs or recent graduates. Graduate Internships in Objects Conservation Internships for graduate students in The Met's Department of Objects Conservation, a dynamic and diverse department with over twenty-five full-time conservators. Interns work alongside and learn from conservators under whose supervision they carry out in-depth treatment on a broad range of materials. Graduate Internships in Paper Conservation Internships for graduate students in The Met's Department of Paper Conservation, a dynamic and diverse department with over twenty-five full-time conservators. Interns work alongside and learn from conservators under whose supervision they carry out in-depth treatment on a broad range of materials. Internships in Scientific Research Internships in The Met's Department of Scientific Research (DSR) offer undergraduate and graduate students opportunities to learn about the intersection of science and art, and develop practical skills working in a world-class cultural heritage science laboratory. Current and Former Undergraduate and Graduate Interns Learn about former intern projects and placements and connect with current and former interns. Departmental Placement Descriptions Learn about the Museum departments and areas that often host undergraduate and graduate interns. Frequently Asked Questions Information about program eligibility, deadlines, interviews, notification, housing, and other application-related questions."
