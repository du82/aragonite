["https://metmuseum.org/exhibitions/caspar-david-friedrich-the-soul-of-nature"]
title = "Caspar David Friedrich: The Soul of Nature - The Metropolitan Museum of Art"
description = "Exhibition now on view at The Met"
full_description = "Caspar David Friedrich (1774–1840) reimagined European landscape painting by portraying nature as a setting for profound spiritual and emotional encounters. Working in the vanguard of the German Romantic movement, which championed a radical new understanding of the bond between nature and the inner self, Friedrich developed pictorial subjects and strategies that emphasize the individuality, intimacy, open-endedness, and complexity of our responses to the natural world. The vision of the landscape that unfolds in his art—meditative, mysterious, and full of wonder—is still vital today. Caspar David Friedrich: The Soul of Nature is the first comprehensive exhibition dedicated to the artist held in the United States. Organized in cooperation with the Alte Nationalgalerie of the Staatliche Museen zu Berlin, Staatliche Kunstsammlungen Dresden, and Hamburger Kunsthalle, with unprecedented loans from more than 30 lenders in Europe and North America, the exhibition presents approximately 75 works by Friedrich. Oil paintings, finished drawings, and working sketches from every phase of the artist’s career, along with select examples by his contemporaries, illuminate how Friedrich developed a symbolic vocabulary of landscape motifs to convey the personal and existential meanings that he discovered in nature. The exhibition situates Friedrich’s art within the tumultuous politics and vibrant culture of 19th-century German society and, by extension, highlights the role of German Romanticism in shaping modern perceptions of the natural world.The exhibition is complemented by a display of artworks featuring lunar imagery in gallery 554, located just beyond the exhibition exit. The moon—a motif cherished by Caspar David Friedrich and other Romantic artists—was celebrated across various media, including paintings, porcelain, music, and poetry.The exhibition is made possible by Marina Kellen French.Additional support is provided by the Janice H. Levin Fund, Art Mentor Foundation Lucerne, Barbara A. Wolfe, an Anonymous Foundation, The International Council of The Metropolitan Museum of Art, and Trevor and Alexis Traina.Corporate sponsorship is provided by Sparkassen-Finanzgruppe and Allianz X.This exhibition is supported by an indemnity from the Federal Council on the Arts and the Humanities.The catalogue is made possible by the Wolfgang Ratjen Stiftung, Liechtenstein, and the Drue E. Heinz Fund.Additional support is provided by the Tavolozza Foundation, Hubert and Mireille Goldschmidt, and Elizabeth Marsteller Gordon. To access a large-print version of the exhibition text, click hereExhibition CatalogueThis generously illustrated volume explores the career of Caspar David Friedrich, the German landscape painter whose emotionally profound visions of nature are among the most iconic works of Romantic art.Buy nowEventsView allA slider containing 10 items.Press the down key to skip to the last item.Curator Talk—Caspar David Friedrich: The Soul of NatureMarch 6 11:00 AMThe Met Fifth AvenueTeen Studio—Landscape Painting: Connecting with Nature (Ages 12–14)March 15 10:30 AMThe Met Fifth AvenueTeen Studio—Landscape Painting: Connecting with Nature (Ages 15–18)March 15 2:00 PMThe Met Fifth AvenueStudio Workshop—Reflecting on Nature in WatercolorMarch 22 2:00 PMThe Met Fifth AvenueSunday at The Met—Caspar David Friedrich: The Soul of NatureMarch 30 2:00 PMThe Met Fifth AvenueDrop-in Drawing—Meditative LandscapesApril 4 6:00 PMThe Met Fifth AvenueMet Expert Talks—Caspar David Friedrich: The Soul of NatureApril 10 3:00 PMThe Met Fifth AvenueSight and Sound: Leon Botstein and The Orchestra NowApril 13 2:00 PMThe Met Fifth AvenueMet Expert Talks—Caspar David Friedrich: The Soul of NatureMay 8 3:00 PMThe Met Fifth AvenueSight and Sound: Leon Botstein and The Orchestra NowMay 18 2:00 PMThe Met Fifth AvenueFeatured ContentReadGet closer to Friedrich's artCelebrating the 250th anniversary of Caspar David Friedrich’s birth, three institutions present a digital resource of roughly 250 works to honor Germany’s most famous Romanticist painter.Read / ListenSounds of the SublimeThe sound recordist Martyn Stewart imagines the auditory world of Friedrich’s landscapes.ReadNow Beacon, Now SeaThe poet Jennifer Franklin responds to Friedrich’s painting Monk by the Sea.ReadWinter in the Newest WorldThe poet Emily Pittinos responds to Friedrich’s painting Two Men Contemplating the Moon.Caspar David Friedrich (German, 1774–1840). Wanderer above the Sea of Fog, ca. 1817. Oil on canvas, 37 3/8 × 29 1/2 in. (94.8 × 74.8 cm). Hamburger Kunsthalle, on permanent loan from the Stiftung Hamburger Kunstsammlungen, acquired 1970 (HK-5161). Photo Elke Walford"
