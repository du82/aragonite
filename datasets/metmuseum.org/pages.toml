["https://metmuseum.org/about-the-met/conservation-and-scientific-research/conservation-stories/history-of-conservation"]
title = "Caring for The Met: 150 Years of Conservation | The Metropolitan Museum of Art"
description = "This 1880 illustration from Harper’s New Monthly Magazine shows Charles Baillard—a trained watchmaker, and the first truly recognizable figure in the history of conservation practice at the Museum—working on stone sculpture in the Cesnola Collection."
full_description = '''Caring for The Met: 150 Years of Conservation Deborah Schorsch, Conservator, Department of Objects Conservation Repair Shop, November 4, 1936. During the first seventy years of the Museum’s existence, most works of art other than paintings were stabilized and restored by skilled craftsmen and semi-skilled workmen, in workshops such as this one under the supervision of the building superintendent. Introduction Since 1870, The Metropolitan Museum of Art has dedicated substantial resources to the preservation, technical study, and safe display of its collection. Today, nearly one hundred conservators, conservation scientists, and conservation preparators are tasked with these responsibilities, building upon the efforts of a diverse ensemble of craftsmen, restorers, scientists, directors, and curators working in dispersed workshops, laboratories, curatorial offices, and departmental study rooms throughout the building during the Museum’s earlier years. This 1880 illustration from Harper’s New Monthly Magazine shows Charles Baillard—a trained watchmaker, and the first truly recognizable figure in the history of conservation practice at the Museum—working on stone sculpture in the Cesnola Collection. Conservator Linda Borsch treating a late Classical Greek funerary stele in 1997. Present-day conservation specialists work in studios and laboratories situated in independent departments dedicated to objects (three-dimensional works of art), paintings, works on paper, photographs, textiles, and scientific research, and in The Costume Institute, Thomas J. Watson Library, and the Departments of Arms and Armor; Arts of Africa, Oceania, and the Americas (for textiles); and Asian Art (for East Asian paintings). Several themes exemplify the development of conservation practice at The Met. The impact of charismatic and progressive directors and curators was significant in earlier years, before the field of conservation emerged as a distinct profession with well-trained practitioners. Nowadays conservators receive rigorous interdisciplinary academic and practical training, and they cultivate skills and knowledge to gain competency in one or more of a wide range of sub-specialties. This sets them apart from the diverse cohort of early practitioners who were often self-taught, though not necessarily unskilled, and who wore multiple hats. The emergence of conservation as an academic profession has fostered collaboration among the conservation departments, including the Department of Scientific Research, and scholarly exchange and collaboration with curatorial staff and educators. Conservation and conservation science play a role in every aspect of the Museum’s core mission to "[collect, study, conserve, and present] significant works of art across all times and cultures in order to connect people to creativity, knowledge, and ideas." Perhaps the most significant change in the field of conservation, particularly over the last six decades, is the evolution of a sensibility that privileges the primacy of the works of art as an expression of the artist’s intent, and their manufacture and materials as a reflection of technological style. MMA, Interior Shops, Upholstery Shop, Wing F, Basement, 1926. In the days of the workshops, women apparently only worked with textiles of various kinds, including upholstery and tapestries. Kathryn Gill, the Museum’s first professional upholstery conservator, treats one of two settees from the Seehof suite in 1988. The number of women in all conservation specialties has grown exponentially over the decades. I. The Early Years: "They Also Serve" (1870–1940) During its first seven decades, most tasks relating to the preservation, restoration, and mounting of artworks were carried out by craftsmen (and the occasional woman) in workshops on the Museum’s ground floor under the aegis of a superintendent, who also managed the shops for the carpenters, metalworkers, and other workmen who maintained the building and its furnishings. In 1906, the Department of Egyptian Art was established, and a team was sent to excavate at Thebes in Upper Egypt. Over the next thirty years, the Museum acquired thousands of artifacts from excavations there and elsewhere in Egypt. This influx of highly unstable new finds spurred the Museum to seek out means of stabilizing them. Scientists such as William E. Kuckro (d. 1961) and Colin G. Fink (1881–1953) were engaged to investigate the deterioration and preservation of archaeological stone artifacts and archaeological bronzes. Fink’s electrochemical methods were adopted all over the world but now are long out of favor. As a result of his quest for permanency at any cost, the metal artifacts that he treated are chemically stable for the most part but have unattractive surfaces that evoke neither their original nor as-excavated appearance. Sometimes it was necessary to stabilize newly excavated finds granted the Museum before they could be transported. In this 1924 footage from the Museum’s excavation at Thebes, Egyptologist Herbert E. Winlock applies wax consolidants to a wooden coffin and removes the excess. These scientific consultants were engaged by the Museum's third director, Edward Robinson (1858–1931), a classical archaeologist by training. During his twenty-one-year tenure (1910–31), he brought new analytical and imaging tools to bear on questions of authenticity, dating, and the extent of prior restorations. The expanding role of science is seen in Robinson's call in 1925 for a national laboratory to ensure that the treatment of artworks would be of “the highest scientific character.” His successor, Egyptologist Herbert E. Winlock (1888–1950), who himself stabilized new finds while on site, corresponded regularly with preservation specialists on thorny problems, and when he became director in 1932, hired Arthur H. Kopp (1900–1938), the Museum’s first resident scientist. Kopp continued Fink’s research into electrochemical methods, but also devoted much time to restoring and analyzing objects of metal, stone, faience, and other materials, and his activities are well documented in laboratory notebooks that continue to serve as a valuable staff resource. The Museum avoided hiring a resident scientist for decades following Kopp’s death in a laboratory fire. Starting in the late 1920s while still a curator at The Cloisters, James J. Rorimer (1905–1966), the Museum’s sixth director, also personally carried out a variety of treatments and technical investigations. James Rorimer, before he became director in 1955, was actively engaged in both restoration work and technical research. The ivory panel in the frontispiece of his groundbreaking 1931 study on the examination of works of art using ultraviolet light was hand colored to reflect its appearance when illuminated. Rorimer’s legacy lives on in multiband spectral imaging, a recently codified suite of photographic processes used for recording condition, documenting prior and new treatments, technical examination, and preliminary materials characterization. Conservator Anna Serotta (right) and Mellon Fellow Chantal Stein document traces of Egyptian blue pigment on the Museum’s Assyrian limestone reliefs in the Ancient Near Eastern Art galleries using visible-induced infrared luminescence imaging. The Department of Paintings was established in 1886. With notable exceptions—for example, curator Roger Fry (1866–1934) was defended in a 1906 article of the Museum’s Bulletin for his cleaning of a Rubens painting that had been publicly criticized by the director of the Albright Art Gallery in Buffalo—care of this collection fell to freelance paintings restorers such as H. A. Hammond Smith (1860–1927) and Stephen S. Pichetto (1887–1949), who enjoyed a more elevated status (and a third-floor studio with natural daylight) than the artisans working on other materials on the ground floor. Fry was the first curator, though certainly not the last, who restored works in the Museum's collection, often with unfortunate results. The incident with the Rubens painting, and its attendant press, reflected the public interest in restoration work carried out at The Met. Scrutiny in this case was minor compared to a media frenzy that started in 1890 and lasted for several years after public allegations that Cypriot stone sculpture in the Cesnola Collection had been fraudulently restored by Charles Baillard (d. 1916), the Museum's first restorer. Interior, Shops, Painters Restorer’s Studio, Wing B, Floor III, 1936. A master at self-promotion, self-taught but highly respected, Stephen S. Pichetto offered his services as a paintings restorer to the Museum in 1929 and worked there on a part-time basis until his death in 1949. He is seen here working on Raphael’s Agony in the Garden. The press on the left was used for the now outdated practice of attaching rigid supports known as cradles to the reverse of panel paintings. George Bisacca, a conservator specializing in the care of panel paintings, in 2007 before the most recent refurbishment of the Paintings Conservation studios. During his decades at the Museum, Bisacca not only maintained the collection—which included treating paintings suffering the deleterious effects of being attached to old-fashioned cradles—but also helped introduce modern practice to frame conservation. In 2009, the Museum’s first gilding conservator dedicated to frames joined the department. International specialists were engaged for specific projects. Many archaeological metal objects were sent to the renowned Parisian firm of Léon André for cleaning and restoration; Japanese craftsmen Okabe Kakuya (1873–1918) and Rokkaku Shisui (1867–1950), who had worked previously at the Museum of Fine Arts, Boston, treated the Museum’s collection of Japanese metal, lacquer, and wood sculpture in 1908. After serving in an honorary capacity in the Decorative Arts Department, Renaissance man and collector Bashford Dean (1867–1928) was appointed curator in the Department of Arms and Armor upon its establishment in 1912. Jacob Merkert (d. 1933) had maintained the collection since 1894, but Dean saw the need for a trained armorer who could reproduce missing and damaged steel components. In 1909, he hired a Frenchman, Daniel Tachaux (1857–1928), heir to the traditional practice of armor making in Europe. Until 1919, Tachaux worked both at the Museum and in Dean’s private armory in his home. The German armorer Leonard Hugel (1877–ca. 1935) and his nephew Leonard Heinrich (ca. 1900–1966) continued the same arrangement until Dean’s death in 1928, when they came to work full-time in the Museum, joined by a local man, Harvey Murton (1907–2004), who trained in Dean’s armory from age twelve. In keeping with the workshop practices of the day, artists and craftsmen restored other works in the diverse collection: Stanley J. Rowland (1891–1964), for example, a draftsman who went on to become a successful mural painter, treated polychrome wood shields. MMA Interiors, Workshops, Armor Repair Shop, Wing E Room 105, Basement Floor, 1937. Seen here are armorers Harvey Murton (far left) and Leonard Heinrich (second from right). II. The Middle Years: Consolidation (1940–1960) In 1940, Francis Henry Taylor (1903–1957), the Museum's fifth director, arrived from the Worcester Art Museum, bringing with him a tradition of conservation innovation fostered in the Boston area by Harvard's Fogg Art Museum. He requested a curatorial investigation into the Museum's restoration practices and learned that the “repair” of three-dimensional works, including metal, stone, ceramics, and furniture, was carried out by men who for the most part were self-trained—having been promoted from maintenance positions—working under the direction of the building superintendent. The report further stated: “Quality of work generally satisfactory to curators. Working conditions poor. Technical direction, as distinct from mechanical supervision, practically non-existent.” In addition to active service, many members of the Museum's staff contributed to the war effort during World War II. Most famously, James Rorimer was among the "Monuments Men"—there were also women, one of whom, Edith Standen (1905–1998), later became a curator of textiles at the Museum—who secured artworks looted during World War II. Closer to home, conservator Murray Pease (1903–1964) played an important role in safeguarding works endangered in the event of a direct attack on the North American mainland. A singular contribution to the war effort, however, was that of the Museum's armorers, who worked with curators in the Department of Arms and Armor, as they had during World War I, to design and produce prototypes for defensive armors at the request of the United States government. Leonard Heinrich working on a helmet for the United States Army, 1942–45. Having contributed to the war effort during World War II, Heinrich applied his expertise, hand skills, and Tachaux's tools to designing and fabricating a suit of armor that Ingrid Bergman wore in the title role of the 1948 film Joan of Arc. Made of aluminum, the armor weighs about one third of what a similar suit in steel might weigh. In 1941, Taylor had named Pease, a Fogg alumnus, associate curator of the Sub-Department of Conservation and Technical Research, charging him to create a centralized department for conservation. Together, they laid the foundation for modern conservation practice through the introduction of standardized “request for treatment” forms, protocols for documentation, condition checks for outgoing loans, and handling guidelines, which formed the basis of the 1946 publication, Care and Handling of Art Objects, by registrar Robert Sugden (1908–1953). The most recent update, combining the expertise of more than sixty conservators, curators, and other museum specialists, was published on the Museum’s website in 2020. In 1949, the sub-department was renamed Technical Laboratory and granted full departmental status; Pease was appointed Conservator in 1956, the first time this title was used in the Museum. Pease was trained in the restoration of paintings, and his interests and expertise also extended to technical research. He made few changes in the treatment of three-dimensional objects, and having combined the existing workshops, he still supervised the same craftsmen already working in the Museum. In 1947, he hired an assistant, Kate Lefferts (1911–2000), who managed the Laboratory and restored paintings. Unlike Lefferts and two specialists for paintings who were also hired in the 1940s, employees in the workshops were not mentioned in the Museum's annual reports until the early 1960s, despite Pease's attempts to raise their salaries and status. They remain for the most part anonymous. Although Pease had stressed the need for trained scientific staff, it was only in 1970 that Pieter Meyers was engaged as a research chemist. Starting in the 1920s, Alan Burroughs, a pio'''
