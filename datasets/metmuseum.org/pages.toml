title = "About The Met - The Metropolitan Museum of Art"
description = "The Met presents over 5,000 years of art from around the world for everyone to experience and enjoy."
full_description = "About The Met The Met presents over 5,000 years of art from around the world for everyone to experience and enjoy. About the Museum The Metropolitan Museum of Art presents over 5,000 years of art from around the world for everyone to experience and enjoy. The Museum lives in two iconic sites in New York City—The Met Fifth Avenue and The Met Cloisters. Millions of people also take part in The Met experience online. Since its founding in 1870, The Met has always aspired to be more than a treasury of rare and beautiful objects. Every day, art comes alive in the Museum's galleries and through its exhibitions and events, revealing new ideas and unexpected connections across time and across cultures. Mission Statement The Metropolitan Museum of Art collects, studies, conserves, and presents significant works of art across time and cultures in order to connect all people to creativity, knowledge, ideas, and one another. ABOUT THE MET History of the Museum ABOUT THE MET Leadership ABOUT THE MET Collection areas ABOUT THE MET Conservation and research ABOUT THE MET Policies and documents ABOUT THE MET Contact information ABOUT THE MET Press Get involved ABOUT THE MET Volunteer ABOUT THE MET Support The Met ABOUT THE MET Career opportunities ABOUT THE MET Internships ABOUT THE MET The Met Fellowship Program"
