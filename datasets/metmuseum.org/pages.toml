["https://metmuseum.org/exhibitions/ganesha"]
title = "Ganesha: Lord of New Beginnings - The Metropolitan Museum of Art"
description = "Exhibition now on view at The Met"
full_description = "Ganesha, the son of Shiva and Parvati, is a Brahmanical (Hindu) diety known to clear a path to the gods and remove obstacles in everyday life. He is loved by his devotees (bhakti) for his many traits, including his insatiable appetite for sweet cakes and his role as a dispenser of magic, surprise, and laughter. However, Ganesha is also the lord of ganas (nature deities) and can take on a fearsome aspect in this guise.The seventh- to twenty-first-century works in this exhibition trace his depiction across the Indian subcontinent, the Himalayas, and Southeast Asia. Featuring 24 works across sculptures, paintings, musical instruments, ritual implements, and photography, the exhibition emphasizes the vitality and exuberance of Ganesha as the bringer of new beginnings.Rotation 1: November 19, 2022–June 11, 2023Rotation 2: June 17, 2023–June 11, 2024Rotation 3: June 13, 2024–June 17, 2025Rotation 4: June 19, 2025–January 4, 2026The exhibition is made possible by the Florence and Herbert Irving Fund for Asian Art Exhibitions.Exhibition ObjectsView allA slider containing 4 items.Press the down key to skip to the last item.Dancing GaneshaIndia, Madhya Pradeshca. 10th centuryGaneshaIndia, Tamil Nadu12th centuryShiva as Lord of Dance (Shiva Nataraja)India, Tamil Nadulate 12th–early 13th centuryTamburaIndian19th centuryMarquee: Seated Ganesha, 14th–15th century. India (Orissa). Ivory, H. 7 1/4 in. (18.4 cm). The Metropolitan Museum of Art, New York. Gift of Mr. and Mrs. J. J. Klejman, 1964 (64.102)"
year_published = 2025
clearnet = "https://metmuseum.org/exhibitions/ganesha"
