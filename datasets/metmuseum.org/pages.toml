["https://metmuseum.org/exhibitions/jesse-krimes-corrections"]
title = "Jesse Krimes: Corrections - The Metropolitan Museum of Art"
description = "Exhibition now on view at The Met"
full_description = "Photography has played a key role in structuring systems of power in society, including those related to crime and punishment. This exhibition presents immersive contemporary installations by the artist Jesse Krimes (American, b. 1982) alongside nineteenth-century photographs from The Met collection by the French criminologist Alphonse Bertillon, who developed the first modern system of criminal identification before the adoption of fingerprinting.Krimes’s image-based installations, made over the course of his six-year incarceration, reflect the ingenuity of an artist working without access to traditional materials. Employing prison-issued soap, hair gel, playing cards, and newspaper he created works of art that seek to disrupt and recontextualize the circulation of photographs in the media. Displayed at The Met in dialogue with Bertillon, whose pioneering method paired anthropomorphic measurements with photographs to produce the present-day mug shot, Krimes’s work raises questions about the perceived neutrality of our systems of identification and the hierarchies of social imbalance they create and reinscribe. An artist for whom collaboration and activism are vital, Krimes founded the Center for Art and Advocacy to highlight the talent and creative potential among individuals who have experienced incarceration and to support and improve outcomes for formerly incarcerated artists.The exhibition is made possible by Joyce Frank Menschel.Featured ContentEventsView allA slider containing 2 items.Press the down key to skip to the last item.Met Expert Talks—Jesse Krimes: CorrectionsApril 3 3:00 PMThe Met Fifth AvenueMet Expert Talks—Jesse Krimes: CorrectionsMay 1 3:00 PMThe Met Fifth AvenueJesse Krimes (American, b. 1982). Purgatory (detail), 2009. Soap, ink, playing cards, dimensions variable. The Metropolitan Museum of Art, New York, Purchase, Vital Projects Fund Inc. Gift, through Joyce and Robert Menschel, and Alfred Stieglitz Society Gifts, 2024 © Jesse Krimes"
year_published = 2025
clearnet = "https://metmuseum.org/exhibitions/jesse-krimes-corrections"
