["https://metmuseum.org/about-the-met/internships/high-school"]
title = "High School Internships | The Metropolitan Museum of Art"
description = "School-Year High School Internships    This internship program offers paid opportunities for students in grade 10 or 11 and who either reside in or attend a high school or home school in New York City. The program allows them to connect with arts, museum, and creative professionals as they develop professional skills, network, and gain work experience during the academic year."
full_description = "High School Internships Calling all artists and art enthusiasts, writers, thinkers, and designers! Interested in finding out about careers in museums? Apply for a high school internship at The Met to meet experts, find mentors, make friends, gain professional experience, and more. Want to stay connected and learn more about upcoming programs and events? Follow @metteens on Facebook, Instagram, and Twitter. Internships for College and Graduate Students are also available. School-Year High School Internships This internship program offers paid opportunities for students in grade 10 or 11 and who either reside in or attend a high school or home school in New York City. The program allows them to connect with arts, museum, and creative professionals as they develop professional skills, network, and gain work experience during the academic year. Summer High School Internships This internship program offers paid opportunities for students who will be rising juniors or rising seniors at the beginning of the internship and who either reside in or attend a high school or home school in New York, New Jersey, or Connecticut. This program allows them to connect with arts, museum, and creative professionals as they develop professional skills and experience during the summer. Frequently Asked Questions Have a question about the high school internships? Learn more about eligibility, deadlines, interviews, notification, and other application-related information. Support for High School Internships is provided by Mr. and Mrs. Marvin H. Schein, Joseph and Sylvia Slifka Fund for High School Internships, The Billy Rose Foundation, Inc., and The Zeldin Family Foundation."
