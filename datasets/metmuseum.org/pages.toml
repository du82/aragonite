["https://metmuseum.org/exhibitions/colorful-korea"]
title = "Colorful Korea: The Lea R. Sneider Collection - The Metropolitan Museum of Art"
description = "Exhibition now on view at The Met"
full_description = "Over the course of forty years, Lea R. Sneider (1925–2020) formed a significant collection of Korean art that challenged established norms. While appreciating literati art, she was particularly drawn to lively and colorful forms connected to everyday life, resulting in a diverse collection that illustrates Korea’s vibrant material culture. This exhibition features a substantial gift and loans from the Lea R. Sneider Collection, generously provided by her children. Through approximately 100 pieces from the fifth century to the present, including paintings, ceramics, furniture, textiles, and funerary and ritual objects, the exhibition highlights the pervasiveness of auspicious symbolism and the unpretentious dynamism in Korean art. Sneider has said that the works reflect the vitality and warmth of the people who engaged with them, a sentiment that her collection, with its emphasis on cultural and everyday relevance, underscores.The exhibition is made possible by the Ministry of Culture, Sports and Tourism of the Republic of Korea (MCST).Patchwork wrapping cloth (jogakbo), Korea, 1980-90s. Stitched silk on wrapped canvas. 33 x 28 3/8 in. (83.8 x 72.1 cm). Gift of the children of Lea R. Sneider, 2024 (2024.301.15)"
year_published = 2025
clearnet = "https://metmuseum.org/exhibitions/colorful-korea"
