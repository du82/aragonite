["https://metmuseum.org/exhibitions/look-again-european-paintings-1300-1800"]
title = "Look Again: European Paintings 1300–1800 - The Metropolitan Museum of Art"
description = "Exhibition now on view at The Met"
full_description = "The reopened galleries dedicated to European Paintings from 1300 to 1800 highlight fresh narratives and dialogues among more than 700 works of art from the Museum’s world-famous holdings. The newly reconfigured galleries—which include recently acquired paintings and prestigious loans, as well as select sculptures and decorative art—will showcase the interconnectedness of cultures, materials, and moments across The Met collection.The chronologically arranged galleries will feature longstanding strengths of the collection—such as masterpieces by Jan van Eyck, Caravaggio, and Poussin; the most extensive collection of 17th-century Dutch art in the western hemisphere; and the finest holdings of El Greco and Goya outside Spain—while also giving renewed attention to women artists, exploring Europe’s complex relationships with New Spain and the Viceroyalty of Peru, and looking more deeply into histories of class, gender, race, and religion.The reopening of the suite of 45 galleries at the top of the Great Hall staircase follows a five-year project to replace the skylights. This monumental infrastructure project improves the quality of light and enhances the viewing experience for a new look at this renowned collection.Major support for Look Again: European Paintings 1300–1800 is provided by Candace K. and Frederick W. Beinecke.EventsView allA slider containing 1 items.Press the down key to skip to the last item.Met Escapes—Look Again: European Paintings 1300–1800March 18 2:00 PMThe Met Fifth AvenueLatest reviewsMagnificentThe Washington PostThe art event of the yearThe Wall Street JournalFeatured Contentwatch episode 1 Look Again: European Paintings 1300–1800—Venice and AntiquityJoin curators Stephan Wolohojian and Denise Allen for a closer look at Venetian painting and sculpture in the newly renovated and reinstalled European Paintings galleries at The Met, Look Again: European Paintings 1300-1800.watch episode 2Look Again: European Paintings 1300–1800—The Origins of LandscapeJoin curators Anna-Claire Stinebring and Joanna Seidenstein for a closer look at early Renaissance landscape painting in the newly renovated and reinstalled European Paintings galleries at The Met, Look Again: European Paintings 1300-1800.watch episode 3Look Again: European Paintings 1300–1800—Rembrandt: Restoring a MasterpieceJoin curator Adam Eaker and conservator Dorothy Mahon as they discuss the restoration of Rembrandt’s Artistotle with a Bust of Homer, 1653, now on view in the renovated and reinstalled European Paintings galleries at The Met, Look Again: European Paintings 1300-1800.watch episode 4Look Again: European Paintings—Rethinking Spain & The Spanish AmericasJoin curator David Pullins and conservator Jose Luis Lazarte Luna as they discuss the new approach to Spanish painting of the “Golden Age” in the renovated and reinstalled European Paintings galleries at The Met, Look Again: European Paintings 1300-1800.Marquee: Adélaïde Labille-Guiard (French, 1749–1803). Self-Portrait with Two Pupils, Marie Gabrielle Capet (1761–1818) and Marie Marguerite Carreaux de Rosemond (died 1788), 1785. Oil on canvas. 83 x 59 1/2 in. (210.8 x 151.1 cm). The Metropolitan Museum of Art, Gift of Julia A. Berwind, 1953 (53.225.5)"
