["https://metmuseum.org/about-the-met/collection-areas/ancient-near-eastern-art"]
title = "Ancient Near Eastern Art | The Metropolitan Museum of Art"
description = "The Met's collection of ancient Near Eastern art includes more than 7,000 works ranging in date from the eighth millennium B.C. through the centuries just beyond the time of the Arab conquests of the seventh century A.D."
full_description = "Ancient Near Eastern Art The Met's Department of Ancient Near Eastern Art cares for approximately 7,000 works ranging in date from the eighth millennium B.C. through the centuries just beyond the emergence of Islam in the seventh century A.D. Objects in the collection were created by people in the area that today comprises Iraq, Iran, Turkey, Syria, the Eastern Mediterranean coast, Yemen, and Central Asia. From the art of some of the world's first cities to that of great empires, the department's holdings illustrate the beauty and craftsmanship as well as the profound interconnections, cultural and religious diversity, and lasting legacies that characterize the ancient art of this vast region. History of the Department The Met began collecting art from ancient West Asia in the first decades after the Museum’s founding in 1870 despite the fact that a formal Department of Ancient Near Eastern Art was not created until 1956. Clay documents inscribed with cuneiform as well as cylinder and stamp seals were among the earliest acquisitions followed by Assyrian, Neo-Hittite, and Palmyrene sculptural reliefs. In 1917 and 1932 substantial gifts of monumental architectural sculptures from the Assyrian capital city of Nimrud (ancient Kalhu) entered the Met’s collection. The first group was gifted by the estate of J.P. Morgan along with a number of other notable objects from a wide geographical and chronological range. The second group, gifted by John D. Rockefeller, Jr., had been shipped to England in the 1840s and '50s by Austen Henry Layard, and installed in a specially constructed porch built at Canford Manor in Dorset, England, the home of Lady Charlotte Guest, who was a cousin and supporter of Layard. These reliefs from Nimrud, which were first installed in the Great Hall of the Museum, today form the core of the galleries for Ancient Near Eastern Art on the second floor in a space designed to evoke their original palace setting. The establishment in 1932 of the Department of Near Eastern Art—comprising objects from both the pre-Islamic and Islamic eras—stimulated an increase in acquisitions and also coincided with The Met’s emerging interest in archaeological excavations in the region. One season of excavation organized jointly with the German State Museums at the Parthian and Sasanian site of Ctesiphon in Iraq in 1931–2 resulted in additions of stucco and pottery to the collection. The museum acquired these and other excavated objects through the system of partage in which artifacts unearthed by foreign-led expeditions were divided between the excavators and the host or source country according to the local antiquities laws. Sometimes the Museum was represented in the field by curatorial staff and provided funding, receiving in return a portion of the finds. Other excavated objects entered the collection through gift, such as from the Colt family who had supported and participated in British excavations at Tell ed-Duweir (ancient Lachish); through purchase, such as objects excavated from Surkh Dum which were excavated by the Second Holmes Expedition sponsored by the American Institute for Persian (later Iranian) Art and Archaeology; or by exchange, such as objects excavated from Eridu by the Iraqi State Organization of Antiquities and Heritage and exchanged with Egyptian objects from The Met which entered the collections of the Iraq Museum. The collection continued to grow through participation in excavations, particularly in the 1950s and 1960s, at sites such as Nimrud, Nippur, and Hasanlu, and by the acquisition of objects that were gifted and purchased. In 1947 a significant acquisition transformed the nature and scope of the collection of the Department. This was a purchase of eleven works of art from the Estate of Joseph Brummer, part of a much larger sale to the Metropolitan of objects assembled by this internationally known antiquarian. A highlight among these pieces of extraordinary diversity, quality and importance was the head of Ur-Ningirsu, the Neo-Sumerian ruler of the late 3rd millennium B.C. It was later discovered that the head belonged originally to a statue now in the Louvre Museum in Paris, and in 1974 the head was rejoined to its body, allowing the complete statue to be exhibited at each museum for alternating four to five year intervals. In 1956, with a sizable collection of pre-Islamic West Asian antiquities and a renewed commitment to archaeological fieldwork in the Middle East, the Museum’s Trustees established an independent Department of Ancient Near Eastern Art under the guidance of Charles K. Wilkinson. Today the collection consists of roughly a third of excavated objects, a third acquired by gift and a third by purchase. More recently the department no longer seeks to acquire antiquities but hopes to grow in other ways. The Department Today The Department of Ancient Near Eastern Art aims to care for, promote, and provide access to ancient West Asian art in New York and around the world. Traditionally collecting ancient objects was seen as a major part of this work; however, we feel this is no longer appropriate in our field and in recent years the Department has increasingly turned its focus away from collecting and toward other projects, first a series of major exhibitions and publications focusing on large-scale regional interconnections that together have helped to shape the contemporary field of Ancient Near Eastern Art, and today the redesign and reinstallation of the Galleries for Ancient Near Eastern Art. This once-in-a-generation project is an opportunity to rethink narratives around objects in the collection, to tell new and more compelling stories, and to discuss the history of collecting and how these objects came to be at the museum in a more critical way. The department also continues to be engaged in academic research and to support fieldwork. In all these activities we seek to take a collaborative approach, consulting with and inviting participation from our colleagues in the field internationally and in the United States. Currently the department supports University of Pennsylvania's Lagash Archaeological Project at the site of al-Hiba. Further, since December 2016 it has been an increasingly important focus of the Department of Ancient Near Eastern Art to identify and develop outreach and engagement initiatives in response to the urgent geopolitical crises affecting the Middle East. On a fundamental level, engaging with a larger discourse outside our own department revitalizes our work and ensures it remains culturally significant. Engagement is not simply outward-focused—meaning, engaging visitors in our collections— but also reciprocal. Working collaboratively with organizations such as FreiMet, Narratio, and Ard Diyar, the department engages with the world beyond the museum, where the objects in our collection serve important functions and take on new lives. The Renovated Galleries The Met is undertaking a complete renovation of its galleries for Ancient Near Eastern and Cypriot Art, two of the Museum’s major ancient collections. Learn more about the renovation here. Explore the Collection Discover highlights and browse more works from ancient West Asia in the online collection var pageConfig = { searchApp: { name: 'blogArticleListingSearch', id: 'blogArticleListingSearch' }, searchParams: { blogId: 'ee62bfc5-b969-43be-a219-9653ddde9e21', facetType: 'featured', facetName: '' } }; window.pageData.add('pageConfig', JSON.stringify(pageConfig)); Related Content {{ article.postDate }} Continue Reading Related Content Publications Discover the department's many publications related to Ancient Near Eastern art. Heilbrunn Timeline of Art History Browse richly illustrated essays on Ancient Near Eastern art. Blog Articles Read fresh perspectives on Ancient Near Eastern art from curators and others at the Museum. Videos Watch videos on Ancient Near Eastern art at The Met—lectures, interviews, exhibition previews, and more. NYPL Dispatch 2 Kings, Dealers, and Librarians: The Story of a Statue of Shulgi Learn about the provenance of the Statue of Shulgi on loan to The Met by the New York Public Library. Bracelets Two Bracelets Reunited at The Met Learn about the provenance of two bracelets reunited in the Department of Ancient Near Eastern Art. For Families and Teachers The Art of the Ancient Near East: A Resource for Educators Learn about the art and culture of the Ancient Near East and get ideas to support the study of English language arts, math, science, social studies, world history, and visual arts. Stay Connected Newsletters Newsletters See the current and past newsletters. Staff Bios Meet the Staff Get to know the people who care for the art. Fellows Page Meet the Fellows Meet the Fellows and learn about their research. Curatorial Friends Group The Friends of Ancient Near Eastern Art brings together patrons and collectors in support of the department. @MetAncient Connect on Instagram with @MetAncient, a page dedicated to sharing ancient art from the Met’s collection."
