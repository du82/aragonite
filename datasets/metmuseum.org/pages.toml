title = "Access | The Metropolitan Museum of Art"
description = "Make The Met yours! Choose from a variety of services and exciting programs that are tailored to meet the needs of visitors with disabilities."
full_description = "Make The Met yours! Choose from a variety of services and exciting programs that are tailored to meet the needs of visitors with disabilities. Program times, audiences, and topics vary. See more programs and events, including events for visitors with disabilities, on the events calendar, or call 212-650-2010 or email access@metmuseum.org. Learn about workshops that welcome kids, teens, and adults with a range of abilities and learning styles, together with family and friends. Find out about programs in American Sign Language, with Sign Language interpretation, and with real-time captioning. The Museum welcomes comments and suggestions about how we might continue to improve our programs for visitors with disabilities. Please contact us at access@metmuseum.org or call 212-650-2010. Access Programs Education Department The Metropolitan Museum of Art 1000 Fifth Avenue New York, NY 10028-0198 Additional support is provided by the Estate of Doris Alperdt, Mellon Foundation, an Anonymous Foundation, The Moody Endowment, May and Samuel Rudin Family Foundation, Inc., Renate, Hans & Maria Hofmann Trust, Allene Reuss Memorial Trust, Jane B. Wachsler, The J.M. Foundation, William G. and Helen C. Hoffman Foundation, and The Murray G. and Beatrice H. Sherman Charitable Trust."
