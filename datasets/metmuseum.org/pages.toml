full_description = "Learning resources Whether you are looking for classes, lessons, or other learning opportunities, find your place at The Met. Kids and families Educators Students and scholars Kids and families The Met has so much to offer kids and their families. Look, learn, and create together during fun, interactive programs for kids of all ages and their parents or caregivers. Explore all programs ONGOING PROGRAMS Workshops and activities EVENTS Storytime #MetKids: Made for, with, and by kids Explore art, fun facts, and creative projects for families at home—inspired, tested, and approved by real kids. LISTEN Audio guides for kids and families MAPS AND GUIDES Gallery guides for kids and families ART AT HOME Download our coloring pages METKIDS DIY arts and crafts BLOGS #MetKids blog Educators Foster your students' learning and your own with workshops, events and programs, and online resources. Explore all programs EDUCATORS Curriculum resources GROUP VISITS Plan a school group tour Lesson plans for your classroom Find lesson plans that integrate learning about works of art in your classroom. LEARN WITH US Timeline of Art History ART The Met Collection EDUCATORS Programs for K–12 educators TEENS Programs for teens KIDS AND FAMILIES Programs for families Students and scholars Join an active community of students and scholars across all academic disciplines through internships and fellowships, and programs that inspire. Explore all programs GET INVOLVED Internships GET INVOLVED Fellowships Met Publications Get access to The Met's comprehensive publishing program with over 1,500 titles, including books, online publications, and Bulletins and Journals from the last five decades. MET STUDIES The Observant Eye MET STUDIES Career Insights STUDENTS AND SCHOLARS Curatorial Practice Programs TEENS Career Labs ONGOING PROGRAMS Teen programs"
