full_description = "Contact Us Take a moment to read how to contact us — doing so will reduce the time it takes for us to respond. The Mail & Guardian is both a newspaper and a website. Luke Feltham is the acting editor-in-chief of The Mail & Guardian. Letters that appear in the paper will automatically appear on the website, but the reverse does not necessarily apply. Newspaper Subscriptions: If you would like to subscribe to the The Mail & Guardian or if you want to query your current subscription, please click here. Telephone Numbers: JohannesburgPhone: +27 (0)11 250 7300Fax: +27 (0)11 250 7502 Cape TownPhone: +27 (0)21 426 0802 Email contacts: – Print Advertising – Online Advertising – Subscriptions – Arts or Entertainment – Books – Tenders and Notices – Letters – Newsdesk – Photography Website Contacts: – Online Editor – Technical Support – Online Advertising Address: Postal: PO Box 91667 Auckland Park Johannesburg 2006 South Africa Physical Our office is located at: The Metal Box25 Owl Street, Braamfontein WerfJohannesburg, 2001 Take action The Mail & Guardian Send a letter to the newspaper. Suggest a news story to the newspaper. Submit a listing for the arts and entertainment pages. Advertise in the paper or get a rate card. Submit a classified ad for the newspaper. The M&G Online and Partner Web Sites Send a letter to the Online Editor. Suggest a news story to the Online Editor. Submit a feature or comment piece to the Online Editor. Submit a listing to the Online Editor. Report a problem with the website. Advertise Online or get a rate card. Your problems and questions Unsubscribing from daily emailed newsletters: Open up the newsletter, click on the “Unsubscribe” link at the bottom of the newsletter and follow the instructions. Offensive comments: As a general rule we moderate all the comments that appear on our site, but on occasion we do miss things. If you do notice offensive comments please tell us, we will delete them. Writing for the M&G: You may submit your contribution if you believe an exception should be made for excellent writing or your work. PLEASE DONT ask to write for us. Rather send a 100-word (at most) outline of a proposed article, a 10-line (or shorter) summary of your experience and an example of your previous work (preferably, an internet link to the publication in which it appears). Please bear in mind that if we do accept work from you, you will be paid in South African rands at a standard rate determined by the M&G. Getting PR copy into the M&G: The M&G does not, under any circumstances, simply reprint press releases, so there is no point sending them to us for that purpose. They may however, be useful as background information to individual journalists. But it would be good if you took the trouble of finding out who the relevant journalists are before contacting us. Reprinting or republishing our Content: Please, before asking us for permission to use our copy, check whether the story in question has something like “Guardian”, “Reuters”, “AFP”, “Sapa” or “Irin” at the end of it. If it does, we can not give you the rights. If it is our copy then send your syndication requests to Sewela Mamphiswana."
