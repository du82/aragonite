full_description = "Feature / 13 September 2023 From the M&G Archives: Buthelezi, the King’s Hand Inkatha Freedom Party (IFP) founder and president emeritus Mangosuthu Gatsha Buthelezi, who served as traditional prime minister to a succession of Zulu kings, died early on Saturday 9 September 2023, after a lengthy spell in hospital. PDF Archives 2010-2020 PDF Booklet 2000-2009 PDF Booklet 1986-1999 PDF Booklet M&G Archives 5 June 2020 Right of Reply: M&G chose ‘good story’ over truth — Buthelezi By Prince Mangosuthu Buthelezi MP Mangosuthu Buthelezi says the Ingonyama Trust was not created in a secret deal to ensure his participation in the 1994 election 22 September 2019 Buthelezi’s succession sparks democracy debate By Bheki Mngomezulu The IFP’s constitution provides that the nomination of national office bearers be approved by the branches. This was not done for its new president 7 August 2019 Secret details of the land deal that brought the IFP into the 94 poll By Hilary Lynd A sweetheart deal. This is how the Ingonyama Trust has been repeatedly described 22 March 2019 ‘His Excellency’ bows out of the House By Lester Kiewit The nonagenarian MP is finally calling it a day and putting his faith in the precocious IFP caucus 15 March 2019 Succession battle harms IFP revival By Paddy Harper The Inkatha Freedom Party hopes to benefit from the demise of two other parties in KwaZulu-Natal 31 August 2018 uBaba helps Buthelezi edit history By Paddy Harper As witnesses struggle through the Zondo commission, Zuma parties on with old foes 6 July 2018 Battered by the flu … and Shenge By Paddy Harper As the wind threatens his feathered headdress, Buthelezi is talking like it’s 1993. I’d far rather be sick in bed, thank you 10 November 2017 Mangosuthu Buthelezi is a giant of a man who falls short in his museum By Kwanele Sosibo The museum honouring Mangosuthu Buthelezi in Ulundi, KwaZulu-Natal, elides the main ingredient – truth 10 November 2017 IFP pick could backfire By Given Sigauqwe The party’s veteran leader has backed an outsider to succeed him, sparking possible dissension 3 November 2017 Buthelezi bows out … at long last By Paddy Harper Mangosuthu Buthelezi’s reign as the leader of the IFP has finally ended 29 January 2015 Inkatha, too, paved the way to peaceful liberation By Comment Author The Inkatha Freedom Party (IFP) sought the greatest possible protection of human rights and the strongest possible constitutional democracy. 17 May 2013 Mangosuthu: Inkatha, not ANC, at mercy of hit squads By Staff Reporter As the 2014 election campaign begins, the propaganda machine is back in overdrive, says Mangosuthu Buthelezi. 9 March 2012 ‘Buthelezi must back off from NFP’ By Fatima Asmal Motala The Inkatha Freedom Party and the National Freedom Party have been engaging in talks in order to quell the violence between their supporters. 21 April 2010 Inkathagate: How Buthelezi’s cover was blown By Staff Reporter A disillusioned policeman blew the whistle on police funding of Inkatha to <i>Guardian</i> correspondent David Beresford. 5 February 2010 Patriarchy ‘drives’ IFP deployment By Niren Tolsi The IFP has been divided by a succession battle to replace Buthelezi, made more acute by the party’s poor showing in last year’s national general election. 26 May 2009 IFP youth stand their ground By Niren Tolsi Tensions appear to be rising within the party following its dismal showing at the polls last month. 3 May 2009 ‘AK-47’ to IFP’s rescue By Niren Tolsi Mario Oriani-Ambrosini has been IFP leader Mangosuthu Buthelezi’s special adviser since the early Nineties, often at taxpayers’ expense. 17 April 2009 IFP on the skids By Niren Tolsi Jacob Zuma’s Zuluness hurts IFP fortunes in KwaZulu-Natal. Niren Tolsi reports. 10 March 2009 Throwing his hat in By Niren Tolsi Niren Tolsi spoke to IFP president Mangosuthu Buthelezi about how he views his chances in the coming poll. 2 May 2008 Buthelezi’s U-turn By Nosimilo Ndlovu As IFP leader Mangosuthu Buthelezi threatens to challenge a new KwaZulu-Natal law in court, the provincial government has released correspondence showing that only last year he demanded that same law be enacted. The law in question will make the position of chairperson of the KwaZulu-Natal House of Traditional Leaders permanent, and Buthelezi will have to choose between his position as part-time chair of the house and his job as a national MP. 2 February 2008 The IFP: Between a rock and a Zuma By Niren Tolsi Like the elephant on its crest, there was a degree of dimorphism about the Inkatha Freedom Party (IFP) at its draft policy launch recently. Its past, especially the party’s role in the internecine violence of the 1980s and 1990s, was reshaped towards absolution during a narrative history kicked off by Generations actress Winnie Ntshaba. 31 October 2007 Missing the point in IFP succession By Staff Reporter The continuing succession debate in the Inkatha Freedom Party (IFP) should focus more on devising strategies to manage the change of leadership and less on bashing party leader Mangosuthu Buthelezi over perceptions that he is clinging to power, argues Zukile Majova. 30 August 2007 IFP showdown By Staff Reporter A race for succession is taking shape in the IFP with progressive members of the party’s youth wing calling for it to formulate a succession plan ahead of the anticipated resignation of president Mangosuthu Buthelezi when his term ends in 2009. Buoyed by a belief that the term ending in 2009 might be Buthelezi’s last as party president reformists within the party and its youth wing have begun lobbying for a deputy president. 6 October 2006 IFP shifts focus from chiefs to yuppies By Staff Reporter The IFP goes to its national general conference to take stock of its declining fortunes and formulate a turnaround strategy to attract the ”sophisticated urban voter”. The NGC is the partyâ€™s highest decision-making body. For the first time in the partyâ€™s 31year history the NGC of 100 members will be elected by delegates rather than being anointed by IFP president Mangosuthu Buthelezi. 8 April 2006 Buthelezi entrenches himself By Marianne Merten Inkatha Freedom Party president Mangosuthu Buthelezi’s decision to subject his leadership to scrutiny, at a hastily convened special conference on Saturday, amounts to little more than a tactical move to entrench his position until the 2009 election. Any challenge to his presidency has been widely dismissed. 5 August 2005 Damning report exposes IFP’s internal collapse By Staff Reporter A confidential Inkatha Freedom Party discussion paper, which calls for a change in the partyâ€™s old guard leadership, has been leaked to the <i>Mail & Guardian</i> in the week in which national chairperson Ziba Jiyane was given his marching orders because of his drive to revolutionise the dying party. 13 May 2005 ‘Pack of lies,’ says IFP’s Jiyane By Vicki Robinson National chairperson of the Inkatha Freedom Party Ziba Jiyane has lashed out at party members who are ”fighting to undermine” him, and has branded the IFP youth brigade’s recent attack on him as ”a pack of lies”. This is the latest salvo in an acrimonious leadership tussle plaguing the party. 12 January 2001 Inkatha joins ‘the better devil’ to twist ANC arm on amakhosi By Staff Reporter Jaspreet Kindra The Inkatha Freedom Party is positioning itself alongside the Democratic Alliance in KwaZulu-Natal in an attempt to twist the arm of the African National Congress on the amakhosi issue. Apparently the IFP is hoping to force the ANC to enhance the status of the amakhosi in a Municipal Structures Act amendment likely to […] 18 June 1999 Buthelezi approved Powell’s war plans By Staff Reporter New evidence shows IFP leader Mangosuthu Buthelezi approved paramilitary activities aimed at undermining the 1994 election. Ivor Powell reports. 9 September 1994 Zwelithini Nods To An Old Buthelezi Enemy By Staff Reporter King Goodwill Zwelethini wants to restore relations with a senior prince who has rivalled Mangosuthu Buthelezi for 26 years, reports Farouk Chothia ZULU King Goodwill Zwelithini wants an urgent meeting with a senior prince who is Inkatha Freedom Party leader Mangosuthu Buthelezis rival for the post of traditional prime minister to the monarch. Sources close […]"
