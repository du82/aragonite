title = "Cookie Policy – The Mail & Guardian"
description = "June 2021 | Version 1.0 Welcome to our cookie policy. The purpose of this policy is to describe what cookies are, what we use them for, and how you can manage them when you visit or use our website.  This policy applies alongside our privacy policy, which you can find here. This cookie policy has […]"
full_description = "June 2021 | Version 1.0 Welcome to our cookie policy. The purpose of this policy is to describe what cookies are, what we use them for, and how you can manage them when you visit or use our website. This policy applies alongside our privacy policy, which you can find here. This cookie policy has been created and updated by Consent Management – CookieFirst. What are cookies? We may place small text files called ‘cookies’ on your device when you visit our website. These files do not contain personal information. However, they do contain personal identifiers allowing us to associate your personal information with a certain device. Many websites use cookies, and you can find out more about them at www.allaboutcookies.org. Your browser will keep cookies for a certain period of time and will send it back to the web server each time you reconnect to it. Why do we use cookies? These files serve a number of useful purposes for you, including: ensuring the website functions correctly; granting you access to restricted content; tailoring our website’s functionality to you by letting us remember your preferences, location, or device type; improving how our website performs; understanding who our audience is, so that we can provide content most relevant to you; allowing third parties to provide services to our website; and helping us deliver interest-based advertising where appropriate in compliance with the applicable laws. The cookies we use We use different cookies on our website. Some cookies are placed by us, while others are placed by our third-party plug-ins, suppliers, or advertisers. These cookies may be deleted from your device at different times, such as at the end of your browsing session (when you leave the website) or after a pre-set amount time, or they may persist on your device until you delete them. We use the following types of cookies on our website: essential cookies – these are cookies that allow our website to perform its essential functions. Without these cookies, some parts of our websites would stop working. site analytics cookies – these are cookies that monitor how our website is performing, and how you interact with it. We use them to know how best to improve our website or services. functional cookies – these are cookies that remember who you are as a user of our website. We use them to remember any preferences you may have selected on our website, like saving your username and password, or settings. advertising cookies – these are cookies that matches your interests or web searches with applicable advertising campaigns on our website. We use them to provide you with advertising that we think you might find useful. social media cookies – these are cookies that integrate with social media platforms. We use them to help you share content from our website to your chosen social media platform. third party cookies – these are cookies that some of our business partners use on our website. We have no access to or control over them. Information collected by any of these cookies or widgets is governed by the privacy policy of the company that created it, and not by us. What information do we access thanks to cookies? We have access to: Identifiers of your terminal (IP address); Operating system used by your terminal (Microsoft Windows, Apple Os, Linux, Unix, BeOS, Android, iOS, etc.); Device name (e.g. iPhone 12); Web browser (Microsoft Internet Explorer, Apple Safari, Mozilla Firefox, Google Chrome, etc.); Language of your web browser; Date and hour of connection to our website; The “referrer” (provenance HTTP address); and Browsing data on our websites and content viewed. Our cookies You can see the cookies we use in the following table: Cookie nameCookie typeCookie functionPHPSESSIDEssentialUsed for logging users inWooCommerceEssentialUsed to control paywall functionsGoogle AnalyticsAnalyticsThird party organisations used to record anonymised traffic to mg.co.zaDoubleclickAdvertisingThird party advertising server. Note, other advertising cookies may be added via Doubleclick and Google Adx that are beyond our immediate control Deleting cookies Your internet browser generally accepts cookies automatically, but you can often change this setting to stop accepting them. You can also delete cookies manually. You can read how to do this for popular browsers by following these links: Firefox Google Chrome Internet Explorer Safari Deleting or no longer accepting cookies may prevent you from accessing certain aspects of our website where cookies are necessary or cause the website to forget your preferences. Deleting cookies may not prevent you from seeing advertisements on our website, but such advertising may be less relevant to you. For more information on how to opt out of being tracked across all websites by Google Analytics, visit https://tools.google.com/dlpage/gaoptout."
