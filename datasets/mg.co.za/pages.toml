title = "Meta ends fact-checking to ‘reduce censorship’ – The Mail & Guardian"
description = "The technical storage or access is strictly necessary for the legitimate purpose of enabling the use of a specific service explicitly requested by the subscriber or user, or for the sole purpose of carrying out the transmission of a communication over an electronic communications network."
full_description = 'World / 8 January 2025 Meta ends fact-checking to ‘reduce censorship’ By DW News Facebook X Email LinkedIn WhatsApp Mark Zuckerberg, chief executive officer of Meta Platforms Inc., during the Meta Connect event in Menlo Park, California, US, on Wednesday, Sept. 25, 2024. (David Paul Morris/Bloomberg via Getty Images) { "@context": "https://schema.org", "@type": "ImageObject", "url": "https://mg.co.za/wp-content/uploads/2025/01/gettyimages-2173579376-594x594-1.jpg", "width": 1000, "height": 525 } Meta CEO Mark Zuckerberg said on Tuesday that the social media giant was rolling back the use of third-party fact-checkers on its platforms, starting with the United States. Zuckerberg claimed that “fact checkers have just been too politically biased and have destroyed more trust than they’ve created, especially in the US.” Many conservatives have long described the fact-checking programmes as censorship. Elon Musk’s X platform, which Zuckerberg said the new Meta system aimed to emulate, had also abandoned fact-checkers and replaced them with community notes. In a video he posted on Facebook, Zuckerberg said Meta was focused on “restoring free expression” on its platforms, which also include Instagram, Threads and Whatsapp. “It’s time to get back to our roots around free expression. We’re replacing fact checkers with community notes, simplifying our policies and focusing on reducing mistakes,” another Zuckerberg statement read. The 40-year-old tycoon said that “recent elections feel like a cultural tipping point toward, once again, prioritising speech.” He added that Meta platforms would “simplify” their content policies “and get rid of a bunch of restrictions on topics like immigration and gender that are just out of touch with mainstream discourse”. Meta will also relocate its trust and safety and content moderation teams from California to Texas. Zuckerberg suggested the southern state is a place where “there is less concern about the bias of our teams”. Meta platforms will also allow users greater control over the amount of political content they see, reversing a 2021 policy to reduce political content across its platforms. “It feels like we’re in a new era now,” Zuckerberg said. “And we’re starting to get feedback that people want to see this content again.” Closer ties with Trump The move comes as Zuckerberg strives to mend ties with President-elect Donald Trump, who had previously accused Meta of supporting liberal policies and being biased against conservatives. Zuckerberg’s Meta donated $1 million to Trump’s inauguration fund. Following the January 6, 2021 Capitol riots, Facebook kicked out Trump, though his account was later restored. In November, Zuckerberg dined with Trump at his Mar-a-Lago resort, in what was seen as an effort to repair his company’s relationship with the incoming US president. In his video on Tuesday, Zuckerberg said Meta will “work with President Trump to push back on governments around the world going after American companies and pushing to censor more.” He cited what he called European laws “institutionalising censorship,” Latin American “secret courts,” and China’s wide censorship practices, calling on the US government’s support to push back on “this global trend”. Trump says Meta ‘has come a long way’ Trump commented on Zuckerberg’s announcement later on Tuesday, saying it was “probably” in response to his threats against Zuckerberg. “They have come a long way – Meta. The man [Zuckerberg] was very impressive,” he was quoted as saying. German Vice Chancellor Robert Habeck however criticised the new Meta changes. Speaking from an election campaign event in Hamburg, the Greens’ leading candidate said that he did not welcome Zuckerberg’s announcement. “Freedom does not mean a lack of rules,” Habeck said. – DW Tags: content policy simplification, fact-checking bias debate, Meta bias, Meta content moderation changes, meta fact-checkers removed, Meta immigration content policy, Meta platforms free speech, Meta political content control, Meta political content reversal, Meta trust and safety relocation, recommended one, social media content moderation, Trump Meta relationship, WORLD, Zuckerberg community notes, Zuckerberg on free expression, Zuckerberg Texas content teams, Zuckerberg Trump ties'
