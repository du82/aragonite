full_description = "Africa / 24 February 2025 Sudan: A poisoned palace in a violent stalemate Despite dramatic shifts in the frontlines, neither side is anywhere near the ‘total military victory’ wanted by Sudan’s warring generals. By Lydia Namubiru, The Continent Article / 4 November 2024 Big Agriculture is watching critics, pesticides and GMO food A new investigation details a covert campaign that companies such as Monsanto, now Bayer, and Syngenta waged against critics who threatened its profit By Lydia Namubiru, The Continent, Elena DeBre and Margot Gibbs Africa / 29 August 2024 How Wall Street profits from African debt and resource extraction Companies owned by global investment firms mine Africa and take the profits. Cash-strapped governments then borrow from the same firms at high interest By Jaume Portell Caño and Lydia Namubiru, The Continent Africa / 10 June 2024 Protests in African nations have more than doubled in the past five years Struggling economies on the continent are leaving many unable to afford basic staples By Lydia Namubiru, The Continent Africa / 9 May 2024 Dams burst, bridges washed-away and lives lost in Kenya floods The worst floods in 30 years took the country by surprise By Lydia Namubiru, The Continent Africa / 10 February 2024 Kenyan women rage in battle for their lives There has been a surge in cases of femicide, with media reporting 14 cases of women murdered in January alone By Lydia Namubiru, The Continent The Green Guardian / 4 December 2023 Loss and damage climate fund: Rich countries give with one hand, take with the other If history is anything to go by, a lot of the money will go to consultancies and organisations in the global north By Lydia Namubiru, The Continent Africa / 13 September 2023 How Africa weathers the climate storm To avert complete climate catastrophe, African countries need at least $277 billion per year in additional climate finance By Lydia Namubiru, The Continent Africa / 24 January 2023 Facebook offers African moderators a pitiful severance The deal offered to Africans is eight times lower than that given to Meta’s staff By Lydia Namubiru, The Continent"
