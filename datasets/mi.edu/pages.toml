n triggerPostRender() { if ( postRenderFired ) { return; } postRenderFired = true; jQuery( document ).trigger( 'gform_post_render', [22, current_page] ); gform.utils.trigger( { event: 'gform/postRender', native: false, data: { formId: 22, currentPage: current_page } } ); gform.utils.trigger( { event: 'gform/post_render', native: false, data: { formId: 22, currentPage: current_page } } ); if ( visibilityTestDiv ) { visibilityTestDiv.parentNode.removeChild( visibilityTestDiv ); } } function debounce( func, wait, immediate ) { var timeout; return function() { var context = this, args = arguments; var later = function() { timeout = null; if ( !immediate ) func.apply( context, args ); }; var callNow = immediate && !timeout; clearTimeout( timeout ); timeout = setTimeout( later, wait ); if ( callNow ) func.apply( context, args ); }; } const debouncedTriggerPostRender = debounce( function() { triggerPostRender(); }, 200 ); if ( visibilityTestDiv && visibilityTestDiv.offsetParent === null ) { const observer = new MutationObserver( ( mutations ) => { mutations.forEach( ( mutation ) => { if ( mutation.type === 'attributes' && visibilityTestDiv.offsetParent !== null ) { debouncedTriggerPostRender(); observer.disconnect(); } }); }); observer.observe( document.body, { attributes: true, childList: false, subtree: true, attributeFilter: [ 'style', 'class' ], }); } else { triggerPostRender(); } } );} ); /* ]]&gt; */ PRACTICAL HORNS EXPERIENCE Today’s horn players—saxophonists, trombonists, trumpeters, and other brass players—working in the contemporary music industry are expected to be outstanding on their instruments as soloists, section players, readers and improvisers, arrangers and engineers. They should also be knowledgeable of all musical horn types and styles while retaining their own artistic identity, sometimes being required to perform on instruments outside of their specialty. MI’s unique balance of performance, individual practice, and unique curriculum trains musicians to be competent in all of these areas, and to be ready for any situation they may encounter as a professional musician. MI is consistently ranked as one of the best musical schools for horn performance in the world. Our world renowned college provides you the resources you need to succeed. MI provides a comprehensive education in musical horn, enabling students to pursue successful careers in the music industry. MI’s exceptional faculty and rigorous coursework prepare students to excel as horn musicians in any musical setting. MI is a world-renowned school of music that attracts horn students from all over the globe who seek to join the ranks of those who graduate from the best schools for horn performance. With its specialized focus on contemporary music, MI offers a unique approach to horn performance education that equips students with the skills and knowledge necessary to succeed in today’s competitive music industry. DEGREES OFFERED BM BACHELOR OF MUSIC IN PERFORMANCE MI’s Bachelor of Music Degree offers several options for students who want to gain an in-depth mastery of Harmony, Theory and Ear Training as well as comprehensive courses in music history, music production software, producing, and business relations. This undergraduate Bachelor Degrees are available in either Composition, Performance or Songwriting & Production with the goal of preparing graduates to become professional artists in the contemporary music and entertainment industry. AA ASSOCIATE OF ARTS OF MUSIC IN PERFORMANCE You will develop professional performance abilities in contemporary commercial music styles as both a solo and ensemble performer through advanced studies in technique, reading, ensemble, stylistic appropriateness/diversity, tone production, performing and recording music “by-ear,” transposing memorized and notated music “on the spot,” the history and workings of the contemporary horn section, and live performance workshops/ ensembles. C CERTIFICATE OF MUSIC IN PERFORMANCE With an innovative 360-degree approach to music education, MI Certificates are centered on Harmony, Theory and Ear Training, with core subjects in Reading, Technique and Performance. This Certificate provides students with a broad foundation of knowledge and practical experience, encouraging the rapid development of skills in preparation for a range of professional music performance situations. CAREERS In addition to the many general music-related classes and electives offered at MI, Horn Education provides students the essential knowledge and skills to prepare students for any audition, that lead to such career options as: TOURING MUSICIAN RECORDING STUDIO MUSICIAN MUSICAL DIRECTOR PRODUCT REPRESENTATIVE RECORDING ARTIST FILM/TV COMPOSER PRIVATE INSTRUCTOR TRANSCRIBER ARRANGER PROGRAM DETAILS WHAT WILL I LEARN? The student will develop professional performance abilities in contemporary commercial music styles as both a solo and ensemble saxophone performer through advanced studies in technique, reading, ensemble, stylistic appropriateness/diversity, tone production, performing and recording music “by-ear,” transposing memorized and notated music “on the spot,” the history and workings of the contemporary horn section, and live performance workshops/ ensembles. The student will develop professional studio production and technical skills through advanced studies of digital audio workstations and project recording. The student will develop functional performance skills on at least one secondary instrument. The student will cultivate fundamental proficiencies alongside adaptability and inventiveness through the study of traditional and contemporary music theory, ear training, songwriting, in-depth rhythmic studies, and keyboard proficiency. The student will develop basic skills in applied entertainment business concepts, marketing techniques, visual media software, digital branding, and media relations concepts and practices, allowing them to negotiate the professional business side of the industry. The student will choose options for specialized study in areas such as musical styles, popular music history, technology,music business, creative development and composition and analysis; assembling a skill set specific to themselves as artists/musicians. COURSE CATALOG For a detailed look at all of MI’s program offerings, you can find the course catalog here. ENTRANCE REQUIREMENTS: BACHELOR Bachelor of Music Degree requirements include completion of 30 semester-units or 45 quarter-units of coursework in General Studies. For more info, please see the MI Course Catalog. ENTRANCE REQUIREMENTS: CERTIFICATE Musicians Institute college classes are fast-paced and certain fundamental musical skills are required before you can begin your program. If you meet entry requirements and are accepted, a one-on-one performance evaluation and placement testing will be held during registration to determine whether you qualify for advanced placement in any area of coursework. You are evaluated based on the content of your submission. For more info, please see the MI Course Catalog. SCHOLARSHIP OPPORTUNITIES Musicians Institute offers many opportunities for scholarships. Please visit our Scholarship page for more information. FINANCIAL AID Please visit MI’s Financial Aid page for all the details on how you can qualify for college aid. INTERNATIONAL STUDENTS International students make up nearly one-fourth of MI’s total student population, representing more than 50 countries throughout the world while creating a unique and diverse learning environment, full of endless opportunities in Hollywood and beyond. For more info, please visit the International Students page. FACILITIES Fully equipped practice facilities and computer labs with the latest industry-standard equipment Concert Hall access, with full audio/video recording capabilities Multiple performance and recording studios are available for you to practice FACULTY Our staff of professional Los Angeles wind instrumentalists brings practical, up-to-date experience directly to the classroom. Students also enjoy regular concerts and clinics with top horn players from Los Angeles and around the world. ROB DZIUBLA – SAXOPHONE CREDITS: Joe Bonamassa, Ricky Martin, Duane Eddy WOODY MANKOWSKI – SAXOPHONE/VOCALS CREDITS: Larry Carlton JIM JEDEIKIN – SAXOPHONE/FLUTE/CLARINET CREDITS: Royal Crown Revue, Bette Midler SEAN BILLINGS – TRUMPET CREDITS: Jungle Fire, Brian Setzer Orchestra, Gloria Trevi, Los Stellarians ERM NAVARRO – TROMBONE CREDITS: Panic at the Disco, Jonas Brothers, American Idol, The Voice STUDENT CONSUMER DISCLOSURES BACHELOR PROGRAMS Bachelor of Music in Performance Gainful Employment Disclosure School Performance Fact Sheet Bachelor of Music in Performance With Minor in Music Industry Studies Gainful Employment Disclosure School Performance Fact Sheet Bachelor of Music in Performance With Minor in Audio Production Gainful Employment Disclosure School Performance Fact Sheet CERTIFICATE PROGRAMS Certificate in Performance Gainful Employment Disclosure School Performance Fact Sheet ASSOCIATE PROGRAMS Associate of Arts in Performance Gainful Employment Disclosure School Performance Fact Sheet Associate of Arts in Performance/Combined Emphasis Gainful Employment Disclosure School Performance Fact Sheet PART-TIME PROGRAMS Associate of Arts in Performance Combined Emphasis Gainful Employment Disclosure School Performance Fact Sheet Associate of Arts in Performance Gainful Employment Disclosure School Performance Fact Sheet Certificate in Performance Gainful Employment Disclosure School Performance Fact Sheet'''
