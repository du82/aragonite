, then showcase them on your self-designed website. Whether you are a singer, DJ, producer, rapper or instrumentalist, MI prepares you to take control of your future. Our program covers everything from songwriting and recording to marketing and promotion, ensuring that you have the skills needed to succeed in today’s music industry. You’ll learn how to release music as an independent artist, how to book shows as an independent artist, how to make it as an independent artist, how to work on your own terms without being signed to a record label, and much more. Whether you’re a singer, songwriter, DJ, producer, rapper or instrumentalist, MI’s Independent Artist Program is the perfect platform for artists who want to pursue their dreams and thrive in the music industry. Apply today to get your music career started. CURRICULUM HIGHLIGHTS ARTST-101/201 – Recording Project 1-2 ARTST-107/207 – Songwriting IAP 1-2 ARTST-111/211 – Project Advising 1-2 > VIEW COURSE CATALOG DEGREE BY THE NUMBERS From 10 weeks to 6 months, there’s an option for you! CERTIFICATE – 2 Quarters MI SELECT (Individual Courses) – 10 Weeks i Program Overview MI’s Independent Artist Program provides the technical knowledge and professional skills you need to survive as an independent recording and performing artist in today’s music world. Experienced instructors guide you through the complete creative process from songwriting, arranging, recording and production to marketing and promotion. Use your personal laptop audio workstation to record and mix live vocals, instruments, samples and loops into finished tracks, then showcase them on your self-designed website. Whether you are a singer, DJ, producer, rapper or instrumentalist, MI prepares you to take control of your future. Our program covers everything from songwriting and recording to marketing and promotion, ensuring that you have the skills needed to succeed in today’s music industry. You’ll learn how to release music as an independent artist and 