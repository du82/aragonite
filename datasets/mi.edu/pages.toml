full_description = '''ADMISSIONS At Musicians Institute you’ll find students from every creative and cultural background united by a common desire to excel. It’s not only about studying and practicing, it’s about getting to know your fellow students and form friendships and musical relationships that will last. APPLY NOW VIRTUAL OPEN HOUSESaturday, March 1, 2025 at 10:00 AM (Pacific Time) Find out for yourself why thousands of musicians from all over the world have made MI the launching pad for their careers. LEARN MORE MI ONLINE INFO SESSIONThursday, March 13, 2025 at 4:00 PM (Pacific Time)Meet the MI Online team as theyguide you through the MIOplatform, the diverse programofferings, and the steps needed toapply. LEARN MORE FINANCING YOUR EDUCATIONThursday, March 20, 2025 at 4:00 PM (Pacific Time) You’ll learn about everything from an overview of the financial aid process, to key documents you’ll encounter, and different funding sources that can help you manage costs. LEARN MORE ON CAMPUS OPEN HOUSESaturday, May 17, 2025 at 10:00 AM (Pacific Time) Find out for yourself why thousands of musicians from all over the world have made MI the launching pad for their careers. LEARN MORE HOW TO APPLY The first step in applying to any MI program is to complete an application form. Start an application now. Application deadlines, fees, and details can be found below. If you have any questions, please contact the Admissions Department directly at 1-866-383-0468 or email [email protected]. MI DEGREES, CERTIFICATES & PROGRAMS MASTER DEGREES Master of Music in Performance Bass Guitar Drums Keyboard Vocals MASTERS OF MUSIC INFO BACHELOR DEGREES Bachelor of Music in Performance Bass Guitar Drums Keyboard Vocals Bachelor of Music in Composition BACHELOR OF MUSIC ADMISSIONS INFO ASSOCIATES DEGREES Recording and Music Industry Specialties: Associate of Arts in Performance Associate of Science in Music Business ASSOCIATES DEGREE ADMISSIONS INFO CERTIFICATES Certificate in Audio Engineering Independent Artist Certificate Guitar Craft Certificate Music Business Certificate DJ Performance & Production Certificate Certificate in Performance CERTIFICATES ADMISSIONS INFO NON-CREDIT PROGRAMS MI Select are non-certificate programs designed to provide students with “a taste of MI” as an alternative to enrolling in full-time degree or certification programs in the School of Performance Studies. Students can create their own customized schedule from available classes and workshops, while enjoying access to the music library, special guest clinics, extra-curricular activities, and other industry networking opportunities. Enrollment is available at the beginning of any quarter, and may be repeated for additional quarters. During an initial evaluation, MI faculty will discuss each student’s specific needs and goals, before providing a list of available courses* that match their experience and skill levels. ​​ MI Select includes: A full or part-time/10-week schedule (1-15 units) General Access to MI’s rehearsal facilities CONNECT WITH AN ADMISSIONS ADVISOR Enter your info below and our Admissions team will contact you shortly, or call us at 800-255-7529<!-- 800-255-7529.--> "*" indicates required fields This field is hidden when viewing the formmicampaignFirst Name*Last Name*Email* Phone*Program of Interest*--- Please Select ---GuitarVocalDrumsBassKeyboardIndependent ArtistArtist Producer EntrepreneurElectronic Music ProductionSongwritingCompositionAudio EngineeringStudio RecordingLive Music Event ProductionMusic BusinessGuitar Craft (Nashville)CommentsThis field is for validation purposes and should be left unchanged. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); /* <![CDATA[ */ gform.initializeOnLoaded( function() {gformInitSpinner( 27, 'https://www.mi.edu/wp-content/plugins/gravityforms/images/spinner.svg', true );jQuery('#gform_ajax_frame_27').on('load',function(){var contents = jQuery(this).contents().find('*').ht