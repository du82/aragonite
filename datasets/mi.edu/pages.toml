tand that I am not required to provide my phone number as a condition of purchasing any property, goods, or services. I agree to the terms of MI’s Privacy Policy. MI will not sell or rent your information to third parties, and you may unsubscribe at any time. i The MI Difference i The MI Difference Bookable Recording StudiosThe Audio Engineering program allows students to book the MI studios and venues for class projects, or projects of their own. Audio engineering students can bring in MI students or even outside musicians to record. All bookings are done through a proprietary MI website and students have access to MI’s extensive microphone collection. It’s one thing to learn the theory in class, but another to be sitting in an architecturally designed studio space operating a large format console like a Rupert Neve Design 5088 or API 1608. Avid Learning PartnerMI is an Avid Learning partner which means students can take the Avid Certifications for Pro Tools as part of their academic experience. The certification tests are done through Avid’s portal and can be administered anytime the student is enrolled into the AE program. Students can earn their Specialist Credential (100 level) and our Pro Tools classes are designed to prepare students for the certification exams. MI also offers the Avid 130P Certification exam for Video Game Audio in the same fashion. FULLY IMMERSIVE CURRICULUMAudio Engineering students will be taught by industry-experienced instructors in our working studios, where they’ll gain practical experience on professional-level consoles and recording equipment. Some highlights include: Students learn to manage the entire audio production process from pre-production and tracking to mixing and mastering. Introduction to ancillary fields like live sound and post-production, while allowing students access to our venues and dub stage. Real-world electives such as Small Footprint Digital Consoles, Advanced Music Production, and Project Studio Design Hollywood LocationOur campus is located in the middle of the entertainment industry, including the worlds of music, film, television and beyond. Students will have access to the finest live music venues, along with opportunities and possibilities to visit, intern and work at the best studios and sought after music labels in the world. PartnershipsAs an MI student, you become part of a global network of arts, entertainment and educational companies. These partnerships and affiliates can offer students direct access to the music industry and help with their careers after graduation, including but not limited to internships, job placements, gear discounts, and more. View our full list of our industry partnerships. Bookable Recording StudiosThe Audio Engineering program allows students to book the MI studios and venues for class projects, or projects of their own. Audio engineering students can bring in MI students or even outside musicians to record. All bookings are done through a proprietary MI website and students have access to MI’s extensive microphone collection. It’s one thing to learn the theory in class, but another to be sitting in an architecturally designed studio space operating a large format console like a Rupert Neve Design 5088 or API 1608. Avid Learning PartnerMI is an Avid Learning partner which means students can take the Avid Certifications for Pro Tools as part of their academic experience. The certification tests are done through Avid’s portal and can be administered anytime the student is enrolled into the AE program. Students can earn their Specialist Credential (100 level) and our Pro Tools classes are designed to prepare students for the certification exams. MI also offers the Avid 130P Certification exam for Video Game Audio in the same fashion. Fully Immersive CurriculumAudio Engineering students will be taught by industry-experienced instructors in our working studios, where they’ll gain practical experience on professional-level consoles and re