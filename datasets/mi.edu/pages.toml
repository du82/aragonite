full_description = '''MUSIC COMPOSITION FOR VISUAL MEDIA Bachelor of Music in Composition MI Select Los Angeles, CA The Bachelor of Music in Composition for Visual Media program’s curriculum focuses on contemporary arranging, scoring, orchestration, music theory, ear training and music history, all skills that will make you a diverse and multifaceted composer ready to work on the most exciting projects in the music business. If you’re looking for a diverse music composition program in Los Angeles, Musicians Institute is the place for you! LEARN MORE ABOUT MI First_Name*Last_Name*Email* Phone*This field is hidden when viewing the formmicampaignMI WebsiteBy submitting this form, I authorize Musicians Institute (MI) to make or allow the placement of calls, emails, and texts to me at the phone number that I have provided, including through the use of automated technology, or a prerecorded or artificial voice. I understand that I am not required to provide my phone number as a condition of purchasing any property, goods, or services. I agree to the terms of MI’s Privacy Policy. MI will not sell or rent your information to third parties, and you may unsubscribe at any time.PhoneThis field is for validation purposes and should be left unchanged. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); /* <![CDATA[ */ gform.initializeOnLoaded( function() {gformInitSpinner( 22, 'https://www.mi.edu/wp-content/plugins/gravityforms/images/spinner.svg', true );jQuery('#gform_ajax_frame_22').on('load',function(){var contents = jQuery(this).contents().find('*').html();var is_postback = contents.indexOf('GF_AJAX_POSTBACK') >= 0;if(!is_postback){return;}var form_content = jQuery(this).contents().find('#gform_wrapper_22');var is_confirmation = jQuery(this).contents().find('#gform_confirmation_wrapper_22').length > 0;var is_redirect = contents.indexOf('gformRedirect(){') >= 0;var is_form = form_content.length > 0 && ! is_redirect && ! is_confirmation;va