and more! We believe that training in these diverse styles and professional environments allows students to be ready for any job after graduation, whether it’s as a studio session player, a bass teacher, a touring musician, an artist, and beyond! It is this firsthand, immersive experience in our classrooms and facilities that really set the stage for success in the music industry after MI. CURRICULUM HIGHLIGHTS BASS-011 – Bass Technique & Fretboard BASS-370 – Synth Bass BASS-014 – Bass Gear Maintenance & Mastery > VIEW COURSE CATALOG DEGREE BY THE NUMBERS From 10 weeks to 4 years, there’s an option for you! MASTER OF MUSIC – 4 Quarters BACHELOR OF ARTS – 12 Quarters ASSOCIATE OF ARTS – 6 Quarters CERTIFICATE – 4 Quarters MI SELECT (Individual Courses) – 10 Weeks TURN YOUR PASSION FOR MUSIC INTO A CAREER Enter your info below for program options, scholarships, and next steps, or call us at 800-255-7529. "*" indicates required fields This field is hidden when viewing the formmicampaignFirst Name*Last Name*Email* Phone*Program of Interest*--- Please Select ---GuitarVocalDrumsBassKeyboardIndependent ArtistArtist Producer EntrepreneurElectronic Music ProductionSongwritingCompositionAudio EngineeringStudio RecordingLive Music Event ProductionMusic BusinessGuitar Craft (Nashville)CommentsThis field is for validation purposes and should be left unchanged. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); /* <![CDATA[ */ gform.initializeOnLoaded( function() {gformInitSpinner( 27, 'https://www.mi.edu/wp-content/plugins/gravityforms/images/spinner.svg', true );jQuery('#gform_ajax_frame_27').on('load',function(){var contents = jQuery(this).contents().find('*').html();var is_postback = contents.indexOf('GF_AJAX_POSTBACK') >= 0;if(!is_postback){return;}var form_content = jQuery(this).contents().find('#gform_wrapper_27');var is_confirmation = jQuery(this).contents().find('#gform_confirmation_wrapper_27').length > 0;var is_redirect = contents.