title = "Media Relations | Musicians Institute Hollywood"
description = "Musicians Institute connects students to the global music industry. Connect with MI via email for all media inquiries. Learn more about us, here."
full_description = "MEDIA RELATIONS DOWNLOADS ABOUT MUSICIANS INSTITUTE Founded in the heart of Hollywood in 1977, Musicians Institute (MI) is a College of Contemporary Music. This unique college offers a complete education in every aspect of the music industry, including instrumental performance, composing for video games, audio engineering, guitar building, music business, and training in the latest music technology. Through real-world experience and guidance from working professionals, students can earn a variety of degrees and certificates, while taking advantage of networking opportunities at its state-of-the-art Hollywood campus. MI connects students to the global music industry with all the tools they need to enhance their careers and pursue their artistic dreams. Musicians Institute’s comprehensive, innovative and artistic education in contemporary music includes: Flexible options within each program Acclaimed faculty & guest artists 24/7 access to state-of-the-art Hollywood facilities Networking with successful students & graduates Practical applications of various musical styles, genres & concepts Cross-cultural interaction with students from around the world OUR FOUNDERS Howard Roberts Tommy Tedesco MEDIA INQUIRIES Marketing Department Musicians Institute [email protected] STATE-OF-THE-ART HOLLYWOOD CAMPUS Musicians Institute 6752 Hollywood Blvd Hollywood, CA 90028 Located at the bustling intersection of Hollywood and Highland in Los Angeles, Musicians Institute’s campus includes facilities devoted to a variety of programs and purposes. The 60,000-square-foot Main Complex is open 24 hours a day, 7 days a week, except holidays. It includes a variety of performance venues, recording studios, classrooms, practice and private lesson rooms, production labs, and a library. Studios are equipped with the latest technology including a SSL Duality SE 24-Channel Hybrid console, a THX-certified dubbing stage, an API 1608 32-channel analog console, an Avid Euphonix S5 Fusion 24 console, software programs such as Logic, ProTools, Ableton Live, Sibelius and Finale; and much more.  MI Campus Map  MI Campus Parking Map FACTS AND FIGURES YEAR FOUNDED: 1977 TYPE OF COLLEGE: Special Focus Institution ACCREDITATION: National Association of Schools of Music, Commission on Accreditation FACULTY PROFILE: 260 Faculty. Average student/teacher ratio is between 6:1 and 9:1 APPLICATION FEE: $100 Non-refundable CAMPUS SUMMARY Main Building | South Entrance | 1655 McCadden Place Main Building | North Entrance | 6752 Hollywood Boulevard Passage | 6752 Hollywood Boulevard Hawthorn Annex | 1621 N. McCadden Place Highland Annex | 1622 N. Highland Avenue Music Business Annex | 1518 N. Highland Avenue Guitar Craft Academy | 7070 Santa Monica Boulevard MI VISUAL IDENTITY The MI Logo is approved for use in the lockups shown below (Horizontal, Stacked and Solo). Please refer to the Musicians Institute Brand and Style Guide for correct usage of the MI Logo. LOGOS HORIZONTAL STACKED CLASSIC Downloads  MI Press Kit  MI Logo Kit  MI Brand and Style Guide"
