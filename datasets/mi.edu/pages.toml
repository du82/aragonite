st studios and sought after music labels in the world. Fully Immersive CurriculumAPE students will be taught by industry experienced instructors in our working studios, where they’ll gain practical experience on professional-level consoles and recording equipment. Some highlights include: Develop your artist identity, online presence and visual brand, and execute a plan for promoting yourself as an artist, including intensive study on Social Media Branding and creating and editing music videos Record and produce your own music in industry-standard DAW software (Pro Tools, Logic Pro X, or Ableton Live) with guidance from experts every step of the way Develop your musicianship and artistic voice and write high-quality, professional-level music with intensive training in songwriting and music theory tailored for producers & songwriters PartnershipsAs an MI student, you become part of a global network of arts, entertainment and educational companies. These partnerships and affiliates can offer students direct access to the music industry and help with their careers after graduation, including but not limited to internships, job placements, gear discounts, and more. For a full list of our industry partnerships, please visit our ARTIST & CAREER SERVICES page. i Facilities i Facilities > Digital Audio Workstation (DAW) labs housing the latest versions of Pro Tools, Logic, Ableton and Reason. > Digital Audio Workstation (DAW) labs housing the latest versions of Pro Tools, Logic, Ableton and Reason. > Access to Independent Artist Program studios. > Access to Independent Artist Program studios. > Fully-equipped 24/7 practice facilities. > Fully-equipped 24/7 practice facilities. > Fully outfitted venue and dub stage. > Fully outfitted venue and dub stage. i Faculty Musicians Institute hosts a highly skilled faculty with extensive experience in the world of contemporary music. i Faculty Musicians Institute hosts a highly skilled faculty with extensive experience in the world of contemporary music. Mark "Blakkat" Bell Chaka Khan / New Order / Jamiroquai / A Tribe Called Quest / Paul Oakenfold Eric Corne John Mayall / Glen Campbell / Kim Deal (The Pixies) / Lucinda Williams / Walter Trout / Joe Bonamassa Lauren Pardini Vocal coach & songwriter on Columbia / Island/Def Jam / Aftermath / Sony/Epic / Atlantic Records Jessica Louise Singer/Songwriter Mark "Blakkat" Bell Chaka Khan / New Order / Jamiroquai / A Tribe Called Quest / Paul Oakenfold Eric Corne John Mayall / Glen Campbell / Kim Deal (The Pixies) / Lucinda Williams / Walter Trout / Joe Bonamassa Lauren Pardini Vocal coach & songwriter on Columbia / Island/Def Jam / Aftermath / Sony/Epic / Atlantic Records Jessica Louise Singer/Songwriter i Alumni Success Stories i Alumni Success Stories Nicole Row / Panic! At the Disco BASS PROGRAM “The most important thing I took from MI was what you do with what you’re given. I tried my best to absorb everything I heard, and took every gig I was offered.” READ BRUNO'S STORY Nicole Row / Pa'''
