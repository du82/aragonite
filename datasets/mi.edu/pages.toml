t have fun! SUMMER SHOT MI SELECTMI Select are non-certificate programs designed to provide students with “a taste of MI” if they want another option to studying full-time. MI SELECT PRO TOOLS CERTIFICATIONThe Avid Pro Tools® certification courses are non-accredited courses designed for those who wish to acquire their Avid User and/or Operator Certification through weekend classes at Musicians Institute in Hollywood, CA. PRO TOOLS CERTIFICATION jQuery(function($){ $('.et_pb_accordion.et_pb_accordion_1 .et_pb_toggle_open').toggleClass('et_pb_toggle_open et_pb_toggle_close'); $('.et_pb_accordion.et_pb_accordion_1 .et_pb_toggle').click(function() { var toggle = $(this); setTimeout(function(){ toggle.closest('.et_pb_accordion').removeClass('et_pb_accordion_toggling'); },700); }); }); UPCOMING EVENTS VIRTUAL OPEN HOUSE Saturday, March 1, 2025 at 10:00 AM (Pacific Time) Find out for yourself why thousands of musicians from all over the world have made MI the launching pad for their careers. LEARN MORE MI ONLINE INFO SESSION Thursday, March 13, 2025 at 4:00 PM (Pacific Time) Meet the MI Online team as they guide you through the MIO platform, the diverse program offerings, and the steps needed to apply. LEARN MORE FINANCING YOUR EDUCATION Thursday, March 20, 2025 at 4:00 PM (Pacific Time) You’ll learn about everything from an overview of the financial aid process, to key documents you’ll encounter, and different funding sources that can help you manage costs. LEARN MORE ON CAMPUS OPEN HOUSE Saturday, May 17, 2025 at 10:00 AM (Pacific Time) Find out for yourself why thousands of musicians from all over the world have made MI the launching pad for their careers. LEARN MORE CONNECT WITH AN ADMISSIONS ADVISOR Enter your info below and our Admissions team will contact you shortly, or call us at 800-255-7529<!-- 800-255-7529.--> "*" indicates required fields This field is hidden when viewing the formmicampaignFirst Name*Last Name*Email* Phone*Program of Interest*--- Please Select