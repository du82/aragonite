with the study of contemporary music, orchestration, analysis, harmony, and counterpoint. You will have the chance to collaborate with a diverse community of student musicians, esteemed faculty, industry experts, and renowned visiting artists. Create scores for film, video games, television, and more Students in the Bachelor of Music Composition program are immersed in the world of music composition and discover the power of soundtracks to transform movies, TV shows, video games, and more. Our rigorous music composition degree program will equip you with the skills and knowledge to become sought-after composers, crafting captivating scores that elevate visual storytelling to new heights. Our comprehensive curriculum delves into both traditional and contemporary composition techniques, ensuring you have a solid foundation in the art of music composition while equipping you with the tools to create scores that resonate with modern audiences. Real-World Experience and Networking Opportunities Embark on a journey where theory meets practice through our music composition degree program. At MI, students have the unique opportunity to engage in real-world projects, collaborating with filmmakers, game developers, and other creatives. This hands-on experience is invaluable, providing a glimpse into the actual industry workings and helping to build a professional portfolio that stands out. Additionally, our program regularly hosts guest speakers and industry professionals, offering students the chance to network, receive mentorship, and gain insights from those who are successfully navigating the world of music composition. This blend of practical experience and industry networking sets our Bachelor of Music in Composition program apart, making it a leading choice for aspiring composers. Transform Visual Storytelling with the Power of Music Explore the many paths of composing music for visual media, by learning how to seamlessly integrate soundtracks with the narrative and emotional arc of films, TV shows, video games, and more. Become a Master of Your Craft Through hands-on workshops, masterclasses, and mentorship from industry experts, you’ll gain the practical skills and knowledge to navigate the professional world of music composition. Join a Community of Creative Innovators Collaborate with fellow aspiring composers, student musicians, filmmakers, and game developers in our network, which you can meet through MI’s Artist & Career Services department. Ready to unleash your inner composer and transform the world with the power of music? Apply to Musicians Institute’s Bachelor of Music Composition program today and embark on your journey to becoming a master of cinematic music. As a music composition major at MI, we foster an environment that nurtures creativity and provides students with the tools to compose captivating soundtracks that enhance a diverse storytelling experience. Join us and discover why MI stands out among music composition schools as the ideal place to develop your talent and compose remarkable scores. DEGREES OFFERED BM BACHELOR OF MUSIC IN COMPOSITION The goal of this degree program is to provide a complete educational foundation that prepares students for careers as soundtrack composers, arrangers, orchestrators, editors and copyists for film, TV, animation and video games. Specific objectives include a comprehensive education in Music Composition; professional training in digital music creation tools; a foundation in theory, ear training, music history and music styles; a general education to develop critical thinking skills and perspectives on the place of music in contemporary culture; and preparation for further studies at the graduate level. NC MI SELECT & NON-CERTIFICATE PROGRAMS MI Select are non-certificate programs designed to provide students with “a taste of MI” if they want another option to full-time. Students can create their own customized schedule from available classes and workshops, while enjoying access to the special guest clinics, extra activities and other industry networking opportunities. CAREERS In addition to the many general music-related classes and electives offered at MI, the Music Composition Program provides grads with the essential knowledge and skills that lead to such career options as: ARRANGER SOUND DESIGNER FILM/TV COMPOSER SONGWRITER MUSIC DIRECTOR TRANSCRIBER ORCHESTRATOR TEACHER COMPOSER MULTIMEDIA DEVELOPER MIXING/MASTERING ENGINEER PRODUCT REP PROGRAM DETAILS WHAT WILL I LEARN? Courses in Contemporary Arranging, Scoring and Orchestration Skills that will translate to music composition work in television, film, video games and beyond Music theory, ear training and music history Professional training in the use of digital tools for music production Supportive classes in Apple Logic, the Business of Composing, Counterpoint, Keyboard Proficiency and more COURSE CATALOG For a detailed look at all of MI’s program offerings, you can find the course catalog here. ENTRANCE REQUIREMENTS: BACHELOR SCHOLARSHIP OPPORTUNITIES Musicians Institute offers many opportunities for scholarships in all of our programs. Please visit our Scholarship page for more information. FINANCIAL AID Please visit MI’s Financial Aid page for all the details on how you can qualify. INTERNATIONAL STUDENTS FACILITIES Full production sound stages and recording studios Fully equipped practice facilities and computer labs with the latest industry standard equipment Concert Hall access, with full audio/video recording capabilities Multiple performance and recording studios available for student practice SUCCESS STORIES Cody Matthew Johnson Alessandro Saini Duy Tran (function($){ // get the images of the gallery and replace it by a canvas of the same size to fix the problem with overlapping images on load. $('img[width][height]:not(.uk-overlay-panel)', $('#wk-grida9a')).each(function() { var $img = $(this); if (this.width == 'auto' || this.height == 'auto' || !$img.is(':visi