unseling to strengthen their skills on a personalized scale. Music Production and Recording and Music Industry students also have project advising available, where instructors will critique and advise each student on their final project. LIVE PERFORMANCE WORKSHOPSAs part of the curriculum, MI students perform weekly in Live Performance Workshops (LPWs). MI is unique in giving students a fully immersive stage experience as soon as they start their classes. The song selections are changed weekly, so students can gain experience with diverse genres, making them stronger musicians for their careers beyond MI. CLINICSEvery quarter, students have access to attend free clinics and seminars from visiting musicians from around the world. The topics and genres presented by clinicians are diverse to allow students a well-rounded insight into the music industry and working professionals. MENTORS/NETWORKINGMI students have direct, one-on-one access to successful industry professionals, who can offer personalized career advice on their progress and projects. The Artist & Career Services (ACS) team strives to continually grow and evolve our list of mentors, so students can always speak to professionals thriving in the current music industry today. Read More HOLLYWOOD LOCATIONOur campus is located in the middle of the entertainment industry, including the worlds of music, film, television and beyond. Students will have access to the finest live music venues, along with opportunities and possibilities to visit, intern and work at the best studios and sought after music labels in the world. READ MORE PRIVATE LESSONSMI Music Performance students are given one hour private lessons with their instructors every week and/or open counseling to strengthen their skills on a personalized scale. Music Production and Recording and Music Industry students also have project advising available, where instructors will critique and advise each student on their final project. READ MORE LIVE PERFORMAN