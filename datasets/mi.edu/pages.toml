icks in contemporary styles from blues, jazz, and fusion to country, rock, Afro-Cuban, Brazilian, reggae, funk, R&B, and hip hop. Live Performance WorkshopsMI is unique in its focus on the stage, and Guitar students are required to perform weekly in Live Performance Workshops (LPWs) as part of the curriculum. The song selections are changed weekly, allowing students to gain experience with diverse genres, making them stronger musicians for their careers beyond MI. Equipment & FacilitiesStudents will have access to top of the line guitars, pedal boards and more, that can be rented from our MI Library and used in our practice and performance studios. MI’s library is stocked with Fender, PRS, Kiesel, Strandberg, Suhr, ESP, Takamine, and other top guitar brands. MI has 45 general purpose counseling Private Lessons with InstructorsMI instructors are also successful musicians and working professionals, bringing their experience into the classroom every day. Students have the unique opportunity to have one-hour private lessons with instructors, who can offer more personalized instruction and advice on their classwork and beyond. Hollywood LocationOur campus is located in the middle of the entertainment industry, including the worlds of music, film, television and beyond. Students will have access to the finest live music venues, along with opportunities and possibilities to visit, intern and work at the best studios and sought after music labels in the world. Fully Immersive CurriculumGuitar students will be taught by our industry-experienced instructors, where they’ll learn how to demonstrate stylistic depth, creative maturity and professional competence in preparation for careers in today’s music industry. Some highlights include: Contemporary guitar skills, with core classes including Guitar Technique, Guitar Performance, Guitar Reading, Harmony/Theory/Ear Training. Develop performing skills and guitar tricks in contemporary styles from blues, jazz, and fusion to countr