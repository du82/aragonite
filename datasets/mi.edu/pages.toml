full_description = '''MUSIC BUSINESS SCHOOL Associate of Science in Music Business Certificate in Music Business MI Select Los Angeles, CA Musicians Institute’s Music Business School Program features in-depth training and interactive learning experiences with seasoned music industry professionals, who bring real-world experience to the classroom. Our course topics cover the diverse range of industry areas including Law and Contracts, Music Publishing and Licensing, Artist and Tour Management, A&R and Record Labels, Distribution, Promotion, and Marketing. Whether you are an aspiring music business professional, an enterprising entrepreneur or an artist seeking a comprehensive industry education, MI’s Music Business Program is designed to give you the necessary knowledge, tools and skills to put your career on the fast track and lead you to success! LEARN MORE ABOUT MI First_Name*Last_Name*Email* Phone*This field is hidden when viewing the formmicampaignMI WebsiteBy submitting this form, I authorize Musicians Institute (MI) to make or allow the placement of calls, emails, and texts to me at the phone number that I have provided, including through the use of automated technology, or a prerecorded or artificial voice. I understand that I am not required to provide my phone number as a condition of purchasing any property, goods, or services. I agree to the terms of MI’s Privacy Policy. MI will not sell or rent your information to third parties, and you may unsubscribe at any time.PhoneThis field is for validation purposes and should be left unchanged. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); /* <![CDATA[ */ gform.initializeOnLoaded( function() {gformInitSpinner( 22, 'https://www.mi.edu/wp-content/plugins/gravityforms/images/spinner.svg', true );jQuery('#gform_ajax_frame_22').on('load',function(){var contents = jQuery(this).contents().find('*').html();var is_postback = contents.indexOf('GF_AJAX_POSTBACK') >= 0;if(!is_postba