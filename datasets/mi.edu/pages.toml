ngly popular, mainstream genre. The EMP program will focus almost completely on production of electronic music, with advanced curricular requirements in areas like musicianship and keyboard skills, vocal production concepts, track building, sound design & synthesis, beat-making, plugin processing, and mixing and mastering. Whether you are looking to produce yourself as an artist, make and sell beats online, produce for other independent artists, or become a world-class touring DJ producer, we have everything you need to up your production skill set to the next level. Join us and immerse yourself in a world of beats, bass, technology, and creative freedom. CURRICULUM HIGHLIGHTS EMP-107/207 – Track Building 1 & 2 EMP-111/211 – Sound Design w/ Ableton Live 1 & 2 AUDIO-016 – Beat Making & Maschine > VIEW COURSE CATALOG DEGREE BY THE NUMBERS From 10 weeks to 6 months, there’s an option for you! CERTIFICATE – 2 Quarters, 30 Credits MI SELECT (Individual Courses) – 10 Weeks in Length i Program Overview Studying electronic music production at Musicians Institute will open you up to opportunities not attainable anywhere else. Why? Simply, there’s no other program and curriculum that is teaching contemporary music with the connections like we have. Musicians Institute was born from a spirit of non-traditional musicians who sought to excel in the modern music industry. In the current music industry, electronic music production is becoming an increasingly popular, mainstream genre. The EMP program will focus almost completely on production of electronic music, with advanced curricular requirements in areas like musicianship and keyboard skills, DJing, vocal production concepts, track building, sound design & synthesis, beat-making, plugin processing, and mixing and mastering. Whether you are looking to produce yourself as an artist, make and sell beats online, produce for other independent artists, or become a world-class touring DJ producer, we have everything you need to up your production skill set to the next level. Join us and immerse yourself in a world of beats, bass, technology, and creative freedom. CURRICULUM HIGHLIGHTS EMP-107/207 – Track Building 1 & 2 EMP-111/211 – Sound Design w/ Ableton Live 1 & 2 AUDIO-016 – Beat Making & Maschine > VIEW COURSE CATALOG DEGREE BY THE NUMBERS From 10 weeks to 6 months, there’s an option for you! CERTIFICATE – 2 Quarters, 30 Credits MI SELECT (Individual Courses) – 10 Weeks in Length TURN YOUR PASSION FOR MUSIC INTO A CAREER Enter your info below for program options, scholarships, and next steps, or call us at 800-255-7529. "*" indicates required fields This field is hidden when viewing the formmicampaignFirst Name*Last Name*Email* Phone*Program of Interest*--- Please Select ---GuitarVocalDrumsBassKeyboardIndependent ArtistArtist Producer EntrepreneurElectronic Music ProductionSongwritingCompositionAudio EngineeringStudio RecordingLive Music Event ProductionMusic BusinessGuitar Craft (Nashville)EmailThis field is for validation purposes and should be left unchanged. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); /* <![CDATA[ */ gform.initializeOnLoaded( function() {gformInitSpinner( 27, 'https://www.mi.edu/wp-content/plugins/gravityforms/images/spinner.svg', true );jQuery('#gform_ajax_frame_27').on('load',function(){var contents = jQuery(this).contents().find('*').html();var is_postback = contents.indexOf('GF_AJAX_POSTBACK') >= 0;if(!is_postback){return;}var form_content = jQuery(this).contents().find('#gform_wrapper_27');var is_confirmation = jQuery(this).contents().find('#gform_confirmation_wrapper_27').length > 0;var is_redirect = contents.indexOf('gformRedirect(){') >= 0;var is_form = form_content.length > 0 && ! is_redirect && ! is_confirmation;var mt = parseInt(jQuery('html').css('margin-top'), 10) + parseInt(jQuery('body').css('margin-top'), 10) + 100;if(is_form){jQuery('#gform_wrapper_27').html(form_content.html());if(form_content.hasClass('gf