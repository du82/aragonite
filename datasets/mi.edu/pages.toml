to our program specific hands-on experience with MI faculty. Book a tour or live audition (for performance programs) if you want to take advantage of being on campus. i MI Hollywood Hands-On Experiences Discover what you will be learning within each campus breakout session. Please note: The hands-on breakout sessions below are only for MI’s Hollywood Open House. Breakout sessions for MI’s Virtual Open House are not “hands-on”. Audio Engineering Experience a tour of the recording studios and take lessons in Pro Tools and Mixing on a professional API and SSL studio consoles. DJ/Electronic Music Production Experience a short writing/composing studio session with an MI instructor. Music Business Take a sample class with a Music Business instructor and learn how a practical business education and Music Business internship can help jumpstart your industry career. Artist/Producer/EntrepreneurIndependent Artist Take a class on digital recording and learn what it takes to be an independent artist/producer. Keyboard Take a lesson in chord voicing and keyboard styles followed by an overview of Logic Audio’s library of virtual instruments. Vocal Join us for an overview of MI’s Vocal Program and see how instructors analyze performances by student vocalists. Bass Take part in an interactive bass technique and music lesson taught by bass instructors using examples from actual bass curriculum. Guitar Experience a hands-on technique class under the direction of a staff guitar instructor. Drums Learn how to develop your groove and sound and get personal drumming tips from MI’s renowned Drum Program staff. Composition/Songwriting Take part in an Ableton Live demo and/or music critique with instructors.'''
