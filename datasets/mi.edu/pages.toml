 can be. The IAP Final Project is designed not just to demonstrate your mastery of the courses in the program—but to give you something to take out into the world and begin your career. FULLY IMMERSIVE CURRICULUMIAP students will develop their artist identity, online presence and visual brand, and execute a plan for promoting themselves as an artist. They will also record and produce their own music in industry-standard DAW software (Pro Tools, Logic Pro X, or Ableton Live) with guidance from experts every step of the way. Hollywood LocationOur campus is located in the middle of the entertainment industry, including the worlds of music, film, television and beyond. Students will have access to the finest live music venues, along with opportunities and possibilities to visit, intern and work at the best studios and sought after music labels in the world. PartnershipsAs an MI student, you become part of a global network of arts, entertainment and educational companies. These partnerships and affiliates can offer students direct access to the music industry and help with their careers after graduation, including but not limited to internships, job placements, gear discounts, and more. For a full list of our industry partnerships, please visit our ARTIST & CAREER SERVICES page. IAP Production AdvisingThe IAP program offers unlimited weekly one-on-one sessions with a variety of expert instructors, to help you make each of the elements of your project the best they can be. The IAP Final Project is designed not just to demonstrate your mastery of the courses in the program—but to give you something to take out into the world and begin your career. Fully Immersive CurriculumIAP students will be taught by industry experienced instructors in our working studios, where they’ll gain practical experience on professional-level consoles and recording equipment. Some highlights include: Develop your artist identity, online presence and visual brand, and execute a plan for promoting