ference Live Performance WorkshopsMI is unique in its focus on the stage, and Bass students are required to perform weekly in Live Performance Workshops (LPWs) as part of the curriculum. The song selections are changed weekly, allowing students to gain experience with diverse genres, making them stronger musicians for their careers beyond MI. Hollywood LocationOur campus is located in the middle of the entertainment industry, including the worlds of music, film, television and beyond. Students will have access to the finest live music venues, along with opportunities and possibilities to visit, intern and work at the best studios and sought after music labels in the world. Equipment & FacilitiesStudents will have access to top of the line basses, amps and more, that can be rented from our MI Library and used in our practice and performance studios. MI’s library is stocked with Fender, PRS, Suhrl, Schecter, Squier, ESP, and other top bass brands. MI has 45 general purpose counseling/practice labs that are equipped with amps and various equipment to serve any needs for classwork and beyond. Private Lessons with InstructorsMI instructors are also successful musicians and working professionals, bringing their experience into the classroom every day. Students have the unique opportunity to have one-hour private lessons with instructors, who can offer more personalized instruction and advice on their classwork and beyond. IMMERSIVE CURRICULUMBass students will gain exposure to various grooves like rock, funk, shuffle, swing, odd- meter, Brazilian, Afro-Cuban, country, and jam-band. They will also learn fretboard basics covering triads, chords, scales, harmonies and arpeggios. Live Performance WorkshopsMI is unique in its focus on the stage, and Bass students are required to perform weekly in Live Performance Workshops (LPWs) as part of the curriculum. The song selections are changed weekly, allowing students to gain experience with diverse genres, making them stronger musicians for their careers beyond MI. Hollywood LocationOur campus is located in the middle of the entertainment industry, including the worlds of music, film, television and beyond. Students will have access to the finest live music venues, along with opportunities and possibilities to visit, intern and work at the best studios and sought after music labels in the world. Equipment & FacilitiesStudents will have access to top of the line basses, amps and more, that can be rented from our MI Library and used in our practice and performance studios. MI’s library is stocked with Fender, PRS, Suhrl, Schecter, Squier, ESP, and other top bass brands. MI has 45 general purpose counseling/practice labs that are equipped with amps and various equipment to serve any needs for classwork and beyond. Private Lessons with InstructorsMI instructors are also successful musicians and working professionals, bringing their experience into the classroom every day. Students have the unique opportunity to have one-hour private lessons with instructors, who can offer more personalized instruction and advice on their classwork and beyond. Immersive CurriculumBass students will be taught by industry experienced instructors, where they’ll learn how to demonstrate stylistic depth and professional competence in preparation for careers in today’s music industry. Some highlights include: Exposure to various grooves like rock, funk, shuffles, swing, odd- meter, Brazilian, Afro-Cuban, country, and jam-band Fretboard basics covering triads, chords, scales, harmonies and arpeggios Reading fundamentals for the bass clef, with rhythmic subdivisions, pitch identification, and string positions i Facilities i Facilities > Full production sound stages and recording studios > Full production sound stages and recording studios > MI Library provides access to top of the line guitars, pedal boards, amps and more, all which can be rented from the library and used in our practice and performance studios > MI Libr