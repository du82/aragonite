full_description = "PARTNERS CAMPUS HOLLYWOOD Musicians Institute is part of Campus Hollywood, a worldwide family of arts, education, and entertainment- related companies. Other Campus Hollywood companies include: Theatre of Arts – School of acting to prepare the student for a successful career in film, television and theatre. PARTNERS Ableton – Ableton Live is a live music solution favored by producers, DJs, beatmakers, and remix Artists. Alesis – ADAT recording equipment Audiomidi – Recording hardware and software Audix – Microphones for MI’s live performance facilities. Cakewalk – Guitar recording software Carvin – PA systems in MI’s class and performance rooms. D’Addario – Strings Donner – Musical instruments, masterclasses and clinics, music industry opportunities Drum Workshop – Drum hardware ESP Guitars – Guitars and basses Evans Drumheads – Drum heads EZQuest – Hard drives Fender – Guitar and bass amplifiers for MI classrooms and performance stages. Grammy Museum – The Grammy Museum explores and celebrates the enduring legacies of all forms of music, the creative process, the art and technology of the recording process, and the history of the GRAMMY Awards, the premier recognition of recorded music accomplishment. Hal Leonard Corporation – Hal Leonard Corporations is the exclusive publisher and distributor for MI Press, the worldwide source for MI educational materials. Latin Percussion – Percussion equipment Line 6 – Digital guitar and bass recording amplification and processing. McDSP – Professional Plug-ins for Pro Tools HD, LE & M- Powered Systems Music Jobs – US Music Jobs is the premiere online networking community of music industry professionals, bands, and solo artists. Paiste – Cymbals Pearl – Drum kits Planet Waves – Musical and electronic accessories Premier – Drums and hardware Promark Drumsticks – Drum sticks Remo – Drum heads Sabian – Cymbals Schecter Guitars – Guitars and basses Shure – Professional microphones Sibelius – Music notation software. Steinberg – Professional MIDI, sequencing and recording software to MI. Suhr Guitars – Guitars and basses for MI student use and guitar amplifiers for performance stages. Taxi – Information and resources for MI students to further their professional and artistic careers. Sonic Reality – High End Soundware Plug-ins and Libraries. Visualsound – Guitar effect processors Yamaha – Digital recording, keyboard and drum equipment Zildjian – Cymbals"
