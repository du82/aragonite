rtainment industry, including the worlds of music, film, television and beyond. Students will have access to the finest live music venues, along with opportunities and possibilities to visit, intern and work at the best studios and sought after music labels in the world. Private Lessons with InstructorsMI instructors are also successful musicians and working professionals, bringing their experience into the classroom every day. Students have the unique opportunity to have one-hour private lessons with instructors, who can offer more personalized instruction and advice on their classwork and beyond. FULLY IMMERSIVE CURRICULUMKeyboard students will be taught by our industry-experienced instructors, where they’ll learn how to demonstrate stylistic depth, creative maturity and professional competence in preparation for careers in today’s music industry. Equipment & FacilitiesStudents will have access to top of the line guitars, pedal boards and more, that can be rented from our MI Library and used in our practice and performance studios. MI’s library is stocked with Fender, PRS, Kiesel, Strandberg, Suhr, ESP, Takamine, and other top guitar brands. MI has 45 general purpose counseling Live Performance WorkshopsMI is unique in its focus on the stage, and keyboard program students are required to perform weekly in Live Performance Workshops (LPWs) as part of the curriculum. The song selections are changed weekly, allowing students to gain experience with diverse genres, making them stronger musicians for their careers beyond MI. Hollywood LocationOur campus is located in the middle of the entertainment industry, including the worlds of music, film, television and beyond. Students will have access to the finest live music venues, along with opportunities and possibilities to visit, intern and work at the best studios and sought after music labels in the world. Private Lessons with InstructorsMI instructors are also successful musicians and working professionals, bringing their experience into the classroom every day. Students have the unique opportunity to have one-hour private lessons with instructors, who can offer more personalized instruction and advice on their classwork and beyond. Fully Immersive CurriculumKeyboard students will be taught by our industry-experienced instructors, where they’ll learn how to demonstrate stylistic depth, creative maturity and professional competence in preparation for careers in today’s music industry. Some highlights include: Develop your technique through a thorough study of traditional keyboard skills, including chords, scales, and arpeggios Acquire voice leading, comping, and improvising skills in a variety of contemporary grooves Master the details of analog and digital synthesizer programming Study keyboard-based approaches to composing, arranging, recording, and producing Take elective classes for scoring for visual media, music directing, electronic music, and more Equipment & FacilitiesStudents will have access to top of the line guitars, pedal boards and more, that can be rented from our MI Library and used in our practice and performance studios. MI’s library is stocked with Fender, PRS, Kiesel, Strandberg, Suhr, ESP, Takamine, and other top guitar brands. MI has 45 general purpose counseling/practice labs that are equipped with amps and various equipment to serve any needs for classwork and beyond. i Facilities i Facilities > Full production sound stages and recording studios > Full production sound stages and recording studios > Keyboard practice rooms with Boston pianos, synthesizers, and digital audio workstations > Keyboard practice rooms with Boston pianos, synthesizers, and digital audio workstations > Concert Hall access, with full audio/video recording capabilities > Concert Hall access, with full audio/video recording capabilities > Fully equipped practice facilities and computer labs with the latest industry standard equipment > Fully equipped practice facilities and computer 