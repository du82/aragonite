full_description = "MI PRESS Musicians Institute offers a full line of book, book/audio and video music instruction titles from MI Press written by MI instructors through an exclusive arrangement with Hal Leonard Corporation, the world’s largest print music publisher. MI Press presents techniques, concepts, examples and styles taught in classes at Musicians Institute by the authors themselves. The presentation reflects MI’s educational philosophy of focused concepts linked directly to practical application. MI PRESS CAN HELP YOU Thinking of applying to MI? MI Press can provide information and technical skills to help you prepare for your application and audition. Getting ready to attend MI? MI Press can help you prepare for the concepts and technical requirements of your program. Can’t attend MI? MI Press can help you study and practice on your own using MI’s approach to contemporary music education. Teaching? MI Press has titles applicable to students of every level and style. Visit Music Dispatch (Hal Leonard’s online distribution site) in order to purchase MI Press titles: MI PRESS GUITAR MI PRESS DRUM MI PRESS BASS MI PRESS KEYBOARD"
