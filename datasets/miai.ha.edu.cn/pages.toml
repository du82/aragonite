["https://miai.ha.edu.cn/resource9.php"]
title = "相关资源"
full_description = "作者：Muhammad Sajjad a,1, Salman Khan b,1, Khan Muhammad b, Wanqing Wu c, Amin Ullah b, Sung Wook Baik b,∗单位：a Digital Image Processing Laboratory, Department of Computer Science, Islamia College, Peshawar, Pakistan b Intellignet Media Laboratory, College of Electronics and Information Engineering, Sejong University, Seoul, Republic of Korea c CAS Key Laboratory of Human-Machine Intelligence-Synergy Systems, Shenzhen Institutes of Advanced Technology (SIAT), Shenzhen, 518055, China发表期刊：Journal of Computational Science 30 (2019) 174–182论文简介：许多计算机辅助诊断(CAD)系统最近出现在医学影像学的历史上，以帮助放射科医生了解他们的病人。为了充分协助放射科医师和更好地分析磁共振成像(MRI)，脑肿瘤的分级是必不可少的程序。在本文中，我们提出了一种新的基于卷积神经网络(CNN)的脑肿瘤分级系统。首先，利用深度学习技术对MR图像中的肿瘤区域进行分割。其次，通过大量的数据扩充，有效的训练了所提出的系统，避免了MRI在多级别脑肿瘤分类时缺乏数据的问题。最后，利用增强数据对预训练的CNN模型进行微调，用于脑肿瘤分级分类。在增强数据和原始数据上对该系统进行了实验评估，结果表明，与现有方法相比，该系统具有令人信服的性能。研究方向：脑胶质瘤分级 作者：Geethu Mohan, M. Monica Subashini ∗单位：School of Electrical Engineering, VIT University, Vellore, 632014, India发表期刊：Biomedical Signal Processing and Control 39 (2018) 139–161论文简介：本文就近年来脑磁共振影像的分割和肿瘤分级技术作一综述。脑瘤的早期发现和分级的必要性是本研究的动机。在磁共振成像(MRI)中，肿瘤可能显示清晰，但医生需要量化肿瘤区域以进一步治疗。这就是数字图像处理方法与机器学习一起帮助进一步诊断、治疗、术前和术后程序，以及放射科医生和计算机之间的协同作用。这些混合技术提供了第二意见和协助放射科医师理解医学图像，从而提高诊断准确性。本文以包括星形细胞瘤在内的胶质瘤为靶点，回顾了肿瘤感染人脑MR图像的分割和分类的发展趋势。该方法用于提取和分级的肿瘤，可纳入标准的临床成像协议阐明。最后，对该技术的现状、未来发展和趋势进行了重要的评估。研究方向：基于MRI图像的脑肿瘤分类综述"
