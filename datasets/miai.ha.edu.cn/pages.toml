title = "科研成果"
full_description = "泛影云（AnyImaging Cloud）项目是基于IPv6、5G、云计算、边缘计算、移动计算等新技术实现的一个医学影像云服务平台，支持患者、基层医院和三甲医院间的数据传输，能够对医学影像数据进行自动分析和辅助诊断，实现远程诊疗和分级诊疗功能。 泛影阅片（AnyImaging Reader）是一款医学图像阅读、处理软件，为医生、科研人员、病人提供免费易用的医学影像阅片功能。本软件在国家“信创”产业发展的背景下，聚焦基础性的医学影像处理软件研发，支持国产软硬件平台，推动医学影像处理软件的国产化。"
