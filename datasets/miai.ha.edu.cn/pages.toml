title = "相关资源"
full_description = "作者：Dongyang Kuang1 and Tanya Schmah 1 单位：1 Department of Math & Stat University of Ottawa, Ottawa, Canada发表期刊：Lecture Notes in Computer Science,2019,LNCS 11861:46-54论文简介：本文提出了一种新的无监督学习算法“ FAIM”，用于3D医学图像配准。与流行的“ U-net” 相比，该网络具有不同的体系结构，可获取一对完整的图像体积，并预测将源对准目标所需的位移场。与基于V-elMorph的基于“ U-net”的配准网络相比，FAIM具有较少的可训练参数，但可以通过Mindboggle-101数据集中区域标签上的Dice得分判断获得更高的配准精度。FAIM产生的变形具有较少的“折叠”，即表面在其自身折叠的不可逆区域。我们发现，在一定范围的超参数（两个网络使用相同的值）下，FAIM能够保持较高的精度和与VoxelMorph相比更少的“折叠”位置的优点。此外，当为了获得更好的可逆性而权衡配准精度时，FAIM需要更少的配准精度牺牲。研究方向：医学图像配准（深度学习） 作者：MGuha Balakrishnan 1, Amy Zhao1, Mert R. Sabuncu2, John Guttag 1, and Adrian V. Dalca 1单位：1 Computer Science and Artificial Intelligence Lab, MIT, Cambridge, MA, USA， 2 School of Electrical and Computer Engineering, Cornell University, Ithaca, NY, USA发表期刊：IEEE TRANSACTIONS ON MEDICAL IMAGING,2019,38:1788-1800论文简介：我们提出了VoxelMorph，这是一个基于快速学习的框架，用于可变形的成对的医学图像配准。我们通过卷积神经网络（CNN）参数化函数，并在一组图像上优化神经网络的参数。给定新的扫描对，VoxelMorph通过直接评估函数快速计算变形场。在这项工作中，我们探索两种不同的训练策略。在第一个（无监督）设置中，我们训练模型以最大化基于图像强度的标准图像匹配目标函数。在第二种设置中，我们利用训练数据中可用的辅助分割。我们证明了无监督模型的准确性可与最先进方法相媲美，而运算速度要快几个数量级。我们还表明，使用辅助数据训练的VoxelMorph在测试时可提高的配准准确性，并评估训练集大小对配准的影响。我们的方法有望加快医学图像分析和处理流程，同时促进基于学习的配准及其应用的新颖方向。研究方向：医学图像配准（深度学习）"
