title = "相关资源"
full_description = "作者：Yvan Saeys 1, * , In˜aki Inza 2 and Pedro Larran˜aga 2单位：1 Department of Plant Systems Biology, VIB, B-9052 Ghent, Belgium and Bioinformatics and Evolutionary Genomics group, Department of Molecular Genetics, Ghent University, B-9052 Ghent, Belgium 2 Department of Computer Science and Artificial Intelligence, Computer Science Faculty, University of the Basque Country, Paseo Manuel de Lardizabal 1, 20018 Donostia - San Sebastia´n, Spain.发表期刊：BIOINFORMATICS, 2007, 23, 2507-2517论文简介：特征选择技术已成为许多生物信息学应用的明显需要。除了在机器学习和数据挖掘领域已经开发出的大量技术之外，生物医学中的具体应用也催生了大量新技术。文中，作者让感兴趣的读者了解特征选择的可能性，提供了特征选择技术的基本分类，并讨论了它们在许多常见的和即将到来的生物信息学应用程序中的使用、多样性和潜力。研究方向：特征选择（生物医学方向综述） 作者：Ling Wanga,b,∗, Jianyao Menga,b, Ruixia Huanga,b, Hui Zhua,b, Kaixiang Peng a,b单位：a College of Automation and Electrical Engineering, University of Science and Technology Beijing, Beijing 100083, China b Key Laboratory of Knowledge Automation For Industrial Processes, University of Science and Technology Beijing, Ministry of Education, Beijing 100083, China发表期刊：FUZZY sets and systems, 2019, 368, 1-19.论文简介：本文主要研究模糊数据流的模糊特征选择。提出了一种新的增量特征加权方法，该方法包括离线模糊特征选择和在线模糊特征选择两个主要阶段。使用滑动窗口对模糊数据集进行划分。在每一个新的滑动窗口中执行在线特征选择算法。根据模糊输入特征的重要程度，将前一个滑动窗口的模糊特征选择结果与当前候选模糊特征集相结合，对当前窗口的特征子集进行更新。最后，利用滑动窗口之间的模糊特征权值，找出模糊输入特征的演化关系。研究方向：特征选择算法"
