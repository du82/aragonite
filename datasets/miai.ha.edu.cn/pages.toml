["https://miai.ha.edu.cn/resource2.php"]
title = "相关资源"
full_description = "作者：Qing Zhou1,2,Zhiyong Zhou1,Chunmiao Chen3;单位：1 Chinese Academy of Sciences ,2 University of Science and Technology of China ,3 Wenzhou Medical College ,4 Soochow University (Suzhou)发表期刊：Computers in Biology and Medicine, vol. 107, 2019, pp. 47–57.论文简介：肝细胞癌（HCC）分化的临床组织学分级对临床诊断、治疗和预后有重要意义。然而，对于放射科医生来说，从医学图像中评估肝癌分级是一个挑战。本研究将三维密集卷积网络（DenseNet）中的压缩与激励网络（SENets）相结合，发展了一种新的深部神经网络，称为三维sedensenet，利用来自两个不同临床中心的增强临床磁共振（MR）图像对HCC分级进行分类。在三维DenseNet的密集块之间增加一层SENet，以减轻特征冗余的影响。对于HCC分级任务，在数据增强后训练3D-SE-DenseNet，其性能优于基于临床数据集的3D-DenseNet。基于该数据集，对两级HCC分级任务中的3D-SE-DenseNet进行了定量评价，其中包括213个动态增强MR图像样本。与3D-DenseNet的72%精度相比，所提出的3D-SE-DenseNet的精度为83%。三维SE-DenseNet具有SE层自动特征学习的优点，可以同时处理有用的特征增强和多余的特征抑制。定量实验证实了3D-SE-DenseNet在评价肝癌分级中的优越性。研究方向：深度学习（模型修改） 作者：Mingxing Tan,Quoc V. Le单位：google发表期刊：International Conference on Machine Learning, 2019, pp. 6105–6114.论文简介：卷积神经网络（ConvNets）通常是在固定的资源预算下发展起来的，如果有更多的资源可用的话，则会扩大规模以获得更好的精度。在本文中，我们系统地研究了模型缩放，并发现仔细地平衡网络的深度、宽度和分辨率可以获得更好的性能。在此基础上，我们提出了一种新的标度方法，该方法使用简单而高效的复合系数均匀地标度深度/宽度/分辨率的所有维度。我们证明了这种方法在放大MobileNets和ResNet上的有效性。 更进一步，我们使用神经架构搜索设计了一个新的基线网络，并将其放大以获得一个称为有效网的模型族，该模型比以前的有效网具有更好的精度和效率。特别是，我们的EfficientNet-B7在ImageNet上达到了最先进的84.4%的top-1/97.1%的top-5精度，同时比现有最好的ConvNet小8.4倍，推理速度快6.1倍。我们的效率集在CIFAR-100（91.7%）、Flowers（98.8%）和其他3个传输学习数据集上也传输良好，达到了最新的精确度，参数减少了一个数量级。研究方向：深度学习（卷积神经网络框架）"
year_published = 2025
clearnet = "https://miai.ha.edu.cn/resource2.php"
