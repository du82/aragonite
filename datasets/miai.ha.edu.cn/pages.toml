["https://miai.ha.edu.cn/tuanduichengyuan.html"]
title = "团队成员"
full_description = "林予松，男，博士，郑州大学软件与应用科技学院教授，博士生导师。1993年获得南京大学计算机应用学士学位，1998年获得郑州大学计算机软件硕士学位，2005年获得解放军信息工程大学通信与信息系统博士学位。 2006年-2008年在美国波士顿从事Web-based Application的研究和开发工作。现任河南省教育科研网网络中心常务副主任，郑州大学互联网医疗与健康服务河南省协同创新中心副主任，河南首教育信息安全监测中心主任。发表互联网及医疗领域学术论文60余篇，主持国家级科研项目2项，省部级科研项目6项；出版专业著作5部，获得省级科研奖励3项。目前主要研究方向：医学影像与人工智能，互联网新技术。 王梅云，河南省人民医院影像科主任，河南省医学影像中心主任。博士、主任医师、教授，博士生导师，美国哈佛大学医学院博士后，美国约翰霍普金斯医学院访问教授。 国际华人医学磁共振学会（OCSMRM）“突出贡献奖”及中华放射学会年度金奖-杰出青年奖获得者。首批入选爱思唯尔国际影像数据库中国知名放射学专家。国际医学磁共振学会(ISMRM)理事，河南省放射学会副主任委员，国际权威SCI期刊Radiology等多家杂志审稿专家。主持国家自然科学基金重点国际合作项目1项、国家重点研发计划政府间合作重点专项1项，国家自然科学基金项目3项、省杰出人才、省杰出青年等省部级项目6项；发表论文60余篇，其中SCI论文40余篇，被引用900余次，且论文入选全球TOP 1% ESI高被引论文；获省科技进步奖4项。研究方向：神经系统疾病影像诊断与研究、磁共振新技术的应用。 李英豪，博士，副教授，硕士生导师，2010年毕业于郑州大学计算机科学与技术专业，获得工学学士学位；2016年毕业于重庆大学计算机科学与技术专业，获得工学博士学位。2016年至今在郑州大学软件学院任教。 主要研究方向：图像配准，点云配准，机器学习，模式识别等"
