["https://miai.ha.edu.cn/resource6.php"]
title = "相关资源"
full_description = "作者：Bin Xiao, Han Tang, Yanjun Jiang, Weisheng Li, Guoyin Wang 单位：Chongqing Key Laboratory of Computational Intelligence, Chongqing University of Posts and Telecommunications, Chongqing 400065, China发表期刊：June 2015 Neurocomputing 157 DOI:10.1016/j.neucom.2015.01.025论文简介：本文提出了一种新的空间配准多模态医学图像融合框架，该框架主要基于非下采样轮廓变换(NSCT)。该方法能够将源医学图像分解为NSCT域的低频段和高频段。然后应用不同的融合规则应用于变换图像的不同频带。融合系数由以下融合规则实现：低频分量使用归一化香农熵的活动度量进行融合，它本质上是从具有高度集中的聚焦区域中选择低频分量。相反，高频分量使用指令对比度进行融合，该对比度本质上从源收集所有信息纹理。以四组人脑和两幅来自不同来源的临床骨图作为实验对象，说明了该框架的性能。实验结果和与其他方法的比较表明，该框架在主观和客观评估标准上都具有较好的性能。研究方向：医学图像融合 作者：Ming Yin a, Xiaoning Liu a, Yu Liu b, and Xun Chen C单位：a School of Mathematics, Hefei University of Technology, Hefei 230009, China. b Department of Biomedical Engineering, Hefei University of Technology, Hefei 230009, China (e-mail: yuliu@hfut.edu.cn). c Department of Electronic Science and Technology,University of Science and Technology of China, Hefei 230026, China.发表期刊：IEEE Transactions on Instrumentation and Meaurement,2019,68(1):49-64论文简介：本文提出了一种新的非下采样剪切变换(NSST)领域的多模态医学图像融合方法。在所提出的方法中，首先对源图像进行NSST分解，得到它们的多尺度和多方向表示。通过参数自适应脉冲耦合神经网络(PA-PCNN)模型对高频波段进行融合，其中所有PCNN参数都可以由输入波段自适应估计。低频波段被一种新的策略合并，该策略同时处理两个医学图像融合的关键问题，即能量保存和细节提取。最后，通过对融合的高频和低频进行逆NSST重建融合图像。通过四种不同类型的医学图像融合问题(计算机断层扫描(CT)和磁共振(MR)、MR-T1和MR-T2，MR和PET，MR和单光子发射CT]总共有80对以上的源图像验证了该方法的有效性。实验结果表明，该方法与另外九种具有代表性的医学图像融合方法相比，具有竞争力的性能，也是目前视觉质量和客观评估的最好结果。研究方向：图像融合"
