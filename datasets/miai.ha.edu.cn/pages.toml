["https://miai.ha.edu.cn/resource10.php"]
title = "相关资源"
full_description = "作者：Jing Zhao a, Xijiong Xie a, Xin Xu b, Shiliang Sun a,∗单位：a Department of Computer Science and Technology, East China Normal University, 3663 North Zhongshan Road, Shanghai 200062, PR China b College of Mechatronics and Automation, National University of Defense Technology, Changsha, 410073, PR China发表期刊：Information Fusion, 2017, 38:43-54论文简介：多视角学习是机器学习中的一个新兴方向，它考虑通过多视角学习来提高泛化性能。多视角学习也称为来自多个功能集的数据融合或数据集成。文中首先回顾了理论基础，以了解多视角学习的属性和行为。然后，按照三个类别描述多视角学习方法，以提供一个整洁的分类和组织。对于每种类别，都提出了代表性算法和新提出的算法。这项调查的主要特点是，我们在与早期方法保持一致的基础上，为多视角学习方法的最新发展提供了全面的介绍。我们还将尝试确定有前途的场所，并指出一些具体的挑战，这些挑战有望推动这一快速发展领域的进一步研究。研究方向：多视角学习(综述) 作者：Hongliu CAO∗a,b, Simon BERNARDa, Robert SABOURINb, Laurent HEUTTEa单位：a Normandie Univ, UNIROUEN, UNIHAVRE, INSA Rouen, LITIS, 76000 Rouen, France b Laboratoire d’Imagerie, de Vision et d’Intelligence Artificielle, École de Technologie Supérieure, Université du Québec, Montreal, Canada发表期刊：Pattern Recognition, 2019, 88:185-197论文简介：文中首先表明Radiomics分类问题应被视为高维，低样本量，多视角的学习问题。然后，提出了一种基于差异的方法，用于合并来自不同视角的信息，基于随机森林分类器。在不同的公共多视角数据集以及Radiomics数据集上，将所提出的方法与不同的最新Radiomics和多视角解决方案进行了比较。实验表明，所提出的方法比Radiomics以及多视角学习文献中的最新方法效果更好。研究方向：多视角学习（医学影像分类）"
