["https://miai.ha.edu.cn/resource.php"]
title = "相关资源"
full_description = "作者：Virendra Kumar a, Yuhua Gu a, Satrajit Basu b, Anders Berglund c, Steven A. Eschrich c, Matthew B. Schabathd, Kenneth Forster e, Hugo J.W.L. Aerts f ,h, Andre Dekker f , David Fenstermacher c, Dmitry B. Goldgof b, Lawrence O. Hall b, Philippe Lambin f , Yoganand Balagurunathan a, Robert A. Gatenby g, Robert J. Gillies a, g,⁎单位：a Department of Cancer Imaging and Metabolism, H. Lee Moffitt Cancer Center and Research Institute, Tampa, FL, USA; b Department of Computer Science and Engineering, University of South Florida, Tampa, FL, USA; c Department of Bioinformatics, H. Lee Moffitt Cancer Center and Research Institute, Tampa, FL, USA; d Department of Cancer Epidemiology, H. Lee Moffitt Cancer Center and Research Institute, Tampa, FL, USA; e Department of Radiation Oncology, H. Lee Moffitt Cancer Center and Research Institute, Tampa, FL, USA; f Department of Radiation Oncology (MAASTRO), GROW-School for Oncology and Developmental Biology, Maastricht University Medical Center, Maastricht, the Netherlands; g Department of Radiology, H. Lee Moffitt Cancer Center and Research Institute, Tampa, FL, USA; h Computational Biology and Functional Genomics Laboratory, Department of Biostatistics and Computational Biology, Dana-Farber Cancer Institute, Harvard School of Public Health, Boston, MA, USA发表期刊：Magnetic Resonance Imaging 30 (2012) 1234–1248论文简介：影像组学是指从计算机断层扫描，正电子发射断层扫描或磁共振成像获得的医学图像中提取和分析大量具有高通量的高级定量成像特征。影像组学一般采用数据挖掘建立图像特征与表型或基因蛋白特征关系的描述性和预测性模型，为后续的诊断、预后和预测提供有价值的信息。影像组学的流程包括图像采集和重建，图像分割和渲染，特征提取和特征限定，数据库和数据共享以及信息分析。每个过程都需要克服其自身的挑战，例如，必须确定和协调用于图像获取和重建的最佳协议；分段必须是鲁棒的，并且涉及最少的操作输入；必须生成允许结合图像特征和图像注释以及医学和遗传数据的信息数据库。 由于影像组学不是一个成熟的研究领域，因此必须优化用于分析这些数据的统计方法。本文将依次讨论每一个子过程，过程中所面临的挑战以及解决这些挑战的建议方法。研究方向：影像组学（综述）"
