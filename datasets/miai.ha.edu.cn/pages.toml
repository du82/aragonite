["https://miai.ha.edu.cn"]
title = "医学影像与人工智能"
full_description = "郑州大学医学影像与人工智能团队致力于医工交叉的医学影像辅助诊断技术与应用研究，基于多模态临床影像数据，采用机器学习和深度学习方法，挖掘影像中的量化信息，构建多种疾病预测及分类模型，用于临床辅助诊断及个性化医疗。 团队目前包括教授2人，副教授2人，讲师4人，助理研究员2人，其中博士生导师2人，硕士生导师5人。团队依托互联网医疗与健康服务河南省协同创新中心以及郑州大学网络空间安全学院开展研究工作，近年来团队成员主持多项国家和省部级科研课题，获得河南省科技进步一等奖2项、河南省医学科技进步一等奖1项，发表学术论文100余篇，其中包括多篇JCR一区、二区论文。 团队的学术带头人为林予松教授，主要成员包括：王梅云教授、张茜副教授、李英豪副教授、赵哲讲师、崔勇讲师、董洁讲师、吴亚平助理研究员、赵国桦助理研究员等。 医学影像与人工智能领域的重要论文、软件、代码、视频资料，以及丰富的机器学习资料。 医学影像与人工智能领域重要的学术期刊和学术会议信息，可以作为研究人员的投稿参考。"
