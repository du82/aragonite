title = "相关资源"
full_description = "作者：Xiaomei Zhao1,2, Yihong Wu1, Guidong Song3, Zhenye Li4, Yazhuo Zhang3,4,5,6, and Yong Fan7单位：1. National Laboratory of Pattern Recognition, Institute of Automation, Chinese Academy of Sciences 2.University of Chinese Academy of Sciences, Beijing, China 3.Beijing Neurosurgical Institute, Capital Medical University, Beijing, China 4.Department of Neurosurgery, Beijing Tiantan Hospital, Capital Medical University, Beijing, China 5.Beijing Institute for Brain Disorders Brain Tumor Center, Beijing, China 6.China National Clinical Research Center for Neurological Diseases, Beijing, China 7.Department of Radiology, Perelman School of Medicine, University of Pennsylvania, Philadelphia, PA, USA发表期刊：Medical image analysis, 2018, 43: 98-111.论文简介：论文将全卷积神经网络与条件随机场结合实现肿瘤分割，归一化、偏置场校正做预处理，利用三个二维方向（轴向，冠状，矢状）上的图像做分割，融合三个方向上的分割结果，删除小连通区域做后处理。研究方向：脑肿瘤分割 作者：Olaf Ronneberger, Philipp Fischer, and Thomas Brox单位：Computer Science Department and BIOSS Centre for Biological Signalling Studies, University of Freiburg, Germany发表期刊：International Conference on Medical image computing and computer-assisted intervention. Springer, Cham, 2015: 234-241.论文简介：论文提出了医学图像中经典的分割网络U-Net，该网络包括一个用于获取图像上下文信息的下采样路径和一个能够进行精确定位的对称上采样路径，可以快速高效的完成分割。研究方向：医学影像数据预处理（图像增强） 作者：Konstantinos Kamnitsasa,∗, Christian Lediga , Virginia F.J. Newcombeb,c, Joanna P. Simpsonb, Andrew D. Kaneb, David K. Menonb,c, Daniel Rueckerta, Ben Glockera单位：a. Biomedical Image Analysis Group, Imperial College London, UK b. University Division of Anaesthesia, Department of Medicine, Cambridge University, UK c. Wolfson Brain Imaging Centre, Cambridge University, UK发表期刊：Medical image analysis, 2017, 36: 61-78.论文简介：论文提出了一个网络结构DeepMedic用来解决3D图像中的脑肿瘤分割问题，该结构包含双路卷积通道，共11层，以多尺度图像块为输入，在脑损伤、脑肿瘤等分割任务中达到了SOTA的性能。研究方向：脑肿瘤分割"
