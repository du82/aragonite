["https://miai.ha.edu.cn/resource3.php"]
title = "相关资源"
full_description = "作者：Lijun Liu a,b,c, Lizhen Wang a,∗, Qingsong huang b,c, Lihua Zhou a, Xiaodong Fu b,c, Li Liu b,c单位：a Department of Computer Science and Engineering, School of Information Science and Engineering, Yunnan University, Kunming 650091, China; b Computer Technology Application Key Laboratory of Yunnan Province (Faculty of Information Engineering and Automation, Kunming University of Science and Technology), Kunming, 650500, China; c Faculty of Information Engineering and Automation, Kunming University of Science and Technology, Kunming, 650500, China发表期刊：Computer Methods and Programs in Biomedicine, 2019, 187:105088论文简介：医学高分辨率图像在图像处理和计算机视觉应用中非常重要，在图像指导的诊断，临床试验，咨询和病例讨论中发挥着至关重要的作用。如何有效地访问移动远程医疗系统中的医学高分辨率图像成为一个巨大的挑战。因此，本文提出了一种有效的金字塔体系结构，用于优化医学高分辨率图像的传输和渲染。本文所提出的体系结构包括三个核心方案：（1）基于几何关系的不平衡金字塔方案；（2）基于哈希表和晶格划分的索引方案；（3）基于相似匹配的查询方案。然后，我们设计响应式服务组件：生成服务，索引服务和查询服务。最终，这些服务被组合到一个原型系统中，该系统能够有效传输和渲染医学高分辨率图像。结果表明，不平衡金字塔方案可以快速生成金字塔结构和相应的图像文件。索引方案可以实时创建索引结构和索引文件。该查询方案不仅可以实时匹配图像块所属的最佳层，而且可以准确地捕获查询图像块。基于该架构的原型系统完全符合DICOM标准，该标准可以与其他现有医疗系统或移动应用程序无缝集成，并可以用于各种情况，例如诊断，研究和教育。研究方向：医学图像传输（金字塔方案）"
