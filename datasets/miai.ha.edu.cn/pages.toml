["https://miai.ha.edu.cn/resource11.php"]
title = "相关资源"
full_description = "DCMTK 是由德国offis公司提供的开源项目，并拥有相应的版权。这个开发包经过10多年的开发和维护，已经基本实现了 DICOM 协议的所有内容。该开发包提供所有的源代码、 支持库和帮助文档。DCMTK 提供了在各种操作系统下使用的可能版本,如LINUX、SUN、WINDOWS 等，用户可更具自己的开发平台进行编译。 ITK 是一个开源的跨平台库，由C++实现，为开发人员提供了一套广泛的图像分析软件工具。ITK 通过极限编程方法开发，建立在经过验证的面向空间的架构上，用于处理、分割和配准两个、三个或更多维度的科学图像。ITK 功能强大用于图像的分析和处理，但是无法完成可视化，需要结合一些其它的工具，如VIK，来显示信息。 ITK-SNAP 是用于分割3D医学图像中的结构的软件应用程序。ITK-SNAP 是免费、开源和多平台的。ITK-SNAP使用主动轮廓方法以及手动描绘和图像导航提供半自动分割。除了这些核心功能之外，ITK-SNAP 还提供了许多支持实用程序。与其他更大的开源图像分析工具相比，ITK-SNAP 设计专门针对图像分割问题，将无关或不相关的特征保持在最低限度。该设计还强调交互性和易用性，大部分开发工作都致力于用户界面。 MaZda 是用于计算数字化图像中的纹理参数（特征）的计算机程序。程序代码是用 C++ 和 Delphi© 编写的。它是为使用 MS Windows® 9x/NT/2000/XP 操作系统的 PC 计算机编译的。除了 MaZda 软件之外，MaZda 软件包还包含用于纹理分析和可视化的 B11 程序。 Medical Imaging Interaction Toolkit (MITK) 是一个免费的开源软件，用于开发交互式医学图像处理软件。该软件结合了 ITK 和 VTK 的特性，在 ITK 和 VTK 的基础上开发了更多用户交互的特性。MITK 的主要目的是为医学图像社区提供一个一致的框架，以结合医学图像分割、配准和可视化的功能。"
