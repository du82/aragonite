full_description = "作者：Wangmeng Zuo, Lei Zhang, Chunwei Song, David Zhang and Huijun Gao单位：Computer Science, Medicine, Mathematics IEEE Transactions on Image Processing发表期刊：Lecture Notes in Computer Science,2019,LNCS 11861:46-54论文简介：自然图像统计在图像去噪中起着重要的作用，基于梯度、基于稀疏表示和基于非局部自相似性的自然图像先验在去噪中得到了广泛的研究和应用。尽管许多去噪算法取得了巨大的成功，但它们在去噪时往往会使尺度较细的图像纹理变得平滑，从而降低图像的视觉质量。为了解决这一问题，本文提出了一种纹理增强的图像去噪方法，使去噪图像的梯度直方图与原始图像的参考梯度直方图保持一致。在参考梯度直方图的基础上，提出了一种新的梯度直方图保存算法，在去除噪声的同时增强纹理结构。针对由不同纹理区域组成的图像，提出了两种基于区域的GHP变量去噪方法。提出了一种基于噪声观测的未知图像的参考梯度直方图估计算法。实验结果表明，该算法能够很好地保留去噪后图像的纹理外观，使图像看起来更加自然。研究方向：医学影像数据预处理（图像增强） 作者：Chengwei Liu, Xiubao Sui *, Xiaodong Kuang, Yuan Liu, Guohua Gu and Qian Chen单位：School of Electronic and Optical Engineering, Nanjing University of Science and Technology, Nanjing 210094, China;发表期刊：April 2019·Remote Sensing 11(7):849 DOI:10.3390/rs11070849论文简介：为了提高红外图像的视觉质量，提出了一种结合全局和局部增强结果的优化对比度增强方法。全局增强和局部增强各有优缺点。该方法利用了两种方法的互补特性，实现了明显的对比度增强而不产生伪影。该方法首先计算包含全局和局部灰度分布特征的二维直方图。然后，在二维直方图的基础上，全局和局部应用直方图规范，得到全局和局部增强的结果。最后，通过求解一个全局和局部约束条件下的优化方程来计算增强结果。基于原始图像的边缘信息自适应确定优化方程的像素级正则化参数。因此，该方法能够在保持原始图像自然度的同时增强局部对比度。定性和定量评价结果表明，该方法在提高红外图像的视觉质量方面优于基于分块的方法。研究方向：医学影像数据预处理（图像增强）"
