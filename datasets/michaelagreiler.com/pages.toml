["https://www.michaelagreiler.com/100-public-data-sets-for-data-science"]
title = "100+ public data sets for data scientist and founders - Dr. McKayla"
description = "Public data sets are a bliss to start a new business or accelerate your existing business. With the help of algorithms you can learn insights from the data sets that can be used to solve problems or to make predictions."
full_description = 'Research 100+ public data sets for data scientist and founders January 10, 2019February 17, 2019 Dr. Michaela Greiler 0 Comments Public data sets can be a bliss. Obviously, when you are into big data or a data scientist, public data sets excite you. Like me, by the way. But, also if you are planning to start a business or accelerate your existing business, public data sets might be exactly what you are looking for. <img fetchpriority="high" decoding="async" width="800" height="570" data-attachment-id="329" data-permalink="https://www.michaelagreiler.com/100-public-data-sets-for-data-science/carlos-muza-84523-unsplash/" data-orig-file="https://i2.wp.com/www.michaelagreiler.com/wp-content/uploads/2019/01/carlos-muza-84523-unsplash.jpg?fit=2426%2C1728&amp;ssl=1" data-orig-size="2426,1728" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="carlos-muza-84523-unsplash" data-image-description="" data-medium-file="https://i2.wp.com/www.michaelagreiler.com/wp-content/uploads/2019/01/carlos-muza-84523-unsplash.jpg?fit=300%2C214&amp;ssl=1" data-large-file="https://i2.wp.com/www.michaelagreiler.com/wp-content/uploads/2019/01/carlos-muza-84523-unsplash.jpg?fit=800%2C570&amp;ssl=1" src="https://i2.wp.com/www.michaelagreiler.com/blog/wp-content/uploads/2019/01/carlos-muza-84523-unsplash-1024x729.jpg?resize=800%2C570&#038;ssl=1" alt="Shows a laptop with a data analysis chart" class="wp-image-329" srcset="https://i2.wp.com/www.michaelagreiler.com/wp-content/uploads/2019/01/carlos-muza-84523-unsplash.jpg?resize=1024%2C729&amp;ssl=1 1024w, https://i2.wp.com/www.michaelagreiler.com/wp-content/uploads/2019/01/carlos-muza-84523-unsplash.jpg?resize=300%2C214&amp;ssl=1 300w, https://i2.wp.com/www.michaelagreiler.com/wp-content/uploads/2019/01/carlos-muza-84523-unsplash.jpg?resize=768%2C547&amp;ssl=1 768w, https://i2.wp.com/www.michaelagreiler.com/wp-content/uploads/2019/01/carlos-muza-84523-unsplash.jpg?resize=1200%2C855&amp;ssl=1 1200w, https://i2.wp.com/www.michaelagreiler.com/wp-content/uploads/2019/01/carlos-muza-84523-unsplash.jpg?w=1600&amp;ssl=1 1600w, https://i2.wp.com/www.michaelagreiler.com/wp-content/uploads/2019/01/carlos-muza-84523-unsplash.jpg?w=2400&amp;ssl=1 2400w" sizes="(max-width: 800px) 100vw, 800px" data-recalc-dims="1" /> Data can fuel your business. Photo by Carlos Muza on Unsplash What can you do with public data sets? Well, you can learn from them. Well, not you, but algorithm can learn from data sets. And what they learn, you can use to predict. Yes, that’s like reading into the future. If you want to start a business, then the insights you find can be your new product. If you have already a business, you might find new insights to improve your current business. Which domain should that data set come from? That really depends on the business you are or want to be in. One type of public data sets that I am looking for are medical data sets. Why? Because I love to research diseases and their cures and treatments. I love if I discover potential remedies that haven’t been marketed to the mass. Currently, I research those qualitatively. That means, I look them up by hand. This approach is a great start to understand the data and the domain. Using public data sets and analyzing them quantitatively takes this approach to the next level. Be aware of the quality of the public data set Public data sets are always of different quality. Some are very noisy. Others are of high quality. It is not easy to assess the quality at first sight. Even if data can be cleaned to some degree, you will get better results with better data. Another aspect is that data sets come in all kind of formats. Some formats are proprietary and harder to work with. Understanding the format is a large part of the work. 100+ Public data sets If you read that far, you probably also love data sets, like I do. So without further ado, here are the public data sets I found so far. Awesome Public Datasets: https://github.com/awesomedata/awesome-public-datasetsMany of the AWS data sets come with a usage example, which of course is very helpful to get the hang of it: https://registry.opendata.aws/Kaggel is a website focusing on data science and has an extensive list of available data sets: https://www.kaggle.com/datasetsThis article comprises 50 public data sets for machine learning ranging from https://medium.com/datadriveninvestor/the-50-best-public-datasets-for-machine-learning-d80e9f030279This list is especially for students and comprises 19 data sets https://www.springboard.com/blog/free-public-data-sets-data-science-project/Here you can find a list of 7 public data sets: https://www.tableau.com/learn/articles/free-public-data-setsThis article lists 33 data sources you can use for free https://www.forbes.com/sites/bernardmarr/2016/02/12/big-data-35-brilliant-and-free-data-sources-for-2016/#43ca441fb54d Please send me an email or leave a comment if you know good quality data sets. Updated on February 17th, 2019 Related articles'
