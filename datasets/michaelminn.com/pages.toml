["http://michaelminn.com/linux/mmqgis"]
title = "MMQGIS"
full_description = '''MMQGIS Michael Minn (http://michaelminn.com) 9 November 2024 Describes use of MMQGIS, a set of Python vector map layer plugins for Quantum GIS Introduction MMQGIS is a set of Python plugins for manipulating vector map layers in Quantum GIS: CSV input/output/join, geocoding, geometry conversion, buffering, hub analysis, simplification, column modification, and simple animation. MMQGIS provides verbose progress reporting, an intuitive user interface, direct file access, and some additional capabilities missing from other plugin sets such as the Processing toolbox. Getting MMQGIS MMQGIS is included in the Quantum GIS Plugin Repository and should be readily available in the QGIS Python Plugin Installer (Plugins -> Fetch Python Plugins). A zip file of the current release is also available here for manual installation. Links to older versions are listed in the Version History at the bottom of this page. Data Formats Input layers can be from any geospatial data source supported by QGIS. Output file format are implied by the file extension given on the output file name. Formats currently supported through OGR/GDAL include: ESRI Shapefile (*.shp) GeoJSON (*.geojson) SQLite (Spatialite) (*.sqlite) KML (*.kml) GPKG (GeoPackage SQLite file) (*.gpkg) MMQGIS assumes that input and output files are encoded in the UTF-8 character set. MMQGIS uses the standard Python CSV file interface functions, which do not handle unicode or other multi-byte encodings. While files that use the lower 7-bits of the 8-bit Windoze character sets (ISO-8859-x) will generally be fine, unpredictable results and errors may occur with non-ASCII characters in non-UTF-8 character sets. See this and this for two ways to save a UTF-8 CSV from Excel. Python Scripting with MMQGIS MMQGIS contains a library module (mmqgis_library.py) that can also be used for Python scripting from the QGIS console, or in stand-alone scripts executed directly in Python. API information is included with the descriptions for each tool, and a guide to scripting is at the end of this document. Licensing MMQGIS is free software and is offered without guarantee or warranty. You can redistribute it and/or modify it under the terms of version 2 of the GNU General Public License (GPL v2) as published by the Free Software Foundation (www.gnu.org). Bug reports or suggestions are welcome at the e-mail address above, but I cannot promise a prompt or mutually satisfactory resolution. Animation Tools The animation tools create simple map animations as sequences of map image PNG files. Images are exported from print layouts so at least one print layout must be defined. Map layouts permit adjustment of map extent, size, and DPI, as well as the ability to add additional cartographic elements to the output images. Images may be combined into a single animated GIF using Gimp. This is the technique used for the example GIF files below. Images may also be combine into video files using FFmpeg. For example, this creates a 30 FPS silent MPEG4 file using an h.264 codec that can be played in contemporary web browsers: ffmpeg -r 30 -s 1280x720 -start_number 0 -i frames/frame%04d.png -vcodec libx264 -crf 1 -pix_fmt yuv420p temp.mp4 Animate Lines Animated branches of the Long Island Railroad (2019) The Animate Lines tool creates animation of lines that grow to their full length over the duration of the animation. This is primarily useful as a visual effect. The direction of growth is determined by the order of the linestring points in the source file. Depending on how the lines were digitized, this direction may be opposite of what is desired. To control the direction of growth, line vertices in the desired order can be created in a CSV file and imported with the Geometry Import From CSV File. If attempting to animate a layer of MultiLineStrings, this tool will combine the points from all line segments into a single line of points. This will add spurious line segments to the animation if the points in the line segments were not ordered in a contiguous manner when digitized. Parameters Animate Lines Dialog Print Layout: The name of a print layout Animation Layer: The name of a linestring map layer that will be animated Timing: Different Line Speeds Animated Over Full Duration will grow all lines at different speeds so they all complete their full path simultaneously at the end of the animation One Line Speed Determined By Longest Line will grow all lines at the same linear speed, with the speed set by the longest line, which will complete at the end of the animation Frame Count: The number of separate frame files created Frame Image Output Directory: The directory where the frame PNG images will be saved Python mmqgis_animate_lines(print_layout, input_layer, fixed_speed, frame_count, \ frame_directory, status_callback = None) The example below animates branch lines of the Long Island Railroad in New York State. Line file: 2019-lirr-branches.geojson Project file: 2019-lirr-branches.qgs # Paths to the project test_directory = "/home/michael/software/mmqgis/tests/animate-lines" # Remove any existing frames and create the frame directory frame_directory = test_directory + "/frames" shutil.rmtree(frame_directory, ignore_errors=True) os.mkdir(frame_directory) # Load the project project_file = test_directory + "//2019-lirr-branches.qgs" project = QgsProject.instance() project.read(project_file) if project.error(): exit("Error: " + project.error()) # Find the parameters print_layout = QgsProject.instance().layoutManager().printLayouts()[0] layer = project.mapLayersByName("2019-lirr-branches")[0] fixed_speed = True frame_count = 20 # Run the tool and display any resulting error message = mmqgis_animate_lines(print_layout, layer, fixed_speed, frame_count, frame_directory) print("Animate lines: " + str(message)) Animate Location Birthplaces of the Roster Players on AL Division Champion Teams in 2019 The Animate Location tool creates animations of map features as they move in a straight line to specified locations on separate destination map layer. If you need more control over paths, you should use the Animate Sequence tool, or Anita Graser's TimeManager plugin. This tool can be slow and processing-intensive if animating a large number of features. Parameters Animate Location Dialog Print Layout: The name of a print layout Source Layer: The name of the layer containing the features at their starting locations Source Key Field: The field in the source layer identifying the destination for each feature Destination Layer: The name of the layer containing locations where the source features will move to Destination Key Field: The name of the field in the destination layer identifying the destinations Frame Count: The number of separate frame files created Frame Image Output Directory: The directory where the frame PNG images will be saved Python mmqgis_animate_location(print_layout, source_layer, source_key_field, \ destination_layer, destination_key_field, frame_count, \ frame_directory, status_callback = None) The example below animates the movement of the 134 players on the rosters of the three Major League Baseball teams that won the three divisions of the American League in 2019 from their birthplaces to the cities where their championship teams play. Data from BaseballAlmanac.com and Baseball-Reference.com. Geocoded with Nominatim. Ballpark data from Wikipedia. Player data: 2018-al-division-champion-players.geojson Ballpark data: 2019-mlb-ballparks.geojson Project file: 2018-al-division-champion-players.qgs test_directory = "/home/michael/software/mmqgis/tests/animate-location" # Load the project # This needs to be a full path, otherwise layers do not get read in project_file = test_directory + "/2018-al-division-champion-players.qgs" project = QgsProject.instance() project.read(project_file) if project.error(): exit("Error: " + project.error()) # Create the frame directory frame_directory = test_directory + "/frames" shutil.rmtree(frame_directory, ignore_errors=True) os.mkdir(frame_directory) # Parameters print_layout = QgsProject.instance().layoutManager().printLayouts()[0] source_layer = project.mapLayersByName("2018-al-division-champion-players")[0] source_key_field = "Team" destination_layer = project.mapLayersByName("2019-mlb-ballparks")[0] destination_key_field = "Team" frame_count = 10 # Run the function and print any error message message = mmqgis_animate_location(print_layout, source_layer, source_key_field, \ destination_layer, destination_key_field, frame_count, frame_directory) print("Animate Location: " + str(message)) Animate Sequence A Trip Across New York Harbor on the Staten Island Ferry on 30 December 2009 The Animate Sequence tool creates animations of map features in one or more layers by plotting successive rows in each layer. If multiple layers are being animated simultaneously, the timing of rows in each layer will be the same. There is no capability for interpolating, frame skipping or frame duplication between layers of dissimilar length. If there are fewer rows in one animated layer than in another animated layer, no features from the shorter layer will be displayed after all rows in the shorter layer have been displayed. Animate Sequence uses an edit buffer to sequentially display individual feature geometries. Therefore animated layers must be editable. If you wish to animate a non-editable layer (such as GPS waypoints from a GPX or CSV file), you should save the layer to an editable source, such as a shapefile, and animate the editable layer. If text display of timing is desired, a layer must be created with a column that has the desired display text, and that layer must be mapped with features labeled. If you need fine-grained control by specific times or a less cumbersome way of displaying current time, you may want to consider using Anita Graser's TimeManager plugin. Parameters Animate Sequence Form Print Layout: The name of a print layout Layers to Animate: The name(s) of the layer(s) that will be animated Cumulative: If selected, previously plotted features will remain on the map. If not selected, only one feature per layer is displayed Frame Image Output Directory: The directory where the frame PNG images will be saved Python mmqgis_animate_sequence(print_layout, layers, cumulative, frame_directory, status_callback = None) The example below animates sampled GPS waypoints tracking a trip on the Staten Island Ferry from St. George to South Ferry on 30 December 2009. Point data: 2009-12-30-si-ferry-sampled.geojson test_directory = "/home/michael/software/mmqgis/tests/animate-rows/si-ferry" # Load the project file project_file = test_directory + "/animate-sequence.qgs" project = QgsProject.instance() project.read(project_file) if project.error(): exit("Error: " + project.error()) # Create the frame directory frame_directory = test_directory + "/frames" shutil.rmtree(frame_directory, ignore_errors=True) os.mkdir(frame_directory) # Parameters print_layout = QgsProject.instance().layoutManager().printLayouts()[0] layers = project.mapLayersByName("2009-12-30-si-ferry-sampled") cumulative = False # Run the tool message = mmqgis_animate_sequence(print_layout, layers, cumulative, frame_directory) print("Animate Sequence: " + str(message)) Animate Zoom A zoom out from NYC The Animate Zoom tool creates animations by zooming and or panning. This tool is especially useful for simulating motion across a landscape or zooming out to give context to a location. Parameters Animate Zoom Form Print Layout: The name of a print layout containing map items to animate. If the map contains multiple map items (such as with key maps), all map items will be animated Start Latitude / Longitude: The starting center location for the animation End Latitude / Longitude: The ending center location for the animation Start / End Zoom Level: Zoom levels are similar to the zoom levels for web maps, except the zoom level indicates the height of degrees of the map in latitude based on the formula: 360 / 2zoom_level. Zoom level one is pole to pole, while zoom level 10 usually covers a medium-sized city, and zoom level 20 is building level. Frame Count: The number of separate frame files created Frame Image Output Directory: The directory where the animation frame PNG images will be saved Python mmqgis_animate_zoom(print_layout, start_lat, start_long, start_zoom, \ end_lat, end_long, end_zoom, duration_frames, \ frame_directory, status_callback = None) The example animates a zoom out on the USGS National Map ImageryOnly Base Map from NYC's Empire State Building to a whole-country view. Note that the USGS servers can be slow, so this script will take a few minutes to run even with a fairly small number of frames. # US National Map: USGS ImageryOnly Base Map - Primary Tile Cache # https://viewer.nationalmap.gov/services/ map_url = "crs=EPSG:3857&dpiMode=7&format=image/png&layers=0&styles&" + \ "url=https://basemap.nationalmap.gov/arcgis/services/USGSImageryOnly/MapServer/WMSServer" map_layer = QgsRasterLayer(map_url, "US National Map Imagery", 'wms') # Create the print layout with a single page for a 1280x720 image at 300 DPI print_layout = QgsPrintLayout(QgsProject.instance()) print_layout.initializeDefaults() page_size = QgsLayoutSize(108.4, 61, QgsUnitTypes.LayoutMillimeters); print_layout.pageCollection().page(0).setPageSize(page_size) # Create a map item covering the whole page map_item = QgsLayoutItemMap(print_layout) map_item.setFixedSize(page_size) map_item.attemptMove(QgsLayoutPoint(0, 0)) map_item.setCrs(map_layer.crs()) map_item.setExtent(QgsRectangle(-100000, -100000, 100000, 100000)) # arbitrary = tool changes this map_item.setBackgroundColor(QColor("#2a578e")) # Ocean blue map_item.setBackgroundEnabled(1) map_item.setLayers([ map_layer ]) # Add the item to the layout print_layout.addLayoutItem(map_item) # Parameters start_lat = 40.748481 start_long = -73.985707 start_zoom = 15 end_lat = 40.748481 end_long = -73.985707 end_zoom = 3 frame_count = 20 frame_directory = "/home/michael/software/mmqgis/tests/animate-zoom/frames" message = mmqgis_animate_zoom(print_layout, start_lat, start_long, \ start_zoom, end_lat, end_long, end_zoom, frame_count, \ frame_directory, status_callback) print("Animate Zoom: " + str(message)) Combine Tools Attribute Join from CSV File The Join Attributes tool combines attributes from a CSV file with an existing vector layer by performing a join using a "key" field that is present both in the CSV file and in the attribute table of the map layer to which the data is being joined. Because CSV files contain no reliable type data in the header, data is always imported from CSV files as text. Text columns can be converted to numeric (floating point) using the "Text to Float" tool. CSV files must be encoded in the UTF-8 character set. Although other 8-bit encodings (like Windoze ISO-8859-x) will work if only ASCII characters are present, non-ASCII characters may cause unpredictable behavior. Thi'''
