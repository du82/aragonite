["http://michaelminn.com/irreplaceable/producing_at_the_fringe.php"]
title = "Producing At The Fringe"
description = "How I produced my shows at the New York International Fringe Festival"
full_description = '''Home > Irreplaceable > Producing At The Fringe.php Producing At The Fringe September 11, 2004 Michael Minn Self-Production The NY International Fringe Festival Pre-Production Staffing Casting Technical Issues Publicity Rehearsals Was It Worth It? Cautionary Tales The following is a collection of suggestions and anectodes that may be helpful for producing shows in the NY International Fringe Festival. While much of the information is specific to musicals and the NY Int'l Fringe Festival, many of the topic covered here are common to low-budget Off-Off-Broadway production in general. Specifically, this material includes my experiences with my self-production of the new musical The Irreplaceable Commodity in 2003 and the rock opera Mossadegh in 2004. Some notes are also included from my work stage managing Last Call at the 2002 festival. Self-Production It is a common refrain in theatrical circles that if no one will hire you, you need to get out there and create your own work. If you're not willing to put your own money into your own work, how can you ask anyone else to. Despite the occasional flashes of warm-fuzzy feeling, the theatrical community is actually a rather Darwinian place where everyone is almost exclusively concerned with their own survival and ability to reproduce. Even the most minimal theatrical production requires an extensive amount of capital and human energy to bring to fruition. The result is a small group of viable theatre companies run by monarchs for their own amusement that are fortresses impenetrable by those the king does not wish admitted. They offer few opportunities for the huge body of writers to get their work produced. And in a field where quality is a completely subjective judgement and cronyism is a fundamental part of the business model, the selection process is dominated by many factors other than merit. Given those impediments, self-production is a very attractive option for those willing to invest the time and money. Depending on the nature of your material, it is often your only real option. You can spend your time sitting in your room writing and opening rejection letters, or you can get your stuff out there in the world. The NY Int'l Fringe festival is an option for self-production that provides some of the advantages of association with an established theatrical entity while preserving the freedom associated with self-production. With around 1,000 applications for 200 slots, there is some selectivity involved. But if your material is good and appropriate to for "downtown" theatre, your odds are infinitely better than with a submission to MTC or The Public Theatre. Material There are numerous considerations when trying to decide what to try to self-produce. While the artistic vision of the writer is the driving force in theatre, the potential audience and the available budget are more tangible constraints that dictate the choice of material. Simple productions that value strong material and bravura performances over complex physical elements are easier to mount and stand a better chance of succeeding when self-produced. Musicals: Musicals have a larger potential audience than straight plays. There is a cult of new musical buffs in NYC. But musicals are considerably more difficult and expensive to produce than straight plays. Musicals require musicians and additional staff that, unlike actors, will not work for free. Musicals usually have more complicated sets and a large number of props. Musicals also lean toward larger casts, longer rehearsal periods and longer running times. Typical Fringe Material: Fringe festivals tend to lean towards work of an offbeat or experimental nature. This is a virtue for self-productions since clever leaps of abstraction and metaphor can also reduce cost. The NY Int'l Fringe Festival leans toward shorter, comedic works that are easily consumed in bulk during the dog days of August. While the highest profile productions from the festival have usually been musicals, the majority of the productions are actually straight comedies - some of them funny. Audiences: Off-Off-B'way audiences are slightly more diverse than the largely older audiences attracted to Off-B'way productions or the tourists attracted to B'way productions. Friends and family of the performers often constitute a significant percentage of the audience, resulting in the perjorative name "Friends Festival." The Irreplaceable Commodity, a 90-minute musical about investment banking was my entry in the 2003 NY Int'l Fringe Festival. As the limitations of my future as a musical theatre performer became apparent in the late 90's, I began writing musical theatre pieces in continuation of my hobby of songwriting and home recording. I felt pretty good about my initial efforts, but all my submissions to existing companies resulted in rejection letters. While exploring material for further work, I read a book on the dark underbelly of investment banking. While I was only familiar with investment banking from my view from a temp job in a word processing center, a human story of young 20-somethings selling their youth for 100-hour days, 6-figure salaries and one-night stands seemed strangely universal. I began work on the piece in the fall of 2000, although my work as a stage manager delayed completion of the project. I had a private reading in the January of 2003 immediately prior to my Fringe submission for the 2003 festival. Most of the content of this document relates my experiences with this production. Mossadegh was my entry in the 2004 NY Int'l Fringe Festival. Following the catharsis of the 2003 festival, I looked back and began thinking about what I could have done differently to make the production a less complicated and stressful experience. For a few years, I had harbored the paradoxical idea of doing a rock opera on a historic subject. In 2000, I had read a NY Times article on the 1953 coup the C.I.A sponsored in Iran. Those ideas came together in the fall of 2003 with the plan of using a 4-piece rock band to perform the work as a concert with a plot. Mossadegh was the resulting project. Script Development: The development process for musicals is a bit problematic in contemporary American theatre. Given the limited production opportunities for new musicals and the large number of eager writers, a development sub-culture has grown in the New York theatre world. Unfortunately, the process often becomes a recursive stream of readings and workshops, full of sound and fury but leading to nothing. On the other hand, musicals, as complex forms created with myriad simple elements, are often aided by the collaboration and evolution afforded by a development process. Neither of my shows went through any significant development process and they were lesser works because of that. The point being that you may want to put your musical through at least a reading or workshop of some kind prior to attempting to produce it at the Fringe or any venue that involves paying customers and critics. Funding The fundamental obstacle in all theatrical production is cash. Because of the extensive expenses and limited revenues associated with all theatrical production, the finances of theatre are largely impossible. This may explain why everyone in theatre seems to be crazy and/or immoral. Most Off-Off-B'way productions seem to be produced with money provided by the producer(s), the producer's spouse, the producer's parents and/or the producer's friends. More established companies can get 501(c)3 status and apply for government and private grants, but the process for getting that money is reminiscent of prostitution - and slightly less remunerative. Although I have been asked, I have no suggestions of how to raise money since I self-funded both of my productions. There is something to be said for getting a "real job" and using that money for self-funding. One advantage of using personal funds is that you get to be king of a very small world...not an undesirable position in a business where you rarely get to call the shots. My productions were funded entirely with personal savings, most of which was leftover from money my father had invested in my name before a catastrophic stroke in 1994 left him profoundly disabled. The bull market of the late 90's was good to my accounts and in late 1999, as some were anticipating a market meltdown due to Y2K, I sold some shares in a mid-cap mutual fund and put the cash in a money market account. With the market crash of 2000, this was money snatched from the jaws of death. And with the acceptance of my script for the 2003 Fringe Festival, this money became theatrical magic. The NY International Fringe Festival In 1947, the Edinburgh Festival of Music and Dance rejected eight young theatre companies due to "lack of space." Those rejected companies decided to band together and mount their productions around the "Fringe" of the Edinburgh Festival. While the Edinburgh Festival of Music and Dance has long since faded into history, the Edinburgh Fringe Festival continues to thrive and the term "Fringe" has become associated with innovative, new and challenging theatrical productions. (reference). The NY International Fringe Festival was started in 1997 by the Present Company (a small Off-Off-B'way company) and patterned after the Edinburgh Fringe Festival. For two weeks in August, theatre companies from around the world (but mostly from NYC) descend on lower Manhattan to produce a wide variety of plays, musicals and performance art pieces. The festival has grown steadily since it's humble inception and with the hit Broadway transfer of Urinetown (which originated at the 1999 festival), the profile of the festival exploded. Despite the hype and overly ambitious production designs, the festival still remains basically an Off-Off-Broadway theatre festival. It is an opportunity to produce your show in a high profile situation for as little or as much cash as you want to spend. It can be alot of fun if you are willing to roll with the punches and embrace the gift of the unexpected. It can be a nightmare if you require a climate-controlled, professional theatrical environment and ignore the severe practical obstacles that dictate what can reasonably be done. Please keep this in mind as you consider producing at the festival. Ultimately, it is not realistic to do theatre seeking fame and/or fortune. Extrinsic motivation sets you up for disappointment and frustration. You have to do it because you love doing theatre. Fringe Submission Application Materials are available on the Fringe Festival website, FringeNYC.org, usually late in the year for the following year's festival. There were two submission deadlines in 2003, the first in mid January with a reduced submission fee ($30?) and a final mid-February deadline ($40?). Submission materials included a cover letter, two copies of the application form, a copy of the script, a CD with score demos (where applicable), bios of key participants (author, director, etc.) and a money order for the application fee. Cover Letter: Supposedly, the cover letter is critical in articulating your vision for the piece, the practicality of your production plans and your appropriateness for the festival. The following is the text of my submission letter for The Irreplaceable Commodity: I would like to submit my one-act musical comedy, The Irreplaceable Commodity for consideration in the 2003 NY International Fringe Festival. I have included two copies of the application form, one copy of a draft script, one CD containing demo recordings of four songs from the show, a money order to cover the application fee, and copies of my personal resumes. I have long harbored an passionate interest in creating theatrical works that embrace the stories and idioms of modern culture while building on the great traditions of the American musical theatre. The Irreplaceable Commodity is a 90-minute one-act musical comedy with a cast of eight that follows three young MBAs during their brief whirlwind careers as investment banking associates. Their journey takes them through the strange, cutthroat world of corporate finance to a discovery of what is truly valuable in their lives. Plus, it's got a danceable beat and tunes that stick in your head like a rusty ax. I feel the NY International Fringe Festival would be the perfect venue to debut as a writer with The Irreplaceable Commodity. As the stage manager for last year's Last Call, I experienced first-hand the excitement and energy that surrounds the festival. The technical limitations of the festival situation fit nicely into my theatrical vision that values inspired material and performances over complex sets and costumes. The high profile of the festival would open a wider pool of performers to draw from and a more diverse audience that might find this piece appealing. And the experience of sharing a space with a broad variety of presentations by people from many artistic perspectives provides a wonderful opportunity for interaction and discussion. If accepted I would produce this under an Equity Showcase Code primarily with my own funds. I am currently searching for a prospective director/choreographer. The performers would be cast largely from mail submissions. The physical production would be very minimalist with the most difficult element being a rented sound system and body microphones. I thank you in advance for your careful consideration and I look forward to hearing from you. Submission Script: I'm not certain how critical the state of the script is in submission. In 2002, I was briefly involved with the musical, The Boob Movie. It's initial incarnation was as a stage work, then it became a film script, then became a stage musical again. When I left the production two weeks before the start of rehearsals (by mutual agreement in a dispute over nudity), the production script was still a film script with dummy lyrics. The authors had participated in the previous year's festival, which probably gave them a leg up. I prefer to have my scripts in pretty good shape before submitting, but I pass this along for those of you who work best in the crisis mode. Submission CD: Demo CD's are required for musical submissions. I have heard recommendations that score submission CDs should not be too heavily produced, as this can cover faulty material with technical polish. However, the CD I submitted for Irreplaceable was recorded in my home studio using full synth tracks and featured my voice multitracked to reflect what the score would sound like with a full ensemble of actors. The show was a pop musical that incorporated numerous pop idioms and electronic textures that could not be even remotely simulated with an acoustic piano. Since I was planning on performing the show with pre-recorded tracks, this actually was a realistic representation of what a live performance would sound like. I was accepted, so take this information for'''
year_published = 2025
