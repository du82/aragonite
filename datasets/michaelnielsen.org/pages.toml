full_description = "Reinventing Explanation My new essay on the use of digital media to explain scientific ideas is here. Published January 31, 2014By Michael NielsenCategorized as Uncategorized Frank Hecker says: February 1, 2014 at 4:59 pm This is a really interesting vision; I’m looking forward to seeing where you might take this. I particularly like your take on narratives and emotional engagement as integral to improving scientific and mathematical understanding. A couple of quick thoughts: First, you discuss explanation and understanding in the context of two-person games, where you are (at least to some degree) competing against another player to achieve understanding (e.g., betting against them re Jeter/Justice batter averages). I think it would also be interesting and potentially even more fruitful to consider multiplayer games where one could cooperate with others to achieve understanding, and where one’s progress in the game would depend on that understanding being widely if not universally shared among one’s teammates. This is basically extending to a game context the idea that we often find it easier to learn things when we try to teach them to others. Second, apart from the problem of finding any funding at all for developers, graphic designers, etc., to work on “games of understanding” and related digital media, there’s the question of how best to ensure that that funding ends up going to those developers and designers who do the best job of creating such works. With traditional entertainment-focused games we have market feedback: The developers of GTA have hundreds of millions of dollars to create new versions of the game because people vote with their pocketbooks on which games they find most entertaining. With traditional science you have feedback from agencies and others handing out grants, based on past performance in terms of cited papers, etc. Both are imperfect mechanisms in many ways, but overall they work well enough: people who create boring games tend to go out of business, and people who don’t publish interesting papers tend not to get grants. What are the potential feedback mechanisms in this case? I could see a philanthropic organization providing some seed funding to create game prototypes and related digital media, but how would they (or we) best determine who is developing stuff that best promotes understanding,? And how could those determinations best drive future funding beyond the seed stage?"
