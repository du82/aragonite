full_description = "How the backpropagation algorithm works Chapter 2 of my free online book about “Neural Networks and Deep Learning” is now available. The chapter is an in-depth explanation of the backpropagation algorithm. Backpropagation is the workhorse of learning in neural networks, and a key component in modern deep learning systems.﻿ Enjoy! Published April 14, 2014Categorized as Uncategorized Reinventing Explanation My new essay on the use of digital media to explain scientific ideas is here. Published January 31, 2014Categorized as Uncategorized How the Bitcoin protocol actually works Many thousands of articles have been written purporting to explain Bitcoin, the online, peer-to-peer currency. Most of those articles give a hand-wavy account of the underlying cryptographic protocol, omitting many details. Even those articles which delve deeper often gloss over crucial points. My aim in this post is to explain the major ideas behind the… Continue reading How the Bitcoin protocol actually works Published December 6, 2013Categorized as Uncategorized Neural Networks and Deep Learning: first chapter now live I am delighted to announce that the first chapter of my book “Neural Networks and Deep Learning” is now freely available online here. The chapter explains the basic ideas behind neural networks, including how they learn. I show how powerful these ideas are by writing a short program which uses neural networks to solve a… Continue reading Neural Networks and Deep Learning: first chapter now live Published November 25, 2013Categorized as Uncategorized Why Bloom filters work the way they do Imagine you’re a programmer who is developing a new web browser. There are many malicious sites on the web, and you want your browser to warn users when they attempt to access dangerous sites. For example, suppose the user attempts to access http://domain/etc. You’d like a way of checking whether domain is known to be… Continue reading Why Bloom filters work the way they do Published September 26, 2012Categorized as Uncategorized"
