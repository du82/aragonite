title = "Neural Networks and Deep Learning: first chapter goes live – Michael Nielsen"
full_description = "Neural Networks and Deep Learning: first chapter goes live I am delighted to announce that the first chapter of my book “Neural Networks and Deep Learning” is now freely available online here. The chapter explains the basic ideas behind neural networks, including how they learn. I show how powerful these ideas are by writing a short program which uses neural networks to solve a hard problem — recognizing handwritten digits. The chapter also takes a brief look at how deep learning works. The book’s landing page gives a broader view on the book. And I’ve written a more in-depth discussion of the philosophy behind the book. Finally, if you’ve read this far I hope you’ll consider supporting my Indiegogo campaign for the book, which will give you access to perks like early drafts of later chapters. Published November 25, 2013By adminCategorized as Uncategorized Al says: November 26, 2013 at 4:16 pm As best as I understand deep learning has now been overtaken by sum-product networks. Will your book cover them too? admin says: November 27, 2013 at 2:59 pm That’s a very strong statement — what makes you think that? Sum-product networks are an example of a deep architecture, but at the moment I don’t plan to focus much on them. The philosophy of the book is to explain a few core ideas well. It’s inevitable that over time the details of techniques in vogue will change. But people who really master core ideas such as backpropagation will be well-placed to keep up with such changes. So, for instance, although sum-product networks are quite different to traditional neural nets, they can be trained using backprop. Carl Gombrich says: November 27, 2013 at 5:50 pm Michael, your new book looks fascinating. Hope I can find time to read it. I much enjoyed Reinventing Discovery. Regarding your focus on core concepts for the deep learning book, are you familiar with the idea of threshold concepts http://en.wikipedia.org/wiki/Threshold_knowledge ? I think these will gain ground as those of us in education are obliged to reconsider what exactly is core knowledge in a fluid, interdisciplinary landscape. All best,"
year_published = 2013
