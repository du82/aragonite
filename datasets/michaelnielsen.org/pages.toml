full_description = "Biweekly links for 06/29/2009 Grant System Leads Cancer Researchers to Play It Safe – Series – NYTimes.com Kolata on Funding Research Â« GÃ¶delâ€™s Lost Letter and P=NP Game of Life News A blog containing news about the cellular automata Life. Random bits Jon Katz’s crypto blog. BBC NEWS | Technology | Web slows after Jackson’s death One of their subheaders reads, in total: “Fail” I, Pencil – Wikisource “I, Pencil, simple though I appear to be, merit your wonder and awe, a claim I shall attempt to prove. […] I have a profound lesson to teach. And I can teach this lesson better than can an automobile or an airplane or a mechanical dishwasher becauseâ€”well, because I am seemingly so simple. Simple? Yet, not a single person on the face of this earth knows how to make me. This sounds fantastic, doesn’t it? Especially when it is realized that there are about one and one-half billion of my kind produced in the U. S. A. each year. Pick me up and look me over. What do you see? Not much meets the eyeâ€”thereâ€™s some wood, lacquer, the printed labeling, graphite lead, a bit of metal, and an eraser. Just as you cannot trace your family tree back very far, so is it impossible for me to name and explain all my antecedents. But I would like to suggest enough of them to impress upon you the richness and complexity of my background.” Time Wastes Too Fast – And the Pursuit of Happiness Blog Click here for all of my del.icio.us bookmarks. Published June 29, 2009By Michael Nielsen"
