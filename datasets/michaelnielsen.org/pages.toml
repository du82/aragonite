["http://michaelnielsen.org/reinventing_explanation/index.html"]
title = "Reinventing Explanation"
full_description = "The Babylonian Map of the World is one of the world's oldest extant maps, dating to 600 BCE. It's a crude map, difficult to read at a glance, but fortunately an accompanying cuneiform text describes the features on the map, including Babylon, seven other cities, a canal, and a mountain: Modern maps are, of course, far better than this early map. They improve on it by taking advantage of the many map-making techniques developed since 600 BCE, such as: surveying to get proportions correct; projections to correct for the curvature of the Earth; methods to depict topographic features; and so on. Even ideas such as showing roads and nautical routes were not a priori obvious, but had to be invented. This agglomeration of ideas has turned maps into a powerful medium for thought. Consider the famous map of the London Underground, excerpted here: Using this map, an ordinary person can walk into the Underground for the first time, and within minutes know how to find their way from place to place. Without the map, with only purely verbal representations to learn from, even a geographic genius would require days of work to acquire a similar facility. What's more, we internalize the map: the representations used in the map become the representations we use to think about the Underground. This is the sense in which this map is a medium for thought. We usually take such media for granted, and rarely pause to think about the origin of the ideas behind media such as the Underground map. But those ideas are not obvious, they had to be invented, usually through a conscious process of design. To better understand that design process, consider the following prototype by Bret Victor, one of the world's great designers of media for thought. It's a medium for understanding a special class of mathematical equations known as difference equations, in much the same way as maps help us understand geography. The video moves fast, but don't worry if you don't follow it all -- it's the broad approach that I want you to focus on. You may find the video easier to watch if it's fullscreened, which you can achieve by clicking the four-arrow icon in the bottom right of the video player: It's tempting to evaluate this prototype as a potential user. But it's a prototype, not a complete product, and if you evaluate it as a potential user, you're likely to concentrate mostly on its shortcomings, and miss its virtues. I want you to flip your thinking around. I want you to think about this as though you are a designer, and in particular, someone who designs media for thought. From this point of view, you see immediately that Victor's prototype enables many powerful operations, such as: tying parameters together; the instantaneous feedback between symbolic and graphical views of difference equations; and the language for searching over functions. He's created a vocabulary of operations which can be used to understand and manipulate and, most crucially of all, play with difference equations. And with enough exposure to this medium, we'd begin internalizing these operations: we'd begin to think about difference equations in this way."
