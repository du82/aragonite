full_description = "How the backpropagation algorithm works Chapter 2 of my free online book about “Neural Networks and Deep Learning” is now available. The chapter is an in-depth explanation of the backpropagation algorithm. Backpropagation is the workhorse of learning in neural networks, and a key component in modern deep learning systems.ï»¿ Enjoy! Published April 14, 2014By Michael NielsenCategorized as Uncategorized Timothy says: April 15, 2014 at 1:24 pm This is a damn good treatment of backprop, Appreciate the amount of work you are putting into this. Also this is unbelievably clear writing and keep those diagrams and plots coming.. Michael Nielsen says: April 15, 2014 at 1:28 pm Thanks! Yes, I’ll keep the diagrams and plots coming. There will also be some animations in the next chapter (very nice for showing how networks change over time). Jan Hellden says: April 16, 2014 at 5:42 am Hi, I liked chapter 1 very much. Like Thimothy i find that you are extremely good at explaining how NN works. Can’t wait to begin reading chapter 2!!! TianJun says: April 22, 2014 at 9:14 pm Hi, Michael I am a Chinese graduate student and this book is really good. Can not wait for the following chapters~;) I would like to translate this book into Chinese and share your great ideas with my friends. Any ideas? Michael Nielsen says: April 23, 2014 at 11:33 am Glad you’re enjoying it! As regards a translation, please look at the licensing information in the footer of the book’s webpages. Briefly, the license allows translation provided you’re not making money from it, i.e., it’s not a commercial translation. If you have a commercial use in mind, please email me and we can talk about it. TianJun says: April 23, 2014 at 9:43 pm Currently I don’t have any commercial use in mind. After finished, I will send you the translated version and provide proper attribution."
