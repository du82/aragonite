title = "Reinventing Explanation – Michael Nielsen"
full_description = "Reinventing Explanation My new essay on the use of digital media to explain scientific ideas is here. Published January 31, 2014By Michael NielsenCategorized as Uncategorized Joshua Vogelstein says: February 1, 2014 at 9:38 pm i think this is an amazing essay. i have a few relatively unrelated thoughts: 1) i wonder to what extent simpson’s paradox depends on a nonlinearity. nonlinearities can often except surprising effects, for example, as demonstrated by perceptrons: a small change of parameter values flips the output in surprising ways. essentially, in simpson’s paradox, there are 2 variables: geographical position and political disposition. if those two functions changed smoothly, rather than abruptly and discretely, can this paradox occur? i’m not quite sure, although i’m fairly sure it would be relatively easy to figure out even analytically for certain simple smooth functions (eg, linear functions). if indeed a nonlinearity is necessary for this paradox to arise, that seems to me to be a very important conceptual point, that could lead to a useful heuristic for people when trying to decide whether any given result is the kind of result that *could* result in simpson’s paradox. for me, for now, the only intuition i have is: is there a latent variable that may have greater explanatory power than the reported variable? if yes, then we are in danger of following into the class of problems for which paradox may arise. but, if we could improve the ‘bounds’ on understand the extent to which such a paradox might arise, i think we would understand the problem much more deeply, and thereby, possibly be better equipped to explain it. perhaps somebody has already investigated this and published something about it, i’ve not read much on the subject. 2) taking seriously idea of making education using current state of the art design and presentation ideas, consider the following. a popular MOOC might get up to 200,000 students registered. coursera now offers certification, that’s $50 per class. students who go for the certification are *much* more likely to complete the course, perhaps because they’ve now invested in the material. let’s just assume for argument’s sake that 50% of the class get’s certified (i’m sure a huge overestimate), so 100,000 people are certified, and let’s assume that the class runs for 10 years, thus a total of 1M people get certified, and $50M are made. now, consider the time investment given to generate the class. i’ve had friends teach such classes, they spend a few hours per lecture. let’s assume that the course has a total of 50 lectures, so 100 hours total time creating the class. let’s say a professor charges $1000 / hr, so the course costed about $100,000, returned $50M, that ‘s a ROI of 500×1. contrast this to grand theft auto, which had an ROI of 3×1. the point of this all is simply to say, i love the idea of getting the best in business together to design a class. i also think there is a huge untapped financial market. i imagine lots of people are thinking about this. has anybody actually really invested money in teaching a new class to offer on coursera? enough money to have some graphic design, a musical score, an actor presenting the material, etc. (note: the person who writes the lecture obviously need not be the person who gives the lecture). if each of the above thoughts is worth 1 cent, then you now have my 2 cents 🙂"
