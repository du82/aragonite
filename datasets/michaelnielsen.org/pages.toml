title = "Illuminating Science – Michael Nielsen"
full_description = "Illuminating Science Physics at UQ has started a blog – Illuminating Science. It’s being run by Joel Gilmore, and Joel already has a bundle of interesting posts up, including a post on Cassini’s discovery of new moons for Saturn, a post on the current status of the famous “Gravity Probe B”, intended to test Einstein’s general theory of relativity, and a post on who owns what in space. Check it out. Published August 20, 2004By Michael NielsenCategorized as General Pyracantha says: August 20, 2004 at 11:56 am This weblog looks promising but has already contained something which is (for me) a prime marker of carelessness: a “Dread Apostrophe.” “Saturn is less dense than water? >>It’s<< density is only 0.7g/cm3, or 700kg/m3 for those… The possessive of “it” is ITS – no apostrophe! When I find one of these in any text it automatically says to me that someone is not paying attention. Just because they are scientists, not journalists writing does not excuse them. Cf. Lynne Truss’ best-selling book on punctuation, EATS, SHOOTS, AND LEAVES. Pyracantha from “Electron Blue” Joel says: August 20, 2004 at 11:43 pm D’oh! I’m the author of the blog 🙂 I’m normally quite pedantic about these things – particularly there, they’re, their, your, you’re and, of course, it’s, its. But sometimes, in a hurry, these things do happen 🙂 Cheers for pointing that out, and I’ll edit it now! Joel"
