["https://michaelnielsen.org/blog/how-you-can-help-the-federal-research-public-access-act-frpaa-become-law"]
title = "How you can help the Federal Research Public Access Act (FRPAA) become law – Michael Nielsen"
full_description = "How you can help the Federal Research Public Access Act (FRPAA) become law As many of you no doubt know, the FederalÂ Research Public Access Act; (FRPAA, pronounced fur-pa) was introducedÂ into the US Congress a few days past. Â It’s a terrific bill, which, if itÂ passes, will have the effect of making all US Government-funded scientificÂ research accessible to the public within 6 months of publication. Open access legislation like FRPAA doesn’t just happen in a vacuum. Â TheÂ Alliance for Taxpayer AccessÂ (ATA) is a Washington D.C.-based advocacy group that works to promote openÂ access policies within the US Government. Â The ATA worked with CongressÂ (and many other organizations) to help pass the NIH public access policy in 2008,Â and have been working for the past several years with members of CongressÂ on FRPAA. In this post, I interview Heather Joseph, the Executive Director of the Scholarly Publishing and Academic Resources Coalition (SPARC), which convenes the ATA, andÂ ask her about the bill, about next steps, and about how people can help. Q: Heather, thanks for agreeing to be interviewed! What is FRPAA, and what’s it trying to accomplish? Thank you, Michael – I’m happy to talk about this bill! In a nutshell, FRPAA is designed to make sure that the results of scientific research paid for by the public can be accessed by the public.Â Most people are surprised to learn that this isn’t automatically the case;Â they assume that if their tax dollars pay for a research study, theyÂ should be entitled to read the results. Â But the reality is quiteÂ different. Â Right now, if you want to access articles that report onÂ publicly funded science, you have pay to do so, either through a subscription to a scientific journal (which can cost thousands of dollarsÂ a year), or though pay-per-view, which can easily cost upwards of $30 perÂ article. This presents an often-unsurmountable obstacle for exactly thoseÂ people who most want (or need) access – scientists, students, teachers,Â physicians, entrepreneurs – who too often find themselves unable to affordÂ such fees, and end up locked out of the game. Out of eleven federal agencies that fund science here in the UnitedÂ States, only one – the National Institutes of Health – actually has aÂ policy that ensures that the public can freely access the results of theirÂ funded research online. FRPAA is designed to tackle this issue head on,Â and to make sure that the science stemming from all U.S. agencies is madeÂ freely available to anyone who wants to use. it. FRPAA is a very straightforward bill – it simply says that if you receiveÂ money from a U.S. Agency to do scientific research, you agree (upfront) toÂ make any articles reporting on the results available to the public in aÂ freely accessible online database, no later than six months afterÂ publication in a peer-reviewed journal. Q: What is the Alliance for Taxpayer Access (ATA)?Â What role did the ATA play in advocating for FRPAA? The ATA is a coalition of groups who are working together to try and craftÂ a positive solution to this problem. Â In 2004, the library community (led by my home organization, SPARC) decided that there must be other groupsÂ who shared our frustration over the current access situation. We reachedÂ out to research organizations, patient advocacy groups, consumer organizations, publishers, student groups – anyone we could think of whoÂ shared the goal of unlocking access to taxpayer funded research. Â WeÂ quickly attracted more than 80 organizations, representing millions ofÂ individuals. This created a whole new opportunity to advocate for nationalÂ access policies from a much stronger position… there really isÂ strength in numbers! The ATA has evolved into the leading advocacy organization for taxpayerÂ access to the results of taxpayer funded research. We knock on Congressional doors, talking with policymakers about Â the current barriers Â to access, and about new opportunities for scientific progress once those barriers are brought down.Â We are all about leveragingÂ the public’s investment in science by making sure that anyone who isÂ interested can easily access and build on this research. That’s howÂ science advances, after all. Q: In 2008, the Congress passed the NIH public accessÂ policy. Â Can you tell us about that, and the ATA’s role? Absolutely! Â As I mentioned, the NIH is currently the only U.S. agencyÂ that has a policy guaranteeing the public access to the results of itsÂ funded research. The idea for the policy surfaced in 2003, when CongressÂ expressed concern that results of the public’s nearly $30 billion annualÂ investment in NIH research were not being made as widely accessible asÂ they should be. Â They asked the NIH Director to create a policy to addressÂ the problem, setting in motion what would become 4 long years of intenseÂ debate in the scientific community.Â Not surprisingly, some journal publishers expressed immediate concern thatÂ any policy that provided access to research results through any otherÂ channels other than subscription-based journals would irreparably damageÂ their businesses. Because journal publishing is big business (nearly $9Â billion in annual revenues) publishers were able to use theirÂ long-established trade associations to aggressively lobby the NIH andÂ Congress against the establishment of such a policy. The scientists, librarians, patients, and others who favored the policyÂ found themselves at a disadvantage, advocating as individual organizationsÂ without a coordinated voice. This was the main reason the ATA wasÂ established, and we quickly found ourselves at the center of the debate,Â helping to ensure that all stakeholders who favored the establishment of aÂ public access policy had a way to present a united message toÂ policymakers. Ultimately, Congress passed a landmark policy fullyÂ supported by the ATA that was enacted in 2008.Â Q: Who works at the ATA? The ATA is essentially a virtual coalition. While we’ve grown to representÂ over 100 organizations, the organization’s advocacy is carried out by aÂ pretty small core group of staff (all of whom have other full time jobs!) Â Besides myself, the wonderful Nick Shockey and AndreaÂ Higginbotham are responsible for the coalition’s online presence – keepingÂ our website up to date,Â maintaining our Congressional Action Center, and keeping our members looped in on various emailÂ lists. Â We also rely on our incredibly active members to help usÂ continually refine our messages, and look for opportunities to spread theÂ word about our work. Â People like Sharon Terry at the Genetic Alliance, Prue Adler at the Association of Research Libraries, and PatÂ Furlong at ParentÂ Project Muscular Dystrophy are prime examples of some of the peopleÂ who keep the ATA active on the front lines. Also: there is no cost to join the ATA (SPARC picks up the relatively lowÂ tab to keep it humming!); and the door is open for any organization to sign on as a member through our website. If you’re interested, please let usÂ know! Q: What happens next, with FRPAA? Â How does itÂ (hopefully) become law? What could derail it? The next steps for FRPAA will be for us (and our advocates) to encourageÂ other members of Congress to sign onto the bill as co-sponsors. GeneratingÂ a nice, robust list of supporting members of Congress is key in helping toÂ keep the profile of the bill high. Â Procedurally, the bill will beÂ referred to Committee for further consideration; in the Senate, it will goÂ to the Homeland Security and Government Affairs Committee, and in theÂ House, the Committee on Oversight and Government Reform will receive theÂ bill. Â As with any legislation, FRPAA faces an uphill battle in anÂ election year, but given the growing attention this issue has received inÂ the past year (from the White House Office of Science and TechnologyÂ Policy, to the America COMPETES Act, to the recent Research Works Act),Â we’re hopeful that the bill can continue to advance. I think the biggest threat is inaction, so vocal support from stakeholdersÂ will be crucial! Q: What can people do to help FRPAA become law? The most important thing that people – especially active scientists – canÂ do help advance this bill is to speak out in support of this bill. Â And weÂ need folks to speak out in two ways: First, speak out to your members of Congress. The ATA has an ActionÂ Center set up so that you can simply log on, pick your Senators andÂ Representatives, and automatically generate a letter asking them toÂ support FRPAA. Â The Action Center has all kinds of information about theÂ bill, including Talking Points, FAQ’a and even template letters, to helpÂ make the process as easy as possible. CheckÂ it out! Second, speak out to your colleagues and your community. Â Blog about theÂ bill, or spread the word on Twitter. Â Consider writing an OpEd for yourÂ local newspaper, or writing an article for your organization’s newsletter.Â The more people become aware of this issue, the more they support it.Â Help us spread the word! Q: Finally, how can people follow what the ATA is doing, andÂ keep up with your calls for action? You can sign onto the Alliance for Taxpayer Access by going to ourÂ website. There’s no charge. If you simply want to be added to our email list for alerts and updates,Â contact either or myself (heather@arl.org) Â or Andrea HigginbothamÂ (andrea@arl.org), or follow us on Twitter at @SPARC_NA. Published February 14, 2012By adminCategorized as Uncategorized"
