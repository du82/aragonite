full_description = "Privacy and Cookies Policy Michael Oglesby website (‘www.michaeloglesby.com’) is a UK-based site and is in accordance with the requirements of the UK Data Protection Act 1998 relating to the personal information you supply on the site. The site uses a security system that protects your information from unauthorised use. No personal details are stored on this website. I will not sell, distribute or disclose information about you as an individual or your personal usage of the site without your consent or unless required or permitted to do so by law. We provide links to other sites, which may not be governed by this Privacy Policy. I would like you to keep the information about you up-to-date. You may change any of the basic information we keep about you by sending us an e-mail to privacy@michaeloglesby.com. In addition to the information which you supply to me, information and data may be automatically collected through the use of cookies. Cookies are small text files the site can use to recognise repeat users and allow us to observe behaviour and compile aggregate data in order to improve the site for you. I may monitor customer traffic patterns, site usage and related site information in order to optimise your use of the site and I may give aggregated statistics to a reputable third-party, but these statistics will include no information personally identifying you. I continually strive to improve our standards of customer care at michaeloglesby.com, so your feedback is most welcome. I control and operate this website from my home within England. Accordingly the laws of England and Wales govern claims relating to, including the use of, this website any material contained therein. If you choose to access my website from outside England and Wales you do so on your own initiative and you solely agree that in the event of a dispute between myself and you, the laws of England and Wales will apply at all times."
