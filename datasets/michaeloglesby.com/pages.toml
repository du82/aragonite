full_description = "Suffolk Police and Crime Commissioner When the UK Conservative Party got voted into power in 2010, part of their manifesto was to abolish the Police Authorities and replace them with the Police and Crime Commissioners (PCC).Due to my project work in delivering the Norfolk and Suffolk Constabularies’ websites, the Suffolk Police Authority commissioned me to web design, construct and deliver a new website for the Suffolk Police and Crime Commissioner.The brief was to deliver a website showcasing what the PCC is and does, as well as having an events manager/calendar component. I mocked up four web designs for the client to choose from ranging from a simple information site to a busy news-inspired design. The client went with something in between.The website is built on the WordPress CMS with a Themify.me Framework theme. For the events manager component, I installed Events Calendar Pro plugin.I also set up all the social media channels: Facebook, Twitter, and Google+, which would be live post-launch.The client was extremely happy with the delivered project, especially liking WordPress for its ease of use and the clear simple design of the site. Gallery Suffolk Police Authority news article Suffolk Police Authority custody vistors Suffolk Police Authority homepage Suffolk Police Authority mission statement Design mock up #1 - minimalistic design approach, with little real estate clutter giving the impression of clean professional design. Design mock up #1 - minimalistic design approach, with little real estate clutter giving the impression of clean professional design. Design mock up #1 - minimalistic design approach, with little real estate clutter giving the impression of clean professional design. Design mock up #4 - complete contrast to idea #1 being much bolder (more use of capitals), stronger use of solid colour with deeper blues."
