full_description = "Office of Government Commerce In 2005 I became the web manager for the Office of Government Commerce (OGC) Internet, Extranet, and Intranet websites. My main responsibilities were the day-to-day management and maintenance of the sites which included content submission to the Content Management Systems (CMS) and monitoring website/service availability. Whilst in the role, the Internet website underwent a ‘modernisation’ upgrade where I was a senior technical consultant on the project board. I was tasked with providing technical advice and guidance on the new website, as well as addressing accessibility issues. My other main duties included:Ensuring that the websites were compliant with the UK Government web guidelines, W3C Web Content Accessibility Guidelines (WCAG), and Disability Discrimination Act 1995.Provide technical advice, support, and solutions to fellow members of staff to enable web delivery of their content so that their content met Government regulations.Provide teacher training of the CMSs for content authors of the websites.Provide and analyse the Internet website analytics (by using WebTrends) and make suggestions to the Web Project Board on how the Internet website could be improved by using Search Engine Optimisation (SEO) and Usability techniques based on those results.Provide 2nd-level technical support by using ITIL procedures to the users of the website.Reproduce complex presentation graphics for the websites, so that the graphics met with the OGC Brand Design Guidelines.Communication with 3rd Party Suppliers with regard to products and services.The OGC website won an Interactive Media Award (2007) in the ‘Outstanding Achievement’ category. Gallery Main Homepage of the website A 'landing page' for the main sections of the website A page that incorporates text and graphics. A typical content page on the website A typical content page on the website"
