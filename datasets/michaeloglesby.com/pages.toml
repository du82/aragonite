description = "The Successful Delivery Toolkit was a product with a collection of “Best Practice” methodologies for UK Government projects. It was decommissioned in 2006."
full_description = "OGC Successful Delivery Toolkit The Successful Delivery Toolkit was a product with a collection of “Best Practice” methodologies (ways of working) for project management (PRINCE2), IT Service Delivery (ITIL), and other UK Government procurement-related topics. The Toolkit was delivered to customers free of charge primarily via the Internet, but it was also available offline as a CD-ROM product. On the project, I was the Lead Technical Developer and Brand Designer for the Toolkit. I was responsible for:The evolution and maintenance of the Toolkit website, as well as the offline CD-ROM. The Toolkit was coded in HTML, JavaScript, and CSS.Ensuring that the Toolkit product met the UK Government web guidelines, W3C Web Content Accessibility Guidelines (WCAG), and Disability Discrimination Act 1995.Designing and producing the marketing material for the Toolkit product, and liaising with the team’s Marketing Officer to achieve this. The Toolkit marketing material consisted of a CD, brochure, and promotional DVD.In the last six months of my involvement with the project, I became the Project Manager. It was my responsibility to finalise and launch the last version of the Toolkit. Being the Project Manager was an excellent opportunity for me to develop my skills with PRINCE2; an industry-standard in project management.I also procure and manage the tendering process for the mass CD duplication of the Toolkit product (10,000+ CDs). Gallery CD Label - Version 5. Toolkit v5 CD case design Inside the redesigned version 5 of the Toolkit brochure. The redesigned brochure for version 5 of the Toolkit. The Toolkit product line - Version 4"
