t with Video. It still did not work. So I continued looking at schematics further and noticed one VSync line that went to Gayle. So I took a chance and replaced gayle. This solved the problem, never in a million years would anyone have gone to look at that as a possible fault issue. Anyway Video is sorted, however although the sound is now working. I noticed while testing, its a bit boomy. I also noticed that some mods play perfect and some are missing randomly (as it plays) 1 of the 4 channels. So there is still some damage from cap leakage there. So although the track beeps out, I guessing one is still broken, as it goes between layers.” I didn’t realise my Amiga was in such a bad state, but I was happy to read that the video issue was fixed. I was beginning to worry that all these extra repairs and new chips were going to cost me money, maybe more than buying a ‘new’ Amiga 600 off eBay altogether, but credit to AmigaKit, no extra charge was ever mentioned. Once again, it all goes quiet and I leave Amig"
