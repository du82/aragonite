lum development. By integrating AI into content creation, data analysis, and personalized learning, I drive creativity and innovation in both technical and creative fields. My experience spans AWS, mixed-reality platforms, and AI-powered design tools. I focus on designing immersive educational experiences that bridge technical concepts with real-world applications, equipping learners with practical skills in emerging technologies. My goal is to prepare students for dynamic roles at the intersection of technology, design, and user experience.Enterprise Web SolutionsWith over 12 years of experience in web development, I specialize in enterprise content management systems, UI development, and AI-driven applications. I am proficient in React, TypeScript, and Python, and I excel in building scalable, high-performance interfaces while integrating AI technologies into web solutions. My background includes implementing enterprise platforms like Adobe Experience Manager and WordPress to deliver responsive, accessible, and user-friendly solutions for large-scale projects. I am skilled in managing teams, optimizing web performance, and creating impactful digital experiences that meet the highest standards of usability and accessibility across industries.download my RESUME<img decoding="async" width="1263" height="723" class="wp-block-cover__image-background wp-image-187 lazyload" alt="" src="https://michaelposso.com/wp-content/uploads/2025/01/brands-logos-web-opt.png" data-object-fit="cover" srcset="https://michaelposso.com/wp-content/uploads/2025/01/brands-logos-web-opt.png 1263w, https://michaelposso.com/wp-content/uploads/2025/01/brands-logos-web-opt-300x172.png 300w, https://michaelposso.com/wp-content/uploads/2025/01/brands-logos-web-opt-1024x586.png 1024w, https://michaelposso.com/wp-content/uploads/2025/01/brands-logos-web-opt-768x440.png 768w, https://michaelposso.com/wp-content/uploads/2025/01/brands-logos-web-opt-18x10.png 18w" sizes="(max-width: 1263px) 100vw, 1263px" /><img decoding="async" width="1263" height="723" class="wp-block-cover__image-background wp-image-286 lazyload" alt="" src="https://michaelposso.com/wp-content/uploads/2025/02/universities-logosv2.jpg" data-object-fit="cover" srcset="https://michaelposso.com/wp-content/uploads/2025/02/universities-logosv2.jpg 1263w, https://michaelposso.com/wp-content/uploads/2025/02/universities-logosv2-300x172.jpg 300w, https://michaelposso.com/wp-content/uploads/2025/02/universities-logosv2-1024x586.jpg 1024w, https://michaelposso.com/wp-content/uploads/2025/02/universities-logosv2-768x440.jpg 768w, https://michaelposso.com/wp-content/uploads/2025/02/universities-logosv2-18x10.jpg 18w" sizes="(max-width: 1263px) 100vw, 1263px" />Empowering InnovationI have over a decade of experience teaching UX/UI design, web development, and emerging technologies at undergraduate and graduate levels. My approach combines STEM principles with AI, VR, AR, and real-world applications to create engaging, project-based learning experiences. As a faculty member at institutions like the Fashion Institute of Technology and New York Institute of Technology, I have developed curricula, contributed to faculty development initiatives, and presented at conferences on cutting-edge educational technologies. My goal is to empower students with the skills they need to thrive in today’s dynamic tech landscape.download MY CVMy journeyI was born in Cali, Colombia, where I developed a passion for design and technology early in life. My journey began with communication studies and led me to earn a Bachelor’s in Graphic Design from the Fashion Institute of Technology. After moving to the U.S. in 1999, I combined my family’s woodworking legacy with my creative pursuits, fostering a deep appreciation for the tangible impact of design.As an avid traveler, I find inspiration in experiencing and learning from different cultures, which informs my approach to creativity and innovation. I am also a dedicated practitioner of Capoeira, the Brazilian martial art that blends physicality and rhythm, reflecting my belief in the power of discipline and creativity.Currently, I am pursuing a Master of Science degree at SUNY Polytechnic Institute, focusing on Information Design and Artificial Intelligence. This academic journey allows me to explore the intersection of technology, design, and AI, further enhancing my ability to create innovative solutions.As a builder, educator, and lifelong learner, I empower students to blend creativity with technology, advancing innovation and exploring AI’s transformative potential in design workflows. My goal is to inspire others to push boundaries and create meaningful, impactful solutions.<img decoding="async" width="500" height="500" src="http://michaelposso.com/wp-content/uploads/2025/01/designing-tomorrow-michael-posso.jpg" alt="" class="wp-image-119 lazyload" style="aspect-ratio:1;object-fit:cover" srcset="https://michaelposso.com/wp-content/uploads/2025/01/designing-tomorrow-michael-posso.jpg 500w, https://michaelposso.com/wp-content/uploads/2025/01/designing-tomorrow-michael-posso-300x300.jpg 300w, https://michaelposso.com/wp-content/uploads/2025/01/designing-tomorrow-michael-posso-150x150.jpg 150w, https://michaelposso.com/wp-content/uploads/2025/01/designing-tomorrow-michael-posso-12x12.jpg 12w" sizes="(max-width: 500px) 100vw, 500px" />Frequently Asked QuestionsHow can your AI expertise benefit my business?I specialize in leveraging AI to streamline workflows, enhance content creation, and build intelligent, scalable applications. Whether integrating AI for data analysis, improving user experiences, or automating repetitive tasks, I can help your business unlock new efficiencies and opportunities for innovation.What are your top programming and technical skills?I specialize in web development with HTML, CSS, JavaScript, and React, as well as custom WordPress development. My expertise also includes accessibility standards (WCAG), integrating AI-powered technologies into digital solutions, system design, and cloud architecture using AWS.What industries do you have experience working in?I have worked across various industries, including finance, education, technology, and creative fields. My projects have ranged from building enterprise-grade web solutions for Fortune 500 companies to creating accessible, innovative design workflows for educational and creative organizations.Can you help modernize our website for a11y and performance?Absolutely. I have a strong track record of delivering high-performance, accessible websites that align with WCAG standards. My focus is on creating exceptional user experiences while ensuring technical precision and scalability.Do you offer workshops or training in UX/UI design?Yes, I conduct workshops that span the full spectrum of UX/UI design, covering foundational principles and advanced topics like AR/VR experiences and integrating generative AI into design workflows.Can you design a custom curriculum for my or'
