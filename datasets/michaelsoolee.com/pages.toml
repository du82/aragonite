full_description = "Jekyll Layout Build Warnings Written on August 20, 2014 Today I installed Jekyll 2.3.0 on my machine. When I ran jekyll serve --watch in my terminal to serve my site locally, I kept seeing the warning — Build Warning: Layout ‘none’ requested in feed.xml does not exist. — for my feed. Turns out layout: none isn’t a valid YAML declaration to designate that the file should render without any particular layout. The correct way to tell a file to render without a layout is by passing the value null to the layout variable. --- layout: null ---"
