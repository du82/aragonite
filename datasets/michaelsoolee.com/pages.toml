full_description = "Acknowledge a maker Written on July 13, 2020 This week was pretty rad! I got a comment on a YouTube video I had posted several months ago, I got a reply to the newsletter email I had sent out, people retweeted a tweet about remote work and poop, and folks bought my new coloring eBook. I share this with excitement because what all this activity meant to me was that what I was putting out into the world was resonating with another person or making a difference in their lives. And I think that’s really neat. The reason for this is because it motivates me to keep doing what I’m doing—which is to make and share what I’ve made. So, I’d like to encourage you to acknowledge a maker in your life. That could be a person who’s newsletter you follow—reply to one of their emails. Or pay for an app you’ve been eyeing for a long time. Comment on a post from someone you follow on Twitter or Instagram. Give someone the equivalent of a digital high five for their work you might admire. You’ll motivate them to keep working and producing better work for you and for others to enjoy."
