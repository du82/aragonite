["https://michaelsoolee.com/pausing-analytics"]
title = "Pausing analytics / Michael Lee"
description = "The traffic to my site has been taking a nose dive for a while now."
full_description = "Pausing analytics Written on July 30, 2024 The traffic to my site has been taking a nose dive for a while now. I can’t quite remember which year it was but in its peak, this site had some 20K folks visiting a month. Something I was quite proud of. But as life got busy and my career pivoted from an individual contributor to an engineering leader, I realized the types of things I wanted to write about shifted. This led to writing paralysis. As a software engineer, it was fun sharing my daily learning lessons in hopes it helps others and that felt really good when I saw a gradual monthly increase of visitors to my site. While my motivations – that of helping others – hasn’t changed I realized I was scared from writing about the new stuff I was learning about. Mostly because I thought it would alienate my “audience” as well as tank my analytics. Well the analysis paralysis has tanked my analytics in itself. Watching the nose dive in analytics number happen on a monthly basis stirred emotions in me to write, but I found myself reaching for what I knew would drive numbers instead of what I really wanted to write about. To prevent from this from happening (as well as save a few dollars with a service I didn’t fully utilize) I’ve decided to pause on analytics for this site as well as others for now. I still think Fathom Analytics is an awesome service to use for web analytics and recommend them. It’s just the numbers took away the joy of writing on this site and creating on the Internet which I find a problem. I may add analytics to my sites in the future. But for now, I want to remove things that prevent my ability to create."
