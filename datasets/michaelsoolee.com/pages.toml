["https://michaelsoolee.com/faster-jekyll-serve"]
title = "Speed up Jekyll serve / Michael Lee"
description = "At the time of this article, I have written over 250 articles in my Jekyll project. Which means, running jekyll serve can take a very long time. When you’re ..."
full_description = "Speed up Jekyll serve Written on May 22, 2017 At the time of this article, I have written over 250 articles in my Jekyll project. Which means, running jekyll serve can take a very long time. When you’re trying to make small incremental changes and hoping to quickly see the results in the browser, the process can become a bit frustrating. One way to speed up the jekyll serve process is to just have Jekyll build with the latest post. Since in most scenarios, I’m just proof-reading my latest article, this is ideal. To render the latest post you’ll want to pass along the --limit_posts option with a value of 1. So the entire command looks like jekyll serve --limit_posts 1."
