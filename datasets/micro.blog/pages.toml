["https://micro.blog/about/indieweb"]
title = "Micro.blog"
description = "Post short thoughts or long essays, share photos, all on your own blog. Micro.blog makes it easy, and provides a friendly community where you can share and engage with others."
full_description = "h1 { text-align: center; } .indieweb_content { font-size: 1em; line-height: 1.4em; width: 70%; margin-top: 40px; margin-left: auto; margin-right: auto; } table { border-spacing: 15px; } td img { max-width: 70px; max-height: 70px; } @media screen and (max-width: 675px) { .indieweb_content { width: 100%; } } Micro.blog follows the principles and protocols of the IndieWeb. We believe in open standards, data portability, domain names for your web identity, and connecting to other platforms. Personal domain names are the best way to control your content. By using your own domain name with Micro.blog, you own the URLs and can migrate away from Micro.blog without breaking links to your posts. Micropub is Micro.blog's native posting API. Using Micropub, apps and scripts can create new blog posts, upload photos, save drafts, save bookmarks, edit posts, and more. Webmention is used to enable replies across websites. When you send a reply, Micro.blog can send it to external blogs via Webmention. Micro.blog can also receive replies so they show up in your mentions. POSSE stands for Publish on your Own Site, Syndicate Elsewhere. Upgrade your subscription to Micro.blog to add cross-posting your blog posts to Threads, Bluesky, Mastodon, Medium, LinkedIn, Tumblr, Flickr, Nostr, and Pixelfed. Microformats describe how metadata is included in your blog posts. Webmention and other standards use this IndieWeb building block to get details about your blog posts. All of our built-in themes support Microformats. Microsub is an API for retrieving the timeline and posts in Micro.blog. It can be used instead of or alongside our JSON Feed-based API so that apps are compatible with multiple platforms. IndieAuth is a variation of OAuth where you sign in with your own domain name. Micro.blog third-party apps can use IndieAuth to sign in without needing to register on Micro.blog."
