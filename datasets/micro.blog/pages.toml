title = "Micro.blog"
description = "Post short thoughts or long essays, share photos, all on your own blog. Micro.blog makes it easy, and provides a friendly community where you can share and engage with others."
full_description = '''Start with a post to your blog... Automatically copy your blog posts to other services, formatted just right for each platform. Micro.blog supports Mastodon, Bluesky, Threads, Tumblr, Nostr, LinkedIn, Medium, Pixelfed, and Flickr. Another term for cross-posting is POSSE: Publish on your Own Site, Syndicate Elsewhere. Micro.blog embraces this and many other IndieWeb principles. #crosspost_animation { position: relative; width: 100vw; height: 100vh; } #crosspost_start { position: absolute; top: 100px; width: 350px; background-color: rgba(215, 245, 250, 0.3); } #crosspost_intro { position: absolute; top: 150px; right: 150px; width: 350px; } #crosspost_more { position: absolute; bottom: 350px; left: 150px; width: 350px; } #crosspost_posse { position: absolute; bottom: 150px; left: 150px; width: 350px; } .crosspost_text { padding: 15px; background-color: rgba(255, 255, 255, 0.7); font-size: 16px; line-height: 1.4; color: #000; border-radius: 10px; } .dot_mastodon { position: absolute; width: 10px; height: 10px; background-color: #5e91a5; border-radius: 50%; } .dot_bluesky { position: absolute; width: 10px; height: 10px; background-color: #476e7d; border-radius: 50%; } .mobile_icon_hidden { opacity: 0; } .mobile_icon_visible { position: absolute; opacity: 1; transition: opacity 1s ease-in-out; width: 36px; height: 36px; top: 300px; } #mobile_icon_mastodon { left: calc(25vw); } #mobile_icon_bluesky { left: calc(50% - 25px); text-align: center; } #mobile_icon_threads { right: calc(25vw); } .start_with_text { position: absolute; left: 5px; top: 5px; opacity: 0; transform: rotate(var(--rotation, 0deg)); } .start_with_text.start_with_visible { opacity: 1; transition: opacity 1s ease-in-out; } #destination_mastodon { display: none; position: absolute; opacity: 0; animation: fadeIn 1s ease-in forwards; } #destination_mastodon svg { width: 40px; width: 40px; } #destination_bluesky { display: none; position: absolute; opacity: 0; animation: fadeIn 1s ease-in forwards; } #destination_bluesky svg { width: 40px; height: 35.5px; } @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } } @media (min-width: 1201px) { #crosspost_start { display: none; } #mobile_icon_mastodon { display: none; } #mobile_icon_bluesky { display: none; } #mobile_icon_threads { display: none; } } @media (max-width: 1200px) { #crosspost_animation { display: none; } .start_with_text { display: none; } #crosspost_start { } #crosspost_intro { right: unset; top: 150px; } #crosspost_more { left: unset; top: 400px; bottom: unset; } #crosspost_posse { left: unset; top: 550px; bottom: unset; } .crosspost_container { display: flex; justify-content: center; } #destination_mastodon { display: none; } #destination_bluesky { display: none; } } var CONFIG_DOT_1; var CONFIG_DOT_2; if (window.innerWidth >= 1200) { CONFIG_DOT_1 = { start: { x: 65, y: 30 }, middle: { x: window.innerWidth / 2, y: window.innerHeight - 300 }, end: { x: window.innerWidth - 170, y: window.innerHeight / 2.0 } }; CONFIG_DOT_2 = { start: { x: 65, y: 30 }, middle: { x: window.innerWidth / 2, y: window.innerHeight - 300 }, end: { x: window.innerWidth - 400, y: window.innerHeight / 2.0 + 200 } }; } else { CONFIG_DOT_1 = { start: { x: window.innerWidth / 2, y: 150 }, middle: { x: window.innerWidth / 2, y: 200 }, end: { x: window.innerWidth / 4, y: 250 } }; CONFIG_DOT_2 = { start: { x: window.innerWidth / 2, y: 150 }, middle: { x: window.innerWidth / 2, y: 200 }, end: { x: (window.innerWidth / 2) + (window.innerWidth / 4), y: 250 } }; } const container = document.getElementById('crosspost_animation'); const dotSpacing = 0.02; // spacing between dots (0.0 to 1.0 scale) const dotInterval = 50; // milliseconds between dots // function to create the dotted path const createDottedPath = (config, dot_class, logo_id) => { let t = 0; const placeDot = () => { // calculate dot position using cubic Bézier formula const x = Math.pow(1 - t, 3) * config.start.x + 3 * Math.pow(1 - t, 2) * t * config.middle.x + 3 * (1 - t) * Math.pow(t, 2) * config.middle.x + Math.pow(t, 3) * config.end.x; const y = Math.pow(1 - t, 3) * config.start.y + 3 * Math.pow(1 - t, 2) * t * config.start.y + 3 * (1 - t) * Math.pow(t, 2) * config.middle.y + Math.pow(t, 3) * config.end.y; // create a dot element const dot = document.createElement('div'); dot.classList.add(dot_class); dot.style.transform = `translate(${x}px, ${y}px)`; // near the end of path, start decreasing opacity if (t > 0.8) { let over_threshold = t - 0.8; dot.style.opacity = 1.0 - (over_threshold * 5.0) } // append the dot to the container container.appendChild(dot); // increment t t += dotSpacing; if (t > 1) { // stop when t exceeds 1 placeLogo(x, y, logo_id); return; } else { // schedule the next dot setTimeout(placeDot, dotInterval); } }; // start placing dots placeDot(); }; function placeLogo(x, y, div_id) { // get the element that contains the logo const element = document.getElementById(div_id); // get the dimensions of the element const rect = element.getBoundingClientRect(); // calculate the top-left corner to center the element on the point if (window.innerWidth >= 1200) { const left = x + (rect.width / 2); const top = y - (rect.height / 2) - 15; element.style.position = "absolute"; element.style.left = `${left}px`; element.style.top = `${top}px`; element.style.display = "block"; } else { // a little hacky here for small screens if (div_id == "destination_bluesky") { element.style.right = "100px"; } else { element.style.left = "100px"; } const top = y - (rect.height / 2) - 15; element.style.position = "absolute"; element.style.top = `${top}px`; element.style.display = "block"; } } // adjust ending point on window resize? window.addEventListener('resize', () => { // CONFIG.middle.x = window.innerWidth / 2; // CONFIG.middle.y = window.innerHeight - 100; // CONFIG.end.x = window.innerWidth - 50; // CONFIG.end.y = 100; // container.innerHTML = ''; // clear existing dots // createDottedPath(); }); function updateRotation() { const div = document.querySelector('.start_with_text'); const windowWidth = window.innerWidth; const baseWidth = 1200; const rotation = (baseWidth - windowWidth) * 0.02; // 2% rotation per 100px difference div.style.setProperty('--rotation', `${rotation}deg`); div.classList.add("start_with_visible"); } function showMobileIcon(div_id) { const div = document.getElementById(div_id); div.classList.remove("mobile_icon_hidden"); div.classList.add("mobile_icon_visible"); } document.addEventListener("DOMContentLoaded", () => { // some things we only do for larger screens if (window.innerWidth >= 1200) { createDottedPath(CONFIG_DOT_1, "dot_mastodon", "destination_mastodon"); setTimeout(() => { // wait a second before second path createDottedPath(CONFIG_DOT_2, "dot_bluesky", "destination_bluesky"); }, 1000); setTimeout(() => { // also rotate and show start image here updateRotation(); }, 250); } setTimeout(() => { showMobileIcon("mobile_icon_mastodon"); }, 500); setTimeout(() => { showMobileIcon("mobile_icon_bluesky"); }, 1000); setTimeout(() => { showMobileIcon("mobile_icon_threads"); }, 1500); });'''
