["https://micro.blog/about"]
title = "Micro.blog"
description = "Post short thoughts or long essays, share photos, all on your own blog. Micro.blog makes it easy, and provides a friendly community where you can share and engage with others."
full_description = '''What is Micro.blog? Micro.blog is a unique platform that combines blog hosting with a social media-style timeline and community. It’s a paid hosting service for personal blogs that makes it easy to publish short or long posts. Use it for short thoughts, longer essays, photos, podcasts, what books you’re reading, links to news articles, and more. It’s a community whose members share posts via a timeline that is a safe space for conversations, free from advertising, trolling, and abuse, with community guidelines that are enforced. Micro.blog launched in 2017 with a Kickstarter campaign supported by 3000 backers. A social web timeline Micro.blog's timeline shows posts from people you're following. It's always chronological. There are no trends, no ads, no boosts, and no extra clutter. Micro.blog doesn't have like counts or follower counts. It's not a popularity contest. Private bookmarks instead of public likes let you reference a post or blog about it later. This focus on posts also simplifies the timeline and encourages quick replies when you want to acknowledge someone's post. Cross-posting to Mastodon, Bluesky, Threads, and more Micro.blog can automatically copy your blog posts to many popular services. Post to your blog first, where you have more control over your content, then let Micro.blog send a copy everywhere. #feature_bubbles span, a.feature_showmore span { font-size: 15px; font-family: sans-serif; display: inline-block; opacity: 0; background-color: orange; padding-left: 12px; padding-right: 12px; padding-top: 5px; padding-bottom: 5px; margin-top: 8px; margin-bottom: 8px; margin-right: 8px; border-radius: 15px; transition: opacity 1s ease; } #feature_bubbles { display: none; } a.feature_showmore { color: #000000; } a.feature_showmore span { opacity: 1; background-color: #fceacf; } const colors = [ "#FFA500", "#FFC867", "#E57500", "#FFD699", "#FFB732", "#FF9100", "#FFAA33", "#FF8C00", "#FFB366", "#FF884D" ]; function hexToRGBA(hex, opacity) { hex = hex.replace(/^#/, ""); // remove "#" if present var r = parseInt(hex.substring(0, 2), 16); var g = parseInt(hex.substring(2, 4), 16); var b = parseInt(hex.substring(4, 6), 16); return "rgba(" + r + "," + g + "," + b + "," + opacity + ")"; } // document.addEventListener('DOMContentLoaded', function () { function showFeatureBubbles() { // hide the button and show features document.getElementById("feature_showmore").style.display = "none"; document.getElementById("feature_bubbles").style.display = "block"; // get all spans with ids 1 to 87 var spans = []; for (var i = 1; i <= 87; i++) { spans.push(document.getElementById(i.toString())); } // make first item visible right away var first_item = spans[0]; first_item.style.opacity = 1; // loop over each span for (var i = 0; i < spans.length; i++) { (function(i) { var span = spans[i]; var random_color = colors[i % colors.length]; // cycle through colors if there are more spans than colors // set color right away, half opacity span.style.backgroundColor = hexToRGBA(random_color, 0.5); // random delay between 0 and 3 seconds var random_delay = Math.random() * 3000; // set a timeout to change the background color after the random delay setTimeout(function() { span.style.opacity = 1; }, random_delay); })(i); } } Start small, scale to anything Micro.blog has so many features, you can start small with short blog posts and then grow your web site with photos, podcasts, email newsletters, and custom pages. But don't be overwhelmed! The features you don't need won't get in your way. Show more features... Short blog posts Full-length blog posts Standalone pages Drafts Scheduled posts Categories Upload photos Upload video Upload podcasts Automatic podcast feed Automatic podcast transcripts Manage uploads Plug-ins Themes Redirects Hugo Custom CSS Custom JavaScript Custom domain names Domain name registration Domain name transfer Twitter archive hosting Instagram import WordPress import Tumblr import Medium import Markdown import Ghost import Substack import Write.as import Social timeline Follow users Human-curated discovery Emoji topics Community guidelines Muting users Blocking users No ads IndieWeb principles API: JSON API: Micropub API: Webmention API: IndieAuth API: Microsub API: ActivityPub Bridgy integration Microformats Cross-posting: Medium Cross-posting: Mastodon Cross-posting: LinkedIn Cross-posting: Tumblr Cross-posting: Flickr Cross-posting: Bluesky Cross-posting: Nostr Cross-posting: Pixelfed Per-post cross-posting control Add feeds from multiple servers Automatic post import from feeds RSS JSON Feed Email newsletters Bookmarks Highlights on web pages Web page archiving Backup to GitHub Backup to Internet Archive Track books you're reading Track reading goals Native apps Third-party apps Sunlit app for photos Epilogue app for books Wavelength app for podcasts Goodreads import Instapaper import Pocket import Raindrop import Pinboard import Readwise sync Bookmarks export Export: JSON Export: Markdown Export: Blog archive format Export: HTML and images Filters for auto-categorization Fediverse integration Show conversation on blog Micro.blog values We believe the web is the great social network and that open standards make the web a better place. We believe in IndieWeb and fediverse standards so that you own your data and different apps can work together. We support and encourage our customers to use their own domain names for their blogs. We also encourage third-party developers who want to create apps that work with Micro.blog, and make APIs available for them to use at no charge. We believe in treating our customers as people, and we expect our community members to treat each other with respect as individuals. From the beginning, we have had strong community guidelines and community management to ensure this. What you can do with Micro.blog blog short microblog posts or full-length posts with titles post photos with an automatic photos web page collecting your photos use your own domain name or register a new domain easily track the books you read and post reviews host a podcast post videos keep an archive of web page bookmarks make highlights in saved web pages and quickly create new posts with quotes import and export all sorts of data in different formats use a variety of apps for posting create custom themes for your blog Need more information? There are many help articles at help.micro.blog and community discussions on Micro.blog features. You can also mention @help on the timeline or email help@micro.blog.'''
