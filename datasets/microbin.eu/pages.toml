full_description = "Installation and ConfigurationDockerDockerDockerHub ImageDockerfilecompose.yamlFor Docker, you can either use our setup script, or download the Dockerfile and .env file in the repository and set it up yourself. The image is also available on DockerHub.Automatic setup script:bash <(curl -s https://microbin.eu/docker.sh)This will make a copy of our .env template and launch a Docker container with the latest available MicroBin image. The script will ask you a few questions and update the configuration accordingly.To change your configuration more, edit .env and recreate your MicroBin container with docker compose --env-file .env up --detach. Have a look at the available parameters here.Feel free to check out the script here in the GitHub repository as well."
