["https://microbin.eu/docs/how-to-use/creating-an-upload"]
title = "1. Creating an Upload | MicroBin"
description = "This page outlines the options for when you are uploading to MicroBin."
full_description = "How to Use MicroBin1. Creating an Upload1. Creating an UploadThis page outlines the options for when you are uploading to MicroBin. infoSome of these options might not be available depending on your server's configurationOptionsExpirationUse the expiration dropdown to choose how long you want your upload to exist. When the selected time has expired, it will be removed from the server.Burn AfterUse the burn after dropdown to set a limit on how many times your data can be accessed before it will be removed from the server.Syntax HighlightingUse the syntax highlighting dropdown to enable syntax highlighting for your upload, making it easier to read. You may choose to have the syntax highlighting done by your browser, which will also recognise the language automatically. You can select server-side highlighting, where you need to select the language yourself, but the code will get highlighting without javascript.PasswordUse the password field to set a password for your upload. This will encrypt your data while stored on our server with your password, and you will need to enter the password to access (in case of private and secret uploads) or to modify (in case of read-only uploads). Your password is encrypted, and in case of secret uploads, we never even see it.PrivacyUse this dropdown to select the level of protection your upload needs. Use lower privacy levels if you or your organisation host MicroBin, and higher privacy levels if you are using a public MicroBin service.Level 1: PublicThis privacy level allows everyone to find, see, modify and remove your upload.Level 2: Unlisted (recommended)Unlisted uploads cannot be found unless someone knows its unique, random identifier. If someone knows this identifier, they can see, modify and remove the upload.Level 3: Read-onlyWith this privacy setting, the upload cannot be found unless someone knows its unique, random identifier. If someone knows this identifier, they can see the contents but cannot modify or remove it without entering the password of the upload.Level 4: PrivateWith this privacy setting, the upload cannot be found unless someone knows its unique, random identifier. If someone knows this identifier, they cannot see, modify or remove it without entering the password of the upload. Your upload and its attachments are encrypted, so they are stored safely.Level 5: SecretWith this privacy setting, the upload cannot be found unless someone knows its unique, random identifier. If someone knows this identifier, they cannot see, modify or remove it without entering the password of the upload. Your browser sends us an already encrypted version, so the unencrypted data and password never even leave your device. This option requires you to enter your password many times when accessing your data, but is extremely safe."
