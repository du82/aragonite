["https://microbin.eu/docs/installation-and-configuration/telemetry"]
title = "Telemetry | MicroBin"
description = "MicroBin has more and more features with every release, but the time available for development and maintenance stays the"
full_description = "Installation and ConfigurationTelemetryOn this pageTelemetryMicroBin has more and more features with every release, but the time available for development and maintenance stays the same. To help continuously evaluate how users configure their MicroBin and what features they like the most, we collect some very basic configuration telemetry. How to turn it off?​Simply set the MICROBIN_DISABLE_TELEMETRY environment variable to true or supply MicroBin with the --disable-telemetry flag.What do you collect?​Your MicroBin configuration, plus a check-in every 24 hours to see how many deployments there are.See the exact details in the source code.Do you see my files?​We do not see any of your files, or how you use your MicroBin server. Only what features you have enabled and how you configured it."
