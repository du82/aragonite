["https://microbin.eu/docs/installation-and-configuration/alternative"]
title = "Alternative | MicroBin"
description = "Installation methods not actively supported/maintained by the developers."
full_description = 'Installation and ConfigurationAlternativeOn this pageAlternativeInstallation methods not actively supported/maintained by the developers.From AUR​Install microbin package from AUR on any Arch-based Linux distribution and start/enable microbin systemd service. Systemd will start server on 127.0.0.1:8080 with almost all features enabled, but this can be changed in /etc/microbin.conf.Building MicroBin from Source​Simply clone the repository, build it with cargo build --release and run the microbin executable in the created target/release/ directory. It will start listening on 0.0.0.0:8080. You can change the port or bind address with CL arguments -p (--port) or -b (--bind) respectively .git clone https://github.com/szabodanika/microbin.git cd microbin cargo build --release ./target/release/microbin -p 80Caddy configuration​An example of running MicroBin behind the reverse proxy caddy on the path /paste (using systemd)microbin.service[Unit]Description=Micobin Paste[Service]Type=simpleUser=microbin# Path to your binaryExecStart=/home/microbin/microbin/target/release/microbin# Set your desired working directory, eg where microbin places its dataWorkingDirectory=/home/pi/bin/micro# bind to localhost, as its exposed via CaddyEnvironment=MICROBIN_BIND=127.0.0.1# bind to a unused portEnvironment=MICROBIN_PORT=31333# All your other config (change and add as needed)Environment=MICROBIN_EDITABLE=trueEnvironment=MICROBIN_HIGHLIGHTSYNTAX=trueEnvironment=MICROBIN_THREADS=2Environment=MICROBIN_FOOTER_TEXT="Bin the bytes"# Set your **public** url. Eg the one you will later use to access microbin# Ensure it either starts with http(s):// or with a /Environment=MICROBIN_PUBLIC_PATH="http://100.127.233.32/paste"[Install]WantedBy=multi-user.targetCaddyfileexample.com { # Your normal http root root * /var/www/html file_server # Route all requests to past handle_path /paste/* { reverse_proxy http://127.0.0.1:31333 }}'
year_published = 2025
