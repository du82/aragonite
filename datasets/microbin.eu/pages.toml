title = "URL Redirects | MicroBin"
description = "Did you know that MicroBin can act as a URL shortener?"
full_description = '''How to Use MicroBinURL RedirectsURL RedirectsDid you know that MicroBin can act as a URL shortener?Simply paste the url into the Content field and save it. You will be redirected to your upload's page, where you can see the destination URL and will see a "Copy Redirect" button. Press that to copy MicroBin's redirection link, which will look something like this: https://pub.microbin.eu/url/bear-mouse-turkeyOpening this link will simply redirect you to your original URL. How to Use MicroBinURL RedirectsURL RedirectsDid you know that MicroBin can act as a URL shortener?Simply paste the url into the Content field and save it. You will be redirected to your upload's page, where you can see the destination URL and will see a "Copy Redirect" button. Press that to copy MicroBin's redirection link, which will look something like this: https://pub.microbin.eu/url/bear-mouse-turkeyOpening this link will simply redirect you to your original URL.PreviousGuide to Privacy LevelsNextInstallation and Configuration'''
