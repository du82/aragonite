s: Various specialty controller types include features designed for a more immersive experience in certain video game genres. These include Hands On Throttle and Stick, or HOTAS, controllers for flight simulators, wheel and pedal controllers for racing games, and arcade sticks for fighting games. Some controllers also emulate the feel and button layout of particular old school gaming controllers like the GameCube, SNES, or even Atari 2600. Customizable Functionality: Many controllers include setup software that allows users to reconfigure button functionality. This is especially clutch for older PC games that might not offer native controller support or if you are looking to create an ergonomic setup. You can simply map your preferred keyboard inputs to your controller. Supported Systems: What gaming systems do you want to use your controller with? Whether you are gaming on a Windows PC, PlayStation 5, Xbox One, Nintendo Switch, or something else, make sure to find controllers that offer compatibility with your system of choice. Some controllers also now work with mobile gaming on iPhone and Android, allowing you to connect your phone directly to the controller via an adapter. Battery Life: Be sure to check the rated battery life on any wireless controller with a rechargeable battery. This will determine how often you will be able to play without needing to connect the controller to its dock. Micro Center’s range of gaming controllers includes top peripheral brands like Logitech, Razer, 8bitdo, and Thrustmaster, with superior prices on a huge variety of models. Want more options for your favorite games? See all of our gaming keyboards and gaming mice for the very best in PC gaming controls. Results are above { 'name': 'P1000 Modular Pedal Set', 'id': '679746', 'price': '519.99', 'brand': 'SIMAGIC', 'category': 'Gaming Controllers|612', 'list': 'Search Results', 'position': 1 },{ 'name': 'ActivePedal Primary Set', 'id': '662656', 'price': '2,299.99', 'brand': 'Simucu