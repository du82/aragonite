rs, the most important aspect of a mouse pad’s performance is its speed — that is, how easily a mouse moves across its surface. Generally speaking, mouse pads with a smooth, hard surface provide faster speed, while soft surface pads with more texture tend to be slower. eSports enthusiasts, particularly first person shooter players, often favor faster mouse mats, but plenty of gamers prefer slower and more textured pads because they find they make it easier to control the mouse. Size: Since many games require big mouse movements, mega sized extended mouse pads are popular in the gaming community. XXL and 3XL mouse pads are so large that they can more accurately be called desk mats, since many people who use them keep them under their gaming keyboards as well. Of course, small and medium sized pads are out there as well, and they are popular with gamers playing in smaller spaces. Anti Slip Base: Gamers don’t want their mouse pad sliding around during a match, which is why most gaming mouse pads feature a non '''
