title = "Microformats – building blocks for data-rich web pages"
full_description = '''How to Consume Microformats 2 Data A (very) belated follow up to Getting Started with Microformats 2, covering the basics of consuming and using microformats 2 data. Originally posted on waterpigs.co.uk. More and more people are using microformats 2 to mark up profiles, posts, events and other data on their personal sites, enabling developers to build applications which use this data in useful and interesting ways. Whether you want to add basic support for webmention comments to your personal site, or have ambitious plans for a structured-data-aware-social-graph-search-engine-super-feed-reader, you’re going to need a solid grasp of how to parse and handle microformats 2 data. Choose a Parser To turn a web page containing data marked up with microformats 2 (or classic microformats, if supported) into a canonical MF2 JSON data structure, you’ll need a parser. At the time of writing, there are actively supported microformats 2 parsers available for the following programming languages: Go Javascript (server-side and browser) PHP Python Ruby Rust Parsers for various other languages exist, but might not be actively supported or support recent changes to the parsing specification. There are also various websites which you can use to experiment with microformats markup without having to download a library and write any code: My own live-updating php-mf2 sandbox The various parser comparison tools hosted on microformats.io Aaron Parecki’s pin13.net microformats parser for parsing either URLs or HTML fragments If there’s not currently a parser available for your language of choice, you have a few options: Call the command-line tools provided by one of the existing libraries from your code, and consume the JSON they provide Make use of one of the online mf2 parsers capable of parsing sites, and consume the JSON it returns (only recommended for very low volume usage!) Write your own microformats 2 parser! There are plenty of people happy to help, and a language-agnostic test suite you can plug your implementation into for testing. Considerations During Fetching and Parsing Most real-world microformats data is fetched from a URL, which could potentially redirect to a different URL one or more times. The final URL in the redirect chain is called the “effective URL”. HTML often contains relative URLs, which need to be resolved against a base URL in order to be useful out of context. If your parser has a function for “parsing microformats from a URL”, it should deal with all of this for you. If you’re making the request yourself (e.g. to use custom caching or network settings) and then passing the response HTML and base URL to the parser, make sure to use the effective URL, not the starting URL! The parser will handle relative URL resolution, but it needs to know the correct base URL. When parsing microformats, an HTTP request which returns a non-200 value doesn’t necessarily mean that there’s nothing to parse! For example, a 410 Gone response might contain a h-entry with a message explaining the deletion of whatever was there before. Storing Raw HTML vs Parsed Canonical JSON vs Derived Data When consuming microformats 2 data, you’ll most often be fetching raw HTML from a URL, parsing it to canonical JSON, then finally processing it into a simpler, cleaned and sanitised format ready for use in your website or application. That’s three different representations of the same data — you’ll most likely end up storing the derived data somewhere for quick access, but what about the other two? Experience shows that, over time: the way a particular application cleans up mf2 data will be tweaked and improved as you add new features and handle unexpected edge-cases mf2 parsers gradually get improved, fixing bugs and occasionally adding entirely new features. Therefore, if it makes sense for your use case, I recommend archiving a copy of the original HTML as well as your derived data, leaving out the intermediate canonical JSON. That way, you can easily create scripts or background jobs to update all the derived data based on the original HTML, taking advantage of both parser improvements and improvements to your own code at the same time, without having to re-fetch potentially hundreds of potentially broken links. As mentioned in the previous section, if you archive original HTML for re-parsing, you’ll need to additionally store the effective URL for correct relative URL resolution. For some languages, there are already libraries (such as XRay for PHP) which will perform common cleaning and sanitisation for you. If the assumptions with which these libraries are built suit your applications, you may be able to avoid a lot of the hard work of handling raw microformats 2 data structures! If not, read on… Navigating Microformat Structures A parsed page may contain a number of microformat data structures (mf structs), in various different places. Take a look at the parsed canonical microformats JSON for the article you’re reading right now, for example. items is a list of top-level mf structs, each of which may contain nested mf structs either under their properties or children keys. Each individual mf struct is guaranteed to have at least two keys, type and properties. type is the primary way of identifying what sort of thing that struct represents (e.g. a person, a post, an event). Structs can have more than one type if they represent multiple things at once without wanting to nest them — for example, a post detailing an event might be both a h-entry and a h-event at the same time. Structs can also have additional top-level keys such as id and lang. Generally speaking, type information is most useful when dealing with top-level mf structs, and mf structs nested under a children key. Nested mf structs found in properties will also have type information, but their usage is usually implied by the property name they’re found under. For many common use cases (e.g. a homepage feed and profile) there are several different ways people might nest mf structs to achieve the same goals, so it’s important that your code is capable of searching the entire tree, rather than just looking at the top-level mf structs. Never assume that the microformat struct you’re looking for will be in the top-level of the items list! You need to search the whole tree. I recommend writing some functions which can traverse a mf tree and return all structs which match a filtering callback. This can then be used as a basis for writing more specific convenience functions for common tasks such as finding all microformats on a page of a particular type, or where a certain property matches a certain value. See my microformats2 PHP functions for some working examples. Possible Property Values Each key in a mf struct’s properties dict maps to a list of values for that property. Every property may map to multiple values, and those values may be a mixture of any of the following: A plain string value, containing no HTML, and leaving HTML entities unescaped (e.g. <) { "items": [{ "type": ["h-card"], "properties": { "name": ["Barnaby Walters"] } }] } (In future examples I will leave out the encapsulating {"items": [{"type": [•••], •••}]} for brevity, focusing on the properties key of a single mf struct.) An embedded HTML struct, containing two keys: html, which maps to an HTML representation of the property, and value, mapping to a plain text version. "properties": { "content": [{ "html": "<p>The content of a post, as <strong>raw HTML</strong> (or not).</p>", "value": "The content of a post, as raw HTML (or not)." }] } An img/alt struct, containing the URL of a parsed image under value, and its alt text under alt. "properties": { "photo": [{ "value": "https://example.com/profile-photo.jpg", "alt": "Example Person" }] } A nested microformat data structure, with an additional value key containing a plaintext representation of the data contained within. "properties": { "author": [{ "type": ["h-card"], "properties": { "name": ["Barnaby Walters"] }, "value": "Barnaby Walters }] } All properties may have more than one value. In cases where you expect a single property value (e.g. name), simply take the first one you find, and in cases where you expect multiple values, use all values you consider valid. There are also some cases where it may make sense to use multiple values, but to prioritise one based on some heuristic — for example, an h-card may have multiple url values, in which case the first one is usually the “canonical” URL, and further URLs refer to external profiles. Let’s look at the implications of each of the potential property value structures in turn. Firstly, Never assume that a property value will be a plaintext string. Microformats publishers can nest microformats, embedded content and img/alt structures in a variety of different ways, and your consuming code should be as flexible as possible. To partially make up for this complexity, you can always rely on the value key of nested structs to provide you with an equivalent plaintext value, regardless of what type of struct you’ve found. When you start consuming microformats 2, write a function like this, and get into the habit of using it every time you want a single, plaintext value from a property: def get_first_plaintext(mf_struct, property_name): try: first_val = mf_struct['properties'][property_name][0] if isinstance(first_val, str): return first_val else: return first_val['value'] except (IndexError, KeyError): return None Secondly, Never assume that a particular property will contain an embedded HTML struct — this usually applies to content, but is relevant anywhere your application expects embedded HTML. If you want to reliably get a value encoded as raw HTML, then you need to: Check whether the first property value is an embedded HTML struct (i.e. has an html key). If so, take the value of the html key Otherwise, get the first plaintext property value using the approach above, and HTML-escape it If neither is found, the property has no value. In Python 3.5+, that could look something like this: from html import escape def get_first_html(mf_struct, property_name): try: first_val = mf_struct['properties'][property_name][0] if isinstance(first_val, dict) and 'html' in first_val: return first_val['html'] else: plaintext_val = get_first_plaintext(mf_struct, property_name) if plaintext_val is not None: plaintext_val = escape(plaintext_val) return plaintext_val except (IndexError, KeyError): return None In some cases, it may make sense for your application to be aware of whether a value was parsed as embedded HTML or a plain text string, and to store/treat them differently. In all other cases, always use a function like this when you’re expecting embedded HTML data. Thirdly, when expecting an image URL, check for an img/alt structure, falling back to the plain text value (and either assuming an empty alt text or inferring an appropriate one, depending on your specific use case). Something like this could be a good starting point: def get_img_alt(mf_struct, property_name): try: first_val = mf_struct['properties'][property_name][0] if isinstance(first_val, dict) and 'alt' in first_val: return first_val else: plaintext_val = get_first_plaintext(mf_struct, property_name) if plaintext_val is not None: return {'value': plaintext_val, 'alt': ''} return None except (IndexError, KeyError): return None Finally, in cases where you expect a nested microformat, you might end up getting something else. This is the hardest case to deal with, and the one which depends the most on the specific data and use-case you’re dealing with. For example, if you’re expecting a nested h-card under an author property, but get something else, you could use any of the following approaches: If you got a plain string which doesn’t look like a URL, treat it as the name property of an implied h-card structure with no other properties (and if you need a URL, you could potentially take the hostname of the effective URL, if it works in context as a useful fallback value) If you got an img alt struct, you could treat the value as the photo property, the alt as the name property, and potentially even take the hostname of the photo URL to be the implied fallback url property (although that’s pushing it a bit, and in most cases it’s probably better to just leave out the url) If you got an embedded HTML struct, take its plaintext value and use one of the first two approaches If you got a plain string, check to see if it looks like a URL. If so, fetch that URL and look for a representative h-card to use as the author value If you get an embedded mf struct with a url property but no photo, you could fetch the url, look for a representative h-card (more on that in the next section) and see if it has a photo property Treat the author property as invalid and run the h-entry (or entire page if relevant) through the authorship algorithm The first three are general principles which can be applied to many scenarios where you expect an embedded mf struct but find something else. The last three, however, are examples of a common trend in consuming microformats 2 data: for many common use-cases, there are well-thought-through algorithms you can use to interpret data in a standardised way. Know Your Algorithms and Vocabularies The authorship algorithm mentioned above is one of several more-or-less formally established algorithms used to solve common problems in indieweb usages of microformats 2. Some others which are worth knowing about include: “Who wrote this post?”: authorship algorithm “There’s more than one h-card on this page, which one should I use?”: representative h-card “I want to get a paginated feed of posts from this page”: How to consume h-feed “How do I find and display the main post on this page?”: How to consume h-entry “I received a response to one of my posts via webmention, how do I display it?”: How to display comments Library implementations of these algorithms exist for some languages, although they often deviate slightly from the exact text. See if you can find one which meets your needs, and if not, write your own and share it with the community! In addition to the formal consumption algorithms, it’s worth looking through the definitions of the microformats vocabularies you’re using (as well as testing with real-world data) and adding support for properties or publishing techniques you might not have thought of the first time around. Some examples to get you started: If an h-card has no valid photo, see if there’s a valid logo you can use instead When presenting a h-entry with a featured photo, check both the photo property and the featured property, as one or the other might be used in different scenarios When dealing with address or location data (e.g. on an h-card, h-entry or h-event), be aware that either might be present in various different forms. Co-ordinates might be separate latitude and longitude properties, a combined plaintext geo property, o'''
