["https://microformats.org/2020/03/04/google-confirms-microformats-are-still-a-recommended-metadata-format-for-content"]
title = "Google confirms Microformats are still a recommended metadata format for content – Microformats"
full_description = "Google confirms Microformats are still a recommended metadata format for content This post originally appeared on Jamie Tanna’s site. Google announced that they are removing support for the data-vocabulary metadata markup that could be used to provide rich search results on its Search Engine. In a Twitter exchange, John Mueller, a Webmaster Trends Analyst at Google, confirmed that Microformats are still being supported by Google at this time: Yes, we still support them. — 🍌 John 🍌 (@JohnMu) January 21, 2020 John also confirmed that he knows of no upcoming plans to deprecate Microformats: We don’t have any plans for changes to announce there at the moment. I don’t know off-hand how broadly microformats are used, my guess is it’s much more than data-vocabulary. That said … https://t.co/ZCE7rTKmPa — 🍌 John 🍌 (@JohnMu) January 21, 2020 This is an especially great result due to the way that Google is quite happy to abandon various metadata formats, as noted in our 7th anniversary blog post, almost 8 years ago. With this announcement, Microformats are now the longest-supported metadata format that Google parses, since at least 2009! With the continued growth of Microformats across the IndieWeb, we expect that Google will extend its Microformats support accordingly. Tags for this entry indieweb, microformats2 Wednesday, March 4th, 2020 at 10:48 am jamietanna"
