full_description = '''microformats2 parsing specification From Microformats Wiki Jump to navigation Jump to search microformats2 is a simple, open format for marking up data in HTML. The microformats2 parsing specification describes how to implement a microformats2 parser, independent of any specific vocabularies. Status This is a Living Specification with several interoperable implementations. This specification is stable, subject to editorial changes only for improving clarity of existing meaning. While substantive changes are unexpected, it is a living specification subject to substantive change by issues and errata filed in response to implementation experience, requiring consensus among participating implementers (since 2015-01-21) as part of an explicit change control process. There are currently no draft or proposed new features in this specification, and if any were to be added, they would be explicitly labeled as such.Note: This specification is only marked as a "Draft Specification" because of pending edits from resolved issues before 2016-06-20. Once those edits have been completed, the link to [[Category:Draft Specifications]] at the bottom of this document should be changed to [[Category:Specifications]]. Participate Open Issues Resolved issues before 2016-06-20 IRC: #microformats on Libera Editor Tantek Çelik License Per CC0, to the extent possible under law, the editors have waived all copyright and related or neighboring rights to this work. In addition, as of 2025-03-02, the editors have made this specification available under the Open Web Foundation Agreement Version 1.0. Contents 1 algorithm 1.1 parse a document for microformats 1.2 parse an element for class microformats 1.3 parse an element for properties 1.3.1 parsing a p- property 1.3.2 parsing a u- property 1.3.3 parsing a dt- property 1.3.4 parsing an e- property 1.3.5 parsing for implied properties 1.4 parse a hyperlink element for rel microformats 1.4.1 rel parse examples 1.5 parse an img element for src and alt 2 what do the CSS selector expressions mean 3 note HTML parsing rules 4 note backward compatibility details 4.1 backward compatibility mappings 5 questions 6 implementations 7 test suite 8 change control 9 see also algorithm parse a document for microformats To parse a document for microformats, follow the HTML parsing rules and do the following: start with an empty JSON "items" array and "rels" & "rel-urls" hashes: { "items": [], "rels": {}, "rel-urls": {} } parse the root element for class microformats, adding to the JSON items array accordingly parse all hyperlink (<a> <area> <link>) elements for rel microformats, adding to the JSON rels & rel-urls hashes accordingly return the resulting JSON Parsers may simultaneously parse the document for both class and rel microformats (e.g. in a single tree traversal). parse an element for class microformats To parse an element for class microformats: parse element class for root class name(s) "h-*" and if none, backcompat root classes if none found, parse child elements for microformats (depth first, doc order) else if found, start parsing a new microformat keep track of whether the root class name(s) was from backcompat create a new { } structure with: type: [array of unique microformat "h-*" type(s) on the element sorted alphabetically], properties: { } - to be filled in when that element itself is parsed for microformats properties if the element has a non-empty id attribute: id: string value of element's id attribute parse child elements (document order) by: if parsing a backcompat root, parse child element class name(s) for backcompat properties else parse a child element class for property class name(s) "p-*,u-*,dt-*,e-*" if such class(es) are found, it is a property element add properties found to current microformat's properties: { } structure parse a child element for microformats (recurse) if that child element itself has a microformat ("h-*" or backcompat roots) and is a property element, add it into the array of values for that property as a { } structure, add to that { } structure: value: if it's a p-* property element, use the first p-name of the h-* child else if it's an e-* property element, re-use its { } structure with existing value: inside. else if it's a u-* property element and the h-* child has a u-url, use the first such u-url else use the parsed property value per p-*,u-*,dt-* parsing respectively else add found elements that are microformats to the "children" array imply properties for the found microformat (see below) The "*" for root (and property) class names consists of an optional vendor prefix (series of 1+ number or lowercase a-z characters i.e. [0-9a-z]+, followed by '-'), then one or more '-' separated lowercase a-z words. parse an element for properties parsing a p- property To parse an element for a p-x property value (whether explicit p-* or backcompat equivalent): Parse the element for the value-class-pattern. If a value is found, return it. If abbr.p-x[title] or link.p-x[title], return the title attribute. else if data.p-x[value] or input.p-x[value], then return the value attribute else if img.p-x[alt] or area.p-x[alt], then return the alt attribute else return the textContent of the element after: dropping any nested <script> & <style> elements; replacing any nested <img> elements with their alt attribute, if present; otherwise their src attribute, if present, adding a space at the beginning and end, resolving the URL if it’s relative; removing all leading/trailing spaces parsing a u- property To parse an element for a u-x property value (whether explicit u-* or backcompat equivalent): if a.u-x[href] or area.u-x[href] or link.u-x[href], then get the href attribute else if img.u-x[src] return the result of "parse an img element for src and alt" (see Sec.1.5) else if audio.u-x[src] or video.u-x[src] or source.u-x[src] or iframe.u-x[src], then get the src attribute else if video.u-x[poster], then get the poster attribute else if object.u-x[data], then get the data attribute else parse the element for the value-class-pattern. If a value is found, get it else if abbr.u-x[title], then get the title attribute else if data.u-x[value] or input.u-x[value], then get the value attribute else get the textContent of the element after removing all leading/trailing spaces and nested <script> & <style> elements return the normalized absolute URL of the gotten value, following the containing document's language's rules for resolving relative URLs (e.g. in HTML, use the current URL context as determined by the page, and first <base> element, if any). parsing a dt- property To parse an element for a dt-x property value (whether explicit dt-* or backcompat equivalent): parse the element for the value-class-pattern, including the date and time parsing rules. If a value is found, then return it. if time.dt-x[datetime] or ins.dt-x[datetime] or del.dt-x[datetime], then return the datetime attribute else if abbr.dt-x[title], then return the title attribute else if data.dt-x[value] or input.dt-x[value], then return the value attribute else return the textContent of the element after removing all leading/trailing spaces and nested <script> & <style> elements. parsing an e- property To parse an element for a e-x property value (whether explicit "e-*" or backcompat equivalent): return a dictionary with two keys: html: the innerHTML of the element by using the HTML spec: Serializing HTML Fragments algorithm, with leading/trailing spaces removed. Proposed: and normalized absolute URLs in all URL attributes except those that are fragment-only, e.g. start with '#'.(issue 38) value: the textContent of the element after: dropping any nested <script> & <style> elements; replacing any nested <img> elements with their alt attribute, if present; otherwise their src attribute, if present, adding a space at the beginning and end, resolving the URL if it’s relative; removing all leading/trailing spaces parsing for implied properties Imply properties only on explicit h-x class name root microformat element (no backcompat roots): if no explicit "name" property, and no other p-* or e-* properties, and no nested microformats, then imply by: if img.h-x or area.h-x, then use its alt attribute for name else if abbr.h-x[title] then use its title attribute for name else if .h-x>img:only-child[alt]:not([alt=""]):not[.h-*] then use that img’s alt for name else if .h-x>area:only-child[alt]:not([alt=""]):not[.h-*] then use that area’s alt for name else if .h-x>abbr:only-child[title]:not([title=""]):not[.h-*] then use that abbr title for name else if .h-x>:only-child:not[.h-*]>img:only-child[alt]:not([alt=""]):not[.h-*] then use that img’s alt for name else if .h-x>:only-child:not[.h-*]>area:only-child[alt]:not([alt=""]):not[.h-*] then use that area’s alt for name else if .h-x>:only-child:not[.h-*]>abbr:only-child[title]:not([title=""]):not[.h-*] use that abbr’s title for name else use the textContent of the .h-x for name after: dropping any nested <script> & <style> elements; replacing any nested <img> elements with their alt attribute, if present; remove all leading/trailing spaces if no explicit "photo" property, and no other explicit u-* (Proposed: change to: u-* or e-*) properties, and no nested microformats, then imply by: if img.h-x[src], then use the result of "parse an img element for src and alt" (see Sec.1.5) for photo else if object.h-x[data] then use data for photo else if .h-x>img[src]:only-of-type:not[.h-*] then use the result of "parse an img element for src and alt" (see Sec.1.5) for photo else if .h-x>object[data]:only-of-type:not[.h-*] then use that object’s data for photo else if .h-x>:only-child:not[.h-*]>img[src]:only-of-type:not[.h-*], then use the result of "parse an img element for src and alt" (see Sec.1.5) for photo else if .h-x>:only-child:not[.h-*]>object[data]:only-of-type:not[.h-*], then use that object’s data for photo if there is a gotten photo value, return the normalized absolute URL of it, following the containing document's language's rules for resolving relative URLs (e.g. in HTML, use the current URL context as determined by the page, and first <base> element, if any). if no explicit "url" property, and no other explicit u-* (Proposed: change to: u-* or e-*) properties, and no nested microformats, then imply by: if a.h-x[href] or area.h-x[href] then use that [href] for url else if .h-x>a[href]:only-of-type:not[.h-*], then use that [href] for url else if .h-x>area[href]:only-of-type:not[.h-*], then use that [href] for url else if .h-x>:only-child:not[.h-*]>a[href]:only-of-type:not[.h-*], then use that [href] for url else if .h-x>:only-child:not[.h-*]>area[href]:only-of-type:not[.h-*], then use that [href] for url if there is a gotten url value, return the normalized absolute URL of it, following the containing document's language's rules for resolving relative URLs (e.g. in HTML, use the current URL context as determined by the page, and first <base> element, if any). Note: The same markup for a property should not be causing that property to occur in both a microformat and one embedded inside - such a property should only be showing up on one of them. The parsing algorithm has details to prevent that, such as the :not[.h-*] tests above. parse a hyperlink element for rel microformats To parse a hyperlink element (e.g. a or link) for rel microformats: use the following algorithm or an algorithm that produces equivalent results: if the "rel" attribute of the element is empty then exit set url to the value of the "href" attribute of the element, normalized to be an absolute URL following the containing document's language's rules for resolving relative URLs (e.g. in HTML, use the current URL context as determined by the page, and first <base> element if any). treat the "rel" attribute of the element as a space separate set of rel values for each rel value (rel-value) if there is no key rel-value in the rels hash then create it with an empty array as its value if url is not in the array of the key rel-value in the rels hash then add url to the array end for if there is no key with name url in the top-level "rel-urls" hash then add a key with name url there, with an empty hash value add keys to the hash of the key with name url for each of these attributes (if present) and key not already set: "hreflang": the value of the "hreflang" attribute "media": the value of the "media" attribute "title": the value of the "title" attribute "type": the value of the "type" attribute "text": the text content of the element if any if there is no "rels" key in that hash, add it with an empty array value set the value of that "rels" key to an array of all unique items in the set of rel values unioned with the current array value of the "rels" key, sorted alphabetically. rel parse examples Here are some examples to show how parsed rels may be reflected into the JSON (empty items key). E.g. parsing this markup: <a rel="author" href="http://example.com/a">author a</a> <a rel="author" href="http://example.com/b">author b</a> <a rel="in-reply-to" href="http://example.com/1">post 1</a> <a rel="in-reply-to" href="http://example.com/2">post 2</a> <a rel="alternate home" href="http://example.com/fr" media="handheld" hreflang="fr">French mobile homepage</a> Would generate this JSON: { "items": [], "rels": { "author": [ "http://example.com/a", "http://example.com/b" ], "in-reply-to": [ "http://example.com/1", "http://example.com/2" ], "alternate": [ "http://example.com/fr" ], "home": [ "http://example.com/fr" ] }, "rel-urls": { "http://example.com/a": { "rels": ["author"], "text": "author a" }, "http://example.com/b": { "rels": ["author"], "text": "author b" }, "http://example.com/1": { "rels": ["in-reply-to"], "text": "post 1" }, "http://example.com/2": { "rels": ["in-reply-to"], "text": "post 2" }, "http://example.com/fr": { "rels": ["alternate", "home"], "media": "handheld", "hreflang": "fr", "text": "French mobile homepage" } } } parse an img element for src and alt To parse an img element for src and alt attributes: if img[alt] return a new {} structure with value: the element's src attribute as a normalized absolute URL, following the containing document's language's rules for resolving relative URLs (e.g. in HTML, use the current URL context as determined by the page, and first <base> element, if any). alt: the element's alt attribute else return the element's src attribute as a normalized absolute URL, following the containing document's language's rules for resolving relative URLs (e.g. in HTML, use the current URL context as determined by the page, and first <base> element, if any). what do the CSS selector expressions mean This section is non-normative. Use SelectORacle to expand any of the above CSS selector expressions into longform English prose. Exception: :not[.h-*] is not a valid CSS selector but is used here to mean: does not have any class names that start with "h-" note HTML parsing rules This sec'''
