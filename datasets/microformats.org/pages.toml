full_description = '''microformats admins From Microformats Wiki Jump to navigation Jump to search Contents 1 admins 1.1 Wiki-only admins 2 contacting 3 admin emeriti 4 see also admins The following individuals are invited volunteer admins on the microformats IRC channel and wiki: Frances Berriman Tantek Çelik Christophe Ducamp - primary editor/translator for Main_Page-fr. as of 2012-06-20 Jeremy Keith Rohit Khare - also an ex officio observer of microformats admins, as the contact point for the servers, domain names, and legal issues. gRegor Morrill new! as of 2018-06-20 Kevin Marks Eric A. Meyer Theresa O'Connor as of 2012-06-20 Aaron Parecki new! as of 2018-06-20 Brian Suda Ben Ward Wiki-only admins Sven Knebel new! as of 2018-06-20 User:TomMorris Martijn van der Ven new! as of 2018-06-20 User:Cnsupport - infrastructure only For an automatically generated flat list of microformats wiki admins see: Special:Listadmins. contacting Contacting the admins can be done by joining the microformats irc channel and stating "adminhelp" to alert an active moderator that you need their attention. admin emeriti The following individuals are recognized as Admin Emeritus for their invaluable contributions to the microformats community, both in many cases with the founding thereof, and over the years. They've chosen to step down as active microformats admins but should they wish to, are always welcome to return to full active admin status. Dan Cederholm (founding-2011) Ryan King - (founding-2011, mfbot) Robert Bachmann (2006(?)-2011, mflogbot) Dimitri Glazkov (2007(?)-2011) Drew McLellan (2007(?)-2011) Scott Reynen (2007(?)-2011) see also admin-faq admin-how-to admin-to-do community-robustness Retrieved from "http://microformats.org/wiki/index.php?title=admins&oldid=70327"'''
