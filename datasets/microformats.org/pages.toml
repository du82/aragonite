["http://microformats.org/wiki/hcard"]
title = "hCard 1.0 - Microformats Wiki"
full_description = '''hCard 1.0 From Microformats Wiki Jump to navigation Jump to search See latest version: h-card Tantek Çelik (Editor, Author), Brian Suda (Author) hCard is a simple, open format for publishing people, companies, organizations on the web, using a 1:1 representation of vCard (RFC2426) properties and values in HTML. hCard is one of several open microformat standards suitable for embedding data in HTML/HTML5, and Atom/RSS/XHTML or other XML. Translations: Français • 日本語 • Русский • ภาษาไทย • 漢語 • (Add your language) Copyright and patents statements apply. See acknowledgments. Example hCards are most often used to represent people: <div class="vcard"> <a class="url fn" href="https://tantek.com/">Tantek Çelik</a> </div> and organizations: <div class="vcard"> <a class="url fn org" href="https://microformats.org/">microformats.org</a> </div> Get started Create a new hCard Learn hCard authoring The class vcard is a root class name that indicates the presence of an hCard. The classes url, fn, and org define properties of the hCard. Properties Common hCard properties (inside class vcard) fn - name, formatted/full. required n - structured name, container for: honorific-prefix - e.g. Ms., Mr., Dr. given-name - given (often first) name additional-name - other/middle name family-name - family (often last) name honorific-suffix - e.g. Ph.D., Esq. nickname - nickname/alias, e.g. IRC nick org - company/organization photo - photo, icon, avatar url - home page for this contact email - email address tel - telephone number adr - structured address, container for: street-address - street #+name, apt/ste locality - city or village region - state or province postal-code - postal code, e.g. U.S. ZIP country-name - country name bday - birthday. ISO date. category - for tagging contacts note - notes about the contact Example hCard of common properties: <div class="vcard"> <span class="fn">Sally Ride</span> (<span class="n"> <span class="honorific-prefix">Dr.</span> <span class="given-name">Sally</span> <abbr class="additional-name">K.</abbr> <span class="family-name">Ride</span> <span class="honorific-suffix">Ph.D.</span></span>), <span class="nickname">sallykride</span> (IRC) <div class="org">Sally Ride Science</div> <img class="photo" src="http://example.com/sk.jpg"/> <a class="url" href="http://sally.example.com">w</a>, <a class="email" href="mailto:sally@example.com">e</a> <div class="tel">+1.818.555.1212</div> <div class="adr"> <div class="street-address">123 Main st.</div> <span class="locality">Los Angeles</span>, <abbr class="region" title="California">CA</abbr>, <span class="postal-code">91316</span> <div class="country-name">U.S.A</div></div> <time class="bday">1951-05-26</time> birthday <div class="category">physicist</div> <div class="note">1st American woman in space.</div> </div> See the full list of properties for the complete list. Contents 1 Example 1.1 Get started 2 Properties 3 Status 3.1 Errata and Updates 4 Background 5 Conformance 6 Format 6.1 In General 6.2 Root Class Name 6.3 Properties and Sub-properties 6.4 Property List 6.5 Property Notes 6.6 Singular vs. Plural Properties 6.7 Human vs. Machine readable 6.8 Value excerpting 6.9 Property Exceptions 6.10 Organization Contact Info 6.11 Implied "N" Optimization 6.12 Implied "nickname" Optimization 6.13 Implied "organization-name" Optimization 6.14 Tags as Categories 6.15 type subproperty values 6.15.1 type with unspecified value 6.15.2 adr tel email types 6.16 Profile 6.17 Parsing Details 7 Examples 7.1 Sample vCard 7.2 Live example 7.3 More Examples 8 Examples in the wild 9 Implementations 10 Articles 11 Buttons 12 Copyright 13 Patents 14 References 14.1 Normative References 14.2 Informative References 14.2.1 Specifications That Use hCard 14.2.2 Similar Work 15 Inspiration and Acknowledgments 16 Notes on derivation from vCard 16.1 More Semantic Equivalents 16.2 Singular and Plural derivations 16.2.1 Plural Properties Singularized 17 Related Pages 18 Translations Status hCard 1.0 is a microformats.org specification. Public discussion on hCard takes place on hcard-feedback, the #microformats irc channel on irc.freenode.net, and microformats-discuss mailing list. Errata and Updates Known errors and issues in this specification are corrected in resolved and closed issues. Please check there before reporting issues. The hCard 1.0.1 update is currently under development and incorporates known errata corrections as well as the value-class-pattern. Background The vCard standard (RFC2426), has been broadly interoperably implemented (e.g. Apple's "Address Book" application built into MacOSX). In addition, many bloggers identify themselves by name and discuss their friends and family. With just a tad bit of structure, bloggers can discuss people in their blog(s) in such a way that spiders and other aggregators can retrieve this information, automatically convert them to vCards, and use them in any vCard application or service. This specification introduces the hCard format, which uses a 1:1 representation of the properties and values of the aforementioned vCard standard, in semantic HTML. Bloggers can both embed hCards directly in their web pages, and style them with CSS to make them appear as desired. In addition, hCard enables applications to retrieve information directly from web pages without having to reference a separate file. Use the hCard creator and copy the HTML code it generates to your blog or website to publish your contact info. Conformance The key words "MUST", "MUST NOT", "REQUIRED", "SHALL", "SHALL NOT", "SHOULD", "SHOULD NOT", "RECOMMENDED", "MAY", and "OPTIONAL" in this document are to be interpreted as described in RFC 2119. Format In General The vCard standard (RFC2426) forms the basis of hCard. The basic format of hCard is to use vCard object/property names in lower-case for class names, and to map the nesting of vCard objects directly into nested HTML elements. Root Class Name The root class name for an hCard is "vcard". An element with a class name of "vcard" is itself called an hCard. Properties and Sub-properties The properties of an hCard are represented by elements inside the hCard. Elements with class names of the listed properties represent the values of those properties. Some properties have sub-properties, and those are represented by elements inside the elements for properties. Property List hCard properties (sub-properties in parentheses like this) Required: fn n1 family-name given-name additional-name honorific-prefix honorific-suffix Optional: adr post-office-box extended-address street-address locality region postal-code country-name type value agent bday category class email (type, value) geo latitude longitude key label logo mailer nickname note org (organization-name, organization-unit) photo rev role sort-string sound tel2 (type, value) title tz3 uid url Property Notes 1. ^: The 'n' property is OPTIONAL if any implied 'n' optimization rules are in effect. 2. ^: tel - Authors MAY follow the E.123 standard for writing values of telephone numbers. Letter values (e.g. +1-555-FORMATS) MUST be converted to numbers. Use an abbr to display letters and provide a numerical value simultaneously, e.g. <abbr title="+15553676287">+1-555-FORMATS</abbr>. 3. ^: tz - timezones are indicated with the timezone offset, e.g. PST (<span class="tz">-08:00</span>). Singular vs. Plural Properties Singular properties: 'fn', 'n', 'bday', 'tz', 'geo', 'sort-string', 'uid', 'class', 'rev'. For properties which are singular, the first descendant element with that class SHOULD take effect, any others being ignored. All other properties MAY be plural. Each class instance of such properties creates a new instance of that property. Human vs. Machine readable The human visible text contents of an element for a property represents the value of that property, with a few exceptions: If an <abbr> element is used for a property, then the 'title' attribute (if present) of the <abbr> element is the value of the property, instead of the contents of the element, which instead provide a more human presentable version of the value. If an <a> element is used for one or more properties, it MUST be treated as follows: For the 'photo' property and any other property that takes a URL as its value, the href="..." attribute provides the property value. For other properties, the element's content is the value of the property. If an <img> element is used for one or more properties, it MUST be treated as follows: For the 'photo' property and any other property that takes a URL as its value, the src="..." attribute provides the property value. For other properties, the <img> element's 'alt' attribute is the value of the property. If an <object> element is used for one or more properties, it MUST be treated as follows: For the 'photo' property and any other property that takes a URL as its value, the data="..." attribute provides the property value. For other properties, the element's content is the value of the property. Value excerpting Sometimes only part of an element which is the equivalent for a property is used for the value of the property. This typically occurs when a property has a subtype, like 'tel'. For this purpose, the special class name "value" is used to excerpt out the subset of the element that is the value of the property. E.g. here is an hCard fragment for marking up a home phone number: vCard: TEL;TYPE=HOME:+1.415.555.1212 hCard: <span class="tel"> <span class="type">home</span>: <span class="value">+1.415.555.1212</span> </span> This hCard fragment could be displayed as: home: +1.415.555.1212 You may want to customize/localize the visible punctuation and not want to include it in what machines see. Use multiple class="value" elements which are then concatenated. E.g. <span class="tel"> <span class="type">home</span>: <span class="value">+1</span>.<span class="value">415</span>.<span class="value">555</span>.<span class="value">1212</span></span> </span> No change in display, but the parsed hCard property value then becomes in vCard: vCard: TEL;TYPE=HOME:+14155551212 Property Exceptions vCard has several properties which either do not make sense on, or are already implied within the context of a web page. This section explains what to (not) do with them. vCard's NAME, PROFILE, SOURCE, PRODID, VERSION properties are defined in Sections 2.1.2, 2.1.3, 2.1.4, 3.6.3, 3.6.9 of RFC2426. Content publishers MUST NOT use these properties in their hCards, and as such, hCard consumers/parsers MUST IGNORE these properties if they are found within an hCard. Instead. hCard to vCard converters SHOULD use the title of the page where the hCard is found (e.g. the <title> element in HTML documents) to construct the NAME property, MAY output a PROFILE value of "VCARD" per RFC2426, SHOULD use the URL of the page where the hCard is found to construct the SOURCE property (e.g. perhaps as a parameter to a URL/service that converts hCards to vCards), for an output vCard stream (e.g. a .vcf file). Only services/applications that output actual vCards should write the PRODID property, with the product identifier for said service/application. Similarly, only such services/applications should write the VERSION property, with the value "3.0" (without quotes) per RFC2426 Section 3.6.9. Organization Contact Info If the "FN" and "ORG" (organization) properties have the exact same value (typically because they are set on the same element, e.g. class="fn org"), then the hCard represents contact information for a company, organization or place and SHOULD be treated as such. In this case the author also MUST NOT set the "N" property, or set it (and any sub-properties) explicitly to the empty string "". Thus parsers SHOULD handle the missing "N" property, in this case by implying empty values for all the "N" sub-properties. Implied "N" Optimization Although vCard requires that the "N" property be present, the authors of the vCard specification (RFC2426) themselves do not include "N" properties in their vCards near the end of the spec (p.38). This apparent contradiction can be resolved by simply allowing the "FN" property to imply "N" property values in typical cases provided in the spec. We do so explicitly in hCard. If "FN" and "ORG" are not the same (see previous section), and the value of the "FN" property is exactly two words (separated by whitespace), and there is no explicit "N" property, then the "N" property is inferred from the "FN" property. For "FN"s with either one word see below, and for three or more, the author MUST explicitly markup the "N", except for the organization contact info case, see above for that. The content of "FN" is broken into two "words" separated by whitespace. The first word of the "FN" is interpreted as the "given-name" for the "N" property. The second/last word of the "FN" is interpreted as the "family-name" for the "N" property. Exception: If the first word ends in a "," comma, then the first word (minus the comma at the end) is interpreted as the "family-name" and the second word is interpreted as the "given-name". This allows simplification in the typical case of people stating: given-name (space) family-name family-name (comma) given-name Implied "nickname" Optimization Due to the prevalence of the use of nicknames/handles/usernames in actual content published on the Web (e.g. authors of reviews), hCard also has an implied "nickname" optimization to handle this. Similar to the implied "n" optimization, if "FN" and "ORG" are not the same, and the value of the "FN" property is exactly one word, and there is no explicit "N" property, then: The content of the "FN" MUST be treated as a "nickname" property value. Parsers SHOULD handle the missing "N" property by implying empty values for all the "N" sub-properties. Though parsers MUST follow the implied nickname optimization, publishers SHOULD explicitly indicate the "nickname" even in this case, e.g.: <span class="vcard"> <span class="fn nickname">daveman692</span> </span> The hCard MAY have additional explicit "nickname" property values in addition to the implied nickname. Implied "organization-name" Optimization The "ORG" property has two subproperties, organization-name and organization-unit. Very often authors only publish the organization-name. Thus if an "ORG" property has no "organization-name" inside it, then its entire contents MUST be treated as the "organization-name". Tags as Categories Categories in hCard MAY be represented by tags with rel-tag. When a category property is a rel-tag, the tag (as defined by rel-tag) is used for that category. type subproperty values The 'type' subproperty in particular takes different values depending on which property it is a subproperty of. These 'type' subproperty values are case-INSENSITIVE, meaning "Home" is the same as "home", as well as multivalued, e.g. a tel can be home and preferred: vCard: TEL;TYPE=HOME,PREF:+1.415.555.1212 hCard: <span class="tel"><span class="type">Home<'''
