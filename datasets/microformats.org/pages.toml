full_description = '''Microformats events From Microformats Wiki Jump to navigation Jump to search microformats related events (including events which have sessions on microformats). Use the events template to create events pages, and list URLs, details, attendees, recommended tags, link to photos afterwards, etc. Add links to slides and other media to the presentations, podcasts pages respectively. Encourage the use of microformats on event sites' pages themselves, e.g. hCalendar and hCard for the schedule, sessions, speakers, and venues. Contents 1 Add events to your calendar 2 regular 3 upcoming 4 recent 4.1 2015 4.2 2014 4.3 September 2013 4.4 July 2013 4.5 June 2013 4.6 May 2013 4.7 April 2013 4.8 March 2013 4.9 January 2013 5 Zimbra instructions 6 Previous events 7 Other languages 8 Quicktime Broadcaster Notes 9 Related pages Add events to your calendar Subscribe to current and future microformats events, e.g. in Apple iCal, or Evolution: »subscribe to microformats events set it to update ("[x] Refresh" or "Auto-refresh: Every day") See also Zimbra instructions. Or download iCalendar file. regular regular meetup - community meetups. details inside. upcoming Upcoming microformats events: 2018-11-07 19:00–21:00-0800 (-8:00 UTC):An Introduction to MicroformatsWhere: PayLease, 9330 Scranton Rd #450 San Diego, CA 92121 Learn about microformats(.org), a simple way to markup structural information in your HTML.https://gregorlove.com/2018/11/an-introduction-to-microformats/https://www.meetup.com/SanDiegoPHP/events/255975734/ ... add new events here recent Past microformats related events and related photos, blog posts, etc. 2015 2015-01-20: San Francisco microformats dev meetup at La Boulange du Dome, 4th floor at Westfield San Francisco Centre, 845 Market st., San Francisco, CA 94103. http://microformats.org/wiki/events/2015-01-20-sf-meetup 2014 Various events showed and discussed microformats, e.g. at various conferences. To be documented! September 2013 2013-09-14: Discussion of microformats 2 parsing at Taylor Street, Brighton. An informal discussion of microformats 2 parsing. http://microformats.org/wiki/events/2013-09-14-microformats2-parsing July 2013 2013-07-25: SFHTML5: microformats2 & HTML5: The Next Evolutionary Step For Web Data at San Francisco, CA. http://microformats.org/wiki/events/2013-07-25-sfhtml5 2013-07-19: EIA2013: microformats2 & HTML5: The Next Evolutionary Step For Web Data at Tallinn, Estonia. http://microformats.org/wiki/events/2013-07-19-eia2013-microformats2-html5 June 2013 2013-06-22..23: IndieWebCamp 2013 at Portland, Oregon. Many sessions on/about/using microformats at IndieWebCamp. http://indiewebcamp.com/2013/ 2013-06-18..21: Open Source Bridge 2013 at Portland, Oregon. Many sessions on/about/using microformats at OSBridge. http://opensourcebridge.org/events/2013/sessions May 2013 2013-05-14: microformats dinner before Google I/O at the new food court, Westfield Mall, San Francisco. Microformats dinner the night before Google I/O. http://microformats.org/wiki/events/2013-05-14-microformats-google-io April 2013 2013-04-30: Panel: Web Standards: Myths and Realities at Data 2.0 Summit at Mission Bay Conference Center, 1675 Owens St., San Francisco, CA 2013-04-08: Sensored Meetup #10: Data! APIs! Standards! at Lemnos Labs, 85 Bluxome Street, San Francisco, CA 2013-04-02: HTML5DevConf: microformats2 & HTML5: The Next Evolutionary Step For Web Data at San Francisco. http://microformats.org/wiki/events/2013-04-02-html5devconf-microformats2-html5 2013-04-02: microformats dinner and drinkup SF at 21st Amendment, 563 2nd St, San Francisco, CA March 2013 2013-03-01: microformats dinner! at Papalote on 24th st. Microformats dinner with special guests Jessica and Shane. http://microformats.org/wiki/events/2013-03-01-microformats-dinner January 2013 2013-01-24: Exeter Web Meetup in Devon. Barnaby Walters is giving a talk on microformats2. http://microformats.org/wiki/events/2013-01-24-exeter-web-meetup Zimbra instructions Zimbra: Choose the "Calendar" tab in the far left column, click the new calendar icon (little mini green calendar with a plus sign, top right corner of the column header), a "Create New Calendar" dialog box should appear enter "microformats events" into the Name field check the 2nd checkbox: [x] Synchronize appointments from remote calendar copy this URL: http://h2vx.com/ics/microformats.org/wiki/events paste it into the URL field and click [ OK ] Previous events 2012 | 2011 | 2010 | 2009 | 2008 | 2007 | 2006 Other languages événements en cours (fr) Quicktime Broadcaster Notes See quicktime Related pages photos from events upcoming and recent events events in 2012 events in 2011 events in 2010 events in 2009 events in 2008 events in 2007 events in 2006 Template for an individual event page Retrieved from "http://microformats.org/wiki/index.php?title=events&oldid=69618"'''
