["https://microservice-api-patterns.org/2024/06/08/patterns-in-action-industry-academia.html"]
title = "Our Patterns in Action in Industry and Academia"
full_description = "We are delighted to see our patterns being used in industry and academia. This news item will share some updates from external sources and our own related work. And our book even won an award! Daniel and Olaf presented full-day workshops at two conferences this spring, the API Conference 2024 in London, UK, and JAX 2024 in Mainz, Germany. Daniel will also speak at the W-JAX 2024 conference in the fall. Five of our patterns increase the understandability of API design, according to a controlled experiment run by Stuttgart University! Well, four do; Request Bundle aims to improve performance. A paper reporting this experience has just been presented in the main research track at ICSA 2024; experiment setup and result presentation won a Distinguished Artifact Award. You can find the author’s copy (pre-print) of the paper here (PDF). Other academics use our patterns for research in the area of API design tools as well. According to Google Scholar, almost thirty papers have cited our book already. We have also been busy with our related Interface Refactoring Catalog, a “collection of API refactorings and related architectural refactorings” that use API design patterns. Eight interface refactorings were workshopped at EuroPLoP 2023 (see our trip report), and we will present the next seven refactorings at EuroPLoP 2024 in July. Finally, Olaf and Mirko were awarded the “Best Publication Award” 2023/2024 at their university OST – Eastern Switzerland University of Applied Sciences. The jury praised the book for its practical relevance and international impact. We are very proud of this peer recognition!"
year_published = 2025
