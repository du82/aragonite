["https://microservice-api-patterns.org/index"]
title = "Patterns for API Design"
description = """
Our Patterns for API Design, also known as Microservice API Patterns (MAP), capture proven solutions to problems commonly encountered when specifying, implementing and maintaining message-based APIs. 

 MAP focusses on message representations – the payloads exchanged when APIs are called. These payloads vary in their structure  as API endpoints and their operations have different architectural responsibilities. The chosen representation structures strongly influence the design time and runtime qualities of an API. The evolution of API specifications and their implementations has to be governed.


  
  News


  
  Get Started"""
full_description = "News (November 2022): Our patterns form the core of the book “Patterns for API Design: Simplifying Integration with Loosely Coupled Message Exchanges” in the Vaughn Vernon Signature series at Addison-Wesley Professional. The MAP for Open API Design and Evolution While much has been said about microservices in general and about supporting infrastructure architectures, the service API design has received less attention: How many services should be exposed remotely? What is an adequate size for them? How to ensure that the services provided by an API and their interactions with clients are loosely coupled? How much data should be exchanged in request and response messages? How often does this happen? What are the most suitable message representations? How to agree on the meaning of each message? Answering these questions is what this website is about. Our API design pattern language is organized into categories: Foundation Frontend Integration Backend Integration Public API Community API Solution-Internal API API Description Responsibility Endpoint Roles Processing Resource Information Holder Resource Operation Responsibilities State Creation Operation Retrieval Operation State Transition Operation Computation Function Information Holder Types Operational Data Holder Master Data Holder Reference Data Holder Link Lookup Resource Data Transfer Resource Structure Representation Elements Atomic Parameter Atomic Parameter List Parameter Tree Parameter Forest Element Stereotypes Data Element Metadata Element Id Element Link Element Special Purpose Representations API Key Error Report Context Representation Quality Reference Management Embedded Entity Linked Information Holder Data Transfer Parsimony Pagination Wish List Wish Template Conditional Request Request Bundle Quality Management and Governance Pricing Plan Rate Limit Service Level Agreement Evolution Version Identifier Semantic Versioning Two In Production Aggressive Obsolescence Experimental Preview Limited Lifetime Guarantee Eternal Lifetime Guarantee Eager to get going? Looking for more context and background information? This presentation and the cheat sheet are good places to get started with MAP. Several tutorials are available. The resources page suggests more entry points. Selected patterns are implemented in the Lakeside Mutual sample application (see here). Lakeside Mutual is a fictitious insurance company that implemented its core business capabilities for customer, contract, and risk management as a set of microservices with corresponding application frontends. Microservice Domain Specific Language (MDSL) features all patterns in combination. The Stepwise Service Design activity proposed in the Software/Service/API Design Practice Repository (DPR) leverages many of the our patterns.1 (since 2021) An API refactoring catalog is emerging. Guidance and Pointers You can continue reading about MAP and related topics on any of these pages: Introduction What is this website all about? Where to start reading? Read more Cheat Sheet In which order should the patterns be applied? How do they relate to each other? Read more Patterns by Theme and Topic What are the pattern categories? Read more Patterns by Quality Which quality attributes do the patterns address? Read more Publications Where can I find the pattern papers? Read more Microservices and Patterns Primer What are microservices? Why do we use patterns? Read more Related Pattern Languages Which other pattern languages does MAP complement? Read more News Are there any updates on Patterns for API Design (aka MAP)? Read more Feedback and input is appreciated! Contact us. DPR is a public repository of methods and practices that are applicable to service analysis and design, collected and curated by two of the MAP authors. DPR now comes as a Leanpub ebook too, also available in a bundle with the Software Architecture Lecture Notes by a third MAPer. ↩"
