full_description = "Which pattern to read when concerned… … about affordability (cost): API Key Aggressive Obsolescence Community API Eternal Lifetime Guarantee Experimental Preview Limited Lifetime Guarantee Pricing Plan Public API Rate Limit Semantic Versioning Solution-Internal API Two in Production Version Identifier … about coupling: Backend Integration Context Representation Data Element Data Transfer Resource Frontend Integration Link Element Link Lookup Resource Metadata Element Processing Resource … about consistency: Backend Integration Information Holder Resource Master Data Holder Operational Data Holder … about flexibility: API Key Aggressive Obsolescence Data Transfer Resource Experimental Preview Frontend Integration Link Lookup Resource Linked Information Holder Public API Solution-Internal API Two in Production … about interoperability: API Description API Key Atomic Parameter Atomic Parameter List Community API Context Representation Data Element Error Report Id Element Link Element Metadata Element Parameter Forest Parameter Tree Public API Semantic Versioning Service Level Agreement … about maintainability: Aggressive Obsolescence Context Representation Data Element Eternal Lifetime Guarantee Experimental Preview Limited Lifetime Guarantee Parameter Forest Parameter Tree Semantic Versioning Two in Production Version Identifier … about performance: API Key Computation Function Conditional Request Embedded Entity Linked Information Holder Pagination Pricing Plan Rate Limit Request Bundle Retrieval Operation State Creation Operation State Transition Operation Wish List Wish Template … about portability: API Key Error Report … about reliability: API Key Backend Integration Error Report Eternal Lifetime Guarantee Pricing Plan Public API Rate Limit Request Bundle … about security: API Key Community API Context Representation Data Element Error Report Eternal Lifetime Guarantee Frontend Integration Id Element Public API Solution-Internal API … about usability: Embedded Entity Experimental Preview Frontend Integration Linked Information Holder Processing Resource Wish List Wish Template … about granularity: Computation Function Data Transfer Resource Information Holder Resource Link Lookup Resource Master Data Holder Operational Data Holder Processing Resource Reference Data Holder Retrieval Operation State Creation Operation State Transition Operation Pattern Index A complete list of all published patterns can be found in the Pattern Index. Cheat Sheet If this is not what you are looking for, please try our Cheat Sheet. It provides alternative entry points into the language. Also see our pattern classifications by role, by scope or by phase."
