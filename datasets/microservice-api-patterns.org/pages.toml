["https://microservice-api-patterns.org/2022/08/02/vvonlit.html"]
title = "API design patterns book announced"
full_description = "We are delighted to report that MAP will form the core of an upcoming book called “Patterns for API Design: Simplifying Integration with Loosely Coupled Message Exchanges”, announced by the Addison Wesley Signature series editor Vaughn Vernon on Twitter and LinkedIn on July 24. The book, expected to be available in December 2022, will feature 44 patterns as well as an introduction to API fundamentals, a domain model for APIs, and a decision model identifying pattern selection questions, options and criteria. A third part applies the patterns to three cases, our fictitious Lakeside Mutual microservices scenario as well as two real-world projects that have been running in productions for some time. The book also contains an introduction to the Microservice Domain Specific Language (MDSL) in one of three appendices (the other two provide a pattern eligibility cheat sheet and an implementation of selected Lakeside Mutual APIs). “Patterns for API Design” is already listed at Amazon.com. Stay tuned!"
year_published = 2025
