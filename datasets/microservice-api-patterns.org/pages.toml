title = "Pattern Categories"
description = "Our microservice design patterns can be grouped by lifecycle phase, level of abstraction and refinement, and type of design concern. Each of the resulting categories investigates a set of related design issues."
full_description = "Pattern Categories Foundation Patterns Which types of (sub-)systems and components are integrated? From where should an API be accessible? How should it be documented? Read more Responsibility Patterns What is the architectural role played by each API endpoint? How do these roles and the operation responsibilities realizing them impact (micro-)service cuts and granularity? Read more Structure Patterns What is an adequate number of representation elements for request and response messages? How should these elements be structured? How can they be grouped and annotated with usage instructions? Read more Quality Patterns How can an API provider achieve a certain level of quality of the offered API, while using its available resources in a cost-effective way? How can the quality tradeoffs be communicated and accounted for? Read more Evolution Patterns How to deal with lifecycle management concerns such as support periods and versioning? How to promote backward compatibility and communicate breaking changes? Read more The Book Features 44 patterns with examples Introduces API fundamentals and a domain model for APIs Guides architectural decision making with narratives Shows pattern application and combination in real-world systems and much more"
