["https://microservice-api-patterns.org/2019/05/31/websitev12.html"]
title = "Reference Management patterns published"
full_description = "Information elements in request and response message representations often reference other ones to express containment, aggregation, or other associations. For instance, transactional data such as orders and shipments references master data such as product and customer records. Should referenced data be embedded in message representations or should links be provided to look this data up with separate calls? We just published two new quality patterns in the Reference Management subcategory that offer answers to this question: Embedded Entity and Linked Information Holder."
