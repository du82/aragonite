title = "About website, book and their authors"
description = "Patterns for API Design (aka Microservice API Patterns) results from a collaboration of authors from the industry and academia (2016-2022). Who wrote it?"
full_description = "Olaf Zimmermann Consulting software architect and professor @ Eastern Switzerland University of Applied Sciences (OST), Rapperswil, Switzerland Personal Website and Blog Medium Blog Website at Institute for Software (IFS) LinkedIn Mirko Stocker Full stack developer and professor @ Eastern Switzerland University of Applied Sciences (OST), Rapperswil, Switzerland; Managing Director @ LegalGo GmbH Website Cloud Solutions Blog (in German) LinkedIn Twitter Daniel Lübke Digital Solution Architecture, Hanover, Germany Website LinkedIn Uwe Zdun University of Vienna, Faculty of Computer Science, Software Architecture Research Group, Vienna, Austria Website LinkedIn Twitter Cesare Pautasso Software Institute, Faculty of Informatics, USI Lugano, Switzerland Website LinkedIn Twitter The book landing page is here. Please visit our News page for site history and updates, or contact us at info@microservice-api-patterns.org. Acknowledgements We want to thank all the people who provided feedback, especially the shepherds and writer’s workshop participants from EuroPLoP 2017, 2018, 2019 and 2020 as well as Andrei Furda who provided input to the introductory material and reviewed many of our patterns, Oliver Kopp and Hans-Peter Hoidn who organized several informal workshops with peers. We also would like to thank the students of the HSR/OST lectures “Advanced Patterns and Frameworks” and “Application Architecture” since 2018 that and discussed some of our patterns and provided additional feedback (for instance, Dominic Gabriel). Last but certainly not least we thank Vaughn Vernon and Frank Leymann for their Forewords to our book. More elaborate acknowledgments can be found in our MAP related publications and our book."
