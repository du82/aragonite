title = "Refactoring to Patterns: Seven API Refactorings Published at EuroPLoP24"
full_description = "We presented more seven interface refactorings at this year’s EuroPLoP conference: Extract Information Holder, Inline Information Holder, Extract Operation, Rename Operation, Make Request Conditional, Encapsulate Context Representation, and Introduce Version Identifier. Again, we received motivating feedback and constructive criticism in the writer’s workshop. Starting from stakeholder concerns and API design smells was seen to be useful, and the detailed guidance by example appreciated. The open-access paper, to appear in the ACM Digital Library, is available for download via the publications page on the Interface Refactoring Cataloag (IRC) website."
