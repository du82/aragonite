title = "Tech Lead Journal Podcast, API Conference, Pattern Story Update"
full_description = "Daniel Lübke was interviewed by Henry Suryawirawan in the Tech Lead Journal Podcast #125. They covered a range of topics, from book writing to API design best practices to the Microservices Domain-Specific Language (MDSL). A transcript and lots of memorable quotes are also included, for example: Design architecture is always about decisions, and decisions have these nasty aspects of you get something, but you lose something. If you go through the right door, you can’t go through the left door. Daniel also gave our talk at the API Conference in London: “API Design with Patterns: Endpoint Roles, Message Structures, Evolution Strategies” (abstract) Last but not least, the pattern story Dutch Government & Energy Sector by Ton Donker has been growing with the coverage of new patterns. So even if you’ve already checked it out, it’s worth revisiting!"
