["https://microservice-api-patterns.org/quickstart-resources"]
title = "Quickstart and Additional Resources"
description = "This page lists entry points into MAP and introductory material about our (micro-)service design patterns."
full_description = "Quick links: Pattern Index, Publications list, News page (also serving as Website change log). Cheat Sheet, Categories and Pattern Filters The issue-pattern pairs in our Cheat Sheet point you at problems that may arise and proven solutions to them. Patterns by Quality groups our patterns by desired or affected property; other filters group them by scope, phase and role. The five Pattern Categories and their motivating questions are another way to get started. The sibling website Refactoring to API Patterns may also serve as entry point into pattern usage. Presentations and Videos All patterns are featured in this Web-based slide show. Watch our co-author Daniel Lübke explain the why and how of MAP in a 24-minute video on Erik Wilde’s YouTube channel (February 2022) and a one-hour podcast in Vaughn Vernon’s Add Dot series. The following presentations are available (PDFs): “APIs as Service Activators: Tackling the Hard Parts of Integration Design”, keynote at ZEUS 2023 workshop A short overview presentation from October 2022 that announced our book (and offers a discount!) “Microservice API Patterns – Step by Step”, APICon 2022 A longer JAX 2021 presentation Presentation on DDD, MAP, MDSL from 2020 Keynote at Microservices 2019 that announced this website Contact us if you are interested in a presentation by one of the authors of website and book. Articles This is an incomplete list (stay tuned!): Sample book content is featured in “What is the Right Service Granularity in APIs?” at InformIT. The introductory article on microservices starts from the challenges of service design and clarifies the scope of MAP. This retrospective reviews how MAP evolved from 2016 to 2022 and shares some of our lessons learned. If you are wondering why we are using patterns to share design experience, you can consult the Primer page. Longer versions of many patterns can be found in the papers listed on the Publications page, for instance those that we published in the EuroPLoP proceedings. And in our book of course! Hands-on Tutorials If you look for concrete guidance how to explore our site and apply the patterns, try one of our tutorials. They mix website/pattern exploration activities with actual API design tasks. Sample Implementations and Practice Collections Each pattern has an example and features real-world uses. The Lakeside Mutual sample system implements many MAPs as indicated here. The Design Practice Repository/Reference (DPR) on GitHub and LeanPub leverages many of the MAP patterns in its method element collection."
