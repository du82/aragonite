["https://microservice-api-patterns.org/book/pattern-adoption-story-1"]
title = "Pattern Adoption Stories from Readers: Dutch Government & Energy Sector"
description = "On pages like this, we collect contributions from readers of our patterns."
full_description = "This pattern adoption story was contributed by Ton Donker, Ruben Haasjes and their readers group. At present, it covers the 21 patterns presented as API Design Pattern of the Week on LinkedIn and Medium. Wish List Known Uses The Wish List pattern is widely used in Dutch government APIs. The guidelines for use of this pattern are available online in Section 9 (“Customization”) of “API Designrules Extensions”. Government APIs are available via a public developer portal. Please find below some examples of Dutch government APIs that make use of the fields parameter for custom representation: https://developer.overheid.nl/apis/kadaster-bag-current/specificatie/production https://developer.overheid.nl/apis/logius-cor/specificatie/production In the Dutch Energy sector I am currently working in, we are about to design APIs that utilize the combination of the fields parameter with the expand parameter. In HAL-formatted responses (responses with links to associated resources) the consumer can retrieve subfields of the associated resource by expanding the returned HAL link. Design rules are available in the Dutch document “API-strategie”. There is no concrete API yet. Discussion Input and Recommended Reading Discussion points: To distinguish between “real” query parameters and the more “steering” or “meta” parameters like expand, fields, limit and page, we – the Dutch Energy sector API Working Group – advocate the usage of an underscore prefix, so _fields, _expand, _limit and _page to prevent misinterpretation of the function of the query parameters. The Wish List works in “optima forma” or comes to his right if all the response fields are optional. If there are any required fields in the response, the question arises if these fields should be returned in case they are not requested in the Wish List; The implementation in provider service layers of the Wish List is expensive - sometimes these costs are simply too high and is there no business case to justify the investment. Some other sources that mention the Wish List pattern: “Zalando RESTful API and Event Guidelines”, http://opensource.zalando.com/restful-api-guidelines/#157 “REST API Design Rule Book” by Masse (2011), p74: “The fields query parameter allows clients to request only the resource state information that it deems relevant for its particular use case. The REST API must parse the request’s query parameter’s inclusion list and return a partial response”. More comments about the pattern can be found on Linked In. Pagination Known Uses Dutch governmental and Dutch Energy APIs make widely use of the page-based pagination variant. See for instance Section 14 of “API Designrules Extensions”. Nordic API distinguishes five types of pagination methods, see “Everything You Need to Know About API Pagination”. Discussion Input and Recommended Reading We see a current tendency in the industry to favor the use of the cursor-paged pagination variant. Examples include (just to mention a few): Slack: https://slack.engineering/evolving-api-pagination-at-slack/ Zalando: http://opensource.zalando.com/restful-api-guidelines/#160 In the Dutch Energy sector we are analyzing this tendency. The pattern was discussed rather intensively in week 2 of our “API Design Pattern of the Week” series on Linked In. A very tricky pattern, each variant has its pros and cons and there is no ‘one-size-fits-all solution’. Real-time data and large datasets?: cursor-based pagination… Optimal DX and static data?: offset-based pagination…, just to mention a few. More decision drivers and design concerns in the book. Error Report Known Uses RFC7807 is adopted by Dutch governmental API design rules, see Section 17 of “API Designrules Extensions”; Same in the Dutch Energy sector, which declared the RFC7807 members type, title and status as required; Zalando http://opensource.zalando.com/restful-api-guidelines/#176 propose relative URI references in type field; Swedbank pay https://developer.swedbankpay.com/introduction.html#problems. Discussion Input and Recommended Reading Discussion points: Should error handling include all possible errors or should it simply stop processing after the first error? The second scenario is how most APIs currently work since it less implementation effort. In case of Request Bundle (p292 of the book) first scenario is advisory; In the book (p290) it is stated: “Timestamps are another common information in Error Reports too”. Good point! However timestamp is not a member of RFC 7807 and seems to be absent in other alternative error response formats; Error reports should enable the receiver to be self-serviced. A talk given by Asbjørn Ulsberg is on this: https://www.youtube.com/watch?v=ZWIUn5BHDBc. Also see comments on the pattern on Linked In. Feel free to join the discussion! API Key I think the pattern is very well explained in the book. Known Uses The Section 3.5 in “API Designrules Extensions” details the authentication and authorization protocol in the Dutch governmental sector (in English). Discussion Input In the case of authentication/authorization errors, the details of the error report should be carefully considered and minimized not to unveil any provider-side implementation security and privacy details. So the pattern API Key requires special implementation of Error Report; in that case, an API Key impacts the contents and message representation design of Error Report. This is all very well explained in the book, and it is also well-stated that an API Key is a “lightweight alternative to a full-fledged authentication protocol.” Despite all the concerns and ‘weaknesses’ one can argue that API Keys are a way to identify your consumers and build client communities to announce new releases and improve the client developer experience. Processing Resource The notion of Processing Resource as an endpoint role offering an activity-oriented API endpoint automatically brings us to the discussion how to define transactions as (REST) resources in the URI endpoint of the HTTP API. Should the URL be verb-free? This is still a hot debate in the REST API design community (so is the discussion between REST vs RPC). Some will argue that using verbs in data-oriented API endpoints will enrich the semantics of the API, others see it as an anti-pattern. Further inspiration on this subject: https://tyk.io/blog/rest-never-crud/ by James Higginbotham. This valuable link is of course provided in the book (amongst many others)! Known Uses n/a Discussion Input and Recommended Reading The notion of activity-oriented API roles and processing resources endpoints is in the original literature very often associated with the controller resource archetype. Examples: RESTful Web Service Cookbook (Allamaraju 2010): In order to abstract complex business operations (including transactions), servers may need to employ controller resources to make changes to other resources (e.g. Recipe 2.6); REST API Design Rulebook (Massé 2012): A controller resource models a procedural concept. Controller resources are like executable functions, with parameters and return values; inputs and outputs; https://restfulapi.net/resource-naming/: Use verb to denote controller archetype; Informative link and resource that talk about RPC and REST (understanding the difference might help in understanding the Processing Resource pattern: https://nordicapis.com/whats-the-difference-between-rpc-and-rest/ Principles of Web API Design (Higginbotham 2021): Chapter 8 - and see an example of transaction approach in ‘Long-Running Transaction Support in REST’ (pages 135 to 136); With regard to the API endpoints must be verb-free debate it’s worthwhile to mention: Zalando: https://opensource.zalando.com/restful-api-guidelines/#141: keep URLS verb-free; Dutch government: https://publicatie.centrumvoorstandaarden.nl/api/adr/#operations: the imperative mood of a verb can be used, prefixed with an underscore _ to distinguish these resources from regular resources; Web API Design: The Missing Link (Apigee 2018): In URLs, nouns are good; verbs are bad; https://www.belgif.be/specification/rest/api-guide/#controller: controller usage in API guidelines Belgium government; https://youtu.be/k5S3qcCFDiQ?t=3008: Crafting business-oriented web APIs by Julien Topçu: Using verbs enrich the semantics of the API; This is of course a simple fragment of what is being offered by the web community, hopefully it adds some inspiration and ideas! Information Holder Resource Perhaps one of the most frequently used design patterns, especially in combination with Retrieval Operations Good to read that joint use of Processing Resource and Information Holder Resource is not recommended for microservices architectures (responsibility separation). And tagging the Information Holder Resource as one of the subtypes certainly adds semantics and expressiveness to the contract, establishing a ‘ubiquitous language’ used in API design… 👍 Known Uses As already stated in the book, this pattern is widely used in may public Web APIs. Known uses: https://data.overheid.nl/en (Dutch open Government data) and API example: https://developer.overheid.nl/detail/kvk-ondernemersplein/production/specification Dutch Statistics via the Dutch government developer portal: https://developer.overheid.nl/apis/cbs-cijfers The Association of Netherlands Municipalities: https://developer.overheid.nl/apis?organisatie=28110850&type=rest_json Dutch Energy sector: Mijn Aansluiting (“My Energy Connection Point”) offers an online platform offering functionalities for contractors and energy partners (grid operators and energy suppliers) on which they can communicate on the administration and maintenance of energy connection points. The APIs are available here: https://wiki.dsplatform.nl/index.php/API There are many other known uses of this pattern, so above links just mentions a few. It’s a typical pattern used in governmental APIs. Data Transfer Resource Known Uses In the Dutch Energy sector we have EDSN (Energy Data Services Netherlands) as central data platform for market-facilitating. Cooperation and communication between market parties (suppliers, grid operators, metering companies) is facilitated via the central infrastructure of EDSN. There are use cases in which central data needs to be shared from the source with the decentral market party sinks (for instance for reporting purposes). This is achieved via de Data Transfer Resource Pattern, technically implemented by the S3 cloud storage protocol (the so-called S3 buckets). Such cloud storage is a technique that allows for the exchange of large data sets, low implementation costs, availability, durability, scalability, decoupling and it has a broad adoption in the industry (most parties are capable of connecting to cloud storage). The pattern variant currently in place is Relay Resource: Every market party sink has a unique bucket where only the required semi-finished data products are delivered to. Housekeeping rules (like retention periods) are mutually agreed upon, and based on business processes. Replay and deletion are responsibilities of the data sink. The shared resource address is agreed upon in advance. Future plans are to optimize the process and to use push notifications (event driven) to inform clients proactively in order to enable faster processing of data and discoverability (which links nicely to the Link Lookup Resource Pattern as described in the book 😊!) Further known uses from public cloud providers are: Amazon S3 REST API: https://docs.aws.amazon.com/AmazonS3/latest/API/Welcome.html Google Transfer API: https://cloud.google.com/storage-transfer/docs/reference/rest There are many other Cloud Storage services: OneDrive, SharePoint, Azure, etc. Discussion Input There are of course security and privacy risks when enterprises store and share files via a Web-flavored shared repository (like in the cloud). However, there are ways to avoid these risks, and the advantage of having all your data in one convenient place that can be accessed at any time from any place is worth investigating as long as the implementation is compliant with government regulations, security and privacy rules, and other legal obligations. State Transition Operation Known Uses In the Dutch Energy sector, the State Transition Operation pattern is commonly used in workflow management implementations that assign work tasks to contractors involved in the operational maintenance of the energy infrastructure network. Another known use is the sector-wide customer support ticket management platform. In this scenario, the API operations manage state in the ticket lifecycle algorithm. Discussion Input It’s good to distinguish between the terms “State Transition” and “State Transfer”. The “State Transition Operation” pattern takes state as input and modifies the provider-side application state, whereas “State Transfer Operation” does require state input in order to modify the state. To put the different terms in the functional notation as used in the book: State Transition Operation: (in, S) -> (out, S') State Transfer Operation: in -> (out, S') “State Transition” corresponds nicely to Command Message in the Enterprise Integration Patterns by Gregor Hohpe and Bobby Woolf: messages with the intent to change the state of the system. They are actions to be performed that have side effects. “State Transfer” corresponds to Event Messages: events are things that have happened within a system. They are the result (not in the method/return sense) of an executed command. Consider in this context the term “Event Carried State Transfer”. In the book, “State Transfer Operation” is not used, but the term “State Creation Operation” is used instead. This is all explained in the “Notes from The Architecture and Modeling Learning Event”; we found the mapping of these terms to EIP very useful. There was an interesting discussion on LinkedIn on the functional notation used in the book for the different operation responsibilities. How would a delete operation (do) be notated? Since it does affect the state and it is a variant of State Transition Operation (sto) it would advisable to use the same notation as for sto: do: (in, S) -> (out, S') However, what’s the added value of sending a response back when deleting? in HTTP APIs, one of the commonly used status codes reporting a successful deletion is a ‘204’ — which stands for: ‘No Content’ — which means ‘no response payload’ and since delete affects the state, perhaps the following notation would help for expressing the delete operation (do): do: (in, S) -> S' Metadata Element Known Uses The Metadata Element pattern is widely used in both Dutch government APIs and Dutch Energy sector APIs. HTTP header parameters like X-Request-ID, X-Correlation-ID and ETag (to mention a few) are applied very often. In the Energy sector, we have introduced additional custom headers: X-Object-ID (response): alternative to the header Location in case a complete URL"
