full_description = "Three weeks ago our book was finally published. We have taken this as an opportunity to relaunch this Website under a new name: welcome to “Patterns for API Design”! We restructured the site to match the book organization of the patterns. The menu at the top right takes you to a book landing page, to a quickstart/resources pages that collects supplemental material (such as presentations and articles), to online tutorials, to entry points into our pattern language (such as pattern filter by scope and desired quality) and to author information. Note that the graphical solution sketches are not those from the book (which of course are much nicer), but preliminary versions we provided on this Website (and our EuroPLoP papers) already. The feedback we have received so far has been extremely gratifying. For example, see these LinkedIn posts by Vaughn Vernon and Gregor Hohpe. Find the book and sample content at Pearson InformIT."
