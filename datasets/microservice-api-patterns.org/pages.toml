["https://microservice-api-patterns.org/2021/06/11/wjax-context-representation.html"]
title = "Context Representation pattern released, MAP at (W-)JAX"
full_description = "With today’s release of the Context Representation pattern, our structure category is now almost complete. The pattern provides answers on how API consumers and providers can exchange context information. “Easy”, you might say, “just use what the protocol offers to transmit that data, for example, HTTP headers”. But what do you do when multiple protocols are involved? In a previous news item, we shared that MAP co-author Daniel Lübke presented our patterns at JAX 2021. The slides are now available for download. If you rather want to see Daniel live, the next chance is at W-JAX 2021 where he will show how to “Apply Microservice API Patterns Step by Step” (note that JAX and W-JAX are German-speaking conferences, but the slides are in English)."
