full_description = "News (November 2022): Our book “Patterns for API Design: Simplifying Integration with Loosely Coupled Message Exchanges” provides decision narratives in its Chapter 3 (the book table of contents is here). These narratives serve as a large-scale tutorial for pattern application. Tutorial 0: Orientation and Single Pattern This tutorial is the “Hello World” of API design with MAP. It introduces you to the website organization and a first pattern, Pagination. Time estimate: 20-25 minutes. Let’s jump right in! Tutorial 1: API Quality In this tutorial, you learn about quality-related patterns for API management and governance and apply patterns that help to choose request and response message sizes. Time estimate: 45 minutes. Get started! Tutorial 2: All Categories In “A Complete Guide through MAP “, you apply our patterns to design and improve an API in a realistic sample system landscape in five steps: identification, responsibility, structure, quality, and evolution. Time estimate: 60 to 90 minutes. Here we go!"
