title = "ISAQB 2024 - Enabling DevOps and Team Topologies Through Architecture: Architecting for Fast Flow"
full_description = "Explore DDD workshop, April 14-15, 2025, Denver - Designing microservices: responsibilities, APIs and collaborations. Early bird discount ends March 7th. Learn more and enroll. This is the presentation that I gave at the excellent ISAQB 2024 Software Architecture Gathering conference. In order to thrive in today’s volatile and uncertain world, businesses needs to innovate at a much faster pace. Recognizing this, IT organizations are adopting the principles and practices of DevOps and the organizational patterns defined by Team Topologies. But while DevOps and Team topologies are vital for delivering the fast flow of changes that today’s businesses need, they are insufficient. To prevent applications from becoming obstacles to rapid change, IT must also create architectures that support fast flow. In this presentation, I describe a collection of architectural patterns that enable DevOps and Team Topologies to deliver a fast flow of changes. You will learn about how to decide between the monolithic and microservice architecture. I’ll discuss patterns for designing a monolithic architecture that minimize the various kinds of coupling that inhibit fast flow. You will learn how to design an architecture that enables your organization to thrive in today’s uncertain world. Microservices.io is brought to you by Chris Richardson. Experienced software architect, author of POJOs in Action, the creator of the original CloudFoundry.com, and the author of Microservices patterns. Chris teaches comprehensive workshops for architects and developers that will enable your organization use microservices effectively. Avoid the pitfalls of adopting microservices and learn essential topics, such as service decomposition and design and how to refactor a monolith to microservices. Assess your application's microservice architecture and identify what needs to be improved. Engage Chris to conduct an architect review. My virtual bootcamp, distributed data patterns in a micr