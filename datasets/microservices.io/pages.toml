["https://microservices.io/post/architecture/2023/11/13/how-modular-can-your-monolith-go-part-6-transactional-commands.html"]
title = "How modular can your monolith go? Part 6 - transaction management for commands"
full_description = "Explore DDD workshop, April 14-15, 2025, Denver - Designing microservices: responsibilities, APIs and collaborations. Early bird discount ends March 7th. Learn more and enroll. In previous articles in this series, I glossed over the issue of transaction management. I simply assumed that each operation (e.g. request) was implemented as a single transaction. For example, the system command createOrder(), which is triggered by an HTTP POST /orders request, would be implemented as a single transaction that creates an Order, updates a Customer to reserve credit, and sends an email to the Customer. In this article, I dig deeper into the topic of transaction management in a modular monolith. I’ll talk about transaction management when implementing system commands that update multiple domains. I’ll cover three different transaction management strategies: System operations need to have ACID-style semantics. Specifically, system commands must have the following characteristics: Atomic - all of the updates performed by an operation need to be committed or none of them should be. Partial updates would leave the system in an inconsistent state. Isolated - the outcome of executing multiple operations concurrently (e.g. opA() and opB() ) needs to be the same as if they were executed serially (e.g. either opA() -> opB() or opB() -> opA()). If an operation doesn’t have these properties then it’s likely to be buggy. For example, if createOrder() did not create Order and update a Customer to reserve credit, then the database would be left in an inconsistent state. The simplest solution is to use a relational database and implement each operation as a single ACID transaction. While there are some subtle issues around transaction isolation levels (real world databases don’t implement textbook ACID transactions), this approach is generally simple and easy to implement. The database will ensure that the operations are atomic and isolated (as well as consistent and durable). The ability to use ACID transactions is one of the key benefits of monolithic architecture. For example, you can simply use the @Transactional annotation in a Spring Boot application to make every operation transactional."
year_published = 2025
clearnet = "https://microservices.io/post/architecture/2023/11/13/how-modular-can-your-monolith-go-part-6-transactional-commands.html"
