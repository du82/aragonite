["https://microservices.io/post/architecture/2023/07/31/how-modular-can-your-monolith-go-part-1.html"]
title = "How modular can your monolith go? Part 1 - the basics"
full_description = "Explore DDD workshop, April 14-15, 2025, Denver - Designing microservices: responsibilities, APIs and collaborations. Early bird discount ends March 7th. Learn more and enroll. The first rule of migrating to microservices is don’t. Instead, you should make the most of your monolith. Even though a large monolith might not resolve the dark matter energy, especially multiple technology stacks, the monolithic architecture not an anti-pattern. A key question is, therefore, what’s the most effective way of structuring your monolith? Over the years, I’ve started development of many monolithic application by doing the equivalent of: This works well for small applications but as the number of developers grows it becomes increasingly problematic. The trouble technically-oriented architecture is that it doesn’t mirror the structure of the application’s development organization. A large development organization should be structured as collection of small, cross-functional teams (ie. Team topology’s stream aligned teams), each of which is responsible for a particular business (sub)domain. For example, let’s imagine that the FTGO application consists of three teams/domains: Each subdomain consists of web, domain and persistence logic. But since the monolith is structured around the technical layers, the code for each subdomain is scattered across the technical layers. For example, the persistence module would contain classes such as CustomerRepository, and OrderRepository. Similarly, the domain module would contain classes such as Customer, and Order. Finally, the web module would contain classes such as CustomerController, and OrderController. As a result, teams are forced to work across the technical layers, which can be a source of friction that reduces productivity. Moreover, it’s likely that this way of structuring the monolith will result is a slow deployment pipeline, since a change to a class belonging to one subdomain, e.g OrderRepository will require classes belonging to other subdomains to be tested as well."
