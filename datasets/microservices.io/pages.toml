full_description = "Explore DDD workshop, April 14-15, 2025, Denver - Designing microservices: responsibilities, APIs and collaborations. Early bird discount ends March 7th. Learn more and enroll. In a previous post, I described the Microservices are a magic pixie dust anti-pattern. Another anti-pattern that I’ve observed is an organization making the adoption of microservices the goal. An executive might, for example, announce a microservices transformation initiative and expect every development team to “do microservices”. Development teams then scramble to “do microservices”. Perhaps, a team’s annual or quarterly bonus is affected by how well they “do microservices”. In an extreme case, it might be depend on how many microservices they have deployed. On the one hand, adopting microservices is a major undertaking and high-level support is essential. But on the other hand, the problem with making microservices the goal is that it ignores other obstacles to rapid, frequent and reliable software delivery including: An organization that suffers from these problems might not benefit from adopting microservices. It might even make things worse. Also, requiring a team to adoption microservices, risk imposing an architecture on a development team even when it does not make sense for their application. A much better goal is to increase the velocity, frequency and reliability of software delivery. Specific, there are four key metrics to track and improve: Each application development team is then responsible for improving these metrics for their application. Sometimes the microservice architecture plays a key role in improving this metrics. But there are other things that can be done to improve these metrics. For example, Microservices.io is brought to you by Chris Richardson. Experienced software architect, author of POJOs in Action, the creator of the original CloudFoundry.com, and the author of Microservices patterns. Chris teaches comprehensive workshops for architects 