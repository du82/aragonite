["https://microservices.io/post/antipatterns/2019/04/30/antipattern-focus-on-technology.html"]
title = "Microservices adoption anti-pattern: Focussing on technology"
full_description = "Explore DDD workshop, April 14-15, 2025, Denver - Designing microservices: responsibilities, APIs and collaborations. Early bird discount ends March 7th. Learn more and enroll. Another anti-pattern that I’ve observed is Focussing on Technology. It occurs when an organization focusses on technology aspects of microservices, most commonly the deployment infrastructure. Unfortunately, focussing on the technology stack is an easy trap to fall into. There are, after all, lots of seriously cool technologies. Kubernetes, Istio and Serverless to name just a few. In addition, there are vendors desperately wanting you to buy their products. If you are a technology VP, spending a lot of money on a vendor’s technology is guaranteed to impress your less technical fellow executives. One problem with focussing on technology is that it’s undifferentiated heavy lifting. On the one hand, you need put together a technology stack that enables you to deploy services rapidly, frequently, and reliably. But on the other hand, having a good technology stack is not a competitive advantage. It’s far more important to correctly define your services and their APIs. Another problem with focussing on technology is that it can result in the organization making a big upfront investment in a vendor’s product. The problem with buying a $$$ product early on is that the organization chooses the product when it has the least amount of experience with microservices. There is a risk that the organization chooses a product based on marketing (perhaps targeted at the C-suite) rather than solid technical experience. Rather than focussing on technology, a better approach is for the organization to focus on the essence of microservices: service decomposition and definition. It should build just enough infrastructure to support what will initially be just a few services. Later, as the number of services grows and the organization becomes more experienced, it can make much more informed decisions about the technology stack."
year_published = 2025
clearnet = "https://microservices.io/post/antipatterns/2019/04/30/antipattern-focus-on-technology.html"
