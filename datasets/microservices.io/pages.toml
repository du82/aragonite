full_description = "Explore DDD workshop, April 14-15, 2025, Denver - Designing microservices: responsibilities, APIs and collaborations. Early bird discount ends March 7th. Learn more and enroll. This is another article in the series about microservices rules: what good looks like, which are a set of principles and practices for using microservices effectively. The other articles about microservices rules are: This article explores yet another way to achieve Microservices Rule #10: Make smaller, safer, and reversible changes. Work items flow into a team in four main forms: features, defects, risks, and technical debt. Previous articles on Rule #10 focused on implementing and delivering work items incrementally. However, another effective approach is to reduce the size of the work item itself — specifically, implement smaller features, or in other words, define and deliver smaller user stories. This article explores how defining and delivering smaller user stories accelerates learning and experimentation — essential ingredients for building a great product. Microservices.io is brought to you by Chris Richardson. Experienced software architect, author of POJOs in Action, the creator of the original CloudFoundry.com, and the author of Microservices patterns. Chris teaches comprehensive workshops for architects and developers that will enable your organization use microservices effectively. Avoid the pitfalls of adopting microservices and learn essential topics, such as service decomposition and design and how to refactor a monolith to microservices. Assess your application's microservice architecture and identify what needs to be improved. Engage Chris to conduct an architect review. My virtual bootcamp, distributed data patterns in a microservice architecture, is now open for enrollment! It consists of video lectures, code labs, and a weekly ask-me-anything video conference repeated in multiple timezones. The regular price is $395/person but use coupon NTOQTWTO to si