["https://microservices.io/post/architecture/2023/02/07/evolving-microservices.html"]
title = "Evolving a microservice architecture using dark energy and dark matter forces"
full_description = "Explore DDD workshop, April 14-15, 2025, Denver - Designing microservices: responsibilities, APIs and collaborations. Early bird discount ends March 7th. Learn more and enroll. Let’s imagine that you are developing a microservices-based application and you need to implement a major new feature. For example, your application consists of two services - Order Service and Customer Service - and you want to implement Coupon Management: You might automatically implement Coupon Management as a new Coupon Service. After all your application has a MICROservice architecture, which means lots of services, right? The trouble, however, with blindly adding new services, is that it often leads to the More the Merrier anti-pattern. An overly complex architecture that’s difficult to maintain and, perhaps, brittle. Rather than blindly adding new services, a much better approach is brainstorm various possible designs and evaluate them using the dark energy and dark matter forces. For example, there are three possible ways to implement Coupon Management: Each of these three options has different trade-offs with respect to the dark energy and dark matter forces. A standalone Coupon Service might improve team autonomy but it makes the createOrder() operation, which redeems coupons more complex. Alternatively, implementing Coupon Management within the Order Service simplifies createOrder() but might reduce team autonomy. It’s your job as the architect to evaluate and compare the designs and pick the best (or least-worst) one. To learn more, take a look at this presentation that I gave in January 2023 at the Melbourne Platform Engineering meetup. Microservices.io is brought to you by Chris Richardson. Experienced software architect, author of POJOs in Action, the creator of the original CloudFoundry.com, and the author of Microservices patterns. Chris teaches comprehensive workshops for architects and developers that will enable your organization use microservices effectively. Avoid the pitfalls of adopting microservices and learn essential topics, such as service decomposition and design and how to refactor a monolith to microservices."
