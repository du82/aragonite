full_description = "Explore DDD workshop, April 14-15, 2025, Denver - Designing microservices: responsibilities, APIs and collaborations. Early bird discount ends March 7th. Learn more and enroll. I recently needed to write some scripts to automate some updates to Microservices.IO. I normally write scripts in Python (or perhaps bash, if they simple) since it’s easy to use and has lots of handy libraries. But this time I decided to try JBang, which is a tool that let’s you write scripts in Java. The scripts, which process Markdown files, mainly used classes from java.nio.file.* and java.util.regex.*. However, one script generated Markdown files using Thymeleaf templates. It was remarkably easy to add the Thymeleaf dependency using the DEPS directive: JBang makes it easy to write scripts using Java, which is statically typed and has sophisticated IDEs. But before feeling entirely comfortable with using JBang instead of Python, there are a couple of things I to do: Investigate how to edit JBang scripts that consist of multiple files - so far I’ve the scripts have inner classes, which are not reusable. Track down and evaluate the Java equivalents of Python libraries such as colorama, GitPython, argparse. Microservices.io is brought to you by Chris Richardson. Experienced software architect, author of POJOs in Action, the creator of the original CloudFoundry.com, and the author of Microservices patterns. Chris teaches comprehensive workshops for architects and developers that will enable your organization use microservices effectively. Avoid the pitfalls of adopting microservices and learn essential topics, such as service decomposition and design and how to refactor a monolith to microservices. Assess your application's microservice architecture and identify what needs to be improved. Engage Chris to conduct an architect review. My virtual bootcamp, distributed data patterns in a microservice architecture, is now open for enrollment! It consists of video lectures, code 