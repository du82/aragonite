["https://microservices.io/post/architecture/2023/10/30/how-modular-can-your-monolith-go-part-5-domain-observers.html"]
title = "How modular can your monolith go? Part 5 - decoupling domains with the Observer pattern"
full_description = "Explore DDD workshop, April 14-15, 2025, Denver - Designing microservices: responsibilities, APIs and collaborations. Early bird discount ends March 7th. Learn more and enroll. In previous articles, I described how a domain’s API should consist of one or more narrowly-scoped interfaces, a.k.a. facades, that encapsulate its implementation. A domain’s client can invoke the domain by calling a facade’s methods. For example, the Order Management domain can reserve credit by invoking CreditManagement.reserveCredit(), which is implemented by the Customer Management domain. Similarly, the Customer Management domain can send a welcome email to a newly registered customer by invoking NotificationService.sendEmail(), which is implemented by the Notification Management domain. But let’s imagine that sending an email is not the only post-registration action that Customer Management needs to implement. It might, for example, need to register the customer with the CRM system. Customer Management could simply invoke CRMIntegration.registerNewCustomer() directly. The drawback, however, is that each action adds another dependency of Customer Management, which is yet another reason for it to change. In this article, I look at an alternative approach to API design that potentially minimizes the risk of tight-coupling: the Observer pattern. Even though dependencies, or more specifically design-time dependencies, are unavoidable, it’s usually a good idea to minimize them. A software element (class, package, domain, …) often needs to collaborate with others in order to fullfil its responsibilities. The problem, however, is that each dependency is a potential reason to change. Even if each dependency has a stable API, the risk of a lock change is proportional to the number of dependencies. It’s therefore a worthwhile design goal to minimize the number of dependencies. This is especially true if those dependencies are unrelated to the software element’s core responsibilities. For example, the Customer Management domain’s core responsibility is managing customers. Responsibilities such as sending emails and synchronizing with the CRM system are somewhat secondary."
year_published = 2025
