["https://microservices.io/articles/glossary.html"]
title = "Microservice Architecture Glossary"
full_description = "A component is a software unit that is executable or deployable. For example, a Java WAR file or executable JAR file; or an operating system executable. Developed by the authors of Accelerate, the DORA metrics measure the performance of a software development teams: The DORA DevOps Quick Check is a simple five question assessment of how well you are delivering software. A variant of the monolithic architecture that is organized around subdomains (e.g. business capabilities) rather than technical layers (e.g. presentation, business logic, persistence). An architectural style that structures the application as a single executable/deployable component. See the Monolithic architecture pattern for more details. An architectural style that structures at application as set of loosely coupled, independently deployable components (a.k.a. services). See the Microservice architecture pattern for more details. An operation is an invocable behavior of a service. There are two types of operations: commands and queries. An operation can be invoked by a service client either synchronously or asynchronously. It might also be invoked by the passing of time, e.g. to implement a batch job. A system operation is an invocable behavior of the application. There are two types of operations: commands and queries. An operation is invoked by an application client - human via UI, or an external application - either synchronously or asynchronously. It might also be invoked by the passing of time, e.g. a batch job that is executed periodically. In a microservice architecture, a system operation is either local or distributed. A local operation is implemented by a single service. A distributed operation is implemented by multiple collaborating services. Microservices.io is brought to you by Chris Richardson. Experienced software architect, author of POJOs in Action, the creator of the original CloudFoundry.com, and the author of Microservices patterns. Chris teaches comprehensive workshops for architects and developers that will enable your organization use microservices effectively."
