title = "Testing microservices (Work in progress)"
full_description = "Chapters 9 and 10 of my book describe how to write automated tests for microservices-based applications. The primary goal of the microservice architecture is to enable the rapid, reliable delivery of software using DevOps. One of the pillars of DevOPs is automated testing. Yet many organizations attempt to adopt microservices while still doing manual testing. What’s more, the microservice architecture has its own distinctive automated testing challenges. In this presentation, I describe how to descend the test pyramid and replace slow, brittle end-to-end tests with faster, more reliable tests for individual services. You will learn how to write tests that ensure service APIs evolve while preserving backwards compatibility. I describe how by running these tests in a deployment pipeline you will fully benefit from microservices. Microservices.io is brought to you by Chris Richardson. Experienced software architect, author of POJOs in Action, the creator of the original CloudFoundry.com, and the author of Microservices patterns. Chris teaches comprehensive workshops for architects and developers that will enable your organization use microservices effectively. Avoid the pitfalls of adopting microservices and learn essential topics, such as service decomposition and design and how to refactor a monolith to microservices. Assess your application's microservice architecture and identify what needs to be improved. Engage Chris to conduct an architect review. My virtual bootcamp, distributed data patterns in a microservice architecture, is now open for enrollment! It consists of video lectures, code labs, and a weekly ask-me-anything video conference repeated in multiple timezones. The regular price is $395/person but use coupon NTOQTWTO to sign up for $95 (valid until February 17th, 2025). There are deeper discounts for buying multiple seats. Take a look at my Manning LiveProject that teaches you how to develop a service template and microservice chassi