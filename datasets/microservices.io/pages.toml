["https://microservices.io/articles/dark-energy-dark-matter/dark-matter/simple-interactions.html"]
title = "Dark matter force: simple interactions"
full_description = "Explore DDD workshop, April 14-15, 2025, Denver - Designing microservices: responsibilities, APIs and collaborations. Early bird discount ends March 7th. Learn more and enroll. An operation’s complexity is proportional to the number of components that collaborate to implement it and the number of messages they exchange. Let’s look at why simple interactions are important and how minimizing their complexity is an attractive force between subdomains. Ideally, an operation should be local to a single service. That’s because a local operation is easier to understand and troubleshoot. If an operation fails, you know exactly which service is responsible. You only need to look in the logs of that service. The knowledge about that service often belongs to a single team. However, it’s not always possible to create a microservice architecture where all operations are local. It would require each operation’s subdomains to be packaged as a single service, which might only be achieved by a monolith. As a result, some operations will be distributed across multiple services. Each distributed operation is implemented by multiple collaborating services. When designing a microservice architecture, you should strive to group the subdomains so that the critical operations are as simple as possible. For example, business critical operations that need to be highly available should either be local to a single service or be distributed across as few services as possible in order to minimize the amount of time it takes to troubleshoot a failure. Microservices.io is brought to you by Chris Richardson. Experienced software architect, author of POJOs in Action, the creator of the original CloudFoundry.com, and the author of Microservices patterns. Chris teaches comprehensive workshops for architects and developers that will enable your organization use microservices effectively. Avoid the pitfalls of adopting microservices and learn essential topics, such as service decomposition and design and how to refactor a monolith to microservices."
