title = "Assemblage overview: Part 1 - Defining system operations"
full_description = "Explore DDD workshop, April 14-15, 2025, Denver - Designing microservices: responsibilities, APIs and collaborations. Early bird discount ends March 7th. Learn more and enroll. The first step of the Assemblage architecture design process distills the requirements into a set of system operations. A system operation is an externally invokable behavior implemented by the application. It reads and/or writes one or more business entities, a.k.a. DDD aggregates, such as Customer and Order. A system operation has a parameters, and an operational return value and can be thought of as a method implemented by the application. Collectively, the system operations model the application’s black box behavior. A system operation is invoked by an external actor, such as users, other applications, or schedulers. For example, an e-commerce application would typically implement user invoked system operations such as createCustomer(), createOrder(), cancelOrder() and findOrderHistory(). It might also implement system operations that are invoked by other applications, such as Stripe or Twilio., A system operation is technology independent. However, the actual implementation of the operation is invoked using some combination of technologies including: System operations rather than data, which is the typical enterprise approach to design, are central to the architecture definition process. They are the unit of design and evaluation. The third step of the Assemblage process designs each system operation in turn to incrementally create the service architecture. Also, four of the five dark matter forces, which are used to evaluate each decision decision, are concerned with the design of operations. In the next article, I describe how to define subdomains, which are the building blocks for services and contain the entities acted upon by the system operations. Microservices.io is brought to you by Chris Richardson. Experienced software architect, author of POJOs in Action, the creator of the original CloudFoundry.com, and the author of Microservices patterns."
