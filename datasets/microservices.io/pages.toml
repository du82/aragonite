title = "What are microservices?"
description = "Microservices - also known as the microservice architecture - is an architectural style that structures an application as a collection of loosely coupled services, which implement business capabilities. The microservice architecture enables the continuous delivery/deployment of large, complex applications. It also enables an organization to evolve its technology stack."
full_description = "Explore DDD workshop, April 14-15, 2025, Denver - Designing microservices: responsibilities, APIs and collaborations. Early bird discount ends March 7th. Learn more and enroll. Microservices - also known as the microservice architecture - is an architectural style that structures an application as a collection of two or more services that are: Services are typically organized around business capabilities. Each service is often owned by a single, small team. For a business to thrive in today’s volatile, uncertain, complex and ambiguous world, IT must deliver that software rapidly, frequently and reliably. If you get it wrong you risk creating a distributed monolith, which will slow down software delivery. Assemblage is an architecture definition process for grouping subdomains/bounded contexts into services. Dark energy forces encourage decomposition into smaller services. Dark matter forces resist decomposition. The microservices pattern language is your guide when designing an architecture: service collaboration, testing, deployment, common crosscutting concerns and more. It’s a collection of patterns that help you make decisions when designing and evolving an architecture. The monolithic architecture is not an anti-pattern. It’s a good choice for small teams and small projects. But if you outgrow your monolithic architecture, you need to refactor it to services using the Strangler Fig pattern. Cynefin · DDD · GitOps · Microservices adoption · TODO · ancient lore · anti-patterns · api gateway · application api · application architecture · architecting · architecture · architecture documentation · assemblage · automation · beer · books · build vs buy · containers · culture · dark energy and dark matter · decision making · deliberative design · deployment · deployment pipeline · design-time coupling · developer experience · development · devops · docker · eventuate platform · fast flow · generative AI · glossary · health · hexagonal architecture ·