["https://microservices.io/articles/dark-energy-dark-matter/dark-matter/minimize-design-time-coupling.html"]
title = "Dark matter force: minimize design-time coupling"
full_description = "Explore DDD workshop, April 14-15, 2025, Denver - Designing microservices: responsibilities, APIs and collaborations. Early bird discount ends March 7th. Learn more and enroll. When designing software it’s important to minimize design-time coupling between software elements, regardless of whether classes, packages, subdomains or services. The degree of design-time coupling between a pair of software elements is the likelihood that they need to change together for the same reason. Design-time coupling between services in a microservice architecture is especially problematic. Let’s look at why it’s a problem, how we can minimize it and why it’s an attractive force between subdomains. If two services are loosely coupled, then a change to one service rarely requires a change to the other service. However, if two services are tightly coupled, then a change to one service often requires a change to the other service. These types of lockstep changes are expensive since it typically involves breaking API changes. For example, let’s imagine that the Order Service and Customer Service are tightly coupled. Each time a breaking changes needs to be made to the Customer Service the sequence of steps is as follows: What’s even worse, is that quite often the services are owned by different teams, which requires those teams to coordinate the changes. In other words, design-time coupling between services undermines team autonomy. The first is to design subdomains to be loosely coupled. Loosely coupled subdomains can be packaged as different services. Loose design-time coupling is usually achieved by each subdomain having a stable API that encapsulates its implementation. In general, to reduce design-time coupling, software elements, such as subdomains and services, should expose the minimum amount of information to their clients. For example, I like to use the Iceberg metaphor to describe a software element. Similarly, John Ousterhout in his book A Philosophy of Software Design describes how modules should be deep rather than shallow."
year_published = 2025
