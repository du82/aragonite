["https://microservices.io/post/antipatterns/2019/04/09/antipattern-flying-before-walking.html"]
title = "Microservices adoption anti-pattern: Trying to fly before you can walk"
full_description = "Explore DDD workshop, April 14-15, 2025, Denver - Designing microservices: responsibilities, APIs and collaborations. Early bird discount ends March 7th. Learn more and enroll. Another anti-pattern that I’ve observed is Trying to fly before you can walk. It occurs when an organization attempts to adopt the microservice architecture (an advanced technique) without (or not committing to) practicing basic software development techniques, such as clean code, good design, and automated testing. Quite often, management continues to be focussed on schedule and features and consequently overlooks key software quality attributes, such as maintainability, testability and code coverage. Trying to adopt microservices without practicing the basics of software development is likely to lead to disappointment. The microservice architecture requires good design skills and test automation. A badly designed microservice architecture that lacks automated tests is likely to be worse than a monolith. Moreover, messy code will reduce your ability to deliver software rapidly and frequently. Design skills - such as object-oriented design (OOD) or Domain-driven design (DDD). Services must have stable, well-designed APIs. Also, in order to avoid creating a distributed monolith, which requires numerous services to be changed in lockstep, developers need to have the design skills to carefully define service boundaries and responsibilities. Microservices.io is brought to you by Chris Richardson. Experienced software architect, author of POJOs in Action, the creator of the original CloudFoundry.com, and the author of Microservices patterns. Chris teaches comprehensive workshops for architects and developers that will enable your organization use microservices effectively. Avoid the pitfalls of adopting microservices and learn essential topics, such as service decomposition and design and how to refactor a monolith to microservices. Assess your application's microservice architecture and identify what needs to be improved. Engage Chris to conduct an architect review."
