["https://microservices.io/post/architecture/2023/08/28/how-modular-can-your-monolith-go-part-3.html"]
title = "How modular can your monolith go? Part 3 - encapsulating a subdomain behind a facade"
full_description = "Explore DDD workshop, April 14-15, 2025, Denver - Designing microservices: responsibilities, APIs and collaborations. Early bird discount ends March 7th. Learn more and enroll. In part 2, I described a design for a modular monolith where a subdomain’s API consists of its entities and repositories. While this simple approach had some benefits, it suffered from a lack of encapsulation and testability. In this article, I’ll describe an alternative approach where each subdomain exposes a coarse-grained, service-style API. In the design described by part 2, the customers domain’s API consisted of the Customer entity and the CustomerRepository. A key drawback of this design is that it results in tight design time coupling between the customers domain and the clients of its API, such as orders domains. It would be not be possible for the customers domain to use a different implementation of the Customer entity without coordinating with the orders domain. Another drawback of this design is that an API comprised of entities and repositories is difficult to mock, which makes it difficult to test the orders domain in isolation. An alternative API design, which reduces design-time coupling and improves testability, is to encapsulate the customers domain behind a facade - one of the classic GOF patterns. Here is a diagram showing the resulting design: As you can see, the customers domain is now encapsulated behind the CustomerService facade. The orders domain no longer has a direct dependency on the Customer entity or the CustomerRepository. In this design, the reserveCredit(), and releaseCredit() methods were added to the already existing CustomerService: The orders domain calls customerService.reserveCredit() and customerService.releaseCredit() to reserve and release credit. For example, here’s the OrderService.createOrder() method: In addition to calling CustomerService.reserveCredit(), it also calls customerService.getCustomerInfo() to get the customer’s email address."
