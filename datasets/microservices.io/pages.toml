["https://microservices.io/articles/microservices-rules/index.html"]
title = "About the microservices rules: what good looks like"
full_description = "Explore DDD workshop, April 14-15, 2025, Denver - Designing microservices: responsibilities, APIs and collaborations. Early bird discount ends March 7th. Learn more and enroll. The 11 microservices rules are a great checklist that engineering leaders can use to assess the state of their organization, its delivery practices and its application’s architecture and keep their migration to microservices on track. The microservice architecture has become increasingly popular over the past decade. Its key benefits include significantly improving the developer experience and accelerating software delivery. Sadly, however, microservices have often been widely misunderstood and used inappropriately. As a result, many organizations have struggled to benefit from their adoption. I’ve had numerous conversations where developers have complained that their new microservices-based applications are difficult to change. They have very quickly created an unmaintainable legacy application. To prevent this from happening, I’ve defined 11 development and architecture rules (a.k.a. best practices). 10. Big/risky change => smaller/safer and (ideally easily) reversible changes - part 1 - incremental architecture modernization, part 2 - continuous deployment, part 3 - canary releases, part 4 - incrementally migrating users, part 5 - smaller user stories You can learn more about these rules from this presentation Microservices rules: what good looks like - July 2024 edition. I’m available to help your organization improve agility and competitiveness through better software architecture: training workshops, architecture reviews, etc. Microservices.io is brought to you by Chris Richardson. Experienced software architect, author of POJOs in Action, the creator of the original CloudFoundry.com, and the author of Microservices patterns. Chris teaches comprehensive workshops for architects and developers that will enable your organization use microservices effectively. Avoid the pitfalls of adopting microservices and learn essential topics, such as service decomposition and design and how to refactor a monolith to microservices."
