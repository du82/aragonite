["https://microservices.io/patterns/apigateway.html"]
title = "Pattern: API Gateway / Backends for Frontends"
description = "An API gateway acts a single entry point into the application, routing and composing requests to services"
full_description = "Let’s imagine you are building an online store that uses the Microservice architecture pattern and that you are implementing the product details page. You need to develop multiple versions of the product details user interface: In addition, the online store must expose product details via a REST API for use by 3rd party applications. A product details UI can display a lot of information about a product. For example, the Amazon.com details page for POJOs in Action displays: Since the online store uses the Microservice architecture pattern the product details data is spread over multiple services. For example, Consequently, the code that displays the product details needs to fetch information from all of these services. The granularity of APIs provided by microservices is often different than what a client needs. Microservices typically provide fine-grained APIs, which means that clients need to interact with multiple services. For example, as described above, a client needing the details for a product needs to fetch data from numerous services. Different clients need different data. For example, the desktop browser version of a product details page desktop is typically more elaborate then the mobile version. Network performance is different for different types of clients. For example, a mobile network is typically much slower and has much higher latency than a non-mobile network. And, of course, any WAN is much slower than a LAN. This means that a native mobile client uses a network that has very difference performance characteristics than a LAN used by a server-side web application. The server-side web application can make multiple requests to backend services without impacting the user experience where as a mobile client can only make a few. Implement an API gateway that is the single entry point for all clients. The API gateway handles requests in one of two ways. Some requests are simply proxied/routed to the appropriate service. It handles other requests by fanning out to multiple services."
