["https://microservices.io/presentations/index.html"]
title = "Microservices presentations"
full_description = "Since early 2012, I’ve given numerous presentations on microservices and related topics. Here are a few of them. These presentations cover the following topics. In this presentation, I describe loose coupling and modularity and why they are is essential. You will learn about three architectural patterns: traditional monolith, modular monolith and microservices. I describe the benefits, drawbacks and issues of each pattern and how well it supports rapid, reliable, frequent and sustainable development. You will learn some heuristics for selecting the appropriate pattern for your application. In this presentation, which I gave at the O’Reilly Software Architecture Superstream: Software Architecture Patterns, I describe the microservices pattern language. I also describe how thinking with the pattern mindset - context/problem/forces/solution/consequences - leads to better technical decisions. In this presentation, I describe how dark energy and dark matter are excellent metaphors for the competing forces (a.k.a. concerns) that must be resolved by the microservices pattern language. You will learn that dark energy, which is an anti-gravity, is a metaphor for the repulsive forces that encourage decomposition into services. I describe how dark matter, which is an invisible matter that has a gravitational effect, is a metaphor for the attractive forces that resist decomposition and encourage the use of a monolithic architecture. You will learn how to use the dark energy and dark matter forces as guide when designing services and operations. I gave this presentation at QConplus 2021. It illustrates how to design loosely coupled services using the problem of ordering burritos. In this presentation, I describe how to design system operations that span services using microservice architecture collaboration patterns: Saga, Command-side replica, API composition, and CQRS patterns. I describe how each of these patterns resolve the dark energy and dark matter forces differently."
year_published = 2025
