["https://microservices.io/post/architecture/2022/11/29/yow-london.html"]
title = "Considering Migrating a Monolith to Microservices? A Dark Energy, Dark Matter Perspective"
full_description = "Explore DDD workshop, April 14-15, 2025, Denver - Designing microservices: responsibilities, APIs and collaborations. Early bird discount ends March 7th. Learn more and enroll. Let’s imagine that you are responsible for an aging monolithic application that’s critical to your business. Sadly, getting changes into production is a painful ordeal that regularly causes outages. And to make matters worse, the application’s technology stack is growing increasingly obsolete. Neither the business nor the developers are happy. You need to modernize your application and have read about the benefits of microservices. But is the microservice architecture a good choice for your application? In this presentation, I describe the dark energy and dark matter forces (a.k.a. concerns) that you must consider when deciding between the monolithic and microservice architectural styles. You will learn about how well each architectural style resolves each of these forces. I describe how to evaluate the relative importance of each of these forces to your application. You will learn how to use the results of this evaluation to decide whether to migrate to the microservice architecture. Microservices.io is brought to you by Chris Richardson. Experienced software architect, author of POJOs in Action, the creator of the original CloudFoundry.com, and the author of Microservices patterns. Chris teaches comprehensive workshops for architects and developers that will enable your organization use microservices effectively. Avoid the pitfalls of adopting microservices and learn essential topics, such as service decomposition and design and how to refactor a monolith to microservices. Assess your application's microservice architecture and identify what needs to be improved. Engage Chris to conduct an architect review. My virtual bootcamp, distributed data patterns in a microservice architecture, is now open for enrollment! It consists of video lectures, code labs, and a weekly ask-