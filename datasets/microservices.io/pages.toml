["https://microservices.io/patterns/self-registration.html"]
title = "Pattern: Self Registration"
full_description = "You have applied either the Client-side Service Discovery pattern or the Server-side Service Discovery pattern. Service instances must be registered with the service registry on startup so that they can be discovered and unregistered on shutdown. A service instance is responsible for registering itself with the service registry. On startup the service instance registers itself (host and IP address) with the service registry and makes itself available for discovery. The client must typically periodically renew its registration so that the registry knows it is still alive. On shutdown, the service instance unregisters itself from the service registry. The Microservices Example application is an example of an application that uses self-registration. It is written in Scala and uses Spring Boot and Spring Cloud as the Microservice chassis. The application uses the Eureka Service Registry, which is a Netflix OSS component. Microservices.io is brought to you by Chris Richardson. Experienced software architect, author of POJOs in Action, the creator of the original CloudFoundry.com, and the author of Microservices patterns. Chris teaches comprehensive workshops for architects and developers that will enable your organization use microservices effectively. Avoid the pitfalls of adopting microservices and learn essential topics, such as service decomposition and design and how to refactor a monolith to microservices. Assess your application's microservice architecture and identify what needs to be improved. Engage Chris to conduct an architect review. My virtual bootcamp, distributed data patterns in a microservice architecture, is now open for enrollment! It consists of video lectures, code labs, and a weekly ask-me-anything video conference repeated in multiple timezones. The regular price is $395/person but use coupon NTOQTWTO to sign up for $95 (valid until February 17th, 2025). There are deeper discounts for buying multiple seats. Take a look at my Manning LiveProject that teaches you how to develop a service template and microservice chassis."
