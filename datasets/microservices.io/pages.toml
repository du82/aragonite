["https://microservices.io/patterns/client-side-discovery.html"]
title = "Pattern: Client-side service discovery"
full_description = "Services typically need to call one another. In a monolithic application, services invoke one another through language-level method or procedure calls. In a traditional distributed system deployment, services run at fixed, well known locations (hosts and ports) and so can easily call one another using HTTP/REST or some RPC mechanism. However, a modern microservice-based application typically runs in a virtualized or containerized environments where the number of instances of a service and their locations changes dynamically. Consequently, you must implement a mechanism for that enables the clients of service to make requests to a dynamically changing set of ephemeral service instances. How does the client of a service - the API gateway or another service - discover the location of a service instance? When making a request to a service, the client obtains the location of a service instance by querying a Service Registry, which knows the locations of all service instances. The Microservices Example application is an example of an application that uses client-side service discovery. It is written in Scala and uses Spring Boot and Spring Cloud as the Microservice chassis. They provide various capabilities including client-side discovery. RegistrationServiceProxy is a component of that application. In order to register a user, it invokes another service using the Spring Framework’s RestTemplate: It is injected with the RestTemplate and the user_registration_url, which specifies the REST endpoint. When the application is deployed user_registration_url is set to this URL http://REGISTRATION-SERVICE/user - see the docker-compose.yml file. REGISTRATION-SERVICE is the logical service name that is resolved to a network location using client-side service discovery. The service discovery is implemented using Netflix OSS components. It provides Eureka, which is a Service Registry, and Ribbon, which is an HTTP client that queries Eureka in order to route HTTP requests to an available service instance."
year_published = 2025
