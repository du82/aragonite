["https://microservices.io/post/architecture/2024/06/27/stop-hurting-yourself-by-doing-big-bang-modernizations.html"]
title = "STOP hurting yourself by doing big bang modernizations!"
full_description = "Explore DDD workshop, April 14-15, 2025, Denver - Designing microservices: responsibilities, APIs and collaborations. Early bird discount ends March 7th. Learn more and enroll. I recently had yet another conversation that described how the rollout of a ‘Next generation’ system was a long painful process. Users encountered all kinds of business impacting showstopper issues. It took months before the system was usable. This, of course, is hardly surprising. Any time you engage in a big bang modernization effort, you are taking a huge risk, and the odds are not in your favor. That’s especially true when the new system’s name includes the phrase ‘Next generation’. One rare exception is ST:NG, but that’s a TV show, not a software system 😀. This article discusses at why big bang modernizations are a bad idea. But first, let’s look at why organizations are attracted to big bang modernizations. What’s even more interesting is that organizations undertaking big bang rewrites often describe themselves as agile. For example, they often use Scrum. Development consists of a series of sprints. There’s stand ups, retrospectives, and all the other trappings of agile. What’s missing, of course, is that software is not delivered to customers until the end of the project. An approach that’s distinctly not agile. If you are not delivering software until the end of the project, there’s nothing ‘early’ or ‘continuous’ about it. Once again, if you are not delivering software until the end of the project, you are not following this principle. “Not true! We have sprints!”, they might say. But if the software isn’t in the hands of customers, it’s not working software. The key point here is that working software is software that is in the hands of customers. If it’s not in the hands of customers, then you have not validated your assumptions about user needs. Nor, have you validated any of your technical assumptions. You’ve ran a bunch of tests so in theory, it should work. But theory and practice are two different things."
year_published = 2025
