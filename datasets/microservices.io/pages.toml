["https://microservices.io/post/refactoring/2023/06/21/strangler-fig-application-pattern-incremental-modernization-to-services.md.html"]
title = "The Strangler Fig application  pattern: incremental modernization to microservices"
full_description = "Explore DDD workshop, April 14-15, 2025, Denver - Designing microservices: responsibilities, APIs and collaborations. Early bird discount ends March 7th. Learn more and enroll. In 2004, @martinfowler described how a hike in rain forest led him to realize that the Strangler Fig is a great metaphor for an effective way to modernize an application. So what is the Strangler Fig application pattern and why use it to migrate a monolith to microservices? A Strangler Fig is a plant that is found in rain forests. It starts its life in the canopy of a tree, grows down to the ground and establishes roots. It then grows rapidly and can ultimately kill the tree by blocking sunlight. The Strangler Fig is a metaphor for incrementally building a new application around the legacy application. The legacy application is the tree, and the new application is the Strangler Fig. Over time, functionality is migrated from the legacy application to the Strangler Fig application. The Strangler Fig application gradually increases in size while the legacy application shrinks. Moreover, new functionality can be implemented directly in the Strangler Fig application. If you are migrating to a microservice architecture, then the legacy application is the monolith, and Strangler Fig application consists of services. An alternative way to modernize an application is the big bang rewrite, which is when you recreate the entire application from scratch. On the surface, the big bang rewrite seems like the most straightforward approach. Simply start a (possibly large) project to recreate the functionality of the existing application as a collection of microservices. And, once the new application is complete, you switch over to it. The Strangler Fig application pattern reflects the fact that with legacy systems the true requirements are not always known. The original requirements might be lost. The application implements functionality that is no longer needed. As a result, modernizing a legacy system is often a process of discovery."
year_published = 2025
