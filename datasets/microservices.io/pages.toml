["https://microservices.io/refactoring"]
title = "Refactoring a monolith to microservices"
full_description = "Truly greenfield development of microservices-based applications is relatively rare. Many organizations that want to adopt microservices already have a monolithic application. As I describe in chapter 13 of my book, the recommended approach is to use the Strangler application pattern and incrementally migrate function from the monolith into services. The FTGO monolith (see source code) is the monolithic version of the microservices-based FTGO application. Its goal is to demonstrate how to refactor a monolithic application into services using the Strangler pattern. It’s used as an example in both my book and in my presentations about refactoring. Chapter 13 of my book describes how to refactor a monolith to microservices. There are two main refactoring strategies: A good way to begin the migration to microservices is to implement significant new functionality as services. This is sometimes easier than breaking apart of the monolith. It also demonstrates to the business that using microservices significantly accelerates software delivery. While implementing new functionality as services is extremely useful, the only way of eliminating the monolith is to incrementally extract modules out of the monolith and convert them into services. Here is an example of extracting a service from a monolith. Microservices.io is brought to you by Chris Richardson. Experienced software architect, author of POJOs in Action, the creator of the original CloudFoundry.com, and the author of Microservices patterns. Chris teaches comprehensive workshops for architects and developers that will enable your organization use microservices effectively. Avoid the pitfalls of adopting microservices and learn essential topics, such as service decomposition and design and how to refactor a monolith to microservices. Assess your application's microservice architecture and identify what needs to be improved. Engage Chris to conduct an architect review. My virtual bootcamp, distributed data patterns in a microservice architecture, is now open for enrollment!"
