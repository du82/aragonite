["https://microservices.io/post/architecture/2023/10/17/assemblage-step-3-defining-a-service-architecture.html"]
title = "Assemblage overview: step 3 - defining a service architecture"
full_description = "Explore DDD workshop, April 14-15, 2025, Denver - Designing microservices: responsibilities, APIs and collaborations. Early bird discount ends March 7th. Learn more and enroll. Step 1 of the Assemblage definition process distills the requirements into a set of system operations that collectively define the application’s behavior and Step 2 identifies the subdomains that implement those system operations. In this article, I describe step 3 of the Assemblage process, which designs the service architecture. A service architecture is a (mostly) technology neutral description of a microservice architecture consisting of the services, their responsibilities, subdomains, APIs and collaborations. In particular, inter-service communication is described abstractly using, for example, message channels and other enterprise Integration patterns rather than specific technologies such as Apache Kafka topics. You will learn how to define the service architecture by grouping subdomains to form services and applying the service collaboration patterns to realize system operations that span multiple services. I describe how the architecture is shaped by the dark energy and dark matter forces. Let’s start with an overview of how to define a service architecture. The service architecture is designed incrementally, one operation at a time. First, you rank the operations by descending importance. Next, you work your way down the list of operations, incrementally defining the architecture one operation at a time. Initially, the architecture is empty. Each iteration adds the elements that implement an operation to the architecture. You begin the design of an operation by defining one or more candidate operation realizations. An operation realization is an architecture fragment that adds the architectural elements - services, operations, event handlers, and message channels - that implement an operation. The candidates are then evaluated and compared using the dark energy and dark matter forces and the best one is selected. The chosen operation realization’s elements are then added to the architecture. The service architecture is a composition of each operation’s realization."
