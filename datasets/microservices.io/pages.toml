["https://microservices.io/post/antipatterns/2019/05/21/antipattern-more-the-merrier.html"]
title = "Microservices adoption anti-pattern: More the merrier"
full_description = "Explore DDD workshop, April 14-15, 2025, Denver - Designing microservices: responsibilities, APIs and collaborations. Early bird discount ends March 7th. Learn more and enroll. Another anti-pattern that I’ve seen is More the merrier. It occurs when an organization intentionally creates a very fine-grained microservice architecture. Perhaps they take the micro part of microservices too literally. Or perhaps, they believe that the more services the better. On the one hand, defining more services has several benefits. Each service is smaller and easier to understand and change. It’s also easier and faster to test. But on the other hand, there are several potential problems with an excessively fine-grained microservice architecture. Defining more services moves complexity from within the services to between the services. Each additional service makes development, testing and deployment more complicated. Also, there are diminishing returns with increasing the number of services. For example, at some point, services are small enough to understand and change and fast enough to test. Defining more services also increases the risk that changes will require multiple services to change it lockstep, which requires more coordination and planning and slows down development. The microservice architecture accelerates software delivery by structuring an application as a set of loosely coupled services owned by a small, high performance, cross functional team. Consequently, a better approach to service decomposition is to start with one service per team since that’s the bare minimum needed for the teams to be loosely coupled. Additional services should only be defined when doing so clearly solves a problem with, for example, maintainability or testability. A service typically grows in size and complexity over time. It can become more difficult to maintain and test, which can reduce development velocity. In this situation, the service’s team should consider splitting the service into two. Each of the resulting services will be smaller and hence more maintainable and testable. The team can develop, test and deploy each service independently."
year_published = 2025
