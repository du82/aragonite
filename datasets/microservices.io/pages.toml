["https://microservices.io/post/microservices/patterns/data/2019/07/15/ftgo-database-per-service.html"]
title = "The FTGO application and the Database per service pattern"
full_description = "Explore DDD workshop, April 14-15, 2025, Denver - Designing microservices: responsibilities, APIs and collaborations. Early bird discount ends March 7th. Learn more and enroll. One of the key characteristics of the microservice architecture is that each service’s data is private, e.g. the Database per Service pattern. As the pattern points out, you aren’t required to have a separate database server for each service. Instead, multiple services can share the same database server with a logical separation of their data. I’ve recently enhanced my book’s example application (FTGO) to properly demonstrate this pattern. Each service has database credentials that only grant it access its own (logical) database on a shared MySQL server. The ftgo_order_service_user/ftgo_order_service_password credentials only grant it access to the ftgo_order_service database: The other services (Accounting Service, Consumer Service Kitchen Service, and Restaurant Service) have a similar configuration. The Order History Service, which implements a CQRS view, has its own DynamoDB tables. Microservices.io is brought to you by Chris Richardson. Experienced software architect, author of POJOs in Action, the creator of the original CloudFoundry.com, and the author of Microservices patterns. Chris teaches comprehensive workshops for architects and developers that will enable your organization use microservices effectively. Avoid the pitfalls of adopting microservices and learn essential topics, such as service decomposition and design and how to refactor a monolith to microservices. Assess your application's microservice architecture and identify what needs to be improved. Engage Chris to conduct an architect review. My virtual bootcamp, distributed data patterns in a microservice architecture, is now open for enrollment! It consists of video lectures, code labs, and a weekly ask-me-anything video conference repeated in multiple timezones. The regular price is $395/person but us