["https://microservices.io/articles/dark-energy-dark-matter/dark-matter/efficient-interactions.html"]
title = "Dark matter force: efficient interactions"
full_description = "Explore DDD workshop, April 14-15, 2025, Denver - Designing microservices: responsibilities, APIs and collaborations. Early bird discount ends March 7th. Learn more and enroll. When designing a microservice architecture, we need to ensure that the components that implement a distributed system operation communicate efficiently. The desire for efficient interactions acts as an attractive force between the operation’s subdomains. A local operation has no communication overhead and, perhaps, all data access is handled by the service’s database. As a result, from a communications perspective, a local operation is efficient. A distributed system operation’s efficiency is proportional to the number of messages that are exchanged between the services that implement it and the size of those messages. A distributed operation might require large datasets to be transported over the network and joined together in memory. That’s potentially inefficient because it consumes CPU resources to repeatedly serialize and deserialize the data and network resources to transport the data between databases and services. Moreover, the operation might have high latency if involves numerous round trips between services. As a result, the requirement for an operation to be efficient might require some of its subdomains to be packaged together. Microservices.io is brought to you by Chris Richardson. Experienced software architect, author of POJOs in Action, the creator of the original CloudFoundry.com, and the author of Microservices patterns. Chris teaches comprehensive workshops for architects and developers that will enable your organization use microservices effectively. Avoid the pitfalls of adopting microservices and learn essential topics, such as service decomposition and design and how to refactor a monolith to microservices. Assess your application's microservice architecture and identify what needs to be improved. Engage Chris to conduct an architect review. My virtual bootcamp, distributed data patterns in a microservice architecture, is now open for enrollment!"
