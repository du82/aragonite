["https://microservices.io/post/architecture/2023/08/20/how-modular-can-your-monolith-go-part-2.html"]
title = "How modular can your monolith go? Part 2 - a first look at how subdomains collaborate"
full_description = "Explore DDD workshop, April 14-15, 2025, Denver - Designing microservices: responsibilities, APIs and collaborations. Early bird discount ends March 7th. Learn more and enroll. In part 1 I described how a modular monolith is structured around the business domains rather than the technical concerns. Some system operations (e.g. user requests) will be local to a single domain. For example, createCustomer() However, many system operations, especially the most complex ones and possibly the most important, will span multiple domains. For example, as I described the end of the first article, createCustomer() needs to create a Customer and send out an email confirmation, which requires the customers and notifications domains to collaborate. Similarly, the createOrder() operation needs to create an Order, reserve credit in the Customer Service (which can fail) and send an order confirmation. Since domains need to collaborate, we must consider domain API design and inter-domain collaboration mechanisms. What’s more, we need to think about the scope of (database) transactions. In this article, I focus on the first two issues, and assume that a system operation consists of a single transaction that spans subdomains. In a later post, I’ll discuss transaction management in more detail. To provide more context, let’s start by looking at the monolithic customers and orders application in more detail. This application implements the following system operations: The Customer and Order entities are persisted using JPA. Their repositories are implemented using Spring Data JPA. Reorganizing the customers and orders application into a modular monolith results in a package structure that looks like this: The top-level packages are customers, orders and notifications. Each one contains the classes - controllers, services, and entities - for the corresponding domain. Each top-level package is a separate Gradle sub-project. A notable feature of this design is that there are numerous inter-domain dependencies. The CustomerService in the customers domain and the Order Service in the orders domain both invoke the NotificationService in the notifications domain. The OrderService also invokes the CustomerRepository to retrieve the Customer entity."
