["https://microservices.io/post/architecture/2023/03/28/microservice-architecture-essentials-loose-coupling.html"]
title = "Essential characteristics of the microservice architecture: loosely coupled"
full_description = "Explore DDD workshop, April 14-15, 2025, Denver - Designing microservices: responsibilities, APIs and collaborations. Early bird discount ends March 7th. Learn more and enroll. Previously, I wrote how one of the essential characteristic of the microservice architecture is that services are independently deployable. Another essential characteristic is that services are loosely coupled. Minimizing design-time coupling and minimizing runtime coupling are two of the five dark matter forces that shape a microservice architecture. Runtime coupling between services is the degree to which the availability of one service is affected by the availability of another service. Or to be more precise, it’s degree to which the availability of an operation implemented by one service is affected by the availability of another service. For example, let’s imagine that the createOrder() system operation is implemented by an HTTP POST /orders endpoint in the Order Service. The Order Service handles the HTTP POST by invoking other services, waiting for them to response, and then sending a response to its client. In this design, the Order Service cannot respond to the POST request until the other services respond to it. The Order Service (or createOrder() operation) is said to be runtime coupled to those other services. As a result, the availability of the createOrder() operation is reduced since all services must be available. Minimizing runtime coupling is one of the dark matter attractive forces that resists decomposition. One way to reduce an operation’s runtime coupling is to reduce the number of services that implement it. In fact, we can eliminate runtime coupling entirely by making an operation local to a single service. However, it’s not always possible to create a microservice architecture where all operations are local. That’s likely to violate the dark energy forces, which encourage decomposition. The other way to reduce runtime coupling while satisfying dark energy forces is to design self-contained services. A self-contained service responds to a synchronous request with a partial outcome and then asynchronously complete the operation. For example, the Order Service could respond to the HTTP POST /orders request with a 202 Accepted response and then initiate a Create Order Saga complete the operation. This approach improves the availability of the Order Service. The drawback is that it makes the client more complex since it must be able to handle partial outcomes and somehow determine the final outcome of the operation."
year_published = 2025
