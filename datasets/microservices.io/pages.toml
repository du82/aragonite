["https://microservices.io/post/antipatterns/2019/02/25/antipattern-scattershot-adoption.html"]
title = "Microservices adoption anti-pattern: scattershot adoption"
full_description = "Explore DDD workshop, April 14-15, 2025, Denver - Designing microservices: responsibilities, APIs and collaborations. Early bird discount ends March 7th. Learn more and enroll. Another anti-pattern that I’ve encountered is Scattershot adoption which occurs when multiple application development teams attempt to adopt the microservice architecture without any coordination. Several teams might, for example, simultaneously develop the development infrastructure, such as automated deployment pipelines, and setup runtime infrastructure, such as Kubernetes. A common reason for this anti-pattern is that a leader of the organization made the adoption of microservices everyone’s goal. On the one hand, it’s great that there is a growing grassroots effort within the organization to adopt the microservice architecture. But on the other hand, having multiple teams simultaneously investigate microservices without any coordination is inefficient. There is likely to be duplication of effort, e.g. multiple teams figuring out how to develop microservices, build infrastructure for deployment pipelines and set up runtime environments. Moreover, development teams might not have the skills or the time to build and management development and runtime infrastructure. A better approach is for the organization to define and execute a microservices migration roadmap. The roadmap consists of numerous activities including: Microservices.io is brought to you by Chris Richardson. Experienced software architect, author of POJOs in Action, the creator of the original CloudFoundry.com, and the author of Microservices patterns. Chris teaches comprehensive workshops for architects and developers that will enable your organization use microservices effectively. Avoid the pitfalls of adopting microservices and learn essential topics, such as service decomposition and design and how to refactor a monolith to microservices. Assess your application's microservice architecture and identify