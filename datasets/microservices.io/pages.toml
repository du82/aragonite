["https://microservices.io/post/architecture/2023/09/19/assemblage-part-3-whats-a-service-architecture.html"]
title = "Assemblage overview: Part 3 - What's a service architecture?"
full_description = "Explore DDD workshop, April 14-15, 2025, Denver - Designing microservices: responsibilities, APIs and collaborations. Early bird discount ends March 7th. Learn more and enroll. In previous articles, I described the first two steps of the Assemblage architecture design process. The first step identifies the system operations, which model externally invoked requests. The second step of the process designs the subdomains that implement those system operations. The third step of the design process defines the service architecture. In a later article, I’ll describe the service design process in more detail. In this article, I’ll provide an overview of the service architecture. The service architecture consists of one or more services. The services are a grouping/partitioning of the application’s subdomains that were defined in step 2. Each service consists of one or more subdomains. Each subdomain is in one and only one service. If the service architecture consists of one service, it’s a monolith and if there’s more than one, it’s a microservice architecture. Defining service architecture is most critical part of designing an architecture. If you do a good job, you’ll have a good architecture that will, for example, accelerate software delivery. Conversely, if you do a bad job, you risk slowing down software delivery. In the worst case, you’ll create a distributed monolith, which is an anti-pattern architecture that combines the worst aspects of monoliths and microservices. The service architecture can be (mostly) defined in a technology neutral way. The focus is on correctly defining the service boundaries and their collaborations. Even the communication between services can be defined in a technology neutral way. You can (and should), for example, model messaging in terms of messaging channels rather than instantly picking a message broker. Once you’ve defined the service architecture, you can then define the technical architecture. The technical architecture consists of a set of specific technology choices. In fact, most of the decisions that you must make consist of applying the Microservice pattern language including deployment patterns, communication patterns, and observability patterns."
year_published = 2025
