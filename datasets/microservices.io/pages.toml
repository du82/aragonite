["https://microservices.io/post/architecture/2025/02/07/writing-testable-and-maintainable-jbang-scripts.html"]
title = "Writing testable and maintainable JBang scripts"
full_description = "Explore DDD workshop, April 14-15, 2025, Denver - Designing microservices: responsibilities, APIs and collaborations. Early bird discount ends March 7th. Learn more and enroll. I regularly write scripts to automate various tasks. Over the years, I’ve used a variety of languages to write these scripts. I started off writing scripts in Bash. Then I switched to Python for the more complicated scripts. But over the past year, I’ve been using JBang for scripting. This article describes how I’ve been writing testable and maintainable JBang scripts. I like the idea of using Java since it’s the language I use for most of my development. It’s also statically typed, which helps me catch errors early. But after a while, however, I felt that single file, self-contained JBang scripts were not enough. In order to properly leverage Java, I needed to be able to write testable and maintainable scripts. Some scripts were complicated, and I wanted to break them up into multiple classes. I also wanted to develop the scripts using TDD instead of doing the equivalent of testing them in production (note: git revert is a handy way to undo the effects of a text processing script that goes wrong). Also, I wanted to minimize code duplication in the scripts by having a library of utility functions. I’ve found a good strategy is to aggressively refactor the scripts to move as much code as possible into a shared library of utility functions. I’m available to help your organization improve agility and competitiveness through better software architecture: training workshops, architecture reviews, etc. Microservices.io is brought to you by Chris Richardson. Experienced software architect, author of POJOs in Action, the creator of the original CloudFoundry.com, and the author of Microservices patterns. Chris teaches comprehensive workshops for architects and developers that will enable your organization use microservices effectively. Avoid the pitfalls of adopting microservices and learn essential topics, such as service decomposition and design and how to refactor a monolith to microservices."
