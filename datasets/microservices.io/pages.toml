title = "Microservices rules #11: Track and improve metrics"
full_description = "Explore DDD workshop, April 14-15, 2025, Denver - Designing microservices: responsibilities, APIs and collaborations. Early bird discount ends March 7th. Learn more and enroll. This is another article in the series about microservices rules: what good looks like, which are a set of principles and practices for using microservices effectively. The other articles about microservices rules are: Using the microservice architecture can be challenging. You must make many architectural design decisions that can be very consequential, even small missteps can have far-reaching impacts. You can minimize the risk of making bad decisions by using Microservices rules #5: Deliberative design and Microservices rules #10: Make smaller, safer, and reversible changes. But there’s always a chance that something will go wrong, especially if it’s your first time using microservices. Consequently, it’s essential to follow Microservices rules #11: Track and improve metrics. In this article, I outline three key categories of metrics you should track to ensure your microservices development stays on course. Microservices.io is brought to you by Chris Richardson. Experienced software architect, author of POJOs in Action, the creator of the original CloudFoundry.com, and the author of Microservices patterns. Chris teaches comprehensive workshops for architects and developers that will enable your organization use microservices effectively. Avoid the pitfalls of adopting microservices and learn essential topics, such as service decomposition and design and how to refactor a monolith to microservices. Assess your application's microservice architecture and identify what needs to be improved. Engage Chris to conduct an architect review. My virtual bootcamp, distributed data patterns in a microservice architecture, is now open for enrollment! It consists of video lectures, code labs, and a weekly ask-me-anything video conference repeated in multiple timezones. The regular pric