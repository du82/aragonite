["https://www.microsoft.com/en-us/accessibility"]
title = "Accessibility Technology & Tools | Microsoft Accessibility"
description = "Explore accessibility and inclusion technology from Microsoft Accessibility. Ensure and empower those around you to participate in activities at work or play."
full_description = ".heading-bg-color-layout-container-uid3863{ background-color: !important; } Ability Summit starts in Days Hours Minutes Seconds —Register for free 03/18/2025 09:00 .heading-bg-color-layout-container-uidd72d{ background-color: !important; } Slide %{start} of %{total}. %{slideTitle} Skip featured stories and announcements: navigate using the slide tabs Pause Previous Next Engage in the future of accessibility through AI Join us March 18 for our fifteenth Ability Summit. Explore new accessible technology and learn from experts around the globe at this free digital event. Register for Ability Summit 2025 Raising the bar on accessibility Together, we can build a more accessible future. Learn how the disability community drives innovation that benefits us all. Watch the video End of featured stories and announcements: navigate using the slide tabs section .heading-bg-color-layout-container-uid571f{ background-color: !important; } Promoting disability inclusion In today’s connected world, access to technology is central to the way we operate, and it is fundamental to a more equitable future. Accessibility is the vehicle for inclusion of people with disabilities. .heading-bg-color-layout-container-uid6cf9{ background-color: !important; } Our commitment We are committed to create and grow usage of accessible technology, expand skilling and hiring opportunities for people with disabilities, and advocate for policies that advance accessibility as a fundamental right. Learn about our approach Accessibility training and resources There are many ways to support your colleagues, classmates, friends, and family members with disabilities. See accessibility training essentials Browse accessibility videos Technical support Disability Answer Desk provides product support for our customers with disabilities, including Microsoft Office, Windows, and Xbox Contact the Disability Answer Desk .heading-bg-color-layout-container-uid542b{ background-color: !important; } Accessible products and technology We are committed to designing accessible products with and for people with disabilities. Our approach to inclusive technology .heading-bg-color-layout-container-uidcaf0{ background-color: !important; } Windows Microsoft 365 Microsoft Teams Xbox Visual Studio Adaptive accessories .heading-bg-color-layout-container-uidf100{ background-color: #D4EC8E !important; } Answer your questions with AI Ask Microsoft Accessibility is a Bing AI-powered tool that can help you find information about the accessibility of Microsoft products and services. Try it now .heading-bg-color-layout-container-uidef36{ background-color: !important; } Designed for you Find products and tools based on your needs. Explore more tips and tools .heading-bg-color-layout-container-uidd853{ background-color: !important; } Vision Need a larger screen? A brighter screen? A narrator to read text? Find out about accessibility tools and features for people who are blind, color blind, or have low vision. Learn about vision-related tools Hearing For those who are hard of hearing, have hearing loss, or have deafness, our specialized features can provide solutions including closed captioning, mono sound, and live call transcription. Explore hearing-assistive tools Neurodiversity Innovative tools such as dictation and Windows Hello sign-in can make the digital world more accessible for those who with dyslexia, seizures, autism, or other cognitive differences. Discover tools for neurodiversity Learning Our applications for people living with learning disabilities can help increase focus, concentration, and understanding—and include tools to improve reading and writing skills. Uncover tools for learning Mobility Our suite of products helps people living with arthritis, quadriplegia, spinal cord injuries, and other mobility issues to navigate the digital world in new ways. Find mobility-assistive tools Mental health Learn more about assistive technologies for people living with issues such as bipolar disorder, anxiety, PTSD, depression, or ADHD. Our products can help reduce distraction and improve concentration and reading. Try mental health assistive tools .heading-bg-color-layout-container-uidfb0b{ background-color: !important; } Driving impact together Our grant program supports researchers, startups, nonprofits, and assistive technology companies around the world to develop innovative technologies that empower people living with disabilities. We invest in ideas that are developed by or with people with disabilities. Learn about our grant program Unique unites us When we have the tools we need to thrive, our unique contributions can shine. Explore the stories behind people with disabilities who are driving innovation and moving the world of work forward. Read about the innovative work .heading-bg-color-layout-container-uidad9d{ background-color: !important; } Latest news about accessibility at Microsoft .heading-bg-color-layout-container-uidc390{ background-color: !important; } Join Ability Summit 2025 Be part of the future of accessibility and AI at the fifteenth Ability Summit on March 18. In this free digital event, explore new accessible technology and learn from experts around the globe. Learn more about Ability Summit 2025 Watch Ability Summit 2024 videos Empowering potential with AI We collaborated on a new study with EY to explore the impact of Copilot on neurodiversity. The study involved over 300 employees identifying as neurodivergent or disabled and explored how Copilot impacts communication, workplace inclusion, and learning and skill development. Explore the impacts of Copilot Read the Copilot study from EY Building inclusive AI AI requires large amounts of data for training and utility but disability is often underrepresented or incorrectly categorized in datasets. Our new collaboration with Be My Eyes will help make Microsoft AI models more inclusive for the 340 million people in the world who are blind or have low vision. Read the latest on inclusive AI Seeing AI app launches on Android Microsoft announced that the newest version of Seeing AI, a free app that narrates the world for blind and low vision people, is now available on Android devices. Read the announcement .heading-bg-color-layout-container-uid61e4{ background-color: #fff8f3 !important; } Embracing responsibility We believe companies that can do more, should. Learn about our commitments to ensure the technology we create benefits everyone on the planet, including the planet itself. Learn about our commitments .heading-bg-color-layout-container-uid6746{ background-color: !important; } .heading-bg-color-layout-container-uid19f7{ background-color: !important; } X YouTube Support Blog"
