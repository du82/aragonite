title = "How to Buy Microsoft for Education | Microsoft Education"
description = "Explore licensing options for new education devices and software from Microsoft Education. Provide the best school software, technology, and tools for your teachers and students."
full_description = "HOW TO BUY Get help choosing the right Microsoft technology for your school or student Microsoft Education solutions work on any device, but the best experiences come together on Windows for students and teachers. Connect with a Microsoft Education expert to find solutions that work best for your school. Schedule a consultation Request a callback Products Products Resources Devices Solutions FAQ Next Steps Products Explore Microsoft products Windows 11 for education Reimagined for a new era of digital learning, Windows 11 for education supports students with powerful tools to learn, collaborate, and create. Learn more Microsoft 365 Education A comprehensive suite of products designed to enhance learning environments, Microsoft 365 Education has three tiers of academic plans to meet the needs of your school. Learn more Office 365 Education Microsoft donates Office 365 Education to eligible institutions at no cost, enabling students and educators to sign up for web versions of familiar products and AI tools for free. Learn more Microsoft 365 Copilot Chat Enhance learning experiences through AI-powered Copilot Chat, built into familiar products such as Microsoft Edge and Microsoft 365 Education. Learn more Microsoft Intune Intune helps simplify the set up and management of devices for students and teachers. Contact Sales to learn more Azure Azure for education gives students and educators the cloud development resources they need to build, deploy, and manage applications. Learn more Microsoft Teams Teams is the digital hub for collaboration that brings conversations, content, assignments, and apps together in one place. Learn more Microsoft Edge Make learning secure, accessible, and efficient with Microsoft Edge, complete with AI-powered Copilot built into the free web browser. Learn more Minecraft Minecraft – Education Edition engages students across subjects through immersive, game-based learning. Learn more Resources Resources to help you get education software Microsoft Education licensing Choose cost-effective licensing when you buy education products for your institution. Microsoft Education licensing provides you access to the classroom technology you need. Download the licensing guide Get in touch Connect one-on-one with a Microsoft Education sales specialist to explore products and solutions for your school. Contact Sales Explore Education Apps Explore the most popular education apps—such as Minecraft Education, Duolingo, and Kahoot—that engage students and make learning fun. Browse education apps DEVICES Windows 11 devices Browse all Windows 11 devices for education to find the solutions that work best for your school or student. See devices for your school Shop for your home SOLUTIONS Explore Microsoft solutions by role Whether you’re a school leader, IT professional, educator, or student, we've got thoughtful solutions for everyone in the education space. Previous Slide Next Slide School leaders Empower your students to succeed, help teachers make the most of classroom time, and get more out of your budget with classroom technology tools. Start here IT Professionals Deploy affordable, easy-to-manage education technology that transforms classroom time, with the safety and security you expect. Start here Educators Explore educational technology to create inclusive, student-centered classrooms and learning opportunities for all. Start here Students Make schoolwork more fun with the education software that will successfully take you from school to the workplace. Start here Back to Solutions section Frequently asked questions Expand all Collapse all 01/ What are the pricing options for Microsoft 365 Education and Office 365? Both Microsoft 365 Education and Office 365 Education have various pricing options for schools. View the product comparison table and contact Sales to discuss your school’s needs. 02/ How do I get Microsoft Office 365 Education? Microsoft donates Office 365 Education for the classroom to eligible institutions at no cost to ensure all students have access to tools for learning and building skills for the future. Office 365 Education provides web versions of Word, Excel, PowerPoint, OneNote, Microsoft Teams, and Microsoft 365 Copilot Chat, plus additional AI-based tools for work and learning. Enter your school email address to get started. If you’re a school seeking additional assistance in signing up your school for Microsoft Office 365, contact a sales specialist today. 03/ How can I get a Microsoft Education discount? Students and educators are eligible for a 10% discount on select items in the Microsoft Store with an active Microsoft account. (A Microsoft account is an email address and password that you use with Outlook.com (Hotmail), Office, OneDrive, Skype, Xbox, and/or Windows.) If you don’t have an active Microsoft account, see the Microsoft Store for discount details. Resources Microsoft Learn Educator Center Browse interactive lessons, earn professional development hours, acquire certifications, and find programs that help meet your learning goals. Visit the Educator Center Resource Center Microsoft Education Resource Center Explore resources for education and empower your community with knowledge, insights, and how-to guides. Visit the Resource Center School stories Real schools, real results Learn how schools around the world have implemented and benefitted from Microsoft solutions. Explore school stories Follow Microsoft Education"
