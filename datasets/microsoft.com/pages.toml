["https://www.microsoft.com/about"]
title = "Our Mission and Values | About Microsoft"
description = "Our mission is to empower every person and every organization on the planet to achieve more. Learn more about Microsoft, our commitments, and values."
full_description = '''We empower the world Microsoft’s mission is to empower every person and every organization on the planet to achieve more. .heading-bg-color-layout-container-uid04fc{ background-color: !important; } Our opportunity and responsibility We’re living in an era in which technology has the potential to power awesome advancements across every sector of our economy and society. This places us at a historic intersection of opportunity and responsibility. Our mission has never been more important. To realize it, we must create a future that benefits everyone. Watch the video .heading-bg-color-layout-container-uid5b07{ background-color: #FFF8F3 !important; } .heading-bg-color-layout-container-uidc377{ background-color: !important; } We believe that companies that can do more, should We focus on four enduring commitments that are central to our mission, serving as a guide to ensure our actions align with our mission. Explore our commitments .heading-bg-color-layout-container-uidccff{ background-color: #FFF8F3 !important; } Expand opportunity We expand economic opportunity and growth for all. Earn trust We create a safe, secure, and responsible digital world. Protect fundamental rights We support and advance people’s fundamental rights. Advance sustainability We are committed to meeting our own climate goals while enabling others to do the same. .heading-bg-color-layout-container-uid8278{ background-color: !important; } .row-bg-color-layout-container-uid6cc0{ background-color: !important; } Microsoft Copilot Your everyday AI companion Try Copilot Copilot for personal use Copilot for organizations .heading-bg-color-layout-container-uidc158{ background-color: !important; } What will you do with Copilot? AI-powered coding for everyone Engineers like Anton Mirhorodchenko are tackling accessibility issues in unprecedented ways. Discover his story Pushing the game forward The Billie Jean King Cup by Gainbridge is serving up better women's tennis stats with tech. Explore the game-changing tech Explore what’s new with Copilot .heading-bg-color-layout-container-uid87c8{ background-color: !important; } .heading-bg-color-layout-container-uid494f{ background-color: !important; } .heading-bg-color-layout-container-uidd711{ background-color: !important; } Discover more from Microsoft Microsoft products built to support you Explore Microsoft products and apps Achieve more with the Microsoft Cloud Learn about Microsoft Cloud Any platform. Any language. Our tools. Visit Microsoft Developer .heading-bg-color-layout-container-uidd48e{ background-color: !important; } .heading-bg-color-layout-container-uid5233{ background-color: !important; } .heading-bg-color-layout-container-uid4d42{ background-color: !important; } Our culture and careers Because impact matters At Microsoft you can live your purpose every day. With our scale and reach, your personal impact becomes part of a collective force for global progress. Explore careers at Microsoft Diversity & Inclusion We believe our continued work to build diverse workforces and strengthen our culture of inclusion helps foster innovation. Learn about diversity at Microsoft Inclusion is innovation We’re developing solutions to diversity and inclusion challenges by activating the same ingenuity, intention, and experience behind our groundbreaking technological innovations. Explore the stories .heading-bg-color-layout-container-uidc31e{ background-color: #FFF8F3 !important; } .heading-bg-color-layout-container-uidd856{ background-color: !important; } Our corporate values Our values align to our mission, support our culture, and serve as a declaration of how we treat each other, our customers, and our partners. .heading-bg-color-layout-container-uid25bd{ background-color: #FFF8F3 !important; } .heading-bg-color-layout-container-uidabbe{ background-color: !important; } Respect We recognize that the thoughts, feelings, and backgrounds of others are as important as our own. Integrity We are honest, ethical, and trustworthy. Accountability We accept full responsibility for our decisions, actions, and results. .heading-bg-color-layout-container-uid6c72{ background-color: !important; } .heading-bg-color-layout-container-uide04b{ background-color: !important; } Explore Microsoft Facts about Microsoft News and stories Microsoft office locations Microsoft Support .heading-bg-color-layout-container-uidcbf4{ background-color: !important; } Follow Microsoft { "@context": "https://schema.org", "@type": "Organization", "name": "Microsoft", "url": "https://www.microsoft.com/", "sameAs":["https://www.linkedin.com/showcase/microsoft-on-the-issues","https://x.com/msftissues","https://www.instagram.com/msftissues/","https://blogs.microsoft.com/on-the-issues/"] };'''
