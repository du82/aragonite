full_description = "introMicrosoft Edge is the AI-powered browser.A smarter way to protectcreatefindbrowsegameshoplearnsearch Download Edgeupdate-latestWhat's new in Microsoft EdgeMicrosoft Edge introduces exciting new features every month. Check out the latest features here. See new featuresbrowser-tutorialFind, create, and accomplish beyond what you ever thought possible with a smarter browser. Welcome to Microsoft EdgeWe've created a quick tutorial to help you get the most out of your browser.1 of 6ContinueChoose your tab layoutDid you know Edge has multiple tab layouts? Vertical tabs provide an efficient way to manage tabs, see more tabs at once, and reduce browser clutter.2 of 6BackContinueQuickly search the webGet instant info at your fingertips – from quick calculations to weather forecasts, get quick answers by just typing in your address bar.3 of 6BackContinue. Copilot at your sideEdge has a built-in AI companion. Copilot is ready to offer advice, feedback, or a helpful reminder to keep you on track, as you take on challenges big and small.Open Copilot4 of 6BackContinuePin your favorite sites to your taskbarGet quick and easy access to your favorite sites by pinning them to the Windows taskbar.Pin sites5 of 6BackContinuePersonalize your backgroundCreate custom themes with the AI Theme Generator. Customize your browser background image and choose a color for your browser frame.Create a theme6 of 6BackDoneyear-in-reviewNEWLet's celebrate what made 2024 memorableLook back on how Edge users unlocked the power of AI, maximized their productivity, and saved their time and money in 2024.Learn morecompareDo more with EdgeMicrosoft Edge is your AI-powered browser that helps you achieve more. With unique features like Copilot, Vertical tabs, VPN and more, Edge helps you save time, save money and protect your online privacy.Learn more CopilotMake the most of your time online with Copilot in Edge. The AI-powered feature that helps you do more than you ever thought possible, built right into your browser. Try nowLearn moreMake the most of your time online with Copilot in Edge. The AI-powered feature that helps you do more than you ever thought possible, built right into your browser. Vertical tabsBrowse efficiently with Vertical tabs on Microsoft Edge. Browser tabs from the top move to the side of the screen allowing you to identify your tabs better and make more screen space.Learn moreBrowse efficiently with Vertical tabs on Microsoft Edge. Browser tabs from the top move to the side of the screen allowing you to identify your tabs better and make more screen space. VPN Protect your online activity from public view, browse with Microsoft Edge’s built-in VPN while you’re on a public network. Try nowLearn moreProtect your online activity from public view, browse with Microsoft Edge’s built-in VPN while you’re on a public network. Split screen Effortlessly multitask with Split screen in Microsoft Edge. View two tabs side by side in a single window, making it easier to compare content and work more efficiently.Split screen now Learn moreEffortlessly multitask with Split screen in Microsoft Edge. View two tabs side by side in a single window, making it easier to compare content and work more efficiently. Scareware blocker Stay safer online with Scareware blocker. Microsoft Edge detects and blocks scareware, helping to protect you from deceptive pop-ups and malicious software.Manage settingsLearn moreStay safer online with Scareware blocker. Microsoft Edge detects and blocks scareware, helping to protect you from deceptive pop-ups and malicious software. Workspaces Organize your browsing with Workspaces in Microsoft Edge. Group related tabs into workspaces, making it easier to switch between projects and keep your browser clutter-free.Try nowLearn moreOrganize your browsing with Workspaces in Microsoft Edge. Group related tabs into workspaces, making it easier to switch between projects and keep your browser clutter-free. DropEasily share files and notes with Drop in Microsoft Edge. Send content between your devices seamlessly, ensuring you always have access to your important information.Try nowLearn moreEasily share files and notes with Drop in Microsoft Edge. Send content between your devices seamlessly, ensuring you always have access to your important information.copilotChat nowCopilot VisionMicrosoft Edge is the best browser for Copilot experiences.The future of browsing and searching is here with Microsoft Edge, now with the new Copilot built in. Ask complex questions, get comprehensive answers, summarize the information on a page, dive deeper into citations, start writing drafts, and create images with DALL·E 3 — all side-by-side while you browse, with no need to flip between tabs or leave your browser.Try nowshopping-light-non-edgeSave money when you shop onlineGet personalized shopping assistance with Microsoft Edge. Edge is the only browser that helps you shop more confidently with built-in features like comprehensive buying guides, review summaries, intelligent product comparisons, and more. Find deals on all the things you love with Edge.Start shopping$,,,Current savings Edge has found our customers$400Shoppers save on average per year Annual savings are calculated using value of coupons presented to users signed into their Microsoft accounts from May 2021 – April 2022. Based on US data only.$4.3B+Total coupon savings found Microsoft Edge has shown coupon savings totaling over $2.2 billion where coupons have been available since 2020.100%Cashback earned Available when Microsoft Cashback is activated. As of June 2022, shoppers on Microsoft Edge and Bing are given 100% of cashback offered by retailers. Based on US data only.ai-innovationsEnhance your browsing capabilities with AIPower your searches with Microsoft Edge—the browser built to help you find exactly what you’re looking for, in a flash. Get the information you need without the guesswork thanks to AI-powered search features like Microsoft Copilot, page summarize, and more.Learn moreai-theme-generatorNEWTransform your words into browser themesWith the AI Theme Generator in Microsoft Edge, you can personalize your browser with unique custom themes based on your words. Themes change the look of your browser and the new tab page. Explore dozens of pre-generated themes for inspiration or create your own.Create a themebingMicrosoft Edge is the best browser for BingMicrosoft Edge is designed to enhance your Bing search experience, providing faster, smarter, and more tailored results. Experience seamless integration between Bing and Edge, the browser built to optimize your AI-powered search experience.Learn moremsnStay up to date with MSN in Microsoft EdgeOpen a New tab page in Edge for fresh updates and stories. Personalize your MSN feed by selecting topics and publishers that matter to you. With just a few clicks, make MSN uniquely yours.Learn moreperformanceAchieve more performanceStay focused, flowing, and in control of your time online when you use Microsoft Edge. Equipped with AI-powered Microsoft Copilot, browser actions, tab organization, and advanced performance features, Edge is built to help you do more with every minute you spend online.Learn moreGet an average of 25 more minutes of battery life with efficiency mode. Only on Microsoft Edge. Battery life varies based on settings, usage, and other factors.securityStay safer onlineWhen it comes to online safety, Microsoft Edge has your back. Equipped with AI-enhanced security features and advanced security controls, Edge makes it easier to defend yourself against online threats. Browse confidently and more safely on Edge.Microsoft Edge helps you stay protected while you browse by blocking phishing and malware attacks. Learn moregamingUse the best browser for gamingThanks to cloud gaming optimizations like Clarity Boost, a memory-saving efficiency mode, and support for popular themes and extensions, Microsoft Edge is the best browser for gaming on the web, giving you access to free games.Learn moretoolsEmpower every student with inclusive toolsMicrosoft Edge offers the most comprehensive set of built-in learning and accessibility tools on the web, with Immersive Reader facilitating reading comprehension, and Read Aloud letting students listen to webpages like podcasts.Learn morerewardsEarn and redeem RewardsAs a Microsoft Rewards member, it’s easy to get rewarded for doing what you already do. Earn Rewards points fast when you search with Microsoft Bing in Microsoft Edge. Then, redeem your points for gift cards, donations, and more.Start earningJoinSigning up is easy and free with your Microsoft accountEarnSearch, shop, and game daily to quickly earn pointsRedeemRedeem points for gift cards, donations to nonprofits, and morebusinessExplore the best browser for businessIf you are looking for a fast, secure browser for your business that offers the best of Microsoft, look no further than Microsoft Edge for Business.Learn morem365Elevate your productivity with Microsoft 365Enjoy access to free Microsoft 365 web apps like Word, Excel, and PowerPoint–side-by-side with your Microsoft Edge web content–in just a click. Internet access required, fees may apply.Learn moremobile-non-edge Scan to get theEdge app Download on the App StoreDownload on the App StoreAI-powered browsing on the goDiscover a fast and secure way to browse, shop, and achieve more on the go. Download the Edge Mobile app today, available for both iOS and Android devices.Learn moredevicesBrowse with Edge across all your devicesEasily sync your passwords, favorites, and settings across all your devices—Windows, macOS, iOS, or Android.Download for your device * Feature availability and functionality may vary by device type, market, and browser version. * The content on this page may have been translated using AI."
