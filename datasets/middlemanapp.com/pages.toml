["https://middlemanapp.com/basics/partials"]
title = "Middleman: Partials"
full_description = '''Basics Install Upgrading to v4 Start a New Site Directory Structure Development Cycle Build & Deploy Frontmatter Templating Language Helper Methods Layouts Partials Redirects Blogging Advanced Configuring Your Site Project Templates Dynamic Pages Data Files Localization (i18n) Asset Pipeline External Pipeline Rack Middleware The Sitemap Pretty URLs (Directory Indexes) Improving Cacheability File Size Optimization Custom Extensions Template Engine Options Partials Partials are a way of sharing content across pages to avoid duplication. Partials can be used in page templates and layouts. Let's continue our above example of having two layouts: one for normal pages and one for admin pages. These two layouts could have duplicate content, such as a footer. We will create a footer partial and use it in both layouts. Partial files are prefixed with an underscore and include the templating language extension you are using. Here is an example footer partial named _footer.erb that lives in the source folder: <footer> Copyright 2011 </footer> Now, we can include this partial in the default layout using the partial method: <html> <head> <title>My Site</title> </head> <body> <%= yield %> <%= partial "footer" %> </body> </html> And in the admin layout: <html> <head> <title>Admin Area</title> </head> <body> <%= yield %> <%= partial "footer" %> </body> </html> Now, any changes to _footer.erb will appear at the bottom of both layouts and any pages which use those layouts. If you find yourself copying and pasting content into multiple pages or layouts, it's probably a good idea to extract that content into a partial. After you start using partials, you may find you want to call it in different ways by passing variables. You can do this by: <%= partial(:paypal_donate_button, :locals => { :amount => 1, :amount_text => "Pay $1" }) %> <%= partial(:paypal_donate_button, :locals => { :amount => 2, :amount_text => "Pay $2" }) %> Then, within the partial, you can set the text appropriately as follows: <form action="https://www.paypal.com/cgi-bin/webscr" method="post"> <input name="amount" type="hidden" value="<%= "#{amount}.00" %>" > <input type="submit" value="<%= amount_text %>" > </form> Read the Padrino Render Helpers documentation for more information.'''
