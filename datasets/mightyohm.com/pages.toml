description = "Do you want to learn how to solder?  Do you want to make really cool things?  Do you want to teach other people how to solder (and make cool things too)? I’m happy to announce the release of …"
full_description = "Books and Resources, Electronics Announcing the “Soldering is Easy” Complete Comic Book! April 11, 2011 Jeff 95 Comments Do you want to learn how to solder? Do you want to make really cool things? Do you want to teach other people how to solder (and make cool things too)? I’m happy to announce the release of Soldering is Easy, a comic book that will teach anyone the basics of soldering. This seven page comic book explains in detail and with pictures how to make a good solder connection. It also teaches you all the other bits and pieces of knowledge that you need to successfully solder together an electronic kit, even if you’ve never soldered before! I worked with Mitch Altman (@maltman23) and Andie Nordgren to create this revised and extended version of the wildly popular one page handout that Mitch and Andie created in 2010. The comic (and lots more cool stuff!) will be included in a book that Mitch and I are writing about How to Make Cool Things with Microcontrollers (For People Who Know Nothing). It will be published by No Starch Press. Here’s a sample page (click for a bigger version): As of 2015 the comic book has been translated into 21 other languages! A huge thanks to everyone who sent in translations and is helping us spread our message around the world! We would love for people to translate the comic book into more languages! If you create a translation, please post a comment here and I’ll link to it! If you’re looking for help with a translation, you can try posting in the forums. The comic is released under a Creative Commons license (Attribution-ShareAlike), so you are free to teach with it, color it, modify it, share it with your friends, translate it, and basically do whatever you like with it! English: The complete comic book is available for download here: “Soldering is Easy” Comic Book (PDF) We also have some other versions of the comic available: FullSolderComic.mobi – Amazon Kindle version by bloo ePub version by Hal Motley (contributed Feb 18, 2018) FullSolderComic_Booklet_11x17_EN.pdf – An 11×17 version that you can fold into an actual comic book (with 8.5×11 pages). FullSolderComic_Images_20110409.zip – 300 DPI images of each page FullSolderComic_NoText_20110409.zip – 300 DPI images without text (for translation) A PDF version without text is also available. FullSolderComic.zip – the Comic Life source file used to create all of the other versions. This is probably the best place to start if you are making a translation, but you’ll need a Mac and a copy of Comic Life. Translations: PDF File Language Translators Arabic Ahmed Mo’ni Azerbaijani Orkhan Amiraslan 焊接是容易的 简体中文版 Chinese (Simplified) XinCheJian 焊接是容易的 繁体中文版 Chinese (Traditional) XinCheJian Lemiti je lako Hrvatski Croatian Ivan Matacic PÁJENÍ JE JEDNODUCHÉ Český Czech Jindra Fučík Det Er Nemt At Lodde Dansk Danish Jesper Haffgaard Iedereen Kan Solderen Nederlands Dutch Ivo van den Maagdenberg Alt. translation by Deeeep Jootmine On Imelihtne Eesti Estonian Markus Järve Souder c’est Facile! Français French (updated May 2015) Snootlab Löten ist einfach! Deutsch German Alexander Bodora Richard Meinsen Οδηγός Για Εύκολη Συγκόλληση Ελληνικά Greek F.N. Forrasztani Egyszerű Magyar Hungarian dnet Menyolder Itu Gampang Bahasa Indonésia Indonesian Rudi Voon Saldare E’ Semplice Italiano Italian Michele Maffucci ハンダ付けなんて簡単だ！ 日本語 Japanese Yoshi Det Er Enkelt A Lodde Norske Norwegian Henrik Sandaker Palm Lutowanie Jest Proste Polski Polish Mark Solder É Fácil Português Portuguese (Brasilian) Radamés Ajna Este Ușor Să Lipeşti Română Romanian Andrei C. PapucAlexander Bodora ПАЯТЬ ПРОСТО Русский Russian (new updated and colorized version!) AtarityAlternate black and white version Solder es Fácil (Version 1) Español Spanish SGTECH 2nd translation by juani_c Att Löda Är Lätt! Svensk Swedish Christopher Eriksson Lehím Yapmak Kolaydir Türkçe Turkish Uğur Arıcı Özcan Oğuz Паяти — просто українська Ukranian Ukranian Maker Association Special thanks to Alexander Bodora for creating the original version of this table! And really, soldering is easy (and fun!). Learn how to solder and teach your friends! Share this:FacebookTwitterLinkedInRedditMoreEmailPrintLike this:Like Loading... Related Related posts: LÖTEN IST EINFACH (Soldering is Easy: German Translation) Soldering is Easy Comic Book turns 1 Soldering is Easy Comic Book now available for the Kindle Improved Dutch translation of ‘Soldering is Easy’ Comic Book Solder É Fácil (Soldering is Easy – Portuguese Translation) avrbookfeaturedsoldersolder comicsolderingtranslation"
