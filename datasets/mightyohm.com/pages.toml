full_description = "Announcements HV Rescue Shield Kit Blowout! Kits are now 50% off at Amazon.com March 29, 2024 Jeff 2 Comments For a limited time, my AVR HV Rescue Shield kit is on sale for 50% off at Amazon.com. These kits are handy for modifying the fuse bytes on many popular Atmel Microchip AVR microcontrollers. The Rescue Shield works even when traditional serial programmers can’t talk to the AVR. This can happen if the AVR’s clock source isn’t set correctly or reset is disabled. Using this shield, you can effectively “unbrick” your AVR. You’ll need a standard Arduino (not included) to use the shield. There’s software and lots more information on the kit page. Get one while supplies last! Sale runs through April 1st. Share this:FacebookTwitterLinkedInRedditMoreEmailPrintLike this:Like Loading... Related Related posts: Super Cyber Sale – Geiger Counter Kits are 20% off @ Amazon Rescue your bricked AVR micro with the Rescue Shield, now back in stock! HV Rescue Shield Kit Sale, 50% Off @ Amazon.com amazonAVRhvrescuekitssale Larry says: March 29, 2024 at 8:04 pm I just checked on Amazon. Currently unavailable according to Amazon. Will it be stocked again? Larry (Tokyo Japan) Loading... Reply Jeff says: April 1, 2024 at 9:50 am Hi Larry! There are kits available on amazon.com. If you are accessing the Japanese site you may not see inventory in stock. Try shopping on Amazon.com (the US site) instead. Loading... Reply"
