full_description = "start Table of Contents Welcome to the MightyOhm wiki! Product and Support Information Projects Other Resources Latest blog posts Welcome to the MightyOhm wiki! Lost? Maybe you are looking for the blog, the forums, or just want to start at the top. Default access is read-only. To create/edit pages you need to be a registered user. Notice (3/5/11): The new spam filter is occasionally preventing edits to existing pages because they are being marked as spam (usually due to tinyurl or eBay links). If you are a registered user and you are having problems editing a page due to an error like “This page can't be saved because it contains spam”, please post a message in the support forum. Product and Support Information Information and support information pertaining to products designed by MightyOhm and sold on mightyohm.com: Geiger Counter - Information about the MightyOhm Geiger Counter Kit HV Rescue Shield - Information about the HV Rescue Shield and HV Rescue Shield 2 Projects Other projects that have been featured on the site: Wifi Radio - Information about the mightyohm.com Wifi Radio project DIY PID-controlled Soldering Hotplate - PID controllers and other information related to my hotplate project. Other Resources New Electronics - Places to find electronic components, tools, and other stuff you might need. Surplus Electronics - Places to find stuff you didn't know you needed, often used. Many also sell new items. Components - Datasheets and other component information. PCB Resources - Printed Circuit Board manufacturers and other resources related to PCBs. Lab Supplies - Solder and other lab supplies. Software Tools - Handy software tools for working with electronics. Hardware Tools - Every engineer loves toys. Here are a few favorites. Test Equipment - Electronic test equipment information, manuals, etc. PID Controllers - Information about PID (sometimes called Process) Controllers. There's a separate page for the common CD101. StereoStar - AO S