["https://miguelmalvarez.com/2023/06/16/new-chapter-pushing-innovation-in-legaltech"]
title = "New chapter pushing innovation in LegalTech – The Practical Academic"
description = "A year ago, almost to the day, I published an article about my decision to step down from Signal AI. Over the past year, I have advised several startups and organisations on matters related to data science, product and entrepreneurship strategy and have also done some angel investments. I also took this opportunity to decompress…"
full_description = "A year ago, almost to the day, I published an article about my decision to step down from Signal AI. Over the past year, I have advised several startups and organisations on matters related to data science, product and entrepreneurship strategy and have also done some angel investments. I also took this opportunity to decompress a bit and finally embark on some of the travel plans I had postponed for years. It has been an incredible year for personal growth, and now is time for my next professional adventure. I am thrilled to announce that I will be joining Law Business Research (LBR) as the new Director of Innovation and AI, working again on the intersection between data science, product and business. LBR holds a special place in my heart. Back in 2012, during my PhD, I worked as an NLP researcher at Globe Business Publishing, where I contributed to the tagging capabilities of a product called Lexology. Although my time at Globe was brief (just a couple of months), it was enough to collaborate with exceptional individuals and start friendships that have endured for years. Globe later merged with LBR so my new chapter is, in a way, a continuation of an old one, and I couldn’t be more excited. LBR leverages technology to support the global professional services sector with intelligence, analytics and performance data. This includes, among others, proprietary, time-sensitive data, insight, expert research, and sophisticated tools and networking. At its core, LBR employs technology to analyse legal content, including vast amounts of proprietary data, law firm memos, litigation documents, legislation and regulatory change. As the Director of Innovation, my role will be to expedite efforts in harnessing the latest advancements in AI and NLP, unlocking the potential of this wealth of data and other company assets to generate tangible value to our clients. It is incredibly exciting to embark on this new chapter with a company where I already know many of its talented people. Beyond the team, I am eager to make a lasting impact on the legal industry and extract client’s value from LBR’s extensive proprietary data and insights. Share this:Click to share on Twitter (Opens in new window)Click to share on LinkedIn (Opens in new window)Click to share on Facebook (Opens in new window)Click to email a link to a friend (Opens in new window)Like Loading... Related Posted in General"
