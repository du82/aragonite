full_description = "Secondary school specializing in IT Was working with boring basics, at this time I already knew PHP/JS and other languages. Here I'm working with elixir, erlang and the OTP. My roles are the overall architecture of the project, infrastructure stuff, security, writing elixir code, and other tasks I get assigned. Here I did work with the recruitment of the team, security and I'm also working externally with Statens Vegvesen with their Identity Management IT team, managing access control and users. Helped out on a rewrite of the I2P router in C++. Writes a patch or two once in a while the past years. Working mainly with java, python, security, management and other fun stuff in the darkweb on my spare time. From 2018-2020 I also worked fulltime for the project while on temporary leave from Knowit AS. For now it's mostly just been a playground for testing of new server technologies and smaller projects. Sigterm AS is the main download mirror for I2P, we also run the only preshipped exit node. Some new exciting project might show up soon :) Sigterm is a registered ISP at RIPE and has it's own IP blocks. Started with working mainly with java, scala, C# and javascript projects, micro services and some server administration, which later on became more security, distributed systems, platform architecture and research. I was working on Oslo Kommune's microservice architecture and their initial steps towards kubernetes. As well as maintaining their security components. Worked mainly with e-commerce in php, but was also often doing more advanced tasks for the mother company Copyleft AS. I've worked with php, javascript, ruby, python, C#, C++, server administration and many other technologies. I also worked remote from Cebu, Philippines in 2015 here. Was hired as php programmer, but ended up working with php, java, network infrastructure and server administration (Linux)"
