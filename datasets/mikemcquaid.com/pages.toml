title = "Talks | Mike McQuaid"
description = "Workbrew CTPO and Homebrew Project Leader"
full_description = '''Ruby on (Guard)Rails The guardrails I love in the Ruby ecosystem and why you should use and love them too. Workbrew - Homebrew for Mac Admins What are some problems that Mac Admins may have with Homebrew and how Workbrew solves them. Using "modern" Ruby to build a better, faster Homebrew Learn why Homebrew now ships its own Ruby, modern Ruby tooling we rely on, how to make Homebrew faster and how we are improving Homebrew. Homebrew's Evolution I look back at the last year of Homebrew and forward to what we expect to build in the next year. Open Source: boundaries, burnout, business Discussion of the current state of maintainer boundaries, avoiding burnout and economic/business aspects of open source software. Homebrew's Great Migration: moving to GitHub Packages with zero downtime Deciding between available options, compromises between Homebrew and GitHub, the hard deadline and using “soft power” to affect change. Building Effective Relationships In this talk I discuss the types of relationships to build as a staff+ engineer, deciding whether to start/stop/continue them and how to do this whether colocated or async and distributed. Homebrew: What's Happened and What's Next? What we've done since last FOSDEM, some of the features in development and how to test them before they are released. The Best Project The best project I ever worked on and what we can learn about software from the lessons I learnt. Ignorance, Incompetence and Insignificance: The Ingredients To Build Great Software Some heuristics to build better software, quicker by learning from the past, the present and the future in your software projects. Staff+: Career Progression Without Management The traditional route for progression in the software industry is from a senior-level individual contributor (IC), e.g. a senior engineer/marketer/data scientist/designer, into a management role. Homebrew: A Packagers Deep Dive A deep-dive on the interesting (both good and bad) aspects of the Homebrew package manager that will be interesting to other package manager maintainers or enthusiasts. Open Source Economics (is not what you think) What open source economics aren't, are and the solutions for open source economic problems. Robot Pedantry, Human Empathy What I’ve figured out to manage large numbers of open-source contributions pleasantly and efficiently. Homebrew: macOS Big Sur and ARM Changes needed to work on Big Sur and to support a new CPU architecture. Homebrew: Features and Funding How Homebrew introduces new features and encourages donations. Being Productive at GitHub Tips and tricks for being (more) productive as an engineer working at GitHub. Building Homebrew in Ruby Learn about things Homebrew loves, hates and struggles with because it is built in Ruby. Homebrew 2.0.0 The major features and community changes in Homebrew 2.0.0. How To (Not) Fail At Using Open Source Software In Your Organisation Learn how to use open source software in your organisation without succumbing to the most common of pitfalls. Working with others using Git and GitHub The basics of using Git and GitHub to collaborate on a multi-person software project. Effective Open Source Interactions Everyone is using open source software now but most people have not figured out how to interact effectively with the open source software community. Helping Yourself with Open Source Software Learn what open source software is, why you should contribute and what effectively run open source projects look like. The Power of the Open Source Community What makes an open source project successful, and what workflow tools GitHub has been building to help communities become happier places. Why People Don't Contribute To Your Open Source Project How users generally progress from filing bad issues to filing good issues to making simple contributions to making complex contributions to maintaining an open source project. Homebrew - Getting to 1.0.0 Learn about what went into Homebrew 1.0.0, how we got Homebrew ready to ship such a major milestone and why we decided to declare a 1.0.0 release after all these years. Remote Working: What, Why And How? Learn what remote working is, why employers and individuals should do it and how to do it effectively. How GitHub Builds Software See every step how we ship changes to github.com starting from a new, empty MacBook. The Open Source Contributor Funnel Learn how to encourage and increase participation in your open-source project. How To Become A Ruby Developer A webinar where I talk about Ruby, Rails and demonstrate submitting a pull request to Homebrew. Managing A Healthy GitHub Community Learn how to grow your open-source project’s community and ensure that it remains a healthy, happy and fun place. Homebrew - Things We Do Differently Some of the things that Homebrew does well, badly and the special challenges that OS X packagers need to deal with. GitHub For New Young People An introduction to GitHub for young people. Homebrew Kickstarter The video for the Homebrew Kickstarter project. Homebrew - Manage And Merge Many Pull Requests My workflow as a Homebrew maintainer. Homebrew - The Good, Bad And Ugly Of OS X Packaging Some of the things that Homebrew does well, badly and the special challenges that OS X packagers need to deal with. Building GitHub Enterprise (And Other Things) With GitHub The GitHub Enterprise development workflow. How I Got Into Programming A brief overview of how I got involved with programming and ended up working as a software engineer. Advanced Git (And GitHub) A walkthrough of some useful but rarely known features in Git and GitHub. GitHub For Beginners How to setup and use GitHub and the GitHub desktop applications. Career Hacks For Software Engineers How people in the technology industry can get paid better and get their dream job by learning from my career mistakes. Software Architecture, Process And Management (In the Real World) How software architecture, process and management plays out in the real world with some best practices and things to avoid. Homebrew How to install, use, file bugs, create and contribute packages to Homebrew with some history of the project along the way. HTML5 An outline for non-web developers of the new technologies in HTML5. How to make OS X users not hate you How to avoid the common usability failings of cross-platform OS X applications. Git For Beginners An overview of the essentials required to use Git. CPack Cross-platform packaging with CPack. Advanced Git A walkthrough of some lesser-known advanced features in Git.'''
