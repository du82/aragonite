title = "Making Dizzy Shiny With Ajax | Mike McQuaid"
description = 'Hypothesis: "Ajax applications can provide a more effective user interface than those of GUI desktop or classic Web applications with fewer drawbacks than either individual approach."'
full_description = '''Making Dizzy Shiny With Ajax 27 February 2007 Table of Contents Abstract Acknowledgements 1. Introduction 1.1. What is Ajax? 1.2. When is Ajax used? 1.3. What are the problems with Ajax? 2. Literature Survey 2.1. Ajax: A New Approach to Web Applications 2.2. Navigating the Applet-Browser Divide 2.3. Ajax: How to Handle Bookmarks and Back Button 2.4. DHTML accessibility: solving the JavaScript accessibility problem 2.5. Beyond Ajax 2.6. Web 2.0 Next Big Thing or Next Big Internet Bubble? 2.7. Beyond the Desktop Metaphor in Seven Dimensions 2.8. An Architectural Style for Ajax 2.9. Usability in Web Design 2.10. Emotionally centred design 2.11. Literature Evaluation 3. Background 4. Theory 4.1. Learnability 4.2. Flexibility 4.3. Robustness 4.4. Time Affordances 5. Specification 5.1. Lost functionality 5.2. Online problems 5.3. Solutions 6. Implementation 6.1. Feedback for long-running server-side tasks 6.2. Input validation from server-side parameters 6.3. Quickly modifying the output dataset 6.4. Save status without redirection 6.5. Feedback for lengthy client/server interaction 6.6. Input validation based on client-side data 6.7. Problems Encountered 7. Evaluation 7.1. Learnability 7.2. Flexibility 7.3. Robustness 7.4. Time Affordances 8. Further Work 8.1. SVG 8.2. More vigorous usability testing 8.3. Testing under poor network conditions 8.4. Security 8.5. Comet 9. Conclusion 9.1. Hypothesis 9.2. Benefits 9.3. Drawbacks 9.4. Contribution References Glossary Abstract "Ajax applications can provide a more effective user interface than those of GUI desktop or classic Web applications with fewer drawbacks than either individual approach." In this report, the preceding hypothesis was evaluated by developing an Ajax Web application for the Dizzy chemical kinetics stochastic simulator <[13]> and analysing the benefits and drawbacks compared with the existing Dizzy classic Web application and Dizzy GUI desktop application. Among the benefits were those of a more responsive interface, less bandwidth usage and allowing logic to be run on the client. The drawbacks included the challenge of ensuring cross-browser compatibility, unfamiliarity to the user, JavaScript debugging issues and the time-consuming nature of re-engineering an existing Web application. Acknowledgements Thanks go to: Project supervisor Stephen Gilmore and group supervisor Julian Bradfield for guidance and help. John Oberlander for clarification and help with HCI issues. Gareth Saunders and Patrick Thomson for greatly aiding my proof-reading of this report. The developers of Firebug, Subversion and Eclipse for invaluable debugging and development tools. Team Klingon: Chris Paton, Charles Harley, Benjamin Rollinson, Colin Silcock, Iain Hendry, Raj Khokhar, Alan Campbell, John Mark Ritchie and Alistair Strachan for the development of the classic web application and Alistair Strachan’s help with the existing code base. The developers of Batik, Apache Commons and JFreeChart for the used libraries. Steve Moitozo for the Password Quality Meter. Lindsay McQuaid for support. 1. Introduction 1.1. What is Ajax? Ajax is shorthand for "Asynchronous JavaScript and XML" and is a recent technique for developing more interactive Web applications, allowing faster input and better usability, striving for similar interfaces to those provided by GUI desktop applications. Figure 1 shows the main differences between a classic Web application and an Ajax Web application. Figure 1. Comparing Ajax and classic Web application models (Copyright Adaptive Path, LLC 2005) A classic Web application sends a request to a server which generates the page, perhaps from a database, returning a page which is then displayed in the client’s browser. On each new page request or the retrieval or submission of new data, the whole page must be re-requested from the server. An Ajax Web application follows the same pattern on the initial retrieval of a page, however, when new data needs to be sent or received from the server, instead of re-requesting the whole page, the browser can call a method written in JavaScript. JavaScript is a browser scripting language and in this case can be used to retrieve the data asynchronously. This data is normally returned as XML, which is then parsed by the JavaScript and used to modify the DOM and CSS of the page. Figure 2 compares the typical interaction model between a classic Web application and an Ajax Web application. Figure 2. Comparing Ajax and classic Web application client/server interaction (Copyright Adaptive Path, LLC 2005) The classic Web application requires user activity to take place then be submitted to the server and the data must be processed and returned successfully to the client before the user can commence any more interaction. The Ajax Web application allows continuous user activity. On certain events JavaScript functions will be run by the browser, allowing client-side processing of data, such as input validation. If necessary, this data can then be sent to the server and/or the server return more data. This usage pattern is closely similar to that of a GUI desktop application where the user does not typically have to wait for the completion of tasks and can work without worrying about manually initiating interaction with the "server". 1.2. When is Ajax used? With increased bandwidth now available to large proportions of the first-world population, Web applications are becoming feasible replacements for GUI desktop applications. This movement is known by some as "Web 2.0". One of ideas behind "Web 2.0" is the Web as an application platform, replacing GUI desktop applications, allowing cross-platform applications and allowing data to be easily shared and manipulated between machines in different geographical localities. The only prerequisites for these applications are an Internet connection and a relatively modern browser. The first wave of these applications to move online was email. There has been Web-based email for over 10 years and it is many users' sole way of accessing their email. Google’s email application, Gmail, was one of the first uses of Ajax technology on the Internet. For browsers that support Ajax, the user interface is similar to a GUI desktop application, with the ability to drag items and quickly open and close emails without the whole page reloading. With Ajax the goal of moving GUI desktop applications online may finally be realised. As shown in Figure 2, Ajax finally allowed the user of an Ajax Web application to have an uninterrupted workflow. This can potentially greatly boost their productivity, bringing it more in-line with that from GUI desktop applications, whilst keeping the benefits of a Web application such as distributed processing, no need for local backups, high up-time and portability. Now users and developers wishing to take advantage of Ajax have many options available to them. For developers, many Ajax libraries are now available, making Ajax user interface development as simple as importing any other library. Users can now find Ajax applications for word processing, spreadsheets, picture management, email, satellite mapping and more. 1.3. What are the problems with Ajax? Ajax technologies, while being useful to both users and developers, are still in their infancy. Ajax applications frequently suffer from niggling bugs such as "breaking" the expected functionality of the "Back" button, causing other unexpected browser behaviour and may have security risks. It is also currently unclear whether the claimed benefits of Ajax actually result in better user interfaces. The role of this project is to try and discover any benefits and problems and see whether Ajax Web applications provide interface improvements over classic Web applications and existing GUI desktop applications, whilst having fewer disadvantages than either individual approach. A literature review was conducted in order to discover the need for this discussion. An existing classic Web application was modified into an Ajax application after critically evaluating the user interface failings of the existing classic Web application and GUI desktop application. Finally, the new Ajax Web application was evaluated and through this the strengths and weaknesses of Ajax were discussed. 2. Literature Survey 2.1. Ajax: A New Approach to Web Applications The term "Ajax" was first used in "Ajax: A New Approach to Web Applications" <[2]>, an article about interaction design. The two examples referenced as examples of Ajax were Google’s Suggest and Maps services. Figure 3 shows an example of Google Suggest in progress. As search queries are entered, suggestions for the search query are displayed, updating almost instantaneously with no other user interaction. Figure 3. Google Suggest Figure 4 displays an example of Google Maps' usage. This figure does not convey the use of the interface as well as a demonstration, but the map can be manipulated by clicking and dragging around the map, and the map is dynamically loaded and updated, with no need to press reload. Also, take note of the shadow overlay from the Address "bubble", again, dynamically updated in real-time. Figure 4. Google Maps These applications are an example of what Adaptive Path called Ajax. Ajax makes use of the manipulation of XHTML and CSS, using the DOM, by JavaScript, and information retrieval and manipulation using XML, XSLT, XMLHttpRequest and JavaScript. The information retrieval is done by regular polling of XML data using JavaScript, providing the interactivity not existing in classic Web applications. At the time of this article, the main users of Ajax were Google, making use of it on their Gmail, Groups, and the aforementioned Suggest and Maps services, but it also saw use in Flickr and Amazon’s A9 search engine. The article provided a clear explanation of both the technical usages of Ajax, its implementation and merits, and paved the ground for future studies in using Ajax for rich-client applications. Although this article was the first mention of Ajax, analysis of the usability of related technologies have been seen before, albeit with different terminology, such as DHTML. 2.2. Navigating the Applet-Browser Divide Comparable issues to those spawned by Ajax have been analysed before, such as in "Navigating the Applet-Browser Divide" <[9]>. The feel of browser applets was very different to that of classic Web applications and raised similar usability problems to those encountered with Ajax applications. Users were found to instinctively press the browser’s "Back" button when intending to return to a previous stage in the applet process, which, if the applet had not taken this into consideration, wiped all progress they had undertaken so far in the applet, causing the user to have to start again. Again, applets brought claims of allowing the user to "dynamically interact with information", similar to those claims made today with the rise of "Web 2.0" and Ajax. This article contained the results from a usability study which found that users tended to depend on the browser navigation buttons to navigate through the applet. When navigation buttons were provided inside the applet the users were found to have fewer problems with integration and navigation. This article also highlighted the now so-relevant issue of ensuring compatibility between browsers. 2.3. Ajax: How to Handle Bookmarks and Back Button The issue with the "Back" button was further explored in "Ajax: How to Handle Bookmarks and Back Button" <[8]> . The problem was raised by using Gmail as a case study. Once a user enters Gmail, at the time of publishing, the URL remained the same throughout the session, so if a user entered an email message, and then wished to leave the message and go back to the inbox by clicking the browser’s "Back" button, to their surprise they would find themselves out of Gmail. 2.4. DHTML accessibility: solving the JavaScript accessibility problem Before the term "Ajax" became popular, some of the technologies used were referred to as DHTML. "DHTML accessibility: solving the JavaScript accessibility problem" <[3]> discussed some of the other issues arising from the usage of these technologies, focusing on the difficulty in providing content accessible to those with disabilities when the application relies on JavaScript. The main problems highlighted were dealing with focus on dynamic content and providing semantic data for GUIs, to allow the use of purely text-based input and display. It also called for a paradigm shift to ensure that interfaces are all usable through a keyboard interface and other assisting technologies, hopefully providing interfaces that can be better than the existing alternatives for disabled users. 2.5. Beyond Ajax "Beyond Ajax" <[4]> discussed both the potential of Ajax Web applications and their limits. The first limit shown is that Ajax applications cannot allow realtime event notification, instead requiring a polling loop; the more regular the poll, the more bandwidth and processing used, both on the client and server. The second limit raised is, that although most processing-intensive tasks can and have been made into Web applications, the GUI desktop equivalents provide certain advantages. An example of this is direct hardware access, which is not possible without browser plugins, such as Adobe’s Reader or Flash, the latter providing video and audio recording, with user-controllable security levels (see Figure 5). This paper showed some of the possible advantages of Ajax such as dramatic bandwidth savings in leveraging the transfer of XML using JavaScript rather than reloading whole pages. However, the benefits and costs of migrating GUI desktop applications online must be weighed up, with respect to security, bandwidth, response and interactivity issues. Figure 5. Adobe Flash’s multimedia privacy settings 2.6. Web 2.0 Next Big Thing or Next Big Internet Bubble? The term "Web 2.0" was first used publicly by O’Reilly Media as a name for a conference in 2005. It has become rather popular in technology circles, describing the rise in the use of Ajax and other XML technologies and also the growth of Web-based communities around these technologies. "Web 2.0 Next Big Thing or Next Big Internet Bubble?" <[1]> emphasised the large number of technology start-ups based on these concepts and made comparisons made to the "Dot Com Bubble". This article highlighted the use of a "Rich User Experience", which refers to the use of Web applications attempting to behave more like their GUI desktop counterparts. Also, the importance of dynamic content, user participation, metadata and markup were raised, allowing a way for users to both create and find information more effectively. This article reiterated the previously mentioned issues accompanying Ajax technologies, such as lack of JavaScript availability and "breaking" the "Back" button, also the difficulty of bookmarking dynamically gen'''
