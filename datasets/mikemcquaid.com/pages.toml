title = "Make Qt Use The GTK Style On XFCE or Xubuntu | Mike McQuaid"
description = "I’m a Qt developer and use Xubuntu in my Linux VMs as it is lighter than KDE and doesn’t get in my way (unlike Unity)."
full_description = '''Make Qt Use The GTK Style On XFCE or Xubuntu 01 December 2011 I’m a Qt developer and use Xubuntu in my Linux VMs as it is lighter than KDE and doesn’t get in my way (unlike Unity). By default there is a problem with QGtkStyle which stops it correctly picking up the GTK theme as XFCE does not save it in the usual place. To fix this we can use a simple script: # !/bin/sh DEFAULT_XFCE_THEME=greybird XFCE_THEME=$(xfconf-query -c xsettings \ -p /Net/ThemeName 2>/dev/null) GTK2_RC_FILES=$HOME/.config/xfce4/gtkrc [ -z "$XFCE_THEME" ] && XFCE_THEME=$DEFAULT_XFCE_THEME echo gtk-theme-name = $XFCE_THEME > $GTK2_RC_FILES unset DEFAULT_XFCE_THEME unset XFCE_THEME export GTK2_RC_FILES . /etc/xdg/xfce4/xinitrc Put this script into $HOME/.config/xfce4/xinitrc and ensure it is executable by running chmod +x $HOME/.config/xfce4/xinitrc. Latest Articles Ruby on (Guard)Rails Our Intentions Don't Matter How I Procrastinate Less More Effective Remote Working My Favourite Open Source Engineering Books Subscribe to be notified about new content'''
