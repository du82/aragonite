["https://mikemcquaid.com/research-study-interview-work-of-maintaining-open-source-software"]
title = "Research Study Interview: The Work of Maintaining Open Source Software | Mike McQuaid"
description = "I was recently interviewed as part of a research study into the work of maintaining open-source software. I asked if I could make the (lightly edited) transcript public and they agreed. This will be an interesting read for anyone interested in some of the deeper questions about maintaining a project like Homebrew for 10 years."
full_description = "Research Study Interview: The Work of Maintaining Open Source Software 20 May 2019 I was recently interviewed as part of a research study into the work of maintaining open-source software. I asked if I could make the (lightly edited) transcript public and they agreed. This will be an interesting read for anyone interested in some of the deeper questions about maintaining a project like Homebrew for 10 years. What are the open source projects that you regularly contribute to? The main one would be a project called Homebrew: it’s a Mac package manager. And then, there’s some projects of my own, such as one called Strap, that’s probably the most like widely used one created by me. And other kind of random bits and pieces periodically. How often do you work on those? Homebrew - I work on basically every day. And then, the Strap probably once a week, or a couple times a month. And then the rest… again, when it comes down to it, it just varies a lot. Every day? Yeah, for Homebrew, every day, pretty much. How long would you say per day that you work on Homebrew? Probably zero to two hours. Wow. Have you ever been paid to contribute? Not to the Homebrew project. I have been paid for open source work in the past. And not specifically, it wasn’t framed like that, where someone was like, “Hey would you like to contribute this thing for money?” But it’s been, during the course of my employment, I needed to contribute. Indirectly, I guess I have contributed to Homebrew in that way, and so yeah, indirectly, through my employer, I’ve needed to make changes in Homebrew while being paid. Right. If you had to say what tasks you were paid to do for Homebrew, or for an open source project? I guess feature development and bug fixing. Moving on from that. In your best estimate, how many people would you say actively contribute to Homebrew? So yeah, how many people would you say actively contribute to Homebrew in some way? We’ve had over seven thousand people, like at all, ever. On a given month, you’re probably talking hundreds of people. How many people contribute at the same level that you contribute? That’s a tricky one. So I’m the project lead now, and in that respect, probably no one. In terms of the amount of time they spend on it, and I spend on it, over a longer a period, on a day-to-day basis it’s kind of hard to know in terms of time people spend because you just see the artefacts. Again, there’s probably tens of people who are spending more than an hour a week, I would say. Less than a hundred, more than 10. What kind of work do you generally do? I do a bit of everything, from feature development, bug fixing, triaging, user issues, helping, helping users figure out solutions to their problems, as well as kind of system administration tasks, and then like some documentation. Also what’s almost like people management - directing what people could or should be working on. A certain amount of mentorship probably, as well. Is there work that you do that you think you’re one of the only ones that does that particular task? Yes, yes. There’s quite a few, unfortunately, where I’m the only person. What do you mean by that? For example, today, to be very specific, we have an automated testing system that we run ourselves. Because none of the stuff available for free or at the market works for our needs, yet. I’m mostly the main person who’s kind of set that up, and knows how it works. So when it breaks, it’s generally me that is involved with fixing that. And so, if I was hit by a bus, people would maybe eventually learn how to fix that, but it would probably be a little bit difficult for people to get there. But yeah, on a day-to-day basis, when stuff like that breaks, it’s generally me who fixes it. Okay. I’m curious - what do you think that means - to be able to do a task that no one else in the project is working on? Sure. I guess it simultaneously feels good, and feels bad in that it’s nice to feel valued, and important, and whatever. But then, at the same time, it doesn’t particularly bode well for the future, which is why, with tasks like that, we’re trying to sort of either eliminate the task, or figure out how to get more people involved in stuff like that. Because, obviously, it doesn’t work very well if something happens to me. I also have one, and soon to be two small children. So they occupy significantly more of my time than I’m able to spend doing stuff like this. Historically, I have the Homebrew chat application on my phone, and if someone sent me a message saying something was broken, I’d pretty much drop what I was doing, and go, and fix it. And I don’t do that anymore, because it interferes with family life. So yeah, it’s tricky. Alright. It sounds like you’re doing a lot of really good work for this project. Thank you. That is very heavily relied on by many people. Yes. Again, which is simultaneously a nice, and not-nice thing. One of the ways some are starting to frame open source projects is as, infrastructure. How would you respond to that term? Yeah. If you’ve been at all inspired by Nadia Eghbal, her and I used to work in the same team together. I would very much agree with that description of open source infrastructure. Particularly certain things feel more “infrastructurey” than others. And some open source stuff is very like a product, and it just so happens to be open source. And then some stuff - Homebrew would be an example - where it’s being used primarily, if not exclusively, by developers in order to build other software. So that description feels apt, because it’s not being used for it’s own sake, but in order to help for something else. Like a stepping stone? Yeah. I wanted to ask a question that I should have asked earlier, which was if you have a formalised role in the project? Yep. So I’m the “project leader”; that’s my official project title. And on that we’ve added a bit more governance and structure. So as of this year that was an elected position, which I was elected to. And I’m also on the project leadership committee and the technical steering committee. The reason why is I guess having formal roles is part of being a maintainer for the project. How did you get those roles? All of those roles are now, as of February, elected positions. So I was elected to each of those roles. How do they have elections? So we’ve only done one so far. So basically we had and are going to have in the future a annual general meeting. I can send you, if you’re interested in some of it, we have all written up basically how the governance process all works. That’d be great, yeah. See: Homebrew Governance. Okay. So I wanted to talk more specifically about some of the work that you do. First, how do you decide what you spend your time contributing to? It’s a combination of what I find interesting or fun and what I find important and things that I think only I can do. So things may lean more in one direction or another. Ideally it is something which is in all three of those categories, but then if it’s something where I know a bunch of other people can do it, but I quite want to and I’ll find it entertaining to do that, then I may well do it. And in a similar way, there’s a bunch of stuff that, I mentioned earlier, which only I can really do at the moment and I would rather I didn’t have to do that stuff. My day job is pretty far from that and no one else can do it right now, so I kinda have to. How would you say the immediacy of needing to fix things plays into that? Yeah, good question. I think that certainly defines what I choose to work on. This particular issue we had today, for example, I have kind of a longer-term project to try and replace this stuff. But then a bunch of higher priority things keep getting inserted above there in my to-do list. So it becomes harder to get around to that. So I’m probably going to, in the next month or so, take like a week’s vacation and just try and focus just on doing this and nothing else, so I can get it off my plate before my child is born. So let’s see. What has been a difficulty of contributing? The stuff that’s probably hardest is just dealing with people. The software side of things generally, is relatively easy. I mean even the stuff I don’t really want to do, I can just do it and it’s fine. But then you know, sometimes people are conflict adverse or conflict happy or rude or entitled or whatever it may be, and that kind of ends up being problematic. I guess in the past few years, like a lot of human relationships, the most troubling ones are when there’s actually a closeness there. So although if get kind of abusive comments and it’s someone you’ve never talked to before, then that’s fine. Whereas we’ve kind of had conflicts between some maintainers and various allegations that get made and things like that. And like the lines start to blur a bit between. I guess it’s almost like in a workplace, where you have people who you work alongside, but then they’re asking you to kind of help out and intervene in their personal life and stuff like that, and you do that, but that ends up causing issues and this sort of thing. You said you have governance policies, do those extend to this kind of thing. Yeah so we have a code of conduct document as well which sort of defines the high level behaviour that is expected of people. That basically is what makes it - particularly with, random individuals you have no contact with - if their opening comment on the project is one that is racist or sexist or whatever it may be - then that makes it very easy to be like well we said this, you were pointed to this to get involved in the project, therefore you get blocked from the project or whatever it may be. We do have guidelines for how maintainers shouldn’t talk to each other, but obviously those lines are a bit more blurry. Even culturally, when you work with people from the U.K. and the U.S. and Russia and China and places, what is considered respectful or rude or polite or helpful - typically when most of your communication is textual is quite broad and open to interpretation - it’s kind of tricky. So it sounds like people have worked on easing the difficulty of when things come up in the social side of the project, and try to make it a good environment? Yeah I think so. Yeah that’s fair. What tools do you use to work on, or to contribute to Homebrew? And I’m using tools in a really broad sense. Yeah, cool. So GitHub and the products that it’s hosted by. I use that pretty heavily. I use Git the version control system and I use Visual Studio Code. Currently it’s my text editor of choice and then I use a plethora of other open source tools to do bits and pieces here and there. Those initial three would be the main three things that I use. You mentioned using open source tools. What is your relationship with open source, itself? Some treat it as political, some might treat it pragmatically in terms of development, etc. There are different perspectives on what it means. I’m just curious how you relate to open source? Yeah, so for me it’s partly a pragmatic thing. Working as a professional software developer, it makes life easier working with open source software than with closed source software in general. Because when I have problems I can peak underneath the hood and make modifications and such. I guess the ideological part, I used to maybe be more into. I still think that ultimately if I could choose between most software being open source or not… if I’m picking between a tool that I’m going to use, for example, my text editor, I prioritise using an open source, maybe slightly inferior text editor where a closed source may be a slightly better one. But it would not be completely overruled if there was one that was vastly better, than closed source or vastly inferior, whatever it may be. And yeah, I generally see - in terms of my personal contributions - I generally see open source as being a kind of very, minimal sort of charitable work. I don’t think it’s the same as volunteering at a homeless shelter or whatever. I feel like that’s a lot more worthy. But I feel like it’s not net negative and it’s probably very slightly above net-neutral for the world. Particularly the project I work on. For it to be useful - well I guess we’ve opened up a little more - but historically, for it to be useful you need to be using a Mac, and that’s a subset of the world and a relatively privileged subset at that. I see it as being positive, but not overwhelmingly so in that respect. Open source in general, I feel, is a valuable, positive contribution that has levelled the playing field. Organisations, individuals and companies with different levels of money now don’t have vastly different tools, as a lot of them are now sharing the same playing field, in terms of their open source tooling. How did you decide on which license to put on Homebrew? So I’m not the original creator of the project. The original creator, - well, I’m not 100% sure why, but I could speak to other projects in which I’ve ended up using the same or a very similar license. Broadly I see there being a couple of main camps. You’ve got the copyleft camp of free software people, who generally want everything to be open source and they want to try and use their software as a means to accomplish that end, so they ensure their software is not used in closed source software. It forces closed source software to become free or open source software, in theory at least. And then the permissive license camp, which I’m probably more at, which is the if you build something you don’t really care where it’s used. It’s more about it just being useful and you would like it to be able to be adopted by as many people and as may organisations as possible. So, I’m probably more in the latter camp for most things I build. But I choose on a project by project basis. Like, if a large company took this code and did something with it and made money off it, would I care or would I see that as being a good thing or a bad thing or whatever. And if I would see that as being a bad thing, I would maybe go for a copyleft license, and if I see that as being a good thing I would go for a more permissive license. Okay. I want to go back to the pace of contribution. Have you ever been a regular contributor to a project, a open source project, but then stopped contributing? Could be Homebrew, could be something else. Yeah I guess there have be a few other projects I worked on and stopped. And I guess there’s parts of Homebrew that I mostly don’t contribute to anymore. Can you tell me about that? Why you might have stopped doing something and started doing something else? Or dropped an aspect of participation? I guess it’s generally a factor of where I’m not really using the tool anymore. And what generally, pretty much all the open source projects that I ever contributed to, I’m using them at work or for some hobby project or whatever it may be. And I’ll generally cont"
