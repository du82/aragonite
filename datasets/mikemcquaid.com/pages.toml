["https://mikemcquaid.com/ibm-cell-sdksdk-for-multicore-acceleration-on-debianubuntu-howto"]
title = "IBM Cell SDK/SDK For Multicore Acceleration On Debian/Ubuntu HOWTO | Mike McQuaid"
description = "Today I battled with trying to get IBM’s Cell SDK 3.0 (now known as the SDK for Multicore Acceleration) installed on my Debian AMD64 machine. This would cause slight grief even with a regular Debian machine as IBM only formally supports Fedora and RHEL so only provides RPMs. This is worsened by the fact that a bunch of the packages aren’t even available from IBM but require perusal of some provided yum configuration files to find."
full_description = '''IBM Cell SDK/SDK For Multicore Acceleration On Debian/Ubuntu HOWTO 15 December 2007 Today I battled with trying to get IBM’s Cell SDK 3.0 (now known as the SDK for Multicore Acceleration) installed on my Debian AMD64 machine. This would cause slight grief even with a regular Debian machine as IBM only formally supports Fedora and RHEL so only provides RPMs. This is worsened by the fact that a bunch of the packages aren’t even available from IBM but require perusal of some provided yum configuration files to find. Firstly I recommend you download the CellSDK-Devel-Fedora_3.0.0.1.0.iso and CellSDK-Extras-Fedora_3.0.0.1.0.iso (current at time of writing) from somewhere (unfortunately IBM no longer hosts this download). Then when you have downloaded them mount them somewhere on your filesystem. mount -o loop $HOME/CellSDK-Devel-Fedora_3.0.0.1.0.iso \ /tmp/CellSDK-Devel-Fedora/ mount -o loop $HOME/CellSDK-Extras-Fedora_3.0.0.1.0.iso \ /tmp/CellSDK-Extras-Fedora/ We’ve downloaded the two RPMs by IBM. If you install these on Fedora they will provide you with some yum repositories for the Barcelona Supercomputing Centre. These will need to be downloaded manually as we aren’t on a RPM-based system. If you are running Ubuntu Gutsy on x86_64 or x86 run: apt-get install ppu-gcc ppu-gdb spu-g++ \ spu-gdb cell-programming-primer If you are running Ubuntu Gutsy on the Cell run: apt-get install cell-sdk Otherwise run the following: apt-get install wget #Install wget if it is not already mkdir openrpm cd openrpm wget -l 1 -c -np -nd -r <http://www.bsc.es/projects/deepcomputing/linuxoncell/cellsimulator/> -A .rpm The above assumes you are on an x86_64 machine. If you are using the Cell, a regular x86 or a PPC 64-bit machine change the ‘x86_64’ to ‘cbea’, ‘x86’ or ‘ppc64’ accordingly. The following instructions apply regardless of your Debian/Ubuntu variant or architecture. Next, if we are on x86_64, we want to create a nice little script to handily convert the i386 architecture files to amd64 so they will install nicely when we convert them to debs. This is safe as all the stuff these packages install gets chucked into /opt/. I recommend we name it “fixcelldebsarch.sh” and stick it in your $HOME. This is only necessary if you are on x86_64 not x86 and (probably) won’t work on the Cell or another PPC64. # !/bin/bash # ~/fixcelldebsarch.sh OWD=`pwd` for i in `ls -d */` do cd $i sed -ie 's/Architecture: i386/Architecture: amd64/' \ debian/control dpkg-buildpackage cd "$OWD" rm -r _/_.gz _.changes_.dsc done (Thanks to Jon for the fix to avoid mess when using symbolic links.) Next we want to convert the various RPMs into DEBs for our Debian system so the dependencies are nicely handled and they can be uninstalled. Install the ‘alien’ package if you have not already. On the following lines replace the occurrences of ‘/x86_64/’ with ‘/cbea/’, ‘/x86/’ or ‘/ppc64/’ using the same criteria as above. cd open for i in ../openrpm/*.rpm do alien --scripts $i done ~/fixcelldebsarch.sh #Only needed on x86_64 dpkg -i*.deb cd devel for i in /tmp/CellSDK-Devel-Fedora/x86_64/*.rpm do alien --scripts $i done ~/fixcelldebsarch.sh #Only needed on x86_64 dpkg -i*.deb cd extras for i in /tmp/CellSDK-Extras-Fedora/x86_64/*.rpm do alien --scripts $i done ~/fixcelldebsarch.sh #Only needed on x86_64 dpkg -i*.deb It should have been fairly obvious what was going on above. This should have installed all the necessary packages for the Cell SDK without breaking your system and allowing Debian/Ubuntu packages to override these versions. I hope this all works; if anyone spots any typos, has any suggestions or needs any help then give me a shout! Updated: Added Gutsy information. Thanks Bart! Latest Articles Ruby on (Guard)Rails Our Intentions Don't Matter How I Procrastinate Less More Effective Remote Working My Favourite Open Source Engineering Books Subscribe to be notified about new content'''
