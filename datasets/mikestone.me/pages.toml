full_description = "Questions Smart People Hate February 10, 2025 I ran across one of those click-bait articles today about 12 questions smart people hate being asked. I’m not going to link you to the article because it absolutely is stupid click-bait and I don’t want you clicking their stupid crap links. Superbowl Sunday February 9, 2025 I’m not much of a football guy. I played in highschool, but I’m not the sort that knows the plays and the players and the coaches and everything they’ve ever done their entire careers. I do appreciate a good game though. The Superbowl is quite probably the only professional game I’ll see this year. My kids have a habit of monopolizing the TV, and I have enough on my plate with being a parent, working full time, being the admin of a mastodon server, going to college, and trying to keep our house in working order to keep me busy most weekends. So, Chiefs vs. Eagles. Again. I can say with complete honesty I don’t care one bit who wins this thing. I’d probably lean towards the Eagles just because the Chiefs have already done it enough times, but I’m not going to lose sleep either way. Day 40 of the #100DaysToOffload Series. The Air Is Fine February 5, 2025 It’s pretty rare for me to test out a new browser, but there’s a new one running around out there that I just had to give a shot. Opera Air. TLDR: It’s fine. Reading of the Day February 4, 2025 Reading list for February 4th, 2025. Annnd We're Done January 31, 2025 Aaaaannnnnd we’re done. The house is empty. Nothing to do now except turn in the keys. Stupid Design Decisions January 27, 2025 I want to point out how even small design decisions can impact the lives of others in tangible ways. There are people out there who are making decisions on design that don’t seem to be thinking overly hard about what those decisions are going to mean. I’m going to take a relatively minor example from my own life to showcase this. This event is a tiny thing, and recent. It’s also not the only time something like this has happened. Almost There January 26, 2025 I know I’ve written about this multiple times by now, but it seriously is about the only thing I’m doing right now. We’re done with the old house on Friday, and today is Sunday. Five days and we’re done. Almost there. Reading of the Day January 24, 2025 Reading list for January 24th, 2025. New House January 19, 2025 I haven’t been around much lately. It has nothing to do with not wanting to be here, but I just haven’t had free time to do much of anything. I have my usual collection of things going on, and to top that off, we bought a new house at the end of December. Blog Questions Challenge January 6, 2025 I’m making it a habit copying Kev. Kev recently posted a Blog Questions Challenge that seemed like a fun idea. So, I thought I’d run with it for the first post of 2025."
