["https://mikestone.me/20250205-the-air-is-fine"]
title = "The Air Is Fine"
description = "Mostly The Lonely Howls Of Mike Baying His Ideological Purity At The Moon"
full_description = "The Air Is Fine 05 Feb 2025 It’s pretty rare for me to test out a new browser, but there’s a new one running around out there that I just had to give a shot. Opera Air. TLDR: It’s fine. If you’ve read more than a single post on this page, you’ve probably run into me talking about my favorite browser. I’m kinda insufferable about it. Just because Vivaldi is my favorite browser doesn’t mean I don’t go window shopping on occasion. I saw a post recently about Opera Air. To be quite honest, there’s a bunch of stuff in this browser that I’m frankly just not interested in. Some of the listed “features” are scheduled breaks for breathing exercises, neck training, and meditation. It’ll also play soothing sounds and music, which is something I guess. Honestly, the feature that most caught my eye was the minimalist design. It looks slick. There’s a little bar on the side that offers kind of similar functionality to what we see in Vivaldi’s side panel. It looks significantly more limited, but prettier. I also like the look of the address bar and the tabs, but the Opera Air version of Speed Dial is super annoying with it’s asymmetric icon/search layout. There’s also a little bar above the side panel for workspaces. This is also similar to the functionality you find in Vivaldi, but again more limited. To be fair, Opera Air is in Early Access. Being a full blown browser can’t be expected at this point. What I can say at this point is the browser looks really good. It’s lacking in almost all the features I really like about Vivaldi, and the chances of me migrating to it on a permanent basis are almost zero, but it looks really good. I hope Vivaldi pays attention to this release becasue I think there’s some thing they could incorporate to their theming capabilities. Functionality wise, other than adding a sound track to the web, Vivaldi wins on all fronts. Maybe after Air gets out of early release it’ll be more fair. Day 39 of the #100DaysToOffload Series. Looking for comments? There are no comments. It's not that I don't care what you think, it's just that I don't want to manage a comments section. If you want to comment, there's a really good chance I at least mentioned this post on Fosstodon, and you can reply to me there. If you don't have a Mastodon account, I'd suggest giving it a try. If you don't want to join Mastodon, and you still want to comment, feel free to use my contact information. Also, don't feel obligated, but if you feel like buying me a ☕ cup of coffee ☕ I won't say no."
