full_description = "Aaaannd we're back... 26 Mar 2015 And we’re back. Well, I am anyway. I tried an experiment the last couple weeks/months. I found that I wasn’t updating my blog as much as I’d wanted to be, and I was spending a lot of time on Google+. “Why not combine the two?” I asked myself. “What a brilliant idea,” I answered myself. So, I did. I forwarded my domain to my G+ profile, and I planned on putting up any “bloggy” type material on my G+ profile instead of using an actual blog. I didn’t reduce the amount of time I was spending there, but I found that despite the fact that I was spending more than enough time there to accomplish the task, I still wasn’t really blogging. Mission: Failed. My thought on the matter is, when I’m on Google+, there’s always something else to do other than put up a quality (loosely defined) post. Someone is always saying something interesting, so I just never get around to thinking about what I want to say. My brilliant plan moving forward? Roll back the changes and try the old plan again. What’s the worst thing that can happen eh? Looking for comments? There are no comments. It's not that I don't care what you think, it's just that I don't want to manage a comments section. If you want to comment, there's a really good chance I at least mentioned this post on Fosstodon, and you can reply to me there. If you don't have a Mastodon account, I'd suggest giving it a try. If you don't want to join Mastodon, and you still want to comment, feel free to use my contact information. Also, don't feel obligated, but if you feel like buying me a ☕ cup of coffee ☕ I won't say no."
