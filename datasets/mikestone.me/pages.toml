["https://mikestone.me/20250210-questions-smart-people-hate"]
title = "Questions Smart People Hate"
description = "Mostly The Lonely Howls Of Mike Baying His Ideological Purity At The Moon"
full_description = "Questions Smart People Hate 10 Feb 2025 I ran across one of those click-bait articles today about 12 questions smart people hate being asked. I’m not going to link you to the article because it absolutely is stupid click-bait and I don’t want you clicking their stupid crap links. What I will do is give you the questions that the article said smart people hate being asked so you don’t have to click the link and be annoyed by the advertising. What’s your IQ? Are you always this quiet? What’s the point of thinking all the time? Why do you care so much about that topic? Do you always ask so many questions? What’s the meaning of life? Can you solve this problem for me? Why do you overanalyze everything? Shouldn’t you have all the answers? Don’t you ever have fun? Why do you always need to be right? Do you think you’re smarter than everyone else? Now, I can honestly say that I almost never get asked any of those questions. I think there’s two reasons for that. I’m not actually that smart. I like to surround myself with people who are smarter than I am. Now, number one has a lot to do with the number two. Because I choose to associate myself with people who are smarter than I am, I realize that there are people who are so much smarter than I am in basically all respects, so the realization regarding my own intelligence is impossible not to reach. If you’re a person who doesn’t surround yourself with smart people, that odd person out who is intelligent probably sta nds out quite a lot more. I’m not claiming I’m stupid either. I’m on the smarter side of the bell curve, but half the people in the world are, so that’s not much to brag about. Despite that, I find these questions really odd. I guess I ‘ll have to defer to people who are smarter than I am. Do people really ask you these things enough for it to be annoying? Day 41 of the #100DaysToOffload Series. Looking for comments? There are no comments. It's not that I don't care what you think, it's just that I don't want to manage a comments section. If you want to comment, there's a really good chance I at least mentioned this post on Fosstodon, and you can reply to me there. If you don't have a Mastodon account, I'd suggest giving it a try. If you don't want to join Mastodon, and you still want to comment, feel free to use my contact information. Also, don't feel obligated, but if you feel like buying me a ☕ cup of coffee ☕ I won't say no."
