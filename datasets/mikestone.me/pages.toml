title = "No Available Internet"
description = "Mostly The Lonely Howls Of Mike Baying His Ideological Purity At The Moon"
full_description = "No Available Internet 23 Oct 2024 Well, that’s not exactly true, but close enough. I’m sitting here, and there’s a guest WiFi hotspot here. I pull out my laptop and connect to it like a blithering idiot connecting to random hotspots with no concern for my security. Does it work? Well, kinda? I can’t tell how fast the connection is. It won’t connect to anything on the web. I was able to pull down the repo that drives my web site, so I’m thinking that I’ll actually be able to publish this when I’m done typing it. I tried doing some brief updates to the system, and some of it work, but not all of it. This kind of harkens back to my earlier post about how my computer is virtually all web based applications. I have a computer here, and I could be doing all kinds of things, but none of those things are installed. Instead, I find myself complaining in a blog post written in vim. At least there’s vim. vim always works, no matter where you are. Thanks vim. Day 26 of the #100DaysToOffload Series. Looking for comments? There are no comments. It's not that I don't care what you think, it's just that I don't want to manage a comments section. If you want to comment, there's a really good chance I at least mentioned this post on Fosstodon, and you can reply to me there. If you don't have a Mastodon account, I'd suggest giving it a try. If you don't want to join Mastodon, and you still want to comment, feel free to use my contact information. Also, don't feel obligated, but if you feel like buying me a ☕ cup of coffee ☕ I won't say no."
