full_description = "Superbowl Sunday 09 Feb 2025 I’m not much of a football guy. I played in highschool, but I’m not the sort that knows the plays and the players and the coaches and everything they’ve ever done their entire careers. I do appreciate a good game though. The Superbowl is quite probably the only professional game I’ll see this year. My kids have a habit of monopolizing the TV, and I have enough on my plate with being a parent, working full time, being the admin of a mastodon server, going to college, and trying to keep our house in working order to keep me busy most weekends. So, Chiefs vs. Eagles. Again. I can say with complete honesty I don’t care one bit who wins this thing. I’d probably lean towards the Eagles just because the Chiefs have already done it enough times, but I’m not going to lose sleep either way. Day 40 of the #100DaysToOffload Series. Looking for comments? There are no comments. It's not that I don't care what you think, it's just that I don't want to manage a comments section. If you want to comment, there's a really good chance I at least mentioned this post on Fosstodon, and you can reply to me there. If you don't have a Mastodon account, I'd suggest giving it a try. If you don't want to join Mastodon, and you still want to comment, feel free to use my contact information. Also, don't feel obligated, but if you feel like buying me a ☕ cup of coffee ☕ I won't say no."
