full_description = "A New Markdown Editor 22 Nov 2024 A couple of days ago, I mentioned that I had resumed using Ghostwriter after a while of just using VSCode to edit my blog. I think I’ve found something better. For those who don’t want to click the link, this is what I said a couple days ago: I installed for one of my college classes and have been using to do blog posts as well, back to a much more simple Ghostwriter. That’s more of an impulse choice at the moment. I used Ghostwriter years and years ago, and when I searched for markdown in the software store it was one of the first choices that popped up. I might find something new and interesting to replace it eventually, but for the time being it’s doing the job. Now, Ghostwriter is fine. It’s fine, but one thing I missed a lot from VSCode was having my folder list on the left so I can casually move between files. The functionality is kinda there, but only kinda. It wasn’t really tickling my fancy. It did the job, but only barely. I started looking around again, and I found Pulsar. Pulsar is a continuation of the old Atom editor, which was discontinued a few years back. I really liked Atom, but there’s only so long you can use softare with no updates. Eventually, things just break, and I didn’t want to be using it when that happened. Pulsar seems to have all the features I like, even the integration with Github. Ghostwriter did not have that. I expect this will be the one to replace VSCode, but I guess keep an eye on this space in case I change my mind in a couple days. Stranger things have happened. Day 29 of the #100DaysToOffload Series. Looking for comments? There are no comments. It's not that I don't care what you think, it's just that I don't want to manage a comments section. If you want to comment, there's a really good chance I at least mentioned this post on Fosstodon, and you can reply to me there. If you don't have a Mastodon account, I'd suggest giving it a try. If you don't want to join Mastodon, and you still want to comment, feel free to use my contact information. Also, don't feel obligated, but if you feel like buying me a ☕ cup of coffee ☕ I won't say no."
