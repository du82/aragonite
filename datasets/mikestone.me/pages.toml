full_description = "100 Days to Offload – Day 1 25 Apr 2020 Day 1 of the #100DaysToOffload series: Many of the people reading this will come to my blog from Mastodon. I spend most of my “Social Media” time there, so that’s how most people will know me. For those that don’t, I want to give a brief explanation of what’s going on here with this #100DaysToOffload stuff. A good friend of mine, Kev Quirk recently suggested a “100 Days to Offload” challenge. This is a challenge to those individuals with a blog to post one thing a day for 100 days straight. I have a blog, kind of. I’ve written somewhere in the neighborhood of a post a year for the last couple years. Coming up with something to write about for one hundred days straight certainly would be a challenge for me. So, I took it. I’m not the only one doing this. Kev himself has decided that he’s going to take part, as have others. Several are hosting their blogs on the write.as platform, which makes it easy for anybody interested to follow along. Anybody that uses the tag #100DaysToOffload will show up on write.as’s reader site. You can add that to your favorite RSS reader, or just hit the web page when you’re curious. Now, there’s no specific theme to this challenge. I can write about anything I want. I’m probably going to try to focus mostly on tech, specifically open source stuff, since that’s what I know. Just don’t be surprised if I throw in something completely off the cuff because I can’t think of anything “techy” to write about on a given day. OK, I guess that’s enough of the Mikespaining. Let the games begin! Looking for comments? There are no comments. It's not that I don't care what you think, it's just that I don't want to manage a comments section. If you want to comment, there's a really good chance I at least mentioned this post on Fosstodon, and you can reply to me there. If you don't have a Mastodon account, I'd suggest giving it a try. If you don't want to join Mastodon, and you still want to comment, feel free to use my contact information. Also, don't feel obligated, but if you feel like buying me a ☕ cup of coffee ☕ I won't say no."
