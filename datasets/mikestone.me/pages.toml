["https://mikestone.me/a-new-version-of-jing"]
title = "A New Version Of JingOS Has Been Released"
description = "Mostly The Lonely Howls Of Mike Baying His Ideological Purity At The Moon"
full_description = "A New Version Of JingOS Has Been Released 04 Jun 2021 I’ve seen recently that a new version of JingOS is now available for download. Back in February, I wrote a personal review of JingOS .6. The new version is .9, so there’s probably been quite a few changes since my earlier review. Despite that, I’m not going to review the new version. Why am I not going to review the new version you ask? I have very little faith that this thing is going to go anywhere. Not that the company itself isn’t working hard, or that their ideas are not good ones. There’s just a couple things that are weighing on me regarding this distribution. The biggest for me are these: How they’re paying for it. Crowdfunding a tablet? I’ve seen that crowdfunding thing tried and failed by companies bigger and more experienced than Jingling Tech. I have serious reservations that this is going to pan out. Apple. They say that imitation is the sincerest form of flattery, and it looks like the makers of JingOS really love Apple. In fact, I think they love it a bit too much. JingOS looks so much like iPadOS that it could easilyi be mistaken for it. Even if JingOS manages to gain traction, I think Apple’s more litigious nature will be a major obstacle to it going anywhere. Those are the big ones for me. A Linux based OS on an open source tablet sounds like the promised land, but this feels like it’s something that would disappear just as fast as it appeared. I’m seriously hoping I’m wrong. Day 25 of the #100DaysToOffload 2021 Series. Looking for comments? There are no comments. It's not that I don't care what you think, it's just that I don't want to manage a comments section. If you want to comment, there's a really good chance I at least mentioned this post on Fosstodon, and you can reply to me there. If you don't have a Mastodon account, I'd suggest giving it a try. If you don't want to join Mastodon, and you still want to comment, feel free to use my contact information. Also, don't feel obligated, but if you feel like buying me a ☕ cup of coffee ☕ I won't say no."
