full_description = "And We're Done 24 Aug 2024 I’ve finally finished my final project for my current class. There’s nothing to do now but wait and see how it all came out. I think I’m going to be sleeping really well tonight. The last couple nights have been full of dreams of websites, HTML, and CSS code. It’s not what I’d call “restful”. I guess the bright side of that is there were several ideas my sleeping brain kicked up to my conscious mind that were actually useful. There were other ideas that I had that weren’t exactly bad, but didn’t really fit into the project I working on. Some of those may see the light of day on this page if I can find the time to dust off these old files. I haven’t looked at half of them since I put this page up. Tomorrow, I’m sleeping in. Even though the final project was due today, I did manage to leave the house and do some chores outside (before it got too hot) and checked some things off my ToDo list. Of course, there are still things on that ToDo list, so I can’t slack all day, but I do want to appreciate that I can take a breather for a few hours before chaos reigns once again on Monday. Day 9 of the #100DaysToOffload Series. Looking for comments? There are no comments. It's not that I don't care what you think, it's just that I don't want to manage a comments section. If you want to comment, there's a really good chance I at least mentioned this post on Fosstodon, and you can reply to me there. If you don't have a Mastodon account, I'd suggest giving it a try. If you don't want to join Mastodon, and you still want to comment, feel free to use my contact information. Also, don't feel obligated, but if you feel like buying me a ☕ cup of coffee ☕ I won't say no."
