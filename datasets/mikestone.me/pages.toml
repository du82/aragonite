full_description = "Annnd We're Done 31 Jan 2025 Aaaaannnnnd we’re done. The house is empty. Nothing to do now except turn in the keys. This move has been a lot of work. We’ve been going constantly for over a month now getting the new place ready to move in and moving our stuff over. Cleaning the old house so it’s ready for whoever comes after us. I’m exhausted. I told my wife a week ago that this Saturday, I’m doing nothing. I’m sitting on the couch and letting the world pass by. We still have a lot of stuff to do with the new house. It’s cluttered with boxes that were urgently moved and then stacked in corners and along walls. We haven’t had a chance to fully move in we’ve been so busy moving out. We have a last minute cleaning crew coming in about 30 minutes. They’re going to do the deep cleaning stuff we just don’t have the equipment, inclination, or time to get done by today. As exciting as it is having this new house and getting ready to make it ours, it’s still sad to see the old place empty. It echoes weirdly without our stuff in it. Day 37 of the #100DaysToOffload Series. Looking for comments? There are no comments. It's not that I don't care what you think, it's just that I don't want to manage a comments section. If you want to comment, there's a really good chance I at least mentioned this post on Fosstodon, and you can reply to me there. If you don't have a Mastodon account, I'd suggest giving it a try. If you don't want to join Mastodon, and you still want to comment, feel free to use my contact information. Also, don't feel obligated, but if you feel like buying me a ☕ cup of coffee ☕ I won't say no."
