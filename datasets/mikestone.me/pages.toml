full_description = "10 Years Of Linux 10 Jan 2022 With the start of a new year, it’s custom to reflect back on years gone by. This year I’ve seen people posting pictures of various things from a decade ago and now. I thought I’d throw my hat into the ring. I’ve been using Linux on and off for a pretty long time. I started in the mid to late 90s, and have been using it in some form ever since. Unfortunately, I haven’t been super diligent about keeping screen shots that whole time. Thankfully, I did keep some. While it’s not exactly ten years, it’s within a month or so. 2012 2022 A lot has changed over the last decade. Thankfully, Linux is still awesome. Day 2 of the #100DaysToOffload 2022 Series. Looking for comments? There are no comments. It's not that I don't care what you think, it's just that I don't want to manage a comments section. If you want to comment, there's a really good chance I at least mentioned this post on Fosstodon, and you can reply to me there. If you don't have a Mastodon account, I'd suggest giving it a try. If you don't want to join Mastodon, and you still want to comment, feel free to use my contact information. Also, don't feel obligated, but if you feel like buying me a ☕ cup of coffee ☕ I won't say no."
