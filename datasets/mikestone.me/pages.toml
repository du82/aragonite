full_description = "What's On Your Plank 04 Jun 2020 Day 39 of the #100DaysToOffload Series: Everybody has their way of working on their desktop. Personally, I use plank to add a panel down at the bottom. Pretty much everything I use is there. I don’t use a lot of applications on my computer. I’m pretty boring when it comes to my default list. I thought I’d go through my default picks and hopefully some of you will return the favor. The first icon, far left, is the “Show Desktop” icon. I leave this here, and I even sometimes use it. I want to do it enough that the icon has a home. The next three icons are my terminals. MATE Terminal, Tilix, and Snowflake. I’ve already written a post about my use of three of them instead of just the one. Of course, I still have the Guake hiding up above. After my three terminals come my three browsers, Vivaldi, Firefox, and qutebrowser. Maybe in the future I’ll write an another post about why I have three browsers sitting there, but not today. Filezilla. I spend enough time in this app for work that it feels weird not having it available. Honestly, I don’t use it nearly as much at home. Foliate. This is a writing app that I’m testing out. I don’t think it’s going to be around long just because even though it seems good, I don’t have a use for it. Two markdown editors, ghostwriter and Typora. I have the both of these because I can’t decide which one I like more. I’m leaning towards ghostwriter at the moment, but they’re both good. LibreOffice Writer and Calc. Just because. Caja. Mostly I use this because I generate files on my laptop and then move them to my Synology. Control Center, cause I sometimes decide to completely mess up my system. Finally, Rhythmbox. Sometimes you just can’t work without some music. Some of these come and go, but most of them are there to stay. I’m sure we all have the apps that are a default part of our workflow. Looking for comments? There are no comments. It's not that I don't care what you think, it's just that I don't want to manage a comments section. If you want to comment, there's a really good chance I at least mentioned this post on Fosstodon, and you can reply to me there. If you don't have a Mastodon account, I'd suggest giving it a try. If you don't want to join Mastodon, and you still want to comment, feel free to use my contact information. Also, don't feel obligated, but if you feel like buying me a ☕ cup of coffee ☕ I won't say no."
