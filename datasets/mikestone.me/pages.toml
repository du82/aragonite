["https://mikestone.me/a-new-htop"]
title = "A New htop"
description = "Mostly The Lonely Howls Of Mike Baying His Ideological Purity At The Moon"
full_description = "A New htop 01 Sep 2020 I think almost everybody who has used a *nix OS has probably heard of top, or one of it’s variants. My personal favorite htop has just released the new 3.0 version. There are a ton of top programs out there, and there are three that I use on a regular basis. People who have been following my blog at least as long as the #100DaysToOffload series probably know that I tend to not settle on a single solution. This is pretty evident in my How Many Terminals Do I Need post, as well as What’s On Your Plank. The top programs I tend to use on a regular basis are the traditional top, htop, and bashtop. htop is my go to for every day use, so what are the rest of them for? As much as I love htop, it’s more resource intensive (at least in my personal experience) than standard top. If I want to get an idea of how much of my system resources are being used in a particular situation, and I don’t want to bother with the math, I use top because I’ve found it’s had the least amount of impact on the system. The numbers I get from top are more “pure” for lack of a better word. bashtop? I love bashtop because it’s just so darn pretty. That’s really it. I love including it in screenshots and looking at my processor stuff just for fun. I don’t really use it for any real utilitarian function. Still, I haven’t found anything else that I like better to look at. Are there other tops that you use other than these three? I’d love to hear about what you use and why. Day 84 of the #100DaysToOffload Series. Looking for comments? There are no comments. It's not that I don't care what you think, it's just that I don't want to manage a comments section. If you want to comment, there's a really good chance I at least mentioned this post on Fosstodon, and you can reply to me there. If you don't have a Mastodon account, I'd suggest giving it a try. If you don't want to join Mastodon, and you still want to comment, feel free to use my contact information. Also, don't feel obligated, but if you feel like buying me a ☕ cup of coffee ☕ I won't say no."
