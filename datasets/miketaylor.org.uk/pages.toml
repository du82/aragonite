["https://miketaylor.org.uk/dino/brontomerus"]
title = "Mike Taylor - Brontomerus Press Pack"
full_description = 'The purpose of this page is to provide images and video that can be used by television and print media. See also the extras page, which contains high-resolution images from the paper itself, the official press release from University College London, and the fact sheet, which also notes some common errors to avoid. Brontomerus mcintoshi is a newly discovered dinosaur from the Early Cretaceous of North America. The name Brontomerus means "Thunder thighs" -- a name chosen because the peculiar shape of the hip bone shows that it would have had enormously powerful thigh muscles in life. Brontomerus is a sauropod: a member of the group of dinosaurs that includes Diplodocus, Aptosaurus and Brachiosaurus. The quarry where the bones were found contains elements from at least two individuals, one of them three times as big as the other -- an adult and a juvenile. In this life restoration, we show the adult as a mother, protecting her baby from a predator by using those powerful thigh muscles to deliver a devastating kick. Brontomerus is not known from a complete skeleton, but from a selection of bones: some from the shoulder and hip, some ribs, some vertebrae, and some unidentifiable fragments. This photograph shows all of the known material: And this skeletal inventory shows (in white) which are the known bones. The remaining, grey, bones are filled in from a reconstruction of the well-known related dinosaur, Camarasaurus. The preserved bones are enough to give us a good idea of the size of the adult animal -- rather larger than the biggest modern elephants. Notice how, in the reconstruction above, the hip bone projects a long way forward from the socket where it meets the leg: in life, muscles would have run down to the leg from the whole length of the hip bone, hence the name "Thunder thighs". Here is that hip-bone in detail. (Part of the blade is missing due to damage at the quarry, but the intact portion allows the shape to the reconstructed with confidence.) Here are the authors of the Brontomerus paper with the fossil bones. From left to right: Mike Taylor, Matt Wedel and Rich Cifelli.'
year_published = 2025
clearnet = "https://miketaylor.org.uk/dino/brontomerus"
