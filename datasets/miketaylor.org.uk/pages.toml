["https://miketaylor.org.uk/dino/xeno"]
title = "Mike Taylor - Introducing Xenoposeidon"
full_description = '''Xenoposeidon is a new dinosaur, to be named in the November 2007 edition of the British journal Palaeontology. It is a sauropod: an elephant-sized hebivorous dinosaur with a long neck and tail and a small head, looking a bit like Apatosaurus, Diplodocus or Brachiosaurus. It is from the Early Cretaceous, probably about 130 million years old. It's a dorsal vertebra (part of the backbone), and the preserved portion is about 30 cm (one foot) tall. In this photo, we're looking at it from the left-hand side. Those bony struts towards the top of the bone give us a good idea where various other parts of the bone must have been when it was complete. The whole thing would have looked something like this: In life, a sequence of about a dozen vertebrae similar to this open would have been strung together to form the backbone: The rounded part at the front of each vertebra's lower section fits neatly into a corresponding hollow at the back of the next. Although in the last picture the successive bones are all shown the same, in reality there is a smooth change between those nearer the shoulders and those near the hips. From features that vary along the column, we can tell that the preserved bone was from near the hips. Here's where it would have been positioned in the live animal, and a rough guess at the size and shape of the whole dinosaur. (The size and shape are just informed guesses and shouldn't be taken too seriously.) And here is the same image, but with the rest of a sauropod skeleton greyed out. Remember, there is no reason to think that the Xenoposeidon skeleton was particularly similar to this: it's just to give a rough idea. The name Xenoposeidon means, roughly ``alien sauropod''. We chose that name because the single bone that is known from this animal is so weird it looks like it could have come from another planet. The name is pronounced ZEE-no-puh-SYE-d'n. (Why does "Poseidon" mean "sauropod"? There's some sleight of mind involved here: Xenoposeidon is named with another sauropod in mind, the giant brachiosaur Sauroposeidon from Oklahoma. We think of "-poseidon" as a suffix denoting a sauropod in the same way that "-raptor", which literally means "thief", is understood to mean a smallish, nasty theropod.)'''
year_published = 2025
clearnet = "https://miketaylor.org.uk/dino/xeno"
