title = "Mike Taylor - Christian Stuff"
full_description = "I have on-line notes and overviews of several other talks I've written and given over the last few years in various contexts. Most of these pre-date North Central. I am also hosting the powerpoint presentation of Andy Blacknell's talk on the resurrection from the same session. I'm hosting the truly extraordinary story of Sue Noakes's healing. A lot of people are skeptical about healing, and reasonbly enough want to see a really clear, well-documented case. Well, this is a spectactular case history, and it happened recently (Decemeber 2000) in Crawley, East Sussex (you can't get a much more mundane location than that!) Sue is Fiona's accountant's wife, and a good friend of Fiona's mother; so while she's not exactly a personal friend of mine, she is close enough to me that I can vouch for the authenticity of this story. Sue's in the process of gathering formal documentation of the healing from doctors and other authorities."
