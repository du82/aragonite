["http://www.miketaylor.org.uk/tech/tt"]
title = "Mike Taylor - tt: Tetris for Terminals"
full_description = "I'm releasing versions of this starting from 14.0, because as I write, it's fourteen years and a day after I started writing tt, and it seems silly to release a fourteen-year-old program as version 1.0. Release 14.0 is deliberately more or less unchanged from the 1989 version. I've resisted the urge to clean up the source code, because there's a certain historical significance to the original (for me, anyway). Versions from 14.1 onwards will progressively tidy things up. tt was the first Free Software I ever wrote, back when I was at Warwick University in the late eighties. Back in those days, nearly everyone in the computer unit had access only to 80x24 serial terminals, while a few exalted souls - postgrad students and suchlike - had accounts that were good for the ten or so Sun workstations in the ``graphics lab''. And of course, they spent all their time using their fabulously powerful 68k-based workstations to play Tetris. It seemed to me that Tetris was a game that should be brought to the masses - it's not as though it makes excessive graphical demands, after all - and so, one Friday lunchtime, tt was born. Which is why, all through the summer term of '89, the Warwick computer unit resounded to cries of ``I need a long one'', ``Leftleftleftleftleft!'' and, of course, ``Arrrrggghhh!'' tt turned out to be amazingly popular for such a simple hack. At some stage in the summer of '89 I posted it on one of the source-code newsgroups - probably either comp.sources.unix or comp.sources.misc - and various mutant versions have grown up out there over the years, including some that use colour and some with more complex scoring systems. Much as I respect the craft that went into these projects, I eschew their complexities, preferring the sharp, astringent, spartan feel of ``tt Classic'' to their various ``enhancements''. More interesting variants of tt soon began to spring up at Warwick. The first and probably the best was Harvey ``Max'' Thompson's 3 (a.k.a. t3), in which the blocks are made up of just three squares, but they may be joined diagonally as well as orthogonally, so that there are six kinds of block that look like this:"
