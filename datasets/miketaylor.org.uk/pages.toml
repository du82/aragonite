["https://miketaylor.org.uk/tech/cv.html"]
title = "Mike Taylor - CV"
full_description = "I'm Mike Taylor <mike@miketaylor.org.uk>, a 41-year-old software engineer with extensive experience and expertise in software requirements analysis, architecture, design, implementation, testing, debugging, maintenance, documentation and training: the whole bundle from top to bottom. I also write technical specifications and project bid documents, make presentations and run workshops. I have a a BSc. in pure maths from Warwick and a Ph.D in paleontology from Portsmouth. I currently work as a consultant developer for Index Data (indexdata.com), a small independent software house. Prior to that, I was the lead developer of the team that built the on-line ticket-sales systems for various football and rugby clubs including Tottenham Hotspur (www.seatbooker.net/thfc). My favoured tools are Unix (in its various flavours, including Linux), C and Perl; but I'm also experienced in Java, C++, Python, the Unix shells, sed, awk, nroff, HTML, lex, yacc, and much, much more. I wrote my first Windows program fifteen years ago (on Windows 2!) I'm keenly interested in network protocols - I wrote my first multiplexing TCP/IP server in the 80s - and in interoperability - I was a member of the SRW Editorial Board (www.loc.gov/standards/sru), which put together the specifications for this standard Web Service for rich searching and retrieval over the Internet. I am the author of the Zthes profile for navigating hierarchical thesauri (zthes.z3950.org), the instigator of the ZOOM initiative for standardising object-oriented interfaces to information retrieval protocols (zoom.z3950.org), one of the primary authors of the ZeeRex specifications by which IR servers can explain their own capabilities to clients (explain.z3950.org) and a key contributor the development of the new query language CQL (zing.z3950.org/cql) I created the ZOOM-Perl module for Z39.50 and SRU programming (http://search.cpan.org/~mirk/Net-Z3950-ZOOM), zSQLgate, the generic Z39.50-to-RDBMS gateway server (sql.z3950.org), CQL-Java, a free Java implementation of the query language CQL (zing.z3950.org/cql/java) and Keystone Resolver, an OpenURL Resolver."
year_published = 2025
