title = "Mike Taylor - Miscellaneous"
full_description = "I don't really know where else this fits in, but here are my thoughts on the future of publishing as conventional roles change in the light of print-on-demand and the internet. This is a piece about the horror of watching a video of a match that you couldn't watch as it was happening. I've just (16th October 2001) sent a letter to Birmingham City F.C applying to take over as manager since Trevor Francis left the job ``by mutual consent''. We'll see what kind of reply I get. [Update, 31st January 2002 - to no-one's real surprise, I guess, the kind of reply I got was: none at all.] The Daily Mirror's front page on 19th December 2001 was just too good a summary of the Bowyer/Woodgate affair to allow to pass into history unmarked. So here it is for posterity. Yup, I'm branching out into food criticism now! Pizza Restaurant DeathMatch is two sets of comparative reviews of rival pizza restaurants in Belsize Park, North London. Since they're both parts of chains, the reviews probably have wider applicability. Also, my friend Jane MacDonald <janemac98@lycos.com> has a recipe for a simple buffet (cassoulet & salad) which I am hosting for her. I've built a Lego MINI Super Star Destroyer out of the pieces of the official Lego MINI Star Destroyer. Here is a rant about Breathing Space, one of far too many companies whose web-sites make promises their fulfillment people can't keep."
