title = "Mike Taylor - Family"
full_description = "NEW! On 10th July 2008, Danny was in the local paper for winning a local maths competition against children four years older. He was on the front page and page 9. NEWish! A photo of the boys taken at the end of 2003. From left to right: Jonno (about sixteen months), Matthew (nearly four) and Danny (Coming up six). Somewhat NEW! Photos of what was until the end of October 2003 the Index Data UK office, tucked away in a half-converted walk-in wardrobe at the top of our house, and sharing the space with the Pipedreaming studio. First of all, this is me - Mike Taylor. (Although if you don't already know who I am, then why are you bothering to visit my web page?) Then again, it might be what you really want is to see our son Danny's Baby Photos, taken when he was about four months old. Here is a gallery of slightly more up to date photos of Danny, these ones taken in October 1999, when he was about eighteen months; and here is a gallery of a leopard in la Zoo de la Fleche (Loire Valley), where we took the boys this autumn. He really, really, wanted to eat them. At last, I have a photo (just one for the moment) of Danny's baby brother Matthew, born 8th January 2000, who was eight and a half months when this was taken: Here is a copy of Danny's first report, form the play-group he attends three mornings a week. (And here's a plain text version)"
