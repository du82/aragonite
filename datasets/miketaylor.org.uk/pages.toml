["https://miketaylor.org.uk/dino/books/index.html"]
title = "Mike Taylor - Dinosaur Books"
full_description = "They're listed on the order on which I read them, which is not necessarily the best order to read them in. For example, Gillette's Seismosaurus: The Earth Shaker is really too species-specific to read before you've got the more general background that books like Alexander's Dynamics of Dinosaurs and Other Extinct Giants can give you. C'est la vie. In a desparate money-grubbing attempt to make my work on this site pay me something, I'm trying out the amazon affiliates program. If you buy any of the books on this page by following the links I've provided, I'll get a small cut. Or if you simply go to amazon via one of the links immediately below, I'll get a truly tiny slice of any money you spend on anything. Which would be nice. Finally, please note that, apart from the Holtz-and-Rey encyclopedia at the bottom, all of these reviews are from 2003 or earlier. My ideas about some of these books have changed since then. I bought this on a whim in, oh, let's see, it must have been about 1990 - certainly pre-Jurassic Park anyway. It's the book that re-awakened my interest in dinosaurs, portraying them as beautiful, elegant, powerful animals totally at odds with what was then the public image of dinosaurs. Specifically, it paints a picture of warm-blooded, fast-running, active dinosaurs: sauropods rearing on their hind legs, cracking their tails like whips, and so on. The book presents convincing informal arguments, although it's very short on calculations that would lend weight to some of Bakker's specific conclusion (e.g. that T. rex could run at 40 mph.) But to my mind, that's not really important: the heart of this book is not an argument but an image: a reconstruction of dinosaurs that gives them a life they'd not had (for me anyway) before. This new image is built not only by the text, but also by Bakker's own gorgeous black-and-white illustrations. Of course, a decade on, most of Bakker's ``heresies'' are now firmly entrenched as palaeontological orthdoxy. That might detract a bit from the raciness of the read, but it speaks well of Bakker's perception and determination to push views which, at the time, were not widely shared."
year_published = 2025
