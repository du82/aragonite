["http://www.miketaylor.org.uk/tech/eta/doc/index.html"]
title = "The ETA Project"
full_description = "This document may be freely redistributed provided it is not modified in any way. Specifically, the authorship must remain clear. All feedback is extremely welcome, and should be emailed to the author at mike@miketaylor.org.uk. This is the home page of ETA, the programming language that not only resembles natural language, but can resemble whatever specific natural language you want (with the exception of those that require non-Latin characters: apologies to Chinese and Japanese programmers.) Here you will find everything you need to start programming in ETA: a comprehensive specification for ETA, and for its assembler, EAS; sample ETA and EAS programs; and interpreters that will enable you to run ETA programs and compile EAS programs into ETA. In time, I hope an ETA user-community will grow up, contributing to the ETA standard library (see below), and writing programs of terrifying elegance and beauty to meet the challenges described in the ETA manual. hello.eta The classic ``Hello, world!'' program. hello2.eta An alternative implementation of ``Hello, world!''. pip.eta Copy standard input to standard output. pip2.eta A smaller copy-input-to-output program. fact.eta Print the recursively-calculated factorial of the number on the standard input stream. bottles.eta Print the lyrics to ``99 Bottles of Beer on the Wall''. crlf.eta Test whether the interpreter handles CR/LF sequences correctly. Standard Library Functions (see the EAS manual, chapter 5: The Standard Library) multiply.eas Function to multiply two numbers together by repeatedly adding one of them to an initially-zero accumulator. (Is there a more efficient algorithm?) writestr.eas Variadic function to print a NUL-terminated string. writenum.eas Function to print its single argument as a decimal integer. readnum.eas The converse of printnum.eas: Function yielding the value of a decimal integer written to standard output. Miscellaneous true.eas A reimplementation of the Unix utility /bin/true hello.eas The classic ``Hello, world!'' program. hello2.eas An alternative implementation of the ``Hello, world!'' program using the standard library WRITESTR function (see above). pip.eas Copy standard input to standard output. pip2.eas Compressed version of pip.eas, all on two lines. reverse.eas Copy input to output, reversed byte-for-byte. (This is done by stacking up all the bytes of the input file, so some implementations will fail for large files.) fact.eas Program to calculate factorials by defining and (recursively) calling a function, FACT; also uses the standard READNUM, WRITENUM, MULTIPLY and WRITESTR functions. bottles.eas Print the lyrics to ``99 Bottles of Beer on the Wall'', using the standard WRITENUM and WRITESTR functions."
