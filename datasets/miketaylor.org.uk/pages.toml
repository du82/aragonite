["http://www.miketaylor.org.uk/dino/nm"]
title = "Aetogate: asking for answers in New Mexico"
full_description = '''We are aware of scientific publications emanating from the New Mexico Museum of Natural History and Science (NMMNHS) which appear to usurp the work of others without credit and to claim-jump names that others have planned to attach to taxa. We have documented these issues as clearly as possible and invite the wider scientific community to decide for themselves whether our complaints are valid or not. Twenty-one months have passed since the SVP released its findings, such as they were. The victims of Aetogate are now trying to put this episode behind them get on with their research and their lives. Any attempts at reprisals seem to have been unsuccessful. Was it worth pursuing this, or did the SVP's non-decision render it all pointless? The final statement of Martz, Parker, Taylor and Wedel gives our sober perspective of how things turned out. For a more personal and less guarded view, see We're going to need a bigger ethics committee. The the SVP findings concluded that "faced with conflicting testimonies, the Ethics Education Committee was not able to resolve these allegations in favor of either side, a position that does not absolve either party of responsibility", but along with this non-verdict also issued a new "best practices" document for VP professional conduct. We responded with a final statement. Finally, the SVP issued a addendum pointing out that they ignored all blogs and media coverage of Aetogate. The Albuquerque Journal has provided excellent coverage throughout, in the form of news stories, editorials, letters to the editor and even a cartoon. The Journal is also graciously allowing links from this site directly to the relevant content, skipping the video advert that some readers have had difficulty viewing. If anybody has anything they would like us to add to this page, please email us at nm@miketaylor.org.uk with your comments, thoughts, documentation, opinions, etc. We are keen to hear what the palaeontological community thinks. Finally, nothing would please us more than to find out that all of this has been a series of unfortunate misunderstandings. We particularly invite the NMMNHS staff at the centre of these events (Lucas, Hunt, Spielmann, Heckert) to contact us and explain how these events have occurred.'''
year_published = 2010
clearnet = "http://www.miketaylor.org.uk/dino/nm"
