["https://miketaylor.org.uk/tech/oreilly/truenut.html"]
title = "True in a Nutshell"
full_description = '''The perfect companion for working programmers, True in a Nutshell is a comprehensive reference guide to the ubiquitous Unix utility program /bin/true. It contains everything you need to know for all but the most obscure /bin/true questions. This wealth of information is packed into an efficient, extraordinarily usable format. Mike Taylor <mike@miketaylor.org.uk> has been programming with /bin/true since the 1980s, deploying it in a variety of mission-critical applications. He has personally re-implemented /bin/true in numerous different programming languages and under several environments. /bin/true...page 1 CGI scripts...page 1 databases...page 2 falsehood...page 1 farming, wasp...see wasp farming true: debugging...page 1 development...page 1 installation...page 1 truth...page 1 wasp farming...page 1 ``Good reference for the True-monger, a good way for the experienced programmer to start getting work done with /bin/true. Rating 10/10." -- Simeon Blatherwick, slashdot.com, November 1999. ``This is by far the finest book I've seen on True programming, for the beginner and advanced programmer alike. Loaded with references, helpful hints, and code tid-bits, entertaining yet informative, and never too verbose, this is certainly well worth the price.'' -- Brompton@thrick.thrick.edu, 18/3/1999, Amazon Books review; rating=10 Our look is the result of reader comments, our own experimentation, and feedback from distribution channels. Distinctive covers complement our distinctive approach to technical topics, breathing personality and life into potentially dry subjects. The animal featured on the cover of True in a Nutshell is a slug (common or garden). Slugs are molluscs, members of the class Gastropoda (which has about 8000 species), subclass Pulmonata (in which the mantle cavity has become a lung). All gastropods show torsion: the body is twisted by 90�-180� so the mantle ends up over the head, along with anus, kidney opening, etc. Slugs are secondarily detorted. Slugs can stand six to seven feet tall at the shoulders. They are well known for their use as draft and saddle animals in the desert regions, especially of Africa and Asia, and the slug is sometimes known as ``the ship of the desert''. Slugs can go for days without water. If food is scarce, they will eat anything, even their owner's tent. Slugs live up to 50 years, unless I'm thinking of camels. (I often get those two confused.)'''
year_published = 2025
clearnet = "https://miketaylor.org.uk/tech/oreilly/truenut.html"
