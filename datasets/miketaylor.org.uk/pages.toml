["https://miketaylor.org.uk/tech/advent/mundi/index.html"]
title = "Mike Taylor - MUNDI - Multi-User Networked Dungeon Interaction"
full_description = "MUNDI was the first true multi-user adventure game I ever wrote, and perhaps the first one ever to run over the internet - history is inconclusive on this point. Now, after more than a decade in cold storage, its body is exhumed, and life breathed back into it! Why would anyone except me care about this? Mostly, I think it'll just be people who were at Warwick University during MUNDI's heyday, wanting to relive the part of their life when they could sleep 'til ten every morning. Game historians may also be interested. If you like this kind of late-eighties retro-computing, you should check out Marke ``The Chief Slime Monster'' Fincher's bizarre arcade games Chicken Vomit and Fishmonger. If you're interested to know what I'm working on now, then my current MUD project, Herring, is starting to show signs of life."
