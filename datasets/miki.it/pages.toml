title = "Michele Spagnuolo - Staff Information Security Engineer"
description = "Michele Spagnuolo, Staff Information Security Engineer at Google."
full_description = "I currently work as a Staff Information Security Engineer at Google Zürich, Switzerland 🇨🇭, leading the Web Security & Intelligence area in the Information Security team. Born in Novara, Italy 🇮🇹 in 1989, I studied computer engineering at Politecnico di Milano 🇮🇹 & UIC 🇺🇸. At Google, I co-authored 'strict-dynamic' in the CSP3 W3 specification, which now protects more than a third of the Internet's HTML traffic against Cross-Site Scripting (XSS) attacks. I deployed CSP and other web security features at scale across Alphabet following a full-cycle, data-driven approach. Internally, I built Security Signals, a comprehensive system providing security measurability for web services, deployed in a complex application ecosystem of thousands of web services handling traffic from billions of users. I am now leading an effort to define a common, domain-agnostic methodology for product security measurability across Alphabet. Other works include Rosetta Flash, a Pwnie Awards-nominated exploitation technique that abuses the Flash SWF format to bypass the Same Origin Policy and BitIodine, the first open source Bitcoin blockchain analysis framework, cited by around 450 academic publications. I also have extensive technical experience in Bitcoin and Ethereum, I have served as an expert witness in legal cases and I advise several fintech and cryptocurrency companies. Since you're here, you might like to read my blog, where I write about vulnerabilities and life experiences. The area of security measurability is gaining increased attention, with a wide range of organizations calling for the development of scalable approaches for assessing the security of software systems and infrastructure. In this paper, we present our experience developing Security Signals, a comprehensive system providing security measurability for web services, deployed in a complex application ecosystem of thousands of web services handling traffic from billions of users. The system collects security-relevant information from production HTTP traffic at the reverse proxy layer, utilizing novel concepts such as synthetic signals augmented with additional risk information to provide a holistic view of the security posture of individual services and the broader application ecosystem. This approach to measurability has enabled large-scale security improvements to our services, including allowing prioritized rollouts of security enhancements and the implementation of automated regression monitoring; it has proven valuable for security research and prioritization of defensive work. Security Signals addresses shortcomings of prior web measurability proposals by tracking a comprehensive set of security properties relevant to web applications, and by extracting insights from collected data for use by both security experts and non-experts. We believe the lessons learned from the implementation and use of Security Signals offer valuable insights for practitioners responsible for web service security, potentially inspiring new approaches to web security measurability."
