full_description = "Enables LoRa® connectivity via miniPCIe in various MikroTik setups. Exceptional Rx sensitivity (up to -141 dBm for 868MHz) ensures reliable long-range communication, built-in GPS. A rugged all-in-one device (LoRa®, 2.4 GHz Wireless, built-in GPS, fast Cat6 LTE mobile internet) with multiple powering options. A rugged low-cost, low-bandwidth modem to connect Ethernet devices to CAT-M mobile network... on the tightest budget ever! An out-of-the-box 863-870 MHz IoT Gateway solution for LoRa® technology. For ultimate versatility and cost-effectiveness. The first gateway with a CAT-M interface for LoRa®! An out-of-the-box 902-928 MHz IoT Gateway solution for LoRa® technology. For ultimate versatility and cost-effectiveness. The first gateway with a CAT-M interface for LoRa®! An outdoor heavy-duty Bluetooth tag for the MikroTik KNOT or other IoT asset-tracking/telemetry setups. Built-in temperature sensors and accelerometer. Cast in industrial grade molds for maximum protection. The upgrade of our antenna kit for LoRa® with a 6.5 dBi Omni antenna for 862-876 MHz, 1m long SMA cable and mechanical holder for quick and easy mast attachment. Smaller size, increased durability, and added IP66 water resistance. A 2.4 GHz 8 dBi Omni Antenna for the wAP LR2 kit. If necessary, this antenna can be used for any 2.4 GHz device. A 900 - 928 MHz IoT antenna for your LoRa setups in the U.S., Brazil, Australia, New Zealand, and other regions that prefer a 915 MHz signal over our previous 868 MHz antenna. Comes with a durable 1 m long SMA cable and a solid IP66 water resistance rating. A new Concentrator Gateway card for LoRa® technology in mini PCIe form – so you can create or customize your own 2.4 GHz IoT projects. Our newest out-of-the-box solution for LoRa® technology. Works with the 2.4 GHz frequency for LoRa®. Doesn’t interfere with the 2.4 GHz WLAN signal! Enables LoRa® connectivity via miniPCIe in various MikroTik setups. Exceptional Rx sensitivity (up to -141 dBm for 868MHz) ensures reliable long-range communication, built-in GPS."
