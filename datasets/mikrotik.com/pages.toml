["https://mikrotik.com/training/about"]
title = "MikroTik Routers and Wireless - Training"
description = "MikroTik makes networking hardware and software, which is used in nearly all countries of the world. Our mission is to make existing Internet technologies faster, more powerful and affordable to wider range of users."
full_description = "MikroTik Training Centers (MTC) are separate entities (companies or individuals) conducting intensive public or private training sessions and certification tests according to the official MikroTik Training Outline. MTC's are not affiliated with each other and with MikroTik in any form. They use their own training materials and bear sole responsibility for the training sessions offered. Please contact the MikroTik Training Centers directly regarding their offers. MikroTik Academies (MA) are educational institutions such as universities, technical schools, colleges, vocational schools, and other educational institutions offering semester time based Internet networking courses for their academic students using MikroTik RouterOS as a learning tool. MikroTik training sessions are organized and provided by MikroTik Training Centers at various locations around the World. They are attended by network engineers, integrators and managers, who would like to learn about routing and managing wired and wireless networks using MikroTik RouterOS. When attending an engineer level training course and passing the respective certification test, the MTCNA certificate will not be renewed. To attend 1st level engineer training course (e.g. MTCRE), the MTCNA certificate does not need to be valid. The participant has to have the MTCNA, but it can be already expired. If you require a valid MTCNA, please attend a re-certification course. NEW! Renewals now can be done online - both the training part and the certification test. Applies only when renewing an existing certificate which is about to expire or has already expired. We believe in the benefits of a classroom based learning environment where participants can work together, solve tasks in groups, help each other and share their knowledge. Currently we offer only classroom based training courses taught by experienced MikroTik certified trainers. NOTE. Due to the pandemic for the time being the training part can be provided online should the trainer and participants agree. The practical part and the certification exam to acquire a new certificate remains classroom based."
year_published = 2025
