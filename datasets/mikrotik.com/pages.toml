["https://mikrotik.com/becoming_distributor"]
title = "MikroTik Routers and Wireless - Sell"
description = "MikroTik makes networking hardware and software, which is used in nearly all countries of the world. Our mission is to make existing Internet technologies faster, more powerful and affordable to wider range of users."
full_description = "MikroTik organizes the sale of products and services through an international network of distributors, which currently has more than 400 companies from 120+ countries around the world. In order to become a distributor of MikroTik products, companies must have an interview with the MikroTik Sales representative to discuss the goals and sales policies, ensure the presence of a MikroTik certified technical support specialist with at least of MTCNA level certificate, and place regular orders. We regularly meet distributor representatives at our MikroTik user conferences around the world and have quarterly calls to inform about recent updates. As a part of the Know-Your-Customer extended policy, MikroTik has a contract on the AML/KYC risk assessment with Accuity, a trusted international data analytics company whose services are used by banks worldwide. Our commitment to a safer, better world goes beyond this. We have stopped selling products and services in Russia and Belarus entirely, provided humanitarian aid containing over USD 350,000 worth of equipment to support Ukraine, and regularly make significant donations to Latvian science and medical institutions, schools, and so on. From precision cancer treatment and genome research to creating a better environment for the little patients and their parents – we feel grateful and privileged to be able to support the most important causes. Giving back to the community is at the core of our mission. We believe in technology that can truly serve humanity."
year_published = 2025
