full_description = "MikroTik is expanding RouterOS learning possibilities by launching the MikroTik Academy Program - download brochure in English, folleto en Español. The MikroTik Academy Program is for educational institutions such as universities, technical schools, colleges, vocational schools, and other educational institutions. Fill in online or pdf MikroTik Academy Application form or contact a MikroTik Appointed Coordinator in your country. This is a good opportunity to attract more students by offering MikroTik certificates which are recognizable by potential employers around the world. If you already are a lecturer at an educational institution, and you have successfully (score at least 75%) passed the MTCNA certification test and have at least one of the MikroTik Engineer level certifications (score at least 75%), you can become a MikroTik Academy Trainer. Contact either a MikroTik Appointed Coordinator in your country or MikroTik directly to apply for the MikroTik Academy Trainer's certificate. A MikroTik certified trainer who is listed at the Academy info page is an official coordinator for a particular country. He/she will coordinate the implementation of MikroTik Academy program in the curriculum of educational institution. Any MikroTik Training Center who has good connections with local educational institutions and has the ability to expand MikroTik Academy classes among them can be a coordinator. Yes. Note that the Coordinator status (presence in the webpage) is assigned only upon the successful implementation of a MikroTik Academy class in the curriculum of at least one educational institution. A coordinator can benefit from preparing Academy Trainers for teaching the MikroTik Academy class and also from gaining more publicity by being listed in MikroTik webpage as the MikroTik Appointed Coordinator for a particular country. MikroTik Academy trainers are authorized to teach only students of educational institutions. They cannot conduct regular MikroTik training courses unless they complete additional requirements by attending a Train the Trainer course and become MikroTik certified trainers as well."
