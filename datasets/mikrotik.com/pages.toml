full_description = "A rugged low-cost, low-bandwidth modem to connect Ethernet devices to CAT-M mobile network... on the tightest budget ever! The Mars rover of networking. Our toughest long-range outdoor access point – with Wi-Fi 6, IP66 rating, MiniPCIe, 2.5G SFP, and PoE-in! The first MikroTik high-power PoE++ switch – for easy and cost-effective powering of industry standard 802.3af/at/bt devices. Forget about countless power cables – create a cleaner space with PoE++! An ultra-fast enterprise switch with extra processing power due to the CCR series quad-core CPU & the best price per 100 Gigabit port on the market! 16x 100G QSF28 ports, 4x 25G SFP28 ports, and 2x 10G Ethernet ports. wAP ax brings fast and reliable Wi-Fi 6 to your countryside getaway or any other challenging environments – like a rural gas station or a bus stop. - RouterOS enterprise Data Server (100G networking, routing, storage - all in one), plus an updated brochure PDF with your F.A.Q. MikroTik training sessions are organized and provided by MikroTik Training Centers at various locations around the World. They are attended by network engineers, integrators and managers, who would like to learn about routing and managing wired and wireless networks using MikroTik RouterOS. MikroTik Academies are educational institutions such as universities, technical schools, colleges, vocational schools, and other educational institutions offering semester time based Internet networking courses for their academic students using MikroTik RouterOS as a learning tool. Every year there are around 2000 - 3000 graduates who have successfully completed a MikroTik courses. Our certificates are recognized world wide and stand for good knowledge about network administration, using RouterBOARD and RouterOS. RouterOS is the operating system of RouterBOARD hardware. It has all the necessary features for an ISP - routing, firewall, bandwidth management, wireless access point, backhaul link, hotspot gateway, VPN server and more. Quick and simple installation and an easy to use interface!"
