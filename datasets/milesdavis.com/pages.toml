["https://www.milesdavis.com"]
title = "Home | Miles Davis Official Site"
description = "The sextet was less than two weeks old when they assembled at CBS Records’s 30th Street Studio for their first session on May 26. Yet they were ready. They recorded four tunes: three ballads — two inspired by pianist Ahmad Jamal, whose 1950s group Miles adored and drew inspiration from, plus a new Miles original."
full_description = "Birth of the Blue The sextet was less than two weeks old when they assembled at CBS Records’s 30th Street Studio for their first session on May 26. Yet they were ready. They recorded four tunes: three ballads — two inspired by pianist Ahmad Jamal, whose 1950s group Miles adored and drew inspiration from, plus a new Miles original. Birth of the Blue Miles Davis Miles Davis is one of the most innovative, influential and acclaimed figures in the history of music. Discover The Site Legend Miles Davis made music that grew from an uncanny talent to hear the future and a headstrong desire to play it. From his beginnings in the circle of modern jazz, he came to intuit new worlds of sound and challenge. While the vast majority of musicians – jazz, rock, R&B, otherwise – find the experimental charge and imperviousness of youth eventually running down, Miles forever forged ahead. In doing so, Miles became the standard bearer for successive generations of musicians, shaped the course of modern improvisational music more than a half-dozen times. News View all news Jan 24, 2025 Dinner with Miles – Sunday, February 23rd – 4pm EST Sep 12, 2024 Miles in France – Miles Davis Quintet 1963/64: The Bootleg Series, Vol. 8 Apr 19, 2024 Tune into Miles Davis Radio on SiriusXM! Feb 7, 2024 Enter To Win Miles Davis ‘The Electric Years’ Prize Pack Jan 23, 2024 Miles Davis Jazz Studies Program Benefit Concert – Photos Music Miles Davis: The Electric Years View Track List | Listen Apple Music Spotify Artist Name Mute Maximum Volume Previous Track Play/Pause Next Track 0.00 0.00 Want to hear the full song? Click to login to a service & hear full tracks: Apple Music Spotify Disc: 1 Pop-up Player Play/Pause 1. Shhh / PeacefulMiles Davis: The Electric Years 00:30 Lyrics Play/Pause 2. In a Silent WayMiles Davis: The Electric Years 00:30 Lyrics Disc: 2 Pop-up Player Play/Pause 1. Pharaoh’s DanceMiles Davis: The Electric Years 00:30 Lyrics Play/Pause 2. Bitches BrewMiles Davis: The