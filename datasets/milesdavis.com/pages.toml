full_description = "Jan 23, 2024 Miles Davis Jazz Studies Program Benefit Concert – Photos Cheryl and Erin Davis, daughter and son of Miles Davis, and Vince Wilburn Jr., Miles’ nephew, attended a fundraising gala last weekend at the University of North Carolina at Greensboro to create scholarships for students at the Miles Davis Jazz Studies Program. They were invited by Franco Nannucci, a friend of Vince and the family, and Steve Haines, Professor and Interim Director of the jazz studies program. Franco is the founder of Music For Love, which partnered with the university for the event. Cheryl Davis, Erin Davis, and Vince Wilburn Jr. Cheryl Davis with Miles Davis’ trumpet that he used during recording of Kind of Blue. Cheryl Davis and Erin Davis with Miles Davis’ trumpet that he used during recording of Kind of Blue. Vince Wilburn Jr. and drummer Alston Harris, his new little brother, at the benefit concert. The stage at UNCG Auditorium. The stage at UNCG Auditorium. Photos by Franco Nannucci and Vince Wilburn Jr. Back to news"
