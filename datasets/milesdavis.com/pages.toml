description = "This vinyl release cherry picks four stellar cuts from the celebrated expanded project The Complete On The Corner Sessions released in 2007 that collected key recordings captured before and after that release. The tracks featured Miles' new band including Michael Henderson on bass, Al Foster on drums and Mtume on percussion plus rotating appearances by Herbie Hancock, Dave Liebman and Bennie Maupin. Featuring an adaptation of the celebrated Corky McCoy cover of cartoon characters in pink, complemented by limited-edition sky blue vinyl, this marks the first time this material is widely available on vinyl."
