library Play/Pause 3. Theme From Jack Johnson (Right Off) / IntroThat’s What Happened 1982-1985: The Bootleg Series Vol. 7 00:30 Lyrics Add to library Play/Pause 4. Never Loved Like This (studio session demo)That’s What Happened 1982-1985: The Bootleg Series Vol. 7 00:30 Lyrics Add to library Play/Pause 5. Hopscotch (slow)That’s What Happened 1982-1985: The Bootleg Series Vol. 7 00:30 Lyrics Add to library Play/Pause 6. Hopscotch (fast) That’s What Happened 1982-1985: The Bootleg Series Vol. 7 00:30 Lyrics Add to library Play/Pause 7. What’s Love Got To Do With ItThat’s What Happened 1982-1985: The Bootleg Series Vol. 7 00:30 Watch Video Lyrics Add to library Play/Pause 8. Human Nature (alternate)That’s What Happened 1982-1985: The Bootleg Series Vol. 7 00:30 Lyrics Add to library Play/Pause 9. Katia (full session)That’s What Happened 1982-1985: The Bootleg Series Vol. 7 00:30 Lyrics Add to library Disc: 3 Pop-up Player Play/Pause 1. Speak (That’s What Happened)That’s What Happened 1982-1985: The Bootleg Series Vol. 7 00:30 Lyrics Add to library Play/Pause 2. Star PeopleThat’s What Happened 1982-1985: The Bootleg Series Vol. 7 00:30 Lyrics Add to library Play/Pause 3. What It IsThat’s What Happened 1982-1985: The Bootleg Series Vol. 7 00:30 Lyrics Add to library Play/Pause 4. It Gets BetterThat’s What Happened 1982-1985: The Bootleg Series Vol. 7 00:30 Lyrics Add to library Play/Pause 5. HopscotchThat’s What Happened 1982-1985: The Bootleg Series Vol. 7 00:30 Lyrics Add to library Play/Pause 6. Star On CicelyThat’s What Happened 1982-1985: The Bootleg Series Vol. 7 00:30 Lyrics Add to library Play/Pause 7. Jean-PierreThat’s What Happened 1982-1985: The Bootleg Series Vol. 7 00:30 Lyrics Add to library Play/Pause 8. Code 3That’s What Happened 1982-1985: The Bootleg Series Vol. 7 00:30 Lyrics Add to library Play/Pause 9. Creepin’ InThat’s What Happened 1982-1985: The Bootleg Series Vol. 7 00:30 Lyrics Add to library Mute Maximum Volume By logging into Apple Music, Deezer, or Spotify through this website, you agree to follow and receive news from Miles Davis and Sony Music. Miles Davis – That’s What Happened 1982-1985: The Bootleg Series Vol. 7 shines a fresh light on an underrated period of the musician’s restless career-spanning quest for sublime and transcendent sounds. The 3CD set includes two discs of previously unreleased studio material–from the Star People, Decoy and You’re Under Arrest sessions–and a third disc showcasing Miles Davis Live in Montreal on July 7, 1983; the collection comes in a slipcase with individual album mini-jackets and a booklet featuring liner notes by Marcus J. Moore and revelatory new interviews with Miles’ 80’s players including Vince Wilburn, Jr. (drummer and bandmate), John Scofield (electric guitarist), Darryl Jones (bassist), Marcus Miller (bassist) and Mike Stern (guitarist). Eight of the ten tracks on CD 1 are unreleased studio tracks from the sessions that resulted in 1983’s Star People. The second studio album released after Miles’ six-year hiatus from recordings and performing, Star People was the artist’s last to feature the studio wizardry of Miles’ longtime producer Teo Macero. Musicians include J.J. Johnson (trombone), Bill Evans (soprano saxophone, tenor saxophone), Mike Stern (guitar), John Scofield (guitar), Marcus Miller (electric bass), Al Foster (drums) and Mino Cinélu (percussion) with Miles doubling on trumpet and keyboards (without overdubs). CD1’s other two tracks–“Freaky Deaky, Part 1” and “Freaky Deaky, Part 2”–were produced by Miles Davis (trumpet and keyboards) and feature John Scofield (guitar), Darryl Jones (electric bass), Robert Irving III (Linn Drum programming) and Mino Cinélu (percussion). Recorded June 30, 1983 at A&R Studios in New York during the Decoy sessions, this previously unreleased cassette recording comes from the collection of John Scofield. The second CD contains unreleased studio recordings from the sessions that gave us 1985’s You’re Under Arrest. Produced by Miles Davis and Robert Irving III, You’re Under Arrest reflected Miles’ polarity of passions, from politics to pop music; among its achievements, the album transformed then-contemporary hits like Cyndi Lauper’s “Time After Time” and Michael Jackson’s “Human Nature” into abiding jazz standards. Musicians include Miles (trumpet), Bob Berg (soprano saxophone), John Scofield (guitar), Robert Irving III (keyboards), Darryl Jones (electric bass), Al Foster (drums), Vince Wilburn, Jr. (drums, drum programming, percussion), Steve Thornton (percussion) and John McLaughlin (guitar on “Katia [full session]”). The previously unreleased recordings in this set were mixed by Steve Berkowitz and Dave Darlington in 2022 at Bass Hit Recording, NYC. Disc 3 features Miles Davis Live at the Theatre St. Denis in Montreal, Canada on July 7, 1983. The recording showcases one of Miles Davis’ final great bands including John Scofield on guitar, Bill “The Other Bill Evans” Evans on saxophones, flute and electric piano, Darryl Jones on bass, Al Foster on drums and percussionist Mino Cinélu. Miles was back in amazing form (“incandescent and iridescent as ever”) when he mounted the stage at the Theatre St-Denis during the Festival International de Jazz de Montreal in July 1983. Miles Davis – That’s What Happened 1982-1985: The Bootleg Series Vol. 7 was produced by the multi-GRAMMY winning team of producers Steve Berkowitz, Michael Cuscuna and Richard Seidel and mastered by multi-GRAMMY winning Sony Music engineer Mark Wilder. Related Albums Star People Decoy You’re Under Arrest What It Is: Montreal 7/7/83 Related Videos That’s What Happened 1982-1985: The Bootleg Series Vol. 7 (Unboxing Video) - Aug 12, 2022 What’s Love Got To Do With It (Official Music Video) - Sep 16, 2022 What’s Love Got To Do With It - Jun 17, 2022 What It Is (Live In Montreal – July 7, 1983) - Jul 7, 2022 Hopscotch (Slow) (Official Audio) - Aug 12, 2022 Code 3 (Live In Montreal – July 7, 1983 – Official Audio) -