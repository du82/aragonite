["https://www.milesdavis.com/news/miles-in-france-miles-davis-quintet-1963-64-the-bootleg-series-vol-8"]
title = "Miles in France - Miles Davis Quintet 1963/64: The Bootleg Series, Vol. 8 | Miles Davis Official Site"
description = "MILES IN FRANCE is the eighth installment in the celebrated Miles Davis Bootleg Series and this edition focuses on the birth of the Second Great Quintet in 1963 and 1964."
full_description = "Sep 12, 2024 Miles in France – Miles Davis Quintet 1963/64: The Bootleg Series, Vol. 8 Miles in France – Miles Davis Quintet 1963/64: The Bootleg Series, Vol. 8 Arrives November 8th via Columbia/Legacy Recordings Available as a 6CD / 8LP set featuring over four hours of previously-unreleased music and new liner notes by Marcus J.Moore 2LP break-out set features all recordings from Paris 1964 with The Second Great Quintet Preview Miles In France today with a never-heard version of “So What” Live at the Festival Mondial Du Jazz, Antibes/Juan-Les-Pins: LISTEN HERE The acclaimed Miles Davis “Bootleg Series” has spanned years as early as 1955, and as late as 1985, but it has not yet touched 1963 or 1964 – a pivotal period in Miles’ musical evolution and the auspicious beginnings of the Second Great Quintet – until now. Today, Columbia Records and Legacy Recordings, the catalog division of Sony Music Entertainment, announce the newest box set in the Miles Bootleg Series out November 8th — Miles in France – Miles Davis Quintet 1963/64: The Bootleg Series, Vol. 8 which includes all the music made at the 1963 Festival Mondial Du Jazz in Antibes (July 26-28 of that year) and the 1964 Paris Jazz Festival (October 1). The 1963 recordings feature George Coleman, Herbie Hancock, Ron Carter and Tony Williams – while the 1964 recordings feature Wayne Shorter’s arrival on tenor saxophone as the final member of the Second Great Quintet. Miles In France will arrive November 8th as a 6 CD and 8 LP set with more than four hours of previously unreleased music and new liner notes by journalist Marcus J. Moore. A 2LP break-out set, of just the 1964 recordings, pressed on French flag-inspired blue-white-red vinyl will also be available. The release will also be available digitally in its entirety on DSPs. Pre-orders begin today HERE: Miles in France – Miles Davis Quintet 1963/64: The Bootleg Series, Vol. 8 was produced by the multi-GRAMMY winning team of Steve Berkowitz, Richard Seidel and Michael Cuscuna (marking one of the last productions for Cuscuna, who passed away earlier this year) and mastered by multi-GRAMMY winning Sony Music engineer Vic Anesini at Battery Studios in NYC. Preview the set today with a never-released, nearly ten-minute version of “So What” Live at the Festival Mondial Du Jazz, Antibes/Juan-Les-Pins on July 26th, 1963: HERE France was important to Miles on both a professional and personal level, quickly becoming his preferred live market. He played in France more times than any other country outside the U.S. and recorded there frequently. His history in the country goes back as far as 1949 – when he appeared at the Festival International De Jazz at just 22 years old – and as late as July 1991, for a concert in Nice just two months before he passed. In the early 1960s, Miles came to France having altered the course of jazz. His 1959 landmark album Kind of Blue eschewed hard bop for a modal style that allowed room for a freer type of improvisation – an overcast slow-burner evoking ease and tension. But when compared with the studio version of Kind of Blue, the music coming out of the Quintet in Antibes and Paris had very little room for space and silence. The highs were dramatic and the lows were filled with powerful phrasing – adding fresh perspective to this landmark album in all of jazz. Miles officially hired the rhythm section of Herbie Hancock on piano, Ron Carter on bass, and Tony Williams on drums in the Spring of 1963, and they went into the studio in May of that year with George Coleman on tenor saxophone to record the second half of the Seven Steps To Heaven album. Two months later they arrived in Europe, and Downbeat deemed their performances at the 1963 Festival Mondial Du Jazz to be: “superb… [Davis] was in clean, decisive form and at his lyrical best…” Ron Carter recalls the experience in the new liner notes, adding, “I had never played with anyone like that, of course, and certainly not for this extended period of time. It was just stunning to hear him play like this, play with that intensity, play with that tempo, play with that direction night in and night out and not turn it on to the band and say, ‘Stop that.’ He allowed us to do whatever the chemist allowed his proteges in the lab to do. Take these chemicals I’m giving you guys and see what we come up with. Just call the fire department if necessary.” Miles would return to the U.S. with a new sense of musical purpose, spurred on by the bands he took to France, reveling in the stages they played. By the time Miles recorded E.S.P. with the Second Great Quintet in 1965, he proved that – despite whatever physical and spiritual challenges he may have endured – he was the barometer by which jazz moved and evolved. Some 60 years removed from these recordings, and more than 30 since his passing, Miles is still the summit and pinnacle, the essence of audacity, the monument of all monuments. MILES IN FRANCE – MILES DAVIS QUINTET: The Bootleg Series, Vol. 8 Festival Mondial Du Jazz, Antibes/Juan-Les-Pins, July 26, 1963 1. Introduction by André Francis (:46) 2. So What (9:46) 3. All Blues (11:59) 4. Stella By Starlight (14:13) 5. Seven Steps To Heaven (11:01) 6. Walkin’ (10:43) 7. My Funny Valentine (9:55) 8. Joshua (11:02) 9. The Theme (2:59) 10. Closing announcement by André Francis (0:37) Festival Mondial Du Jazz, Antibes/Juan-Les-Pins July 27, 1963 1. Introduction by André Francis (:52) 2. Autumn Leaves (13:55) 3. Milestones (9:23) 4. I Thought About You (11:47) 5. Joshua (11:31) 6. All Of You (16:44) 7. Walkin’ (16:16) 8. Bye Bye Blackbird (16:49) 9. The Theme (6:06) Festival Mondial Du Jazz, Antibes/Juan-Les-Pins July 28, 1963 1. Introduction by André Francis (1:21) 2. If I Were A Bell (12:46) 3. So What (12:41) 4. Stella By Starlight (15:47) 5. Walkin’ (18:19) 6. The Theme (:28) Paris Jazz Festival, Salle Pleyel, October 1, 1964 (1st concert) 1. Autumn Leaves (12:49) 2. So What (9:39) 3. Stella By Starlight (11:05) 4. Walkin’ (9:07) 5. The Theme (0:38) Paris Jazz Festival, Salle Pleyel, October 1, 1964 (2nd concert) 1. All Of You (16:05) 2. Joshua (12:35) 3. My Funny Valentine (12:18) 4. No Blues (13:13) 5. The Theme (1:05) Back to news"
