title = "Collaborators | Miles Davis Official Site"
description = "Jazz developed as a collaborative process. No legend stood alone. Miles Davis, deserving of all the individual accolades time has bestowed on him, also was influenced by the sounds, musical approaches, and ideas around him. Some collaborators he met by design or inevitability, some purely by chance. While not comprehensive, this section highlights the most significant musicians and music professionals who helped shape Miles’ musical legacy."
