["https://www.milesdavis.com/albums/what-it-is-montreal-7-7-83"]
title = "What It Is: Montreal 7/7/83 | Miles Davis Official Site"
description = '''This double LP release features one of Miles Davis' final great bands including John Scofield on guitar, Bill "The Other Bill Evans" Evans on saxophones, flute and electric piano, Darryl Jones on bass, Al Foster on drums and percussionist Mino Cinelu. Miles was back in amazing form ("incandescent and iridescent as ever" as Greg Tate noted), when he mounted the stage at the Theatre St-Denis during the Festival International De Jazz De Montreal in July 1983 and this release is the first time this revelatory performance will be released. It has been lovingly mixed and mastered and will be included on CD and digitally in the next edition of the Miles Davis Bootleg series that focuses on the 1981-1985 period, coming later in the year, but the Record Store Day release would be its exclusive release on vinyl.'''
full_description = "What It Is Montreal 7/7/83 Buy Now Official Store iTunes Listen Now Amazon Music Apple Music Deezer Pandora Spotify Tidal YouTube Music Save Album Release Date: Jun 18, 2022 Label: Columbia/Legacy Tracklist Apple Music Spotify Artist Name Mute Maximum Volume Previous Track Play/Pause Next Track 0.00 0.00 Want to hear the full song? Click to login to a service & hear full tracks: Apple Music Spotify Disc: 1 Pop-up Player Play/Pause 1. Speak (That’s What Happened)What It Is: Montreal 7/7/83 00:30 Lyrics Add to library Play/Pause 2. Star PeopleWhat It Is: Montreal 7/7/83 00:30 Lyrics Add to library Play/Pause 3. What It IsWhat It Is: Montreal 7/7/83 00:30 Lyrics Add to library Play/Pause 4. It Gets BetterWhat It Is: Montreal 7/7/83 00:30 Lyrics Add to library Play/Pause 5. Hopscotch What It Is: Montreal 7/7/83 00:30 Lyrics Add to library Play/Pause 6. Star On CicelyWhat It Is: Montreal 7/7/83 00:30 Lyrics Add to library Play/Pause 7. Jean PierreWhat It Is: Montreal 7/7/83 00:30 Lyrics Add to library Play/Pause 8. Code 3What It Is: Montreal 7/7/83 00:30 Lyrics Add to library Play/Pause 9. Creepin’ InWhat It Is: Montreal 7/7/83 00:30 Lyrics Add to library Mute Maximum Volume By logging into Apple Music, Deezer, or Spotify through this website, you agree to follow and receive news from Miles Davis and Sony Music. This double LP release features one of Miles Davis’ final great bands including John Scofield on guitar, Bill “The Other Bill Evans” Evans on saxophones, flute and electric piano, Darryl Jones on bass, Al Foster on drums and percussionist Mino Cinelu. Miles was back in amazing form (“incandescent and iridescent as ever” as Greg Tate noted), when he mounted the stage at the Theatre St-Denis during the Festival International De Jazz De Montreal in July 1983 and this release is the first time this revelatory performance was released. It has been lovingly mixed and mastered and was later included on CD and digitally in That’s What Happened 1982-1985: The Bootleg Series Vol. 7, but the Record Store Day release would be its exclusive release on vinyl. What It Is includes tracks from that year’s release Star People, the Marcus Miller tune “Hopscotch” and the song “Jean-Pierre” that appeared on 1982’s We Want Miles. The recordings of “What It Is” and “That’s What Happened” were so well thought of by Miles that he utilized them for his 1984 release Decoy, but in heavily edited form and this release would include the first release of them in complete form. Packaged in beautiful gatefold packaging, the album features liner notes penned by the incomparable music journalist Greg Tate and represent some of his final writing. Related Albums Decoy That’s What Happened 1982-1985: The Bootleg Series Vol. 7 Related Videos What It Is (Live In Montreal – July 7, 1983) - Jul 7, 2022 Related News Sep 23, 2022 Miles Davis ‘What It Is: Montreal 7/7/83’ In Spatial Audio Jul 7, 2022 Miles Davis Previously Unreleased Track ‘What It Is (Live In Montreal)’ Now Available Digitally Jul 6, 2022 Miles Davis ‘What It Is’ Live In Montreal 1983 Track Premiere At WBGO Jun 17, 2022 Miles Davis ‘That’s What Happened 1982-1985: The Bootleg Series Vol. 7’ Coming September 16 Feb 17, 2022 Miles Davis ‘What It Is: Montreal 7/7/83’ 2LP Drops On Record Store Day June 18, 2022 Back to music"
