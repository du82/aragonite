t Up With It. Starting in 1969 and ending in 1974, this box tells the story of a fertile period in Miles’ career, the third or fourth time he basically blew up the rules of jazz and made it again in his own image. Endlessly influential, these albums impacted basically every genre of music to follow in their wake. The albums have all been mastered AAA from 1-to-1 tape transfers of the master tapes by Ryan Smith at Sterling Sound. With GRAMMY Award-winning Steve Berkowitz supervising and consulting, the 11 LPs featured in the box come on 180g black vinyl, pressed at GZ, and will be limited in the first edition to 2,000 units. You can learn the story of these albums via an extensive Listening Notes booklet written by jazz historian and critic Ben Ratliff. Related Albums In A Silent Way Bitches Brew A Tribute To Jack Johnson Live-Evil On The Corner Big Fun Get Up With It Related News Mar 28, 2023 Vinyl Me, Please Releasing Comprehensive Miles Davis: Electric Years Vinyl Box Set Back to music"
