["https://mim.be/fr/propos-des-mrah"]
title = "À propos des MRAH | MIM"
full_description = "À propos des MRAH StructureLes Musées royaux d'Art et d'Histoire font partie des Établissements scientifiques fédéraux gérés par le ministre de la Politique Scientifique de Belgique et sont constitués de ces musées :Musée Art & HistoireMusée des Instruments de MusiquePorte de Hal VisionConnecter les gens, l’art et l’histoire Situés à Bruxelles, au cœur de l'Europe, les Musées royaux d'Art et d'Histoire (MRAH) suscitent la curiosité et l’émerveillement pour les mondes que les femmes et les hommes ont créés. Les MRAH offrent des espaces de démocratisation, d’inclusion et de polyphonie permettant un dialogue critique sur les passés et les futurs. Nous effectuons de la recherche et nous détenons pour la société les œuvres d’art, les objets usuels, les données scientifiques et les documents qui nous sont confiés. Nous sauvegardons des mémoires diverses pour les générations...Connecter les gens, l’art et l’histoire Situés à Bruxelles, au cœur de l'Europe, les Musées royaux d'Art et d'Histoire (MRAH) suscitent la curiosité et l’émerveillement pour les mondes que les femmes et les hommes ont créés.Les MRAH offrent des espaces de démocratisation, d’inclusion et de polyphonie permettant un dialogue critique sur les passés et les futurs. Nous effectuons de la recherche et nous détenons pour la société les œuvres d’art, les objets usuels, les données scientifiques et les documents qui nous sont confiés. Nous sauvegardons des mémoires diverses pour les générations futures et nous garantissons l'égalité de droit et d'accès au patrimoine et à l’expertise scientifique.Nous sommes un établissement scientifique fédéral participatif, sans but lucratif et transparent. Nous travaillons en partenariat actif pour et avec diverses communautés, afin de préserver, collecter, interpréter, exposer et ouvrir les collections à des fins d’études, d’éducation, de réconfort et de délectation. Nous favorisons une compréhension plus profonde des sociétés et des cultures, ce qui nous encourage à mieux prendre soin du monde, en nous permettant de l'imaginer autrement.Nous souhaitons contribuer à la dignité humaine, à la justice sociale, à l'égalité mondiale, au bien-être planétaire et à la perception de la beauté et du temps.Lire plus MissionLes Musées royaux d'Art et d'Histoire ont été fondés par Arrêté royal le 8 août 1835. Lors de la modification du 23 avril 2002, les missions sont enregistrées de la façon suivante : l'acquisition et la conservation d'oeuvres d'art et travaux documentaires d'intérêts scientifique et muséal en relation avec les collections; la tenue d'un inventaire général dans lequel chaque objet d'art est inscrit, avec la mention de la date d'acquisition, l'origine, le prix d'achat et d'autres informations importantes. l'organisation d'un dépôt d'archives, un centre de documentation relatifs aux...Les Musées royaux d'Art et d'Histoire ont été fondés par Arrêté royal le 8 août 1835. Lors de la modification du 23 avril 2002, les missions sont enregistrées de la façon suivante :l'acquisition et la conservation d'oeuvres d'art et travaux documentaires d'intérêts scientifique et muséal en relation avec les collections;la tenue d'un inventaire général dans lequel chaque objet d'art est inscrit, avec la mention de la date d'acquisition, l'origine, le prix d'achat et d'autres informations importantes.l'organisation d'un dépôt d'archives, un centre de documentation relatifs aux collections et d'une bibliothèque spécialisée dans les domaines représentés dans l'institution;la collecte de données scientifiques et documentaires relatives aux collections;la réalisation de travaux scientifiques en relation avec les collections;la valorisation et la diffusion des résultats de la recherche scientifique, tant au plan national qu'international;la participation active à des missions scientifiques;la participation active à des projets et rencontres scientifiques, tant au niveau national qu'international;le service au public par l'information sur les collections, l'organisation d'activités didactiques, l'assistance aux chercheurs;la constitution d'une banque de données concernant les collections d'oeuvres d'art, les archives, la bibliothèque;la publication d'ouvrages scientifiques et d'autres destinés à un large public.établir un plan de numérisation couvrant simultanément les éléments constitutifs du patrimoine, c'est-à-dire la numérisation des collections et des documents, et les systèmes d'information relatifs au patrimoine en développant l'information électronique en ligne et hors ligne.Lire plus Objectifs stratégiquesCréer des centres d’expertise en favorisant les collaborations scientifiques interdisciplinaires à l'échelle nationale et internationale. Lancer la transition des MRAH vers un Gold Standard Open access et l’Open data Optimaliser la gestion des collections des MRAH. Revitaliser, rénover et moderniser le Musée Art & Histoire. Moderniser la gouvernance des MRAH. Améliorer les procédures et méthodes de travail dans le cadre de la gestion des ressources humaines et de prévention pour en augmenter l'efficacité et atteindre un état de bien-être satisfaisant pour l'ensemble du personnel. Créer des centres d’expertise en favorisant les collaborations scientifiques interdisciplinaires à l'échelle nationale et internationale.Lancer la transition des MRAH vers un Gold Standard Open access et l’Open dataOptimaliser la gestion des collections des MRAH.Revitaliser, rénover et moderniser le Musée Art & Histoire.Moderniser la gouvernance des MRAH.Améliorer les procédures et méthodes de travail dans le cadre de la gestion des ressources humaines et de prévention pour en augmenter l'efficacité et atteindre un état de bien-être satisfaisant pour l'ensemble du personnel.Lire plus Rapports annuelsLes rapports annuels se trouvent sur la page des Publications."
