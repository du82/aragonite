title = "Enseignement spécialisé | MIM"
full_description = "Enseignement spécialisé Le MIM accorde une attention particulière aux enfants et jeunes de l’enseignement spécialisé. Quelle que soit la spécificité du groupe, le guide mettra tout en œuvre pour que chacun se sente accueilli et respecté dans sa différence. L'instrument de musique est au centre d'un moment d'échange et de rencontre enrichissant pour tous. Manipulations, « bain musical », jeux musicaux, écoute, observation et dialogue... sont au menu, en fonction des possibilités des participants. Un contact préalable avec le responsable du groupe est prévu pour ajuster au mieux le déroulement. Un passage par l'Atelier...Le MIM accorde une attention particulière aux enfants et jeunes de l’enseignement spécialisé. Quelle que soit la spécificité du groupe, le guide mettra tout en œuvre pour que chacun se sente accueilli et respecté dans sa différence. L'instrument de musique est au centre d'un moment d'échange et de rencontre enrichissant pour tous. Manipulations, « bain musical », jeux musicaux, écoute, observation et dialogue... sont au menu, en fonction des possibilités des participants. Un contact préalable avec le responsable du groupe est prévu pour ajuster au mieux le déroulement. Un passage par l'Atelier est possible mais pas obligatoire.Lire plusInfos pratiquesPrix : 90 € (de 8 à 12 participants maximum par groupe, en fonction de la composition du groupe) Durée : 90 min Réservation uniquement par le formulaire de réservation. Pour toutes autres questions ou remarques vous pouvez nous contacter par téléphone au +32 (0)2 741 73 02, ou par mail."
