["https://mim.be/fr/activity/dyad"]
title = "DYAD | MIM"
full_description = "DYAD Didier Laloy et Adrien Tyberghein, deux musiciens hors normes, forment un duo né du désir d’allier deux univers en apparente opposition : la musique dite “sérieuse” et la musique “légère”.Leur duo brise les frontières stylistiques en mêlant musiques traditionnelles, musique classique, rock et musique électronique. Leur répertoire est composé de musiques originales révélant toute la richesse de cette collaboration. Des rythmes fous, aux mélodies expressives, ces compositions emmènent le public à la croisée des mondes.Didier rêvait, entrant sur scène, de serrer la main d’un chef d’orchestre. Adrien rêvait, lui, d’improviser sur des thèmes traditionnels venus d’ailleurs. Leurs rêves se réalisent dans ce duo atypique, viscéral et définitivement rock. Activité Concert Langue Anglais/Français Lieu MIM Tickets Des tickets sont disponibles. Tickets Public cible Tous Prix €30.00 Date Samedi 15 février 2025 20:00 - 22:00 Didier Laloy et Adrien Tyberghein, deux musiciens hors normes, forment un duo né du désir d’allier deux univers en apparente opposition : la musique dite “sérieuse” et la musique “légère”.Leur duo brise les frontières stylistiques en mêlant musiques traditionnelles, musique classique, rock et musique électronique. Leur répertoire est composé de musiques originales révélant toute la richesse de cette collaboration. Des rythmes fous, aux mélodies expressives, ces compositions emmènent le public à la croisée des mondes.Didier rêvait, entrant sur scène, de serrer la main d’un chef d’orchestre. Adrien rêvait, lui, d’improviser sur des thèmes traditionnels venus d’ailleurs. Leurs rêves se réalisent dans ce duo atypique, viscéral et définitivement rock."
