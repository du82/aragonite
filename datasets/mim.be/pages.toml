["https://mim.be/fr/collections-online"]
title = "Collections online | MIM"
full_description = "Collections online CarmentisEn tant qu’entité constitutive des Musées Royaux d’Art et d’Histoire, le MIM dispose d’une fenêtre ouverte sur l’ensemble de ses collections via la base de données Carmentis, qui réunit de la documentation issue des quatre implantations des MRAH. Pour obtenir uniquement les collections du MIM, il vous suffit de sélectionner Collection instruments de musique dans la recherche approfondie de Carmentis.MIMOParallèlement, le MIM se sert de Carmentis en tant qu’instrument d’élaboration et d’enrichissement d’une base de données d’étendue internationale appelée MIMO (Musical Instrument Museums Online), laquelle offre actuellement un accès aux collections de 11 musées d'instruments de musique en Europe. A l'heure actuelle, MIMO a recensé quelque 45.000 instruments, traduits en 7 langues européennes. MIMO fait lui-même partie d'un projet plus large, Europeana, visant à récolter digitalement la plus grande quantité possible d'éléments de notre patrimoine, qu'il s'agisse de collections issues de nos bibliothèques, archives ou musées."
