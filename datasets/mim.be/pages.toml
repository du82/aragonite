title = "Gender Equality Plan RMAH | MIM"
full_description = "Gender Equality Plan RMAH Gender Equality Plan for the Royal Museums of Art and History (RMAH).On 17 December 2021, the executive committee of the POD Science Policy approved a Gender Equality Plan for BELSPO and the FSI. This plan is prepared to promote gender equality in scientific research and applies to BELSPO and to all FSI, including the RMAH.The European Gender Equality Plan (GEP) is required from 2022 when an organisation wishes to participate in the calls for proposals of the European Framework Programme. Twenty actions are listed under nine headings, in line with the Federal Gender Mainstreaming programme and with the eponymous network being the central actor and focal point."
