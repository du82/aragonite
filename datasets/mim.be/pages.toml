title = "Family trails | MIM"
full_description = "Family trails Do you like music, animals and games? Then come to the MIM and play Animal Bingo with the whole family! Ask for your bingo card at reception and go in search for the instruments depicted on it. They all have something to do with animals. The first person to find 5 instruments in a row is the winner. Through the special Animal Bingo tour in your audio guide, you will learn more about the instruments and hear what they sound like. Do you also enjoy colouring? Then here's a treat: colouring sheets to print at home! You'll encounter some animals, but there are other things to discover as...Do you like music, animals and games? Then come to the MIM and play Animal Bingo with the whole family!Ask for your bingo card at reception and go in search for the instruments depicted on it. They all have something to do with animals. The first person to find 5 instruments in a row is the winner.Through the special Animal Bingo tour in your audio guide, you will learn more about the instruments and hear what they sound like.Do you also enjoy colouring? Then here's a treat: colouring sheets to print at home! You'll encounter some animals, but there are other things to discover as well. A lovely souvenir of a fun visit to the MIM.What? Family fun trail for children from 4 years old.Price? Included in a ticket, bingo cards available at the reception (ENG, NL, FR).Time and place? Takes about 1 hour, the instruments are located in the exhibition halls on floors 0 and 1.This game cannot be reserved. Subject to availability.Read more Capra, Helena Popa, Romania, 2007, inv. 2007.012"
