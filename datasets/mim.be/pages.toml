["https://mim.be/en/conservation-restoration-workshop"]
title = "Conservation & restoration workshop | MIM"
full_description = "Conservation & restoration workshop Specialists in woodworking, lutherie, copper processing and surface treatment work here on the conservation and restoration of instruments. The workshop is open by appointment only to professionals who are working with musical instruments.Like most museums, the MIM adheres to four basic principles of conservation and restoration:The aesthetic, historic and physical integrity of the object is respected.The quality of the restoration is not determined by the known value of the article. Every item in our collection will receive careful treatment.If the results of the potential treatment techniques are not reversible, then we avoid such techniques. Treatment must essentially always be reversible. New parts receive a MIM stamp.Each treatment is the subject of a written report with photographs showing the state of the object and the materials and techniques used in its treatment. During work on instruments of great documentary value, the restorer makes detailed technical drawings."
year_published = 2025
