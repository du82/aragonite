["https://mim.be/en/faq"]
title = "FAQ | MIM"
full_description = "FAQ Opening hoursWhat are the museum opening hours?The museum is open from Tuesday to Friday from 9:30 to 17:00. On Saturday and Sunday from 10:00 to 17:00. The museum is closed on Mondays. Ticket sales close at 16:00. The museum closes at 17:00, from 16:45 visitors are asked to leave. Is the museum open every day?No, the museum is closed on Mondays. We are closed on 01.01, 01.05, 01.11, 11.11 & 25.12. On 24 and 31.12, the museum closes at 15:00 (last entrance at 14:00). How much time should I allow for a museum visit?Allow about 90 min for a visit. If you want to see everything, you'll spend easily half a day.Tickets What are the rates and can I get a discount on the entrance fee?An overview of our rates and discounts can be found here. Is the museum free of charge on the first Wednesday or Sunday of the month?No, the museum is not free of charge on the first Wednesday or Sunday of the month. Can I buy tickets at the welcome desk?Yes, you can buy tickets at the welcome desk. However, as the number of tickets available per time slot is limited, we recommend you book your tickets in advance. I bought my ticket online, but I did not get a confirmation. What do I do now?First check your Spam folder, then contact our Reservations department: reservations@kmkg-mrah.beAccessibilityWhere is the Museum located?The Museum is located at Hofberg 2 Montagne de la Cour, 1000 Brussels. Which are the nearest public transport stops?By train: Brussel-Centraal/Bruxelles-Central is a mere 200 metres away from the museum.By metro: lines 1 & 5, stations Gare Centrale or ParcBy bus: lines 27, 38, 71 & 95, stop RoyaleBy tram: lines 92 & 93, stop Royale Where can I park with my car?Driving through and finding a parking space in the city centre of Brussels can be difficult due to traffic. For this reason, We strongly advises you to use one of the designated car parks located on the outskirts of Brussels (e.g. those close to metro stations Erasme, Delta or Kraainem) to relieve congestion and take public transport to enter the city. If, however, you wish to park your car closer to the museum, we recommend that you use the Congrès-Albertine underground car park (paid parking).Is the Museum wheelchair accessible?The museum is fully accessible for visitors with reduced mobility. Two designated parking places can also be found in front of the museum entrance.CollectionsWhat kind of collections does the Art & History Museum have?You can find an overview of the Museum's collections in the galleries here and in our online catalogue Carmentis. How can I contact the curators of the collections? You will find the curators' contact details here. CloakroomIs the cloak room free of charge?Yes, the cloakroom consists of lockers. Is your luggage too big for a locker? You can leave it in the unattended cloakroom on the ground floor at your own riskGroup visitsDo I need to book in advance if I come with a group?Yes, larger groups (more than 15 people) must always book their visit in advance, even when not booking a guided tour. Bookings can be made via this webform. Do I need to order tickets in advance?Groups of up to 15 people are not required to purchase tickets in advance. Booking advised if you want to visit at your preferred time. Do I have to pay in full upon booking?Group reservations must be paid in advance. Can I cancel my ticket?No, tickets cannot be refunded or exchanged. Can I get an invoice?For group bookings, you will receive a booking confirmation where you will be asked to transfer the fee for the guide and the entrance fees. Only government organisations can pay by invoice after sending an official order form. No invoices can be issued for ticket purchases via the welcome desk, kiosks or online ticket shop. I would like to book a guide, how many days in advance should I do this?You should book a guided visit or workshop at least three weeks in advance. You can book via this webform.Can I take a guided tour?Yes, we organise guided tours and workshops on request. Look here to see what’s on offer and for practical information. As an individual visitor, you can sometimes join an introductory tour. Check the calendar for dates and themes.MuseumshopIs access to the museumshop free of charge?Yes, you can visit the museumshop without buying a ticket. What are the opening hours of the museumshop?The museumshop is open during Museum opening hours. Tuesday - Friday: 9.30am - 12pm & 1pm - 4.45pm Saturday - Sunday: 10am - 12pm & 1pm - 4.45pm Closed on Mondays, 01/01, 01/05, 01/11, 11/11, 25/12.Can I order online?We do not have a webshop, but you can always contact the museumshop for more information by sending an email at bookshop@mim.be or a phone call to +32 (0)2 545 01 62 What can I find in the museumshop?The museumshop is a treasure chest full of books, CDs, postcards and all sorts of musical gadgets. The shopping team constantly scans the market to find the best items that reflect our dual passion: music and art nouveau. A special corner is reserved for the children. Here, the young melomane can find books with stories, games and counting rhymes, all about music. You will also find publications by our scientists and educational services. Can I buy plaster casts from the Museum's plaster cast workshop?Yes, a selection from the plaster cast workshop is offered for sale. For customised orders, take a look here. Do you offer a loyalty card?Yes, ask for your loyalty card on your first purchase.RestaurantCan I have something to eat or drink at the museum?The museum restaurant is currently closed for renovation but there are plenty dining facilities around the MIM. However, we provide a picnic area where you can have your own meal. The place can also be reserved for groups. To make a group reservation, please in touch with the box office via reservations@kmkg-mrah.be.Image StudioWho can I contact for photographs, videos and sound recordings of musical instruments? For photographs, fill in this webform. For sound recordings, send us an email to bib1@kmkg-mrah.be. The MIM does not have a video archive but you can view MIM's homemade videos on our YouTube channel. All MIM's collections can be searched through the online museum catalogue Carmentis.Other questions How many instruments does the MIM have?About 10,000. Of these, around 1200 are on display in the galleries. The rest is kept in the reserves. Check out our online catalogue here. What happens to instruments not on display?They are kept in an air-conditioned store with lighting control. Are the instruments in the collection ever played?Only very occasionally. This scientific institution's mission is primarily to conserve its patrimony for later generations and use of the instruments in an artistic context would be at odds with that mission. I have an instrument. Can anyone from the MIM tell me what it is worth?The MIM is not allowed to value instruments, but we can tell you if we would be interested should you consider gifting it or selling it to the MIM. Contact us via info@mim.be. I want to gift or sell an instrument to the MIM. How do I go about this?Contact us via info@mim.be. In the first instance, the relevant curator will consider whether or not your proposal would add substantially to our already very extensive collection. The case is then discussed in a scientific meeting. Where a gift or sale is agreed, an official contract is drawn up. Please note that the MIM never guarantees to put items on show. I have a musical instrument but I don't know what it is or how to play it. Whose advice can I ask?Contact us via info@mim.be. Please give us as much information as possible and a picture of the instrument. I have invented a new instrument. Who can I show it to?Contact us via info@mim.be. In the first instance, the relevant curator will consider whether or not your proposal would add substantially to our already very extensive collection. The case is then discussed in a scientific meeting. Where a gift or sale is agreed, an official contract is drawn up. Please note that the MIM never guarantees to put items on show. I have some old recording and reproduction equipment. Might the MIM be interested in it?Though we do have some reproduction equipment, this is not the MIM's speciality. However, you can send a message to info@mim.be. I have piano rolls / wax cylinders / vinyl records / tapes / cassettes. Might the MIM be interested in them?This is unlikely but send details anyway. Send a message to info@mim.be. Does the MIM provide technical drawings of instruments?Yes, for some we do. Please reach the museumshop. How many people visit the MIM each year?On average 125,000 people visit the museum every year. Group visits, especially from schools, make up some 15% of the total number of visitors. How would you describe the typical visitor to the MIM?Typically the MIM attracts better educated adults aged between 25 and 65, often in couples or small groups. The age group tends to be younger at 'nocturnes' and special events.A staggering 72% of visitors to the MIM are foreigners; consequently, the percentage of return visitors is low (13%). Most of the Belgians come from the Brussels Region (48%), most of the foreigners from France (28%), UK (13%), the Netherlands (7%), the USA, Germany, Spain and Italy (each approx. 6%). Is the MIM a municipal, provincial, regional or federal museum?The MIM is a federal scientific institution, 4th department of the Royal Museums of Art and History (RMAH). The RMAH is one of the group of four large federal museums, along with the Royal Belgian Institute of Natural Sciences, the Royal Museum for Central Africa and the Fine Arts Museum. Does the MIM organise its own concerts? Currently, the museum does not organise its own concert series. However, we work with external partners so that live music can be heard! There are concerts for which you have to pay but there are also many free performances. You can find all the details in the calendar. Can I organize a concert at the MIM?Yes it's possible. Send an email with your proposal to public@kmkg-mrah.be. Does the MIM hire out musical instruments?No. Items in the collection never leave the museum to be played. The only time they leave is as loans to temporary exhibitions. Can the MIM give me information about musicians?We suggest you try out the following online databases : Kunstenpunt (pop and classical music, Dutch), Muziekmozaïek (folk and jazz, Dutch) and Centre Belge d'Action Interculturelle (world music, French). You can also get interesting information at Conseil de la Musique (French). Can the MIM provide me with details of instrument makers?As a public institution we are not allowed to do that, but you can find more information at schools of instrument making like in Boom (string instruments and guitar), Bruges (guitar), Ghent, Marche-en-Famenne (strings), Puurs-Sint-Amands (strings, guitar, keyboards) and Wavre (guitar)."
