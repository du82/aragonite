full_description = "Contact AddressMusical Instruments Museum (MIM) Hofberg 2 Montagne de la Cour B-1000 Brussels (Belgium) Ph: + 32 2 545 01 30Do you want to book a guided tour or a workshop? E: reservations@kmkg-mrah.beDo you have an issue with your online ticket? E: reservations@kmkg-mrah.beAs a teacher, do you want more information about MIM's educational offer? E: public@kmkg-mrah.beAs a journalist, are you looking for an interview or more information? E: m.janssens@kmkg-mrah.beTo report any problems with this website. E: m.janssens@kmkg-mrah.beDo you want to support the Museums? E: b.suys@kmkg-mrah.beDo you have a question about objects or books in the shops? E: bookshop@mim.beDo you wish to view a document at the library? E: bib1@kmkg-mrah.beDo you have a question about the Museum's collection? E: info@mim.beOther questions? E: info@mim.be ComplaintsWe at the Royal Museums for Art and History care about the quality of our services. However, if you have any comment or a grievance relating to the museum, please let us know. We appreciate your feedback so we can avoid similar situations in the future. To send us your comment, please use this webform. You will receive a personal reply within 30 days."
