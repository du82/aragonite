title = "MIM | MIM"
full_description = "Musée des Instruments de Musique 15.02.2025MIM DYAD Finday Culture Lire plus 16.02.2025MIM Student Sound Series Koninklijk Conservatorium Brussel Lire plus 18.02.2025MIM Concert des classes Conservatoire royal de Bruxelles Lire plus Une collection de renommée mondiale dans un magnifique bâtiment Art Nouveau !Le MIM abrite une collection d'instruments de musique de renommée mondiale. Situé au coeur du Mont des Arts, parmi d'autres musées et lieux culturels incontournables, il occupe l'ancien magasin Old England, qui constitue l'un des plus beaux exemples Art Nouveau de Bruxelles.Le musée fait la part belle aux instruments de musique à la fois anciens et modernes et aux instruments du monde et populaires. Les collections sont réparties sur quatre étages d'exposition, apportant chacun un éclairage particulier. Vous pouvez y flâner des heures en écoutant la musique des instruments exposés. Infos pratiques Agenda Visites guidées Sous les projecteurs Podcasts La musique traditionnelle en Belgique Salles d'exposition Instruments insolites Collections phares Museumshop Bibliothèque Publications Restaurant (fermé temporairement) Espace pique-nique Visite virtuelle"
