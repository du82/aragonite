["https://mim.be/fr/offres-demploi"]
title = "Offres d'emploi | MIM"
full_description = "Offres d'emploi Travailler pour les MRAHVous êtes diplômé en histoire de l’art et archéologie et vous souhaitez mettre vos compétences et vos talents au service de nos musées? Consultez régulièrement cette page pour être informé des emplois à pourvoir en qualité de collaborateur scientifique. Vous êtes un archéologue ou un historien confirmé? Vous souhaitez participer à la conservation et à la mise en valeur de nos collections? Les fonctions (statutaires) vacantes de conservateur de collection font l’objet d’une publication au Moniteur belge.Vous êtes électricien, informaticien, ingénieur, juriste, menuisier, restaurateur d’objets d’art ou encore secrétaire et vous souhaitez exercer votre profession au sein d’une institution culturelle? Consultez nos offres d’emploi sur le site du Bureau de sélection de l’administration fédérale à l’adresse suivante: http://www.travaillerpour.beConsultez également les offres d’emploi pour l’ensemble des institutions scientifiques fédérales sur le site du Service public fédéral de programmation Politique scientifique (http://www.belspo.be)."
