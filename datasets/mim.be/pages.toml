["https://mim.be/fr/atelier-de-conservation-restauration"]
title = "Atelier de conservation & restauration | MIM"
full_description = "Atelier de conservation & restauration Des spécialistes dans les domaines de la lutherie, du travail du bois et du métal ou des traitements de surface s'occupent de la conservation et de la restauration des instruments. L'atelier de restauration est accessible, uniquement sur rendez-vous, aux personnes exerçant une activité professionnelle en lien avec les instruments de musique.Comme la plupart des musées, le MIM adhère à quatre principes fondamentaux de conservation et de restauration :L'intégrité esthétique, historique et physique de l'objet est respectée.La qualité de la restauration n'est pas déterminée par la soi-disant valeur de l'objet. Chaque objet de la collection est traité avec soin.Si les résultats de certaines techniques de traitement ne peuvent être corrigés par la suite, ces techniques de traitement sont évitées. Toute réparation est réversible. De nouveaux éléménts apportés à l'instrument reçoivent une estampe MIM.Chaque traitement est accompagné d'un rapport écrit avec photos décrivant l'état de l'objet, le traitement et les matériaux et techniques utilisés. Pour les instruments à haute valeur documentaire, le restaurateur réalise un dessin technique détaillé pendant l'intervention."
year_published = 2025
