nly be used for the purpose of sending you appropriate issues of the RMAH Emailings will never be shared with third parties, and will be retained until you request us to no longer send you communications. You have the right to request access or modifications to your data at any time, and to withdraw your consent by clicking on the ‘unsubscribe’ link on any email from RMAH, or by contacting us directly at marketing@RMAH.com3. Cookies: Google AnalyticsThis website uses Google Analytics, a web analytics service provided by Google, Inc. (“Google”). Google Analytics uses “cookies”, which are text files placed on your computer, to help the website analyze how users use the site. The information generated by the cookie about your use of the website (including your IP address) will be transmitted to and stored by Google on servers in the United States. Google will use this information for the purpose of evaluating your use of the website, compiling reports on website activity for website operators and providing other services relating to website activity and internet usage. Google may also transfer this information to third parties where required to do so by law, or where such third parties process the information on Google’s behalf. Google will not associate your IP address with any other data held by Google. You may refuse the use of cookies by selecting the appropriate settings on your browser, however please note that if you do this you may not be able to use the full functionality of this website. By using this website, you consent to the processing of data about you by Google in the manner and for the purposes set out above. For details please visit www.google.com/privacy4. Contacting us via emailWhen you submit an enquiry to RMAH via our ‘Contact' page, an email is sent directly to our secure email server. No data you provide is stored anywhere on the RMAH website as a result of this action. The details of your enquiry may be stored by RMAH employees in our email archives following receipt.5. External LinksThe RMAH website contains links to other websites, which may or may not have connections to RMAH. Please note that RMAH is not responsible for the data protection practices of other websites.6. Data controllers and processorsRMAH is classified as the Data Controller under the General Data Protection Regulation (“GDPR”). RMAH acts as the controller for any data you provide. RMAH can be contacted by post, email, or telephone as follows: Royal Museums of Art and History Data Protection Officer Jubelpark 10 1000 Brussels Belgiumdpo@RMAH.comEmployees of RMAH may be designated as data processors, and will be able to update your information or assist you with the enactment of any of your rights relating to data you have provided to RMAH. All data you provide will be processed in line with the GDPR:impose confidentiality obligations on all personnel processing relevant data;review our data security and integrity policies;abide by the GDPR’s rules regarding the appointment of sub-processors;implement procedures to assist the data controller to comply with the rights of data subjects;assist the data controller in complying with other regulatory requirements;return or destroy personal data at the end of the data processing relationship at the data controller’s choice; andprovide the data controller with all information required to demonstrate compliance with the GDPR7. Your rightsThe following rights are conferred to you under the GDPR:You have the right to request a copy of all data that RMAH holds on you as an individual. Any requests for access to your data will be honoured within one month from receipt.You have the right to request that any incorrect information held by RMAH is updated without undue delay.You have the right to request that all data relating to you is erased by RMAH.You have the right to receive a copy of your data in a structured, machine-readable format where appropriate.You have the right to withdraw your consent for further processing at any time, either by opting out of future emails or by contacting RMAH using the information in Section E above.8. Any Further QuestionsIf you have any further questions regarding the data RMAH collects, or how we use it, then please feel free to contact us by email at: dpo@RMAH.comLast updated: February 8, 2022"
