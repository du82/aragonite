["https://mim.be/fr/pret-doeuvres"]
title = "Prêt d'oeuvres | MIM"
full_description = "Prêt d'oeuvres Les Musées royaux d'Art & d'Histoire souhaitent faire connaître leurs collections à un public national et international. Les demandes de prêt doivent être adressées au Directeur général (secr-direction@kmkg-mrah.be) et doivent nous parvenir au moins 6 mois avant l’ouverture de l’exposition. Elles doivent être accompagnées de cette feuille de renseignements.En cas d’avis positif, nous vous communiquerons toutes les conditions pour ce prêt (assurance, frais administratifs, transport, demandes spécifiques quant à la conservation, la manipulation et les éventuels frais annexes). Contact Damien Filippiloans@kmkg-mrah.be Feuille de renseignements"
