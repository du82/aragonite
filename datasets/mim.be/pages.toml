["https://mim.be/fr/soutenez-nous"]
title = "Soutenez-nous | MIM"
full_description = "Soutenez-nous Les Musées royaux d'Art et d'Histoire sont reconnus par le gouvernement en tant qu’organisations caritatives. Ce statut comporte des avantages fiscaux pour vous et pour nos musées. Nous accueillons toute forme de soutien avec reconnaissance. Votre don nous aidera à rendre le séjour des visiteurs encore plus agréable. Faites un don spontanéSi vous souhaitez nous soutenir, votre générosité nous aidera à rendre le séjour des visiteurs encore plus agréable. Un don de minimum 40 € sur notre compte en banque IBAN BE06 6790 0226 2322 - BIC PCHQBEBB vous donne droit à une réduction d'impôt de 45% sur le montant donné. Nous vous fournissons automatiquement l'attestation fiscale. Trompette à pistons - Adolphe Sax, Paris, 1869 Devenez un Ami, une Amie des MuséesDevenir membre de l'asbl « Les Amis/De Vrienden », vous réserve de nombreux avantages. Vous pouvez également participer aux activités de notre association d'amis. website Amis des Musées ‘Nymphe’ – Égide Rombaux, Bruxelles, 1900 Devenez mécèneLes particuliers qui souhaitent nous octroyer des sommes importantes peuvent rejoindre notre groupe de mécènes. Nous leur réservons alors un accueil très personnalisé. Nous accueillons à bras ouverts les entreprises qui s'engagent socialement. Bart Suys, Collecte de fonds & Mécénat | b.suys@kmkg-mrah.be ‘Le Triomphe du Temps’ - Dirck Vellert, Anvers, 1517 Devenez entreprise-partenaireNous accueillons à bras ouverts les entreprises qui s'engagent socialement. En tant que partenaires, nous réaliserons ensemble des projets de grande envergure. Bart Suys, Collecte de fonds & Mécénat | b.suys@kmkg-mrah.be Jardin d’hiver de la maison de Jean Cousin – Victor Horta, Bruxelles, 1900 Mettez les musées dans votre testamentVous pouvez donner de votre vivant, mais aussi lorsque vous n'êtes plus de ce monde, vous pouvez nous laisser des fonds. Afin d’assurer le bon déroulement de la procédure, nous vous conseillerons nous-mêmes ou nous ferons appel à l'expertise de notre partenaire, l'asbl Testament.be. Bart Suys, Collecte de fonds & Mécénat | b.suys@kmkg-mrah.be Photo artistique - Pierre Dubreuil, Paris, vers 1905 Faites don d'une oeuvre d'artNous sommes heureux de compléter notre collection constituée de milliers d'objets avec des œuvres importantes d’une grande valeur artistique, archéologique ou anthropologique. Le conservateur compétent, la conservatrice compétente entamera un dialogue avec vous. Bart Suys, Collecte de fonds & Mécénat | b.suys@kmkg-mrah.be Fibule discoïde mérovingienne – Orp-Jauche, Belgique, 2e moitié du 6e-début du 7e siècle Devenez volontaireDe nombreuses mains font le travail de qualité. Veuillez nous contacter si vous souhaitez nous aider à accueillir le public ou à soutenir les conservateurs et conservatrices et les différents services. Service au public | public@kmkg-mrah.be ‘Mède apportant une offrande’ – Persépolis (?), Iran, 500-330 av. J.-C. Nos partenaires les plus importants"
