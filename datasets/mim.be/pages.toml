["https://mim.be/fr/parcours-en-famille-0"]
title = "Parcours en famille | MIM"
full_description = "Parcours en famille Tu aimes la musique, les animaux et les jeux? Alors bienvenue au MIM pour jouer au ZooBingo avec toute ta famille! Demande la carte bingo à l'accueil puis pars à la recherche des instruments présents sur les cartes. Tous ont quelque chose... d'animal! Le premier à trouver cinq instruments d'une même ligne sera le vainqueur! Grâce au tour spécial ZooBingo sur ton audioguide, tu apprendras des choses étonnantes sur les instruments, mais tu pourras aussi entendre leur son! Et colorier, tu aimes aussi ? Alors voici de quoi t’amuser à la maison : donne à ces instruments les couleurs le...Tu aimes la musique, les animaux et les jeux? Alors bienvenue au MIM pour jouer au ZooBingo avec toute ta famille!Demande la carte bingo à l'accueil puis pars à la recherche des instruments présents sur les cartes. Tous ont quelque chose... d'animal! Le premier à trouver cinq instruments d'une même ligne sera le vainqueur!Grâce au tour spécial ZooBingo sur ton audioguide, tu apprendras des choses étonnantes sur les instruments, mais tu pourras aussi entendre leur son!Et colorier, tu aimes aussi ? Alors voici de quoi t’amuser à la maison : donne à ces instruments les couleurs le plus fantastiques ! Ici aussi tu verras des animaux. Mais… pas partout. Les intrus ne seront pas difficiles à trouver !Pour qui ? Familles avec des enfants à partir de 4 ans.Tarif ? Inclus dans un billet d'entrée, disponible à l'accueil en français, anglais et néerlandais.Durée et endroit ? Environ 1 heure, le jeu se déroule dans les salles d'exposition du musée, aux étages 0 et 1. Il n'est pas possible de réserver cette activité. Le jeu est disponible à l'accueil du musée, sous réserve de disponibilité.Lire plus Capra, Helena Popa, Roumanie, 2007, inv. 2007.012"
