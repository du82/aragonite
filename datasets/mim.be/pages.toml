full_description = "Fête d'anniversaire Transforme ce jour dont tu es le héros en une aventure inoubliable ! Le MIM t'attend, toi et tes copains ! Quelle que soit la formule, la musique sera au cœur de la fête : jeu de piste, histoires, jeu d'ensemble, écoute et manipulation d'instruments seront les ingrédients d'un anniversaire mémorable ! Mimomagicus 6 - 9 ansSi tu as entre 6 et 9 ans, Mimomagicus, la baguette magique, t'emmènera à la découverte des instruments de l'orchestre. Voyage musical 10 - 12 ansSi tu as entre 10 et 12 ans, nous t'emmènerons dans un voyage musical autour du monde.Infos pratiquesIl est possible de manger un gâteau d'anniversaire et de recevoir les cadeaux de tes amis après l'activité dans l'espace pique-nique du musée. Attention : les bougies ne sont pas autorisées dans le musée !Invite tes amis à l'aide de ce carton d'invitation. Tu peux même le colorier !Prix : 150 € (15 enfants maximum + 1 accompagnant et petit cadeau) Durée : 120 min Réservation uniquement par le formulaire de réservation. Pour toutes autres questions ou remarques vous pouvez nous contacter par téléphone au +32 (0)2 741 73 02, ou par mail. Guide pratique pour les parents"
