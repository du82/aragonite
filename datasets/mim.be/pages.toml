title = "Plan d'égalité des genres MRAH | MIM"
full_description = "Plan d'égalité des genres MRAH Plan d'égalité des genres pour les Musées royaux d'Art et d'Histoire (MRAH)Le 17 décembre 2021, le comité exécutif du SPP Politique scientifique a approuvé un plan d'égalité des genres pour Belspo et les ESF. Ce plan est établi pour promouvoir l'égalité des genres dans la recherche scientifique et s'applique à Belspo et à tous les ESF, y compris les Musées royaux d'Art et d'Histoire (MRAH). Le Plan européen pour l'égalité entre les femmes et les hommes (GEP) est requis à partir de 2022 lorsqu'une organisation souhaite participer aux appels à propositions du programme-cadre européen. Vingt actions sont répertoriées sous neuf rubriques, en ligne avec le programme fédéral Gender Mainstreaming et dont le réseau éponyme est l'acteur central et le point de contact."
