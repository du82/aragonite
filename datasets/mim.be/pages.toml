["https://mim.be/en/activity/dyad"]
title = "DYAD | MIM"
full_description = 'DYAD The two extraordinary musicians Didier Laloy and Adrien Tyberghein form a duo that combines two seemingly opposite worlds, so-called "serious" music and "light" music.Their duo breaks stylistic boundaries by mixing traditional-, classical-, electronic music and rock. Their repertoire consists of newly composed music that shows the richness of this collaboration. The crazy rhythms and expressive melodies of these compositions take the audience to the crossroads of different worlds.Didier dreamed of shaking the hand of a conductor when he took the stage. Adrien dreamed of improvising on traditional themes from elsewhere. Their dreams come true in this atypical duo. Activity Concert Language English/French Location MIM Tickets Tickets are available Tickets Target audience All Price €30.00 Date Saturday 15 February 2025 20:00 - 22:00 The two extraordinary musicians Didier Laloy and Adrien Tyberghein form a duo that combines two seemingly opposite worlds, so-called "serious" music and "light" music.Their duo breaks stylistic boundaries by mixing traditional-, classical-, electronic music and rock. Their repertoire consists of newly composed music that shows the richness of this collaboration. The crazy rhythms and expressive melodies of these compositions take the audience to the crossroads of different worlds.Didier dreamed of shaking the hand of a conductor when he took the stage. Adrien dreamed of improvising on traditional themes from elsewhere. Their dreams come true in this atypical duo.'
