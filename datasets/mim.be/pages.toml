["https://mim.be/fr/salles-dexposition"]
title = "Salles d'exposition | MIM"
full_description = "Salles d'exposition Les salles d'exposition ont été aménagées en un parcours attrayant divisé en quelque 90 thèmes répartis sur quatre niveaux d'exposition, chacun apportant un éclairage particulier. La scénographie, axée sur une mise en lumière des instruments et leur sonorité propose un véritable tour du monde musical. Visite virtuelle du MIM Histoire des instruments de musique en EuropeLe parcours Histoire des instruments de musique en Europe offre un aperçu chronologique depuis la musique de l'Antiquité égyptienne jusqu'aux expérimentations et aux reconstitutions historiques du 19e siècle. Réaménagée en 2020, cette salle fait désormais également la part belle aux instruments d'Adolphe Sax. ClaviersPlutôt qu’une exposition chronologique ou organologique, la salle Claviers raconte l’histoire d’amour parfois passionnelle du monde occidental avec le clavier et présente un parcours fascinant dans lequel un clavicorde du 17e siècle se trouve côte à côte avec un iPad. Traditions dans le mondeLe parcours démarre en Belgique, traverse l'ensemble des traditions musicales en Europe et se déploie ensuite à travers le monde. Musicus MechanicusSitué au sous-sol du musée, la salle Musicus Mechanicus regroupe les collections mécaniques, électriques et électroniques. On y trouve aussi les cloches."
