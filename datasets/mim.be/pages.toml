["https://mim.be/en/galleries"]
title = "Galleries | MIM"
full_description = "Galleries The exhibition rooms are enticingly arranged to take you through some ninety thematic displays spread over four levels. The various themes are illustrated by extracts of music representative of the instruments on show. Virtual tour History of musical instruments in EuropeIn this room you'll find thematic, more or less chronological exhibits from Western classical music, ranging from late medieval and renaissance times up to the end of the 19th century. KeyboardsThis room tells the story of keys and keyboards in the Western world. It's a story of invention, codification, exploration and endless possibilities. Traditional instrumentsA favourite for many visitors is the room dedicated to traditional musical instruments. The tour starts in Belgium and passes through a whole series of European traditions to cultures from around the world. Musicus MechanicusA selection of the collection of mechanical, electrical and electronic instruments. On this floor you will also find clocks and bells."
