["https://mim.be/fr/image-studio-0"]
title = "Image Studio | MIM"
description = "Information concernant l'objet?"
full_description = '''Image Studio Image Studio peut vous fournir de belles photos professionnelles en haute résolution des objets de nos collections. Les tarifs varient en fonction de la disponibilité des images. Pour un traitement plus rapide, nous vous demandons d'indiquer le numéro d'inventaire de l'objet du musée ou d'en donner une brève description.De nombreuses images numériques des objets de nos musées peuvent être téléchargées gratuitement à partir du catalogue en ligne Carmentis. Cependant, si vous préférez une photo numérique haute résolution (TIFF moyenne ca 5000x7000 pixels), vous pouvez en faire la demande via le bon de commande ci-dessous. Si cette photo se trouve déjà dans notre base de données, nous vous l'enverrons gratuitement. Si la photo numérique n'est pas disponible, nous pouvons la réaliser pour vous et vous la livrer au prix de 125 €. Vous pouvez également remplir le formulaire de commande ci-dessous.<div class="antibot-no-js antibot-message antibot-message-warning">You must have JavaScript enabled to use this form.</div>Nom et adresse du clientNom de l'institution Personne de contact EmailAddresse Adresse de facturation Nº TVA Informations objetsObjets Numéro d'inventaireInformation concernant l'objet?Numéro d'inventaire Information concernant l'objet?* Usage des photographies commandéesDate limite Livre / ArticleTitre Auteur Editeur Date de publication Multimedia (site web, ...)Description Conditions généralesLors de l’utilisation des images numériques des MRAH, la mention de la source etdunuméro d’inventaire serait appréciée. Ces éléments d’identifications seront fournis par les MRAH avec les images.Si l’artiste vit encore ou s’il est décédé depuis moins de septante ans, l'artiste, ses héritiers, ses représentants légaux ou ayants droit peuvent revendiquer le droit d'auteur sur la reproduction de l'œuvre. Vous pouvez trouver plus d’informations sur les règles régissant le droit d’utilisation notamment sur le site Internet UNISONO. Les MRAH se protègent de toute réclamation de tiers en ce qui concerne les droits d’auteur où d’autres droits basés sur les œuvres dont les reproductions sont livrées au demandeur.Si les MRAH sont titulaires des droits d’auteur d’une œuvre protégée, le demandeur doit obtenir une autorisation d’usage et/ou de publication auprès des MRAH. Ces autorisations seront généralement accordées via une licence CC-BY (https://creativecommons.org/licenses/by/4.0/legalcode.fr). Le demandeur fournira aux MRAH, le cas échéant, un exemplaire gratuit de chaque publication dans laquelle l'image est utilisée : Musées royaux d’Art et d’Histoire, Image Studio, Parc du Cinquantenaire 10, 1000 Bruxelles ou or imagestudio@kmkg-mrah.be (pour les publications numériques).J'accepte les conditions mentionnées ci-dessus.'''
