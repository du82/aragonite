["https://mim.be/fr/faq"]
title = "FAQ | MIM"
full_description = "FAQ Heures d’ouvertureQuelles sont les heures d’ouverture du musée ?Le musée est ouvert du mardi au vendredi de 9:30 à 17:00. Les samedis, dimanches et jours fériés de 10:00 à 17:00. Le musée est fermé les lundis. La vente des tickets ferme à 16:00. Le musée ferme à 17:00, les visiteurs sont priés de quitter les salles à partir de 16:45. Est-ce que le musée est ouvert tous les jours ?Non, le musée est fermé les lundis et le 01.01, 01.05, 01.11, 11.11 & 25.12. Les 24 et 31.12, le musée ferme à 15:00 (dernier ticket à 14:00). Combien de temps dure une visite au musée ?Les visiteurs passent en moyenne 90 minutes au musée. Si vous souhaitez tout voir, prévoyez une demi-journée.Tickets Quels sont les tarifs ? Quelles sont les différentes réductions ?Vous trouverez ici un aperçu de nos tarifs. Est-ce que le musée est gratuit les 1er mercredis après-midi ou 1er dimanches du mois ?Non. Le musée est payant les 1er mercredis après-midi ou 1er dimanches du mois. Puis-je acheter des tickets à l'entrée ?Oui. Il est possible d'acheter des tickets à l’accueil. Toutefois, le nombre de billets disponibles par tranche horaire étant limité, nous vous recommandons de réserver vos tickets en ligne. J’ai acheté mon ticket en ligne mais je n’ai pas reçu de mail de confirmation. Qu’est-ce que je dois faire ?Le e-ticket n'est pas envoyé tant que le paiement ne nous est pas parvenu. Cela peut prendre quelques minutes, mais si cela prend plus de temps, vérifiez d'abord dans vos Courriers indésirables. Après cette vérification, si vous n'avez toujours pas reçu de e-ticket, n'hésitez pas à contacter notre service de réservation : reservations@kmkg-mrah.be ou, le week-end, nos collègues de la caisse, qui seront toujours en mesure de vous aider si vous venez avec une preuve de paiement.AccessibilitéOù est situé le musée?Le musée est situé sur le Mont des Arts à Bruxelles. Son adresse est rue Montagne de la Cour 2, 1000 Bruxelles. Comment y accéder en transports en commun ?En train : la Gare Centrale est située à 200 mètres du musée.En métro : lignes 1 & 5, stations Gare Centrale ou ParcEn bus : lignes 27, 38, 71 & 95, arrêt RoyaleEn tram : lignes 92 & 93, arrêt RoyalePuis-je me garer devant le Musée ?Il est souvent difficile de se déplacer en voiture, et surtout de trouver une place de parking dans le centre de Bruxelles. Pour cette raison, nous vous conseillons vivement d'utiliser un parking de délestage aux alentours de Bruxelles (par exemple, à proximité des stations de métro Erasme, Delta ou Kraainem) et d'ensuite utiliser les transports en commun. Si vous désirez toutefois vous garer au plus près du MIM, nous vous conseillons d'utiliser le parking souterrain Congrès-Albertine (payant). Est-ce que le Musée est accessible pour les personnes en chaise roulante ?Le MIM est entièrement accessible aux personnes à mobilité réduite. Deux emplacements spéciaux pour personnes handicapées sont également situés juste devant le musée.CollectionsQuel type de collections présente le MIM ?Vous trouverez un aperçu des collections présentées dans le Musée ici et dans notre catalogue en ligne Carmentis. Comment puis-je contacter les conservateurs des collections ? Vous trouverez les contacts des conservateurs ici. VestiairesEst-ce que les vestiaires sont gratuits ?Oui. Les vestiaires sont des casiers et ils sont gratuits. Si votre bagage est trop gros pour être mis dans un casier, vous pouvez le déposer au vestiaire, mais à vos propres risques, celui-ci n'étant pas surveillé. Visites de groupesDois-je réserver à l’avance si je viens avec un groupe ?Oui. Les grands groupes (+ de 15 personnes) doivent toujours réserver leur visite à l’avance, même si ce n’est pas pour une visite guidée. Les réservations peuvent se faire via ce formulaire en ligne. Est-il obligatoire de commander des tickets à l’avance ?Les groupes de moins de 15 personnes ne sont pas obligés de réserver. Nous vous recommandons toutefois de réserver vos places car le nombre de tickets disponibles par tranche horaire est limité. Dois-je payer directement lors de la réservation ?Les réservations de groupe doivent être payées à l'avance. Puis-je annuler des tickets ?Non. Les tickets ne peuvent être ni annulés ni échangés. Peut-on recevoir une facture ?Pour les réservations de groupes, vous recevrez une confirmation de réservation par e-mail dans laquelle on vous demandera de faire un virement pour payer le guide et les tickets d’entrée. Seules les organisations gouvernementales peuvent payer par facture et seulement après avoir soumis un bon de commande officiel. Pour les réservations de groupe, vous recevrez un document de réservation qui, accompagné d'une preuve de paiement, devrait suffire pour votre comptabilité. Aucune facture n'est fournie pour les achats de tickets au guichet, aux distributeurs de tickets ou via le site internet. Je voudrais réserver un guide. Combien de temps à l’avance dois-je le faire ?Vous devez réserver une visite guidée ou un atelier au moins trois semaines à l’avance. Vous pouvez demander une réservation via ce formulaire en ligne. Puis-je suivre une visite guidée ?Oui. Nous organisons des visites guidées et des ateliers. Vous trouverez plus d’informations ici. En tant que visiteur individuel, vous pouvez parfois suivre nos visites guides pour individuels. Consultez l’agenda pour être au courant des dates et des thèmes.MuseumshopDois-je payer l’entrée au Musée pour accéder au Museumshop ?Non. L’entrée au Museumshop est libre d’accès. Quelles sont les heures d’ouverture du Museumshop ?Le Museumshop est ouvert pendant les heures d’ouverture du Musée : Mardi-vendredi : 9.30 - 12.00 & 13.00 - 17.00 Samedi-dimanche : 10.00 - 12.00 & 13.00 - 17.00 Fermé le lundi, 01/01, 01/05, 01/11, 11/11, 25/12 Puis-je commander en ligne ?Nous n'avons pas de boutique en ligne mais vous pouvez toujours nous contacter pour recevoir plus d'informations via bookshop@mim.be ou au +32 2 545 01 62. Que puis-je acheter dans le Museumshop ?Le museumshop propose un véritable trésor de livres, CD, cartes postales et gadgets musicaux en tous genres. Vous cherchez un souvenir, vous voulez surprendre quelqu'un ou vous êtes tout simplement un accro du shopping ? Alors le museumshop est l'endroit pour vous. L'équipe de la boutique scrute quotidiennement le marché pour vous proposer les meilleurs articles liés à notre double passion : les instruments de musique et l'Art nouveau. Un coin spécial est réservé aux enfants. Les jeunes y trouveront des livres avec des histoires, des comptes à rebours et des jeux, tous sur le thème de la musique. La boutique propose également les publications des scientifiques du MIM ainsi que du service éducatif. Existe-t-il une carte de fidélité ?Oui. N'hésitez pas à demander votre carte de fidélité lors de votre premier achat.RestaurantPuis-je manger ou boire quelque chose dans le Musée ?Il n'est pas autorisé de manger dans les salles d'exposition. Le musée dispose d'un espace pique-nique où vous pouvez consommer vos propres boissons et collations. Cet espace peut également être réservé pour les groupes (pour une réservation de groupe, vous pouvez nous contacter à l'adresse reservations@kmkg-mrah.be). Le restaurant du musée est actuellement fermé en raison de travaux de rénovation.Image StudioQui contacter pour obtenir des photos ou extraits sonores des instruments du musée ?Pour les photos, veuillez nous contacter via ce formulaire en ligne, pour les extraits sonores, bib1@kmkg-mrah.be. Le MIM ne dispose pas d'archives vidéos mais n'hésitez pas à consulter nos enregistrements vidéos sur YouTube ! Consultez le catalogue en ligne Carmentis pour avoir plus d’information sur les pièces de la collection du MIM.Autres questions Combien d'instruments possède le MIM ?Le MIM possède environ 10.000 instruments, dont 1200 sont exposés en salle et le restant dans les réserves. Le catalogue est disponible online. Où se trouvent les instruments non-placés dans les salles ?Ils sont placés dans les réserves, conservés sous des conditions bien précises, aussi bien au niveau de l'air que de l'éclairage. Est-il possible d'entendre les instruments du MIM ?Ceci se produit malheureusement très rarement. Notre institution scientifique a pour principale mission la bonne conservation du patrimoine. Je possède un instrument. Pouvez-vous m'informer de sa valeur ?Le MIM ne peut pas faire d'évaluation d'instruments. Nous pouvons simplement vous informer si nous serions intéressés par une vente ou un don. Pour se faire, veuillez contacter nos scientifiques via l'adresse info@mim.be Quelle est la procédure pour prêter, offrir ou vendre un instrument au musée ?Vous pouvez prendre contact avec nous via l'adresse info@mim.be.Le conservateur en charge de la collection pourra établir si votre instrument peut aider à élargir les collections du musée déjà très développées. En cas d'intérêt, il introduira un dossier lor d'une réunion de l'équipe scientifique. En cas de don ou de vente, il demandera également un acte officiel.À noter également que le MIM ne peut en aucun cas garantir qu'un instrument, quel qu'il soit, soit exposé dans les salles (la plupart de la collection étant placée dans les réserves). Je possède un instrument, mais je ne sais ni ce que c'est ni comment y jouer. Qui peut m'aider ?Veuillez nous contacter via l'adresse info@mim.be. Merci d'indiquer le maximum d'infos en votre possession et de joindre une photo de l'instrument. Je viens d'inventer un nouvel instrument ! A qui puis-je le présenter ?Vous pouvez nous contacter via l'adresse info@mim.be. Je possède du matériel d'enregistrement ou de reproduction. Le MIM peut-il être intéressé ?Le MIM possède déjà quelques appareils de reproduction. Vous pouvez néanmoins nous contacter via l'adresse info@mim.be.Le conservateur en charge de la collection pourra établir si votre instrument peut aider à élargir les collections du musée déjà très développées. En cas d'intérêt, il introduira un dossier lor d'une réunion de l'équipe scientifique. En cas de don ou de vente, il demandera également un acte officiel.À noter également que le MIM ne peut en aucun cas garantir qu'un instrument, quel qu'il soit, soit exposé dans les salles (la plupart de la collection étant placée dans les réserves). Je possède des vinyls, des cassettes, des rouleaux de pianola. Le MIM peut-il être intéressé ?Pour être honnête, il est peu probable que nous soyons intéressés. Cependant, n'hésitez pas à nous contacter via l'adresse info@mim.be pour nous faire part de vos propositions. Le MIM possède-t-il des dessins techniques d'instruments ?Bien-sûr ! Ils sont en vente au museumshop. Combien de visiteurs visitent le MIM ?Le MIM accueille environ 125.000 visiteurs chaque année, et ce de manière constante depuis 10 ans. Les visites en groupe (principalement des écoles) forment 15% des visiteurs. Qui est le visiteur type du musée ?Le MIM attire principalement des visiteurs de haut niveau d'études, âges de 25 à 65 ans, en couple ou en petit groupe. Durant les nocturnes ou d'autres évènements, nous remarquons une certaine baisse de la moyenne d'âge.72% des visiteurs sont étrangers. Ceci explique pourquoi peu d'entre vous reviennent plusieurs fois au MIM (13%). Les Belges sont principalement bruxellois (48%), les étrangers français (28%), anglais (13%), hollandais (7%), américains, allemands, espagnols ou italiens (6%). Fédéral, provincial ou régional? Quel est le statut du MIM ?Le MIM est une institution scientifique fédérale, 4e département des Musées Royaux d'Art et d'Histoire, au même titre que par exemple le Museum des Sciences Naturelles, le Musée d'Afrique Centrale de Tervuren ou les Musées royaux des Beaux-Arts de Belgique. Le MIM organise-t-il ses propres concerts ?Actuellement, le musée n'organise pas ses propres concerts. Cependant nous travaillons avec une série de partenaires externes. Il y a des concerts payants, mais aussi de nombreuses représentations gratuites. Vous trouverez tous les détails dans l'agenda. Puis-je moi même organiser un concert au MIM?Oui, vous pouvez nous envoyer votre proposition à l'adresse public@kmkg-mrah.be.. Est-ce qu'il est possible de louer les instruments du MIM ?Malheureusement, c'est impossible. Les collections du musées ne sortent jamais du musée en vue d'être jouées. Cependant, il arrive au musée de prêter des instruments, pour des expositions temporaires. Le MIM peut-il m'aider à contacter des musiciens?Non, mais pour vous aider dans vos recherches, nous vous conseillons de parcourir les sites Internet du Conseil de la musique et du Centre Belge d'Action Interculturelle (musique du monde). Ceux-ci disposent de bases de données relativement complètes. Est-ce que le MIM peut m'aider à contacter des facteurs d'instuments ?Non car nous n'en avons légalement pas le droit, mais vous pouvez vous renseigner dans les écoles d'instruments à Boom (instruments à cordes), Bruge (guitare), Gand, Marche-en-Famenne (instruments à cordes), Puurs-Sint-Amands (instruments à cordes, claviers) et Wavre (guitare)."
