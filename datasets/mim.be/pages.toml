title = "Podcasts | MIM"
full_description = "Podcasts Le MIM vous propose une série de podcasts sur sa page Spotify dans lequel un invité soigneusement sélectionné parle avec enthousiasme de son (ses) instrument(s) préféré(s). Une façon supplémentaire de découvrir les collections du musée et d'avoir encore plus envie de le visiter ! Claire Chevallier : le pianofortePour marquer le 175e anniversaire de la mort de Chopin, le MIM met à l'honneur le pianoforte. Claire Chevallier, professeur au Conservatoire royal de Bruxelles, nous parle avec passion de ce plus proche parent du piano moderne.Podcast en français Écouter sur Spotify © Thomas Vanhaute Rutger Mathys : l'harmonicaEn 2022, lors de l'année Toots, nous découvrions le joueur d'harmonica Rutger Mathys. Entretemps il est diplômé du Conservatoire de Rotterdam et à travers ce podcast, il est heureux de partager ses connaissances avec vous. N'hésitez pas à aller le voir àl'œuvre cet été, en festival ou dans un club de jazz, en Belgique, mais aussi à l'étranger !Podcast en néerlandais Écouter sur Spotify © VRT Olivier Latry : l'orgueOlivier Latry est titulaire des grandes orgues de Notre-Dame de Paris et professeur au conservatoire National supérieur de la capitale française. Nous avons aujourd’hui le plaisir de sa visite au MIM. Avec lui, nous parcourrons la collection d’instruments, mais aussi les archives et iconographies conservées à la bibliothèque en lien avec l'orgue. Un moment de plaisir pour redécouvrir cette véritable folie instrumentale qu’est l’orgue. Folie de technologie et d’immensité, à la fois surpuissante et délicate, toute de bois, de métal et de vent…Podcast en français Écouter sur Spotify © Henri Buffeteau Amy Norrington : le violoncelleAprès 12 éditions, le festival Resonances est devenu un festival de musique de chambre de renommée internationale. Amy Norrington, directrice artistique du festival et violoncelliste hors pair s'est rendue au MIM au début du printemps 2023 pour parler de son instrument et du répertoire musical qui l'inspire, de Bach aux compositeurs contemporains.Podcast en néerlandais, traduction écrite en français. Écouter sur Spotify Lucile Boulanger : la viole de gambeEtoile montante de la viole en France, Lucile Boulanger nous a fait le plaisir d’une visite au MIM, où, pour quelques instants, nous nous sommes arrêtés devant de très beaux et anciens instruments…Issue d’une famille d’artistes, Lucile a mené de front l’apprentissage de l’art dramatique et de la musique pendant son enfance, oscillant entre l’archet et la télévision. Mais c’est à la musique qu’elle a finalement décidé de consacrer sa vie, et particulièrement à la viole de gambe, cette lointaine cousine du violoncelle.Podcast en français Écouter sur Spotify © Alix Laveau Floris de Rycker : le luthLe luthiste et guitariste Floris de Rycker est passé au MIM pour s'inspirer des instruments à cordes pincées exposés au 1er étage récemment rénové. Avec son ensemble Ratas del Viejo Mundo, il se produit régulièrement sur les scènes de musique ancienne en Belgique et à l'étranger. Dans ce podcast, il nous explique sa façon d’aborder la musique du Moyen Âge, de la Renaissance et du début du Baroque.Podcast en néerlandais Écouter sur Spotify Olivier Poumay : l'harmonicaA l'occasion de l'exposition Toots 100. The Sound of a Belgian legend, en collaboration avec la KBR, l'harmonica est mis à l'honneur dans ce nouveau podcast. Olivier Poumay, harmoniciste, jazzman, nomade de la musique en quête perpétuelle de sons nouveaux, nous parle de son instrument et des chemins qu'il parcourt en sa compagnie. Une promenade dans le monde immense d'un très petit instrument !Podcast en français Écouter sur Spotify © Hervé Blieck Christophe Morisset : le serpentEn cette période de Noël, le MIM met à l'honneur un instrument qui fut longtemps joué à l'église: le serpent. Christophe Morisset, serpentiste, vous parle avec passion de l'histoire, l'usage, la disparition et la résurrection de cet étrange mais fascinant instrument.Podcast en français Écouter sur Spotify Nabou Claerhout : le tromboneLe timbre sombre et chaud du trombone annonce l'arrivée de l'automne au mim. Pour mieux connaître cet instrument plutôt discret, nous avons invité la jeune tromboniste Nabou Claerhout. Cet été, une tournée intensive l'a menée avec son quartet tant en Belgique qu'à l'étranger. Très bientôt elle présentera son premier album. Que les auditeurs tombent amoureux du trombone: voilà sa mission. Le MIM conserve des trombones illustrant l'histoire de l'instrument depuis le Moyen Âge jusqu'au 19e siècle, époque à laquelle il prend sa forme actuelle. Il n'apparaît pas souvent comme soliste dans la...Le timbre sombre et chaud du trombone annonce l'arrivée de l'automne au mim. Pour mieux connaître cet instrument plutôt discret, nous avons invité la jeune tromboniste Nabou Claerhout. Cet été, une tournée intensive l'a menée avec son quartet tant en Belgique qu'à l'étranger. Très bientôt elle présentera son premier album. Que les auditeurs tombent amoureux du trombone: voilà sa mission.Le MIM conserve des trombones illustrant l'histoire de l'instrument depuis le Moyen Âge jusqu'au 19e siècle, époque à laquelle il prend sa forme actuelle. Il n'apparaît pas souvent comme soliste dans la musique classique, mais en jazz, genre dans lequel Nabou se sent le plus chez elle, il joue par contre un rôle majeur. Sans doute est-il un des cuivres présentant les facettes les plus variées, avec une gamme extrêmement large et une infinie palette de couleurs sonores. Podcast en néerlandais, traduction écrite en français.Lire plus Écouter sur Spotify Jefferson Louvat : la mandolineUne nouvelle saison - et un nouveau podcast ! Nous accueillons l'été avec le timbre ensoleillé de la mandoline. Jefferson Louvat nous entraîne à la découverte de cet instrument fascinant. Notre périple commence avec le bluegrass, se poursuit avec Vivaldi et Bach pour s'achever avec Prince et le dernier album de Szabadság. En chemin, nous danserons une tarentelle et ferons même escale à Cuba...Podcast en français Écouter sur Spotify Gwen Cresens : Happy Birthday Piazolla!Le 11 mars 2021 c'était le 100e anniversaire d'Astor Piazzolla ! Pour célébrer l'occasion nous avons invité Gwen Cresens, grand connaisseur du répertoire du célèbre compositeur et bandonéoniste argentin. Il nous a raconté des histoires passionnantes à propos du bandonéon et de la musique d'Astor Piazzolla.Podcast en néerlandais, traduction écrite en français. Écouter sur Spotify Jan Caeyers : promenade avec BeethovenLa collection du MIM compte un grand nombre d'instruments du temps de Beethoven. À l'occasion des 250 ans du compositeur, en 2020, nous avons créé une promenade auditive autour de 20 instruments pour lesquels Beethoven composa de la musique. Le chef d'orchestre Jan Caeyers, spécialiste et biographe de Beethoven nous accompagne et nous éclaire sur cette sélection. Dans ce podcast, vous entendrez donc ce qu'il raconte autour de la musique et des instruments choisis, mais aussi quelques détails croustillants sur la vie du grand compositeur. Podcast en néerlandais, traduction écrite en...La collection du MIM compte un grand nombre d'instruments du temps de Beethoven.À l'occasion des 250 ans du compositeur, en 2020, nous avons créé une promenade auditive autour de 20 instruments pour lesquels Beethoven composa de la musique. Le chef d'orchestre Jan Caeyers, spécialiste et biographe de Beethoven nous accompagne et nous éclaire sur cette sélection.Dans ce podcast, vous entendrez donc ce qu'il raconte autour de la musique et des instruments choisis, mais aussi quelques détails croustillants sur la vie du grand compositeur.Podcast en néerlandais, traduction écrite en françaisLire plus Écouter sur Spotify"
