["https://mim.be/fr/publications-0"]
title = "Publications | MIM"
full_description = "Rapport annuel 2019 La vie des Musées royaux d'Art et d'Histoire Rapport annuel 2019.pdf (21.33 Mo) 08.02.2019 Rapport annuel 2018 La vie des Musées royaux d'Art et d'Histoire 2018 Rapport annuel.pdf (4.19 Mo) 07.02.2019 Rapport annuel 2016-2017 La vie aux Musées royaux d'Art et d'Histoire 2016-2017 Rapport annuel.pdf (3.08 Mo) 21.01.2019 Tradition vivante! L'histoire des instruments populaires estoniens, Risto Lehiste, Tallin, 2017, 64 p. Le catalogue présente le passé et le présent des principaux instruments populaires estoniens. Les irréductibles Estoniens habitent ce pays depuis plus de 10.000 ans. L'histoire de leurs instruments traditionnels a été influencée par leur environnement, mais aussi par la culture de leurs voisins: Suédois, Lettons, Finnois, Russes, Allemands et bien d'autres. Il en découle une histoire des instruments populaires unique et une tradition toujours bien vivante! Disponible au museumshop (édition quadrilingue français-anglais-néerlandais-estonien) - 10 € 16.03.2017 The Golden Age of Flemish Harpsichord Making: a Study of the MIM's Ruckers Instruments, Pascale Vandervellen, Bruxelles, 2017, 420 p. Résumé en anglais : Among the great names in the history of harpsichord making, that of the Ruckers is probably the most famous. This dynasty of makers, represented by four generations active in Antwerp between c.1580 and c.1680, exerted a predominant influence in Western Europe. Their harpsichords and virginals, synonyms of extraordinary workmanship, acquired a tremendous reputation that extended beyond European borders and lasted until well after their active period. The envy they inspired was such that it gave rise to large-scale counterfeiting, probably the most significant in the field of instrument making up to then. The MIM owns eighteen instruments considered at the time of their acquisition to be made in the Ruckers workshop. Given the considerable patrimonial interest of this collection, a project centred on its conservation, study, restoration and enhancement was set up. The book sums up this fascinating research and sheds new light on this outstanding heritage. This survey is directed by Pascale Vandervellen, curator of the stringed keyboard instruments of the MIM. Ce livre a remporté le prix Nicholas Bessaraboff 2019, délivré par l'American Musical Instrument Society! Disponible en anglais - 59 € au museumshop 01.01.2017"
