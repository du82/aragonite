["https://mim.be/fr/bibliotheque"]
title = "Bibliothèque | MIM"
full_description = "Bibliothèque Infos pratiquesLa bibliothèque est accessible sans ticket d'entrée, mais uniquement après avoir pris rendez-vous. Consultation sur place uniquement.Du mardi au vendredi de 9h30 à 12h30 et de 14h à 16h30.Tél : +32 2 545 01 70 / +32 2 545 01 34 Email : bib1@kmkg-mrah.beLa bibliothèque du MIM a été fondée en même temps que le musée en 1877. Elle est spécialisée dans les domaines de l'organologie (étude des instruments de musique), de l'ethnomusicologie (études des musiques traditionnelles) et de l'histoire de la musique occidentale.La bibliothèque conserve différents fonds spéciaux dont le Fonds Robert Pernet consacré au jazz en Belgique et le Fonds Christian Poché consacré aux musiques du monde. Elle abrite également les collections iconographiques et audiovisuelles du musée, ainsi que les archives du MIM et celles de certains facteurs d’instruments (orgue, cloches, carillons…).Nous vous invitons également à découvrir la BCM (Brabants Centrum voor Muziektradities) et son catalogue, bibliothèque d’un ancien collaborateur MIM, Hubert Boone, sur les traditions musicales belges & européennes. Catalogue online"
