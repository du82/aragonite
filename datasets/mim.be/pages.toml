["https://mim.be/fr/la-musique-traditionnelle-en-belgique"]
title = "La musique traditionnelle en Belgique | MIM"
full_description = "La musique traditionnelle en Belgique Depuis 2018, le MIM réalise, dans un souci de conservation et d'archivage, une série documentaire sur la musique traditionnelle en Belgique. Les vidéos, toutes sous-titrées en anglais, sont publiées sur la chaîne YouTube du musée. La Société Royale Moncrabeau et les 40 MolonsDepuis 1843, les quarante Molons pratiquent les quêtes de charité dans leur bonne ville de Namur. Mais ils l’animent aussi par leurs ‘menteries’, leurs chants et leurs mirlitons. Car les Molons sont mirlitophiles, une caractéristique étrange et plutôt rare en Belgique. Découvrez et laissez-vous surprendre par cette société tout à la fois généreuse et burlesque ! La cérémonie du Last PostDe 1914 à 1918, la région d’Ypres connut de violents combats au cours desquels périrent des centaines de milliers de soldats des différents camps. Pour ne pas oublier ces sacrifices, les habitants ont développé depuis 1928 une tradition originale et unique : la sonnerie quotidienne et immuable du Last Post. Le sonneur de clochesMarc Nicolas est un des derniers sonneurs de cloches en Belgique. Depuis 2002, il fait résonner l’Angélus chaque jour sur les prairies et les toits d’ardoise de son village ardennais. Cette vidéo vous invite à entrer dans son univers, celui du clocher en bois abritant deux grosses cloches, compagnes fidèles des villageois de Bellevaux. Le TrawantelLe Trawantel est connu pour être l'une des plus anciennes danses avec bâton d'Europe occidentale. Elle est encore pratiquée dans la région de la Campine anversoise, entre autres à la guilde de Saint-Sébastien à Westerlo et à Tongerlo. L'équipe du RIETMA est allée à la rencontre de cette danse. Le projet RIETMA (financé par BELSPO) réunit des travailleurs culturels africains et européens autour de la question de la représentation de la culture par la musique. Dans ce cadre, les partenaires du projet se sont intéressés à la danse Trawantel pratiquée à Westerlo (Belgique). Les sons du Carnaval de BincheLe MIM vous emmène dans la région du Centre (Hainaut, Wallonie) qui connait de nombreux carnavals traditionnels avec Gilles et tambours. Celui de Binche est sans doute le plus connu et sert ici d'exemple pour tous les sons et musiques carnavalesques de la région. Bal de la Sainte-Catherine du Royal Club 1900 d'Haine St PierreLe bal de la Sainte-Catherine à Haine-Saint-Pierre (Hainaut) est le dernier bal populaire organisé sans interruption depuis la seconde guerre mondiale. Créé à l'époque à la suite d'un rejet des nouvelles danses venues d'Amérique (rock & roll, ...), il représente un lien vivant avec les bals populaires du 19e siècle. Le knaptandKnaptand : un étrange d’animal – croquemitaine ou poisson à fourrure ? Depuis au moins le 17ème siècle, il se promène une fois l’an dans les rue de Termonde, animant la ville du bruit de ses terribles mâchoires ! Un son d’effroi qui en fait bel et bien un curieux objet musical. Les crécellesDans la liturgie catholique, la crécelle servait autrefois d’alternative aux cloches pendant les trois jours précédant Pâques. Le silence des cloches, signe de deuil, rappelait la Passion et la mort du Christ. Le son grinçant des crécelles sonnant les offices renforçait encore l’angoisse et la tristesse de ces trois jours saints. La tradition est encore maintenue pour l’Angélus dans le petit village ardennais de Rossart. La présente émission n’a pas pour objet d’évoquer tout le sens et la richesse de la tradition des crécelles en général. Elle fait simplement état de la manière dont cette pratique y a encore cours. Les crâmignonsLe « crâmignon », danse traditionnelle en chaîne, était autrefois pratiqué dans toute la région de Liège. Il ne l’est plus aujourd’hui que dans les villages de la Basse-Meuse, entre Liège et la frontière hollandaise, mais aussi dans quelques entités du Limbourg néerlandais. Tout un après-midi durant, deux sociétés rivales du village, Bleus et Rouges, paradent dans les rues, les hommes en smoking, les femmes vêtues de robes somptueuses, généralement confectionnées par elles-mêmes ou leur entourage. À Hermalle-sous-Argenteau, près de Visé, la fête dure cinq jours. Elle se termine par le crâmignon de la Jeunesse (le lundi, pour les personnes non mariées), et le gigantesque crâmignon ouvert à tous (le mardi). Ce dernier est sans conteste le plus impressionnant pour l’observateur extérieur. Tout le reportage a été tourné le mardi. Nous nous sommes plus particulièrement focalisés sur l’aspect musical de l’événement et les fanfares. Le Hanske Knap« Hans knap knap knap, une petite pièce pour couper le barbe de Hans ! Elle n’a pas été coupée depuis cent ans. Voyez comme elle est longue ! Oh Hans, Oh Hans ! Une petite pièce dans le Hans ! » Ainsi résonne le chant des knappers, qui vont de porte en porte souhaiter des bons vœux aux habitants le jour du « Lundi perdu », le lundi suivant la fête des Rois. Cette tradition était autrefois très présente dans le Polder anversois, mais ne se voit plus que dans les seuls villages de Berendrecht et de Zandvliet. Mais pour combien de temps encore ? Concours d’imitation du brame du cerfCe film présente une manifestation sonore pour le moins curieuse liée à nos massifs forestiers : un concours de brame du cerf. Issues d’anciennes traditions de chasse, ces compétitions d’imitation de brame du cerf sont assez répandues en Allemagne et en Europe de l’Est. Elles existent en France depuis 2013, et en Belgique depuis 2014, où elles ont lieu chaque année au Fourneau-Saint-Michel, près de Saint-Hubert. Rencontres passionnées entre amateurs de la nature, elles constituent aussi un phénomène musical à part entière. Les imitations reposent sur une finesse d’écoute et de restitution très développées. Comme le montre le film, il existe une grande variété dans la qualité et la capacité expressive des « brameurs »."
