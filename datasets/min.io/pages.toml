["https://min.io/solutions/vmware"]
title = "VMware Object Storage Solutions & Integration | MinIO"
full_description = "Integrated with VMware Cloud Foundations Data Services Manager (DSM), VMware vSAN Data Persistence platform (DPp), TGK and TAS MinIO’s object storage integration with both DSM and DPp is feature and API compatible with AWS and brings S3 to both GCS and Azure. This enables enterprises to deliver against their hybrid-cloud goals and ensure operational consistency across clouds. Through these integrations, enterprises can confidently migrate high-performance, secure, sustained workloads back to the private cloud, resulting in superior cost and security. Through the DSM and DPp integrations customers can seamlessly scale from single petabytes to hundreds of exascale. The integrated products enable big data applications like Spark and Presto, analytic engines like Splunk and Snowflake and AI/ML data pipelines with TensorFlow to work against massive amounts of data. MinIO completes VMware’s software defined datacenter strategy by extending that vision to storage. Portable across a variety of CPU architectures and Server platforms, MinIO for Tanzu is ready made to automate the datacenter, compressing IT deployment cycles from months to hours. MinIO delivers high-performance, exascale object storage to VMware Cloud Foundation’s Data Services Manager (DSM). DSM is a native extension of VMware vSphere that empowers IT admins to provision and manage on-premises MinIO instances to their line of business application teams. Natively integrated, DSM removes key dependencies in favor of greater administrator flexibility. MinIO provides high-performance, AWS S3 compatible object storage, enabling IT to seamlessly provision multi-tenant object storage directly from the vCenter console while providing API-level control to DevOps and application architects. This integration brings MinIO into the heart of vSphere and therefore into the heart of IT. MinIO supports vSAN, vSAN-SNA and vSAN-Direct through this integration. MinIO Internal Blobstore for Pivotal Platform is a distributed S3 compatible blobstore for VMware Tanzu Application Service for VMs (TAS for VMs). Operators can use MinIO as a blobstore for TAS for VMs instead of the internal WebDAV/NFS, which is a single point of failure. Used for storing buildpacks, droplets, packages, and resource_pool, the internal tile enables modern, sophisticated storage as a core component within Tanzu. Through this tile, MinIO provides Multi-Cloud Object Storage for VMware Tanzu enabling portability for applications through an Amazon S3 compatible API - abstracting the underlying cloud infrastructure."
