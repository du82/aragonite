["https://min.io/training/administration-training"]
title = "MinIO | Enterprise Administration Course"
full_description = "Grow your career and advance your team with classroom oriented training or self-paced learning options. MinIO Enterprise Administration I: Management, Replication and Security Essentials (MN116). Everything you need to know to ensure production success with your MinIO deployment as an administrator of scalable, performant data infrastructure. Learn to leverage MinIO object storage to build and deploy high performance applications across Kubernetes, public and private clouds and to the edge. System operators, administrators, and infrastructure architects will learn the core skills to deploy, manage, secure, and scale MinIO object storage. By the end of the course developers will be ready to build apps with MinIO object storage using the S3 API. Administrators will be able to set up a multi-site, multi-drive MinIO Proof of Concept leading to production deployment. Students will engage in hands-on labs throughout the course. Depending on the content being covered and customer requirements, the initial labs will be completed locally on the student system or through MinIO’s online play.min.io interface. Students completing this course will possess the skills to deploy MinIO object storage resources to improve system performance, scalability and portability across deployment architectures. Students can use their knowledge to create or transition existing workloads to MinIO object storage, such as analytics, data lake / data warehouse, and ETL pipelines. Students will be able to deploy MinIO and connect applications to MinIO object storage via the S3 API. They will also have core administration skills to secure, monitor, and scale out the MinIO infrastructure to enable fault tolerance and optimize performance. Students will use MinIO SUBNET for posting questions, comments, or follow-ups during and after the training. MinIO engineers can engage directly with students to provide additional information or resolution to ongoing queries. SUBNET is a key part of customer success both during and after training."
