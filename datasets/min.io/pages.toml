["https://min.io/product/automated-data-tiering-lifecycle-management"]
title = "MinIO | Data Lifecycle Management and Tiering"
description = "MinIO allows you to use resources efficiently by defining and automating your data’s life cycle through multiple tiers and across multiple hybrid cloud types."
full_description = "The requirement to co-optimize for access, security and economics is the modern role of lifecycle data management. MinIO offers a unique suite of features to protect data including versioning, object locking and the various derivative components. Data doesn't have to live forever: MinIO lifecycle management tools let you define how long data stays on disk before being removed. The length of time is user-defined as a specific date or a number of days after which MinIO begins removing objects. Lifecycle management rules are per-bucket, and can be built using any combination of object and tag filters. Specify no filter to set the expiry rule for the entire bucket, or specify multiple rules to craft more complex expiry behavior. MinIO object expiry rules also work with versioned buckets, with some versioning-specific flavor on the side. For example, you can specify an expiry rule on only the non-current versions of objects to maximize the benefits of object versioning without incurring long-term storage costs. Similarly, you can create a lifecycle management rule for deleting objects whose only remaining version is a delete marker. Bucket expiration rules are fully compliant with MinIO WORM locking and legal holds - objects held under lock remain on disk until the lock expires or is explicitly lifted. Once an object is no longer subject to locking, MinIO begins applying the expiry rules as normal. MinIO object expiration lifecycle management rules are feature-and-syntax-compatible with AWS Lifecycle Management. MinIO also supports importing an existing rule in JSON format, making it simple to migrate existing AWS expiry rules. MinIO can programmatically configure object storage tiering so that objects transition from one state or class to another based on any number of variables - although the most commonly used are time and frequency of access. This functionality is best understood in the context of tiering. Tiering allows the user to optimize storage cost or functionality to address changing data access patterns. Tiered data storage is generally used in the following scenarios:"
