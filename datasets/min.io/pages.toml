["https://min.io/logo"]
title = "MinIO | Understand the guidelines for using MinIO's marks"
description = "Understand how to use the logo and wordmark behind the leader in high-performance object storage."
full_description = '''MinIO logo and wordmark are representations of MinIO. We have a few guidelines for correctly using our brand resources. The "MIN" prefix is our brand's identifier, so these dominant letters are visually bold. The "IO" suffix is subordinate and a lighter weight. This same typographic treatment is used for all products and services, where "MIN" remains a heavy weight and the lighter suffix changes with the product name. Our signature brand color is a bold Fresh Raspberry. Our secondary colors are mix of strong, dramatic darks and fresh pleasing brights. MinIO is a high performance, distributed object storage system. It is software-defined, runs on industry standard hardware and is 100% open source under the AGPL v3.0 License. This document outlines the policy of the MinIO Project regarding the use of its trademarks. Any use of any MinIO trademark must be in accordance with this policy. For the purpose of this policy "Trademarks" means MinIO's word marks, service marks, logos, trade dress, names of products, services, business and the name of the corporation. The MinIO trademarks include, among others, the names MINIO, the MinIO Stork, MinIO AIStor, MinIO SUBNET, MinIO KES, MinIO Warp, MinIO DMT and MinIO Sidekick. As a firm believer in Free Software ethos and a respected member of the community, we have a desire for widespread usage and improvement of our code by users, distributors and other community members, of our products distributed under Open Source Licenses. Although our code is Open Source, MinIO wishes to ensure that its trademarks remain reliable indicators of quality and source that our users have come to expect of us. It is also very important that we strictly enforce our trademark rights in order to be able to protect our users against people who use the marks to commit fraud. This means that, while you have considerable freedom to redistribute and modify our software, you must follow trademark law and this policy even for Open Source software. Balancing these two competing interests is not an easy task. We rely on our users, clients and community to help us achieve this balance.'''
