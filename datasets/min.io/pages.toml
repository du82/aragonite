title = "Tenant Helm Charts — MinIO Object Storage for Kubernetes"
full_description = 'Close Doc Navigation MinIO Object Storage for Kubernetes Deploy the MinIO Operator Upgrade MinIO Operator Deploy and Manage MinIO Tenants Core Operational Concepts Monitoring and Alerts External Identity Management Data Encryption (SSE) Network Encryption (TLS) cert-manager Deployment Checklists Recover after Hardware Failure Troubleshooting MinIO Console Object Management Monitoring Bucket and Object Events Identity and Access Management Server-Side Encryption of Objects Bucket Replication Batch Framework Core Administration Concepts Software Development Kits (SDK) Security Token Service (STS) for MinIO Operator Object Lambda File Transfer Protocol (FTP/SFTP) MinIO Client MinIO Admin Client S3 API Compatibility Integrations MinIO Custom Resource Definition Operator Helm Charts Tenant Helm Charts MinIO Operator Environment Variables Glossary TOC Menu Search Tenant Helm Charts Table of Contents MinIO Tenant Chart MinIO publishes Helm Charts for the Helm Operator Charts and Helm Tenant Charts. You can use these charts to deploy the MinIO Operator and managed Tenants through Helm. The following page documents the values.yaml chart for a MinIO Tenant. For documentation on the chart for a MinIO Operator, see Operator Helm Charts MinIO Tenant Chart Reference tenant nameThe Tenant name Change this to match your preferred MinIO Tenant name. imageSpecify the Operator container image to use for the deployment. image.tag For example, the following sets the image to the quay.io/minio/operator repo and the v7.0.0 tag. The container pulls the image if not already present: image: repository: quay.io/minio/minio tag: RELEASE.2024-11-07T00-52-20Z pullPolicy: IfNotPresent The chart also supports specifying an image based on digest value: image: repository: quay.io/minio/minio@sha256 digest: 28c80b379c75242c6fe793dfbf212f43c602140a0de5ebe3d9c2a3a7b9f9f983 pullPolicy: IfNotPresent imagePullSecretAn array of Kubernetes secrets to use for pulling images from a private image.repository. Only one array element is supported at this time. initContainersSpecify initContainers to perform setup or configuration tasks before the main Tenant pods starts. Example of init container which waits for idenity provider to be reachable before starting MinIO Tenant: initContainers: - name: wait-for-idp image: busybox command: - sh - -c - | URL="https://idp-url" echo "Checking IdP reachability (${URL})" until $(wget -q -O "/dev/null" ${URL}) ; do echo "IdP (${URL}) not reachable. Waiting to be reachable..." sleep 5 done echo "IdP (${URL}) reachable. Starting MinIO..." schedulerThe Kubernetes Scheduler to use for dispatching Tenant pods. Specify an empty dictionary {} to dispatch pods with the default scheduler. configurationThe Kubernetes secret name that contains MinIO environment variable configurations. The secret is expected to have a key named config.env containing environment variables exports. configSecretRoot key for dynamically creating a secret for use with configuring root MinIO User Specify the name and then a list of environment variables. Important Do not use this in production environments. This field is intended for use with rapid development or testing only. For example: name: myminio-env-configuration accessKey: minio secretKey: minio123 poolsMetadata Metadata that will be added to the statefulset and pods of all pools annotationsSpecify annotations to associate to Tenant pods. labelsSpecify labels to associate to Tenant pods. pools Top level key for configuring MinIO Pool(s) in this Tenant. See Operator CRD: Pools for more information on all subfields. serversThe number of MinIO Tenant Pods / Servers in this pool. For standalone mode, supply 1. For distributed mode, supply 4 or more. Note that the operator does not support upgrading from standalone to distributed mode. nameCustom name for the pool volumesPerServerThe number of volumes attached per MinIO Tenant Pod / Server. sizeThe capacity per volume requested per MinIO Tenant Pod. storageAnnotationsSpecify storageAnnotations to associate to PVCs. storageLabelsSpecify storageLabels to associate to PVCs. annotationsSpecify annotations to associate to Tenant pods. labelsSpecify labels to associate to Tenant pods. tolerationsAn array of Toleration labels to associate to Tenant pods. These settings determine the distribution of pods across worker nodes. nodeSelectorAny Node Selectors to apply to Tenant pods. The Kubernetes scheduler uses these selectors to determine which worker nodes onto which it can deploy Tenant pods. If no worker nodes match the specified selectors, the Tenant deployment will fail. affinityThe affinity or anti-affinity settings to apply to Tenant pods. These settings determine the distribution of pods across worker nodes and can help prevent or allow colocating pods onto the same worker nodes. resourcesThe Requests or Limits for resources to associate to Tenant pods. These settings can control the minimum and maximum resources requested for each pod. If no worker nodes can meet the specified requests, the Operator may fail to deploy. securityContextThe Kubernetes SecurityContext to use for deploying Tenant resources. You may need to modify these values to meet your cluster’s security and access settings. We recommend disabling recursive permission changes by setting fsGroupChangePolicy to OnRootMismatch as those operations can be expensive for certain workloads (e.g. large volumes with many small files). containerSecurityContextThe Kubernetes SecurityContext to use for deploying Tenant containers. You may need to modify these values to meet your cluster’s security and access settings. topologySpreadConstraintsAn array of Topology Spread Constraints to associate to Operator Console pods. These settings determine the distribution of pods across worker nodes. mountPathThe mount path where Persistent Volumes are mounted inside Tenant container(s). subPathThe Sub path inside Mount path where MinIO stores data. Warning Treat the mountPath and subPath values as immutable once you deploy the Tenant. If you change these values post-deployment, then you may have different paths for new and pre-existing data. This can vastly increase operational complexity and may result in unpredictable data states. metricsConfigures a Prometheus-compatible scraping endpoint at the specified port. certificate Configures external certificate settings for the Tenant. externalCaCertSecretSpecify an array of Kubernetes TLS secrets, where each entry corresponds to a secret the TLS private key and public certificate pair. This is used by MinIO to verify TLS connections from clients using those CAs If you omit this and have clients using TLS certificates minted by an external CA, those connections may fail with warnings around certificate verification. See Operator CRD: TenantSpec. externalCertSecretSpecify an array of Kubernetes secrets, where each entry corresponds to a secret contains the TLS private key and public certificate pair. Omit this to use only the MinIO Operator autogenerated certificates. If you omit this field and set requestAutoCert to false, the Tenant starts without TLS. See Operator CRD: TenantSpec. Important The MinIO Operator may output TLS connectivity errors if it cannot trust the Certificate Authority (CA) which minted the custom certificates. You can pass the CA to the Operator to allow it to trust that cert. See Self-Signed, Internal, and Private Certificates for more information. This step may also be necessary for globally trusted CAs where you must provide intermediate certificates to the Operator to help build the full chain of trust. requestAutoCertEnable automatic Kubernetes based certificate generation and signing certConfigThis field is used only when requestAutoCert: true. Use this field to set CommonName for the auto-generated certificate. MinIO defaults to using the internal Kubernetes DNS name for the pod The default DNS name format is typically *.minio.default.svc.cluster.local. See Operator CRD: CertificateConfig featuresMinIO features to enable or disable in the MinIO Tenant See Operator CRD: Features. bucketsArray of objects describing one or more buckets to create during tenant provisioning. Example: - name: my-minio-bucket objectLock: false # optional region: us-east-1 # optional usersArray of Kubernetes secrets from which the Operator generates MinIO users during tenant provisioning. Each secret should specify the CONSOLE_ACCESS_KEY and CONSOLE_SECRET_KEY as the access key and secret key for that user. podManagementPolicyThe PodManagement policy for MinIO Tenant Pods. Can be “OrderedReady” or “Parallel” readinessReadiness Probe for monitoring Tenant container readiness. Tenant pods will be removed from service endpoints if the probe fails. startupStartup Probe for monitoring container startup. Tenant pods will be restarted if the probe fails. Refer lifecycleThe Lifecycle hooks for container. exposeServicesDirects the Operator to deploy the MinIO S3 API and Console services as LoadBalancer objects. If the Kubernetes cluster has a configured LoadBalancer, it can attempt to route traffic to those services automatically. Specify minio: true to expose the MinIO S3 API. Specify console: true to expose the Console. Both fields default to false. serviceAccountNameThe Kubernetes Service Account associated with the Tenant. prometheusOperatorDirects the Operator to add the Tenant’s metric scrape configuration to an existing Kubernetes Prometheus deployment managed by the Prometheus Operator. loggingConfigure pod logging configuration for the MinIO Tenant. Specify json for JSON-formatted logs. Specify anonymous for anonymized logs. Specify quiet to supress logging. An example of JSON-formatted logs is as follows: $ k logs myminio-pool-0-0 -n default {"level":"INFO","errKind":"","time":"2022-04-07T21:49:33.740058549Z","message":"All MinIO sub-systems initialized successfully"} serviceMetadataserviceMetadata allows passing additional labels and annotations to MinIO and Console specific services created by the operator. envAdd environment variables to be set in MinIO container (https://github.com/minio/minio/tree/master/docs/config) priorityClassNamePriorityClassName indicates the Pod priority and hence importance of a Pod relative to other Pods. This is applied to MinIO pods only. Refer Kubernetes documentation for details https://kubernetes.io/docs/concepts/configuration/pod-priority-preemption/#priorityclass/ additionalVolumesAn array of Volumes which the Operator can mount to Tenant pods. The volumes must exist and be accessible to the Tenant pods. additionalVolumeMountsAn array of volume mount points associated to each Tenant container. Specify each item in the array as follows: volumeMounts: - name: volumename mountPath: /path/to/mount The name field must correspond to an entry in the additionalVolumes array. ingressConfigures Ingress for the Tenant S3 API and Console. Set the keys to conform to the Ingress controller and configuration of your choice. YAML # Root key for MinIO Tenant Chart tenant: ### # The Tenant name # # Change this to match your preferred MinIO Tenant name. name: myminio ### # Specify the Operator container image to use for the deployment. # ``image.tag`` # For example, the following sets the image to the ``quay.io/minio/operator`` repo and the v7.0.0 tag. # The container pulls the image if not already present: # # .. code-block:: yaml # # image: # repository: quay.io/minio/minio # tag: RELEASE.2024-11-07T00-52-20Z # pullPolicy: IfNotPresent # # The chart also supports specifying an image based on digest value: # # .. code-block:: yaml # # image: # repository: quay.io/minio/minio@sha256 # digest: 28c80b379c75242c6fe793dfbf212f43c602140a0de5ebe3d9c2a3a7b9f9f983 # pullPolicy: IfNotPresent # # image: repository: quay.io/minio/minio tag: RELEASE.2024-11-07T00-52-20Z pullPolicy: IfNotPresent ### # # An array of Kubernetes secrets to use for pulling images from a private ``image.repository``. # Only one array element is supported at this time. imagePullSecret: { } ### # # Specify `initContainers <https://kubernetes.io/docs/concepts/workloads/pods/init-containers/>`__ to perform setup or configuration tasks before the main Tenant pods starts. # # Example of init container which waits for idenity provider to be reachable before starting MinIO Tenant: # # .. code-block:: yaml # # initContainers: # - name: wait-for-idp # image: busybox # command: # - sh # - -c # - | # URL="https://idp-url" # echo "Checking IdP reachability (${URL})" # until $(wget -q -O "/dev/null" ${URL}) ; do # echo "IdP (${URL}) not reachable. Waiting to be reachable..." # sleep 5 # done # echo "IdP (${URL}) reachable. Starting MinIO..." # initContainers: [ ] ### # The Kubernetes `Scheduler <https://kubernetes.io/docs/concepts/scheduling-eviction/kube-scheduler/>`__ to use for dispatching Tenant pods. # # Specify an empty dictionary ``{}`` to dispatch pods with the default scheduler. scheduler: { } ### # The Kubernetes secret name that contains MinIO environment variable configurations. # The secret is expected to have a key named config.env containing environment variables exports. configuration: name: myminio-env-configuration ### # Root key for dynamically creating a secret for use with configuring root MinIO User # Specify the ``name`` and then a list of environment variables. # # .. important:: # # Do not use this in production environments. # This field is intended for use with rapid development or testing only. # # For example: # # .. code-block:: yaml # # name: myminio-env-configuration # accessKey: minio # secretKey: minio123 # configSecret: name: myminio-env-configuration accessKey: minio secretKey: minio123 #existingSecret: true ### # Metadata that will be added to the statefulset and pods of all pools poolsMetadata: ### # Specify `annotations <https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/>`__ to associate to Tenant pods. annotations: { } ### # Specify `labels <https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/>`__ to associate to Tenant pods. labels: { } ### # If this variable is set to true, then enable the usage of an existing Kubernetes secret to set environment variables for the Tenant. # The existing Kubernetes secret name must be placed under .tenant.configuration.name e.g. existing-minio-env-configuration # The secret must contain a key ``config.env``. # The values should be a series of export statements to set environment variables for the Tenant. # For example: # # .. code-block:: shell # # stringData: # config.env: |- # export MINIO_ROOT_USER=ROOTUSERNAME # export MINIO_ROOT_PASSWORD=ROOTUSERPASSWORD # # existingSecret: false ### # Top level key for configuring MinIO Pool(s) in this Tenant. # # See `Operator CRD: Pools <https://min.io/docs/minio/kubernetes/upstream/reference/operator-crd.html#pool>`__ for more information on all subfields. pools: ### # The number of MinIO Tenant Pods / Servers in this poo'
