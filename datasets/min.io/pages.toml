["https://min.io/docs/minio/kubernetes/upstream/operations/cert-manager.html"]
title = "cert-manager — MinIO Object Storage for Kubernetes"
full_description = "Close Doc Navigation MinIO Object Storage for Kubernetes Deploy the MinIO Operator Upgrade MinIO Operator Deploy and Manage MinIO Tenants Core Operational Concepts Monitoring and Alerts External Identity Management Data Encryption (SSE) Network Encryption (TLS) cert-manager cert-manager for Operator cert-manager for Tenants Deployment Checklists Recover after Hardware Failure Troubleshooting MinIO Console Object Management Monitoring Bucket and Object Events Identity and Access Management Server-Side Encryption of Objects Bucket Replication Batch Framework Core Administration Concepts Software Development Kits (SDK) Security Token Service (STS) for MinIO Operator Object Lambda File Transfer Protocol (FTP/SFTP) MinIO Client MinIO Admin Client S3 API Compatibility Integrations MinIO Custom Resource Definition Operator Helm Charts Tenant Helm Charts MinIO Operator Environment Variables Glossary TOC Menu Search cert-manager Table of Contents TLS certificate management with cert-manager Prerequisites Setup cert-manager Next steps TLS certificate management with cert-manager This guide shows you how to install cert-manager for TLS certificate management. The guide assumes a new or fresh MinIO Operator installation. Note This guide uses a self-signed Cluster Issuer. You can also use other Issuers supported by cert-manager. The main difference is that you must provide that Issuer CA certificate to MinIO, instead of the CA’s mentioned in this guide. Refer to the cert-manager documentation and your own organization’s certificate requirements for more advanced configurations. cert-manager manages certificates within Kubernetes clusters. The MinIO Operator supports using cert-manager for managing and provisioning certificates as an alternative to the MinIO Operator managing certificates for itself and its tenants. cert-manager obtains valid certificates from an Issuer or ClusterIssuer and can automatically renew certificates prior to expiration. A ClusterIssuer issues certificates for multiple namespaces. An Issuer only mints certificates for its own namespace. The following graphic depicts how cert-manager provides certificates in namespaces across a Kubernetes cluster. A ClusterIssuer exists at the root level of the Kubernetes cluster, typically the default namespace, to provide certificates to all other namespaces. The minio-operator namespace receives its own, local Issuer. Each tenant’s namespace receives its own, local Issuer. The certificates issued by each tenant namespace must be made known to and trusted by the MinIO Operator. Prerequisites A supported version of Kubernetes. kustomize installed kubectl access to your k8s cluster Setup cert-manager Install cert-manager The following command installs version 1.12.13 using kubectl. kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.12.13/cert-manager.yaml Release 1.12.X LTS is preferred, but you may install the latest version. For more details on installing cert-manager, see their installation instructions. Create a self-signed Cluster Issuer for the cluster The Cluster Issuer is the top level Issuer from which all other certificates in the cluster derive. Request cert-manager to generate this by creating a ClusterIssuer resource. Create a file called selfsigned-root-clusterissuer.yaml with the following contents: # selfsigned-root-clusterissuer.yaml apiVersion: cert-manager.io/v1 kind: ClusterIssuer metadata: name: selfsigned-root spec: selfSigned: {} Apply the resource to the cluster: kubectl apply -f selfsigned-root-clusterissuer.yaml Next steps Set up cert-manager for the MinIO Operator. This work is licensed under a Creative Commons Attribution 4.0 International License. 2020-Present, MinIO, Inc."
