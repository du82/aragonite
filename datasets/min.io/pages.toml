title = "Snowflake Object Storage Optimization Guide for AI & Analytics | MinIO"
description = "Use MinIO and the Snowflake Data Cloud to access and analyze data from anywhere without moving it. Access private or public clouds and data at the edge."
full_description = "Use Snowflake to query your data anywhere, without the requirement to move it or store it on Snowflake. Go multi-cloud starting with the Snowflake mid June 2022 release. Query and analyze multiple data sources residing on MinIO with the Snowflake Data Cloud. Now enterprises can access Snowflake databases no matter where they exist - in the public cloud, the private cloud, even set up streaming edge instances. This includes AWS, GCP, Azure, Tanzu, OpenShift, HPE Ezmeral, SUSE Rancher and of course traditional bare metal deployments. Using external tables, enterprises can enjoy the full capabilities of Snowflake without incurring the cost of moving data into the Snowflake Data Cloud. It also enables enterprises to take advantage of multi-tenant data or perform analysis on data that cannot be moved for compliance or other business reasons. With any economic or technical constraints removed, the enterprise can unleash the Snowflake Data Cloud on all of its data - no matter where it resides. Further, with MinIO’s industry leading performance characteristics, queries can run against massive, multi-petabyte data stores and complete quickly. To guarantee that the right data is available to the right user, it is imperative that there be fine-grained access control on these multi-cloud data lakes. For authorization, MinIO’s ability to integrate with 3rd party IDPs ensures that access to the object store is restricted to only those who need it. To authenticate that those users only have access to the specific resources that they need, MinIO’s sophisticated Policy Based Access Control (PBAC) capabilities ensure that this is not an after-thought. Snowflake is a mission critical application in the enterprise. That means the Snowflake architecture needs to be built for resilience and high availability. That resiliency cannot just account for region failure in the cloud, it needs to account for the failure of the entire cloud. MinIO’s active-active, multi-site, strictly consistent replication provides the framework to sustain full cloud failure and Snowflake’s ability to run in GCP, Azure and AWS provides similar functionality."
