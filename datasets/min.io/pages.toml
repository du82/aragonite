["https://min.io/docs/minio/kubernetes/upstream/reference/operator-environment-variables.html"]
title = "MinIO Operator Environment Variables — MinIO Object Storage for Kubernetes"
description = "MINIO_OPERATOR_CERTIFICATES_VERSION"
full_description = 'Close Doc Navigation MinIO Object Storage for Kubernetes Deploy the MinIO Operator Upgrade MinIO Operator Deploy and Manage MinIO Tenants Core Operational Concepts Monitoring and Alerts External Identity Management Data Encryption (SSE) Network Encryption (TLS) cert-manager Deployment Checklists Recover after Hardware Failure Troubleshooting MinIO Console Object Management Monitoring Bucket and Object Events Identity and Access Management Server-Side Encryption of Objects Bucket Replication Batch Framework Core Administration Concepts Software Development Kits (SDK) Security Token Service (STS) for MinIO Operator Object Lambda File Transfer Protocol (FTP/SFTP) MinIO Client MinIO Admin Client S3 API Compatibility Integrations MinIO Custom Resource Definition Operator Helm Charts Tenant Helm Charts MinIO Operator Environment Variables Glossary TOC Menu Search MinIO Operator Environment Variables Table of Contents MinIO Operator Environment Variables Setting Environment Variables in Kubernetes Available MinIO Operator Environment Variables The MinIO Operator uses the following environment variables during startup to set configuration settings. Configure these variables in the minio-operator container. Setting Environment Variables in Kubernetes To set these environment variables, modify the operator container’s yaml at .spec.env or use the following kubectl command syntax: kubectl set env -n minio-operator deployment/minio-operator <ENV_VARIABLE>=<value> ... <ENV_VARIABLE2>=<value2> Replace: minio-operator with the namespace for your Operator, if not using the default value. deployment/minio-operator with the deployment for your Operator, if not the default value. (Most deployments use the default value.) <ENV_VARIABLE> with the environment variable to set or modify. <value> with the value to use for the environment variable. You can set or modify multiple environment variables by separating each VARIABLE=value pair with a space. Available MinIO Operator Environment Variables MINIO_OPERATOR_CERTIFICATES_VERSION Specifies the certificate API version to use. Valid values are v1 or v1beta1. When not specified, the default is the API Kubernetes provides. MINIO_OPERATOR_RUNTIME Specify the type of runtime to use. Valid values are EKS, Rancher, or OpenShift. Leave blank if none of the options apply. When set as EKS, the MINIO_OPERATOR_CSR_SIGNER_NAME must be beta.eks.amazonaws.com/app-serving. MINIO_OPERATOR_CSR_SIGNER_NAME Override the default signer for certificate signing requests (CSRs). When not specified, the default value is kubernetes.io/kubelet-serving. OPERATOR_CERT_PASSWD Optional The password Operator should use to decrypt the private key in the TLS certificate for Operator. OPERATOR_STS_ENABLED Toggle STS Service on or off. Changed in version v5.0.11: When not specified, the default value is on. For versions prior to Operator 5.0.11, the default value was off. MINIO_CONSOLE_DEPLOYMENT_NAME The name to use for the Operator Console. When not specified, the default value is operator. MINIO_CONSOLE_TLS_ENABLE Toggle Console TLS service on or off. When not specified, the default value is off. MINIO_OPERATOR_IMAGE New in version v5.0.11. Specify the image of the MinIO instance sidecar container loaded by the Operator. Omit to use the Operator image. WATCHED_NAMESPACE A comma-separated list of the namespace(s) Operator should watch for tenants. When not specified, the default value is "" to watch all namespaces. This work is licensed under a Creative Commons Attribution 4.0 International License. 2020-Present, MinIO, Inc.'
