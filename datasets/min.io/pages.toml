["https://min.io/docs/minio/linux/reference/minio-mc.html"]
title = "MinIO Client — MinIO Object Storage for Linux"
description = "--config-dir"
full_description = 'Close Doc Navigation MinIO Object Storage for Linux Install and Deploy MinIO Manage Existing MinIO Deployments Core Operational Concepts Monitoring and Alerts External Identity Management Data Encryption (SSE) Network Encryption (TLS) Deployment Checklists Recover after Hardware Failure Troubleshooting MinIO Console Object Management Monitoring Bucket and Object Events Identity and Access Management Server-Side Encryption of Objects Bucket Replication Batch Framework Core Administration Concepts Software Development Kits (SDK) Security Token Service (STS) Transforms with Object Lambda File Transfer Protocol (FTP/SFTP) MinIO Client MinIO Client Settings mc alias mc anonymous mc batch mc cat mc cp mc diff mc du mc encrypt mc event mc find mc get mc head mc idp ldap mc idp ldap accesskey mc idp ldap accesskey create-with-login mc idp ldap policy mc idp openid mc ilm mc legalhold mc license mc ls mc mb mc mirror mc mv mc od mc ping mc pipe mc put mc rb mc ready mc replicate mc retention mc rm mc share mc sql mc stat mc support mc tag mc tree mc undo mc update mc version mc watch MinIO Admin Client Deprecated Commands MinIO Server S3 API Compatibility Integrations Glossary TOC Menu Search MinIO Client Table of Contents Version Alignment with MinIO Server Quickstart Command Quick Reference Configuration File Certificates Pattern Matching Global Options Introduction to the MinIO Client (MC) Commands Installing and Running MinIO on Linux The MinIO Client mc command line tool provides a modern alternative to UNIX commands like ls, cat, cp, mirror, and diff with support for both filesystems and Amazon S3-compatible cloud storage services. The mc commandline tool is built for compatibility with the AWS S3 API and is tested with MinIO and AWS S3 for expected functionality and behavior. MinIO provides no guarantees for other S3-compatible services, as their S3 API implementation is unknown and therefore unsupported. While mc commands may work as documented, any such usage is at your own risk. mc has the following syntax: mc [GLOBALFLAGS] COMMAND --help See Command Quick Reference for a list of supported commands. Version Alignment with MinIO Server The MinIO Client releases separately from the MinIO Server. For best functionality and compatibility, use a MinIO Client version released closely to your MinIO Server version. For example, a MinIO Client released the same day or later than your MinIO Server version. You can install a version of the MinIO Client that is more recent than the MinIO Server version. However, if the MinIO Client version skews too far from the MinIO Server version, you may see increased warnings or errors as a result of the differences. For example, while core S3 APIs around copying (mc cp) may remain unchanged, some features or flags may only be available or stable if the client and server versions are aligned. Quickstart 1) Install mc Install the mc command line tool onto the host machine. Click the tab that corresponds to the host machine operating system or environment: Linux The following commands add a temporary extension to your system PATH for running the mc utility. Defer to your operating system instructions for making permanent modifications to your system PATH. Alternatively, execute mc by navigating to the parent folder and running ./mc --help 64-bit Intel curl https://dl.min.io/client/mc/release/linux-amd64/mc \ --create-dirs \ -o $HOME/minio-binaries/mc chmod +x $HOME/minio-binaries/mc export PATH=$PATH:$HOME/minio-binaries/ mc --help 64-bit PPC curl https://dl.min.io/client/mc/release/linux-ppc64le/mc \ --create-dirs \ -o ~/minio-binaries/mc chmod +x $HOME/minio-binaries/mc export PATH=$PATH:$HOME/minio-binaries/ mc --help ARM64 curl https://dl.min.io/client/mc/release/linux-arm64/mc \ --create-dirs \ -o ~/minio-binaries/mc chmod +x $HOME/minio-binaries/mc export PATH=$PATH:$HOME/minio-binaries/ mc --help Install from the MinIO Download Page MinIO does not officially publish its binaries to common Linux repositories or package managers (Ubuntu, RHEL, Archlinux/AUR). The only official source of MinIO binaries is the MinIO Download Page. MinIO does not recommend installation through a package manager, as upstream repositories may install the incorrect package or a renamed package. All documentation assumes the installation of the official mc client binary through the download page only, with no changes to binary naming. macOS brew install minio/stable/mc mc --help Windows Open the following file in a browser: https://dl.min.io/client/mc/release/windows-amd64/mc.exe Execute the file by double clicking on it, or by running the following in the command prompt or powershell: \path\to\mc.exe --help Source Installation from source is intended for developers and advanced users and requires a working Golang environment. See How to install Golang. Run the following commands in a terminal environment to install mc from source: go install github.com/minio/mc@latest mc update does not support source-based installations. 2) Create an Alias for the S3-Compatible Service Important The following example temporarily disables the bash history to mitigate the risk of authentication credentials leaking in plain text. This is a basic security measure and does not mitigate all possible attack vectors. Defer to security best practices for your operating system for inputting sensitive information on the command line. Use the mc alias set command to add an Amazon S3-compatible service to the mc configuration. bash +o history mc alias set ALIAS HOSTNAME ACCESS_KEY SECRET_KEY bash -o history Replace ALIAS with a name to associate to the S3 service. mc commands typically require ALIAS as an argument for identifying which S3 service to execute against. Replace HOSTNAME with the URL endpoint or IP address of the S3 service. Replace ACCESS_KEY and SECRET_KEY with the access and secret keys for a user on the S3 service. Replace each argument with the required values. If you omit the ACCESS_KEY and SECRET_KEY, the command prompts you to enter those values in the CLI. Each of the following tabs contains a provider-specific example: MinIO Server mc alias set myminio https://minioserver.example.net ACCESS_KEY SECRET_KEY AWS S3 Storage mc alias set myS3 https://s3.{your-region-code}.amazonaws.com/endpoint ACCESS_KEY SECRET_KEY Google Cloud Storage mc alias set myGCS https://storage.googleapis.com/endpoint ACCESS_KEY SECRET_KEY 3) Test the Connection Use the mc admin info command to test the connection to the newly added MinIO deployment: mc admin info myminio The command returns information on the S3 service if successful. If unsuccessful, check each of the following: The host machine has connectivity to the S3 service URL (i.e. using ping or traceroute). The specified ACCESSKEY and SECRETKEY correspond to a user on the S3 service. The user must have permission to perform actions on the service. For MinIO deployments, see Access Management for more information on user access permissions. For other S3-compatible services, defer to the documentation for that service. Command Quick Reference The following table lists mc commands: Note The MinIO Client also includes an administration extension for managing MinIO deployments. See mc admin for more complete documentation. The below table does not include those commands. Command Description mc alias list mc alias remove mc alias set mc alias import mc alias export The mc alias commands provide a convenient interface for managing the list of S3-compatible hosts that mc can connect to and run operations against. mc anonymous get mc anonymous get-json mc anonymous links mc anonymous list mc anonymous set mc anonymous set-json The mc anonymous command supports setting or removing anonymous policies to a bucket and its contents. Buckets with anonymous policies allow public access where clients can perform any action granted by the policy without authentication. mc batch describe mc batch generate mc batch list mc batch start mc batch status The mc batch commands allow you to run one or more job tasks on a MinIO deployment. mc cat The mc cat command concatenates the contents of a file or object to another file or object. You can also use the command to display the contents of the specified file or object to STDOUT. cat has similar functionality to cat. mc cp The mc cp command copies objects to or from a MinIO deployment, where the source can MinIO or a local filesystem. mc diff The mc diff mc computes the differences between two filesystem directories or MinIO buckets. mc diff lists only those objects which are missing or which differ in size. mc diff does not compare the contents of objects. mc du The mc du command summarizes the disk usage of buckets and folders. You can also use du against the local filesystem to produce similar results as the du command. mc encrypt clear mc encrypt info mc encrypt set The mc encrypt commands set, update, or disable the default bucket Server-Side Encryption (SSE) mode. MinIO automatically encrypts objects using the specified SSE mode. mc event add mc event ls mc event rm The mc event command supports adding, removing, and listing bucket event notifications. mc find The mc find command supports searching for objects on a MinIO deployment. You can also use the command to search for files on a filesystem. mc get The mc get command downloads an object from a target S3 deployment to the local file system. mc head The mc head command displays the first n lines of an object, where n is an argument specified to the command. mc idp ldap accesskey mc idp ldap accesskey create-with-login mc idp ldap add mc idp ldap disable mc idp ldap enable mc idp ldap info mc idp ldap ls mc idp ldap policy mc idp ldap rm mc idp ldap update The mc idp ldap commands allow you to manage configurations to 3rd party Active Directory or LDAP Identity and Access Management (IAM) integrations. mc idp openid add mc idp openid disable mc idp openid enable mc idp openid info mc idp openid ls mc idp openid rm mc idp openid update The mc idp openid commands allow you to manage configurations to 3rd party OpenID Identity and Access Management (IAM) integrations. mc idp ldap policy attach mc idp ldap policy detach mc idp ldap policy entities The mc idp ldap policy commands show the mapping relationships between policies and the associated groups or users. mc ilm restore mc ilm rule add mc ilm rule edit mc ilm rule export mc ilm rule import mc ilm rule ls mc ilm rule rm mc ilm tier add mc ilm tier check mc ilm tier info mc ilm tier ls mc ilm tier rm mc ilm tier update The mc ilm commands manage object lifecycle management rules and tiering on a MinIO deployment. mc legalhold clear mc legalhold info mc legalhold set The mc legalhold command sets, removes, or retrieves the object legal hold (WORM) settings for object(s). mc license info mc license register mc license update The mc license commands work with cluster registration for MinIO SUBNET. Use the commands to register a deployment, display information about the cluster’s current license, or update the license key for a cluster. mc ls The mc ls command lists buckets and objects on MinIO or another S3-compatible service. mc mb The mc mb command creates a new bucket or directory at the specified path. mc mirror The mc mirror command synchronizes content to MinIO deployment, similar to the rsync utility. mc mirror supports filesystems, MinIO deployments, and other S3-compatible hosts as the synchronization source. mc mv The mc mv command moves an object from source to the target, such as between MinIO deployments or between buckets on the same MinIO deployment. mc mv also supports moving objects between a local filesystem and MinIO. mc od The mc od command copies a local file to a remote location in a specified number of parts and part sizes. The command outputs the time it took to upload the file. mc ping The mc ping command performs a liveness check on a specified target. mc pipe The mc pipe command streams content from STDIN to a target object. mc put The mc put uploads an object from the local file system to a bucket on a target S3 deployment. mc rb The mc rb command removes one or more buckets on MinIO or another S3-compatible service. To remove only the contents of a bucket, use mc rm instead. mc ready The mc ready command checks the status of a cluster and whether the cluster has read and write quorum. mc replicate add mc replicate backlog mc replicate export mc replicate import mc replicate ls mc replicate resync mc replicate rm mc replicate status mc replicate update The mc replicate command configures and manages the Server-Side Bucket Replication for a MinIO deployment, including active-active replication configurations and resynchronization. mc retention clear mc retention info mc retention set The mc retention command configures the Write-Once Read-Many (WORM) locking settings for an object or object(s) in a bucket. You can also set the default object lock settings for a bucket, where all objects without explicit object lock settings inherit the bucket default. mc rm The mc rm command removes objects from a bucket on a MinIO deployment. To completely remove a bucket, use mc rb instead. mc share download mc share ls mc share upload Use the mc share commands to manage presigned URLs for downloading and uploading objects to a MinIO bucket. mc sql The mc sql command provides an S3 Select interface for performing sql queries on objects in the specified MinIO deployment. mc stat The mc stat command displays information on objects in a MinIO bucket, including object metadata. You can also use it to retrieve bucket metadata. mc support callhome mc support diag mc support inspect mc support perf mc support profile mc support proxy mc support top api mc support top disk mc support top locks mc support upload The MinIO Client mc support commands provides tools for analyzing deployment health or performance and for running diagnostics. You can also upload generated health reports for further analysis by MinIO engineering. mc tag list mc tag remove mc tag set The mc tag command adds, removes, and lists tags associated to a bucket or object. mc tree The mc tree command lists all prefixes inside a MinIO bucket in a tree format. The command optionally supports listing all objects inside of bucket at each prefix, including the bucket root. mc undo The mc undo command reverses changes due to either a PUT or DELETE operation at a specified path. mc update The mc update command automatically updates the mc binary to the latest stable version. mc version enable mc version info mc version suspend The mc version commands enable, disable, and retrieve the versioning status for a MinIO bucket. mc watch The mc watch command watches for events on the specified MinIO bucket or local filesystem path. For S3 services, use mc event add to configure bucket event notifications on S3-compatible services. Configuration File mc uses a JSON formatted configuration fi'
