full_description = 'One of the Largest Global Investment and Commercial Banks selects MinIO for high-performance and versatile object storage. Automation machinery manufacturer founded in 1915, based in Japan. The company co-innovates with a global network of 112 companies located in 61 countries. A premier consumer financial services company delivering one of the industry’s most complete digitally-enabled product suites. A global technology innovator for more than a century, leading advances in AI, automation and hybrid cloud solutions. One of the world’s largest IT companies with operations in over 170 countries. A financial services company founded in the US in 1984, one of the fastest-growing credit card issuers in the US. Puzzel faced significant challenges in finding S3 compatible object storage outside of AWS and aimed to reduce costs associated with using public cloud. The company chose MinIO for its ease of installation, management, scalability, and compatibility with Amazon S3. One of the Largest Global Investment and Commercial Banks selects MinIO for high-performance and versatile object storage. This customer faced challenges in finding S3 compatible object storage outside of AWS, high-performance object storage, migration from HDFS, archival storage, and establishing a foundation for a modern data lake. They selected MinIO due to its performance, cost, scalability, technical support, compatibility with Amazon S3, and product reliability. "With open file formats (Iceberg)+object store, MinIO helped us deploy data services that resulted in sub-second responses. I strongly believe Iceberg+MinIO outperforms many traditional solutions like Hive, HDFS, MPP db engines." Automation machinery manufacturer founded in 1915, based in Japan. The company co-innovates with a global network of 112 companies located in 61 countries. Yokogawa faced multiple challenges, including the need for S3 compatible object storage outside of AWS, high performance object storage, cloud native/Kubernetes native object storage, migration from HDFS and archival storage.'
