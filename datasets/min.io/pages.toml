["https://min.io/solutions/sqlserver"]
title = "MinIO | Optimize SQL Server 2022 Architecture with MinIO"
description = "SQL Server 2022 goes multi-cloud with external tables, polybase and MinIO"
full_description = "Query and analyze multiple data sources residing on MinIO with the SQL Server 2022 Data Cloud. Now enterprises can query data residing on MinIO from any SQL Server instance - in the public cloud, the private cloud, even streaming edge instances. This includes AWS, GCP, Azure, Tanzu, OpenShift, HPE Ezmeral, SUSE Rancher and of course traditional bare metal deployments. Using external tables, enterprises can enjoy the full capabilities of SQL Server without incurring the cost of moving data or the challenges of reconciliation once you do. The Polybase feature allows a user to query data using Transact-SQL directly from not only SQL Server but most other database installations (like Oracle, Teradata, MongoDB, etc.) and now S3 APIs. MinIO provides the unique capability to access all hyperscaler cloud environments. The combination of the two (SQL Server 2022 and MinIO) enables an enterprise to access data and drive insights from data silos that, up until now, were segmented and difficult to combine. With this new capability the enterprise can use SQL Server 2022 on all of the organization’s data - no matter where it resides nor how big the data set. With MinIO’s industry leading performance characteristics, queries can run against massive, multi-petabyte data stores and complete quickly. One of the core use cases for SQL Server 2022 and MinIO is backup and restore. MinIO supports a wide range of configurations enabling multiple architectures. More importantly, however, if a restore is needed, MinIO's industry leading throughput can turn weeks into hours - because backups aren't useful if they can't be restored quickly. To guarantee that the right data is available to the right user, it is imperative that there be fine-grained access control on these multi-cloud data lakes. For authorization, MinIO’s ability to integrate with 3rd party IDPs ensures that access to the object store is restricted to only those who need it. To authenticate that those users only have access to the specific resources that they need, MinIO’s sophisticated Policy Based Access Control (PBAC) capabilities ensure that this is not an after-thought."
author = "MinIO, Inc."
year_published = 2025
