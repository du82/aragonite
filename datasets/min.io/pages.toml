["https://min.io/compliance"]
title = "MinIO Trademark Usage Policy"
full_description = 'The GNU AGPL v3 is designed for developers who are building open source applications in compliance with the GNU AGPL v3 license and are able to support themselves. It is fully featured. If you distribute, host or create derivative works of the MinIO software over the network, the GNU AGPL v3 license requires that you also distribute the complete, corresponding source code of the combined work under the same GNU AGPL v3 license. This requirement applies whether or not you modified MinIO. Please consult the license here or review the FAQs below. The Enterprise Object Store offering is designed for mission critical environments where both a license and strict SLAs are required. Commercial version includes all of the Enterprise Object Store features, a four hour SLA, Indemnification, optional annual architecture and security reviews, unlimited panic buttons and other benefits that are detailed in the Enterprise License and Subscription Agreement. The GNU AGPL v3 is short for the "GNU Affero General Public License v3." It is a FOSS license certified by the Free Software Foundation and the Open Source Initiative. You can get a copy of the GNU AGPL v3 license with MinIO source code or at https://www.gnu.org/licenses/agpl-3.0.en.html. When you host or distribute MinIO over a network, the AGPL v3 applies to you. Any distribution or copying of MinIO software modified or not has to comply with the obligations specified in the AGPL v3 license. You must include the source code, full license text and the original copyright notice along with the object code. Creating combined or derivative works of MinIO requires all such works to be released under the same license. If MinIO source code is included in the same executable file, they are definitely combined in one program. If modules are designed to run linked together in a shared address space, that almost surely means combining them into one program. By contrast, pipes, sockets, RESTful APIs, and command-line arguments are communication mechanisms normally used between two separate programs. So when they are used for communication, the modules normally are separate programs. But if the semantics of the communication are intimate enough, exchanging complex internal data structures, that too could be a basis to consider the two parts as combined into a larger program.'
author = "MinIO, Inc."
year_published = 2025
clearnet = "https://min.io/compliance"
