title = "Server-Side Encryption of Objects — MinIO Object Storage for Kubernetes"
full_description = "Close Doc Navigation MinIO Object Storage for Kubernetes Deploy the MinIO Operator Upgrade MinIO Operator Deploy and Manage MinIO Tenants Core Operational Concepts Monitoring and Alerts External Identity Management Data Encryption (SSE) Network Encryption (TLS) cert-manager Deployment Checklists Recover after Hardware Failure Troubleshooting MinIO Console Object Management Monitoring Bucket and Object Events Identity and Access Management Server-Side Encryption of Objects Server-Side Encryption with Per-Bucket Keys (SSE-KMS) Server-Side Encryption Per-Deployment Key (SSE-S3) Server-Side Encryption with Client-Managed Keys (SSE-C) Bucket Replication Batch Framework Core Administration Concepts Software Development Kits (SDK) Security Token Service (STS) for MinIO Operator Object Lambda File Transfer Protocol (FTP/SFTP) MinIO Client MinIO Admin Client S3 API Compatibility Integrations MinIO Custom Resource Definition Operator Helm Charts Tenant Helm Charts MinIO Operator Environment Variables Glossary TOC Menu Search Server-Side Encryption of Objects Table of Contents Secure Erasure and Locking MinIO Server-Side Encryption (SSE) protects objects as part of write operations, allowing clients to take advantage of server processing power to secure objects at the storage layer (encryption-at-rest). SSE also provides key functionality to regulatory and compliance requirements around secure locking and erasure. MinIO SSE uses the MinIO Key Encryption Service (KES) and an external Key Management Service (KMS) for performing secured cryptographic operations at scale. MinIO also supports client-managed key management, where the application takes full responsibility for creating and managing encryption keys for use with MinIO SSE. MinIO SSE is feature and API compatible with AWS Server-Side Encryption and supports the following encryption strategies: SSE-KMS Recommended MinIO supports enabling automatic SSE-KMS encryption of all objects written to a bucket using a specific External Key (EK) stored on the external KMS. Clients can override the bucket-default EK by specifying an explicit key as part of the write operation. For buckets without automatic SSE-KMS encryption, clients can specify an EK as part of the write operation instead. MinIO encrypts backend data as part of enabling server-side encryption. You cannot disable SSE-KMS encryption once enabled. SSE-KMS provides more granular and customizable encryption compared to SSE-S3 and SSE-C and is recommended over the other supported encryption methods. For a tutorial on enabling SSE-KMS in a local (non-production) MinIO Deployment, see Quickstart. For production MinIO deployments, use one of the following guides: AWS Secrets Manager Azure Key Vault Entrust KeyControl Fortanix SDKMS Google Cloud Secret Manager HashiCorp Vault Keystore Thales CipherTrust Manager (formerly Gemalto KeySecure) SSE-S3 MinIO supports enabling automatic SSE-S3 encryption of all objects written to a bucket using an EK stored on the external KMS. MinIO SSE-S3 supports one EK for the entire deployment. For buckets without automatic SSE-S3 encryption, clients can request SSE encryption as part of the write operation instead. MinIO encrypts backend data as part of enabling server-side encryption. You cannot disable SSE-KMS encryption once enabled. For a tutorial on enabling SSE-s3 in a local (non-production) MinIO Deployment, see Quickstart. For production MinIO deployments, use one of the following guides: AWS Secrets Manager Azure Key Vault Entrust KeyControl Fortanix SDKMS Google Cloud Secret Manager HashiCorp Vault Keystore Thales CipherTrust Manager (formerly Gemalto KeySecure) SSE-C Clients specify an EK as part of the write operation for an object. MinIO uses the specified EK to perform SSE-S3. SSE-C does not support bucket-default encryption settings and requires clients perform all key management operations. MinIO SSE requires enabling Network Encryption (TLS). Secure Erasure and Locking MinIO requires access to the Encryption Key (EK) and external Key Management System (KMS) used as part of SSE operations to decrypt an object. You can use this dependency to securely erase and lock objects from access by disabling access to the EK or KMS used for encryption. General strategies include, but are not limited to: Seal the KMS such that it cannot be accessed by MinIO server anymore. This locks all SSE-KMS or SSE-S3 encrypted objects protected by any EK stored on the KMS. The encrypted objects remain unreadable as long as the KMS remains sealed. Seal/Unmount an EK. This locks all SSE-KMS or SSE-S3 encrypted objects protected by that EK. The encrypted objects remain unreadable as long as the CMK(s) remains sealed. Delete an EK. This renders all SSE-KMS or SSE-S3 encrypted objects protected by that EK as permanently unreadable. The combination of deleting an EK and deleting the data may fulfill regulatory requirements around secure deletion of data. Deleting an EK is typically irreversible. Exercise extreme caution before intentionally deleting a master key. For more information, see: SSE-KMS Secure Erasure and Locking SSE-S3 Secure Erasure and Locking SSE-C Secure Erasure and Locking This work is licensed under a Creative Commons Attribution 4.0 International License. 2020-Present, MinIO, Inc."
year_published = 2025
