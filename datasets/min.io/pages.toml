["https://min.io/solutions/optimize-splunk-smartstore-performance"]
title = "MinIO | Splunk SmartStores for Modern Enterprises"
description = "Make your Splunk SmartStore more efficient and infinitely scalable through deploying MinIO for S3 compatible object storage."
full_description = "MinIO's exceptional throughput characteristics make it the fastest SmartStore on the market. Choose HDD or NVMe to create the optimal mix of cost and performance. A small 8 node NVMe cluster can drive more than 55 GiB/s throughput. MinIO's inline erasure code and bitrot protection is CPU-optimized to deliver maximum data protection with minimal overhead. The result is fourteen nines of protection with only 33% overhead vs replication which requires 300% or higher. MinIO's SmartStore implementation scales seamlessly from a single cluster. Each new cluster can be federated with other MinIO clusters to create a global namespace, spanning multiple data centers and geographies. By offloading the state to MinIO, Splunk becomes elastic, containerized and lightweight - the hallmarks of a cloud native application. Add Kubernetes-powered automation and enterprises become more operationally efficient without sacrificing performance. The result is less time managing infrastructure and more time “in the data” finding the insights that drive the business. MinIO's sophisticated server-side encryption schemes protect data in flight and at rest. Further, encrypted objects are tamper-proofed with AEAD server side encryption. Given the exceptionally low overhead, auto-encryption can be turned on for every application and instance. MinIO is 100% open source under the Affero General Public License Version 3 (AGPLv3) and runs completely in userspace. The combination means that enterprises can design solutions using standard hardware that meet their budget requirements while avoiding the vendor lock-in trap generally associated with proprietary appliance vendors. You are using Internet Explorer version 11 or lower. Due to security issues and lack of support for web standards, it is highly recommended that you upgrade to a modern browser."
