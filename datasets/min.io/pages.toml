["https://min.io/docs/minio/linux/administration/bucket-replication/enable-server-side-two-way-bucket-replication.html"]
title = "Enable Two-Way Server-Side Bucket Replication — MinIO Object Storage for Linux"
full_description = '''Close Doc Navigation MinIO Object Storage for Linux Install and Deploy MinIO Manage Existing MinIO Deployments Core Operational Concepts Monitoring and Alerts External Identity Management Data Encryption (SSE) Network Encryption (TLS) Deployment Checklists Recover after Hardware Failure Troubleshooting MinIO Console Object Management Monitoring Bucket and Object Events Identity and Access Management Server-Side Encryption of Objects Bucket Replication Requirements to Set Up Bucket Replication Enable One-Way Server-Side Bucket Replication Enable Two-Way Server-Side Bucket Replication Enable Multi-Site Server-Side Bucket Replication Resynchronize Bucket from Remote Replica Batch Framework Core Administration Concepts Software Development Kits (SDK) Security Token Service (STS) Transforms with Object Lambda File Transfer Protocol (FTP/SFTP) MinIO Client MinIO Admin Client Deprecated Commands MinIO Server S3 API Compatibility Integrations Glossary TOC Menu Search Enable Two-Way Server-Side Bucket Replication Table of Contents Requirements Access to Both Clusters Considerations Procedure Configure Two-Way Bucket Replication Using the Command Line mc The procedure on this page creates a new bucket replication rule for two-way “active-active” synchronization of objects between MinIO buckets. To configure replication between arbitrary S3-compatible services, use mc mirror. To configure one-way “active-passive” replication between MinIO clusters, see Enable One-Way Server-Side Bucket Replication. To configure multi-site “active-active” replication between MinIO clusters, see Enable Multi-Site Server-Side Bucket Replication. This tutorial covers configuring Active-Active replication between two MinIO clusters. For a tutorial on multi-site replication between three or more MinIO clusters, see Enable Multi-Site Server-Side Bucket Replication. Requirements You must meet all of the basic requirements for bucket replication described in Bucket Replication Requirements. In addition, to set up active-active bucket replication, you must meet the following additional requirements: Access to Both Clusters You must have network access and login credentials with required permissions to both deployment to set up active-active bucket replication. You can access the deployments by installing mc and using the command line. Use the mc alias set command to create an alias for both MinIO deployments. Alias creation requires specifying an access key for a user on the deployment. This user must have permission to create and manage users and policies on the deployment. Specifically, ensure the user has at minimum: admin:CreateUser admin:ListUsers admin:GetUser admin:CreatePolicy admin:GetPolicy admin:AttachUserOrGroupPolicy Considerations Use Consistent Replication Settings MinIO supports customizing the replication configuration to enable or disable the following replication behaviors: Replication of delete operations Replication of delete markers Replication of existing objects Replication of metadata-only changes When configuring replication rules for a bucket, ensure that both MinIO deployments participating in active-active replication use the same replication behaviors to ensure consistent and predictable synchronization of objects. Replication of Existing Objects MinIO supports automatically replicating existing objects in a bucket. MinIO requires explicitly enabling replication of existing objects using the mc replicate add --replicate or mc replicate update --replicate and including the existing-objects replication feature flag. This procedure includes the required flags for enabling replication of existing objects. Replication of Delete Operations MinIO supports replicating delete operations onto the target bucket. Specifically, MinIO can replicate versioning Delete Markers and the deletion of specific versioned objects: For delete operations on an object, MinIO replication also creates the delete marker on the target bucket. For delete operations on versions of an object, MinIO replication also deletes those versions on the target bucket. MinIO requires explicitly enabling replication of delete operations using the mc replicate add --replicate or mc replicate update --replicate. This procedure includes the required flags for enabling replication of delete operations and delete markers. MinIO does not replicate delete operations resulting from the application of lifecycle management expiration rules. Configure matching expiration rules on both the source and destination bucket to ensure consistent application of object expiration. See Replication of Delete Operations and Object Deletion for more complete documentation. Multi-Site Replication MinIO supports configuring multiple remote targets per bucket or bucket prefix. This enables configuring multi-site active-active replication between MinIO deployments. This procedure covers active-active replication between two MinIO sites. You can repeat this procedure for each “pair” of MinIO deployments in the replication mesh. For a dedicated tutorial, see Enable Multi-Site Server-Side Bucket Replication. Procedure Configure Two-Way Bucket Replication Using the Command Line Create Replication Remote Targets Create a New Bucket Replication Rule on Each Deployment Validate the Replication Configuration Configure Two-Way Bucket Replication Using the Command Line mc This procedure creates two-way, active-active replication between two MinIO deployments. This procedure assumes you have already defined an alias for each deployment as a user with the necessary replication permissions. Changed in version RELEASE.2022-12-24T15-21-38Z: mc replicate add automatically creates the necessary replication targets, removing the need for using the deprecated mc admin remote bucket add command. This procedure only documents the procedure as of that release. 1) Create a New Bucket Replication Rule on Each Deployment Use the mc replicate add command to add a new replication rule to each MinIO deployment. mc replicate add ALIAS/BUCKET \ --remote-bucket 'https://USER:PASSWORD@HOSTNAME:PORT/BUCKET' \ --replicate "delete,delete-marker,existing-objects" Replace ALIAS with the alias of the origin MinIO deployment. The name must match the bucket specified when creating the remote target in the previous step. Replace BUCKET with the name of the bucket to replicate from on the origin deployment. Replace the --remote-bucket to specify the remote MinIO deployment and bucket to which the ALIAS/BUCKET replicates. The USER:PASSWORD must correspond to a user on the remote deployment with the necessary replication permissions. The HOSTNAME:PORT must resolve to a reachable MinIO instance on the remote deployment. The BUCKET must exist and otherwise meet all other replication requirements. The --replicate "delete,delete-marker,existing-objects" flag enables the following replication features: Replication of Deletes Replication of existing Objects See mc replicate add --replicate for more complete documentation. Omit any field to disable replication of that component. Specify any other supported optional arguments for mc replicate add. Repeat this step on the other MinIO deployment. Change the ALIAS and --remote-bucket values to correspond to the first deployment. You should have two replication rules configured at the conclusion of this step - one created on each deployment that points to the bucket on the other deployment. Use the mc replicate ls command to verify the created replication rules. 2) Validate the Replication Configuration Use mc cp to copy a new object to the replicated bucket on one of the deployments. mc cp ~/foo.txt ALIAS/BUCKET Use mc ls to verify the object exists on the destination bucket: mc ls ALIAS/BUCKET Repeat this test by copying another object to the second deployment and verifying the object replicates to the first deployment. Once both objects exist on both deployments, you have successfully set up two-way, active-active replication between MinIO buckets. See also Use the mc replicate update command to modify an existing replication rule. Use the mc replicate update command with the --state "disable" flag to disable an existing replication rule. Use the mc replicate rm command to remove an existing replication rule. This work is licensed under a Creative Commons Attribution 4.0 International License. 2020-Present, MinIO, Inc.'''
