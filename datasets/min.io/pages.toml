full_description = 'This is a recommended configuration based on the desired capacity entered. You may adjust these values for your requirements. MinIO is hardware agnostic and runs on a variety of hardware architectures ranging from x64 to ARM64 and POWER9 servers. However, for a large scale data storage infrastructure, we recommend the following server configurations in capacity and performance flavors. The MinIO DataPod is a full reference architecture for deployments of 100PiB. This includes hardware, software and networking. MinIO will run on almost any hardware, but we recommend the following for high performance workloads. Use the "Ask an Expert" button to talk to the team about your specific requirements. AIStor comes with predictable licensing costs - everything is included and most organizations have a return on their investment within a quarter or two. The total cost of ownership of a non-commercial implementation is often higher when factoring in support, customization, maintenance, and security. The team at MinIO has a remarkable set of technical capabilities that become available to AIStor customers. MinIO employs a unique approach, providing direct, 24/7 access to our engineers via the SUBNET portal. This speeds resolution time but also brings a broader perspective - often identifying issues before they become problems. While MinIO prides itself on performance and simplicity, production deployments of MinIO are invariably mission-critical and touch a number of different technologies. When everything matters - performance, security, scale and manageability - AIStor offers expertise, guaranteed response times and the efficiency of a direct-to-engineer engagement model. MinIO Is The Most Reliable Object Storage Solution For On-Premise Deployments. We use it as a high-performance object storage solution for several analytics use cases. Switching over to MinIO from HDFS has improved the performance of analytics workloads significantly. MinIO - A Must Have For Hyper-Scale Storage. Our group’s goal to optimize performance and reduce costs were met and exceeded by MinIO. The object storage server MinIO provides was compatible with our existing systems which was a huge bonus for us. They also helped us to reduce our overall storage footprint which also helped us reduce costs.'
