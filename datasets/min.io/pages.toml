title = "MinIO | Kubernetes Training Course"
full_description = "Grow your career and advance your team with classroom oriented training or self-paced learning options. MinIO Enterprise Administration II: Containers and Kubernetes (MN216). Build and manage an enterprise grade Kubernetes based object store leveraging the MinIO Operator. Experienced MinIO administrators can learn to build and deploy high performance applications on Kubernetes using the MinIO Operator. This is the second course in the MinIO Administration track, following MinIO Enterprise Administration I: Management, Replication and Security Essentials (MN116) and is intended for experienced MinIO administrators. Kubernetes platform administrators, engineers, and cloud architects already experienced with MinIO will be able to use the MinIO Operator along with Kubectl, Helm, Krew, and other Kubernetes tools to deploy and manage a multi-tenant, multi-node MinIO object store cluster. Students will engage in cloud-based hands-on labs throughout the course using MinIO’s chosen flavor of Kubernetes. Enterprises deploying MinIO on Kubernetes will benefit by having a massively extensible platform for enterprise MinIO deployments that can be replicated across public and private cloud and bare metal environments. MinIO and Kubernetes deliver an S3 API based infrastructure, control over the software stack and the ability to avoid vendor lock-in. Students completing this course will possess the skills to deploy MinIO object storage resources on Kubernetes to improve system performance, scalability and portability across deployment architectures Students will use MinIO SUBNET for posting questions, comments, or follow-ups during and after the training. MinIO engineers can engage directly with students to provide additional information or resolution to ongoing queries. SUBNET is a key part of customer success both during and after training. You are using Internet Explorer version 11 or lower. Due to security issues and lack of support for web standards, it is