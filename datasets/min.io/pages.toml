full_description = "Close Doc Navigation MinIO Object Storage for Kubernetes Deploy the MinIO Operator Upgrade MinIO Operator Deploy and Manage MinIO Tenants Core Operational Concepts Monitoring and Alerts Metrics and alerts Publish Server or Audit Logs to an External Service Healthcheck API Monitor a MinIO Server with Grafana External Identity Management Data Encryption (SSE) Network Encryption (TLS) cert-manager Deployment Checklists Recover after Hardware Failure Troubleshooting MinIO Console Object Management Monitoring Bucket and Object Events Identity and Access Management Server-Side Encryption of Objects Bucket Replication Batch Framework Core Administration Concepts Software Development Kits (SDK) Security Token Service (STS) for MinIO Operator Object Lambda File Transfer Protocol (FTP/SFTP) MinIO Client MinIO Admin Client S3 API Compatibility Integrations MinIO Custom Resource Definition Operator Helm Charts Tenant Helm Charts MinIO Operator Environment Variables Glossary TOC Menu Search Monitoring and Alerts Table of Contents Metrics and Alerts Logging Healthchecks Monitoring with MinIO and Prometheus: Overview Monitoring with MinIO and Prometheus: Lab Metrics and Alerts MinIO publishes point-in-time metrics using the Prometheus Data Model. You can use any scraping tool which supports that data model to pull those metrics into a database for populating historical views, performing query/analysis of metrics data, or creating alerts on preferred data points. The following table lists tutorials for integrating MinIO metrics with select third-party monitoring software. Monitoring and Alerting using Prometheus Configure Prometheus to Monitor and Alert for a MinIO deployment Configure MinIO to query the Prometheus deployment to enable historical metrics via the MinIO Console Monitoring and Alerting using InfluxDB Configure InfluxDB to Monitor and Alert for a MinIO deployment. Other metrics and analytics software suites which support the Prometheus data model may work regardless of their inclusion on the above list. Logging MinIO publishes all minio server operations to the system console. MinIO also supports publishing server logs and audit logs to an HTTP webhook. Server logs contain the same minio server operations logged to the system console. Server logs support general monitoring and troubleshooting of operations. Audit logs are more granular descriptions of each operation on the MinIO deployment. Audit logging supports security standards and regulations which require detailed tracking of operations. MinIO publishes logs as a JSON document as a PUT request to each configured endpoint. The endpoint server is responsible for processing each JSON document. MinIO requires explicit configuration of each webhook endpoint and does not publish logs to a webhook by default. See Publish Server or Audit Logs to an External Service for more complete documentation. Healthchecks MinIO exposes unauthenticated endpoints for probing node uptime and cluster high availability for simple healthchecks. These endpoints return only an HTTP status code. See Healthcheck API for more information. This work is licensed under a Creative Commons Attribution 4.0 International License. 2020-Present, MinIO, Inc."
