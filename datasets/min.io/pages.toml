full_description = "Close Doc Navigation MinIO Object Storage for Kubernetes Deploy the MinIO Operator Upgrade MinIO Operator Deploy and Manage MinIO Tenants Core Operational Concepts Monitoring and Alerts External Identity Management Data Encryption (SSE) Network Encryption (TLS) cert-manager Deployment Checklists Hardware Checklist Security Checklist Software Checklist Recover after Hardware Failure Troubleshooting MinIO Console Object Management Monitoring Bucket and Object Events Identity and Access Management Server-Side Encryption of Objects Bucket Replication Batch Framework Core Administration Concepts Software Development Kits (SDK) Security Token Service (STS) for MinIO Operator Object Lambda File Transfer Protocol (FTP/SFTP) MinIO Client MinIO Admin Client S3 API Compatibility Integrations MinIO Custom Resource Definition Operator Helm Charts Tenant Helm Charts MinIO Operator Environment Variables Glossary TOC Menu Search Deployment Checklists The following checklists provide a high-level guideline for validating production-readiness of MinIO deployments. These checklists may not meet the precise requirements of your unique deployment topology or architecture, and are intended as a best-effort guide to reliable production deployments. MinIO SUBNET users can log in and create a new issue for pre-production deployment reviews. Coordination with MinIO Engineering via SUBNET ensures end-to-end support for performant and reliable deployments. Community users can seek support on the MinIO Community Slack. Community Support is best-effort only and has no SLAs around responsiveness. Checklists: Hardware Checklist Security Checklist Software Checklist This work is licensed under a Creative Commons Attribution 4.0 International License. 2020-Present, MinIO, Inc."
