title = "MinIO Custom Resource Definition — MinIO Object Storage for Kubernetes"
full_description = "Close Doc Navigation MinIO Object Storage for Kubernetes Deploy the MinIO Operator Upgrade MinIO Operator Deploy and Manage MinIO Tenants Core Operational Concepts Monitoring and Alerts External Identity Management Data Encryption (SSE) Network Encryption (TLS) cert-manager Deployment Checklists Recover after Hardware Failure Troubleshooting MinIO Console Object Management Monitoring Bucket and Object Events Identity and Access Management Server-Side Encryption of Objects Bucket Replication Batch Framework Core Administration Concepts Software Development Kits (SDK) Security Token Service (STS) for MinIO Operator Object Lambda File Transfer Protocol (FTP/SFTP) MinIO Client MinIO Admin Client S3 API Compatibility Integrations MinIO Custom Resource Definition Operator Helm Charts Tenant Helm Charts MinIO Operator Environment Variables Glossary TOC Menu Search MinIO Custom Resource Definition Table of Contents Operator CRD v2 Reference Bucket CertificateConfig CertificateStatus CustomCertificateConfig CustomCertificates ExposeServices Features HealthStatus (string) KESConfig LocalCertificateReference Logging Pool PoolState (string) PoolStatus PoolsMetadata ServiceMetadata SideCars Tenant TenantDomains TenantScheduler TenantSpec TenantUsage TierUsage The MinIO Operator installs a Custom Resource Definition (CRD) that describes a MinIO Tenant object. The Operator uses this CRD for provisioning and managing Tenant resources within a Kubernetes cluster. This page documents the CRD reference for use in customizing Operator-deployed Tenants. This documentation assumes familiarity with all referenced Kubernetes concepts, utilities, and procedures. Operator CRD v2 Reference Package v2 - This page provides a quick automatically generated reference for the MinIO Operator Operator CRD v2 Reference CRD. For more complete documentation on the MinIO Operator CRD, see MinIO Kubernetes Documentation. The Operator CRD v2 Reference API was released with the v4.0.0 MinIO Operator. The MinIO Operator automatically converts existing tenants using the /v1 API to /v2. Tenant Bucket Bucket describes the default created buckets TenantSpec Field Description name string region string objectLock boolean CertificateConfig CertificateConfig (certConfig) defines controlling attributes associated to any TLS certificate automatically generated by the Operator as part of tenant creation. These fields have no effect if spec.autoCert: false. TenantSpec Field Description commonName string Optional The CommonName or CN attribute to associate to automatically generated TLS certificates. organizationName string array Optional Specify one or more OrganizationName or O attributes to associate to automatically generated TLS certificates. dnsNames string array Optional Specify one or more x.509 Subject Alternative Names (SAN) to associate to automatically generated TLS certificates. MinIO Server pods use SNI to determine which certificate to respond with based on the requested hostname. CertificateStatus CertificateStatus keeps track of all the certificates managed by the operator TenantStatus Field Description autoCertEnabled boolean AutoCertEnabled registers whether we know if the tenant has autocert enabled customCertificates CustomCertificates Provides the output of the client, minio, and`minioCAs` custom TLS certificates manually added to the Operator. CustomCertificateConfig CustomCertificateConfig (customCertificateConfig) provides attributes associated of the TLS certificates manually added to the Operator as part of tenant creation. These fields contain no data if there are no custom TLS certificates. CustomCertificates Field Description certName string Optional Output one or more CertName attributes associated with the manually provided TLS certificates. domains string array Optional Output one or more Domains attributes associated with the manually provided TLS certificates. expiry string Optional Output one or more Expiry attributes associated with the manually provided TLS certificates. expiresIn string Optional Output one or more ExpiresIn attributes associated with the manually provided TLS certificates. serialNo string Optional Output one or more SerialNo attributes associated with the manually provided TLS certificates. CustomCertificates CustomCertificates (customCertificates) provides groupings of the TLS certificates manually added to the Operator as part of tenant creation. These fields contain no data if there are no custom TLS certificates. CertificateStatus Field Description client CustomCertificateConfig array Optional Client minio CustomCertificateConfig array Optional Minio minioCAs CustomCertificateConfig array Optional Certificate Authorities ExposeServices ExposeServices (exposeServices) defines the exposure of the MinIO object storage and Console services. TenantSpec Field Description minio boolean Optional Directs the Operator to expose the MinIO service. Defaults to false. console boolean Optional Directs the Operator to expose the MinIO Console service. Defaults to false. Features Features (features) - Object describing which MinIO features to enable/disable in the MinIO Tenant. TenantSpec Field Description bucketDNS boolean Optional Specify true to allow clients to access buckets using the DNS path <bucket>.minio.default.svc.cluster.local. Defaults to false. domains TenantDomains Optional Specify a list of domains used to access MinIO and Console. enableSFTP boolean Optional Starts minio server with SFTP support HealthStatus (string) HealthStatus represents whether the tenant is healthy, with decreased service or offline TenantStatus KESConfig KESConfig (kes) defines the configuration of the MinIO Key Encryption Service (KES) StatefulSet deployed as part of the MinIO Tenant. KES supports Server-Side Encryption of objects using an external Key Management Service (KMS). TenantSpec Field Description replicas integer Optional Specify the number of replica KES pods to deploy in the tenant. Defaults to 2. image string Optional imagePullPolicy PullPolicy Optional The pull policy for the MinIO Docker image. Specify one of the following: Always Never IfNotPresent (Default) Refer to the Kubernetes documentation for details https://kubernetes.io/docs/concepts/containers/images#updating-images serviceAccountName string Optional The Kubernetes Service Account to use for running MinIO KES pods created as part of the Tenant. kesSecret LocalObjectReference Required Specify a Kubernetes opaque secret which contains environment variables to use for setting up the MinIO KES service. See the MinIO Operator console-secret.yaml for an example. externalCertSecret LocalCertificateReference Optional Enables TLS with SNI support on each MinIO KES pod in the tenant. If externalCertSecret is omitted and spec.requestAutoCert is set to false, MinIO KES pods deploy without TLS enabled. Specify a Kubernetes TLS secret. The MinIO Operator copies the specified certificate to every MinIO pod in the tenant. When the MinIO pod/service responds to a TLS connection request, it uses SNI to select the certificate with matching subjectAlternativeName. Specify an object containing the following fields: - name - The name of the Kubernetes secret containing the TLS certificate. - type - Specify kubernetes.io/tls See the MinIO Operator CRD reference for examples and more complete documentation on configuring TLS for MinIO Tenants. clientCertSecret LocalCertificateReference Optional Specify a a Kubernetes TLS secret containing a custom root Certificate Authority and x.509 certificate to use for performing mTLS authentication with an external Key Management Service, such as Hashicorp Vault. Specify an object containing the following fields: - name - The name of the Kubernetes secret containing the Certificate Authority and x.509 Certificate. - type - Specify kubernetes.io/tls gcpCredentialSecretName string Optional Specify the GCP default credentials to be used for KES to authenticate to GCP key store gcpWorkloadIdentityPool string Optional Specify the name of the workload identity pool (This is required for generating service account token) annotations object (keys:string, values:string) Optional If provided, use these annotations for KES Object Meta annotations labels object (keys:string, values:string) Optional If provided, use these labels for KES Object Meta labels resources ResourceRequirements Optional Object specification for specifying CPU and memory resource allocations or limits in the MinIO tenant. nodeSelector object (keys:string, values:string) Optional The filter for the Operator to apply when selecting which nodes on which to deploy MinIO KES pods. The Operator only selects those nodes whose labels match the specified selector. See the Kubernetes documentation on Assigning Pods to Nodes for more information. tolerations Toleration array Optional Specify one or more Kubernetes tolerations to apply to MinIO KES pods. affinity Affinity Optional Specify node affinity, pod affinity, and pod anti-affinity for the KES pods. topologySpreadConstraints TopologySpreadConstraint array Optional Specify one or more Kubernetes Topology Spread Constraints to apply to pods deployed in the MinIO pool. keyName string Optional If provided, use this as the name of the key that KES creates on the KMS backend securityContext PodSecurityContext Specify the Security Context of MinIO KES pods. The Operator supports only the following pod security fields: fsGroup fsGroupChangePolicy runAsGroup runAsNonRoot runAsUser seLinuxOptions containerSecurityContext SecurityContext Specify the Security Context of MinIO KES pods. env EnvVar array Optional If provided, the MinIO Operator adds the specified environment variables when deploying the KES resource. LocalCertificateReference LocalCertificateReference (externalCertSecret, externalCaCertSecret,clientCertSecret) contains a Kubernetes secret containing TLS certificates or Certificate Authority files for use with enabling TLS in the MinIO Tenant. KESConfig TenantSpec Field Description name string Required The name of the Kubernetes secret containing the TLS certificate or Certificate Authority file. type string Required The type of Kubernetes secret. Specify kubernetes.io/tls Logging Logging describes Logging for MinIO tenants. TenantSpec Field Description json boolean anonymous boolean quiet boolean Pool Pool (pools) defines a MinIO server pool on a Tenant. Each pool consists of a set of MinIO server pods which “pool” their storage resources for supporting object storage and retrieval requests. Each server pool is independent of all others and supports horizontal scaling of available storage resources in the MinIO Tenant. See the MinIO Operator CRD reference for the pools object for examples and more complete documentation. TenantSpec Field Description name string Required Specify the name of the pool. The Operator automatically generates the pool name if this field is omitted. servers integer Required The number of MinIO server pods to deploy in the pool. The minimum value is 2. The MinIO Operator requires a minimum of 4 volumes per pool. Specifically, the result of pools.servers X pools.volumesPerServer must be greater than 4. volumesPerServer integer Required The number of Persistent Volume Claims to generate for each MinIO server pod in the pool. The MinIO Operator requires a minimum of 4 volumes per pool. Specifically, the result of pools.servers X pools.volumesPerServer must be greater than 4. volumeClaimTemplate PersistentVolumeClaim Required Specify the configuration options for the MinIO Operator to use when generating Persistent Volume Claims for the MinIO tenant. resources ResourceRequirements Optional Object specification for specifying CPU and memory resource allocations or limits in the MinIO tenant. nodeSelector object (keys:string, values:string) Optional The filter for the Operator to apply when selecting which nodes on which to deploy pods in the pool. The Operator only selects those nodes whose labels match the specified selector. See the Kubernetes documentation on Assigning Pods to Nodes for more information. affinity Affinity Optional Specify node affinity, pod affinity, and pod anti-affinity for pods in the MinIO pool. tolerations Toleration array Optional Specify one or more Kubernetes tolerations to apply to pods deployed in the MinIO pool. topologySpreadConstraints TopologySpreadConstraint array Optional Specify one or more Kubernetes Topology Spread Constraints to apply to pods deployed in the MinIO pool. securityContext PodSecurityContext Optional Specify the Security Context of pods in the pool. The Operator supports only the following pod security fields: fsGroup fsGroupChangePolicy runAsGroup runAsNonRoot runAsUser containerSecurityContext SecurityContext Specify the Security Context of containers in the pool. The Operator supports only the following container security fields: runAsGroup runAsNonRoot runAsUser annotations object (keys:string, values:string) Optional Specify custom labels and annotations to append to the Pool. Optional If provided, use these annotations for the Pool Objects Meta annotations (Statefulset and Pod template) labels object (keys:string, values:string) Optional If provided, use these labels for the Pool Objects Meta annotations (Statefulset and Pod template) runtimeClassName string Optional If provided, each pod on the Statefulset will run with the specified RuntimeClassName, for more info https://kubernetes.io/docs/concepts/containers/runtime-class/ PoolState (string) PoolState represents the state of a pool PoolStatus PoolStatus PoolStatus keeps track of all the pools and their current state TenantStatus Field Description ssName string state PoolState legacySecurityContext boolean LegacySecurityContext stands for Legacy SecurityContext. It represents that these pool was created before v4.2.3 when we introduced the default securityContext as non-root, thus we should keep running this Pool without a Security Context PoolsMetadata PoolsMetadata (poolsMetadata) defines custom labels and annotations for the MinIO pool stateful sets / pods. TenantSpec Field Description labels object (keys:string, values:string) Optional If provided, append these labels to the MinIO statefulset / pods annotations object (keys:string, values:string) Optional If provided, append these annotations to the MinIO statefulset / pods ServiceMetadata ServiceMetadata (serviceMetadata) defines custom labels and annotations for the MinIO Object Storage service and/or MinIO Console service. TenantSpec Field Description minioServiceLabels object (keys:string, values:string) Optional If provided, append these labels to the MinIO service minioServiceAnnotations object (keys:string, values:string) Optional If provided, append these annotations to the MinIO service consoleServiceLabels object (keys:string, values:string) Optional If provided, append these labels to the Console service consoleServiceAnnotations object ("
