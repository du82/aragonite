title = "Security Token Service (STS) — MinIO Object Storage for Linux"
full_description = "Close Doc Navigation MinIO Object Storage for Linux Install and Deploy MinIO Manage Existing MinIO Deployments Core Operational Concepts Monitoring and Alerts External Identity Management Data Encryption (SSE) Network Encryption (TLS) Deployment Checklists Recover after Hardware Failure Troubleshooting MinIO Console Object Management Monitoring Bucket and Object Events Identity and Access Management Server-Side Encryption of Objects Bucket Replication Batch Framework Core Administration Concepts Software Development Kits (SDK) Security Token Service (STS) AssumeRoleWithCustomToken AssumeRoleWithLDAPIdentity AssumeRoleWithWebIdentity Transforms with Object Lambda File Transfer Protocol (FTP/SFTP) MinIO Client MinIO Admin Client Deprecated Commands MinIO Server S3 API Compatibility Integrations Glossary TOC Menu Search Security Token Service (STS) Table of Contents STS API Endpoints The MinIO Security Token Service (STS) APIs allow applications to generate temporary credentials for accessing the MinIO deployment. The STS API is required for MinIO deployments configured to use external identity managers, as the API allows conversion of the external IDP credentials into AWS Signature v4-compatible credentials. STS API Endpoints MinIO supports the following STS API endpoints: Endpoint Supported IDP Description AssumeRoleWithWebIdentity OpenID Connect Generates an access key and secret key using the JWT token returned by the OIDC provider AssumeRoleWithLDAPIdentity Active Directory / LDAP Generates an access key and secret key using the AD/LDAP credentials specified to the API endpoint. AssumeRoleWithCustomToken MinIO Identity Plugin Generates a token for use with an external identity provider and the MinIO Identity Plugin. This work is licensed under a Creative Commons Attribution 4.0 International License. 2020-Present, MinIO, Inc."
