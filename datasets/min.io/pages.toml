title = "Batch Framework — MinIO Object Storage for Kubernetes"
full_description = "Close Doc Navigation MinIO Object Storage for Kubernetes Deploy the MinIO Operator Upgrade MinIO Operator Deploy and Manage MinIO Tenants Core Operational Concepts Monitoring and Alerts External Identity Management Data Encryption (SSE) Network Encryption (TLS) cert-manager Deployment Checklists Recover after Hardware Failure Troubleshooting MinIO Console Object Management Monitoring Bucket and Object Events Identity and Access Management Server-Side Encryption of Objects Bucket Replication Batch Framework Batch Replication Batch Key Rotation Batch Expiration Core Administration Concepts Software Development Kits (SDK) Security Token Service (STS) for MinIO Operator Object Lambda File Transfer Protocol (FTP/SFTP) MinIO Client MinIO Admin Client S3 API Compatibility Integrations MinIO Custom Resource Definition Operator Helm Charts Tenant Helm Charts MinIO Operator Environment Variables Glossary TOC Menu Search Batch Framework Table of Contents Overview MinIO Batch CLI Access to mc batch Local Deployment Overview The MinIO Batch Framework allows you to create, manage, monitor, and execute jobs using a YAML-formatted job definition file (a “batch file”). The batch jobs run directly on the MinIO deployment to take advantage of the server-side processing power without constraints of the local machine where you run the MinIO Client. A batch file defines one job task. Once started, MinIO starts processing the job. Time to completion depends on the resources available to the deployment. If any portion of the job fails, MinIO retries the job up to the number of times defined in the job definition. The MinIO Batch Framework supports the following job types: Job Type Description replicate Perform a one-time replication procedure from one MinIO location to another MinIO location. keyrotate Perform a one-time process to cycle the sse-s3 or sse-kms cryptographic keys on objects. expire Perform a one-time immediate expiration of objects in a bucket. MinIO Batch CLI Install the MinIO Client Define an alias for the MinIO deployment The mc batch commands include mc batch generate The mc batch generate command creates a basic YAML-formatted template file for the specified job type. mc batch start The mc batch start command launches a batch job from a job batch YAML file. mc batch list The mc batch list command outputs a list of the batch jobs currently in progress on a deployment. mc batch status The mc batch status command outputs summaries of job events on a MinIO server. Changed in version mc: RELEASE.2024-07-03T20-17-25Z Batch status displays summaries for active, in-progress jobs or any batch job completed in the previous three (3) days. mc batch describe The mc batch describe command outputs the job definition for a specified job ID. mc batch cancel The mc batch cancel stops an ongoing batch job. Access to mc batch Each batch job executes using the credentials specified in the batch definition. The success of a given batch job depends on those credentials having the appropriate permissions to perform all requested actions. The user executing the batch job must have the following permissions. You can alternatively restrict users from accessing these functions by blocking or limiting access to these actions: admin:ListBatchJobsGrants the user the ability to see batch jobs currently in process. admin:DescribeBatchJobsGrants the user the ability to see the definition details of batch job currently in process. admin:StartBatchJobGrants the user the ability to start a batch job. The job may be further restricted by the credentials the job uses to access either the source or target deployments. admin:CancelBatchJobAllows the user to stop a batch job currently in progress. You can assign any of these actions to users independently or in any combination. The built-in ConsoleAdmin policy includes sufficient access to perform all of these types of batch job actions. Local Deployment You run a batch job against a particular deployment by passing an alias to the mc batch command. The deployment you specify in the command becomes the local deployment within the context of that batch job. This work is licensed under a Creative Commons Attribution 4.0 International License. 2020-Present, MinIO, Inc."
year_published = 2025
