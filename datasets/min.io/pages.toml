["https://min.io/docs/minio/linux/administration/monitoring/publish-events-to-elasticsearch.html"]
title = "Publish Events to Elasticsearch — MinIO Object Storage for Linux"
full_description = 'Close Doc Navigation MinIO Object Storage for Linux Install and Deploy MinIO Manage Existing MinIO Deployments Core Operational Concepts Monitoring and Alerts External Identity Management Data Encryption (SSE) Network Encryption (TLS) Deployment Checklists Recover after Hardware Failure Troubleshooting MinIO Console Object Management Monitoring Bucket and Object Events Bucket notifications Publish Events to AMQP (RabbitMQ) Publish Events to MQTT Publish Events to NATS Publish Events to NSQ Publish Events to Elasticsearch Publish Events to Kafka Publish Events to MySQL Publish Events to PostgreSQL Publish Events to Redis Publish Events to Webhook Identity and Access Management Server-Side Encryption of Objects Bucket Replication Batch Framework Core Administration Concepts Software Development Kits (SDK) Security Token Service (STS) Transforms with Object Lambda File Transfer Protocol (FTP/SFTP) MinIO Client MinIO Admin Client Deprecated Commands MinIO Server S3 API Compatibility Integrations Glossary TOC Menu Search Publish Events to Elasticsearch Table of Contents Add a Elasticsearch Endpoint to a MinIO Deployment Update an Elasticsearch Endpoint in a MinIO Deployment MinIO supports publishing bucket notification events to an Elasticsearch service endpoint. MinIO relies on the https://github.com/elastic/go-elasticsearch v7 project for Elastic connectivity. Add a Elasticsearch Endpoint to a MinIO Deployment The following procedure adds a new Elasticsearch service endpoint for supporting bucket notifications in a MinIO deployment. Prerequisites Elasticsearch v7.0 and later MinIO relies on the https://github.com/olivere/elastic v7 project for Elastic connectivity. The elastic/v7 library specifically targets Elasticsearch v7.0 and is not compatible with earlier Elasticsearch versions. MinIO mc Command Line Tool This procedure uses the mc command line tool for certain actions. See the mc Quickstart for installation instructions. 1) Add the Elasticsearch Endpoint to MinIO You can configure a new Elasticsearch service endpoint using either environment variables or by setting runtime configuration settings. Environment Variables MinIO supports specifying the Elasticsearch service endpoint and associated configuration settings using environment variables. The minio server process applies the specified settings on its next startup. The following example code sets all environment variables related to configuring an Elasticsearch service endpoint. The minimum required variables are: MINIO_NOTIFY_ELASTICSEARCH_ENABLE MINIO_NOTIFY_ELASTICSEARCH_URL MINIO_NOTIFY_ELASTICSEARCH_INDEX MINIO_NOTIFY_ELASTICSEARCH_FORMAT export MINIO_NOTIFY_ELASTICSEARCH_ENABLE_<IDENTIFIER>="on" export MINIO_NOTIFY_ELASTICSEARCH_URL_<IDENTIFIER>="<ENDPOINT>" export MINIO_NOTIFY_ELASTICSEARCH_INDEX_<IDENTIFIER>="<string>" export MINIO_NOTIFY_ELASTICSEARCH_FORMAT_<IDENTIFIER>="<string>" export MINIO_NOTIFY_ELASTICSEARCH_USERNAME_<IDENTIFIER>="<string>" export MINIO_NOTIFY_ELASTICSEARCH_PASSWORD_<IDENTIFIER>="<string>" export MINIO_NOTIFY_ELASTICSEARCH_QUEUE_DIR_<IDENTIFIER>="<string>" export MINIO_NOTIFY_ELASTICSEARCH_QUEUE_LIMIT_<IDENTIFIER>="<string>" export MINIO_NOTIFY_ELASTICSEARCH_COMMENT_<IDENTIFIER>="<string>" Replace <IDENTIFIER> with a unique descriptive string for the TARGET service endpoint. Use the same <IDENTIFIER> value for all environment variables related to the new target service endpoint. The following examples assume an identifier of PRIMARY. If the specified <IDENTIFIER> matches an existing Elasticsearch service endpoint on the MinIO deployment, the new settings override any existing settings for that endpoint. Use mc admin config get notify_elasticsearch to review the currently configured Elasticsearch endpoints on the MinIO deployment. Replace <ENDPOINT> with the URL of the Elasticsearch service endpoint. For example: See Elasticsearch Service for Bucket Notifications for complete documentation on each environment variable. Configuration Settings MinIO supports adding or updating Elasticsearch endpoints on a running minio server process using the mc admin config set command and the notify_elasticsearch configuration key. You must restart the minio server process to apply any new or updated configuration settings. The following example code sets all settings related to configuring an Elasticsearch service endpoint. The minimum required settings are: url index format mc admin config set ALIAS/ notify_elasticsearch:IDENTIFIER \ url="ENDPOINT" \ index="<string>" \ format="<string>" \ username="<string>" \ password="<string>" \ queue_dir="<string>" \ queue_limit="<string>" \ comment="<string>" Replace IDENTIFIER with a unique descriptive string for the Elasticsearch service endpoint. The following examples in this procedure assume an identifier of PRIMARY. If the specified IDENTIFIER matches an existing Elasticsearch service endpoint on the MinIO deployment, the new settings override any existing settings for that endpoint. Use mc admin config get notify_elasticsearch to review the currently configured Elasticsearch endpoints on the MinIO deployment. Replace ENDPOINT with the URL of the Elasticsearch service endpoint. For example: https://user:password@hostname:port See Elasticsearch Bucket Notification Configuration Settings for complete documentation on each setting. 1) Restart the MinIO Deployment You must restart the MinIO deployment to apply the configuration changes. Use the mc admin service restart command to restart the deployment. mc admin service restart ALIAS Replace ALIAS with the alias of the deployment to restart. The minio server process prints a line on startup for each configured Elasticsearch target similar to the following: SQS ARNs: arn:minio:sqs::primary:elasticsearch You must specify the ARN resource when configuring bucket notifications with the associated Elasticsearch deployment as a target. Identifying the ARN for your bucket notifications You defined the <IDENTIFIER> to assign to the target ARN for your bucket notifications when creating the endpoint previously. The steps below return the ARNs configured on the deployment. Identify the ARN created previously by looking for the <IDENTIFIER> you specified. Review the JSON output Copy and run the following command, replacing ALIAS with the alias of the deployment. mc admin info --json ALIAS In the JSON output, look for the key info.sqsARN. The ARN you need is the value of that key that matches the <IDENTIFIER> you specified. For example, arn:minio:sqs::primary:elasticsearch. Use jq to parse the JSON for the value Install jq Copy and run the following command, replacing ALIAS with the alias of the deployment. mc admin info --json ALIAS | jq .info.sqsARN This returns the ARN to use for notifications, such as arn:minio:sqs::primary:elasticsearch 3) Configure Bucket Notifications using the Elasticsearch Endpoint as a Target Use the mc event add command to add a new bucket notification event with the configured Elasticsearch service as a target: mc event add ALIAS/BUCKET arn:minio:sqs::primary:elasticsearch \ --event EVENTS Replace ALIAS with the alias of a MinIO deployment. Replace BUCKET with the name of the bucket in which to configure the event. Replace EVENTS with a comma-separated list of events for which MinIO triggers notifications. Use mc event ls to view all configured bucket events for a given notification target: mc event ls ALIAS/BUCKET arn:minio:sqs::primary:elasticsearch 4) Validate the Configured Events Perform an action on the bucket for which you configured the new event and check the Elasticsearch service for the notification data. The action required depends on which events were specified when configuring the bucket notification. For example, if the bucket notification configuration includes the s3:ObjectCreated:Put event, you can use the mc cp command to create a new object in the bucket and trigger a notification. mc cp ~/data/new-object.txt ALIAS/BUCKET Update an Elasticsearch Endpoint in a MinIO Deployment The following procedure updates an existing Elasticsearch service endpoint for supporting bucket notifications in a MinIO deployment. Prerequisites Elasticsearch v7.0 and later MinIO relies on the https://github.com/olivere/elastic v7 project for Elastic connectivity. The elastic/v7 library specifically targets Elasticsearch v7.0 and is not compatible with earlier Elasticsearch versions. MinIO mc Command Line Tool This procedure uses the mc command line tool for certain actions. See the mc Quickstart for installation instructions. 1) List Configured Elasticsearch Endpoints In The Deployment Use the mc admin config get command to list the currently configured Elasticsearch service endpoints in the deployment: mc admin config get ALIAS/ notify_elasticsearch Replace ALIAS with the alias of the MinIO deployment. The command output resembles the following: notify_elasticsearch:primary queue_dir="" queue_limit="0" url="https://user:password@hostname:port" format="namespace" index="" notify_elasticsearch:secondary queue_dir="" queue_limit="0" url="https://user:password@hostname:port" format="namespace" index="" The notify_elasticsearch key is the top-level configuration key for an Elasticsearch Notification Settings. The url key specifies the Elasticsearch service endpoint for the given notify_elasticsearch key. The notify_elasticsearch:<IDENTIFIER> suffix describes the unique identifier for that Elasticsearch service endpoint. Note the identifier for the Elasticsearch service endpoint you want to update for the next step. 2) Update the Elasticsearch Endpoint Use the mc admin config set command to set the new configuration for the Elasticsearch service endpoint: mc admin config set ALIAS/ notify_elasticsearch:<IDENTIFIER> \ url="https://user:password@hostname:port" \ index="<string>" \ format="<string>" \ username="<string>" \ password="<string>" \ queue_dir="<string>" \ queue_limit="<string>" \ comment="<string>" The notify_elasticsearch url configuration setting is the minimum required for an Elasticsearch service endpoint. All other configuration settings are optional. See Elasticsearch Notification Settings for a complete list of Elasticsearch configuration settings. 3) Restart the MinIO Deployment You must restart the MinIO deployment to apply the configuration changes. Use the mc admin service restart command to restart the deployment. mc admin service restart ALIAS Replace ALIAS with the alias of the deployment to restart. The minio server process prints a line on startup for each configured Elasticsearch target similar to the following: SQS ARNs: arn:minio:sqs::primary:elasticsearch 4) Validate the Changes Perform an action on a bucket which has an event configuration using the updated Elasticsearch service endpoint and check the Elasticsearch service for the notification data. The action required depends on which events were specified when configuring the bucket notification. For example, if the bucket notification configuration includes the s3:ObjectCreated:Put event, you can use the mc cp command to create a new object in the bucket and trigger a notification. mc cp ~/data/new-object.txt ALIAS/BUCKET This work is licensed under a Creative Commons Attribution 4.0 International License. 2020-Present, MinIO, Inc.'
