full_description = "Close Doc Navigation MinIO Object Storage for Linux Install and Deploy MinIO Manage Existing MinIO Deployments Core Operational Concepts Monitoring and Alerts External Identity Management Data Encryption (SSE) Network Encryption (TLS) Deployment Checklists Recover after Hardware Failure Troubleshooting MinIO Console Object Management Monitoring Bucket and Object Events Identity and Access Management Server-Side Encryption of Objects Bucket Replication Batch Framework Core Administration Concepts Software Development Kits (SDK) Security Token Service (STS) Transforms with Object Lambda File Transfer Protocol (FTP/SFTP) MinIO Client MinIO Admin Client Deprecated Commands MinIO Server S3 API Compatibility Integrations Glossary TOC Menu Search S3 API Compatibility Table of Contents Object APIs Object Locking Unsupported API Object Endpoints Multipart Uploads Bucket APIs Bucket Replication Bucket Lifecycle Bucket Notifications Bucket Policies Unsupported API Bucket Operations MinIO alternatives for unsupported Bucket resources This page documents S3 APIs supported by MinIO Object Storage. For reference documentation on any given API, see the corresponding documentation for Amazon S3. Important MinIO strongly recommends using an S3-Compatible SDK for performing object storage operations. Object APIs CopyObject DeleteObject DeleteObjects DeleteObjectTagging GetObject GetObjectAttributes GetObjectTagging HeadObject ListObjects ListObjectsV2 ListObjectVersions PutObject PutObjectTagging RestoreObject SelectObjectContent Object Locking GetObjectRetention PutObjectRetention GetObjectLegalHold PutObjectLegalHold GetObjectLockConfiguration PutObjectLockConfiguration Unsupported API Object Endpoints GetObjectAcl PutObjectAcl Multipart Uploads AbortMultipartUpload CompleteMultipartUpload CreateMultipartUpload ListMultipartUploads ListParts UploadPart UploadPartCopy Differences from S3 APIs for Multipart Uploads ListMultipartUploads requires the exact object name as a prefix. The AbortIncompleteMultipartUpload lifecycle action is not supported with PutBucketLifecycle. Bucket APIs CreateBucket DeleteBucket DeleteBucketEncryption DeleteBucketTagging GetBucketEncryption GetBucketLocation GetBucketTagging GetBucketVersioning HeadBucket ListBuckets ListDirectoryBuckets PutBucketEncryption PutBucketTagging PutBucketVersioning Bucket Replication GetBucketReplication PutBucketReplication DeleteBucketReplication Bucket Lifecycle GetBucketLifecycle GetBucketLifecycleConfiguration PutBucketLifecycle PutBucketLifecycleConfiguration DeleteBucketLifecycle Bucket Notifications GetBucketNotification GetBucketNotificationConfiguration PutBucketNotification PutBucketNotificationConfiguration Bucket Policies GetBucketPolicy GetBucketPolicyStatus PutBucketPolicy DeleteBucketPolicy Unsupported API Bucket Operations GetBucketInventoryConfiguration PutBucketInventoryConfiguration DeleteBucketInventoryConfiguration PutBucketCors DeleteBucketCors GetBucketMetricsConfiguration PutBucketMetricsConfiguration DeleteBucketMetricsConfiguration PutBucketWebsite GetBucketLogging PutBucketLogging PutBucketAccelerateConfiguration DeleteBucketAccelerateConfiguration PutBucketRequestPayment DeleteBucketRequestPayment PutBucketAcl HeadBucketAcl GetPublicAccessBlock PutPublicAccessBlock DeletePublicAccessBlock GetBucketOwnershipControls PutBucketOwnershipControls DeleteBucketOwnershipControls GetBucketIntelligentTieringConfiguration PutBucketIntelligentTieringConfiguration ListBucketIntelligentTieringConfigurations DeleteBucketIntelligentTieringConfiguration GetBucketAnalyticsConfiguration PutBucketAnalyticsConfiguration ListBucketAnalyticsConfigurations DeleteBucketAnalyticsConfiguration CreateSession MinIO alternatives for unsupported Bucket resources For calls to BucketACL or ObjectACL operations, use Policies. Calls to BucketCORS operations are not needed because CORS is enabled by default on all buckets for all HTTP verbs. For calls to BucketWebsite operations, use caddy or nginx. For calls to BucketAnalytics, BucketMetrics, or BucketLogging operations, use Bucket Notifications. This work is licensed under a Creative Commons Attribution 4.0 International License. 2020-Present, MinIO, Inc."
