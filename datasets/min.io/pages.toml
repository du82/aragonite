["https://min.io/product/multicloud-elastic-kubernetes-service"]
title = "MinIO | MinIO for Amazon Elastic Kubernetes Service"
full_description = '''MinIO is Kubernetes native and high performance it can deliver predictable performance across public, private and edge cloud environments. Running MinIO on EKS provides control over the software stack with the attendant flexibility necessary to avoid cloud lock-in. Amazon Elastic Kubernetes Service (Amazon EKS) is a managed service that you can use to run Kubernetes on AWS without needing to install, operate, and maintain your own Kubernetes control plane or nodes. MinIO provides a portable high-performance object storage system across all of the major Kubernetes platforms (Tanzu, Azure, GCP, OpenShift). On AWS, MinIO natively integrates with the Amazon EKS service making it easier to operate your own large scale multi-tenant object storage as a service. MinIO is a complete drop-in replacement for AWS S3 storage-as-a-service. Unlike AWS S3, MinIO enables applications to scale across multi-cloud and hybrid cloud infrastructure, without requiring expensive software rewrites or proprietary integrations. Because MinIO is containerized and Kubernetes-native it can be rolled out across these platforms without requiring specialized skills to operate large scale storage infrastructure. A key requirement for deploying MinIO at scale on EKS and AWS is the ability to transition objects across AWS storage types. Specifically, you want support for cost-optimized "Hot-Warm" and "Hot-Cold" deployment topologies. MinIO can use a S3 bucket as a remote tier for automatic transition of aged objects based on user-configured rules. For example, you can create one rule that transitions objects to a tier with the S3 Standard storage class, while another rule transitions objects to a tier with the S3 Standard-IA storage class. MinIO supports transitioning an object once - so while you cannot configure "waterfall" or "chain" transition from MinIO -> Standard -> Standard-IA, you can configure multiple rules per bucket using prefix and object tags to apply granular transition behavior to the preferred remote tier. MinIO's only requirement is that the remote storage must support immediate retrieval of objects - no rehydration, latency, or wait times.'''
author = "MinIO, Inc."
year_published = 2025
clearnet = "https://min.io/product/multicloud-elastic-kubernetes-service"
