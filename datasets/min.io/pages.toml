title = "Enterprise Data Privacy Policy & Compliance | MinIO"
description = "Learn about how MinIO handles your Personal Information."
full_description = "Welcome, and thank you for your interest in MinIO, Inc. (“MinIO”, “we,” or “us”). This Privacy Policy (the “Policy”) applies to the Personal Information that we gather from you through our website at https://min.io (the “Site”), in the course of providing our products and services, and via other means described below (collectively, the “Services”). This Policy describes how we use and disclose such information, your rights and choices with respect to your information, and how you can contact us if you have any questions or concerns. We may collect Personal Information about you directly from you and from third parties, as well as automatically through your use of the Services. In this Policy, “Personal Information” means any information relating to an identified or identifiable individual. Where required by applicable law, we indicate whether and why you must provide us with your Personal Information, as well as the consequences of failing to do so. Where required by applicable law, we obtain your consent to use cookies. You can find more information about your rights and choices, and how to opt out of the use of certain cookies in the section Your Rights and Choices below. If you are located in the European Economic Area, we only process your Personal Information when we have a valid “legal basis”, including when: We may disclose information to third parties if you consent to us doing so, as well as in the following circumstances: You may, of course, decline to share certain Personal Information with us, in which case we may not be able to provide to you some of the features and functionality of our Services. If you wish to access, amend, or delete any other Personal Information we hold about you, you may contact us using the contact details at the end of this Policy. Please note that while any changes you make will be reflected in active user databases instantly or within a reasonable period of time, we may retain all information you submit for backups, archiving, prevention of fraud and abuse, analytics, satisfaction of legal obligations, or where we otherwise reasonably believe that we have a legitimate reason to do so, as permitted under applicable data protection law."
