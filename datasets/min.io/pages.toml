title = "MinIO | MinIO Learning Subscription"
full_description = "Grow your career and advance your team with classroom oriented training or self-paced learning options. Everything you need to develop, deploy and support MinIO in production and to prove your skill via the MinIO certification exam. The MinIO Learning Subscription will soon include more than 200 videos covering all aspects of MinIO administration and development, dozens of hands-on labs, access to a MinIO Enterprise trial license, expert support, exam prep resources, and a voucher for the MinIO Certified Administrator exam. MinIO training is developed by product experts with years of production development and administration experience. Each module blends concept and practice through video lecture, demos, guided exercises that prepare the learner for hands-on practice. New content is added monthly to address new features and product enhancements. More than 200 expert videos cover all aspects of development, deployment, and administration, equivalent to 10 days of classroom training. All videos are supported with professionally edited subtitles. The heart of all technical training is hands-on labs. The MinIO Learning Subscription makes it easy for students to set up a lab environment using a set of Docker compose scripts. The lab environment provides students with a turn-key structure to work with all MinIO features. As part of their lab environment, each student will receive an entitlement to download MinIO Enterprise for learning and non-production use. The trial license requires a fresh download every 60 days to ensure the learner has the most current release. MinIO Certification is an excellent way to demonstrate command of the technology. Each subscription includes a voucher the learner can redeem to attempt the MinIO Certified Administrator - Practitioner exam. More details on the certification can be found here: https://min.io/training/certification. Learners have the ability to ask questions directly from within the learning portal. These questions are routed directly to curriculum engineers with a commitment to respond in 1 business day."
