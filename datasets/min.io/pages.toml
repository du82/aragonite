["https://min.io/training/certification"]
title = "MinIO | Certified Administrator - Practitioner Exam"
full_description = '''Grow your career and advance your team with classroom oriented training or self-paced learning options. The MinIO Certified Administrator - Practitioner Exam is designed to validate an individual's practical skills in administrating MinIO. The MinIO Certified Administrator - Practitioner exam validates the essential skills required to deploy, secure, and scale a production MinIO object store. A professional who has earned the MinIO Certified Administrator - Practitioner certification has demonstrated the knowledge and skills to administrate a production MinIO storage cluster at scale. These skills include deployment, object lifecycle management, replication, security, and recovery, among others. Pass the MinIO Certified Administrator - Practitioner exam. Anyone carrying one of our certifications is a MinIO Certified Professional. You can register for the exam here. The exam is $300 per attempt. Please also see this video which explains the exam registration process. A MinIO Certified Professional has proven that they can effectively deploy, manage and maintain the MinIO object store. MinIO certification is the best way to verify that you have the skills to use the MinIO object storage platform. There is no prerequisite for attempting our certification. However, all of the topics in this course are covered in our MinIO Enterprise Administration I: Management, Replication, and Security Essentials (MN116), along with hands-on exercises. Exam attempts do not expire. However, please adhere to the rescheduling process for exams. If you miss your scheduled exam time, you will need to purchase a new exam attempt. Yes, for the first year we are offering a discount of $50 per exam attempt. Be one of the first to be certified! Once you pass the exam, you will receive a certification kit from MinIO that details how you can share your certification on various social media platforms such as LinkedIn. You do not need to memorize the entire documentation library. However, this is a "closed-book" exam, and the documentation will not be available during the exam. You should be comfortable with all of the topics above, and the more common command flags for the mc command line client.'''
