["https://min.io/solutions/modern-data-lakes-lakehouses"]
title = "MinIO | MinIO for Modern Datalakes"
full_description = "Modern datalakes and data lakehouses are built on modern object storage. That means they are built on MinIO. For modern datalakes/lakehouses that can run anywhere: private clouds, public clouds, colos, baremetal - even at the edge. It is fast, scalable, cloud-native and ready to go - all batteries included. The modern datalake is multi-engine and those engines (Spark, Flink, Trino, Arrow, Dask etc) all need to be in some way tied into a cohesive architecture. The modern datalake has to deliver central table storage, portable commute, access control and persistent structure. That is where formats like Iceberg, Hudi and Delta Lake come into play. They are designed for the modern datalake and they are each supported in MinIO. We might have an opinion on which one wins (you can always ask us…) but we are committed to supporting them until it doesn't make sense (see Docker Swarm and Mesosphere). MinIO was born in the cloud and adheres to the principles of the cloud operating model - containerization, orchestration, microservices, APIs, infrastructure as code and automation. Because of this, the cloud native ecosystem “just works” with MinIO - from Spark to Presto/Trino, from Snowflake to Dremio, from Nifi to Kafka, from Prometheus to OpenObserve, Istio to Linkerd and from Hashicorp Vault to Keycloak. MinIO supports every S3-compatible query engine, which is to say all of them. Don't see one you use - drop us a note and we will look into it. The modern datalake demands a level of performance, and more importantly, performance at scale, that Hadoop could only dream of and old school object stores only fantasize about. MinIO has proven in multiple benchmarks that it is materially faster than Hadoop and the migration path is clearly documented. This means better performance for your query engines (Spark, Presto, Trino, Snowflake, Microsoft SQL Server, Teradata and more). This also includes your AI/ML platforms - from MLflow to Kubeflow. We publish our benchmarks for the world to see and make them repeatable. See how we notched 325 GiB/s (349 GB/s) on GETs and 165 GiB/s (177 GB/s) on PUTs with just 32 nodes of off-the-shelf NVMe SSDs in this post."
