title = "Monitoring Bucket and Object Events — MinIO Object Storage for Kubernetes"
full_description = "Close Doc Navigation MinIO Object Storage for Kubernetes Deploy the MinIO Operator Upgrade MinIO Operator Deploy and Manage MinIO Tenants Core Operational Concepts Monitoring and Alerts External Identity Management Data Encryption (SSE) Network Encryption (TLS) cert-manager Deployment Checklists Recover after Hardware Failure Troubleshooting MinIO Console Object Management Monitoring Bucket and Object Events Bucket notifications Identity and Access Management Server-Side Encryption of Objects Bucket Replication Batch Framework Core Administration Concepts Software Development Kits (SDK) Security Token Service (STS) for MinIO Operator Object Lambda File Transfer Protocol (FTP/SFTP) MinIO Client MinIO Admin Client S3 API Compatibility Integrations MinIO Custom Resource Definition Operator Helm Charts Tenant Helm Charts MinIO Operator Environment Variables Glossary TOC Menu Search Monitoring Bucket and Object Events Table of Contents Bucket Notifications Deployment Metrics Server Logs Bucket Notifications MinIO bucket notifications allow administrators to send notifications to supported external services on certain object or bucket events. MinIO supports bucket and object-level S3 events similar to the Amazon S3 Event Notifications. MinIO supports publishing bucket or object events to the following supported targets on certain supported events. Publish Events to AMQP (RabbitMQ) Publish Events to MQTT Publish Events to NATS Publish Events to NSQ Publish Events to Elasticsearch Publish Events to Kafka Publish Events to MySQL Publish Events to PostgreSQL Publish Events to Redis Publish Events to Webhook See Bucket notifications for more complete documentation on MinIO Bucket Notifications. Deployment Metrics MinIO provides a Prometheus-compatible endpoint for supporting time-series querying of metrics. MinIO deployments configured to enable Prometheus scraping provide a detailed metrics view through the MinIO Console. Server Logs MinIO provides the fol