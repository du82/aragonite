["https://min.io/docs/minio/linux/administration/server-side-encryption/server-side-encryption-sse-kms.html"]
title = "Server-Side Encryption with Per-Bucket Keys (SSE-KMS) — MinIO Object Storage for Linux"
full_description = '''Close Doc Navigation MinIO Object Storage for Linux Install and Deploy MinIO Manage Existing MinIO Deployments Core Operational Concepts Monitoring and Alerts External Identity Management Data Encryption (SSE) Network Encryption (TLS) Deployment Checklists Recover after Hardware Failure Troubleshooting MinIO Console Object Management Monitoring Bucket and Object Events Identity and Access Management Server-Side Encryption of Objects Server-Side Encryption with Per-Bucket Keys (SSE-KMS) Server-Side Encryption Per-Deployment Key (SSE-S3) Server-Side Encryption with Client-Managed Keys (SSE-C) Bucket Replication Batch Framework Core Administration Concepts Software Development Kits (SDK) Security Token Service (STS) Transforms with Object Lambda File Transfer Protocol (FTP/SFTP) MinIO Client MinIO Admin Client Deprecated Commands MinIO Server S3 API Compatibility Integrations Glossary TOC Menu Search Server-Side Encryption with Per-Bucket Keys (SSE-KMS) Table of Contents Quickstart Secure Erasure and Locking Encryption Process MinIO Server-Side Encryption (SSE) protects objects as part of write operations, allowing clients to take advantage of server processing power to secure objects at the storage layer (encryption-at-rest). SSE also provides key functionality to regulatory and compliance requirements around secure locking and erasure. MinIO SSE uses the MinIO Key Encryption Service (KES) and a supported external Key Management Service (KMS) for performing secured cryptographic operations at scale. MinIO also supports client-managed key management, where the application takes full responsibility for creating and managing encryption keys for use with MinIO SSE. MinIO SSE-KMS encrypts or decrypts objects using an External Key (EK) managed by a Key Management System (KMS). Each bucket and object can have a separate EK, supporting more granular cryptographic operations in the deployment. MinIO can only decrypt an object if it can access both the KMS and the EK used to encrypt that object. You can enable bucket-default SSE-KMS encryption using the mc encrypt set command: mc encrypt set sse-kms EXTERNALKEY play/mybucket Replace EXTERNALKEY with the name of the EK to use for encrypting objects in the bucket. Replace play/mybucket with the alias and bucket on which you want to enable automatic SSE-KMS encryption. MinIO SSE-KMS is functionally compatible with AWS S3 Server-Side Encryption with KMS keys stored in AWS while expanding support to include the following KMS providers: AWS Secrets Manager Azure Key Vault Entrust KeyControl Fortanix SDKMS Google Cloud Secret Manager HashiCorp Vault Keystore Thales CipherTrust Manager (formerly Gemalto KeySecure) Quickstart Important Enabling SSE on a MinIO deployment automatically encrypts the backend data for that deployment using the default encryption key. MinIO requires access to KES and the external KMS to decrypt the backend and start normally. The KMS must maintain and provide access to the MINIO_KMS_KES_KEY_NAME. You cannot disable KES later or “undo” the SSE configuration at a later point. The following procedure uses the play MinIO KES sandbox for supporting SSE with SSE-KMS in evaluation and early development environments. For extended development or production environments, use one of the following supported external Key Management Services (KMS): AWS Secrets Manager Azure Key Vault Entrust KeyControl Fortanix SDKMS Google Cloud Secret Manager HashiCorp Vault Keystore Thales CipherTrust Manager (formerly Gemalto KeySecure) Important The MinIO KES Play sandbox is public and grants root access to all created External Keys (EK). Any EK stored on the Play sandbox may be accessed or destroyed at any time, rendering protected data vulnerable or permanently unreadable. Never use the Play sandbox to protect data you cannot afford to lose or reveal. Never generate EK using names that reveal private, confidential, or internal naming conventions for your organization. Never use the Play sandbox for production environments. This procedure requires the following components: Install mc on a machine with network access to the source deployment. See the mc Installation Quickstart for instructions on downloading and installing mc. Install MinIO Key Encryption Service (KES) on a machine with internet access. See the kes Getting Started guide for instructions on downloading, installing, and configuring KES. 1) Create an Encryption Key for SSE-KMS Encryption Use the kes command line tool to create a new External Key (EK) for use with SSE-KMS Encryption. The following command retrieves the root identity for the play KES server: curl -sSL --tlsv1.2 \ -O 'https://raw.githubusercontent.com/minio/kes/master/root.key' \ -O 'https://raw.githubusercontent.com/minio/kes/master/root.cert' Set the following environment variables in the terminal or shell: export KES_CLIENT_KEY=root.key export KES_CLIENT_CERT=root.cert KES_CLIENT_KEY The private key for an identity on the KES server. The identity must grant access to at minimum the /v1/create, /v1/generate, and /v1/list API endpoints. This step uses the root identity for the MinIO play KES sandbox, which provides access to all operations on the KES server. KES_CLIENT_CERT The corresponding certificate for the identity on the KES server. This step uses the root identity for the MinIO play KES sandbox, which provides access to all operations on the KES server. The following command creates a new EK through KES. kes key create my-minio-sse-kms-key This tutorial uses the example my-minio-sse-kms-key name for ease of reference. Specify a unique key name to prevent collision with existing keys. 2) Configure MinIO for SSE-KMS Object Encryption Specify the following environment variables in the shell or terminal on each MinIO server host in the deployment: export MINIO_KMS_KES_ENDPOINT=https://play.min.io:7373 export MINIO_KMS_KES_API_KEY=<API-key-identity-string-from-KES> # Replace with the key string for your credentials export MINIO_KMS_KES_KEY_NAME=my-minio-sse-s3-key Note An API key is the preferred way to authenticate with the KES server, as it provides a streamlined and secure authentication process to the KES server. Alternatively, specify the MINIO_KMS_KES_KEY_FILE and MINIO_KMS_KES_CERT_FILE instead of MINIO_KMS_KES_API_KEY. API keys are mutually exclusive with certificate-based authentication. Specify either the API key variable or the Key File and Cert File variables. The documentation on this site uses API keys. MINIO_KMS_KES_ENDPOINT The endpoint for the MinIO Play KES service. MINIO_KMS_KES_API_KEY The API key generated by KES for the MinIO deployment. The identity of the API key must grant permission to create, generate, and decrypt keys. The API key is the preferred way to authenticate with the KES server. If circumstances require it, specify the MINIO_KMS_KES_KEY_FILE and MINIO_KMS_KES_CERT_FILE instead. Specify either the API key or the Key File and Cert File. Do not populate all three environment variables. MINIO_KMS_KES_KEY_NAME The name of the External Key (EK) to use for performing SSE encryption operations. KES retrieves the EK from the configured Key Management Service (KMS). Specify the name of the key created in the previous step. 3) Restart the MinIO Deployment to Enable SSE-KMS You must restart the MinIO deployment to apply the configuration changes. Use the mc admin service restart command to restart the deployment. mc admin service restart ALIAS Replace ALIAS with the alias of the deployment to restart. 4) Configure Automatic Bucket Encryption Use the mc encrypt set command to enable automatic SSE-KMS protection of all objects written to a specific bucket. mc encrypt set sse-kms my-minio-sse-kms-key ALIAS/BUCKET Replace ALIAS with the alias of the MinIO deployment on which you enabled SSE-KMS. Replace BUCKET with the full path to the bucket or bucket prefix on which you want to enable automatic SSE-KMS. Objects written to the specified bucket are automatically encrypted using the specified EK. Repeat this step for each bucket on which you want to enable automatic SSE-KMS encryption. You can generate additional keys per bucket or bucket prefix, such that the scope of each EK is limited to a subset of objects. Secure Erasure and Locking SSE-KMS protects objects using an EK specified either as part of the bucket automatic encryption settings or as part of the write operation. MinIO therefore requires access to that EK for decrypting that object. Disabling the EK temporarily locks objects encrypted with that EK by rendering them unreadable. You can later enable the EK to resume normal read operations on those objects. Deleting the EK renders all objects encrypted by that EK permanently unreadable. If the KMS does not have or support backups of the EK, this process is irreversible. The scope of a single EK depends on: Which buckets specified that EK for automatic SSE-KMS encryption, and Which write operations specified that EK when requesting SSE-KMS encryption. For example, consider a MinIO deployment using one EK per bucket. Disabling a single EK renders all objects in the associated bucket unreadable without affecting other buckets. If the deployment instead used one EK for all objects and buckets, disabling that EK renders all objects in the deployment unreadable. Encryption Process Note This section describes MinIO internal logic and functionality. This information is purely educational and is not a prerequisite for configuring or implementing any MinIO feature. SSE-KMS uses an External Key (EK) managed by the configured Key Management System (KMS) for performing cryptographic operations and protecting objects. The table below describes each stage of the encryption process: Stage Description SSE-Enabled Write Operation MinIO receives a write operation requesting SSE-KMS encryption. The write operation must have an associated External Key (EK) to use for encrypting the object. For write operations in buckets with automatic SSE-KMS enabled, MinIO uses the bucket EK. If the write operation includes an explicit EK, MinIO uses that instead of the bucket EK. For write operations in buckets without automatic SSE-KMS enabled, MinIO uses the EK specified to the write operation. Generate the Data Encryption Key (DEK) MinIO generates a Data Encryption Key (DEK) using the EK. Specifically, MinIO Key Encryption Service (KES) requests a new cryptographic key from the KMS using the EK as the “root” key. KES returns both the plain-text and an EK-encrypted representation of the DEK. MinIO stores the encrypted representation as part of the object metadata. Generate the Key Encryption Key (KEK) MinIO uses a deterministic algorithm to generate a 256-bit unique Key Encryption Key (KEK). The key-derivation algorithm uses a pseudo-random function that takes the plain-text DEK, a randomly generated initialization vector, and a context consisting of values like the bucket and object name. MinIO generates the KEK at the time of each cryptographic encryption or decryption operation and never stores the KEK to a drive. Generate the Object Encryption Key (OEK) MinIO generates a random 256-bit unique Object Encryption Key (OEK) and uses that key to encrypt the object. MinIO never stores the plaintext representation of the OEK on a drive. The plaintext OEK resides in RAM during cryptographic operations. Encrypt the Object MinIO uses the OEK to encrypt the object prior to storing the object to the drive. MinIO then encrypts the OEK with the KEK. MinIO stores the encrypted representation of the OEK and DEK as part of the metadata. For read operations, MinIO decrypts the object by retrieving the EK to decrypt the DEK. MinIO then regenerates the KEK, decrypts the OEK, and decrypts the object. This work is licensed under a Creative Commons Attribution 4.0 International License. 2020-Present, MinIO, Inc.'''
