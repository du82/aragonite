["https://miniflux.app/docs/binary_installation.html"]
title = "Manual Binary Installation"
description = "Instructions to install Miniflux binary manually"
full_description = "Manual Binary InstallationHome > DocumentationThis document describes how to install the Miniflux binary on your Linux server.Make sure to install and configure PostgreSQL before installing Miniflux.You can download precompiled binaries from the GitHub Releases page. You could also build the application from the source code.Copy the precompiled binary somewhere on your server, for example in /usr/local/binMake the file executable: chmod +x minifluxDefine the environment variable DATABASE_URL if necessaryRun the SQL migrations: miniflux -migrateCreate an admin user: miniflux -create-adminStart the application: minifluxIt's recommended to configure a process manager like systemd or supervisord to supervise the Miniflux daemon.Make sure to take a look a the list of configuration parameters to customize your installation."
year_published = 2025
