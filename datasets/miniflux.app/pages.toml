["https://miniflux.app/features.html"]
title = "Features"
description = "List of Features"
full_description = 'Reader ¶Supported feed formats: Atom 0.3/1.0, RSS 1.0/2.0, RDF, and JSON.OPML file import/export and URL import.Supports multiple enclosures/attachments (Podcasts, videos, music, and images).Plays videos from YouTube channels directly inside Miniflux.Categories and bookmarks.Fetches website icons (favicons).Saves articles to third-party services.Provides full-text search (Thanks to Postgres).Available in Portuguese (Brazilian), Chinese (Simplified and Traditional), Dutch, English (US), Finnish, French, German, Greek, Hindi, Indonesian, Italian, Japanese, Polish, Russian, Taiwanese POJ, Ukrainian, Spanish, and Turkish.Privacy ¶Remove pixel trackersFetch original links when the feed is coming from FeedBurnerOpen external links with the attributes rel="noopener noreferrer" referrerpolicy="no-referrer"Use the HTTP header Referrer-Policy: no-referrerImage proxy to avoid mixed content warnings with HTTPSPlay Youtube videos by using the domain youtube-nocookie.comSupports alternative YouTube video players like InvidiousBlock external Javascript code to avoid trackingContent Manipulation ¶Fetch original article and returns only relevant contents (Readability parser)Custom scraper rules based on CSS selectorsCustom rewriting rulesRegex filter to allow or block articlesOverride default user agent to bypass websites restrictionsOption to allow self-signed or invalid certificates (disabled by default)Scrape YouTube’s website to get video duration as read time (disabled by default)User Interface ¶Stylesheet optimized for readabilityResponsive design (works on desktop, tablet, and mobile devices)No fancy user interfaceDoesn’t require to download an application from Apple/Google StoreYou could add Miniflux to the home screenKeyboard shortcutsTouch events on mobile devicesThemes:Light (Sans-Serif)Light (Serif)Dark (Sans-Serif)Dark (Serif)System (Sans-Serif) - Switch between Dark and Light themes according to system preferencesSystem (Serif)Integration ¶25+ integrations with third-party services: Apprise, Betula, Cubox, Discord, Espial, Instapaper, LinkAce, Linkding, LinkWarden, Matrix, Notion, Ntfy, Nunux Keeper, Pinboard, Pocket, Pushover, RainDrop, Readeck, Readwise Reader, RssBridge, Shaarli, Shiori, Slack, Telegram, Wallabag, etc.Bookmarklet to subscribe to a website directly from any web browserWebhooksUse existing mobile applications to read your feeds by using the Fever or Google Reader APIREST API with clients written in Go and PythonAuthentication ¶Username/passwordGoogle (OAuth2)OpenID ConnectTechnical Stuff ¶Self-hostedWritten in Go (Golang)Compatible only with PostgresqlThere is no dependency, only a static binaryAll static files are bundled into the application binary using Golang embed packageSupports Systemd sd_notify protocolAutomatic HTTPS configuration with Let’s EncryptUse your own SSL certificateSupports HTTP/2 if TLS is configuredFeeds are updated in the background by an internal schedulerExternal content is sanitized before being displayedUses a Content Security Policy that allows only application Javascript and block inline code and stylesSupport native lazy loading for images and iframesWorks only in modern browsersFollows the Twelve-Factor App principleOfficial Debian/RPM packages and pre-built binariesDocker image is published automatically to Docker Hub and GitHub Registry (supports ARM architectures)'
