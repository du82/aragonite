["https://miniflux.app/docs/rules.html"]
title = "Filter, Rewrite and Scraper Rules"
description = "How to write custom scraper and rewrite rules"
full_description = '''Filter, Rewrite and Scraper RulesHome > DocumentationFeed Filtering RulesGlobal Filtering RulesRewrite RulesScraper RulesURL Rewrite RulesFeed Filtering Rules ¶Miniflux has a basic filtering system that allows you to ignore or keep articles.Block RulesBlock rules ignore articles with a title, an entry URL, a tag or an author that match the regex (RE2 syntax).For example, the regex (?i)miniflux will ignore all articles with a title that contains the word Miniflux (case insensitive).Ignored articles won’t be saved into the database.Keep RulesKeep rules keep only articles that match the regex (RE2 syntax).For example, the regex (?i)miniflux will keep only the articles with a title that contains the word Miniflux (case insensitive).Global Filtering Rules ¶Global filters are defined on the Settings page and are automatically applied to all articles from all feeds.Each rule must be on a separate line.Duplicate rules are allowed. For example, having multiple EntryTitle rules is possible.The provided RegEx should use the RE2 syntax.The order of the rules matters as the processor stops on the first match for both Block and Keep rules.Rule Format:FieldName=RegEx FieldName=RegEx FieldName=RegEx Available Fields:EntryTitleEntryURLEntryCommentsURLEntryContentEntryAuthorEntryTagEntryDateDate PatternsThe EntryDate field supports the following date patterns:future - Match entries with future publication datesbefore:YYYY-MM-DD - Match entries published before a specific dateafter:YYYY-MM-DD - Match entries published after a specific datebetween:YYYY-MM-DD,YYYY-MM-DD - Match entries published between two datesDate format must be YYYY-MM-DD, for example: 2024-01-01Block RulesBlock rules ignores articles that match a single rule.For example, the rule EntryTitle=(?i)miniflux will ignore all articles with a title that contains the word Miniflux (case insensitive).For example:EntryDate=future will ignore articles with future publication datesEntryDate=before:2024-01-01 will ignore articles published before January 1st, 2024Keep RulesKeep rules will keep articles that match a single rule.For example, the rule EntryTitle=(?i)miniflux will keep only the articles with a title that contains the word Miniflux (case insensitive).For example:EntryDate=between:2024-01-01,2024-12-31 will keep only articles published in 2024EntryDate=after:2024-03-01 will keep only articles published after March 1st, 2024Global Rules & Feed Rules OrderingRules are processed in this order:Global Block RulesFeed Block RuleGlobal Keep RulesFeed Keep RuleRewrite Rules ¶To improve the reading experience, it’s possible to alter the content of feed items.For example, if you are reading a popular comic website like XKCD, it’s nice to have the image title (the alt attribute) added under the image. Especially on mobile devices where there is no hover event.add_dynamic_imageTries to add the highest quality images from sites that use JavaScript to load images (e.g. either lazily when scrolling or based on screen size).add_dynamic_iframeTries to add embedded videos from sites that use JavaScript to load iframes (e.g. either lazily when scrolling or after the rest of the page is loaded).add_image_titleAdd each image's title as a caption under the image.add_youtube_videoInsert Youtube video to the article (automatic for Youtube.com).add_youtube_video_from_idInsert Youtube video to the article based on the video ID.add_invidious_videoInsert Invidious player to the article (automatic for https://invidio.us).add_youtube_video_using_invidious_playerInsert Invidious player to the article for Youtube feeds.add_castopod_episodeInsert Castopod episode player.add_mailto_subjectInsert mailto links subject into the article.base64_decodeThis rewrite rule decode base64 content. It can be used with a selector: base64_decode(".base64"), but can also be used without argument: base64_decode. In this case it'll try to convert all TextNodes and always fallback to original text if it can decode.nl2brConvert new lines \n to <br> (useful for non-HTML contents).convert_text_linksConvert text link to HTML links (useful for non-HTML contents).fix_medium_imagesAttempt to fix Medium's images rendered in Javascript.use_noscript_figure_imagesUse <noscript> content for images rendered with Javascript.replace("search term"|"replace term")Search and replace text.remove(".selector, #another_selector")Remove DOM elements.parse_markdown (Removed in v2.2.4)Convert Markdown to HTML. This rule has been removed in version 2.2.4.remove_tablesRemove any tables while keeping the content inside (useful for email newsletters).remove_clickbaitRemove clickbait titles (Convert uppercase titles).replace_title("search-term"|"replace-term")Rewrite rule to adjust entry titles.add_hn_links_using_hackOpen HN comments with Hack.add_hn_links_using_openerOpen HN comments with Opener.fix_ghost_cardsConvert Ghost link cards to regular links.Miniflux includes a set of predefined rules for some websites, but you could define your own rules.On the feed edit page, enter your custom rules in the field “Rewrite Rules” like this:rule1,rule2 Separate each rule by a comma.Scraper Rules ¶When an article contains only an extract of the content, you could fetch the original web page and apply a set of rules to get relevant contents.Miniflux uses CSS selectors for custom rules. These custom rules can be saved in the feed properties (Select a feed and click on edit).CSS SelectorDescriptiondiv#articleBodyFetch a div element with the ID articleBodydiv.contentFetch all div elements with the class contentarticle, div.articleUse a comma to define multiple rulesMiniflux includes a list of predefined rules for popular websites. You could contribute to the project to keep them up to date.Under the hood, Miniflux uses the library Goquery.URL Rewrite Rules ¶Sometimes it might be required to rewrite an URL in a feed to fetch better suited content.For example, for some users the URL https://www.npr.org/sections/money/2021/05/18/997501946/the-case-for-universal-pre-k-just-got-stronger displays a cookie consent dialog instead of the actual content and it would be preferred to fetch the URL https://text.npr.org/997501946 instead.The following rules does this:rewrite("^https:\/\/www\.npr\.org\/\d{4}\/\d{2}\/\d{2}\/(\d+)\/.*$"|"https://text.npr.org/$1") This will rewrite all URLs from the original feed to URLs pointing to text.npr.org when the article content is fetched. I also had to add my own scraper rule, because the default rule will try to fetch #storytext.Another example is the german page https://www.heise.de/news/Industrie-ruestet-sich-fuer-Gasstopp-Forscher-vorsichtig-optimistisch-7167721.html which splits the article into multiple pages. The full text can be read on https://www.heise.de/news/Industrie-ruestet-sich-fuer-Gasstopp-Forscher-vorsichtig-optimistisch-7167721.html?seite=allThe URL rewrite rule for that would berewrite("(.*?\.html)"|"$1?seite=all")'''
year_published = 2025
clearnet = "https://miniflux.app/docs/rules.html"
