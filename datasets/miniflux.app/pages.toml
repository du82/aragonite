title = "Miniflux - Minimalist and Opinionated Feed Reader"
description = "Miniflux is a minimalist and opinionated feed reader"
full_description = "Summary ¶Optimized for readabilityThe page layout, fonts, and colors are chosen to be readable on a screen. The most important thing is the content.Download original article contentsDo you have feeds that display only a summary? Fetch the original article automatically.No fancy featuresI suppose you don't like bloated software? Miniflux focuses on simplicity. Less is more!Fast and efficientBe productive, use the keyboard shortcuts to navigate through the application. Scan quickly your unread items with the lightweight user interface.Your privacy is guaranteedNobody resells your private data or track your usage.No advertising and user trackingMiniflux removes automatically pixel trackers.Super simple installationMiniflux is compiled statically without external dependencies, drop the binary on your server and you are done. You also have the choice to use the RPM/Debian package or the Docker image.Free, open source and self-hostedMiniflux is a free and open source project distributed under the permissive Apache 2.0 License. Donations ¶Do you like Miniflux? make a donation. LiberaPayGo to Miniflux's profile on LiberaPay.PayPal"
