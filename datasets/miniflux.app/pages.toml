title = "Terms of Service and Privacy"
full_description = "1. ContractThese general conditions of sale apply to all orders placed on the Miniflux.app website.Miniflux reserves the right to adapt or modify these conditions of sale at any time. If modified, they will be applied to each new order.2. SubscriptionProducts are delivered immediately after your purchase on the Miniflux.app website.3. PriceWe reserve the right to change our prices at any time.4. PaymentPayments are made by credit card or PayPal.We do not store credit card information or any sensitive data on our servers.5. CancellationTo cancel your account, send an email to support@miniflux.net with your username, or use the link sent by email to manage your account.If you do not subscribe after the free trial, all your data will be automatically removed.6. ResponsibilityMiniflux cannot be held liable for breach of contract in connection with fortuitous events or force majeure.Miniflux is not liable for any damages including operating losses, loss of profit, or any damages or expenses that might arise.7. PrivacyMiniflux does not collect or share personal information.Your data (feeds) are kept confidential and are not given or sold to third parties.We do not track your usage.We do not send spam or marketing messages.We do not use any sort of analytics software.All your data are removed after account cancellation.8. AbuseThe Miniflux software is a personal news reader.It cannot be used for unattended uses such as massive feed crawlers or as a backend to another service."
year_published = 2025
clearnet = "https://miniflux.app/tos.html"
