["https://miniflux.app/releases/1.2.0.html"]
title = "Miniflux 1.2.0"
full_description = "Miniflux 1.2.0Home > ReleasesRelease date: January 5, 2017ChangesThis version brings a major change to the Miniflux database management.Until now, Miniflux was designed to work for only one user. Handling multiple users was possible by using a Sqlite database for each user.Now, the database schema and the code base have been modified to handle several users with only one database. Moreover, Miniflux supports Postgresql in addition to Sqlite.Using Postgres could avoid some potential issues when the concurrency on the database is too high (locking problems). That also facilitates the deployment of Miniflux to some cloud providers that does not allow software to store persistent data on the local file system.Major change to the database structure to have a single database for multiple usersWeb access token for the cronjobNew config parameter to disable web access for the cronjobDebug mode parameter is moved to the config fileThe console web page has been removedRemove automatic software update from the user interfaceNew API methods (not backward compatible)Fever API tokens are longer than beforeAlways update feed URL to avoid useless redirection for future requestsAdd support for Wallabag serviceShow last parsing error message in user interfaceDisable a feed automatically after too many failuresAdd support for Expires and Cache-Control headers (HTTP cache)Flush all users remember me sessions when changing passwordUpdate Docker image to Ubuntu 16.04 and PHP 7.0Add Docker compose fileAdd functional tests (Json-RPC API and Fever API)Add unit testsMinify Javascript and add automated syntax check on the CIMinify CSS"
