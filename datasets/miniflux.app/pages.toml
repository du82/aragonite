["https://miniflux.app/docs/upgrade.html"]
title = "Upgrading Miniflux"
full_description = "Upgrading MinifluxHome > DocumentationPlease, do not update the software blindly without reading the Change Log. Always check for breaking changes if any.Instructions ¶Export the environment variable DATABASE_URL if not already doneDisconnect all users by flushing all sessions: miniflux -flush-sessionsStop the processBackup your databaseCheck that your backup is really workingUpgrade the miniflux binary itselfRun database migrations: miniflux -migrate or set the environment variable RUN_MIGRATIONS=1Start the process againDebian Systems ¶Follow the instructions mentioned above and run: dpkg -i miniflux_2.x.x_amd64.deb. If you are using the APT repository, run apt upgrade miniflux.Do not forget to run the database migrations. The most simple way is to add RUN_MIGRATIONS=1 in your miniflux.conf.RPM Systems ¶Follow the instructions mentioned above and run: rpm -Uvh miniflux-2.x.x-1.0.x86_64.rpm.Do not forget to run the database migrations as mentioned above.Docker Containers ¶Pull the new image with the new tag: docker pull miniflux/miniflux:2.x.xStop and remove the old container: docker stop <container_name> && docker rm <container_name>Start a new container with the latest tag: docker run -d -p 80:8080 miniflux/miniflux:2.x.xIf you use Docker Compose, define the new tag in the YAML file and restart the container.Do not forget to run the database migrations. Set the environment variable RUN_MIGRATIONS=1."
