["https://miniflux.app/hosting.html"]
title = "Miniflux Hosting"
description = "Paid Hosting Service"
full_description = "The hosted version is for people who don't want to manage their own server.The subscription is only $15/year with a free trial period of 15 days.Try Miniflux for freeWhy use the hosted version? ¶Everything is managed for youYou do not have to worry about technical details: servers, security updates, SSL certificates, domain names, backups, monitoring, etc...Always up to dateThis solution is maintained by the creator of Miniflux. There are always new bug fixes and improvements.PrivacyMiniflux does not collect or share personal information.Your data (feeds) are kept confidential and are not given or sold to third parties.We do not track your usage.We do not send spam or marketing messages.We do not use any sort of analytics software.All your data is purged after account cancellation.SustainableIf you are not paying for it, you are the product. We are small, not a large-scale business. We are not a startup backed by venture capitalists. Miniflux Hosting has existed since 2013.Human customer supportYou can talk directly by email to the main developer, a real human, not another outsourced customer support. We can communicate in English or French.Compatible with the open source versionThe hosted version runs exactly the same code as the open-source version. There is no proprietary fork or vendor lock-in, only one code base.Support indie developersHelp small indie developers instead of giving your money to a large corporation.Sign Up NowFrequently Asked Questions ¶How do I subscribe to the hosted version?When you create a new account, you should receive an email that contains a link to the shopping cart. Follow the link and choose your payment method. Check your spam folder if you haven't received any email.What payment methods are accepted?We accept PayPal and credit cards. We do not store any sensitive information on our servers. Credit cards are processed by Stripe.How do I close my trial account?Your trial account and your data will be removed automatically if you don't subscribe.How do I cancel my subscription?Contact the support by email: support AT miniflux DOT net. Your account and all your data will be removed, no questions asked.How do I renew my subscription?Subscriptions are not renewed automatically. You will receive several email notifications before the end of your subscription. Click on the link that will redirect you to the shopping cart.Where is Miniflux hosted?Miniflux's main server and your data are hosted in Finland since 2023. Additionally, feeds could be retrieved from proxies located in the United States and Germany. Before 2023, the main server was hosted in Canada.What is the Miniflux application URL?The application is available at https://reader.miniflux.app/.How often are feeds refreshed?Subscriptions are updated every 1-2 hours. Sometimes, it might take a little bit longer depending on the size of the queue.How do I reset my password?At the moment, there is no feature to re-initialize your password. If you forgot your password, send an email to support@miniflux.net. It's strongly advised to use a password manager.How long are the articles kept in the database?In order to avoid a large database, the retention policy is defined like this:Articles marked as unread are removed 60 days after the insertion into the database.Articles marked as read are removed 30 days after the insertion into the database.Starred articles are never removed.Where is the status page?Incidents and planned maintenances are communicated here: https://status.miniflux.app/Where are the terms of service?Terms of Service and Privacy"
