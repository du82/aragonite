["https://miniflux.app/docs/alpine.html"]
title = "Alpine Linux Installation"
description = "Instructions to install Miniflux on Alpine Linux"
full_description = "Alpine Linux InstallationHome > DocumentationAlpine Linux is a lightweight Linux distribution that is perfectly suited for running Miniflux.An APK package is available from the community repository (it was in testing previously).Edit the file /etc/apk/repositories to enable the Edge repository: http://dl-cdn.alpinelinux.org/alpine/edge/community. And then run apk update.The Miniflux installation is simple as running:apk add miniflux miniflux-openrc miniflux-doc Do not forget to install PostgreSQL:apk add postgresql postgresql-contrib Configure the database and enable the HSTORE extension as mentioned previously.On Alpine Linux, the Miniflux process is supervised by supervise-daemon from OpenRC (there is no Systemd). The log file /var/log/miniflux.log is rotated with logrotate.In this context, the configuration file /etc/miniflux.conf is used instead of using environment variables:# /etc/miniflux.conf LOG_DATE_TIME=yes LISTEN_ADDR=127.0.0.1:8080 DATABASE_URL=user=postgres password=secret dbname=miniflux sslmode=disable # Run SQL migrations automatically: # RUN_MIGRATIONS=1 To finalize the installation, create the database schema and a first user:miniflux -c /etc/miniflux.conf -migrate miniflux -c /etc/miniflux.conf -create-admin And finally, start the application:service miniflux start Make sure to take a look a the list of configuration parameters to customize your installation."
