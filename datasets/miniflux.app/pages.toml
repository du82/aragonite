title = "Matrix Integration"
full_description = "Matrix IntegrationHome > DocumentationMiniflux can send notifications to any Matrix server.To enable this integration, go to Settings > Integrations > Matrix Bot and enter the relevant information.The recommendation is to create a specific user for the Miniflux integration:The Matrix username uses this format: @username:homeserver.tld, for example: @example:matrix.orgThe Matrix URL is the base URL of your Matrix server. For example: https://matrix.orgThe Matrix Room ID can be found by using a client like Element: Room Settings > Advanced > Internal Room ID. The format is !localid:homeserver.tld, for example: !RXRwLGkDQJzA:matrix.org.As the time of writing this document, the Matrix notifications looks like this when using the Element client:"
