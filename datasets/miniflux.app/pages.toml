["https://miniflux.app/docs/rhel.html"]
title = "RHEL Installation"
description = "Instructions to install Miniflux on RHEL distros"
full_description = "RHEL InstallationHome > DocumentationThis document describes how to install Miniflux on any RHEL compatible Linux distributions such as RedHat, CentOS, RockyLinux, or AlmaLinux.When you use the RPM package, the Miniflux daemon is supervised by systemd.Make sure to install and configure Postgresql before installing Miniflux.Install the RPM Package ManuallyInstall the RPM Package from the YUM RepoConfigure MinifluxRPM Package Installation ¶Download the RPM package from the GitHub Releases page.Install the RPM package: rpm -ivh miniflux-2.0.13-1.0.x86_64.rpmHow to Configure the RPM Repository ¶Create the file /etc/yum.repos.d/miniflux.repo:[miniflux] name=Miniflux Repository baseurl=https://repo.miniflux.app/yum/ enabled=1 gpgcheck=0 Then install the package:dnf install -y miniflux The previous repository URL https://rpm.miniflux.app/x86_64/ is deprecated in favor of https://repo.miniflux.app/yum/.Configure Miniflux ¶Define the environment variable DATABASE_URL if necessaryRun the SQL migrations: miniflux -migrate, or set the variable RUN_MIGRATIONS=1 in /etc/miniflux.confCreate an admin user: miniflux -create-adminCustomize your configuration file /etc/miniflux.conf if necessaryEnable the systemd service: systemctl enable minifluxStart the process with systemd: systemctl start minifluxCheck the process status: systemctl status minifluxSystemd reads the environment variables from the file /etc/miniflux.conf. You must restart the service to take the new values into consideration.Make sure to take a look a the list of configuration parameters to customize your installation."
