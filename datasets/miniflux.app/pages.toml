["https://miniflux.app/docs/apps.html"]
title = "Third-Party Applications"
full_description = "Third-Party ApplicationsHome > DocumentationTable of ContentsFeedMe (Android / Free / Proprietary)Fluent Reader (All platforms / FOSS except iPhone and Android not-free versions)Fluxjs (Web frontend)FluxNews (Android / FOSS)FocusReader (Android / Freemium / Proprietary)Lire (iOS/macOS / Paid / Proprietary)Microflux (Android)Miniflutt (Android)Miniflux-ai (Add AI summaries, translations, and AI news based on RSS content)NetNewsWire (iOS/macOS / FOSS)Newsboat (text console / FOSS)NewsFlash (Linux / FOSS)ReactFlux (Web frontend)Read You (Android / FOSS)Reeder Classic (iOS/macOS / Paid / Proprietary)Reminiflux (Web frontend)RSS Guard (Windows, Linux, BSD, OS/2 or macOS / FOSS)TelegramUnread (iOS/macOS / Freemium / Proprietary)Fluxjs ¶Fluxjs is a responsive design frontend. You can browse your rss feeds from your mobile or your desktop.Links: GitHubFluxNews ¶A simple Newsreader for the miniflux backend. This newsreader sync with the Miniflux server API.It supports light and dark mode, mark articles as read on scrollover and open articles preferred in an already installed app.Links: GitHubLire ¶Lire can sync with Miniflux. It uses both the Fever API and the Miniflux API.ConfigurationEnable the Fever integration in Miniflux and define a Fever username and password (Go to Settings > Integrations)Create a new Miniflux API Key in Settings > API KeysEnter the connection information created above in Lire settings (select Miniflux in the list of self-hosted sync services)Make sure to copy and paste the entire API Key (double check for typos)Do not use /v1/ or /fever/ in the Miniflux URL, for example, the URL is https://reader.miniflux.app for the hosted version of MinifluxLinks: Official website, iOS App Store, Mac App StoreMicroflux ¶This reader has features that cannot be provided to form a conventional web page.Features:Offline persistence and syncMultiple accounts can be storedMaterial design and animationsDark and light modesArticles display an image previewNotificationsLinks: GitHubMiniflutt ¶Features:Online readingAudio and video playbackArticle searchShare articleOpen article in external browserDark theme available on night modeDownload most common files (documents, images and videos)Articles are grouped by categories / feeds.All articles from a category / feed can be marked as read.Fetch read and/or unread articlesSet favoritesFeed and category managementLinks: Google Play, GitHubMiniflux-ai ¶This project integrates with Miniflux to fetch RSS feed content via API or webhook. It then utilizes large language models (e.g., Ollama, ChatGPT, LLaMA, Gemini) to generate summaries, translations, and AI-driven news insights.Links: GitHubReactFlux ¶ReactFlux is a third-party web frontend for Miniflux, aimed at providing a more user-friendly reading experience.Key features include:Modern interface designResponsive layoutSupport for dark mode and custom themesArticle search with Google-like syntaxFeed and group managementKeyboard shortcutsAutomatically mark articles as read when scrollingBatch update the host of filtered subscription URLs (useful for replacing RSSHub instances)Batch refresh recently errored subscriptionsDe-duplicate articles by hash, title, or URL when loading the listi18n supports (include: English / Español / 简体中文)Other features waiting for you to discover…Links: GitHubReminiflux ¶Reminiflux is an alternative web frontend. It offers a look and feel which is more similar to Google Reader and TT-RSS with a 3-paned display showing the list of feeds, items and an article.Links: GitHub"
