["https://minikube.sigs.k8s.io/docs/handbook/filesync"]
title = "File Sync | minikube"
description = "How to sync files into minikube"
full_description = "Documentation Handbook File Sync File Sync How to sync files into minikube Built-in sync minikube has a built-in file sync mechanism, but it only syncs when minikube start is run, though before Kubernetes is started. Examples where this may be useful are custom versions of system or Kubernetes configuration files, such as: DNS configuration SSL certificates Kubernetes service metadata Adding files Place files to be synced in $MINIKUBE_HOME/files For example, running the following will result in the deployment of a custom /etc/resolv.conf: mkdir -p ~/.minikube/files/etc echo nameserver 8.8.8.8 > ~/.minikube/files/etc/resolv.conf minikube start Other approaches With a bit of work, one could setup Syncthing between the host and the guest VM for persistent file synchronization. If you are looking for a solution tuned for iterative application development, consider using a Kubernetes tool that is known to work well with minikube: Draft: see specific minikube instructions Okteto Skaffold .feedback--answer { display: inline-block; } .feedback--answer-no { margin-left: 1em; } .feedback--response { display: none; margin-top: 1em; } .feedback--response__visible { display: block; } Feedback Was this page helpful? Yes No Glad to hear it! Please tell us how we can improve. Sorry to hear that. Please tell us how we can improve. const yesButton = document.querySelector('.feedback--answer-yes'); const noButton = document.querySelector('.feedback--answer-no'); const yesResponse = document.querySelector('.feedback--response-yes'); const noResponse = document.querySelector('.feedback--response-no'); const disableButtons = () => { yesButton.disabled = true; noButton.disabled = true; }; const sendFeedback = (value) => { if (typeof gtag !== 'function') return; gtag('event', 'page_helpful', { 'event_category': 'Helpful', 'event_label': window.location.pathname, 'value': value }); }; yesButton.addEventListener('click', () => { yesResponse.classList.add('feedback--response__visible'); disableButtons(); sendFeedback( 100 ); }); noButton.addEventListener('click', () => { noResponse.classList.add('feedback--response__visible'); disableButtons(); sendFeedback(0); }); Last modified February 1, 2022: Added Network Policy page to handbook (51092e0e3)"
