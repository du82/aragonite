title = "Drivers | minikube"
description = "Configuring various minikube drivers"
full_description = "Documentation Drivers Drivers Configuring various minikube drivers minikube can be deployed as a VM, a container, or bare-metal. To do so, we use the Docker Machine library to provide a consistent way to interact with different environments. Here is what’s supported: Linux Docker - container-based (preferred) KVM2 - VM-based (preferred) VirtualBox - VM QEMU - VM None - bare-metal Podman - container-based (experimental) SSH - remote ssh macOS Docker - VM + Container (preferred) Hyperkit - VM VirtualBox - VM Parallels - VM VMware Fusion - VM QEMU - VM Podman - VM + Container (experimental) VFkit - VM (experimental) SSH - remote ssh Windows Hyper-V - VM (preferred) Docker - VM + Container (preferred) VirtualBox - VM VMware Workstation - VM QEMU - VM (experimental) Podman - VM + Container (experimental) SSH - remote ssh .feedback--answer { display: inline-block; } .feedback--answer-no { margin-left: 1em; } .feedback--response { display: none; margin-top: 1em; } .feedback--response__visible { display: block; } Feedback Was this page helpful? Yes No Glad to hear it! Please tell us how we can improve. Sorry to hear that. Please tell us how we can improve. const yesButton = document.querySelector('.feedback--answer-yes'); const noButton = document.querySelector('.feedback--answer-no'); const yesResponse = document.querySelector('.feedback--response-yes'); const noResponse = document.querySelector('.feedback--response-no'); const disableButtons = () => { yesButton.disabled = true; noButton.disabled = true; }; const sendFeedback = (value) => { if (typeof gtag !== 'function') return; gtag('event', 'page_helpful', { 'event_category': 'Helpful', 'event_label': window.location.pathname, 'value': value }); }; yesButton.addEventListener('click', () => { yesResponse.classList.add('feedback--response__visible'); disableButtons(); sendFeedback( 100 ); }); noButton.addEventListener('click', () => { noResponse.classList.add('feedback--response__visible'); disableButt