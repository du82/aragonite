["https://minikube.sigs.k8s.io/docs/drivers/hyperv"]
title = "hyperv | minikube"
description = """
Overview Hyper-V is a native hypervisor built in to modern versions of Microsoft Windows.
Requirements 64-bit versions of Windows 10 Enterprise, Pro, or Education (system requirements) Hyper-V enabled Enabling Hyper-V Open a PowerShell console as Administrator, and run the following command:
Enable-WindowsOptionalFeature -Online -FeatureName Microsoft-Hyper-V -All If Hyper-V was not previously active, you will need to reboot.
Usage minikube start --driver=hyperv To make hyperv the default driver:
minikube config set driver hyperv Special features The minikube start command supports additional hyperv specific flags:"""
full_description = "Documentation Drivers hyperv hyperv Overview Hyper-V is a native hypervisor built in to modern versions of Microsoft Windows. Requirements 64-bit versions of Windows 10 Enterprise, Pro, or Education (system requirements) Hyper-V enabled Enabling Hyper-V Open a PowerShell console as Administrator, and run the following command: Enable-WindowsOptionalFeature -Online -FeatureName Microsoft-Hyper-V -All If Hyper-V was not previously active, you will need to reboot. Usage minikube start --driver=hyperv To make hyperv the default driver: minikube config set driver hyperv Special features The minikube start command supports additional hyperv specific flags: --hyperv-virtual-switch: Name of the virtual switch the minikube VM should use. Defaults to first found --hyperv-use-external-switch: Use external virtual switch over Default Switch if virtual switch not explicitly specified, creates a new one if not found. If the adapter is not specified, the driver first looks up LAN adapters before other adapters (WiFi, …). Or the user may specify an adapter to attach to the external switch. Default false --hyperv-external-adapter: External adapter on which the new external switch is created if no existing external switch is found. Since Windows 10 only allows one external switch for the same adapter, it finds the virtual switch before creating one. The external switch is created and named “minikube” Issues Also see co/hyperv open issues. Troubleshooting Run minikube start --alsologtostderr -v=7 to debug crashes While reinstalling minikube you may encounter error in starting minikube due to stuck.vmcx file from previous installation,a possible fix is: Install Handle Windows tool, identify the process handling .vmcx file,kill it. Run minikube delete --all --purge to remove the extra config files .feedback--answer { display: inline-block; } .feedback--answer-no { margin-left: 1em; } .feedback--response { display: none; margin-top: 1em; } .feedback--response__visible { display: block; } Feedback Was this page helpful? Yes No Glad to hear it! Please tell us how we can improve. Sorry to hear that. Please tell us how we can improve. const yesButton = document.querySelector('.feedback--answer-yes'); const noButton = document.querySelector('.feedback--answer-no'); const yesResponse = document.querySelector('.feedback--response-yes'); const noResponse = document.querySelector('.feedback--response-no'); const disableButtons = () => { yesButton.disabled = true; noButton.disabled = true; }; const sendFeedback = (value) => { if (typeof gtag !== 'function') return; gtag('event', 'page_helpful', { 'event_category': 'Helpful', 'event_label': window.location.pathname, 'value': value }); }; yesButton.addEventListener('click', () => { yesResponse.classList.add('feedback--response__visible'); disableButtons(); sendFeedback( 100 ); }); noButton.addEventListener('click', () => { noResponse.classList.add('feedback--response__visible'); disableButtons(); sendFeedback(0); }); Last modified April 5, 2023: Fix link to GitHub open issues label for drivers (d1297d391)"
