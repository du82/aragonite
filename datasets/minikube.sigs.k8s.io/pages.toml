title = "completion | minikube"
description = "Generate command completion for a shell"
full_description = '''Documentation Commands completion completion Generate command completion for a shell minikube completion Generate command completion for a shell Synopsis Outputs minikube shell completion for the given shell (bash, zsh, fish or powershell) This depends on the bash-completion binary. Example installation instructions: OS X: $ brew install bash-completion $ source $(brew --prefix)/etc/bash_completion $ minikube completion bash > ~/.minikube-completion # for bash users $ minikube completion zsh > ~/.minikube-completion # for zsh users $ source ~/.minikube-completion $ minikube completion fish > ~/.config/fish/completions/minikube.fish # for fish users Ubuntu: $ apt-get install bash-completion $ source /etc/bash_completion $ source <(minikube completion bash) # for bash users $ source <(minikube completion zsh) # for zsh users $ minikube completion fish > ~/.config/fish/completions/minikube.fish # for fish users Additionally, you may want to output the completion to a file and source in your .bashrc Windows: ## Save completion code to a script and execute in the profile PS> minikube completion powershell > $HOME\.minikube-completion.ps1 PS> Add-Content $PROFILE '. $HOME\.minikube-completion.ps1' ## Execute completion code in the profile PS> Add-Content $PROFILE 'if (Get-Command minikube -ErrorAction SilentlyContinue) { minikube completion powershell | Out-String | Invoke-Expression }' Note for zsh users: [1] zsh completions are only supported in versions of zsh >= 5.2 Note for fish users: [2] please refer to this docs for more details https://fishshell.com/docs/current/#tab-completion minikube completion SHELL [flags] Options inherited from parent commands --add_dir_header If true, adds the file directory to the header of the log messages --alsologtostderr log to standard error as well as files (no effect when -logtostderr=true) -b, --bootstrapper string The name of the cluster bootstrapper that will set up the Kubernetes cluster. (default "kubeadm