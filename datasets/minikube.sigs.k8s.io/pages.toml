full_description = "Documentation Drivers ssh ssh Linux ssh (remote) driver Overview This document is written for system integrators who wish to run minikube within a customized VM environment. The ssh driver allows advanced minikube users to skip VM creation, allowing minikube to be run on a user-supplied VM. Requirements A Linux VM with the following: systemd or OpenRC a container runtime, such as Docker or CRIO cri-dockerd (if using Kubernetes +v1.24 & docker container-runtime) This VM must also meet the kubeadm requirements, such as: 2 CPU’s 2GB RAM iptables (in legacy mode) conntrack crictl cni-plugins SELinux permissive cgroups v1 (v2 is not yet supported by Kubernetes) Usage The ssh driver requires the IP address of the VM to use. minikube start --driver=ssh --ssh-ip-address=vm.example.com Issues Full list of open ‘ssh’ driver issues Troubleshooting Run minikube start --alsologtostderr -v=4 to debug crashes .feedback--answer { display: inline-block; } .feedback--answer-no { margin-left: 1em; } .feedback--response { display: none; margin-top: 1em; } .feedback--response__visible { display: block; } Feedback Was this page helpful? Yes No Glad to hear it! Please tell us how we can improve. Sorry to hear that. Please tell us how we can improve. const yesButton = document.querySelector('.feedback--answer-yes'); const noButton = document.querySelector('.feedback--answer-no'); const yesResponse = document.querySelector('.feedback--response-yes'); const noResponse = document.querySelector('.feedback--response-no'); const disableButtons = () => { yesButton.disabled = true; noButton.disabled = true; }; const sendFeedback = (value) => { if (typeof gtag !== 'function') return; gtag('event', 'page_helpful', { 'event_category': 'Helpful', 'event_label': window.location.pathname, 'value': value }); }; yesButton.addEventListener('click', () => { yesResponse.classList.add('feedback--response__visible'); disableButtons(); sendFeedback( 100 ); }); noButton.addEventListener('clic