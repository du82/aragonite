full_description = "Join the minikube community minikube is an open source project that anyone in the community can use, improve, and enjoy. We'd love you to join us! Here's a few ways to find out what's happening and get involved. Learn and Connect Using or want to use minikube? Find out more here: Slack: Chat with other minikube users and developers Slack Invitation: Use this invitation link to join Kubernetes Slack workspace minikube-users mailing list: Interact with the minikube users here twitter: Follow minikube's official twitter for news/releases Develop and Contribute minikube is a Kubernetes #sig-cluster-lifecycle project. If you want to get more involved by contributing to minikube, join us here: GitHub: Development takes place here! minikube-dev mailing list: Contact the minikube developers here Contributing Guide: Check out the contributing guide Project Roadmap: Check out the project roadmap You can find out how to contribute to these docs in our Contribution Guidelines. Join our meetings Office hours: Bi-weekly office hours, Mondays @ 11am PST Triage Party: All community members are welcome and encouraged to join and help us triage minikube! Kanban board: Kanban visualization of the next milestone"
