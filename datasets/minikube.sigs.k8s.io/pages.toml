["https://minikube.sigs.k8s.io/docs/handbook/mount"]
title = "Mounting filesystems | minikube"
description = "How to mount a host directory into the VM"
full_description = '''Documentation Handbook Mounting filesystems Mounting filesystems How to mount a host directory into the VM 9P Mounts 9P mounts are flexible and work across all hypervisors, but suffers from performance and reliability issues when used with large folders (>600 files). See Driver Mounts as an alternative. To mount a directory from the host into the guest using the mount subcommand: minikube mount <source directory>:<target directory> For example, this would mount your home directory to appear as /host within the minikube VM: minikube mount $HOME:/host This directory may then be referenced from a Kubernetes manifest, for example: { "apiVersion": "v1", "kind": "Pod", "metadata": { "name": "ubuntu" }, "spec": { "containers": [ { "name": "ubuntu", "image": "ubuntu:18.04", "args": ["bash"], "stdin": true, "stdinOnce": true, "tty": true, "workingDir": "/host", "volumeMounts": [ { "mountPath": "/host", "name": "host-mount" } ] } ], "volumes": [ { "name": "host-mount", "hostPath": { "path": "/host" } } ] } } Driver mounts Some hypervisors, have built-in host folder sharing. Driver mounts are reliable with good performance, but the paths are not predictable across operating systems or hypervisors: Driver OS HostFolder VM VirtualBox Linux /home /hosthome VirtualBox macOS /Users /Users VirtualBox Windows C://Users /c/Users VMware Fusion macOS /Users /mnt/hgfs/Users KVM Linux Unsupported HyperKit macOS Supported These mounts can be disabled by passing --disable-driver-mounts to minikube start. HyperKit mounts can use the following flags: --nfs-share=[]: Local folders to share with Guest via NFS mounts --nfs-shares-root='/nfsshares': Where to root the NFS Shares, defaults to /nfsshares File Sync See File Sync .feedback--answer { display: inline-block; } .feedback--answer-no { margin-left: 1em; } .feedback--response { display: none; margin-top: 1em; } .feedback--response__visible { display: block; } Feedback Was this page helpful? Yes No Glad to hear it! Please tell us how we can improve. Sorry to hear that. Please tell us how we can improve. const yesButton = document.querySelector('.feedback--answer-yes'); const noButton = document.querySelector('.feedback--answer-no'); const yesResponse = document.querySelector('.feedback--response-yes'); const noResponse = document.querySelector('.feedback--response-no'); const disableButtons = () => { yesButton.disabled = true; noButton.disabled = true; }; const sendFeedback = (value) => { if (typeof gtag !== 'function') return; gtag('event', 'page_helpful', { 'event_category': 'Helpful', 'event_label': window.location.pathname, 'value': value }); }; yesButton.addEventListener('click', () => { yesResponse.classList.add('feedback--response__visible'); disableButtons(); sendFeedback( 100 ); }); noButton.addEventListener('click', () => { noResponse.classList.add('feedback--response__visible'); disableButtons(); sendFeedback(0); }); Last modified February 1, 2022: Added Network Policy page to handbook (51092e0e3)'''
