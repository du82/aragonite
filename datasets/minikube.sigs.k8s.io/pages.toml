["https://minikube.sigs.k8s.io/docs/handbook/kubectl"]
title = "Kubectl | minikube"
description = "Use kubectl inside minikube"
full_description = '''Documentation Handbook Kubectl Kubectl Use kubectl inside minikube By default, kubectl gets configured to access the kubernetes cluster control plane inside minikube when the minikube start command is executed. kubectl <kubectl commands> However if kubectl is not installed locally, minikube already includes kubectl which can be used like this: minikube kubectl -- <kubectl commands> You can also alias kubectl for easier usage. alias kubectl="minikube kubectl --" Alternatively, you can create a symbolic link to minikube’s binary named ‘kubectl’. ln -s $(which minikube) /usr/local/bin/kubectl You can also alias kubectl for easier usage. alias kubectl="minikube kubectl --" Alternatively, you can create a symbolic link to minikube’s binary named ‘kubectl’. ln -s $(which minikube) /usr/local/bin/kubectl You can also alias kubectl for easier usage. Powershell. function kubectl { minikube kubectl -- $args } Command Prompt. doskey kubectl=minikube kubectl $* Get pods minikube kubectl -- get pods Creating a deployment inside kubernetes cluster minikube kubectl -- create deployment hello-minikube --image=kicbase/echo-server:1.0 Exposing the deployment with a NodePort service minikube kubectl -- expose deployment hello-minikube --type=NodePort --port=8080 For more help minikube kubectl -- --help Documentation https://kubernetes.io/docs/reference/kubectl/ Shell autocompletion After applying the alias or the symbolic link you can follow https://kubernetes.io/docs/tasks/tools/install-kubectl-linux/#enable-shell-autocompletion to enable shell-autocompletion. .feedback--answer { display: inline-block; } .feedback--answer-no { margin-left: 1em; } .feedback--response { display: none; margin-top: 1em; } .feedback--response__visible { display: block; } Feedback Was this page helpful? Yes No Glad to hear it! Please tell us how we can improve. Sorry to hear that. Please tell us how we can improve. const yesButton = document.querySelector('.feedback--answer-yes'); const noButton = document.querySelector('.feedback--answer-no'); const yesResponse = document.querySelector('.feedback--response-yes'); const noResponse = document.querySelector('.feedback--response-no'); const disableButtons = () => { yesButton.disabled = true; noButton.disabled = true; }; const sendFeedback = (value) => { if (typeof gtag !== 'function') return; gtag('event', 'page_helpful', { 'event_category': 'Helpful', 'event_label': window.location.pathname, 'value': value }); }; yesButton.addEventListener('click', () => { yesResponse.classList.add('feedback--response__visible'); disableButtons(); sendFeedback( 100 ); }); noButton.addEventListener('click', () => { noResponse.classList.add('feedback--response__visible'); disableButtons(); sendFeedback(0); }); Last modified October 23, 2023: Add more links to the kubectl documentation (e6ee3dca7)'''
