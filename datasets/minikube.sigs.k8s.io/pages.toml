["https://minikube.sigs.k8s.io/docs/handbook/persistent_volumes"]
title = "Persistent Volumes | minikube"
description = "About persistent volumes (hostPath)"
full_description = "Documentation Handbook Persistent Volumes Persistent Volumes About persistent volumes (hostPath) minikube supports PersistentVolumes of type hostPath out of the box. These PersistentVolumes are mapped to a directory inside the running minikube instance (usually a VM, unless you use --driver=none, --driver=docker, or --driver=podman). For more information on how this works, read the Dynamic Provisioning section below. A note on mounts, persistence, and minikube hosts minikube is configured to persist files stored under the following directories, which are made in the Minikube VM (or on your localhost if running on bare metal). You may lose data from other directories on reboots. /data* /var/lib/minikube /var/lib/docker /var/lib/containerd /var/lib/buildkit /var/lib/containers /tmp/hostpath_pv* /tmp/hostpath-provisioner* * mount point for another directory, stored under /var or on a separate data disk Here is an example PersistentVolume config to persist data in the ‘/data’ directory: apiVersion: v1 kind: PersistentVolume metadata: name: pv0001 spec: accessModes: - ReadWriteOnce capacity: storage: 5Gi hostPath: path: /data/pv0001/ You can also achieve persistence by creating a PV in a mounted host folder. Dynamic provisioning and CSI In addition, minikube implements a very simple, canonical implementation of dynamic storage controller that runs alongside its deployment. This manages provisioning of hostPath volumes (rather then via the previous, in-tree hostPath provider). The default Storage Provisioner Controller is managed internally, in the minikube codebase, demonstrating how easy it is to plug a custom storage controller into kubernetes as a storage component of the system, and provides pods with dynamically, to test your pod’s behaviour when persistent storage is mapped to it. Note that this is not a CSI based storage provider, rather, it simply declares a PersistentVolume object of type hostpath dynamically when the controller see’s that there is an outstanding storage request. There is also CSI Hostpath Driver addon that enables dynamic provisioning and supports multi-node clusters as well as snapshots. .feedback--answer { display: inline-block; } .feedback--answer-no { margin-left: 1em; } .feedback--response { display: none; margin-top: 1em; } .feedback--response__visible { display: block; } Feedback Was this page helpful? Yes No Glad to hear it! Please tell us how we can improve. Sorry to hear that. Please tell us how we can improve. const yesButton = document.querySelector('.feedback--answer-yes'); const noButton = document.querySelector('.feedback--answer-no'); const yesResponse = document.querySelector('.feedback--response-yes'); const noResponse = document.querySelector('.feedback--response-no'); const disableButtons = () => { yesButton.disabled = true; noButton.disabled = true; }; const sendFeedback = (value) => { if (typeof gtag !== 'function') return; gtag('event', 'page_helpful', { 'event_category': 'Helpful', 'event_label': window.location.pathname, 'value': value }); }; yesButton.addEventListener('click', () => { yesResponse.classList.add('feedback--response__visible'); disableButtons(); sendFeedback( 100 ); }); noButton.addEventListener('click', () => { noResponse.classList.add('feedback--response__visible'); disableButtons(); sendFeedback(0); }); Last modified February 13, 2023: add multi-node cluster doc for the csi hostpath driver (874de40ca)"
