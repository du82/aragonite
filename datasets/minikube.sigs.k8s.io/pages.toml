["https://minikube.sigs.k8s.io/docs/handbook/host-access"]
title = "Host access | minikube"
description = "How to access host resources from a pod"
full_description = '''Documentation Handbook Host access Host access How to access host resources from a pod Prerequisites The service running on your host must either be bound to all IP’s (0.0.0.0) and interfaces, or to the IP and interface your VM is bridged against. If the service is bound only to localhost (127.0.0.1), this will not work. host.minikube.internal To make it easier to access your host, minikube v1.10 adds a hostname entry host.minikube.internal to /etc/hosts. The IP which host.minikube.internal resolves to is different across drivers, and may be different across clusters. Validating connectivity You can use minikube ssh to confirm connectivity: _ _ _ _ ( ) ( ) ___ ___ (_) ___ (_)| |/') _ _ | |_ __ /' _ ` _ `\| |/' _ `\| || , < ( ) ( )| '_`\ /'__`\ | ( ) ( ) || || ( ) || || |\`\ | (_) || |_) )( ___/ (_) (_) (_)(_)(_) (_)(_)(_) (_)`\___/'(_,__/'`\____) $ ping host.minikube.internal PING host.minikube.internal (192.168.64.1): 56 data bytes 64 bytes from 192.168.64.1: seq=0 ttl=64 time=0.225 ms To test connectivity to a specific TCP service listening on your host, use nc -vz host.minikube.internal <port>: $ nc -vz host.minikube.internal 8000 Connection to host.minikube.internal 8000 port [tcp/*] succeeded! Here are how to interpret the different messages: Connection succeeded: You are connected! Connection refused: the service is not listening on the port, at least not across all interfaces Note When using an older version of minikube, you may have to manually install tools like ping and netcat within the minikube image: sudo apt install iputils-ping netcat-openbsd .feedback--answer { display: inline-block; } .feedback--answer-no { margin-left: 1em; } .feedback--response { display: none; margin-top: 1em; } .feedback--response__visible { display: block; } Feedback Was this page helpful? Yes No Glad to hear it! Please tell us how we can improve. Sorry to hear that. Please tell us how we can improve. const yesButton = document.querySelector('.feedback--answer-yes'); const noButton = document.querySelector('.feedback--answer-no'); const yesResponse = document.querySelector('.feedback--response-yes'); const noResponse = document.querySelector('.feedback--response-no'); const disableButtons = () => { yesButton.disabled = true; noButton.disabled = true; }; const sendFeedback = (value) => { if (typeof gtag !== 'function') return; gtag('event', 'page_helpful', { 'event_category': 'Helpful', 'event_label': window.location.pathname, 'value': value }); }; yesButton.addEventListener('click', () => { yesResponse.classList.add('feedback--response__visible'); disableButtons(); sendFeedback( 100 ); }); noButton.addEventListener('click', () => { noResponse.classList.add('feedback--response__visible'); disableButtons(); sendFeedback(0); }); Last modified May 11, 2021: Add useful tools in the Kicbase Docker image (075ca2049)'''
