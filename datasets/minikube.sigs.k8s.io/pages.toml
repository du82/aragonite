["https://minikube.sigs.k8s.io/docs/handbook/controls"]
title = "Basic controls | minikube"
description = "See minikube in action!"
full_description = "Documentation Handbook Basic controls Basic controls See minikube in action! Start a cluster by running: minikube start Access the Kubernetes dashboard running within the minikube cluster: minikube dashboard Once started, you can interact with your cluster using kubectl, just like any other Kubernetes cluster. For instance, starting a server: kubectl create deployment hello-minikube --image=kicbase/echo-server:1.0 Exposing a service as a NodePort kubectl expose deployment hello-minikube --type=NodePort --port=8080 minikube makes it easy to open this exposed endpoint in your browser: minikube service hello-minikube Upgrade your cluster: minikube start --kubernetes-version=latest Start a second local cluster (note: This will not work if minikube is using the bare-metal/none driver): minikube start -p cluster2 Stop your local cluster: minikube stop Delete your local cluster: minikube delete Delete all local clusters and profiles minikube delete --all .feedback--answer { display: inline-block; } .feedback--answer-no { margin-left: 1em; } .feedback--response { display: none; margin-top: 1em; } .feedback--response__visible { display: block; } Feedback Was this page helpful? Yes No Glad to hear it! Please tell us how we can improve. Sorry to hear that. Please tell us how we can improve. const yesButton = document.querySelector('.feedback--answer-yes'); const noButton = document.querySelector('.feedback--answer-no'); const yesResponse = document.querySelector('.feedback--response-yes'); const noResponse = document.querySelector('.feedback--response-no'); const disableButtons = () => { yesButton.disabled = true; noButton.disabled = true; }; const sendFeedback = (value) => { if (typeof gtag !== 'function') return; gtag('event', 'page_helpful', { 'event_category': 'Helpful', 'event_label': window.location.pathname, 'value': value }); }; yesButton.addEventListener('click', () => { yesResponse.classList.add('feedback--response__visible'); disableButtons(); sendFeedback( 100 ); }); noButton.addEventListener('click', () => { noResponse.classList.add('feedback--response__visible'); disableButtons(); sendFeedback(0); }); Last modified November 23, 2022: update echo-server image (370e2188e)"
