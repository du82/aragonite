title = "Managing External Packages | minikube"
description = """
Managing External Packages Chocolatey (Windows) Chocolatey is a software package manager for Windows that wraps installers, executables, zips, and scripts into compiled packages. Use Chocolatey to install Minikube on Windows. The following links provide details necessary to install, get status, and update to the latest minikube chocolatey package on windows.
Chocolatey community is the maintainer of the Minikube package. Latest approved version is available for Install, Upgrade and Uninstall. Get the current status of the Chocolatey package. Minikube Chocolatey update script on GitHub. Note: Windows support is limited to 64bit operating systems."""
