full_description = "Documentation Contributing Roadmap Roadmap Development Roadmap This roadmap is a living document outlining the major technical improvements which we would like to see in minikube over the next year, divided by how they apply to our guiding principles Please send a PR to suggest any improvements to it. 2024 (#1) AI Support Nvidia-Docker runtime Try Kubeflow addon (#2) Documentation Consolidate Kubernetes documentation that references minikube Delete outdated documentation Add documentation for new features (#3) Docker Remove the Docker Desktop requirement on Mac and Windows Support the Docker Desktop environment on Linux as well (#4) Podman Improve support for rootless containers with Podman Engine Support the Podman Desktop environment on Mac and Windows (#5) libmachine Refactor Add new driver with Virtualization.framework, as QEMU alternative on Mac arm64 Fix the provisioner, remove legacy Swarm, and add support for other runtimes .feedback--answer { display: inline-block; } .feedback--answer-no { margin-left: 1em; } .feedback--response { display: none; margin-top: 1em; } .feedback--response__visible { display: block; } Feedback Was this page helpful? Yes No Glad to hear it! Please tell us how we can improve. Sorry to hear that. Please tell us how we can improve. const yesButton = document.querySelector('.feedback--answer-yes'); const noButton = document.querySelector('.feedback--answer-no'); const yesResponse = document.querySelector('.feedback--response-yes'); const noResponse = document.querySelector('.feedback--response-no'); const disableButtons = () => { yesButton.disabled = true; noButton.disabled = true; }; const sendFeedback = (value) => { if (typeof gtag !== 'function') return; gtag('event', 'page_helpful', { 'event_category': 'Helpful', 'event_label': window.location.pathname, 'value': value }); }; yesButton.addEventListener('click', () => { yesResponse.classList.add('feedback--response__visible'); disableButtons(); sendFeedback( 100 