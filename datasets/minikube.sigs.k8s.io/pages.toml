["https://minikube.sigs.k8s.io/docs/drivers/docker"]
title = "docker | minikube"
description = """
Overview The Docker driver allows you to install Kubernetes into an existing Docker install. On Linux, this does not require virtualization to be enabled.
Requirements Install Docker 18.09 or higher (20.10 or higher is recommended) amd64 or arm64 system. If using WSL complete these steps first Don’t forget to follow this step to manage Docker as a non-root user. Usage Start a cluster using the docker driver:
minikube start --driver=docker To make docker the default driver:"""
full_description = "Documentation Drivers docker docker Overview The Docker driver allows you to install Kubernetes into an existing Docker install. On Linux, this does not require virtualization to be enabled. Requirements Install Docker 18.09 or higher (20.10 or higher is recommended) amd64 or arm64 system. If using WSL complete these steps first Don’t forget to follow this step to manage Docker as a non-root user. Usage Start a cluster using the docker driver: minikube start --driver=docker To make docker the default driver: minikube config set driver docker Requirements Docker 20.10 or higher, see https://rootlesscontaine.rs/getting-started/docker/ Cgroup v2 delegation, see https://rootlesscontaine.rs/getting-started/common/cgroup2/ Kernel 5.11 or later (5.13 or later is recommended when SELinux is enabled), see https://rootlesscontaine.rs/how-it-works/overlayfs/ Usage Start a cluster using the rootless docker driver: dockerd-rootless-setuptool.sh install -f docker context use rootless minikube start --driver=docker --container-runtime=containerd Unlike Podman driver, it is not necessary to set the rootless property of minikube (minikube config set rootless true). When the rootless property is explicitly set but the current Docker host is not rootless, minikube fails with an error. It is recommended to set the --container-runtime flag to “containerd”. Special features Cross platform (linux, macOS, Windows) No hypervisor required when run on Linux Experimental support for WSL2 on Windows 10 Known Issues The following Docker runtime security options are currently unsupported and will not work with the Docker driver (see #9607): userns-remap On macOS, containers might get hung and require a restart of Docker for Desktop. See docker/for-mac#1835 The ingress, and ingress-dns addons are currently only supported on Linux. See #7332 On WSL2 (experimental - see #5392), you may need to run: sudo mkdir /sys/fs/cgroup/systemd && sudo mount -t cgroup -o none,name=systemd cgroup /sys/fs/cgroup/systemd. Also see co/docker-driver open issues. Troubleshooting Verify Docker container type is Linux On Windows, make sure Docker Desktop’s container type setting is Linux and not windows. see docker docs on switching container type. You can verify your Docker container type by running: docker info --format '{{.OSType}}' Run with logs Run --alsologtostderr -v=1 for extra debugging information Deploying MySql on a linux with AppArmor On Linux, if you want to run MySQL pod, you need to disable AppArmor for mysql profile If your docker has AppArmor enabled, running mysql in privileged mode with docker driver will have the issue #7401. There is a workaround - see moby/moby#7512. .feedback--answer { display: inline-block; } .feedback--answer-no { margin-left: 1em; } .feedback--response { display: none; margin-top: 1em; } .feedback--response__visible { display: block; } Feedback Was this page helpful? Yes No Glad to hear it! Please tell us how we can improve. Sorry to hear that. Please tell us how we can improve. const yesButton = document.querySelector('.feedback--answer-yes'); const noButton = document.querySelector('.feedback--answer-no'); const yesResponse = document.querySelector('.feedback--response-yes'); const noResponse = document.querySelector('.feedback--response-no'); const disableButtons = () => { yesButton.disabled = true; noButton.disabled = true; }; const sendFeedback = (value) => { if (typeof gtag !== 'function') return; gtag('event', 'page_helpful', { 'event_category': 'Helpful', 'event_label': window.location.pathname, 'value': value }); }; yesButton.addEventListener('click', () => { yesResponse.classList.add('feedback--response__visible'); disableButtons(); sendFeedback( 100 ); }); noButton.addEventListener('click', () => { noResponse.classList.add('feedback--response__visible'); disableButtons(); sendFeedback(0); }); Last modified November 8, 2024: site: add step manage-docker-as-a-non-root-user in the requirements of docker driver