["https://minikube.sigs.k8s.io/docs/handbook/deploying"]
title = "Deploying apps | minikube"
description = "How to deploy an application to minikube"
full_description = "Documentation Handbook Deploying apps Deploying apps How to deploy an application to minikube kubectl kubectl create deployment hello-minikube1 --image=kicbase/echo-server:1.0 kubectl expose deployment hello-minikube1 --type=LoadBalancer --port=8080 Addons minikube has a built-in list of applications and services that may be easily deployed, such as Istio or Ingress. To list the available addons for your version of minikube: minikube addons list To enable an add-on, see: minikube addons enable <name> To enable an addon at start-up, where –addons option can be specified multiple times: minikube start --addons <name1> --addons <name2> For addons that expose a browser endpoint, you can quickly open them with: minikube addons open <name> To disable an addon: minikube addons disable <name> .feedback--answer { display: inline-block; } .feedback--answer-no { margin-left: 1em; } .feedback--response { display: none; margin-top: 1em; } .feedback--response__visible { display: block; } Feedback Was this page helpful? Yes No Glad to hear it! Please tell us how we can improve. Sorry to hear that. Please tell us how we can improve. const yesButton = document.querySelector('.feedback--answer-yes'); const noButton = document.querySelector('.feedback--answer-no'); const yesResponse = document.querySelector('.feedback--response-yes'); const noResponse = document.querySelector('.feedback--response-no'); const disableButtons = () => { yesButton.disabled = true; noButton.disabled = true; }; const sendFeedback = (value) => { if (typeof gtag !== 'function') return; gtag('event', 'page_helpful', { 'event_category': 'Helpful', 'event_label': window.location.pathname, 'value': value }); }; yesButton.addEventListener('click', () => { yesResponse.classList.add('feedback--response__visible'); disableButtons(); sendFeedback( 100 ); }); noButton.addEventListener('click', () => { noResponse.classList.add('feedback--response__visible'); disableButtons(); sendFeedback(0); }); Last