["https://minikube.sigs.k8s.io/docs/handbook/untrusted_certs"]
title = "Certificates | minikube"
description = "All about TLS certificates"
full_description = "Documentation Handbook Certificates Certificates All about TLS certificates Untrusted Root Certificates Many organizations deploy their own Root Certificate and CA service inside the corporate networks. Internal websites, image repositories and other resources may install SSL server certificates issued by this CA service for security and privacy concerns. You may install the Root Certificate into the minikube cluster to access these corporate resources within the cluster. Tutorial You will need a corporate X.509 Root Certificate in PEM format. If it’s in DER format, convert it: openssl x509 -inform der -in my_company.cer -out my_company.pem Copy the certificate into the certs directory: mkdir -p $HOME/.minikube/certs cp my_company.pem $HOME/.minikube/certs/my_company.pem Then restart minikube with the --embed-certs flag to sync the certificates: minikube start --embed-certs .feedback--answer { display: inline-block; } .feedback--answer-no { margin-left: 1em; } .feedback--response { display: none; margin-top: 1em; } .feedback--response__visible { display: block; } Feedback Was this page helpful? Yes No Glad to hear it! Please tell us how we can improve. Sorry to hear that. Please tell us how we can improve. const yesButton = document.querySelector('.feedback--answer-yes'); const noButton = document.querySelector('.feedback--answer-no'); const yesResponse = document.querySelector('.feedback--response-yes'); const noResponse = document.querySelector('.feedback--response-no'); const disableButtons = () => { yesButton.disabled = true; noButton.disabled = true; }; const sendFeedback = (value) => { if (typeof gtag !== 'function') return; gtag('event', 'page_helpful', { 'event_category': 'Helpful', 'event_label': window.location.pathname, 'value': value }); }; yesButton.addEventListener('click', () => { yesResponse.classList.add('feedback--response__visible'); disableButtons(); sendFeedback( 100 ); }); noButton.addEventListener('click', () => { noRespons