["https://minikube.sigs.k8s.io/docs/drivers/podman"]
title = "podman | minikube"
description = """
Overview The podman driver is an alternative container runtime to the Docker driver.
Requirements Install podman
Experimental This is an experimental driver. Please use it only for experimental reasons until it has reached maturity. For a more reliable minikube experience, use a non-experimental driver, like Docker.
Usage It’s recommended to run minikube with the podman driver and CRI-O container runtime (except when using Rootless Podman):
minikube start --driver=podman --container-runtime=cri-o Alternatively, start minikube with the podman driver only:"""
full_description = "Documentation Drivers podman podman Overview The podman driver is an alternative container runtime to the Docker driver. Requirements Install podman Experimental This is an experimental driver. Please use it only for experimental reasons until it has reached maturity. For a more reliable minikube experience, use a non-experimental driver, like Docker. Usage It’s recommended to run minikube with the podman driver and CRI-O container runtime (except when using Rootless Podman): minikube start --driver=podman --container-runtime=cri-o Alternatively, start minikube with the podman driver only: minikube start --driver=podman To make podman the default driver: minikube config set driver podman Rootless Podman By default, minikube executes Podman with sudo. To use Podman without sudo (i.e., Rootless Podman), set the rootless property to true: minikube config set rootless true For Rootless Podman, it is recommended to set --container-runtime to containerd: minikube start --driver=podman --container-runtime=containerd See the Rootless Docker section for the requirements and the restrictions. Known Issues On Linux, Podman requires passwordless running of sudo. If you run into an error about sudo, do the following: $ sudo visudo Then append the following to the section at the very bottom of the file where username is your user account. username ALL=(ALL) NOPASSWD: /usr/bin/podman Be sure this text is after #includedir /etc/sudoers.d. To confirm it worked, try: sudo -k -n podman version On all other operating systems, make sure to create and start the virtual machine that is needed for Podman. podman machine init --cpus 2 --memory 2048 --disk-size 20 podman machine start podman system connection default podman-machine-default-root podman info Also see co/podman-driver open issues. Troubleshooting Run minikube start --alsologtostderr -v=7 to debug errors and crashes .feedback--answer { display: inline-block; } .feedback--answer-no { margin-left: 1em; } .feedback--response { display: none; margin-top: 1em; } .feedback--response__visible { display: block; } Feedback Was this page helpful? Yes No Glad to hear it! Please tell us how we can improve. Sorry to hear that. Please tell us how we can improve. const yesButton = document.querySelector('.feedback--answer-yes'); const noButton = document.querySelector('.feedback--answer-no'); const yesResponse = document.querySelector('.feedback--response-yes'); const noResponse = document.querySelector('.feedback--response-no'); const disableButtons = () => { yesButton.disabled = true; noButton.disabled = true; }; const sendFeedback = (value) => { if (typeof gtag !== 'function') return; gtag('event', 'page_helpful', { 'event_category': 'Helpful', 'event_label': window.location.pathname, 'value': value }); }; yesButton.addEventListener('click', () => { yesResponse.classList.add('feedback--response__visible'); disableButtons(); sendFeedback( 100 ); }); noButton.addEventListener('click', () => { noResponse.classList.add('feedback--response__visible'); disableButtons(); sendFeedback(0); }); Last modified April 5, 2023: Fix link to GitHub open issues label for drivers (d1297d391)"
