title = "minikube start | minikube"
description = """
minikube is local Kubernetes, focusing on making it easy to learn and develop for Kubernetes.
All you need is Docker (or similarly compatible) container or a Virtual Machine environment, and Kubernetes is a single command away: minikube start
What you’ll need 2 CPUs or more 2GB of free memory 20GB of free disk space Internet connection Container or virtual machine manager, such as: Docker, QEMU, Hyperkit, Hyper-V, KVM, Parallels, Podman, VirtualBox, or VMware Fusion/Workstation 1Installation Click on the buttons that describe your target platform. For other architectures, see the release page for a complete list of minikube binaries."""
full_description = '''Documentation Get Started! minikube start minikube is local Kubernetes, focusing on making it easy to learn and develop for Kubernetes. All you need is Docker (or similarly compatible) container or a Virtual Machine environment, and Kubernetes is a single command away: minikube start What you’ll need 2 CPUs or more 2GB of free memory 20GB of free disk space Internet connection Container or virtual machine manager, such as: Docker, QEMU, Hyperkit, Hyper-V, KVM, Parallels, Podman, VirtualBox, or VMware Fusion/Workstation 1Installation const architectures = [ "Linux/x86-64", "Linux/ARM64", "Linux/ppc64", "Linux/S390x", "Linux/ARMv7", "macOS/x86-64", "macOS/ARM64", "Windows/x86-64" ]; console.time("timerReleaseFetch"); fetch('https://api.github.com/repos/kubernetes/minikube/releases') .then((response) => response.json()) .then((releases) => { console.timeEnd("timerReleaseFetch"); if (releases && releases.length > 0 && releases[0] && releases[0].tag_name) { const isBetaMostRecent = releases[0].tag_name.includes("-beta"); if (isBetaMostRecent) { for (architecture of architectures) { const betaElement = document.querySelector(`button[data-quiz-id="/${architecture}/Beta"]`); if (betaElement) { betaElement.classList.remove("hide"); } } } } }) .catch(console.error); Click on the buttons that describe your target platform. For other architectures, see the release page for a complete list of minikube binaries. Operating system Linux macOS Windows Architecture x86-64 ARM64 ARMv7 ppc64 S390x Release type Stable Beta Installer type Binary download Debian package RPM package Installer type Binary download Debian package RPM package Release type Stable Beta Installer type Binary download Debian package RPM package Installer type Binary download Debian package RPM package Release type Stable Beta Installer type Binary download Debian package RPM package Installer type Binary download Debian package RPM package Release type Stable Beta Installer type Binary download Debian package RPM package Installer type Binary download Debian package RPM package Release type Stable Beta Installer type Binary download Debian package RPM package Installer type Binary download Debian package RPM package Architecture x86-64 ARM64 Release type Stable Beta Installer type Binary download Homebrew Installer type Binary download Release type Stable Beta Installer type Binary download Homebrew Installer type Binary download Architecture x86-64 Release type Stable Beta Installer type .exe download Windows Package Manager Chocolatey Installer type .exe download To install the latest minikube stable release on x86-64 Linux using binary download: curl -LO https://github.com/kubernetes/minikube/releases/latest/download/minikube-linux-amd64 sudo install minikube-linux-amd64 /usr/local/bin/minikube && rm minikube-linux-amd64 To install the latest minikube beta release on x86-64 Linux using binary download: r=https://api.github.com/repos/kubernetes/minikube/releases curl -LO $(curl -s $r | grep -o 'http.*download/v.*beta.*/minikube-linux-amd64' | head -n1) sudo install minikube-linux-amd64 /usr/local/bin/minikube && rm minikube-linux-amd64 To install the latest minikube stable release on x86-64 Linux using Debian package: curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube_latest_amd64.deb sudo dpkg -i minikube_latest_amd64.deb To install the latest minikube beta release on x86-64 Linux using Debian package: r=https://api.github.com/repos/kubernetes/minikube/releases u=$(curl -s $r | grep -o 'http.*download/v.*beta.*/minikube_.*_amd64.deb' | head -n1) curl -L $u > minikube_beta_amd64.deb && sudo dpkg -i minikube_beta_amd64.deb To install the latest minikube stable release on x86-64 Linux using RPM package: curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-latest.x86_64.rpm sudo rpm -Uvh minikube-latest.x86_64.rpm To install the latest minikube beta release on x86-64 Linux using RPM package: r=https://api.github.com/repos/kubernetes/minikube/releases u=$(curl -s $r | grep -o 'http.*download/v.*beta.*/minikube-.*.x86_64.rpm' | head -n1) curl -L $u > minikube-beta.x86_64.rpm && sudo rpm -Uvh minikube-beta.x86_64.rpm To install the latest minikube stable release on ARM64 Linux using binary download: curl -LO https://github.com/kubernetes/minikube/releases/latest/download/minikube-linux-arm64 sudo install minikube-linux-arm64 /usr/local/bin/minikube && rm minikube-linux-arm64 To install the latest minikube beta release on ARM64 Linux using binary download: r=https://api.github.com/repos/kubernetes/minikube/releases curl -LO $(curl -s $r | grep -o 'http.*download/v.*beta.*/minikube-linux-arm64' | head -n1) sudo install minikube-linux-arm64 /usr/local/bin/minikube && rm minikube-linux-arm64 To install the latest minikube stable release on ARM64 Linux using Debian package: curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube_latest_arm64.deb sudo dpkg -i minikube_latest_arm64.deb To install the latest minikube beta release on ARM64 Linux using Debian package: r=https://api.github.com/repos/kubernetes/minikube/releases u=$(curl -s $r | grep -o 'http.*download/v.*beta.*/minikube_.*_arm64.deb' | head -n1) curl -L $u > minikube_beta_arm64.deb && sudo dpkg -i minikube_beta_arm64.deb To install the latest minikube stable release on ARM64 Linux using RPM package: curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-latest.aarch64.rpm sudo rpm -Uvh minikube-latest.aarch64.rpm To install the latest minikube beta release on ARM64 Linux using RPM package: r=https://api.github.com/repos/kubernetes/minikube/releases u=$(curl -s $r | grep -o 'http.*download/v.*beta.*/minikube-.*.aarch64.rpm' | head -n1) curl -L $u > minikube-beta.aarch64.rpm && sudo rpm -Uvh minikube-beta.aarch64.rpm To install the latest minikube stable release on ppc64 Linux using binary download: curl -LO https://github.com/kubernetes/minikube/releases/latest/download/minikube-linux-ppc64le sudo install minikube-linux-ppc64le /usr/local/bin/minikube && rm minikube-linux-ppc64le To install the latest minikube beta release on ppc64 Linux using binary download: r=https://api.github.com/repos/kubernetes/minikube/releases curl -LO $(curl -s $r | grep -o 'http.*download/v.*beta.*/minikube-linux-ppc64le' | head -n1) sudo install minikube-linux-ppc64le /usr/local/bin/minikube && rm minikube-linux-ppc64le To install the latest minikube stable release on ppc64 Linux using Debian package: curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube_latest_ppc64le.deb sudo dpkg -i minikube_latest_ppc64le.deb To install the latest minikube beta release on ppc64 Linux using Debian package: r=https://api.github.com/repos/kubernetes/minikube/releases u=$(curl -s $r | grep -o 'http.*download/v.*beta.*/minikube_.*_ppc64le.deb' | head -n1) curl -L $u > minikube_beta_ppc64le.deb && sudo dpkg -i minikube_beta_ppc64le.deb To install the latest minikube stable release on ppc64 Linux using RPM package: curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-latest.ppc64el.rpm sudo rpm -Uvh minikube-latest.ppc64el.rpm To install the latest minikube beta release on ppc64 Linux using RPM package: r=https://api.github.com/repos/kubernetes/minikube/releases u=$(curl -s $r | grep -o 'http.*download/v.*beta.*/minikube-.*.ppc64el.rpm' | head -n1) curl -L $u > minikube-beta.ppc64el.rpm && sudo rpm -Uvh minikube-beta.ppc64el.rpm To install the latest minikube stable release on S390x Linux using binary download: curl -LO https://github.com/kubernetes/minikube/releases/latest/download/minikube-linux-s390x sudo install minikube-linux-s390x /usr/local/bin/minikube && rm minikube-linux-s390x To install the latest minikube beta release on S390x Linux using binary download: r=https://api.github.com/repos/kubernetes/minikube/releases curl -LO $(curl -s $r | grep -o 'http.*download/v.*beta.*/minikube-linux-s390x' | head -n1) sudo install minikube-linux-s390x /usr/local/bin/minikube && rm minikube-linux-s390x To install the latest minikube stable release on S390x Linux using Debian package: curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube_latest_s390x.deb sudo dpkg -i minikube_latest_s390x.deb To install the latest minikube beta release on S390x Linux using Debian package: r=https://api.github.com/repos/kubernetes/minikube/releases u=$(curl -s $r | grep -o 'http.*download/v.*beta.*/minikube_.*_s390x.deb' | head -n1) curl -L $u > minikube_beta_s390x.deb && sudo dpkg -i minikube_beta_s390x.deb To install the latest minikube stable release on S390x Linux using RPM package: curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-latest.s390x.rpm sudo rpm -Uvh minikube-latest.s390x.rpm To install the latest minikube beta release on S390x Linux using RPM package: r=https://api.github.com/repos/kubernetes/minikube/releases u=$(curl -s $r | grep -o 'http.*download/v.*beta.*/minikube-.*.s390x.rpm' | head -n1) curl -L $u > minikube-beta.s390x.rpm && sudo rpm -Uvh minikube-beta.s390x.rpm To install the latest minikube stable release on ARMv7 Linux using binary download: curl -LO https://github.com/kubernetes/minikube/releases/latest/download/minikube-linux-arm sudo install minikube-linux-arm /usr/local/bin/minikube && rm minikube-linux-arm To install the latest minikube beta release on ARMv7 Linux using binary download: r=https://api.github.com/repos/kubernetes/minikube/releases curl -LO $(curl -s $r | grep -o 'http.*download/v.*beta.*/minikube-linux-arm' | head -n1) sudo install minikube-linux-arm /usr/local/bin/minikube && rm minikube-linux-arm To install the latest minikube stable release on ARMv7 Linux using Debian package: curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube_latest_armhf.deb sudo dpkg -i minikube_latest_armhf.deb To install the latest minikube beta release on ARMv7 Linux using Debian package: r=https://api.github.com/repos/kubernetes/minikube/releases u=$(curl -s $r | grep -o 'http.*download/v.*beta.*/minikube_.*_armhf.deb' | head -n1) curl -L $u > minikube_beta_armhf.deb && sudo dpkg -i minikube_beta_armhf.deb To install the latest minikube stable release on ARMv7 Linux using RPM package: curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-latest.armv7hl.rpm sudo rpm -Uvh minikube-latest.armv7hl.rpm To install the latest minikube beta release on ARMv7 Linux using RPM package: r=https://api.github.com/repos/kubernetes/minikube/releases u=$(curl -s $r | grep -o 'http.*download/v.*beta.*/minikube-.*.armv7hl.rpm' | head -n1) curl -L $u > minikube-beta.armv7hl.rpm && sudo rpm -Uvh minikube-beta.armv7hl.rpm To install the latest minikube stable release on x86-64 macOS using Homebrew: If the Homebrew Package Manager is installed: brew install minikube If which minikube fails after installation via brew, you may have to remove the old minikube links and link the newly installed binary: brew unlink minikube brew link minikube To install the latest minikube stable release on x86-64 macOS using binary download: curl -LO https://github.com/kubernetes/minikube/releases/latest/download/minikube-darwin-amd64 sudo install minikube-darwin-amd64 /usr/local/bin/minikube To install the latest minikube beta release on x86-64 macOS using binary download: r=https://api.github.com/repos/kubernetes/minikube/releases curl -LO $(curl -s $r | grep -o 'http.*download/v.*beta.*/minikube-darwin-amd64' | head -n1) sudo install minikube-darwin-amd64 /usr/local/bin/minikube To install the latest minikube stable release on ARM64 macOS using binary download: curl -LO https://github.com/kubernetes/minikube/releases/latest/download/minikube-darwin-arm64 sudo install minikube-darwin-arm64 /usr/local/bin/minikube To install the latest minikube stable release on ARM64 macOS using Homebrew: If the Homebrew Package Manager is installed: brew install minikube If which minikube fails after installation via brew, you may have to remove the old minikube links and link the newly installed binary: brew unlink minikube brew link minikube To install the latest minikube beta release on ARM64 macOS using binary download: r=https://api.github.com/repos/kubernetes/minikube/releases curl -LO $(curl -s $r | grep -o 'http.*download/v.*beta.*/minikube-darwin-arm64' | head -n1) sudo install minikube-darwin-arm64 /usr/local/bin/minikube To install the latest minikube stable release on x86-64 Windows using Windows Package Manager: If the Windows Package Manager is installed, use the following command to install minikube: winget install Kubernetes.minikube To install the latest minikube stable release on x86-64 Windows using Chocolatey: If the Chocolatey Package Manager is installed, use the following command: choco install minikube To install the latest minikube stable release on x86-64 Windows using .exe download: Download and run the installer for the latest release. Or if using PowerShell, use this command: New-Item -Path 'c:\' -Name 'minikube' -ItemType Directory -Force Invoke-WebRequest -OutFile 'c:\minikube\minikube.exe' -Uri 'https://github.com/kubernetes/minikube/releases/latest/download/minikube-windows-amd64.exe' -UseBasicParsing Add the minikube.exe binary to your PATH. Make sure to run PowerShell as Administrator. $oldPath = [Environment]::GetEnvironmentVariable('Path', [EnvironmentVariableTarget]::Machine) if ($oldPath.Split(';') -inotcontains 'C:\minikube'){ [Environment]::SetEnvironmentVariable('Path', $('{0};C:\minikube' -f $oldPath), [EnvironmentVariableTarget]::Machine) } If you used a terminal (like powershell) for the installation, please close the terminal and reopen it before running minikube. To install the latest minikube beta release on x86-64 Windows using .exe download: Download and run the installer for the latest beta release. Or if using PowerShell, use this command: New-Item -Path 'c:\' -Name 'minikube' -ItemType Directory -Force $response = Invoke-WebRequest -Uri 'https