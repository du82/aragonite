title = "Welcome! | minikube"
description = """
minikube quickly sets up a local Kubernetes cluster on macOS, Linux, and Windows. We proudly focus on helping application developers and new Kubernetes users.
🎉 Latest Release: v1.35.0 - Jan 15, 2025 (changelog)
Highlights Supports the latest Kubernetes release (+6 previous minor versions) Cross-platform (Linux, macOS, Windows) Deploy as a VM, a container, or on bare-metal Multiple container runtimes (CRI-O, containerd, docker) Direct API endpoint for blazing fast image load and build Advanced features such as LoadBalancer, filesystem mounts, FeatureGates, and network policy Addons for easily installed Kubernetes applications Supports common CI environments Survey We have a fast 5-question survey to learn how & why you are using minikube, and what improvements we should make. We would love to hear from you! 🙏"""
