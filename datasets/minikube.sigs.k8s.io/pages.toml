["https://minikube.sigs.k8s.io/docs/handbook/dashboard"]
title = "Dashboard | minikube"
full_description = "Documentation Handbook Dashboard Dashboard Dashboard minikube has integrated support for the Kubernetes Dashboard UI. Overview The Dashboard is a web-based Kubernetes user interface. You can use it to: deploy containerized applications to a Kubernetes cluster troubleshoot your containerized application manage the cluster resources get an overview of applications running on your cluster creating or modifying individual Kubernetes resources (such as Deployments, Jobs, DaemonSets, etc) For example, you can scale a Deployment, initiate a rolling update, restart a pod or deploy new applications using a deploy wizard. Basic usage To access the dashboard: minikube dashboard This will enable the dashboard add-on, and open the proxy in the default web browser. It’s worth noting that web browsers generally do not run properly as the root user, so if you are in an environment where you are running as root, see the URL-only option. To stop the proxy (leaves the dashboard running), abort the started process (Ctrl+C). Getting just the dashboard URL If you don’t want to open a web browser, the dashboard command can also simply emit a URL: minikube dashboard --url Reference For additional information, see the official Dashboard documentation. .feedback--answer { display: inline-block; } .feedback--answer-no { margin-left: 1em; } .feedback--response { display: none; margin-top: 1em; } .feedback--response__visible { display: block; } Feedback Was this page helpful? Yes No Glad to hear it! Please tell us how we can improve. Sorry to hear that. Please tell us how we can improve. const yesButton = document.querySelector('.feedback--answer-yes'); const noButton = document.querySelector('.feedback--answer-no'); const yesResponse = document.querySelector('.feedback--response-yes'); const noResponse = document.querySelector('.feedback--response-no'); const disableButtons = () => { yesButton.disabled = true; noButton.disabled = true; }; const sendFeedback = (value) => { i