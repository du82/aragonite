full_description = '''Documentation Drivers vmware vmware Overview The vmware driver supports virtualization across all VMware based hypervisors. Requirements VMware Fusion Driver Installation If the Brew Package Manager is installed, run: brew install docker-machine-driver-vmware Otherwise: r=https://api.github.com/repos/machine-drivers/docker-machine-driver-vmware d=docker-machine-driver-vmware_darwin_amd64 u=$(curl -s $r/releases/latest | grep -o 'http.*Darwin_amd64.tar.gz' | head -n1) mkdir $d \ && (cd $d && curl -L $u > $d.tar.gz && tar -xf $d.tar.gz) \ && install $d/docker-machine-driver-vmware /usr/local/bin/docker-machine-driver-vmware \ && rm -rf $d Usage Start a cluster using the vmware driver: minikube start --driver=vmware To make vmware the default driver: minikube config set driver vmware No documentation is available yet. Requirements VMware Workstation Driver Installation First install the VMware Workstation After installation, start a cluster using the vmware driver: minikube start --driver vmware Issues Full list of open ‘vmware-driver’ issues Troubleshooting Run minikube start --alsologtostderr -v=7 to debug crashes .feedback--answer { display: inline-block; } .feedback--answer-no { margin-left: 1em; } .feedback--response { display: none; margin-top: 1em; } .feedback--response__visible { display: block; } Feedback Was this page helpful? Yes No Glad to hear it! Please tell us how we can improve. Sorry to hear that. Please tell us how we can improve. const yesButton = document.querySelector('.feedback--answer-yes'); const noButton = document.querySelector('.feedback--answer-no'); const yesResponse = document.querySelector('.feedback--response-yes'); const noResponse = document.querySelector('.feedback--response-no'); const disableButtons = () => { yesButton.disabled = true; noButton.disabled = true; }; const sendFeedback = (value) => { if (typeof gtag !== 'function') return; gtag('event', 'page_helpful', { 'event_category': 'Helpful', 'event_label':