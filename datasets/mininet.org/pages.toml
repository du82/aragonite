["https://mininet.org/blog/2013/07/11/sdn-course"]
title = "Nick Feamster's SDN Course - Mininet"
description = "I just want to put in a recommendation for Nick Feamster’s excellent Software Defined Networking course. It’s free on Coursera, and not only does he …"
full_description = "Nick Feamster's SDN Course Jul 11th, 2013 5:53 pm I just want to put in a recommendation for Nick Feamster’s excellent Software Defined Networking course. It’s free on Coursera, and not only does he do a great job of clearly explaining SDN, network virtualization, and related topics, he has also created some excellent videos explaining the usage, design, and rationale for the Mininet system, which is also being used for programming assignments and labs in the course. There are also interesting interviews with notable people like Martin Casado, David Clark, and Teemu Koponen. It’s quite excellent, very approachable for anyone who has a basic networking background, and highly recommended: https://www.coursera.org/course/sdn The course has already started, but as of today (Thursday July 11th) you can still sign up for it. -Bob Posted by Mininet Project Contributors Jul 11th, 2013 5:53 pm course, sdn, tutorial « Automating Controller Startup Announcing Mininet 2.1.0 ! »"
