full_description = "Mininet: An Instant Virtual Network on Your Laptop (or Other PC) article header { display: none; } Mininet creates a realistic virtual network, running real kernel, switch and application code, on a single machine (VM, cloud or native), in seconds, with a single command: Because you can easily interact with your network using the Mininet CLI (and API), customize it, share it with others, or deploy it on real hardware, Mininet is useful for development, teaching, and research. Mininet is also a great way to develop, share, and experiment with Software-Defined Networking (SDN) systems using OpenFlow and P4. Mininet is actively developed and supported, and is released under a permissive BSD Open Source license. We encourage you to contribute code, bug reports/fixes, documentation, and anything else that can improve the system! Get Started Download a Mininet VM, do the walkthrough and run the OpenFlow tutorial. Support Read the FAQ, read the documentation, and join our mailing list, mininet-discuss. Contribute File a bug, download the source, or submit a pull request - all on GitHub."
