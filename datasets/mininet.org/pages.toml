["http://mininet.org/blog/2017/03/21/mininet-vm-security-advisory"]
title = "Mininet VM Security Advisory - Mininet"
description = "Unfortunately, installing the Ubuntu SSH package into a VM image causes default SSH keys to be generated. In the case of the Mininet VM, this means …"
full_description = "Mininet VM Security Advisory Mar 21st, 2017 4:29 pm Unfortunately, installing the Ubuntu SSH package into a VM image causes default SSH keys to be generated. In the case of the Mininet VM, this means that the VM images for Mininet 2.2.1 and earlier included the same set of default SSH keys (which could leave you open to a MITM attack.) This probably isn’t surprising to many of you, but we’re changing it in the Mininet VM images to avoid this issue. As of Mininet 2.2.2, we no longer ship default SSH keys in the provided Mininet VM; we remove them before upload, and new SSH keys should be generated the first time you boot a Mininet 2.2.2 VM image. If you are logging into an older Mininet VM over the internet or another non-secure network, we highly recommend regenerating your SSH keys if you haven’t done so already: 1 2 3 sudo rm -f /etc/ssh/*key* sudo /usr/sbin/dpkg-reconfigure openssh-server sudo service ssh restart Alternately, you are welcome to download a new Mininet 2.2.2 VM image. If you’re distributing a VM image for any purpose, we recommend removing any SSH keys before uploading it! Additional information on Mininet 2.2.2 may be found at http://mininet.org/blog/2017/03/17/announcing-mininet-2-2-2/ Posted by Mininet Project Contributors Mar 21st, 2017 4:29 pm mininet, security « Announcing Mininet 2.2.2 Mininet wins ACM SIGCOMM SOSR Software Systems Award ! »"
author = "Mininet Project Contributors"
year_published = 2017
clearnet = "http://mininet.org/blog/2017/03/21/mininet-vm-security-advisory"
