full_description = "Return our interface object with given string name, default intf if name is falsy (None, empty string, etc). Having this fcn return its arg for Intf objects makes it easier to construct functions with flexible input args for interfaces (those that accept both string names and Intf objects). Send a command, followed by a command to echo a sentinel, and return without waiting for the command to complete. Reimplemented in mininet.node.IVSSwitch, mininet.node.OVSSwitch, mininet.node.UserSwitch, mininet.node.Switch, and mininet.nodelib.LinuxBridge. Completion is signaled by a sentinel character, ASCII(127) appearing in the output stream. Wait for the sentinel and return the output, including trailing newline."
