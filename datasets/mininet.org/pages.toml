full_description = "Announcing Mininet 2.3.0 ! Feb 28th, 2021 5:50 pm We are pleased to announce Mininet 2.3.0 ! This release provides a number of bug fixes as well as new features, including support for Python 3 (as well Python 2) and installation from source on Ubuntu 20.04 LTS as well as Debian 10+. Please check out additional details on the Mininet 2.3.0 release in the release notes on docs.mininet.org. How to Get Started The easiest way to get started with Mininet is to download a VM image. See Download for details. The latest Mininet source code is available on GitHub and also via code.mininet.org. Mininet is an open source project, and we are grateful to our many code contributors, bug reporters, and active users who continue to help make Mininet a useful system with a friendly and helpful community. We look forward to seeing what you will do to transform and improve the networking world. Have fun with Mininet! Posted by Mininet Project Contributors Feb 28th, 2021 5:50 pm mininet, releases « Mininet wins ACM SIGCOMM Test of Time Paper Award"
