["http://mininet.org/news"]
title = "Mininet"
description = """
We are pleased to announce
Mininet 2.3.0 ! This release provides a number of bug fixes as well as new features,
including support for Python 3 (as …"""
full_description = "Announcing Mininet 2.3.0 ! Feb 28th, 2021 5:50 pm We are pleased to announce Mininet 2.3.0 ! This release provides a number of bug fixes as well as new features, including support for Python 3 (as well Python 2) and installation from source on Ubuntu 20.04 LTS as well as Debian 10+. Please check out additional details on the Mininet 2.3.0 release in the release notes on docs.mininet.org. How to Get Started The easiest way to get started with Mininet is to download a VM image. See Download for details. The latest Mininet source code is available on GitHub and also via code.mininet.org. Mininet is an open source project, and we are grateful to our many code contributors, bug reporters, and active users who continue to help make Mininet a useful system with a friendly and helpful community. We look forward to seeing what you will do to transform and improve the networking world. Have fun with Mininet! Mininet Wins ACM SIGCOMM Test of Time Paper Award Jun 29th, 2020 5:23 pm We are pleased to announce that our original HotNets paper, A Network in a Laptop: Rapid Prototyping for Software-Defined Networks, has won the ACM SIGCOMM Test of Time Paper Award. Congratulations to the authors, Bob Lantz, Brandon Heller, and Nick McKeown, and congratulations and thanks to the many researchers, teachers, students, users, collaborators, and project contributors who have used and continue to use Mininet to help usher in the SDN revolution and improve the practice of computer networking! Congrats to Mininet SIGCOMM Hackathon Winners! Aug 27th, 2018 3:39 pm Congratulations to Alexander Jung, Michał Król and Torsten Runge, who prototyped a Mininet node class for launching unikernels - small application-specific kernel images, basically an application linked with a library OS, ClickOS being one example - and ended up placing in the SIGCOMM 2018 Hackathon! http://conferences.sigcomm.org/sigcomm/2018/hackathon.html In their case they used Rumprun as the unikernel system and qemu/kvm to launch it: http://github.com/nderjung/mininet (Branch: devel/rump) http://github.com/rumpkernel/rumprun/ http://unikernel.org They are planning on continuing to work on it, so I hope we can get something simple and useful running and perhaps added to Mininet!"
