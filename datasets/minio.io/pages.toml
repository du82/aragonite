["https://minio.io/cohasset/summary-assessment-of-compliance-with-cftc-rule-1.31c-d"]
title = "MinIO Compliance Report: SEC, FINRA, CFTC Standards Summary"
full_description = "The objective of this section is to document Cohasset’s assessment of the capabilities of MinIO Object Storage, as described in Section 1.3, MinIO Object Storage Overview and Assessment Scope, in comparison to the CFTC requirements. The individual relevant requirements cited in Section 2, Assessment of Compliance with SEC Rule 17a-4(f), are based on the wording in SEC Rule 17a-4(f) and Cohasset’s interpretation of the requirements, given the associated SEC Interpretive Releases. Specifically, the SEC’s 2003 Interpretive Release reiterates that the Rule sets forth standards that the electronic storage media must satisfy to be considered an acceptable method of storage under SEC Rule 17a-4: A broker-dealer would not violate the requirement in paragraph (f)(2)(ii)(A) of the rule if it used an electronic storage system that prevents the overwriting, erasing or otherwise altering of a record during its required retention period through the use of integrated hardware and software control codes. [emphasis added] Accordingly, it is Cohasset’s opinion that the requirements set forth in SEC Rule 17a-4(f) are technology-neutral and apply to any electronic solution with (a) integrated control codes that extend to the electronic storage system and (b) features that deliver capabilities that meet the requirements of the Rule. The August 28, 2017, amendments to CFTC Rule 1.31 establish technology-neutral, principle-based requirements. As illustrated in the table in this section, it is Cohasset’s opinion that the requirements of the modernized CFTC Rule may be achieved by meeting the SEC requirements. When comparing the capabilities of MinIO Object Storage that align with the SEC requirements to the principles- based CFTC requirements, it is essential to recognize that the SEC Rule separately describes requirements for index data and audit trail, whereas the CFTC in 17 CFR § 1.31(a) establishes an expanded definition of an electronic regulatory record to include the information as specified in paragraph (i) and (ii) below."
author = "MinIO, Inc."
year_published = 2025
