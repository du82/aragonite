["https://minio.io/product/aistor/events-and-lambdas"]
title = "MinIO | Events and Lambdas"
description = "MinIO Events & Lambdas: Automate workflows with event notifications to Kafka or RabbitMQ, and transform objects on demand for compliance, PII redaction & more!"
full_description = "Two of these features that we often use are Events and Lambda. You can use Bucket Events Notification with various targets such as Kafka, RabbitMQ, ElasticSearch, among others to automate ETL pipelines asynchronously and then transform the objects using Lambda for operations such as Regulatory compliance and redacting PII. MinIO notifications allow administrators to send notifications to external services such as Kafka or RabbitMQ for certain object or bucket events. MinIO supports bucket and object-level S3 events similar to the Amazon S3 Event Notifications. With asynchronous delivery, MinIO fires the event at the configured remote and does not wait for a response before continuing to the next event. Asynchronous bucket notification prioritizes sending events with the risk of some events being lost if the remote target has a transient issue during transit or processing. With synchronous delivery, MinIO fires the event at the configured remote and then waits for the remote to confirm a successful receipt before continuing to the next event. Synchronous bucket notification prioritizes delivery of events with the risk of a slower event-send rate and queue fill. MinIO’s Object Lambda enables developers to programmatically transform objects on demand. You can transform objects as needed for your use case, such as redacting personally identifiable information (PII), enriching data with information from other sources, or converting between formats. Like Amazon S3 Object Lambda functions, you trigger a MinIO Object Lambda handler function with a GET request from an application. The handler retrieves the requested object from MinIO, transforms it, and returns the modified data back to MinIO to send to the original application. The original object remains unchanged. You can write a handler function in any language capable of sending and receiving HTTP requests. It must be able to: You are using Internet Explorer version 11 or lower. Due to security issues and lack of support for web standards, it is highly recommended that you upgrade to a modern browser."
