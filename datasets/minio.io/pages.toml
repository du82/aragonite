full_description = '''MinIO IAM is built with AWS Identity and Access Management (IAM) compatibility at its core and presents that framework to applications and users across varying public clouds, private clouds and the edge. MinIO extends AWS IAM compatibility with support for popular external identity providers such as ActiveDirectory/LDAP, Okta and Keycloak. Identity is authentication - the verification of "who" a connecting application is and their right to claim that identity. Only after an application presents a valid identity and a corresponding proof of that identity - such as a username and corresponding password, may it connect to MinIO. Access Management is authorization - the granting of permissions to an authenticated application. The application can only access those resources and perform those actions for which it has explicit permission. In the object storage world, users don't log into datastores - applications do. Accordingly, MinIO IAM is built to support both manual (static) and programmatic (dynamic) application-focused identity management. For manual identity creation, customers can use the MinIO Console. For programmatic identity creation, customers can use MinIO’s `mc` command line interface. MinIO supports an internal identity management functionality. When using MinIO's internal management, the creation of a new user identity follows the access key and secret key credential framework. Applications will use those credentials to authenticate every time they perform operations on the MinIO cluster. MinIO recommends creating one user per application to mitigate the security risk associated with leaked long-lived user credentials by leveraging the mechanisms of user authentication and identity management. MinIO does not limit the number of users that can be managed and the number of users has negligible impact on system performance. MinIO also supports leading third-party external identity providers (IDP). These standalone systems specialize in the creation, authentication, and management of user identities. Supported IDPs include:'''
