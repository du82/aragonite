["http://minnie.tuhs.org/minnie.html"]
title = "Who is Minnie?"
description = "Who is Minnie?"
full_description = "At present (December 2015), Minnie is a 2.5GHz Xeon virtual machine with 2G of RAM and 48G of SSD disk space, and is hosted by Linode. It is running Ubuntu. It provides anonymous ftp, many mailing lists, a web server and some CGI scripts, and is the prime repository for the Unix Archive. No user accounts are available. Minnie is fully funded out of my own pocket. Donations, expressions of gratitude and constructive criticisms welcome :-) Minnie is run with minimal housekeeping - I'm a full-time teacher. Your patience is very much appreciated. In mid-1988 I bought a 10MHz XT clone to play with Minix; I was also an avid Goon Show fan. By January 1989, the machine had been christened `Minnie'. At the end of 1989 I took a job at ADFA and bought a 386SX to replace the XT. In May 1991, Minnie (the XT) was brought in to work to become a small FTP server for my Minix and amateur radio interests. Here is the original announcement of the ftp site on Minnie (and cache). From 1990 to 2000, Minnie's hardware was the hand-me-down equipment from my home PC, running a not-so-recent operating system. In 2000, I bought a new Celeron to break the trend. Here is a table showing Minnie's configuration since 1990. It's interesting to see how the figures have changed. The 486DX with FreeBSD was the best, most reliable old box I've ever had. She commonly had uptimes well over 70 days, with a few times over 100 days. The main reason for crashes was power failures; we typically have 2 or 3 a year. On the last day of her service, the 486 pumped out 1.2G of HTTP, 2.2G of FTP and 3.7G of rsync traffic. The system load never rose above 2.5. Sometime around 2010 I had to move Minnie out of her physical existence in Australia and into a virtual existence. I should try to dig out the date when this occurred. Here's a graph of Minnie's main hardware details over time, with dotted lines showing a line of best fit. I've left out the changeover to a virtual system. It seems like Moore's Law works over the given time period."
