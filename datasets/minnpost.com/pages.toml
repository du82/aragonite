["https://www.minnpost.com/artscape/2025/02/artists-and-art-supply-industry-balk-at-minnesotas-ban-on-cadmium-paint"]
title = "Artists and balk at Minnesota’s ban on cadmium paint"
description = "The 2023 law that went under the radar restricts the imports, sale and distribution of products containing lead or cadmium."
full_description = "Artscape The latest news and events across all forms of the arts. Delivered every Friday. Sign up Artscape Newsletter | Subscribe for the latest news and events across all forms of the arts. Delivered to your inbox every Thursday. Sign up A Minnesota law that quietly passed in 2023 has got Minnesota artists and art supply sellers seeing red. The law, Minn. Stat. § 325E.3892, went into effect July 1, 2023. It restricts the imports, sale and distribution of products containing lead or cadmium. The law encompasses a whole list of products from jewelry and toys to cosmetics, kitchenware, school supplies, and clothing, and it also includes professional artist supplies including paint – oil, acrylic, watercolor, etc. – that contain cadmium. You can’t buy any professional artist paint containing cadmium in an art supply store in Minnesota, and you also can’t order it online and have it shipped to a Minnesota address. Bob Buchsbaum, CEO of Dick Blick, said anyone living in Minnesota who tries to order cadmium paint from the Dick Blick website will have their order put on hold. “You’ll get a call from somebody on our end that will say, ‘Hey, we had to place your order on hold because you ordered a product that we can’t ship to Minnesota.’” If you’re familiar with Gustav Klimt’s “The Kiss,” that gives you an idea of what cadmium yellow looks like. It’s that warm, glowing yellow that envelops the two lovers in the painting. Without cadmium red, the startling bursts of flowers in Claude Monet’s “Wild Poppies Near Argenteuil” might not be quite as stunning.Claude Monet, Still Life with Apples and Grapes, 1880 Credit: Wikimedia CommonsRep. Rick Hansen (DFL-South St. Paul) initially sponsored the bill. His legislative assistant told me he wasn’t available for an interview, but provided a statement saying the ban was a governor’s initiative put forward by the Minnesota Pollution Control Agency last biennium, “with compelling testimony from the agency,” Hansen’s statement read. “I’m open to further conversations about the impact this law is having in practice and if potential changes are needed.”On Feb. 28, 2023, Minnesota Pollution Control Agency (MPCA) Commissioner Katrina Kessler gave a presentation to the House Environment and Natural Resources Finance and Policy Committee where she proposed the agency “expand current reporting limits on lead and cadmium to a broader range of products across a wider age range, using more protective testing and expanding compliance and enforcement. Lead disrupts neurological development in children and leads to chronic effects such as behavioral issues and lower IQ.” According to Rep. Bjorn Olson (R-Fairmont), at the end of the legislative session when the bill was passed, “Everything got wrapped up really fast.” The bill’s language used the same language proposed by the MPCA that made a blanket ban on all products with lead and cadmium. Then in the summer of 2024, Olson heard from a constituent named Jim Pollard, who is an artist. “He lives and works in my area, and he says, ‘Bjorn, this is a devastating blow to the state of Minnesota and to Western art culture in general,’” Olson told me.Vincent van Gogh, Grapes, Lemons, Pears, and Apples, 1887 Credit: Wikimedia Commons .wp-block-newspack-blocks-homepage-articles article .entry-title{font-size: 1.2em;}.wp-block-newspack-blocks-homepage-articles .entry-meta{display: flex;flex-wrap: wrap;align-items: center;margin-top: 0.5em;}.wp-block-newspack-blocks-homepage-articles article .entry-meta{font-size: 0.8em;}.wp-block-newspack-blocks-homepage-articles article .avatar{height: 25px;width: 25px;}.wp-block-newspack-blocks-homepage-articles .post-thumbnail{margin: 0;margin-bottom: 0.25em;}.wp-block-newspack-blocks-homepage-articles .post-thumbnail img{height: auto;width: 100%;}.wp-block-newspack-blocks-homepage-articles .post-thumbnail figcaption{margin-bottom: 0.5em;}.wp-block-newspack-blocks-homepage-articles p{margin: 0.5em 0;} Latest from Artscape Incarcerated artists featured in powerful exhibit, ‘Seen’ at the Weisman Rising star Dua Saleh returns ‘home’ Exploring the life of the undocumented and gay in ‘Sanctuary City’ In January, Olson introduced an amendment to the bill, which would create an exemption for artist paint. That bill is now offline due to the legal battle over Minnesota’s House of Representatives. Meanwhile, a companion bill in the Minnesota Senate, introduced by Sen. Rich Draheim (R-Madison Lake), similarly proposes an elimination of the prohibition against artist paint. “My hope is that by the end of this session, we can have a slight exemption,” he said. “I’ve been talking with some regulatory lawyers who work with some of these art supply companies and trying to figure out the proper language. But essentially, it’s going to exempt paints and pastels that use cadmium paint.” The MPCA, however, doesn’t support an exception to the law, I was told by Becky Lentz, interim director of Communications of the MPCA, “Due to the toxic properties of these metals and their availability to the general public.” In a statement, Lentz wrote: “Lead or cadmium in household products can cause serious problems for brain health and human development, especially in children, whose bodies are still developing. No amount of lead is considered safe in children, according to the Centers for Disease Control, and high levels of lead in children can cause behavioral problems, shorter attention spans, slower growth, and decreased coordination. Many people know lead is harmful and possibly fatal when swallowed, so some manufacturers now use cadmium as a replacement, particularly in inexpensive jewelry. This alternative is marginally safer at best. Breathing in cadmium dust or swallowing an item containing cadmium can cause vomiting, diarrhea, abdominal pain, muscle aches, and organ damage.”There are currently no other states or countries in the world that ban cadmium in artist paint. When Sweden called for a European ban on cadmium in artist paint in 2013, the European Chemicals Agency rejected the ban after its Registration, Evaluation, Authorisation and Restriction of Chemicals (REACH) committee concluded that “the contribution from artists’ paints to cadmium input to soil, and thereby to crops … is negligible compared to the contribution from other sources.” The agency found “the impact of cadmium paints was de minimis,” said David H. Baker, the legal director with The Art and Creative Materials Institute, Inc., an international association for arts and crafts manufacturers. “You would expect Europe to be much more regulatory-oriented than most places,” he said.Notice of the Minnesota Statue that prohibits the sale of cadmium paint at Art Materials in Detroit Lakes. Credit: Courtesy of Art MaterialsSo what exactly is cadmium, and why is it a big deal for artists that it’s banned? First of all, cadmium is an element. It’s used in batteries and electroplating, it’s inhaled by people who smoke cigarettes, and it’s used in all sorts of different paints. “The cadmium line of colors goes from cadmium red deep, which is a really luscious rich red, all the way through the cadmium oranges, to all the cadmium yellows, and cadmium green, which is this really vibrant green,” said Mat Ollig, a Minnesota-based oil painter. “All of the vibrant colors on the palate are cadmiums.” Ollig said he found out about the Minnesota ban on cadmium paint in November. He was shocked. “The argument I heard was that they’re trying to keep it from waterways, but artists are such a tiny, tiny group of people, and we want that pigment on the canvas,” he said. “We don’t want it down the drains or anything like that.”Mat Ollig, Summer Heat, 2024Cadmium is a product of the industrial revolution, according to Darin Rinne, co-owner of the artist supply store Wet Paint, in St. Paul. “It was the middle 1800s to late 1800s when that really started gaining steam,” he said. “And that’s when you see a very popular movement called Impressionism.”According to Rinne, impressionist art was the direct result of cadmium pigment. “Without cadmium, there is no impressionism because cadmium mixes to a soft, mellow mixture,” he said. “I guess it’s more of a grayish than it is a lightened pink or yellow, so you can achieve more life-like effects of light with cadmium pigments.” The law is a “crushing blow” to the arts community, according to Rinne. “There’s not science to support artist materials being swept up in this ban,” he said. Artist paints currently on the market don’t contain raw cadmium. Instead, the pigment is fused with sulfides and coated with a binder, so that the cadmium becomes insoluble in water.An image of Mat Ollig’s palette with the “illegal” section highlighted. Credit: Courtesy of Mat Ollig“The pigment manufacturers have taken great care to make these bio-friendly, so they are buffered – they don’t get absorbed into the system,” Rinne said. “They don’t just go into you and set up shop, and that’s true if it goes into the wastewater too.”According to Minnesota’s law, products that contain lead at more than 0.009% by total weight (90 parts per million) or cadmium at more than 0.0075% by total weight (75 parts per million) are forbidden.That’s where it gets tricky for art supply stores, said Finnegan Roy-Nyline, assistant manager at the Art Cellar, the on-campus art supply store at the Minneapolis College of Art and Design. “The paint manufacturers will do a relatively good job of telling you what pigments are in the tube of paint,” he said. “The difficult part is that there’s really no information on how much of these components are in the tubes of paint.” Meredith Hylton, a manager at the Art Cellar, said she learned about the law in August of 2024, when the store received a letter about it from one of their manufacturers. “We felt like this came out of left field,” she said. “None of our distributors knew anything about it. So then we immediately started to ask, OK, what does this mean? What do we need to do?” Over the past several months, store staff have been navigating a path forward. “It’s just been a labyrinth as we try to mitigate risks as much as possible with the information that’s been given to us,” she said. Meanwhile, the store has been working to find alternatives to offer to their artist and student clients. Roy-Nyline said that was the exciting part. “Cadmium and lead are toxic, and it’d be great if we could move away from them,” Roy-Nyline said. “So this really was an opportunity for us to think about what it would look like as people move away from these pigments. Color science is constantly changing, and I think a lot of industries can be a little slow to catch up.”Roy-Nyline said it’s been interesting to dive into some of the new alternatives and synthetic pigments, many of which have different color temperatures and are not at the same standard that student artists typically learn from.“The faculty here all learned with these traditional palettes. It’s a little technical, but it’s exciting as we move away from these colors. It’s going to take some adaptation,” said Roy-Nyline.But some artists won’t use the alternatives. “You simply can’t oil paint without cadmium,” is what artist Caitlin Karolczak told me when I reached out to her for this article. “Cadmium red is the best for the type of mixing I do. It’s not really replaceable.” When she uses other tones of red “it goes straight to pink-purple and not the kind you want,” she said. Karolczak said she has her paints stocked up – often she buys oil paints at estate sales, and is hopeful the law will change. Non-cadmium red and yellows, she said, are simply not suitable for a painter like her. “They can pry it from my cold dead fingers,” she said.Editor’s note: This story was updated to reflect recent proposed amendments to bills in the House and Senate to carve-out exemptions for cadmium usage for artists. Sheila ReganSheila Regan is a Twin Cities-based arts journalist. She writes MinnPost’s twice-weekly Artscape column. She can be reached at sregan@minnpost.com. Articles like this one are available, completely free 365 days a year. MinnPost relies on reader donations to keep our reporting paywall-free. Will you make a donation today to help us stay free for all to access? Give now Related Tagged: Arts & Culture"
