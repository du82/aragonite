["https://www.minnpost.com/artscape/2025/02/rising-star-dua-saleh-returns-home"]
title = "Rising star Dua Saleh returns 'home'"
description = "Listed as one of “25 Artists to Watch in 2025” by the Recording Academy, Dua Saleh performs Sunday at the Fine Line."
full_description = "Artscape The latest news and events across all forms of the arts. Delivered every Friday. Sign up Artscape Newsletter | Subscribe for the latest news and events across all forms of the arts. Delivered to your inbox every Thursday. Sign up As they tour the world promoting their first full-length album, “I Should Call Them,” Dua Saleh is passing through the Twin Cities – one of the places the singer, songwriter, poet, actor and artist calls home. Born in Sudan, Saleh moved to the U.S. as a refugee and grew up in the Rondo neighborhood in St. Paul. Fluent in activism and poetry from a young age, Saleh was immersed in the performance scene of the Twin Cities early on at places like Intermedia Arts and 20% Theatre Company before really taking off with music.Saleh has acted on the hit television show “Sex Education” and last year, announced they joined the Recording Academy, paving the way to participate in the 2025 Grammy Awards as a voting member. In January, they were listed as one of “25 Artists to Watch in 2025” on Grammy.com. Versed in multiple art forms, Saleh’s radical authenticity shines through in how they channel their spirit through music, acting and their writing. In their recent album, Saleh’s offers an intimate flow of sensations and connection, with a danceable beat. I had planned to have a Zoom interview with Saleh, but then the fires broke out in Los Angeles and we had to cancel. A couple of weeks later, I was able to conduct an interview over text message while they were traveling as a passenger. Here’s the conversation. It’s been edited for length and clarity. Sheila Regan: Experiencing the fires in LA sounds like it was awful – anything you can say about that experience? Dua Saleh: The fires happened near my area in the Pasadena neighborhood, so I was able to smell the smoke and feel it in my throat a lot. The first day of the fires I evacuated because I didn’t want to wake up in the middle of the night thinking about “what ifs.” In the end I was more concerned about people in the areas affected. My tour for my debut album is taking place now, so I didn’t have much time to help, but I did donate essential items to folks affected in the Pasadena area a day before we flew out to our first sold out show in Seattle. Overall, it was a scary experience. My mom suggested that I set an alarm every hour to wake up in case the embers hit my area so I didn’t get much sleep. SR: I’m so sorry. That must be scary especially as a singer to deal with all that smoke! DS: I got spooked twice with my voice giving out during the tour as well. SR: How was the tour launch in Seattle? Anything you might say about the vibe of the crowd for this tour? .wp-block-newspack-blocks-homepage-articles article .entry-title{font-size: 1.2em;}.wp-block-newspack-blocks-homepage-articles .entry-meta{display: flex;flex-wrap: wrap;align-items: center;margin-top: 0.5em;}.wp-block-newspack-blocks-homepage-articles article .entry-meta{font-size: 0.8em;}.wp-block-newspack-blocks-homepage-articles article .avatar{height: 25px;width: 25px;}.wp-block-newspack-blocks-homepage-articles .post-thumbnail{margin: 0;margin-bottom: 0.25em;}.wp-block-newspack-blocks-homepage-articles .post-thumbnail img{height: auto;width: 100%;}.wp-block-newspack-blocks-homepage-articles .post-thumbnail figcaption{margin-bottom: 0.5em;}.wp-block-newspack-blocks-homepage-articles p{margin: 0.5em 0;} Latest from Artscape Incarcerated artists featured in powerful exhibit, ‘Seen’ at the Weisman Artists and art supply industry balk at Minnesota’s ban on cadmium paint Exploring the life of the undocumented and gay in ‘Sanctuary City’ DS: It was great! I got a chance to do a live performance at KEXP, which was really special. They were so amazing. We sold out of sweaters and tees that night. People were dancing and it was really sweet to do a meet n greet with folks from the area. A couple of people we met even came to a show in Atlanta recently as well because they loved the performance. My mind was blown. I wish I had gotten the chance to do a drag king look for them but the radio performance and concert were on the same day. But next time I’ll do something special for them especially since they started out the “I Should Call Them” world tour. SR: Have you used drag much in your performances before? DS: No, this is the first year I’ve done drag honestly. I’ve done a full beard on my face and a couple of mustaches here and there but nothing grand like this year. SR: Can you tell me about the experience of doing drag? When and where did you end up doing it? DS: Usually I do it in the green room or on the bus. SR: Ah! So it’s more casual. Any plans to take it to a bigger scale? DS: No, I don’t think I have the talent for that. I’m just a RuPaul enthusiast honestly. Some of these looks are more similar to gay club kid makeup like folks used to do in the UK around the 1980s. SR: That reminds me, I wanted to ask you about acting in “Sex Education” and your time in England. Did you notice much of a difference in the queer scene in the UK as opposed to the U.S.? DS: While shooting for “Sex Education,” I noticed that there are a lot more questioning people in the UK that aren’t as open about their sexual experiences with queer partners. I’m one of those people that receive insight on people’s deep seated questions because they feel comfortable with me. Or maybe they feel that I’m a symbol that represents something greater for them. But a lot of people have come out to me in the times I’ve frequented the United Kingdom. There seems to be an unspoken tradition of queerness in the air in London. The scene in the U.S. is filled with pride. Most likely because of the number of protests and parades that people have had in celebration of our LGBTQIA+ icons and ancestors. The large hubs for LGBTQIA+ ballroom scenes and gay night clubs are better funded and have more spotlighting because of our legacy. SR: That’s really interesting about so many people coming out to you. Do you think it might be because you are so open as a person/artist? DS: Most likely. I wear my heart on my sleeve and my emotions on my face and that gives people comfort. Transparency and honesty are met with ease most often. Or those things are met with the struggle needed to better approach life in a forthright way. SR: That’s beautiful. Is that vulnerable way of being in the world something that you just are without thinking, or do you think you nurture it – like for instance, does your artistic process lend to that kind of transparency? Do you journal or do other practices that lend to this kind of being? DS: I think I’ve always just been honest. I’m becoming more transparent in song writing because I value albums that showcase vulnerability. I want to stay true to that artistic tradition. SR: What albums do you think do this kind of vulnerability the best? DS: D’Angelo’s “Voodoo.” Beyoncé’s “B’Day.” Doechii’s “Alligator Bites Never Heal.” SR: How do you maintain this kind of openness in a time where there’s such an onslaught in the political realm like attacks on LGBTQ, attacks on immigrants, DEI – do you experience any fight/flight response to this? Is the work you’ve been talking about to stay free kind of a protection from that fight/flight? DS: I feel like my instinct in this political realm is to do what my queer ancestors have done in the past. Fight for the rights of this generation and generations to come. I’m adamant about educating the public on issues with the platform I’ve been blessed with by reposting informationals on the issues at hand. I think the freedom I crave for is being infringed upon with this new presidency at hand. We’re in a different era of governance and it’s really interesting that we can carve out breathing room to even find freedom in these transient zones of existence. SR: Do you think you’ll return to acting in the future? DS: Yeah! I hope to after I’m done with this album rollout. I recently was in the Recording Academy’s 25 new artists to watch list, so I’m honing in on the opportunities that I’m receiving in music. But I’m in love with acting and would love more opportunities in major film and theater. SR: Any opportunities in music that came out of the 25 new artists to watch you might mention at this time?DS: I’m not certain, but I did get invited to a few red carpets for upcoming artists related to Grammys. This year I couldn’t attend any red carpets because of the tour. SR: Ah, that’s too bad, but doing your own tour seems like a worthy reason to stay away. Maybe next year? DS: Definitely I love the recording academy. They’ve been supporters from Day One. They even took photos of my first performance at SXSW in 2019.SR: I know you also have a background in activism, and that clearly comes through in your music. I’m wondering, in what other ways is activism part of your life outside of music? Do you see getting more involved with the current political climate? DS: I wouldn’t say I’m an activist, but I would say I’m supportive of the organizing community because they do so much to world-make. Worlds that I hope to see for future generations. But I’m just a singer who’s informed. SR: What does home mean to you? DS: Home is where the wind takes us. For me, it travels through familiar terrains: Sudan, St. Paul, the East Coast, LA, the UK. In a way, I stay true to my nomadic heritage, finding home in the stories I hear from strangers or the meals offered by friends that I’ve gained through my experiences on tour. It’s the sound of my mother using a basin to wash up before she sets her feet on a prayer mat, the laughter that ricochets off the glass in a recording studio, the sound of rigs being hoisted on tour. Home feels like where I need to be.Dua Saleh performs with openers Xinas and SoulFlower, Sunday, Feb. 16 at 7:30 p.m. at the Fine Line, 318 North 1st Ave. Minneapolis. ($33). More information here. Articles like this one are available, completely free 365 days a year. MinnPost relies on reader donations to keep our reporting paywall-free. Will you make a donation today to help us stay free for all to access? Give now Related Tagged: Arts & Culture"
