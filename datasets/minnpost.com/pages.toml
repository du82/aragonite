full_description = "MinnPost Staff | Contact Us | Become a Member | Subscribe to Our Newsletters Our MissionMinnPost produces independent journalism to serve as a trusted guide for Minnesotans exploring the critical issues, challenges and opportunities facing our state.What We DoMinnPost is an independent, nonprofit newsroom producing in-depth reporting on the most consequential civic and cultural affairs in Minnesota. We have no political or commercial interest. Our only agenda is to be a trusted guide. We expose problems, highlight solutions and inspire informed action. Our areas of greatest expertise include city and state politics, Minnesota’s congressional delegation in Washington, health, the environment and arts & culture.With a belief that quality journalism is a public good, our reporting is always free to everyone through our website and newsletters. We keep no paywalls, and we openly share our original reporting for re-publication with partners across the state.In addition to our in-depth reporting by professional journalists, we publish commentary pieces written by members of our community. MinnPost does not endorse candidates for office or publish unsigned editorials representing an institutional position.MinnPost adheres to the Society of Professional Journalists’ Code of Ethics.MinnPost is committed to transparency, including our own financial information:2023 MinnPost Form 990 2023 MinnPost Audit ReportCommunity SupportWe believe that in-depth, civic-minded journalism is a community asset that sustains democracy and quality of life, and we rely on individual donors, foundations, advertisers and sponsors to sustain our work.As of December 2023, MinnPost had nearly 5,000 member-donor households contributing amounts ranging from $1 to more than $20,000 a year. Over half of our donors are sustaining members who make automatic recurring donations.You can view the 2023 individual donor list here. MinnPost is grateful to recognize our generous supporters, and we’re committed to transparency to our readers about the sources of our funding.Major FundersMinnPost’s initial funding of $850,000 came from four families: John and Sage Cowles, Lee Lynch and Terry Saario, Joel and Laurie Kramer, and David and Vicki Cox. Currently, grant support comes from: Arnold Ventures (general operating), the Otto Bremer Trust (Greater Minnesota reporting), the McKnight Foundation (general operating), the Joyce Foundation (effective democracy and environment), the Fund for Nonprofit News at The Miami Foundation (general operating matching funds), Google News Initiative (program support) and the Fredrikson & Byron Foundation (general operating).Board of DirectorsThe 2024 MinnPost Board of Directors are Peter Hutchinson, Chair; Adair Mosley, Vice Chair; Katie Cole, Treasurer; Kari Ruth, Secretary; Lee Lynch, Chair Emeritus; Tanner Curl, ex-officio; Ellen Archibald, A.J. Colianni, Fran Davis, Jack Dempsey, Jim Erickson, Nancy Feldman, Jill Field, Diane Hofstede, Tom Horner, Jonathan Kealing, Jay Kiedrowski, Joel Kramer, Laurie Kramer, Glenn Miller, Max Musicant, Marsha Pitts-Phillips, Karen Schanfield, Rebecca Shavlik, Toya Stewart Downey and Leslie Suzukamo.In 2021, MinnPost’s board of directors adopted the following pledge toward the organization’s efforts around diversity, equity and inclusion:MinnPost will assure that the diverse experiences and voices of all people of Minnesota and the Native Nations who share that geography are represented and heard in our board, our staff, and in the journalism we produce. The MinnPost board of directors supports our staff’s commitment to equitable journalism and will work to increase diversity, equity and inclusion in our workplace. The board’s commitment does not signify a moment, but, rather, a journey of reflection and challenging conversations grounded in values of anti-racism and equitable practices. It is only by recognizing and addressing past and ongoing injustices that we are able to properly fulfill our mission to our stakeholders, members and readers. MinnPost Board Of Directors 2024 with affiliations [PDF]"
