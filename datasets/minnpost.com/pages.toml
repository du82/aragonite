["https://www.minnpost.com/artscape/2025/02/incarcerated-artists-featured-in-powerful-exhibit-seen-at-weisman"]
title = "Incarcerated artists featured in powerful exhibit, 'Seen' at Weisman"
description = '"Seen," at the Weisman Art Museum in Minneapolis, pairs together artists living inside and outside of prison facilities.'
full_description = "Artscape The latest news and events across all forms of the arts. Delivered every Friday. Sign up Artscape Newsletter | Subscribe for the latest news and events across all forms of the arts. Delivered to your inbox every Thursday. Sign up In one of the gallery rooms that make up “Seen,” an exhibition at the Weisman Art Museum curated by Emily Baxter, comfortable orange and yellow cushions are set up amidst a blooming garden. They are part of an installation by Ronald “Bino” Greer II and Diane Willow called “When a Garden Becomes a Canopy of Verses” (2024). The installation creates a warm sanctuary space of flowering trees, tubs filled with plants and greenery, and towering lattices overhead that create the feeling of being in a hut. As you sit on the cushions, you feel like you’re in a cozy greenhouse, while Greer’s poetry surrounds you. “Uprooted,” begins one poem printed on one of the tubs with marigold lettering. “Elbow deep into soil/ I’ve dug my worries & joys/ wiggle my fingers like roots / stretching to water. No matter / how deep I borrow, my world / Unfurls.” Greer and Willow’s collaboration is one of seven installations that pairs together artists living inside and outside of prison facilities. Years in the planning, the exhibition shines a light onto the often demoralizing and inhumane conditions experienced by people in prison. It also asks viewers to recognize the humanity of the incarcerated artists expressing their thoughts, feelings and experiences. I spoke with Greer, one of the two artists that created the garden installation, over Zoom when I visited the museum on Saturday. He’s a self-taught violinist and writer, originally from Detroit. He’s been incarcerated since 1999. “With everybody in the space, it really gives something to the soul,” he told me. “All the time that we waited, all of the work and effort that we put forth, came out into the exhibit that you’re walking through.” Greer’s poems offer a meditation on nature and green space, two things notably absent in a prison. The poems are scattered throughout the installation, and evoke peaceful imagery of gardens: “Every Morning is New/ Tangled in vines/the whispers of daybreak/ drips in relief from leaf/to leaf.” Taken with the plants, light, and spacious design, the environment offers visitors a comfortable and beautiful place to rest, as well as a moment to reflect on why green space is essential for survival. When I asked Greer what surprised him about working on the project, he said it was realizing the impact that he and the other incarcerated artists could have for others. “This collaboration allowed me to understand better that I could impact somebody outside of this space, outside of this environment,” he said. “I can reach people that I never thought I could reach before, and build connections through that.” .wp-block-newspack-blocks-homepage-articles article .entry-title{font-size: 1.2em;}.wp-block-newspack-blocks-homepage-articles .entry-meta{display: flex;flex-wrap: wrap;align-items: center;margin-top: 0.5em;}.wp-block-newspack-blocks-homepage-articles article .entry-meta{font-size: 0.8em;}.wp-block-newspack-blocks-homepage-articles article .avatar{height: 25px;width: 25px;}.wp-block-newspack-blocks-homepage-articles .post-thumbnail{margin: 0;margin-bottom: 0.25em;}.wp-block-newspack-blocks-homepage-articles .post-thumbnail img{height: auto;width: 100%;}.wp-block-newspack-blocks-homepage-articles .post-thumbnail figcaption{margin-bottom: 0.5em;}.wp-block-newspack-blocks-homepage-articles p{margin: 0.5em 0;} Latest from Artscape Rising star Dua Saleh returns ‘home’ Artists and art supply industry balk at Minnesota’s ban on cadmium paint Exploring the life of the undocumented and gay in ‘Sanctuary City’ Baxter founded We Are All Criminals in 2012, after working first as a defense attorney and then in public policy. She saw up close how the criminal justice system acts as a tool for discrimination. In her groundbreaking book, “We Are All Criminals” (2017), Baxter contrasts stories of people who have gotten away with crimes because of their race, class and zip code, and those who carry criminal records impacting the rest of their lives. The organization has presented its stories across the country through presentations, exhibitions, and through its website. Six years ago, Baxter began to dream up a project in partnership with the Weisman where incarcerated artists would collaborate with artists on the outside. The project saw delays because of COVID-19, which prevented the non-incarcerated artists from visiting the prison facilities. The exhibition finally opened this past Saturday with performances and activities, as well as talks by the artists, including several incarcerated artists present via Zoom or phone.Among them was Lennell “Fresh” Martin, who called into the museum by phone and spoke about his project with poet Erin Sharkey. Sharkey and Martin shared a common experience in that they were both children of incarcerated parents. A visual artist, Martin made austere, monochromatic charcoal drawings of both his and Sharkey’s fathers as part of their installation, “Rootbound” (2024). Their installation also featured a bin filled with objects representing a recent experience Martin said the inmates had to endure. (Read Sharkey’s essay about it here.) “They just made everyone pack up everything and move to a whole other side of the building,” Martin said on speaker phone. “Over 250, 260 men, and the first thing that they wanted us to do was get rid of everything that’s not going to fit into bins.” Martin said he saw people get rid of books, art supplies, and crafts – anything that wasn’t their most cherished letters and cards. Martin wished his mother, Cynthia Fernandez, happy birthday as part of his phone call, in what was a celebratory and emotional day for families and community coming together for the exhibition. Martin’s aunt, Michele Livingston, said there’s an active community of formerly incarcerated people, family members, and community members who have collected in different spaces including the We Are All Criminals project as well as the Minnesota Prison Writing Project. Many of that community were also in Wonderlust Productions’ multi-year “The Labyrinth and the Minotaur: The Incarceration Play Project,” featuring stories and acting by the same community. Livingston’s son, Jefferey Young, also collaborated on a piece with artist Korina Barry. They had a discussion on Barry’s podcast about trauma and other life experiences being passed down through DNA. From that discussion, Barry created a powerful copper double helix sculpture made with sweetgrass. The sculpture is surrounded by a series called “Inherited Scars,” made by multimedia artist C. Fausto Cabrera, who was released from prison in 2024. Faustos’ work draws on Young and Barry’s investigation into memorial tattoos, using tattoo ink to create portraits of all the “Seen” artists who are still incarcerated. On the table: “Braided” by Jeffery Young and Korina Barry; drawings above: “Inherited Scars” by C. Fausto Cabrera. Credit: MinnPost photo by Sheila Regan“It just blew me away,” Livingston said, when she saw her son’s portrait. “He didn’t even tell me this was here.” Diane Mullin, senior curator at the Weisman, said the museum chose to partner with We Are All Criminals as part of the museum’s own mission to address contemporary issues – in this case issues surrounding policing. “We found this to be a really important project,” Mullin said. Mullin added that the exhibition, made up of a number of elaborate installations involving construction design and fabrication, was a significant undertaking for the museum, not to mention coordinating efforts. “It’s very monumental,” she said. Each installation in the exhibition creates its own world. Von Johnson and D.A. Bullock created a domestic space with a plastic-covered sofa and transcripts of telephone calls, complete with disconcerting messages that the phone call time limit is running out. Fong Lee and Kevin Yang, meanwhile, meditate on the challenge of connecting with people after spending time in prison.Van Johnson and D. A. Bullock: “long distance call” (2024).As you enter the first gallery room, Baxter’s own collaborative installation with B Batchelor, “We Can’t Hear Ourselves Sing” (2024), looms overhead. The hanging sculpture is made of 50 metal birdcages, inspired by Paul Laurence Dunbar’s poetic line from 1899, “I know why the caged bird sings,” from the poem “Sympathy,” which in turn inspired Maya Angelou’s 1969 book, “I know why the caged bird sings.” As you look up into the chandelier, light from the Weisman’s skylight streams through the metal, offering a glimmer of hope.B Batchelor and Emily Baxter: “We Can’t Hear Ourselves Sing” (2024). Credit: MinnPost photo by Sheila ReganAdjacent to that work is a project by incarcerated writer Sarith Peou and choreographer Carl Flink, where they’ve worked with Weisman’s construction team to create a labyrinth of three prison cells. Peou survived Cambodian genocide perpetrated by the Khmer Rouge, eventually ending up in a refugee camp before moving to the United States. “He lived with significant post traumatic stress disorder … as a free person for a few years before he made the worst mistake of his life and took two lives,” Baxter said, adding that Peou has spent the past 30 years in prison. “He’s had very few moments in his life where he has been able to control his own body and his own movement.”Sarith Peou and Carl Flink: “cage(d)” (2024). Credit: MinnPost photo by Sheila ReganInside the cells are Peou’s writing and a video featuring Peou’s movements. There’s also a projected animated video that illustrates Peou’s writings chronicling the human condition. In the projection, Peou’s writing goes up into the tree and bursts with flames. A third video piece made in collaboration with dancer Cheng Xiong (a company member with Black Label Movement, where Flink is artistic director) and cinematographer Tamara Ober highlights Peou’s exercise routine. This past Saturday, Xiong was also in the gallery performing in one-hour intervals. Moving from one area of the labyrinth/cage to another, Xiong would break out into jumping jacks and other calisthenics over the course of the hour performance, before resuming to a still, ruminating pose. When I visited the Weisman, director Alejandra Peña Gutiérrez told me she hoped students would come and spend time on the cushions in Greer and Willow’s installation. It’s such an inviting space I can imagine it will be appealing to people that want to spend some time amidst the plants and light. The rest of the exhibition is engaging as well, with spaces to interact and think about the ideas presented with multiple senses. I did have an issue hearing some of the sound pieces, but that may have been because there were so many people on opening day.“Seen” runs through May 18 at the Weisman, 333 E. River Rd., Minneapolis. A panel discussion with Louise Waakaa’igan, Chris Fausto Cabrera and Fong Lee, moderated by Erin Sharkey, will take place Feb. 26 from 6 p.m. to 7:30 p.m. (free). More information here. Sheila ReganSheila Regan is a Twin Cities-based arts journalist. She writes MinnPost’s twice-weekly Artscape column. She can be reached at sregan@minnpost.com. Articles like this one are available, completely free 365 days a year. MinnPost relies on reader donations to keep our reporting paywall-free. Will you make a donation today to help us stay free for all to access? Give now Related Tagged: Arts & Culture"
