title = "2024 Bush Prize winners announced - MinnPost"
description = "2024 Bush Prize winners announced We’re excited to announce the eight organizations selected for the 2024 Bush Prize! The Bush Foundation, in partnership with community grant partners, recently announced the […]"
full_description = "2024 Bush Prize winners announcedWe’re excited to announce the eight organizations selected for the 2024 Bush Prize! The Bush Foundation, in partnership with community grant partners, recently announced the winners throughout the region. Bush Prize winners have a strong track record of successful community problem solving and work collaboratively to make our region better for everyone. Every year we celebrate organizations that are highly valued in communities across the region with the Bush Prize — an award that gives flexible funding of up to $500,000 to further their work in whatever way they see fit. Organizations can build up reserves, test a big idea or anything else that would best support their ongoing work.We’re following the good work of our grant partners who operate each Bush Prize throughout the region and select the winning organizations and finalists in their communities. Learn more about the winners and help us celebrate their work!Bush Prize: Minnesota winners(Operated by the Saint Paul & Minnesota Foundation)Green Card Voices uses multimedia storytelling to build inclusive and integrated communities between immigrants and their neighbors. Minnesota Education Equity Partnership transforms systems, structures, and public narratives to advance race equity and excellence in education. Mni Sota Fund helps build Indigenous wealth and supports the economic self-determination of Indigenous peoples in Mni Sota Makoce (Minnesota).Bush Prize: Native Nations honorees(Operated by the Good Relatives Collaborative)Minnesota Indian Women’s Sexual Assault Coalition supports culturally grounded, grassroots advocacy and provides national leadership to end sexual violence across Minnesota’s 11 federally recognized Tribal Nations, urban Native bases, and Tribal communities. Lakota Nation Invitational convenes the largest multi-sport youth empowerment tournaments in South Dakota, connecting Native youth across a broad spectrum of athletic, academic, and cultural events centered on respect, accountability, and inclusivity.Bush Prize: North Dakota winners(Operated by Strengthen ND)North Dakota Native Vote addresses the unique challenges faced by Native communities throughout the state to ensure Native people have access to and participate in the democratic process. North Dakota Assistive aims to provide access to the latest innovative assistive technologies for people living with disabilities and older adults to create personalized solutions to break barriers.Bush Prize: South Dakota winner(Operated by South Dakota Community Foundation)Call to Freedom helps lead efforts in South Dakota to address and stop human trafficking. Their innovative and collaborative efforts include supporting survivors and raising awareness statewide. Articles like this one are available, completely free 365 days a year. MinnPost relies on reader donations to keep our reporting paywall-free. Will you make a donation today to help us stay free for all to access? Give now Sponsored by Bush Foundation Learn more about Bush Foundation Related"
