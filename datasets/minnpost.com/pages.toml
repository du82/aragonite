full_description = "MinnPost.com offers news stories and features of interest to people who care about Minnesota. With dozens of contributing journalists, our aim is to ensure that everything you see at MinnPost.com includes solid reporting, thought-provoking insights and excellent storytelling. Contact Brian Perry for all advertising inquiries.Brian Perry, Director of Advertising and Sponsorshipe-mail: bperry@minnpost.comcall: 612.638.8488Display AdvertisingBanner ads are sold by the week (Monday through Sunday) and receive a minimum guarantee of 35,000 impressions per week. We do also offer CPM buys if you prefer.MinnPost offers multiple options for on-site display advertising. We will work with you to maximize your value based on your goals. See prices and specs below or Download Rate CardPositiondescriptionSize (all sizes are width by height)Cost per weekLeaderboardThe top position on both mobile and desktop. 970×90 (desktop) and 320×50 (mobile)(1940×180 and 640×100 2x size*)$400Half pageOur largest position is displayed above the fold in the right rail on both the home page and story pages.300×600(600×1200 2x size*)$825Embedded medium rectangleThe embedded position is placed within the body copy of articles as well as the right rail of the home page. Up to 4 embedded banners are displayed per article.300×250 (600×500 2x size*)$550*2x sizes are for high-res monitors. These are optional but recommended. Please design for the original size as that is the display size.Newsletter AdvertisingDaily email: Summary of daily content on Minnpost.Medium rectangle banner (300×250). Monday through Sunday, 160,000+ weekly emails (24,000+ daily opt-in subscribers). $650 net/week. Limited availability. Please contact us for details.Sponsored EmailsEmail sponsorships are the most effective way to connect with our most loyal readers. Your content is sent directly to our email list of over 24,000 subscribers. Open rates average 45%. These are limited to two sponsored emails (total) per month so inventory is very limited. Please contact us for availability. Cost: $5,000 per emailContent supplied by advertiserYou can either send a fully designed html file or simply supply us with your body copy, images and headline and we can build your email in our system.Download Rate Card Targeted Content AdvertisingTarget your message with content section advertising (e.g. Environment, The Daily Glean). Permanent placement in half-page using a 300×600 graphic banner. Availability is limited.Annual Agreement: $3,000 – $20,000(depending on section and position)Less than annual agreement adds 20% premiumBack to TopDeadlines and SpecsWeb site banner formats: medium rectangle: 300×250, half-page: 300×600, super leaderboard: 970×90, mobile ads: 320×50. Banners must have borders. Animation must stop after 10 seconds. Maximum looping 2x. MinnPost.com uses Google Ad Manager and allows third-party serving. Please also include 2x sizes for high-resolution monitors (eg. 300×250 would be 600×500).All creative/tags, URL(s) must be sent to Brian Perry (bperry [at] minnpost.com) at least 3 business days before banner needs to be live on MinnPost.com.Web site files accepted: GIF, HTML5, JPEG, PNG Email banners must be JPEG, PNG or GIF files. Animated GIFs accepted. Animation must stop after 10 seconds.Max file size: 200kBack to TopPolitics Advertising Policy MinnPost does not endorse candidates for political office. We do accept political advertising, as a business transaction, from all candidates for any office. Political advertising is paid in advance. Volume bonuses do apply. First-time advertiser bonuses do not apply. MinnPost will place, at no charge, this disclaimer on all political advertising banners:“MinnPost does not endorse political candidates. See our policy on paid political advertising.” MinnPost reserves the right to remove any messages that we deem are inflammatory, libelous or in bad taste. For more information, contact Brian Perry at bperry@minnpost.com"
