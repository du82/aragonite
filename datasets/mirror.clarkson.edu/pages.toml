["https://mirror.clarkson.edu/isabelle"]
title = "Isabelle"
full_description = "What is Isabelle? Isabelle is a generic proof assistant. It allows mathematical formulas to be expressed in a formal language and provides tools for proving those formulas in a logical calculus. Isabelle was originally developed at the University of Cambridge and Technische Universität München, but now includes numerous contributions from institutions and individuals worldwide. See the Isabelle overview for a brief introduction. Now available: Isabelle2024 (May 2024) Download for Linux (Intel) Download for Linux (ARM) Download for Windows Download for macOS Hardware requirements: Small experiments: 4 GB memory, 2 CPU cores Medium applications: 8 GB memory, 4 CPU cores Large projects: 16 GB memory, 8 CPU cores Extra-large projects: 64 GB memory, 16 CPU cores Some notable changes: More robust and scalable support for distributed build clusters. Official support for ARM64 on Linux (notably Docker on Apple Silicon). HOL: various improvements of theory libraries, notably in HOL-Analysis. HOL: updates and improvements of Sledgehammer. ML: antiquotations for try-catch-finally. ML: physical interrupts are now distinguished from runtime system failures. System: support for global registry in TOML format. System: support the Go development environment (all platforms). System: bundled MLton now includes both Linux and macOS (Intel). See also the cumulative NEWS. Distribution & Support Isabelle is distributed for free under a conglomerate of open-source licenses, but the main code-base is subject to BSD-style regulations. The application bundles include source and binary packages and documentation, see the detailed installation instructions. A vast collection of Isabelle examples and applications is available from the Archive of Formal Proofs. Support is available by the official documentation and mailing lists: The isabelle-users mailing list provides a forum for Isabelle users to discuss problems, exchange information, and make announcements. Users of official Isabelle releases should subscribe or see the archive. The isabelle-dev mailing list covers the Isabelle development process, including intermediate repository versions, and administrative issues concerning the website or testing infrastructure. Early adopters of development snapshots or repository versions should subscribe or see the archive. Zulip Chat is a real-time discussion platform to exchange ideas, ask questions, and collaborate on Isabelle projects, with minimalistic public archive. Stack Overflow and Stack Exchange are a question-and-answer platform, with complex review process but limited discussion facilities."
author = "Tobias Nipkow, Lawrence Paulson, Makarius Wenzel, Gerwin Klein, Florian Haftmann, Tjark Weber, Johannes Hölzl"
year_published = 2025
clearnet = "https://mirror.clarkson.edu/isabelle"
