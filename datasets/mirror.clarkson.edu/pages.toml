["https://mirror.clarkson.edu/about"]
title = "About - mirror.clarkson.edu"
full_description = "History Mirror has been one of our longest running services, and as of today, we can be fairly certain that it now has existed for about 20 years with the earliest knowledge of it existing in October 2002. As part of a COSI History project, we have gone through the history of different pages, including past presentations, and websites archived on the wayback machine. With this, let's take a journey back all the way to the beginning of Mirror and see its progress over the years. We start in December 2001. In this archive of cosi.clarkson.edu, there is a section on the right titled Distributions which lists a few distros as well as plans of wanting to make a Clarkson University Linux distro. Below that it states that COSI would like to pursue mirroring other distributions on the same server as the website. This is the first time that we have evidence of people wanting to have a Mirror in COSI. Jump forward to February 2003 with this archive on mirror.clarkson.edu. At this time, we see that there is now a set of machines actually running just for mirroring. According to the site, the storage was donated by Winchester Systems while the website was running on a SUN Ultra 60 workstation which was loaned out by Mathematics Prof. Scott Fulton. Looking through the site, we were hosting a decent amount of versions of Linux, BSD, and even the kernel (v2.6). Jump ahead to 2009, and the labs have looked at getting a new server for Mirror. On Mathew McCarrell's MP* Page, it was recorded that the server had been obtained and he and Roger Ignazio had worked on trying to install CentOS onto the machine, but ran into some issues. They then tried going over to Open Solaris so they could use ZFS as the filesystem for Mirror, we still use ZFS today. After a bit of tweaking they got CentOS working on Mirror and begun syncing again. Through the history, we can consider this the 2nd iteration of Mirror. Progressing into the 2010s and there were minor software tweaks and changes where we eventually switched over to Debian around 2013. And this brings us up to the fairly modern day. The end of Mirror 2 had about 8TB of usable storage, and we were filling it up to almost max capacity. The drives were aging as well, and around Spring 2015, we begun plans on the 3rd iteration of Mirror. After successfully fundraising for the new mirror in Fall 2015, we purchased the hardware for the machine in December 2015. Through spring 2016, we set up the machine and retired the 2nd iteration of Mirror. At this point Mirror has ~30TB of usable space in the ZFS pool. The 4th iteration of Mirror is the most recent. In Spring 2022 we installed Debian 11 and upgraded the cache ssd, operating system ssd, and created a ZFS pool with eight 16 TB drives. With RAID we have about 60TB of usable space, and potentially more if we continue using the previous drives. We also overhauled the website, tracking, and scheduling subsystems with our own custom code. As servers come and go, there has always been one server for almost the entirety of COSI's existence that has been used as our Mirror. Sponsors Mirror exists today due to generous contributions from students, faculty, and friends of Clarkson University over its lifetime. We would like to thank everyone who has contributed to Mirror, including Eric Busse, Ted Champagne, Steve Evanchik, Wenjin Hu, and Mark Platek. We would also like to thank VMware and Siege Technologies for their support."
year_published = 2025
clearnet = "https://mirror.clarkson.edu/about"
