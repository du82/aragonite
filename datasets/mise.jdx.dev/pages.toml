title = "mise exec | mise-en-place"
description = "mise-en-place documentation"
full_description = 'mise exec ​Usage: mise exec [FLAGS] [TOOL@VERSION]... [-- COMMAND]...Aliases: xSource code: src/cli/exec.rsExecute a command with tool(s) setuse this to avoid modifying the shell session or running ad-hoc commands with mise tools set.Tools will be loaded from mise.toml, though they can be overridden with <RUNTIME> args Note that only the plugin specified will be overridden, so if a mise.toml file includes "node 20" but you run mise exec [email protected]; it will still load node@20.The "--" separates runtimes from the commands to pass along to the subprocess.Arguments ​[TOOL@VERSION]... ​Tool(s) to start e.g.: node@20 [email protected][-- COMMAND]... ​Command string to execute (same as --command)Flags ​-c --command <C> ​Command string to execute-j --jobs <JOBS> ​Number of jobs to run in parallel [default: 4]--raw ​Directly pipe stdin/stdout/stderr from plugin to user Sets --jobs=1Examples:$ mise exec node@20 -- node ./app.js # launch app.js using node-20.x $ mise x node@20 -- node ./app.js # shorter alias # Specify command as a string: $ mise exec node@20 [email protected] --command "node -v && python -V" # Run a command in a different directory: $ mise x -C /path/to/project node@20 -- node ./app.js'
