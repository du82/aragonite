full_description = 'mise en ​Usage: mise en [-s --shell <SHELL>] [DIR]Source code: src/cli/en.rs[experimental] starts a new shell with the mise environment built from the current configurationThis is an alternative to mise activate that allows you to explicitly start a mise session. It will have the tools and environment variables in the configs loaded. Note that changing directories will not update the mise environment.Arguments ​[DIR] ​Directory to start the shell inDefault: .Flags ​-s --shell <SHELL> ​Shell to startDefaults to $SHELLExamples:$ mise en . $ node -v v20.0.0 Skip loading bashrc: $ mise en -s "bash --norc" Skip loading zshrc: $ mise en -s "zsh -f"'
