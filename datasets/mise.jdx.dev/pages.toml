["https://mise.jdx.dev/cli/activate.html"]
title = "mise activate | mise-en-place"
description = "mise-en-place documentation"
full_description = '''mise activate ​Usage: mise activate [FLAGS] [SHELL_TYPE]Source code: src/cli/activate.rsInitializes mise in the current shell sessionThis should go into your shell's rc file or login shell. Otherwise, it will only take effect in the current session. (e.g. ~/.zshrc, ~/.zprofile, ~/.zshenv, ~/.bashrc, ~/.bash_profile, ~/.profile, ~/.config/fish/config.fish, or $PROFILE for powershell)Typically, this can be added with something like the following:echo 'eval "$(mise activate zsh)"' >> ~/.zshrcHowever, this requires that "mise" is in your PATH. If it is not, you need to specify the full path like this:echo 'eval "$(/path/to/mise activate zsh)"' >> ~/.zshrcCustomize status output with status settings.Arguments ​[SHELL_TYPE] ​Shell type to generate the script forChoices:bashelvishfishnuxonshzshpwshFlags ​--shims ​Use shims instead of modifying PATH Effectively the same as:PATH="$HOME/.local/share/mise/shims:$PATH"mise activate --shims does not support all the features of mise activate. See https://mise.jdx.dev/dev-tools/shims.html#shims-vs-path for more information-q --quiet ​Suppress non-error messages--no-hook-env ​Do not automatically call hook-envThis can be helpful for debugging mise. If you run eval "$(mise activate --no-hook-env)", then you can call mise hook-env manually which will output the env vars to stdout without actually modifying the environment. That way you can do things like mise hook-env --trace to get more information or just see the values that hook-env is outputting.Examples:eval "$(mise activate bash)" eval "$(mise activate zsh)" mise activate fish | source execx($(mise activate xonsh)) (&mise activate pwsh) | Out-String | Invoke-Expression'''
year_published = 2025
