["https://mite.yo.lk/blog/2009/11/11/redmine2mite-zeiterfassung-im-projektmanagement-tool-redmine"]
title = "mite.blog. Redmine2mite, das mite.plugin zur Zeiterfassung im Projektmanagement-Tool Redmine"
full_description = "11. November 2009 Redmine2mite, das mite.plugin zur Zeiterfassung im Projektmanagement-Tool Redmine Willkommen im Team: Neben den bereits verfügbaren Anbindungen an die Rechnungstools Billomat, SalesKing & GrandTotal sowie den Bugtracker Mantis arbeitet mite nun auch mit Redmine Hand in Hand. Dank dem von Thomas Klein entwickelten Plugin Redmine2mite können ab sofort Zeiten direkt auf Tickets in Redmine erfasst werden, die dann automatisiert zu mite gesendet werden. Neben der Auswertung von Zeiten auf Ticketebene in Redmine stehen auf diesem Wege weiterhin alle Zeiteinträge aller Teammitglieder zentral parat: im mite.account. Über Redmine Redmine ist ein webbasierter Bugtracker mit erweiterten Projektmanagement-Funktionalitäten. Das auf Basis von Ruby on Rails umgesetzte Tool ist Open-Source und wird aktiv weiterentwickelt. Redmine ist in deutscher und englischer Sprache verfügbar. Was kann das Plugin? Auf Redmine-Tickets erfasste Zeiten sind dank Redmine2mite automatisch ebenfalls in mite verfügbar. Bemerkungen von Zeiteinträgen können optional durch dynamische Informationen wie beispielsweise den Titel oder die ID des Redmine-Tickets ergänzt übergeben werden. Projekte in Redmine können mite.projekten zugeordnet werden. Zudem lässt sich für jedes Projekt in Redmine spezifizieren, welche Leistungen zur Auswahl parat stehen sollen. Verknüpfung einrichten Die Verknüpfung wurde über unsere offene Datenschnittstelle, die mite.api realisiert. Um Redmine mit mite zu verknüpfen, muss zuallererst der Zugriff auf die API in mite aktiviert werden. Die Option findet sich per Klick auf den eigenen Benutzernamen rechts oben. Aktiviere dort einfach die entsprechende Checkbox und kopiere den angezeigten API-Schlüssel. Nach Installation des Plugins erscheint in Redmine in der rechten oberen Ecke ein zusätzlicher Link mit dem Titel »mite«, der zu den Einstellungen führt. Nach Eingabe deines Logins sowie des API-Schlüssels sind die zwei Tools miteinander verbunden. Weitere Einstellungen wie die Zuordnung von Projekten und die Vorauswahl von Leistungen können dann vorgenommen werden. Download Das Zip-Archiv von Redmine2mite findet sich in stets aktuellster Version auf GitHub. Das Plugin wurde von Thomas Klein in Eigenregie entwickelt und unter der freien MIT-Lizenz veröffentlicht. Feedback ist mehr als willkommen! Julia in Neue Features, Add-ons Selbst kommentieren?"
