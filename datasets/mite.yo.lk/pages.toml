["https://mite.yo.lk/blog/2009/03/18/die-rechnung-bitte-billomat-importiert-mit-mite-erfasste-arbeitszeiten"]
title = "mite.blog. Die Rechnung, bitte! Billomat importiert mit mite erfasste Arbeitszeiten."
full_description = "18. März 2009 Die Rechnung, bitte! Billomat importiert mit mite erfasste Arbeitszeiten. »Zeiterfassung ist Fundament realistischer Rechnungen« – so schreibt es sich mite auf die Startseite. Auf diesem Fundament kann nun noch einfacher gebaut werden. Dank der webbasierten Anwendung Billomat werden mit mite erfasste Arbeitszeiten im Handumdrehen zu ordentlichen Rechnungen. Über Billomat Rechnungen und Angebote können mit dem deutschsprachigen Online-Tool Billomat ohne großes Kopfzerbrechen erstellt werden. Eine einfache Verwaltung von Kunden- und Artikeldaten gehört mit zum Paket, ebenso wie der Versand erstellter Rechnungen per Mail, Fax oder Post. Das Tool kommt aus deutschen Landen und unterstützt hier gültige Standards und rechtliche Vorschriften – ein gerade bei der Faktura relevanter Punkt. Der seit Ende 2007 verfügbare Dienst richtet sich vor allem an Einzelkämpfer: Freelancer, Händler und Handwerker. 5 Tarife mit abgestuftem Funktionsumfang stehen zur Auswahl; der kleinste Tarif – ausreichend zum Testen – ist kostenfrei. Rechnungserstellung Mit mite erfasste Arbeitszeiten lassen sich sehr flexibel importieren: sämtliche aus unserem Listenreport bekannten Filter- und Gruppierungsoptionen können auch in Billomat angewendet werden, um nur genau die benötigten Zeiten als Rechnungsposition zu übernehmen. Zeit-Positionen können durch weitere Freiform- oder Artikel-Positionen ergänzt werden. Die üblichen Rechnungsvariablen wie Steuersatz, Skonto etc. ergänzen – fertig. Verknüpfung einrichten Die Integration wurde über unsere offene Datenschnittstelle, die mite.api realisiert. Um Billomat mit mite zu verknüpfen, muss zuallererst der Zugriff auf die API aktiviert werden. Die Option findet sich per Klick auf den eigenen Benutzernamen, rechts oben in mite. Dort einfach die entsprechende Checkbox aktivieren und den dann angezeigten API-Schlüssel kopieren. Zusätzlich zum mite.login wird dann in Billomat unter dem Menüpunkt »Einstellungen => Zeiterfassung mite« dieser API-Schlüssel eingetragen; er dient der sicheren Authentifizierung des Zugriffs. Screencast Die Rechnung, bitte! von mite auf Vimeo. Teamplay Die Anbindungen an mite wurde von dem Team hinter Billomat in Eigeninitiative entwickelt. Unser herzlichstes Dankeschön an Simon Stücher und Steve Mattuschka! Julia in Neue Features, Add-ons Selbst kommentieren?"
