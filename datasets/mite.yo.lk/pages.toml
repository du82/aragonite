["https://mite.yo.lk/blog/tag/diskussion"]
title = "mite.blog. Let's discuss"
description = "Neuigkeiten, Diskussionen, Tipps & Tricks rund um mite, die schlanke Zeiterfassung für Teams & Freiberufler, webbasierte Software & Agile Entwicklung."
full_description = '20. September 2022 Deutschland: Pflicht zur Arbeitszeiterfassung? Letzte Woche urteilte das Bundesarbeitsgericht, dass »der Arbeitgeber […] verpflichtet [ist], ein System einzuführen, mit dem die von den Arbeitnehmern geleistete Arbeitszeit erfasst werden kann.« Ein Paukenschlag, raunt es allerortens. Doch unterm Strich kommt das Urteil nicht wirklich überraschend. Denn das BAG, die höchste Instanz der deutschen Arbeitsgerichtsbarkeit, stellte sich in eine Linie mit dem Europäischen Gerichtshof. Bereits 2019 hatte dieser die Mitgliedstaaten dazu aufgefordert, Arbeitgeber zu »verpflichten, ein objektives, verlässliches und zugängliches System einzuführen, mit dem die von einem jeden Arbeitnehmer geleistete tägliche Arbeitszeit gemessen werden kann.« Bei uns häufen sich die Anfragen, was dies denn nun genau bedeutet und was gegebenenfalls in mite umzustellen sei. Und wir können sie noch nicht sicher beantworten. Denn bisher steht die Urteilsbegründung des BAG noch aus, und noch hat die Regierung kein Gesetz erlassen. Klar scheint uns: Ja, Arbeitgeber:innen müssen für ihre Arbeitnehmer:innen jetzt eine Arbeitszeiterfassung einführen. Nein, dies bedeutet nicht das Aus fürs Home-Office oder die erzwungene Rückkehr zu einer Stechuhr mit Papierkarte, digitale Anwendungen sollen möglich bleiben. Aber darüberhinaus sind viele Fragen aktuell noch offen: Wie genau muss die Lösung zur Arbeitszeiterfassung beschaffen sein? Welche Daten müssen wann und wie erfasst und wie lange gespeichert werden? Welche Detailtiefe ist notwendig? Solch wichtige Feinheiten sind noch nicht geregelt. Wir möchten daher heute grundsätzlich betonen, dass wir die weiteren Entwicklungen natürlich "höchst interessiert" verfolgen werden. Und mite anpassen möchten, falls dies denn notwendig werden wird. Außerdem haben wir uns für euch durch die beiden Urteile, das bestehende Arbeitsschutzgesetz und einige Einordnungen von Expert:innen geschmökert. Unserem persönlichen, Nicht-Rechtsanwalt-Verständnis nach ergeben sich drei wichtige Punkte: Alle Arbeitnehmer:innen in Deutschland müssen Arbeitszeiten erfassen. Auch leitende Angestellte. Die Arbeitszeit von Arbeitnehmer:innen muss vollständig erfasst werden. Andernfalls können Überstunden nicht berechnet und ausgeglichen werden. Wer also laut Vertrag acht Stunden pro Tag arbeitet, sollte an einem normalen Tag auch acht Stunden erfassen, nicht nur die verrechenbaren Projektzeiten. Die zeitliche Verteilung der Arbeitszeit am Arbeitstag ist relevant. Andernfalls kann nicht belegt werden, dass vorgeschriebene Ruhezeiten eingehalten werden. Wenn mite für Arbeitnehmer:innen eingesetzt wird, möchten wir daher heute anregen, Arbeitszeiten samt Start- und Endzeit zu erfassen. Also nicht nur zu erfassen, dass man heute beispielsweise acht Stunden gearbeitet hat, sondern auch festzuhalten, dass diese Arbeitszeit von 8 bis 12:30 Uhr und von 13:30 bis 17:00 Uhr geleistet wurde. Start- und Endzeiten sind bisher in der Browserversion von mite etwas versteckt, aber problemlos möglich, auch in Kombination mit der Stoppuhr. Beim Erstellen eines Zeiteintrags gibt man dafür ins Dauerfeld den Start- und Endzeitpunkt durch ein Leerzeichen getrennt ein. Für einen Start um 8 Uhr und ein Ende um 12:30 Uhr gibt man also »8 12:30« ein. Sobald man das Dauerfeld verlässt, berechnet mite die resultierende Dauer und legt den genauen Zeitraum zusätzlich im Bemerkungsfeld zur Referenz ab. Exportiert man Zeiteinträge Richtung Excel oder als CSV, werden Start- und Endzeit in separaten Feldern übergeben. Soviel von hier, für den Moment. Wir bleiben dran. Hoffentlich setzt der Gesetzgeber das Thema nun bald auf eine eindeutige, praktikable und tatsächlich hilfreiche Weise um. Und bis dahin: Falls hier Fachmenschen für Arbeitsrecht mitlesen sollten oder Arbeitgeber:innen, die sich bereits schlaue Strategien für ihre Teams in mite ausgedacht haben? Teilt eure Ideen, Kniffe und Einschätzungen sehr gern im Kommentarbereich! Julia in Tricks & Tipps, Diskussion'
year_published = 2020
