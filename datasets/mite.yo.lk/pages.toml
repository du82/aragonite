["https://mite.yo.lk/blog/2009/06/15/neu-mite-cmd-zeiterfassung-ueber-die-konsole"]
title = "mite.blog. Neu: mite dank mite.cmd über die Konsole steuern"
full_description = "15. Juni 2009 Neu: mite dank mite.cmd über die Konsole steuern Entwickler, SysAds, Vollblut-Techies aufgepasst: Wer die Kommandozeile sein Zuhause nennt, für den wird mite mit dem heutigen Tag nicht mehr dasselbe Tool sein. Lukas Rieder, freischaffender Entwickler aus Berlin, hat mite.cmd gezaubert. Über mite.cmd können textbasiert Zeiteinträge erfasst, Stoppuhren verwaltet und einfache persönliche Reports ausgegeben werden. Direkt von der Konsole aus, ohne die Finger auch nur einen Moment von der Tastatur lassen zu müssen. Das wirklich Begeisternde an mite.cmd ist jedoch nicht der Transfer der Basisfunktionalitäten aus dem Browser in die Konsole samt einhergehendem Tausch von Mausklicks in unzählige Tastaturanschläge; mite.cmd kommt bereits in dieser frühen Version mit zusätzlichen pfiffigen Kurz-Eingabevarianten daher, denen man auf den ersten Blick anmerkt, dass hier ein ideenreicher Entwickler zugange war. Ein komfortables, zeichensparendes AutoComplete (sowie nebenbei eine der amüsantesten Dokus & Launchposts, über die ich in letzter Zeit gestolpert bin) rundet mite.cmd ab. Besonders freut uns, dass Lukas den Code des über unsere API realisierten mite.cmd auf GitHub veröffentlicht hat, offen für Verbesserungsvorschläge und Forks aller interessierten Entwickler und Enwicklerinnen. Danke, Lukas! We like your hairstyle, too! Julia in Neue Features, Add-ons Selbst kommentieren?"
