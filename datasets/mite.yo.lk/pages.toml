["https://mite.yo.lk/blog/tag/denke"]
title = "mite.blog. Attitudes"
description = "Neuigkeiten, Diskussionen, Tipps & Tricks rund um mite, die schlanke Zeiterfassung für Teams & Freiberufler, webbasierte Software & Agile Entwicklung."
full_description = "28. September 2007 Glaubwürdigkeit Mimik und Gestik, Sprechgeschwindigkeit und Sprachmelodie, Auftreten und vor allem der Blickkontakt: diese aus dem Offline-Leben gewohnten Faktoren, anhand derer ich mich entscheide, den Worten einer unbekannten Person Glauben zu schenken oder eben nicht, fehlen einer Webseite. Doch auch und gerade im Netz kommt der sogenannten Web Credibility ein hoher Stellenwert zu: nicht nur der Erwerb von Waren oder die Inanspruchnahme von Dienstleistungen gründet in besonderem Maße auf Vertrauen, sondern auch die Beurteilung von Informationsseiten, ob privater oder kommerzieller Natur. Das Web Credibility Project von BJ Fogg an der Universität Stanford beschäftigt sich seit 1998 mit der Frage, welche Faktoren die Glaubwürdigkeit einer Internetseite beeinflussen und wie diese gesteigert werden kann. Die 91. Folge der Technikwürze, ein Podcast rund um Webdesign, Webstandards und barrierefreie Webseiten, beleuchtet im Gespräch mit Stefan Nitzsche, selbstständigem Webentwickler und Mitglied der Webkrauts, zentrale Erkenntnisse der Stanford-Studien. Die zehn resultierenden Richtlinien (englische oder deutsche Fassung) werden in 57 Minuten ausführlich besprochen, auch anhand praktischer Beispiele: Ebay muss – wie so oft – als Negativbeispiel herhalten, mite wird erfreulicherweise ab Minute 51 als Positivbeispiel herausgegriffen. Merci! – obwohl sicherlich auch hier noch Verbesserungspotenzial existiert. Julia in Denke 20. September 2007 Agile Produktentwicklung im Web 2.0 Einfachheit, Kommunikation, Feedback, Charakter und Leidenschaft: auf diese fünf Werte stützt sich die Entwicklung von mite – und das von uns entworfene agile Modell zur Produktentwicklung im Web 2.0. Im gerade frisch erschienenen Buch beleuchten wir auf 222 Seiten, was es damit auf sich hat. Welche Strömungen das Web prägen, welche Dienste und Formate, Technologien und Kommunikationskonzepte. Welchen Herausforderungen sich ein im Web operierendes Unternehmen aufgrund dieser Strömungen stellen muss und welche Potenziale sowohl auf Programmiererseite als auch im Produkt- und Projektmanagement existieren. Und wie Produkte entwickelt werden können, die ebendiese Potenziale ausschöpfen. Produkte, die anders sind: schlanker, stabiler, mit höherem Nutzen für den Anwender – und so schlussendlich für das Unternehmen. Das Buch entstand auf Basis unserer Diplomarbeit. Aktualisiert, überarbeitet und vor allem lektoriert kommt es nun als schniekes Hardcover daher. Erhältlich ist es versandkostenfrei direkt über den Shop des vwh-Verlags als natürlich auch über Amazon oder den örtlichen Buchhandel. Wer nicht die Katze im Sack kaufen möchte oder die Durchsuchbarkeit einer digitalen Version schätzt, dem sei das ursprüngliche unter Creative Commons Lizenz stehende PDF ans Herz gelegt. Die Versionen sind allerdings nicht identisch. Julia in Denke, In eigener Sache"
