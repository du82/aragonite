full_description = "22. März 2021 Die Rechnung, bitte: orgaMAX online importiert mit mite erfasste Arbeitszeiten orgaMAX online, ein in Deutschland gehostetes Tool rund um Rechnungen, Angebote und Mahnungen, übernimmt ab sofort ebenfalls die Weiterverarbeitung von mit mite erfassten Arbeitszeiten zu ordentlichen Rechnungen. Funktionsumfang der Verknüpfung Innerhalb der mite.erweiterung für orgaMAX online wählt man zuerst aus, welche Zeiteinträge aus mite abgerechnet werden sollen. Die flexible Suche ermöglicht unter anderem eine Filterung der Zeiteinträge nach Projekt, Benutzer oder Zeitraum. Auch nach bereits abgerechneten (abgeschlossenen) oder noch offenen Zeiten kann gefiltert werden. Die zur Abrechnung ausgewählten Zeiteinträge aus mite können im nächsten Schritt selbstverständlich durch weitere Rechnungsposten für Materialen, Spesen etc. ergänzt werden. Nach der erfolgten Rechnungsstellung in orgaMAX online werden die abgerechneten Zeiteinträge in mite als abgeschlossen markiert. Verknüpfung einrichten Bevor die beiden Tools zusammenarbeiten können, muss einmalig die Verknüpfung zwischen mite und orgaMAX online eingerichtet werden: Aktiviere bitte zuallererst in mite den Zugriff über die mite.api für dein Benutzerkonto. Klicke dafür auf deinen Benutzernamen rechts oben. Die mite.api ist unsere offene Datenschnittstelle, über die externe Tools auf deine Daten aus mite zugreifen. Bitte rufe dann orgaMAX online auf, melde dich an und steuere dort den Menüpunkt »Erweiterungen« an. Wähle auf dieser Seite mite als neue Erweiterung aus. orgaMAX online wird dich daraufhin nach der Login-Adresse deines Accounts bei mite sowie um deinen API-Schlüssel bitten. Nach Sicherung der abgefragten Daten ist orgaMAX online mit deinem mite verknüpft. Du kannst deine Zeiteinträge nun jederzeit dort importieren und abrechnen. Merci Die Anbindung wurde von den Entwicklern von orgaMAX online in Eigeninitiative entwickelt. Unser herzliches Dankeschön an Fin, David und Jens für euer Engagement! Julia in Add-ons Selbst kommentieren?"
