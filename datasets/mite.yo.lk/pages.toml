["https://mite.yo.lk/blog/2025/02/03/stoerung-3-februar"]
title = "mite.blog. Fehler am heutigen Mittag"
full_description = "3. Februar Fehler am heutigen Mittag Zwischen 13:16 und 13:29 CET warf mite heute leider einen Haufen Fehler. Die Seite konnte man problemlos aufrufen und Daten lesen oder auch exportieren. Das Erstellen, Bearbeiten und Löschen von Zeiteinträgen, Kunden, Projekten, Leistungen und Benutzerkonten war jedoch während dieser 13 Minuten leider nicht möglich. Unsere Entschuldigung für diesen Hickhack! Ursache war leider ein unschöner Konfigurations-Fehler auf unserer Seite, der uns schlicht durchgerutscht war. Unsere Monitoring-Systeme schlugen sofort an, auch meldeten sich zahlreiche Kunden per Mail. Wir wussten daher sofort Bescheid und konnten den Fehler auch schnell beheben. Aber es ärgert uns, dass uns das passiert ist. Pardon noch einmal. Julia in Maschinenraum Selbst kommentieren?"
