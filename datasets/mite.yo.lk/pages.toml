["https://mite.yo.lk/blog/2007/09/20/agile-produktentwicklung-im-web-20"]
title = "mite.blog. Agile Produktentwicklung im Web 2.0"
full_description = "20. September 2007 Agile Produktentwicklung im Web 2.0 Einfachheit, Kommunikation, Feedback, Charakter und Leidenschaft: auf diese fünf Werte stützt sich die Entwicklung von mite – und das von uns entworfene agile Modell zur Produktentwicklung im Web 2.0. Im gerade frisch erschienenen Buch beleuchten wir auf 222 Seiten, was es damit auf sich hat. Welche Strömungen das Web prägen, welche Dienste und Formate, Technologien und Kommunikationskonzepte. Welchen Herausforderungen sich ein im Web operierendes Unternehmen aufgrund dieser Strömungen stellen muss und welche Potenziale sowohl auf Programmiererseite als auch im Produkt- und Projektmanagement existieren. Und wie Produkte entwickelt werden können, die ebendiese Potenziale ausschöpfen. Produkte, die anders sind: schlanker, stabiler, mit höherem Nutzen für den Anwender – und so schlussendlich für das Unternehmen. Das Buch entstand auf Basis unserer Diplomarbeit. Aktualisiert, überarbeitet und vor allem lektoriert kommt es nun als schniekes Hardcover daher. Erhältlich ist es versandkostenfrei direkt über den Shop des vwh-Verlags als natürlich auch über Amazon oder den örtlichen Buchhandel. Wer nicht die Katze im Sack kaufen möchte oder die Durchsuchbarkeit einer digitalen Version schätzt, dem sei das ursprüngliche unter Creative Commons Lizenz stehende PDF ans Herz gelegt. Die Versionen sind allerdings nicht identisch. Julia in Denke, In eigener Sache Selbst kommentieren?"
