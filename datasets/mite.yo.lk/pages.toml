["https://mite.yo.lk/blog/2009/09/07/mantis2mite-online"]
title = "mite.blog. Mantis und mite arbeiten jetzt zusammen! Vorstellig wird: Mantis2mite"
full_description = "7. September 2009 Mantis und mite arbeiten jetzt zusammen! Vorstellig wird: Mantis2mite Mantis2mite ist ein Mantis-Plugin, das im Rahmen meiner Bachelorarbeit entstanden ist, auch dank dem Feedback von vielen mite.nutzern. Ich habe es unter die freie MIT-Lizenz gestellt und auf GitHub veröffentlicht. Mantis ist ein freier Bugtracker, basierend auf PHP und in stetiger Entwicklung. Mantis2mite verknüpft einen Mantis-Account mit einem mite.account. Zeiteinträge können direkt auf Probleme in Mantis erfasst werden; automatisch werden die Zeiten dann an mite gesendet. Projekte in Mantis können mite.projekten zugeordnet werden. Zudem lässt sich für jedes Projekt in Mantis spezifizieren, welche mite.leistungen zur Verfügung stehen sollen. Nutzer, die in Mantis mindestens einer festlegbaren Rolle entsprechen, können auch die Zeiteinträge anderer Nutzer für ein Problem einsehen. Diese Möglichkeit ist für Projekt-Manager gedacht, die somit die verbrauchte Gesamtzeit für ein Problem schnell erfassen können. Es gibt einen wichtigen Punkt zu beachten: Mantis >= 1.2.0 ist Voraussetzung. Erst seit dieser Version gibt es ein wirkliches Plugin-System, welches für die Entwicklung von Mantis2mite notwendig war. Ein Zip-Archiv mit allen notwendigen Dateien findet ihr auf GitHub. Ebenso ein LIESMICH-Dokument mit den Installationsanweisungen, einer FAQ sowie einer Liste mit bekannten Problemen. Bitte seht zuerst dieses Dokument durch, falls ihr Fragen habt. Ich freue mich auf euer Feedback! Auch damit für das noch kommende Trac- und Redmine-Plugin die Segel ordentlich ausgerichtet sind :-) [Update, 7. September] Nach der Umbenennung eines Verzeichnisses funktionierte der ganze Plugin-Mechanismus leider nicht mehr. Alle, die die Installation schon versucht haben und gescheitert sind, würde ich bitten nochmal die aktuelle Version zu installieren. Bitte entschuldigt das Problem. Da konnte ich doch nicht ganz meinen grünen Schnabel verstecken :-) Thomas in Neue Features, Add-ons Selbst kommentieren?"
