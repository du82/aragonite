["https://mite.yo.lk/faq.html"]
title = "FAQ. Schnelle Hilfe rund um die Zeiterfassung mit mite."
description = "Die mite.faq bieten schnelle Hilfe, Infos und Futter für alle, die es ganz genau wissen wollen. Deine Frage nicht dabei? Wir sind nur einen Klick entfernt."
full_description = "Die mite.faq bieten schnelle Hilfe, Infos und Futter für alle, die es ganz genau wissen wollen. Deine Frage nicht dabei? Wir sind nur einen Klick entfernt. Sicherheit & Datenschutz Kann ich mite über eine verschlüsselte Verbindung nutzen? Ja, die Verbindung zwischen dir und unseren Servern erfolgt grundsätzlich verschlüsselt. HTTPS ist – ähnlich wie beim Online-Banking – immer aktiv. SSL, HTTPS, Sicherheit Sind meine Daten wirklich sicher? Erstellt ihr Backups? Deine Daten werden von uns täglich gesichert, und zwar mehrfach redundant. Jede Nacht kopieren wir deine Daten komplett auf zwei physisch unterschiedliche Server. Darüberhinaus kannst du jederzeit unter Account → Backup eine vollständige Sicherungskopie deiner Daten im XML-Format herunterladen. Meine Daten sind vertraulich. Wo werden sie gesichert? Die Hauptserver von mite stehen im Rechenzentrum unseres Hosters SysEleven in Berlin. Wir sichern deine Zeiterfassungsdaten also in Deutschland, und dort bleiben sie auch. Für eine detaillierte Beschreibung, welche Daten genau wir erheben und wie wir sie verarbeiten und schützen, wirf bitte einen Blick in unsere Datenschutzerklärung. Datenschutz, DSGVO, Sri Lanka Kann ich mit euch laut DSGVO einen Vertrag zur Auftragsverarbeitung schließen? Selbstverständlich. Als Besitzer des Accounts kann man direkt unter dem Menüpunkt Account einen AV-Vertrag mit uns abschließen. Datenschutz, DSGVO, AVV, Auftragsverarbeitung Technisches Welche Desktop-Browser werden von mite unterstützt? mite unterstützt aktuelle Versionen der gängigsten Browser auf Windows, Mac OS und Linux: Die letzten beiden Versionen von Mozilla Firefox, die letzten beiden Versionen von Google Chrome, die letzten beiden Versionen von Safari, die letzten beiden Versionen von Microsoft Edge. mite läuft meist auch auf etwas älteren Versionen von Firefox, Chrome und Safari, und auch auf exotischeren Browsern. Wir testen hier jedoch nicht ausführlich, Hakeleien können und werden also auftreten. Chrome Kann ich mite auch auf dem Smartphone oder Tablet nutzen? Ja, natürlich. mite steht dir auch auf deinem Smartphone oder Tablet zur Seite. Auf deinem Smartphone oder Tablet kannst du deine reguläre Login-Adresse – bspw. https://meinteam.mite.de – einfach über den systemeigenen Browser ansteuern. mite erkennt dein Gerät und passt die Darstellung für das kleinere Display an. Falls das auf einem etwas exotischeren Gerät einmal nicht automatisch klappen sollte, kannst du auch manuell über den Link im Fuß der Seite zur mobilen Version wechseln. Für iPhones steht zudem eine native App zur Zeiterfassung unterwegs an. mite fürs iPhone ist in den regulären Nutzungsgebühren inbegriffen. Die App steht zum gratis Download im App Store parat. Smartphone, iPhone, iOS, Android, iPad, Tablet Bietet mite Tastatur-Kürzel an? Ja, die zentralen Funktionen lassen sich auch über die Tastatur bedienen. Bitte drücke in mite die Fragezeichen-Taste, um dir eine Übersicht anzeigen zu lassen, was alles klappt. Kürzel, Shortcuts, Keyboard, Tastatur Kann ich mite auf meinem eigenen Server installieren? Nein, mite wird zur Zeit und in absehbarer Zukunft ausschließlich als Version auf unserem Server angeboten. Wir glauben an die Vorteile von zentral betreuten Webapplikationen – aus Entwickler- wie auch aus Benutzersicht. Download, Server, Installation, Intranet, Webapplikation, Hosting, host Kann ich über eine API auf mite zugreifen? Ja, das ist jedem mite.nutzer möglich. Für detaillierte Informationen wirf bitte einen Blick in die zugehörige Dokumentation. application programming interface, Datenschnittstelle, Data Portability Kann ich mite offline nutzen? Nein, das ist momentan leider nicht möglich. Probephase & Vertrag Wie funktioniert die 30-tägige kostenlose Probephase? Die Katze im Sacke kaufen? Nicht bei mite. Wir möchten dir unkompliziert ermöglichen, das Tool ausführlich zu testen. Unverbindlich, kostenlos und ohne funktionale Einschränkungen irgendeiner Art. Nur so kannst du wirklich herausfinden, ob mite zu dir passt. Um mite zu testen, erstelle bitte einen frischen Probeaccount. Dieser steht dir dann 30 Tage zum Testen zur Verfügung. Sollte mite nicht zu dir passen, lass die Probephase einfach verstreichen oder kündige deinen Account. Alle deine Daten werden wir dann kurz nach Ablauf der 30-tägigen Probephase restlos löschen. Konnte dich mite überzeugen? Dann gib bitte unter dem Menüpunkt Account deine Zahlungsdaten ein. Dein mite.account steht dir dann über die Probephase hinaus zur Verfügung. Während der Probephase eingegebene Daten werden selbstverständlich übernommen. mite kostet nach Ablauf der Probephase monatliche 5€ pro Nutzer (einschließlich MwSt., falls fällig). Du kannst jederzeit kündigen. Existiert eine Mindestvertragslaufzeit? Oder Kündigungsfristen? Eine Mindestvertragslaufzeit existiert nicht; Dein Vertrag ist monatlich kündbar. Es existieren keine speziellen Fristen, die du einhalten musst: Wenn du deinen Account beispielsweise am 13. eines Monats erstellt hast, kannst du ihn bis zum 12. des darauffolgenden Monats kündigen. Deinen letzten angebrochenen Monat berechnen wir regulär, danach nie wieder einen Cent. Wie kündige ich meinen Account? Die Option zu kündigen findet der Inhaber des Accounts unter dem Menüpunkt Account => Kündigen. Nur der Inhaber eines Accounts kann diesen kündigen. Bitte denke vor der Kündigung an die Sicherung deiner Daten. Backups aller Daten stehen im XML-Format zur Verfügung, Zeiteinträge im XLS- oder CSV-Format. Zahlungen Was kostet mite? mite kostet monatliche 5,00€ pro Nutzer (einschließlich MwSt., falls fällig). Ein Account mit zwei Nutzern kostet beispielsweise monatliche 10€, ein Account mit drei Nutzern 15€, ein Account mit vier Nutzern 20€, usw.. Das Unternehmen hinter mite ist in Deutschland ansässig. Je nachdem, in welchem Land du laut Rechnungsanschrift sitzt und ob du mite als Unternehmen oder Privatperson einsetzt, müssen wir Mehrwertsteuer berechnen. Die monatlichen 5€ pro Nutzer sind der Maximalpreis einschließlich Mehrwertsteuer. In manchen Fällen können wir mite günstiger anbieten. Aus Deutschland? mite kostet monatliche 5€ pro Nutzer einschließlich MwSt., für Unternehmen wie auch für Privatpersonen. Aus einem anderen Land der EU? Für Unternehmen wird lediglich der Netto-Preis fällig. mite kostet also monatliche 5,00€ pro Nutzer abzüglich der jeweiligen nationalen Mehrwertsteuer. In Österreich gilt beispielsweise ein Mehrwertsteuersatz von 20%; Unternehmer aus Österreich zahlen ergo 4,17€. Bitte gib eine gültige USt-IdNr. ein, um deine Unternehmerschaft nachzuweisen. Für Privatpersonen werden monatliche 5€ pro Nutzer einschließlich der jeweiligen nationalen MwSt. fällig. Aus einem Land außerhalb der EU? mite kostet monatliche 4,20€ pro Nutzer, sowohl für Unternehmen als auch für Privatpersonen. Wir müssen keine Mehrwertsteuer berechnen. Nur aktivierte Nutzer kosten. Bleibt ein Benutzer einen gesamten monatlichen Rechnungszyklus archiviert, wird für ihn auch keine Nutzungsgebühr fällig. Den letzten angebrochenen Rechnungsmonat berechnen wir archivierte Nutzer also noch, danach laufen sie kostenfrei mit. Was kostet mite für Accounts, die vor dem 5.6.2008 erstellt wurden? Accounts, die vor dem 5.6.2008 erstellt wurden und von denen auch nur ein Nutzer jemals aktiv war, können selbst bestimmen, wieviel sie für mite zahlen. Der faire Preis kann unter dem Menüpunkt Account – Zahlungen eingestellt werden. Als aktiv gelten für uns alle Accounts, die zum Stichtag mehr als 10 Zeiteinträge und mehr als 10 Logins zählten. Inaktive Accounts unterliegen denselben Bestimmungen wie Accounts, die nach dem 5.6.2008 erstellt wurden. Diese unterschiedlichen Kostenvarianten existieren aus einem einfachen Grund: mite startete im Dezember 2006 als kostenfreier Service. Entwickelt und betreut wurde mite in unserer Freizeit. Zum 1. Mai 2008 gründeten wir Yolk und entschieden uns dazu, die Anwendung in Vollzeit weiterzuentwickeln. Inzugedessen wurde die ab dem 15.7.2008 verfügbare neue Version von mite grundsätzlich kostenpflichtig. Nutzer, die mite bereits seit frühen Tagen intensiv einsetzen und uns mit Feedback unterstützten, erhielten als Dankeschön die Option, den Preis ihres Accounts selbst festzulegen. Wir möchten mite in einem größeren Team nutzen. Bietet ihr Rabatte an? Ja, Mengenrabatte können wir Teams ab 15 Benutzern anbieten. Bitte kontaktiert uns per Mail an ; gerne stellen wir euch ein persönliches Angebot zusammen. Rabatt, Prozente, Vergünstigung Welche Zahlungsvarianten akzeptiert ihr? Nutzungsgebühren können per SEPA-Lastschrift bezahlt werden, wenn du über ein Bankkonto eines EU-Landes der Eurozone verfügst. Alle Nutzer können alternativ per Kreditkarte zahlen (Visa oder MasterCard). Eine Zahlung auf Rechnung oder per PayPal ist leider nicht möglich. Bankeinzug, Lastschrift, PayPal Stellt ihr ordentliche Rechnungen? Keine Zahlung ohne Beleg – dieser Grundsatz gilt natürlich auch bei mite. Wir stellen monatliche Rechnungen im PDF-Format zur Verfügung; Diese fassen bei Mehrbenutzeraccounts die Gebühren der einzelnen Nutzer zusammen. Die E-Mailadresse, an die Rechnungen monatlich zugestellt werden, kann unter dem Menüpunkt Account → Zahlungen hinterlegt werden. Darüberhinaus können alte Rechnungen jederzeit unter ebendiesem Menüpunkt heruntergeladen werden. Mir fehlt eine alte Rechnung. Könnt ihr mir diese zuschicken? Alle deine bisherigen Rechnungen kannst du jederzeit direkt in deinem Account noch einmal herunterladen. Dein Rechnungsarchiv findest du unter dem Menüpunkt Account → Zahlungen. Login Ich habe meine Login-Adresse vergessen. Und jetzt? Deine persönliche Login-URL findest du in der allerersten Mail, die du von uns nach Erstellung deines Accounts oder Benutzerzugangs erhalten hast. Sie ist nach dem Schema https://meinaccount.mite.de aufgebaut. Falls du diese Mail nicht finden solltest, ist auch dies kein Grund zur Verzweiflung: Schicke uns eine kurze E-Mail an mit deinem Benutzernamen, deiner verwendeten E-Mail-Adresse oder dem Titel des Accounts. Wir helfen, so schnell es geht. anmelden, URL Ich habe mein Passwort vergessen. Hilfe! Dein Passwort liegt verschlüsselt in der Datenbank und kann nicht einmal vom mite.team ausgelesen werden. Beim Anmeldevorgang kannst du aber ganz einfach ein neues Passwort anfordern. Nach der Angabe deiner E-Mail-Adresse wird es generiert und dir kurz darauf per E-Mail zugeschickt. Dieser Vorgang dauert in der Regel nur wenige Sekunden. Wie ändere ich mein Passwort? Dein Passwort kannst du per Klick auf deinen Benutzernamen, rechts oben neben Abmelden, ändern. Klicke dort auf Passwort ändern, wähle dein neues Passwort, wiederhole die Eingabe und bestätige die Passwortänderung durch Klick auf den Button Sichern. Kann ich meine Login-Adresse ändern? Ja, dein Login kannst du als Besitzer des Accounts oder als Administrator jederzeit ändern. Bitte rufe dafür den Menüpunkt »Account« auf. Team Ist mite mehrbenutzerfähig? Ja, mit mite lassen sich Arbeitszeiten im Team erfassen. Wieviele Benutzer können mit einem Account arbeiten? Die Anzahl der Benutzer pro Account ist technisch nicht begrenzt. Der aktuell größte mite.account zählt 50 Benutzer. Team, Nutzer Ich bin Besitzer des Accounts. Was bedeutet das? Lässt sich das ändern? Nur der Besitzer des Accounts kann den Account kündigen. Auch alle Aktionen rund um Zahlungen, wie die Eingabe oder Aktualisierung von Zahlungsdaten sind nur ihm gestattet. Besitzerrechte lassen sich unter dem Menüpunkt Account übertragen. Bitte bedenke, dass nur ein Benutzer Besitzer sein kann – sobald du einen anderen Benutzer zum Besitzer des Accounts erwählt hast, bist du als Administrator unterwegs. Admin Lassen sich die Rechte eines Benutzers einschränken? mite kennt vier Arten von Benutzern: Den Besitzer des Accounts, den Administrator, den Standard-Benutzer und den Zeiterfasser. Nur der Besitzer des Accounts kann den Account kündigen. Auch alle Aktionen rund um Zahlungen, wie die Eingabe oder Aktualisierung von Zahlungsdaten sind nur ihm gestattet. Der Administrator verfügt über erweiterte Rechte zur Verwaltung des Accounts sowie des Teams. Er kann Zeiteinträge aller Nutzer bearbeiten. Der Standard-Nutzer kann Kunden, Projekte und Leistungen verwalten. Reports aller Projekte kann er samt Zeiteinträgen aller Nutzer einsehen. Der Zeiterfasser darf ausschließlich Zeit auf ihm explizit freigegebene Projekte erfassen. Er sieht stets nur seine eigenen Zeiteinträge. Umsätze bleiben ihm verborgen. Eine detaillierte Übersicht aller Rechte je Benutzerrolle findet sich hier. Rechteverwaltung, Admin, Administrator, Zeiterfasser, Nutzer, Rollen, Benutzerrolle Warum kann ich keine neuen Benutzer anlegen? Neue Benutzer kann ausschließlich der Besitzer des Accounts oder ein Administrator anlegen. Eine Sicherheitsschranke, da der monatliche Nutzungsbeitrag von mite sich in Abhängigkeit von der Anzahl der Nutzer berechnet. Wie archiviere ich einen Benutzer? Und was bedeutet archivieren? Nur der Besitzer des Accounts oder ein Administrator kann Benutzer archivieren. Um einen Benutzer zu archivieren, klicke unter Aktive Benutzer auf das Kästchen (die Checkbox) links neben seinem Namen. Ein archivierter Benutzer kann sich nicht mehr anmelden und keine neuen Zeiteinträge erfassen, bereits erfasste Zeiteinträge verbleiben aber zur weiteren Auswertung im System. Für Nutzer, die einen kompletten monatlichen Rechnungszyklus über archiviert bleiben, werden keine Nutzungsgebühren fällig. Kann ich Benutzer löschen? Nur der Besitzer des Accounts oder ein Administrator kann Benutzer löschen. Und auch dies nur dann, wenn keine von ihm erfassten Zeiteinträge mehr existieren. Archiviere einen Benutzer stattdessen, dessen Zeiteinträge zur weiteren Auswertung in deinem mite.account verbleiben sollen. Ist ein Benutzer während des gesamten monatlichen Rechnungszyklus archiviert, wird für ihn keine Nutzungsgebühr fällig. Er kann sich nicht mehr anmelden und keine neuen Zeiten erfassen. Meinem Kunden möchte ich Zugriff auf mite gewähren. Er soll aber nur Zeiten lesen, nicht bearbeiten können. Geht das? Ja, du kannst deinem Kunden auf Projektebene einen speziellen Zugang freischalten. Über einen geheimen Link kann er die Zeiten einzelner Projekte einsehen, jedoch nicht verändern. Dieser Zugang ist nicht mit zusätzlichen Kosten verbunden. Rufe zuerst den Detailreport des gewünschten Projekts auf. Diesen erreichst du über den Menüpunkt »Reports => Projekte«, dort über den jeder Projektzeile hintenangestellten Link Details. Klicke dann auf dem Detailreport in der rechten Seitenspalte auf Kundenzugang aktivieren: Nun musst du nur noch den angezeigten Link deinem Kunden geben. Um den Zugang mit sofortiger Wirkung wieder zu sperren, klicke an selber Stelle auf Link deaktivieren & Zugang sperren. sharen, sharing, Freigabe Zeiten erfassen In welcher Schreibweise kann ich Zeiten eingeben? mite unterstützt eine Reihe unterschiedlicher Schreibweisen – nutze die, die dir am besten liegt. Für eine Dauer von 1 Stunden un"
