["https://mite.yo.lk/agb.html"]
title = "mite. Allgemeine Geschäftsbedingungen."
full_description = "Allgemeine Geschäftsbedingungen 1. Geltung der Bedingungen und Begrifflichkeiten (1) Diese allgemeinen Geschäftsbedingungen (AGB) gelten für alle Geschäftsbeziehungen zwischen Nutzern und der mite GmbH für die Erbringung des Dienstes mite. Maßgeblich ist die jeweils zum Zeitpunkt des Vertragsschlusses aktuelle Fassung. Die ergänzenden Kurzbeschreibungen der einzelnen Regelungen dienen nur der besseren Verständlichkeit und sind nicht verbindlicher Gegenstand dieser AGB. (2) Etwaige abweichende Geschäftsbedingungen des Nutzers finden keine Anwendung, es sei denn, diesen wurde durch die mite GmbH ausdrücklich schriftlich oder in Textform zugestimmt. Spätestens mit der Accounterstellung bei mite erkennt der Nutzer die Geltung dieser Geschäftsbedingungen an. (3) »Verbraucher« im Sinne dieser AGB ist jede natürliche Person, die ein Rechtsgeschäft zu einem Zwecke abschließt, der überwiegend weder ihrer gewerblichen noch ihrer selbstständigen beruflichen Tätigkeit zugerechnet werden kann. »Unternehmer« ist eine natürliche oder juristische Person oder eine rechtsfähige Personengesellschaft, die bei Abschluss eines Rechtsgeschäfts in Ausübung ihrer gewerblichen oder selbständigen beruflichen Tätigkeit handelt. Kurz gesagt Erstellst du einen Account bei mite, einigen wir uns auf gewisse Spielregeln. 2. Leistungen der mite GmbH (1) Die mite GmbH bietet mit dem Dienst mite die Möglichkeit an, Arbeitszeit zu erfassen und auszuwerten. (2) mite ist ein Dienst, der über das Internet zugänglich gemacht wird. Der Internetzugang, der für die Nutzung von mite benötigt wird, ist nicht Gegenstand der Leistungen der mite GmbH. (3) Die mite GmbH behält sich das Recht vor, Leistungen jederzeit zu erweitern und zu verbessern (nachfolgend bezeichnet als »Weiterentwicklung«), sofern die Weiterentwicklung dem Nutzer zumutbar ist und hierdurch die Erreichung des Vertragszwecks nicht gefährdet wird. Im Fall von Nutzern, die Verbraucher sind, gilt dies im Fall kostenpflichtiger Verträge, wenn die Änderung zum Vorteil des Nutzers geschieht; wenn die Änderung dazu dient, eine Übereinstimmung der Leistungen mit dem anwendbaren Recht herzustellen, insbesondere, wenn sich die geltende Rechtslage ändert; wenn die Änderung der mite GmbH dazu dient, zwingenden gerichtlichen oder behördlichen Entscheidungen nachzukommen; soweit die jeweilige Änderung notwendig ist, um bestehende Sicherheitslücken zu schließen; wenn die Änderung rein technischer oder prozessualer Natur ohne wesentliche Auswirkungen für den Nutzer ist. Änderungen mit lediglich unwesentlichem Einfluss auf bisherige Funktionen stellen keine Leistungsänderungen in diesem Sinne dar. Dies gilt insbesondere für Änderungen rein optischer Art und die bloße Änderung der Anordnung von Funktionen. Ein Anspruch auf das Anbieten weiterer Funktionalitäten über die in Absatz 1 beschriebene Leistung besteht nicht. Kurz gesagt mite ist ein Online-Tool zur Erfassung und Auswertung von Arbeitszeit. Wir werden mite auch künftig feinschleifen und verbessern. 3. Kostenlose Testphase und Vertragsschluss (1) Mit erfolgreich abgeschlossener Accounterstellung kommt ein Nutzungsverhältnis zustande. Die Accounterstellung ist erfolgreich abgeschlossen, wenn der Nutzer die Erstellung des Accounts z.B. durch Aufruf eines Aktivierungslinks in einer E-Mail bestätigt. (2) Der Nutzer kann mite 30 Tage lang kostenlos testen. Gibt der Nutzer während dieser Testphase nicht seine Zahlungsdaten unter dem Menüpunkt Account ein, wird der Account des Nutzers zunächst mit einer Nur-Lesen-Sperre versehen. Spätestens 14 Tage nach Ablauf der Testphase wird der Account deaktiviert und das Nutzungsverhältnis beendet. Spätestens 28 Tage nach Ablauf der Testphase werden alle Daten des Accounts gelöscht. (3) Gibt der Nutzer seine Zahlungsdaten unter dem Menüpunkt Account ein und klickt auf den Button „zahlungspflichtigen Vertrag schließen“, kommt nach Ablauf der 30-tägigen Testphase ein kostenpflichtiges Vertragsverhältnis zustande. Die Nutzung von mite kostet pro Nutzer pro Monat 5,00 € inkl. MwSt.. (4) Das Vertragsverhältnis läuft auf unbestimmte Zeit. (5) Im Rahmen der Accounterstellung werden Nutzer auf die Pflichtfelder hingewiesen und können ihre Eingaben vor dem Absenden ändern. (6) Die mite GmbH sendet dem Nutzer eine Bestellbestätigung mit allen Bestelldaten an die von ihm angegebene E-Mail-Adresse zu. Mit der Bestellbestätigung erhalten Nutzer ferner eine Kopie der AGB nebst Widerrufsbelehrung. Auftragsverarbeitungsverträge werden den Nutzern zum Download angeboten oder alternativ in einer E-Mail zugesendet. Kurz gesagt Du kannst mite 30 Tage lang kostenlos testen. Entscheidest du dich für mite, gib bitte deine Zahlungsdaten ein. mite kostet dann monatliche 5€ pro Nutzer. Andernfalls läuft dein Probeaccount einfach aus. 4. Altkunden (bis 05.06.2008) (1) Die Vergütungspflicht nach der kostenlosen Testphase gemäß Ziff. 3 gilt nicht für Kunden, die bis einschließlich 05.06.2008 einen Account bei mite erstellt haben, der zu diesem Zeitpunkt mindestens zehn Zeiteinträge und mindestens zehn Logins aufwies (»Altkunden«). (2) Für Altkunden gilt stattdessen die »Zahl so fair du bist«-Regelung. Altkunden können mite mit freiwilligen Zahlungen unterstützen – ob und wie stark der Altkunde mite unterstützt, entscheidet allein der Altkunde. Den fairen Betrag kann der Nutzer unter dem Menüpunkt »Account« wählen. Kurz gesagt Liebe Testnutzer der allerersten Stunde: Merci für eure Unterstützung! Als kleines Dankeschön stellen wir euch frei, wieviel ihr für mite berappen möchtet. 5. Hinweis zum Widerrufsrecht für Verbraucher Widerrufsrecht Sie haben das Recht, binnen vierzehn Tagen ohne Angabe von Gründen diesen Vertrag zu widerrufen. Die Widerrufsfrist beträgt vierzehn Tage ab dem Tag des Vertragsabschlusses. Um Ihr Widerrufsrecht auszuüben, müssen Sie uns (mite GmbH, Oranienstraße 166, 10999 Berlin, Deutschland, E-Mail: , +49 176 20772667) mittels einer eindeutigen Erklärung (z. B. ein mit der Post versandter Brief, Telefax oder E-Mail) über Ihren Entschluss, diesen Vertrag zu widerrufen, informieren. Sie können dafür das beigefügte Muster-Widerrufsformular verwenden, das jedoch nicht vorgeschrieben ist. Zur Wahrung der Widerrufsfrist reicht es aus, dass Sie die Mitteilung über die Ausübung des Widerrufsrechts vor Ablauf der Widerrufsfrist absenden. Folgen des Widerrufs Wenn Sie diesen Vertrag widerrufen, haben wir Ihnen alle Zahlungen, die wir von Ihnen erhalten haben, einschließlich der Lieferkosten (mit Ausnahme der zusätzlichen Kosten, die sich daraus ergeben, dass Sie eine andere Art der Lieferung als die von uns angebotene, günstigste Standardlieferung gewählt haben), unverzüglich und spätestens binnen vierzehn Tagen ab dem Tag zurückzuzahlen, an dem die Mitteilung über Ihren Widerruf dieses Vertrags bei uns eingegangen ist. Für diese Rückzahlung verwenden wir dasselbe Zahlungsmittel, das Sie bei der ursprünglichen Transaktion eingesetzt haben, es sei denn, mit Ihnen wurde ausdrücklich etwas anderes vereinbart; in keinem Fall werden Ihnen wegen dieser Rückzahlung Entgelte berechnet. Haben Sie verlangt, dass die Dienstleistungen während der Widerrufsfrist beginnen soll, so haben Sie uns einen angemessenen Betrag zu zahlen, der dem Anteil der bis zu dem Zeitpunkt, zu dem Sie uns von der Ausübung des Widerrufsrechts hinsichtlich dieses Vertrags unterrichten, bereits erbrachten Dienstleistungen im Vergleich zum Gesamtumfang der im Vertrag vorgesehenen Dienstleistungen entspricht. Muster-Widerrufsformular (Wenn Sie den Vertrag widerrufen wollen, dann füllen Sie bitte dieses Formular aus und senden Sie es zurück.) An mite GmbH, Oranienstraße 166, 10999 Berlin, Deutschland, E-Mail: Hiermit widerrufe(n) ich/wir (*) den von mir/uns (*) abgeschlossenen Vertrag über den Kauf der folgenden Waren (*)/die Erbringung der folgenden Dienstleistung (*) Bestellt am (*)/erhalten am (*) Name des/der Verbraucher(s) Anschrift des/der Verbraucher(s) Unterschrift des/der Verbraucher(s) (nur bei Mitteilung auf Papier) Datum (*) Unzutreffendes streichen. Kurz gesagt Bist du Verbraucher, gilt wie für jeden anderen Dienst natürlich auch für mite das gesetzlich bis aufs letzte Komma vorgeschriebene Widerrufsrecht. 6. Zahlung / Rechnung (1) Die monatliche Vergütung für die Nutzung von mite wird jeweils zum Ende des Abrechnungsmonats fällig. Die Zahlung der monatlichen Vergütung erfolgt durch Einzug per SEPA-Lastschrift oder Kreditkartenzahlung. Die Frist für die Vorabankündigung einer SEPA-Lastschrift (Pre-Notification) wird auf 1 Tag verkürzt. (2) Der Nutzer hat dafür Sorge zu tragen, dass das Bank- oder Kreditkarten-Konto, von dem der Betrag abgebucht wird, über die erforderliche Deckung verfügt. Für den Fall, dass die Zahlung aufgrund von Umständen, die vom Nutzer zu vertreten sind, nicht erfolgt, kann die mite GmbH die entstandenen Mehrkosten (z.B. Kosten der Rücklastschrift) dem Nutzer in der jeweils angefallenen Höhe berechnen. (3) Nutzern von mite werden monatlich Rechnungen im PDF-Format zur Verfügung gestellt. Kurz gesagt Gebühren werden monatlich fällig und im Nachhinein abgerechnet. Du kannst per Lastschrift oder per Kreditkarte zahlen. Jede Zahlung wird durch eine PDF-Rechnung belegt. 7. Beendigung / Kündigung (1) Der Nutzer kann den Vertrag für die Nutzung von mite jederzeit zum Ende des laufenden Abrechnungsmonats unter dem Menüpunkt »Account« kündigen. Sofern der Nutzer diese Möglichkeit nicht nutzen kann, kann die Kündigung auch schriftlich oder in Textform gegenüber der mite GmbH erklärt werden. (2) Der Nutzer kann jederzeit Sicherungskopien seiner Daten in einem weiterverarbeitbaren Format in seinem Account herunterladen. Nach einer Frist von 14 Tagen nach Kündigung des Accounts wird er gelöscht. (3) Die mite GmbH hat das Recht, das Vertragsverhältnis mit einem Nutzer ohne Angabe von Gründen mit einer Frist von drei Monaten zum Ende eines Abrechnungsmonates zu kündigen. (4) Sollte der Nutzer mit der Zahlung des monatlichen Betrages mehr als 8 Wochen in Verzug sein, behält die mite GmbH sich das Recht vor, das Vertragsverhältnis zum Ende des laufenden Abrechnungsmonats zu kündigen. Ansprüche der mite GmbH, die durch die bisherige Nutzung von mite durch den Nutzer entstanden sind, bleiben hiervon unberührt. (5) Im Falle einer missbräuchlichen Nutzung (vgl. Ziff. 8 Absatz 3) von mite, die zu erheblichen Beeinträchtigungen der Leistungen der mite GmbH für Dritte führt, behält die mite GmbH sich die außerordentliche Kündigung des Vertragsverhältnisses vor. (6) Ein etwaiges außerordentliches Kündigungsrecht des Nutzers oder der mite GmbH bleibt unberührt. Kurz gesagt Du kannst jederzeit kündigen. Wir halten weder dich noch deine Daten fest. Dir können wir ebenfalls kündigen – tun dies aber nur, falls du groben Unfug treiben solltest oder trotz mehrfacher Mahnungen nicht zahlst. 8. Pflichten der Nutzer (1) Der Nutzer ist verpflichtet, Informationen zu seinen Zahlungsdaten (einschließlich der Rechnungsanschrift), die im Rahmen der Account-Erstellung bzw. -Änderung angegeben werden, wahrheitsgemäß anzugeben, sofern mite über die kostenlose Testphase hinaus genutzt werden soll. (2) Der Nutzer ist verpflichtet, die Zugangsdaten für seinen Account vor der unberechtigten Kenntnisnahme Dritter zu schützen. (3) Dem Nutzer ist es untersagt, die Leistungen der mite GmbH, insbesondere den Dienst mite, missbräuchlich in Anspruch zu nehmen. Eine missbräuchliche Nutzung liegt insbesondere in folgenden Fällen vor: die Veröffentlichung oder Verbreitung rechtswidriger oder diffamierender Inhalte die Nutzung von technischen Hilfsmitteln oder Methoden, die die Funktionsfähigkeit der Dienste des Anbieters beeinträchtigen oder beeinträchtigen können (Software, Skripte, Bots etc) (4) Nutzer verpflichten sich die geltenden Datenschutzvorgaben zu beachten, die gesetzlich erforderlichen Verträge oder Vereinbarungen abzuschließen (insbesondere Auftragsverarbeitungsverträge) und mite nicht zur rechtswidrigen Verarbeitung personenbezogener Daten zu nutzen. (5) Die mite GmbH ist berechtigt, vom Nutzer erstellte Inhalte, die rechtswidrig und/oder missbräuchlich sind, unverzüglich zu löschen. Kurz gesagt Zur Abrechnung benötigen wir korrekte Zahlungsdaten, alles andere kannst du gerne soweit sinnvoll möglich anonymisieren. Bitte gib gut auf deine Zugangsdaten acht. Und nutze mite nicht für Illegales oder lege unsere Server lahm, aber das versteht sich ja von selbst. 9. API-Nutzung (1) Die mite GmbH bietet seinen Nutzern optional einen ergänzenden Zugriff auf ihre Daten über eine sog. API (Application Programming Interface) an. (2) Der Zugriff über die API ist standardmäßig deaktiviert. Der Nutzer kann den Zugriff via API in seinem mite.account aktivieren. Soll der Dienst eines Drittanbieters über die API Zugriff auf Daten eines Accounts oder Nutzers erhalten, ist die zusätzliche Eingabe der Zugangsdaten im jeweiligen Dienst erforderlich. (3) Die mite GmbH ist nicht verantwortlich für Dienste oder die Nutzung von Diensten von Drittanbietern, die über die API Zugang zu Daten des Accounts oder des Nutzers erhalten. Kurz gesagt Unabhängige API-Entwickler sind genau das: unabhängig. Für ihre Add-ons oder sonstigen Anwendungen sind wir nicht verantwortlich. 10. Nutzungsrechte (1) Die mite GmbH räumt jedem Nutzer ein einfaches, nicht ausschließliches Recht ein, mite für die Dauer des Vertrages für eigene Zwecke zu nutzen. Dieses Nutzungsrecht ist nicht übertragbar. (2) mite ist ein Webservice, der über den Zugriff zum Server bzw. zu Servern der mite GmbH erfolgt. Eine Überlassung der Software an den Nutzer erfolgt nicht. (3) Sofern während der Laufzeit des Vertrages neue Versionen, Updates, Upgrades oder andere Änderungen an mite vorgenommen werden, gelten die vorstehenden Regelungen. Kurz gesagt Urheberrechtlich betrachtet ist und bleibt mite unser Tool. Alle Nutzungsrechte, die du zum Einsatz von mite sinnvollerweise benötigst, räumen wir dir natürlich ein. 11. Verfügbarkeit der Leistungen Die mite GmbH gewährleistet eine Verfügbarkeit der Leistungen i.S.d Ziff. 2 Abs. 1 in Höhe von 95% im Jahresmittel. Von der Gewährleistung ausgeschlossen sind Leistungsmängel, die nicht von der mite GmbH zu vertreten sind. Im Übrigen gilt das gesetzliche Gewährleistungsrecht. Kurz gesagt Es bleibt ein Wunschtraum, dass Technik immer zu 100% funktioniert. Das können wir nicht verhindern – die Realität aber viele Neuner nah an diesen Traum heranschubsen. 12. Haftungsbeschränkung (1) Die mite GmbH haftet bei Vorsatz oder grober Fahrlässigkeit für alle von der mite GmbH im Zusammenhang mit der Erbringung der vertragsgemäßen Leistungen verursachten Schäden unbeschränkt. (2) Bei leichter Fahrlässigkeit haftet die mite GmbH im Fall der Verletzung des Lebens, des Körpers oder der Gesundheit unbeschränkt. (3) Für unentgeltliche Dienste besteht eine über die in Absatz 1 und Absatz 2 hinausgehende Haftung der mite GmbH nicht. (4) Im Übrigen haftet die mite GmbH im Zusammenhang mit der Erbringung entgeltlicher Leistunge"
