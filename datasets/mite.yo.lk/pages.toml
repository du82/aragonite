["https://mite.yo.lk/manifest.html"]
title = "mite. Das Manifest."
description = "Mit mite wollen wir eine Anwendung bereitstellen, die begeistert, nicht nur befriedigt. Vom ersten Zeiteintrag über Support & Service bis hin zur Kündigung."
full_description = "Mit mite wollen wir eine Anwendung bereitstellen, die begeistert, nicht nur befriedigt. Vom ersten Zeiteintrag über Support & Service bis hin zur Kündigung. Wir glauben an schlanke Software. mite blendet dich nicht mit einem Wirrwarr bunter Knöpfchen und unzähliger Optionen. Funktionen begrenzen wir auf das Essentielle. Werkzeuge, die Tag für Tag benutzt werden, müssen einfach sein. Schnell. Und intuitiv bedienbar. Wir glauben an flexible Software. mite soll sich deiner Arbeitsweise anpassen, nicht umgekehrt. Als Werkzeug reichen wir dir offen angelegte Strukturen, die du kreativ für dich nutzen kannst. Deinen Bedürfnissen und Arbeitsabläufen entsprechend. Wir glauben an Freude fürs Auge. mite würde auch mit einer weniger durchdachten und liebevoll gestalteten Oberfläche das tun, was er eben tut. Fitzelkleine Texte, Tabellenwüsten und Farbenblindheit machen allerdings nicht glücklich. mite schon. Wir glauben an Gespräche. Deine Verbesserungsvorschläge bringen mite den entscheidenden Schritt voran. Nur du weißt wirklich, was dir fehlt, und vor allem: was nicht. Was dich nervt an mite und was du liebst. Diskutiere mit uns, wie es weitergehen soll und beeinflusse die Entwicklung in deinem Sinne. Wir glauben an Ehrlichkeit. Eigentlich eine Selbstverständlichkeit, doch wie die Praxis mancher Unternehmen aussieht, weißt du so gut wie wir. Vom Marketinghimmel gefallene Pseudowahrheiten ersetzen wir durch offene und klare Information: wenn etwas schief geht, erfährst du es auch. mite kostenlos testen. In vollem Umfang, für 30 Tage."
year_published = 2025
