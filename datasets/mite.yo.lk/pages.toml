["https://mite.yo.lk/datenschutz.html"]
title = "mite. Datenschutzerklärung."
full_description = "Datenschutzerklärung Einleitung Diese Datenschutzerklärung klärt über die Art, den Umfang und Zweck der Verarbeitung von personenbezogenen Daten (nachfolgend kurz Daten) auf. Daten werden innerhalb unserer Online-Software mite, ihrer Funktionen und Inhalte, den mit ihr verbundenen Webseiten sowie externen Onlinepräsenzen wie z.B. Social-Media-Profilen (nachfolgend gemeinsam bezeichnet als Onlineangebot) verarbeitet: Der erste Abschnitt der Datenschutzerklärung beinhaltet Angaben zum Verantwortlichen der Verarbeitung sowie eine Übersicht unserer Verarbeitungsvorgänge. Der zweite Abschnitt beinhaltet Hinweise zu deinen Rechten, den einschlägigen Rechtsnormen und generelle Hinweise zu unserer Verarbeitung von Daten. Der dritte Abschnitt beinhaltet Angaben zu den einzelnen Verarbeitungsvorgängen. Der vierte und letzte Abschnitt beinhaltet Erläuterungen und Beschreibungen der im Rahmen der Datenschutzerklärung verwendeten Begriffe. Wenn dir verwendete Begriff wie z.B. »Cookie« unbekannt sind, schlage diese bitte im letzten Abschnitt nach. Abschnitt I – Verantwortlicher und Übersicht der Datenverarbeitungen Verantwortlicher mite GmbH Oranienstraße 166, 10999 Berlin, Deutschland Vertretungsberechtigte Geschäftsführer: Sebastian Munz & Julia Soergel Telefon: +49 176 20772667 E-Mail: hey@mite.de Vollständiges Impressum: https://mite.de/impressum.html Der Verantwortliche wird nachfolgend auch bezeichnet als wir oder uns. Beschreibung unserer Leistungen und Aufgaben mite ist ein Online-Tool zur Erfassung und Auswertung von Arbeitszeiten für Nutzer von mite. Arten der verarbeiteten Daten Bestandsdaten (Kundenstammdaten: Firmenname, Ansprechpartner, Anschrift, UmsatzStNr., E-Mailadresse); Benutzer- und Accountdaten (Name, E-Mailadresse, kryptografischer Hash des Passworts); Zahlungsdaten (Kontodaten und/oder Kreditkartendaten); Vertragsdaten (Art der Leistung, Entgelt, Laufzeit, Vertragshistorie, Zahlungshistorie); Inhaltsdaten, die selbst von Kunden/ Nutzern in mite eingegeben werden (Arbeitszeiten, Kunden, Projekte, Leistungen); Nutzungsdaten/ Metadaten (Server-Logging: IP-Adresse, User Agent, Requestparameter, Zeitstempel). Verarbeitung besonderer Kategorien von Daten (Art. 9 Abs. 1 DSGVO) Es werden grundsätzlich keine besonderen Kategorien von Daten verarbeitet, außer diese werden durch die Nutzer der Verarbeitung zugeführt, z.B. in Onlineformulare eingegeben. Kategorien der von der Verarbeitung betroffenen Personen Kunden, Testnutzer, Geschäftspartner Besucher und Nutzer des Onlineangebotes Nachfolgend bezeichnen wir die Betroffenen zusammenfassend auch als Nutzer. Zweck der Verarbeitung Zurverfügungstellung des Onlineangebotes, seiner Inhalte und Funktionen. Angebot und Betrieb von mite (Software as a Service) und verbundener Leistungen (Rechenkapazitäten, Datenbanken, Software, Pflege und Entwicklung). Sicherheitsmaßnahmen. Beantwortung von Kontaktanfragen und Kommunikation mit Nutzern. Marketing, Werbung und Marktforschung. Automatisierte Entscheidung im Einzelfall (Art. 22 DSGVO) Es werden keine automatisierten Entscheidungen vorgenommen. Stand Februar 2023 Abschnitt II – Betroffenenrechte, Rechtsgrundlagen und generelle Hinweise Rechte der betroffenen Personen Du hast das Recht, eine Bestätigung darüber zu verlangen, ob betreffende Daten verarbeitet werden und auf Auskunft über diese Daten sowie auf weitere Informationen und Kopien der Daten entsprechend Art. 15 DSGVO. Du hast entsprechend Art. 16 DSGVO das Recht, die Vervollständigung der dich betreffenden Daten oder die Berichtigung der dich betreffenden unrichtigen Daten zu verlangen. Du hast nach Maßgabe des Art. 17 DSGVO das Recht zu verlangen, dass betreffende Daten unverzüglich gelöscht werden, bzw. alternativ nach Maßgabe des Art. 18 DSGVO eine Einschränkung der Verarbeitung der Daten zu verlangen. Du hast das Recht zu verlangen, dich betreffenden Daten, die du uns bereitgestellt hast, nach Maßgabe des Art. 20 DSGVO zu erhalten und deren Übermittlung an andere Verantwortliche zu fordern. Du hast ferner gem. Art. 77 DSGVO das Recht, eine Beschwerde bei der zuständigen Aufsichtsbehörde einzureichen. Widerrufsrecht Du hast das Recht, erteilte Einwilligungen gem. Art. 7 Abs. 3 DSGVO mit Wirkung für die Zukunft zu widerrufen. Widerspruchsrecht Du kannst der künftigen Verarbeitung der dich betreffenden Daten nach Maßgabe des Art. 21 DSGVO jederzeit widersprechen. Der Widerspruch kann insbesondere gegen die Verarbeitung für Zwecke der Direktwerbung erfolgen. Cookies und Widerspruchsrecht im Direktmarketing Wir setzen temporäre und permanente Cookies ein, d.h. kleine Dateien, die auf den Geräten der Nutzer gespeichert werden (Erklärung des Begriffs und der Funktion siehe letzter Abschnitt dieser Datenschutzerklärung). Zum Teil dienen die Cookies der Sicherheit oder sind zum Betrieb unseres Onlineangebotes erforderlich (z.B. für die Funktionsfähigkeit von mite). Falls du nicht möchtest, dass Cookies auf deinem Rechner gespeichert werden, aktiviere bitte die entsprechende Option in den Systemeinstellungen deines Browsers. Gespeicherte Cookies können in den Systemeinstellungen des Browsers gelöscht werden. Der Ausschluss von Cookies kann und wird zu Funktionseinschränkungen dieses Onlineangebotes führen. Ausschließlich automatisierte Datenverarbeitung Du hast nach Maßgabe des Art. 22 DSGVO das Recht, nicht einer ausschließlich auf einer automatisierten Verarbeitung – einschließlich Profiling – beruhenden Entscheidung unterworfen zu werden, die dir gegenüber rechtliche Wirkung entfaltet oder dich in ähnlicher Weise erheblich beeinträchtigt. Wir teilen mit, dass wir keine ausschließlich automatisierten Datenverarbeitungen durchführen. Löschung von Daten und Archivierungspflichten Die von uns verarbeiteten Daten werden nach Maßgabe der Art. 17 und 18 DSGVO gelöscht oder in ihrer Verarbeitung eingeschränkt. Sofern nicht im Rahmen dieser Datenschutzerklärung ausdrücklich angegeben, werden die bei uns gespeicherten Daten gelöscht, sobald sie für ihre Zweckbestimmung nicht mehr erforderlich sind und der Löschung keine gesetzlichen Aufbewahrungspflichten entgegenstehen. Sofern die Daten nicht gelöscht werden, weil sie für andere und gesetzlich zulässige Zwecke erforderlich sind, wird deren Verarbeitung eingeschränkt. D.h. die Daten werden gesperrt und nicht für andere Zwecke verarbeitet. Das gilt z.B. für Daten, die aus handels- oder steuerrechtlichen Gründen aufbewahrt werden müssen. Nach gesetzlichen Vorgaben erfolgt die Aufbewahrung insbesondere für 6 Jahre gemäß § 257 Abs. 1 HGB (Handelsbücher, Inventare, Eröffnungsbilanzen, Jahresabschlüsse, Handelsbriefe, Buchungsbelege, etc.) sowie für 10 Jahre gemäß § 147 Abs. 1 AO (Bücher, Aufzeichnungen, Lageberichte, Buchungsbelege, Handels- und Geschäftsbriefe, Für Besteuerung relevante Unterlagen, etc.) Änderungen und Aktualisierungen der Datenschutzerklärung Wir bitten dich darum, dich regelmäßig über den Inhalt unserer Datenschutzerklärung zu informieren. Wir passen die Datenschutzerklärung an, sobald die Änderungen der von uns durchgeführten Datenverarbeitungen dies erforderlich machen. Wir informieren dich, sobald durch die Änderungen eine Mitwirkungshandlung deinerseits (z.B. Einwilligung) oder eine sonstige individuelle Benachrichtigung erforderlich wird. Maßgebliche Rechtsgrundlagen Nach Maßgabe des Art. 13 DSGVO teilen wir dir die Rechtsgrundlagen unserer Datenverarbeitungen mit. Sofern die Rechtsgrundlage in der Datenschutzerklärung nicht genannt wird, gilt Folgendes: Die Rechtsgrundlage für die Einholung von Einwilligungen ist Art. 6 Abs. 1 lit. a und Art. 7 DSGVO, die Rechtsgrundlage für die Verarbeitung zur Erfüllung unserer Leistungen und Durchführung vertraglicher Maßnahmen sowie Beantwortung von Anfragen ist Art. 6 Abs. 1 lit. b DSGVO, die Rechtsgrundlage für die Verarbeitung zur Erfüllung unserer rechtlichen Verpflichtungen ist Art. 6 Abs. 1 lit. c DSGVO, und die Rechtsgrundlage für die Verarbeitung zur Wahrung unserer berechtigten Interessen ist Art. 6 Abs. 1 lit. f DSGVO. Für den Fall, dass lebenswichtige Interessen der betroffenen Person oder einer anderen natürlichen Person eine Verarbeitung personenbezogener Daten erforderlich machen, dient Art. 6 Abs. 1 lit. d DSGVO als Rechtsgrundlage. Die Grundlagen für kommerziellen Kommunikationen außerhalb von Geschäftsbeziehungen, insbesondere via Post, Telefon, Fax und E-Mail sind im § 7 UWG enthalten. Sicherheit der Datenverarbeitung Wir treffen nach Maßgabe des Art. 32 DSGVO unter Berücksichtigung des Stands der Technik, der Implementierungskosten und der Art, des Umfangs, der Umstände und der Zwecke der Verarbeitung sowie der unterschiedlichen Eintrittswahrscheinlichkeit und Schwere des Risikos für die Rechte und Freiheiten natürlicher Personen, geeignete technische und organisatorische Maßnahmen, um ein dem Risiko angemessenes Schutzniveau zu gewährleisten; Zu den Maßnahmen gehören insbesondere die Sicherung der Vertraulichkeit, Integrität und Verfügbarkeit von Daten durch Kontrolle des physischen Zugangs zu den Daten, als auch des sie betreffenden Zugriffs, der Eingabe, Weitergabe, der Sicherung der Verfügbarkeit und ihrer Trennung. Des Weiteren haben wir Verfahren eingerichtet, die eine Wahrnehmung von Betroffenenrechten, Löschung von Daten und Reaktion auf Gefährdung der Daten gewährleisen. Ferner berücksichtigen wir den Schutz personenbezogener Daten bereits bei der Entwicklung bzw. Auswahl von Hardware und Software sowie verfahren entsprechend dem Prinzip des Datenschutzes durch Technikgestaltung und durch datenschutzfreundliche Voreinstellungen (Art. 25 DSGVO). Zu den Sicherheitsmaßnahmen gehört insbesondere die verschlüsselte Übertragung von Daten zwischen deinem Browser und unseren Servern. Offenlegung und Übermittlung von Daten Sofern wir im Rahmen unserer Verarbeitung Daten gegenüber anderen Personen und Unternehmen (Auftragsverarbeitern oder Dritten) offenbaren, sie an diese übermitteln oder ihnen sonst Zugriff auf die Daten gewähren, erfolgt dies nur auf Grundlage einer gesetzlichen Erlaubnis (z.B. wenn eine Übermittlung der Daten an Dritte, wie an Zahlungsdienstleister, gem. Art. 6 Abs. 1 lit. b DSGVO zur Vertragserfüllung erforderlich ist), du eingewilligt hast, eine rechtliche Verpflichtung dies vorsieht oder auf Grundlage unserer berechtigten Interessen (z.B. beim Einsatz von Beauftragten, Hostinganbietern, etc.). Sofern wir Dritte mit der Verarbeitung von Daten auf Grundlage eines so genannten Auftragsverarbeitungsvertrages beauftragen, geschieht dies auf Grundlage des Art. 28 DSGVO. Übermittlungen in Drittländer Sofern wir Daten in einem Drittland (d.h. außerhalb der Europäischen Union (EU) oder des Europäischen Wirtschaftsraums (EWR)) verarbeiten oder dies im Rahmen der Inanspruchnahme von Diensten Dritter oder Offenlegung, bzw. Übermittlung von Daten an Dritte geschieht, erfolgt dies nur, wenn es zur Erfüllung unserer (vor)vertraglichen Pflichten, auf Grundlage deiner Einwilligung, aufgrund einer rechtlichen Verpflichtung oder auf Grundlage unserer berechtigten Interessen geschieht. Vorbehaltlich gesetzlicher oder vertraglicher Erlaubnisse verarbeiten oder lassen wir die Daten in einem Drittland nur beim Vorliegen der besonderen Voraussetzungen der Art. 44 ff. DSGVO verarbeiten. D.h. die Verarbeitung erfolgt z.B. auf Grundlage besonderer Garantien, wie der offiziell anerkannten Feststellung eines der EU entsprechenden Datenschutzniveaus (z.B. durch einen Beschluss der EU-Kommission) oder Beachtung offiziell anerkannter spezieller vertraglicher Verpflichtungen (so genannte Standardvertragsklauseln oder Standarddatenschutzklauseln). Abschnitt III – Verarbeitungsprozesse In der nachfolgenden Darstellung erhältst du eine Übersicht der von uns vorgenommenen Verarbeitungstätigkeiten, die wir in weitere Tätigkeitsbereiche untergliedert haben. Bitte beachte, dass die Tätigkeitsbereiche nur der Orientierung dienen und dass die Verarbeitungstätigkeiten sich überschneiden können (z.B. können dieselben Daten in mehreren Verfahren verarbeitet werden). Aus Gründen der Übersichtlichkeit und Verständlichkeit finde die sich häufig wiederholenden Begrifflichkeiten im Abschnitt IV dieser Datenschutzerklärung. Vertragliche Leistungen (mite) Wir verarbeiten die Daten unserer Kunden im Rahmen des Angebotes von mite, um unsere vertragsgemäßen Leistungen zu erbringen. Verarbeitete Daten: Kundenstammdaten (Firmenname, Ansprechpartner, Anschrift, UmsatzStNr., E-Mailadresse), Benutzer- und Accountdaten (Name, E-Mailadresse, kryptografischer Hash des Passworts), Zahlungsdaten (Kontodaten und/oder Kreditkartendaten, Vertragsdaten (Art der Leistung, Entgelt, Laufzeit, Vertragshistorie, Zahlungshistorie), Inhaltsdaten, die selbst von Kunden/ Nutzern in mite eingegeben werden (Arbeitszeiten, Kunden, Projekte, Leistungen), Nutzungsdaten/ Metadaten (Server-Logging: IP-Adresse, User Agent, Requestparameter, Zeitstempel). Besondere Kategorien personenbezogener Daten: Es werden grundsätzlich keine besonderen Kategorien von Daten verarbeitet, außer diese werden durch die Nutzer eingegeben. Betroffene: Kunden, Testnutzer, Geschäftspartner. Zweck der Verarbeitung: Infrastruktur- und Plattformdienstleistungen, Rechenkapazität, Speicherplatz und Datenbankdienste, Sicherheitsleistungen, technische Wartungsleistungen. Verarbeitungsgrundlagen: Art. 6 Abs. 1 lit. b (Durchführung Bestellvorgänge) und c (Gesetzlich erforderliche Archivierung) DSGVO. Erforderlichkeit / Interesse an Verarbeitung: Die Daten sind zur Begründung und Erfüllung der vertraglichen Leistungen erforderlich. Offenlegung extern und Zweck: Nur zwecks Hostings oder im Rahmen der gesetzlichen Erlaubnisse und Pflichten gegenüber Rechtsberatern und Behörden.. Verarbeitung in Drittländern: Nein. Löschung der Daten: Inhaltsdaten, die selbst von Kunden in mite eingegeben werden, werden 14 Tage nach Kündigung des Accounts gelöscht; Daten von Testnutzern werden 28 Tage nach Ablauf des Probeaccounts oder Kündigung gelöscht; Kundenstammdaten werden unbegrenzt gespeichert, außer sie sind nicht mehr erforderlich; die Erforderlichkeit der Aufbewahrung der Daten wird alle drei Jahre überprüft; im Fall der gesetzlichen Archivierungspflichten erfolgt die Löschung nach deren Ablauf (Ende handelsrechtlicher, 6 J / steuerrechtlicher, 10 J, Aufbewahrungspflicht; Hosting mite-Daten Die von uns in Anspruch genommenen Hosting-Leistungen dienen der Zurverfügungstellung der folgenden Leistungen: Infrastruktur- und Plattformdienstleistungen, Rechenkapazität, Speicherplatz und Datenbankdienste, Sicherheitsleistungen, Technische Wartungsleistungen. Verarbeitete Daten: Bestandsdaten, Kontaktdaten, Inhaltsdaten, Vertragsdaten, Nutzungsdaten, Meta-/Kommunikationsdaten. Besondere Kategorien personenbezogener Daten: nein. Verarbeitungsgrundlagen: Art. 6 Abs. 1 lit. f DSGVO. Betroffene: Kunden, Interessenten. Besondere Schutzmaßnahmen: Auftragsverarbeitungsvertrag. Verarbeitung in Drittländern: nein. Offenlegung extern und Zweck: SysEleven GmbH, Umspannwe"
