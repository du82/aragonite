["https://mite.yo.lk/blog/2017/02/06/angebote-software-grip-integriert-mite"]
title = "mite.blog. Angebots-Software Grip integriert mite"
full_description = "6. Februar 2017 Angebots-Software Grip integriert mite Die mite.community wächst: Auch Grip spielt ab sofort mit mite zusammen. Grip ist eine webbasierte Software zur Erstellung professioneller Angebote, primär für Webdesign-Projekte. Ein mit Grip erstelltes Angebot kann man als PDF verschicken oder dem Kunden direkt über Grip zukommen lassen. Der Kunde kann das Angebot dann online annehmen, kommentieren oder ablehnen. Und Grip behält den Überblick über den Status all deiner Angebote. Dank der Integration mit mite kann man nun direkt von Grip aus die Arbeitszeit stoppen, die in die Erstellung eines Angebots fließt. Zusätzlich unterstützt die Verknüpfung dabei, Budgets im Auge zu behalten: Grip stellt den im Angebot kalkulierten Zeiten die tatsächlichen, mit mite erfassten, gegenüber. Wie genau du dein Grip-Konto mit deinem mite.account verknüpfen kannst und was genau die Integration bietet, erklärt Grip in einem ausführlichen Hilfe-Artikel. Die Verknüpfung wurde vom Münchener T8 Lab, dem Macher von Grip, in Eigenregie umgesetzt. Vielen lieben Dank für das Engagement, Till! Julia in Add-ons Selbst kommentieren?"
