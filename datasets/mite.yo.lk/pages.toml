["https://mite.yo.lk/blog/tag/in-eigener-sache"]
title = "mite.blog. Inside out"
description = "Neuigkeiten, Diskussionen, Tipps & Tricks rund um mite, die schlanke Zeiterfassung für Teams & Freiberufler, webbasierte Software & Agile Entwicklung."
full_description = "19. Juni 2024 Die E-Rechnung kommt Wenn euch das nächste Mal eine Rechnung von uns über die Nutzungsgebühren für mite zugeht, werdet ihr optisch keinen Unterschied feststellen. Weiterhin stellen wir sie euch als PDF per Mail zu. Das PDF ist ab sofort jedoch schlauer: Zusätzlich zum Sichtpart ist eine kleine XML-Datei eingebettet, die die Rechnungsdaten in maschinenlesbarer Form enthält. ZUGFeRD / Factur-X nennt sich dieses Format. Es ermöglicht das Beste zweier Welten: Menschen können PDF-Rechnungen weiterhin wie gewohnt mit allen gängigen PDF-Readern ansehen und prüfen. Zusätzlich liegen die Daten aber eben auch in strukturiertem, standardisierten Format vor. Buchhaltungs-Software wie DATEV und diverse Rechnungs-Tools können solch Rechnungen dann automatisiert verarbeiten. E-Rechnungen – ein Sammelbegriff für elektronische Rechnungen nach Standards wie ZUGFeRD, Factur-X oder XRechnung – werden in Deutschland für B2B ab 2025 stufenweise Pflicht. Hintergrund ist die EU-Richtlinie 2014/55. Weitere Infos zum Thema E-Rechnungspflicht in Deutschland und ein zeitlicher Fahrplan finden sich beispielsweise bei der IHK. Maschinen voraus! Julia in In eigener Sache 17. November 2023 Neues: Nun auch auf Mastodon Ab sofort findet ihr uns auch auf Mastodon: https://mastodon.social/@miteWir werden dort niederfrequent Neuigkeiten aus der guten Stube und dem Maschinenraum unserer kleinen App posten. Gleichzeitig sagen wir: Gute Nacht, Twitter. Über 15 Jahre waren wir dort als @mite unterwegs. Und schön war's. Aber auf X fühlen wir uns nicht mehr wohl. Es ist nicht auszuhalten und schon gar nicht mitzutragen, was Musk aus dieser Plattform macht. Wir hoffen, euch an einem zivilisierten Ort wiederzufinden – wenn ihr denn möchtet. Auch hier auf unserem hausgemachten Blog werden wir natürlich weiterhin informieren. Merci, auf ein Neues, und weiter mit Wichtigerem. Julia in In eigener Sache 14. Februar 2023 Anstehender Umzug auf mite.de Nach all den Jahren ist es soweit: Wir haben die Domain mite.de kaufen können und packen die Koffer. Ab der Nacht vom kommenden Freitag auf Samstag, den 18. Februar, wird mite sein neues Zuhause beziehen. Wir werden euch natürlich automatisch weiterleiten, niemand wird ins Leere klicken. Aber wir möchten euch dennoch vorab informieren. Ändern wird sich ab Samstag die Adresse eures Accounts: aus dem Login https://[euerTeam].mite.yo.lk/ wird https://[euerTeam].mite.de/ – bitte aktualisiert dann eure Lesezeichen die Infoseiten hier: aus https://mite.yo.lk/ wird https://mite.de/ unsere E-Mailadresse: aus wird Pardon für den Mehraufwand, den wir verursachen werden – aber wir meinen, dass es lohnt. Endlich eine Domain, die nicht aufwendig buchstabiert werden will und für hochgezogene Augenbrauen sorgt. Ahoi, mite.de! Update: Willkommen auf mite.de – olé. Der Umzug lief aus unserer Sicht problemlos. Solltet ihr aber doch über irgendetwas stolpern, meldet euch bitte mit Details, das wäre uns eine große Hilfe. Julia in In eigener Sache, Maschinenraum"
year_published = 2024
