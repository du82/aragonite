["https://mite.yo.lk/blog/2025/01/14/stoerung-13-januar"]
title = "mite.blog. Störung am gestrigen Abend"
full_description = "14. Januar Störung am gestrigen Abend Am gestrigen Abend, dem 13. Januar, war mite leider ab 20:05 CET nicht erreichbar. Die meisten Nutzer:innen konnten ab 20:18 CET, also 13 Minuten später, wieder auf mite zugreifen. Ab 20:59 CET, also nach insgesamt 54 Minuten, war mite wieder vollständig wie gewohnt erreichbar. Unsere Entschuldigung für diesen Ausfall! Ursache waren Störungen in unserem Hauptrechenzentrum bei SysEleven in Berlin. Zwei unserer Server fielen aus und mussten aus einem Backup wiederhergestellt werden. Für solch Fälle laufen bei mite stets redundante Server mit. Auf diese konnten wir den Hauptteil des Traffics umleiten und den Aussetzer so auf eine knappe Viertelstunde begrenzen. Erst mit Wiederherstellung aller Server lief mite dann jedoch wieder für alle stabil. Unser Pardon noch einmal. Wie gleichzeitig unseren Dank für die schnelle Unterstützung im Rechenzentrum. Julia in Maschinenraum Selbst kommentieren?"
