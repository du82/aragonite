["https://mite.yo.lk/plattform"]
title = "Add-ons. Optionale Erweiterungen der webbasierten Zeiterfassung mite."
description = "Zeiterfassung auf dem iPhone oder Android-Smartphone, unter Mac OS oder Windows. Verknüpft mit Rechnungstools, Projektmanagement-Software, Buchhaltungslösungen"
full_description = "Ein wandlungsfähiges Tool: So gerne wie im Desktop-Browser arbeitet mite auch außer Haus. Ob auf dem Smartphone, dem Mac oder in der Konsole. Oder mit Tools externer Anbieter gemeinsam. mite fürs iPhone mite fürs iPhone ist die offizielle App zur Zeiterfassung unterwegs. Zeiten stoppen, nachtragen oder bearbeiten – auch auf kleinem Display klappt das geschmeidig. Die App ist in den Nutzungsgebühren für mite inbegriffen. Details & Download im App Store. mite für (alle) Smartphones Auf Android oder App-müde? Erfasse deine Zeiten unterwegs über die für den mobilen Einsatz optimierte Version von mite. Rufe dafür einfach die Login-Adresse deines Accounts über den Browser deines Smartphones auf, ein extra Download ist nicht vonnöten. mite für macOS mite.nano ist das offizielle Helferlein für Zeiterfassung auf dem Mac. Die App nistet die Stoppuhr direkt in die Systemleiste ein. Per kleinem Aufklappmenü kannnst du neue Zeiteinträge erstellen. mite.nano ist in den Nutzungsgebühren für mite inbegriffen. Details & Download. Apps von Drittanbietern macOS: Fluid zaubert aus jeder Webanwendung ein richtiges Desktop-Programm. Windows: mite.desk ist ein OpenSource-Client zur Zeiterfassung auf dem Desktop, entwickelt von 69°. Direkt von der Konsole aus lässt sich mite dank einer Entwicklung von Lukas Rieder steuern: mite.cmd. Verknüpfte Rechnungstools Das webbasierte Buchhaltungstool Billomat importiert mit mite erfasste Zeiten flexibel als Rechnungsposten. Das Online-Rechnungsprogramm invoiz importiert mit mite erfasste Arbeitszeiten als Rechnungsposten. Die webbasierte Rechnungssoftware easybill importiert Zeiten aus mite ebenfalls als Rechnungsposten. Das webbasierte Buchhaltungstool sevDesk importiert Zeiteinträge aus mite als Rechnungsposten. Das Online-Rechnungstool SalesKing importiert projektbasiert mit mite erfasste Arbeitszeiten. Die Online-Version von WISO MeinBüro importiert Zeiteinträge aus mite als Rechnungsposten. Das Rechnungstool orgamax online importiert ebenfalls flexibel mit mite erfasste Arbeitszeiten in Rechnungen. Auch g*Sales, das Rechnungstool zur Installation auf dem eigenen Server, importiert mit mite erfasste Zeiten. macOS: Das Rechnungsprogramm GrandTotal import mit mite erfasste Zeiten flexibel als Rechnungsposten. Verknüpfte Zeiterfassungen memtime (macOS & Windows) stoppt automatisch, wieviel Zeit du in welchem Programm arbeitest. Verknüpfte Bugtracker & Projektmanagement-Tools Im Bugtracker Mantis können Zeiten dank eines Plugins von Thomas Klein auf Probleme erfasst werden. Zeiterfassung auf Tickets im freien PM-Tool Redmine ermöglicht Thomas Kleins Plugin Redmine2mite. Auch für den freien Bugtracker Trac steht dank Thomas Klein ein Plugin zur Zeiterfassung parat: Trac2mite. Verknüpfte ERPs, Angebotstools und mehr… In Grip kann automatisch gestoppt werden, wieviel Zeit in die Erstellung eines Angebots fließt. All.mite verknüpft mite bidirektional mit PROFFIX simply business, der Business Software für KMUs. Noch Wünsche offen? Unsere offene Datenschnittstelle, die mite.api, freut sich auf frische Ideen!"
