title = "mite.blog. mite.nano für macOS: Version 1.1.0"
full_description = "25. September 2024 mite.nano für macOS: Version 1.1.0 mite.nano, unser Helferlein für den Mac, steht ab sofort in aktualisierter Version parat. Das kleine Add-on sollte dich selbstständig um einen Neustart bitten, du musst nichts aktiv herunterladen. Was ist neu? Für die neue Version 1.1.0 haben wir im Aufklapp-Menü den Bereich »Projekte« ausgebaut, über den man einen neuen Zeiteintrag erstellen kann. Merci für eure Anregungen dazu auf allen Kanälen. Projekte werden nun standardmäßig gruppiert nach Kunde angezeigt. Die neue Ansicht schafft hoffentlich mehr Übersichtlichkeit, vor allem bei gleichbenannten Projekten. Alternativ kann man nun in den Einstellungen wählen, dass mite.nano in diesem Bereich nur Kunden anzeigen soll. Man wählt dann also zuerst den Kunden und dann dessen Projekt aus, das Menü erhält eine zusätzliche Ebene. Probiert die neue Einstellungen am besten einmal selbst aus und entscheidet dann, welche Ansicht für euch besser passt. Wir vermuten, dass die neue Kunden-Ansicht vor allem für Accounts mit sehr vielen Projekten schneller und übersichtlicher ist. Nach dem Projekt wählt man die Leistung des Zeiteintrags. Leistungen werden nun – wie in der Browserversion – gruppiert nach Verrechenbarkeit angezeigt. Auch diese Änderung soll die Übersichtlichkeit verbessern, vor allem dann, wenn man eine Leistung sowohl als verrechenbare als auch als nicht-verrechenbare eingerichtet hat. Bei langen Kunden-, Projekt- und Leistungsnamen werden nun noch mehr Zeichen angezeigt. Das Menü passt sich in der Breite weiter an. Zudem beinhaltet die neue Version von mite.nano Sicherheits- und Stabilitätsupdates. Noch ohne mite.nano? mite.nano ist eine ergänzende App für macOS, die sich in die Menüleiste einnistet. Stets sichtbar wird dir dort die aktuell tickende Stoppuhr angezeigt. So hast du deine Stunden immer genau im Blick und die Stoppuhr kann fast nicht mehr vergessen werden. mite.nano ist eine Eigenentwicklung und wie alles aus unserer Feder in den Nutzungsgebühren für mite inbegriffen. Bitte klicke hier entlang zum gratis Download von mite.nano. Julia in Neue Features, Add-ons Selbst kommentieren?"
year_published = 2024
clearnet = "https://mite.yo.lk/blog/2024/09/25/mite-nano-macos-1-1-0"
