["https://mite.yo.lk/blog/2019/11/20/zeiteintraege-mit-invoiz-abrechnen"]
title = "mite.blog. Die Rechnung, bitte: invoiz importiert mit mite erfasste Arbeitszeiten"
full_description = "20. November 2019 Die Rechnung, bitte: invoiz importiert mit mite erfasste Arbeitszeiten invoiz, das Online-Tool zur Erstellung von Rechnungen, Angeboten und Mahnungen, importiert ab sofort mit mite erfasste Arbeitszeiten. Mit wenigen Klicks lassen sich so Zeiteinträge zu ordentlichen Rechnungen weiterverarbeiten. invoiz ist eine recht neue deutsche Cloud-Lösung aus dem Hause Buhl, den Herausgebern der WISO-Software. Funktionsumfang der Verknüpfung Zuerst wählt man in invoiz die abzurechnenden Zeiteinträge aus mite aus. Hierzu steht eine flexible Suche parat, über die sich Zeiteinträge beispielsweise nach Projekt, Benutzer, Bemerkung oder Zeitraum finden lassen. Zudem kann nach bereits abgerechneten (abgeschlossenen) oder noch offenen Zeiten gefiltert werden. Die zur Abrechnung ausgewählten Zeiteinträge können im nächsten Schritt selbstverständlich durch weitere, von mite unabhängige Rechnungsposten für Materialen oder ähnliches ergänzt werden. Nach der erfolgten Rechnungsstellung in invoiz werden die abgerechneten Zeiteinträge in mite als abgeschlossen markiert. Verknüpfung einrichten Bitte rufe invoiz auf, melde dich an und steuere dort den Menüpunkt »App Store« an. Wähle auf dieser Seite mite als neue App aus. invoiz wird dich daraufhin um das Login deines Accounts bei mite (dessen Subdomain) sowie um die API-Zugangsdaten deines Benutzerkontos bitten. Die mite.api ist unsere offene Datenschnittstelle, über die externe Apps wie invoiz mit deinem mite kommunizieren können. Et voilà! Nach Sicherung der abgefragten Daten ist invoiz mit deinem mite verknüpft. Du kannst deine Zeiteinträge nun dort zu ordentlichen Rechnungen weiterverarbeiten. Merci Die Anbindungen an mite wurde von invoiz in Eigeninitiative entwickelt. Unser herzliches Dankeschön an Moritz und Fin samt Team für ihr Engagement! Für Nutzer von mite, die invoiz noch nicht kennen, nun testen und sich dann für invoiz entscheiden, hat deren Team zudem ein kleines Dankeschön. Per Gutscheincode mite2019 erhältst du nach Planauswahl deinen ersten Monat in invoiz gratis. Dieser Code ist bis zum 31.12.2019 gültig. Julia in Add-ons Selbst kommentieren?"
year_published = 2020
