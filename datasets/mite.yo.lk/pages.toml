["https://mite.yo.lk/hilfe/zeiteingabe-cheat-sheet.html"]
title = "mite. Eingabevarianten Zeiten."
description = "mite unterstützt eine Reihe unterschiedlicher Schreibweisen zur Eingabe von Zeiten. Die Dauer in Stunden:Minuten ist der Standard, doch kann mite einiges mehr."
full_description = "mite unterstützt eine Reihe unterschiedlicher Schreibweisen zur Eingabe von Zeiten. Die Dauer in Stunden:Minuten ist der Standard, doch kann mite einiges mehr. Dauer 1:30 (Stunden:Minuten) oder 1,5 (mit Komma) oder 1.5 (mit Punkt) für 1 Stunde 30 Minuten. 0:00 oder ein leeres Feld für einen Zeiteintrag mit laufender Stoppuhr. Start- und Endzeiten 8 bis 12:30 oder 8 12:30 oder 0800 1230 (Vierer-Ziffernblöcke) für einen Zeitraum von 8:00 bis 12:30 Uhr. mite rechnet die Dauer für dich aus und sichert die angegebene Start- und Endzeit zusätzlich im Bemerkungsfeld. 0:00* oder * für einen Zeiteintrag mit laufender Stoppuhr samt Start- und Endzeit im Bemerkungsfeld. Die Startzeit ist die aktuelle Uhrzeit; die Endzeit zählt automatisch hoch, solange die Stoppuhr tickt. Hängst du das Sternchen an eine Eingabe ins Dauerfeld hinten an, wird stets Start- und Endzeit im Bemerkungsfeld mitabgelegt. Zeiträume können folglich mit einer Dauer oder Grundrechenarten kombiniert werden: arbeitest du beispielsweise seit 10 Minuten, gib 0:10* ein. Schnellstart Stoppuhr 2:00+ für einen zweistündigen Zeiteintrag mit laufender Stoppuhr. Ein hintenangestelltes Plus-Zeichen startet stets zusätzlich die Stoppuhr. Es kann frei mit einer Dauer, einem Zeitraum oder Grundrechenarten kombiniert werden. Grundrechenarten 2+0:15 bzw. 2-0:15 für 2 Stunden plus bzw. minus 15 Minuten. 2*1.5 bzw. 2/1.5 für 2 Stunden multipliziert mit bzw. dividiert durch 1.5."
