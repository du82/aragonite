["https://mite.yo.lk/blog/2009/03/31/grandtotal-mac-rechnungssoftware-importiert-mit-mite-erfasste-arbeitszeiten"]
title = "mite.blog. GrandTotal, die Rechnungssoftware für Mac-User, importiert mit mite erfasste Arbeitszeiten."
full_description = "31. März 2009 GrandTotal, die Rechnungssoftware für Mac-User, importiert mit mite erfasste Arbeitszeiten. Mac-User, aufgepasst: Seit dem letzten Update spricht nun auch GrandTotal mit mite. Die native Leopard-only-Software importiert mit mite erfasste Arbeitszeiten und ermöglicht die einfache Weiterverarbeitung dieser zu ordentlichen Rechnungen. Über GrandTotal Das Schweizer GrandTotal, neben Deutsch und Englisch in zahlreichen anderen Sprachen verfügbar, möchte Mac-Nutzern Aufgaben rund um Rechnungen und Angebote erleichtern. Stilvorlagen, eine präsente Unterstützung von PDFs sowie die enge Integration mit Mac-eigenen Programmen stehen im Fokus des Desktop-Tools. Das 2008 erstmals veröffentlichte GrandTotal ist für 49€ zu haben und kann kostenfrei in vollem Umfang getestet werden. Rechnungserstellung In GrandTotal werden sämtliche mit mite erfassten Zeiteinträge auf einen Schwung importiert. Aus der sortierbaren Liste sämtlicher noch nicht berechneter Zeiteinträge können dann einzelne ausgewählt und in einen Rechnungsentwurf umgewandelt werden – als Einzelposten, oder auch in einer intelligenten Auto-Gruppierung. Im Rechnungsentwurf können dann etwaige notwendige inhaltliche wie darstellende Bearbeitungen vorgenommen werden, wie auch Ergänzungen der Zeitpositionen um Katalog-Positionen. Verknüpfung einrichten Die Integration von mite in GrandTotal wurde, wie auch die Verknüpfung zu Billomat, über unsere offene Datenschnittstelle realisiert. Um die Zusammenarbeit der beiden Tools zu ermöglichen, muss zuallererst der Zugriff auf die mite.api auf Benutzerebene aktiviert werden. Die Option findet sich per Klick auf den eigenen Benutzernamen, rechts oben in mite. Dort einfach die entsprechende Checkbox aktivieren und die Änderungen sichern. In GrandTotal wird dann im Einstellungsbereich unter dem Menüpunkt »TimeLog & Co« die persönliche mite.adresse abgefragt. Ganz unten im Fenster findet sich die Option »Daten von URL beziehen«. Trage hier bitte deine mite.adresse im Format https://meinaccount.mite.de/time_entries.xml ein – ersetzte das ‘meinaccount’ einfach durch das Login deines Accounts. Vor einem Import der Zeiteinträge wird GrandTotal dann einmalig zusätzlich deine in mite verwendete E-Mail-Adresse sowie dein Passwort abfragen. Merci, GrandTotal Die Anbindung an mite wurde in Eigeninitiative von Stefan Fürst, dem Entwickler von GrandTotal, realisiert. Unser Merci für dein Engagement, Stefan, wie auch für das anstoßende Feedback unserer Nutzer! Julia in Neue Features, Add-ons Selbst kommentieren?"
