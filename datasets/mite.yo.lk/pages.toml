["https://mite.yo.lk/blog"]
title = "mite.blog. Neues aus guter Stube & Maschinenraum der Zeiterfassung."
description = "Neuigkeiten, Diskussionen, Tipps & Tricks rund um mite, die schlanke Zeiterfassung für Teams & Freiberufler, webbasierte Software & Agile Entwicklung."
full_description = "3. Februar Fehler am heutigen Mittag Zwischen 13:16 und 13:29 CET warf mite heute leider einen Haufen Fehler. Die Seite konnte man problemlos aufrufen und Daten lesen oder auch exportieren. Das Erstellen, Bearbeiten und Löschen von Zeiteinträgen, Kunden, Projekten, Leistungen und Benutzerkonten war jedoch während dieser 13 Minuten leider nicht möglich. Unsere Entschuldigung für diesen Hickhack! Ursache war leider ein unschöner Konfigurations-Fehler auf unserer Seite, der uns schlicht durchgerutscht war. Unsere Monitoring-Systeme schlugen sofort an, auch meldeten sich zahlreiche Kunden per Mail. Wir wussten daher sofort Bescheid und konnten den Fehler auch schnell beheben. Aber es ärgert uns, dass uns das passiert ist. Pardon noch einmal. Julia in Maschinenraum 14. Januar Störung am gestrigen Abend Am gestrigen Abend, dem 13. Januar, war mite leider ab 20:05 CET nicht erreichbar. Die meisten Nutzer:innen konnten ab 20:18 CET, also 13 Minuten später, wieder auf mite zugreifen. Ab 20:59 CET, also nach insgesamt 54 Minuten, war mite wieder vollständig wie gewohnt erreichbar. Unsere Entschuldigung für diesen Ausfall! Ursache waren Störungen in unserem Hauptrechenzentrum bei SysEleven in Berlin. Zwei unserer Server fielen aus und mussten aus einem Backup wiederhergestellt werden. Für solch Fälle laufen bei mite stets redundante Server mit. Auf diese konnten wir den Hauptteil des Traffics umleiten und den Aussetzer so auf eine knappe Viertelstunde begrenzen. Erst mit Wiederherstellung aller Server lief mite dann jedoch wieder für alle stabil. Unser Pardon noch einmal. Wie gleichzeitig unseren Dank für die schnelle Unterstützung im Rechenzentrum. Julia in Maschinenraum 25. September 2024 mite.nano für macOS: Version 1.1.0 mite.nano, unser Helferlein für den Mac, steht ab sofort in aktualisierter Version parat. Das kleine Add-on sollte dich selbstständig um einen Neustart bitten, du musst nichts aktiv herunterladen. Was ist neu? Für die neue Version 1.1.0 haben wir im Aufklapp-Menü den Bereich »Projekte« ausgebaut, über den man einen neuen Zeiteintrag erstellen kann. Merci für eure Anregungen dazu auf allen Kanälen. Projekte werden nun standardmäßig gruppiert nach Kunde angezeigt. Die neue Ansicht schafft hoffentlich mehr Übersichtlichkeit, vor allem bei gleichbenannten Projekten. Alternativ kann man nun in den Einstellungen wählen, dass mite.nano in diesem Bereich nur Kunden anzeigen soll. Man wählt dann also zuerst den Kunden und dann dessen Projekt aus, das Menü erhält eine zusätzliche Ebene. Probiert die neue Einstellungen am besten einmal selbst aus und entscheidet dann, welche Ansicht für euch besser passt. Wir vermuten, dass die neue Kunden-Ansicht vor allem für Accounts mit sehr vielen Projekten schneller und übersichtlicher ist. Nach dem Projekt wählt man die Leistung des Zeiteintrags. Leistungen werden nun – wie in der Browserversion – gruppiert nach Verrechenbarkeit angezeigt. Auch diese Änderung soll die Übersichtlichkeit verbessern, vor allem dann, wenn man eine Leistung sowohl als verrechenbare als auch als nicht-verrechenbare eingerichtet hat. Bei langen Kunden-, Projekt- und Leistungsnamen werden nun noch mehr Zeichen angezeigt. Das Menü passt sich in der Breite weiter an. Zudem beinhaltet die neue Version von mite.nano Sicherheits- und Stabilitätsupdates. Noch ohne mite.nano? mite.nano ist eine ergänzende App für macOS, die sich in die Menüleiste einnistet. Stets sichtbar wird dir dort die aktuell tickende Stoppuhr angezeigt. So hast du deine Stunden immer genau im Blick und die Stoppuhr kann fast nicht mehr vergessen werden. mite.nano ist eine Eigenentwicklung und wie alles aus unserer Feder in den Nutzungsgebühren für mite inbegriffen. Bitte klicke hier entlang zum gratis Download von mite.nano. Julia in Neue Features, Add-ons"
year_published = 2024
