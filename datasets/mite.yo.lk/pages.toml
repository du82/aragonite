title = "mite.blog. Die Rechnung, bitte: WISO MeinBüro importiert mit mite erfasste Arbeitszeiten"
full_description = "15. März 2021 Die Rechnung, bitte: WISO MeinBüro importiert mit mite erfasste Arbeitszeiten Mit mite erfasste Arbeitszeiten kann man nun mit WISO MeinBüro abrechnen. Die Bürosoftware aus dem Hause Buhl kümmert sich um Rechnungen, Angebote, Belege, Banking – und ab sofort auch um Zeiteinträge aus mite. Mit wenigen Klicks kann man sie dort zu ordentlichen Rechnungen weiterverarbeiten. Funktionsumfang der Verknüpfung Innerhalb der mite.erweiterung für WISO MeinBüro wählt man zuerst aus, welche Zeiteinträge abgerechnet werden sollen. Hierzu steht eine flexible Suche parat, über die sich Zeiteinträge unter anderem nach Projekt, Benutzer oder Zeitraum finden lassen. Zudem kann nach bereits abgerechneten (abgeschlossenen) oder noch offenen Zeiten gefiltert werden. Die zur Abrechnung ausgewählten Zeiteinträge können im nächsten Schritt selbstverständlich durch weitere, von mite unabhängige Rechnungsposten für Materialen, Spesen etc. ergänzt werden. Nach der erfolgten Rechnungsstellung in WISO MeinBüro werden die abgerechneten Zeiteinträge in mite als abgeschlossen markiert. Verknüpfung einrichten Die Verknüpfung zwischen mite und WISO Mein Büro wird folgendermaßen eingerichtet: Aktiviere bitte zuallererst in mite den Zugriff über die mite.api für dein Benutzerkonto. Klicke dafür auf deinen Benutzernamen rechts oben. Die mite.api ist unsere offene Datenschnittstelle, über die externe Tools auf deine Daten aus mite zugreifen. Bitte rufe dann WISO MeinBüro auf, melde dich an und steuere dort den Menüpunkt »Erweiterungen« an. Wähle auf dieser Seite mite als neue Erweiterung aus. WISO MeinBüro wird dich daraufhin nach der Login-Adresse deines Accounts bei mite sowie um deinen API-Schlüssel bitten. Et voilà! Nach Sicherung der abgefragten Daten ist WISO MeinBüro schon mit deinem mite verknüpft. Du kannst deine Zeiteinträge nun jederzeit dort zu ordentlichen Rechnungen weiterverarbeiten. Merci Die Anbindung wurde von den Entwicklern von WISO MeinBüro – die übrigens auch schon invoiz angebunden haben – in Eigeninitiative entwickelt. Unser herzliches Dankeschön an Jens und Team für euer Engagement! Julia in Add-ons Selbst kommentieren?"
