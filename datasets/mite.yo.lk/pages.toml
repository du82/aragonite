full_description = "14. März 2024 Wartungsarbeiten am 19. und 20. März In unserem Hauptrechenzentrum bei SysEleven in Berlin stehen Wartungsarbeiten an. Diese werden in den Nächten von Montag auf Dienstag, den 19. März, sowie auf Mittwoch, den 20. März, jeweils zwischen 0 und 7 Uhr MEZ stattfinden. mite wird innerhalb dieser Zeitfenster für insgesamt bis zu 30 Minuten nicht zur Verfügung stehen. Wir bitten um euer Verständnis. ~~ Update: Die Wartungsarbeiten wurden wie geplant abgeschlossen. mite stand für 19 Minuten nicht zur Verfügung. Julia in Maschinenraum Selbst kommentieren?"
