["https://mite.yo.lk/en/blog"]
title = "mite.blog. News time."
description = "News, tech talk & discussions around mite, the sleek time tracking tool for teams and freelancers, webapplications & agile development."
full_description = "February 2 Today's server hiccup Today, between 13:16 and 13:29 CET, mite threw loads of errors. The application could be accessed successfully. Time entries and other data could be read and exported smoothly. But, it was not possible during these 13 minutes to create, edit, or delete time entries, customers, projects, services, or users. Our apologies for this service interruption! The reason for this hiccup was a configuration error on our side that slipped through. Our monitoring systems warned us immediately, and many users alerted us. Thus we immediately knew that something was wrong, and could fix the bug quickly. But, we are quite unsatisfied with us. Again: We are sorry. Julia in Tech talk January 14 Yesterday's service interruption mite has been unavailable yesterday evening, January 13th, starting at 20:05 CET. Most users could access our service again 13 minutes later at 20:18 CET. After 54 minutes, at 20:59 CET, all requests could be served successfully again. Our apologies for this service interruption! The reason for the downtime was a malfunction in our main data center, run by SysEleven in Berlin, Germany. A hardware node failed. Two of our servers had to be restored from a backup. mite is prepared for such problems. Redundant servers are always running in parallel. We redirected traffic to these, and could therefore limit the downtime to a quarter hour for most users. All requests could be handled once the servers had been restored. Once again: Our apologies for the interruption. At the same time, we'd like to thank the team in the data center for their fast support. Julia in Tech talk September 25, 2024 mite.nano for macOS: version 1.1.0 mite.nano, our little app for the macOS menu bar, is now available in an updated version. The add-on should automatically prompt you for a restart, so you don’t need to download anything manually. What’s new? In version 1.1.0, we have expanded the »Projects« section in the drop-down menu, from where you can create a new time entry. Thanks for all your suggestions and feedback across different channels. Projects are now displayed grouped by customer, by default. This new view should hopefully provide more clarity, especially if you have several projects for different customers with the same name. Alternatively, you can now choose in the settings to have mite.nano display only customers in this section. In this case, you’ll first select the customer and then their project, adding an extra layer to the menu. We suggest to try out the new settings yourself and decide which view works better for you. We assume that the new customer view will be faster and easier to grasp for accounts with many projects. After selecting a project, you choose the service for the time entry. Services are now displayed grouped by billability, as they already are in the browser version. This change is also meant to improve clarity, particularly when a service is set up both as billable and non-billable. For customers, projects, and services with long names, more characters are now displayed. The menu adjusts further in width. Additionally, the new version of mite.nano includes security and stability updates. Without mite.nano yet? mite.nano is a complementary app for macOS that sits in the menu bar. The currently ticking timer is always visible there, so you can keep an eye on your hours without switching context, and the timer is thus almost impossible to forget. mite.nano is developed by us, and thus, like everything from our team, included in the user fees for mite. Please click here to download mite.nano for free. Julia in New features, Add ons"
