["https://mite.yo.lk/blog/2021/10/13/mite-nano-app-macos"]
title = "mite.blog. mite.nano, unser neues Helferlein für macOS – Vorhang auf!"
full_description = "13. Oktober 2021 mite.nano, unser neues Helferlein für macOS – Vorhang auf! Auf einem Mac unterwegs? Und Typ “Es-Ganz-Genau-Wissen-Woller”, der den Tag über gern die Stoppuhr mitlaufen lässt? Dann haben wir ab heute ein kleines Zusatztool für dich, das dir die Arbeit mit mite hoffentlich deutlich erleichtern wird: mite.nano. Was kann mite.nano? mite.nano ist eine zusätzliche App für macOS, die sich in die Systemleiste deines Macs einnistet. Stets sichtbar wird dir dort die aktuell tickende Stoppuhr angezeigt. So hast du deine Stunden immer genau im Blick, und die Stoppuhr kann fast nicht mehr vergessen werden. Per kleinem Aufklappmenü kannst du zudem direkt von mite.nano aus – an was auch immer du sonst gerade auf deinem Mac arbeitest – neue Zeiteinträge mit laufender Stoppuhr erstellen. Hierfür kannst du entweder aus einer Kurzliste der zuletzt verwendeten Projekt/Leistung-Kombis wählen, oder aber dir den neuen Zeiteintrag aus einer Liste der aktiven Projekten und Leistungen selbst zusammenklicken. mite.nano spielt natürlich geschmeidig mit mite im Browser oder auf dem Smartphone zusammen. Alle Daten liegen zentral auf unseren Servern, mite wo-auch-immer ist also stets auf dem aktuellen Stand. Download mite.nano ist eine Eigenentwicklung (und somit unsere erste eigene native App, juhu!). Und daher wie alles aus unserer Feder in den regulären Nutzungsgebühren von mite komplett inbegriffen. Bitte hier entlang zum gratis Download von mite.nano. mite.nano steht in deutscher und englischer Sprache ab macOS 10.11 (El Capitan) zur Verfügung. [161 MB]. mite.nano haben wir natürlich gründlich getestet, und dennoch könnten sich Hakeleien eingeschlichen haben. Bitte meldet euch in diesem Fall gern mit möglichst genauer Beschreibung per E-Mail oder Kommentar hier, das wäre uns eine große Unterstützung! Auch Feedback und Verbesserungsvorschläge sind natürlich sehr willkommen. Merci Unser Dank geht an Stefan Fürst vom Schweizer MediaAtelier. Sein DynaMite Add-on für mite – 2009 veröffentlicht, 2019 eingestellt – ist offensichtlicherweise eine “Inspiration” für mite.nano gewesen. DynaMite wurde von zahlreichen Nutzer:innen so stark vermisst, dass wir mit seiner Erlaubnis diese Idee neu umgesetzt haben. Merci vielmal Stefan, für Damals wie Heute! Julia in Neue Features, Add-ons Selbst kommentieren?"
