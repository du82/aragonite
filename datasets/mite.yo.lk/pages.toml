["https://mite.yo.lk/blog/2011/03/29/rechnungen-online-easybill-importiert-mit-mite-erfasste-arbeitszeiten"]
title = "mite.blog. Die Rechnung, bitte: easybill importiert mit mite erfasste Arbeitszeiten"
full_description = "29. März 2011 Die Rechnung, bitte: easybill importiert mit mite erfasste Arbeitszeiten easybill, das Online-Tool zur Erstellung und Verwaltung von Rechnungen, importiert ab sofort mit mite erfasste Arbeitszeiten. Mit wenigen Klicks lassen sich eure Zeiten dort zu ordentlichen Rechnungen weiterverarbeiten. Aus insgesamt fünf deutschsprachige Rechnungs-Services könnt ihr nun die für euch perfekt passende Ergänzung zu mite auswählen: sucht ihr nach einer webbasierten Variante, stehen neben easybill auch Billomat und SalesKing zur Auswahl parat. Möchtet ihr einen Dienst auf dem eigenen Server installieren, werdet ihr bei g*Sales fündig und soll es eine Anwendung für den Mac-Desktop sein, heißt euch GrandTotal willkommen. Funktionsumfang der Verknüpfung In easybill lassen sich mit mite erfasste Arbeitszeiten sehr flexibel übernehmen: sämtliche aus unserem Listenreport bekannten Filter- und Gruppierungsoptionen stehen auch dort parat. Ob man nur einzelne oder alle Zeiten eines spezifischen Projekts abrechnen möchte, ob nach Leistung oder nach Monat gruppiert – all dies und mehr ermöglicht euch die Importoption. Zeitliche Posten aus mite können in easybill-Rechnungen selbstverständlich durch weitere Dienstleistungs- oder Warenposten ergänzt werden. Nun noch die üblichen Rechnungsangaben wie den Empfänger ergänzen – fertig. Verknüpfung einrichtenDie Verknüpfung von easybill mit mite wurde über unsere offene Datenschnittstelle, die mite.api, realisiert. Damit die zwei Tools miteinander sprechen können, muss daher zuallererst der Zugriff über die mite.api für deinen Benutzer aktiviert werden. Rufe hierfür bitte dein mite auf: Klicke auf deinen eigenen Benutzernamen rechts oben. Aktiviere dort die entsprechende Checkbox im Abschnitt »mite.api«. Klicke auf »API-Schlüssel anzeigen« und kopiere die daraufhin angezeigte Kombination aus Zahlen und Buchstaben. Übernehme die Änderung per Klick auf den orangefarbenen »Sichern«-Button ganz unten auf der Seite. Wechsle nun zu easybill: Steuere dort den Menüpunkt »Meine Firma => Mitarbeiter« an. Klicke auf deinen Benutzernamen und dann auf »Bearbeiten«. Rufe bitte in der Seitenleiste des daraufhin angezeigten Fensters den Abschnitt »mite-Zeiterfassung« auf. Gib dort deine persönliche mite.domain und deinen API-Schlüssel an und klicke auf »Speichern«. Geschafft! easybill kann ab sofort mit deinem mite kommunizieren und Zeiten jederzeit importieren. Merci, easybill Die Anbindungen an mite wurde von dem Team hinter easybill in Eigeninitiative entwickelt. Unser herzliches Dankeschön an Philipp Gesell und Ronny Keyser für ihr Engagement! Julia in Neue Features, Add-ons Selbst kommentieren?"
