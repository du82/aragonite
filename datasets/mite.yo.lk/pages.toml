full_description = "3. Februar Fehler am heutigen Mittag Zwischen 13:16 und 13:29 CET warf mite heute leider einen Haufen Fehler. Die Seite konnte man problemlos aufrufen und Daten lesen oder auch exportieren. Das Erstellen, Bearbeiten und Löschen von Zeiteinträgen, Kunden, Projekten, Leistungen und Benutzerkonten war jedoch während dieser 13 Minuten leider nicht möglich. Unsere Entschuldigung für diesen Hickhack! Ursache war leider ein unschöner Konfigurations-Fehler auf unserer Seite, der uns schlicht durchgerutscht war. Unsere Monitoring-Systeme schlugen sofort an, auch meldeten sich zahlreiche Kunden per Mail. Wir wussten daher sofort Bescheid und konnten den Fehler auch schnell beheben. Aber es ärgert uns, dass uns das passiert ist. Pardon noch einmal. Julia in Maschinenraum 14. Januar Störung am gestrigen Abend Am gestrigen Abend, dem 13. Januar, war mite leider ab 20:05 CET nicht erreichbar. Die meisten Nutzer:innen konnten ab 20:18 CET, also 13 Minuten später, wieder auf mite zugreifen. Ab 20:59 CET, also nach insgesamt 54 Minuten, war mite wieder vollständig wie gewohnt erreichbar. Unsere Entschuldigung für diesen Ausfall! Ursache waren Störungen in unserem Hauptrechenzentrum bei SysEleven in Berlin. Zwei unserer Server fielen aus und mussten aus einem Backup wiederhergestellt werden. Für solch Fälle laufen bei mite stets redundante Server mit. Auf diese konnten wir den Hauptteil des Traffics umleiten und den Aussetzer so auf eine knappe Viertelstunde begrenzen. Erst mit Wiederherstellung aller Server lief mite dann jedoch wieder für alle stabil. Unser Pardon noch einmal. Wie gleichzeitig unseren Dank für die schnelle Unterstützung im Rechenzentrum. Julia in Maschinenraum 14. März 2024 Wartungsarbeiten am 19. und 20. März In unserem Hauptrechenzentrum bei SysEleven in Berlin stehen Wartungsarbeiten an. Diese werden in den Nächten von Montag auf Dienstag, den 19. März, sowie auf Mittwoch, den 20. März, jeweils zwischen 0 und 7 Uhr MEZ stattfinden. mite wird innerhalb dieser Zeitfenster für insgesamt bis zu 30 Minuten nicht zur Verfügung stehen. Wir bitten um euer Verständnis. ~~ Update: Die Wartungsarbeiten wurden wie geplant abgeschlossen. mite stand für 19 Minuten nicht zur Verfügung. Julia in Maschinenraum"
