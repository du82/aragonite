["https://mite.yo.lk/blog/page/2"]
title = "mite.blog. Neues aus guter Stube & Maschinenraum der Zeiterfassung. - page 2"
description = "Neuigkeiten, Diskussionen, Tipps & Tricks rund um mite, die schlanke Zeiterfassung für Teams & Freiberufler, webbasierte Software & Agile Entwicklung."
full_description = "13. April 2023 Heutige Nicht-Erreichbarkeit Zwischen 14:47 und 15:28 CEST war mite heute leider für viele nicht erreichbar. Die Störung begann mit Serverfehlern bei etwa 5% aller Aufrufe, zum Hochpunkt konnten etwa 40% nicht erfolgreich abgearbeitet werden. Keine Daten sind beschädigt worden. Trotzdem hat die Nicht-Erreichbarkeit leider eine Auswirkung: Wir mussten alle Nutzer:innen ausloggen, alle müssen sich nun einmalig erneut einloggen. Die Ursache der Fehler lag bei uns. Wo genau, welche Prozesse sich hier wie gegenseitig lahm legten, untersuchen wir aktuell. Unsere Entschuldigung für diese Störung! Ganz besonders tagsüber ist dies natürlich ärgerlich. Die letzte Nicht-Erreichbarkeit in diesem Ausmaß liegt zwar bereits mehrere Jahre zurück. Trotzdem ist uns dies ein Dorn im Auge. Unser Pardon noch einmal. Julia in Maschinenraum 3. März 2023 mite fürs iPhone: Version 1.2.0 Für unsere offizielle iPhone-App steht im App Store ein Update parat. Die neue Version 1.2.0 beinhaltet zwei Erweiterungen und einige kleine Feinschliffe: Ein neues Projekt oder eine Leistung fehlen noch? Auch in der App gibt es nun eine Option zur Schnellanlage. Sie findet sich innerhalb der Erstellung eines neuen Zeiteintrags. Bitte tippe dort bei der Auswahl von Projekt oder Leistung auf den Plus-Button rechts neben dem Suchfeld. Vergiss vergessene Stoppuhren: Läuft auf einem anderen Tag als dem aktuell ausgewählten noch die Stoppuhr, weist dich mite darauf hin. Je nachdem, ob die Uhr auf einem in der Vergangenheit oder in der Zukunft liegenden Tag tickt, wird im Kopfbereich der App links oder rechts ein orangener Punkt als Indikator eingeblendet. Auch die App ist nun im neuen Zuhause auf mite.de eingezogen. Und hier und dort haben wir etwas poliert. Unser Merci für euer Feedback auf allen Kanälen. Neue Projekte und Leistungen auch in der App erstellen zu können, war euer Wunsch Numero 1. Wir hoffen, dass euch diese Erweiterung weiterhelfen wird. Julia in Neue Features, Add-ons"
