["https://mite.yo.lk/blog/2024/06/19/e-rechnung"]
title = "mite.blog. Die E-Rechnung kommt"
full_description = "19. Juni 2024 Die E-Rechnung kommt Wenn euch das nächste Mal eine Rechnung von uns über die Nutzungsgebühren für mite zugeht, werdet ihr optisch keinen Unterschied feststellen. Weiterhin stellen wir sie euch als PDF per Mail zu. Das PDF ist ab sofort jedoch schlauer: Zusätzlich zum Sichtpart ist eine kleine XML-Datei eingebettet, die die Rechnungsdaten in maschinenlesbarer Form enthält. ZUGFeRD / Factur-X nennt sich dieses Format. Es ermöglicht das Beste zweier Welten: Menschen können PDF-Rechnungen weiterhin wie gewohnt mit allen gängigen PDF-Readern ansehen und prüfen. Zusätzlich liegen die Daten aber eben auch in strukturiertem, standardisierten Format vor. Buchhaltungs-Software wie DATEV und diverse Rechnungs-Tools können solch Rechnungen dann automatisiert verarbeiten. E-Rechnungen – ein Sammelbegriff für elektronische Rechnungen nach Standards wie ZUGFeRD, Factur-X oder XRechnung – werden in Deutschland für B2B ab 2025 stufenweise Pflicht. Hintergrund ist die EU-Richtlinie 2014/55. Weitere Infos zum Thema E-Rechnungspflicht in Deutschland und ein zeitlicher Fahrplan finden sich beispielsweise bei der IHK. Maschinen voraus! Julia in In eigener Sache Selbst kommentieren?"
