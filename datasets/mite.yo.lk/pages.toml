["https://mite.yo.lk/blog/2009/04/02/rechnungen-online-salesking-importiert-mit-mite-erfasste-arbeitszeiten"]
title = "mite.blog. Rechnungen online: Auch SalesKing importiert mit mite erfasste Arbeitszeiten."
full_description = "2. April 2009 Rechnungen online: Auch SalesKing importiert mit mite erfasste Arbeitszeiten. Mehr Optionen für mite.nutzer: Auch im webbasierten SalesKing können nun erfasste Zeiteinträge zu ordentlichen Rechnungen weiterverarbeitet werden. Nach den just veröffentlichten Anbindungen an Billomat und GrandTotal ist SalesKing nun der dritte deutschsprachige Rechnungs-Service, der den Import von mit mite erfassten Zeiten ermöglicht. Über SalesKing Mit SalesKing, in deutscher und englischer Sprache verfügbar, können Rechnungen und Angebote online erstellt, verwaltet und via Mail verschickt werden. Ein Schwerpunkt des Dienstes liegt neben statistischem Futter auf der grafischen Anpassbarkeit der Dokumente ans eigene Corporate Design: neben verfügbaren Templates können auch eigene PDF-Vorlagen verwendet werden. Das 2008 gestartete SalesKing befindet sich aktuell noch in der Open-Beta-Phase. Ein Einladungscode kann auf der Site fix angefordert werden. Bis zum offiziellen Launch im Sommer wird SalesKing kostenfrei nutzbar bleiben. Dann soll – neben einem zweistufigen Preismodell – auch eine White-Label und Stand-Alone-Version für größere Firmenkunden folgen. Rechnungserstellung Mit mite erfasste Arbeitszeiten lassen sich einfach importieren: Nach der Auswahl eines Projekts aus mite lassen sich verbundene Zeiteinträge, optional gruppiert nach Leistung oder Zeitraum, in Rechnungspositionen umwandeln. Zeit-Positionen können durch weitere Freiform- oder Artikel-Positionen ergänzt werden. Die üblichen Rechnungsvariablen wie Steuersatz, Skonto etc. ergänzen – fertig. Verknüpfung einrichten Die Integration von mite in Salesking wurde über unsere offene Datenschnittstelle realisiert. Um die Zusammenarbeit der beiden Tools zu ermöglichen, muss zuallererst der Zugriff auf die mite.api auf Benutzerebene aktiviert werden. Die Option findet sich per Klick auf den eigenen Benutzernamen, rechts oben in mite. Dort einfach die entsprechende Checkbox aktivieren und den dann angezeigten API-Schlüssel kopieren. Zusätzlich zum mite.login wird dann in SalesKing unter dem Menüpunkt »Einstellungen => Firmeneinstellungen« dieser API-Schlüssel eingetragen; Er dient der sicheren Authentifizierung des Zugriffs. Screencast Einen kleinen Video-Screencast hat SalesKing ebenfalls gedreht, der kurz erklärt, wie die beiden Tools zusammenarbeiten: SalesKing feat. mite! von SalesKing auf Vimeo. Danke, SalesKing Die Anbindung an mite wurde in Eigeninitiative vom Team hinter SalesKing und Jan und Lars von Railslove entwickelt. Unser Merci für ihr Engagement! Julia in Neue Features, Add-ons Selbst kommentieren?"
