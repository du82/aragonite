["https://mite.yo.lk/blog/2023/07/14/uebersichts-reports-flexiblere-budgets"]
title = "mite.blog. Übersichts-Reports: Flexiblere Budgetansicht"
full_description = "14. Juli 2023 Übersichts-Reports: Flexiblere Budgetansicht Jedes Projekte kann in mite mit einem Budget hinterlegt werden – zeitlich oder monetär, für das Projekt insgesamt oder als monatlich wiederkehrendes Soll. So kann einfach im Blick behalten werden, ob das Projekt auf Kurs ist. Auf den Übersichts-Reports, direkt unter dem Menüpunkt »Reports«, blendete mite bisher aktive Projekte ein, deren Budgetauslastung 75% oder mehr beträgt. mite wollte so gezielt den Blick auf Projekte lenken, bei denen es eng wird. Ab sofort könnt ihr selbst entscheiden, welche Projekte auf den Übersichts-Reports angezeigt werden sollen. Zur Auswahl stehen aktive Projekte mit einer Budgetauslastung ab 100%, ab 75%, ab 50% oder alle. Die Ansicht kann per Klick auf das dreieckige Icon direkt rechts neben der Abschnittsüberschrift »Budgets« angepasst werden. Bitte beachtet, dass mite in dieser Ansicht nur Projekte anzeigt, auf die das infrage stehende Teammitglied auch mindestens einen Zeiteintrag erfasst hat. Maximal werden an dieser Stelle 20 Projekte eingeblendet. Existieren mehr, blendet mite Teammitgliedern mit entsprechenden Rechten einen Schnell-Link ein, über den man zum Menüpunkt »Reports => Projekte« gelangt; Dort lassen sich dann auch Hunderte Projekte analysieren. Hoffentlich hilft euch diese kleine Erweiterung, eure Projekte besser im Blick zu behalten. Unser Merci an alle Nutzer:innen, die sich mit diesem Vorschlag bei uns gemeldet haben. Julia in Neue Features Selbst kommentieren?"
