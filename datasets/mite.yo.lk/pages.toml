full_description = "Nicht jede Nachricht ist auf einer Postkarte gut aufgehoben. Wenn du uns sensible Daten zukommen lassen möchtest oder gar eine Sicherheitslücke in mite entdeckt hast, kannst du Mails mit PGP verschlüsseln. Um mit uns signierte oder verschlüsselte E-Mails auszutauschen, kannst du gerne unseren öffentlichen PGP-Schlüssel für nutzen. Bitte beachte, dass wir auf verschlüsselte E-Mails vielleicht etwas langsamer als gewohnt antworten können. Aus Sicherheitsgründen haben wir unterwegs keinen Zugriff auf den privaten Schlüssel. Unser Schlüssel Valid from 2023-01-31 Expires 2027-01-31 Key ID 46DC3CCE Key Type RSA Key Size 4096/4096 Fingerprint 77FB 00EE C47A 0EAF 1AAC 6377 FAC0 FC7D 46DC 3CCE User ID -----BEGIN PGP PUBLIC KEY BLOCK----- mQINBGPY6wEBEACwdoXMgHsvcsuHfJa0EUaoW3H8h6qLv1vdh4tQlS9SaI3BgLVp YuACNM1oD4m/sp7Q+ehySK1jKnxElwPdz/mM9UrmR/q3wHNKzVmojCTHftvZ4rXd 8bbTLUvUjqqXPCJKtUrmfxK/fRtwY0gTu0ovR9ZzJm9qCsEOdN0L1Eh8c2ptvJJE xE1fThRVi0faOZ9B8Uv3YlvK8mOy0JgYLPo/6qYvbrfWOxRK1oI7l0fBzBK2lLqa p6/KGFGonKT8bNj1NJZH3pTizyk8wcP8lMCL9jBgt2zhhc+RCmDsIkczZvlBzvNf MWN95WOg8SMhNRfpoxnhw/kZszYrhvGYhui+oowJ0aZA0My6UMLJTP88F+vRUcK/ +10qJEP4ZrmxAWxcycfqaet4DLT0GJIdo9hn0B2JexluxBc1GSEpowGtAbo/gXPw o11Do0mQO0x19TiWwuvSPtz4L5YJRgmXGzIYYYSFS6SqrzMN9Unw+YxtWVJL8Pad 2Y6LZ1gg2D2CI/k4snA937EJtwYLfIdh0AwkdipviLO/CHW1LZKQCJ+7lCMa+N5B 6/SmA5RywoRdvY1L33tpkpEnap4kDpT8NaWDNDOhKT0b5qB+yX+QdHBqS4QChnnh jLwhArGaQde8aRbTeewUZIdBRLzo0RcJE9pATumB8qaQwq/+r6ibDcBp2QARAQAB tBdtaXRlIEdtYkggPGhleUBtaXRlLmRlPokCVAQTAQoAPhYhBHf7AO7Eeg6vGqxj d/rA/H1G3DzOBQJj2OsBAhsDBQkHhh7fBQsJCAcDBRUKCQgLBRYCAwEAAh4BAheA AAoJEPrA/H1G3DzOJA0P/03+Qxrtn+q7x7GmlMGbmqtF/6QZpoFvhcXpREaPz+Hn jFk5Bgm4WknCtZ5jqQuM3Gk0l2iygSUjjs9RYtG0iVHxTiANvCgKffk+4zV+b1HS oOUuTb0ddLOiiDxI9LYGtXexzdQUscYgi3A3kB1h3HiJLSwezHGYc3Pb8J42c11m upfcDpWL/O5YLNCFCjDrVy5kQLMOl8ziKV2rquZ7ngoxjq1jwqlleb8JQt/zVkjx v8ukHwYXN0fFkwMst4TbtDiBcPRkcpPJy9RL/23NWakG70QQ0fAHQTUQoJ2aWB/V bT7Ab9jcf5C5BMUle1csl0/lyzFEVsOSn2Y/91pUhPfMYzyVpMqPIw9Ok+0h6PKt agM1XQ