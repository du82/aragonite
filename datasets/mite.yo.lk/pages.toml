["https://mite.yo.lk/en/faq.html"]
title = "mite. Questions and answers."
description = "Need help? Looking for something specific? There’s a pretty good chance you’ll find your question answered here. Still feeling lost? We’re just one click away."
full_description = "Need help? Looking for something specific? There’s a pretty good chance you’ll find your question answered here. Still feeling lost? We’re just one click away. Security & privacy Is it possible to access mite over an encrypted connection? Why, certainly! HTTPS is always active. All data sent back and forth between you and our servers is encrypted by default, just like in online banking. Is my data really secure? What about backups? No worries: we do save additional copies of all data for safety reasons every single day. Not only once but twice. Furthermore, you can download a complete copy of your data anytime: just go to “Options =>Backup”. Your data is available as an XML file. Where is my data stored? The main servers of mite are located in the data center of our hoster SysEleven in Berlin, Germany. My data is confidential. How is it managed in detail? Your data are your data. Period. Your data will not be analyzed for commercial or other reasons. We will not sell your data. We won’t hand it over to third parties except when we need to, e.g. to process payments or if we are forced by law in case of a serious crime. Please have a look at our privacy policy if you want to dive into further details. Technical questions Which desktop browsers are supported? mite works fine on all major browsers on Windows, Mac OS and Linux if you run a version that’s up to date: Last two major versions of Mozilla Firefox, last two major versions of Google Chrome, last two major versions of Safari, last two major versions of Microsoft Edge. mite should run on older versions of Firefox, Chrome, and Safari, and on more exotic browsers, too. But we do not test thoroughly on these systems, bugs can and will occur. Can I use mite on my smartphone or tablet? Yes of course you can. mite will be at your service on your smartphone or tablet, too. Simply point the browser of your smartphone or tablet to the regular login address of your account, e.g. https://yourteam.mite.de. mite will recognize your device, and optimize the interface for smaller displays. If that doesn't work on your rather special device, you can also switch manually to the mobile version by clicking the respective link in the footer. Furthermore, there is a native iOS app for mite. Add, stop, edit, or delete your hours on the go, fast. The app is included in the regular user fees for mite. Please head over to the iPhone App Store to download mite for iPhone for free. Smartphone, iPhone, iOS, Android, iPad, tablet Can I use keyboard shortcuts in mite? Yes, all basic features can be triggered by keyboard shortcuts, too. Please press ? in mite to have a detailed look at all supported shortcuts. Can I install mite on my own server? No, this is not possible at the moment and won’t be in the future, as far as we can tell. mite is only available as a web application hosted carefully on our servers. We do believe in centralized infrastructure – from a user’s perspective as well as from a developer’s. Do you have an API? Yes, there is an API available. Please have a look at the detailed documentation for more information. Can I use mite without an internet connection? No, this isn’t possible at the moment. Sorry. mite requires an active internet connection. Trial & Contract How does the 30-day free trial work? The 30-day trial period gives you the opportunity to check out mite in detail. Free, fully featured, no credit card required. If you don’t want to continue using mite after the first 30 days, just let the trial expire or cancel your account. Shortly after the trial expired, we'll delete all of your data. If you want to continue tracking your time with mite after the 30-day trial period, please fill in your payment data. You can do so by navigating to “Account => Payment”. No further actions are required. Data entered within the trial period will stay available of course. After this confirmation, we will charge your credit card once a month. mite is €5.00 per user per month (including VAT if required). You can cancel anytime. Is there a minimum contract term? Or a cancelation period? No, mite is a pay-as-you-go service. You can cancel your account anytime without a catch, effective immediately. How do I cancel my account? Please head over to the tab “Account => Cancel” to cancel your account. Only the owner of the account can cancel it. Make sure to backup all your data before cancelation! You can export your data as an XML file. Time entries can be exported to a XLS or CSV file. After you have canceled your account, we will have to delete all of your time tracking data from our servers. Payment How much does mite cost? mite is €5.00 per user per month (including VAT if required). Accounts with two users cost €10, accounts with three users €15, accounts with four users €20, and so forth. Simple! The company that brings you mite is registered in Germany. Depending on your offical location, stated in your billing address, and whether you use mite as a business or as an individual, we'll have to charge VAT. €5 per user per month is the maximum price including VAT. We might be able to charge less. Located in Germany? mite is €5 per user per month including VAT, for businesses and individuals alike. Located in another country of the European Union? If you use mite as a business, we won't have to charge VAT. mite is €5 per user per month minus your national VAT. E.g., Austrian VAT is 20%. Thus, for businesses from Austria, mite is €4.17. Please provide a valid EU VAT identification number. For individuals, mite is €5 including the particular national VAT. Located outside of the European Union? mite is €4.20 per user per month, for businesses and individuals alike. We won't have to charge VAT. Fees are only due for activated users. We won’t charge for users that stay archived during a whole billing cycle. We'll charge for the latest partial billing cycle, but after that, they are for free. Do you offer discounts for bigger teams? Yes, we do offer discounts for accounts with more than 15 users. Please contact for an individual offer. Which types of payment do you accept? All customers can pay by credit card (Visa or MasterCard). If you have a bank account of an EU country in the eurozone, you can pay by SEPA direct debit as well. At present, we are not able to accept American Express, checks or PayPal, sorry. Where can I find my invoice? Once we charged your credit card, your invoices will be available under the “Account => Payment” tab. Login I forgot my login address. Help! Please have a look at the very first e-mail we sent you after your account or user was created. There, you will find your personal login address. It should be something similar to https://companyname.mite.de. Can’t find that e-mail? No worries, just shoot us a line: . Please include anything you can remember: your user name, the e-mail address you signed up with or your account name. We’ll help you as fast as possible. I forgot my password. Help! Don’t worry: On the login screen, you’ll find the option to reset your password. Simply enter your e-mail address. A new password will be generated and sent to you via e-mail. Please check your spam folder if you didn’t get this e-mail after a couple of minutes. We won’t be able to tell you your old password though. It is stored encrypted in our database – not even the mite.team can acces your password because of safety reasons. How do I change my password? Click on your user name in the upper right-hand corner, please. You will find the option to change your password right there. Don’t forget to confirm your changes by clicking on the corresponding button (“Save”). Can I change my login address? Yes, as long as the address in question is not used by somebody else. Please go to the tab »Account« to change your login. You have to be the owner of the account or an administrator to change it. Team Is mite a multiuser software? Yes, you can work together with multiple team members on one account. How many users can be added to one account? There are no technical restrictions, just add as many users as you want and need to. At the moment, more than 50 users are working on the biggest mite account. I’m the account owner. What does that mean? Can I change that? The account owner is the most powerful user role: only this person can cancel the account. Furthermore, the account owner is the only user who is allowed to access and edit payment data. The account owner can transfer those rights to another user. You will find the option by clicking on the “Account” tab. Please consider that only one user at a time can be owner – once you have transfered those rights, your rights will be limited to those of an administrator. Can I limit the rights of a user? Say... let him track his time only? There are four different user roles: the account owner, the administrator, the co-worker, and the time tracker. The account owner is the most powerful user role: only this person can cancel the account. Furthermore, the owner is the only user who is allowed to access and edit payment data. The administrator holds extended rights to manage the account and the team. He is authorised to edit time entries added by other users. The co-worker is authorised to manage customers, projects and services. He sees reports of all projects including time entries of other users. The time tracker is only allowed to track time on projects he was granted access to by an administrator. He only sees his very own time entries. He'll never see revenues. Please find a detailed overview of all roles & rights here. Why am I not allowed to add new users? Only the account owner or an administrator is allowed to add new users. Adding new users increases the monthly price of your account, that’s why this action is only available to the person paying for the account. How do I archive a user? And what does archive mean? Only the account owner or an administrator is allowed to archive a user. To archive a user, please go to “Team => Active users” first. Then check the corresponding checkbox next to the user’s name. By archiving a user, you can save money. We won’t charge you for users that stay archived during a whole billing cycle. Archived users cannot log in or track time anymore. However, their data will still be accessible for further analysis. Is it possible to delete a user? Yes, this is possible. However, this action is restricted to the account owner or an administrator. Please note that users can only be deleted if there are no more time entries attached to them. In most cases, it’s easier to archive a user instead. By archiving a user, you will still be able to analyze old time entries. We won’t charge you for users that stay archived during a whole billing cycle. Archived users won’t be able to log in anymore or add new time entries. Is it possible to share a report with a customer? He should only be allowed to view the report, not to edit it. Yes, this is possible. You can share the report of a project with a third party. By accessing a private link, the third party will be able to view time entries of this specific project. However, they won’t be able to add, edit or delete time entries. Sharing reports is completely free of charge. Please go ahead and add more transparency to your projects! First, you will have to access the project report in question: go to the tab »Reports => Projects« and click on the link »Details« at the end of the project row in question. On the project report, click on the button in the right sidebar: »Share report«: Hand over the appearing link to your customer. Please don’t post this link to public websites: Everybody who knows the link will be able to access the report. To stop sharing the report and invalidate the link immediately, just click on »Unshare report«. Time tracking Do I have to use a certain syntax when entering my time? mite tries hard to be a very flexible tool. You can use three different syntaxes – just use the one that suits you. 1 hour and 30 minutes can be typed in as follows: 1:30 (hours:minutes), 1.5 (with a period) or 1,5 (with a comma). To create a new time entry with running timer, just leave the default 0:00 as it is and click on “Create”. You can enter a time frame featuring a starting and ending time as well. If you enter a time frame, mite will calculate the hours and save the starting time as well as the ending time as a note, so you’ll be able to keep that information for later reference. Enter 8 to 13:30 or 8am 1:30pm for a time frame from 8:00 to 13:30. Please have a look at the cheat sheet to see all available notations. Is it possible to run a stop watch or timer? Yes, this is possible. The stop watch icon is located on the right hand side of each time entry. To create a new time entry with running timer, just leave the default 0:00 as it is and click on “Create”. Since it’s a server-side timer, you can close your browser window or even shut down your computer: it’ll tick till you come back to stop it. Can I enter start and end times instead of hours and minutes? Yes, this is possible. You can enter a time frame featuring a starting and ending time as well. If you enter a time frame, mite will calculate the hours and save the starting time as well as the ending time as a note, so you’ll be able to keep that information for later reference. Enter 8 to 13:30 or 8am 1:30pm for a time frame from 8:00 to 13:30. Please have a look at the cheat sheet to see all available notations. time frame, time range, input, syntax I got the day wrong. Can I change the date of a time entry after I created it? Yes, no problem. Please hover your mouse over the time entry first. A small icon will appear on it's left-hand side, a grey arrow. Grab this icon, then drag & drop the time entry onto the correct date of the weekly or monthly calendar. Reporting What is a working day, a working week and a working month? A working day is every day with at least one time entry, no matter if it’s a national holiday, a vacation or a weekend. Accordingly, a working week is a week with at least one time entry, and a working month is a month with at least one time entry. How does mite calculate trends? Which time frames are compared? The orange, blue or grey arrows compare the chosen time frame with the corresponding earlier one. Thus, the last 4 weeks, the last 6 months and the last year are compared to the 4 weeks, 6 months or the year before. How does mite calculate the revenue per hour? The revenue of a given time frame is divided through the tracked hours within this time frame. All time entries, whether billable or not, are included. What is a critical budget? mite sees all budgets with 75% usage or higher as critical. I only want to see time entries of a certain project, customer or the like. Possible? Yes, you can filter reports in a very flexible way. Please go to “Reports => Time sheets => All times” and click on the button named “Filter/Group”. A box with a lot of options will s"
