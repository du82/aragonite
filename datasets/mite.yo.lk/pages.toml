full_description = "17. November 2023 Neues: Nun auch auf Mastodon Ab sofort findet ihr uns auch auf Mastodon: https://mastodon.social/@miteWir werden dort niederfrequent Neuigkeiten aus der guten Stube und dem Maschinenraum unserer kleinen App posten. Gleichzeitig sagen wir: Gute Nacht, Twitter. Über 15 Jahre waren wir dort als @mite unterwegs. Und schön war's. Aber auf X fühlen wir uns nicht mehr wohl. Es ist nicht auszuhalten und schon gar nicht mitzutragen, was Musk aus dieser Plattform macht. Wir hoffen, euch an einem zivilisierten Ort wiederzufinden – wenn ihr denn möchtet. Auch hier auf unserem hausgemachten Blog werden wir natürlich weiterhin informieren. Merci, auf ein Neues, und weiter mit Wichtigerem. Julia in In eigener Sache Selbst kommentieren?"
