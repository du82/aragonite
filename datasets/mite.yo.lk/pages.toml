["https://mite.yo.lk/blog/2010/01/18/trac2mite-zeiterfassung-in-trac"]
title = "mite.blog. Trac2mite, das mite.plugin zur Zeiterfassung im Projektmanagement-Tool Trac"
full_description = "18. Januar 2010 Trac2mite, das mite.plugin zur Zeiterfassung im Projektmanagement-Tool Trac Entwickler, aufgepasst: Neben den bereits angebundenen Ticketsystemen Mantis und Redmine spielt mite nun auch mit dem freien Trac zusammen. Auch dieses unter OpenSource-Lizenz veröffentlichte Plugin stammt von Thomas Klein. Mithilfe von Trac2mite können Zeiten direkt auf Tickets in Trac erfasst werden, die dann automatisiert zu mite gesendet werden. Neben der rudimentären Auswertung von Zeiten in Trac stehen auf diesem Wege weiterhin alle Zeiteinträge aller Teammitglieder zum zentralen, flexibleren Reporting parat: im mite.account. Über Trac Trac ist ein freies, webbasiertes Projektmanagement-Tool für Softwareentwicklungsteams. Neben diversen Ticketing-Funktionalitäten können Subversion-Repositories verwaltet werden. Ein Wiki rundet den Funktionsumfang ab. Trac ist in Python implementiert. Das Tool steht aktuell nur in englischer Sprache zur Verfügung, eine deutschsprachige Version soll jedoch bald folgen. Was kann das Plugin Trac2mite? Auf Tickets in Trac erfasste Zeiten sind dank Trac2mite automatisch ebenfalls in mite verfügbar. Bemerkungen von Zeiteinträgen können optional durch dynamische Informationen wie beispielsweise den Titel oder die ID des Trac-Tickets ergänzt übergeben werden. Global lässt sich zudem spezifizieren, welche Projekt und Leistungen aus mite in Trac zur Auswahl parat stehen sollen. Installation Die Verknüpfung wurde über unsere offene Datenschnittstelle, die mite.api realisiert. Um Trac mit mite zu verknüpfen, muss zuallererst der Zugriff auf die API in mite aktiviert werden. Die Option findet sich per Klick auf den eigenen Benutzernamen rechts oben. Aktiviere dort einfach die entsprechende Checkbox und kopiere den angezeigten API-Schlüssel. Voraussetzung für die Nutzung von Trac2mite ist zudem das TracHours-Plugin. Die Installation von Trac2mite selbst ist aktuell noch etwas tricky: Im Development Mode muss das Plugin installiert werden. In der Readme-Datei findet sich die ausführliche Anleitung – bitte folgt dieser, dann sollte die Sache nichtsdestotrotz einfach klappen. Download Das Zip-Archiv von Trac2mite findet sich in stets aktuellster Version auf GitHub. Das Plugin wurde von Thomas Klein in Eigenregie entwickelt und unter der freien MIT-Lizenz veröffentlicht. Noch ist das Plugin klar im Beta-Stadium – Feedback ist daher umso mehr willkommen! Gebt laut, wie ihr zurechtkommt, hier oder auf GitHub. Nur so kann das Plugin weiter verbessert werden. Merci! Julia in Neue Features, Add-ons Selbst kommentieren?"
