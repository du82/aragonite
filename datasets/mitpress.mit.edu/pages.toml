full_description = "Home photography art Lost Days, Endless Nights div#st-1 { display: flex; } .st-btn.st-remove-label { display: block !important; } .add-this__social-links.book-wrapper__social-links img { box-shadow: none !important; } Lost Days, Endless Nights Photography and Film from Los Angelesby Andrew Witt Hardcover $50.00 Hardcover ISBN: 9780262049078 Pub date: January 14, 2025 Publisher: The MIT Press 384 pp., 8 x 10 in, 139 color illus., 81 b&w illus. MIT Press BookstorePenguin Random HouseAmazonBarnes and NobleBookshop.orgIndieboundIndigoBooks a Million 384 pp., 8 x 10 in, 139 color illus., 81 b&w illus. Hardcover 9780262049078 Published: January 2025 Publisher: The MIT Press $50.00 MIT Press Bookstore Penguin Random House Amazon Barnes and Noble Bookshop.org Indiebound Indigo Books a Million Other Retailers: Amazon.co.uk Blackwells Bookshop.org Foyles Hive Waterstones MIT Press Bookstore Penguin Random House Amazon Barnes and Noble Bookshop.org Indiebound Indigo Books a Million Description Author(s) Praise A critical study and artist's book on the history of photography and film from Los Angeles.Lost Days, Endless Nights tells a history from below—an account of the lives of the forgotten and dispossessed of Los Angeles: the unemployed, the precariously employed, the evicted, the alienated, the unhoused, the anxious, the exhausted. Through an analysis of abandoned archival works, experimental films, and other projects, Andrew Witt offers an expansive account of the artists who have lived or worked in Los Angeles, delving into the region's history and geography, highlighting its racial, gender, and class conflicts. Presented as a series of nine case studies, Witt explores how artists as diverse as Agnès Varda, Dana Lixenberg, Allan Sekula, Catherine Opie, John Divola, Gregory Halpern, Paul Sepuya, and Guadalupe Rosales have reimagined and reshaped our understanding of contemporary Los Angeles.The book features portraits of those who struggle and attempt to get by in the city: dock workers, students, bus riders, petty criminals, office workers, immigrants, queer and trans activists. Set against the landscape of economic turmoil and environmental crises that shadowed the 1970s, Witt highlights the urgent need for a historical perspective of cultural retrieval and counternarrative. Extending into the present, Lost Days, Endless Nights advocates for an approach that actively embraces the works and projects that have been overlooked and evicted from the historical imaginary. Andrew Witt is an art historian and critic who writes on contemporary art. “An immersive look at an especially memorable case of artistic symbiosis.” ~Inside Hook “How does one document the depredations of late capitalism—homelessness, the collapse of a public sphere, environmental injustice—and where better to do this than in Los Angeles in the late twentieth and early twenty-first centuries? Here, Andrew Witt gives us a cross-section of contemporary photography as an oblique but powerful tool of resistance with the power “to figure the world otherwise.” ~Angela Miller, Professor, Washington University in St. Louis; coauthor of Body Language: The Queer Staged Photographs of George Platt Lynes and PaJaMa Related Books"
