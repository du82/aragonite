description = "In Nonlinear, Kevin Bethune shows us that we can reject trodden paths of digital or physical product creation by taking advantage of a nonlinear approach. To..."
full_description = '''Home Simplicity: Design, Technology, Business, Life design business & economics Nonlinear div#st-1 { display: flex; } .st-btn.st-remove-label { display: block !important; } .add-this__social-links.book-wrapper__social-links img { box-shadow: none !important; } Simplicity: Design, Technology, Business, Life Nonlinear Navigating Design with Curiosity and Convictionby Kevin G. BethuneForeword by John Maeda Hardcover $26.95 Hardcover ISBN: 9780262049436 Pub date: February 4, 2025 Publisher: The MIT Press 240 pp., 5 x 8 in, 12 b&w photos, 19 b&w illus. MIT Press BookstorePenguin Random HouseAmazonBarnes and NobleBookshop.orgIndieboundIndigoBooks a Million 240 pp., 5 x 8 in, 12 b&w photos, 19 b&w illus. Hardcover 9780262049436 Published: February 2025 Publisher: The MIT Press $26.95 MIT Press Bookstore Penguin Random House Amazon Barnes and Noble Bookshop.org Indiebound Indigo Books a Million Other Retailers: Amazon.co.uk Blackwells Bookshop.org Foyles Hive Waterstones MIT Press Bookstore Penguin Random House Amazon Barnes and Noble Bookshop.org Indiebound Indigo Books a Million Description Author(s) Praise Resources From the acclaimed designer and bestselling author of Reimagining Design, a nonlinear approach to navigating design's nuances in pursuit of meaningful innovation.In Nonlinear, Kevin Bethune shows us that we can reject trodden paths of digital or physical product creation by taking advantage of a nonlinear approach. To unlock meaningful innovation that breeds new and novel outcomes, he writes, teams need to embark on a journey into the proverbial forest of ambiguity, the result of a rapidly converging, dynamic, and exponentially changing landscape. The journey is less about getting it right or wrong, and more about using the information we have at our disposal to understand our choices and unlock new learning.Nonlinear begins by taking the reader through Bethune's professional zigs and zags. The author explains that while his interdisciplinary leaps were rare at the time he took them, these varied experiences unlocked perspectives about design and innovation that uniquely prepared him for our present moment and for the future. He then showcases the role of quantitative information to strategically frame and set boundary conditions for our creative exploration, and he highlights the role of qualitative insights to provide the substance necessary to begin crafting solutions that address unmet needs. The book also identifies accelerants (or flywheels) that will help readers as they reflect on their journey through the forest of ambiguity, with a specific emphasis on diversity, a key theme for Bethune, a Black man who has navigated new horizons. Readers will enjoy having the chance to customize the author's perspectives and make them their own at both an individual and a team level. Kevin Bethune is Founder and Chief Creative Officer of dreams • design + life, a think tank that delivers design and innovation services using an empathic, holistic approach. He is the author of Reimagining Design: Unlocking Strategic Innovation (MIT Press). His background spans engineering, business, and design in equal proportion, positioning him to help brands deliver meaningful innovations to enrich people's lives. “Kevin inspires us to embrace the unexpected journey of innovation. His vision empowers us not just to meet the current needs of our audiences, but to take them places they’ve yet to imagine.” ~Greg Hoffman, author of Emotion by Design “Kevin lays out a new, imperative mindset for designers. Often interwoven with personal stories, his lessons and advice are accessible and essential for today’s innovators.” ~Ivy Ross, Chief Design Officer, Consumer Devices at Google; coauthor of Your Brain on Art “Nonlinear readers will walk away with a mindset for even bolder innovation and a desire to design a better world. Kevin’s compelling journey will inspire creativity and strategic thinking in designers at every career stage.” ~Mauro Porcini, Chief Design Officer, PepsiCo; author of The Human Side of Innovation “Kevin’s Nonlinear is a masterclass in how curiosity fuels innovation. It provides a roadmap for leveraging design to solve today’s most pressing challenges, pushing us to think beyond the obvious and embrace the unknown.” ~Iddris Sandu, Founder of Spatial Labs Inc. “Kevin’s Nonlinear is the essential guide to help you fall in love with and trust the process—instead of getting sidetracked by fleeting certainty.” ~Natalie Nixon, PhD, CEO of Figure 8 Thinking, LLC Additional Material Read an excerpt from Nonlinear in BuiltIn. Read an excerpt of "Nonlinear" in Porchlight Books. Read an excerpt from "Nonlinear" in Fast Company. Related Books'''
