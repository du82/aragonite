description = "Multi-Agent Reinforcement Learning (MARL), an area of machine learning in which a collective of agents learn to optimally interact in a shared environment, b..."
full_description = "Home computers Multi-Agent Reinforcement Learning div#st-1 { display: flex; } .st-btn.st-remove-label { display: block !important; } .add-this__social-links.book-wrapper__social-links img { box-shadow: none !important; } Request exam copy View preview Multi-Agent Reinforcement Learning Foundations and Modern Approachesby Stefano V. Albrecht, Filippos Christianos and Lukas Schäfer Hardcover $70.00 Hardcover ISBN: 9780262049375 Pub date: December 17, 2024 Publisher: The MIT Press 396 pp., 6 x 9 in, 80 b&w illus. MIT Press BookstorePenguin Random HouseAmazonBarnes and NobleBookshop.orgIndieboundIndigoBooks a Million eBook eBook ISBN: 9780262380508 Pub date: December 17, 2024 Publisher: The MIT Press 396 pp., 6 x 9 in, 80 b&w illus. Penguin Random House eTextbook rental 4 Months: $35.00 12 Months: $49.00 eTextbook ISBN: 9780262049375 Pub date: December 17, 2024 Publisher: The MIT Press 396 pp., 6 x 9 in, 80 b&w illus. eTextbook 396 pp., 6 x 9 in, 80 b&w illus. Hardcover 9780262049375 Published: December 2024 Publisher: The MIT Press $70.00 eBook 9780262380508 Published: December 2024 Publisher: The MIT Press MIT Press Bookstore Penguin Random House Amazon Barnes and Noble Bookshop.org Indiebound Indigo Books a Million Other Retailers: Amazon.co.uk Blackwells Bookshop.org Foyles Hive Waterstones MIT Press Bookstore Penguin Random House Amazon Barnes and Noble Bookshop.org Indiebound Indigo Books a Million Description Author(s) Praise Resources Open Access The first comprehensive introduction to Multi-Agent Reinforcement Learning (MARL), covering MARL's models, solution concepts, algorithmic ideas, technical challenges, and modern approaches.Multi-Agent Reinforcement Learning (MARL), an area of machine learning in which a collective of agents learn to optimally interact in a shared environment, boasts a growing array of applications in modern life, from autonomous driving and multi-robot factories to automated trading and energy network management. This text provides a lucid and rigorous introduction to the models, solution concepts, algorithmic ideas, technical challenges, and modern approaches in MARL.The book first introduces the field's foundations, including basics of reinforcement learning theory and algorithms, interactive game models, different solution concepts for games, and the algorithmic ideas underpinning MARL research. It then details contemporary MARL algorithms which leverage deep learning techniques, covering ideas such as centralized training with decentralized execution, value decomposition, parameter sharing, and self-play. The book comes with its own MARL codebase written in Python, containing implementations of MARL algorithms that are self-contained and easy to read. Technical content is explained in easy-to-understand language and illustrated with extensive examples, illuminating MARL for newcomers while offering high-level insights for more advanced readers.· First textbook to introduce the foundations and applications of MARL, written by experts in the field· Integrates reinforcement learning, deep learning, and game theory· Practical focus covers considerations for running experiments and describes environments for testing MARL algorithms· Explains complex concepts in clear and simple language· Classroom-tested, accessible approach suitable for graduate students and professionals across computer science, artificial intelligence, and robotics · Resources include code and slides Stefano V. Albrecht is Associate Professor in the School of Informatics at the University of Edinburgh, where he leads the Autonomous Agents Research Group. His research focuses on the development of machine learning algorithms for autonomous systems control and decision making, with a particular focus on deep reinforcement learning and multi-agent interaction.Filippos Christianos is a research scientist in multi-agent deep reinforcement learning focusing on how MARL algorithms can be used efficiently and the author of multiple popular MARL-focused code libraries.Lukas Schäfer is a researcher specializing in the development of more generalizable, robust, and sample-efficient decision making using deep reinforcement learning, with a particular focus on multi-agent reinforcement learning. Albrecht, Christianos, and Schäfer meticulously bring reinforcement learning together with game theory to provide a foundation for research and application of multi-agent reinforcement learning. This book is the perfect starting point for a grounding in the field. ~Andrew Barto, Professor Emeritus, College of Information and Computer Sciences, University of Massachusetts Amherst, coauthor of Reinforcement Learning, Second Edition The first complete reference for the growing area of Multi-Agent Reinforcement Learning, this book provides both an essential resource for newcomers to the field and a valuable perspective for established researchers. ~Peter Stone, Professor of Computer Science, The University of Texas at Austin, author of Autonomous Bidding Agent Multi-agent reinforcement learning is well positioned to be the next white-hot area of artificial intelligence and this book provides the essential background, concepts, and insights for understanding this exciting and important area of research. ~Michael L. Littman, University Professor of Computer Science, Brown University, author of Code to Joy A landmark textbook to multi-agent reinforcement learning, combining game-theoretic foundations with state-of-the-art deep learning. This essential textbook delivers fundamental insights for newcomers, experts and practitioners, featuring real-world applications and advanced algorithms. ~Karl Tuyls, University of Liverpool This will become the standard text of the emerging field of multi-agent reinforcement learning. Building from foundational ideas and incorporating recent breakthroughs in deep learning, this book will help accelerate theoretical and practical progress. ~Mykel J. Kochenderfer, Stanford University, Professor of Aeronautics and Astronautics, author of Algorithms for Decision Making Additional Material Code Slides General info The open access edition of this book was made possible by generous funding and support from Google Donate to support open access publishing at the MIT Press OA links and downloads Author hosted Open Access edition Related Books"
