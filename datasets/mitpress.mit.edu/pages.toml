full_description = '''Home Page .featured-book-section__copy--1 .promo_text * {color: !important;}Grant Program for Diverse Voices The 2025 grant recipients explore topics such as the racial assumptions of CGI in film, how we might end the American urban gun violence epidemic, an ethnographic study of the transnational egg donation industry, and more. Learn more .featured-book-section__copy--2 .promo_text * {color: !important;}RR/ID in Mexico Rapid Reviews\Infectious Diseases (RR\ID) is an open access overlay journal that accelerates peer review of important infectious disease-related research preprints. To learn more about RR/ID’s editorial outpost in Mexico and the journal’s vision for the future of the project, we spoke to Hildy Fong Baker, managing editor of RR\ID, and Frida Rivera Buendía, assistant editor of RR\ID Mexico. Read the interview .featured-book-section__copy--3 .promo_text * {color: !important;}Black History Month This year to celebrate Black History Month, we’re proud to spotlight a vibrant collection of recent books that challenge and reshape our perspectives and help us see the world anew. The collection features artists speaking to Black experiences in America and theorists building roadmaps for inclusive design Browse the list .featured-book-section__copy--4 .promo_text * {color: !important;}February books Cass Sunstein’s latest book on the social cost of carbon, a nonlinear approach to navigating design’s nuances, an exploration of the dangers behind the use of AI in psychiatry, and more Browse the list .featured-book-section__copy--5 .promo_text * {color: !important;}MIT Press on Bluesky Over 30 million users are using Bluesky to find community, start conversations, and enjoy “social media as it should be.” Follow us at @mitpress.bsky.social and join many of our authors, readers, and scholarly colleagues in intellectually daring, interdisciplinary discourse. Join us on Bluesky New Releases The New Lunar SocietyDavid A. Mindell The Moving Imag