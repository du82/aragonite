title = "The Silicon Shrink"
description = "AI psychiatrists promise to detect mental disorders with superhuman accuracy, provide affordable therapy for those who can't afford or can't access treatment..."
full_description = "Home psychology computers social science The Silicon Shrink div#st-1 { display: flex; } .st-btn.st-remove-label { display: block !important; } .add-this__social-links.book-wrapper__social-links img { box-shadow: none !important; } The Silicon Shrink How Artificial Intelligence Made the World an Asylumby Daniel Oberhaus Hardcover $29.95 Hardcover ISBN: 9780262049351 Pub date: February 4, 2025 Publisher: The MIT Press 264 pp., 6 x 9 in, 1 b&w illus. MIT Press BookstorePenguin Random HouseAmazonBarnes and NobleBookshop.orgIndieboundIndigoBooks a Million 264 pp., 6 x 9 in, 1 b&w illus. Hardcover 9780262049351 Published: February 2025 Publisher: The MIT Press $29.95 MIT Press Bookstore Penguin Random House Amazon Barnes and Noble Bookshop.org Indiebound Indigo Books a Million Other Retailers: Amazon.co.uk Blackwells Bookshop.org Foyles Hive Waterstones MIT Press Bookstore Penguin Random House Amazon Barnes and Noble Bookshop.org Indiebound Indigo Books a Million Description Author(s) Praise Why the race to apply AI in psychiatry is so dangerous, and how to understand the new tech-driven psychiatric paradigm.AI psychiatrists promise to detect mental disorders with superhuman accuracy, provide affordable therapy for those who can't afford or can't access treatment, and even invent new psychiatric drugs. But the hype obscures an unnerving reality. In The Silicon Shrink, Daniel Oberhaus tells the inside story of how the quest to use AI in psychiatry has created the conditions to turn the world into an asylum. Most of these systems, he writes, have vanishingly little evidence that they improve patient outcomes, but the risks they pose have less to do with technological shortcomings than with the application of deeply flawed psychiatric models of mental disorder at unprecedented scale.Oberhaus became interested in the subject of mental health after tragically losing his sister to suicide. In The Silicon Shrink, he argues that these new, ostensibly therapeutic technologies already pose significant risks to vulnerable people, and they won't stop there. These new breeds of AI systems are creating a psychiatric surveillance economy in which the emotions, behavior, and cognition of everyday people are subtly manipulated by psychologically savvy algorithms that have escaped the clinic. Oberhaus also introduces readers to the concept of “swipe psychology,” which is quickly establishing itself as the dominant mode of diagnosing and treating mental disorders.It is not too late to change course, but to do so means we must reckon with the nature of mental illness, the limits of technology, and what it means to be human. Daniel Oberhaus is a science writer based in Brooklyn, New York. He is the founder of the deep tech communications agency HAUS and was previously a staff writer at WIRED. His first book Extraterrestrial Languages (MIT Press) is about the art, science, and philosophy of interstellar communication. “An eye-opening exposé of how machines are replacing people in a sphere they probably shouldn’t be.” ~Kirkus Reviews Related Books"
