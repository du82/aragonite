description = "In Time Machines Richard Taws examines the relationship between art and telegraphy in the decades following the French Revolution. The optical telegraph was ..."
full_description = "Home art technology & engineering history Time Machines div#st-1 { display: flex; } .st-btn.st-remove-label { display: block !important; } .add-this__social-links.book-wrapper__social-links img { box-shadow: none !important; } Time Machines Telegraphic Images in Nineteenth-Century Franceby Richard Taws Hardcover $50.00 Hardcover ISBN: 9780262049184 Pub date: January 21, 2025 Publisher: The MIT Press 400 pp., 6 x 10 in, 80 color illus., 47 b&w illus. MIT Press BookstorePenguin Random HouseAmazonBarnes and NobleBookshop.orgIndieboundIndigoBooks a Million 400 pp., 6 x 10 in, 80 color illus., 47 b&w illus. Hardcover 9780262049184 Published: January 2025 Publisher: The MIT Press $50.00 MIT Press Bookstore Penguin Random House Amazon Barnes and Noble Bookshop.org Indiebound Indigo Books a Million Other Retailers: Amazon.co.uk Blackwells Bookshop.org Foyles Hive Waterstones MIT Press Bookstore Penguin Random House Amazon Barnes and Noble Bookshop.org Indiebound Indigo Books a Million Description Author(s) Praise A riveting exploration of the relationship between art and telegraphy, and its implications for understanding time and history in nineteenth-century France.In Time Machines Richard Taws examines the relationship between art and telegraphy in the decades following the French Revolution. The optical telegraph was a novel form of visual communication developed in the 1790s that remained in use until the mid-1850s. This pre-electric telegraph, based on a semaphore code, irrevocably changed the media landscape of nineteenth-century France. Although now largely forgotten, in its day it covered vast distances and changed the way people thought about time. It also shaped, and was shaped by, a proliferating world of images. What happens, Taws asks, if we think about art telegraphically?Placed on prominent buildings across France—for several years there was one on top of the Louvre—the telegraph's waving limbs were a ubiquitous sight, shifting how public space was experienced and represented. The system was depicted by a wide range of artists, who were variously amused, appalled, irritated, or seduced by the telegraph's intractable coded messages and the uncanny environmental and perceptual disruption it caused. Clouds, architecture, landscapes, and gestures: all signified differently in the era of telegraphy, and the telegraph became a powerful means to comprehend France's technological and political past. While Paris's famous arcades began to crisscross the city at ground level, a more enigmatic network was operating above. Shifting attention from the streets to the skies, this book shows how modern France took shape quite literally under the telegraph's sign. Richard Taws is Professor of History of Art and Visual Culture at University College London. He is the author of The Politics of the Provisional as well as coeditor, with Iris Moon, of Time, Media, and Visuality in Post-Revolutionary France and, with Genevieve Warwick, Art and Technology in Early Modern Europe. “Time Machines is a nuanced, compelling, exceptionally rewarding investigation of a nearly-forgotten technology that once set the pace of modernity. Rediscovering the omnipresent optical telegraph and its signaling arms, Richard Taws redraws the visual, temporal, and political landscape of an early industrialization both alien and familiar.” ~John Tresch, Professor, Warburg Institute; author of The Romantic Machine: Utopian Science and Technology after Napoleon This fascinating and timely book opens up new avenues of inquiry into media-studies inflected art history by looking to an instrumental communications technology and understanding it as a “sensorium.” Taws brilliantly analyzes how telegraphy’s importance extended far beyond its actual use. As this book demonstrates, the telegraph shaped nineteenth-century understandings of time and space and played a key role in the uneven process of modernization. ~Katie Hornstein, chair, Department of Art History, Dartmouth College, author of Myth and Menagerie: Seeing Lions in the Nineteenth Century. Related Books"
