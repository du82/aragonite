title = "The Moving Image"
description = "Video (television, film, the moving image generally) is today's most popular information medium. Two-thirds of the world's internet traffic is video. America..."
full_description = "Home language arts & disciplines photography social science The Moving Image div#st-1 { display: flex; } .st-btn.st-remove-label { display: block !important; } .add-this__social-links.book-wrapper__social-links img { box-shadow: none !important; } The Moving Image A User's Manualby Peter B. Kaufman Paperback $40.00 Paperback ISBN: 9780262538169 Pub date: February 25, 2025 Publisher: The MIT Press 256 pp., 6 x 9 in, 71 b&w photos MIT Press BookstorePenguin Random HouseAmazonBarnes and NobleBookshop.orgIndieboundIndigoBooks a Million 256 pp., 6 x 9 in, 71 b&w photos Paperback 9780262538169 Published: February 2025 Publisher: The MIT Press $40.00 MIT Press Bookstore Penguin Random House Amazon Barnes and Noble Bookshop.org Indiebound Indigo Books a Million Other Retailers: Amazon.co.uk Blackwells Bookshop.org Foyles Hive Waterstones MIT Press Bookstore Penguin Random House Amazon Barnes and Noble Bookshop.org Indiebound Indigo Books a Million Description Author(s) Praise The definitive guidebook for using video in modern communication.Video (television, film, the moving image generally) is today's most popular information medium. Two-thirds of the world's internet traffic is video. Americans get their news and information more often from screens and speakers than through any other means. The Moving Image is the first authoritative account of how we have arrived here, together with the first definitive manual to help writers, educators, and publishers use video more effectively. Drawing on decades as an educator, publisher, and producer, MIT's Peter Kaufman presents new tools, best practices, and community resources for integrating film and sound into media that matters.Kaufman describes video's vital role in politics, law, education, and entertainment today, only 130 years since the birth of film. He explains how best to produce video, distribute it, clear rights to it, cite it, and, ultimately, archive and preserve it. With detailed guidance on producing and deploying video and sound for publication, finding and using archival video and sound, securing rights and permissions, developing distribution strategies, and addressing questions about citation, preservation, and storage—across the broadest spectrum of platforms, publications, disciplines, and formats—The Moving Image equips readers for the medium's continued ascendance in education, publishing, and knowledge dissemination in the decades to come. And, modeled in part on Strunk and White's classic, The Elements of Style, it's also a highly enjoyable read. Peter B. Kaufman is Senior Program Officer at MIT Open Learning. He is the author of The New Enlightenment and the Fight to Free Knowledge and founder of Intelligent Television, a video production company that works with cultural and educational institutions around the world. “Indispensable. A groundbreaking guide to navigating video as today’s dominant medium.” ~Allissa V. Richardson, author of Bearing Witness While Black “A work of genius. The book tells us how to preserve, protect, and curate the moving image as an integral part of fighting back against our current epistemic implosion.” ~Lee McIntyre, author of On Disinformation “This visionary work is an essential, authoritative, and entertaining companion for makers, authors, and scholars that will help them produce, deploy, and quote moving images with fluency and integrity.” ~Rick Prelinger, archivist and Emeritus Professor, University of California, Santa Cruz “At a time when video has become the dominant medium of communication, Kaufman provides a much-needed primer for scholars and practitioners alike.” ~Sandra Ristovska, author of Seeing Human Rights Related Books"
