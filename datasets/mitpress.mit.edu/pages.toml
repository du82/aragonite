title = "Interrogative Design"
description = "“Design thinking” emphasizes the production of solutions after a period of research. By contrast, interrogative design focuses on activating the public s..."
full_description = "Home design art social science Interrogative Design div#st-1 { display: flex; } .st-btn.st-remove-label { display: block !important; } .add-this__social-links.book-wrapper__social-links img { box-shadow: none !important; } Interrogative Design Edited by Ian Wojtowicz Hardcover $42.95 Hardcover ISBN: 9780262048651 Pub date: December 17, 2024 Publisher: The MIT Press 336 pp., in, 176 b&w illus. MIT Press BookstorePenguin Random HouseAmazonBarnes and NobleBookshop.orgIndieboundIndigoBooks a Million 336 pp., in, 176 b&w illus. Hardcover 9780262048651 Published: December 2024 Publisher: The MIT Press $42.95 MIT Press Bookstore Penguin Random House Amazon Barnes and Noble Bookshop.org Indiebound Indigo Books a Million Other Retailers: Amazon.co.uk Blackwells Bookshop.org Foyles Hive Waterstones MIT Press Bookstore Penguin Random House Amazon Barnes and Noble Bookshop.org Indiebound Indigo Books a Million Description Author(s) A timely collection that shows how design can animate public space and catalyze democratic processes through vital discussion and public engagement.“Design thinking” emphasizes the production of solutions after a period of research. By contrast, interrogative design focuses on activating the public sphere and enriching public discourse through the production of questions. A notable contribution to the fields of critical design and media art, interrogative design traces its development to Krzysztof Wodiczko and his 1990s public art projects, documented in the book Critical Vehicles.In Interrogative Design, Ian Wojtowicz showcases this lineage with new writing from Wodiczko and a host of contributions from diverse and influential practitioners, including Rosalyn Deutsche and Antoni Muntadas. This book highlights the dynamism of interrogative design as it is practiced today.Never has the need for work that provokes thoughtful discourse been more necessary, and this volume catalogs both the need and potential viable techniques. A consolidated collection on the legacy and the vital currency of interrogative design, this volume will delight practitioners with new material and serve students as a practical handbook.Contributors also include: Dora Apel, Dan Borelli, Harrell Fletcher, Pete Ho Ching Fung, Dana Gordon, Sara Hendren, Garnet Hertz, Sohin Hwang, Ekene Ijeoma, Marisa Morán Jahn, Mark Jarzombek, Jaekyung Jung, Sung Ho Kim, Jean-Baptiste Labrune, Pia Lindman, Ani Liu, Andrew Todd Marcus, Matthew Mazzotta, Alex Milton, Max Mollon, Mariana Morais, Antoni Muntadas, Gauri Nagpal, Maria Niro, Ginger Nolan, Robert Ochshorn, Adam Ostolski, Sofia Ponte, Gustavo Romeiro, Natalia Romik, Warren Sack, Kirk Savage, Nitin Sawhney, Sanjit Sethi, Samein Shamsher, James Shen, Carl Solander, Richard Streitmatter-Tran, Orkan Telhan, Bruce M. Tharp, Stephanie M. Tharp, Zenovia Toloudi, Marek Wasilewski, Lani Watson, Sampson Wong, and Ben Wood. Ian Wojtowicz has exhibited internationally and has spoken at The New School, California College of the Arts, Carnegie Mellon University, Polin Museum of the History of Polish Jews, and the US Holocaust Memorial Museum. His projects have been featured in Wired Magazine, PBS, the Discovery Channel, and Atlantic Monthly. Related Books"
