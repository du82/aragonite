full_description = "Home business & economics Introduction to Fixed-Income Analysis and Portfolio Management div#st-1 { display: flex; } .st-btn.st-remove-label { display: block !important; } .add-this__social-links.book-wrapper__social-links img { box-shadow: none !important; } Request exam copy View preview Introduction to Fixed-Income Analysis and Portfolio Management by Frank J. Fabozzi Hardcover $100.00 Hardcover ISBN: 9780262049450 Pub date: January 21, 2025 Publisher: The MIT Press 616 pp., 8 x 10 in, 98 b&w illus. MIT Press BookstorePenguin Random HouseAmazonBarnes and NobleBookshop.orgIndieboundIndigoBooks a Million eTextbook rental 4 Months: $50.00 12 Months: $70.00 eTextbook ISBN: 9780262049450 Pub date: January 21, 2025 Publisher: The MIT Press 616 pp., 8 x 10 in, 98 b&w illus. eTextbook 616 pp., 8 x 10 in, 98 b&w illus. Hardcover 9780262049450 Published: January 2025 Publisher: The MIT Press $100.00 MIT Press Bookstore Penguin Random House Amazon Barnes and Noble Bookshop.org Indiebound Indigo Books a Million Other Retailers: Amazon.co.uk Blackwells Bookshop.org Foyles Hive Waterstones MIT Press Bookstore Penguin Random House Amazon Barnes and Noble Bookshop.org Indiebound Indigo Books a Million Description Author(s) A concise but comprehensive introduction to fixed-income analysis for undergraduate and graduate students.Offering more concise and less technical coverage of the material featured in the classic text Bond Markets, Analysis, and Strategies, this streamlined book is rightsized for a one-semester fixed-income course. In accessible terms, Frank Fabozzi describes the sectors of the fixed-income market, details how to value fixed-income instruments, explains how to measure interest rate risk, and demonstrates how to manage a fixed income portfolio. Key concepts are illustrated with extensive examples and exercises, and end-of-chapter questions invite further research. The result is an incisive but approachable introduction to fixed-income analysis for undergraduate finance and business students.• Comprehensive coverage of fixed-income markets• Easy-to-understand framing of mathematical concepts accommodates a wide readership with varying levels of mathematical expertise • Extensive illustrations and examples animate analytical chapters• Written by an expert with deep experience in the asset management industry and the classroom• Pragmatic modular structuring of content enables adaptability to different curricula • Instructor resources available Frank J. Fabozzi is Professor of Practice at Johns Hopkins Carey Business School. He has held positions at EDHEC Business School, Yale, Princeton, MIT, NYU, and Carnegie Mellon. He is the author of Entrepreneurial Finance and Accounting for High-Tech Companies and Introduction to Fixed-Income Analysis and Portfolio Management, and coauthor of Bond Markets, Analysis, and Strategies, Tenth Edition and Foundations of Global Financial Markets and Institutions, all published by the MIT Press. His forthcoming coauthored books to be published by MIT Press are The Economics of FinTech and Simulation, Optimization, and Machine Learning for Finance. Related Books"
