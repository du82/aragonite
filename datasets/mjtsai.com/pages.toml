["https://mjtsai.com/blog/2017/10/13/bbedit-12"]
title = "Michael Tsai - Blog  -  BBEdit 12"
full_description = "The setting “Surround selected text when typing matching delimiters” allows you to control whether typing an opening delimiter will surround the selection range. This is independent from whether delimiters are auto-paired when typing an opening delimiter with no text selected. When performing an Extract operation, you can now use a Grep replacement pattern in the “Replace” field (in Find or Multi-File Search) to transform the extraction results. Added an “Expert” preferences pane, which provides direction to the Expert Preferences help book. The “Restore Defaults” button in this pane will reset all expert preferences to their factory defaults. The Live Search command now supports grep pattern matching when the “Grep” option is enabled, and stored patterns are available under the “Saved patterns” (“g”) popup. The navigation bar now contains an item indicating the current Git branch (for documents that are in a Git working copy). I’ve been happily using BBEdit for somewhere around 22 years now. As a user, I appreciate that it pretty much never does anything to annoy me. This is rare. With almost every other app, I’m always thinking to myself: if I had the time, I’d write my own version that works the way I want. As a developer, I admire that Bare Bones has been able to keep the product thriving for so many years with a steady stream of free and paid updates. They’ve done a good job of balancing adding new features, modernizing the code (incrementally rewriting in different languages and for different APIs), and keeping it (seemingly) bug-free. The next test will be whether BBEdit completes the transition to Cocoa before macOS 10.14 adds “compromises” for 32-bit apps. I’m optimistic because it looks like much of the app has already been rewritten over the last few major versions. I do a lot of text and data formatting in BBEdit, and one of the great additions in this version is a Columns editing command, that enables quick processing of comma- and tab-delimited text ranges—you can cut, copy, delete, and rearrange columns. You might think that sounds like an esoteric feature, but I’ve probably pasted a tab-delimited text block from BBEdit into Microsoft Excel purely for column management hundreds of times at this point."
