["https://mjtsai.com/blog/2017/10/27/panorama-xs-take-on-subscriptions/trackback"]
title = "Michael Tsai - Blog  -  Panorama X’s Take on Subscriptions"
full_description = "After your free trial, you can get started with Panorama X for as little as fifteen dollars up front, and ongoing use is as little as $5/month. For months when you don’t use it, you pay nothing. There are no recurring payments — we don’t keep your credit card on file and you are in control at all times (all payments are made from within the application, under your control). So you essentially pre-pay for a certain number of months, and you aren’t billed for months with less than an hour of use, e.g. if you accidentally launch the app or just need to look up something quickly. It’s $8.33/month for one year, down to $5/month for five years. After the “subscription” expires, the app keeps working but switches to nag mode. All in all, this seems like a fair deal, although it’s considerably more complicated to implement than regular subscriptions or the traditional software model. Our goal is to make it easier for new users to come onboard with Panorama. In the past, the only way a new user could start using Panorama was by paying hundreds of dollars up front. Sure, we’ve always had a free trial, but for a full featured product like Panorama, it often takes more than 15-30 days to really fully understand how and if it will fit into your workflow. But with the old model, the user had to take on all the risk and put up a big chunk of cash up front. Understandably, a lot of potential users were reluctant to do that. We’d like to see lots of new users start using Panorama X, so we gave a lot of thought to how we could help users around this roadblock. In addition, I think subscriptions in general have gotten a bad name because quite a few companies have made a big price hike at the same time that they switched to the subscription model. In some cases the software now costs the same per year that it used to cost to purchase. We haven’t done that. Ultimately, I think this new system is a big bet on our part that customers will like Panorama X and find it productive for them. If they don’t, our revenue will dry up, and we won’t have banked a big up front payment. We’ve set this system up in a way that we have to earn our keep on an ongoing basis. If the software isn’t great, we’ve got nowhere to hide."
