["https://mjtsai.com/blog/2024/09/24/automattic-vs-wp-engine"]
title = "Michael Tsai - Blog  -  Automattic vs. WP Engine"
full_description = "Automattic CEO and WordPress co-creator Matt Mullenweg unleashed a scathing attack on a rival firm this week, calling WP Engine a “cancer to WordPress.” Mullenweg criticized the company — which has been commercializing the open source WordPress project since 2010 — for profiteering without giving much back, while also disabling key features that make WordPress such a powerful platform in the first place. It’s worth noting that Automattic has a history in backing WordPress-hosting companies, having invested in WP Engine itself way back in 2011, while Mullenweg also spoke at WP Engine’s conference just last year. Moreover, Automattic also bought a majority stake in WordPress-hosting company Pressable back in 2016, and later invested in GridPane too. During calls on September 17th and 19th, for instance, Automattic CFO Mark Davies told a WP Engine board member that Automattic would “go to war” if WP Engine did not agree to pay its competitor Automattic a significant percentage of its gross revenues – tens of millions of dollars in fact – on an ongoing basis. Mr. Mullenweg further stated that he had already created slides for his keynote speech, taking aim at WP Engine and its investor, and would present them to WordCamp attendees – and to millions of others via livestream on YouTube – if his financial demands were not met. What I find deeply ironic in this situation is his accusation that WP Engine “confused even his own mother,” while he’s the owner of Automattic, which has a hosting service literally called WordPress.com, distinct from the FOSS project WordPress.org — an intentional yet obvious confusion that everyone who interacts with WordPress struggles to understand and has benefited Automattic immensely since ever. Last year, Matt leveraged the FOSS project and his for-profit endeavor resemblance (and his position in both) to redirect web searches pointed at WordPress.org plugin directory to a mirror hosted in WordPress.com. There’s a widget on the default WordPress dashboard that displays a RSS feed of WordPress.org, where Matt posted his rant, making it show up everywhere."
