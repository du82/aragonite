["https://mjtsai.com/blog/2004/01"]
title = "Michael Tsai - Blog - Archive - 2004 - January"
full_description = "Kudos to Alsoft for providing an easy way for DiskWarrior 3.0 users to update their bootable CDs to 3.0.1. Unfortunately, the updating program, when run on my tower, stopped after I inserted the blank disc, complaining: “The media is not the right type for the requested operation.” It worked correctly on my iBook, although the the resulting 10.2.3 CD won’t boot that machine. I’m still amazed at how much faster 3.x is than previous versions. He also talks a bit about his contributions to the original Mac OS and how they translated to Mac OS X. I had always thought that Launch Services stored these preferences in the ~/Library/ tree, but it turns out that choosing an application to open a file adds ‘icns’ and ‘usro’ resources to the file (and leaves the creator code intact). How odd. Changing the application back to the one whose creator code tags the file does not delete these resources. SpamSieve 2.1.2 is now available. The major change in this release is full support for Apple Mail (more on that later). And a big thank you to Goichi Hirakawa for translating SpamSieve to Japanese. Erik Barzeski and John Gruber are highly recommending Andy Hertzfeld’s new site about the development of the Mac, and with good reason. My favorite entry so far is about measuring progress by lines of code. Today’s TidBITS turned me on to PDFpen, a nice, lightweight, and scriptable utility for basic PDF editing. Brent Simmons catalogues the different styles of info and inspector windows on Mac OS X. One thing he doesn’t mention is that some of these windows accept the keyboard focus, while others don’t, and it’s not always easy to tell what a given window will do. I’m old-school on this issue: Command-W should never close a floating window. Halo didn’t initially work on my iBook G4; it would always quit just after showing the splash screen. After some weeks, Greg Grimes at MacSoft figured out that I should copy the “shaders” folder on the CD into the “Halo” folder on hard drive. Now it works, and the performance is acceptable on the iBook with everything on low quality, which is more than I as expecting. As to Halo itself? The game was worth the wait, though I’m disappointed about the sloppy resolution switching code that messes up all my window positions."
