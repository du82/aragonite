["https://mjtsai.com/blog/2006/04"]
title = "Michael Tsai - Blog - Archive - 2006 - April"
full_description = "LaunchBar 4.1 is now Universal and starts up much faster. Other improvements include a Calculate script that lets you quickly type a mathematical expression and have it evaluated (using Perl)—no more opening Calculator just to do simple calculations. With computers getting faster, there’s less reason to put up with LALR(1) parser generators like Bison and Yacc. John Aycock sees a shift to more powerful Earley and GLR parsers that don’t require fiddling with the grammar to reduce conflicts and left-recursion. Earley, which “just worked” when I used it about five years ago, is cubic in the worst case but has good performance for most “normal” grammars. Good luck to John Gruber, who’s quit his job and will now try writing his site full-time. I think this will solve the catch-22 in which lots of people liked his work but were reluctant to become members because he wasn’t writing enough. We have lots of Apple hardware. You can see here the old colorful iMacs along with some of the old iBooks. You can also see two of our Lab Technicians working on the backup systems, but more about that later. Up until a few months ago we had every significant hardware revision Apple has ever released since the dawn of time. We even had a section of the Lab we affectionately called the “Mac Nursery” where we kept all the older Macs going. We even had an old SE/30 and IIci and super expensive Mac II all connected via PhoneNet running Spectre, just for fun. It's always super fun to boot Word 1.0 or Excel 1.0 on these old machines and see how much things have changed. A funny piece of trivia about my first job at Apple is that I was technically hired to work on PowerTalk/AOCE, a technology which had just been essentially cancelled, and the former team laid off. Apparently Apple had to keep the sources “at the ready” and have somebody prepared to do a quick bug fix if one of the important clients of the software ran into an emergency. So they gave my manager permission to hire a general integration engineer whose top priority would be maintaining PowerTalk. This didn’t exactly thrill me, but the fact is PowerTalk opened the door to my permanent employment at Apple."
