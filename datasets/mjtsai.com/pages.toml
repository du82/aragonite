["https://mjtsai.com/blog/2004/03"]
title = "Michael Tsai - Blog - Archive - 2004 - March"
full_description = "Adam Engst writes about a subject dear to me: keyboards. My favorite keyboard, in terms of feel, was the ADB keyboard that shipped with the Apple IIGS. Unfortunately, it didn’t have F-keys, Home/End, or Page Up/Page Down, and the arrow keys were arranged in a line. The keyboard that shipped with the SE/30 was flawed in the same ways, but it also had a good feel. The Apple Extended Keyboard II combined a full set of keys with a solid, “clicky” feel that wasn’t too loud. I believe it was the best Macintosh keyboard ever made, and I continued to use mine after getting a USB Mac until it finally wore out. After that, I tried every Mac keyboard I could find and eventually settled on the Micro Connectors flavored keyboard (the Micro Connectors Web site seems to be down), which I use to this day. The Micro Connectors is a decent, but not great, keyboard. The feel is solid, but not as smooth as the older Apple keyboards, and it’s extremely loud. (On the PC side, I was quite happy with the old PS2 Dell QuietKey. It had a great feel, and it truly was quiet.) Engst reports on the Tactile Pro, which he says is similar to the Apple Extended Keyboard, but with USB, volume and eject keys, and detailed keycaps. Sounds great. Now that DreamHost servers are back up after about a day of downtime, I can link to RegExLib, a site with a large collection of regular expressions. Jonathan Rentzsch created an excellent QuickTime movie that shows how to create a simple WebObjects application. The best part is seeing how the different tools fit together. Chris Hanson writes about LilyPond, which he says is like LaTex for music, but easier to write. The best music typesetting software I’ve seen is Music Press. It’s easy to use (direct manipulation everywhere), produces great output, and is fast. Unfortunately, it’s pricey for non-professionals and is not OS X–native. I don’t plan to use Markdown, John Gruber’s Setext-on-steriods Perl script. I’m already using reStructuredText, which is more extensible and supports multiple output formats. However, there are still some reasons that I find Markdown interesting."
