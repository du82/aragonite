["https://mjtsai.com/blog/2006/02"]
title = "Michael Tsai - Blog - Archive - 2006 - February"
full_description = "When I first started developing Mac software, I used OmniOutliner to keep track of feature requests, bugs, and notes about what I was working on at the moment. It was great for organizing little bits of information, but it wasn’t quite powerful enough. I soon switched to a Mac build of CVSTrac. Being Web-based, this was more cumbersome to use, but it provided better search options, and the Web interface made it very flexible at displaying different windows and views of the information. Most importantly, it integrated with CVS. CVSTrac includes a great CVS browser, which I could have used by itself. But I also used it to track issues, because I wanted to be able to see which tickets corresponded to which check-ins. CVS assigns revision numbers per-file, but CVSTrac is able to group the revisions (and display the changes) by check-in. It has a nice timeline that interleaves check-ins and ticket changes. CVSTrac isn’t good for storing rapidly changing notes (which I create and edit while coding a particular feature or fix), so I used BBEdit for that. Naturally, when I switched from CVS to Subversion, I switched from CVSTrac to Trac. I like Trac even better than CVSTrac, except that it’s kind of a pain to install. When I got my iMac Core Duo I started thinking about building a universal binary version of Trac and realized that would be even more of a pain. (I want to be able to sync it between my iMac and PowerBook and run it at full speed on both machines—Web applications are slow enough without Rosetta. Actually, to run in Rosetta isn’t quite trivial, either; it would probably involve making a stripped python binary and changing some shebang lines.) None of this would have been difficult, but it was enough work that it got me to think about whether there might be an easier way. At this point, I realized that I don’t need Trac for issue-tracking. Subversion has built-in support for revision numbers, so I can use a separate tool for issue tracking and simply enter the revision numbers in the appropriate places. Since I’m a solo developer, I don’t need a Web-based solution; I can use a real Mac application that saves regular files to disk. When I need to browse Subversion, I can use BBEdit, or fall back on Trac."
