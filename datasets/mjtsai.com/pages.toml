["https://mjtsai.com/blog/2004/07"]
title = "Michael Tsai - Blog - Archive - 2004 - July"
full_description = "Michael McCracken’s Stakeout uses kqueue to monitor source files and re-run the unit tests when they change. When you decide what infrastructure to use for a project, you’re not just making a technical decision. You’re also making a social decision, and this may be the more important of the two. The Mailsmith 2.1.2 update makes SpamSieve more accurate and makes some minor but very welcome enhancements to the Advanced Query window. The initial release of PulpFiction, Freshly Squeezed Software’s news reader, wasn’t usable for me, but the new 1.0.1 squashes bugs and is much faster. I’m not sold on the idea that an Apple Mail–like interface is a good thing, and I don’t think I need its spiffy filtering capabilities. (If they could look at the entire article contents, not just the excerpt, that would be interesting.) That said, I like that the display is customizable using CSS and that it offers persistent storage (of excerpts, not full articles, alas) and full text search. It will be interesting to see how it compares with NetNewsWire 2.0. John Gruber reports that Apple Mail in Tiger stores each POP message in its own file (à la Claris Emailer 1.0), rather than using one mbox file per mailbox. In previous versions of Mail, messages in mbox files were searchable using SearchKit, but in Tiger the messages must be available to Spotlight—and Spotlight uses files as the unit of search. Brent Simmons wonders whether other developers will change how their applications store data, in order to make it available to Spotlight. I think that would be a shame. If Mail does in fact shift to using one file per message, it will no longer be useful to me. This scripting addition from Late Night Software lets you manipulate AppleScript records like real dictionaries and do set operations on lists. PHP 5 seems to mostly fix the most glaring problem in PHP 4, its non-intuitive handling of references. However, this issue is more complicated than it sounds. For starters, here is one of the unit tests from PHP 5:"
