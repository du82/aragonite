["https://mjtsai.com/blog/2017/12/12/the-imac-pro"]
title = "Michael Tsai - Blog  -  The iMac Pro"
full_description = "Apple today announced the iMac Pro will be available to order on Thursday, December 14. Pricing starts at $4,999 in the United States. With four Thunderbolt 3 ports, the iMac Pro can drive two 5K displays or four 4K displays at 60Hz simultaneously. It also has a 10 Gigabit Ethernet port, four USB-A 3.0 ports, an SD card slot, and a 3.5mm headphone jack. Brownlee in his hands-on video said the high-end 18-core iMac Pro will ship early next year, alongside an unannounced 14-core model that will apparently be added to the lineup for a total of four Intel Xeon processor configurations. But we still can’t order them or even view their configurations, pricing of every option is still a mystery, and only the lower half of the CPU options will be available at launch. Apple doesn’t consider developers “pros” for PR purposes. It’s pretty much always and only video editors. Even though we’re a FAR bigger industry that probably buys more pro Macs, PR likely thinks nobody wants to see Xcode builds or VM containers. They’re probably right. I spoke with the iMac Pro team yesterday and they’re keen to change this, they said. Developers is the biggest pro group for them. I did give them shit for failing to press that point and for the flubs like TouchBar. Hope they listen! Apple (amazingly/unprecedentedly?) provided me with a loaner iMac Pro a few days ago to check out, and in turn, I’m very eager to share my notes with you. Here are six initial impressions in a thread[…] We tried compiling one of our meatier Xcode projects on the iMac Pro (10-core Xeon W, 3 GHz) vs. our standard Mac Pro (3.5 GHz Xeon E5, 6-core). Sure, the Mac Pro is old, but the iMac Pro compiled the project 41% faster. A pretty sincere boost. I would like to see a comparison with a 2017 iMac. iMacs, and even Mac minis, have outperformed Mac Pros at compilation for a while now. Most of my apps have around 20,000-30,000 lines of code spread out over 80-120 source files (mostly Obj-C and C with a teeny amount of Swift mixed in). There are so many variables that go into compile performance that it’s hard to come up with a benchmark that is universally relevant, so I’ll simply note that I saw reductions in compile time of between 30-60% while working on apps when I compared the iMac Pro to my 2016 MacBook Pro and 2013 iMac."
