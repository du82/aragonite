["https://mjtsai.com/blog/2016/04"]
title = "Michael Tsai - Blog - Archive - 2016 - April"
full_description = "Basically Apple let them use my app for free for two whole school years without even asking my permission. And it’s actually worse than just letting them use it for free, because now Avatron has an unexpected revenue hole for this year. I had 1 day edu refund of 140 copies, after 2 yrs of use. Apple declared it an exceptional case and refused to elaborate. So how many developers are turning off educational discounts as this spreads like wildfire through our community? The App Store weirdness with refunds isn’t limited to educational purchases. I still see individual sales and refunds of Tweetbot iPhone 2. A lack of decent, consistent communication is the root of so many of the issues plaguing the store, whether it’s apps being rejected for ridiculous and inconsistent reasons, or poor advice from the App Review team. Seems like they institutes some new account management policy or something, and are working out the edge cases. So someone bought 30 edu copies of Library 3 yesterday, then returned them today. I don’t get this game. I think Dr. Drang nails it. We might be seeing “peak iPhone”. But it could just be a statistical blip, caused in large part by the iPhone 6’s exceptional popularity, along with other factors like the economy in China and currency exchange rates. In chart form, you can see what an anomaly last year was with the iPhone 6. But given that you can almost draw a straight line connecting the other four points in the chart, I’m not willing to call it a peak yet. But even if we see a return to growth, it might take several years before we see another Q2 with over 60 million units sold. To that end I stand by my takeaway last quarter that the iPhone is likely to return to growth with the iPhone 7, but I must admit Cook’s focus on slow upgrades is worrisome: a big reason why I argued last fall that the iPhone will be fine was Cook’s insistence that iPhone 6 upgrades were not out of the ordinary, but given that Cook now says the opposite leads to the question of just how long people will now hold onto their good-enough iPhones with their big-enough screens."
