["https://mjtsai.com/blog/2017/07/20/productivity-apps-and-subscription-pricing"]
title = "Michael Tsai - Blog  -  Productivity Apps and Subscription Pricing"
full_description = "Day One is evolving. We’re transitioning to a more stable subscription business model to ensure this app and these services always stick around. This week we’re releasing the Day One Premium subscription service. It includes the ability to create more than ten journals and access all future premium features. If you have already purchased Day One (version 2.0 and later), the features you currently have will always be yours to use without any additional cost. I think Day One Journal is an awesome app. Maybe the best journaling app around. The developer (Paul Mayne) has always seemed professional and nice when I’ve interacted with him. This is exactly what makes me sad. These are the reviews for Day One since the announcement. This is my fear for iOS. Apple showed their customers what the bottom of the barrel looks like. It’s free apps forever. 10 years after the iPhone, I think we are seeing where it’s headed – Apple-made apps with an endless supply of third party coin-grubbing games. There was a time when a new, amazing, and high quality application was released on iOS almost every week. But today, the market grows fallow. What were once top-tier apps are either languishing un-updated or being kept alive by experimenting with new business models. My impression is that the subscription model is a move to stay profitable. I don’t think this will be a magic bullet. Customers simply don’t want to pay the price for top-tier self sustaining apps on iOS, especially when the full annual cost of $50 is spelled out in black and white. I spoke with a developer friend that makes legal-related apps. He explained the transition of his app to a subscription model as a last resort to keep the lights on but also “the worst two months of my life”. This new app economy has been particularly rough on quality productivity apps. Those apps take a lot of time and attention to do right while at the same time consumers are not used to paying subscriptions for them. Nevertheless, that is probably the best model available to them at this point."
author = "Michael J. Tsai"
year_published = 2020
year_updated = 2020
