["https://mjtsai.com/blog/2017/01/03/finding-an-alternative-to-mac-os-x"]
title = "Michael Tsai - Blog  -  Finding an Alternative to Mac OS X"
full_description = "I deeply value the consistency, versatility, reliability and integration of Mac OS X and the excellent quality hardware it runs on. However the current state of the Mac has me considering whether it’s still the right platform for me. At the end of November motivated by the lacklustre MacBook Pro updates I installed a bunch of different OSes to see if I could find one that met my requirements. These are what I tried[…] The last time Mac users were seriously passing around articles like this was during the transition from Mac OS to Mac OS X. The truth is, for most of us, there is no good alternative to MacOS. Nothing. And it took so long — not years but decades — for MacOS to get to where it is that I don’t think any other OS could ever catch up. That’s what’s driving the arguably paranoid fear that Apple is abandoning the Mac. It’s not so much the evidence (lack of updates to Mac Pro and Mac Mini, and concerns about software quality) as the high stakes: if the Mac goes away, the world will be left without a Mac-quality desktop OS. I think a lot of the hardware issues are temporary, and Apple could change course relatively quickly if motivated. The software quality is a more serious concern. Apple is one of the richest companies in the world, but it has built up a staggering amount of technical debt. I see no signs that this is being addressed. The best case—that Apple recognizes the problem and decides to do something—would probably take at least five years to pay it down. The prospect of changing over to a new software ecosystem is scary. We totally get it, switching out the platform that you pay your bills with is a big deal, and certainly not a decision to take lightly. You’ve grown comfortable over the years with the OS that you love and the ecosystem around it, but now the future of Motion Design on the Mac looks a bit uncertain. We know that you have a lot of questions about making the switch, so let’s take a look at some of the bigger ones and see if we can’t ease some of those concerns."
