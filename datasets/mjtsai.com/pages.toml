["https://mjtsai.com/blog/2012/02"]
title = "Michael Tsai - Blog - Archive - 2012 - February"
full_description = "Dropbox has the opportunity to build a platform that sits outside all the platforms we’ve come to know. Their challenge is to get users to care whether they can connect their Dropbox data to the devices they use. So far, they’ve done better than anyone else. And they won’t have to deal with the second-guessing and turf wars that happen inside big companies. I don’t think it’s a slam dunk that Dropbox will grow to be a huge tech company, but I also don’t think their product is just a feature. When you use NSAssert, ultimately the expanded code contains a reference to self and _cmd, inside whatever method the line was used. This also prohibits use of NSAssert in a block, because it creates a retain cycle. Just use NSCAssert which looks slightly wonky but does not require being used within an Objective-C method, and does not allow the programmer to accidentally create retain cycles. The app listed for sale for $29 on the store as “PDF Reader” is actually our free and open source Skim app, although no mention of the Skim Sourceforge project is made in the description, and the support link just goes to a livejournal post where the Skim web page ad copy has been pasted. There is also a $19 app called “PDF Expert” that appears to be another copy. That one even went ahead and used Adobe’s Acrobat trademark in their icon! Skim’s BSD license allows others to use the code, but not without attribution. The Skim developers have not had any luck getting Apple to do something about this. The PC that’s driving your iPad Windows experience is, in fact, a “farm” of computers at one of three data centers thousands of miles away. Every time you tap the screen, scroll a list or type on the on-screen keyboard, you’re sending signals to those distant computers. The screen image is blasted back to your iPad with astonishingly little lag. So why was it so easy for me to use the TouchPad for work, but not the iPad? I think it’s because there are a number of things the TouchPad does that make it more suitable for work."
