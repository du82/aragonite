["https://mjtsai.com/blog/2017/09"]
title = "Michael Tsai - Blog - Archive - 2017 - September"
full_description = "Take any HFS+ formatted volume that does not have an installation of macOS on it (that part is key), right-click on the volume in the Finder and choose the option to encrypt it. Rather than simply converting the volume to a CoreStorage Encrypted volume and keeping the HFS+ format, macOS converts the volume to APFS with no warning, and then enables encryption. APFS Encrypted volumes aren’t backwards compatible at all, so if you attach that converted disk to a Mac running an older version of the OS, you’re greeted with this heart-attack-inducing error message[…] But if I disable encryption on my APFS volume, the APFS part sticks – it’s not possible to convert an APFS volume back to HFS+ without erasing it. Amazon today introduced a new $69.99 Fire TV with HDR and 4K capabilities. The redesigned Fire TV is a small flat square dongle with an HDMI cable sticking out, and it again ships with an Alexa voice remote included. It’s basically a smaller version of the discontinued set-top box that now plugs into the back of your TV and hangs there. The previous Fire TV box already did 4K, but this one can now play it at 60 frames per second and adds HDR (high dynamic range) as a brand new feature to Amazon’s streaming devices. The new Fire TV is powered by a 1.5Ghz quad-core processor and has access to tens of thousands of apps and Alexa skills; if you don’t want to bother with the remote, you can also pair the Fire TV with an Echo device in your home to control it with just your voice at any time. Earlier this week I wrote about my vague concern about Apple’s insular culture. Apple TV is the product line where I think that might really be a problem. Apple charges a significant premium over the average product in PCs, tablets, and phones. It works for them in those markets. That’s what Apple does and has always done: they make superior, premium products for people willing to pay for them. I like Apple TV a lot, but I think Apple is ceding marketshare by not having a box that competes on price. I think there are a lot of people who look at iPhones, iPads, and MacBooks and see them as “expensive but worth it” but who look at Apple TV and see it as “ridiculously overpriced”."
