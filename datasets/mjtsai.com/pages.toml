["https://mjtsai.com/blog/2019/03/13/spotify-time-to-play-fair"]
title = "Michael Tsai - Blog  -  Spotify: Time to Play Fair"
full_description = "Apple requires that certain apps pay a 30% fee for use of their in-app purchase system (IAP) – as is their prerogative. However, the reality is that the rules are not applied evenly across the board. Does Uber pay it? No. Deliveroo? No. If we choose not to use IAP (the only payment option on iOS), Apple, in return, bars us from communicating directly with our customers who access Spotify via Apple platforms. Apple won’t let us share awesome deals and promotions — like 99c for three months of Spotify Premium. And we aren’t just talking about what we are allowed to do on the app. Worse yet, they don’t even let us email offers after you register your account, claiming we are circumventing their rules. But where Apple thinks that our app doesn’t abide by their unilaterally imposed restrictions, it routinely rejects bug fixes and app enhancements that would improve user experience and the app’s functionality – leading fans to believe our app and tech abilities are sub par. For Spotify to use Apple’s billing system (IAP) — giving our fans the opportunity to upgrade to Premium — Spotify and others now have to pay 30% of any subscription fees. Apple now prohibits buttons or links to any other external ways to pay. This is the first of many moves from Apple that would make it harder and harder for our fans to upgrade to Premium[…] We elect not to use IAP for a bunch of reasons, including the fact that giving up 30% was too much for us to keep our prices low for our fans. Now that Apple has Apple Music, rejections of the Spotify app start becoming more and more common, and they even go as far as threatening to remove us from the App Store. Those rejections seem to coincide with our promotional campaign seasons[…] Now just having a “Learn More” button is enough to upset the Apple cart even though this is the first time we’ve heard of such a rule. This time, we are rejected because of a campaign that makes reference to a Spotify Premium promotion (“get 3 months now for €0.99”), despite only directing users to a landing page with no info on where or how to purchase Premium (which Apple had allowed only a few months prior). In fact, Apple’s chief lawyer told us a year earlier that such a landing page was OK, but that didn’t stop the App Store from blocking our app for this reason"
