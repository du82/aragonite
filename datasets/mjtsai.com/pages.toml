["https://mjtsai.com/blog/2015/04/09/the-12-inch-macbook"]
title = "Michael Tsai - Blog  -  The 12-inch MacBook"
full_description = "The way Apple’s presentation focused on the new MacBook’s keyboard, you might think it was better for typing, the way all keyboards would be someday. Jason Snell finds otherwise: Apple seems to have realize that the reduced travel has made this keyboard less appealing, and has attempted to offset the change with a bunch of other changes that improve the typing experience. There’s a new butterfly key mechanism atop stainless steel dome switches, which Apple says increases key stability, and the keys are all a bit wider than on a traditional keyboard, so there’s more area to hit on each key. These changes help, but they don’t really offset the reduced travel. The MacBook keyboard’s better than I expected it to be—I was able to score 118 words per minute on TypeRacer using it—but it never felt particularly comfortable. If you’re not a keyboard snob, you may not even notice the difference, but if there’s any single feature that would make me reluctant to buy a MacBook, it would be the keyboard. The Esc key has been elongated and the function keys narrowed, which didn’t really bother me. However, the redesign of the arrow keys really shook me–the up and down arrows are still half-height, but the left and right arrows are now full sized. It turns out that I used the gaps above the left and right arrow keys on prior keyboards to orient by feel, so I knew which arrow key was which. On the MacBook’s keyboard, there’s no longer a gap–and I kept having to look down to make sure I was tapping the up arrow key. I’ve got to say that I’m not a fan of the new keyboard. Apple played the other enhancements that the keyboard offers, such as increased stability and wider keys, as attempts to offset some of the costs of the reduced key travel. That makes me hopeful that Apple sees this keyboard as what it is—a pretty serious compromise in order to get the computer thinner—rather than some breakthrough new keyboard that will be replicated on every other Apple keyboard in the next year or two."
author = "Michael J. Tsai"
year_published = 2015
year_updated = 2018
