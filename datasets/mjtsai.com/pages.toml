["https://mjtsai.com/blog/2018/04/10/apple-now-runs-on-100-green-energy"]
title = "Michael Tsai - Blog  -  Apple Now Runs On “100%” Green Energy"
full_description = "“I am not aware of any other company that uses that same stringency for making sure the clean power that they’re investing in or purchasing is on the regional grid where it’s being used,” she boasts. But she acknowledges that there are still places in the world where that’s not possible, though that may have more to do with the reality of power markets than choices Apple has made. In some cases, the company has had to sign long-term contracts to acquire the RECs from a new project it helped create elsewhere in the same region. That was the case recently for a two-person office in Chile. There was no suitable green energy source nearby, so Apple is now offsetting the brown power used by that office with RECs from one of its green-power projects in Brazil. This sounds like a reasonable thing to do in that situation, but if Apple is relying on credits/offsets I don’t think they should claim to use 100% green energy. That would imply that they can run without any brown power, which doesn’t seem to be the case. There are also questions about what the Apple stores in Nova Scotia, Perth, and Anchorage are doing. The article also doesn’t make clear exactly what happens in areas where renewable energy may not be reliable around the clock. Are they storing solar energy in batteries during the day to use at night? Or is the “100%” a net figure meaning that enough extra is produced during the day to balance out the nighttime use? If the latter, that is really misleading. Every Apple store, every data center, every Apple corporate office — everywhere — is now powered by 100 percent renewable energy. I wish Cook would stop overreaching. He could be proud of what Apple has accomplished here without claiming more than it’s actually done. Just like he could have said that Apple was paying the taxes required by law without also claiming not to “depend on tax gimmicks”. Or he could have defended the reasoning behind the iPhone battery throttling without claiming that Apple had explained it when iOS 10.2.1 was released."
