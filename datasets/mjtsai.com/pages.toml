["https://mjtsai.com/blog/2024/08/26/carplay-spinning-its-wheels"]
title = "Michael Tsai - Blog  -  CarPlay Spinning Its Wheels"
full_description = "But even against this backdrop, CarPlay increasingly found itself squeezed by a variety of factors: automobile manufacturers who didn’t want to cede control to an outside force, internal Apple forces focusing on the nascent car project, and increased competition from Google, which not only debuted its own Android Auto feature a year after CarPlay, but also made a play for even deeper integration via Android Automotive a few years later. The future of the feature was far from assured. Let’s be clear: CarPlay is far from dead. It continues to get new features with every major update to iOS. This year, it gains a few new additions, including a handful of design tweaks, the sound recognition feature for horns, and new accessibility options, including color filters. All features which are nice to have, even if none rise to the level of significant changes. So where does this leave CarPlay? It’s ended up in a holding pattern: It’s good enough for most of what it does, but with the potential of next-generation CarPlay waiting in the wings, it’s understandable that the current version isn’t really being pushed forward. I don’t think users really care about the next-gen stuff. Just focus on the basics. Improve the design of the existing screens. Actually show the full title of the song that’s playing. Show a history in Music. Make muting in Maps one-tap. Add basic features that are missing from the car versions of the built-in apps. Add more built-in apps, like Find My. None of this is blocked by the auto makers. Update (2024-10-31): One of the simplest and most useful potential improvements to CarPlay would be if I could actually use the Favorite Artists feature. This would save lots of drilling through menus and on-screen typing. After asking on Mastodon, the conclusion seems to be that Apple only lets you star artists as favorites if you subscribe to Apple Music. We still haven’t seen the “next generation of CarPlay” that Apple first announced in 2022 and continues to say on its CarPlay webpage is arriving in 2024, as MacRumors points out."
