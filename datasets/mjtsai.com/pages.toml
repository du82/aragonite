["https://mjtsai.com/blog/2017/10/27"]
title = "Michael Tsai - Blog - Archive - 2017 - October 27"
full_description = "While there are many programs available for capturing disk contents in general, Biskus APFS Capture is currently the only one that performs these operations on Apple’s new APFS file system format. After your free trial, you can get started with Panorama X for as little as fifteen dollars up front, and ongoing use is as little as $5/month. For months when you don’t use it, you pay nothing. There are no recurring payments — we don’t keep your credit card on file and you are in control at all times (all payments are made from within the application, under your control). So you essentially pre-pay for a certain number of months, and you aren’t billed for months with less than an hour of use, e.g. if you accidentally launch the app or just need to look up something quickly. It’s $8.33/month for one year, down to $5/month for five years. After the “subscription” expires, the app keeps working but switches to nag mode. All in all, this seems like a fair deal, although it’s considerably more complicated to implement than regular subscriptions or the traditional software model. Our goal is to make it easier for new users to come onboard with Panorama. In the past, the only way a new user could start using Panorama was by paying hundreds of dollars up front. Sure, we’ve always had a free trial, but for a full featured product like Panorama, it often takes more than 15-30 days to really fully understand how and if it will fit into your workflow. But with the old model, the user had to take on all the risk and put up a big chunk of cash up front. Understandably, a lot of potential users were reluctant to do that. We’d like to see lots of new users start using Panorama X, so we gave a lot of thought to how we could help users around this roadblock. In addition, I think subscriptions in general have gotten a bad name because quite a few companies have made a big price hike at the same time that they switched to the subscription model. In some cases the software now costs the same per year that it used to cost to purchase. We haven’t done that."
author = "Michael J. Tsai"
