["https://mjtsai.com/blog/2012/10/24/ibooks-author-and-latex"]
title = "Michael Tsai - Blog  -  iBooks Author and LaTeX"
full_description = 'LaTeX and MathML are supported by iBooks Author beginning with version 2.0. iBooks Author supports all LaTeX commands that can be converted to MathML with blahtex. Additional supported LaTeX extensions are listed below. This is a great improvement, and it would be nice to see this sort of support in Pages or in Cocoa itself. However, in my opinion equations rendered via MathML do not look as nice as those rendered by LaTeX itself. And, since this is not a full LaTeX processor, there does not seem to be a way to define custom commands. [...] Michael Tsai]New iBooks Author supports LaTeX and MathML originally appeared on TUAW - The Unofficial Apple [...] Rendering quality of Equation expressed in MathML depends a lot on the MathML "player" and there are big differences... In fact, many authors tweak there LaTeX expression of the formula to improve the rendering - which is fundamentally a wrong approach.'
