["https://mjtsai.com/blog/2024/11/22/the-app-store-era-must-end"]
title = "Michael Tsai - Blog  -  The App Store Era Must End"
full_description = "To a kid growing up in the 1980s, the idea that the maker of your computer would actively stop you from using software it didn’t approve of would have seemed beyond the pale. It certainly would’ve been a deal-breaker. And yet so many of today’s computing devices are locked down—for some good reasons, but also a lot of bad ones. What do we want the world to look like in the future? Is the destiny of the most important invention of the last half-century, the computer, to become a series of locked-down devices controlled by the giant companies that designed them? Should the iPhone be the model for all future devices? If Apple’s locked-down approach in the App Store era is our future, it’s a bleak one indeed. […] When we consider the future of computing devices, the Mac is the model we should aspire to, not the iPhone. But over time, the inevitable happened: Apple used the exclusivity of the App Store and its total control over the platform to extract money through rent-seeking and to bar businesses from admitting that the web existed outside their apps. Perhaps worst of all, the App Store’s exclusivity allowed Apple to essentially treat app developers as Apple employees, forcing them to follow Apple’s guidelines and please Apple’s approval apparatus before their apps would be allowed to be seen by the public. Whole classes of apps were banned entirely, some publicly, some silently. It’s not often I want to shout “Amen!” as I read an article, but here we are. I think I startled my sleeping dog. I worry the App Store model and the regulatory response has irreparably damaged Apple’s entire ethos. Not destroyed, but definitely damaged. Apple prides itself on making the entire widget: hardware, software, and services. No competitor has a similar model. It has gotten away with this through a combination of user trust, and not being nearly big enough for regulators to be concerned about. But the iPhone fundamentally upset both these qualities. There are certainly plenty of people who believe Apple should be able to do with the iPhone what it wishes, and that — thanks to the power of the free market — people who do not like those changes will simply go buy something else. Perhaps. But perhaps, too, Apple’s influence over a billion users worldwide is something worth checking on. If Apple had responded more amenably to concerns raised over the past decade, maybe it would not find itself in this position today — but here we are."
