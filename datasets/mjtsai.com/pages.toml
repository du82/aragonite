["https://mjtsai.com/blog/2006/03"]
title = "Michael Tsai - Blog - Archive - 2006 - March"
full_description = "I grew tired of Googling each time I needed the correct button sequence to put iPods into their various modes, so I’ve put together this little interactive display. Click on one of the three darkened buttons above to display the key presses necessary to put the iPod in the selected mode. Bill Bumgarner says the lawsuit was stupid but the feature is not. I see where he’s coming from, because even with closed headphones I’ve had to turn the volume way up on planes, but in this case I think the solution is noise cancellation, which apparently no longer needs to cost as much as your iPod. In a world full of bloated, grossly over-featurized software that still doesn’t do quite what you want, Blosxom is a spectacular counterexample. It’s a slim, compact piece of software that doesn’t do quite what you want—but because it is slim and compact, you can scratch your head over it for couple of minutes, take out the hammer and tongs, and get it adjusted the way you want. My main motivation for this is that stateless servers are far, far easier to write and the client-side code is going to have to know the state anyway. So why not push the state all the way out to the client. Or, as we used to say: push the processing to the edge of the network. But I’m sure that sort of phrase is ‘Web 2.0’-ish enough… The new version of my favorite FTP-and-more app consolidates lots of commands into a single New Connection window. The columns and Automator-style groupings seem both logical and efficient to me. And, if you want, you can restore the old pop-up menus by dragging them into the toolbar. I think the Play and Stop buttons in the toolbar look out of place, though. Now, I’m an engineer, and I’m all for getting products out in front of customers so they can use their machines to their fullest as soon as possible, but there is just no way putting out a Universal Binary of Photoshop CS2 would make any sort of sense. But the network domain is an awesome idea! So it looks like you get to be the network administrator. By setting it up correctly you gain a centralized share for all users of a LAN that benefits not only FastScripts, but any other application that correctly iterates the four domains for supporting files! For this reason, it’s worth knowing how to set up, and worth pressuring Apple to make the setup easier for everyday users. The remainder of this article details the steps you may take to both publish a shared “Library” folder from one computer and subscribe to it from any number of other computers on your LAN."
