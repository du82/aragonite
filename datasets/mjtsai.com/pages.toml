["https://mjtsai.com/blog/2024/03/20/dma-compliance-workshop-notarization-and-core-technology-fee"]
title = "Michael Tsai - Blog  -  DMA Compliance Workshop: Notarization and Core Technology Fee"
full_description = "Big day today as the [European] Commission kicks off its second round of DMA compliance workshops, this time focused on specific gatekeepers, their compliance reports, and the feedback of third-parties. Interesting detail: the EC told Apple that they aren’t allowed to notarize apps to protect users. So “government authorities are the ones that are going to have to step up to protect” app developers and users from the risks of these 3rd-party apps. On the difference between iPhone and Mac app distribution, Apple cites the unique differences: mobiles are always carried with us, have more sensitive data, and are a much more attractive target for harmful actors, the risk greater, as are the steps necessary to protect users. I’ve never really understood this argument because everything on iPhone is sandboxed, and the sensitive sources of information like the camera and GPS are protected by access prompts. - EC told Apple they can’t notarize alt apps 🤯 - $1M and 2M alt store rules are to prevent rip-and-run scams on users 👏 - Apple cites: distribution, discovery, promotion, and trust as reasons for their commission 🫤 - Apple cites 3 things alt stores will lack: Report a Problem, Family Sharing, and Ask to Buy. (Surprisingly weak, and notice how it doesn’t match the reasons for commission🤫) - Someone asks to force users to scroll to see all alt browser choices. 🤦‍♂️ - Apple is using some contract engineering resources for this 😳 They keep repeating this and I can’t get this argument when e.g. Facebook gets to be on the AppStore for free. Also valid for the Core Platform fee. The basic problem with the Core Technology Fee - aside from the fact that they shouldn’t be charging one at all - is that downloads are a terrible proxy for revenue, both in general and across different app categories / business models. We know from today’s workshop that (a) Apple has already gotten specific pushback from the EC on aspects of its DMA compliance plan; and (b) Apple continues to think the CTF is perfectly cromulent under the terms of the DMA. That to me says the CTF is going to fly."
