["https://mjtsai.com/blog/2003/05"]
title = "Michael Tsai - Blog - Archive - 2003 - May"
full_description = "Go Eric. The fact of the matter is that companies like Unsanity and St. Clair Software go the extra mile to make their patches work with both Carbon and Cocoa. If Stone doesn’t want to do that, it’s his choice, but he should stop spreading FUD. I always forget FrameMaker’s keyboard commands for changing capitalization. They’re not in the menus or in the online help index. You have to remember which help page to look on. So here they are, for my reference: Of course I’m biased, but I think blacklists are less reliable than content filters and fail less gracefully. Most content filters I’ve seen are free or cheap, so I don’t know why he says they’re costly. Apple has “enhanced” iTunes so that it can’t be used to play music from one computer on another if they’re on different subnets (i.e., if you have a computer at home that you stream to from work). This is an unfortunate consequence of the integration between the music store and the music player. Looks like an opportunity for a third-party developer without Apple’s conflicting interests. My sister got her first ever spam message today. Despite having an account at the same ISP as me, she’s never gotten any before. Amazing. Although I love linguistics, I’ve never conducted research in it beyond class projects. A few weeks ago I posted my term paper on periphrasis just for kicks. It was a fun project, and I had found the research challenging. There were a lot of papers with relevant information, but few that focused on the precise areas I was investigating. Googling for “periphrasis tsai” revealed that my paper hadn’t been indexed yet, but I came across an article (PDF) by Michel DeGraff (one of my favorite professors). It’s definitely worth reading if you’re interested in this sort of thing. DeGraff is a master at debunking. Verdana is my favorite Microsoft product. It’s not as nice as Geneva (except for headlines, where it’s better), but Mac OS X can draw it well. I’m now using it in Cocoa programs like Safari, NetNewsWire, and Path Finder that can’t draw Geneva right."
