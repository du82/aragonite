["https://mjtsai.com/blog/2019/05/20/the-state-of-apples-developer-documentation"]
title = "Michael Tsai - Blog  -  The State of Apple’s Developer Documentation"
full_description = "It appears that most of the old iOS conceptual documents have been moved to the documentation archive and are now unsupported. If this is the case every single iOS developer should be screaming from the rafters. It’s by far the stupidest move I’ve seen in a decade. It’s surprising how much of the documentation is marked as legacy, archived, not up-to-date, or was never written in the first place. At first I thought this was because of some sort of internal transition, but it’s been going on for years now and does not seem to be getting any better. As far as I can tell, this is the only documentation on IAP receipt validation. This is part of a current system that’s making Apple billions of dollars. There are errors in it, and it’s “no longer being updated”. Fun fact: when I was looking up docs for Help Books for my Appreciating AppKit post, one of the few Mac features already supported in Marzipan, it took ages to find as they’re only available in the documentation archive If you’re struggling to find an Apple developer document you know exists, it’s not just you. http://developer.apple.com’s robots.txt disallows /library/archive/, where all of the old docs now live. Apple’s own “Search Documentation Archive”…doesn’t search the archive. I remember the good old days when people were annoyed that you couldn’t figure out Cocoa bindings without the stuff mmalc posted on his personal website. That was nothing compared to when the doc browser turned into a lousy webpage instead of Cocoa views and Search Kit. I’m wondering how much has really disappeared. I used to point students there all the time for source code examples and now I find most any search for those comes up empty. Que? For what it’s worth, DuckDuckGo seems to be ignoring that robots.txt entry for /library/archive. I usually find what I’m looking for without much trouble: Died Apple just not document AppKit anymore? I can’t find anything about NSWindowTab. Is all information just in like WWDC videos?"
author = "Michael J. Tsai"
year_published = 2020
year_updated = 2020
