["https://mjtsai.com/blog/2009/08/28/quicktime-player-in-snow-leopard"]
title = "Michael Tsai - Blog  -  QuickTime Player in Snow Leopard"
full_description = '''Film playback is a bit weird as the new-style window will hide its title bar after a while. The idea sounds all nice, clean and efficient but I find all the additional appearing / disappearing animation triggered by it worse than the waste of space a persistent title bar would have caused. The playback controls now appear on top of the film and fade out as well (making the width of the controls the minimum width a film can be played back at). Unfortunately the controls and the ‘scrubber’ have a fixed width and don’t grow width-wise with the window to allow easier jumping inside films. Although the playback controls can be moved to a position of your choice in the movie, QuickTime Player immediately forgets about your preferred position for them and displays them in the standard position for the next film you open. As for the new QuickTime Player, I have numerous observations of behavior and gotchas. As much as Apple might have you believe that the new version folds in all the features that were available in QuickTime Pro, I most heartily assure you it’s only a half-baked effort. I wish I’d known about those keyboard shortcuts earlier. Perhaps this is a third-party opportunity for a basic QuickTime editor that isn’t iMovie. Moving the cursor out of the movie frame gets rid of the controls right away. Unless I'm mis-understanding what you want it to do. If you start the movie by tapping space or the Play key and the cursor is outside the window, you have to wait about two seconds for the controls to fade away, unless you move it into the movie (which triggers "the cursor moved over the window while it's playing") and then move it out of it again. In full screen mode, you *can't* move out of the window, and if you try by reflex, the controls will only stay up longer because they will only be able to fade once you stop moving the cursor around. Also, as far as I can tell, there is no way to hide the controls when the movie is paused or when you’re stepping through it.'''
