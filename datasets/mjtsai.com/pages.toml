["https://mjtsai.com/blog/2011/03/09/comparing-iphone-text-editors"]
title = "Michael Tsai - Blog  -  Comparing iPhone Text Editors"
full_description = "I’ve long been frustrated with the iPhone’s built-in Notes app. At first, it used Marker Felt and synced only via USB. Now it syncs via IMAP but sometimes duplicates or deletes my notes. On the Mac, the notes are stored as .emlx files with numeric names that change with each edit; this is not very backup-friendly. Apple Mail’s editor is slow and has an annoying yellow background. It wants you to write in rich text, which means that I have to remember to “Paste and Match Style.” Even so, somehow my notes inevitably switch into rich text mode, which means that the skeuomorphic lines on the iPhone no longer match the text height. Reading Dr. Drang’s iPhone notes app comparison got me interested in looking for alternatives. I definitely wanted a plain text editor that worked with Dropbox. This gives me full control over the backups, and it lets me edit and search the files using BBEdit, EagleFiler, and LaunchBar. An iPhone app is essential; an iPad version would be a nice extra. It was very important to me to be able to search across multiple files on the iPhone, pick a matching file, and then jump between the results within that file. Simplenote was the only app I found that could do this, so that’s what I’m using now. Other apps have some nice feature as well, however no one app comes close to offering all the features I’d like to have. I’ve summarized my investigation in this table: 1. Rather than syncing everything, it makes you choose individual files as “auto-saves,” which is a drag. 3. It does some sort of indexed/prefix search, coupled with auto-correct, which didn’t work well for me. Some words it didn’t find at all. When searching for “cat” it would find lots of useless matches of “at” but totally miss “wildcat”. 4. The option is there, but in my experience the modification dates shown, if I’m using Dropbox, have little relation to when I actually edited the files. The tech support person said this is not the normal behavior and is looking into the matter but has not yet found a solution for me. Even going by the displayed dates, the sorting is sometimes out of order. Also, the first few days, I experienced problems where the iPhone app would not pick up changes from Dropbox for hours or days; this seems to be fixed now."
author = "Michael J. Tsai"
year_published = 2011
