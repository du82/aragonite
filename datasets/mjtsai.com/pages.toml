full_description = "Notes aren’t on the list though. They have their own note-specific backup restore option, but it’s at the level of an individual note and there’s no version restore, only the ability to undo a delete for 30 days by restoring a Note from “recently deleted”. (BTW, if you Share a Note only the Owner can “delete” — but anyone with Edit privileges can remove all content — and since there’s no version undo that means anyone who can edit a Note can delete it without a recovery option.) You’d have better luck restoring a previous version of a random text file—either from the Versions database or Time Machine—than a note from the Notes app. Backup Contacts iCloud iOS iOS 10 Mac Mac OS X Versions macOS 10.12 Sierra Notes Reminders Time Machine"
