["https://mjtsai.com/blog/2020/07/29/tim-cooks-app-store-testimony"]
title = "Michael Tsai - Blog  -  Tim Cook’s App Store Testimony"
full_description = "Apple CEO Tim Cook is today participating in an antitrust hearing with the U.S. House Judiciary Antitrust Subcommittee alongside Alphabet/Google CEO Sundar Pichai, Amazon CEO Jeff Bezos, and Facebook CEO Mark Zuckerberg. Cook is expected to be grilled about Apple’s App Store policies in regard to app rejection and competition, disputes with the FBI over encryption and law enforcement access to locked devices, Apple’s relationship with China, and its App Store fees and subscription policies. Cook was initially reluctant to participate in the hearing because he does not believe Apple should be grouped with Facebook, Amazon, and Google as an antitrust violator, but he was not able to avoid testifying after a threat of a subpoena from subcommittee chairman David Cicilline, who publicly criticized Apple’s App Store fees. When the App Store was created, the prevailing distribution options available to software developers at the time did not work well. Brick-and-mortar stores charged high fees and had limited reach. Physical media like CDs had to be shipped and were hard to update. The App Store guidelines ensure a high-quality, reliable and secure user experience. They are transparent and applied equally to developers of all sizes and in all categories. For the vast majority of apps on the App Store, developers keep 100% of the money they make. The only apps that are subject to a commission are those where the developer acquires a customer on an Apple device and where the features or services would be experienced and consumed on an Apple device. I’m not sure what point this is trying to make. Are we supposed to be happy that Facebook pays nothing, while privacy-respecting apps that are exclusive to iOS pay 30%? Does it make sense that gym classes need to start paying Apple 30% because they now must be conducted remotely due to the pandemic? How does Apple giving the high-profile ClassPass a reprieve until the end of the year accord with the earlier statement about everyone being treated equally?"
author = "Michael J. Tsai"
