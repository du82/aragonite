["https://mjtsai.com/blog/2006/02/04/subversion-compilation-benchmarks"]
title = "Michael Tsai - Blog  -  Subversion Compilation Benchmarks"
full_description = '''Luis de la Rosa has compiled a list of how long it takes to compile Subversion on various Macs. My iMac Core Duo (2 GHz, 2 GB) took 1:57. My dual-progressor G5 (2 GHz, 2.5 GB) took 4:31 with no applications running, after it had been on for a day. When I restarted and timed it again it was, as expected, much faster: 2:46. Interesting. I didn't quite believe that daily reboots would help, but this is pretty good evidence. I'll ask that people give #s in the future by 1. quitting all apps, and 2. another set after rebooting. No. I didn't bother because I hadn't been using it very hard. (The G5 is still my main Mac.) But, for consistency, I just ran the compile after rebooting the iMac, and it took 1:56. The version of gcc also seems to matter. The above numbers are for gcc 3.3 on the G5 and gcc 4 on the iMac. When I changed to gcc 4 on the G5 and rebooted it took 3:05. I thought it was weird when you mentioned how long Python took to startup after a few days of uptime because I'd never seen that. I compared compiles on my Dual 1.8 G5, 2GB RAM. mark@eagle:/usr/local/src/subversion-1.3.0$ uptime 22:15 up 13 days, 9:40, 2 users, load averages: 0.39 2.67 2.21 mark@eagle:/usr/local/src/subversion-1.3.0$ time make -j8 . . real 3m29.461s user 3m45.418s sys 2m31.063s The 4 second difference doesn't seem like much, but is a bit curious. On a Linux box I did the same test and got: That was the second run. First run was about 0.6s slower. Not nearly as much of a difference between runs. The Linux box has been up for 122 days and is running several instances of Tomcat and Zope, so it's anything but "fresh". Coming to Mac from the UNIX world, I have to admit that I normally leave my G5 running all the time, only rebooting to apply security updates.'''
author = "Michael J. Tsai"
year_published = 2006
year_updated = 2018
