["https://mjtsai.com/blog/2016/03/23/adobe-jumps-the-shark"]
title = "Michael Tsai - Blog  -  Adobe Jumps the Shark"
full_description = "I have never had such miserable experiences with installers, updaters, subscriptions forced upon me, crashing applications, and overall lack of awesomeness. If Adobe is in decline, it’s Adobe’s own fault. You don’t have to sit back and be old and pointless. You have all seen Adobe Air update messages -- two a week for a while there -- without any idea of what Adobe Air is, or why you want it, or why it needs to be upgraded. But this is the one that sent me over the edge today, as I was concentrating on some work that I was doing. Up pops the most useless dialog box ever, to interrupt my concentration. You launch an updater to tell me that I don’t need to update? Really? Here’s a little secret: if people start to hate your products and your business practices, you won’t have recurring revenue for long. The recurring part is based on trust and value. At this point, you are losing both. I think it's true that people who have used PSD or Illustrator for the last 20+ years are, for the most part, never going to switch to anything else. For people who grew up on Pixelmator, Sketch, Affinity Designer, or similar apps written in the last decade, though, things are quite different. It's not just that the supporting stuff like installers are terrible, it's also that the applications themselves are not keeping up. If I go from Sketch to Illustrator, I feel like I just replaced my MacBook with a 90s PowerBook, the application lacks so many modern features, and feels so cumbersome to use. Like the awesome mouse support for canvas scrolling in Sketch which prevents you from using it if you don't have a trackpad or magic mouse? I was more thinking of basic stuff like showing you what exactly you're doing when you're dragging something, instead of showing outlines (of some stuff, but not everything), and waiting to redraw the document until you stop your action :-) Unnecessarily cumbersome? Yeah. Missing some ease-of-use features? Yeah. Casual users who've grown up with 'good enough' never migrating? Yeah."
