["https://mjtsai.com/blog/2020/01/21/apple-dropped-plans-for-end-to-end-encrypted-icloud-backups-after-fbi-objected"]
title = "Michael Tsai - Blog  -  Apple Dropped Plans for End-to-End Encrypted iCloud Backups After FBI Objected"
full_description = "In a 2018 interview, Cook’s comments to a German website heavily implied they are working on iCloud backups without a key (i.e. end-to-end encrypted). Our users have a key there, and we have one. We do this because some users lose or forget their key and then expect help from us to get their data back. It is difficult to estimate when we will change this practice. But I think that in the future it will be regulated like the devices. We will therefore no longer have a key for this in the future. Apple Inc dropped plans to let iPhone users fully encrypt backups of their devices in the company’s iCloud service after the FBI complained that the move would harm investigations, six sources familiar with the matter told Reuters. The tech giant’s reversal, about two years ago, has not previously been reported. It shows how much Apple has been willing to help U.S. law enforcement and intelligence agencies, despite taking a harder line in high-profile legal disputes with the government and casting itself as a defender of its customers’ information. As Apple explains, most iCloud data is not end-to-end encrypted. And, despite Apple’s marketing, iMessage has effectively never been end-to-end encrypted, either, unless all the parties in a conversation have turned off iCloud backup. I’ve been writing about this for years, but most reporting continues to ignore the backup loophole. In October 2018, Alphabet Inc’s Google announced a similar system to Apple’s dropped plan for secure backups. The maker of Android software, which runs on about three-quarters of the world’s mobile devices, said users could back up their data to its own cloud without trusting the company with the key. The company continues to offer the service but declined to comment on how many users have taken up the option. Notice as well that Apple didn’t just abandon plans to encrypt iCloud backups by default. They even abandoned giving users the option to encrypt those backups. And due to the walled garden nature of iOS, there’s nothing you can do about it."
author = "Michael J. Tsai"
