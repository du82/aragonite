["https://mjtsai.com/blog/2024/03/20/monopoly-go-hits-2b-in-10-months"]
title = "Michael Tsai - Blog  -  Monopoly Go Hits $2B in 10 Months"
full_description = "Scopely announced that Monopoly Go has generated $2 billion in revenue just 10 months after launch and three months after hitting $1 billion. The reimagined take on Hasbro’s iconic board game has garnered a massive player base, solidifying its place as a beloved, highly engaging title in the free-to-play market. Apple can pay the $500M class-action settlement over Tim Cook’s alleged defrauding of shareholders (by hiding iPhone demand issues in China) more or less with what they extracted from Scopely’s Monopoly Go in 10 months. The most profitable company in (but without making) games. With its $6 billion in IAP revenue, TikTok generated more than double the revenue from any other app or game in 2024. Monopoly GO, for example, came in at $2.6 billion over the past year, earning second place. The Monopoly GO mobile game making $2.6 billion a year from in-app purchases is nuts. This is likely more than the board game ever made in single year sales. Also wild that 30% of that goes straight to Google & Apple before taxes. For TikTok, that’s almost $2 billion in App Store fees. 😭 Okay, my experience with this game has been limited to being astounded by how many advertisements I've seen for it -- and how their advertisement opens in SlickDeals, kicking me to the App Store, without my ever clicking it. Well, and increasingly seeing that it's doing bonkers business. I'm sure people enjoy these free to play junk games, but I am not one of them. Full disclosure, have not played this particular game. But I owned Plants vs Zombies, the paid version, and it's better than the new free to play version, by far. I owned Oregon Trail back in the day, the paid one, and it was pretty solid, then they added all these pay to win aspects later, and the app went to crap as well. Among Us, I paid for, then it went free to play and the bugs were so bad for months after that, I don't even understand how it was still on the app stores… Finally it worked itself out and it was okay, but I haven't played it much in over a year so…"
