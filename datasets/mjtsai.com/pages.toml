["https://mjtsai.com/blog/2018/02/17/nowhere-else-to-go"]
title = "Michael Tsai - Blog  -  Nowhere Else to Go"
full_description = '''Marco Arment joins Zac and Andrew at the bar to talk about Ads vs Patreon, the end game for social networks, the trouble you get into for criticizing Apple, iPod as the new Vinyl, and the very sad state of affairs with newer MacBook keyboards. This is another solid episode. (The previous episode with Dan Masters about Twitter and privacy was also good.) The key point for me is that the Mac and iOS platforms are one-of-a-kind resources that Apple controls. They are it for the foreseeable future unless you want to use Windows or Android, which have their own share of problems. It’s like the dark ages that Steve Jobs spoke of in the mid-90s. The barriers to entry are so high now that there is unlikely to be a Be or NeXT or Palm that seems to come out of nowhere. Apple clearly feels a great responsibility as a steward of our planet. However, there are many governments, companies, and individuals who can also contribute to environmental causes. But in the case of these computing platforms, Apple is the lone steward. Making sure they are good—not just good enough—is something only Apple can do. Previously: The Best Laptop Ever Made, Unreliable MacBook Pro Keyboards, New MacBook Pros and the State of the Mac, The 12-inch MacBook, Finding an Alternative to Mac OS X. Apple Software Quality AppleCare iOS iOS 11 iPod iTunes Keyboard Mac MacBook MacBook Pro macOS 10.13 High Sierra Music Patreon "The key point for me is that the Mac and iOS platforms are one-of-a-kind resources that Apple controls. They are it for the foreseeable future unless you want to use Windows or Android, which have their own share of problems. It’s like the dark ages that Steve Jobs spoke of in the mid-90s. The barriers to entry are so high now that there is unlikely to be a Be or NeXT or Palm that seems to come out of nowhere." The lack of alternatives is the thing that makes a favorite product's slow degradation so goddamn frustrating. I can be unhappy with Apple as much as I want, and my only real viable actions are to lag behind on software updates and avoid buying new hardware to whatever degree is possible.'''
