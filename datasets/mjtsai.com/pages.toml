["https://mjtsai.com/blog/2002/11"]
title = "Michael Tsai - Blog - Archive - 2002 - November"
full_description = "Mostly, though, I think they’ve been conditioned by years of exposure to poorly designed file managers. If your file manager is irritating, you learn to stop managing your files. That the OS X Finder is good enough for some does not mean it is good enough for all. When newcomers to the Mac—no matter how experienced they are with other platforms—dismiss long-time Mac users’ criticism with a bit of “good enough for me” hand-waving, it belies their ignorance of what the Mac truly stands for. Let’s turn the tables and imagine that the GNU bash shell (favored by many Linux users) wasn’t able to run on Mac OS X. Bash advocates would, rightly, complain loudly. Now imagine if a long-time Mac user responded to their complaints by saying, I only use the Terminal to run “top” and to open hidden files once in a while, but I don’t see anything wrong with tcsh. You Linux switchers are just complaining because tcsh is a little different. What a great way of explaining it. Also included is this comment from Steven Frank, which matches my experience and reaction: A NEW STUDY shows that 11.7 percent of messages that were requested by an e-mail subscriber never reached the recipient’s inbox. Six percent were incorrectly routed to a junk mail folder, and 5.7 percent never arrived in any form. The problem is faulty spam filters put in place by major ISPs such as Earthlink, MSN, and AOL. In their attempts to reduce UBE (unsolicited bulk e-mail, or spam), these services appear to be whacking many messages people actually want. Daring Fireball has posted an excellent analysis of the OS X Finder. However, there are a few parts I have quibbles with. As a description of OS X, this is correct. It also explains why opinions on the OS X interface are so divided. However, I think it’s a mistake to blame every OS X interface disaster on “the NeXTies” and their design skills. Certainly, some aspects of OS X, like Columns view, came straight from NeXT; but attributing other elements, like the Dock, is not so easy. Further, many of the problems with OS X have to do with poor implementations rather than poor design. Columns view, taken by itself, is fine. That the Open/Save dialog implementation of it is so horribly broken is a separate issue, as are the facts that the spatial Finder views are slow and not spatial enough. The “blame it on NeXT” theory also cannot account for how bad the initial OS X rewrite of Project Builder was compared to NeXT’s own ProjectBuilder."
