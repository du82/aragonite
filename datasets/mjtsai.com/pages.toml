["https://mjtsai.com/blog/2013/08/27"]
title = "Michael Tsai - Blog - Archive - 2013 - August 27"
full_description = "I just watched a new Amazon Kindle app ad on TV. […] While the primary message is that there are Kindle apps on lots of mobile devices, the secondary message that can’t be missed is that it is easy to switch from iPhone to Android. The first step might be to say they must use our payment system for everything, including books (triggered by the newspapers and magazines). Which is exactly what they did. This exchange makes it sound as though Apple’s motivation was to limit users’ flexibility rather than making it easier for them to buy content (as some people had suggested at the time). However, I don’t see how this makes actually makes it more difficult to switch to Android. I guess that’s what iBooks is for. Kyle Sluder notes that if you hold down the Option and Shift keys, the Finder’s Edit menu changes Paste to “Paste Item Exactly.” I think this was added in Mac OS X 10.7. It prompts for an administrator password and preserves the original file’s ownership and permissions. Super User says that it does not preserve access control lists (ACLs), though. “We describe a method to bypass Dropbox’s two-factor authentication and hijack Dropbox accounts. Additionally, generic techniques to intercept SSL data using code injection techniques and monkey patching are presented.” Dhiru and Przemyslaw accomplished this by reverse engineering the Dropbox client. That may not seem like much, as reverse engineering is a common practice. What made their effort unique was figuring out how to reverse engineer the client even though it was an obfuscated application written in Python. Typographer Matthew Butterick, who helped design fonts for Apple, Microsoft, and others, has released an exceptional online book, called “Butterick’s Practical Typography,” that is a must-read for anyone who works with text. The book revolves around a few simple rules that will dramatically improve your understanding and implementation of typography."
author = "Michael J. Tsai"
