["https://mjtsai.com/blog/2012/03"]
title = "Michael Tsai - Blog - Archive - 2012 - March"
full_description = "With the recent release of Mountain Lion DP2 some problems cropped up with Fusion 4.1 (you’ll need a developer account to view that link.) Luckily the new VMware Fusion Technology Preview 2012 makes it possible to run the latest Mountain Lion release without any problems. This preview release also allows you to keep Fusion 4.1 installed if you encounter any problems in other virtual machines: the only requirement is that you can only run one version at a time. After several freezes, the technology preview worked for me. It seems strange that the VMs would be so hard to get working when not even using the VMware Tools. Right now developers selling through the Mac App Store face a lose/lose choice: either provide all major upgrades to existing customers for free (thus losing a quarter of our revenue), or create a “new” product for each major version (creating customer confusion) and charge existing customers full price again (creating customer anger). Update (2012-04-16): John Siracusa discusses this on Hypercritical #63. I found it interesting that in all the discussion of how one could lower prices and make it up in volume, no one mentioned the cost of providing ongoing technical support for those users. If you are not on a hockey stick growth curve, an increasing percentage of your customers will be non-paying, and yet they will still need just as much support. Ultimately, I decided to nix the pull-to-refresh idea and go with a straightforward button because I felt the whole thing was a bit too self-consciously clever and not discoverable enough (the above iteration of the design was actually an attempt to solve the discoverability problem, but I still never really warmed up to it). This, of course, seems silly now since we all know how well received the idea was, but it’s very easy to forget that at the time Loren and I were racing to build the perfect Twitter client, nobody really knew what an iOS Twitter client should look like. Simple ideas like this will naturally occur to many people. A small percentage of those will have the ability to execute on them. A small percentage of those will then actually do so. And an even smaller group will combine it with an otherwise interesting product, thus making it into something."
