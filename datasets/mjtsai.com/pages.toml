["https://mjtsai.com/blog/2013/08/27/purchasing-from-the-kindle-app/trackback"]
title = "Michael Tsai - Blog  -  Purchasing From the Kindle App"
full_description = '''I just watched a new Amazon Kindle app ad on TV. […] While the primary message is that there are Kindle apps on lots of mobile devices, the secondary message that can’t be missed is that it is easy to switch from iPhone to Android. The first step might be to say they must use our payment system for everything, including books (triggered by the newspapers and magazines). Which is exactly what they did. This exchange makes it sound as though Apple’s motivation was to limit users’ flexibility rather than making it easier for them to buy content (as some people had suggested at the time). However, I don’t see how this makes actually makes it more difficult to switch to Android. I guess that’s what iBooks is for. Semi-bad news. The judge is weakening the DOJ's suggested remedy in significant ways. No allowing Amazon to have a direct weblink in their iOS app, for one example. On the good side, however, she's keeping the 5 year anti-trust monitor on Apple's content agreement, not just in books, but in video and other media too. So, again, this is like one the early-mid '90's DOJ actions against Microsoft. Nothing big, but laying out a predicate to build a more serious case against any future dirty-dealing. I do my e-commerce with Amazon not out of spite, for for a significantly better customer-oriented experience... Maybe this is the best evidence we'll ever get that Steve was 100% about getting things done his way, instead of 100% about putting the customer first, even though they did coincide at times. Noted. I'm just so reflexively conditioned to receive comments from you accusing me of lacking appropriate Cuperino-fervor that I completely misread you here. "Maybe this is the best evidence we'll ever get that Steve was 100% about getting things done his way, instead of 100% about putting the customer first, even though they did coincide at times." One of the many, many sad things of the early death of Steve-o was not getting to see him repeat billgates' evasive videotaped DOJ deposition on the illegal emails he sent...'''
