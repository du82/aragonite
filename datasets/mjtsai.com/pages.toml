["https://mjtsai.com/blog/2004/04"]
title = "Michael Tsai - Blog - Archive - 2004 - April"
full_description = "Chris Klimas interviews longtime Mac game developer John Calhoun, who now works for Apple on Preview. CTM Development has released a public beta of PowerMail 5. SpamSieve and PowerMail have worked together since September 2002, but PowerMail 5 makes the integration much tighter. You no longer have to install AppleScripts to use SpamSieve with PowerMail, and (similar to Mailsmith) PowerMail provides options for what to do after training SpamSieve with a message: PowerMail 5 includes other improvements, which are being well received on the mailing list, but I’m not a heavy enough user of the product to judge, for example, how much faster it is than the previous version. One of the new features is very exciting to me, and I’d like to see it implemented by other Mac e-mail clients. (In fact, several years ago I sent it to Bare Bones and Apple as a feature request.) Most e-mail clients let you run AppleScripts as filter actions. This new feature lets you also run them as filter criteria (conditions, in PowerMail parlance): Aside from allowing very flexible boolean combinations of message properties, the script could also take into account what’s happening elsewhere on your Mac. What location is your Mac in? What’s your IM status? Is the sender in your customer database? I’m sure there are far more creative and useful possibilities than these. I only wish CTM had implemented this feature using an AppleScript handler: SpamSieve 2.1.3 is now available. The new version is easier to install, integrates with Eudora better, and (by request) now supports Outlook Express 5. As always, the change list is available. ‘show-message’ is a function that displays an HTML page with a message and an ‘Ok’ anchor. The ‘Ok’ anchor goes to an URL as described above: Accessing the registered function displays the first ‘Hello’ page. Clicking ‘Ok’ will then resume the function and display the second ‘World’ page. Clicking ‘Ok’ on that page exits the function."
