["https://mjtsai.com/blog/2014/01/24/30-years-of-mac"]
title = "Michael Tsai - Blog  -  30 Years of Mac"
full_description = "Thirty years ago, Apple introduced the Macintosh with the promise to put the creative power of technology in everyone’s hands. It launched a generation of innovators who continue to change the world. This 30‑year timeline celebrates some of those pioneers and the profound impact they’ve made. Thirty years ago today, Steve Jobs introduced Macintosh. It was the single most important product announcement of my life. When that upright beige box arrived in my home, it instilled in me an incredible sense of urgency. I greedily consumed every scrap of information about this amazing new machine, from books, magazines, audio cassettes, and any adult whose ear I could bend. This was the future—my future, if I could help it. Join us as we live the time-traveler’s dream—the deep, lucid, Orwellian vision of hope, fear, and nostalgia that is 1984. Just in time for its 30th anniversary, we laid hands on an ’84 original: the Macintosh 128K. And, you guessed it—we’re tearing it down like it’s the Berlin Wall. Of course, the success of the iPhone and iPad has also led to speculation that the Mac is on a collision course with iOS, one that will inevitably merge the two into one single Apple interface for all its devices. The appointment of Federighi as the leader of all of Apple’s software efforts could have been seen as a sign of that merger, but Federighi himself is adamant that the Mac will always be true to itself. “The reason OS X has a different interface than iOS isn’t because one came after the other or because this one’s old and this one’s new,” Federighi said. Instead, it’s because using a mouse and keyboard just isn’t the same as tapping with your finger. “This device,” Federighi said, pointing at a MacBook Air screen, “has been honed over 30 years to be optimal” for keyboards and mice. Schiller and Federighi both made clear that Apple believes that competitors who try to attach a touchscreen to a PC or a clamshell keyboard onto a tablet are barking up the wrong tree."
author = "Michael J. Tsai"
year_published = 2014
year_updated = 2018
