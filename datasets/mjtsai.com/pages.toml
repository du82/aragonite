["https://mjtsai.com/blog/2004/02"]
title = "Michael Tsai - Blog - Archive - 2004 - February"
full_description = "Schaut was there, and his article is a great read. I’m not sure what to make of his comments that Microsoft had to do focus groups to determine why people thought Word 6 wasn’t Mac-like, and that the answer was that it wasn’t Word 5. First, it should at least have been obvious that Word 6 didn’t look right. Second, in its day, Word 5 was criticized for doing things its own way, rather than the Mac way. I was a fan of Word 5, but I don’t think these criticisms were without merit. John Gruber had the bright idea of using a menu script to override Mailsmith’s Send Now command. Send Now has the same keyboard shortcut as Enter Search String in BBEdit, so if he has text selected in the message window, he probably meant to enter the search string rather than send the message. In this circumstance, Gruber’s script asks for confirmation that you want to send the message. Below is a modification of his script. My version sets the search string to the selected text and then doesn’t send the message. In other words, the script guesses the appropriate action and then does it. One problem is that if the message isn’t sendable (i.e. if no recipients have been entered), then the menu item will be disabled and the menu script can’t be used. Thomas didn’t report these problems to Apple, saying that would be a waste of time. In principle, I do think people should report bugs to Apple, but Thomas is right that with issues such as these it sometimes doesn’t seem worth it. It’s frustrating enough reporting what you think is a serious bug and having it languish in Radar purgatory for more than a year. For UI issues, it’s even more frustrating to list all the surface problems, knowing that the real problem is at the root. Thomas is right that the solution is for Apple to hire people who will make sure this stuff is fixed before it ships. Dominic Giampaolo’s out-of-print book about the Be file system, which I had considered buying used, is now available as a PDF (via Jonathan Rentzsch)."
