["http://mjtsai.com/blog/2016/02/07/mossberg-discovers-the-functional-high-ground"]
title = "Michael Tsai - Blog  -  Mossberg Discovers the Functional High Ground"
full_description = "Whether it’s the operating systems or the core apps, a major aspect of what makes both users and reviewers value Apple products is software that melds power, reliability, and ease of use. “It just works!” was a favorite Steve Jobs phrase. In the last couple of years, however, I’ve noticed a gradual degradation in the quality and reliability of Apple’s core apps, on both the mobile iOS operating system and its Mac OS X platform. It’s almost as if the tech giant has taken its eye off the ball when it comes to these core software products, while it pursues big new dreams, like smartwatches and cars. In response to my inquiries about this, Apple said: “We have dedicated software teams across multiple platforms. The effort is as strong there as it has ever been.” iTunes is once again bloated, complex, and sluggish. That has gotten even worse since the recent integration of the new Apple Music streaming service. In my experience, on both platforms, Mail is slow at both receiving and sending Gmail messages, whether they are from personal or business accounts. Some messages don’t show up. Search misses things. iCloud Photo Library, which stores all your images in the cloud, tarnishes the improved experience. It works quickly and accurately on my iPhone and iPads, but is slow and balky on the desktop. I am not one of those people with 50,000 or 100,000 pictures, but it still takes forever on the Mac to find older photos, and some show up as just blank thumbnails. That isn’t Apple quality. My Safari bookmarks only sync intermittently across my Apple devices. Unlike Amazon’s Kindle app for Apple products, the company’s iBooks doesn’t remember where I left off unless I set a bookmark. There are only three reasons I can think of that software issues like the ones we find in Apple Music would happen at a company like Apple that prides itself on software that “just works.” They are so big now, they just don’t care. They are Apple, so people will use the software regardless of what they do. (Please don’t let it be this one)"
