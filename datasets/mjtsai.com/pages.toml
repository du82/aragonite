["https://mjtsai.com/blog/2024/08/08/dma-compliance-initial-acquisition-and-store-services-fees"]
title = "Michael Tsai - Blog  -  DMA Compliance: Initial Acquisition and Store Services Fees"
full_description = "We’re introducing updated terms that will apply this fall for developers with apps in the European Union storefronts of the App Store that use the StoreKit External Purchase Link Entitlement. Developers can communicate and promote offers for purchases available at a destination of their choice. The destination can be an alternative app marketplace, another app, or a website, and it can be accessed outside the app or via a web view that appears in the app. Developers may design and execute within their apps the communication and promotion of offers. This includes providing information about prices of subscriptions or any other offer available both within or outside the app, and providing explanations or instructions about how to subscribe to offers outside the application. If your app communicates and promotes offers for end users at a distribution channel of your choice, pay an initial acquisition fee [5%] and an ongoing store services fee [20%]. Developers do not have to opt in to the new terms with the Core Technology Fee to take advantage of these link entitlement changes, but must agree to the StoreKit External Purchase Link Entitlement Addendum, which is coming this fall. These terms require developers to use the StoreKit External Purchase APIs, report external purchase transactions, and pay fees and commissions. There is one other notable change that Apple is making, and that's giving customers an option to turn off in-app disclosure sheets. By default, Apple will still warn users when they are clicking a link that takes them to non-Apple purchase methods and options, but customers can choose to turn off these warnings when an app links to an external channel. An app that links to an in-app web view will only need to display the disclosure sheet once per session. However, for instance, if the user downloaded the app on their iPhone, but then initiated the purchase later that by navigating to the service’s website independently on another device (including, say, a Windows PC or Android tablet), the Initial Acquisition Fee and the Store Services Fee would still apply. In that instance, Apple still wants its cut as it sees the download of the iOS app as the originating factor to the sales conversion."
author = "Michael J. Tsai"
