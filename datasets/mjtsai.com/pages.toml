["https://mjtsai.com/blog/2005/01"]
title = "Michael Tsai - Blog - Archive - 2005 - January"
full_description = "What good is Python’s complex type if you don’t need to solve problems involving imaginary numbers? Bob Ippolito shows how you can use it to represent vectors and solve linear equations. After posting photos of my apartment a couple weeks ago I got tons of people asking how I made my “Life Poster” seen in this photo. Here are my instructions to create one in about 20-30 min for about $29. Good Luck! Pages, instead of a “word processing” application, could more appropriately be called a “page layout” application. A very simplistic, very basic, very user-friendly page layout app. It depends on drag and drop, and the templates included make it a perfect program for doing something a Windows user would typically turn to Microsoft Publisher for. It sounds like a useful application to have available, but it won’t be going in my toolbox. I don’t create any one-off layout-heavy documents that AppleWorks or OmniGraffle can’t handle. For everything else, I need better editing (BBEdit) and better support for structure and exporting (FrameMaker+SGML, ReST, LaTeX). If I’m reading things right, people who bought iLife ’04 will have to pay $80 to get iLife ’05. There’s no upgrade option, and no way to purchase individual ’05 applications. I only really use iTunes and iPhoto, and I bought ’04 almost solely for the iPhoto speed improvements. I like some of the new features in iPhoto 5, but I’ll likely stick with version 4. As a developer, I like that Apple is no longer dumping the iApps on people for free, but I don’t like that everything’s all bundled together. I wonder if the average savvy Mac user upgrades his OS and buys the new iLife at each opportunity. Maybe he also stays current with Quicken. If he’s going to buy that software anyway, for just $220 more he could get a Mac mini, plus the other bundled software. Who knows, maybe next year iWork will be included with the Mac mini, making its included software worth even more. (Right now the mini includes AppleWorks, which most such users already have.) Put another way: for this particular user, the marginal cost of buying a Mac is less than that of buying an iPod mini."
