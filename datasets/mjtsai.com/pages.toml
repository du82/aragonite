["https://mjtsai.com/blog/2009/08/04/ninjawords"]
title = "Michael Tsai - Blog  -  Ninjawords"
full_description = "In other words, not only must the dictionary be censored — a dictionary — but even after being purged of “objectionable” words it would only be considered with a 17+ rating. Even after agreeing to these terms, it took another two weeks for Ninjawords to appear in the App Store. According to Crosby, “We gave in and said fine, hoping that we could get on the App Store immediately since the solution to their rejection was a simple metadata change. However, the App Store reviewer would have none of that. We would have to resubmit an entirely new binary and get to the back of the queue before they would look at it again.” Ninjawords seems to be a great app. Interestingly, if you search for a related word it will often offer links to the “objectionable” words, and the definitions for them are still there. I think it’s silly to censor a dictionary, but at least this rejection has some basis in the letter of the iPhone SDK Agreement. Matchstick Software initially submitted the app on May 13. The response from the App Store was that Apple wouldn’t publish it with those words without a 17+ parental control rating. But parental controls — the preferences that specify the age rating limits for apps — debuted in iPhone OS 3.0, which was not released until June 17. And, it’s worth noting, the June 17 release date wasn’t announced until the WWDC keynote address on June 8. Back in May, Matchstick Software knew only that OS 3.0 was coming in the near future. I believe Phil Schiller that Apple’s policy is not to reject App Store dictionaries for containing swear words. However, it’s clear this policy has not been consistently enforced by the App Store review team. The problem, as I see it, is not that one or more App Store reviewers were unaware that it is acceptable for dictionaries to contain words that are not acceptable in other contexts. Mistakes are inevitable. The problem is that there’s no good recourse for developers to appeal such a mistake. It should have been enough for Matchstick Software to point out that the words flagged as objectionable in their initial rejection are in fact present in several other dictionaries already in the store."
author = "Michael J. Tsai"
