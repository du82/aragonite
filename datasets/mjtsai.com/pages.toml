["https://mjtsai.com/blog/2020/08/10/funneling-into-apple-news"]
title = "Michael Tsai - Blog  -  Funneling Into Apple News+"
full_description = "I wonder how many publishers in Apple News+ realize that the new iOS14 and MacOS Big Sur are by default intercepting traffic to their sites and sending it to the Apple News app instead. This traffic interception has two interesting consequences: 1) Any strategic rationale that Apple News+ represents a separate channel/audience is now gone. This directly cannibalizes a publishers’ core subscription audience. 2) Apple has been touting privacy as its core attribute, particularly blocking cross-site tracking. In this case, not only is Apple engaging in cross-site tracking, but is doing so as a default opt-in buried in the settings. As a user I noticed it as I kept getting notices that Apple News had crashed, which is weird because I didn’t have it open. But it was intercepting links I was opening in background on browser. What a weird experience. Who wants to open another whole app to read a single article? Additionally, many links to external published article url’s change to apple news urls’s if go to open the article in Safari or to email a link. This is a cruddy user experience Even worse: since the beginning, they’ve been hijacking .rss links and shoveling you to News, then giving you a warning that the RSS feed is not part of Apple News. It’s insane. Apple looks to be giving its own ad network a leg up on competitors with customer data that other ad networks can’t access. In iOS 14, Apple Advertising appears to have a separate settings panel with a default-on setting. Other advertisers and ad networks on iOS, however, need to ask permission every single time. So I think we can say with confidence that Big Sur is checking an offline list of URL domains rather than checking online with Apple. Your privacy is still protected here. Except that if you view an article that is available in Apple News, that information is then sent to Apple. (Of course, by default, every Web page you view in Safari is sent to your iCloud account, anyway.) I’d love to see Apple News+ make it much easier to recover the original link to an article. I can get there by digging through the share panel, but it is certainly not obvious. And Google makes this just as difficult, often offering up a link to a link that takes you to Google’s servers."
