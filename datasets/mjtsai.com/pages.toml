["https://mjtsai.com/blog/2023/12/18/apple-watch-sales-paused-over-masimo-patent"]
title = "Michael Tsai - Blog  -  Apple Watch Sales Paused Over Masimo Patent"
full_description = "The Apple Watch Series 9 and Apple Watch Ultra 2 will no longer be available to purchase from Apple starting later this week. The move comes following an ITC ruling as part of a long-running patent dispute between Apple and medical technology company Masimo around the Apple Watch’s blood oxygen sensor technology. The dispute is the subject of a federal court lawsuit and the complaint filed with the ITC, which ruled in Masimo’s favor in October. That decision is subject to executive review by the Biden administration and could be vetoed, but time is running out, and vetos are historically rare. If I had to guess what’s going on here, I’d say it’s a high-stakes game of corporate chicken. Masimo got a ruling from the ITC that gave it leverage, so they asked for a big licensing deal. The Biden administration probably doesn’t want to deal with the dispute or look like it’s bailing out a big tech company, so I bet it told the parties to work things out, assuming Apple would pay up. Whether it ultimately will, only Apple knows, but it’s decided to force the Biden administration’s hand on the veto. If the ruling is vetoed, Apple’s existing court fight with Masimo continues, and the Series 9 and Ultra 2 go back on sale on December 26th. If not, the company still has the option to settle, which I have to imagine is preferable to pulling products from shelves for a potentially extended period of time. I wonder whether Apple would be allowed to keep selling the watches if it disabled the blood oxygen sensor in software? I’ve had little interest in the new watches since my Apple Watch SE has been working great and doing everything that I need it to do. However, this week I’ve noticed the battery not lasting as long, and the Battery Health is down to 80%, despite it being less than 2 years old. I don’t usually buy AppleCare+, but perhaps that would have been a good idea at $2.49/month given that Apple charges $99 for a battery replacement. It is deeply weird that Apple issued an anonymous statement to a niche publication announcing it will soon stop selling a flagship product, which is usually the kind of thing it would want to tell the Wall Street Journal or CNBC."
