["https://mjtsai.com/blog/2005/02"]
title = "Michael Tsai - Blog - Archive - 2005 - February"
full_description = "The “it just works” factor has been one of the hallmarks of the Mac user experience since day one; using an iPod Shuffle as a disk drive forces you to be aware of arcane and bizarre file naming restrictions, and thus is utterly un-Mac-like. I’m not pointing this out to claim it’s cause for alarm, that the sky is falling, or that the iPod Shuffle “sucks”. I’m just saying it’s a little sad when Apple Computer, of all companies, tells us that punctuation such as ‘=’ and ‘;’ are “special characters”. I’m honored that John Gruber’s list of Apps of the Year, 2004 includes SpamSieve. Gruber does a good job of explaining the utility of SpamSieve’s scores feature, which makes it easier and quicker for you to scan your spam for false positives by telling you how spammy it thinks each message is. Most people, I suspect, don’t use scores because they don’t get that much mail, but if you do get a lot, they’re quite helpful. SpamSieve’s scores have a different meaning than scores from other anti-spam software. In the traditional approach, each message is assigned a score (say, from 0 to 100). The user can then set a threshold saying, for instance, that messages with scores 90 or higher are spam; those with scores less than 90 are good. Adjusting the threshold lets you adjust the aggressiveness of the filter, and by looking for messages with scores near the threshold, you can tell which ones the filter was uncertain about. For a variety of practical and philosophical reasons, SpamSieve works differently. If it thinks that a message is good, it assigns it a score from 0 to 49; if it thinks it’s spam, it assigns it a score from 50 to 100. Thus, looking at a score, you can tell (a) whether the message was classified as spam, and (b) how sure SpamSieve was, without needing to know the current threshold. It’s always 50. You have two controls: E-mail clients show scores in different ways. Eudora and PowerMail show the score in its own column in the message list. In Mailsmith, you can use a script to label messages according to their scores; you can set the uncertain threshold in the script. In Apple Mail, SpamSieve uses colors to show the score. In Entourage, very spammy messages are assigned the “Junk” category, and less spammy messages are assigned the “Uncertain Junk” category; you can set the threshold in the Notification tab of the preferences."
author = "Michael J. Tsai"
year_published = 2025
clearnet = "https://mjtsai.com/blog/2005/02"
