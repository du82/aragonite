["https://mjtsai.com/blog/2018/02/17"]
title = "Michael Tsai - Blog - Archive - 2018 - February 17"
full_description = "Since day one it’s been plagued by bugs in the underlying Contacts frameworks and almost none of them have been fixed by Apple in the intervening years. It works great for most people, but for the ones with contact data that does not get along with the Contact framework, it fails in annoying ways. There are likely still places I could improve their experience in Interact, but I’ve burned too much time and effort on those edge cases for it to make sense to keep it going. Marco Arment joins Zac and Andrew at the bar to talk about Ads vs Patreon, the end game for social networks, the trouble you get into for criticizing Apple, iPod as the new Vinyl, and the very sad state of affairs with newer MacBook keyboards. This is another solid episode. (The previous episode with Dan Masters about Twitter and privacy was also good.) The key point for me is that the Mac and iOS platforms are one-of-a-kind resources that Apple controls. They are it for the foreseeable future unless you want to use Windows or Android, which have their own share of problems. It’s like the dark ages that Steve Jobs spoke of in the mid-90s. The barriers to entry are so high now that there is unlikely to be a Be or NeXT or Palm that seems to come out of nowhere. Apple clearly feels a great responsibility as a steward of our planet. However, there are many governments, companies, and individuals who can also contribute to environmental causes. But in the case of these computing platforms, Apple is the lone steward. Making sure they are good—not just good enough—is something only Apple can do. Previously: The Best Laptop Ever Made, Unreliable MacBook Pro Keyboards, New MacBook Pros and the State of the Mac, The 12-inch MacBook, Finding an Alternative to Mac OS X. Apple Software Quality AppleCare iOS iOS 11 iPod iTunes Keyboard Mac MacBook MacBook Pro macOS 10.13 High Sierra Music Patreon We’re focusing our efforts on a great Twitter experience that’s consistent across platforms. So, starting today the Twitter for Mac app will no longer be available for download, and in 30 days will no longer be supported."
