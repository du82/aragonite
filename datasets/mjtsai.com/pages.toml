["https://mjtsai.com/blog/2004/09"]
title = "Michael Tsai - Blog - Archive - 2004 - September"
full_description = "Benjamin Pierce collects the best papers about programming languages, as reported by members of his excellent Types mailing list (via Lambda) An old ArsTechnica thread shows how to make persistent links into Apple’s URL-hostile, WebObjects-powered store (via e-mail from Eric Blair). I’ve been using the NetNewsWire beta for a few days now, and I think it’s excellent. It’s interesting how NetNewsWire 2 and PulpFiction both persist old posts, but they store the data in completely different ways. MarsEdit, the new external blog editor, seems well done but doesn’t really excite me. For whatever reason, I’m happy just entering my posts using BBEdit and Safari. Carsten Blüm’s free BBClick is a handy utility that lets you pull down BBEdit’s function pop-up or marker pop-up using the keyboard. (It does this by simulating a mouse click.) Once the menu is activated, you can navigate it using the arrow keys or by typing the first few letters of the function or marker name. BBAutoComplete 1.3 adds support for Affrus, improves support for BBEdit 8, and has more modern packaging and documentation. SpamSieve 2.2.1 includes an assortment of fixes and supports notification in its DragThing dock tile. Trac was inspired by CVSTrac, and is similar to it in many ways, but there are also differences. CVSTrac tickets have Description and Remarks fields. When you edit one of these, the new version of the field replaces the old version, and CVSTrac saves the old version and displays it below. Trac has a single Description field, and you cannot edit it, only append new comments. Generally, this means you must read through more of the ticket history to figure out what needs to be done before the ticket can be closed. Some of the other fields don’t line up, either, but it was easy enough to use the sqlite tool to attach both databases and migrate all the ticket data that I cared about. Installing Trac, while not difficult, is a pain. You have to build and install multiple Python packages and edit Apache’s config file to feed Trac some paths that it needs. Users and permissions are handled using an .htaccess file, which is fine, but for some reason I have to re-enter my login information between sessions. Support for multiple projects isn’t built-in, but requires more Apache rewrite rules. Likewise, where CVSTrac has a series of Setup pages in the browser, configuring similar options in Trac entails using the trac-admin command-line tool."
