["https://mjtsai.com/blog/2016/02"]
title = "Michael Tsai - Blog - Archive - 2016 - February"
full_description = "I don’t see a follow button on iTunes artist pages. Maybe this is an Apple Music thing, and I can’t get to it because I don’t subscribe. On the Connect tab I might expect to see some kind of discovery mechanism, but no. Maybe I’m missing something. As a fan I don’t feel “connected” to anything. I feel sad. Even a post from Weezer only got 13 comments, and they all looked like this […] This experience is probably rare. Most artists will likely not lose all of their followers and data. But it only happened because of the cascade of design failures we encountered while attempting to do something any 1.0 service should offer. Every service in the world allows you to change your profile photo. Every service in the world shows you how many followers you have and gives you ways to contact them. These aren’t optional features, even for something brand new. Seven months later—from a company the size of Apple—this isn’t just unacceptable, it’s pathetic. It’s also not a very good broadcast medium. Sure, I can post to Connect and share out to Twitter and whatnot, but why? There’s nothing unique or powerful about Apple’s system that makes it a good hub. Because I have no idea how many followers we have, I can’t even make a numerical argument for Connect-first posting. And since we can’t even invite people from other places to follow us on Connect, there’s no incentive to try. Although 97% of Android phones have encryption as an option, less than 35% of them actually got prompted to turn it on when they first activated the phone. Even then, not everybody chooses that extra layer of security. A Google spokesman said that encryption is now required for all “high-performing devices” — like the Galaxy S7 — running the latest version of Android, Marshmallow. But only 1.2% of Android phones even have that version, according to Google. By comparison, most Apple products are uniformly secure: 94% of iPhones run iOS 8 or 9, which encrypt all data."
