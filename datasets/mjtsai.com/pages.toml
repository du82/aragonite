["https://mjtsai.com/blog/2005/05"]
title = "Michael Tsai - Blog - Archive - 2005 - May"
full_description = "Michael McCracken discusses hypertext links as native UI elements and the proliferation of similar-but-different controls, which he calls platform smear. I think both links and mouseover effects should be confined to the Web (and hypertext editors such as VoodooPad). Platform smear is unavoidable, but its extent could be reduced. My suggestion would be for Apple to experiment with new interface ideas less publicly. I think that the concept is old and developed enough now that a company like Apple should come up with some clear guidelines on how these lists should be used and how they should behave. Unfortunately that is not the case and even within Apple’s stock of applications you won’t find two in which the source lists behave the same. So it’s really hard to learn what you can expect a source list to do. What does sending a message to nil do in Objective-C? What value does it return? You probably know that if the method is declared to return an object, you get back nil, but what if the method is declared to return a char? An int? A long long? A float? A struct? And how does it all work? Remember back to the public beta, and 10.1 and 10.2. Lots of stripes. Remember before the Finder used brushed metal? Remember how even title bars had stripes—and how the stripes everywhere were very pronounced? The reduction of the stripes and gratuitous transparency are, to me, among the most important changes that Apple has made to the OS. As with some of the other OS X improvements between the public beta and 10.4, celebrating this is kind of like thanking the bully for not beating you up anymore. It doesn’t really make sense, but you’re so happy that the bruises are healing. Although I remember some vague claims years ago that the stripes made Aqua easier to use, I never believed them, and I think a true study would find the opposite. I know that OS X doesn’t tire my eyes out the way it used to. But, at one time, Aqua was the stripes, and we were told things like this:"
