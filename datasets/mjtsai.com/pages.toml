["https://mjtsai.com/blog/2018/01/08/computer-latency-1977-2017"]
title = "Michael Tsai - Blog  -  Computer Latency: 1977-2017"
full_description = "These are tests of the latency between a keypress and the display of a character in a terminal (see appendix for more details). Compared to a modern computer that’s not the latest ipad pro, the apple 2 has significant advantages on both the input and the output, and it also has an advantage between the input and the output for all but the most carefully written code since the apple 2 doesn’t have to deal with context switches, buffers involved in handoffs between different processes, etc. On the input, if we look at modern keyboards, it’s common to see them scan their inputs at 100 Hz to 200 Hz (e.g., the ergodox claims to scan at 167 Hz). By comparison, the apple 2e effectively scans at 556 Hz."
