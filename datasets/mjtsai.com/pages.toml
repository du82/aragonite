["https://mjtsai.com/blog/2016/12"]
title = "Michael Tsai - Blog - Archive - 2016 - December"
full_description = "There’s an argument that we’re still in the very early stages of voice-driven personal computing. That, for example, Apple is not too late in putting out an Echo-like dedicated appliance. But Amazon is running full steam ahead here. 5,000 hotel rooms here, 5,000 hotel rooms there, and all of a sudden Echo is the entrenched market leader. Police in Bentonville, Ark., asked Amazon for audio and other records from an Echo digital assistant in the home of James Andrew Bates after Victor Collins was found dead in Bates’ hot tub last year, The Information reported Tuesday. Amazon refused both times. In a statement to USA TODAY, Amazon said will not release customer information without a valid and binding legal demand properly served on it. It’s important to note that “always listening” doesn’t mean “always recording.” The Echo is actually only always listening for its “wake word,” which by default is the name of its voice recognition program Alexa. The Echo only keeps fewer than 60 seconds of recorded sound in its storage buffer. As new sound is recorded, the old is erased. So there’s no audio record made of what went on in a room where an Echo sits. Paul Haddad notes that Apple’s Thunderbolt to Ethernet adapter is slightly faster than Belkin’s USB-C to Ethernet adapter and uses much less CPU. Unfortunately, the former must be chained with the Thunderbolt 3 to Thunderbolt 2 adapter. I wonder how the various docking stations compare. Unscientific quick test of 4 USB-C-to-Ethernet adapters. Top is connected to MacBook Pro directly, bottom though LG 5K, all in Mbps. If you’re willing to make precisely zero edits to the address labels that are created from the Contacts app, it’s actually quite easy to print labels. […] For me, I wanted to address couples as, say, “Stephen and Merri Hackett”, even if my contact card had only Stephen’s name in it. This got very complex very quickly, but I was able to figure it out. He exports to CSV, edits the file in Numbers, and uploads it to the Avery Web site to get it formatted (I guess as a PDF)."
