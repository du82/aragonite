["https://mjtsai.com/blog/2024/11/01/apple-acquires-pixelmator"]
title = "Michael Tsai - Blog  -  Apple Acquires Pixelmator"
full_description = "Pixelmator has signed an agreement to be acquired by Apple, subject to regulatory approval. There will be no material changes to the Pixelmator Pro, Pixelmator for iOS, and Photomator apps at this time. Stay tuned for exciting updates to come. Based in Vilnius, Lithuania, Pixelmator has developed a suite of well-regarded creative tools that compete with Adobe’s offerings while maintaining a focus on ease of use and performance. The company’s apps have been exclusively available on Apple’s platforms, including Mac, iPad, and iPhone. Financial terms of the acquisition were not disclosed. The deal marks Apple’s latest investment in professional creative tools, following previous acquisitions in the space such as Logic Pro and Final Cut Pro. My initial assumption is that this is an acqui-hire. It doesn’t seem like their stuff really fits into Photos.app. But I suppose it’s possible that Apple wants to add a new iWork/Pro app. I don’t know what this means for the future of Apple’s apps—though I hope it means Photos is going to get a serious infusion of new talent and functionality! If you’re a Pixelmator Pro or Photomator user, this has to be a bit of a bummer, but there’s some good news: It will probably take a few years for Apple to fully integrate the team into whatever is happening next, and the existing apps will probably still be around until then. Pixelmator and Photomator already look like Apple’s own “pro” apps. From the get-go, the Pixelmator team hasn’t just followed Apple’s own trends and guidelines for UI design, they’ve helped define those trends. Does Apple want to fold these advanced features into Photos? Or do they once again see the need for separate consumer/professional first-party apps? Logic, for example, was an acquisition — but that was all the way back in 2002. If Apple keeps Photomator as an actively developed product, it would be a return to the same genre they walked away from when they discontinued Aperture in 2014. And if Apple keeps Pixelmator going, it would be the first time they go head-to-head against Photoshop itself."
