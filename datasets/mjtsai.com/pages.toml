["https://mjtsai.com/blog/2017/04/07/clips-1-0"]
title = "Michael Tsai - Blog  -  Clips 1.0"
full_description = "Clips is a new app for making fun videos to share with friends, family, and the world. With a few taps you can create and send a video message or tell a quick story with animated text, graphics and emoji, music, and more. Got to play with Clips yesterday. Love it. It’s like iMovie and Keynote had a baby and the kid got all the best genes. It’s not that the app isn’t good at making short, fun videos; in fact, it’s great at doing that. But it seems like it’s trying to shoehorn an Instagram or Snapchat style of app into Apple’s typical UI conventions. As Ulanoff says, it seems less like a competitor to those apps than it does a trimmed-down version of iMovie. Maybe the market for something like that is large, but I’m not sold on it yet. It’s a small thing, but the icon is also disappointing. It’s supposed to be a fun, creative, silly app, so why does the icon make it look like it will be for corporate videoconferencing? I haven’t spent too much time using the application, but I’m very impressed with what I’ve seen so far. Apple’s Clips is great. One of the best iOS apps they’ve made in years. It’s a useful quick video editor even if you ignore the fun effects. Renie Ritchie apparently wrote a treatise on Apple’s new Clips app, but don’t let that intimidate you. Clips is ridiculously easy to use, and most of its features are discoverable by just playing with it. The real brilliance of Clips is that you don’t even feel like you’re doing movie editing, but that’s exactly what you’re doing. Omg I heard that this version of Clips has a little microphone thing! (Which is mute audio) and you could see that you can record the same way as the new version. Also, on the previous version, you could hold to record, (it says so on the record button) and when I had this version on my other iPad, I had so much fun with it! Oh jeez! 😅😅😅😅. Also can anybody give me information on how to download Clips 1.0? If so, I could mess around with it more! And as always, I NEED this version of clips! I want it so so bad! Uggh! Omg!! 😫😫😫😫 #BringBackClips1.0SoICanMessAround Thanks! 😘😘😘😘 (Clips 2.0.5 is still cool, but I still want this version.) 🤤🤤🤤🤤"
