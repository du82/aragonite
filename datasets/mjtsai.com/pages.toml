["https://mjtsai.com/blog/2023/10/26/apple-services-price-hikes"]
title = "Michael Tsai - Blog  -  Apple Services Price Hikes"
full_description = "In the U.S., these are the first-ever price increases for Apple Arcade and Apple News+ since the services launched in November 2019, while Apple TV+ had its first price increase from $4.99 per month to $6.99 per month in October 2022. This increase really shouldn’t come as a surprise: Disney+, Hulu, Netflix—almost every major streaming service has raised their prices over the last year. In some cases, this is to compensate for lost revenue from customers canceling cable packages where older more conventional networks and studios used to bring in money for selling their shows. This is the second price hike for Apple TV+, which debuted at a $4.99 monthly price (free for several months in many cases)—with a rather paltry library of content—before subsequently rising to $6.99 a year ago. Apple’s built up its TV+ content substantially since launch, and the company seems to be making the argument that all of that new material is worth more money. I do have to raise an eyebrow at the increased costs for both Apple Arcade and Apple News+. Neither of these services seem to have been blockbuster hits for the company, and perhaps Apple’s decided it’s not just going to make it up in volume. Subscription pricing requires a form of calculus to find the sweet spot that generates the most money. Set the price too low and you’ll reduce piracy but leave money on the table. Set the price too high and you’ll generate less money because more users — ones who might otherwise have subscribed at a lower price — will choose to bootleg. (Some people, of course, will always choose to bootleg. There’s no point trying to find a price to appease them.) But pricing isn’t the only factor in this equation. The experience is too. Bootlegging’s obvious appeal is the price: zero. But it’s always been a bit of a pain in the ass. Weird apps and sketchy sources. Steve Jobs emphasized this aspect of the iTunes Music Store when he introduced it: 99 cents was an appealing price, but not as appealing as free. But the overall experience of searching for and downloading music from iTunes was so much better than bootlegging that it made you happy to pay for the songs."
