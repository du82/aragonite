["https://mjtsai.com/blog/2019/09/27/ios-13-autocorrect-is-drunk"]
title = "Michael Tsai - Blog  -  iOS 13 Autocorrect Is Drunk"
full_description = "One thing I and others have noticed is that when you type a dictionary word correctly — meaning you hit the exact right keys on the on-screen keyboard — iOS 13 autocorrect will replace it with a different dictionary word that makes no contextual sense. Even beyond dictionary words, I’m seeing really strange corrections. It is so bad. I could rely on iOS 12 to propose the right words and correct typos. iOS 13 feels like I have to re-teach the AI. Also umlauts in German are a mess. It never propose the right word. iOS 11 is when they switched to a “machine learning” based autocorrect engine, which is the cause of all this. That’s why after switching from my iPhone 5 with iOS 10 to the new iPhone 8 with iOS 12, my initial impressions were that autocorrect was simply worse and felt ‘untrained’. I didn’t realise that what messed things up was the keyboard switching while writing a word. But even within a single language, autocorrect under iOS 12 does indeed feel less smart than under iOS 10. I can confirm this has been going on for the better part of a year now (fwiw, I use the classic autocorrect bubbles rather than the quicktype bar). The annoying part is that it will often change the word well after it's been typed. You are not alone - I’ve seen similar behaviour for the better part of the year at least on my iPad (working with French and Spanish mostly). What is worse, from my POV is that autocorrect seems obsessed into thinking I want to type in English (correcting French words to something that might be the equivalent English one). I run the OS in English for a number of reasons. One thing that I've noticed and haven't seen before (and don't know if it's related) --- if my wife types an iMessage to me in Japanese, the suggestion bar will show me Japanese replies even when I'm using the standard US English keyboard (I do also have the Japanese kana keyboard installed... not sure if this is a factor). This seems to be new. The bug that annoys me most – and this one is likely specific to Australian English – is that place names routinely get turned into all caps. For example, “Willoughby” turns into “WILLOUGHBY.” It’s like they’ve downloaded a list of Australian postcode place names that are supposed to be all caps on physical envelopes. Lazy. Still present in v13. (Same laziness with Siri and Australian place names. You can buy phonetic dictionaries of Australian place names, FFS. Cf. “Woolloomooloo”)"
