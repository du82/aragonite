["https://mjtsai.com/blog/2005/03"]
title = "Michael Tsai - Blog - Archive - 2005 - March"
full_description = "If you want to attract hackers to write software that will sell your hardware, you have to make it something that they themselves use. It’s not enough to make it “open.” It has to be open and good. And open and good is what Macs are again, finally. The intervening years have created a situation that is, as far as I know, without precedent: Apple is popular at the low end and the high end, but not in the middle. My seventy year old mother has a Mac laptop. My friends with PhDs in computer science have Mac laptops. [2] And yet Apple’s overall market share is still small. I subscribe to Apple’s .Mac service. I do so for exactly one feature: the .Mac screensaver. This feature works thusly: I designate an album in iPhoto, hit “.Mac slides”, upload the photos, go to my screensaver in Mac OS X, designate my .Mac member ID, and voila, screensaver of the photos with complete Ken Burns Effect. Anybody with Mac OS X can subscribe to this screensaver if they know my member ID. Like the Grandmas. If you write a program to do this, I will pay you $100 (what .Mac cost me this past year) to be able to use it. Make it freeware, make it shareware, make it open source, I don’t care. Just give me a working copy and I will send you $100. BBEdit 8.1 adds support for Subversion and the bbedit tool lets you control where the files are opened, amongst lots of other changes. If you could push a feature request, or perhaps a bug on your wish-list to the top of Apples’ radar for OS X, what would it be? Mark Jason Dominus’s Higher Order Perl, soon to be available on his Web site, looks like an interesting book, even for people who don’t program in Perl. Damian Conway, author of the OOP book that includes my favorite explanations of non-OOP Perl, loves it. Google has open-sourced some of its libraries. The initial Python bits aren’t very interesting—people who like the functional style will already have their own similar code—and seems to be geared towards older versions of Python."
