["https://mjtsai.com/blog/2024/10/31/ios-apple-intelligence-in-eu-in-april-2025"]
title = "Michael Tsai - Blog  -  iOS Apple Intelligence in EU in April 2025"
full_description = "Remember when Apple blamed EU tech rules — and more specifically the Digital Markets Act — to justify the fact that Apple Intelligence wouldn’t be available in the European Union? Maybe that was just an attempt to turn EU users against their regulators as Apple Intelligence is coming to the EU in April 2025 along with local language support. While Apple Intelligence is technically out of beta, you have to set your iPhone or Mac to U.S. English. On the iPhone, Apple also checks if your Apple account is associated with a European address. If that’s the case, you can’t enable Apple Intelligence on your iPhone at all, even if you set your iPhone to U.S. English. On the Mac, it’s a different story, as European users can try out Apple Intelligence features starting Monday. I don’t think this is quite accurate: Apple Intelligence no longer requires a beta version of the OS, but the feature itself is still marked as in beta. So in the end, Europeans only need to wait five extra months for Apple’s new AI features, while presumably getting a better and safer experience due to compliance with EU laws on privacy and fair competition. So much for all the hysteria about Europe being “left behind”. So far I have not heard any specifics about what will be “better and safer.” It just seems like a combination of Apple not being ready with other languages and not having had the time to report to EU regulators what it’s doing. This is also incorrect: “On the iPhone, Apple also checks if your Apple account is associated with a European address.” I have a European address on my iPhone (along with my german credit cards). I happen to be in the US and can use Apple Intelligence just fine – with the device set to US English and all that. All we know right now is that Apple’s E.U. rollout of Apple Intelligence coincides with the availability of a bunch of European languages. The April language pack notably also adds support for two other English languages — Indian and Singaporean — plus Chinese, Japanese, Korean, and Vietnamese. No word on availability in China, but Tim Cook is working on it."
