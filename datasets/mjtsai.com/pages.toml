["https://mjtsai.com/blog/2004/12"]
title = "Michael Tsai - Blog - Archive - 2004 - December"
full_description = "I’d always wondered why the book was titled that, because I’d just assumed that it would be Macintosh Folklore, and the final title always makes me think of Mike Swaine’s book. In a sequel to last-year’s article, Electronic Gaming Monthly interviews today’s kids about classic video games (via Linked List): I’m trying to clean up some URLs using mod_rewrite. I have .shtml files on the server, but I want browsers to be able to access them without the file extension. And if the browser does send a URL with .shtml, it should be redirected to the URL without the file extension. I have this much working, and here are the contents of the .htaccess file: As far as I know, #bar stays in the browser; it isn’t sent to the server. So I don’t think there’s any way to preserve it using the rewrite rules. Is there any way to get the browser to tack on the #bar after it gets the 301 from the server? The new iCab beta (registered users only) supports “CSS 2.0/2.1 probably more complete than most other browsers,” and it works on systems all the way back to Mac OS 8.5 (the first version to include ATSUI). The CSS support does seem to be much improved, but it was not evident to me how it’s better than in Internet Explorer 5 or Safari, and there are some areas where it’s clearly worse. Update: I have now seen some pages that iCab renders better than IE 5. One area where iCab was noticeably worse, the failure to honor text-decoration: none, can be adjusted in the preferences. We finished in January 1994. Graphing Calculator has been part of the Macintosh ever since. Teachers around the world use it as an animated blackboard to illustrate abstract concepts visually. It shipped on more than twenty million machines. It never officially existed. It looks like a great list of products. Personally, I like the Kensington StudioBoard better than the Matias Tactile Pro, and I like the EZQuest Boa better than the LaCie d2. The LaCie is more compact, but it’s slower, more expensive, and doesn’t work with Retrospect."
