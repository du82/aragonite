["http://mjtsai.com/blog/2016/02/29/most-android-phones-are-not-encrypted"]
title = "Michael Tsai - Blog  -  Most Android Phones Are Not Encrypted"
full_description = "Although 97% of Android phones have encryption as an option, less than 35% of them actually got prompted to turn it on when they first activated the phone. Even then, not everybody chooses that extra layer of security. A Google spokesman said that encryption is now required for all “high-performing devices” — like the Galaxy S7 — running the latest version of Android, Marshmallow. But only 1.2% of Android phones even have that version, according to Google. By comparison, most Apple products are uniformly secure: 94% of iPhones run iOS 8 or 9, which encrypt all data."
