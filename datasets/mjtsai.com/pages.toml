["https://mjtsai.com/blog/2011/04"]
title = "Michael Tsai - Blog - Archive - 2011 - April"
full_description = "If you have a free version of your app, that will be the only version many people will ever see. So, for the Free users, that app — that extremely limited app that lacks almost all of Instapaper’s best features — is what they think Instapaper is. I was giving them a choice: Stick with this limited app, or upgrade to the paid version with all of these great features. But since they had never used those features, they didn’t know how much they wanted them. Sidenote: I would much rather pay (say) $10 for an app that I’ve tried and know that I like, than buy a bunch of similar apps for $1-5 each and then “throw away” the ones that turn out not to be as good. Paying for what you use, rather that what you can be induced to buy-to-try, sends better signals to developers about what’s good—and also would lead to more meaningful top-10 charts in the store for users. Apple’s response to the consolidated.db controversy seems to explain what people wanted to know about its crowd-sourced location database and put that issue to rest. However, commenter Chucky notes that Apple has left itself an “escape clause” for iAds. The press release says: Our iAds advertising system can use location as a factor in targeting ads. Location is not shared with any third party or ad unless the user explicitly approves giving the current location to the current ad (for example, to request the ad locate the Target store nearest them). We may collect information such as occupation, language, zip code, area code, unique device identifier, location, and the time zone where an Apple product is used so that we can better understand customer behavior and improve our products, services, and advertising. And the Wall Street Journal, referring to the letter Apple sent last year to congressmen Markey and Barton, writes: Apple, meanwhile, says it “intermittently” collects location data, including GPS coordinates, of many iPhone users and nearby Wi-Fi networks and transmits that data to itself every 12 hours…"
