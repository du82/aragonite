full_description = '''Anniversary Audio Hijack Pro BBEdit Default Folder X DreamHost GraphicConverter History iOS Mac Panorama X PCalc Rogue Amoeba The Media The Omni Group Web Agreed - all have been huge contributors to my productivity and education, along with EF, for a good and long time. Sincere congratulations to all! FWIW, Solitaire Till Dawn was 25 in Feb 2016! I know it's not a productivity app; sort of the opposite, really. But you gave it a great review in Macworld, back in the day. Now there's an up-to-date macOS version in the App Store, and I hope to release an iPad version in the next couple of weeks. Your review back then helped make it worth my while to keep it up all these years, and I appreciate that. Thank you! Default Folder X is 29 - next August it'll be 30 years since I wrote the first version of it (then called "DFaultD"). And yes, BBEdit and PCalc have been in my toolbox nearly as long - time flies when you're having fun :-) […] been happily using BBEdit for somewhere around 22 years now. As a user, I appreciate that it pretty much never does anything to annoy me. This is rare. […] Keyboard Maestro seems young compared to these at only 17 years (only 15 as my software), even if it grew out of a previous application. Stairways Software turned 25 earlier this year - as Jon said, time flies when you're having fun!'''
