["https://mjtsai.com/blog/2003/04"]
title = "Michael Tsai - Blog - Archive - 2003 - April"
full_description = "Dan Frakes has written an article that every Mac developer should read. My favorite piece of advice: put the full name of the product and the version number in the name of the disk image. Classes are what make objects possible, and without objects, object-oriented programming would not make sense. —Special Edition Using Java, quoted by Douglas Dunn on the now-defunct javarules.com I really want to hear the details of the DRM. How is the iPod special wrt authorization? What happens if I burn a CD and then rip it? I’m not sure yet how much I’ll use this service. Unlike Jobs, I like albums, and the prices seem geared towards singles. Right now, I see it as mostly useful for previewing and accessing previously unreleased material. I didn’t see the original version of “Slow Motion,” though. There’s a flow to a good album. The songs support each other. That’s the way I like to make music. —Trent Reznor Tim Bray has written an introduction to Unicode. From my quick skimming, his writing seems exceptionally clear. Lambda: “Our conclusion is simple, and contradicts our initial intuition: compiled implementations should use eval/apply.” Rooneg notes that the The Unix-Haters Handbook (circa 1994) is now available online, hosted by Microsoft. It has a forward by Donald Norman and an anti-forward by Dennis Ritchie. Here’s some discussion of the Rube Goldberg Honda Ad. I’d just assumed it was CGI…but Eric says it’s not. Here’s a transcript of Kapor and Hertzfeld’s talk at O’Reilly. Chandler is written in Python, which Hertzfeld says is three times faster to program in than Java, which is three times faster than C. Chandler uses wxWindows for its platform-agnostic interface framework. The Mac version uses native widgets, but the program as a whole doesn’t feel at all native to me. I do like the way you can click on an address component (such as a phone number) to edit it. There’s no annoying editing mode, like in Apple’s Address Book. Hertzfeld apparently likes browsers: every view in Chandler has a URL, and one of the “key concepts is that you can have multiple Views onto each data set.” Kapor says: “We’re not successful if we make commercial development impossible.”"
