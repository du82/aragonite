["https://mjtsai.com/blog/2016/01"]
title = "Michael Tsai - Blog - Archive - 2016 - January"
full_description = "Control Center is probably my single favorite system-level UI change to iOS ever. I kind of wish you could change the apps hard-coded at the bottom (I’d replace Calculator with PCalc, for example), but I use it all the time. I think Notification Center and Today view could still use some improvement. But cramming Control Center into the same pull-down sheet would make things worse, not better. I like the limitation of having just a few available slots, but being able to replace the “dead” spots with buttons I’d actually use would be a big improvement. And the design inconsistency I mentioned earlier? The buttons on the top do a single thing and they do it immediately—they do not launch apps. The buttons on the bottom do launch apps, which is why the have the rounded rectangle shape of app icons. The exception, the inconsistency, is the Flashlight button. It belongs on the top. I can only assume that Apple put it where it is because they wanted six “do it now” buttons but had room to fit only five comfortably. It’s a minor inconsistency, but it wouldn’t be necessary if we could customize our button layouts. Some of the world’s best brands trust us with their entire mobile presence, and a growing number of the world’s brightest independent developers trust us with their next big thing. We couldn’t be happier. As stewards of a good thing, we’re always thinking about the next step in growing Parse to become a leading platform in this age of mobile apps. Parse has agreed to be acquired by Facebook. We expect the transaction to close shortly. Rest assured, Parse is not going away. It’s going to get better. According to their brag page, Parse’s customers included some of the biggest and most popular apps on both iOS and Android. Uniqlo, Eventbrite, Plenty of Fish, Lululemon, and more all used Parse. Stubhub? Parse. Vevo? Yep. Zoosk? HopStop? The fucking White House? Their apps used Parse. Heck, even that shelved new app Panic was working on used it."
