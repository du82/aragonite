["https://mjtsai.com/blog/2012/12"]
title = "Michael Tsai - Blog - Archive - 2012 - December"
full_description = "Firstly, nothing is ever good enough to evade critique. In fact the best things, the things we think are the closest to perfect often deserve and benefit from the strongest analysis. No computer will ever be fast enough, no program well designed enough, no device ever shaped well enough to not warrant a detailed look. This critique is often a sign of respect and affection for something. Often I had a higher degree of appreciation for the things in my life discussed on the show after hearing John take them apart and describe how they could be better. This question on the Theoretical Computer Science Stack Exchange generated some good answers (via Nicolas Seriot): In this article we further develop Piponi’s approach, which employs a number of beautiful algorithmic techniques from the world of functional programming, to build a Java library for incremental regular expression matching. This is also an interesting investigation into how the functional approach blends together with an imperative language. “Incremental” means “match result is efficiently maintained under certain operations”, where the operations include concatenating two strings and splitting a string in part around an index. Obviously, these two operations form a basis for all kinds of rearrangements, such as inserting or deleting a word from the middle of a string, or appending characters to its back or front, etc. x86 shipments dropped by 9% in Q3 2012. Furthermore, the expected surge in PC sales (and x86 shipments) in Q4 due to the release of Windows 8 has failed to materialize. NPD data indicates that Windows PCs sales in U.S. retail stores fell a staggering 21% in the four-week period from October 21 to November 17, compared to the same period the previous year. In short, there is now falling demand for x86 processors. Computer buyers are shifting their spending from PCs to next generation computing devices, including smartphones and tablets. It’s interesting to consider that Intel’s problem may be more with its business model than its technology. I think they’ll be able to make processors that are competitive in terms of performance and power, but what about in terms of dollars?"
