["https://mjtsai.com/blog/2005/06"]
title = "Michael Tsai - Blog - Archive - 2005 - June"
full_description = "Personally, I think the Macintosh is a wonderful machine. I use one daily at work, and then at night I play with the one I have at home. Or, at least, I try to play with it. You see, my wife—who for years resisted all my attempts to introduce her to computers—has fallen in love with the Mac (her words, not mine). She uses it to type up medical reports, notes on her clients, and personal letters. In fact, she’s suggested that we get a second Macintosh so that we won’t have to fight over the one we have. One melancholic note regarding the new lineup: there are no longer any iPods using Chicago 12 as their system font. The color-display iPods use Myriad, the Minis use Espy Sans, and the Shuffles use, well, nothing. One of the first things I noticed about the original 5 GB iPod was that it used Chicago 12, and I always felt it was a nice bit of homage to the original Mac — not to mention that it’s one of the greatest screen fonts ever designed. (Chicago 12 was the default system font from System 1 until Mac OS 8, when Charcoal debuted.) It’s quite readable, but also very distinctive. If you find you have reached 5 authorizations due to system upgrades, you can reset your authorization count by clicking Deauthorize All in the Account Information screen. Note: You may only use this feature once per year. The Deauthorize All button will not appear if you have less than 5 authorized computers or if you have used this option within the last 12 months. SCOTUS said, “Grokster created and aimed this software at the Napster crowd, and encourage it as a music sharing product” SCOTUS didn’t say “All P2P is only for copyright infringement, and if you use it for any reason, you’re a criminal.” Would “See any TV show you want to, anytime you want to see it” or “build a library” count as enough obvious encouragement of librarying—which was not found to be fair use—to justify a finding of contributory infringement?…What about “any TV show” in the context of pay cable, which again was not analyzed as fair use when the Court looked at time-shifting free broadcast TV?"
