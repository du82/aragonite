["https://mjtsai.com/blog/2024/12/12/macos-15-2"]
title = "Michael Tsai - Blog  -  macOS 15.2"
full_description = "macOS Sequoia 15.2 adds Image Playground, an app that lets you create images based on text descriptions. You can type in whatever you like, but Apple will suggest costumes, locations, and items that you can add to an image. You can generate images that resemble your friend and family, and you can choose a photo for Image Playground to use as inspiration. The update also adds ChatGPT integration to Siri, which is an opt-in feature. When enabled, Siri is able to hand complicated requests over to OpenAI’s ChatGPT. Apple’s release notes are a real joy to read and contain more detailed information at last, including the following: Among the more significant bugs fixed is that Apple silicon virtualisation on M4 Macs can now open all VMs, including macOS guests before 13.4. For those running Ruby with YJIT enabled, this update should fix kernel panics with M4 chips. Apple’s custom emoji generator, Genmoji, is now available on iPhone and iPad with iOS 18.2 and iPadOS 18.2, but Mac owners will need to wait a little more because Genmoji is a no-show in macOS Sequoia 15.2. Instead, “Genmoji will be available on Mac in the coming months,” Apple confirmed. Priority notifications is another Apple Intelligence feature coming later than sooner. Priority notifications leverage AI to summarize and surface what’s most important at the top of the stack. Users on iPhone who updated to iOS 18.2 have the [Mail sorting] features. However, iPad and Mac users who updated their devices with the software that Apple released concurrently with iOS 18.2 will have noticed their absence. Lee Mendoza emailed us to report that macOS 15.2 patches a recurring Apple bug again, which breaks home directory relocation. If you ignored best practices and added a method called imageWithTintColor: (without using a custom prefix) to the NSImage class in your macOS app, macOS 15.2 is here to collect your dues. Not enjoying this ad in System Settings that can’t be dismissed unless you actually open Image Playgrounds."
