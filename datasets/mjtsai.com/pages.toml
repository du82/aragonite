["https://mjtsai.com/blog/2005/09"]
title = "Michael Tsai - Blog - Archive - 2005 - September"
full_description = "These auctions include a total of over $11,000 worth of software. Each disc—whether Mac or Windows—contains about $1,100 in applications, all donated by a lot of very generous developers. Neither Google, nor any person or corporation, has any legal right to a digital copy of any book I own just because Google wants it and I’m willing to let it make the copy. I may have a “fair use” right to a digital copy of a book I own, for my own personal use, but that doesn’t mean I can give the digital copy to anyone else without also giving them the original book. Any of these libraries may have the right to digitize copies of their collections, but if that’s the case, the copies belong to them, not to Google or whoever made the copies. So, as a Mac programmer, I should really get a good handle on these floating point thingies. But floating point numbers seem pretty mysterious. I know that they can’t represent every integer, but I don’t really know which integers they actually can represent. And I know that they can’t represent every fraction, and that as the numbers get bigger, the fractions they can represent get less and less dense, and the space between each number becomes larger and larger. But how fast? What does it all LOOK like? In a “normal” programming language, the equivalent to “path to fonts folder from user domain” might be something like: The point being that in most languages, these two calls don’t look at all similar. Which is a good thing, because they aren’t at all similar: one is a global command taking two parameters, the other is a property of a property of an object. AppleScript’s slavish devotion to English-likeness, on the other hand, gives us two very different syntax constructs that read, to humans, as though they’re semantically identical. Secondly, Macworld put Firefox 1.0.6 ahead of Safari, which is almost as ridiculous as putting Camino behind Opera. See, I’m not biased towards Mozilla browsers! Safari 2.0 is simply a better browser than Firefox 1.0.6. Its [sic] not even close. The story is a little different with Firefox 1.5b1, but that isn’t what they are reviewing."
