["https://mjtsai.com/blog/2020/06/19/have-you-contributed-any-revenue"]
title = "Michael Tsai - Blog  -  Have You Contributed Any Revenue?"
full_description = "Thank you for being an iOS app developer. We understand that Basecamp has developed a number of apps and many subsequent versions for the App Store for many years, and that the App Store has distributed millions of these apps to iOS users. These apps do not offer in-app purchase — and, consequently, have not contributed any revenue to the App Store over the last eight years. We are happy to continue to support you in your app business and offer you the solutions to provide your services for free — so long as you follow and respect the same App Store Review Guidelines and terms that all developers must follow. cracks knuckles ... your ... contribution ... has been a little light lately. It would be a real shame if ... something were to happen to your apps. That bit about “not contributed any revenue to the App Store over the last eight years” is supposed to make the Basecamp folks say “Oh, yeah, you’re right, we forgot, so please go ahead and screw us because we deserve it”? How about you compete with letting folks have a direct relationship with their customers (on hardware they bought) and offer a compelling reason to go through your dollar store. Apple’s email is an extraordinarily condescending series of statements that seems to emphasize that third-party developers are allowed to develop for Apple’s products through the grace and generosity of the company. But how many people would buy an iPhone if there were no ecosystem of third-party apps, or if free apps were not allowed? The App Store’s policies have incentivized business models that do not require customers to pay money for downloading apps. How many Macs has Apple sold because that’s the only platform supported by the company’s developer tools? This is the kind of thing a company writes because it can — because anyone who wishes to have an audience for their product or service on about half of Americans’ smartphones has no choice but to tolerate whatever inconsistent hell they are put through."
