["http://mjtsai.com/blog/2016/02/17/fbi-asks-apple-for-secure-golden-key"]
title = "Michael Tsai - Blog  -  FBI Asks Apple for Secure Golden Key"
full_description = "When the FBI has requested data that’s in our possession, we have provided it. Apple complies with valid subpoenas and search warrants, as we have in the San Bernardino case. We have also made Apple engineers available to advise the FBI, and we’ve offered our best ideas on a number of investigative options at their disposal. We have great respect for the professionals at the FBI, and we believe their intentions are good. Up to this point, we have done everything that is both within our power and within the law to help them. But now the U.S. government has asked us for something we simply do not have, and something we consider too dangerous to create. They have asked us to build a backdoor to the iPhone. Specifically, the FBI wants us to make a new version of the iPhone operating system, circumventing several important security features, and install it on an iPhone recovered during the investigation. In the wrong hands, this software — which does not exist today — would have the potential to unlock any iPhone in someone’s physical possession. This is really important. Apple cannot decrypt locked phones, so the FBI wants Apple to give them a rewritten iOS that bypasses security. I have no idea why the FBI wants in the iPhone other than to set a precedent. They already have iCloud data and text messages and computers. Because there is nothing the data on the iPhone can tell the FBI that the FBI doesn’t know already. What’s important to remember is that Apple gave the FBI access to everything that exists and additional advice. Apple gave the FBI forensic advice. That fact alone makes this look even more like a backdoor fishing expedition by the FBI. FBI Supervisory Special Agent Christopher Pluhar stated in a declaration that he was able to obtain from Apple all the data backed up to its iCloud servers from the phone. That data showed that Farook was in communication with individuals who were later killed. Significantly, Pluhar said, the most recent backup took place on Oct. 19, 2015, indicating that Farook may have intentionally disabled the backup feature."
author = "Michael J. Tsai"
