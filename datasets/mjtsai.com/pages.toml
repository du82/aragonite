["https://mjtsai.com/blog/2003/09"]
title = "Michael Tsai - Blog - Archive - 2003 - September"
full_description = "Bert Altenburg’s AppleScript for Absolute Starters is a slow-paced introduction to AppleScript, available in PDF format. I used to despise JavaScript out of ignorance, because I don’t like the way it’s often applied on Web pages. Now I’ve been reading more about it, and it’s actually a pretty neat language. Objects in JavaScript are based on prototypes, like in AppleScript. DrawBot (binary, source) is a great example of the power of PyObjc, and it’s also a useful program in its own right. It’s a basic Python IDE that lets you edit scripts (with syntax highlighting) and display the results of Quartz drawing commands. SpamSieve doesn’t officially support Apple Mail yet, but I’ve posted some scripts and instructions that should make it work with Mail, if you’re using an IMAP or .Mac account. Path Finder gets a great update, which includes an improved version of the Panther Finder’s Places sidebar. It’s still missing a good Find feature, though. Eric Blair complains that the 10.2.8 installer can’t find Safari when it’s not in its default location, and is told that he shouldn’t want to move Safari in the first place. NetNewsWire can now open the permalink instead of the external link when you double-click a headline. Erik Barzeski’s blog has some discussion of how to use the calendar tool to print out timely holidays and historical events. John Gruber writes about the AppleScript whose clause, which add a kind of declarative filtering to AppleScript. whose is great in simple situations, but it doesn’t scale. The more interesting point: why do so many languages force you to use temporary lists and loops just to filter a list? It’s sad, really. From time to time I hear that IMAP is great because you can rely on whoever’s running the server to do the backups. But as Lee Bennett shows, there’s no substitute for backing up your own data. Stéphane Ducasse has collected some PDFs of out-of-print Smalltalk books, and also has some newer books about Squeak."
author = "Michael J. Tsai"
