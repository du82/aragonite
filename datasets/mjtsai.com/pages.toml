["https://mjtsai.com/blog/2003/07"]
title = "Michael Tsai - Blog - Archive - 2003 - July"
full_description = "Benjamin Pierce has written some slides about developments in type theory. He includes lots of references and timelines, and notes that research is being transferred to industry faster than before. Unsanity’s Rosyna Keller is working on a haxie in the spirit of MenuFonts and TypeTamer. Unlike FontSight, it will work with Carbon applications. Nat Irons prices out various combinations of displays. Despite being more versatile, smaller displays offer more pixels per buck. Unfortunately, you need a silly adapter to use two Apple displays at the same time, and there are issues with using a PCI card to drive the second monitor, if you don’t have an AGP card that can drive two displays. I think we don’t make things up. We just distill it to, hopefully, its most humorous nugget. And in that sense it seems faked and skewed just because we don’t have to be subjective or pretend to be objective. But the other news networks, you know, they have this idea that they’re being objective. But news has never been objective. It’s always…what does every newscast start with? “Our top stories tonight.” That’s a list. That’s an object…that’s a subjective…some editor made a decision.…So why not take advantage of that and actually analyze what you do think is important. Davy Rothbart’s Found is something like a reality magazine, but that rather than tell a story through editing, he shows the source material—little hand-written slips of paper—whole and lets readers draw their own conclusions (via the Boston Globe). That’s the only way I know how to write prose. I tend to think about things in the background and then type out an almost-final draft. However, in all levels of school, I was told that it was important to get a rough draft down on paper as soon as possible, even if it was, well, rough. It could always be revised from there. The problem is that it’s much easier to revise in your head than on paper (or in a word processor). The ideas on the paper have inertia. They lock you into a trajectory. I spot some of the bad ideas and excise them, but I think my brain suppress new good ideas because there’s no way to seamlessly incorporate them into the draft."
