["https://mjtsai.com/blog/2016/12/02/status-board-discontinued"]
title = "Michael Tsai - Blog  -  Status Board Discontinued"
full_description = "Unfortunately, while Status Board became a beloved friend to offices around the world, sales weren’t enough to sustain further development. First, we had hoped to find a sweet spot between consumer and pro users, but the market for Status Board turned out to be almost entirely pro, which limits potential sales on iOS — as we’ve learned the hard way over the past couple of years, there’s not a lot of overlap right now between “pro” and “iOS”. Second, pro users are more likely to want a larger number of integrations with new services and data sources, something that’s hard to provide with limited revenue, which left the app “close but not quite” for many users. Finally, in the pro/corporate universe, we were simply on the wrong end of the overall “want a status board” budget: companies would buy a $3,000 display for our $10 app. You should have done a native Apple TV version of this when it became possible. Would make total sense to me. Apple never provided an official WebKit view for Apple TV apps, and Status Board depends heavily upon them, for custom panels, etc. So unfortunately, it wasn’t possible to port an Apple TV version, even though that would make the most sense…"
