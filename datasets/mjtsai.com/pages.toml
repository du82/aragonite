["https://mjtsai.com/blog/2007/07"]
title = "Michael Tsai - Blog - Archive - 2007 - July"
full_description = "This version of LaunchBar introduces a bunch of new features, but the most interesting are two that rely on a new gesture: holding down the last typed key. I also like the new feature to browse within text, RTF, and HTML files; and the improved calculator (Command-= or just type a digit). I don’t like Safe Sleep one bit—at least not the way it’s currently implemented. I especially dislike the fact that Apple has not merely made it the default setting, but has omitted any graphical interface for turning it off—and the fact that if you use the command line to do so, chances are good that Safe Sleep will turn itself back on when you least expect it. In effect, physically rotating the phone into the BoB landscape mode has swapped the meaning of the buttons. The button that used to be in the position that maps to “increase volume” is now in the position that maps to “decrease volume.” The solution is to use software to swap them back. I’m not convinced, and I think the demo is irrelevant because it uses software buttons. With hardware buttons you remember how they feel and how they’re positioned relative to the corner. The software buttons are centered, and there’s nothing to feel. Especially if it’s in a pocket, I would rather that the buttons behave predictably than have to guess what orientation the phone thinks it’s in and then determine whether it’s switched the meanings on me. All e-mail to support@flyingmeat.com goes through FogBugz which is a huge huge time saver for me. I can turn e-mails into bug reports, file them away, respond, easily see previous e-mails from the reporter, and generally do everything I need to do when I’m wearing my support hat. It’s all easy and does what I need and want it to do. I’m especially interested in what Gus thinks since he’s also a solo Mac developer. In this case, our solutions couldn’t be more different. I tried FogBugz a few years ago, since it was getting rave reviews, and just couldn’t stand it. (Thanks to Fog Creek for offering a full refund with no questions asked.) At the time, I liked Trac somewhat better for issue tracking, but of course Trac doesn’t handle support e-mails. I can see how something like FogBugz would be useful for a setup involving multiple developers and support people, but for me I see no need for it. I’ve never had a problem with support e-mails falling through the cracks, and my entire e-mail history is easily accessible in EagleFiler. Web-based bug trackers vary from terrible to pretty good—and FogBugz is certainly towards the good end—but I’ve yet to find one that I actually liked using. Part of it is that for this kind of highly interactive work I think it really helps to have a desktop interface. It may also be that I have a certain way that I like to work, and the Web-based trackers that I’ve used are rigid in making me change my style to fit theirs. I’m currently using OmniFocus as my issue tracker and am loving it. It’s also rigid, in a way, but the workflow that it enforces happens to be a close match to what I’ve always tried to achieve with other tools."
