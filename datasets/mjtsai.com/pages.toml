["https://mjtsai.com/blog/2024/05/20/ios-17-5-resurfacing-deleted-photos"]
title = "Michael Tsai - Blog  -  iOS 17.5 Resurfacing Deleted Photos"
full_description = "A Reddit user wiped an iPad following Apple’s guidelines in September of 2023 before selling it off to a friend. That friend updated the iPad to iPadOS 17.5 this week, and began seeing the Reddit user’s old photos reappearing in the Photos app. That would be very concerning because it would imply that Apple is retaining deleted photos in the cloud. However, this particular Reddit post has since been deleted, and I haven’t seen any others making this claim. I do continue to see reports that deleted, non-cloud photos are resurrected after installing iOS 17.5. That is also a serious bug, which I hope Apple will communicate about. It’s apparently fixed today in iOS 17.5.1, but Apple has not posted release notes of that yet. Images deleted as far back as 2010 were surfacing again, leading to confusion and worry over what was going on. Apple’s information today indicates that it was a database corruption issue, and iOS 17.5.1 should solve the problem. Some details are still missing here. Presumably, the database was corrupted at the time of deletion, which is why the photos were left on disk. iOS 17.5 wasn’t the cause of the problem; it just revealed the failure that happened long ago. This implies that people who don’t (or can’t) update to iOS 17.5/17.5.1 may still be subject to the problem. It’s also not clear what the fix is. How does 17.5.1 detect which photos were meant to be deleted? If the database is corrupted, how does it do that without potentially losing photos that are meant to be there? I may or may not know somebody who is a Private Contractor @ Apple, and they may have or may not have given me an explanation on the current situation. Now how are the deleted photos “reappearing” after being deleted? This is because almost every case of this incident happening which Apple has investigated has been caused by the photo(s) being deleted from the “Photos” app but NOT the “Files” app. They are two separate apps with two copies of the photos."
author = "Michael J. Tsai"
year_published = 2020
year_updated = 2020
