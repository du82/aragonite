["https://mjtsai.com/blog/2012/09"]
title = "Michael Tsai - Blog - Archive - 2012 - September"
full_description = "The iPhone 5’s camera is an evolutionary – not a revolutionary – step forward for iPhones. Whether or not you like it will depend more on your goals from photography than on its particular performance or features. Compared to the iPhone 4s, the biggest difference is its speed. The 5 feels faster and more responsive, with a much shorter shot-to-shot time. It feels clunky to go back to using a 4s after using the 5. Its photos also show more aggressive noise reduction, but at the cost of smearing away some of the finer details. It’s a personal judgement which looks better – the detail of the 4s or the cleaner smoothness of the 5. Personally, I prefer the look of pictures from the iPhone 4s, but the speed of the iPhone 5 has already seduced me too effectively to consider going back. While its on-paper specifications don’t suggest that much has changed from its predecessor, the iPhone 5 is certainly better, and as close to a pocket digital camera replacement as anything Apple has yet released. Still possessing an 8-Megapixel (3264x2448) sensor, and adding only small software features such as a new Panorama mode that are also found on the iPhone 4S, the iPhone 5 rear camera nonetheless renders colors more accurately than its predecessors, more quickly acquires accurate focus locks, and offers dramatically enhanced low-light performance. I’ve learned that 3rd party developers CAN take advantage of this special “low light boost mode.” […] While it’s not documented yet in the AVCaptureDevice Class Reference, taking a peek at the “AVCaptureDevice.h” class header reveals the related properties: lowLightBoostSupported, lowLightBoostEnabled, automaticallyEnablesLowLightBoostWhenAvailable. Either way, there’s more cloud detail [with AutoStitch], ergo why I like it better. The iOS shot has solid white blown-out areas in the clouds. And no matter which way you look at it, it’s easier to line up individual shots and stitch them later than it is to carefully hold a camera steady as you pan across for a live panorama."
