["https://mjtsai.com/blog/2011/03/10/xcode-4"]
title = "Michael Tsai - Blog  -  Xcode 4"
full_description = "Martin Pilkington has a great review of Xcode 4 as well as a guide for where to find Xcode 3 features in it. One change not mentioned is that Xcode 4 drops SDK support for developing applications that run on Mac OS X 10.4 and 10.5. (Depending on which libraries you need to link with, primitive 10.5 support may be possible using deployment targets.) Xcode 3 can still develop for those systems, but it probably will not be able to run on 10.7 or develop for 10.7 APIs from 10.6. So Apple is strongly encouraging developers to drop PowerPC support and support only Snow Leopard and Lion going forward. This was to be expected, although Apple is obsoleting older systems more quickly than in the past. I’m sure there’s lots of code that could, without much trouble, run on these systems if there were tool support. @Michel Fortin No. My understanding is that the format of the SDKs has changed and also that Xcode 4 only works with newer versions of the compiler that cannot target 10.4. I approach this as a non-programmer who has found various occasions to fire up Xcode and other parts of the DevTools. I've always thought of the DevTools as part of the OS just like Terminal, and find the token direct e-commerce payment Apple is demanding to be somewhat disturbing. It truly ain't the money. Five bucks is only five bucks. But it just is yet another symptom of what I find the be rotten in Cupertino these days. Also, you get issues like those made in Zach Holman's OS X Isn't for Developers post, which brings in some less abstract disturbing points than mine about the shift. The iOS rot just creeps very slowly, but very continually into OS X. I really thought the OS X we had in the first decade of this century was something special, and it seems to be eroding. @chucky, I'm very much not a developer, but I use Xcode and C++ occasionally for research. I don't mind the $5 as much as I mind potentially useful resources in the $99 Mac Developer area. Again that's not too much money for me as a faculty member, but it's not something I'm going to ask my students to pay. And it's not something I want to pay without knowing if what is on the other side of the pay wall is useful for my odd needs."
