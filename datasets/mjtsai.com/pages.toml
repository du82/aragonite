["https://mjtsai.com/blog/2016/01/05/why-the-2012-non-retina-macbook-pro-still-sells"]
title = "Michael Tsai - Blog  -  Why the 2012 non-Retina MacBook Pro Still Sells"
full_description = '''As we’ve progressed toward thinner, lighter, more integrated Macs, we’ve paid dearly in upgradeability, versatility, and value. There are many Macs to choose from today, but in some ways, we have less choice than ever. The 101 represents the world we’re leaving behind, and our progress hasn’t all been positive. The better question isn’t why anyone still buys the 101, but why the rest of the MacBook lineup is still less compelling for the 101’s buyers after almost four years, and whether Apple will sell and support the 101 for long enough for newer MacBook models to become compelling, economical replacements. It occurs to me that for all our collective worrying about the iOS-ification of Mac OS X, it’s the MacBook hardware that’s gotten iOS-ified, not the software. Thinness as a top priority, and an almost complete lack of upgradeability. I think most kids would have their eyes opened at just how straightforward it is to snoop around inside many of today’s tech products. I replaced the SSD in my MacBook Air this past weekend and was pleasantly surprised at how much easier it was than replacing the hard drive in my mid-2007 MacBook Pro. It took just ten screws to remove the back panel and a single screw to remove the drive, as opposed to the far more screws and clips required to remove the top case of the Pro. Marco raises a good point. I had to replace my 7 year old MacBook Pro 15" a couple of years ago (2013), and ended up going with a REFURB 2011 model because all of the Retina and other models were simply useless from many standpoints. I already had bigger HD than your could buy an SSD. They aren't upgradeable (RAM or drive), etc. If they don't keep the non-Retina MacBook Pro available, and UPGRADE it, then I'm afraid I may have purchased the last Mac I'll ever own, after using Mac and Apple products exclusively since 1984. I will absolutely NOT buy any MacBook that is not upgradeable. PERIOD. I have used PowerBooks and MacBooks exclusively since the PowerBook 180. I always upgrade the RAM and storage in my unit, sometimes multiple times. Not being able to upgrade them without having to buy a whole new unit is a deal breaker. Despite what too many Mac owners claim, Macs are NOT really cheaper, especially if they are not upgradable!'''
