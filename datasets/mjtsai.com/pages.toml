["https://mjtsai.com/blog/2020/04/06/amazon-prime-video-now-allows-in-app-rentals-and-purchases"]
title = "Michael Tsai - Blog  -  Amazon Prime Video Now Allows In-App Rentals and Purchases"
full_description = "Prior to the change, Amazon would not allow you to rent or buy content on the Prime Video app, instead, directing users to a web browser to avoid the App Store fee. You could still sign up for a Prime Video subscription through the iOS app if you are not an Amazon Prime subscriber, but even then, you could not make individual content purchases from within the app. Now, when users log in to the Prime Video app, there should be a message reading, “Browse, rent, or buy new release movies, popular TV shows, and more — now within the app.” The prices do not appear to have been raised to account for the 30 percent fee, as some platform owners like Spotify have done in the past. This is one of the biggest changes in the history of the App Store. I don’t see anything in the App Store guidelines about it, though. They still say: If you want to unlock features or functionality within your app, (by way of example: subscriptions, in-game currencies, game levels, access to premium content, or unlocking a full version), you must use in-app purchase. Apps may not use their own mechanisms to unlock content or functionality, such as license keys, augmented reality markers, QR codes, etc. Basically, if Amazon wants 30% from content creators to aggregate videos for Prime, and Apple wants 30% from Amazon to aggregate Prime for the App Store, and the content creator still wants 70%, it breaks the math. A few years back Apple dropped the second year subscription revenue share down to 15%, but that still makes multiple middle vendors tough. Neither Amazon nor Apple can earn together what they would earn separately, selling directly. It seems clear, if and when we emerge from COVID-19 and regulatory attention turns back to tech companies, App Store policies will be front and center. That’s why it would behoove Apple to come up with something more modern, something that lets them defray the cost of hosting the App Store and serving free apps, but also drives revenue based on security, privacy, and convenience, rather than policy, and that allows all these apps to provide better and more convenient experiences for all their mutual customers."
author = "Michael J. Tsai"
year_published = 2020
year_updated = 2020
