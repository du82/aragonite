["https://mjtsai.com/blog/2016/07/25/microsofts-sweet-skype-solution"]
title = "Michael Tsai - Blog  -  Microsoft’s Sweet Skype Solution"
full_description = '''In the same month Microsoft announced its alpha WebRTC-based Skype for Linux client, Redmond has put that native app and the native OS X Skype client on an end-of-life list. This is because Skype is being rebuilt to replace its peer-to-peer architecture with cloud-centric code that supports Windows, iOS, Android and web browsers. Microsoft has not given Mac and Linux users a date to dread. For now you can still get latest versions for all supported platforms – but it’s clear that full-fat Mac and Linux native clients aren’t something on which Microsoft wants to spend money forever. The pace of change in our industry means that the devices and operating systems used by the majority of people shifts with time. Our commitment to deliver the best possible cross-platform experiences requires that we continually assess when it’s time to increase our focus on the platforms of the future. Sometimes this means that we must end support for some devices and operating systems. Dunno about "angry". It's just that Skype is widely seen a joke, so anything even mildly negative will prompt some derision, no?'''
