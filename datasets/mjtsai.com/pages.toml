["http://mjtsai.com/blog/2011/04/06/appcode"]
title = "Michael Tsai - Blog  -  appCode"
full_description = "JetBrains appCode is a new Objective-C IDE for Mac and iOS development. It can read Xcode projects and has an advanced source editor and debugger but relies on Interface Builder 3 to edit nib files. It’s great to see some ambitious competition for Xcode, although the interface doesn’t really appeal to me. It does clearly best Xcode 4 in one area, though: it can sort the file list alphabetically. I have some experience with JetBrains, in particular their IntelliJ product. The UI have never looked like something that would win the Apple Design Award but the coding experience have always been outstanding. Regardless of that being an old CodeWarrior user I think it's good that Xcode finally gets some competition again."
