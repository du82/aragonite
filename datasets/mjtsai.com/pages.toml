["https://mjtsai.com/blog/2015/01"]
title = "Michael Tsai - Blog - Archive - 2015 - January"
full_description = "Instead of seeing their own apps, iTunes Connect is mismatching users and displaying other apps from completely different developers. MacRumors has been able to duplicate this issue, which appears to be widespread and has been going on since at least 8 AM Pacific. We don’t yet know whether the outage was caused by some error on Apple’s end or by a security breach like the one that brought all developer systems down in the summer of 2013. I’ve noticed tweets from a few different people that ended up in BlackBerry’s iTunes Connect example, though, which makes me think that some accounts were shown more often than others. That’s kind of weird, and it makes me wonder what kind of weird session management issue caused this. This occurred right when I was submitting EagleFiler to the Mac App Store. First, my account seemed to log in normally, not showing someone else’s apps. Then logging in failed for half an hour or so, all while Apple’s status page showed green. It eventually updated to show that iTunes Connect was down for several hours. If you’re a developer, I suggest logging in and making sure nobody monkeyed around with your apps while this was going on. The Mac OS X 10.10.2 update fixes the Thunderstrike exploit, among other security bugs. (Good luck if you have a Thunderbolt-equipped Mac but aren’t running Yosemite.) Lloyd Chambers is still seeing problems with dual displays. I’m still seeing problems with the login screen, Mail, etc. To call [Thunderstrike], “fixed,” is absolute fantasy. A good chunk of the boot process would need to change to fix this. Apple recognized that there would be situations where Mac admins would need to set up FileVault 2 for a person where the admin would not have the password for that person’s user account. To avoid the immediate need to enter a password, fdesetup has a -defer flag in Mountain Lion, Mavericks and Yosemite that can be used with fdesetup’s enable verb to delay enabling FileVault 2 until after the current (or next) user logs out. With the -defer flag, the user will be prompted for their password at their next logout or restart. The recovery key information is not generated until the user password is obtained, so the -defer option requires a file location where this information will be written to as a plist file."
author = "Michael J. Tsai"
