["https://mjtsai.com/blog/2003/06"]
title = "Michael Tsai - Blog - Archive - 2003 - June"
full_description = "Dan Wood relays that Cocoa will be getting some functionality from EOF that will make much of today’s hand-written controller code unnecessary. Good Apple. Wood also notes that, in Panther, Watson’s toolbars will show the currently selected tool. I have very mixed feelings about this. On the one hand, it makes Watson’s toolbar clearer. On the other, it’s a reminder of how many different things people use toolbars for. In Watson and System Preferences, they’re like a set of favorite tabs with icons. In Mail’s preferences there are no favorites; the toolbar shows all of the “tabs,” and they are not reorderable. In the Finder, there are verbs on the toolbar (Burn, Get Info) as well as verb-noun hybrids like folders. A folder icon in a Finder toolbar is a destination for drags, and also a command for showing that folder’s contents in the window. Should the Finder highlight the toolbar icon of the currently visible folder? That would mean highlighting and unhighlighting icons as you navigate within the window. And it would look rather strange if you don’t have the folder icons grouped together in the toolbar. Apple’s guidelines really need to address these issues. According to Steven Estrella, winner of the Bare Bones Software 10th Anniversary Essay Contest, BBEdit will help create “a new theme song will finally inspire the Red Sox to win their first World Series since 1918.” I like Netflix and all, but this patent is pretty silly. However, the patent system has become a game where everyone is forced to play, if only for defense. I don’t understand why so many people use mac.com e-mail addresses when the service is seemingly so unreliable. Probably two thirds of the order confirmations eSellerate sends on my behalf that bounce are directed at mac.com addresses, and 7/7 in the last week. Matt Gemmell has my favorite writeup of Panther and its new metallic Finder. I can’t wait to see how Apple will change the human interface guidelines to suit this whim. Personally, I think it’s time to change the default system fonts and smoothing since (according to John Geleynse) they were specifically designed for striped backgrounds, and stripes are now passé."
