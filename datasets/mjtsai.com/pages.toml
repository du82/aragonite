["https://mjtsai.com/blog/2002/12"]
title = "Michael Tsai - Blog - Archive - 2002 - December"
full_description = "I think what annoys me the most is a variation on #6: when sites use JavaScript to show a link in the browser status bar that isn’t where the link you’re hovering over actually goes. For instance, VersionTracker makes it look like clicking a download link will download a .sit or .dmg file, but clicking the link actually takes you to their ad page. By the time I realize that, I’ve option-clicked the link and end up with a .php file in my downloads folder. John Gruber has updated bbdiff, his command-line script for using BBEdit’s Find Differences command. If you comment out some of his defensive programming like so: You can set it as CVL’s opendiff tool to compare revisions using BBEdit instead of FileMerge. If the files to compare weren’t previously open in BBEdit, closing the differences window will close both files. This is one of those little interface touches that make BBEdit so great. By the way, I finally posted my little AppleScript for diffing the top two BBEdit windows. When you don’t need to set any options, it’s much quicker than going through BBEdit’s Find Differences window. So, here we all are. It seems that we are a living embodiment for the show. We are Browncoats, fighting a war we were never meant to win, but fighting none the less. The Fox Alliance has spoken, leaving us to make due with the cards we’ve been dealt. If you are anything like me, you’ve been pulling the record tabs off your precious Firefly VHS tapes, pushing along through your life still bitterly fighting the war from within. I love Firefly. Walking around the cargo bay, the bridge, it’s all been terribly painful. It does still live inside me, though. With every “gorram” or “them as can” I throw unknowingly into my daily conversation, or everytime I sit in the Captain’s chair that lives in my heart, I smile with the knowledge of what we’ve accomplished here. We may have been on the losing side, still not convinced it was the wrong one. I can’t remember who said that."
