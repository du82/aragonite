["https://mjtsai.com/blog/2012/02/20/xcode-4-3-review/trackback"]
title = "Michael Tsai - Blog  -  Xcode 4.3 Review"
full_description = "This does raise an interesting question: where are all the other developer tools? The most commonly used are included in Xcode. Instruments, File Merge, Application Loader, Icon Composer and Open GL ES Performance Detective can all be accessed from Xcode’s application menu. The rest of the developers tools are available via connect.apple.com in various packages. This should mean that the download for Xcode is lighter, though you won’t be guaranteed to get the most up-to-date versions of all the tools in one download. This doesn’t make a whole lot of sense to me. Instead of a single download that installed a consistent version of everything, there are now multiple downloads from three separate places: the Mac App Store, the connect.apple.com Web site, and Xcode’s preferences window. Stored inside the Xcode.app package, the auxiliary files and applications are now invisible to Spotlight. Code completion now works within some macros. Unfortunately things have regressed with regards to the OCUnit macros. This has been broken since Xcode 4.0. It really seems like Apple’s own developers don’t do unit testing. The text processing/scripting features that were present in Xcode 3 are still gone, too. I'm not sure if I should make a snarky remark about the quality of some of Apple's recent software releases."
