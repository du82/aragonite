["https://mjtsai.com/blog/2006/02/04/font-smoothing-in-pages"]
title = "Michael Tsai - Blog  -  Font Smoothing in Pages"
full_description = '''I’m not an expert on Quartz, but I don’t believe Pierre’s theory. As I learned several months ago, there are quite a few applications that don’t use the chosen font smoothing style. The pattern I see is that applications like Pages and OmniGraffle draw multiple layers with possibly overlapping elements. A logical way to implement this is to draw the elements separately into off-screen buffers and then composite them together. As far as I know, you can tell Quartz to use font smoothing or not to use it (CGContextSetShouldSmoothFonts), but you can’t tell it which style to use. Quartz automatically chooses the “right” font smoothing style, and the right style for anything but on-screen drawing is to use the CRT style. Thus, unless your application draws directly into a view, it will sometimes use the “wrong” style. An interesting case is OmniGraffle, which normally uses the CRT style. However, while you’re editing text it uses the LCD style, presumably because the field editor is drawing directly into the view. (If you’ve written one of these drawing applications, please feel free to correct me.) With the current Quartz API, it doesn’t look to me like this would be easy to fix. It’s not that the text rendering engine would have to change, but that the entire layout and compositing engine would. My guess is that this would reduce performance and needlessly complicate lots of code that’s unrelated to text rendering. It would seem that the best fix would be for Apple to allow the application to choose the font smoothing style, though perhaps it had good reasons for not allowing this in the first place. Another (possibly related) place this happens is with the menu extras - these also don't use the system setting, but use the CRT setting instead. I don't know why this would be hard to fix at all - add a new API that sets the font smoothing "method" for a given CGContext and you're done, right? Isn't that the benefit of the CGContext being an opaque type?'''
author = "Michael J. Tsai"
year_published = 2006
year_updated = 2018
