["https://mjtsai.com/blog/2024/12/13/xcode-16-2"]
title = "Michael Tsai - Blog  -  Xcode 16.2"
full_description = "The Command Line Tools package now supports using the swift test command to build and run package tests written with Swift Testing. macOS projects that use hardened runtime but no sandboxing may run into timeout errors when attempting to preview if the project is complex enough. Simulator process launch may stall for around 3-5 minutes per runtime as GateKeeper scans the simulator dyld shared cache. Memory leaks can occur when calling async functions bridged from Objective-C and building in the Swift 6 language mode. Workaround: Pass -checked-async-objc-bridging=off to the Swift compiler using “Other Swift Flags” in Xcode build settings. “Swift Assist is coming later this year,” said Apple in June. It’s now December [11th], so that means we’re only a few weeks from seeing it in action – Xcode 16.3 beta 1, presumably? However, when I add this value to OTHER_SWIFT_FLAGS (either in the Xcode build settings interface, or in an .xcconfig file), it yields a build error: It’s a frontend option, so you need to prefix it with -Xfrontend. Example: swift -Xfrontend -checked-async-objc-bridging=off main.swift The test navigator does this on every project that I run tests on, on every Mac I have access to with every 16.x release and beta of Xcode. my latest gripe is that apple has obviously stopped caring about obj-c. bugs spring up and just languish forever. example: the doc browser has a hierarchy pop-up menu. it now only shows swift functions even when the browser is set to obj-c mode. Apple Intelligence Gatekeeper Mac macOS 15 Sequoia Objective-C Programming Swift Concurrency Swift Programming Language SwiftUI Testing Xcode"
