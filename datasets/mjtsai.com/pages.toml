["https://mjtsai.com/blog/2005/04"]
title = "Michael Tsai - Blog - Archive - 2005 - April"
full_description = "DropDMG 2.6 adds support for Tiger and Automator. I think Brent Simmons is right that Automator will be the “sleeper hit” of Tiger. DropDMG is an application that really lends itself to automation, but most people don’t want to script or use the command-line tool, even though with DropDMG they’d usually only be writing a one-line script. At various points over the past few years, I was considering adding a feature to save the current preferences as an AppleScript or droplet. But I was never really happy with these ideas, because to do interesting things—combine image/archive creation with other tasks—you still had to know how to script. Automator goes much further. It lets you combine DropDMG with actions from other applications, and my sense is that for straightforward kinds of automation it’ll be easier and faster than AppleScript, even for people who know AppleScript. Once you’ve created an Automator workflow, you can save it as a droplet, contextual menu item, folder action, etc. One of the less interesting, but still important, new features in Tiger is that many of the Unix tools now support resource forks and Mac metadata. One such tool is tar, and so DropDMG now supports creation of .tar.gz and .tar.bz2 archives. (Previous versions could convert these formats but not create them.) 2.6 also add support for some old formats—uncompressed read-only and read-write NDIF .img images. This is by popular request. Apparently some people use them with emulators and for exchanging files with OS 9 users. Lastly, as far as the non-minor changes go, 2.6 adds two “name processing” options. You can have DropDMG automatically add the current date to the end of the image or archive name, and you can have it “sanitize” the name so that when you upload the file to a server it’s guaranteed to have a clean URL. In the previous post, I mentioned BBEdit’s disk browsers. These are one of my favorite features, but many BBEdit users don’t seem to use them. This is how I use them. Much of what I do revolves around three basic activities:"
