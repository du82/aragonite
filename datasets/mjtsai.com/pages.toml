["https://mjtsai.com/blog/2017/10/18/unreliable-macbook-pro-keyboards"]
title = "Michael Tsai - Blog  -  Unreliable MacBook Pro Keyboards"
full_description = "“If a single piece of dust lays the whole computer out, don’t you think that’s kind of a problem?” In every other computer I’ve owned before I bought the latest MacBook Pro last fall, fixing this would have begun by removing the key and peering around in its well to see if it was simply dirty. Not this keyboard. In fact, all of Apple’s keyboards are now composed of a single, irreparable piece of technology. There is no fixing it; there is only replacing half the computer. The primary motivator behind the rise of the butterfly switch seems to be that Apple keeps trying to make all its products thinner, to a degree beyond reason at this point (MacBook Pros now weigh as little as three pounds). If Apple decides to replace the keyboard, it sends out the computer to replace the entire top case; there is no such thing as replacing an individual key or just the keyboard. On a Macbook Pro, the top case retails for $700, but the computers haven’t been around long enough for anyone to be out of warranty yet. In regular MacBooks, which were first available in the spring of 2015, Apple has quoted as much $330 to replace a top case out of warranty. The path from “a piece of dust” to “$700 repair” is terrifyingly short. I, like the good kbase follower that I am, consulted and followed Apple’s directions for dealing with this[…] After a couple days of light usage, the problem got worse. […] The bottom lip of the key began to flip up a little bit as the key tried sprinting back up after being depressed. […] One of the tiny arms that the key cap clips onto is broken. My nearly $2,000 laptop that I bought less than a year ago is now missing a key[…] By the way, I know there will be some people suggesting that plenty of generations of Apple products have had their teething issues. I don’t deny that; the MacBook Pro was recalled for graphics issues, the first-generation iPod Nano scratched like crazy and the battery could overheat, and the unibody plastic MacBook’s bottom case peeled off."
author = "Michael J. Tsai"
