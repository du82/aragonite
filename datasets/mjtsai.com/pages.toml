["https://mjtsai.com/blog/2011/07/25/the-xcode-4-1-review"]
title = "Michael Tsai - Blog  -  The Xcode 4.1 Review"
full_description = "One of the big complaints with Xcode 4.0 was stability. We’d long been spoiled by the comparative stability of Xcode 3.2, so to go back to pre-3.2 levels of stability was incredibly frustrating. This new version feels a lot more stable. Assertion failures are a rarity, rather than part of the daily workflow as was the case in 4.0. Xcode 3.2 was perhaps the only version of Apple’s IDE that’s ever been as stable for me as their non-developer software. Hopefully they can get that back with 4.2."
