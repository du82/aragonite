["https://mjtsai.com/blog/2017/11/15/the-best-laptop-ever-made"]
title = "Michael Tsai - Blog  -  The Best Laptop Ever Made"
full_description = "Apple has made many great laptops, but the 15-inch Retina MacBook Pro (2012–2015) is the epitome of usefulness, elegance, practicality, and power for an overall package that still hasn’t been (and may never be) surpassed. At its introduction, it was criticized only for ditching the optical drive and Ethernet port, but these were defensible, well-timed removals: neither could’ve even come close to physically fitting in the new design, very few MacBook Pro users were still using either on a regular basis, and almost none of us needed to buy external optical drives or Ethernet adapters to fit the new laptop into our lives. In exchange for those removals, we got substantial reductions in thickness and weight, and a huge new battery. There were no other downsides. Everything else about this machine was an upgrade: thinner, lighter, faster, better battery life, quieter fans, better speakers, better microphones, a second Thunderbolt port, and a convenient new HDMI port. Two years ago, I called my 2012 MacBook Pro “possibly the best Mac I’ve owned,” and I’m even more sure of that now. I just wish there had been a 17-inch model. I hope it continues to work, not least because I think I’d be less happy with any of the models in the current lineup, despite advances in some areas. Apple still sells them new (MBP, Buy, 15”, scroll down) with all options except dGPU. $2000–$2900. I completely agree. I have a Touch Bar 15″ from work now, had a 2012 15″ before. It was the best computer I ever had. Tons of great 2015 MBPs in Apple’s refurbished inventory right now, including some with the dGPU if you need it. Yep. That’s why I bought a refurbished mid-2015 MacBook Pro in late 2017. Hoping Apple gets their shit together by the time it expires. It’s almost as if port bandwidth isn’t always as important as practicality and ubiquity for real-world utility, a lesson we apparently didn’t learn with FireWire, FireWire 800, Thunderbolt, or Thunderbolt 2. It doesn’t matter how great the port bandwidth is if you can’t reliably plug things into them. Some things don’t work correctly even with adapters."
author = "Michael J. Tsai"
