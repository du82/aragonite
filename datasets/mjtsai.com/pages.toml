["https://mjtsai.com/blog/2019/05/16/valves-steam-link-app-now-available"]
title = "Michael Tsai - Blog  -  Valve’s Steam Link App Now Available"
full_description = "Valve’s Steam Link app, which is designed to let you play Steam games on your iPhone, iPad, or Apple TV has finally made its way to iOS and is available for download as of today. Valve first announced the Steam Link app in May 2018 and planned to launch it soon after, but Apple ended up rejecting the app due to “business conflicts.” Valve said that it would remove the ability to purchase apps from within Steam Link in an effort to get Apple to approve the app, which may have allowed it onto the App Store. When connecting Steam Link to a PC or Mac, the main view is of your library, aka the games you’ve already purchased, and there is no readily apparent option for purchasing content directly on your iOS device. Users scared Apple might arbitrarily kill a third-party app availability (SteamLink). That’s the world we live in now. It seems bizarre to me that it took a year to resolve this, but I’m glad Apple decided it correctly. Next is ending the customer hostile process of requiring all purchases to go to the App Store or IAP. It's so silly I have to go to amazon.com instead of the Amazon or Kindle apps to buy a book."
