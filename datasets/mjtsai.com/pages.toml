["https://mjtsai.com/blog/2024/12/03/pat-gelsinger-out-at-intel"]
title = "Michael Tsai - Blog  -  Pat Gelsinger Out at Intel"
full_description = "Intel ousted CEO Pat Gelsinger over the weekend, capping a tumultuous nearly four-year tenure at what was America’s leading semiconductor company before its stock price and market share collapsed. The company announced Gelsinger’s resignation Monday morning, which a person familiar with the matter said came after a contentious board meeting last week over Gelsinger’s perceived failure to respond to Nvidia’s competitive edge and a lack of confidence in Gelsinger’s turnaround plans. Gelsinger set out an audacious plan when he arrived in 2021 to transform the languishing company into a chipmaking juggernaut. He sought to achieve parity with the two leading chipmakers, Samsung and Taiwan Semiconductor Manufacturing Co. He pursued big buildouts in the U.S. and around the world, a costly endeavor that weighed heavily on Intel’s free cash flow and increased the company’s debt load. He also wooed government investment, positioning Intel as the single-largest beneficiary of the U.S. CHIPS and Science Act. Government money has begun to flow to Intel in recent weeks and will aid the company’s chip fabs in Arizona and Ohio. Pat Gelsinger’s abrupt exit from Intel raises more questions than it answers, especially given the timing right after securing CHIPS Act funding. It feels like a classic case of boardroom drama, where the lack of a smooth transition hints at deeper issues—-perhaps a clash of visions or a failure to deliver on ambitious projects. It seems likely that the board has cold feet about the foundry business, and a split may be forthcoming. I’m concerned to see Pat Gelsinger ousted as Intel CEO. He wasn’t a firebrand visionary, and it wasn’t exactly going great, but he was deeply technical, and I don’t expect his replacement to equal him there. “Business harder” isn’t going to return Intel to greatness, only technical achievement will. Our views that Gelsinger did turn the ship are unchanged. Intel had a cultural problem, not a technical one and the one thing Pat did was change the culture for the better. There are green shoots of this popping up here and there if you know where to look with more coming every day. As we described yesterday, the problem is that technical changes happen over a three year timescale, finance looks at one year or less."
author = "Michael J. Tsai"
