["https://mjtsai.com/blog/2011/03/22/disabling-dropboxs-haxie"]
title = "Michael Tsai - Blog  -  Disabling Dropbox’s Haxie"
full_description = '''Dropbox injects code into the Finder in order to draw the green and blue badges atop your icons. I prefer to run a clean system, and it turns out that you can prevent your Finder from being patched by running these two commands in Terminal: I first heard about this last year, and indeed it does not seem to interfere with any non-cosmetic functionality. It was also recently recommended in the forum (via John Gruber). Since the haxie is not strictly necessary, I think Dropbox should provide an option in the user interface to turn it off. (Though my one tangential concern from reading that one comment in that forum is a worry that Lion is going to somehow stop all Mach Injection. I assume I'm over-reading, but I'm paranoid about Cupertino these days. And if I can't run things like QuicKeys, I'll never go beyond Snow Leopard on the platform. I definitely prefer to run a clean system, except with software I explicitly trust...) Yikes! I'll have to apply your fix immediately. But what about the APE supporting software itself? -- is it installed by DropBox, too? Where? I haven't installed DropBox cuz I don't like its mandatory use of the methods we're discussing, so I can't speak from experience. But I don't think it's actually using Unsanity's APE stuff. You can use regular old Mach Inject without using APE - aka stuff like the wonderful QuicKeys. In other words, I think Michael is using the word "haxie" to refer to generic Mach Inject methods, not APE. Though again, I'm not speaking from experience with Dropbox. (And BTW, you are a golden god, Bill Cheeseman. I couldn't do half the stuff I do on the platform without PreFab. I can never memorize your new company name, so I'll just keep on calling it PreFab.) Yup. I'm happy to run QuicKeys, BetterToolTouch, and DefaultFolderX because I understand the cost/benefit tradeoffs involved. But Dropbox seemed to me to use this kind of stuff when it was essentially unnecessary, and that made me not trust their software developers. Dropbox doesn’t use Application Enhancer. I use “haxie” in the generic sense of any code injection: mach_inject, APE, input managers, scripting additions, contextual menu plug-ins, etc.'''
