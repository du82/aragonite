["https://mjtsai.com/blog/2023/08/24/digital-will-sues-apple-over-developer-account-termination"]
title = "Michael Tsai - Blog  -  Digital Will Sues Apple Over Developer Account Termination"
full_description = "Plaintiff received a boilerplate message from Apple’s App Store Review stating that Apple determined that Digital Will’s ADP membership “has been used for dishonest or fraudulent activity,” and thus, Plaintiff’s ADP account was “flagged for removal.” In fact, Apple’s message did not identify any specific facts whatsoever, or any particular misconduct in which Digital Will engaged that violated the DPLA. The message further stated that Digital Will could appeal this determination within 14 days so long as it provides a written statement that thoroughly explains the issues Apple identified, the specific steps Plaintiff will take to resolve them, and any new information clarifying the issues. However, it was impossible for Digital Will to appeal and respond to “the issues [Apple] identified,” when Apple had not identified any specific issues. Apple has voraciously denied accusations that the App Store has monopolistic control over iPhone apps, yet the company’s ability to unilaterally close developer accounts without explanation forms a textbook antitrust case. Some five months after Digital Will had its apps pulled from the App Store, and two months after it sent a lawyer’s letter to Apple, the Cupertino company reinstated the account. No explanation was offered. After seven years of an incredible journey, my developer account has been flagged for removal. I launched around 15 apps on the App Store, which were well-received, accumulating 650K pure organic installs with an average rating of 4.6. Unfortunately, this journey with Apple has come to an end due to a violation of clause 3.2. I don’t have high hopes that Apple will reverse the decision, and my apps will be removed from the store today. Sadly in cases like this, Google (as a company) isn't any better. We've had things just stop working and no resolve from Google, but thankfully not as damaging as this. There needs to be a set of rules that forces the gatekeepers to treat their devs/publishers/customers with decency."
