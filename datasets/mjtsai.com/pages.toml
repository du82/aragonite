["https://mjtsai.com/blog/2020/11/17/big-sur-notifications"]
title = "Michael Tsai - Blog  -  Big Sur Notifications"
full_description = '''I like the new notification system a lot better than the prior one. Notifications are grouped better. Both notifications and widgets are on the same screen. Widgets also feel more intentional with the new iOS influenced widget system. This has been a win, and I’m using Notification Center now more than ever. I think Mojave’s notification design was better. When a new iMessage came in, there were buttons so that I could quickly reply or mark it as read. Catalina and Big Sur take extra clicks. The important actions are now invisible, hidden behind a hover state that requires an extra click (“Options”). I implore you to fix Messages and replying from a notification. What used to take 1 click on Mojave or Catalina, now requires 3 clicks. It’s actually faster to just open Messages and reply there. this UI is supposed to be ASKING ME if i want notifications. it took me, like, a year to figure this out It’s the macOS equivalent of the dialog box that appears on iOS asking a user to enable notifications. On macOS, they’re opt-out; on iOS, they’re opt-in. But macOS notifications are so terribly designed that you need to hover over them to see the action buttons. Design Mac macOS 10.14 Mojave macOS 10.15 Catalina macOS 11.0 Big Sur macOS Widgets Messages.app Notification Center As I already tweeted a few days earlier, the Calendar Event notification in BS does not allow me to choose a duration option for the Snooze button any more (before, it appeared with press & hold on the button). The Calendar Event notification is a significant regression for me as well: makes it effectively useless for my use cases. Agreed -- the calendar notification snooze needs to have duration options; even in catalina there weren't enough ("in 2 hours" or "two hours before start") but without any it's a real bummer. hopefully they'll fix that-- I agree with Marco and with the people frustrated about calendar alerts. Apple surely has their reasons, but if it was to benefit their customers, they would let us know why they’d take away a feature that so many users rely on.'''
author = "Michael J. Tsai"
