["https://mjtsai.com/blog/2018/02/17/twitter-abolishes-native-mac-client"]
title = "Michael Tsai - Blog  -  Twitter Abolishes Native Mac Client"
full_description = "We’re focusing our efforts on a great Twitter experience that’s consistent across platforms. So, starting today the Twitter for Mac app will no longer be available for download, and in 30 days will no longer be supported. Masterclass in doublespeak. Please wait while we upgrade your Twitter experience. With a browser window. I can’t complain about them making official what’s already been obvious for ages, but I wonder what Twitter’s answer is for how those of us with multiple accounts are supposed to use Twitter. Just keep logging in and out? It’s all fine, really, so long as they continue to allow third-party clients like Tweetbot and Twitterrific to exist. But this “Mac users should just use the website” attitude is exactly what I was talking about here as an existential threat to the future of the Mac. People choose the Mac because they want the best experience — not the same experience they can get on a $200 Chromebook. To want to be “consistent across platforms” is a UX self-own: there’s a reason why platforms (plural) continue to exist. And a very few apps manage to escape platforms’ gravity. The Mac losing an app as fundamental to today’s society as Twitter is exactly why macOS needs ‘Marzipan’; without a shared app platform, the app ecosystem is going to leave the Mac behind — get used to web apps There are so many apps that have both Mac and iOS native versions. I’ve worked on some. With small teams. Even a team of one. It can be done, very reasonably. It’s not trivial, but the narrative about how big corporations can’t afford to do it is absurd. Somehow MAGICALLY small third party dev shops can have native iOS and Mac Twitter clients. But Twitter can’t because IT’S TOO HARD. Macs are empirically selling better than ever. This is a matter of public record. But everyone wants to say the Mac is dead. WTF is wrong with this world? We’ve lost all touch with objective reality. it just shows how bad everything else is. mac hardware is crazy outdated they are still selling a macpro from 2013 on their store or crying out loud! MacOS 10.13 is a dumpster fire. But even still, its still better to use than windows or linux"
