["https://mjtsai.com/blog/2024/09/09/apple-watch-series-10"]
title = "Michael Tsai - Blog  -  Apple Watch Series 10"
full_description = "Apple Watch Series 10 is nearly 10 percent thinner than Apple Watch Series 7, Series 8, and Series 9, while offering all the advanced capabilities users love, adding new features, and maintaining all-day 18-hour battery life. An innovative metal back integrates the antenna into the housing of the device itself, combining the two layers into one. The back is perfectly matched in material, finish, and color to the rest of the case, making it appear like the device is made from a single piece of metal. In addition to being thinner, Apple Watch Series 10 is also lighter: Aluminum cases weigh up to 10 percent less than Series 9, and titanium cases weigh almost 20 percent less than stainless steel Series 9. The case also features more rounded corners and a wider aspect ratio, which contribute to a much larger display while only slightly growing the case to new 42mm and 46mm sizes. Fifteen minutes of charging provides up to eight hours of normal daily use, or eight minutes of charging powers up to eight hours of sleep tracking. Faster charging also means users can charge to 80 percent battery in about 30 minutes. I’m not sure that I like that the base size is increasing. With Apple Watch SE being updated in 2020 and 2022, a new model seemed imminent, but it was not updated today. Breathing Disturbances is an innovative new Apple Watch metric that uses the accelerometer to detect small movements at the wrist associated with interruptions to normal respiratory patterns during sleep. Every 30 days, Apple Watch will analyze breathing disturbance data and notify users if it shows consistent signs of moderate to severe sleep apnea so they can speak to their doctor about next steps, including potential diagnosis and treatment. Because overall quality of sleep is important, Breathing Disturbances can also be used to assess restfulness of sleep. Breathing Disturbances can be influenced by alcohol, medications, sleep position, and more. Users can view their nightly Breathing Disturbances in the Health app, where they are classified as elevated or not elevated, and can be viewed over a one-month, six-month, or one-year period."
author = "Michael J. Tsai"
year_published = 2024
