["https://mjtsai.com/blog/2012/08"]
title = "Michael Tsai - Blog - Archive - 2012 - August"
full_description = "Specialist performance will now be directly measured in part by how many accessories they can sell with each hardware item sold. So if you walk in to buy a MacBook Air, the new metrics would encourage sales people to push you to buy cases, hard drives, AirPort base stations, and more. It’s sad that it sounds like Tim Cook is pushing towards a Steve Ballmer–style sales guy strategy. However, an anonymous genius writes: As a current Genius at a very high profile Apple Retail store, I’m happy to report that ifoAppleStore’s (and other’s) sources are either flat-out wrong or highly exaggerated. Very little has changed since Browett has taken over, and what has changed has been overwhelmingly for the better. According to accounts, Cook pushed Johnson “quite hard” about how other channels were selling more Mac’s per-capita than the retail stores. Without Jobs’ support, Johnson found it was nearly impossible to keep Cook and Oppenheimer from switching the chain’s primary purpose from a superior experience to revenues. The Next Web reports that Google has pulled its undocumented weather API. I dread the day when this happens to the also-undocumented Google Reader API. Two-step verification is an optional but highly recommended security feature that adds an extra layer of protection to your Dropbox account. Once enabled, Dropbox will require a six-digit security code in addition to your password whenever you sign in to Dropbox or link a new computer, phone, or tablet. C is not just a simple language. Heck, it’s nowhere near as simple as, say, Scheme or Haskell. C is a simplistic model of the machine, memory, and runtime environment. It provides a few facilities for abstraction, but as a deliberate design choice, it makes sure that there are specific, simple, known ways for programmers to break every abstraction. That’s really what the ultra-simple memory model of C is all about; enabling programmers to break abstractions. That isn’t a mistake or a design failure; That is exactly what the designers of the language set out to do. It is a goal in which they succeeded."
