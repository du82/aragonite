["https://mjtsai.com/blog/2018/02/05/the-experts-have-taken-over"]
title = "Michael Tsai - Blog  -  The Experts Have Taken Over"
full_description = "Bob Burrough drops by the bar to discuss his history as a software engineer, the seven years he spent at Apple, his reasons for leaving, and we ponder why we care so much about this company. I really enjoyed this episode. Burrough has some good stories about the creation of iPhone. The title refers to how he thinks Apple has changed since those days, particularly after Tim Cook became CEO. Cool episode Bob. Just wanted to drop by and say that my experiences with product feature timing was different. You suggested all decisions were made years in advance. I know for a fact it’s not that black and white, and had experiences with shorter fuse decisions. I can corroborate @bob_burrough’s story on the latest The Menu Bar podcast: when Scott Forstall got fired & iOS 7 really kicked off, the engineering feedback loop broke; HI took over, engineering input stopped being welcome. I always assumed this was because they had such a humongous mountain of work to deal with, they didn’t have time to consider other opinions. Burrough says that under Jobs, employees were allowed to call out faults anywhere they saw them, regardless of whether it was in their wheelhouse or not, but under Cook, Apple employees are very much encouraged to stay in their own lanes. I’ve heard a few times that Tim’s management style is, basically, “Don’t bring me problems.” It actually exacerbates problems. When disputes occur -- as they inevitably do in any human endeavor -- instead of being quickly escalated and decisively resolved, they're left to fester. Unresolved issues become institutional baggage. Apple Design Firing History iOS 7 iPad iPhone iPod Jonathan Ive Palm Scott Forstall Steve Jobs Testing Tim Cook […] is another solid episode. (The previous episode with Dan Masters about Twitter and privacy was also good.) The […]"
