["https://mjtsai.com/blog/2024/11/25/the-end-of-delicious-library"]
title = "Michael Tsai - Blog  -  The End of Delicious Library"
full_description = "Amazon has shut off the feed that allowed Delicious Library to look up items, unfortunately limiting the app to what users already have (or enter manually). I’ve pulled it from the Mac App Store and shut down the website so nobody accidentally buys a non-functional app. 20 years go by and there’s some inevitable nostalgia looking back at any art form. But man, Delicious Library exemplified an era of indie app development that, sadly, is largely over. And make no bones about it: Delicious Library was a creative work of art. What drew me to the Mac initially was its industrial design. My uncle had an iMac G4, the floating screen, the swivelling arm – the one that looked like a lamp – and I thought it was a beautiful piece of art. What kept me on the Mac though was the software, the software from third party independent ‘indie’ developers. These apps were made by small teams, individuals even, hand-crafted with a focus on the the beauty and the little details. I had proof that it was possible. That realisation, that it was possible to build apps like this for a living while also focussing on beautiful design, user experience and customer delight was what motivated me in my own way to start building apps. Making a living selling software online could be done, and Delicious Library had shown the way and provided the inspiration. First with Fontcase and then Sketch, both of which I’m proud to say have won an Apple design award as Mac-assed Mac apps. I just did a quick search through my files from the early 2000s, and I found that I’ve used Delicious Library as the example of unique and tasteful software design in so many presentations over the years—both internally and publicly. I love it so much that I see it as the pinnacle of software design. But it has one problem: no web version. Sure, you can export your collections to HTML, but it’s just not the same. Naturally, I wanted to fix that. In fact, I’ve tried—several times. Maybe it’s finally time to stop making design concepts and start building a real, modern web version of Delicious Library."
