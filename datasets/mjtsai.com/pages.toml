["https://mjtsai.com/blog/2016/02/17"]
title = "Michael Tsai - Blog - Archive - 2016 - February 17"
full_description = "Added better error checking in the incoming email handling code to remove the possibility of losing a message under rare circumstances I hit this particular bug many times, so hopefully it’s fixed now. I’m still seeing problems with missing e-mail text. Update (2016-02-22): After e-mailing with Fog Creek, it turns out that the release notes were misleading, and this release did in fact fix the bug with missing e-mail text. When the FBI has requested data that’s in our possession, we have provided it. Apple complies with valid subpoenas and search warrants, as we have in the San Bernardino case. We have also made Apple engineers available to advise the FBI, and we’ve offered our best ideas on a number of investigative options at their disposal. We have great respect for the professionals at the FBI, and we believe their intentions are good. Up to this point, we have done everything that is both within our power and within the law to help them. But now the U.S. government has asked us for something we simply do not have, and something we consider too dangerous to create. They have asked us to build a backdoor to the iPhone. Specifically, the FBI wants us to make a new version of the iPhone operating system, circumventing several important security features, and install it on an iPhone recovered during the investigation. In the wrong hands, this software — which does not exist today — would have the potential to unlock any iPhone in someone’s physical possession. This is really important. Apple cannot decrypt locked phones, so the FBI wants Apple to give them a rewritten iOS that bypasses security. I have no idea why the FBI wants in the iPhone other than to set a precedent. They already have iCloud data and text messages and computers. Because there is nothing the data on the iPhone can tell the FBI that the FBI doesn’t know already. What’s important to remember is that Apple gave the FBI access to everything that exists and additional advice. Apple gave the FBI forensic advice. That fact alone makes this look even more like a backdoor fishing expedition by the FBI."
