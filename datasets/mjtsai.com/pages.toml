["https://mjtsai.com/blog/2023/01/24/macos-13-2"]
title = "Michael Tsai - Blog  -  macOS 13.2"
full_description = "The update adds Security Keys for the Apple ID, allowing for physical two-factor authentication, which offers more protection against phishing and unauthorized account access. The update also rolls out Advanced Data Protection for iCloud to all users globally. macOS 13.2 (22D49) seems to have finally fixed the [widget configuration] issue – although it did take an initial to kickstart the widgets after adding and configuring them. But after that, it seems to work reliably. I just upgraded to macOS 13.2 and now I see this in the Privacy & Security prefs? Uhh.. okay, I guess? I mean… did I have a choice? I clicked Allow because I’m a crazy person and it asked for my password and then updated an unnamed system extension and rebooted… Why is my Mac doing all this annoying shit? Oh, right, since I rebooted to install macOS 13.2 it “helpfully” turned Bluetooth back on. Sigh. The latest version of macOS Ventura breaks compatibility with Pioneer's lineup of USB-connected CD/DVD/Blu-ray drives for the Mac. Bug iCloud iCloud Advanced Data Protection Mac macOS 13 Ventura macOS Release macOS Widgets Spotlight"
