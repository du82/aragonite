["https://mjtsai.com/blog/2003/02"]
title = "Michael Tsai - Blog - Archive - 2003 - February"
full_description = "I agree with Bill Bumgarner that this is not a bug in the OS X Finder. The old behavior always annoyed me. However, I think the warning message should be more specific and say that you are replacing a folder. As to case-insensitive, case-preserving file systems…I like them. Newton users never cease to amaze. Maybe their favorite product is only mostly dead. HyperCard? That’s all dead. This evening, my sister will play in the Engineers’ first NEWMAC semifinals. Apparently there will even be a webcast. Mike Zornek has posted some thoughts on drawers in Mail.app. I don’t like them because they mess up keyboard navigation. I’m withholding judgement until I read more of the book, but I definitely agree with the complaint about using Mathematica notation instead of math. I like TextWrangler. It’s much more capable than BBEdit Lite, so it’s plenty of text editor for a lot of people. BBEdit Lite was too good to give away. $50 for TextWrangler seems fair all around, although I think Bare Bones should have included AppleScript support instead of C programming features. My guess is that programmers will want the extra features that are available in BBEdit, anyway. There’s been some grousing on the message boards to the effect that free tools duplicate many of TextWrangler’s features. These people might also enjoy the free tool that duplicates many of Photoshop’s features. Let us think the unthinkable, let us do the undoable. Let us prepare to grapple with the ineffable itself, and see if we may not eff it after all. —Douglas Adams Ned Batchelder just discovered this, and it was news to me, too. It’s even faster than using Watson. Not only that, but the old way (using creator codes) could take advantage of the file system’s catalog to do the search really fast. I had hoped that the Safari team would come up with something better than tabs. As much as they fill a need for some people, I think there’s got to be a better way to provide the functionality. And a new custom control for metal tabs? Hideous."
