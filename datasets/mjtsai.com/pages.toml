["https://mjtsai.com/blog/2011/07"]
title = "Michael Tsai - Blog - Archive - 2011 - July"
full_description = "This script is terrible to start with, but starting in OS X Lion, it simply doesn’t work. It fails with cryptic errors, and FastScripts faithfully reports them. Apple is rejecting FastScripts for the behavior of a faulty script that is bundled with OS X Lion. FastScripts is one of my favorite utilities. Hopefully, the App Store version’s functionality will not be significantly curtailed by Apple’s upcoming application sandbox requirements. Starting in November, applications will only be able to send Apple events if they apply for a temporary exception on a per-target-application basis. FastScripts’ job, of course, is to send Apple events to any application I might have installed. The store was removed because Apple rejected any updates which included it, period. They also rejected any updates which stated that Apple required its removal, or indeed any mention of ‘compliance with App Store guidelines’. It was further rejected for the cardinal sin of allowing users to create a Kobo account within the app. Then it was rejected for providing a link to let users create an account outside the app. Then it was rejected for simply mentioning that it was possible to sign up, with no direction on where or how one could do that. Then it was rejected for making any mention of the Kobo website. Then for any mention of ‘our website’ at all, in any language. We additionally cannot make any assertions that Kobo provides content for sale, however obliquely. We wanted to let you know that we’ve updated our Kindle app for iPad, iPhone, and iPod touch. The big change is that you can now use the Kindle app to read over 100 Kindle newspapers and magazines including the Economist, as well as share favorite passages from your reading via Facebook and Twitter. In order to comply with recent policy changes by Apple, we’ve also removed the “Kindle Store” link from within the app that opened Safari and took you to the Kindle Store. One of the big complaints with Xcode 4.0 was stability. We’d long been spoiled by the comparative stability of Xcode 3.2, so to go back to pre-3.2 levels of stability was incredibly frustrating. This new version feels a lot more stable. Assertion failures are a rarity, rather than part of the daily workflow as was the case in 4.0."
author = "Michael J. Tsai"
