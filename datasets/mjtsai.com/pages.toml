["https://mjtsai.com/blog/2005/11"]
title = "Michael Tsai - Blog - Archive - 2005 - November"
full_description = "John Vlissides, co-author of the extremely influential Design Patterns book (among many other publications), died Thursday after a long struggle with cancer (via Lambda). The c2 wiki has a page of remembrances from people who knew him. I read the GoF book in 1996 and thought it was a revelation. I’ve since realized that much of the fuss was about breaking the shackles of C++. Yet it still had an enormous impact on the industry, and it deserves to be part of the canon because of the vocabulary it established. On the one hand, there’s Unsanity (the developers of APE) and their third-party developers, who are just trying to make a living by serving a market need. On the other hand, there are the application developers, many of whom have observed an uptick in tech-support volume (and its associated costs) as the result of interactions with haxies. And on the gripping hand, there are the customers, who want the capabilities offered by haxies (and thus enabled by the installation of APE), and who have every right to expect a stable and functional operating environment. Adam Knight shows how to reduce the amount of time that you have to hold down the mouse button before you can drag text (via Erik Barzeski). Once Tiger hit the streets, however, I was less than impressed with the real-world usability of Spotlight, as I discussed in this entry on my personal blog. When I wrote that entry back in May, I focused a fair bit on the interface and the performance. Now that I’ve had several months to adjust to using Spotlight, I’m ready to follow-up with some additional observations gained over the last six months, and some recommendations on what I’d love to see in “version 2.0” of Spotlight. But before that, let’s revisit a few of my first impressions of Tiger’s search technology. I like the idea of Spotlight, but I’ve turned it off. Trying to search with it would lock up the Finder or the Spotlight menu for minutes at a time, and it would rarely find what I was looking for, anyway. I’ve seen it work well on Macs with a small number of files, but on my main Mac (a dual 2 GHz G5 with 2.5 GB of RAM but lots of files) it’s worse than useless because it slows everything down. Fortunately, Path Finder has a good file search feature."
