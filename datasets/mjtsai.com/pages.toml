["https://mjtsai.com/blog/2017/09/04"]
title = "Michael Tsai - Blog - Archive - 2017 - September 4"
full_description = "Notes aren’t on the list though. They have their own note-specific backup restore option, but it’s at the level of an individual note and there’s no version restore, only the ability to undo a delete for 30 days by restoring a Note from “recently deleted”. (BTW, if you Share a Note only the Owner can “delete” — but anyone with Edit privileges can remove all content — and since there’s no version undo that means anyone who can edit a Note can delete it without a recovery option.) You’d have better luck restoring a previous version of a random text file—either from the Versions database or Time Machine—than a note from the Notes app. Backup Contacts iCloud iOS iOS 10 Mac Mac OS X Versions macOS 10.12 Sierra Notes Reminders Time Machine Anniversary Audio Hijack Pro BBEdit Default Folder X DreamHost GraphicConverter History iOS Mac Panorama X PCalc Rogue Amoeba The Media The Omni Group Web A leaked Apple “Visual/Mechanical Inspection Guide” shared this afternoon by Business Insider provides some insight into how Apple’s repair policies work, highlighting how Apple determines when to offer an in-warranty repair, an out-of-warranty repair, or a denial of service. These rules don’t apply to devices covered by AppleCare+, as that warranty entitles users to two device replacements or repairs, even for accidental damage, so long as the fee is covered. For out-of-warranty repairs, Apple charges $130 to $150 for screen repairs and $300 to $350 for other damage. With AppleCare+, a screen repair costs $29 and other damage costs $99 to fix. I am very sad to announce that ProTube was removed from the App Store by Apple on September 1, 2017. This comes after multiple requests and threats by YouTube which ultimately led Apple to suddenly pulling the app from the App Store. ProTube and many other 3rd party YouTube apps on the App Store have been targeted by YouTube with takedown requests. YouTube first requested Apple to remove my app well over a year ago, initially just stating that my app violates their Terms of Service. This was a generic takedown request they sent to many YouTube apps at once. They later started going into more detail, even stating that I could not sell the app as that alone violates their ToS. They basically wanted me to remove every feature that made ProTube what it is – that includes the player itself that allows you to play 60fps videos, background playback, audio only mode and more."
