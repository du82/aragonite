["https://mjtsai.com/blog/2012/11/06/mac-freezes-waking-from-screen-saver"]
title = "Michael Tsai - Blog  -  Mac Freezes Waking From Screen Saver"
full_description = "Since updating to Mountain Lion, or perhaps later versions of Lion, I’ve seen a bug where the Mac freezes when coming out of the screen saver. There’s no way to unlock the screen. It has not actually kernel panicked, as applications continue to run and I can ssh in, however the Mac is essentially unusable until it’s been shut down—via ssh, as that’s a bit cleaner than using the power button. This problem didn’t occur every time I used the screen saver, but at its peak it was happening nearly once a day. I tried different screen savers, but that didn’t help. What did help was disabling the screen saver entirely (setting it to “Start after: Never”) and instead using Energy Saver’s “Display sleep” setting to lock the screen. (I had been using this before, but with Energy Saver set to kick in after a longer delay than the screen saver.) Using these settings for nearly a month, the problem has not recurred. However, I’m still seeing various display waking problems that have been happening since Lion. Sometimes both screens remain blank (but with the backlight on) until after I’ve entered my password and pressed Return. Other times, the internal display wakes but the external one doesn’t. In that situation, the workaround is to unplug and replug the display. The window positions get all messed up, then Moom fixes them automatically. (It's really not just stability that fell into disrepair beginning with the loveliness of 'back to the mac' Lion. I still think Snowy is the pinnacle of GTD in OS X on multiple fronts.) My favorite wake-from-sleep bug so far: make your Mac ask for your password on wake, then activate Mission Control; wait for it to sleep. Upon wakeup you'll have your desktop picture on a linen background, and on top of it a window asking for your password... but you can't type in that window! You're stuck in that kind-of Mission Control mode. It's frustrating, until you realize that the button far at the bottom to return to the login screen works, and from there you can move on."
