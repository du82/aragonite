["https://mjtsai.com/blog/2004/10"]
title = "Michael Tsai - Blog - Archive - 2004 - October"
full_description = "Beware of using this setting in DropStuff (a.k.a. --compression_method=6 with the stuff command). I found several folders that this would compress very tightly, but that couldn’t be unstuffed because StuffIt aborted with error 17999. Allume support confirmed that this compression method is “not working” and will be fixed in an upcoming maintenance update. I upgraded to Retrospect 6, after all, because I missed its snapshots and good utilization of storage space. For regular backups to a local FireWire disk, it works great. However, it still doesn’t support optical drives that Apple itself is shipping, and the Duplicate feature, which I used to use for synchronization over the network, is useless as it messes up file ownership and permissions. These days, the only synchronization software that I’ve been able to use successfully is Synk. The current version uses hundreds of MB of RAM and is very slow, but apparently that will be fixed in 5.1. Gary Robinson, who recently released Goombah 0.501, thinks that Apple doesn’t (or perhaps shouldn’t) believe its “people want to own their music” rhetoric: One of the first things we did when Microsoft acquired Virtual PC was some substantial user research and usability testing. We sat in customers homes, brought them into our usability lab and really dug into what people wanted to use this product for, and what they were having problems with. A number of readers have pointed out that they would benefit from seeing an example of what I’ve been trying to say about the limitations that erasure has imposed on Java Generics in relation to other parameterized type systems, especially the most widely-known and used system: C++ templates. In this article I shall show a sequence of examples that demonstrate the issues, as well as a technique to compensate for the lack of latent typing in Java Generics. TextMate is hyped as a BBEdit-killer for $39 ($49 starting in November). While it incorporates some undeniably clever ideas, my first reaction is that it feels all wrong. The first paragraph of TextMate’s Web page says:"
