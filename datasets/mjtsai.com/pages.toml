["http://mjtsai.com/blog/2011/02/15/app-store-subscriptions"]
title = "Michael Tsai - Blog  -  App Store Subscriptions"
full_description = "Apple is of course framing this as a new feature, but one can also look at it as removing features and destroying business models. Apple is changing the rules for existing apps and services. It’s a bait and switch. If you don’t comply and pay the Apple tax, you’re banned from writing a native app for the iPhone, iPad, and iPod. (Of course, you can still use the sweet SDK/shit sandwich and write a Web app that runs in Safari.) Most of the press coverage I’ve seen is along the lines of the ArsTechnica headline, “Apple: if we get you subscribers, we deserve a cut,” which sounds reasonable. However, combining Apple’s various statements produces a very different picture: Publishers that have a significant number of non-Apple customers probably don’t want to raise prices across-the-board. Yet with current margins they may well lose money if they have to give up 30%. In some cases it may be possible to remove features from the app. For example, have the app be just a viewer, and make the user type the URL in Safari (no linking, remember) to browse and purchase content. (It’s actually not clear whether even this will be allowed.) Other publishers may be forced to withdraw from the App Store. I don’t understand what Apple expects Amazon, Netflix, and others—and their customers—to do. Apple is setting the rules so that if you want to compete with iBooks or iTunes (even if you were around first) either your app will not be as smooth as Apple’s or your prices will be higher. The technology itself has the potential to be great for customers (and publishers) by making it super-easy to buy content. Apple’s policies, however, seem to ensure that customers will either see their app experiences degraded or their prices increased. I wonder what Apple's margins on e.g. music and movie content are? Is it going to insist on keeping 30% there, too? And if not, why not? The best guesses I've been able to find say it's about 20% margin there. In other words, Apple insists on the full retailer's cut, even for stuff they aren't directly selling or marketing."
author = "Michael J. Tsai"
year_published = 2011
year_updated = 2018
