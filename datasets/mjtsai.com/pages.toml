["https://mjtsai.com/blog/2019/12/10/mac-pro-available-to-order"]
title = "Michael Tsai - Blog  -  Mac Pro Available to Order"
full_description = "More than two years after Apple promised a new modular high-end desktop machine for its professional users, the new Mac Pro is now available for purchase, as is its companion display, the Pro Display XDR. Apple is accepting orders for the Mac Pro and the Pro Display XDR, with Mac Pro delivery estimates at one to two weeks after an order is placed. So it looks like some people may receive them just before the end of the year. I’m happy that the new Mac Pro exists, but for my purposes it feels like they built the wrong product, too late. Apple has a great history of making modular desktop Macs, at sane prices, and this is not that. It’s also not the developer Mac that you might have expected given Apple’s 2017 statements about that pro market. It seems like there’s still a hole in the lineup. People will make do with iMacs and MacBook Pros, or buy the Mac Pro if they really need it, but that’s not the same as being able to buy the computer that you want. External Thunderbolt peripherals could in theory address a lot of needs, but that market just doesn’t seem to have developed very well, and Macs don’t have enough Thunderbolt ports. Meanwhile, the iMac Pro hasn’t been updated since 2017 and is likely slower than the regular iMac. Below, we’ve listed the available upgrade options from the base machine, which is equipped with a 3.5GHz 8-core Intel Xeon W processor, 32GB RAM, Radeon Pro 580X, 256GB SSD, no Apple Afterburner, and no wheeled frame. The base model’s SSD is half the size of the minimum SSD on the 16-inch MacBook Pro, and it can only be upgraded to 4 TB of storage (vs. 8 TB for the MacBook Pro). I wonder how the base model’s CPU will compare with the iMac and MacBook Pro, given that it only Turbo Boosts to 4 GHz. Just a reminder before it goes live, the Mac Pro $6k base model has equivalent performance of a < $1500 commodity system. Apple hardware/software deserves a premium, just not 4x. I ended up going for a 27” i9 iMac after first seeing the price and it's faster than the base Pro will be at half the price 🤷‍♂️"
author = "Michael J. Tsai"
