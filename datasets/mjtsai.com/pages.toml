["https://mjtsai.com/blog/2012/10"]
title = "Michael Tsai - Blog - Archive - 2012 - October"
full_description = "This is a list of miscellaneous resources I’ve come across dealing with data visualization in several forms. These are mostly utility libraries and viewers that I had scattered all over the place and that are best concentrated on a single page for reference. American Express, meanwhile, has offered a brief note of concern for my well-being, and a vague promise of assistance as needed. If that help is needed, I should just call, visit their website, or tweet at them. I should definitely not, however, email them, as that would obviously be a ridiculous way to communicate. Is it ever reasonable to send a customer an e-mail that specifically says not to reply? I’ve always been told, but not really believed, that financial companies don’t like to communicate via e-mail out of security/privacy concerns. But what could be more private than a tweet? Check the Weather is my new favorite iPhone weather app. It has a very clean design—just a few screens that you can swipe through—but includes the hourly temperature and precipitation information that I care about. It also has extended forecasts for 9 days ahead and supports Dark Sky. The Idlewild font in the initial version really put me off, but with version 1.1 you can choose Helvetica or Futura. Previously, I had used My-Cast for years. I still like it, but Check the Weather requires fewer taps. Update (2013-01-07): Now that it’s winter, I’ve stopped using Check the Weather. It does not provide any information about the kind or amount of snow to expect. Scrolling is exhausting — it never ends. There is no sense of accomplishment. I once heard someone refer to infinite scrolling on websites as “a game you can never win.” I prefer pagination for a different reason. With scrolling, I feel like I have too much control. I constantly have to “measure” how far to scroll and make the proper precise movement. My eyes have to track the content as it moves. It’s exhausting because of the concentration it requires compared with just pressing a button and having the right thing happen."
