["https://mjtsai.com/blog/2004/05"]
title = "Michael Tsai - Blog - Archive - 2004 - May"
full_description = "Floating-point arithmetic is considered an esoteric subject by many people. This is rather surprising because floating-point is ubiquitous in computer systems. Almost every language has a floating-point datatype; computers from PCs to supercomputers have floating-point accelerators; most compilers will be called upon to compile floating-point algorithms from time to time; and virtually every operating system must respond to floating-point exceptions such as overflow. This paper presents a tutorial on those aspects of floating-point that have a direct impact on designers of computer systems. It begins with background on floating-point representation and rounding error, continues with a discussion of the IEEE floating-point standard, and concludes with numerous examples of how computer builders can better support floating-point. Two days later, I had finished this beast of a script. It'll take some Movable Type Berkeley DB files, pry as much data out of them as it can (posts, categories, authors, comments), and blast it all out to simple text files that you can use with PyBlosxom. And that, now, is what is running this weblog. Microsoft won’t say whether it funded Brown’s book, though it has supported his organization (via Gary Robinson). The best part of this story is the idea that Tanenbaum wrote Linux’s monolithic kernel. SpamSieve is fully compatible with Entourage 2004, and that combination in fact works better than SpamSieve and Entourage v.X. The reason is that Entourage 2004 lets you uncheck “Do not apply other rules to messages that meet these criteria” for AppleScript rules. This means that spam messages from Exchange, Hotmail, and IMAP accounts can now be moved to the spam folder (by setting up a second rule), even though Entourage cannot move these messages via AppleScript. This blog now runs on WordPress. It was surprisingly easy to install, and the Movable Type importer worked well except that it didn’t fill in the post_date_gmt column. My Movable Type permalinks were of the form:"
