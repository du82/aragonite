["https://mjtsai.com/blog/2002/10"]
title = "Michael Tsai - Blog - Archive - 2002 - October"
full_description = "Lazy, or call-by-need, languages schedule work dynamically by building closures, and shun side effects; strict, or call-by-value languages avoid the overhead of closures and may exploit side effects. Each style has complementary advantages and complimentary adherents. The gap between the lazy and strict camps has two dimensions, which we shall name style and models. Recent developments suggest that along both dimensions the gap is shrinking. We list some commercial applications of each kind of language, and examine each dimension of difference in turn. I just released DropDMG 2.0, a $10 shareware utility for making disk images. The main Web page has lots more information, but I wanted to list some of the highlights here: Case in point: the _msgSend routine of ObjC is in /usr/lib/libobjc so every message sent in any piece of ObjC code has that 11 cycle penalty tacked onto the beginning, and then it gets the 9 cycle PIC penalty once you actually get there... every object function (method) call in ObjC goes through that. iTunes recompiled by GCC/MachO was 30% slower at MP3 decompression than with CodeWarrior/PEF. Lame MP3 Encoder was 50% faster with CodeWarrior PEF than with GCC/MachO, both on OS X. (both are Carbon apps) It may turn out to be the case that one of the biggest benefits to come out of the Mozilla project is XUL, which seems to be one of the first solid frameworks for true GUI portability (WORA). Basically, you design your interface in XML, glue the events together with some JavaScript, and call binary XPCOM classes (virtually the same as Microsoft COM classes) when you need to do something fast in C++ that doesn’t need a UI. And UI’s never need to be that fast, so this is a good division of labor. Theoretically, you get cross-platform Nirvana. And thanks a lot of hard work all the little platform-specific touches (like Alt+Space N to minimize a window) are finally right, which is one of the biggest weaknesses of previous efforts at WORA like AWT and Swing. If I had to start developing a new commercial app I would seriously look at XUL."
