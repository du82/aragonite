["https://mjtsai.com/blog/2011/07/25"]
title = "Michael Tsai - Blog - Archive - 2011 - July 25"
full_description = "We wanted to let you know that we’ve updated our Kindle app for iPad, iPhone, and iPod touch. The big change is that you can now use the Kindle app to read over 100 Kindle newspapers and magazines including the Economist, as well as share favorite passages from your reading via Facebook and Twitter. In order to comply with recent policy changes by Apple, we’ve also removed the “Kindle Store” link from within the app that opened Safari and took you to the Kindle Store. One of the big complaints with Xcode 4.0 was stability. We’d long been spoiled by the comparative stability of Xcode 3.2, so to go back to pre-3.2 levels of stability was incredibly frustrating. This new version feels a lot more stable. Assertion failures are a rarity, rather than part of the daily workflow as was the case in 4.0. Xcode 3.2 was perhaps the only version of Apple’s IDE that’s ever been as stable for me as their non-developer software. Hopefully they can get that back with 4.2."
