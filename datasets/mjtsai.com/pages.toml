["https://mjtsai.com/blog/2003/12"]
title = "Michael Tsai - Blog - Archive - 2003 - December"
full_description = "There’s a new round of spams that can be hard for SpamSieve to catch if it hasn’t seen many of them before. They have subjects like: Generally, my approach with SpamSieve is to make it better at learning from tactics used in spam messages, rather than try to match transient characteristics with a countless number of rules. Sometimes, however, rules work great, and if you add the ones below to your copy of SpamSieve 2.1, it should be easy to catch these new spams. Joel Spolsky reviews The Art of UNIX Programming and discusses Windows/Mac vs. Unix culture differences. Jan Erik Moström pointed me to Natural Docs, a clean, JavaDoc-like utility that supports several languages. John Gruber and Christopher Clark discuss keyboard shortcuts. I’m more optimistic than Gruber in that I think Apple can come up with a good system for user-customizable keyboard shortcuts, without applications having to explicitly register them. Instead of having a preferences panel, there should be a more direct interface, like Menu Master’s. Apple writes the menu manager, after all. Also, Joshua Dady pointed me to /Library/Scripts/Mail Scripts/Scripts Menu, which has instructions for adding keyboard shortcuts to menu scripts. I must admit that my own applications are currently guilty of not supporting Close All Windows and Minimize All Windows. I’m working to correct that. For Cocoa developers, here is a category that will help: Don’t forget to implement -validateMenuItem: so that the commands are disabled when there are no windows. OmniOutliner currently supports the commands, but gets the validation wrong. Goombah is an intriguing new application/service that examines your iTunes music library and compares it with other users’ libraries. It then recommends tracks that you might like and lets you listen to them using the iTunes Music Store. Jonathan Rentzsch is back with a post about the macros he uses to tame Cocoa’s enumeration idiom. Here’s the macro I’ve been using: Jonathan Rentzsch has written a great article about what he loves and hates about Objective-C. [Update (2015-05-09): Here’s an archive.org link since the original site is down.] I’ve wanted to write this article for a long time, but now Rentzsch has saved me the time and also done a better job than I probably would have. Now I can just cover the places where I disagree or have something to add."
