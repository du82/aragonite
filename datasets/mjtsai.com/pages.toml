["https://mjtsai.com/blog/2024/07/12/transferring-google-photos"]
title = "Michael Tsai - Blog  -  Transferring Google Photos"
full_description = "Beginning today, Apple and Google are expanding on their direct data transfer offerings to allow users of Google Photos to transfer their collections directly to iCloud Photos. This complements and completes the existing transfers that were first made possible from iCloud Photos to Google Photos and fulfills a core Data Transfer Initiative (DTI) principle of reciprocity. Apple says that the service will be available in over 240 countries and regions around the world. The service isn’t available for child accounts or Managed Apple ID accounts. You also can’t import photo and video data to iCloud while Advanced Data Protection is enabled. While Google has long permitted users’ retrieval of data it holds, it has not been the most enthusiastic supporter of direct transfers away from its services. This distinction becomes increasingly important as users store more data with cloud-based services instead of keeping local copies — they may not have space to download all their pictures if they trust the cloud provider’s hosting. Google Photos iCloud iCloud Advanced Data Protection iCloud Photo Library iOS iOS 17 Mac macOS 14 Sonoma Photography Photos.app Now for the low-hanging fruit of Mail, Contacts, Calendars. It is absurd that that one hasn't been tackled yet when Imapsync has basically solved this problem for years, for any IMAP accounts."
