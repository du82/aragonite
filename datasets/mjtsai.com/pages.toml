["https://mjtsai.com/blog/2007/10"]
title = "Michael Tsai - Blog - Archive - 2007 - October"
full_description = "BBEdit 8.7.1 is a maintenance update, but it also includes some nice enhancements that I’ve been enjoying, such as being able to drop files from Disk Browsers into other applications and being able to check spelling when using a codeless language module. Another great Mac OS X review from John Siracusa, though it’s not as long as the Tiger one. Here are some highlights: In action, it’s indistinguishable from magic. You write these little text files with script-like bang-pound lines using this weird C-like language and you have essentially free reign to grope all over the kernel. In the end, Apple made the hard choice instead of the easy one. I think it will pay off, though the short-term consequences could be pretty grim. After all, just look at how long it’s taking to get an Intel-native version of Microsoft Office for the Mac. Should we expect a 64-bit Cocoa version in, say, 2012? And I have no idea what Adobe’s going to do about 64-bit versions of its products. That’s many millions of lines of Carbon code between those two companies alone. We may be in for a rough patch, so buckle up. Hey, what do we have here lurking under /System/Library/PrivateFrameworks in Leopard? Why, it appears to be a new framework: CoreUI.framework. Whatever could that be for? Surprise! Every piece of the user interface in Leopard is being drawn in an entirely new way that incorporates the best of the bitmapped and vector styles. The new “Show warning before changing an extension” and “Grid spacing” options in the Finder: It’s hard for me not to use profanity at this point, so thoroughly do these two additions infuriate me. On the one hand, I’ve been wishing, hoping, and sometimes begging for these features for years, and I’m glad to finally see them in Leopard. But on the other hand, actually using these features and experiencing how much more pleasant they make my daily life on the Mac—as I knew they would—only reminds me of how stubbornly Apple refused to add them for the past six years!"
