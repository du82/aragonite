["https://mjtsai.com/blog/2004/06"]
title = "Michael Tsai - Blog - Archive - 2004 - June"
full_description = "Developing for Dashboard is nothing like developing for Konfabulator. There was almost zero chance that I would develop a a widget for Konfabulator. I’d have to learn a completely new platform, and anyone who wanted to use my widget would have to buy a license for that platform’s runtime. Dashboard gadgets, on the other hand, are Web pages. I already know HTML and CSS, and I have a collection of tools for working with them. The runtime is free. If I want to use Cocoa or Java, I can do that, too. John Gruber says: In terms of attracting hobbyist-level developers, Dashboard is going to be an order of magnitude more approachable than Cocoa application development. If you know HTML and CSS, you can design a gadget layout. If you know JavaScript, you can program a gadget. I can’t think of any possible way that gadget development could be based on something that would enable more Mac nerds to get up and running writing their own gadgets. The Konfabulator developers are in an unfortunate situation, partially of their own making, but what’s getting lost in that coverage is that the Mac is now a platform for writing client-side Web applications. The photocopier line is especially silly, since Spotlight and Dashboard look like responses to Longhorn (or other software, depending on your perspective). Apple should grow up. To begin with, they, the beggars—and some of the undead minions—all want an “invite.” Not an invitation, mind you, they want an “invite.” Ben Hammersley has posted a short Perl script that collects TODO comments from source files and puts them into an RSS feed. I read TODO comments in BBEdit’s search results browser, but I'm tickled that finding and displaying them is so easy with Perl’s File::Find and XML::RSS. Joel Spolsky’s essay on how Microsoft lost the API war is typical Joel. It’s informed and well-written, and yet because some of the minor points and assumptions are unsupported, I don’t quite believe the conclusion. When I read an essay at Daring Fireball (which you should support), the points usually click into place. I can often see early on where Gruber is going to take an argument and how he’ll get there. Then it’s just a matter of watching the exquisitely crafted dominos fall. Would Joel on Software read like that if I had a Windows background instead of a Mac background?"
