["https://mjtsai.com/blog/2007/07/01/old-meets-new"]
title = "Michael Tsai - Blog  -  Old Meets New"
full_description = "The iPhone User’s Guide contains lots of interesting information about the iPhone. But the most interesting thing, to me, is that the document was created on a Mac using Adobe FrameMaker 6. This version of FrameMaker was released in 2000 and ran under Mac OS 8 and 9. FrameMaker 7.0, the last version that ran on Macs, was released in 2002. Old Mac OS software can run under Mac OS X in Classic, but only on PowerPC-based Macs, the last of which was discontinued almost a year ago. Apple is apparently using some old software and hardware to document its newest product. I totally understand; FrameMaker 6 is a great piece of software, and there’s nothing like it for Mac OS X. I had a brief flirtation with SGI back in the early 2000s, and they were still producing thousands, maybe hundreds of thousands, of pages of technical documentation on Framemaker. I really can't blame Apple for sticking with it. There are things Framemaker does for long-document publishing that nothing can touch these days. Don't get me wrong; I think the typesetting engine in InDesign is the greatest things since hot lead. But for managing books with lots of cross-references and figures and whatnot, it's just not there. I wonder if anybody uses Framemaker to produce anything other than technical documentation though? I've never actually seen it used in any other context. A friend works at Apple on their technical publications, and says that they use Frame for all of them. Personally, I love Frame, enough so that I've got it running in Sheepshaver at home. InDesign just isn't the same. Does anyone know why it is still available for Solaris SPARC and not OS X (or even Linux for that matter)? If it can run on one POSIX/X11 system it can probably be compiled for just about any other Unix-y system out there. The scuttlebutt is that Apple's been trying to wean themselves off FrameMaker, and that Pages is supposed to be the replacement, when it gets powerful enough. (It's already good enough for some of their documentation.)"
