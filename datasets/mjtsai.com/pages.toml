["https://mjtsai.com/blog/2009/08"]
title = "Michael Tsai - Blog - Archive - 2009 - August"
full_description = "The fact that the version number has gone from 3.1 to 3.2 is deceptive to the huge amount of improvements that have been added. Film playback is a bit weird as the new-style window will hide its title bar after a while. The idea sounds all nice, clean and efficient but I find all the additional appearing / disappearing animation triggered by it worse than the waste of space a persistent title bar would have caused. The playback controls now appear on top of the film and fade out as well (making the width of the controls the minimum width a film can be played back at). Unfortunately the controls and the ‘scrubber’ have a fixed width and don’t grow width-wise with the window to allow easier jumping inside films. Although the playback controls can be moved to a position of your choice in the movie, QuickTime Player immediately forgets about your preferred position for them and displays them in the standard position for the next film you open. As for the new QuickTime Player, I have numerous observations of behavior and gotchas. As much as Apple might have you believe that the new version folds in all the features that were available in QuickTime Pro, I most heartily assure you it’s only a half-baked effort. I wish I’d known about those keyboard shortcuts earlier. Perhaps this is a third-party opportunity for a basic QuickTime editor that isn’t iMovie. As one of the few feature changes in Snow Leopard, you’ve probably seen how Expose now works from the Dock, arranges windows in an easier-to-read layout, and enables you to move content between applications. Here are a few shortcuts that will make Expose even more useful… Rosetta only takes up a few megabytes of drive space, and without it older programs simply won’t run, so if you have such programs, that option is worth checking.…I can only assume that making Rosetta optional is an attempt by Apple to goad users to upgrade their apps and to shame developers who still haven’t recompiled their apps to run on Intel chips. But given that most everyday users have no idea which of their apps are Intel-native and which are PowerPC, this seems unnecessarily harsh."
