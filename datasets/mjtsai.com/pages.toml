["http://mjtsai.com/blog"]
title = "Michael Tsai - Blog"
full_description = "On Wednesday, Mozilla introduced legal updates to users of Firefox, and something feels off. I read, and re-read the new Terms of Use and while much of it reads like standard boilerplate from any tech company, there’s a new section that is unexpected: When you upload or input information through Firefox, you hereby grant us a nonexclusive, royalty-free, worldwide license to use that information to help you navigate, experience, and interact with online content as you indicate with your use of Firefox. The community has also zeroed in on this phrase, with contributors asking directly what up with that? Ultimately, Microsoft specifically disclaims ownership of your content - something Mozilla does not do. When you upload or input information through Firefox, you hereby grant us a nonexclusive, royalty-free, worldwide license to use that information to help you navigate, experience, and interact with online content as you indicate with your use of Firefox. We’ve seen a little confusion about the language regarding licenses, so we want to clear that up. We need a license to allow us to make some of the basic functionality of Firefox possible. Without it, we couldn’t use information typed into Firefox, for example. It does NOT give us ownership of your data or a right to use it for anything other than what is described in the Privacy Notice. In addition to the Terms of Use, we are providing a more detailed explanation of our data practices in our updated Privacy Notice. This is the same thing Adobe did. It’s not great to put the key information in what is essentially a FAQ that doesn’t seem as legally binding as a ToS. And the clarification says that they can only use the data as described in the Privacy Notice, while the actual Terms of Service say that that Mozilla gets “all rights necessary” including using it as described in the Privacy Notice. So it seems like the Privacy Notice cannot constrain their behavior, but they want us to think it does. This situation reveals a recurring issue in how Mozilla communicates with its user base. I believe this represents a fundamental disconnect in communication strategy. Internally at Mozilla, I’m certain there were extensive discussions, agreements, disagreements, and careful consideration about how to phrase and present these changes. The team likely developed a clear understanding of the what, where, and why behind these policy updates."
