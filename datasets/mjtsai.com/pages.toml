["https://mjtsai.com/blog/2006/01"]
title = "Michael Tsai - Blog - Archive - 2006 - January"
full_description = 'Edward Tufte says: "PowerPoint is Evil." This got me thinking... What if Darth Vader — my favorite fictional bad guy — gave a formal presentation? How would it look? How would it compare to the presentation style of Yoda, the wise Jedi master? GPT replaces Apple Partition Map (APM) as the boot partition scheme for Intel-based Macs. And therein lies the rub. Intel-based Macs can’t boot from older APM drives, and PowerPC-based Macs can’t boot from newer GPT drives. This appears to be a permanent situation—each scheme makes incompatible assumptions about the layout of physical block 1 on the disk. While GPT was designed to be compatible with Master Block Record (MBR, the PC’s old partition scheme), it doesn’t play nicely with APM. The main reason I haven’t switched over to using the iMac Core Duo as my main machine is that my DiskWarrior CD can’t boot it, and DiskWarrior can’t repair the internal drive using Target Disk Mode because of the new partitioning. It would be acceptable for applications to offer to install Smart Crash Reports, so long as they provide a fair description of what it does and how it works. I think developers are wary of this, however, because they realize that a fair description of SCR sounds rather unsavory—that users will be turned off if the first thing they see from a new application is a dialog box talking about crashes and unsupported modifications to Apple’s Crash Reporter application. It took six versions, but I’m pleased that iPhoto now organizes the image files in its library by roll, rather than in lots of little folders alongside its metadata files. By some odd coincidence, three times this week I’ve come across Mac OS X users who don’t know the benefits of logging out. That is, they either leave the machine running at night (still logged into their user account), or they put the machine to sleep. They rarely—if ever—log out, and only reboot when “something is wrong” or after installing a system update.'
