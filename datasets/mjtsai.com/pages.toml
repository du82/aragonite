["https://mjtsai.com/blog/2012/11"]
title = "Michael Tsai - Blog - Archive - 2012 - November"
full_description = "It’s even harder to remove the iPhone 5 from the Elevation Dock than I expected. It requires two hands almost every time, and it makes me want to throw the Dock out the window. The Lightning connector on Apple’s cables not only wasn’t designed for this use, but substantially hinders it. The C preprocessor has long been a source of problems for programmers and tools alike. Programmers must contend with widespread macro pollution and include-ordering problems due to ill-behaved headers. Developers habitually employ various preprocessor workarounds, such as LONG_MACRO_PREFIXES, include guards, and the occasional #undef of a library macro to mitigate these problems. Tools, on the other hand, must cope with the inherent scalability problems associated with parsing the same headers repeatedly, because each different preprocessing context could effect how a header is interpreted---even though the programmer rarely wants it. Modules seeks to solve this problem by isolating the interface of a particular library and compiling it (once) into an efficient, serialized representation that can be efficiently imported whenever that library is used, improving both the programmer's experience and the scalability of the compilation process. There’s a PDF of his slides. This seems like a great idea that will improve compilation times while maintaining compatibility. Recently I had some free time so I broke down this enum situation and also included some of the history and present and also maybe even a little bit of the future of enumerated types in Objective-C. I think Netflix missed the boat, bigtime. They could have been the place on the net to learn about and watch and share movie experiences. I think they could have started a match.com type service. If you’re in a strange city and would like to go to the movies with someone with similar tastes, just click a few buttons. They were gathering all this information about people’s movie preferences. But they were reluctant to build systems around it. And reluctant to open it up to app developers. I think we all missed out on something, because movies at least to some of us are such an important form of personal expression."
