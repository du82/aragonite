["https://mjtsai.com/blog/2024/07/08/apple-intelligence-for-siri-in-spring-2025"]
title = "Michael Tsai - Blog  -  Apple Intelligence for Siri in Spring 2025"
full_description = "While many Apple Intelligence features will roll out with iOS 18 during the remainder of 2024, its much-awaited revamp of Siri will wait until iOS 18.4 in 2025. Before then, there will be a new design to Siri. That will presumably include how Apple has shown that invoking Siri will bring a flare around the edges of the iPhone screen, instead of the current circle icon. This is a rumor, but, if true, it’s the first time I can recall a key part of the WWDC announcements being so quickly pushed so far back in the release cycle. The more capable version of Siri allows the voice assistant to control actions within Apps, allowing it to understand what is currently on-screen and determine what to do based on context. If generative AI weren’t seen as essential — both in terms of consumer marketing and investor confidence — I think much, if not most, of what Apple unveiled in “Apple Intelligence” wouldn’t even have been announced until next year’s WWDC[…] One thing that really struck me watching the latest Samsung and Google events is how they emphasize that their respective generative AIs already work in many countries and regions. Apple Intelligence is expected to remain available only in the US until next year. Apple is racing to develop a more conversational version of its Siri digital assistant, aiming to catch up with OpenAI’s ChatGPT and other voice services. The company plans to introduce the revamped LLM Siri next year and launch it by spring 2026. iOS 18.4 is expected to be released in April with several new Apple Intelligence enhancements for Siri, including on-screen awareness, deeper per-app controls, and better understanding of a user's personal context. However, an even bigger upgrade planned for Siri is still more than a year away, according to a recent report. But, according to a new report by Bloomberg on Friday, Apple’s work has hit some snags. Some features that were said to be planned for iOS 18.4 are said to have been pushed back to May, or even later."
