["https://mjtsai.com/blog/2018/02/17/time-to-end-of-life-interact"]
title = "Michael Tsai - Blog  -  Time to End-of-Life Interact"
full_description = "Since day one it’s been plagued by bugs in the underlying Contacts frameworks and almost none of them have been fixed by Apple in the intervening years. It works great for most people, but for the ones with contact data that does not get along with the Contact framework, it fails in annoying ways. There are likely still places I could improve their experience in Interact, but I’ve burned too much time and effort on those edge cases for it to make sense to keep it going."
