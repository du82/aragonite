["https://mjtsai.com/blog/2005/08"]
title = "Michael Tsai - Blog - Archive - 2005 - August"
full_description = "The problem is that it is not always easy to find the answers to such questions in reference books.…Enter Google. Obviously, there is just as much bad English on the web as there is in the real world. But there is still a chance that the correct form occurs much more frequently than the incorrect one. Tim Bray has a great post about his Mom’s transition from Windows 98 to a Mac mini. She likes the Dock, Dashboard, and iPhoto; she has trouble with CD burning, Safari’s Google search, and multiple copies of Microsoft Office. Matt Henderson’s backup strategy is similar to mine. He uses Synchronize Pro, DropDMG, File Buddy, and CDFinder. Frankly, I think it’s a disgrace that backing up today is lower-tech than it was ten years ago. I am, however, pleased with using DVD-Rs. Sure, I can’t fit all my files onto one like they once fit onto a single tape, but they’re cheap, fast, relatively durable, and the drives are everywhere. The first-run experience with a new Mac – or a new installation of Mac OS X – is much better now than it ever was before. The music is nice, the animation looks cool, and the new Migration Assistant makes it easy for anyone to move their important files from an old machine to a new one. …widgets need to be created with the help of a graphic designer or Photoshop artist. An utterly unartistic programmer can design beautiful regular Mac software using the standard OS controls; a Dashboard widget that isn’t custom-designed by a good artist is going to stick out like a sore thumb. Scott Knaster reports that there’s now an applet version of the first video game. It runs the original source of the first version of Spacewar using a PDP-1 emulator. DropDMG 2.7 adds a bunch of features that (for me, at least) were long awaited. First up, we have disc burning. As I wrote a few months ago, I now backup my files with encrypted disk images, burned to DVD. I had been using Toast for the burning part. Toast is great, but it’s not optimal for this very simple task, where I usually want to burn just one file to each disc. With DropDMG, I can initiate a burn by Shift-dragging onto DropDMG’s window. Then I insert a disc and click Burn. It automatically chooses the name of the disc, and then I can follow the progress using a small, non-modal progress window. With multiple drives, I can burn more than one disc at a time. Of course, you might also want to burn folders or the contents of disk images, and DropDMG supports those operations, too. The idea is not to duplicate Toast or the Finder’s “burn folders” but to make simple burning operations really easy. If the files that you want to burn are already grouped into a folder or disk image, all it takes is a drag and drop."
