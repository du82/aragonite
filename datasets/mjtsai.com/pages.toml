["https://mjtsai.com/blog/2024/12/16/macos-15-2-breaks-bootable-backups"]
title = "Michael Tsai - Blog  -  macOS 15.2 Breaks Bootable Backups"
full_description = "Apple broke the replicator. Towards the end of replicating the Data volume, seemingly when it’s about to copy either Preboot or Recovery, it fails with a Resource Busy error. In the past, Resource Busy could be worked around by ensuring the system was kept awake. But this new bug means, on most systems, there’s no fix. It just fails. Since Apple took away the ability for 3rd parties (eg, us) to copy the OS, and took on the responsibility themselves, it’s been up to them to ensure this functionality continues to work. And in that, they’ve failed in macOS 15.2. I wonder if this is related to the problems I’ve been having since Sequoia where I can’t cleanly eject drives, e.g. after making a non-bootable backup. Finder will show a spinner for a while and then offer to let me Force Eject even though Sloth and other tools show no open files. It pains me to see the authors of good software like SuperDuper! just having throw up their hands and say there’s nothing that can be done, because Apple broke our shit and there’s no way to work around it since they intentionally locked down the system and made it impossible for us, the users, to do what we want. Remember when copying a system was as simple as just copying the System Folder to another drive? How far we’ve fallen. I haven’t seen any comments about how this affects Carbon Copy Cloner or ChronoSync, but if the problem is in Apple’s asr (Apple Software Restore) tool, those apps would likely be similarly affected. Unfortunately, the first Developer Beta of macOS 15.3 does not fix Apple’s replicator problem, which still fails with “Resource Busy” at the end of its operation. Update (2024-12-19): I continue to see reports of Time Machine problems with macOS 15.2, but these seem to be separate issues, perhaps related to SIP rather than ASR. Copying Apple’s system is an Apple-proprietary endeavor; we can only offer “best effort” support for making an external bootable device on macOS. We present this functionality in support of making ad hoc bootable copies of the system that you will use immediately (e.g. when migrating to a different disk on an Intel Mac, or for testing purposes), but we do not support nor recommend making bootable copies of the system as part of a backup strategy."
