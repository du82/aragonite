["https://mjtsai.com/blog/2011/02"]
title = "Michael Tsai - Blog - Archive - 2011 - February"
full_description = "As expected, AV Foundation from iOS 4 will be added to Lion. My take is that signals the end of QuickTime as we’ve known it. But it’s not only that there’s a new Framework for for working with time-based audiovisual media – there’s a lot more to QuickTime than that, and it’s all the interactive and additional technologies in QuickTime that don’t appear to have a future. Features that were important when QuickTime MOVs were the preferred (at Apple) distribution format. The iTunes Store was and remains a business in its own right. Its mission isn’t selling music, or movies, or TV shows, or apps, but building an end-to-end system, a platform that allows people to easily buy anything digital. If you think the App Store shouldn’t be “a huge revenue stream” then you’re not seeing things the way Apple does. And yet, CFO Peter Oppenheimer responded to criticism of the iOS subscription policy by saying that Apple runs the store “just a little over breakeven.” Out of all the API calls I saw in grand central dispatch the one that initially impressed me least was dispatch_once. However after reading its documentation and using it a bunch I realized how useful this one API call is. Not only it is a dead simple way to ensure that code only gets executed once, but it is also thread safe. Is this the future fate faced by most acquired tech companies? Is the cash worth it to founders who have to watch their creations slowly decline into obsolescence? Is freedom better than building and honing a big, popular product? When a company is bought, does it deserve acquisition congratulations or condolences? Whenever a policy change like this occurs, I ask, How does this strengthen the platform? How does this sell more iPhones? I can’t answer either of those questions, and that, to me, is the most interesting part of this whole debate. I prefer the Apple that makes its money by creating great, high-end, high-margin products and selling them directly to consumers. I am less fond of an Apple that makes money by striking or demanding dubious business deals. Forget my personal biases - I’m just saying, the former Apple would be interested in delivering stuff I would buy with my money and put in my pocket or my living room. The latter Apple would have more to gain by fleecing the supply and shoveling whatevers at me."
