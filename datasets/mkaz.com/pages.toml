["https://mkaz.com/series/el-camino-real"]
title = "El Camino Real | mkaz.com"
full_description = "El Camino Real September 2015 El Camino Real, the King’s Road, is a 600-mile road in California from San Diego to San Francisco. Starting in 1683, the Spanish Missionaries traveled the road establishing a set of Missions along the route. Most of the major cities in the San Francisco Bay Area, and California as a whole, were founded along the road. El Camino Real is still a main thoroughfare but large malls and shopping plazas have outdated the mostly smaller older businesses that make up most of the street. This photo series attempts to capture a piece of the historic road as it changes with the Bay Area and its vast new development."
