["https://mkaz.com/series/52-rolls/roll-31-2016"]
title = "Roll 31, 2016 | mkaz.com"
full_description = "Roll 31, 2016 August 2016 Roll 31 in my 52 rolls project was shot on an Olympus Trip 35 camera, it is a pretty fun cheap little camera. The Trip-35 was made in the 60’s and 70’s as a small portable travel camera. It only has two shutter speeds, four focus distances, and an aperture priority mode. A bonus, it uses selenium cells to power it, so no batteries required. The camera size and usage reminds me a lot of the Lomo LC-A, really easy and fun to use; just set the focus and fire away. The Zuiko lens on the Olympus is higher quality than the Lomo so you’ll get sharper more detailed photos. I really like this little camera, a great find. Plus they are dirt cheap since millions of them were made. Shots taken on: Olympus Trip 35, Zuiko 40mm f/2.8, Kodak Portra 400 Developed and scanned by Little Film Lab"
