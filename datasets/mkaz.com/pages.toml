title = "Roll 17, 2016 | mkaz.com"
full_description = "Roll 17, 2016 April 2016 Roll 17 is a roll of Cinestill 800T shot on a road trip to Portland. Cinestill is an interesting film. I really like using it for night, which I did for Roll #8. The film is balanced for tungsten light, which results in a cool color cast for day shots, which you can see in my film test. To counter the cast, it is recommended to use a warm 85B filter, which I did for this set, not sure that I like the result as much. Without the filter you get an interesting, almost movie like quality. Shots taken on: Nikon F6, 50mm f/1.8, Cinestill 800T Developed and scanned by The FIND Lab"
