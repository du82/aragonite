title = "Exif Data for Analog Film | mkaz.com"
full_description = 'Exif Data for Analog Film September 2015 One of the great benefits of using Lightroom is the ability to sort photos based off exif data. I can filter by camera or lens pretty easily for digital cameras which automatically attach exif data to each photo. For analog photography, it’s not quite that easy. I send my film out to get developed and scanned and the metadata that comes back on the files are related to the scanner, not my camera. So I end up with something like: Camera Model: EZ Controller Make : NORITSU KOKI For some reason, Lightrooom doesn’t allow you to edit all EXIF fields, you can only change certain parts such as copyright and a few others. However, there is a great utility created by Phil Harvey called exiftool which allows you to alter any metadata field. The tool works cross-platform so if you’re on Windows, Mac or Linux you can use it. I’m processing all photos on Windows these days because my Mac desktop choices is limited, especially if you want something with power and not a monitor built-in, plus Windows 10 ain’t half bad. Exiftool works on the command-line, you simply download the tool and put it somewhere easy to reference, I put the binary in c:\bin\exiftool.exe. Open the Command Prompt and change directory to where your files are. You can alter the exif data using a command like so: c:\bin\exiftool.exe -Model="Nikon FM3a" -Lens="Nikon 50mm f/1.8" -Make="Kodak Portra" -ISO=400 *.jpg The Camera Model, Lens and ISO are pretty self-explanatory. There isn’t really a exif tag for Film Type, so I use the “Make” for the film I used because it shows up and is searchable in Lightroom. You can see the giant list of tags you can set. The command will create a back up of the files called filename.jpg_original I run exiftool over each batch prior to importing into Lightroom, so I’m now able to search in based on which film or camera I used for both digital and analog. Download and more documentation at: http://www.sno.phy.queensu.ca/~phil/exiftool/'
author = "Marcus Kazmierczak"
year_published = 2015
