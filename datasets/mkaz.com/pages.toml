["https://mkaz.com/series/twelves"]
title = "Twelves | mkaz.com"
full_description = "Twelves January 2017 For 2017, my year long project is to create a series a month, twelve series with twelve photos in each. Each month I’ll focus on a single topic, shoot, and edit it down to just 12 photos. Last year I worked on a 52-rolls project shooting a roll of a film a week for the entire year, this produced quantity but not any cohesive series. With the Twelves project, I hope to focus more on series and singular stories each month. The camera, film, technique, or style used to make the pictures may change from month to month, but each month should be consistent and hang together. Ideally I use the right tool for the series, might be color for some, black and white for others. I’ll post the set of twelve on the last day of the month, and post the topic for the next moth. For January the series is Construction Twelves #1 - Construction Twelves #2 - Barcelona Twelves #3 - Spring Twelves #4 - Shutterfest Twelves #5 - Flash Twelves #6 - County Fair Twelves #7 - Vancouver Twelves #8 - Sturbridge Twelves #9 - City Beautification Twelves #10 - El Camino Real Twelves #11 - The Necropolis of Colma Twelves #12: Joshua Tree"
