["https://mkaz.com/articles/small-world-a-photo-exhibit"]
title = "Small World, a photo exhibit | mkaz.com"
full_description = "Small World, a photo exhibit February 2015 I started an idea for a photo exhibit over 14 years ago and haven’t done much with it since the initial burst. I cleaned up my photos and came across the original scans I made, all the shots were done on black and white film. I may or may not add to it down the line, but in the spirit of getting your work out there I’m publishing it now as is, a bit incomplete; but I still like the core idea. I’ve enjoyed architecture and buildings, when I was younger I wanted to be a draftsmen or architect. After Sept 11 we all realized how fragile these buildings can be. My idea for this exhibit was to print out these huge buildings as small prints you could hold in your hand showing how delicate and fragile they are. View the Small World exhibit."
