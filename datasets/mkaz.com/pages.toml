["https://mkaz.com/articles/yashica-fr-1-dads-camera"]
title = "Yashica FR-1 - Dad's Camera | mkaz.com"
full_description = "Yashica FR-1 - Dad's Camera August 2016 My Dad was cleaning out some of his old camera gear and gave me his Yashica FR-1, a camera from the late 70’s; our family camera he took pictures of me and my brothers when we were kids. It has a pretty sweet Yashica ML 55mm f/1.2 lens; though unfortunately I didn’t realize until afterwards that setting the aperture is merely a suggestion for the camera. It will set what it wants when it wants, a bit like kids. I just got my rolls of the new JCH Streetpan film in and wanted to run a roll through the camera shooting my own kids, pretty cool that the same camera that shot me will take pictures of my own. Between the meter and temperamental aperture I wouldn’t call it a true review of the film. However, a testament to both the film and lab that I got something on all 36 frames. I was expecting blank frames for many since the lens got stuck at f/1.2 for a bit. And some photos from the 70’s taken with the same camera… Kids and dogs. Kids and dogs."
