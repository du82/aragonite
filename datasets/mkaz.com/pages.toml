["https://mkaz.com/photo-blog/ardenwood-farms"]
title = "Ardenwood Farm | mkaz.com"
full_description = "Ardenwood Farm October 2017 Ardenwood Farm is a historic farm in Fremont, CA. George Patterson started the farm in the 1850's after failing to strike it rich mining gold. He ended up doing quite well farming and acquiring land to sell fruits, vegetables, and grain to the growing population in the region. The 6,000 acres of Ardenwood Farms still operates today as a turn-of-the-century farm by the Regional Park District. It is open to the public year round and a fun place to explore and see what life was like 100+ years ago. There is even a train ride, but check the schedule it only runs certain days, not the Saturday that we went on."
