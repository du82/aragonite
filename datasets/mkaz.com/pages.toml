["https://mkaz.com/articles/color-film-tests"]
title = "Color Film Tests | mkaz.com"
full_description = "Color Film Tests October 2015 The results of testing out various film stocks to see what they look like and how they shoot. I tried to shot all photos consistently, all taken with Nikon F6 camera with auto exposure and matrix-metering, no exposure compensation. The majority are shot with Nikon 50mm f/1.8 lens, though I might of used a 50mm f/1.4 and a 85mm f/1.8 on a couple. All processed at the same lab, The Find Lab, and no adjustments or post processing. I was surprised at how similar the colors and contrast are, besides the obvious difference with Cinestill 800T. You can tell differences but not nearly as pronounced as I expected. The real test would be to take the same scene and same light, but that would get boring and expensive shooting. Click any photo to see a larger size. Kodak Ektar 100 Kodak Portra 400 Kodak Gold 200 Kodak Ultramax 400 Fuji Superia 200 Fuji Superia 400 Agfa Vista Plus 400 Lomography 400 Cinestill 800T"
