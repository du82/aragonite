title = "mkaz.com"
full_description = "👋 Hi, welcome to my small place on the web. I publish photos, articles, and things I make on this site. If you are interested, my tech blog is at [mkaz.blog]. My photography is a mix of film and digital, I did a 52 rolls project shooting a roll a film a week throughout 2016. I tend to document the Bay Area where I live with a large Silicon Valley project documenting the places and companies that have formed the area. I've aslso shot a lot of night photography, and I have various tools on the site to help with night Intro to Night Photogrpahy article, Film Reciprocity Tables Exposure Calculator for mixed and low light, Moonlight Exposure Calculator for just moonlight, Browse around, I hope there is something interesting for you to find. Recent Posts Oak Trees, Winter Pigeon Point Lighthouse Lake Tahoe Size Matters Suburbs Black Lives Matter, Redwood City Bronica ETRSi 135W Muir Woods Cherry Picking Stanford Redwood City Snow Trip Topsy Turvy Bridge"
