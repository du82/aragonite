title = "Fry's Electronics | mkaz.com"
full_description = "Fry's Electronics October 2016 Brothers John, Randy, and David Fry inherited money from their father who ran Fry’s Supermarket, a small chain of grocery stores in California. The brothers were not interested in grocery stores but opened a Fry’s Electronics store in Sunnyvale in 1985. Fry’s Electronics sold high-tech supplies including integrated circuits, computer components, test and measurement equipment, software, text books and manuals, and numerous consumer electronics. The store was one of the few retail outlets in the country that sold off-the-shelf microprocessors. In the time before Amazon, New Egg and easy online ordering, Fry’s was geek nirvana for computer equipment."
