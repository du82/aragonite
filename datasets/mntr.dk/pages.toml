["https://mntr.dk/2014/getting-started-with-assetgraph"]
title = "Getting started with Assetgraph"
description = "Get started with Assetgraph, the web tool makers toolbox that works with your web page like browsers do"
full_description = "July 2, 2014 When presented with the challenges of web performance optimization, or any other kind of manipulation of web sites and assets, it is helpful to have a good set of tools at your disposal. Assetgraph aims to be exactly this. A high level interface for your websites, yet still providing low level interfaces for individual assets. A toolkit that lets you build your own tools that fit very specificly to your individual needs. I have spoken at lengths about how Assetgraph distinguishes itself from other build tools by not just being another unix tool configuration wrapper. In the following I will assume you have already heard me sing Assetgraphs praises. If you haven't, watch my talk from EmpireJS. Assetgraph is a node module and this post assumes that you are relatively comfortable writing and executing node scripts. By the end you should have learned enough about Assetgraph to get your hands dirty and write your own tools with it. If you want to see how easy it is to build tools that filter out unused files, inlines your images or rename files for optimal caching, you are in for a treat! If you are more into just consuming a well tested out-of-the-box build tool, take a look at assetgraph-builder or its grunt-wrapper grunt-reduce. NOTE: THIS ARTICLE DESCRIBES ASSETGRAPH VERSION 3, NEWER VERSIONS ARE AVAILABLE. Assetgraph Vocabulary Before we get started it's useful to get some vocabulary straight. If you're not easily confused you might want to skip to the part where you get your hands dirty. Like many bigger projects Assetgraph has some project specific vocabulary. We've tried not to be too magical about the terms we chose, so hopefully you'll get what things are from their name. Sometimes the inherent properties that go with the names are non-obvious though. This is an attempt at an explanation. Asset An Asset in Assetgraph is a model of the contents of a file including its metadata. Assets have a bunch of base properties that are relevant to all asset types, like content-type, url, file name, file extension, loaded state, inlined or not. All Assets have a rawSrc getter and setter, giving you direct access to the raw file behind the asset. They also have a bunch of convenience methods like md5Hex, clone and replaceWith, along with a populate method to parse and find outgoing relations in the source code of the asset. The most interesting things happen in the Asset constructors for more specific data types, like Html or JavaScript, where each Asset instance also has a highlevel instance of the Assets types data model. For HTML this is the DOM, modelled with jsdom. For JavaScript it's the uglify-js AST. Using these highlevel interfaces you have the ability to manipulate each assets as you see fit, using familiar highlevel abstractions you would also find in the browser. You might want to take a look at the full list of already implemented Asset types. Relation A Relation in Assetgraph defines the edges of the graph. They bind the Assets together and define what depends on what, and from where. Relations not only keep track of which file needs what other file. They also keep track of where exactly the relation came from. Be it a Html Script node src attribute or a CSS background image url token. Relations automatically update references when Assets move around, making the dependency graph stable at all times without broken links. Relations have type, to, from and href properties that are highly relevant when querying the graph for them. There are a bunch of convenience functions available for more lowlevel graph manipulation, which I'll skip for now as this is just an introduction. Here is the full list of Assetgraph Relations. Query The Assetgraph Query model is a MongoDB inspired model where you can combine some simple boolean AND, OR, NOT statements into a powerful expression to specificly target only the Assets or Relations you are interested in. Each query is a function that matches the properties of each Asset or Relation with the corresponding property or the object in the query. The query object can use strings, numbers, arrays, regexes, user defined functions and even recursive query objects to match the subject. Some examples: var query = require('assetgraph').query; var simple = query({ type: 'Html', isLoaded: true }); var boolean = query.or( { url: /^http:/ }, { fileName: function(fileName) { return fileName.length > 8; } } ); var nested = query({ type: 'HtmlAnchor', from: { isInline: false }, to: { isImage: true } }); Most interactions with Assetgraph happen trough queries to the graph. It is recommended that you get to know the query model if you want to be an effective tool maker. Often times you'll see simple query objects being passed into Assetgraph methods or Transforms without the query() call. Assetgraph will automatically turn such objects into queries for your convenience. Take a look at the Assetgraph Query source code. Assetgraph The Assetgraph is the instance that ties all of the above together. This is where the Assets and Relations are stored and where you can use a Query to find them all again. There are a bunch of convenience methods for pre-order and post-order traversal and of course the most used ones findAssets and findRelations. Transform Assetgraph is cool, but always diving into the lowlevel code of specific Asset syntax trees becomes bothersome pretty quickly. Transforms are highlevel functions that wrap these lowlevel calls, manipulating the Assetgraph instance in more convenient ways. Assetgraph is extensible, so you can write your own highlevel transforms that fit your specific needs. Assetgraph already comes preloaded with a lot of very useful transforms, most of which are written with web performance optimization in mind, but don't let yourself be limited by that! There are some fine descriptions of most of the available core transforms in the Assetgraph README. Transform Queue The Transform Queue is what lets you chain a number of transforms together to form a pipeline that applies multiple transforms in order. While all installed transforms are available directly on the Transform Queue and Assetgraph instance for you convenience, they all return a reference to the Transform Queue they are in, enabling you to easily chain Transforms. There are a few convenience methods on the Transform Queue, like if, endif and queue (for quick inline transforms), the most important one is run. If you don't .run() the Transform Queue, nothing will happen. Minimum Assetgraph Lifecycle While tools have great diversity, there will always be some common boilerplate that needs to be written in order to bootstrap them. The same goes for Assetgraph-based ones. This will be an explanation of how a bare minimum setup will look with Assetgraph. First, it's important to remember that Assetgraph can only work with websites if their internal references are valid. This may sound like an obvious best practice, since that is the only way a website can actually be loaded in a browser. Sadly I need to point this out, as most existing web performance build chains actually set you up with non-working websites, that are then assembled by the tool or some configuration of a static file server. If you want to get the most out of Assetgraph, build your websites so they work in the browser with no magic in between. Incidentally this simplifies your workflow greatly and lessens the pain for front-end developers considerably, so I consider it best pratice. Now, let's get started. Consider a website structure like this one: app/ ├── css │ └── main.css ├── js │ ├── main.js │ └── jquery.js ├── images │ └── logo.png ├── index.html └── favicon.ico Your web application is in a directory called app and you have som pretty basic scaffolding done already. A simple start for a simple introduction. Note that this is just an example. Assetgraph makes no assumptions about directory structure as it will infer it from your source code. We start out with creating a script that can load the website into an Assetgraph instance: var Assetgraph = require('assetgraph'); var graph = new AssetGraph({ root: 'app' }); The above creates an Assetgraph instance, configuring it with app as the web root. The root must be a string, and may be any valid file://, http://, https:// or ftp:// url. If no protocol is specified, a location on local disc is assumed, and the path is resolved as you would expect on the command line. An Assetgraph instance in itself, without any data, is quite useless. So next up we're interested in actually loading data from our website into the graph. We can do this using the loadAssets transform. Loading your index.html into the graph can be done like so: graph.loadAssets('index.html'); The loadAssets transform takes a range of inputs to make your life easier. The most useful to you now will be the string or array of strings. Each string, just like before, may be a full url or a protocol relative url in the previously described schemes. All relations in the graph will use the Assetgraph root to resolve paths, not the file system root. If you want to get more advanced with the loadAssets transform it might be useful to consult the source code for now. Before we can run the script there is one more piece of boilerplate code that needs to be added. What we are doing when calling Assetgraph transforms with configuration parameters, is actually not executing them right away. Instead, we are appending them to a transform queue, which is what is returned from the transform call. To make this explicit in this example we save the return value in a new variable: var queue = graph.loadAssets('index.html'); All transforms in the queue are run in the queue scope and will return the queue, making transforms chainable. All transforms will have the assetgraph instance passed to them as the first parameter. The loadAssets call you just added to your script, won't actually be run before the transform queue has been started. We do this using the run method: queue.run(); This implementation detail is a bit counter intuitive and can bite you later, so make a note of it now and I will make a note on improving the API. If it hasn't changed by September 2014 you are hereby mandated to bug me about it on Github. You can now run your script, and index.html will be loaded into the graph model. However this is not terribly exciting yet, since all that happens is reading a file into memory and not logging any output. So let's make it a bit more exciting by adding some logging to the console. Logging and Debugging Setting up logging is done on the Assetgraph instance, meaning it goes before the transform queue is run. Your script now looks like this: var Assetgraph = require('assetgraph'); var graph = new AssetGraph({ root: 'app' }); graph.on('addAsset', function(asset) { console.log('addAsset', asset.toString()); }); var queue = graph.loadAssets('index.html'); queue.run(); We're hooking into the Assetgraph emitted event addAsset and logging some basic information about the event and the asset that was added to the graph. Try running your script now, and you should actually see some output in your console. There are more events you can hook into, to get some more insight into the internals of Assetgraph: addAsset, removeAsset, addRelation, removeRelation, beforeTransform, afterTransform. Furthermore there are some different error levels that are especially useful to hook into in order to get some more useful information for debugging your code: info, warn, error. These last ones are conditions of increasing severity. info is usually used when Assetgraph sees a potential error situation in your web application code, but a fix has already been applied. This could be trying to bundle scripts where one or more of them are leaking strict mode to the global scope, or exceeding the IE max style sheet rules number. Don't worry too much about info events. If you see warn events you should take note, as these usually describe problems in your web application that have to be fixed by you. Things like parse errors or missing files that would cause a 404 response in production etc. The error event is the most severe. This is usually only emitted when a completely non-recoverable error has been encountered, or a library throws unexpectedly. It usually makes sense to just stop running your script if you hit this one. It's also likely that when you get error level events that we'd like to hear about it, as it might indicate a missing error handling in Assetgraph. Please report these to us. Let's spice it up with one more logging detail, writing some stats about the assets contained in the graph to stderror: queue.writeStatsToStderror(); Populating the Dependency Graph We've now arrived at the core functionality of Assetgraph. The arguably most powerful functionality is the ability to automatically and recursively traverse the dependencies of loaded assets. This, as they say, is where the magic happens, and what enables you to work with your web assets in their entire context without having to define large manifest files telling your tool what files you want included. We are using the populate transform. The transform can be configured in a multitude of ways, in order to describe how to traverse the dependency graph, what to load, and more importantly, what not to load. Think of this as a web scraper. Let it scrape everything and you might end up copying the internet, so use with care. Available options are: { followRelations: <Assetgraph.query>, startAssets: <Assetgraph.query>, from: <Assetgraph.query>, // Alias for 'startAssets' stopAssets: <Assetgraph.query>, concurrency: <int> // Number of concurrent requests. >= 1 } It should be obvious by now that it is useful to get to know the query syntax. For now I'll assume that we are working with a web site on local disc and that we are only interested in loading assets into Assetgraph that are local as well. So we want to configure the populate transform to only follow urls that are relative or root relative, while excluding the ones that are absolute or protocol relative (ie. on a different domain). We can do this like so: queue.populate({ followRelations: { hrefType: ['relative', 'rootRelative'] } }); This makes your final bootstrap script look like this: var AssetGraph = require('assetgraph'); var graph = new AssetGraph({ root: 'build' }); graph.on('addAsset', function(asset) { console.log('addAsset', asset.toString()); }); var queue = graph.loadAssets('index.html'); queue.populate({ followRelations: { hrefType: ['relative', 'rootRelative'] } }); // Put further transforms here queue.writeStatsToStderr(); queue.run(); Congratulations, You have now successfully loaded the entirety of your local files, which you are referring to in your source code, into Assetgraph. You are now bootstrapped with all you need in order to work with your assets. Normally a starter guide would end here, but I'll throw in some q"
