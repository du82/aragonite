["https://mntre.com/faq.html"]
title = "FAQ—MNT Research GmbH"
full_description = "Why are the waiting periods so long? The reason for this is the ongoing chip crisis/component shortage. We had to redesign several products like the keyboard, trackball, trackpad and motherboard to use some different chips. This takes time, and our manufacturers also need some time to produce. However, we are in the process of producing enough stock to be able to ship your order faster. I want to cancel an order. That's okay. Just write to support@mntre.com and let us know. We'll take care of it. I canceled an order, but haven't received a refund yet. In rare cases, the refund fails (mostly credit card). Please write to support@mntre.com and we'll figure out another method together. I received the wrong article/parts are missing. Sorry for that! Please let us know via email and we'll find a solution. Crowd Supply still hasn't delivered my order. If you want to know about your order, you can contact them directly or take a look at our related community post. We've been told they are shipping again, so it's just a matter of time until you receive your item(s). My favorite payment option isn't listed. Which ones do you accept? We accept payments via credit card, SEPA and PayPal. I haven't received a tracking code yet. When does my order ship? We need some time to ship orders due to component shortage (which resulted in redesigns and long waiting periods with our manufacturers in the past). However, we are in the process of producing enough stock to be able to ship your order faster. If you would like to receive an estimated time of delivery, you can take a look at our product page where the waiting period is listed or contact us via email. Which address do I send my item(s) to? Do I have to insure the package? Yes, we only accept insured packages. Please send it via UPS, FedEx or DHL Express only, with tracking code. We are not accepting packages sent to us via USPS as they never arrive. Our address is: MNT Research GmbH Fehlerstr. 8 12161 Berlin Germany I would like to combine shipments on 2 orders. At this time, you can't do it yourself. Please write to our support team and send us both order numbers. We'll combine them for you."
