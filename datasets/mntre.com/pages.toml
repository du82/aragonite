["https://mntre.com/community.html"]
title = "Community—MNT Research GmbH"
full_description = "We launched the MNT Community in 2021 with the introduction of the MNT Reform laptop, and it has been thriving ever since. It's a place to talk about Reform, open source and open hardware, Linux and everything related: Several skilled members of the MNT Community have contributed to our handbook and code in the past. We are grateful for every contribution and appreciate the help very much. As we continue to develop (and improve) our products, we actively encourage you to create patches or add relevant details/information to our documentation. For this purpose, we have created a small guide to help simplify this process. Currently, only the MNT Reform family has a comprehensive handbook. It is managed in a Git repository and written using Sphinx and reStructured Text. The MNT Community is constantly working on a variety of projects. If you're looking for mod information, troubleshooting advice, repair logs, or recommendations, check out this list: While code and handbook contributions are very valuable to us, we also appreciate economic contributions. If you'd like to support us financially, you can do so by spreading the word, purchasing our products, and/or donating (donation info on request). For a small number of projects, we were (and are) funded by NLnet, an organization also worth supporting. AGB · Datenschutzerklärung · Widerrufsbelehrung · Versandarten · Zahlungsarten · Impressum · Mastodon © 2025 MNT Research GmbH / Fehlerstr. 8 / 12161 Berlin Geschäftsführer*in und inhaltlich verantwortlich: Lukas F. Hartmann. Amtsgericht Charlottenburg, Aktenzeichen: HRB 136605 B. VAT ID: DE278908891. WEEE: DE 33315564 Attributions: Inter and Inter Display fonts by rsms. Bismuth photo by Kurayba.All photos and graphics, except for the MNT logo (a protected trademark) are CC BY-SA 2.0."
