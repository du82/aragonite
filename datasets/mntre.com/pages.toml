title = "MNT ZZ9000 Amiga Graphics Accelerator + Network, USB—MNT Research GmbH"
full_description = "MNT ZZ9000 is the successor to the VA2000 Amiga graphics card. But it can do more than just graphics: based on the Xilinx ZYNQ XC7Z020 chip, it features not only a powerful 7-series FPGA, but also 2x 666MHz ARM Cortex-A9 cores and 1GB of DDR3 memory. All Picasso96 rendering functions are fully accelerated using custom ARM routines. As a bonus, ZZ9000 features an Ethernet connector with SANA-II support, and a USB connector for mounting an USB stick as an Amiga drive. ZZ9000AX is an audio add-on card for ZZ9000AX. The drivers are included in the package below. The minimum firmware and driver version required to use ZZ9000AX is 1.10. Extract and copy BOOT.bin to the root of MBR/FAT32 formatted MicroSD card inserted into ZZ9000 MicroSD card slot. If you want to develop ARM applications for ZZ9000, you can download the Software Development Kit (SDK) with some example programs here: https://source.mntre.com/MNT/zz9000-sdk Problem (V1.0): Red screen on A4000 cold startup. Solution: The red screen happens if the Amiga initializes faster than ZZ9000. The red screen goes away after a few seconds and the system will work normally. Problem (V1.0): ARM SDK applications don't work with Zorro II firmware. Solution: While technically ARM SDK applications can work on Zorro II machines, we're still finalizing the memory map and a windowing method for the limited Zorro II address space. A: The USB port can be used since firmware version 1.5 to read and write to USB mass storage (tested with USB sticks). A: The ZZ9000 firmware is open source! The README explains how to get started with developing: https://source.mntre.com/MNT/zz9000-firmware A: Join the IRC channel #mnt-amiga on irc.libera.chat (port 9967, tls) to chat with other ZZ9000 users and/or drop us a line at zz9000@mntre.com. Acceleration for all currently available P96 graphics functions has been implemented, with slightly faster code paths being used in situations where the handling of the draw mode and/or mask can be skipped. Unless otherwise noted, mask and all draw modes are supported and accelerated for all rendering functions. Much of the more advanced acceleration has been contributed by beeanyew."
