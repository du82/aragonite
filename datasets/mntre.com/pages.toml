["https://mntre.com/legal-de.html"]
title = "Rechtliches—MNT Research GmbH"
full_description = "den in § 2 dieser AGB bezeichneten Nutzern dieser Plattform – im Folgenden „Kunde/Kunden“ – geschlossen werden. Für die Geschäftsbeziehung zwischen dem Anbieter und dem Kunden gelten ausschließlich die nachfolgenden Allgemeinen Geschäftsbedingungen in ihrer zum Zeitpunkt der Bestellung gültigen Fassung. Abweichende Bedingungen des Kunden werden nicht anerkannt, es sei denn, der Anbieter stimmt ihrer Geltung ausdrücklich schriftlich zu. (1) Der Kunde kann aus dem Sortiment des Anbieters Produkte auswählen und diese über den Button „Add To Cart“ in einem so genannten Warenkorb sammeln. Über den Button „Place Order“ gibt er einen verbindlichen Antrag zum Kauf der im Warenkorb befindlichen Waren ab. Vor Abschicken der Bestellung kann der Kunde die Daten jederzeit ändern und einsehen. (2) Der Anbieter schickt daraufhin dem Kunden eine automatische Empfangsbestätigung mit dem Betreff „MNT Shop Order Confirmation“ per E-Mail zu, in welcher die Bestellung des Kunden nochmals aufgeführt wird und die der Kunde über die Funktion „Drucken“ ausdrucken kann. Die Bestellung des Kunden (1) stellt hierbei das Angebot zum Vertragsschluss mit dem jeweiligen Inhalt des Warenkorbs dar. Die Empfangsbestätigung (Bestellbestätigung) stellt die Annahme des Angebots durch den Anbieter dar. In dieser wird der Inhalt der Bestellung zusammengefasst. In dieser E-Mail oder in einer separaten E-Mail, jedoch spätestens bei Lieferung der Ware, wird der Vertragstext (bestehend aus Bestellung, AGB und Auftragsbestätigung) dem Kunden von uns auf einem dauerhaften Datenträger (E-Mail oder Papierausdruck) zugesandt. Der Vertragstext wird unter Wahrung des Datenschutzes gespeichert. (1) Von uns angegebene Lieferzeiten berechnen sich vom Zeitpunkt unserer Auftragsbestätigung (§ 2 (2) dieser AGB), vorherige Zahlung des Kaufpreises vorausgesetzt. (2) Ist das vom Kunden in der Bestellung bezeichnete Produkt nur vorübergehend nicht verfügbar, teilt der Anbieter dem Kunden dies ebenfalls unverzüglich mit. Bei einer Lieferungsverzögerung von mehr als zwei Wochen hat der Kunde das Recht, vom Vertrag zurückzutreten. Im Übrigen ist in diesem Fall auch der Anbieter berechtigt, sich vom Vertrag zu lösen. Hierbei wird er eventuell bereits geleistete Zahlungen des Kunden unverzüglich erstatten."
