["https://mntre.com/reform.html"]
title = "Reform Series—MNT Research GmbH"
full_description = '''The Reform laptop was introduced in 2019 — and it is getting ever more powerful while maintaining its iconic look. This article is all about MNT Reform and how this radically open laptop (and its successors) came to be. MNT Reform was designed from the ground up to be as open and transparent as possible, supporting a free and open source software from the start. The Reform laptop has no built-in surveillance technologies, cameras, or microphones, so you can be confident that it will never spy on you. Since the MNT Reform is not based on legacy x86 technology, its architecture is much easier to understand than that of conventional laptops. This simplicity also makes for a more pleasant developer experience. MNT Reform's hardware, firmware, software and documentation is open source and invites collaboration and hacking. The term reform has several meanings: On the one hand "to restore, to return to its original state"; on the other, "to form, to shape". The idea was to create an open computing device that gives control back to the user. The chunky design is a visual nod to the earlier days of laptops from the 80s and 90s, when computers were conceived as modifiable tools rather than consumption devices that are not really yours. The sturdy build of the MNT Reform (products) also helps with disassembly, repair and upgrades. The principles of Open Hardware were (and are) crucial to the creation of our devices. Analogous to the classic Reform laptop, MNT Research introduced MNT Pocket Reform in 2023 — a mini version of the aforementioned device. Being fully open source hardware and software, MNT Pocket Reform is an extremely compact, fully featured mini laptop that is modular, upgradable, recyclable, and reusable. MNT Pocket Reform can be purchased on Crowd Supply and in our shop. Our latest laptop, MNT Reform Next, takes open source hardware to a new level. It gives our users more freedom than any other laptop available today. Swapping modules, creating a self-designed case, making modifications to the keyboard — by combining high performance and high mobility with modularity, customizability, and repairability, MNT Reform Next has the potential to become more than just a daily driver. MNT Reform Next is currently available for preorder as part of our crowdfunding campaign on Crowd Supply. It will eventually become available in our shop as usual.'''
year_published = 2025
clearnet = "https://mntre.com/reform.html"
