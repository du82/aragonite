["https://moderncss.dev/12-modern-css-one-line-upgrades"]
title = "12 Modern CSS One-Line Upgrades | Modern CSS Solutions"
description = "Sometimes, improving your application CSS just takes a one-line upgrade or enhancement! Learn about 12 properties to start incorporating into your projects, and enjoy reducing technical debt, removing JavaScript, and scoring easy wins for user experience."
full_description = 'Sometimes, improving your application CSS just takes a one-line upgrade or enhancement! Learn about 12 properties to start incorporating into your projects, and enjoy reducing technical debt, removing JavaScript, and scoring easy wins for user experience. Properties are explored for the following categories: Stable Upgrades: fix a hack or issue by replacing older techniques Stable Enhancements: provide an improved experience with well-supported modern properties Progressive Enhancements: provide an upgraded experience when these properties are supported without causing harm in unsupporting browsers Stable Upgrades # The following well-supported properties can help fix a hack or long-standing issue by replacing older techniques. aspect-ratio # Have you ever used the “padding hack” to force an aspect ratio such as 16:9 for video embeds? As of September 2021, the aspect-ratio property is stable in evergreen browsers and is the only property needed to define an aspect ratio. For an HD video, you can just use aspect-ratio: 16/9. For a perfect square, only aspect-ratio: 1 is required since the implied second value is also 1 . CSS for "Basic use of aspect-ratio" .aspect-ratio-hd { aspect-ratio: 16/9; } .aspect-ratio-square { aspect-ratio: 1; } .aspect-ratio-hd-258 { aspect-ratio: 16/9; } .aspect-ratio-square-258 { aspect-ratio: 1; } :is(.aspect-ratio-hd-258, .aspect-ratio-square-258) { background-color: hsl(260, 90%, 95%); border: 1px dashed hsl(260, 90%, 65%); display: grid; place-content: center; padding: 1em; } :is(.aspect-ratio-hd-258, .aspect-ratio-square-258):not(:first-child) { margin-top: 1em; } HD 16:9 Square 1:1 Of note, an applied aspect-ratio is forgiving and will allow content to take precedence. This means that when content would cause the element to exceed the ratio in at least one dimension, the element will still grow or change shape to accommodate the content. To prevent or control this behavior, you can add additional dimension properties, like max-width, which may be necessary to avoid expanding out of a flex or grid container. CSS for "Forgiving aspect-ratio" /* Applied to the flexbox children which have a size constraint from their parent */ .aspect-ratio-square { aspect-ratio: 1; } .aspect-ratio-square-88 { aspect-ratio: 1; background-color: hsl(260, 90%, 95%); border: 1px dashed hsl(260, 90%, 65%); display: grid; align-items: center; padding: 1em; } .container-88 { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: flex-start; margin-inline: auto; max-width: 65ch; } .container-88 > * { flex: 1 1 20ch; } Lorem, ipsum dolor sit amet consectetur adipisicing elit. Iste molestias maiores velit quaerat debitis incidunt delectus nulla, quibusdam fugit eos? Fugiat asperiores assumenda nulla corrupti, sit repellendus ducimus necessitatibus voluptates. Lorem, ipsum dolor sit amet consectetur adipisicing elit. Iste molestias maiores velit quaerat debitis incidunt delectus nulla, quibusdam fugit eos? If you are hesitant to fully replace the padding hack and still want to provide some dimension guardrails, review the Smol Aspect Ratio Gallery for a progressively enhanced solution to aspect-ratio. object-fit # This is actually the oldest property in this list, but it solves an important issue and definitely fits the sentiment of a one-line upgrade. The use of object-fit causes an img or other replaced element to act as the container for its contents and have the those contents adopt resizing behavior similar to background-size. While there are a few values available for object-fit, the following are the ones you’re most likely to use: cover - the image resizes to cover the element, and maintains its aspect-ratio so that the content is not distorted scale-down - the image resizes (if needed) within the element so that it is fully visible without being clipped and maintains its aspect-ratio, which may lead to extra space (”letterboxing”) around the image if the element has a different rendered aspect-ratio In either case, object-fit is an excellent property pairing with aspect-ratio to ensure images are not distorted when you apply a custom aspect ratio. CSS for "Use of object-fit with aspect-ratio" .image { object-fit: cover; aspect-ratio: 1; /* Optional: constrain image size */ max-block-size: 250px; } .image-373 { object-fit: cover; aspect-ratio: 1; /* Optional: constrain image size */ max-block-size: 250px; } Review my explanation of object-fit in this free egghead video lesson. margin-inline # One of many logical properties, margin-inline functions as a shorthand for setting the inline (left and right in horizontal writing modes) margin. The replacement here is simple: /* Before */ margin-left: auto; margin-right: auto; /* After */ margin-inline: auto; Logical properties have been available for a couple of years and now have support upwards of 98% (with occasional prefixing). Review this article from Ahmad Shadeed to learn more about using logical properties and their importance for sites with international audiences. Stable Enhancements # These well-supported modern CSS properties can provide an improved experience, and may also allow replacing older methods or even JavaScript-aided solutions. Fallback solutions are not likely to be needed, although this is dependent on your specific application considerations, and testing is always encouraged. text-underline-offset # The use of text-underline-offset allows you to control the distance between the text baseline and the underline. This property has become a part of my standard reset, applied as follows: a:not([class]) { text-underline-offset: 0.25em; } You can use this offset to clear descenders as well as (subjectively) improve legibility, particularly when links are grouped in close proximity, such as a bulleted list of links. This upgrade may replace older hacks like a border or pseudo-element, or even a gradient background, especially when used with its friends: text-decoration-color to change the underline color text-decoration-thickness to change the underline stroke thickness. outline-offset # Have you been using box-shadow or perhaps a pseudo-element to supply a custom outline when you wanted distance between the element and outline on focus? Good news! The long-available outline-offset property (as early as 2006!) may be one you missed, and it enables pushing the outline away from the element with a positive value or pulling it into the element with a negative value. In the demo, the gray solid line is the element border, and the blue dashed line is the outline being positioned via outline-offset. CSS for "Positive and negative outline-offset" .outline-offset { outline: 2px dashed blue; outline-offset: var(--outline-offset, .5em); } .container-488 { display: grid; grid-auto-flow: column; justify-content: center; align-items: center; gap: 2rem; } .outline-offset-488 { outline: 2px dashed blue; outline-offset: var(--outline-offset, 0.5em); padding: 1em; border: 1px solid gray; } Positive offset Negative offset Reminder: outlines are not computed as part of the element’s box size, so increasing the distance will not increase the amount of space an element occupies. This is similar to how box-shadow is rendered without impacting the element size as well. Learn more about using outline-offset as an accessibility improvement for focus visibility. scroll-margin-top/bottom # The scroll-margin set of properties (and corresponding scroll-padding) allows adding an offset to an element in the context of the scroll position. In other words, adding scroll-padding-top can increase scroll offset above the element but doesn’t affect its layout position within the document. Why is this useful? Well, it can alleviate issues caused by a sticky nav element covering content when an anchor link is activated. Using scroll-margin-top we can increase the space above the element when it is scrolled to via navigation to account for the space occupied by the sticky nav. I like to include a generic starting rule in my reset for any element with an [id] attribute given it has the potential to become an anchor link. [id] { scroll-margin-top: 2rem; } An alternative selector is explored in the Modern CSS article on component-based architecture and is also in use on this site, as can be tested by using the links from the article table of contents sidebar. For a more robust solution when accounting for the overlap of sticky, fixed, or absolute positioned elements, you may want to use a custom property with a fallback value. Then, with the assistance of JavaScript, measure the real distance needed and update the custom property value. [id] { /* Update --scroll-margin with JS if needed */ scroll-margin-top: var(--scroll-margin, 2rem); } I encourage you to also update this solution further and use the logical property equivalents: scroll-padding-block-start and -block-end. color-scheme # You may be familiar with the prefers-color-scheme media query to customize dark and light themes. The CSS property color-scheme is an opt-in to adapting browser UI elements including form controls, scrollbars, and CSS system colors. The adaptation asks the browser to render those items with either a light or dark scheme, and the property allows defining a preference order. If you’re enabling adapting your entire application, set the following on the :root, which says to preference a dark theme (or flip the order to preference a light theme). :root { color-scheme: dark light; } You can also define color-scheme on individual elements, such as adjusting form controls within an element with a dark background for improved contrast. .dark-background { color-scheme: dark; } Learn from Sara Joy’s presentation about how to use color-scheme for easy dark mode, and more about incorporating this feature. accent-color # If you’ve ever wanted to change the color of checkboxes or radio buttons, you’ve been seeking accent-color. With this property, you can modify the :checked appearance of radio buttons and checkboxes and the filled-in state for both the progress element and range input. The browser’s default focus “halo” may also be adjusted if you do not have another override. CSS for "Effect of using accent-color" :root { accent-color: mediumvioletred; } .container-129 { display: grid; gap: 1rem; accent-color: mediumvioletred; } Radio Checkbox Range Progress 70% Consider adding both accent-color and color-scheme to your baseline application styles for a quick win toward custom theme management. If you need more comprehensive custom styling for form controls, review the Modern CSS series beginning with radio buttons. width: fit-content # One of my favorite CSS hidden gems is the use of fit-content to “shrink wrap” an element to its contents. Whereas you may have used an inline display value such as display: inline-block to reduce an element’s width to the content size, an upgrade to width: fit-content will achieve the same effect. The advantage of width: fit-content is that it leaves the display value available, thereby not changing the position of the element in the layout unless you adjust that as well. The computed box size will adjust to the dimensions created by fit-content. CSS for "Basic usage of fit-content" .fit-content { width: fit-content; } .fit-content-135 { width: fit-content; padding: 0.5em; border-radius: 0.25rem; background-color: hsl(260, 90%, 95%); border: 1px dashed hsl(260, 90%, 65%); } .regular-135 { background-color: lightgray; margin-top: 1em; padding: 0.5em; } Using fit-content Without the use of fit-content The fit-content value is one of several keywords that enable intrinsic sizing. Consider the secondary upgrade for this technique to the logical property equivalent of inline-size: fit-content. Progressive Enhancements # This last set of properties provides an upgraded experience when they are supported and can be used without fear of causing harm in unsupporting browsers. This means they do not need a fallback method even though they are more recent additions to modern CSS. overscroll-behavior # The default behavior of contained scroll regions - areas with limited dimensions where overflow is allowed to be scrolled - is that when the scroll runs out in the element, the scroll interaction passes to the background page. This can be jarring at best, and frustrating at worst for your users. Use of overscroll-behavior: contain will isolate the scrolling to the contained region, preventing continuing the scroll by moving it to the parent page once the scroll boundary is reached. This is useful in contexts such as a sidebar of navigation links, which may have an independent scroll from the main page content, which may be a long article or documentation page. CSS for "Basic usage of overscroll-behavior" .sidebar, .article { overscroll-behavior: contain; } .container-736 { display: grid; grid-template-columns: fit-content(25ch) minmax(50%, 1fr); } .sidebar-736, .article-736 { display: grid; gap: 1em; padding: 1rem; height: max(40vh, 300px); overflow-y: auto; } .sidebar-736, .article-736 { overscroll-behavior: contain; } .sidebar-736 a { color: mediumvioletred; } Nav item 1Nav item 2Nav item 3Nav item 4Nav item 5Nav item 6Nav item 7Nav item 8Nav item 9Nav item 10 Lorem ipsum dolor sit amet consectetur adipisicing elit. Maxime nobis consectetur earum! Aliquid a praesentium quis in consequuntur mollitia laboriosam illum nemo commodi aut? Doloremque sapiente quos dignissimos sequi cupiditate commodi nemo non perspiciatis placeat totam. Reiciendis, at nulla! Hic nemo eius atque laborum consequuntur iusto exercitationem quasi. Est, assumenda amet culpa veritatis maxime debitis? Suscipit error amet quas sed? Magnam exercitationem neque error deleniti consequuntur, dolor repellat quo perferendis dicta sunt. Ipsum id repellat velit laudantium vel autem eos non aperiam qui nobis? Ratione maxime neque numquam minima, omnis dolorem temporibus laboriosam dolor atque suscipit? Dolores assumenda dolore similique eaque, odio voluptatibus. Aliquid iusto nostrum iste? Exercitationem. Quos adipisci ea ullam amet blanditiis voluptatibus, fuga laborum sed facere quasi! Odio rerum labore veritatis esse eaque quae debitis possimus ea omnis vitae. Quasi eum obcaecati laborum eaque nostrum numquam tempore reprehenderit qui beatae debitis? Optio atque fugit quia reprehenderit dolor rem et delectus praesentium ratione provident. Sed accusamus at architecto dolore minima error, assumenda amet nam perferendis odit? Et eius enim est hic doloribus reiciendis qui cupiditate? Autem, iure cupiditate? text-wrap # One of the newest properties (as of 2023) is text-wrap, which has two values that solve the type-setting problem of unbalanced lines. This includes preventing “orphans,” which describes a lonely word sitting by itself in the last text line. The first available value is balance, which has a goal of evening out the number of characters per line of text. There is a limitation of six lines of wrapped text, so the techn'
