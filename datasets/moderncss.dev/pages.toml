["https://moderncss.dev/providing-type-definitions-for-css-with-at-property"]
title = "Providing Type Definitions for CSS with @property | Modern CSS Solutions"
description = "Write safer CSS using `@property`, which enables defining types for custom properties. Learn why traditional fallback values can fail, and how `@property` features improve the resilience of custom property definitions."
full_description = '''A cross-browser feature as of the release of Firefox 128 in July 2024 is a new at-rule - @property - which allows defining types as well as inheritance and an initial value for your custom properties. We'll learn when and why traditional fallback values can fail, and how @property features allow us to write safer, more resilient CSS custom property definitions. Standard Use of Custom Properties # Custom properties - aka "CSS variables" - are useful because they allow creating references to values similar to variables in other programming languages. Consider the following scenario which creates and assigns the --color-blue property, which then is implemented as a class and applied to a paragraph. CSS for "Standard use case for custom properties" :root { --color-blue: blue; } .color-blue { color: var(--color-blue); } .demo-270 { --color-blue: blue; padding: 0.5rem; } .color-blue-270 { color: var(--color-blue); } I'm blue dabadee The paragraph renders as blue. Excellent! Ship it. Common Error Conditions Using Custom Properties # Now, you and I both know that "blue" is a color. And it also may seem obvious that you would only apply the class that uses this color to text we intend to be blue. But, the real world isn't perfect, and sometimes the downstream consumers of our CSS end-up with a reason to re-define the value. Or perhaps they accidentally introduce a typo that impacts the original value. The outcome of either of these scenarios could be: the text ends up a color besides blue, as that author intended the text surprisingly renders as black If the rendered color is surprisingly black, it's likely that we've hit the unique scenario of invalid at computed value time. When the browser is assessing CSS rules and working out what value to apply to each property based on the cascade, inheritance, specificity and so forth, it will retain a custom property as the winning value as long as it understands the general way it's being used. In our --color-blue example, the browser definitely understands the color property, so it assumes all will be ok with the use of the variable as well. But, what happens if someone redefines --color-blue to an invalid color? CSS for "Defining an invalid color" :root { --color-blue: blue; } .color-blue { color: var(--color-blue); } p { --color-blue: notacolor; } .demo-389 { --color-blue: blue; padding: 0.5rem; } .color-blue-389 { color: var(--color-blue); } .demo-389 p { --color-blue: notacolor; } I'm blue dabadee (maybe) Uh oh - it's surprisingly rendering as black. Why Traditional Fallbacks Can Fail # Ok, before we learn what that scary-sounding phrase means, let's take a look in DevTools and see if it gives us a clue about what's going on. That looks pretty normal, and doesn't seem to reveal that anything is wrong, making troubleshooting the error a lot trickier. You might know that custom properties allow a fallback value as second parameter, so perhaps that will help! Let's try. CSS for "Attempt resolution with custom property fallback" :root { --color-blue: blue; } .color-blue { color: var(--color-blue, blue); } p { --color-blue: notacolor; } .demo-371 { --color-blue: blue; padding: 0.5rem; } .color-blue-371 { color: var(--color-blue, blue); } .demo-371 p { --color-blue: notacolor; } I'm blue dabadee (maybe) Unfortunately, the text still renders as black. Ok, but our good friend the cascade exists, and back in the day we used to put things like vendor prefixed properties prior to the unprefixed ones. So, perhaps if we use a similar method and supply an extra color definition before the one that has the custom property it can fallback to that? CSS for "Attempt resolution with extra color definition" :root { --color-blue: blue; } .color-blue { color: blue; color: var(--color-blue); } p { --color-blue: notacolor; } .demo-107 { --color-blue: blue; padding: 0.5rem; } .color-blue-107 { color: blue; color: var(--color-blue); } .demo-107 p { --color-blue: notacolor; } I'm blue dabadee (maybe) Bummer, we don't seem to be making progress towards preventing this issue. This is because of the (slightly scary sounding) scenario invalid at computed value time. Although the browser has kept our definition that expects a custom property value, it's not until later that the browser tries to actually compute that value. In this case, it looks at both the .color-blue class and the value provided for the p element rule and attempts to apply the computed value of notacolor. At this stage, it has discarded the alternate value of blue originally provided by the class. Consequently, since notacolor is in fact not a color and therefore invalid, the best it can do is use either: an inherited value if the property is allowed to inherit and an ancestor has provided a value; or the initial value as defined in the CSS spec While color is an inheritable property, we haven't defined it on any ancestors, so the rendered color of black is due to the initial value. Refer to this earlier Modern CSS article about how custom property values are computed and learn more deeply about the condition of invalid at computed value time. Defining Types for Safer CSS # It's time to introduce @property to help solve this issue of what you may perceive as a surprising rendered value. The critical features @property provides are: defining acceptable types for specific custom properties enabling or disabling inheritance providing an initial value as a failsafe for invalid or undefined values This at-rule is defined on a per-custom property basis, meaning a unique definition is needed for each property for which you want to leverage these benefits. It is not a requirement, and you can certainly continue using custom properties without ever bringing in @property. Please note that at time of writing, @property is very newly cross-browser and I would advise you to consider it a progressive enhancement to benefit users in supporting browsers. Let's apply it to our blue dilemma and see how it fixes the issue of the otherwise invalid color supplied in the element rule. CSS for "Apply @property to --color-blue" @property --color-blue { syntax: "<color>"; inherits: true; initial-value: blue; } /* Prior rules also apply */ @property --c-blue { syntax: "<color>"; inherits: true; initial-value: blue; } .demo-672 { --c-blue: blue; padding: 0.5rem; } .color-blue-672 { color: var(--c-blue); } .demo-672 p { --c-blue: notacolor; } I'm blue dabadee (maybe) Success, our text is still blue despite the invalid definition! Additionally, DevTools is now helpful again: We can observe both that the invalid value is clearly an error, and we also are provided the full definition of the custom property via the hover overlay. Providing Types via syntax # Why would we need types for custom properties? Here are a few reasons: types help verify what makes a valid vs. invalid value without types, custom properties are very open-ended and can take nearly any value, including a blank space lack of types prevents browser DevTools from providing the optimal level of detail about which value is in use for a custom property In our @property definition, the syntax descriptor enables providing the allowed types for the custom property. We used "<color>", but other types include: "<length>" - numbers with units attached, ex. 4px or 3vw "<integer>" - decimal units 0 through 9 (aka "whole numbers") "<number>" - numbers which may have a fraction, ex. 1.25 "<percentage>" - numbers with a percentage sign attached, ex. 24% "<length-percentage>" - accepts valid <length> or <percentage> values A special case is "*" which stands for "universal syntax" and enables accepting any value, similar to the default behavior. This means you skip the typing benefit, but perhaps want the inheritance and/or initial value control. These types and more are listed for the syntax descriptor on MDN. The type applies to the computed value of the custom property, so the "<color>" type would be happy with both blue as well as light-dark(blue, cyan) (although only one of those is accepted into the initial-value as we will soon learn). Stronger Typing With Lists # Let's say we want to provide a little flexibility for our --color-blue custom property. We can use a list to provide valid options. Anything other than these exact values would be considered invalid, and use the initial-value instead (if inheritance didn't apply). These are called "custom idents", are case sensitive, and can be any value. CSS for "Defining a list within syntax" @property --color-blue { syntax: "blue | cyan | dodgerblue"; inherits: true; initial-value: blue; } .color-blue { color: var(--color-blue); } .demo p { --color-blue: dodgerblue; } @property --c2-blue { syntax: "blue | cyan | dodgerblue"; inherits: true; initial-value: blue; } .demo-396 { padding: 0.5rem; } .color-blue-396 { color: var(--c2-blue); } .demo-396 p { --c2-blue: dodgerblue; } I'm blue dabadee (maybe) Typing for Mixed Values # The pipe character (|) used in the previous list indicates an "or" condition. While we used explicit color names, it can also be used to say "any of these syntax types are valid." syntax: "<color> | <length>"; Typing for Multiple Values # So far, we've only typed custom properties that expect a single value. Two additional cases can be covered with an additional "multiplier" character, which should immediately follow the syntax component name. Use + to support a space-separated list, ex. "<length>+" Use # to support a comma-separated list, ex. "<length>#" This can be useful for properties that allow multiple definitions, such as background-image. CSS for "Support multiple values for syntax" @property --bg-gradient{ syntax: "<image>#"; inherits: false; initial-value: repeating-linear-gradient(to right, blue 10px 12px, transparent 12px 22px), repeating-linear-gradient(to bottom, blue 10px 12px, transparent 12px 22px); } .box { background-image: var(--bg-gradient); inline-size: 5rem; aspect-ratio: 1; border-radius: 4px; border: 1px solid; } @property --bg-gradient{ syntax: "<image>#"; inherits: false; initial-value: repeating-linear-gradient(to right, blue 10px 12px, transparent 12px 22px), repeating-linear-gradient(to bottom, blue 10px 12px, transparent 12px 22px); } .box-310 { background-image: var(--bg-gradient); inline-size: 5rem; aspect-ratio: 1; border-radius: 4px; border: 1px solid; } Typing for Multi-Part Mixed Values # Some properties accept mixed types to develop the full value, such as box-shadow which has potential types of inset, a series of <length> values, and a <color>. Presently, it's not possible to type this in a single @property definition, although you may attempt to try something like "<length>+ <color>". However, this effectively invalidates the @property definition itself. One alternative is to break up the custom property definitions so that we can allow a series of lengths, and then allow a color. While slightly more cumbersome, this allows us to still get the benefit of typing which relieves the potential errors we covered earlier. CSS for "Support multi-part mixed values for syntax" @property --box-shadow-length { syntax: "<length>+"; inherits: false; initial-value: 0px 0px 8px 2px; } @property --box-shadow-color { syntax: "<color>"; inherits: false; initial-value: hsl(0 0% 75%); } .box { box-shadow: var(--box-shadow-length) var(--box-shadow-color); inline-size: 5rem; aspect-ratio: 1; border-radius: 4px; } @property --box-shadow-length { syntax: "<length>+"; inherits: false; initial-value: 0px 0px 8px 2px; } @property --box-shadow-color { syntax: "<color>"; inherits: false; initial-value: hsl(0 0% 75%); } .box-707 { box-shadow: var(--box-shadow-length) var(--box-shadow-color); inline-size: 5rem; aspect-ratio: 1; border-radius: 4px; } Allowing Any Type # If you're less concerned about the "type" of a property for something like box-shadow and care more about inheritance or the initial value, you can instead use the universal syntax definition to allow any value. This negates the problem we just mitigated by splitting up the parts. @property --box-shadow { syntax: "*"; inherits: false; initial-value: 0px 0px 8px 2px hsl(0 0% 75%); } Because the universal syntax accepts any value, an additional "multiplier" is not needed. Note: The initial-value is still required to be computationally independent as we'll learn about soon under limitations of initial-value. Join my newsletter for article updates, CSS tips, and front-end resources! Don’t fill this out if you're human: Email Subscribe Modifying Inheritance # A subset of CSS properties are inheritable, such as color. The inherits descriptor for your @property registration allows you to control that behavior for your custom property. If true, the computed value can look to an ancestor for its value if the property is not explicitly set, and if a value isn't found it will use the initial value. If false, the computed value will use the initial value if the property is not explicitly set for the element, such as via a class or element rule. In this demonstration, the --box-bg has been set to inherits: false, and only the outer box has an explicit definition via the applied class. The inner box uses the initial value since inheritance is not allowed. CSS for "Result of setting inherits: false" @property --box-bg { syntax: "<color>"; inherits: false; initial-value: cyan; } .box { background-color: var(--box-bg); aspect-ratio: 1; border-radius: 4px; padding: 1.5rem; } .outer-box { --box-bg: purple; } @property --box-bg { syntax: "<color>"; inherits: false; initial-value: cyan; } .box-215 { background-color: var(--box-bg); aspect-ratio: 1; border-radius: 4px; padding: 1.5rem; } .outer-box-215 { --box-bg: purple; } Valid Use of initial-value # Unless your syntax is open to any value using the universal syntax definition - "*" - then it is required to set an initial-value to gain the benefits of registering a custom property. As we've already experienced, use of initial-value was critical in preventing the condition of a completely broken render due to invalid at computed value time. Here are some other benefits of using @property with an initial-value. When building design systems or UI libraries, it's important to ensure your custom properties are robust and reliable. Providing an initial-value can help prevent a broken experience. Plus, typing properties also meshes nicely with keeping the intent of design tokens which may be expressed as custom properties. Dynamic computation scenarios such as the use of clamp() have the potential to include an invalid value, whether through an error or from the browser not supporting something within the function. Having a fallback via initial-value ensures that your design remains functional. This fallback behavior is a safeguard for unsupported features as well, though that can be limited by whether the @property rule is supported in the browser being used. Review additional ways to prevent invalid at computed time that may be more appropri'''
