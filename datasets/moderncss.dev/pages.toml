["https://moderncss.dev/animated-image-gallery-captions-with-bonus-ken-burns-effect"]
title = "Responsive Image Gallery With Animated Captions | Modern CSS Solutions"
description = "This technique explores using: `object-fit` for responsive image scaling,  `aspect-ratio` for consistent image sizes, a CSS Grid trick to replace absolute positioning, and CSS transforms for animated effects."
full_description = '''.demo .demo--content { background-color: transparent; padding: 1rem; } Responsively resizing images is a common need, and modern CSS provides tools for ensuring a consistent aspect-ratio while not distorting the images. And grid gives us flexibility for a gallery layout as well as positioning multiple elements in a shared space. This responsive gallery technique explores using: object-fit for responsive image scaling aspect-ratio for consistent image sizes A CSS Grid trick to replace absolute positioning CSS transforms for animated effects handling for touch devices respecting reduced motion Gallery HTML # Here is our initial HTML, which is an ul where each li contains a figure with the image and figcaption: <ul class="gallery" role="list"> <li> <figure> <img alt="" src="https://picsum.photos/550/300" /> <figcaption>Candy canes ice cream</figcaption> </figure> </li> <li> <figure> <img alt="" src="https://picsum.photos/400" /> <figcaption>Ice cream biscuit</figcaption> </figure> </li> <li> <figure> <img alt="" src="https://picsum.photos/600/450" /> <figcaption>Cream biscuit marzipan</figcaption> </figure> </li> </ul> What's that role="list" doing there? It ensures assistive technology still interprets the element as a list after we remove list styling with CSS. I've used different image sizes both to showcase how object-fit works in terms of fitting its container, and also to lessen the chance of duplicate images from the picsum service. Note that due to using a random image service, I haven't provided full alt descriptions or real figcaption text for these demo images. Ideally you should write alt that describes the image, and use figcaption to provide context for the image as a figure. I recommend this resource to learn more about the importance of writing alt and figcaption. Base Gallery Styles # Since we've used a list, we need to remove default list styles, and we will also set the list up as a grid container. These initial styles achieve placing our list items in a row and ensures the images stay in their grid columns but does not resize them. CSS for "gallery class" .gallery { list-style: none; padding: 0; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(20ch, 1fr)); gap: 1rem; } .gallery img { display: block; width: 100%; } .gallery-12 { list-style: none; padding: 0; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(20ch, 1fr)); gap: 1rem; } .gallery-12 img { display: block; width: 100%; } Candy canes ice cream Ice cream biscuit Cream biscuit marzipan Gallery Card and Image Styles # If you're like me and have tried to do this in years past, you probably threw your rollerball mouse across the room trying to figure out why position: absolute wasn't playing nicely with your jQuery animations. CSS Grid and CSS transforms are here to save the day! 🎉 We're going to setup the figure to use grid display, and also define a custom property to hold the desired image height. And we'll give it a background in case the image is a little slow to load. CSS for "Base figure display styles" .gallery figure { --gallery-height: 15rem; /* reset figure default margin */ margin: 0; height: var(--gallery-height); background-color: hsl(200, 85%, 2%); } .gallery-182 { list-style: none; padding: 0; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(20ch, 1fr)); gap: 1rem; } .gallery-182 img { display: block; width: 100%; } .gallery-182 figure { --gallery-height: 15rem; /* reset figure default margin */ margin: 0; height: var(--gallery-height); background-color: hsl(200, 85%, 2%); } Candy canes ice cream Ice cream biscuit Cream biscuit marzipan Next, we apply object-fit to the image along with width: 100% and pull in the custom property for the height so that it scales to the size of the figure. The magic of object-fit: cover is that no distortion occurs. CSS for "Image display styles" .gallery img { display: block; width: 100%; object-fit: cover; height: var(--gallery-height); } .gallery-593 { list-style: none; padding: 0; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(20ch, 1fr)); gap: 1rem; } .gallery-593 img { display: block; width: 100%; object-fit: cover; height: var(--gallery-height); } .gallery-593 figure { --gallery-height: 15rem; /* reset figure default margin */ margin: 0; height: var(--gallery-height); background-color: hsl(200, 85%, 2%); } Candy canes ice cream Ice cream biscuit Cream biscuit marzipan If you resize the demo, you'll see that the img is now behaving much as if it were applied as a background-image and using background-size: cover. The img tag is acting like a container for it's own contents. For a helpful intro to object-fit for responsive image scaling, check out this earlier post from this series. You might also like my 3-minute free egghead lesson on object-fit. We can improve the image sizing by upgrading to using aspect-ratio when supported using the native CSS feature @supports. When it is supported, we'll drop the height and swap for defining the aspect-ratio to use. This allows us to have more consistently sized images across viewports. CSS for "Use aspect-ratio with @supports" /* Add aspect-ratio custom property */ .gallery figure { --gallery-aspect-ratio: 4/3; } @supports (aspect-ratio: 1) { .gallery figure, .gallery img { aspect-ratio: var(--gallery-aspect-ratio); /* Remove height to prevent distorting aspect-ratio */ height: auto; } } .gallery-140 { list-style: none; padding: 0; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(20ch, 1fr)); gap: 1rem; } .gallery-140 img { display: block; width: 100%; object-fit: cover; height: var(--gallery-height); } .gallery-140 figure { --gallery-height: 15rem; --gallery-aspect-ratio: 4/3; /* reset figure default margin */ margin: 0; height: var(--gallery-height); background-color: hsl(200, 85%, 2%); } @supports (aspect-ratio: 1) { .gallery-140 figure, .gallery-140 img { aspect-ratio: var(--gallery-aspect-ratio); /* Remove height to prevent distorting aspect-ratio */ height: auto; } } Candy canes ice cream Ice cream biscuit Cream biscuit marzipan Positioning the Caption # Now at this point, the caption has flowed naturally according to DOM order below the image. This is also due to default CSS grid behavior because it's assumed that it should be in its own "cell" and by default grid items flow down the y-axis in rows. To resolve this, we create a named grid-template-areas for the figure, and assign both the img and figcaption to live there. Then, we'll use grid positioning to set place-items: end on the card to move the caption to the bottom right of the "cell". CSS for "Styles to position the figcaption" .gallery figure { /* ...existing styles */ display: grid; grid-template-areas: "card"; place-items: end; border-radius: 0.5rem; overflow: hidden; } .gallery figure > * { grid-area: card; } .gallery figcaption { transform: translateY(100%); } .gallery-74 { list-style: none; padding: 0; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(20ch, 1fr)); gap: 1rem; } .gallery-74 img { display: block; width: 100%; object-fit: cover; height: var(--gallery-height); } .gallery-74 figure { --gallery-height: 15rem; --gallery-aspect-ratio: 4/3; /* reset figure default margin */ margin: 0; height: var(--gallery-height); background-color: hsl(200, 85%, 2%); display: grid; grid-template-areas: "card"; place-items: end; border-radius: 0.5rem; overflow: hidden; } @supports (aspect-ratio: 1) { .gallery-74 figure, .gallery-74 img { aspect-ratio: var(--gallery-aspect-ratio); /* Remove height to prevent distorting aspect-ratio */ height: auto; } } .gallery-74 figure > * { grid-area: card; } .gallery-74 figcaption { transform: translateY(100%); } Candy canes ice cream Ice cream biscuit Cream biscuit marzipan You may notice the caption is also no longer visible, partly from adding overflow: hidden to the figure. Then to place the caption, we used CSS transforms to set the initial position outside the figure. A value of 100% for translate will move the element 100% relative to the axis it's placed on. So, translateY(100%) effectively moves the caption "down" out of the initial view. Join my newsletter for article updates, CSS tips, and front-end resources! Don’t fill this out if you're human: Email Subscribe Animating the Caption # Our animation will trigger on hover, and we want it to smoothly animate in and back out again. This requires setting up the transition property. We'll define that we expect a transition on the transform property, and that the transition duration should be 800ms and use the ease-in timing function. The :hover styles will actually be placed on the figure since it is the containing element, so we'll also add a transform definition that moves the caption back to it's inherent starting point by returning it to position 0 on the y-axis. CSS for "Style and animate the figcaption" .gallery figcaption { transform: translateY(100%); transition: transform 800ms ease-in; /* Visual styles for the caption */ padding: 0.25em 0.5em; border-radius: 4px 0 0 0; background-color: hsl(0 0% 100% / 87%); } .gallery figure:hover figcaption { transform: translateY(0); } .gallery-287 { list-style: none; padding: 0; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(20ch, 1fr)); gap: 1rem; } .gallery-287 img { display: block; width: 100%; object-fit: cover; height: var(--gallery-height); } .gallery-287 figure { --gallery-height: 15rem; --gallery-aspect-ratio: 4/3; /* reset figure default margin */ margin: 0; height: var(--gallery-height); background-color: hsl(200, 85%, 2%); display: grid; grid-template-areas: "card"; place-items: end; border-radius: 0.5rem; overflow: hidden; } @supports (aspect-ratio: 1) { .gallery-287 figure, .gallery-287 img { aspect-ratio: var(--gallery-aspect-ratio); /* Remove height to prevent distorting aspect-ratio */ height: auto; } } .gallery-287 figure > * { grid-area: card; } .gallery-287 figcaption { transform: translateY(100%); transition: transform 800ms ease-in; /* Visual styles for the caption */ padding: 0.25em 0.5em; border-radius: 4px 0 0 0; background-color: hsl(0 0% 100% / 87%); } .gallery-287 figure:hover figcaption { transform: translateY(0); } Candy canes ice cream Ice cream biscuit Cream biscuit marzipan And ta-da! We have a basic animated caption. Ken Burns image effect # You may not have known the name, but you've seen the effect: a slow, smooth pan and zoom combo of a still image, so named due to being popularized by documentary filmmaker Ken Burns. Using the principles we've already covered with the transition and tranform properties, we can again combine them on the img to add this effect on hover as well. We add an additional value to transform to set the default scale to 0 since on hover we'll be scaling it up so we need to set the point it starts from. We're using a generous duration of 1200ms for the transition to take place in order to create a smooth pan and zoom effect. .gallery img { transform: scale(1) translate(0, 0); transition: transform 1200ms ease-in; } Next we add the :hover transition into the figure rule, adding both a bit more of a scale up for the zoom-in effect, in addition to pulling it back left on the x-axis to -8% and also a bit up on the y-axis with -3%. You can adjust the translate values to your taste. .gallery figure:hover img { transform: scale(1.3) translate(-8%, -3%); } There's one more thing, which is that we have set our transition durations with a 400ms difference. We can add that value as a delay for the caption. Be aware that the delay applies prior to the transition on hover, and at the end of the transition out off-hover. Personally I like this effect since it means that in both directions the animations end together. .gallery figcaption { /* update to add the 400ms delay */ transition: transform 800ms 400ms ease-in; } Altogether, here is our gallery with the Ken Burns effect on the image and caption. CSS for "Ken Burns style animated figures" .gallery img { transform: scale(1) translate(0, 0); transition: transform 1200ms ease-in; } .gallery figure:hover img { transform: scale(1.3) translate(-8%, -3%); } .gallery figcaption { /* added 400ms delay */ transition: transform 800ms 400ms ease-in; } .gallery-68 { list-style: none; padding: 0; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(20ch, 1fr)); gap: 1rem; } .gallery-68 img { display: block; width: 100%; object-fit: cover; height: var(--gallery-height); transform: scale(1) translate(0, 0); transition: transform 1200ms ease-in; } .gallery-68 figure { --gallery-height: 15rem; --gallery-aspect-ratio: 4/3; /* reset figure default margin */ margin: 0; height: var(--gallery-height); background-color: hsl(200, 85%, 2%); display: grid; grid-template-areas: "card"; place-items: end; border-radius: 0.5rem; overflow: hidden; } @supports (aspect-ratio: 1) { .gallery-68 figure, .gallery-68 img { aspect-ratio: var(--gallery-aspect-ratio); /* Remove height to prevent distorting aspect-ratio */ height: auto; } } .gallery-68 figure > * { grid-area: card; } .gallery-68 figcaption { transform: translateY(100%); transition: transform 800ms 400ms ease-in; /* Visual styles for the caption */ padding: 0.25em 0.5em; border-radius: 4px 0 0 0; background-color: hsl(0 0% 100% / 87%); } .gallery-68 figure:hover figcaption { transform: translateY(0); } .gallery-68 figure:hover img { transform: scale(1.3) translate(-8%, -3%); } Candy canes ice cream Ice cream biscuit Cream biscuit marzipan Don't forget about :focus # Hover is fine for mouse-users, but what about those who for various reasons use primarily their keyboard to navigate? The li element isn't inherently a focusable element, so just adding :focus styles will not change behavior. We have two options: If you plan to link the images anyway, wrap the figure with a link element and hook :focus styles to that If a link isn't needed, apply tabindex="0" to each figure which will enable them as focusable elements We'll use the tabindex approach for this demo. <figure tabindex="0"></figure> You can test this by tabbing and you will notice the standard focus halo outline. We'll customize the outline and also update the rules to apply the same :hover behavior on :focus. CSS for "Reveal captions on figure:focus" .gallery figure:focus { outline: 2px solid white; outline-offset: 2px; } .gallery figure:hover figcaption, .gallery figure:focus figcaption { transform: translateY(0); } .gallery figure:hover img, .gallery figure:focus img { transform: scale(1.3) translate(-8%, -3%); } .gallery-748 { list-style: none; padding: 0; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(20ch, 1fr)); gap: 1rem; } .gallery-748 img { display: block; width: 100%; object-fit: cover; height: var(--gallery-height); transform: scale(1) translate(0, 0); transition: transform 1200ms ease-in; } .gallery'''
