["https://moderncss.dev/developing-for-imperfect-future-proofing-css-styles"]
title = "Developing For Imperfect: Future Proofing CSS Styles | Modern CSS Solutions"
description = "How do we plan future-proof styles in a world with an infinite degree of device and user ability variance? Let's explore how things can break and how modern CSS provides solutions."
full_description = '''How do we plan future-proof styles in a world with an infinite degree of device and user ability variance? Let's explore how things can break and how modern CSS provides solutions. This episode will cover handling for: variable content length and overflow unpredictable media sizes internationalization accessibility-related user settings We'll explore creating a robust comment thread component. Here's our starting point - an exact mimic of the layout you received from design, good job! CSS for "Initial Comment Thread" .comment-list { list-style: none; padding: 0.5rem; margin: 0; display: grid; gap: 1.5rem; } .comment .comment-list { grid-column-start: 2; grid-column-end: -1; padding: 0; } .comment { display: grid; grid-template-columns: 64px 1fr; gap: 1rem; } .comment-body { display: grid; gap: .5rem; color: #444; } .comment-meta { color: #767676; font-size: .875rem; } .comment-body a { color: inherit; } .comment-meta a { color: mediumvioletred; } .comment-list-883 { list-style: none; padding: 0.5rem; margin: 0; display: grid; gap: 1.5rem; } .comment-883 .comment-list-883 { grid-column-start: 2; grid-column-end: -1; padding: 0; } .comment-883 { display: grid; grid-template-columns: 64px 1fr; gap: 1rem; } .comment-body-883 { display: grid; gap: .5rem; color: #444; } .comment-meta-883 { color: #767676; font-size: .875rem; } .comment-body-883 a { color: inherit; } .comment-meta-883 a { color: mediumvioletred; } @baywriter 15 mins ago Lemon drops danish soufflé gummies dragée apple pie. Pudding gummi bears gingerbread cotton candy toffee. Caramels halvah sweet roll lollipop chocolate. @michelle 1 hour ago Lemon drops danish soufflé gummies dragée apple pie. Pudding gummi bears gingerbread cotton candy toffee. Caramels halvah sweet roll lollipop chocolate. @claudia87 October 31, 2021 at 6:54 PM Lemon drops danish soufflé gummies dragée apple pie. Pudding gummi bears gingerbread cotton candy toffee. Caramels halvah sweet roll lollipop chocolate. But if you resize it, you'll already notice a few problems, particularly with overflow. Avatar illustrations are part of the Women Power collection on Blush by Sara Pelaez. Responsive Planning # When you can't precisely plan around content, plan for flexibility. Rather than setting absolutes, we can use CSS functions to choose the best value relative to the current context. In our .comment styles, we set a precise pixel value for the avatar. Instead, we can use the CSS function min to select the minimum computed value between a list of options. CSS for "Updated Avatar Grid Column" .comment { grid-template-columns: 64px 1fr; grid-template-columns: min(64px, 15%) 1fr; } .comment-list-403 { list-style: none; padding: 0.5rem; margin: 0; display: grid; gap: 1.5rem; } .comment-403 .comment-list-403 { grid-column-start: 2; grid-column-end: -1; padding: 0; } .comment-403 { display: grid; grid-template-columns: min(64px, 15%) 1fr; gap: 1rem; } .comment-body-403 { display: grid; gap: .5rem; color: #444; } .comment-meta-403 { color: #767676; font-size: .875rem; } .comment-body-403 a { color: inherit; } .comment-meta-403 a { color: mediumvioletred; } @baywriter 15 mins ago Lemon drops danish soufflé gummies dragée apple pie. Pudding gummi bears gingerbread cotton candy toffee. Caramels halvah sweet roll lollipop chocolate. @michelle 1 hour ago Lemon drops danish soufflé gummies dragée apple pie. Pudding gummi bears gingerbread cotton candy toffee. Caramels halvah sweet roll lollipop chocolate. @claudia87 October 31, 2021 at 6:54 PM Lemon drops danish soufflé gummies dragée apple pie. Pudding gummi bears gingerbread cotton candy toffee. Caramels halvah sweet roll lollipop chocolate. In this case, the impact is that the avatar will never exceed 64px for larger viewports. And for smaller viewports or within narrower containers, it will be computed as 15% of the total comment width. As this example shows, sometimes we can turn over layout choices to the browser to make contextually versus define precise values within media queries. Always Expect More # Whether characters or elements, always expect more than the original design has planned. Our avatar update has already improved things. But we're still viewing the component with "happy path" content from our designer that doesn't reflect real-world data. Notably, the user names and comment lengths are relatively short. Let's update our demo data to have a bit more variance and "real" avatars: .comment-list-754 { list-style: none; padding: 0.5rem; margin: 0; display: grid; gap: 1.5rem; } .comment-754 .comment-list-754 { grid-column-start: 2; grid-column-end: -1; padding: 0; } .comment-754 { display: grid; grid-template-columns: min(64px, 15%) 1fr; gap: 1rem; } .comment-body-754 { display: grid; gap: .5rem; color: #444; } .comment-meta-754 { color: #767676; font-size: .875rem; } .comment-body-754 a { color: inherit; } .comment-meta-754 a { color: mediumvioletred; } @baywriter_cactusmom 15 mins ago Podcasting operational change management inside of workflows to establish a framework. Taking seamless key performance indicators offline to maximise the long tail. @michelle_n_catz@superremail.co.uk 1 hour ago Leverage agile frameworks to provide a robust synopsis for high level overviews. Iterative approaches to corporate strategy foster collaborative thinking to further the overall value proposition. Organically grow the holistic world view of disruptive innovation via workplace diversity and empowerment. Have you seen https://moderncss.dev/3-css-grid-techniques-to-make-you-a-grid-convert/? Bring to the table win-win survival strategies to ensure proactive domination. At the end of the day, going forward, a new normal that has evolved from generation X is on the runway heading towards a streamlined cloud solution. @claudia87_author October 31, 2021 at 6:54 PM Capitalize on low hanging fruit to identify a ballpark value added activity to beta test. Override the digital divide with additional clickthroughs from DevOps. Nanotechnology immersion along the information highway will close the loop on focusing solely on the bottom line. Not as pretty as our mockup mimic 😊 Now, if you've been following along and testing our component via resizing, you'll see we have the possibility of content overflow. Let's resolve it first for the .comment-meta, which is the small tag containing the username and date. We will update the layout method to allow the username and date to line up on wider viewports and stack on smaller viewports. Simple flex behavior allows this since child elements will be their max-width when there's room and flow to a new row when the containing element reduces below that max-width. CSS for "Update Comment Meta Layout" .comment-meta { display: flex; flex-wrap: wrap; gap: 0.5rem; } .comment-list-209 { list-style: none; padding: 0.5rem; margin: 0; display: grid; gap: 1.5rem; } .comment-209 .comment-list-209 { grid-column-start: 2; grid-column-end: -1; padding: 0; } .comment-209 { display: grid; grid-template-columns: min(64px, 15%) 1fr; gap: 1rem; } .comment-body-209 { display: grid; gap: .5rem; color: #444; } .comment-meta-209 { color: #767676; font-size: .875rem; display: flex; flex-wrap: wrap; gap: 0.5rem; } .comment-body-209 a { color: inherit; } .comment-meta-209 a { color: mediumvioletred; } @baywriter_cactusmom 15 mins ago Podcasting operational change management inside of workflows to establish a framework. Taking seamless key performance indicators offline to maximise the long tail. @michelle_n_catz@superremail.co.uk 1 hour ago Leverage agile frameworks to provide a robust synopsis for high level overviews. Iterative approaches to corporate strategy foster collaborative thinking to further the overall value proposition. Organically grow the holistic world view of disruptive innovation via workplace diversity and empowerment. Have you seen https://moderncss.dev/3-css-grid-techniques-to-make-you-a-grid-convert/? Bring to the table win-win survival strategies to ensure proactive domination. At the end of the day, going forward, a new normal that has evolved from generation X is on the runway heading towards a streamlined cloud solution. @claudia87_author October 31, 2021 at 6:54 PM Capitalize on low hanging fruit to identify a ballpark value added activity to beta test. Override the digital divide with additional clickthroughs from DevOps. Nanotechnology immersion along the information highway will close the loop on focusing solely on the bottom line. While flexbox gap support is gaining, in this case, the degraded behavior is simply very slightly closer elements, so it isn't too detrimental not to provide a fallback. Go ahead and test this version and see how the dates bump to a new line when there isn't enough space for their full width. Preventing Content Overflow # In the demo data, the longer email in the second comment eventually causes overflow scroll on smaller viewports. So does the extended URL in the comment body. The fix could be scoped to only the link elements if we'd like. However, due to the nature of a comment thread, it seems to make sense to be extra-preventative about overflow content in this context So we'll apply two properties to the top-level .comment in order to cascade to all the content within. CSS for "Preventing Content Overflow" .comment { /* Help prevent overflow of long words/names/URLs */ overflow-wrap: break-word; /* Optional, not supported for all languages */ hyphens: auto; } .comment a { /* Remove from links to prevent perceiving false hyphens */ hyphens: none; } .comment-list-378 { list-style: none; padding: 0.5rem; margin: 0; display: grid; gap: 1.5rem; } .comment-378 .comment-list-378 { grid-column-start: 2; grid-column-end: -1; padding: 0; } .comment-378 { display: grid; grid-template-columns: min(64px, 15%) 1fr; gap: 1rem; overflow-wrap: break-word; hyphens: auto; } .comment-body-378 { display: grid; gap: .5rem; color: #444; } .comment-meta-378 { color: #767676; font-size: .875rem; display: flex; flex-wrap: wrap; gap: 0.5rem; } .comment-body-378 a { color: inherit; hyphens: none; } .comment-meta-378 a { color: mediumvioletred; } @baywriter_cactusmom 15 mins ago Podcasting operational change management inside of workflows to establish a framework. Taking seamless key performance indicators offline to maximise the long tail. @michelle_n_catz@superremail.co.uk 1 hour ago Leverage agile frameworks to provide a robust synopsis for high level overviews. Iterative approaches to corporate strategy foster collaborative thinking to further the overall value proposition. Organically grow the holistic world view of disruptive innovation via workplace diversity and empowerment. Have you seen https://moderncss.dev/3-css-grid-techniques-to-make-you-a-grid-convert/? Bring to the table win-win survival strategies to ensure proactive domination. At the end of the day, going forward, a new normal that has evolved from generation X is on the runway heading towards a streamlined cloud solution. @claudia87_author October 31, 2021 at 6:54 PM Capitalize on low hanging fruit to identify a ballpark value added activity to beta test. Override the digital divide with additional clickthroughs from DevOps. Nanotechnology immersion along the information highway will close the loop on focusing solely on the bottom line. Notice we removed the possibility of hyphens from links. In this case, the full links are visible like in our example, and someone tries to write it down or read it aloud. CSS-inserted hyphens are not included if a user copies the text. As noted, hyphens are also not consistently available for all languages in all browsers. You can review hyphens support on MDN. With overflow-wrap: break-word, any text string may be broken onto a new line once the containing element doesn't have room for its full-width. When hyphens are supported, the bonus effect is reducing a "ragged edge" from odd spaces caused by broken words. Optionally, you may want to update links to use overflow-wrap: anywhere; to prevent an empty space if the browser decides to move the link to a new line before applying the break. You can see our current solution on smaller viewports currently leaves a space before the long exposed link. Try out resizing the component now, and perhaps even pop open dev tools to inspect and toggle on and off these properties to see the difference in their effects. Join my newsletter for article updates, CSS tips, and front-end resources! Don’t fill this out if you're human: Email Subscribe Handling Variable Media Dimensions # Now let's deal with those avatars. First, we set border-radius to create a circle appearance. Then we ensure the image fills the grid column with width: 100%. Following that, we turn the image into its own container and allow the image content to fill but not exceed the img dimensions with object-fit: cover. We end the rule with a cutting-edge property of aspect-ratio to ensure a perfect square. CSS for "Updated Avatar Dimensions" .comment img { border-radius: 50%; width: 100%; object-fit: cover; aspect-ratio: 1; } @supports not (aspect-ratio: 1) { .comment-avatar { position: relative; height: 0; padding-bottom: 100%; } .comment-avatar img { position: absolute; height: 100%; } } .comment-list-890 { list-style: none; padding: 0.5rem; margin: 0; display: grid; gap: 1.5rem; } .comment-890 .comment-list-890 { grid-column-start: 2; grid-column-end: -1; padding: 0; } .comment-890 { display: grid; grid-template-columns: min(64px, 15%) 1fr; gap: 1rem; overflow-wrap: break-word; hyphens: auto; } .comment-body-890 { display: grid; gap: .5rem; color: #444; } .comment-meta-890 { color: #767676; font-size: .875rem; display: flex; flex-wrap: wrap; gap: 0.5rem; } .comment-body-890 a { color: inherit; hyphens: none; } .comment-meta-890 a { color: mediumvioletred; } .comment-avatar-890 img { border-radius: 50%; width: 100%; object-fit: cover; aspect-ratio: 1; } @supports not (aspect-ratio: 1) { .comment-avatar-890 { position: relative; height: 0; padding-bottom: 100%; } .comment-avatar-890 img { position: absolute; height: 100%; } } @baywriter_cactusmom 15 mins ago Podcasting operational change management inside of workflows to establish a framework. Taking seamless key performance indicators offline to maximise the long tail. @michelle_n_catz@superremail.co.uk 1 hour ago Leverage agile frameworks to provide a robust synopsis for high level overviews. Iterative approaches to corporate strategy foster collaborative thinking to further the overall value proposition. Organically grow the holistic world view of disruptive innovation via workplace diversity and empowerment. Have you seen https://moderncss.dev/3-css-grid-techniques-to-make-you-a-grid-convert/? Bring to the table win-win survival strategies to ensure proactive domination. At the end of the day, going forward, a new normal that has evolved from generation X is on the runway heading towards a streamlined cloud solution. @claudia87_author October 31, 2021 at'''
