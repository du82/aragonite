["https://moderncss.dev/modern-css-upgrades-to-improve-accessibility"]
title = "Modern CSS Upgrades To Improve Accessibility | Modern CSS Solutions"
description = "Accessibility is a critical skill for developers doing work at any point in the stack. For front-end tasks, modern CSS provides capabilities we can leverage to make layouts more accessibly inclusive for users of all abilities across any device."
full_description = '''Accessibility is a critical skill for developers doing work at any point in the stack. For front-end tasks, modern CSS provides capabilities we can leverage to make layouts more accessibly inclusive for users of all abilities across any device. This post will cover a range of topics: Focus Visibility Focus vs. Source Order Desktop Zoom and Reflow Sizing Interactive Targets Respecting Color and Contrast Settings Accessibility Learning Resources What Does "Accessible" Mean? # Accessible websites are ones that are created without barriers for users of various abilities to access content or perform actions. An internationally agreed-upon standard called the Web Content Accessibility Guidelines - or WCAG - provides success criteria to help guide you towards creating accessible experiences. Common accessibility barriers include: inability to see content or distinguish interface elements due to poor color contrast reduced or removed access to non-text content such as within images or charts due to failing to provide alternative text trapping keyboard users due to not managing focus for interactive elements causing headaches or worse for users with vestibular disorders due to motion and flashing/blinking animations preventing users of assistive technology such as screen readers from performing actions due to failure to make custom controls accommodate expected patterns limiting common assistive technology navigation methods due to not using semantic HTML, including heading hierarchy and landmark elements Success criteria "are designed to be broadly applicable to current and future web technologies, including dynamic applications, mobile, digital television, etc." We are going to examine a few success criteria and how modern CSS helps provide accessible solutions. Focus Visibility # An all too common violation that I have done myself in the past is to remove :focus outlines on links, buttons, and other interactive controls. Without providing an alternative :focus style, this is immediately a violation of the WCAG Success Criterion 2.4.11: Focus Appearance. Frequently, the reason this is removed is due to feeling the native browser style is not attractive or doesn't fit in with the design choices of the meta. But with modern CSS, we have a new property that can help make outlines more appealing. Using outline-offset, we can provide a positive value to position the outline away from the element. For the offset, we'll use the em unit to position the outline relative to the element based on its font-size. Bonus: We're setting the outline-width value using the max() function to ensure it doesn't shrink below a computed value of 1px while allowing it to also be relatively sized using em. Select the demo button to display the :focus outline. CSS for "Focus Styles With Positive `outline-offset`" button:focus { outline: max(1px, 0.1em) solid currentColor; outline-offset: 0.25em; } .outline-offset-359 { color: purple; line-height: 1; font-size: 1.5rem; cursor: pointer; } .outline-offset-359:focus { outline: max(1px, 0.1em) solid currentColor; outline-offset: 0.25em; } Demo Button Alternatively, set outline-offset using a negative value to inset the outline from the element's perimeter. CSS for "Focus Styles With Negative `outline-offset`" button:focus { outline: max(1px, 0.1em) dashed currentColor; outline-offset: -0.25em; } .outline-offset-260 { background-color: purple; color: white; padding: 0.5em; border-radius: 4px; line-height: 1; font-size: 1.5rem; cursor: pointer; } .outline-offset-260:focus { outline: max(1px, 0.1em) dashed currentColor; outline-offset: -0.25em; } Demo Button There is also a new pseudo-class that you can consider using in some circumstances. The :focus-visible pseudo-class will display an outline (or user-defined style) only when the device/browser (user agent) determines it needs to be visible. Typically this means it will appear for keyboard users upon tab key interaction but not for mouse users. Using this update, our button styles will likely only show when you keyboard tab into the button. CSS for "Focus Styles With Negative `outline-offset`" button:focus { outline: none; } button:focus-visible { outline: max(1px, 0.1em) dashed currentColor; outline-offset: -0.25em; } .outline-offset-99 { background-color: blue; color: white; padding: 0.5em; border-radius: 4px; line-height: 1; font-size: 1.5rem; cursor: pointer; } .outline-offset-99:focus { outline: none; } .outline-offset-99:focus-visible { outline: max(1px, 0.1em) dashed currentColor; outline-offset: -0.25em; } Demo Button Note that :focus-visible support is still rolling out to all browsers, notably missing from Safari. If you would like to try using it, here is an example of including it as a progressive enhancement. We're taking advantage of the fact that a browser that doesn't understand :focus-visible will throw away the rule that removes the outline for :focus. Meaning, the first rule for button:focus will apply to browsers that don't support :focus-visible, and the second two rules will apply when :focus-visible is supported. Interestingly, the :focus:not(:focus-visible) gives a false impression that :focus-visible is working in Safari and even Internet Explorer 11. button:focus { outline: max(1px, 0.1em) dashed currentColor; outline-offset: -0.25em; } button:focus:not(:focus-visible) { outline: none; } button:focus-visible { outline: max(1px, 0.1em) dashed currentColor; outline-offset: -0.25em; } Focus vs. Source Order # Another focus related criterion is Success Criterion 2.4.3: Focus Order. For both visual and non-visual users, the focus order - which is typically initiated by keyboard tabbing - should proceed logically. Particularly for visual users, the focus order should follow an expected path which usually means following source order. From the criterion documentation linked previously: "For example, a screen reader user interacts with the programmatically determined reading order, while a sighted keyboard user interacts with the visual presentation of the Web page. Care should be taken so that the focus order makes sense to both of these sets of users and does not appear to either of them to jump around randomly." Modern CSS technically provides layout properties to re-arrange visual order into something different than source order. The impact of this is potentially failing the focus order success criterion if there are focusable elements that are being re-arranged into a surprising order. If you are able, browse the following demo using your tab key and take notice of what you expected to happen versus what actually happened. When you're finished, or if a tab key is not presently an available input for you, check the box to reveal the tab order. [class*="source-order"] { color: #222; } .source-order-51 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; list-style: none; } .source-order-51 li { padding: 1rem; text-align: center; } .source-order-51 li a { display: grid; place-content: center; color: inherit; } .source-order__label-51 { font-weight: bold; } .source-order__label-51, .source-order__checkbox-51 { display: inline-block; margin-top: 0.5rem; margin-left: 0.5rem; margin-bottom: 1.5rem; } .source-order__checkbox-51:checked ~ ol { list-style: decimal; list-style-position: inside; } .source-order-51 li:nth-child(2) { grid-column: 3; grid-row: 2; } .source-order-51 li:nth-child(5) { grid-column: 2; grid-row: 1; } .source-order-51 li:nth-child(7) { grid-column: 1; grid-row: 1; } .source-order-51 li:nth-child(3) { grid-column: 1; grid-row: 3; } Reveal order Link Link Link Link Link Link Link The goal of this section is more to provide awareness of this criterion when you consider how to solve layout challenges. Upcoming in CSS grid is a native "masonry" solution. Unfortunately, it may negatively impact the expected focus order. Similar issues can be created when assigning specific grid areas that don't match source order, as well as customizing item order in flexbox using the order property. A recent challenge I faced was a list of navigation links that was requested to break into columns. And in this case, the logical tab order would be down one column before moving on to the next column. The catch was that it was a list of items for a single topic, so semantically it would not be ideal to break it into a list per column. Breaking into multiple lists would also misrepresent the number of items for the single topic for users of assistive tech like screen readers which announce the number of items in a list. Using the following set of CSS grid properties, I was able to arrive at a non-list-breaking solution: CSS for "List Focus Order Solution With CSS Grid" ul { display: grid; grid-column-gap: 2rem; grid-row-gap: 1rem; /* Causes items to be ordered into columns */ grid-auto-flow: column; /* # required to prevent a column per link */ grid-template-rows: repeat(3, 1fr); /* Size the columns */ grid-auto-columns: minmax(0, 1fr); } .grid-list-focus-order-57 { list-style: none; padding: 2rem; display: grid; grid-column-gap: 2rem; grid-row-gap: 1rem; grid-auto-flow: column; grid-template-rows: repeat(3, 1fr); grid-auto-columns: minmax(0, 33%); } .grid-list-focus-order-57 a { color: blue; } Link 1 Link 2 Link 3 Link 4 Link 5 Link 6 Link 7 Link 8 The caution here is to be mindful of the space necessary to accommodate the content. In a navigation scenario, content is usually fairly tightly controlled, so this can be a reasonable solution. Manuel Matuzovic has an excellent and more thorough guide to considerations of CSS Grid layout and altering source order. Desktop Zoom and Reflow # You've tested across viewport sizes using browser dev tools as well as on real mobile devices, and you're happy with your site's responsive behavior. But you're probably missing one test point: desktop zoom. In the previous tutorial, we started to look at WCAG Success Criterion 1.4.10 - Reflow. Reflow is the term for supporting desktop zoom up to 400%. On a 1280px wide resolution at 400%, the viewport content is equivalent to 320 CSS pixels wide. The intent of a user with this setting is to trigger content to reflow into a single column for ease of reading. As also noted in the previous tutorial, typically zoom begins to trigger responsive behavior that you may have set using media queries. But there is currently no zoom media query. Consequently, the aspect ratio of a desktop zoomed to 400% can cause reflow issues with your content. Some examples of possible issues: sticky navigation that covers half or more of the viewport contained scroll areas that assume a mobile portrait aspect ratio become unscrollable/cut-off unwanted results when using fluid typography techniques overflow or overlap issues that cut-off content margin and padding spacing appearing too large relative to the content size Without a zoom media query, it can be difficult to devise zoom solutions that are independent of device size assumptions. However, with modern CSS functions like min() and max(), we have tools to resolve some zoom instances without detracting from the original intent of our assumed mobile design. Join my newsletter for article updates, CSS tips, and front-end resources! Don’t fill this out if you're human: Email Subscribe We previously looked at using min to adjust a grid column that contained an avatar in a way that worked for small, large, and zoomed viewports. Let's look at resolving vertical spacing. A common practice is for designers to create a pixel ramp for spacing, perhaps based on an 8px unit. So you would perhaps create spacing utilities that look like: .margin-top-xs { margin-top: 8px; } .margin-top-sm { margin-top: 16px; } .margin-top-md { margin-top: 32px; } .margin-top-lg { margin-top: 64px; } .margin-top-xl { margin-top: 128px; } And so on to accommodate for the full range of your ramp. This is usually fine across a standard range of devices. But consider that the xl value of 128px on a desktop zoomed to 400% becomes half the viewport height. Instead, we can update the upper end of the range to add in min() to select the lowest computed value. This means that for non-zoomed viewports, 128px will be used. And for 400% zoomed viewports, an alternative viewport unit value may be used. If you are using a desktop, try out zooming to see the effect on the space between the demo elements: CSS for "Resolving Margin Spacing For Zoom" section + section { margin-top: min(128px, 15vh); } .zoom-margin-spacing-487 { min-height: 150px; padding: 1rem; margin: 0 1rem; outline: 1px solid purple; outline-offset: -.5rem; color: #222; } .zoom-margin-spacing-487 + .zoom-margin-spacing-487 { margin-top: min(128px, 25vh); } Section 1 Section 2 Section 3 This technique can potentially be used if you encounter overlap from absolute positioned elements as well. For more examples of how zoom can effect layout and some modern CSS solutions, check out the recording of CSS Cafe meetup talk about "Modern CSS Solutions to (Previously) Complex Problems" In the next section we'll see how to query for touch devices. Using that can make for an excellent combo to help determine the context of a user and present an alternate layout for things like sticky navigation or custom scroll areas. Sizing Interactive Targets # Our next area is to consider properly sizing interactive targets, where the term "target" comes from Success Criterion 2.5.5: Target Size. From that criterion: "The intent of this success criterion is to ensure that target sizes are large enough for users to easily activate them, even if the user is accessing content on a small handheld touch screen device, has limited dexterity, or has trouble activating small targets for other reasons. For instance, mice and similar pointing devices can be hard to use for these users, and a larger target will help them activate the target." Being introduced in WCAG 2.2 is Success Criterion 2.5.8: Pointer Target Spacing. Together, the guidance indicates that generally interactive controls should either: have a minimum actual size of 44px; or allowed a minimum target size - inclusive of spacing between the control and other elements - of 44px There are exceptions and additional examples located in the linked resources to help clarify this requirement. Adrian Roselli also provides an excellent overview and history. In addition to this site, I maintain SmolCSS.dev which explores minimal modern CSS solutions to create layouts and components. The following is an excerpt from one of the demonstrations - "Smol Avatar List Component". It uses the CSS function max() to ensure that the default display of the avatar link column is at least 44px regardless of the value that may be passed within the --avatar-size value. .smol-avatar-list { --avatar-size: 3rem; --avatar-count: 3; display: grid; /* Default to displaying most of the avatar to enable easier access on touch devices `max` ensures the WCAG touch target size is met or exceeded */ grid-'''
