["https://moderncss.dev/modern-css-for-dynamic-component-based-architecture"]
title = "Modern CSS For Dynamic Component-Based Architecture | Modern CSS Solutions"
description = "Explore modern project architecture, theming, responsive layouts, and component design. Learn to improve code organization, dig into layout techniques, and review real-world, context-aware components that use cutting-edge CSS techniques."
full_description = '''The language of CSS has had an explosion of new features and improvements in the last few years. As a result, feature parity between browsers is at an all-time high, and efforts are being made to continue releasing features consistently and synchronously among evergreen browsers. Today, we will explore modern project architecture, emphasizing theming, responsive layouts, and component design. We'll learn about features to improve code organization and dig into layout techniques such as grid and container queries. Finally, we'll review real-world examples of context-aware components that use cutting-edge CSS techniques. You're sure to be inspired to expand your CSS skills and ready to create scalable, future-friendly web projects. CSS Reset Additions # Since the early days of CSS, a convention to tame cross-browser styling inconsistencies has been the CSS reset. This refers to a group of rules that do things like to remove default spacing attributes or enforce inheritance of font styles. It has also grown more flexible in definition, and some folks use it as a place to put baseline global style overrides. Here are a few handy rules I now place in my reset to take advantage of modern CSS features. A wonderful thing about these rules is they are also progressive enhancements that don't strictly require fallbacks. If they are supported in a browser and are applied, great! And if not, there's no or minimal impact on the user experience. I set a common baseline for default links, which are scoped to those without a class. This is an assumption that classless links are intended to keep a regular, underlined link appearance. The update is to set the underline to use a relative thickness and increase the underline offset. The visual outcome may be minor, but it can improve the legibility of links, especially when presented in a list or other close-proximity contexts. /* Baseline for default links */ a:not([class]) { /* Relatively sized thickness and offset */ text-decoration-thickness: max(0.08em, 1px); text-underline-offset: 0.15em; } The max() function asks the browser to choose the larger of the presented options, which effectively ensures that in this rule, the underline cannot be thinner than 1px. An exciting cross-browser update as of March 2022 was a switch of the default focus behavior for interactive elements to use :focus-visible by default. Whereas the :focus state applies no matter how an element receives focus, :focus-visible only produces a visible focus state based on the heuristics of the user's input modality. Practically speaking, this means that typically mouse users will not see a visible focus for elements like links or buttons, but a keyboard user who accesses those elements through tabbing will see a visible focus style. As for our reset, this means our visible focus styles will be attached to only the :focus-visible state. :focus-visible { --outline-size: max(2px, 0.15em); outline: var(--outline-width, var(--outline-size)) var(--outline-style, solid) var(--outline-color, currentColor); outline-offset: var(--outline-offset, var(--outline-size)); } In this rule, custom properties are used to set the various outline attributes. This allows the creation of a common baseline for our application's focus styles while allowing overrides for components as needed. You might also be less familiar with the outline-offset property, which defines the distance between the element and the outline. This property can use a negative value to inset the outline and place it inside the element. I often do this override for button component styles to ensure the outlines retain accessible contrast against the element. I’ve written about this outline technique before if you’d like to learn more. The last two additions to my reset involve improving the scroll position for targeted or focused elements. Using scroll-padding properties, you can adjust the scroll position in relation to elements. The "padding" space does not affect the layout, just the offset of the scroll position. In this rule, the :target selector matches when an element is a target of an anchor link, also known as a "document fragment." The scroll-padding-block-start will allow for room between the target and the top of the viewport. /* Scroll margin allowance above anchor links */ :target { scroll-padding-block-start: 2rem; } The use of scroll-padding-block-end in this next rule allows for room between a focused element and the bottom of the viewport, which helps with tracking visible focus position. /* Scroll margin allowance below focused elements to ensure they are clearly in view */ :focus { scroll-padding-block-end: 8vh; } Values for both rules can be adjusted to work best with your application layout. Consider that you might need a little bit of help from JavaScript if you need to account for sticky headers or footers. Project Architecture # Next up are two features with the potential to strongly impact your project architecture: nesting and cascade layers. CSS Nesting # Native CSS nesting began to be supported in Chromium 112, Safari 16.5, and very newly in Firefox Nightly so stable support should be shortly behind. For those who have used a preprocessor like Sass or LESS, native nesting will be familiar, but it does have some unique rules. Any selector type is valid as a nested selector. The ampersand - & - character is also available and refers to the top-level selector, so that is one way to begin a nested selector. Selectors such as :is() or :where() are useful in nested selectors. And standard class or attribute selection is also allowed, as well as the other combinators. .my-element { a { } & a { } :is(a, button) { } .button { } [data-type] { } + .another-element { } } A possible gotcha with nesting selectors is that the compound result creates descendent selectors. In other words, a space character is added between the top-level selector and the nested selector. When you intend to have the nested selector be appended to the top-level selector, the use of the & enables that result. .my-element { [data-type] { } &[data-type] { } } /* Results in: */ .my-element [data-type] { } .my-element[data-type] { } Use of & also allows nested selectors for pseudo-elements and pseudo-classes. .my-element { &::before { } &:hover { } } Review more examples of valid and invalid nesting rules from Jen Simmons and Adam Argyle. You can safely begin using nesting today without Sass or LESS by incorporating a build tool such as LightningCSS, which will pre-combine the selectors for your final stylesheet based on your browser targets. CSS Cascade Layers # In a coordinated cross-browser rollout, the new at-rule of @layer became available as of Chromium 99, Safari 15.4, and Firefox 97 in early 2022. This at-rule is how to manage CSS cascade layers, which allows authors more control over two key features of the "C" in CSS: specificity and order of appearance. This is significant because those are the last two determining factors a browser considers when applying an element's style. Using @layer, we can define groups of rule sets with a pre-determined order to reduce the likelihood of conflicts. Being able to assign this order largely prevents the need to use !important and enables easier overrides of inherited styles from third-party or framework stylesheets. The critical rules to understand about cascade layers are: the initial order of layers defines the applied priority order priority increases in order ex. first layer has less priority than the last layer less-nested layered styles have priority over deeper nested layer styles un-layered styles have the highest priority over layered styles In this example, the initial layer order is given as global followed by typography. However, the styles added to those layers are written so that the typography layer is listed first. But, the p will be blue since that style is defined in the typography layer, and the initial layer order defines the typography layer later than the global layer. @layer global, typography; p { margin-bottom: 2rem; } @layer typography { p { color: blue; margin: 0; } @layer colors { p { color: pink; } } } @layer global { p { color: hsl(245 30% 30%); } } The nested layer of color within typography also has lower-priority than the un-nested style. Finally, the paragraph will also have a margin-bottom of 2rem since the un-layered style has higher priority over the layered styles. Learn more in my guide to cascade layers, and watch Bramus Van Damme’s talk from CSS Day 2022. As with many newer features, there is much room for experimentation, and "best practices" or "standards of use" have not been established. Decisions like whether to include cascade layers, what to name them, and how to order them will be very project dependent. Here’s a layer order I have been trying out in my own projects: @layer reset, theme, global, layout, components, utilities, states; Miriam Suzanne, the spec author for cascade layers, describes a few contexts and other considerations for naming and ordering layers. Moving to cascade layers is a bit tricky, although a polyfill is available. However, at-rules cannot be detected by @supports in CSS. Even if they could, there's still the issue that un-layered styles that you may not be ready to move to layers would continue to override layer styles. The desire to detect @layer support and minimize the conflict between layered and un-layered styles was a motivating factor in creating my project SupportsCSS, a feature detection script. It adds classes to <html> to indicate support or lack thereof, which can then be used as part of your progressive enhancement strategy for many modern CSS features, including cascade layers. Join my newsletter for article updates, CSS tips, and front-end resources! Don’t fill this out if you're human: Email Subscribe Theming and Branding # There are three features I immediately begin using when starting a new project, large or small. The first is custom properties, also known as CSS variables. The 2022 Web Almanac - which sources data from the HTTP Archive dataset and included 8.36M websites - noted that 43% of pages are using custom properties and have at least one var() function. My prediction is that number will continue to grow dramatically now that Internet Explorer 11 has reached end-of-life, as lack of IE11 support prevented many teams from picking up custom properties. The Almanac results also showed that the ruling type used by custom property values was color, and that is in fact how we’ll begin using them as well. For the remainder of the examples, we’ll be building up components and branding for our imaginary product Jaberwocky. We’ll begin by placing the brand colors as custom properties within the :root selector, within our theme layer. @layer theme { :root { /* Color styles */ --primary: hsl(265, 38%, 13%); --secondary: hsl(283, 6%, 45%); --tertiary: hsl(257, 15%, 91%); --light: hsl(270, 100%, 99%); --accent: hsl(278, 100%, 92%); --accent--alt: hsl(279, 100%, 97%); --accent--ui: hsl(284, 55%, 66%); } } You may also wish to place font sizes or other "tokens" you anticipate re-using in this theme layer. Later, we'll elevate some component properties to this global space. We'll also continue to inject custom properties throughout our layout utilities and component styles to develop an API for them. Now that we have a brand and color palette, it's time to add the other two features. First is color-scheme, which allows us to inform the browser whether the default site appearance is light or dark or assign a priority if both are supported. The priority comes from the order the values are listed, so light dark gives "light" priority. The use of color-scheme may affect the color of scrollbars and adjust the appearance of input fields. Unless you provide overrides, it can also adjust the background and color properties. While we are setting it on html, you may also localize it to a certain component or section of a layout. Sara Joy shares more about how color-scheme works. The second property is accent-color which applies your selected color to the form inputs of checkboxes, radio buttons, range, and progress elements. For radio buttons and checkboxes, this means it's used to color the input in the :checked state. This is an impactful step towards theming these tricky-to-style form inputs and may be a sufficient solution instead of completely restyling. Michelle Barker shares more on how accent-color works. If you do feel you need to have full style control, see my guides to styling radio buttons and styling checkboxes. Jaberwocky best supports a light appearance, and will use the darkest purple that is assigned to --accent--ui for the accent-color. @layer theme { html { color-scheme: light; accent-color: var(--accent--ui); } } Layout # There is so much we could cover regarding CSS layout, but I want to share two utilities I use in nearly every project for creating responsive grids. The first solution relies on CSS grid, and the second on flexbox. CSS Grid Layout # Using CSS grid, this first utility creates a responsive set of columns that are auto-generated depending on the amount of available inline space. Beyond defining display: grid, the magic of this rule is in the assignment for grid-template-columns which uses the repeat() function. CSS for "CSS Grid Layout" @layer layout { .layout-grid { display: grid; grid-template-columns: repeat( auto-fit, minmax(min(100%, 30ch), 1fr) ); } } .layout-grid-51 { display: grid; grid-template-columns: repeat( auto-fit, minmax(min(100%, 30ch), 1fr) ); gap: 2cqi; } .layout-grid-51 > span { padding: 2%; text-align: center; font-size: 2cqi; background-color: lightblue; border: 2px dashed; } Item 1Item 2Item 3Item 4Item 5 The first parameter within repeat uses the auto-fit keyword, which tells grid to create as many columns as can fit given the sizing definition which follows. The sizing definition uses the grid-specific function of minmax(), which accepts two values that list the minimum and maximum allowed size for the column. For the maximum, we've used 1fr, which will allow the columns to stretch out and share the space equitably when more than the minimum is available. For the minimum, we've included the extra CSS math function of min() to ask the browser to use the smaller computed size between the listed options. The reason is that there is potential for overflow once the available space is more narrow than 30ch. By listing 100% as an alternate option, the column can fill whatever space is available below that minimum. The behavior with this minimum in place means that once the available space becomes less than the amount required for multiple elements to fit in the row, the elements will drop to create new rows. So with a minimum of 30ch, we can fit at least three elements in a 100ch space. However, if that space reduces to 70ch, then only two would fit in one row, and one would drop to a new row. To i'''
