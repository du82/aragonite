["https://moderncss.dev/container-query-units-and-fluid-typography"]
title = "Container Query Units and Fluid Typography | Modern CSS Solutions"
description = '''To learn more about the behaviors of container query units, we'll explore three fluid typography techniques applied via a "mixin" using custom properties. These upgraded methods will produce truly responsive typography, regardless of context.'''
full_description = '''Fluid typography is the term for designing font-size rules that responsively adapt the size based on the amount of available inline space. Before the availability of container query units, techniques usually relied on the viewport width - vw - unit. The viewport method is excellent for main page type, such as article headlines. However, viewport-based fluid typography doesn't quite work for narrower spaces that flex independently of the viewport, such as a grid of cards. We'll explore three ways to create dynamic fluid typography rules by leveraging container query units and CSS custom properties. You'll learn more about: creating mixins using custom properties max(), min(), calc() and clamp() container queries and units :is() and :where() Previously here on ModernCSS, I presented a method that relied on using Sass to perform some calculations and produce the rules to apply viewport-based fluid typography. You may still be interested in some of the other information including tips on preventing text-overflow and a few other considerations for web typography. However, not only can we upgrade the solution presented previously by dropping Sass, but the final rules will be far more resilient and context-independent. Fluid Typography Basics with clamp() # The standard viewport-based fluid typography relies on the clamp() function and the vw (viewport width) unit. The clamp() function is one of several handy CSS math functions and accepts three values: a minimum value, an ideal value, and a maximum value. The core idea of fluid typography is that the "ideal" value uses a dynamic unit - vw - in order to interpolate between the min and max. This effectively allows the font to resize along a preferred range. In the demo, the minimum allowed size is 1rem and the maximum allowed size is 3rem, where 4vw allows interpolating along the range. CSS for "Viewport-based fluid typography" .fluid-type { font-size: clamp(1rem, 4vw + 1rem, 3rem); } .fluid-type-459 { font-size: clamp(1rem, 4vw + 1rem, 3rem); } Viewport-based fluid typography. We'll talk more about that addition of 1rem + shortly, but suffice it to say that it enables improved resizing when using display or text zoom, an important accessibility consideration. Now although that demo has a resize handle, you won't see any resizing of the font actually occur. That's because it's reliant on the width of your viewport, so you will need to resize your entire browser width to see a change. Already, we've demonstrated the problem with this technique! Due to this issue, a past remedy may have been to create component-specific styles that anticipate different viewport sizes and assign various font sizes within media queries. But now, with the availability of container queries, we can do better! Quick Overview of Container Queries # I've previously written both a condensed tutorial on container queries and an in-depth primer on container queries. What you need to know to understand the examples in this tutorial is that container queries allow defining rules for elements to respond to their ancestor container's available space. This is different from media queries which can only be based on the viewport. Technically this definition and the use in this tutorial is in consideration of container size queries. The spec also includes style queries for updating rules based on style features. The primary benefit of container queries is in creating more contextually appropriate layout rules that adapt to the true available space. With viewport media queries, rules are effectively orchestrated at the macro page level. But container queries allow responding to layout changes of micro elements and components as their context shifts through variable placement in page layouts. Container elements must be explicitly defined, which at the base level is done through the container-type property. For queries against available inline space, we use the value inline-size. Then, child elements of the container can query the container for its size with the @container rule and apply styles when that size condition is met. .container { container-type: inline-size; } @container (inline-size > 300px) { .container .child { padding: 2rem; } } The use of the term "inline" rather than "width" is from the precedent set by logical properties, which have their orientation adjusted based on the writing mode: right to left (RTL), left to right (LTR), or vertical. Using "inline" refers to the horizontal dimension for the writing mode. As we build up the solutions, we'll learn more about working with containment. Browser Support # Container size queries and units are supported from Chromium 105, Safari 16, and Firefox 110. Container Query Units # Officially, these are called "container query length units," and they are a measure of the size of a containing element. Just as 1vw equals 1% of the viewport width, so does 1cqi equal 1% of a container's inline size. We'll be using cqi for purposes of defining fluid typography since we want the size to be associated with the horizontal axis of the writing mode. Interestingly, the CSS working group resolved that all elements would default to style containment. This means that the use of a container unit will work even without an ancestor that has containment. Keep reading to learn about a quirk of this behavior. Setup Custom Properties # To begin our solutions, we'll set up some custom properties. This is because all of our rules will be designed to work with a sort of "mixin" rule that will intake the cascaded values from the custom properties. I'm referring to it as a mixin since it will be a general rule that takes the custom properties, applies a function, and produces variable results based on the custom property values. For best results, we'll work with the cascade to more predictably inherit values. This means we'll assign our base custom property values first and the mixin rules later in the stylesheet order. The starting structure for our rules involves choosing explicit font sizes for headline levels 1-4, which are the main focus of our base rules. We'll create custom properties for them and explicitly assign them per headline level. :root { --headline-1: 2.75rem; --headline-2: 2.35rem; --headline-3: 1.5rem; --headline-4: 1.15rem; } h1, .h1 { --font-size: var(--headline-1); font-size: var(--headline-1); } h2, .h2 { --font-size: var(--headline-2); font-size: var(--headline-2); } h3, .h3 { --font-size: var(--headline-3); font-size: var(--headline-3); } h4, .h4 { --font-size: var(--headline-4); font-size: var(--headline-4); } Note that each rule updates the --font-size custom property to associate it with the size for that level. That's important because it enables the mixin rules we'll be creating, which will be generalized to scale for each of the input properties. Without generalizing to a mixin, we would have to repeat the function from the mixin within each separate headline rule. Mixin Selector # So, what does this mixin actually look like? Well, the contents will be unique per each of our three solutions. However, the selector will be the same. We'll attach it to each heading element as well as the added heading classes and a utility class as well of .fluid-type. The utility class will allow using the mixin ad-hoc for type that may not be styled as a heading. @supports (font-size: 1cqi) { :is(h1, .h1, h2, .h2, h3, .h3, h4, .h4, .fluid-type) { font-size: /* unique per solution */ line-height: 1.1; margin-block-end: 0.65em; } } For other options to assign line-height that you may feel better fit your final fluid type solution, review my project CSS Typography Line Height. Why use @supports? # Due to a quirk of how custom properties work, we'll need to be explicit about separating our fluid sizes that use container query units from a fallback size. Otherwise, if a browser encounters the mixin and doesn't understand the container query unit, it will throw out the custom property value. The "quirk" is that it will then render the "initial" value of 1rem instead of using a previously defined size for the element. The outcome is that all type will appear at 1rem, removing any type size hierarchy from your application. That's why we need the explicit @supports check for whether the browser will understand the container query units before trying to apply the rule. To counter this behavior, you may assign a static value to the base headline rules, or include a solution prior to the container queries mixin that uses viewport units. Either fallback should be placed prior to and outside of the @supports condition. One method is shown after the first mixin. Why use :is() for the selector? # Two reasons: The more important reason is that it will raise the specificity of the entire rule to a class, which will make it more resilient to accidental overrides from inheritance, but it can also be matched or exceeded easily by later class-based or compound rules. The less important reason is to simplify the selector into a single-line list vs. a traditional comma-separated selector broken into multiple lines. If you encounter issues with :is(), such as complexity creating overrides, or if you want the ability to override through inheritance, you can switch to :where(). Use of :where() lowers specificity to zero, meaning later rules that may be component or page specific will override it easily due to the cascade without having to match or exceed the specificity. Note that :is() computes to the highest specificity in the given selector list, which is why I mentioned this rule would have the specificity of a class. Based on your preference and whether the behavior of :is() or :where() is useful for your context, you can alternatively remove the wrapper and use a standard selector list without :is() or :where(). Upgrade From vw to cqi # The cornerstone of all of our methods will be upgrading from vw to cqi as our dynamic unit of choice to enable fluid typography. A starting rule to do this really is just a swap of those values. CSS for "Fluid typography using cqi" .fluid-type { font-size: clamp(1rem, 4cqi, 3rem); } .fluid-type-419 { font-size: clamp(1rem, 4cqi, 3rem); } .sorry-419 { display: none; } @supports not (font-size: 1cqi) { .sorry-419 { display: block; font-weight: bold; margin-bottom: 2rem; color: firebrick; } } Sorry, your browser doesn't support container query units! The demos will not be fluid. Viewport-based fluid typography. But - wait a minute - it still isn't working on resize of the container. However, it is responding based on the viewport. What's going on?! The container queries spec includes a provision that every element defaults to a style container, which is why the use of cqi already enables fluid resizing. But, since we didn't define a container for our demo, the measurement is still against the closest ancestor with containment applied. This site doesn't have containment applied on any ancestor of the demo, so the fallback behavior of container query units is to use the "small viewport size for that axis." This means for our rule where we are querying the "inline" axis, the viewport width is used as the measure. In order to produce the effect we're really after, which is to have the font size respond to the parent container, we need to assign containment. CSS for "Container-based fluid typography" .container { container-type: inline-size; } .fluid-type { font-size: clamp(1rem, 4cqi, 3rem); } .ctr-703 { container-type: inline-size; } .fluid-type-703 { font-size: clamp(1rem, 4cqi, 3rem); } .sorry-703 { display: none; } @supports not (font-size: 1cqi) { .sorry-703 { display: block; font-weight: bold; margin-bottom: 2rem; color: firebrick; } } Sorry, your browser doesn't support container query units! The demos will not be fluid. Viewport-based fluid typography. In this update, we put a parent div with the container class around the paragraph. Now the paragraph with the fluid-type class is responsively sizing according to the demo's inline size. A key concept of container queries is that they respond to the nearest ancestor with containment. If you apply rules that use container query units and aren't seeing them respond as you expect, you may have to adjust the markup and add a rule to allow the elements to carry a container with them. Container Units and Text Zoom Resizing # For the example rule explaining viewport-based fluid type, I mentioned that the inclusion of 1rem added to the vw value was important for text resizing. It's because viewport-based methods are prone to restricting the font size from growing until at least the 200% required by the Web Content Accessibility Guidelines (WCAG) Success Criterion 1.4.4: Resize Text. As clarified by Eric Eggert, this rule means that the on-screen rendered pixel height of the text must eventually be able to resize up to 200% of its original height at normal (100%) zoom. That technically doesn't need to be reached by the time the browser or text zoom setting is set to 200%, so it's acceptable if it's reached by, say, 300% zoom. For viewport-based fluid methods, inclusion of a rem value helps prevent issues with the text resizing. Without it, zoom-based resizing with only vw is more likely to fail to increase or stall out on increasing until a very high zoom value. PS - if you're not sure why we're dealing in rems, check the explanation of rem vs other units in the earlier article here on fluid type. An interesting feature of swapping to use cqi instead of vw is that by its very nature it will continue to increase as long as the container inline size increases during zoom. This holds true both for browser/display zoom and text zoom applied at the OS level. In my testing, as long as rem is still used as the anchoring unit for the font-size definition, increases to 200% or more are more consistently achievable than vw methods. You should always test your fluid type rules in as many ways as you can to ensure zoom behavior works as expected. This means varying zoom levels with the type in multiple contexts such as a responsive grid of cards, in a medium-width article, a full width container, and a narrow sidebar. Mixin 1: Dynamic Font Size Ranges With clamp() # Our goal is to make a mixin function, so we need to manage a few more considerations than the more static rule created in the last section. Let's begin the rule by plugging in our --font-size custom property that was previously set up. We'll also enable a --font-size-fluid property with a default of 5cqi. Like the size property, this would allow updating the target size per heading level, if desired. @supports (font-size: 1cqi) { :is(h1, .h1, h2, .h2, h3, .h3, h4, .h4, .fluid-type) { font-size: clamp( /* TODO: define a minimum size */, var(--font-size-fluid, 5cqi), var(--font-size) ); } } If you missed it, jump back to the explanation of why we're using @supports. The missing piece in our mixin function is a definition for the minimum size allowed within the range'''
