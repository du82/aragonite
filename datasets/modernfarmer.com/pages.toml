title = "Opinion: The US Doesn’t Grow Enough Food – But We Could - Modern Farmer"
description = "Despite having nearly a billion acres of prime farmland and a population of only 330 million people, the U.S. agriculture system, often claimed to be able"
full_description = '''Despite having nearly a billion acres of prime farmland and a population of only 330 million people, the U.S. agriculture system, often claimed to be able to “feed the world,” can no longer feed its own population. The number of U.S. farms producing food for consumption has been steadily declining for years, making us more reliant on other countries as we resort to importing necessary foods. This shows in America’s growing agricultural trade deficit, projected to reach a record-breaking $45.5 billion in 2025. But it doesn’t have to be this way; farmers know how to feed us. It’s backward government policies that are standing in their way. We need Congress to reevaluate the subsidies provided to big ag, and prioritize farmers growing and raising nutritious food for our nation. full_link READ MORE Can cities grow enough food to feed their citizens? Our taxpayer dollars are propping up some of the largest industrial agriculture operations in the country, allowing the big to get bigger. At the same time, small and mid-sized farms are being driven out of existence. The U.S. Department of Agriculture (USDA) oversubsidizes the production of corn and soybeans, which are used for livestock feed, ethanol, and to create sugars, starches, and oils that end up in highly processed foods. The highly concentrated nature of our food and farm system, facilitated by the government’s prioritization of these commodity crops, has made it increasingly difficult for our farmers to supply us with nutritious food crops like fruits, vegetables, legumes, and whole grains. The most recently available farm subsidy data shows that the majority of government subsidies go toward commodity crop production, while just four percent go toward fruit and vegetable production, which the USDA ironically deems “specialty crops.” New York fruit grower Chip Kent said he has only ever received $500 in subsidies; meanwhile, a handful of the largest and wealthiest operations are raking in 80 percent of the billions of available dollars. “We could use a little help. Who’s gonna grow our food? You really want to buy it all from overseas?” Kent said in a recent CNBC story. And that is becoming a reality; according to the USDA, our fruit and vegetable supply is increasingly made up of imports. In 2021, we imported 60 percent of our fresh fruit and 38 percent of our vegetables. In 2019, we imported $15.7 billion worth of produce from Mexico and by 2023, that number increased to $21 billion. Our government’s misplaced prioritization of growing and exporting low-value crops, which primarily benefits the corporations dominating our food system, is reflected in America’s public health. As government subsidies support the production of sugars, starches, and oils, prices on those products remain relatively low. Over time, those foods become the most readily accessible and available, and fresh produce is priced higher and is less accessible. Most of the American population is not consuming enough fruits and vegetables, according to the U.S. Dietary Guidelines, which determined that 80 percent of people eat too little fruit and 90 percent do not eat enough vegetables. A 2021 study found that Americans are increasingly consuming ultra-processed food (like frozen pizza, soda, and fast food), with over half of our population’s caloric intake coming from ultra-processed foods. full_link LEARN MORE Opinion: Growing food and protecting nature are not conflicting goals. We are on track to have a trade deficit for five of the last seven years, our public health is at risk, and our fruit and vegetable farmers are struggling to stay afloat. The ability to reverse these harmful trends is in the hands of our government. To begin to undo this damage, the next farm bill must better support those farmers who are providing nutritious food for our people. It’s worth noting that the soybean industry, which receives substantially more government support, has an industry value estimated at 20 percent lower than that of fruits and vegetables. Farm Action’s research determined that by shifting less than 0.5 percent of current farm acreage to fruit and vegetable production, we could balance the 2023 agriculture trade deficit of $32 billion due to the higher value of food crops. We must stop outsourcing what we can grow ourselves; a different way is possible, and a healthy, sustainable food system is attainable. With the next farm bill still up in the air, Farm Action will continue advocating for Congress to shift resources and infrastructure to the production of food for our communities — to the benefit of America’s food security, public health, and farmers. <img data-dominant-color="5a5343" data-has-transparency="false" style="--dominant-color: #5a5343;" decoding="async" class="size-full wp-image-166914 not-transparent" src="https://modernfarmer.com/wp-content/uploads/2025/02/unnamed-1.webp" alt="" width="1280" height="853" srcset="https://modernfarmer.com/wp-content/uploads/2025/02/unnamed-1.webp 1280w, https://modernfarmer.com/wp-content/uploads/2025/02/unnamed-1-519x346.webp 519w, https://modernfarmer.com/wp-content/uploads/2025/02/unnamed-1-1200x800.webp 1200w, https://modernfarmer.com/wp-content/uploads/2025/02/unnamed-1-768x512.webp 768w" sizes="(max-width: 1280px) 100vw, 1280px">Angela Huffman. Photo submitted. Angela Huffman is a co-founder and president of Farm Action. She has over a decade of experience in food and agriculture policy reform and market development. Subscribe Notify of new follow-up comments new replies to my comments <img alt='guest' src='https://secure.gravatar.com/avatar/136a96286b1b2060c0a17d483fa82805?s=56&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/136a96286b1b2060c0a17d483fa82805?s=112&#038;d=mm&#038;r=g 2x' class='avatar avatar-56 photo' height='56' width='56' decoding='async'/> Label {} [+] Name* Email* Website Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); <img alt='guest' src='https://secure.gravatar.com/avatar/0a4dff6b53f966f63b33e6194bf44400?s=56&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/0a4dff6b53f966f63b33e6194bf44400?s=112&#038;d=mm&#038;r=g 2x' class='avatar avatar-56 photo' height='56' width='56' decoding='async'/> Label {} [+] Name* Email* Website Δdocument.getElementById( "ak_js_2" ).setAttribute( "value", ( new Date() ).getTime() ); This site uses Akismet to reduce spam. Learn how your comment data is processed. 3 Comments Most Voted Newest Oldest Inline Feedbacks View all comments <img alt='Dennis' src='https://secure.gravatar.com/avatar/ef4675b8153f299d07a18d71863859ec?s=64&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/ef4675b8153f299d07a18d71863859ec?s=128&#038;d=mm&#038;r=g 2x' class='avatar avatar-64 photo' height='64' width='64' decoding='async'/> Dennis 15 days ago With Trump attempting to change government priorities add the Dept. of Agriculture to the list. Get in contact with somebody in his immediate circle to work on changing funding supports. 2 Reply <img alt='Larry Majerus' src='https://secure.gravatar.com/avatar/7526eeb691019b8f01780cd83f4e0a29?s=64&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/7526eeb691019b8f01780cd83f4e0a29?s=128&#038;d=mm&#038;r=g 2x' class='avatar avatar-64 photo' height='64' width='64' decoding='async'/> Larry Majerus 15 days ago Small farmers are so busy with 2nd jobs to support farm and family they don’t have time for a lot of paper work with govt farm agents. I put in for a program and was told it may be next year before they get to me because of back log. Time to lower percentage of program payment to big farmers and get more support for small farmers. A lot of small farmers would be glad to switch from raising a few cattle or hogs for a bigger money (vegetable) crop. Where do they get funds for right type of high… Read more » 1 Reply <img alt='Dr B S Nadagoudar' src='https://secure.gravatar.com/avatar/4cd3afccff3c5abe89888d3069b60655?s=64&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/4cd3afccff3c5abe89888d3069b60655?s=128&#038;d=mm&#038;r=g 2x' class='avatar avatar-64 photo' height='64' width='64' decoding='async'/> Dr B S Nadagoudar 15 days ago One should be self reliant in FOOD production, be it USA with plenty of land and comparatively smaller population or any other country for that matter. Import of food should be the last priority. 1 Reply Follow usFacebookInstagramLinkedInXRepublish!Republish This Story<img width="88" height="31" alt="Creative Commons License" style="border-width:0" src="https://modernfarmer.com/wp-content/plugins/republication-tracker-tool/assets/img/cc-by-nd-4.0.png" />Republish our articles for free, online or in print, under a Creative Commons license. Close window XRepublish this articleThis work is licensed under a Creative Commons Attribution-NoDerivatives 4.0 International License. Want to republish a Modern Farmer story? We are happy for Modern Farmer stories to be shared, and encourage you to republish our articles for your audience. When doing so, we ask that you follow these guidelines: Please credit us and our writers For the author byline, please use “Author Name, Modern Farmer.” At the top of our stories, if on the web, please include this text and link: “This story was originally published by Modern Farmer.” Please make sure to include a link back to either our home page or the article URL. At the bottom of the story, please include the following text: “Modern Farmer is a nonprofit initiative dedicated to raising awareness and catalyzing action at the intersection of food, agriculture, and society. Read more at <link>Modern Farmer</link>.” Use our widget We’d like to be able to track our stories, so we ask that if you republish our content, you do so using our widget (located on the left hand side of the article). The HTML code has a built-in tracker that tells us the data and domain where the story was publishe