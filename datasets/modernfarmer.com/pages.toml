76992921.webp" class="attachment-large size-large not-transparent" alt="" decoding="async" srcset="https://modernfarmer.com/wp-content/uploads/2025/02/shutterstock_2476992921.webp 1000w, https://modernfarmer.com/wp-content/uploads/2025/02/shutterstock_2476992921-560x315.webp 560w, https://modernfarmer.com/wp-content/uploads/2025/02/shutterstock_2476992921-768x432.webp 768w" sizes="(max-width: 640px) 100vw, 640px" data-has-transparency="false" data-dominant-color="797189" style="--dominant-color: #797189;" />On the Ground with Grocery Stores Ditching Plastic'''
