title = "Opinion: A More Resilient Food System Starts at the Community Level - Modern Farmer"
description = "It’s time to look beyond the Farm Bill.    The Farm Bill, passed once every five years, is the most important piece of federal legislation affecting"
full_description = '''It’s time to look beyond the Farm Bill. The Farm Bill, passed once every five years, is the most important piece of federal legislation affecting American agriculture and food access. Originally designed to keep food prices fair for both supply and demand sides, ensure an adequate supply of food, and protect and sustain natural resources, this bill now plays a wildly outsized role in shaping our food system. Lobbyists and advocates influence it from all angles. <img data-dominant-color="81776d" data-has-transparency="false" style="--dominant-color: #81776d;" decoding="async" class="size-full wp-image-166806 not-transparent" src="https://modernfarmer.com/wp-content/uploads/2025/01/image-3-png.webp" alt="" width="1280" height="960" srcset="https://modernfarmer.com/wp-content/uploads/2025/01/image-3-png.webp 1280w, https://modernfarmer.com/wp-content/uploads/2025/01/image-3-461x346.webp 461w, https://modernfarmer.com/wp-content/uploads/2025/01/image-3-1200x900.webp 1200w, https://modernfarmer.com/wp-content/uploads/2025/01/image-3-768x576.webp 768w" sizes="(max-width: 1280px) 100vw, 1280px">Photo submitted by RIFPC. But the Farm Bill is not the be-all and end-all of our food system. It’s easy to think that all changes to our system must start with the Farm Bill, or that the Farm Bill is the only way to have wide influence. It can be easy to overlook opportunities available for progress on the state level, where the smaller-scale forces at work are just as complex, and the stakes just as significant. This year, there will also be scores of state-level bills debated this year from Rhode Island to Texas – bills that will greatly affect farmers, fishers, food entrepreneurs, food access, and food justice all across America. One of the best ways to impact the food system for the better is to invest in food policy councils (FPCs) at the community, state, and regional level. full_link TAKE ACTION Learn how to be a food policy advocate in your community. Be it public, private, or non-profit work, there are frequently intrasector opportunities for collaboration and information sharing within trade groups, or professional associations, which can benefit everyone, without waiting for omnibus legislation like the Farm Bill. These networks hold regular meetings and events that offer opportunities for relationship-building, coalition development, and generate conversation that can lead to new thinking in the field. Yet few opportunities exist to engage in this important work across sectors, especially on the state level. In an age where organizations increasingly need to prove their impact, the benefits provided by networks are incredibly valuable. FPCs bring together diverse stakeholders from different sectors–like food entrepreneurs, farmers, food justice workers, food access workers, and concerned consumers– to identify common ground and collaborate, to help solve problems holistically. <img data-dominant-color="627a8a" data-has-transparency="false" style="--dominant-color: #627a8a;" decoding="async" class="size-full wp-image-166805 not-transparent" src="https://modernfarmer.com/wp-content/uploads/2025/01/image-2-png.webp" alt="" width="1279" height="591" srcset="https://modernfarmer.com/wp-content/uploads/2025/01/image-2-png.webp 1279w, https://modernfarmer.com/wp-content/uploads/2025/01/image-2-560x259.webp 560w, https://modernfarmer.com/wp-content/uploads/2025/01/image-2-1200x554.webp 1200w, https://modernfarmer.com/wp-content/uploads/2025/01/image-2-768x355.webp 768w" sizes="(max-width: 1279px) 100vw, 1279px">Photo submitted by RIFPC. These food system stakeholders share the goal of a more just and resilient food system. Their participation in these networks is based on their belief that investing time and energy in it will help achieve that goal. FPCs are a kind of ‘backbone network,’’ so named because they provide a central structure critical for efficient operation. While in the technology sector, these networks are recognized as critical to system efficacy and efficiency (and adequately funded in response); in the world of food systems change they are largely ignored (and lack adequate funding). The fact is, FPCs need to be cultivated intentionally and invested in more widely for substantive, measurable food system change to take place. <img data-dominant-color="727764" data-has-transparency="false" style="--dominant-color: #727764;" decoding="async" class="size-full wp-image-166807 not-transparent" src="https://modernfarmer.com/wp-content/uploads/2025/01/image-4-png.webp" alt="" width="1280" height="960" srcset="https://modernfarmer.com/wp-content/uploads/2025/01/image-4-png.webp 1280w, https://modernfarmer.com/wp-content/uploads/2025/01/image-4-461x346.webp 461w, https://modernfarmer.com/wp-content/uploads/2025/01/image-4-1200x900.webp 1200w, https://modernfarmer.com/wp-content/uploads/2025/01/image-4-768x576.webp 768w" sizes="(max-width: 1280px) 100vw, 1280px">Photo submitted by RIFPC. There are numerous obstacles when building this type of cross-sector network. One of the biggest is that most leaders, no matter what sector they are in, are fully focused on the success of their individual agencies, departments, and organizations. How can they justify prioritizing the time and effort to be part of a network? To be effective, FPCs require members to devote the time to work together in good faith, sometimes with competitors, whether for market share, grant funding, or legislative attention. The emphasis on collaboration often results in compromise that can feel off-brand. On top of that, the cost of not participating can feel fuzzy and far-off to leaders who are laser focused on maintaining their immediate stability while trying to find time to plan strategically for the next year or three. The fact is, those leaders can’t afford not to work within FPCs. The fact is, those leaders can’t afford not to work within FPCs. Even the best organizational leaders in the nonprofit sector have a limited ability to focus on systemic change. Without the structure and support network of an FPC, individual progress may be haphazard, and lack the structure and shared purpose that can produce efficient, intentional, and visionary systems change. Over 20 years ago, Margaret Wheatley, in her book Turning to One Another, saw the potential for significant change in the actions of a few individuals: ““[T]he world only changes when a few individuals step forward. It doesn’t change from leaders or top-level programs or big ambitious plans. It changes when we, everyday people gathering in small groups, notice what we care about and take those first steps to change the situation.” FPCs create the space for these individuals to band together to create and implement the solutions required for significant food system change to occur. full_link READ MORE Can we fix the global food sysstem by 2045? Enter the ‘food systems leader. Skillful network leaders practicing in the food system space focus on advancing the entire system, with all of its moving, interconnected parts. They honor each individual’s and organization’s challenges and goals, while cultivating their ability to consistently see and value ‘the big picture’ at the same time. They facilitate connection, conversation, and relationship-building. They craft invitations and create spaces where organizational leaders can take a breath, share challenges and opportunities without judgment, listen to new ideas, and gain the vision they need to do their jobs better. This is the demanding work of participatory democracy, focused on the food system. FPCs create the space for these individuals to band together to create and implement the solutions required for significant food system change to occur. In an age where organizations increasingly need to prove their impact, the benefits provided by networks are incredibly valuable. Philanthropic decision makers and funders who care about any aspect of the food system – food access and nutrition security, food business and economic development, or the intersections of food, climate, and environment – should invest in backbone food networks and encourage all of their food-focused grantees to join them. This is a path to achieving significant food system change in the next several years, regardless of what happens with the Farm Bill. <img data-dominant-color="78756d" data-has-transparency="false" style="--dominant-color: #78756d;" decoding="async" class="size-full wp-image-166808 not-transparent" src="https://modernfarmer.com/wp-content/uploads/2025/01/Nessa-Richman-portrait-10_24_23-1.webp" alt="" width="853" height="1280" srcset="https://modernfarmer.com/wp-content/uploads/2025/01/Nessa-Richman-portrait-10_24_23-1.webp 853w, https://modernfarmer.com/wp-content/uploads/2025/01/Nessa-Richman-portrait-10_24_23-1-231x346.webp 231w, https://modernfarmer.com/wp-content/uploads/2025/01/Nessa-Richman-portrait-10_24_23-1-682x1024.webp 682w, https://modernfarmer.com/wp-content/uploads/2025/01/Nessa-Richman-portrait-10_24_23-1-768x1152.webp 768w" sizes="(max-width: 853px) 100vw, 853px">Nessa Richman. Photo submitted by RIFPC. Nessa Richman is the executive director of the Rhode Island Food Policy Council and an adjunct professor at the University of Rhode Island College of the Environment and Life Sciences. Subscribe Notify of new follow-up comments new replies to my comments <img alt='guest' src='https://secure.gravatar.com/avatar/7947c83cb1437e473abe6a9d01dc2036?s=56&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/7947c83cb1437e473abe6a9d01dc2036?s=112&#038;d=mm&#038;r=g 2x' class='avatar avatar-56 photo' height='56' width='56' decoding='async'/> Label {} [+] Name* Email* Website Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); <img alt='guest' src='https://secure.gravatar.com/avatar/464e0a70382979623de69ecc1671d980?s=56&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/46