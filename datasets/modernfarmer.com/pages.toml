full_description = "For people who care where their food comes from. Modern Farmer is a nonprofit dedicated to raising awareness and catalyzing action at the intersection of food, agriculture, and society.Through storytelling, community building, and partnerships, we educate, inform, and drive positive change in the interest of a more resilient and equitable food system in North America. Our HistoryIn 2022, Modern Farmer made the transition to not-for-profit status, with a renewed mandate to build resilience in the North American food system. At that time, a new leadership team was established to ensure independent operation, and we secured a relationship with Acceso Impact, a US 501(c)(3) not-for-profit organization that provides fiscal sponsorship and operational support to Modern Farmer. Our focus01Farming RedefinedOur stories connect people to the origins of food and highlight producers and innovators working to create a sustainable future. 02Food EquityOur stories connect people to the origins of food and highlight solutions where all people have access to affordable, nutritious, and culturally significant foods. 03Conscious ConsumptionOur stories connect people to the origins of food, rethink how we consume, and uncover the uncomfortable truths behind mass production. Our TeamGet to know the talented people who work tirelessly behind the scenes to bring you the stories that matter most. See our TeamPartnerships and CollaborationsOur mission at Modern Farmer is to inform our audience about the issues facing the food system while connecting them with opportunities to act in response to what they learn. Partnerships play a crucial role in achieving both these goals. See our Partnerships and CollaborationsFunders and SupportersModern Farmer was established in 2013 as a for-profit print publication, funded by Canadian financier and philanthropist Frank Giustra. In 2022, we transitioned to a non-profit model and secured a relationship with Acceso Impact, a 501(c)(3) non-profit, to provide fiscal sponsorship and operational support. See our Funders and Supporters"
