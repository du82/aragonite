["https://modernfarmer.com/2025/02/sustainabile-booze-bats-fish-butterflies"]
title = "What Do Fish, Butterflies, and Bats Have to Do With Booze? - Modern Farmer"
description = "On January 9th, the Instagram account @anytimespritz posted a declaration: “2025 is the year of organic cocktails. Drinking is an Agricultural Act.”"
full_description = '''On January 9th, the Instagram account @anytimespritz posted a declaration: “2025 is the year of organic cocktails. Drinking is an Agricultural Act.” The latter statement is inspired by the words of the farmer and writer, Wendell Berry – specifically, his essay “The Pleasures of Eating,” published in 1989, in which he famously wrote that “eating is an agricultural act.” In the following decades, the farm-to-table movement has championed and codified this understanding of our food systems through numerous certifications that aim to help us make more sustainable choices. While many of us have gotten into the habit of seeking out certain symbols and words on food products, we have been slower to adopt this approach to beverages – especially alcoholic ones. full_link READ MORE In search of sustainable spirits. “There are few reasons that it’s taken longer for sustainability practice and culture to reach the spirits industry,” explains Shanna Farrell, author of A Good Drink: In Pursuit of Sustainable Spirits. “The first is that you (often) can’t visit farms that grow the crops that become spirits.” While this is not the case for wine – an industry bolstered by enotourism [travel for the purpose of exploring wine regions], with visitors being encouraged to see the grapes up-close – many kinds of alcohol are subject to a strange separation from consumers. These products are, in fact, deeply rooted in a sense of place that is so much more complex than tidy rows of vineyards, hops, or grains convey at first glance. For this reason, the little labels on bottles of booze can go a long way in facilitating choices that are healthier for us and the planet – if we take the time to read and understand them. <img data-dominant-color="624924" data-has-transparency="false" style="--dominant-color: #624924;" decoding="async" class="size-full wp-image-167002 not-transparent" src="https://modernfarmer.com/wp-content/uploads/2025/02/Andrea-Johnson-Soter-2-1.webp" alt="" width="1280" height="796" srcset="https://modernfarmer.com/wp-content/uploads/2025/02/Andrea-Johnson-Soter-2-1.webp 1280w, https://modernfarmer.com/wp-content/uploads/2025/02/Andrea-Johnson-Soter-2-1-556x346.webp 556w, https://modernfarmer.com/wp-content/uploads/2025/02/Andrea-Johnson-Soter-2-1-1200x746.webp 1200w, https://modernfarmer.com/wp-content/uploads/2025/02/Andrea-Johnson-Soter-2-1-768x478.webp 768w" sizes="(max-width: 1280px) 100vw, 1280px">Soter Vineyards. Photography by Andrea Johnson. Some broad-reaching sustainability certifications are by now familiar – most notably the United States Department of Agriculture Organic seal, which was developed following the Organic Foods Production Act of 1990 (on the heels of Berry’s famous essay). Other, newer terms are somewhat intuitive, such as “Fish-Friendly” or the more specific “Salmon-Safe,” while still others, like “Carbon Neutral” or “B Corp,” require further study. In deciding which terminology to trust, it’s important to consider how and by whom these certifications are regulated. Ecolabels can be verified by governing bodies at the international, federal, or state level, as well as by independent organizations. The first step to sipping more sustainably is simply to acknowledge our drinks as agricultural products. From there, we can begin to consider how the cultivation, transformation, and transportation of their ingredients impacts our land, water, and air, as well as all of the life forms inhabiting these ecosystems. <img data-dominant-color="766b55" data-has-transparency="false" style="--dominant-color: #766b55;" decoding="async" class="size-full wp-image-167003 not-transparent" src="https://modernfarmer.com/wp-content/uploads/2025/02/Rams-Gate-Winery-3-2.webp" alt="" width="1024" height="1280" srcset="https://modernfarmer.com/wp-content/uploads/2025/02/Rams-Gate-Winery-3-2.webp 1024w, https://modernfarmer.com/wp-content/uploads/2025/02/Rams-Gate-Winery-3-2-277x346.webp 277w, https://modernfarmer.com/wp-content/uploads/2025/02/Rams-Gate-Winery-3-2-819x1024.webp 819w, https://modernfarmer.com/wp-content/uploads/2025/02/Rams-Gate-Winery-3-2-768x960.webp 768w" sizes="(max-width: 1024px) 100vw, 1024px">Ram’s Gate Winery. Photography submitted. The wine industry is leading the way when it comes to creating a new correlation between alcohol and aquatic creatures with a more positive connotation than the phrase “to drink like a fish.” Ram’s Gate Winery in Sonoma, California is one of more than 2,000 farms that have joined the Fish-Friendly Farming Environmental Certification Program, which is regulated by a non-profit organization, the California Land Stewardship Institute. Caine Thompson, the winery’s head of sustainability, explains that in order to become certified, “The farmer must show that they are implementing practices that both restore fish and wildlife habitats and improve water quality.” Outside the Golden State, the Salmon-Safe Certification is another great way to verify that farmers are working in harmony with their local waterways. At Soter Vineyards in Oregon’s Willamette Valley, Salmon-Safe Certified is just one of the many ecolabels that the farm has earned over the years, along with Organic, Biodynamic, B Corporation, and LIVE (Low Input Viticulture and Enology). Soter Vineyards is also Bee-Friendly – according to accreditation by the non-profit Pollinator Partnership – highlighting their holistic approach to caring for creatures that live underwater and up in the air. <img data-dominant-color="636d4c" data-has-transparency="false" style="--dominant-color: #636d4c;" decoding="async" class="size-full wp-image-167001 not-transparent" src="https://modernfarmer.com/wp-content/uploads/2025/02/Carolyn-Wells-Soter-1-1.webp" alt="" width="1280" height="853" srcset="https://modernfarmer.com/wp-content/uploads/2025/02/Carolyn-Wells-Soter-1-1.webp 1280w, https://modernfarmer.com/wp-content/uploads/2025/02/Carolyn-Wells-Soter-1-1-519x346.webp 519w, https://modernfarmer.com/wp-content/uploads/2025/02/Carolyn-Wells-Soter-1-1-1200x800.webp 1200w, https://modernfarmer.com/wp-content/uploads/2025/02/Carolyn-Wells-Soter-1-1-768x512.webp 768w" sizes="(max-width: 1280px) 100vw, 1280px">Soter Vineyards. Photography by Carolyn Wells. Soter Vineyards’ viticulturist, Emily Rozga, explains that one of the shared key practices across these various certifications is “habitat maintenance.” This includes leaving some vegetation along the wetlands undisturbed to help regulate water temperatures and planting wildflower meadows for native pollinators, especially milkweed for migrating Monarch butterflies. Some certifications are narrowly focused on certain species, while others aim to be all-encompassing. In 2023, Anytime Spritz launched Farmhouse Gin and Farmhouse Vodka as the world’s first and only Regenerative Organic Certified spirits. Taylor Lanzet, co-founder of the “farm-to-can” cocktail company, explains that they don’t prioritize any one species over another. One of their partners in Hudson, New York, Breathe Deep Farm, started enacting regenerative organic practices in their fields of wheat and other grains, and is now “home to 122 rare and uncommon plant species, 83 bird species, and 40 butterfly and dragonfly species.” <img data-dominant-color="776b48" data-has-transparency="false" style="--dominant-color: #776b48;" decoding="async" class="size-full wp-image-167000 not-transparent" src="https://modernfarmer.com/wp-content/uploads/2025/02/Josh-Chang-Soter-1-1.webp" alt="" width="1280" height="853" srcset="https://modernfarmer.com/wp-content/uploads/2025/02/Josh-Chang-Soter-1-1.webp 1280w, https://modernfarmer.com/wp-content/uploads/2025/02/Josh-Chang-Soter-1-1-519x346.webp 519w, https://modernfarmer.com/wp-content/uploads/2025/02/Josh-Chang-Soter-1-1-1200x800.webp 1200w, https://modernfarmer.com/wp-content/uploads/2025/02/Josh-Chang-Soter-1-1-768x512.webp 768w" sizes="(max-width: 1280px) 100vw, 1280px">Soter Vineyards. Photography by Josh Chang. Winged creatures of all sizes play an important role in a balanced, biodiverse ecosystem and, for some crops, can be crucial for cultivation. Perhaps the most striking example of this is seen in the production of tequila. The popular Mexican spirit is made from the agave plant, which depends on bats for pollination. You may notice the term “Bat-Friendly” on some sustainable tequila brands, but you should also keep an eye out for the letters “ARA,” which stand for Agave Responsable Ambiental (Environmentally Responsible Agave). <img data-dominant-color="806e5b" data-has-transparency="false" style="--dominant-color: #806e5b;" decoding="async" class="size-full wp-image-166996 not-transparent" src="https://modernfarmer.com/wp-content/uploads/2025/02/Mijenta-Tequila-4-1.webp" alt="" width="1280" height="853" srcset="https://modernfarmer.com/wp-content/uploads/2025/02/Mijenta-Tequila-4-1.webp 1280w, https://modernfarmer.com/wp-content/uploads/2025/02/Mijenta-Tequila-4-1-519x346.webp 519w, https://modernfarmer.com/wp-content/uploads/2025/02/Mijenta-Tequila-4-1-1200x800.webp 1200w, https://modernfarmer.com/wp-content/uploads/2025/02/Mijenta-Tequila-4-1-768x512.webp 768w" sizes="(max-width: 1280px) 100vw, 1280px">Mijenta Tequila. Photography submitted. Mijenta is one of the few brands to gain this certification from the Tequila Regulatory Council and the Government of the State of Jalisco, Mexico. Elise Som, co-founder and director of sustainability at Mijenta, explains that they chose to pursue ARA certification to demonstrate that their agave is “grown on land that did not suffer deforestation.” Mijenta’s other certifications, including B Corporation by B Lab and Carbon Neutral by ClimatePartner attest to their “focus on community support and forest protection, as well as development of clean energy solutions.” full_link LEARN MORE Is booze the next frontier for sustainable agriculture? Some sustainability labels in the beverage industry concentrate their attention on the maintenance of crop fields as healthy habitats, while others highlight the preservation of wild landscapes. Marla Hoban, co-founder of the Portland, Oregon-based non-alcoholic beer company Roaming Nobles explains that their brand name pays “homage to the noble animals that roam our state and all its beautiful natural spaces.” This connection is celebrated on their beer cans by the appearance of a tree symbol announcing their partnership with the Forest Park Conservancy, which cares for one of the United State’s largest urban parks – a vital habitat for hundreds of species, ranging from black bears to banana slugs, hoary bats, bobcats, and mountain beavers. <img data-dominant-color="7b7873" data-has-transparency="false" style="--dominant-color: #7b7873;" decoding="async" class="size-full wp-image-166999 not-transparent" src="https://modernfarmer.com/wp-content/uploads/2025/02/Mijenta-Tequila-2-1.webp" alt="" width="1280" height="853" srcset="https://modernfarmer.com/wp-content/uploads/2025/02/Mijenta-Tequila-2-1.webp 1280w, https://modernfarmer.com/wp-content/uploads/2025/02/Mijenta-Tequila-2-1-519x346.webp 519w, https://modernfarmer.com/wp-content/uploads/2025/02/Mijenta-Tequila-2-1-1200x800.webp 1200w, https://modernfarmer.com/wp-content/uploads/2025/02/Mijenta-Tequila-2-1-768x512.webp 768w" sizes="(max-width: 1280px) 100vw, 1280px">Mijenta Tequila. Photography submitted. Your personal bar cart may seem far removed from forests and farmlands, but they are inextricably linked. It’s time we take an ecosystems approach to how we drink. Before you pour, carve out an extra few minutes to assess the labels at your local wine shop, call up your preferred brewer, or get friendly with your bartender. By mindfully choosing our beverages based on sustainability certifications, we can have a positive impact that extends well beyond happy hour. Subscribe Notify of new follow-up comments new replies to my comments <img alt='guest' src='https://secure.gravatar.com/avatar/aa5200111e0883701d8848456fa71a1a?s=56&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/aa5200111e0883701d8848456fa71a1a?s=112&#038;d=mm&#038;r=g 2x' class='avatar avatar-56 photo' height='56' width='56' decoding='async'/> Label {} [+] Name* Email* Website Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); <img alt='guest' src='https://secure.gravatar.com/avatar/b7d1d3e645be5ca0fdf7226bc1f82336?s=56&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/b7d1d3e645be5ca0fdf7226bc1f82336?s=112&#038;d=mm&#038;r=g 2x' class='avatar avatar-56 photo' height='56' width='56' decoding='async'/> Label {} [+] Name* Email* Website Δdocument.getElementById( "ak_js_2" ).setAttribute( "value", ( new Date() ).getTime() ); This site uses Akismet to reduce spam. Learn how your comment data is processed. 0 Comments Most Voted Newest Oldest Inline Feedbacks View all comments Follow usFacebookInstagramLinkedInXRepublish!Republish This Story<img width="88" height="31" alt="Creative Commons License" style="border-width:0" src="https://modernfarmer.com/wp-content/plugins/republication-tracker-tool/assets/img/cc-by-nd-4.0.png" />Republish our articles for free, online or in print, under a Creative Commons license. Close window XRepublish this articleThis work is licensed under a Creative Commons Attribution-NoDerivatives 4.0 International License. Want to republish a Modern Farmer story? We are happy for Modern Farmer stories to be shared, and encourage you to republish our articles for your audience. When doing so, we ask that you follow these guidelines: Please credit us and our writers For the author byline, please use “Author Name, Modern Farmer.” At the top of our stories, if on the web, please include this text and link: “This story was originally published by Modern Farmer.” Please make sure to include a link back to either our home page or the article URL. At the bottom of the story, please include the following te