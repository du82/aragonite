ar avatar-64 photo' height='64' width='64' decoding='async'/> Suzanne Martinez 6 years ago I’m a preschool teacher. How about the weekends I won’t be able to turn the eggs. Will the survive? 5 Reply View Replies (7) <img alt='Asaph Niyibikora' src='https://secure.gravatar.com/avatar/f3697c21972d48c11efc91ed42e5061f?s=64&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/f3697c21972d48c11efc91ed42e5061f?s=128&#038;d=mm&#038;r=g 2x' class='avatar avatar-64 photo' height='64' width='64' decoding='async'/> Asaph Niyibikora 6 years ago Thank you so much. 5 Reply <img alt='Charles' src='https://secure.gravatar.com/avatar/3bb733be4eccfa700c548147d55cd245?s=64&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/3bb733be4eccfa700c548147d55cd245?s=128&#038;d=mm&#038;r=g 2x' class='avatar avatar-64 photo' height='64' width='64' decoding='async'/> Charles 5 years ago I want to learn more about farming 4 Reply <img alt='kayti Schwarting' src='https://secure.gravatar.com/avatar/8507307851550a65415f5c15f65d88cc?s=64&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/8507307851550a65415f5c15f65d88cc?s=128&#038;d=mm&#038;r=g 2x' class='avatar avatar-64 photo' height='64' width='64' decoding='async'/> kayti Schwarting 4 years ago Good evening We have been hatching eggs and have another set that was days from hatching when we lost electricity for 8 hours . Do you think they are still alive and should continue to let them try and hatch? Or are they gone ? Yesterday they were to start hatching and we have no movement. This is not our first time so we know what happens when they start to hatch but we are afraid the drop in Temp due to no electricity caused these to terminate . 2 Reply View Replies (1) Load More Comments Follow usFacebookInstagramLinkedInXRepublish!Republish This Story<img width="88" height="31" alt="Creative Commons License" style="border-width:0" src="https://modernfarmer.com/wp-content/plugins/republication-tracker-tool/assets/img/cc-