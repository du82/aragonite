title = "On the Ground With Grocery Stores Redefining How Local Food is Produced - Modern Farmer"
description = "In the produce section of the IGA grocery store in Saint-Laurent, Quebec, a TV monitor shows customers, in real time, the roof of the store and farmers"
full_description = '''In the produce section of the IGA grocery store in Saint-Laurent, Quebec, a TV monitor shows customers, in real time, the roof of the store and farmers harvesting cucumbers that within an hour will be on store shelves. When the Food Industry Association asked Americans to list reasons why they buy local produce, 82 percent of those surveyed cited a desire for freshness. Finding fresh local produce in conventional grocery stores, especially in urban settings, is not always easy. Retail distribution systems are designed to deliver products in as few trips as possible. Breaking this down into numerous shorter trips can be time-consuming and expensive. Large grocery store chains often have long-term contracts in place with out-of-state suppliers that are difficult to breach and, therefore, don’t have store capacity for local produce. <img data-dominant-color="738b67" data-has-transparency="false" style="--dominant-color: #738b67;" decoding="async" class="size-full wp-image-165610 not-transparent" src="https://modernfarmer.com/wp-content/uploads/2024/09/Modern-Farmer-IGA-RoofTopDrone-Credit-VOIR_VERT-jpeg.webp" alt="" width="1200" height="800" srcset="https://modernfarmer.com/wp-content/uploads/2024/09/Modern-Farmer-IGA-RoofTopDrone-Credit-VOIR_VERT-jpeg.webp 1200w, https://modernfarmer.com/wp-content/uploads/2024/09/Modern-Farmer-IGA-RoofTopDrone-Credit-VOIR_VERT-519x346.webp 519w, https://modernfarmer.com/wp-content/uploads/2024/09/Modern-Farmer-IGA-RoofTopDrone-Credit-VOIR_VERT-768x512.webp 768w" sizes="(max-width: 1200px) 100vw, 1200px">IGA’s rooftop garden. Photo courtesy of Voir Vert Fresh from the parking lot Despite these drawbacks, across North America, a handful of grocery stores are pioneering a new way of growing that puts hyper-local food at the forefront of the supply chain. For those operating these farms, such as Kelli Ebbs, store manager of Muskoka North Good Food Co-op in Huntsville, Ontario, the two large shipping-like containers in the store’s parking lot have filled a much-needed gap in the supply chain. “During the growing season, we don’t have a problem procuring fresh greens from local farms,” says Ebbs. In north-central Ontario, however, the growing season is short and, for six to seven months of the year, the store was ordering organic produce from aggregates sourcing produce, sometimes as far away as Mexico. For Ebbs, this was undependable and problematic. The first container farm was installed in the store’s parking lot approximately a year and half ago. Built in Canada by Growcer and designed for the fluctuations in the Canadian climate, structural insulated panels keep cool air inside during the summer and make working conditions bearable in winter. Currently growing salad greens, cooking greens and herbs, when a second unit comes online this winter, the store will experiment with growing fresh locally grown strawberries. If the popularity of the first unit is any indication, it will be no problem making sales. “We can harvest 100 units of fresh produce on a Wednesday and, by Saturday, it is gone,” says Ebbs. A half-pound bag of fresh salad greens sells for CDN$8, which is comparable to pre-packaged organic greens sold in any grocery store across Canada. The popularity of the products has meant that Ebbs has been able to cover the continuing operating costs of the vertical farm without it having an impact on store profits. Ebbs sees a future for the units at her store, but she is also adamant that this type of growing cannot and should not be viewed as a replacement to local farmers or food grown naturally under the sun and rain. “Grocery stores have to continue to support our local farmers and the work they do,” says Ebbs. She vowed when the containers arrived that she would never turn away a local farmer offering fresh produce to the store. Greenhouses in the sky “Customers love knowing that we are supporting sustainable methods to expand urban agriculture while being able to offer produce that is fresh and hyper-local,” says Jinah Kim, store team leader at the Third and 3rd Whole Foods in Brooklyn, NY. Since 2013, hydroponically equipped greenhouses on the roof of the store have been producing salad greens and fresh herbs for the store below. “What we can grow in half an acre in a hydroponic greenhouse would require 15-20 acres in a field,” says Viraj Puri, CEO of Gotham Greens. By growing and marketing crops locally, the need for long-distance food transportation, fuel consumption, and carbon emissions associated with food miles has been eliminated. For Puri, though, this isn’t the biggest impact being made by the farm. “There’s a lot of symbolism around the project,” he says, “and what is possible in making cities green and liveable and in connecting people to the food system.” <img data-dominant-color="cbd4c3" data-has-transparency="true" style="--dominant-color: #cbd4c3;" decoding="async" class="wp-image-165611 size-full has-transparency" src="https://modernfarmer.com/wp-content/uploads/2024/09/Modern-Farmer-photo-credit-Gotham-greens.png" alt="" width="1280" height="854" srcset="https://modernfarmer.com/wp-content/uploads/2024/09/Modern-Farmer-photo-credit-Gotham-greens.png 1280w, https://modernfarmer.com/wp-content/uploads/2024/09/Modern-Farmer-photo-credit-Gotham-greens-519x346.png 519w, https://modernfarmer.com/wp-content/uploads/2024/09/Modern-Farmer-photo-credit-Gotham-greens-1200x801.png 1200w, https://modernfarmer.com/wp-content/uploads/2024/09/Modern-Farmer-photo-credit-Gotham-greens-768x512.png 768w" sizes="(max-width: 1280px) 100vw, 1280px">Lettuce selections offered by Gotham Greens- grown in one of their NYC rooftop greenhouses. Photo courtesy of Gotham Greens In-store signage in the produce section educates the customer about the rooftop farm. For those enjoying lunch in the Whole Foods rooftop cafeteria, a bank of windows overlooks the greenhouse production area, letting customers see up close exactly where the lettuce in their sandwich was harvested. Whole Foods acts as the landlord, but Gotham Greens owns the greenhouses. Produce under the 20,000-square-foot greenspace is marketed to customers under the Gotham Greens label at prices comparable to organic products sold anywhere else. A 4.5-ounce package of salad greens, for example, sells for $3.99, according to Puri. Customer loyalty The Sobeys supermarket chain is one of the largest in Canada, overseeing 1,500 stores under different banners, including the IGA Extra Famille Duchemin in Saint-Laurent. Since 2017, the store has been growing and selling organic produce grown on the store’s open-air roof farm. Designed and built by La Ligne Verte, a company specializing in the design of rooftop growing spaces, the idea initially was to create a green roof. “The IGA being a grocery store,” says Anthime Bion, a landscape architect with La Ligne Verte, “we thought it would be interesting to have a grocery store that was not only a distributor, but also a producer of high-quality organic fresh produce.” “The most complicated part was the watering,” says Bion. “We had to be permanently connected to the city’s water system to get enough water to water the surfaces.” Weight constraints on the roof makes the use of machinery prohibitive, meaning the work of growing and harvesting has to be done by hand. Finding skilled market gardeners capable of this, Bion acknowledges, can be challenging. Originally managed by the market gardening wing of La Ligne Verte, in 2023, Sobeys contracted the Montreal non-profit organization La Ferme Du Rue to take over the management of the rooftop farm. Being able to manage the IGA farm provides the non-profit organization with income to run workshops throughout Montreal and in schools that introduce youth to the value and practicalities of urban farming. “The farm grows exclusively for IGA,” says Réal Migneault, La Ferme du Rue’s founder. “Once harvested, we take it down 44 steps to the store below.” According to Richard Duchemin, the owner of the IGA, the rooftop products increase sales of organic products by 1.5 times over what is normally sold in stores. “The prices are the same as for organic products sold in IGAs stores throughout Quebec,” he says. As with any retail venture, the success depends on the customers’ reactions, who, according to Duchemin, are very proud to be able to contribute to hyper-local purchasing. This bolsters Migneault’s belief that a business case can be made for more farms such as IGA’s. “If we look at the benefits of the model,” he says, “it builds faithfulness in the customer base who see the store as an actor of change and this builds your brand. Customers have told me they come to this specific store because of the organic vegetables grown on the rooftop.” Currently, though, IGA’s rooftop farm remains one of a kind in Canada. Subscribe Notify of new follow-up comments new replies to my comments <img alt='guest' src='https://secure.gravatar.com/avatar/3b62f11182dda7e66cdac9a6cdb3a863?s=56&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/3b62f11182dda7e66cdac9a6cdb3a863?s=112&#038;d=mm&#038;r=g 2x' class='avatar avatar-56 photo' height='56' width='56' decoding='async'/> Label {} [+] Name* Email* Website Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); <img alt='guest' src='https://secure.gravatar.com/avatar/1e7a61d1d6e6cf3df12ac6929791ea9b?s=56&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/1e7a61d1d6e6cf3df12ac6929791ea9b?s=112&#038;d=mm&#038;r=g 2x' class='avatar avatar-56 photo' height='56' width='56' decoding='async'/> Label {} [+] Name* Email* Website Δdocument.getElementById( "ak_js_2" ).setAttribute( "value", ( new Date() ).getTime() ); This site uses Akismet to reduce spam. Learn how your comment data is processed. 1 Comment Most Voted Newest Oldest Inline Feedbacks View all comments <img alt='Elle' src='https://secure.gravatar.com/avatar/194030ced902a19bd39865331