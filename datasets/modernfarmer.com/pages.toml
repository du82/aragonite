title = "Who is Feeding America’s Farmworkers? - Modern Farmer"
description = "This story was produced by Grist and co-published with Modern Farmer. Standing knee-deep in an emerald expanse, a row of trees offering respite from the"
full_description = 'This story was produced by Grist and co-published with Modern Farmer. Standing knee-deep in an emerald expanse, a row of trees offering respite from the sweltering heat, Rosa Morales diligently relocates chipilín, a Central American legume, from one bed of soil to another. The 34-year-old has been coming to the Campesinos’ Garden run by the Farmworker Association of Florida in Apopka for the last six months, taking home a bit of produce each time she visits. The small plot that hugs a soccer field and community center is an increasingly vital source of food to feed her family. It also makes her think of Guatemala, where she grew up surrounded by plants. “It reminds me of working the earth there,” Morales said in Spanish. Tending to the peaceful community garden is a far cry from the harvesting Morales does for her livelihood. Ever since moving to the United States 16 years ago, Morales has been a farmworker at local nurseries and farms. She takes seasonal jobs that allow her the flexibility and income to care for her five children, who range from 18 months to 15 years old. This year, she picked blueberries until the season ended in May, earning $1 for every pound she gathered. On a good day, she earned about two-thirds of the state’s minimum hourly wage of $12. For that, Morales toiled in brutal heat, with little in the way of protection from the sun, pesticides, or herbicides. With scant water available, the risk of dehydration or heat stroke was never far from her mind. But these are the sorts of things she must endure to ensure her family is fed. “I don’t really have many options,” she said. Now, she’s grappling with rising food prices, a burden that isn’t relieved by state or federal safety nets. Her husband works as a roofer, but as climate change diminishes crop yields and intensifies extreme weather, there’s been less work for the two of them. They have struggled to cover the rent, let alone the family’s ballooning grocery bill. “It’s hard,” she said. “It’s really, really hot … the heat is increasing, but the salaries aren’t.” The Campesinos’ Garden helps fill in the gap between her wages and the cost of food. <img data-dominant-color="747c61" data-has-transparency="false" style="--dominant-color: #747c61;" decoding="async" class="wp-image-162841 size-full not-transparent" src="https://modernfarmer.com/wp-content/uploads/2024/07/Rosa-gardening-jpg.webp" alt="" width="960" height="1280" srcset="https://modernfarmer.com/wp-content/uploads/2024/07/Rosa-gardening-jpg.webp 960w, https://modernfarmer.com/wp-content/uploads/2024/07/Rosa-gardening-259x346.webp 259w, https://modernfarmer.com/wp-content/uploads/2024/07/Rosa-gardening-768x1024.webp 768w, https://modernfarmer.com/wp-content/uploads/2024/07/Rosa-gardening-750x1000.webp 750w" sizes="(max-width: 960px) 100vw, 960px">Rosa Morales, left, and Amadely Roblero, right, work in the Apopka garden in their free time. Ayurella Horn-Muller / Grist Her story highlights a hidden but mounting crisis: The very people who ensure the rest of the country has food to eat are going hungry. Although no one can say for sure how many farmworkers are food insecure (local studies suggest it ranges from 52 to 82 percent), advocates are sure the number is climbing, driven in no small part by climate change. The 2.4 million or so farmworkers who are the backbone of America’s agricultural industry earn among the lowest wages in the country. The average American household spends more than $1,000 a month on groceries, an almost unimaginable sum for families bringing home as little as $20,000 a year, especially when food prices have jumped more than 25 percent since 2019. Grappling with these escalating costs is not a challenge limited to farmworkers, of course — the Department of Agriculture says getting enough to eat is a financial struggle for more than 44 million people. But farmworkers are particularly vulnerable because they are largely invisible in the American political system. “When we talk about supply chains and food prices going up, we are not thinking about the people who are producing that food, or getting it off the fields and onto our plates,” said Nezahualcoyotl Xiuhtecutli. Xiuhtecutli works with the National Sustainable Agriculture Coalition to protect farmworkers from the occupational risks and exploitation they face. Few people beyond the workers themselves recognize that hunger is a problem for the community, he said — or that it’s exacerbated by climate change. The diminished yields that can follow periods of extreme heat and the disruptions caused by floods, hurricanes, and the like inevitably lead to less work, further exacerbating the crisis. There isn’t a lot of aid available, either. Enrolling in federal assistance programs is out of the question for the roughly 40 percent of farmworkers without work authorization or for those who fear reprisals or sanctions. Even those who are entitled to such help may be reluctant to seek it. In lieu of these resources, a rising number of advocacy organizations are filling the gaps left by government programs by way of food pantries, collaborative food systems, and community gardens across America. “Even though [farmworkers] are doing this job with food, they still have little access to it,” said Xiuhtecutli. “And now they have to choose between paying rent, paying gas to and from work, and utilities, or any of those things. And food? It’s not at the top of that list.” <img data-dominant-color="708066" data-has-transparency="false" style="--dominant-color: #708066;" decoding="async" class="wp-image-162834 size-large not-transparent" src="https://modernfarmer.com/wp-content/uploads/2024/07/farmworker-hunger-heat-fields-1200x800.webp" alt="" width="1200" height="800" srcset="https://modernfarmer.com/wp-content/uploads/2024/07/farmworker-hunger-heat-fields-1200x800.webp 1200w, https://modernfarmer.com/wp-content/uploads/2024/07/farmworker-hunger-heat-fields-519x346.webp 519w, https://modernfarmer.com/wp-content/uploads/2024/07/farmworker-hunger-heat-fields-768x512.webp 768w, https://modernfarmer.com/wp-content/uploads/2024/07/farmworker-hunger-heat-fields-1500x1000.webp 1500w, https://modernfarmer.com/wp-content/uploads/2024/07/farmworker-hunger-heat-fields-jpg.webp 1280w" sizes="(max-width: 1200px) 100vw, 1200px">A migrant worker works on a farm land in Homestead, Florida on May 11, 2023. Chandan Khanna / AFP via Getty Images via Grist ∴ Historically, hunger rates among farmworkers, as with other low-income communities, have been at their worst during the winter due to the inherent seasonality of a job that revolves around growing seasons. But climate change and inflation have made food insecurity a growing, year-round problem. In September, torrential rain caused heavy flooding across western Massachusetts. The inundation decimated farmland already ravaged by a series of storms. “It impacted people’s ability to make money and then be able to support their families,” Claudia Rosales said in Spanish. “People do not have access to basic food.” As executive director of the Pioneer Valley Workers Center, Rosales fights to expand protections for farmworkers, a community she knows intimately. After immigrating from El Salvador, she spent six years working in vegetable farms, flower nurseries, and tobacco fields across Connecticut and Massachusetts, and knows what it’s like to experience food insecurity. She also understands how other exploitative conditions, such as a lack of protective gear or accessible bathrooms, can add to the stress of simply trying to feed a family. Rosales remembers how, when her kids got sick, she was afraid she’d get fired if she took them to the doctor instead of going to work. (Employers harassed her and threatened to deport her if she tried to do anything about it, she said.) The need to put food on the table left her feeling like she had no choice but to tolerate the abuse. “I know what it’s like, how much my people suffer,” said Rosales. “We’re not recognized as essential … but without us, there would not be food on the tables across this country.” <img data-dominant-color="6d454e" data-has-transparency="false" style="--dominant-color: #6d454e;" decoding="async" class="wp-image-162842 size-large not-transparent" src="https://modernfarmer.com/wp-content/uploads/2024/07/we-feed-you-poster-farmworkers-1200x868.webp" alt="" width="1200" height="868" srcset="https://modernfarmer.com/wp-content/uploads/2024/07/we-feed-you-poster-farmworkers-1200x868.webp 1200w, https://modernfarmer.com/wp-content/uploads/2024/07/we-feed-you-poster-farmworkers-478x346.webp 478w, https://modernfarmer.com/wp-content/uploads/2024/07/we-feed-you-poster-farmworkers-768x555.webp 768w, https://modernfarmer.com/wp-content/uploads/2024/07/we-feed-you-poster-farmworkers-1383x1000.webp 1383w, https://modernfarmer.com/wp-content/uploads/2024/07/we-feed-you-poster-farmworkers-jpg.webp 1280w" sizes="(max-width: 1200px) 100vw, 1200px">A young girl carries a ‘We Feed You’ banner as she shows support for farmworkers marching against anti-immigrant policies in the Central Valley agriculture town of Delano, California, on April 2, 2017. Mark Ralston / AFP via Getty Images via Grist The floodwaters have long since receded and many farms are once again producing crops, but labor advocates like Rosales say the region’s farmworkers still have not recovered. Federal and state disaster assistance helps those with damaged homes, businesses, or personal property, but does not typically support workers. Under federal law, if agricultural workers with a temporary visa lose their job when a flood or storm wipes out a harvest, they are owed up to 75 percent of the wages they were entitled to before the disaster, alongside other expenses. They aren’t always paid, however. “Last year, there were emergency funds because of the flooding here in Massachusetts that never actually made it to the pockets of workers,” Rosales said. The heat wave that recently scorched parts of Massachusetts likely reduced worker productivity and is poised to trigger more crop loss, further limiting workers’ ability to make ends meet. “Climate-related events impact people economically, and so that then means limited access to food and being able to afford basic needs,” said Rosales, forcing workers to make difficult decisions on what they spend their money on — and what they don’t. The impossible choice between buying food or paying other bills is something that social scientists have been studying for years. Research has shown, for example, that low-income families often buy less food during cold weather to keep the heat on. But climate change has given rise to a new area to examine: how extreme heat can trigger caloric and nutritional deficits. A 2023 study of 150 countries revealed that unusually hot weather can, within days, create higher risks of food insecurity by limiting the ability to earn enough money to pay for groceries. It’s a trend Parker Gilkesson Davis, a senior policy analyst studying economic inequities at the nonprofit Center for Law and Social Policy, is seeing escalate nationwide, particularly as utility bills surge. “Families are definitely having to grapple with ‘What am I going to pay for?’” she said. “People, at the end of the month, are not eating as much, having makeshift meals, and not what we consider a full meal.” Federal programs like the Supplemental Nutrition Assistance Program, or SNAP, are designed to help at times like these. More than 41 million people nationwide rely on the monthly grocery stipends, which are based on income, family size, and some expenses. But one national survey of nearly 3,700 farmworkers found just 12.2 percent used SNAP. Many farmworkers and migrant workers do not qualify because of their immigration status, and those who do often hesitate to use the program out of fear that enrolling could jeopardize their status. Even workers with temporary legal status like a working visa, or those considered a “qualified immigrant,” typically must wait five years before they can begin receiving SNAP benefits. Just six states provide nutrition assistance to populations, like undocumented farmworkers, ineligible for the federal program. <img data-dominant-color="8a7d76" data-has-transparency="false" style="--dominant-color: #8a7d76;" decoding="async" class="wp-image-162833 size-large not-transparent" src="https://modernfarmer.com/wp-content/uploads/2024/07/farmworker-food-aid-COVID-boxes-1200x771.webp" alt="" width="1200" height="771" srcset="https://modernfarmer.com/wp-content/uploads/2024/07/farmworker-food-aid-COVID-boxes-1200x771.webp 1200w, https://modernfarmer.com/wp-content/uploads/2024/07/farmworker-food-aid-COVID-boxes-539x346.webp 539w, https://modernfarmer.com/wp-content/uploads/2024/07/farmworker-food-aid-COVID-boxes-768x493.webp 768w, https://modernfarmer.com/wp-content/uploads/2024/07/farmworker-food-aid-COVID-boxes-1556x1000.webp 1556w, https://modernfarmer.com/wp-content/uploads/2024/07/farmworker-food-aid-COVID-boxes-jpg.webp 1280w" sizes="(max-width: 1200px) 100vw, 1200px">Los Angeles Food Bank workers prepare boxes of food for distribution to people facing economic or food insecurity amid the COVID-19 pandemic on August 6, 2020 in Paramount, California Mario Tama / Getty Images via Grist The expiration of COVID-era benefit programs, surging food costs, and international conflicts last year forced millions more Americans into a state of food insecurity, but no one can say just how many are farmworkers. That’s because such data is almost nonexistent — even though the Agriculture Department tracks annual national statistics on the issue. Lisa Ramirez, the director of the USDA’s Office of Partnerships and Public Engagement, acknowledged that the lack of data on hunger rates for farmworkers should be addressed on a federal level and said there is a “desire” to do something about it internally. But she didn’t clarify what specifically is being done. “We know that food insecurity is a problem,” said Ramirez, who is a former farmworker herself. “I wouldn’t be able to point to statistics directly, because I don’t have [that] data.” Without that insight, little progress can be made to address the crisis, leaving the bulk of the problem to be tackled by labor and hunger relief organizations nationwide. “My guess is it would be the lack of interest or will — sort of like a willful ignorance — to better understand and protect these populations,” said social scientist Miranda Carver Martin, who studies food justice and farmworkers at the University of Florida. “Part of it is just a lack of awareness on the part of the general public about the conditions that farmworkers are actually working in. And that correlates to a lack of existing interest or resources available to build an evidence base that reflects those concerns.” <img data-dominant-color="3d382f" data-has-transparency="true" style="--dominant-color: #3d382f;" decoding="'
