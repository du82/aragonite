title = "Phonies, Fakes and Food Fraud - Modern Farmer"
description = "How do you know that what you’re eating is what you think it is? Most consumers aren’t thinking about fraud in their food supply while pushing a cart"
full_description = '''How do you know that what you’re eating is what you think it is? Most consumers aren’t thinking about fraud in their food supply while pushing a cart around their local grocery story. But shady shenanigans, fakery, and outright fraud happen more than you might realize. In this Modern Farmer feature series, we investigate the wide world of food fraud and fakery—and explore the technology poised to make supply chains more transparent. <img data-dominant-color="dc461d" data-has-transparency="true" style="--dominant-color: #dc461d;" decoding="async" class="aligncenter wp-image-150667 has-transparency" src="https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-27-2-498x346.png" alt="" width="257" height="178" srcset="https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-27-2-498x346.png 498w, https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-27-2-1200x834.png 1200w, https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-27-2-768x534.png 768w" sizes="(max-width: 257px) 100vw, 257px"> Series edited and illustrated by Rose Garrett In this series <img width="640" height="445" src="https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-15-1200x834.jpg" class="attachment-large size-large" alt="" decoding="async" srcset="https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-15-1200x834.jpg 1200w, https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-15-498x346.jpg 498w, https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-15-768x534.jpg 768w, https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-15-1439x1000.jpg 1439w, https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-15.jpg 1280w" sizes="(max-width: 640px) 100vw, 640px" />FoodOpinion: It’s Time to Stop Underestimating the Scope of Food FraudFood fraud affects many more products than consumers know, and not just in high-cost foods such as honey and whiskey. by Karen Constable <img width="640" height="436" src="https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-4-1200x817.jpg" class="attachment-large size-large" alt="" decoding="async" srcset="https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-4-1200x817.jpg 1200w, https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-4-508x346.jpg 508w, https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-4-768x523.jpg 768w, https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-4-1468x1000.jpg 1468w, https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-4-940x640.jpg 940w, https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-4.jpg 1280w" sizes="(max-width: 640px) 100vw, 640px" />ConsumptionUsing a Food’s Unique Fingerprint to Detect FraudEvery food has a unique, and invisible, chemical “fingerprint.” A researcher from Purdue University has discovered a quick and portable way to identify that fingerprint and sniff out food fraud on the go. by Emily Baron Cadloff <img width="640" height="445" src="https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-8-1200x834.jpg" class="attachment-large size-large" alt="" decoding="async" srcset="https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-8-1200x834.jpg 1200w, https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-8-498x346.jpg 498w, https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-8-768x534.jpg 768w, https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-8-1439x1000.jpg 1439w, https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-8.jpg 1280w" sizes="(max-width: 640px) 100vw, 640px" />ConsumptionIn the Shopping CartHere are some common examples of food frauds and fakes you could come into contact with at grocery stores around the world. by Lena Beck <img width="640" height="445" src="https://modernfarmer.com/wp-content/uploads/2023/10/WhenLabelsLike_hero-1200x834.jpg" class="attachment-large size-large" alt="" decoding="async" srcset="https://modernfarmer.com/wp-content/uploads/2023/10/WhenLabelsLike_hero-1200x834.jpg 1200w, https://modernfarmer.com/wp-content/uploads/2023/10/WhenLabelsLike_hero-498x346.jpg 498w, https://modernfarmer.com/wp-content/uploads/2023/10/WhenLabelsLike_hero-768x534.jpg 768w, https://modernfarmer.com/wp-content/uploads/2023/10/WhenLabelsLike_hero-1439x1000.jpg 1439w, https://modernfarmer.com/wp-content/uploads/2023/10/WhenLabelsLike_hero.jpg 1280w" sizes="(max-width: 640px) 100vw, 640px" />ConsumptionWhen Labels LieFood labels are loaded with words and images that convey meaning. Knowing the story of your food means sifting through the true, the false and everything in between. by Lena Beck <img width="640" height="445" src="https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-32-1200x834.jpg" class="attachment-large size-large" alt="" decoding="async" srcset="https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-32-1200x834.jpg 1200w, https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-32-498x346.jpg 498w, https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-32-768x534.jpg 768w, https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-32-1439x1000.jpg 1439w, https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-32.jpg 1280w" sizes="(max-width: 640px) 100vw, 640px" />ConsumptionCan You Trust the Organic Food Label?“Organic” food is specifically certified and verified, but millions of dollars worth of fraud still occurs within the organic system. by Emily Baron Cadloff <img width="640" height="445" src="https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-6-1200x834.jpg" class="attachment-large size-large" alt="" decoding="async" srcset="https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-6-1200x834.jpg 1200w, https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-6-498x346.jpg 498w, https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-6-768x534.jpg 768w, https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-6-1439x1000.jpg 1439w, https://modernfarmer.com/wp-content/uploads/2023/10/Untitled_Artwork-6.jpg 1280w" sizes="(max-width: 640px) 100vw, 640px" />ConsumptionWhat’s in a Name? Food Labels, ExplainedFood labels can be difficult to understand and interpret, so we’ve created a glossary of some common ones that you’ll see at the grocery store. by Lena Beck <img width="640" height="445" src="https://modernfarmer.com/wp-content/uploads/2023/09/Untitled_Artwork-20-1200x834.jpg" class="attachment-large size-large" alt="" decoding="async" srcset="https://modernfarmer.com/wp-content/uploads/2023/09/Untitled_Artwork-20-1200x834.jpg 1200w, https://modernfarmer.com/wp-content/uploads/2023/09/Untitled_Artwork-20-498x346.jpg 498w, https://modernfarmer.com/wp-content/uploads/2023/09/Untitled_Artwork-20-768x534.jpg 768w, https://modernfarmer.com/wp-content/uploads/2023/09/Untitled_Artwork-20-1439x1000.jpg 1439w, https://modernfarmer.com/wp-content/uploads/2023/09/Untitled_Artwork-20.jpg 1280w" sizes="(max-width: 640px) 100vw, 640px" />ConsumptionCan the Blockchain Clear the Smoke for Cannabis?Cannabis often has a hazy supply chain, but blockchain technology promises seed-to-sale transparency for growers and consumers. by Naoki Nitta Subscribe Notify of new follow-up comments new replies to my comments <img alt='guest' src='https://secure.gravatar.com/avatar/e32284d870f949b0136cb6cb4b270c76?s=56&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/e32284d870f949b0136cb6cb4b270c76?s=112&#038;d=mm&#038;r=g 2x' class='avatar avatar-56 photo' height='56' width='56' decoding='async'/> Label {} [+] Name* Email* Website Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); <img alt='guest' src='https://secure.gravatar.com/avatar/a9a39f0a0e1