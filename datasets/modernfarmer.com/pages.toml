full_description = '''They are large for snails, with fully grown shells reaching up to nearly 10 inches. And they’re pretty. Their shells are often splotched with red or orange markings or deep amber striping curving along the tip. But more importantly, they are delicious, simmered with aromatics and served with a light seaweed over a bed of pasta. They are tulip snails, a mollusk found in the sandy bottoms of shallow pools along the south eastern coast of the US. And while they may not be the typical fare you expect at a swanky seafood restaurant in the US, at Seabird, they sit proudly alongside menu classics such as crab, yellowfin tuna and oysters. <img data-dominant-color="848a81" data-has-transparency="false" style="--dominant-color: #848a81;" decoding="async" class="size-medium wp-image-163593 not-transparent" src="https://modernfarmer.com/wp-content/uploads/2024/08/shutterstock_90503221-532x346.webp" alt="" width="532" height="346" srcset="https://modernfarmer.com/wp-content/uploads/2024/08/shutterstock_90503221-532x346.webp 532w, https://modernfarmer.com/wp-content/uploads/2024/08/shutterstock_90503221-768x499.webp 768w, https://modernfarmer.com/wp-content/uploads/2024/08/shutterstock_90503221-jpg.webp 1000w" sizes="(max-width: 532px) 100vw, 532px">A tulip snail. Photography via Shutterstock/Brain Lasenby. Seabird, in Wilmington, NC, is a sustainable seafood place that utilizes foraging to get many of its ingredients—and to act as an opportunity for education. Rather than rely only on farmed fish or wild caught fish that is shipped from ports across the world, Neff tries to work with local food, which can create a bit of uncertainty in the menu. Ordering 50 pounds of swordfish from a distributor is a fairly straightforward process. But with local fishing and foraging, you’re working with a wild population, and you’re not guaranteed to find what you set out for. You’re also limited by the seasonality of the food. “I think everybody knows that tomatoes or okra or cabbages are seasonal,” says chef and owner Dean Neff. “But I don’t know that everyone knows the seasonality of oysters or speckled sea trout. Being able to have conversations about that and about sustainability with seafood was important to us.” full_link Read More Meet the coastal farm and forager introducing Oregon to climate cuisine. Neff opened the restaurant in 2021 with his partner, and he started working with foragers to access local ingredients at sustainable levels. That’s when he met Ana Shellem of Shell’em Seafood, a coastal forager and sustainable fisher who works along the coastline of Masonboro Island. Shellem began foraging five years ago, after many years of harvesting wild shellfish. As a conservationist, Shellem is careful when and where she harvests, only bringing in what is in season and in small quantities. “When you eat wild and in season…I only eat oysters in season, even though with farmed oysters, you can eat them year round. But I think everything is at its finest when it’s in season. Eating a tomato in the winter is not as exciting as eating a tomato in the summer and appreciating the flavor profiles.” <img data-dominant-color="b6b6b8" data-has-transparency="false" style="--dominant-color: #b6b6b8;" decoding="async" class="size-medium wp-image-163594 not-transparent" src="https://modernfarmer.com/wp-content/uploads/2024/08/20230208-HT8A3821-1-519x346.webp" alt="" width="519" height="346" srcset="https://modernfarmer.com/wp-content/uploads/2024/08/20230208-HT8A3821-1-519x346.webp 519w, https://modernfarmer.com/wp-content/uploads/2024/08/20230208-HT8A3821-1-1200x800.webp 1200w, https://modernfarmer.com/wp-content/uploads/2024/08/20230208-HT8A3821-1-768x512.webp 768w, https://modernfarmer.com/wp-content/uploads/2024/08/20230208-HT8A3821-1-jpg.webp 1280w" sizes="(max-width: 519px) 100vw, 519px">Dean Neff and Ana Shellem on the water. Photography by Baxter Miller. Most shellfish seasons have to do with their cycle of breeding and molting, normally coinciding with water temperature. For instance, stone crabs along the east coast are out of season in the summer months, when the crabs will molt, shedding their shells and pumping the warm sea water in and out of their bodies to create new exoskeletons. It’s when the crabs have shed their shells that they can mate, creating nests for their egg sacs. That mating and molting will be done by October, and the season will pick up again then. It’s similar for lobsters. Over the summer, lobsters will migrate into warmer, shallower water to feed and molt, which makes them easier to catch. However, a lobster without its hard shell is trickier to transport, so the peak of lobster season is often earlier in the springtime or in December, before the waters get too cold. full_link Take action Make a commitment to seasonal eating with this seasonal food guide. Each organism in the ocean, just like on land, has a season of rest, regrowth, or stasis, followed by a season of abundance. As consumers, we’re often used to eating strawberries in January or oysters in June. But to truly be aligned with seasonality, Shellem and Neff say, is to widen your palate and embrace other options. “It’s amazing to work with James Beard chefs that are educated and able to experiment with obscure things, like the tulip snails that Dean’s been working with, or North Carolina whelks. The seaweeds I get to bring him are really fun, like the sea bean or prickly pear cactus,” says Shellem. “I’ll even drop off samples so they can make a staff meal, just to educate their staff as well. It is so much fun to see so many people so passionate about the same thing with the same goal.” But here’s where it gets tricky. Eating seasonally or prioritizing local foods is not just about trying new things. It’s also about learning what the limitations are and sometimes, living with disappointment. Foragers on land, for instance, will only take a certain number of mushrooms in a patch, to ensure sufficient regrowth. For Shellem, the same principle applies to seafood. She gathers what she needs for her restaurants and leaves the rest to flourish. That can make for an uncomfortable conversation at the dinner table. “When we were first opening, we explained to the servers that we’re going to run out of a particular fish tonight, and for some people that gives them anxiety,” says Neff. “But I think that should make you happy. Because that’s the nature of a sustainable restaurant; supplies are limited. We will be constantly changing.” For Neff, leaning into that change, and getting his customers used to it, is key. full_link Learn more: Curious about the seafood and aquatic habitat in your region? For Shellem, the lesson is more blunt but arguably more widely applicable. “I think if people could be more comfortable with being told ‘no’ sometimes, that would be awesome.” <img data-dominant-color="9d8979" data-has-transparency="false" style="--dominant-color: #9d8979;" decoding="async" class="size-medium wp-image-163595 not-transparent" src="https://modernfarmer.com/wp-content/uploads/2024/08/20230209-HT8A6018-1-519x346.webp" alt="" width="519" height="346" srcset="https://modernfarmer.com/wp-content/uploads/2024/08/20230209-HT8A6018-1-519x346.webp 519w, https://modernfarmer.com/wp-content/uploads/2024/08/20230209-HT8A6018-1-1200x800.webp 1200w, https://modernfarmer.com/wp-content/uploads/2024/08/20230209-HT8A6018-1-768x512.webp 768w, https://modernfarmer.com/wp-content/uploads/2024/08/20230209-HT8A6018-1-jpg.webp 1280w" sizes="(max-width: 519px) 100vw, 519px">Dean Neff prepares his catch at Seabird. Photography by Baxter Miller. As for the tulip snails, Neff says they’ve been popular, and they’ve even had customers come in specifically looking for the snails. “We had people come all the way from France, not too long ago, and they said their main agenda was to eat at the restaurant,” which Neff concedes is a lot of pressure on one dinner order. However, it also means his message is spreading. “It meant so much to them to try [an ingredient] so unique that they’ve never had before.” Subscribe Notify of new follow-up comments new replies to my comments <img alt='guest' src='https://secure.gravatar.com/avatar/97664c5a1371efd8c3553a548eebbcf6?s=56&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/97664c5a1371efd8c3553a548eebbcf6?s=112&#038;d=mm&#038;r=g 2x' class='avatar avatar-56 photo' height='56' width='56' decoding='async'/> Label {} [+] Name* Email* Website Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); <img alt='guest' src='https://secure.gravatar.com/avatar/f703c70b5abf15a4f6d0087d20a8d3d0?s=56&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/f703c70b5abf15a4f6d0087d20a8d3d0?s=112&#038;d=mm&#038;r=g 2x' class='avatar avatar-56 photo' height='56' width='56' decoding='async'/> Label {} [+] Name* Email* Website Δdocument.getElementById( "ak_js_2" ).setAttribute( "value", ( new Date() ).getTime() ); This site uses Akismet to reduce spam. Learn how your comment data is processed. 1 Comment Most Voted Newest Oldest Inline Feedbacks View all comments <img alt='Carl Schleg' src='https://secure.gravatar.com/avatar/a9b7ce4d1c0064fa52c9c7e8f8d3b777?s=64&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/a9b7ce4d1c0064fa52c9c7e8f8d3b777?s=128&#038;d=mm&#038;r=g 2x' class='avatar avatar-64 photo' height='64' width='64' decoding='async'/> Carl Schleg 6 months ago Can tulip snails grow at home commercially? 0 Reply Follow usFacebookInstagramLinkedInXRepublish!Republish This Story<img width="88" height="31" alt="Creative Commons License" style="border-width:0" src="https://modernfarmer.com/wp-content/plugins/republication-tracker-tool/assets/img/cc-by-nd-4.0.png" />Republish our articles for free, online or in print, under a Creative Commons license. Close window XRepublish this articleThis work is licensed under a Creative Commons Attribution-NoDerivatives 4.0 Internati