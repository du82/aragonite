title = "Top 10 Food Equity Stories of 2024 - Modern Farmer"
description = "Food can be a tricky thing. While we produce enough food for people globally, it doesn't always get distributed equally. Food is also a powerful cultural"
full_description = '''Food can be a tricky thing. While we produce enough food for people globally, it doesn’t always get distributed equally. Food is also a powerful cultural connector, and can bring communities together. This year, we looked at many stories of food access and equity, and what food means to people. From exclusive avocados and exorbitantly priced butter, to a microgreens farm and a community fridge, we took a look at all corners of our food system. Here, we’ve collected our top 10 most read, shared, and commented on Food Equity stories for you to revisit. Let us know which stories you connected with the most in the comments. In this series FoodWhy We Can’t Get Mexico’s Butter Avocados in the USTrade restrictions between several Mexican states and the US mean many of the best ingredients don’t make their way across the border. by Ashlen Wilder <img width="640" height="556" src="https://modernfarmer.com/wp-content/uploads/2024/02/Tami-in-the-CB-e1708008939404-1179x1024.webp" class="attachment-large size-large not-transparent" alt="" decoding="async" srcset="https://modernfarmer.com/wp-content/uploads/2024/02/Tami-in-the-CB-e1708008939404-1179x1024.webp 1179w, https://modernfarmer.com/wp-content/uploads/2024/02/Tami-in-the-CB-e1708008939404-398x346.webp 398w, https://modernfarmer.com/wp-content/uploads/2024/02/Tami-in-the-CB-e1708008939404-768x667.webp 768w, https://modernfarmer.com/wp-content/uploads/2024/02/Tami-in-the-CB-e1708008939404-1151x1000.webp 1151w, https://modernfarmer.com/wp-content/uploads/2024/02/Tami-in-the-CB-e1708008939404.jpeg 1500w" sizes="(max-width: 640px) 100vw, 640px" data-has-transparency="false" data-dominant-color="7f6878" style="--dominant-color: #7f6878;" />FoodMeet the Farmer Who Pivoted in Her Fifties From a Law Firm to a Microgreens FarmTami Purdue waited until later in life to start her urban agriculture career. Now, she runs a thriving microgreens farm and community garden. by Lauren David <img width="640" height="457" src="https://modernfarmer.com/wp-content/uploads/2024/03/Screenshot-2024-03-11-at-3.52.24 PM-1200x857.png" class="attachment-large size-large has-transparency" alt="" decoding="async" srcset="https://modernfarmer.com/wp-content/uploads/2024/03/Screenshot-2024-03-11-at-3.52.24 PM-1200x857.png 1200w, https://modernfarmer.com/wp-content/uploads/2024/03/Screenshot-2024-03-11-at-3.52.24 PM-484x346.png 484w, https://modernfarmer.com/wp-content/uploads/2024/03/Screenshot-2024-03-11-at-3.52.24 PM-768x549.png 768w, https://modernfarmer.com/wp-content/uploads/2024/03/Screenshot-2024-03-11-at-3.52.24 PM-1400x1000.png 1400w, https://modernfarmer.com/wp-content/uploads/2024/03/Screenshot-2024-03-11-at-3.52.24 PM.png 1280w" sizes="(max-width: 640px) 100vw, 640px" data-has-transparency="true" data-dominant-color="838071" style="--dominant-color: #838071;" />FoodIf Montreal Can Feed Itself Year-Round, More Cities CanMontreal is the world capital of urban agriculture, proving that winter weather is no reason to stop eating locally. by Kathleen Willcox <img width="640" height="289" src="https://modernfarmer.com/wp-content/uploads/2024/03/shutterstock_467823860-jpg.webp" class="attachment-large size-large not-transparent" alt="" decoding="async" srcset="https://modernfarmer.com/wp-content/uploads/2024/03/shutterstock_467823860-jpg.webp 1000w, https://modernfarmer.com/wp-content/uploads/2024/03/shutterstock_467823860-560x253.webp 560w, https://modernfarmer.com/wp-content/uploads/2024/03/shutterstock_467823860-768x347.webp 768w" sizes="(max-width: 640px) 100vw, 640px" data-has-transparency="false" data-dominant-color="725f4e" style="--dominant-color: #725f4e;" />FoodYour Food is Less Nutritious Than It Used to BeAs our climate changes, our food is at risk of immediate dangers such as fires and floods. But there are long-term impacts that have already changed the makeup of the food you eat. by Emily Baron Cadloff <img width="640" height="599" src="https://modernfarmer.com/wp-content/uploads/2024/11/20240909_105814-1-1-1095x1024.webp" class="attachment-large size-large not-transparent" alt="" decoding="async" srcset="https://modernfarmer.com/wp-content/uploads/2024/11/20240909_105814-1-1-1095x1024.webp 1095w, https://modernfarmer.com/wp-content/uploads/2024/11/20240909_105814-1-1-370x346.webp 370w, https://modernfarmer.com/wp-content/uploads/2024/11/20240909_105814-1-1-768x718.webp 768w, https://modernfarmer.com/wp-content/uploads/2024/11/20240909_105814-1-1-jpg.webp 1280w" sizes="(max-width: 640px) 100vw, 640px" data-has-transparency="false" data-dominant-color="766962" style="--dominant-color: #766962;" />FoodMeet the Native American Farmer Promoting Northern New Mexico’s Indigenous FoodwaysA cooking class at The Feasting Place provides a small glimpse into pueblo life. by Laurel Miller <img width="640" height="427" src="https://modernfarmer.com/wp-content/uploads/2024/05/shutterstock_1859464357-jpg.webp" class="attachment-large size-large not-transparent" alt="" decoding="async" srcset="https://modernfarmer.com/wp-content/uploads/2024/05/shutterstock_1859464357-jpg.webp 1000w, https://modernfarmer.com/wp-content/uploads/2024/05/shutterstock_1859464357-519x346.webp 519w, https://modernfarmer.com/wp-content/uploads/2024/05/shutterstock_1859464357-768x512.webp 768w" sizes="(max-width: 640px) 100vw, 640px" data-has-transparency="false" data-dominant-color="313d56" style="--dominant-color: #313d56;" />Consumption$9 Butter? Canadian Redditors Say No Thank YouSubscribers to a Reddit thread organized a national boycott of grocery mega-chain Loblaws that grew into a community movement to promote farmer’s markets and local food. by Emily Baron Cadloff <img width="640" height="480" src="https://modernfarmer.com/wp-content/uploads/2023/12/On-Lundberg-Farms-photo-by-EBC.jpeg" class="attachment-large size-large not-transparent" alt="" decoding="async" srcset="https://modernfarmer.com/wp-content/uploads/2023/12/On-Lundberg-Farms-photo-by-EBC.jpeg 1024w, https://modernfarmer.com/wp-content/uploads/2023/12/On-Lundberg-Farms-photo-by-EBC-461x346.webp 461w, https://modernfarmer.com/wp-content/uploads/2023/12/On-Lundberg-Farms-photo-by-EBC-768x576.webp 768w" sizes="(max-width: 640px) 100vw, 640px" data-has-transparency="false" data-dominant-color="918157" style="--dominant-color: #918157;" />FoodWhat Will Become of Rice?A critical global crop, rice makes up roughly 20 percent of calories consumed by humans, but it’s highly dependent on getting the right amount of water. Can it be bred to survive the changing climate? by Emily Baron Cadloff <img width="640" height="452" src="https://modernfarmer.com/wp-content/uploads/2024/04/MixCollage-11-Apr-2024-04-16-PM-4553-1200x848.webp" class="attachment-large size-large not-transparent" alt="" decoding="async" srcset="https://modernfarmer.com/wp-content/uploads/2024/04/MixCollage-11-Apr-2024-04-16-PM-4553-1200x848.webp 1200w, https://modernfarmer.com/wp-content/uploads/2024/04/MixCollage-11-Apr-2024-04-16-PM-4553-489x346.webp 489w, https://modernfarmer.com/wp-content/uploads/2024/04/MixCollage-11-Apr-2024-04-16-PM-4553-768x543.webp 768w, https://modernfarmer.com/wp-content/uploads/2024/04/MixCollage-11-Apr-2024-04-16-PM-4553-1415x1000.webp 1415w, https://modernfarmer.com/wp-content/uploads/2024/04/MixCollage-11-Apr-2024-04-16-PM-4553-jpg.webp 1280w" sizes="(max-width: 640px) 100vw, 640px" data-has-transparency="false" data-dominant-color="6f645e" style="--dominant-color: #6f645e;" />FoodOpinion: There’s No Right Way to Eat MeatTrying to make the ‘perfect’ decision over such a thorny issue is simply not possible. Instead, aim for ‘less’ and ‘better’. by Olivia Oldham and Katie Revell <img width="640" height="427" src="https://modernfarmer.com/wp-content/uploads/2024/07/Community-Fridge-103.jpg" class="attachment-large size-large" alt="" decoding="async" srcset="https://modernfarmer.com/wp-content/uploads/2024/07/Community-Fridge-103.jpg 1280w, https://modernfarmer.com/wp-content/uploads/2024/07/Community-Fridge-103-518x346.webp 518w" sizes="(max-width: 640px) 100vw, 640px" />FoodA Day in the Life of a Community FridgeModern Farmer spent the day with community fridge volunteers as they restocked a popular community hub. by Modern Farmer <img width="640" height="468" src="https://modernfarmer.com/wp-content/uploads/2024/10/Screenshot-2024-10-03-at-4.07.31 PM-1200x877.png" class="attachment-large size-large not-transparent wpsmartcrop-image" alt="" decoding="async" srcset="https://modernfarmer.com/wp-content/uploads/2024/10/Screenshot-2024-10-03-at-4.07.31 PM-1200x877.png 1200w, https://modernfarmer.com/wp-content/uploads/2024/10/Screenshot-2024-10-03-at-4.07.31 PM-474x346.png 474w, https://modernfarmer.com/wp-content/uploads/2024/10/Screenshot-2024-10-03-at-4.07.31 PM-768x561.png 768w, https://modernfarmer.com/wp-content/uploads/2024/10/Screenshot-2024-10-03-at-4.07.31 PM.png 1280w" sizes="(max-width: 640px) 100vw, 640px" data-has-transparency="false" data-dominant-color="6d716f" style="--dominant-color: #6d716f;" data-smartcrop-focus="[50,55]" />FoodLoiter: East Cleveland Fights for Food Power in a Harsh ClimateHow one organization is growing self-determination and food justice amid a barren landscape for Black-owned businesses. by Hadassah Patterson Subscribe Notify of new follow-up comments new replies to my comments <img alt='guest' src='https://secure.gravatar.com/avatar/908a10b79aa6b7267dabc8138563a4be?s=56&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/908a10b79aa6b7267dabc8138563a4be?s=112&#038;d=mm&#038;r=g 2x' class='avatar avatar-56 photo' height='56' width='56' decoding='async'/> Label {} [+] Name* Email* Website Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() ); <img alt='guest' src='https://secure.gravatar.com/avatar/62b36adc86718a42a92a395f6a4ff9ad?s=56&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/62b36adc86718a42a92a395f6a4ff9ad?s=112&#038;d=mm&#038;r=g 2x' class