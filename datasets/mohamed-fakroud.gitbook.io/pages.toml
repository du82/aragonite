full_description = '''ShellcodingLeveraging from PE parsing technique to write x86 shellcodePreviousPolymorphism and Virtual Function Reversal in C++NextHeap - House Of ForceLast updated 1 year agoWas this helpful? Shellcode is often used alongside an exploit to subvert a running program, or by an injector performing a process injection. Hence, shellcode must dynamically locate the required WIN32 API functions to work reliably and efficiently in different Windows versions, and for that task, it typically uses LoadLibraryA and GetProcAddress that are exported from "kernel32.dll". In this post, we will explore the world of Win32 shellcode development using what we learned from the previous blog regarding PEB structure, and specifically, we will understand how the shellcode leverage from PE parsing technique. Thus, everything will be done directly within the debugger via IDA Pro, as well as we will easily get the opcodes and test our shellcode step by step. Finally, to truly understand the structure of Kernel32.dll, we will use CFF Explorer and view the contents of this precious DLL. Now, let's fasten our seat belts and start! In our previous post "Digging into Windows PEB", we conclude that any executable file is being loaded in the memory, the Windows loads beside it the main core libraries kernel32.dll & ntdll.dll and saves the addresses of these libraries in the base address. The figure below describes the data structures that are followed to find the base address of kernel32.dll: So, we will retrieve the base address of kernel32.dll from the PEB as shown in the following sample assembly code: With this assembly code, we can find the kernel32.dll base address and store it in eax register, thus we need to assemble it via nasm. As the program is written in x86 assembly, the elf32 file type is specified using the-f flag then disassembled into opcodes using objdump : Now, let's test our shellcode within the context of a C program, the shellcode can be placed in a test program (titled runner.c in this example) written in C, as shown below:'''
