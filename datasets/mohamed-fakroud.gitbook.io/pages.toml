full_description = '''Practical Malware Analysis Lab Write-UpAnalyzing Lab-06-n.exeRecognizing C Code Constructs in AssemblyPreviousBinary Bomb Lab :: Phase 6Last updated 8 months agoWas this helpful? Chapter Six focused on code constructs in x86 and how malware analysts can easily identify them when walking through the disassembly without digging into details, but develop that instinct to recognize what the code is doing at a higher level. This skill takes time to develop, and spot C code constructs in x86 assembly will prevent from getting lost in details. By disassembling the executable starting from the main function, the latter begins with a single call to the procedure sub_401000: Stepping into this routine we're noticing that there is a compare statement before a JZ jump statement, and by using the graph view we can confirm that this is an indicative of an ‘if’ code construct. Finally, the third function __ftbuf is called with two parameters. The reference to the file and the result of the first function call __stbuf. A quick search leads us to discover that __stbuf & __stbuf are being declared in the header file internal.h within the .NET Core: From this we can assume that 0x40105F provides functionality for input/output of files, and if we are looking at the xrefs to 0x40105F, we see only two results: As described in the first question based on the C code, the program checks if there’s an active internet connection. If there is an internet connection, it returns 1 otherwise it returns 0. The first subroutine called by main (sub_401000) is the same we discovered in Lab06-01.exe. It checks the internet connected state of the system. First a call to InternetOpenA where the parameter string szAgent is set to "Internet Explorer 7.5/pma", and if the function successes, it returns a valid handle that can be used on the subsequent WinINET functions. Upon success, InternetOpenUrlA is called using the string "http://www.practicalmalwareanalysis.com/cc.htm" assigned to szUrl. If the returned value from InternetOpenUrlA is a non-zero value which means returning a valid handle to the URL, then the webpage is read using InternetReadFile into a 512 byte buffer:'''
