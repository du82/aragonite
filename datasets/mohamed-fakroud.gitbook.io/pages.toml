title = "Abusing IDispatch for Trapped COM Object Access & Injecting into PPL Processes | Red Teaming's Dojo"
full_description = "Abusing IDispatch for Trapped COM Object Access & Injecting into PPL ProcessesPreviousDigging into Windows PEBNextPolymorphism and Virtual Function Reversal in C++Last updated 2 days agoWas this helpful? In this post, I explore an interesting bug class identified by James Forshaw from Google Project Zero that relates to the IDispatch interface in COM servers. His research highlights a vulnerability in how certain COM servers, particularly those implementing the IDispatch interface, allow the creation of arbitrary objects within the process. Notably, every Object-Oriented Programming (OOP) COM server implementing IDispatch exposes the ability to create objects like STDFONT, which was never intended to be used safely across process boundaries. This opens the door to potential exploitation, especially when interacting with cross-process COM remoting. Forshaw’s work demonstrated the security risks in these implementations but did not provide a complete Proof of Concept (PoC). Drawing inspiration from his research and driven by my passion for COM object exploitation, I decided to take on the challenge and develop a functional PoC in C++. This blog expands on Forshaw’s findings, providing a working PoC that shows how the misuse of this COM feature can be leveraged to inject unsigned code into a Protected Process Light (PPL) process with the protection PsProtectedSignerWindows-Light. This PoC demonstrates how the technique can bypass Protected Process Light (PPL) protection, highlighting the significant real-world implications of this vulnerability. It provides a powerful means of accessing critical protected processes, such as LSASS with LSA protection or a protected AV/EDR. This section dissects the core mechanism of our exploit: leveraging C++/mscorlib interoperability to hijack COM activation and force the execution of arbitrary .NET code under the guise of trusted process. At its core, this exploit leverages the Windows Update Medic Service’s WaaSRemediationAgent COM server, — a privileged component running as svchost.exe within a PPL process protected by PsProtectedSignerWindows-Light — to load and execute am unsigned .NET payload."
