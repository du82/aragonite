`180626aa) Branch bomb!phase_6+0x166 313 00007ff7`18062716 b808000000 mov eax,8 313 00007ff7`1806271b 486bc000 imul rax,rax,0 313 00007ff7`1806271f 488b440578 mov rax,qword ptr [rbp+rax+78h] 313 00007ff7`18062724 48894508 mov qword ptr [rbp+8],rax 314 00007ff7`18062728 488b4508 mov rax,qword ptr [rbp+8] 314 00007ff7`1806272c 48894528 mov qword ptr [rbp+28h],rax 316 00007ff7`18062730 c785c400000001000000 mov dword ptr [rbp+0C4h],1 316 00007ff7`1806273a eb0e jmp bomb!phase_6+0x19a (00007ff7`1806274a) Branch bomb!phase_6+0x18c 316 00007ff7`1806273c 8b85c4000000 mov eax,dword ptr [rbp+0C4h] 316 00007ff7`18062742 ffc0 inc eax 316 00007ff7`18062744 8985c4000000 mov dword ptr [rbp+0C4h],eax bomb!phase_6+0x19a 316 00007ff7`1806274a 83bdc400000006 cmp dword ptr [rbp+0C4h],6 316 00007ff7`18062751 7d22 jge bomb!phase_6+0x1c5 (00007ff7`18062775) Branch bomb!phase_6+0x1a3 317 00007ff7`18062753 486385c4000000 movsxd rax,dword ptr [rbp+0C4h] 317 00007ff7`1806275a 488b4d28 mov rcx,qword ptr [rbp+28h] 317 00007ff7`1806275e 488b44c578 mov rax,qword ptr [rbp+rax*8+78h] 317 00007ff7`18062763 48894108 mov qword ptr [rcx+8],rax 318 00007ff7`18062767 488b4528 mov rax,qword ptr [rbp+28h] 318 00007ff7`1806276b 488b4008 mov rax,qword ptr [rax+8] 318 00007ff7`1806276f 48894528 mov qword ptr [rbp+28h],rax 319 00007ff7`18062773 ebc7 jmp bomb!phase_6+0x18c (00007ff7`1806273c) Branch bomb!phase_6+0x1c5 320 00007ff7`18062775 488b4528 mov rax,qword ptr [rbp+28h] 320 00007ff7`18062779 48c7400800000000 mov qword ptr [rax+8],0 323 00007ff7`18062781 488b4508 mov rax,qword ptr [rbp+8] 323 00007ff7`18062785 48894528 mov qword ptr [rbp+28h],rax 324 00007ff7`18062789 c785c400000000000000 mov dword ptr [rbp+0C4h],0 324 00007ff7`18062793 eb0e jmp bomb!phase_6+0x1f3 (00007ff7`180627a3) Branch bomb!phase_6+0x1e5 324 00007ff7`18062795 8b85c4000000 mov eax,dword ptr [rbp+0C4h] 324 00007ff7`1806279b ffc0 inc eax 324 00007ff7`1806279d 8985c4000000 mov dword ptr [rbp+0C4h],eax bomb!phase_6+0x1f3 324 00007ff7`180627