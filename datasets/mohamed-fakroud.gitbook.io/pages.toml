["https://mohamed-fakroud.gitbook.io/red-teamings-dojo/c++/polymorphism-and-virtual-function-reversal-in-c++"]
title = "Polymorphism and Virtual Function Reversal in C++ | Red Teaming's Dojo"
full_description = '''C++Polymorphism and Virtual Function Reversal in C++IntroductionWhile exploring the internals of COM objects and their underlying implementation, particularly focusing on the feature of "separating implementation from the definition of behavior," I realized that COM objects heavily rely on C++ runtime polymorphism. To gain a deeper understanding of this key C++ characteristic, I spent some time delving into it, along with conducting some reverse engineering to fully grasp the concept.Polymorphic code refers to code that can be written once and reused with different types. In C++, polymorphism is achieved through two main approaches: compile-time polymorphism, where types are determined at compile time, and runtime polymorphism, which enables dynamic behavior during program execution. Essentially, polymorphism allows objects to behave as "another type" and exhibit multiple forms. For reverse engineers, this concept is closely tied to dynamic dispatch, where virtual methods play a crucial role. Virtual methods enable calling the appropriate function of the most derived class, even if it's overridden from a base class, providing a mechanism for dynamic dispatch that allows flexible and extensible code behavior.Motivating ExampleCopy#include <iostream> #include <format> struct ConsoleLogger { void logTransfer(long from, long to, double amount) { std::cout << std::format("{} -> {}: {:.2f}\n", from, to, amount); } }; struct Bank { void makeTransfer(long from, long to, double amount) { logger.logTransfer(from, to, amount); } private: ConsoleLogger logger; }; int main() { Bank bank; bank.makeTransfer(1000, 2000, 50.09); bank.makeTransfer(2000, 4000, 20.00); return 0; }Suppose, you need to implement various types of logger, such as remote server logger, a local file logger, or even a logger that sends data to a printer. Additionally, the program should allow dynamic switching between these loggers at runtime. One easy approach is to use a scoped enumeration to manage and switch between these different loggers :Copy#include <iostream> #include <format> #include <stdexcept> struct ConsoleLogger { void logTransfer(long from, long to, double amount) { std::cout << std::format("[CONS] {} -> {}: {:.2f}\n",from, to, amount); } }; struct FileLogger { void logTransfer(long from, long to, double amount) { std::cout << std::format("[FILE] {} -> {}: {:.2f}\n", from, to, amount); } }; enum class LoggerType { Console, File }; struct Bank { Bank() : type{LoggerType::Console} {} void set_logger(LoggerType new_type) { type = new_type; } void makeTransfer(long from, long to, double amount) { switch (type) { case LoggerType::Console: conslogger.logTransfer(from, to, amount); break; case LoggerType::File: filelogger.logTransfer(from, to, amount); break; default: throw std::logic_error("Unknown Logger type encountered"); break; } } private: ConsoleLogger conslogger; FileLogger filelogger; LoggerType type; }; int main() { Bank bank; bank.makeTransfer(1000, 2000, 50.09); bank.set_logger(LoggerType::File); bank.makeTransfer(2000, 4000, 20.00); return 0; }The solution provided above still has some limitations and isn't as flexible as it could be. The primary issue here is that the Bank class directly depends on specific logger implementations (ConsoleLogger and FileLogger). This design violates the Open/Closed Principle, as adding a new logger would require modifying the Bank class, making it less scalable and maintainable.A better approach would be to use runtime polymorphism and dependency injection by introducing a common interface (abstract class) for loggers. This way, we can pass any logger implementation to the Bank class without modifying it.Runtime PolymorphismRuntime polymorphism enables you to conveniently "program in general" rather than "program in specific", and is also known as dynamic polymorphism or late binding, In runtime polymorphism, the function call is resolved at run time.To refactor the code above by utilizing polymorphism and dependency injection, we should first clarify these two concepts:Polymorphism: This allows us to use different types of loggers (e.g., ConsoleLogger, FileLogger) through a common interface. This means our Bank class can operate with any logger that implements a common interface, without knowing the specifics of each logger.Dependency Injection: Instead of creating dependencies directly inside the Bank class (like ConsoleLogger conslogger; and FileLogger filelogger;), dependency injection allows us to "inject" these dependencies (in this case, the logger) from outside. This makes our Bank class more flexible, allowing us to change the logger without altering the class itself. We achieve this by passing the logger instance to Bank, either in the constructor or via a setter method.Let's apply these concepts to the code.Step 1: Create a ILogger InterfaceWe'll define an abstract base class called ILogger with a pure virtual logTransfer method. Both the concrete classes ConsoleLogger and FileLogger will inherit from this interface and provide their own implementations.Step 2: Use Dependency Injection in the Bank ClassInstead of hard-coding the ConsoleLogger or FileLogger objects in Bank, we’ll inject a Logger pointer (or reference) into Bank. This allows the Bank to work with any Logger-derived object.Copy#include <iostream> #include <format> #include <memory> #include <stdexcept> // Step 1: Create the ILogger interface struct ILogger { virtual void logTransfer(long from, long to, double amount) = 0; // pure virtual function virtual ~ILogger() = default; // virtual destructor for proper cleanup of derived classes }; // ConsoleLogger inherits from ILogger struct ConsoleLogger : public ILogger { void logTransfer(long from, long to, double amount) override { std::cout << std::format("[CONS] {} -> {}: {:.2f}\n", from, to, amount); } }; // FileLogger inherits from ILogger struct FileLogger : public ILogger { void logTransfer(long from, long to, double amount) override { std::cout << std::format("[FILE] {} -> {}: {:.2f}\n", from, to, amount); } }; // Bank class now depends on the ILogger interface, not a specific implementation struct Bank { // Constructor takes a Logger pointer, which allows dependency injection Bank(std::shared_ptr<ILogger> logger) : m_logger(std::move(logger)) {} // Setter to change the logger at runtime if needed void setLogger(std::shared_ptr<ILogger> new_logger) { m_logger = std::move(new_logger); } void makeTransfer(long from, long to, double amount) { if (!m_logger) { throw std::logic_error("Logger is not set!"); } m_logger->logTransfer(from, to, amount); } private: std::shared_ptr<ILogger> m_logger; // Pointer to a ILogger, allows polymorphic behavior }; // Main function to demonstrate dependency injection int main() { // Inject a ConsoleLogger into Bank auto consoleLogger = std::make_shared<ConsoleLogger>(); Bank bank(consoleLogger); // Dependency injection via constructor bank.makeTransfer(1000, 2000, 50.09); // Switch to a FileLogger at runtime auto fileLogger = std::make_shared<FileLogger>(); bank.setLogger(fileLogger); // Dependency injection via setter bank.makeTransfer(2000, 4000, 20.00); return 0; } Dependency InjectionWhat is Dependency Injection? Dependency Injection is a design pattern that helps you pass dependencies (objects a class needs to function) to a class instead of creating them inside the class. This makes your code more flexible and testable.The Bank class has a private logger attribute of type std::shared_ptr<ILogger>, injected via:Constructor Injection: In this example, we use constructor injection by passing the ILogger instance (dependency) into the Bank constructor:CopyBank bank(consoleLogger);This means the Bank class can work with any Logger implementation, and we can switch between different Logger types without changing the Bank class itself.Property Injection: We also use property injection with the setLogger method:Copybank.setLogger(fileLogger);This lets us change the logger at runtime, adding more flexibility. Property injection is useful if you need to change dependencies after the object is created.Benefits of Dependency Injection:Flexibility: The Bank class works with any Logger implementation. We can easily add a new DatabaseLogger in the future and use it with Bank.Testability: Dependency injection allows us to pass mock loggers to Bank during testing, making it easier to isolate and test its behavior.Code Reuse and Decoupling: Bank is not tightly coupled to specific logger implementations. It depends only on the ILogger interface, allowing us to reuse the Bank class in different contexts.Polymorphism in ActionBy defining a ILogger interface with logTransfer as a virtual function, both ConsoleLogger and FileLogger provide their own implementations. The Bank class does not need to know which specific ILogger it’s using—it just calls logTransfer, and the correct function is called based on the actual ILogger type injected. This is polymorphism in action: different behaviors (ConsoleLogger and FileLogger) are accessed through a common interface (ILogger).Simple diagram for Dependency Injection in Bank class.Copy +--------------------+ | Logger | <--- Interface |--------------------| | + logTransfer(...) | +--------------------+ ▲ | +----------+----------+ | | +-----------------+ +------------------+ | ConsoleLogger | | FileLogger | <--- Concrete Implementations |-----------------| |------------------| | + logTransfer() | | + logTransfer() | +-----------------+ +------------------+ ▲ | +------------+ | Bank | |------------| | - logger | <--- Logger dependency (Injected) | + setLogger() (Setter Injection) | + makeTransfer() (uses logger) +------------+This diagram highlights where dependency injection occurs, showing Bank relying on the ILogger interface rather than specific implementations, thus enabling runtime polymorphism.Reversing C++ Virtual FunctionsBefore delving into reversing C++ virtual functions, it is essential to outline some fundamental C++ concepts relevant to the task. While the benefits of Object-Oriented Programming (OOP) for programmers are undeniable, it’s worth considering whether these advantages extend to reverse engineers analyzing applications. Advanced OOP features like polymorphism and dynamic binding are commonly used, and it's important to note that resources can be initialized on the stack or allocated on the heap. At the assembly level, structs and classes are equivalent in terms of memory footprint, and fundamentally, both are collections of memory addresses corresponding to various types.Class ConstructorThe constructor is a crucial concept for understanding the OOP structure in C++. Let’s examine how constructors are declared and defined.In the example below, we utilize dynamic initialization, contrasting with the previous straightforward class example.Before invoking the constructor, the heap-allocated memory space designated to hold our class pointer is assigned to the rcx register, followed by a call to the parameterized constructor of the Material class, which acts as a subroutine.The thispointer, which is the hidden pointer of our Material object, is used in the constructor through the rcx register. The parameters we pass in the initialize phase are moved to the memory space allocated for our object according to their size.Copy ConstructorBoth the Constructor and the Copy constructor allocates an object.Copy Constructor receives an object pointer as parameter:The Copy Constructor Person::Person(Person &) is called with two key arguments:rdx holds the address of the old object (t), which is being copied.rcx holds the address of the location (this) where the new object will be created.Stepping into the Copy Constructor :Object's methodsThose getters method under the hood they're passing the hidden this pointer via rcx register, which indicate the use of OOP primitive.InheritanceInheritance is a fundamental concept that defines the inter-class relationships and extension structure in Object-Oriented Programming (OOP). It is essential to understand the distinction between the base class and the derived class, as these two concepts play a critical role in how classes interact and extend functionality.Single inheritanceIn this situation derived class has only one base class.Copy#include <iostream> class Plant { public: Plant() : m_age{ 0 } { std::cout << "Call Plant() Base Constructor\n"; }; private: int m_age{}; }; class Tree : public Plant { public: Tree() :m_leafcount{ 0 } { std::cout << "Call Tree() Derived Constructor\n"; }; private: int m_leafcount{}; }; class Fruit : public Plant { public: Fruit() :m_waterpercent{ 0 } { std::cout << "Call Fruit() Derived Constructor\n"; }; private: int m_waterpercent{}; }; int main() { Tree oak; Fruit apple; return 0; }let's disassemble the code to understand to flow of constructor calls for each base class and the derived class, here's a detailed breakdown of what's happening in the given assembly instructions : lea rcx, [rbp+110h_var_108]The lea (Load Affective Address) instruction loads the address of the local variable into rcx register. In this case, it's loading the address of the object that is being constructed.rbp+110h_var_108 indicates the location of the this pointer, which refers to the current object on the stack.We're aware that both derived objects are created on the stack, then we're calling their constructors respectively Tree() and Fruit().call Tree:Tree(void)This line calls the constructor of the Tree class (Tree::Tree()).The rcx register holds the this pointer, which is passed to the constructor to initialize the Tree objectStepping into one of these constructors, we're noticing the this pointer is used to call the Base constructor:Always the constructor of the base class is called first then after followed by the constructor of the derived class.Multiple inheritanceDerived class has more that one base class.Copy#include <iostream> class Plant { public: Plant() : m_age{ 0 } { std::cout << "Plant::Plant()\n";} private: int m_age{}; }; class Forest { public: Forest() :numof_trees{} { std::cout << "Forest::Forest()\n"; } private: int numof_trees{}; }; class Tree : public Plant, Forest { public: Tree() :leaf_count{ 0 } { std::cout << "Tree::Tree()\n"; } private: int leaf_count{}; }; int main() { Tree tr; return 0; }Again the Tree object is created on the stack, and we're using rcx to save the address of the object into the this pointer :Stepping into the Tree() constructor :The constructor calls always start with the base constructors from left to right, followed by the derived class constructor.In multiple inheritance, we can see the value of the private members correspondent respectively :Plant Base class attributes.Forrest Base class attributes.Tree Derived class attributes.PolymorphismCode example Copy#include <iostream> class Plant { public: Plant() : m_age{ 0 } { std::cout << "Plant::Plant()\n";} virtual void Create() { std::cout << "New Plant type crea'''
