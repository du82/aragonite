full_description = "Help Viewing Information in Various File Formats The information provided by this Web site is available in various formats, such as Portable Document Format (PDF), Word, and also in html format. To view the information properly, your browser need to have the required plug-ins or software. For example, the pdf reader software is required to view the pdf format document. In case your system does not have this software, you can download it from the Internet for free. The table lists the required plug-ins needed to view the information in various file formats. Viewing Information in Various File Formats Document Type Download PDF content Adobe Acrobat Reader Word Files Word Viewer (in any version till 2003) Microsoft Office Compatibility Pack for Word (for 2007 version) Excel Files Excel Viewer 2003 (in any version till 2003) Microsoft Office Compatibility Pack for Excel (for 2007 version) Powerpoint Presentations PowerPoint Viewer 2003 (in any version till 2003) Microsoft Office Compatibility Pack for PowerPoint (for 2007 version) Flash content Adobe Flash Player Audio files Windows Media Player Screen Reader Access The National Website of India fully complies with Guidelines for Indian Government Websites. Our visitors with visual impairments can access the Portal using Assistive Technologies, such as screen readers. The information of the Website is accessible with different screen readers, such as JAWS, NVDA, SAFA, Supernova and Window-Eyes. Following table lists the information about different screen readers: Information related to the various screen readers Swipe to view Screen Reader Access Screen Reader Website Free / Commercial Screen Access For All (SAFA) Free Non Visual Desktop Access (NVDA) http://www.nvda-project.org/ Free System Access To Go http://www.satogo.com/ Free Thunder http://www.screenreader.net/index.php?pageid=11 Free WebAnywhere http://webinsight.cs.washington.edu/wa/content.php Free Hal http://www.yourdolphin.co.uk/productd