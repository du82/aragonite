["https://mohfw.gov.in/hi"]
title = "Home | स्वास्थ्य एवं परिवार कल्याण मंत्रालय | भारत सरकार"
description = "MInistry of Health and Family Welfare is a Ministry under the Government of India and is charged with formulation, implementatio"
full_description = 'प्रारंभ में स्वास्थ्य और परिवार कल्याण मंत्रालय में दो विभाग थे, प्रत्येक विभाग का नेतृत्व भारत सरकार के सचिव द्वारा किया जाता था: स्वास्थ्य और परिवार कल्याण विभाग और स्वास्थ्य अनुसंधान विभाग। 7 अगस्त 2014 को असाधारण राजपत्र अधिसूचना के माध्यम से एड्स नियंत्रण विभाग को स्वास्थ्य और परिवार कल्याण विभाग के साथ विलय कर दिया गया और इसे अब राष्ट्रीय एड्स नियंत्रण संगठन (NACO) के रूप में जाना जाएगा। स्वास्थ्य सेवा महानिदेशालय: यह स्वास्थ्य और परिवार कल्याण विभाग का एक संलग्न कार्यालय है। DGHS चिकित्सा और सार्वजनिक स्वास्थ्य मामलों पर तकनीकी सलाह देता है और विभिन्न स्वास्थ्य सेवाओं के कार्यान्वयन में शामिल है। राष्ट्रीय स्वास्थ्य प्राधिकरण: यह भारत के प्रमुख सार्वजनिक स्वास्थ्य बीमा/आश्वासन योजना "आयुष्मान भारत - प्रधानमंत्री जन आरोग्य योजना" के कार्यान्वयन के लिए जिम्मेदार है और "राष्ट्रीय डिजिटल स्वास्थ्य मिशन" की योजना, तकनीकी ढांचे और कार्यान्वयन का कार्य भी संभालता है।'
