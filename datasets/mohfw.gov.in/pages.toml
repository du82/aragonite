["https://mohfw.gov.in"]
title = "Home | Ministry of Health and Family Welfare | GOI"
description = "MInistry of Health and Family Welfare is a Ministry under the Government of India and is charged with formulation, implementatio"
full_description = '''Initially, the Ministry of Health and Family Welfare consisted of two departments, each led by a Secretary of the Government of India: the Department of Health and Family Welfare and the Department of Health Research. On August 7, 2014, through an extraordinary gazette notification, the Department of AIDS Control was merged with the Department of Health and Family Welfare and is now known as the National AIDS Control Organization (NACO). Directorate General of Health Services (DGHS): It is an attached office of the Department of Health and Family Welfare. DGHS provides technical advice on medical and public health matters and is involved in the implementation of various health services. National Health Authority: It is responsible for the implementation of India's flagship public health insurance/assurance scheme "Ayushman Bharat - Pradhan Mantri Jan Arogya Yojana" and also handles the planning, technical framework, and implementation of the "National Digital Health Mission." Hon’ble Minister of State (Independent Charge) of Ministry of AYUSH and Minister of State of Ministry of Health & Family Welfare, Government of India Hon'ble Minister of State for Health & Family Welfare and Chemicals and Fertilizers, Government of India'''
