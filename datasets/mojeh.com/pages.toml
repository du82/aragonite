["https://mojeh.com/culture/news/nathalie-fanj-unveils-studio-fanj-homeware"]
title = "Nathalie Fanj Launches Studio Fanj – Luxury Sustainable Homeware"
description = "Discover Studio Fanj, Nathalie Fanj’s sustainable homeware brand, blending timeless craftsmanship with eco-conscious design. Shop the debut Terra Collection now."
full_description = "Related StoriesNEWS, CULTUREDec 01, 2023 | 2 min readHaute Hangouts: Mott 32, The Address Beach Resort, DubaiNEWS, CULTUREJun 02, 2023 | 2 min readHaute Hangouts: La Niña, DIFC, DubaiNEWS, CULTUREDec 29, 2023 | 2 min readHaute Hangouts: Sunset 55°, Waldorf Astoria Dubai Palm JumeirahNEWS, CULTUREOct 06, 2023 | 3 min readHaute Hangouts: Rüya, DubaiNEWS, CULTUREJul 15, 2024 | 6 min read8 New Books To Add To Your Summer Reading List Nathalie Fanj Unveils A New Era Of Sustainable HomewareNEWS, CULTUREFeb 25, 2025 | 2 min readStudio Fanj marries meticulous craftsmanship with sustainability, creating one-of-a-kind pieces that transcend trendsFor those who have followed Nathalie Fanj’s journey in the fashion and lifestyle space, her latest endeavour may seem like a natural evolution - yet still a surprise. The Lebanese influencer and designer, known for her impeccable aesthetic, has ventured into the world of interiors with Studio Fanj, a homeware brand that marries meticulous craftsmanship with sustainability, creating one-of-a-kind pieces that transcend trends.“I wanted to create something deeply personal,” Fanj shares. “My love for home décor and interiors has always been a part of who I am, and I wanted to channel the joy of curating spaces into something tangible.” With Studio Fanj, she translates her signature refined style into a collection that is both intimate and intentional, offering a fresh take on slow, conscious design.Rooted in eco-conscious values, Studio Fanj embraces a refreshingly mindful approach to production. Each ceramic piece is handmade by artisans using ethically sourced clay, while the brand’s signature candles are crafted with organically harvested soy wax. No two pieces are identical - every vase, tray, and candle holder carries the imprint of its maker, a testament to the beauty of imperfection and the art of handcrafted design.The brand’s debut Terra Collection is a love letter to nature, drawing inspiration from raw materials and earthy textures. Comprising six sculptural pieces - the Sahara candle holders, Leva and Stiria candle vessels, Littera and Tilia vases, and Unda trays - the collection is an exploration of organic form and fluid movement. For Fanj, who splits her time between Lebanon and Saudi Arabia, Studio Fanj is an extension of her personal philosophy. A reflection of the spaces she has carefully curated for herself and her loved ones, each design tells a story of thoughtful luxury, where sentimentality and style exist in perfect harmony.Related StoriesNEWS, CULTUREDec 01, 2023 | 2 min readHaute Hangouts: Mott 32, The Address Beach Resort, DubaiNEWS, CULTUREJun 02, 2023 | 2 min readHaute Hangouts: La Niña, DIFC, DubaiNEWS, CULTUREDec 29, 2023 | 2 min readHaute Hangouts: Sunset 55°, Waldorf Astoria Dubai Palm JumeirahNEWS, CULTUREOct 06, 2023 | 3 min readHaute Hangouts: Rüya, DubaiNEWS, CULTUREJul 15, 2024 | 6 min read8 New Books To Add To Your Summer Reading List"
