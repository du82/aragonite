["https://mojeh.com/fashion/news/what-to-expect-from-milan-fashion-week-2025"]
title = "What To Expect From Milan Fashion Week 2025 | MOJEH"
description = "From debut collections to celebrations, there are plenty of reasons to tune into Milan Fashion Week this year"
full_description = "Related StoriesNEWS, FASHIONMay 05, 2023 | 2 min readMOJEH Styles Up The Sands With Richard Mille For The May Cover ShootNEWS, FASHIONAug 09, 2023 | 6 min readBella Hadid Opens Up About Her Battle With Lyme DiseaseNEWS, FASHIONSep 13, 2023 | 21 min readSparkle And Skin Was The Unofficial Dress Code At The 2023 VMAsNEWS, FASHIONOct 16, 2023 | 4 min readMoschino Names A New Creative DirectorNEWS, FASHIONJan 23, 2024 | 3 min readGiambattista Valli's Floral Odyssey What To Expect From Milan Fashion Week 2025NEWS, FASHIONFeb 24, 2025 | 2 min readFrom debut collections to celebrations, there are plenty of reasons to tune into Milan Fashion Week this yearMilan Fashion Week is almost here! Kicking off on 25 February and running until 3 March, the 2025 edition of Milan Fashion Week promises to be an exciting, fashion-filled extravaganza. Designers will descend upon the city to showcase their Autumn/Winter 2025 collections and this year's line-up offers plenty to look forward to.Fendi and Gucci will each be presenting both menswear and womenswear during Milan Fashion Week, having skipped the Men's Fashion Week circuit earlier this year. However, the co-ed presentation is not the only reason Gucci will arguably be one of the most talked-about shows of the season. The show comes mere weeks after the House announced that Sabato de Sarno would be stepping down as creative director, meaning the Autumn/Winter 2025 collection that will be shown on 25 February - the first show of Milan Fashion Week - is one that has been designed by the in-house team.Similarly, Fendi's menswear and womenswear collection, showing on 26 February, will be directed by Silvia Venturini Fendi following menswear creative director Kim Jones' departure earlier this month. The House will have reason to celebrate amongst the changes, though, as 2025 marks its centenary. Celebrations are also in order for Giorgio Armani, which marks 50 years of fashion this year.As for debuts, Lorenzo Serafini will be presenting his first collection for Alberta Ferretti on 25 February, while David Koma's first autumn/winter collection for Blumarine will take to the catwalk on 27 February. The following day, Missoni's new creative director Alberto Caliri showcases his first collection for the House.Bottega Veneta is absent from the Milan Fashion Week 2025 calendar as it undergoes a transition after the departure of Matthieu Blazy and appointment of Louise Trotter.See the full Milan Fashion Week calendar here, and stay tuned to MOJEH for updates.Related StoriesNEWS, FASHIONMay 05, 2023 | 2 min readMOJEH Styles Up The Sands With Richard Mille For The May Cover ShootNEWS, FASHIONAug 09, 2023 | 6 min readBella Hadid Opens Up About Her Battle With Lyme DiseaseNEWS, FASHIONSep 13, 2023 | 21 min readSparkle And Skin Was The Unofficial Dress Code At The 2023 VMAsNEWS, FASHIONOct 16, 2023 | 4 min readMoschino Names A New Creative DirectorNEWS, FASHIONJan 23, 2024 | 3 min readGiambattista Valli's Floral Odyssey"
