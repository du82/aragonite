["https://mojeh.com/culture/news/ecole-ducasse-studio-abu-dhabi-culinary-institute"]
title = "Ecole Ducasse Abu Dhabi Studio Is Honouring Heritage This Ramadan"
description = "Ecole Ducasse Abu Dhabi Studio is hosting Ramadan-specific cooking classes this Holy Month"
full_description = "Related StoriesNEWS, CULTUREJun 04, 2024 | 7 min readSpotlight: Digital Artist Silvia BadalottiNEWS, CULTUREOct 06, 2023 | 3 min readHaute Hangouts: Rüya, DubaiNEWS, CULTURENov 02, 2023 | 13 min readDubai Design Week: Five Regional Creatives On Paying Homage To HeritageNEWS, CULTUREJul 15, 2024 | 6 min read8 New Books To Add To Your Summer Reading ListNEWS, CULTUREMar 16, 2024 | 2 min readHaute Hangouts: Char, W Muscat, Oman This Culinary Institute In Abu Dhabi Is Honouring Heritage This RamadanNEWS, CULTUREFeb 19, 2025 | 2 min readEcole Ducasse Abu Dhabi Studio is hosting Ramadan-specific cooking classes this Holy MonthTogetherness and community are central to Ramadan; coming together during iftar and suhoor to share meals with loved ones not only strengthens bonds but allows for moments of connection that are otherwise lost amongst busy lives. This Ramadan, the Ecole Ducasse Abu Dhabi Studio is hosting expert-led culinary experiences to allow foodies the opportunity to celebrate the culinary traditions of the Holy Month.There are two Ramadan-specific classes available throughout March. The first is the preparation of an iftar spread, whether Emirati, French or vegetarian, which you can then enjoy alongside a sharing set menu. The second class is an intimate late-night session that dives into the techniques behind Emirati desserts - think luqaimat and date cake with cardamom sauce - and is an ideal choice for those looking to explore heritage while indulging in decadent favourites. Alongside the Ramadan editions, Ecole Ducasse Abu Dhabi Studio has a packed roster of programmes including Emirati cooking experiences, where you can explore modern and traditional cuisine from across the Emirates; classes on pasta-making and perfecting the French brunch; and dedicated dessert courses for those with a sweet tooth. Those wishing to step-up their game can take on intensive programmes focused on mastering culinary essentials or opt for a three-day professional masterclass, while younger chefs aged six and above can take part in specialised classes to gain independence and sharpen their skills.Ecole Ducasse Abu Dhabi Studio is part of a network of culinary academies created by chef Alain Ducasse - there are outposts across the globe, including India, Thailand, France and the Philippines. Book nowRelated StoriesNEWS, CULTUREJun 04, 2024 | 7 min readSpotlight: Digital Artist Silvia BadalottiNEWS, CULTUREOct 06, 2023 | 3 min readHaute Hangouts: Rüya, DubaiNEWS, CULTURENov 02, 2023 | 13 min readDubai Design Week: Five Regional Creatives On Paying Homage To HeritageNEWS, CULTUREJul 15, 2024 | 6 min read8 New Books To Add To Your Summer Reading ListNEWS, CULTUREMar 16, 2024 | 2 min readHaute Hangouts: Char, W Muscat, Oman"
