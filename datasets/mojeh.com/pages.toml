description = "From regional designers to archival gowns, these are the best fashion moments from the SAG Awards red carpet"
full_description = "Related StoriesNEWS, FASHIONJun 07, 2023 | 1 min readElle Fanning Is Cartier's New It GirlNEWS, FASHIONAug 25, 2023 | 2 min readLouis Vuitton Launches The GO-14 BagNEWS, FASHIONJul 03, 2023 | 10 min readHow The Desire To Go Viral Has Transformed The Fashion Industry As We Know ItNEWS, FASHIONNov 06, 2023 | 5 min readTen Minutes With Designer Roksanda IlinčićNEWS, FASHIONOct 16, 2023 | 2 min readDesigner Dara Hamarneh On Sustainability, Style And Savoir-Faire The Best Fashion Moments From The 2025 SAG AwardsNEWS, FASHIONFeb 24, 2025 | 2 min readFrom regional designers to archival gowns, these are the best fashion moments from the SAG Awards red carpetThe SAG Awards celebrate outstanding performances in film and television and winners are decided by voting members of the SAG-AFTRA, making the recognition all the more momentous. This season, front-runners included Shōgun and Wicked, with five nominations apiece. Though the latter unfortunately ended the evening empty handed, Shōgun was awarded four trophies including Outstanding Performance by a Female Actor in a Drama Series for Anna Sawai's performance. Elsewhere, Demi Moore was awarded Outstanding Performance by a Female Actor in a Leading Role for her performance in The Substance, while Zoe Saldaña took home the Supporting Actress trophy and Selena Gomez won the Comedy Ensemble award for Only Murders in the Building.Trophies aside, there was plenty to celebrate on the red carpet. From Selena Gomez channelling Old Hollywood in Celine to Leighton Meester in Elie Saab and Keke Palmer in archival Chanel, these are MOJEH's favourite red carpet looks from the evening.Selena Gomez in CelineMonica Barbaro in DiorImage courtesy of DiorLeighton Meester in Elie SaabCynthia Erivo in GivenchyKeke Palmer in ChanelJessica Williams in RodartePamela Anderson in DiorImage courtesy of DiorZoe Saldaña in Saint LaurentAriana Grande in LoeweMillie Bobby Brown in Louis VuittonQuinta Brunson in DiorImage courtesy of DiorKaitlyn Dever in Elie SaabJoey King in Miu MiuAlycia Debnam-Carey in DiorImage courtesy of DiorDanielle Deadwyler in Louis VuittonElle Fanning in LoeweAnna Sawai in Armani PrivéSofia Carson in Elie SaabRelated StoriesNEWS, FASHIONJun 07, 2023 | 1 min readElle Fanning Is Cartier's New It GirlNEWS, FASHIONAug 25, 2023 | 2 min readLouis Vuitton Launches The GO-14 BagNEWS, FASHIONJul 03, 2023 | 10 min readHow The Desire To Go Viral Has Transformed The Fashion Industry As We Know ItNEWS, FASHIONNov 06, 2023 | 5 min readTen Minutes With Designer Roksanda IlinčićNEWS, FASHIONOct 16, 2023 | 2 min readDesigner Dara Hamarneh On Sustainability, Style And Savoir-Faire"
