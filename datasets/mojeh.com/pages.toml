["https://mojeh.com/culture/news/10-business-lunches-to-entertain-in-style"]
title = "10 Business Lunches To Entertain In Style | MOJEH"
description = "Whether you're searching for quick-and-easy meals or a lazy lunch accompanied by bottomless grape, these business lunches will help you seal the deal"
full_description = "Related StoriesNEWS, CULTURENov 01, 2023 | 6 min readExhibition Of The Month: Only Life, Myriad Places By Sudarshan ShettyNEWS, CULTUREFeb 02, 2024 | 3 min readHaute Hangouts: Attiko, W Dubai Mina SeyahiNEWS, CULTUREJul 09, 2024 | 2 min readAssouline's New Coffee Table Book Celebrates The Beauty Of AlUlaNEWS, CULTUREJan 02, 2024 | 2 min readExhibition Of The Month: The Time Is Now By Hazem HarbNEWS, CULTUREMay 04, 2024 | 3 min readHaute Hangouts: La Dame de Pic, One&Only One Za'abeel 10 Business Lunches To Entertain In StyleNEWS, CULTUREFeb 23, 2025 | 5 min readWhether you're searching for quick-and-easy meals or a lazy lunch accompanied by bottomless grape, these business lunches will help you seal the dealThe Artisan, Waldorf Astoria DIFC A slice of serenity in the heart of DIFC, The Artisan offers a laid-back yet luxurious afternoon of Mediterranean flavours. Beginning with antipasti, the meal unfolds with a choice of prawn pasta, eggplant parmigiana or pan-seared salmon, before culminating in a decadent chocolate and custard cake. Book nowSushisamba, St. Regis Dubai The PalmDubai’s diners can’t get enough of Sushisamba (just ask the restaurant’s most famous frequenter, His Highness Sheikh Hamdan), and the Vivo business lunch offers another excuse to indulge in its award-winning Peruvian-Japanese cuisine. The three-course menu includes a soup, two small plates and a main course - don’t miss the salmon seviche and the black cod. Book nowCOYA Dubai, Four Seasons Resort Dubai at Jumeirah BeachBeloved Peruvian haute spot, COYA Dubai, hosts an à la carte afternoon lunch during weekdays; find all the favourites from sea bream ceviche to chargrilled flank steak and mushroom rice hot pot, all served individually so you don’t have to worry about sharing with your colleagues. Book nowLa Dame de Pic, One Za'abeelIf you’re not able to visit La Dame de Pic for dinner (which, quite frankly, you should), then explore a taste of chef Anne Sophie Pic’s Michelin-starred mastery through its Sonate menu. Featuring Les Berlingots ASP, Chef Pic's signature pasta dish, business lunch at La Dame de Pic is a relaxed way to get acquainted with the famed chef’s cuisine. Book nowSierra by Covebeach, La Vie JBRIf escaping the office is on the agenda, why not go all-out and venture to the beach? The three-course offering at Sierra by Covebeach includes Greek salad with barrel-aged feta, king crab ravioli and salmon with lemon saffron butter, rounded-out with a decadent crème brûlée. On Fridays, stay behind and see out the sunset with pool and beach access. Book nowLPM Dubai, DIFCA visit to this Dubai institution is always a good idea, and better still if it’s to seek respite from a stressful workday. Garlic butter-drenched snails, delicate sea bream and veal osso buco all appear on the déjeuner d’affairs menu, which can be expanded to include a dessert or selection of grape, should you wish to make the meal that much sweeter. Book nowTapasake, One Za'abeelAn afternoon at Tapasake is an afternoon well spent thanks to panoramic views and elegant surrounds. A two-course curation atop The Link at One Za'abeel, Tapasake's Mediterranean-Japanese menu spans everything from salads and sushi to izakaya-style sharing plates. With the option to add a glass of grape, this is an easy-breezy business lunch perfect for Fridays. Book nowChic Nonna, DIFCChic Nonna celebrates the Italian tradition of long lunches with a hearty yet elevated offering inspired by homestyle cooking. Opening with tuna salad, eggplant and basil-topped pizzettas, and green pea soup, the afternoon flows into mains of ricotta and spinach cannelloni, pan-seared salmon with broccollini, and veal sirloin with lemon sauce. If you’ve got time to spare, opt for the additional dessert course and tuck into gelato or panna cotta with passionfruit puree. Book nowAvli by tashas, DIFCOn any weekday afternoon inside the airy Avli by tashas, you’ll find the restaurant full of happy diners feasting on Natasha Sideris’ menu of Greek-Mediterranean fare. Highlights include the red snapper crudo bathed in lemon dressing and jalapeño vinegar; kreatopita, lamb and beef mince parcels atop burnt tomato butter and yoghurt; chicken souvlaki with traditional trimmings; and a moussaka that is hearty yet doesn’t leave you feeling in need of a nap. Pro tip: the generous portions easily allow sharing, so order different dishes for the full experience. Book nowTamoka, Ritz Carlton JBRSettle in on the shore and enjoy a business lunch of Latin American flavours. Whether you’re opting for an all-business two-course combination or taking it easy with two hours of unlimited grape, Tamoka offers a picturesque break from the hustle and bustle. Book nowRelated StoriesNEWS, CULTURENov 01, 2023 | 6 min readExhibition Of The Month: Only Life, Myriad Places By Sudarshan ShettyNEWS, CULTUREFeb 02, 2024 | 3 min readHaute Hangouts: Attiko, W Dubai Mina SeyahiNEWS, CULTUREJul 09, 2024 | 2 min readAssouline's New Coffee Table Book Celebrates The Beauty Of AlUlaNEWS, CULTUREJan 02, 2024 | 2 min readExhibition Of The Month: The Time Is Now By Hazem HarbNEWS, CULTUREMay 04, 2024 | 3 min readHaute Hangouts: La Dame de Pic, One&Only One Za'abeel"
