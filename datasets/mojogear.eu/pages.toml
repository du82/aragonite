nheidsprijs / per Product is in bestelling. Let op: langere levertijd. Verkoper: Hohem Hohem iSteady V2S smartphone gimbal met AI-sensor en lampje Normale prijs €149,95 Aanbiedingsprijs €149,95 Normale prijs Eenheidsprijs / per Uitverkocht .section-template--24379915141501__product-description-padding { padding-top: 0px; padding-bottom: 16px; } @media screen and (min-width: 750px) { .section-template--24379915141501__product-description-padding { padding-top: 0px; padding-bottom: 32px; } } Gimbal kopen? Heb jij genoeg gehad van instabiele smartphone beelden? Dan is een Gimbal de tool voor jou. Een Gimbal is een smartphone-, GoPro-, of camerahouder die zichzelf stabiliseert. Hierdoor kan je onbezorgd de beste beelden schieten, overal waar je wil. Gimbals maken namelijk gebruik van slimme sensoren en motoren om ongewenste bewegingen tegen te gaan, ze kunnen zowel grote als kleine bewegingen tegenwerken. Door de handige telefoonhouder op de Gimbals, kan je eenvoudig je smartphone bevestigen op de Gimbal. Je Smartphone zit stevig vast, waardoor zelfs bij extreme sporten zoals Snowboarden of mountainbiken, je telefoon of GoPro veilig vast zit. Ben jij een vlogger of gewoon een enthousiaste hobbyist? Dan kan een Gimbal jouw beelden naar het volgende niveau brengen. Smartphone stabilizer Veel smartphones hebben een middelmatige camera stabiliseer functie, hierdoor kan je beeldmateriaal er erg onrustig uit zien. Hier komt de Gimbal erg goed van pas. De Gimbal zorgt er namelijk voor dat jij tijdens het filmen niet meer op de stabiliteit hoeft te letten. De Gimbal stabiliseert namelijk automatische alle bewegingen die je maakt. Dit doet doen Gimbals erg goed bij kleine trillingen, maar ook grotere bewegingen. Door de universele klemmen die op Gimbals zitten, zijn de Gimbals compatibel met elke telefoon tot 9 cm breed. Je kan de Gimbal dus gerust voor je iPhone of Samsung-telefoon gebruiken. Gimbal voor iPhone De nieuwe iPhones hebben vaak goede ingebouwde stabilisering voor hun smartphonecamera’s. Dan kan je je uiteraard afvragen waarom je een Gimbal zou kopen voor een nieuwere iPhone zoals de: iPhone 15, iPhone 14 of iPhone 13. Er zijn Gimbals die meer doen dan alleen je beelden stabiliseren, waardoor deze nog steeds van toegevoegde waarden zijn voor smartphones met goede beeldstabilisatie. Zo hebben de Hohem Isteady M6 & Hohem ISteady XE slimme A.I. gezichtstracking. Hierdoor kan je de Gimbal op een statief zetten, dan zal de Gimbal jouw gezicht automatisch volgen tijdens het filmen. Hierdoor zal je nooit meer per ongeluk uit beeld lopen tijdens het filmen. Multifunctionaliteit van Gimbals De hoofdfunctie van een Gimbal is uiteraard om je opnames te stabiliseren. Maar Gimbals hebben daarnaast ook nog andere functionaliteiten. Zo kan het simpelweg gebruikt worden als een compacte selfiestick. Maar een nog veel handigere functie van de Hohem ISteady M6 is de grote accu, waardoor deze ook gebruikt kan worden als powerbank voor je telefoon. Hierdoor ben je niet meer afhankelijk van de accu van je telefoon tijdens het opnemen. Gimbal mee op reis De smartphone Gimbals binnen ons assortiment zijn zowel compact als lichtgewicht. Ze wegen namelijk tussen de 300-600 gram. Hierdoor kan een Gimbal makkelijk mee in je rugzak tijdens een stedentrip of backpack-trip. De Gimbals vouwen ook op, hierdoor neemt het erg weinig ruimte in je tas, zodat je zelfs wanneer je prachtige nieuwe plekken aan het ontdekken bent, stabiele en rustige beelden kan schieten. Waar moet je op letten bij het kopen van een Gimbal? Het belangrijkste waar je op moet letten tijdens het kopen van een Gimbal is de compatibiliteit. Er zijn namelijk veel Gimbals die gemaakt zijn voor verschillende devices. Je hebt namelijk Gimbals voor Telefoons, maar ook Gimbals die specifiek gemaakt zijn voor camera’s of GoPro’s. Alle Gimbals bij MOJOGEAR zijn specifiek ontworpen voor smartphones. Daarnaast hebben Gimbals een maximaal gewicht wat ze kunnen dragen. Wanneer je een Gimbal wil gebruiken om je smartphone te stabiliseren, zal dit vaak geen probleem zijn. Echter is het wel altijd goed om op te letten. Wanneer je een Gimbal voor een camera wil gebruiken wordt dit een stuk relevanter. Ook is het belangrijk om er over na te denken hoe lang je graag wil filmen met de Gimbal, want Gimbals werken natuurlijk op een accu. Stel dat je erg lang achter elkaar op wil nemen, zonder op te laden, kan het gebeuren dat de accu leeg raakt. Zo heeft de Hohem ISteady XE een accuduur van 8 uur, terwijl de Hohem ISteady M6 een accuduur heeft van 18 uur. De Hohem ISteady M6 is uiteraard ook wat prijziger. Tenslotte moet je nadenken of je accessoires wil gebruiken in combinatie met je Gimbal. Je kan bijvoorbeeld op veel Gimbals een magnetisch lampje bevestigen, wanneer je wil filmen in het donker of simpelweg wat extra belichting nodig hebt voor je opnames. Gimbals in ons assortiment Bij MOJOGEAR hebben we de Gimbals van Hohem, hiervan hebben wij 5 verschillende Gimbals. Een reguliere Gimbal, de Hohem iSteady XE en een Gimbal kit waar een LED-lampje bij zit: Hohem iSteady XE Kit. Daarnaast hebben we ook premium uitvoeringen, dit zijn de Hohem Isteady M6 en Hohem ISteady M6 Kit. Tenslotte hebben we ook nog de Hohem ISteady V2S. Gimbals van Hohem Hohem maakt als sinds 2014 revolutionaire Gimbals. Door de slimme sensoren en motoren creëren de Hohem Gimbals erg stabiele en rustige beelden, zelfs wanneer je je op ruig terrein bevindt. De vernieuwende A.I. tracking is ook een van de beste op de markt, waardoor je altijd in beeld hebt, wat je wil filmen. 2 miljoen klanten in 140 verschillende landen hebben al een Hohem Gimbal aangeschaft. Heb je advies nodig over welke Gimbal het beste bij jou past, lees dan onze blog of neem contact op met onze klantenservice. #shopify-section-template--24379915141501__product-description h2 {font-size: 24px;}'
