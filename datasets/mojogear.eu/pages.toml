description = """
Keuzehulp camerabehuizingen

Verschillende soorten camerabehuizingen
Extra accessoires monteren
Welke behuizing kiezen


Welke soorten camerabehuizingen zijn er?

Cages
Met een camera cage kun je je camera set-up zowel beschermen als uitbreiden. Een cage beschikt namelijk over cold shoe-aansluitingen en/of meerdere 1/4” schroefaansluitingen, waarmee je extra accessoires snel en stevig kan bevestigen. Sluit bijvoorbeeld een externe microfoon aan voor een betere geluidskwaliteit of voeg wat meer licht toe. Cages zijn vaak ontworpen voor een specifieke camera zoals de cage voor GoPro Hero 9 & 10 op de afbeelding hiernaast. Zo sluit de cage perfect aan op je camera. Let er bij het kopen van een cage dus goed op of de cage om jouw apparaat past.
Wil je onder water beelden maken met een action cam of andere camera, dan heb je vaak een onderwaterbehuizing nodig. Onderwaterbehuizingen worden vaak gemaakt om je camera te beschermen tot een bepaalde diepte onder water. Maak je keuze dus op basis van hoe diep je gaat duiken en welke camera je gebruikt.
Rigs
Met een video rig maak jij stabiele beelden met een uitgebreide set-up. Een video rig is een telefoonhouder met twee handgrips en extra aansluitmogelijkheden. Die aansluitmogelijkheden zijn vaak cold shoe—mounts en 1/4 inch schroefgaten voor het gebruik van accessoires zoals een videolamp of microfoon. Met een rig kun je gemakkelijk en stabiel filmen vanuit de hand. Het zorgt voor extra grip en voorkomt instabiele beelden, wat je video een onprofessionele uitstraling geeft. Een rig kan ook gemonteerd worden op een statief, dankzij de 1/4” schroefaansluiting.
Beschermhoezen
Een beschermhoes beschermt je apparaat tegen krassen en stoten. Met een beschermhoes is je camera, laptop, tablet of telefoon beschermd tijdens gebruik, maar ook in je tas, rugzak of andere opbergplek.Beschermhoezen zijn op maat gemaakt voor een bepaald model. Zoals de Ulanzi iPhone 12 lens case. Daarnaast beschikken de Ulanzi iPhone cases over een lens mount, waardoor je eenvoudig een externe lens kan bevestigen. De hoezen in ons assortiment zijn gemaakt van stevig materiaal en kunnen worden bevestigd met een klik, klem of ritssysteem.
Extra accessoires
Met een rig, cage of stabilizer, zoals een gimbal, is het gemakkelijk om stabiele beelden te schieten. Met de juiste accessoires maak jij het jezelf echter nog makkelijker. Gebruik bijvoorbeeld een contragewicht voor je gimbal (zie afbeelding hiernaast) zodat jouw gimbal altijd in balans blijft als je veel accessoires of een zware smartphone gebruikt. Ga voor een snelle set-up en film gemakkelijk uit de hand met een grip. Een grip is ideaal omdat je er zowel een camera, GoPro als telefoonhouder, maar dus ook een behuizing op kunt monteren. Met de juiste accessoires zoals een klem, cold-shoe mount of telefoonhouder voeg jij de gewenste accessoires toe aan je behuizing zonder dat het in de weg zit. 
Welke camerabehuizing kopen?
Hopelijk geeft bovenstaande informatie je een beter beeld over de verschillende soorten camerabehuizingen en helpt het jou bij het maken van een passende keuze. Zo zijn er verschillende soorten behuizingen: cages, rigs en beschermhoezen. Wil jij je camera set-up graag uitbreiden en beschermen, kies dan voor een cage. Wil jij graag ook stabiele beelden maken? Dan is een video rig wellicht een betere keuze. Let daarnaast ook op het model camera of telefoon waarvoor de behuizing is gemaakt. We begrijpen dat je keuze ook afhangt van prijs, kwaliteit en dat je benieuwd bent naar de meningen van andere voordat je een aankoop doet. Kijk voor de mogelijkheden en lees de ervaring van anderen bij de behuizingen in ons assortiment.Bekijk alle behuizingen"""
