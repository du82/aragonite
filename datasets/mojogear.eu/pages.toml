full_description = "Fotograferen in de regen: Maak van een druilerige dag een meesterwerk Door calu luyck Delen Link kopiëren Je hebt zin om eropuit te gaan met je camera, maar dan... regen. Geen strakblauwe lucht, geen gouden zonsondergang, alleen maar grijs en nat. Teleurstellend? Echt niet. Regen zorgt voor reflecties, sfeervolle druppels en een filmachtige vibe. Dus trek je regenjas aan, bescherm je gear en ga op pad. We geven je enkele tips om een regenachtige dag om te zetten in toffe foto's. Bokeh fotografie met je smartphone Wat is bokeh en waarom wil je het? Misschien heb je de term bokeh ooit gehoord, misschien ook niet, maar je hebt het zéker ooit gezien. Bokeh is simpel: je... Lees meer Maak smakelijke kookfoto's en video's met je smartphone! Als je graag in de keuken staat én van content maken houdt, dan weet je dat eten er goed uit laten zien op foto of video net zo belangrijk is... Lees meer Fotograferen met een rookmachine Onze eigen fotografe Patricia nam de Ulanzi FM01 rookmachine mee om rook toe te voegen aan haar foto's. Lees haar ervaring en doe inspiratie op voor jouw eigen content. Lees meer"
