ce in de autocue leggen, de spiegel vergroot de letters en maakt deze makkelijk leesbaar vanaf een afstand. Hierdoor kan jij met een prompter focussen op het maken van de beste content, zonder hele a4’tjes tekst uit je hoofd te leren. Waarom een teleprompter? Je kan je afvragen waarom je een teleprompter nodig hebt. Je kan uiteraard gewoon gebruiken van tekst op een blaadje of op een ander scherm. Dit zal de kijker echter altijd doorhebben. Het valt namelijk op als je niet recht de camera in kijkt, maar steeds net ernaast. Het fijne aan een autocue, is dat je hier achter een camera of ander device kan bevestigen. Dit zit dan met de lens precies waar de prompter tekst laat zien, waardoor je recht in de camera kan kijken, terwijl je de tekst leest. Hierdoor zal de kijker niet doorhebben dat je de tekst voor je hebt, wat voor een prettigere kijkervaring zal zorgen. Soorten autocues Er zijn een hoop verschillende soorten autocues voor verschillende devices. Binnen het assortiment van MOJOGEAR hebben we autocues speciaal ontworpen om te gebruiken met smartphones, zoals de Ulanzi PT-15 en Ulanzi PT-16, maar ook universele autocues die voor zowel tablets als smartphones bedoeld zijn, zoals de Ulanzi RT02. Autocue/Teleprompter voor iPads Wanneer je op zoek bent naar een autocue voor een iPad, moet je letten op de afmetingen van de autocue. In de autocue zit namelijk een bepaald platform met daarboven een bepaalde spiegel die de letters reflecteert. Wanneer de iPad te groot is voor de teleprompter, zal de prompter de letters niet goed reflecteren en kan je de tekst niet goed lezen. Het kan ook zijn dat de iPad simpelweg niet in de autocue past. Zo kan de Ulanzi RT02 bijvoorbeeld gebruikt worden met tablets tot 15cm lang. Dit betekent dat deze bijvoorbeeld goed gecombineerd kan worden met een iPad mini, maar niet met een iPad Pro. Hierom moet je dus erg goed op de afmeting letten van je tablet bij het kopen van een autocue. Autocue voor telefoon De autocues in ons assortiment kan je vrijwel met alle smartphones gebruiken. Echter kan het geen kwaad om de afmetingen te checken. Waar je wel op moet letten bij het kopen van een autocue voor een telefoon, is de afstand waar de autocue op gaat staan. Omdat je gebruik maakt van een telefoon, zal het scherm een stuk kleiner zijn. Hierdoor zal je de autocue van langere afstanden niet kunnen lezen. Daarnaast zijn er buiten het assortiment van MOJOGEAR ook prompters die enkel bedoeld zijn voor tablets, hier kan je dan geen telefoon in stoppen. Autocue voor zangers Wil je zingen, maar vind je het lastig om al je teksten te onthouden? Dan kan je uiteraard ook gebruik maken van een autocue. De autocues van MOJOGEAR kunnen hier heel eenvoudig voor gebruikt worden. Om een autocue als zanger te gebruiken, zul je hier wel een speciale app op je tablet of telefoon moeten gebruiken. Dit komt natuurlijk omdat de tekstsnelheid bij een autocue voor zangers, zal verschillen in bepaalde stukken in het lied. Hierdoor kan je geen algemene autocue app gebruiken. Daarnaast zal je moeten denken aan waar je de autocue opzet. Waarschijnlijk wil je staand je lied opnemen. Hiervoor moet dan ook de autocue op hoofd-hoogte geplaatst worden. Hiervoor zou je bijvoorbeeld een statief kunnen gebruiken. Alle prompters van MOJOGEAR zijn voorzien van een ¼’’ schroefgat, waardoor deze op bijna statieven geplaatst kunnen worden. Hoe gebruik ik een autocue/teleprompter? Wanneer je iets wil op gaan nemen met een autocue heb je 2 dingen nodig. Een device waar de tekst op getoond kan worden en een opname device. Het device waar een tekst op getoond moet worden kan een tablet of een smartphone zijn. Het device waar je de opname mee wil maken kan een smartphone of camera zijn. Dan moet je een app of website uitzoeken, waar je de tekst op kan tonen. Stel dat je de autocue als zanger wil gebruiken zal je hier een speciale app voor nodig hebben. Anders kan je een van de vele gratis autocue apps gebruiken. Op deze app kan je dan een tekst inladen en een scroll snelheid instellen. Dan leg je de telefoon of tablet onder de reflecterende spiegel, zet je de opname aan op het andere apparaat en ben je ready to go! Autocue apps Om een autocue te gebruiken zul je gebruik moeten maken van een autocue app. Je moet namelijk een automatische scroll snelheid instellen. Gelukkig zijn er heel veel gratis apps in zowel de appstore als de play store. Typ simpelweg “autocue” app in en er zijn duizenden opties. Wil je liever niks downloaden op je telefoon of tablet? Er zijn ook verschillende autocues online. Dit zijn websites met dezelfde functionaliteit, zonder dat je deze hoeft te installeren. Een voorbeeld hiervan is: https://www.cueprompter.com/nl/. Deze website is ook compleet gratis en zeer eenvoudig om te gebruiken. Mocht je verder nog vragen hebben over een autocue of heb je advies nodig over welke autocue het beste past bij jouw situatie? Neem dan contact op met onze klantenservice. Zij helpen je graag verder! #shopify-section-template--24379915141501__product-description h2 {font-size: 24px;}'
