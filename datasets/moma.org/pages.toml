["https://moma.org/calendar/exhibitions/5742"]
title = "Otobong Nkanga: Cadence | MoMA"
description = "Exhibition. Through Jun 8. Otobong Nkanga has changed the way we understand the earth and our place in it. “Humans are only a small, minute part of the ecosystem,” the artist has said. “My works connect us to our shared histories, not just through land and geography, but through emotions shaped by events and encounters. These are the cadences of life.” Otobong Nkanga: Cadence presents a new commission by the artist: an all-encompassing environment of tapestry, sculpture, sound, and text that explores the turbulent rhythms of nature and society. Created specifically for MoMA’s Marron Family Atrium, the installation centers on a monumental, multi-paneled tapestry that suggests sprawling ecosystems and galaxies. Suspended along the highest wall of the Atrium, the large-scale tapestry features a kaleidoscopic range of natural and synthetic fibers created by the artist using innovative digital weaving techniques at the TextielLab in Tilburg, the Netherlands. Sculptures composed of dyed ropes, interwoven with hand-blown glass and ceramic forms, hang floor-to-ceiling alongside ceramic tablets imprinted with the artist’s poems. These diverse elements are brought together within an immersive sound work based on the voice and breathwork of the artist. Cadence confronts both the beauty and the degradation of the natural world—and its upheaval amid industrial and technological revolutions, resource extraction, and war. The monumental installation creates new ways of perceiving—and feeling—the massive shifts taking place in our time. As part of Cadence, two daylong performances will take place within the installation on Wednesday, April 23, and Sunday, April 27."
full_description = "Otobong Nkanga Cadence Through Jun 8 MoMA Exhibition MoMA, Floor 2, Atrium The Donald and Catherine Marron Family Atrium Otobong Nkanga has changed the way we understand the earth and our place in it. “Humans are only a small, minute part of the ecosystem,” the artist has said. “My works connect us to our shared histories, not just through land and geography, but through emotions shaped by events and encounters. These are the cadences of life.” Otobong Nkanga: Cadence presents a new commission by the artist: an all-encompassing environment of tapestry, sculpture, sound, and text that explores the turbulent rhythms of nature and society. Created specifically for MoMA’s Marron Family Atrium, the installation centers on a monumental, multi-paneled tapestry that suggests sprawling ecosystems and galaxies. Suspended along the highest wall of the Atrium, the large-scale tapestry features a kaleidoscopic range of natural and synthetic fibers created by the artist using innovative digital weaving techniques at the TextielLab in Tilburg, the Netherlands. Sculptures composed of dyed ropes, interwoven with hand-blown glass and ceramic forms, hang floor-to-ceiling alongside ceramic tablets imprinted with the artist’s poems. These diverse elements are brought together within an immersive sound work based on the voice and breathwork of the artist. Cadence confronts both the beauty and the degradation of the natural world—and its upheaval amid industrial and technological revolutions, resource extraction, and war. The monumental installation creates new ways of perceiving—and feeling—the massive shifts taking place in our time. As part of Cadence, two daylong performances will take place within the installation on Wednesday, April 23, and Sunday, April 27. Organized by Michelle Kuo, Chief Curator at Large and Publisher, with Elizabeth Wickham, Curatorial Assistant, Department of Painting and Sculpture, Helena Klevorn, Curatorial Assistant to the Chief Curator a