["https://moma.org/calendar/exhibitions/5746"]
title = "Christian Marclay: The Clock | MoMA"
description = "Exhibition. Through May 11. Encapsulating 100 years of moving-image history, Christian Marclay’s The Clock (2010) is a 24-hour montage composed from thousands of film and television clips depicting clocks and other references to time. James Bond checks his watch at 12:20 a.m.; Meryl Streep turns off an alarm clock at 6:30 a.m.; a pocket watch ticks at 11:53 a.m. as the Titanic departs. With each clip synchronized to the local time, The Clock collapses the fictional time presented on screen with the actual time of each passing minute. The work is both a cinematic tour-de-force and a functioning timepiece. Building on his background as a musician in Boston and New York’s underground scenes of the late 1970s and 1980s, Marclay has for five decades combined visual and sonic fragments to explore the complex relationships between image and sound. His resulting works have taken form across a wide range of mediums: sculpture, painting, photography, print, performance, and video. With the help of assistants searching for footage, Marclay spent three years meticulously editing <em>The Clock</em>—the culmination of his innovative approach to looking at the world anew through found material. The Clock speaks to cinema’s rich history as both a mirror of and escape from reality, a paradox that is ever more central to daily life in today’s era of instant broadcast, streaming services, and artificial intelligence. Marclay’s assemblage of carefully selected clips takes us on a journey through the past in order to heighten our awareness of an ever-elusive and unfolding present. By editing together fragments from cinema’s vast archive to tell the current time, Marclay reframes our collective memory of movies as an uncanny confrontation with ourselves. Visitor guidelines Due to limited seating capacity, entry to The Clock is not guaranteed. MoMA members receive priority access. Visitors may stay inside the exhibition as long as they like during open hours, but must rejoin the queue if they exit for any reason. Food and drink are not allowed, and we ask that visitors refrain from talking or using cell phones. The use of recording devices, including mobile phones, is strictly prohibited."
full_description = "Christian Marclay The Clock Through May 11 MoMA Exhibition MoMA, Floor 2, 212 Encapsulating 100 years of moving-image history, Christian Marclay’s The Clock (2010) is a 24-hour montage composed from thousands of film and television clips depicting clocks and other references to time. James Bond checks his watch at 12:20 a.m.; Meryl Streep turns off an alarm clock at 6:30 a.m.; a pocket watch ticks at 11:53 a.m. as the Titanic departs. With each clip synchronized to the local time, The Clock collapses the fictional time presented on screen with the actual time of each passing minute. The work is both a cinematic tour-de-force and a functioning timepiece. Building on his background as a musician in Boston and New York’s underground scenes of the late 1970s and 1980s, Marclay has for five decades combined visual and sonic fragments to explore the complex relationships between image and sound. His resulting works have taken form across a wide range of mediums: sculpture, painting, photography, print, performance, and video. With the help of assistants searching for footage, Marclay spent three years meticulously editing The Clock—the culmination of his innovative approach to looking at the world anew through found material. The Clock speaks to cinema’s rich history as both a mirror of and escape from reality, a paradox that is ever more central to daily life in today’s era of instant broadcast, streaming services, and artificial intelligence. Marclay’s assemblage of carefully selected clips takes us on a journey through the past in order to heighten our awareness of an ever-elusive and unfolding present. By editing together fragments from cinema’s vast archive to tell the current time, Marclay reframes our collective memory of movies as an uncanny confrontation with ourselves. Visitor guidelines Due to limited seating capacity, entry to The Clock is not guaranteed. MoMA members receive priority access. Visitors may stay inside the exhibition as long as they like during open hours, but must rejoin the queue if they exit for any reason. Food and drink are not allowed, and we ask that visitors refrain from talking or using cell phones. The use of recording devices, including mobile phones, is strictly prohibited. Organized by Stuart Comer, The Lonti Ebers Chief Curator of Media and Performance, and Erica Papernik-Shimizu, Associate Curator, Department of Media and Performance, with Abby Hermosilla, Curatorial Assistant, Department of Curatorial Affairs. I Spent 24 Hours Watching The Clock Christian Marclay’s video installation gives new meaning to “a day at the office.” Jason PersseJan 9, 2025 Clock Time Christian Marclay’s unprecedented work The Clock embodies our long history of trying to tame time. Jonathan CraryDec 16, 2024 Installation images 20 images This exhibition is made possible by MoMA's partner Richard Mille. Support for the exhibition is provided by the Annual Exhibition Fund. Leadership contributions to the Annual Exhibition Fund, in support of the Museum’s collection and collection exhibitions, are generously provided by Jerry I. Speyer and Katherine G. Farley, Sue and Edgar Wachenheim III, the Sandra and Tony Tamer Exhibition Fund, the Kate W. Cassidy Foundation, Alice and Tom Tisch, the Marella and Giovanni Agnelli Fund for Exhibitions, The Contemporary Arts Council of The Museum of Modern Art, Eva and Glenn Dubin, Mimi Haas, The David Rockefeller Council, Anne and Joel Ehrenkranz, Kenneth C. Griffin, The International Council of The Museum of Modern Art, Marie-Josée and Henry R. Kravis, and Jo Carole and Ronald S. Lauder. Major funding is provided by The Sundheim Family Foundation. Events The Clock 24-Hour Viewing Gallery experience Thu, Mar 20, 9:00 a.m. MoMA, Floor 2 The Clock 24-Hour Viewing Gallery experience Sat, Dec 21, 2024, 7:00 p.m. Sold out MoMA, Floor 2 Member Tickets for The Clock 24-Hour Viewing Gallery experience Sat, Dec 21, 2024, 7:00 p.m. Sold out MoMA, Floor 2 Member Previews: Christian Marclay: The Clock Gallery experience, for members Sat, Nov 9, 2024, 10:30 a.m.–7:00 p.m. MoMA, Floor 2 Fri, Nov 8, 2024, 10:30 a.m.–5:30 p.m. MoMA, Floor 2 Thu, Nov 7, 2024, 10:30 a.m.–5:30 p.m. MoMA, Floor 2 Show past events Artist Christian Marclay American and Swiss, born 195519 exhibitions, 25 works online Installation images How we identified these works In 2018–19, MoMA collaborated with Google Arts & Culture Lab on a project using machine learning to identify artworks in installation photos. That project has concluded, and works are now being identified by MoMA staff. If you notice an error, please contact us at [email protected]. Licensing If you would like to reproduce an image of a work of art in MoMA’s collection, or an image of a MoMA publication or archival material (including installation views, checklists, and press releases), please contact Art Resource (publication in North America) or Scala Archives (publication in all other geographic locations). MoMA licenses archival audio and select out of copyright film clips from our film collection. At this time, MoMA produced video cannot be licensed by MoMA/Scala. All requests to license archival audio or out of copyright film clips should be addressed to Scala Archives at [email protected]. Motion picture film stills cannot be licensed by MoMA/Scala. For access to motion picture film stills for research purposes, please contact the Film Study Center at [email protected]. For more information about film loans and our Circulating Film and Video Library, please visit https://www.moma.org/research/circulating-film. If you would like to reproduce text from a MoMA publication, please email [email protected]. If you would like to publish text from MoMA’s archival materials, please fill out this permission form and send to [email protected]. Feedback This record is a work in progress. If you have additional information or spotted an error, please send feedback to [email protected]."
