g. “Out of the way and off the beaten path” was how Barbara Mensch, then a young artist, described her maritime loft in the shadow of the Brooklyn Bridge. During the early 1980s Mensch, who was living in Soho, migrated south of Canal Street seeking an inexpensive place to live and work. Her widely regarded images have been the subject of numerous exhibitions, including at MoMA PS1, the Los Angeles Institute of Art, the Museum of The City of New York, Photokina, and many others. Mensch has published several books on New York’s legendary Fulton Market and downtown neighborhoods, including South Street (2007) In The Shadow Of Genius (2018), and A Falling Off Place: The Transformation of Lower Manhattan (2023). Jonathan D. Katz is an art historian, curator, and queer activist. A professor of practice in art history and gender, sexuality, and women’s studies at the University of Pennsylvania, Katz has curated many exhibitions, nationally and internationally, including Hide/Seek: Difference and Desire in American Portraiture at the Smithsonian National Portrait Gallery, which won several national and international best exhibition and book awards. The first full-time academic in the US to be tenured in what was then called lesbian and gay studies, Katz was also the founding director of Yale University’s lesbian and gay studies program, the first in the Ivy League. An activist academic, he also founded the Queer Caucus for Art of the College Art Association, cofounded Queer Nation, San Francisco, and cofounded the organization that successfully lobbied for queer anti-discrimination statutes in Chicago. He also is the president emeritus of the Leslie Lohman Museum for queer art in New York. Accessibility This theater is equipped with an induction loop that transmits directly to hearing aids with T-coils. Live CART captioning and American Sign Language (ASL) interpretation is available for public programs upon request with two weeks’ advance notice. MoMA will make every effor