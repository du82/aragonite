["https://moma.org/calendar/events/10292"]
title = "Open Art Space: Tote Bags and Printmaking | MoMA"
description = "Open Art Space is a relaxed, weekly, drop-in program for LGBTQ+ high school students and their allies who are interested in thinking about, and making, art in a creative and welcoming environment.  Design and take home your own MoMA tote bag in this two-part workshop, taking place on Thursday, February 27, and Thursday, March 6, at 4:30 p.m. Carve linoleum-cut stamps and pair them with mixed-medium techniques like stenciling, painting, and embellishing to design a tote that’s uniquely yours. Celebrate your individuality by reflecting on personal stories, identities, and artistic expression as you transform a MoMA tote into a one-of-a-kind work of art. This program is free and open to all high school–age participants. No previous art-making experience or registration is necessary.  Open Art Space meets every Thursday, from 4:30 to 6:30 p.m., at the Lewis B. and Dorothy Cullman Education and Research Building, located at 4 West 54 Street, near Fifth Avenue. Metrocards, snacks, and supplies will be provided. Email questions to momateens@moma.org or fill out our contact form. Accessibility The Lewis B. and Dorothy Cullman Education and Research Building entrance has a power-assist door. Seating options include chairs with backs. Gallery stools, wheelchairs, and rollators are available by request at all Museum entrances, on a first-come, first-served basis.  Accessible and all-gender restrooms are located in the mezzanine level of the Lewis B. and Dorothy Cullman Education and Research Building Guide dogs and other trained service animals are always welcome. American Sign Language (ASL) interpretation and live captioning (CART) are available for public programs upon request with two weeks’ advance notice. MoMA will make every effort to provide accommodation for requests made with less than two weeks’ notice. Please email momateens@moma.org or call (212) 333-6543 to make a request for these services."
