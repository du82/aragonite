["https://moma.org/calendar/exhibitions/5741"]
title = "Designer’s Choice: Norman Teague—Jam Sessions | MoMA"
description = 'Exhibition. Through May 11. What belongs in a museum, and who decides? How can we be more democratic in defining value? As a leading arbiter of taste, style, and form, The Museum of Modern Art played an instrumental role in shaping the history of modern design. Norman Teague invites us to reimagine the past by moving beyond "good modern design" as defined by institutions like MoMA. Drawing inspiration from artists and designers traditionally excluded from museums, and assisted by generative AI, he offers a reinterpretation of design history. These reimaginings—posters and full-scale prototypes shown alongside objects from MoMA’s collection—foreground makers of color and embody the cooperative, inventive spirit that guides Norman Teague Design Studios. Teague balances reverence for design innovation with an acknowledgment of the power dynamics that shaped it. With the rise of AI forcing a wholesale reevaluation of human creativity, he reminds us of the creative potential of inviting a diversity of voices into the chorus. As in a musical jam session, collaboration, respect, and improvisation bring us back to the question that sparks every act of imagination—the <em>what if</em>—inviting us to contemplate both the past and the future as realms of boundless possibility.'
full_description = '''Designer’s Choice Norman Teague—Jam Sessions Through May 11 MoMA Exhibition MoMA, Floor 1, 1 South What belongs in a museum, and who decides? How can we be more democratic in defining value? As a leading arbiter of taste, style, and form, The Museum of Modern Art played an instrumental role in shaping the history of modern design. Norman Teague invites us to reimagine the past by moving beyond "good modern design" as defined by institutions like MoMA. Drawing inspiration from artists and designers traditionally excluded from museums, and assisted by generative AI, he offers a reinterpretation of design history. These reimaginings—posters and full-scale prototypes shown alongside objects from MoMA’s collection—foreground makers of color and embody the cooperative, inventive spirit that guides Norman Teague Design Studios. Teague balances reverence for design innovation with an acknowledgment of the power dynamics that shaped it. With the rise of AI forcing a wholesale reevaluation of human creativity, he reminds us of the creative potential of inviting a diversity of voices into the chorus. As in a musical jam session, collaboration, respect, and improvisation bring us back to the question that sparks every act of imagination—the what if—inviting us to contemplate both the past and the future as realms of boundless possibility. Organized by Norman Teague with Paul Galloway, Collection Specialist, Department of Architecture and Design, The Museum of Modern Art. Co-curation by Michele Y. Washington. Design AI assistance by Daniel Overbey, poster design by Narineh Seferian, digital fabrication by Max Davis, design assistance by Mila Methvin, with studio assistance by Ana Sophia Baldas and Alissa Touranachun, Norman Teague Design Studios. Show Up and Play Norman Teague explains why design is better when more voices are added to the mix, and how to use AI like a DJ. Norman Teague, Paul GallowayOct 17, 2024 Playlist Listen to Norman Teague’s JAM SESSI