["https://moma.org/calendar/exhibitions/5774"]
title = "Light: Rafaël Rozendaal | MoMA"
description = "Exhibition. Nov 16, 2024–Spring 2025. “I always wanted to make work that could be seen by anyone, anywhere, anytime,” says Rafaël Rozendaal, an innovator in the realm of Internet-based art. Since the early 2000s, his vibrant animations have explored the aesthetic and conceptual possibilities of code, treating it as if it were paint. Because Rozendaal has chosen the Internet as his canvas, these works are accessible online by everyone. Each artwork starts as a storyboard sketched on paper, which is then translated into code and occupies only a handful of kilobytes. Its final form is an autonomous website powered by an algorithm that generates the animation in real time. Rozendaal’s practice unfolds within the visual possibilities of the browser, harnessing the flat yet multi-dimensional digital landscape. This installation presents a selection of his websites, each sampled for two to three minutes on a high resolution screen measuring nearly 25 feet across. From the start, these artworks were intended to be resolution-independent and robust enough to withstand the evolution of software and screens. Rozendaal’s goal is for us to experience a state of immersion so complete that it becomes one with our physical world. As he explains, “I imagine we will live in a world where there is no difference between a screen and any other surface.”"
full_description = "Light Rafaël Rozendaal Nov 16, 2024–Spring 2025 MoMA Exhibition MoMA, Floor 1, Garden Lobby The Agnes Gund Garden Lobby “I always wanted to make work that could be seen by anyone, anywhere, anytime,” says Rafaël Rozendaal, an innovator in the realm of Internet-based art. Since the early 2000s, his vibrant animations have explored the aesthetic and conceptual possibilities of code, treating it as if it were paint. Because Rozendaal has chosen the Internet as his canvas, these works are accessible online by everyone. Each artwork starts as a storyboard sketched on paper, which is then translated into code and occupies only a handful of kilobytes. Its final form is an autonomous website powered by an algorithm that generates the animation in real time. Rozendaal’s practice unfolds within the visual possibilities of the browser, harnessing the flat yet multi-dimensional digital landscape. This installation presents a selection of his websites, each sampled for two to three minutes on a high resolution screen measuring nearly 25 feet across. From the start, these artworks were intended to be resolution-independent and robust enough to withstand the evolution of software and screens. Rozendaal’s goal is for us to experience a state of immersion so complete that it becomes one with our physical world. As he explains, “I imagine we will live in a world where there is no difference between a screen and any other surface.” Organized by Paola Antonelli, Senior Curator, and Amanda Forment, Curatorial Assistant, Department of Architecture and Design. This exhibition is part of Hyundai Card Digital Wall. The Unbearable Lightness of Being Online MoMA visits Rafaël Rozendaal’s studio to talk digital abstraction, Disney cartoons, screensavers, and the beauty of unexpected sources. Paola Antonelli, Amanda Forment, Prudence Peiffer, Rafaël RozendaalDec 12, 2024 Installation images 14 images Interactive Explore the works in Light: Rafaël Rozendaal at home or on your device. Click to see these artworks in motion. Everything Always Everywhere Slow Empty Egg Alone Shape squeeze Many Moment Return Reverse Only Nothing Deep Blue Twisting and Turning Dive Non Either Half Half Half Large Shape Quadrant Melting Flood Pages Stereo Implosion Rooms Home Rio Clash Twist Stretch The exhibition is made possible by MoMA’s partner Hyundai Card. Artist Rafaël Rozendaal Dutch-Brazilian, born 19801 exhibition Installation images How we identified these works In 2018–19, MoMA collaborated with Google Arts & Culture Lab on a project using machine learning to identify artworks in installation photos. That project has concluded, and works are now being identified by MoMA staff. If you notice an error, please contact us at [email protected]. Licensing If you would like to reproduce an image of a work of art in MoMA’s collection, or an image of a MoMA publication or archival material (including installation views, checklists, and press releases), please contact Art Resource (publication in North America) or Scala Archives (publication in all other geographic locations). MoMA licenses archival audio and select out of copyright film clips from our film collection. At this time, MoMA produced video cannot be licensed by MoMA/Scala. All requests to license archival audio or out of copyright film clips should be addressed to Scala Archives at [email protected]. Motion picture film stills cannot be licensed by MoMA/Scala. For access to motion picture film stills for research purposes, please contact the Film Study Center at [email protected]. For more information about film loans and our Circulating Film and Video Library, please visit https://www.moma.org/research/circulating-film. If you would like to reproduce text from a MoMA publication, please email [email protected]. If you would like to publish text from MoMA’s archival materials, please fill out this permission form and send to [email protected]. Feedback This record is a work in progress. If you have additional information or spotted an error, please send feedback to [email protected]."
