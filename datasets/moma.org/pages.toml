ossible through the support of Bloomberg Philanthropies. Events Oyster Congregations Listening Session Workshop Fri, Mar 7, 5:30 p.m. MoMA Otobong Nkanga: Cadence Performance Wed, Apr 23, 10:30 a.m.–5:30 p.m. MoMA, Floor 2 Sun, Apr 27, 10:30 a.m.–5:30 p.m. MoMA, Floor 2 Writing Club at Home: Aimee Meredith Cox on Otobong Nkanga, Part Two Workshop Thu, Feb 27, 12:00–1:15 p.m. Online Mineral Color Workshop with Cara Marie Piazza Workshop Wed, Feb 26, 6:00–7:30 p.m. MoMA Writing Club: Aimee Meredith Cox on Otobong Nkanga, Part Two Workshop Tue, Feb 25, 7:00–8:30 p.m. MoMA, Floor 2 Cosmeage (Toiszo) Film Screening and Conversation Lecture/panel Sun, Feb 2, 1:00–2:30 p.m. MoMA Page to Practice: Artists in Conversation Lecture/panel Sun, Jan 26, 1:00–2:30 p.m. MoMA Drop-in Blackout Poetry Workshop Fri, Jan 17, 5:30–7:30 p.m. MoMA Neo-Carib Visions: Film Screening and Conversation Lecture/panel Sat, Jan 11, 1:00–2:30 p.m. Sold out MoMA, Mezzanine Eco-Dyeing with Plants Workshop Workshop Sat, Dec 14, 2024, 12:00–2:00 p.m. Education Center, Mezzanine Drop-in Seed Papermaking Workshop Fri, Dec 6, 2024, 5:00–7:00 p.m. MoMA, Floor 2 Mindful Mapping Workshop Workshop Sat, Nov 23, 2024, 12:00–1:30 p.m. MoMA, Floor 2 Writing Club at Home: Aimee Meredith Cox on Otobong Nkanga Workshop Tue, Nov 19, 2024, 12:00–1:15 p.m. Online Writing Club: Aimee Meredith Cox on Otobong Nkanga Workshop Thu, Nov 14, 2024, 8:00–9:45 a.m. MoMA, Floor 2 Morning at MoMA: Curator-led Tour and Breakfast Reception Gallery experience, for members Thu, Oct 10, 2024, 9:00–10:30 a.m. MoMA Show past events Artist Otobong Nkanga Nigerian-Belgian, born 19741 exhibition, 1 work online Installation images How we identified these works In 2018–19, MoMA collaborated with Google Arts & Culture Lab on a project using machine learning to identify artworks in installation photos. That project has concluded, and works are now being identified by MoMA staff. If you notice an error, please contact us at [email protected]. Li