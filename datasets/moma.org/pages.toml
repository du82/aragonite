["https://moma.org/calendar/exhibitions/5756"]
title = "Pirouette: Turning Points in Design | MoMA"
description = "Exhibition. Through Oct 18. Design is a fundamental element of life, an enzyme necessary to our evolution. It helps us cope with change and permeates our personal and social lives, embodying both our strengths and weaknesses. Many designers are intent on creating new behaviors, focusing on habits and circumstances most in need of change. Pirouette: Turning Points in Design features objects—from Post-Its to Spanx—that embodied experiments with new materials, technologies, and concepts; offered unconventional solutions to conventional problems; and had a deep impact both on design and the world at large. Drawn mostly from MoMA’s collection, some of the objects in this exhibition are readily recognizable—like the I ♥️ NY logo or the new Accessible Icon symbol—while others are known only to smaller audiences of fans and experts. Some, like Telfar’s Shopping Bag, dubbed the “Bushwick Birkin,” redraw the rules of exclusivity and luxury. Others, like the Walkman Portable Audio Cassette Player or the Macintosh 128K Home Computer, have changed and expanded our private space, allowing us to invite the world into our homes or to carry it with us. Seen together, the objects in Pirouette highlight the role of designers at their most inventive and constructive, and demonstrate the power of design to translate human experience into tangible forms and envision a better future."
full_description = "Pirouette Turning Points in Design Through Oct 18 MoMA Exhibition MoMA, Floor 3, 3 North The Philip Johnson Galleries Design is a fundamental element of life, an enzyme necessary to our evolution. It helps us cope with change and permeates our personal and social lives, embodying both our strengths and weaknesses. Many designers are intent on creating new behaviors, focusing on habits and circumstances most in need of change. Pirouette: Turning Points in Design features objects—from Post-Its to Spanx—that embodied experiments with new materials, technologies, and concepts; offered unconventional solutions to conventional problems; and had a deep impact both on design and the world at large. Drawn mostly from MoMA’s collection, some of the objects in this exhibition are readily recognizable—like the I ♥️ NY logo or the new Accessible Icon symbol—while others are known only to smaller audiences of fans and experts. Some, like Telfar’s Shopping Bag, dubbed the “Bushwick Birkin,” redraw the rules of exclusivity and luxury. Others, like the Walkman Portable Audio Cassette Player or the Macintosh 128K Home Computer, have changed and expanded our private space, allowing us to invite the world into our homes or to carry it with us. Seen together, the objects in Pirouette highlight the role of designers at their most inventive and constructive, and demonstrate the power of design to translate human experience into tangible forms and envision a better future. Organized by Paola Antonelli, Senior Curator, Department of Architecture and Design, and Director, Research and Development, with Maya Ellerkmann, Curatorial Assistant, Department of Architecture and Design. Pirouette: Turning Points in Design 14 audios One on One: Shigetaka Kurita’s Emoji Read an excerpt from the ongoing book series, about the humble origins of a ubiquitous, indispensable communication tool. Paul GallowayNov 27, 2023 UNIQLO ArtSpeaks Gilbert Baker’s Rainbow Flag How does a flag become a beacon for belonging and community? Jun 16, 2023 Flashback to 2015: MoMA Acquires the Rainbow Flag In celebration of Pride Month, read an interview from 2015 with the late Gilbert Baker, creator of the iconic Rainbow Flag. Michelle Millar Fisher, Paola AntonelliJun 2, 2023 @ at MoMA How do you “acquire” a symbol that’s been around for hundreds of years? In 2010 MoMA attempted to answer that question by adding the “@” symbol to the design collection. Paola AntonelliJan 18, 2023 Drawn to MoMA Ali Fitzgerald’s Iconic Discover how an artist who didn’t own a computer created the digital icons we still use today. Ali FitzgeraldOct 25, 2022 Tribute Milton Glaser: In Memoriam Paola Antonelli pays tribute to the design titan and quintessential New Yorker. Paola AntonelliJun 30, 2020 Visualizing Refuge In recognition of the 20th anniversary of World Refugee Day, artist Yara Said reflects on the flag she designed to signal survival, resilience, and agency. Arièle Dionne-KrosnickJun 18, 2020 Materials The Post-it We assess the stickiness of a little square of paper across departments at MoMA. Jennifer TobiasDec 23, 2019 Installation images 51 images Support for the exhibition is provided by the Annual Exhibition Fund. Leadership contributions to the Annual Exhibition Fund, in support of the Museum’s collection and collection exhibitions, are generously provided by Jerry I. Speyer and Katherine G. Farley, Sue and Edgar Wachenheim III, the Sandra and Tony Tamer Exhibition Fund, the Kate W. Cassidy Foundation, Alice and Tom Tisch, the Marella and Giovanni Agnelli Fund for Exhibitions, The Contemporary Arts Council of The Museum of Modern Art, Eva and Glenn Dubin, Mimi Haas, The David Rockefeller Council, Anne and Joel Ehrenkranz, Kenneth C. Griffin, The International Council of The Museum of Modern Art, Marie-Josée and Henry R. Kravis, and Jo Carole and Ronald S. Lauder. Major funding is provided by The Sundheim Family Foundation. The Bloomberg Connects digital experience is made possible through the support of Bloomberg Philanthropies. Publications The Rainbow Flag: Bright, Bold, and Beautiful Michelle Millar Fisher, 2019 Hardcover, 40 pages Shigetaka Kurita: Emoji By Paul Galloway, 2023 Paperback, 48 pages Events Family Art Workshop: Design Your Future Ages 6-9 Workshop, for kids Sat, Mar 8, 10:30 a.m.–12:30 p.m. Education Center, Floor 1 Sat, Mar 8, 1:30–3:30 p.m. Education Center, Floor 1 Sun, Mar 9, 10:30 a.m.–12:30 p.m. Education Center, Floor 1 + 5 more upcoming events Family Art Workshop: Design Your Future Workshop, for kids Sun, Feb 23, 10:30 a.m.–12:30 p.m. Education Center, Floor 1 Sat, Feb 8, 10:30 a.m.–12:30 p.m. Education Center, Floor 1 Family Art Workshop: Design Your Future Workshop, for kids Sat, Feb 22, 1:30–3:30 p.m. Education Center, Floor 1 Sat, Feb 22, 10:30 a.m.–12:30 p.m. Education Center, Floor 1 Sun, Feb 9, 1:30–3:30 p.m. Education Center, Floor 1 + 2 more past events Pirouette Abecedarium Lecture/panel Fri, Feb 21, 9:30 a.m. MoMA, Mezzanine Art inSight: Turning Points in Design Gallery experience, for visitors with disabilities Thu, Feb 20, 2:00–4:00 p.m. MoMA, Floor 1 Art inSight at Home: Turning Points in Design Gallery experience, for visitors with disabilities Tue, Feb 18, 6:00–7:30 p.m. Online Member Previews: Pirouette: Turning Points in Design Gallery experience, for members Sat, Jan 25, 10:30 a.m.–5:30 p.m. MoMA, Floor 3 Fri, Jan 24, 10:30 a.m.–8:30 p.m. MoMA, Floor 3 Show past events Artists Pioneer Dj by AlphaTheta 1 exhibition Alfonso Bialetti Italian, 1888–19702 exhibitions, 1 work online Jens Eilstrup Rasmussen Danish, born 19664 exhibitions, 1 work online Alamy Stock Photos 1 exhibition Grete Lihotzky Austrian, 1897–20006 exhibitions, 2 works online There are 118 artists in this exhibition online. Installation images How we identified these works In 2018–19, MoMA collaborated with Google Arts & Culture Lab on a project using machine learning to identify artworks in installation photos. That proj