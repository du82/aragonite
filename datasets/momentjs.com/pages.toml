["https://momentjs.com/timezone/guides"]
title = "Moment Timezone | Guides"
full_description = '''The guides area is designed to help developers learn to better interact with the date and time problem domain, and the Moment Timezone library. These guides are specifically limited to concepts around time zones and how they're handled by Moment Timezone. For more general date and time advice, see the core Moment.js guides. Time Zone vs Offset edit Frequently, people are confused about the difference between time zones and UTC offsets. The core Moment.js documentation has a guide on this topic that is worth reading first. Logically it belongs in the guides for Moment Timezone, but it predates this guide section by many years, and moving it would break a lot of links on the internet. For an in depth description of zones vs offsets, see the Stack Overflow tag. Moment Timezone enhances the core Moment.js functionality by using pre-compiled time zone data. This section describes where the data comes from, its limitations, and some quirks of real-world time zone rules. The technical details of the data format are described in the API documentation. Data Source edit All time zone data in Moment Timezone comes from the IANA Time Zone Database ("tzdb"). Moment Timezone consumes the default data directly from the tzdb, using only the published releases. The only changes the library makes are to convert the data to a custom JSON format, and optionally restrict how many years of data to use. Any pull requests that make changes to the compiled data files without being derived from a tzdb release will be rejected. If you think that the data used by Moment Timezone is incorrect, the ideal order of actions to follow is: Make sure you've upgraded to the latest version of the library. We try to closely track the tzdb releases, so upgrading Moment Timezone resolves most cases of out-of-date data. For data calculation problems, raise an issue in the Moment Timezone issue tracker. For other problems (such as creating a new zone definition), search the archives of the tzdb mailing list. It's probable that new data changes or zone definitions are already being discussed, but haven't made it to a published release yet. If there is nothing in the tzdb archives, send a message to the mailing list at [email protected].'''
year_published = 2012
clearnet = "https://momentjs.com/timezone/guides"
