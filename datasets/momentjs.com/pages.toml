["https://momentjs.com/timezone/docs"]
title = "Moment Timezone | Docs"
full_description = '''To use moment-timezone, you will need [email protected]+, moment-timezone.js, and the moment-timezone data. For convenience, there are builds available on momentjs.com/timezone/ with all the zone data or a subset of the data. moment-timezone-with-data.js is recommended for server environments (Node.js) and covers all years available. moment-timezone-with-data-10-year-range.js is recommend for most browser environments, covering +/- 5 years from the year published. moment-timezone-with-data-1970-2030.js covers a 60 year range, for those that need more data but not the larger file size of the full data file. If you use one of the above files, you still need moment.js, but you do not need moment-timezone.js because it is included. Node.js edit npm install moment-timezone In Node.js, all the data is preloaded. No additional code is needed for loading data. var moment = require('moment-timezone'); moment().tz("America/Los_Angeles").format(); In ECMAScript native module format (or in TypeScript): import moment from 'moment-timezone'; moment().tz("America/Los_Angeles").format(); Note: You don't need to require/import the base moment library as well. Moment Timezone will automatically load and extend the moment module, then return the modified instance. Package managers like npm and yarn can sometimes create situations where multiple versions of moment are installed. Importing only from moment-timezone can help ensure that the same version is used consistently. See this comment on issue #982 for a much more detailed explanation, including steps to fix potential versioning problems. // Unnecessary, can cause issues with package managers import moment from 'moment'; import 'moment-timezone'; // Correct import moment from 'moment-timezone'; The pre-built bundles are also included in the npm package, and can be loaded directly. These allow you to import the library with a smaller subset of data. import moment from 'moment-timezone/builds/moment-timezone-with-data-10-year-range.js'; // or .min.js You can also import just the library without any preloaded data. import moment from 'moment-timezone/moment-timezone.js'; // or .min.js moment.tz.load(customData);'''
