full_description = "I'm always thrilled to hear about classrooms that are using the book. If you have picked it up and we haven't chatted about it, I'd really love if you'd let me know. Since the book originally grew out of workshop-based teaching, it offers several easy-to-run activities. If you'd like the book to be stocked in the campus bookstore, just have them contact me at rob@robfitz.com and I'll arrange for the appropriate number of copies to be sent over. I can also print a special run of university-branded copies if you'd like to give them away at as a gift or at an extracurricular event (100 copy minimum). However, if you're teaching students in the developing world (or anyone else for whom its difficult to buy books), please let me know and we'll try to work out a way to offer free (or very steeply discounted) copies in exchange for a case study of how your students use it."
