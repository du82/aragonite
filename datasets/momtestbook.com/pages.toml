title = ""
full_description = "The quick and easy handbook about how to get more learning and more sales out of your customer conversations. Even when everyone is lying to you. Entrepreneurs are universally busy, yet odds are high that you’re wasting huge amounts of time sitting in pointless meetings and building unnecessary features. Take two hours to read this book and you’ll see it repaid tenfold. The world doesn’t need another framework or theory. The Mom Test skips all that and gets to the hands-on challenges. How to avoid biased feedback? How to write an email that makes people want to talk to you? How to figure out whether someone is really going to buy? It’s all in here. I’ve been an entrepreneur for 10 years, running both bootstrapped and VC-backed companies. I’m a YCombinator alum (summer ‘07), have raised funding in the US and UK, and have built products used globally by brands like Sony and MTV. I’m a programmer who was forced - like so many others - into a customer-facing role at my first company. And while I knew I was supposed to talk to customers, none of the books about sales or Customer Development seemed to help me figure out how to actually do it properly. The Mom Test is that missing handbook, and is now used as a core part of the curriculum at universities like Harvard and UCL, EU startup accelerators like Seedcamp and Microsoft Ventures, and businesses like Shopify and Pact Coffee. Learn how to talk to customers and get reliable, non-biased feedback on your business or product before it exists. The course covers all aspects of talking to customers, including where conversations go wrong, how to ask questions that provide real data, and how to transition into sales. Identify mistakes in your current process and build a simple, sustainable learning plan that you spread across your whole organization."
