description = "Archive of his syndicated column about international and British politics and issues, arranged by topic."
full_description = "Nigel Says Thanks By defending the UK’s draconian anti-protest laws, Labour is laying the ground for an authoritarian government. Non-Linear Trump’s assaults on governance could trigger systemic collapse. Here’s how it might happen, and how we can prepare. Broken Levers This is how Labour’s war on regulations will stymie its own policies. It is irrational and self-destructive. Cold Fanaticism and Intolerance of Dissent The UK government’s pursuit of growth at all costs hands this country to predatory capital. Homing Device Labour’s housing strategy makes a dysfunctional system bigger. We need systemic change. Motherfrackers Trump’s presidency is a reversion to autocratic tyranny. Only concerted resistance can stop it from spreading. Institutional Sexism State-sponsored rape, lies and deception – then a cover-up operating right across official life. Lords of the Desert These people are prepared to destroy everything, as long as they can command the ruins. The Reversion Trump’s win is a return to the default state of centralised, hierarchical societies – like ours. That’s the problem. How Bad Science Sticks A horrible illness has been widely neglected, thanks in part to the influence of a cruel and bizarre cult. Money Pit Hidden in the detail of the UK’s carbon capture and storage scheme are unlimited financial liabilities and huge environmental costs. Without Mercy Why do the mass killers of the fossil fuel industry walk free while the heroes trying to stop them are imprisoned? Cod Science An astonishing thing is happening at sea, but the government, backed by an entire “scientific” discipline, seems determined to stifle it. Soaked The bodies meant to protect us from floods are unaccountable, self-serving and feudal in character. No wonder they keep failing."
