full_description = "• der Nutzung der Softwareanwendung MoneyMoney, • der Verwendung unseres PSD2-Onlinedienstes, • beim Besuch unserer Website https://moneymoney-app.com und • bei der Kontaktierung unseres Kunden-Supports. Mit MoneyMoney können Sie auf die von Ihrer Bank bereitgestellten Kunden-Schnittstellen (FinTS/HBCI-Schnittstellen, Webseiten, öffentliche API-Schnittstellen) zugreifen, um Kontodaten, Salden und Umsätze abzurufen, sowie Zahlungsaufträge einzureichen. Die Kommunikation erfolgt dabei direkt zwischen Ihrem Endgerät und dem Bankserver, ohne dazwischengeschaltete Dienste. Die Datenspeicherung erfolgt ebenfalls lokal auf Ihrem Endgerät. MoneyMoney kommuniziert in regelmäßigen Abständen mit unserem Update-Server, um über neue Updates und aktuelle Servereinstellungen, die für die Verbindungen zu den Bankservern notwendig sind, informiert zu werden. Dabei erfasst unser Update-Server folgende Daten in einer Protokolldatei: Datum/Uhrzeit, IP-Adresse, verwendete Version der App, erhaltene Updates. Die protokollierten Daten werden nach sieben Tagen gelöscht. Rechtsgrundlage für die Datenverarbeitung ist unser berechtigtes Interesse gemäß Art. 6 Abs. 1f DSGVO an der Sicherstellung der Funktionsfähigkeit des Servers. Die europäische PSD2 (Payment Services Directive 2) hält Banken dazu an, eine Schnittstelle für autorisierte Dienstleister zur Verfügung zu stellen. Allerdings erlauben Banken ihren eigenen Kunden keinen direkten Zugang zu diesen PSD2-Schnittstellen. Wir haben uns deshalb bei der Bundesanstalt für Finanzdienstleistungsaufsicht (BaFin) als Dienstleister registrieren lassen, wodurch wir Nutzern von MoneyMoney einen indirekten Zugang zu den PSD2-Schnittstellen anbieten können. Das funktioniert wie folgt: Sobald Sie den PSD2-Onlinedienst in MoneyMoney mit Ihrer ausdrücklichen Zustimmung aktivieren, erfolgt die Kommunikation nicht mehr direkt zwischen Ihrem Endgerät und dem Bankserver, sondern über unseren dazwischengeschalteten PSD2-Onlinedienst."
year_published = 2025
clearnet = "https://moneymoney-app.com/privacy"
