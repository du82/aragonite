["https://moneymoney-app.com/directdebit"]
title = "MoneyMoney | Hilfe & FAQ"
description = "Schnelle Antworten auf wichtige Fragen zu MoneyMoney."
full_description = "Eine vergünstigte Version für Studierende ist auf Anfrage für 24,99 € erhältlich. Bitte Kopie der Immatrikulationsbescheinigung oder des Studentenausweises als E-Mail schicken. Sie erhalten dann einen Gutscheincode, den Sie beim Kauf einlösen können. Wenn Sie die Lizenz über unsere Homepage im Online-Shop der Cleverbridge GmbH erworben haben, gehen Sie bitte wie folgt vor: Geben Sie auf der Website https://www.cleverbridge.com/1041/?scope=cusecolp Ihre E-Mail-Adresse ein und lassen sich so eine Bestellübersicht zuschicken. In der E-Mail mit der Bestellübersicht können Sie auf die Bestelldetails klicken, um Ihren Lizenzschlüssel zu sehen. Wenn Sie eine Lizenz über den Mac App Store erworben haben, benötigen Sie keinen Lizenzschlüssel, da der Mac App Store das Lizenz-Management übernimmt. Sie können MoneyMoney aus dem Mac App Store über den Reiter »Gekaufte Artikel« herunterladen. Bitte ziehen Sie in diesem Fall die Demoversion in den Papierkorb und installieren Sie anschließend MoneyMoney aus dem Mac App Store über den Reiter »Gekaufte Artikel«. Banken betreiben zwei verschiedene Systeme: Einen Web-Server für das Web-Banking und einen FinTS/HBCI-Server für Finanzsoftware. Die beiden Systeme unterscheiden sich oft ein bisschen. Daher haben wir für Sie eine Liste mit Tipps und Hinweisen zur Kontoeinrichtung erstellt: https://moneymoney-app.com/banken Falls es trotzdem Schwierigkeiten bei der Kontoeinrichtung gibt, können Sie uns gerne eine E-Mail an support@moneymoney.app schreiben. Bitte teilen Sie uns den Namen der Bank und die Fehlermeldung mit. Es werden alle für das photoTAN-Verfahren, chipTAN-Verfahren oder Sm@rtTAN-Verfahren geeigneten TAN-Generatoren unterstützt. Um einen optischen TAN-Generator zu verwenden, kann im Überweisungsfenster im Auswahlfeld »Bestätigen mit« der Eintrag »photoTAN«, »Sm@rtTAN photo«, »chipTAN QR«, »chipTAN optisch« oder »Sm@rtTAN optisch« ausgewählt werden. Es werden alle für das chipTAN-Verfahren oder Sm@rtTAN-Verfahren geeigneten TAN-Generatoren unterstützt."
