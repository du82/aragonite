["https://moneymoney-app.com/sca"]
title = "MoneyMoney | Zwei-Faktor-Authentifizierung"
description = "Optimierungsmöglichkeiten bei der Zwei-Faktor-Authentifizierung (PSD2)"
full_description = "MoneyMoney kann Kontostände, Umsätze, Wertpapierbestände und PDF-Kontoauszüge von unterschiedlichen Systemen (FinTS-Server, HBCI-Server, API-Server, Website) abrufen. Werden beispielsweise die Umsätze des Girokontos von der FinTS/HBCI-Schnittstelle abgerufen, die Kreditkartenumsätze und PDF-Kontoauszüge hingegen von der Website, kann es vorkommen, dass für beide Systeme (FinTS/HBCI-Server und Website) bei derselben Bank zwei separate TAN-Eingaben erforderlich sind. Die folgenden Abschnitte zeigen Möglichkeiten auf, wie sich die Anzahl der Zwei-Faktor-Authentifizierungen minimieren lässt, ohne die Sicherheit zu beeinträchtigen. Einige Banken stellen PDF-Kontoauszüge nicht über die FinTS/HBCI-Schnittstelle zur Verfügung, weswegen diese nur von der Website abgerufen werden können. Die standardmäßige Einstellung »Monatsanfang« verhält sich wie folgt: Falls am Monatsanfang noch kein neuer Kontoauszug vorliegt, wird der Abruf täglich wiederholt, bis ein neuer Kontoauszug abgerufen werden konnte. Ein Abruf an einem Stichtag ist daher die bessere Wahl. Falls die PDF-Kontoauszüge von der Bank regelmäßig am ersten Werktag des Monats ins Postfach gestellt werden, sollte als Stichtag der 4. oder 5. gewählt werden. Einige Banken stellen Kreditkartenumsätze nicht über die FinTS/HBCI-Schnittstelle zur Verfügung, weswegen diese nur von der Website abgerufen werden können. Da sich die Umsatzliste des Kreditkartenkontos tagsüber in der Regel nicht ändert, genügt oftmals ein täglicher Abruf. Einige Banken stellen gar keine FinTS/HBCI-Schnittstelle zur Verfügung, weswegen die Umsätze nur von der Website abgerufen werden können. Oder die FinTS/HBCI-Schnittstelle verlangt bei jeder Anmeldung eine Zwei-Faktor-Authentifizierung. In diesen beiden Fällen kann es sinnvoll sein, den automatischen Umsatzabruf in den Einstellungen von MoneyMoney komplett zu deaktivieren: Dann kann man den Umsatzabruf zu einem passenden Zeitpunkt durchführen, an dem man gerade alle TAN-Generatoren zur Hand hat."
year_published = 2025
clearnet = "https://moneymoney-app.com/sca"
