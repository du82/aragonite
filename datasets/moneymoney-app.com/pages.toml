["https://moneymoney-app.com/security"]
title = "MoneyMoney | Sicherheit"
description = "Was macht MoneyMoney sicher und vertrauenswürdig?"
full_description = "Bei diesen Verfahren erfolgt die Datenübertragung direkt zwischen Ihrem Computer und dem Bankserver, ohne dazwischengeschaltete Dienste. Die Verbindung wird, ähnlich wie im Web-Browser, mit einer HTTPS-Verschlüsselung gesichert. Als zusätzliche Sicherheitsmaßnahme führt MoneyMoney ein SSL-Pinning durch. Dabei wird das SSL-Zertifikat des Servers neben der Überprüfung auf Gültigkeit zusätzlich noch gegen eine Whitelist abgeglichen. Wenn MoneyMoney das Zertifikat des Servers noch nicht kennt, wird Ihnen das Zertifikat zur Bestätigung angezeigt. Sie haben dann die Möglichkeit, den digitalen Fingerabdruck des Zertifikats mit den Unterlagen Ihrer Bank zu vergleichen, oder die Verbindung zum Server abzulehnen. Auch bei diesen Verfahren erfolgt die Datenübertragung direkt zwischen Ihrem Computer und dem Bankserver, ohne dazwischengeschaltete Dienste. Die Verbindung wird mit dem auf der Chipkarte bzw. in der Datei gespeicherten Schlüssel sowie einem Bankschlüssel abgesichert. Wenn MoneyMoney den Bankschlüssel des Servers noch nicht kennt, wird Ihnen der Bankschlüssel zur Bestätigung angezeigt. Sie haben dann die Möglichkeit, den Hashwert des Bankschlüssels mit den Unterlagen Ihrer Bank zu vergleichen, oder die Verbindung zum Server abzulehnen. Der PSD2-Onlinedienst kann in MoneyMoney mit Ihrer ausdrücklichen Zustimmung aktiviert werden. Dann erfolgt die Kommunikation nicht mehr direkt zwischen Ihrem Computer und dem Bankserver, sondern über unseren dazwischengeschalteten PSD2-Onlinedienst. Die Datenübertragung wird verschlüsselt. Unser Unternehmen ist als Zahlungsinstitut registriert und wird von der Bundesanstalt für Finanzdienstleistungsaufsicht (BaFin) beaufsichtigt und jährlich geprüft. Der Server unseres PSD2-Onlinedienstes befindet sich im Hochsicherheits-Rechenzentrum von Noris Network in Nürnberg. Ihre Zugangsdaten, Kontostände und Kontoumsätze speichert MoneyMoney in einer passwortgeschützten und verschlüsselten Datenbank auf Ihrer Festplatte. Die Datenbank ist dabei so sicher wie Ihr Datenbank-Passwort, da Ihr Passwort als Schlüssel für Ihre Datenbank verwendet wird. Wenn Sie bisher noch kein solches Datenbank-Passwort eingerichtet haben, können Sie das jederzeit nachholen: per Klick auf den Schlüssel oben links im Hauptfenster."
year_published = 2025
