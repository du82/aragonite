["https://moneymoney-app.com/applescript"]
title = "MoneyMoney | AppleScript"
description = "Automatisierung mit AppleScript"
full_description = 'Die Umsätze eines Kontos oder einer Kontengruppe können exportiert werden. Das Dateiformat und der Exportzeitraum sind konfigurierbar. Wenn kein Konto angegeben wird, werden alle Umsätze exportiert. Nach erfolgreichen Umsatzexport wird der Dateiname einer temporären Datei zurückgegeben, die zur Weiterverarbeitung geöffnet werden kann. tell application "MoneyMoney" set result to export transactions from account "DE67900900424711951500" from date "2017-01-01" to date "2017-12-31" as "csv" end tell tell application "Finder" open result as POSIX file end tell Mit dem zusätzlichen Parameter from category kann zusätzlich oder alternativ zum Konto eine Kategorie angeben werden. Anwendungsprogramme, die MoneyMoney zum Abgleich von Buchungen verwenden, können als Dateiformat auch den Wert »plist« angeben. Dann wird als Rückgabewert anstelle eines Dateinamens eine XML-Property-List ausgegeben. Mit dem bei macOS mitgelieferten Kommandozeilentool osascript kann AppleScript auch aus anderen Programmiersprachen heraus ausgeführt werden. Am Ende dieser Seite befindet sich dazu ein Beispiel für die Programmiersprache Python. Anwendungsprogramme, die MoneyMoney zum Abgleich von Buchungen verwenden, können sich eine Liste der verfügbaren Konten als XML-Property-List ausgeben lassen. Anwendungsprogramme, die MoneyMoney zum Abgleich von Buchungen verwenden, können sich eine Liste der verfügbaren Kategorien als XML-Property-List ausgeben lassen. Der Wertpapierbestand eines Kontos oder einer Kontengruppe lässt sich als XML-Property-List exportieren. Wenn kein Konto angegeben wird, wird der gesamte Wertpapierbestand exportiert. tell application "MoneyMoney" create bank transfer from account "DE67900900424711951500" to "Empfänger" iban "DE40900900424711951501" amount 100.00 purpose "Verwendungszweck" end tell Mit dem zusätzlichen Parameter into "outbox" kann die Überweisung im Ausgangskorb gespeichert werden, ohne dass sich ein Überweisungsfenster öffnet. tell application "MoneyMoney" create batch transfer from POSIX file "Sammelüberweisung.xml" end tell'
