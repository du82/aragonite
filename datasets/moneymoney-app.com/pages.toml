["http://moneymoney-app.com"]
title = "MoneyMoney: Online-Banking für den Mac"
description = "Alle Bankkonten im Blick mit MoneyMoney. Finden Sie heraus, wo Ihr Geld herkommt und wo es hingeht."
full_description = "Basisversion einmalig 39,99 € inkl. MwSt Erweiterungen als In-App-Kauf erhältlich Systemvoraussetzung Apple macOS 10.13 bis 15.3 Überweisungen, Umbuchungen, grafische Auswertung – MoneyMoney erspart die umständliche Anmeldung auf der Bank-Website. »Eine empfehlenswerte Banking-Software für den Mac ist MoneyMoney. […] Als praktisch und zeitsparend erweist sich die gute Integration der Software in das macOS und die Anbindung an andere Programme.« »Das Rundum-Sorglos-Programm für die private und berufliche Finanzverwaltung hält sämtliche Finanzen im Überblick und erlaubt auf benutzerfreundliche Weise das Führen eines Haushaltsbuchs.« »Unser ungeschlagener Banking-Favorit am Mac liefert einmal mehr solide Bestandskundenpflege ab, die mit verantwortlich für unsere anhaltende Kaufempfehlung der Finanz-Applikation ist.« Erstellen Sie Kategorien und Budgets für Ihre Umsätze. Legen Sie Kategorisierungs-Regeln an, um Ihre Umsätze automatisch kategorisieren zu lassen. Nutzen Sie Splitbuchungen, um Beträge auf mehrere Kategorien aufzuteilen. Geben Sie einen Suchbegriff ein oder schränken Sie den angezeigten Zeitraum ein. Die Suchergebnisse erscheinen sofort beim Tippen und die Summe steht unten in der Leiste. So finden Sie in Sekunden, was mit dem Browser ewig gedauert hätte. Mit einem Rechtsklick auf einen Umsatz können mit »Suche nach ...« die Umsätze mit dem gleichen Absender oder Empfänger angezeigt werden. Sehr praktisch, wenn man z.B. alle Telefonrechnungen auf einen Blick sehen will. Ersparen Sie sich die Portokosten oder den Weg zum Kontoauszugsdrucker: MoneyMoney kann die elektronischen Kontoauszüge als PDF-Dateien für Sie abrufen. Zusätzlich zum Verlauf können Sie aus jedem Ihrer Umsätze eine neue Überweisung machen. Wählen Sie dazu im Kontextmenü den Eintrag »Neu aus Auswahl«. Eine klassische Vorlagenverwaltung besitzt MoneyMoney natürlich auch. Sogar mit Platzhaltern im Verwendungszweck. Wie oft haben Sie eine E-Mail oder ein PDF bekommen, aus dem Sie dann umständlich Zeile für Zeile ins Onlinebanking kopiert haben?Mit MoneyMoney ist es viel einfacher …"
year_published = 2025
