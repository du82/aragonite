["https://moneymoney-app.com/categorization"]
title = "MoneyMoney | Kategorisierung"
description = "Automatische Kategorisierung von Umsätzen."
full_description = "Die automatischen Kategorisierung von Umsätzen ist über die Kategorie-Einstellungen konfigurierbar. Neu hinzugefügte Umsätze durchlaufen automatisch die Kategorisierungsregeln. Um einen Umsatz aus einer Kategorie zu entfernen, ordnen Sie diesem einfach die Standardkategorie »Unkategorisiert« zu. In dem Moment, in dem Sie die Kategorisierungsregeln ändern, fragt MoneyMoney nach, wie die geänderte Regel auf die bestehenden Umsätze angewendet werden soll. Es gibt dabei zwei mögliche Optionen: Brauchen nicht alle Wörter gleichzeitig im Text eines Umsatzes enthalten sein, können diese mit dem Operator OR verknüpft werden. Sollen alle Wörter gleichzeitig im Text eines Umsatzes enthalten sein, können diese mit dem Operator AND verknüpft werden. Beispiel: Kategorisiere alle Umsätze, die gleichzeitig sowohl das Wort »Lohn« als auch das Wort »Gehalt« enthalten. Mit dem Operator OR können Ausdrücke »oder«-verknüpft werden. Mit dem Operator AND können Ausdrücke »und«-verknüpft werden. Mit dem Operator NOT können Ausdrücke negiert werden. Teilausdrücke können mit ( ) geklammert werden. Beispiel: Kategorisiere alle Umsätze, die die Wort »Bücher« oder »eBooks« oder die beiden Wörter »Waren« und »Versand« enthalten. Beispiel: Kategorisiere alle Umsätze, die das Wort »EC-Karte«, aber nicht das Wort »Barauszahlung« enthalten. Werden mehrere Wörter in Anführungszeichen gesetzt, dann wird nach dieser Wortgruppe in der angegebenen Reihenfolge im Umsatztext gesucht. Beispiel: Kategorisiere alle Umsätze, die die Wörter »Bahn« und »AG« in genau dieser Reihenfolge enthalten Beispiel: Kategorisiere alle Umsätze, die den Wortanfang »Blumen« enthalten, um sowohl die Begriffe »Blumenerde« als auch »Blumentopf« zu finden. Mit dem Operator name: kann die Suche auf den Namen des Zahlungspflichtigen/Zahlungsempfängers eingeschränkt werden. Der Operator purpose: schränkt die Suche auf den Verwendungszweck ein, local_account: auf die Kontonummer/IBAN des eigenen Kontos, remote_account: auf die Kontonummer/IBAN des Gegenkontos, currency: auf die Währung, reference: auf die Ende-zu-Ende-Referenz, mandate: auf die Mandatsreferenz, creditor_id: auf die Gläubiger-ID, comment: auf die Notiz und booking_text: auf die Umsatzart."
