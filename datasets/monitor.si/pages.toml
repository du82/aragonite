["https://monitor.si/avtor/boris-savc"]
title = "Boris Šavc | Monitor"
full_description = "Umetnointeligenčnih klepetalnih robotov naenkrat ne izdelujejo le ameriška podjetja, ampak so jih začeli obvladati tudi Kitajci. Je to dobro ali slabo? Starine so lepe, a hkrati v sebi nosijo zgodbo. Vse na svetu je navdihnjeno s preteklostjo, z zgodovino, zato nam starine dajejo posebno energijo. Poleg užitka prinašajo tudi dobro naložbo. Kar je danes nekaj vredno, bo čez čas še vrednejše. Koliko, nam lahko razkrijejo naslednje aplikacije. Branje elektronskih knjig na napravah z Googlovim operacijskim sistemom Android je danes lažje kot kadarkoli prej. Od klasičnih romanov, sodobnih uspešnic do strokovne literature in stripov, številne aplikacije omogočajo prilagodljivo in prijetno bralno izkušnjo. Vse več programskih bralnikov e-knjig ponuja temni način, sinhronizacijo v oblaku, podporo za različne formate (EPUB, PDF) in celo branje brez povezave. Ker je na trgu vedno več tudi Android naprav iz elektronskega papirja, je skrajni čas, da tovrstno ponudbo aplikacij za branje pogledamo pobliže. Lagguy Wallpapers Zbirka ozadij visoke ločljivosti telefon odene v osebno krojene motive z globinskimi učinki novejših operacijskih sistemov iOS. Auto Answer Call Auto Answer Call samodejno sprejme klic, ko telefon približamo ušesu, in omogoča enostavno upravljanje klicev brez dodatnih pritiskov ali potegov po zaslonu. Mac računalniki so znani po svoji zanesljivosti, varnosti in oblikovni dovršenosti, a igranje z njimi dolgo ni bilo njihova močna stran. S procesorji M1, M2 in M3 pa se je stanje spremenilo, saj novejše jabolčne naprave omogočajo precej boljšo igralno izkušnjo. Zanjo je treba storiti nekaj ključnih korakov in računalnik z logotipom ugriznjenega jabolka bo hitro optimiziran za uživanje v igrah. Ljubitelji kave radi rečemo, da je tudi slaba skodelica nam ljube črne tekočine boljša kot nobena. Seveda vsi raje pijemo kakovosten zvarek, zato si pri kuhanju kave pomagamo z mobilnimi aplikacijami na telefonu iPhone. Jutra bodo takoj lepša!"
