["https://monitor.si/clanek/3d-tiskanje-je-tehnologija-prihodnosti/238072"]
title = "3D-tiskanje je tehnologija prihodnosti | Monitor"
description = "Tehnološke napovedi so vedno tvegane, a o stavku iz naslova niti malo ne dvomim. 3D-tiskanje ni muha enodnevnica, temveč konkretna, oprijemljiva tehnologija s prav takšnimi rezultati – izdelki, ki jih lahko vzamemo v roke, uporabljamo ali pa nekam vgradimo. Omejitev za 3D-tiskanje je iz leta v leto manj, saj vstopa na vedno nova področja. Ne le v industriji in domačem okolju, temveč celo v medicini, kjer se zdijo preboji pravzaprav na ravni filmov žanra znanstvene fantastike. Vsaj tako jaz gledam na 3D-tiskanje žil in celotnih organov."
full_description = "Monitor Pro Objavljeno: 28.1.2025 | Avtor: Miran Varga | Monitor Februar 2025 3D-tiskanje je tehnologija prihodnosti Tehnološke napovedi so vedno tvegane, a o stavku iz naslova niti malo ne dvomim. 3D-tiskanje ni muha enodnevnica, temveč konkretna, oprijemljiva tehnologija s prav takšnimi rezultati – izdelki, ki jih lahko vzamemo v roke, uporabljamo ali pa nekam vgradimo. Omejitev za 3D-tiskanje je iz leta v leto manj, saj vstopa na vedno nova področja. Ne le v industriji in domačem okolju, temveč celo v medicini, kjer se zdijo preboji pravzaprav na ravni filmov žanra znanstvene fantastike. Vsaj tako jaz gledam na 3D-tiskanje žil in celotnih organov. Na področju 3D-tiskanja se torej »dogaja«. Raziskovalci nenehno raziskujejo nove materiale in metode obdelave. 3D-tiskanje lahko ustvari poljubne oblike in notranje strukture izdelkov, ki jih je s klasičnimi obdelavnimi metodami nemogoče ali pa izjemno drago ustvariti. Že zato je de facto tehnologija prihodnosti. Na marsikaterem področju utegnejo klasične tovarne z obdelovalnimi stroji zamenjati tovarne s 3D-tiskalniki. Nekaj takšnih konceptov že deluje – celo navadni smrtniki lahko pošljemo 3D-načrt v tiskanje in prejmemo izdelek. A to še ni vse. 3D-tiskanje se vse bolj povezuje z drugimi tehnologijami v vzponu – z umetno inteligenco, robotiko in navidezno resničnostjo. Te povezave zagotavljajo učinkovitejše avtomatizirane proizvodne procese, hitro optimizacijo načrtovanja in oblikovanja izdelkov ter bolj natančno in kakovostno izdelavo prototipov ter končnih izdelkov. Omenjen nabor tehnologij je tudi osrednjega pomena za razvoj in izpopolnjevanje koncepta industrije 4.0. 3D-tiskanje prav tako pridobiva širino – vse več je tako naprednejših kot tudi cenovno dostopnejših oblik 3D-tiskanja na najrazličnejših področjih. Ta tehnologija bo v nekaj letih postala res dostopna in vsestranska. Bomo imeli 3D-tiskalnike kar doma? Zelo verjetno. Tisti pravi tehnični zanesenjaki jih imajo že danes. Za vzpon 3D-tiskanja je bolj kot strojna in programska oprema zaslužen razvoj materialov. Ne le plastične mase in smol, ampak tiskanje betona, kovin, keramike, kompozitnih in bioloških materialov premika meje. Dobesedno. 3D-tiskalniška preobrazba čaka gradbeništvo. Naši otroci bodo morebiti že živeli v 3D-natisnjenih hišah in stanovanjih. In potovali po 3D-natisnjenem svetu, saj bo 3D-tiskanje sčasoma omogočilo izdelavo »resne« infrastrukture, kot so mostovi, obloge predorov in jezovi. Arhitekti in oblikovalci so navdušeni, saj lahko 3D-tiskanje že danes uporabijo za izdelavo zapletenih in prilagojenih arhitekturnih elementov, vključno s fasadami, z ornamenti in s skulpturami. Tehnologijo, ki jo je včasih vodila želja po zmanjševanju stroškov, zdaj vodi prilagodljivost brez primere, že jutri pa utegne služiti tudi umetnosti. Na vseh področjih, tudi v gradbeništvu, saj 3D-tiskanje oblikovalce osvobodi nekaterih slogovnih omejitev, ki veljajo za druge proizvodne in gradbene tehnike. Prihodnje inovacije na področju materialov bodo vključevale pametne in funkcionalne materiale z vgrajenimi senzorji, aktuatorji in odzivnimi lastnostmi, značilnimi ne le za 3D-tiskanje, temveč tudi za 4D, kar bo omogočalo tiskanje pametnih naprav, nosljive elektronike in samosvojih funkcionalnih prototipov. A o tem več kdaj drugič."
