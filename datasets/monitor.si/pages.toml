description = "Leto je naokoli in spet so tukaj novi Samsungovi telefoni najvišjega razreda – Galaxy S25. Če ne štejemo procesorja, novosti ni veliko, pri modelu Ultra so Korejci naredili celo korak nazaj."
full_description = "Telefoni Objavljeno: 25.2.2025 | Avtor: Matej Šmid | Monitor Marec 2025 Brutalna moč in korak nazaj Leto je naokoli in spet so tukaj novi Samsungovi telefoni najvišjega razreda – Galaxy S25. Če ne štejemo procesorja, novosti ni veliko, pri modelu Ultra so Korejci naredili celo korak nazaj. To, da imajo Samsungovi (in ne le ti) novinci vsako leto nov, boljši in hitrejši procesor, je že običaj. Zadnjih nekaj let smo tudi Evropejci deležni procesorjev Qualcomm in tudi tokrat je tako – serija S25 ima vgrajen najnovejši procesor Snapdragon 8 Elite. Procesor je prvi iz nove generacije Qualcommovih, ki so nastali po nakupu podjetja Nuvia, iz generacije torej, ki že danes poganja celo prenosnike z Windows. Ne čudi torej, da je res izredno hiter, hkrati pa tudi dovolj varčen, da ob zmerni uporabi telefona dovolj dolgo tiktaka tudi v relativno majhnem telefonu S25 (brez oznake Plus ali Ultra), ki smo ga imeli na preizkusu. Zakup člankov Izbirate lahko med: Mesečni zakup ogledov člankov: 5,99 € Letna naročnina na spletni Monitor: 52,00 € Za plačilo lahko uporabite plačilno kartico ali PayPal ali Google Pay: Najprej se morate prijaviti. V kolikor še nimate svoje prijave, se lahko registrirate."
