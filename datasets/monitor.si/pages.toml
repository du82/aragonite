title = "Paradoks digitalne preobrazbe | Monitor"
description = "Zadnje leto se zdi, da vsi v IT (in širše) govorijo le še o umetni inteligenci, toda ob analizi trendov digitalne preobrazbe hitro postane jasno, da generativna umetna inteligenca in strojno učenje nista edini inovaciji, na kateri velja biti pozorni."
full_description = "Monitor Pro Objavljeno: 25.2.2025 | Avtor: Vinko Seliškar | Monitor Marec 2025 Paradoks digitalne preobrazbe Zadnje leto se zdi, da vsi v IT (in širše) govorijo le še o umetni inteligenci, toda ob analizi trendov digitalne preobrazbe hitro postane jasno, da generativna umetna inteligenca in strojno učenje nista edini inovaciji, na kateri velja biti pozorni. Ponovimo, kaj digitalna preobrazba sploh je. To je proces uvajanja digitalnih tehnologij za ustvarjanje ali spreminjanje poslovnih procesov ter omogočanje pozitivnih sprememb znotraj in zunaj podjetij. Podjetje ali organizacija lahko preide na tehnologije v oblaku, s čimer poenostavi shranjevanje podatkov in omogoči zaposlenim dostop do informacij od koderkoli. Ta prehod lahko izboljša tudi storitve za stranke, saj omogoča hitrejše odzivanje in bolj tekoče sodelovanje z zunanjimi partnerji. Skratka, digitalna preobrazba s tehnologijo zasleduje organizacijske oziroma poslovne cilje. V praksi je zato pogosta napaka, ko podjetja digitalno preobrazbo prevalijo zgolj na pleča zaposlenih v oddelku IT, saj ti nujno ne poznajo vseh poslovnih skrivnosti oziroma recepta za uspeh – kako bi ga torej lahko nadgradili? Zakup člankov Izbirate lahko med: Mesečni zakup ogledov člankov: 5,99 € Letna naročnina na spletni Monitor: 52,00 € Za plačilo lahko uporabite plačilno kartico ali PayPal ali Google Pay: Najprej se morate prijaviti. V kolikor še nimate svoje prijave, se lahko registrirate."
