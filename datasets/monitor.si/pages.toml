["https://monitor.si/avtor/jure-forstneric"]
title = "Jure Forstnerič | Monitor"
full_description = "Steelseries je med bolj znanimi imeni za igričarsko periferijo, podjetje ima v svojem naboru vse od tipkovnic in mišk do igralnih ploščkov ter slušalk. Med zadnjimi smo preizkusili model srednjega razreda. Odkar sem v IT, poslušam, kako evropska informatika zaostaja za konkurenco – predvsem za Američani. Pa je to res? Zasloni OLED so se v zadnjih letih začeli širiti po prodajnih katalogih prodajalcev prenosnih računalnikov. Danes jih najdemo tudi že v modelih srednjega cenovnega razreda. To velja tudi za tokrat preizkušeni Lenovo IdeaPad Pro 5, kjer je OLED eden glavnih prodajnih adutov – ni pa edini. Zakaj bi se s telefonom v roki med različnimi možnostmi tehnične pomoči prebijali s številčnimi tipkami, če nam že leto in več iz vseh por mezi umetna inteligenca, mar ne? Med pisanjem (ali branjem) člankov o priporočenih namiznih računalniških sestavah hitro pridemo do ugotovitve, da se velja v ločenem članku poglobiti v stanje na trgu namizne računalniške opreme. Torej, kje smo in kam gremo. V prejšnji številki smo pisali o priporočenih sestavah za nekoga, ki bi želel sestaviti igričarski PC po svoji izbiri. Tokrat se selimo še k domačim uporabnikom: spet predstavljamo tri priporočene sestave glede na zmogljivost in cenovni razred. Namesto podrobnega pregleda komponent vsako leto podamo splošne napotke za sestavo novega igričarskega računalnika. Tudi tokrat smo pripravili tri primere. Posebnost nove Huaweijeve tablice MatePad 11.5 S je zaslon, ki naj bi bil po občutku in videzu nekoliko bliže papirju, kot so sicer zasloni na tablicah in pametnih telefonih. Po službeni dolžnosti podjetjem predstavljam, kaj lahko počnejo z orodji umetne inteligence, poslušalci pa mi pogosto vračajo z opazkami, kako naj bi bila ta tehnologija slaba in nevarna za človeštvo. Pred približno 25 leti sem (prvič) prebral roman Veliki Gatsby ameriškega pisatelja Francisa Scotta Fitzgeralda. Jay Gatsby je prototip kulta osebnosti, ki ga danes pooseblja Elon Musk."
