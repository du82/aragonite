["https://monitor.si/clanek/izzivi-digitalne-preobrazbe-ostajajo/238911"]
title = "Izzivi digitalne preobrazbe ostajajo | Monitor"
description = "Drži, da je pandemija pospešila vlaganja v svet IT, da smo lahko delali in se izobraževali na daljavo. Nekaj od teh navad smo ohranili še danes. Torej smo sebi in drugim dokazali, da se spremembe da uvesti. Ampak zdi se mi, da se hitro vračamo na stara pota, vsaj kar zadeva digitalno preobrazbo. Pravilno smo postavili en košček, a mozaik je še velik."
full_description = "Monitor Pro Objavljeno: 25.2.2025 | Avtor: Miran Varga | Monitor Marec 2025 Izzivi digitalne preobrazbe ostajajo Drži, da je pandemija pospešila vlaganja v svet IT, da smo lahko delali in se izobraževali na daljavo. Nekaj od teh navad smo ohranili še danes. Torej smo sebi in drugim dokazali, da se spremembe da uvesti. Ampak zdi se mi, da se hitro vračamo na stara pota, vsaj kar zadeva digitalno preobrazbo. Pravilno smo postavili en košček, a mozaik je še velik. Zdaj je pred nami naslednja svetleča stvar, ki krade našo pozornost. Umetna inteligenca. Ki vsekakor je lahko del digitalne preobrazbe. Ni pa njen temelj. A kot da direktorji informatike in vodstva podjetij tega ne bi razumeli. Poglejte pri sebi – velik del proračuna za IT je verjetno usmerjen v implementacijo rešitev generativne umetne inteligence z razlago, da podjetje želi povečati učinkovitost, zmanjšati stroške ter dostopati do novih trgov in strank. Vse lepo in prav, a ne ubirajte bližnjic. Pri naložbah v nove tehnologije, kakršna je umetna inteligenca, je treba nujno upoštevati tri ključne izzive IT-okolij – varnost, tehnologijo in kadre. Zakup člankov Izbirate lahko med: Mesečni zakup ogledov člankov: 5,99 € Letna naročnina na spletni Monitor: 52,00 € Za plačilo lahko uporabite plačilno kartico ali PayPal ali Google Pay: Najprej se morate prijaviti. V kolikor še nimate svoje prijave, se lahko registrirate."
