["https://monitor.si/clanek/med-podporo-umetni-inteligenci-in-prepovedjo-telefonov/238867"]
title = "Med podporo umetni inteligenci in prepovedjo telefonov | Monitor"
description = "V Arizoni bo na eni od zasebnih šol umetna inteligenca prevzela individualizirano poučevanje šolskih predmetov in sprotno prilagajanje učnega načrta. Ti predmeti bodo na programu dve uri na dan, preostali del dneva pa bodo učenci, stari od devet in do 14 let, ob pomoči pedagoško usposobljenih mentorjev razvijali spretnosti, kot so finančno opismenjevanje, javno nastopanje, podjetništvo itd. Šola torej ni ravno običajna."
full_description = "Dosje Objavljeno: 25.2.2025 | Avtor: Tamara Harb | Monitor Marec 2025 Med podporo umetni inteligenci in prepovedjo telefonov V Arizoni bo na eni od zasebnih šol umetna inteligenca prevzela individualizirano poučevanje šolskih predmetov in sprotno prilagajanje učnega načrta. Ti predmeti bodo na programu dve uri na dan, preostali del dneva pa bodo učenci, stari od devet in do 14 let, ob pomoči pedagoško usposobljenih mentorjev razvijali spretnosti, kot so finančno opismenjevanje, javno nastopanje, podjetništvo itd. Šola torej ni ravno običajna. Ure personaliziranega pouka šolskih predmetov bodo izvajali ob pomoči programov organizacij, kot sta IXL Learning in Khan Academy. Za čim bolj prilagojeno poučevanje posameznemu učencu naj bi sistem umetne inteligence (UI) analiziral odgovore učencev, čas, ki ga porabijo za reševanje, in njihove čustvene odzive. Ta vizija jemlje moč iz rok učiteljev in jo polaga v roke tehnologije, s spojitvijo tehnoloških velikanov z ameriško vlado pa je nedvomno dobila pospešek. Čeprav se pri nas ni bati takšnih ultimativnih izkušenj izobraževanja, poučevanje brez učiteljev ni le ameriška izkušnja – že približno pol leta jo prakticirajo tudi na eni od zasebnih šol v Londonu, kjer umetna inteligenca učni načrt ravno tako povsem prilagodi posameznemu učencu na podlagi izkazanih prednosti in slabosti, ki jih zmore izluščiti. Zakup člankov Izbirate lahko med: Mesečni zakup ogledov člankov: 5,99 € Letna naročnina na spletni Monitor: 52,00 € Za plačilo lahko uporabite plačilno kartico ali PayPal ali Google Pay: Najprej se morate prijaviti. V kolikor še nimate svoje prijave, se lahko registrirate."
