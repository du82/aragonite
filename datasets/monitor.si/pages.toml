["https://monitor.si/avtor/bostjan-spetic"]
title = "Boštjan Špetič | Monitor"
full_description = "Na domače razvijalce mikroračunalnikov so vplivale tudi rešitve podjetja DEC. Po uspešnem zagonu terminalske proizvodnje so na začetku 80-ih let izvedbe mikroprocesorskih miniračunalnikov DEC MicroPDP-11 izdelovali v podjetju Kopa. Pomagali so jim sodelavci Instituta Jožef Stefan, ki so s 16-bitnim mikroprocesorjem DEC T-11 izdelali tudi svoj mikroračunalnik PMP-11. Po uspehu prvih bolj dostopnih in potrošniško usmerjenih mikroračunalnikov so ob prehodu v 80. nastali novi ceneni hišni mikroračunalniki. Proizvajalci so po zgledu igralnih konzol tu prvič več poudarka namenili grafiki, zvoku in zabavni programski opremi. Takšni hišni računalniki, primerni za zasebno uporabo, so se pri nas v večjem številu pojavili šele leta 1984. Koncept samogradnje je v mikroračunalništvu prisoten od samega začetka. S težnjo k ceneni izdelavi in zasebni uporabi je močno vplival na nastanek klasičnih hišnih računalnikov in oblikovanje značilne mikroračunalniške subkulture. S samogradnjo in z ljubiteljskim mikroračunalništvom so se pri nas resno začeli ukvarjati na začetku 80. let. Do začetka 80. let je postopno dozorela zmogljivejša vrsta poslovnega mikroračunalnika, ki je po pravilu vključevala disketne ali diskovne pogone in operacijski sistem CP/M. Vrhunec med domačimi mikroračunalniki te vrste predstavljata Partner podjetja Iskra Delta in nova osebna različica Dialoga, ki so jo za Gorenje razvili na Fakulteti za elektrotehniko. Mikroračunalništvo se od sredine 70. let naprej neprekinjeno razvija. Proizvajalci zasebni uporabi najprej niso posvečali posebne pozornosti. Priložnost za množično prodajo so videli zlasti v napravah za poslovno uporabo. Pri nas so prve poslovne mikroračunalnike izdelali na začetku 80., v državo pa so takrat uvozili tudi prve tuje naprave te vrste. Prvi mikroračunalniki so se pri nas pojavili sredi 70-ih. To so bili zelo preprosti računalniki s strojno in programsko opremo po meri. Uporabni so bili predvsem pri avtomatizaciji procesov v industriji in izvajanju poskusov v laboratorijih, nastopali so kot upravljalni deli različnih merilnih, nadzornih in regulacijskih naprav."
