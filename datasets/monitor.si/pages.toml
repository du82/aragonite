["https://monitor.si/avtor/miran-varga"]
title = "Miran Varga | Monitor"
full_description = "Drži, da je pandemija pospešila vlaganja v svet IT, da smo lahko delali in se izobraževali na daljavo. Nekaj od teh navad smo ohranili še danes. Torej smo sebi in drugim dokazali, da se spremembe da uvesti. Ampak zdi se mi, da se hitro vračamo na stara pota, vsaj kar zadeva digitalno preobrazbo. Pravilno smo postavili en košček, a mozaik je še velik. E-trgovina bo kmalu predstavljala četrtino vse maloprodaje, pri čemer več kot tretjina (37 odstotkov) potrošnikov spletne nakupe že opravlja tedensko. Novotarij in odprtih vprašanj v svetu CAD in CAM je čedalje več. A zdi se, da tudi konkretnih odgovorov ... Tehnološke napovedi so vedno tvegane, a o stavku iz naslova niti malo ne dvomim. 3D-tiskanje ni muha enodnevnica, temveč konkretna, oprijemljiva tehnologija s prav takšnimi rezultati – izdelki, ki jih lahko vzamemo v roke, uporabljamo ali pa nekam vgradimo. Omejitev za 3D-tiskanje je iz leta v leto manj, saj vstopa na vedno nova področja. Ne le v industriji in domačem okolju, temveč celo v medicini, kjer se zdijo preboji pravzaprav na ravni filmov žanra znanstvene fantastike. Vsaj tako jaz gledam na 3D-tiskanje žil in celotnih organov. Kaj bo prej množično razširjeno – brezpapirno poslovanje ali samovozeči avtomobili? Če bi sodili po trenutnem stanju, potem se zdi brezpapirno poslovanje prej uresničljiv ideal, saj ga je nekaterim podjetjem že uspelo doseči, povsem avtonomne vožnje, razen v precej natančno določenih pogojih in okoljih, pa pač še ne. Toda če hkrati pomislimo na to, da po svetu še vedno natisnemo okoli 50 bilijonov dokumentov letno, pa v to številko seveda niso všteti vsi časopisi, revije, navodila za uporabo izdelkov in cel kup drugih vsebin na papirju, je družba od vseprisotnega brezpapirnega poslovanja vendarle še zelo zelo daleč. Tiskanje je danes dinamična mešanica inovativnosti, trajnosti in na stranke osredotočenih rešitev. Ti trendi ne kažejo le tehnološkega napredka proizvajalcev tiskalnikov, temveč tudi njihovo globlje razumevanje potreb strank in okoljske odgovornosti."
