["https://monitor.si/clanek/mikroracunalniki-dec/238875"]
title = "Mikroračunalniki DEC | Monitor"
description = "Na domače razvijalce mikroračunalnikov so vplivale tudi rešitve podjetja DEC. Po uspešnem zagonu terminalske proizvodnje so na začetku 80-ih let izvedbe mikroprocesorskih miniračunalnikov DEC MicroPDP-11 izdelovali v podjetju Kopa. Pomagali so jim sodelavci Instituta Jožef Stefan, ki so s 16-bitnim mikroprocesorjem DEC T-11 izdelali tudi svoj mikroračunalnik PMP-11."
full_description = "Zgodovina Objavljeno: 25.2.2025 | Avtor: Boštjan Špetič | Monitor Marec 2025 Mikroračunalniki DEC Na domače razvijalce mikroračunalnikov so vplivale tudi rešitve podjetja DEC. Po uspešnem zagonu terminalske proizvodnje so na začetku 80-ih let izvedbe mikroprocesorskih miniračunalnikov DEC MicroPDP-11 izdelovali v podjetju Kopa. Pomagali so jim sodelavci Instituta Jožef Stefan, ki so s 16-bitnim mikroprocesorjem DEC T-11 izdelali tudi svoj mikroračunalnik PMP-11. Svoje prve mikroprocesne enote so v podjetju DEC začeli razvijati že v zgodnjih 70. letih skupaj s podjetjem Western Digital. V tehnologiji obsežnih integriranih vezij (MOS LSI) so najprej izdelali mikroprocesno enoto LSI-11, enakovredno njihovim klasičnim 16-bitnim procesnim enotam PDP-11. Do konca 70-ih so v podjetju že v celoti sami izdelali mikroprocesno enoto LSI-11/23, ki je na treh integriranih vezjih posnela ustroj klasične procesne enote PDP-11/34 (Delta 340). Mikroprocesno enoto LSI-11/23 so najprej uporabili v miniračunalniku PDP-11/24 (Delta 400). Na začetku 80-ih pa so izdelali še bolj zmogljivo mikroprocesno enoto LSI-11/73, ki je na dveh integriranih vezjih posnela ustroj največje klasične procesne enote PDP-11/70 (Delta 700). Zamenjavo klasične enote z mikroprocesno so za svoj miniračunalnik Delta 800 načrtovali tudi v domači Iskra Delta, vendar projekta niso uresničili. Zakup člankov Izbirate lahko med: Mesečni zakup ogledov člankov: 5,99 € Letna naročnina na spletni Monitor: 52,00 € Za plačilo lahko uporabite plačilno kartico ali PayPal ali Google Pay: Najprej se morate prijaviti. V kolikor še nimate svoje prijave, se lahko registrirate."
