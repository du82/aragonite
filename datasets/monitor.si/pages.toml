description = "Marku Zuckerbergu, direktorju podjetja Facebook (zdaj Meta), so leta 2016 gorela tla pod nogami. Po ameriških volitvah, na katerih je prvič zmagal Donald J. Trump, so se namreč po vsem svetu pojavile kritike vloge dezinformacij v predvolilni kampanji. Družabna omrežja s Facebookom na čelu so po ocenah analitikov in politikov odigrala eno glavnih vlog pri nenadzorovanem širjenju nepreverjenih trditev in laži po spletu."
full_description = "Dosje Objavljeno: 25.2.2025 | Avtor: Domen Savič | Monitor Marec 2025 Hopla, kaj pa, če je vse res? Marku Zuckerbergu, direktorju podjetja Facebook (zdaj Meta), so leta 2016 gorela tla pod nogami. Po ameriških volitvah, na katerih je prvič zmagal Donald J. Trump, so se namreč po vsem svetu pojavile kritike vloge dezinformacij v predvolilni kampanji. Družabna omrežja s Facebookom na čelu so po ocenah analitikov in politikov odigrala eno glavnih vlog pri nenadzorovanem širjenju nepreverjenih trditev in laži po spletu. Zuckerberg se je najprej odločno branil, da je to neumnost. »Šlo je za izredno majhen del vsebin in domneva, da smo s tem spremenili volitve, se mi zdi nora,« je po zaključku ameriških predsedniških volitev novembra 2016 izjavil Mark. »Če mislite, da so ljudje volili Trumpa samo zaradi dezinformacij, potem vam manjka empatije in razumevanja pravih razlogov za njegovo zmago,« je še dodal. Zakup člankov Izbirate lahko med: Mesečni zakup ogledov člankov: 5,99 € Letna naročnina na spletni Monitor: 52,00 € Za plačilo lahko uporabite plačilno kartico ali PayPal ali Google Pay: Najprej se morate prijaviti. V kolikor še nimate svoje prijave, se lahko registrirate."
