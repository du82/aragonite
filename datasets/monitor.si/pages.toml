title = "Pisarna je mrtva, naj živi Copilot! | Monitor"
description = "Nekoč je obstajal Microsoft, ki je kupil 86-DOS, ga preimenoval v MS-DOS in obogatel. Danes preimenuje in postopoma ukinja blagovno znamko Office, verjetno z istim ciljem. Pa mu bo uspelo?"
full_description = "Uvodnik Objavljeno: 25.2.2025 | Avtor: Matjaž Klančar | Monitor Marec 2025 Pisarna je mrtva, naj živi Copilot! Nekoč je obstajal Microsoft, ki je kupil 86-DOS, ga preimenoval v MS-DOS in obogatel. Danes preimenuje in postopoma ukinja blagovno znamko Office, verjetno z istim ciljem. Pa mu bo uspelo? Microsoft je gigantsko tehnološko podjetje, svoje prste ima povsod – od programskih jezikov, prek poslovnih aplikacij in iger (Xbox!) do umetne inteligence. Da o izjemni količini podatkovnih centrov (Azure), ki se razprostirajo po vsem svetu, niti ne govorimo. Kljub temu podjetje ne popušča, s prikritim sufliranjem soustanovitelja Billa Gatesa se poskuša razširiti še povsod tam, kjer danes ni ravno na prvem mestu. Kdo bi vedel, zakaj, ampak videti je, da jih, denimo, zelo boli oddaljeno drugo mesto med spletnimi brskalniki (če odmislimo Applov Safari, ki je v resnici drugi). Googlov Chrome ima skorajda 70-odstotni tržni delež na tem področju, s tem pa tudi precejšnjo moč odločanja, ko je govora o standardih in standardiziranih novostih, ki naj bodo pripuščene do uporabnikov. Če Chromu pripnemo še daleč najuspešnejši spletni iskalnik in daleč najbolj razširjeni operacijski sistem (četudi le mobilni), je morda bolj jasno, zakaj se Microsoft trudi vsaj med brskalniki in iskalniki, če je že med mobilnimi operacijskimi sistemi odnehal. Uporabniki Windows smo tako deležni privzete namestitve brskalnika Edge, ki je v zadnjih letih postal del Googlove družine Chromium (no, prav, v resnici je ta menda odprtokodna) in tako zelo podoben Chromu, da ga marsikdo ne loči. Še celo prijava vanj je mogoča kar z Googlovimi prijavnimi podatki. Ob poskusu menjave privzetega brskalnika nas dodatno opozorijo, »ali smo zares prepričani«, saj da je Edge vendarle vrhunski brskalnik. Ob skorajda vsaki večji nadgradnji Windows se zgodba ponovi – Edge vnovič postane privzeta izbira. Edge je tudi edini vgrajeni izrisovalnik za aplikacije, ki so le ogrodje za spletne vsebine. Denimo za okenski Metin Messenger, ki povezave v sporočilih odpira v – Edgeu. Enako se Edge odpre ob kliku na povezavo v elektronskih sporočilih, ki jih prikazuje Microsoftov Outlook. Razen če se res zelo potrudimo in to dodatno izklopimo. Edge je ravno tako privzeti prikazovalnik, če na namizju Windows kliknemo ikonico, ki nam pove, kje je bil posneta fotografija trenutnega ozadja na namizju. Vse, da se le nabere nekaj klikov. Enako so se pri Microsoftu še nedavno na vse pretege trudili z iskalnikom Bing, dokaj uspešno tako, da so ga sparili z umetnointeligenčnim klepetalnikom Copilot. Danes, ko je jasno, da si tovrstni klepetalniki čisto preveč izmišljujejo, je očitno, da iz te moke ni bilo veliko kruha. Pa vendar, privzeti brskalnik Edge, ki ima privzet tudi iskalnik Bing, se uporablja, tudi pri nas. Nedavno so našo naročniško službo kontaktirali bralci, ki so se pritožili, da »je na internetu objavljena« napačna številka našega matičnega podjetja. Izkazalo se je, da je ta 'internet' v resnici odgovor, ki ga je ob iskanju 'Mladina' izpljunil – Bing. Izpisal je kar telefonsko številko banke OTP. Morda mu je pomagal Copilot? »Veliko sreče z njim v prihodnosti, nam vsem,« je komentiral sistemski administrator OTP, s katerim sem razreševal ta zaplet. »Veliko sreče s Copilotom v prihodnosti, nam vsem,« je komentiral sistemski administrator OTP, s katerim sem razreševal zaplet. In ravno Copilot, ali pa vsaj njegova omemba, povsod, je tisto, na kar danes 100-odstotno stavi Microsoft. Računalniki z Windows so postali Copilot+ PC, dobili so posebno tipko Copilot, Copilot je vgrajen v pisarniško zbirko 365 (na voljo ob doplačilu k naročnini), še več, Copilot je kar novo ime za to isto pisarniško zbirko! Microsoftova Pisarna, ki se je počasi levila prek Officea v Office 365 in nato 'Microsoft 365 (Office)', je po novem kar – 'Microsoft 365 Copilot'. Z novo kopilotno ikono vred. In to kljub temu, da zlobneži iz velikih konkurenčnih podjetij Copilot počasi začenjajo primerjati z zloglasno in bolj ali manj neuporabno sponko Clippy, ki je po zaslonih skakala v prvih Pisarnah. Da je tam le zato, da je, pravijo, koristi od njega pa ni. Delno bi se strinjal – za tiste, ki v Pisarni ne uporabljamo programa Teams, v katerem zna Copilot delati povzetke sestankov, morda res. Osebno me Copilot v mojem Wordu le moti, ko mi redno zaseda precejšen del delovnega lista in mi ponuja 'povzetek'. Povzetek besedila, ki ga ne potrebujem. Ravno tako ne potrebujem umetnointeligenčnih nasvetov za pisanje ali umetnointeligenčno generiranih besedil. Če potrebujem kakršnokoli izobraževanje ali natančno iskanje, se tako in tako raje obrnem neposredno na original, na katerem temelji Copilot – chatgpt.com. Se bo Microsoftovo popolno osredotočenje na Copilot nekoč slabo končalo? Meta (Facebook) bo ravnokar odnehala s svojim Metasvetom, četudi je zaradi njega nekoč celo preimenovala podjetje. Podobno je nekoč Google odnehal s pametnimi očali (nedavno pa tudi Microsoft). Tako osredotočenje je ključni modus operandi podjetij iz Silicijeve doline – premikaj se hitro in ruši vse pred seboj (move fast and break things). Pa naj stane, kolikor hoče, bomo že kasneje popravili, če bo treba. Nekako tako kot trenutno deluje nova ameriška administracija, novi najboljši prijatelj Silicijeve doline."
year_published = 2025
