["https://monitor.si/avtor/dominik-cigala"]
title = "Dominik Cigala | Monitor"
full_description = "Microsoft Office je od svojega nastanka v poznih 80-ih letih prejšnjega stoletja popolnoma spremenil način dela, sodelovanja in komunikacije. Skozi desetletja se je razvijal iz osnovnega programskega paketa v zmogljivo oblačno platformo, ki danes vključuje umetno inteligenco pod skupno blagovno znamko Microsoft Copilot. Razvoj zbirke pisarniških programov ponazarja tehnološke inovacije, strateške poteze in Microsoftovo neomajno predanost izboljševanju produktivnosti. Predstavljajte si, da imate v rokah star album s fotografijami. Listate po straneh, se smehljate ob obujanju spominov, a nato vas zmoti nekaj neljubega – manjkajoče fotografije, zbledele barve ali celo izgubljeni spomini zaradi uničenja albuma. Ravno ta frustracija je bila izhodišče za ekipo pri Googlu, ko so leta 2015 predstavili storitev Google Photos, platformo, ki je obljubljala, da bo shranila vse naše fotografije in videoposnetke varno, organizirano in dostopno od koderkoli. Uporaba navideznega zasebnega omrežja (VPN) je nekoč pomenila, da nekaj skrivamo. Z njim smo lahko zamaskirali vprašljivo lokacijo ali nečedno dejavnost. Toda VPN ni le najboljši način za zaščito spletne zasebnosti, ima tudi številne druge koristi, kar je razlog, da je ta tehnologija šifriranja postala predmet množične rabe. V svetu kibernetske varnosti je zgodba o računalniškem virusu Stuxnet, ki so ga prvič odkrili leta 2010, postala prava legenda. S svojo zapletenostjo in z domnevnim političnim ozadjem še vedno prevzema tehnološke navdušence, novinarje in vse ljubitelje skrivnostnih pripovedi. To je zgodba o operaciji ameriško-izraelskih obveščevalnih agencij proti iranskemu jedrskemu programu, ki je ušla izpod nadzora ter opozorila svet, kako hitro lahko tovrstna orodja pristanejo v rokah kriminalcev ali drugih držav. Google je na lastne telefone Pixel že poslal novo večjo nadgradnjo mobilnega operacijskega sistema Android, medtem ko mu bodo druge naprave z lastnimi uporabniškimi vmesniki, kot so Honor Magic 6 Pro, Xiaomi 14, OnePlus 12, Vivo X100, sledile kmalu. Android 15 se osredotoča na varnost in zasebnost, pri čemer mu pri varovanju uporabniških podatkov izdatno pomaga umetna inteligenca."
