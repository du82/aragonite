full_description = "Mnenja Objavljeno: 25.2.2025 | Avtor: Jure Forstnerič | Monitor Marec 2025 Nazaj v Evropo Odkar sem v IT, poslušam, kako evropska informatika zaostaja za konkurenco – predvsem za Američani. Pa je to res? Priznam, dnevnih novic (predvsem politike) že vsaj 20 let ne spremljam. Povsem načrtno – mislim, da se pri dnevnih novicah preveč spustimo v podrobnosti, ki na dolgi rok niso pomembne. Vseeno pa po nekaterih kanalih le spremljam širše dogajanje, predvsem po svetu. In seveda opazim trenutno ameriško administracijo in njen agresivni nastop do drugih – do bližnjih sosedov, Kanade in Mehike, in seveda do Evrope. Primeren čas za korak naprej v moji selitvi od ameriških ponudnikov najrazličnejših storitev. Zakup člankov Izbirate lahko med: Mesečni zakup ogledov člankov: 5,99 € Letna naročnina na spletni Monitor: 52,00 € Za plačilo lahko uporabite plačilno kartico ali PayPal ali Google Pay: Najprej se morate prijaviti. V kolikor še nimate svoje prijave, se lahko registrirate."
