["https://monitor.si/clanek/internet-je-mrtev/238868"]
title = "Internet je mrtev | Monitor"
description = "Ena izmed bolj odbitih teorij zarote, ki je dobila pospešek pred štirimi leti, opisuje mrtvi internet. Na spletu naj bi večino vsebin, interakcij in prometa ustvarili boti in umetna inteligenca, sami pa smo tam kot glas vpijočega v puščavi. Zrno resnice v tej teoriji obstaja, razvoj umetne inteligence pa jo utegne uresničiti."
full_description = "Dosje Objavljeno: 25.2.2025 | Avtor: Matej Huš | Monitor Marec 2025 Internet je mrtev Ena izmed bolj odbitih teorij zarote, ki je dobila pospešek pred štirimi leti, opisuje mrtvi internet. Na spletu naj bi večino vsebin, interakcij in prometa ustvarili boti in umetna inteligenca, sami pa smo tam kot glas vpijočega v puščavi. Zrno resnice v tej teoriji obstaja, razvoj umetne inteligence pa jo utegne uresničiti. Tu in tam se kakšna teorija zarote z leti zamude izkaže za resnično, kar njene zagovornike posebej razveseli, preostale ljudi pa navda s kljuvajočim vprašanjem, kaj vse je še res. Pri trditvah o množičnem prisluškovanju oziroma prestrezanju komunikacij smo vrsto let zamahovali , nato pa je Edward Snowden pokazal, da je resnica še bolj distopična (Internet kot moderni panoptikon, Monitor 09/13). Z zgodovinske distance pa je od resničnosti teorije še bolj neverjetna sprijaznjenost s tem početjem. Psi so resda lajali, a karavana je šla še dalje in danes prestrezanje telekomunikacij sprejemamo kot dejstvo, proti katerem se lahko zgolj poskušamo boriti po najboljših močeh. Zakup člankov Izbirate lahko med: Mesečni zakup ogledov člankov: 5,99 € Letna naročnina na spletni Monitor: 52,00 € Za plačilo lahko uporabite plačilno kartico ali PayPal ali Google Pay: Najprej se morate prijaviti. V kolikor še nimate svoje prijave, se lahko registrirate."
