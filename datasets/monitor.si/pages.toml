title = "Matjaž Klančar | Monitor"
full_description = "Nekoč je obstajal Microsoft, ki je kupil 86-DOS, ga preimenoval v MS-DOS in obogatel. Danes preimenuje in postopoma ukinja blagovno znamko Office, verjetno z istim ciljem. Pa mu bo uspelo? Nekoč je obstajal Microsoft, ki je kupil 86-DOS, ga preimenoval v MS-DOS in obogatel. Danes preimenuje in postopoma ukinja blagovno znamko Office, verjetno z istim ciljem. Pa mu bo uspelo? Še na naslovnici januarskega Monitorja smo napovedali članek iz tujega tiska »Ali bo Trump razbil Google?«. Le mesec dni kasneje, natančneje točno 20. januarja, je že vse drugače. Priznam, tudi sam sem vedno znova presenečen, da nam po vseh teh letih, kar negujemo tradicijo popisovanja tehnoloških (in potrošniških) navad naših urednikov, avtorjev in občasnih sodelavcev, na papir še vedno uspe izliti toliko različnosti. Letos se nas je podviga lotilo kar petnajst posameznikov in videli boste, da smo med seboj še vedno različni, kot je le kaj. Sodim med tiste, ki v digitalnem svetu oglase zares sovražijo. Raje se odločim za plačilo in naročilo storitve, kot da bi živel med množico migetajočih oglasov. Pa s samim oglaševanjem v osnovi ni nič narobe, le izrodilo se je. Naj nadaljujem – novih PC-jev Copilot+ v resnici skorajda ni. Zelo natančen in motiviran navdušenec jih bo morda v kakšni trgovini celo našel, sveta pa, kljub napovedim, nikakor ne obvladujejo. Priznam, sem spletoholik. Še več, sem tudi obsesivni spletni nakupovalec – zakaj bi se vozil v trgovino, če lahko nakup opravim od koderkoli, kar prek telefona? Včasih celo od tam, kamor gre še cesar peš. Toda sistem res odlično deluje le, dokler ne pride do prve okvare … Konec poletja je navadno čas, ko se proizvajalci odločijo predstaviti jesenske novosti, ki naj bi se dobro prodajale tam nekje do božičnih razprodaj. Tako smo dobili nove telefone Pixel in iPhone, nove pa so tudi – pametne ure. Konec poletja je navadno čas, ko se proizvajalci odločijo predstaviti jesenske novosti, ki naj bi se dobro prodajale tam nekje do božičnih razprodaj. Tako smo dobili nove telefone Pixel in iPhone, nove pa so tudi – pametne ure."
