["https://monitor.si/clanek/briljantni-skodljivci/238870"]
title = "Briljantni škodljivci | Monitor"
description = "Odkar obstajajo računalniki, obstaja tudi zlonamerna programska koda; odkar so računalniki vpeti v vse pore našega življenja, najdemo tudi računalniške viruse tako rekoč vsepovsod. A če menite, da je prav vsak virus, črv, trojanski konj ali druga »golazen« izdelan/-a in namenjen/-a zgolj krajam podatkov in denarja, se motite."
full_description = "Nove tehnologije Objavljeno: 25.2.2025 | Avtor: Matjaž Jeruc | Monitor Marec 2025 Briljantni škodljivci Odkar obstajajo računalniki, obstaja tudi zlonamerna programska koda; odkar so računalniki vpeti v vse pore našega življenja, najdemo tudi računalniške viruse tako rekoč vsepovsod. A če menite, da je prav vsak virus, črv, trojanski konj ali druga »golazen« izdelan/-a in namenjen/-a zgolj krajam podatkov in denarja, se motite. O zlonamerni programski kodi smo prelili že nemalo črnila; navsezadnje so prav računalniški virusi dokaz iznajdljivosti in genialnosti posameznikov ali skupin, ki izkoriščajo raznolike pomanjkljivosti tako strojne kot programske opreme, nenazadnje pa tudi predvsem naivnost in nerazumevanje nas, ljudi. Morda komu napisano ne bo všeč, a tudi zlonamerna in neželena programska koda sta gonilo tehnološkega razvoja in nas nenehno opominjata na to, da ljudje navdih iščemo tako rekoč povsod in so omejitve pravzaprav le v našem lastnem razumevanju in dojemanju (predvsem tehnološkega, ne pa nujno) sveta. Tokrat se bomo bolj posvetili tisti zlonamerni kodi, ki kaže tehnično briljantnost avtorjev in izkorišča manj očitne napake v tehnoloških zasnovah naprav. Zakup člankov Izbirate lahko med: Mesečni zakup ogledov člankov: 5,99 € Letna naročnina na spletni Monitor: 52,00 € Za plačilo lahko uporabite plačilno kartico ali PayPal ali Google Pay: Najprej se morate prijaviti. V kolikor še nimate svoje prijave, se lahko registrirate."
