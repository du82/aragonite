description = "Če ste si v preteklosti za branje dokumentov, knjig, revij in stripov ter za zapisovanje zapiskov na roke omislili tablico, ste si zagotovo zaželeli, da bi bil vaš zaslon bolj podoben papirju, tako po videzu kot občutku pisanja s pisalom. Osvetljen zaslon namreč pušča neželene posledice na očeh, praskanje z namenskim pisalom po zaslonu pa na ušesih. Željo si zdaj lahko uresničite, mi pa vam povemo, čemu se boste (ali pa morda tudi ne) s tem odpovedali."
full_description = "Preizkusi Objavljeno: 25.2.2025 | Avtor: Matjaž Jeruc | Monitor Marec 2025 Dvoživka Če ste si v preteklosti za branje dokumentov, knjig, revij in stripov ter za zapisovanje zapiskov na roke omislili tablico, ste si zagotovo zaželeli, da bi bil vaš zaslon bolj podoben papirju, tako po videzu kot občutku pisanja s pisalom. Osvetljen zaslon namreč pušča neželene posledice na očeh, praskanje z namenskim pisalom po zaslonu pa na ušesih. Željo si zdaj lahko uresničite, mi pa vam povemo, čemu se boste (ali pa morda tudi ne) s tem odpovedali. Ena izmed naprav, ki je s to dilemo že pred časom želela razčistiti, je bil Remarkable (in njegovi nasledniki). Nalašč nismo uporabili besede tablica, kajti »Izjemnik« je bil omejen z operacijskim sistemom na osnovi Linuxa; na njem ste lahko počeli le tisto, kar so si avtorji zamislili, več kot to pa žal ne. Tokrat preizkušeni BOOX Tab Ultra C Pro pa že z imenom meri na navdušene bralce in zapisovalce, ki so obenem tudi ljubitelji Samsungovega poimenovanja naprav in njihovega oblikovalskega jezika ter si hkrati želijo odprtosti polnokrvne Android tablice. Zakup člankov Izbirate lahko med: Mesečni zakup ogledov člankov: 5,99 € Letna naročnina na spletni Monitor: 52,00 € Za plačilo lahko uporabite plačilno kartico ali PayPal ali Google Pay: Najprej se morate prijaviti. V kolikor še nimate svoje prijave, se lahko registrirate."
