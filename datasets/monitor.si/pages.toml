["https://monitor.si/clanek/od-pisarne-mimo-oblaka--do-inteligence/238910"]
title = "Od pisarne, mimo oblaka, do inteligence | Monitor"
description = "Microsoft Office je od svojega nastanka v poznih 80-ih letih prejšnjega stoletja popolnoma spremenil način dela, sodelovanja in komunikacije. Skozi desetletja se je razvijal iz osnovnega programskega paketa v zmogljivo oblačno platformo, ki danes vključuje umetno inteligenco pod skupno blagovno znamko Microsoft Copilot. Razvoj zbirke pisarniških programov ponazarja tehnološke inovacije, strateške poteze in Microsoftovo neomajno predanost izboljševanju produktivnosti."
full_description = "Zgodovina Objavljeno: 25.2.2025 | Avtor: Dominik Cigala | Monitor Marec 2025 Od pisarne, mimo oblaka, do inteligence Microsoft Office je od svojega nastanka v poznih 80-ih letih prejšnjega stoletja popolnoma spremenil način dela, sodelovanja in komunikacije. Skozi desetletja se je razvijal iz osnovnega programskega paketa v zmogljivo oblačno platformo, ki danes vključuje umetno inteligenco pod skupno blagovno znamko Microsoft Copilot. Razvoj zbirke pisarniških programov ponazarja tehnološke inovacije, strateške poteze in Microsoftovo neomajno predanost izboljševanju produktivnosti. Microsoft Office je danes sinonim za pisarniško produktivnost, njegova zgodba pa sega v zgodnja 80. leta, ko je Charles Simonyi, eden ključnih Microsoftovih razvijalcev, začel uresničevati vizijo integriranega paketa programske opreme. Simonyi, rojen na Madžarskem leta 1948, se je Microsoftu pridružil leta 1981 in s svojim znanjem programiranja ter z inovativnim pristopom odločilno vplival na razvoj Microsoft Officea. Njegov cilj je bil ustvariti zbirko aplikacij, ki bi izboljšala način dela uporabnikov in povečala njihovo produktivnost. Zakup člankov Izbirate lahko med: Mesečni zakup ogledov člankov: 5,99 € Letna naročnina na spletni Monitor: 52,00 € Za plačilo lahko uporabite plačilno kartico ali PayPal ali Google Pay: Najprej se morate prijaviti. V kolikor še nimate svoje prijave, se lahko registrirate."
