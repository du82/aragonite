["https://monitor.si/avtor/matjaz-gercar"]
title = "Matjaž Gerčar | Monitor"
full_description = "Predstavljamo življenjske zgodbe izkušenih 'ajtijevcev' in strokovnjakov s področja računalništva. Dr. Mlakar sodi med pionirje na področju moderne uporabe umetne inteligence, saj se je je lotil že veliko pred tem, ko je postala del vsakodnevnih pogovorov. Predstavljamo življenjske zgodbe izkušenih »ajtijevcev« in strokovnjakov s področja računalništva. Točno dve leti mineva, odkar je podjetje OpenAI s svojim ChatGPT dvignilo veliko prahu in začelo novo obdobje. Dogodek, zapisan v zgodovino, in obdobje, ki ga marsikdo med nami že v popolnosti živi. Tako kot je Charles Babbage za svoj računski stroj potreboval Ado Lovelace, da je spisala program zanj, tako tudi IT-svet potrebuje programerke. In podobno, kot je bila Ada matematičarka, je matematičarka tudi tokratna intervjuvanka Tanja Plavec. Pisanje abstraktnih algoritmov morda povzroča težave mnogim programerjem, ampak ne Tanji. To je njen svet, svet matematike in logike. Njen svet pa niso samo številke, pač pa predvsem njena družina. Kako vse to usklajuje ter kako je zajadrala v IT-svet? Predstavljamo življenjske zgodbe izkušenih »ajtijevcev« in strokovnjakov s področja računalništva. Po treh intervjujih, v katerih smo spoznali IT-jevce, ki so bili bolj ali manj celotno svojo kariero v istem podjetju z ozko usmerjenim naborom tehnologij, je čas, da spoznamo Leona Košaka, ki je svoje znanje pridobival in delil v različnih podjetjih, tudi svojem. Vse to mu je omogočilo, da je lahko pridobival znanje z zelo širokega polja tehnologij ter spoznaval mnoge različne sisteme pri strankah. Predstavljamo življenjske zgodbe izkušenih »ajtijevcev« in strokovnjakov s področja računalništva. Predstavljamo življenjske zgodbe izkušenih »ajtijevcev« in strokovnjakov s področja računalništva. Toliko delovnih ljudi, kot ima svet, toliko je različnih kariernih poti. In v IT ni nič drugače, le kariere so še za odtenek bolj raznolike. Predstavljamo življenjske zgodbe izkušenih »ajtijevcev« in strokovnjakov s področja 