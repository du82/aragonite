["http://www.monotone.ca/intheblogs.php"]
title = "monotone  : In the blogs"
full_description = "monotone is a free distributed version control system. It provides a simple, single-file transactional version store, with fully disconnected operation and an efficient peer-to-peer synchronization protocol. It understands history-sensitive merging, lightweight branches, integrated code review and 3rd party testing. It uses cryptographic version naming and client-side RSA certificates. It has good internationalization support, runs on Linux, Solaris, Mac OS X, Windows, and other unixes, and is licensed under the GNU GPL. I’m pleased to announce the immediate release of [Indefero 1.1](http://projects.ceondo.com/p/indefero). This release features support for another version control system, [monotone](http://www.monotone.ca), and comes with tons of smaller improvements and bug fixes. A full list of changes can be found in the [News](http://projects.ceondo.com/p/ [...] » read more Tony Cooper announced a new release of his [Monotone Browser](http://www.coosoft.plus.com/software.html) software and also a new version of the underlying [Monotone::AutomateStdio](http://search.cpan.org/~aecooper/Monotone-AutomateStdio-0.12/lib/Monotone/AutomateStdio.pod) Perl library. Both packages are now compatible with the most recent version [...] » read more Up until now, branch renaming has been a tricky issue with monotone... and for good reasons. What makes it tricky is that as soon as a branch has left the building (in this case, your own database) out into the world (basically, any other database), you're stuck with what there is unless you track down every damn database where it has ended up and [...] » read more There are certain moments in my life where I feel this love. Love and satisfaction. In these moments I do not regret at all to still work for an “underdog” version control system like [monotone](http://www.monotone.ca) and have not converted to the dark side of the moon (read: git). One of these moments was today, when … Continue [...] » read more If you remember my earlier post(s) you probably ask where the highly anticipated version _one dot zero_ remains. Originally we planned to release it by the end of 2010, but we couldn’t really meet that date because we really wanted to polish a couple of things before releasing it. So what is the new plan … Continue reading monotone acti [...] » read more"
