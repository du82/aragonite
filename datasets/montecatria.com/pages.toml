title = "Le camere – Monte Catria"
full_description = "Rifugio Monte Catria Cotaline (1.400m): le camere Rifugio Monte Catria Cotaline 1400, l’unico rifugio escursionistico con alloggi e ristorante in quota per le province di Pesaro ed Ancona. E’ il luogo ideale per chi – appassionato di montagna – vuole vivere un piacevole soggiorno all’insegna del relax, degli sport all’aria aperta e della cucina tipica, all’interno del massiccio del Monte Catria. Dispone di sette camere, tutte ad uso esclusivo, in stile rustico. Il rifugio è raggiungibile durante l’estate sia in auto (grazie alle tre strade provinciali da Cagli, Frontone e Cantiano) sia in cabinovia dalla località Caprile nel comune di Frontone che diventa l’unico metodo di accesso nel periodo invernale. Proprio grazie alla cabinovia la nostra struttura è fruibile tutto l’anno. E’ situato a 1.400 mt s.l.m. punto di ritrovo di amanti di mountain bike (grazie al bike park per DH e FR ed ai tanti sentieri presenti) del ciclismo su strada (ha visto passare due tappe del Giro d’Italia) e del trekking. E’ immerso direttamente nella natura grazie alle secolari faggete, che regalano sensazioni di pace e benessere a tutti i visitatori. La degustazione dei prodotti tipici della cucina marchigiana lo rendono tappa obbligatoria per i turisti che si addentrano nell’entroterra pesarese: impossibile non innamorarsi delle pappardelle al cinghiale o della crescia con salumi. Durante il soggiorno al Rifugio è possibile praticare diverse attività come le passeggiate guidate, lezioni di nordik walking, escursioni in mountain bike, raccolta funghi, … o visitare alcune località nei dintorni tra cui il Castello di Frontone, il museo dei Bronzi Dorati di Pergola, la cittadina di Cagli, il Monastero di Fonte Avellana o le Grotte di Frasassi…, è possibile anche godere delle risorse naturali e dei paesaggi del massiccio, imperdibili la vetta del Monte Acuto, la Croce del Catria (1701 mt s.l.m.), il fiume Cesano, le balze, i prati con le fiorite primaverili, e i panorami che via via si incontrano percorrendo sentieri e strade diversi ogni giorno. All’interno del Rifugio non è possibile portare animali domestici ma possono essere ospitati nelle adiacenti strutture. Infine va ricordato che il rifugio si trova al centro delle piste da sci quindi è l’unico del genere in tutta l’area appenninica circostante – meta e sosta ideale per una piacevole vacanza per gli amanti degli sport invernali (ciaspole, sci, snow, …). Le camere, inaugurate nel luglio 2014, sono sette di cui una con bagno interno e le altre disposte su due livelli ognuno con un bagno in comune. Tre camere possono ospitare fino a 5 persone, altrettante fino a tre ed una fino a sei con servizi interni. Ogni camera, realizzata con elementi naturali, dispone di riscaldamento autonomo. I bagni dispongono di tutti confort, doccia ed acqua calda. L’area del ristorante sottostante al reparto notte dispone di segnale wi-fi gratuito per tutti gli ospiti. Prezzi e servizi Camere con bagno in comune Adulti: € 65 / persona Bambini dai 3 ai 10 anni: € 35 / bambino Bambini sotto i 3 anni: gratis Suite con bagno in camera Adulti: € 75 / persona Bambini dai 3 ai 10 anni: € 40 / bambino Bambini sotto i 3 anni: gratis Il pernottamento comprende: Trattamento di Mezza Pensione (cena, pernottamento, prima colazione)Biglietto A/R CabinoviaBiancheria cameraNoleggio culla Il pernottamento NON comprende:Asciugamani / biancheria bagno Seguici su: Facebook INFO E CONTATTI Camere 338/6847215 Savio – 338.684 7215 Michele – 328.333 9285 Informazioni, condizioni, supplementi e sconti La prima colazione da effettuarsi presso il bar è compresa nel trattamento di 1/2 pensione.La colazione viene servita dalle ore 8.30 salvo diversi accordi con il personale.La biancheria per dormire è compresa nel prezzo. Non è fornita la biancheria per il bagno.Le camere vengono consegnate dalle ore 15.00 / 18.30 (check-in) del pomeriggio e debbono essere riconsegnate entro le ore 9.00 (check-out) del giorno della partenza. QUOTE La prenotazione è obbligatoria e va convalidata con versamento del 50% della quota mediante bonifico bancario. La caparra non è rimborsabile: il pernottamento potrà essere recuperato a seconda delle disponibilità. La struttura dispone di servizio BANCOMAT ma la connessione non è sempre garantita, è consigliato l’uso di contanti. Banca d’Appoggio BCC di Pergola sede centraleBAN IT80Y0873168490000010146865 C/C intestato a:M.te Catria Cotaline 1400 S.A.S. di Oradei Michele e C. Località Monte Acuto – 61040 – Frontone (PU)– P.I. 02505070413 Tamburini Savio 338.6847215 – Oradei Michele 328.3339285 INFO SOGGIORNO La struttura chiude alla sera alle ore 22.30, i gentili ospiti possono comunque accedere alle camere da un’entrata secondaria. Si prega di prestare il massimo rispetto e silenzio per gli altri ospiti del rifugio. Al momento dell’arrivo il capofamiglia è pregato di consegnare copia dei documenti di identità di tutti i soggiornanti. NON SONO AMMESSI ANIMALI DI QUALSIASI TAGLIA NELLE CAMERE!!! I gentili clienti possono tenerli con se nella zona ristoro se docili ed al guinzaglio durante il giorno. Di notte possono essere tenuti all’esterno o in altra struttura adiacente il rifugio."
