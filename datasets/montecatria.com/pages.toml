title = "Natura é divertimento – Monte Catria"
full_description = "live your emotions Attività all'aria aperta Se amate trascorrere un pò di tempo immersi nella natura avete trovato il posto giusto! Le faggete del massiccio del Catria ed Acuto sapranno coccolarvi: Mountain Bike, Trekking, Down Hill, Nordik Walking … o solo una bella merenda in quota per ripagare corpo e spirito. Nordic Walking Una passeggiata con i bastoni Il nordic walking è un tipo di attività fisica e sportiva che si pratica utilizzando bastoni appositamente studiati, simili a quelli utilizzati nello sci di fondo. Rispetto alla normale camminata, questa richiede l’applicazione di una forza ai bastoni a ogni passo. Ciò implica l’uso dell’intero corpo. KinderlandPer tutta la famigliaDal 5 luglio 2015 per tutta la famiglia è aperto il Kinderland Adventure Park, il parco giochi acrobatico che saprà regalarvi ore spensierate: tante attrattive per i più piccoli e per ragazzi ed adulti. kinderland Biking e MTB Il Bike Park vi aspetta Pedalare che passione! Al Bike Park di Monte Catria, oltre a svariati sentieri escursionistici sono stati preparati tracciati Down Hill, Panoramici, Crosscountry, XC ed RF dedicati a tutti gli appassionati di Mountain Bike! BIKE PARK Catria Nature Village Vivi a contatto con la natura Vivere notte e giorno in tende circolari e giganti assieme ai tuoi cari, alla tua famiglia o con i tuoi amici, permette di vivere sensazioni uniche ricche di primitiva memoria. La notte puoi perderti nell’osservare il cielo stellato o scrutare l’universo arricchito dai tuoi sogni o dal vociare dei tuoi amici della notte. CATRIA NATURE VILLAGE CONTATTACI Info e Contatti 380/7550051 Savio – 338. 68 47 215 Michele – 328.333 9285 Live your emotions Passeggiate ed Escursioni a cavallo Potete perdervi nella danza del cammino placido a cavallo, tra sentieri, colline e boschi di straordinaria bellezza e ancora densamente incontaminati. Potete creare gruppi, fare scampagnate in compagnia, oppure passeggiare assieme ad amici docili e mansueti per divertirsi a lanciarsi in distensive galoppate in falsopiano. A cavallo ci si diverte, ci si mette alla prova e guardando il cielo potete farvi incuriosire dal volo di un falco. I più fortunati possono anche incrociare una mandria di cavalli allo stato brado… Live your emotions! contattaci adesso Info e Contatti passeggiate a cavallo 348/8629987 Alino – 3488629987 Savio – 338.6847215 Adamo – 389.3194446 Vedi anche: Associazione Catria Horse – Trekking and Food pagina facebook Informazioni e regole Scarica la cartina"
