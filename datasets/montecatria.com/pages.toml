["https://www.montecatria.com/escursioni-e-natura"]
title = "Flora e fauna – Monte Catria"
full_description = "live your emotion Un paesaggio ricco di flora e fauna Monte Catria è una montagna alta 1702 m s.l.m. che sorge tra i comuni di Cagli, Cantiano, Frontone e Serra Sant’Abbondio, in provincia di Pesaro e Urbino e nel comune di Scheggia e Pascelupo in provincia di Perugia. Il Gruppo del Monte Catria comprende inoltre altre cime minori: il Monte Acuto (mt. 1668) il Monte Corno (1412 m) il Monte Tenetra (1240 m) il Monte Alto (1321 m) il Monte Morcia (1223 m) L’ altimetria segna dunque le quote più elevate di questa parte centrale dell’Appennino Umbro-Marchigiano; le vette del Monte Catria e del Monte Acuto sono peraltro le più alte nel tratto appenninico compreso tra la catena dei Monti Sibillini a sud e l’alto Appennino modenese con il Corno alle Scale (1945 m), a nord. Fa parte delle comunità montane del Catria e Nerone che ha sede nel Comune di Cagli. La stazione sciistica è sita interamente nella Provincia di Pesaro e Urbino, nel territorio del comune di Frontone. E’ disposta sul versante nord orientale del Monte Acuto. I terreni su cui si sviluppa sono di proprietà dell’Università degli Uomini Originari di Frontone (per maggiori informazioni clicca QUI). Dal Catria nascono i fiumi Cesano, Artino, Bevano e Cinisco.Data l’imponenza, il grande massiccio è percorribile per tortuosi sentieri o strade asfaltate fin sulla cima, da dove si domina l’Italia centrale e la costa adriatica in un vastissimo panorama. Si può salire da Chiaserna di Cantiano, Val d’Orbia, Isola Fossara, Montelago di Sassoferrato, Serra Sant’Abbondio, Frontone, Colombara. Le Terre del Catria sono paesaggi naturali unici che offrono al visitatore panorami incontaminati che brulicano di colori in tutto l’arco dell’anno.Dai variopinti e pittorici prati primaverili, passando al verde smeraldo delle specie arboree, si scende fino alle ordinate macchie di colore del paesaggio collinare estivo, incise dall’azzurro delle dolci acque di fiumi e sorgenti. Le Rocce Il Catria è stato definito da alcuni studiosi e ricercatori un “atlante geologico” per i numerosi affioramenti di diversi tipi di rocce e di diverse epoche geologiche, che testimoniano l’intero arco temporale di formazione dell’Appennino centrale ed hanno permesso di perfezionare le conoscenze sugli avvenimenti che diedero origine al bacino del mediterraneo. Nelle parti alte del Massiccio del Catria affiorano per sovrascorrimento gli strati delle rocce più antiche, il Calcare Massiccio del Lias inferiore di circa 200 milioni di anni, alcune parti di grigio ammonitico, il Calcare selcifero detto corniola, il Rosso Ammonitico e Calcari ad Aptici, tutti depositatisi in ambiente marino dalla fine del Periodo Triassico alla fine del Periodo Giurassico (Era mesozoica o Secondaria) e poi in ordine di tempo i più giovani Calcare rupestre o Maiolica (Giurassico Superiore e Cretacico Inferiore), le Marne a Fucoidi, la Scaglia Rossa e Bianca, depositi di un periodo che va dal Cretacico (Era Secondaria) all’Eocene (Era Terziaria o Cenozoica). La Flora Si trovano piante e boschi di abete, faggio, acero montano, acero riccio, leccio, ginepro, carpino bianco e carpino nero, sorbo montano, orniello, roverella, nocciolo, olmo montano, tasso e tante altre specie. Da ricordare per la loro rarità tra gli arbusti l’onicino, la rosa spinosissima, la dafne olivella, la ginestra stellata, il cotognastro minore, l’uva spina, il crespino e l’efedra. Le zone pedemontane sono ricche di querce, noci, ciliegi, meli e castagni. All’interno delle faggete, fresche ed umide, prosperano come arbusti il bel sigillo di Salomone, il più raro sigillo di Salomone verticillato, l’erba gialla, e, ai margini dell’area boscata, il ribes alpino, e il ranno alpino.Qua e là spuntano anche agrifoglio, rovi e piantine di fragole e more; tra i fiori, il bucaneve, le primule, le orchidee, i mughetti, i narcisi, i crocus, le genziane, le potentille, i myosotis alpini e le viole di Eugenia; di grande interesse e valore sono anche le specie vegetali che crescono negli ambienti rocciosi, nei macereti e nei prati sassosi del Gruppo del Catria per le quali sono state distinte ben 8 aree floristiche protette della Regione Marche. La Fauna Si possono vedere al pascolo in molti esemplari: muli, cavalli della autoctona razza del Catria, mucche della razza marchigiana, pecore, capre; pericolose insidie sono costituite dalla presenza delle vipere; volteggiano nei cieli diverse coppie di aquile reali, i falchi, gli sparvieri e gli astori, numerosi gheppi; nei boschi i gufi reali, gli allocchi, i barbagianni e le poiane; fino alle zone pedemontane sono inoltre presenti il picchio nero e il picchio rosso, minore e maggiore. Tra i volatili, sono accertati anche i rari coturnice appenninica e fringuello alpino. Una rarità è anche la presenza dello “scazzone” (Cottus gobio), piccolo pesce che necessita di acque purissime – protetto addirittura dalla Comunità Europea poiché rappresenta un relitto glaciale – il quale popola con i gamberi di fiume ed i granchi le acque dei torrenti del massiccio montuoso. Nei freddi torrenti inoltre, fra gli anfibi, sono accertati la rara salamandrina dagli occhiali, il geotritone e la rarissima salamandra pezzata; verso valle, quando i letti dei torrenti si allargano, si aggiunge la presenza delle trote. Inoltre, nelle estese aree boschive e nelle secolari faggete ad alto fusto, è numerosa la presenza di volpi, scoiattoli, faine, tassi, gatti selvatici, donnole e martore; diffusi anche, ormai in forma stanziale, diversi branchi di cinghiali, mufloni, caprioli e daini. Un cenno a parte merita il daino, in quanto non è originario della fauna italiana; la sua presenza è dovuta interamente ad introduzioni. In particolare, i numerosi daini presenti sul Catria sono sicuramente il risultato dell’uscita degli animali dai recinti di allevamento della zona del vicino monte Strega, esistenti da oltre mezzo secolo, e di vari ripopolamenti con provenienza degli animali forse jugoslava. Infine è ormai consolidata la presenza del re dell’Appennino: il lupo. Questi, solitario o in branco, si spinge sempre più spesso fino ai primi paesi pedemontani della zona, dove in inverno, cercando cibo, spesso preda anche pollame e piccoli animali domestici. Negli ultimi anni, si sono infatti registrati diversi episodi nelle località Foce e Caprile, frazioni di Frontone e nei paesi di Chiaserna e Fossato, nel comune di Cantiano. Inoltre, vi sono stati diversi avvistamenti nei pressi dell’Eremo di Fonte Avellana. Monastero di Fonte Avellana: « Tra ‘ due liti d’Italia surgon sassi, e non molto distanti a la tua patria, tanto che ‘ troni assai suonan più bassi, e fanno un gibbo che si chiama Catria, di sotto al quale è consecrato un ermo, che suole esser disposto a sola latria. »"
