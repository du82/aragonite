["https://www.montecatria.com/bici-e-mountain-bike"]
title = "Bici e Mountain Bike – Monte Catria"
full_description = "live your emotions Il Bike Park per tutti! N.01 – Down Hill Adrenaline La pista DH si rinnova Il percorso DH è stato completamente manutentato e rivisto. Molto più veloce ed alla portata di tutti ora anche tabellato a nuovo. Partenza dal Rifugio Monte Catria Cotaline 1400 si snoda intersecando più volte la strada di servizio della cabinovia detta “Fondovalle”. In totale oltre 4 km adrenalinici con salti, panettoni, centinaia di curve paraboliche,… Il percorso è stato battezzato “ADRENALINE” ed è il N.1 dei sentieri che stiamo manutenendo e riaprendo. Su tutto il tracciato sono posti diversi cartelli indicativi e segnali verniciati di colore rosso. In alcuni tratti il biker potrà scegliere il percorso EASY o HARD in base alle proprie capacità. Tracciato GPS DH ADRENALINE File per GPS e Google Earth (gpx) TRACCIATO GPS N.08 – FR Carbonai – Chiusa per l’alluvione A breve riprenderanno i lavori per la riapertura Free Ride o Down Hill… il dilemma Il percorso Free Ride è stato ripulito e messo in sicurezza. Molto veloce è sicuramente uno dei tracciati più tecnici di tutto il centro Italia. Si parte dal Rifugio Monte Catria Cotaline 1400 per 3km di trasferimento in direzione del Catria, poi prima del Rifugio Vernosa inizia il tracciato che si snoda intersecando più volte alcuni sentieri che portano a Fonte Avellana. In totale oltre 5.5 km e 900m di dislivello. Il trasferimento può essere fatto sia via sentieri/prati che lungo la più pedalabile strada provinciale. Il percorso è stato battezzato “CARBONAI” proprio perché una volta veniva utilizzato per fare il carbone; è il N.8 dei trail che stiamo manutenendo e riaprendo. Su tutto il tracciato sono posti diversi cartelli indicativi e segnali verniciati di colore fucsia. Tracciato GPS FR CARBONAI File per GPS e Google Earth (gpx) TRACCIATO GPS N.4 – XC Anello Monte Acuto Il paradiso per gli amanti del Cross Country Si tratta di un trail percorribile in entrambi i sensi di marcia. Si sviluppa su circa 9 km con un’altimentria che va da 1200 a 1500m slm. Completamente ripulito e messa in sicurezza ha tratti impegnativi, altri velocissimi altri ancora da pedalare in relax godendosi il bellissimo panorama che spazia tra le regioni Marche, Umbria ed Emilia Romagna. Si parte dal Rifugio Monte Catria Cotaline 1400 salendo lungo la pista da sci “Panoramica”, poi in senso antiorario si segue in successione per i rifugi: Gorghe, Mochi, Fonte del Faggio, Casetta dei Porci raggiungendo quindi la Chiesetta di San Pier Damiani e tornando alla cabinovia. Il tratto tra la Casetta dei Porci e la Chiesa può essere percorso sia lungo il tracciato che taglia i prati oppure lungo la strada provinciale che collega a Chiaserna. Il percorso è il N.4 dei trail che stiamo mantenendo e riaprendo. Su tutto il tracciato sono posti diversi cartelli indicativi e segnali verniciati di colore azzurro. Tracciato XC ANELLO MONTEACUTO File per GPS e Google Earth (KML) TRACCIATO GPS INFO E CONTATTI 338 / 68 47 215 Savio – 338.684 7215 Michele – 328.333 9285 Regolamento Poche ma importanti regole Nel Bike Park esistono poche ma importanti regole! Scarica e leggi tutte le info per divertirti con noi in tutta sicurezza. Titolo della fisarmonica Contenuto della fisarmonica Regole Bike Park e trasporto bici Tutto quello che devi sapere per frequentare correttamente il nostro Bike Park. TRASPORTO di BICICLETTE e DECALOGO Noleggio E-bike Monte Catria All’interno del comprensorio è presente anche un noleggio di e-bike, per scoprire e raggiungere luoghi immersi nella natura, e godere di panorama mozzafiato! 328.333 9285 3807458741 380. 75 50 051"
