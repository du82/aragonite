full_description = "BigliettiAdulti Lu-Ve Sa-Do & Pre/Fest-Fest Andata e ritorno o Risalita Biker 10 Solo Andata o Ritorno 8 Ski Pass Giornaliero 25 30 Ski Pass Pomeridiano 20 25 Biker MTB Giornaliero 20 Tesserati Asd Bike Experience(è possibile acquistare la tessera stagionale Asd Bike Experience nella biglietteria a valle) 16 BigliettiBambini Lu-Ve Sa-Do & Pre-Fest -Fest Solo cabinovia senza utilizzo impianti da sci e piste, fino a 125 cm di altezza gratuito gratuito Fino a 13 valgono i seguenti prezzi: Andata e ritorno 8 Solo Andata o solo Ritorno 5 Ski Pass Giornaliero 15 20 Ski Pass Pomeridiano 10 15 Stagionali Stagionale inverno adultiStagionale estivo biker 300300 Stagionale inverno bambinifino a 14 anni 150 Pomeridiano– risalita dopo ore 12.30 ScontiASD e convenzionati 20% Qui troverete tutte le informazioni sull’orario ed i costi della cabinovia “Caprile – Monte Catria” denominata OM06. Prossime aperture:Aperti Sabato 22 e Domenica 23! Orario Cabinovia: 9.00-16.00 (ultima discesa) La stagione estiva inizia abitualmente il 25 aprile e termina in ottobre. La stagione invernale inizia l’8 dicembre e termina a fine marzo, con la neve siamo aperti tutti i giorni altrimenti nei weekend. Con l’apertura dell’impianto è sempre operativo il rifugio Monte Catria Cotaline 1400. Le strade che portano al Catria sono aperte solo d’estate, la Provincia di Pesaro e Urbino con ordinanza apposita, chiude tutte le vie di transito dal 1° dicembre al 30 marzo. Informazioni possono essere reperite presso la biglietteria, oppure contattando i numeri: 0721 183 6605 | 338.684 7215 Avviso importante Da gennaio 2018 è in funzione la seggiovia triposto in sostituzione dello skilift. Da gennaio 2019 è in funzione la nuova cabinovia biposto pulsè che porta a quota 1400 metri. Da gennaio 2022 è in funzione la seggiovia quadriposto Travarco con nuove piste Noleggio Adulto Casco €10.00 Bastoncini €5.00 Sci € 20.00 Scarponi € 10.00 Tavola € 20.00 Ciaspole € 10.00 Pomeridiano Sconto 20% solo su KIT (€ -3.00 ragazzi * €-4.00 adulti) Junior Casco €5.00 Bastoncini €5.00 Sci € 15.00 Scarponi € 10.00 Tavola € 15.00 Ciaspole € 10.00 Pomeridiano Sconto 20% solo su KIT (€ -3.00 ragazzi * €-4.00 adulti) Kit adultiSCI (sci, scarponi, bastoncini) € 25.00SNOW (tavola e scarponi) € 25.00 Kit ragazzi fino a 14 anniSCI (sci, scarponi, caschetto, bastoncini) € 20.00SNOW (tavola e scarponi) € 20.00 Pomeridiano Sconto 20% solo su KIT (€ -3.00 ragazzi * €-4.00 adulti) noleggio attrezzature Condizioni Titolo della fisarmonica Contenuto della fisarmonica Condizioni di vendita biglietto Bike Park Trasporto Biciclette Ai fini del trasporto di biciclette con la FUNIVIA OM06 Caprile-M.te Acuto, il Biker prende atto che: Monte Catria Impianti Scarl con l’emissione del biglietto garantisce solo il servizio di trasporto dalla stazione di partenza sino alla stazione di arrivo (ed eventuale ritorno). Con l’acquisto del biglietto si prende atto di aver ricevuto tutte le informazioni qui riportate; La competenza, i servizi e la responsabilità di Monte Catria Impianti Scarl cessano al di fuori del perimetro della stazione di partenza ed arrivo; Il Biker è consapevole che la pratica della mountain bike e delle sue discipline (DH; FR; XC,…) su terreno impervio, accidentato, privo di manutenzione e di ogni misura di protezione è per sue caratteristiche una pratica pericolosa e ad alto rischio e ne accetta ogni conseguente rischio con coscienza e volontà; L’accesso al Bike Park è vietato ai minori di 18 anni se non accompagnati da adulto che se ne assume la responsabilità; Nel Bike Park pista DH ADRENALINE e FR CARBONAI è obbligatorio l’uso del casco integrale e delle protezioni: paraschiena e paratorace, paragomiti, ginocchiere e guanti. Ai sensi della legge n.196/03, si dichiara di essere consapevoli che anche nel Bike Park potranno essere effettuati servizi fotografici e video per scopi promozionali e con la sottoscrizione del presente modulo si autorizzano espressamente i soggetti che volessero avvalersi di tale materiale, Monte Catria Impianti Scarl compresa, al suo utilizzo con la sola finalità sopra precisata. Ai sensi dell’art.1341 c.c. il Biker che acquista il titolo di viaggio della FUNIVIA OM06 dichiara di ben conoscere e approvare espressamente il contenuto dei seguenti articoli: 1. Servizio di solo trasporto a monte 2. Limitazione di responsabilità di Monte Catria Impianti Scarl alla sola fase di trasporto a monte; 3. Assenza di gestione e manutenzione dei tracciati di discesa 4. Pericolosità e rischiosità della discesa in bicicletta 5. Divieto di ingresso ai minorenni nel Bike Funk Park 6. Obbligo dell’uso del casco e di idonee protezioni 7. Privacy. Condizioni di vendita Skipass e Regole generali La zona sciistica del Monte Catria è composta come segue: Funivia : Caprile – Monte Acuto Seggiovie : Cotaline e Travarco Tapis Roulant : Campo Scuola 1 Tapis Roulant : Kinderland Con l’ acquisto dello skipass giornaliero/pomeridiano/weekend/stagionale, l’ Ospite ottiene il diritto di usare tutti gli impianti di risalita che sono accessibili al pubblico. Vi preghiamo di informarvi direttamente in loco o sul nostro sito internet riguardo la tipologia ed il prezzo degli skipass disponibili. Il prezzo dello skipass non dipende della quantità di impianti o piste aperti, ma viene fissato direttamente della Direzione. L’apertura di tutte le piste e di tutti gli impianti non è sempre garantita. L’ utente è responsabile della buona conservazione dello skipass il quale deve essere sempre posto in modo ben visibile. Lo skipass è un documento personale e non è cedibile. Qualsiasi abuso nell’ utilizzo dello skipass ed in particolare la sua cessione, comporta il ritiro immediato ed il suo annullamento, fatto salvo il diritto di agire contro il trasgressore sia penalmente che civilmente da parte dela Società. Gli skipass smarriti, rubati, ritirati o deteriorati non vengono sostituiti e tanto meno rimborsati. Tutti i tipi di skipass (riconoscibili oltre dall’indicazione anche dal colore) hanno esclusivamente la validità della data di emissione. I biglietti “Stagionali” hanno la validità della stagione in corso riportata sul titolo (invernale o estiva). Biglietti scaduti non verranno rimborsati, tanto meno trasferiti in un altra stagione. Lo skipass o il biglietto singolo, in quanto documenti di trasporto, assolvono la funzione dello scontrino fiscale (D.M. 30.06.1992). Solo in caso di infortunio sciistico è possibile il parziale rimborso dello skipass. Il rimborso avverrà solo dietro presentazione di un certificato medico, redatto dal Pronto Soccorso di un Ospedale di Zona, dal quale risulti che il titolare dello skipass abbia subito un infortunio o malattia che gli impedisca la prosecuzione dell’attività sciistica. Sconti sul prezzo degli skipass verranno fatti solo dopo aver presentato i documenti adeguati. Non si accettano auto certificazioni. Sono disponibili i seguenti sconti: Sconto Associazioni Sportive: rilasciato alle ASD che saranno ritenute di rilevanza per il comprensorio dalla società, in percentuale sul prezzo del biglietto e comunque solo ed esclusivamente presentando la tessera di appartenenza in corso di validità; Sconto per gruppi: organizzati a partire da 20 persone hanno diritto ad una gratuità (o altra forma a discrezione del gestore) sui prezzi normali di listino; in questo caso, soltanto il capo gruppo o conduttore di autobus, deve acquistare per tutto il gruppo gli skipass o biglietti in unica soluzione; Bambini: Bambini come indicato dal Gestore nel listino prezzi. Per ottenere la gratuità il genitore deve presentare un documento di identità valido con foto. In caso di controlli, effettuati da addetti della Società o dal Soccorso Piste FISPS M.te Catria, lo skipass deve essere mostrato per valutarne la validità. Obbligo assicurazione. La stazione è presidiata da Pattugliatori della Federazione Italiana Sicurezza Piste Sci i quali oltre che a disporre dell’infermeria e soccorrere in caso di incidenti hanno il compito di vigilare e far rispettare le norme vigenti. Oltre ai membri della FISPS possono essere presenti rappresentanti dele Forze dell’Ordine in servizio di sicurezza. La Società Monte Catria Impianti non è comunque responsabile, e pertanto nessun rimborso è dovuto, qualora, a causa di eventi imprevisti, come l’ eccessiva ventosità, la sopravvenuta mancanza di neve, l’ improvvisa insorgenza di un imprevedibile problema tecnico, oppure per manifestazioni agonistiche, si determini il fermo totale o parziale degli impianti o la chiusura di taluna pista. La classificazione delle piste è solo indicativa e non ne è garantita l’agibilità in toto. Per motivi di sicurezza è proibito frequentare le piste dopo la chiusura degli impianti. A chiusura degli impianti verrà fatto un ultima corsa di controllo da parte del personale addetto. L’ orario dell’ ultima corsa è segnalato alle stazioni di partenza e arrivo e può essere modificato in base alle condizioni meteorologiche. Dopo l’ ultima corsa verrà iniziata la preparazione delle piste con mezzi meccanici per cui ne è vietata tassativamente l’occupazione. L’accesso all’area “KINDERLAND” è possibile esclusivamente con il pagamento del biglietto preposto. L’area è servita da un tapis roulant che permette la risalita del bambino e del bob/slittino. Nell’area possono accedere i genitori dei bimbi senza però interferire nelle aree dedicate alle discese. I giochi all’interno dell’area sono utilizzabili permettendone però l’utilizzo a tutti i bambini presenti. Nel caso in cui il biglietto non sia stato acquistato alla biglietteria a valle è possibile comperarlo all’ingresso dell’area. L’utilizzo di tutta l’area con mezzi propri o con i giochi presenti è a rischio e pericolo del genitore che accompagna il bambino, il comportamento tenuto deve essere tale da non mettere in pericolo l’incolumità altrui o provocare danni a persone e cose. Il bambino non può accedere nell’area se non tenuto sotto controllo da un genitore. eventuali infortuni non possono essere imputati alla Società la quale prima dellapertura dell’area ne verifica lo stato e la sicurezza. Tutti i giochi e le protezioni sono a norma con le regole vigenti. E’ vietato accedervi con gli scarponi da sci. Tutte le persone che si servono dei nostri servizi, frequentano ed utilizzano l’area sciabile e quelle adiacenti a proprio rischio e pericolo. Ogni persona deve comportarsi in modo da non mettere in pericolo l’incolumità altrui o provocare danno a persone e cose. La persona deve, pertanto, adeguare la sua andatura alle proprie capacità, alle condizioni del terreno, alla visibilità, allo stato di innevamento, nonché alle prescrizioni imposte dai segnali indicatori. Il soccorso è garantito esclusivamente su pista, in caso di incidente fuoripista andrà allertato il servizio 118 con l’ausilio del Soccorso Alpino. L’ acquisto e conseguente possesso di un biglietto o documento di viaggio comporta la conoscenza e l’accettazione integrale delle condizioni di vendita. I cani possono accedere agli impianti funiviari ed al rifugio solo se di piccola taglia, docili e tenuti al guinzaglio. L’imbarco sulla cabinovia resta a discrezione del Gestore. Diversamente abili: l’utilizzo degli impianti funiviari resta a discrezione del Capo Servizio come previsto dalle leggi vigenti, che in base alle condizioni meteo ed al tipo di disabilità potrà decidere o meno l’imbarco. Norme per i viaggiatori I viaggiatori devono munirsi del biglietto che deve essere esibito al personale della funivia a richiesta. Per i titoli Skipass e BikePark questi debbono essere ben esposti e visibili ad ogni passaggio. Nel prezzo del biglietto è compreso il diritto al trasporto di un piccolo bagaglio non ingombrante, e tale da consentire comunque una corretta posizione del viaggiatore sul veicolo, nonché la corretta manovra del dispositivo di chiusura.E’ consentito il trasporto di altro tipo di bagaglio/attrezzature sportive in modo che ciò non costituisca intralcio e pericolo per i viaggiatori. L’ordine di precedenza per la salita è dato esclusivamente dall’ordine di presentazione alla partenza, salvo che per il personale di servizio, gli incaricati della sorveglianza e soccorso e per gli speciali casi approvati dall’Autorità di sorveglianza. In casi eccezionali il personale di servizio e quello delle attività commerciali collegate all’impianto possono essere imbarcati con precedenza sui viaggiatori paganti. E’ vietato ai viaggiatori parlare al personale dell’impianto, tranne che per necessità di servizio. I viaggiatori sono tenuti a rispettare le istruzioni indicate dagli appositi cartelli monitori affissi sia nelle stazioni che in linea. Devono altresì rispettare le norme emanate dall’Autorità di sorveglianza ed osservare tutte le altre particolari disposizioni che, al fine di evitare incidenti, vengono impartite dal personale dell’impianto. E’ vietata la salita alle persone in evidente stato di ubriachezza ovvero in condizioni psicofisiche anormali, ovvero quelle non sufficientemente protette in relazione alle condizioni climatiche ambientali, quelle portanti oggetti che impediscono un’agevole salita sui veicoli, nonché quelle che per il loro stato o il loro comportamento possano pregiudicare la sicurezza propria e degli altri viaggiatori, disturbare i viaggiatori e turbare l’ordine pubblico. Alla partenza i viaggiatori devono mettersi nelle posizioni che sono ad essi indicate dagli agenti; In linea ai viaggiatori è vietato: provocare in qualsiasi modo oscillazioni dei veicoli; viaggiare sui veicoli in posizione scorretta; aprire i dispositivi di chiusura e sicurezza dei veicoli; scendere o salire in ogni caso dai veicoli; far sporgere o gettare oggetti di qualsiasi tipo dal veicolo; negli impianti dotati di cabine, manomettere o tentare di aprire le porte durante il viaggi. fumare durante il viaggio e nelle stazioni. Nel caso di evacuazione dei viaggiatori in linea, essi saranno avvisati mediante comunicazione. I viaggiatori dovranno attendere il personale addetto all’evacuazione conservando la posizione normale sui veicoli. Le operazioni inizieranno nel più breve tempo possibile e saranno ultimate entro 3 ore. I viaggiatori che non osservino le disposizioni di cui agli articoli precedenti saranno ritenuti responsabili degli eventuali danni arrecati all’esercente, agli altri viaggiatori ed a terzi. Il viaggiatore che non sia pratico del sistema di trasporto dell’impianto dovrà avvertire il personale dell’impianto e richiedere le istruzioni del caso. Su specifica richiesta degli interessati il personale provvederà a rallentare la velocità dell’impianto o a fermarlo per favorire la salita o la discesa. Nei veicoli chiusi, i viaggiatori muniti di dispositivi di protezione antivalanga del tipo “air bag” devono disattivare tale dispositivo prima di accedere all’impianto. Gli eventuali reclami dei viaggiatori riguardanti il servizio devono essere inviati all’Esercente (montecatriaimpianti@pec.it) con l’indirizzo preciso del rec"
