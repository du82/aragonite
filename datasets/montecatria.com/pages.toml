["https://www.montecatria.com/catria-nature-village"]
title = "Catria Nature Village – Monte Catria"
full_description = "catria nature village Vivi a contatto con la natura Vivere a contatto con la natura è ciò che si prova soggiornando al Catria Nature Village. Trascorrere il proprio tempo di permanenza nel bosco adiacente al Rifugio consente di assaporare i profumi di un luogo intriso di meraviglia e magia. Vivere notte e giorno in tende circolari e giganti assieme ai tuoi cari, alla tua famiglia o con i tuoi amici, permette di vivere sensazioni uniche ricche di primitiva memoria.La notte puoi perderti nell’osservare il cielo stellato o scrutare l’universo arricchito dai tuoi sogni o dal vociare dei tuoi amici della notte. Un villaggio di tende composto da n. 5 tende circolari che contengono dalle 4 alle 6 persone e che permette un soggiorno diverso in comitiva, per sperimentare dei coach incentive nella natura, per una gita tra amici, per vivere allegramente una esperienza unica ed indimenticabile. Di certo regala uno stimolo esperienziale anche per le aziende che amano regalare o regalarsi nuove emozioni in team completamente sotto le stelle.Le tende sono sicure, impermeabili ed ermetiche e hanno tutti i comfort che puoi desiderare da una stanza da hotel come mobiletti, materassi, sacchi a pelo, elettricità ed eventuali piumini per proteggersi dal freddo. Sono esclusi tutti gli accessori ( detergenti e asciugamani ) per fare bagno/doccia/shampoo.La toilette da utilizzare è quella del rifugio ( molto vicina alle tende ) accessibile con una chiave ad hoc sia di giorno che di notte h.24. Le tende hanno servizio di colazione e cena servita all’interno del rifugio.E’ consentito l’ingresso di cani di piccola taglia e muniti di portantino. Sono gradite rassicurazioni sulla integrità dell’animale e sulle sue normali capacità di coabitazione. Le procedure di pulizia delle deiezioni del proprio animale vanno osservate a norma di legge. Il contratto per soggiornare prevede in omaggio l’arrivo e il ritorno in cabinovia e la colazione nel rifugio la mattina…come un vero villaggio tradizionale. catria Prezzi e servizi Tende Catria Nature Village Adulti: € 75 / personaBambini dai 3 ai 10 anni: € 40 / bambinoBambini sotto i 3 anni: gratis Il pernottamento comprende: Trattamento di Mezza Pensione (cena, pernottamento, prima colazione)Biglietto A/R CabinoviaSacchi a pelo, lenzuola, materassiElettricitàIl pernottamento NON comprende: Asciugamani / biancheria bagno Informazioni, condizioni, supplementi e scontiLa prima colazione da effettuarsi presso il bar è compresa nel trattamento di 1/2 pensione. La colazione viene servita dalle ore 8.30 salvo diversi accordi con il personale. La biancheria per dormire è compresa nel prezzo. Non è fornita la biancheria per il bagno. Le tende vengono consegnate dalle ore 15.00 / 18.30 (check-in) del pomeriggio e debbono essere riconsegnate entro le ore 9.00 (check-out) del giorno della partenza.QUOTELa prenotazione è obbligatoria e va convalidata con versamento del 50% della quota mediante bonifico bancario. La caparra non è rimborsabile: il pernottamento potrà essere recuperato a seconda delle disponibilità.La struttura dispone di servizio BANCOMAT ma la connessione non è sempre garantita, è consigliato l’uso di contanti.Banca d’AppoggioBCC di Pergola sede centraleBAN IT80Y0873168490000010146865C/C intestato a:M.te Catria Cotaline 1400 S.A.S. di Oradei Michele e C.Località Monte Acuto – 61040 – Frontone (PU)– P.I. 02505070413Tamburini Savio 338.6847215 – Oradei Michele 328.3339285 – Ravaioli Mirco 380.755 0051 INFO SOGGIORNOSi prega di prestare il massimo rispetto e silenzio per gli altri ospiti del villaggio.Al momento dell’arrivo il capofamiglia è pregato di consegnare copia dei documenti di identità di tutti i soggiornanti.E’ consentito l’ingresso di cani di piccola taglia e muniti di portantino. Sono gradite rassicurazioni sulla integrità dell’animale e sulle sue normali capacità di coabitazione. Le procedure di pulizia delle deiezioni del proprio animale vanno osservate a norma di legge."
