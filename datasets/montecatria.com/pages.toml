["https://www.montecatria.com/il-comprensorio"]
title = "Il Comprensorio – Ieri, oggi, domani – Monte Catria"
full_description = "la storia La Storia Storia e sviluppo del comprensorio montano del Monte Catria Il territorio del Catria è un luogo dove l’anima dell’uomo si fonde con la natura più incontaminata.Un luogo di pace e di incontro con la parte più profonda di se stessi alla ricerca di contemplazione, pensiero e suggestioni lontane dalla caotica quotidianità urbana. A tutto ciò si aggiunge la possibilità di vivere anche particolari esperienze per gli amanti del turismo itinerante per una vacanza all’insegna del benessere spontaneo e naturale all’aria aperta e di una calorosa ospitalità in un comprensorio che vede concentrate delle attività di ricezione e divertimento costruite nel pieno rispetto della natura. Oggi il Comprensorio del Monte Catria è formato da un insieme di attrattori turistici e sportivi ed è il risultato, ancora in evoluzione, di mille intuizioni e tanta determinazione imprenditoriale guidata dalla vocazione più caparbia e passionale di uomini dal cuore grande amanti della natura. Diverse persone della zona si sono prodigate per valorizzare questo territorio e hanno avuto buone intuizioni per renderlo fruibile e attrattivo. Una di queste persone è sicuramente Vincenzo Fatica l’allora sindaco di Frontone e tutt’oggi ancora una figura, davvero intraprendente e geniale, di importante riferimento per queste zone dell’entroterra marchigiano e per il tessuto economico locale. Tutto ha origine nel 1968 quando, Vincenzo Fatica, fece installare sulla piana del Monte Acuto una manovia con lo scopo di sperimentare la fattibilità di un eventuale progetto di stazione sciistica. 1968, Manovia Sperimentale in funzione 1968, Monte Acuto – Manovia Sperimentale in funzione L’esperimento, durato tutto l’inverno, ha un esito più che positivo ed innesca il meccanismo per realizzare il progetto: studio preliminare di fattibilità e richiesta dei fondi, che vengono assegnati con una prima tranche nel 1973 ed una seconda nel 1975 con lo scopo di costruire la funivia del Catria, Caprile-Monte Acuto. Nel 1979, il comune di Frontone con proprio finanziamento decide di completare il progetto, acquistando la sciovia/skylift delle Cotaline. Finalmente, dopo il completamento dei due impianti, nel 1980 la stazione sciistica del Monte Catria apre al pubblico e continua ad operare fino alla fine della stagione invernale del 1990, quando è costretta a chiudere per il danneggiamento subito alla funivia in seguito alla caduta di un fulmine.Tale chiusura perdura per un intero ventennio finché, nel 2009, grazie al sindaco di allora Giampiero Volpi che si impegna per il reperimento dei fondi necessari per la revisione della funivia e la sostituzione dello skilift, il comprensorio montano del catria riapre i suoi battenti.La svolta avviene quando un gruppo di amici, collaudati imprenditori locali, Michele Oradei – Mirco Ravaioli – Francesco Petrelli – Enzo Vampa animati dalla passione per la neve, la natura, la montagna, il bellissimo territorio in cui vivevano e degli sport invernali decidono di unirsi e raccolgono l’invito del Sindaco a definire un futuro concreto e fruibile di questa bellezza naturale che avevano visto protagonista da sempre nelle loro vite familiari. Nasce così la società Monte Catria Impianti con lo scopo di gestire il Comprensorio e soprattutto di ampliare, rimodernare e rinnovare con un progetto di sviluppo attento e ben calibrato gli impianti esistenti. Nel 2010 viene realizzato il Kinderland invernale e il Camposcuola per accogliere bambini e famiglie. Nel 2011 si attiva anche il Bike Park e il servizio per il noleggio degli sci e affini.Nel 2012 i soci Mirco, Michele, Francesco e il nuovo arrivato Savio decidono di acquisire anche la gestione del Rifugio Cotaline 1400 e contestualmente lo rinnovano creando un rifugio escursionistico con 7 camere e 30 posti letto. Il processo di rinnovamento del Comprensorio è oramai avviato e nel 2013 arriva il nuovo gatto delle nevi per la manutenzione delle piste e si lancia la sfida di diventare un luogo di interesse sportivo e di divertimento per gli sport invernali. Se nel 2015 inaugurano anche il Kinderland Adventure Park estivo che stimola l’arrivo costante e perpetuo di turisti e famiglie sul Catria è il 2017 l’anno di svolta in quanto, decisi a crescere e a diventare un punto di riferimento montano nel centro Italia, si concentrano su un piano di sviluppo ambizioso e di notevole portata che è in corso ancora oggi nel quale vede coinvolti e protagonisti la Regione Marche, la Provincia di Pesaro e Urbino e il Comune di Frontone. Infatti nel 2017 viene sostituito il vecchio skylift con la Seggiovia Triposto Cotaline e nel 2018 segue l’ammodernamento delle piste e l’ampliamento delle stesse con l’apertura di tutto il Versante Nord ancora mai utilizzato. Nel periodo 2020-2022 avviene il collaudo della nuova seggiovia Travarco che permette di utilizzare il nuovo ampliamento del versante nord fino a 1500 metri d’altezza e l’apertura al pubblico dopo il periodo di sosta forzata dovuta alla pandemia covid19. Ad oggi il Comprensorio Montano del Monte Catria comprende:10 Piste da Sci per un totale di 12 km di percorrenzaUn rifugio escursionistico con camere, Caffè-Bar e Ristorante-Self ServiceUn Family Kinderland ricco di attrazioni invernali ed estive per tutti i bambiniUn Kinderland Adventure Park per ragazzi dallo spirito goliardico e avventurosoIl Catria Nature Village per vivere e soggiornare nel boscoIl Rifugio dei Cavalli disponibili per passeggiate organizzatePiste per trekkingPiste per Mountain bikeSnowParkUn Background Jumping Big AirL’ Infermieria con defibrillatore e dotazione medica e kit di primo soccorso pediatrico e per adultiAttrezzature e tecnologie per il soccorso montano quali vari quad, motoslitte, gatto delle nevi, barella su slitta e personale qualificato Di questa storia rimane ad oggi il vissuto e i ricordi di quanti vengono qui per passeggiate, sport o per puro divertimento con le loro famiglie e i loro amici e di quanti semplicemente amano questo luogo e se lo sentono sulla pelle. Il Catria rimane nel cuore delle persone con le sue radici, i suoi panorami e le sue genti ospitali.A queste migliaia di persone che ogni anno visitano il nostro Comprensorio va il rispetto e la gratitudine di tutti noi per averlo reso sempre vivo e coerente con i suoi scopi originari.A questo pubblico possiamo dire che continueremo a investire, a crederci per crescere ancora e che importanti novità li aspettano in futuro per condividere e assistere con passione all’evoluzione naturale di un luogo tra i più belli e affascinanti del centro Italia.”Michele, Savio, Mirco e Francesco"
