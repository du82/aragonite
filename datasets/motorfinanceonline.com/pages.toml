["https://www.motorfinanceonline.com/comment/the-ripple-effects-of-turos-ipo-withdrawal-on-the-uk-car-sharing-market"]
title = "The ripple effects of Turo's IPO withdrawal on the UK car-sharing market - Motor Finance Online"
description = "Turo has abandoned its plans to go public. This decision has raised concerns about the P2P car-sharing market in the UK."
full_description = '''Comment The ripple effects of Turo’s IPO withdrawal on the UK car-sharing market Turo's decision to abandon its IPO plans and Getaround's US shutdown could have several implications for UK providers, including increased investor caution, market consolidation, regulatory scrutiny, and a potential decline in consumer appetite. Alejandro Gonzalez February 20, 2025 Share Copy Link Share on X Share on Linkedin Share on Facebook Picture Credit: Shutterstock.com Turo, the San Francisco-based car-sharing company, has abandoned its plans to go public nearly three years after initially filing for a US IPO. This decision has raised concerns about the P2P car-sharing market, especially following Getaround’s recent announcement to shut down its US operations. Despite being profitable, Turo’s financial performance has shown signs of slowing growth. The company’s adjusted EBITDA fell from US$81.1 million in 2021 to US$48.8 million by the end of 2023. In the first nine months of 2024, adjusted EBITDA dropped a further 46% year-on-year to US$25.6 million. Operating income also turned negative, shifting from a US$21.1 million profit in the first nine months of 2023 to a US$9.7 million loss over the same period in 2024. Go deeper with GlobalDataReportsImpact of Inflation on United Kingdom (UK) Personal Lines Insurance Market ReportsImpact of Inflation on the World Economy and Key Sectors (Agriculture, Automotive, Financial serv... Data Insights The gold standard of business intelligence. Find out more These financial challenges have undoubtedly influenced Turo’s decision to remain private, but what does this mean for the UK market? The UK has its own crop of car-sharing providers, including Zipcar, Drivy (now part of Getaround), Ubeeqo, Enterprise Car Club, Share Now, and Virtuo. Turo’s decision to abandon its IPO plans and Getaround’s US shutdown could have several implications for these providers. Turo’s decision and Getaround’s US shutdown could have several implications for these providers: Increased Investor Caution: Turo’s financial struggles may lead to increased caution among investors in the car-sharing market, reducing funding opportunities for UK-based companies. Market Consolidation: With Getaround focusing on Europe, there may be opportunities for consolidation in the UK market. Regulatory Scrutiny: Financial challenges may prompt regulators to impose stricter regulations, impacting operational costs and profitability. Consumer Confidence: The news may shake consumer confidence in the car-sharing market, requiring UK providers to reassure their customers of their stability. In response, UK car-sharing providers are likely to emphasise the opportunities for growth and innovation. This may be particularly relevant in markets where public transport is rundown and continues to be poorly incentivised by government, but elsewhere, where public transport will only improve, it feels like the writing is on the wall for the P2P car-sharing market. See Turo abandons US IPO amid slowing growth Share Copy Link Share on X Share on Linkedin Share on Facebook Go deeper with GlobalData Reports Impact of Inflation on United Kingdom (UK) Personal Lines Insurance Market Reports Impact of Inflation on the World Economy and Key Sectors (Agriculture, Automotive, Financial serv... Data Insights The gold standard of business intelligence. Find out more Related Company Profiles View All var hideshowcmpsExist = document.getElementsByClassName('hideshowcmps'); if (hideshowcmpsExist.length > 0) { document.getElementById("hideshowcmps").addEventListener("click", function(event) { event.preventDefault() let x = document.getElementsByClassName("hidecmp"); for (let i = 0; i < x.length; i++) { x.item(i).classList.toggle("showcmp") } var viewmore_btn = this.innerHTML; var viewless_btn = document.createElement('viewless_btn'); viewless_btn.innerHTML = viewmore_btn; if (viewless_btn.innerText === "View More") { this.innerHTML = "View Less"; } else