["https://moxa.com/en/about-us/corporate-responsibility/green-product-policies"]
title = "Hazardous Substance Policies"
full_description = "Explore our article library for a wealth of expert advice on improving your industrial network security. Learn how to unlock the secrets of your OT data to succeed with your industrial digital transformation. Protecting the health of humanity is imperative to Moxa. To reduce the impact of hazardous substances on humanity, Moxa follows the Green Product Management System (GPMS), to monitor hazardous substances throughout our supply chain. We always comply with local and international hazardous substance regulations. The Rotterdam Convention is a multilateral treaty to promote shared responsibilities in relation to the importation of hazardous chemicals. The convention was adopted on September 10, 1998, and entered into force on February 24, 2004. The Montreal Protocol is an international treaty designed to protect the ozone layer by phasing out the production of numerous substances that are responsible for ozone depletion. It was agreed on September 16, 1987, and entered into force on January 1, 1989. To ensure our products meet the latest RoHS standards, we have an active compliance program that extends to our key suppliers to guarantee that certain environmentally harmful materials are not used in the manufacturing of our products. Moxa’s products are in compliance with the POPs Regulation and do not contain substances subject to prohibitions listed in Annex I to Regulation (EU) 2019/1021. The aim of REACH is to improve the protection of human health and the environment from the risk of certain chemical substances. We are committed to guaranteeing that Moxa products and accessories are fully compliant with European Regulation (EC) 1907/2006. Moxa has taken early action to ensure all products have been designed and manufactured in compliance with the EU Directive 757/2010/EC on the restriction of the use of perfluorooctane sulfonate (PFOS) in electronic components. The goal of WEEE is to improve the environmental performance of all entities involved in the lifecycle of electrial and electronic equipment. All Moxa products carry the logo of WEEE to guarantee that they are compliant with the WEEE regulations with regard to the reuse, recycling, and final disposal of waste."
