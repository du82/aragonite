["https://mozilla.debian.net"]
title = "Debian Mozilla team APT archive"
full_description = "The Debian Mozilla team provides various versions of some Mozilla related packages for use on different Debian systems. The following wizard helps you to find the packages suitable for your system. WARNING: Jessie and Stretch backports of Firefox release and beta are gone because of the requirement of rust to build them, which is not available in Jessie or Stretch. Please update your apt sources to use Firefox ESR instead. You need to add the following entry in /etc/apt/sources.list or a new file in /etc/apt/sources.list.d/: The mozilla.debian.net archive is signed, so APT may complain until you add the archive key to your APT keyring. You can do so by installing the pkg-mozilla-archive-keyring package. Once installed, you can check the key with the following command (requires the debian-keyring package to be installed): The latter message about signature not being checked is expected, as the archive key is signed by two keys, but only one being in the Debian keyring at a given moment: 54FD2A58 is an old key that is going to be deprecated and replaced with A6AA8C72. You can thus also expect the last signature validation to differ depending on the Debian keyring version you use. You may want to check the trust path from your key to the one that signed the archive key. Or you can choose to trust the Debian keyring."
author = "Mike Hommey"
year_published = 2025
clearnet = "https://mozilla.debian.net"
tags = ["debian", "mozilla", "team", "warning"]
language = "en"
