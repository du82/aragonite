title = "حمِّل فيَرفُكس لِسطح المكتب — من موزيلا"
description = "احصل على فيَرفُكس لـ Windows أو Mac أو Linux. يُعتبر متصفح فيَرفُكس متصفح مجاني مدعوم من مؤسسة موزيلا الغير ربحية التي تُكرس جهودها للحفاظ على سلامتك وخصوصيتك على الإنترنت."
full_description = "متصفّح فَيَرفُكس احصل على المُتصفح الذي يحمي بياناتك المُهمة سرعة واعتمادية وخصوصية — للاستمتاع براحة البال على الإنترنت. تنزيل فيَرفُكس لم يُعد Firefox مدعومًا على Windows 8.1 والإصدارات الأقدم. يُرجى تنزيل Firefox ESR (إصدار الدعم المُمتد) لاستخدام فيَرفُكس. تنزيل Firefox ESR 64-بت تنزيل Firefox ESR 32-بت تنزيل بنية مختلفة لم يُعد Firefox مدعومًا على macOS 10.14 والإصدارات الأقدم. يُرجى تنزيل Firefox ESR (إصدار الدعم المُمتد) لاستخدام فيَرفُكس. تحميل Firefox ESR إشعار خصوصية فيَرفُكس خيارات التنزيل واللغات الأخرى دعم متصفّح فَيَرفُكس افعل كل ما يَحلو لك على الإنترنت. فقد وفّر متصفّح فَيَرفُكس لك كل ما تحتاج. نحجب المتعقِّبات الإعلانية، لتتمكن من تصفح الإنترنت على نحو أسرع. تتسبّب الإعلانات في تشتيت الانتباه وإبطاء تحميل صفحات الإنترنت، وتراقِب الأدوات التي تتعقب تلك الإعلانات كل خطوة تخطوها على الإنترنت. ونظرًا لأن متصفّح فَيَرفُكس يحجب معظم أدوات التعقُّب تلقائيًا، فلا داعي للبحث في إعدادات الأمان. اطَّلِع على تقرير الحماية مُتصفح فيَرفُكس يناسب الجميع يتوفر مُتصفح فيَرفُكس بأكثر من 90 لغة، ويتوافق مع أنظمة التشغيل Windows وMac وLinux، ويعمل بكامل طاقته بغض النظر عن الأجهزة التي تستخدمها أو المكان الذي تتواجد فيه. فتأكد من تحديث نظام التشغيل على جهازك للحصول على أفضل تجربة. راجِع متطلبات النظام ثبِّت فيَرفُكس على جميع أجهزتك استمتع بخصوصيك على الإنترنت أينما كنت. فمُتصفحات مُتصفّحات فيَرفُكس المُخصصة لأنظمة التشغيل iOS وAndroid لها نفس إعدادات الخصوصية القوية لحجب أدوات التعقب ومنعها من تعقُّبك على الإنترنت، أينما كنت. استمتع بكل ما يلي باستخدام فيَرفُكس ابحث بطريقة أذكي وأسرع بحث من شريط العناوين خيارات محرّكات البحث اقتراحات بحث ذكية علامة مرجعية وسِجِل وفتح علامة تبويب في نتائج البحث عزِّز إنتاجيتك توافُق مع منتجات جوجل أداة مُدمجة لأخذ لقطات الشاشة مدير علامات مرجعية اقتراح تلقائي لعناوين URL مزامنة بين الأجهزة وضع القارئ تدقيق إملائي علامات تبويب مثبتة استمتع بالبث والمشاركة واللعب حظر التشغيل التلقائي للفيديو والصوت صورة-في-صورة (PiP) محتوى مُنسَّق في علامة تبويب جديدة مشاركة الروابط احمِ خصوصيتك حَجب ملفات تعريف الارتباط الخاصة بالأطراف الثالثة حَجب مسجِّلات البصمات حجب التنقيب الإلكتروني عن العمليات المشفرة وضع التصفّح الخاص تقرير الحماية الفردية أمّن معلوماتك الشخصية تنبيهات بشأن المواقع الإلكترونية المخترقة مدير كلمات مُرور مُدمج مسح السِجِل إكمال تلقائي للنماذج تحديثات تلقائية خصّص متصفّحك سمات وضع داكن مكتبة الملحقات ضبط إعدادات شريط البحث تغيير تخطيط علامة التبويب الجديدة تنزيل فيَرفُكس لم يُعد Firefox مدعومًا على Windows 8.1 والإصدارات الأقدم. يُرجى تنزيل Firefox ESR (إصدار الدعم المُمتد) لاستخدام فيَرفُكس. تنزيل Firefox ESR 64-بت تنزيل Firefox ESR 32-بت تنزيل بنية مختلفة لم يُعد Firefox مدعومًا على macOS 10.14 والإصدارات الأقدم. يُرجى تنزيل Firefox ESR (إصدار الدعم المُمتد) لاستخدام فيَرفُكس. تحميل Firefox ESR إشعار خصوصية فيَرفُكس اجعل فيَرفُكس متصفحك الخاص ملحقات لكل ما هو ممتع ومهم ثمة ملحقات تناسب كل الأشخاص للأمان والأخبار والألعاب وغيرها. أضِف منها ما تريد حتى يصبح متصفحك مناسبًا لك تمامًا. غيِّر شكل متصفحك انتقل من الوضع الفاتح إلى الوضع الداكن حسب حالتك المزاجية أو تفضيلاتك، أو جرِّب إضفاء بعض البهجة والحيوية على الأشياء باستخدام سِمة مخصصة (مثل، قوس قزح أحادي القرن). عدِّل إعداداتك لا داعي للحلول المؤقتة. غيِّر صفحة علامة التبويب الجديدة وشريط البحث والعلامات المرجعية والمزيد لاستكشاف الإنترنت بالطريقة التي تُعجبك. المتصفح مدعوم من منظمة غير هادفة للربح تضع عُملاءها على رأس أولوياتها نتحدى الوضع الراهن منذ عام 1998 طوَّرت شركة موزيلا متصفح فيَرفُكس ليكون بديلًا أسرع وأكثر خصوصية لمتصفحات مثل، Internet Explorer وChrome. وإلى وقتنا الحاضر، تُواصل شركتنا التي تُحركها مهمة نبيلة ومجتمعنا التطوعي وضع خصوصيتك فوق كل اعتبار. نضع خصوصيتك على رأس أولوياتنا مع انتشار الإنترنت وتغيُّر أنماطه، يُواصل متصفح فيَرفُكس التركيز على حقك في الخصوصية — وهذا هو شغلنا الشاغل دائمًا. تعرّف على المزيد عن ممارسات البيانات المتبعة لدينا في إشعار الخصوصية. احتفظ بجميع ميزات المُتصفح المفضلة لديك - واكتشف ميزات جديدة. توافُق مع منتجات جوجل تعمل جميع أدوات جوجل المُفضلة لديك (مثل Gmail وDocs) بسلاسة في متصفّح فَيَرفُكس. حاوية فيسبوك نزِّل ملحق المتصفح هذا لمنع فيسبوك (وإنستغرام) من تتبعك على الإنترنت. مزامنة أجهزتك يتوفّر مُتصفح فيَرفُكس على جميع أجهزتك؛ وبهذا يُمكنك استخدام علامات التبويب والسِجل والعلامات المرجعية أينما كنت. كل ما تحتاجه هو حساب Mozilla وستتمكّن من الوصول إلى المزامنة وغيرها من منتجات موزيلا. لقطات الشاشة التقط صورة عالية الدقة لأي شيء عبر الإنترنت باستخدام أداة لقطة شاشة المُضمنة في المتصفح الحماية المُحسّنة من التعقب (ETP) يَعمل مُتصفح فيَرفُكس تلقائيًا على منع العديد من أدوات التعقب الخارجية من جمع الأنشطة التي تقوم بها عبر الإنترنت وبيعها. صورة-في-صورة (PiP) يُمكنك مشاهدة الفيديو المفتوح حتى إذا كنت مشغولًا بِعدة مهام؛ كمُشاهدة برنامج تعليمي على الويب أو متابعة فريقك المفضل. تنزيل فيَرفُكس لم يُعد Firefox مدعومًا على Windows 8.1 والإصدارات الأقدم. يُرجى تنزيل Firefox ESR (إصدار الدعم المُمتد) لاستخدام فيَرفُكس. تنزيل Firefox ESR 64-بت تنزيل Firefox ESR 32-بت تنزيل بنية مختلفة لم يُعد Firefox مدعومًا على macOS 10.14 والإصدارات الأقدم. يُرجى تنزيل Firefox ESR (إصدار الدعم المُمتد) لاستخدام فيَرفُكس. تحميل Firefox ESR إشعار خصوصية فيَرفُكس هل لديك أسئلة؟ يمكنك الحصول على الجواب من دعم موزيلا. متصفّح فَيَرفُكس احصل على متصفّح فَيَرفُكس لنظام تشغيل Android احصل على متصفّح فَيَرفُكس لنظام تشغيل iOS نزِّل متصفح فيَرفُكس للهواتف المحمولة لحماية جميع أجهزتك تلقائيًا. تعرَّف على مُتصفح فيَرفُكس لأجهزة الكمبيوتر أدناه"
