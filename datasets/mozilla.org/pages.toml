["https://mozilla.org/el"]
title = "Mozilla: Το διαδίκτυο για τους ανθρώπους, όχι για το κέρδος"
description = "Εργαζόμαστε για να επαναφέρουμε τον έλεγχο του διαδικτύου στα χέρια των ανθρώπων που το χρησιμοποιούν."
full_description = "Παύση εφέ κίνησης Αναπαραγωγή εφέ κίνησης Καλώς ορίσατε στη Mozilla Από αξιόπιστες τεχνολογίες μέχρι πολιτικές που υπερασπίζονται τα ψηφιακά σας δικαιώματα, προτεραιότητά μας είστε πάντοτε εσείς. Μάθετε για εμάς Μια στυλιζαρισμένη πράσινη σημαία σε μαύρο φόντο, αποτελούμενη από το «M» της Mozilla και ένα pixel που έχει τοποθετηθεί με τέτοιο τρόπο, ώστε να θυμίζει το αρχικό λογότυπο με τον δεινόσαυρο. Μια στυλιζαρισμένη πράσινη σημαία σε μαύρο φόντο, αποτελούμενη από το «M» της Mozilla και ένα pixel που έχει τοποθετηθεί με τέτοιο τρόπο, ώστε να θυμίζει το αρχικό λογότυπο με τον δεινόσαυρο. Αγαπήστε ξανά το διαδίκτυο Απαλλαγείτε από τους τεχνολογικούς κολοσσούς· τα προϊόντα μας δίνουν σε εσάς τον έλεγχο για μια πιο ασφαλή και πιο ιδιωτική εμπειρία στο διαδίκτυο. Firefox: Αποκτήστε τη βέλτιστη επιλογή για γρήγορη και ιδιωτική περιήγηση, όπου έχετε τον απόλυτο έλεγχο. Thunderbird: Απλοποιήστε τη ζωή σας με μία εφαρμογή για όλα τα email, τα ημερολόγια και τις επαφές σας. Fakespot: Εντοπίστε ψευδείς κριτικές, προϊόντα κακής ποιότητας και αναξιόπιστους πωλητές. Pocket: Αποθηκεύστε το καλύτερο περιεχόμενο του διαδικτύου σε οποιαδήποτε συσκευή. Γιατί ποιος έχει τον χρόνο να διαβάσει όλα τώρα; Mozilla VPN: Διατηρήστε την τοποθεσία σας και τις διαδικτυακές σας περιπέτειες ιδιωτικές· κάντε streaming σαν να ήσασταν ντόπιοι, οπουδήποτε. Mozilla Monitor: Λάβετε μια προειδοποίηση αν κινδυνεύουν τα προσωπικά σας δεδομένα και προστατεύστε τα σαν επαγγελματίες. Firefox Relay: Αποκρύψτε το email και τον αριθμό τηλεφώνου σας για να λαμβάνετε μόνο τα μηνύματα που θέλετε. Εξερευνήστε τα προϊόντα μας Κάντε δωρεά στη μη κερδοσκοπική Mozilla Η Mozilla αναπτύσσει ένα κίνημα για να διεκδικήσει ξανά το διαδίκτυο. Μαζί μπορούμε να διαμορφώσουμε ένα μέλλον, όπου το απόρρητό μας θα προστατεύεται, η τεχνητή νοημοσύνη θα είναι αξιόπιστη και οι ανεύθυνες εταιρείες τεχνολογίας θα λογοδοτούν. Αλλά αυτό είναι δυνατό μόνο ενώσουμε τις δυνάμεις μας. Είμαστε ένας περήφανα μη κερδοσκοπικός οργανισμός. Θα κάνετε δωρεά στη Mozilla σήμερα; Δωρεά Συμμετέχετε στο κίνημα: ΤΝ για τους ανθρώπους Αποστολή μας είναι να καταστήσουμε εύκολη για τους ανθρώπους την ανάπτυξη και τη συνεργασία με μια αξιόπιστη τεχνητή νοημοσύνη ανοικτού κώδικα. Common Voice Προϊόν Δωρίστε τη φωνή σας για να κάνετε την τεχνολογία ομιλίας πιο συμπεριληπτική και προσβάσιμη για όλους. Δωρίστε τη φωνή σας Μπορεί η τεχνητή νοημοσύνη να είναι αξιόπιστη; Εκδήλωση Σε έναν κόσμο όπου η καινοτομία της τεχνητής νοημοσύνης καθοδηγείται από λίγους εκλεκτούς, παραμονεύει ο κίνδυνος ενός μονοπωλείου για αυτήν την τεχνολογία. Η εφαρμογή ιδεών ανοικτού κώδικα στην τεχνητή νοημοσύνη μπορεί να το αλλάξει αυτό. Παρακολούθηση Lumigator Προϊόν Βρείτε το κατάλληλο LLM για τις ανάγκες, την περίπτωση χρήσης και τα δεδομένα σας. Έναρξη Mozilla Ventures Πρόγραμμα Έχετε μια νεοφυή επιχείρηση στα πρώιμα στάδιά της; Παρουσιάστε τη στο Mozilla Ventures και εξασφαλίστε χρηματοδότηση για να φέρετε μια θετική αλλαγή στο μέλλον της τεχνητής νοημοσύνης και του διαδικτύου. Διαβάστε περισσότερα Llamafile Έργο Εύκολη εκτέλεση μεγάλων γλωσσικών μοντέλων (LLM) στον υπολογιστή σας με το Llamafile, χωρίς να απαιτείται εγκατάσταση, ενώ τα δεδομένα σας παραμένουν ασφαλή στη συσκευή σας. Έναρξη Mozilla Builders Πρόγραμμα Η δράση «Mozilla Builders» βοηθά ανεξάρτητους προγραμματιστές να δημιουργήσουν καινοτόμα έργα ΤΝ ανοικτού κώδικα μέσω εξατομικευμένων συνεργασιών, του προγραμματισμού και της κοινότητας. Διαβάστε περισσότερα Εσείς, η τεχνητή νοημοσύνη και το διαδίκτυο· τι πραγματικά συμβαίνει; Τύπος Δημιουργός Θέμα Εισαγωγή Άρθρο Laura Chambers Απόρρητο και ασφάλεια Παρουσίαση του Anonym: Ανεβάζοντας τον πήχη για τις ψηφιακές διαφημίσεις που διατηρούν το απόρρητό σας. Άρθρο Saoud Khalifah Τεχνητή νοημοσύνη Η συνεχής προστασία των τεχνολογιών GenAI αποτελεί κοινή ευθύνη. Podcast IRL Podcast Τεχνητή νοημοσύνη Από το Χόλιγουντ μέχρι τη χιπ χοπ, οι καλλιτέχνες συζητούν σχετικά με τη συναίνεση για τη χρήση των δεδομένων από την τεχνητή νοημοσύνη. Βίντεο Rebecca Smith Ειδήσεις Η Mozilla τιμά τους πρωτοποριακούς δημιουργούς στη νέα σειρά ντοκιμαντέρ «Firefox Presents». Podcast IRL Podcast Τεχνητή νοημοσύνη Η κυριαρχία των τεχνολογικών κολοσσών επί της γλώσσας σημαίνει κυριαρχία επί των ανθρώπων. Η Bridget Todd συνομιλεί με τους ηγέτες της γλωσσικής κοινότητας ανοίγοντας τον δρόμο για την ανάπτυξη της φωνητικής τεχνητής νοημοσύνης στις δικές τους γλώσσες και διαλέκτους. Podcast IRL Podcast Τεχνητή νοημοσύνη Γιατί νιώθουμε τόσο συχνά σαν να συμμετέχουμε σε κάποιο μαζικό πείραμα τεχνητής νοημοσύνης; Ποιος είναι ο υπεύθυνος τρόπος δοκιμής νέων τεχνολογιών; Η Bridget Todd εξερευνά τη σημασία του να ζει κανείς με αναπόδεικτα συστήματα τεχνητής νοημοσύνης, που επηρεάζουν εκατομμύρια ανθρώπους, ενώ εξαπλώνονται στη δημόσια ζωή. Άρθρο Kristina Bravo Απόρρητο και ασφάλεια Τα παιδιά μεγαλώνουν σε έναν διαδικτυακό κόσμο. Τι πρέπει να κάνει ένας ανήσυχος γονέας; Κατάσταση της Mozilla Η Mozilla επαναπροσδιορίζει τον εαυτό της, διαφοροποιείται γύρω από ένα σύνολο οργανισμών, ανανεώνει τη διαφήμιση και δημιουργεί ένα ανοικτού κώδικα οικοσύστημα τεχνητής νοημοσύνης. Διαβάστε περισσότερα στην αναφορά σχετικά με την κατάσταση της Mozilla για το 2024. 2024 Διαβάστε την αναφορά Εξερευνήστε τα θέματα που διαμορφώνουν το μέλλον του διαδικτύου *Privacy Not Included Αναζητήστε τις κριτικές μας για να δείτε ποιες τεχνολογικές συσκευές και εφαρμογές διακινούν ύπουλα τα δεδομένα σας. Αναζήτηση IRL Podcast Το πολυβραβευμένο μας podcast παρουσιάζει τους αρωγούς αλλαγής που εργάζονται για να κάνουν το διαδίκτυο πιο ασφαλές και την τεχνητή νοημοσύνη πιο αξιόπιστη. Ακρόαση"
