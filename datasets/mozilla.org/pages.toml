title = "Firefox Developer Edition"
description = "Firefox Developer Edition - неверагодна хуткі браўзер, які прадстаўляе перадавыя інструменты распрацоўкі і найноўшыя магчымасці, такія як падтрымка CSS-сеткі і адладка фрэймворкаў"
full_description = "Firefox Developer Edition Сардэчна запрашаем да вашага новага ўлюбёнага браўзера. Атрымайце доступ да найноўшых магчымасцяў, хуткадзейнасці і інструментаў распрацоўкі, патрэбных для пабудовы адкрытага інтэрнэту. Firefox Developer Edition — Беларуская Windows 64-bit Windows 64-bit MSI Windows ARM64/AArch64 Windows 32-bit Windows 32-bit MSI macOS Linux 64-bit Linux 32-bit Ваша сістэма можа не задавальняць патрабаванням Firefox, але вы можаце паспрабаваць адну з гэтых версій: Firefox Developer Edition — Беларуская Windows 64-bit Windows 64-bit MSI Windows ARM64/AArch64 Windows 32-bit Windows 32-bit MSI macOS Linux 64-bit Linux 32-bit Firefox Developer Edition больш не падтрымліваецца на Windows 8.1 і ніжэй. Калі ласка, сцягніце Firefox ESR (выпуск з пашыранай падтрымкай), каб выкарыстоўваць Firefox. Сцягнуць Firefox ESR (64-біт) Сцягнуць Firefox ESR (32-біт) Сцягнуць іншую зборку Firefox Developer Edition больш не падтрымліваецца на macOS 10.14 і ніжэй. Калі ласка, сцягніце Firefox ESR (выпуск з пашыранай падтрымкай), каб выкарыстоўваць Firefox. Сцягнуць Firefox ESR Firefox Developer Edition Firefox Developer Edition Firefox Developer Edition Firefox Developer Edition Firefox Developer Edition Firefox Developer Edition Download for Linux 64-bit Download for Linux 32-bit Паведамленне аб прыватнасці Firefox Using Debian, Ubuntu or any Debian-based distribution? You can set up our APT repository instead. Firefox Developer Edition аўтаматычна ажыццяўляе зваротную сувязь з Mozilla. Падрабязней Firefox Developer Edition Браўзер, створаны для распрацоўшчыкаў All the latest developer tools in beta in addition to features like the Multi-line Console Editor and WebSocket Inspector. Асобны профіль і шлях, каб вы маглі лёгка запусціць яго адначасова з рэлізам Firefox або Firefox Beta. Параметры прыстасаваныя для вэб-распрацоўшчыкаў: браўзерная і аддаленая адладка тыпова ўключаны, як і цёмная тэма і кнопка прылад распрацоўшчыка на панэлі інструментаў. Новыя прылады Неактыўны CSS Firefox DevTools цяпер зацяняюць дэкларацыі CSS, якія не маюць эфекту на старонцы. Пры навядзенні курсора на значок інфармацыі вы ўбачыце карыснае паведамленне пра тое, чаму CSS не прымяняецца, з падказкай, як выправіць праблему. Падрабязней Новыя прылады Firefox DevTools Новыя Firefox DevTools магутныя, гнуткія і адкрытыя для змянення. Сярод іх - лепшы ў сваім класе адладчык JavaScript, збудаваны на React і Redux, здольны працаваць з рознымі браўзерамі. Падрабязней Інавацыйныя магчымасці Кіраванне CSS-сеткай Firefox - гэта адзіны браўзер з інструментамі, створанымі адмыслова для распрацоўкі і дызайну з дапамогай CSS-сеткі. Гэтыя інструменты дазваляюць візуалізаваць сетку, паказваць звязаныя назвы абшараў, папярэдне праглядаць трансфармацыі на сетцы, і шмат іншага. Падрабязней Хутчэйшая інфармацыя Панэль шрыфтоў Новая панэль шрыфтоў у Firefox DevTools дае хуткі доступ да ўсёй неабходнай інфармацыі аб шрыфтах, выкарыстаных у элеменце. Яна таксама ўключае цэнныя звесткі кшталту крыніцы шрыфту, памеру, стылю і іншае. Падрабязней Распрацоўвайце. Праграмуйце. Тэстуйце. Паляпшайце. Будуйце і паляпшайце свае сайты з дапамогай Firefox DevTools Інспектар Даследуйце і ўдасканальвайце код, каб ствараць ідэальныя праекты. Падрабязней пра Інспектар старонкі Кансоль Асочвайце CSS, JavaScript, а таксама праблемы сеткі і бяспекі. Падрабязней пра вэб-кансоль Адладчык Магутны адладчык JavaScript з падтрымкай вашага упадабанага фрэймворка. Падрабязней пра адладчык JavaScript Сетка Кантралюйце сеткавыя запыты, якія могуць запаволіць або блакаваць ваш сайт. Падрабязней пра манітор сеткі Панэль сховішча Дадавайце, змяняйце і ачышчайце кэш, кукі, звесткі баз даных і сеансаў. Падрабязней пра панэль сховішча Рэжым адаптыўнага дызайну Тэстуйце сайты на эмуляваных прыладах у вашым браўзеры. Падрабязней пра рэжым адаптыўнага дызайну Візуальнае рэдагаванне Дакладна наладжвайце анімацыю, раўнаванне і водступы. Падрабязней пра візуальнае рэдагаванне Прадукцыйнасць Разблакуйце ву