description = "Firefox browser for Android is fast, secure and private from the first time you open it."
full_description = "firefox-ios-firefox-browser Shortcut the internet with Firefox for Android See all your open tabs, recent searches and favorite sites all in one place with Firefox browser for Android. Get Firefox for Android Send a download link to your phone. Your download link was sent. Please enter an email address. An error occurred in our system. Please try again later. Enter your email Send The intended recipient of the email must have consented. Learn more Check your device for the email! Send to another device Fast and Private Firefox for Android delivers effortless privacy protection with lighting-fast page loads. Enhanced Tracking Protection automatically blocks online trackers from following you around the web and slowing down your pages. One tap to private mode Get to Private Browsing Mode with just one tap. And when you close Private Browsing Mode, your browsing history is automatically erased from your device. Search your own way Got a big phone and normal sized thumbs? No problem. Firefox for Android lets you move the search bar from the top to the bottom making it easier to use with one hand. You can also choose your own search engine within the browser, and set Firefox as your default browser if you want. Save power with Dark Mode Switch to Dark Mode any time to reduce eye strain and prolong your battery power. Own your home screen Get to the parts of the internet you care about faster. Choose to see all your open tabs, recent searches, bookmarks and favorite sites all in one place. Supercharge Firefox with Add-ons Add-ons are like powerful little tools you can add to your browser to do things like increase default privacy settings and customize your experience. Pick up where you left off Go from your phone to your laptop, tablet and back without skipping a beat. With Firefox on all your devices, you can take your bookmarks, passwords, saved logins and browsing history wherever you go. Search from your phone’s home screen No need to open the app. Add the Firefox search widget and search the web directly from your device’s home screen. Pin videos to your screen Pop videos out of their websites or players and pin them to the top of your phone’s screen to watch while you surf the web and do other things. Stay entertained while you multitask. About Mozilla Mozilla exists to build the Internet as a public resource accessible to all because we believe open and free is better than closed and controlled. We build products like Firefox and Pocket to promote choice, transparency and control."
