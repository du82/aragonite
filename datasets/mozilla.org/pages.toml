title = "Firefox Privacy Notice — Mozilla"
full_description = "At Mozilla, we believe that privacy is fundamental to a healthy internet That’s why we build Firefox, and all our products, to give you greater control over the information you share online and the information you share with us. In this Privacy Notice, we explain what data we process, how we process it, and for what purposes. Then, we explain how you can exercise choices about how we process your information. How is your data used? To provide you with the Firefox browser Mozilla collects certain data, like technical and settings data, to provide the core functionality of the Firefox browser and associated services, distinguish your device from others, remember and respect your settings, and provide you with default features such as New Tab, PDF editing, password manager and Total Cookie Protection. You can further customize your Firefox experience by adjusting your controls, buttons, and toolbars and adding features with add-ons. Some Firefox features, like automated translation for web pages and “alt-text” suggestions when you upload images in your PDFs, are powered by artificial intelligence (AI) based on small language models downloaded to your device. These operate locally — web page content, PDFs, images and tab URLs stay on your device and are not sent to Mozilla’s servers or used for training purposes without your explicit consent. Note that other Firefox features may integrate third-party AI models, as further detailed in this Notice. More details, including how to adjust your data settings: You can read more detailed information about the information we collect for Desktop, Android or iOS. You can update your data collection settings for Desktop and Mobile at any time. To adapt Firefox to your needs Firefox processes a variety of personal data in a way that does not leave your device, such as browsing history, web form data, temporary internet files, and cookies. This means the data stays on your device and is not sent to Mozilla’s servers unless it says otherwise in this Notice. If you choose to allow it, your precise location may also be processed for location-related functionality for websites like Google Maps; this data is only accessed from your device by the website(s) you choose to enable it for — it is not sent to Mozilla's servers. More details, including how to adjust your data settings: Data processed on your device remains in your control. You can manage your browsing data and your local storage settings, or update your location permissions at any time. To provide and improve search functionality When you perform a search in Firefox, your search query, device data and location data will be processed by your default search engine (according to their applicable Privacy Notice) to provide your search results and search suggestions. Firefox also shows its own search suggestions based on information stored on your local device (including recent search terms, open tabs, and previously visited URLs). These suggestions may include sponsored suggestions from Mozilla’s partners, relevant content from common internet resources (such as Wikipedia), or relevant URLs that are popular in your country. Mozilla processes certain technical and interaction data, such as how many searches you perform, how many sponsored suggestions you see and whether you interact with them. Mozilla's partners receive de-identified information about interactions with the suggestions they've served. You can enable or disable Search suggestions at any time. Depending on your location, Mozilla derives the high level category (e.g., travel, shopping) of your search from keywords in that query, in order to understand the types and number of searches being made. We utilize privacy preserving technologies such that Mozilla only learns that someone, somewhere, performed a search relating to a particular category, without knowing who. Learn more about how we categorize searches, including how to opt out. Mozilla may also receive location-related keywords from your search (such as when you search for “Boston”) and share this with our partners to provide recommended and sponsored content. Where this occurs, Mozilla cannot associate the keyword search with an individual user once the search suggestion has been served and partners are never able to associate search suggestions with an individual user. You can remove this functionality at any time by turning off Sponsored Suggestions — more information on how to do this is available in the relevant Firefox Support page. You may be able to opt into an enhanced search experience, which will result in Mozilla processing additional personal data, including your technical data, location and search data. Some of that information may be shared with our partners on a de-identified and/or aggregated basis. See our “Data and Firefox Suggest” blog post for more details. More details, including how to adjust your data settings: You can update your Search settings and Search suggestion features, at any time, and learn more about how we categorize searches. To serve relevant content and advertising on Firefox New Tab We use technical data, language preference, and location to serve content and advertising on the Firefox New Tab page in the correct format (i.e. for mobile vs desktop), language, and relevant location. Mozilla collects technical and interaction data, such as the position, size, views and clicks on New Tab content or ads, to understand how people are interacting with our content and to personalize future content, including sponsored content. This data may be shared with our advertising partners on a de-identified or aggregated basis. In some instances, when ads are enabled on New Tab, additional browsing data may also be processed locally on your device to measure the effectiveness of those ads; such data will only be shared with Mozilla and/or our advertising partners via our privacy-preserving technologies on an aggregated and/or de-identified basis. When a user visits a third-party website by clicking an advertisement or link in Firefox, that site may use cookies and other web APIs available to any website to collect data subject to that website’s privacy and/or cookie notices. More details, including how to adjust your data settings: You can read more information about how to manage your New Tab page including your data settings. You can opt out of having your data processed for personalization or advertising purposes by turning off “technical and interaction data” on Desktop and Mobile at any time. To provide Mozilla accounts If you sign up for a Mozilla account, we process additional information alongside the data set out in this Notice, such as account details, contact information and sync data, in accordance with the Mozilla Accounts Privacy Notice. To provide AI Chatbots You have the option to use a third-party AI chatbot of your choice to help you with things like summarizing what you’re reading, writing and brainstorming ideas, subject to that provider’s terms of use and privacy notice. If you choose to enable a chatbot in the sidebar and/or through a shortcut, Mozilla does not have access to your conversations or the underlying content you input into the selected chatbot. We do collect technical and interaction data on how this feature is used to help improve Firefox, such as how often each third-party chatbot provider is chosen, how often suggested prompts are used, and the length of selected text. More details, including how to adjust your data settings: You can read more about how to manage or remove AI chatbots in Firefox. To provide Review Checker, including serving sponsored content Review Checker is a Firefox feature that helps you determine whether reviews are reliable when you shop online with sites like Amazon.com, BestBuy.com and Walmart.com. If you opt in to using Review Checker, Mozilla will process information about the website and the product identifier of the products you view using our privacy preserving technology called OHTTP. OHTTP combines encryption and a third party intermediary server, helping prevent Mozilla from linking you or your device to the products you have viewed. We also collect technical and interaction data on how this feature is used to help improve Firefox. By opting in to using Review Checker you also agree to be shown product recommendations and sponsored content. If you do not want to receive product recommendations and sponsored content, you can opt out of this feature under Review Checker settings at any time. More details, including how to adjust your data settings: You can read more information about How to use Firefox Review Checker and how we implement privacy preserving tech such as OHTTP. To provide and enable add-ons (addons.mozilla.org) You can install add-ons from addons.mozilla.org (“AMO”) or from the Firefox Add-ons Manager, which is accessible from the Firefox menu button in the toolbar. We process your search queries in the Add-ons Manager to be able to provide you with suggested add-ons. If you choose to install any add-ons, Firefox will process technical, location and settings data, and periodically connect with Mozilla’s servers to install and apply the correct updates to your add-ons. We also collect technical and interaction data on usage of add-ons, to help improve Firefox. When you visit the AMO website, Mozilla collects technical and interaction data about your usage of the site in accordance with our Mozilla Websites, Communications and Cookies notice. More details, including how to adjust your data settings: Learn how to remove or enable add-ons. You can also review the Privacy Notice for the add-ons website. To maintain and improve features, performance and stability Mozilla runs studies within Firefox and makes certain experimental features available through Firefox Labs to test different features and ideas before they’re made available to all Firefox users or become part of the core Firefox offering — this allows us to make more informed decisions about what our users want and need. This research uses technical, system performance, location, settings and interaction data. We also need to process data to keep Firefox operational, improve features and performance, and identify, troubleshoot and diagnose issues. For this we use technical, location and settings data, as well as interaction and system performance data (such as number of tabs open, memory usage or the outcome of automated processes like updates). In the rare situations where the information needed also includes limited browsing data (e.g., Top Level Domain annotations for page-load performance monitoring), it will be transmitted using OHTTP; this helps prevent Mozilla from linking you or your device to the data collected for this purpose. On Desktop and Android, if Firefox encounters an unexpected issue, the Mozilla Crash Reporter will also ask if you wish to send us additional information, which may include sites that were open at the time of the crash and other browsing data. On Desktop and Android if you opt in to sending us crash reports automatically, we collect this information without prompting you each time; on iOS, crash reports contain less information and are sent automatically to us by default. You can change your settings at any time. More information, including how to adjust your data settings: You can learn more about the studies you’re enrolled in and opt out of all (or a specific) studies at any time, and opt into experimental features through Firefox Labs. You can also learn more about the technical and interaction data we process, including how to turn it off. To improve security Because maintaining the latest version of Firefox helps keep you safe against vulnerabilities, desktop versions of Firefox regularly connect to Mozilla’s servers (or another service that you used to install Firefox) to check for software updates; updates for Android and iOS versions of Firefox are managed by Google’s Play Store and Apple’s App Store, respectively. We also process technical data and settings data to protect against malicious add-ons. In addition to these standard processes, we use Google’s Safe Browsing Service to protect you from malicious downloads and phishing attacks, and validate web page and technical data with Certificate Authorities. As part of our work to improve privacy and security for all internet users, we collect technical data via OHTTP, to better understand, prevent and defend against fingerprinting. For some Firefox users, Firefox routes DNS requests to a resolver service that has agreed to Mozilla’s strict privacy standards for resolvers. This provides added protection from privacy leaks to local networks and also from certain DNS security attacks. System logs of your DNS requests are deleted from the service within 24 hours and are only used for the purpose of DNS resolution. Learn more about DNS over HTTPS. More details, including how to adjust your data settings: Upgrades and add-ons blocklist, Google’s Safe Browsing Service, OHTTP, To understand usage of Firefox We process data to better understand how you engage with our services, such as how much you use Firefox, your language preference, how often you use our search tools or interact with search suggestions, how fast pages load for you and how many ads or CAPTCHAs you see. This allows us to measure how people access and use our services, which helps improve our business and the functionality of Firefox. More details, including how to adjust your data settings: You can update your data collection settings for Desktop and Mobile at any time (note that deselecting “Allow Firefox to send technical and interaction data to Mozilla” will not impact the Daily Usage Ping). This Daily Usage Ping solely provides us with de-identified information that a user is using Firefox and is not tied to any other data about you and can be opted out in the settings. To market our services When you allow us to do so, Firefox sends Mozilla data about the website domain or specific advertising campaign (if any) that referred you to our download page to help us understand and improve our marketing efforts. Firefox also shares information with our marketing partners to measure and improve these campaigns; what information is specifically shared varies (depending on how you discovered Firefox and your operating system) but generally includes how you were referred to our download page and whether you actively use Firefox. Where Firefox is pre-installed on your device, technical and interaction data (your device type and whether Firefox is used) will be sent to our marketing partners, and shared with Mozilla. More details, including how to adjust your data settings: Learn more about what Campaign Measurement data is collected and shared, and how to opt out. Note: Firefox does not share information like your browsing history, search queries, or saved passwords with marketing technology partners. Mo"
