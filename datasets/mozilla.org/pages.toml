full_description = "Restola pel llau salvaxe. Sé de los primeros n'esplorar les versiones en desendolcu de Firefox pa escritoriu, Android ya iOS. Beta Prueba lo último d'Android enantes de llanzalo al restu del mundu. Firefox Beta — Asturianu Android Baxar Avisu de privacidá de Firefox Toles llingües y plataformes Beta ye una plataforma de desendolcu y pruebes inestable. Por defeutu, Beta unvia datos a Mozilla, y a vegaes a los nuesos socios, p'ayudanos a remanar los problemes y probar idees. Llei lo que se comparte. Opina p'ayudanos a dar los últimos axustes de rindimientu y funcionalidá nun entornu estable. Nightly Comprueba les novedaes p'Android nes sos etapes más tempranes. Esfruta baxo'l to propiu riesgu. Firefox Nightly — Asturianu Android Baxar Avisu de privacidá de Firefox Blogue de Nightly Toles llingües y versiones Nightly ye una plataforma de desendolcu y pruebes inestable. Por defeutu, Nightly unvia datos a Mozilla, y a vegaes a los nuesos socios, p'ayudanos a remanar los problemes y probar idees. Llei lo que se comparte. Note: Firefox Nightly will update approximately once or twice a day. ¿Ves daqué que nun funciona? Coméntanoslo. Informar agora d'un fallu Conseyos pa informar fallos Firefox Firefox + Tu Get Firefox tips, tricks, news and more Please enter a valid email address Please select a country or region Please select a language Please check at least one of the newsletter options. You must agree to the privacy notice We are sorry, but there was a problem with our system. Please try again later! Your email address: Select country or region: Select country or region Acrotiri Afganistán Albania Alemaña Andorra Angola Anguila Antigua y Barbuda Antártida Arabia Saudita Armenia Aruba Arxelia Arxentina Australia Austria Azerbaixán Bangladex Barbados Bassas da India Baḥréin Belice Benín Bielorrusia Bolivia Bonaire, Sint Eustatius, y Saba Bosnia y Herzegovina Botsuana Brasil Brunéi Bulgaria Burkina Fasu Burundi Bután Bélxica Cabu Verde Camboya Camerún Ca