["https://mozilla.org/be/firefox/browsers/mobile/focus"]
title = "Firefox Focus: браўзер для прыватнасці"
description = "Firefox Focus — браўзер, засяроджаны на прыватнасці, з аўтаматычнай аховай ад сачэння."
full_description = "Firefox Focus Проста прыватнае мабільнае агляданне Firefox Focus — ваш адданы прыватны браўзер з аўтаматычнай аховай ад сачэння. З Focus вашыя старонкі загружаюцца хутчэй, а звесткі застаюцца прыватнымі. Firefox Focus даступны як для iOS, так і для Android прылад. Атрымаць Firefox Focus Скануйце QR-код, каб пачаць Выдаляйце сваю гісторыю Лёгка выдаляйце сваю гісторыю, паролі і кукі, каб непажаданая рэклама не праследавала вас у Інтэрнэце. Проста націсніце кнопку «Выдаліць» на панэлі пошуку — і яна знікне. Перанясіце прыватны рэжым на новы ўзровень «Прыватны прагляд» у большасці браўзераў насамрэч не такі ўжо і прыватны. Firefox Focus прапануе новы прадвызначаны ўзровень прыватнасці, які падтрымліваецца Mozilla, некамерцыйнай арганізацыяй, якая змагаецца за вашы правы ў Інтэрнэце. Ахова ад сачэння Firefox Focus прадвызначана блакіруе шырокі спектр распаўсюджаных трэкераў, уключаючы трэкеры сацыяльных сетак і іншыя назойлівыя трэкеры, напрыклад, рэкламы Facebook. Паскорце агляданне Focus выдаляе трэкеры, таму старонкі, якія вы праглядаеце, патрабуюць менш дадзеных і загружаюцца значна хутчэй. Акрамя таго, замацуйце да чатырох цэтлікаў на галоўным экране і пераходзьце на любімы сайт яшчэ хутчэй, нічога не ўводзячы. Зроблена Mozilla Мы верым, што кожны павінен кантраляваць сваё жыццё ў Інтэрнэце. Вось за што мы змагаемся з 1998 года."
