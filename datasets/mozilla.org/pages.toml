["https://mozilla.org/fr"]
title = "Mozilla — Internet est un bien commun, nous le défendons."
description = "Faites don de votre voix pour rendre les technologies vocales plus inclusives et accessibles à toutes et tous."
full_description = "Mettre l’animation en pause Lancer l’animation Bienvenue chez Mozilla Qu’il s’agisse de technologies dignes de confiance ou de politiques qui défendent vos droits numériques, nous vous faisons toujours passer en priorité. En savoir plus sur nous Sur un fond noir, un drapeau vert stylisé, composé du « M » de Mozilla, avec un pixel décalé pour figurer l’œil de son logo dinosaure original. Sur un fond noir, un drapeau vert stylisé, composé du « M » de Mozilla, avec un pixel décalé pour figurer l’œil de son logo dinosaure original. Apprenez à aimer Internet à nouveau Libérez-vous de l’emprise des géants de la tech : nos produits vous donnent le contrôle, pour une expérience sur Internet plus sûre et plus privée. Firefox: Obtenez ce qui se fait de mieux pour une navigation rapide, privée et contrôlée. Thunderbird: Simplifiez-vous la vie : vos e-mails, calendriers et contacts sont réunis en une seule application. Fakespot: Repérez les fausses évaluations, les produits de mauvaise qualité et les vendeurs peu fiables. Pocket: Enregistrez le meilleur d’Internet sur n’importe quel appareil, pour le lire quand vous aurez le temps… peut-être ? Mozilla VPN: Masquez votre localisation et vos activités en ligne, et regardez des contenus depuis n’importe où dans le monde. Mozilla Monitor: Recevez une alerte si vos données personnelles courent un risque et protégez-les immédiatement. Firefox Relay: Masquez votre adresse e-mail et votre numéro de téléphone pour recevoir uniquement les messages que vous désirez. Découvrir nos produits Faire un don à l’organisation à but non lucratif Mozilla Mozilla crée un mouvement pour reprendre le contrôle d’Internet. Ensemble, nous pouvons construire un futur dans lequel notre vie privée sera protégée, l’IA sera digne de confiance et les entreprises irresponsables du secteur de la tech seront mises face à leurs responsabilités. Mais tout ceci n’est possible que si nous unissons nos forces. Nous sommes fiers d’être une organisation à but non lucratif. Pouvez-vous faire un don à Mozilla aujourd’hui ? Faire un don Rejoignez le mouvement : l’IA au service des individus Notre mission est de faciliter l’utilisation d’une IA open source et digne de confiance par les internautes, et de leur permettre de collaborer à son développement. Common Voice Produit Faites don de votre voix pour rendre les technologies vocales plus inclusives et accessibles à toutes et tous. Donner votre voix L’IA peut-elle être digne de confiance ? Événement Dans un monde au sein duquel l’innovation en matière d’IA est entre les mains de rares élus, le risque de monopolisation de cette technologie est important. L’application de concepts open source à l’IA pourrait changer cette situation. Regardez les vidéos Lumigator Produit Trouvez le LLM qui correspond à vos besoins, votre cas d’usage et vos données. Commencer Mozilla Ventures Programme Vous venez de lancer votre start-up ? Présentez votre entreprise à Mozilla Ventures et obtenez un financement pour participer à l’évolution positive des IA et d’Internet. En savoir plus Llamafile Projet Exécutez des grands modèles de langage (large language models ou LLM) facilement sur votre ordinateur avec Llamafile. Aucune installation n’est nécessaire et vos données restent en sécurité sur votre appareil. Commencer Mozilla Builders Programme Mozilla Builders aide les développeurs et développeuses indépendants à créer des projets d’IA open source innovants grâce à des collaborations, une aide à la programmation et une communauté engagée. En savoir plus L’IA, Internet et vous — que se passe-t-il vraiment ? Type Auteur Sujet Intro Article Laura Chambers Confidentialité et sécurité Découvrez Anonym : pour une publicité numérique respectueuse de la vie privée. Article Saoud Khalifah Intelligence artificielle La sécurité des technologies d’IA générative est une responsabilité partagée. Podcast Podcast IRL Intelligence artificielle De Hollywood au hip-hop, de nombreux artistes négocient pour que l’IA prenne en compte leur consentement. Vidéo Rebecca Smith Nouveautés Mozilla met à l’honneur des créateurs et créatrices innovants dans sa nouvelle série documentaire « Firefox Presents ». Podcast Podcast IRL Intelligence artificielle Le pouvoir qu’ont les géants de la tech sur le langage leur donne du pouvoir sur les individus. Bridget Todd échange avec des leaders de la communauté linguistique qui ouvrent la voie à la conception d’IA vocales dans leurs propres langues et dialectes. Podcast Podcast IRL Intelligence artificielle Pourquoi avons-nous souvent l’impression de participer à une expérience à grande échelle sur l’IA ? Comment tester les nouvelles technologies de façon responsable ? Bridget Todd explore les conséquences de l’intrusion dans notre vie de systèmes d’IA non éprouvés, qui ont un impact sur des millions de personnes lorsqu’ils sont rendus accessibles au grand public. Article Kristina Bravo Confidentialité et sécurité Les enfants d’aujourd’hui grandissent dans un monde très connecté. Que peuvent faire les parents qui s’en inquiètent ? Mozilla aujourd’hui Mozilla se réinvente en diversifiant son activité autour de plusieurs organisations, en repensant la publicité et en créant un écosystème d’IA open source. Découvrez nos projets dans le rapport « Mozilla aujourd’hui » de 2024. 2024 Lire le rapport Apprenez-en plus sur les problématiques qui façonnent l’avenir d’Internet *Confidentialité non incluse Consultez nos tests pour découvrir quels gadgets et applications volent vos données en toute discrétion. Faire une recherche Podcast IRL Notre podcast multirécompensé vous présente les acteurs et actrices du changement qui œuvrent pour le développement d’un Internet plus sûr et d’une IA digne de confiance. Écouter"
