["https://mozilla.org/es-ES"]
title = "Mozilla — Internet para personas, no para el lucro"
description = "Estamos trabajando para devolver el control de Internet a manos de las personas que lo utilizan."
full_description = "Pausar la animación Reproducir la animación Te damos la bienvenida a Mozilla Desde tecnología fiable hasta políticas que defienden tus derechos digitales, tú eres lo primero — siempre. Saber más sobre nosotros Una bandera verde estilizada sobre un fondo negro, construida a partir de la “M” de Mozilla y un píxel que se desplaza para hacer referencia a su logo original del dinosaurio. Una bandera verde estilizada sobre un fondo negro, construida a partir de la “M” de Mozilla y un píxel que se desplaza para hacer referencia a su logo original del dinosaurio. Vuelve a amar Internet Libérate de las grandes tecnológicas: nuestros productos te permiten tener el control de una experiencia en Internet más segura y privada. Firefox: Consigue el mejor nivel para navegar con rapidez, privacidad y control. Thunderbird: Simplifica tu vida con una sola aplicación para todos tus correos electrónicos, calendarios y contactos. Fakespot: Detecta reseñas falsas, malos productos y vendedores no fiables. Pocket: Guarda el mejor contenido de Internet en cualquier dispositivo, porque ¿quién tiene tiempo para leerlo todo ahora? Mozilla VPN: Mantén privada tu ubicación y tus aventuras en línea: ve streaming como un local, en cualquier lugar. Mozilla Monitor: Entérate si tu información personal está en riesgo y bloquéala como un profesional. Firefox Relay: Enmascara tu correo electrónico y número de teléfono para que sólo recibas los mensajes que deseas. Explora nuestros productos Dona a la organización sin ánimo de lucro Mozilla Mozilla está construyendo un movimiento para recuperar Internet. Juntos podemos construir un futuro donde nuestra privacidad esté protegida, la IA sea fiable y las empresas tecnológicas irresponsables tengan que rendir cuentas. Pero eso solo es posible si lo hacemos juntos. Estamos orgullosos de ser una organización sin ánimo de lucro. ¿Donarías a Mozilla hoy? Donar Únete al movimiento: IA para la gente Nuestra misión es facilitar a las personas la creación y la colaboración con una IA fiable y de código abierto. Common Voice Producto Dona tu voz para hacer que la tecnología del habla sea más inclusiva y accesible para todos. Dona tu voz ¿La IA puede ser fiable? Evento En un mundo donde la innovación en IA está impulsada por unos pocos elegidos, nos arriesgamos a la monopolización de esta tecnología. Aplicar conceptos de código abierto a la IA podría cambiar la situación. Ver ahora Lumigator Producto Encuentra el LLM adecuado para tus necesidades, caso de uso y datos. Comenzar Mozilla Ventures Programa ¿Tienes una startup en una etapa inicial? Presenta tu empresa a Mozilla Ventures y consigue financiación para impulsar un cambio positivo para el futuro de la IA e Internet. Leer más Llamafile Proyecto Ejecuta modelos de lenguaje de gran tamaño (LLM) fácilmente en tu ordenador con Llamafile: no hace falta instalación y tus datos permanecen seguros en tu dispositivo. Comenzar Mozilla Builders Programa Builders ayuda a los desarrolladores independientes a crear proyectos transformadores de IA de código abierto a través de colaboraciones, programación y comunidad a medida. Leer más Tú, la IA e Internet: ¿qué está pasando realmente? Tipo Autor Tema Introducción Artículo Laura Chambers Privacidad y seguridad Presentamos Anónimo: elevamos el nivel de la publicidad digital que preserva la privacidad. Artículo Saoud Khalifah Inteligencia artificial Mantener seguras las tecnologías GenAI es una responsabilidad compartida. Podcast Podcast IRL Inteligencia artificial Desde Hollywood hasta el hip hop, los artistas están negociando el consentimiento de la IA. Vídeo Rebecca Smith Noticias Mozilla rinde homenaje a creadores innovadores en la nueva serie documental “Firefox Presents”. Podcast Podcast IRL Inteligencia artificial El poder de las grandes tecnológicas sobre el idioma significa poder sobre las personas. Bridget Todd habla con líderes de la comunidad lingüística allanando el camino para la IA de voz en sus propios idiomas y dialectos. Podcast Podcast IRL Inteligencia artificial ¿Por qué tan a menudo parece que formamos parte de un experimento masivo de inteligencia artificial? ¿Cuál es la forma responsable de probar nuevas tecnologías? Bridget Todd explora lo que significa vivir con sistemas de inteligencia artificial no probados que afectan a millones de personas a medida que se implementan en la vida pública. Artículo Kristina Bravo Privacidad y seguridad Los niños están creciendo en un mundo demasiado en línea. ¿Qué debe hacer un padre preocupado? Estado de Mozilla Mozilla se está reinventando a sí misma, diversificándose en torno a una constelación de organizaciones, reimaginando la publicidad y creando un ecosistema de IA de código abierto. Lee acerca de esto en el Informe sobre el estado de Mozilla de 2024. 2024 Leer el informe Explora las cuestiones que dan forma al futuro de Internet *Privacidad no incluida Busca en nuestras reseñas para ver qué dispositivos y aplicaciones tecnológicas están robando sigilosamente tus datos. Buscar ahora Podcast IRL Nuestro podcast, ganador de múltiples premios, presenta a los creadores del cambio, que trabajan para hacer que Internet sea más seguro y la IA más fiable. Escuchar ahora"
