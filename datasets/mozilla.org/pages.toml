full_description = "Firefox Browser Junelïk aninäq. Rik'in 2mul aninäq, tz'aqatisan ruchajinïk ichinanem chuqa' rik'in ruto'ik Mozilla, ri k'aka' Firefox ja ri' ri ütz rub'anikil richin yatok pa k'amaya'l. Taqasaj Firefox Firefox is no longer supported on Windows 8.1 and below. Please download Firefox ESR (Extended Support Release) to use Firefox. Download Firefox ESR 64-bit Download Firefox ESR 32-bit Download a different build Firefox is no longer supported on macOS 10.14 and below. Please download Firefox ESR (Extended Support Release) to use Firefox. Download Firefox ESR Firefox Ichinan Rutzijol Niqab'än chi ri k'amaya'l jikïl, raxinäq chuqa' junelïk aninäq. Mozilla jun moloj ri man rojqan ch'akoj ri pa'äl pa ruwi' ri Firefox, ri cha'el okik'amaya'l pa qitzij. Yeqanük' taq tikojil chuqa' taq na'ojil richin nib'an chi tik'oje' pa kiq'a' ri winaqi' ri K'amaya'l, man richin ta ch'akoj. Ri quchuq'a' Toq nawokisaj Firefox, nato' ri Mozilla richin nich'utinisäx ruwa ri q'olonel etamab'äl pa K'amaya'l, chi kek'ut etamab'äl pa ruwi' kematz'ib' chuqa' ri winaqi' ütz kitzij tikokisaj pa kitz'ib'anik. Tatz'eta' ri nito'on chi ninuk' jun raxinäq k'amaya'l. Mozilla Information Trust Initiative Ya'oj kuchuqa' ri Ixoqi' pa K'amab'ey The Coral Project Tasik'ij ri qatzijol raxnaqil K'amaya'l Taq qatz'ukuj Ri rokisaxik ajk'amaya'l achi'el nuk'uche'el, yeqanük' jaqäl chuqa' tz'ukuj taq na'ob'äl ri nuya' q'ij chi ke ri ajb'anonela' yesamäj kik'in tz'apäl, aj moloj ch'ajch'öj taq nuk'ulem chuqa' aninäq yenuk'un ajk'amaya'l taq etamab'äl ri yalan e ütz chi kiwa konojel. Common Voice Kematz'ib'il K'aslem Nuk'uche'el Taq k'amal Tawichinaj ri Firefox kik'in ri rutz'aqat ajowab'äl achi'el kinuk'samajel taq ewan tzij, kiq'atik talun rutzijol chuqa' ch'aqa' chik. Taq samaj Tawetamaj ri rutzil yasamäj richin Mozilla chuqa' keb'e'atz'eta' achike chi samaj yesuj chijun ri ruwachulew. ¿La nawajo' ato'ik? Tak'ulu' tzolin ta tzij chi rij ri Firefox chuqa' chi kij ri taq rutikojil Mozilla kuma ri