["https://mozilla.org/ast/about/manifesto"]
title = "The Mozilla Manifesto"
description = "An internet with these qualities will not come to life on its own. Individuals and organizations must embed these aspirations into internet technology and into the human experience with the internet. The Mozilla Manifesto and Addendum represent Mozilla’s commitment to advancing these aspirations. We aim to work together with people and organizations everywhere who share these goals to make the internet an even better place for everyone."
full_description = "The Mozilla Manifesto Addendum Pledge for a Healthy Internet The open, global internet is the most powerful communication and collaboration resource we have ever seen. It embodies some of our deepest hopes for human progress. It enables new opportunities for learning, building a sense of shared humanity, and solving the pressing problems facing people everywhere. Over the last decade we have seen this promise fulfilled in many ways. We have also seen the power of the internet used to magnify divisiveness, incite violence, promote hatred, and intentionally manipulate fact and reality. We have learned that we should more explicitly set out our aspirations for the human experience of the internet. We do so now. We are committed to an internet that includes all the peoples of the earth — where a person’s demographic characteristics do not determine their online access, opportunities, or quality of experience. We are committed to an internet that promotes civil discourse, human dignity, and individual expression. We are committed to an internet that elevates critical thinking, reasoned argument, shared knowledge, and verifiable facts. We are committed to an internet that catalyzes collaboration among diverse communities working together for the common good. Show Your Support An internet with these qualities will not come to life on its own. Individuals and organizations must embed these aspirations into internet technology and into the human experience with the internet. The Mozilla Manifesto and Addendum represent Mozilla’s commitment to advancing these aspirations. We aim to work together with people and organizations everywhere who share these goals to make the internet an even better place for everyone. Share on Bluesky Our 10 Principles Principle 1 The internet is an integral part of modern life—a key component in education, communication, collaboration, business, entertainment and society as a whole. Principle 2 The internet is a global public resource that must remain open and accessible. Principle 3 The internet must enrich the lives of individual human beings. Principle 4 Individuals’ security and privacy on the internet are fundamental and must not be treated as optional. Principle 5 Individuals must have the ability to shape the internet and their own experiences on it. Principle 6 The effectiveness of the internet as a public resource depends upon interoperability (protocols, data formats, content), innovation and decentralized participation worldwide. Principle 7 Free and open source software promotes the development of the internet as a public resource. Principle 8 Transparent community-based processes promote participation, accountability and trust. Principle 9 Commercial involvement in the development of the internet brings many benefits; a balance between commercial profit and public benefit is critical. Principle 10 Magnifying the public benefit aspects of the internet is an important goal, worthy of time, attention and commitment. Share on Bluesky Read the entire manifesto"
year_published = 2025
clearnet = "https://mozilla.org/ast/about/manifesto"
