title = "Mozilla — Rhyngrwyd i bobl, nid elw"
description = "Rydyn ni'n gweithio i roi rheolaeth ar y rhyngrwyd yn ôl yn nwylo'r bobl sy'n ei ddefnyddio."
full_description = "Oedi'r animeiddiad Chwarae animeiddiad Croeso i Mozilla O dechnoleg ddibynadwy i bolisïau sy'n diogelu eich hawliau digidol, rydyn ni'n eich rhoi chi'n gyntaf - bob tro. Dysgwch amdanom ni Baner werdd wedi'i steilio ar gefndir du, wedi’i hadeiladu o’r ‘M’ ar gyfer Mozilla a phicsel sy’n cael ei ddadleoli i gyfeirio at ei logo dinosor gwreiddiol. Baner werdd wedi'i steilio ar gefndir du, wedi’i hadeiladu o’r ‘M’ ar gyfer Mozilla a phicsel sy’n cael ei ddadleoli i gyfeirio at ei logo dinosor gwreiddiol. Carwch y rhyngrwyd eto Torri'n rhydd rhag y cwmnïau technoleg mawr — mae ein cynnyrch yn rhoi rheolaeth i chi ar brofiad rhyngrwyd mwy diogel a phreifat. Firefox: Y safon aur ar gyfer pori cyflym, preifat a rheolaeth. Thunderbird: Symleiddio eich bywyd gydag un ap ar gyfer eich holl e-byst, calendrau a chysylltiadau. Fakespot: Adnabod adolygiadau ffug, cynnyrch gwael a gwerthwyr annibynadwy. Pocket: Cadw cynnwys gorau'r rhyngrwyd ar unrhyw ddyfais - pwy sydd ag amser i ddarllen popeth nawr? Mozilla VPN: Cadw eich lleoliad ac anturiaethau ar-lein yn breifat - ffrydio fel person lleol, yn unrhyw le. Mozilla Monitor: Cael gwybod os yw'ch manylion personol mewn perygl a'u diogelu'n iawn. Firefox Relay: Cuddio eich e-bost a'ch rhif ffôn fel mai dim ond y negeseuon rydych chi eu heisiau y byddwch chi'n eu cael. Edrychwch ar ein cynnyrch Cyfrannwch at y Mozilla dim-er-elw Mae Mozilla yn adeiladu mudiad i adennill y rhyngrwyd. Gyda'n gilydd gallwn adeiladu dyfodol lle mae ein preifatrwydd yn cael ei ddiogelu, AI yn ddibynadwy a chwmnïau technoleg anghyfrifol yn cael eu dal yn atebol. Ond dim ond os ydym yn ei wneud gyda'n gilydd y mae hynny'n bosibl. Rydym yn falch ein bod yn gorff dim-er-elw. A wnewch chi gyfrannu at Mozilla heddiw? Cyfrannu Ymunwch â'r symudiad: AI ar gyfer y bobl Ein cenhadaeth yw ei gwneud hi'n hawdd i bobl adeiladu a chydweithio ar AI cod agored a dibynadwy. Common Voice Cynnyrch Cyfrannwch eich llais i wneud technoleg lleferydd yn fwy cynhwysol a hygyrch i bawb. Cyfrannwch eich llais A all AI fod yn ddibynadwy? Digwyddiad Mewn byd lle mae arloesedd AI yn cael ei yrru gan ychydig ddethol, rydym mewn perygl o fonopoleiddio'r dechnoleg hon. Gallai cymhwyso cysyniadau cod agored i AI newid hynny. Gwyliwch nawr Lumigator Cynnyrch Dewch o hyd i'r LLM cywir ar gyfer eich anghenion, achos defnydd a data. Cychwyn arni Mozilla Ventures Rhaglen Oes gennych chi gwmni cychwynnol cyfnod cynnar? Cynigiwch eich cwmni i Mozilla Ventures a sicrhewch gyllid i ysgogi newid cadarnhaol ar gyfer dyfodol AI a'r rhyngrwyd. Darllen rhagor Llamafile Project Rhedwch modelau iaith mawr (LLMs) yn hawdd ar eich cyfrifiadur gyda Llamafile — nid oes angen eu gosod, ac mae eich data yn aros yn ddiogel ar eich dyfais. Cychwyn arni Mozilla Builders Rhaglen Mae Mozilla Builders yn helpu datblygwyr annibynnol i greu projectau AI cod agored trawsnewidiol trwy gydweithrediadau pwrpasol, rhaglennu, a chymuned. Darllen rhagor Chi, AI a'r rhyngrwyd — beth sy'n digwydd mewn gwirionedd? Math Awdur Pwnc Cyflwyniad Erthygl Laura Chambers Preifatrwydd a Diogelwch Cyflwyno Anhysbys: Codi'r bar ar gyfer hysbysebu digidol sy'n diogelu preifatrwydd. Erthygl Saoud Khalifah Deallusrwydd Artiffisial Mae cadw technolegau GenAI yn ddiogel yn gyfrifoldeb i'w rannu. Podlediad Podlediad IRL Deallusrwydd Artiffisial O Hollywood i hip hop, mae artistiaid yn negodi caniatâd AI. Fideo Rebecca Smith Newyddion Mae Mozilla yn dathlu crewyr arloesol mewn cyfres ddogfen newydd “Firefox Presents.” Podlediad Podlediad IRL Deallusrwydd Artiffisial Mae pŵer technoleg fawr dros iaith yn golygu pŵer dros bobl. Mae Bridget Todd yn siarad gydag arweinwyr cymunedau iaith i baratoi'r ffordd ar gyfer llais AI yn eu hieithoedd a'u tafodieithoedd eu hunain. Podlediad Podlediad IRL Deallusrwydd Artiffisial Pam mae'n teimlo'n aml ein bod ni'n rhan o arbrawf AI torfol? Beth yw'r ffordd gyfrifol o brofi technolegau newydd? Mae Bridget Todd yn archwilio beth mae'n ei olygu i fyw gyda systemau AI sydd heb eu profi ac sy'n effeithio ar filiynau o bobl wrth iddyn nhw gael eu cyflwyno ar draws bywyd cyhoeddus. Erthygl Kristina Bravo Preifatrwydd a Diogelwch Mae plant yn tyfu mewn byd ar-lein iawn. Beth mae rhiant pryderus i'w wneud? Cyflwr Mozilla Mae Mozilla yn ailddyfeisio ei hun, gan arallgyfeirio o amgylch clwstwr o sefydliadau, ail-ddychmygu hysbysebu a chreu ecosystem AI cod agored. Darllenwch amdano yn adroddiad State of Mozilla 2024. 2024 Darllenwch yr adroddiad Archwilio materion sy'n siapio dyfodol y rhyngrwyd *Dim Preifatrwydd Chwiliwch ein hadolygiadau i weld pa declynnau technoleg ac apiau sy'n dwyn eich data'n llechwraidd. Chwilio nawr Podlediad IRL Mae ein podlediad wedi ennill sawl gwobr drwy gyflwyno’r rhai sy’n creu newid ac yn gweithio i wneud y rhyngrwyd yn fwy diogel a deallusrwydd artiffisial yn fwy dibynadwy. Gwrandewch nawr"
