title = "احصل على فيَرفُكس لِشركتك مع ESR والإصدار السريع"
description = "احصل على حماية بيانات لا مثيل لها على إيقاع الإصدار الذي يُناسبك مع فيَرفُكس للشركات. نزّل ESR والإصدار السريع."
full_description = "نزّل فيَرفُكس لشركتك نزّل إصدار الدعم المُمتد من فَيرفوكس أو متصفّح الإصدار السريع لتحصل على حماية وأمان شامل للبيانات. تنزيل إشعار خصوصية فيَرفُكس حماية البيانات غير المتطابقة — على إيقاع الإصدار الذي يُناسبك بياناتك تبقي من شأنك أنت فقط متصفّح فيَرفُكس هو مصدر مفتوح يُوفر حماية محسّنة من التتبع — وكل ذلك جزء من التزامنا طويل الأمد بحماية البيانات. انشر متى وكيف تريد بِفضل حزم التثبيت والتوسع الكبير في سياسات وميزات المجموعة، أصبح النشر أسرع وأكثر مرونة من أي وقت مضى — فاستمتع بالسرعة الفائقة في بيئات Windows وmacOS. اختيار إيقاع الإصدار الخاص بك احصل على إصدارات سريعة للتأكد من حصولك على أحدث الميزات بشكل أسرع، أو توسّع لضمان تجربة فائقة الاستقرار. تنزيلات الشركات Windows 64 بت اختر نوع التنزيل متصفّح فَيَرفُكس متصفّح فَيَرفُكس - أداة تثبيت MSI إصدار الدعم المُمتد من فَيرفوكس (ESR) إصدار الدعم المُمتد من فَيرفوكس (ESR) - أداة تثبيت MSI الدعم أدوات تثبيت MSI دعم المتصفّحات القديمة قوالب ADMX دليل النشر توثيق السياسات مُلاحظات الإصدار التوثيق ودعم المُنتدى macOS اختر نوع التنزيل متصفّح فَيَرفُكس إصدار الدعم المُمتد من فَيرفوكس (ESR) الدعم Sample plist لملف تعريف التكوين أداة تثبيت PKG دليل النشر توثيق السياسات مُلاحظات الإصدار التوثيق ودعم المُنتدى Windows 32 بت اختر نوع التنزيل متصفّح فَيَرفُكس متصفّح فَيَرفُكس - أداة تثبيت MSI إصدار الدعم المُمتد من فَيرفوكس (ESR) إصدار الدعم المُمتد من فَيرفوكس (ESR) - أداة تثبيت MSI الدعم أدوات تثبيت MSI دعم المتصفّحات القديمة قوالب ADMX دليل النشر توثيق السياسات مُلاحظات الإصدار التوثيق ودعم المُنتدى نزّل Firefox ESR أو الإصدار السريع للغة أو منصة أخرى."
