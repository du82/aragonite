title = "Get Firefox for desktop — Mozilla (US)"
description = "Get Firefox for Windows, Mac or Linux. Firefox is a free web browser backed by Mozilla, a non-profit dedicated to internet health and privacy."
full_description = "Firefox Browser Get the browser that protects what’s important Fast, reliable and private — for peace of mind online. Download Firefox Firefox is no longer supported on Windows 8.1 and below. Please download Firefox ESR (Extended Support Release) to use Firefox. Download Firefox ESR 64-bit Download Firefox ESR 32-bit Download a different build Firefox is no longer supported on macOS 10.14 and below. Please download Firefox ESR (Extended Support Release) to use Firefox. Download Firefox ESR Firefox Privacy Notice Download options and other languages Firefox Browser support Latest Firefox features Pick up where you left off Firefox View lets you see your tabs open on other devices and recent history. Edit your PDFs directly Forget printing a PDF ever again. Start editing forms in Firefox directly. Browse knowing you’re protected Firefox’s Total cookie protection gives you outstanding privacy by default. See Release Notes Do what you do online. Firefox Browser has got you covered. We block the ad trackers. You explore the internet faster. Ads are distracting and make web pages load slower while their trackers watch every move you make online. The Firefox Browser blocks most trackers automatically, so there’s no need to dig into your security settings. See your protection report Firefox is for everyone Available in over 90 languages, and compatible with Windows, Mac and Linux machines, Firefox works no matter what you’re using or where you are. Make sure your operating system is up to date for the best experience. Review system requirements Put Firefox on all your devices Take your privacy with you everywhere. Firefox Browsers for iOS and Android have the same strong privacy settings to block trackers from following you around the web, no matter where you are. Do it all with Firefox Search smarter, faster Search from address bar Search engine options Smart search suggestions Bookmark, history and open tab in results Boost your productivity Works with