["https://mozilla.org/ast/privacy/websites/cookie-settings"]
title = "Cookie settings — Mozilla"
description = "This page describes the different types of Cookies that Mozilla may use, and gives you control over which types of data you agree to Mozilla collecting."
full_description = "Cookie settings Cookies are small files containing pieces of information that are saved to your computer or device when you visit a website. Mozilla uses Cookies to help make our websites work, as well as to collect information on how you use and interact with our websites, such as the pages you visit. This page describes the different types of Cookies and similar technologies such as pixel tags, web beacons, clear GIFs, JavaScript, and local storage (hereafter, “Cookies”) that Mozilla may use, and gives you control over which types of data you agree to Mozilla collecting. How Mozilla uses Cookies Necessary What are Necessary Cookies? These technologies are required to support essential website features, such as logging into a secure area of a website or adding items to an online shopping basket, and cannot be turned off. How does Mozilla use this data? Mozilla uses Necessary Cookies only to provide essential website features, such as logging in using your Mozilla account or purchasing a software subscription at checkout. Without these technologies, essential website features may not function. Preference I Agree I Do Not Agree What are Preference Cookies? These technologies are used to remember choices you have made during a previous visit to a website. Examples might include which language you prefer reading in, or which color theme is your favorite. How does Mozilla use this data? Mozilla uses Preference Cookies to honor your preferences and improve your experience when visiting our websites. They are not used for analytics purposes. Preference Cookies support features in a similar way to Necessary Cookies, however a website can still operate without them. As such, you can choose to opt out of their use. Analytics I Agree I Do Not Agree What are Analytics Cookies? These technologies collect information about how people use websites, such as pages visited, links clicked on, and which other websites visits originated from. How does Mozilla use this data? Mozilla uses analytics information to understand how users interact with our websites so that we can improve them, and fix any problems that arise. We may also use data from Cookies, device information, and IP addresses to help us understand how users engage with our products, services, communications, websites, online campaigns, devices, and other platforms. We will only collect analytics information and set Analytics Cookies with your consent. Save Changes <p><strong>Please turn on JavaScript to update your Cookie settings.</strong></p> Your Cookie settings have been updated. Our privacy notice For more detailed information about the different types of information that Mozilla collects when you visit our websites, you can find a link to our privacy notice below. Privacy Notice"
year_published = 2025
