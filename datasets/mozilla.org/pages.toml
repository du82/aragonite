title = "فُرص المتطوعين في موزيلا — Mozilla"
description = "يُصبح الإنترنت عالميًا فقط عندما يكون مفهومًا في كل مكان. ساعدنا في ترجمة منتجات ومواقع ويب موزيلا إلى لغتك المحلية."
full_description = 'يحتاج العالم مواهبك لإنترنت أفضل للجميع موزيلا هي مُؤسسة غير ربحية تعمل على ضمان أن الإنترنت مفتوح ويُرحب بالجميع. ونحن بحاجة لمُساعدتكم. من خلال الانضمام إلى مُجتمعنا، يُمكنك المساعدة في دفع الابتكار وتعزيز المُساءلة والثقة وجعل الإنترنت مكانًا أفضل للجميع. كيف تساهم… بدون خبرة تقنية تنظيم الأفراد والفعاليات ترجمة المحتوى يُصبح الإنترنت عالميًا فقط عندما يكون مفهومًا في كل مكان. ساعدنا في ترجمة منتجات ومواقع ويب موزيلا إلى لغتك المحلية. تقني فردي المُساهمة في مصدر برنامج موزيلا حسّن مُنتجات موزيلا بالمساهمة في مجموعة متنوعة من فرص التطوير. دعم تنظيم الأفراد والفعاليات تنظيم الأفراد والفعاليات ساعد في جعل منتجات موزيلا سهلة الاستخدام أجب عن أسئلة "المساعدة" الواردة من المستخدمين كجزء من مُنتديات مجتمع دعم موزيلا. التقني وغير التقني انضم إلى المجتمع هل تريد أن تشارك أكثر في مجتمع موزيلا؟ تحقق من جميع فرص التطوع في بوابة المجتمع الخاصة بنا. مهمّتنا تتمثّل مُهمّتنا في الحفاظ على الإنترنت كمورد عالمي مفتوح ومُتاح للجميع. إنترنت يضع الأشخاص في المقام الأول بشكل حقيقي، حيث يمكن للأفراد تشكيل تجربتهم الخاصة ويمنحهم القوة والأمان والاستقلالية. معرفة المزيد عن موزيلا اقرأ بياننا ابحث عن فعالية التقِ بمتطوّعينا الشغوفين تبرَّع ساعد بتمويل مُهمّتنا تابع موزيلا الأخبار وفرص التطوّع من صنع أشخاص شغوفين مثلك عندما تُساهم في موزيلا، تُصبح جزءًا من مجتمع عالمي يتكون من أشخاص من جميع أنحاء العالم يعتقدون أن لنا جميعًا دورًا في ضمان بقاء الإنترنت قوة من أجل الخير. نعتقد أن التعاون المُجتمعي أمر حيوي لإنشاء إنترنت متنوع ومبتكر وخاضع للمساءلة أمام الأشخاص الذين هم في أمس الحاجة إليه. سواءً كانت لديك خلفية في التكنولوجيا أو تنظيم المجتمع أو مجرد جهاز كمبيوتر وبعض وقت الفراغ، يُمكنك مُساعدتنا في جعل الإنترنت مكانًا أفضل. about-mozilla أما زلت محتارًا؟ تلقّ أخبار المُجتمع والمساهمة في صندوق الوارد الخاص بك اشترك في الرسائل الإخبارية، وانضم إلى عائلة موزيلا في جميع أنحاء العالم، وتعرّف على الفُرص المؤثرة لدعم مهمة موزيلا. يُرجى إدخال عنوان بريد إلكتروني صالح. يُرجى اختيار بلد أو منطقة يُرجى اختيار لغة يُرجى تحديد خيار واحد على الأقل من خيارات الرسائل الإخبارية. يجب أن تُوافق على إشعار الخصوصية نأسف، حدثت مشكلة في نظامنا. من فضلك حاول ثانية فيما بعد! عنوان البريد الإلكتروني: حدد البلد أو المنطقة: حدد البلد أو المنطقة آيسلاندا أثيوبيا أذربيجان أرمينيا أروبا أروغواي أستراليا أفريقيا الجنوبية أفغانستان أكرانيا أكروتيري ألبانيا ألمانيا أنتيجوا و بربودا أندورا أنغولا أنغويلا أوزباكستان أوغاندا أوغندا إريتريا إسبانيا إستونيا إسرائيل إقليم المحيط الهندي البريطاني إندونيسيا إيران إيرلندا إيطاليا الأرجنتين الأردن الإكوادور الإمارات العربيّة المتّحدة البحرين البرازيل البرتغال البهاما البوسنة و الهرسك الجزائر الجزر العذراء البريطانية الدنمارك الرأس الأخضر السلفادور السنغال السّعوديّة السّودان السّويد الصحراء الغربية الصّومال الصّين الضفة الغربية العراق الغابون الفيليبين القارة القطبية الجنوبية الكاميرون الكويت المغرب المكسيك المملكة المتّحدة المناطق الجنوبية و الأنتركتيكية الفرنسية النرويج النّاورو النّمسا النّيجر الهند الولايات المتّحدة اليابان اليمن اليونان بابوا غينيا الجديدة باراغواي باربادوس باساس دا إنديا باكستان بالاو برمودا بروناي بلجيكا بلغاريا بنغلاديش بنما بنين بهوتان بوتسوانا بورتو ريكو بوركينا فاسو بورما بوروندي بولندا بوليفيا بولينيسيا الفرنسية بونير و سينت أوستاتيوس و سابا بيرو بيليز تايلاند تايوان تركمانستان تركيا ترينيداد و توباغو تشاد تشيلي تنزانيا توغو توفالو توكيلاو تونس تونغا تيمور- ليشتي جامايكا جامبيا جان ماين جبل طارق جزر الترك والكايكوس جزر الفارو جزر الفوكلاند (المالفيناس) جزر القمر جزر الكايمان جزر الكوكوس (كيلنك) جزر المارشال جزر المالديف جزر بالميرا المرجانية جزر بتكيرن جزر بحر الكورال جزر سبراتلي جزر سليمان جزر غلوريوسو جزر فيرجن الأمريكية جزر كوك جزر ماريانا الشمالية جزر ميدواي جزر والس و فوتونا جزر پاراسيل جزيرة أوروبا جزيرة الكريسماس جزيرة بايكر جزيرة بوفي جزيرة تروملين جزيرة جارفيس جزيرة جونستون جزيرة خوان دي نوڤا جزيرة كليبرتون جزيرة مان جزيرة نافاسا جزيرة نورفولك جزيرة هولاند جزيرة هيرد و جزر ماكدونالد جزيرة وايك جزيرتي أشمور وكارتيير جمهورية أفريقيا الوسطى جمهورية التشيك جمهورية الدومينيك جنوب السودان جنوب جورجيا و جزر ساندويتش الجنوبيّة جورجيا جيبوتي جيرسي دهقلية دومينيكا دييغو غارسيا روسيا روسيا البيضاء 