title = "Mozilla — Internet para personas, no para el lucro"
description = "Estamos trabajando para devolver el control de Internet a manos de las personas que lo utilizan."
full_description = "Pausa la animación Reproducir la animación Te damos la bienvenida a Mozilla Desde tecnología confiable hasta políticas que defienden tus derechos digitales, tu eres lo primero, siempre. Aprende sobre nosotros Una bandera verde estilizada sobre un fondo negro, construida a partir de la “M” de Mozilla y un píxel que se desplaza para hacer referencia a su logotipo de dinosaurio original. Una bandera verde estilizada sobre un fondo negro, construida a partir de la “M” de Mozilla y un píxel que se desplaza para hacer referencia a su logotipo de dinosaurio original. Vuelve a amar Internet Libérate de las grandes tecnológicas: nuestros productos te permiten tener el control de una experiencia en Internet más segura y privada. Firefox: Obtén el estándar de oro para navegar con velocidad, privacidad y control. Thunderbird: Simplifica tu vida con una sola aplicación para todos tus correos electrónicos, calendarios y contactos. Fakespot: Detecta reseñas falsas, malos productos y vendedores no confiables. Pocket: Guarda el mejor contenido de Internet en cualquier dispositivo, porque ¿quién tiene tiempo para leerlo todo ahora? Mozilla VPN: Mantén privada tu ubicación y tus aventuras en línea: transmite como un local, en cualquier lugar. Mozilla Monitor: Entérate si tu información personal está en riesgo y bloquéala como un profesional. Firefox Relay: Enmascara tu correo electrónico y número de teléfono para que sólo recibas los mensajes que deseas. Explora nuestros productos Dona a la Mozilla sin fines de lucro Mozilla está creando un movimiento para recuperar Internet. Juntos podemos construir un futuro en el que nuestra privacidad esté protegida, la IA sea confiable y las empresas tecnológicas irresponsables rindan cuentas. Pero eso solo es posible si lo hacemos juntos. Somos una organización sin fines de lucro. ¿Harías una donación a Mozilla hoy? Donar Únete al movimiento: IA para la gente Nuestra misión es hacer que sea fácil para las personas construir y colaborar con una IA confiable y de código abierto. Common Voice Producto Dona tu voz para hacer que la tecnología del habla sea más inclusiva y accesible para todos. Dona tu voz ¿Puede la IA ser confiable? Evento En un mundo en el que la innovación en IA es impulsada por unos pocos, corremos el riesgo de que esta tecnología sea monopolizada. La aplicación de conceptos de código abierto a la IA podría cambiar esta situación. Mirar ahora Lumigator Producto Encuentra el LLM adecuado para tus necesidades, caso de uso y datos. Empezar Mozilla Ventures Programa ¿Tienes una startup en etapa inicial? Presenta tu empresa a Mozilla Ventures y obtén financiamiento para impulsar un cambio positivo para el futuro de la IA e Internet. Leer más Llamafile Proyecto Ejecuta modelos de lenguaje grandes (LLM) fácilmente en tu computador con Llamafile: no necesita instalación y tus datos permanecen seguros en tu dispositivo. Empezar Mozilla Builders Programa Los Mozilla Builders ayudan a los independientes a crear proyectos de IA transformadores de código abierto a través de colaboraciones, programación y comunidad a medida. Leer más Usted, la IA e Internet: ¿qué está pasando realmente? Tipo Autor Tema Intro Artículo Laura Chambers Privacidad y seguridad Presentamos Anónimo: elevamos el nivel de la publicidad digital que preserva la privacidad. Artículo Saoud Khalifah Inteligencia artificial Mantener seguras las tecnologías GenAI es una responsabilidad compartida. Podcast Podcast IRL Inteligencia artificial Desde Hollywood hasta el hip hop, los artistas están negociando el consentimiento de la IA. Video Rebecca Smith Noticias Mozilla rinde homenaje a creadores innovadores en la nueva serie documental “Firefox Presents”. Podcast Podcast IRL Inteligencia artificial El poder de las grandes tecnológicas sobre el lenguaje significa poder sobre las personas. Bridget Todd habla con líderes de la comunidad lingüística que están pavimentando el camino para la inteligencia artificial de voz en sus propios idiomas y dialectos. Podcast Podcast IRL Inteligencia artificial ¿Por qué tan a menudo parece que formamos parte de un experimento masivo de inteligencia artificial? ¿Cuál es la forma responsable de probar nuevas tecnologías? Bridget Todd explora lo que significa vivir con sistemas de inteligencia artificial no probados que afectan a millones de personas a medida que se implementan en la vida pública. Artículo Kristina Bravo Privacidad y seguridad Los niños crecen en un mundo en línea. ¿Qué puede hacer un padre preocupado? Estado de Mozilla Mozilla se está reinventando a sí misma, diversificándose en torno a una constelación de organizaciones, reimaginando la publicidad y creando un ecosistema de IA de código abierto. Lee acerca de esto en el Reporte Estado de Mozilla de 2024. 2024 Leer el reporte Explora problemas que dan forma al futuro de Internet *Privacidad no incluida Busca en nuestras reseñas para ver qué dispositivos y aplicaciones tecnológicas se están metiendo sigilosamente en tus datos. Buscar ahora Podcast IRL Nuestro podcast, ganador de múltiples premios, presenta a los creadores de cambios que trabajan para hacer que Internet sea más seguro y la IA más confiable. Escuchar ahora"
