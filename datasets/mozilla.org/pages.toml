["https://mozilla.org/ar/about/manifesto"]
title = "بيان موزيلا"
description = "الإنترنت بهذه الصفات لن يأتي إلى الحياة من تلقاء نفسه. يجب على الأفراد والمنظمات تضمين هذه التطلعات في تكنولوجيا الإنترنت وفي التجربة البشرية مع الإنترنت. يُمثل بيان موزيلا والملحق التزام موزيلا بالنهوض بهذه التطلعات. نهدف إلى العمل مع الأشخاص والمُؤسسات في كل مكان الذين يشاركون هذه الأهداف لجعل الإنترنت مكانًا أفضل للجميع."
full_description = "مُلحق بيان موزيلا تعهُّد من أجل إنترنت صحي الإنترنت العالمي المفتوح هو أقوى مورد تواصل وتعاون رأيناه على الإطلاق. حيث يُجسد بعض أعمق آمالنا نحو التقدم البشري. وهو يُتيح فرصًا جديدة للتعلم، وبناء شعور بالإنسانية المشتركة، وحل المشكلات الملحة التي تواجه الناس في كل مكان. وعلى مدى العقد الماضي، شهدنا الوفاء بهذا الوعد بطرق عديدة. لقد رأينا أيضًا قوة الإنترنت المستخدمة في تضخيم الانقسام والتحريض على العنف وتعزيز الكراهية والتلاعب بالواقع والواقع عن قصد. لقد تعلمنا أنه يجب علينا تحديد تطلعاتنا بشكل أكثر وضوحًا للتجربة الإنسانية للإنترنت. نحن نفعل ذلك الآن. نحن ملتزمون بإنترنت يشمل جميع شعوب الأرض — حيث لا تحدد الخصائص الديموغرافية للشخص إمكانية الوصول عبر الإنترنت أو الفرص أو جودة التجربة. نحن مُلتزمون بإنترنت يُعزز الخطاب المدني والكرامة الإنسانية والتعبير الفردي. نحن ملتزمون بإنترنت يرفع من مستوى التفكير النقدي والحُجج المنطقية والمعرفة المشتركة والحقائق التي يُمكن التحقق منها. نحن ملتزمون بإنترنت يُحفز التعاون بين مجتمعات متنوعة تعمل معًا من أجل الصالح العام. أظهروا دعمكم الإنترنت بهذه الصفات لن يأتي إلى الحياة من تلقاء نفسه. يجب على الأفراد والمنظمات تضمين هذه التطلعات في تكنولوجيا الإنترنت وفي التجربة البشرية مع الإنترنت. يُمثل بيان موزيلا والملحق التزام موزيلا بالنهوض بهذه التطلعات. نهدف إلى العمل مع الأشخاص والمُؤسسات في كل مكان الذين يشاركون هذه الأهداف لجعل الإنترنت مكانًا أفضل للجميع. Share on Bluesky مبادئنا العشرة المبدأ الأول يُعتبر الإنترنت جزءًا لا يتجزأ من الحياة العصرية — ومُكون رئيسي في التعليم والتواصل والتعاون والأعمال والترفيه والمُجتمع ككل. المبدأ الثاني الإنترنت هو مورد عام عالمي يجب أن يظل مفتوحًا ويسهل الوصول إليه. المبدأ الثالث يجب أن يُثري الإنترنت حياة الأفراد. المبدأ الرابع يُعد أمان وخصوصية الأفراد على الإنترنت أمرًا أساسيًا ولا يجب إغفال جانب على حساب الآخر. المبدأ الخامس يجب أن يتمتع الأفراد بالقدرة على تشكيل الإنترنت وتجاربهم الخاصة عليه. المبدأ السادس تعتمد كفاءة الإنترنت كمُورد عام على إمكانية التشغيل التفاعلي (البروتوكولات وتنسيقات البيانات والمحتوى) والابتكار والمشاركة اللامركزية في جميع أنحاء العالم. المبدأ السابع تُعزز البرمجيات الحرة والمفتوحة المصدر من تطوير الإنترنت كمورد عام. المبدأ الثامن تُعزز العمليات المجتمعية الشفافة المشاركة والمساءلة والثقة. المبدأ التاسع تجلب المشاركة التجارية في تطوير الإنترنت العديد من الفوائد؛ حيث إن التوازن بين الربح التجاري والمنفعة العامة أمر بالغ الأهمية. المبدأ العاشر يُعد تعظيم جوانب المنفعة العامة للإنترنت هدفًا مهمًا يستحق الوقت والاهتمام والالتزام. Share on Bluesky اقرأ البيان كاملًا"
