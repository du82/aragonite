["https://mozilla.org/ar/foundation/annualreport/2024"]
title = "State of Mozilla 2024"
description = "As part of Mozilla’s 25-year-long dedication to ensuring a healthy, safe and trustworthy internet for all, we have learned that when you’re part of a technology movement designed to change society for the better, results don’t happen overnight."
full_description = 'State of Mozilla 2024 Evolving Together: Redefining Mozilla Reinventing Mozilla Building a Balanced Portfolio Products Built for People, Trust & Privacy A Vision for AI and Data A New Way for Advertising Community at our Core An Expanding Ecosystem Evolving Together: Redefining Mozilla in the AI Era Mozilla stands for putting people and communities in control of how technology shows up in their lives. In 1998, that meant taking the web in a better direction. In 2024, it means doing the same for AI, and making sure that open source wins again in the AI era. Why? Because data and AI have become fundamental building blocks with which we create the digital tools we all use everyday. And, as it was with the web 25 years ago, whoever controls these building blocks — and how they work — has a tremendous impact on our agency, our relationships, and our lives. Mark Surman President Read the full article 2023 Audited Financial Statement Download report 2023 Form 990 Download report Reinventing Mozilla 1.1 3 min read For the sake of our digital future, open source must win Mitchell Baker Executive Chair of the Board As part of Mozilla’s 25-year-long dedication to ensuring a healthy, safe and trustworthy internet for all, we have learned that when you’re part of a technology movement designed to change society for the better, results don’t happen overnight. Read more 1.2 6 min read Financing an Open Internet: Mozilla’s path forward Eric Muhlheim & Angela Plohman Chief Financial Officer / Chief Operating Officer Mozilla has shifted much of its philanthropic and advocacy work toward AI, experimenting with different approaches and learning what it takes to make a real impact. Early successes like the Common Voice project and the Responsible Computing Challenge proved that building more inclusive, values-driven AI is possible. Read more 1.3 4 min read How Mozilla is meeting the challenge of transformation on the internet Suba Vasudevan SVP of Strategy and Operations The tech landscape has changed significantly since Mozilla’s founding. What the world needs from us today is different from back then, but no less important. People deserve choice and agency over the way they engage with the internet, even more so now with AI in the picture. Read more 1.4 4 min read A rebrand and a call to action: Reclaim the internet Lindsey O’Brien Chief Marketing Officer For years Mozilla has been incorrectly thought of by many as "the Firefox company." This perception left too much of our great work in the shadows. To bring some more light, we’ve started the process of reinvigorating and elevating the Mozilla brand itself. Read more Mozilla is a product company and a rights defender and a social movement, working at all times to center humanity, not just technology–and ensure that the future serves us. Nabiha Syed Building a Balanced Portfolio 2.1 5 min read Imagining, co-creating and translating our way to a better tech future Nabiha Syed Executive Director, Mozilla Foundation I remember the first time I connected to the internet in the 1990s. That distinctive dial-up tone wasn’t just noise – it was the sound of possibility. It was a time when we weren’t “users” or “consumers;” we were creators, dreamers, and builders of digital worlds. Read more 2.2 4 min read Strategic innovation: A 25-year mission Laura Chambers Chief Executive Officer, Mozilla Corporation At the heart of everything we do lies our commitment to improving the internet — not just for today, but for future generations. This core commitment shapes every decision we make, as we navigate and lead through an ever-changing technological and regulatory landscape. Read more 2.3 3 min read Empowering developers with open AI tools for a trustworthy future Jane Silber Interim Chief Executive Officer, Mozilla.ai The artificial intelligence landscape is evolving rapidly, with a growing number of tools and large language models (LLMs) to choose from. This can be both exciting and overwhelming, for developers who are working on AI projects. Read more 2.4 3 min read Backing bold ideas: Mozilla Ventures and responsible innovation Mohamed Nanabhay Managing Director, Mozilla Ventures Two years ago we announced Mozilla Ventures and its core mission of investing in companies building technology designed to have a positive impact on people’s lives and society as a whole. Read more 2.5 4 min read Success through two-way conversations with our community Ryan Sipes Managing Director, Product (MZLA/Thunderbird) When I first joined the Thunderbird team in 2017, my focus was on keeping it alive. In the early days, it was governed solely by the Thunderbird Council, which is an elected group of contributors dedicated to the project. Read more Products Built for People, Trust & Privacy 3.1 4 min read Products built for people: A vision for internet safety and privacy Adam Fishman Product Strategy & Execution I’m uniquely positioned as the top person overseeing new product strategy and execution at the Mozilla Corporation. As a product builder in this area, I don’t have to focus on what’s happening tomorrow; I get to lock in on the long game. Read more 3.2 4 min read Leading browsing innovation for a complex web Vicky Chin VP of Engineering Even as it turns 20 years old, Firefox remains an essential option for experiencing a better internet. Firefox has always been about giving users choice and real user control over their online experience, and this vision is more relevant than ever. Read more A Vision for AI and Data 4.1 5 min read Shaping AI we can trust: Mozilla’s portfolio at work Ayah Bdeir Senior Advisor People want a positive relationship with technology. A relationship we can be excited about, one where AI, phones and other devices delight us, make life easier and enrich our work lives. In the AI era, this is not how it feels. Read more 4.2 3 min read Scaling local AI innovation for real-world impact Imo Udom SVP of Innovation Ecosystems At Mozilla, we’re always looking for ways to make technology that empowers people and solves real world problems. We’re excited about the technology shift being created by AI, but need to make sure it benefits more people than just those with the most resources. Read more We’ve started to become something closer to a Mozilla.org for the current era — grounded in our roots, but with a growing mosaic of companies, programs, and projects doing for AI what we did for the web. Mark Surman A New Way for Advertising 5.1 3 min read Reimagining the ad ecosystem: Balancing privacy and relevance Orville McDonald Sr. Director, Ads - Product Manager Can online advertising thrive without exploiting your personal data? At Mozilla, we believe it not only can, but must. Read more 5.2 3 min read A privacy-first solution that meets advertisers’ needs Brad Smallwood & Graham Mudd SVP of Anonym & SVP of Product Whenever the topic of online privacy arises, the common refrain from Big Tech is that targeted ads are an essential mechanism for funding the online services we all enjoy, so there’s no choice but to let them vacuum up our personal data. Read more Community at our Core 6.1 3 min read Building in public with community and openness Monica Chambers Director, Mozilla Accelerator Innovation at Mozilla isn’t just about creating better tools — it’s about reimagining how we interact with the internet and putting the power back into people’s hands. We have a long history of building in public, learning through building, and iterating in community to achieve that goal. Read more 6.2 3 min read Global collaboration for a fairer, healthier internet Zeina Abi Assy Principal Curator Humans are innate toolmakers, and the tools we create have always shaped who we become and how we adapt. Information technology is one expression of this legacy which has become essential to how we connect and live our lives. Read more An Expanding Ecosystem 7.1 2 min read Mozilla Venture Companies Building Mozilla is a balance of philanthropic vision and commercial strategy, united under a mission to serve the public good. Mozilla Ventures embodies this commitment, investing in startups aligned with our values and the Mozilla Manifesto. In doing so, we help foster a generation of tech companies that prioritize public benefit alongside profit, ultimately strengthening the internet’s health. Read more 7.2 5 min read Why I Joined Mozilla At Mozilla, we have big ambitions for the future, we want to build impactful products that are different — that are built with more respect for the people using them and help us explore new forms of openness. It’s going to take hard work that Mozilla is uniquely suited to take on. It’s why we’re here. It’s who we are. And it’s our future. Read more 7.3 2 min read Mozilla Fellows The Mozilla Fellowship program invests in people who champion a free and open internet—those who challenge the status quo, defend digital rights, and shape policies that promote online privacy and transparency. Read more 7.4 2 min read Rise25 Winners Launched as part of Mozilla’s 25th anniversary celebrations, Rise 25 honors a remarkable cohort of visionaries working to improve the internet’s future. These leaders—spanning continents and disciplines—bring fresh perspectives to pressing challenges like digital inclusion, algorithmic transparency, data ethics, and community-driven innovation. Read more Join us in creating a better internet We know the internet has the potential to be even better. But we can only get there if we work together. Join us as this next chapter begins. Mozilla Manifesto Blog Download Firefox Careers Donate'
