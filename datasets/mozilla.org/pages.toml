title = "Mozilla – Internet für Menschen, nicht für Profit"
description = "Spende deine Stimme, um Spracherkennungstechnologien inklusiver zu gestalten und für alle zugänglich zu machen."
full_description = "Animation anhalten Animation abspielen Willkommen bei Mozilla Von vertrauenswürdigen Technologien bis hin zu Richtlinien, die deine digitalen Rechte verteidigen, bei uns kommst du an erster Stelle – immer. Mehr erfahren Eine stilisierte grüne Flagge auf einem schwarzen Hintergrund, bestehend aus dem „M“ für Mozilla und einem versetzten Pixel, das eine Referenz für das ursprüngliche Dinosaurierlogo darstellt. Eine stilisierte grüne Flagge auf einem schwarzen Hintergrund, bestehend aus dem „M“ für Mozilla und einem versetzten Pixel, das eine Referenz für das ursprüngliche Dinosaurierlogo darstellt. Lern das Internet wieder lieben Löse dich von Big Tech – unsere Produkte geben die Kontrolle über eine sicherere, privatere Internet Experience. Firefox: Hol dir den Goldstandard in Sachen Browsing, mit Geschwindigkeit, Datenschutz und Selbstbestimmung. Thunderbird: Vereinfache dein Leben mit einer App für all deine E-Mails, Kalender und Kontakte. Fakespot: Erkenne falsche Bewertungen, schlechte Produkte und unseriöse Verkäufer. Pocket: Speichere die besten Inhalte, die das Internet zu bieten hat, auf jedem Gerät – denn wer hat schon die Zeit, alles jetzt zu lesen? Mozilla VPN: Verbirg deinen Standort und deine Online-Abenteuer – streame wie die Locals, egal wo. Mozilla Monitor: Lass dich benachrichtigen, wenn deine personenbezogenen Daten gefährdet sind, und sichere sie wie ein Profi. Firefox Relay: Maskiere deine E-Mail-Adresse und Telefonnummer, damit du nur die Nachrichten erhältst, die du möchtest. Unsere Produkte erkunden Spende an die Non-Profit Mozilla Mozilla schafft eine Bewegung, um das Internet wiederzugewinnen. Gemeinsam können wir eine Zukunft aufbauen, in der unsere Daten geschützt sind, in der KI vertrauenswürdig ist und unverantwortliche Tech-Unternehmen zur Verantwortung gezogen werden. Aber das geht nur, wenn wir alle an einem Strang ziehen. Wir sind stolz darauf, Non-Profit zu sein. Kannst du heute an Mozilla spenden? Spenden Werde Teil der Bewegung: KI für das Volk Wir wollen den Menschen die Entwicklung und Zusammenarbeit mit vertrauenswürdiger Open-Source-KI erleichtern. Common Voice Produkt Spende deine Stimme, um Spracherkennungstechnologien inklusiver zu gestalten und für alle zugänglich zu machen. Spende deine Stimme Kann KI vertrauenswürdig sein? Event In einer Welt, in der KI-Innovationen von einigen Wenigen vorangetrieben werden, droht die Gefahr der Monopolisierung dieser Technologie. Mit Open-Source-Konzepten könnten wir das ändern. Jetzt ansehen Lumigator Produkt Hier findest du die passende LLM für deine Bedürfnisse, deinen Anwendungsfall und deine Daten. Loslegen Mozilla Ventures Programm Du hast ein ganz neues Start-up? Stelle Mozilla Ventures dein Unternehmen vor und sichere dir eine Förderung, mit der du positiven Wandel für die Zukunft der KI und des Internets vorantreiben kannst. Weiterlesen Llamafile Projekt Mit Llamafile kannst du große Sprachmodelle (Engl.: large language models, LLMs) auf deinem PC nutzen – ohne zusätzliche Installation. Und deine Daten bleiben sicher auf deinem Gerät. Loslegen Mozilla Entwickler*innen Programm Mozilla Entwickler*innen hilft unabhängigen Entwickler*innen dabei, transformative Open-Source-KI-Projekte durch Kollaborationen, Programming und Community auf die Beine zu stellen. Weiterlesen Du, KI und das Internet – was geht da wirklich ab? Typ Autor*in Thema Einleitung Artikel Laura Chambers Datenschutz und Sicherheit Anonym: Höhere Standards für datenschutzbewahrende digitale Werbung. Artikel Saoud Khalifah Künstliche Intelligenz Die Verantwortung, GenAI-Technologien sicher zu gestalten, liegt bei uns allen. Podcast IRL Podcast Künstliche Intelligenz Von Hollywood bis Hip-Hop, Künstler*innen verhandeln KI-Consent. Video Rebecca Smith Neuigkeiten Mozilla feiert bahnbrechende Creator*innen in der neuen Dokumentarserie „Firefox Presents“. Podcast IRL Podcast Künstliche Intelligenz Die Macht von Big Tech über die Sprache bedeutet Macht über Menschen. Bridget Todd spricht mit Führungskräften aus der Sprach-Community, die Sprach-KI in ihren eigenen Sprachen und Dialekten den Weg ebnen. Podcast IRL Podcast Künstliche Intelligenz Warum fühlt es sich oft so an, als seien wir Teil eines KI-Massenexperiments? Wie können wir neue Technologien verantwortlich testen? Bridget Todd bringt in Erfahrung was es heißt, mit unerprobten KI-Systemen zu leben, die Einfluss auf Millionen von Menschen nehmen, während sie mehr und mehr Teil des öffentlichen Lebens werden. Artikel Kristina Bravo Datenschutz und Sicherheit Kinder, die in einer sehr digitalen Welt aufwachsen. Was können besorgte Eltern tun? State of Mozilla Mozilla erfindet sich neu, diversifiziert sich um eine Konstellation von Organisationen, gestaltet Werbung neu und erschafft ein Open-Source KI-Ökosystem. Lies darüber im Bericht „State of Mozilla“ 2024. 2024 Bericht lesen Erfahre, welche Probleme die Zukunft des Internets formen *Datenschutz nicht inbegriffen Durchsuche unsere Bewertungen und lies nach, welche Tech-Gadgets und Apps heimlich deine Daten stehlen. Jetzt durchsuchen IRL Podcast Unser mehrfach preisgekrönter Podcast stellt die Changemaker vor, die das Internet sichererer und KI vertrauenswürdiger machen wollen. Jetzt anhören"
