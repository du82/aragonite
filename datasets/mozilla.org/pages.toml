["https://mozilla.org/ast/privacy/websites"]
title = "Websites, Communications & Cookies Privacy Notice — Mozilla"
description = "We may receive personal information from you based on your interaction with us on social media platforms, if you submit a job, intern, grant or fellow application, if you volunteer as a Mozilla community member, if you submit user feedback or a request to us, if you sign up for an account or for a subscription, or if you engage with a product or policy campaign."
full_description = "Websites, Communications & Cookies Privacy Notice April 3, 2024 We care about your privacy. When Mozilla (that’s us) collects information about you, our Mozilla Privacy Policy describes how we handle that information.This privacy notice applies to Mozilla operated websites and mobile apps, which include the domains mozilla.org, and firefox.com, among others. This includes, for example, addons.mozilla.org, bugzilla.mozilla.org, careers.mozilla.org, community.mozilla.org, developer.mozilla.org, foundation.mozilla.org, people.mozilla.org, support.mozilla.org, and wiki.mozilla.org. Things you should know We may receive personal information from you based on your interaction with us on social media platforms, if you submit a job, intern, grant or fellow application, if you volunteer as a Mozilla community member, if you submit user feedback or a request to us, if you sign up for an account or for a subscription, or if you engage with a product or policy campaign. Social Media: If you engage with our accounts on external social media platforms, such as X (formerly Twitter) and Facebook, we may receive personal information about you. If you use these networks, their privacy policies apply, and you are encouraged to read them. Job, Intern, Grant & Fellow Applicants: Applicants for employment, internship, grant, or fellowship opportunities with Mozilla are required to give us a name, street address, telephone number, email address, and resume, and sometimes additional information as well. We use this information to process and evaluate applications and to communicate with applicants about opportunities. We use Greenhouse to handle employment and intern applications, and Fluxx.io to handle fellowship and MOSS grant applications. Contributors: Volunteering for Mozilla as a community contributor may require Mozilla and others to communicate with you at the email address that you provide in connection to your contribution and to recognize your efforts. If you contribute to Bugzilla, or our code bases, then your email address and possibly your name will be publicly available to all internet users. If you create an account on Mozilla Connect (platform powered by Khoros, which has its own privacy notice), your name, your avatar, your posts and replies and other information you share will be accessible to Mozilla and other community members. If you create a profile at people.mozilla.org, it will be accessible to Mozilla employees and Mozilla contributors; you can edit your profile data at Profile Settings. We sometimes use contributor information from sources (such as Bugzilla) in dashboards to visually share aggregated data on the Mozilla community. An example is https://wiki.mozilla.org/Contribute/Dashboards. Where possible, we try to minimize contact information that is publicly displayed. User Feedback: You can provide feedback to us on our products and services on webpages like connect.mozilla.org, through an in-product experience, or through channels such as email, Bugzilla, Matrix, a social media account, our Get Involved page, or through a group like Student Ambassadors. Please minimize the personal information you choose to share on these forums because your comments may be accessible to the public. Accounts & Subscriptions: Some websites, for example Add-Ons for Firefox, Relay, Monitor, and MDN, require account creation. For account management we use Mozilla accounts, GitHub, or custom systems; learn more about how to manage your Mozilla account data. You may periodically receive emails in connection with your account or through subscriptions. Our email management vendors are SalesForce Marketing Cloud, Amazon Simple Email Service, Mailchimp, SocketLabs, Campaign Monitor, or Braze, and you can unsubscribe using the link at the bottom of the relevant email. Product & Policy Campaigns: Some of our webpages host product or policy campaigns. For example, you can request a link by email or SMS to install Firefox on your mobile device or petition your legislators on internet issues. We may use third parties to manage these campaigns and handle any data that you choose to submit. We may use cookies, clear GIFs, third-party web analytics, device information, and IP addresses for functionality and to better understand user interaction with our products, services, and communications. Functionality: We may use information such as cookies, device information, and IP addresses to enhance functionality of certain products, services, and communications. For example: We use cookies to remember information about your settings (such as language preference), and so that we can recommend relevant features and add-ons to you based on your settings. They also assist with user sign-in and authentication so you can bypass re-entering your passwords on certain Mozilla websites. We use IP addresses to customize communications by language and country. We use certain device information such as country, language, operator and OEM, to customize your experience. Metrics: We may also use cookies, device information, and IP addresses, along with clear GIFs, cookies and third-party services to help us understand in the aggregate how users engage with our products, services, communications, websites, online campaigns, snippets, devices, and other platforms. We use: Mozilla Glean, our first-party telemetry and analytics platform. You can learn more about the specific types of data we collect in the Glean Dictionary. Google Analytics, which places a cookie on your device, to obtain metrics on how users engage with our websites. This helps us to improve site content. Convert.com and ShareProgress, which place a cookie on your device, to help us test variations of web content. This helps us offer better web experiences to users. HTTP Referral Data, which may be included with Firefox’s installer, to understand the website domain or advertising campaign that referred you to our download page. This information helps us understand the effectiveness of our advertising campaigns and improve them. Other metrics tools from time to time, on an experimental basis. For example, we may do this to help evaluate a new metrics tool, or test existing metrics collection. Fraud Prevention: Mozilla has implemented third-party technology, Google’s Invisible reCAPTCHA, that operates in the background on some of our websites in order to identify fraudulent activity. Use of the Invisible reCAPTCHA is governed by the Google Privacy Policy and Terms of Use. You can control individual cookie preferences, indicate your cookie preferences to others, and opt out of web analytics and optimization tools. Cookie History: You can accept or decline individual cookies in your preferences in the Tools/Options/Privacy history section. Note that certain features of our products and services may not function properly without the aid of cookies. Do Not Track: Mozilla does not track users across third-party websites to provide targeted advertising. In addition, if you have configured your browser to send a “Do Not Track” signal when accessing our websites, Mozilla will not utilize any of the tools described in the Metrics section. Email: Our marketing communications are optional to receive and you can unsubscribe from the footer of the email or by updating your Mozilla email preferences, or for Thunderbird’s newsletter, on the Thunderbird website. Analytics & Optimization: Follow the instructions below to prevent data collection about your visits to Mozilla websites: Mozilla first-party tools: Opt out on www.mozilla.org. Google: Install the Google Analytics Opt-out Browser Add-on, which prohibits data transmission to Google Analytics. Some Mozilla.org pages use clear GIFs which communicate with DoubleClick to understand the effectiveness of our advertising campaigns; you can control personalized ads from DoubleClick in Google’s ad settings (you will be prompted to sign into your Google account). Convert.com: Opt out on www.mozilla.org. ShareProgress and Fathom.com: You can turn on Do Not Track in your browser. Social Media: The social sharing buttons on Mozilla websites are designed not to share data with the applicable social media provider until you specifically click the relevant social media icon. Some Mozilla websites allow you to make purchases (such as apps or gear), contribute funds to specific Mozilla projects, or make donations in support of Mozilla public and charitable programs. These transactions are often handled by Mozilla’s third-party vendors. Payment Processing: When you purchase something via a Mozilla website, contribute funds or make donations, you will send payment through one of our third-party payment providers: Stripe, Apple Pay, PayPal, Venmo or Google Pay. Mozilla receives a record of your account (including your billing address and the last four digits of your payment method) and (where relevant) the status of your account’s subscription; we may also receive your name, mailing address, and/or email address. This data is used for payment processing, fraud detection and record-keeping purposes. Contact and Donation Information: We use Acoustic, Salesforce, Fundraise Up and Campaign Monitor to email receipts and store records, which are retained for 10 years from the date of last payment. If you make a donation to the Mozilla Foundation or Thunderbird, we use Fundraise Up to manage our donations and provide transactional receipts to donors. To make requests regarding your personal data, please contact us through our Data Subject Access Request Portal. If you have any other questions regarding personal data or our privacy practices, please contact us at compliance@mozilla.com. We respond to all requests we receive from individuals wishing to exercise their data protection rights in accordance with applicable data protection laws."
year_published = 2024
clearnet = "https://mozilla.org/ast/privacy/websites"
