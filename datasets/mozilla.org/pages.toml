["https://mozilla.org/bs"]
title = "Mozilla — Internet za ljude, a ne za profit"
description = "Donirajte svoj glas kako biste govornu tehnologiju učinili inkluzivnijom i dostupnijom za sve."
full_description = "Pauzirajte animaciju Pustite animaciju Dobrodošli u Mozilla Od pouzdane tehnologije do politika koje brane vaša digitalna prava, stavljamo vas na prvo mjesto - uvijek. Saznajte više o nama Stilizirana zelena zastava na crnoj pozadini, napravljena od 'M' za Mozilla i piksel koji je pomaknut da referencira njegov originalni logo dinosaura. Stilizirana zelena zastava na crnoj pozadini, napravljena od 'M' za Mozilla i piksel koji je pomaknut da referencira njegov originalni logo dinosaura. Ponovo volite internet Oslobodite se velike tehnologije — naši proizvodi vam daju kontrolu nad sigurnijim, privatnijim internet iskustvom. Firefox: Dobijte zlatni standard za pregledavanje uz brzinu, privatnost i kontrolu. Thunderbird: Pojednostavite svoj život s jednom aplikacijom za sve svoje e-mailove, kalendare i kontakte. Fakespot: Uočite lažne recenzije, loše proizvode i nepouzdane prodavce. Pocket: Sačuvajte najbolji internetski sadržaj na bilo kom uređaju — jer ko sada ima vremena da sve pročita? Mozilla VPN: Čuvajte svoju lokaciju i avanture na mreži privatnima — strimujte kao lokalni, bilo gdje. Mozilla Monitor: Dobijte obavijest ako su vaši lični podaci ugroženi i zaključajte ih kao profesionalac. Firefox Relay: Maskirajte svoj e-mail i broj telefona tako da dobijate samo poruke koje želite. Istražite naše proizvode Donirajte Mozilla neprofitnoj organizaciji Mozilla gradi pokret za vraćanje interneta. Zajedno možemo izgraditi budućnost u kojoj je naša privatnost zaštićena, AI pouzdana, a neodgovorne tehnološke kompanije odgovorne. Ali to je moguće samo ako to radimo zajedno. Ponosno smo neprofitni. Hoćete li danas donirati Mozilla? Donirajte Pridružite se pokretu: AI za ljude Naša misija je da ljudima olakšamo izgradnju i saradnju na otvorenoj, pouzdanoj AI. Common Voice Proizvod Donirajte svoj glas kako biste govornu tehnologiju učinili inkluzivnijom i dostupnijom za sve. Donirajte svoj glas Može li AI biti pouzdan? Događaj U svijetu u kojem inovacije umjetne inteligencije pokreću nekolicina odabranih, riskiramo monopolizaciju ove tehnologije. Primjena koncepta otvorenog koda na AI bi to mogla promijeniti. Gledajte sada Lumigator Proizvod Pronađite pravi LLM za svoje potrebe, slučaj upotrebe i podatke. Započnite Mozilla Ventures Program Imate li startup u ranoj fazi? Predstavite svoju kompaniju na Mozilla Ventures i osigurajte finansijska sredstva za pokretanje pozitivnih promjena za budućnost AI i interneta. Pročitajte više Llamafile Projekt Lahko pokrenite velike jezičke modele (LLM) na svom računaru pomoću Llamafile — nije potrebna instalacija, a vaši podaci ostaju sigurni na vašem uređaju. Započnite Mozilla Builders Program Mozilla Builders pomaže nezavisnim programerima da kreiraju transformativne AI projekte otvorenog koda kroz prilagođenu saradnju, programiranje i zajednicu. Pročitajte više Vi, AI i internet – šta se zapravo dešava? Tip Autor Tema Predstavljanje Članak Laura Chambers Privatnost i sigurnost Predstavljamo Anonym: Podizanje granice za digitalno oglašavanje koje čuva privatnost. Članak Saoud Khalifah Umjetna inteligencija Održavanje sigurnosti GenAI tehnologija je zajednička odgovornost. Podcast IRL Podcast Umjetna inteligencija Od Hollywooda do hip hopa, umjetnici pregovaraju o pristanku na umjetnu inteligenciju. Video Rebecca Smith Vijesti Mozilla slavi revolucionarne kreatore u novoj dokumentarnoj seriji “Firefox Presents.” Podcast IRL Podcast Umjetna inteligencija Moć velike tehnologije nad jezikom znači moć nad ljudima. Bridget Todd razgovara sa liderima jezičke zajednice utirući put glasovnoj AI na njihovim jezicima i dijalektima. Podcast IRL Podcast Umjetna inteligencija Zašto se tako često osjećamo kao da smo dio masovnog AI eksperimenta? Koji je odgovoran način testiranja novih tehnologija? Bridget Todd istražuje šta znači živjeti s neprovjerenim sistemima umjetne inteligencije koji utiču na milione ljudi dok se pojavljuju u javnom životu. Članak Kristina Bravo Privatnost i sigurnost Djeca odrastaju u veoma online svijetu. Šta da radi zabrinuti roditelj? Izvještaj o stanju Mozillae Mozilla se ponovo osmišljava, diverzificirajući se oko konstelacije organizacija, ponovo zamišljajući oglašavanje i stvarajući AI ekosistem otvorenog koda. Pročitajte o tome u Izvještaju o stanju Mozillae za 2024. 2024 Pročitajte izvještaj Istražite probleme koji oblikuju budućnost interneta *Privatnost nije uključena Pretražujte naše recenzije da vidite koji tehnički uređaji i aplikacije krišom prikrivaju vaše podatke. Traži sada IRL Podcast Naš višestruko nagrađivani podcast predstavlja kreatore promjena koji rade na tome da internet učine sigurnijim i AI vjerodostojnijim. Poslušajte sada"
