["https://mozilla.org/ar/privacy/websites/cookie-settings"]
title = "إعدادات ملفات تعريف الارتباط — Mozilla"
description = "تصف هذه الصفحة الأنواع المختلفة من ملفات تعريف الارتباط التي قد تستخدمها موزيلا، وتُعطيك التحكّم في أنواع البيانات التي توافق على قيام موزيلا بجمعها."
full_description = 'إعدادات ملفات تعريف الارتباط ملفات تعريف الارتباط هي عبارة عن ملفات صغيرة تحتوي على أجزاء من المعلومات التي يتم حفظها على جهاز الكمبيوتر أو الجهاز الخاص بك عند زيارة أحد المواقع الإلكترونية. تستخدم موزيلا ملفات تعريف الارتباط للمساعدة على تشغيل مواقعنا الإلكترونية، وكذلك لجمع معلومات عن كيفية استخدامك لمواقعنا الإلكترونية والتفاعل معها، مثل الصفحات التي تزورها. تصف هذه الصفحة الأنواع المختلفة لملفات تعريف الارتباط والتقنيات المُماثلة مثل علامات البكسل وإشارات الويب وصور GIF الواضحة وجافا سكريبت والتخزين المحلي (التي يُشار إليها لاحقًا بعبارة "ملفات تعريف الارتباط") التي قد تستخدمها موزيلا، وتُعطيك التحكم في أنواع البيانات التي توافق على قيام موزيلا بجمعها. كيف تقوم موزيلا باستخدام ملفات تعريف الارتباط ضروري ما هي ملفات تعريف الارتباط الضرورية؟ تُعتبر هذه التقنيات ضرورية لدعم ميزات الموقع الإلكتروني الأساسية، مثل تسجيل الدخول في منطقة آمنة من أحد المواقع الإلكترونية أو إضافة عناصر إلى سلة التسوّق عبر الإنترنت، تلك الميزات التي لا يمكن إيقاف تشغيلها. كيف تقوم موزيلا باستخدام هذه البيانات؟ تستخدم موزيلا ملفات تعريف الارتباط الضرورية فقط لتوفير ميزات الموقع الإلكتروني الأساسية، مثل تسجيل الدخول باستخدام حساب Mozilla أو شراء اشتراك في برنامج عند إتمام عملية الشراء. قد لا تعمل ميزات الموقع الإلكتروني الأساسية بدون هذه التقنيات. تفضيل أوافق لا أوافق ما هي ملفات تعريف الارتباط الخاصة بالتفضيلات؟ تُستخدم هذه التقنيات لتذكّر الاختيارات التي حدّدتها خلال زيارة سابقة للموقع الإلكتروني. وأمثلة ذلك اللغة التي تُفضل القراءة بها أو لون الخط الذي تُفضّله. كيف تقوم موزيلا باستخدام هذه البيانات؟ تستخدم موزيلا ملفات تعريف الارتباط الخاصة بالتفضيلات للاعتناء بتفضيلاتك وتحسين تجربتك عند زيارة مواقعنا الإلكترونية. لا تُستخدم ملفات تعريف الارتباط هذه للأغراض التحليلية. تعمل ملفات تعريف الارتباط الخاصة بالتفضيلات على دعم الميزات بطريقة مشابهة لملفات تعريف الارتباط الضرورية، إلا أن الموقع الإلكتروني يُمكنه العمل بدونها. وبالتالي يُمكنك أن تختار عدم استخدامها. البيانات التحليلية أوافق لا أوافق ما هي ملفات تعريف الارتباط التحليلية؟ تقوم هذه التقنيات بجمع معلومات عن كيفية استخدام الأشخاص للمواقع الإلكترونية، مثل الصفحات التي تمت زيارتها والروابط التي تم النقر عليها والمواقع الإلكترونية الأخرى التي نشأت منها الزيارات. كيف تقوم موزيلا باستخدام هذه البيانات؟ تقوم موزيلا باستخدام معلومات التحليلات لفهم كيفية تفاعل المستخدمين مع مواقعنا الإلكترونية حتى نتمكن من تحسينها وإصلاح المشاكل التي قد تظهر. قد نستخدم أيضًا بيانات من ملفات تعريف الارتباط ومعلومات الجهاز وعناوين IP لمساعدتنا على فهم كيفية تفاعل المستخدمين مع منتجاتنا وخدماتنا واتصالاتنا ومواقعنا الإلكترونية وحملاتنا عبر الإنترنت وأجهزتنا ومنصاتنا الأخرى. لن نجمع معلومات التحليلات وضبط ملفات تعريف الارتباط التحليلية إلا بموافقتك. حفظ التعديلات <p><strong>يُرجى تشغيل JavaScript لتحديث إعدادات ملفات تعريف الارتباط.</strong></p> تم تحديث إعدادات ملفات تعريف الارتباط الخاصة بك. إشعار الخصوصية لدينا للمزيد من المعلومات التفصيلية عن أنواع المعلومات المختلفة التي تجمعها موزيلا عند زيارة مواقعنا الإلكترونية، تفضّل بزيارة إشعار الخصوصية لدينا من خلال الرابط أدناه. سياسة الخصوصيّة'
