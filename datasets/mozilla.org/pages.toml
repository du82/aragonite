title = "إصدار فَيَرفُكس للمطوّرين"
description = "يُضفي أدوات فَيَرفُكس للمطوّرين الآن على إعلانات CSS لونًا رماديًا باهتًا والتي ليس لها تأثير على الصفحة. عند تحريك مُؤشر الماوس فوق أيقونة المعلومات، سترى رسالة مفيدة حول سبب عدم تطبيق CSS، بما في ذلك تلميح حول كيفية إصلاح المشكلة."
full_description = "إصدار فَيَرفُكس للمطوّرين مرحبًا بك في متصفّحك المفضل الجديد. احصل على أحدث الميزات مع الأداء السريع وأدوات تطوير أنت بحاجة إليها مع الويب المفتوح. فيَرفُكس إصدار المُطوّرين — عربي Windows 64-bit Windows 64-bit MSI Windows ARM64/AArch64 Windows 32-bit Windows 32-bit MSI macOS Linux 64-bit Linux 32-bit قد لا يفي نظامك بمتطلبات فيَرفُكس، ولكن يمكنك تجربة أحد هذه الإصدارات: فيَرفُكس إصدار المُطوّرين — عربي Windows 64-bit Windows 64-bit MSI Windows ARM64/AArch64 Windows 32-bit Windows 32-bit MSI macOS Linux 64-bit Linux 32-bit لم يُعد Firefox Developer Edition مدعومًا على Windows 8.1 والإصدارات الأقدم. يُرجى تنزيل Firefox ESR (إصدار الدعم المُمتد) لاستخدام فيَرفُكس. تنزيل Firefox ESR 64-بت تنزيل Firefox ESR 32-بت تنزيل بنية مختلفة لم يُعد Firefox Developer Edition مدعومًا على macOS 10.14 والإصدارات الأقدم. يُرجى تنزيل Firefox ESR (إصدار الدعم المُمتد) لاستخدام فيَرفُكس. تحميل Firefox ESR فيَرفُكس إصدار المُطوّرين فيَرفُكس إصدار المُطوّرين فيَرفُكس إصدار المُطوّرين فيَرفُكس إصدار المُطوّرين فيَرفُكس إصدار المُطوّرين فيَرفُكس إصدار المُطوّرين التنزيل لنظام Linux 64-bit التنزيل لنظام Linux 32-bit إشعار خصوصية فيَرفُكس هل تستخدم دبيان أو أوبونتو أو أي توزيع قائم على دبيان؟ يُمكنك إعداد مستودع APT بدلًا من ذلك. يُرسِل إصدار فَيَرفُكس للمطوّرين تلقائيًا تعليقات إلى موزيلا. اطّلع على المزيد إصدار فَيَرفُكس للمطوّرين صُمم المتصفّح للمطوّرين جميع أدوات المُطورين الأحدث بإصدار تجريبي، بالإضافة إلى ميزات تجريبية، مثلMulti-line Console Editor و WebSocket Inspector. مسار وملف تعريف مُنفصلين حتى يتسنى لك بسهولة تشغيله بجانب الإصدار أو إصدار تجريبي فيَرفُكس. تفضيلات صُممت لمُطوري الويب: يتم تمكين المُتصفح وتصحيح الأخطاء عن بُعد افتراضيًا، وكذلك السِمة الداكنة وزر شريط أدوات المُطور. أدوات جديدة Inactive CSS يُضفي أدوات فَيَرفُكس للمطوّرين الآن على إعلانات CSS لونًا رماديًا باهتًا والتي ليس لها تأثير على الصفحة. عند تحريك مُؤشر الماوس فوق أيقونة المعلومات، سترى رسالة مفيدة حول سبب عدم تطبيق CSS، بما في ذلك تلميح حول كيفية إصلاح المشكلة. اطّلع على المزيد أدوات جديدة أدوات فَيَرفُكس للمطوّرين متصفّح أدوات فَيَرفُكس للمطوّرين الجديد قوي، ومرن، وأفضل ما في هذا كله أنه غير قابل للاختراق. يتضمن ذلك مُصحح أخطاء JavaScript هو الأفضل في فئته، والذي يُمكنه استهداف مُتصفحات مُتعددة وهو مدمج في React، وRedux. اطّلع على المزيد مزايا مبتكرة احترف CSS Grid فيَرفُكس هو المتصفح الوحيد الذي يحتوي على أدوات مُصممة خصيصًا للبناء والتصميم مع CSS Grid. تُتيح لك هذه الأدوات تصوّر الشبكة وعرض أسماء المناطق المرتبطة ومعاينة التحويلات على الشبكة وغير ذلك الكثير. اطّلع على المزيد معلومات أسرع لوحة الخطوط توفر لوحة الخطوط في متصفّح أدوات فَيَرفُكس للمطوّرين المُطورين وصولاً سريعًا إلى جميع المعلومات التي يحتاجونها حول الخطوط المستخدمة في عنصر ما. ويتضمن أيضًا معلومات قيمة، مثل مصدر الخط ووزنه ونمطه والمزيد. اطّلع على المزيد تصميم. كود. حسّن. نقّح. أنشئ مواقعك واجعلها مثالية مع أدوات فَيَرفُكس للمطوّرين Inspector افحص الكود وحسّنه لبناء تخطيطات بكسلات مثالية. معرفة المزيد عن Page Inspector وحدة تحكم تتبع مشكلات CSS وJavaScript والأمان والشبكة. معرفة المزيد عن وحدة تحكم الويب مصحح الأخطاء مصحح أخطاء JavaScript القوي مع دعم لإطار العمل الخاص بك. معرفة المزيد عن مُصحح أخطاء JavaScript الشّبكة راقب طلبات الشبكة التي يُمكن أن تُبطئ موقعك أو تحجبه. معرفة المزيد عن مراقب الشبكة لوحة التّخزين أضف وعدّل وأزِل ذاكرة التخزين المؤقت وملفات تعريف الارتباط وقواعد البيانات وبيانات الجلسة. معرفة المزيد عن لوحة التخزين Responsive Design Mode اختبار المواقع على الأجهزة التي تمت مُحاكاتها في متصفحك. معرفة المزيد عن Responsive Design View Visual Editing اضبط الرسوم المتحركة والمحاذاة والحشو. معرفة المزيد عن Visual Editing الأداء قم بحل تكتّل الاختناقات وتبسيط العمليات وتحسين الأصول. معرفة المزيد عن أدوات الأداء الذّاكرة ضع يديك على تسريبات الذاكرة واجعل تطبيقك سريعًا. معرفة المزيد عن أدوات الذاكرة Style Editor تحرير وإدارة جميع أوراق نمط CSS في مُتصفحك. معرفة المزيد عن Style Editor Firefox الاطلاع على أخبار فيَرفُكس يُرجى إدخال عنوان بريد إلكتروني صالح. يُرجى اختيار بلد أو منطقة يُرجى اختيار لغة يُرجى تحديد خيار واحد على الأقل من خيارات الرسائل الإخبارية. يجب أن تُوافق على إشعار الخصوصية نأسف، حدثت مشكلة في نظامنا. من فضلك حاول ثانية فيما بعد! عنوان البريد الإلكتروني: حدد البلد أو المنطقة: حدد البلد أو المنطقة آيسلاندا أثيوبيا أذربيجان أرمينيا أروبا أروغواي أستراليا أفريقيا الجنوبية أفغانستان أكرانيا أكروتيري ألبانيا ألمانيا أنتيجوا و بربودا أندورا أنغولا أنغويلا أوزباكستان أوغاندا أوغندا إريتريا إسبانيا إستونيا إسرائيل إقليم المحيط الهندي البريطاني إندونيسيا إيران إيرلندا إيطاليا الأرجنتين الأردن الإكوادور الإمارات العربيّة المتّحدة البحرين البرازيل البرتغال البهاما البوسنة و الهرسك الجزائر الجزر العذراء البريطانية الدنمارك الرأس الأخضر السلفادور السنغال السّعوديّة السّودان السّويد الصحراء الغربية الصّومال الصّين الضفة الغربية العراق الغابون الفيليبين القارة القطبية الجنوبية الكاميرون الكويت المغرب المكسيك المملكة المتّحدة المناطق الجنوبية و الأنتركتيكية الفرنسية النرويج النّاورو النّمسا النّيجر الهند الولايات المتّحدة اليابان اليمن اليونان بابوا غينيا الجديدة باراغواي باربادوس باساس دا إنديا باكستان بالاو برمودا بروناي بلجيكا بلغاريا بنغلاديش بنما بنين بهوتان بوتسوانا بورتو ريكو بوركينا فاسو بورما بوروندي بولندا بوليفيا بولينيسيا الفرنسية بونير و سينت أوستاتيوس و سابا بيرو بيليز تايلاند تايوان تركمانستان تركيا ترينيداد و توباغو تشاد تشيلي تنزانيا توغو توفالو توكيلاو تونس تونغا تيمور- ليشتي جامايكا جامبيا جان ماين جبل طارق جزر الترك والكايكوس جزر الفارو جزر الفوكلاند (المالفيناس) جزر القمر جزر الكايمان جزر الكوكوس (كيلنك) جزر المارشال جزر المالديف جزر بالميرا المرجانية جزر بتكيرن جزر بحر الكورال جزر سبراتلي جزر سليمان جزر غلوريوسو جزر فيرجن الأمريكية جزر كوك جزر ماريانا الشمالية جزر ميدواي جزر والس و فوتونا جزر پاراسيل جزيرة أوروبا جزيرة الكريسماس جزيرة بايكر جزيرة بوفي جزيرة تروملين جزيرة جارفيس جزيرة جونستون جزيرة خوان دي نوڤا جزيرة كليبرتون جزيرة مان جزيرة نافاسا جزيرة نورفولك جزيرة هولاند جزيرة هيرد و جزر ماكدونالد جزيرة وايك جزيرتي أشمور وكارتيير جمهورية أفريقيا الوسطى جمهورية التشيك جمهورية الدومينيك جنوب السودان جنوب جورجيا و جزر ساندويتش الجنوبيّة جورجيا جيبوتي جيرسي دهقلية دومينيكا دييغو غارسيا روسيا روسيا البيضاء رومانيا ريو