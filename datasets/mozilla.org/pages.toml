["https://mozilla.org/eo"]
title = "Interreto por personoj, ne por monprofito — Mozilla"
description = "Ĉu vi sciis ke Mozilla — la kreanto de Firefox — batalas por ke Interreto plu estu tutmonda publika rimedo, malfermita kaj alirebla por ĉiuj?"
full_description = "Firefox Browser Bonfare rapida. Duoble rapida, kun inkluzivita privateca protekto kaj subtenita de Mozilla, la nova Firefox estas bonfare rapida. Elŝuti Firefox Firefox is no longer supported on Windows 8.1 and below. Please download Firefox ESR (Extended Support Release) to use Firefox. Download Firefox ESR 64-bit Download Firefox ESR 32-bit Download a different build Firefox is no longer supported on macOS 10.14 and below. Please download Firefox ESR (Extended Support Release) to use Firefox. Download Firefox ESR Atentigo pri privateco de Firefox Ni daŭre igas la reton pli sekura, pli sana kaj pli rapida. Mozilla estas la neprofitcela organizo kiu kreas Firefox, la unuan alternativan retumilon. Ni kreas produtkojn kaj politikojn, kiuj permesas al la reto resti homcela, ne profitcela. Nia influo Kiam vi uzas Firefox vi halpeas Mozillan batali kontraŭ misinformo en la reto, instrui ciferecajn kapabloj kaj igi la komentan sekcion pli homan. Kontrolu tion, kio helpas krei pli sanan reton. Iniciato de Mozilla pri informfido Doni pli da povo al virinoj en la reto La projekto Coral Legi nian sanraporto pri Interreto Niaj novaĵoj Bazitaj sur la Teksaĵo kaj uzante ĝin kiel platformo, ni konstruas malfermitajn, novajn teĥnologiojn, kiuj permesas al programistoj labori sen esti malliberigitaj de fermitaj, korporaciaj ekosistemoj kaj ebligi pli rapidajn, pli sekurajn retumaj spertoj por ni ĉiuj. Common Voice Sistemo de virtuala realo Etendaĵoj Personecigu Firefox per viaj plej ŝatataj kromaĵoj, kiel pasvortaj administrantoj, reklamblokiloj, kaj pli. Karieroj Lernu pri la avantaĝoj de laboro en Mozilla kaj vidu malfermitajn postenojn en la tuta mondo. Ĉu vi bezonas helpon? Ricevu de nia helpa teamo, respondojn por viaj demandoj pri Firefox kaj ĉiuj produktoj de Mozilla. Firefox Ricevi novaĵojn de Firefox Please enter a valid email address Please select a country or region Please select a language Please check at least one of the newsletter options. You must