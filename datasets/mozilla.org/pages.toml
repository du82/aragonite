title = "Internet per a la gent, sense afany de lucre — Mozilla"
description = "Sabíeu que? Mozilla, el fabricant del Firefox, lluita per mantenir internet com un recurs públic, obert i accessible a tothom."
full_description = "Firefox Browser Definitivament veloç. Amb el doble de velocitat, amb la protecció de la privadesa integrada i amb Mozilla darrere, el nou Firefox és la millor manera de navegar. Baixa el Firefox Firefox is no longer supported on Windows 8.1 and below. Please download Firefox ESR (Extended Support Release) to use Firefox. Download Firefox ESR 64-bit Download Firefox ESR 32-bit Download a different build Firefox is no longer supported on macOS 10.14 and below. Please download Firefox ESR (Extended Support Release) to use Firefox. Download Firefox ESR Avís de privadesa del Firefox Fem d'Internet un lloc més segur, més saludable i més ràpid per sempre. Mozilla és l'organització sense ànim de lucre darrere el Firefox, el navegador alternatiu original. Creem productes i polítiques per fer que Internet estigui al servei de les persones, no del lucre. El nostre impacte Quan utilitzeu el Firefox, ajudeu Mozilla a lluitar contra la desinformació a Internet, a ensenyar les competències digitals i a fer més humana la secció de comentaris. Descobriu què ajuda a fer Internet més saludable. Mozilla Information Trust Initiative Emancipació de les dones a Internet Projecte Coral Llegiu el nostre informe de la salut d'Internet Les nostres innovacions Utilitzant el web com a plataforma, creem tecnologies obertes i innovadores que permeten als desenvolupadors prescindir dels ecosistemes tancats i corporatius i crear experiències web més ràpides i segures per a tothom. Common Voice Plataforma de realitat virtual Extensions Personalitzeu el Firefox afegint-li funcionalitats addicionals, com gestors de contrasenyes, bloquejadors d'anuncis i molt més. Oportunitats Informeu-vos dels beneficis de treballar a Mozilla i consulteu ofertes de treball d'arreu del món. Necessiteu ajuda? Obteniu respostes a les vostres preguntes sobre el Firefox i tots els productes de Mozilla del nostre equip de suport. Firefox Rebeu notícies del Firefox Please enter a valid email address Pleas