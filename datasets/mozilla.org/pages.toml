["https://mozilla.org/be/firefox/browsers/mobile/ios"]
title = "Firefox Browser для iOS (iPhone і iPad) - Mozilla"
description = "Праглядайце ўсе свае адкрытыя карткі, нядаўнія пошукавыя запыты і ўлюбёныя сайты ў адным месцы з Firefox Browser для iOS."
full_description = "Firefox Browser Хутчэй дабірайцеся да улюбёных месцаў на iPhone і iPad Праглядайце ўсе свае адкрытыя карткі, нядаўнія пошукавыя запыты і ўлюбёныя сайты ў адным месцы з Firefox Browser для iOS. Атрымайце Firefox для iOS Скануйце QR-код, каб пачаць сцягванне Зрабіцe Firefox вашым прадвызначаным браўзерам Цяпер карыстальнікі iPhone і iPad могуць абіраць свой уласны тыповы браўзер. Гэта значыць, што вы больш не прывязаны да Safari, а ваш мабільны браўзер можа сінхранізавацца з вашым улюбёным браўзерам на камп'ютары. Акрамя таго, калі вы ўсталёўваеце Firefox тыповым браўзерам, вы падтрымліваеце незалежную тэхналагічную кампанію. Да таго ж Firefox — адзіны буйны браўзер, які падтрымліваецца некамерцыйнай арганізацыяй. Хуткі. Прыватны. Бяспечны Захоўвайце прыватнасць, не адмаўляючыся ад звышвысокай хуткасці. Акрамя таго, функцыі разумнага прагляду даюць вам магчымасць заставацца прыватнымі, узяўшы паролі і закладкі з сабой, куды б вы ні адправіліся, што робіць ваша жыццё ў Інтэрнэце яшчэ лягчэй. Заставайцеся прыватнымі ў Інтэрнэце Firefox дае вам лепшую абарону прыватнасці падчас знаходжання ў Інтэрнэце. Наша Узмоцненая ахова ад сачэння тыпова блакуе трэкеры і скрыпты, такія як трэкеры сацыяльных сетак, міжсайтавыя трэкеры, крыптамайнеры і збіральнікі лічбавых адбіткаў. Ваша гісторыя аглядання застаецца гісторыяй Калі хочаце, вы лёгка можаце працаваць і шукаць у Інтэрнэце ў рэжыме прыватнага аглядання. А калі вы закрываеце рэжым прыватнага аглядання, гісторыя аглядання і ўсе кукі аўтаматычна выдаляюцца з вашай прылады. Зрабіце Firefox часткай свайго жыцця Дадайце Firefox на ўсе свае прылады для бяспечнага бесперапыннага аглядання. Сінхранізуйце іх, каб улюбёныя закладкі, захаваныя лагіны, паролі і гісторыя аглядання заўсёды былі з вамі, куды б вы ні адправіліся. Больш за тое — перасылайце адкрытыя карткі паміж тэлефонам і камп'ютарам, каб працягваць адтуль, дзе спыніліся. Знаходзьце ўсё хутчэй Атрымлівайце пошукавыя прапановы ў панэлі пошуку і хутка адкрывайце сайты, якія наведваеце найчасцей. Увядзіце пошукавы запыт і атрымайце прапановы і папярэднія вынікі ад вашых улюбёных пошукавых сістэм. Наладжвайце свой хатні экран Знаходзьце тое, што вас цікавіць у Інтэрнэце, хутчэй. Абірайце прагляд усіх адкрытых картак, нядаўніх пошукавых запытаў, закладак і ўлюбёных сайтаў у адным месцы. Знаходзьце больше цікавага Адкрыйце новую картку ў Firefox, каб убачыць сайты, якія вы часцей за ўсё наведваеце, нядаўнія закладкі і папулярныя артыкулы ў Pocket. Firefox дае вам хуткі доступ да нядаўна наведаных сайтаў, каб паскорыць пошук патрэбных. Пра Mozilla Mozilla існуе для таго, каб зрабіць Інтэрнэт даступным для кожнага, бо мы лічым, што адкрытая і вольная сетка лепш за зачыненую і рэгуляваную. Мы ствараем такія прадукты, як Firefox і Pocket, каб спрыяць магчымасці выбару, празрыстасці і кантролю."
