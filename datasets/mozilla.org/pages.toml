our Privacy Notice. Keep all your favorite browser features — and discover new ones. Works with Google products All your favorite Google tools (like Gmail and Docs) work seamlessly in the Firefox Browser. Facebook Container Download this browser extension to stop Facebook (and Instagram) from tracking you around the web. Sync your devices Firefox is available on all your devices; take your tabs, history and bookmarks with you. All you need is a Mozilla account and you’ll get access to syncing and more Mozilla products. Screenshots Grab a high-resolution image of anything online with our screenshot tool built right in the browser Enhanced Tracking Protection (ETP) Firefox automatically blocks many third party trackers from collecting and selling your web activity. Picture-in-Picture From watching a web tutorial to keeping an eye on your favorite team, your video follows you while you multitask. Download Firefox Firefox is no longer supported on Windows 8.1 and below. Please download Firefox ESR (Extended Support Release) to use Firefox. Download Firefox ESR 64-bit Download Firefox ESR 32-bit Download a different build Firefox is no longer supported on macOS 10.14 and below. Please download Firefox ESR (Extended Support Release) to use Firefox. Download Firefox ESR Firefox Privacy Notice Questions? Mozilla support has you covered. Firefox Browser Get Firefox Browser for Android Get Firefox Browser for iOS Download the Firefox mobile browser for automatic protection on all your devices. Learn about the Firefox desktop browser below"
