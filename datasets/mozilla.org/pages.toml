["https://mozilla.org/fi"]
title = "Mozilla — Internet ihmisille, ei voitontavoittelulle"
description = "Lahjoita äänesi tehdäksesi puhetekniikasta kaikenkattavaa ja kaikkien saatavilla olevaa."
full_description = "Keskeytä animaatio Toista animaatio Tervetuloa Mozillaan Luotettavasta tekniikasta digitaalisia oikeuksiasi puolustaviin käytäntöihin – asetamme sinut etusijalle, aina. Lisätietoja meistä Tyylitelty vihreä lippu mustalla taustalla, joka koostuu Mozillan M-kirjaimesta ja pikselistä, joka on sijoiltaan, ja siten viittaa alkuperäiseen dinosauruslogoon. Tyylitelty vihreä lippu mustalla taustalla, joka koostuu Mozillan M-kirjaimesta ja pikselistä, joka on sijoiltaan, ja siten viittaa alkuperäiseen dinosauruslogoon. Rakasta Internetiä jälleen Irtaudu suurista teknologiayrityksistä – tuotteidemme avulla voit hallita turvallisempaa ja yksityisempää Internet-kokemusta. Firefox: Hanki selaamisen kultainen standardi – nopeutta, yksityisyyttä ja hallintaa. Thunderbird: Yksinkertaista elämääsi yhdellä sovelluksella kaikille sähköposteillesi, kalentereillesi ja yhteystietoillesi. Fakespot: Havaitse tekaistut arvostelut, huonot tuotteet ja epäluotettavat myyjät. Pocket: Tallenna Internetin paras sisältö millä tahansa laitteella – koska kenellä on aikaa lukea kaikki nyt? Mozilla VPN: Pidä sijaintisi ja verkkoseikkailut yksityisinä – suoratoista kuin olisit kotimaassa, missä tahansa. Mozilla Monitor: Vastaanota heräte jos henkilötietosi ovat vaarantuneet, ja lukitse ne ammattilaisen tavoin. Firefox Relay: Peitä sähköpostiosoitteesi ja puhelinnumerosi, jotta saat vain haluamasi viestit. Tutustu tuotteisiimme Lahjoita yleishyödylliselle Mozillalle Mozilla rakentaa liikettä Internetin palauttamiseksi takaisin. Yhdessä voimme rakentaa tulevaisuuden, jossa yksityisyytemme on suojattu, tekoäly on luotettava ja vastuuttomat teknologiayritykset saatetaan vastuuseen. Se on mahdollista vain, jos teemme sen yhdessä. Olemme ylpeänä voittoa tavoittelemattomia, yleishyödyllisiä. Lahjoitatko tänään Mozillalle? Lahjoita Liity liikkeeseen: Tekoäly ihmisiä varten Tehtävämme on mahdollistaa ihmisten rakentaa ja tehdä yhteistyötä luotettavan, avoimeen lähdekoodiin pohjautuvan tekoälyn parissa. Common Voice Tuote Lahjoita äänesi tehdäksesi puhetekniikasta kaikenkattavaa ja kaikkien saatavilla olevaa. Lahjoita äänesi Voiko tekoäly olla luotettava? Tapahtuma Maailmassa, jossa tekoälyn innovointia ohjaavat harvat valitut, vaarannamme tämän tekniikan monopolisoinnille. Avoimen lähdekoodin käsitteiden soveltaminen tekoälyyn voi muuttaa tilanteen. Katso nyt Lumigator Tuote Löydä oikea kielimalli tarpeitasi, käyttötapauksiasi ja dataasi varten. Aloitetaan Mozilla Ventures Ohjelma Onko sinulla alkuvaiheen startup-yritys? Esittele yrityksesi Mozilla Venturesille ja turvaa rahoitus positiivisen muutoksen aikaansaamiseksi tekoälyn ja Internetin tulevaisuudelle. Lue lisää Llamafile Projekti Suorita suuria kielimalleja (LLM) vaivatta tietokoneellasi Llamafilen avulla — asennusta ei tarvita, ja tietosi pysyvät turvassa laitteellasi. Aloitetaan Mozilla Builders Ohjelma Mozilla Builders helps independent developers create transformative open-source AI projects through bespoke collaborations, programming, and community. Lue lisää Sinä, tekoäly ja Internet – mitä oikein on meneillään? Tyyppi Tekijä Aihe Johdanto Artikkeli Laura Chambers Tietosuoja ja turvallisuus Esittelyssä Anonym: Rimankohotus yksityisyyttä varjelevalle digitaaliselle mainonnalle. Artikkeli Saoud Khalifah Tekoäly GenAI-tekniikoiden turvaaminen on yhteinen vastuu. Podcast IRL Podcast Tekoäly From Hollywood to hip hop, artists are negotiating AI consent. Video Rebecca Smith Uutiset Mozilla celebrates groundbreaking creators in new documentary series “Firefox Presents.” Podcast IRL Podcast Tekoäly Big tech’s power over language means power over people. Bridget Todd talks to language community leaders paving the way for voice AI in their own languages and dialects. Podcast IRL Podcast Tekoäly Miksi usein tuntuu, että olemme osa tekoälyn massakokeilua? Mikä on vastuullinen tapa testata uusia teknologioita? Bridget Todd tutkii, mitä tarkoittaa elää todentamattomien tekoälyjärjestelmien kanssa, jotka vaikuttavat miljooniin ihmisiin niiden levitessä jokapäiväiseen elämään. Artikkeli Kristina Bravo Tietosuoja ja turvallisuus Lapset kasvavat maailmassa, jossa verkko on keskiössä. Mitä huolestunut vanhempi voi tehdä? Rise25-palkinnot Get to know the leaders championing trustworthy, inclusive and transparent AI development as they set a new standard and inspire the next generation of innovators. Katso palkintonäytös Tutki Internetin tulevaisuutta määrittäviä ongelmia *Privacy Not Included Etsi arvosteluistamme nähdäksesi, mitkä tekniset vempaimet ja sovellukset nuuskivat tietojasi. Etsi nyt IRL Podcast Useita palkintoja voittanut podcastimme esittelee muutoksentekijät, jotka tekevät Internetistä turvallisemman ja tekoälystä luotettavamman. Kuuntele nyt"
