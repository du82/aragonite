["https://mozilla.org/be"]
title = "Інтэрнэт для людзей, а не для прыбытку"
description = "Ці ведаеце вы, што Mozilla — стваральнік Firefox — змагаецца за тое, каб Інтэрнэт быў глабальным публічным рэсурсам, адкрытым і даступным для ўсіх і кожнага?"
full_description = "«Здароўе інтэрнэту і жыцця ў ім – вось чаму мы існуём». Мітчэл Бэйкер, выканаўчы старшыня праўлення, Mozilla Foundation Mozilla стварае прадукты, якія паважаюць прыватнасць Прыватнае і бяспечнае агляданне Атрымаць Firefox Самыя цікавыя артыкулы з інтэрнэту Атрымаць Pocket Выяўляйце падробленыя агляды пакупак Атрымаць Fakespot Схавайце свой нумар тэлефона і электронную пошту ад спамераў Атрымаць Relay VPN, якому можна давяраць Атрымаць Mozilla VPN Абараніце сваю прыватную інфармацыю ад брокераў дадзеных Атрымаць Monitor “Mozilla робіць стаўкі, каб паказаць свету, што бізнес можна рабіць з дапамогай надзейнага штучнага інтэлекту. Гэта ўключае ў сябе такія рэчы, як правы чалавека, абарону дадзеных і празрыстасць, у аснове працы гэтых складаных сістэм». Politico Далучайцеся да нас у стварэнні надзейнага ШІ Праца Mozilla з штучным інтэлектам – гэта не проста новая рэч. Мы выдаткавалі гады на фінансаванне, стварэнне і адстойванне адкрытага, справядлівага і адказнага развіцця штучнага інтэлекту. Мы сканцэнтраваныя на стварэнні штучнага інтэлекту, які служыць людзям, аддае перавагу празрыстасці і падтрымлівае грамадскае дабро, а не карпаратыўную павестку. Падрабязней Такім чынам, што такое Mozilla? Па сутнасці, Mozilla з'яўляецца актывісцкай арганізацыяй пад кіраўніцтвам Mozilla Foundation, якая ўносіць змены ў свет праз розныя мерапрыемствы, у тым ліку Mozilla Corporation, MZLA, Mozilla Ventures і Mozilla AI. Чым мы адрозніваемся? Паколькі мы кіруемся місіяй, гэта азначае, што ў нас ёсць свабода прымаць усе нашы рашэнні зыходзячы з таго, што лепш для інтэрнэту і ўсіх у сеціве, а не зыходзячы з патрабаванняў акцыянераў — у нас насамрэч няма ніводнага з іх. Даведацца аб Mozilla Foundation Стварайце наш рух Ахвяруйце Mozilla Foundation сёння, каб Інтэрнэт заставаўся адкрытым і даступным для ўсіх. Ахвяраваць Далучайцеся да барацьбы за здаровы інтэрнэт Ваш голас. Ваш код. Вашы ідэі. Ёсць літаральна тысячы спосабаў, як вы можаце зрабіць свой уклад у Mozilla. Стаць валанцёрам з Mozilla Аднойчы мы аддалі наш зыходны код… Праект Mozilla быў заснаваны ў Сан-Францыска ў 1998 годзе, калі браўзер Netscape прыняў радыкальнае рашэнне выдаць свой праграмны код грамадскасці для далейшага развіцця і ўдасканалення. У той час адна кампанія валодала фактычнай манаполіяй на тое, як людзі карыстаюцца Інтэрнэтам. У рэшце рэшт, праект з адкрытым зыходным кодам Mozilla ператварыўся ў надзвычай папулярную першую версію Firefox. Сёння Mozilla працягвае свой рух да лепшага Інтэрнэту з мільёнамі актыўных членаў супольнасці па ўсім свеце, якія выступаюць за этычныя тэхналогіі, надзейны штучны інтэлект і ствараюць прадукты, якія ставяць на першае месца канфідэнцыяльнасць і даюць больш магчымасцей людзям. Даведайцеся больш пра Mozilla Атрымліваць навіны Firefox Атрымлівайце парады, падказкі, навіны Firefox і нават больш Firefox Атрымліваць навіны Firefox Калі ласка, увядзіце сапраўдны адрас электроннай пошты Калі ласка, выберыце краіну або рэгіён Калі ласка, абярыце мову Калі ласка, пазначце хаця б адзін з варыянтаў рассылкі. Вы павінны пагадзіцца з паведамленнем аб прыватнасці Нам шкада, але ў нашай сістэме ўзнікла праблема. Калі ласка, паспрабуйце пазней! Ваш электронны адрас: Выберыце краіну або рэгіён: Выберыце краіну або рэгіён Mayotte Іарданія Ізраіль Інданезія Індыя Ірак Іран Ірландыя Ісландыя Іспанія Італія А.А.Э. Азербайджан Акраціры Албанія Алжыр Аман Амерыканскія Самоа Ангола Андора Анквіла Антарктыка Антыгуа і Барбуда Аргенціна Арменія Аруба Атол Джонстан Атол Пальміра Аўганістан Аўстралія Аўстрыя Багамы Балівія Бангладэш Барбадос Басас-да-Індыя Бахрэйн Баўгарыя Беларусь Бельгія Беліз Бенін Бермуды Боснія і Герцэгавіна Ботсвана Бразілія Брунэй Дарусалам Брытанская Індыйская Акіянская тэрыторыя Брытанскія Віргінскія выспы Буркіна Фасо Бурундзі Бутан В'етнам Валіс і Футуна Вануату Венесуэла Вугоршчына Выспа Боўвет Выспа Бэйкер Выспа Глар'ез Выспа Гіард і Выспы Мак-Дональда Выспа Джэрвіс Выспа Еўропа Выспа Жуан-ды-Нова Выспа Кліпертон Вы