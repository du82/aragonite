title = "An t-eadar-lìon do dhaoine ’s chan ann airson prothaid — Mozilla"
description = "An robh fhios aga? Tha Mozilla – na daoine a rinn Firefox – a’ dèanamh strì airson an t-eadar-lìon a chumail saor is fosgailte dhan a h-uile duine, goireas eadar-nàiseanta poblach."
full_description = "Firefox Browser Cho luath ’s a ghabhas. L2 2x air an astar, dìon prìobhaideachd ’na bhroinn agus Mozilla air chùl, ’s e am Firefox ùr an dòigh as fheàrr airson brabhsadh. Luchdaich a-nuas Firefox Firefox is no longer supported on Windows 8.1 and below. Please download Firefox ESR (Extended Support Release) to use Firefox. Download Firefox ESR 64-bit Download Firefox ESR 32-bit Download a different build Firefox is no longer supported on macOS 10.14 and below. Please download Firefox ESR (Extended Support Release) to use Firefox. Download Firefox ESR Aithris prìobhaideachd Firefox Nì sinn an t-eadar-lìon nas sàbhailte fallainne luaithe. ’S e am buidheann neo-phrothaideach air cùlaibh Firefox a th’ ann am Mozilla, a’ chiad roghainn eile air brabhsair. Cruthaichidh sinn batharan agus poileasaidh ach am frithealaich an t-eadar-lìon na daoine seach a’ phrothaid. Ar buaidh Nuair a chleachdas tu Firefox, cuidichidh tu Mozilla leis an strì an aghaidh mì-fhios air loidhne, le teagasg sgilean digiteach agus le roinnean bheachdan nas càileire. Faigh a-mach dè nì an t-eadar-lìon nas fhallainne. Iomairt urrasachd fiosrachaidh Mozilla A’ toirt comas do bhoireannaich air loidhne Pròiseact Coral Leugh an aithris againn air slàinte an eadar-lìn Ar n-innleachdan A’ cleachdadh an lìon mar bhun-stèidh, tha sinn airson teicneolasan fosgailte agus innleachdach a chruthachadh a bheir cothrom do luchd-leasachaidh obair a dhèanamh saor o shiostaman corporra dùinte is lìon a chruthachadh a bhios nas luaithe agus tèarainte dhan a h-uile duine. Common Voice Ùrlar fìorachd bhiortail Leudachain Cuir dreach pearsanta air Firefox leis na nithean a bharrachd as fheàrr leat, can manaidsearan fhaclan-faire, innealan-bacaidh sanasachd is mòran a bharrachd. Obair Fàs eòlach air na buannachdan a gheibhear ri linn dreuchd aig Mozilla agus faic na h-obraichean a tha bàn air feadh an t-saoghail. Cobhair a dhìth? Faigh freagairtean air do cheistean mu Firefox is bathar Mozilla air fad on sgioba taice againn. Firefox Faigh naidheachdan Firefox Cuir a-steach seòladh puist-d dligheach Please select a country or region Please select a language Please check at least one of the newsletter options. Feumaidh tu aontachadh ri brath na prìobhaideachd We are sorry, but there was a problem with our system. Please try again later! An seòladh puist-d agad: Tagh dùthaich no roinn-dùthcha: Tagh dùthaich no roinn-dùthcha A' Bhealaruis A' Bheilg A' Bheiniseala A' Bhulgair A' Chairtbheil A' Chròthais A' Ghearmailt A' Ghraonlann A' Ghreug A' Mholdobha A' Phoblachd Dhoiminiceach A' Phortagail A' Phòlainn Afghanastàn Afraga a Deas Aildiria Aintìoga is Barbuda Airmeinia Akrotíri Albàinia Am Bruach an Iar Am Monadh Neagrach An Antartaig An Argantain An Ceap Uaine An Danmhairg An Eadailt An Eaman An Eastoin An Eilbheis An Fhionnlann An Fhraing An Itiop An Laitbhe An Liotuain An Namaib An Nirribhidh An Ostair An Ruis An Rìoghachd Aonaichte An Salbhador An Spàinn An Tansan An Tuirc An Ucràin An Ungair An t-Seapan An t-Seàd An t-Sile An t-Slòbhac An t-Slòbhain An t-Suain An t-Sèirb An t-Sìn An t-Sìombab An Èiphit Andorra Anguilla Angòla Aràibia nan Sabhd Arùba Asarbaideàn Astràilia Atal Johnston Atal Palmyra A’ Chosobho A’ Ghaimbia A’ Mhasadon Bachrain Bangladais Bann Ghàsa Barbados Bassas da India Bearmùda Beilìs Beinin Bhiet-Nam Boilibhia Bonaire, Sint Eustatius agus Saba Bosna is Hearsagobhana Botsuana Braisil Brùnaigh Buirciona Faso Burundaidh Butàn Cailleann Nuadh Camarun Cambuidea Canada Casachstàn Catar Cathair na Bhatacain Ceinia Ciribeas Clipperton Island Coirèa a Deas Coirèa a Tuath Coloimbia Comoros Congo (Brazzaville) Congo (Kinshasa) Costa Rìcea Costa Ìbhri Cuibhèit Curaçao Cìopras Cìorgastan Cùba Deàrsaidh Dhekélia Diameuga Diego Garcia Diobraltar Diobùtaidh Doiminicea Dùthaich nam Mongol Dùthaich nan Suasaidh Dùthaich nan Tàidh Eacuador Eartra Eilean Baker Eilean Bouvet Eilean Europa Eilean Heard is MhicDhòmhnaill Eilean Howland Eilean Jarvis Eilean Juan de Nov