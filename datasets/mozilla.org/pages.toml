title = "Mozilla Leadership — Mozilla"
full_description = "Mozilla Leadership Mozilla Executive Leadership Council Mark Surman President, Mozilla @msurman commonspace.wordpress.com Link to this bio Mark Surman has spent three decades building a better internet, from the advent of the web to the rise of artificial intelligence.As President of Mozilla, a global nonprofit backed technology company that does everything from making Firefox to advocating for a more open, equitable internet, Mark’s current focus is ensuring the various Mozilla organizations work in concert to make trustworthy AI a reality. Mark led the creation of Mozilla.ai (a commercial AI R+D lab) and Mozilla Ventures (an impact venture fund with a strong focus on AI).Mark was Executive Director of Mozilla Foundation for 15 years. He grew the organization into an international movement-building force, renowned for its fellowships, philanthropy, advocacy, and insights work.Prior, Mark was the founding Director of telecentre.org, a $26M initiative connecting community technology centers in more than 30 countries. He ran the Commons Group, a boutique consulting firm specializing in open source and social enterprise. And he was awarded the prestigious Shuttleworth Fellowship to explore open source approaches to philanthropy.Mark’s analysis and opinions have been featured in The Washington Post, NPR, CNN, the BBC, Bloomberg, Fast Company and dozens of other publications. He has delivered keynotes on five continents at major global events, discussing trustworthy AI, open source, and the future of the internet.Mark serves on the Mozilla Foundation Board and is a past board member at Peer-to-Peer University, World Bank Solutions for Youth Employment Consortium, the Toronto Arts Foundation, Connected Learning Alliance, Telefonica’s Think Big, the Association for Progressive Communications, Wild Canada and rabble.ca.Mark lives in Toronto. He holds a BA in the History of Community Media from the University of Toronto. Laura Chambers Interim CEO, Mozilla Corporation Link to this bio Before assuming the role of CEO, Laura played a pivotal role as a member of the Mozilla Corporation Board for three years. During this time, she contributed significantly as the company underwent a strategic overhaul, preparing to tackle the evolving challenges in the internet's next 25 years of development.With a strong focus on product leadership, Laura has a proven track record of steering organizations through substantial transformations and turnarounds. Her notable experiences include:AirBnB: Led the core hosts business, which accounted for three-quarters of the company's operations. Drove a path to reacceleration through growth levers and tech platform transformationeBay and PayPal: Held various roles, including driving a turnaround for eBay's core global consumer selling division, and launching PayPal Mobile in 2009 during the rise of the mobile revolution.Willow Innovations: Served as the CEO of this innovative wearable medical device company, leading the company through rapid growth, product innovation and channel expansion.Beyond these accomplishments, Laura has held positions at Skype, McKinsey & Co, and the UNDP. A recognized author and thought leader, she has contributed to Fortune Magazine on topics such as trusting your instincts and avoiding burnout. As a member of World50 and YPO, exclusive peer groups of global leaders and CEOs, Laura brings a wealth of insights and expertise to the table.Laura holds an MBA from Stanford University and a bachelor's degree from the University of Melbourne. She currently resides in Melbourne, Australia with her husband and three children. Mohamed Nanabhay Managing Partner, Mozilla Ventures Link to this bio Before Mozilla Ventures, Mohamed was the Deputy CEO of the Media Development Investment Fund (MDIF), which invests in independent media around the world providing the news, information and debate that people need to build free, thriving societies. He continues to serve on the Investment Committee of MDIF.Mohamed spent nearly a decade at Al Jazeera, where he started the New Media department which focused on innovation and product development across internet, mobile, and social technologies. He then served as the Head of Online at Al Jazeera English where he led the team that produced the award-winning coverage of the Arab revolutions in 2011.In 2005 Mohamed founded QatarLiving.com (acquired in 2012), a listings and community website that quickly grew to be the largest site in Qatar. He also co-founded Signalnoi.se, a social analytics platform for newsrooms that won the Knight News Challenge.Mohamed previously served as a board member of the Mozilla Foundation, Media Development Investment, as the Board Chair of Global Voices Online, the Advisory Board of Creative Commons, and was a member of the World Economic Forum’s Global Agenda Council on Social Media.He received his undergraduate degree in Computer Science at the University of the Witwatersrand and a master’s degree in International Relations from the University of Cambridge. Jane Silber Interim CEO, Mozilla.ai Link to this bio Jane Silber, CEO of Mozilla.ai, is an accomplished technology executive, business leader and Board member. Her experience spans R&D, product development, open source communities and businesses, and is complemented by a strong background in company scaling, general management, distributed teams and corporate governance. With deep expertise in technology and AI, she brings a well-rounded perspective to leadership and innovation.She previously served as CEO of Canonical, the company behind the Ubuntu operating system. Joining as Chief Operating Officer (COO), she played a key role in shaping the company’s strategy, operations and growth. As CEO, she led Canonical through a period of expansion, driving adoption and commercial success of Ubuntu across cloud computing, enterprise IT, and consumer markets.Before Canonical, Jane held executive roles with General Dynamics C4 Systems in the US, and spent several years focused on R&D and new product development with Teijin Ltd in Yokohama, Japan.She maintains a diverse portfolio of non-executive Board members, including past and present roles with Diffblue (AI-powered software development), Induction Healthcare (technology for operational efficiency and improved patient outcomes), Weaveworks (cloud-native container management tools), and VONQ (recruitment marketing solutions), amongst others. She also serves as a member of the Mozilla Ventures Investment Committee.Jane holds a BS in Mathematics from Haverford College, an MS in Management of Technology from Vanderbilt University, and an MBA from Oxford University. She lives in London, England. Ryan Sipes Managing Director, Product MZLA Nabiha Syed Executive Director, Mozilla Foundation Link to this bio Nabiha Syed is Executive Director of Mozilla Foundation, the global nonprofit that does everything from championing trustworthy AI to advocating for a more open, equitable internet.Formerly, Nabiha was the CEO of The Markup, an award-winning journalism non-profit that challenges technology to serve the public good. Under her leadership, The Markup’s unique approach was referenced by Congress 21 times, inspired dozens of class action lawsuits, won a national Murrow Award and a Loeb Award, and was recognized as “Most Innovative” by FastCompany in 2022.Prior to The Markup, Nabiha was a highly acclaimed media lawyer with a legal career spanning private practice and the New York Times First Amendment Fellowship. She led BuzzFeed’s libel and newsgathering matters, including the successful defense of several high-profile libel lawsuits.Nabiha sits on the boards of the Scott Trust, the $1B+ British company that owns The Guardian newspaper, the New York Civil Liberties Union, the Reporters Committee for the Freedom of the Press, and the New Press. She also serves as an advisor to ex/ante, the first venture fund dedicated to agentic tech, and she is a current member of The World Economic Forum’s AI Governance Alliance. In 2023, Nabiha was awarded the NAACP/Archewell Digital Civil Rights Award for her work. Mozilla Corporation Executive Steering Committee Laura Chambers Chief Executive Officer Download photos Link to this bio Before assuming the role of CEO, Laura played a pivotal role as a member of the Mozilla Corporation Board for three years. During this time, she contributed significantly as the company underwent a strategic overhaul, preparing to tackle the evolving challenges in the internet's next 25 years of development.With a strong focus on product leadership, Laura has a proven track record of steering organizations through substantial transformations and turnarounds. Her notable experiences include:AirBnB: Led the core hosts business, which accounted for three-quarters of the company's operations. Drove a path to reacceleration through growth levers and tech platform transformationeBay and PayPal: Held various roles, including driving a turnaround for eBay's core global consumer selling division, and launching PayPal Mobile in 2009 during the rise of the mobile revolution.Willow Innovations: Served as the CEO of this innovative wearable medical device company, leading the company through rapid growth, product innovation and channel expansion.Beyond these accomplishments, Laura has held positions at Skype, McKinsey & Co, and the UNDP. A recognized author and thought leader, she has contributed to Fortune Magazine on topics such as trusting your instincts and avoiding burnout. As a member of World50 and YPO, exclusive peer groups of global leaders and CEOs, Laura brings a wealth of insights and expertise to the table.Laura holds an MBA from Stanford University and a bachelor's degree from the University of Melbourne. She currently resides in Melbourne, Australia with her husband and three children. Dani Chehak Chief People Officer Jenny Choo VP & Chief of Staff Link to this bio As Mozilla’s Chief of Staff to the CEO, Jenny supports Laura Chambers and empowers the leadership team through strategic collaboration and planning.Previously, Jenny spent 6.5 years at Meta managing diversity strategic partnerships and driving Diversity, Equity & Inclusion initiatives as Chief of Staff and Business Operations Lead. At Intuit, she led the diversity recruiting strategy and developed emerging talent through the Rotational Development Program. During her 13-year tenure with Special Olympics Northern California, Jenny’s role involved fostering sports programs and providing opportunities for corporate philanthropy.Outside of work, Jenny enjoys quality time with friends, family (often with wine), working out and lake time with her partner. Together they have a dog named Davis, named after their alma mater UC Davis. Anthony Enzor-DeMeo SVP of Firefox Link to this bio As Senior Vice President of Firefox, Anthony is responsible for guiding the vision and strategy for Firefox, driving overall business growth, and fostering a strong, motivated team.Anthony brings a broad range of experience across several industries, including real estate and prop tech, consumer fintech, e-commerce, and automotive. Prior to joining Mozilla, Anthony served as Chief Product and Technology Officer at Roofstock, where he oversaw the technology roadmap for the entire organization as well as multiple business product lines. During his tenure, he led the company through a strategic acquisition that significantly enhanced its product offerings.Earlier, as Chief Product Officer at Better, Anthony led product and design efforts across the business, with a focus on the mortgage application, real estate, title, and insurance sectors of consumer mortgage. Before that, he held product leadership roles at Wayfair, where he created the B2B and B2C product divisions, developed a comprehensive API strategy, and served as the product lead for supply chain platforms. He rose to General Manager of product, engineering, and