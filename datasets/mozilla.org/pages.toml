full_description = "نبذة عن هذا الموقع يَعمل الموقع الإلكتروني www.mozilla.org منذ أكثر من عقدين من الزمان. يَعني هذا منذ عصور الديناصورات في سنوات الإنترنت. وبناءً على ذلك، يُعد www.mozilla.org حجر الزاوية لِشبكة الإنترنت، كما يتميّز بجذور راسخة في حركة المصدر المفتوح التي شهدت نشأة موزيلا. وفي الوقت الحالي، أصبح هذا هو الموقع الذي يأتي فيه الأشخاص لتحميل فيَرفُكس، وتجربة موزيلا VPN، والتعرّف على المزيد عن موزيلا. يُمكنك أيضًا اكتشاف القليل من الروائع على طول الطريق. ومثل العديد من منتجاتنا، فإن هذا الموقع الموقع الإلكتروني مفتوح المصدر: عرض الكود المصدري على GitHub أبلِغ عن علة مساهمة في قاعدة الكود مساهمة في الترجمات قراءة الوثائق الكلمة الافتتاحية بعض المشاريع مفتوحة المصدر المُستخدمة في إنشاء هذا الموقع: Django كإطار عمل ويب نهائي خلفي، مع jinja للنماذج. نظام تصميم بروتوكول موزيلا لِمكونات النهاية الأمامية والعلامة التجارية. نظام Fluent من موزيلا لِترجمة اللغات. الكثير من المكتبات والأطر الصغيرة الأخرى، التي يمكنك العثور عليها في GitHub repoالخاصة بنا. نودّ أن نتقدّم بخالص الشكر والتقدير لِجميع المُساهمين في موزيلا الذين ساعدوا في تحسين الويب والارتقاء به."
