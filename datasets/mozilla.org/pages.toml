["https://mozilla.org/en-US/careers"]
title = "Mozilla Careers — Feel good about your work again."
description = "Konstantina Papadea has spent the last dozen years building and nurturing communities around Mozilla’s products. Before venturing into the world of tech, Konstantina had been focused on mining and economic …"
full_description = "I really enjoy how everyone on the team comes from different backgrounds (architecture, banking, engineering, etc) and that it's actually really hard to find someone with the same background. Equally as great is knowing that despite a diverse set of backgrounds we share a similar passion and need for data and browser transparency. Perla D. Product Manager Austin, TX It’s hard to come out. First you have to figure out your own stuff. And at some point along the way you have to consider how revealing your authentic self might affect your experience at work or your career trajectory. My journey to understanding my deeply felt gender identity took many decades. By the time I decided to transition my gender presentation to female, I had already worked at Mozilla for a few years. In that time, I saw a workplace culture where people respected differences and appreciated that diverse ideas from a diverse team leads to better work. My transition at work was remarkable for how unremarkable it was. I received congratulations, high-fives and hugs from colleagues. Mozilla’s leadership provided invaluable assistance in this process and our health benefits continue to support gender affirming care. Now, five years after I came out at work, I’m thriving at Mozilla. I feel respected and appreciated for what I have to offer as my true self. Lauren N. Senior Marketing Manager Portland, OR I had one of the best onboarding experiences with Mozilla. Be it team introductions, orientation sessions or your 1:1 with your manager, I could clearly sense the culture of openness and inclusion. Sunil M. Senior Software Engineer Nuremberg, Bavaria, Germany I was hired while on the fifth month of my pregnancy, so needless to say I was worried if that would affect the perception of me as a professional within the team. But my experience with Mozilla has been only empowering and uplifting. Being a new mom, I also cannot describe how much I appreciate the flexibility and benefits provided. Anna Y. Senior Software Engineer Aldie, VA"
year_published = 2025
clearnet = "https://mozilla.org/en-US/careers"
