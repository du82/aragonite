["https://mozilla.org/da"]
title = "Mozilla — Internet for folk, ikke profit"
description = "Donér din stemme for at gøre stemmeteknologi mere inkluderende og tilgængelig for alle."
full_description = "Sæt animation på pause Afspil animation Velkommen til Mozilla Fra troværdig teknologi til beskyttelse af dine digitale rettigheder - vi sætter altid dig først. Læs mere om os Et stiliseret grønt flag på en sort baggrund, skabt af bogstavet ‘M’ for Mozilla og en pixel, der er forskudt for at referere til Mozillas oprindelige dinosaurlogo. Et stiliseret grønt flag på en sort baggrund, skabt af bogstavet ‘M’ for Mozilla og en pixel, der er forskudt for at referere til Mozillas oprindelige dinosaurlogo. Elsk internettet igen Sig farvel til de store teknologivirksomheder – vores produkter giver dig kontrollen tilbage, bedre sikkerhed og et bedre beskyttet privatliv Firefox: Få en hurtig browser, der beskytter dit privatliv og sætter dig i førersædet. Thunderbird: Gør dit liv enklere med én app til alle dine mails, kalendere og kontakter. Fakespot: Undgå forfalskede anmeldelser, dårlige produkter og upålidelige sælgere. Pocket: Gem internettets bedste indhold på alle dine enheder — for hvem har tid til at læse alt lige nu? Mozilla VPN: Skjul din placering og dine handlinger på nettet — stream som om du var hjemme, uanset hvor du er. Mozilla Monitor: Få besked og forhåndsregler, hvis dine personlige oplysninger er i fare. Firefox Relay: Masker din mailadresse og dit telefonnummer, så du kun modtager de meddelelser, du ønsker. Udforsk vores produkter Donér til non-profit organisationen Mozilla Mozilla bygger et fællesskab for at vinde internettet tilbage. Sammen kan vi skabe en fremtid, hvor vores privatliv er beskyttet, AI er pålidelig og uansvarlige teknologivirksomheder bliver stillet til ansvar. Men det er kun muligt, hvis vi gør det sammen. Vi er en nonprofit-organisation og stolte af det. Vil du donere til Mozilla i dag? Donér Bliv en del af fællesskabet: AI for folket Vores mission er at gøre det nemt for folk at bruge og samarbejde omkring AI, der er open source og pålidelig. Common Voice Produkt Donér din stemme for at gøre stemmeteknologi mere inkluderende og tilgængelig for alle. Donér din stemme Kan AI være pålidelig? Begivenhed I en verden, hvor udvikling af AI er drevet af en lille, lukket kreds, risikerer vi at teknologien bliver monopoliseret. Det kan ændres ved at bruge koncepter fra open source. Se nu Lumigator Produkt Find den rigtige LLM til dine behov, anvendelsesområder og data. Kom i gang Mozilla Ventures Program Er I en start-up i den tidlige fase? Præsenter jeres virksomhed for Mozilla Ventures og få finansiering til at arbejde for positive ændringer i forhold til fremtiden for AI og internettet. Læs mere Llamafile Projekt Kør nemt store sprogmodeller (LLM'er) på din computer med Llamafile — ingen installation er nødvendig og dine data forbliver sikre på din enhed. Kom i gang Mozilla Builders Program Mozilla Builders gør det muligt for uafhængige udviklere at skabe transformative open source-AI-projekter gennem skræddersyede samarbejder, programmering og fællesskab. Læs mere AI, internettet og dig — hvad foregår der egentlig? Type Forfatter Emne Introduktion Artikel Laura Chambers Privatliv og sikkerhed Anonym: En højere standard for digital annoncering, som respekterer folks privatliv. Artikel Saoud Khalifah Kunstig intelligens Det er et fælles ansvar at sørge for, at GenAI-teknologier er sikre. Podcast IRL-podcast Kunstig intelligens Fra Hollywood til hip-hop-kunstnere forhandles der om AI-samtykke Video Rebecca Smith Nyheder Mozilla hylder banebrydende kreative mennesker i den nye dokumentarserie “Firefox Presents.” Podcast IRL-podcast Kunstig intelligens Store teknologivirksomheders magt over sproget betyder, at de har magt over mennesker. Bridget Todd taler med ledere fra sprog-fællesskaber, som baner vejen for stemme-AI på deres egne sprog og dialekter. Podcast IRL-podcast Kunstig intelligens Hvorfor føles det nogle gange som om vi er en del af et gigantisk AI-eksperiment? Hvordan kan vi teste nye teknologier på en ansvarlig måde? Bridget Tood undersøger, hvad det betyder at leve med uprøvede AI-systemer, der berør millioner af menneskers liv i takt med at systemerne implementeres i det offentlige liv. Artikel Kristina Bravo Privatliv og sikkerhed Børn vokser op i en verden, der er mere online end nogensinde. Hvad kan bekymrede forældre gøre? State of Mozilla Mozilla genopfinder sig selv ved at oprette nye organisationer, tænke annoncering på en ny måde og skabe et AI-økosystem baseret på open source. Læs mere i rapporten State of Mozilla 2024 2024 Læs rapporten Bliv klogere på emner, der sætter rammerne for internettets fremtid *Privatliv ikke inkluderet Gennemgå vores anmeldelser for at finde ud af, hvilke teknologiske gadgets og apps der stjæler dine data uden at du lægger mærke til det. Søg nu IRL-podcast Lyt til vores prisvindende podcast og lær mere om de mennesker, der går forrest i kampen for at gøre internettet sikrere og AI mere pålidelig. Lyt nu"
