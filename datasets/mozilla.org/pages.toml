["https://mozilla.org/en-US"]
title = "Mozilla - Internet for people, not profit (US)"
description = "We’re working to put control of the internet back in the hands of the people using it."
full_description = "Pause animation Play animation Welcome to Mozilla From trustworthy tech to policies that defend your digital rights, we put you first — always. Learn about us A stylized green flag on a black background, built from the ‘M’ for Mozilla and a pixel that is displaced to reference its original dinosaur logo. A stylized green flag on a black background, built from the ‘M’ for Mozilla and a pixel that is displaced to reference its original dinosaur logo. Love the internet again Break free from big tech — our products put you in control of a safer, more private internet experience. Firefox: Get the gold standard for browsing with speed, privacy and control. Thunderbird: Go chaos-free with one app for all your emails, calendars and contacts. Fakespot: Spot fake reviews, products and maybe one day, even fake laughs ;) Pocket: Save the internet’s best content on any device — because who has time to read everything now? Mozilla VPN: Keep your location and online adventures private — stream like a local, anywhere. Mozilla Monitor: Get a heads-up if your personal info is at risk and lock it down like a pro. Firefox Relay: Mask your email and phone number so you only get the messages you want. Explore our products Donate to the Mozilla non-profit Mozilla is building a movement to reclaim the internet. Together we can build a future where our privacy is protected, AI is trustworthy and irresponsible tech companies are held accountable. But that’s only possible if we do it together. We’re proudly non-profit. Will you donate to Mozilla today? Donate Join the movement: AI for the people Our mission is to make it easy for people to build with, and collaborate on, open-source, trustworthy AI. Common Voice Product Donate your voice to make speech technology more inclusive and accessible for everyone. Donate your voice Can AI be trustworthy? Event In a world where AI innovation is driven by a select few, we’re risking monopolization of this technology. Applying open-source concepts to AI could change that. Watch now Lumigator Product Find the “just right” LLM for your needs, use case and data — like Goldilocks, but with sharper teeth. Get started Mozilla Ventures Program Got an early-stage startup? Pitch your company to Mozilla Ventures and secure funding to drive positive change for the future of AI and the internet. Read more Llamafile Project Run large language models (LLMs) easily on your computer with Llamafile — no installation needed, and your data stays safe on your device. Get started Mozilla Builders Program Mozilla Builders helps independent developers create transformative open-source AI projects through bespoke collaborations, programming, and community. Read more You, AI and the internet — what’s really going on? Type Author Topic Intro Article Laura Chambers Privacy & Security Introducing Anonym: Raising the bar for privacy-preserving digital advertising. Article Saoud Khalifah Artificial Intelligence Keeping GenAI technologies secure is a shared responsibility. Podcast IRL Podcast Artificial Intelligence From Hollywood to hip hop, artists are negotiating AI consent. Video Rebecca Smith News Mozilla celebrates groundbreaking creators in new docuseries “Firefox Presents.” Podcast IRL Podcast Artificial Intelligence Big tech’s power over language means power over people. Bridget Todd talks to language community leaders paving the way for voice AI in their own languages and dialects. Podcast IRL Podcast Artificial Intelligence Why does it so often feel like we’re part of a mass AI experiment? What is the responsible way to test new technologies? Bridget Todd explores what it means to live with unproven AI systems that impact millions of people as they roll out across public life. Article Kristina Bravo Privacy & Security Kids are growing up in a very online world. What’s a concerned parent to do? State of Mozilla Mozilla is reinventing itself, diversifying around a constellation of organizations, reimagining advertising and creating an open source AI ecosystem. Read about it in the State of Mozilla 2024 Report. 2024 Read the report Explore issues shaping the future of the internet *Privacy Not Included Search our reviews to see which tech gadgets and apps are stealthily sneaking your data. Search now IRL Podcast Our multi-award winning podcast introduces the change-makers working to make the internet safer and AI more trustworthy. Listen now"
