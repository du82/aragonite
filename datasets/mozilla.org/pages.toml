title = "Mozilla – Ynternet foar minsken, net foar winst"
description = "Wy wurkje deroan om kontrôle oer it ynternet werom te jaan yn de hannen fan de minsken dy’t it brûke."
full_description = "Animaasjes pauzearje Animaasjes ôfspylje Wolkom by Mozilla Fan betroubere technology oant belied dat jo digitale rjochten ferdigenet, wy sette jo foarop – altyd. Mear oer ús In stillearre griene flagge op in swarte eftergrûn, boud fan de ‘M’ foar Mozilla en in piksel dy’t ferpleatst is om nei it orizjinele dinosauruslogo te ferwizen. In stillearre griene flagge op in swarte eftergrûn, boud fan de ‘M’ foar Mozilla en in piksel dy’t ferpleatst is om nei it orizjinele dinosauruslogo te ferwizen. Hâld wer fan it ynternet Brek frij fan grutte technology – ús produkten jouwe jo kontrôle oer in feiliger, mear privee ynternetûnderfining. Firefox: Krij de gouden standert foar sneupen mei snelheid, privacy en kontrôle. Thunderbird: Ferienfâldigje jo libben mei ien app foar al jo e-mail, aginda’s en kontakten. Fakespot: Fyn falske beoardielingen, minne produkten en ûnbetroubere ferkeapers. Pocket: Bewarje de bêste ynhâld fan it ynternet op elk apparaat – want wa hat der no tiid om alles te lêzen? Mozilla VPN: Hâld jo lokaasje en online aventoeren privee – stream as in lokale, oeral. Mozilla Monitor: Krij in berjocht as jo persoanlike gegevens gefaar rinne en beskoattelje se as in pro. Firefox Relay: Maskearje jo e-mailadres en telefoannûmer sadat jo allinnich de berjochten krije dy't jo wolle. Us produkten ferkenne Donearje oan de non-profitorganisaasje Mozilla Mozilla bout in beweging om it ynternet werom te winnen. Tegearre kinne wy in takomst bouwe wêr't ús privacy beskerme wurdt, AI betrouber is en ûnferantwurde technologybedriuwen ta ferantwurding roppen wurde. Mar dat kin allinnich as wy it tegearre dogge. Wy binne grutsk non-profit. Wolle jo hjoed donearje oan Mozilla? Donearje Doch mei oan de beweging: AI foar de minsken Us misje is om it maklik te meitsjen foar minsken om te bouwen mei, en gear te wurkjen oan, iepenboarne, betroubere AI. Common Voice Produkt Donearje jo stim om spraaktechnology ynklusiver en foar elkenien tagonkliker te meitsjen. Donearje jo stim Kin AI betrouber wêze? Barren Yn in wrâld dêr't AI-ynnovaasje oandreaun wurdt troch in beheind tal bedriuwen, riskearje wy monopolisearring fan dizze technology. It tapassen fan iepenboarnekonsepten op AI kin dat feroarje. No sjen Lumigator Produkt Fyn it krekte LLM foar jo behoeften, gebrûk en gegevens. Begjinne Mozilla Ventures Programma Hawwe jo in start-up yn de iere faze? Promoatsje jo bedriuw oan Mozilla Ventures en stel finansiering feilich om positive feroaringen te stimulearjen foar de takomst fan AI en it ynternet. Mear ynfo Llamafile Projekt Fier ienfâldich grutte taalmodellen (LLM’s) út op jo kompjûter mei Llamafile – gjin ynstallaasje nedich, en jo gegevens bliuwe feilich op jo apparaat. Begjinne Mozilla Builders Programma Mozilla Builders helpt ûnôfhinklike ûntwikkelers transformative iepenboarne AI-projekten te meitsjen fia gearwurkingen op maat, programmearring en in mienskip. Mear ynfo Jo, AI en it ynternet – wat bart der echt? Type Skriuwer Underwerp Yntro Artikel Laura Chambers Privacy en befeiliging Nij: Anonym: de latte heger lizze foar privacybeskermende digitale reklame. Artikel Saoud Khalifah Keunstmjittige yntelliginsje It feilich hâlden fan GenAI-technologyen is in dielde ferantwurdlikens. Podcast IRL-podcast Keunstmjittige yntelliginsje Fan Hollywood oant hiphop, artysten ûnderhannelje oer AI-tastimming. Fideo Rebecca Smith Nijs Mozilla fiert baanbrekkende makkers yn in nije dokumintêresearje ‘Firefox Presents’. Podcast IRL-podcast Keunstmjittige yntelliginsje De macht fan grutte technologybedriuwen oer taal betsjut macht oer minsken. Bridget Todd praat mei taalmienskipslieders en makket it paad frij foar spraak-AI yn harren eigen taal en dialekt. Podcast IRL-podcast Keunstmjittige yntelliginsje Wêrom fielt it sa faak dat wy diel útmeitsje fan in massaal AI-eksperimint? Wat is de ferantwurde manier om nije technologyen te testen? Bridget Todd ûndersiket wat it betsjut om te libjen mei net bewizen AI-systemen dy't miljoenen minsken beynfloedzje as se yn it iepenbiere libben yntrodusearre wurde. Artikel Kristina Bravo Privacy en befeiliging Bern groeie op yn in bot online wrâld. Wat kin in besoarge âlder dwaan? State of Mozilla Mozilla fynt harsels opnij út en diversifiearret rûn in konstellaasje fan organisaasjes, fynt reklame opnij út en kreëarret in iepenboarne AI-ekosysteem. Lês mear yn it State of Mozilla 2024-rapport. 2024 It rapport lêze Problemen mei de takomst fan it ynternet ferkenne *Privacy net ynbegrepen Trochsykje ús beoardielingen om te sjen hokker technyske gadgets en apps stikem jo gegevens brûke. No sykje IRL-podcast Us meardere kearen priiswinnende podcast yntrodusearret de makkers fan feroaring dy't wurkje om it ynternet feiliger en AI betrouberder te meitsjen. No harkje"
