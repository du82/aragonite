title = "متصفّح فَيَرفُكس iOS (آيفون وiPad) - Mozilla"
description = "شاهد تبويباتك المفتوحة وعمليات البحث السابقة والمواقع المفضّلة، جميعها في مكان واحد مع متصفّح فَيَرفُكس لنظام تشغيل iOS."
full_description = "متصفّح فَيَرفُكس اذهب إلى المواقع التي تزورُها بشكل أسرع على آيفون و iPad شاهد تبويباتك المفتوحة وعمليات البحث السابقة والمواقع المفضّلة، جميعها في مكان واحد مع متصفّح فَيَرفُكس لنظام تشغيل iOS. نزِّل فيَرفُكس لنظام التشغيل iOS امسح رمز الاستجابة السريعة (QR) ضوئيًا للبدء اجعل مُتصفح فيَرفُكس متصفحك الافتراضي يُمكن الآن لمُستخدمي أجهزة آيفون وiPad اختيار مُتصفحهم الافتراضي بأنفسهم. وهذا يعني أنك لست مجبرًا على استخدام متصفح Safari، وأنّ متصفح الأجهزة المحمولة الذي تستخدمه بإمكانه أن يظل متزامنًا مع متصفح أجهزة الكمبيوتر المكتبية المفضل لديك. وعلاوة على ذلك، فإنك حين تجعل مُتصفح فيَرفُكس متصفحك الافتراضي، فإنك تدعم شركة تكنولوجية مُستقلة. كما أنّ مُتصفح فيَرفُكس هو المتصفح الرئيسي الوحيد الذي تدعمه مؤسسة غير ربحية. سرعة، خصوصية وأمان حافظ على خصوصية كل ما هو شخصي دون التضحية بِسرعة التصفح الفائقة. ولا تنس أن ميزات التصفّح الذكي تمنحك القدرة على الاستمتاع بخصوصيتك واستخدام كلمات مرورك وإشاراتك المرجعية بأمان أينما كنت، مما يجعل أوقاتك التي تقضيها على الإنترنت أسهل وأكثر خصوصية. استمتع بالخصوصية على الإنترنت يَمنحك مُتصفح فيَرفُكس حماية أكبر للخصوصية أثناء تصفحك للإنترنت. وبشكل افتراضي، فإن ميزة الحماية المعزَّزة من التعقّب تحجِب المتعقِّبات والبرامج النصية، مثل متعقِّبات وسائل التواصل الاجتماعي ومتعقِّبات ملفات تعريف الارتباط عبر المواقع وبرامج التنقيب الإلكتروني عن العمليات المشفرة وبرامج تتبُّع البصمات. إمكانية حذف سِجِل التصفح يُمكنك الاتصال بالإنترنت والبحث في وضع التصفح الخاص بسهولة إذا كنت ترغب في ذلك. وعندما تُغلق وضع التصفح الخاص، يتم حذف سِجِل التصفح وأي ملفات تعريف ارتباط تلقائيًا من جهازك. عزِّز استخدام مُتصفح فيَرفُكس ثبِّت مُتصفح فيَرفُكس على أجهزتك لِتستمتع بتجربة تصفّح آمنة وسهلة. زامن أجهزتك لتتمكّن من استخدام الإشارات المرجعية المُفضلة وبيانات تسجيل الدخول المحفوظة وكلمات المرور وسِجل التصفّح أينما ذهبتَ. بالإضافة إلى إمكانية إرسال علامات التبويب المفتوحة بين هاتفك والكمبيوتر المكتبي الخاص بك لتُكمِل من حيث توقفت. استمتع بتجربة بحث أسرع احصل على اقتراحات للبحث في شريط البحث وادخل بسرعة إلى المواقع التي تزورها كثيرًا. اكتب سؤالك البحثي، واحصل على نتائج مقترحة ونتائج بحثتَ عنها مسبقًا عبر محركات البحث المفضلة لديك. امتلك شاشتك الرئيسية انطلق بشكل أسرع إلى أجزاء الإنترنت التي تهتُم بها. شاهد جميع تبويباتك المفتوحة وآخر عمليات البحث والعلامات والمواقع المُفضّلة، جميعها في مكان واحد. اكتشف المزيد مما تُحب افتح علامة تبويب جديدة في مُتصفح فيَرفُكس لترى المواقع الإلكترونية التي تزورها كثيرًا والإشارات المرجعية الحديثة والمقالات الشعبية في Pocket. حيث يُتيح لك مُتصفح فيَرفُكس إمكانية الوصول السريع إلى أحدث المواقع المستخدمة لمساعدتك في الوصول إلى ما تريده بشكل أسرع. نبذة عن موزيلا تحرص مؤسسة موزيلا على أن يكون الإنترنت موردًا عامًا ينهل منه الجميع، لأنها تُؤمن بأن الانفتاح والحرية أفضل من الانغلاق والتحكّم. كما أنها تُصمم منتجات مثل فيَرفُكس وPocket لتعزيز الاختيار والشفافية والتحكّم."
