["https://mozilla.org/be/about/manifesto"]
title = "Маніфест Mozilla"
description = "Гэта прынцыпы, якімі мы кіруемся для распаўсюджвання адкрытасці, укаранення інавацый і павелічэння магчымасцяў у інтэрнэце."
full_description = "Дадатак да маніфесту Mozilla Мы - за здаровы Інтэрнэт Адкрыты, глабальны інтэрнэт - наймагутнейшы з вядомых нам рэсурсаў камунікацыі і супольнай працы. Ён увасабляе нашы найглыбейшыя надзеі на прагрэс чалавецтва. Ён дае новыя магчымасці, каб вывучаць і будаваць пачуццё агульнай чалавечнасці, вырашаць надзённыя праблемы людзей ва ўсім свеце. Цягам апошняга дзесяцігоддзя наша надзея споўнілася ў многіх адносінах. Таксама мы бачылі, як моц інтэрнэту выкарыстоўвалі для павелічэння разладу, распальвання жорсткасці, пашырэння нянавісці і наўмыснага маніпулявання фактамі і рэчаіснасцю. Мы навучыліся, што мусім яўна акрэсліваць свае погляды на чалавечы досвед у інтэрнэце. Вось яны. Мы выступаем за інтэрнэт, які ўключае ўсіх людзей на Зямлі — у якім дэмаграфічныя характарыстыкі асобы не ўплываюць на доступ да сеціва, магчымасці, і якасць досведу. Мы выступаем за інтэрнэт, які прасоўвае павагу ў зносінах, людскую годнасць і індывідуальнасць выяўлення. Мы выступаем за інтэрнэт, які падтрымлівае крытычнае мысленне, аргументаваныя дыскусіі, супольныя веды і правераныя факты. Мы выступаем за інтэрнэт, які спрыяе супрацоўніцтву паміж рознымі супольнасцямі, якія разам робяць агульную справу. Выкажыце сваю падтрымку Інтэрнэт з такімі якасцямі не з'явіцца сам па сабе. Людзі і арганізацыі мусяць убудаваць гэтыя погляды ў інтэрнэт-тэхналогіі і ў чалавечы досвед карыстання інтэрнэтам. Маніфест Mozilla і дадатак да яго прадстаўляюць абавязацельства Mozilla прасоўваць гэтыя погляды. Мы нацэлены працаваць паўсюдна разам з людзьмі і арганізацыямі, якія падзяляюць нашы мэты, каб зрабіць інтэрнэт яшчэ лепшым месцам для кожнага. Share on Bluesky Нашы 10 Прынцыпаў Прынцып 1 Інтэрнэт — гэта неад'емная частка сучаснага жыцця, ключавы кампанент у адукацыі, зносінах, супрацоўніцтве, бізнесе, забавах і грамадстве ў цэлым. Прынцып 2 Інтэрнэт з'яўляецца глабальным грамадскім рэсурсам, які павінен заставацца адкрытым і даступным. Прынцып 3 Інтэрнэт павінен узбагачаць жыццё кожнага чалавека. Прынцып 4 Бяспека і прыватнасць людзей у інтэрнэце маюць асноватворнае значэнне і не могуць разглядацца як другарадныя моманты. Прынцып 5 Людзі павінны мець магчымасць фарміраваць інтэрнэт і сваё знаходжанне ў ім. Прынцып 6 Эфектыўнасць інтэрнэту як публічнага рэсурсу залежыць ад сумяшчальнасці (пратаколаў, фарматаў дадзеных, зместу), наватарства і дэцэнтралізацыі работы па развіццю інтэрнэту ва ўсім свеце. Прынцып 7 Свабоднае праграмнае забеспячэнне і адкрыты праграмны код спрыяюць развіццю інтэрнэту ў якасці грамадскага рэсурсу. Прынцып 8 Празрыстасць дзейнасці супольнасцяў спрыяе сумеснай працы, павышае адказнасць і давер. Прынцып 9 Камерцыйны ўдзел у развіцці інтэрнэту дае вялікую выгаду; пры гэтым важна выканаць баланс паміж камерцыйным прыбыткам і грамадскай карысцю. Прынцып 10 Павелічэнне грамадскіх аспектаў карысці інтэрнэту з'яўляецца важнай задачай, вартай выдаткаў часу і ўвагі. Share on Bluesky Чытаць увесь маніфест"
year_published = 2025
clearnet = "https://mozilla.org/be/about/manifesto"
