title = "Mozilla — Internet pro lidi, ne pro peníze"
description = "Snažíme se dát kontrolu nad internetem zpět do rukou lidí, kteří ho používají."
full_description = 'Pozastavit animaci Přehrát animaci Vítá vás Mozilla Od důvěryhodných technologií až po zásady, které hájí vaše digitální práva, jste u nás vždy na prvním místě. Více informací o nás Stylizovaná zelená vlajka na černém pozadí vytvořená z písmene "M" pro Mozilla a pixelu, který je posunutý a odkazuje na původní logo dinosaura. Stylizovaná zelená vlajka na černém pozadí vytvořená z písmene "M" pro Mozilla a pixelu, který je posunutý a odkazuje na původní logo dinosaura. Znovu si zamilujte internet Osvoboďte se od velkých technologií — naše produkty vám umožní mít pod kontrolou bezpečnější a soukromější internet. Firefox: Získejte zlatý standard pro rychlost, soukromí a kontrolu. Thunderbird: Zjednodušte si život pomocí jedné aplikace pro všechny e-maily, kalendáře a kontakty. Fakespot: Poznejte falešné recenze, špatné produkty a nedůvěryhodné prodejce. Pocket: Uložte si nejlepší obsah z internetu na jakékoliv zařízení — protože kdo má teď čas si to všechno číst? Mozilla VPN: Udržujte svou polohu a online zážitky v tajnosti — streamujte kdekoliv jako místní. Mozilla Monitor: Nechte se informovat, pokud jsou vaše osobní údaje v ohrožení, a uzamkněte je jako profesionál. Firefox Relay: Zamaskujte svůj e-mail a telefonní číslo, abyste dostávali jen ty zprávy, které chcete. Prozkoumejte naše produkty Přispějete na neziskovou organizaci Mozilla Mozilla vytváří hnutí za znovuzískání internetu. Společně můžeme vybudovat budoucnost, ve které bude naše soukromí chráněno, umělá inteligence bude důvěryhodná a nezodpovědné technologické společnosti budou pohnány k odpovědnosti. Ale to je možné jen tehdy, když to uděláme společně. Jsme hrdí na to, že jsme neziskoví. Přispějete dnes Mozille? Přispějte Připojte se k hnutí AI pro lidi Naším posláním je usnadnit lidem tvorbu a spolupráci na důvěryhodné umělé inteligenci s otevřeným zdrojovým kódem. Common Voice Produkt Darujte svůj hlas pro lepší přístupnost hlasových technologií pro každého. Darujte svůj hlas Může být AI důvěryhodná? Událost Ve světě, kde inovace v oblasti umělé inteligence řídí několik vyvolených, riskujeme monopolizaci této technologie. Použití konceptů open-source v oblasti AI by to mohlo změnit. Sledujte nyní Lumigator Produkt Najděte to správné LLM pro vaše potřeby, případ užití a data. Začít Mozilla Ventures Program Máte projekt v rané fázi? Prezentujte svou společnost pro Mozilla Ventures a zajistěte si financování pro pozitivní změnu budoucnosti umělé inteligence a internetu. Přečtěte si více Llamafile Projekt Snadné spouštění velkých jazykových modelů (LLM) na počítači pomocí Llamafile — není nutná žádná instalace a vaše data zůstanou v bezpečí vašeho zařízení. Začít Mozilla Builders Program Mozilla Builders pomáhá nezávislým vývojářům vytvářet transformativní open-source projekty umělé inteligence prostřednictvím spolupráce na míru, programování a komunity. Přečtěte si více Vy, umělá inteligence a internet – co se ve skutečnosti děje? Typ Autor Téma Úvod Článek Laura Chambers Soukromí a zabezpečení Představujeme Anonym: zvedá laťku pro digitální reklamy chránící soukromí. Článek Saoud Khalifah Umělá inteligence Udržování technologií GenAI v bezpečí je společnou odpovědností. Podcast IRL podcast Umělá inteligence Umělci vyjednávají o souhlasu umělé inteligence, od Hollywoodu po hip hop. Video Rebecca Smith Novinky Mozilla oslavuje průkopnické tvůrce v nové sérii dokumentů “Firefox Presents”. Podcast IRL podcast Umělá inteligence Moc velkých technologií nad jazykem znamená moc nad lidmi. Bridget Toddová hovoří s vůdci jazykových komunit, kteří připravují půdu pro hlasovou umělou inteligenci ve svých jazycích a dialektech. Podcast IRL podcast Umělá inteligence Proč máme často pocit, že jsme součástí masového experimentu s umělou inteligencí? Jaký je zodpovědný způsob testování nových technologií? Bridget Toddová zkoumá, co to znamená žít s nevyzkoušenými systémy umělé inteligence, které mají dopad na miliony lidí, když se zavádějí ve veřejném životě. Článek Kristina Bravo Soukromí a zabezpečení Děti vyrůstají ve velmi online světě. Co má dělat znepokojený rodič? Stav Mozilly Mozilla znovuobjevuje sama sebe, diverzifikuje svou činnost kolem sdružení organizací, přetváří reklamu a vytváří otevřený ekosystém umělé inteligence. Přečtěte si o tom ve Zprávě o stavu Mozilly pro rok 2024. 2024 Přečtěte si report Prozkoumejte otázky, které ovlivňují budoucnost internetu *Soukromí není zahrnuto Prohledejte naše recenze a zjistěte, které technologické vychytávky a aplikace skrytě odcizují vaše data. Hledat IRL podcast Náš několikrát oceněný podcast představuje tvůrce změn, kteří se snaží o bezpečnější internet a důvěryhodnější umělou inteligenci. Poslouchat nyní'
