["https://mozilla.org/ar/firefox/browsers/mobile/focus"]
title = "فَيَرفُكس فوكَس: مُتصفح الخصوصية"
description = "يُعتبر فَيَرفُكس فوكَس مُتصفّحك المُكرّس للخصوصية والمُزوّد بحماية تتبّع أوتوماتيكية."
full_description = 'فَيَرفُكس فوكَس متصفِّح يتميز بالخصوصية للأجهزة المحمولة يُعتبر فَيَرفُكس فوكَس مُتصفّحك المُكرّس للخصوصية والمُزوّد بحماية تتبّع أوتوماتيكية. فمن خلال استخدام فوكس، يتم تحميل صفحاتك بشكل أسرع وحماية بياناتك بشكل دائم. مُتصفح فَيَرفُكس فوكَس مُتوفر للأجهزة التي تعمل بنظام التشغيل iOS أو Android. نزِّل متصفح فَيَرفُكس فوكَس امسح رمز الاستجابة السريعة (QR) ضوئيًا للبدء حذف سِجلّ التصفّح احذف سِجِل التصفُّح وكلمات المرور وملفات تعريف الارتباط بسهولة، حتى لا تتبَّعك الإعلانات غير المرغوب فيها عبر الإنترنت. ما عليك سوى الضغط على زر حذف الموجود في حقل البحث وسيختفي سِجِل التصفح. الارتقاء بوضع التصفح الخاص إلى مستوى أفضل إنّ وضع "التصفّح الخاص" في مُعظم المتصفحات لا يمنحُك الخصوصية الكاملة حقًا. يرتقي مُتصفّح فَيَرفُكس فوكَس بخصوصيتك إلى مستوى أفضل بشكل تلقائي كما أنه مدعوم من مؤسسة موزيلا التي لا تستهدف الربح وتُدافع عن حقوقك على الإنترنت. الحماية من التعقب يَحجب متصفح فَيَرفُكس فوكَس مجموعة كبيرة من المتعقِّبات المشهورة بشكل افتراضي، لا سيما متعقِّبات مواقع التواصل الاجتماعي وغيرها من المتعقِّبات التي تأتي من إعلانات مثلفيسبوك. تحميل أسرع للصفحات يَعمل متصفح فوكس على إزالة المُتعقِّبات، ولذلكَ تتطلب الصفحات التي تُشاهدها بيانات أقل ويتم تحميلُها بشكل أسرع. كما يُمكنك أيضًا تثبيت ما يَصل إلى أربعة اختصارات على صفحتك الرئيسية والوصول إلى موقعك المُفضّل بشكل أسرع بدون أن تكتب أي شيء. طوَّرَته شركة موزيلا إننا نؤمن بحق أي شخص في التحكّم في أوقاته التي يقضيها على الإنترنت. وهذا ما ندافع من أجله منذ عام 1998.'
