title = "Internet para personas, sin fines de lucro"
description = "¿Sabías que Mozilla —el creador de Firefox— lucha para que el Internet se mantenga como un recurso público a nivel mundial, abierto y accesible para todos?"
full_description = '"La salud de Internet y la vida en línea es la razón por la que existimos". Mitchell Baker, presidente ejecutivo de la junta directiva, Mozilla Foundation Mozilla fabrica productos que respetan la privacidad Navegación privada y segura Obtener Firefox Los artículos más intrigantes de la web. Obtener Pocket Detectar reseñas de compras falsas Obtén Fakespot Hide your phone number and email from spammers Obtener Relay Una VPN en la que puedes confiar Obtén Mozilla VPN Protect your private info from data brokers Obtén Monitor “Mozilla está haciendo apuestas para mostrarle al mundo que se puede hacer negocio con una IA confiable. Eso incluye poner aspectos como los derechos humanos, la protección de datos y la transparencia en el centro del funcionamiento de estos sistemas complejos”. politico Entonces, ¿qué es Mozilla? At its core, Mozilla is an activist organization led by the Mozilla Foundation that makes change in the world through a variety of ventures including Mozilla Corporation, MZLA, Mozilla Ventures and Mozilla.ai. How are we different? Because we’re mission-driven, it means we have the freedom to make all of our decisions based on what’s best for the internet and for everyone online, not based on the demands of shareholders — we don’t actually have any of those. Más información sobre la Mozilla Foundation Construyamos nuestro movimiento Dona a Mozilla Foundation hoy para garantizar que Internet permanezca abierto y accesible para todos. Donar Únase a la lucha por una Internet saludable Tu voz. Tu codigo. Tus ideas. Hay literalmente miles de formas en las que puedes contribuir a Mozilla. Sea voluntario con Mozilla Esa vez regalamos nuestro código fuente... El proyecto Mozilla se fundó en San Francisco en 1998, cuando el navegador Netscape tomó la decisión radical de regalar el código de su programa al público para que lo desarrollara y lo mejorara. En ese momento, una empresa tenía prácticamente el monopolio de cómo las personas experimentaban Internet. Con el tiempo, el proyecto de código abierto Mozilla se transformó en la muy popular primera versión de Firefox. Hoy, Mozilla continúa su movimiento hacia una mejor Internet con millones de miembros activos de la comunidad en todo el mundo, que abogan por tecnología ética, inteligencia artificial confiable y producen productos que dan prioridad a la privacidad y que brindan más poder a las personas. Más información sobre Mozilla Únete a la comunidad Regístrate para recibir actualizaciones mensuales de Firefox y las tendencias de Internet que dan forma a tu vida en línea. Firefox Recibe noticias sobre Firefox Por favor, ingresa una dirección de correo electrónico válida Por favor selecciona un país o región Por favor, selecciona un idioma Por favor, marca al menos una de las opciones del boletín. Debes aceptar el aviso de privacidad Discúlpanos, pero hubo un problema con nuestro sistema. Por favor, inténtalo de nuevo más tarde. Tu dirección de correo electrónico: Seleccionar país o región: Acrotiri Afganistán Albania Alemania Andorra Angola Anquilla Antigua y Barbuda Antártida Arabia Saudí Argelia Argentina Armenia Arrecife Kingman Aruba Atolón Johnston Atolón Palmira Australia Austria Azerbayán Bahamas, Las Bahrein Bangladesh Barbados Bassas da India Belarús Belice Benin Bermudas Bhután Bolivia Bosnia-Herzegovina Botswana Brasil Brunei Bulgaria Burkina Faso Burma Burundi Bélgica Cabo verde Camboya Camerún Canadá Chad Chile China Chipre Cisjordania Ciudad del Vaticano Colombia Comoras Congo (Kinshasa) Corea del Norte Corea del Sur Costa Rica Costa de Marfil Croacia Cuba Curazao Dhekelia Diego García Dinamarca Djibouti Dominica Ecuador Egipto El Salvador Emiratos Árabes Unidos Eritrea Eslovaquia Eslovenia España Estados Federados de la Micronesia Estados Unidos Estonia Etiopía Fiji Filipinas Finlandia Francia Franja de Gaza Gabón Gambia Georgia Ghana Gibraltar Granada Grecia Groenlandia Guadalupe Guam Guatemala Guayana Francesa Guernsey Guinea Guinea Ecu