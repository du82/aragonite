title = "Mozilla — Internet para la gente, no para las ganancias"
description = "Doná tu voz para hacer que la tecnología de voz sea más inclusiva y accesible para todos."
full_description = "Pausar animación Reproducir animación Bienvenido a Mozilla Desde tecnología confiable hasta políticas que defienden tus derechos digitales, te ponemos primero — siempre. Conocenos Una bandera verde estilizada sobre fondo negro, hecha de la ‘M’ de Mozilla y un píxel que está desplazado para hacer referencia al logo original del dinosaurio. Una bandera verde estilizada sobre fondo negro, hecha de la ‘M’ de Mozilla y un píxel que está desplazado para hacer referencia al logo original del dinosaurio. Amá internet de nuevo Liberate de la gran tecnología: nuestros productos te permiten tener una experiencia de Internet segura y más privada. Firefox: Obtené el estándar dorado para navegar con velocidad, privacidad y control. Thunderbird: Simplificá tu vida con una aplicación para todos tus correos electrónicos, calendarios y contactos. Fakespot: Detectá revisiones falsas, productos malos y vendedores poco confiables. Pocket: Guardá el mejor contenido de Internet en cualquier dispositivo, porque ¿quién tiene tiempo para leer todo ahora? Mozilla VPN: Mantené la privacidad de tu ubicación y tus aventuras en línea — hacé tu streaming como si estuvieras en tu casa, desde cualquier lugar. Mozilla Monitor: Recibí un aviso si tu información personal está en riesgo y mantenela bloqueada como un profesional. Firefox Relay: Enmascará tu correo electrónico y número de teléfono para que solo te lleguen los mensajes que quieras. Explorá nuestros productos Doná a la organización sin fines de lucro Mozilla Mozilla está construyendo un movimiento para recuperar Internet. Juntos podemos construir un futuro donde nuestra privacidad esté protegida, la IA sea confiable y las empresas de tecnología irresponsables tengan que rendir cuentas. Pero eso solo es posible si lo hacemos juntos. Estamos orgullosos de ser una organización sin fines de lucro. ¿Donarías a Mozilla hoy? Donar Unite al movimiento: IA para la gente Nuestra misión es facilitar a las personas la creación y la colaboración de una IA confiable y de código abierto. Common Voice Producto Doná tu voz para hacer que la tecnología de voz sea más inclusiva y accesible para todos. Doná tu voz ¿Puede la IA ser confiable? Evento En un mundo donde la innovación en IA está impulsada por unos pocos elegidos, nos arriesgamos a la monopolización de esta tecnología. Aplicar conceptos de código abierto a la IA podría cambiar eso. Mirá ahora Lumigator Producto Encontrá el LLM adecuado para tus necesidades, caso de uso y datos. Comenzar Mozilla Ventures Programa ¿Tenés una startup en fase inicial? Enviá a tu empresa a Mozilla Ventures y asegurá la financiación para impulsar un cambio positivo para el futuro de la IA e Internet. Leer más Llamafile Proyecto Ejecutá grandes modelos de idioma (LLM) fácilmente en tu computadora con Llamafile — no se necesita instalación y tus datos se mantienen seguros en tu dispositivo. Comenzar Mozilla Builders Programa Mozilla Builders ayuda a los desarrolladores independientes a crear proyectos transformadores de IA de código abierto a través de colaboraciones, programación y comunidad hechas a medida. Leer más Vos, la IA e Internet — ¿Qué es lo que realmente está pasando? Tipo Autor Tópico Introducción Articulo Laura Chambers Privacidad y seguridad Presentamos Anonym: Elevando la vara de la publicidad digital que preserva la privacidad. Articulo Saoud Khalifah Inteligencia artificial Mantener las tecnologías de GenAI seguras es una responsabilidad compartida. Podcast Podcast IRL Inteligencia artificial Desde Hollywood al hip hop, los artistas están negociando el consentimiento de la IA. Video Rebecca Smith Noticias Mozilla homenajea a los creadores innovadores en la nueva serie de documentales “Firefox Presenta”. Podcast Podcast IRL Inteligencia artificial El poder de las grandes tecnológicas sobre el idioma significa poder sobre las personas. Bridget Todd habla con líderes de la comunidad lingüística allanando el camino para la IA de voz en sus propios idiomas y dialectos. Podcast Podcast IRL Inteligencia artificial ¿Por qué parece tan a menudo que somos parte de un experimento masivo de IA? ¿Cuál es la forma responsable de probar las nuevas tecnologías? Bridget Todd explora lo que significa vivir con sistemas de IA no probados que afectan a millones de personas a medida que se implementan en la vida pública. Articulo Kristina Bravo Privacidad y seguridad Los niños están creciendo en un mundo demasiado en línea. ¿Qué debe hacer un padre preocupado? Estado de Mozilla Mozilla se está reinventando a sí misma, diversificándose en torno a una constelación de organizaciones, reimaginando la publicidad y creando un ecosistema de IA de código abierto. Leé al respecto en el Informe sobre el estado de Mozilla de 2024. 2024 Leer el informe Explorar los problemas que moldean el futuro de Internet *Privacidad no incluida Busca en nuestras reseñas para ver qué dispositivos y aplicaciones tecnológicas se están metiendo sigilosamente en tus datos. Buscar ahora Podcast IRL Nuestro podcast multipremiado presenta a los creadores del cambio que trabajan para hacer que Internet sea más segura y la IA más confiable. Escuchar ahora"
