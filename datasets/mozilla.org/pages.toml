full_description = "firefox-ios-firefox-browser اختصر الإنترنت مع فيَرفُكس لنظام تشغيل Android شاهد جميع تبويباتك المفتوحة وآخر عمليات البحث والمواقع المُفضّلة، جميعُها في مكان واحد مع مُتصفح فيَرفُكس لنظام تشغيل Android. نزِّل فيَرفُكس لنظام التشغيل Android امسح رمز الاستجابة السريعة (QR) ضوئيًا للبدء يَتميّز بالسرعة والخصوصية يُوفر متصفح فيَرفُكس المُخصص لنظام التشغيل Android حماية سهلة للخصوصية ويُحمِّل الصفحات بسرعة البرق. وتعمل ميزة الحماية المُعزَّزة من التعقب تلقائيًا على حجب المُتعقِّبات من تتبُّعك عبر الإنترنت وإبطاء تَصفُّحك. بِضغطة واحدة استمتع بوضع التصفح الخاص انتقل إلى وضع التصفّح الخاص بضغطة واحدة وعندما تُغلق وضع التصفح الخاص، يتم حذف سِجِل التصفح تلقائيًا من جهازك. ابحث بالطريقة التي تُعجِبك أتمتلِك هاتفًا كبيرًا وإبهامًا بحجم طبيعي؟ حسنًا. يُتيح لك مُتصفح فيَرفُكس المخصص لنظام التشغيل Android إمكانية تحريك شريط البحث من أعلى إلى أسفل ليَسهُل استخدامه بيد واحدة. ويمكنك أيضًا اختيار محرك البحث المفضل لديك داخل المتصفح، وتعيين فيَرفُكس كمتصفح افتراضي لك إذا كنت تريد ذلك. وفِّر الطاقة مع الوضع الداكن تحوَّلْ إلى الوضع الداكن في أي وقت لتقليل إجهاد العين وتوفير طاقة البطارية. امتلك شاشتك الرئيسية انطلق بشكل أسرع إلى أجزاء الإنترنت التي تهتُم بها. شاهد جميع تبويباتك المفتوحة وآخر عمليات البحث والعلامات والمواقع المُفضّلة، جميعها في مكان واحد. عزِّز مُتصفح فيَرفُكس بوظائف إضافية تُعتبر الوظائف الإضافية بمثابة أدوات صغيرة قوية يُمكنك إضافتها إلى مُتصفحك لأغراض ومهام معينة مثل زيادة إعدادات الخصوصية الافتراضية وتخصيص تجربتك. أكمِل من حيث توقّفت انتقل من الهاتف إلى الكمبيوتر المحمول، ثم إلى الجهاز اللوحي، ثم عُد من حيث بدأت دون أن تفوتك أي لحظة مهمة. فبفضل تثبيت مُتصفح فيَرفُكس على جميع أجهزتك، يُمكنك استخدام الإشارات المرجعية وكلمات المرور وتسجيلات الدخول المحفوظة وسِجل التصفح في أي مكان. ابحث من الشاشة الرئيسية لهاتفك لا حاجة لفتح التطبيق. فما عليك سوى إضافة أداة بحث مُتصفح فيَرفُكس والبحث في الإنترنت مباشرةً من خلال الشاشة الرئيسية لجهازك. ثبِّت الفيديوهات على شاشتك افصل الفيديوهات عن مواقعها الإلكترونية أو برامج تشغيلها وثبِّتها على شاشة هاتفك لِتتمكن من مُشاهدتها أثناء تصفح الإنترنت والقيام بمهام أخرى. استمتع بوقتك دائمًا أثناء قيامك بمهام متعددة. نبذة عن موزيلا تحرص مؤسسة موزيلا على أن يكون الإنترنت موردًا عامًا ينهل منه الجميع، لأنها تُؤمن بأن الانفتاح والحرية أفضل من الانغلاق والتحكّم. كما أنها تُصمم منتجات مثل فيَرفُكس وPocket لتعزيز الاختيار والشفافية والتحكّم."
