title = "Магчымасці для валанцёраў у Mozilla — Mozilla"
description = "Атрымайце некамерцыйны браўзер на Windows, Mac або Linux."
full_description = "Вашы таленты неабходныя для лепшага Інтэрнэту Mozilla — гэта некамерцыйная арганізацыя, якая працуе над тым, каб інтэрнэт быў адкрыты і гасцінны для ўсіх. І нам патрэбна ваша дапамога. Далучаючыся да нашай супольнасці, вы можаце дапамагчы ў развіцці інавацый, павысіць адказнасць і давер, і зрабіць Інтэрнэт лепшым месцам для ўсіх. Як вы можаце зрабіць унёсак… Нетэхнічны Індывідуальна і арганізоўваючы мерапрыемствы Перакладайце змесціва Інтэрнэт глабальны толькі тады, калі яго разумеюць паўсюль. Дапамажыце нам перакласці прадукты і вэб-сайты Mozilla на сваю мову. Тэхнічны Асабіста Укладайце кодавую базу Mozilla Актыўна ўдасканальвайце прадукты Mozilla, робячы свой уклад у розныя магчымасці для распрацоўкі. Падтрымка Індывідуальна і арганізоўваючы мерапрыемствы Індывідуальна і арганізоўваючы мерапрыемствы Дапамажыце зрабіць прадукты Mozilla простымі ў выкарыстанні. Адказвайце на пытанні на форумах супольнай падтрымкі Mozilla. Тэхнічны і нетэхнічны Далучайцеся да супольнасці Хочаце больш актыўна ўдзельнічаць у згуртаванні Mozilla? Азнаёмцеся з усімі магчымасцямі для валанцёраў на нашым партале супольнасці. Наша місія Наша місія — забяспечыць, каб Інтэрнэт быў глабальным грамадскім рэсурсам, адкрытым і даступным для ўсіх і кожнага. Інтэрнэтам, які сапраўды ставіць людзей на першае месца, дзе людзі могуць фарміраваць свой уласны вопыт і быць моцнымі, незалежнымі і абароненымі. Даведайцеся пра Mozilla Прачытаць наш маніфест Знайдзіце падзею Пазнаёміцца з нашымі захопленымі валанцёрамі Ахвяруйце Дапамагчы фінансаваць нашу місію Сачыце за Mozilla Навіны і магчымасці для валанцёраў Зроблена такімі ж захопленымі людзьмі, як вы Калі вы ўносіце ўклад у Mozilla, вы становіцеся часткай сусветнай супольнасці, якая складаецца з людзей з усяго свету, якія вераць, што ўсе мы адыгрываем сваю ролю ў забеспячэнні таго, каб Інтэрнэт заставаўся сілай дабра. Мы лічым, што супрацоўніцтва з супольнасцю жыццёва важнае для развіцця інтэрнэту — разнастайнага, інавацыйнага і падсправаздачнага людзям, якім ён найбольш патрэбны. Незалежна ад таго, ці маеце вы вопыт у галіне інфармацыйных тэхналогій, арганізацыі супольнасці, ці толькі камп'ютар і трохі вольнага часу, вы можаце дапамагчы нам зрабіць Інтэрнэт лепшым. about-mozilla Яшчэ не ўпэўнены? Атрымлівайце навіны пра супольнасць і ўнёсак на сваю паштовую скрыню Падпішыцеся на нашу рассылку, далучайцеся да Mozillians па ўсім свеце, і даведвайцеся пра карысныя магчымасці для падтрымкі місіі Mozilla. Калі ласка, увядзіце сапраўдны адрас электроннай пошты Калі ласка, выберыце краіну або рэгіён Калі ласка, абярыце мову Калі ласка, пазначце хаця б адзін з варыянтаў рассылкі. Вы павінны пагадзіцца з паведамленнем аб прыватнасці Нам шкада, але ў нашай сістэме ўзнікла праблема. Калі ласка, паспрабуйце пазней! Ваш электронны адрас: Выберыце краіну або рэгіён: Выберыце краіну або рэгіён Mayotte Іарданія Ізраіль Інданезія Індыя Ірак Іран Ірландыя Ісландыя Іспанія Італія А.А.Э. Азербайджан Акраціры Албанія Алжыр Аман Амерыканскія Самоа Ангола Андора Анквіла Антарктыка Антыгуа і Барбуда Аргенціна Арменія Аруба Атол Джонстан Атол Пальміра Аўганістан Аўстралія Аўстрыя Багамы Балівія Бангладэш Барбадос Басас-да-Індыя Бахрэйн Баўгарыя Беларусь Бельгія Беліз Бенін Бермуды Боснія і Герцэгавіна Ботсвана Бразілія Брунэй Дарусалам Брытанская Індыйская Акіянская тэрыторыя Брытанскія Віргінскія выспы Буркіна Фасо Бурундзі Бутан В'етнам Валіс і Футуна Вануату Венесуэла Вугоршчына Выспа Боўвет Выспа Бэйкер Выспа Глар'ез Выспа Гіард і Выспы Мак-Дональда Выспа Джэрвіс Выспа Еўропа Выспа Жуан-ды-Нова Выспа Кліпертон Выспа Мэн Выспа Наваса Выспа Нарфолк Выспа Тромлен Выспа Уэйк Выспа Хоўленд Выспры Мідуэй Выспы Ашмор і Карцье Выспы Каралавага мора Выспы Кука Выспы Радздва Выспы Спратлі Выспы Туркс і Кайсос Выспы Фароэ Віргінскія выспы З.Ш. Габон Гайана Гамбія Гана Гандурас Гаіці Гвадэлупа Гватэмала Гвінея Гвінея-Бісау Гон Конг Горад Ватыкан Грузія Грэнада Грэнландыя Гуам Гуэрнсі Гібралтар Дамініка Дамініканская Рэспуб