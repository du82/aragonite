["https://mozilla.org/ar/about/governance/policies/participation"]
title = "التعليمات التوجيهية للمشاركة المجتمعية — Mozilla"
full_description = 'التعليمات التوجيهية للمشاركة في مجتمع موزيلا الإصدار 3.1 – تم التحديث في 16 يناير 2020 قلب موزيلا ينبض بالمُستخدمين. نضع المُستخدمين في المقام الأول ونبذل قصارى جُهدنا للتعرّف على تنوع مُساهمينا على مستوى العالم ونُقدر ونحترم هذا التنوع يُرحب مشروع موزيلا بمُساهمات كل من يُشاركنا أهدافنا ويريد المساهمة بطريقة صحية وبناءة داخل مُجتمعنا. وعلى هذا النحو، اعتمدنا مدونة قواعد السلوك هذه ونطلب من جميع المشاركين الموافقة والالتزام بالتعليمات التوجيهية المتعلقة بالمشاركة في المجتمع من أجل مساعدتنا في خلق تجربة مجتمعية آمنة وإيجابية للجميع. تهدف هذه المبادئ التوجيهية لدعم مُنتدى يشعُر فيه جميع الأشخاص بالأمان للمُشاركة وتقديم أفكار جديدة وإلهام الآخرين، بغض النظر عن الآتي: الخلفية الوضع العائلي النوع الهوية الجنسية أو التعبير الجنسي الحالة الاجتماعية الجنس التوجه الجنسي اللغة الأم العمر المقدرة العرق و/أو الأصل العرقي الطبقة الاجتماعية الأصل القومي الحالة الاجتماعية والاقتصادية الديانة الموقع الجغرافي أيُّ بُعد آخر للتنوع الانفتاح والتعاون والمشاركة هي الجوانب الأساسية لعملنا — بداية من التطور في فيَرفُكس إلى التعاون في تصميم المنهج. نَكتسب القوة من التنوع ونسعى بِجد لمُشاركة من يُعزِّزونه. تَمّت صياغة هذه الإرشادات لتمكين الأفراد والجماعات المُتنوعة من التفاعل والتعاون لتحقيق المنفعة المُتبادلة. تُوضح هذه الوثيقة كلاً من السلوك المُتوقع والمحظور. موعد وطريقة استخدام هذه الإرشادات تُحدد هذه الإرشادات توقعات سُلوكنا كأعضاء في مجتمع موزيلا في كل أنشطة موزيلا سواءً مع الاتصال بالإنترنت أو بدونه. مُشاركتك مشروطة باتباع هذه الإرشادات في كل أنشطة موزيلا بما في ذلك على سبيل المثال لا الحصر: العمل في مساحات موزيلا. العمل مع الموزليين والمُشاركين الآخرين في مجتمع موزيلا سواءً افتراضيًا أو في الموقع المشترك. تمثيل مؤسسة موزيلا في الأحداث العامة تمثيل موزيلا في وسائط التواصل الاجتماعي (صفحات الحسابات الرسمية، وحسابات المُوظفين، والحسابات الشخصية على فيسبوك). المشاركة في خارج مواقع موزيلا والتدريبات. المشاركة في موزيلا-المُنتديات ذات الصلة، والقوائم البريدية، ومواقع wiki، ومواقع الويب، وقنوات الدردشة، والأخطاء، والاجتماعات الجماعية أو الشخصية، ومراسلات موزيلا-ذات الصلة. تَعمل هذه المبادئ التوجيهية جنبًا إلى جنب مع سياسات مُكافحة التحرش / التمييز[1]، التي تُوضح أشكال حماية والتزامات موظفي موزيلا. تم تصميم سياسة مُكافحة التحرّش / التمييز مع وضع تعريفات ومُتطلبات قانونية مُحددة في الاعتبار. في حين أن هذه المبادئ التوجيهية / مُدونة السلوك تستهدف على وجه التحديد عمل ومُنتدى موزيلا، نُدرك أنه من المُمكن اتخاذ إجراءات خارج المساحات الشخصية ومساحات موزيلا عبر الإنترنت ليكون لها تأثير عميق على صحة المجتمع. (على سبيل المثال، في الماضي، حدّدنا علنًا منشوراً مجهولاً يستهدف أحد موظفي موزيلا في منتدى غير تابع لـ موزيلا موزيلا.) هذا موضوع حيوي في مجال التنوع والشمول. ونتوقع مُناقشات واسعة النطاق بين مُجتمعاتنا حول الحدود المناسبة. السلوك المُتوقع السلوكيات التالية مُتوقعة من جميع الموزيليين: التحلي بالاحترام تقدير أفكار وأساليب ووجهات نظر بعضكم البعض. قد لا نتفق دائمًا، غير أن الخِلاف ليس مُبررًا لسوء الأخلاق. كُن منفتحًا على الاحتمالات المُختلفة وتقبّل ارتكاب الأخطاء. تحلّى بالاحترام في جميع التفاعلات والمُراسلات، خاصة عند مناقشة مزايا الخيارات المختلفة. كُن على دراية بتأثيرك وكيف يُمكن أن تُؤثر التفاعلات المُكثفة على الناس. كن مباشرًا وبناءً وإيجابيًا. تحمّل مسؤولية تأثيرك وأخطائك – إذا قال شخص ما إنه تعرض للأذى بسبب أقوالك أو أفعالك، فاستمع جيدًا واعتذر بِصدق وصحّح السلوك من الآن فصاعدًا. التحلّي بالصراحة والاحترافية ويُحتمل أن نخوض بعض النقاشات عن ما إذا كان النقض مُحترمًا ومتى لا يكون كذلك. يجب أن نكون قادرين على التحدث مُباشرة عندما نختلف وعندما نعتقد أننا بحاجة إلى التحسين. لا يُمكننا حجب حقائق صعبة واضحة. يصعُب فعل ذلك باحترام، والقيام بذلك عندما لا يبدو أن الآخرين يستمعون يكون أصعب، وسماع مثل هذه التعليقات عندما يكون المرء متلقيًا يُمكن أن يكون أكثر صعوبة. نحن بحاجة إلى أن نكون صادقين ومباشرين، وكذلك مُحترمين. التحلّي بالشمولية ابحث عن وجهات نظر متنوعة. يُعتبر تنوع الآراء والأفراد في الفرق طريقة عملية لتعزيز الابتكار، حتى لو لم يكن ذلك مريحًا دائمًا. شجّع كل الأصوات. ساعِد في سماع وجهات النظر الجديدة والإنصات إليها بجدية. إذا وجدت نفسك تُهيمن على مناقشة، فمن المُهم للغاية التراجع وتشجيع الأصوات الأخرى على الانضمام. انتبه إلى مقدار الوقت الذي يأخذه الأعضاء المُهيمنون في المجموعة. قدم طرقًا بديلة للمساهمة أو المشاركة عندما يكون ذلك ممكنًا. حاول إشراك الجميع في أي تفاعل، مع احترام وتسهيل مشاركة الناس سواء كانوا: عن بُعد (عبر الفيديو أو الهاتف) من غير متحدثي اللغة الأصلية من ثقافة مختلفة "استخدام ضمائر أخرى غير "هو" أو "هي" العيش في منطقة زمنية مختلفة مواجهة تحديات أخرى للمشاركة فكر في كيفية تسهيل طرق بديلة للمساهمة أو المشاركة. إذا وجدت نفسك تُهيمن على أي مناقشة، فتراجع. أفسح المجال لأصوات أخرى وأنصت إليها بفاعلية. فهم مختلف وجهات النظر يجب ألا يكون هدفُنا هو "الغلبة" في كل خلاف أو حجة. ويتمثل الهدف الأكثر إنتاجية في الانفتاح على الأفكار التي تجعل أفكارنا أفضل. احرص على أن تكون مثالاً يُحتذى به في التفكير الشامل. يتحقّق "الفوز" عندما تجعل وجهات النظر المُختلفة عملنا أثرى وأقوى. تقدير واستيعاب أوجه التشابه والاختلاف بيننا ينحدِر الموزيليون من ثقافات وخلفيات متعددة. يُمكن أن تشمل الاختلافات الثقافية كل شيء بداية من الاحتفالات الدينية الرسمية إلى العادات الشخصية حتى الملابس. تحلى بالاحترام تُجاه الأشخاص الذين لديهم مُمارسات ومواقف ومُعتقدات ثقافية مختلفة. واعمل على القضاء على أوجه التحيّز والأحكام المُسبقة والمُمارسات التمييزية. وفكِّر في احتياجات الآخرين من وجهة نظرهم. واستخدم الألقاب المُفضلة (بما في ذلك الضمائر) ونبرة الصوت المناسبة. واحترم حق الأفراد في الخصوصية والسرية. حيث إنه من غير الواقعي أن تتوقع من أفراد موزيلا معرفة الممارسات الثقافية لكل مجموعة إثنية وثقافية، ولكن على الجميع إدراك أن الثقافة الأصلية لكل فرد لا تشكل إلا جزءًا من التفاعلات الإيجابية. القيادة كمثال يُحتذى به عندما تكون شخصًا يُطابق أفعالك كلماتك، تُصبح شخصًا يود الآخرين اتباعه. حيث تُؤثر أفعالك على الآخرين للتصرّف والاستجابة بطُرق قيمة ومناسبة لنتائجنا التنظيمية. صمم مُجتمعك وعملك بغرض الدمج. واجعل نفسك والآخرين مسؤولين عن السلوكيات المُتضمنة. اتخذ القرارات على أساس أعلى فائدة تخدم مُهمة موزيلا. السلوك الذي لن يتم التغاضي عنه تُعتبر السلوكيات التالية غير مقبولة بموجب هذه المبادئ التوجيهية. العنف والتهديد بالعنف العنف والتهديد بالعنف غير مقبول - عبر الإنترنت أو خارجه. ويشمل ذلك التحريض على العنف ضد أي فرد، بما في ذلك تشجيع الشخص على إيذاء نفسه. ويشمل هذا أيضًا نشر معلومات التعريف الشخصية لأشخاص آخرين ("استقاء معلومات شخصية") عبر الإنترنت أو التهديد بنشرها. الهجمات الشخصية ستحدث الخلافات لا محالة، غير أن الإحباط لا يَجب أن يتحول إلى هجوم شخصي. ليس من المقبول إهانة الآخرين أو تحقيرهم أو التقليل من شأنهم. وتُعد مهاجمة شخص ما بسبب آرائه ومعتقداته وأفكاره أمرًا غير مقبول. ومن المُهم التحدث مباشرة عندما نختلف وعندما نعتقد أننا بحاجة إلى التحسن، ومع ذلك يجب إجراء مثل هذه المناقشات باحترام ومهنية، مع الاستمرار في التركيز على القضية المطروحة. اللغة الإزدرائية اللغة المسيئة أو المؤذية تتعلق بما يلي: الخلفية الوضع العائلي النوع الهوية الجنسية أو التعبير الجنسي الحالة الاجتماعية الجنس التوجه الجنسي اللغة الأم العمر المقدرة العرق و/أو الأصل العرقي الطبقة الاجتماعية الأصل القومي الحالة الاجتماعية والاقتصادية الديانة الموقع الجغرافي الصفات الأخرى غير المقبول. يشمل الإشارة عمدًا إلى شخص بكلمات لا تعرّف هويته الجنسية، و/أو التشكيك في شرعية الهوية الجنسية للفرد. ومن ثم، إذا لم تكن متأكدًا مما إذا كانت الكلمة مُهينة أم لا، فلا تستخدمها. ويدخل في ذلك أيضًا التمييز الطفيف المتكرر و/أو غير المباشر؛ عندما يُطلب منك التوقف، أوقف ذلك السلوك. الاهتمام الجنسي غير المرغوب فيه أو المُلامسة البدنية الاهتمام الجنسي غير المرغوب فيه أو الملامسة البدنية غير مقبول. وهذا يشمل التعليقات أو النكات أو الصور ذات الطابع الجنسي في التفاعلات أو الاتصالات أو مواد العرض، بالإضافة إلى اللمس أو التلامس أو المداعبات الجنسية غير اللائقة. وعلاوة على ذلك، فإن لمس شخص بدون إذن، بما في ذلك المناطق الحساسة مثل شعره أو بطن الحامل أو جهاز التنقل (كرسي متحرك، أو سكوتر أو غيرها) أو الوشم أمر غير مقبول. وهذا يشمل المنع الجسدي أو تخويف شخص آخر. ومن غير المقبول المُلامسة الجسدية أو محاكاة الملامسة الجسدية (مثل، الرموز التعبيرية مثل "قبلة") بدون موافقة مؤكدة. كما أن مشاركة أو توزيع صور أو نصوص جنسية أمر غير مقبول. السلوك التخريبي لن يتم التهاون مع التعطيل المُستمر للأحداث أو المنتديات أو الاجتماعات، بما في ذلك المحادثات والعروض التقديمية. ويشمل ذلك: "التشويش على" أو "مقاطعة" المتحدثين. الإفراط في شُرب الكحوليات أو الإفراط في تعاطي المخدرات الترويحية أو دفع الآخرين لِفعل ذلك. الإدلاء بتعليقات مُهينة حول الذين يمتنعون عن تعاطي الكحول أو المواد الأخرى، أو دفع الناس إلى تناول الكحول، أو التحدّث عن امتناعهم عن تناول الكحول أو تفضيلاتهم للآخرين، أو الضغط عليهم للشرب - سواءً جسديًا أو من خلال السخرية والتهكّم. أو التأثير بطريقة أخرى على أعمال المُشاركين الأمر الذي قد يتسبب في خلق عداوات في الجلسة. التأثير على خلق سُلوك غير المقبول سنتعامل مع التأثير على خلق مثل هذه الأنشطة أو قيادتها بنفس الطريقة التي نتعامُل بها مع الأنشطة في حد ذاتها، وعليه تنطبق نفس العواقب. عواقب السلوك غير المقبول لن يتم التهاون مع أي سُلوك سيئ يصدر من أي فرد من أفراد موزيلا، بما في ذلك من يملكُون سُلطة اتخاذ القرار إن الجهود المُتعمدة لاستبعاد الأشخاص (إلا إذا كان جزءًا من المبادئ التوجيهية أو الإجراءات الرسمية الأخرى) من أنشطة موزيلا أمر غير مقبول وستتم مُجابهته بالطريقة الملائمة. وسيتم التحقيق في تقارير التحرش / التمييز بشكل سريع وشامل من قِبل الأشخاص المسؤولين عن سلامة المكان أو الفعالية أو النشاط. ستُتخذ التدابير المُناسبة لمُعالجة الموقف. يُتوقع أن يمتثل أي شخص يُطلب منه إيقاف السلوك غير المقبول على الفور. يُمكن أن يُؤدي انتهاك هذه التعليمات التوجيهية إلى مطالبة أي شخص بمُغادرة حدث أو مساحة عبر الإنترنت، إما مؤقتًا أو طوال مدة الحدث، أو منعه من المشاركة في المساحات، أو الأحداث والأنشطة المستقبلية إلى الأبد. يتحمل مُوظفو موزيلا المسؤولية، إضافة إلى هذه المبادئ التوجيهية، والسياسات المكافحة للتحرش/التمييز التابعة لموظفي موزيلا[1]. يَخضع مُوظفو موزيلا الذين ينتهكون هذه التعليمات التوجيهية إلى عواقب أخرى، مثل الإجراءات التأديبية، بما في ذلك إنهاء التوظيف. وبالنسبة إلى المُقاولين أو البائعين، قد يُؤثر انتهاك هذه الإرشادات على استمرار العقد أو تجديده. وبالإضافة إلى ذلك، سيتم اعتبار أي مُشارك يُسيء استخدام عملية الإبلاغ منتهكًا لهذه التعليمات التوجيهية ويَخضع لنفس العواقب. ولن يتم الأخذ بالبلاغات الكاذبة، وبخاصة تلك التي تهدف إلى الانتقام أو الاستبعاد. الإبلاغ إذا كنت تعتقد أنك تُواجه سلوكًا غير مقبول لن يتم التهاون معه كما هو موضح أعلاه، يُرجى استخدام cpg-report@mozilla.com للإبلاغ. يتم فرز التقارير بواسطة قائد الاستجابة للتعليمات البرمجية المعنية بالمشاركة المُجتمعية. بعد تلقّي وصف مُوجز لموقفك، سيقوم بمُراجعة وتحديد الخطوات التالية. بالإضافة إلى إجراء أي تحقيق، يُمكنهم توفير مجموعة من الموارد، بداية من الاستشارة الخاصة إلى موارد المُجتمع الأخرى. وسيتم إشراك زملاء آخرين أو مُتخصصين خارجيين (مثل المستشار القانوني)، حسب الحاجة لمُعالجة كل موقف بطريقة مناسبة. موارد إضافية: كيفية الإبلاغ الأسئلة: cpg-questions@mozilla.com ُيرجى أيضًا إبلاغنا إذا لاحظت موقفًا يُحتمل أن يكون خطيرًا، أو شخصًا في مِحنة، أو ينتهك هذه التعليمات التوجيهية، حتى إذا كان الموقف لا يحدُث لك. إذا شعُرت أنه تم اتهامك ظلماً بانتهاك هذه الإرشادات، يُرجى اتباع نفس عملية الإبلاغ. مساحات موزيلا لِكُل مساحة فعلية أو افتراضية على موزيلا جهة اتصال معيّنة. أحداث موزيلا سيكون لكُل فعالية من فعّاليات موزيلا تعليمات توجيهية مُحددة خاصة بالأمان مع توافر جهات اتصال في حالة الطوارئ ومُناهضة الإساءة وذلك خلال الفعالية أو حتى عبر الإنترنت. وسيتم نشر جهات الاتصال هذه بطريقة واضحة طوال الفعالية، وفي المواد المطبوعة وعبر الإنترنت. ويُطلب من قادة الفعالية التحدث أثناء إقامة الفعالية عن التعليمات التوجيهية ومطالبة المشاركين بمُراجعتها والموافقة عليها عند الاشتراك في الفعالية. وستتلقى البلاغات إشعارًا بالاستلام عبر البريد الإلكتروني. بمُجرد التحقيق في الحادث وإبلاغ القرار إلى الأطراف ذات الصلة، تُتاح للجميع الفرصة للطعن في هذا القرار عن طريق إرسال بريد إلكتروني إلى cpg-questions@mozilla.com. طرح الأسئلة يتم تشجيع الجميع على طرح أسئلة حول هذه التعليمات التوجيهية. إذا كنت تُنظم فعالية أو نشاطًا، فاتصل للحصول على نصائح مُعنية بالإدماج لفعاليتك أو نشاطك أو مساحتك. نُرحب بآرائك ومُلاحظاتك وستتلقى دائمًا ردًا في غضون 24 ساعة (أو في أول يوم من الأسبوع التالي، إذا كانت عطلة نهاية الأسبوع) إذا تواصلت مع cpg-questions@mozilla.com. يُرجى مراجعة سِجل التغييرات للحصول على تحديثات عن هذا المستند. الترخيص والإسناد يتم توزيع هذه المجموعة من المبادئ التوجيهية ضِمن المَشاع الإبداعي Attribution-ShareAlike license. تم تجهيز هذه التعليمات التوجيهية مع تعديلات من التعليمات التوجيهية للمُشاركة المُجتمعية الأصلية التابعة لـ موزيلا، ومدونة سلوك Ubuntu، ومدونة سلوك موزيلا ومدونة سلوك Source Conference، ومدونة سلوك Rust Language، والمستند على مدونة سلوك Stumptown Syndicate’s Citizen. نص إضافي مُدونة سلوك المِثليين في التكنولوجيا ومدونة سلوك WisCon. لا يُمكن أن يظهر هذا المُستند وكل العمليات المُرتبطة إلا من خلال العمل الشاق للعديد والعديد من أفراد الموزيلا. تعديلات على هذه المبادئ التوجيهية يَجوز لمؤسسة موزيلا تعديل المبادئ التوجيهية من وقت لآخر ويُمكن أيضًا تغيير الإجراءات التي تُحددها عند الاقتضاء في حالة معينة. وستُعتبر مُوافقتك على الامتثال للمبادئ التوجيهية موافقة على أي تغييرات تطرأ عليها. هذه السياسة لا تُشكل جزءًا من أي تعاقد عمل لموظف موزيلا أو يكون لها أي تأثير تعاقدي. [1] سياسة مكافحة التحرش متاحة للموظفين المتعاقدين هنا.'
