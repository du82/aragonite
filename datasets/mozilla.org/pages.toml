["https://mozilla.org/be/firefox/browsers/mobile/android"]
title = "Firefox Browser Android - Mozilla"
description = "Браўзер Firefox для Android — хуткі, бяспечны і прыватны з першага запуску."
full_description = "firefox-ios-firefox-browser Уварвіцеся ў Інтэрнэт з Firefox для Android Праглядайце ўсе свае адкрытыя карткі, нядаўнія пошукавыя запыты і ўлюбёныя сайты ў адным месцы з Firefox для Android. Атрымайце Firefox для Android Скануйце QR-код, каб пачаць Шпаркі ды прыватны Firefox для Android забяспечвае зручную абарону прыватнасці з бліскавічнай загрузкай старонак. Узмоцненая ахова ад сачэння аўтаматычна блакуе сеціўныя трэкеры, каб яны не сачылі за вамі ў інтэрнэце і не запавольвалі вашы старонкі. Да прыватнага рэжыму адзін дотык Пераходзьце ў рэжым прыватнага аглядання адным дотыкам. А калі вы закрываеце рэжым прыватнага аглядання, гісторыя вашага прагляду аўтаматычна выдаляецца з прылады. Шукайце так, як вам зручна Маеце вялікі тэлефон і пальцы звычайнага памеру? Няма праблем. Firefox для Android дазваляе перамяшчаць верхні радок пошуку ўніз, што палягчае выкарыстанне адной рукой. Вы таксама можаце выбраць уласную пошукавую сістэму ў браўзеры і ўсталяваць Firefox як прадвызначаны браўзер, калі захочаце. Зберажыце энергію з дапамогаю цёмнага рэжыму Пераходзьце ў цёмны рэжым калі захочаце, каб зменшыць нагрузку на вочы і сэканоміць зарад батарэі. Наладжвайце свой хатні экран Знаходзьце тое, што вас цікавіць у Інтэрнэце, хутчэй. Абірайце прагляд усіх адкрытых картак, нядаўніх пошукавых запытаў, закладак і ўлюбёных сайтаў у адным месцы. Зарадзіце свой Firefox дадаткамі Дадаткі — гэта невялікія, але магутныя інструменты, якія вы можаце дадаць у свой браўзер, каб, напрыклад, узмацніць тыповыя налады прыватнасці ці падкрэсліць сваю індывідуальнасць. Працягвайце з таго месца, дзе спыніліся Пераходзьце з тэлефона на ноўтбук, планшэт і назад, не губляючы часу. З Firefox на ўсіх вашых прыладах вы можаце браць з сабой закладкі, паролі, захаваныя лагіны і гісторыю прагляду, куды б вы ні пайшлі. Шукайце з хатняга экрана тэлефона Не трэба адкрываць праграму. Дадайце віджэт пошуку Firefox і шукайце ў Інтэрнэце прама з хатняга экрана вашай прылады. Замацоўвайце відэа на экране Выцягвайце відэа з вэб-сайтаў і плэераў ды замацоўвайце іх у верхняй частцы экрана тэлефона, каб глядзець, пакуль вы аглядаеце Інтэрнэт ці займаецеся іншымі справамі. Забаўляйцеся, выконваючы некалькі задач адначасова. Пра Mozilla Mozilla існуе для таго, каб зрабіць Інтэрнэт даступным для кожнага, бо мы лічым, што адкрытая і вольная сетка лепш за закрытую і рэгуляваную. Мы ствараем такія прадукты, як Firefox і Pocket, каб спрыяць магчымасці выбару, празрыстасці і кантролю."
