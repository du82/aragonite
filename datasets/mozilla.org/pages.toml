title = "Mozilla Privacy"
description = "Our Privacy Notices describe the data our products and services receive, share, and use, as well as choices available to you."
full_description = '''Mozilla Privacy Policy September 9, 2020 What do we mean by "personal information?" For us, "personal information" means information which either directly identifies you (like your name, email address, or billing information) or can be reasonably linked or combined to identify you (like an account identification number or IP address). We’ll always tell you what personal information we’re collecting from you. See each product’s Privacy Notice for specific details. Any information that falls outside of this is "non-personal information." If we store your personal information with information that is non-personal, we will consider the combination as personal information. If we remove all personal information from a set of data then the remaining is non-personal information. How do we learn information about you? We learn information about you when: you give it to us directly (e.g., when you choose to send us crash reports); we collect it automatically through our products and services (e.g., when your Firefox browser checks with us to see if it is up to date); someone else tells us information about you (e.g., when Thunderbird works with your email providers to set up your account); or when we try and understand more about you based on information you've given to us (e.g., when we use your IP address to customize language for some of our services). What do we do with your information once we have it? When you give us information, we will use it in the ways for which you've given us permission. Generally, we use your information to help us provide and improve our products and services for you. For users in the EU, EEA, Switzerland, and California: see here for more information. When do we share your information with others? When we have asked and received your permission to share it. For processing or providing products and services to you, but only if those entities receiving your information are contractually obligated to handle the data in ways that are approved by Mozilla. When we are fulfilling our mission of being open. We sometimes release information to make our products better and foster an open web, but when we do so, we will remove your personal information and try to disclose it in a way that minimizes the risk of you being re-identified. When the law requires it. We follow the law whenever we receive requests about you from a government or related to a lawsuit. We'll notify you when we're asked to hand over your personal information in this way unless we're legally prohibited from doing so. When we receive requests like this, we'll only release your personal information if we have a good faith belief that the law requires us to do so. Nothing in this policy is intended to limit any legal defenses or objections that you may have to a third party's request to disclose your information. When we believe it is necessary to prevent harm to you or someone else. We will only share your information in this way if we have a good faith belief that it is reasonably necessary to protect the rights, property or safety of you, our other users, Mozilla or the public. If our organizational structure or status changes (if we undergo a restructuring, are acquired, or go bankrupt) we may pass your information to a successor or affiliate. How do we store and protect your personal information? We are committed to protecting your personal information once we have it. We implement physical, business and technical security measures. Despite our efforts, if we learn of a security breach, we'll notify you so that you can take appropriate protective steps. We also don't want your personal information for any longer than we need it, so we only keep it long enough to do what we collected it for. Once we don't need it, we take steps to destroy it unless we are required by law to keep it longer. What if we change this privacy policy or any of our privacy notices? We may need to change this policy and our notices. The updates will be posted online. If the changes are substantive, we will announce the update through Mozilla's usual channels for such announcements such as blog posts and forums. Your continued use of the product or service after the effective date of such changes constitutes your acceptance of such changes. To make your review more convenient, we will post an effective date at the top of the page. Contact Mozilla If you want to make a correction to your information, or you have any questions about our privacy policies, please get in touch with: Mozilla Corporation Attn: Mozilla - Privacy 149 New Montgomery St, 4th Floor, San Francisco, CA 94105 USA compliance@mozilla.com See here for Data Subject Access Requests. If you are under 13, we don’t want your personal information, and you must not provide it to us. If you are a parent and believe that your child who is under 13 has provided us with personal information, please contact us to have your child’s information removed. For product support requests, please visit our forums.'''
year_published = 2020
