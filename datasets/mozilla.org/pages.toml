["https://mozilla.org/be/about/this-site"]
title = "Аб гэтым сайце — Mozilla"
description = "Пра вэб-сайт www.mozilla.org і інструменты з адкрытым зыходным кодам, якія выкарыстоўваюцца для яго стварэння."
full_description = "Аб гэтым сайце Вэб-сайт www.mozilla.org існуе ўжо больш за два дзесяцігоддзі. Дакладней, з часоў дыназаўраў па мерках Інтэрнэту. Такім чынам, www.mozilla.org з'яўляецца нарожным каменем Інтэрнэту, карані якога глыбока ідуць у рух за адкрыты код, які стаў сведкам стварэння Mozilla. Сёння гэта сайт, куды людзі прыходзяць, каб спампаваць Firefox, паспрабаваць Mozilla VPN і даведацца больш пра Mozilla. Па дарозе вы таксама можаце знайсці некалькі Велікодных яек. Як і шмат якія нашы прадукты, гэты вэб-сайт таксама мае адкрыты зыходны код: Праглядзець зыходны код на GitHub Паведаміць пра памылку Зрабіць унёсак у кодавую базу Дапамагчы з перакладам Прачытаць дакументацыю Калафон Некаторыя праекты з адкрытым зыходным кодам, выкарыстаныя для стварэння гэтага сайта: Django у якасці бэкэнд вэб-фрэймворка з Jinja для стварэння шаблонаў. Сістэма праектавання Protocol Mozilla для інтэрфейсных кампанентаў і брэндынгу. Сістэма лакалізацыі Mozilla Fluent для моўнага перакладу. Мноства іншых меншых бібліятэк і фрэймворкаў, якія вы можаце знайсці ў нашым GitHub рэпазіторыі. Мы дзякуем усім памочнікам Mozilla, якія дапамаглі зрабіць Інтэрнэт лепш."
year_published = 2025
