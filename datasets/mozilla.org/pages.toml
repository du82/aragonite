title = "موزيلا — الإنترنت للناس وليس لتحقيق الأرباح"
description = "تبرّع بصوتك لِجعل تقنية الكلام أكثر شمولاً وسهولة للجميع."
full_description = 'إيقاف الرسوم المتحركة مؤقتًا تشغيل الرسوم المتحركة مرحبًا بك في موزيلا من التقنية الموثوقة إلى السياسات التي تحمي حقوقك الرقمية، نحن نضعك في المقدمة — دائمًا وأبدًا. تعرّف علينا عَلَمٌ أخضرٌ مصممٌ بطريقة مُميزة على خلفية سوداء، من حرف "M" في موزيلا وبكسل تم تحريكُها من مكانها للإشارة إلى شعار الديناصور الأصلي. عَلَمٌ أخضرٌ مصممٌ بطريقة مُميزة على خلفية سوداء، من حرف "M" في موزيلا وبكسل تم تحريكُها من مكانها للإشارة إلى شعار الديناصور الأصلي. اعشق الإنترنت مرة أخرى تحرّر من هيمنة شركات التقنية الكبرى – حيث تمنحك منتجاتنا التحكّم في تجربة الإنترنت لتُصبح أكثر أمانًا وخصوصية. فيَرفُكس: تصفّح بمنتهى الأمان واستمتع بالسرعة والخصوصية والتحكّم. Thunderbird: بسّط حياتك باستخدام تطبيق واحد لجميع رسائلك الإلكترونية والتقويمات وجهات الاتصال. Fakespot: اكتشف المراجعات المزيفة والمنتجات السيئة والبائعين غير الموثوقين. Pocket: احفظ أفضل محتوى على الإنترنت على أي جهاز – فمن منا لديه الوقت لقراءة كل شيء الآن؟ موزيلا VPN: أضف طابع الخصوصية إلى موقعك ومغامراتك عبر الإنترنت – واستمتع بالبث كأنك تعيش في المكان كشخص محلي، في أي مكان. Mozilla Monitor: احصل على تنبيه إذا كانت معلوماتك الشخصية معرضة للخطر واِحمها مثل المحترفين. فَيَرفُكس Relay: يُرجى إخفاء بريدك الإلكتروني ورقم هاتفك لتتلقّى الرسائل التي تريدها فقط. استكشف منتجاتنا تبرّع لشركة موزيلا غير الربحية تعمل موزيلا على بناء حركة لاستعادة الإنترنت. معًا يمكننا بناء مستقبل نحمي فيه خصوصيتنا، نثق بالذكاء الاصطناعي، ونحاسب شركات التقنية غير المسؤولة. ولكن هذا ممكن عندما نتعاون سويًا فقط. نحن شركة غير ربحية بكل فخر. هل ستتبرّع لشركة موزيلا اليوم؟ تبرَّع انضم للحركة:الذكاء الاصطناعي للناس مهمتنا هي تسهيل إنشاء تقنيات ذكاء اصطناعي مفتوحة المصدر وموثوقة والتعاون في مثل هذه التقنيات. Common Voice المنتج تبرّع بصوتك لِجعل تقنية الكلام أكثر شمولاً وسهولة للجميع. ساهِم بصوتك هل يمكن أن يكون الذكاء الاصطناعي موثوقًا؟ الحدث في عالم تُدار فيه ابتكارات الذكاء الاصطناعي من قبل قلة مختارة، فإننا أمام خطر احتكار هذه التقنية. وقد يُمكن لتطبيق مفاهيم المصدر المفتوح تغيير هذا الواقع. شاهد الآن Lumigator المنتج ابحث عن نموذج (LLM) المناسب لاحتياجاتك واستخداماتك وبياناتك. لنبدأ مشاريع Mozilla البرنامج هل تمتلك شركة ناشئة في مراحلها الأولى؟ قدّم شركتك لـ مشاريع Mozilla واحصل على تمويل لدفع التغيير الإيجابي لمستقبل الذكاء الاصطناعي والإنترنت. اطَّلِع على المزيد Llamafile مشروع شغّل نماذج اللغة الكبيرة (LLMs) بسهولة على جهازك باستخدام Llamafile – دون الحاجة إلى تثبيت، مع الحفاظ على أمان بياناتك على جهازك. لنبدأ برنامج Mozilla Builders البرنامج يُساعد برنامج برنامج Mozilla Builders المُطوّرين المُستقلين على إنشاء مشاريع ذكاء اصطناعي مفتوحة المصدر وثورية من خلال التعاون المُخصّص والبرمجة والمجتمع. اطَّلِع على المزيد أنت والذكاء الاصطناعي والإنترنت – ما الذي يَحدث فعليًا؟ النوع المؤلف الموضوع المقدمة مقالة Laura Chambers الخصوصية والسريّة نُقدّم لك Anonym: رفع مستوى الإعلانات الرقمية التي تحافظ على الخصوصية. مقالة Saoud Khalifah الذكاء الاصطناعي يُعتبر الحفاظ على أمان تقنيات الذكاء الاصطناعي التوليدي مسؤولية مشتركة. تدوين صوتي بودكاست IRL الذكاء الاصطناعي من هوليوود إلى موسيقى الهيب هوب، يناقش الفنانون موافقتهم على استخدام الذكاء الاصطناعي. فديو Rebecca Smith أخبار تحتفي موزيلا بالمبدعين المبتكرين في سلسلة وثائقية جديدة بعنوان "هدايا فيَرفُكس ". تدوين صوتي بودكاست IRL الذكاء الاصطناعي إن سيطرة شركات التقنية الكبرى على اللغة تعني السيطرة على البشر. تتحدّث بريدجيت تود مع قادة مجتمعات اللغة الذين يمهدون الطريق للذكاء الاصطناعي الصوتي بلغاتهم ولهجاتهم. تدوين صوتي بودكاست IRL الذكاء الاصطناعي لماذا نشعر غالبًا وكأننا جزء من تجربة جماعية للذكاء الاصطناعي؟ ما الطريقة المسؤولة لاختبار التقنيات الجديدة؟ تستكشف بريدجيت تود معنى العيش مع أنظمة ذكاء اصطناعي غير مثبتة والتي تؤثر بدورها على ملايين الأشخاص عند طرحها في الحياة العامة. مقالة Kristina Bravo الخصوصية والسريّة يكبر الأطفال في عالم يتزايد فيه الاتصال عبر الإنترنت. ماذا يمكن للآباء القلقين فعله؟ حالة موزيلا تعمل موزيلا على إعادة ابتكار ذاتها وتتنوّع وسط مجموعة من المُؤسسات وتعيد تصوّر الإعلان وتوفّر نظامًا بيئيًا مفتوح المصدر للذكاء الاصطناعي. اقرأ عنها في تقرير حالة موزيلا لِعام 2024. 2024 اقرأ التقرير استكشف القضايا التي تشكّل مستقبل الإنترنت الخصوصية غير مضمونة ابحث في مراجعاتنا لاكتشاف الأجهزة والتطبيقات التي تتسلل إلى بياناتك في الخفاء. ابحث الآن بودكاست IRL يقدّم البودكاست الخاص بنا والحائز على العديد من الجوائز صانعي التغيير الذين يعملون لجعل الإنترنت أكثر أمانًا وجعل الذكاء الاصطناعي أكثر موثوقية. استمع الآن'
