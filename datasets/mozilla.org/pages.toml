["https://mozilla.org/en-US/firefox/browsers/mobile/ios"]
title = "Get Firefox for iOS (iPhone and iPad) — Mozilla (US)"
description = "See your open tabs, past searches and favorite sites all in one place with Firefox Browser for iOS."
full_description = "Firefox Browser Get to your go-to places faster on your iPhone and iPad See your open tabs, past searches and favorite sites all in one place with Firefox Browser for iOS. Get Firefox for iOS Send a download link to your phone. Your download link was sent. Please enter an email address. An error occurred in our system. Please try again later. Enter your email Send The intended recipient of the email must have consented. Learn more Check your device for the email! Send to another device Make Firefox your default browser Now iPhone and iPad users can choose their own default browser. That means you’re not stuck using Safari, and your mobile browser can stay synced with your favorite desktop browser. Plus, when you set Firefox as your default browser, you’re supporting an independent tech company. Firefox is also the only major browser backed by a non-profit. Fast. Private. Secure Keep what’s personal private without sacrificing blazing fast speed. Plus, smart browsing features give you the power to take your privacy, passwords and bookmarks with you safely wherever you go, making your life online easier. Stay private online Firefox gives you greater privacy protection while you’re on the web. By default, our Enhanced Tracking Protection blocks trackers and scripts such as social media trackers, cross-site cookie trackers, cryptominers and fingerprinters. Your browsing history is history If you want, you can easily select to go online and search in private browsing mode. And when you close private browsing mode, your browsing history and any cookies are automatically erased from your device. Get more Firefox in your life Add Firefox across your devices for secure, seamless browsing. Sync your devices to take your favorite bookmarks, saved logins, passwords and browsing history wherever you go. Plus, send open tabs between your phone and desktop to pick up where you left off. Find it all faster Get search suggestions in the search bar and quickly access the sites you visit most. Type in your search question, and get suggested and previously searched results across your favorite search engines. Own your home screen Get to the parts of the internet you care about faster. Choose to see all your open tabs, recent searches, bookmarks and favorite sites all in one place. Discover more of what you love Open a new tab in Firefox to see the sites you visit most, your recent bookmarks and popular articles in Pocket. Firefox gives you quick access to your most recently used sites to help you get where you’re going faster. About Mozilla Mozilla exists to build the Internet as a public resource accessible to all because we believe open and free is better than closed and controlled. We build products like Firefox and Pocket to promote choice, transparency and control."
