full_description = "Reclaim the internet with us Mozilla is working to put control of the internet back in the hands of the people using it. Together, we can keep the internet easy, safe and free — for everyone. Read our manifesto Advocate We advocate for better products, holding governments and tech corporations accountable for what they create. Research We uncover insights, campaign to improve products and drive policies that represent your interests. Build We build products that put you in control — like Firefox, Fakespot and more. Fund We fund and invest in the people and efforts taking technology, the internet and AI in the right direction. Read the latest Mozilla news & articles Mozilla Builders helps developers create transformative open-source AI projects through collaborations, programming, and community Read more At our Rise25 Awards, the future of AI is trustworthy, inclusive and accountable Read more Empowering Chicago’s entrepreneurs for generational change Read more Let’s build a fairer future See how we’re fostering a diverse, inclusive and accessible online environment for all. Read about our commitment Join us and make a difference Join our team and push the boundaries of what’s possible — without compromising on what matters. See open positions Community love, our driving force Mozilla is a global community of passionate volunteers, fellows and contributors who have been building, protecting and shaping the internet with us since 1998. From writing code and spotting bugs to advocating for privacy and keeping the internet open for everyone — our community members are the backbone of everything we do. Their passion and dedication inspire us every day."
