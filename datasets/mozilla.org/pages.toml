title = "Паспрабуйце новыя магчымасці перад-рэлізнай версіі для Android | Firefox"
description = "Паспрабуйце найноўшыя магчымасці ў перад-рэлізнай версіі браўзера для Android: Firefox Beta і Firefox Nightly. Усталюйце зараз!"
full_description = "Тэстуйце будучыню. Будзьце сярод першых даследчыкаў будучых выпускаў Firefox для камп'ютара, Android і iOS. Beta Паспрабуйце найноўшыя функцыі для Android, перш чым яны стануць даступныя для ўсяго свету. Firefox Beta — Беларуская Android Сцягнуць Паведамленне аб прыватнасці Firefox Усе мовы і платформы Beta — гэта нестабільная платформа, для тэставання і распрацоўкі. Калі не ўказана іншае, Beta адпраўляе звесткі ў Mozilla — і часам нашым партнёрам — каб дапамагчы нам выпраўляць праблемы і выпрабоўваць ідэі. Даведайцеся, якія звесткі становяцца даступнымі. Дасылайце свае водгукі, каб дапамагчы нам дасягнуць лепшай прадукцыйнасці і функцыянальнасці ў стабільным асяроддзі. Nightly Паспрабуйце новыя магчымасці для Android на раннім этапе. Атрымлівайце асалоду на свой страх і рызыку. Firefox Nightly — Беларуская Android Сцягнуць Паведамленне аб прыватнасці Firefox Блог Nightly Усе мовы і зборкі Nightly — гэта нестабільная платформа, для тэставання і распрацоўкі. Калі не ўказана іншае, Nightly адпраўляе звесткі ў Mozilla — і часам нашым партнёрам — каб дапамагчы нам выпраўляць праблемы і выпрабоўваць ідэі. Даведайцеся, якія звесткі становяцца даступнымі. Заўвага: Firefox Nightly будзе абнаўляцца прыкладна адзін ці два разы на дзень. Бачыце, што нешта не працуе? Паведаміце нам. Паведаміць пра памылку зараз Парады па апісанні памылак Firefox Firefox + Вы Атрымлівайце парады, падказкі, навіны Firefox і нават больш Калі ласка, увядзіце сапраўдны адрас электроннай пошты Калі ласка, выберыце краіну або рэгіён Калі ласка, абярыце мову Калі ласка, пазначце хаця б адзін з варыянтаў рассылкі. Вы павінны пагадзіцца з паведамленнем аб прыватнасці Нам шкада, але ў нашай сістэме ўзнікла праблема. Калі ласка, паспрабуйце пазней! Ваш электронны адрас: Выберыце краіну або рэгіён: Выберыце краіну або рэгіён Mayotte Іарданія Ізраіль Інданезія Індыя Ірак Іран Ірландыя Ісландыя Іспанія Італія А.А.Э. Азербайджан Акраціры Албанія Алжыр Аман Амерыканскія Самоа Ангола Андора А