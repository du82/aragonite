title = "Firefox Focus: The privacy browser"
description = "Firefox Focus is your dedicated privacy browser with automatic tracking protection."
full_description = "Firefox Focus Simply private mobile browsing Firefox Focus is your dedicated privacy browser with automatic tracking protection. With Focus, your pages load faster and your data stays private. Firefox Focus is available for both iOS and Android devices. Get Firefox Focus Scan the QR code to get started Delete your history Easily erase your history, passwords and cookies, so unwanted ads don’t follow you around online. Just tap the erase button on the search field and it’s gone. Take private mode to the next level “Private browsing” on most browsers isn’t really all that private. Firefox Focus offers next-level privacy by default and it’s backed by Mozilla, the non-profit that fights for your rights on the web. Tracking protection Firefox Focus blocks a wide range of common trackers by default including social trackers and those sticky ones that come from things like Facebook ads. See it all faster Focus removes trackers so the pages you’re viewing require less data and load much faster. Also, pin up to four shortcuts on your home screen and get to your favorite site even quicker without typing anything. Made by Mozilla We believe everyone should have control over their lives online. That’s what we’ve been fighting for since 1998."
