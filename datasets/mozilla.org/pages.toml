full_description = "Your talents are needed for a better internet Mozilla is a non-profit organization working to ensure the internet is open and welcoming to all. And we need your help. By joining our community, you can help drive innovation, enhance accountability and trust and make the internet a better place for everyone. How you can contribute… Non Technical Individual and event organization Translate content The internet is only global if it’s understood everywhere. Help us translate Mozilla products and websites into your local language. Technical Individual Contribute to the Mozilla codebase Actively improve Mozilla products by contributing to a variety of development opportunities. Support Individual and event organization Individual and event organization Help make Mozilla products easy to use. Answer people’s “help” questions as part of the Mozilla Support Community forums. Technical and Non-technical Join the community Want to get more involved in the Mozilla community? Check out all the volunteer opportunities in our Community Portal. Our Mission Our mission is to ensure the internet is a global public resource, open and accessible to all. An internet that truly puts people first, where individuals can shape their own experience and are empowered, safe and independent. Learn about Mozilla Read our manifesto Find an event Meet our passionate volunteers Donate Help fund our mission Follow Mozilla News and volunteer opportunities Made by passionate people like you When you contribute to Mozilla, you become part of a worldwide community made up of people from around the globe who believe that we all have a role in ensuring that the internet remains a force for good. We believe community collaboration is vital to creating an internet that is diverse, innovative, and accountable to the people who need it most. Whether you have a background in tech, community organizing, or just a computer and some free time, you can help us make the internet a better place. a