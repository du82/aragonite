title = "微信小程序"
description = "小程序是一种新的开放能力，可以在微信内被便捷地获取和传播，同时具有出色的使用体验。小程序开发者可在小程序内提供便捷、丰富的服务，如预订、商品购买、游戏、信息查询等。"
full_description = "小程序是一种新的开放能力，开发者可以快速地开发一个小程序。小程序可以在微信内被便捷地获取和传播，同时具有出色的使用体验。 在微信公众平台(mp.weixin.qq.com)注册小程序，完成注册后可同步进行信息完善和开发。 完成小程序开发者绑定、开发信息配置后，开发者可下载开发者工具、参考开发文档进行开发和调试。 完成小程序开发后，提交代码至微信团队审核，审核通过后即可发布（公测期间不能发布）。 完成小程序开发者绑定、开发信息配置后，开发者可下载开发者工具、参考开发文档进行小程序的开发和调试。 完成小程序开发后，提交代码至微信团队审核，审核通过后即可发布（公测期间不能发布）。"
