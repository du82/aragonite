full_description = '''Clients MPD is designed around a client/server architecture, where the clients and server (MPD is the server) interact over a network. Thus, running MPD is only half of the equation. To use MPD, you need https://mpd.fandom.com/wiki/Clients Configuration Music Player Daemon will look for configuration files in two default places. The system-wide configuration file can be found at/etc/mpd.conf. For local users, mpd will find it at~/.mpdconf. You can https://mpd.fandom.com/wiki/Configuration Music Player Daemon Wiki Music Player Daemon (MPD) is a flexible, powerful, server-side application for playing music. Through plugins and libraries it can play a variety of sound files while being controlled by its network protocol. For more https://mpd.fandom.com/wiki/Music_Player_Daemon_Wiki Windows Compatibility The current stable release is also distributed as an archive containing Windows binaries. There is no included mpd.conf and no included documentation. I recommend getting the source as well and viewing the examplempd.conf https://mpd.fandom.com/wiki/Windows_Compatibility PulseAudio From the PulseAudio website: If you happen use one of the distributions with PulseAudio packages you should first try installing it from that. Other users will have to download and compile it themselves. https://mpd.fandom.com/wiki/PulseAudio Install Installing from source should work for all*nix distributions. In many cases it is better to go below to look for specific installation instructions for your distribution if you're in a*nix distribution. If https://mpd.fandom.com/wiki/Install Hack:di.fm-playlists списък за изпълнение] НомерOfEntries=70 https://mpd.fandom.com/wiki/Hack:di.fm-playlists Alsa There's a couple of different configuration options here. The easiest is to edit mpd.conf as follows: audio_output{ type "alsa" name "Sound Card" options "dev=dmixer" device "plug:dmix"} An additional option is https://mpd.fandom.com/wiki/Alsa What MPD Is and Is Not This list is not the "final word". If intelligent arguments can be made, and code could be presented by those who want the feature, modifications can be made. These are simply the strong feelings held https://mpd.fandom.com/wiki/What_MPD_Is_and_Is_Not'''
