["https://msanatan.com/blog/2015/01/11/throwing-2015-into-chaos-with-goals"]
title = "Throwing 2015 Into Chaos with Goals — Marcus Sanatan"
description = "A collection of my blog posts tagged with undefined"
full_description = "Throwing 2015 Into Chaos with Goals2015-01-11personalEvery year I keep my distance from the resolutions frenzy. I’m not a guyfor structure and rule books (no, I am still a law-abiding citizen). Sotelling myself “I’m changing my life with these 5 steps!” was nevergoing to fly with me. Of course my parents, teachers and friends allencouraged me to have goals and we talked about them year in, year out.It was just that though, something to talk about. Not really goals, morelike objectives that are nifty additions to my “be a better person”mantra. This year I might just be that guy who puts some order in his life (I’ve driven over the speed limit, I guess I broke the law a couple of times…). I felt quite disappointed by last year. There was a high probability it was never going to be to my liking from the very beginning. I had all my dreams in my head but no plan to go with it. The result? A year of chaos. Doing many things and feeling overwhelmed. Missing out on opportunities and feeling underwhelmed. By all means it was a good year (graduated, good times with loved ones, found my passion in Computer Science, got a sexy job, etc) but it wasn’t all that I wanted it to be… it didn’t feel like a great year. Extra Spoon Of Chaos, Please One year later, I’m looking for chaos again. Not like last year though, more like the chaos you get from a rudimentary understanding of Chaos Theory. I’m treating my future as a dynamical system, and I’m making a small change to the initial parameters by making goals, to have a vastly different attitude to how I feel about myself and the way I used my time… And here they are: Write 10 more blog posts of at least 500 words that detail my interest and experience in the following topics: Open Source Software use and development; Theoretical Computer Science and its impact on programming; Open Data & the Semantic Web; JavaScript development and developments of JavaScript; and developments of ICT policy and its impact on the local and regional citizen. Due no later than October 2015. Apply and get accepted to at least 3 Masters degree programmes that heavily focus on Theoretical Computer Science and/or the Semantic Web initiative by March 2015. Preference for universities in South America (Brazil & Chile in particular). Assist in the growth of the newly formed Trinidad and Tobago JavaScript User Group. Create an online presence for the group (ideally using the .tt domain) and start JavaScript workshops that teaches students aged 15+ how to make web apps with JS. A website should be available by March 2015 and two workshops would have been held by September 2015. Ensure that the Click To Start wesbite meets all the requirements by February 2015. From there on, ensure updates to content are done on demand. Complete the necessary visualisation for the proposal by January 2015, so that they could be sent to potential sponsors. Please note that my goals are for the most part measurable - there’s a way to determine the success of each one. Do yourself a favour and ensure yours are too. A couple more personal ones are still being refined but I don’t want to give everything away (no mystery, no excitement!). Trust me when I tell you that I’m feeling better already. With my goals written down and measurable I’m always aware of the purpose of my actions at every step, and it’s only the 11th day of the year! That’s something I’m wary about though, it’s only the 11th day of the year. Time will tell how well I execute my goals, who knows what will happen to me later on. It’s chaos after all, and as Edward Lorenz exquisitely wrote, “Chaos: When the present determines the future, but the approximate present does not approximately determine the future.” My heart’s not any weaker because of the uncertainty though, if I want change then I have to change as well. Here’s to making myself a better person, yet again. H/T to Tracy Hackshaw for guiding me on how to make goals, and motivating me to make them."
year_published = 2025
