["https://msanatan.com/blog/2014/12/07/trinidad-and-tobago-javascript-user-group-the-yearning-for-a-developer-environment"]
title = "Trinidad and Tobago JavaScript User Group & The Yearning for a Developer Environment — Marcus Sanatan"
description = "A collection of my blog posts tagged with undefined"
full_description = "Trinidad and Tobago JavaScript User Group & The Yearning for a Developer Environment2014-12-07developers, trinidad and tobagoHey everyone, something quite cool happened yesterday. I have been away from Trinidad and Tobago for the last five years O_o, so while I have to catch up a lot on the tech scene here I have also had the experience of participating in thriving tech communities. I am going to shamelessly promote Edinburgh (where I did undergraduate studies) with this lovely video: https://www.youtube.com/watch?v=7BQ8wYrotZY The thing is, Trinidad and Tobago’s developer, and really ICT sector is still blossoming. Meetups have happened, Startup Weekend is definitely a hit and now I can speak of something new that I will definitely be involved with later on: JavaScript User Group! I JavaScripts Too… Kinda I am not a professional JavaScript developer. Actually I am not even a professional developer at the moment. I am not even the biggest fan of JavaScript as a language. But as a moderate user of Node.js and happy with CoffeeScript (and really after making a genuine effort to actually learn the darn thing properly) I guessed that there would be something for my interests. And there was! H/T to Lasana Murray for organising and leading this meeting. On a hot Saturday afternoon 7 people found themselves in Pizza Hut, Valsayn digesting some artery clogging, cheesy goodness while a few select updates on JavaScript were discussed. Generally this group is open to JS developers of all types, even those who do not love but have to use it. It embraces users of any technology “that can compile down to JS” (LOLCODE groupies, that includes you too). The topics this time around were the recent hack.summit() event which was nothing but awesome, Angular.js 2.0’s lack of backwards compatibility, the development of Crowdcast.io and how we can emulate its patient evolutionary approach to product development, recent Firefox updates and a couple other things. There was a real openness and interactivity which made it pleasurable and much more than an announcement. And without the big companies, startups looking for developers and well-funded academic departments that I have been pampered with at Edinburgh, I still found myself learning new things and engaging about software development. Something about great minds and pizza makes a super combination. The Journey Ahead The interesting part that kicked off was the open discussion after the JS “broadcast”. Aside from the “JavaScript is pretty much evil” vs “JavaScript makes the world go ‘round” fun debate, there was a desire for a strong community of developers in our country and region. A community that not just meets and talks about starting up companies while pretending the world is flat, but where we can constantly learn things from each other and know about what is happening in the industry (and academia, we love you too). And then the sombre stories kick in. There is nothing new under the sun… and creating a local developer environment is no different. There was a welcome age diversity in the meeting (there was a lack of gender diversity though…), and I got an honest reality check of the situation at hand: it never catches on. Many come out for a while, but few stick with it. We all wanted something more than an active Facebook group, but we did not get to define what it is (while I was there, I had to leave a bit early!). But it is promising, what we gained was a core of people willing to put effort into creating a grassroots community while our industry grows. There seems to be spaces for devs as well - S/O to Punch Lab where we plan to hack at next weekend. All in all, as I am growing with JavaScript I am happy to grow with my fellow users. This is something I will definitely be going on about more often."
