title = "Micro Games with Kontra.js — Marcus Sanatan"
description = "A collection of my blog posts tagged with undefined"
full_description = "Micro Games with Kontra.js2018-08-31javascript, kontra, js13k, game developmentHello game developers, So my good friend Lasana put me on to a month long game competition: Js13kGames. Essentially you got to make a game in JavaScript that when zipped is 13kb or less. Sounds like fun! The constraints forces some interesting creativity, from my observations the winners had the following traits: Streamlined build process to ensure they don’t go over the limit Little to no external assets - all were converted to JS beforehand Procedurally generated maps Awesome canvas code or a microframework I’ve done games from the canvas API before but it can be tedious if it becomes sufficiently complex. So looking for some viable options I discovered Kontra.js. This microframework was pretty much built to help compete in this competition, it boasts a winner using it as well. While the game engine is easy to use you should still expect to use some canvas code when you’ll want to customise. It doesn’t take long to get started, I made a little playground for myself to get a hang of core mechanics https://msanatan.com/kontra-playground. There’s also an excellent tutorial from the developer who created Kontra: https://medium.com/web-maker/making-asteroids-with-kontra-js-and-web-maker-95559d39b45f. Hopefully this little snippet was enough to get you guys interested and push forward your HTML5 game development journey Happy micro-game developing!"
