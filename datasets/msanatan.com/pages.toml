title = "2019 Was a Good Year — Marcus Sanatan"
description = "A collection of my blog posts tagged with undefined"
full_description = "2019 Was a Good Year2020-01-01personalEvery New Year my brother and I look at each other and say, “this is going to be our year”. It’s not that we are unsatisfied with the cards life has dealt us, nor do we think we are making bad plays. We just know that there’s more to come, and we have so much more to give. 2019 was tiring, yet very rewarding. My goals can be pretty much summed up into one command: complete things. I’m guilty of starting books and games without ever completing them. Same thing goes for game jams and all kinds of development interests. Instead of spreading my attention across different things at a time, I’m switched to immersing myself in one to three items. While obvious, getting that discipline has been great! It also helps to cut down on activities that don’t particularly help you in those endeavours but take time. Previous years I would be heavy in volunteering, 2019 I dialled it back a bit. Not that I don’t support causes like education and poverty eradication, I just need hours to focus. While there’s still a lot of room for improvement, and with new responsibilities even more time management is required, I’m pretty pumped for 2020! Let’s start things off with something I consider a major achievement: Hosting a Game Jam - Jammin It feels like 7/10 Caribbean software developers I speak with got into the field to make video games. That’s my narrative as well. There was a game development scene happening in Trinidad and Tobago, and Jamaica. Like most good things in the Caribbean, it stopped abruptly and without finished products to show for it. So I thought I’d play my part to fill that gap. As part of Caribbean Developers, I hosted our very first game jam: Jammin! This game jam was small but I’m so proud. We probably got 5 participants actively making an effort and 3 submissions. The games were fun! This also forced me to reach out to the community and get us talking with each other. While small, something is happening once again. And the best part is that Jammin will continue, this year it will be bigger. While I had a plan and got most of the launch items through, a shortened timeframe and travel on the day it kicked off certainly did not help my ability to promote and participate. I felt like the absent father in an anime who’s proud of their child’s growing abilities from afar but makes no attempt to have a real connection with them. It was rough. This year the planning will kick off earlier, and I think the date would be earlier as well. We’ll set up a dedicated website and do even more promotions. Prizes will be better for participants too. Jammin will be that light in the darkness. Game Dev So I really had one goal: take part in a game jam. Didn’t even care to win! OK, I always want to win. I only make real efforts. Unfortunately, I completely failed in that regard. Life literally came into the way everyone I wanted to be a part of. Thankfully, preparing for those game jams got me to release 3 games in 2019. No game was polished and they won’t top Steam charts on any day. However, each one taught me brand new things. Swerve The first was the most basic JavaScript game I made - Swerve. This was built with Kontra.js that I started learning for the 2018 iteration of JS13kGames. It’s a microframework that was built for the JS13k competition which requires games to built under 13kb. You can play the game at https://msanatan.com/swerve and read more about how I created it on this blog post. I wanted this game to be a first-class citizen on mobile devices. It was the first time I put a concerted effort into getting one of my HTML5 mini-games scaled and working well on my phone. I tested it on iPads as well, I was pretty happy with it. Approximately This game was meant to be my Jammin entry. Due to the timing I mentioned earlier, it just could not happen. After the jam was over some other commitments really took off and I just didn’t have the time to get it done in 2 weeks. Of course, this wasn’t the year for abandonment! I made Approximately with Phaser using TypeScript. I’ve been doing more experiments with Phaser and even wrote a couple of articles for it on Stack Abuse. I figured it would be the easiest framework for me to make any game with at that time. This game I really wanted to nail scaling with Phaser 3. Phaser 2 scaling was pretty easy, but for a while scaling with version 3 was not straightforward. By the time I started this game, the new scale manager was out so I thought I should see it for myself. This was my first game on itch.io! It’s a platform I love with all my indie game-playing heart. I was super stoked finally upload something on it. And yes, there’s a blog post for this game too! AV: Execute This project has two parents. The first is Mega Man Battle Network - one of my favourite Game Boy Advance games. Somehow I got nostalgic and started to play it again. The second is a dead project from 2018 that would have been submitted to JS13kGames. I’m glad I was able to bring it back to life. This is definitely the biggest project I’ve worked on thus far. After looking at Godot for some time and doing the basics, I decided to put my knowledge into practice. I did an online course who’s introductory game involved text input and buttons, and this project just pushed my abilities 10-fold. Godot is amazing and will be my primary game development framework for the foreseeable future. It makes designing a game easy and natural with its node and scene system. Check it out for yourself if you’re interested. Be sure to play the game as well! It works on the 3 major desktop operating systems and doesn’t require much from your hardware. This experience was so massive for me I created 2 blog posts for it. The first was more about how I got into Godot while the second describes some technical bits I rather not forget. I’m looking forward to some small Phaser projects on the web and more Godot games in the wild. Definitely aiming for a mobile app with Godot. Games I have too many games downloaded or sitting on my desk that I’ve never touched. Why is buying games so satisfying? It just needs to stop. I made a new rule to only buy a new game if I beat one. It helped a lot, up until I got my Switch and the sales came flooding in. Even so, I did finish some games I started in 2019. Not always 100%, but at the very least the main story would be complete. Here’s my list! Ratchet & Clank - PS4 The definition of fun. Not particularly hard but beautiful and exciting throughout. Child of Light - PS4 I’ve had this game on my docket for so long… Loved it all the way. For someone with RPG experience, there won’t be a major challenge here in normal mode. But some gorgeous environments and characters that grow on you will see you through Ni no Kuni II: Revenant Kingdom - PS4 Great gameplay and lovely world but the story is so childish and crappy. I liked randomly roaming the world and the combat is so satisfying even though it’s simple. Put it on Hard for a balanced experience. Sayonara Wild Hearts - PS4 One of the best soundtracks I’ve played in a while. The hype on Twitter is a bit misleading, but the experience is genuinely 10/10. It will be roughly 2 hours of your life well spent Cat Quest - Nintendo Switch I’m not a cat person, btw. This Cat Zelda is pretty fun. Cute dialogue with nice art and relaxingly casual gameplay makes this game a winner in my book. I’ll definitely get the sequel! Gris - Nintendo Switch This game was played more by my partner than by me. She’s not a gamer at all but got into it because of the amazing visuals. It’s an interactive story, the platforming has its tricky moments but they’re not meant to be impediments. The “Game as Art” movement is not everyone. If it is for you, then this game is for you. You likely have it already. I’m pretty proud of myself. For the record, I only beat these games in 2018: Rakuen - Mac Bravely Default - Nintendo 3DS In 2017, it was just World of Final Fantasy and a couple of quick games I played on itch.io. This was a tremendous improvement! And there are more games to come. These are some of the games I started in 2019 and will look to complete this year: Oxenfree - Mac Final Fantasy X - PS4 (I think this was started in 2018, I am dragging this out!) Untitled Goose Game - Nintendo Switch Zelda: Link’s Awakening - Nintendo Switch Lego City Undercover - Nintendo Switch Transistor - Nintendo Switch Zelda: Breath of the Wild - Nintendo Switch Unravel 2 - Nintendo Switch Megaman Battle Network - GBA And these are the ones I want to pick up this year: Kentucky Route Zero - Mac Shadow of the Colossus - PS4 Nier Automata - PS4 God of War - PS4 Uncharted Collection - PS4 Octopath Traveler - Nintendo Switch Cyberpunk 2077 - PS4 Pokemon Sword - Nintendo Switch Books I was only a bookie during vacation times during my school and university years. I love books, yet I read so slowly. I fell off with reading books in 2018. I did not finish one after a fairly decent outing in 2017. With a more concerted effort I finished these beauties: The Queen of Katwe - Tim Crothers Inspirational yet saddening story. The writing was OK but the subject matter will naturally pull your emotions back and forth. Orphan Island - Laurel Synder Wasn’t sure what to expect but I loved it. First half was a slow burn, very light and nothing I would miss after I was done. When the second half of the book started to turn the pace up, I couldn’t stop turning pages. In the end, it made me reflect about going into adolescence in a meaningful way. High Mas: Carnival and the Poetics of Caribbean Culture - Kevin Adonis Browne I love to support local creators. After an immense reading session by the author himself, I had to get the book for myself. In-between him wrestling with what it means to be Caribbean, you’ll find some of the best photography of Carnival. Looking forward, I want to knock these bad boys in 2020: Twenty Love Poems and a Song of Despair - Pablo Neruda The Power of Corruption - Dan Fulani The Sellout, Paul Beatty Having a hard time reading this. Intellectual, liberal humour is my cup of tea. However, I think this cup is overflowing. Fight the Right - Warren Kinsella Believe in your Own Fairytale - Kay-Marie Fletcher The White Woman on the Green Bicycle - Monique Roffey If I’m really good with my time I’ll remove these from my backlog: The Goat Woman of Largo Bay - Gillian Royes A Hologram for the King - Dave Eggers Homegoing - Yaa Gyasi Lord of the Flies - William Golding Online Courses After my left my job at a telecoms company, I decided to be a full-time software developer. Since programming was not my day-to-day for some time, I needed to catch up! That’s why I really started getting into online courses. In 2017, I did quite a few before landing my current job: Making Games With Phaser 2.X https://www.udemy.com/course/making-games-with-phaser Make a Unity 2D Physics Game - For Beginners! https://www.udemy.com/course/draft/412034 Getting Started as a Web Developer https://www.udemy.com/course/refactoru-getting-started-as-a-web-developer Create An HTML5 Video Player From Scratch https://www.udemy.com/course/draft/294794 React JS Web Development - The Essentials Bootcamp https://www.udemy.com/course/react-js-and-redux-mastering-web-apps 2018 was less productive as a lot of my learning was on the job of course. Online courses are not the only resources I use to learn, I never stay stagnant. Anyway, this is what I completed: Web Design for Web Developers: Build Beautiful Websites! https://www.udemy.com/course/web-design-secrets And in 2019, I completed nothing… Zilch. I did start some that I expect to finish this year. Here’s to a better 2020: Discovering Godot: Make Video Games in Python-like GDScript https://www.udemy.com/course/godot Typescript: The Complete Developer’s Guide [2020] https://www.udemy.com/course/typescript-the-complete-developers-guide React JS Web Development - The Essentials Bootcamp https://www.udemy.com/course/react-js-and-redux-mastering-web-apps You’re not seeing things, I completed this course in 2017. New content was added in 2019, so it wouldn’t hurt to refresh my skills. The bulk of programming I do is in Golang. The courses I take will really cover my gaps: games and front-end things. Writing I love blogging. It engages my community and honestly writing things down is pretty crucial for my brain which tends to forget. However, blogging does take time. Making time to write for my personal site has become even harder than before. Between writing and now editing for Stack Abuse along with more responsibilities at my day job, it can be challenging to carve out 8 hours for a blog post. That said, 2019 tied with 2015 for having the most amount of posts in a year - 9! I only try to write things that I’m very excited about or never want to forget, so I won’t arbitrarily aim for more posts. However, I would like to keep this up! It’s Coming Together Only sitting back and thinking things through I realised that a lot has happened in 2019. I want more of it. This year I’m going to be more visible with my work. And much more daring. After 2019, I know I can complete whatever I put my mind to. I also know how to complete things. In 2020, it’s time for me to innovate. Happy hacking everyone! And a happy new year!"
