title = "Advocacy News  | Maryland State Bar Association"
full_description = "Advocacy Advocacy News Maryland Attorneys Convene in Annapolis for MSBA Day Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer February 18, 2025As the leading voice of the legal profession in Maryland, MSBA continues to advocate for policies that protect attorneys, judges, and the broader legal system while ensuring access to justice for all Marylanders. MSBA Sponsors ABA Resolution on Judicial Security Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer February 10, 2025Recently, MSBA sponsoring Resolution 201 before the American Bar Association (ABA) House of Delegates, sponsoring Resolution 201, which encourages enhanced judicial security. Attention Maryland Attorneys - MSBA Day 2025 is Fast Approaching! Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer January 22, 2025MSBA Day is a powerful opportunity to unite as a profession, amplify our voices, and influence policies that shape the future of Maryland’s legal system. Mark Your Calendars: MSBA Day 2025 is Around the Corner! Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer January 6, 2025Attention Maryland attorneys: the 6th Annual MSBA Day is fast approaching! Scheduled for Tuesday, February 11, 2025, in Annapolis, this highly anticipated event offers legal professionals invaluable opportunities. MSBA Informs Practitioners About Maryland’s Expanded Voir Dire Pilot Program Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer December 17, 2024On December 16, 2024, MSBA hosted a virtual program for practitioners to learn about the Pilot Program and share questions and feedback. MSBA Provides Resources to Prepare Profession for Maryland’s Pilot Program for Expanded Voir Dire Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer December 17, 2024The Maryland Judiciary is implementing a Pilot Program for Expanded Voir Dire in January 2025, pursuant to Rule 16-310 as part of an overall review and reform of the jury selection process. Join MSBA in Annapolis for MSBA Day! Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer December 9, 2024MSBA Day is your opportunity to be a part of the change. Your presence makes a difference, demonstrating the collective strength and commitment of the legal community. MSBA Welcomes Maryland's Newest Attorneys Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer December 5, 2024The MSBA congratulates and welcomes all of Maryland’s newest attorneys, and wishes them success as they embark on their careers! Make the Voice of the Legal Profession Heard at Our 6th Annual MSBA Day Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer November 13, 2024MSBA Day is an incredible opportunity for Maryland attorneys to gather, connect, and bring their voices directly to Maryland’s elected officials, strengthening the legal profession’s impact and influence in the state. Maryland Laws Going Into Effect on October 1, 2024 Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer September 30, 2024On October 1, 2024, several new laws passed during the 2024 Maryland General Assembly session take effect in Maryland, covering a wide range of areas. Jury Selection Expansion Update: Upcoming Open Meeting and Member Feedback Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer August 27, 2024The Supreme Court of Maryland is considering an expansion of jury selection at its September 12th Open Meeting. A2J Dispatch – July 2024 Issue Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer July 23, 2024In this month's dispatch, we celebrate Reena K. Shah, Executive Director of the Maryland Access to Justice Commission, being named an Influential Marylander in the Law category by The Daily Record. Lawsuit Seeks to Hold Maryland Accountable for Nursing Home Neglect Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer July 2, 2024The lawsuit, which alleges violations of the Americans with Disabilities Act (ADA) and Section 504 of the Rehabilitation Act, aims to compel the state agency to enforce accountability among nursing facilities. A2J Dispatch – June 2024 Issue Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer June 25, 2024In this month’s issue of the A2JC Dispatch, we bring you the latest from the A2J Commission, including highlights from the recent Pizza Party Fundraiser at the MSBA Legal Summit. “He or She” after HB 1397 Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer June 14, 2024“He or she” phrase reflects the best of intentions, to include everyone, not just men, when legal opinions discuss the hypothetical person. The unintentional effect is to exclude those whose gender identity does not fit the “he or she” binary. Rules Committee Seeks Comments by June 20th Regarding Potential Peremptory Challenge Expansion Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer June 12, 2024The Supreme Court of Maryland’s Standing Committee on Rules of Practice and Procedure has asked members of the Bar to share feedback regarding a possible expansion of peremptory challenges in Maryland. A2J Dispatch – May 2024 Issue Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer May 28, 2024In this month’s issue of the A2JC Dispatch, we address A2JC’s shocking statistics, and highlight A2JC’s Partners for Justice Conference and Race Equity Toolkit. MSBA to Present the Sodaro Award Posthumously to Judge Andrew F. Wilkinson Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer May 28, 2024MSBA to present the Sodaro Award posthumously to Judge Andrew F. Wilkinson during the Annual Meeting. Panel to Discuss Judicial Security Bill & Other Legislation at Senate Plenary Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer May 25, 2024A panel of Maryland senators will discuss the Judicial Security Bill and other measures passed during the 2024 session. A2J Dispatch – April 2024 Issue Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer April 25, 2024In this month’s issue, we celebrate our successful advocacy efforts for HB693, resulting in $15M in additional civil legal aid funding and highlight several priority bills supported by the Public Interest Law Committee that passed. MSBA's 2024 Legislative Wins Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer April 19, 2024MSBA’s 2024 Legislative Wins Include Increased Security, Defeating a Tax on Legal Services, and Securing Civil Legal Aid Funds MCLE Update: Supreme Court of Maryland Holds Open Meeting, Approves Further Evaluation Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer March 28, 2024The Supreme Court of Maryland held an Open Meeting to discuss and vote on the threshold question of whether Maryland should continue as a non-mandatory CLE jurisdiction or proceed with exploring the adoption of mandatory CLE. Calling Lawyers to the Legislature Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer March 21, 2024Maryland Delegate C.T. Wilson is passionate about urging fellow attorneys to step up and become part of the legislative process. MSBA Highlights Its Legislative Priorities During MSBA Day Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer February 16, 2024MSBA prides itself on being the voice of the legal profession in Maryland and continuously works to protect the rights and interests of attorneys, judges, paralegals, law students, and the profession as a whole. MSBA Advocacy Update: Juvenile Justice Legislation Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer January 29, 2024In the 2024 Legislative Session, both Republican and Democratic legislators have introduced several pieces of legislation related to juvenile justice and public safety. The bills follow passage of the 2022 Juvenile Justice Reform Act. Next"
