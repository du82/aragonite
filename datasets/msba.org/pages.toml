["https://msba.org/site/content/Members/MSBA-Attorney-Security-Pass.aspx"]
title = "MSBA Attorney Security Pass  | Maryland State Bar Association"
full_description = '''For Members MSBA Attorney Security Pass .innerBannerArea { background-position: 100% 35%; } .InputSmall.Quantity { display: none; } We’ve Upgraded! The Maryland State Bar Association Courthouse Identification Pass is now the MSBA Attorney Security Pass. The new Attorney Security Pass has been enhanced to include added security features and be more durable. If you have an existing, yellow Courthouse Identification Pass, it is still valid through the expiration date on the card. You will be issued the new card when you renew your pass. Purchase Card MSBA Attorney Security Pass Your price: 75.00 Must be between 0 and 1000000. Quantity: Quantity is required. Quantity must be between 0 and 1000000. jQuery("#ctl01_TemplateBody_WebPartManager1_gwpciGeneralProductDisplay_ciGeneralProductDisplay_DynamicProductDisplay_InventoryDetailsSection").on("show.bs.collapse", function () { var link = this.previousElementSibling; link.innerHTML = link.dataset["hidetext"] + '<span class="caret-up"></span>'; }); jQuery("#ctl01_TemplateBody_WebPartManager1_gwpciGeneralProductDisplay_ciGeneralProductDisplay_DynamicProductDisplay_InventoryDetailsSection").on("hide.bs.collapse", function () { var link = this.previousElementSibling; link.innerHTML = link.dataset["showtext"] + '<span class="caret"></span>'; }); Eligibility: The Maryland State Bar Association Attorney Security Pass is available to any attorney who: has been admitted to practice law in this state, is currently a member of the bar in good standing, and who is currently certified by the Supreme Court of Maryland as an active practitioner (or exempt inactive/retired practitioner), pursuant to the attorney’s compliance with the rules of the Clients’ Protection Fund of the Bar of Maryland (CPF), including payment of the annual assessment fee required by the CPF. Terms & Conditions: Holders of an Attorney Security Pass: May not alter, reproduce, lend, transfer or otherwise distribute the pass to any other person. Must always present my badge for inspection by Security Officers when entering Court Buildings and will comply with federal, state & local laws as well as courthouse security procedures, as they are intended to protect court personnel and the public. Are required to abide by all security measures set by the various courthouses and institutions throughout Maryland and may not carry weapons or dangerous materials of any kind into Court Buildings or Institutions. Must immediately contact the MSBA and the issuing Sheriff’s Department if the pass is lost or stolen. Must surrender the pass if they no longer meet the eligibility requirements outlined above or upon expiration of the pass. Application Instructions: Login to your MSBA account. If you are applying on behalf of an attorney, you must login to their account using their credentials. Under Purchase Card, click “Add to Cart”. Click “View Cart” and proceed to complete your purchase. Once the order is complete, follow the link to Complete Your Security Pass Application on the order confirmation screen. You can also find the link included in the confirmation email. Please take note of your Order Number as it is required to submit the application. The application must be submitted to complete the application process. Attorney Security Pass Fee: MSBA Members: $25.00 Non-members: $75.00 Pickup Information: The estimated shipping time is 7-10 business days after online submission. Cards are not shipped directly to attorneys. Applicants may request to pick up their card from one of the available pickup locations listed below. Applicants must contact the designated pickup location directly to confirm availability of the card and coordinate a pickup time. Attorneys must present a valid photo ID to pick up the pass. The card cannot be picked up by another person on the attorney’s behalf. Pickup Locations Allegany County Sheriff's Office 695 Kelly RdCumberland, MD 21502-2878 (301) 777-1585 Anne Arundel County Bar Association Circuit Court Law Library8 Church CirAnnapolis, MD 21401 (410) 222-1387 Baltimore County Sheriff's Office County Courts Building401 Bosley AveTowson, MD 21204 (410) 887-3151 Calvert County Sheriff's Office 30 Church StreetPrince Frederick, MD 20678 (410) 535-2800 Caroline County Sheriff’s Office 9305 Double Hills RdDenton, MD 21629-3418 (410) 479-4110 Carroll County Sheriff's Office 100 N Court StWestminster, MD 21157 (410) 386-2900 Cecil County Sheriff's Office 107 Chesapeake BlvdSte 112Elkton, MD 21921-6390 (410) 392-2107 Dorchester County Sheriff's Office 829 Fieldcrest RdCambridge, MD 21613-9455 (410) 228-4141 Garrett County Sheriff's Office 311 E. Adler StreetOakland, MD 21550 (301) 334-1909 Howard County Sheriff's Office 9250 Judicial WayEllicott City, MD 21043-6163 (410) 313-4150 Kent County Sheriff's Office 104 Vickers Drive- Unit BChestertown, MD 21620 (410) 778-2279 Montgomery County Sheriff's Office 50 Maryland Avenue, Room T8Rockville, MD 20850 (240) 777-7000 Prince George's County Courthouse 14735 Main StreetD1030 Upper Marlboro, MD 20772 (301) 780-2801 Queen Anne's County Sheriff's Office 505 Railroad AveCentreville, MD 21617 (410) 758-0770 Talbot County Sheriff's Office 28712 Glebe RdSte 1Easton, MD 21601-7435 (410) 822-1020 Washington County Sheriff's Office 24 Summit AveHagerstown, MD 21740 (240) 313-2530 Wicomico County Sheriff's Office 401 Naylor Mill RdSalisbury, MD 21801-1191 (667) 281-6010 var contentItemId = '#1455b19407'; var resultsPerPage = '20'; var hidePageNumbers = 'True'; var displayCards = 'False'; var pageElement = 'section'; jQuery(contentItemId).simplePaginate({ paginateElement: pageElement, elementsPerPage: resultsPerPage, firstButton: false, lastButton: false, prevButtonText: "&laquo;", nextButtonText: "&raquo;", hidePaginationNumbers: hidePageNumbers.toLowerCase().trim(), uniqueId: '1455b19407', pagerLocation: 'justify-content-center' });'''
