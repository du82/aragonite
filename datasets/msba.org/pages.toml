["https://msba.org/site/content/News-and-Publications/News/General-News/MSBA-Leads-in-Advocating-for-Security.aspx"]
title = "MSBA Leads the Way in Advocating for  Judicial and Attorney Security  | Maryland State Bar Association"
description = "In the wake of Judge Andrew F. Wilkinson’s tragic murder in October 2023, MSBA has taken a proactive stance in championing judicial security."
full_description = "July 30, 2024 - by Raphael J. Santini, MSBA President MSBA Leads the Way in Advocating for Judicial and Attorney Security In the wake of Judge Andrew F. Wilkinson’s tragic murder in October 2023, the Maryland State Bar Association has taken a proactive stance in championing judicial security. Recognizing the crucial importance of this issue to the entire legal profession, MSBA’s Board of Governors voted to prioritize judicial security and the association swiftly published an advocacy statement emphasizing the need to enhance judicial security and preserve the rule of law. Building on this initial response, I co-authored an opinion piece published in The Baltimore Sun on December 19, 2023. Collaborating with the Federal Bar Association, I articulated MSBA’s position that judicial security is paramount for ensuring the safety of judges and their families, maintaining judicial integrity and independence, and allowing judges to make impartial decisions without fear of threats or violence. MSBA’s advocacy efforts culminated in their active support for Senate Bill 575 (SB 575), also known as the Judge Andrew F. Wilkinson Judicial Security Act, during the 2024 legislative session. Working closely with the Maryland Judiciary, MSBA lobbied for the bill’s passage, provided testimony, and collaborated with legislators. The bill aimed to enhance protections for judges and their families by allowing them to request the removal of their personal information from the Internet and social media, and by establishing the Judicial Address Confidentiality Program. On January 30, 2024, MSBA formally issued a position statement supporting SB 575. They also successfully advocated inclusion in a legislative Task Force to Ensure the Safety of Judicial Facilities, to add the voices of MSBA practitioners, judges, and legal professionals to the group. This task force, comprised of various judicial and law enforcement officials, was established to address security concerns in judicial environments and identify minimum requirements for courthouse safety. MSBA’s efforts bore fruit when, on March 8, 2024, my predecessor, Jason DeLoach testified in support of SB 575 and corresponding House bill HB 664. SB 575 received near-unanimous support in both the House and Senate, culminating in Governor Wes Moore signing it into law on May 9, 2024. To keep its members informed and engaged, MSBA continues to prioritize judicial security in its agenda. It has organized discussions and panels to provide insight into the bill, compare Maryland’s legislation with that of other states, and consider future related legislation. One such discussion was held during the MSBA’s 2024 Legal Summit in Ocean City, featuring Senator Will Smith, Chair of the Judicial Proceedings Committee and one of the sponsors of SB 575. MSBA has also played a crucial role in mobilizing its members to understand the significance of the legislation and the newly formed Maryland Judicial Security Task Force. Through various communication channels, including blogs, emails, and special sessions at the legal summit, the MSBA has kept its members updated on the progress and implications of the judicial security bill and the task force’s objectives. While the passage of the Judge Andrew F. Wilkinson Judicial Security Act marks a significant milestone, MSBA recognizes that there is more work to be done. MSBA’s ongoing commitment to judicial security is exemplified by its representation on the Judicial Security Task Force. I am privileged to serve as MSBA’s representative on this crucial body, which is just beginning to work on new initiatives for judicial and attorney security. As the task force embarks on its mission to safeguard the judiciary and legal professionals, MSBA remains at the forefront of these efforts, continuing to advocate for legislation that protects the legal profession, preserves the integrity of the judicial system, and ensures access to justice for all Marylanders. If you would like to provide feedback or ideas for the task force, please email [email protected]. Share this page Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer"
year_published = 2025
clearnet = "https://msba.org/site/content/News-and-Publications/News/General-News/MSBA-Leads-in-Advocating-for-Security.aspx"
