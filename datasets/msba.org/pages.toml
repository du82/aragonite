description = "Mental Health Emergency Resources"
full_description = 'May 24, 2024 - by Lisa Caplan Mental Health Emergency Resources Emergency: 911 National Domestic Violence Hotline: 1- 800-799-7233 National Suicide Prevention Lifeline: 1-800-273-TALK (8255) National Hopeline Network: 1-800-SUICIDE (800-784-2433) Crisis Text Line: Text "DESERVE" TO 741-741 Lifeline Crisis Chat (Online live messaging): https://suicidepreventionlifeline.org/chat/ Self-Harm Hotline: 1-800-DONT CUT (1-800-366-8288) Essential local and community services: 211, https://www.211.org/ Planned Parenthood Hotline: 1-800-230-PLAN (7526) American Association of Poison Control Centers: 1-800-222-1222 National Council on Alcoholism & Drug Dependency Hope Line: 1-800-622-2255 National Crisis Line - Anorexia and Bulimia: 1-800-233-4357 GLBT Hotline: 1-888-843-4564 TREVOR Crisis Hotline: 1-866-488-7386 -Trevor Project Hosts Crisis Intervention & Suicide Prevention Services For Youth. Safe, Confidential Lifeline for LGBTQ Young People AIDS Crisis Line: 1-800-221-7044 Veterans Crisis Line: https://www.veteranscrisisline.net TransLifeline: https://www.translifeline.org - 877-565-8860 Suicide Prevention Wiki: http://suicideprevention.wikia.com The Lawyer Assistance Program(LAP) has Assisted Thousands of Maryland Lawyers. For Confidential Assistance Call 888.388.5459. LAP provides free, confidential assistance to all Maryland lawyers, judges, law school students, and support staff by offering assessment, referral, short-term counseling, and continued support to ensure long term success. If you are concerned about another lawyer you can make an anonymous referral to LAP by contacting Lisa Caplan at her direct line 443-703-3042 or at [email protected]. We offer financial assistance for Mental Health and Addiction Treatment. Share this page Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer'
