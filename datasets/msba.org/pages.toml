title = "Advocacy  | Maryland State Bar Association"
full_description = '''Advocacy Leading and protecting the legal profession in Annapolis and beyond For more than a century, the MSBA has been the voice of lawyers across the state, from nearly every practice area, career stage, and demographic. The MSBA actively shapes practice-based legislation and policy to realize the best possible outcomes for Maryland’s lawyers and legal professionals. We do so by leveraging the networks, skills, and knowledge of our members. MSBA public advocacy takes many forms, including testifying before state legislative committees, drafting bills and amendments, following the proceedings of the Maryland Supreme Court’s Rules Committee and representing the interests of the profession, filing amicus curiae briefs, meeting with Executive Branch and Judiciary officials, and more. Your voice and expertise matter, allowing us to conduct the most effective advocacy as we work together to educate and inform our representatives. Oppose Any Tax On Legal Services: As the Legislature considers tax and budget proposals that could negatively impact the profession, including a tax on legal services, your voice is needed to argue against such an expansion that would negatively impact our businesses, firm competitiveness, and Marylanders’ access to justice. Support Judicial and Attorney Security: MSBA remains committed to the security for our profession by modernizing court structures and security, protecting personal data, and preventing future harm. Ask your legislators to vote favorably on HB 789/SB 621 to implement minimum adequate security standards for Maryland courts. Support Permanent Funding for ACE Law: MSBA joins the Maryland Access to Justice Commission to support permanent funding for the Access to Counsel in Evictions Law, scheduled to sunset in 2027. Ask legislators to permanently fund the ACE law by voting favorably on HB 103/SB 154. For more information, view MSBA’s Advocacy Program. Contact Us: [email protected] 2025 Section Reports - Bi