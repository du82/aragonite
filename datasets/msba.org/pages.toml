["https://msba.org/site/content/News-and-Publications/News/General-News/MSBA-Sponsors-ABA-Resolution-on-Judicial-Security.aspx"]
title = "MSBA Sponsors ABA Resolution on Judicial Security  | Maryland State Bar Association"
description = "Recently, MSBA sponsoring Resolution 201 before the American Bar Association (ABA) House of Delegates, sponsoring Resolution 201, which encourages enhanced judicial security."
full_description = "February 10, 2025 - by MSBA Staff MSBA Sponsors ABA Resolution on Judicial Security In recent years, MSBA has focused its advocacy efforts on enhanced judicial security and preserving the independence of our judiciary, one of the three cornerstones of our democracy. Recently, MSBA advocated on these before the American Bar Association (ABA) House of Delegates, sponsoring Resolution 201, which encourages state, local, territorial, tribal, and specialty bar associations to adopt policies to prioritize enhancing judicial security in their jurisdiction. Resolution 201 also urges federal, state, local, territorial and tribal governments to create identify minimum requirements for courthouse safety, develop legislative proposals to ensure that the minimum requirements are met, and identify physical securities deficiencies that currently exist in courthouses and develop a plan to address these deficiencies MSBA President Raphael Santini moved that the House of Delegates consider Resolution 201. Santini stated that the judiciary is the only means that citizens can use to address grievances, but unfortunately, in our current times, there have been attacks on the judiciary, personnel, and actual courthouses. These attacks, including the murder of Maryland Judge Andrew Wilkinson, were delineated in Chief Justice John Roberts’ 2024 Year End Report on the Federal Judiciary. Santini noted that Maryland subsequently passed the Judicial Security Act which, in part, created a Task Force to identify minimum requirements for courthouse safety, develop a legislative proposal to ensure that the requirements can be met, and identify physical security deficiencies that currently exist in courthouses and develop a plan to address these deficiencies. He explained that Resolution 201 asked the ABA House of Delegates to request all state legislatures to undergo an analysis of their respective court systems and address any security weakness. Honorable Sidney Butcher and Honorable Pamila Brown urged the ABA House of Delegates to support the resolution as well. MSBA is proud to say that the ABA House of Delegates adopted Resolution 201. This achievement demonstrates MSBA’s unwavering commitment to safeguarding the judiciary and ensuring that courts remain secure, independent, and accessible to all. MSBA will continue to advocate for policies that protect judicial integrity and enhance security measures nationwide. Share this page Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer"
year_published = 2025
