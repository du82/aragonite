["https://msba.org/site/content/News-and-Publications/News/General-News/Copyright_Triumphs_Over_AI_Training_Court_Decision_Sends_Strong_Message_to_Tech_Industry.aspx"]
title = "Copyright Triumphs Over AI Training: Court Decision Sends Strong Message to Tech Industry  | Maryland State Bar Association"
description = "The ramifications of the Court’s opinion in Thomson v. Reuters will be studied intently by the broader legal and generative artificial intelligence communities."
full_description = "February 25, 2025 - by Pamela Langham Copyright Triumphs Over AI Training: Court Decision Sends Strong Message to Tech Industry Thomson Reuters Enter. Ctr. GmbH v. Ross Intel, Inc., ___ F.Supp.3d ___, 2025 WL 458520, 1:20-cv-00613-SB (D. Del. Feb. 11, 2025). The Thomson Reuters v. Ross case addresses allegations of copyright infringement and the affirmative defense of fair use related to artificial intelligence training (not specifically generative artificial intelligence). This ruling comes amid numerous lawsuits filed by authors and artists claiming their copyrighted works were used without permission to train generative artificial intelligence tools. The Court’s revised 2023 partial summary judgment opinion issued on February 11, 2025, may be interpreted as a re-affirmation of copyright holders’ rights, and a rejection of the fair use defense, establishing a precedent for future cases. Courts across the country addressing copyright infringement claims involving generative artificial intelligence (GAI) technologies will likely reference this ruling to evaluate the merits of similar plaintiff claims. The Court granted partial summary judgment in favor of Thomson Reuters on direct copyright infringement and related defenses, including fair use. The Court found that Ross had infringed on 2,243 Westlaw-created headnotes, and rejected Ross’ defenses of innocent infringement, copyright misuse, merger, and scenes a faire. The Court denied Ross’ motions for summary judgment on direct copyright infringement and the affirmative defense of fair use. The remaining issue of whether some of Thomson Reuters’ copyrights have expired will be decided by a jury. This article summarizes the opinion of United States District Court Judge Sephanos Bibas’ revised 2023 summary judgment. Facts Westlaw, owned by Thomas Reuters, requires a subscription fee to access its database. Westlaw created and developed headnotes that have become invaluable to legal practitioners. The platform organizes its information using a Key Numbering System and holds copyrights for all copyrightable material. Ross, a competitor of Westlaw, developed a legal research engine that utilizes artificial intelligence, not GAI. Ross asked Thomson Reuters for a license to use its content and database including the headnotes to train a non-generative artificial intelligence (AI) tool it was developing. Thomson Reuters declined. To train its AI tool, Ross partnered with LegalEase to obtain training data called “Bulk Memos.” These memos are collections of legal questions with correct and incorrect answers, created by lawyers. LegalEase provided guidelines to the lawyers used for the training with instructions on how to formulate the questions using Westlaw headnotes, emphasizing they should not simply copy and paste the headnotes. LegalEase then sold approximately 25,000 Bulk Memos to Ross, which Ross used to develop its AI search tool. Ross’s competing product was developed using Bulk Memos derived from Westlaw’s headnotes. When Thomson Reuters discovered this, they sued Ross for copyright infringement. Procedure In 2023, the Court denied almost all of Thomas Reuter’s motions for summary judgment regarding Ross’ alleged copyright infringement and Ross’ attempt to assert an affirmative defense of fair use. The trial was set for August 2024. However, the Court continued the trial based on the judge’s further review of the case materials. Afterward, the Court requested the parties renew their summary judgment motions, which led to the updated and revised opinion on February 11, 2025. The Court Granted Partial Summary Judgment to Thomas Reuters on Direct Copyright Infringement The Court framed the issue as “whether the LegalEase Bulk Memo questions copied Thomson Reuters’ headnotes or were instead taken from uncopyrightable judicial opinions.” The Court held that “Ross infringed 2,243 headnotes.” And therefore concluded the remaining issue is whether Thomson Reuters’ copyrights expired. The Court also held “Ross’ innocent infringement, copyright misuse, merger, and scenes a faire defenses all fail.” Scenes a faire is a French term translated to “scenes must be done.” For purposes of this case, it refers to a common denominator in certain types of creative work; and, therefore not protected by copyright. The Court used the example of a damsel in distress in a romance novel to illustrate the concept of scenes a faire. To demonstrate that Ross directly infringed on its copyrights, Thomas Reuters was required to satisfy the applicable legal standard: “(1) it owned a valid copyright; and (2) Ross copied protectable elements of the copyrighted work,” citing Feist Publications, Inc. v. Rural Tel. Serv. Co., 499 U.S. 340, 345, 111 S.Ct 1282, 113 L.Ed.2d 358 (1991). The second prong requires showing that “. . .Ross actually copied the work and that. . .its copy was substantially similar to the work,” citing Dam Things from Den. v. Russ Berrie & Co., 290 F.3d 548, 561-62 (3d Cir. 2002). The U.S. Constitution limits copyright protection to original works. The Court found that Thomas Reuters’ headnotes are original because they “introduce creativity by distilling, synthesizing, or explaining part of an opinion.” The Court explained its decision by comparing the drafting of a headnote for a judicial opinion to a sculptor cutting away at a piece of raw marble to create a statue, making decisions along the way as to what to leave and what to chip away. Second, the Court held that Westlaw’s Key Number System is also original. Thus, the Court reached its conclusion to grant summary judgment for Thomson Reuters on whether the headnotes and the Key Number System are original enough to prevent Ross from rebutting any presumption of validity. Next, the Court addressed whether there was a “copying [by Ross] of constituent elements of the works that are original.” There are two separate batches of headnotes that Thomson Reuters moved for summary judgment: one batch contains 5,367 headnotes and the second contains 2,830 headnotes. The Court ruled the legal issues surrounding the first batch will be sent to the jury. As to the second batch, the Court reasoned that 2,243 headnotes were copied to the extent no reasonable jury could find otherwise, and granted summary judgment to Thomson Reuters on those. Ross’ Defenses Fail The Court rejected all of Ross’ defenses to copyright infringement finding specifically that the innocent infringement and copyright misuse does not apply in this case. The Court also rejected Ross’s merger defense and scenes a faire defense. As to Ross’ fair use defense, the Court cited four factors that it must consider to evaluate Ross’ fair use defense: “(1) the uses purpose and character, including whether it is commercial or nonprofit; (2) the copyrighted work’s nature; (3) how much of the work was used and how substantial a part of it was relative to the copyrighted work’s whole; and (4) how Ross’s use affected the copyrighted work’s value or potential market. 17 U.S.C. § 107(1)-(4).” Although fair use can be a question of law and fact; here, the Court said it was a legal question for the court, not the jury. Ross conceded that their use was commercial. The Court determined that Ross’ use was not transformative - it did not have a “further purpose or different character” - because it was created to compete with Westlaw. The Court ruled the creativity of the headnotes is not as creative as an artist's original work and Ross’ competitive product is not a headnote, instead, it is a summary of a judicial opinion. However, the Court stated that prong four of the fair use analysis “is undoubtedly the single most important element of fair use,” citing Harper & Row, Publishers, Inc. v. Nation Enters., 471 U.S. 539, 566, 105 S.Ct. 2218 (1985). In the 2023 summary judgment opinion, the Court reserved the fair use analysis to the jury. However, the Court in its revised opinion noted there is no doubt that Ross intended to compete with Westlaw by creating an alternative product. In addition, Ross had not produced enough evidence to demonstrate Westlaw’s commercial market would not be affected by the introduction of Ross’ alternative product. Weighing all the prongs and facts in support of each one, and taking into consideration that prong four matters more than the others, the Court specifically rejected Ross’ fair use affirmative defense. In summary, the Court: Granted partial summary judgment in favor of Thomson Reuters regarding direct copyright infringement for 2,243 headnotes. Whether the copyrights on those headnotes have expired is a question for the jury. Granted Thomson Reuters’ summary judgment against Ross’s defenses of innocent infringement, copyright misuse, merger, scenes a faire, and fair use. Denied Ross’ Motion for Summary Judgment on direct copyright infringement and fair use. Revised all parts of the 2023 opinion that directly conflict with the revised opinion. Leaves “undisturbed the parts of” the Court’s “prior opinion not addressed in this” opinion. Conclusion Although revised summary judgment opinions are not unheard of, they are infrequent in the legal realm. In the opening paragraph of the Court’s revised 2023 summary judgment opinion and order in Thomson Reuters v. Ross, Judge Bibas stated, “a smart man knows when he is right; a wise man knows when he is wrong. Wisdom does not always find me, so I try to embrace it when it does –even if it comes late, as it did here.” The ramifications of the Court’s revised opinion on Ross’ attempt to use the fair use affirmative defense will be studied intently by the broader legal and GAI communities. The ruling strengthens Thomson Reuters’ control over its copyrighted content, including headnotes and the Key Number System. The broader effect of the opinion is yet to be seen. However, at least for the short term, the decision establishes a precedent that utilizing copyrighted legal content to train AI and GAI tools may not be deemed fair use, particularly when the use is commercial and non-transformative. It underscores the necessity of acquiring proper licenses for copyrighted materials and may influence how other companies develop GAI technologies. Share this page Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer"
