["https://msba.org/site/content/News-and-Publications/News/General-News/Members-on-the-Move-March-2025.aspx"]
title = "Members on the Move: March 2025  | Maryland State Bar Association"
description = "MSBA is proud to highlight the recent achievements, career moves, and impact members make within the legal profession. Please join us in congratulating the following members on their recent moves."
full_description = "March 3, 2025 - by MSBA Staff Members on the Move: March 2025 As the home of Maryland’s legal profession, the Maryland State Bar Association celebrates the accomplishments of all of its members. MSBA is proud to highlight the recent achievements, career moves, and impact members make within the legal profession. Please join us in congratulating the following members on their recent moves. Rebeka Bautista started a new position as Commissioner with the Latina Commission at Hispanic National Bar Association. Anna A. Mahaney, a real estate finance partner at Ballard Spahr, is the new office managing partner of the firm’s Baltimore office. Anna practices general real estate law with an emphasis on representing mortgage lenders in commercial real estate financing transactions across the country. She also co-leads Ballard Spahr’s national Housing Finance Group and serves on the firm’s Senior Leadership Team. A fellow of both the American College of Real Estate Lawyers and the American College of Mortgage Attorneys, Anna has represented real estate lenders, owners, and developers in hundreds of transactions. Anna also devotes herself to pro bono and public service efforts. These include representing a local nonprofit developer in rehabilitating an affordable rental housing development dedicated in part to recovering addicts, representing a faith-based nonprofit in acquiring property for a homeless shelter for women and children and representing immigrant children in obtaining permanent resident status. Her community and civic leadership activities include serving on the Women’s Advisory Board of the Greater Baltimore Committee. Peter Randolph has been elected as a shareholder of Miller, Miller & Canby. As head of the firm’s Business and Tax practice group, Peter focuses his multijurisdictional practice on taxation, business, and probate and trust administration. Peter advises small businesses on partnership and corporate taxation, corporate governance, buy-sell agreements, reclassification, restructuring and succession planning. He assists entrepreneurs and startups on business and taxation issues, including choice of entity, Qualified Small Business Stock, funding through equity and non-equity participation of investors, and compliance. He also acts as outside general counsel to a number of businesses. Peter regularly advises executors, trustees and beneficiaries in the areas of probate and trust administration, including pre and post-mortem planning, and estate, gift, and fiduciary income tax. He works with high net worth individuals and families, producing comprehensive estate plans to maximize the client’s family, business, and financial security. Jessica M. Gorsky joined Gordon Feinblatt LLC as a Member of the firm’s Trusts & Estates practice group. She provides comprehensive guidance on private wealth management and tax matters related to estates and trusts. She advises clients on estate and trust planning, estate and trust administration and taxation, including estate, gift, and income tax strategies, business succession planning, charitable giving, guardianships, elder law, and special needs planning. Jessica helps clients navigate complex legal and financial decisions to protect their assets and secure their legacies. Jeffrey M. Saltman joins Cole Schotz P.C. as a member of the firm’s Litigation and Intellectual Property departments. Mr. Saltman will be based out of the firm’s Baltimore office and work from Washington D.C. Working closely with in-house counsel and executives, Mr. Saltman is a skilled trial lawyer who develops and executes strategies to help his clients navigate intellectual property and commercial litigation matters. He has deep experience managing all aspects of litigation from the initial filing through trial and has helped secure six successful jury verdicts in federal court. “Jeff has a track record of successfully securing significant trial victories for his clients,” said Gary Sorden, Co-Chair of the Intellectual Property Department. “His experience and skillset will be a tremendous asset to our colleagues and clients nationwide.” Share this page Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer"
