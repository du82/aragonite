full_description = "For Members Practice Areas & Sections Connecting MSBA members to each other and the profession. Find your Community. Find your Section. Explore each of our sections and affinity groups below, and contact the section’s leadership through their pages to learn more about getting involved. Two sections are included in your MSBA membership and all sections are included in our law student membership. Sections create connections between MSBA members within shared practice areas across the legal profession. When you join the MSBA, you’ll also have the opportunity to register for any of our 22 unique practice-driven sections, and 3 specialized affinity groups. These “sections” are where MSBA members do the work: share news and resources, learn from each other via regular events and CLE programming, and actively engage in the profession through discussion groups and newsletters. Administrative Law Section Agriculture Law Section Alternative Dispute Resolution Section Animal Law Section Bench-Bar Section Business Law Section Construction Law Section Consumer Bankruptcy Section Criminal Law & Practice Section Elder Law & Disability Rights Section Environment & Energy Law Section Estate & Trust Law Section Family Law Section Health Law Section Immigration Law Section Intellectual Property Law Section Labor & Employment Law Section Litigation Law Section Negligence, Insurance & Workers' Compensation Law Section Public Interest Law Committee Real Property Law Section Solo & Small Firm Practice Section State and Local Government Law Section Taxation Law Section Veterans' Affairs & Military Law Section Young Lawyers Law Section Questions? Contact MSBA staff to learn more. Angela Munro Associate Director of Member Engagement [email protected] 410-685-7878 x3016"
