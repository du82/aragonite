["https://msba.org/site/content/News-and-Publications/News/General-News/Articles-Launching-Unfair-Personal-Attacks-Against-Maryland-Judiciary-Must-Stop.aspx"]
title = "Articles Launching Unfair Personal Attacks Against Maryland Judiciary Must Stop  | Maryland State Bar Association"
description = "In an era where Judges are facing rising threats of violence and being murdered in their driveways, over the past week, Chris Papst of Fox 45 News has published several articles with ominous titles about Judge Charles Blomquist and rulings in cases."
full_description = "January 28, 2025 - by Raphael Santini, President, Maryland State Bar Association Articles Launching Unfair Personal Attacks Against Maryland Judiciary Must Stop In an era where Judges are facing rising threats of violence and being murdered in their driveways, over the past week, Chris Papst of Fox 45 news has published several articles with ominous titles about Judge Charles Blomquist and rulings in cases involving child offenders. Notably, cases that fall under the jurisdiction of Maryland’s Juvenile Justice System are strictly confidential, and judges overseeing such cases are prohibited from commenting publicly. Essentially, Papst’s articles launch an unjustified personal attack against a sitting judge, who, by law, is not allowed to respond. Papst’s articles also fail to provide context about the juvenile justice system in Maryland (JJS). In cases involving a child offender, the JJS is designed to balance public safety and the protection of the community against accountability of the child, as well as the “competency and character development to assist the child in becoming a responsible and productive member of society.” Md. Cts & Jud. Proc., 3-8A-02(a)(1). Given the confidential nature of JJS cases, Papst cannot fully assess the basis for Judge Blomquist's decisions and how they achieve the statutorily required goals. Instead, Papst provides a one-sided opinion without full context. In doing so, Papst is not only unfairly attacking Judge Blomquist but potentially inciting threats and violence against the judiciary, as well as undermining the Juvenile Justice System and the rule of law. Like all Judges appointed in Maryland, Judge Blomquist was thoroughly vetted by Bar Associations and local Judicial Commissions and carefully selected by then-Governor Larry Hogan. As Papst correctly points out, Judge Blomquist earned his appointment, given his 20+ years of experience as a prosecutor in Baltimore City, not to mention his service in the Maryland National Guard. After judges are appointed, several oversight mechanisms are in place to ensure judges adhere to the law. One such example is the Commission on Judicial Disabilities (the “Commission”), an independent body with the power to investigate complaints against Maryland judges and justices. To the extent there is a legitimate complaint involving a judicial ruling, the Commission has the authority to investigate, conduct hearings, and make recommendations, up to and including removing a judge. Recklessly accusing judges of misconduct, as Papst has done here, unnecessarily foments a dangerous increase in threats and violence against the judiciary. The Maryland State Bar Association (MSBA) urges Papst to retract his articles and provide more context and information to his readers about the objectives of the JJS and the confidential nature of such proceedings. Papst Articles https://foxbaltimore.com/news/project-baltimore/maryland-courts-decline-comment-after-ruling-allows-juvenile-rapist-to-attend-school-johnny-ray-salling-charles-blomquist-carey-wright-baltimore-city-schools-patterson-high-school https://foxbaltimore.com/news/project-baltimore/juvenile-rapist-allowed-to-return-to-maryland-school-following-judges-ruling-baltimore-judge-charles-blomquist-harford-county-baltimore-county-patterson-high-school https://foxbaltimore.com/news/project-baltimore/who-is-the-baltimore-judge-whos-ruling-allows-a-juvenile-rapist-to-return-to-school-charles-blomquist-tristan-jackson-larry-hogan Share this page Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer"
year_published = 2025
