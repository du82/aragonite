title = "Engage: Monthly Women’s Support Group  | Maryland State Bar Association"
description = "I’m Lisa Caplan, the Director of the MSBA’s Lawyer Assistance Program. Our Women’s Support Group was so successful we are continuing monthly starting next Tuesday, May 14th at 12:00PM and continuing until the end of the year on the 2nd Tuesday of the"
full_description = "May 1, 2024 - by Lisa Caplan Engage: Monthly Women’s Support Group I’m Lisa Caplan, the Director of the MSBA’s Lawyer Assistance Program. Our Women’s Support Group was so successful we are continuing monthly starting next Tuesday, May 14th at 12:00PM and continuing until the end of the year on the 2nd Tuesday of the month. This free and confidential virtual program is open to all women in the legal profession. The Women’s Support Group is aimed at the experience of women+. All self-identified cis and trans women are welcome. For registration and inquiries please email me at [email protected] or click the Reply to Sender button. Share this page Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer"
