["https://www.msba.org/site/content/Resources-and-Tools-Content/lap-emergency-resources.aspx"]
title = "Lawyer Assistance Program Emergency Resources  | Maryland State Bar Association"
description = "The Lawyer Assitance Program is here to help."
full_description = "Lawyer Assistance Program Emergency Resources We're here to help. Emergency & Medical Emergency: 911 Essential local and community services: 211 Grassroots Crisis Intervention Team at 410-531-6677 The Maryland Crisis Hotline: Dial 211 and then choose option 1 The Crisis Text Line: Text “HOME” TO 741-741 Planned Parenthood Hotline: 1-800-230-PLAN (7526) AIDS Crisis Line: 1-800-221-7044 American Association of Poison Control Centers: 1-800-222-1222 Suicide & Self-Harm 988 Suicide and Crisis Lifeline: 988 has been designated as the new three-digit dialing code that will route callers to the National Suicide Prevention Lifeline. The previous 1-800-273-TALK (8255) number will continue to function indefinitely. Self-Harm Hotline: 1-800-DONT CUT (1-800-366-8288) National Hopeline Network: 1-800-SUICIDE (800-784-2433) Suicide Prevention Wiki Lifeline Crisis Chat (Online live messaging) American Association of Suicidology Prevent Suicide PA American Foundation for Suicide Prevention 45 Suicide Prevention Resources Substance Abuse & Eating Disorders Legal Professional 12-Step Support Group (Thursdays at 6:30pm) National Council on Alcoholism & Drug Dependency Hope Line: 1-800-622-2255 National Crisis Line – Anorexia and Bulimia: 1-800-233-4357 Narcotics.com: Find local Narcotics Anonymous meetings and provides resources for various types of treatment including inpatient, outpatient and support groups. Rehabs.org: Provides information for people at any stage of their recovery journey, including information on different types of therapy/recovery options, warning signs, how to talk to a family member, definitions of different types of treatment and a local treatment center directory. Freerehabcenters.org is about providing the most complete list of free, low-cost, sliding scale, and low-income assisted rehab lists on the Internet. Detox.com is a network of addiction treatment facilities that provide drug and alcohol detox, support, and comprehensive substance abuse treatment services to the individuals and families struggling with addictions. Baltimore intergroup counsel of Alcoholics Anonymous Domestic Violence & Sexual Assault National Domestic Violence Hotline: 1-800-799-SAFE(7233) | TTY 1-800-787-3224 National Sexual Assault Hotline: RAINN — a resource for victims of sexual assault that provides resources and is 100% confidential. Toll-free number: (800) 656-4673 LGBTQIA+ Resources LGBTQIA+ Digital Divide Resource LGBTQIA+ National Hotline (peer support and local resources for all ages): 1-888-843-4564 TransLifeline (Support for transgender people by transgender people): 1-877-565-8860 SAGE LGBT Elder Hotline (Peer support and local resources for older adults): 1-877-360-LGBT(5428) For LGBTQIA youth under age 25: The Trevor Project is the leading national organization providing crisis intervention and suicide prevention services to lesbian, gay, bisexual, transgender, queer & questioning youth. Trevor Lifeline: 1-866-488-7386 crisis intervention and suicide prevention phone service 24/7/365 Trevor Text: Text START to 678678 Confidential text messaging with a Trevor counselor, available 24-7/365TrevorChat Confidential online instant messaging with a Trevor counselor Veteran Resources Veterans Crisis Line White House VA Hotline — you can speak with a trained staff member about any problems you are experiencing. The majority of staff are veterans or a military family member. Toll-free number: (800) 273-8255 Teen Resources Teen help hotline — If you are a teenager facing a problem or just want to talk with someone who understands and does not judge, Teen Line is there for you. Toll-free number: (800) TLC-TEEN (852-8336)"
year_published = 2025
clearnet = "https://www.msba.org/site/content/Resources-and-Tools-Content/lap-emergency-resources.aspx"
