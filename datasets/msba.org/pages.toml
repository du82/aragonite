full_description = "Resources & Tools MSBA News & Insights MSBA strives to provide you with information that impacts the profession—quality content crafted and curated by legal editors, for legal practitioners. Groundbreaking Decision by Arizona Supreme Court to Allow Non-Lawyers to Own and Operate Law Firm Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer March 4, 2025In a significant legal development, the Supreme Court of Arizona has approved an application by KPMG to operate as an Alternative Business Structure providing legal services. Members on the Move: March 2025 Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer March 3, 2025MSBA is proud to highlight the recent achievements, career moves, and impact members make within the legal profession. Please join us in congratulating the following members on their recent moves. Introducing Decisis: A New Legal Research Benefit for MSBA Members Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer February 28, 2025MSBA is excited to announce Decisis, an online legal research tool, is now available as an exclusive member benefit. Increase Your Knowledge at Maryland’s Premier Real Property Law Event Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer February 27, 2025Maryland attorneys practicing in real estate law, mark your calendars! MSBA’s Real Property Section is proud to present its signature Advanced Real Property Institute (ARPI) on March 19, 2025. Copyright Triumphs Over AI Training: Court Decision Sends Strong Message to Tech Industry Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer February 25, 2025The ramifications of the Court’s opinion in Thom