title = "Increase Your Knowledge at Maryland’s Premier Real Property Law Event  | Maryland State Bar Association"
description = "Maryland attorneys practicing in real estate law, mark your calendars! MSBA’s Real Property Section is proud to present its signature Advanced Real Property Institute (ARPI) on March 19, 2025."
full_description = "February 27, 2025 - by MSBA Staff Increase Your Knowledge at Maryland’s Premier Real Property Law Event Maryland attorneys practicing in real estate law, mark your calendars! MSBA’s Real Property Section is proud to present its signature Advanced Real Property Institute (ARPI) on March 19, 2025, at The Doubletree by Hilton in Columbia, MD. This premier event brings together diverse legal professionals from across the state for an immersive day of intensive learning, networking, and valuable industry insights. Master Critical Developments Shaping Real Property Law The event will begin with a welcome and introduction from Co-Chairs Taggart (Tagg) B. Hutchinson, Esq., of Miller, Miller & Canby, and Colin F. Lynch, Esq., of Shulman Rogers. The morning session will kick off with Hot Topics and Environmental Transition for Property Owners, presented by Stephen E. Luttrell, Esq., of Baker, Donelson, Bearman, Caldwell, & Berkowitz, and Maxwell T. Cooke, Esq., of Gordon Feinblatt. The program will continue with Tailoring Environmental Representations and Warranties to the Risks of the 21st Century, led by Amy L. Edwards, Esq., and Alexandra E. Ward, Esq., both of Holland & Knight. Attendees will then delve into Commercial Leasing and Landlord/Tenant Litigation, presented by Douglas M. Bregman, Esq., and Michael E. Weiner, Esq., both of Bregman, Berbert, Schwartz & Gilday. The afternoon session resumes with Ethical Issues for Real Estate Attorneys, led by Thomas M. Degonia, Esq., Counsel for the Attorney Grievance Commission. The learning part of the program will conclude with Coastal Erosion: Methods to Help Clients Plan for the Future, presented by Dr. Christy Swann, PhD, of RCOAST. The day will wrap up with a networking happy hour, sponsored by Fidelity National Title Insurance Company, offering a chance to connect with peers and industry experts in a relaxed setting. Can’t Attend in Person? Choose Self-Guided Learning For those unable to attend the live program, a self-guided learning option will be available for pre-purchase. This program will be released two weeks after the live event, ensuring flexibility for busy professionals who want to stay up-to-date on key developments. Register Today Attendees can also earn five hours of MCLE credit, including one hour of ethics, applicable to surrounding jurisdictions. Don’t miss this opportunity to elevate your real estate law practice—register here today! Share this page Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer"
year_published = 2025
clearnet = "https://msba.org/site/content/News-and-Publications/News/General-News/Increase-Your-Knowledge-at-Marylands-Premier-Real-Property-Law-Event.aspx"
