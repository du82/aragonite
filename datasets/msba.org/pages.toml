title = "Diversity, Equity, Inclusion & Accessibility Committee - Recent Programs - Officers  | Maryland State Bar Association"
full_description = '''MSBA Committee Diversity, Equity, Inclusion & Accessibility Committee The Maryland State Bar Association (“MSBA”) is committed to promoting and encouraging diversity and inclusion within the legal profession. Our strength and success as a profession is driven by our members, who represent a diverse array of characteristics and backgrounds. We must celebrate and foster this diversity because it shapes our perspectives, broadens our capabilities, and enhances our ability to serve our clients and our communities. In furtherance of its commitment to diversity and inclusion, the MSBA established the Diversity and Inclusion Committee (the “Committee”). The Committee is charged with executing this commitment in a manner that celebrates our differences and creates an environment in the MSBA in which all individuals are encouraged to join, thrive and lead the legal profession regardless of race, color, gender, gender identity, disability, sexual orientation, national origin, or any other characteristic of identity. The Committee creates, advances, and carries out diversity and inclusion initiatives within the MSBA and its various sections and committees. The Committee may partner with local and specialty bars to form diversity-related agendas to promote inclusion throughout the legal profession in Maryland. The Committee will also: provide opportunities to celebrate firms and organizations that promote diversity and inclusion initiatives within their business objectives and practices; monitor and report on diversity-related opportunities and challenges that concern the MSBA and the legal community in Maryland; and seek to accomplish its objective through evidence-based issue identification, advocacy, member education, and engagement. The Committee’s core objective is to foster and maintain a diverse and inclusive culture within the MSBA. In particular, the Committee works to promote, advance, and support the full and equal participation of professionals across all elements of identity within the MSBA and the legal profession. The Committee works to promote respect and understanding of all individuals, particularly those representing groups that have been historically subject to discrimination, exclusion, or underrepresentation. Recent ProgramsResources You must accept cookies to view this content. I Can’t Connect: Finding New Ways to Forge Connections Experienced practitioners, members of the bench, and Marylanders will discuss the impact of virtual hearings on different communities across the State of Maryland. Former Chief Judge Barbera serves as moderator, and the panel features: Hon. E. Gregory Wells, Chief Judge Designate, Maryland Court of Special Appeals Natasha M. Dartigue, Esq., Deputy District Public Defender, Baltimore City Pilar C, Nichols, Esq., Principal, Offit Kurman Amy L. Petkovsek, Esq., Deputy Chief Counsel, Maryland Legal Aid Legal Aid client You must accept cookies to view this content. Coffee Chat with MSBA President Scurti Featuring: Hon. Pamila Brown, Howard County District Court. MSBA Past President (2015-16) Harry S. Johnson, Esquire, Partner, Whiteford, Taylor & Preston, LLP, MSBA Past President (2003-04) Hon. Bibi M. Berry, Montgomery County Circuit Court Hon. Monise Brown, Family Magistrate, Charles County Circuit Court You must accept cookies to view this content. Making Yourself Relevant – How to Thrive as an Attorney in Turbulent Times Panelists will present tools and strategies for improving business development, networking, productivity, wellness and other areas throughout the pandemic. Panelists: Lisa Caplan, LCSW-C, Director, MSBA Lawyer Assistance Program Pilar Nichols, Principal, Offit Kurman Alycia Sutor, Managing Director, GrowthPlay Moderators: Hon. Michael W. Reed, Court of Special Appeals Mark Jaskulski, Assistant State’s Attorney, Baltimore City You must accept cookies to view this content. African Americans in the Law in Maryland An overview of the history of African Americans in the Law in Maryland and the struggle to gain access to the courts. You must accept cookies to view this content. Committee’s Inaugural Conference You must accept cookies to view this content. Committee Event: A Rising Tide Lifts All Boats – Transformative Steps to a More Inclusive Profession This event focuses on the importance of diversity and inclusion within the legal profession and the Bar, with a keynote speaker, listening session, and roundtable discussions. No content found Officers Loading Member Victoria Lyn HeyligerCo-Chair Raphael J. SantiniEx Officio Member GL NormanBoard of Governors Liaison //<![CDATA[ // Create the event handlers for PageRequestManager var prm = Sys.WebForms.PageRequestManager.getInstance(); //fix for hitting back button in FF and button was disabled jQuery(document).ready(function () { var findButton = jQuery("input[id$=SubmitButton]"); if (findButton !== null && findButton !== undefined) { findButton.prop("disabled", false); } var grid = jQuery("#ctl01_TemplateBody_WebPartManager1_gwpciNewContentCollectionOrganizerCommon_ciNewContentCollectionOrganizerCommon_QMCommitteeOfficers_ResultsGrid"); if (grid.length !== 0) { var gridHeight = grid.outerHeight(); var dropdownHeight = jQuery("#ctl01_TemplateBody_WebPartManager1_gwpciNewContentCollectionOrganizerCommon_ciNewContentCollectionOrganizerCommon_QMCommitteeOfficers_ResultsGrid.dropdown-menu.dropdown-menu-right").outerHeight(); if (gridHeight <= dropdownHeight || jQuery(".chosen-select").length !== 0) { grid.css('overflow', 'inherit'); } } }); prm.add_initializeRequest(PageRequestManager_initializeRequest); prm.add_beginRequest(PageRequestManager_beginRequest); prm.add_endRequest(PageRequestManager_endRequest); var uiId = ''; function PageRequestManager_initializeRequest(sender, args) { if (sender.get_isInAsyncPostBack()) { args.set_cancel(true); } } function PageRequestManager_beginRequest(sender, args) { var postbackElem = args.get_postBackElement(); uiId = postbackElem.id; postbackElem.disabled = true; } function PageRequestManager_endRequest(sender, args) { EndRequest(); var postBackFieldId = $get(uiId); if (postBackFieldId != null && postBackFieldId != 'undefined') postBackFieldId.disabled = false; if (args.get_error() != undefined) { var error = args.get_error().name; if (error != 'undefined' && error == 'Sys.WebForms.PageRequestManagerServerErrorException') args.set_errorHandled(true); if (document.getElementById(uiId)) document.getElementById(uiId).focus(); } } //Runs mapping javascript after panel has been asynchronously updated function EndRequest() { if (typeof(initializeMap) == 'function') { initializeMap(); } } // Executes when a query is clicked in the select menu. // Add or replace the selected query key in the url query string, and reload the page. function querySelect(paramName, queryId) { var newlocation = ""; var hash = window.location.hash; //need to check for anchors/hashtags and handle them carefully //var paramName = "QueryMenuSelectedKey" + listerId; if (window.location.search.length == 0) { newlocation = window.location + "?" + paramName + "=" + queryId; } else { // Add the key to the query string, or replace it if it already exists in the query string var queryString = window.location.search.substring(1); var paramPairs = queryString.split("&"); var newQueryString = ""; var isFound = new Boolean(false); for (var i=0;i<paramPairs.length;i++) { if (newQueryString.length > 0) newQueryString += "&"; var pair = paramPairs[i].split("="); if (pair[0] == paramName) { newQueryString += paramName + "=" + queryId; isFound = true; } else { newQueryString += paramPairs[i]; } } if (isFound == false) { // Param wasn't in query string, add it. if(hash.length == 0) { newlocation = window.location + "&" + paramName + "=" + queryId; } else { var url = window.location.href.substring(0, window.location.href.indexOf("?")); newlocation = url + "?" + newQueryString + "&" + paramName + "=" + queryId + hash; } } else { var url = windo