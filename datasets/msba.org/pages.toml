["https://msba.org/site/content/News-and-Publications/News/General-News/Maryland-Attorneys-Convene-in-Annapolis-for-MSBA-Day.aspx"]
title = "Maryland Attorneys Convene in Annapolis for MSBA Day  | Maryland State Bar Association"
description = "As the leading voice of the legal profession in Maryland, MSBA continues to advocate for policies that protect attorneys, judges, and the broader legal system while ensuring access to justice for all Marylanders."
full_description = 'February 18, 2025 - by MSBA Staff Maryland Attorneys Convene in Annapolis for MSBA Day On February 11, 2025, MSBA members gathered in Annapolis for MSBA Day, an annual event dedicated to legislative advocacy and engagement with Maryland’s General Assembly. As the leading voice of the legal profession in Maryland, MSBA continues to advocate for policies that protect attorneys, judges, and the broader legal system while ensuring access to justice for all Marylanders. Attorneys, legal professionals, and community partners arrived at Governor Calvert House to kick off a day of advocacy. MSBA President Raphael Santini welcomed attendees, recognizing their commitment to shaping Maryland’s legal landscape. He emphasized that MSBA’s advocacy efforts directly impact the profession, whether by defeating harmful legislation, ensuring judicial security, or securing funding for vital legal aid programs. Santini thanked participants for “joining us from all over the state and from so many different practice areas" and shared, "Your expertise, experience, and client stories are the most powerful tools we have in ensuring our voices are heard." The morning opened with remarks from key state leaders, including Maryland Chief Justice Matthew Fader, who spoke on the urgent need for enhanced judicial security and the varying security standards across the state, and Senator Paul Corderman, who shared his deeply personal perspective as the son of a judge who faced coordinated attacks due to his position. Corderman’s moving statements illustrated that the growing safety concerns for legal professionals is a long-standing issue, emphasizing why it is a top priority for the 2025 legislative session. The Role of MSBA’s Laws Committee Before concluding the morning session, Kelly Hughes Iverson, co-chair of the MSBA Laws Committee, outlined MSBA’s process for monitoring legislation. She explained how MSBA evaluates bills based on their impact on the legal profession and access to justice and encouraged members to stay engaged in advocacy efforts throughout the session. Additionally, former Attorney General Brian Frosh provided an advocacy training session, emphasizing the importance of direct outreach to legislators. Frosh encouraged attorneys to build relationships with lawmakers and to continue following up beyond MSBA Day to ensure their voices remain heard. MSBA’s 2025 Legislative Priorities Following the opening session, MSBA members participated in legislative briefings, where they received in-depth analysis on three key policy issues. Judicial and Attorney Security Ensuring the safety of Maryland’s legal professionals remains a top priority for MSBA. Santini highlighted MSBA’s support of HB789/SB621, a bill designed to establish minimum security standards in Maryland courtrooms. This initiative builds on last year’s Judge Andrew Wilkinson Judicial Security Act, which improved protections for judges following his tragic murder. Santini also emphasized MSBA’s ongoing work to develop long-term solutions for protecting court personnel and attorneys from threats in the legislatively created Task Force on Judicial Security. Opposition to the Taxation of Legal Services For the third time in recent years, Maryland lawmakers are considering a sales tax on legal services. MSBA has successfully defeated similar proposals in 2020 and 2024 and remains firmly opposed to any attempt to impose such a tax in 2025. Grayson Wiggins of the Maryland Chamber of Commerce and Steven Rinaldi of the MSBA Business Law Section outlined the devastating impact this tax would have on small businesses and individual clients. Rinaldi emphasized that women and minority-owned small businesses—which often rely on affordable legal guidance—would be disproportionately affected, making it harder for entrepreneurs to establish and maintain their businesses. MSBA will continue to monitor this issue and oppose any proposed legislation to tax the profession. Funding for the Access to Counsel in Evictions (ACE) Program The Access to Counsel in Evictions (ACE) law has been a game-changer in preventing wrongful evictions and keeping Maryland families housed. However, without legislative action, funding for the program will expire in 2027. Michelle Siri, executive director of the Maryland Legal Services Corporation, urged support for SB154/HB103, which would make ACE funding permanent. The program has been highly successful, with 88% of tenants who wanted to remain in their homes successfully doing so. Additionally, for every $1 invested in ACE, the state saves $4 in social service costs, including reduced spending on homeless shelters, emergency medical care, and law enforcement. Engaging with Lawmakers Following the briefings, MSBA members headed to the Maryland Senate and House buildings to meet with lawmakers. Over the course of the morning, MSBA members participated in nearly 20 meetings with legislators, including Delegates Marlon Amprey, Jason Buckel, Regina Boyce, and LaToya Nkongolo, , as well as Senators Katie Hester, Shelly Hettleman, Jeff Waldstreicher, and Chris West. MSBA members provided legislators with practical insights on how proposed bills would impact attorneys, courts, and the general public. Many lawmakers expressed appreciation for the expertise and real-world experiences that legal professionals bring to the policymaking process. Looking Ahead: A Call to Action MSBA Day 2025 is just one part of a larger advocacy effort. MSBA urges members to track key legislation that affects the legal profession, participate in advocacy initiatives through MSBA’s Office of Advocacy and Government Affairs, and continue engaging with legislators to ensure that the legal community has a strong voice in shaping Maryland’s laws. For more information on MSBA’s legislative initiatives, upcoming bills, and ways to get involved, visit www.msba.org/advocacy or contact [email protected]. Share this page Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer'
