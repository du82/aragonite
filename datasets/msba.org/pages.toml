["https://msba.org/site/content/News-and-Publications/News/General-News/From_the_Boardroom_December_2024.aspx"]
title = "From the Boardroom: December 2024  | Maryland State Bar Association"
description = "The Board of Governors held a regular meeting in the Senate Chambers of the historic Maryland Statehouse."
full_description = "December 9, 2024 - by Anna Sholl From the Boardroom: December 2024 The Board of Governors (Board) held a regular meeting in the Senate Chambers of the historic Maryland Statehouse. The Board has a longstanding tradition of hosting its December meeting in this venue. President Raphael Santini presided over the meeting. He began the meeting by sharing the unique history of the Maryland State House. Notably, it is the oldest state capitol in continuous legislative use and is the only State House to once serve as the Nation’s capital. In addition, President Santini provided an update on the Maryland State Bar Association’s ABA activity, including its proposed resolution on Judicial Security, which will be presented at the ABA Mid-year meeting in February. President Santini also announced the members of the Nominating Committee charged with recruiting and recommending candidates for the six (6) At-Large Board of Governors seats, which will be available for the 2025-27 term. The Nominating Committee will be led by Immediate Past-President, Jason DeLoach, and will include three (3) existing members of the Board, Terri Lowery (Western Maryland), Samantha Rodier (Harford County), and Jasmine England Ceaser (YLS Representative). It will also include five (5) members that are not currently serving on the Board, Hon. Lisa Hall Johnson (Prince George’s County), Shuaa Tajammul (Montgomery County), Darryl Tarver (Baltimore City), Jamie Alvarado-Taylor (Montgomery County), and Kendrick McLeod (Baltimore City). MSBA Executive Director, Anna Sholl, also provided a report, during which the MSBA Advocacy Program for the 2025 Legislative Session was approved by the Board. In addition, the Board received an update from MSBA’s liaison to the Judiciary’s Voir Dire Advisory Board, Timothy Gunning. Mr. Gunning shared the progress being made in preparation for a pilot program on expanded voir dire and the intelligent use of pre-emptory challenges that will launch in select jurisdictions this January. For more information on this issue, please join us for our upcoming webinar on Monday, December 16, 2024 at 12:00 PM. During the Secretary report, MSBA Secretary Natasha Dartigue delivered District and Section Governor distributions for the upcoming 2025-26 Bar year. Pursuant to the MSBA Bylaws and the distribution, MSBA Taxation Section will receive a seat on the Board, in addition, Baltimore County will move from three (3) to four (4) representatives, and Prince George’s County will move from three (3) to two (2) representatives. More details on how to apply for available District Governor and At-Large positions for the 2025-27 term will be available in mid-December. Finally, as is the tradition at the December meeting, the Board organized a nominating committee to nominate officers for the 2025-26 Bar year, to be elected by the membership at the Legal Summit & Annual Meeting from June 4-6, 2025. MSBA is pleased to announce that Natasha Dartigue, Esq. was nominated as President-Elect, Natasha Nazareth, Esq. was nominated as Treasurer, and Randolph Sergent, Esq. was nominated as Secretary. If elected at the Legal Summit & Annual Meeting, they will join current President-Elect, Marisa Trasatti, Esq., as officers for the 2025-26 Bar year. More details about our nominees will be available soon. Share this page Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer"
year_published = 2025
