title = "About Us  | Maryland State Bar Association"
full_description = "About Us MSBA is the home of the legal profession in Maryland .innerBannerArea { background-position: 100% 63%; } The Maryland State Bar Association (MSBA), home to the Maryland legal profession, represents more than 20,000 attorneys and is the state’s leading voice for the law community. MSBA members encompass the entire legal sphere—lawyers, judges, paralegals, law firm administrators, law students, pro bono organizations, legal nonprofits, and more—at every career stage and within every legal specialty. Since its founding in 1897, MBSA has been committed to developing courageous and collaborative bar leaders in the Maryland law community and beyond. Through Continuing Legal Education (CLE) programs and publications, to community outreach and advocacy initiatives, MSBA honors the passion and purpose of Maryland’s legal community by empowering them with a toolkit of knowledge, training, and an influential peer network, designed to excel and enhance their professional leadership abilities and upward career mobility. Meet our Leadership The Board of Governors, Executive Committee, and Section & Committee Chairs make the strategic decisions that guide the MSBA towards achieving its mission. They are tasked with making sure the MSBA membership experience is rewarding and valuable. MSBA Leadership Get to Know Our Staff MSBA staff are committed to helping you make the most of your membership with years of collective experience working for and assisting Maryland’s legal community. MSBA Staff Please note: The Maryland State Bar Association is not affiliated with the State of Maryland nor is it responsible for attorney licensure or discipline. To learn more about being barred in Maryland click here or to learn more about the attorney grievance commission click here."
year_published = 2025
