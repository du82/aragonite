["https://msba.org/site/content/News-and-Publications/News/General-News/Groundbreaking_Decision_by_Arizona_Supreme_Court_to_Allow_Non-Lawyers_to_Own_and_Operate_Law_Firm.aspx"]
title = "Groundbreaking Decision by Arizona Supreme Court to Allow Non-Lawyers to Own and Operate Law Firm  | Maryland State Bar Association"
description = "In a significant legal development, the Supreme Court of Arizona has approved an application by KPMG to operate as an Alternative Business Structure providing legal services."
full_description = "March 4, 2025 - by Pamela Langham Groundbreaking And Transformative Decision By Arizona Supreme Court to Allow Non-lawyers To Own And Operate Law Firm In a significant legal development, the Supreme Court of Arizona has approved an application by a business entity - KPMG - to operate as an Alternative Business Structure providing legal services. KPMG, known as one of the big four accounting firms, offers a range of services including auditing financial statements, regulation compliance, tax-related services, and helping businesses with strategy, risk management, and operational improvements. Now KPMG through an independent subsidiary, KPMG Law US, will be offering and providing legal services to clients under Arizona’s Alternative Business Structure program, permitting non-lawyers to own or invest in law firms. Background The Arizona Supreme Court has established a comprehensive framework for business entities to create and operate as Alternative Business Structures (ABS). Governed by Arizona’s Code of Judicial Administration § 7-209 (ACJA § 7-209), ABS are defined as entities that integrate nonlawyers with economic interests or decision-making authority into firms providing legal services, in compliance with Arizona Supeme Court Rules 31 and 31.1(c). Decision-making authority encompasses binding the ABS legally, participation in management, directing policies, and making operational decisions. Regulatory oversight of ABS entities is maintained by the Arizona Supreme Court, ensuring adherence to professional conduct standards applicable to all attorneys. A dedicated Committee on ABS (the Committee) oversees the application and approval process, evaluates license applications, and enforces compliance through license renewal, suspension, or denial when necessary. Key considerations for licensure include safeguarding the public interest, ensuring client confidentiality, upholding professional ethics, and promoting access to legal services. Under Rule 33.1 of the Arizona Rules of the Supreme Court, the Committee is granted specific authority to regulate ABS and recommend licensure to the Supreme Court, which makes the ultimate decision to endorse or reject applications. See Ariz. R. Sup. Ct. 33.1. The Committee’s evaluation process emphasizes the importance of robust governance structures to maintain lawyer independence and prioritize client interests. Additionally, the Supreme Court retains enforcement authority, including license revocation or suspension, to address instances of fraud or misrepresentation, following due process. Through these mechanisms, the Arizona Supreme Court has created an innovative model that allows for nonlawyer participation in legal service entities while the framework is designed to protect the integrity of the legal profession and the interests of clients. Key Details of the Approval The Committee, after a review of KPMG Law US, LLC’s (KPMG Law) application, recommended licensure on January 14, 2025, with specific conditions to ensure compliance and maintain high standards of practice. Chief among those conditions is the requirement for KPMG Law’s Compliance lawyer to conduct semi-annual audits. These audits are designed to review the firm’s internal policies and procedures, ensuring adherence to Arizona Supreme Court Rule 33.1 and ACJA § 7-209. The findings of each audit must be documented in a written report. The Arizona Supreme Court approved KPMG’s application for ABS status on February 27, 2025. In its order, the Arizona Supreme Court requires KPMG Law to operate in a manner consistent with the representations made in its application and any subsequent supplements. Importantly, the firm is also prohibited from performing legal services for clients for whom KPMG LLP or other KPMG companies or subsidiaries conduct financial statement audits. Read the full Order. This condition is to maintain the independence and integrity of both legal and financial services provided by the parent company. ABA Model Rule 5.4 and MD Attorneys’ Rules of Professional Conduct At the heart of this groundbreaking concept is ABA Model Rule 5.4(b) which provides: “A lawyer shall not form a partnership with a nonlawyer if any of the activities of the partnership consist of the practice of law.” ABA Model Rule 5.4(a) also prohibits lawyers from sharing legal fees with a nonlawyer, with few exceptions. Moreover, Rule 19-305.4 of the Maryland Attorneys' Rules of Professional Conduct establishes guidelines to ensure the professional independence of attorneys. It prohibits attorneys from sharing legal fees with non-attorneys, except under specific conditions. Attorneys are also restricted from forming partnerships with non-attorneys if the partnership involves practicing law or allowing non-attorneys to control their professional judgment. Additionally, attorneys cannot practice law in an entity where non-attorneys hold ownership, direct operations, or influence legal decisions. See MD R Attorneys, Rule 19-305.4. These rules are designed to protect the professional independence of attorneys. The rules also ensure that lawyers’ judgment and decisions are guided solely by professional ethical obligations, and the best interests of their clients, free from undue influence by individuals who lack legal training or adherence to professional standards. The rules safeguard against conflict of interest and uphold the integrity and confidentiality of the attorney-client relationship. Implications for the Legal Industry The approval of KPMG Law as an ABS is a transformative decision that reflects a groundbreaking view of increasing the delivery of legal services by non-lawyers. By allowing ABS, Arizona allows entities to combine legal, accounting, and other professional services under one roof. Non-attorney ownership might introduce new business models and innovations that improve efficiency and reduce operational costs. This could make legal services more affordable and accessible to a broader population, addressing gaps in access to justice. However, it remains to be seen whether these entities will be able to protect a lawyer’s independence and professional judgment and whether serving the client’s best interests and maintaining strict confidentiality standards can be accomplished. Additionally, non-attorney owners may lack the necessary understanding of legal ethics, professionalism, and confidentiality, increasing the likelihood of breaches that could harm clients. Risks include prioritizing profit motives over ethical obligations, potentially compromising the independence of attorneys and the quality of legal services. Conclusion The Arizona Supreme Court’s approval of KPMG Law as an ABS is a significant milestone in the legal industry. It opens new avenues for the delivery of legal services in Arizona promoting a multidisciplinary approach while hopefully ensuring rigorous compliance and ethical standards. Lawyers should closely monitor this development, as it may signal broader changes and opportunities in other states. Share this page Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer"
