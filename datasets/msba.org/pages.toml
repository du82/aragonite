["https://msba.org/site/content/News-and-Publications/News/General-News/How-the-Trauma-Your-Clients-Experience-Impacts-You.aspx"]
title = "How the Trauma Your Clients Experience Impacts You  | Maryland State Bar Association"
description = "Secondary trauma is described as “the cumulative physical, emotional, and psychological effects of being continually exposed to traumatic events or stories while working in a helping capacity.”"
full_description = "December 3, 2024 - by Lisa Caplan How the Trauma Your Clients Experience Impacts You Secondary Trauma Series How the Trauma Your Clients Experience Impacts You Let’s face it… You can’t walk through water without getting wet. Your clients don’t contact you because they're having the best day of their lives. They are coming to you with problems they want you to help fix. These problems can include a torrential downpour of issues: child abuse and neglect, substance use and addiction, mental health challenges, employment and housing instability, domestic violence, criminal charges, and more. Bearing witness to your clients' suffering and trauma takes an emotional and physical toll that cannot be ignored. This is called secondary trauma. What Is Secondary Trauma? Secondary trauma is described as “the cumulative physical, emotional, and psychological effects of being continually exposed to traumatic events or stories while working in a helping capacity.” Symptoms of secondary trauma may include: Heightened stress levels Hypervigilance Elevated startle response Mentally and physically tired Self-medicating using alcohol, drugs, or other unhealthy behaviors Irritability and pessimism Chronic physical ailments Apathy, sadness, no longer finding activities pleasurable Isolation from others Disturbed sleep Difficulty concentrating Triggers your own past trauma If you’ve experienced any of these symptoms, you are not alone. Many of my clients have dealt with secondary trauma, which is why the MSBA’s Lawyer Assistance Program (LAP) and the Maryland Access to Justice Commission (A2JC) are partnering to provide an essential series of online programs on secondary trauma. The Series on Secondary Trauma This series is funded by the generous support of The David N. Bates and Richard B. Vincent Foundation, which allows us to offer it to all participants for free. The Series on Secondary Trauma will consist of four 1-hour interactive virtual sessions, held from 3 p.m. to 4 p.m. on the following dates: Tuesday, February 4 Tuesday, February 18 Tuesday, March 4 Tuesday, March 18 The Series will cover the following topics: Defining trauma and secondary trauma Explaining how trauma affects the brain Describing and distinguishing between stress/trauma and trauma exposure responses Explaining how secondary trauma impacts individuals and organizations Sharing tools and strategies for managing secondary trauma If you are interested in registering, please visit https://www.thought-kitchen.com/what-we-do/maryland Important: If you register, it is imperative that each participant commit to attending all four sessions, as each session builds on the previous one. If you have any questions or would like more information about the series, please contact: Lisa Caplan, Director of the Lawyer Assistance Program, at [email protected] Reena Shah, Executive Director of the Maryland Access to Justice Commission, at [email protected] Share this page Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer"
