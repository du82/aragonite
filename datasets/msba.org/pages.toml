title = "MSBA Publications  | Maryland State Bar Association"
full_description = "MSBA Publications Strengthen your legal library through MSBA’s collection of original works A strong practice is built on strong resources. Strengthen your legal library through MSBA’s collection of original works, including treatises, featured publications, the Maryland Bar Journal, and more. Treatises & Coursebooks Written by leading practitioners, used by thousands of professionals, and trusted in the field: these are the resources you need to achieve legal excellence. View MSBA Treatises & Coursebooks Bar Journal Deep insight into the issues that matter. The Maryland Bar Journal brings MSBA members analysis and insight into the topics that matter most to Maryland’s legal community. Published three times a year, it leverages MSBA’s deep and extensive network of experts, from a wide variety of practice areas and backgrounds, to ensure members understand critical issues. Read the Journal Maryland Lawyers’ Manual The Maryland Lawyers' Manual is a complete directory of legal resources for Maryland lawyers. MSBA members receive access as an exclusive benefit. The Maryland Lawyers’ Manual provides: Alphabetical listings of every Maryland-licensed Attorney MSBA Members, Leadership, Groups, and Resources Maryland Judges Legislators and Government Officials Legal Service Vendors Law Firms View or Purchase the Manual Publication Catalog Maryland State Bar Association is proud to offer this catalog of legal publications, featuring an expansive selection of resources authored by attorneys who are esteemed experts in their fields. This catalog is a vital repository for legal professionals seeking authoritative guidance and practical insights across a diverse range of legal subjects. View the Catalog Questions? Contact MSBA staff to learn more. MSBA Headquarters [email protected] (410) 685-7878"
