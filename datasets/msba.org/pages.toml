full_description = "Join the MSBA We are thrilled you are joining the Maryland State Bar Association! If you have any questions, click on the chat icon in the lower right-hand corner of the screen for a direct connection to our Member Service Center. If no one is available immediately, please leave a message and we will reply as soon as we can. You will be notified by email and directly on our site too while you are browsing. As a member of MSBA, you will enjoy: Access to MSBA’s virtual CLEs of 90 minutes or less Fastcase The digital Maryland Lawyers’ Manual Two practice sections of your choice Wellness support Advocacy on behalf of the profession Exclusive pricing for practice management, financial, and insurance services, as well as for MSBA events and publications Learn more about our membership offerings"
