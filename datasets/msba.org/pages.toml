["https://msba.org/site/content/About/MSBA-Board-of-Governor-Nominations-2025.aspx"]
title = "MSBA Board of Governor Nominations 2025  | Maryland State Bar Association"
full_description = "MSBA Board of Governor Nominations MSBA Board of Governor Nominations 2025-27 District Governor Vacancies: The MSBA, following its Bylaws and Policy Manual, is now accepting nominations for the upcoming Class I - District Governor vacancies outlined below. Class I - District Governor terms begin at the MSBA’s Annual Business Meeting on June 6, 2025, and conclude at the Annual Business Meeting in June 2027. Any voting member of the Association having his or her Primary Address within a District may be nominated for District Governor of that District by a petition filed with the Executive Director per the Policies and Procedures promulgated by the Board and not inconsistent with the MSBA Bylaws. A nomination petition must be signed by an appropriate officer of the nominee’s County/City Bar Association certifying that the candidate was selected by the governing body of such Bar Association, OR signed by not less than ten (10) members of the Association whose Primary Address also falls within such District. Petitions must be submitted through the electronic portal by 5:00 pm on February 6, 2025. BoG District Governor Application 2025-27 Download Sample Signature Page Vacancies: 1st District, Baltimore City (4 vacancies)* 2nd District, Dorchester, Somerset, Wicomico, Worcester Counties (1 vacancy) 3rd District, Caroline, Kent, Queen Anne’s,Talbot Counties (1 vacancy) 6th District, Montgomery County (3 vacancies) 7th District, Anne Arundel County (2 vacancies) 8th District, Baltimore County (3 vacancies)* 10th District, Howard County (1 vacancy) 11th District, Carroll and Frederick Counties (1 vacancy) 12th District, Allegany, Garrett and Washington Counties (1 vacancy) *Please note that one (1) nominee from Baltimore City and Baltimore County will be elected to serve an abbreviated 1-year term to balance the Board of Governor distribution. Petitions for consideration for the vacant District Governor seats must be submitted by February 6, 2025. 2025-27 At-Large Governor Vacancies: According to the June 2023 Bylaw updates, the Board of Governors now has twelve (12) At-Large Governor seats, which may be filled by any member of the MSBA upon recommendation by recommendation of a Nominating Committee chaired by the MSBA Immediate Past-President. For the 2025-27 term, six (6) At-Large seats are available. To submit an application for consideration by the Nominating Committee for an available At-Large Governor seat, use the portal below. Applications must be received by January 17, 2025 for consideration. BoG At-Large Application 2025-27 If you have any questions about the nomination process, please contact Theresa Michael at [email protected]."
