title = "MSBA Informs Practitioners About Maryland’s Expanded Voir Dire Pilot Program  | Maryland State Bar Association"
description = "On December 16, 2024, MSBA hosted a virtual program for practitioners to learn about the Pilot Program and share questions and feedback."
full_description = "December 17, 2024 - by MSBA Staff MSBA Informs Practitioners About Maryland’s Expanded Voir Dire Pilot Program On December 16, 2024, MSBA hosted a virtual program for practitioners to learn about the Pilot Program and share questions and feedback. Judge Krystal Alves, Co-Chair of MSBA’s Special Committee on Voir Dire and Co-Chair of the Criminal Subcommittee, moderated the session and noted the importance of transparency and interaction throughout the Pilot Program. She encouraged practitioners to reach out to MSBA throughout the Pilot Program about their experiences. Connie Kratovil-Lavelle, Co-Chair of MSBA’s Rules Committee, thanked the Maryland Judiciary for involving MSBA early on in the rule-making process regarding expanded voir dire through participation and input at the full committee and subcommittee level. She thanked MSBA’s subject matter experts who serve on MSBA’s Special Committee on Voir Dire and revised resources in response to the Judiciary’s request for updated model voir dire questions. Patrice Meredith Clarke, Co-Chair of MSBA’s Special Committee on Voir Dire and Co-Chair of the Civil Subcommittee, provided a history of the case law and the 2024 legislation that preceded the Pilot Program, with the matter ultimately being referred to the Judiciary’s Rules Committee in spring 2024 on an expedited basis by Chief Justice Fader. Judge Yvette Bryant, Chair of the Judiciary’s Standing Committee on Rules of Practice and Procedure, described the role of the Rules Committee in providing recommendations to the Supreme Court of Maryland on the voir dire issue, with the court determining that a Pilot Program would best allow the court to study the issue and its impact on cases through 2025. Judge Laura Ripken, Chair of the Expanded Voir Dire Pilot Program Advisory Board, provided a report on the Board’s work in implementing the Program. She thanked stakeholders, including the MSBA, for serving as Board members, and working quickly to develop the program, produce materials for participating judges and attorneys, and create data-collection tools to inform the Board of the program’s outcomes. Judge Ripken encouraged participating attorneys to review the Attorney Packet with instructions to attorneys with cases in the Pilot Program, including a menu of types of expanded voir dire available to pilot judges for the jury selection process. A copy has also been sent to the pilot judges, who may use any of the listed styles or a combination of styles during voir dire. The packet also includes a list of the twenty-two (22) pilot judges in eight (8) jurisdictions, as well as survey questions for attorneys to complete at the end of each jury selection. Tim Gunning, who serves as MSBA’s Liaison to the Pilot Program Advisory Board, discussed MSBA’s role in educating members and reconvening the Special Committee on Voir Dire to produce updated model voir dire questions for the profession. He asked attorneys to review all available resources, connect with one another, and provide feedback to MSBA in order to make any updates to the Pilot Program as it continues through 2025. Attendees learned about the importance of data collection and analysis in the Pilot Program from Dr. Jamie Walter, Director of Research and Analysis at the Maryland Judiciary. The Program will track judges, attorneys, and jurors in the expanded voir dire Pilot as well as those using tradition voir dire, and will also track case characteristics, variations in voir dire styles, number and types of strikes, jury selection length per trial, and overall trial time. View the presentation here. The Advisory Board will collect data on the Pilot Program through June 2025 and prepare a report for the Supreme Court of Maryland the Rules Committee later in the year. Judge John Maloney, Co-Chair of MSBA’s Special Committee on Voir Dire and Co-Chair of the Criminal Subcommittee, noted MSBA’s important role on this issue over the years, including prior publications of the model questions. He confirmed that MSBA’s updated questions will be available to members and non-members for use in the program and will be updated throughout the Pilot. He encouraged attorneys to plan ahead, review the materials, and experiment with various types of voir dire during cases. Panelists advised attorneys to prepare for expanded voir dire in participating jurisdictions, particularly as some case assignments may not be known in advance, and to coordinate with opposing counsel and pilot judges in advance to discuss the types and scope of expanded voir dire for a particular case. MSBA directs attorneys to MSBA’s Voir Dire Resource and Insights Page to access relevant resources and updates about the Pilot Program, including MSBA’s updated model voir dire questions for the Pilot Program. Share this page Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer"
year_published = 2025
