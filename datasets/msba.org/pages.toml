full_description = "Maryland State Bar Association MSBA Engage .innerBannerArea { background-position: 100% 35%; } MSBA Engage Terms of Service These terms govern use of MSBA Engage (“Engage”). To use Engage, you must agree to these terms with the Maryland State Bar Association {“MSBA”). Important Notice on these Terms of Service These terms of service include a number of important provisions that affect your rights and responsibilities, such as the disclaimers in Disclaimers, limits on MSBA’s liability to you in Limits on Liability, your agreement to cover MSBA for damages caused by your misuse of Engage in Your Responsibility, and an agreement to arbitrate disputes in Disputes. Your Permission to Use Engage Subject to these terms, MSBA gives you permission to use Engage. Everyone needs to agree to these terms to use Engage. Conditions for Use of Engage Your permission to use Engage is subject to the following conditions: You must be at least thirteen years old. You may no longer use Engage if MSBA contacts you directly to say that you may not. You must use Engage in accordance with Acceptable Use and Content Standards. Acceptable Use You may not break the law using Engage. You may not use or try to use another’s account on Engage without their specific permission. You may not buy, sell, or otherwise trade in user names or other unique identifiers on Engage. You may not send advertisements, chain letters, or other solicitations through Engage, or use Engage to gather addresses or other personal data for commercial mailing lists or databases. You may not automate access to Engage, or monitor Engage, such as with a web crawler, browser plug-in or add-on, or other computer program that is not a web browser. You may crawl Engage to index it for a publicly available search engine, if you run one. You may not use Engage to send email to distribution lists, newsgroups, or group mail aliases. You may not falsely imply that you’re affiliated with or endorsed by MSBA. You may not hyperlink to images or other non-hypertext content on Engage on other webpages. You may not remove any marks showing proprietary ownership from materials you download from Engage. You may not show any part of Engage on other websites with <iframe>. You may not disable, avoid, or circumvent any security or access restrictions of Engage. You may not strain the infrastructure of Engage with an unreasonable volume of requests, or requests designed to impose an unreasonable load on information systems underlying Engage. You may not impersonate others through Engage. You may not encourage or help anyone in violation of these terms. Content Standards You may not submit content to Engage that is illegal, offensive, or otherwise harmful to others. This includes content that is harassing, inappropriate, or abusive. You may not submit content to Engage that violates the law, infringes anyone’s intellectual property rights, violates anyone’s privacy, or breaches agreements you have with others. You may not submit content to Engage containing malicious computer code, such as computer viruses or spyware. You may not submit content to Engage as a mere placeholder, to hold a particular address, user name, or other unique identifier. You may not use Engage to disclose information that you don’t have the right to disclose, like others’ confidential or personal information. Enforcement MSBA may investigate and prosecute violations of these terms to the fullest legal extent. MSBA may notify and cooperate with law enforcement authorities in prosecuting violations of the law and these terms. MSBA reserves the right to change, redact, and delete content on Engage for any reason. If you believe someone has submitted content to Engage in violation of these terms, contact MSBA immediately. Your Account You must create and log into an account to have an Engage account. If you want an Engage account, you agree to provide MSBA, at a minimum, a valid email address, and to keep that address up-to-date. You agree to be responsible for all action taken using your account, whether authorized by you or not, until you either close your account or notify MSBA that your account has been compromised. You agree to notify MSBA immediately if you suspect your account has been compromised. MSBA may restrict, suspend, or close your Engage according to its policy for handling copyright-related takedown requests, or if MSBA reasonably believes that you’ve broken any rule in these terms. Your Content Nothing in these terms gives MSBA any ownership rights in intellectual property that you share with Engage, such as your account information, posts, or other content you submit to Engage. Nothing in these terms gives you any ownership rights in MSBA’s intellectual property, either. Between you and MSBA, you remain solely responsible for content you submit to Engage. You agree not to wrongly imply that content you submit to Engage is sponsored or approved by MSBA. These terms do not obligate MSBA to store, maintain, or provide copies of content you submit, and to change it, according to these terms. Content you submit to Engage belongs to you, and you decide what permission to give others for it. But at a minimum, you license MSBA to provide content that you submit to Engage to other users of Engage. That special license allows MSBA to copy, publish, and analyze content you submit to Engage. When content you submit is removed from Engage, whether by you or by MSBA, MSBA’s special license ends when the last copy disappears from MSBA’s backups, caches, and other systems. Other licenses you apply to content you submit, such as Creative Commons licenses, may continue after your content is removed. Those licenses may give others, or MSBA itself, the right to share your content through Engage again. Others who receive content you submit to Engage may violate the terms on which you license your content. You agree that MSBA will not be liable to you for those violations or their consequences. Your Responsibility You agree to indemnify MSBA from legal claims by others related to your breach of these terms, or breach of these terms by others using your account on Engage. Both you and MSBA agree to notify the other side of any legal claims for which you might have to indemnify MSBA as soon as possible. If MSBA fails to notify you of a legal claim promptly, you won’t have to indemnify MSBA for damages that you could have defended against or mitigated with prompt notice. You agree to allow MSBA to control investigation, defense, and settlement of legal claims for which you would have to indemnify MSBA, and to cooperate with those efforts. MSBA agrees not to agree to any settlement that admits fault for you or imposes obligations on you without your prior agreement. Disclaimers You accept all risk of using Engage and content on Engage. As far as the law allows, MSBA and its suppliers provide Engage as is, without any warranty whatsoever. Engage may hyperlink to and integrate forums and services run by others. MSBA does not make any warranty about services run by others, or content they may provide. Use of services run by others may be governed by other terms between you and the one running service. Limits on Liability Neither MSBA nor its suppliers will be liable to you for breach-of-contract damages their personnel could not have reasonably foreseen when you agreed to these terms. As far as the law allows, the total liability to you for claims of any kind that are related to Engage or content on Engage will be limited to $50. Feedback MSBA welcomes your feedback and suggestions for Engage. You agree that MSBA will be free to act on feedback and suggestions you provide, and that MSBA won’t have to notify you that your feedback was used, get your permission to use it, or pay you. You agree not to submit feedback or suggestions that you believe might be confidential or proprietary, to you or others. Termination Either you or MSBA may end the agreement written out in these terms at any time. When our agreement ends, your permission to use Engage also ends. The following provisions survive the end of our agreement: Your Content, Feedback, Your Responsibility, Disclaimers, Limits on Liability, and General Terms. Disputes Maryland Law will govern any dispute related to these terms or your use of Engage. You and MSBA agree to seek injunctions related to these terms only in state or federal court in Maryland. Neither you nor MSBA will object to jurisdiction, forum, or venue in those courts. Other than to seek an injunction or for claims under the Computer Fraud and Abuse Act, you and MSBA will resolve any Dispute by binding American Arbitration Association arbitration. Arbitration will follow the AAA’s Commercial Arbitration Rules and Supplementary Procedures for Consumer Related Disputes. Arbitration will happen in Maryland. You will settle any dispute as an individual, and not as part of a class action or other representative proceeding, whether as the plaintiff or a class member. No arbitrator will consolidate any dispute with any other arbitration without MSBA’s permission. Any arbitration award will include costs of the arbitration, reasonable attorneys’ fees, and reasonable costs for witnesses. You and MSBA may enter arbitration awards in any court with jurisdiction. General Terms If a provision of these terms is unenforceable as written, but could be changed to make it enforceable, that provision should be modified to the minimum extent necessary to make it enforceable. Otherwise, that provision should be removed. You may not assign your agreement with MSBA. MSBA may assign your agreement to any affiliate of MSBA, any other company that obtains control of MSBA, or any other company that buys assets of MSBA related to Engage. Any attempted assignment against these terms has no legal effect. Neither the exercise of any right under this Agreement, nor waiver of any breach of this Agreement, waives any other breach of this Agreement. These terms embody all the terms of agreement between you and MSBA about use of Engage. These terms entirely replace any other agreements about your use of Engage, written or not. Contact You may notify MSBA under these terms, and send questions to MSBA, at [email protected]. MSBA may notify you under these terms using the e-mail address you provide for your account on Engage, or by posting a message to the homepage of Engage or your account page. Changes MSBA last updated these terms on April 5, 2019, and may update these terms again. MSBA will post all updates to Engage. For updates that contain substantial changes, MSBA agrees to email you, if you’ve created an account and provided a valid e-mail address. MSBA may also announce updates with special messages or alerts on Engage. Once you get notice of an update to these terms, you must agree to the new terms in order to keep using Engage."
