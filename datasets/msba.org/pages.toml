["https://msba.org/site/content/News-and-Publications/News/General-News/Connecting-Advocating-and-Informing.aspx"]
title = "Connecting, Advocating, and Informing  | Maryland State Bar Association"
description = "The Maryland State Bar Association remains steadfast in its commitment to ensuring the safety of our legal professionals. We continue to collaborate with our members and partners through a legislative Task Force to develop recommendations addressing"
full_description = "November 5, 2024 - by Raphael J. Santini, MSBA President Connecting, Advocating, and Informing MSBA has been busy this fall. We have had several successful Mix & Mingles across the state, part of our ongoing effort to welcome more legal professionals into our membership and provide valuable networking opportunities. Mix & Mingles are informal events that give you a chance to connect with your peers and learn more about the many benefits of MSBA membership. Check the MSBA Events calendar for dates in 2025. I hope you can join us. Judicial and Attorney Security The Maryland State Bar Association remains steadfast in its commitment to ensuring the safety of our legal professionals. We continue to collaborate with our members and partners through a legislative Task Force to develop recommendations addressing ongoing threats. Our partnership with the Judiciary and our support for legislation like the recently passed Senate Bill 575 in Maryland is a testament to our dedication to this cause. Additionally, we are closely monitoring federal legislation (S. 3984/H.R. 8093) designed to help state courts manage the increasing threats of violence against judges, court staff, and the public. Jury Selection The Maryland Judiciary’s Standing Committee on Rules of Practice and Procedure has recommended expanding the purpose of jury examination to ensure fair and impartial juries and to aid parties in using peremptory challenges and challenges for cause. MSBA has been actively involved in this process, with members of our Rules Committee participating in meetings held over the summer by the judiciary’s Special Subcommittee on Voir Dire. In September, the Supreme Court held an open meeting to consider proposed amendments from the Rules Committee to expand voir dire through Rule 2-512 and Rule 4-312. The Supreme Court decided to delay rule changes and instead implement a Pilot Program on expanded voir dire in select Maryland courts, with data collection and recommendations due by January 2026 for comprehensive amendments to Rule 2-512 and Rule 4-312. This fall, the Maryland Judiciary began planning the Pilot Program, with the MSBA serving on the Advisory Board and establishing MSBA’s Special Committee on Voir Dire to provide feedback and resources. As the process continues, we will continue to keep members informed. Professional Excursion Now that the days are shorter, it’s a great time to think about some time in the sun. I hope you’ll consider joining fellow bar members and bar leaders at the 2025 MSBA Professional Excursion in Playa Del Carmen, Mexico. The MSBA Professional Excursion is a great opportunity to learn, connect, take part in a service opportunity, and more while enjoying the colorful streets, beautiful beaches and fine dining that Mexico has to offer. Packages include both three- and five- day stay options as well as a choice between a family-oriented or adult-only resort atmosphere. Thank you for your continued dedication and support. Together, we are making significant strides in enhancing the security and fairness of our legal system. Share this page Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer"
year_published = 2025
