full_description = "Resources & Tools For The Public Resolve a fee dispute, find lawyer referral information and more .innerBannerArea { background-position: center; } Dispute an Attorney Fee The MSBA has jurisdiction to investigate attorneys in all Maryland counties except Baltimore, Montgomery, and Prince George’s counties, as well as Baltimore City. For fee dispute help in these jurisdictions, contact the local bar associations below. You can also reach out to the Committee on Resolution of Fee Disputes for more information. Contact the Committee Find Assistance Local bar associations across Maryland can help you find a lawyer in your area. Contact the designated number for each jurisdiction for more information. Allegany County Anne Arundel County (410) 222-6859 Baltimore City (410) 539-3112 Baltimore County (410) 337-9100 Calvert County Caroline County (410) 479-2570 Carroll County (410) 337-9100 Cecil County (410) 398-7600 Charles County (301) 952-1440 Dorchester County (410) 690-8128 Frederick County (410) 337-9100 Garrett County Harford County (410) 836-0123 Howard County (410) 313-3853 Kent County (410) 690-8128 Montgomery County (301) 279-9100 Prince George’s County (301) 952-1440 Queen Anne County (410) 690-8128 Saint Mary’s County Use Charles or Calvert County Somerset County (410) 651-4960 Talbot County Washington County Find an Attorney Wicomico County Worcester County (410) 641-2999"
