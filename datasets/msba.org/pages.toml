title = "President's Corner  | Maryland State Bar Association"
full_description = '''Leadership President's Corner MSBA President Raphael J. Santini Featured Event MoreInfo2025 Legal Summit & Annual MeetingJune 4 - 6 var contentItemId = '#064e2e935c'; var resultsPerPage = '1'; var hidePageNumbers = 'False'; var displayCards = 'True'; var pageElement = 'section'; jQuery(contentItemId).simplePaginate({ paginateElement: pageElement, elementsPerPage: resultsPerPage, firstButton: false, lastButton: false, prevButtonText: "&laquo;", nextButtonText: "&raquo;", hidePaginationNumbers: hidePageNumbers.toLowerCase().trim(), uniqueId: '064e2e935c', pagerLocation: 'justify-content-center' }); Insights from the MSBA President MSBA Sponsors ABA Resolution on Judicial Security February 10, 2025Recently, MSBA sponsoring Resolution 201 before the American Bar Association (ABA) House of Delegates, sponsoring Resolution 201, which encourages enhanced judicial security. Articles Launching Unfair Personal Attacks Against Maryland Judiciary Must Stop January 28, 2025In an era where Judges are facing rising threats of violence and being murdered in their driveways, over the past week, Chris Papst of Fox 45 News has published several articles with ominous titles about Judge Charles Blomquist and rulings in cases. From the Boardroom: December 2024 December 9, 2024The Board of Governors held a regular meeting in the Senate Chambers of the historic Maryland Statehouse. From the Boardroom: October 2024 November 15, 2024The MSBA Board of Governors met on October 29. Highlights from the meeting include the approval of a Conscious Inclusion policy, support for ABA resolutions on estates and trust law and more. Connecting, Advocating, and Informing November 5, 2024The Maryland State Bar Association remains steadfast in its commitment to ensuring the safety of our legal professionals. We continue to collaborate with our members and partners through a legislative Task Force to develop recommendations addressing From the Boardroom: September 2024 September 19, 2024On Tuesday, September 10, 2024, the MSBA Board of Governors (Board) held its first meeting since its inaugural meeting in June. MSBA President Raphael Santini kicked off the meeting by recapping his goals. MSBA Leads the Way in Advocating for Judicial and Attorney Security July 31, 2024In the wake of Judge Andrew F. Wilkinson’s tragic murder in October 2023, MSBA has taken a proactive stance in championing judicial security. Five Objectives for the Upcoming Bar Year June 18, 2024MSBA President Raphael J. Santini (2024-25) sets forth his goals for the association. Additional Resources Maryland Bar Journal The Maryland Bar Journal brings MSBA members analysis and insight into the topics that matter most to Maryland’s legal community. See All Issues Lawyer Assistance Program Over 40 Years of Help and Hope - The MSBA Lawyer Assistance Program has helped thousands of Maryland lawyers. Learn How We Help! MSBA Advocacy For more than a century, the MSBA has been the voice of lawyers across the state, from nearly every practice area, career stage, and demographic. Learn More About MSBA's Advocacy'''
