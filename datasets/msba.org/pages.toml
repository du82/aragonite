full_description = '''.innerBannerArea { background-position: 100% 66%; } Learning & Events The ultimate value of association membership Search All Learning Products Add SearchSearch Area: Events Products Skip to search results The Maryland State Bar Association provides learning and networking opportunities all year round for professionals across practice areas and career stages. Online and in-person CLE programs are accredited with Virginia, Pennsylvania, and Delaware. Live Learning On-Demand Learning Networking Events Section Learning & Networking Events Connections Legal Excellence Week/ Solo-Summit Legal Summit & Annual Meeting Live Learning Our best-in-class instructors offer learning opportunities through an array of both in-person and live online events, giving you the opportunity to delve deeper into the practice content that matters most to you. Whether it is in a classroom setting or through our online learning portal, MSBA strives to provide you with the learning experience that best meets your needs, wherever you are. Shop Live Learning On-Demand Learning Our On-Demand Catalog is always available to you, 24/7, bringing a range of hundreds of courses across a wide variety of topics in all practice areas. Peruse the courses and learn at your convenience. And as a member, you have complimentary access to this collection. Shop On-Demand Learning Networking Events Who you know matters. MSBA offers a wealth of ways to connect with people in your practice area or Section, as well as across the profession and state. The stronger your network, the stronger your practice. We welcome you to join us. Loading Output MoreInfoMix & Mingle: Montgomery CountyMarch 6 Rockville MoreInfoAlternative Dispute Resolution Career and Practice ForumEditMarch 11 Baltimore MoreInfoEstate & Trust Law Section's Spring Diversity MixerMarch 18 Columbia MoreInfoCriminal Law Section Heeney Award PresentationMarch 19 Columbia MoreInfoLeadership Academy Open HouseMarch 20 Columbia MoreInfo