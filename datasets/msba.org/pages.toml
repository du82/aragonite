title = "For Members  | Maryland State Bar Association"
full_description = "For Members MSBA is the home of the legal profession in Maryland Be a part of the MSBA Community! The Maryland State Bar Association empowers its members with resources, opportunities and a strong sense of community to succeed in their practice while promoting ethical standards and advancing the cause of justice for all. When you join the MSBA, you gain access to limitless resources and everlasting value; assist in amplifying the voice of the legal community across the state. Sections create connections between MSBA members within shared practice areas across the legal profession. When you join the MSBA, you’ll also have the opportunity to register for any of our 22 unique practice area-driven sections, and 3 specialized affinity groups. These “sections” are where MSBA members do the work: share news and resources, learn from each other via regular events and CLE programming, and actively engage in the profession through discussion groups and newsletters. Learn more Grow the profession by being involved with the Committee or Task Force. Member-led Committees and Task Forces shape the MSBA experience by adding value and effectiveness to our organization. Learn more about any of our initiative-based Committees and Task Forces and reach out to their respective chairs for more information on how to get involved. Learn more Member Benefits Career Center Visit MSBA’s Career Center to utilize the complimentary resume review for MSBA Members! Peruse or post on our job boards. Health & Wellness A healthy profession is a successful profession. The Maryland State Bar Association, through its Lawyer Assistance Program. MSBA Engage MSBA ENGAGE allows you to connect with other members, gain support from other practitioners and get the most out of your MSBA membership. Member Directory MSBA’s Member Directory is designed to provide contact and membership information on attorneys and legal professionals who are members of the MSBA. Attorney Security Pass Courthouse identification improves security and saves you time. Get your MSBA Attorney Security Pass here. Ethics Hotline & Opinions Your link to the latest ethics opinions and resources. Learning MSBA strives to provide you with the learning experience that best meets your needs, wherever you are. Discounts & Complimentary Services Additional value for your membership from services like Decisis and Smokeball. Questions about membership? Contact us, we're here to help MSBA Membership Team [email protected] 410-685-7878 x3016"
