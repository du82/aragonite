["https://msba.org/site/content/News-and-Publications/News/General-News/From-the-Boardroom-Oct-2024.aspx"]
title = "From the Boardroom: October 2024  | Maryland State Bar Association"
description = "The MSBA Board of Governors met on October 29. Highlights from the meeting include the approval of a Conscious Inclusion policy, support for ABA resolutions on estates and trust law and more."
full_description = "November 15, 2024 - by Anna Sholl From the Boardroom: October 2024 On Tuesday, October 29, 2024, the MSBA Board of Governors (Board) held a virtual meeting. MSBA President Raphael J. Santini started the meeting with a recap of recent American Bar Association (ABA) events, including the Mid-Atlantic Bar Conference and the Southern Conference of Bar Presidents. MSBA has long participated in these conferences to exchange ideas and collaborate with other state bar leaders. Following this recap, the Board considered a number of action items, including approving the schedule for the 2025 Legal Summit & Annual Meeting. The Board also considered two new policy proposals. The first, governing social media use, was discussed at length. Board members offered feedback and tabled a vote on the policy to allow staff to update it with the feedback provided. The Board also received a presentation on a Conscious Inclusion policy for MSBA programming and content. The policy's goal is to ensure that MSBA casts a wide net and encourages diverse perspectives in its content development. The policy encourages inclusivity in terms of faculty and author selection, ensures content is developed with accessibility needs in mind, and aligns with MSBA’s Diversity, Equity, and Inclusion Plan adopted in 2021. The Board approved the policy. In addition, the Board considered two proposed ABA resolutions for the upcoming mid-year meeting in January/February 2025. The first resolution was presented by Anne Coventry, one of MSBA’s ABA Delegates, a past Board member, and a past-chair of the Estates & Trust Law Section. The resolution aims to include estates and trust law on the NextGen Bar exam, which will supplant Maryland's Uniform Bar Exam (UBE) in 2026. In support of the resolution, Coventry explained the need for more competent attorneys in the area of estates and trust law, given the “Great Wealth Transfer” and aging population, the current shortage of estates and trust Law practitioners, and the need to provide services to traditionally underserved populations. The Board voted in support of the resolution. MSBA’s ABA Delegation also proposed a resolution on judicial security. With this resolution, President Santini continues the work of Past President Jason DeLoach to enhance judicial security. The resolution urges state and local governments to adopt legislation similar to the Judge Andrew F. Wilkinson Judicial Security Act, which was passed in 2024 following the tragic murder of Judge Wilkinson. More specifically, the resolution urges state and local governments to identify minimum requirements for courthouse safety, review the current state of courthouse safety in light of these minimum requirements, and implement legislation and other actions to rectify any deficiencies in courthouse safety. The Board voted in support of the resolution. Finally, the Board considered some updates to MSBA’s Advocacy Program. Two initiatives proposed by President Santini were presented to the Board, approved, and will now be included in the Advocacy Program. The first initiative focuses on expanding access to language and disability services. The Board adopted a “support” position, thus allowing MSBA to actively advocate for expanded services. The second initiative concerns the judicial retirement age. The Board adopted a “monitor” position, which means the Laws Committee will monitor legislation for any proposed changes to the judicial retirement age and make recommendations as to MSBA’s advocacy efforts if such legislation is proposed. The next meeting of the Board is on Tuesday, December 3, 2024. Share this page Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer"
