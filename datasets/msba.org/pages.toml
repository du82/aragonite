title = "MSBA Membership  | Maryland State Bar Association"
full_description = "MSBA Membership Explore MSBA Membership Offerings Review the membership options available at MSBA. We cannot wait to welcome you! If you have any questions, please contact our Member Services Center via the chat in the lower right-corner of the screen. Judicial Membership As a member of the judiciary, you can enjoy all that MSBA has to offer, including the Bench-Bar Section and MSBA’s countless opportunities to teach, learn, and socialize professionally in non-judicial settings. Join as an Attorney / Judicial Member Paralegal Membership Joining MSBA’s Paralegal Task Force is a great entry point to MSBA if you are, or studying to become, a paralegal. The Task Force’s mission is to advance and promote the paralegal profession with support from MSBA. Join as a Paralegal Member Allied Professional Membership Keeping your finger on the pulse of the legal community’s dynamic and ever-evolving landscape is a great reason for you to join MSBA. If you are a professional who is employed by a law firm, government office, or a legal services organization that provides legal representation to clients, then you are an Allied Legal Professional. Join as an Allied Professional Member Student Membership Are you in law school? Join the MSBA for free to get a head start on understanding and enjoying how membership can advance your career and employment goals. Join as a Student Member Passport Membership As a Passport Member, not only can you enjoy all the benefits enjoyed by all MSBA members, you are also entitled to free in-person CLEs, full access to virtual CLEs of any length, and free registration for our signature multi-day events, including the annual Legal Summit in Ocean City. Each of the membership offerings include an option for Passport Membership. Newly Admitted Attorney Membership As a new attorney who is admitted to the State of Maryland, you are entitled to a free membership for your first year in practice so you can learn about the career development opportunities MSBA offers. Enrolling in an Attorney Membership is the best way for you to keep up with developments in the law, build your network, enjoy the camaraderie of your peers, and develop professionally. Attorney Membership Enrolling in an Attorney Membership is the best way for you to keep up with developments in the law, build your network, enjoy the camaraderie of your peers, and develop professionally. There are two kinds of Attorney Memberships — one for attorneys who have been admitted to practice one to five years, and one for attorneys who have been admitted to practice for more than five years. Join Sections If you are already an MSBA Member and you want to add sections to your membership, click the button below. Join Sections"
