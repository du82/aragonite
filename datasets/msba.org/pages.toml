nch & Learn When: March 5, 2025 Environment & Energy Section Lunch & Learn When: March 21, 2025 Estate & Trust Law Section Study Group Meeting When: March 20, 2025 Estate & Trust Law Section Study Group Meeting When: April 24, 2025 Estate & Trust Law Section Study Group Meeting When: May 15, 2025 Estate & Trust Law Section Study Group Meeting When: June 26, 2025 Family Law Trial Evening Series: The MSBA Family Law Section is excited to offer this four-part masterclass in monthly two hour sessions beginning January 29, 2024. This program will cover topics from client selection to closing arguments.When: January 29, 2025 Family Law Trial Evening Series: From Client Selection to Cl The MSBA Family Law Section is excited to offer this four-part masterclass in monthly two hour sessions beginning January 29, 2024. This program will cover topics from client selection to closing arguments.When: February 26, 2025 Family Law Trial Evening Series: From Client Selection to Cl The MSBA Family Law Section is excited to offer this four-part masterclass in monthly two hour sessions beginning January 29, 2024. This program will cover topics from client selection to closing arguments.When: March 26, 2025 Family Law Trial Evening Series: From Client Selection to Cl The MSBA Family Law Section is excited to offer this four-part masterclass in monthly two hour sessions beginning January 29, 2024. This program will cover topics from client selection to closing arguments.When: April 30, 2025 Estate Administration Series with Allan Gibber Join the MSBA for an all virtual presentation of Estate Administration Series with Allan Gibber starting on Wednesday, May 7, 14, 21, 28, and June 11, 18, 2025 from 10 a.m. - 12 p.m.When: May 7, 2025 Estate Administration Series with Allan Gibber Join the MSBA for an all virtual presentation of Estate Administration Series with Allan Gibber starting on Wednesday, May 7, 14, 21, 28, and June 11, 18, 2025 from 10 a.m. - 12 p.m.When: May 14, 2025 Estate Admi