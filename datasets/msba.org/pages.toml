["https://msba.org/site/site/content/Resources-and-Tools-Content/Health-and-Wellness.aspx"]
title = "Health and Wellness  | Maryland State Bar Association"
full_description = "Resources & Tools Health & Wellness Practicing law is a vital public service. Too often, it also takes a physical and emotional toll. .innerBannerArea { background-position: center; } We envision a membership in which every lawyer of the MSBA is provided with the support and education needed to achieve optimal overall health and wellness. Our overarching goal is to enhance health and wellness so lawyers can better serve themselves, as well as others within their personal and professional lives. Contact us for help at our confidential, toll-free line. 1-888-388-5459 Access Emergency Resources Here Over 40 Years of Help and Hope The MSBA Lawyer Assistance Program has helped thousands of Maryland lawyers. Lawyers, like anyone else, face stress, burn out, and depression. Too often, they don’t have anywhere to turn before the problem gets worse, and a career and life are lost to substance abuse, mental health, or other personal problems. The Lawyer Assistance Program is available to all lawyers in Maryland and provides free, confidential assistance to lawyers, judges, law school students and support staff by offering virtual assessment, referral, short-term counseling, and continued support to ensure long term success. We offer a network of counselors that can assist you no matter what state you are living in. Contact the Lawyer Assistance Program for free, confidential help at 1-888-388-5459 Lisa Caplan, LCSW-C, Director | 443-703-3042 | [email protected] Financial Assistance Available The Lawyer Assistance Program offers financial assistance for Mental Health and Addiction treatment. Referring to the Lawyer Assistance Program If you are concerned about another lawyer, you can make an anonymous referral to the Lawyer Assistance Program. How We Help Physical Health Supporting a stronger profession. MSBA members have access to programs to support physical health and help them be their best. We provide workshops and training on topics that every lawyer can benefit from. Members have instant access to these services through our member publications, digital correspondence, and online. Emotional Health Free, confidential support & referrals. We have resources to help. We have experience with issues including: Depression Alcohol & Drug Abuse Marital & Family Problems Stress & Burnout Addiction Eating Disorders Work/Life Balance Contact the Lawyer Assistance Program for free, confidential help: 1-888-388-5459 12 Step AA Meeting Thursdays from 6:30 PM – 7:30 PM Legal Professional Group For more details, click here. Contact David Ledyard if you have any questions. Professional Health Finding balance to succeed in work and life Technical skills are not enough. Success in the legal profession requires a healthy relationship between you and your work. MSBA promotes wellness initiatives designed to boost your productivity and well-being. Stress Management Professional Trends Starting & Succeeding in Practice Communication Soft Skills Leadership What do you really have control over? Understanding Circle of Concern vs. Circle of Control February 20, 2025In our daily lives, we constantly juggle concerns and responsibilities, many of which lie beyond our control. To help navigate this complexity, it's useful to understand the difference between the Circle of Concern and the Circle of Control. How the Trauma Your Clients Experience Impacts You December 3, 2024Secondary trauma is described as “the cumulative physical, emotional, and psychological effects of being continually exposed to traumatic events or stories while working in a helping capacity.” How to Better Handle Overwhelming Emotions July 21, 2024Often when we are overwhelmed we can feel emotional, become paralyzed and not sure how to move forward. We may think that we shouldn’t feel that way, hold it in hoping it will resolve itself, which only adds additional stress. The power of hydration May 24, 2024When was the last time you had a sip of water? If you’re struggling to remember, then you’re not alone. Mental Health Emergency Resources May 24, 2024Mental Health Emergency Resources Turn off Your Notifications May 8, 2024Reduce your stress by turning off your notifications. Not just for work but in your personal life too. Engage: Monthly Women’s Support Group May 1, 2024I’m Lisa Caplan, the Director of the MSBA’s Lawyer Assistance Program. Our Women’s Support Group was so successful we are continuing monthly starting next Tuesday, May 14th at 12:00PM and continuing until the end of the year on the 2nd Tuesday of the What is Resilience? April 15, 2024Now more than ever developing resilience is so important. Resilience is the ability to bounce back and recover from a change or hardship quickly without being overwhelmed or acting in harmful ways. ScreenNOW: A Confidential Online Mental Health Screening Tool for MSBA Members March 13, 2024Legal professions are under constant stress, and the demanding nature of legal work, coupled with high expectations and long hours, can take a toll on mental health and wellbeing. Yet, despite the fact that many legal professionals face mental health Do you want to help decrease your stress and improve your overall wellness February 19, 2024Water makes up a significant portion of our body composition, and staying hydrated is crucial for maintaining overall health and well-being. Next Could You Use Our Help? Wondering whether you could benefit from help provided by the Lawyer Assistance Program? Take our quick self assessment to find out. Take Self-Assessment You must accept cookies to view this content. National Suicide Prevention and Depression Save someone’s life. Take the time to watch a very powerful video created by the Texas Lawyer Assistance Program for the Legal Profession to help prevent lawyer suicide and understand depression. If you or someone you know is experiencing suicidal thoughts, view emergency resources here. Interested in volunteering with the Lawyer Assistance Program? Volunteers help us reach lawyers across the state through the Lawyer Assistance Program. Fill out the form below and send it to one of our staff. You can also contact our team at any time with questions about volunteering. Download Application Form Who We’ve Worked With We collaborate with schools, public officials, and private firms & practices to promote wellness and balance across the legal profession. Law Schools Office of the Attorney General MSBA Sections & Committees Pro Bono Resource Center Office of the Public Defender Local & Specialty Bars Direct Staff Contact: Lisa Caplan, LCSW-C Director, Lawyer Assistance Program [email protected] (443) 703-3042 Additional Lawyer Assistance Program Contacts Reach out to any of the LAP committee members for assistance. View Committee"
year_published = 2025
