["https://msba.org/site/site/content/Members/Legal-Research.aspx"]
title = "Legal Research  | Maryland State Bar Association"
full_description = "Legal ResearchMSBA Membership pays for itself with access to top industry legal research resources! The Maryland State Bar Association offers Decisis as a complimentary legal research member benefit ($1,740 value). Decisis shares the same parent company as LexisNexis® and offers an expansive library which includes both state and federal cases, statutes, court rules, and more. Decisis provides MSBA Members with an easy-to-use interface, a reliable citator, and 7 day a week live customer support. Through April 30, 2025, MSBA members will continue to have access to Fastcase, our legacy legal research provider. Why did MSBA switch? A focus group of solo/small firm users preferred Decisis to Fastcase Expanded nationwide database in Decisis v. Maryland-only in Fastcase InterCite (the Decisis Citator) provides the most effective and reliable search relevance Decisis provide a clean, easy to navigate user interface Enter Decisis Enter Fastcase The comprehensive & reliable legal research database you’ve been looking for. Decisis is included, at no additional cost, for all MSBA members. Search Designed for Efficiency & Accuracy Poor UI, search filtering, and search relevance can put an ocean between you and the single case you need to support your argument. With Decisis, you get a streamlined legal research solution with tailored search filters to pull highly relevant results from a massive primary law database A Citator You Can Take to Court Decisis uncovers the citations that can stand up to the scrutiny of the judge. If it comes up on Decisis, you can have the confidence it’s good law. Good Looks and Substance, Too Decisis is clean and intuitive, and is loaded with what matters most: content. With Decisis, you will receive access to federal and state case law, codes, regulations, select premium agency decisions and more. Decisis Training On-Demand You’re busy. We get that. Training on the Decisis® platform needs to happen when it’s convenient for you. Check out the videos below to get started. Not a fan of videos? Check out the support center for quick reads about Decisis and its functionality. Decisis Support Resources"
