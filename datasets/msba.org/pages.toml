title = "Staff  | Maryland State Bar Association"
full_description = ".row:has(.col-sm-2):has(img) { margin-bottom: 50px; border-bottom: 1px solid #ccc; } .row:has(.col-sm-2):last-child, .row:has(.col-sm-2):nth-last-child(2) { border: 0; } .FullWidthArea-StyleBg1 img { object-fit: cover; height: 235px!important; width: 100%!important; object-position: center; } @media (max-width:767px) { .FullWidthArea-StyleBg1 img { height: 350px!important; } } Staff Meet the MSBA Team MSBA staff are committed to helping you make the most of your membership. We have years of collective experience working for and assisting Maryland’s legal community. If you have any questions about MSBA membership, including benefits, events, or other services, please feel free to contact us. Administration Anna S. Sholl, Esq. Executive Director Anna Sholl, Esq. is the Executive Director of the MSBA. Anna joined MSBA in March 2018, and previously served as MSBA’s Chief Operating Officer. In that role, she worked on a variety of initiatives, including strategic planning, governance reform, revamping MSBA’s core events, and improving overall operational efficiency. Anna graduated from the University of Baltimore School of Law, summa cum laude, and is an attorney admitted to practice in Maryland. As an attorney, Anna has experience in both small and large firms, and her practice included general/commercial litigation and family law. While in law school, Anna participated in the Community Development Clinic as a Rule 16 attorney advising clients on issues related to the development of tax exempt organizations and cooperatives. In March 2023, Anna received her MBA from University of Maryland Global Campus, and is currently pursuing her Certified Association Executive (CAE) designation from the American Society of Association Executives (ASAE). 410-685-7878 x3026 [email protected] Patricia Stockland Chief Content Officer Patricia Stockland is the Chief Content Officer for the MSBA and is responsible for shaping the strategic direction of product offerings to support the community. Her expertise spans creative work and continual improvement across operations. Patricia has led change and growth initiatives as founder and CEO of Kind World Publishing and Consulting, LLC, publisher for Capstone, VP and editor in chief for Lerner Publishing Group, and editorial director for Red Line Editorial, among other roles. She’s authored more than 80 children’s books and edited and concepted numerous others. Patricia holds an M.A. in Literature, a B.A. in English, and a mini-MBA in marketing management, as well as minors in Spanish and European Studies. 410-685-7878 x3100 [email protected] Theresa Michael Executive Assistant and Governance Administrator Theresa is the Executive Assistant and Governance Administrator. Her responsibilities include providing administrative support to the Executive Director, Board of Governors, Executive Committee as well as other various committees. Theresa has over 30 years experience working at MSBA. Her previous role was Meeting Coordinator where she worked closely with the Sections and Committees scheduling meetings and programs. 410-685-7878 x3017 [email protected] Program & Content Shaoli S. Sarkar, Esq. Director of Advocacy & Government Relations Shaoli S. Sarkar, Esq. is the Director of Advocacy & Government Relations. She coordinates the MSBA’s public advocacy on behalf of over 42,000 attorneys and legal professionals at the administrative, local, state, and federal level, including protecting the profession, promoting the rule of law, and securing access to justice for Marylanders. She ensures positive and effective relations between the State Bar and the Legislature, Executive Branch, Judicial Branch, partners, and stakeholders. 410-685-7878 x3010 [email protected] Jesse Miller Chief Marketing Officer Jesse Miller is the Chief Marketing Officer of the MSBA. She has over 10 years of experience in marketing, communications, social media and events within the non-profit sector in Baltimore. Jesse is a masterful storyteller through many different mediums honed through her years as a professional in the performing arts. Her favorite stories to craft are that with her wonderful husband, three kids at their home in Baltimore City. 410-685-7878 x3096 [email protected] Bob Bershad, Esq. Director of Membership Bob manages all aspects of membership growth, retention, and engagement. He leads a team that develops and implements strategies to attract new members, enhance member satisfaction, and foster strong relationships with existing members. He also leads implementation of IT infrastructure initiatives to improve operational efficiency, drive innovation, and optimize online membership experience. 443-703-3011 [email protected] Angela Munro Associate Director of Member Engagement Angela Munro is the Associate Director for Member Engagement. Angela graduated from the University of Baltimore with a BS in Criminal Justice Degree, and she also has a paralegal degree from Harford Community College. Angela has been with MSBA for over 10 years. 410-685-7878 x3016 [email protected] Katie Flynn Social Media & Email Specialist Katie Flynn is the Social Media and Email Specialist. Her background is in marketing, sales, and small business administration. She is passionate about content creation and effective communication. Katie graduated from Caldwell University with a degree in Communication Arts & Political Science. She is pursuing a graduate degree in Communication with a concentration in Digital Media. 410-685-7878 x3041 [email protected] Tricia RustSection & Committee CoordinatorTricia Rust is the Section & Committee Coordinator responsible for planning and managing meetings, events, and webinars.Tricia has experience with non-profits, education, and as a real estate paralegal. She graduated with a BA in Sociology from the University of Colorado and a MA in Education.[email protected]410-685-7878 x3015 Autumn Smith Member Data & Systems Specialist Autumn Smith assists members with renewing memberships, provides information about MSBA and member benefits, and ensures account information is up to date. Autumn graduated from the University of Maryland, Baltimore County with a BS in Financial Economics. She has a background in mathematics and is pursuing further education in Finance and Accounting. 410-685-7878 x3012 [email protected] Beth Salsgiver Hunt Member Services and Recruitment & Retention Specialist Beth was born and raised in a small town outside of Pittsburgh. She earned her Bachelor’s Degree from Indiana University of Pennsylvania in Criminology with a minor in Sociology, Magna Cum Laude in 1998. Then, she relocated to Maryland and began her legal career with the Circuit Court for Prince George’s County. After serving seventeen years with the Court, she spent three years as an executive legal assistant at a private practice elder law firm and had the opportunity to solidify many professional and personal contacts in jurisdictions throughout the state. Having supported judges, magistrates and attorneys in every step of her career journey, from the outside and the inside, membership services comes naturally for Beth. 410-685-7878, ext. 3033 [email protected] Shanun Jones Project & Governance Administrator Shanun Jones serves as the Project & Governance Administrator at the MSBA, where she commenced her role in September 2023. With a career spanning over seven years, she has a rich background in communications project management, media content development, and program management across corporate and non-profit sectors. As a PMI-certified project manager, Shanun excels in leading projects from their initial requirements definition to final deployment. Her skill set encompasses the identification of project schedules, scopes, and the development of comprehensive implementation plans, with a strong focus on effective risk mitigation strategies. 443-703-3021 [email protected] Jessica Young Video Streaming Coordinator Jessica Young has been working with the MSBA since January 2021. She assists in video streaming services provided by the MSBA as well as assisting in video related content for social media and various projects throughout the MSBA. Jessica has experience working with nonprofits and commercial organizations in creating Video and Photography related content for social media, events and marketing. 443-703-3014 [email protected] Jamal Adjamah Graphic Designer Jamal Adjamah is the Graphic Designer for the MSBA. His experience includes a number of creative roles in college athletics, university communications, professional associations and sports agencies. Jamal holds an MFA with a concentration in Graphic Design from Jacksonville University. 443-703-3022 [email protected] Schuyler ZinserMarketing SpecialistSchuyler Zinser is the Marketing Specialist. He supports all communication efforts and initiatives related to MSBA and assists with major communication initiatives for our partners, Maryland Access to Justice Commission and Maryland Bar Foundation. Schuyler is responsible for executing multi-channel marketing strategies focusing on email marketing, social media management, content creation, and analytics to support MSBA and its partners. He plays a crucial part in engaging MSBA's audience across various platforms and contributing to data-driven marketing decisions. Schuyler has 8 years of experience as a marketer, with a background in arts and education. He received his Bachelor’s Degree in Fine Arts from Eastern Connecticut State University, and a Master’s Degree in Education from Sacred Heart University. 410-685-7878 x3019[email protected] CLE – Learning & Publications Andrea C. Terry, Esq. Director of Learning Andrea C. Terry, Esq. is the Director of Learning, having founded the MSBA’s Continuing Legal Education (CLE) department in 2010. Her work includes delivering timely and essential educational opportunities for all Maryland lawyers, which she began doing as the Chief Program Attorney for MICPEL before joining the MSBA. Prior to that, she spent more than a decade helping to shape the field of alternative dispute resolution (ADR) in Maryland, serving as a founding member of Chief Judge Robert M. Bell’s ADR Committee, a founding member of Community Mediation Maryland’s board, the Quality Assurance Manager for the District Court of Maryland’s ADR Office, and the founding manager of the Harford County Community Mediation Program. She was also a founding committee member and trainer for the Maryland Program for Mediator Excellence (MPME) with the Maryland Judiciary, helping to develop the mediator mentoring component of the MPME. She has been a mediator for more than 20 years, having completed more than 200 hours of mediation training in the facilitative and transformative models, and is a past chair of the MSBA ADR Section. Andrea received her B.A. from Virginia Tech, and her J.D. from the University of Baltimore School of Law. 410-685-7878 x3060 [email protected] Criselle Anderson Educational Program Assistant Criselle Anderson is the Educational Program Assistant for the Learning and Publications Department. She is responsible for the coordination and facilitation of the continuing legal education programs as well as reporting and maintaining compliance with MCLE (Mandatory Continuing Legal Education) surrounding states. Before joining the MSBA, Criselle worked as a paralegal at a firm specializing in Elder Law, Estates and Trusts. She has previous experience with compliance and reporting to the AIA (American Institute of Architects) for continuing education. She has a background in the fine arts and graphic design. 410-685-7878 x3062 [email protected] Colleen Aracri, Esq. Legal Content Attorney Colleen Aracri is a Legal Content Attorney. She writes and edits materials covering numerous topics for MSBA members, including informational articles, practical resources, marketing for continuing legal education, and profiles of attorneys and organizations. Prior to joining the MSBA, Colleen worked for eleven years as a litigator, focusing on the defense of companies and individuals in personal injury and property damage claims. She has over a decade of experience in print and online publishing as well, including editing medical licensing and education products and writing websites, blogs, and articles across a variety of practice areas for law firms throughout the country. Colleen graduated from Villanova University with a BA in English and received her JD from the Duquesne University School of Law. 443-703-3031 [email protected] Pamela Langham, Esq. Legal Content Attorney Pamela E. Langham is a former general counsel, interim general counsel and nationally recognized in-house counsel for a Florida public university. Before becoming general counsel, Pam represented Fortune 50 and 500 companies and public agencies defending employment matters and providing advice and counsel on a variety of issues. She was appointed by the Governor of Florida twice to serve on the First Judicial Circuit Nominating Commission and served as both chair and vice-chair of the commission. As counsel, Pam enjoys solving problems for her clients. Pam currently conducts Title IX and EEO investigations for universities and federal agencies. A former Rotary President, Pam enjoys serving the community, reading, exercising and gardening. Pam attended law school at the Mississippi College School of Law and has been licensed to practice law in the State of Florida since 1991. She obtained her Bachelor of Arts degree in Political Science from the University of New Orleans. 443-703-3068 [email protected] Nathan Levin Member Services Specialist Nathan Levin responds to member inquiries and fulfills member requests in connection with the full range of MSBA operations and product and service offerings. He also works in tandem with the Learning and Publications teams to support the production of in-person and online events and processes sales of electronic and hardcopy practice manuals and legal treatises. 410-685-7878 x3063 [email protected] Lawyer Assistance Program Lisa Caplan, LCSW-C Director of the Lawyer Assistance Program Lisa Caplan, LCSW-C is the Director for the Lawyer Assistance Program. Lisa provides oversight of the program as well as outreach and training on a variety of wellness topics. Lisa has over 25 years of experience in her field, and extensive experience working with lawyers and judges in the areas of mental health, substance abuse, and trauma, as well as managing an employee assistance program for the federal courts. Lisa graduated from the UMAB School of Social Work with an MSW and a Specialization in Employee Assistance Programs. She is a Licensed Certified Social Worker at the Clinical Level (LCSW-C). 410-685-7878 x3042 [email protected] Maryland Access to Justice Commission Reena K. Shah, M.P.A., J.D. Executive Director A long-time advocate of social justice and social change, Reena is the Executive Director of "
