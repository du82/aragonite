["https://msba.org/site/content/News-and-Publications/News/General-News/Introducing-Decisis-A-New-Legal-Research-Benefit-for-MSBA-Members.aspx"]
title = "Introducing Decisis: A New Legal Research Benefit for MSBA Members  | Maryland State Bar Association"
description = "MSBA is excited to announce Decisis, an online legal research tool, is now available as an exclusive member benefit."
full_description = "February 28, 2025 - by MSBA Staff Introducing Decisis: A New Legal Research Benefit for MSBA Members MSBA is excited to announce Decisis, an online legal research tool, is now available as an exclusive member benefit. This powerful resource provides access to an expansive legal database, offering state and federal cases, statutes, court rules, and more—all in a streamlined and user-friendly platform. What is Decisis? Decisis is a comprehensive legal research database backed by the same parent company as LexisNexis®. It delivers highly relevant search results, an intuitive interface, and a reliable citator, ensuring that MSBA members can find and validate legal authority with confidence. The platform is designed to make research more efficient, accurate, and accessible, helping attorneys save time and enhance their legal practice. Why Decisis Stands Out Legal research can be time-consuming, and outdated or unreliable results can impact case strategy. Decisis eliminates these challenges with a robust yet simple interface that focuses on accuracy and ease of use. With tailored search filters, attorneys can quickly pinpoint key cases, statutes, and regulations without wading through unnecessary results. The Decisis citator adds another layer of reliability by ensuring that cited cases remain good law, providing attorneys with confidence when referencing legal authorities in court. With a clear and structured interface, Decisis makes legal research more intuitive, allowing MSBA members to spend less time searching and more time strategizing. Exclusive Access for MSBA Members While Decisis typically costs $1,740 per year, MSBA is offering complimentary access to all members as part of its commitment to enhancing professional resources. This exclusive benefit is designed to support attorneys at every stage of their practice—whether conducting quick case law checks or engaging in deep statutory analysis. How to Get Started MSBA members can begin using Decisis today by visiting MSBA’s Legal Research page to learn more about the platform, watch tutorial videos, or sign up for a live training session. If you need assistance, Decisis offers live customer support seven days a week at (833) 332-4747. With Decisis, MSBA members now have a powerful legal research tool at their fingertips—one that is fast, reliable, and built for modern legal practice. Take advantage of this new member benefit and experience a smarter way to research. Share this page Share on FacebookShare on X (Twitter)Share on LinkedInEmailMore options BookmarksGoogle+MySpaceRedditStumbleUponTumblrYammer"
year_published = 2025
