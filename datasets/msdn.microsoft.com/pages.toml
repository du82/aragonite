["https://msdn.microsoft.com/en-us/certifications/posts/docs"]
title = "Microsoft Learn: Build skills that open doors in your career"
description = '''
Meet inspirational learners from the community
				
						
							
								
									
										
											
												
											
										
										
											Ricardo Lessa
											Pre-sales engineer
										
									
									"I was able to believe again in the possibility of starting over, updating myself, and returning to the IT market."
										Read Ricardo's story
								
							
						
						
							
								
									
										
											
												
											
										
										
											Jacqueline Ye
											Product manager
										
									
									"I want others to know that with some hard work, dedication, and having an always be learning mindset, you can have a fullfilling career."
										Read Jacqueline's story
								
							
						
						
							
								
									
										
											
												
											
										
										
											Charles-Henri Sauget
											Data platform and technical leader
										
									
									"Certifications have really helped me earn my customer's trust as a consultant."
										Read Charles-Henri's story'''
full_description = '''Learn by doing Gain the skills you can apply to everyday situations through hands-on training personalized to your needs, at your own pace or with our global network of learning partners. Take training Find technical documentation Get tools and step-by-step guidance to help you get the most from Microsoft products such as Azure, Windows, Office, Dynamics, Power Apps, Teams, and more. View documentation Showcase your skills Advance in your career by completing challenges that demonstrate your expertise. Earn globally recognized and industry-endorsed certifications, and showcase them to your network. Get certified Ask questions and get help Connect with other learners and experts, ask and answer questions, share resources, and learn together. Explore Q&A Try code samples Test out new capabilities in your own projects faster and easier with code samples that bring Microsoft technology to life. See samples See new ways to innovate Discover thousands of fun, authentic, and informative videos by Microsoft and community experts that help you and your team find inventive ways to use technology. Watch shows 15% On average, certified employees earn 15 percent more than those without certification. Why get certified? 61% Upon earning a certification, 61 percent of tech professionals say they earned a promotion. 2021 Pearson VUE Value of IT Certification 90% Microsoft-certified developers are 90 percent more productive and nearly 60 percent more efficient. Why get certified? Ricardo Lessa Pre-sales engineer "I was able to believe again in the possibility of starting over, updating myself, and returning to the IT market." Read Ricardo's story Jacqueline Ye Product manager "I want others to know that with some hard work, dedication, and having an always be learning mindset, you can have a fullfilling career." Read Jacqueline's story Charles-Henri Sauget Data platform and technical leader "Certifications have really helped me earn my customer's trust as a consultant." Read Charles-Henri's story'''
author = "wibjorn"
year_published = 2025
clearnet = "https://msdn.microsoft.com/en-us/certifications/posts/docs"
