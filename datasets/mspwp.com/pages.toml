["https://mspwp.com/wordpress-wednesdays"]
title = "WordPress Wednesdays - Minneapolis St. Paul WordPress User Group"
description = "WordPress Wednesdays is a group of Coco members who are WordPress enthusiasts who sit together to co-work once a week. Some of us are WordPress pros and others are beginners.  The only prerequisite is you have at least a loose interest in WordPress, and can pick up and work from anywhere. We are back into…"
full_description = '<iframe style="border-width: 0;" src="https://www.google.com/calendar/embed?showNav=0&amp;showDate=0&amp;showPrint=0&amp;showTabs=0&amp;showCalendars=0&amp;showTz=0&amp;mode=AGENDA&amp;height=230&amp;wkst=1&amp;bgcolor=%23ffffff&amp;src=oifvo4iol9qj5boli96ad7sqoo%40group.calendar.google.com&amp;color=%23691426&amp;ctz=America%2FChicago" width="100%" height="225" frameborder="0" scrolling="no"></iframe>WordPress Wednesdays is a group of Coco members who are WordPress enthusiasts who sit together to co-work once a week. Some of us are WordPress pros and others are beginners. The only prerequisite is you have at least a loose interest in WordPress, and can pick up and work from anywhere.We are back into meeting in person regularly again. If you plan to join us please check the google calendar to find out where we are meeting. We try to keep that updated.On the 1st, 2nd, and 5th Wednesdays we meet at Coco Northeast, On the 3rd and 4th Wednesdays we meet at Coco Downtown - see schedule above for changes to the schedule. There is no formal agenda - just sit at the table with us and get some work done! We also go out to lunch, have game nights, holiday parties, and such.IMPORTANT NOTE: You absolutely must go through the normal Coco channels to join us with your own membership. Learn more about Coco memberships.To be notified of schedule changes and/or to email the group, join the MSP WordPress Wednesdays Google Group. To request to be added to the group, or for general questions about WP Wednesdays, contact Barbara at https://wizzywigdesign.com or Toby at https://themightymo.com/We are sort of an unofficial subset of the Minneapolis St Paul WordPress Users Group.'
year_published = 2025
year_updated = 2024
