description = "MEET WORDPRESS ENTHUSIASTS IN MINNEAPOLIS & ST. PAUL! Welcome to the amazing hub of Minneapolis St. Paul WordPress Users!  On this site you will find ways to connect in person and online to sharpen your WordPress skills, get connected/build community, see what other people are working on, or even hire someone to do some work…"
full_description = "MEET WORDPRESS ENTHUSIASTS IN MINNEAPOLIS & ST. PAUL!Welcome to the amazing hub of Minneapolis St. Paul WordPress Users! On this site you will find ways to connect in person and online to sharpen your WordPress skills, get connected/build community, see what other people are working on, or even hire someone to do some work for you. Enjoy exploring the site and the opportunities! Google GroupGet support, post a gig or just reach out to say hi! WordPress WednesdayIf you are a member of Fueled Collective, come cowork with us every Wednesday! WP Minnesota DirectoryBrowse through our directory of WordPress developers in Minnesota MPLS WordPress Small Business Website MeetupAre you wrestling with WordPress? Bring your laptop and your WordPress questions to experienced WordPress website developers and designers and we will tackle them together! Member RSSSee WordPress-related content posted by our members, assembled in one place Member-MadeSee some of the awesome plugins and WordPress products made by our members"
