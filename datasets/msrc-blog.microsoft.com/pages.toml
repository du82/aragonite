title = "Microsoft Security Response Center"
full_description = "Exciting updates to the Copilot (AI) Bounty Program: Enhancing security and incentivizing innovation Friday, February 07, 2025 At Microsoft, we are committed to fostering a secure and innovative environment for our customers and users. As part of this commitment, we are thrilled to announce significant updates to our Copilot (AI) Bounty Program. These changes are designed to enhance the program’s effectiveness, incentivize broader participation, and ensure that our Copilot consumer products remain robust, safe, and secure. Read More Bug Bounty Bug Bounty Programs Community-based Defense Security Researcher Copilot Responsible AI Scaling Dynamic Application Security Testing (DAST) Tuesday, January 21, 2025 Introduction Microsoft engineering teams use the Security Development Lifecycle to ensure our products are built in alignment with Microsoft’s Secure Future Initiative security principles: Secure by Design, Secure by Default, and Secure Operations. A key component of the Security Development Lifecycle is security testing, which aims to discover and mitigate security vulnerabilities before adversaries can exploit them. Read More Congratulations to the Top MSRC 2024 Q4 Security Researchers! Wednesday, January 15, 2025 Congratulations to all the researchers recognized in this quarter’s Microsoft Researcher Recognition Program leaderboard! Thank you to everyone for your hard work and continued partnership to secure customers. The top three researchers of the 2024 Q4 Security Researcher Leaderboard are Suresh, VictorV, wkai! Check out the full list of researchers recognized this quarter here. Read More Bug Bounty Bug Bounty Programs Bounty Community-based Defense Security Research Security Researcher Mitigating NTLM Relay Attacks by Default Monday, December 09, 2024 Introduction In February 2024, we released an update to Exchange Server which contained a security improvement referenced by CVE-2024-21410 that enabled Extended Protection for Authentication (EPA) by default for new and existing installs of Exchange 2019. While we’re currently unaware of any active threat campaigns involving NTLM relaying attacks against Exchange, we have observed threat actors exploiting this vector in the past. Read More"
