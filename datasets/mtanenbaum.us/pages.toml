title = "March | 2016 | mtanenbaum"
description = "Privacy, Security and Cyber Risk Mitigation in the Digital Age"
full_description = "Breach, Legal, Privacy Tennessee Breaks New Ground In Privacy Law March 31, 2016 mitch tanenbaum Leave a comment On March 24th, Tennessee Gov. Bill Hallam signed S.B. 2005 into law, breaking new ground in privacy law. The law takes effect on July 1. While there are a couple of interesting features of this amendment to the existing Tennessee privacy law, the biggest change is that, effective, July 1, companies that have a breach will have to notify Tennessee residents about the breach, even if the data that was taken was encrypted. This makes Tennessee the first state in the country to have this requirement. IF you have a breach, THEN you must notify the victims. Other features of the amendment include a requirement to notify victims within 45 days unless the cops ask the company to delay that notification. Many state laws just say you should notify people quickly. The other major feature is a requirement to notify victims if the person taking the data was an employee, operating in excess of his authority and using it for an unlawful purpose. This means that you can’t say that an employee accessing data inappropriately is okay – it is a breach. My speculation is that this amendment is designed to stop companies from hiding the fact that they were breached. Whether other states will follow suit is unknown. In today’s world, many companies operate in every state, so if the company has a breach, it will have to notify victims. If the data was encrypted, then technically, they will only have to notify Tennessee residents, but that could get sticky politically, so likely they will have to notify everyone. We live in a dynamic world. Information for this post came from National Law Review. Tennessee Legal, Privacy Paris Police Report Shows No Evidence Of Use Of Encryption March 30, 2016 mitch tanenbaum Leave a comment Over the weekend the New York Times ran a piece on the report created by the French anti terrorism police on the Paris attacks. The report indicates that there is no evidence of use of encrypted email, devices or messaging solutions. In fact, they used phones that they activated just before the attack (burner phones) and phones taken from the victims. Since the phones were only active for a few minutes, they didn’t care if someone was able to track them. The Times decided that since there was no evidence of encrypted email, the attackers must have used encrypted email. That logic escapes me. The Times figures that encrypted emails must be invisible. Now this does not mean that future attackers won’t use encryption, but if they do, at least the smart ones will not use software from countries that require back doors. Perhaps we need to ban cell phones. After all, the root of all these issues is people using cell phones. If we get rid of cell phones, then the attackers will be forced to meet with each other – a much riskier proposition. There is no simple answer to these problems even though politicians will attempt to create a simplistic solution. What is likely is that if U.S. companies are forced to put back doors in their software, companies in other countries will avoid buying U.S. technology products, costing profits and jobs. Information for this post came from Techdirt. Back DoorsEncryption"
