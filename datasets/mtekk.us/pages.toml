title = "Breadcrumb NavXT Menu Magic 2.3.1 | mtekk's Crib"
full_description = "August 19th, 2023 Breadcrumb NavXT Menu Magic 2.3.1 by John Havlik Announcing an update to Breadcrumb NavXT Menu Magic that enhances PHP8 compatibility. The previous version improperly set the URL to NULL when generating an unlinked breadcrumb (a remnant of Breadcrumb NavXT behavior prior to 6.4) . This resulted in PHP warnings being thrown within the bcn_breadcrumb::set_url() method in PHP8 environments. With version 2.3.1, Breadcrumb NavXT Menu Magic now uses the proper API calls for Breadcrumb NavXT 7.0 and newer. Users with valid and activated license keys should receive an update notification within the WordPress dashboard and be able to use the update mechanism to update (just like with any plugin in the WordPress.org repository). If you run into any issues, please open a support ticket. -John Havlik Posted in Announcements | Tagged: Breadcrumb NavXT, Premium Extensions"
