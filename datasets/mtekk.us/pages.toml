description = "Related to the WordPress themes that I work on."
full_description = "January 22nd, 2009 Cran-Berry 2 Mockup 1 Posted by John Havlik in Word* > Themes Just in the initial design stages of Cran-Berry 2. Layout wise I want to experiment with things a little and doubt the final release will look much like the mockup. This was mainly an exercise in using Photoshop to make grungy textures. It also was a bit of a test with ICC profiles for my HP LP2475w. I like the color scheme and it or a variation of it will be what is used in Cran-Berry 2. A incomplete, grungly look at the next berry theme? -John Havlik [end of transmission, stay tuned] 1 Comment Tagged: Design Updated: January 22nd, 2009 at 2:22 pm May 2nd, 2008 Cran-Berry Build 100 Posted by John Havlik in Word* > Themes A little late, but fully functional. School work prevented the intended release date for Cran-Berry. Several styling, and code fixes were implemented which should provide a more uniform experience for most browsers. This includes new code for centering the content on the page, and some other general fixes. This release is not a full ‘stable’ release like a one for Breadcrumb NavXT, but this should be usable for advanced users. In the zip is two folders, one containing the theme, the other containing the modified version of WP-PageNavi. The other two recommended plug-ins should be downloaded from their respective home pages. Naturally, Berry implements support for these plug-ins in a safe manner–not having them will not cause PHP errors or warnings. Upon activation of the plug-ins they will display immediately (in most cases). To change options, look in the functions.php and there will be a $berry_opts array of options a la Breadcrumb NavXT. These are documented in the source right above the corresponding option. Additionally, the sidebar is WordPress Widget aware. -John Havlik [end of transmission, stay tuned] Tagged: Code, Design Updated: April 27th, 2020 at 6:20 pm March 17th, 2008 Internet Explorer 6 Users Posted by John Havlik in Word* > Themes Please note that I no longer support IE6. IE7 has been out for way over a year now and IE8 is on its way. I do know that the method that I use for centering the main content does not work in the IE8 beta, even though it works on every other modern browser in existence. That really does not matter as Cran-Berry will be here soon enough and it’s a wider theme that will have that problem resolved. -John Havlik [end of transmission, stay tuned] Tagged: Web Standards Updated: April 29th, 2020 at 6:00 pm"
