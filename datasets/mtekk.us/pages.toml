the incorrect template to be used when $force was set to false. The second bug was the $force parameter was not always passed into the bcn_breadcrumb_trail::fill() function. Lastly, an incorrect translation textdomain within adminKit was fixed. -John Havlik 5 Comments Tagged: Code Updated: January 3rd, 2025 at 8:36 pm"
