title = "CSS Naked Day | mtekk's Crib"
full_description = "April 8th, 2008 CSS Naked Day 2008 Posted by John Havlik in Events > CSS Naked Day Ok, this is a little premature, but what ever. Tomorrow is CSS naked day, so in honor of this, this blog’s CSS will be removed for the entirety of that day. This is to promote web standards, which Microsoft seems incapable of following. Also, it was reported to me that the download links are not working, this is due to a bug in the plug-in that I use for downloads, I’m going to install a SVN version of it that is compatible with WordPress 2.5 -John Havlik [end of transmission, stay tuned] Tagged: Web Standards Updated: September 10th, 2011 at 9:07 pm April 5th, 2007 Not Again Posted by John Havlik in Events > CSS Naked Day Sorry I blew it this year, due to the school work load I 100% forgot that today is the second annual CSS Naked Day. It took browsing a blog and seeing that its CSS was missing but it was not facing the effects of Digg, and it dawned on me. The other too bad thing is that this blog has had the same skin for over a year now, it is time for change. But change takes time, especially when you are building a theme platform (inspired by K2, but it is not K2) from the ground up. That is all I’ll leak about one of my many projects, and I’ll leave you with a verbatim copy of my CSS Naked Day post from last year: For a full 48 hours, while somewhere on earth it’s April 5th this blog will be separated from its lovely CSS file. This is about standards, not retarded Digg users, along with some ignorant Newsvine users. This day is to educate those web developers that don’t write code to conform to standards, which is a bad thing. Don’t even think about starting an AJAX/Web 2.0 project if you don’t plan on using web standards, otherwise bad things will happen. Here is the link: CSS Naked Day -John Havlik [end of transmission, stay tuned] Tagged: Web Standards Updated: October 26th, 2020 at 7:31 am April 2nd, 2006 First Annual CSS Naked Day Posted by John Havlik in Events > CSS Naked Day Spreading awareness of web standards is the goal of CSS Naked Day, a day in which webmasters and bloggers remove all CSS styling from their website and blogs, leaving the xHtml ‘naked’. In his blog Dustin Diaz announced that he wants April 5, 2006, that’s this Wednesday, to be the first annual CSS naked day. That’s right, I’m starting the first annual CSS Naked Day. In the spirit of promoting Web Standards along with good semantic markup and proper hierarchy structures, April 5th will be a day of nakedness for all webmasters to remove their style sheets from their website for one day. Signing up is not required, just simply comment in this thread with a link to your website and let everyone else know that you’re participating. Over at Digg some people are having hard times reading the actual article, so I quoted Dustin’s first paragraph. Dustin is recommending that anyone who participates includes some html that he wrote that explains the disappearance of styling and a link to the CSS naked page. I will be participating, will you? Here is the link: Dustin Diaz’s Article -John Havlik [end of transmission, stay tuned] Tagged: Web Standards Updated: August 23rd, 2020 at 9:47 pm"
