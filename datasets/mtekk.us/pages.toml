PHP, please reduce strings like “/var/www/sitename/htdocs/wp-contents/plugins/breadcrumb-navxt/breadcrumb_navxt_class.php” to “…/wp-contents/plugins/breadcrumb-navxt/breadcrumb_navxt_class.php”. Unless the link pertains to the content of your comment, please leave it out. -John Havlik [end of transmission, stay tuned]"
