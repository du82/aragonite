["https://mtekk.us/archives/tag/flash"]
title = "Flash | mtekk's Crib"
full_description = "September 11th, 2010 Time for Flash to Die Posted by John Havlik in Enemy of the Spammers Today some stupid advertisement delivery agency decided to ship a Flash based add that automatically infects your computer with a fake security suite (named “AV Security Suite”). This affects the latest Flash player, regardless of web browser. Neat, right? Oh, it gets better. AV Security Suite is ransomware, which does not allow you to open any applications that it knows could close it. Great, isn’t it? The seemingly good thing is you can get rid of it using System Restore. Do this by: Pulling the powerplug to your PC (don’t do a “proper” shutdown or restart). Boot into safemode. Usually, you need to press and hold the F8 key while booting, and select safemode from the menu. However, if you did not shutdown properly this menu should automatically come up. Finally, in safemode use System Restore to go back to before the infection happened. Note that Windows 7 users can go strait to restoring using the “Restore Computer” menu item rather than safemode boot. Going forward, remove Adobe Flash player from your computer. Since Adobe can’t seem to fix this issue, Flash player is not to be trusted (add Adobe Acrobat reader to your untrusted list as well). If you must have Flash player (for any reason) and use Firefox install Flashblock, it could save you time in the future. -John Havlik [end of transmission, stay tuned] 4 Comments Tagged: AV Security Suite, Flash, Malware, Windows 7 September 8th, 2010 Flash on the Droid Posted by John Havlik in Reviews > Software In the past few weeks Verizon pushed out an Android update to Droid users that allowed the installation of Adobe’s Flash Player for the Android browser. I received my update about a week ago—the first update that actually pushed to my Droid properly. While the Flash Player application/plugin is still installed on my Droid, I have already disabled it in the browser. If I were to sum up my opinion on Adobe Flash player on Android in one sentence it would be: “You forget how much you did not miss Flash until you install it.” Flash in itself is not too slow, or so bad (when used correctly). However, the constant misuse of it makes it more of a liability than asset. The Good The best thing about Flash player is that the Android browser lets you selectively disable it—oh wait, that’s an Android feature not Flash feature. Ok, so you can now play those flash games, see the flash charts (e.g. what WordPress.com stats use), and visit the flash based video sites that don’t have a native app. All of these are nice things. Finally, you now technically get a “full” web experience on an Android device—unlike the fruitier phones out there. The Bad Many websites with multiple flash objects run very slowly. Scrolling around on the page is slow on these sites. Thought, pages with a ton of animated GIF images are no different. The Ugly Advertisements. I understand that content producers need to get paid, and that advertisements provide this income. However, I can not stand intrusive advertisements. There are so many poorly written, flash advertisements on many websites. The browser feels lethargic on these websites. Flash, in general, is a victim of its own success. It is so popular that it is frequently misused (and attacked), which is the source of many of my gripes against it. Admittedly, this is better than people abusing CSS and JavaScript, as I can actually disable Flash (websites can be quite bland without CSS). The verdict? As I stated in the beginning, I have disabled Flash on my Droid. I feel it is worth keeping installed, but it is not worth having it enabled all the time. -John Havlik [end of transmission, stay tuned] 3 Comments Tagged: Android, Droid, Flash, Froyo"
year_published = 2010
