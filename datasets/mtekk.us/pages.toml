title = "WordCamp | mtekk's Crib"
full_description = "April 29th, 2013 WordCamp Minneapolis 2013 Posted by John Havlik in Events > WordCamp This past weekend we held the first WordCamp in the Twin Cities area in almost three years. To top it off, we held a BuddyCamp as well. A giant thanks to Kiko Doran, Justin Foell, Toby Cryns, the sponsors, and the rest of the volunteers that made WordCamp Minneapolis 2013 happen. These guys and gals put on a great event, as everything went very smoothly the planning and effort they put into it really showed. These are my pictures from the event. Continue reading 1 Comment Tagged: Minneapolis, WordCamp Updated: August 22nd, 2019 at 9:21 pm April 28th, 2013 WordCamp Minneapolis 2013 Slides Posted by John Havlik in Events > WordCamp This weekend, I presented The Power of Custom Types a reworked version of a talk with a similar name that I gave at WordCamp NYC 2012. Similar to the situation at WordCamp NYC 2012, I gave a encore presentation later in the day for those who missed it due to interest in other sessions in the same time slot. Those looking for the slides have two options, either a PDF export of the slides or the original PPT (ends up being more portable than other formats). Grab the PDF version. Grab the PPT version. -John Havlik [end of transmission, stay tuned] Tagged: Minneapolis, WordCamp Updated: February 8th, 2014 at 11:24 pm June 10th, 2012 WordCamp NYC 2012 Slides Posted by John Havlik in Events > WordCamp I gave my presentation, The Power of Custom Post Types twice this weekend. First, at the regularly scheduled location and time slot, where we packed the room (had to turn people away). And then, an encore presentation today in a slightly larger room with still a great crowd (despite a few technical glitches). Those looking for the slides have two options, either a PDF export of the slides or the original PPT (ends up being more portable than other formats). Grab the PDF version. Grab the PPT version. -John Havlik [end of transmission, stay tuned] Tagged: NYC, WordCamp Updated: February 8th, 2014 at 11:25 pm"
