title = "Benchmarking | mtekk's Crib"
full_description = "February 8th, 2014 WPMark Twenty Twelve Posted by John Havlik in Word* WPMark consists of two components: a WordPress plugin and a JMeter test plan. The WordPress plugin populates an empty install with the requisite demo content, sets up the requisite options, and generates cached copies of portions of the site for testing. Continue reading 1 Comment Tagged: Benchmarking, Code Updated: November 19th, 2019 at 8:00 pm April 22nd, 2013 Benchmarking WordPress (Investigating the Optimal Server) Posted by John Havlik in Word* With WordPress powering an estimated 16.7% of all websites1, having tools to evaluate server performance for running WordPress is becoming necessary. At the time of writing this article, there are no known published investigations into determining the optimal server configuration for WordPress. Yet, hosting providers will make bold claims, such as “My blog is 4x faster than your blog”. While these claims make for entertaining t-shirts, without a defined methodology there is no way to verify them. Continue reading Notes:Mullenweg, Matthew. “State of the Word 2012.” WordCamp San Francisco 2012. San Francisco 4 Aug. 2012. ↩ 4 Comments Tagged: Benchmarking Updated: September 11th, 2018 at 8:52 pm"
