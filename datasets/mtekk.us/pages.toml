full_description = "John Havlik on January 16th, 2025 at 6:03 am By the time you are reading this post, Jetpack has been removed from this site. Those “subscribed” to this website will no longer get email updates (for comments and new posts). January 26th, 2024 Breadcrumb NavXT Premium Extensions 2024 Update Sweep Posted by John Havlik in Announcements Due to some changes in Breadcrumb NavXT 7.3, an update to all of the premium extensions is required before updating to Breadcrumb NavXT 7.3. A selection of premium extensions have already been updated and had separate release announcements (as additional features or bugs were fixed in them). This announcement covers the rest of the premium extensions. Users with valid and activated license keys should receive an update notification within the WordPress dashboard and be able to use the update mechanism to update (just like with any plugin in the WordPress.org repository). If you run into any issues, please open a support ticket. -John Havlik Tagged: Breadcrumb NavXT, Premium Extensions January 18th, 2024 Breadcrumb NavXT Attributes 1.5 Posted by John Havlik in Announcements Introducing Breadcrumb NavXT Attributes 1.5. This version adds support for taxonomy archives. Previously, Breadcrumb NavXT Attributes focused solely on individual posts. However, WordPress does allow for archives that select against multiple terms/taxonomies, and Breadcrumb NavXT Attributes now supports this. Additionally, this version adds support for Breadcrumb NavXT 7.3. Users with valid and activated license keys should receive an update notification within the WordPress dashboard and be able to use the update mechanism to update (just like with any plugin in the WordPress.org repository). If you run into any issues, please open a support ticket. -John Havlik Tagged: Breadcrumb NavXT, Premium Extensions August 19th, 2023 Breadcrumb NavXT Menu Magic 2.3.1 Posted by John Havlik in Announcements Announcing an update to Breadcrumb NavXT Menu Magic that enhances PHP8 compatibility. The previous version improperly set the URL to NULL when generating an unlinked breadcrumb (a remnant of Breadcrumb NavXT behavior prior to 6.4) . This resulted in PHP warnings being thrown within the bcn_breadcrumb::set_url() method in PHP8 environments. With version 2.3.1, Breadcrumb NavXT Menu Magic now uses the proper API calls for Breadcrumb NavXT 7.0 and newer. Users with valid and activated license keys should receive an update notification within the WordPress dashboard and be able to use the update mechanism to update (just like with any plugin in the WordPress.org repository). If you run into any issues, please open a support ticket. -John Havlik Tagged: Breadcrumb NavXT, Premium Extensions"
