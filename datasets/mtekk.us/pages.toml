full_description = "November 28th, 2021 Breadcrumb NavXT 7.0 and Premium Extensions Posted by John Havlik in Announcements Over the past few weeks, various Breadcrumb NavXT extensions have been updated in preparation for Breadcrumb NavXT 7.0. Today, the last batch of extension updates are being released. The following extensions are now ready for Breadcrumb NavXT 7.0: Breadcrumb NavXT Attributes (1.0.5)Breadcrumb NavXT uManager (1.2.2)Breadcrumb NavXT LearnDash Extensions (1.0.4)Breadcrumb NavXT Menu Magic (2.2.0)Breadcrumb NavXT Paths (1.8.2)Breadcrumb NavXT Polylang Extensions (1.5.5)Breadcrumb NavXT Title Trixx (2.0.2)Breadcrumb NavXT WPML Extensions (1.5.3) Breadcrumb NavXT 7.0 is scheduled for release within the next two weeks. It is critical that any extension plugin in use is updated to a version compatible with Breadcrumb NavXT 7.0 before updating Breadcrumb NavXT to 7.0. Due to extensive, under-the-hood changes to the admin interface for Breadcrumb NavXT 7.0, it is not compatible with older versions of the extensions. Users with valid and activated license keys should receive an update notification within the WordPress dashboard and be able to use the update mechanism to update (just like with any plugin in the WordPress.org repository). Note that this release has a phased rollout. Currently, the release is available to half of the active licensed installs. Starting on 11/29 the release will be available to all active licensed installs. If you run into any issues, please open a support ticket. -John Havlik Tagged: Breadcrumb NavXT, Code, Premium Extensions November 18th, 2021 Breadcrumb NavXT Menu Magic 2.2.0 Posted by John Havlik in Announcements Announcing the rollout of Breadcrumb NavXT Menu Magic 2.2.0. New in this version is support for Custom Post Type Archive menu items. Additionally, this is the first version to be compatible with Breadcrumb NavXT 7.0. Users with valid and activated license keys should receive an update notification within the WordPress dashboard and be able to use the update mechanism to update (just like with any plugin in the WordPress.org repository). This release will be a phased in release, that will be made available to a quarter of active licensed installs each day through 11/21 where it will be made available to all active licensed installs. If you run into any issues, please open a support ticket. -John Havlik Tagged: Breadcrumb NavXT, Code, Premium Extensions"
