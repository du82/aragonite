title = "MSP | mtekk's Crib"
full_description = "April 20th, 2015 I’m Speaking at WordCamp Minneapolis 2015 Posted by John Havlik in Announcements My presentation titled “Writing (more) Secure Plugins” was accepted into developer’s track for WordCamp Minneapolis 2015. This presentation aims to enlighten WordPress plugin developers of common attacks and preventative measures that should be taken within any WordPress plugin. Topics covered include: Plugin security best practices, data sanitization (and validation), action authorization, and permissions. As always, this is a non-exhaustive list of the topics I’ll cover but it should give a feel for what I’ll be talking about. -John Havlik [end of transmission, stay tuned] 1 Comment Tagged: Minneapolis, MSP, WordCamp March 27th, 2014 I’m Speaking at WordCamp Minneapolis 2014 Posted by John Havlik in Announcements My presentation titled “1 Million Downloads – Lessons Learned Growing a Plugin” was accepted into the second developer’s track for WordCamp Minneapolis 2014. This presentation was inspired by a presentation I attended at WordCamp Chicago 2013. It will cover my experiences (mistakes, triumphs, etc.) as I have grown Breadcrumb NavXT over the past 7 years. This session will cover what I have found that works, and the mistakes I made as I’ve grown Breadcrumb NavXT into a plugin that has been downloaded over 1 million times. Topics covered include: support and release strategies, workflow and tools, and WordPress plugin coding tips. Naturally, this is a non-exhaustive list of the topics I’ll cover but it should give a feel for what I’ll be talking about. Psst. If you haven’t registered yet, register for WordCamp Minneapolis while you still can. Last year we sold out of two day passes and Saturday only passes. Also, it is definitely worth participating in both Saturday and Sunday activities, Kiko and crew did an excellent job organizing last year and this year is looking to be even better. -John Havlik [end of transmission, stay tuned] 1 Comment Tagged: Minneapolis, MSP, WordCamp Updated: March 27th, 2014 at 11:24 pm"
