full_description = 'September 1st, 2012 Ironic Warning Posted by John Havlik in Enemy of the Spammers <?php /* WARNING: This file is protected by copyright law. To reverse engineer or decode this file is strictly prohibited. */ $o="QAAACg07… This is just a tiny portion of the PHP shell someone tried to get into the WordPress GitHub repository via a pull request. Funny thing is this code isn’t GPL compatible so it’d never get in. As for the warning itself, no date of copyright was established, and the owner is not identified. And, since the code’s purpose is malicious, the owner would likely run into other issues should he attempt to assert his copyright. -John Havlik [end of transmission, stay tuned] Tagged: Irony Updated: November 14th, 2019 at 7:48 pm February 11th, 2012 Google +1 Click Jacking Posted by John Havlik in Enemy of the Spammers While investigating the whole WP/HQ Sand Box spamming thing, I came across something interesting. Our ‘buddy’, user robinruet several months ago, along with a recent post that was deleted spamming for takabd.com (don’t visit it, and do not +1 it). More recently, another user, WPgooglerankingBooster, was spamming for the same site. The current product they are peddling is something that will get you blacklisted from Google. Continue reading 2 Comments Tagged: Black Hat, SEO Updated: February 11th, 2012 at 1:19 pm January 1st, 2012 Avoid WP Sand Box and HQ Sand Box Posted by John Havlik in Enemy of the Spammers It is sad that the first post for 2012 is exposing a spammer and security flaw, but it must be done. Today’s lesson in poor Internet etiquette and poor security awareness is WordPress.org user robinruet, promoter of Invenesys’ WP Sand Box plugin. Around the turn of the new year, robinruet went through the WordPress.org forums and replied to several support topics with the same post promoting the WP Sand Box plugin. These posts were all off topic, and on several occasions robinruet somehow managed to set the issue as resolved. The good news is his posts were deleted, along with his two plugins. But, this post isn’t about the robinruet, who is an interesting character, and possibly a hacked account (it started spamming a Google +1 click jacking plugin). This is about WP Sand Box and why you should not use it. Continue reading 1 Comment Tagged: Malware, Security Updated: February 14th, 2021 at 10:15 pm'
