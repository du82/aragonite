title = "January | 2025 | mtekk's Crib"
full_description = "January 17th, 2025 Private Pages as Root Page for CPTs Posted by John Havlik in Guides Traditionally, the Breadcrumb NavXT settings page has only allowed published/publicly visible pages be the root page for custom post types. This follows what WordPress core does with the homepage and posts page. However, in some circumstances, having a private page be the root page for a custom post type makes sense. Introduced in Breadcrumb NavXT 7.4, the bcn_admin_post_root_args filter allows for control over the arguments passed into the root page drop down. Below is an example of using the bcn_admin_post_root_args filter to allow private pages to show up in the root page drop down: add_filter('bcn_admin_post_root_args', 'my_bcn_admin_post_root_args', 10, 2); function my_bcn_admin_post_root_args($args, $post_type_name) { $args['post_status'] = array('publish','private'); return $args; } This can be extended to only allow private pages to be the root page for specific post types (by checking the $post_type_name parameter for the desired post type). Lastly, while the setting is for the root page, it does not have to be limited to the page post type. -John Havlik Leave a comment Tagged: Breadcrumb NavXT, Code Updated: January 11th, 2025 at 9:56 pm John Havlik on January 16th, 2025 at 6:03 am By the time you are reading this post, Jetpack has been removed from this site. Those “subscribed” to this website will no longer get email updates (for comments and new posts). January 9th, 2025 Breadcrumb NavXT 7.4.1 Posted by John Havlik in Word* > Plugins This is the first, and hopefully only, bug fix release of the 7.4 branch of Breadcrumb NavXT. In 7.4.0, changes made to improve WordPress 6.7 compatibility resulted in Breadcrumb NavXT registering the legacy widget too late in the action sequence. This release fixes that issue making the legacy widget available again. -John Havlik 1 Comment Tagged: Code"
