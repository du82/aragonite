title = "Weblogs.us | mtekk's Crib"
full_description = "April 19th, 2015 TLS, HTTPS, Weblogs.us and the Generation 4 Layout Posted by John Havlik in Weblogs.us One thing I have not talked about in a while is Weblogs.us. Currently, we are busy designing and deploying what I am calling the Generation 4 Layout. This new layout includes a migration to Nginx, PHP5.5 and a few other goodies that will make things faster for everyone. A big benefit for this new layout is it will be easier for us to support HTTPS on end user sites. Now that Google is pushing everyone to this, we’re going to be ready. Since we have a limited number of IP addresses available to us, we will be using Server Name Indication extensions to TLS to do this. Additionally, as of now, only users with their own domain names who purchase a TLS/SSL certificate will be supported. At the moment, we are not planning to purchase a wildcard TLS/SSL certificate to cover all subdomain users. Deployment Timeline Currently, we are in the process identifying candidate sites to migrate to the Generation 4 Layout as part of a test roll out. Initial deployment is slated for mid May. Starting in mid July, we will start general deployment of the new layout. The plan is to decommission the old virtual machines holding the Generation 3 Layout by the end of 2015. -John Havlik [end of transmission, stay tuned] Tagged: HTTPS, TLS Updated: December 1st, 2019 at 8:03 am March 29th, 2013 Weblogs.us Site Speed Tips Posted by John Havlik in Weblogs.us Weblogs.us supports two resource loading optimizations that can give your site a slight bump in performance. While neither are enabled by default on individual sites, we will be rolling them out over the next three months. However, you can try them out before they are rolled out to your site. Continue reading 1 Comment Tagged: Optimization Updated: August 1st, 2020 at 7:06 pm October 14th, 2011 Anatomy of an Outage – Part 2 Posted by John Havlik in Weblogs.us From 3:15AM CDT to 6:05PM CDT, on Friday, September 30th, 2011 Weblogs.us experienced an outage on one of its servers. This is part two of two the story behind the outage, which covers the the events of Friday (e.g. fixing the mess). Continue reading 2 Comments Tagged: Downtime, Linux Updated: April 27th, 2020 at 6:24 pm"
