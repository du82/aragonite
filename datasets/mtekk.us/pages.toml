["https://mtekk.us/archives/tag/bugs"]
title = "Bugs | mtekk's Crib"
full_description = "August 26th, 2012 Fixed: BSODs Caused by garmnusb.sys in Windows 7 Posted by John Havlik in Guides Since Windows 7 was released, I have had intermittent BSODs when plugging my Garmin Forerunner 305 into its USB cradle. The cause of the issue was always garmnusb.sys. A little searching shows that many users are experiencing the same issue. No one had a solution that worked consistently. Sure, you could connect the Forerunner before booting the PC, but that’s quite inconvenient. A few weeks back, out of curiosity, I tried clicking on the “Update Driver” button for the device within Device Manager. To my surprise, a new driver was available. Garmin released version 2.3.1.0 of the driver back in April. Since updating to 2.3.1.0, I have not experienced any BSODs on my system. Going from crashing every other time I connected my Forerunner to zero BSODs is a great improvement. Unfortunately, this is something Garmin should have had fixed three years ago, before Windows 7 was released. -John Havlik [end of transmission, stay tuned] Tagged: Bugs, Windows 7 August 11th, 2012 A New Settings Page Posted by John Havlik in Word* > Plugins The most noticeable change in the next version of Breadcrumb NavXT (4.2.0) will be the reorganized settings page (preview screen shot above). Since the introduction and subsequent inclusion of tabular (the code that gives the settings page its tabs), each custom taxonomy and post type has had it’s own tab. This will no longer be the case where there are just 4 tabs, “General”, “Post Types”, “Taxonomies”, and “Miscellaneous”. This reorganization, while causing the content per a tab to be greater, keeps the tab list from growing with every new custom post type and taxonomy added to a site. Additionally, it allows greater distinction between settings for custom taxonomies and custom post types. Previously, there were instances where CPTs and custom taxonomies had the same name in their tabs and it was not clear which was which without entering that tab. Keep tabs on Breadcrumb NavXT 4.2.0 development over at GitHub. -John Havlik [end of transmission, stay tuned] 1 Comment Tagged: Bugs, Code Updated: August 11th, 2012 at 7:01 pm"
