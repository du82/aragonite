full_description = 'January 1st, 2012 Avoid WP Sand Box and HQ Sand Box Posted by John Havlik in Enemy of the Spammers It is sad that the first post for 2012 is exposing a spammer and security flaw, but it must be done. Today’s lesson in poor Internet etiquette and poor security awareness is WordPress.org user robinruet, promoter of Invenesys’ WP Sand Box plugin. Around the turn of the new year, robinruet went through the WordPress.org forums and replied to several support topics with the same post promoting the WP Sand Box plugin. These posts were all off topic, and on several occasions robinruet somehow managed to set the issue as resolved. The good news is his posts were deleted, along with his two plugins. But, this post isn’t about the robinruet, who is an interesting character, and possibly a hacked account (it started spamming a Google +1 click jacking plugin). This is about WP Sand Box and why you should not use it. Continue reading 1 Comment Tagged: Malware, Security Updated: February 14th, 2021 at 10:15 pm June 21st, 2011 The WordPress.org Commit Breakin – Evil Code Posted by John Havlik in Enemy of the Spammers If you have not heard about the unauthorized SVN commits to the WordPress.org plugin repository for the plugins AddThis, WPTouch, and W3 Total Cache, you may want to read the post on the WordPress.org blog first. This event has prompted a WordPress.org password reset for all registered users. While these are three high profile examples that happened in the last 48 hours, a similar incident happened back in February. Continue reading 16 Comments Tagged: Code, Malware Updated: August 28th, 2019 at 6:47 pm January 1st, 2011 Making Sense of Obfuscated Code Posted by John Havlik in Enemy of the Spammers It should be no surprise that some plugin authors can no be trusted. We’ve seen that with the BlogPress SEO plugin, but that one was just sloppy. Others actually try to hide what they are doing. An easy way of doing this is to use a PHP code obfuscating application. These will produce code such as: <?php if(!function_exists("TC9A16C47DA8EEE87")){function TC9A16C47DA8EEE87(... Continue reading Tagged: Code, Malware Updated: April 29th, 2020 at 6:00 pm'
