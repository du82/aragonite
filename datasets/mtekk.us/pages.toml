description = "Artwork announcements, mostly site designs and photoshop stuff."
full_description = "January 16th, 2010 Mixed Colorspace Posted by John Havlik in Art Colors are important, having the correct one can make or break a design. That is why professionals and even some enthusiasts spend copious amounts of money (well maybe not quite that much) on devices to ensure that when a color is picked, it looks the same on print and on the screen. Even with these devices, there are many pitfalls on the computer side. Case in point: what looks like a rich crimson in improperly color managed FireFox, The Gimp, and Windows Paint is actually a rusty maroon in color managed Windows Explorer, and FireFox (when set to manage CSS colors in conjunction with profiled images). While this is better than in Windows XP, it is still annoying. When Microsoft redid the graphics driver framework for Vista, they should have forced color correction onto the graphics drivers. That way, all applications would use the same color translation LUT and individual applications would not have to be aware of color profiles. Maybe they could do this for Windows 8 (then one could be in one of those “Windows 8 feature was my idea” commercials). -John Havlik [end of transmission, stay tuned] Tagged: Rants, Windows 7 Updated: April 27th, 2020 at 6:21 pm July 19th, 2007 Gentoo Blue Wave Posted by John Havlik in Art A while back while reading a tutorial by Nick La of N.Design Studio, I thought the concept of what his tutorial covered in Adobe Illustrator was cool. Of course, using Illustrator is not an option when running in a GNU/Linux environment. This is where Inkscape comes into play. Much like the GIMP, Inkscape does not do everything that its Adobe competitor does. Thus, abiding strictly to Nick’s tutorial is impossible, but getting to the same end result is possible. In the coming weeks I will post a supplement to Nick’s tutorial for the use in Inkscape. However, right now I’m introducing the end result of my Inkscape experimentation, Gentoo Blue Wave. This is a 1080p resolution wallpaper that abides to the Tango pallet. This is released under the Creative Commons Attribution-Noncommercial 3.0 License. -John Havlik [end of transmission, stay tuned] Tagged: Gentoo, GNU Updated: February 8th, 2014 at 11:12 pm"
