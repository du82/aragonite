full_description = "June 19th, 2007 Busy Weeks Posted by John Havlik in Announcements The past two weeks have, to say the least, interesting. By next month, development on WP Trainer will begin. At that time, a quick update with more enhancements to Berry will occur. This includes fixing up the code section of this blog, and updating Moo.WP (mainly as it is a dependency for WP Trainer). Due to demand, watch out for a full-fledged Aptana installation on Gentoo Linux guide, with pictures. Along with the guide the SVG sources to the Aptana logo in the Tango color scheme will be released as the developers still have not made a SVG (or transparent PNG for that matter) logo readily available. -John Havlik [end of transmission, stay tuned] Updated: May 29th, 2016 at 9:29 pm December 31st, 2005 WordPress 2.0 Posted by John Havlik in Announcements > General I installed WordPress 2.0 today, after deleting some important files and having to figure out my database information I finally got it running. I had a temporary ‘Under Construction’ banner up, which is a preview of the skin that I’m working on today. Plan on there being outages later today and possible broken template layout/pages. I also have this nice little Weblogs.us logo that I made that I’ll share So this is it, 100% transparent PNG in all of it’s glory. Feel free to use this on your weblogs.us hosted WordPress blog. Leave a comment with your blog URL if you decide to use it, and if you wish to critique it just comment on it as well. Just right click and select ‘Save Image As’. Then select the destination on your computer to save it. I love the backend improvements of WordPress 2.0. The blogging pane is much better. A lot of AJAX went into it and a really cool thing is that one is able to dynamically resize the size of the blog pane. Plus, the need to preview has been reduced since images and formatting can be automatically be displayed. -John Havlik [end of transmission, stay tuned] 8 Comments Updated: May 28th, 2016 at 2:23 pm"
