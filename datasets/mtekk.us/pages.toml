["https://mtekk.us/archives/author/mtekk/page/5"]
title = "John Havlik | mtekk's Crib | Page 5"
full_description = "December 23rd, 2022 Breadcrumb NavXT Premium Extensions 2022 Update Sweep Posted by John Havlik in Announcements Announcing a minor update to all of the Breadcrumb NavXT premium extensions. This update fixes a bug introduced when support for Breadcrumb NavXT 7.0 was added. An error was introduced which caused an empty menu entry to be added to the WordPress dashboard menu (when using Breadcrumb NavXT 7.0 or newer). This has been fixed in the update released today for each of the premium extensions. Users with valid and activated license keys should receive an update notification within the WordPress dashboard and be able to use the update mechanism to update (just like with any plugin in the WordPress.org repository). If you run into any issues, please open a support ticket. -John Havlik Tagged: Breadcrumb NavXT, Premium Extensions November 23rd, 2022 WP Lynx 1.3.1 Posted by John Havlik in Word* > Plugins This bug fix release fixes a single bug: PHP7 support. Back in WP Lynx 1.3.0, changes were made to to add PHP8.1, however, these were not PHP7 compatible. WP Lynx 1.3.1 moves to the latest adminKit which now supports PHP7 and PHP8.1. You can grab the latest WP Lynx on the WP Lynx WordPress.org plugin page. -John Havlik Tagged: Code September 30th, 2022 WP Lynx 1.3 Posted by John Havlik in Word* > Plugins Presenting WP Lynx 1.3.0: PHP8 support, and a few under-the-hood improvements. This release is mainly under-the-hood updates and fixes. The largest is fixing several PHP warnings and errors that appeared when using PHP8. Additionally, WP Lynx 1.3 moves to the latest adminKit, enabling WP Lynx to run on sites with Breadcrumb NavXT 7.0 or newer installed. As part of this move, the code base has been cleaned up a bit, removing vestigial code and settings that were present in 1.2.0. You can grab the latest WP Lynx on the WP Lynx WordPress.org plugin page. -John Havlik Tagged: Code July 17th, 2022 Breadcrumb NavXT 7.1.0 Posted by John Havlik in Word* > Plugins Holy new settings export format Batman! This release features several improvements relating to settings, including a new JSON format for settings export and import, updated BCN_SETTINGS_FAVOR_* behavior, improved handling of CPTs that are added too late in the settings page, and fixing a bug in the old XML settings export and import features. On the filter front, a new filter, bcn_before_loop, was added. Similar to the existing bcn_after_fill, this filter allows unique handling of the breadcrumb trail when multiple renderings are called on the same page. Unlike the bcn_after_fill and bcn_before_fill actions which are bypassed when bcn_display() is called without $forced = true, bcn_before_loop filter will run on every call to bcn_display(). In addition to fixing a bug caused by the introduction of namespacing in 7.0 in the old XML settings export and import routines, several other bugs were fixed. The options updating and adding routines were updated to explicitly set the autoload value, to prevent loading the backup settings option unless absolutely needed (during an ‘undo’ operation). Lastly, a bug resulting in a PHP error on term archives that don’t have an active term was fixed. -John Havlik 1 Comment Tagged: Code Updated: July 17th, 2022 at 7:05 pm"
