["https://mtekk.us/archives/anti-consumerism/windows-7-and-punkbuster"]
title = "Windows 7 and PunkBuster | mtekk's Crib"
full_description = "February 28th, 2009 Windows 7 and PunkBuster by John Havlik When you resort to tactics within the realm malice, are your actions still benevolent? Even Balance should consider this question while working on PunkBuster. While hackers/cheaters are an annoying, when the tools that keep them out operate maliciously the tool maker has gone too far. PunkBuster’s behavior is absolutely uncalled for. There is absolutely no reason for a legitimate piece of software to download itself from a remote site and reinstall/restart every 15 seconds to 5 minutes. This is how PunkBuster works right now with its PnkBstrA.exe and PnkBstrB.exe services. PnkBstrA.exe will redownload, reinstall, and restart PnkBsterB.exe periodically while in a game “protected” by PunkBuster. If anything goes wrong PnkBstrA.exe will kick the user from a server and give a error in the 13xxxxxx range. PnkBstrB.exe is what actually looks for hackers/cheaters and kicks them. PunkBuster also looks for unknown APIs and will kick you if it finds any, this is the issue it has with Windows 7. “Why are you playing games on a beta OS?” What’s the point of a beta OS? To test things, that’s the point of beta releases. By playing, or rather try to play, a game I’m testing Windows 7. Since I built a new (for me) computer that is running Windows 7 (64bit), there really is no going back to XP (I do not have Win XP 64bit edition). My gaming is limited to offline games, any Valve title, or Test Drive Unlimited. Basically, anything that doesn’t depend on the horribly broken PunkBuster. The real shame is that Even Balance has not made any visible effort towards supporting Windows 7. The beta is very solid, a release candidate should be out soon, and at that time the Windows 7 “API” will be “locked” and Punk Buster should be able to be updated to work with Windows 7. If, upon public release of Windows 7, PunkBuster still does not work properly, I’d like to see a someone bring a class action lawsuit against Even Balance for negligence (yes, PunkBuster has angered me to that point). -John Havlik [end of transmission, stay tuned] Posted in Anti-Consumerism | Tagged: Rants, Windows 7 Updated: July 16th, 2018 at 8:30 pm"
