full_description = "December 23rd, 2020 Breadcrumb NavXT Paths 1.7.0 Posted by John Havlik in Announcements Announcing the immediate availability of Breadcrumb NavXT Paths 1.7.0. This version introduces changes to how term archives to page mapping works. Previously, when a term was mapped to a page, that page’s hierarchy would be used for the rest of the breadcrumb trail. In Breadcrumb NavXT Paths 1.7.0, a new behavior was introduced where the term’s hierarchy would be maintained and only individual breadcrumbs would be replaced with pages. Toggling between the old behavior and the new behavior is controlled through the “Term Archive to Page Mapping” setting in the Paths section of the Breadcrumb NavXT settings page. Users with valid and activated license keys should receive an update notification within the WordPress dashboard and be able to use the update mechanism to update (just like with any plugin in the WordPress.org repository). -John Havlik 4 Comments Tagged: Breadcrumb NavXT, Code, Premium Extensions Updated: December 28th, 2020 at 7:57 pm November 16th, 2020 Breadcrumb NavXT and bbPress Compatibility Revisited Posted by John Havlik in Word* > Plugins Since the last time the topic of Breadcrumb NavXT and bbPress Compatibility was investigated, almost 6 years ago, a little has changed in how both plugins operate. In fact, due to a change in how bbPress operates internally, Breadcrumb NavXT now supports post type jumping. What Works Out-of-the-box, forums and topics should work well. However, the settings recommendations have changed since the last visit of this topic. The current settings recommendations are: Forum Root Page and Topic Root Page – Set these to be equal and to whatever page you have set as ‘Forum Root’ under Settings > Forums.Forum Archive Display – UncheckedForum Hierarchy Display – CheckedForum Hierarchy – Post ParentTopic Archive Display – CheckedTopic Hierarchy Display – CheckedTopic Hierarchy – Post Parent What Doesn’t Work Out-of-the-box, topic tag archives still won’t work as expected. Additionally, the search page, search results page, and user pages do not work. These all require custom, bbPress specific code. The Solution Recently, Breadcrumb NavXT bbPress Extensions was updated to include support for the search page, search results pages, and user pages (at least the landing page for user pages, the various sub-pages are not supported yet). This is in addition to fixing the how topic tag archives show up in the breadcrumb trail. -John Havlik Tagged: bbPress, Breadcrumb NavXT Updated: October 31st, 2020 at 8:25 pm"
