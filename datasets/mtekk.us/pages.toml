full_description = "December 1st, 2017 Breadcrumb NavXT Menu Magic 1.5.0 Posted by John Havlik in Announcements Announcing the immediate availability of Breadcrumb NavXT Menu Magic 1.5.0. This version adds support for Breadcrumb NavXT 6.0. Additional changes were made to the administrative interface to more clearly indicate license status. As noted in Changes to Note Before Upgrading to Breadcrumb NavXT 6.0, the changes made in Breadcrumb NavXT 6.0 will result will result in PHP errors being thrown in previous versions of Breadcrumb NavXT Menu Magic. This version supports both Breadcrumb NavXT 5.x and 6.x branches. Hence, it is highly recommended that this extension is updated before updating Breadcrumb NavXT to 6.0. Users with valid and activated license keys should receive an update notification within the WordPress dashboard and be able to use the update mechanism to update (just like with any plugin in the WordPress.org repository). -John Havlik 1 Comment Tagged: Breadcrumb NavXT, Code, Premium Extensions May 5th, 2017 Breadcrumb NavXT Menu Magic 1.1.5 Posted by John Havlik in Announcements Announcing the immediate availability of Breadcrumb NavXT Menu Magic 1.1.5. This version fixes a bug relating to Breadcrumb NavXT Menu Magic’s handling of CPT root pages. Previously, if a CPT root page was located in a menu, the menu hierarchy would only be followed when on said CPT root page, or if said root page had a parent page that is not the front page. This normally manifested itself when on a single post instance of a CPT, the menu hierarchy containing the CPT root page would not be followed. With version 1.1.5, Breadcrumb NavXT Menu Magic will always follow the menu hierarchy that a CPT root page is in. Users with valid and activated license keys should receive an update notification within the WordPress dashboard and be able to use the update mechanism to update (just like with any plugin in the WordPress.org repository). -John Havlik Tagged: Breadcrumb NavXT, Code, Premium Extensions"
