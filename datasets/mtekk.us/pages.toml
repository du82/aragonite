full_description = "January 9th, 2025 Breadcrumb NavXT 7.4.1 Posted by John Havlik in Word* > Plugins This is the first, and hopefully only, bug fix release of the 7.4 branch of Breadcrumb NavXT. In 7.4.0, changes made to improve WordPress 6.7 compatibility resulted in Breadcrumb NavXT registering the legacy widget too late in the action sequence. This release fixes that issue making the legacy widget available again. -John Havlik 1 Comment Tagged: Code December 30th, 2024 Breadcrumb NavXT 7.4.0 Posted by John Havlik in Word* > Plugins Holy incremental improvements Batman! This second feature release of 2024 introduces the bcn_admin_post_root_args filter. This filter adds the ability to modify the arguments passed into wp_dropdown_pages() for the root page selection for the posts in the Breadcrumb NavXT settings page. On the bugfix front, the cause of the “Function _load_textdomain_just_in_time was called incorrectly” notice in WordPress 6.7 was fixed. Additionally, two bugs relating to breadcrumb trail generation on the home page when in the loop and when using the Breadcrumb Trail block in the block theme editor. Speaking of the Breadcrumb Trail block, two typos in two of the strings in the Breadcrumb Trail block were fixed. Lastly, bcn_breadcrumb_trail::post_hierarchy() was improved to be more resilient to unexpected returns from get_post(). Lastly, as a final reminder, in the next release of Breadcrumb NavXT (7.5.0) the bcn_breadcrumb::title_trim function will be removed. This is in alignment with the deprecation schedule for the title_trim function outlined back in 2021. -John Havlik 4 Comments Tagged: Breadcrumb NavXT, Code June 27th, 2024 Breadcrumb NavXT 7.3.1 Posted by John Havlik in Word* > Plugins This is the first, and hopefully only, bug fix release of the 7.3 branch of Breadcrumb NavXT. This release features three bug fixes. Two bugs involving the new behavior of $force when used on breadcrumb trails called within the loop were fixed. The first caused the incorrect template to be used when $force was set to false. The second bug was the $force parameter was not always passed into the bcn_breadcrumb_trail::fill() function. Lastly, an incorrect translation textdomain within adminKit was fixed. -John Havlik 5 Comments Tagged: Code Updated: January 3rd, 2025 at 8:36 pm"
