title = "MSPWUG | mtekk's Crib"
full_description = "May 27th, 2013 WordPress 10 Year Anniversary: Minneapolis Party Posted by John Havlik in Word* Today marks WordPress’ 10th year of existence. To celebrate, #wp10 parties are being held all over the world. In the Minneapolis/St. Paul area we met at Minnehaha Park. Unfortunately, the weather didn’t cooperate for the bike-ride/run that we planned to do before grilling. So, we stuck to socializing in the pavilion, grilling bratwurst (some hotdogs, chicken and a lonely hamburger made it to the grill as well), and eating birthday cake. -John Havlik [end of transmission, stay tuned] Tagged: Minneapolis, MSPWUG Updated: April 29th, 2020 at 6:01 pm April 10th, 2011 Worldwide WordPress 5k with the MSPWUG Posted by John Havlik in General [wpt-activity] Today, a few members of the MSP WordPress user group got together to participate in the Automattic Worldwide WordPress 5k run/walk/jog (and maybe I arrived a little late). The planning was a little last minute, and all week the forecast had it raining today. So we were quite lucky to actually get a group of 5 to participate and have it only feel like a humid summer morning with a gusting wind from south. Above is the route I ran (run #3 for the season). Starting at the band shell, I ran around lake Harriet, counter clockwise (like anyone who has ran around a track would). Since, the loop around lake Harriet is only about 2.8 miles, I continued past the band shell for another .15 miles before heading back to the band shell. I noticed two things about running around the lake. First off, it is rather flat around lake Harriet, which is a bit of a change from the somewhat hilly area I live in. I’d provide elevation numbers from my Forerunner 305, however, I noticed it is horribly inaccurate (on run #2 this year it had me climbing in elevation when I was actually going down hill). The second is there are far more people running/walking around the lakes in Minneapolis than just about anywhere out in the suburbs. -John Havlik [end of transmission, stay tuned] 4 Comments Tagged: MSPWUG, WWWP5k Updated: August 1st, 2020 at 7:05 pm"
