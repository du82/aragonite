full_description = "December 23rd, 2020 Breadcrumb NavXT Paths 1.7.0 Posted by John Havlik in Announcements Announcing the immediate availability of Breadcrumb NavXT Paths 1.7.0. This version introduces changes to how term archives to page mapping works. Previously, when a term was mapped to a page, that page’s hierarchy would be used for the rest of the breadcrumb trail. In Breadcrumb NavXT Paths 1.7.0, a new behavior was introduced where the term’s hierarchy would be maintained and only individual breadcrumbs would be replaced with pages. Toggling between the old behavior and the new behavior is controlled through the “Term Archive to Page Mapping” setting in the Paths section of the Breadcrumb NavXT settings page. Users with valid and activated license keys should receive an update notification within the WordPress dashboard and be able to use the update mechanism to update (just like with any plugin in the WordPress.org repository). -John Havlik 4 Comments Tagged: Breadcrumb NavXT, Code, Premium Extensions Updated: December 28th, 2020 at 7:57 pm August 31st, 2020 Breadcrumb NavXT Paths 1.6.0 Posted by John Havlik in Announcements Announcing the immediate availability of Breadcrumb NavXT Paths 1.6.0. This version adds a new filter, a new function, and the ability to enable/disable the referrer influenced term selection feature from the settings page. Users with valid and activated license keys should receive an update notification within the WordPress dashboard and be able to use the update mechanism to update (just like with any plugin in the WordPress.org repository). -John Havlik 5 Comments Tagged: Breadcrumb NavXT, Code, Premium Extensions May 1st, 2020 Breadcrumb NavXT Attributes 1.0.4 Posted by John Havlik in Announcements Announcing the immediate availability of Breadcrumb NavXT Attributes 1.0.4. This version features two bug fixes. The remove current item functionality within the shortcode works again in modern versions of Breadcrumb NavXT. Additionally, the post type root page is no longer erroneously included in the first breadcrumb trail generated by Breadcrumb NavXT Attributes. Users with valid and activated license keys should receive an update notification within the WordPress dashboard and be able to use the update mechanism to update (just like with any plugin in the WordPress.org repository). -John Havlik Tagged: Breadcrumb NavXT, Code, Premium Extensions Updated: May 1st, 2020 at 11:11 am"
