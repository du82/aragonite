full_description = "July 19th, 2007 Gentoo Blue Wave by John Havlik A while back while reading a tutorial by Nick La of N.Design Studio, I thought the concept of what his tutorial covered in Adobe Illustrator was cool. Of course, using Illustrator is not an option when running in a GNU/Linux environment. This is where Inkscape comes into play. Much like the GIMP, Inkscape does not do everything that its Adobe competitor does. Thus, abiding strictly to Nick’s tutorial is impossible, but getting to the same end result is possible. In the coming weeks I will post a supplement to Nick’s tutorial for the use in Inkscape. However, right now I’m introducing the end result of my Inkscape experimentation, Gentoo Blue Wave. This is a 1080p resolution wallpaper that abides to the Tango pallet. This is released under the Creative Commons Attribution-Noncommercial 3.0 License. -John Havlik [end of transmission, stay tuned] Posted in Art | Tagged: Gentoo, GNU Updated: February 8th, 2014 at 11:12 pm"
