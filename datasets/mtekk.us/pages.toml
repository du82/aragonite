full_description = "October 13th, 2013 WordUp Minneapolis 2013 Posted by John Havlik in Events Beginning in 2012, the Minneapolis/St. Paul WordPress community has put on a self organized, unconference centered around WordPress in the fall. This acts as a supplementary event to WordCamp Minneapolis, which will now be a yearly event in the spring (keep your calendars open for the last weekend in April 2014). A big thanks to Toby and Barbara for leading the organization effort for this. These are my pictures from the event. Continue reading Tagged: Minneapolis, WordUp Updated: February 8th, 2014 at 11:25 pm October 12th, 2013 WordUp Minneapolis 2013 Slides Posted by John Havlik in Events Unlike last year, where I was unable to attend WordUp Minneapolis. This year I prepared and lead a discussion titled “Tag Team WordPress Security”. Originally, this talk was to be presented with another person. However, due to uncontrollable circumstances (life gets busy), I was left as the only presenter for the talk. The talk covered several topics from basic security practices to how to spot malicious code, and many things in-between. Unlike previous talks, rather than struggling with PowerPoint (and clones) for making the slides, I moved to a WordPress based presentation tool. Thanks to this, you can visit slides.mtekk.us to view the slides from my presentation. Currently, this site only displays the “Tag Team WordPress Security” slide deck. However, all of my future slide decks will appear there. -John Havlik [end of transmission, stay tuned] 2 Comments Tagged: Minneapolis, WordUp Updated: April 7th, 2019 at 5:38 pm April 29th, 2013 WordCamp Minneapolis 2013 Posted by John Havlik in Events > WordCamp This past weekend we held the first WordCamp in the Twin Cities area in almost three years. To top it off, we held a BuddyCamp as well. A giant thanks to Kiko Doran, Justin Foell, Toby Cryns, the sponsors, and the rest of the volunteers that made WordCamp Minneapolis 2013 happen. These guys and gals put on a great event, as everything went very smoothly the planning and effort they put into it really showed. These are my pictures from the event. Continue reading 1 Comment Tagged: Minneapolis, WordCamp Updated: August 22nd, 2019 at 9:21 pm"
