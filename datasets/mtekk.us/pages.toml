["https://mtekk.us/archives/announcements/breadcrumb-navxt-wpml-extensions-1-5-6"]
title = "Breadcrumb NavXT WPML Extensions 1.5.6 | mtekk's Crib"
full_description = "July 7th, 2023 Breadcrumb NavXT WPML Extensions 1.5.6 by John Havlik Announcing an update to Breadcrumb NavXT WPML Extensions that enhances compatibility with the WPML 4.x. Previously, WPML transparently handled translation of Custom Post Type (CPT) labels, including when displayed in the breadcrumb trail. However, at some point this behavior stopped working. Breadcrumb NavXT WPML Extensions 1.5.6 adds a new translation domain, “Breadcrumb NavXT CPT Title”, which is populated with the CPT titles for translation. These titles are registered every time the Breadcrumb NavXT settings are saved in the settings page. Users with valid and activated license keys should receive an update notification within the WordPress dashboard and be able to use the update mechanism to update (just like with any plugin in the WordPress.org repository). If you run into any issues, please open a support ticket. -John Havlik Posted in Announcements | Tagged: Breadcrumb NavXT, Premium Extensions"
