description = "Hardware reviews"
full_description = "March 19th, 2024 The Intel Arc A310 in the HP Proliant MicroServer Gen 8 Posted by John Havlik in Reviews > Hardware The somewhat popular HP MicroServer series has been an excellent starting point for all sorts of home lab experimentation. They are particularly well suited for acting as a media server (using Plex, Jellyfin, or others). While CPU transcoding will suffice for a steam or two, it will heavily tax the CPU. Hence, the popularity of GPU transcoding (NVENC and QuickSync). Thanks to HP’s design decisions, the MicroSever Gen 8 does not enable the iGPU present on many Intel CPUs. What makes this an unfortunate decision is the MicroServer Gen 8 uses the LGA1155 socket—the consumer oriented socket where most of the CPUs, including the Xeons, have integrated graphics. Instead, a Matrox G200EH handles basic VGA duties. Which is a shame, the iGPU in the Ivybridge generation CPUs is not only more powerful, it also has QuickSync for transcoding acceleration. While this is disappointing, the MicroServer Gen 8 does have a PCIe x16 slot (PCIe 2.0). Continue reading 7 Comments Tagged: Stuff I Own June 14th, 2019 Seagate 5TB Backup Plus Portable (2019 Edition) Posted by John Havlik in Reviews > Hardware Seagate has recently updated their 2.5″ Backup Plus Portable line, redesigning the hard drive’s enclosure. The previous version was somewhat popular for drive shucking due to price, capacity, and ease of shucking. This new model, the STHP5000400, contains a 5TB 5400RPM hard drive in the 15mm tall 2.5″ form-factor. For those looking to inexpensively fill 2.5″ drive bays in a storage server/NAS, this seems to be the only choice. Continue reading Tagged: Stuff I Own Updated: June 1st, 2019 at 4:37 pm February 2nd, 2019 Moto X4 Posted by John Havlik in Reviews > Hardware Back in July (2018), I upgraded to the Motorola Moto X4. After over four-and-a-half years of faithful service, my Moto X (2013) was no longer cutting it. The battery was not lasting a day. I was pretty much out of storage (16GB is not enough), even with a minimal set of apps and music on the device. Topping it off, things were getting generally sluggish. While I had been looking at phones since December (2017), nothing hit the value mark I was looking for and worked on the Verizon network (they sure do not have “the devices” unless you want a phablet or an iPhone). I was considering the Google Pixel, but given its price point I was disappointed in the second generation device (the screen to body ratio was worse than the Moto X (2013)). I ended up settling for the Moto X4, and picked up the Amazon Prime version on Prime Day. Continue reading 2 Comments Tagged: Stuff I Own Updated: August 9th, 2019 at 9:28 am"
