full_description = "December 18th, 2018 Breadcrumb NavXT LearnDash Extensions 1.0.2 Posted by John Havlik in Announcements Announcing the immediate availability of Breadcrumb NavXT LearnDash Extensions 1.0.2. This version fixes a PHP warning present when working with newer versions of Breadcrumb NavXT. Users with valid and activated license keys should receive an update notification within the WordPress dashboard and be able to use the update mechanism to update (just like with any plugin in the WordPress.org repository). -John Havlik [end of transmission, stay tuned] 2 Comments Tagged: Breadcrumb NavXT, Code, Premium Extensions Updated: December 18th, 2018 at 8:20 pm September 8th, 2018 Breadcrumb NavXT uManager 1.1.0 Posted by John Havlik in Announcements Announcing the immediate availability of Breadcrumb NavXT uManager 1.1.0. This version introduces the [bcn_display] and [bcn_display_list] shortcodes for use within the WordPress post editor. Users with valid and activated license keys should receive an update notification within the WordPress dashboard and be able to use the update mechanism to update (just like with any plugin in the WordPress.org repository). -John Havlik [end of transmission, stay tuned] Tagged: Breadcrumb NavXT, Code, Premium Extensions July 14th, 2018 Breadcrumb NavXT Title Trixx 2.0.0 Posted by John Havlik in Announcements Announcing the immediate availability of Breadcrumb NavXT Title Trixx 2.0.0. For this version, the internal plugin structure was re-written to bring it inline structurally with the other premium extensions. Users with valid and activated license keys should receive an update notification within the WordPress dashboard and be able to use the update mechanism to update (just like with any plugin in the WordPress.org repository). -John Havlik [end of transmission, stay tuned] Tagged: Breadcrumb NavXT, Code, Premium Extensions July 14th, 2018 Breadcrumb NavXT Menu Magic 2.0.0 Posted by John Havlik in Announcements Announcing the immediate availability of Breadcrumb NavXT Menu Magic 2.0.0. For this version, the internal plugin structure was re-written to bring it inline structurally with the other premium extensions. Additionally, UberMenu support was improved with automatic suppression of the inclusion the UberMenu menu items that are for content organization only (e.g. [UberMenu Column], [UberMenu Row], [UberMenu Horizontal Divider], [UberMenu Custom Content], [UberMenu Tabs Block], [UberMenu Segment], and [UberMenu Widget Area]) in the breadcrumb trail. Users with valid and activated license keys should receive an update notification within the WordPress dashboard and be able to use the update mechanism to update (just like with any plugin in the WordPress.org repository). -John Havlik [end of transmission, stay tuned] Tagged: Breadcrumb NavXT, Code, Premium Extensions"
