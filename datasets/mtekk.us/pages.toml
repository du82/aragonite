title = "December | 2024 | mtekk's Crib"
full_description = "December 30th, 2024 Breadcrumb NavXT 7.4.0 Posted by John Havlik in Word* > Plugins Holy incremental improvements Batman! This second feature release of 2024 introduces the bcn_admin_post_root_args filter. This filter adds the ability to modify the arguments passed into wp_dropdown_pages() for the root page selection for the posts in the Breadcrumb NavXT settings page. On the bugfix front, the cause of the “Function _load_textdomain_just_in_time was called incorrectly” notice in WordPress 6.7 was fixed. Additionally, two bugs relating to breadcrumb trail generation on the home page when in the loop and when using the Breadcrumb Trail block in the block theme editor. Speaking of the Breadcrumb Trail block, two typos in two of the strings in the Breadcrumb Trail block were fixed. Lastly, bcn_breadcrumb_trail::post_hierarchy() was improved to be more resilient to unexpected returns from get_post(). Lastly, as a final reminder, in the next release of Breadcrumb NavXT (7.5.0) the bcn_breadcrumb::title_trim function will be removed. This is in alignment with the deprecation schedule for the title_trim function outlined back in 2021. -John Havlik 4 Comments Tagged: Breadcrumb NavXT, Code"
