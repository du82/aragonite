["https://mtekk.us/archives/art/mixed-colorspace"]
title = "Mixed Colorspace | mtekk's Crib"
full_description = "January 16th, 2010 Mixed Colorspace by John Havlik Colors are important, having the correct one can make or break a design. That is why professionals and even some enthusiasts spend copious amounts of money (well maybe not quite that much) on devices to ensure that when a color is picked, it looks the same on print and on the screen. Even with these devices, there are many pitfalls on the computer side. Case in point: what looks like a rich crimson in improperly color managed FireFox, The Gimp, and Windows Paint is actually a rusty maroon in color managed Windows Explorer, and FireFox (when set to manage CSS colors in conjunction with profiled images). While this is better than in Windows XP, it is still annoying. When Microsoft redid the graphics driver framework for Vista, they should have forced color correction onto the graphics drivers. That way, all applications would use the same color translation LUT and individual applications would not have to be aware of color profiles. Maybe they could do this for Windows 8 (then one could be in one of those “Windows 8 feature was my idea” commercials). -John Havlik [end of transmission, stay tuned] Posted in Art | Tagged: Rants, Windows 7 Updated: April 27th, 2020 at 6:21 pm"
