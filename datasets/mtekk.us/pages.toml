full_description = "April 27th, 2019 Breadcrumb NavXT Schema 1.0.0 Posted by John Havlik in Announcements Introducing Breadcrumb NavXT Schema. This plugin adds support for Yoast SEO 11.0’s Schema API, injecting the proper JSON-LD formatted Schema.org BreadcrumbList into the schema block. With this extensions, the schema BreadcrumbList will match the Breadcrumb NavXT generated breadcrumb trail displayed on the page. Tagged: Breadcrumb NavXT, Code April 12th, 2019 Breadcrumb NavXT 6.3 and Premium Extensions Posted by John Havlik in Announcements Over the past few weeks, various Breadcrumb NavXT extensions have been updated in preparation for Breadcrumb NavXT 6.3. Today, the last batch of extension updates are being released. The following extensions are now ready for Breadcrumb NavXT 6.3: Breadcrumb NavXT Attributes (1.0.3)Breadcrumb NavXT LearnDash Extensions (1.0.3)Breadcrumb NavXT Menu Magic (2.0.1)Breadcrumb NavXT Paths (1.5.3)Breadcrumb NavXT Polylang Extensions (1.5.3)Breadcrumb NavXT Title Trixx (2.0.1)Breadcrumb NavXT WPML Extensions (1.5.2) Breadcrumb NavXT 6.3 is not scheduled for release for another few weeks. However, it is recommended to update any extension plugins in use before updating Breadcrumb NavXT. Users with valid and activated license keys should receive an update notification within the WordPress dashboard and be able to use the update mechanism to update (just like with any plugin in the WordPress.org repository). Tagged: Breadcrumb NavXT, Code, Premium Extensions April 5th, 2019 Breadcrumb NavXT uManager 1.2.0 Posted by John Havlik in Announcements Announcing the immediate availability of Breadcrumb NavXT uManager 1.2.0. This version introduces two new features and offers improved compatibility with Breadcrumb NavXT 6.3.0. On the new feature front, a breadcrumb trail module for Divi is now included. Also new in 1.2.0 is the ability to use multiple taxonomies in a breadcrumb trail for a given post type. Additionally, the order these taxonomies appear in the breadcrumb trail can be specified in the Breadcrumb NavXT settings page. Users with valid and activated license keys should receive an update notification within the WordPress dashboard and be able to use the update mechanism to update (just like with any plugin in the WordPress.org repository). Tagged: Breadcrumb NavXT, Code, Premium Extensions Updated: April 5th, 2019 at 3:18 pm"
