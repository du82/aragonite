title = "The Beetle Roboticists: A Parable - Matthew T. Mason"
description = "How do we assess ideas about humanoids, without our anthropocentric bias? Maybe if the ideas were being pushed by another species. Beetles?"
full_description = "Home Matt’s Robotics Blog The Beetle Roboticists: A Parable SHARE: November 24, 2024 Prologue One morning, a parable landed in my head, and I wrote it down. I’m not sure what to do with it. So I’m posting it. The issue is humanoid robots, and the debate between two groups we will call the anthropophiles and the technophiles. The anthropophiles believe that robots should look like humans. They have good arguments: human hands are awesome; robots with similar hands could better share our tools; it would be easier to teach them how to use their hands, and bonus, they look like us! We can make them cute, sexy, adorable, or even creepy if we want. But the technophiles have good arguments too: we should take inspiration and lessons learned from the proven technology already deployed in factories, warehouses, homes, or wherever. So: anthropophilia versus technophilia. How can we judge this debate fairly? Since all humans have an anthropocentric bias, we need judges from some other species! And that is the silly idea that led to this parable. Should we try to imagine, say, a dolphin roboticist, weighing the arguments of the human roboticists? Or, what if we flip the roles? With a nod to Kafka, let’s imagine the roboticists are beetles, and then we humans can judge their arguments without bias. That is how the parable started, but then it got away from me. Perhaps I should hide it, but here it is. The Beetle Roboticists: A Parable There is a species of stag beetles (family Lacunidae) that has evolved intelligence, language, culture, and technology on par with humanity. Their burrows are all around us, some burrows are even inside our walls. The beetles are aware of us, even though we are not aware of them. Their burrows are furnished lavishly. All their stuff, everything they need to handle — cookware, appliance controls, doorknobs, and so on — is designed for handling by their mandibles. The beetles have a growing robotics industry, with automated factories and warehouses, and they have an active robotics research community. At their meetings, the beetle roboticists sometimes argue about robot gripper design. There are two main factions. The technophiles favor vacuum cups: “Look at factory automation. Learn from the engineers. They have to make things that actually work, and they are all using vacuum cups.” There is a second group, the lacuniphiles, who favor mandibles: “Learn from nature. Mandibles can handle everything. Vacuum is practical, for now, but mandibles are the future.” There is also a third faction, the anthropophiles. Actually, this faction is just one beetle. He believes in mimicking human hands. After quietly harboring this idea for many years, he gathered his courage and spoke up at a recent beetle robotics workshop: “We can learn from nature’s other designs, not just beetles. The humans get by pretty well with their hands.” There was a stunned silence, and then the meeting erupted. “Human hands?!? Human hands are practically useless!” “How are those big stubby fingers supposed to get into cavities and crevices?” “If human hands are so great, why do they need all those tools?” “Have you seen a human pick up a flat thing? They can’t! They have to slide it to the edge of the table. Nothing funnier than watching a poor human try to pick up a card lying on the bottom of a box.” “Humans think their hands are great, but that’s only because they designed all their stuff to fit their hands!” “Do you know how humans pick up little things? Sometimes they actually lick a fingertip, and then hope the thing sticks. Maybe it does, maybe it doesn’t, or maybe it sticks for a second and then falls on the floor. Even if they finally get it, it’s wet!” “When humans have to handle things not designed for their hands, it’s all tools! Look at their dentists and surgeons. Look at their watchmakers.” But the anthropophile was ready for these attacks. “That’s okay, that’s all fine. We give the robots human hands, and then we give them human tools!” Before the furor could resume, the workshop chairbeetle spoke up. “That’s all we have time for today. This has been a stimulating discussion, hasn’t it? Let’s thank everybody who contributed. It’s time for refreshments.” After some scattered applause, the beetle roboticists stand and move into the adjoining burrow, where appetizers and drinks are waiting. Epilogue Will this parable help us shed our prejudices? It worked for me, at least a bit. I would characterize myself as a technophile. I love suction cups and simple grippers. I would also classify myself as a functionalist. Ideally, you should identify the set of tasks you want to address, and then select the design that addresses those tasks most effectively. Form follows function. I love the objectivity this brings to robotics and engineering generally. But what does a functionalist like me say to somebody who just loves to build hands? Would I tell them to abstain? Of course not. We can learn from their efforts. And don’t forget: robotics began with the idea of building artificial humans. One final observation: As long as we are stepping back, trying to shed our prejudices and see the big picture, what about aesthetics? What about art? A wonderful thing about robotics is that it brings engineers and artists together, to share the joy of building machines to explore ideas. What a grand place to work. Let’s not lose sight of that. Login Label {} [+] Name* Email* Website Label {} [+] Name* Email* Website 17 Comments Inline Feedbacks View all comments Jason Yap 3 months ago Agreed, Matt! Form follows function in my world too. Interfaces matter and the most advanced AI and Machine Vision won’t provide proper ways to grip varied items with a single gripper. Even people regularly use tools to more easily gain leverage/purchase to more effectively carry items. Where does the rubber meet the road? Where and how does the gripper meet the item? How much does it matter? All good questions to ask to support critical KPI’s for customers. Reply Kevin Lynch 3 months ago Love the parable, Matt! I assume there are also some beetle roboticists who are simultaneously technophiles and lacuniphiles? And perhaps simultaneously anthropophiles, tentacophiles, …? Reply Jason Yap Reply to Kevin Lynch 3 months ago My silliness immediately went to some beetles being coprophiles and what those robots would look like. Then my better sense took over 😀 Reply Matt Author Reply to Kevin Lynch 3 months ago Yes, I think you’re right. Originally I was thinking of these categories as mutually exclusive. I guess the parable still presents the workshop factions that way. But, the writing process brought a little more clarity, which I hope is reflected in the epilogue. Last edited 3 months ago by Matt Reply Glen Speckert 3 months ago Matt – Interesting discussion. I once was responsible for the man-machine interface to a physical physics machine. The path was from through hands to computers to distributed smaller computers to physical world, with information returning from small machine to bigger machine organized and presented to operator’s eyes and to the larger consciousness stack. There was no concept of intelligence in the machine, intelligence in the tools, just the idea that “we” are the center of the universe, and information flows in and out. LLMs and emerging Large Vision Models, Large Geo Models, Large (any data) Models, Large Beetle Models -> imply that intelligence is an emergent property. The Beetle Roboticist, integrated with its R2D2 intelligence personified (to allow communication with their singularity), should create a solution which would do everything a Beetle needs to do. – Glen Reply Marc Raibert 3 months ago The thing about multi-fingered robot hands is that they are not much like human hands. The palms are all wrong. The padding/compliances are mostly wrong. Either the sensors are feeble or the brains behind the sensors are feeble. I think I am agreeing with Matt, that once you know the set of things you want to accomplish you can decide on a suitable hand design and tools it will use. Reply Dave Miller 3 months ago What about mandibles? Ver cool! Reply Vytas SunSpiral 3 months ago Great conversation starter Matt. What I find really interesting is zooming out and not just asking what task is the robot being made for, but the context the task will be occurring in. Humanoid robots appear to me to be most useful in settings where there will be mixed initiative between humans and robots — i.e. in task setting which are designed for human interaction, and which must continue to be human accessible. Then, the human form factor makes sense. A robotic helper in a human home generally need to have human like properties for motion and manipulation (though no reason not to give it some extra tricks, like suction cups on a finger tip or a third arm, or whatever ends up being effective). But what doesn’t make sense in the long run is the use of humanoid robots to the point that they fully displace human labor. If you look at some of the promotional videos of a factory setting with humanoids doing all the work, I don’t understand why you would want all the extra complexity of a humanoid. if it ends up being a fully robotic facility, give those robots wheels and save battery power, and do some good design for manufacturing and develop a highly optimized automation process. That being said, there may be a transitional period where humans and humanoids labor together in existing human-optimized facilities. If there are tasks that cannot be automated and humans continue to work together with robots, then great, but over time it seems like the robots will end up automating large swaths of the work, humans will no longer be working in those sections of the facilities, and at that point more task optimized automation solutions will be much more efficient than humanoid robots. In the long run, they may not have a lot of use outside of truly shared human/robot settings, pushing them more towards service roles (homes, restaurants, events, entertainment, etc), and only serving a transitional role in industrial production settings. Perhaps they have a role in low-volume custom engineering settings, supporting human engineers in tasks that are not routine enough for task specific automation. But I just don’t see a long term role for them in high volume manufacturing, despite the current marketing efforts in that direction. Reply 'Dan 3 months ago Crows get pretty far with their beaks. Oh I should have brought a pair of pliers to manipulation day that’d been fun! 😊 Reply Howie Choset Reply to 'Dan 3 months ago Nice story, Matt. One thing I thought you were going to say is that we scientists want to study human hands because of all the rich scientific questions they pose, but I learned from you, that there are still tons of good scientific questions to be answered, even with simple parallel jaw grippers, and with manipulators that are not hands. Perhaps my comment is orthogonal to your story, but that is what your blog reminded me of. There is insight to be discovered everywhere, even in building robot hands. Ps. Do you think your story would’ve been different if it had been with snakes instead of beetles? Reply Matt Author Reply to Howie Choset 3 months ago Haha! Snakes. I’m trying to dream up a discussion among the snake roboticists. Wait a second. I’ve been thinking about snakes for about a minute now. You’ve been thinking about snakes for, what, thirty years? I think you should write the snake roboticists parable. Reply Yide Liu 3 months ago I love the parable! Especially the discussion from the beetle roboticist community. It’s particularly inspiring for people who are building beetle-like robots, like me. Last edited 3 months ago by Yide Liu Reply Nabeel Kamal 3 months ago Hilarious article, Thank you. I am also a technophile in this sense. Reply Zhiwei Zhang 3 months ago Thanks Matt for your awesome parable. Besides anthropophilia versus technophilia, I think there is a similar question of generalist versus specialist: are people preferring a robot that can handle everything but just do so-so, or a robot that expertises in only one job. The reason why people prefer anthropomorphic may because they are short of imagination, and have no idea of what a robot generalist should look like rather than a human being. When people saying “they prefer humanoid robots”, they are really meaning “they want a robot generalist”. Reply Lael Odhner 2 months ago Hey Matt, fun thought. A brief dissent: Half the fun about the study of biological manipulation — and by extension, robotic manipulation — is that we can’t pigeonhole human or animal limbs into a functionalist telos, with few exceptions, such as animals whose behavior and limb shape are obviously co-evolved. Humans and most higher animals do many things with our hands, none of which could be unambiguously declared as the primary function. We do just have to empirically explore and characterize biological manipulation as discovered mechanisms and phenomena. To the degree that functionalism is a great tool for both design and reductive analysis, I think we also need to make an effort to keep the “fun” in “functionalist”. Functionalist ideas led architecture through some high points (L. Sullivan) and some low points (Le Corbusier). A large part of the attraction in robotics is that we’re not just designing functional objects, we’re participating in those mystical Platonic forms of living beings. That takes the imagination in a way that designing dishwashers or forklifts will never do for most people. Reply Amy LaViers 2 months ago One of the arguments for “humanoids” (an-ill defined term) is for machines that can better engage in “body language” (another ill-defined term) and other forms of nonverbal communication. Thus, function and expression are inextricably linked: more expressive robots are more functional in this way. However, the arts shows us many examples of “non-humanoid” forms that appear to be successful at bodily communication, e.g., think of Flubber and the many shapes and dynamic qualities this character takes on in the span of one movie. In https://mitpress.mit.edu/9780262546126/making-meaning-with-machines/ we lay out “features of expressive bodies” (hopefully a better-defined, if not yet well-defined, concept) that seem to us to be shared across many cases and morphologies. We don’t just need beetle roboticists, we need flubber roboticists, alien roboticists, octopus roboticists (already a healthy field, taking inspiration from perhaps the closest thing to alien life we can get!), and many many more… and artist-roboticists to try making meaning with this myriad of platforms. Reply marc böhlen 2 months ago Oh those silly beetles. Will they ever learn to see beyond their mandibles? Your parable reminds me of the biosemiotics debates spawned by Uexküll’s concept of ‘Umwelt’. Reply"
