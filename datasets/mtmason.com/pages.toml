["https://mtmason.com/the-funnest-ideas-in-robotics-2"]
title = "The funnest ideas in robotics - Matthew T. Mason"
description = "A blog to find and explore the coolest and funnest ideas in robotics. Are humans robots? Should robots look like humans? Much to follow."
full_description = "Home Matt’s Robotics Blog The funnest ideas in robotics SHARE: October 23, 2024 My goal with this blog is to find the coolest and funnest ideas in robotics, and to have fun with them. It’s a big job, I don’t know if I’m up to it, but it’ll be fun to try, and I hope it’ll be fun to read. Even better, I hope readers will join in the fun and offer their own contributions in the comments. If you’re still with me, you’re probably wondering, “What are these fun ideas?” Here’s a good one: Animals are robots. That includes humans. We are robots. If a robot is an intelligent machine, then we are robots, and evolution is a roboticist. Everything we learn in robotics, we can ask whether it might apply to ourselves. Here’s a variation on that idea: Each of us has an inner robot. When you walk, run, clean, cook, or whatever, it seems that almost all of the required brain activity is subconscious. (Sometimes roboticists refer to that subconscious stuff as “physical intelligence.” See the Ted talk by Sangbae Kim.) If you, the conscious self, had to figure out what every muscle should be doing, every fraction of a second, you would be in big trouble. Instead, you have an inner robot that takes care of the details, and you are mostly just along for the ride. Your inner robot is like a pet! You can train it, and guide it, but it doesn’t speak English. Be sure to take good care of your pet robot! Here are two more fun ideas: Anthropomorphism: Robots should look like humans. Functionalism: Robot designs should optimize performance. If we really want to have fun, we could have a fight: Anthropomorphism versus functionalism! Should robot designers be good engineers and let form follow function? Or should they copy evolution’s design? Some tangential questions come up: Is the human form optimal for our tasks and our environment? Is evolution done tweaking the human form? Maybe you’d rather have your eyes on stalks. That way you could have one eye looking forward and one backward, when needed, and you could get your eyes into all those places your head won’t fit. And you wouldn’t need a mirror! And while we’re at it, should we have lights alongside our eyes? Some of the funnest ideas are pretty far out there. Let’s call them the wild ideas. For example: The obsolescent economy. When robots can do everything humans can do, including making more robots, then all costs go to zero, and the economy as we know it will cease to be. This idea was recently pushed by Elon Musk, but I first saw it in a research proposal when I was in grad school at the MIT AI Lab. I don’t know who wrote it, but Marvin Minsky is a likely source. It said that one day, when robots are building robots, robots will be so cheap that each head of lettuce growing in a field will have a robot squatting next to it, watching it grow, and flicking off the occasional grasshopper. Uploading our minds. When AI is solved, we can upload our minds to the cloud, and then we can share with each other as deeply as we want, even merging minds with each other and with AIs. Besides the fun ideas and the wild ideas, there are the dangerous ideas. Dangerous, in the sense that they are fun, but they can absorb all your thinking without meaningful progress. Black holes. Bottomless pits. Tarpits. You might start pondering one of these ideas, and never be heard from again. Keep your distance! I have examples, but I’m not sure I should share. My plan is to stick to the fun ideas, and mostly stay away from the wild or dangerous ideas. But, who knows? I hope to follow the fun wherever it leads. I hope you will enjoy it enough to contribute. Login Label {} [+] Name* Email* Website Label {} [+] Name* Email* Website 42 Comments Inline Feedbacks View all comments random turtle 4 months ago I was once writing a sci-fi novel close to uploading your mind, where poor people’s brains are used as “GPUs” for rendering hi-res scenes for rich people… However, I only made it to Chapter 1.1 😉 Reply Jiaji 4 months ago Regarding Anthropomorphism vs Functionalism: let’s think about home robots, would it be a full adult size or kid-size humanoid? Or maybe a collection of Roomba (tiny) like special purpose robots/devices? Reply Jason 4 months ago Hi Matt! Congrats on your Blog! Reply Chris Langmead 4 months ago Proteins are robots. They can sense, react and self-organize to carry out precise tasks automatically. Reply Matt Author Reply to Chris Langmead 4 months ago Hey, Chris! I’m sure I would agree with you, if I knew more about proteins. Your comment has goaded me to address this ignorance. I ordered a copy of Bruce Donald’s book “Algorithms in Structural Molecular Biology.” Reply Supun Gamlath Reply to Chris Langmead 4 months ago I had the same thought but with DNA! DNA are the real robots while almost everything living thing (plants, animals, fungi) are vessels for these robots to live and replicate themselves in different environments. I believe Richard Dawkins called this the selfish gene theory. Reply Erol Sahin 4 months ago Here is a dangerous one: Robots should (will) be conscious. Reply Matt Author Reply to Erol Sahin 4 months ago You’re probably right. Maybe I should have killed your comment! Reply David K 4 months ago Welcome to the world of blogging. This looks like it will be fun. Reply Weiwei 4 months ago Congratulations! Reply Kostas Daniilidis 4 months ago “When you walk, run, clean, cook, or whatever, it seems that almost all of the required brain activity is subconscious.” This reminds me of Daniel Dennett’s competence without comprehension: “Competence without comprehension is the way of life of the vast majority of living things on the planet and should be the default presumption until we can demonstrate that some individual organisms really do, in one sense or another, understand what they are doing.” From Bacteria to Bach and Back. Thank you for starting this blog Matt!! Reply Matt Author Reply to Kostas Daniilidis 4 months ago Thanks Kostas. I thought the work would be in writing the blog posts. But now I see I will be chasing down and pondering new leads. I’m a big fan of Dennett, but hadn’t read that one. Now i have to! That quote — perfect. Reply Hong Reply to Kostas Daniilidis 4 months ago That sounds like how deep neural network behaves. May be explainability (XAI) is not always necessary and useful. Reply Udeogu Micah 4 months ago No matter what the down sides are, I’m pretty sure robots will be fun Reply Matt Author Reply to Udeogu Micah 4 months ago I like it. Imagine Skynet is real, the Terminators are wiping us out, and the last two humans turn to each other and say “Wow, isn’t this fun!” And, the blog seems to be more work than I expected. I didn’t realize I was going to want to respond to every comment! Reply Nima 4 months ago Amazing! Thank you for making this Matt! Here is a fun one: Robotic Dream Synchronization: If we each have an “inner robot,” what if we could tune our inner robots to synchronize through shared dreamscapes? Imagine a future where we connect our subconscious “robotic” minds through neural interfaces to dream together — if you know kung fu, your inner robot teaches my inner robot kung fu — bam! The Matrix 😀 Reply Matt Author Reply to Nima 4 months ago Oh, interesting. My thinking hadn’t gone in that direction. Hmmmm. If the science / technology advances far enough we can upload our minds, then all kinds of things are possible. It might go far enough to reveal to us all of those dark corners in our minds, not just the inner robot. Yikes. Seems like we are getting into cyberpunk novel territory. Reply Daniela 4 months ago Matt congratulations — I enjoyed the blog and look forward to the next one! I love how you say our pet robot does most of the heavy lifting, and thank goodness it doesn’t consult us every time it wants to lift a foot or flex a finger. I’m not up for micromanaging my muscle fibers 24/7! Reply Oliver Brock 4 months ago Matt says: “Animals are robots. That includes humans. We are robots.” Are all living things robots? What sets all living things (including robots) apart from non-living things? Is “living” the same as “intelligent”? Answers: Yes. The interactions between components. Yes, I suspect it is. Is it not surprising that there is a part of science concerned with material things, where – historically speaking – it has been relatively easy to come up with laws, principles, and other statements that generalize very well? Like f = m . a, it seems like it holds for a wide range of conditions, across time and space. And then there seems to be a second branch of science about animate things, i.e., matter arranged in such a way that it behaves distinctly from “just” matter. In fact, it behaves so differently that we call it alive. But in this second branch, science has not been as successful in coming up with laws and principles that hold under a wide range of conditions. What are we missing in the second branch of science? Should we approach the second branch differently than the first branch, i.e., differently from how we approached traditional disciplines that physics? Is that maybe even something that is holding us back? That we are attempting to approach living things with a physics mindset, kind of bottom-up from a hard-core empirical perspective? Should be open to significantly expanding our scientific methods and tools to tailor them to the phenomena in the second branch? Or is life just hopelessly messy and there will never be such a neat and tidy list of principles as there seems to be in the realm of physics? Reply Matt Author Reply to Oliver Brock 4 months ago Hey, Oliver, thanks for jumping in. By a weird coincidence, I just picked up a copy of Norbert Wiener’s “Cybernetics,” and it begins by noting the difference between Newtonian mechanics, where time can be reversed and still obey all the physics laws, versus e.g. thermodynamics, where that is not so. I think Wiener might have said that is the same distinction you are talking about. Yes? No? Reply Abhishek Sharma Reply to Oliver Brock 4 months ago Dear Prof. Mason and Prof. Brock, Thanks for raising a very interesting discussion. I am thinking a lot about physics of complex systems which I believe is relevant here. The key features which define living systems often include non-equilibrium, self-replication, metabolism, and compartmentalization. As Rasmussen et al (2010) says, “The heritable information (genes) is of course also crucial to the bottom-up approach. But without energy, clearly no life is possible, so a metabolism capable of fuelling the life process is just as necessary. A container also seems unavoidable: the energetics and information need to support each other’s production, which can happen most conveniently in some sort of corral, such as a membrane.” Robots appear to be intelligent as a human-invented algorithm drives its sensor-actuator networks. In my opinion, a human-made robot only represents a “technosignature” (signature of the existence of life) but it is not a living system. The difference between a living and non-living system is very clear when one considers a robot such as Boston Dynamics robotic dog and a real dog. The robotic dog mimics a few life-like characteristics that emerge as an outcome of a human-designed algorithm. The universal definition of life is indeed a complex problem, and we often describe “Life as we know it”. However, all living systems harnesses complexity to persist and perform complex tasks that require information processing. We recently showed that molecular complexity could be used as a signature of life and could distinguish living systems from non-living systems (ACS Cent. Sci. 2024, 10, 5, 1054–1064). I believe if all living things are considered as robots, it could signify that the universe is computational at the bottom as suggested by Wolfram. Do you consider the universe to be computational? Physics is analytic (I believe it is referred as the first approach) and complex systems including biology/living things are often considered as algorithmic (referred as second approach) in nature (Thurner et al. Introduction to the Theory of Complex Systems, 2018). The key difference comes as physical systems are governed by a fixed set of laws. However, laws governing biological systems are dynamic in nature. A simple example is replication-mutation dynamics, such as the Quasispecies model developed by Manfred Eigen. Additionally, there is no concept of novelty in current models of physics. The key reason is that there is no clear distinction between a system and its surroundings, as often discussed in statistical mechanics based models. The contingent variation within a living system as an outcome of evolutionary processes becomes part of the environment that influences its future outcomes. I believe the two approaches, analytic and algorithmic, have strong connection as suggested by Charles Bennett (Thermodynamics of Computation). However, a lot is required to be figured out to have a consistent theory that could combine physics and biology together. Recently, we developed Assembly Theory as an attempt to combine physics and biology by considering the physically plausible combinatorial spaces of future possibilities in an evolving system (https://rdcu.be/dYLL5 ). This allows us to define a generalised definition of the selection process (pre-Darwinian), which is essential for any system having a propensity towards life (and intelligence). I believe even at a very early stage, Assembly Theory has the potential to bring two approaches together. Looking forward to hear from you. Reply Matt Author Reply to Abhishek Sharma 3 months ago Dear Abhishek, Thanks for bringing a “life” perspective to this discussion. To most of your questions I have no good answers. When it comes to life, philosophy, and almost everything, come to think of it, I am a dilettante. So here are a dilettante’s answers. Maybe it will provoke some better-informed readers to answer. I think you are suggesting that only living things can be intelligent. Being a generic AI guy, my view is that intelligence is computation. The brain is a computer, and the mind is a computational process. How do we define intelligence, in such a way to differentiate it from lesser forms of computation? I don’t know, so the easiest path is to assume there is no meaningful distinction. John McCarthy had a beautiful example of this view: a thermostat can have either of two ideas: it’s too hot in here, or it’s too cold in here. Do I think the universe is computational? No, I think of the universe as a dynamic system following the laws of physics. Even a computer is a hunk of stuff following the laws of physics. Signals, symbols, communication, and computation are all models that we share and apply as appropriate. A computer is not inherently computational, but the computational model of computers works incredibly well, thanks to the efforts of zillions of engineers. ( So these “words” a"
