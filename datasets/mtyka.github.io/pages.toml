["https://mtyka.github.io/make/2015/09/12/the-conquest-of-ubiquity.html"]
title = "The conquest of ubiquity - Paul Valéry"
description = "I recently came across this short essay by Paul Valéry. Valéry pretty much anticipates the modern internet age with its torrent of media all around us, which..."
full_description = "I recently came across this short essay by Paul Valéry. Valéry pretty much anticipates the modern internet age with its torrent of media all around us, which is an astonishing feat of foresight, given he wrote this in 1928. Below in full both in English and the original French. The Conquest of Ubiquity Paul Valéry, 1928 OUR FINE ARTS were developed, their types and uses were established, in times very different from the present, by men whose power of action upon things was insignificant in comparison with ours. But the amazing growth of our techniques, the adaptability and precision they have attained, the ideas and habits they are creating, make it a certainty that profound changes are impending in the ancient craft of the Beautiful. In all the arts there is a physical component which cannot be considered or treated as it used to be, which cannot remain unaffected by our modern knowledge and power. In the last twenty years neither matter nor space nor time has been what it was from time immemorial. We must expect innovations to transform the entire technique of the arts thereby affecting artistic invention itself and perhaps even bringing about an amazing change in our very notion of art. At first, no doubt, only the reproduction and transmission of works of art will be affected. It will be possible to send anywhere or to re-create anywhere a system of sensations, or more precisely a system of stimuli, provoked by some object or event in any given place. Works of art will acquire a kind of ubiquity. We shall only have to summon them and there they will be, either in their living actuality or restored from the past They will not merely exist in themselves but will exist wherever someone with a certain apparatus happens to be. A work of art will cease to be anything more than a kind of source or point of origin whose benefit will be available and quite fully so, wherever we wish. Just as water, gas, and electricity are brought into our houses from far off to satisfy our needs in response to a minimal effort, so we shall be supplied with visual- or auditory images, which will appear and disappear at a simple movement of the hand, hardly more than a sign. Just as we are accustomed, if not enslaved, to the various forms of energy that pour into our homes, we shall find it perfectly natural to receive the ultrarapid variations or oscillations that our sense organs gather in and integrate to form all we know. I do not know whether a philosopher has ever dreamed of a company engaged in the home delivery of Sensory Reality. Of all the arts, music is nearest to this transposition into the modem mode. Its very nature and the place it occupies in our world mark it as the first to be transformed in its methods of transmission, reproduction, and even production. It is of all the arts the most in demand, the most involved in social existence, the closest to life, whose organic functioning it animates, accompanies, or imitates. Whether it be a matter of speaking or walking, of meditation or action, of monotony or surprise in the temporal flow of our lives, music can take hold of us, combining and transfiguring the pace and sensory values of them all. It weaves us an artificial span of time by lightly touching the keys of our real life. We become accustomed to it, we give ourselves up to it as voluptuously as one might to the “just, subtle, and mighty” substances praised by Thomas De Quincey. Since it directly attacks the emotional mechanism, which it plays on and maneuvers at will, it is universal in essence; it delights the ear and sets people dancing the world over; like science it becomes and international need and commodity. This circumstance, taken in connection with recent progress in the means of transmission, suggested two technical problems: To make a piece of music instantly audible at any point on the earth, regardless of where it is performed. To reproduce a piece of music at will, anywhere on the globe and at any time. These problems have been solved. The solutions are being further refined every day. We are still far from having controlled visual phenomena to the same degree. Color and relief are still rather resistant. A sunset on the Pacific, a Titian in Madrid cannot yet be enjoyed in our living room with the same force of illusion as a symphony. That will happen some day. Perhaps they will do still better and find a way of showing us something of what goes on at the bottom of the sea. But as for the worlds of sounds, noises, voices, tonalities, they are already ours. We evoke them when and where we please. Formerly we could not enjoy music at our own time, according to our own mood. We were dependent for our enjoyment on an occasion, a place, a date, and a program. How many coincidences were needed! Today we are liberated from a a servitude so contrary to pleasure and, by that same token, to the most sensitive appreciation of works of music. TO be able to choose the moment of enjoyment, to savor the please when not only our mind desires it, but our soul and whole being craves and as it were anticipates it, is to give the fullest scope to the composer’s intention, for it permits his creatures to live again in a vibrant milieu not very different from that in which they were created. In recorded music the work of composer or performer finds the conditions essential to the most perfect aesthetic returns. I am reminded here of a fairy play that, as a child, I saw in a foreign theater. Or perhaps I only fancy I saw it. In the Sorcerer’s palace the furniture spoke and sang, took a poetic and mischievous part in the action. A door opening set off the piping or solemn tones of a village band. If anyone sat down on a pouf, it would sigh politely. At a touch everything breathed forth a melody. I sincerely hope we are not moving toward such excesses in the magic of sound. Even now one can no longer eat or drink at a cafe without being disturbed by a concert. But it will be wonderfully pleasant to be able to transform at will an empty hour, an interminable evening, an endless Sunday, into an enchantment, an expression of tenderness, a flight of the spirit. Days can be gloomy; there are men and women who are very much alone, and many whom age or infirmity confines to their own company with which they are only too familiar. These men and women, reduced to boredom and gloom, can now fill their sad and useless hours with beauty or passion. Such then are the first fruits offered us by the new intimacy between music and physics, whose immemorial alliance had already given us so much. We shall see many more. La conquête de l’ubiquité Paul Valéry, 1928 Nos Beaux-Arts ont été institués, et leurs types comme leur usage fixés, dans un temps bien distinct du nôtre, par des hommes dont le pouvoir d’action sur les choses était insignifiant auprès de celui que nous possédons. Mais l’étonnant accroissement de nos moyens, la souplesse et la précision qu’ils atteignent, les idées et les habitudes qu’ils introduisent nous assurent de changements prochains et très profonds dans l’antique industrie du Beau. Il y a dans tous les arts une partie physique qui ne peut plus être regardée ni traitée comme naguère, qui ne peut pas être soustraite aux entreprises de la connaissance et de la puissance modernes. Ni la matière, ni l’espace, ni le temps ne sont depuis vingt ans ce qu’ils étaient depuis toujours. Il faut s’attendre que de si grandes nouveautés transforment toute la technique des arts, agissent par là sur l’invention elle-même, aillent peut-être jusqu’à modifier merveilleusement la notion même de l’art. Sans doute ce ne seront d’abord que la reproduction et la transmission des œuvres qui se verront affectées. On saura transporter ou reconstituer en tout lieu le système de sensations, – ou plus exactement, le système d’excitations, – que dispense en un lieu quelconque un objet ou un événement quelconque. Les œuvres acquerront une sorte d’ubiquité. Leur présence immédiate ou leur restitution à toute époque obéiront à notre appel. Elles ne seront plus seulement dans elles-mêmes, mais toutes où quelqu’un sera, et quelque appareil. Elles ne seront plus que des sortes de sources ou des origines, et leurs bienfaits se trouveront ou se retrouveront entiers où l’on voudra. Comme l’eau, comme le gaz, comme le courant électrique viennent de loin dans nos demeures répondre à nos besoins moyennant un effort quasi nul, ainsi serons-nous alimentés d’images visuelles ou auditives, naissant et s’évanouissant au moindre geste, presque à un signe. Comme nous sommes accoutumés, si ce n’est asservis, à recevoir chez nous l’énergie sous diverses espèces, ainsi trouverons-nous fort simple d’y obtenir ou d’y recevoir ces variations ou oscillations très rapides dont les organes de nos sens qui les cueillent et qui les intègrent font tout ce que nous savons. Je ne sais si jamais philosophe a rêvé d’une société pour la distribution de Réalité Sensible à domicile. La Musique, entre tous les arts, est le plus près d’être transposé dans le mode moderne. Sa nature et la place qu’elle tient dans le monde la désignent pour être modifiée la première dans ses formules de distribution, de reproduction et même de production. Elle est de tous les arts le plus demandé, le plus mêlé à l’existence sociale, le plus proche de la vie dont elle anime, accompagne ou imite le fonctionnement organique. Qu’il s’agisse de la marche ou de la parole, de l’attente ou de l’action, du régime ou des surprises de notre durée, elle sait en ravir, en combiner, en transfigurer les allures et les valeurs sensibles. Elle nous tisse un temps de fausse vie en effleurant les touches de la vraie. On s’accoutume à elle, on s’y adonne aussi délicieusement qu’aux substances justes, puissantes et subtiles que vantait Thomas de Quincey. Comme elle s’en prend directement à la mécanique affective dont elle joue et qu’elle manœuvre à son gré, elle est universelle par essence ; elle charme, elle fait danser sur toute la terre. Telle que la science, elle devient besoin et denrée internationaux. Cette circonstance, jointe aux récents progrès dans les moyens de transmission, suggérait deux problèmes techniques : Faire entendre en tout point du globe, dans l’instant même, une œuvre musicale exécutée n’importe où. En tout point du globe, et à tout moment, restituer à volonté une œuvre musicale. Ces problèmes sont résolus. Les solutions se font chaque jour plus parfaites. Nous sommes encore assez loin d’avoir apprivoisé à ce point les phénomènes visibles. La couleur et le relief sont encore assez rebelles. Un soleil qui se couche sur le Pacifique, un Titien qui est à Madrid ne viennent pas encore se peindre sur le mur de notre chambre aussi fortement et trompeusement que nous y recevons une symphonie. Cela se fera. Peut-être fera-t-on mieux encore, et saura-t-on nous faire voir quelque chose de ce qui est au fond de la mer. Mais quant à l’univers de l’ouïe, les sons, les bruits, les voix, les timbres nous appartiennent désormais. Nous les évoquons quand et où il nous plaît. Naguère, nous ne pouvions jouir de la musique à notre heure même, et selon notre humeur. Notre jouissance devait s’accommoder d’une occasion, d’un lieu, d’une date et d’un programme. Que de coïncidences fallait-il ! C’en est fait à présent d’une servitude si contraire au plaisir, et par là si contraire à la plus exquise intelligence des œuvres. Pouvoir choisir le moment d’une jouissance, la pouvoir goûter quand elle est non seulement désirable par l’esprit, mais exigée et comme déjà ébauchée par l’âme et par l’être, c’est offrir les plus grandes chances aux intentions du compositeur, car c’est permettre à ses créatures de revivre dans un milieu vivant assez peu différent de celui de leur création. Le travail de l’artiste musicien, auteur ou virtuose, trouve dans la musique enregistrée la condition essentielle du rendement esthétique le plus haut. Il me souvient ici d’une féerie que j’ai vue enfant dans un théâtre étranger. Ou que je crois d’avoir vue. Dans le palais de l’Enchanteur, les meubles parlaient, chantaient, prenaient à l’action une part poétique et narquoise. Une porte qui s’ouvrait sonnait une grêle ou pompeuse fanfare. On ne s’asseyait sur un pouf, que le pouf accablé ne gémît quelque politesse. Chaque chose effleurée exhalait une mélodie. J’espère bien que nous n’allons point à cet excès de sonore magie. Déjà l’on ne peut plus manger ni boire dans un café sans être troublés de concerts. Mais il sera merveilleusement doux de pouvoir changer à son gré une heure vide, une éternelle soirée, un dimanche infini, en prestiges, en tendresses, en mouvements spirituels. Il est de maussades journées ; il est des personnes fort seules, et il n’en manque point que l’âge ou l’infirmité enferment avec elles-mêmes qu’elles ne connaissent que trop. Ces vaines et tristes durées, et ces êtres voués aux bâillements et aux mornes pensées, les voici maintenant en possession d’orner ou de passionner leur vacance. Tels sont les premiers fruits que nous propose l’intimité nouvelle de la Musique avec la Physique, dont l’alliance immémoriale nous avait déjà tant donné. On en verra bien d’autres."
