["https://mtyka.github.io/make/2010/02/04/grooviks-cube.html"]
title = "Grooviks Cube"
description = "Introduction"
full_description = "Introduction I wrote this report post-event out of my memory as it is still relatively fresh and hasn’t quite evaporated into the vaults of my brain forever to remain hazy and altered. I’ll recall the events as they happened from my point of view, this is by no means an objective report of how the cube came to be. Sadly i did not have time to really blog the progress of the cube as it went along – i was far too busy fitting work, cube, moving house, and general BM prep all into 24 hours a day. The first time I heard of the cube idea was probably from Barry just before the Whistler trip in 2009, I don’t know exactly where or when, it was at that point nothing then a fancy idea, amongst many others, to build a giant Rubik’s cube on the playa. I didn’t think much of it back then, as it was just another crazy idea amongst many which has been tossed around for some time. I had my own ideas concerning injecting a Meme into the Burn this year, and letting it evolve like a giant game of Chinese whispers, but i never quite figured out how to make that go in a practical sense even though i found the concept intriguing. The idea for the cube was born during the new-years Whistler trip, which I missed due to being in German with Alissa and my parents, and was first suggested by Chris White, who ended up writing most of the software for the project. Anyway, the topic came up again during the Febuary/March whistler trip, Barry, Chris, Mars and others had been starting to pour in more thought into it, imagining a large, scaffolding based structure, covered in fabric, 48ft high, lit up by lamps and gels. Emphasis was on “simple”. off-the-shelf parts only. My own thoughts started to engage in this – i realized this could become a very engaging project, maybe a unique opportunity to get involved in a very very large art installation with group more then capable of pulling it off. In particular i recall standing in the kitchen with Barry during one of the many parties up in the Whistler cabin talking about possible ways to control the cube. We were imagining a controller standing in the center of the cube, thus being able to see all the sides of the cube. The problem with this was that it was too isolated an experience, only a single or very few people could stand in the cube, and the outside observers wouldn’t even realize that it was a human being controling the cube ! My thoughts started to ponder ways to make the experience wider, allow more players into the game and make it obvious how and who is controlling the cube. As always with ideas i just blurted out stuff as it occured to me – i said “what if we split the controllers into three parts”. Barry’s eyes lit up like – he said something like “oohhh that is EVIL – have one controller per axis!”. I think neither of us had any doubt at that point that we simply had to make this happen. The idea with the distributed controllers had, to me, elevated the project from a simple light sculpture, or even interactive light sculpture, into a enhanced version of a famous puzzle, one that required coorperation between multiple players and was much much harder then the original. I was sold. Feasible or not ? The last few days in Whistler my brain started to stir – i was starting to consider the ideas that had been thrown around and we started looking on the internet for parts, costs, figures and numbers. We set our budget was 10K- it seemed that despite the very short amount of time we had available we may be able to raise enough. Nobody questioned that we couldn’t do it for less. The first few considerations involved establishing if we were at least int the right order of magnitude for this project to fly. Our initial, first design involved a tower, with a 24ft x 24ft base, 48 ft high, built out of standard scaffolding. It would be subdivided into cubies (the lingo didn’t exist at the time but cubie would later signify a single sub cube, with up to 3 facets on it ), each cubie would be 8ft x8ft8ft in size. The tower would have 6 8ft levels and be 3×3 cubies at the base. I started making some initial drawings: The problem was that with the cube having one of it’s faces parallel to the ground, the opposite face would be impossible to see. We imagined having a plattform on top for this purpose, however it couldn’t be too large either or it itself would occlude that top face. Or maybe a seperate tower nearby ? That would be a major extra undertaking, to build another 45 ft structure ? At the time we were imagining the controller for the vertical axis to be sitting below the cube, with the other two controllers out, some distance at 90 degrees from each other. With the cube itself raised 16ft off the ground, they couldn’t be too far away or they would barely be able to see the bottom. None of us had ever built anything even remotely of this size so we wanted to keep everything simple. Simple scaffolding, simple lighting, simple controllers and electronics. At that point we had only 7 months until the man would burn, so were really didn’t have time to make any custom manufactured stuff. We started researching costs. Fabric and scaffolding were the first big unknowns. We established that fabric would be a limiting factor – with a cube 24ft on a side, we had an area of 3500 sq ft to cover. We found some information on a related project called the Tetrion (Large towers of scaffolding in the shape of tetris pieces, covered in fabric lit from the inside, which featured at the 2008 burn) which was very much along the same lines of what we were trying to do. We had worked out that they had used “Rosebrand stretch tendo”, a special, two stretch spandex material. Clearly their project had worked clearly this stuff was suitable for the playa. But we were looking at 2500$ minimum, just for the fabric. Looking at scaffolding, lighting and one idea included stretching the fabric, thus reducing the amount we needed considerably (by 40% or so!) but we didn’t know how much it would stretch. Scaffolding too started to explode in terms of cost but also in terms of manageability. 8ft spans are awkward to work with, since most people can only reach about 7ft with their hands. We could make the cube smaller, but then it would loose much of its impact factor. Barry insisted it should not be smaller then 15ft on a side. Reducing it to that size would slash material costs quite substantially, and maybe with the cube smaller we could add a new twist: putting the cube on its corner. The Cube in the Sky When we returned from Whistler in early March 2009 i began drawing various technical drawings of possible cube designs including the original design ideas with 8ft facets as well as several down sized versions with 6ft and 5ft basic lengths (cubie widths). The first set of cube models we considered I also started toying with the idea of putting the cube on its corner. We had all agreed that that would be super cool but dismissed it as too difficult (remember we wanted to keep it all simple and off-the-shelf). I had looked at scaffolding types, one of which (Tube & Clamp Scaffolding) allows you to build practically arbitrary shapes. So I started thinking about the possibility of building a hexagonal base (The projection of a cube on its axis is a hexagon) to hold up the cube with its diagonal axis vertical. One design had the corner on the ground while the other had the lower corner about 8 ft off the ground. Cube on it’s corner Visual Cube on it’s corner with an extra level This design had many desirable qualities, most importantly it would allow all sides to be visible from the ground. Further, it creates an obvious 3 fold on the ground, such that all the three axes of the cube have equivalent projections onto the ground meaning that the controllers could all be identical and just needed to be placed in positions 120 degrees apart. Aesthetically this was the right choice, and since we had, by this point, decided that we had to downsize the cube to 15ft from 24ft (halving costs of scaffolding and fabric if i recall correctly), we felt that we needed to add more spice instead. Putting the cube on it’s corner seemed like an appropriately mad challenge for this purpose. While the electronics were being worked out I was iterating through various designs all of which had their advantages and disadvantages. The scaffold support structure under neigh the cube was annoying because of the additional scaffolding work, the optical occlusions and general messyness and because it was not clear how to ensure that the cube would be perfectly cubical and not warped. Another possibility that was suggested by a friend of ours who’s name i forget (Matt?) which was to build the cube out of EMT tubing with custom welded connectors. He then suggested putting the cube on an 8 ft post. Aesthetically this was very appealing, since nothing would occlude the cube. Cube on a post ? I started running calculations on cost and feasibility. EMT is expensive, the tubing alone came to around 1000$, the connectors added another $600. Plus the daunting task of welding 64 custom connectors as well as a custom christmas tree like structure to run through the diagonal. All that with none of us having much experience with welding. I actually went to Home Depot to get some 1.5″ (or was it 2″ ?) EMT and tried finding metal tubing with the right outer diameter to slide in snuggly into the EMT. Fail. This turned out to be rather difficult. Plus the structure was getting rather expensive. Not getting a good lead on how to do this i returned to the scaffolding support and started making more detailed plans.Many features seemed unappealing as detailed above, but it seemed the only viable option at the time: Scaffolding was cheap to rent. Planning in more detail where the scaffold tube would go and where people constructing it would stand. Until one afternoon I get a memo from Barry saying, come to Kevin’s House, he’s got a crazy idea for how to get the cube in the air. Kevin’s ingenious brain added an idea none of us had considered before, which was to hang the cube. His idea was to just lift the cube using a crane or fork lift. And leave the crane in place. Basically just have it hanging there. The big unknown was the cost of rental for such an opperation. While clever, the thought of having a crane there permanently was repulsive to me from an aesthetic standpoint since it would look like a failed or unfinished, rescued-at-last-minute art project (To my delight the crane turned out to be prohibitively expensive, unless we could get it from BM Org , which remained unclear till the end). But the idea of hanging the cube was absolutely brilliant! I was sold. No visual obstructions, the cube could be built on the ground with easy access and then lifted into place ! So clean. So neat. We could build the cube out of lighter materials too! But what to lift it from ? Over the BBQ we talked about a number of possibilities. Theater truss ? That stuff can be rented, maybe we could build an inverted U to hang the cube from ? A bit of research quickly showed that a center hang of several thousand pounds required top end heavy-duty truss, esp when we’re talking about a 40ft span. Basically hanging the cube straight down was no an option, although aesthetically is was very pleasing. Hanging it from cables running from the tops of the vertical parts of the U would be an option but then the towers would need to be quite a bit taller so avoid very shallow hanging angles. All of this was not clicking into place and the costs for renting truss were out of bounds already. This design was appealing but quickly turned out to be not to be practical Another idea was to reuse truss the we already had access to as a community. Eric Schurman had built a 70 ft tower out of radio towertruss in 2000, so he owned 7 10ft tower segments. I looked up the specs for the truss and did a number of buckling calculations and it seemed the towers were sufficiently strong in compression to hold up the cube.I spent several evenings working on a design, initially involving 3 50fttowers. Each tower would be guyed down to the playa by 3 steel cables. A4th cable would run to the center of the triangle, where the cube would be suspended from it’s top vertex. As before the problem was that to geta hanging angle of >60 degrees (thus avoiding ridiculous tensions in the cables as the force increases with the tangent of the angle and quickly runs of towards infinity as you approach 90 degrees) the towers had tobe quite a bit taller then the top of cube, which we wanted to be at37ft, leaving the bottom vertex 10ft off the ground. This however meant erecting 3 50ft towers (a daunting task in it self) and then raising a2500 lbs object in between them. Also it meant buying 8 more tower segments, at 140$ each. A minimum of 9 guylines were needed. All in all the costs were soaring up into the 2000-3000$ range, like, it seemed,every attempt i tried to lift this cube up in the air. Nothing was truly jumping out at me, and by this point we had considered at least 6 or 7 designs. Three Tower Design - Note the three-fold symmetry and the UI stations, one for each axis. We liked this design a lot because it created an illusion of a 3D volume in which the cube was hovering as if by magic. At some point I was explaining my design ideas and worries design to Kevin. I was trying to explain how the guylines would run and i evidently didn’t do a good job. Kevin made some sort of suggestion that indicated to me he though the guy lines attached at the bottom of the cube, which was not what i had intended in my design. However this total mis-communication made me think: what if we attached the guylines say to the center of the cube ? That would make the towers smaller, because the point of attachment would have moved down by 13.5ft, so the towers could be 37ft tall.. well 40ft at least since the truss elements are 10ft long. So what if we moved them down even further ? The lower 3 corners of the cube make excellent attachment points (better then the center of the cube in many ways since the cables wouldn’t have to run through the cube). That takes the attachment down another 7 ft, so 30 ft tower would be sufficient! Tensegrity Cube Design This design looked weird in many ways. The cube was suspended from below it center of mass, so I added three more guys from the upper 3 corners that run down directly to the playa. Essentially what this ended up as was a nice tensegrity style structure with the cube hanging in between three 30 ft towers held up by nothing but cables. Only two more 10ft tower segments would be required lowering the costs. Raising a 30ft tower is also much easier and can be done with simple manpower and without having a truck and a leverage arm. The guylines became considerably shorter. All in all i liked this design a lot. It appeared weird and impossible, and it had an inherent beauty. The three towers added a distinct t"
