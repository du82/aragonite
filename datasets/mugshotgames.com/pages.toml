["https://www.mugshotgames.com/about/press"]
title = "Press | Mugshot Games"
description = "Press Description Mugshot Games is the independent studio of two Australian brothers, Steve and Mike Yap. On August 27, 2021, they launched their latest title, Sliding Seas, on iOS and Android. Sliding Seas Sliding Seas is a match-and-merge puzzle game where players rescue shipwrecked survivors to live on a tropical island, which they can grow …"
full_description = "Mugshot Games is the independent studio of two Australian brothers, Steve and Mike Yap. On August 27, 2021, they launched their latest title, Sliding Seas, on iOS and Android. Sliding Seas is a match-and-merge puzzle game where players rescue shipwrecked survivors to live on a tropical island, which they can grow into a thriving city. It features a new land-merging mechanic that adds a new dimension to Match 3, height! Sliding Seas is the first puzzle title for Mugshot Games, following their award-winning tower defense games, Digfender (2015) and CastleMine (2012). “Takes the match-and-merge gameplay of classics like Triple Town and Threes! and blends it together with city-building mechanics. The result is something extraordinary.” – Jared Nelson, TouchArcade.com “Sliding Seas is an adorable match-3 puzzle where you save shipwrecked survivors and build a town.” – Catherine Ng Dellosa, PocketGamer.com “Digfender is easily one of the best tower defense games I’ve played in a long time.” – Nathan Reinauer, TouchArcade.com “Digfender is an entertaining tower defense game that sets itself apart from many of the other titles in this genre.” – George Ponder, WindowsCentral.com “Protecting a castle has never been more fun, and if you’re expecting to put this puppy down after a few minutes, think again.” – Greg Srisavasdi, ArcadeSushi.com “There’s no shortage of strategy in this delightfully unique tower defense game!” – John Bardinelli, JayIsGames.com “[CastleMine]’s deep upgrade system, tons of missions and digging mechanic offer a lot worth checking out.” – Eric Ford, TouchArcade.com “I don’t recall ever coming across [a tower defense game] that’s quite as strategic as CastleMine.” – Rob Rich, 148apps.com Apple Game of the Day – Sliding Seas, 2021 Apple Top 10 Match 3 Games – Sliding Seas, 2021 Touch Arcade Best Mobile Games of 2021 – Sliding Seas, 2021 Google Play Indie Pick – Digfender, 2016 TechRadar 50 Best iPhone Games – Digfender, 2015 Windows Phone Next App Star Finalist – CastleMine Free, 2013 Windows Phone Download Count Challenge Winner – CastleMine Beta, 2012"
year_published = 2025
