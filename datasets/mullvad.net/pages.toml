description = "Check your privacy and security with Mullvad's tool. Verify your VPN, check for DNS and WebRTC leaks, and ensure your connection is secure."
full_description = "Connection check Loading... FAQAPI What are DNS leaks? A DNS server is the first point of contact that your browser makes when you try to access information over the Internet. This is the case for every URL you visit, every file you download, and every image that loads on a website, including ads. The DNS server therefore knows which pages you are visiting and which resources you are looking at, and as a result, you are constantly leaking information to your DNS server provider about your activity. Our DNS leaks guide has information on how to prevent this. What is WebRTC? WebRTC is a technology that allows users to communicate with video and audio directly in the browser without any plugins installed. An unfortunate side effect is that your real IP could be exposed, stripping you of your anonymity. Our WebRTC guide has more information. This product includes GeoLite2 data created by MaxMind, available from https://www.maxmind.com."
