title = "The chat control proposal does not belong in democratic societies"
description = "The European Commission is working on a legislative proposal called chat control. If the law goes into effect, all EU citizens will have their communications monitored and audited. Now is the time to stop it."
full_description = "Why it’s important to stop chat control How is the mass surveillance supposed to work? Get to know the proposal and its fatal consequences. Let us also present a different solution (to the alleged purpose). We urge the politicians of the EU to vote no In October the parliament will vote in plenary. All EU countries will also have their saying in the council of the European Union. We urge them all to take a democratic decision. A law with wide-ranging consequence Chat control will not only involve total interception of your private communication. As the proposal is written, it may also affect open-source operating systems. Now is the time for debate and actions A democratic society is built upon discussions, before law proposals become reality. We started the conversation on the streets of Sweden, during the country’s EU presidency."
