["https://mullvad.net/en/help/verifying-signatures"]
title = "Verifying signatures"
description = "How to verify the Mullvad VPN app releases."
full_description = '''Verifying signatures Mullvad app Windows Linux Installation macOS Desktop PGP Last updated: April 25, 2024 To verify the Mullvad Browser instead, go to the guide Verifying Mullvad Browser signature. This guide explains how you can verify that you have downloaded the authentic Mullvad VPN app installer. What this guide covers Install GnuPG Download the signing key Sign the key Verify the Mullvad VPN app Code signing key Install GnuPG First you have to install gpg (GnuPG) version 2.1 or newer. Avoid the legacy 1.4 version of gpg. It will allow you to use the gpg command in the Terminal. Linux Many Linux distributions come with gpg already installed. If yours doesn't then you can install it with the default package manager using the package name gnupg2. macOS You can install Homebrew and then install gpg by running brew install gnupg. It will allow you to use the gpg command in the Terminal. Another option is to install GPG Suite. Windows Download and install Gpg4win. It will allow you to use the gpg command in the Command Prompt and it also comes with a GUI called Kleopatra. This guide uses the Command Prompt. Download and import the signing key The fingerprint of our code signing key is A1198702FC3E0A09A9AE5B75D5A1D4F266DE8DDF (with spaces: A119 8702 FC3E 0A09 A9AE 5B75 D5A1 D4F2 66DE 8DDF) and it can be downloaded from our website or by using wget in a Linux Terminal: wget https://mullvad.net/media/mullvad-code-signing.asc Then import the key using the following command in the Terminal (Linux, macOS) or Command Prompt (Windows): gpg --import mullvad-code-signing.asc You can verify that the key is installed and show its fingerprint using this command: gpg --fingerprint admin@mullvad.net Sign the key Once you have imported the signing key you can sign it with your own key. This step can be skipped, but then a warning will be printed during each file verification saying that the key is not certified with a trusted signature. If you do not have a pgp key yet then you first have to create one using this command: gpg --gen-key Enter your "Real name" (use a fake name if you want to be anonymous) and an "Email address" and enter "O". Then enter a password and click on OK. To sign our signing key use the following command: gpg --sign-key admin@mullvad.net You will see a long message and in the end it shows the following: pub rsa4096/D5A1D4F266DE8DDF created: 2016-10-27 expires: never usage: SC trust: unknown validity: unknown Primary key fingerprint: A119 8702 FC3E 0A09 A9AE 5B75 D5A1 D4F2 66DE 8DDF Mullvad (code signing) <admin@mullvad.net> Are you sure that you want to sign this key with your key "xxx <xxx@xxx.xx>" (xxx) Enter "y" to sign it and then enter your pgp key password. Verify the Mullvad VPN app To verify the Mullvad VPN installer you need the signature file for the same version of the Mullvad VPN app that you downloaded. The signature file is a file with the exact same filename as the app, but with .asc appended at the end. To download the signature file for the Mullvad VPN app, click on the GPG signature button on the Downloads page for your platform. Make sure to place the signature file and the Mullvad VPN app installer in the same folder. In this example, we will download the latest Mullvad VPN app for Debian and its signature in the Terminal. wget --trust-server-names https://mullvad.net/download/app/deb/latest wget --trust-server-names https://mullvad.net/download/app/deb/latest/signature Navigate into the folder where the files are with the cd command (if you downloaded the files from our website) and then run the following command: gpg --verify MullvadVPN-*.deb.asc If you have multiple .asc files in the same folder then use the full filename or the verification may fail. For example: gpg --verify MullvadVPN-2023.6_amd64.deb.asc You should get the following output (the example below is using the Linux file). gpg: assuming signed data in 'MullvadVPN-2023.6_amd64.deb' gpg: Signature made Wed Dec 6 14:47:50 2023 CET gpg: using RSA key CA83A46153BC58D69518ED49A26581F219C8314C gpg: Good signature from "Mullvad (code signing) <admin@mullvad.net>" [full] If it says "checking the trustdb" then run the command again to show the output without that. Code signing key Here is the code signing key in plain text: -----BEGIN PGP PUBLIC KEY BLOCK----- Version: GnuPG v2 mQINBFgRmCoBEAChee2rs/braqjqim1D+uvTBpPZzkpccJVb2SqhErQKs54iJVyo H5pNrGR4VIzFRUnY7fbATo2Ej+0MlglXahl4ok93XmeDz04P5rH2NKnLvWYdaK1C 9Lvpq22t1nytJuhc124UBahVVEYjc7l2+JGdTh7WvLj8FXqfnnmI1upVU48S70RL oM3tSDZqQaO3OGCc0znMNBGI/uKNNwc6Omm6KPvczOhci7bnKt0b0R6TrXufvgOG y1DM9sntIbXtpIjOuZdTWyrGTm/AvT6zddPFjN8SN6ZIfoRmJT6ROB6ZTtiz/d20 VJ87QPEfVRKrMImZxtkJtSliojZB/I3/bkP7A4pvgJ6cJ+ErwW4cfqc3DrWaZY+D 4AZnk71FA6C5rQdkFbfkgyUMY1WeKX+8N/R+e5oLGmoVI/fdHu1z0JkJJvEraAO9 +qX2mOcW5h/NRxv0Xw57fjMhnMha7bWs8Jn5AchDPJZs1U64Wr36FuSvcdxc0ON/ WaX4RL/J5OtJHu+2FB+UB1/JuICdOP07/KFxUJod43KwwBctLUHOOz3m1KIVcnXR l6+gNQ7vxGm+xghN/zG7lgPLuw5ToCCkMLkQydsRPRSlm0f2zqbQUD3jn+4zZ2ma HBHcu6Ld8SSGPp5XIauAKhqZA9IkD5VPgqlrm0iJ4emzPYGp7PMFFdH3qQARAQAB tCpNdWxsdmFkIChjb2RlIHNpZ25pbmcpIDxhZG1pbkBtdWxsdmFkLm5ldD6JAjUE EwEIAB8CGwMCHgECF4AFAlgR6R8ECwkIBwUVCgkICwQWAgMBAAoJENWh1PJm3o3f muQQAJElHN6lLhpOgrbRprJAR15HfRI0Leoomfu5V53Qieqf+6O3TF4PC9JRn+v8 NYOMsBmBgosvO8YcABA3wYTW6qyRGr+8zQePltEe/J9SE3oCbb4K5KWEThiicZ6R o0sJgXB3l0CIHVP+/3bWeZlBpTJNMLOEM+WsEsTe6v7hZfF7HIubVdKSIbQy7T3X nsk8840rt5LjJiNtSpsG+EJOIGEdXH5FAis35pTLrbkgnL3Evyjd2OW1grciqF+v 7aba2g/2zpEGEdtbJKO5C4nG9CHcN5BlaSev0oQlKWuRSG3igwauZFe/0RQPkH/V kCOHA3l8NTlublQCdLLLrJJyX7aODH+AKLaVci17ogtGwwO+xNh0h4ejM0QuMLYV giMCpxRT5uUuOHbh3by1rwTSb+8dvIw3KyW1TbZ6LFCQHX+8Zs7xU7KQ6tGZ6Pvr Fhk/YiM8J+Fe+rBGwEcUfo/ALv4p7qHpRVA7CvdrzKg66iaN+iPQzsptamoSLsCj SYbjIby74X0vppRAg7sDXiAxJSRPXM3h1xO83yk1HMrswwWAUuJeToYRXOHYl5zN i3E0D6I5Zk1ioO9XPE7oILwJ7YaO4XuC3UuNMwWPSvOoJxbnsUdHpenITvbpe9DP z4HGzZWbUtShFDq77MDhv9vkNaFUOgP7AfO5N/35pVCkI4m1uQINBFgRmCoBEADT 5YK+TLcGSzC4ML7t8VW+rVpYyY3pswX8dL058LYfCIrlaNa14/UvINvjA5529SWr jmmDluD8