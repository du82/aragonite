["https://mullvad.net/en/chatcontrol/campaign"]
title = "Now is the time for debate and actions"
description = "A democratic society is built upon discussions, before law proposals become reality. We started the conversation on the streets of Sweden, during the country’s EU presidency."
full_description = "Now is the time for debate and actions A democratic society is built upon discussions, before law proposals become reality. We started the conversation on the streets of Sweden, during the country’s EU presidency. Create safe spaces online for children instead of making the internet unsafe for everyone. The governments of today say they will monitor serious crimes. What will the governments of tomorrow say? Five ad boards in the subway 2008 The Swedish Act on Signal Surveillance for Defense Intelligence Activities is introduced. It is said that the surveillance will only apply to external threats against the country. The Director-General of the National Defense Radio Establishment (FRA) writes a debate article saying, “There is a perception that FRA will listen to all Swedes’ phone calls, read their e-mails and text messages. A disgusting thought. How can so many believe that a democratically elected parliament would want to hurt its people so badly?” 2021 13 years later, the Court of Justice of the European Union judges Sweden, saying the FRA Act violates personal integrity. The Swedish government is called upon to immediately address the legal security gaps. Instead, the government goes in the opposite direction and approves an extension of the FRA Act. 2023 The European Commission is working on a legislative proposal called chat control. If the law goes into effect, all EU citizens will have their communications monitored and audited. It is claimed that the purpose of this law is to detect serious crimes. The problem is that once such a massive system is in place, those in power can choose to change what to listen to at any time. Think of an authoritarian country within the EU. Now imagine such a system in place. 2084? What will future governments and parliaments monitor once they have the infrastructure in place? Political opponents? Protest movements? Journalists? People seeking abortions in countries where it is prohibited by law? At this rate, we probably won’t have to wait until 2084 before the society starts looking like Orwell’s 1984 dystopia. Stop chat control What happens to a society when people feel monitored? When humans don’t have the right to private conversations, that’s when societies fall apart and democracies descend into totalitarian states. We urge Sweden’s parliament and government to say no to the legislative proposal. Arlanda Airport Arlanda Airport Create safe spaces online for children instead of making the internet unsafe for everyone. The governments of today say they will monitor serious crimes. What will the governments of tomorrow say? Free the internet. Stop chat control. The chat control proposal does not belong in democratic societies. Secrecy of correspondence is a human right which should apply on the internet as well. Don't let 2024 be the beginning of 1984. Most people pass this billboard without noticing it. The same goes for law proposals on mass surveillance. 9781529035698112* *We placed this ad here for you to start practicing private communication in a public setting. This could be good to know if the European Commission's chat control law becomes reality. ”Even if the fundamental rights to respect for privacy, to protection of personal data and to freedom of expression and information is of great importance, none of these rights is absolute.” The chat control proposal, page 12. What kind of legacy do you want the EU presidency to leave behind? A more or less democratic Europe? We don’t care about the Swedish politicians and what they write to their partners on the way home from the Parliament on Friday evenings. No one should. Protect anonymous sources and whistleblowers. Stop chat control. Protect whistleblowers, protest movements in authoritarian countries, and people with protected identities. Protect those who need to ask for help anonymously. Protect the children. Stop chat control. In November 2022, it came to light that the governments of five EU countries were spying on dissidents and opposition parties. In 2023, the European Commission wants to create a surveillance system that will listen to all citizens' communications."
year_published = 2025
