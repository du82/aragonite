full_description = "Downloads Mullvad VPN Mullvad Browser Windows macOS Linux Firefox Extension Mullvad Browser for Windows Free for anyone Latest version: 14.0.5 (see changes) Works on Windows 10 or later (64 bit only) Download GPG signature What is this? Download from GitHub GPG signature What is this? The Mullvad Browser is developed – in collaboration between Mullvad VPN and the Tor Project – to minimize tracking and fingerprinting. You can read the full story and get the bigger picture here. But if you are looking for a quick summary, this is the place. Privacy quality of the Tor Browser. To use with a VPN. Using a VPN is not enough to achieve perfect privacy online. There’s simply too much data being extracted through most browsers. The Mullvad Browser is a web browser with the privacy quality of the Tor Browser, to be used with a trustworthy VPN. Strong anti-fingerprinting from the Tor Project The Tor Project has a proven track record of building a privacy-focused browser. The Mullvad Browser has the same fingerprinting protection as the Tor Browser – it just connects to the internet with (or without) a VPN instead of the Tor Network. Similar fingerprint for all users Fingerprinting is an increasing threat against online privacy. The Mullvad Browser is, just like the Tor Browser, developed with the purpose and ambition for all its users to appear as one. No telemetry Telemetry is unique data being collected by the browser to improve its performance. We don’t believe in collecting data about our users. So, with the Mullvad Browser we have removed all telemetry. Private browsing by default The Mullvad Browser has private mode enabled by default. This means no cookies, cache and history are saved between your sessions. The browser also includes a reset button that creates a clean session in one click. Blocking third-party trackers with uBlock Origin Even with strong protection against fingerprinting and cookies, it’s a good idea to block third-party trackers. You don’t want to use ‘too many’ extensions as it could be the one thing that identifies you. That’s why we only use uBlock Origin. Transparent business model We have no intention in earning money from the Mullvad Browser. Our business model is to earn money from our VPN service. Our only ambition with the Mullvad Browser is to provide the best privacy-focused browser possible to Mullvad’s VPN users – and to everyone else, for that matter. Privacy first Mullvad VPN has a proven record of putting privacy first. With no strange business models or short-term venture capitalist owners. The Tor Project is a non-profit organization fighting for human rights. We will always put privacy first, in everything we do."
