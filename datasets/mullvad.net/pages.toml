title = "Mullvad VPN | Privacy is a universal right"
description = "Free the internet from mass surveillance and censorship. Fight for privacy with Mullvad VPN and Mullvad Browser."
full_description = '''Using the Mullvad VPN app Mullvad app Windows Linux macOS Desktop Using How to use the Mullvad VPN app. First steps towards online privacy Privacy Take action with these easy steps to reclaim your online privacy. Mullvad help center Results will update as you type Search Filter Topic Device Feature OS Protocol FAQ I have lost my account number. How do I get it back? # Follow the steps to recover your account.Why can’t I use the internet after closing the Mullvad app on Windows? # Go into the "Network & Internet settings" > "Change adapter settings" and then right-click the network adapter you use to connect to the internet and select "Properties" then double-click on "Internet Protocol version 4" and set it to "Obtain DNS server address automatically" Please make sure that you are running 2020.2 or later of our Mullvad VPN app.Why do I get slow speeds? # Our Connection Speed guide lists a variety of possible solutions. You can also read about throttling.While using the Mullvad VPN app, I can't access local shares, printers or services. What do I do? # Open the Mullvad app settings, then click on Preferences and turn on "Local network sharing". In some cases you have to use the IP address to connect instead of the hostname. If the device is on a different subnet (IP address range) then add a static route to that in the operating system. In Android this will not work if you have enabled "Block connections without VPN" in the Android network settings.What can I do to reduce disconnections ? # Try connecting over TCP and port 443. This often helps. All FAQs Guides Using the Mullvad VPN app Mullvad app Windows Linux macOS Desktop Using How to use the Mullvad VPN app.Refunds Account and payments The steps needed to get a refund.First steps towards online privacy Privacy Take action with these easy steps to reclaim your online privacy. All guides Couldn't find what you were looking for? Send us an email at support@mullvadvpn.net'''
