full_description = "Recover lost account Can’t remember your account number? It might be possible to recover, although we can’t guarantee it since we keep as little information as possible about our users. Look in the app First, look in the Mullvad VPN app. Click on the account icon () to find your account number. Trace your payment If that’s not an option, then trace your payment method. Select the payment method you used and follow the instructions. Please note that payments are only traceable for 40 days. Credit cardPayPalSwishVoucherCashBank wire If you paid using a credit card you can find the payment token in your bank statement. It should have the format VPN*xxxxxxxxxx but might look different depending on your bank. VPN* is not part of the payment token. Find account If you cannot find the payment token, send an email to support@mullvadvpn.net with the following information: The last four digits and expiry date of your credit or debit card The date, time (including time zone) at which you made the payment The amount that was paid If you email us to help resolve a lost account number, you will end up disclosing information about yourself to us (at a bare minimum, your email). If you prefer to remain anonymous, you can instead create a new account."
