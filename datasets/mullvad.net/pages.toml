full_description = "Review of 2022 December 30, 2022 News We are counting downs the days until 2023 and are excited about the things that will happen next year. Read more Shutting down our unencrypted public DNS service December 13, 2022 News On the 16th January 2023 we will shut down our legacy public DNS service, currently reachable from this IP: 193.138.218.74 Read more Ending support for cryptocurrency refunds December 1, 2022 Privacy In order to keep less data on our users we will remove support for refunds and account recovery with all cryptocurrency payments, starting next year. Read more Post-quantum safe VPN tunnels available on all WireGuard servers November 8, 2022 Features The experimental quantum-resistant tunnel support we posted about in July is now available on all our WireGuard servers! We also upgraded the protocol to allow even more secure key exchanges in the future. Read more Update: OpenSSL critical security issue may cause interruptions November 1, 2022 News Update: Having reviewed the release notes for OpenSSL 3.0.7 we have determined it does not impact our infrastructure. We will continue to patch our servers routinely when it becomes available... Read more v2ray obfuscation supported on our Bridges October 25, 2022 Privacy Today we announce that we have added another obfuscation method, v2ray to some of our stbooted bridge servers. Read more Security audit report for our app available October 21, 2022 External auditsAppSecurity A security assessment of the Mullvad VPN apps has concluded that the app is well-architected from a security perspective. Some issues were found, and they have been fixed to the extent possible. Read more Android leaks connectivity check traffic October 10, 2022 PrivacyApp An ongoing security audit of our app identified that Android leaks certain traffic, which VPN services cannot prevent. The audit report will go public soon. This post aims to dive into the finding, called MUL22-03. Read more Mullvad creates a hardware company September 19, 2022 NewsSystem TransparencyMullvad community Mullvad has been working for years to make it possible for hardware - such as VPN servers to prove their trustworthiness to end-users. Read more"
