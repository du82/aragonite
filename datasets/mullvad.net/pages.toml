full_description = "Fight for privacy. To protect all other rights. February 21, 2025 NewsPrivacy Freedom of speech is not an isolated right. We hit the streets to highlight the rights we must fight for, not only to protect freedom of speech, but also our right to be free humans. Read more Mullvad has partnered with Obscura VPN February 11, 2025 News Today we are announcing a partnership with Obscura VPN, a newly launched two-party VPN service that uses our WireGuard VPN servers as its “exit hop”. Read more Mullvad VPN for Windows on ARM is here! February 7, 2025 NewsApp The Mullvad VPN app is now available for users running Windows on ARM! Read more For privacy: Change of our refund policy from 30 to 14 days January 31, 2025 Privacy As part of our ongoing commitment to storing less user data and protect your privacy, we’re updating our refund policy. Read more Split tunneling on macOS January 10, 2025 App Split tunneling was introduced earlier last year to the macOS app. The 2025.2 release irons out some issues that remained, and the feature is now considered stable on all desktop platforms. Read more Quantum-resistant tunnels are now the default on desktop January 9, 2025 NewsApp The 2025.2 desktop release enables quantum-resistant WireGuard tunnels by default on Windows. This means that it’s now enabled by default on all desktop platforms. Read more"
