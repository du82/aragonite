full_description = '''Our year of expansion – looking back on 2016 December 19, 2016 News We have had an amazing year at Mullvad. In 2016, we focused primarily on expanding our service across the globe. Here's a rundown of the improvements we've made: Read more How to Tamper Protect a Laptop – With Nail Polish December 14, 2016 Privacy tips We just acquired a new laptop! And given our work with security, we do everything we can to protect our hardware. Even if it means using glittery nail polish. In this post, we'll show you one of our methods for tamper protecting our workstations. Read more Four New Countries with Mullvad Servers December 9, 2016 News Austria, Bulgaria, Czech Republic and Italy are the latest countries home to Mullvad VPN servers. Our VPN server guide lists all available countries, including each location's server address. Read more Use Mullvad on your iOS device December 8, 2016 News Mullvad is compatible with your preferred iOS device including iPhone and iPad. Our latest step-by-step guide shows you how to install and connect to Mullvad VPN on iOS. Read more Privacy is a universal right December 5, 2016 Privacy Mullvad was founded in 2009 purely with the ambition of protecting privacy. This blog post explains the fundamentals of privacy and why this important subject is often overlooked. Read more Problems connecting with your phone? December 3, 2016 News Enable the setting “Force AES-CBC ciphersuite”. See our guide on troubleshooting under the topic "I can't connect using my iOS device or my Android phone to some or all servers." Read more Increased security with SOCKS5 proxy November 29, 2016 News With the SOCKS5 proxy now installed on all of Mullvad's VPN servers, you can further minimize your computer's identity from being revealed. This simple yet powerful feature also reduces CAPTCHAs. Read more New servers in Belgium, Lithuania, Romania, Spain and Switzerland November 21, 2016 News Five New Countries with Mullvad Servers Read more New server in Denmark November 3, 2016 News Denmark has been added to our list of countries home to Mullvad servers. If you don't see the country listed as an option, quit and restart Mullvad. Read more'''
