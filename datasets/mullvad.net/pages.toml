full_description = "A decade of Mullvad - another to come December 17, 2019 News Wow, what a year it’s been! The one that closed out our first decade and began a new one. Here’s what we remember most fondly from 2019: Read more WireGuard for Windows in new app release (2019.10) December 12, 2019 News The latest version of the Mullvad VPN app finally brings WireGuard to Windows users. Read more A closer look at VPN vulnerability CVE-2019-14899 December 6, 2019 News A recent vulnerability affecting Linux and *nix systems can compromise VPN tunnel security. If you are using the Mullvad app with default settings, you are not affected. No action is necessary. Read more Mullvad partnerships page has been updated - Mozilla December 3, 2019 Mullvad community Mozilla has partnered with Mullvad in order to utilize our global network of VPN servers for its own VPN application. Read more Test the latest Android beta (2019.10-beta1) November 6, 2019 News We’ve addressed a number of bugs in the newest beta version of the Mullvad VPN app for Android. Read more Faster rotation of WG keys and static IP addresses November 3, 2019 News Update: It now takes a few seconds to propagate new WireGuard® keys and internal static IP-addresses to all servers. Read more Big data. Big no! October 30, 2019 Privacy Not so very long ago, privacy was still regarded as the right of the individual to be physically alone without being observed. Read more Server list updated with provider and ownership October 25, 2019 Privacy Our server list has been updated to contain the following two major additions: Read more Mullvad October 2019 donation to WireGuard October 25, 2019 Mullvad community If you've been following our blog recently, then you're well aware that we see potential in the WireGuard VPN protocol. We've therefore decided to support the project's development yet again with a donation. Read more Our policy on disclosing security incidents October 24, 2019 News When does a security incident of a