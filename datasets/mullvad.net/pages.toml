full_description = "Bring on 2021 - we’re ready! December 14, 2020 News But first, our annual retrospective! In 2020, we launched our app on iOS (now on every major platform), made our first video, advertised on trams, and investigated a couple of laws. Read more Bring Mullvad VPN to your TV with new Android release (2020.8-beta1) December 7, 2020 News Bring Mullvad VPN to your TV with new Android release (2020.8-beta1) Read more 7 DEC (Monday) There will be a service window in Gothenburg December 5, 2020 News 7 DEC (Monday) There will be a service window in Gothenburg to upgrade the Switches, this means all servers in Gothenburg will be unavailable between 08:00 and 14:00 CET. Read more Linux issues resolved in latest desktop release (2020.7) November 19, 2020 News The newest version of the Mullvad VPN app for desktop fixes a number of bugs experienced by Linux users. Read more Big no on Big Sur: Mullvad disallows Apple apps to bypass firewall November 16, 2020 News Despite Apple’s changes to macOS with the release of Big Sur, we can confirm that the Mullvad app still performs as intended by not allowing Apple’s own apps to bypass our VPN firewall. Read more Your privacy is your privacy - updated policy November 11, 2020 Privacy Our long-term goal is to not store any PII (Personally Identifiable Information). For this purpose we recently made two changes in our Privacy Policy and our No-logging of user activity Policy. Read more Split tunneling launched on Linux (2020.6) October 20, 2020 News In the newest version of the Mullvad VPN desktop app (2020.6), Linux users can now route programs outside of the VPN tunnel with our split tunneling feature. Read more EU Court - the last bastion for privacy? October 7, 2020 Privacy The Court of Justice of the European Union has announced that Sweden’s existing and proposed law, the Electronic Communications Act, is too general and lacks safeguards for implementation. Read more Linux under WSL2 can be leaking September 30, 2020 News We have found that you could be leaking your Internet traffic when running Linux under WSL2 (Windows Subsystem for Linux 2). Read more"
