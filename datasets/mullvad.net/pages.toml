["https://mullvad.net/en/pricing"]
title = "Pricing"
description = "Free the internet from mass surveillance and censorship. Fight for privacy with Mullvad VPN and Mullvad Browser."
full_description = '''A fair pricing model It's not an optical illusion. It's one flat monthly rate for ultimate flexibility. Including VAT. 1 month €5 per month 1 year €5 per month 1 decade €5 per month €5 is equivalent to $5.19 £4.13 SEK 55.81 A$8.36 CA$7.51 Get started – generate an account Already have one? Top up your existing account Flexible We love a good deal, but we don't want to lock you (and your money) into a long-term payment scheme. Feel free to top up your VPN account for an entire year, or just pay month to month for the exact same rate. Reliable Our price hasn't changed since, well, ever! We’re still offering privacy at the same rate as when we launched in 2009. Call us unconventional. Call us blind to inflation. We call it a pretty good deal. Sustainable We're always aiming to improve our service. With a sustainable payment model, we can invest in quality development and bandwidth. No €1/month rate or lifetime membership could ever support that. Still got questions? Which payment methods do you accept? We accept cash, Bitcoin, Bitcoin Cash, Monero, bank wire, credit card, PayPal, Swish, Eps transfer, Bancontact, iDEAL, and Przelewy24. Can I really pay with cash? You bet, and please! Stay anonymous all the way. Just put your cash and payment token (randomly generated on our website) in an envelope and send it to us. We accept the following currencies: EUR, USD, GBP, SEK, NOK, CHF, CAD, AUD, NZD. Do you offer any type of discount? Yes. Our accepted cryptocurrencies are discounted at 10% due to lower fees and less administration. You can also buy from resellers that offer Mullvad VPN at different price models than ours. I can’t find your payment page. Where is it? Start with one click to generate an account. You’ll immediately get an account number and be able to choose a payment option. How many devices can I use an account on? You can use a Mullvad VPN account on up to 5 devices. What if I’m not satisfied? We hope you'll give our in-house Support Team (support@mullvadvpn.net) a chance to solve any problems you encounter. But if you’re not satisfied with our VPN service, we offer a 14-day money back guarantee (except for cash payments due to anti-money laundering regulations). Do you ever have any sales? Nope. Not for Christmas or any other holiday or event that you can think of. But you can always celebrate your privacy with us for the same monthly rate 365 days a year (except on leap years of course)! Why no free plan? "Free" services nearly always come at some cost, whether that be the time you spend watching an intro ad, the collection of your data, or by limiting the functionality of the service. We don't operate that way – at all.'''
