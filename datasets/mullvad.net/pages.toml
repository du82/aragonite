full_description = "IP exposure via UDP ports December 23, 2015 News We have recently become aware of a newly published method for deanonymizing VPN users. For this to work, the user must be running some software that listens to and communicates via a UDP port and either be connecting directly to the internet without a NAT router or be behind a NAT router with port forwarding enabled. Read more Version 56 released December 14, 2015 News Version 56 of the Mullvad client is now available for download. Read more Version 55 released November 30, 2015 News Version 55 of the Mullvad client is now available for download. Read more Mullvad is safe against the 'Port Fail' attack November 30, 2015 News A few days ago Perfect Privacy presented a vulnerability that affects many VPN providers offering port forwarding for their customers. According to their post five of the nine tested VPN providers were vulnerable to this attack. Read more Version 54 released November 4, 2015 News Today we release version 54 of the Mullvad client Read more DNS leaks on Windows 8, 8.1 and 10 October 21, 2015 News It has recently come to our attention that the DNS resolution mechanism in Windows 8 and newer can potentially leak DNS queries outside of the VPN tunnel. In these versions of Windows, DNS queries are sent to all interfaces simultaneously. Even if the tunnel is the default gateway, all other interfaces will also send out the same DNS query outside of the tunnel. Read more iOS 9 problems October 9, 2015 News OpenVPN on iOS 9 will appear to connect properly but your IP will not change, meaning you will not be protected even though OpenVPN connect reports that you are connected. Read more Windows encoding issues October 9, 2015 News There is an encoding bug in our windows client that mostly affects users with non-english system language. Those who are affected will get an error similar to this: Read more Version 52 issues on Windows September 18, 2015 News With the release of version 52 we introduced a bug which causes our client to crash if the Windows firewall is disabled. To resolve this, please enable the Windows firewall. Read more"
