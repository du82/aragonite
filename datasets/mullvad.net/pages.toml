full_description = "Press About Mullvad # Mullvad VPN exists to fight against mass surveillance and censorship. We do this primarily through our VPN service and our browser. We believe in a free and open society where people have the right to privacy; the right to their own beliefs and thoughts, and the right to decide for themselves exactly when and with whom they want to share them. We strongly believe that democratic societies must be built upon the right to privacy in order to thrive and develop. The legal entity operating Mullvad is Mullvad VPN AB, and the operation is based on the human right to privacy and freedom of expression without censorship. Read more Why privacy matters — what consequences can mass surveillance have if we don't resist? Learn more about the data collection of today, and how it’s a threat to free societies. Press contact # If you're a journalist and have questions about us, please contact press@mullvad.net. Follow and subscribe The Mullvad Blog X Logos # These images are made available for editorial purposes in which our work is described. Color Digital: PNG SVG Print: EPS Digital: PNG SVG Print: EPS Digital: PNG SVG Print: EPS Digital: PNG SVG Print: EPS Digital: PNG SVG Print: EPS Digital: PNG SVG Print: EPSBlack and white Digital: PNG SVG Print: EPS Digital: PNG SVG Print: EPS Digital: PNG SVG Print: EPS Digital: PNG SVG Print: EPS Digital: PNG SVG Print: EPS Digital: PNG SVG Print: EPS Wordmark Digital: PNG SVG Print: EPS Digital: PNG SVG Print: EPS Fonts # Body copy: Open Sans Headlines and buttons: Source Sans Pro Color palette # ColorHexRGBCMYKPMS Blue#294D7341,77,115100,54,4,197462 Dark blue#192E4525,46,69100,70,8,54534 Green#44AD4D68,173,7761,0,55,327738 Red#E34039227,64,57 Yellow (logo helmet)#FFD524255,213,360,10,100,0109 Brown (logo fur)#D2943B210,148,597,37,99,191245 Beige (logo nose)#FFCD86255,205,1340,18,43,0148"
