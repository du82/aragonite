["https://mullvad.net/en/blog/mullvad-browser-140-released"]
title = "Mullvad Browser 14.0 released | Mullvad VPN"
description = "Today we announce the stable release of Mullvad Browser version 14.0"
full_description = "Mullvad Browser 14.0 released November 19, 2024 News Browser Today we announce the stable release of Mullvad Browser version 14.0 Mullvad Browser 14.0, based on Firefox ESR 128, incorporates a year's worth of changes from Firefox. As part of this process we've also completed our annual ESR transition audit, where we review Firefox's changelog for issues that may negatively affect the privacy and security of Mullvad Browser users and disable any problematic patches where necessary. The final reports from this audit are now available in tor-browser-spec repository on the Tor project Gitlab repository. While we aim to release at the same time as Tor Browser, this time round it was not possible. This had no security implications, since Firefox ESR 115 is still supported by Mozilla. Picture-in-Picture & Screenshots are back As we mentioned earlier, each change to Firefox ESR needs to be audited. This time round we welcome back Firefox Screenshots and enable Picture-in-Picture. The previous implementation of Firefox screenshot was making a browser more uniquely identifiable and so was disable. It is now again activated, thanks to the new privacy respecting implementation. Security levels Changing the security level modifies the browser fingerprint, and is not recommended. Consequently, the Security levels button has been removed from the toolbar. Security levels are still accessible through the browser settings. Changelog The full changelog is available in our release notes."
