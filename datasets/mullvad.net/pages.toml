full_description = "Wikileaks accessible through Mullvad December 3, 2010 News The wikileaks.org domain has been taken down by their provider. Mullvad users and people using our public DNS can now reach it again. Read more Domain censorship countermeasures November 29, 2010 News This weekend the U.S. government hijacked over 70 domain names and redirected them to their own servers. As part of our ongoing struggle against censorship Mullvad users are no longer affected by this seizure. The domains work just like before the attack. Read more Account hijacking protection October 26, 2010 News The new Firesheep software listens in on wireless networks and automatically hijacks accounts on Facebook, Twitter and other web services. Mullvad provides protection. Read more Version 24 released September 21, 2010 News Version 24 of the program is now available for download. The main new feature is the ability to use several ports. Read more Anonymization vulnerability in Windows fixed June 18, 2010 News It has been discovered that the IPv6 tunneling behaviour in Windows Vista and 7 can cause problems for anonymization. Users of Windows Vista or 7 should upgrade to version 23 which disables the IPv6 tunneling. It can also be disabled by hand. Read more Unlimited traffic volume May 26, 2010 News By popular request we now take the next step beyond the limit raise and get rid of the data transfer limits altogether. Read more Version 22 released March 22, 2010 News Version 22 of the program is now available for download. It improves error handling and investigation. Read more Version 21 for Windows released February 8, 2010 News Version 19 and 20 wouldn't start on some Windows systems (Runtime Error R6034). Version 21 solves that problem. Read more 50 GB becomes 100 GB February 6, 2010 News The data traffic amount for each paid monthly period is increased to 100 GB. Existing remaining amounts are also doubled. Read more"
