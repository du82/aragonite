["https://mullvad.net/en/blog/the-european-commission-does-not-understand-what-is-written-in-its-own-chat-control-bill"]
title = "THE EUROPEAN COMMISSION DOES NOT UNDERSTAND WHAT IS WRITTEN IN ITS OWN CHAT CONTROL BILL | Mullvad VPN"
description = "Ylva Johansson is the EU Commissioner in charge of the Chat Control Bill. In recent days she has taken part in several interviews in Swedish media and also spoken in front of EU parliament members."
full_description = '''THE EUROPEAN COMMISSION DOES NOT UNDERSTAND WHAT IS WRITTEN IN ITS OWN CHAT CONTROL BILL March 28, 2023 News Privacy Ylva Johansson is the EU Commissioner in charge of the Chat Control Bill. In recent days she has taken part in several interviews in Swedish media and also spoken in front of EU parliament members. It’s obvious during the interviews that Ylva Johansson does not understand her own bill and what consequences it would have. She constantly repeats misleading and incorrect arguments. Above all, she continues to claim that it’s possible to scan end-to-end encrypted communication without breaking the encryption. It’s remarkable that the responsible EU Commissioner gets away with this, without tremendous criticism from media and members of the EU Parliament (we know, there are some speaking up, but it’s not enough). Here are some of her statements during the last week and our comments. PODCAST INTERVIEW IN THE SWEDISH NEWSPAPER SVENSKA DAGBLADET: "SIGNAL IS ALREADY SCANNING ITS USERS' ENCRYPTED COMMUNICATION" In a podcast interview in the Swedish newspaper Svenska Dagbladet, Ylva Johansson claimed, among other things, that scanning for child abuse content in encrypted communication is equivalent to scanning for viruses and that encrypted communication can be scanned without breaking the encryption. She also said that “if you’re on Signal, and you want to send me a link to an interesting Svenska Dagbladet article … when you start typing the address of the article, a picture of the article pops up and that’s because they’re scanning the conversation”. Apart from those highlights, here’s a summary of things she said during the interview (in bold) with our comments below. “Next summer, all the scanning taking place right now of child sex will be banned within the EU. That is, if we don’t have special legislation that allows it.” · What Ylva Johansson is talking about is the current legislation (which makes it voluntary for internet services to carry out these types of searches). There’s nothing stopping Ylva Johansson, instead of introducing an extension of the law, from extending the current legislation. “This is the special legislation that I proposed last year, which will make it possible to continue the scanning currently being done, except that I’m placing restrictions on what you can and may scan. Today they can scan almost anything anyway, if they’re looking for child sex material; in my Bill it will only be following a court order that permission can be obtained to scan and continue to scan for child sex material, so that we will continue to get the reports that facilitate the apprehension of perpetrators and that allow us to protect and save the children.” · It’s very impudent to say “limiting what can be scanned” when the bill will force all services to scan all people’s communications. When asked to explain that the new proposal is actually mandatory instead of voluntary, as it is today, Ylva Johansson replies: “If it is judged in a court that the situation is so serious, that the risk is so great that criminal material will be shared here, about little children who are being exposed to violence – if you can scan, then you also have an obligation to do so – that’s a new element I’ve introduced. I don’t want to be dependent on the companies’ goodwill. Today, there are many people who are scanning, but I'm also aware of the fact that they are also being subjected to a variety of pressures saying they should not be scanning the communication and I want to ensure that if a court judges that this is so serious that the communication should be scanned and then that also should be obligatory.” · The bill states that the law will apply to services that are likely to be used by children, or can be used to search for other users, or allow users to be contacted directly, or allow images to be shared with others. In other words: all digital services. · There’s no mention of courts having to make decisions in the bill. When asked to elaborate, Ylva Johansson backs off: “It doesn't explicitly say “court”. But that’s what it will look like in the vast majority of countries, because that’s where most countries make this type of decision.” · This means that Ylva Johansson improperly has used the court argument during the entire legislative period. In addition to that: in this type of discussion, "surveillance after a court order" refers to the fact that there must be a suspicion of a crime in order to monitor. This is not the case in Ylva Johansson’s chat control proposal. In her Bill surveillance orders refer to the surveillance of everyone on a particular messaging service after an authority (doesn't have to be a court) in a country decides to do so (mass surveillance). “It's about sniffing, checking out you could say. It's not as if you read the communication; I mean, it’s like a police dog being able to smell if there’s something there. · It’s not possible to “sniff” end-to-end encrypted communication without looking at the encrypted communication. “This scanning has been going on for around ten years and there are incredibly few cases where someone has been falsely reported when contacting their guardian or anyone else.” · This type of detection has not been going on for ten years. 1) End-to-end encrypted traffic has not been scanned, 2) a widespread system for AI to assess whether images and videos are criminal or whether conversations are grooming or not, has not existed. “I’m introducing an additional control measure where persons were to share child sex material, and it’s very sharply defined. We need to remember, it’s not nude pictures we’re talking about – we’re talking about sexual abuse of children, and there’s basically no such misreporting today; or perhaps only to a very small degree. So, there’s nothing new in what I am proposing; I’m only proposing that it should be allowed to continue.” · Does Ylva Johansson believe that naked pictures of children cannot be a crime? It sounds like she’s not familiar with the legislation as far as what qualifies being a crime and what doesn’t. · Swiss police have measured the error rate. It’s around 80-90%. This mainly concerns ‘already known material’. It’s a dizzying thought what the margin of error will be if AI is to judge what’s what. · Again, Ylva Johansson says that she’s “just suggesting that it should be allowed to continue”, despite confirming earlier in the interview that new measures will be introduced. “If we take for example a company like Roblox, which caters a lot to children, they promise their users that they scan so as to prevent grooming in their chats. They will no longer be able to promise their users that, if we ban all forms of scanning when it has to do with this type of abuse.” · Once again, the same lie. It’s possible to extend existing legislation instead of expanding it. “Sexual abuse of children is clearly defined in our EU legislation; it is not that you can have your own interpretation of what constitutes sexual abuse of children. Rather, it’s clearly defined, so it can’t be used to search for something else that you dislike, but that definition is crystal clear.” · AI finds it – to say the least – quite difficult to “clearly define” between a holiday picture on the beach and a nude picture intended for criminal purposes. · The technology can be redirected to be used to search for other things. Even before the bill came into force, one MEP suggested that drag queens should be targeted “as they’re often involved in the sexual exploitation of children”. · Another point of view: what will the EU look like in ten to twenty years? Ylva Johansson doesn't know that. No-one knows. If you put a tool like this in the hands of people in power, tomorrow's people in power can use it for something else – and then it's too late to back out. Worth pointing out: Already today, the governments of five countries in the EU have been accused of spying on political opponents. Already today there are countries in the EU that are not classified as democratic. “That risk will still exist (risk of false flagged material) it would be minimal I should say, but nonetheless, it will be there. And that's why I've included a special security measure so that no reports go directly to the police, rather they’ll go first to the center we're going to create against sexual abuse of children, and that’s like putting in a filter to preclude other material, which is not abuse, such as the example you’ve just cited, unusual though it was, from cropping up. But if it should happen, I’ve put in such a filter, you could say, so that it does not go to the police.” · Again: During investigations, 80-90% of mainly “existing material” has been found to be incorrect flagging. · Why would you feel more comfortable with a large EU center reviewing private communications than the police? Such an organization would be a colossus and completely impossible to operate in a safe manner. If organizations can read private communications, sooner or later it will be leaked. This is why data gathering is dangerous. This is why it is incredibly important that end-to-end encryption won’t be forbidden by law. “My Bill is not about encryption, it’s not even mentioned. The Bill includes nothing to do with encryption ... my Bill is technology neutral. This is not a Bill intended to break or weaken encryption. That’s the important thing; it doesn't specify any particular technology. Neither do we not exclude any specific technology in the Bill.” · Ylva Johansson says that “it’s not about encryption” and in the next breath she says that “encryption isn’t excluded”. No more counter-arguments. “It is not true that everyone will be obliged to do detection work. What all the companies will be obliged to do is to carry out a risk assessment, if there exists any risk that their services will be used to spread sexual abuse of children.” · Again: The bill states that the law will apply to services that are likely to be used by children, or can be used to search for other users, or allow users to be contacted directly, or allow images to be shared with others. In other words: all digital services. Let's finish with a part from the interview, where the journalist Andreas Ericson from the Svenska Dagbladet presses Ylva Johansson about encrypted communication. It becomes extra obvious that Ylva Johansson has no idea how the technology works. [Andreas Ericson] Can I just ask you one thing Ylva. If that happens, under this Bill, would you and I be able to have contact in the future, if, for example, you feel that you want to blow the whistle on the European Commission and contact Svenska Dagbladet under source protection regulations? And, would we also be able to have encrypted contact that the authorities are unable to read, with this Bill? [Ylva Johansson] Yes, that goes without saying. [Andreas Ericson] But if that’s the case, won’t all pedophiles use the same encrypted contacts? And then what’s been gained? [Ylva Johansson] No, but the thing is – the only thing that, the thing that ... sexual abuse of children, pictures of such, is always criminal. [Andreas Ericson] But if you and I will be able to encrypt our communications, then surely pedophiles will be able to encrypt theirs too? [Ylva Johansson] If that material is shared, it may be that it is detected, that material. Andreas Ericson] But then, isn't it encrypted? [Ylva Johansson] But it's not as if you are able to read someone's communication. And there are techniques to detect without breaking the encryption. I think it's very important that we defend the possibility and the right to encrypted communication, but that does not mean that we should say that as long as we use encrypted communication, we will not take steps to apprehend child sexual abuse. [Andreas Ericson] I'm a technology idiot, Ylva. This is how I understand it: if you send me pictures in encrypted documents, the authorities will not be able to read them. But if pedophiles send abuse images to each other, the authorities will be able to read them because there are technological solutions for that. That’s how I understand it; have I understood you correctly? [Ylva Johansson] No, you haven’t. You can make a comparison. Because encrypted communication today is scanned by the companies. They scan all communications for viruses. So, if you’re on Signal, and you want to send me a link to an interesting Svenska Dagbladet article, when you start typing the address of the article, a picture of the article pops up, because they’re scanning it. And that’s to make sure you aren’t sending me any viruses. [Andreas Ericson] Okay, you can see the image but isn't it encrypted? Karl Emil (opponent in the debate), would you like to come in here? [Karl Emil Nikka] That's not even how Signal works. The way Signal works is that if you get a preview, it's because your Signal client, from your device, is taking a picture of the website and including it in the message that's being sent. Signal has no access to this information ... [Ylva Johansson] But that's not what I’m saying. [Karl Emil Nikka] You said that Signal works the way you said, which it doesn't. INTERVIEW IN THE SWEDISH RADIO: ”IT’S LIKE SCANNING FOR VIRUS” In an interview with the Swedish Radio, Ylva Johansson continues to repeat the same misleading arguments. Meanwhile, she refuses to answer how she will ensure that future governments and EU parliaments won’t abuse the system and how the EU center will guarantee that private conversations are not leaked (this question Ylva refuses to answer three times a row). Here’s a few of examples of her repeated argument: "If we protect our mobile phones (against viruses) better than we protect children against very serious sexual abuse …” · Once again, Ylva Johansson goes on comparing scanning of communication with scanning of viruses. It’s not possible to do that comparison. Virus scanning never occurs on encrypted content. "A police dog can sniff physical mails to see if they contain drugs, and if they contain drugs the police can intervene. It’s an invasion of privacy that we think is reasonable.” · Alright, let’s take the Ylva Johansson’s sniffing dog comparison. Ylva Johansson’s chat control law is like having a police dog beside you wherever you go. 24 hours a day. Out in the street. At work. At home. In your bedroom. On the toilet. It’s not like going to the airport, say hi to the sniffing dog and then go to the bar (without the dog). There’s also a difference between the drug sniffing police dogs and this chat control dog – because this dog has poor sense of smell. So, the dog will bark eight times out of ten when you text your partner something dirty. And every time it barks, a bureaucrat from the new EU center will come to your home to check everything you wrote to your partner and all the (legal) nude pictures you have on your phone. This won’t happen when you are at home. This will happen without '''
