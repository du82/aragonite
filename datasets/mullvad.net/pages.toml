full_description = "Mullvad has partnered with Obscura VPN February 11, 2025 News Today we are announcing a partnership with Obscura VPN, a newly launched two-party VPN service that uses our WireGuard VPN servers as its “exit hop”. This partnership starts on 11th Feburary 2025, with apps for macOS being available from this date on Obscura VPNs website. While connected through Obscura, your traffic first passes through Obscura’s servers before exiting to the Internet via Mullvad’s WireGuard servers. This two-party architecture ensures that neither Obscura nor Mullvad can see both your identity and your Internet traffic. Obscura users can verify that their traffic is sent encrypted to a Mullvad server by comparing their server’s WireGuard public key (shown on the Obscura App’s “Location” page) against those published on our server page. Obscura also features a custom obfuscation protocol based on QUIC that mimics HTTP/3 traffic to bypass firewalls and censorship. This service is separate from Mullvad VPN. Read more on Obscura VPN’s website. Also available via Tor: http://ngmmbxlzfpptluh4tbdt57prk3zxmq4ztew7l2whmg7hkqaof2nzf7id.onion/"
