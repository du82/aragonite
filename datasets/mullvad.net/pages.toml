full_description = "Partnerships and Resellers Policies Last updated: February 13, 2025 This page gives an overview of our current partners, distributors, and resellers. Resellers - purchase Mullvad VPN scratch cards With our official resellers, you can purchase Mullvad VPN scratch cards that contain an activation code to top up a new or existing account. Benefits: The design of the activation code removes the possibility for third parties to link a payment to a Mullvad account, for privacy. You can gift time and give it to a friend without knowing their account number. Available at:Amazon - USAmazon - UKAmazon - DEAmazon - CAAmazon - SEAmazon - FRAmazon - ESAmazon - PLAmazon - NLAmazon - MXAmazon - AU Inet Since March 2020, we’ve partnered with Inet, a Swedish-based electronics retailer, in order to sell Mullvad VPN online and in stores. Webhallen Since March 2020, we’ve partnered with Webhallen, a Swedish-based electronics retailer, in order to sell Mullvad VPN online and in stores. ProxyStore Since April 2021, we’ve partnered with ProxyStore, a German-based provider of privacy-focused goods and services, in order to sell Mullvad VPN online and in store. SerialCart Since April 2022, we’ve a distribution partnership with SerialCart® (MySecure Space GmbH), an Austrian-based provider of privacy and security focused products and services. They offer Mullvad VPN physically and digitally on their websites: SerialCart.com, SerialCart.de and MySecure.Space. Laptop with Linux Since October 2022, we’ve partnered with Laptop with Linux, a Dutch-based reseller of privacy-focused goods and services, They offer physical Mullvad VPN activation codes with free delivery world-wide. Partners Malwarebytes Malwarebytes has partnered with Mullvad in order to utilize our global network of VPN servers for its own VPN application, Malwarebytes Privacy VPN, since October 2019. Mozilla Mozilla has partnered with Mullvad in order to utilize our global network of VPN servers for its own VPN application, Mozilla VPN, since July 2019. Tailscale Tailscale has partnered with Mullvad in order to allow customers of Tailscale to make use of our WireGuard VPN servers as “exit nodes” for Tailscale, since September 2023. This enables Mullvad and Tailscale to co-exist. Obscura VPN Obscura VPN has partnered with Mullvad in order to make use of our WireGuard VPN servers as “exit nodes” for its own VPN application, Obscura, since February 2025."
