full_description = "Mullvad is now available on Amazon (US & SE) July 26, 2022 News For the first time in our history you can buy Mullvad VPN physical activation codes on Amazon! Benefits: The design of the activation code removes the possibility for third parties to link a payment to a Mullvad account, for privacy. You can gift time and give it to a friend without knowing their account number. How to get started: Buy the activation code from Amazon and wait for delivery. Visit mullvad.net/account to generate your account number, or use your existing Mullvad account. Choose “voucher” as payment method and scratch the grey area on the back of the card to reveal your activation code. Enter your code and redeem it - your account has been activated. Download our app on your preferred devices and sign in with your account number. Secure your connection and take a look at our guides and blog for more privacy tips. In need of assistance? Contact support@mullvad.net Note:Currently only available on Amazon US & SEUpcoming countries: GB, DE, NO, FI, AU, NL, CA, CH, FR, ES, DK"
