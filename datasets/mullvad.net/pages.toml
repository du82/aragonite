title = "About"
description = "Free the internet from mass surveillance and censorship. Fight for privacy with Mullvad VPN and Mullvad Browser."
full_description = "About Mullvad VPN AB is owned by parent company Amagicom AB. The name Amagicom is derived from the Sumerian word ama-gi – the oldest word for “freedom” or, literally, “back to mother” in the context of slavery – and the abbreviation for communication. Amagicom stands for “free communication”. The founders Mullvad VPN AB and its parent company Amagicom AB are 100% owned by founders Fredrik Strömberg and Daniel Berntsson who are actively involved in the company. The team Sort by team Sort by name Emma AdministrationAlbin AppAndrew AppCarl AppDavid G AppDavid L AppEmils AppJoakim AppJon AppJonatan R AppKarl AppLinus AppMarco AppMarkus AppMatilda AppOskar N AppSebastian AppSteffen AppTobias AppRui BrowserJan CEOEmil S InfrastructureKrister InfrastructureMagnus InfrastructureNicklas InfrastructureRobin InfrastructureJoshua IntegrationsEmil OfficeEric OperationsJack OperationsRichard OperationsErik H Relay SoftwareOdd Relay SoftwareOscar Relay SoftwareDouglas Sales & MarketingAlexander ServicesGrégoire ServicesJonathan H ServicesMattias ServicesMichal ServicesSimon ServicesWilliam ServicesSanny SupportStefan SupportHank Web For the history buffs These are just a few of the milestones we’re particularly proud of: 2009 March 2009 – The Mullvad VPN service launches! 2010 July 2010 – We started accepting Bitcoin payments. September 2010 – Customers could start paying in cash! 2014 April 2014 – We swiftly assessed and mitigated the Heartbleed vulnerability and then proved our hypothesis of its critical impact on OpenVPN. September 2014 – We demonstrated that OpenVPN is vulnerable to Shellshock, resulting in admin access, and warn our competitors before general disclosure. September 2014 – We launched IPv6 support 2017 March 2017 – Our users were able to start using WireGuard December 2017 – We introduced a post-quantum secure VPN tunnel. 2018 September 2018 – The independent audit on our VPN app was completed 2019 June 2019 – Our new project on System Transparency was revealed, and we called upon our community to develop and encourage transparent systems. July 2019 – Mozilla partnered with us to utilise our global network of VPN servers for its own VPN application. August 2019 – We succeed in porting open-source firmware to an off-the-shelf server, a first in history and getting us one step closer to our vision of System Transparency. October 2019 – We added Malwarebytes as yet another partner using our server network. 2020 June 2020 – All five platform versions of our VPN app underwent a thorough external security audit. December 2020 – No personally identifiable information (PII) or privacy leaks were found during the first independent security audit of our infrastructure. 2021 February 2021 – We released an audited, beta version of a public DNS service. June 2021 – We started adding DNS content blocking to our apps, with the lists updated frequently and available here. August 2021 – We added Split-tunneling support to our Windows, Android and Linux apps. 2022 January 2022 – We added a pair of WireGuard servers running entirely from RAM, as the start of our journey towards System Transparency began. March 2022 – Multihop support for WireGuard was added to the desktop apps, for more privacy and to make your traffic harder to analyse. March 2022 – Our Firefox extension, Mullvad Privacy Companion was made open source May 2022 – The Monero cryptocurrency was added as a supported method of payment. June 2022 – Subscriptions were no longer accepted, as a way of storing even less information about customers July 2022 – Post-quantum WireGuard tunnel support was added in an experimental form, available in the desktop app. July 2022 – It became possible to purchase Mullvad VPN physical activation codes from Amazon in certain countries, with many other countries becoming available in the months that followed. 2023 April 2023 – We released the Mullvad Browser in collaboration with the Tor Project. June 2023 - We released our privacy focused search engine Leta. September 2023 – Partnership with Tailscale. September 2023 – Completed migration to RAM-only VPN infrastructure. 2024 February 2024 - We self-host our support email. May 2024 - We released DAITA (Defense against AI-guided Traffic Analysis)"
