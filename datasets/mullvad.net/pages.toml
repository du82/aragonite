title = "Free the internet. With the Mullvad Browser."
description = "The Mullvad Browser is a privacy-focused web browser developed in collaboration between Mullvad VPN and the Tor Project. It’s produced to minimize tracking and fingerprinting."
full_description = "A VPN is not enough. This is why you need a privacy-focused browser. Big tech, authorities, and data brokers can use your IP address, cookies, scripts, and browser fingerprints to identify and track you online. Learn more about your unwanted followers and why you need a privacy-focused browser to stop them. Read more A Tor-developed browser. To run with a VPN instead of the Tor Network. Using a VPN alone is not enough to achieve perfect privacy. There’s simply too much data being extracted through most browsers. So, Mullvad reached out to the experts on privacy-focused browsers: the Tor Project. Learn about the idea behind the collaboration. Read more Your browser in itself can be a privacy problem. Things to look for when choosing a browser. Some browsers are made to map your internet behavior. That’s their business model. Others just don’t have enough privacy protection. These are the questions you should ask yourself (or even better, the browser provider) before you choose a browser. Read more Your browser can be used to uniquely identify you. Get to know browser fingerprinting. When you visit a webpage, most browsers give away information about your software and device. Combining this information with your other browser data makes it possible to create a user profile that can identify you. Read more All together as one: this is how the Mullvad Browser works. In our world, there’s only one way to reduce the absurd personal data collection of today, and it’s a classic: hide in the crowd. Take a look at the modifications and settings of a browser with a single purpose and ambition: for all of its users to appear as one. Read more The Mullvad Browser hard facts: list of settings and modifications. All the content on this page has a single goal: to get as many people as possible to understand the importance of online privacy. That’s why we have simplify some things, and that’s why we try to be as educational as possible. If you think all this is yesterday’s news, go straight to the tech specification. Read more"
