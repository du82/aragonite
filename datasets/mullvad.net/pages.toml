["https://mullvad.net/en/help/forslag-till-ny-lag-for-elektronisk-kommunikation"]
title = "Förslag till ny lag för elektronisk kommunikation"
description = "Ny europeisk kodex för elektronisk kommunikation och förslag till ny lag för elektronisk kommunikation"
full_description = "Förslag till ny lag för elektronisk kommunikation Policies Last updated: May 25, 2020 Read in English: Proposed new Swedish law for electronic communications 1. Allmänt om kodexen och nya LEK Infrastrukturdepartementet har tagit fram en promemoria med förslag till en ny lag om elektronisk kommunikation som ersätter den nuvarande lagen om elektronisk kommunikation (”LEK”). Den nya föreslagna lagen (”nya LEK”) genomför EU:s direktiv om inrättande av en europeisk kodex för elektronisk kommunikation1 (”kodexen”). Många delar av det nya förslaget innebär att de nuvarande bestämmelserna i LEK överförs helt eller delvis till den föreslagna lagen för elektronisk kommunikation, nya LEK. Bestämmelserna i nya LEK är väsentligen samma som tidigare med vissa uppdateringar samt tillägg och med en annan struktur än befintliga LEK. Post- och telestyrelsen (”PTS”) anger i remissvar avseende promemorian att de anser att nya LEK är avsevärt lättare att förstå än nuvarande LEK. Nya LEK föreslås träda i kraft den 21 december 2020 vilket är den dag då kodexen ska ha införlivats av EU:s medlemsstater i nationell rätt. 2. Lagens tillämpningsområde Av 1 kap. 3 § i nya LEK framgår att lagens tillämpningsområde ska vara följande: ”Lagen gäller elektroniska kommunikationsnät och kommunikationstjänster med tillhörande faciliteter och tjänster samt annan radioanvändning. Lagen är inte tillämplig på innehåll som överförs i elektroniska kommunikationsnät med hjälp av elektroniska kommunikationstjänster”. Paragrafen motsvarar den nuvarande regleringen i 1 kap. 4 § LEK med undantag för vissa språkliga ändringar. Undantaget från lagens tillämpningsområde omfattar så kallade innehållstjänster med innehåll som tillhandahålls i exempelvis radio- och tv-program samt tjänster som innebär tillhandahållande av innehåll på internet. VPN-tjänster bör inte anses vara innehållstjänster då en VPN-tjänst inte tillhandahåller något innehåll på internet utan endast en tillgång till kryptering och IP-adress. VPN-tjänster bör därmed inte omfattas av undantaget. Skillnaden mellan tillämpningsområdet för LEK och tillämpningsområdet för förslaget till nya LEK är främst att definitionen för allmänt tillgängliga kommunikationstjänster föreslås ändras till att omfatta interpersonella kommunikationstjänster. Den föreslagna ändringen av definitionen innebär att behandling av personuppgifter som faller in under dataskyddsförordningen även kan komma att omfattas av nya LEK och PTS tillsynsområde. 3. Elektroniskt kommunikationsnät och allmänt elektroniskt kommunikationsnät 3.1 Definitioner Med allmänt kommunikationsnät avses i den nuvarande bestämmelsen i 1 kap. 7 § LEK följande: ”[…]elektroniskt kommunikationsnät som helt eller huvudsakligen används för att tillhandahålla allmänt tillgängliga elektroniska kommunikationstjänster och som stödjer informationsöverföring mellan nätanslutningspunkter,”. Definitionen överensstämmer med den nya föreslagna definitionen för allmänt elektroniskt kommunikationsnät. Definitionen för elektroniskt kommunikationsnät i den nuvarande bestämmelsen i 1 kap. 7 § LEK är följande: ”[…]system för överföring och i tillämpliga fall utrustning för koppling eller dirigering samt passiva nätdelar och andra resurser som medger överföring av signaler, via tråd eller radiovågor, på optisk väg eller via andra elektromagnetiska överföringsmedier oberoende av vilken typ av information som överförs,”. Förslaget till definitionen för elektroniskt kommunikationsnät överensstämmer också med den nuvarande definitionen i LEK. 3.2 Är en VPN-tjänst ett allmänt elektroniskt kommunikationsnät? I förarbetena till LEK har angivits att VPN kan ske över ett allmänt kommunikationsnät men att det inte gör att den som tillhandhåller VPN är skyldig att särskilt anmäla verksamheten. Det är den som tillhandahåller det allmänna kommunikationsnätet som är anmälningspliktig för detta (om det tillhandhålls mot ersättning). De tidigare förarbetena har således gett uttryck för att en VPN-tjänst inte är att likställa med ett allmänt kommunikationsnät. Då det enligt förslaget till den nya lagen inte föreslås någon ändring av definitionen får de tidigare förarbetena fortsattvis kunna anses ge vägledning vid bestämmande av vad som är att anse som ett allmänt elektroniskt kommunikationsnät och elektroniskt kommunikationsnät. Vidare så anses VPN-tjänster, i nuläget, inte omfattas av definitionen för allmänt kommunikationsnät då en VPN-tjänst består av ett ”privat nätverk”. Detta gäller oaktat om det virtuella privata nätverket utbjuds till allmänheten genom ingående av avtal och mot ersättning.Ny europeisk kodex för elektronisk kommunikation och förslag till ny lag för elektronisk kommunikation 4. Elektroniska kommunikationstjänster 4.1 Definitionen av elektroniska kommunikationstjänster Den nya LEK inför en delvis ny definitionen av elektroniska kommunikationstjänster. Bakgrunden till ändringen är att de tjänster som används i kommunikationssyften och de tekniska metoder som finns för att tillhandahålla dessa har utvecklats. Definitionen föreslås anpassas så att beskrivningen för elektroniska kommunikationstjänster ska vara funktionellt baserad istället för tekniskt baserad. Enligt den föreslagna nya definitionen av en elektronisk kommunikationstjänst framgår följande: ”[…]tjänst som vanligen tillhandahålls i elektroniska kommunikationsnät mot ersättning och som, med undantag för tjänster i form av tillhandahållande av innehåll som överförs med hjälp av elektroniska kommunikationsnät och kommunikationstjänster eller utövande av redaktionellt ansvar över sådant innehåll, utgör en 1. Internetanslutningstjänst enligt artikel 2.2 i Europaparlamentets och rådets förordning (EU) 2015/2120 […] 2. Interpersonell kommunikationstjänst, eller 3. tjänst som helt eller huvudsakligen utgörs av överföring av signaler, såsom överföringstjänster som används för tillhandahållande av maskin till maskin-tjänster eller för rundradio”. 4.2 Tjänst som tillhandahålls mot ersättning Den nya definitionen behandlar tre delvis överlappande typer av tjänster som vanligtvis tillhandahålls mot ersättning via ett elektroniskt kommunikationsnät. Att en tjänst ska tillhandahållas mot ersättning innebär att tjänsten ska tillhandahållas kommersiellt. Trots att en tjänst ska tillhandahållas mot ersättning inbegrips även kommersiella tjänster som tillhandahålls ”gratis” i utbyte mot personuppgifter och annan data såsom kakor, eller då slutanvändaren exponerNy europeisk kodex för elektronisk kommunikation och förslag till ny lag för elektronisk kommunikationas för reklam som ett villkor för att få tillgång till tjänsten. 5. Är en VPN-tjänst en elektronisk kommunikationstjänst? Det kan uteslutas att en VPN-tjänst är en elektronisk kommunikationstjänst i form av en internetanslutningstjänst eller en interpersonell kommunikationstjänst. Den återstående frågan är därmed om en VPN-tjänst kan anses vara en tjänst som helt eller huvudsakligen utgörs av överföring av signaler? I förarbetena till LEK har angivits att VPN kan ske över ett allmänt kommunikationsnät men att det inte gör att den som tillhandhåller VPN är skyldig att särskilt anmäla verksamheten. Det är den som tillhandahåller det allmänna kommunikationsnätet som är anmälningspliktig för detta (om det tillhandhålls mot ersättning). Det framgår även av den utredning om datalagring och EU-rätten (SOU 2017:75) som tillkom efter det att datalagringsdirektivet ogiltigförklarades och Tele2-domen att lagringsskyldighet enligt LEK inte omfattar lagring av uppgifter om anonymiseringstjänster (dvs VPN-tjänster) som aktiveras först efter internetåtkomst. Detta bör kunna tolkas som att lagstiftaren har ansett att en VPN-tjänst inte är att anse som en elektronisk kommunikationstjänst eller ett allmänt tillgängligt kommunikationsnät som tillhandahålls mot ersättning. Anledningen till lagstiftarens tydliga ställningstagande bör lämpligen vara att en VPN-tjänst är beroende av att slutanvändaren har en separat internetanslutningstjänst för att fungera. Det kan tolkas som att VPN-tjänsten är en typ av tjänst som tillhandahålls över internet och som arbetar i en nivå ovanför ett annat slag av IP-baserat kommunikationsnät. VPN-tjänsten arbetar således i en nivå ovanför den grundläggande kommunikationsnivåns förmåga till överföring av paket utan att den IP-baserade tjänsten behöva interagera med den. Däremot sker det någon form av signalöverföring hos VPN-leverantören för att tjänsten i sig ska kunna ligga uppe och fungera. Därtill tillhandahåller VPN-leverantören exempelvis en samlad IP-adress till sina användare vilket skulle kunna tala för att det är en elektronisk kommunikationstjänst men det är däremot inte detsamma som att tjänsten i sig, helt eller huvudsakligen, har rådighet över signalerna som möjliggör att användaren kan använda sig av tjänsten. En VPN-tjänst tillhandahåller inte själva nätet eller internetanslutningen men användarens trafik går via signaler till VPN-tjänstens servrar (VPN-tunneln) som krypterar anslutningen till användarens dator och gör att användarens riktiga IP-adress maskeras när användaren exempelvis besöker olika webbplatser på internet. Enligt promemorian med förslaget till nya LEK anges visserligen att en överföring av signaler inte behöver ske i tillhandahållarens nät. Vidare anges att det väsentliga vid en överföring av signaler är om tillhandahållaren är ansvarig gentemot slutanvändaren (abonnenten) för den överföring av signaler som säkerställer att användarna tillhandahålls den aktuella tjänst som de abonnerar på. Då en VPN-tjänst är beroende av att användaren är ansluten till internet för att tjänsten ska fungera bör förslaget lämpligen tolkas som så att VPN-tjänsten inte är ansvarig gentemot slutanvändaren (abonnenten) för den överföring av signaler som säkerställer att slutanvändaren tillhandahålls tjänsten. Men det skulle dock kunna tolkas motsatsvis – att då VPN-tjänster genom exempelvis kryptering via signaler som VPN-tjänsten i sig har rådighet över via avtal med underleverantörer etc. eventuellt skulle kunna ses som en elektronisk kommunikationstjänst. Vår uppfattning, baserat på det material vi har och analysen av nya LEK, är dock att den rimliga tolkningen är att det bör tolkas som att en VPN-tjänst inte är en elektronisk kommunikationstjänst med ledning i de tidigare förarbetena till LEK och datalagring samt PTS uttalanden om VPN-tjänster. 6. Slutsats En VPN-tjänst bör inte anses som ett allmänt elektroniskt kommunikationsnät då denna är beroende av att användaren är ansluten till internet för att kunna använda sig av VPN-tjänsten. Vidare har lagstiftaren i förarbetena till LEK och PTS uttryckt att en VPN-tjänst inte är anmälningspliktig enligt LEK. Detta tyder på att en VPN-tjänst inte heller är att betrakta som en elektronisk kommunikationstjänst då tjänsten, enligt de tidigare ställningstagandena, inte helt eller huvudsakligen har rådighet, rent fysiskt eller via avtal, över signalöverföringen som möjliggör att tjänsten kan nyttjas. Sammantaget framstår det som den rimliga tolkningen med ledning i de tidigare förarbetena och PTS uttalanden att en leverantör av en VPN-tjänst inte är anmälningspliktig enligt nya LEK om leverantören inte samtidigt tillhandahåller en annan tjänst som är anmälningspliktig (exempelvis en internetoperatör). VPN-tjänster som inte tillhandahåller andra tjänster som omfattas av LEK har således rimligen ingen kontroll över signalöverföringen då tjänsten inte fungerar utan användarens internetanslutning och bör heller inte kunna betraktas som en internetanslutningstjänst eller en interpersonell kommunikationstjänst. Det bör dock tilläggas att det fram till dess att nya LEK har fått sin slutliga utformning och trätt i kraft är osäkert om VPN-tjänster kan komma att omfattas. I avvaktan på den slutliga utformningen av nya LEK, och tills dess PTS uttalar något annat, bör det kunna tolkas som att VPN-tjänster förmodligen inte kommer att omfattas av nya LEK. Detta är dock inte något absolut ställningstagande utan ska ses som en preliminär tolkning av nya LEK baserat på promemorian, förarbetena till LEK och datalagring samt tidigare uttalanden från PTS avseende tolkningen av LEK. 1 Europaparlamentets och rådets direktiv (EU) 2018/1972 av den 11 december 2018 om inrättande av en europeisk kodex för elektronisk kommunikation."
