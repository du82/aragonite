full_description = "Mullvad review of 2024 December 23, 2024 News We are counting down the days until 2025 and are excited about the things that will happen next year. Read more The report for the 2024 security audit of the app is now available December 11, 2024 SecurityExternal auditsApp The third party security audit of the Mullvad VPN app has concluded that the app has a high security level. Some non-critical issues were found, and have been fixed to the extent possible. Read more Mullvad Browser 14.0 released November 19, 2024 NewsBrowser Today we announce the stable release of Mullvad Browser version 14.0 Read more Remaining Paypal subscriptions are being canceled November 13, 2024 News All remaining PayPal subscriptions are being canceled by Mullvad. If you have a PayPal subscription you will get a notification email from PayPal. Read more Removing OpenVPN 15th January 2026 November 8, 2024 NewsApp We are removing support for OpenVPN, it will be completely removed on 15th January 2026. Read more DAITA: Defense Against AI-guided Traffic Analysis October 29, 2024 NewsFeatures Even if you have encrypted your traffic with a VPN, advanced traffic analysis is a growing threat against your privacy. Therefore, we have developed DAITA – a feature available in our VPN app. Read more Defense against AI-guided Traffic Analysis (DAITA) is now available on Android October 25, 2024 FeaturesApp Even if you have encrypted your traffic with a VPN, advanced traffic analysis is a growing threat against your privacy. Therefore, we have developed DAITA – a feature that’s on all our supported platforms. Read more Introducing Shadowsocks Obfuscation for WireGuard October 25, 2024 FeaturesApp We are excited to introduce Shadowsocks obfuscation for WireGuard, aimed at helping users bypass firewalls and censorship. This new feature is available on the desktop and Android apps and will come to iOS later. Read more Mullvad is currently not available on Amazon October 25, 2024 News Update: