["https://mullvad.net/en/blog/stop-the-proposal-on-mass-surveillance-of-the-eu"]
title = "Stop the proposal on mass surveillance of the EU | Mullvad VPN"
description = "The European Commission is currently in the process of enacting a law called Chat control. If the law goes into effect, it will mean that all EU citizens&#39; communications will be monitored and listened to."
full_description = '''Stop the proposal on mass surveillance of the EU February 2, 2023 Privacy The European Commission is currently in the process of enacting a law called Chat control. If the law goes into effect, it will mean that all EU citizens' communications will be monitored and listened to. This text was originally published as a debate article in the Swedish newspaper Svenska Dagbladet and it calls on Swedish politicians to vote against the law proposal. In order for the law to not become reality, more countries need to vote against it. Therefore, we encourage journalists and citizens in all EU countries to question their governments and urge them to vote no. Right now, the EU Commission is intensely working on a legislative proposal that would monitor and audit the communication of all European Union citizens. The regulation is called Chat Control, and it really does include all types of communication. This means that all of your phone calls, video calls, text messages, every single line that you write in all kinds of messaging apps (including encrypted services), your e-mails — yes, all of this — can be filtered out in real time and flagged for a more in-depth review. This also applies to images and videos saved in cloud services. Basically, everything you do with your smartphone. In other words, your personal life will be fully exposed to government scrutiny. So, why is it that almost no one is talking about this? These types of legislative proposals that fully affect and encroach on people's lives — the equivalent of which can only be found in totalitarian states like China — should be discussed on every other news broadcast, and column after column should be written about it in editorial pages. The EU Commissioner responsible for this proposal is Ylva Johansson. Why aren't journalists pursuing her? Why don't they demand answers from the government? When the so-called 'espionage law' was recently implemented, it required an amendment to the Constitution. Such a thing should not be done hastily. A constitutional amendment needs to be approved by two different parliaments in order for journalists to have enough time to raise the issue and give the people a chance to form an opinion and make their voices heard. But what happened to those discussions? At that time, the Swedish association of journalists woke up way too late. The fourth estate is one of our democratic cornerstones, and Chat Control might make its work more difficult in the long run. We hope that this time, journalists will wake up sooner with a terrible vengeance. But time is running out. The politicians proposing this legislation claim to be doing it for the sake of the children. The purpose of implementing Chat Control is to be able to detect child pornography and child grooming. But is the purported end the reason why we are not discussing the means? At least, that's the impression one gets from Ylva Johansson's rhetoric. When she speaks about this legislative proposal, she only talks about the children, not about the effect this totalitarian surveillance will have on society. She isn't talking about how it will affect people's basic rights or about other more adequate law enforcement measures. Ylva Johansson, why can't you debate the tools and their consequences instead of using the children as your protective shield? At an EU conference in January, Ylva Johansson said that a court order would be required to carry out surveillance operations. But this legislative proposal isn't designed that way. Either Ylva Johansson, as the EU commissioner in charge of this proposal, is painting a completely inaccurate picture for her EU colleagues, or she has no idea how her proposal is written. She has previously stated that it is possible to carry out this type of mass surveillance while still protecting people's privacy. However, that is just not the way technology works. Ylva Johansson, how can you make a legislative proposal that the UN human rights commissioner has torn to shreds, a proposal that counters the European Convention on Human Rights and the EU Charter of Fundamental Rights? And how can you be sure that such a system will never be used for any other type of surveillance? When the National Defense Radio Establishment (NDRE) law was implemented in 2008, the Director-General of NDRE, Ingvar Åkesson, wrote that "there is this idea that the NDRE is going to listen to all Swedes' phone calls and read their e-mails and text messages. A disgusting thought. How can so many people believe that a democratically elected parliament would treat its people so badly?" However, 13 years later, in May 2021, Sweden was found by the European Court of Human Rights to have violated personal privacy due to the NDRE law. The Swedish government was urged to immediately correct these problems of legal uncertainty. Instead, however, the parliament did the exact opposite: they voted to extend the NDRE law in November 2021. This change in purpose that comes with mass surveillance is a huge problem and should at least be of interest to our journalists. Once a massive system for communication surveillance is put in place, it will be very easy to switch the filter at any given time. It can be switched before you say the word 'constitution'. Journalists who, for example, want to maintain the anonymity of their sources should be very concerned about this. Let's be very clear here. Simply implementing this legislation in its current state will be a violation of all EU citizens' privacy. These types of AI systems are not very precise and will thus wrongly select family vacation photos from the beach, video calls with online doctors, intimate text messages between partners, and conversations from dating apps. On the one hand, there is a risk of flooding the police with the task of going through all the material, which will steal resources that could be used to chase those who create this type of material. On the other hand, there is the obvious risk that people's most intimate but completely legal images will end up in the wrong hands. However, the biggest problem isn't the direct consequences; it's what's waiting around the corner. We will start self-censoring ourselves. In the first place, this will concern material that we believe might get caught in this filter. When there is a change in what is mass-monitored, when we can only guess who is monitoring our communications and with what agenda, we will change our behavior based on that. That is how the democratic functions of a society are worn down. If we install these types of back doors, that is the point at which our freedom will slowly slip away. If we don't want to try to close them in a raging storm, we better not open these doors at all. Sweden is currently serving as chairman of the EU's Council of Ministers, and, in the end, both Sweden's EU parliamentarians and Sweden in the Council of Ministers will vote on the issue. We will send letters to the politicians involved and ask them to vote against this law. And if someone else opens and reads these letters somewhere along the way, that person would violate postal secrecy, which is regulated in Sweden's constitution. This person could then be sentenced to up to two years in prison, a slightly different view of privacy than the one expressed in the Chat Control proposal. Mullvad VPN --- Swedish original text --- Stoppa förslaget om massövervakning i EU EU-kommissionen vill införa en digital övervakning vars motsvarighet bara går att hitta i totalitära stater som Kina. Varför pratar nästan ingen om detta? Just nu arbetar EU-kommissionen intensivt på ett lagförslag som innebär att alla medborgare i EU ska få sin kommunikation övervakad och granskad. Lagen kallas för Chat control och den innefattar verkligen all kommunikation: alla dina telefonsamtal, varje gång du ringer i videoläge, alla dina sms, varenda rad du skriver i olika meddelande­appar (även krypterade tjänster), dina mejl, rubbet – allt kommer att kunna filtreras i realtid och potentiellt fastna för djupare genomgång. Det här gäller även bilder och filmer som du sparar i molntjänster, alltså i princip allt du gör med din smart­phone. Med andra ord: ditt privatliv står helt naket inför statlig beskådning. Varför pratar nästan ingen om detta? Den här typen av lagförslag, som påverkar och inkräktar i människors liv på ett totalt sätt – vars motsvarighet bara går att hitta i totalitära stater som Kina – borde vara föremål för debatt i var och varannan nyhets­sändning, det borde skrivas spalt­meter efter spalt­meter på ledarsidorna. Ylva Johansson är ansvarig EU-kommissionär för förslaget. Varför ställer inte journalisterna henne mot väggen? Varför krävs inte regering och riksdag på ställnings­taganden? När den så kallade spionlagen nyligen infördes krävde den en ändring i grundlagen. Det är inget som ska göras lättvindigt, grundlagar ska klubbas igenom av två olika riksdagar för att journalister ska hinna lyfta frågan och folket få en chans att bilda sig en uppfattning och göra sin röst hörd. Men var fanns diskussionerna? Den gången vaknade Sveriges samlade journalistkår alldeles för sent. Den tredje stats­makten är en av våra demokratiska grundstenar och Chat control riskerar i förlängningen att försvåra dess arbete. Vi hoppas att journalisterna vaknar tidigare den här gången och tar gruvlig revansch – men tiden börjar rinna ut. Politikerna som föreslår den här lagen hävdar att de gör det för barnens skull. Chat control ska införas för att upptäcka barn­pornografi och grooming (vuxna som tar kontakt med barn i sexuellt syfte). Är det påstådda ändamålet anledningen till att vi inte diskuterar medlen? Åtminstone ser Ylva Johanssons retorik ut så. När hon pratar om det här lagförslaget pratar hon bara om barnen. Inte om effekten som totalitär övervakning har på samhället. Inte om hur det påverkar människors grund­läggande rättigheter. Inte om andra mer ändamåls­enliga brotts­bekämpande åtgärder. Ylva Johansson, varför kan du inte debattera verktygen och konsekvenserna av dem, i stället för att knuffa barnen framför dig? På en EU-konferens i januari sa Ylva Johansson att det kommer att krävas domstols­beslut för övervakning. Men lagförslaget är inte utformat så. Antingen sprider Ylva Johansson, som ansvarig EU-kommissionär, en totalt felaktig bild till sina EU-kollegor, eller så har hon inte koll på hur hennes förslag är skrivet. Tidigare har hon också sagt att det går att bedriva den här typen av massövervakning och ändå värna om människors integritet. Men det är inte så tekniken fungerar. Ylva Johansson, hur kan du lägga fram ett lagförslag som FN:s människorätts­kommissionär sågar och som går emot Europa­konventionen och EU:s rättighets­stadga? Och vad talar för att ett sådant här system aldrig kommer att användas till någon annan typ av övervakning? När FRA-lagen infördes 2008 skrev FRA-general­direktören Ingvar Åkesson att ”det odlas en uppfattning om att FRA skall lyssna på alla svenskars telefon­samtal, läsa deras e-post och sms. En vidrig tanke. Hur kan så många tro att en demokratisk vald riksdag skulle vilja sitt folk så illa?” 13 år senare, i maj 2021, dömdes Sverige i Europa­domstolen för att FRA-lagen kränker den personliga integriteten. Den svenska regeringen uppmanades att omedelbart åtgärda rättssäkerhets­brister. Men i stället gick riksdagen i rakt motsatt riktning när man i november 2021 i stället röstade igenom en utvidgning av FRA-lagen. Den här ändamålsglidningen som sker med massövervakning är ett stort problem och borde intressera inte minst journalister. När man väl infört ett massivt system som ska övervaka vår kommunikation är det enkelt att när som helst byta ut filtret. Det går fortare än att säga grundlag. Journalister som värnar om sina anonyma källor borde till exempel vara oroliga. Låt oss vara tydliga med detta. Redan vid ett införande av lagen i befintligt skick innebär det en stor kränkning av alla EU-medborgares integritet. Den här typen av AI-system är mycket trubbiga och kommer att filtrera fram familjers semester­bilder från stranden, video­samtal med nätläkare, intima sms mellan partners och konversationer från dejting­appar. Det riskerar dels att dränka polisen i sorterings­arbete och ta resurser från att jaga dem som skapar den här typen av material, dels finns det en uppenbar risk att människors mest intima (helt lagliga) bilder hamnar i fel händer. Men det största problemet är inte de direkta konsekvenserna, utan vad som väntar i nästa vända. Vi kommer att börja själv­censurera oss själva. I första hand kommer det innefatta sådant som vi tror kan fastna i det här filtret. När glidningen i vad som massövervakas flyttas, när vi bara kan ana vem som övervakar vår kommunikation och med vilken agenda, då kommer vi att ändra vårt beteende utifrån det. Och så nöts ett samhälles demokratiska funktioner ner. Installerar vi den här typen av bakdörrar är det bakdörrar där friheten sakta sipprar ut. Om vi inte vill försöka stänga dem när det är full storm, då gör vi bäst i att aldrig öppna dem. Sverige är för stunden ordförande i EU:s ministerråd och till slut ska både Sveriges EU-parlamentariker och Sverige i ministerrådet rösta i frågan. Vi kommer att skicka brev till inblandade politiker och uppmana dem att rösta nej. Och om någon annan skulle öppna och läsa breven längs med vägen bryter den personen mot den posthemlighet som finns reglerad i Sveriges grundlag och påföljden kan bli upp till två års fängelse – en något annorlunda syn på integritet än den som kommer till uttryck i lagförslaget Chat control. Mullvad VPN'''
