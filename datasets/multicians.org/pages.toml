["https://multicians.org/corby.html"]
title = "Corby"
description = "In honor of MIT Professor Fernando Jose Corbato, father of Multics."
full_description = '''Jerry Saltzer and Corby at a celebration in the Project MAC conference room in 1968. Corby always wore a bow tie, and white shirts and ties were standard office uniform then. You can see Mary Thompson, in her F&T hat, to Corby's right. Professor Fernando José Corbató, known to everyone as Corby, was the leader of the Multics development project at MIT Project MAC from its beginnings in 1963 until the mid-1970s. He died in July 2019. New York Times obit. MIT News Article. A memorial gathering was held at MIT on November 4, 2019, attended by many Multicians. I had the honor of working for Corby on CTSS and Multics development in the 1960s. This note is about my personal experience with his contribution to CTSS and Multics. See Corby's own home page and the 1991 CACM interview for more biographical information. There is also a biography of Corby in JAN Lee's Computer Pioneers. Corby was interviewed by John Fitch for MIT Science Reporter On WGBH-TV Boston on May 9, 1963. The program aired on WGBH on May 16, 1963. He demonstrated CTSS running on MIT's 7090. Corby convinced others to do things the way he envisioned. In the process, he inspired intense devotion to the project and to himself. He was a true gentleman; he never raised his voice to anyone, and he conveyed the utmost regard for each team member. We strove intensely for his approval. Some of his management philosophy is chronicled in "A Managerial View of the Multics Development." One thing I liked about working for Corby was that I knew he could do my job, if he wanted to. Everybody felt this way. He might not have all the details of a particular situation, but once he found them out, he could program as well as the best. There was a staff meeting for the whole project every week. Tuesdays at 11:00. (As I remember this time was chosen carefully: you want to have the meeting as early as possible in the week so that people could get new directions and go in the right direction as much as possible. But you can't have the meeting on Monday, not enough time to get all the facts. 11:00 was chosen because many folks didn't get in early in the morning; also starting at 11 gave people a strong reason to finish promptly at noon, so they could have lunch.) The staff meetings had an invariable format: Corby talked for 30 minutes, summarizing each team's accomplishments and describing the next step. Lots of times we all knew just what he was going to say, and yet it was still important to hear about progress from him, and to get his interpretation of the significance of various milestones. The last 30 minutes of the staff meeting were devoted to a technical talk by some team member, educating the rest of the team about a design or a new tool.'''
year_published = 2019
year_updated = 2019
