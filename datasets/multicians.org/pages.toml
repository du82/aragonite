["https://multicians.org/multics-news.html"]
title = "Multics News"
description = "News about Multics."
full_description = '''It has been done. You can download an open source DPS8M simulator for Multics and install it on a Windows, Macintosh, or Linux machine, and run your own copy of Multics on a simulated mainframe. (8/18/23) You can request a Multics account on the simulated Gold Hill Multics by sending mail to Eric Swenson. This site is always running the latest software -- it is the integration site from which he produces new releases of Multics. It is currently running MR12.8. The Computer History Museum in Mountain View, CA, USA has the hardware for the DOCKMASTER system on "permanent loan" from the National Cryptologic Museum. The hardware is not on public view, but you might be able to arrange a tour. (07/02/24) The former Living Computer Museum in Seattle, WA, USA had a 6180 maintenance panel connected to a simulated Multics. You could watch the lights blink. The LCM's Multics artifacts have been granted to the Super Dimension Fortress in Tukwila WA. Bull HN has made the entire source of Multics available "for any purpose and without fee" at MIT as of November 2007. A GitHub source code repository is online, so you can clone the entire source of Multics to your computer. Source for a few programs is available at this site, cross-referenced to the Glossary. Probably. The main issue I see is how to provide the features of 6180 segments that user programs depend on. Several projects were started to try this in the 80s, as described on the Multics History page. None of these projects finished. Porting Multics would be a big job, and the final product would need further development to match the current state of the art (e.g. web browsers, JPG editors). Paul Green says, "I think it would be easier to try 'improving' existing technology than to resurrect Multics itself." Jul 2021: Multics Release 12.7 GitHub source code repository from Dan Cross and Doug Wells for use on the Multics Simulator was released. July 2019: Professor Fernando J. Corbató passed away on July 12. A memorial event was held on Nov 4 2019 at MIT.'''
