["https://multicians.org/site-cisl.html"]
title = "Multics Site History: CISL"
description = "History of the Multics operating system installation at Honeywell Cambridge Information Systems Laboratory 1974-1986."
full_description = 'The Multics contract was signed in 1964, and General Electric committed to contribute programming resources to the joint Multics OS development project. In June 1964, the MIT Project MAC Multics team moved to the fifth floor of the new 545 Technology Square "Alpha" building. In 1966, GE set up the Cambridge Information Systems Laboratory (CISL) on half of the seventh floor of the Tech Square building. Al Dean was the original manager, reporting to Ed Vance in Phoenix. CISL made major contributions to the success of Multics by taking over EPL support and creating the Version 1 and Version 2 PL/I compilers. The Documentation group at CISL produced many software manuals for each Multics release. CISL developers used the MIT 645 for development runs until about 1974, when CISL got its own 6180. In 1969, CISL moved to the third floor of the new 575 Tech Square "Beta" building across the courtyard. In 1970, GE sold its computer business to Honeywell (the "merger"), and CISL became a Honeywell location. About this time, the late Charlie Clingen became the manager of CISL. Project MAC and GE/Honeywell staff used the MIT 645 Multics service for programming, documentation, and mail. In the 1970s, several people from MIT joined CISL, including Jim Mills, Steve Webber, Noel Morris, Paul Green, and Tom Van Vleck. Major CISL projects in the 1970s included improving the scheduling, virtual memory, system security, and storage systems, and projects with Honeywell Engineering in Phoenix on Multics hardware plans and support, including designing and implementing Multics for the new model 6180 Multics machine, and assisting with Honeywell marketing and customer benchmarks. In 1980, Charlie Clingen moved to Phoenix, as Manager: Multics Development Center, and John Gintell became Manager: Multics System Development and led CISL. The CISL group made major contributions to the B2 security project, the Multics Data Management facility, and many communications protocols. The CISL machine was moved to the Cambridge Center building in Kendall Square when CISL moved there in 09/83. Multics development was canceled by Honeywell in July 1985, and CISL was closed. Some CISL personnel transferred to Honeywell Billerica to work on the Opus project.'
