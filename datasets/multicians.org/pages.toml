["https://multicians.org/history.html"]
title = "Multics History"
description = "History of the Multics operating system."
full_description = '''See the Site Timeline for a chart of Multics sites by date. For a list of significant Multics dates, see the Multics Chronology. A 1989 ACM talk by John Gintell on Multics history is available on YouTube and the slides are available as a PDF. Multics (Multiplexed Information and Computing Service) is a mainframe time-sharing operating system begun in 1965 and used until 2000. It was designed to be a prototype computer utility system that would serve the computing needs of many different users with different goals. "Multiplexed" explicitly referred to the design practice of serially sharing access to hardware and software resources among users, to take advantage of "economies of scale:" per-system overheads could be spread over multiple users. This approach led to the design of an operating system that shared machine resources efficiently and provided a rich set of software features and programming tools in order to reduce users' cost of program development and maintenance. A simulator for the Multics computer is available for download, and there are public simulaor sites offering Multics accounts. Multics design was started in 1965 as a joint project by MIT's Project MAC, Bell Telephone Laboratories, and General Electric Company's Large Computer Products Division. Professor Fernando J. Corbató of MIT led the project. Bell Labs withdrew from the development effort in 1969. In 1970 GE sold its computer business to Honeywell, which offered Multics as a commercial product and sold dozens of systems, until its cancellation in 1985. The design team's intention was that Multics would develop into a prototype information utility, as described in MIT Prof. Martin Greenberger's 1964 Atlantic Monthly article, "The Computers of Tomorrow". As part of this vision, Multics was intended to provide interactive access to many remote terminal users simultaneously, in a manner similar to MIT's CTSS system. Multics combined ideas from other operating systems with new innovations. Security was a fundamental design requirement, in order to meet the utility goals. The team's ambition was that Multics would change the way people used and programmed computers.'''
year_published = 2025
year_updated = 2025
