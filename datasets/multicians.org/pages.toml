["https://multicians.org/site-mainz.html"]
title = "Site History: Johannes Gutenberg Universität Mainz"
description = "History of the Johannes Gutenberg Universität Mainz Multics installation."
full_description = "Zentrum Für Datenverarbeitung Johannes Gutenberg-Universität Mainz Anselm-Franz-von-Bentzel-Weg 12 55128 Mainz, Deutschland [Bernd Ulmann] Application areas were mainly research projects. I know that the chemistry department did research in crystallography on the machine, the mathematicians did some work on number theory (me) and numerical algorithms on the DPS 8 as well. I remember one of the professors for numerical mathematics who did quite some work on that machine: Prof. Dr. Claus Schneider, the number theorist was Prof. Dr. Gerd Hofmeister (but the programming was done by his students IIRC). The department of meteorology also did some work on the DPS 8, that was Mr. Wawers, who is already mentioned in the user list. Dr. Joachim Pense was from the mathematics department, Jörg Knappen was a physicist. I also know that some work on the Frobenius problem in number theory was done on the Multics machine. but I don't know about any particular publications. Thomas Blesser (F77 scientific programming and data visualization, Wordpro typesetting) Prof. Dr. Gerd Hofmeister (Mathematics) Jörg Knappen (Physics) F77, PASCAL programming Gerald Krummeck (Port of EGS (Erlanger Grafik System), benchmarks) Joachim Pense (Mathematics) CERNlib Implementation, Musical Score Analysis Beate Ritzert (F77 numerical modelling and data visualisation) Prof. Dr. Claus Schneider (Mathematics) Rainer Schöpf (Physics) REDUCE Roderick Schupp (Emacs, Pascal compiler, TeX) Alex Steubinger (tutored Multics and Cobol course) Bernd Ulmann (Mathematics) Number theory Theo Wawers (Meteorology) [deceased] Here are 29 photos of the Mainz machine room, thanks to Bernd Ulmann. The Gandalf box contained computer-room modems for each FNP channel. User terminals each had a Gandalf modem. These photos were probably taken in 1991. [Bernd Ulmann] When I started studying mathematics at the Universität Mainz the most fascinating institution was the Center for Data Processing which owned a Honeywell-Bull DPS-8 mainframe running Multics. Since I have been crazy about large computers since my first contact with a Nixdorf 8870 when I was 14, I had to gain access to this machine - no matter what I had to do for this."
