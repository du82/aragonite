["https://multicians.org/site-cno.html"]
title = "Multics Site History: CNO"
description = "History of the Multics operating system installation at Honeywell Corporate Network Operations in Minneapolis."
full_description = '''[Phil Dreyer] It was installed in the main building and moved to "Plaza South" after that addition was completed. [Cec Erickson] The decision to get Multics in Minneapolis was made in January 1978 and the CNO system was up and running in February 1979 with over 400 registered users and 70 projects. (CNO customers were using the Phoenix system first and then we transferred their work to CNO system. As an interesting aside, when we shut down the CNO system in December 1986 there were over 3000 registered users that we had to migrate to other systems and, oh by the way, to the best of my knowledge NONE of them migrated to a GCOS system....) Two DPS8 CPUs, 4 MSU0501 disk (1 GB each), 13 MSU0451 disk (150 MB each), xx tape drives, printer, card reader & punch. [Phil Dreyer] It actually started out with three L68's, but was later replaced by 2 DPS8's. The system moved to Plaza South sometime in the summer of '83. I started working at Corporate in February of '83 and helped move the system to Plaza South. [Ed Sharpe] The original machine had L68 processors and only the 451 disks (I think there were more than 13). It also had 2-3 FNPs (DNSxxxx) connected to a bank of dial-in modems (300bd and 1200bd). There was also an X.25 connection which a few used. [Ed Sharpe] We also had an ARPANet connection. I recall the IMP and a 9600baud modem. I believe our link went to an IMP in St Louis or Omaha, can't recall. (Connection via ABSI to 10.1.0.94, 129.30.1.1 [RFC 848].) [Phil Dreyer] Our ARPANet link went to the University of Wisconsin at Madison. I remember as I had to fly there once to replace the modem. I don't remember the model of the modem, but it was the size of a suitcase. If I ever saw a picture of it again I could tell you the model. [Ed Sharpe] The upgrade to DPS8 I believe happened with the move to the south building. (I.e., stand up the new machine, making the "move" a restore of backup tapes to the new system). Dave Jordan I remember solving an operator support problem. The Multics operator's console was located some distance from the GCOS console(s?) and, since Multics generally ran without much operator support, they didn't come by to check on it very often. I ended up going to Radio Shack and buying a twirling red (I think) party light. One of the FEs hooked it up to the alarm(?) signal on the Multics console and ran it over to the GCOS area, so when requests came up on the Multics console the light started flashing and the operators knew to go look.'''
year_published = 2025
