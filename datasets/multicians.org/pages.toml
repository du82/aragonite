["https://multicians.org/memorabilia.html"]
title = "Memorabilia"
description = "Trinkets and keepsakes from the development of the Multics operating system."
full_description = '''We had T-shirts. Rick Kissel's is a Multics Man shirt. Katie's says "Multics Keeps It Up Longer". Multics Picnic, July 1979. (Click for a larger view.) THVV I designed (executed) the Multics t-shirts. I did the Phx marketing t-shirt displayed by Sue Bender, as well as Multics Keeps It Up Longer and Steve Webber as Multicsman. I based the t-shirt drawing on Kenney's Multicsman comic. But in my version, it was a cartoon portrait of Steve Webber. My version of Multics man looked like Steve, because I knew Steve. David Rollow Sue Bender, Liz Mullen, Kay Kaiser: Their shirts read Save Honeywell, Buy a Multics on the front, and Save Multics, Buy Honeywell on the back. (Click for a larger view.) THVV Multics Time Sharing shirt, design by Angus Macdonald, photo by Janet Dent. (Click for a larger view.) Janet Dent Susan and I were going through some boxes of old clothes, etc., and came across this item, which I took a picture of. It was given to us by the PMDC folks when our first son Michael was born in July of 1980. (The phone is there to show the relative size and as a shameless plug for my current employer.) Multics didn't last long enough for Mike to become a Multician but he spends a lot of time with Linux and is employed as a network analyst with Global Crossing. (Click for a larger view.) Paul Benjamin My geek daughter (she is a college prof with a S.O. Comp Sci PhD who works at Lawrence Livermore) asked for this T shirt for Christmas. The best part of this was that she wanted to more clearly understand my role on Multics. Her strongest memories were of my Model 37 TTY clacking away in the family room in the evenings. I was running Barry Wolman's hog so periodically the answerback drum would be fired up to simulate an interactive user rather than someone just using the PL1 compiler. Anyway, we had a really pleasant conversation back and forth while she took notes. It brought back a lot of very pleasant memories for me. (Click for a larger view.) Dick Snyder Honeywell Information Systems had an advertising campaign in the early 70s which consisted of photographs of sculptures of various animals, made out of electronic parts. The animals were associated with various Honeywell computers. Since the totem animal of MIT is the beaver (it's on the class ring), they made a beaver to associate with Multics. Marketing also gave away nice heavy little pewter paperweights that represented the sculptures. (The eagle, representing FSO, was highly prized.) If you look very closely you can see the resistors and so on that the beaver's original was made of. They handed these out at the legendary appreciation dinner for the Multics developers in Boston in 1973 with some little card thanking the Society Of Beavers.. we wondered if that was a dig.'''
