["https://multicians.org/site-prha.html"]
title = "Multics Site History: PRHA"
description = "History of the Multics operating system installation at the Puerto Rican Highway Authority, San Juan, PR."
full_description = '''[Stanley C. Kitching] Although Santurce is in the heart of San Juan, it is a very distinguished and separate community unto itself of which the natives are rightfully proud ... Administration, Education, Payroll, Planning, Social Services, etc. as well as Highway Engineering ... I only know the PRHA site from the time I spent there, 1978-1981 ... Through Junte de Plannes, the Planning Department, we developed a very nice MRDS data base system with an integrated data dictionary that provided a standardized data processing and planning environment for the ENTIRE Puerto Rican government ... That was no easy chore, but it worked in the end due to some extraordinary programming by Cousin Efrain Rios who provided the routines necessary to convert the data files from ANY other platform that the PR government had to Multics ... This project was deemed InfoSystem and I worked with a company called Planning Research Corporation International to do the design and development ... [Ron Riedesel] I recall that we had a minor gaffe on the proposal to the PRHA, when, in the cover letter from Pin Pin to Luis Aparicio, we accidentally spell-checked the following "...Honeywell Information Systems, Inc. is pleased to propose this turkey system..." (sic, "turn-key") and (we're not through yet) "..upon award of this purchase, we will be pleased to enter into controversial negotiations with the Puerto Rican Highway Authority.." (sic, "contractual negotiations"). We had some drinks with Luis Aparicio at the Condado Lounge after explaining the errors in the cover letter, and he said (in his heavily accented English) "That's a relief, after reading that thing about 'controversial negotiations', I was beginning to think it would be easier to buy from Burroughs" . [Ron Riedesel] I also recollect that, after we were awarded the contract, the IBM Branch Manager in San Juan was fired (the PRHA system was the largest computer system on the island, at that time), and Luis Aparicio told us he'd started carrying a firearm in his car, after receiving telephoned death threats at his home in the middle of the night (for having chosen to leave IBM). It was a small computing world in those days.'''
year_published = 2003
