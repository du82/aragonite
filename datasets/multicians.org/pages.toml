["https://multicians.org/about-multics.html"]
title = "About the Multicians Website"
description = "About the Multicians website."
full_description = '''The Multicians web site presents the story of the Multics operating system for people interested in the system's history, especially Multicians. The site's goals are to This website contains information about the history and features of the Multics operating system, including historical narratives and tables, an extensive bibliography, a list of contributors, a Multics Glossary, conference papers, articles, stories and humor, source code, internal documents, and pictures of Multicians and Multics machines. The Multicians web site has benefited from the contributions of many authors. Contributions are invited: if you have a correction, fact, date, name, anecdote, or picture, please share it with Multicians everywhere by sending mail to the editor. Tom Van Vleck is the editor of this site. A log of changes to the site is maintained: it lists 2183 updates since November 1994, when the site was first published. The 487 pages on multicians.org are organized into 6 categories. Each page's menus use the same structure and navigation elements. Multicians may submit their mail addresses to a protected database, and a facility is provided to forward messages to those addresses without exposing them, for spam protection. To sign up, use the form at the top of multicians.html. To send mail to a Multician, look them up in multicians.html and click "MAIL". An RSS feed describing the last 5 changes to the site is provided on the home page. Please do not read it every few minutes. It only changes a few times a month. Feb 2024: Hacker News had a thread discussing "It Can Be Done" led to 344933 hits in one day. Site performance was fine. Dec 2022: Moved the hosting of multicians.org to an all-SSD virtual private server, price about the same, better bandwidth limit. Aug 2021: Problems with DNS at Pair Networks broke the site and bounced email on 08/17/21 for several hours. Appears to be fixed. Dec 2019: Because Yahoo eliminated support for its "groups" service, we moved the multicians mailing list to groups.io. All members of the Yahoo group were added to the new group, and all photos and files saved. The message archive going back to 01/03/2015 was preserved. (Unfortunately, a few messages had files attached, and these did not transfer.)'''
