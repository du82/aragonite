["https://multicians.org/site-afdsc.html"]
title = "Multics Site History: AFDSC"
description = "History of the Multics operating system installation at the US Air Force Data Services Center in the Pentagon."
full_description = '''2 were unclassified (T & X). T & X could be run as a single system or split to be 2 separate systems. System Z was brought operational soon after I got there in 1983. Sys X came along sometime around 1986. [CDT] Big Consistent System users. Lots of database-type work. Financial chartsy-graphsy applications, budget analysis, program analysis and evaluation. Air combat simulations and their graphical interpretation. Lots of "critical reports for the Secreta ry." [John Ata] The following AF personnel worked on Multics and were fairly knowledgeable about the OS (more so than some Site SAs): Umar Khan said he was a "Master Multician" in the Pentagon from 1982 to 1990 in a 1993 USENET posting. [Eric Swenson] I looked at this page, and noticed that absent was any mention of quite a few of the AF personnel who maintained the 6 Multics systems we ran. Some of the people I remember are: We all worked there when Major (Dutch) Blake was in charge of systems maintenance and system administration. The Wartime Manpower Programming System (WARMAPS) was designed and implemented by General Research Corporation starting in 1978. It is described in a final report and in Wartime Manpower Planning System (WARMAPS), ADP System Users Manual, DOD 1100.19-M. [Jim Densmore] I was on the TAC BRAWLER team at AFSA. We didn't just run graphical interpretation programs. We ran the simulation programs themselves on Multics as well. The over 200,000 line FORTRAN program that ran at that time was eventually ported to many machines using ANSI standard FORTRAN 77, and is over 500,000 lines now. Because of the object-oriented technology we had in play at that time (though we certainly didn't call it that), the program is still in use and still quite maintainable. [CDT] I once had a GSA security guard storm into the terminal room with his gun pointed at me when the "BEL" beeper on a Tektronix 4014 got stuck on. Does that count? [CDT] The operators were relatively untrained. One noticed disk errors from a certain drive two days in a row in the early afternoon. He logged them for the FE without bothering to go into the next room to check out the drive. When the FE arrived to run tests on the drive, he noticed fiberglass dust all over the room from the ceiling repair work -- except for two clean shoe-shaped areas on top of this particular drive. The contractor was standing on it and drilling into the ceiling.'''
