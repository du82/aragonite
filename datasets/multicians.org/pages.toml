["https://multicians.org/site-dockmaster.html"]
title = "Multics Site History: DOCKMASTER"
description = "History of the Multics operating system installation at the US National Security Agency."
full_description = '''US National Security Agency, Linthicum, Maryland (at the Friendship Annex site) to support the mission of the National Computer Security Center. DOCKMASTER's hardware is now the property of the National Cryptologic Museum, and is on permanent loan to The Computer History Museum. Eugene Miya was instrumental in arranging this loan. The DPS8/70M hardware (minus the HDAs for the hard disks) arrived in Mountain View, CA at the end of June 1999. For more information about the current state of the DOCKMASTER hardware and the Computer History Museum's plans for preservation and display of Multics artifacts, please contact Dag Spicer, the Curator & Manager of Historical Collections, The Computer History Museum, at +1 650 810-1035. Ed Thelen has a page about the DOCKMASTER machine with a picture. 3 DPS8/70M CPUs, 2 IOMs, 3 DN355 front-end processors, 8M 36-bit words MOS memory, 4 MW paging device (bulk store), 3 MSU451 disk drives, 22 MSU501 disk drives, 3 tape drives, 2 printers, ARPANet connection (ABSI). [Les Gotch] DOCKMASTER's major responsibility was to serve as a resource facility for Computer Security. It provided many services including electronic mail and forum for the NSA, its vendors, academia, and other government agencies. One of its missions was to provide assistance in the evaluation of commercial products using the Trusted Computer System Evaluation Criteria (Orange Book). The Department of Energy Electronic Resources for Security Related Information published in 1994 says: DOCKMASTER is a (Multics-based) subscription service of the National Computer Security Center (NCSC), that they consider an "Information Security Showcase." Its large repertoire of available services (its users manual is over one hundred pages) includes E-mail, electronic bulletin boards, and allows hands-on software evaluation. Its Evaluated Products List rates computers and computer security products. Users can access online documents (such as the Orange Book), participate in online discussions, and learn about computer security conferences. Users can connect to DOCKMASTER through MILNET (part of the Internet), TYMNET (a packet switching service), and local dial-in. A registration packet may be requested by writing to NCSC, Fort George G. Meade, MD 20755-6000, Attn: DOCKMASTER Accounts Administrator. Note that Federal employees are "User Type 3", contractors are "User Type 6" and the project should be "Catwalk" unless you were specifically assigned another one.'''
year_published = 2012
