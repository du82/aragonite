["https://multicians.org/m-webguide.html"]
title = "Design principles for the Multicians Web site"
description = "Maintainer information for the Multicians website."
full_description = 'The Multics website was begun by Tom Van Vleck in 1994, as a way to display the content of the FAQ files for the USENET group alt.os.multics on the new World Wide Web. After almost 31 years, the website has grown to 487 HTML files comprising over 540K lines, 670 graphic images, and 1795 PDF files, thanks to the contributions of many Multicians. This page is a guide for editors of the Multicians web pages. The multicians.org web site can be hosted on a basic web server, such as Apache. The site is implemented with static web pages and graphics, and can be viewed with modern web clients on a range of devices. Since 2001 multicians.org has been hosted at Pair Networks Inc in Pittsburgh PA. At various times, mirrors of the site have been hosted on other web servers: when trans-Atlantic web speeds were low, Dave Vinograd arranged for a site mirror at City University London from 1995 until 2002; Paul Green mirrored the site at an FTP server at Stratus.com from 1995 to 2017; and jason andrade mirrored the site at Planet Mirror in Brisbane AU from 2003 to 2008. None of these mirrors are currently active. AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript text/xml application/javascript # 48 months for things that never change <filesMatch "(favicon.ico|multics-redblack50x50.gif|pdf5.gif|clearpix.gif|tinyglob.gif)$"> Header set Cache-Control "max-age=29030400, public" </filesMatch> # 24 hours for things that rarely change <filesMatch "(sliderpack.jpg|mxstyle.cs)$"> Header set Cache-Control "max-age=28800, public" </filesMatch> Use of MySQL. Data that is presented in multiple ways is stored on the source computer in a text .sql file that drops and re-creates one or more MySQL tables. This approach means that the at-rest version of the data on the source computer is in text files, not MySQL; thus, reinstalling MySQL or the operating system need not dump and restore the database. It also makes it easy to change table definitions if new columns are needed. About 15 SQL tables are used to generate the site. I currently use version 8.0.32 on my Mac (as of Ventura), and MariaDB on Linux.'
