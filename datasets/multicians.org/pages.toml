["https://multicians.org/project-mac.html"]
title = "Project MAC"
description = "The history of MIT Project MAC, 1963-2014."
full_description = '''This article describes MIT's Project MAC, the organization that led the initial creation of Multics. This is not a comprehensive history of Project MAC: my goal is to provide context and motivation for Multics history, and to provide accurate statements and references for deeper investigation. (The author was a part-time undergraduate programmer and then a research staff member at Project MAC during its first seven years.) MIT's first digital computer, Whirlwind, was built at MIT after World War II, for the US Navy and Air Force. The MIT Libraries has a collection of historical material about the computer. Whirlwind began as a project for the US Navy to create a digital flight simulator for bomber crews. It was then adapted for realtime use, processing air defense radar for the US Air Force. Computer core memory was first developed for Whirlwind by Jay Forrester. MIT had a tradition of cooperation with the US government. Members of the MIT faculty and administration served on government commissions and boards, and MIT professors, staff, and students did government research, in peacetime as well as wartime. Joseph C. R. Licklider, who had created a psychology group in the MIT Electrical Engineering department, was involved in the beginning of MIT Lincoln Labs, which undertook US Air Force projects on air defense in the 1950s. Licklider's group found that analog computing was not adequate for brain modeling, and became interested in digital computing. Licklider left MIT in 1957 to join the research firm Bolt, Beranek and Newman (BBN), where he fell in love with computers. He learned to program a Digital Equipment PDP-1 and used it in his research and other activities. This led to his writing his history-making paper "Man-Computer Symbiosis" in March 1960 [lick-sym] MIT users of Whirlwind became a community of researchers interested in computers. Whirlwind was supported by the US government, but not classified; MIT's Lincoln Laboratory carried out classified projects using it. The TX-0 computer was a conversion of the Whirlwind design from vacuum tubes to transistors, begun in 1955 at MIT Lincoln Laboratory. TX-0 was "loaned" to the MIT EE department in 1958, and housed in MIT Building 20. The machine continued to be modified. It provided direct conversational access to the computer for researchers and students. [jbd-inter]'''
