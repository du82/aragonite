["https://multicians.org/multics-source.html"]
title = "Multics Source"
description = "How to peruse the source code for Multics, 1989 to the present."
full_description = '''Multics development began at MIT, GE and Bell Labs in 1966, using MIT's CTSS as the source repository. Early versions of the source were not preserved. When Multics became self-hosting in 1967, the development repository was on the MIT Multics machine, and system releases were named MSS, Multics Standard System. After Multics became a Honeywell product in 1973, standard "MR" release numbers were assigned by the Phoenix Multics Development Center, which maintained packaged and shipped releases from its development repository. Here is a brief history of source related events: see the History page for more. The DPS8M simulator is available for download from GitLab. It simulates a Multics system on Windows, macOS, or Unix. (2023) Multics Release 12.8 is now available for use on the simulator. This release is based on the Bull software, with changes to fix bugs and enhance usability. Eric Swenson was the release coordinator. Changes are discussed on the SourceForge mailing lists dps8m-users, dps8m-developers, and on the Multicians mailing list. (2021) Dan Cross and Doug Wells created a Release 12.7 GitHub repository for the release. This archive was created by Doug using mxload; it replaces Multics archive files with subdirectories. You can easily download the entire source of Multics to your own computer. (2022) Adam Sampson created a repository on GitLab with the sources of all releases we've been able to locate. This Multics History Repo was constructed by parsing the history comments in source files automatically converted to Git commits. See https://gitlab.com/atsampson/multics-history-repo for details. You'll get the head (e.g. MR12.7) checked out and in your directory. This will download about 170 MB of source files. Each original .archive file will be represented as a directory of files. Gary Dixon I still prefer to look at Multics source using Multics tools on a simulated Multics. Availability of library_pathname (and library descriptor tools in general), peruse_crossref, print_bind_map, plus ability to recompile sources to get full object listings are big advantages for investigating any serious questions.'''
