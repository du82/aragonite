["https://multicians.org/articles.html"]
title = "Technical Articles About Multics"
description = "Technical articles about the Multics operating system, from 1965 to 2002."
full_description = 'See Stories for 87 stories about Multics and Papers for 46 published conference papers about Multics. "The GE-635s at Project MAC and BTL" Using the GE-635 in early Multics development. (Tom Van Vleck, 03/23/24) "Execution Environment" The execution environment for Multics programs. Hardware architectural support and system conventions. (Tom Van Vleck, 06/09/24) "Multics Failure Recovery" How Multics recovered from hardware and software failures. (Tom Van Vleck, 08/07/24) "Communications and Networking" The evolution of Multics communication and networking facilities. (Tom Van Vleck, 05/26/24) "B2 Security Evaluation" The history of Multics security features and the NCSC Orange Book security evaluation of Multics in the mid-80s. (Tom Van Vleck, 11/14/24) "Software Development Process History" History of the Multics software development process. (Tom Van Vleck, 04/19/24) "PL/I" The history of EPL, Version 1 and Version 2 PL/I, as well as related topics. (Tom Van Vleck, 10/06/24) "The Multics Scheduler" Three generations of Multics scheduling algorithms. (Bob Mullen, 25 Jan 2016) "The B2 Final Evaluation Report" Report on NSA Evaluation of Multics security. (Tom Van Vleck, 28 Apr 2015) "Multics Bootstrap Loading" The evolution of Multics bootstrap loading and BOS. (Tom Van Vleck, 01 Mar 2013) "Multics and Hyperchannel" A project at ASEA to connect Multics to Modcomp computers via Hyperchannel. (Olin Sibert, 19 May 2004) "Record Stocks and the Physical Volume Scavenger" Record Stocks in Multics. Pages are allocated to segments so crash recovery is safe and fast. (Olin Sibert, 19 May 2004) "Multics Library Processes and Tools" How Multics source and object libraries were managed. (Olin Sibert, 24 Apr 2006) ""And They Argued All Night..."" The history of the Internet. An article for Matrix News. (Mike Padlipsky, 2000) "The New Storage System" 1975 project to replace the file storage system. (Tom Van Vleck, 12 Feb 1995) "Multics Virtual Memory - Tutorial and Reflections" Summary of the Multics virtual memory design. (Paul Green, 1995)'
