["https://multicians.org/site-nwgs.html"]
title = "Multics Site History: NWGS"
description = "History of the Multics operating system installations at the US Naval War Games System."
full_description = "Software was developed for this application at a CSC development site: SDF - Software Development Facility, Moorestown NJ Software was maintained and upgraded at the Software Support Activity (SSA) site at the U.S. Naval War College, Sims Hall, Newport, RI. A 2 CPU Level 68 System. This system was originally the ONLY system, installed at the Naval War College in Newport, RI. When the War College upgraded to DPS-8/70s, the SDF got the old Level 68 as a development machine for ENWGS. A 2 CPU DPS-8/70 System. This system was used for software debug and testing activities related to the delivered systems (NWC, TTGL, TTGP). This site was controlled by CSC as an on-site support facility. The KST was upsized from 1024 to 1536 by CSC programmers (Robert Matern) in order to support the ENWGS software. Probe was also modified to access the enlarged KST, and add a few unique commands for ENWGS. The lp driver was modified to add optional line numbers to print listings (change done in ALM)! The KST change and all the other modifications were eventually installed at all ENWGS sites. Original Level 68 system supported 64 ICCU Workstations (PDP-11/04 SBC with Sanders Graphic-7 (G7) non-raster display). Upgraded to a 2 CPU DPS-8/70 System that supported 64 SMS Workstations (Intel 286 with Multibus running iRMX-86 OS) and later WISC Workstations (Intel 386 with ISA running iRMX-286 OS). This system was used for actual War Gaming using ENWGS. It had more memory, and a different configuration due to the need to support more X25 networked workstations than the other sites. This system was the last to shut down, in 1996. The NWC system also had twice the disk storage to support more and larger wargames. The only 2000 track wargames (the annual GLOBAL games) were played on the NWC system. Those games may have dozens of carriers, and hundreds of ships, subs, and aircraft. A 2 CPU DPS-8/70 System -- this system was used for actual War Gaming using ENWGS. A small system, only 20 workstations, with 8 more connected via remote link at Little Creek."
