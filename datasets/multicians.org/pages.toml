title = "Build process for the Multicians Web site"
description = "Maintainer information for the Multicians website."
full_description = '''These are my notes on the site building machinery, including usage, internal details, and possible future improvements. Rules for maintenance and content of multicians.org are in Web Site Design. Detailed instructions for maintenance tasks for multicians.org are listed in Maintenance tasks for the Multicians Website. The multicians.org website is built on the site editor's computer from HTMX source using Unix tools and the open source program expandfile, and served by one or more web host computers. Expandfile is available from github. The DNS A records for https://multicians.org specify that web requests are sent to a Virtual Private Server (VPS) at the Information Services Provider (ISP) pair.com. The VPS serves pages using a web server. Hosting at Pair costs me money every month. I think it is worth it: they have good uptime, multiple backbone connections, good bandwidth, and keep Ubuntu Linux updated with security fixes. The HTML pages are created at compile time from HTMX source and configuration files. Local SQL databases are used to build some HTMX source into HTML at compile time offline. expandfile is also used to build some HTMX files in from the local SQL database, e.g. the bibliography. I do not leave data in SQL overnight. (Old prejudice from the 80s.) The tables are small, reloading from text is quick, and schema changes are easier. There are about 25 tables, stored in text files, which the Makefile loads into MySQL if they have changed. About 71 SQL queries are used to build the site, mostly in the bibliography files. (The text files define column names that are used in SQL queries in the HTMX source; these must match.) The mail host is a web server specified in the MX record for multicians.org. It could be a different server from the one that serves multicians.org. Site visitors may invoke a FORM to send mail to a registered Multician. The form's ACTION specifies a Multicians mail-sending CGI that runs on the mail host. Sending mail using the form requires the sender to answer a "spam excluder" challenge. the CGI looks up the Multician's name to obtain a hidden external mail address, and sends the message to the Multician. The mail host checks that every message being sent is not spam, and enforces rate limits. SPF, DMARC and DKIM are configured on the mail host for multicians.org mail.'''
year_published = 2025
year_updated = 2025
