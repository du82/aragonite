["https://multicians.org/site-avon.html"]
title = "Multics Site History: Avon"
description = "History of the Multics operating system installation at Avon Universities Computing Centre, Universities of Bristol and Bath."
full_description = '''[Jonathan Marten] The configuration in August 1979, according to SWIM (South West Information Manual) document "Multics Equipment List", was: [Paul Smee] In those days [mid 1970s], the government gave each university funds to completely replace their computing equipment every 7 years, plus upgrade funding halfway through each cycle. Bristol and Bath came up for replacement at the same time (both had ICL System 4s). Prof Mike Rogers at Bristol liked Multics. Someone (probably him) initiated the idea that, rather than each upgrading separately as had happened in past, the two unis could pool their upgrade money and get something better. They agreed to do that, and went for a Multics system, which was (just) affordable if they pooled their grants. [Paul Smee] Bristol and Bath were sharing a machine, which would be physically located in Bristol since Bristol had the larger machine room (and the larger money allocation). If memory serves, Bristol owned 5/7 of the machine, and Bath owned 2/7. (That's certainly close, if not precise.) Neither site completely trusted the other, so an autonomous body, Avon Universities Computing Centre, was created to run the machine, and to ensure that each site got their fair share. (The government keeps redesigning political boundaries over here, but at the time both Bristol and Bath were in the county of Avon, which now no longer exists.) AUCC (who originally hired me) appears to have managed to keep both the partners happy. Godfrey Lance was our director. [Paul Smee] SWURCC (SouthWest Universities Regional Computing Centre) was another independent organisation, the hub of SWUCN (SouthWest Universities Computing Network). This network interconnected the University of Bristol, U of Bath, Exeter U, University College Cardiff, and UWIST (University of Wales Institute of Science and Technology). Initially this was a homogeneous network, all sites having ICL System 4 machines of various sizes. [Paul Smee] But, Bath and Bristol each also had their own Computing Services. These dealt with things like the local terminal rooms, user support, local help desks, etc. AUCC didn't deal directly with 'normal' users as a general rule, though we provided next-level support to Bristol and Bath support staff, in much the same way as HIS SiteSAs provided next-again-level support to AUCC.'''
year_published = 2005
