["https://multicians.org/site-bellcan.html"]
title = "Multics Site History: Bell Canada"
description = "History of the Multics operating system installation at Bell Canada."
full_description = "[Wilf Mandel] The Multics project started in Bell Canada as a replacement for GCOS Time Sharing System in the Dorval Datacentre which was ever more heavily used and providing poorer and poorer response time. GTSS was to provide transparency for the GCOS users rather than try to retrain the multitudes. Several people had just become available with the sale of a small datacentre (and its lone VM/370 system) to Nortel. The group included myself, James Chubb and Joe Caruso. [Julie Jackson Sibert] I was hired by Honeywell Canada to do the benchmark acceptance testing and installation for the two Bell Canada Systems. I installed both systems in the summer of 1979. There are a couple of fun stories mostly about having to be snuck into the sites in panel vans at night and on weekends to avoid the striking and picketing telephone workers. During my Bell Canada summer, I reunited with Richard Barnes, whom I had met when he came to USL on a recruiting trip. He was glad when my benchmark testing provided him with some very solid numbers to back up his compiler improvements. (I'd never seen a grown man jump up and down with such enthusiasm!) Marketing: Swan Tan, John Morrison, Julie Jackson (Sibert), Andre Allaire, Ron Brown, Doug Cooke, Stan Dylnicki, Wally Halladay, Mil Travnicek, Al Dupuis Site Analysts: Ron Faraday, Randy Pepin, Jerry Kelly, Alf Burnham, Guy DuMouchel, Mel Wilson, Stewart Putt [Joe Caruso] HIS: Roger Parsons' counterpart in HIS during contract negotiations for Multics was a fellow named Norm Kane who shortly afterwards went on to manage a Canadian Tire store I believe. Bob Mullen was one of the developers who tutored us on scheduling. Ricarda McDonald from Calgary joined us for a few weeks when we had a major system upgrade going. [Joe Caruso] Trainers: We did have a number of trainers come to Montreal to provide training. Don Mengel taught an FNP course in Montreal; I think Rafe Frommer also came to Canada to teach a course. Dorval: Case Timmer (mgr), Ian Stromberg, Sandy Bartlett, Bill Harris, Bilal Qureshi, Wilf Mandel, James Chubb, Joe Caruso, Firoz Dosani, Tom Parsons, Blair Morlock, Bill Abbott, Real Rousseau, Sultan Somani."
