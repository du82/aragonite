["https://multicians.org/index.html"]
title = "Multics"
description = "Multics was a mainframe time-sharing operating system begun in 1965 and used until 2000. It was a major influence on subsequent computer operating systems."
full_description = "The Multicians web site presents the story of the Multics operating system for people interested in the system's history, especially Multicians. The site's goals are to preserve the technical ideas and advances of Multics so others don't need to reinvent them. record the history of Multics, its builders, and its users before we all forget. give credit where it's due for important innovations. remember some good times and good people. The Multicians web site contains 487 HTML files (see the Site Map) comprising over 540K lines, 1795 PDF files, and 670 graphic images. The site has benefited from the contributions of many authors. Contributions are invited: if you have a correction, fact, date, name, anecdote, or picture, please share it with Multicians everywhere by sending mail to the editor."
