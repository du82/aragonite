["https://multicians.org/features.html"]
title = "Multics Features"
description = "Features of the Multics operating system."
full_description = 'Multics (Multiplexed Information and Computing Service) is a mainframe time-sharing operating system begun in 1965 and used until 2000. It was designed to be a prototype computer utility system that would serve the computing needs of many different users with different goals. [JHS] I think that Multics was the first to provide a hierarchical file system. The influence of that innovation can be found in virtually every modern operating system, including Unix, Mac OS, DOS and Windows. The paper "A General-Purpose File System For Secondary Storage" describes the 1965 design of the file system. It evolved later, with some features being added and others removed. The original virtual memory design of Multics combined hardware-supported segmentation and paging between core, a high-speed paging drum, and disk. Later hardware improvements replaced the drum with a solid-state bulk store. The Multics paging algorithm evolved over time: section V of Multics Storage System: Program Logic Manual, AN61 describes the "clock" paging algorithm. [Tom Oke] The work done at ACTC to optimize disk performance resulted in an Adaptively Optimizing Disk DIM, in the MR11 time frame. This was the first major use of floating point within the hardcore. This disk DIM provided a tunable, load-sensitive, optimization algorithm on a per-I/O-type, per-drive basis, and provided a site the ability to use a system-wide tunable disk-queue resource pool. Optimization priority set a high (and exclusive) priority for VTOC I/O and Page Reads. Initial priority of Page Writes excluded them from competition with Page Reads, unless they were on-cylinder. This addressed the need to expedite blocking I/O and defer non-blocking I/O. As queued I/Os built up for any I/O type, on a per-drive basis, the optimizer increased the priority accorded to the nearest-seek-first algorithm, for that I/O type on that drive, and the I/O became more competitive. This recognized the significance of queue resource loading converting a non-blocking I/O into a blocking I/O.'
year_published = 2025
year_updated = 2025
