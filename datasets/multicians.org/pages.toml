["https://multicians.org/papers.html"]
title = "Multics Technical Papers Online"
description = "Technical papers about the Multics operating system, from 1965 to 2002."
full_description = '''For a complete list of documents about Multics, see the Multics Bibliography. Also see the MSPM sections available online in the Development Documents section. For more information on an author, see the list of Multicians. For explanations of Multics terms, see the Multics Glossary. Multics was described initially in a set of six papers presented at the 1965 Fall Joint Computer Conference. It's worth noting that these papers described what we thought we were going to do, and not what we ended up doing. Paper number 4, especially, describes several ideas which were revised in the light of experience. (Also see the story of how the papers were written and presented.) Glaser, E. L., J. F. Couleur, and G. A. Oliver, "System design of a computer for time-sharing applications", (32K) Daley, R. C., and P. G. Neumann, "A general-purpose file system for secondary storage", (73K, 3 figures) Ossanna, J. F., L. Mikus, and S. D. Dunten, "Communications and input-output switching in a multiplexed computing system", (46K, 3 figures) David, E. E., Jr. and R. M. Fano, "Some thoughts about the social implications of accessible computing", (26K) Ted Glaser presented "A brief description of privacy measures in the Multics operating system" at the 1967 Spring Joint Computer Conference. (10K) Bob Graham published "Protection in an information processing utility" in Communications of the ACM, Volume 11, pp. 306-312, May 1968. (434K PDF, 4 figures) Bob Daley and Jack Dennis published "Virtual memory, processes, and sharing in Multics" in Communications of the ACM, Volume 11, pp. 306-312, May 1968. (41K, 13 figures) Corby presented "Sensitive issues in the design of multi-use systems" at a technical symposium on Advances in Software Technology in February, 1968, at the opening of the Honeywell EDP Technology Center, Waltham, Massachusetts. (41K PDF) Corby and Jerry Saltzer presented "Some Considerations of Supervisor Program Design for Multiplexed Computer Systems" as an invited paper at the IFIP Congress 1968, proceedings published by North-Holland, 1968, pp. 66-71. Also distributed as Project MAC Memorandum MAC-M-372, May 1968. Review #16243 in Computing Reviews 10, 2 (February 1969). (71K PDF)'''
