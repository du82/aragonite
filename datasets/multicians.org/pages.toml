["https://multicians.org/allnight.html"]
title = "And They Argued All Night..."
description = "'The history of the Internet. An article for <cite>Matrix News</cite>."
full_description = '''{Having very belatedly discovered that I'd uploaded a damaged version of the as-written version of this one, what follows is a combination of the as-written and as-published (in "Matrix News") versions. --MAP} [Over the 15 years from 1971 through 1985, Mike Padlipsky authored over 20 RFCs. He ran the Networking Group for the Multics machine at MIT during the early years of the ARPANET, among other things. His The Elements of Networking Style remains the best book on OSI. - Ed.] Despite my stated views on the futility of "doing" technohistory, I can scarcely find it in what's left of my heart to decline Peter Salus's invitation to take a turn in his Lest They Forget/Be Forgotten series, especially since I've been itching for at least a couple of years to have an excuse to dispute various selfserving claims of Fathers of this and Inventors of that now that the 'Net is the darling of the mediaocrities. And the best place to start is almost certainly with a restatement of why I think technohistory can't be done (lifted from The Elements of Networking Style and Other Essays and Animadversions on the Art of Intercomputer Networking, new ISBN 0-595-08879-1, presumably available via backinprint.com by the time you read this -- which I can now do without any fear of the original publisher, since the copyright reverted to me when They declared The Book out of print and destroyed the remaining inventory without keeping Their promise to inform me in advance if They were ever going to do so ... which didn't surprise me, since I'd long had proof They'd only been paying me royalties on every other copy They sold all the long): Around [20, by now] years ago I ran into an Old Network Boy friend (Gary Grossman, actually) I hadn't seen for a while. We got to reminiscing about the good old days five or so years previously on the "New" Telnet [...] working group and I said, "You know, I always liked your IAC trick." ( [...] a fairly important second-order mechanism of the ARPANET'S second-pass Virtual terminal protocol.) "Wait a minute," he replied, "IAC was one of yours ." [Page 24, if you're curious about the fuller context.]'''
year_published = 2000
