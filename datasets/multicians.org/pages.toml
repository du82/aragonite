["https://multicians.org/site-ford.html"]
title = "Site History: Ford"
description = "History of the Ford Motor Company Multics installation 1973-1997."
full_description = "3Q73 - 1Q75 consignment/trial/development 3Q78 - 2Q97 production April 25, 1997 final shutdown (Story below) [BWS] At its peak in 1Q91 there were 4 systems, 3 production and 1 a spare provided by Bull to provide tested boards. All were unclassified. The tape strings were shared between systems as shown, and consisted of the following drives: MTU0630: a=7, b=6, c=6, x=7 MTU8200: y=4 Each of the production systems had 2 IMUs. IMUs (as contrasted with IOMs) were required to run the FIPS 3381 disk to which we converted in 1988. There were no paging devices, although we had used a bulk store on our GCOS machine. Almost as a point of pride, there were never any card devices (we left card processing behind with GCOS). All of the systems ran MR12.1, to which we upgraded during the disk conversion effort. [BWS] There was one large application (Warranty analysis that eventually occupied most of Multics_B), dozens of medium applications, and scores of small applications. [Vince Scarafino] We were the first I know of to put a relational database application into production. (We used MRDS.) Management of the commercial data center accused us of being irresponsible, since everyone knew that you couldn't use a relational data base for real production. We were doing in excess of 300,000 transactions in a typical 8 hour day. [Greg Baryza] Cars of that era had many models and less options. Trucks were the opposite; they had few models and many options. When you sat down to order a big truck, you specified it almost from the ground up: tilt cab or hood over the engine; steel cab or aluminum cab, one or two rear axles, passenger cab or driver-only, what size engine, what size transmission, how many side rails under the bed, what kind of fuel, etc., etc. [Greg Baryza] The state of the art in the mid-70's as far as truck design was primitive by today's standards. It was sometimes the case that you couldn't figure out whether you could build what the customer wanted until after the order was taken and you'd analyzed the order by computer (read, mainframe)."
