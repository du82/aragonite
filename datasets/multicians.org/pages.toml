["https://multicians.org/site-dndh.html"]
title = "Multics Site History: DND-H"
description = "History of the Multics operating system installation at the Canadian Department of National Defence."
full_description = "Dual L68 installed in 1982. Upgraded to triple 8-70M in 1985. Fourth CPU added in 1988. Fifth CPU, fourth SCU, IMUs instead of IOMs, FIPS disk added in 1993. [Dave Green] The picture below is the last drawing I had of the system. There may have been some changes after this one, however it does show the DAT tape subsystems that we configured in, as well as FNP-D which I had almost forgotten about. Each DAT Subsystem had two DAT drives in the box. FNP-D did not have a full complement of lines and was used (when I was there) for mini-system testing and some other weird testing of communications. As well this drawing does not show the connections between the FNPs to HP DTCs which were used to network the lines to UNIX comms and graphics systems. (Click for a larger view.) [R. Barry Walker] Multics served as the hub of the Canadian navy's operational command and control system and was used extensively in military operations including the Gulf War and in humanitarian support operations such as the recovery of SwissAir 111. [Marlene Corey] I would have to say that one of the most notable things I was involved with was MULTICS MCOIN software that allowed us to feed UNIX servers, including a web server located on a Novell LAN with Military messaging and intelligence data. Alan Haggett, a first class Multician, actually wrote the interface. In fact using terminal emulation on a network our users connected to MULTICS via a DTC. To our users, the mainframe was just another server so the migration to a Client- Server environment was relatively painless for them. [R. Barry Walker] For about 5 years, the system was also used to support the DND Ship Repair Unit. This involved running workload simulations for major overhauls of submarines and other vessels as well as work cost accounting etc. The conflict for resources on the system led us to become experts in work class management to ensure that the C2 stuff got priority when needed, but allowed the background simulations to complete in a reasonable time. In time, the SRU applications were moved to VAX clusters, allowing us to reclaim large amounts of disk storage and CPU time."
year_published = 2000
year_updated = 2002
