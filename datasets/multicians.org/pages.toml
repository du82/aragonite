["https://multicians.org/site-gm.html"]
title = "Site History: General Motors"
description = "History of the General Motors Multics installation."
full_description = '''Multics was operated by GMISCA (General Motors Information Systems and Communications Activity), initially led by Ashby Woolf. Original location: B152 GM Bldg, May 1974 Move: GM Technical Center, Warren MI Winter 1977/Spring 1978 Move: GM Argonaut Bldg, behind world headquarters, Detroit MI 1984? [Bob Fetter] Original location: basement, General Motors Building, in the facility called "Detroit Data Center". The original installation was on a raised floor that suspended the entire system and operations area over a closed Executive Swimming Pool. Operations staff could rummage around below the room in the cavernous spaces available, causing certain degrees of consternation and confusion for some GM late night security personnel. Oddly enough, it was during this time that 'Zork' and 'adventure' gained the greatest popularity... [Fred Zemmin] Original Location: B(basement)152 as Fetter states. It was spring (May) 1974. The original Honeywell installation team was Vern Scheske, Frank Nestor and John Waclawski, Helen Wright was the GM person. Harry Quackenboss and Fred Zemmin had just returned from the Reston, VA Multics classes some of which were taught by Patty Lyon who was recruited to come to Detroit to lead the support team. Honeywell had committed about 24 man years of support. We delivered about 12 man years in a 12 month period. I don't recall the first release but it might have been before MR1.0 because we were using MIT numbers. The final configuration had 6 FNPs (although we probably needed only one). The large configuration allowed for spare parts and testing of parts if needed. We were actually running on 5 CPUs (one was being used to test boards) and 5 FNPs (one was being used for testing and spare parts). [THVV] Done for GM by SofTech in the early 70s. This application was a monster spreadsheet, done before the invention of VisiCalc. It combined the financial operations of all 13 GM divisions into a single database and allowed interactive calculations and exploration.'''
year_published = 2004
