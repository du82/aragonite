["https://multicians.org/multics-humor.html"]
title = "Multics Humor"
description = "Jokes and cartoons about the Multics operating system."
full_description = '''A lot of this won't seem funny to non-Multicians. (No offense is intended to any member of any group by these items.) Here is the Multics Man comic, done by an artist named T R Kenney while he was at Honeywell FSO. Haven't been able to track him down to ask permission, but I hope he will accept the thanks of Multicians everywhere for drawing it. The following was circulated anonymously at MIT Project MAC in the mid-70s. Thanks to Sammy Migues for unearthing it. [Scott adds:] The Psalm is published in Sociology, a Text Reader (2nd ed) by Brabant, Forsyth, Gramling and Mooney. The book is put out by Ginn Press (at least, the first edition was; now it's in its 4th printing) or maybe it's called Simon and Schuster Custom Publishing. The article in which it appears is "The Computer as a Construct of Social Reality" by Sarah Brabant. It was a TIFF file in old-English type. Any idea who wrote it? SDSC is San Diego Supercomputer Center. On the twelfth day of MULTICS My true love sent to me: Twelve analysts twitching, Eleven options switching, Ten stacks a-popping, Nine aids debugging, Eight tapes attaching, Seven DIM's a-dimming, Six ITS a-pointing, Five protection rings, Four calling sequences, Three link pairs, Two system dumps, And a file tree hierarchy! -- Doug Quebbeman writes: "I've found a Multics BASIC program with a creation date back in 1978, and the source lists Joseph W. Dehn III as the program author..." in 1983 while at GM I did an ad in the Detroit Metro Times that made it all the way to Phx, and Wash DC: Jerry Saltzer was very firm about this: it's not an acronym. It's supposed to be a (new) English word. (It's in the Oxford English Dictionary.) But some wag early on in the history of the project at MIT suggested that Multics stood for "Many Unnecessary Long Tables In Core Simultaneously" in allusion to the then-striking complexity of data-structure required for the management of the system's ground-breaking virtual memory. While the virtual memory itself reduced the amount of data that actually had to be in core (main memory), the size of the SST, which contained the page tables, limited the actual number of long tables that could be in core simultaneously. At any rate, there were means of managing their lengths, and none of them were unnecessary.'''
year_published = 2025
