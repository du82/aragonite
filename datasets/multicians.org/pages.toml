["https://multicians.org/devdoc.html"]
title = "Multics Development Documents"
description = "Documents produced during the development of the Multics operating system."
full_description = '''The Multics development team produced many different series of documents describing Multics and our plans and progress in building it, beginning in the mid 1960s and ending when the system was cancelled in mid 1980. Some documents are available on this site: The very early plans for Multics were described in a set of Project MAC memos called the Multics Design Notebook. These memos were written in 1964 and circulated to the system builders and to other OS researchers to explain what MIT wanted from its next machine. In Section I: Introduction Prof. Corbató mentions that the choice of GE as the system vendor had already been made as of November 64. Most MDN sections were written by MIT Project MAC personnel: there are a few sections by Bell Labs and GE personnel. 27 sections have been scanned by The Multics History Project (MHP) and a scanned online copy of the MDN is on Prof. Saltzer's web site. The Multics System Programmers' Manual was intended to be the primary design document for Multics. The MSPM was distributed to all staff in multiple looseleaf binders, and updated as the system design and implementatin evolved. MSPM sections were written before implementation describing requirements, planned algorithms, and interfaces. Once code was finished and checked in, MSPM sections describing the implementation and calling sequences were added. When code was checked in, additional sections were added descriing the final implementations. Occasionally, designs changed and whole sections were renumbered and reorganized, or removed entirely. Most of the MSPM was written between 1965 and 1969, before Multics became a service. Late in initial development, we fell behind on keeping the MSPM up to date: some "module abstracts" were written with the intent to flesh them out later. A late edition of the MSPM has been scanned by MHP. The Table of Contents and 822 of the 838 sections are on this site. The Multics Programmers' Manual (MPM) was begun at Project MAC in 1965 as the follow-on manual to the CTSS User's Guide. As described below, these manuals were taken over by Honeywell, and assigned Honeywell document numbers.'''
