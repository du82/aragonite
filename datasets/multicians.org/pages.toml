["https://multicians.org/mult-links.html"]
title = "Multics Links"
description = "Web sites of interest to Multicians."
full_description = "The closed groups.io mailing list multicians has been set up for Multicians to contact each other. It currently has 173 members. To join it, send mail to multicians+subscribe@groups.io including a brief message about your contribution to Multics. Once you are approved by the moderator, you can post messages, and can receive messages sent to the group as individual emails or a daily digest. Members can view the archive of past messages at https://groups.io/g/multicians, and can also use other features of the group, including file and picture storage, chat, databases, and polls. Messages sent to the group are not indexed by search engines, and user mail addresses are not harvestable by spammers. Signing up to the mailing list does reveal your address to other members of the group (unlike registering on the Multicians website). The moderator cannot change your groups.io account settings: you have to do this yourself. See the groups.io members manual. The LinkedIn group multicians has been set up for Multicians who use the LinkedIn social networking site. It currently has 293 members. To join the group, send mail to the editor. Group members may contact other members and participate in discussions. Your posts to the group may become visible on the web. Use the mailing list for messages you'd rather keep among family. (But see above.) (10/10/19) LinkedIn has changed its rules for groups again. Groups are now either unlisted or listed. The multicians group is listed, meaning it will show on your profile. Any group member can invite their connections to join the group. (Please use this power wisely... there is a credit card skimming application called multiCS: that doesn't count.) The feb_wwide mailing list is for present and former employees of Bull, GE, Honeywell, and related companies. It focuses on computer history and preserving the story of past accomplishments. Most of the postings are in French. The YouTube channel named Multicians has been set up by Paul Green to host videos by Multicians. It also has a playlist that points to other Multics-related videos."
