["https://multicians.org/myths.html"]
title = "Myths about Multics"
description = "Incorrect statements about Multics corrected."
full_description = '''Tom Van Vleck, John Gintell, Joachim Pense, Monte Davidoff, Andi Kleen, Doug Quebbeman, Jerry Saltzer Many statements about Multics on the Web and USENET are partly or completely incorrect. This note lists some of the most common myths and provides more accurate information. "...the increasing obviousness of the failure of Multics to deliver promptly any sort of usable system, let alone the panacea envisioned earlier." Dennis Ritchie , The evolution of the UNIX time-sharing system, Bell System Technical Journal 63, 8, Oct 1984. "A group of four Bell Labs programmers continued on in their efforts, however, and worked to create a system that would succeed where Multics had failed. They named their operating system UNIX." Kevin Martin , Pair Networks Insider, "History of FreeBSD" , Sept 2001 "MULTICS failed, but it did inspire Ken Thompson, who was a researcher at Bell Labs, to have a go at writing a simpler operating system himself." Dr William J. Knottenbelt , Class notes, Intro to Unix , accessed Dec 2002 "1969 Unix is born at Bell Labs to replace the failed Multics operating system" anonymous , The History of Open Source Development , accessed Dec 2002 "Thompson and Ritchie were pulled out of the original MULTICS collaboration after the failure of 1966/7 era hardware to support its implementation" anonymous , Wikipedia, "Unix" , accessed Dec 2002 "The MULTICS project was abandoned. The GE 645 system was too slow and proposals for new equipment were rejected as too expensive." anonymous , "Linux Overview" , accessed Dec 2002 "Commercial development of the MULTICS project is abandoned after four years intense development. Multics involved MIT, GE and Bell Labs in an attempt to build a large scale time-sharing system for computer utilities." Prof. Thomas Haigh , ST297 Readings Timeline , accessed Dec 2002 From Bell Labs' point of view, Multics did fail to produce the time-sharing system they wanted when planned. Bell Labs joined the Multics effort in 1965 through a "murky process" [Vic Vyssotsky] and chose to withdraw a few years later. Their goal in joining was to obtain an inexpensive time-sharing system for use by members of the technical staff at Bell Labs. They had various degrees of commitment to the Multics vision of a "computer utility" described in "Introduction and Overview of the Multics System."'''
