["https://multicians.org/site-asea.html"]
title = "Multics Site History: ASEA"
description = "History of the Multics operating system installation at ASEA, Vasteras, Sweden."
full_description = '''Allan Anundi, Tim Ehrler, Roland Orre, Åke Larsson, Ingemar Enkler, Olin Sibert, Soren Soderholm, Haken Bergman. [Ed Ranzenbach] One of the other Brits was "Simon". I cannot remember his last name. There were two Australians on the project as well. [Ed Ranzenbach] There were a few Swedes I remember. Robert Strand aka "Bobby Beach". "Strand" translates to "beach" in Swedish. Bobby was educated at UCLA and had adopted a "surfer dude" persona. [Ed Ranzenbach] Ingamar Svenson - A 70 year old (at least he seemed to be that old) programmer that swam 50 laps every night. [Charlie Spitzer] I don't have a lot of memories about ASEA except for what I worked on. The machine was sold to ASEA for a year or two before I got there. [Charlie Spitzer] I was stationed in Västerås on a short term contract, arriving for 3 months in late summer of 1980. They were impressed with me and asked that I stay on, but I then left to sell my car, pack my belongings, and returned in early spring of 81. In april of 82 they canceled the project and I left may of 82. I don't know when it was installed, but I believe it was early 80 or late 79, and I don't know when it was deinstalled. I think it was there until at least 83. [Charlie Spitzer] The onsite system engineer was Jim Mackenzie. From ASEA, he went to work at a Multics site in France in 1983, and then went to Stratus London for a number of years. I went over there with Ed Ranzenbach and Mike Meyers. Jim was already there a year before I got there, and he was responsible for being the sysadmin and keeping the system up. Ed came from (I believe) RADC and we did most of the work on the Multics side of the project, and Mike was a non-Multics program manager from HIS McLean. Another name was Steve Hopkins, an HIS SE on a 6 month loan from one of the Paris or Grenoble sites. [Charlie Spitzer] ASEA bought a Multics because they had contracts with various governments to track paperwork (manuals, design docs, build sheets, etc (basically every piece of paper)) that went into building a nuclear power plant. These documents were produced on a minicomputer and then uploaded to Multics, which had to store, retrieve, and possibly send them to test machines, which did some sort of robotic testing on production lines, as some of the documents were actually robot programs to do automated testing of parts being built. ASEA was very big in the robotic manufacturing area (both using robots, and building them), I think top in the world. hence the need for security.'''
year_published = 2012
year_updated = 2015
