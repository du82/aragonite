["https://multicians.org/mtb-index.html"]
title = "Multics Technical Bulletins Index"
description = "Index of documents produced during the development of the Multics operating system"
full_description = '''The present paper is a case history look at the development of the Multics System from a management point of view. Features of the Multics system programming process lead to high programmer productivity with high software reliability. Other workers' predictions of increasing difficulty of system maintenance with time have not been observed; reasons for this are investigated. The contents of this MTB outlines a tool intended to be used for the analysis of a Multics address space. This tool, analyze_multics, is intended to replace ol_dump and ifd. A recent RPQ effort has identified a need to review the operator's console device control module for the purposes of providing a means of changing bootload consoles without interrupting user service. During this review several problems were discovered with the device control module, ocdcm_, the most serious causing the processor handling an interrupt from the console to loop, masked, in ring zero until the operation completes. If this operation is a read, the termination status being looped on can take as long as thirty seconds to arrive. The processor, and process, servicing this interrupt are effectively unresponsive for this period. Due to problems such as this it was decided that a complete redesign of ocdcm_ was needed. After many years of apparent disinterest in computer security, the DoD has established a Computer Security Center. This Center has published a "Trusted Computer System Evaluation Criteria," and is in the process of evaluating several computer systems. The Criteria set out requirements for functionality, documentation, and configuration management for systems at various levels of security or trust. This MTB briefly describes the evaluation process, and goes on to discuss the results to date of the Multics evaluation, including system changes necessary to reach the B2 level of the Criteria. This MTB describes the plans for attaching and controlling communication between a Multics process and an MCA for performing various functions. These will include reading the current IMU configuration state, reading selected information from one of the two internal IMU diskette devices and performing Integrated Peripheral Controller (IPC) functions (once the IPC has also been attached).'''
year_published = 2025
year_updated = 2025
