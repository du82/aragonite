["https://multicians.org/site-mit.html"]
title = "Multics Site History: MIT"
description = "History of the Multics operating system installation at MIT."
full_description = "Dave Jordan & Roger Roach at the 6180 console, MIT building 39, third floor, mid-1970s.(Click for a larger view.) In 1972, a Honeywell 6180 was installed in MIT's building 39, at the Information Processing Services Center. There are publicity pictures of the new machine. The machine was moved to building W91, 565 Memorial Drive, the old wind tunnel building, in the summer of 1983, and Building 39 became the Microcircuits production building. The third floor still has the original raised floor. ARPANet connection (GIMPSPIF) [host 6] (added in 1970). A detailed configuration memo from the Multics Planning Notebook is available. Some additional equipment owned by Honeywell (an IOM, an DN355, and an extra printer) was used at the MIT site until CISL set up its own development machine in 1974. A third CPU was made available by Honeywell in early 1975 so that the MIT Multics system could run two CPUs while the processors were converted to add cache memory. In mid 1980, the configuration was updated to: 2 L68/DPS processors 2.5 MW of memory replacing the 512K of core memory and 2 MW bulk store. There were also 2 dual channel disk controllers, and 2 6678 FNPs, indicating that we could create two systems from them. Thus assuming, although not specified, 2 IOMs. In 1982, the machine was upgraded from 2 DPS/68 processors with 3,072K (words) of memory to 2 DPS 8/70M processors with 2 MB of memory and an additional 14 MB of memory. When MIT sold its Multics hardware back to Honeywell in 1988, the system had a total of 24 MB of memory. MIT's machine provided general time-sharing services for education and research to the MIT community, and also supported a cooperative project with GE (later Honeywell) Cambridge Information Systems Laboratory (CISL) to develop the Multics operating system. This second activity meant that the MIT machine was the primary development and exposure site for the Multics design team: system programmers edited and compiled their files on the MIT machine, the master source archive for the system was stored at MIT, and new system versions were first used in production at MIT."
