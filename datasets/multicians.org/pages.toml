["https://multicians.org/site-ou.html"]
title = "Site History: Oakland University"
description = "History of the Oakland University Multics installation."
full_description = "2 68/80 CPUs, 2 SCUs, 4MW 36-bit words MOS memory each, 1 IOM, DN6678 front-end processor 9 MSU451 disks (157MB each) 2 PRU1200 printers 4 tape drives, card reader & punch, [Paul Amaranth] The end config had a couple of the 1G drives and at least a half dozen of the removable packs. I think they were 250M. I still have one sitting in my office - there were 12 platters in the pack. We ended up with a total of around 4G, I think. [Brian Henk] OU wanted to convert University applications (student records, payroll, accounts pay/rec) from an IBM 360 to a newer technology. Additionally the students wrote programs on punch cards and ran on a Burroughs B5500. Multics was selected because of a package deal, several Level-6s and other equipment was thrown into the deal by HIS. This was perhaps an attempt on HIS part to get a Multics site that could produce programmers for use by Ford and GM, which indeed it did. [Paul Amaranth] Part of the attraction of Multics was they would only have to have one computer for administrative work as well as academic. This actually worked out fairly well, but the conversion of the administrative programs from an IBM environment to Multics was not easy, particularly for run of the mill COBOL people. I think Oakland was one of the most active sites identifying errors in the COBOL compiler. I generally stayed far away from that code, the few times I was called in to look at something, I came away appalled. They were running a punched card system on a system designed for interactive use. I think some restructuring could have resulted in significant gains in efficiency and usability, but there was no one around who could do that. I converted most of the academic software, including Minitab, BMDP et al. USL did SPSS, but I think I covered most of the little stuff. [Paul Amaranth] The shutdown was around '90, I think. On the shutdown day, our Operations manager killed the system, then mangled some of the config switches so it wouldn't boot. Bill Watt came into the room, noticed the changed switches, reset them properly, brought the system back up and then went through an orderly shutdown to bring the system to rest."
