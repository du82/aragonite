["https://multicians.org/m-webadmin-tasks.html"]
title = "Maintenance tasks for the Multicians Web site"
description = "Maintainer information for the Multicians website."
full_description = '''The site build process and tools for multicians.org are documented in Build process for the Multicians Website. Hosting for this site is provided by the hosting site admin, who pays the domain name registration fees and web hosting fees as a contribution to the online community. The web site has been hosted at Pair Networks Inc in Pittsburgh PA since 2001. Pair is referred to as the Information Service Provider (ISP). We are limited in both storage space and bandwidth as a result of the ISP account parameters. The editor will take whatever steps are necessary to avoid exceeding the (fairly high) limits imposed by the ISP, since this could cost the editor a lot more money than he can spare. The ISP account has a bandwidth limit. Usage over this limit incurs additional charges. The ISP has a policy that forgives high usage due to "slashdotting" outside of our control, but more than one such event in a month could be a problem. We are also bound by the ISP's Acceptable Use Policies. So far this has not been a problem, partly because the site editor moderates the site content. Pair has been in business since 1996. In 2017 Pair Networks was bought by Libsyn, a podcast hosting company, from Kevin Martin, the founder of Pair. (https://www.sec.gov/Archives/edgar/data/1667489/000165495418000043/lsyn_8k.htm) Pair's service has remained acceptable so far. In December 2022, multicians.org was moved to a new account at Pair Networks. This is a "Virtual Private Server" account rather than a shared server account. (Saved a little money. Moved from FreeBSD to Ubuntu. Raised bandwidth limit.) Files on the site include graphics and PDFs, HTML provided by others, and HTML compiled from HTMX and SQL. Translation is invoked using the Unix make command for any file whose source is newer than its object. Web pages on multicians.org are written in .htmx source files that contain extended HTML for the page's contents. The source file ends by invoking a wrapper that formats the page with standard layout, headings, and CSS. expandfile creates a .html object file.'''
