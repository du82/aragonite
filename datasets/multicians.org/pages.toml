title = "Multics Simulator"
description = "About the SIMH based simulator for the Honeywell 6180 (DPS8M)."
full_description = "(01/16/24) Harry Reed died on Jan 11, 2024. The Multics Simulator he and Charles Anthony created became a wonderful gift to Multicians everywhere. (08/11/23) Version 3.0.1 of the Multics simulator was released, with many improvements. See DPS8M home page, gitlab page and Multics Simulator Frequently Asked Questions, Wiki page. To install the DPS8 Simulator and the latest Multics on your machine, see Eric Swenson's Getting Started, Wiki page. This has the steps for installing the simulator on your machine, and installing Multics software, compilers, system source, install scripts, and several initial projects (SysDaemon, SysAdmin, Daemon, etc.) and users. (08/18/23) Multics Release 12.8 is now available for use on the DPS8M simulator, with 80 bug fixes. Eric Swenson is the release coordinator. Changes are discussed on dps8m-users, dps8m-developers, and on Multicians@groups.io. Eric Swenson has documented Software Development Procedures for the Multics Simulator for those who wish to submit bug fixes and changes to Multics for the simulator environment. Designs are described in MTBs. An index is at Post-Honeywell MTBs, MTBs since 2015. Changes are proposed and documented in MCRs. An index is at Post-Honeywell MCRs, MCRs since 2015. (08/10/14) Simulated Honeywell Multics hardware is available for Windows, Linux/Unix, and macOS. The Multics DPS8-M CPU simulator created by Harry Reed and Charles Anthony is available for public download. It simulates an entire Multics mainframe system, with multiple CPUs, I/O controllers, Network Processors, and peripherals. The simulator can run on AIX, FreeBSD, NetBSD, OpenBSD, DragonFly BSD, Haiku, GNU/Hurd, illumos OpenIndiana, Linux, macOS, Solaris, and Windows. The simulator is open source, available on GitLab. There are mailing lists at SourceForge for developers and users: (Sign up at https://sourceforge.net/p/dps8m/mailman/) dps8m-users: https://sourceforge.net/p/dps8m/mailman/dps8m-users/ dps8m-developers: https://sourceforge.net/p/dps8m/mailman/dps8m-developers/"
