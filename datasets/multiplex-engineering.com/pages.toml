["http://multiplex-engineering.com/response-messages"]
title = "Response Messages – Multiplex Engineering"
full_description = "Response Messages Response Message Format The Response Message is a message from the interface to the personal computer that is 14 bytes long. This message contains the information returned by the car in response to the request command or an error code if the command could not be issued. The format of the response message is: (Destination), (Type), (1st Byte from car), (2nd Byte from car), …, (11th Byte), (Sum check) Byte Description 1. Response Destination (This the address of the PC that sent the request message. It is normally 0x40) 2. Type 3. 1st (most significant) byte of the response received from the automobile (see note 1.) 4. 2nd byte of the response received from the automobile 5. 3rd byte of the response received from the automobile 6. 4th byte of the response received from the automobile 7. 5th byte of the response received from the automobile 8. 6th byte of the response received from the automobile 9. 7th byte of the response received from the automobile 10. 8th byte of the response received from the automobile 11. 9th byte of the response received from the automobile 12. 10th byte of the response received from the automobile 13. 11th byte of the response received from the automobile 14. Sum check Note 1. The first byte of the response for J1850 VPW or ISO 9141-2 is 48, while the first byte of the response for J1850 PWM is 41. Note 2. If the car response contained less than 11 bytes of data, the extra bytes in the Response Message will be zero. Response Message Type Description 01 = Message from ISO14230 (KWP) 80 = Error occurred (See Error Response Message Below) 81 = Message from ISO-9141-2 or ISO-14230 (KWP) 82 = Message from J1850 VPW 84 = Message from J1850 PWM 88 = Message from CAN"
year_published = 2025
clearnet = "http://multiplex-engineering.com/response-messages"
