["http://multiplex-engineering.com/faq"]
title = "FAQ – Multiplex Engineering"
full_description = "FAQ Frequently Asked Questions How do I order? Is there a minimum order? Can I order custom-made OBD2 cables? Will your product support the J1939 or J1587 protocol? What does OBDII/OBD2 stand for? Do the connector blocks that you see provide stress relief for the wires that come out of the OBD2pins? How do you ship the orders? Are there any vehicles your interfaces are not suitable for? Do you sell kits? Do the interfaces include software? How do I connect the interface to my computer? Are your interfaces ELM based? 1. How do I order? You may order by FAX, phone, or e-mail. Pre-payments are required from individuals, purchase orders from companies. For California companies, please FAX or mail a copy of your re-sale license with your purchase order. First time orders by companies require payment in advance unless credit is approved. For credit card orders we use PayPal. You would need to register with paypal.com and then send the payment to sales@multiplex-engineering.com. You may also pay by check or money order. We require prepayment prior to shipping. 2. Is there a minimum order? We have a $50 minimum order, not including shipping. Sales tax applies to residents of California and companies that do not send us a copy of their re-sale license. 3. Can I order custom-made OBD2 cables ? We accept orders for custom-made OBD2 cables if the quantities are large enough. Our minimum order in this case would be 500 pieces, price to be determined. 4. Will your product support the J1939 or J1587 protocol? Not at this time. We manufacture products that use protocols used in light duty vehicles. 5. What does OBDII/ODB2 stand for? On Board Diagnostics level 2. 6. Do the connector blocks that you sell provide stress relieve for the wires that come out of the OBD2pins? No. The connector blocks that we sell do not provide stress relief for the wires. You can build your own cables using the CNS cases we sell, some hot melt glue, and OBD2 connector blocks. 7. How do you ship the orders? We ship by US Postal Service, UPS or Federal Express. Cost depends on shipment weight and shipping method requested. 8. Are there any vehicles your interfaces are not suitable for? Our product does not work on HEAVY trucks, buses, and earth moving equipment. 9. Do you sell kits? No. We do not sell assemble-it-yourself kits. 10. Do the interfaces include software? No. It is necessary that you write your own software. Any interface that you buy directly from Multiplex Engineering will not work with any existing COMMERCIAL software you purchase from any source. 11. How do I connect the interface to my computer? Please see interface description for what is needed to connect to computer. The interface comes ready to use. 12. Are your interfaces ELM based? No. Our interfaces do not support ELM protocol."
