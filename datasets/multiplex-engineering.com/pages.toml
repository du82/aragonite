["https://multiplex-engineering.com"]
title = "Multiplex Engineering – Specializing in the newest serial databus standards being used in the automotive industry"
full_description = "About Us Multiplex Engineering is a technology company specializing in the serial databus standards being used in the automotive industry. We design and manufacture diagnostic interface hardware needed to build OBDII scan tools. Our diagnostic interfaces support SAE-J1850 VPW, SAE-J1850 PWM, ISO-9141-2, ISO-14230 and ISO-14230. We have shipped over 200,000 diagnostic interfaces since 1996. We do not sell any software to go with the interfaces. Any interface that you buy directly from Multiplex Engineering will not work with any existing commercial software you purchase from any source. It is necessary that you have, or write, your own. Our President and Chief Engineer, Paul Bowen, has been actively designing digital electronics since 1983. He is skilled in all aspects of product development, including product definition, design, debug and early production. His expertise is microprocessors, programmable logic, digital communications, and ASIC design. He was formerly one of the Senior Design Engineers at Delco Systems Operations Division of General Motors, from 1983 to 1996. Paul earned his Master of Science degree in Electrical and Computer Engineering from the University of California at Santa Barbara. He earned his Bachelor of Science degree in Engineering Technology from California Polytechnic State University San Luis Obispo, and Associate of Science degree in Digital Electronics Technology from American River College in Sacramento. Our engineers and technicians are available for design work as needed."
