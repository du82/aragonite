title = "Request Messages – Multiplex Engineering"
full_description = "Request Messages Request Message Format The Request Message is a message sent from a personal computer to the Multiplex Engineering interface that is 15 bytes long. The request message either instructs the interface to send a message to the vehicle with the data included, or it requests information from the interface itself. The message sent to the vehicle or information requested from the interface depends on the Command sent in the message. The Format for a request message is: (Destination), (Command), (Byte Count), (Data 1), …, (Data 11), (Sum check) All bytes in the message including the command number are in hexadecimal format. Destination The destination address can be different for different interfaces. Specific destination addresses are assigned to different customers. You must send your destination address to your interface or the interface will not allow any communications. Command This is the command byte. The Commands that the diagnostic interface will respond to are described in Request Message Commands. Byte Count This is the number of bytes that will be sent over the automobile data bus. This does not include the error detection byte sent on the automobile data bus. (The interface will generate the error detection byte.) The byte count is not used in some commands. Please refer to the specific command format to see its structure. Data These are the actual data bytes of the message that will be sent on the automobile data bus. The first byte sent to the vehicle is the most significant byte in the message for the vehicle. Sum check The sum check is the lower 8 bits of the sum of the Command byte through the last data byte. The Destination byte is not included in the Sum check. Request Message Format – Byte Description: 1. Destination 2. Command 3. Byte Count 4. 1st (most significant) byte of the message to be sent to the automobile 5. 2nd byte of the message to be sent to the automobile 6. 3rd byte of the message to be sent to the automobile 7. 4th byte of the message to be sent to the automobile 8. 5th byte of the message to be sent to the automobile 9. 6th byte of the message to be sent to the automobile 10. 7th byte of the message to be sent to the automobile 11. 8th byte of the message to be sent to the automobile 12. 9th byte of the message to be sent to the automobile 13. 10th byte of the message to be sent to the automobile 14. 11th byte of the message to be sent to the automobile 15. Sum check Request Message Commands Request message commands are used to instruct the interface what to do with the message it receives. The interface first reads the command and then performs the corresponding action with the data included in the request message. The command messages are detailed below. Legacy Buses Commands 01 = Send message on ISO-9141-2 with initialization Command Usage Command 01 is used as the first message sent over ISO 9141 to initialize the connection. The initialization takes place at 5 bits/sec, because of this and other bytes sent it can require up to 2 seconds to complete the initialization. After the bus is initialized, you will need to send a command at least every 5 seconds according to the specifications to keep the connection active. However, we recommend you send a 10 command every 3 seconds to keep the connections alive. Request Message Format 1. Destination Address 2. 01 3. BYTE COUNT 4. Data Byte 1 5. Data Byte 2 6. Data Byte 3 7. Data Byte 4 8. Data Byte 5 9. Data Byte 6 10. Data Byte 7 11. Data Byte 8 12. Data Byte 9 13. Data Byte 10 14. Data Byte 11 15. Sum Check 02 = Send message on J1850 VPW [details] Command Usage Command 02 is used to send the message contained in the Data Bytes 1-11 over J1850 VPW. Request Message Format 1. Destination Address 2. 02 3. BYTE COUNT 4. Data Byte 1 5. Data Byte 2 6. Data Byte 3 7. Data Byte 4 8. Data Byte 5 9. Data Byte 6 10. Data Byte 7 11. Data Byte 8 12. Data Byte 9 13. Data Byte 102 14. Data Byte 11 15. Sum Check 04 = Send message on J1850 PWM without IFR [details] Command Usage Command 04 is used to send the message contained in the Data Bytes 1-11 over J1850 VPW without In Frame Response (IFR). In Frame Response is an internal handshake used by Ford vehicles. We do not recommend sending PWM message to Ford vehicles without IFR. Request Message Format 1. Destination Address 2. 04 3. BYTE COUNT 4. Data Byte 1 5. Data Byte 2 6. Data Byte 3 7. Data Byte 4 8. Data Byte 5 9. Data Byte 6 10. Data Byte 7 11. Data Byte 8 12. Data Byte 9 13. Data Byte 10 14. Data Byte 11 15. Sum Check 10 = Send message on ISO-9141-2 without initialization [details] Command Usage Command 10 is used to send the message contained in the Data Bytes 1-11 over IS0 9141. The connection needs to have already been established with the 01 command to use the 10 command. Request Message Format 1. Destination Address 2. 10 3. BYTE COUNT 4. Data Byte 1 5. Data Byte 2 6. Data Byte 3 7. Data Byte 4 8. Data Byte 5 9. Data Byte 6 10. Data Byte 7 11. Data Byte 8 12. Data Byte 9 13. Data Byte 10 14. Data Byte 11 15. Sum Check When bit 5 of the Byte Count is set to a 1 the interface will be configured for receive of one long response message. When bit 6 of the Byte Count is set to a 1 the ISO request message will be sent but the interface will not wait to receive the response message. When bit 7 of the Byte Count is set to a 1the ISO request message will be sent with out a checksum byte. 20 = VW Intelligent Pass-through Mode with 5 baud init and baud rate detect. (Not available in USB) [details] Command Usage Command is an old way of communicating with VW cars. While this feature is still in our RS232 interfaces we do not recommend using it. A Brief Over Of How The VW Intelligent Pass-through Mode Works 1. Command 20 is sent with the desired controller address. 2. The interface sends the desired controller address at exactly 5 baud on both the K and L lines. 3. The interface observes the sync byte (55) from the ECU and determines the period of baud rate used by the ECU. 4. The interface responds with an RS232 message that contains the vehicle’s ISO baud rate. 5. The PC must then receive KW1 and KW2, and send the KW2 inverted to the ECU. All future messages are in pass-through mode unless 5 seconds passes without any ISO bus activity. After 5 seconds, the interface returns to normal mode. Request Message Format 1. Destination Address 2. 20 3. 1 4. Controller Address 5. 0 6. 0 7. 0 8. 0 9. 0 10. 0 11. 0 12. 0 13. 0 14. 0 15. Sum Check 40 = VW Intelligent Pass-through Mode without 5 baud init. (Not available in USB) [details] Command Usage Command 40 functions the same as command 20 except it allows a direct transition to pass-through mode. The 5 baud init and the baud rate detection of the sync byte are skipped. The response message is therefore empty. See Command 20 details for more information. Request Message Format 1. Destination Address 2. 40 3. 1 4. Controller Address 5. 0 6. 0 7. 0 8. 0 9. 0 10. 0 11. 0 12. 0 13. 0 14. 0 15. Sum Check 41 = Send a VPW message and ignore VPW responses 1-8, report responses 9-16 [details] Command Usage Command 41 sends the message contained in Data Bytes 1-11 over VPW and stores responses 9-16 from the request message. Responses 1-8 are ignored. Request Message Format 1. Destination Address 2. 41 3. BYTE COUNT 4. Data Byte 1 5. Data Byte 2 6. Data Byte 3 7. Data Byte 4 8. Data Byte 5 9. Data Byte 6 10. Data Byte 7 11. Data Byte 8 12. Data Byte 9 13. Data Byte 10 14. Data Byte 11 15. Sum Check 42 = Send a VPW message and ignore VPW responses 1-16, report responses 17-24 [details] Command Usage Command 42 sends the message contained in Data Bytes 1-11 over VPW and stores responses 17-24 from the request message. Responses 1-16 are ignored. Request Message Format Request Message Format 1. Destination Address 2. 42 3. BYTE COUNT 4. Data Byte 1 5. Data Byte 2 6. Data Byte 3 7. Data Byte 4 8. Data Byte 5 9. Data Byte 6 10. Data Byte 7 11. Data Byte 8 12. Data Byte 9 13. Data Byte 10 14. Data Byte 11 15. Sum Check 43 = Send a VPW message and ignore VPW responses 1-24, report responses 25-32 [details] Command Usage Command 43 sends the message contained in Data Bytes 1-11 over VPW and stores responses 25-32 from the request message. Responses 1-24 are ignored. Request Message Format 1. Destination Address 2. 43 3. BYTE COUNT 4. Data Byte 1 5. Data Byte 2 6. Data Byte 3 7. Data Byte 4 8. Data Byte 5 9. Data Byte 6 10. Data Byte 7 11. Data Byte 8 12. Data Byte 9 13. Data Byte 10 14. Data Byte 11 15. Sum Check 44 = Send a VPW message and ignore VPW responses 1-32, report responses 33-40 [details] Command Usage Command 44 sends the message contained in Data Bytes 1-11 over VPW and stores responses 33-40 from the request message. Responses 1-32 are ignored. Request Message Format 1. Destination Address 2. 44 3. BYTE COUNT 4. Data Byte 1 5. Data Byte 2 6. Data Byte 3 7. Data Byte 4 8. Data Byte 5 9. Data Byte 6 10. Data Byte 7 11. Data Byte 8 12. Data Byte 9 13. Data Byte 10 14. Data Byte 11 15. Sum Check 45 = J1850 VPW set up for monitor mode, for use with J2190 mode 21 [details] Command Usage Command 45 is not recommended for most users. Please contact one of our engineers for more information on this command. 46 = J1850 VPW send, but do not wait for responses [details] Command Usage Command 46 sends the message contained in Data Byte 11-1 over VPW but dose not wait for a response from the vehicle. A normal response message for J1850 VPW will be reported as soon as the request message is sent on the J1850 VPW bus. Request Message Format 1. Destination Address 2. 46 3. BYTE COUNT 4. Data Byte 1 5. Data Byte 2 6. Data Byte 3 7. Data Byte 4 8. Data Byte 5 9. Data Byte 6 10. Data Byte 7 11. Data Byte 8 12. Data Byte 9 13. Data Byte 10 14. Data Byte 11 15. Sum Check 47 = J1850 VPW send, and enter monitor mode [details] Command Usage Command 47 is not recommended for most users. Please contact one of our engineers for more information on this command. 48 = Intelligent Pass-through mode with 5 baud init (Not available on USB interfaces) [details] Command Usage Command 48 enters Intelligent Pass-through mode with a 5 baud init. Pass-through mode is an old way of doing communications. While this feature is still available in our RS232 interfaces we do not recommend using this feature. Request Message Format 1. Destination Address 2. 48 3. 0 4. 0 5. 0 6. 0 7. 0 8. 0 9. 0 10. 0 11. 0 12. 0 13. 0 14. 0 15. Sum Check 49 = VPW send, but do not report FE and FF [details] Command Usage Command 49 sends a VPW request message and ignores responses from addresses FE and FF. This command is useful because some vehicles use source addresses FF and FE for non diagnostic purposes. In this case the data from these address is not useful to the user. Request Message Format 1. Destination Address 2. 49 3. BYTE COUNT 4. Data Byte 1 5. Data Byte 2 6. Data Byte 3 7. Data Byte 4 8. Data Byte 5 9. Data Byte 6 10. Data Byte 7 11. Data Byte 8 12. Data Byte 9 13. Data Byte 10 14. Data Byte 11 15. Sum Check 4A = PWM send, but do not report FE and FF [details] Command Usage Command 4A sends a PWM request message and ignores responses from addresses FE and FF. This command is useful because some vehicles use source addresses FF and FE for non diagnostic purposes. In this case the data from these address is not useful to the user. Request Message Format 1. Destination Address 2. 4A 3. BYTE COUNT 4. Data Byte 1 5. Data Byte 2 6. Data Byte 3 7. Data Byte 4 8. Data Byte 5 9. Data Byte 6 10. Data Byte 7 11. Data Byte 8 12. Data Byte 9 13. Data Byte 10 14. Data Byte 11 15. Sum Check 4B = ISO send, but do not report FE and FF [details] Command Usage Command 4B sends a ISO request message and ignores responses from addresses FE and FF. This command is useful because some vehicles use source addresses FF and FE for non diagnostic purposes. In this case the data from these address is not useful to the user. Request Message Format 1. Destination Address 2. 4B 3. BYTE COUNT 4. Data Byte 1 5. Data Byte 2 6. Data Byte 3 7. Data Byte 4 8. Data Byte 5 9. Data Byte 6 10. Data Byte 7 11. Data Byte 8 12. Data Byte 9 13. Data Byte 10 14. Data Byte 11 15. Sum Check 4C = KWP send, but do not report FE and FF [details] Command Usage Command 4C sends a KWP request message and ignores responses from addresses FE and FF. This command is useful because some vehicles use source addresses FF and FE for non diagnostic purposes. In this case the data from these address is not useful to the user. Request Message Format 1. Destination Address 2. 4C 3. BYTE COUNT 4. Data Byte 1 5. Data Byte 2 6. Data Byte 3 7. Data Byte 4 8. Data Byte 5 9. Data Byte 6 10. Data Byte 7 11. Data Byte 8 12. Data Byte 9 13. Data Byte 10 14. Data Byte 11 15. Sum Check 4D = Reserved For Multiplex Engineering Use 4E = J1850 VPW send, with aggressive arbitration (version 47 and later) [details] Command Usage Command 4E will send the request message on the J1850 VPW bus with aggressive arbitration for use with the J1850 bus. This command waits the bare minimum time after the end of a J1850 VPW message, before attempting to send the J1850 VPW request message from the interface. This reduces the amount of time the interface waits before getting onto the bus to send its message. The reason to have this new command is to allow diagnostic messages to get through, even if the J1850 VPW bus traffic is happening at close to the maximum throughput. The normal J1850 VPW command (Command 02) was intentionally done with a long wait after the previous J1850 VPW message. This was done to avoid the risk of diagnostic messages overloading the J1850 VPW bus and causing operational errors. Due to the J1850 VPW bus loading on GM vehicles, this command is recommended. Request Message Format 1. Destination Address 2. 4E 3. BYTE COUNT 4. Data Byte 1 5. Data Byte 2 6. Data Byte 3 7. Data Byte 4 8. Data Byte 5 9. Data Byte 6 10. Data Byte 7 11. Data Byte 8 12. Data Byte 9 13. Data Byte 10 14. Data Byte 11 15. Sum Check 4F = ISO send, with 5 baud, user-programmable 5 baud address [details] Command Usage Command 4F sends and ISO request message with a custom 5 baud address. The custom 5 baud address is stored in Request Byte 14. This means the longest data message that can be sent with this command is 10 bytes long instead of the normal 11 byte maximum. Request Message Format 1. Destination Address 2. 4F 3. BYTE COUNT 4. Data Byte 1 5. Data Byte 2 6. Data Byte 3 7. Data Byte 4 8. Data Byte 5 9. Data Byte 6 10. Data Byte 7 11. Data Byte 8 12. Data Byte 9 13. Data Byte 10 14. Byte to be sent as 5 Baud ISO Address 15. Sum Check 80 = Send message on J1850 PWM with IFR (recommended for Ford) [details] Command Usage Command 80 sends a message on J1859 PWM with In Frame Response (IFR). In Frame Response is a internal handshake used by Ford vehicles. This is why we recommend using command 80 instead of command 04 when communicating with Ford vehicles. Request Message Format 1. Destina"
