["https://musichackdayindia.github.io/faq.html"]
title = "FAQs | Music Hack Day India"
description = "Music Hack Day India is a gathering of researchers, developers, creative coders, musicians, makers, engineers, audiophiles and more."
full_description = "1. Who can participate in the hackthon?Anyone who is curious to work with a interdiscplinary group of creative tech people are welcome. You don't neccessarily need to be a developer. The key thing is to find a relavant project and a team where you could provide your valuable domain-specific-skills.2. Is there any restriction on the topic and use-cases of my hack project?Anything and everything goes as long as it is audio related. However if you are interested in the prizes, we recommend you to target your project according to the various prize categories provided.3. Do I need to register for participating in the hackathon?Yes, you are required to register through the tickets page for participating in the hackathon.4. How many members are allowed per team? How do I find team members for the hackathon?The teams can have up to 3 members at max. Usually teams are formed during the event day. We encourage participants to form teams in advance if they choose to. You are welcome to use Music Tech Community's Discord server if you'd like to find potential candidates.5. Do I need to bring anything particular for hackathon?You are expected to bring your own laptops, hardwares or any other additional accessories that is required for your specific project. However, we provide a standard set of software tools, guides and limited hardware modules (subject to availability) at your disposal.6. Do I need a separate ticket to attend ADCx India 25?Yes, and you can purchase a clubbed version of the ticket that gives you access to all 3 days from 17th to 19th Jan 2025 which would include entry to ADCx India 25.7. Can I prepare my project before hand from home instead of doing it all during the hackathon?The real spirit of hackathon lies in hacking existing technologies, ie. whatever available at the moment to make interesting projects. However, you can always prepare the supporting technologies that is required to faciliate your hack project (ie, such as SDKs, APIs, Hardware boards etc).8. I came across the ADCx India 25 Diversity Grant Form. Does that apply to Music Hack Day India as well?No, however, we are happy to support you in any way we can so feel free to write to us on our email id mentioned below."
