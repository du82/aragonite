["https://musichackdayindia.github.io/2019/about"]
title = "About Music Hack Day India"
description = "Music Hack Day India, 2023"
full_description = "Music Hack Day India is a community-driven event where we would like programmers, artists, makers, academics and innovators to come together to ideate, develop and demo their vision of music technology’s future. No restrictions in terms of the medium of the hack - software (mobile, web, desktop), hardware (new instruments, modifications to existing ones). We are open to anything that lies within the boundaries of music technology (even better if the boundaries are extrapolated). One of our bigger goals of organizing such an event is to bring everyone working or interested in this field under one roof so that they can network and collaborate with each other by the means of working on these hacks and further push music tech scene in the Indian sub-continent. Music Hack Day India is an open, inclusive and interdisciplinary event. We follow the Berlin Code of Conduct for the event. Do you constantly wish that existing music tech solutions did something more than it already does? Are you often lost in thought wondering if there was a piece of tech that could do the craziest of things with music that you could come up with? Well, this is a chance to put your creative minds to work on bringing just those ideas to life! The hackathon starts with an introduction to the event and guidelines, followed by presentations by our chosen mentors, who will help participants with their ideas and questions. Participants network with each other, brainstorm, form teams and start building their projects. The hackathon will have 3 prizes for the Best Music Hack, Best Hardware Hack and Best Data Science Hack respectively. Remember, asking for help is more than okay! Our organisers and mentors will be delighted to help you explore and build on your ideas. All the IP/ownership of ideas and works done by the hackathon participants soley lies with themselves. We recommend you to also check out the videos of past music hack days (attached below in the youtube playlist) which were organised around the world."
