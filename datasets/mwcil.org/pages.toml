full_description = 'Peer Support Services>> Peer Support>> { "@context": "http://schema.org", "@type": "BreadcrumbList", "itemListElement": [ { "@type": "ListItem", "position": 2, "item": { "@id": "https://www.mwcil.org/core-services/", "name": "Services" } } , { "@type": "ListItem", "position": 3, "item": { "@id": "https://www.mwcil.org/core-services/peer-support/", "name": "Peer Support" } } ] } .breadcrumb-container { font-size: 13px; } .breadcrumb-container ul { margin: 0; padding: 0; } .breadcrumb-container li { box-sizing: unset; display: inline-block; margin: 0; padding: 0; } .breadcrumb-container li a { box-sizing: unset; padding: 0 10px; } .breadcrumb-container { } .breadcrumb-container li a { } .breadcrumb-container li .separator { color: #709abf !important; } .breadcrumb-container li:last-child .separator { display: none; } .breadcrumb-container.theme1 li { margin: 0; padding: 0; } .breadcrumb-container.theme1 a { background: ; display: inline-block; margin: 0 5px; padding: 5px 10px; text-decoration: none; } One-on-one peer mentoring helps people with disabilities develop mutual support, assistance, confidence and understanding. MWCIL provides peer support in a consumer-directed manner over the telephone, in person at the center, or in the community. MWCIL staff have been trained in the philosophies and practices of independent living and communicate these strategies to consumers in peer support interactions. Some staff members have personal experience with disabilities and share their insights with other staff members and consumers within the Peer Support Services framework.'
