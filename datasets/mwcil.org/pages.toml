["https://www.mwcil.org/donate"]
title = "Donate - MetroWest Center for Independent Living Your Donation will help!"
description = "Please donate to MetroWest Center for Independent Living so we can support more people to live independently and improve accessibility and civil rights."
full_description = 'Donate 2024 Framingham ADA Celebration. Rose (MWCIL) (Framingham Disability Commission) is standing in the middle! Donate>> { "@context": "http://schema.org", "@type": "BreadcrumbList", "itemListElement": [ { "@type": "ListItem", "position": 2, "item": { "@id": "https://www.mwcil.org/donate/", "name": "Donate" } } ] } .breadcrumb-container { font-size: 13px; } .breadcrumb-container ul { margin: 0; padding: 0; } .breadcrumb-container li { box-sizing: unset; display: inline-block; margin: 0; padding: 0; } .breadcrumb-container li a { box-sizing: unset; padding: 0 10px; } .breadcrumb-container { } .breadcrumb-container li a { } .breadcrumb-container li .separator { color: #709abf !important; } .breadcrumb-container li:last-child .separator { display: none; } .breadcrumb-container.theme1 li { margin: 0; padding: 0; } .breadcrumb-container.theme1 a { background: ; display: inline-block; margin: 0 5px; padding: 5px 10px; text-decoration: none; } Almost all of MWCIL’s consumers live at or below poverty level. The agency serves consumers of all ages and disabilities, helping them to live with dignity and independence. Perhaps you know our consumers as your neighbor or relative. All of the services provided by MWCIL are free to consumers. A leader in Independent Living, MWCIL receives government funds for independent living services and training for people with disabilities who seek employment. MWCIL provides direct services to some of its most vulnerable citizens, many of whom have been denied the right to make decisions about how and where to live their lives. But the need for services versus the amount the government will pay for widens daily. Your help is crucial to continue delivering high-quality services that inspire the testimonials on this page. Please contribute your tax-deductible gift today. “I have learned much about my rights as a disabled person through the Center. I think the money management skills I learned will last me a lifetime.” “MWCIL helped me navigate through many issues with MassHealth. I could not have done it without them.” “My interests are best represented with the help of MWCIL. I have not had much success dealing with housing problems alone.” Donate Today through PayPal Or Mail in a Check Payable to : MetroWest Center for Independent Living Mail to: MetroWest Center for Independent Living1 Clarks Hill, Suite 200Framingham, MA 01702 Thank You!'
