description = "TAP is specialized to work with young adults with disabilities who will be transitioning out of high school. Our mission is to work directly with young adults, help them determine their goals and find pathways to achieving these goals. By using the IL model, we ensure that young people learn to make their own decisions… Read More Transition to Adulthood (TAP)"
full_description = 'Transition to Adulthood (TAP) Services>> Transition to Adulthood (TAP)>> { "@context": "http://schema.org", "@type": "BreadcrumbList", "itemListElement": [ { "@type": "ListItem", "position": 2, "item": { "@id": "https://www.mwcil.org/core-services/", "name": "Services" } } , { "@type": "ListItem", "position": 3, "item": { "@id": "https://www.mwcil.org/core-services/transition-to-adulthood-tap/", "name": "Transition to Adulthood (TAP)" } } ] } .breadcrumb-container { font-size: 13px; } .breadcrumb-container ul { margin: 0; padding: 0; } .breadcrumb-container li { box-sizing: unset; display: inline-block; margin: 0; padding: 0; } .breadcrumb-container li a { box-sizing: unset; padding: 0 10px; } .breadcrumb-container { } .breadcrumb-container li a { } .breadcrumb-container li .separator { color: #709abf !important; } .breadcrumb-container li:last-child .separator { display: none; } .breadcrumb-container.theme1 li { margin: 0; padding: 0; } .breadcrumb-container.theme1 a { background: ; display: inline-block; margin: 0 5px; padding: 5px 10px; text-decoration: none; } TAP is specialized to work with young adults with disabilities who will be transitioning out of high school. Our mission is to work directly with young adults, help them determine their goals and find pathways to achieving these goals. By using the IL model, we ensure that young people learn to make their own decisions and live life to the fullest. Eligibility Any young adult, regardless of disability, who: is 14-22 years old Receives special education services or is in a post-graduation transition program through their high school Desires to become more independent Services The TAP program at MWCIL readies high school students for living on their own, finding work, and/or attending college or other training program. Social Skills Self-Advocacy Independent Living Skills Training Employment Assistive technology support IEP and ITP assistance Disability Rights education Preparing for College Photo: Erin, Youth Services Coordinator and Lou, IL Coordinator The Process Meetings are at the MWCIL office, in the community, and/or at the youth’s home Youth work with the TAP staff on a 1-1 basis TAP staff ask the youth to identify their goals, and how they would like to increase their independence. All work is individually based- content, pace, learning style, communication, and so on. MWCIL holds business hours of 9am-5pm, Monday-Friday, however, the scheduling of appointments revolves around the youth’s personal schedule. Appointments are typically an hour in length, and occur every other week. Image: Young couple at the 2014 Gardner ADA Celebration TAP Workshops All classes are hybrid; available both online with Zoom and in person. TAP Summer Social Group Every other Monday, 2:30-4:30pm. Starts July 15. Under 22 only. In Person: Limited to 10 people. Topics TBD. See the ...Read More Driving Permit Prep Workshops Get ready to hit the road with confidence! The Permit Prep Program at MWCIL provides essential knowledge and practice to ...Read More about Driving Prep Workshop Job Readiness Workshops New session begins October 10 Prepare for success in the workforce with a five-week job readiness course designed for high ...Read More about Job Readiness Workshop Healthy Relationships Workshops Unlock the secrets to thriving relationships and unleash your social potential with an exciting and empowering class designed specifically for ...Read More about Healthy Relationship Workshop Odyssey Planning Workshops New session begins Tuesday, October 3, 2023. “If you plan for nothing, you’re going to get nothing,” Bill Burnett, co-author ...Read More about Odyssey Workshop Workshops Calendar Events in March 2025 View as GridView as List MonthWeekDay Month January February March April May June July August September October November December Year 2023 2024 2025 Previous Today SunSunday MonMonday TueTuesday WedWednesday ThuThursday FriFriday SatSaturday 23February 23, 2