title = "Independent Living Skills Training - MetroWest Center for Independent Living"
full_description = 'Independent Living Skills Training Services>> Independent Living Skills Training>> { "@context": "http://schema.org", "@type": "BreadcrumbList", "itemListElement": [ { "@type": "ListItem", "position": 2, "item": { "@id": "https://www.mwcil.org/core-services/", "name": "Services" } } , { "@type": "ListItem", "position": 3, "item": { "@id": "https://www.mwcil.org/core-services/independent-living-skills/", "name": "Independent Living Skills Training" } } ] } .breadcrumb-container { font-size: 13px; } .breadcrumb-container ul { margin: 0; padding: 0; } .breadcrumb-container li { box-sizing: unset; display: inline-block; margin: 0; padding: 0; } .breadcrumb-container li a { box-sizing: unset; padding: 0 10px; } .breadcrumb-container { } .breadcrumb-container li a { } .breadcrumb-container li .separator { color: #709abf !important; } .breadcrumb-container li:last-child .separator { display: none; } .breadcrumb-container.theme1 li { margin: 0; padding: 0; } .breadcrumb-container.theme1 a { background: ; display: inline-block; margin: 0 5px; padding: 5px 10px; text-decoration: none; } Independent living skills training is personally tailored to each individual consumer’s goals. Some skills relate to personal growth, others relate to learning how to handle and navigate services and responsibilities, while others will address new information and challenges. A few of the goals that may require Independent Living Skills training are listed below: Social and Communication Skills Community Living / Housing Self-Advocacy / Self-Empowerment Education Information Access and Technology Mobility and Transportation Home and Financial Management Pre-Vocational Personal Resource Management Self-Care Photo: Tammy, an MWCIL consumer, speaks at the 2024 MassAbility Summit!'
