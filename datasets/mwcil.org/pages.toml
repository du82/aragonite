["https://mwcil.org"]
title = "Enhancing the Full Participation of Persons with Disabilities in the Community - MetroWest Center for Independent Living"
description = "Independent Living educates people with disabilities on services and skills to live as independently as possible, and to stay out of institutions."
full_description = 'Enhancing the Full Participation of Persons with Disabilities in the Community Staff December 2024Dan and Janna2024 Framingham ADA Celebration2024 Legislative Reception2024 NCIL Conference. MA attendees with McGovern staff, Isabella EdoDave and Yoshida Dart at Washington, D.C. rally, 20142019 Legislative BreakfastPaul speaking at PCA Rally 2019marchers at ADA 252014 Senate Action for Disability Treaty in Washington, D.C.Washington 2014 NCIL MarchMWCIL Staff (2023)<style type="text/css">#soliloquy-container-1233{opacity:1}</style> MetroWest Center for Independent Living provides an array of independent living services that enable people with disabilities to live in the community. The center was created by people with disabilities seeking full integration into society. We empower people with disabilities by teaching the practical skills and confidence to take control over their lives and become active members of the communities in which they live. We promote access and change within society while advocating for programs and services needed by people of all ages with a wide range of disabilities. MWCIL is a consumer‑controlled, community‑based, cross‑disability, nonresidential private nonprofit agency. We enable people with disabilities to gain freedom from nursing homes and other institutional settings. If you have a disability, live within our area (26 towns in Metrowest section of Massachusetts) and have needs, goals, or barriers related to your living independently, then contact us at 508-875-7853. News from MWCIL Governor Healey Announces Comprehensive Housing Plan February 26, 2025: The Healey-Driscoll Administration today released the initial results of Massachusetts’ first comprehensive ... Annual Report Available The 2024 MetroWest Center for Independent Living Annual Report (pdf) is now available. The report ... Snow Removal Guidance Snow removal and accessibility in Massachusetts From Mass Office on Disability (MOD) Standards for accessibility, ... 2024 Framingham flies disability rights flag Quick Links Services – Coordinators at MWCIL can help you achieve your goals for living independently in the community Resources – An extensive list of local, statewide and national online resources. IL Philosophy – Learn about the Independent Living, and civil rights for persons with disabilities. Housing Transportation Food Contact us PCAs Find a MA IL Center Donate! MetroWest Center for Independent Living is a scent-free environment. Please keep this in mind when you plan a visit. SearchSearch MWCIL is seeking additional Board Members. Learn more about this opportunity to join our BOD. Job Openings Brochures MWCIL brochure.pdf MWCIL brochure.docx MWCIL brochure.txt Spanish MWCIL brochure.pdf Portuguese MWCIL brochure.pdf Staff Email MWCIL Staff Email Service Area Ashland, Bellingham, Dover, Foxboro, Framingham, Franklin, Holliston, Hopkinton, Hudson, Marlborough, Maynard, Medfield, Medway, Millis, Natick, Needham, Norfolk, Plainville, Sherborn, Southborough, Stow, Sudbury, Wayland, Wellesley, Weston and Wrentham MA Tales of Independence Visit our video project of Massachusetts people with disabilities! MATalesofIndependence.net is a collection of the personal stories of Massachusetts people with disabilities and how they have achieved independence. Each person’s story is different showing the many varied paths to independence.'
