["https://www.mwcil.org/about"]
title = "About - MetroWest Center for Independent Living"
description = "MWCIL Service Area, and Independent Living philosophy for people with disabilities seeking self-determination, self-respect and equal opportunities."
full_description = "About Service Area Based in Framingham, our 26 town service area includes the following cities and towns: Ashland, Bellingham, Dover, Foxboro, Framingham, Franklin, Holliston, Hopkinton, Hudson, Marlboro, Maynard, Medfield, Medway, Millis, Natick, Needham, Norfolk, Plainville, Sherborn, Southboro, Stow, Sudbury, Wayland, Wellesley, Weston and Wrentham. Who We Are Independent Living is a philosophy and a worldwide movement by people with disabilities for self-determination, self-respect and equal opportunities. All individuals have the right to choose the services that they want to receive and to make decisions about how to live their lives. The purpose of the Independent Living Movement is to remove barriers for people with disabilities. Disabled people are entitled to have the same opportunities for raising families of their own, getting an education and working. The outdated and predominantly medical view which portrays people with disabilities as sick continues to have negative and real consequences for all of society. Independent Living Centers across the country work towards empowering people with disabilities to live productive and independent lives within their communities. Video about MWCIL"
