title = "Transition - MetroWest Center for Independent Living"
description = "Since 2015, Transition has been recognized by the Administration for Community Living as a fifth core service. At MWCIL, we have always supplied transition services as we move consumers from institutions to the community, as we work with youths transitioning to adulthood, and as we aid consumers living with changing disabilities to maintain their independence.… Read More Transition"
full_description = 'Transition Services>> Transition>> { "@context": "http://schema.org", "@type": "BreadcrumbList", "itemListElement": [ { "@type": "ListItem", "position": 2, "item": { "@id": "https://www.mwcil.org/core-services/", "name": "Services" } } , { "@type": "ListItem", "position": 3, "item": { "@id": "https://www.mwcil.org/core-services/transition/", "name": "Transition" } } ] } .breadcrumb-container { font-size: 13px; } .breadcrumb-container ul { margin: 0; padding: 0; } .breadcrumb-container li { box-sizing: unset; display: inline-block; margin: 0; padding: 0; } .breadcrumb-container li a { box-sizing: unset; padding: 0 10px; } .breadcrumb-container { } .breadcrumb-container li a { } .breadcrumb-container li .separator { color: #709abf !important; } .breadcrumb-container li:last-child .separator { display: none; } .breadcrumb-container.theme1 li { margin: 0; padding: 0; } .breadcrumb-container.theme1 a { background: ; display: inline-block; margin: 0 5px; padding: 5px 10px; text-decoration: none; } Since 2015, Transition has been recognized by the Administration for Community Living as a fifth core service. At MWCIL, we have always supplied transition services as we move consumers from institutions to the community, as we work with youths transitioning to adulthood, and as we aid consumers living with changing disabilities to maintain their independence. Nursing Home Transitions are arguably our most important services. Independent Living began with the battle to escape institutions for a life in the community. For a person who has been in an institution for awhile, the move to one’s own home can seem daunting. The tasks of finding accessible and affordable housing, determining and setting up services, budgeting, planning meals, etc. take time and effort, but the Transition Coordinators at MWCIL will ensure that your transition is successful. No one deserves to live in an institution. The Moving Forward Plan Waivers are designed to help MassHealth-eligible persons move from a nursing facility or chronic disease, rehabilitation, or psychiatric hospital back to their community. The MFP waivers help by making the move from the facility to the community easier and by providing community-based services. To qualify for MFP an individual must: Currently live in a nursing facility, chronic disease or rehabilitation hospital (including a public health hospital), intermediate care facility for people with intellectual disabilities, or certain psychiatric hospital settings, for at least 90 consecutive days, excluding Medicare rehabilitation days. Our other key transition is the Transition to Adulthood Program for youth.'
