full_description = '''Staff About>> Staff>> { "@context": "http://schema.org", "@type": "BreadcrumbList", "itemListElement": [ { "@type": "ListItem", "position": 2, "item": { "@id": "https://www.mwcil.org/about/", "name": "About" } } , { "@type": "ListItem", "position": 3, "item": { "@id": "https://www.mwcil.org/about/staff-2/", "name": "Staff" } } ] } .breadcrumb-container { font-size: 13px; } .breadcrumb-container ul { margin: 0; padding: 0; } .breadcrumb-container li { box-sizing: unset; display: inline-block; margin: 0; padding: 0; } .breadcrumb-container li a { box-sizing: unset; padding: 0 10px; } .breadcrumb-container { } .breadcrumb-container li a { } .breadcrumb-container li .separator { color: #709abf !important; } .breadcrumb-container li:last-child .separator { display: none; } .breadcrumb-container.theme1 li { margin: 0; padding: 0; } .breadcrumb-container.theme1 a { background: ; display: inline-block; margin: 0 5px; padding: 5px 10px; text-decoration: none; } The staff at MWCIL are experts on the available services, skills and advocacy needed to support and promote independent living. Most have personal experience with disabilities, and understand the challenges that people with disabilities might encounter. Counselors and Coordinators work one-on-one so that consumers have all the information they need to make their own best choices. Independent Living Coordinators work on long term goals. Options Counselors work on a short term basis to provide support and information so that individuals can remain in the community. “Your people at the CIL must come to understand that their job is to provide Permission, Encouragement and Support. That is it. No less and no more. They can do it. Each is capable. But they gotta wanna.” —Roland Sykes, 2004 Sadie Simone, Executive Director As of April 3, 2023, Sadie Simone is MWCIL's Executive Director. Sadie brings a wealth of experience and expertise in ...Read More about Sadie Rose Quinn, Assistant Director Rose has worked at the center since 1991, making her our longest-serving employee. In her role as Assistant Director, she ...Read More about Rose David Correia – Advocacy Director In his role as Director of Advocacy, David focuses on networking, collaboration and education. He works with legislators and others ...Read More about David Danya DelMonaco – Director of Services As the Director of Services, Danya’s primary responsibility is supervising all of the direct service staff. In addition she meets ...Read More about Danya Dan Henderson – Independent Living Coordinator Dan started as an IL Coordinator at MWCIL in January 2019. Dan's prior professional experience includes working with and advocating ...Read More about Dan Louis Keating – Independent Living Coordinator Lou started at MWCIL in February 2019 as a IL Coordinator. Prior to coming to Metro West Lou worked as ...Read More about Lou Brittney Trifero – Independent Living Coordinator Brittney joined the MWCIL team in 2022. She has an earned Bachelor’s of Arts in English and her prior professional ...Read More about Brittney Erin Basler – Youth Services Coordinator More information coming soon ...Read more about Erin Janna Schrandt – Community Transition Coordinator Janna joined MWCIL as the Community Transition Coordinator with an additional role as a Care Coordinator for CCA (Commonwealth Care ...Read more about Janna Olivia Wakefield – IL Coordinator ...Read More about Olivia Diane Carr- Administrative Assistant More information coming soon ...Read More about Diane Wini McGraw – Executive Assistant Information not available at this time ...Read More about Wini Sue Rorke – Information and Social Networking Specialist As Information Specialist, Sue works on the websites, the newsletter, and printed materials such as the annual report and gala ...Read More about Sue'''
