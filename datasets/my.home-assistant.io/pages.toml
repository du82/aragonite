["https://my.home-assistant.io/faq.html"]
title = "FAQ – My Home Assistant"
description = "Answers to all your questions about My Home Assistant."
full_description = 'To be more helpful, the documentation wants to link the user to a specific page in their instance. However, each Home Assistant instance is hosted at a different url. My Home Assistant allows users to store the URL of their instance so that the documentation can link the user directly to the right page in their instance. All the data is stored in your browser. At no point will any data leave your network. My Home Assistant only redirects you to pages that provide you with information about your instance or help you start an action. This website requires you to run at least Home Assistant 2021.3 and have the "my" integration enabled. No, this is not possible. All links and their parameters are pre-defined in this website and in the "my" integration in Home Assistant.'
year_published = 2025
clearnet = "https://my.home-assistant.io/faq.html"
tags = ["asked", "frequently", "questions"]
language = "en"
