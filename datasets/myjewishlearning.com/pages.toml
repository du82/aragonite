title = "Jewish Prayer for the Sick: Mi Sheberach | My Jewish Learning"
description = "Prayer For the Sick. The Torah Service. Jewish Prayer Book. Jewish Liturgical Texts. Jewish Prayerbooks. Jewish Texts."
full_description = '''Pray Jewish Prayer for the Sick: Mi Sheberach A healing prayer for when a loved one is suffering. By Rabbi Simkha Y. Weintraub Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-leaderboard', baseDivId: 'pb-slot-leaderboard-top', } ]); }); Share facebook You might also like <img src="https://www.myjewishlearning.com/wp-content/themes/myjewishlearning/images/placeholders/no-image-sm.svg" alt="No Image" class="m-card__media"> Visiting the Sick in Judaism Study The Mourner’s Kaddish: A Memorial Prayer in Praise of God Mourn One of the central Jewish prayers for those who are ill or recovering from illness or accidents is the Mi Sheberach. The name is taken from its first two Hebrew words. With a holistic view of humankind, it prays for physical cure as well as spiritual healing, asking for blessing, compassion, restoration, and strength, within the community of others facing illness as well as all Jews, all human beings. Traditionally, the Mi Sheberach is said in synagogue when the Torah is read. If the patient herself/himself cannot be at services, a close relative or friend might be called up to the Torah for an honor, and the one leading services will offer this prayer, filling in the name of the one who is ill and her/his parents. Many congregations sing the version of the Mi Sheberach written by Debbie Friedman, a popular Jewish folk musician who focused on liturgical music. (That version can heard in the video, and its lyrics read, at the top of this article.)Increasingly, the Mi Sheberach has moved into other settings and other junctures. Chaplains, doctors, nurses, and social workers are now joining patients and those close to them in saying the Mi Sheberach at various junctures—before and after surgery, during treatments, upon admission or discharge, on the anniversary of diagnosis, and more. We present it to you here, in English translation and in transliteration from the Hebrew, as a resource for you as you confront the challenges of illness. The Hebrew text can be found here.Sign up to join My Jewish Learning’s Misheberach Moment, a weekly communal recitation of Mi Sheberach. Support My Jewish Learning Help us keep Jewish knowledge accessible to millions of people around the world. Your donation to My Jewish Learning fuels endless journeys of Jewish discovery. With your help, My Jewish Learning can continue to provide nonstop opportunities for learning, connection and growth. Donate Listen to Mi Sheberach (courtesy of Mechon Hadar) Mi Sheberach in English TranslationMay the One who blessed our ancestors —Patriarchs Abraham, Isaac, and Jacob,Matriarchs Sarah, Rebecca, Rachel, and Leah —bless and heal the one who is ill:________________ son/daughter of ________________ .May the Holy Blessed Oneoverflow with compassion upon him/her,to restore him/her,to heal him/her,to strengthen him/her,to enliven him/her.The One will send him/her, speedily,a complete healing —healing of the soul and healing of the body —along with all the ill,among the people of Israel and all humankind,soon,speedily,without delay,and let us all say: Amen!Mi Sheberach in Hebrew TransliterationThe transliterated text below presents the prayer with correct pronouns for male and female patients. The word before the slash is for males, the one after for females.Mi SheberachAvoteinu: Avraham, Yitzhak, v’Yaakov,v’Imoteinu: Sarah, Rivka, Rachel v’Leah,Hu yivarech virapeiet hacholeh/hacholah _____________ ben/bat ______________HaKadosh Baruch Huyimalei rachamim alav/aleha,l’hachalimo/l’hachlimah,u-l’rap’oto/u-l’rap’otah,l’hachaziko/l’hazikah,u-l’chay-oto/u-l’chay-otah.V’yishlach lo/lah bim-herar’fuah shlemah,r’fu-at hanefesh u-r’fu-at hagoof,b’toch sh’ar cholei Yisrael v’cholei yoshvei tevel,hashta ba’agalah u-vizman kariv,v’no-mar, Amen!Reprinted with permission of the National Center for Jewish Healing, a program of the Jewish Board of Family and Children’s Services.Sign up for a Journey Through Grief & Mourning: Whether you have lost a loved one recently or just want to learn the basics of Jewish mourning rituals, this 8-part email series will guide you through everything you need to know and help you feel supported and comforted at a difficult time.Sign up to join My Jewish Learning’s Misheberach Moment, a weekly communal recitation of Mi Sheberach.Looking for a way to say Mourner’s Kaddish in a minyan? My Jewish Learning’s daily online minyan gives mourners and others an opportunity to say Kaddish in community and learn from leading rabbis. Share facebook Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-text', baseDivId: 'pb-slot-text-ad', } ], true); }); Sign Up for Our Newsletter Get Jewish wisdom & discovery in your inbox Email Sign Up By submitting I agree to the privacy policy. Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-rail', baseDivId: 'pb-slot-incontent-1', } ]); }); Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-leaderboard-bottom', baseDivId: 'pb-slot-leaderboard-bottom', } ]); }); My Jewish Learning is a not-for-profit and relies on your help Donate'''
