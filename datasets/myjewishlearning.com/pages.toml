description = "My Jewish Learning is your digital home for Jewish discovery. We offer thousands of articles, videos and other resources to help you navigate all aspects of Judaism and Jewish life — from food to history to beliefs and practices, no matter what your Jewish background is."
full_description = "About My Jewish Learning My Jewish Learning is all about empowering Jewish discovery for anyone interested in learning more. We offer thousands of articles, videos and other resources to help you navigate all aspects of Judaism and Jewish life — from food to history to beliefs and practices. Our site is geared toward all backgrounds and level of knowledge. So whether you’re a Hebrew school dropout seeking a refresher on how to light the Hanukkah menorah or a synagogue president looking for a new perspective on the week’s Torah portion or a newcomer contemplating converting to Judaism — we have something for you. If you like what you see, sign up for our daily newsletter. My Jewish Learning was launched in 2003 and is now a part of 70 Faces Media, the largest nonprofit, nondenominational Jewish media organization in North America. Interested in advertising? Contact ads@myjewishlearning.com. Having trouble finding something or want to offer a suggestion? Email us at community@myjewishlearning.com. Our Funders Terms of Use and Re-Using Content Privacy Policy Rediscover My Jewish Learning Advertising Policies"
