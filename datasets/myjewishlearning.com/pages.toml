title = "Hamotzi: The Deeper Significance of the Blessing over Bread | My Jewish Learning"
description = "Ha-Motzi - Significane of the Blessing over the Bread. Jewish Blessings. Themes and Theology of Jewish Prayer."
full_description = '''Blessings for Food Hamotzi: The Deeper Significance of the Blessing over Bread These simple words mask a subtle theological statement about the primordial past and the perfected "world to come." By Rabbi Lawrence A. Hoffman Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-leaderboard', baseDivId: 'pb-slot-leaderboard-top', } ]); }); Share facebook You might also like Ask the Expert: Silence Before Bread Shabbat Ask the Expert: For Shabbat, Can I Use a Different Type of Bread Instead of Challah? Eat My Jewish Learning is a not-for-profit and relies on your help Donate Technically, a meal is considered any repast in which bread is consumed, so Jewish meals begin with the blessing over bread and then the sharing of bread together. The accompanying blessing is widely known to most Jews, who have heard it since childhood and who may even have memorized it just by having said it so often.Many Jews follow traditional Jewish precedent by beginning every meal this way; others reserve it for festive occasions like wedding banquets or holiday dinners. In any case, saying it accomplishes two things. First, it draws attention to the privilege of having food to eat. Second, the blessing’s words connect an ordinary meal with a symbolic lesson about the end of time.Read and listen to the full text of Hamotzi, the blessing over bread, and other Shabbat blessings, here!The words of the blessings are succinct and to the point: “Blessed are You, Adonai our God, ruler of the universe, who brings forth bread from the earth.” (Barukh ata Adonai Eloheinu melekh ha’olam hamotzi lehem min ha’aretz.) Find the Hebrew text and audio of the Hamotzi here. Support My Jewish Learning Help us keep Jewish knowledge accessible to millions of people around the world. Your donation to My Jewish Learning fuels endless journeys of Jewish discovery. With your help, My Jewish Learning can continue to provide nonstop opportunities for learning, connection and growth. Donate Giving Thanks for the “Delivery System”It is normal for blessings over food to refer to the means, or “delivery system,” by which food comes to us. Apples, for instance, call forth the blessing “Blessed are You … who creates the fruit of the tree.” Potatoes get “Blessed are You … who creates the fruit of the earth.” So referring to God as the One who “brings forth bread from the earth” is not altogether unexpected.But bread does not actually come from the earth, except in its raw form as grain—so the blessing ought to have referred to the grain, not to the finished product, bread. That, at least, is what the Rabbis imply in two laconic but insightful comments.Bread in the Garden of EdenThe first comes from a midrash called B’reishit Rabbah, part of a many-volume compilation of rabbinic comments covering several books of the Bible. In this one, a fifth-century collection of midrash to Genesis, we find a discussion of the various kinds of trees that must have existed in the Garden of Eden. God tells Adam and Eve that they may not eat from a particular tree, “the tree of knowledge of good and evil” (Genesis 2:18), otherwise identified as “the tree in the middle of the garden” (Genesis 3:3). But all the other trees were available for their pleasure, and the Rabbis musingly wonder what they were. This was Eden, after all-pure paradise. Surely Eden had trees that far excelled the ones we now know.Rabbi Z’ira thinks Eden was so perfect that it contained “bread trees as large as the cedars of Lebanon.” He draws his lesson from the fact that when Adam and Eve are expelled from the garden, God says, “Because you ate of the tree of which I commanded you, saying, ‘You shall not eat of it’…by the sweat of your brow shall you get bread to eat.’ Rabbi Z’ira concludes that before the expulsion they must not have had to bake their own bread.What It Takes to Bring Bread to Our TablesToday, most of us just walk into a bakery to buy bread, but Rabbi Z’ira knew how hard it is to make it. Everywhere in antiquity, and in much of the world still today, farmers first plough the earth by animal-drawn implements that are hard to use; then they sow the seed by hand. Thereafter, they anxiously wait and pray for rain, without which there will be no crops come spring.Even if the grain does grow and ripen, there is still the hard task of reaping it and sorting it so that inedible matter is removed. The grain must then be extracted from the husk by threshing. Then it is winnowed—that is, tossed into the air with a pitchfork so that the lightweight coverings of the kernels, called chaff, are blown away, leaving only the heavier kernels themselves that can be ground into flour. The flour now is sifted, again to separate out any foreign matter, then mixed with liquid and kneaded into dough. Only then can baking occur.Keenly aware of the intensive labor that goes into bread, rabbinic imagination conjured up an Eden-like existence where fresh and finished loaves of bread actually do grow on trees. Already, then, we have the moral lesson against taking the bread we eat for granted.Once and Future Paradise—with BreadBut there is more. The Rabbis perceived time as being divided into three eras: a mythical time past, when everything was perfect and Eden-like, and when bread growing on trees could be consumed without labor; the reality of time now, the era of historical time in which we live, when we get our bread with difficulty so that we are lucky to have any food at all; and a hoped-for time to come, a messianic age at the end of days when paradise would return just as in the days of the Garden of Eden.Rabbi Nehemiah and the rabbinic majority disagreed about the benediction that we say over bread. Rabbi Nehemiah said, “The blessing that we say, ‘Blessed are You … who brings forth bread from the earth,’ refers to the fact that God brought it forth from the earth in the past.” The rabbinic majority maintained, “The blessing refers to the fact that God will bring it forth from the earth in the future.”Surprisingly, neither party holds that the blessing over bread refers to the actual bread that we hold in our hands at the time when the blessing is said. Rabbi Nehemiah’s minority view is that our daily bread reminds us of time past, when bread trees grew from Eden’s soil. The majority, and therefore the official Jewish wisdom today, identifies the bread of the blessing as the bread of a messianic future. Our blessing is much more than a vote of thanks for our daily food. It constitutes also a statement of faith in a time to come when all will have enough to eat, free of the backbreaking work that is now required by most of the world’s population just to put food on the table.Reprinted with permission from The Way Into Jewish Prayer (Jewish Lights). Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-text', baseDivId: 'pb-slot-text-ad', } ], true); }); Adonai <audio src="https://www.myjewishlearning.com/wp-content/uploads/2017/03/adonai.mp3" controls> Your browser does not support the &lt;code&gt;audio&lt;/code&gt; element. </audio> Pronounced: ah-doe-NYE, Origin: Hebrew, a name for God. Support My Jewish Learning Help us keep Jewish knowledge accessible to millions of people around the world. Your donation to My Jewish Learning fuels endless journeys of Jewish discovery. With your help, My Jewish Learning can continue to provide nonstop opportunities for learning, connection and growth. Donate hamotzi <audio src="https://www.myjewishlearning.com/wp-content/uploads/2017/03/hamotzi.mp3" controls> Your browser does not support the &lt;code&gt;audio&lt;/code&gt; element. </audio> Pronounced: ha-MOE-tzee, Origin: Hebrew, blessing said over bread. On Shabbat Hamotzi is usually said over challah. Support My Jewish Learning Help us keep Jewish knowledge accessible to millions of people around the world. Your donation to My Jewish Learning fuels endless journeys of Jewish discovery. With your help, My Jewish Learning can continue to provide nonstop opportunities for learning, connection and growth. Donate Sign Up for Our Newsletter Get Jewish wisdom & discovery in your inbox Email Sign Up By submitting I agree to the privacy policy. Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-rail', baseDivId: 'pb-slot-incontent-1', } ]); }); Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-leaderboard-bottom', baseDivId: 'pb-slot-leaderboard-bottom', } ]); });'''
