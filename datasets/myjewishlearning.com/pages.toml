full_description = '''Pray Say Kaddish Online With MJL Join us six days a week for a live Torah lesson followed by the Mourner's Kaddish. By My Jewish Learning Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-leaderboard', baseDivId: 'pb-slot-leaderboard-top', } ]); }); Share facebook You might also like Text of Avinu Malkeinu Pray Why Music is Fundamental to Jewish Prayer Pray My Jewish Learning is a not-for-profit and relies on your help Donate My Jewish Learning hosts an online minyan Sunday-Friday for those who wish to say Kaddish. The minyan is held every Monday-Friday at 4:00 PM U.S. Eastern time (2:00 PM on Fridays in the winter), and at 10:00 AM U.S. Eastern time on Sundays. Each session is led by a rabbi who will offer some words of Torah followed by the recitation of the Mourner’s Kaddish in the presence of an online minyan.Enter your email below for daily reminders to join the minyan. Email* /* <![CDATA[ */ gform.initializeOnLoaded( function() {gformInitSpinner( 55, 'https://www.myjewishlearning.com/wp-content/plugins/gravityforms/images/spinner.svg', true );jQuery('#gform_ajax_frame_55').on('load',function(){var contents = jQuery(this).contents().find('*').html();var is_postback = contents.indexOf('GF_AJAX_POSTBACK') >= 0;if(!is_postback){return;}var form_content = jQuery(this).contents().find('#gform_wrapper_55');var is_confirmation = jQuery(this).contents().find('#gform_confirmation_wrapper_55').length > 0;var is_redirect = contents.indexOf('gformRedirect(){') >= 0;var is_form = form_content.length > 0 && ! is_redirect && ! is_confirmation;var mt = parseInt(jQuery('html').css('margin-top'), 10) + parseInt(jQuery('body').css('margin-top'), 10) + 100;if(is_form){jQuery('#gform_wrapper_55').html(form_content.html());if(form_content.hasClass('gform_validation_error')){jQuery('#gform_wrapper_55').addClass('gform_validation_error');} else {jQuery('#gform_wrapper_55').removeCla