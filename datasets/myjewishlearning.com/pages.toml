oard certified chaplain who has previously served as the Director of Spiritual Care at Elmhurst and NYU Langone Hospitals.MONDAY: Rabbi Rachel Isaacs Rabbi Rachel Isaacs is the director of the Center for Small Town Jewish Life at Colby College where she holds the Dorothy “Bibby” Levine Alfond chair in Jewish Studies. She is also the spiritual leader of Beth Israel Congregation in Waterville, Maine.TUESDAY: Rabbi Tiferet Berenbaum or Rabbi Sarah Bracha Gershuny Rabbi Tiferet Berenbaum is the director of congregational learning and programming at Temple Beth Zion in Brookline, MA. She received rabbinic ordination and a MA in Jewish Education from Hebrew College in Boston. She has served as rabbi to congregations in Milwaukee, WI and Mt. Holly, NJ. Kohenet Rabbi Sarah Bracha Gershuny is a writer, ritualist, musician, healer and teacher. She’d like to help humanity evolve to its naturally more cooperative and benevolent frequency, and is interested in how Judaism can help.WEDNESDAY: Rabbi Menachem Creditor Rabbi Menachem Creditor serves as the Pearl and Ira Meyer Scholar in Residence at UJA-Federation New York and was the founder of Rabbis Against Gun Violence. A frequent speaker in communities and campuses around the US and Israel with over 1 million views of his online videos and essays, he was named by Newsweek as one of the 50 most influential rabbis in America.THURSDAY: Rabbi Danielle Upbin Rabbi Danielle Upbin is the associate rabbi and prayer leader at Congregation Beth Shalom. Originally from New York City. She graduated with honors from Barnard College, Columbia University, with a BA in Political Science. She was ordained from the Jewish Theological Seminary in 2002. She has lived and studied in Israel, including a year of exploration in Jewish mysticism and art.FRIDAY: Rabbi Sari Laufer Rabbi Sari Laufer is the director of congregational engagement at Stephen Wise Temple in Los Angeles. A cum laude graduate of Northwestern University, Rabbi Laufer was ordained by Hebrew Union College-Jewish Institute of Religion, Los Angeles. Rabbi Laufer is a teacher of those young and young-at-heart, bringing her passion for rabbinic texts, social justice, and Judaism’s wisdom and relevance in the 21st century into the lives of those with whom she is privileged to learn and to share. Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-text', baseDivId: 'pb-slot-text-ad', } ], true); }); Sign Up for Our Newsletter Get Jewish wisdom & discovery in your inbox Email Sign Up By submitting I agree to the privacy policy. Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-rail', baseDivId: 'pb-slot-incontent-1', } ]); }); Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-leaderboard-bottom', baseDivId: 'pb-slot-leaderboard-bottom', } ]); });'''
