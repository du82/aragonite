["https://www.myjewishlearning.com/article/similar-jewish-words-you-dont-want-to-mix-up"]
title = "Similar Jewish Words You Don't Want to Mix Up | My Jewish Learning"
description = "It can be hard to pronounce and keep straight the myriad Jewish words and phrases in common parlance. Especially because ..."
full_description = "Jewish Languages Similar Jewish Words You Don’t Want to Mix Up From kibbitz/kibbutz to mitzvah/mikveh, we round up some easily confused Hebrew and Yiddish terms. By My Jewish Learning Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-leaderboard', baseDivId: 'pb-slot-leaderboard-top', } ]); }); Share facebook You might also like A Guide to Jewish Acronyms and Abbreviations FAQ The 11 Best Ladino Expressions and Phrases To Know Ladino My Jewish Learning is a not-for-profit and relies on your help Donate It can be hard to pronounce and keep straight the myriad Jewish words and phrases in common parlance. Especially because for those of us who are not native Hebrew or Yiddish speakers (or who have the auto-correct function on our phones), many of these words and phrases sound similar to one another.Below are some common Jewish words paired with their verbal doppelgangers — words that sound similar, yet have vastly different meanings. To spare you some potential embarrassment, we explain it all in alphabetical order below.Did we miss some important ones? Comment below or email us at community@myjewishlearning.com.1. Challah and KallahChallah (חלה), pronounced KHAH-luh, is the braided bread traditionally served on Shabbat. Find some great challah recipes here. Kallah (כּלה), pronounced KAH-luh, is Hebrew for “bride.” Support My Jewish Learning Help us keep Jewish knowledge accessible to millions of people around the world. Your donation to My Jewish Learning fuels endless journeys of Jewish discovery. With your help, My Jewish Learning can continue to provide nonstop opportunities for learning, connection and growth. Donate 2. Chesed (or Hesed) and Hasid (or Chasid)Chesed (חסד), pronounced KHEH-sed, is usually translated as “lovingkindness,” and describes acts such as visiting the sick and helping the poor. Hasid (חסיד), pronounced KHAH-sid,is a Hasidic Jew, someone who is part of an ultra-Orthodox spiritual movement that began in late 18th-century Europe and comes from the same Hebrew root as chesed.3. Chodesh and KodeshChodesh (חודשׁ), pronounced KHOH-desh, is Hebrew for “month,” and is most often used in the term Rosh Chodesh, the celebration marking the beginning of each new Jewish month. Kodesh (קודשׁ), pronounced KOH-desh, is Hebrew for “holy,” as in sefer kodesh (holy book), am kodesh (holy people) and limmudei kodesh (holy studies).4. Chuppah and Chutzpah (Marc Love/Flickr) Chuppah (חופּה), pronounced KHOO-pah (oo as in book) or khu-PAH, is a Jewish wedding canopy. Chutzpah (חוצפּה), pronounced KHOOTZ-pah (oo as in book) or khootz-PAH, is Yiddish (and Hebrew) for “nerve” or “audacity.”5. Eruv and Erev An eruv in Bnei Brak, Israel. Eruv (עירוב), pronounced AY-ruhv or ay-RUVE, is a boundary inside of which Shabbat-observant Jews are allowed to carry items or push strollers on Shabbat. Erev (ערב), pronounced EH-rehv, means “evening,” and commonly refers to the first night of a Jewish holiday and sometimes the day before the holiday, as in Erev Yom Kippur.6. Hamsa, Hametz and HummusHamsa (חמסה), pronounced HAHM-suh, is a hand-shaped amulet. Hametz (חמץ), pronounced khah-METZ, is leavened food traditionally avoided during Passover. Learn more about keeping kosher for Passover. Hummus (חומוס), pronounced KHOOM-oos (oo as in book) or KHOOM-oos (oo as in food) is a chickpea puree popular in Israel and throughout the Middle East. Find hummus recipes here.7. Kibbitz and Kibbutz Kibbutz Na’an in central Israel, 1938. (Zoltan Kluger/Israel GPO) Kibbitz (קבּץ), pronounced KIB-itz, is Yiddish for chat or small talk, as in “I ran into my friend at the store and kibbitzed with her.” Kibbutz (קיבּוץ), pronounced kee-BOOTZ, is a collectively run residential and economic community in Israel.8. Kiddush and Kaddish U.S. Air Force Rabb Sarah D. Schechter leads Kiddush at Lackland Air Force Base in San Antonio. (Lance Cheung/U.S. Air Force) Kiddush (קידושׁ), pronounced KID-dish or kee-DOOSH (oo as in boot), is the blessing that is said over wine to sanctify Shabbat. (It comes from the same root as kodesh, meaning “holy.”) Kaddish (קדישׁ), pronounced KAH-dish, usually refers to the Mourner’s Kaddish, an Aramaic prayer said during all Jewish worship services where a minyan is present. (It also shares a root with kodesh.)9. Mashgiach and MoshiachMashgiach (משׁגיח), pronounced mahsh-GHEE-ahkh, is a person who supervises a commercial or institutional kosher kitchen and ensures that dietary laws are observed. Moshiach (משׁיח), pronounced moe-SHEE-ahkh, is Hebrew for “messiah.”10. Mikveh and MitzvahMikveh (מקוה), pronounced MIK-vuh or meek-VAH, is a Jewish ritual bath. Mitzvah (מצוה), pronounced MITZ-vuh or meetz-VAH, is Hebrew for commandment.11. Seder and Siddur (Documenting Maine Jewry) Seder (סדר), pronounced SAY-der, is a ritual meal that follows a certain order, usually used to refer to the Passover seder (like the one above). However, many Sephardic Jews also have a Rosh Hashanah seder, and the holiday of Tu Bishvat (the birthday of the trees) also has a seder. Siddur (סידור), pronounced SIDD-er or see-DOHR, is a Jewish prayer book. Like seder, it derives from the Hebrew root samech (ס), dalet (ד), reysh (ר), which means “order.”12. Sheitel, Shtetl, Shtiebel and Shtreimel (Yves Mozelsio/Magnes Collection of Jewish Art, University of California, Berkeley) Sheitel (שייטל), pronounced SHAY-tull, is Yiddish for a wig that some Orthodox women wear to cover their hair after they marry. Shtetl (שׁטעטל), pronounced SHTEH-tull, is the term for a historic Eastern European village with a significant Jewish community. Shtiebel (שטיבל), pronounced SHTEE-bull, is a small synagogue, usually referring to a small ultra-Orthodox synagogue. Shtreimel (שטריימל), pronounced SHTRY-mull, is a type of fur hat worn by some Hasidic men.13. Simcha and Smicha (FengLong Photography/Flickr) Simcha (שׂמחה), pronounced SIM-khuh or seem-KHAH, is Hebrew for “joy” and is used to refer to a joyous Jewish occasion, such as a wedding or bar/bat mitzvah. Smicha (סמיכה), pronounced SMEE-khuh or smee-KHAH, is Hebrew for rabbinic ordination.14. Tisha B’Av, Tu Bishvat and Tu B’Av A Tisha B’Av service in Jerusalem. (Brian Negin/Flickr) Tisha B’Av (תשׁע בּאב), pronounced TISH-uh bahv, is the ninth of the Jewish month of Av, a day of mourning commemorating the destruction of the ancient temples in Jerusalem. Tu Bishvat (ט״ו בּשׁבט), pronounced too bish-VAHT (oo as in boot), is the 15th of the Jewish month of Shevat, a holiday celebrating trees. Tu B’Av (ט״ו בּאב), pronounced too buh-AHV, is the 15th of the Jewish month of Av, a day celebrating romantic love that is often referred to as “the Jewish Valentine’s Day.”15. Yizkor and YahrzeitYizkor (יזכּור), pronounced YIZ-kohr, is the memorial service that is part of four Jewish holidays: Yom Kippur, Passover, Sukkot and Shavuot. Yahrzeit (יארצייט), pronounced YAHR-tzight or YOHR-tzight, is the Yiddish word for the anniversary of a death. Learn how to mark a yahrzeit.Want to learn Hebrew one day at a time? Click here to sign up for our Hebrew Word of the Day email. Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-text', baseDivId: 'pb-slot-text-ad', } ], true); }); Sign Up for Our Newsletter Get Jewish wisdom & discovery in your inbox Email Sign Up By submitting I agree to the privacy policy. Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-rail', baseDivId: 'pb-slot-incontent-1', } ]); }); Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-leaderboard-bottom', baseDivId: 'pb-slot-leaderboard-bottom', } ]); });"
