full_description = '''Jewish Texts Study Parashat Terumah: Summary God instructs Moses to collect gifts from the Israelites in order to build a Tabernacle so that God can dwell among the people; God describes to Moses the vessels and structures that comprise the Tabernacle. By Nancy Reuben Greenfield Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-leaderboard', baseDivId: 'pb-slot-leaderboard-top', } ]); }); Share facebook You might also like Modern Israel at a Glance Modern Israel Black-Jewish Relations in America American Jews My Jewish Learning is a not-for-profit and relies on your help Donate Commentary on Parashat Terumah, Exodus 25:1-27:19; Numbers 28:9-15; Exodus 30:11-16 God has just told Moses “to come to the mountain to receive the tablets of stone, to receive God’s Commandments.” Moses goes up the mountain, and a cloud comes to cover it, hiding the mountain completely. On this mountain, within the presence of the Lord, Moses remained for forty days and nights.God first instructs Moses how to fashion a Dwelling Place, a sanctuary for God’s presence.“In this sanctuary,” God says, “the Israelites are to bring me gifts.”The gifts can be of any kind from any person whose heart moves them in a giving way. In this sanctuary, there shall be oil for the light and spices for the sweet incense and anointing oil. Support My Jewish Learning Help us keep Jewish knowledge accessible to millions of people around the world. Your donation to My Jewish Learning fuels endless journeys of Jewish discovery. With your help, My Jewish Learning can continue to provide nonstop opportunities for learning, connection and growth. Donate God continues, “And let the people make Me this sanctuary so that I may dwell among them. This is the pattern of how the Tabernacle and furniture is to be made.“The Ark must be a precise blend of acacia wood, two and a half cubits long, a cubit and a half wide, and a cubit and a half high. Overlay this Tabernacle with pure gold and golden rings and poles to carry the Ark. You shall make a cover of pure gold with two gold Cherubim on both ends of the cover.“Into the ark, you shall you put the Testimony which I, the Lord, will give you. There I will meet with you at appointed times. I will speak with you from above the Cover, from between the two cherubim on the Ark of the Testimony.“Make a table of acacia wood for the Ark and cover it with pure gold with a gold crown all around. Then adorn it with bowls, ladles, jars and jugs made of gold. Make also a pure gold menorah with six almond-blossom type branches and seven lamps to give light.“In the Tabernacle, enclose the Dwelling Place with ten curtains of fine twined linen of blue, purple and scarlet. Make the tabernacle with wooden planks and silver rings and stakes of copper.”Parashat Terumah: Discussion Questions1) God instructs Moses how to make a sanctuary for God’s presence. Can you describe different kinds of sanctuaries that are filled with God’s presence?2) Why is God so precise on the details of constructing the sanctuary and ark and tabernacle? What difference does it make what these look like and how they are made?3) Describe the most spiritual sanctuary you have visited. What made that sanctuary the most spiritual for you?4) In the sanctuary, God requests gift offerings of any kind from any person whose heart moves them in a giving way. What kind of gift offerings do you bring God from your heart?Reprinted with permission from Jewish Family & Life! Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-text', baseDivId: 'pb-slot-text-ad', } ], true); }); ark <audio src="https://www.myjewishlearning.com/wp-content/uploads/2017/03/ark.mp3" controls> Your browser does not support the &lt;code&gt;audio&lt;/code&gt; element. </audio> Pronounced: ark, Origin: English, the place in the synagogue where