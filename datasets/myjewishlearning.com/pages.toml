title = "What Is Lag Ba'omer? | My Jewish Learning"
description = "Lag Ba'Omer. Counting the Omer. Shavuot in the Community. Shavuot, Receiving the Torah. Featured Articles on Shavuot. Jewish Holidays."
full_description = '''Lag Ba'Omer What Is Lag Ba’omer? This minor holiday — known for bonfires, weddings and haircuts — takes place about a month after Passover. By Francine Klagsbrun Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-leaderboard', baseDivId: 'pb-slot-leaderboard-top', } ]); }); Share facebook You might also like How to Count the Omer Celebrate What Is An Upsherin, or Halaqah? Beliefs & Practices My Jewish Learning is a not-for-profit and relies on your help Donate Lag Ba’omer is a minor holiday that occurs on the 33rd day of the Omer, the 49-day period between Passover and Shavuot. A break from the semi-mourning of the Omer, key aspects of Lag Ba’omer include holding Jewish weddings (it’s the one day during the Omer when Jewish law permits them), lighting bonfires and getting haircuts.Why We CelebrateThere are a few explanations why we celebrate Lag Ba’omer, but none is definitive.The Omer is a time of semi-mourning, when weddings and other celebrations are forbidden, and as a sign of grief, observant Jews do not cut their hair. Anthropologists say that many peoples have similar periods of restraint in the early spring to symbolize their concerns about the growth of their crops. But the most often cited explanation for the Jewish practice comes from the Talmud, which tells us that during this season a plague killed thousands of Rabbi Akiva‘s students because they did not treat one another respectfully. (Yevamot 62b) The mourning behavior is presumably in memory of those students and their severe punishment.According to a medieval tradition, the plague ceased on Lag Ba’omer, the 33rd day of the Omer. (The Hebrew letters lamed and gimel which make up the acronym “Lag” have the combined numerical value of 33.) As a result, Lag Ba’omer became a happy day, interrupting the sad­ness of the Omer period for 24 hours. Support My Jewish Learning Help us keep Jewish knowledge accessible to millions of people around the world. Your donation to My Jewish Learning fuels endless journeys of Jewish discovery. With your help, My Jewish Learning can continue to provide nonstop opportunities for learning, connection and growth. Donate Rabbi Akiva and the Bar Kochba RebellionThe Talmudic explanation makes most sense when put into historical context. The outstanding sage Rabbi Akiva became an ardent supporter of Simeon bar Koseva, known as Bar Kochba, who in 132 C.E. led a ferocious but unsuccessful revolt against Roman rule in Judea. Akiva not only pinned his hopes on a political victory over Rome but believed Bar Kochba to be the long-awaited Messiah. Many of his students joined him in backing the revolt and were killed along with thousands of Judeans when it failed. The Talmudic rabbis, still suffering under Roman rule and cautious about referring openly to past rebellions, may have been hinting at those deaths when they spoke of a plague among Akiva’s students. Possibly, also, Lag Ba’omer marked a respite from battle, or a momentary victory.A completely different reason for the holiday concerns one of Rabbi Akiva’s few disciples who survived the Bar Kochba revolt, Rabbi Simeon bar Yohai. He is said to have died on Lag Ba’omer.Rabbi Simeon continued to defy the Roman rulers even after Bar Kochba’s defeat, and was forced to flee for his life and spend years in solitary hiding. Legend places him and his son Eleazar in a cave for 12 years, where a miraculous well and carob tree sustained them while they spent their days studying and praying. (Shabbat 33b) When they finally emerged, Simeon denigrated all practical occupations, insisting that people engage only in the study of Torah. For this God confined the two to their cave for another year, accusing Simeon of destroying the world with his rigid asceticism.But Rabbi Simeon’s otherworldliness resonated with mystics in his own time and later, so much so that tradition ascribes to him the Zohar, the key work of the Kabbalah (although critical scholars attribute it to the 13th-century Spanish kabbalist Moses de Leon). And in Israel, on Lag Ba’omer, people flock to the site of his tomb in the village of Meron in the Galilee, near Safed, where they light bonfires and sing kabbalistic hymns. Hasidic Jews follow the custom of bringing their 3-year-old sons to Meron to have their hair cut for the first time. (The custom of not cut­ting the child’s hair until his third birthday, when it is done in a ceremony called an upsheren, is probably an extension of the law that forbids picking the fruits of a newly planted tree during its first three years.)Lag Ba’omer CustomsUnrelated to Rabbi Simeon, the kabbalists also give a mystical interpretation to the Omer period as a time of spiritual cleansing and preparation for receiving the Torah on Shavuot. The days and weeks of counting, they say, represent various combinations of the sefirot, the divine emanations, whose contemplation ultimately leads to purity of mind and soul. The somberness of this period reflects the seriousness of its spiritual pursuits.Finally, on yet another tack, some authorities attribute the joy of Lag Ba’omer to the belief that the manna that fed the Israelites in the desert first appeared on the 18th of Iyar.Though its origins are uncertain, Lag Ba’omer has become a minor holiday. (For Sephardic Jews, the holiday is the day after Lag Ba’omer.) School children picnic and play outdoors with bows and arrows — a possible reminder of the war battles of Akiva’s students — and in Israel plant trees. It is customary to light bonfires, to symbolize the light Simeon bar Yohai brought into the world. And every year numerous couples wed at this happy time.Reprinted with permission from Jewish Days: A Book of Jewish Life and Culture (Farrar, Straus and Giroux). Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-text', baseDivId: 'pb-slot-text-ad', } ], true); }); Sephardic <audio src="https://www.myjewishlearning.com/wp-content/uploads/2017/03/sephardic.mp3" controls> Your browser does not support the &lt;code&gt;audio&lt;/code&gt; element. </audio> Pronounced: seh-FAR-dik, Origin: Hebrew, describing Jews descending from the Jews of Spain. Support My Jewish Learning Help us keep Jewish knowledge accessible to millions of people around the world. Your donation to My Jewish Learning fuels endless journeys of Jewish discovery. With your help, My Jewish Learning can continue to provide nonstop opportunities for learning, connection and growth. Donate Torah <audio src="https://www.myjewishlearning.com/wp-content/uploads/2017/02/torah.mp3" controls> Your browser does not support the &lt;code&gt;audio&lt;/code&gt; element. </audio> Pronunced: TORE-uh, Origin: Hebrew, the Five Books of Moses. Support My Jewish Learning Help us keep Jewish knowledge accessible to millions of people around the world. Your donation to My Jewish Learning fuels endless journeys of Jewish discovery. With your help, My Jewish Learning can continue to provide nonstop opportunities for learning, connection and growth. Donate Sign Up for Our Newsletter Get Jewish wisdom & discovery in your inbox Email Sign Up By submitting I agree to the privacy policy. Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-rail', baseDivId: 'pb-slot-incontent-1', } ]); }); Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-leaderboard-bottom', baseDivId: 'pb-slot-leaderboard-bottom', } ]); });'''
