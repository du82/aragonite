wish community to fight for LGBTQ justice. Keshet’s blog spotlights this work, as well as the voices of LGBTQ Jews, our families, and allies.Rabbis Without BordersA dynamic forum for exploring contemporary issues in the Jewish world and beyond. Written by rabbis from different denominations, viewpoints and geographic locales, Rabbis Without Borders is a project of Clal – The National Jewish Center for Learning and Leadership.Southern & JewishCelebrates the stories, people, and experiences – past and present – of Jewish life in the American South. Hosted by the Goldring/Woldenberg Institute of Southern Jewish Life, posts come from educators, students, rabbis, parents, artists, and many other “visitors-to and daily-livers-of” the Southern Jewish experience. From road trips to recipes to reflections, we’ll explore a little bit of everything – well, at least all things Southern and/or Jewish. Shalom, y’all!The CanteenA tribute to all things Jewish sleepaway camp. Hosted by Foundation for Jewish Camp (FJC), this blog is written by campers, alumni, parents and camp professionals and is a place to talk about parenting, camp fun, projects, crafts, recipes and more – all tied back to Jewish holidays, traditions and, of course, camp! Archived BlogJOFA’s TorchExplored gender and religion in the Jewish community. Named for Deborah the Prophetess, “the woman of torches,” the blog highlighted the passion and fiery leadership of Jewish feminists, while evoking the powerful image of feminists “passing the torch” to a new generation. Featuring the insights and personal reflections of women and men seeking to create a more gender-equitable Jewish world, The Torch was a project of JOFA, the Jewish Orthodox Feminist Alliance. Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-text', baseDivId: 'pb-slot-text-ad', } ], true); }); Sign Up for Our Newsletter Get Jewish wisdom & discovery in your inbox Email Sign Up By submitting I agree to the privacy policy. Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-rail', baseDivId: 'pb-slot-incontent-1', } ]); }); Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-leaderboard-bottom', baseDivId: 'pb-slot-leaderboard-bottom', } ]); });'''
