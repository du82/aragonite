full_description = "Guided Learning Journeys Go on a Learning Journey with MJL We have more than 20 free guided learning experiences — and the list is always growing. By My Jewish Learning Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-leaderboard', baseDivId: 'pb-slot-leaderboard-top', } ]); }); Share facebook My Jewish Learning is a not-for-profit and relies on your help Donate My Jewish Learning has literally thousands of articles on all aspects of Judaism: ritual, prayer, history, custom, food, text and more! Whoever you are and wherever you are from, we empower you to take command of your Jewish learning and your Jewish story.To better serve you, we’ve organized some of our best content into guided email journeys and ongoing newsletters. Think of them as fun, beautifully-designed mini courses that dive into all kinds of Jewish topics — delivered straight to your inbox! Sign up now, or any time. Delete them when you’re done, or file them for reference. Share them with a friend.Below are the journeys we currently offer. SPIRITUALITYGetting Comfortable in SynagogueThere’s a saying: There are two kinds of Jews, those who are uncomfortable in synagogue, and those who are comfortable with being uncomfortable in synagogue. Let’s us help you put yourself in the second category! Support My Jewish Learning Help us keep Jewish knowledge accessible to millions of people around the world. Your donation to My Jewish Learning fuels endless journeys of Jewish discovery. With your help, My Jewish Learning can continue to provide nonstop opportunities for learning, connection and growth. Donate Exploring Jewish PrayerJewish prayer is many things: exhilarating, boring, nurturing, confusing, grounding, intimidating. This ongoing newsletter will offer weekly insights into individual Jewish prayers to help you build your understanding of Jewish prayer and gain deeper meaning from your prayer experience.Discovering Jewish SpiritualityJewish tradition contains a wealth of wisdom for transforming your life — not only at synagogue but also every day at home — into one that is more spiritually enriched and meaningful. In this journey, we explore many authentic (and surprising!) Jewish techniques for cultivating your spiritual life.BOOKSGuide to Torah StudyNot for nothing are Jews called “the people of the book.” Our sacred texts are what bind Jews together across different times, places, ethnicities and denominations. Get acquainted with the real Jewish glue today.Torah Parsha NewsletterThis weekly Torah commentary series offers new thoughts and unexpected takes on the parasha each Friday morning to help you get ready for Shabbat.Personalities of the BibleThe Hebrew Bible contains some of the richest and most intriguing characters found in western literature. Learn how our Jewish ancestors struggled and triumphed, and what they have to teach us today.Meet the ProphetsThere’s a reason the prophets of the Hebrew Bible are some of the most-quoted figures in all of human history: these mavericks faced down kings, spoke truth to power, defended the weak and produced some of the most beautiful poetry in the Bible. Daily Dose of TalmudAround the world, thousands of Jews are studying Talmud together at a pace of one page per day. The program is called Daf Yomi (Daily Page). This ongoing daily newsletter offers an accessible and insightful take-away from each day’s page of Talmud — in step with everyone else participating in the “world’s largest book club.”Choose Your Own Talmud TractateAs we work our way through the Talmud in our study of Daf Yomi, we’re archiving the journey. You can now study over a dozen tractates on your own timetable — just click the links and start today with a daily email that will work through each tractate, one page at a time. (This list will continue to grow, so come back to check for updates!)Journey Through KetuvimFrom Psalms to Chronicles, explore all of Ketuvim, the third and last section of the Hebrew Bible. Get to know the personalities, deep questions and more to gain a deeper understanding and learn how teachings in these works can be applied in modern times.Understanding the HaggadahPassover seder feel long and confusing? We’re here to help you sort through the details and make meaning from one of Judaism’s most unique rituals.Great Jewish BooksThis tour through some of the most important Jewish books of the last century offers an opportunity to revisit classics, discover new favorites and gain a wider perspective on contemporary Jewish literature.HISTORYThe Longest HatredUnderstanding the history and reach of antisemitism.RITUALJourney Into Shabbat“More than the Jews have kept Shabbat, Shabbat has kept the Jews.” Shabbat comes around every week, but our sages considered it more sacred than the major holidays like Passover and Sukkot. Learn ancient traditions, modern takes and even delicious recipes that will bring this holiness into your life every week.Ritual Objects JourneySign up for a unique email series designed to help you explore some of the most common types of Jewish ritual objects and take a deep dive into their meaning and more.Breaking the GlassPlanning a Jewish wedding? We’re here to help. We’ll explain traditional Jewish wedding rituals and modern variations, and help you make informed decisions to plan the Jewish wedding that is right for you. Plus, you and your sweetie will want to try our love-deepening exercise!Grief and MourningJudaism, in its wisdom, offers thoughtful rituals and resources to help mourners cope with loss and find peace after losing a loved one.All About Keeping KosherIntimidated by Jewish dietary laws? We’ll walk you through the basics, from identifying which foods are kosher to setting up a kosher kitchen.JEWISH WISDOMHasidic WisdomPractical advice from the Hasidic masters for improving your relationships, finances, your emotional life, and more!Jewish Wisdom for Hard TimesAccording to the Book of Genesis, the first human beings (Adam and Eve) were expelled from the Garden of Eden and condemned to live a mortal life riddled with pain. We never got to live in paradise, but none of us are immune from suffering. Judaism offers tools for coping and triumphing.Jewish Values to Live ByJews disagree on a lot, but there are some values we can all agree on. This series introduces the most common of them.Wisdom Comes with YearsJudaism has much to teach us about savoring old age. Learn how Judaism can help you make the most of the wisdom years.JEWISH THOUGHTWhat do Jews Believe?Do Jews believe in life after death? What about angels? Did God write the Torah? Do we have free will? In this series, we explore basic Jewish beliefs.Jewish Views on the AfterlifeWhat does Judaism say about heaven and hell? About the immortality of the soul? Resurrection? Reincarnation? The messianic era? Judaism has no single answer to any of these questions — this series introduces multiple Jewish perspectives.Maimonides“From Moses to Moses there was none like Moses.” A look into one of the most brilliant, influential and controversial Jewish thinkers, Rabbi Moses ben Maimon also known as Maimonides or simply the Rambam.JOINING THE TRIBEChoosing JudaismThinking about becoming a Jew? Our journey will give you the tools you need to get started on yours.***In addition to the journeys above, you can also subscribe to our daily newsletter. Each weekday we help you deepen your Jewish knowledge by featuring a few articles, a recipe, a word of the day and more. Follow us on Facebook and Instagram for more great content. We also host “The Hub” — your source for online Jewish classes being offered all over the web.If there’s something you don’t see here, we’re always happy to know what you want to learn next. Email us a journey suggestion and you just might inspire the next learning experience we create! Advertisement window.tude = window.tude || { cmd: [] }; tude.