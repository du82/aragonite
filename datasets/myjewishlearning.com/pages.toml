title = "Purim 2025 | My Jewish Learning"
description = "In 2025, Purim begins at sundown on Thursday, March 13 and ends at sundown on Friday, March 14.The story of the ..."
full_description = "Purim Purim 2025 In 2025, Purim begins at sundown on Thursday, March 13 and ends at sundown on Friday, March 14. By My Jewish Learning Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-leaderboard', baseDivId: 'pb-slot-leaderboard-top', } ]); }); Share facebook You might also like Are Esther and Mordechai Buried in This Iranian Tomb? Ancient/Medieval Jewish History Vashti and Esther: A Feminist Perspective Purim My Jewish Learning is a not-for-profit and relies on your help Donate In 2025, Purim begins at sundown on Thursday, March 13 and ends at sundown on Friday, March 14.The story of the joyous holiday of Purim might appear somber at first glance: It tells of the near-destruction of the Jewish people as decreed by Haman, an adviser to the Persian King Ahasuerus. When is Purim 2025? Learn all about the holiday here. However, Ahasuerus’ newly crowned queen, Esther — who replaced Vashti when she was thrown out of the kingdom — is secretly a Jew.Due to her courage and her eventual role in saving the Jews, the story of Purim is known as “Megillat Esther,” or the Scroll of Esther. Support My Jewish Learning Help us keep Jewish knowledge accessible to millions of people around the world. Your donation to My Jewish Learning fuels endless journeys of Jewish discovery. With your help, My Jewish Learning can continue to provide nonstop opportunities for learning, connection and growth. Donate What to Do on PurimThere are several common practices on Purim:* We give gifts to poor people.* We read the megillah, the Purim story.* We eat a festive meal, or seudah.* We give food gifts, called mishloah manot, to our friends.*We eat hamantaschen, triangle-shaped cookies named for the villainous Haman. Learn how to make them in this video or find recipes for many different varieties (and other Purim food) on our food blog, The Nosher.Other Purim ActivitiesMany people dress up in costume, following the theme of Purim as a holiday of disguise where nothing is quite as it seems. Synagogues and communities hold plays and festivals specifically for the day. Traditionally, a noisemaker or gragger is sounded when Haman’s name is said aloud during the megillah reading; today some people have instituted a new practice of waving a celebratory flag when Esther’s name is recited.How Much Do You Know?Think you know everything about Purim? Check out these 9 Things You Didn’t Know About Purim. Take a Purim quiz, or take this quiz to find out which kind hamantaschen you are! Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-text', baseDivId: 'pb-slot-text-ad', } ], true); }); Sign Up for Our Newsletter Get Jewish wisdom & discovery in your inbox Email Sign Up By submitting I agree to the privacy policy. Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-rail', baseDivId: 'pb-slot-incontent-1', } ]); }); Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-leaderboard-bottom', baseDivId: 'pb-slot-leaderboard-bottom', } ]); });"
