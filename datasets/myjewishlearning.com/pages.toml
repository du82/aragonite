title = "My Jewish Learning's Email Newsletters | My Jewish Learning"
description = "My Jewish Learning has literally thousands of articles on all aspects of Judaism: ritual, prayer, history, custom, food, text and ..."
full_description = "My Jewish Learning’s Email Newsletters My Jewish Learning has literally thousands of articles on all aspects of Judaism: ritual, prayer, history, custom, food, text and more! Whoever you are and wherever you are from, we empower you to take command of your Jewish learning and your Jewish story.To better serve you, we’ve organized some of our best content into guided email journeys and ongoing newsletters. Think of them as fun, beautifully-designed mini courses that dive into all kinds of Jewish topics — delivered straight to your inbox! Sign up now, or any time. Daily and Weekly Jewish Learning My Jewish Learning's Daily Newsletter Each weekday we help you deepen your Jewish knowledge by featuring a few articles, a recipe, a question of the day and more. Hebrew Word of the Day This daily email provides you with a new word every day to discover from Hebrew (and sometimes other Jewish languages!). Daily Dose of Talmud A daily newsletter that offers an accessible and insightful take-away from each day’s page of Talmud. Recharge (on Saturdays) A weekly collection of Shabbat readings to refresh your soul, arriving in your inbox on Saturdays. Recharge (on Fridays) A weekly collection of Shabbat readings to refresh your soul, arriving in your inbox on Fridays. Weekly Torah Commentary This weekly series offers new thoughts and unexpected takes on the Torah portion each Friday morning to help you get ready for Shabbat. Exploring Jewish Prayer This weekly newsletter offers insights into individual Jewish prayers to help you build your understanding of Jewish prayer and gain deeper meaning from your prayer experience. Email Series on Jewish Texts Journey into the Books of Tanakh Starting with the Book of Job, journey through all the books of the Hebrew Bible. Personalities of the Bible Learn how our Jewish ancestors struggled and triumphed, and what they have to teach us today. Meet the Prophets Get to know the mavericks who faced down kings, spoke truth to power, defended the weak and produced some of the most beautiful poetry in the Bible. Great Jewish Books This tour through some of the most important Jewish books of the last century offers an opportunity to revisit classics, discover new favorites and gain a wider perspective on contemporary Jewish literature. Guide to Torah Study Our sacred texts are what bind Jews together across different times, places, ethnicities and denominations. Get acquainted with the real Jewish glue today. Understanding the Haggadah This special email series dives into the central text read at the Passover seder, and uncovers new meaning behind the songs and rituals performed each year. Email Series on Rituals Journey Into Shabbat Learn ancient traditions, modern takes and even delicious recipes that will bring this holiness into your life every week. Getting Comfortable in Synagogue Let’s us help you get comfortable in synagogue! Breaking the Glass Planning a Jewish wedding? We’re here to help. Grief and Mourning Judaism, in its wisdom, offers thoughtful rituals and resources to help mourners cope with loss and find peace after losing a loved one. All About Keeping Kosher Intimidated by Jewish dietary laws? We’ll walk you through the basics, from identifying which foods are kosher to setting up a kosher kitchen. Email Series on Jewish History and Wisdom The Longest Hatred Understanding the history and reach of antisemitism. Jews & Ukraine: It's Complicated My Jewish Learning and JTA News’ email series devoted to exploring the Jewish connection to Ukraine. Hasidic Wisdom Practical advice from the Hasidic masters for improving your relationships, finances, your emotional life, and more! Jewish Wisdom for Hard Times This email series explore how Jewish texts and traditions can help us cope and triumph. Jewish Values to Live By Jews disagree on a lot, but there are some values we can all agree on. This series introduces the most common of them. Wisdom Comes with Years Judaism has much to teach us about savoring old age. Learn how Judaism can help you make the most of the wisdom years. Email Series on Jewish Thought and Spirituality What Do Jews Believe? Do Jews believe in life after death? What about angels? Did God write the Torah? Do we have free will? In this series, we explore basic Jewish beliefs. Jewish Views on the Afterlife What does Judaism say about heaven and hell? About the immortality of the soul? Resurrection? Reincarnation? The messianic era? Judaism has no single answer to any of these questions — this series introduces multiple Jewish perspectives. Discovering Jewish Spirituality Jewish tradition contains a wealth of wisdom for transforming your life — not only at synagogue but also every day at home — into one that is more spiritually enriched and meaningful. In this journey, we explore many authentic (and surprising!) Jewish techniques for cultivating your spiritual life. Maimonides “From Moses to Moses there was none like Moses.” A look into one of the most brilliant, influential and controversial Jewish thinkers, Rabbi Moses ben Maimon also known as Maimonides or simply the Rambam. Email Series on Joining the Jewish People Choosing Judaism Thinking about becoming a Jew? Our journey will give you the tools you need to get started on yours. Email I accept the Privacy Policy."
