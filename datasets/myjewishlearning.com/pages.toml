full_description = '''Passover Passover 2025 In 2025, the first seder will be held on the evening of Saturday, April 12. By My Jewish Learning Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-leaderboard', baseDivId: 'pb-slot-leaderboard-top', } ]); }); Share facebook You might also like How to Plan a Passover Seder Passover <img src="https://img.youtube.com/vi/r37_hNy9A1A/maxresdefault.jpg" alt="YouTube Image" class="m-card__media"> Passover (Pesach) 101 Passover My Jewish Learning is a not-for-profit and relies on your help Donate The first Passover seder is on the evening of Saturday, April 12, and the second Passover seder takes place on the evening of Sunday, April 13.What is Passover?Passover is a festival of freedom. When is Passover 2025? Learn all about the holiday here. It commemorates the Israelites’ Exodus from Egypt, and their transition from slavery to freedom. The main ritual of Passover is the seder, which occurs on the first two nights (in Israel just the first night) of the holiday — a festive meal that involves the re-telling of the Exodus through stories and song and the consumption of ritual foods, including matzah and maror (bitter herbs). The seder’s rituals and other readings are outlined in the Haggadah — today, many different versions of this Passover guide are available in print and online, and you can also create your own.What are some Passover practices?The central Passover practice is a set of intense dietary changes, mainly the absence of hametz, or foods with leaven. (Ashkenazi Jews also avoid kitniyot, a category of food that includes legumes.) In recent years, many Jews have compensated for the lack of grain by cooking with quinoa, although not all recognize it as kosher for Passover. The ecstatic cycle of psalms called Hallel is recited both at night and day (during the seder and morning prayers). Additionally, Passover commences a 49-day period called the Omer, which recalls the count between offerings brought to the ancient Temple in Jerusalem. This count culminates in the holiday of Shavuot, the anniversary of the receiving of the Torah at Sinai. Support My Jewish Learning Help us keep Jewish knowledge accessible to millions of people around the world. Your donation to My Jewish Learning fuels endless journeys of Jewish discovery. With your help, My Jewish Learning can continue to provide nonstop opportunities for learning, connection and growth. Donate What foods do we eat on Passover?Matzah, or unleavened bread, is the main food of Passover. You can purchase it in numerous stores, or you can make your own. But the holiday has many traditional, popular foods, from haroset (a mixture of fruit, nuts, wine, and cinnamon) to matzah ball soup — and the absence of leavening calls upon a cook to employ all of his/her culinary creativity. View our extensive collection of Passover recipes here, or check out The Nosher. Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-text', baseDivId: 'pb-slot-text-ad', } ], true); }); Sign Up for Our Newsletter Get Jewish wisdom & discovery in your inbox Email Sign Up By submitting I agree to the privacy policy. Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-rail', baseDivId: 'pb-slot-incontent-1', } ]); }); Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-leaderboard-bottom', baseDivId: 'pb-slot-leaderboard-bottom', } ]); });'''
