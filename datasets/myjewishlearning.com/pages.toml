title = "Does Judaism Permit Autopsies? | My Jewish Learning"
description = "An autopsy is a medical examination of a corpse, usually to determine the cause and manner of death, to gather ..."
full_description = "End of Life Does Judaism Permit Autopsies? While there is concern that autopsy violates Jewish norms about treating a corpse with resepect, there are cases in which it is permitted. By My Jewish Learning (Getty) Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-leaderboard', baseDivId: 'pb-slot-leaderboard-top', } ]); }); Share facebook You might also like Jewish Perspectives on End-of-Life Care End of Life Must-Know Words and Phrases Related to End-of-Life Care End of Life My Jewish Learning is a not-for-profit and relies on your help Donate An autopsy is a medical examination of a corpse, usually to determine the cause and manner of death, to gather either forensic or medical information. Conducting an autopsy generally involves making incisions in the body and removing organs for study which, in Jewish tradition, is considered a desecration. However, Judaism is not universally opposed to autopsies and there are cases in which it is permitted to satisfy legal requirements or to uncover potentially life-saving knowledge. Why Jewish Law Usually Prohibits AutopsiesJewish law mandates that after a Jew has died, they are buried in a manner that conveys utmost respect for the body. This means neither mutilating the body nor artificially preserving the body, and returning it quickly to the earth. Autopsy interferes with this preferred process and Jewish legal (halakhic) sources generally prohibit autopsies for three key legal reasons: Kavod ha’met (Respect for the Dead): Judaism holds that people are created b’tzelem elohim, in the image of God — both body and soul. Therefore, Jewish law mandates that a body be treated with dignity and buried as soon as possible. Dissecting a body for an autopsy is seen as a violation of this respect in both senses, by delaying burial and by damaging the body. Halanat ha’met (Delaying burial overnight): Jewish tradition is opposed to artificially preserving the body and emphasizes that burial should happen as soon as possible, typically within 24 hours. Autopsies, which inevitably delay this process, are discouraged for this reason. Hana’ah min ha’met (Benefit from the dead): There is a prohibition against deriving benefit from a deceased body, which some authorities extend to the use of human remains for study or research. Why Some Autopsies are Permitted in Jewish LawAlthough autopsy interferes with Jewish burial practices and raises several halakhic concerns, Jewish law does permit autopsies in certain circumstances, also based on important legal principles: Support My Jewish Learning Help us keep Jewish knowledge accessible to millions of people around the world. Your donation to My Jewish Learning fuels endless journeys of Jewish discovery. With your help, My Jewish Learning can continue to provide nonstop opportunities for learning, connection and growth. Donate To save a life (pikuach nefesh): Cutting into a dead body is permitted to save another’s life. This is why Judaism traditionally not only favors organ donation, but considers it a religious duty. Similarly, if performing an autopsy could help identify a disease that may endanger the lives of the deceased’s relatives or the broader community, it is sometimes permitted. The more clear the path from autopsies to saved lives, the more likely halakhic authorities are to sanction the autopsy. To comply with the law (dina d’malchuta dina): If a government mandates an autopsy, which can happen in cases of suspicious death, Jewish authorities will usually not stand in the way because of the Jewish principle of respecting the law of the land. If an autopsy is performed on a Jewish body for any of the above reasons, it is preferable to bury the body in the traditional manner as quickly as possible — preferably within three days — and to return all the parts of the body to the casket.How Jewish Denominations View AutopsiesOrthodox authorities generally maintain the traditional prohibitions against autopsies, permitting them only in a few cases. Many Orthodox communities work with local medical examiners to find halakhically acceptable alternatives, such as non-invasive imaging (e.g., MRIs) to determine cause of death.The Conservative movement acknowledges traditional halakhic concerns but takes a more flexible approach. The Committee on Jewish Law and Standards has ruled that autopsies are permitted when they serve a direct life-saving purpose. Their advanced directives for end-of-life form offers the following option for individuals to choose: “I would allow an autopsy to be performed if necessary to provide information that would help save the life of a family member or other identifiable individual. If any autopsy is performed, I ask that it be conducted with all possible respect and that all of my body parts subsequently be buried in a Jewish cemetery in accordance with Jewish law and custom.“ A minority opinion on the form extends this permission to include autopsies which would “enable physicians to learn more about my disease because my case is not routine.” Autopsies for the advancement of medical science remain a gray area for the Conservative movement.Reform perspectives tend to prioritize ethical considerations over halakhic prohibitions. Reform authorities generally allow autopsies, especially if they contribute to medical research, help grieving families find closure or comply with civil law. While they encourage respect for Jewish traditions, they do not see halakhah as binding in the same way Orthodox authorities do.Alternatives to AutopsiesIn modern times, medical technology has made more non-invasive techniques, like CT scans and MRIs, increasingly viable alternatives to traditional autopsies, allowing cause of death to be determined without despoiling the body or overly delaying burial. Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-text', baseDivId: 'pb-slot-text-ad', } ], true); }); Sign Up for Our Newsletter Get Jewish wisdom & discovery in your inbox Email Sign Up By submitting I agree to the privacy policy. Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-rail', baseDivId: 'pb-slot-incontent-1', } ]); }); Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-leaderboard-bottom', baseDivId: 'pb-slot-leaderboard-bottom', } ]); });"
