full_description = '''Celebrate Months of the Jewish Year Navigating the 12 months of the Hebrew calendar. By My Jewish Learning Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-leaderboard', baseDivId: 'pb-slot-leaderboard-top', } ]); }); Share facebook You might also like Rosh Hashanah 101 Rosh Hashanah Where to Stream Yom Kippur Services Yom Kippur Looking for a Jewish calendar? Click here to create a free, customized Jewish calendar. Or choose from a wide array of Jewish calendars for sale at Amazon.com or your local Judaica store.The months of the Jewish year are lunar in nature. Unlike the months of the Gregorian solar year that is the norm in the world today, the months of the Jewish year reflect the phases of the moon. This can be seen most clearly in the length of the months. Whereas the months of the Gregorian calendar vary in length between 28 and 31 days in order to make a solar year of 365 (or, in leap years, 366) days, the months of the Jewish year are either 29 or 3o days long. This reflects the fact that a lunar month is 29.5 days in length, and the months always must begin with the new moon.The Jewish Months (And When They Usually Fall)Shevat (January-February)Adar (February-March) Support My Jewish Learning Help us keep Jewish knowledge accessible to millions of people around the world. Your donation to My Jewish Learning fuels endless journeys of Jewish discovery. With your help, My Jewish Learning can continue to provide nonstop opportunities for learning, connection and growth. Donate Nisan (March-April)Iyyar (April-May) Sivan (May-June)Tammuz (June-July)Av (July-August)Elul (August-September)Tishrei (September-October)Heshvan (October-November)Kislev (November-December)Tevet (December-January)Adjustments and Leap YearsA year of 12 lunar months, however, is some 11 days shorter than a solar year. In order to ensure that the various seasonally based holidays in the Jewish calendar continue to occur at the correct season, the rabbis developed a system over time that allowed them to coordinate their lunar months with the solar year by inserting a leap month at the end of the year seven times in every 19-year cycle. This is now fixed in the third, sixth, eighth, 11th, 14th, 17th, and 19th years of the cycle. Although this is traditionally ascribed to Rabbi Hillel II in the fourth century CE, it is probable that the system in use today developed slowly during the course of the mid to late first millennium.In order to further fine-tune their calculations, the rabbis determined that the months of Nisan, Sivan, Av, Tishrei, and Shevat are always 30 days long. Iyyar, Tammuz, Elul, Tevet and Adar are always 29 days long. Heshvan and Kislev are either 29 or 30 days in length. In a leap year, there are two months of Adar. When that occurs, Adar I is 30 days long, and Adar II 29. A short Jewish year, therefore, consists of 353 to 355 days, while a leap year varies between 383 and 385 days.Babylonian Origins of the Months’ NamesThe names that we use for the Jewish months are actually Babylonian in origin and were adopted by the Jews as of the time of the Babylonian exile in the sixth century BCE. The Bible indicates that until then the months were oftentimes called simply by their numerical position in the year (First Month, Second Month, etc.), just as the days of the week — with the exception of Shabbat — still are in Hebrew. In addition, the Bible does record some ancient names for the months that disappeared once the Jews adopted the Babylonian names. These include the now-forgotten months of Bul and Aviv, among others. The Gezer Calendar from the 10th century BCE, arguably the oldest Hebrew inscription ever discovered, refers to the months according to the agricultural activities associated with them.Rosh Chodesh, The New MoonThe Jewish month begins with the first sighting of the new moon, the Rosh Chodesh. There are special prayers associated with the beginning of the month, and Rosh Chodesh ceremonies have oftentimes played an important role particularly among the female members of the Jewish community.Although the Jewish new year (Rosh Hashanah) is celebrated at the beginning of Tishrei, this month is actually the seventh month according to ancient reckoning. The first month is actually Nisan, during which Passover (Pesach) falls. In this manner, the Jewish year begins with God’s great redemptive act at the time of the Exodus from Egypt.Holidays and festivals are scattered throughout the Jewish year, with the exception of the month of Heshvan. Therefore, this month has also been termed Marheshvan, bitter Heshvan, since it lacks a holiday. However, the term “mar” could also be read as “mister,” which is also interpreted midrashically to mean that this poor month without a holiday is compensated by receiving special respect! Share facebook Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-text', baseDivId: 'pb-slot-text-ad', } ], true); }); Adar <audio src="https://www.myjewishlearning.com/wp-content/uploads/2017/03/adar.mp3" controls> Your browser does not support the &lt;code&gt;audio&lt;/code&gt; element. </audio> Pronounced: uh-DAHR, Origin: Hebrew, Jewish month usually coinciding with February-March. Support My Jewish Learning Help us keep Jewish knowledge accessible to millions of people around the world. Your donation to My Jewish Learning fuels endless journeys of Jewish discovery. With your help, My Jewish Learning can continue to provide nonstop opportunities for learning, connection and growth. Donate Heshvan <audio src="https://www.myjewishlearning.com/wp-content/uploads/2017/03/cheshvan.mp3" controls> Your browser does not support the &lt;code&gt;audio&lt;/code&gt; element. </audio> Pronounced: KHESH-vahn, Origin: Hebrew, Jewish month usually coinciding with October-November. Support My Jewish Learning Help us keep Jewish knowledge accessible to millions of people around the world. Your donation to My Jewish Learning fuels endless journeys of Jewish discovery. With your help, My Jewish Learning can continue to provide nonstop opportunities for learning, connection and growth. Donate Kislev <audio src="https://www.myjewishlearning.com/wp-content/uploads/2017/03/kislev.mp3" controls> Your browser does not support the &lt;code&gt;audio&lt;/code&gt; element. </audio> Pronounced: KISS-lev, Origin: Hebrew, Jewish month usually coinciding with November-December. Support My Jewish Learning Help us keep Jewish knowledge accessible to millions of people around the world. Your donation to My Jewish Learning fuels endless journeys of Jewish discovery. With your help, My Jewish Learning can continue to provide nonstop opportunities for learning, connection and growth. Donate Shabbat <audio src="https://www.myjewishlearning.com/wp-content/uploads/2017/03/shabbat.mp3" controls> Your browser does not support the &lt;code&gt;audio&lt;/code&gt; element. </audio> Pronounced: shuh-BAHT or shah-BAHT, Origin: Hebrew, the Sabbath, from sundown Friday to sundown Saturday. Support My Jewish Learning Help us keep Jewish knowledge accessible to millions of people around the world. Your donation to My Jewish Learning fuels endless journeys of Jewish discovery. With your help, My Jewish Learning can continue to provide nonstop opportunities for learning, connection and growth. Donate Shevat <audio src="https://www.myjewishlearning.com/wp-content/uploads/2017/03/shevat.mp3" controls> Your browser does not support the &lt;code&gt;audio&lt;/code&gt; element. </audio> Pronounced: shVAHT, Origin: Hebrew, Jewish month, usually coinciding with January-February. Support My Jewish Learning Help us keep Jewish knowledge accessible to millions of people around the world. Your donation to My Jewish Learning fuels endless journeys of Jewish discovery. With your help, My Jewish Learning can continue to provide nonstop opportunities for learning, connection and growth. Donate Tevet <audio src="https://www.myjewishlearning.com/wp-content/uploads/2017/03/tevet.mp3" controls> Your browser does not support the &lt;code&gt;audio&lt;/code&gt; element. </audio> Pronounced: TEH-vut, Origin: Hebrew, Jewish month usually coinciding with December-January Support My Jewish Learning Help us keep Jewish knowledge accessible to millions of people around the world. Your donation to My Jewish Learning fuels endless journeys of Jewish discovery. With your help, My Jewish Learning can continue to provide nonstop opportunities for learning, connection and growth. Donate Sign Up for Our Newsletter Get Jewish wisdom & discovery in your inbox Email Sign Up By submitting I agree to the privacy policy. Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-rail', baseDivId: 'pb-slot-incontent-1', } ]); }); Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-leaderboard-bottom', baseDivId: 'pb-slot-leaderboard-bottom', } ]); }); My Jewish Learning is a not-for-profit and relies on your help Donate'''
