title = "Haftarah for Terumah | My Jewish Learning"
description = "jewish,learning,judaism, terumah, haftarah, temple, building the temple"
full_description = '''Bible Haftarah for Terumah How to build a Temple: Follow the instruction book. By My Jewish Learning Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-leaderboard', baseDivId: 'pb-slot-leaderboard-top', } ]); }); Share facebook You might also like Modern Israel at a Glance Modern Israel Black-Jewish Relations in America American Jews My Jewish Learning is a not-for-profit and relies on your help Donate Commentary on Parashat Terumah, Exodus 25:1-27:19; Numbers 28:9-15; Exodus 30:11-16 Kings I 5:26-6:13 Part of this Haftarah (Kings 1 8:2-21) is also read on the second day of Sukkot.In the Haftarah for Miketz a few weeks ago, Solomon was granted wisdom. The Bible takes great pains to repeatedly point out this event and does so at the introduction of every episode in which Solomon’s wisdom plays a relevant role.. This week’s Haftarah opens with a reminder: “The Lord had given Solomon wisdom, as He had promised him” (Kings I 5:26).The narrative goes on to tell of the peace treaty between Israel and King Hiram of Tyre, who was to become one of Solomon’s greatest allies. Together, they would establish one of the most wide-ranging trade routes in the world at the time.The story continues by outlining Solomon’s plan to construct the Temple. In Parashat Terumah, the Torah outlines the plans and layout for the Mishkan, the Tabernacle in which the Ark was carried through the desert. Similarly, the haftarah for Terumah details, step by step, how many people were used in each job for the Temple’s construction. “Solomon employed 70,000 who carried the loads and 80,000 quarry workers in the hill country” (5:29) it reports, and proceeds to tell how the builders “shaped and made ready the timber and stones for the building of the Temple” (5:32). Support My Jewish Learning Help us keep Jewish knowledge accessible to millions of people around the world. Your donation to My Jewish Learning fuels endless journeys of Jewish discovery. With your help, My Jewish Learning can continue to provide nonstop opportunities for learning, connection and growth. Donate The exact dimensions of the Temple, its windows, lattice, the winding staircase that led to the second and third stories, and even the dimensions of the porch are given. The text also gives details of the instruments utilized in the Temple’s construction: “no hammer or ax or any other iron tool” (6:7) was allowed to be used.When the Temple was completed, Solomon received a prophecy from God: “If you obey My statutes and carry out My rules of justice and take care to keep all My commandments, I will fulfill My promise, the one I made to your father David, and I will dwell among the people of Israel, and never forsake My people Israel” (6:12-13). Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-text', baseDivId: 'pb-slot-text-ad', } ], true); }); Torah <audio src="https://www.myjewishlearning.com/wp-content/uploads/2017/02/torah.mp3" controls> Your browser does not support the &lt;code&gt;audio&lt;/code&gt; element. </audio> Pronunced: TORE-uh, Origin: Hebrew, the Five Books of Moses. Support My Jewish Learning Help us keep Jewish knowledge accessible to millions of people around the world. Your donation to My Jewish Learning fuels endless journeys of Jewish discovery. With your help, My Jewish Learning can continue to provide nonstop opportunities for learning, connection and growth. Donate Haftarah <audio src="https://www.myjewishlearning.com/wp-content/uploads/2017/03/haftarah.mp3" controls> Your browser does not support the &lt;code&gt;audio&lt;/code&gt; element. </audio> Pronounced: hahf-TOErah or hahf-TOE-ruh, Origin: Hebrew, a selection from one of the biblical books of the Prophets that is read in synagogue immediately following the Torah reading. Support My Jewish Learning Help us keep Jewish knowledge accessible to millions of people around the world. Your donation to My Jewish Learning fuels endless journeys of Jewish discovery. With your help, My Jewish Learning can continue to provide nonstop opportunities for learning, connection and growth. Donate Sign Up for Our Newsletter Get Jewish wisdom & discovery in your inbox Email Sign Up By submitting I agree to the privacy policy. Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-rail', baseDivId: 'pb-slot-incontent-1', } ]); }); Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-leaderboard-bottom', baseDivId: 'pb-slot-leaderboard-bottom', } ]); });'''
