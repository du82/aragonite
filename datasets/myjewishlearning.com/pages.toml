full_description = '''Hanukkah Hanukkah 2025 In 2025, Hanukkah begins at sundown on Sunday, Dec. 14, 2024 and lasts until sundown on Monday, Dec. 22, 2025. By My Jewish Learning (Getty) Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-leaderboard', baseDivId: 'pb-slot-leaderboard-top', } ]); }); Share facebook You might also like <img src="https://img.youtube.com/vi/A0WGb5Pnmfc/maxresdefault.jpg" alt="YouTube Image" class="m-card__media"> How to Play Dreidel Hanukkah Recipes for Hanukkah Hanukkah My Jewish Learning is a not-for-profit and relies on your help Donate In 2025, Hanukkah begins at sundown on Sunday, Dec. 14, 2024 and lasts until sundown on Monday, Dec. 22, 2025.Find a Hanukkah prep checklist here. When is Hanukkah 2025? Get all the details on the holiday here. What is Hanukkah?Hanukkah, which is Hebrew for “dedication,” is the Festival of Lights.It commemorates the victory of the Maccabees over the Syrian Greek army, and the subsequent miracle of rededicating the Holy Temple in Jerusalem and restoring its menorah, or lamp. Support My Jewish Learning Help us keep Jewish knowledge accessible to millions of people around the world. Your donation to My Jewish Learning fuels endless journeys of Jewish discovery. With your help, My Jewish Learning can continue to provide nonstop opportunities for learning, connection and growth. Donate The miracle of Hanukkah is that only one vial of oil was found with just enough oil to illuminate the Temple lamp for one day, and yet it lasted for eight full days.How Do You Celebrate Hanukkah?We celebrate Hanukkah at home by lighting the menorah (each night we light one additional candle to the number from the previous night), playing dreidel, and eating special foods unique to Hanukkah. Some people also sing Hanukkah songs or exchange gifts after lighting the menorah, which is also called a hanukkiah. Many people host and attend Hanukkah parties.Download a printable PDF of the Hanukkah candle blessings here.What Are Hanukkah Foods?Many Hanukkah foods are deep-fried in oil, symbolizing the oil from the menorah used in the Temple. These include latkes, or potato pancakes, and jelly doughnuts. Other favorites include the Sephardic delicacy bimuelos and use, of course, applesauce as a latke topping. Chocolate gelt, a candy that gets its name from the Yiddish word for money, is another popular Hanukkah treat.Your Hanukkah Questions, AnsweredWhat Are the Symbols of Hanukkah and What Do They Mean?Why Hanukkah Is Actually a Minor HolidayMust-Know Hanukkah Words and PhrasesHow to Greet Someone on HanukkahWhat to Write in a Hanukkah CardIs It OK to Use an Electric Menorah for Hanukkah?What Is the Shamash Candle for Hanukkah?How Is Hanukkah Celebrated in Israel?What Do the Letters On the Dreidel Stand For?These Hanukkah Images Are Free To DownloadMore Hanukkah Reads From Our Partner SitesThe 21 Best Hanukkah Episodes on TVThe History of Hanukkah DonutsEid Al Bnat: a Jewish Hanukkah Tradition for Women9 Hanukkah Books for Kids of All Ages12 Fun and Easy Ways to Make Your Own MenorahExplore Hanukkah’s history, global traditions, food and more with My Jewish Learning’s “All About Hanukkah” email series. Sign up to take a journey through Hanukkah and go deeper into the Festival of Lights. Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-text', baseDivId: 'pb-slot-text-ad', } ], true); }); Sign Up for Our Newsletter Get Jewish wisdom & discovery in your inbox Email Sign Up By submitting I agree to the privacy policy. Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-rail', baseDivId: 'pb-slot-incontent-1', } ]); }); Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-leaderboard-