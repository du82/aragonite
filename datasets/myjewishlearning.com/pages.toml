full_description = "Shavuot Shavuot 2025 In 2025, Shavuot begins at sunset on Sunday, June 1 and ends at sundown on Tuesday, June 3. By My Jewish Learning From Christina Mattison Ebert’s D’rash Designs series. Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-leaderboard', baseDivId: 'pb-slot-leaderboard-top', } ]); }); Share facebook You might also like What Ruth Can Teach Us About Celebrating Shavuot Shavuot The Story of the Book of Ruth Bible My Jewish Learning is a not-for-profit and relies on your help Donate In 2025, Shavuot begins at sunset on Sunday, June 1 and ends at sundown on Tuesday, June 3.What is Shavuot?Shavuot, the feast of weeks, is celebrated seven weeks after the second Passover seder. Although Shavuot began as an ancient grain harvest festival, the holiday has been identified since biblical times with the giving of the Torah on Mount Sinai. When is Shavuot 2025? Click here to find out. Learn more about the history of Shavuot here.What are some customs and practices for Shavuot?– To commemorate the giving of the Torah at Sinai there is a tradition of staying up all night studying Jewish texts in what is called a tikkun. Support My Jewish Learning Help us keep Jewish knowledge accessible to millions of people around the world. Your donation to My Jewish Learning fuels endless journeys of Jewish discovery. With your help, My Jewish Learning can continue to provide nonstop opportunities for learning, connection and growth. Donate – On Shavuot the Book of Ruth is read.– Traditionally dairy foods are eaten on Shavuot.– In order to mark the agricultural history of Shavuot, some decorate their house and synagogues with a floral theme. Advertisement window.tude = window.tude || { cmd: [] }; tude.cmd.push(function() { tude.refreshAdsViaDivMappings([ { divId: 'dfp-ad-text', baseDivId: 'pb-slot-text-ad', } ], true); }); Sign Up for Our Newsletter Get Jewish wisdom & discovery 