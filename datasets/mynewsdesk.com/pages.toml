 in order to get access to such services. Agreed professional services will be defined in the Order Form. Mynewsdesk is constantly working to develop and improve the Services. Mynewsdesk reserves the right to implement new versions, upgrades and packaging of the Services including, but not limited to, changes that effect modifications to the design, operational method, technical specifications, systems, and other functions, etc. of the Services, at any time without prior notice. Customer will be informed in advance should Mynewsdesk assess the changes to be of essential importance for Customer. 2. Access to the Services, Passwords etc Mynewsdesk safeguards the Services and it is important that they can be used securely and safely. The Customer shall ensure that user identities and passwords for accessing the Services are stored and used in a secure manner and cannot be accessed and thereby used by not authorised third parties. The Customer shall be liable for any unauthorised use of the Services. Where it is suspected that any unauthorised person has become aware of a user identity and/or password, the Customer shall immediately inform Mynewsdesk thereof and also change such user identity and/or password. Mynewsdesk reserves the right to close Customer’s access to the Services at any time if Mynewsdesk considers that Customer is in breach of the Main Agreement or that there is a security risk at hand. 3. Use of the Services The Services may only be used by Customers being legal entities and organisations, not by consumers, and in accordance with the Main Agreement and security and administrative instructions sent to Customer from time to time, such as information via the Services, direct messages to Customer or via www.mynewsdesk.com. The Customer shall be responsible for the activities conducted by the Customer (its employees, consultants, directors, agent or any other authorised by Customer) within the Services and shall use the Services in compliance with all app