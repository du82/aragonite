description = "The latest in PR and marketing news for September 2024, freshly curated in the latest edition of Headlines, our PR newsletter."
full_description = "PR and Marketing News – October 2024PRGoogle’s latest AI Overviews feature may transform search results with context-aware summaries, IKEA’s creative “Sleepfluencers” campaign turns customer windows into ads, and Instagram users struggle with a 40% drop in reach. Here’s the latest PR and marketing news, freshly curated in the newest issue of our newsletter Headlines. (Haven’t subscribed yet? Join the list!) NEWS BITES Industry news, curated for you. What You Need to Know About Google’s New AI Overviews Feature Google recently launched a new Search feature called AI Overviews, which uses generative AI to provide more conversational, context-aware search results. This feature is now expanding globally. Instead of citing specific websites, it summarizes information from across the web. The AI doesn’t just match keywords; it understands the context of queries. Currently, AI Overviews appear in about 7-9% of searches and notably prioritize human-generated content over AI-generated material. Read more IKEA Launches Creative “Sleepfluencers” Campaign, Turning People’s Windows into Ads IKEA has launched a new creative campaign that transforms home windows into advertising space. The initiative invites customers to become “Sleepfluencers” by offering free printed roller blinds featuring IKEA ads in exchange for using them in their windows. Developed by the agency Åkestam Holst NoA, the campaign has already generated significant media buzz. Read more Why Your Instagram Reach May Be Dropping—And How to Fix It Instagram reach is down. A new report analyzing 5.6 million posts and 400,000 accounts shows a 40% drop in reach across all post types. But there’s still hope! Reels deliver the highest reach, accounting for 37% of total reach, while Stories lag at just 3%. To maximize your reach, focus on Reels. For engagement, carousels perform best, with an engagement rate of 10.15%. Generally, the best times to post are Wednesdays and Fridays between 7 and 9 p.m. Read more and download the report INSPIRATION Ideas we enjoyed and think you will, too. 🎧 LISTEN Podcast: Latest AI Updates for Digital Marketing In this episode of The Digital Marketing Podcast, the hosts discuss AI trends and launches, such as GPT-4o and its implications for marketers. (Feel free to skip the first 8 minutes.) Length: 23 min. 📽️ WATCH Video: Why Digital PR is the Future of Search Big changes in how Google Search works are shifting the influence of SEO, PR, and digital PR. This easy-to-understand video by Exposure Ninja explains how. Length: 14 min. 📚 READ Article: 10 Actionable Digital Marketing Trends for 2025 This trend summary explores B2B and B2C marketing and communication strategies for the upcoming year, based on industry statistics and data. Reading time: 11 min. Welcome to your monthly PR read. Headlines is your monthly PR newsletter, getting you up to speed with the industry in just minutes. A perfect quick read during your coffee break. Get inspiration and news bites from the PR and communication world curated just for professionals like you. Join the list Published: 10/2/2024Tagged as:PRShare the blog post:Share - facebookShare - X (Twitter)Share - LinkedInShare - Email"
