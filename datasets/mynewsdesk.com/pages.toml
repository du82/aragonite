["https://www.mynewsdesk.com/about/terms-and-conditions/privacy_policy_contacts"]
title = "Mynewsdesk is the world's leading all-in-one brand newsroom and multimedia PR platform."
full_description = "Customer Terms of use Content Cookie Policy Privacy Policy Privacy Policy for Contacts Security Policy Data Protection Terms Accessibility Statement Mynewsdesk Privacy Policy ContactsVersion 2024-11-271. IntroductionThis Privacy Policy describes how your personal data is processed in Contacts, a service and feature on the platform provided by Mynewsdesk AB (we, us or our), corp. reg. no. 556634-1276, at the address Rosenlundsgatan 40, 118 53 Stockholm. Customers that use our website and services (Customers) can upload, collect and further process personal data of their contacts (you, your) when using our Contacts feature. Customers are responsible for and act as data controllers in relation to their processing of personal data in their use of Contacts. You may at any time contact us at support@mynewsdesk.com to receive information about which Customers that are currently processing your personal data in Contacts, including their contact information and (if applicable) contact information to their respective data protection officers. We are however also responsible for and act as data controller in relation to the processing of your personal data insofar as our capacity as provider of the Contacts feature on our platform gives us the opportunity to enable certain processing activities (subject to our terms and conditions) as further described below. We safeguard your personal integrity. It is therefore important for us to protect your personal data and to ensure that the processing of your personal data is correct and lawful. This Privacy Policy will help you to understand what kind of personal data about you that is collected and how it is processed in Contacts by our Customers as users of our platform and by us as platform provider, as well as your rights as a data subject. We ask that you read this Privacy Policy carefully and familiarize yourself with its content. We may sometimes need to make updates or changes to this Privacy Policy. If we do so, we will inform you in an appropriate manner and we ask you to then carefully read through the updated Privacy Policy. The date of the most recent update of this Privacy Policy is given at the top of the policy. We trust that this Privacy Policy answers your questions about the collection, use, protection and disclosure of your personal data in Contacts. If you have additional questions, please contact us at the address provided above or at support@mynewsdesk.com.2. How is your personal data processed in Contacts?In this section, you can read about Contacts and the processing of personal data in the Contacts feature, including the purpose of the processing. We explain how your personal data is collected, the categories of personal data concerned, the processing activities involved, why we process your personal data as platform provider, with whom we share your personal data , including information regarding transfers of personal data outside the EU/EEA and the time period during which your personal data is stored in the Contacts platform. 2.1. About ContactsContacts is a service and feature on our platform where our Customers may collect contact information and other information about their contacts in order to efficiently manage and distribute Content. Customers may collect such information by themselves uploading it and importing it into Contacts, or by using functions in the platform allowing them to collect information imported into Contacts by us, ourselves or via our third party suppliers, such as contact information to new contacts and further information about their contacts. Contacts allows Customers to create their own address lists for send-outs based on their collected information and to use functions to generate and further analyze information regarding their contacts’ interests and how their contacts interact with and respond to their messages. The purpose of Contacts is to facilitate and enable the procedure of managing and distributing commercial and non-commercial content (including marketing messages) based on the legitimate interest for our Customers to do so in accordance with applicable data protection law. For more information about Contacts, please visit https://help.mynewsdesk.com/en/how-to/introduction-to-contacts/.2.2. How is your personal data collected in Contacts?Your personal data is imported into Contacts by:Customers uploading your contact information and other information about you to Contacts (such information is only accessed via their user accounts); orus providing your contact information and other information about you to Contacts, ourselves or via our third party suppliers, such information having been published by you or others in publicly accessible sources such as social media and other media channels online, and researched and collected by us or our third party suppliers.2.3. Which personal data is processed in Contacts? The categories of personal data processed in Contacts are the following:Name and contact details such as your address, email address, telephone number and fax number;Nationality, country and other location information;Professional title and company name;Information regarding you and your interests as published by you or others on publicly accessible sources, such as social media and other media channels online, for example on your profile on LinkedIn, X/Twitter, Facebook or other information platforms;Information about your interaction with emails sent to you via the email function in Contacts; andProfile picture made publicly accessible by you or others on a media outlet’s page or on social media platforms, such as on your profile on X/Twitter or other platforms where your profile image is publicly available.2.4. How is your personal data processed in Contacts?Your personal data will only be processed for the following activities in Contacts.Search function: Making articles and other items that have been published online and which contain information about you easy to find;Address lists function: Adding your contact information and other information about you to address lists in Contacts in order to manage and distribute content to you;Email function: Distributing content to you;Following-up on and analyzing your personal interests with digital analyzing tools in order to choose relevant content based on your personal interests, including data generated from your interaction with emails sent to you via the email function in Contacts. To opt-out from processing under this section (d), please opt-out here: https://www.mynewsdesk.com/audience_reach_opt_outs/new2.5. Why we process your personal data as provider of the Contacts featureIn this subsection, we describe when and why we process your personal data. Your personal data will not be used by us in any manner that is incompatible with the purposes for which they were collected.2.5.1. Provide our servicesWe process your personal data to provide the Contacts service and feature on our platform. Our processing for the purpose of providing our services is based on our legitimate interest to do so in order to facilitate and enable our Customers’ procedure of managing and distributing commercial and non-commercial content as described in section 2.1 above. We have assessed that this processing does not override your fundamental rights and freedoms, as we only use professional contact data from publicly available sources, and we offer the ability to opt-out at any time.2.5.2. Improve our servicesWe process your personal data to improve our services and make them more user friendly (e.g. by testing and troubleshooting, fixing bugs and amending our interfaces). This includes producing statistics on and analyzing how our services are used. For these purposes, we also use your personal data based on your activity associated with messages sent to you by our Customers.To the extent possible, we use your personal data in an aggregated or anonymized form in this processing. Our processing for the purpose of improving our services is based on our legitimate interest to do so.2.6. How we share your personal data as provider of the Contacts featureThe personal data collected in Contacts is shared with our Customers for their use of Contacts as explained in this Privacy Policy. In addition to this, the personal data collected in Contacts is shared with other companies in the Mynewsdesk group as well as with our third party suppliers and other third parties listed below, for the provision of our services such as theContacts feature, including for our developing and maintenance of the platform. This may involve coordination of your personal data with other registers. These are the types of third parties with whom we share your personal data:Service providers: We use third party service providers to manage some aspects of our business operations, including the processing or handling of personal data related to Contacts. We share personal data related to Contacts with such third parties with regard to IT infrastructure, operating and hosting services and other IT services such as IT support, maintenance and development.Sale or transfer of business or assets: Your personal data may, to the extent allowed and in accordance with applicable data protection law, be transferred or disclosed to a purchaser or prospective purchaser in the event of a sale, assignment, or other transfer of all or a portion of our business or assets.For security reasons: We may share your personal data when this is required by law, to protect you or our Customers or for the security of our services. When we use service providers in accordance with (a) above, we will enter into a data processing agreement with the service provider which requires it to ensure that your personal data is only processed in accordance with our instructions and take other appropriate measures to ensure that your personal data is processed in accordance with this Privacy Policy.Processing and sharing of your personal data in accordance with (a)-(c) above is necessary for our legitimate interest to provide our services, including Contacts or to comply with mandatory law.2.7. Transfer of your personal data outside the EU/EEAWhen another company in the Mynewsdesk group, our service providers, other suppliers or any potential purchaser of our business or assets are located in or have business activities in a country outside the EU/EEA, we may transfer your personal data to such countries. In the event of such transfer it will be made in accordance with applicable data protection law, for example by ensuring that the country in which the recipient is located ensures an adequate level of data protection according to the European Commission or by use of standard contractual clauses that the European Commission has issued ensuring suitable measures to safeguard your rights and freedoms. You may access a list of the countries that the European Commission has decided provide an adequate level of data protection at https://ec.europa.eu/justice/data-protection/international-transfers/adequacy/index_en.htm. You may access the European Commission’s standard contractual clauses at https://eur-lex.europa.eu/eli/dec/2010/87/oj. 2.8. For how long do we store your personal data?Your personal data will only be processed in Contacts for as long as necessary for the purposes set out in this Privacy Policy and to fulfill our legal duties to store data otherwise, but no longer than permitted by applicable law. We have routines in place to periodically review data and will delete any personal data that is no longer necessary or allowed to store, including due to termination of the agreements between us and our Customers or where you have opted-out from processing in Contacts. See section 4.5 below to learn more about your right to opt-out. 3. Security measuresWe have taken a number of security measures to ensure that the personal data we keep in Contacts is secure. For example, access to areas where personal data is stored is limited to our employees and service providers who require it in the course of their duties and who are informed of the importance of maintaining the security and confidentiality of the personal data we keep. We maintain appropriate safeguards and security standards to protect your personal data against unauthorized access, disclosure or misuse. We also monitor our systems to discover vulnerabilities in order to protect your personal data.4. Your rights4.1. IntroductionIn this section, we describe your rights under applicable data protection law as well as how you exercise these rights. As described in section 1, our Customers are responsible for and act as data controllers in relation to their processing of personal data in their use of Contacts. We are responsible for and act as data controllers insofar as our capacity as provider of the Contacts feature on our platform gives us the opportunity to enable certain processing activities (subject to our terms and conditions), but otherwise only act as data processor on behalf of our Customers with regard to their processing of personal data within Contacts. You may exercise your rights in relation to the processing of personal data within Contacts regardless of whether your right concerns the processing of our Customers or our processing. According to our customer agreements both we and our Customers shall ensure compliance with applicable data protection law and thereby respect your rights as a data subject in relation to the processing activities in Contacts. Against this background, and as a part of our service to our Customers, we help facilitate for our Customers to fulfil their obligations in relation to your rights. We thus inform in this Privacy Policy about our Customers’ processing of personal data within Contacts and our platform includes functions allowing you to exercise your rights, as further described below. Furthermore, you may at all times contact us at support@mynewsdesk.com to exercise your rights as below, as well as if you have any questions or comments regarding the processing of your personal data in Contacts or this Privacy Policy. We will respond within a reasonable period of time upon verification of your identity. Should your question or request be related to the processing of personal data by one or more of our Customers and our tools not be sufficient to ensure that your rights are ensured, we will forward your question or request to the relevant Customer processing your personal data, for their further handling and inform you accordingly.4.2. Right of access and rectificationYou have the right to information regarding which of your personal data that is processed in Contacts and to access and rectify such personal data. 4.3. Right to erasureBy sending an email to support@mynewsdesk.com, you may request that your personal data is erased from Contacts without undue delay in the following circumstances:the personal data is no longer necessary in relation to"
