licable laws in conjunction therewith. All Content uploaded to, transferred through, publicly posted, processed or entered into the Services by the Customer shall be the sole responsibility of the Customer. Customer shall use the Services solely for its internal business purposes and shall not: (i) license, sublicense, sell, resell, rent, lease, transfer, assign, distribute, time share or otherwise commercially exploit or make the Services available to any third party (ii) send spam or otherwise duplicative or unsolicited messages in violation of applicable laws; (iii) knowingly send or store material containing software viruses, worms, Trojan horses or other harmful computer code, files, scripts, agents or programs, allow a “bot” or other not approved automated process to interact with the Services; (iv) interfere with or disrupt the integrity or performance of the Services or the data contained therein; or (v) attempt to gain unauthorized access to the Services or its related systems or networks. Customer shall not (i) modify, copy or create derivative works based on the Services or (ii) disassemble, reverse engineer, or decompile the Services. 4. Customer Content It is of outmost importance that the rights of others are respected in the use of the Services. All Content uploaded to, transferred through, published, processed or entered into the Services by the Customer shall be the sole responsibility of the Customer. This shall also in all aspects be applicable for Content produced by Mynewsdesk as part of agreed provided professional services to Customer. The Customer shall be responsible for monitoring its Content and shall be liable vis-à-vis Mynewsdesk for ensuring that Content published by the Customer does not infringe any third party rights nor in any other manner violates the Main Agreement, Mynewsdesk’s instructions and applicable law, and that the Content otherwise is appropriate. The Customer must therefore analyse and critically assess its obligations 