["https://www.mynewsdesk.com/pricing"]
title = "Plans | Mynewsdesk"
description = "Check out our different subscription plans and contact us today to start a free trial period or get a price quote."
full_description = "StartPlansTake the first step towards smarter PR todayRegardless of the size of your organisation or your previous PR experience – our platform can be tailored to your needs! Contact us today to begin your free trial or request a quote. Price requestGoThe ultimate solution to get your PR going – all in one place 1 SEO-friendly newsroom Network management Analytics Media coverage Total number of monthly email send outs: 3 000 ProStronger impact from your communication efforts with platform intelligence Everything in Go +: Newsroom on your website Audience targeting recommendations Total number of monthly email send outs: 10 000 Enterprise Supercharge results across the board Everything in Pro +: Tailored to address your needs Access to all advanced features Customer success manager Total number of monthly email send outs: 50 000 GoProEnterprisePublishDisplay parts of your news on the website while driving traffic to your newsroom.Online NewsroomRead more about PR & SEOSEO optimized newsroomMultiple NewsroomsEmbed or integrate your Newsroom to your website. Customizabel to fit your brand. Newsroom on Your WebsiteContactsSend your content to specific contacts or mass distribute to lists.Email Distribution 3000 emails per month10 000 emails per month50 000 emails per monthOrganize and manage your contacts effectively.Network ManagementSee opening rates and click rates for all your contacts. Email Performance StatsConnect your Twitter, Youtube and FB accounts and publish your posts.Social Media ChannelsReach 16000 subscribers and followers with your stories. Maximum Subscriber ReachModify fonts and color after your brand.Custom Email DesignEmail sending from your own domainImport contactsImport up to 1000 contactsUnlimited amountUnlimited amountMedia database with access to up to 1 million global sources.Audience BuilderAdd-on serviceAdd-on serviceAdd-on serviceAnalyzeGet a dashboard overview of your Newsroom performance. Basic AnalyticsGather useful analytics on the full performance of your newsroom. Newsroom AnalyticsCollect data on each story. Detailed AnalyticsGoogle Analytics integrationUse accourate data to compare your PR work with your competitors. BenchmarkingMonitor *Add-on service in plans where not already includedMedia Monitoring Add-on featureAdd-on featureAdd-on featureSocial Monitoring Add-on featureAdd-on featureAdd-on featureConsulting Monitoring Setup2 hours2 hours3 hoursServicesFree SupportParticipate in a training webinar. Free TrainingCustomer Success Manager Customized Training Book a demoBook a demoBook a demoFAQWhat is Mynewsdesk?Mynewsdesk is a digital platform that uses AI to offer you an intelligent solution for your PR. Companies and organizations use Mynewsdesk to increase brand awareness and to engage with journalists, opinion leaders, customers, influencers and other relevant target groups. How does Mynewsdesk work?In Mynewsdesk’s digital newsroom, companies and organizations can easily share news with over one million journalists worldwide. With our analysis tool, you get detailed insights about the reach and media exposure you get, and our tool for media monitoring can help you see your impact in the media. Mynewsdesk helps you evaluate your work, so you can maximize your PR and communication efforts to gain even better results! Who uses Mynewsdesk?Companies and organizations use Mynewsdesk to increase their brand awareness, and to build relationships with journalists, opinion leaders, customers, influencers and other relevant target groups. Journalists, influencers and opinion leaders use Mynewsdesk to create news coverage for topics that are relevant to them. With Mynewsdesk, they can take part in news that they might otherwise have missed out on. What are the benefits of Mynewsdesk?Mynewsdesk’s digital newsroom is all you need for your PR and communication! By gathering all your external communication in one platform, you get an efficient workflow with publishing, distribution, media monitoring, analysis and a strong global media database with over one million journalist contacts. We make it easier and more efficient for companies and organizations to build relationships, and create knowledge about their business. What reach does Mynewsdesk offer?We have a local network of 29,000 journalists who subscribe to news from Mynewsdesk. In addition, we have our global media database with international journalists. In total, you can reach over one million journalists worldwide. Further, Mynewsdesk’s strong domain gives your publications better rankings in search results and thereby increased visibility. With our platform, you will reach the best and most relevant audience for your communication. Is Mynewsdesk free?For journalists and readers, Mynewsdesk is free. As a company or organization, we offer a free trial of Mynewsdesk, for ten days. When your trial ends, we offer different options that are customized to your needs and wishes. For prices and subscriptions, click here. Where can I find more information about prices and subscriptions?You will find our subscriptions here. For more information about our prices, you are welcome to contact our sales department here! How do I book a demo of Mynewsdesk?You can easily book a demo of Mynewsdesk here! How do I get in touch with customer support and sales?You are welcome to contact us here at any time. Feel free to follow us on Facebook, Twitter, Linkedin, and Instagram for more information. How does Mynewsdesk work with AI?Mynewsdesk’s digital PR solution is built with AI technology helping you in every step of your PR workflow. Create powerful press releases within seconds with the help of AI. Find relevant journalists, influencers and media outlets for your news in real time, based on the AI analyzing your content in order to identify who you should contact. The built-in AI also automatically monitors the distribution and performance of every news item you publish via Mynewsdesk’s press service. All in all, My.ai enables you to better understand your PR work, save time and maximise your results. You got yourself a new PR Assistant. How does Mynewsdesk handle GDPR?Mynewsdesk has updated Terms and Conditions in accordance with the new Data Protection Regulation, GDPR. As a customer, you are responsible for ensuring that your contact list in our platform is handled in a legal manner in accordance with the GDPR. Thereby, you need to create and define routines regarding the handling of your contact lists. You can read more about how we handle GDPR here. Get started right awaySet up your newsroom in 10 minutes and access 1 million contacts. Book a demoFree trial"
