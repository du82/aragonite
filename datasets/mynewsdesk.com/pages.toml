reement. In the event of any conflict between these General Terms and Conditions, the Data Protection Terms/Data Processing Agreement shall prevail. 7. Media Monitoring Services If media monitoring services are included in the Services under the Main Agreement, then the following shall also apply: Customer may only use the Articles (Article being text, image or video material published on websites, social medias or printed as a physical copy) provided within the media monitoring service for its internal use. Articles, or parts thereof, may not be published or in any way disclosed to a third party. This includes, but is not limited to, linking to the Article or using them for marketing purposes. If applicable law permits Customer to store the material reported in the Article electronically for Customer’s internal use, Customer may only do so for a maximum of 30 days, including all links to and copies of it. Customer is not entitled to create databases, collections, or archives with such material. Upon termination of the Paid Subscription Period all material in media monitoring shall be deleted without delay. If applicable law permits Customer to use the material reported in the Article, Customer agrees to, in accordance with good practice, cite the source, author, and title to the material when Customer uses it. Furthermore, Customer agrees to be responsible for the material not being used in any way or in any context that violates the author’s moral rights, including in relation to literary or artistic reputation or character. Mynewsdesk reserves the right to limit the number of Articles generated to the Customer. 8. Accessibility and security Mynewsdesk undertakes, in its sole discretion, to adopt reasonable measures in order to ensure that the Services are available over the Internet around the clock, seven (7) days a week. Mynewsdesk shall be entitled to take measures that affect the aforementioned accessibility where Mynewsdesk deems such to be necessary for technical, maintenance, operational, or security reasons. Customer is aware and accept that maintenance, upgrades, bugs and other planned or unplanned causes or circumstances can lead to interruptions or faults in the Services. Customer can access status.mynewsdesk.com to get information on the current operational status of the Services. The Customer is aware and acknowledges that the Customer’s access to the Internet cannot be guaranteed and that Mynewsdesk shall never be liable for deficiencies in the Customer’s own Internet connections or equipment. Mynewsdesk shall adopt reasonable measures to ensure that the security of the Services meet relevant industry standards. Mynewsdesk’s security measures are set forth in the Security Policy as applicable from time to time, which is available on this link. 9. Support service Should any questions arise about the use of the Services, Mynewsdesk provides customer support services. Contact information and opening hours of the support service may be found on Mynewsdesk’s website. 10. Term and termination The Services, as set out in the Order Form, are available between the dates of subscription start and subscription end as stated in the Order Form (the Paid Subscription Period). The Main Agreement is valid during the Paid Subscription Period. Upon expiration of the Paid Subscription Period, the Paid Subscription and the Main Agreement will be automatically renewed with successive renewal terms at Mynewsdesk then current terms and conditions (the Renewal Period). If neither party has terminated the Paid Subscription no later than 90 calendar days prior to the Paid Subscription Period ends (or the expiry of the subsequently extended Renewal Periods), the duration of the Paid Subscription Period and the Main Agreement is extended by the same length of time as the Paid Subscription Period. The Customer’s termination of the Paid Subscription and the Main Agreement shall be made by submitting the cancellation form available in the settings area of the Services as an authenticated and logged in user. If no date is stated for subscription end in the Order Form or in an online sign-up form, the Services are available for one (1) month from the date of subscription start and the Main Agreement will then apply during this period. After the Paid Subscription Period or a cost free trial period has ended, the Services are automatically downgraded to the subscription type “Free”. The Main Agreement is valid during the Free subscription period. The Main Agreement can under a Free subscription period be terminated by either party subject to written notice or, when available, by use of an online module. Mynewsdesk may always, with immediate effect, terminate the Main Agreement earlier than what is stated above if Customer significantly or repeatedly fails in obligations under the Main Agreement and do not take action to correct this within 30 days of receipt of a written request to do so from Mynewsdesk, or enters into bankruptcy, enters into a"
