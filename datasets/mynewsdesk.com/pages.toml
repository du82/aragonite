title = "Mynewsdesk is the world's leading all-in-one brand newsroom and multimedia PR platform."
full_description = "Customer Terms of use Content Cookie Policy Privacy Policy Privacy Policy for Contacts Security Policy Data Protection Terms Accessibility Statement Cookie Policy We use cookies on our website. Cookies are small text files that are saved on your computer. In this cookie policy, we state which cookies we use, why we do this and how you can prevent their use. What kind of cookies does Mynewsdesk use? We use two types of cookies on our website. The first type is a permanent cookie that remains on your computer for a predetermined period of time and has an expiry date. This type of cookies is used, for example, with functions that tell you what is new since you last visited the website or to save your personal settings. When the expiry date has passed, this type of cookie will be deleted when you return to the website that created it. The second type of cookie is a session cookie, which is temporarily saved in the computer’s memory during the time that you are visiting our website. Such cookies are used, for example, to remember which language you chose. Session cookies disappear when you close your browser. We also use so-called third party cookies from other companies. Why does Mynewsdesk use cookies? We use cookies to follow and facilitate your activities on our website and to optimise its functionality. Cookies are also used to measure traffic on our website and for statistical purposes. This means that, among other things, we use cookies to: allow the system to recognise returning users and adapt the navigation and services, make it easier for you to find your way around the website, for example by allowing the system to remember your earlier choices and allowing you to set favourites and shortcuts for programs and services, develop and improve the website by understanding how it is used; and calculate and report user numbers and traffic. We use third party cookies from other companies to perform market surveys and traffic measurements and to improve the functionality of the website. We attach a list and description of the cookies that we use. This list may be updated from time to time since the cookies that we use may vary. Can you prevent the use of cookies? By using our website, you consent to our use of cookies according to this Cookie Policy. If you do not accept the use of cookies, you can turn off their use in your browser’s security settings. You can also adjust the browser so that you receive a question every time our website attempts to place a cookie on your computer. If your browser supports a so-called incognito mode, you can activate this so as to automatically erase all cookies every time you close your browser. You can also manually delete cookies from your hard disc at any time. For more information about how to permit or prohibit cookies, we refer to the help pages for your browser and to ec.europa.eu/ipg/basics/legal/cookies/index_en.htm or www.aboutcookies.org."
year_published = 2025
