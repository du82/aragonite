full_description = 'Customer Terms of use Content Cookie Policy Privacy Policy Privacy Policy for Contacts Security Policy Data Protection Terms Accessibility Statement Data Protection Terms Version: Apr 7, 2022 These data protection terms (the “DPT”) have been entered into by and between Customer and Mynewsdesk (each a “Party” and collectively the “Parties”). The Parties have agreed as follows: Background 1.1. Customer and Mynewsdesk have entered into an agreement regarding Mynewsdesk’s provision of Services to the Customer (below the “Main Agreement”). These DPT set out and describe different aspects and obligations of the Parties with regard to the Processing of Personal Data that may take place when Customer uses these Services or otherwise as an effect of the Main Agreement. 1.2. Furthermore, the Parties may in respect of their relationship and in relation to the Processing of Personal Data described in Clause 1.1 take on different roles and responsibilities. These DPT clarify when the Parties act as Data Controller and when Mynewsdesk acts as Data Processor and Processes Personal Data on behalf of Customer, as well as the Parties’ obligations and responsibilities in relation hereto. 1.3. Also, Applicable Data Protection Law stipulates that when a Data Processor Processes Personal Data on behalf of a Data Controller, such relationship shall be governed by a contract. Appendix 1 (the “DPA”) has been established to comply with the requirements on such contracts, for the situation where Mynewsdesk acts as Data Processor. The DPA forms an integral part of these DPT. 1.4. Terms used herein shall have the same meaning as set out elsewhere in the Main Agreement and as set out in Applicable Data Protection Law. 1.5. With respect of the above the Parties have agreed as follows. Definitions In these DPT: “Applicable Data Protection Law” means any and all data protection laws and regulations applicable from time to time on the Processing of Personal Data under these DPT (including but not limited to the Swedish Data Protection Act (Sw. lag (2018:218) med kompletterande bestämmelser till EU:s dataskyddsförordning) and Regulation (EU) 2016/679 of the European Parliament and of the Council of 27 April 2016 on the protection of natural persons with regard to the Processing of Personal Data and on the free movement of such data (General Data Protection Regulation)(“GDPR”). "Contacts" means the service and feature on Mynewsdesk’s platform where Customer may collect contact information and other information about its contacts in order to efficiently manage and distribute Content. “Data Controller” means the natural or legal person, public authority, agency or other body which, alone or jointly with others, determines the purposes and means of the Processing of Personal Data “Data Processor” means a natural or legal person, public authority, agency or other body which Processes Personal Data on behalf of the Data Controller. “Data Subject” means an identified or identifiable natural person; an identifiable natural person is one who can be identified, directly or indirectly, in particular by reference to an identifier such as a name, an identification number, location data, an online identifier or to one or more factors specific to the physical, physiological, genetic, mental, economic, cultural or social identity of that natural person. “Personal Data” means any information relating to a Data Subject. “Processing (of Personal Data)” means any operation or set of operations which is performed on Personal Data or on sets of Personal Data, whether or not by automated means, such as collection, recording, organisation, structuring, storage, adaptation or alteration, retrieval, consultation, use, disclosure by transmission, dissemination or otherwise making available, alignment or combination, restriction, erasure or destruction. Obligations and responsibilities 3.1. General It is important for Mynewsdesk to safeguard personal integrity and ensure that any Processing of Personal Data within the Services is correct and lawful. Therefore, Mynewsdesk’s Services may only be used in accordance with Applicable Data Protection Law. 3.2. Processing of Personal Data of the Parties’ employees and/or representatives 3.2.1. Each Party may as an effect of the Main Agreement and these DPT Process contact information, and possibly also other Personal Data, of the other Party’s employees and/or representatives. Such Processing may be for communication and invoicing purposes and otherwise to manage each Party’s relationship with the other Party. Each Party shall ensure that the other Party has the right to Process such Personal Data belonging to such employees and/or representatives of that Party, to the extent necessary for the first Party’s fulfilment of the Main Agreement and these DPT. 3.2.2. Customer’s employees and/or representatives may create user accounts for their use of Mynewsdesk’s Services. Mynewsdesk’s Processing of Personal Data of such Data Subject is, in addition to what is covered by Clause 3.2.1, subject to the direct relationship between Mynewsdesk and such employee and/or representative and covered by Mynewsdesk’s relevant terms for user accounts including relevant privacy notice or similar. 3.3. Publishing of Content containing Personal Data on the Mynewsdesk platform Customer may publish Content on Mynewsdesk’s platform, by itself or by instructing Mynewsdesk to publish such Content on behalf of Customer. Customer acts as Data Controller for such Processing to the extent such Content contains Personal Data. Mynewsdesk is the Data Processor in relation to Customer for the provision of a publishing function on its platform and when Mynewsdesk publishes Content on Customer’s behalf and instruction. 3.4. Processing of Personal Data in the Contacts feature 3.4.1. About Contacts 3.4.1.1. Contacts is a service and feature on Mynewsdesk’s platform where Customer may collect contact information and other information about its contacts. Customer may collect such information by itself importing it into Contacts, or by using functions in the platform allowing it to collect information imported into Contacts by Mynewsdesk or its third party suppliers. 3.4.1.2. Contacts allows Customer to search information, to create address lists for send-outs based on its collected information, to distribute Content to its contacts, and to follow-up and analyze its contacts’ personal interests and how its contacts interact with messages sent to them through the functions in Contacts. 3.4.1.3. The purpose of Contacts is to facilitate and enable the procedure of managing and distributing commercial and non-commercial content (including marketing messages) based on the legitimate interest to do so or, where applicable, based on an alternative legal ground that Customer may have for its Processing, in accordance with Applicable Data Protection law. 3.4.2. Categories of Personal Data in Contacts The following categories of Personal Data may be imported to and Processed in Contacts: Name and contact details such as address, email address and telephone number and fax number; Nationality, country and other location information; Professional title and company name; Information regarding the contacts and the contacts’ interests. 3.4.3. Importing of Personal Data to Contacts 3.4.3.1. Customer may import Personal Data, as set out in Clause 3.4.2, to Contacts by uploading such Personal Data to the platform via its user account. Customer acts as Data Controller for such Processing and may only import such data to the platform if and to the extent Customer has secured its legal right to do so. 3.4.3.2. Customer may, by using Contacts, gain access to Personal Data that Customer has not uploaded to the platform, such as contact information and supplementing information about other contacts than its contacts and, to the extent applicable, supplementing information about its contacts. The Personal Data described in this Clause 3.4.3.2 is researched and collected, from publicly accessible sources such as social media and other media channels online, and imported into Contacts by Mynewsdesk, itself or via its third party suppliers. Mynewsdesk acts as Data Controller for the gathering and transfer to Customer of such Personal Data to the extent it is researched, collected and imported into Contacts by Mynewsdesk, and may only transfer such data to Customer if and to the extent Mynewsdesk has secured its legal right to do so. Each third party supplier acts as Data Controller for its gathering and transfer to Customer of such Personal Data. 3.4.4. Further Processing of Personal Data in Contacts 3.4.4.1. Customer may in Contacts further Process such Personal Data described in Clause 3.4.3. Customer may hereby store (in general as well as in organized address lists), edit, manage, and erase such data, by itself or by instructing Mynewsdesk to carry out such action on behalf of Customer. Customer may also use functions in the platform to send electronic messages to its contacts and analyse its contacts’ behaviour in relation to such messages. Customer acts as Data Controller in relation to such further Processing of Personal Data. Mynewsdesk acts as Data Processor in relation to Customer for the storing of Personal Data accordingly as well as for the provision to Customer of an interface and function on its platform allowing Customer to send electronic messages and analyse its contacts’ behaviour in relation to such messages and, where applicable, for support services provided to Customer. 3.4.4.2. Mynewsdesk acts as Data Controller in relation to its further Processing of Personal Data in Contacts for its own purposes (providing its services to enable Processing activities in Contacts and analysing Data Subjects’ activity in order to improve the Services, including error handling). 3.5. The Parties’ obligations in their capacity as Data Controller 3.5.1. Each of the Parties shall, when it acts as Data Controller under these DPT, ensure and be responsible for compliance with the requirements on such Data Controller as set out in Applicable Data Protection Law, including, but not limited to, ensuring a legal ground applicable to its Processing, taking appropriate measures to inform Data Subjects about relevant Processing of Personal Data and facilitating the exercise of Data Subjects’ rights in relation to such Processing. Each of the Parties shall also ensure and be responsible for compliance with any other legislation applicable to its Processing under these DPT. Customer shall thus ensure and be responsible for obtaining consent from Data Subject for send-outs containing marketing messages to the extent such consent is necessary according to applicable law. 3.5.2. Mynewsdesk will, as part of their services to Customer, assist Customer in fulfilling its obligations as set out in Clause 3.5.1 insofar that (i) Mynewsdesk will provide a privacy notice, including information about the Processing of Personal Data in Contacts in each electronic message sent via Contacts and on the Mynewsdesk website and (ii) Mynewsdesk’s platform will include functions allowing Data Subjects to unsubscribe from receiving marketing messages via Contacts as well as to opt-out from Processing of their Personal Data in Contacts. Mynewsdesk will also provide a support email address to which Data Subjects can send requests to exercise their rights. Mynewsdesk will, through functions in Contacts or otherwise, inform Customer when it receives information that a Data Subject chooses to exercise its rights in relation to the Processing of its Personal Data by Customer in Contacts. 3.5.3. Customer shall at all times respect Data Subjects’ exercise of their rights according to Applicable Data Protection Law. Customer may thus not within the Services Process the Personal Data of any Data Subject which has objected to, opted-out from or otherwise opposed such Processing or which has requested the erasure of its Personal Data from the Services. 3.6. Restrictions in relation to Sensitive Personal Data Customer is aware that the Services are not intended to collect, manage or in any other way Process special categories of Personal Data (so called “Sensitive Personal Data”). Customer is further aware that such Processing is prohibited according to Applicable Data Protection Law, except where an exception set out in such law is applicable. Customer shall, to the extent it Processes special categories of Personal Data in its use of the Services be fully responsible thereto and at all times hold Mynewsdesk harmless from any liability that may result from Customer’s use of the Services to Process Sensitive Personal Data. 3.7. Restrictions in relation to Personal Data gained access to through the Services 3.7.1. Except for as expressly set out herein, Customer may not, during the term of these DPT or thereafter, to any third parties disclose, misuse or use for any other purpose or in any other way than for its use of the Services, Personal Data gained access to as a result of its use of the Services. For the sake of clarity, such data include, but is not limited to, the following: Personal Data that the Customer has not itself imported to Contacts, as set out in Clause 3.4.3.2; The identity of Customer’s newsroom followers and their interaction with messages sent to them through the functions in Contacts; and Personal Data included in materials produced by Mynewsdesk’s media monitoring and media analysis services. 3.7.2. Except for as expressly set out herein, Mynewsdesk may not, during the term of these DPT or thereafter, to any third parties disclose, misuse or use for any other purpose or in any other way than for Customer’s use of the Services Personal Data gained access to from Customer as a result of Customer’s use of Contacts. For the sake of clarity, such data includes Personal Data as Customer has imported to Contacts as set out in Clause 3.4.3.1. 3.7.3. The restrictions set out in this Clause 3.7 do not apply to information that is generally known or that the Party subject to the restriction is obliged to provide in accordance with law, regulations or the decisions of the authorities. 3.8. Mynewsdesk’s Processing of data for the purposes of providing the Services Mynewsdesk may however at all times Process Personal Data and other data that Customer has uploaded to the platform for the purposes of providing its Services, including for improving the Services and ensuring and improving the IT security of the Services. Mynewsdesk may, for a period of 12 months from the creation of the file, for these purposes create and keep a log file on Customer’s employees’ and/or representatives’ use of and actions within Mynewsdesk’s Services. Mynewsdesk acts as Data Controller for such Processing of Personal Data for its own purposes. Obligation to provide contact information of data protection officer If Customer has appointed a data protection '
