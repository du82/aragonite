sdesk.com to exercise your rights as below, as well as if you have any questions or comments regarding the processing of your personal data in Contacts or this Privacy Policy. We will respond within a reasonable period of time upon verification of your identity. Should your question or request be related to the processing of personal data by one or more of our Customers and our tools not be sufficient to ensure that your rights are ensured, we will forward your question or request to the relevant Customer processing your personal data, for their further handling and inform you accordingly.4.2. Right of access and rectificationYou have the right to information regarding which of your personal data that is processed in Contacts and to access and rectify such personal data. 4.3. Right to erasureBy sending an email to support@mynewsdesk.com, you may request that your personal data is erased from Contacts without undue delay in the following circumstances:the personal data is no longer necessary in relation to"
