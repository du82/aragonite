ettings area of the Services as an authenticated and logged in user. If no date is stated for subscription end in the Order Form or in an online sign-up form, the Services are available for one (1) month from the date of subscription start and the Main Agreement will then apply during this period. After the Paid Subscription Period or a cost free trial period has ended, the Services are automatically downgraded to the subscription type “Free”. The Main Agreement is valid during the Free subscription period. The Main Agreement can under a Free subscription period be terminated by either party subject to written notice or, when available, by use of an online module. Mynewsdesk may always, with immediate effect, terminate the Main Agreement earlier than what is stated above if Customer significantly or repeatedly fails in obligations under the Main Agreement and do not take action to correct this within 30 days of receipt of a written request to do so from Mynewsdesk, or enters into bankruptcy, enters into a"
