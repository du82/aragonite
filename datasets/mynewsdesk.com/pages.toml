full_description = "Customer Terms of use Content Cookie Policy Privacy Policy Privacy Policy for Contacts Security Policy Data Protection Terms Accessibility Statement General Terms and Conditions Version: December 14, 2022 These terms and conditions (the General Terms and Conditions) apply to Mynewsdesk AB’s (Mynewsdesk) corporate registration number 556634-1276, at the address Rosenlundsgatan 40, 118 53 Stockholm, provision of services, (the Services) (as defined in the Order Form) to Customer and state the conditions under which the Services may be used to upload, send, publish, share or in any other way transfer information and material, including but not limited to images, films, texts and music (the Content). The General Terms and Conditions represent together with a signed order form (the Order Form) the valid agreement (the Main Agreement) between the parties during the Paid Subscription Period and the Free subscription period (as defined below) . What is stated in the Order Form takes precedence over what is stated in the General Terms and Conditions if the content of the documents should differ. By signing an Order Form, or by accepting these General Terms and Conditions upon a sign up procedure, or in any other way, you hereby confirm that you are authorized to bind the Customer through such execution. 1. The Services The Services means the at all times current version of the web services, associated software, and other services related thereto provided to the Customer by Mynewsdesk in accordance with the Main Agreement. The Services are offered as a Software as a Service with the characteristics and features as described at www.mynewsdesk.com. In addition, the Services may include additional services and add-ons, including professional services, third party software and services, as agreed between the Customer and Mynewsdesk. If third party services are ordered through the Services, Customer may be obliged to accept such third party terms and conditions