description = "Mynewsdesk was founded in 2003 by a journalist, a communications specialist and a developer to transform the conservative PR industry."
full_description = "Our visionWe believe that communication is the key to building strong and lasting relationships. Mynewsdesk is looking to simplify the workflow for PR professionals and also ensure maximum impact. Because communication is power. Building awareness and relations today, creating a positive impact on the society of tomorrow. Our valuesAt Mynewsdesk, we’ve involved all employees in a joint effort to capture the values that define who we are and what we want to be. This creates a strong unity around the principles that guide us and influence everything we do, making sure we can continue to grow, develop and create the future we want – together. We are empoweredWe are empowered to make decisions and have the authority to own our areas of expertise. Mynewsdesk – part of the NHST GroupSince 2008, Mynewsdesk has been a part of the Norwegian media group NHST, owner of some of Norway’s most prominent business publications, such as Dagens Næringsliv and DN.no. Learn more about NHST Group Join us!Mynewsdesk is a creative workplace where your talents can truly flourish. A place that enables you to grow – both professionally and as an individual. As a rapidly growing company, we’re always on the lookout for great people to join us in building the world’s leading PR platform. Get to know the Mynewsdesk crew and explore open positions on our careers page. Visit our careers page"
