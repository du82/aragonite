full_description = '''Looking to reduce the amount of plastic in your life? GET STARTED HERE. Welcome. I'm Beth Terry, an accountant living in Greenbelt, MD (by way of the San Francisco Bay Area). In 2007, I unexpectedly found myself an activist, author, and public speaker after learning about the devastating effects of plastic pollution and my own plastic footprint. Over the years, this site has evolved from a simple blog (formerly known as "Fake Plastic Fish") to a comprehensive resource on plastic-free living. As it happens, my life has evolved as well, and I am no longer able to update the information on this site to keep up with new information and new trends. Much of the information is still relevant and useful, so I plan to continue to maintain it as an archive for those who wish to get started reducing their plastic use. Recent Blog Posts Click image to read story, or peruse all 749 posts. Spring Gardening with Orta Plastic-Free Self-Watering Seed Pots March 21, 2019 Why I Love Plastic-Free Bite Toothpaste Bits March 21, 2019 19 Replies Jules Thin Crust – Setting an Example for Zero Waste Restaurants February 16, 2019 2 Replies Easy Bulk Shopping with the Goods Holding Company System February 9, 2019 5 Replies Solid Plastic-Free Shower Gel and Body Wash? What Do You Think? June 3, 2018 26 Replies How To Move Long Distance Without Plastic January 31, 2018 23 Replies Who Gives a Crap Recycled or Bamboo Toilet Paper without Plastic September 26, 2017 99 Replies The Beach Doesn’t Care Whose Fault It Is June 29, 2017 1 Reply How to Buy and Store Loose Lettuce & Leafy Greens Without Plastic February 24, 2017 19 Replies How to Buy “New Shoes” without Buying New Shoes January 16, 2017 2 Replies Homemade Plastic-Free Beef Jerky December 27, 2016 9 Replies DIY Plastic-Free Ironing Board Cover and Natural Wool Pad December 26, 2016 8 Replies Homemade Broth and Better Broth Concentrate December 9, 2016 6 Replies MOM’s Organic Market Wants You to Bring Your Own Containers November 30, 2016 14 Replies Buying and Storing Meat without Plastic April 20, 2016 91 Replies Why Buy It New When I Can Make It Myself? January 13, 2016 34 Replies Brush with Bamboo Introduces Partially Plant-Based Bristles December 10, 2015 34 Replies The Truth About Your Biodegradable Bamboo Toothbrush December 8, 2015 147 Replies Fresh Homemade Roasted Tomato Sauce Recipe July 26, 2015 5 Replies Read the Book! Plastic-Free: How I Kicked the Plastic Habit and How You Can Too is your illustrated, practical guide to living with less plastic, updated with new chapter and foreword by musician Jack Johnson. Click here to learn more. Get Started Here are my top 100 steps to get started on a plastic-free journey. Choose a few to begin with. Don't try to do it all at once! Carry reusable shopping bags. Give up bottled water. Shop your local farmers market. Say no to plastic produce bags. Buy from bulk bins as often as possible. Cut out sodas, juices, and all other plastic-bottled beverages. Buy fresh bread that comes in either paper bags or no bags. Return containers for berries, cherry tomatoes, etc. to the farmer's market to be reused. Bring your own container for meat and prepared foods. Choose milk in returnable glass bottles. Read the rest here. My Plastic-Free Life Videos Subscribe to my channel« Prev1 / 8Next »TEDxGreatPacificGarbagePatch - Beth Terry - Living Plastic FreePlastic-Free: How I Kicked the Plastic Habit and How You Can Too, by Beth TerryPlastic-Free book promo BLOOPER« Prev1 / 8Next » Take the Challenge! Do you know your plastic footprint? Join participants around the world in the "Show Your Plastic Trash" Challenge! No guilt. Just education.'''
