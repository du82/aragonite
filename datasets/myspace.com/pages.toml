["https://myspace.com/article/2022/3/10/black-keys-announce-11th-studio-album-dropout-boogie-share-wild-child-spin"]
title = "Black Keys Announce 11th Studio Album Dropout Boogie, Share ‘Wild Child’"
description = "The Black Keys have a new album on the way."
full_description = "NEWS Black Keys Announce 11th Studio Album Dropout Boogie, Share ‘Wild Child’ By SPIN | Izzy Colón • March 10, 2022 The Black Keys have a new album on the way. Discover More NEWS R.E.M.’s Original Members Take The Stage Again In Athens IN MEMORIAM Gene Hackman, 95, and Wife Found Dead NEWS Why Rihanna Brought Her and A$AP Rocky’s Kids to Court Titled Dropout Boogie, the collection is the band’s first album of originals since 2019’s Let’s Rock. Last year, the Keys released Delta Kream, an album of blues covers The Keys released their first single and its accompanying video for “Wild Child,” which is directed by longtime collaborator Bryan Schlam. The forthcoming album will feature collaborations with Billy F. Gibbons, Greg Cartwright, and Angelo Petraglia. Dropout Boogie‘s release falls just one day before the 20th anniversary of The Big Come Up, the duo’s first studio album. The album strives to go back to the band’s roots of making stripped-down blues-rock music in basements in Ohio. “That’s always been the beauty of the thing Pat and I do. It’s instant,” Auerbach said in a statement. “We’ve never really had to work at it. Whenever we’d get together, we’d just make music, you know? We didn’t know what we were going to do, but we’d just do it and it would sound cool. It’s the natural chemistry Pat and I have. Being in a band this long is a testament to that. It was a real gift that we were given. I mean, the odds of being plopped down a block-and-a-half from each other in Akron, Ohio–it just seems crazy.” After the duo got together to set the groundwork for the album, Auerbach and Carney welcomed collaborators Billy F. Gibbons, Greg Cartwright, and Angelo Petraglia to Dropout Boogie sessions. Cartwright and Petraglia both appear on “Wild Child.” The album will be released on May 13 via Nonesuch, followed by a 32-date tour to promote the album this summer. The Black Keys’ Dropout Boogie tour dates and cities: July 9: Las Vegas, NV – MGM Grand Garden ArenaJuly 11: Salt Lake City, UT – USANA AmphitheatreJuly 13: Denver, CO – Red Rocks AmphitheatreJuly 15: St. Louis, MO – Hollywood Casino Amphitheatre St. LouisJuly 16: Indianapolis, IN – Ruoff Music CenterJuly 17: Chicago, IL – Hollywood Casino Amphitheatre Tinley ParkJuly 20: Saratoga Springs, NY – Saratoga Performing Arts CenterJuly 22: Jones Beach, NY – Northwell Health at Jones Beach TheaterJuly 23: Holmdel, NJ – PNC Bank Arts CenterJuly 25: Columbia, MD – Merriweather Post PavilionJuly 27: Charlotte, NC – PNC Music PavilionJuly 29: Boston, MA – Xfinity CenterJuly 30: Philadelphia, PA – Waterfront Music Pavilion (formerly BB&T Pavilion)Aug. 24: West Palm Beach, FL – iTHINK Financial AmphitheatreAug. 25: Tampa, FL – MIDFLORIDA Credit Union AmphitheatreAug. 27: Atlanta, GA – Ameris Bank AmphitheatreAug. 28: Huntsville, AL – Orion AmphitheatreAug. 30: Charleston, SC – Credit One StadiumSept. 1: Raleigh, NC – Coastal Credit Union Music Park at Walnut CreekSept. 3: Cincinnati, OH – Riverbend Music CenterSept. 6: Toronto, ON – Budweiser StageSept. 7: Detroit, MI – Pine Knob Music TheatreSept. 9: Cuyahoga Falls, OH – Blossom Music CenterOct. 2: Seattle, WA – Climate Pledge ArenaOct. 3: Vancouver, BC – Rogers ArenaOct. 5: Mountain View, CA – Shoreline AmphitheatreOct. 8: Los Angeles, CA – The ForumOct. 10: Phoenix, AZ – Ak-Chin PavilionOct. 13: Rogers, AR – Walmart AMPOct. 15: Houston, TX – Cynthia Woods Mitchell PavilionOct. 17: Austin, TX – Moody Center ATXOct. 18: Dallas, TX – Dos Equis Pavilion The post Black Keys Announce 11th Studio Album Dropout Boogie, Share ‘Wild Child’ appeared first on SPIN."
