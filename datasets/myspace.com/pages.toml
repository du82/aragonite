full_description = "NEWS Bloc Party share soaring new single ‘Sex Magik’ By NME/Tom Skinner • February 25, 2022 It's the latest preview of the band's long-awaited sixth album, 'Alpha Games' Discover More NEWS R.E.M.’s Original Members Take The Stage Again In Athens IN MEMORIAM Gene Hackman, 95, and Wife Found Dead NEWS Why Rihanna Brought Her and A$AP Rocky’s Kids to Court Bloc Party have released a new single called ‘Sex Magik’ – you can listen to it below. READ MORE: Bloc Party – all the albums ranked, worst to best Following on from last month’s ‘The Girls Are Fighting’ and 2021’s ‘Traps’, the latest song from Kele Okereke and co. combines hypnotic verses with a euphoric, soaring chorus. It’ll appear on the band’s sixth album ‘Alpha Games’, which is out on April 29. “Find your root/ Find your core/ Then go clear like the air in our lungs/ Ask the earth for resolve/ Ossify/ Like the marrow/ In our bones,” Okereke sings ahead of repeated chants of “earth earth air air fire fire water water“. Check out the official lyric video for ‘Sex Magik’ here: It comes after the group shared a brief snippet of the single on social media earlier this week (February 23). “New music very soon,” the captioned the clip. Bloc Party will showcase ‘Alpha Games’ – the follow-up to 2016’s ‘Hymns’ – on a UK and European headline tour in May/June. You can see the full schedule below and find ticket details here. Meanwhile, it’s been announced that the band will perform at BBC Radio 6 Music Festival 2022 alongside the likes of IDLES, Little Simz and Father John Misty. This year’s event will take place in Cardiff between April 1-3. Bloc Party’s 2022 UK tour dates are as follows: APRIL02 – BBC Radio 6 Music Festival, Cardiff MAY26 – O2 Academy 1, Birmingham27 – Rock City, Nottingham28 – Alexandra Palace, London30 – O2 Academy, Bristol31 – O2 Victoria Warehouse, Manchester JUNE02 – O2 City Hall, Newcastle03 – The Barrowland Ballroom, Glasgow04 – O2 Academy, Leeds The post Bloc Party share soaring new single ‘Sex Magik’ appeared first on NME."
