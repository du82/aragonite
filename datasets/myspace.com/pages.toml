title = "‘The Fairly OddParents’ live-action reboot trailer draws criticism: “Like a bad ‘SNL’ parody”"
description = "The revival series introduces a new version of grown-up Timmy Turner"
full_description = "NEWS ‘The Fairly OddParents’ live-action reboot trailer draws criticism: “Like a bad ‘SNL’ parody” By NME/Adam Starkey • February 24, 2022 The revival series introduces a new version of grown-up Timmy Turner Discover More NEWS R.E.M.’s Original Members Take The Stage Again In Athens IN MEMORIAM Gene Hackman, 95, and Wife Found Dead NEWS Why Rihanna Brought Her and A$AP Rocky’s Kids to Court Paramount+ has released a trailer for a live-action Fairly OddParents series set to be released next month. READ MORE: NME Recommends: the best adult animations Titled The FairlyOdd Parents: Fairly Odder, the series sees Caleb Pierce play a grown-up Timmy Turner alongside Audrey Grace Marshall as his cousin Viv and Tyler Wladis as her new step-brother Roy Raskin. Susanne Blakeslee and Daran Norris also return as animated characters Wanda and Cosmo from the original series. After the trailer was released, many viewers criticised the show – comparing it negatively to a Saturday Night Live skit. “The new live action fairly oddparents show is genuinely one of the worst things I have ever seen,” one Twitter user wrote. “This is either an elaborate SNL skit or I’m being pranked,” another wrote. My reaction to the Fairly OddParents reboot trailer: pic.twitter.com/dYAsQm2l5u — JW Cartoonist (Commissions open! 2 slots!) (@JWCartoonist) February 23, 2022 I REFUSE to believe these are REAL IMAGES for the Paramount+ Fairly OddParents sequel series. This is either an elaborate SNL skit or im being pranked. pic.twitter.com/XTVB0arXzT — Patrick Nestor III (@PattyNest) February 23, 2022 The new live action fairly oddparents show is genuinely one of the worst things I have ever seen — Shoug (@SCS_Shoug) February 24, 2022 Wtf is this shit? This looks like a bad SNL parody of The Fairly Oddparents. The fact that this show manages to find new lows of shit to sink down to while just not dying is astonishing. https://t.co/z8leXKvvVQ — ChikoCheez (@ChikoritaCheez) February 23, 2022 Remember when I've always said that The Fairly OddParents died a slow and painful death? Well now it's come back with a vengeance and became a fucking zombie. https://t.co/fHUGbU2pFi — Sir Simon A.  (@BabyLamb5) February 23, 2022 Created by Butch Harman, The Fairly OddParents originally spanned five seasons from 2001 to 2006 on Nickelodeon, before it was revived in 2007 for another five seasons and a television film. The original show concluded in 2017. In 2011, a live-action television film was released titled A Fairly Odd Movie: Grow Up, Timmy Turner! Set 13 years after the original series, it starred Drake Bell (Drake & Josh) as a 23-year-old version of Timmy, alongside Daniella Monet as Tootie. The success of the film led to two sequels: A Fairly Odd Christmas and A Fairly Odd Summer in 2012 and 2014 respectively. The Fairly OddParents: Fairly Odder will be released on Paramount+ on March 31 in the US. The post ‘The Fairly OddParents’ live-action reboot trailer draws criticism: “Like a bad ‘SNL’ parody” appeared first on NME."
