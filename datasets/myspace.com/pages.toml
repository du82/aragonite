title = "Florence + The Machine Unveil Womanhood Anthem ‘King’"
description = "“As an artist, I never actually thought about my gender that much,” Welch said."
full_description = "NEWS Florence + The Machine Unveil Womanhood Anthem ‘King’ By SPIN | Marisa Whitaker • February 24, 2022 “As an artist, I never actually thought about my gender that much,” Welch said. Discover More NEWS R.E.M.’s Original Members Take The Stage Again In Athens IN MEMORIAM Gene Hackman, 95, and Wife Found Dead NEWS Why Rihanna Brought Her and A$AP Rocky’s Kids to Court Florence Welch has finally returned! In her first proper release since 2018 (she last released a song for the Cruella film in 2021 and an outtake in 2020), Florence + the Machine unveiled “King” on Wednesday. The “King” video was directed by Autumn de Wilde. The song reflects on Florence Welch’s femininity and her recent subverting of expectations as a woman in music. She triggers instant chills by powerfully declaring: “I am no mother / I am no bride / I am king.” “As an artist, I never actually thought about my gender that much,” Welch said. “I just got on with it. I was as good as the men and I just went out there and matched them every time. But now, thinking about being a woman in my 30s and the future, I suddenly feel this tearing of my identity and my desires. That to be a performer, but also to want a family might not be as simple for me as it is for my male counterparts. I had modelled myself almost exclusively on male performers, and for the first time I felt a wall come down between me and my idols as I have to make decisions they did not.” Welch released her fourth studio album, High As Hope, in June 2018. The post Florence + The Machine Unveil Womanhood Anthem ‘King’ appeared first on SPIN. ]]> Sign in to Myspace Use Facebook, Twitter or your email to sign in. Don't have a Myspace account yet? No worries, joining is easy. Facebook Twitter Email or Username Password Forgot password? Keep me signed in Sign In Forgot your password? Enter your email or username. We'll email instructions on how to reset your password. Need help? Learn more about how to retrieve an existing account. Your email ? The email you used to create your account. Username ? The last part of your Myspace URL. Ex: myspace.com/username Back Submit"
