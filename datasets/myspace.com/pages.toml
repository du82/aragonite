full_description = "NEWS Thom Yorke Surprise-Releases New Song ‘5.17’ By SPIN | Katrina Nattress • March 14, 2022 Song may be featured in ‘Peaky Blinders’ Discover More NEWS R.E.M.’s Original Members Take The Stage Again In Athens IN MEMORIAM Gene Hackman, 95, and Wife Found Dead NEWS Why Rihanna Brought Her and A$AP Rocky’s Kids to Court Thom Yorke has been focusing efforts on his Radiohead side project The Smile, which made it that much more surprising when he released a new solo track called “5.17” without warning this morning. Though it’s unclear why the song came out today, it may not be a coincidence that its arrival coincides with the third episode of Peaky Blinders’ sixth season — Yorke and his bandmate Jonny Greenwood reportedly contributed music to the show. “Thom Yorke and Jonny Greenwood contributed some original stuff,” Peaky Blinders director Anthony Byrne previously told NME. “I’m over the moon about all of that. The music has always been really important historically, and I was really keen to bring a dramatic score into it. We’re using that much more in this season. It’s a much heavier season so the score is taking things in a very different direction.” Radiohead’s “You & Whose Army?” and “Pyramid Song” have also been featured in the show, and Yorke’s new piano ballad has a similar tone to those songs. A second new Yorke song — “That’s How Horses Are” — is scheduled for release on April 3, which also happens to be the date of Peaky Blinders’ series finale. Listen to “5.17” below. The Smile is prepping a debut album and has shared two tracks: “You Will Never Work In Television” and “The Smoke.” The post Thom Yorke Surprise-Releases New Song ‘5.17’ appeared first on SPIN. Sign in to Myspace Use Facebook, Twitter or your email to sign in. Don't have a Myspace account yet? No worries, joining is easy. Facebook Twitter Email or Username Password Forgot password? Keep me signed in Sign In Forgot your password? Enter your email or username. We'll email instructions on how to reset your password. Need help? Learn more about how to retrieve an existing account. Your email ? The email you used to create your account. Username ? The last part of your Myspace URL. Ex: myspace.com/username Back Submit"
