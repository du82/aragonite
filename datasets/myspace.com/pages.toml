description = "It was the first Cave and Ellis’ two shows in Los Angeles"
full_description = "NEWS Flea Joins Nick Cave and Warren for Performance of ‘We No Who U R’ By SPIN | Grace Ann Natanawan • March 11, 2022 It was the first Cave and Ellis’ two shows in Los Angeles Discover More NEWS R.E.M.’s Original Members Take The Stage Again In Athens IN MEMORIAM Gene Hackman, 95, and Wife Found Dead NEWS Why Rihanna Brought Her and A$AP Rocky’s Kids to Court Red Hot Chili Peppers’ Flea joined Nick Cave and Warren Ellis on stage at their show at the Shrine Auditorium in Los Angeles. During the duo’s second encore, the bassist joined the group for a performance of “We No Who U R.” This is the first time Cave had played the song since 2015. It was originally on Cave and the Bad Seeds’ 2012 album Push the Sky Away. View this post on Instagram A post shared by Warren Ellis (@thewarrenellis) Despite the happy reunion, Cave and Red Hot Chili Peppers have not always gotten along. According to NME, Cave in 2004 reportedly said in response to a review of the band’s Stadium Arcadium, “I’m forever near a stereo saying, ‘What the fuck is this garbage?’ And the answer is always the Red Hot Chili Peppers.” Also according to NME, Flea responded to Cave’s comment stating: “For a second that hurt my feelings because I love Nick Cave, I have all of his records. I don’t care if Nick Cave hates my band because his music means everything to me because he is one of my favorite songwriters and singers and musicians of all time.” Cage and Ellis are performing again tonight in Los Angeles at the Orpheum Theater. The post Flea Joins Nick Cave and Warren for Performance of ‘We No Who U R’ appeared first on SPIN. Sign in to Myspace Use Facebook, Twitter or your email to sign in. Don't have a Myspace account yet? No worries, joining is easy. Facebook Twitter Email or Username Password Forgot password? Keep me signed in Sign In Forgot your password? Enter your email or username. We'll email instructions on how to reset your password. Need help? Learn more about how to retrieve an existing account. Your email ? The email you used to create your account. Username ? The last part of your Myspace URL. Ex: myspace.com/username Back Submit"
