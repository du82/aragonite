ess, etc.). If you are a minor, and you know who the person is that is harassing you, please let a parent, teacher, or trusted adult know so they may assist. Please utilize your profile privacy settings in order to control who can view your activities. We will only contact you regarding your report if we require additional information to make a decision. Myspace will only take action on content that violates our Terms of Use. We will not remove a profile if it shares your name but has no other commonalities Profiles with similar usernames or appearances are not automatic violation Parody, commentary or fan profiles are allowed Was this article helpful? 20 out of 186 found this helpful Facebook Twitter LinkedIn Related articles Delete your Profile Myspace Guidelines Making a Post How Do I Remove Images Appearing In Google Search? Is Something Not Working?"
