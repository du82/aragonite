description = "They also announced two UK shows"
full_description = "NEWS Yeah Yeah Yeahs Tease First New Music in More Than Nine Years By SPIN | Katrina Nattress • March 14, 2022 They also announced two UK shows Discover More NEWS R.E.M.’s Original Members Take The Stage Again In Athens IN MEMORIAM Gene Hackman, 95, and Wife Found Dead NEWS Why Rihanna Brought Her and A$AP Rocky’s Kids to Court Yeah Yeah Yeahs are heading back to the UK for the first time in more than nine years this summer, and it looks like they’re taking some new music with them. In a statement about the shows, the band wrote: “OK UK! We are coming to lend our light to dark ages and holy shit are we ready to play our hearts out for you!! Yeah it’s been 9 years since we’ve graced your club stages! Yeah we’ve got some tunes so fresh and so NEW to try out on you! Yeah the bill is so MAJOR with Dry Cleaning and Anika in London and English Teacher in Manchester. Dress up! Make a night of it! Support your fave band that you may have seen debut at Brixton back in ’02!! Yeah let’s not wait another decade to see each other again! CANNOT WAIT! They don’t love ya like we do!! Luv YYYs.” Yeah Yeah Yeahs plan to play at Manchester’s O2 Apollo on June 5th, with special guest English Teacher, and June 7th at O2 Academy Brixton in London with Dry Cleaning and Anika as support. The new songs will be the band’s first new music since 2013’s Mosquito. Tickets go on sale for both shows this Friday, March 18th, at 9 a.m. GMT. Get more info here. The post Yeah Yeah Yeahs Tease First New Music in More Than Nine Years appeared first on SPIN. Sign in to Myspace Use Facebook, Twitter or your email to sign in. Don't have a Myspace account yet? No worries, joining is easy. Facebook Twitter Email or Username Password Forgot password? Keep me signed in Sign In Forgot your password? Enter your email or username. We'll email instructions on how to reset your password. Need help? Learn more about how to retrieve an existing account. Your email ? The email you used to create yo