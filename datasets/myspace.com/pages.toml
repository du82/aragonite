["https://myspace.com/article/2022/3/11/charli-xcx-shares-full-crash-track-listing-nme"]
title = "Charli XCX shares full ‘Crash’ track listing"
description = "The album arrives next week"
full_description = "NEWS Charli XCX shares full ‘Crash’ track listing By NME/Elizabeth Aubrey • March 11, 2022 The album arrives next week Discover More NEWS R.E.M.’s Original Members Take The Stage Again In Athens IN MEMORIAM Gene Hackman, 95, and Wife Found Dead NEWS Why Rihanna Brought Her and A$AP Rocky’s Kids to Court Charli XCX has shared the full track listing for upcoming new album ‘Crash’, – check it out below. READ MORE: Charli XCX live in London: isolation anthems finally get their special airing Charli’s new album is due to land on March 18 and the musician shared full details earlier today (March 10) of the album’s 12 songs. It includes all of her recent singles such as ‘Good Ones‘, ‘Baby‘, her collaboration with Rina Sawayama, ‘Beg For You’ and her song with Christine and the Queens and Caroline Polachek, ‘New Shapes’. crash tracklist which song u claiming ???? pic.twitter.com/lTTbEItzWj — Charli (@charli_xcx) March 10, 2022 You can see the full track listing here: ‘CRASH’ Track listing‘Crash’‘New Shapes’ (feat. Christine and the Queens and Caroline Polachek)‘Good Ones’‘Constant Repeat’‘Beg for You’ (feat. Rina Sawayama)‘Move Me’‘Baby’‘Lightning’‘Every Rule’‘Yuck’‘Used to Know Me’‘Twice’ Earlier this month (March 5), Charli finally made her Saturday Night Live debut. The singer was originally set to appear with Caroline Polachek and Christine And The Queens on the long-running show last December, but her appearance was cancelled at the last minute due to COVID restrictions leading to “limited crew,” leaving her “devastated and heartbroken”. On the March 5 episode, which was hosted by Oscar Isaac, Charli performed versions of two songs from her new album. Meanwhile, SEVENTEEN member Vernon recently spoke out about his love for Charli XCX and their recent collaboration. Last month, the K-pop idol teamed up with Charli on a special remix of her recent single ‘Beg For You’, where he contributed a brand-new English-language verse. The remix came shortly after a string of online interactions between both Charli XCX and SEVENTEEN, after fans suggested that the duo work together. In a new interview with Teen Vogue, the K-pop idol revealed that he is “still having a hard time grasping this reality” that they have worked together. “I just really want to say thank you to Charli for acknowledging my existence,” he said. Vernon also touched on his love for Charli XCX’s music, which he describes as “really beautiful”. He added: “[Discovering her music] was a whole new world for me, really. I feel vulnerability, but at the same time, invincibility in her music. There’s something really beautiful about it.” The post Charli XCX shares full ‘Crash’ track listing appeared first on NME."
