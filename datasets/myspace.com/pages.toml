vide us with such information and by automatically collecting it, including through the use of Web Technologies. Some of this information may be disclosed or made available to third parties, including our affiliate VIANT, other Users and Visitors and service providers , as described further below. Our affiliate VIANT further discloses, or makes available, the Myspace data they receive from us to their VIANT’s clients and others. Third parties – including linked services (e.g., Facebook, Twitter), service providers and our affiliate VIANT may also collect certain information about you in connection with your use of the Myspace Services (e.g., Usage Information). Your media consumption activities (e.g., streaming and downloading music, streaming video, IPTV, digital video, etc.) may be tracked through your use of the Myspace Services, subject to some limited preference settings. We may use and disclose this media content consumption information as provided below for up to two (2) years from the date in which you consent unless you otherwise withdraw your consent. Due to the nature of our platform, if you withdraw your consent your Member account may be inactivated in whole or in part, but you can still use the Myspace Services as a Visitor. If we obtain a new consent from you after the date that we obtain your original consent, this period will be extended for additional two (2) year periods each time we obtain a new consent from you. If your account is inactive for over two years, we may still store your media content consumption information for a reasonable period of time so that it will be available again if you reactivate your account. However, we are not obliged to store that information. Please review the terms of our Video Privacy Policy, which supplements this Policy. At this time, Myspace does not serve advertisements to Users as part of the Myspace Services, but does share your personal information with our corporate affiliate VIANT, who may share it with other third parties, including advertisers. Residents of some states can opt-out of our sharing, selling and targeting here, and VIANT’s sharing, selling and targeting here For more information see our Enterprise-wide Privacy Notice. Myspace is intended for a U.S. audience. We use servers located in the United States and may use servers in other countries. Any information collected about you in connection with your use of the Myspace Services will be used and stored in the United States. We may also transfer your data to other countries for processing by staff who work for us or for one of our contractors. You expressly consent to the processing of your information in accordance with the terms and conditions set forth in this Policy. Privacy Policy Who We Are Welcome to Myspace®, a place where people come to connect, discover, and share. The Myspace Services may include: (i) those offered on any Myspace-­branded URL, including www.myspace.com (the "Myspace Website"); (ii) Myspace messaging services (e.g., instant messaging, private messaging, public and private group chatting, etc.); and (iii) any other features, content, or applications offered or operated from time to time by Myspace in connection with Myspace's business, including when Myspace is accessed via the internet, mobile device, television or other device (collectively, the "Myspace Services"). The Myspace Services are hosted in the United States. We may also transfer your data to other countries for processing by staff who work for us or for one of our contractors. Scope Of This Policy This Policy describes generally how we collect, use, store and share information that we receive from users of the Myspace Services ("Users"). This Policy applies both to individuals using such services that register with Myspace and create Myspace Accounts and their associated Profile(s) ("Members"), as well as individuals who use the Myspace Services without registering ("Visitors"). This Policy covers the activities of Myspace with respect to the collection, use, retention and disclosure of information through any of the Myspace Services. If you follow a link on the Myspace Services to a third party’s website, that third party’s privacy policy will govern its use of your information, and you should read the third party website’s privacy policy. This Policy does not limit Myspace's use or sharing of De-identified Information. We may aggregate certain items of your Personal Information (such as your age) to create anonymized statistical information about our User base (which we refer to as "Aggregated Information"). We may also anonymize individual User data so that it is no longer personally identifiable ("De-identified Information"). Aggregate Information and De-identified Information is no longer Personal Information. We may use and/or share such information in any manner not otherwise prohibited by this Policy or by applicable law, without notice or compensation to you, including freely disclosing for any legal purpose non-Personal Information to VIANT affiliates, advertisers, partners, content owners, and other third parties. We will not reidentify data we maintain as De-identified Information, or authorize others to do so. We will continue to evaluate and update this Policy as we rollout additional services for our Users, employ new technologies and otherwise adapt and improve along with the evolving online and digital world so we recommend that you check for changes regularly. To the extent that we provide you notice on any of the Myspace Services of different or additional privacy policies or practices (e.g., at the point of our collection), those different or additional terms shall govern such data collection and use. In addition, please review the Myspace Services' Terms of Use, which governs your use of Myspace Services. The Information That We Collect Information You Provide To Us Personal Information That You Provide We may ask you to provide us with certain information, including personal information, when you interact with the Myspace Services. Information that identifies you as a particular individual is referred to in this Policy as "Personal Information". This would include, without limitation, your full name, e-mail address, telephone number and street address. We collect Personal Information through the Myspace Services when you choose to provide us with such information, for example, when you register to become a Member. We may also collect Personal Information through a variety of other methods, including when you elect to contact us, submit Profile Content or otherwise interact with the Myspace Services. The Personal Information you provide includes: Registration Information Certain features of the Myspace Services are only accessible by Members who have registered with Myspace and created a Myspace account ("Account"). In order to do so, you must first complete a registration form that requests certain basic registration information from you, such as your full name, e-mail address, date of birth, zip code, and gender (collectively, "Registration Information"). Profile Content When you sign up as a Member, you are required to create one or more Myspace profiles that are associated with your Account (each, a "Profile"). Myspace may allow you to populate your Profile with certain content chosen by you, and we may also associate additional content with your Profile based on your interactions with the Myspace Services, such as your video viewing and other related activities (collectively, "Profile Content"). Any Profile Content that Myspace allows you to submit must comply with the restrictions set forth in our Terms of Use at all times. Please note that your Profile Content may contain Registration Information. The information in your Profile Content is grouped into two main categories – Restricted Information and Public Information. The information in your Profile Content is grouped into two main categories – Restricted Information and Public Information. "Restricted Information" refers to those portions of the Profile Content and Activity Notifications associated with your Profile to which you may elect to restrict public access by changing the Profile settings that Myspace may make available to you from time-to-time here ("Profile Settings") or by changing other functionality specific settings on the Myspace Services. These Profile Settings may permit you to create a "Restricted Profile" by choosing to enable certain (but not absolute) limitations on the availability of certain aspects of your Profile that are not required by Myspace to be Public Information (as described below), certain associated Profile Content, and some of the notifications that Myspace produces regarding your activities ("Activity Notifications"). Further, unless otherwise provided by Myspace, all of your Profile Content and Activity Notifications will still be available to the people whose Profiles you allow to connect to you. "Public Information" refers to the portion of your Profile Content that can always be viewed, accessed, and used by anyone with access to the Myspace Services (e.g., Myspace, other Users, search engines, advertisers, application developers, other third parties, etc.). Any Profile Content that does not otherwise constitute Restricted Information is considered Public Information for the purposes of this Policy. The following information is Public Information that cannot be changed to Restricted Information: Full Name Username Profile URL Profile Photo Profile Cover Stated Location Gender Age Myspace IDs Public Information also includes: Any additional Profile Content associated with a "Public Profile," which refers to any Profile for which a User has set the Profile's visibility status to "Public" in his or her Profile Settings, but subject to Mix privacy settings (as further defined below); Activity Notifications published on the Myspace Services from Public Profiles; Your status as a "Top Fan"; Affinity Information (e.g., the relative magnitude of your affinity for Profiles and content); and The number of your connections in and connections out. Please note that the Myspace Services currently do not allow Users to restrict access to the items of Public Information described above, which can always be viewed, accessed, and used by anyone with access to the Myspace Services, including via third party search engines. If that is not acceptable to you, you should not use the Myspace Services. You should be aware that the default setting for Profiles of Members who indicate that they are 18 years of age or older is public (i.e., Public Profiles). The default setting for Profiles of Members who indicate that they are under 18 years of age is restricted (i.e., Restricted Profiles), other than for Artist Profiles (as defined in the Terms of Use) of Members who are under 18 years of age, which are public by default. Other than with respect to Artist Profiles, whose visibility status may not be changed, you may change the visibility status of your Profile from a Public Profile to a Restricted Profile at any time by visiting Profile Settings. Please note, however, that Activity Notifications that were created during the time that your Profile was a Public Profile shall remain public after any change to a Restricted Profile. Although access to Restricted Information will be limited as set forth above, it is important to note that if you share such information with others, they may copy that information or share it with others, including with the public. Myspace is not responsible for the actions of those with whom you choose to share your Restricted Information. For example, you may choose to use the Myspace Services to access content pages, which are those pages that, for example, represent an individual item of content such as video or audio, or a collection of content such as audio tracks (e.g., "Mixes"). When you decide to post content, comments, or other materials to another Member's Profile, a Content Page, or elsewhere on the Myspace Services, that information will be disclosed, and available to third parties consistent with the visibility settings for the relevant Profile or content, even if those settings are inconsistent with your own Profile Settings. Content Pages are generally publicly available, which means that posts that you make on those pages will likely be available to anyone. In addition, your video viewing or audio selections may be part of your Profile Content as well as any content pages that you view. Similarly, if you connect to a Public Profile, the fact that you have connected to that Public Profile will be available to anybody with access to the Myspace Services. The Profile Settings that Myspace makes available to Members, as well as their functionality, may change as the Myspace Services continue to evolve. We will provide reasonable advance notice of the changes in the Profile Settings section, or otherwise. Delays and errors in eff'''
