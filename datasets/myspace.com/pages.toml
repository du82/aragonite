title = "Bartees Strange Pays Homage to Loved Ones With A ‘Heavy Heart’"
description = "Freshly signed to 4AD,"
full_description = "NEWS Bartees Strange Pays Homage to Loved Ones With A ‘Heavy Heart’ By SPIN | Marisa Whitaker • March 01, 2022 Freshly signed to 4AD, Discover More NEWS R.E.M.’s Original Members Take The Stage Again In Athens IN MEMORIAM Gene Hackman, 95, and Wife Found Dead NEWS Why Rihanna Brought Her and A$AP Rocky’s Kids to Court Bartees Strange released his label debut, “Heavy Heart,” and its music video, today. Strange pays tribute to his grandfather and father in his first new music in over two years. He sings about the years of guilt that have piled up on him – as Strange has been succeeding as a touring musician, his grandfather recently passed away, his partner stays at home without him, and the guilt even stems back to his father’s sacrifices to build a better future for Strange. The Missy Dabice-directed video follows Strange bearing his grandfather and father’s clothes. Strange had previously released Say Goodbye To Pretty Boy in 2020, and his proper debut Live Forever the same year. Alongside unveiling “Heavy Heart,” Strange detailed his debut UK and European headline tour. He is set to perform throughout July, and tickets for the European leg go on sale at 10 a.m. local on Friday, Mar. 4. For U.S. fans, Strange is scheduled to open for Car Seat Headrest’s tour beginning later this month, which runs until mid-May. Bartees Strange Tour Dates Mar 16 – SAINT PAUL, MN, Palace Theatre *Mar 17 – MILWAUKEE, WI, Pabst Theater *Mar 18 – CHICAGO, IL, The Vic Theatre *Mar 19 – CHICAGO, IL, The Vic Theatre *Mar 20 – DETROIT, MI, Majestic Theatre *Mar 22 – TORONTO, ON, The Danforth Music Hall *Mar 23 – TORONTO, ON, The Danforth Music Hall *Mar 25 – NORTH ADAMS, MA, Mass MOCA *Mar 26 – BOSTON, MA, House Of Blues Boston *Mar 27 – PORTLAND, ME, State Theatre *Mar 29 – BROOKLYN, NY, Brooklyn Steel *Mar 30 – BROOKLYN, NY, Brooklyn Steel *Mar 31 – BROOKLYN, NY, Brooklyn Steel *April 1 – PHILADELPHIA, PA, Franklin Music Hall *April 2 – WASHINGTON, DC, The Anthem *April 4 – CHARLOTTESVILLE, VA, Jefferson Theater *April 5 – ASHEVILLE, NC, The Orange Peel *April 7 – RALEIGH, NC, The Ritz *April 8 – COLUMBIA, DC, The Senate *April 9 – ATLANTA, GA, Tabernacle *April 10 – NASHVILLE, TN, Brooklyn Bowl Nashville *April 22 – SEATTLE, WA, Paramount Theatre *April 23 – PORTLAND, OR, Roseland Theater *April 24 – EUGENE, CA, Mcdonald Theater *April 26 – SACRAMENTO, CA, Ace of Spades *April 27 – SAN FRANCISCO, CA, The Warfield *April 29 – SAN DIEGO, CA, House of Blues San Diego *April 30 – LOS ANGELES, CA, The Wiltern *May 1 – PHOENIX, AZ, The Van Buren *May 4 – AUSTIN, TX, Stubbs BBQ *May 5 – HOUSTON, TX, White Oak Music Hall *May 6 – DALLAS, TX, Granada Theater *May 7 – OKLAHOMA CITY, OK, Tower Theatre *May 8 – KANSAS CITY, MO, Grinders KC *May 10 – DENVER, CO, Ogden Theatre *May 11 – BOULDER, CO, Fox Theatre *May 13 – SALT LAKE CITY, UT, Kilby Block PartyJuly 3 – WERCHTER, BE, Rock Werchter 2022July 4 – COLOGNE, DE, Helios37July 5 – HAMBURG, DE, MolotowJuly 7 – BERLIN, DE, BadehausJuly 9 – MADRID, ES, Mad Cool Festival 2022July 11 – MUNICH, DE, MillaJuly 12 – FRIBOURG, CH, Festival Les GeorgesJuly 13 – REES-HALDERN, NL, Haldern Pop BarJuly 14 – AMSTERDAM, NL, Upstairs @ ParadisoJuly 16 – LEEDS, GB, Community Room @ Brudenell Social ClubJuly 17 – MANCHESTER, GB, Night & Day CaféJuly 19 – CARDIFF, GB, Clwb Ifor BachJuly 20 – BRIGHTON, GB, PatternsJuly 21 – LONDON, GB, PowerhausJuly 22 – SUFFOLK, GB, Latitude Festival* w/ Car Seat Headrest The post Bartees Strange Pays Homage to Loved Ones With A ‘Heavy Heart’ appeared first on SPIN."
