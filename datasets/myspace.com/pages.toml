full_description = "NEWS PUP Release ‘Matilda’ Off Upcoming Album By SPIN | Marisa Whitaker • March 03, 2022 PUP unveiled the latest single, Discover More NEWS R.E.M.’s Original Members Take The Stage Again In Athens IN MEMORIAM Gene Hackman, 95, and Wife Found Dead NEWS Why Rihanna Brought Her and A$AP Rocky’s Kids to Court “Matilda,”of their forthcoming record, The Unraveling of PUPTHEBAND. “Matilda is the name of my favorite guitar,” guitarist Stefan Babcock said. “She was a gift from my friend Ryan, after watching me accidentally break the only guitar I owned in the middle of a long tour. I had no money to buy a replacement, and Ryan’s act of kindness is up there on my list of ‘nicest things anyone’s ever done for me.’ I played Matilda nonstop for 7 years at every PUP show, even when my bandmates started complaining that she sounded like shit.” PUP had previously released “Waiting” and “Robot Writes A Love Song,” off The Unraveling. The band’s fourth studio record is set for release on April 1, and is self-deemed by the band as “the most PUP record.” The band is set to embark on tour this month, kicking off on March 26 in Ottawa. They added some brand new dates in June throughout the U.S. and in October and November throughout Europe. And you can catch PUP at the second weekend of Coachella this year. PUP Tour Dates 3/26/22 – Ottawa, ON @ Bronson Centre Music Theatre !3/27/22 – Hamilton, ON @ Bridgeworks ! [SOLD OUT]3/28/22 – Kingston, ON @ The Ale House !3/29/22 – Peterborough, ON @ The Venue !4/1/22 – Pittsburgh, PA @ Roxian Theatre *^4/2/22 – Columbus, OH @ Newport Music Hall *^4/3/22 – Chicago, IL @ Riviera Theatre *^4/5/22 – Minneapolis, MN @ The Fillmore *^4/8/22 – Victoria, BC @ Capital Ballroom ^4/9/22 – Victoria, BC @ Capital Ballroom ^ [SOLD OUT]4/10/22 – Seattle, WA @ Showbox SoDo ^4/11/22 – Portland, OR @ Crystal Ballroom +^4/13/22 – Sacramento, CA @ Ace of Spades +^4/15/22 – Indio, CA @ Coachella Music and Arts Festival4/16/22 – Phoenix, AZ @ The Va