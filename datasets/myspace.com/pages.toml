full_description = "NEWS Bonnie Raitt Announces First Album in 6 Years, Share New Song ‘Made Up Mind’ By SPIN Staff • February 25, 2022 Record came together as 50th anniversary of her debut approached Discover More NEWS R.E.M.’s Original Members Take The Stage Again In Athens IN MEMORIAM Gene Hackman, 95, and Wife Found Dead NEWS Why Rihanna Brought Her and A$AP Rocky’s Kids to Court Singer-songwriter Bonnie Raitt is back with her first batch of material since 2016. With the 50th anniversary of her debut looming last year, Raitt went into a Northern California studio with a team of musicians to record the new album, Just Like That… Raitt, who produced the record, worked with two frequent collaborators, bassist James “Hutch” Hutchinson and drummer Ricky Fataar, along with keyboardist/backing vocalist Glenn Patscha and guitarist Kenny Greenberg. Raitt’s longtime guitarist/songwriting partner George Marinelli also appears on Just Like That… Today, Raitt unveiled the collection’s first single, “Made Up Mind,” which showcases her signature roots rock style with elements of country, Americana and blues. “On this record, I wanted to stretch,” Raitt said in a statement. “I always want to find songs that excite me, and what’s different this time is that I’ve tried some styles and topics I haven’t touched on before.” Just Like That…, Raitt’s 18th studio album, is out April 22 via Sub Pop (in the U.S.) and distributor ADA (globally). The post Bonnie Raitt Announces First Album in 6 Years, Share New Song ‘Made Up Mind’ appeared first on SPIN. Sign in to Myspace Use Facebook, Twitter or your email to sign in. Don't have a Myspace account yet? No worries, joining is easy. Facebook Twitter Email or Username Password Forgot password? Keep me signed in Sign In Forgot your password? Enter your email or username. We'll email instructions on how to reset your password. Need help? Learn more about how to retrieve an existing account. Your email ? The email you used to create your account. Username ? The last part of your Myspace URL. Ex: myspace.com/username Back Submit"
