["https://myspace.com/article/2022/2/23/lcd-soundsystem-announce-philadelphia-and-boston-residencies-nme"]
title = "LCD Soundsystem announce Philadelphia and Boston residencies"
description = "The shows mark the band's first live dates of 2022"
full_description = "NEWS LCD Soundsystem announce Philadelphia and Boston residencies By NME/Arusa Qureshi • February 23, 2022 The shows mark the band's first live dates of 2022 Discover More NEWS R.E.M.’s Original Members Take The Stage Again In Athens IN MEMORIAM Gene Hackman, 95, and Wife Found Dead NEWS Why Rihanna Brought Her and A$AP Rocky’s Kids to Court LCD Soundsystem have announced a series of concert residencies in Philadelphia and Boston this spring. READ MORE: From The NME Archive – Celebrate 15 years of LCD Soundsystem’s debut with this classic interview: “Most live bands today are horrible” The band will perform four shows at Franklin Music Hall in Philadelphia from March 28-31, followed by four shows at new Boston venue Roadrunner from April 3-5. The two sets of shows will mark the band’s first live dates of 2022. Tickets for all eight shows are due to go on sale to the general public on Friday, February 25 at 10am, but there are also fan pre-sales available from 10am on Thursday, February 24. Find tickets here. In November 2021, LCD Soundsystem began their Brooklyn Steel residency, where the band were scheduled to play a run of 20 gigs in New York City. The news arrived just a few months after frontman James Murphy said that the band were “on a full hiatus”. https://t.co/ww5X3PzHVR pic.twitter.com/nvuueD2Q4t — lcdsoundsystem (@lcdsoundsystem) February 22, 2022 Their first gig since 2018 took place November 23 and saw the band cover Joy Division’s ‘No Love Lost’ alongside tracks from across their back catalog. However, the band were forced to cancel the last few dates of the residency due to a surge in COVID-19 cases. LCD Soundsystem had previously told fans they wouldn’t cancel the remaining shows on their residency after much debate between the band and their team. But they had conceded: “If enough people want to cancel, we’ll cancel the shows and refund everyone, putting you next in line as well.” Before the gigs were canceled, fans who didn’t feel safe attending still could get a refund for their tickets. Any possible rescheduled dates are yet to be confirmed. In other news, LCD Soundsystem were announced as musical guests on this weekend’s episode of Saturday Night Live. The group will perform on February 26 alongside host John Mulaney – a former head writer on the show. Elsewhere, DFA Records announced details of a party in New York City to celebrate their 20th anniversary next month. James Murphy, 2ManyDJs, Black Dice, The Juan MacLean, Nancy Whang, Museum of Love and Tyler Pope are among the names on the line-up, and you can find out more information and tickets to the anniversary event here. The post LCD Soundsystem announce Philadelphia and Boston residencies appeared first on NME."
