description = "The band are currently on the North American leg of their world tour"
full_description = "NEWS Watch Maynard James Keenan try to play Jenga during a Tool show By NME/Sam Moore • February 28, 2022 The band are currently on the North American leg of their world tour Discover More NEWS R.E.M.’s Original Members Take The Stage Again In Athens IN MEMORIAM Gene Hackman, 95, and Wife Found Dead NEWS Why Rihanna Brought Her and A$AP Rocky’s Kids to Court Maynard James Keenan has shared a humorous new clip of himself trying to play Jenga behind Tool drummer Danny Carey during one of the band’s recent shows. The band are currently on the North American leg of their world tour, which kicked off last month and is set to visit the UK and Ireland in May. READ MORE: Tool – ‘Fear Inoculum’ review In a clip that was shared over the weekend on Keenan’s personal Instagram page, the frontman is seen crouching down behind Carey’s drum kit during one show in an effort to play a game of Jenga. However, Keenan’s Jenga game is ruined after Carey smashes his giant gong at the back of his drum set, causing the frontman to jokingly yell: “What the fuck! What’s wrong with you?!” View this post on Instagram A post shared by MJ Keenan (@iamthebriefcase) You can watch a clip of the moment, which Keenan captioned “Danny, you son of a bitch! Tryn ta [sic] Jenga back here, ffs”, in the above post. Tool’s tour continues in Pittsburgh tomorrow (March 1). You can see the dates of their UK and European tour below, and find any remaining tickets here. April23 – Royal Arena, Copenhagen, Denmark25 – Spektrum, Oslo, Norway26 – Avicii Arena, Stockholm, Sweden28 – Barclaycard Arena, Hamburg, Germany29 – Festhalle, Frankfurt, Germany May2 – AO Arena, Manchester4 – Resorts World Arena, Birmingham6 – 3Arena, Dublin9 – The O2, London10 – The O2, London12 – AccorHotels Arena, Paris, France13 – Sportpaleis, Antwerp, Belgium15 – Mercedes-Benz Arena, Berlin, Germany17 – Lanxess Arena, Cologne, Germany19 – Ziggo Dome, Amsterdam, Netherlands21 – Tauron Arena, Kraków, Poland23 – O2 Arena, Prague, Czech Republic24 – SportAréna, Budapest, Hungary Tool announced yesterday (February 27) that the vinyl version of their 2019 album ‘Fear Inoculum’ will be released in April. A signed limited edition version of the physical release drew criticism from fans recently after it was initially priced at $810 (£603). The post Watch Maynard James Keenan try to play Jenga during a Tool show appeared first on NME."
