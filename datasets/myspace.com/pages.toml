description = "Take an exclusive look at the making of the singer’s latest track"
full_description = "NEWS Behind the Scenes of Mothica’s Newest Mental Health-Based Track, ‘Sensitive’ By SPIN | Marisa Whitaker • March 14, 2022 Take an exclusive look at the making of the singer’s latest track Discover More NEWS R.E.M.’s Original Members Take The Stage Again In Athens IN MEMORIAM Gene Hackman, 95, and Wife Found Dead NEWS Why Rihanna Brought Her and A$AP Rocky’s Kids to Court On Friday, alt-pop singer-songwriter Mothica unveiled her latest single, “SENSITIVE.” The track (which takes an introspective look at her mental health and personality) released via Heavy Heart Records, the singer’s imprint with Rise Records/BMG. Check out the video below. “I wanted to make the most upbeat and aggressive song about being an introvert,” Mothica exclusively tells SPIN of the new track. “Because that’s how it feels to me when I have trouble expressing my emotions, sometimes it comes out as anger and frustration of being misunderstood. So we combined a metal guitar with a driving dance bass to illustrate this emotion just in time for Pisces season.” Additionally SPIN has obtained some exclusive behind the scenes photos from photographer Mallory Turner taken during the filming of the music video for “SENSITIVE.” Take a look below. The Los Angeles-based artist is set to hit the road with Coheed and Cambria and Dance Gavin Dance, starting July 12 in Miami. She’s also slated for an appearance at Aftershock Festival in Sacramento this fall. Tickets to see Mothica this year are on sale now. Mothica’s debut, Blue Hour, released in 2020. Mothica Tour Dates 7/12 Miami, FL FPL Solar Amphitheater at Bayfront Park7/13 Tampa, FL MidFlorida Credit Union Amphitheatre7/15 Houston, TX 713 Music Hall7/16 New Braunfels, TX Whitewater Amphitheater7/17 Irving, TX The Pavilion at Toyota Music Factory7/19 Atlanta, GA Coca-Cola Roxy7/23 Nashville, TN Nashville Municipal Auditorium7/24 Charlotte, NC Charlotte Metro Credit Union Amphitheatre7/26 Washington, DC The Anthem7/27 Philadelphia, 