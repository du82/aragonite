["https://myspace.com/article/2022/3/11/rammstein-share-powerful-new-ballad-zeit-and-unveil-new-album-nme"]
title = "Rammstein share powerful new ballad ‘Zeit’ and unveil new album"
description = "The album arrives this April"
full_description = "NEWS Rammstein share powerful new ballad ‘Zeit’ and unveil new album By NME/Elizabeth Aubrey • March 11, 2022 The album arrives this April Discover More NEWS R.E.M.’s Original Members Take The Stage Again In Athens IN MEMORIAM Gene Hackman, 95, and Wife Found Dead NEWS Why Rihanna Brought Her and A$AP Rocky’s Kids to Court Rammstein have shared a powerful new ballad today (March 10) called ‘Zeit’ – listen to it below. READ MORE: Fire, fireworks and flaming babies: the five hottest moments in Rammstein’s stunning Milton Keynes show It’s the title track of their upcoming new album, which is set for release on April 29. It’s the eighth studio album from the Berlin band, which is made up of Till Lindemann (vocals), Paul Landers (guitar), Richard Z. Kruspe (guitar), Flake (keyboards), Oliver Riedel (bass) and Christoph Schneider (drums). The new album will be released on multiple formats on 29 April – including a standard CD in a digipack with a 20-page booklet, a special edition CD in a six-panel digipack with a 56-page booklet including slipcase, and as a double 180g vinyl LP with a 20-page large-format booklet, as well as in the usual digital formats. A press release reveals that the band spent two years working on the eleven songs on the new album. They once again worked with Berlin producer Olsen Involtini and the album was recorded at La Fabrique Studios in St. Rémy de Provence, France. You can listen to new single ‘Zeit’ here: The band plan to release three versions of ‘Zeit’. A statement said: “For the B-sides, the band is releasing a meditative, atmospheric neoclassical arrangement by Grammy-nominated Icelandic multi-instrumentalist Ólafur Arnalds, as well as a remix by electro producer Robot Koch.” The cover of the new album features a picture of Rammstein on the steps of the Trudelturm in Berlin Adlershof and was taken by musician Brian Adams. You check that out along with another new image of the band taken by Adams here: Rammstein – CREDIT: Brian Adams There were previous reports that Rammstein’s new album had been delayed due to a reported paper shortage. As Metal Sucks reported last month, German composer and musical director Sven Helbig – who has contributed orchestral parts to the new album – revealed in a recent interview with Sachsische that a “lack of paper” has affected Rammstein’s release plans. “The band itself doesn’t know at the moment,” Helbig told the publication about when the album might be released (via RammWiki). “The trivial reason: lack of paper. “They need to be able to send out a large number of CDs and records, i.e. lots of booklets and covers, worldwide at one go. And that’s probably not feasible right now.” Rammstein will play in Coventry and Cardiff in June as part of their rescheduled European tour – you can find tickets to their live shows here. The post Rammstein share powerful new ballad ‘Zeit’ and unveil new album appeared first on NME."
