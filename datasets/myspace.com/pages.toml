full_description = "NEWS Pavement Unveil New Video for ‘Harness Your Hopes’ By SPIN | Marisa Whitaker • March 10, 2022 Tickets are still available to see the band this fall in Europe and North America Discover More NEWS R.E.M.’s Original Members Take The Stage Again In Athens IN MEMORIAM Gene Hackman, 95, and Wife Found Dead NEWS Why Rihanna Brought Her and A$AP Rocky’s Kids to Court Pavement released a new video for their 1999 B-side, and the improbable 2022 viral TikTok hit, “Harness Your Hopes.” The Alex Ross Perry-directed video stars Sophie Thatcher. Perry takes Pavement fans through a mini-history of the band on film, placing Thatcher in some of Pavement’s classic music videos. The track was initially released on the CD version of Spit on a Stranger EP back in 1999, which was also the year they disbanded. A reissue of the EP will release as a 12″ on April 8, the same day as the band’s massive Terror Twilight: Farewell Horizontal 45-track exclusive box set. Pavement is finally hitting the road this fall throughout Europe and North America. Tickets are available on the band’s website. Matador, 2022 Spit on a Stranger EP Track List 1) Spit on a Stranger2) Harness Your Hopes3) Roll With the Wind4) The Porpoise and the Hand Grenade5) Rooftop Gambler6) Harness Your Hopes (Live Brixton Academy, 1999) Pavement Tour Dates 6.02.22 ­– Barcelona, ES @ Primavera Sound6.10.22 – Porto, Portugal @ NOS Primavera Sound9.07.22 – San Diego, CA @ Balboa Theatre SOLD OUT9.08.22 – Los Angeles, CA @ Orpheum Theatre SOLD OUT9.09.22 – Los Angeles, CA @ Orpheum Theatre SOLD OUT9.10.22 – Los Angeles, CA @ Orpheum Theatre SOLD OUT9.12.22 – San Francisco, CA @ The Masonic9.13.22 – San Francisco, CA @ The Masonic9.14.22 – San Francisco, CA @ The Masonic9.16.22 – Troutdale, OR @ Edgefield Amphitheatre9.17.22 – Seattle, WA @ The Paramount Theatre SOLD OUT9.19.22 – Denver, CO @ Paramount Theatre SOLD OUT9.20.22 – Kansas City, MO @ Uptown Theater9.21.22 – St. Paul, MN @ The Palace Theatre9.22.2