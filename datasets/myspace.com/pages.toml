full_description = "IN MEMORIAM Gene Hackman, 95, and Wife Found Dead By SPIN: Chelsea Hirsch • February 27, 2025 Legendary actor Gene Hackman, 95, his wife, classical pianist Betsy Arakawa, 64, Discover More NEWS R.E.M.’s Original Members Take The Stage Again In Athens NEWS Why Rihanna Brought Her and A$AP Rocky’s Kids to Court Legendary actor Gene Hackman, 95, his wife, classical pianist Betsy Arakawa, 64, and their dog were found dead in their Santa Fe home on Wednesday, February 26. Santa Fe County Sheriff’s Office spokesperson Denise Avila confirmed that the trio was discovered deceased during a wellness check at approximately 1:45 p.m. local time. More from Spin: Michelle Trachtenberg Reportedly Dead at 39 Grindcore: Our 1991 Feature on the Metal Subgenre Vicky Cornell Describes Her Doubts About Chris Cornell’s Suicide in New Interview While the cause of death remains unclear, Hackman’s daughter, Elizabeth Jean Hackman, told TMZ on Thursday, February 27, that the family suspects toxic fumes may have contributed to their passing. Santa Fe County Sheriff Adan Mendoza confirmed to the outlet that deputies are still investigating the deaths. Gene Hackman arrives at the 60th Annual Golden Globe Awards held at the Beverly Hilton Hotel in Los Angeles, CA on January 19, 2003. Photo by Kevin Winter/Getty Images. The couple had been living in New Mexico since Gene Hackman retired from Hollywood. They were last seen publicly on March 28, 2024, during a rare lunch outing at Pappadeaux Seafood Kitchen in Santa Fe, New Mexico. Hackman is best known for his iconic roles in The French Connection, The Royal Tenenbaums, The Conversation, and Unforgiven, among other films. To see our running list of the top 100 greatest rock stars of all time, click here. Sign in to Myspace Use Facebook, Twitter or your email to sign in. Don't have a Myspace account yet? No worries, joining is easy. Facebook Twitter Email or Username Password Forgot password? Keep me signed in Sign In Forgot you