["https://myspace.com/article/2022/2/24/coldplay-cover-kid-cudi-and-share-new-version-of-let-somebody-go-for-spotify-singles-spin"]
title = "Coldplay Cover Kid Cudi and Share New Version of ‘Let Somebody Go’ for Spotify Singles"
description = "“This is the first time I think that we’ve really taken proper time to record a cover,” Chris Martin said of covering Kid Cudi"
full_description = "NEWS Coldplay Cover Kid Cudi and Share New Version of ‘Let Somebody Go’ for Spotify Singles By SPIN | Marisa Whitaker • February 24, 2022 “This is the first time I think that we’ve really taken proper time to record a cover,” Chris Martin said of covering Kid Cudi Discover More NEWS R.E.M.’s Original Members Take The Stage Again In Athens IN MEMORIAM Gene Hackman, 95, and Wife Found Dead NEWS Why Rihanna Brought Her and A$AP Rocky’s Kids to Court For their inaugural Spotify Singles recording, Coldplay covered one of rap’s and one of pop’s biggest stars. On Side A, the band fronted by Chris Martin tackled an acoustic rendition of “Let Somebody Go,” which is their current single with Selena Gomez. “I have always loved Selena’s voice and when ‘Let Somebody Go’ arrived it felt like she was the only person to sing it with,” Martin said. The original track was released on September 14, 2021 On Side B, Coldplay provided a synthy cover of Kid Cudi‘s 2008 track “Day ‘N’ Nite.” The session was recorded at Henson Recording Studio in Los Angeles. “‘Day ‘N’ Nite’ I loved when it came out, and I still love love love it,” Martin said. “This is the first time I think that we’ve really taken proper time to record a cover, because in my head I could hear a version of it quite different from the original, that hopefully just reinforces what a brilliant song it is. One way or another I hope that anyone listening will just think, ‘Wow, Kid Cudi is amazing.'” Coldplay recently released their ninth studio record, Music Of The Spheres, on October 15, 2021. You can read our review of the album here. The post Coldplay Cover Kid Cudi and Share New Version of ‘Let Somebody Go’ for Spotify Singles appeared first on SPIN. Sign in to Myspace Use Facebook, Twitter or your email to sign in. Don't have a Myspace account yet? No worries, joining is easy. Facebook Twitter Email or Username Password Forgot password? Keep me signed in Sign In"
