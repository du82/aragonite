["https://myspace.com/article/2022/2/23/watch-green-day-drive-around-in-a-convertible-in-new-1972-music-teaser-nme"]
title = "Watch Green Day drive around in a convertible in new “1972” music teaser"
description = "Is a new album coming?"
full_description = "NEWS Watch Green Day drive around in a convertible in new “1972” music teaser By NME/Damian Jones • February 23, 2022 Is a new album coming? Discover More NEWS R.E.M.’s Original Members Take The Stage Again In Athens IN MEMORIAM Gene Hackman, 95, and Wife Found Dead NEWS Why Rihanna Brought Her and A$AP Rocky’s Kids to Court Green Day have shared a snippet of new music in another “1972” teaser clip. The short video, which you can view below, is the latest in a series of teasers from the band that have been released on social media in recent months. READ MORE: 10 albums that wouldn’t exist without Green Day’s ‘Dookie’ This new 10-second clip features the logo of frontman Billie Joe Armstrong‘s defunct Adeline Records, as well as footage of graffiti being sprayed, a studio and the band driving around in a convertible car – all of which is soundtracked by a snippet of frenetic new music. At one point in the clip, the numbers “1972” flash up on screen yet again. This latest teaser follows last month’s short video, which saw the trio discussing a melody and rehearsing a track that sounds reminiscent of ‘The Static Age’ from 2009’s ‘21st Century Breakdown‘. https://t.co/BOkRTjAO0D pic.twitter.com/fdodp1ZB87 — Green Day (@GreenDay) February 22, 2022 Green Day previously shared a short clip of themselves recording music at London’s RAK Studios, set to what appeared to be a new song, as well as another short video with a mysterious split-screen teaser which saw Armstrong strumming an acoustic riff. All the clips have featured the number “1972”, leading many fans to speculate that a new album with that title is on the way. They’ve also tried to work out the meaning of “1972”, with one fan pointing out that all three members of the band – Armstrong, Mike Dirnt and Tré Cool – were born in 1972, while another fan added: “1972? 50th birthday special?” Green Day’s last album – 2020’s ‘Father Of All Motherfuckers’ – received a four-star review from NME and was described as being a “good old knees-up”, free from the group’s usual politics.” Green Day recently kicked off their 2022 tour with a set at the Bud Light Super Bowl Music Fest. They will hit the UK and Europe later this summer, with dates including the ‘Hella Mega Tour’ which also features Fall Out Boy and Weezer. Green Day will play: June1 – Berlin, Kindl-Bühne Wuhlheide3 – Nürburg, Rock am Ring7 – Copenhagen, Forum9 – Ålesund, Color Line Stadion11 – Johanneshov, Tele2 Arena15 – Milan, Milano Summer Festival16 – Florence, Firenze Rocks Festival18 – Hradec Králové, Rock For People19 – Vienna, Ernst-Happel Stadion21 – Antwerp, Sportpaleis22 – Groningen, Stadspark24 – London, London Stadium25 – Huddersfield, John Smith’s Stadium27 – Dublin, Venue TBA29 – Glasgow, Bellahouston Park July2 – Paris, La Defense Arena The post Watch Green Day drive around in a convertible in new “1972” music teaser appeared first on NME."
