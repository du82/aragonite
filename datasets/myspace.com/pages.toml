title = "Sharon Van Etten Shares New Single ‘Used to It’ and Accompanying Video"
description = "It’s her second release of the year"
full_description = "NEWS Sharon Van Etten Shares New Single ‘Used to It’ and Accompanying Video By SPIN | Katrina Nattress • March 01, 2022 It’s her second release of the year Discover More NEWS R.E.M.’s Original Members Take The Stage Again In Athens IN MEMORIAM Gene Hackman, 95, and Wife Found Dead NEWS Why Rihanna Brought Her and A$AP Rocky’s Kids to Court Sharon Van Etten is back with her second release of the year, “Used to It.” The singer-songwriter originally wrote the track after being asked to help create a score for Baby God, an HBO documentary about a fertility specialist who impregnates women with his own sperm. “Ultimately, the film team changed their musical direction, but I found myself welcomely challenged to the idea of writing a song about the concept of family, connection through blood, nature vs nurture, while attempting to incorporate ideas of love and the complexities of science and technology,” she explained in a statement. “I am grateful for this song to be able to have a new life, relating more to the times we have all been living through and redefining the meaning of this song by focusing on the positives of seeking connection and understanding what family means to the individual.” Van Etten also shared an accompanying video, which was created by her musical director and bandmate Charley Damski and features the dancer and choreographer Hayden J Frederick. “Together, they helped me convey the feelings of internal struggles, while also finding space for oneself and embracing that pain in order to move on,” she said about the visuals. “Used to It” follows “Porta,” which was Van Etten’s first solo single since 2020. Watch the video below. Van Etten plans to spend the spring and summer on the road, including European dates on her Darkness Fades tour and a co-headlining trek with Angel Olsen and Julien Baker billed as the Wild Hearts Tour. Get ticket information via her official website and check out a full list of tour dates below. Sharon Van Et