title = "MySQL :: MySQL as an Embedded Database"
full_description = "MySQL as an Embedded Database Over 2000 ISVs, OEMs, and VARs rely on MySQL as their products' embedded database to make their applications, hardware and appliances more competitive, bring them to market faster, and lower their COGs (cost of goods sold). These ISV and OEM customers choose MySQL for its: Low-cost, up to 90% less than Microsoft SQL Server with features that ensure COGS remain low throughout an application's life cycle. Lower database costs allow vendors to offer their products at a fraction of the cost of competing solutions and the flexibility to appeal to more price-sensitive customers. Cross Platform Flexibility with support for over 20 platforms providing the freedom to ship products on multiple hardware and operating system combinations and into more markets. High Performance, Reliability and Scalability to meet the requirements of the most demanding applications, such as Telco and Network management. Including a full-featured RDBMS helps to make products more competitive initially and over time as customers’ data needs inevitably increase. Ease-of-Use with fast installation, configuration and integration so developers can focus on application development, reducing costs and time to market. Zero-administration, eliminating the need for customers to hire a dedicated DBA or spend any cycles on database administration, and reducing or eliminating costly database-related support calls. MySQL is available in 4 editions for embedding in commercial products: MySQL Classic Edition MySQL Standard Edition MySQL Enterprise Edition MySQL Cluster Carrier Grade Edition MySQL Classic Edition MySQL Standard Edition MySQL Enterprise Edition MySQL Cluster Carrier Grade Edition Commercial License2,3,4,5 Contact the MySQL Embedded Sales Team7 MySQL Features MySQL Database Server √ √ √ √ MySQL Document Store √ √ MySQL Connectors √ √ √ √ MySQL Replication √ √ √ √ MySQL Partitioning √ √ MySQL Router √ √ MySQL Operator for Kubernetes √ √ MySQL Shell √