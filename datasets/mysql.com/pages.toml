title = "MySQL :: MySQL Webinars"
full_description = '''MySQL Webinars Language: All French English Spanish Italian <input type="submit" value="Go" /> Transforming Government Operations with Open-Source Innovation: Unlock the Power of MySQL Enterprise Tuesday, March 04, 2025 From local governments to federal agencies, the public sector is under increasing pressure to innovate, reduce costs, and meet the demands of an ever-evolving digital landscape. MySQL Enterprise, the #1 open-source database, empowers government organizations to drive modernization across their operations, enhance citizen services, and improve data management. In this session, discover how government agencies are leveraging MySQL Enterprise to streamline operations, ensure data security and compliance (FISMA, NIST, GDPR, etc.), and improve transparency and accountability. Learn how adopting open-source solutions can support digital transformation initiatives, boost collaboration, enhance system interoperability, and prepare for the future of government technology. Don’t miss out on this opportunity to explore how MySQL is enabling government agencies to meet today’s challenges and thrive in a digital-first world. Register for this web presentation » Transformación del sector público con innovación y código abierto: descubra el poder de MySQL Enterprise Wednesday, March 12, 2025 Desde las administraciones locales hasta el Gobierno central, el sector público se encuentra bajo una presión cada vez mayor para innovar, reducir costos y satisfacer las demandas de un panorama digital en constante evolución. MySQL Enterprise, la base de datos de código abierto número uno, permite a las administraciones públicas de impulsar la modernización en todas sus operaciones, mejorar los servicios a los ciudadanos y mejorar la gestión de datos. En esta sesión, descubra cómo el sector público está aprovechando MySQL Enterprise para optimizar las operaciones, garantizar la seguridad y el cumplimiento de los datos (GDPR, FISMA, NIST, etc.) y mejorar la transparencia y la rendición de cuentas. Descubra cómo la adopción de soluciones de código abierto puede respaldar las iniciativas de transformación digital, impulsar la colaboración, mejorar la interoperabilidad del sistema y prepararse para el futuro de la tecnología gubernamental. No pierda esta oportunidad de explorar cómo MySQL permite a las administraciones públicas enfrentar los desafíos actuales y prosperar en un mundo digital. Register for this web presentation » Optimiser MySQL pour les Besoins et la Croissance de Votre Entreprise Thursday, March 13, 2025 Pour tirer pleinement parti des capacités de MySQL, il est essentiel d’optimiser et d’ajuster votre environnement de base de données en fonction de vos exigences spécifiques. Dans cette session, nous explorerons différentes méthodes pour analyser les performances de vos instances MySQL et partagerons avec vous des suggestions et des meilleures pratiques afin d’atteindre des performances optimales. Register for this web presentation » Trasformare le attività governative con l'innovazione open source: sfrutta la potenza di MySQL Enterprise Tuesday, March 18, 2025 Dal governo centrale alle amministrazioni locali, il settore pubblico è sempre più sotto pressione per innovare, ridurre i costi e soddisfare le esigenze di un panorama digitale in continua evoluzione. MySQL Enterprise, il database open-source numero 1, consente alla pubblica amministrazione di modernizzare le attività di deploy e manutenzione, migliorare i servizi ai cittadini e la gestione dei dati. In questa sessione, scopri come gli enti pubblici stanno sfruttando MySQL Enterprise per semplificare le operazioni, garantire la sicurezza e la compliance dei dati (FISMA, NIST, GDPR, ecc.). Scopri come l'adozione di soluzioni open source può supportare iniziative di trasformazione digitale, aumentare la collaborazione, migliorare l'interoperabilità dei sistemi e prepararsi per il futuro della tecnologia governativa. Non perdere questa opportunità per scoprire in che modo MySQL sta consentendo agli enti pubblici di affrontare le sfide di oggi e prosperare in un mondo digital-first. Register for this web presentation » Transformer les opérations gouvernementales grâce à l'innovation open-source : Libérez la puissance de MySQL Enterprise Tuesday, March 25, 2025 Des gouvernements locaux aux agences fédérales, le secteur public est soumis à une pression croissante pour innover, réduire les coûts et répondre aux exigences d'un paysage numérique en constante évolution. MySQL Enterprise, la base de données open-source n°1, permet aux organisations gouvernementales de moderniser leurs opérations, d'améliorer les services aux citoyens et de gérer efficacement les données. Au cours de cette session, découvrez comment les agences gouvernementales exploitent MySQL Enterprise pour rationaliser leurs opérations, garantir la sécurité et la conformité des données (FISMA, NIST, RGPD, etc.), et améliorer la transparence et la responsabilité. Apprenez comment l'adoption de solutions open-source peut soutenir les initiatives de transformation numérique, favoriser la collaboration, améliorer l'interopérabilité des systèmes et préparer l'avenir de la technologie gouvernementale. Ne manquez pas cette opportunité d'explorer comment MySQL permet aux agences gouvernementales de relever les défis d'aujourd'hui et de prospérer dans un monde numérique axé sur le digital. Register for this web presentation » Novedades en la monitorización de MySQL con el plugin para Oracle Enterprise Manager Tuesday, April 01, 2025 La supervisión y la observabilidad eficaces de una base de datos MySQL son fundamentales para garantizar su rendimiento, estabilidad y seguridad. En esta sesión, aprenderá sobre las novedades, las métricas clave para supervisar en MySQL y las mejores prácticas para la observabilidad y la resolución de problemas. Exploraremos cómo el nuevo plugin de monitorización de MySQL para Oracle Enterprise Manager permite observar los distintos aspectos del rendimiento de MySQL, como el uso de la CPU, el uso de la memoria, la E/S del disco, el rendimiento de las consultas y la alta disponibilidad. Al finalizar esta sesión, tendrá una comprensión integral de cómo monitorizar y mantener eficazmente el estado de su base de datos MySQL y cómo identificar problemas de rendimiento comunes. Register for this web presentation » What’s New in MySQL Monitoring with Oracle Enterprise Manager Plugin Thursday, April 03, 2025 Effective monitoring and observability of a MySQL database is critical to ensuring its performance, stability, and security. In this session, you'll learn about what’s new, key metrics to monitor in MySQL and best practices for observability and troubleshooting. We'll explore how the new MySQL monitoring plugin for Oracle Enterprise Manager enables observability on the various aspects of MySQL performance, such as CPU utilization, memory usage, disk I/O, query performance and high availability. By the end of this session, you'll have a comprehensive understanding of how to effectively monitor and maintain the health of your MySQL database and how to identify common performance issues. Register for this web presentation » Il monitoraggio MySQL con il plugin Oracle Enterprise Manager Tuesday, April 08, 2025 Un monitoraggio e un'osservabilità efficaci di un database MySQL sono fondamentali per garantirne prestazioni, stabilità e sicurezza. In questa sessione verranno fornite informazioni sulle metriche chiave da monitorare in MySQL e sulle procedure ottimali per l'osservabilità e la risoluzione dei problemi. Esploreremo come il nuovo plugin di monitoraggio, MySQL per Oracle Enterprise Manager, consenta di tenere sotto controllo i vari aspetti delle prestazioni di MySQL, come l'utilizzo della CPU, l'uso della memoria, l'I/O del disco, le prestazioni delle query e l'alta disponibilità. Alla fine di questa sessione, avrai gli elementi per monitorare e mantenere in modo efficace lo stato del tuo database MySQL e di come identificare i problemi comuni di performance. Register for this web presentation » Quoi de Neuf dans la Surveillance de MySQL avec le Plugin Oracle Enterprise Manager Thursday, April 10, 2025 Une surveillance efficace et une observabilité d'une base de données MySQL sont essentielles pour garantir sa performance, sa stabilité et sa sécurité. Au cours de cette session, vous découvrirez les nouveautés, les indicateurs clés à surveiller dans MySQL et les meilleures pratiques pour l'observabilité et le dépannage. Nous explorerons comment le nouveau plugin de surveillance MySQL pour Oracle Enterprise Manager permet de surveiller les différents aspects de la performance de MySQL, tels que l'utilisation du CPU, l'utilisation de la mémoire, les entrées/sorties du disque, la performance des requêtes et la haute disponibilité. À la fin de cette session, vous aurez une compréhension complète de la manière de surveiller et de maintenir efficacement la santé de votre base de données MySQL et comment identifier les problèmes de performance courants. Register for this web presentation » $(function() { $('#lang').change(function() { $('#webinars').submit(); }); });'''
