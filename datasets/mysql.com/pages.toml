["https://mysql.com/products/enterprise"]
title = "MySQL :: MySQL Enterprise Edition"
full_description = 'MySQL Enterprise Edition MySQL Enterprise Edition includes the most comprehensive set of advanced features, management tools and technical support to achieve the highest levels of MySQL scalability, security, reliability, and uptime. It reduces the risk, cost, and complexity in developing, deploying, and managing business-critical MySQL applications. White Paper: MySQL Enterprise Edition » MySQL Enterprise Backup MySQL Enterprise Backup reduces the risk of data loss by delivering online "Hot" backups of your databases. It supports full, incremental and partial backups, Point-in-Time Recovery and backup compression. Learn More » MySQL Enterprise High Availability MySQL InnoDB Cluster delivers an integrated, native, HA solution for your databases. It tightly integrates MySQL Server with Group Replication, MySQL Router, and MySQL Shell, so you don’t have to rely on external tools, scripts or other components. Learn More » MySQL Enterprise Scalability MySQL Enterprise Scalability enables you to meet the sustained performance and scalability requirements of ever increasing user, query and data loads. MySQL Thread Pool provides an efficient, thread-handling model designed to reduce overhead in managing client connections, and statement execution threads. Learn More » New! MySQL Enterprise Stored Programs MySQL Enterprise Stored Programs allows DBAs and Developers to write JavaScript based Stored Programs and Functions. Developers can leverage the power of the world’s most popular language – JavaScript, inside of MySQL Enterprise. Learn More » MySQL Enterprise Authentication MySQL Enterprise Authentication provides ready to use external authentication modules to easily integrate MySQL with existing security infrastructures including PAM and Windows Active Directory. MySQL users can be authenticated using Pluggable Authentication Modules ("PAM") or native Windows OS services. Learn More » MySQL Enterprise Transparent Data Encryption (TDE) MySQL Enterprise Transparent Data Encryption (TDE) enables data-at-rest encryption by encrypting the physical files of the database. Data is encrypted automatically, in real time, prior to writing to storage and decrypted when read from storage. Learn More » MySQL Enterprise Encryption MySQL Enterprise Encryption provides encryption, key generation, digital signatures and other cryptographic features to help organizations protect confidential data and comply with regulatory requirements. Learn More » MySQL Enterprise Masking and De-identification MySQL Enterprise Masking and De-identification provides an easy to use, built-in database solution to help organizations protect sensitive data from unauthorized uses by hiding and replacing real values with substitutes. Learn More » MySQL Enterprise Firewall MySQL Enterprise Firewall guards against cyber security threats by providing real-time protection against database specific attacks, such as an SQL Injection. MySQL Enterprise Firewall monitors for database threats, automatically creates an allowlist of approved SQL statements and blocks unauthorized database activity. Learn More » MySQL Enterprise Audit MySQL Enterprise Audit enables you to quickly and seamlessly add policy-based auditing compliance to new and existing applications. You can dynamically enable user level activity logging, implement activity-based policies, manage audit log files and integrate MySQL auditing with Oracle and third-party solutions. Learn More » New! MySQL Enterprise Telemetry MySQL Enterprise Telemetry allows users to monitor MySQL performance and behavior by defining, creating, and collecting telemetry data from MySQL using the OpenTelemetry observability framework. Learn More » Oracle Enterprise Manager for MySQL The Oracle Enterprise Manager for MySQL provides real-time monitoring and delivers comprehensive performance, availability and configuration information for your MySQL databases. Learn More » 24x7 Support MySQL Technical Support Services provide 24x7 direct access to our expert MySQL Support engineers who are ready to assist you in the development, deployment, and management of MySQL applications. Learn More » White Paper: MySQL Enterprise Edition Product Guide »'
