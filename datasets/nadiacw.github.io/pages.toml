["https://nadiacw.github.io/softwear/knitting/2020/06/15/bugs.html"]
title = "on bugs | softwear 🧶 🕸 👩‍💻"
description = "A bug, in computer science, is “an error, flaw or fault in a computer program or system that causes it to produce an incorrect or unexpected result, or to behave in unintended ways.” Software bug - Wikipedia."
full_description = "on bugs Jun 15, 2020 A bug, in computer science, is “an error, flaw or fault in a computer program or system that causes it to produce an incorrect or unexpected result, or to behave in unintended ways.” Software bug - Wikipedia. Using the knitting machine involves taking into account many different parameters and settings - knobs, levers, switches - along with the physical conditions and mood of the yarn, one’s hands and body, and many other invisible frictions and tensions. I have many encounters with ‘knitting bugs’. A bug is not an absolute notion, but rather a relative concept that occurs when two different visions of a software application do not match: the actual behavior and the expected one. This means that a single instruction or a piece of code cannot be classified as a bug, per se. It’s only when its behavior is compared to the expected behavior that it can become a bug. Types of software bugs off-by-one error null pointer exception logical bug race condition unchecked input division by zero Effects bugs might cause overflow memory leak crash wrong output glitch latency infinite loops Bugs have very interesting aesthetic values and connotations: they’re unexpected, unusual, curious, out of place, messy, they’re commonly seen as negative, faults and defects, misbehaving, unruly outcomes that can only be defined that way when compared to a canonical, standard ‘desired’ outcome. Knitting is entanglement, knots, friction, tension, fraying, stubbornness; it’s slippery, taught, loopy, gnarly, unravelling, … Knitting, being a series of knots and loops along the same thread, can easily be unravelled or undone, which allows for remaking, reusing and ravelling up the yarn again into something new. Knitting can hide secret messages and meanings, which can be easily destroyed by unravelling the whole piece. See the post on knitting data. A bowl of bugs is not waste - these scraps can be used to begin new pieces, to seam two pieces together, to weave a new piece. Weaving scrap yarn from the bowl of bugs. In software / computer science, bugs are undesired, discarded pieces of code, material that is deleted… might they be reused? What can software learn from knitting? Software bugs are sometimes preserved and documented, especially when using collaborative platforms like Github, via file formats that compare the buggy code and the correct code: diff How can bugs help us make something anew? Unravel a bug and ravel it up again into something new. Some of the text in this post has been adapted from Wikipedia, and from notes and email exchanges by Benoit Baudry, Erik Natanael, Thomas Durieux and myself."
year_published = 2020
year_updated = 2020
