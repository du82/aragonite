["https://nafn.de/blog/obsidian"]
title = "Malte Krupa"
description = "Malte Krupa"
full_description = "Why I Choose Obsidian Over Logseq - 2022-04-25I spent one or two days with logseq because a lot of people on the internet recommended it.Initially I found my way into this bubble via the sprachnachrichten podcast and a youtube video where a person explained their way of “taking notes”.Let’s start with the things I immediately didn’t like about logseq:Promotes “privacy-first” but you have to manually disable tracking for multiple error-tracking-application-analytics-monitoring-sites after the first startYou also have to disable tracking on every device separatelyHas keyboard shortcuts that just don’t work for me. E.g. 🍎+, is not workingIn general it feels way too mouse-centricvim mode is available via a plugin which makes everything a bit more complicatedDoes not allow to disable auto pairing for brackets and back-ticks (I even had to tweet about it)Let’s compare it to what I like about Obsidian:Has a working vim mode includedOnly opens one connection to releases.obsidian.md when opening the applicationHas decent keyboard shortcuts that make sense to meAllows to disable auto pairing for brackets and back-ticksAfter fifteen minutes with obisidian I was ready to pay them even tough it is free for personal use."
