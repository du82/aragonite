["https://nakryiko.com/posts/bcc-to-libbpf-howto-guide"]
title = "BCC to libbpf conversion guide"
description = """
A practical guide to converting your BCC-based BPF application to libbpf and
BPF CO-RE (Compile Once – Run Everywhere)."""
full_description = '''BCC to libbpf conversion guide Feb 20, 2020 Categories: BPF Tags: bpf bcc Table of Contents Why libbpf and BPF CO-RE? Setting up user-space parts Building everything Locked memory limits Libbpf log BPF skeleton and BPF app lifecycle BPF code conversion Detecting BCC vs libbpf modes Header includes Field accesses BPF maps Accessing BPF maps from BPF code BPF programs Tracepoints Kprobes Dealing with compile-time #if’s in BCC Application configuration Common issues Global variables Loop unrolling Helper sub-programs bpf_printk debugging How can you contribute? A practical guide to converting your BCC-based BPF application to libbpf and BPF CO-RE. This post was originally posted on Facebook's BPF blog. This version has some minor fixes and adjustments. It also has as an updated section on using BPF subprograms to reflect new libbpf features added since the original publication. Why libbpf and BPF CO-RE? Historically, BCC was a framework of choice when you had to develop a BPF application that required peering into the internals of the kernel when implementing all sorts of tracing BPF programs. BCC provided a built-in Clang compiler that could compile your BPF code in runtime, tailoring it to a specific target kernel on the host. This was the only way to develop a maintainable BPF application that had to deal with internals of an ever-changing kernel. See “BPF Portability and CO-RE” post, which does a better and more detailed job explaining why is that so and why BCC was previously pretty much the only viable choice. It also explains why libbpf is a good choice now. Libbpf over last year got a major boost in capabilities and sophistication, closed many existing gaps with BCC, especially for tracing applications, and also gained lots of new and powerful features not available in BCC (for instance, global variables and BPF skeletons). Granted, BCC is going to great lengths to simplify BPF developer’s life, but sometimes that extra convenience gets in the way and makes it actually harder to figure out what’s wrong and how to fix it. It feels like BCC simply has too much magic at times. You have to remember naming conventions and auto-generated structs for tracepoints. You have to rely on code rewriting to read kernel data and fetch kprobe arguments. You’ll write a semi-object-oriented C code when working with BPF maps, which doesn’t exactly match what really happens in the kernel. And despite all the magic, BCC will still make you write a bunch of boilerplate code in user-space part of your application, setting up most trivial pieces by hand. As mentioned above, BCC relies on runtime compilation and brings the entire huge LLVM/Clang library in and embeds it inside itself. This has many consequences, all of which are less than ideal: heavy resource utilization (both memory and CPU) during compilation, potentially disrupting main workflow on a busy server; dependency on kernel headers package, that has to be installed on every target host. And even then, if you need something from kernel that is not exposed through public headers – you’ll need to copy/paste type definitions into your BPF code by hand to get your work done; even a trivial compilation-time errors are detected only during the runtime, after you’ve rebuilt and restarted your user-space application completely; this significantly reduces development iteration time (and increases frustration levels...) Libbpf + BPF CO-RE (Compile Once — Run Everywhere) chose a different way. Their philosophy is that BPF programs are not much different from any “normal” user-space program: they ought to be compiled once into small binaries and then deployed unmodified in a compact form to target hosts. Libbpf plays the role of BPF program loader, performing mundane set up work (relocations, loading and verifying BPF programs, creating BPF maps, attaching to BPF hooks, etc), letting developers worry only about BPF program correctness and performance. Such approach keeps overhead to the minimum, eliminates heavy dependencies, makes the overall developer experience much more pleasant. In terms of APIs and code conventions, libbpf sticks to the philosophy of the least surprise, which means that most of the things have to be spelled out explicitly: there won’t be any implicitly included headers and no code rewriting. Just plain C code and a healthy dose of helper macro to eliminate most mundane parts. Other than that, what you write is what gets executed and the structure of your BPF application is 1-to-1 with what kernel ultimately verifies and executes. These guidelines were written to make BCC to libbpf + BPF CO-RE conversion process easier, faster, and less painful. They explain various preliminary set up steps, outline common patterns, explains differences, problems, and gotchas, which you inevitably will encounter due to differences between BCC and libbpf. Switching from BCC to vanilla libbpf + BPF CO-RE might feel unusual and confusing at first, but you’ll get a hang of it pretty quickly and will appreciate libbpf’s explicitness and straightforwardness next time you run into a compilation or verification problem. Also, keep in mind that a bunch of Clang features used for BPF CO-RE are pretty new, so you’ll need a Clang 10 or newer to make all this work. Setting up user-space parts Building everything Building libbpf-based BPF application using BPF CO-RE consists of few steps: generating vmlinux.h header file with all kernel types; compiling your BPF program source code using recent Clang (version 10 or newer) into .o object file; generating BPF skeleton header file from compiled BPF object file; including generated BPF skeleton header to use from user-space code; then, at last, compiling user-space code, which will get BPF object code embedded in it, so that you don’t have to distribute extra files with your application. How exactly this is done will depend on your specific setup and build system, which can’t be addressed here in enough details. For one way to do this please check BCC’s libbpf-tools, which set up a generic Makefile rules that take care of all this for you in a succinct manner. When BPF code is compiled and BPF skeleton is generated, include libbpf and skeleton headers in your user-space code to have necessary APIs ready to be used: #include <bpf/bpf.h> #include <bpf/libbpf.h> #include "path/to/your/skeleton.skel.h" Locked memory limits BPF is using locked memory for BPF maps and various other things. By default, this limit is very low, so unless it’s increased, even a trivial BPF program won’t load successfully into the kernel. BCC unconditionally sets this limit to infinity, but libbpf doesn’t do this automatically (by design). Depending on your production environment, there might be better and more preferred ways of doing this. But for quick experimentation or if there is no better way of doing this, you can do it yourself through setrlimit(2) syscall, which should be called at the very beginning of your program: #include <sys/resource.h> rlimit rlim = { .rlim_cur = 512UL << 20, /* 512 MBs */ .rlim_max = 512UL << 20, /* 512 MBs */ }; err = setrlimit(RLIMIT_MEMLOCK, &rlim); if (err) /* handle error */ Libbpf log When something doesn’t work as expected, the best way to start investigating is to look at libbpf log output. Libbpf outputs a bunch of useful logs at various levels of verbosity. By default, libbpf will emit error-level output to console. We recommend installing a custom logging callback and set up ability to turn on/off verbose debug-level output: int print_libbpf_log(enum libbpf_print_level lvl, const char *fmt, va_list args) { if (!FLAGS_bpf_libbpf_debug && lvl >= LIBBPF_DEBUG) return 0; return vfprintf(stderr, fmt, args); } /* ... */ libbpf_set_print(print_libbpf_log); /* set custom log handler */ BPF skeleton and BPF app lifecycle Detailed explanation of using BPF skeleton (and libbpf API in general) is beyond the scope of this document, existing kernel selftests and BCC libbpf-tools examples are probably the best way to get a feel for it. Check out runqslower example as a simple but real tool utilizing skeleton. Nevertheless, it’s useful to explain main libbpf concepts and phases that each BPF application goes through. BPF application consists of a set of BPF programs, either cooperating or completely independent, and BPF maps and global variables, shared between all BPF programs (allowing them to cooperate on a common set of data). BPF maps and global variables are also accessible from user-space (we interchangeably refer to user-space part of application as a "control app"), allowing the control app to get or set any extra data necessary. BPF application typically goes through the following phases: Open phase. BPF object file is parsed: BPF maps, BPF programs, and global variables are discovered, but not yet created. After a BPF app is opened, it’s possible to make any additional adjustments (setting BPF program types, if necessary; pre-setting initial values for global variables, etc), before all the entities are created and loaded. Load phase. BPF maps are created, various relocations are resolved, BPF programs are loaded into the kernel and verified. At this point, all the parts of a BPF application are validated and exist in kernel, but no BPF program is yet executed. After the load phase, it’s possible to set up initial BPF map state without racing with the BPF program code execution. Attachment phase. This is the phase at which BPF programs get attached to various BPF hook points (e.g., tracepoints, kprobes, cgroup hooks, network packet processing pipeline, etc). This is the phase at which BPF starts performing useful work and read/update BPF maps and global variables. Tear down phase. BPF programs are detached and unloaded from the kernel. BPF maps are destroyed and all the resources used by the BPF app are freed. Generated BPF skeleton has corresponding functions to trigger each phase: <name>__open() – creates and opens BPF application; <name>__load() – instantiates, loads, and verifies BPF application parts; <name>__attach() – attaches all auto-attachable BPF programs (it’s optional, you can have more control by using libbpf APIs directly); <name>__destroy() – detaches all BPF programs and frees up all used resources. BPF code conversion In this part, we’ll go over typical conversion flow and will outline typical mismatches between how BCC and libbpf/BPF CO-RE do things. Hopefully, this will make it easy for you to convert your BPF code to be both BCC- and BPF CO-RE compatible. Detecting BCC vs libbpf modes For cases where you’ll need to support both BCC and libbpf "modes", it’s useful to be able to detect which mode BPF program code is compiled for. Simplest way to do this is to rely on the presence of BCC_SEC macro in BCC: #ifdef BCC_SEC #define __BCC__ #endif After this, throughout your BPF code, you can do: #ifdef __BCC__ /* BCC-specific code */ #else /* libbpf-specific code */ #endif This allows to have a common BPF source code with only necessary pieces of logic be BCC- or libbpf-specific. Header includes With libbpf/BPF CO-RE, you don’t need to include kernel headers (i.e., all those #include <linux/whatever.h>), instead include a single vmlinux.h and few libbpf helper headers: #ifdef __BCC__ /* linux headers needed for BCC only */ #else /* __BCC__ */ #include "vmlinux.h" /* all kernel types */ #include <bpf/bpf_helpers.h> /* most used helpers: SEC, __always_inline, etc */ #include <bpf/bpf_core_read.h> /* for BPF CO-RE helpers */ #include <bpf/bpf_tracing.h> /* for getting kprobe arguments */ #endif /* __BCC__ */ vmlinux.h might not contain some useful kernel #define constants, so for those cases you’ll need to re-declare them here as well. Most common set of constants is going to be provided inside bpf_helpers.h, though. Field accesses BCC silently rewrites your BPF code and turns field accesses like tsk->parent->pid into a series of bpf_probe_read() calls. Libbpf/BPF CO-RE doesn’t have such a luxury, but bpf_core_read.h provides a set of helpers to get as close to this in vanilla C as possible. The above tsk->parent->pid will become BPF_CORE_READ(tsk, parent, pid). With tp_btf and fentry/fexit BPF program types, available since Linux 5.5, natural C syntax is possible as well. But for older kernels and other BPF program types (e.g., tracepoints and kprobes), your best bet is to convert to BPF_CORE_READ. Further, BPF_CORE_READ macro also works in BCC mode, so to avoid duplication of every field access with #ifdef __BCC__/#else/#endif, you can convert all the field reads into BPF_CORE_READ for both BCC and libbpf modes. With BCC, make sure that bpf_core_read.h header is part of your final BPF program, though. BPF maps The way that BCC and libbpf define BPF maps declaratively is different, but conversion is very straightforward. Here are some of the examples: /* Array */ #ifdef __BCC__ BPF_ARRAY(my_array_map, struct my_value, 128); #else struct { __uint(type, BPF_MAP_TYPE_ARRAY); __uint(max_entries, 128); __type(key, u32); __type(value, struct my_value); } my_array_map SEC(".maps"); #endif /* Hashmap */ #ifdef __BCC__ BPF_HASH(my_hash_map, u32, struct my_value); #else struct { __uint(type, BPF_MAP_TYPE_HASH); __uint(max_entries, 10240); __type(key, u32); __type(value, struct my_value); } my_hash_map SEC(".maps") #endif /* Per-CPU array */ #ifdef __BCC__ BPF_PERCPU_ARRAY(heap, struct my_value, 1); #else struct { __uint(type, BPF_MAP_TYPE_PERCPU_ARRAY); __uint(max_entries, 1); __type(key, u32); __type(value, struct my_value); } heap SEC(".maps"); #endif N.B. Pay attention to the default size of maps in BCC, it’s usually 10240. With libbpf you have to specify the size explicitly. PERF_EVENT_ARRAY, STACK_TRACE and few other specialized maps (DEVMAP, CPUMAP, etc) don’t support (yet) BTF types for key/value, so specify key_size/value_size directly instead: /* Perf event array (for use with perf_buffer API) */ #ifdef __BCC__ BPF_PERF_OUTPUT(events); #else struct { __uint(type, BPF_MAP_TYPE_PERF_EVENT_ARRAY); __uint(key_size, sizeof(u32)); __uint(value_size, sizeof(u32)); } events SEC(".maps"); #endif Accessing BPF maps from BPF code BCC employs pseudo-C++ syntax for working with maps, which gets rewritten to actual BPF helper calls under the cover. Typically, the following pattern: some_map.operation(some, args) Needs to be rewritten into the following one: bpf_map_operation_elem(&some_map, some, args); Here are some examples: #ifdef __BCC__ struct event *data = heap.lookup(&zero); #else struct event *data = bpf_map_lookup_elem(&heap, &zero); #endif #ifdef __BCC__ my_hash_map.update(&id, my_val); #else bpf_map_update_elem(&my_hash_map, &id, &my_val, 0 /* flags */); #endif #ifdef __BCC__ events.perf_submit(args, data, data_len); #else bpf_perf_event_output(args, &events, BPF_F_CURRENT_CPU, data, data_len); #endif BPF programs All functions representing BPF programs need to be marked with custom section name through use of SEC() macro,'''
