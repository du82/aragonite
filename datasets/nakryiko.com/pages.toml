["https://nakryiko.com/posts/bpf-core-reference-guide"]
title = "BPF CO-RE reference guide"
description = "A practical reference guide to using the full power of BPF CO-RE (Compile Once – Run Everywhere)."
full_description = '''BPF CO-RE reference guide Oct 24, 2021 Categories: BPF Tags: bpf linux Table of Contents The missing manual Reading kernel data bpf_core_read() bpf_core_read_str() BPF_CORE_READ() BPF_CORE_READ_INTO() BPF_CORE_READ_STR_INTO() BTF-enabled BPF program types with direct memory reads Reading bitfields and integers of varying sizes Sizing kernel types and fields Dealing with kernel changes and feature detection bpf_core_field_exists() bpf_core_type_exists() bpf_core_enum_value_exists() LINUX_KERNEL_VERSION Kconfig extern variables Relocatable enums Guarding potentially failing relocations Advanced topics Defining own CO-RE-relocatable type definitions Handling incompatible field and type changes Reading kernel data structures from user-space memory Capturing BTF type IDs Conclusion The missing manual BPF CO-RE (Compile Once – Run Everywhere) is a modern approach to writing portable BPF applications that can run on multiple kernel versions and configurations without modifications and runtime source code compilation on the target machine. This is in direct opposition to the more traditional approach provided by BCC framework in which BPF application source code compilation is delayed until runtime on the target host, carrying a heavy-weight compiler toolchain to achieve that. Please see the blog post that introduced the concept of BPF CO-RE and explained the problem statement for why all this is important and necessary for a lot of real-world BPF applications, as well as what makes it hard without kernel BTF. As BPF CO-RE matured as an approach, some practical guidance on all its features and how to use them in practice was sorely missing. In this blog post, I'll try to fill that gap and will go over all the different features that BPF CO-RE (and libbpf as a canonical implementation of it) provides. If you've written a BPF CO-RE application before, you most probably have used at least some of the described features. But some of them are still little known, unfortunately. Yet, those little known BPF CO-RE secrets is exactly what sometimes makes real-world BPF applications feasible, simple and easy to implement and support, avoiding complexities of on the host compilation or pre-compiling multiple variants (flavors) of the same BPF application, each targeted for a different kernel. This post is large, but it's also intended as a reference guide of sorts, so keeping it as one big piece felt better, compared to splitting it into chunks and posting gradually over a few weeks. It is divided into three sections, going from the most commonly used features towards more advanced and less frequently needed ones, hopefully following a natural progression of someone who just is getting started with writing BPF applications in the BPF CO-RE paradigm. Throughout this article I'll assume that you are using vmlinux.h which provides CO-RE-relocatable type definitions for the kernel and can be generated by the bpftool tool. See libbpf-bootstrap blog post if you are not familiar with vmlinux.h. I'll also go over how to use BPF CO-RE without vmlinux.h in the section on more advanced uses closer to the end of the post. As we go along I'll try to keep things pretty high-level without going into nitty-gritty implementation details, unless absolutely necessary. If you'd like to learn a bit more, I suggest taking a look at bpf_core_read.h header and ask question on BPF mailing list. Reading kernel data By far the most common BPF CO-RE operation is reading the value of a field from some kernel structure. libbpf provides a whole family of helpers to make reading a field easy and CO-RE-relocatable. CO-RE-relocatable means that regardless of the actual memory layout of a struct (which can change depending on actual kernel version and kernel configuration used), BPF program will be adjusted to read the field at the correct actual offset relative to the start of a struct. bpf_core_read() The most basic helper to read a field in a CO-RE-relocatable manner is bpf_core_read(dst, sz, src), which will read sz bytes from the field referenced by src into the memory pointed to by dst: struct task_struct *task = (void *)bpf_get_current_task(); struct task_struct *parent_task; int err; err = bpf_core_read(&parent_task, sizeof(void *), &task->parent); if (err) { /* handle error */ } /* parent_task contains the value of task->parent pointer */ bpf_core_read() is just like bpf_probe_read_kernel() BPF helper, except it records information about the field that should be relocated on the target kernel. I.e., if the parent field gets shifted to a different offset within struct task_struct due to some new field added in front of it, libbpf will automatically adjust the actual offset to the proper value. One important thing to keep in mind is that the size of the field is not automatically relocated, only its offset. So if the field you are reading is, say, a struct and its size changes, you can run into trouble. See "Sizing kernel types and fields" section on ways to deal with that. The general recommendation is to not read struct fields as a whole, if at all possible. Prefer reading just the primitive fields you are ultimately interested in. bpf_core_read_str() Just like there are bpf_probe_read_kernel() and bpf_probe_read_kernel_str() duo of BPF helpers, the former reading specified amount of bytes while the latter reads a variable-length zero-terminated C string, there is also a bpf_core_read_str() counterpart to the bpf_core_read(). It works just like bpf_probe_read_kernel_str(), except it records CO-RE relocation information of the source character array field, which contains a zero-terminated C string. So bpf_core_read_str() is a CO-RE-relocatable version of bpf_probe_read_kernel_str(). Note the important but subtle difference between character array field and character pointer field. In C they can be used interchangeably when reading the string value, because an array is automatically treated as a pointer by the compiler. This distinction is very important in the context of CO-RE, though. Let's look at the hypothetical kernel type we'd like to read: struct my_kernel_type { const char *name; char type[32]; }; name field points to where a string is stored, but type field actually is the memory that contains a string. If you need to read a string pointed to by name with CO-RE, the proper way to handle that would be to read the value of the pointer in CO-RE-relocatable way first, and then do a plain (non-CO-RE) bpf_probe_read_kernel_str() read (examples below ignore error handling for brevity): struct my_kernel_type *t = ...; const char *p; char str[32]; /* get string pointer, CO-RE-relocatable */ bpf_core_read(&p, sizeof(p), &t->name); /* read the string, non-CO-RE-relocatable, pointer is valid regardless */ bpf_probe_read_kernel_str(str, sizeof(str), p); The equivalent example if we need to read type string would be: struct my_kernel_type *t = ...; char str[32]; /* read string as CO-RE-relocatable */ bpf_core_read_str(str, sizeof(str), &t->type); Take a second to think why the first example wouldn't work with bpf_core_read_str() (hint: you'd be interpreting pointer value as a C string itself) and why the second one can't be done as a pointer read and then string read (hint: the string itself is part of a struct, so there is no dedicated pointer, it's located at an offset relative to where t pointer points to). It's subtle and thankfully doesn't come up often, but it's extremely confusing in practice if one doesn't recognize the difference. BPF_CORE_READ() bpf_core_read(), while allowing for a lot of control and careful error handling, is quite a burden to use directly, especially when reading fields that need to be accessed through longer chains of pointer dereferences. Let's take a look at an example of reading running process's main executable name. If you were writing a plain kernel code in C and wanted to do that, you'd have to do something like this: struct task_struct *t = ...; const char *name; name = t->mm->exe_file->path.dentry->d_name.name; /* now read string contents with bpf_probe_read_kernel_str() */ Note that sequence of pointer dereferences, mixed in with some sub-struct accesses (i.e., path.dentry and d_name.name). Doing something like that with bpf_core_read() quickly turns into a mess: struct task_struct *t = ...; struct mm_struct *mm; struct file *exe_file; struct dentry *dentry; const char *name; bpf_core_read(&mm, 8, &t->mm); bpf_core_read(&exe_file, 8, &mm->exe_file); bpf_core_read(&dentry, 8, &exe_file->path.dentry); bpf_core_read(&name, 8, &dentry->d_name.name); /* now read string contents with bpf_probe_read_kernel_str() */ Granted, this is a pretty extreme example and usually the pointer dereference chain won't be as long, but the point stands: it is painful to do using this approach. And all that despite completely ignoring error handling in the example above. To make such multi-step reads easier to write, libbpf provides the BPF_CORE_READ() macro. Let's take a look at how the above code is simplified with the use of BPF_CORE_READ(): struct task_struct *t = ...; const char *name; name = BPF_CORE_READ(t, mm, exe_file, path.dentry, d_name.name); /* now read string contents with bpf_probe_read_kernel_str() */ Compare a "native C" example vs the one with BPF_CORE_READ(): /* direct pointer dereference */ name = t->mm->exe_file->path.dentry->d_name.name; /* using BPF_CORE_READ() helper */ name = BPF_CORE_READ(t, mm, exe_file, path.dentry, d_name.name); Basically, each pointer dereference turns into a comma in the macro invocation. Each sub-struct access is kept as is. Pretty straightforward. You've probably noticed that BPF_CORE_READ() returns read value directly and doesn't propagate errors back. If any of the pointers is NULL or point to invalid memory, you'll get 0 (or NULL) back. If you do need error propagation and handling, though, you'd have to use low-level bpf_core_read() primitive and handle errors explicitly. This is usually not a problem or necessity in practice. BPF_CORE_READ_INTO() In some cases it's necessary or more convenient to read the result into a destination memory instead of directly returning it as BPF_CORE_READ() does. E.g., a common case where direct value return won't work is when you are reading a C array (e.g., IPv4 address from the socket struct), because C language doesn't allow returning arrays directly from expressions. For such cases, libbpf provides the BPF_CORE_READ_INTO() macro, which behaves similarly to BPF_CORE_READ() but reads the value of a final field into a destination memory. Converting last example to BPF_CORE_READ_INTO() we get: struct task_struct *t = ...; const char *name; int err; err = BPF_CORE_READ_INTO(&name, t, mm, binfmt, executable, path.dentry, d_name.name); if (err) { /* handle errors */ } /* now `name` contains the pointer to the string */ Note the additional &name argument into BPF_CORE_READ_INTO(), as well as the fact that it's possible to get error code of the last operation (i.e., reading d_name.name). Overall, BPF_CORE_READ() is much more convenient in practice and easier to read, though. BPF_CORE_READ_STR_INTO() For cases when the last field is a character array field (just like in hypothetical example above with name vs type), there is a BPF_CORE_READ_STR_INTO() macro, which by now you should have a good guess on how it works. If not, please revisit bpf_core_read_str() section. BTF-enabled BPF program types with direct memory reads Having talked about the BPF_CORE_READ() family of macros above, it's important to note that you don't always need to use them to do CO-RE-relocatable reads. Or, rather, you don't always have to "probe read" (i.e., use BPF helper to read) the memory. Sometimes you can just directly access kernel memory. Some BPF program types are "BTF-enabled", which means that BPF verifier in the kernel knows type information associated with input arguments passed into a BPF program. This allows BPF verifier to know which memory can be safely read directly from the kernel without bpf_core_read() or bpf_probe_read_kernel() invocations. Among such BTF-enabled BPF program types are: BTF-enabled raw tracepoint (SEC("tp_btf/...") in libbpf lingo); fentry/fexit/fmod_ret BPF programs; BPF LSM programs; probably some more but I'm too lazy to go and check. With such programs, if they are getting a pointer to some kernel type (e.g., struct task_struct *), BPF program code can do direct memory dereference and even follow the pointers. So, for the elaborate example we've been using above to demonstrate BPF_CORE_READ() usage, when using, say, fentry BPF program, all you'd have to do would be: struct task_struct *t = ...; const char *name; name = t->mm->binfmt->executable->path.dentry->d_name.name; And yes, it is exactly identical to the "native C" hypothetical example. Keep in mind, though, that to get the contents of the string itself, you'd still need to use bpf_probe_read_kernel_str(). Such direct memory access is fast, convenient and simple, and you should definitely use that when possible. Unfortunately, there are still a lot of real-world cases when you have to rely on "probe reading" explicitly, so BPF_CORE_READ() is going to be your friend for a foreseeable future, so definitely familiarize yourself with it. Reading bitfields and integers of varying sizes Reading bitfields from BPF has always been a challenge. BPF application developers have to go to great lengths and write pretty unmaintainable and painful code to be able to extract bitfield values from kernel types. Take struct tcp_sock as an example. It has lots of useful information encoded as bitfields. Even when using BCC with its source code compilation approach, it's a major hassle and maintenance burden to extract those bitfields. Luckily, libbpf provides two easy to use macros for reading bitfields in CO-RE-relocatable way: BPF_CORE_READ_BITFIELD() and BPF_CORE_READ_BITFIELD_PROBED(). _PROBED variant has to be used when the data to be read has to be "probe read", just like with BPF_CORE_READ(). BPF_CORE_READ_BITFIELD() should be used only when direct memory access is available (e.g., from fentry/ BPF programs, see "BTF-enabled BPF program types with direct memory reads" section above). Both macros return the value of a bitfield as an u64 integer. Here's an example of reading one of the bitfields from the struct tcp_sock: static u64 sk_get_syn_data(const struct tcp_sock* tp) { /* extract tp->syn_data bitfield value */ return BPF_CORE_READ_BITFIELD_PROBED(tp, syn_data); } As simple as that. With BCC, achieving the same would result in something like this (it is left as an exercise to the reader on why this works and when it would break): static u64 sk_get_syn_data(const struct tcp_sock* tp) { u8 s; /* get byte before tlp_high_seq */ bpf_probe_read(&s, 1, &(tp->tlp_high_seq) - 1); /* syn_data is the third bit of that byte in little-endian */ return (s >> 2) & 0x1; } Horror to write, read, and maintain as struct tc'''
