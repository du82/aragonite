["https://nakryiko.com/posts/libbpf-bootstrap"]
title = "Building BPF applications with libbpf-bootstrap"
description = """
Get started with your own BPF application quickly and painlessly with
libbpf-bootstrap scaffolding, which takes care of all the mundane setup steps
and lets you dive right into BPF fun and minimize the necessary boilerplate.
We'll take a look at what libbpf-bootstrap provides and how everything is tied
together."""
full_description = '''Building BPF applications with libbpf-bootstrap Nov 29, 2020 Categories: BPF Tags: bpf Table of Contents Why libbpf-bootstrap? Prerequisites Libbpf-bootstrap overview Minimal app The BPF side The user-space side Makefile Bootstrap app Includes: vmlinux.h, libbpf and app headers BPF maps BPF ring buffer BPF CO-RE Conclusion Get started with your own BPF application quickly and painlessly with libbpf-bootstrap scaffolding, which takes care of all the mundane setup steps and lets you dive right into BPF fun and minimize the necessary boilerplate. We'll take a look at what libbpf-bootstrap provides and how everything is tied together. Why libbpf-bootstrap? BPF is an amazing kernel technology, which allows anyone to take a pick under the cover of how kernel functions without intense kernel development experience and without spending tons of time to set things up for the kernel development. BPF also eliminates the risk of crashing your OS while doing that. Once you get up to speed with BPF, it's lots of fun and power in your hands. But getting started with BPF can still be intimidating in a large part because setting up a build workflow for even a simple "Hello, World"-like BPF application requires a bunch of steps that could be frustrating and intimidating for the new BPF developer. It's not really all that complicated, but knowing the necessary steps is an (unnecessarily) hard part which probably demotivates a lot of people from even trying, despite all the interest in and promise of BPF. libbpf-bootstrap is a scaffolding playground setting up as much things as possible for beginner users to let them dive straight into writing BPF programs and tinkering with them without unnecessary frustrations of initial setup. It takes into account best practices developed in BPF community over last few years and provides a modern and convenient workflow with, arguably, best BPF user experience to date. libbpf-bootstrap is relying on libbpf and uses a simple Makefile. For users needed more advanced set ups, it should be a good starting point. At the very least, if Makefile can't be used directly, it's simple enough to just transfer the logic to whichever build system needs to be used. libbpf-bootstrap currently has two demo BPF applications available: minimal and bootstrap. minimal is exactly that – the most minimal BPF application that compiles, loads, and runs a simple BPF equivalent of printf("Hello, World!"). Being the most minimal one, it also doesn't impose many requirements on Linux kernel recentness and should run fine on quite old kernel versions. minimal is great for quick experimentation and trying things out locally, but it's not set up to reflect the setup of a production-intended BPF-based application deployable across a variety of kernels. bootstrap is such an example. bootstrap demo shows off a real-world approach to building out minimal, but fully functional and portable BPF application. To that end, it does rely on BPF CO-RE and kernel BTF support, so make sure that your Linux kernel is built with CONFIG_DEBUG_INFO_BTF=y Kconfig. See libbpf README for the list of Linux distributions that have everything already setup for you. If you'd like to minimize the hassle of building custom kernel, just stick with the recent enough versions of any of the major Linux distros. Additionally, bootstrap demonstrates BPF global variables usage (Linux 5.5+) and BPF ring buffer use (Linux 5.8+). Neither of those features are mandatory to build useful BPF application, but they bring huge usability improvements and are the way that modern BPF application are built, so I've added example of using them into a basic bootstrap example. Prerequisites BPF is a very dynamic technology that is constantly being developed and evolved. This means that new features and capabilities are added all the time, so depending on which of them you need, you might need newer kernel versions. But BPF community takes backwards compatibility extremely seriously, which means that old Linux kernels will still run BPF applications just fine, provided you don't need the very latest feature sets. So the simpler and more conservative your BPF application logic and feature set is, the higher the chances are that you'll be able to run your BPF application on old kernels. Having said that, BPF user experience gets better all the time and BPF in more recent kernel versions provide profound improvements in BPF usability, so if you are just getting started and don't have a strict requirements to support outdated Linux kernel versions, make your life less painful and use the latest kernel version you can get your hands on. BPF program code is normally written in the C language with some code organization conventions added to let libbpf make sense of BPF code structure and load properly hand everything into the kernel. Clang is the compiler used for BPF code compilation and it's generally recommended to use the latest Clang you can. Still, Clang 10 or newer should work fine for most BPF features, but some more advanced BPF CO-RE features might require Clang 11 or even 12 (e.g., for some of the more recent and advanced CO-RE relocation built-ins). libbpf-bootstrap bundles with it libbpf (as a Git submodule) and bpftool (for x86-64 architecture only) to avoid dependency on any specific (and potentially outdated) versions available in your Linux distribution. Your system should also have zlib (libz-dev or zlib-devel package) and libelf (libelf-dev or elfutils-libelf-devel package) installed. Those are dependencies of libbpf necessary to compile and run it properly. This is not a primer on BPF technology itself, so some familiarity with basic concepts like BPF program, BPF map, BPF hooks (attach points) are assumed. If you need a refresher on BPF fundamentals, these resources should be a good starting point. In the rest of this post I'll walk you through the structure of libbpf-bootstrap, its Makefile and both minimal and bootstrap examples. We'll look at libbpf conventions and structuring BPF C code for use with libbpf as a BPF program loader, as well as how to interact with your BPF programs from the user-space using libbpf APIs. Libbpf-bootstrap overview Here's the contents of the libbpf-bootstrap repository: $ tree . ├── libbpf │ ├── ... │ ... ├── LICENSE ├── README.md ├── src │ ├── bootstrap.bpf.c │ ├── bootstrap.c │ ├── bootstrap.h │ ├── Makefile │ ├── minimal.bpf.c │ ├── minimal.c │ ├── vmlinux_508.h │ └── vmlinux.h -> vmlinux_508.h └── tools ├── bpftool └── gen_vmlinux_h.sh 16 directories, 85 files libbpf-bootstrap bundles libbpf as a submodule in libbpf/ sub-directory to avoid depending on system-wide libbpf availability and version. tools/ contains bpftool binary, which is used to build BPF skeletons of your BPF code. Similarly to libbpf, it's bundled to avoid depending on system-wide bpftool availability and its version being sufficiently up-to-date. Additionally, bpftool can be used to generate your own vmlinux.h header with all the Linux kernel type definitions. Chances are you won't need to do that because libbpf-bootstrap already provides pre-generated vmlinux.h in src/ sub-directory. It is based on default kernel config for Linux 5.8 with a bunch of extra BPF-related functionality enabled. This means it should have lots of commonly needed kernel types and constants already. Due to BPF CO-RE, vmlinux.h doesn't have to match your kernel configuration and version exactly. But if nevertheless you do need to generate your custom vmlinux.h, feel free to check tools/gen_vmlinux_h.sh script to see how it can be done. Beyond self-explanatory LICENSE and README.md the rest of libbpf-bootstrap is contained in a src/ sub-directory. Makefile defines the necessary build rules to compile all the supplied (and your custom ones) BPF apps. It follows a simple file naming convention: <app>.bpf.c files are the BPF C code that contain the logic which is to be executed in the kernel context; <app>.c is the user-space C code, which loads BPF code and interacts with it throughout the lifetime of the application; optional <app>.h is a header file with the common type definitions and is shared by both BPF and user-space code of the application. So, minimal.c and minimal.bpf.c form the minimal BPF demo app. And bootstrap.c, bootstrap.bpf.c, and bootstrap.h are the bootstrap BPF app. Simple. Minimal app minimal is a good example to start with. Consider it a minimalistic playground for trying BPF things out. It doesn't use BPF CO-RE, so you can use older kernels and just include your system kernel headers for kernel type definitions. It's not the best approach for building production-ready applications and tools, but is good enough for local experimentation. The BPF side Here's the BPF-side code (minimal.bpf.c) in its entirety: // SPDX-License-Identifier: GPL-2.0 OR BSD-3-Clause /* Copyright (c) 2020 Facebook */ #include <linux/bpf.h> #include <bpf/bpf_helpers.h> char LICENSE[] SEC("license") = "Dual BSD/GPL"; int my_pid = 0; SEC("tp/syscalls/sys_enter_write") int handle_tp(void *ctx) { int pid = bpf_get_current_pid_tgid() >> 32; if (pid != my_pid) return 0; bpf_printk("BPF triggered from PID %d.\n", pid); return 0; } #include <linux/bpf.h> includes some basic BPF-related types and constants necessary for using the kernel-side BPF APIs (e.g., BPF helper function flags). This header is needed for the bpf_helpers.h header, included next. bpf_helpers.h is provided by libbpf and contains most-often used macros, constants, and BPF helper definitions, which are used by virtually every existing BPF application. bpf_get_current_pid_tgid() above is an example of such BPF helper. LICENSE variable defines the license of your BPF code. Specifying the license is mandatory and is enforced by the kernel. Some BPF functionality is unavailable to non-GPL-compatible code. Note the special SEC("license") annotation. SEC() (provided by bpf_helpers.h) puts variables and functions into the specified sections. SEC("license"), along some other section names, is the convention dictated by libbpf, so make sure you stick to it. Next, we see the use of an exciting BPF feature: global variables. int my_pid = 0; does exactly what you'd expect: it defines a global variable which BPF code can read and update just like any user-space C code would do with a global variable. It's extremely convenient and also performant to use BPF global variables for maintaining the state of your BPF program. Additionally, such global variables can be read and written from the user-space side. This feature is available starting from Linux 5.5 version. It is frequently used for things like configuring BPF application with extra settings, low-overhead stats, etc. It can also be used to pass data back-and-forth between in-kernel BPF code and user-space control code. SEC("tp/syscalls/sys_enter_write") int handle_tp(void *ctx) { ... } defines the BPF program which will be loaded into the kernel. It's is represented as a normal C function in a specially-named section (using SEC() macro). Section name defines what type of BPF program libbpf should create and how/where it could be attached in the kernel. In this case, we define a tracepoint BPF program, which will be called each time a write() syscall is invoked from any user-space application. There could be many BPF programs defined within the same BPF C code file. They could have different types (i.e., SEC() annotations). E.g., you can have few different BPF programs, each for a different tracepoint or some other kernel event (e.g., network packet being processed, etc). You can also define multiple BPF programs with the same SEC() attribute: libbpf will handle that just fine. All BPF programs defined within the same BPF C code file share all the global state (like my_pid variable, but also any BPF map, if used). This is frequently utilized to coordinate few collaborating BPF programs. Let's now look at what handle_tp BPF program is doing: int pid = bpf_get_current_pid_tgid() >> 32; if (pid != my_pid) return 0; This part gets the PID (or "TGID" in internal kernel terminology) encoded in upper 32 bits of bpf_get_current_pid_tgid()'s return value. It then checks if the process triggering write() syscall is our minimal process. This is quite important on a busy system, because most probably lots of unrelated processes are going to issue write()s, making it really hard to experiment with your own BPF code on your own terms. my_pid global variable is going to be initialized with the actual PID of the minimal process from the user-space code below. bpf_printk("BPF triggered from PID %d.\n", pid); This is a BPF equivalent of printf("Hello, world!\n")! It emits formatted string to the special file at /sys/kernel/debug/tracing/trace_pipe, which you can cat to see its contents from the console (make sure you use sudo or run under root): $ sudo cat /sys/kernel/debug/tracing/trace_pipe <...>-3840345 [010] d... 3220701.101143: bpf_trace_printk: BPF triggered from PID 3840345. <...>-3840345 [010] d... 3220702.101265: bpf_trace_printk: BPF triggered from PID 3840345. bpf_printk() helper and trace_pipe file is not intended to be used in production, but it's indispensable for debugging BPF code and getting insights into what your BPF program is doing. As there is no BPF debugger yet, bpf_printk() is usually the fastest and most convenient way to debug a problem in a BPF code. That's it for the BPF-side of minimal app. Feel free to add any extra code to the body of handle_tp() BPF program and extend it according to your needs. The user-space side Let's now look at how things are tied together from user-space (minimal.c), skipping some pretty obvious parts (please check the full sources anyways). #include "minimal.skel.h" This includes a BPF skeleton of the BPF code in minimal.bpf.c. It is auto-generated by bpftool in one of Makefile steps and reflects the high-level structure of minimal.bpf.c. It also simplifies the BPF code deployment logistics by embedding contents of the compiled BPF object code inside the header file, which gets included from the user-space code. No extra files to deploy along your application binary, just include the header and forget about it. BPF skeleton is purely a libbpf construct, kernel knows nothing about it. But it is a huge quality of life improvement for BPF development process, so consider familiarizing yourself with it. See the blog post for some more details about BPF skeleton. libbpf-bootstrap BPF skeletons are generated into src/.output/<app>.skel.h after successful make invocation. To get a better intuition about it, here's a high-level overview of the skeleton for minimal.bpf.c: /* SPDX-License-Identifier: (LGPL-2.1 OR BSD-2-Clause) */ /* THIS FILE IS AUTOGENERATED! */ #ifndef __MINIMAL_BPF_SKEL_H__ #define __MINIMAL_BPF_SKEL_H__ #include <stdlib.h> #include <bpf/libbpf.h> struct minimal_bpf { struct bpf_object_skeleton *skeleton; struct bpf_object *obj; struct { struct'''
