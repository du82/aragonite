title = "Naming Things | A book about the hardest problem in software engineering"
description = "Naming is one of the most frequently-used, visible, and timeless skills in software engineering, but it’s poorly understood and poorly executed. Write understandable software by learning how to name things well."
full_description = "Naming is one of the most difficult and enduring challenges in software engineering, but few of us do it well. This practical and comprehensive book provides a set of principles, rules, and application guidelines for efficiently choosing good names in your code. These skills can be used throughout your career, and they’re useful for every programming language, technical domain, and experience level. The book incorporates real-world examples to illustrate how to choose good names and avoid bad names."
