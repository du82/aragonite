["https://nano-editor.org/dist/latest/nano.html"]
title = "The GNU nano text editor"
description = "The complete manual for the GNU nano text editor."
full_description = "GNU nano is a small and friendly text editor. Besides basic text editing, nano offers features like undo/redo, syntax coloring, interactive search-and-replace, auto-indentation, line numbers, word completion, file locking, backup files, and internationalization support. The original goal for nano was to be a complete bug-for-bug emulation of Pico. But currently the goal is to be as compatible as is reasonable while offering a superset of Pico’s functionality. See Pico Compatibility for more details on how nano and Pico differ. Since version 4.0, nano no longer hard-wraps overlong lines by default. It also by default uses linewise scrolling, and by default includes the line below the title bar in the editing area. In case you want the old, Pico behavior back, you can use the following options: --breaklonglines, --jumpyscrolling, and --emptyline (or -bje). Since version 8.0, ^F starts a forward search, ^B starts a backward search, M-F searches the next occurrence forward, and M-B searches the next occurrence backward. If you want those keystrokes to do what they did before version 8.0, see the rebindings in the sample nanorc file. But it is also possible to specify one or more options (see Command-line Options), and to edit several files in a row. The cursor can be put on a specific line of a file by adding the line number with a plus sign before the filename, and even in a specific column by adding it with a comma. Negative numbers count from the end of the file or line. The cursor can be put on the first or last occurrence of a specific string by specifying that string after +/ or +? before the filename. The string can be made case sensitive and/or caused to be interpreted as a regular expression by inserting a c and/or r after the plus sign. These search modes can be explicitly disabled by using the uppercase variant of those letters: C and/or R. When the string contains spaces, it needs to be enclosed in quotes. A more complete command synopsis thus is: Normally, however, you set your preferred options in a nanorc file (see Nanorc Files). And when using set positionlog (making nano remember the cursor position when you close a file), you will rarely need to specify a line number."
