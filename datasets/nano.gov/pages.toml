["https://www.nano.gov/about-nni/nnco"]
title = "National Nanotechnology Coordination Office (NNCO) | National Nanotechnology Initiative"
description = "Enter the characters shown in the image."
full_description = "The National Nanotechnology Coordination Office (NNCO) conducts public engagement on behalf of the NNI and provides technical and administrative support to the NSET Subcommittee and the interagency nanotechnology community. NNCO activities include efforts to convene the nanotechnology community, share information on available resources and opportunities, engage with the public, excite students about nanotechnology, and share highlights and information about nanotechnology and the NNI. Furthermore, the NNCO has a devoted Industry and Regional Liaison to serve as a point of contact for and to actively monitor and support the nanotechnology business community. NNCO leadership Dr. Branden Brough is the Director of the National Nanotechnology Coordination Office (NNCO) and the Assistant Director for Nanotechnology at the White House Office of Science and Technology Policy (OSTP). Before joining NNCO and OSTP, Dr. Brough served as Deputy Director of the Molecular Foundry, a DOE-funded nanoscale science research center at Lawrence Berkeley National Laboratory. There, Dr. Brough was responsible for helping guide scientific planning, while also managing the organization’s operations. Branden previously worked at the National Institute of Arthritis and Musculoskeletal and Skin Diseases, which is part of the National Institutes of Health, where he led strategic policy and planning activities, as well as Congressional and public outreach efforts. Branden received his Ph.D. in Mechanical Engineering from the University of California, Los Angeles (UCLA) before becoming a AAAS Science and Technology Policy Fellow in 2007. Dr. Quinn Spadola is the Deputy Director of the National Nanotechnology Coordination Office (NNCO). She has been a member of the National Nanotechnology Initiative community since her graduate studies. Prior to returning to the NNCO, Dr. Spadola was Associate Director of Education for the National Nanotechnology Coordinated Infrastructure (NNCI), a network of open nanotechnology laboratory user facilities supported by the National Science Foundation, and the Director of Education and Outreach for the Southeastern Nanotechnology Infrastructure Corridor NNCI site at the Georgia Institute of Technology. Dr. Spadola began her time at the NNCO as a AAAS Science and Technology Policy Fellow in 2014. After her fellowship, she served as Education and Outreach Coordinator and Technical Advisor to the Director until 2018. She received her Ph.D. in physics from Arizona State University and her MFA in Science and Natural History Filmmaking from Montana State University. NNCO Contact Information: - Phone: 202-517-1050 - Email: info@nnco.nano.gov - Mailing address: National Nanotechnology Coordination Office 2415 Eisenhower Avenue Alexandria, VA 22314 Sign up for email alerts and updates by contacting: info@nnco.nano.gov."
year_published = 2025
