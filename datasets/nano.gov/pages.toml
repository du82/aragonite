full_description = "The National Nanotechnology Initiative (NNI) is a U.S. Government research and development (R&D) initiative. Over thirty Federal departments, independent agencies, and commissions work together toward the shared vision of a future in which the ability to understand and control matter at the nanoscale leads to ongoing revolutions in technology and industry that benefit society. The NNI enhances interagency coordination of nanotechnology R&D, supports a shared infrastructure, enables leveraging of resources while avoiding duplication, and establishes shared goals, priorities, and strategies that complement agency-specific missions and activities."
