["https://www.nano.gov/nnilogoandnncoseal"]
title = "About NNI Logo and NNCO Seal | National Nanotechnology Initiative"
description = "Enter the characters shown in the image."
full_description = "Symbolism of the National Nanotechnology Initiative Logo The NNI serves as a nexus for the nanotechnology community, convening stakeholders across sectors, scientific disciplines, and application areas to advance nanotechnology R&D for the benefit of the American people. The points converging in the center of the logo conceptually represent the tools that enable nanotechnology research and development, and symbolize the power of the NNI to bring together diverse communities in pursuit of shared goals and priorities. Description of the Seal of the National Nanotechnology Coordination Office BLAZON Shield. Per chevron Gules and Azure, a chevron Argent edged Gris, in chief twenty billets of the third and in base issuant from the partition a demi-spark Or, all within a diminished bordure of the last. Crest. Upon a wreath Argent and Gules, issuant from an olive wreath Proper, a voided hexagon Or, surrounding a constellation of thirteen five-pointed mullets Argent. Supporter. The American bald eagle rising, wings elevated and displayed Proper, grasping a tripartite scroll Argent, doubled Gules, inscribed “CONVENING, CONVERGING, CONNECTING” Azure. SYMBOLISM Shield. The red and blue parts of the shield denote collaboration on the national level. The overall shape of the chevron alludes to the focus of a microscope and symbolizes advancements in science, engineering and technology conducted at the nanoscale. The twenty billets symbolize the various elements, disciplines, ideas and Federal agencies that converge and are coordinated by the National Nanotechnology Coordination Office. The gold spark represents the inspiration of future generations in the field of nanoscience and technology. The gold border illuminates the wisdom, knowledge and principles of those working in the emerging field of nanotechnology. Crest. The olive branch and the constellation of thirteen stars are from the Great Seal of the United States. The Great Seal is used to identify the Executive Office of the President and its various offices, including the Office of Science and Technology which is the parent organization of the National Nanotechnology Coordination Office. The hexagon alludes to the stable hexagonal structures present in various nanomaterials. Supporter and Motto. The American bald eagle is a symbol of the United States of America and has long been associated with the executive office. The motto, “CONVENING, CONVERGING, CONNECTING” describes the functions of the National Nanotechnology Coordination Office. Seal. The coat of arms as blazoned in full color on a circular flag blue background, edged gold, enclosed by a white designation band edged on the outside in gold, inscribed “NATIONAL NANOTECHNOLOGY COORDINATION OFFICE,” a polestar starting and stopping the inscription at base, all in flag blue."
