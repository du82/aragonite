full_description = "Date Published October 08, 2021 Description This update of the NNI Strategic Plan satisfies the requirement of the 21st Century Nanotechnology Research and Development Act of 2003 and replaces the prior NNI Strategic Plan released in 2016. This document presents goals and objectives to guide NNI participating agencies and the nanotechnology community over the next five years. The plan provides the framework under which individual agencies conduct their own mission-specific nanotechnology programs, coordinate these activities with those of other NNI agencies, and collaborate. From Oct. 13, 2020, to Nov. 9, 2020, the National Nanotechnology Coordination Office (NNCO), on behalf of the Nanoscale Science, Engineering, and Technology (NSET) Subcommittee of the National Science and Technology Council (NSTC), sought public input, through a Request for Information (RFI) (available here), to inform the development of the 2021 National Nanotechnology Initiative (NNI) Strategic Plan. Click here to view the RFI responses. File Downloads NNI 2021 Strategic Plan"
