["https://www.nano.gov/ehsstrategy2024update"]
title = "National Nanotechnology Initiative Environmental, Health, and Safety Research Strategy: 2024 Update | National Nanotechnology Initiative"
description = "Enter the characters shown in the image."
full_description = "Date Published December 18, 2024 Description The Nanotechnology Environmental and Health Implication Working Group (NEHI), of the Nanoscale Science and Engineering Subcommittee (NSET), has published the National Nanotechnology Initiative Environmental, Health, and Safety Research Strategy: 2024 Update.The 2024 update lays out a comprehensive, integrated approach that builds on the 2011 NNI Environmental, Health, and Safety (EHS) Research Strategy. The challenges and opportunities outlined in this document build on the advances of two decades of nanoEHS research. The 2024 update was prepared by NEHI, on behalf of NNI agencies, in a process that gathered extensive input from the federal nanotechnology community, as well as from academic institutions, non-governmental organizations, and the public. NEHI recognizes that nanotechnology has grown from an emerging field to one that permeates much of engineering and the sciences and will apply the lessons of two decades of nanoEHS research to inform new areas of scientific progress. The update reflects current opportunities to enable responsible nanotechnology innovation to flourish, benefiting human health, the environment, the economy, and society.The 2024 update first assesses the progress and current research needs in the research areas, including the ethical, legal, and societal implications (ELSI) outlined in the 2011 strategy. The 2024 document then addresses unmet needs and emerging challenges through a framework of cross-cutting themes. The 2024 update concludes with strategic actions that require coordinated efforts to address unmet and new needs in nanoEHS.For further information contact Rhema Bjorkland File Downloads EHSResearchStrategy2024Update.pdf"
