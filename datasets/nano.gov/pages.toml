["https://www.nano.gov/anniversarysymposiumspeakersmoderators"]
title = "Symposium Speakers and Moderators | National Nanotechnology Initiative"
description = "Enter the characters shown in the image."
full_description = "Maxx Arguilla Jennifer Dionne Matthew Hull David Rampulla Mikkel Thomas Ilke Arslan Doyle Edwards Cheryl Kerfeld Mihail Roco Treye Thomas Ali Beskok Bob Ehrmann Kei Koizumi Reginald Rogers, Jr. Jameson Wetmore Branden Brough Thomas Epps III Neal Lane Kathleen Rubins Denis Wirtz Ambika Bumb David Hatrick Antti Mäkinen Andrew Schwartz Ron Wyden James D. Burgess Sharon Hays Chad Mirkin Mia Siochi Miguel José Yacamán Theresa Dankovich Evelyn Hu Arati Prabhakar Quinn Spadola Hannah Zierden Keynotes Arati Prabhakar: Dr. Prabhakar is the current Assistant to the President for Science and Technology and Director of the White House Office of Science and Technology Policy. In this capacity, Prabhakar is the President’s Chief Advisor for Science and Technology, a member of the President’s Cabinet, and co-chair of the President’s Council of Advisors on Science and Technology (PCAST). An engineer and applied physicist with broad management and leadership experience, Prabhakar has led two different federal R&D agencies and worked with startups, large companies, universities, government labs, and nonprofits across a wide variety of sectors to create new solutions for critical challenges. She served as director of DARPA, the Defense Advanced Research Projects Agency, from 2012 to 2017. In 1993, she was confirmed by the U.S. Senate as director of the National Institute of Standards and Technology (NIST), becoming the first woman to lead the agency. Between these federal leadership roles, Prabhakar spent 15 years in Silicon Valley as a company executive and as a venture capitalist. In 2019, she founded Actuate, a nonprofit organization to develop new approaches to innovation for society’s essential challenges. https://www.whitehouse.gov/ostp/directors-office/ Chad Mirkin: Dr. Mirkin is the Director of the International Institute for Nanotechnology and the George B. Rathmann Professor of Chemistry, Professor of Chemical and Biological Engineering, Professor of Biomedical Engineering, Professor of Materials Science & Engineering, and Professor of Medicine at Northwestern University. He is a chemist and a nanoscience expert, who has discovered and developed spherical nucleic acids (SNAs) and SNA-based biodetection and therapeutic schemes. Moreover, he has been the inventor and chief developer of Dip Pen Nanolithography and cantilever-free scanning probe lithography methods. National geographic selected his innovation of such methods as one of the top 100 scientific discoveries in the world. He is the founder of multiple companies, including TERA-print, Azul 3D, MattIQ, and Flashpoint Therapeutics. Dr. Mirkin served as a Member of the President’s Council of Advisors on Science & Technology (PCAST) during both terms of the Obama Administration, and has been elected to all three US National Academies (Medicine, Science, and Engineering). He is the founding editor of the nanotechnology journal Small and co-chaired the 2010 WTEC study on “Nanotechnology Research Directions for Societal Needs in 2020.” https://mirkin-group.northwestern.edu/ Kathleen Rubins: Dr. Rubins was selected in July 2009 as one of 9 members of the 20th NASA astronaut class. She completed her first spaceflight on Expedition 48/49, during which the international crew conducted or participated in more than 275 different scientific experiments including research in molecular and cellular biology, human physiology, fluid and combustion physics, Earth and space science and technology development. Dr. Rubins was the first person to sequence DNA in space, eventually sequencing over 2 billion base pairs of DNA, using a hand-held, USB-powered DNA sequencer called the MinION made by Oxford Nanopore Technologies . DNA sequencing could allow astronauts to diagnose an illness in space or identify microbes growing at the space station. Most recently, Dr. Rubins served aboard the International Space Station as flight engineer for Expedition 63/64. Across her two flights, she spent a total of 300 days in space, the fourth most days in space by a U.S. female astronaut. She holds a Bachelor of Science in Molecular Biology from the University of California and a Ph.D. in Cancer Biology from Stanford University Medical School Biochemistry Department and Microbiology and Immunology Department. She was named to Popular Science’s Brilliant Ten in 2009 and has served as an Innovation Officer in the U.S. Army Reserve since 2021. https://www.nasa.gov/astronauts/biographies/kathleen-rubins/biography Keynote Panel: The Future of Nanotechnology Maxx Arguilla: Dr. Arguilla is an Assistant Professor of chemistry at University of California, Irvine and an affiliate faculty of the Chemical and Biomolecular Engineering Department and the Eddleman Quantum Institute. He leads an interdisciplinary experimental chemistry laboratory that works at the interfaces of solid state chemistry, materials chemistry and physics, and nanoscience. His research program aims to develop synthetic and characterization tools to harness the emergent physical properties of atomically precise low-dimensional solids that are poised as building blocks for next-generation quantum, spintronic, optoelectronic, and sensing technologies approaching the sub-nanometer regime. In 2023, he received the National Science Foundation CAREER Award and was named as Chemical and Engineering News “Talented 12” for his work on atom-thin wires and sheets with exciting electronic and optical properties. https://www.maxx-lab.com/ Jennifer Dionne: Dr. Dionne is Professor of Materials Science and Engineering and of Radiology at Stanford University. She also serves as Deputy Director of Q-NEXT, a DOE National Quantum Research Center. Her interdisciplinary research group investigates new ways to control light-matter interactions and the development of new nanophotonic materials, methods, and devices, especially in the areas of health, clean energy, and sustainability. She is a 2020 Chan Zuckerberg Biohub Investigator and received the 2019 Alan T. Waterman Award and the 2014 Presidential Early Career Award for Scientists and Engineers. She is also co-founder of Pumpkinseed, which creates new biomedical insights via de-novo protein sequencing. http://dionne.stanford.edu/ Thomas Epps III: Dr. Epps is the Allen and Myr Ferguson Distinguished Professor of Chemical and Biomolecular Engineering at the University of Delaware, also serving as the Director of the Center for Research in Soft Matter and Polymers and the Center for Hybrid, Active, and Responsive Materials. The primary focus of the Epps laboratory lies in designing, building, and characterizing new polymeric materials exhibiting molecular level self-assembly. Several nano-applications for block copolymers and polymer blends include: battery and fuel cell membranes, organic photovoltaics, analytical separations membranes, nanoscale containers and scaffolds for targeted drug delivery, precursors to electronic arrays, and surface responsive materials. Dr. Epps is also Co-founder and Chief Scientific Officer of Lignolix, Inc., which focuses on developing renewable and high-performance specialty chemicals upcycled from plant lignin waste. https://sites.udel.edu/eppsgroup/ Ali Beskok [moderator]: Dr. Beskok is the Associate Dean for Research Innovation and Industry Partnerships and the George R. Brown Chair of Mechanical Engineering at Southern Methodist University. His research focuses on theory, numerical simulations, and experiments on biophysics, micro- and nano-scale transport phenomena, multiphase flow heat and mass transfer, electrokinetic transport, and dielectric spectroscopy-based detection and characterization techniques. He is the co-author of the first book on simulations of micro- and nano-flows. https://www.smu.edu/Lyle/Departments/ME/People/Faculty/Ali-Beskok Policy Perspectives Neal Lane: Dr. Lane is the senior fellow in science and technology policy at the Baker Institute, and Professor of Physics and Astronomy Emeritus at Rice University. From 1998-2001, Dr. Lane served in the federal government as Assistant to the President for Science and Technology and Director of the White House Office of Science and Technology Policy (OSTP). During this time, Dr. Lane submitted to President Bill Clinton PCAST’s strong endorsement of the National Nanotechnology Initiative (NNI), paving the way for its eventual adoption into law during the Bush administration. Previously, Dr. Lane served as director of the National Science Foundation (NSF). He has received the National Academy of Sciences Public Welfare Medal, the American Institute of Physics K.T. Compton Medal, and in 2013, the National Science Board presented Lane with the Vannevar Bush Award, which recognizes exceptional, lifelong leaders who have made substantial contributions to the nation through public service activities in science, technology and policy. https://profiles.rice.edu/faculty/neal-f-lane Ron Wyden: U.S. Senator Wyden has represented the state of Oregon since 1996. He chairs the Senate Finance Committee and also serves on the Energy and Natural Resources, Budget, Select Committee on Intelligence, and Joint Committee on Taxation. Senator Wyden has been a consistent advocate for nanotechnology research and development, authoring the “21st Century Nanotechnology Research and Development Act (S. 2945) in 2002-03 that enabled the National Nanotechnology Initiative (NNI), offering leadership to the Congressional Nanotechnology Caucus, and proposing a bi-partisan prize competition to spur nanotech innovation. https://www.wyden.senate.gov/ Sharon Hays: Dr. Hays is Chief Innovation Officer at Astrion, a company committed to innovation and customer progress in the U.S. Government’s civilian, defense, and space communities. From 2002-2009, she served as Associate Director and Deputy Director for Science in the White House Office of Science and Technology Policy. Appointed by President George W. Bush, she helped develop and coordinate U.S. government policies on a wide range of science and engineering topics,including strategic plans and budget supplements associated with the National Nanotechnology Initiative (NNI). https://astrion.us/our-team/#team-4 Kei Koizumi: Kei Koizumi is Principal Deputy Director for Policy in the White House Office of Science and Technology Policy (OSTP) and Acting Executive Director of the National Science and Technology Council (NSTC). He also served as both the Chief of Staff and Acting Director in the first year of the Biden Administration. Previously, he served as Senior Advisor in Science Policy at AAAS and was Assistant Director for Federal Research and Development at OSTP. He is a leading authority on the federal budget, federal support for research and development, science and technology policy, and R&D funding data. He has worked to formulate, implement, and coordinate Federal R&D policy, including the National Nanotechnology Initiative (NNI), and especially through the NSTC . He is a Fellow of the American Association for the Advancement of Science. https://www.whitehouse.gov/ostp/ Fundamental Research Cheryl Kerfeld: Dr. Kerfeld is the Hannah Distinguished Professor of Structural Bioengineering in the Department of Biochemistry and Molecular Biology at Michigan State University (MSU). She also holds appointments in the Molecular Biophysics and Integrated Bioimaging Division of Lawrence Berkeley National Laboratory, the Department of Plant and Microbial Biology at UC Berkeley and the Berkeley Synthetic Biology Institute. The Kerfeld group combines methods in bioinformatics, cellular imaging, synthetic and structural biology to harness nanobiotechnology focusing on bacterial microcompartments, carbon fixation, and cyanobacterial photoprotection mechanisms. In 2022, Dr. Kerfeld received support from the Department of Energy to establish the MSU-DOE Plant Research Laboratory, the Center for Catalysis in Biomimetic Confinement to explore how nature compartmentalizes some of its most important biochemical reactions. https://www.kerfeldlab.org/ Evelyn Hu: Dr. Hu is the Tarr-Coyne Professor of Applied Physics and of Electrical Engineering at Harvard University. Her research matches nanofabrication techniques with the integration of materials that allow the formation of structures and devices that demonstrate exceptional electronic and photonic behavior. One example of this is the focus on coupling artificial atoms, such as quantum dots or color centers in diamond, to carefully-crafted nanoscale optical cavities. Dr. Hu co-chaired the 1997-99 WTEC Panel on “Nanostructure Science and Technology,” which produced a report that documented the potential importance of a national initiative on nanotechnology. She is currently a Co-Director of the Harvard Quantum Initiative. Prior to her appointment at Harvard, she was Scientific Co-Director of the California Nanosystems Institute and worked at AT&T Bell Laboratories. Hu is a member of the National Academy of Sciences, National Academy of Engineering, American Academy of Arts and Sciences, the Academia Sinica of Taiwan, and a recipient of an NSF Distinguished Teaching Fellow award. https://hugroup.seas.harvard.edu/evelyn-hu Denis Wirtz: Dr. Wirtz is the Theophilus Halley Smoot Professor in the Department of Chemical and Biomolecular Engineering and vice provost for research at Johns Hopkins University. Through his research at the interface of physics, biology, and oncology, he has contributed to the understanding of cancer cell migration, cytoskeleton biophysics, and the nascent field of mechanobiology. He has conducted research in cell migration in 3D settings, bacterial cell division, and high-throughput cell phenotyping. Recently, Dr. Wirtz developed CODA, an AI-based method to image large volumes of tissues and tumors in 3D. He co-founded the Johns Hopkins Institute for NanoBioTechnology (INBT) and is the director of the NCI-funded postdoctoral training program in nanotechnology for oncology, the NCI-funded Physical Sciences-Oncology Center, and the Johns Hopkins Cellular Cancer Biology Imaging Cancer Center. https://wirtzlab.johnshopkins.edu/ Andrew Schwartz (moderator): Dr. Schwartz serves as the Division Director for Materials Sciences and Engineering at the Department of Energy (DOE), previously managing the Energy Frontier Research Centers (EFRCs). Prior to joining DOE, Dr. Schwartz spent seven years in industry leading a multi-disciplinary scientific and engineering team in the research and development of a new technology for semiconductor metrology. Since 2009 he has represented DOE on the Nanoscale Science, Engineering, and Technology (NSET) subcommittee, serving as one of two co-chairs since 2019. https://science.osti.gov/bes/About/Dr-Andrew-R-Schwartz Commercialization Theresa Dankovich: Dr. Dankovich invented germ-killing water filters as a PhD student at McGill University and co-founded her company Folia Water in 2016 to scale up production. Folia Filte"
