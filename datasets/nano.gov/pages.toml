["https://www.nano.gov/ehsstrategymeeting"]
title = "Refreshing the NNI’s Environmental, Health, and Safety Research Strategy | National Nanotechnology Initiative"
description = "Enter the characters shown in the image."
full_description = "May 31–June 1, 2023Online and L’Enfant Plaza SW, Washington, D.C.The National Nanotechnology Coordination Office (NNCO), on behalf of the U.S. Government’s National Nanotechnology Initiative (NNI), invites you to participate in a public meeting to discuss the revision of the NNI’s 2011 Environmental, Health, and Safety (EHS) Research Strategy. Individuals, non-governmental organizations, academic and research institutions, and the private sector interested in the responsible development of nanotechnology are encouraged to attend and contribute to creating an updated EHS Research Strategy.The NNI seeks feedback and perspectives on progress toward the goals set out in the NNI’s 2011 EHS Research Strategy and on remaining research gaps, new challenges, and opportunities. By involving the broadest cross section of stakeholders early in the process, the NNI hopes to prepare a fresh and durable strategic guide that is responsive to the continuing evolution of nanotechnology as an enabling technology. Additional opportunities to engage with the NNI’s EHS strategy refresh include responding to the Request for Information (RFI) published on April 5, 2023. The comment period for the RFI has been extended to 5 p.m. ET June 16, 2023. Information on the 2011 EHS Research Strategy is posted on the NNI website.AGENDADay 1: May 31, 2023Time EDTSessionSpeakers/Panelists9 am – 9:15 amWelcome and Opening RemarksJohn Howard, Director of NIOSHBranden Brough, Director of the NNCO9:15 am – 9:30 amBackground to the Revision of the 2011 StrategyTreye Thomas (CPSC)9:30 am – 10:30 amEthics in Nanoscience: Possible Lessons from the BiosciencesModerator: Vivian Ota Wang (NIH)Keynote Speaker: Hank Greely (Stanford University)10:30 am – 10:40 amBREAK 10:40 am – 10:45 amReview of online platform for commentsJosh Porterfield (NNCO AAAS Science & Technology Policy Fellow)10:45 am – 12:45 pmSession 1: Risk Assessment and Risk Management Methods, and Informatics and Modeling Research AreasModerators: Jay Vietas (NIOSH) and Iris Camacho (EPA): Informatics and modeling (IM) Joanna Matheson (CPSC)Invited Presenters: Phil Sayre (nanoAnalytics LLC & Consultant, Wiley Rein LLP (RAMM)), Mohammad Ali (Nanophase Technologies Corporation (RAMM)), Mark Wiesner (Duke University, U.S.-EU nanoEHS Communities of Research (COR) co-chair (RAMM)), Joana Sipe & Jaleesia Amos (Duke University (IM))12:45 pm – 1:45 pmLUNCH 1:45 pm – 3:45 pmNanomaterial Measurement Infrastructure and Environment Research AreasModerators: Anil Patri (FDA), Elijah Petersen (NIST), Annette Guiseppi-Elie (EPA), and Vladimir Murashov (NIOSH)Invited Presenters: Scott Brown (GlaxoSmithKline), Phil Demokritou (Rutgers University), and Monita Sharma (PETA Science Consortium International e.V.)3:45 pm – 4:00 pmWRAP-UPQuinn Spadola; Deputy Director, NNCODay 2: June 1, 2023Time EDTSessionSpeakers/Panelists8:45 am – 9 amIntroduction, Reminders, and HousekeepingBranden Brough (NNCO)9 am – 9:45 amNatural-Language Processing Approaches to Assess NanoEHS Research TrendsModerator: Quinn Spadola (Deputy Director, NNCO)Keynote Presenters: Sagar Kamarthi, Sri Radhakrishnan9:45 am – 12:00 pmw/ a break around 11 amHuman Exposure Assessment and Human Health Research AreasModerators: Treye Thomas (CPSC); Sri Nadadur (NIEHS), and Janet Carter (OSHA)Invited Presenters: Rick Canady, (NeutralScience (HEA)),Linsey Marr (Virginia Tech (HEA)),Christie M. Sayes, (Baylor University, U.S.-EU nanoEHS COR co-chair (HH))Andre Nel, (UCLA (HH))12 pm – 1 pmLUNCH 1 pm – 3 pmFuture Directions, with Reporting Out from Core Research AreasModerator: Quinn SpadolaInvited Presenters: Jo Anne Shatkin (Vireo Advisors, LLC), Julie Zimmerman (Yale), and Greg Lowry (Carnegie Mellon University)3 pm – 3:15 pmBREAK 3:15 pm – 4:45 pmAn Integrated ApproachModerators: Nora Savage (NSF) and Annie Jarabek (EPA)Jordan Smith (Battelle Memorial Institute), Phoebe Stapleton (Rutgers University), Leanne Gilbertson (University of Pittsburgh)4:45 pm – 5:00 pmWRAP-UPBranden Brough, Director, NNCO Quinn Spadola, Deputy Director, NNCOSPEAKERS AND PANELISTSMohammad AliDirector, QA & Regulatory Compliance, Nanophase Technologies Corporation Jaleesia AmosDoctoral Candidate, The Wiesner Group, Duke UniversityScott BrownAssociate Director and GSK Fellow, GlaxoSmithKlineRick CanadyDirector and Founder, NeutralSciencePhil DemokritouHenry Rutgers Chair and Professor in Nanoscience and Environmental Bioengineering, Rutgers Biomedical Health Sciences, Rutgers UniversityLeanne GilbertsonAssociate Professor, Swanson School of Engineering, University of PittsburghHank GreelyDeane F. and Kate Edelman Johnson Professor of Law, Stanford Law SchoolSagar KamarthiProfessor, Mechanical and Industrial Engineering, Northeastern UniversityGreg LowryWalter J. Blenko, Sr. Professor, Civil and Environmental Engineering, Carnegie Mellon UniversityLinsey MarrCharles P. Lunsford Professor, Civil and Environmental Engineering, Virginia TechAndre NelDistinguished Professor of Medicine and Research Director of the California Nano Systems Institute at UCLA; Director of the UC Center for Environmental Implications of NanotechnologySrinivasan RadhakrishnanAssistant Teaching Professor, Northeastern UniversityChristie M. SayesAssociate Professor, Environmental Science and Toxicology, Baylor UniversityPhil SayrenanoRisk Analytics, LLC and Consultant for Wiley Rein, LLPMonita SharmaNanotechnology Specialist, PETA Science Consortium International e.V.JoAnne ShatkinDirector and Founder, Vireo AdvisorsJoana SipePostdoctoral Associate, The Wiesner Group, Duke UniversityJordan SmithTeam Lead Exposure Science and Pathogen Biology| Battelle Memorial Institute, Pacific Northwest DivisionPhoebe StapletonAssistant Professor, Rutgers University Ernest Mario School of PharmacyMark WiesnerJames B. Duke Distinguished Professor of Civil and Environmental Engineering, Duke UniversityJulie ZimmermanProfessor, Chemical & Environmental Engineering, Environment and Epidemiology, Yale UniversityRESOURCESNational Nanotechnology Initiative Environmental, Health, and Safety Research Strategy (2011)Progress Review on the Coordinated Implementation of the National Nanotechnology Initiative 2011 Environmental, Health, and Safety Research Strategy (2014)Highlights of Recent Research on the Environmental, Health, and Safety Implications of Engineered Nanomaterials (2017)A Look Back at the NNI’s Interagency NanoEHS Research Collaboration (2022)Federal Nanotechnology Environmental, Health, and Safety (EHS) Investments, Extracted from the NNI’s AnnualSupplements to the President’s Budget, FY 2019–FY 2023ABOUTThe Nanotechnology Environmental and Health Implications (NEHI) Working Group leads the NNI’s efforts to prepare an update to the NNI’s 2011 EHS Research Strategy. NEHI is a working group under the Nanoscale Science, Engineering, and Technology (NSET) Subcommittee of the National Science and Technology Council’s Committee on Technology. NNCO conducts public engagement on behalf of the NNI and provides technical and administrative support to the NSET Subcommittee and the interagency nanotechnology community.For further information, contact:Rhema Bjorkland"
