["https://www.nano.gov/socialscienceworkshop"]
title = "Responsible Development, Social Science, and the National Nanotechnology Initiative: A Workshop to Explore Past and Future Intersections | National Nanotechnology Initiative"
description = "Enter the characters shown in the image."
full_description = "Since its inception, the National Nanotechnology Initiative (NNI) has emphasized the importance of responsible development, and social scientists have played important roles in the interdisciplinary research that supports fundamental and applied research in nanotechnology. Following this tradition, the NNI and the National Nanotechnology Coordination Office (NNCO) convened a workshop to bring together federal experts in nanotechnology with social scientists with expertise on specific tools and frameworks relevant to the responsible development of emerging technologies. The agenda included a presentation about the recently released “Blueprint for the Use of Social and Behavioral Science to Advance Evidence-Based Policymaking,” introductions to key nanotechnology case studies by federal experts, and flash talks by social scientists. The meeting promoted brainstorming new intersections between social science and nanotechnology R&D with the goals of i) integrating social science into future visions of interdisciplinary research, development, and training, and ii) reinvigorating networks that connect the NNI to the social science community. Workshop SummaryAgenda:July 24, 20249:00 a.m. to 5:00 p.m. ETOnline and in-person, Washington, D.C.Time (ET)Session9:00 a.m. – 9:30 a.m.Welcome and introductions9:30 a.m. - 9:55 a.m.Presentation: “Blueprint for the Use of Social and Behavioral Science to Advance Evidence-Based Policymaking” - Kei Koizumi, White House Office of Science and Technology Policy9:55 a.m. – 10:15 a.m.Presentation: “Ripples of the NNI: How Nanotechnology Inspired Responsible Research and Innovation (RRI) Policy in the European Union” - Clare Shelley-Egan, TU Delft, the Netherlands 10:15 a.m. – 10:30 a.m.Break10:30 a.m. - 12:00 p.m.Social Science Flash Talks (10 mins each)12:00 p.m. – 12:45 p.m.Lunch12:45 p.m. – 1:30 p.m.Social Science Flash Talks (10 mins each)1:30 p.m. – 2:15 p.m.Nanotechnology Case Studies - Introductions by NSET agency representatives2:15 p.m. – 2:30 p.m.Break2:30 p.m. – 4:30 p.m.Small-group discussions (rotating among case studies) [Note: this portion of the agenda unavailable to online participants]4:30 p.m. – 4:45 p.m.Break4:45 p.m. – 5:00 p.m.Report Out and Discussion5:00 p.m.Closing and Next StepsExpert Participants:NameAffiliationFlash Talk TitleBriñas, RaymondFDA, Office of Food Additive Safety Brough, BrandenNNCO, Director Chen, HongdaUSDA/NIFA Chen, JermontNIH/NIBIB, Division of Discovery Science and Technology Daemmrich, ArthurConsortium for Science, Policy, and Outcomes (ASU)Chemical Risk, Testing, and Regulatory CulturesDelborne, JasonNNCO, AAAS Science & Technology Policy Fellow Evans, Sam WeissNational Security Commission on Emerging BiotechnologyMaking Science More Responsive to Society: Lessons from Experiments in GovernanceGhilani, JessicaUniversity of Pittsburgh Disinformation LabScience Communication, Misinformation, and TrustGrieger, KharaNorth Carolina State UniversityOnline, Stakeholder EngagementHaes, AmandaDOE/Basic Energy Sciences Hartley, SarahUniversity of Exeter (UK)Stakeholder Engagement and Risk AssessmentMorales, Carolina SalvadorNIH/NCI, Nanodelivery Systems and Devices Nelson, John P.Georgia Institute of TechnologyPublic Values Mapping & Science Policy AssessmentPalmer, MeganGingko BioworksEngineering Biology at Social ScalesSpadola, QuinnNNCO, Deputy Director Shelley-Egan, ClareDelft University of TechnologyInterrogating Integration: Formulating a Quantum and Society ApproachTomblin, DavidUniversity of MarylandParticipatory Technology Assessment: An Alternative Public InputUdu-gama, NatashaAmerican Geophysical Union - Thriving Earth ExchangeCommunity ScienceVietas, JayNIOSH/Nanotechnology Research Center Zhernenkov, MishaDOE/Basic Energy Sciences For further information, contact:Jason Delborne, AAAS Science and Technology Policy Fellow, NNCO"
