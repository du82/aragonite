full_description = "The Federal agencies that participate in the National Nanotechnology Initiative (NNI) support innovative research that will drive the next generations of scientific breakthroughs and technological advances for the benefit of all people. On a daily basis, the National Nanotechnology Coordination Office compiles the latest news releases on these research advances and provides information on the impact of the NNI on the economy and society. About NanotechnologyNational Nanotechnology InitiativeEvents & InitiativesNews & ImpactReports & Resources About NanotechnologyNational Nanotechnology InitiativeEvents & InitiativesNews & ImpactReports & Resources The Federal agencies that participate in the National Nanotechnology Initiative (NNI) support innovative research that will drive the next generations of scientific breakthroughs and technological advances for the benefit of all people. On a daily basis, the National Nanotechnology Coordination Office compiles the latest news releases on these research advances and provides information on the impact of the NNI on the economy and society. News News from the NNI Community Impact Economic impact of nanotechnologyScientific impact of nanotechnologyCommunity celebrations of nanotechnology National Nanotechnology Coordination Office 2415 Eisenhower Avenue Alexandria, VA 22314 202-517-1050 www.nano.gov About Nanotechnology National Nanotechnology Initiative Events & Initiatives News & Impact Reports & Resources Name First Last Email CAPTCHA Get new captcha! What code is in the image? Enter the characters shown in the image."
