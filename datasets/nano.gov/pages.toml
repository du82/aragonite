full_description = "About NanotechnologyNational Nanotechnology InitiativeEvents & InitiativesNews & ImpactReports & Resources Butterfly wings inspire new imaging technique for cancer diagnosis Using the nanostructures and microstructures found on Morpho butterfly wings, scientists have developed a simple and inexpensive way to analyze cancerous tissues. View Details Nanoparticles offer enhanced treatment for root canal infection Researchers have demonstrated that ferumoxytol, an U.S. Food and Drug Administration-approved iron oxide nanoparticle formulation, greatly reduces infection in patients diagnosed with apical periodontitis. View Details Light-powered breakthrough enables precise tuning of quantum dots Researchers have demonstrated a new technique that uses light to tune the optical properties of quantum dots, making the process faster, more energy-efficient and environmentally sustainable. View Details New 2D carbon material is tougher than graphene and resists cracking Researchers have found a two-dimensional carbon material, called monolayer amorphous carbon, that is tougher than graphene and resists cracking. Graphene is among the strongest on Earth, but cracks propagate rapidly through it. View Details EXperiential And MultidisciPlinary Learning and Education (EXAMPLE) Convening (March 27, 2025) This convening, which will be held in Washington, DC, will highlight education programs across federal agencies and offices to increase awareness, share lessons learned, and identify needs. View Details NNI Environmental, Health, and Safety (EHS) Research Strategy: 2024 Update The National Nanotechnology Coordination Office has released an update to the 2011 NNI EHS Research Strategy. The challenges and opportunities outlined in this document build on the advances of two decades of nanoEHS research. View Details NNI Supplement to the President’s 2025 Budget The National Nanotechnology Coordination Office has released the NNI Supplement to the President’s 2025 Budget, which documents the progress and plans of the NNI-participating agencies towards addressing the goals and objectives of the NNI. View Details"
