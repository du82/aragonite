["https://www.nano.gov/NanometrologyWebinarSeries"]
title = "Nanometrology Webinar Series | National Nanotechnology Initiative"
description = "Enter the characters shown in the image."
full_description = "Metrology, the study of measurement, enables researchers to measure the properties and performance of materials and devices and to generate data from laboratory experiments. Over the past 20 years of nanotechnology R&D, many areas of research have required the development of tools, methods, and techniques to characterize and evaluate materials, devices, and formulations. Nanometrology, the study of nanoscale measurement, presents a unique set of challenges due to the small size of the materials, often requiring more sensitive and innovative tools, methods, and techniques to obtain and understand characterization data.The National Nanotechnology Coordination Office (NNCO) is organizing a webinar series to discuss nanometrology and metrological challenges and advances. The webinar series will continue with two new webinars: 1) Nanometrology for Continuous and Automated Manufacturing (Oct. 4); and 2) Nanometrology Involving Big Data, AI, and Modeling (Nov. 1). Previous webinars in the series can be found below.Upcoming Webinars:- Nov. 1: Nanometrology Involving Big Data, AI, and Modeling, 12:00 to 1:30 PM ETOct. 4: Nanometrology for Continuous and Automated ManufacturingThis webinar will describe challenges related to in-line and at-line measurements in continuous systems and measurements made in automated systems. The following topics will be discussed:In-line characterization of nanomaterials, such as boron nitride nanotubes during plasma synthesis;Automation and characterization of heterostructures from 2D nanomaterials with the QPress;Development and challenges of automation and characterization involving “self-driving” fluidic systems for smart manufacturing of nanomaterials.Speakers: Yevgeny RaitsesPrinceton Plasma Physics Laboratory Suji ParkCenter for Functional Nanomaterials at Brookhaven National LaboratoryMilad AbolhasaniNorth Carolina State University Nov. 1: Nanometrology Involving Big Data, AI, and ModelingThis webinar will address the types of measurement and analysis challenges in fields of nanotechnology that may be bottlenecked by computational challenges and large datasets.4D-STEM, its big data challenges, and solutions;Development of the spatiotemporally-resolved digital twin tool;Development of the JARVIS (Joint Automated Repository for Various Integrated Simulations) database and its associated tools.Speakers: Colin OphusStanford University Subramanian SankaranarayananCenter for Nanoscale Materials at Argonne National LaboratoryKamal ChoudharyNational Institute of Standards and Technology Past Webinars:- January 5: An Introduction to Nanometrology: History, State-of-the-Art, and Philosophy- February 2: Nanometrology for Food, Agriculture, and the Environment- March 1: Metrology of Nanoscale Medical and Pharmaceutical Products- April 5: Metrology of Nanoparticles in ElectronicsJanuary 5: An Introduction to Nanometrology: History, State-of-the-Art, and PhilosophyThis introductory webinar, on the history, state-of-the-art, and philosophy of nanometrology, will set the stage for the nanometrology webinar series. The following topics will be discussed:Introduction to the philosophy of nanometrology – how we decide what we measure and how we make decisions on the development of measurement methods; Cutting-edge technologies that enable nanoscale measurements;A case study of the history of challenges and advancements with nanoscale SEM.Speakers:Elisabeth MansfieldNISTAndras VladarNISTAngela Hight-WalkerNIST February 2: Nanometrology for Food, Agriculture, and the EnvironmentThis webinar will describe measurement challenges when addressing concerns related to nano-enabled agriculture and the environmental fate of nanoplastics. The following topics will be discussed:Nano-enabled agriculture;Nano-Enabled Delivery of Biomacromolecules for Plant Genetic Engineering; Environmental effects and transport of biodegradable micro- and nanoplastics. Speakers:Gözde S. DemirerCalifornia Institute ofTechnologyJason C. WhiteConnecticut AgriculturalExperiment StationDouglas HayesUniversity of Tennessee March 1: Metrology of Nanoscale Medical and Pharmaceutical ProductsThis webinar will address measurement challenges in medicine and pharmaceuticals regarding the manufacture, characterization, and targeting of nano-enabled drug products. The following topics will be discussed:Continuous manufacturing of nanoparticulate drug products;Single-particle fluorescence measurement as a characterization tool for nanoparticles;Analytical Characterization of Targeting Ligands on Polymeric Nanoparticles. Speakers:Antonio CostaUniversity of Connecticut,DIANT PharmaJean-Luc FraikinSpectradyneRoger PakBioTx Pharmaceutical R&D, Pfizer, Inc. April 5: Metrology of Nanoparticles in ElectronicsThis webinar will discuss recent advances and current challenges in metrology related to the synthesis, characterization, and application of nanoparticles in electronics. The following topics will be discussed:Device engineering with nanoparticle building blocks;Challenges and opportunities for nano-optical characterization and fabrication of 2D material systems;High-throughput Synthesis and Characterization of Colloidal Inorganic Nanoparticles. Speakers:Nicholas J. BorysMontana State UniversityEmory ChanMolecular Foundry,Lawrence BerkeleyNational LaboratoryFarnaz NirouiMassachusetts Institute ofTechnology"
year_published = 2025
