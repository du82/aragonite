["https://www.nano.gov/anniversarysymposium"]
title = "NNI 20th Anniversary | National Nanotechnology Initiative"
description = "Enter the characters shown in the image."
full_description = "Scientists and engineers across many fields and disciplines are united by their work at the nanoscale. Their diverse efforts have helped produce everything from faster microchips to powerful mRNA vaccines. The transformative impact of this work has been spurred by the coordination and focus on U.S. nanotechnology established by the 21st Century Nanotechnology Research and Development Act in 2003. Celebrating the NNI’s broad impact and envisioning the future, this symposium brought together voices from across the emerging technology landscape. Experts spoke on the importance of nanotechnology in quantum engineering, optics, environmental health and safety (EHS), plastics, DEIA, microelectronics, medicine, education, manufacturing, and more. Attendees included hundreds of researchers, policymakers, members of industry, educators, students, and the public - both online and in person, and conversations centered on the strategic vision for the next twenty years of the NNI. See below for more details! KEYNOTESArati PrabhakarAssistant to the President for Science and Technology, Director of the White House Office of Science andTechnology PolicyChad MirkinNorthwestern UniversityKathleen RubinsNASA Astronaut The Future of NanotechnologyMaxx ArguillaUniversity ofCalifornia, IrvineJennifer DionneStanford UniversityThomas Epps, IIIUniversity of DelawareAli BeskokSouthern Methodist UniversityModeratorPOLICY PERSPECTIVES Neal LaneRice University, former Assistant to the President (Clinton) for Science and Technology and Director of the White House Office of Science andTechnology PolicyRon WydenSenior United StatesSenator from OregonSharon HaysAstrion, Former White House Office of Science and Technology PolicyKei KoizumiWhite House Office of Science and Technology Policy PANELS ​Responsible DevelopmentDoyle EdwardsBrewer ScienceReginald RogersUniversity of Missouri, ColumbiaJameson WetmoreArizona State UniversityTreye ThomasOffice of Hazard Identification and R