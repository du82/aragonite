["https://www.nano.gov/EXAMPLEconvening"]
title = "Postponed | National Nanotechnology Initiative"
description = "Enter the characters shown in the image."
full_description = "EXperiential And MultidisciPlinary Learning and Education (EXAMPLE) Convening An in-person convening highlighting education programs across federal agencies and offices to increase awareness, share lessons learned, and identify needs. The convening will consist of four panels of experts who will discuss: the value of interdisciplinary collaboration; the importance of evaluation and metrics of success; the stories of professionals who benefited from different experiential training programs; and the experiential training programs available at user facilities. The convening will raise awareness and share lessons learned from such programs across the federal government, as well as catalyze discussions that may inform future efforts.This convening is for education professionals and researchers interested in learning about federally funded opportunities and for federal program managers curious about opportunities at other agencies. The agenda will include panelists representing programs from DOD, DOE, DOL, NASA, NSF, USDA, and more!Draft agenda 8:30 a.m. to 5:00 p.m. ET Time (ET)Session8:30 – 9 a.m.Coffee and networking9 – 9:15 a.m.Welcome and Introduction9:15 – 10:30 a.m.Panel 1: The importance of interdisciplinary collaboration for the future of work10:30 – 11 a.m.Break11 am – 12:15 p.m.Panel 2: Evaluators and metrics of success12:15 – 1:30 p.m.Lunch & networking1:30 – 2:45 p.m.Panel 3: Highlighting success stories from different federal programs2:45 – 3:15 p.m.Break3:15 – 4:30 p.m.Panel 4: Federal user facilities and training programs4:30 – 5 p.m.Event summary5:00 p.m.No host social, location TBDPanel titles and invited panelistsPanel 1: The importance of interdisciplinary collaboration for the future of work Christine HendrenVice Provost for Research & Innovation and Professor of Geological and Environmental Sciences, Appalachian State UniversitySayantani GhoshAssociate Dean of Graduate Division and Professor of Physics, University of California, MercedRobert FinneganHead of Education and Workforce, Advanced Functional Fabrics of America (AFFOA) Panel 2: Evaluators and metrics of success Terryll BaileyPresident of the Allison Group and External Evaluator for the Micro Nano Technology Education CenterKerrie DouglasAssociate Professor of Engineering Education, Purdue UniversityRick GilmorePerformance Assessment and Evaluation Program Manager, NASAJoni LakinProfessor, Department of Educational Studies, University of AlabamaV. Celeste CarterProgram Director, Division of Undergraduate Education, STEM Education Directorate, National Science FoundationModeratorPanel 3: Highlighting success stories from different federal programsKris DorseyAssociate Professor, Electrical and Computer Engineering & Physical Therapy, Movement, and Rehabilitation Sciences, Northeastern UniversityZachary GrayManaging Director, Center for Nanotechnology Education and Utilization, Penn State UniversitySamad ViraniIB Physics and Chemistry Teacher, Uplift Luna PreparatoryConnor KokoraUndergraduate Student, University of North TexasPanel 4: Federal user facilities and training programs Laleh CotéSTEM Education Program Manager, Workforce Development & Education, Lawrence Berkeley National LaboratoryMike RussoPresident and CEO, National Institute for Industry and Career AdvancementFrancesca TavazzaGroup Leader, Data and AI-Driven Materials Science Group, Materials Measurement Science Division, National Institute of Standards and Technology (NIST)Mikkel ThomasAssociate Director for Education and Outreach, National Nanotechnology Coordinated Infrastructure coordinating office, Georgia TechMarina A. DobrovolskaiaDirector of Operations, Head of Immunology Section, Nanotechnology Characterization Laboratory, Frederick National Laboratory for Cancer Research, National Cancer Institute, National Institutes of HealthModerator For further information, contact:Maria Fernanda Campa"
