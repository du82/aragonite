["https://www.nanowerk.com/nanocatalog/help.php"]
title = "Nanowerk Catalog - Nanotechnology Materials and Equipment"
description = "Nanowerk is the leading nanotechnology portal, committed to educate, inform and inspire about nanotechnologies, nanosciences, and other emerging technologies"
full_description = '''Can I access the Nanowerk Catalog freely or do I need to register? No need to register! Just go ahead and search for the products you are interested in or browse the entire Catalog. I am interested in a product - how do I buy it or get more information? At the moment we don't offer a purchase function in the Nanowerk Catalog. Instead, please contact the vendor directly by clicking one of two links on the product detail page: This will open a pop-up window where you can send your message directly to the vendor. Is the Nanowerk Catalog a free service or do I need to pay for it? There is no cost for including your products in the Nanowerk Catalog. Just open a free Vendor Account by registering here and add your products. For each product you may upload up to 3 images and include detailed product information. How do I list my products in the Nanowerk Catalog? First you need to set up a free account with Nanowerk by registering your details. Register Click 'Vendor Registration' in the Catalog menu bar. Then fill out the registration template. Fields marked with a red asterisk are mandatory. Once you send off your registration details you will receive an email from us confirming that we received your application. We will then get back to you within 24 hours. Log into your account After we checked your information we will send you a confirmation email upon which you will be able to log into your newly set up account. Complete your company details On your profile page (click the 'Profile' tab), add your logo file and complete any missing information. You may also add a company video. Manage your product categories On the right hand side of your Profile page you will find a list of the product categories that you applied for during registration. If you require a category that is not listed, please click the 'Contact' link at the bottom of that list and let us know. Add your products Click the 'Products' tab and select the 'Add Your Product' button. This opens a template page where you can select the desired product category and add information about your product. You may add up to 3 images. Do you offer a bulk upload facility? Yes, we can work with suitably formatted csv files. Please contact us to discuss this further. How many products can I list? There is no pre-set limit. Is there a time limit for how long my products will be listed? No, there is no pre-set time restriction. How do I manage my Company Profile? To edit your Company Profile, please do the following: 1. Sign in to your account 2. Click the blue 'Profile' tab or select 'Edit Profile' from the pull-down menu under the 'My Account' link in the Catalog menu bar 3. Complete the form with the required information 4. Click "Update Profile" at the bottom of the page to update How do I manage existing products in my Catalog? To edit your Catalog products, please do the following: 1. Sign in to your account 2. Click the blue 'Products' tab or select 'My Products' from the pull-down menu under the 'My Account' link in the Catalog menu bar 3. On the product list, select the product you want to manage by clicking either the 'Edit' or 'Deactivate' link in the right 'Action' column. 4. If you click 'Deactivate', the product status changes to 'Inactive'. It will no longer be listed in the catalog. 5. You may reactivate the product at any time by clicking the 'Activate' button. 6. If you click 'Edit' then you can manage the product information by making changes to the product detail form. 7. Click 'Update Product' at the bottom of the page to update What is the 'Showroom' and how do I get one? This is a paid service that is included in our Preferred Membership and provides you with these additional features: Showroom All of your products from the Catalog are shown in one place. Showcase additional items to what is already included in the Nanowerk Catalog. This could be for instance brochures, articles and application notes in PDF format, videos, and additional offerings. Banner ad One 200px x 200px banner that displays on all public pages of the Nanowerk Catalog. Preferred listing All your Catalog products are listed preferentially, i.e. before other vendors' products in search results and category listings. How do I change the profile/description that's on top of my Showroom? Initially, this description is identical to the company profile that you entered when you set up your account. However, you can change this description in the Showroom by clicking the "Click here to edit the logo or showroom description" link (your company profile remains unchanged by this). How do I add items to my Showroom? Once you sign up for a Nanowerk Catalog Preferred Membership you will find a blue 'Showroom' tab on your home page after you sign in. There also will be an additional item 'My Showroom' in the pull-down menu under the 'My Account' link in the Catalog menu bar. These links lead to the 'Manage Your Showroom' page where you can add, modify or delete items in three sections: - Products (these are items that are not included as products in the Catalog but that you want to showcase as well) - Downloads (these are items such as brochures, images, promotional material or application notes) - Videos (here you can include links to your videos on YouTube and Vimeo) What is a Preferred Membership? Please see here for more information on the Preferred Membership. What is the 'Leads' section in my account overview? For your convenience, this section archives the messages you received from visitors to your Nanowerk Catalog pages through the message links 'Request a Quote' and 'Contact Supplier'. Can I use special characters? Yes. Please note that if you want to use subscripts like in Al2TiO3 then please use the <sub> and <> tags like this: Al2TiO3 I forgot my password to login On the login page, click the 'Forgot password' field at the bottom. Then enter your email address (the address associated with your Nanowerk Catalog account) and click Submit. How do I change my email associated with my account? Please contact us from the email address that you registered with. We can then assist you in changing your email address.'''
year_published = 2025
clearnet = "https://www.nanowerk.com/nanocatalog/help.php"
