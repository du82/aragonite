title = "Researchers create the world's smallest shooting video game using nanotechnology (w/video)"
description = "Researchers created the smallest shooting game using nanoparticles, advancing interfaces that blend virtual objects with real nanomaterials at the nanoscale."
full_description = '''Feb 26, 2025 Researchers create the world's smallest shooting video game using nanotechnology (w/video) Researchers created the smallest shooting game using nanoparticles, advancing interfaces that blend virtual objects with real nanomaterials at the nanoscale. (Nanowerk News) A research team led by Professor Takayuki Hoshino of Nagoya University’s Graduate School of Engineering in Japan has demonstrated the world’s smallest shooting game by manipulating nanoparticles in real time, resulting in a game that is played with particles approximately 1 billionth of a meter in size. This research is a significant step toward developing a computer interface system that seamlessly integrates virtual objects with real nanomaterials. They published their study in the Japanese Journal of Applied Physics ("Electron-beam induced electro-force field display for a dynamical biomanipulation system"). The game demonstrates what the researchers call “nano-mixed reality (MR)”, which integrates digital technology with the physical nanoworld in real time using high-speed electron beams. These beams generate dynamic patterns of electric fields and optical images on a display surface, allowing researchers to control the force field acting on the nanoparticles in real time to move and manipulate them. The aim of the team was to create an intuitive and engaging way to showcase their technology. As fans of vintage video games, they designed an interactive shooting game inspired by classic arcade titles. Dubbed by Hoshino as the "world’s smallest shooting game," it enables players to interact with objects at the nanoscale level. Electron-beam induced electro-force field display for dynamical biomanipulation system. (© The Japan Society of Applied Physics) The nanogame MR is designed to blend the real world with virtual ones, allowing digital objects to interact with the physical environment. A joystick was used to modify the scanning pattern of the electron beam, which appears onscreen as movement of a triangular spaceship. Players then attempted to strike enemy characters (actually, nano-sized polystyrene balls) using the electron beam. “The system projects the game ship onto real nanophysical space as an optical image and force field, creating an MR where nanoparticles and digital elements interact,” Hoshino said. “The game is a shooting game in which the player manipulates a ship and shoots bullets at real nanoparticles to repel them. Through this, we successfully demonstrated real-time interaction between digital data and physical nano-objects.” Watch the game being played. Scientific implications Beyond gaming, this technique makes it possible to manipulate and assemble biomolecular samples at the smallest levels, with potential applications in nanotechnology and biomedical engineering. “We could 3D print the created objects in real time, potentially revolutionizing the world of 3D printing,” Hoshino said. “Or use the same guidance technique to guide toxic agents to virus cells in living organisms and kill them.” Source: Nagoya University (Note: Content may be edited for style and length) googletag.cmd.push(function() { googletag.display('div-gpt-ad-1589722303187-0'); }); @import url(https://static.mailerlite.com/assets/plugins/groot/modules/includes/groot_fonts/import.css?version=1620372); .ml-form-embedSubmitLoad{display:inline-block;width:20px;height:20px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}.ml-form-embedSubmitLoad:after{content:" ";display:block;width:11px;height:11px;margin:1px;border-radius:50%;border:4px solid #fff;border-color:#fff #fff #fff transparent;animation:ml-form-embedSubmitLoad 1.2s linear infinite}@keyframes ml-form-embedSubmitLoad{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}#mlb2-3178312.ml-form-embedContainer{box-sizing:border-box;display:table;margin:0 auto;position:static;width:100%!important}#mlb2-3178312.ml-form-embed