full_description = "Self-powered biosensor detects and kills bacteria on contact while generating its own energy A self-powered biosensor detects and destroys E. coli using enzyme-driven energy, aptamer-based recognition, and silver ion release for real-time safety. Mar 1st, 2025 How nanoplastics interact with organic matter at the molecular level Simulations reveal how aged nanoplastics form stable aggregates with organic matter, influencing their transport in aquatic environments. Feb 27th, 2025 Ions boost efficiency and longevity in quantum-dot displays A new quantum-dot display technology uses ions to boost brightness and efficiency while extending screen lifespan and reducing power use. Feb 26th, 2025 Bacteria encapsulated in microspheres create living, searchable DNA data storage system Researchers develop hydrogel microspheres with data-encoding bacteria that enable room-temperature DNA storage with fluorescence-based retrieval, combining advantages of both in vivo and in vitro methods. Feb 25th, 2025 Photonic nanopigments offer sustainable, high-performance fabric dyeing with structural color Researchers develop photonic nanopigments that produce brilliant, durable colors for fabric dyeing - without the environmental impact of chemical dyes. Feb 24th, 2025 Microscopic material gradients enable strain-proof flexible bioelectronics New printing technique creates seamless transitions between soft and rigid materials at microscopic scales, enabling electronic devices that maintain performance under extreme stretching. Feb 21st, 2025 AI system achieves near-perfect accuracy in detecting toxic gases New gas detection system combines organic sensors with AI to identify complex gas mixtures and nearly identical compounds with 99% accuracy, advancing environmental and safety monitoring. Feb 20th, 2025 New biomass hydrogels harvest water from air with record efficiency Researchers have turned abundant natural materials like cellulose into powerful hydrogels that captu