title = "Nanotechnology standards"
description = "Numerous standard setting organizations around the world are active in defining voluntary nanotechnology and nanomaterial standards, although no one standard has achieved dominance yet. These standards address terminology, property testing, and issues of health and safety."
full_description = '''Nanotechnology standards (Nanowerk Spotlight) Most people in the world know exactly how long a kilometer is, how large a liter is, how much a kilogram weighs, and how warm 25°C is. That's because almost all countries in the world have adopted a standard called the metric system - since the 1960s the International System of Units has been the internationally recognized standard system for measurements (only three countries have not adopted this standard: Liberia, Myanmar, and the United States – the latter maybe because the metric system was invented by the French...). The lack of a unified standard, or the existence of different standards, can have dire consequences. In 1999, the Mars Climate Orbiter spacecraft was destroyed because a navigation error caused the spacecraft to fly too deep into the atmosphere of Mars. This error arose because a NASA subcontractor used Imperial units (pound-seconds) instead of the NASA-specified metric units (newton-seconds) in a navigation-related software. But even in the U.S., economic and scientific needs assure the continued creeping adoption of the metric standard in various areas. Nanotechnology is such a case, were the metric system is the undisputed only standard – used even by U.S. researchers – and sparing us conversion tables for nanometer to nanoinch and nanofoot, and nanoliter to nanogallon. Standards go beyond just agreeing measurements Standards have a much larger role in our society than just agreeing measurements. There are two different types of standards: physical measurement standards (for basic measurement quantities such as mass, time and frequency, which are traceable to the International System of Units (SI)) and documentary standards (written agreements among producers and/or users of products and services containing technical specifications or other precise criteria that may contain rules, guidelines, or definitions of characteristics). Put at its simplest, a standard is an agreed, repeatable way of doing something. It is a published document that contains a technical specification or other precise criteria designed to be used consistently as a rule, guideline, or definition. Standards help to make life simpler and to increase the reliability and the effectiveness of many goods and services we use. They are intended to be aspirational – a summary of good and best practice rather than general practice. Research and standardisation in a simple technology transfer model. (© Springer) Standards are designed for voluntary use and do not impose any regulations. However, laws and regulations may refer to certain standards and make compliance with them compulsory. For example, the physical characteristics and format of credit cards is set out in standard number BS EN ISO/IEC 7810:1996. Adhering to this standard means that the cards can be used worldwide. If we didn't have standards in our everyday lives, from things like coffemakers to cell phones, CDs and cars, life would be pretty complicated and much more expensive. Just think about the inconvenience every international traveler has experienced when it comes to the international incompatibility of plugs and sockets. Standards create comparability and any standard is a collective work. Committees of manufacturers, users, research organizations, government departments and consumers work together to draw up standards that evolve to meet the demands of society and technology. Standards exist at different levels and with different scopes: national standards such as ANSI in the U.S. or DIN in Germany; regional standards such as the EN standards in the European Union or the standards set by the Pan American Standards Commission; and international standards such as the IEC and ISO standards that are recognized by a large number of countries around the world. Nanotechnology standards The need for standardization also exists in various fields of nanotechnology in order to support commercialization and market development, provide a basis for procurement, and support appropriate legislation/regulation. Especially the vital role of standards in the emerging debate on nanotechnology risk assessment cannot be overestimated. The lack of nanotechnology standards poses several major challenges because right now there are: no internationally agreed terminology/definitions for nanotechnology no internationally agreed protocols for toxicity testing of nanoparticles no standardized protocols for evaluating environmental impact of nanoparticles no standardized measurement techniques and instruments no standardized calibration procedures and certified references materials. (adsbygoogle = window.adsbygoogle || []).push({}); The major nanotechnology standardization efforts of Standards Development Organizations (SDOs) were initiated in the early to mid-2000s. These organizations around are active in defining nanotechnology standards, although no one standard has achieved dominance yet. The important SDOs are: ANSI-Nanotechnology Standards Panel (ANSI-NSP) in the U.S. ASTM Committee E56 on Nanotechnology BSI British Standards Committee for Nanotechnologies (NTI/1) European Committee for Standardization (CEN) 'work program Nanotechnologies' (CEN/TC 352) IEC group for nanotechnology standardization for electrical and electronic products and systems (TC 113) IEEE Nanotechnology Standards Working Group ISO Technical Committee on Nanotechnologies (TC 229) Organization for Economic Cooperation & Development (OECD) Working party on Manufactured Nanomaterials (WPNM) Towards a nanotechnology nomenclature and terminology Ultimately, nanotechnology will require agreed international standards. One of the first tasks on everyone's plate – and the fundamental building block for any emerging industry – is a consistent and globally-accepted nomenclature and terminology. Without a precise and widely accepted terminology, communications about nanotechnology's risks and benefits are riddled with overgeneralizations. For example, the term 'carbon nanoparticles' often is used to describe in one phrase a range of very diverse nanomaterials such as fullerenes, single-, double-, or multi-walled carbon nanotubes, and even diesel exhaust. This seemingly simple issue of globally agreed terminology and definitions is surprisingly difficult. Even in the year 2019, the European Commission saw the need to release a report ("The EU gets specific about nanomaterials") that provides recommendations for a harmonized and coherent implementation of the nanomaterial definition in any specific regulatory context at European Union and national level. And this concerns only Europe! (also read: "Definition of the term 'nanomaterial'") Following the nanotechnology terminology, the next requirements on everyone's list are specifications and tests needed to support nanoscale measurement and characterization; as well as how nanotechnology will impact health, safety and the environment. Globally accepted nanotechnology standards will support worker, public and environmental safety and underpin commercialization and procurement of nanotechnologies in various industries. Given the current discussion about the potential risks of engineered nanomaterials, one of the key functions of nanotechnology standards will be the safety aspect of products. Today, products that contain nanomaterials, especially in the food and cosmetics industry, don't require any special labeling. Once the appropriate standards have been developed and accepted, product labels could refer to these standards, assuring the consumer that this particular product has undergone rigorous safety testing based on best practice and is considered safe. .clearfix::after { content: ""; clear: both; display: table; } By Michael Berger – Michael is author of three books by the Royal Society of Chemistry: Nano-Society: Pushing the Boundaries of Technology, Nanotechnology: The Future is Tiny, and Nanoengineering: The Skills and Tools Making Technology Invisible Copyright © Nanowerk LLC googletag.cmd.push(function() { googletag.display('div-gpt-ad-1589722303187-0'); }); @import url(https://static.mailerlite.com/assets/plugins/groot/modules/includes/groot_fonts/import.css?version=1620372); .ml-form-embedSubmitLoad{display:inline-block;width:20px;height:20px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}.ml-form-embedSubmitLoad:after{content:" ";display:block;width:11px;height:11px;margin:1px;border-radius:50%;border:4px solid #fff;border-color:#fff #fff #fff transparent;animation:ml-form-embedSubmitLoad 1.2s linear infinite}@keyframes ml-form-embedSubmitLoad{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}#mlb2-3184762.ml-form-embedContainer{box-sizing:border-box;display:table;margin:0 auto;position:static;width:100%!important}#mlb2-3184762.ml-form-embedContainer button,#mlb2-3184762.ml-form-embedContainer h4,#mlb2-3184762.ml-form-embedContainer p,#mlb2-3184762.ml-form-embedContainer span{text-transform:none!important;letter-spacing:normal!important}#mlb2-3184762.ml-form-embedContainer .ml-form-embedWrapper{background-color:#f6f6f6;background-image:url(https://bucket.mlcdn.com/a/2675/2675491/images/3af670bab6bfcebd983b0d32ff34d50c3ae7b098.png);background-position:center center;background-repeat:no-repeat;background-size:cover;border-width:0;border-color:transparent;border-radius:4px;border-style:solid;box-sizing:border-box;display:inline-block!important;margin:0;padding:0;position:relative}#mlb2-3184762.ml-form-embedContainer .ml-form-embedWrapper.embedDefault,#mlb2-3184762.ml-form-embedContainer .ml-form-embedWrapper.embedPopup{width:400px}#mlb2-3184762.ml-form-embedContainer .ml-form-embedWrapper.embedForm{max-width:400px;width:100%}#mlb2-3184762.ml-form-embedContainer .ml-form-align-left{text-align:left}#mlb2-3184762.ml-form-embedContainer .ml-form-align-center{text-align:center}#mlb2-3184762.ml-form-embedContainer .ml-form-align-de