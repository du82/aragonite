title = "Nanotechnology Introduction: A Complete Beginner's Guide"
description = "Nanotechnology is revolutionizing medicine, electronics, and more. Discover how controlling matter at the atomic level leads to incredible breakthroughs."
full_description = '''Nanotechnology Introduction: A Complete Beginner's Guide Content Understanding Nanotechnology: The Basics – The Nanoscale – How Small Is Nano? – Defining Nanotechnology – It's Not That Simple – Who Coined the Term Nanotechnology? Why Nanotechnology Matters: Benefits and Impact – Why Does Nanotechnology Matter? – Surface Area and Quantum Size Effects Applications of Nanotechnology: Where It's Being Used – Novel Nanotechnology Materials and Applications – Nanoscience And Nanotechnologies Are Not New – What Does Nanotech Do? Current Uses of Nanotechnology – Nanotechnology in Electronics and Information Technology – Nanotechnology in Medicine – Nanotechnology in Energy – Nanotechnology in Environmental Remediation – Nanotechnology in Agriculture – Nanotechnology in the Cosmetics Industry – Nanotechnology in the Food Industry – Nanotechnology in Materials and Manufacturing Finally, a Word of Caution Frequently Asked Questions (FAQs) Regarding Nanotechnology Nanotechnology deals with the understanding and control of matter at the atomic and molecular level, unlocking unique properties for novel applications. Understanding Nanotechnology: The Basics What is Nanotechnology? More specifically, nanotechnology is the imaging, modeling, measuring, design, characterization, production, and application of structures, devices, and systems by controlled manipulation of size and shape at the nanometer scale (atomic, molecular, and macromolecular scale) that produces structures, devices, and systems with at least one novel/superior characteristic or property. (source) The Nanoscale – How Small Is Nano? Dimensions between approximately 1 and 100 nanometers are known as the nanoscale. To see where 'nano' fits on the scale of things, check out our metric prefix table with examples and an interactive tutorial: View the Milky Way at 10 million light years from the Earth. Then move through space towards the Earth in successive orders of magnitude until you reach a tall oak tree. After that, begin to move from the actual size of a leaf into a microscopic world that reveals leaf cell walls, the cell nucleus, chromatin, DNA and finally, into the subatomic universe of electrons and protons. Some examples to demonstrate the size of the nanoscale. (© Nanowerk) (click on image to enlarge) Defining Nanotechnology (nan'o•tech•nol'o•gy) – It's Not That Simple... One of the problems facing this technology is the confusion about how to define nanotechnology. Most revolve around the study and control of phenomena and materials at length scales below 100 nm and quite often they make a comparison with a human hair, which is about 50 000 to 100 000 nm wide. For instance, in zero-dimensional (0D) nanomaterials all the dimensions are measured within the nanoscale (no dimensions are larger than 100 nm); in two-dimensional nanomaterials (2D), two dimensions are outside the nanoscale; and in three-dimensional nanomaterials (3D) are materials that are not confined to the nanoscale in any dimension. This class can contain bulk powders, dispersions of nanoparticles, bundles of nanowires, and nanotubes as well as multi-nanolayers. Check our Frequently Asked Questions to get more details. For instance, in zero-dimensional (0D) nanomaterials all the dimensions are measured within the nanoscale (no dimensions are larger than 100 nm); in two-dimensional nanomaterials (2D), two dimensions are outside the nanoscale; and in three-dimensional nanomaterials (3D) are materials that are not confined to the nanoscale in any dimension. This class can contain bulk powders, dispersions of nanoparticles, bundles of nanowires, and nanotubes as well as multi-nanolayers. Check our Frequently Asked Questions to get more details. Some definitions include a reference to molecular nanotechnology and 'purists' argue that any definition needs to include a reference to "functional systems". The inaugural issue of Nature Nanotechnology asked 13 researchers from different areas what nanotechnology means to them and the responses, from enthusiastic to skeptical, reflect a variety of perspectives. Another important criteria for the definition is the requirement that the nanostructure is man-made, i.e. a synthetically produced nanoparticle or nanomaterial. Otherwise you would have to include every naturally formed biomolecule and material particle, in effect redefining much of chemistry and molecular biology as 'nanotech. Who Coined the Term Nanotechnology? The term was coined in 1974 by Norio Taniguichi of of Tokyo Science University to describe semiconductor processes such as thin-film deposition that deal with control on the order of nanometers. His definition still stands as the basic statement today: "Nano-technology mainly consists of the processing of separation, consolidation, and deformation of materials by one atom or one molecule." Many argue that the history of nanotechnology starts with Richard Feynman's classic talk in December 1959: There's Plenty of Room at the Bottom - An Invitation to Enter a New Field of Physics: Why Nanotechnology Matters: Benefits and Impact Why Does Nanotechnology Matter? Unusual physical, chemical, and biological properties can emerge in materials at the nanoscale. These properties may differ in important ways from the properties of bulk materials and single atoms or molecules. The bulk properties of materials often change dramatically with nano ingredients. Composites made from particles of nano-size ceramics or metals smaller than 100 nanometers can suddenly become much stronger than predicted by existing materials-science models. For example, metals with a so-called grain size of around 10 nanometers are as much as seven times harder and tougher than their ordinary counterparts with grain sizes in the hundreds of nanometers. The causes of these drastic changes stem from the weird world of quantum physics. The bulk properties of any material are merely the average of all the quantum forces affecting all the atoms. As you make things smaller and smaller, you eventually reach a point where the averaging no longer works. Surface Area and Quantum Size Effects The properties of materials can be different at the nanoscale for two main reasons: Surface Area First, nanomaterials have a relatively larger surface area when compared to the same mass of material produced in a larger form. This can make materials more chemically reactive (in some cases materials that are inert in their larger form are reactive when produced in their nanoscale form), and affect their strength or electrical properties. Quantum Size Effects Second, quantum size effects can begin to dominate the behavior of matter at the nanoscale – particularly at the lower end – affecting the optical, electrical and magnetic behavior of materials. This effect describes the physics of electron properties in solids with great reductions in particle size. This effect does not come into play by going from macro to micro dimensions. However, it becomes dominant when the nanometer size range is reached. We explain surface area and quantum size effects in detail in our explainer on why nanotechnology is so special. The fascination with nanotechnology stems from these unique quantum and surface phenomena that matter exhibits at the nanoscale. They improve existing industrial processes, materials and applications in many fields – and allows entirely new ones. (adsbygoogle = window.adsbygoogle || []).push({}); Applications of Nanotechnology: Where It's Being Used Novel Nanotechnology Materials and Applications There are different ways of manipulating matter at the nanoscale. The two notions you hear most are top-down and bottom-up methods. Briefly, that means that you make a nanomaterial either by by taking a block of material and remove the bits and pieces you don't want until you get the shape and size you do want (that's top-down); or you use nature's self-organizing processes (that's called self-assembly) to build something from the bottom-up (we explain this in greater detail in our article on nanomanufacturing). The key to using self-assembly as a controlled and directed fabrication process lies in designing the components that are required to self-assemble into desired patterns and functions. With regard to nanoscale materials, there are plenty of examples we could talk about here – nanoparticles, quantum dots, nanowires, nanofibers, ultrathin-films, MXenes, etc. One example, though, that is exemplary of how an 'old' material gets an exciting new life through nanoscale technologies is the element carbon. Natural carbon can exist in two very different types and is know to everyone: graphite and diamond. Three additional forms that were discovered between 1985 and 2004 have caused the current excitement among researchers about carbon nanomaterials – fullerenes, carbon nanotubes, and in particular graphene, often hyped as a 'wonder material'. Current applications of nanomaterials include very thin coatings used, for example, in electronics and active surfaces (such as self-cleaning windows). In most applications the nanomaterial will be fixed or embedded but in some, such as those used in cosmetics and in some environmental remediation applications, free nanoparticles are used. The ability to engineer materials to very high precision and accuracy (smaller than 100nm) is leading to considerable benefits in a wide range of industrial sectors, for instance in the production of components for the information and communication technology, automotive and aerospace industries. A mite, less than 1 mm in size, approaching a microscale gear chain. (Image: Sandia National Laboratories) Some 20-30 years ago, microelectromechanical systems (MEMS) emerged in industrial manufacturing in a major way. MEMS consist of any combination of mechanical (levers, springs, membranes, etc.) and electrical (resistors, capacitors, inductors, etc.) components to work as sensors or actuators. The size of today's smartphones would be impossible without the use of numerous MEMS devices. Apart from accelerometers and gyroscopes, smartphones contain micro-mirrors, image sensors, auto-focus actuators, pressure sensors, magnetometers, microphones, proximity sensors and many more. Another example from everyday life is the use of MEMS as accelerometers in modern automobile airbags where they sense rapid deceleration and, if the force is beyond a programmed threshold, initiate the inflation of the airbag. Then, researchers took a further step down the size scale and have begun exploring another level of miniaturization – nanoelectromechanical systems (NEMS). NEMS are showning great promise as highly sensitive detectors of mass, displacement, charge, and energy. Nanoscience And Nanotechnologies Are Not New While closely related, nanoscience and nanotechnology have distinct focuses. Nanoscience is primarily concerned with understanding the fundamental properties and behaviors of materials at the nanoscale. In contrast, nanotechnology applies this knowledge to create materials, devices, and systems with unique functionalities for various applications. Essentially, nanoscience provides the foundation upon which nanotechnology is built. Then, researchers took a further step down the size scale and have begun Nanoscience and nanotechnologies, while seeming novel, have been part of scientific endeavors for many decades. In some senses, nanoscience and nanotechnologies are not new. Chemists have been making polymers, which are large molecules made up of nanoscale subunits, for many decades and nanotechnologies have been used to create the tiny features on computer chips for the past 30 years. However, advances in the tools that now allow individual atoms and molecules to be examined and probed with great precision have enabled the expansion and development of nanoscience and nanotechnologies. With new tools came new fundamental concepts and it turned out that the mechanical rules that govern the nanoworld are quite different from our everyday, macroworld experience. In particular, ongoing quest for miniaturization has resulted in tools such as the atomic force microscope (AFM) (read our detailed explainer on what AFMs are and what they do) or the scanning tunneling microscope (STM). Combined with refined processes such as electron beam lithography, these instruments allow the deliberate manipulation and manufacture of nanostructures (see for instance our article on how high-speed AFM enables real-time nanofabrication). Something that wasn't possible before. Today there are a number of tools that can be used to characterize the nanomechanics of biomolecular and cellular interactions. Besides cantilever-based instruments like the AFM, examples include optical tweezers, and magnetic pullers. (adsbygoogle = window.adsbygoogle || []).push({}); What Does Nano Tech Do? Nano tech improves existing industrial processes, materials and applications by scaling them down to the nanoscale in order to ultimately fully exploit the unique quantum and surface phenomena that matter exhibits at the nanoscale. This trend is driven by companies' ongoing quest to improve existing products by creating smaller components and better performance materials, all at a lower cost. This branch of engineering that deals with all aspects of the design, building, and use of engines, machines, and structures on the nanoscale is called nanoengineering (closely related to the terms nanofabrication and nanomanufacturing). At its core, nanotechnology engineering deals with nanoscale materials and how they interact to make useful materials, structures, and devices. It involves, nanostructuring, nanopatterning, and even 3D-printing (we explain nanoengineering in great detail here). A prime nanotechnology example of an industry where nanoscale manufacturing technologies are employed on a large scale and throughout is the semiconductor industry where device structures have reached the single nanometers scale. Your smartphone, smartwatch or tablet all are containing billions of transistors on a computer chip the size of a finger nail. So, what can nanotechnology do? There is almost no field today where nanotechnology isn't applied in some form or shape as things like surface coatings, sensors, electronic components, membranes, etc. – in medicine, environmental remediation, water filtration, nanoelectronics, food and agriculture, cosmetics, energy and batteries, space and aeronautics, automotive industries, displays, sports equipment and many more. If you select Learning Hub from our menu bar above you will find numerous articles on all these topics in the right column. Many products are defined as "nanotechnology product" because they contain nanoparticles in some form or other. For instance, many antimicrobial coatings contain silver in nanoscale form; food products and cosmetics contain nanoparticles; and some products are partially made with composite materials containing nanomaterials (e.g'''
