title = "Scientists lay out vision for AI-based 'labs of the future'"
description = "Scientists sketched a road map toward a longtime goal: development of autonomous, or self-driving, next-generation research laboratories."
full_description = '''Mar 01, 2025 Scientists lay out vision for AI-based 'labs of the future' Scientists sketched a road map toward a longtime goal: development of autonomous, or self-driving, next-generation research laboratories. (Nanowerk News) A workshop led by scientists at the Department of Energy’s Oak Ridge National Laboratory sketched a road map toward a longtime goal: development of autonomous, or self-driving, next-generation research laboratories. Download the report of the "Shaping the Future of Self-Driving Autonomous Laboratories" workshop. Scientists have dreamed for generations of high-tech laboratories operated via robotics at the push of a button. Recent advancements in artificial intelligence bring those dreams closer to reality than ever before, said Rafael Ferreira da Silva, an ORNL senior research scientist and lead author of the workshop’s report. “These facilities will be the labs of the future,” Ferreira da Silva said. “Everyone in the world right now is talking about AI. Our idea was to look ahead and think about what these AI-based labs of the future should look like, what obstacles we’re likely to have to overcome to get there and how to keep humans in the loop to ensure we follow sound scientific and ethical principles.” Researchers from Pacific Northwest National Laboratory, Sandia National Laboratories, SLAC National Accelerator Laboratory, Carnegie Mellon University, Johns Hopkins University and North Carolina State University also attended. Participants at the November workshop in Denver, Colorado, explored ideas for a unified network of autonomous laboratories across institutions and scientific disciplines. Key recommendations included: The ideas align with the work of ORNL’s Interconnected Science Ecosystem, or INTERSECT, initiative. INTERSECT seeks to connect world-class scientific instruments — such as ORNL’s Spallation Neutron Source, home to the world’s most intense neutron-scattering system — with robot-controlled laboratories and leadership-class computing resources such as Frontier, the world’s first exascale supercomputer, housed at ORNL’s Oak Ridge Leadership Computing Facility. The SNS and OLCF are DOE Office of Science user facilities. INTERSECT achievements so far include an automated microscopy project and an automated additive manufacturing laboratory for printing complex metal parts. The goal: automate routine work and streamline the laboratory process for a faster, more efficient pipeline from research to breakthrough results, shrinking the work of years into minutes. “Automated platforms provide ideal solutions to conduct monotonous and time-consuming tasks 24-7,” said Ben Mintz, INTERSECT’s co-director. “This frees up researchers to devote more time for analyzing data, formulating new hypotheses and performing more complex tasks.” Some industrial firms such as Emerald Cloud Lab, Siemens, GE and AutomationDirect have already developed fully or partially automated lab systems that rely on custom instruments, hardware and software. Those systems can offer useful insights if not a one-size-fits-all approach. “We need to rethink how we do science,” said Moore, INTERSECT’s co-director. “These new AI tools hold tremendous potential to accelerate discovery, but they come with inherent limitations. Ultimately, humans will continue guiding the scientific process, and we need to figure out how best to integrate our insight with this rapidly evolving technology.” The effort won’t be defined by ORNL alone. Attendees proposed a consortium that could help serve as a clearinghouse for ideas and benchmarks, similar to DOE’s Exascale Computing Project, which helped coordinate the development of software applications for the first generation of exascale computers. “This report isn’t the final word, nor should it be,” Ferreira da Silva said. “We want to drive the conversation and encourage the next steps. DOE labs like ORNL have a unique advantage to take the lead for two reasons: We have the scientific and computing resources to make this happen, and we have the people and skills to fine-tune it. Building these labs will be an iterative process, so we’ll have a lot of fine-tuning to do.” Source: Oak Ridge National Laboratory (Note: Content may be edited for style and length) googletag.cmd.push(function() { googletag.display('div-gpt-ad-1589722303187-0'); }); @import url(https://static.mailerlite.com/assets/plugins/groot/modules/includes/groot_fonts/import.css?version=1620372); .ml-form-embedSubmitLoad{display:inline-block;width:20px;height:20px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}.ml-form-embedSubmitLoad:after{content:" ";display:block;width:11px;height:11px;margin:1px;border-radius:50%;border:4px solid #fff;border-color:#fff #fff #fff transparent;animation:ml-form-embedSubmitLoad 1.2s linear infinite}@keyframes ml-form-embedSubmitLoad{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}#mlb2-3178312.ml-form-embedContainer{box-sizing:border-box;display:table;margin:0 auto;position:static;width:100%!important}#mlb2-3178312.ml-form-embedContainer button,#mlb2-3178312.ml-form-embedContainer h4,#mlb2-3178312.ml-form-embedContainer p,#mlb2-3178312.ml-form-embedContainer span{text-transform:none!important;letter-spacing:normal!important}#mlb2-3178312.ml-form-embedContainer .ml-form-embedWrapper{background-color:#f6f6f6;background-image:url(https://bucket.mlcdn.com/a/2675/2675491/images/3af670bab6bfcebd983b0d32ff34d50c3ae7b098.png);background-position:center center;background-repeat:no-repeat;background-size:cover;border-width:0;border-color:transparent;border-radius:4px;border-style:solid;box-sizing:border-box;display:inline-block!important;margin:0;padding:0;position:relative}#mlb2-3178312.ml-form-embedContainer .ml-form-embedWrapper.embedDefault,#mlb2-3178312.ml-form-embedContainer .ml-form-embedWrapper.embedPopup{width:400px}#mlb2-3178312.ml-form-embedContainer .ml-form-embedW