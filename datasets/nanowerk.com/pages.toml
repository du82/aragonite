title = "Development of 'transparent stretchable substrate' without image distortion could revolutionize next-generation displays"
description = "Overcoming Poisson's ratio enables fully transparent, distortion-free, non-deformable display substrates."
full_description = '''Feb 28, 2025 Development of 'transparent stretchable substrate' without image distortion could revolutionize next-generation displays Overcoming Poisson's ratio enables fully transparent, distortion-free, non-deformable display substrates. (Nanowerk News) Stretchable display materials, which are gaining traction in the next-generation display market, have the advantage of being able to stretch and bend freely, but the limitations of existing materials have resulted in distorted screens and poor fit. General elastomeric substrates are prone to screen distortion due to the 'Poisson's ratio' phenomenon, in which stretching in one direction causes the screen to shrink in the vertical direction. In particular, electronics that are in close contact with the skin, such as wearable devices, are at risk of wrinkling or pulling on the skin during stretching and shrinking, resulting in poor fit and performance. A research team led by Dr. Jeong Gon Son of the Korea Institute of Science and Technology (KIST) and Professor Yongtaek Hong of Seoul National University has developed a nanostructure-aligned stretchable substrate that dramatically lowers the Poisson's ratio. The findings have been published in Advanced Materials ("Fully Transparent and Distortion-Free Monotonically Stretchable Substrate by Nanostructure Alignment"). (Top) Distortion problems in elastomeric materials during stretching and distortion-free stretching. (Bottom) Typical elastomer with Poisson's ratio of 0.5 (severe vertical contraction, left), and aligned fiber composite for controlling Poisson's ratio near 0 due to the high stiffness of fibers resisting vertical contraction under strained states (right). (Image: Korea Institute of Science and Technology) The research is notable for its ability to reduce the Poisson's ratio while maintaining transparency, solving the problems of screen distortion and light scattering at the same time. The researchers achieved this by combining two key ideas. In the first, they utilized block copolymers, which are polymer blocks linked together to align the internal nanostructures. The block copolymer(SIBS) consists of a stiff 'polystyrene' (PS) and a softer 'polybutylene' (PIB), which can be arranged in one direction to maximize the difference in elasticity between the parallel and perpendicular directions to reduce shrinkage. While conventional elastomers have a Poisson's ratio of 0.4 to 0.5, the researchers have reduced it to a Poisson's ratio of 0.07 or less, which means that there is almost no shrinkage perpendicular to the substrate, even in the stretching direction, and screen distortion is greatly reduced. The second idea was to introduce a shear-rolling process to align the nanostructures evenly across the substrate. It uses speed differences between rollers and stages to apply a uniform shear force at high temperatures. This process allowed the nanostructures to be reliably aligned on thick substrates without compromising transparency. In experiments, the researchers found that there was little longitudinal shrinkage, even when the substrate was stretched by more than 50% in the vertical direction. The researchers applied the developed substrate to a real device and observed changes in the pixel arrangement. The conventional elastomeric substrate, when stretched by 50 percent, showed distortion with jagged spacing between pixels or stuck vertical pixels. The nanostructure-aligned substrate, on the other hand, had an even arrangement of pixels, resulting in an unbroken image and transparency without wrinkles or rough surfaces. The new stretchable substrate is expected to be used as a core material in various fields such as next-generation displays, wearable electronics, and solar cells. In addition, the shear rolling process used in this study can be applied to other block copolymers and polymer films, making it a suitable technology for processing large areas in a simple manner. "This research proposes a new method to develop a distortion-free and completely transparent stretchable substrate by precisely controlling the nanostructure, and the shear-rolling process to implement it can be easily applied to mass production and industrialization," said Dr. Jeong Gon Son of KIST. "We are currently conducting research to realize a real display device with no distortion even when tensile by transferring display light-emitting devices using this substrate." Source: Korea Institute of Science and Technology (Note: Content may be edited for style and length) googletag.cmd.push(function() { googletag.display('div-gpt-ad-1589722303187-0'); }); @import url(https://static.mailerlite.com/assets/plugins/groot/modules/includes/groot_fonts/import.css?version=1620372); .ml-form-embedSubmitLoad{display:inline-block;width:20px;height:20px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}.ml-form-embedSubmitLoad:after{content:" ";display:block;width:11px;height:11px;margin:1px;border-radius:50%;border:4px solid #fff;border-color:#fff #fff #fff transparent;animation:ml-form-embedSubmitLoad 1.2s linear infinite}@keyframes ml-form-embedSubmitLoad{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}#mlb2-3178312.ml-form-embedContainer{box-sizing:border-box;display:table;margin:0 auto;position:static;width:100%!important}#mlb2-3178312.ml-form-embedContainer button,#mlb2-3178312.ml-form-embedContainer h4,#mlb2-3178312.ml-form-embedContainer p,#mlb2-3178312.ml-form-embedContainer span{text-transform:none!important;letter-spacing:normal!important}#mlb2-3178312.ml-form-embedContainer .ml-form-embedWrapper{background-color:#f6f6f6;background-image:url(https://bucket.mlcdn.com/a/2675/2675491/images/3af670bab6bfcebd983b0d32ff34d50c3ae7b098.png);background-position:center center;background-repeat:no-repeat;background-size:cover;border-width:0;border-color:transparent;border-radius:4px;border-style:solid;box-sizing:border-box;display: