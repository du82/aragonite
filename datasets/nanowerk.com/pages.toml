["https://www.nanowerk.com/nanotechnology-news3/newsid=66476.php"]
title = "Unraveling how a 'magnetic twist' induces one-way electric flow"
description = "A twist you'll never see coming: a breakthrough in understanding the relationship between chirality and electric flow at a microscopic level may help us develop chiral information technology."
full_description = '''Feb 27, 2025 Unraveling how a 'magnetic twist' induces one-way electric flow A twist you'll never see coming: a breakthrough in understanding the relationship between chirality and electric flow at a microscopic level may help us develop chiral information technology. (Nanowerk News) Researchers at Tohoku University, the University of Manchester, and Osaka University have made a breakthrough that has the potential to ignite the development of next-gen chiral information technology. The findings have been published in PNAS ("Band asymmetry-driven nonreciprocal electronic transport in a helimagnetic semimetal α-EuP3"). Image of the micro-fabricated device made from the chiral magnetic material α-EuP3. (Image: A. H. Mayo et al.) Chirality is a property of materials where their mirror image is not identical to the original--just like our left and right hands. This unique characteristic creates two distinct states, which researchers believe could one day be used to store digital information, much like the "0" and "1" states in conventional computing. "Among various materials, helimagnets are particularly interesting because they exhibit chirality through their magnetic structure," says Alex Hiro Mayo (Tohoku University), "However, a major challenge in using these materials for information storage lies in how to effectively read out their chirality." One promising solution comes from an unusual effect called nonreciprocal electronic transport, where electric current flows more easily in one direction than the other. This one-way electric flow, known as rectification, directly reflects the chirality of the material and could serve as a way to "read" magnetic information. "If we can find a way to accurately use chirality to store data, it would mean a new era for information storage devices. However, the microscopic mechanism behind this rectification effect in chiral magnets is not yet fully understood. Unraveling this mechanism is essential for establishing material design principles that enable efficient chirality detection and enhanced readout performance," explains Mayo. This collaborative research project addresses this knowledge gap by focusing on a unique quantum material - α-EuP3 - which is a helimagnetic material where the local magnetic moments of europium (Eu) atoms create a chiral magnetic texture. They carefully controlled the magnetic structure using external magnetic fields, which in turn manipulated the material's electronic behavior to reveal the microscopic origins of nonreciprocal transport. Unlike conventional metals with complex "electronic band structures", which dictate how electrons flow inside a material, α-EuP3 has a simpler electronic landscape, making it an ideal platform for uncovering the direct relationship between magnetism and electron transport. By altering the material's magnetic state between chiral and achiral phases, researchers observed a strong rectification effect in the chiral phase, which completely vanished as soon as the magnetic state transitioned to the achiral phase. Relationship among the magnetic structure, electronic structure, and electron flow in the material. As a magnetic field is applied along the spiral axis, the magnetic structure deforms into a conical shape, inducing asymmetry in the electronic landscape and resulting in electron-flow rectification. Once the system becomes achiral (i.e., ferromagnetic, as shown in this figure), the rectification effect vanishes. (Image: A. H. Mayo et al.) Combining experimental results with theoretical calculations, they demonstrated that the "magnetic twist" in the chiral phase directly induces electronic band asymmetry, which in turn triggers one-way electric flow. This work provides a crucial microscopic-level understanding of how magnetic chirality governs electronic transport, offering key insights for designing new functional quantum materials and enabling future applications in chiral information storage and next-generation electronic devices. Source: Tohoku University (Note: Content may be edited for style and length) googletag.cmd.push(function() { googletag.display('div-gpt-ad-1589722303187-0'); }); @import url(https://static.mailerlite.com/assets/plugins/groot/modules/includes/groot_fonts/import.css?version=1620372); .ml-form-embedSubmitLoad{display:inline-block;width:20px;height:20px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}.ml-form-embedSubmitLoad:after{content:" ";display:block;width:11px;height:11px;margin:1px;border-radius:50%;border:4px solid #fff;border-color:#fff #fff #fff transparent;animation:ml-form-embedSubmitLoad 1.2s linear infinite}@keyframes ml-form-embedSubmitLoad{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}#mlb2-3178312.ml-form-embedContainer{box-sizing:border-box;display:table;margin:0 auto;position:static;width:100%!important}#mlb2-3178312.ml-form-embedContainer button,#mlb2-3178312.ml-form-embedContainer h4,#mlb2-3178312.ml-form-embedContainer p,#mlb2-3178312.ml-form-embedContainer span{text-transform:none!important;letter-spacing:normal!important}#mlb2-3178312.ml-form-embedContainer .ml-form-embedWrapper{background-color:#f6f6f6;background-image:url(https://bucket.mlcdn.com/a/2675/2675491/images/3af670bab6bfcebd983b0d32ff34d50c3ae7b098.png);background-position:center center;background-repeat:no-repeat;background-size:cover;border-width:0;border-color:transparent;border-radius:4px;border-style:solid;box-sizing:border-box;display:inline-block!important;margin:0;padding:0;position:relative}#mlb2-3178312.ml-form-embedContainer .ml-form-embedWrapper.embedDefault,#mlb2-3178312.ml-form-embedContainer .ml-form-embedWrapper.embedPopup{width:400px}#mlb2-3178312.ml-form-embedContainer .ml-form-embedWrapper.embedForm{max-width:400px;width:100%}#mlb2-3178312.ml-form-embedContainer .ml-form-align-left{text-align:left}#mlb2-3178312.ml-form-embedContainer .ml-form-align-center{text-