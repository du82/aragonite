title = "Researchers develop light-guided siRNA delivery system based on cyanobacteria"
description = "Researchers report development of an innovative intelligent light-guided biohybrid system, the CTPA/siCSF1R system, to target tumor-associated macrophages (TAMs), thus enabling precise spatiotemporal siRNA delivery."
full_description = '''Nov 26, 2024 Researchers develop light-guided siRNA delivery system based on cyanobacteria (Nanowerk News) In a study published in Cell Reports Physical Science ("Cyanobacteria-intelligent biohybrid system enables light-guided tumor-associated macrophage-specific siRNA delivery"), a research team led by Prof. CAI Lintao from the Shenzhen Institutes of Advanced Technology (SIAT) of the Chinese Academy of Sciences reported its development of an innovative intelligent light-guided biohybrid system, the CTPA/siCSF1R system, to target tumor-associated macrophages (TAMs), thus enabling precise spatiotemporal siRNA delivery. This system enhances the tumor microenvironment and supports precise photoimmunotherapy. TAMs are crucial immune cells in the tumor microenvironment and key targets for tumor immunotherapy, with gene therapy being an important approach. However, existing gene carriers are unsatisfactory due to poor targeting, limited lysosomal escape, and the negative effects of a hypoxic immunosuppressive microenvironment, which limit their clinical efficacy. In this study, researchers employed a living biological carrier, the cyanobacterium Synechocystis sp. PCC6803 (“cyan”), which exhibits self-driven tumor targeting and phototactic capabilities. These characteristics make it an excellent vehicle for precise drug delivery under controllable external forces. Consequently, cyan’s phototactic behavior, along with its ability to produce oxygen through photosynthesis, has potential for delivering nucleic acid drugs to solid tumors. The CTPA/siCSF1R system consists of a triblock polyamino acid (TPA) gene vector encapsulating siRNA, which is conjugated to the surface of photosynthetic cyanobacteria. It utilizes the inherent self-driven and phototactic abilities of cyanobacteria to achieve precise targeting of TAMs within the tumor microenvironment. The light-guided production of reactive oxygen species by cyanobacteria and the protonation of TPAs disrupt the lysosomal membrane, facilitating the release of siRNA into the cytoplasm of TAMs. Meanwhile, oxygen produced by cyanobacteria through photosynthesis enhances the tumor microenvironment, promoting the efficacy of siRNA delivery and the reprogramming of TAMs. Experimental results show that the CTPA/siCSF1R system effectively reprograms TAMs to the M1 phenotype, promotes the production of pro-inflammatory cytokines, and induces a strong immune response that inhibits tumor growth. Furthermore, the system exhibits excellent biosafety and does not cause significant toxicity to the organism. The system proposed in this study offers a promising approach for developing both efficient and safe nucleic acid delivery vectors as well as advancing tumor photoimmunotherapy. Source: Chinese Academy of Sciences (Note: Content may be edited for style and length) googletag.cmd.push(function() { googletag.display('div-gpt-ad-1589722303187-0'); }); @import url(https://static.mailerlite.com/assets/plugins/groot/modules/includes/groot_fonts/import.css?version=1620372); .ml-form-embedSubmitLoad{display:inline-block;width:20px;height:20px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}.ml-form-embedSubmitLoad:after{content:" ";display:block;width:11px;height:11px;margin:1px;border-radius:50%;border:4px solid #fff;border-color:#fff #fff #fff transparent;animation:ml-form-embedSubmitLoad 1.2s linear infinite}@keyframes ml-form-embedSubmitLoad{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}#mlb2-3184711.ml-form-embedContainer{box-sizing:border-box;display:table;margin:0 auto;position:static;width:100%!important}#mlb2-3184711.ml-form-embedContainer button,#mlb2-3184711.ml-form-embedContainer h4,#mlb2-3184711.ml-form-embedContainer p,#mlb2-3184711.ml-form-embedContainer span{text-transform:none!important;letter-spacing:normal!important}#mlb2-3184711.ml-form-embedContainer .ml-form-embedWrapper{background-color:#f6f