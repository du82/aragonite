title = "Nanotube Videos"
description = "Nanowerk's selection of nanotechnology videos"
full_description = '''The Top NanoTube Videos from the Nanowerk Youtube Channel Nanotechnology in Cancer TreatmentImagine a world where cancer treatment is more effective, less harmful, and highly personalized. This is the promise of nanotechnology in cancer treatment. By harnessing the power of the incredibly small, nanomedicine is transforming the way we diagnose and treat cancer. Watch videoEngineered Living MaterialsPicture this: instead of plastic bottles from oil or concrete made from sand, what if everyday things were grown from living organisms? That's the incredible promise of engineered living materials. Watch videoNanobots - Hype vs RealityLearn about nanobots with our deep dive into their real-world medical potential versus the sci-fi hype. Join us as we uncover what nanorobotics can really do today. Watch videoStoring the world's data in a drop of DNAImagine a world where every book, song, movie, and software could fit into the palm of your hand. This isn't science fiction; it's the reality of DNA data storage. Watch video2D Materials - And The Weird Concept of Zero DimensionsNanomaterials are fascinating tiny substances, and their size gives them some really special characteristics. Think of them in categories like 'zero'-dimensional, 'one'-dimensional, 'two'-dimensional and three-dimensional materials. 'Zero-dimensional???' you ask? This concept is initially challenging to grasp. So, let's unpack this. Watch videoNanophotonics - Managing Light at the NanoscaleExplore the fascinating world of nanophotonics and learn how controlling light at the nano-scale leads to breakthroughs in technology and medicine, from ultra-efficient solar panels to advanced medical diagnostics. Watch videoPerson-shaped robot liquifies to escape jailInspired by sea cucumbers, engineers have designed miniature robots that rapidly and reversibly shift between liquid and solid states. On top of being able to shape-shift, the robots are magnetic and can conduct electricity. Watch videoMicroelectronic SMARTLETsAssembly of architectures where multilayer pattern elements using microsystem technology fold up into 3D structures, self-assembling to form microelectronic SMARTLETs with self-propulsion. These SMARTLETs can then be aggregated passively or actively into higher hierarchical assemblies. Watch videoGrowing ultra-long carbon nanotubesAlthough carbon nanotube forests are hard to grow very long via conventional methods, a little tweak in technique can change things dramatically. Watch videoRobotic programmable matterVideo shows a simulated build of a large tower by three teams of robots, implementing the autonomous path planning algorithm. The construction was initiated from a base layer of voxels. Watch videoControlling the motion of a MOFBOTThis video shows a MOFBOT writing the letters "mof". By applying concepts developed in micro- and nanorobotics, researchers demonstrate the controlled motion and delivery of cargo payloads embedded in metal-organic frameworks. Watch videoConformal printing of 3D electrically small antennasAn electrically small antenna being patterned on the outer surface of the glass hemisphere. Watch videoCreating a magnetic liquid marbleIn contrast with the microchannel-based fluidics, the manipulation of discrete droplets without using microfluidic channels is a new field. Here, a liquid droplet is not confined to a closed channel and there is no risk of it being adsorbed on a channel wall. A liquid marble, a liquid encapsulated by non-wetting powder, could be a new microfluidic device, which is especially useful for handling single liquid droplet. Watch videoCell division of a HeLa cell with a sensor chip insideResearchers demonstrate a nanomechanical chip that can be internalized to detect intracellular pressure changes within living cells, enabling an interrogation method based on confocal laser scanning microscopy. Watch videoPatterned Bouncing and Directional Transportation of Water DropletsBionic functional surfaces allow the precise control of the directional bouncing of water. Watch videoSmart fluids navigate a jet-printed labyrinthFluids find path through a maze with a single inlet and outlet. The circuit was built by jetting a fluorocarbon through media plus red dye; when blue dye is pumped into the inlet, it takes the path of least resistance through the maze. Watch videoMicro- and nanomotors powered by water as the sole fuel sourceThis video shows the ultrafast propulsion of an AlGa/Ti micromotor in water. It shows time-lapse images, taken from SI Video 1, over a 300 ms period. A long tail of hydrogen bubbles generated on one side of the micromotor is clearly observed, reflecting the rapid spontaneous reaction of aluminum with the surrounding water. Watch videoSuperhydrophilic wool fabricsThis clip shows the process of the absorption of water droplets on the superhydrophilic wool fabrics. In the video, the fabric on the left is a pristine wool fabric and the right is a silica-grafted wool fabric. The water absorption rates of the silica-grafted wool fabric are fast and the drip diffusion radii are large, which is of great importance to realize the fast absorbing and quick-drying of water or perspiration on the surface of human skin. Watch videoAdaptive organic transistors for implantable electronicsA planar organic thin-film transistor responds to a temperature change, deploys into a helix and wraps around a rod after being inserted through a 150 ?m-thick opening in a thermal barrier. Watch video'''
