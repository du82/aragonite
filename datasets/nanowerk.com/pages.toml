["https://www.nanowerk.com/nanotechnology-news3/newsid=66480.php"]
title = "Physicists discover electron crystals in ultrathin graphene layers"
description = "Electrons in rhombohedral pentalayer graphene form unexpected crystalline states, revealing new quantum behaviors and expanding possibilities for exotic electronic phases."
full_description = '''Feb 27, 2025 Physicists discover electron crystals in ultrathin graphene layers Electrons in rhombohedral pentalayer graphene form unexpected crystalline states, revealing new quantum behaviors and expanding possibilities for exotic electronic phases. (Nanowerk News) MIT physicists report the unexpected discovery of electrons forming crystalline structures in a material only nanometers thick. The work adds to a gold mine of discoveries originating from the material, which the same team discovered about three years ago. In a paper published in Nature ("Extended quantum anomalous Hall states in graphene/hBN moiré superlattices"), the team describes how electrons in devices made, in part, of the material can become solid, or form crystals, by changing the voltage applied to the devices when they are kept at a temperature similar to that of outer space. Under the same conditions, they also showed the emergence of two new electronic states that add to work they reported last year (Nature, "Fractional quantum anomalous Hall effect in multilayer graphene") showing that electrons can split into fractions of themselves. The physicists were able to make the discoveries thanks to new custom-made filters for better insulation of the equipment involved in the work. These allowed them to cool their devices to a temperature an order of magnitude colder than they achieved for the earlier results. The team also observed all of these phenomena using two slightly different “versions” of the material, one composed of five layers of atomically thin carbon; the other composed of four layers. This indicates “that there’s a family of materials where you can get this kind of behavior, which is exciting,” says Long Ju, an assistant professor in the MIT Department of Physics who led the work. Ju is also affiliated with MIT’s Materials Research Laboratory and Research Lab of Electronics. Referring to the material, known as rhombohedral pentalayer graphene, Ju says, “We found a gold mine, and every scoop is revealing something new.” This graphic visualizes how electrons can behave as a solid (left, glacier-like structure) or liquid (river-like structure) depending on the voltage applied to a new material cooled to an ultra-low temperature akin to that of outer space. (Image: Michael Hurley and Sampson Wilcox/Research Laboratory of Electronics) New material Rhombohedral pentalayer graphene is essentially a special form of pencil lead. Pencil lead, or graphite, is composed of graphene, a single layer of carbon atoms arranged in hexagons resembling a honeycomb structure. Rhombohedral pentalayer graphene is composed of five layers of graphene stacked in a specific overlapping order. Since Ju and colleagues discovered the material, they have tinkered with it by adding layers of another material they thought might accentuate the graphene’s properties, or even produce new phenomena. For example, in 2023 they created a sandwich of rhombohedral pentalayer graphene with “buns” made of hexagonal boron nitride (Nature Nanotechnology, "Correlated insulator and Chern insulators in pentalayer rhombohedral-stacked graphene"). By applying different voltages, or amounts of electricity, to the sandwich, they discovered three important properties never before seen in natural graphite. Last year, Ju and colleagues reported yet another important and even more surprising phenomenon: Electrons became fractions of themselves upon applying a current to a new device composed of rhombohedral pentalayer graphene and hexagonal boron nitride. This is important because this “fractional quantum Hall effect” has only been seen in a few systems, usually under very high magnetic fields. The Ju work showed that the phenomenon could occur in a fairly simple material without a magnetic field. As a result, it is called the “fractional quantum anomalous Hall effect” (anomalous indicates that no magnetic field is necessary). New results In the current work, the Ju team reports yet more unexpected phenomena from the general rhombohedral graphene/boron nitride system when it is cooled to 30 millikelvins (1 millikelvin is equivalent to -459.668 degrees Fahrenheit). In last year’s paper, Ju and colleagues reported six fractional states of electrons. In the current work, they report discovering two more of these fractional states. They also found another unusual electronic phenomenon: the integer quantum anomalous Hall effect in a wide range of electron densities. The fractional quantum anomalous Hall effect was understood to emerge in an electron “liquid” phase, analogous to water. In contrast, the new state that the team has now observed can be interpreted as an electron “solid” phase — resembling the formation of electronic “ice” — that can also coexist with the fractional quantum anomalous Hall states when the system’s voltage is carefully tuned at ultra-low temperatures. One way to think about the relation between the integer and fractional states is to imagine a map created by tuning electric voltages: By tuning the system with different voltages, you can create a “landscape” similar to a river (which represents the liquid-like fractional states) cutting through glaciers (which represent the solid-like integer effect), Ju explains. Ju notes that his team observed all of these phenomena not only in pentalayer rhombohedral graphene, but also in rhombohedral graphene composed of four layers. This creates a family of materials, and indicates that other “relatives” may exist. “This work shows how rich this material is in exhibiting exotic phenomena. We’ve just added more flavor to this already very interesting material,” says Zhengguang Lu, a co-first author of the paper. Lu, who conducted the work as a postdoc at MIT, is now on the faculty at Florida State University. Source: By Elizabeth A. Thomson, MIT (Note: Content may be edited for style and length) googletag.cmd.push(function() { googletag.display('div-gpt-ad-1589722303187-0'); }); 