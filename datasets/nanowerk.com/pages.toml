["https://www.nanowerk.com/nanoelectronics.php"]
title = "Nanoelectronics - Definition and Applications"
description = "The term nanoelectronics refers to the use of nanotechnology in electronic components. These components are often only a few nanometers in size. The tinier electronic components become, the harder they are to manufacture"
full_description = '''Nanoelectronics – Nanotechnology in Electronics The term nanoelectronics refers to the use of nanotechnology in electronic components. These components are often only a few nanometers in size. However, the tinier electronic components become, the harder they are to manufacture. Nanoelectronics covers a diverse set of devices and materials, with the common characteristic that they are so small that physical effects alter the materials'properties on a nanoscale – inter-atomic interactions and quantum mechanical properties play a significant role in the workings of these devices. At the nanoscale, new phenomena take precedence over those that hold sway in the macro-world. Quantum effects such as tunneling and atomistic disorder dominate the characteristics of these nanoscale devices The first transistors built in 1947 were over 1 centimeter in size; the smallest working transistor today is 7 nanometers long – over 1.4 million times smaller (1 cm equals 10 million nanometers). The result of these efforts are billion-transistor processors where, once industry embraces 7nm manufacturing techniques, 20 billion transistor-based circuits are integrated into a single chip. Nanoelectronic Devices Spintronics Besides transistors, nanoelectronic devices play a role in data storage (memory). Here, spintronics – the study and exploitation in solid-state devices of electron spin and its associated magnetic moment, along with electric charge – is already an established technology. Read more: "Graphene spintronics - from science to technology". Illustration of electron spin in a graphene lattice. (Image: Bart van Wees) Spintronics also plays a role in new technologies that exploit quantum behavior for computing (read more: "Quantum computing moves forward with spintronics progress" and "The birth of topological spintronics"). Optoelectronics Electronic devices that source, detect and control light – i.e. optoelectronic devices – come in many shapes and forms. Highly energy-efficient (less heat generation and power consumption) optical communications are increasingly important because they have the potential to solve one of the biggest problems of our information age: energy consumption. In the field of nanotechnology, materials like nanofibers (see for instance: "Light-emitting nanofibers shine the way for optoelectronic textiles") and carbon nanotubes have been used and especially graphene has shown exciting potential for optoelectronic devices. Displays Display technologies can be grouped into three broad technology areas; Organic LEDs, electronic paper and other devices intended to show still images, and Field Emission Displays. For more, read our special section on Nanotechnology in Displays. Wearable, flexible electronics The age of wearable electronics is upon us as witnessed by the fast growing array of smart watches, fitness bands and other advanced, next-generation health monitoring devices such as electronic stick-on tattoos. If current research is an indicator, wearable electronics will go far beyond just very small electronic devices or wearable, flexible computers. Not only will these devices be embedded in textile substrates but an electronics device or system could ultimately become the fabric itself. Electronic textiles (e-textiles) will allow the design and production of a new generation of garments with distributed sensors and electronic functions. Such e-textiles will have the revolutionary ability to sense, act, store, emit, and move – think biomedical monitoring functions or new man-machine interfaces – while ideally leveraging an existing low-cost textile manufacturing infrastructure (see for instance "wearing single-walled carbon nanotube electronics on your skin", a "temporary tattoo to monitor glucose levels" or "graphene nanosensor tattoo on teeth monitors bacteria in your mouth"). Optical image of the graphene wireless sensor biotransferred onto the surface of a tooth. (Image: McAlpine Group, Princeton University) Nanoelectronics in Energy Solar cells and supercapacitors are examples of areas where nanoelectronics is playing a major role in energy generation and storage. To learn more read our detailed sections on Nanotechnology in Energy and Graphene Nanotechnology in Energy. Molecular Electronics Distinct from nanoelectronics, where devices are scaled down to nanoscale levels, molecular electronics deals with electronic processes that occur in molecular structures such as those found in nature, from photosynthesis to signal transduction. Molecular electronics aims at the fundamental understanding of charge transport through molecules and is motivated by the vision of molecular circuits to enable miniscule, powerful and energy efficient computers (see for instance: "Adding an optoelectronic component to molecular electronics").'''
