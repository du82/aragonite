title = "New method for designing artificial proteins"
description = "Researchers developed a method for designing large new proteins better than before and producing them with the desired properties in the laboratory."
full_description = '''Nov 21, 2024 New method for designing artificial proteins (Nanowerk News) Protein design aims to create customized antibodies for therapies, biosensors for diagnostics, or enzymes for chemical reactions. An international research team has now developed a method for designing large new proteins better than before and producing them with the desired properties in the laboratory. Their approach involves a new way of using the capabilities of the AI-based software Alphafold2, for which the Nobel Prize in Chemistry was awarded in 2024. Whether as building blocks, transport systems, enzymes, or antibodies, proteins play a vital role in our bodies. Researchers are, therefore, trying to recreate them or to design so-called de novo proteins that do not occur in nature. Such artificial proteins are designed to bind to certain viruses or transport drugs, for example. Scientists are increasingly using machine learning to design them. Recently, advances in this field were honored with the Nobel Prize in Chemistry: This year's Nobel Prize went to David Baker, a pioneer of de novo protein design, and to the developers of the software Alphafold2 Demis Hassabis and John Jumper. This software makes it possible to predict protein structures on the computer with high accuracy. An international team led by Hendrik Dietz, Professor of Biomolecular Nanotechnology at the Technical University of Munich (TUM), and Sergey Ovchinnikov, Professor of Biology at MIT, has now developed a method that uses Alphafold2's accurate structure prediction together with a so-called gradient descent approach for efficient protein design. It was published in the journal Science ("Scalable protein design using optimization in a relaxed sequence space"). Gradient descent is a common method for model optimization. In a step-by-step process, it can be used to identify deviations from the desired target function and adjust the parameters until the optimal result is achieved. In protein design, gradient descent can be used to compare the structure of new proteins predicted by AlphaFold2 with the desired protein structure. This allows scientists to further optimize their newly designed amino acid chain and the resulting structure. The latter largely determines the stability and function of the protein and depends on subtle energetic interactions. Researchers have developed a new method for designing de novo proteins with tailored properties. Their approach leverages the structure prediction capabilities of AlphaFold2, combining it with a virtual superposition of amino acids and an optimization process known as gradient descent. Using gradient descent optimization, they improve the predicted protein structure step by step until the desired structure is achieved. Color coding in the animation: The closer the hue is to dark blue, the more confident the program is in the structure prediction. Virtual superposition of the building blocks The new method makes it possible to design large new proteins better than before and to tailor them to the desired properties, for example, to bind precisely to other proteins. Their design process differs from previous approaches in several ways. "We have designed the process for new proteins so that we initially ignore the limits of what is physically possible. Usually, only one of the 20 possible building blocks is assumed at each point of the amino acid chain. Instead, we use a variant in which all possibilities are virtually superimposed,“ says Christopher Frank, doctoral candidate at the Chair of Biomolecular Nanotechnology and first author of the study. This virtual superposition cannot be directly translated into an actually producible protein. But it allows the protein to be iteratively optimized. “We improve the arrangement of the amino acids in several iterations until the new protein is very close to the desired structure," says Christopher Frank. This optimized structure is then used to determine the amino acid sequence that can actually be assembled to a protein in the laboratory. The crucial test: how do the predictions hold up in real life? The ultimate test for all newly designed proteins: does the actual structure correspond to the predicted construct and the desired function? Using the new method, the team designed more than 100 proteins virtually, produced them in the laboratory and tested them experimentally. „We were able to show that the structures that we designed are very close to the structures that are actually produced,” says Christopher Frank. Using their new method, they were able to produce proteins consisting of up to 1000 amino acids. “This brings us closer to the size of antibodies, and – just as with antibodies – we can then integrate several desired functions into such a protein,” explains Hendrik Dietz. „These could, for example, be motifs for recognizing and suppressing pathogens.” Source: Technical University of Munich (Note: Content may be edited for style and length) googletag.cmd.push(function() { googletag.display('div-gpt-ad-1589722303187-0'); }); @import url(https://static.mailerlite.com/assets/plugins/groot/modules/includes/groot_fonts/import.css?version=1620372); .ml-form-embedSubmitLoad{display:inline-block;width:20px;height:20px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}.ml-form-embedSubmitLoad:after{content:" ";display:block;width:11px;height:11px;margin:1px;border-radius:50%;border:4px solid #fff;border-color:#fff #fff #fff transparent;animation:ml-form-embedSubmitLoad 1.2s linear infinite}@keyframes ml-form-embedSubmitLoad{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}#mlb2-3184711.ml-form-embedContainer{box-sizing:border-box;display:table;margin:0 auto;position:static;width:100%!important}#mlb2-3184711.ml-form-embedContainer button,#mlb2-3184711.ml-form-embedContainer h4,#mlb2-3184711.ml-form-embedContainer p,#mlb2-3184711.ml-form-embedContainer span{text-t