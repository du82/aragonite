title = "Scientists unveil critical nanoscale phenomena for more efficient and stable perovskite solar cells"
description = "Scientists advance nanoscale studies of perovskite solar cells, boosting efficiency, durability, and affordability to expand applications and industry impact."
full_description = '''Feb 26, 2025 Scientists unveil critical nanoscale phenomena for more efficient and stable perovskite solar cells Scientists advance nanoscale studies of perovskite solar cells, boosting efficiency, durability, and affordability to expand applications and industry impact. (Nanowerk News) In a significant advancement for boosting renewable energy generation development, the School of Engineering of the Hong Kong University of Science and Technology (HKUST) has taken the lead in breaking through studies of the nanoscale properties of perovskite solar cells (PSCs). This initiative has resulted in the development of more efficient and durable cells, poised to substantially diminish costs and broaden applications, thereby connecting scientific research with the needs of the business community. The findings were published in Nature Nanotechnology ("Nanoscopic cross-grain cation homogenization in perovskite solar cells"). Schematic illustration of the nontrivial cation immobilization at a nanoscale groove trap and the cation relaxation after its shallowing. (Image: HKUST) Compared to conventional silicon solar cells, PSCs can potentially attain higher power conversion efficiencies and feature the utilization of lower-cost materials and more sustainable manufacturing processes. Therefore, PSCs have become a cutting-edge research area in energy and sustainability. However, the long-term stability of PSCs when exposed to light, humidity, and thermomechanical stressors remains a major hurdle in commercialization. One key factor causing instability is the inhomogeneous distribution of cations in perovskite thin films, which can trigger an unfavored phase transition that gradually degrades the devices. A research team led by Prof. ZHOU Yuanyuan, Associate Professor of the Department of Chemical and Biological Engineering and Associate Director of the Energy Institute at HKUST found that the nanoscale groove traps at the perovskite grain’s triple junctions serve as geometric traps that capture cations and retard their interdiffusion towards homogenization. The research team used a rational chemical additive approach known as butylammonium acetate and successfully reduced the depth of these nanoscale groove traps by a factor of three. The resultant cation-homogenized PSCs showed an improved efficiency close to 26%. More importantly, these devices demonstrate advantageous stabilities under various standardized test protocols. The primary corresponding author of the present study, Prof. Zhou said “Most existing studies focus on the microscopic or macroscopic levels to improve perovskite solar cells. Our team, however, investigated details down to the nanoscale in these PSCs. We used an advanced characterization technique called cathodoluminescence imaging to examine the relation between these nanoscale groove traps and cation distribution. This fundamental approach guided our engineering of these nanogrooves to homogenize the cation distribution and improve the cell performance”. Source: Hong Kong University of Science and Technology (Note: Content may be edited for style and length) googletag.cmd.push(function() { googletag.display('div-gpt-ad-1589722303187-0'); }); @import url(https://static.mailerlite.com/assets/plugins/groot/modules/includes/groot_fonts/import.css?version=1620372); .ml-form-embedSubmitLoad{display:inline-block;width:20px;height:20px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}.ml-form-embedSubmitLoad:after{content:" ";display:block;width:11px;height:11px;margin:1px;border-radius:50%;border:4px solid #fff;border-color:#fff #fff #fff transparent;animation:ml-form-embedSubmitLoad 1.2s linear infinite}@keyframes ml-form-embedSubmitLoad{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}#mlb2-3178312.ml-form-embedContainer{box-sizing:border-box;display:table;margin:0 auto;position:static;width:100%!important}#mlb2-3178312.ml-form-embed