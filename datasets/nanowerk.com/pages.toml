["https://www.nanowerk.com/nanomaterial-database.php"]
title = "Nanomaterials Database - Thousands of Nanomaterials from Worldwide Suppliers"
description = "A material is a nanomaterial if 50% or more of its constituent particles have one or more external dimensions in the size range 1 nm to 100 nm. Nanowerk's Nanomaterial Database is a unique inventory for the nanotechnology community with thousands of nanomaterials, nanoparticles, carbon nanotubes, quantum dots, graphene, fullerene, nanowires and nanofibers sourced from worlwide suppliers"
full_description = "Nanomaterials Database If 50% or more of the constituent particles of a material in the number size distribution have one or more external dimensions in the size range 1 nm to 100 nm, then the material is a nanomaterial. The classification of nanomaterials is based on the number of dimensions of a material, which are outside the nanoscale (<100 nm) range. Accordingly, in zero-dimensional (0D) nanomaterials all the dimensions are measured within the nanoscale (no dimensions are larger than 100 nm). Most commonly, 0D nanomaterials are nanoparticles. In one-dimensional nanomaterials (1D), one dimension is outside the nanoscale. This class includes nanotubes, nanorods, and nanowires. In two-dimensional nanomaterials (2D), two dimensions are outside the nanoscale. This class exhibits plate-like shapes and includes graphene, nanofilms, nanolayers, and nanocoatings. Three-dimensional nanomaterials (3D) are materials that are not confined to the nanoscale in any dimension. This class can contain bulk powders, dispersions of nanoparticles, bundles of nanowires, and nanotubes as well as multi-nanolayers. Classification of nanoscale dimensions. (Source: Tallinn University of Technology) The unique Nanowerk Nanomaterial Database™ is a powerful, free tool for the nanotechnology community to research nanomaterials such as carbon nanotubes, nanoparticles, graphene or quantum dots from more than 200 suppliers worldwide. Currently, our database contains about 4,500 nanomaterials. The Nanowerk Nanomaterial Database lists hundreds of worldwide suppliers of thousands of nanomaterials. Our database, first established in 2005, is the most comprehensive online source for manufactured nanomaterials. Please let us know if we missed a supplier or a product. Check our news section with related nanomaterials news. Nanotubes ( 770 items) Fullerenes ( 223 items) Graphene ( 841 items) Nanoparticles (3385 items) Quantum Dots (862 items) Nanofibers ( 99 items) Nanowires ( 230 items) Alternatively, go to our Nanocatalog."
author = ""
year_published = 2020
