["https://napi.rs/docs/concepts/await-promise"]
title = "Await Promise – NAPI-RS"
description = "Await a JavaScript Promise in Rust."
full_description = "DocsConceptsAwait PromiseAwait Promise Awaiting a JavaScript Promise in Rust sounds crazy, but it's feasible in NAPI-RS. 💡Awaiting a JavaScript Promise needs the tokio_rt and napi4 features to be enabled. lib.rsuse napi::bindgen_prelude::*; #[napi] pub async fn async_plus_100(p: Promise<u32>) -> Result<u32> { let v = p.await?; Ok(v + 100) } test.mjsimport { asyncPlus100 } from './index.js' const fx = 20 const result = await asyncPlus100( new Promise((resolve) => { setTimeout(() => resolve(fx), 50) }), ) console.log(result) // 120ExternalTypes Overwrite"
year_published = 2025
clearnet = "https://napi.rs/docs/concepts/await-promise"
