title = "Function – NAPI-RS"
description = "NAPI-RS, a framework for building pre-compiled Node.js addons in Rust"
full_description = "DocsConceptsFunctionFunction Defining a JavaScript function is very simple in NAPI-RS. Just a plain Rust fn: #[napi] fn sum(a: u32, b: u32) -> u32 { a + b } The most important thing you should keep in mind is NAPI-RS fn does not support every Rust type. Here is a table to illustrate how JavaScript types map to Rust types when they are fn arguments and return types: Arguments Rust TypeJavaScript Typeu32numberi32numberi64numberf64numberboolbooleanStringstringLatin1StringstringUTF16Stringstring#[napi(object)] structObject& struct or &mut structClass instanceserde_json::MapObjectserde_json::Valueunknownstd::collections::HashMapObjectArrayunknown[]Vec<T> T must be types in this tableT[]BufferBufferExternalExternal (opens in a new tab)NullnullUndefined / ()undefinedOption<T>T or nullFn(Arg) ->T Arg and T must be types in this table(arg: Arg) => TPromise<T>Promise<T>AbortSignalAbortSignal (opens in a new tab)JsSymbolSymbolInt8Array / Uint8Array / Int16Array...TypedArrayBigIntBigInt Return Type Rust TypeJavaScript Typeu32numberi32numberi64numberf64numberboolbooleanStringstringLatin1StringstringUTF16Stringstring#[napi(object)] structObject#[napi] structClassserde_json::MapObjectserde_json::Valueunknownstd::collections::HashMapObjectArrayunknown[]Vec<T> T must be types in this tableT[]BufferBufferExternalExternalNullnullUndefined / ()undefinedOption<T>T or nullAsyncTask<Task<JsValue = T>>Promise<T>JsSymbolSymbolInt8Array / Uint8Array / Int16Array...TypedArrayBigIntBigInti64nBigInti128BigIntu128BigIntObjectThreadsafeFunction"
