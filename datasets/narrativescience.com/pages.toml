description = "Augmented analytics helps more people uncover insights and explanations through AI technologies like ML, smart data prep, and natural language—leading to better, faster decisions for your business."
full_description = 'Augmented Analytics Explain Data Einstein Discovery for Reports Data Stories Augmented analytics is a class of analytics powered by artificial intelligence (AI) and machine learning (ML) that expands a human’s ability to interact with data at a contextual level. We use AI to make analytics accessible so that more people can confidently explore and interact with data to drive meaningful decisions. From automated modeling to guided natural language queries, our augmented analytics capabilities are powerful and trusted to help organizations leverage their growing amount of data and empower a wider business audience to discover insights. Watch now Explain Data Explain Data automatically provides AI-driven explanations for the value of a data point with a single click. Based on advanced statistical models, explanations are integrated in existing workflows, saving users’ time and unearthing new understandings about their data that they may not have found otherwise. The interactive feature offers analysts and business users alike a jumping-off point to fuel deeper data exploration. Einstein Discovery for Reports Einstein Discovery for Reports automatically gives you AI-powered insights directly within your Salesforce Reports, helping you quickly understand what happened and why it happened, so you can take action intelligently. Einstein scans your report data quickly and thoroughly using machine learning and comprehensive statistical analysis. And, with just a few clicks, users can dive into the associated Einstein Discovery story for deeper analysis. Learn how to use Einstein Discovery for Reports Data Stories Data Stories adds automated plain-language explanations to your dashboards in seconds. This feature breaks down your data by relevant dimensions and presents insights as bullet points that are easy to read and understand. Save analysts’ time and make analytics easy for everyone with this new consumption experience built for business users. Learn 