full_description = "TechnologyHomeTechnologyComputingMission and ImpactExplore TechnologyTechnology Transfer and SpinoffsSpace TravelLiving in SpaceManufacturing and MaterialsRoboticsScience InstrumentsComputingSpace CommunicationsNewsGallery High-Tech Computing Space-qualified computing technology is designed to address the most computationally-intensive part of a mission. But for the future, NASA is going to need more power and more processing capabilities. We also work on modeling and simulation tech, software, and unique electronics and computing hardware for flight systems, whether in space or the atmosphere. Quick Facts As part of the NASA’s High-Performance Space Computing project, Microchip Technology Inc. of Chandler, Arizona was selected to develop a processor that will provide at least 100 times the computational capacity of current spaceflight computers. This key capability would advance all types of future space missions, from planetary exploration to lunar and Mars surface missions. Advanced Air Mobility (AAM) aircraft could transform transportation, cargo delivery, and a variety of public services. NASA is conducting research with pilots and project engineers assessing a flight autonomy system software’s responsiveness and efficacy, testing the human-to-machine interactions to support progress in its development. Mission and Impact NASA seeks to improve our ability to access and travel through space; land more mass in more locations throughout the solar system; live and work in deep space and on planetary bodies; build next generation air vehicles, and transform the ability to observe the universe and answer profound questions in earth and space sciences. Learn More about Mission and Impact Latest High-Tech Computing News More High-Tech Computing News Article6 Min ReadNew Simulated Universe Previews Panoramas From NASA’s Roman TelescopeArticle5 Min ReadMaking Mars’ Moons: Supercomputers Offer ‘Disruptive’ New ExplanationArticle7 Min ReadSix Ways Super