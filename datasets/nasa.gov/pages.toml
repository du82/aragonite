description = "This NASA Aircraft page will showcase NASA’s aircraft operations that enable the Agency’s myriad missions, from preparing astronauts to go to space, to studying Earth from the air, to developing leading-edge aeronautic technologies."
full_description = "AeronauticsHomeAeronauticsNASA AircraftSupersonic FlightGreen Aviation TechDrones & YouAir Traffic SolutionsMoreFlight InnovationScience in the AirNASA Aircraft NASA Aircraft NASA maintains a fleet of aircraft that enable the agency to conduct its aeronautical research, study our planet, train its astronauts, and otherwise operate its many air and space programs. This page will be a constantly growing and evolving home for information about NASA aircraft past and present. Latest NASA Aircraft News More NASA Aircraft News Feature1 Min ReadThe NACA: Launching the Future of FlightImage Article1 Min ReadNASA Runs X-59 Engine with Maximum Afterburner for First Time 40 Min ReadApollo Legend to Shuttle Trailblazer 2 Min ReadNASA’s C-130 Aircraft En Route to India in Support of NISAR MissionImage Article 8 Min Read65 Years Ago: First Powered Flight of the X-15 Hypersonic Rocket Plane Article NASA’s X-59 Fires Up Engine for Maximum Afterburner Testing 7 Images Go To Gallery Go To Gallery Current NASA X-Planes Since the X-1 broke the sound barrier in 1947, X-plane research has resulted in some of the most important and historic developments in flight. That tradition continues today with NASA's current stable of X-planes, each uniquely designed and capable of providing research to help transform specific areas of aviation for the 21st century. X-66To be built in partnership with Boeing, the X-66 will serve as NASA's Sustainable Flight Demonstrator. The goal is to showcase a new aircraft configuration that will help the aviation community achieve net zero greenhouse gas emissions by 2050.Read More about the X-66X-59Built under contract by Lockheed Martin, the X-59 is the centerpiece of NASA's Quesst mission to collect data that could make commercial supersonic flight over land possible, dramatically reducing air travel time in the United States or anywhere in the worldRead More about the X-59 aircraft Flown at armstrong FLIGHT RESEARCH CENTER See List of Armstrong's Aircraft Fleet Gulfstream III Aerodynamics Research Test Bed ER-2 High-Altitude Science Aircraft F-15B Aeronautics Research Test Bed Global Hawk Unmanned Aerial System aircraft operations Johnson Space Center The Houston-based space center plays host to a number of NASA aircraft that are used for astronaut training and flight proficiency, transport of oversized cargo, and hosting airborne science investigations of planet Earth. Read About the JSC Aircraft NASA Johnson Center Aircraft. The large image is of the Super Guppy and the smaller images (left to right): 1. WB57 (N926NA, N927NA, & N928NA), G-V (N95NA), T-38 Fleet and the G-III (N992NA).NASA Airborne Science Program NASA's Airborne Science Program, located within the Earth Science Division, is responsible for providing aircraft systems that further science and advance the use of satellite data. A number of NASA aircraft stationed at field centers around the country are available to support the program. See the List of NASA Aircraft Involved Originally used to search for submarines during the Cold War, this Lockheed Orion P3 has conducted airborne science for NASA since 1991! It has been to all seven continents many times.NASA NASA Aircraft 45 Images Go To Gallery Go To Gallery Here is Some Other Cool NASA Aeronautics Stuff to Check Out Aeronautics @ Home A collection of activities and lessons to learn more about NASA Aeronautics and the science of flight that you can do at home. STEM Learning Resources Explore hands-on activities, interactive lesson plans, educator guides, and other downloadable content related to aeronautics. Aeronautics Backgrounds Take video calls from your home or office in the cockpit of the X-59 or from inside a wind tunnel! And other aviation themes. Free E-Books to Download Add these books covering NASA Aeronautics and other aviation and space topics to your electronic library. NASA X Video Files This binge worthy page collects aeronautics-themed topics from the popular NASA X video series. Facebook logo @NASA@NASAaero@NASAes @NASA@NASAaero@NASA_es Instagram logo @NASA@NASAaero@NASA_es Linkedin logo @NASA Other Aeronautics topics Even More Aeronautics Supersonic Flight Research about flying faster than the speed of sound. Flight Innovation Stories about pioneering the frontiers of 21st century flight. Drones & You All about new ways to get from here to there in the air. Green Aviation Tech Learn about research to make aviation more sustainable. Air Traffic Solutions Read about how NASA is opening up the sky for all. NASA Aircraft Information about NASA's fleet of aircraft. Science in the Air News about using NASA aircraft to better understand our world. Keep Exploring Discover More Topics From NASA Missions Humans In Space Solar System Exploration Follow Us on Social Media Explore NASA’s History"
