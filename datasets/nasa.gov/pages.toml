title = "Human Space Travel Research - NASA"
description = "From studies that seek to understand how the human body adapts to time in space to research on spacesuits and spacecraft, learn about human space travel research."
full_description = "Humans in SpaceHumans in SpaceHumans in Space HomeLiving in Space HomeCommercial Space HomeAstronauts HomeWhy go to space?Where are we going?Living in SpaceCommercial SpaceCommercial Space HomeLow Earth Orbit EconomyCommercial Human Landing SystemsLunar EconomyCommercial Lunar Payload ServicesAstronautsAstronauts HomeActive AstronautsManagement AstronautsFormer AstronautsAstronaut CandidatesPartner AstronautsBecome an AstronautSpacesuitsSpacecraft and RocketsMoreDestinationsNews and Media Human Space Travel Research From studies that seek to understand how the human body adapts to time in space to research on spacesuits and spacecraft, NASA works to ensure the safety of astronauts as they push the boundaries of space exploration. Learn More About Human Space Travel Research The Body in SpaceSpaceflight affects bones, muscles, vision, and more. Learn about the changes humans may undergo during spaceflight, as well as the steps NASA takes to keep astronauts healthy and safe.Read About the Human Body in SpaceResearch in SpaceNASA seeks to understand how the human body changes while astronauts live and work on the space station. Learn how scientists work to maintain the health and well-being of crew members during and after their missions.Explore Research in SpaceResearch on EarthNASA conducts Earth-bound simulations of life in space. Learn how scientists use such missions to study the way humans adapt to challenges astronauts may encounter on journeys to the Moon and Mars.Explore Research on EarthExtended Stays in SpaceFrank Rubio, Mark Vande Hei, Scott Kelly, and others have spent an extended amount of time in space. Learn about the record-holders for the longest continuous spaceflights by U.S. astronauts.Learn About Extended Stays in Space Collaborate With Us Are you developing innovative ways to keep astronauts healthy and mission-ready ? Partner with NASA’s Human Research Program (HRP)! Check out information on NSPIRES and internships, and explore our how-to guides for working with us. Learn About Collaboration Opportunities NASA Staying Healthy in Space Article7 Min ReadExperiments to Unlock How Human Bodies React to Long Space JourneysArticle6 Min ReadAstronaut ExerciseArticle5 Min ReadStation Science 101: Studying DNA in SpaceArticle7 Min ReadCounteracting Bone and Muscle Loss in Microgravity 5 Min ReadNASA Harnesses US Navy Spinning Device to Simulate SpaceflightArticle 6 Min ReadIsolation – What Can We Learn From the Experiences of NASA Astronauts?Article 6 Min ReadNew Tests Evaluate Mission Readiness of Astronauts Upon LandingArticle 5 Min ReadScientists Probe How Long-Term Spaceflight Alters ImmunityArticle Spacesuits More than 50 years of NASA expertise is going into the design of modern spacesuits that will protect and support astronauts as they reach iconic heights during forays in low-Earth orbit, the Moon, and worlds beyond. Learn About Spacesuits NASA Featured Story Top Five Technologies Needed for a Spacecraft to Survive Deep Space When a spacecraft built for humans ventures into deep space, it requires an array of features to keep it and… Read the Story Food in Space Astronauts require food that is nutritious, appetizing, long-lasting, easy to make, and more. We strive to continuously improve the quality of space food and to satisfy the dietary needs of crew members on increasingly longer and more distant spaceflight missions. Article5 min readThe Menu for Mars: Designing a Deep Space Food SystemArticle3 min readHow Does Spaceflight Change Food Appeal?Article4 min readEnhanced Diet May Help Astronauts Adapt to SpaceflightArticle3 min readSpace Food Systems Space Simulations on Earth as a Research Tool Take a peek into the lives of crew on a simulated mission to Mars. Confined inside NASA's Human Exploration Research Analog (HERA), these crew help researchers study how teams overcome isolation and confinement to accomplish mission-critical tasks. Learn more Credit: NASA/Bill Stafford Benefits to Humanity Space exploration unites the world to inspire the next generation, make ground-breaking discoveries, and create new opportunities. Technologies and missions we develop for human spaceflight have thousands of applications on Earth, boosting the economy, creating new career paths, and advancing everyday technologies all around us. Learn More about Benefits to Humanity Credit: NASA Keep Exploring Discover More Topics From NASA Human Research Program Artemis Spaceships and Rockets Space Station Research and Technology"
