full_description = "Aeronautics Research Mission DirectorateHomeNASA en españolAeronáutica en españolARMD ProgramsAdvanced Air Vehicles ProgramAirspace Operations and Safety ProgramIntegrated Aviation Systems ProgramTransformative Aeronautics Concepts ProgramAerosciences Evaluation and Test CapabilitiesNewsAboutOrganization and LeadershipCurrent SolicitationsNAC Aeronautics CommitteeAeronautics STEMAeronautics Innovation ChallengesAeronautics en EspanolContact NASA Aeronáutica en español Bienvenidos a la página en español de aeronáutica de la NASA. Gracias a los avances tecnológicos desarrollados por la NASA, la industria de la aviación está mejor equipada que nunca para transportar a pasajeros y carga de manera segura y eficiente a destinos en todo el mundo. De hecho, todos los aviones estadounidenses que vuelan hoy día, así como todos los controles de tráfico aéreo de los Estados Unidos, utilizan, de alguna manera u otra, tecnología desarrollada por la NASA. Aprende más about Aeronáutica en español Noticias Mas noticias Image Article4 Min ReadLa NASA probará tecnología para medir las singulares ondas de choque del X-59Article4 Min ReadEl X-59 enciende su motor por primera vez rumbo al despegue 3 Min ReadLa NASA lleva un dron y un rover espacial a un espectáculo…Article 4 Min ReadDestacado de la NASA: Felipe Valdez, un ingeniero inspiradorArticle 2 Min ReadUna reunión familiar de la NASA por casualidadArticle Featured Video Aeronáutica en español Ver en YouTube Primeras imágenes de la interacción de ondas de choque de aviones supersónicos La NASA ha probado con éxito una avanzada tecnología fotográfica aire-aire en vuelo, capturando las primeras imágenes de la interacción de ondas de choque de dos aviones supersónicos en vuelo. Aprende más Utilizando la técnica de fotografía de Schlieren, la NASA pudo capturar las primeras imágenes aire-aire de la interacción de ondas de choque de dos aviones supersónicos que vuelan en formación.NASA ¡Recursos geniales! STEM es un 