full_description = "3 min readLa NASA lleva un dron y un rover espacial a un espectáculo aéreoErica HeimNASA Armstrong Public Affairs SpecialistOct 30, 2024 Article Aproximadamente 20,000 visitantes pasaron por la carpa de la NASA en el Espectáculo Aéreo de Miramar, celebrado en San Diego, California, entre el 27 y el 29 de septiembre de 2024. NASA Read this story in English here. En septiembre, los tres centros de la NASA en California se reunieron para compartir innovaciones aeroespaciales con miles de asistentes en el Espectáculo Aéreo de Miramar, en San Diego, California. Expertos de la agencia hablaron del apasionante trabajo que realiza la NASA mientras explora los secretos del universo en beneficio de todos. Bajo una gran carpa cerca del aeródromo, los invitados exploraron exposiciones de diferentes centros y proyectos, como una maqueta del rover Innovator o el avión no tripulado Alta-X, desde el 27 al 29 de septiembre. Empleados de la agencia provenientes del Centro de Investigación de Vuelo Armstrong de la NASA en Edwards, California, del Centro de Investigación Ames en Moffett Field, California y del Laboratorio de Propulsión a Chorro (JPL por sus siglas en inglés) en el sur de California guiaron a los visitantes a través de visitas y presentaciones y compartieron mensajes sobre las misiones de la NASA. “El espectáculo aéreo es tanto sobre la gente como sobre las aeronaves y la tecnología”, dijo Derek Abramson, ingeniero jefe del Laboratorio de Investigación de Vuelo a Subescala de NASA Armstrong. “Conocí a mucha gente nueva, trabajé con un equipo increíble y formé un gran vínculo con otros centros de la NASA, hablando de lo que hacemos aquí como una organización cohesiva”. Expertos como el ingeniero de controles de vuelo Felipe Valdez compartieron la misión de la NASA con los visitantes del espectáculo aéreo y explicaron la novedad de los instrumentos aéreos como el dron Alta-X en el Espectáculo Aéreo de Miramar en San Diego, California, del 27 al 29 de septiembre de 2024. NASA El 29 de septiembre, los pilotos de Armstrong se unieron al evento para tomarse fotos con los invitados y responder a las preguntas de los curiosos o entusiastas asistentes. Un visitante del espectáculo aéreo tuvo un momento especial con el piloto de la NASA Jim Less. “Uno de mis momentos favoritos fue conectar con un joven en sus útimos años de adolescencia que se detuvo numerosas veces en la carpa de exhibición, con la esperanza de poder conocer a Jim Less, nuestro piloto del X-59”, dijo Kevin Rohrer, jefe de comunicaciones de NASA Armstrong. “Culminó con una gran conversación entre los dos y con Jim [Less] autografiando un modelo del avión X-59 que el joven traía consigo”. “Espero que esta tradición continúe, si no en este mismo lugar, en algún otro evento en California”, continuó Rohrer. “Tenemos muchas mentes hambrientas y apasionadas por aprender más sobre todas las misiones de la NASA”. El Espectáculo Aéreo de Miramar es un evento anual que tiene lugar en la Base Aérea de Miramar, en San Diego, California. Profesionales como Leticha Hawkinson, en el centro a la derecha, y Haig Arakelian, en el centro a la izquierda, compartieron oportunidades de aprendizaje y carrera para los entusiastas de la NASA que visitaron el Espectáculo Aéreo de Miramar en San Diego, California, del 27 al 29 de septiembre de 2024. NASA Articulo traducido por: Elena Aguirre Share Details Last Updated Nov 05, 2024 EditorDede DiniusContactElena Aguirreelena.aguirre@nasa.govLocationArmstrong Flight Research Center Related TermsArmstrong Flight Research CenterAeronáuticaAmes Research CenterCareersEventsJet Propulsion LaboratoryNASA en españolWhat We Do Explore More 6 min read FARMing with Data: OpenET Launches new Tool for Farmers and Ranchers Article 19 hours ago 3 min read University High Knows the Answers at NASA JPL Regional Science Bowl Article 2 days ago 2 min read NASA Marks 110 Years Since Founding of Predecessor Organization Article 2 days ago Keep Exploring