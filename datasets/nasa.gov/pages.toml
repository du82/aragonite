full_description = "Humans in SpaceHumans in SpaceHumans in Space HomeLiving in Space HomeCommercial Space HomeAstronauts HomeWhy go to space?Where are we going?Living in SpaceCommercial SpaceCommercial Space HomeLow Earth Orbit EconomyCommercial Human Landing SystemsLunar EconomyCommercial Lunar Payload ServicesAstronautsAstronauts HomeActive AstronautsManagement AstronautsFormer AstronautsAstronaut CandidatesPartner AstronautsBecome an AstronautSpacesuitsSpacecraft and RocketsMoreDestinationsNews and Media The Moon is a 4.5-billion-year-old time capsule Artemis With NASA’s Artemis campaign, we are exploring the Moon for scientific discovery, technology advancement, and to learn how to live and work on another world as we prepare for human missions to Mars. We will collaborate with commercial and international partners and establish the first long-term presence on the Moon. NASA will land the first woman, first person of color, and first international partner astronaut on the Moon using innovative technologies to explore more of the lunar surface than ever before. Why We Go Artemis Missions What We Can Learn Artemis Accords How We Go Moon to Mars The Latest on Artemis Read Updates at the Artemis Blog Teams at NASA’s Kennedy Space Center in Florida practice the Artemis mission emergency escape or egress procedures during a series of integrated system verification and validation tests at Launch Pad 39B on Sunday, Aug. 11, 2024. Members of the closeout crew, pad rescue team and the Exploration Ground Systems Program practiced the process of getting inside and out of the emergency egress baskets. While the crew and other personnel will ride the emergency egress baskets to the terminus area in a real emergency, no one rode the baskets for this test. Instead, teams tested the baskets during separate occasions by using water tanks filled to different levels to replicate simulate the weight of passengers. Credits: NASA/Kim Shiflett Learn More about Artemis Missions Artemis I Artemis I was an uncrewed flight test of the Space Launch System and the Orion spacecraft around the Moon. Artemis II Artemis II will be the first crewed flight test of the Space Launch System and the Orion spacecraft around the Moon. Artemis III Artemis III will send the first humans to explore the region near the lunar South Pole. Artemis IV Artemis IV debuts humanity's first lunar space station, a larger, more powerful version of the SLS rocket, and new mobile launcher. Latest News More Artemis News and Articles News Release4 Min ReadNASA Sets Coverage for Intuitive Machines’ Second Private Moon LandingArticle3 Min ReadNASA Successfully Acquires GPS Signals on Moon 1 Min ReadBlue Ghost Lands on MoonImage Article 3 Min ReadOrion Deputy Program Manager Debbie Korth Receives 2025 Engineer of the Year…Article 4 Min ReadTouchdown! Carrying NASA Science, Firefly’s Blue Ghost Lands on Moon News Release Artemis Why We Are Going To The Moon We’re going back to the Moon for scientific discovery, economic benefits, and inspiration for a new generation of explorers: the Artemis Generation. While maintaining American leadership in exploration, we will build a global alliance and explore deep space for the benefit of all. Learn More About the Moon about Why We Are Going To The Moon Waxing gibbous Moon at 11 days old.Ernie Wright / NASA Our success will change the world. What can we learn? Water on the Moon Lunar Economy What more can we learn at the Moon? The Moon is a treasure trove of science. Earth’s Moon is a 4.5-billion-year-old time capsule, pristinely preserved by the cold vacuum of space. The lunar samples returned during the Apollo Program dramatically changed our view of the solar system, and scientists continue to unlock new secrets from those samples. Yet, we are just scratching the surface of knowledge about the Moon. Future samples from Artemis missions will continue to advance our knowledge of the history and formation of our solar system including Earth and the Moon. Learn More About the Moon Malapert massif (informal name) is thought to be a remnant of the South Pole – Aitken basin rim, which formed more than 4 billion years ago. More recently, this magnificent peak (lower left) was selected as an Artemis III candidate landing region. NASA/GSFC/Arizona State University How much water is on the Moon, and why is that important for future exploration? Water is a critical resource for long-term exploration. Permanently shadowed regions of the Moon, including craters at the South Pole, are rich in frozen water. Finding it on the Moon, extracting it, and converting it means water for drinking, oxygen for breathing, and rocket fuel to power missions farther into the solar system. Finding and using resources in space makes exploration more affordable when we do not have to send everything from Earth. This is also important to help NASA get ready for our next giant leap – human exploration of Mars. Learn More About Artemis Science Elevation (left) and shaded relief (right) image of Shackleton, a 21-km-diameter (12.5-mile-diameter) permanently shadowed crater adjacent to the lunar south pole. The structure of the crater’s interior was revealed by a digital elevation model constructed from over 5 million elevation measurements from the Lunar Orbiter Laser Altimeter.NASA How can we grow a lunar economy? For the Artemis missions, American innovation is leading the way, and the future at the Moon holds promise for a robust lunar marketplace. NASA’s strategy stimulates the commercial space industry, which drives new ideas, brings down costs, and grows the business opportunities that can foster a lunar economy and serve other customers for the benefit of humanity. Learn More About Artemis Partners Illustration of of Firefly Aerospace’s Blue Ghost lander on the lunar surface. The lander will carry a suite of 10 science investigations and technology demonstrations to the Moon in 2023 as part of NASA’s Commercial Lunar Payload Services (CLPS) initiative.Firefly Aerospace How We Explore the Moon Together, the Orion spacecraft, SLS rocket, Gateway, human landing systems, and advanced spacesuits represent the core of NASA’s infrastructure for long-term human exploration at the Moon. Moon to Mars Architecture Getting to the MoonLearn about the rockets and spacecraft that carry astronauts to the Moon.Read MoreIn Lunar OrbitLearn about living and working aboard Gateway in lunar orbit.Read MoreOn the Lunar SurfaceLearn about systems enabling humans to live and work on the surface of the Moon.Read MoreArtemis PartnersLearn about the partnerships empowering the Artemis missions. Read More NASA Encyclopedia Commercial Lunar Payload Services NASA is supporting the creation of a lunar economy through commercial deliveries of NASA science that will help prepare for the next generation of explorers. Learn More An artist’s concept of Intuitive Machines’ Nova-C lunar lander on the Moon’s South Pole.Credit: Intuitive Machines Artemis Accords We go together. The Artemis Accords are grounded in the Outer Space Treaty of 1967, outlining the vision and principles for a safe, transparent environment that facilitates exploration, science, and commercial activities for all of humanity to enjoy. To date, 53 countries have joined the accords and are committed to establishing a peaceful, prosperous future in space. More countries will sign the Artemis Accords in the months and years ahead to ensure the entire world can benefit from our journey of exploration and discovery. More About the Artemis Accords about Artemis Accords NASA All that we build, all that we study, all that we do, prepares us to go. Learning resources Join Artemis Make, launch, teach, compete and learn. Find your favorite way to be part of the Artemis mission. Learn More Artemis 53 Images Go To Gallery Go To Gallery Decorate Your Work 'Space' with Artemis Relive the awe-inspiring moments of Artemis I and glimpse the bright future that lies ahead as the Artemis campaign enables humans to live and work on the Moon. Learn More Credit: NASA Relive the wonder of Artemis I Beyond the Moon Humans to Mars Like the Moon, Mars is a rich destination for scientific discovery and a driver of technologies that will enable humans to travel and explore far from Earth. Mars remains our horizon goal for human exploration because it is one of the only other places we know where life may have existed in the solar system. What we learn about the Red Planet will tell us more about our Earth’s past and future, and may help answer whether life exists beyond our home planet. Learn More about Humans to Mars Illustration of an astronaut on Mars, using a remote control drone to inspect a nearby cliff. NASA Keep Exploring Discover More Topics From NASA Earth’s Moon The Moon makes Earth more livable, sets the rhythm of ocean tides, and keeps a record of our solar system’s… Moon Missions Here are the major missions launched to the Moon, from the dawn of the space age through the present day. Moon Facts How the Moon Got Its Name Our Moon shares a name with all moons simply because people didn’t know other… Humans In Space"
