full_description = "About NASAOrganizationLeadershipNASA OrganizationNASA’s ImpactBudgets and ReportsCenters & FacilitiesAll NASA Centers & FacilitiesNASA HeadquartersAmes Research CenterArmstrong Flight Research CenterGlenn Research CenterGoddard Space Flight CenterGoddard Institute for Space StudiesJet Propulsion LaboratoryJohnson Space CenterKatherine Johnson IV and V FacilityKennedy Space CenterLangley Research CenterMarshall Space Flight CenterMichoud Assembly FacilityNASA Engineering and Safety CenterNASA Safety CenterNASA Shared Services CenterNeil A. Armstrong Test FacilityStennis Space CenterWallops Flight FacilityWhite Sands Test FacilityDirectoratesAll NASA DirectoratesAeronautics Research Mission DirectorateExploration Systems Development Mission DirectorateScience Mission DirectorateSpace Operations Mission DirectorateSpace Technology Mission DirectorateMission Support DirectoratePeopleNASA CareersNASA History About NASA NASA explores the unknown in air and space, innovates for the benefit of humanity, and inspires the world through discovery. NASA Today Looking Forward A History of Innovation NASA Today NASA explores the unknown in air and space, innovates for the benefit of humanity, and inspires the world through discovery. For more than 65 years, NASA has made the seemingly impossible, possible. At its 20 centers and facilities across the country and with U.S. commercial companies and international partners, NASA leads studying Earth science, including climate, our Sun, solar system, and the larger universe. We conduct cutting-edge research to advance technology and aeronautics. We operate the world’s leading space laboratory, the International Space Station, and will establish a sustainable and strong exploration presence on the Moon this decade through the Artemis campaign. NASA Centers and Facilities Technicians inside the Payload Hazardous Servicing Facility at Kennedy Space Center install and test antennas on a solar array on Wednesday, March 20, 2024, for the agency’s Europa Clipper spacecraft which will study Jupiter’s icy moon, Europa, to determine if the planet can support life. NASA/Isaac Watson Looking Forward NASA’s future will continue to be a story of human exploration, technology, and science. We will go back to the Moon to learn more about what it will take to support human exploration to Mars and beyond. We will continue to nurture the development of a vibrant low-Earth orbit economy that builds on the work done to date by the International Space Station. NASA engineers will develop new technologies to improve air transport at home and meet the challenges of advanced space exploration. Our scientists will work to increase an understanding of our planet and our place in the universe. NASA Missions Artemis II astronauts, from left, NASA astronaut Victor Glover, Canadian Space Agency astronaut Jeremy Hansen, and NASA astronauts Christina Koch and Reid Wiseman.NASA/Frank Michaux A History of Innovation When NASA opened for business on October 1, 1958, it accelerated the work already started on human and robotic spaceflight, and over the last 65 years it has continued to push the boundaries of aeronautics and space exploration. Now NASA is preparing to take humankind farther than ever before, as it helps to foster a robust commercial space economy near Earth, and pioneers further human and robotic exploration as we venture into deep space. NASA History NASA’s Perseverance Mars rover took a selfie with the Ingenuity helicopter, seen here about 13 feet from the rover. This image was taken by the WASTON camera on the rover’s robotic arm on April 6, 2021.NASA/JPL-Caltech/MSSS NASA Leadership Acting Administrator Janet PetroJanet Petro is NASA’s acting administrator. Petro is responsible for directing the agency, including budget and programs, until a new administrator is confirmed by the U.S. Senate.Full BiographyActing Associate Administrator Vanessa WycheVanessa Wyche is NASA’s acting associate administrator. Wyche is senior advisor to the administrator, leading the agency’s center directors and mission directorate associate administrators. Full BiographyDeputy Associate Administrator Casey SwailsCasey Swails is NASA’s deputy associate administrator. Swails is advisor to the associate administrator for day-to-day operations and long-term strategic direction.Full Biography Careers at NASA Align your talents with your passion and find out why NASA consistently is named a best place to work in the federal government. At NASA, you'll have an opportunity to work on unique and challenging projects that truly make an impact on humanity. Explore Career Opportunities about Careers at NASA Faces of NASA 680 Images Go To Gallery Go To Gallery Explore the Universe from your Inbox Stay up-to-date on the latest news from NASA–from Earth to the Moon, the Solar System and beyond. We will never share your email address.Privacy Policy Sign Up Facebook logo @NASA@nasaes @NASA@NASA_es Instagram logo @NASA@nasa_es Linkedin logo @NASA Keep Exploring Discover More NASA Organization NASA Directorates NASA’s Impact Get Involved"
