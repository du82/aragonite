full_description = "Understanding the Universe Live launch coverage of SPHEREx, the agency’s newest space telescope, will begin at 9:15 p.m. EST on Friday, March 7. SPHEREx will lift off with another NASA mission, PUNCH, a constellation of four small satellites that will make global, 3D observations of the Sun’s outer atmosphere. Mission Updates SPHEREX MISSION Seeking Life’s Ingredients PUNCH MISSION Seeing Solar Wind in 3D LIVE LAUNCH COVERAGE Stream on NASA+ Featured News More NASA News Article3 Min ReadNASA Successfully Acquires GPS Signals on Moon News Release4 Min ReadNASA Sets Coverage for Intuitive Machines’ Second Private Moon Landing News Release4 Min ReadTouchdown! Carrying NASA Science, Firefly’s Blue Ghost Lands on MoonArticle6 Min ReadNASA’s Hubble Finds Kuiper Belt Duo May Be Trio 6 Min ReadNASA’s Webb Exposes Complex Atmosphere of Starless Super-JupiterArticle 2 Min ReadNASA Marks 110 Years Since Founding of Predecessor OrganizationArticle 6 Min ReadX-ray Signal Points to Destroyed Planet, Chandra FindsImage Article 5 Min ReadWhat’s Up: March 2025 Skywatching Tips from NASAArticle A Supernova Remnant Hubble once again lifts the veil on a famous—and frequently photographed—supernova remnant: the Veil Nebula. The remnant of a star roughly 20 times as massive as the Sun that exploded about 10,000 years ago, the Veil Nebula is situated about 2,400 light-years away in the constellation Cygnus. Learn More about A Supernova Remnant The Universe Discover More StarsGalaxiesBlack HolesDark Matter & Dark Energy Earth Information Center For more than 50 years, NASA satellites have provided data on Earth's land, water, air, temperature, and climate. NASA's Earth Information Center allows visitors to see how our planet is changing in six key areas: sea level rise and coastal impacts, health and air quality, wildfires, greenhouse gases, sustainable energy, and agriculture. Start Exploring about Earth Information Center Today Image Of The Day Blue Ghost Lands on Moon Carrying a suite of NASA science and technology, Firefly Aerospace’s Blue Ghost Mission 1 successfully landed at 3:34 a.m. EST on Sunday, March 2, 2025, near a volcanic feature called Mons Latreille within Mare Crisium, a more than 300-mile-wide basin located in the northeast quadrant of the Moon’s near side. Browse Image Archive Today Image Of The Day View image More NASA Images Earth Gallery15 ImagesEarth’s Moon Gallery33 ImagesSun Gallery32 Images Explore the Universe from your Inbox Stay up-to-date on the latest news from NASA–from Earth to the Moon, the Solar System and beyond. We will never share your email address.Privacy Policy Sign Up More Topics from NASA MissionsHumans In SpaceClimate ChangeOur Solar SystemUniverseScience NewsAeronauticsTechnology"
