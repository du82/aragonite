full_description = "MultimediaImagesNASA+Podcastse-BooksGames and InteractivesMobile & Desktop Apps Mobile and Desktop Apps NASA App The redesigned NASA App unlocks access to the agency's NASA+ video streaming service and the latest images, news, mission information, podcasts, and interactive experiences—putting the universe at your fingertips. Learn More Featured Apps NASA Selfies App Store | Google Play Create your own selfies from outer space! NASA Selfies lets you put your photo in a virtual spacesuit in front of some of NASA’s most captivating space images. Share these space selfies on social media and learn about the science behind the pictures. NASA Spinoff App Store NASA Spinoff profiles the best examples of technology that have been transferred from NASA research and missions into commercial products. From life-saving satellite systems to hospital robots that care for patients and more, NASA technologies benefit society. There’s more space in your life than you think. NASA Technology Innovation App Store NASA technology drives exploration, advancing the future of America’s space endeavors. Download for interviews with space technology innovators and project developments across the agency. Space Images App Store | Google Play Discover stunning new images of space, planets, Mars, asteroids, stars, galaxies, and cutting-edge space technology as they are released each week from the Jet Propulsion Laboratory. Spot the Station App Store | Google Play Get notified when the space station is visible overhead from your location! The app includes several helpful features, including 2D and 3D real-time location views of the station; upcoming sighting lists with visibility data; push notifications when the station is approaching your location; and more. The Sound of Space From longform interviews with astronauts and engineers to narrative shows that take you on a tour of the galaxy, NASA podcasts let you experience the thrill of space exploration without ever leaving Ea