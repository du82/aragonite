title = "Air Traffic Solutions"
description = "The skies are getting busier every day, with new types of aircraft aiming to provide innovative air travel services that seek to improve all of our lives, whether that means delivering cargo to your front door or providing personalized taxi service across town. NASA is working with its government and industry partners to provide air traffic solutions to keep the sky lanes open, efficient, and safer than ever before."
full_description = "AeronauticsHomeAeronauticsAir Traffic SolutionsSupersonic FlightGreen Aviation TechDrones & YouAir Traffic SolutionsMoreFlight InnovationScience in the AirNASA Aircraft Air Traffic Solutions The skies are getting busier every day, with new types of aircraft aiming to provide innovative air travel services that seek to improve all of our lives, whether that means delivering cargo to your front door or providing personalized taxi service across town. NASA is working with its government and industry partners to keep the sky lanes open, efficient, and safer than ever before. Follow their work here. Latest News More Air Traffic Solutions News Article2 Min ReadNASA Flight Rerouting Tool Curbs Delays, EmissionsArticle3 Min ReadNASA and Partners Scaling to New Heights in Air Traffic ManagementImage Article1 Min ReadNASA Ames Welcomes Latvian President, Talks Aeronautics Research Article4 Min ReadNASA Cloud-Based Platform Could Help Streamline, Improve Air Traffic 2 Min ReadNASA Awards Contract for Aviation, Railroad Safety Reporting Systems News Release 1 Min ReadNASA Aeronautics Highlights for 2023 Feature 4 Min ReadArmstrong Flight Research Center: A Year in ReviewArticle 6 Min Read2023 in Review: Highlights from NASA in Silicon ValleyArticle The air traffic solutions NASA is working on today build from a foundation of research that goes back decades. Three recently concluded projects in particular are helping to develop new ways of doing things in the 21st century. The two features presented here help tell those project’s stories. A Story for Axel: Big Ideas for Better Air Mobility with Drones of all Sizes In this essay from 2021 — which was originally presented as a three-part web feature — NASA Aeronautics’ senior writer Jim Banke tells his newborn grandson, Axel, the story of how two recently concluded major air traffic management research projects by NASA will help achieve a long-held vision for the future of aviation. Read this Story About NASA's Air Traffic Solutions As NASA Aeronautics senior writer Jim Banke tells his grandson, Axel, about two recently concluded research projects involving drones large and small, Axel appears to be imagining what the major elements of that future as told to him by his grandpa might be.NASA/ Jim Banke, Lillian Gipson NASA Delivers on Making Gate to Gate Flights More Efficient In this story from March 2022, a summary of NASA's three-part Airspace Technology Demonstration (ATD) project is presented. It details how a team of NASA's aeronautical innovators working with government and industry partners spent fives years developing and demonstrating new tools to help you fly from here to there in the most time-efficient, fuel-saving, and cost-effective manner possible. Read this Story About ATD At NASA’s air traffic management laboratory near the Dallas/Ft. Worth International Airport in Texas, researchers Al Capps (seated) and Paul Borchers demonstrate Airspace Technology Demonstration 2 (ATD-2) tools that air traffic managers began testing in 2017. NASA / Jim Banke Air traffic controllers test NASA-developed concepts in FutureFlight Central, an ultra-realistic, 360-degree, simulated control tower at NASA Ames Research Center.NASA / Dominic Hart Air Traffic Solutions Gallery 7 Images Go To Gallery Go To Gallery Here is Some Other Cool NASA Aeronautics Stuff to Check Out Aeronautics @ Home A collection of activities and lessons to learn more about NASA Aeronautics and the science of flight that you can do at home. STEM Learning Resources Explore hands-on activities, interactive lesson plans, educator guides, and other downloadable content related to aeronautics. Aeronautics Backgrounds Take video calls from your home or office in the cockpit of the X-59 or from inside a wind tunnel! And other aviation themes. Free E-Books to Download Add these books covering NASA Aeronautics and other aviation and space topics to your electronic library. NASA X Video Files This binge worthy page collects aeronautics-themed topics from the popular NASA X video series. Facebook logo @NASA@NASAaero@NASAes @NASA@NASAaero@NASA_es Instagram logo @NASA@NASAaero@NASA_es Linkedin logo @NASA Other Aeronautics topics Even More Aeronautics Supersonic Flight Research about flying faster than the speed of sound. Flight Innovation Stories about pioneering the frontiers of 21st century flight. Drones & You All about new ways to get from here to there in the air. Green Aviation Tech Learn about research to make aviation more sustainable. Air Traffic Solutions Read about how NASA is opening up the sky for all. Keep Exploring Discover More Topics From NASA Missions Humans In Space Solar System Exploration Follow Us on Social Media Explore NASA’s History"
