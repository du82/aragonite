full_description = "Humans in SpaceHumans in SpaceHumans in Space HomeLiving in Space HomeCommercial Space HomeAstronauts HomeWhy go to space?Where are we going?Living in SpaceCommercial SpaceCommercial Space HomeLow Earth Orbit EconomyCommercial Human Landing SystemsLunar EconomyCommercial Lunar Payload ServicesAstronautsAstronauts HomeActive AstronautsManagement AstronautsFormer AstronautsAstronaut CandidatesPartner AstronautsBecome an AstronautSpacesuitsSpacecraft and RocketsMoreDestinationsNews and Media Humans in Space For more than two decades, people have lived and worked continuously aboard the International Space Station, advancing scientific knowledge, and making research breakthroughs that are not possible on Earth. Latest Expeditions All Expeditions Expedition 72Expedition 71Expedition 70Expedition 69Expedition 68 Why go to space? Human space exploration addresses fundamental questions about our place in the universe and the history of our solar system. NASA’s exploration vision is anchored in providing value for humanity by answering some of the most fundamental questions: Why are we here? How did it all begin? Are we alone? What comes next? Learn More about Why go to space? Featured Video Down to Earth: The Astronaut’s Perspective NASA’s astronauts will take you on a journey to the International Space Station, exploring the life-changing experience of an orbital perspective. More Episodes Where are we going? Never has humanity endeavored to simultaneously architect multinational infrastructures in lunar orbit, on the lunar surface, and at Mars — all while maintaining high-demand government and private-sector operations in low Earth orbit. Learn more about NASA's destinations for human exploration. Destinations about Where are we going? Living in Space From the challenges of providing optimal nutrition to managing the risks posed by microgravity, NASA works to predict, assess, and solve the problems that humans encounter in space. Take a look at resources related to life in space. Learn More about Living in Space FEATURED VIDEO Everything About Living in Space With only five minutes and an unlimited number of questions, NASA astronaut Reid Wiseman describes living in space. Learn about the station’s temperature, astronaut food, prank calls, and more. Watch Now Commercial Space NASA supports a robust commercial space economy that advances American industry and promotes technological discovery through in-space work and research. American companies will continue to play an essential role in establishing a sustainable presence in space. Learn More about Commercial Space Artemis Missions to the Moon and Mars Under the Artemis campaign, NASA will land the first woman, first person of color, and its first international partner astronaut on the lunar surface, establishing long-term exploration for scientific discovery and preparing for human missions to Mars. Learn More about Artemis Missions to the Moon and Mars FEATURED SERIES Artemis I: Path to the Pad In a four-part series, NASA shares insight into the launch of the Space Launch System (SLS) rocket and Orion spacecraft for a flight test around the Moon in preparation for Artemis II. Watch Now Astronauts Astronauts train for a variety of missions, including performing research on the International Space Station, launching from American soil on spacecraft built by commercial companies, and preparing for missions to the Moon with Artemis. Learn More about Astronauts Latest News Article5 Min ReadNASA’s SpaceX Crew-10 to Explore Deep Space Exercise, HealthBlog2 Min ReadNASA’s SpaceX Crew-10 Enters Quarantine Ahead of Launch News Release2 Min ReadNASA’s SpaceX Crew-9 to Discuss Space Station Mission, Upcoming ReturnArticle2 Min ReadNASA Prepares Gateway Lunar Space Station for Journey to Moon 2 Min ReadNASA to Provide Coverage of Progress 91 Launch, Space Station Docking News Release 5 Min ReadNASA Marks Artemis Progress With Gateway Lunar Space StationArticle 2 Min ReadNASA’s SpaceX Crew-10 Meets Dragon, Tests Equipment Ahead of LaunchBlog 2 Min ReadNASA Invites Media to Simulated Mars Habitat Before Next Mission News Release NASA's Space Operations Mission Directorate NASA’s Space Operations Mission Directorate maintains a continuous human presence in space for the benefit of people on Earth, enabling exploration efforts, commercial space, science, and other agency missions through communication, launch services, research capabilities, and crew support. Learn More about NASA's Space Operations Mission Directorate NASA astronaut Victor Glover and JAXA astronaut Soichi Noguchi inside the SpaceX Dragon spacecraft at the International Space Station.Credits: NASA NASA's Exploration Systems Development Mission Directorate NASA’s Exploration Systems Development Mission Directorate manages the human exploration system development for lunar orbital, lunar surface, and Mars. Learn More about NASA's Exploration Systems Development Mission Directorate Artemis II astronauts meeting with software and avionics hardware teams working on the Orion spacecraft.Credits: NASA Keep Exploring Discover More Topics From NASA Astronauts Living in Space Space Station Research and Technology Destinations"
