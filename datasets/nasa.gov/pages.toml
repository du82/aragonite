full_description = "About NASAOrganizationLeadershipNASA OrganizationNASA’s ImpactBudgets and ReportsCenters & FacilitiesAll NASA Centers & FacilitiesNASA HeadquartersAmes Research CenterArmstrong Flight Research CenterGlenn Research CenterGoddard Space Flight CenterGoddard Institute for Space StudiesJet Propulsion LaboratoryJohnson Space CenterKatherine Johnson IV and V FacilityKennedy Space CenterLangley Research CenterMarshall Space Flight CenterMichoud Assembly FacilityNASA Engineering and Safety CenterNASA Safety CenterNASA Shared Services CenterNeil A. Armstrong Test FacilityStennis Space CenterWallops Flight FacilityWhite Sands Test FacilityDirectoratesAll NASA DirectoratesAeronautics Research Mission DirectorateExploration Systems Development Mission DirectorateScience Mission DirectorateSpace Operations Mission DirectorateSpace Technology Mission DirectorateMission Support DirectoratePeopleNASA CareersNASA History NASA Directorates The National Aeronautics and Space Administration is broken down into six Mission Directorates. Aeronautics, Exploration Systems, Science, Space Operations, and Space Technology. Aeronautics Exploration Systems Mission Support Science Space Operations Space Technology Aeronautics Results achieved by NASA’s aeronautical innovators through the years directly benefit today’s air transportation system, the aviation industry, and the passengers and businesses who rely on those advances in flight every day. As a result, every U.S. commercial aircraft and U.S. air traffic control tower uses NASA-developed technology to improve efficiency and maintain safety. Learn More NASA and Lockheed Martin publicly unveil the X-59 quiet supersonic research aircraft at a ceremony in Lockheed Martin’s Skunk Works facility in Palmdale, California.NASA/Steve Freeman Exploration Systems The Exploration Systems Development Mission Directorate manages human exploration system development for lunar orbital, lunar surface, and Mars exploration. Artemis missions will open a new era of scientific discovery and economic opportunity on the Moon while validating operations and systems and preparing for human missions to Mars. Programs in the directorate include the Space Launch System rocket, Orion spacecraft, supporting ground systems, human landing systems, spacesuits, and Gateway. Learn More NASA’s Orion spacecraft completed its uncrewed Artemis I flight test in 2022, paving the way for future crewed missions to the Moon and beyond.NASA Mission Support The Mission Support Directorate enables NASA’s missions by providing foundational support capabilities responsive to evolving mission needs. The directorate delivers services and capabilities that ensure NASA has the technical skills, physical assets, financial resources, and top talent to be successful while also providing novel, innovative, high-quality solutions and leading-edge enterprise services to empower NASA customers, partners, and employees. Learn More A SpaceX Falcon 9 rocket with the company’s Dragon spacecraft onboard is seen on the launch pad at Space Launch Complex 40 following a brief static fire test ahead of NASA’s SpaceX Crew-9 mission.NASA/Keegan Barber Science The Science Mission Directorate is an organization where discoveries in one scientific discipline have a direct route to other areas of study. This flow is something extremely valuable and is rare in the scientific world. From exoplanet research to better understanding Earth’s climate to understanding the influence of the sun on our planet and the solar system, the directorate’s work is interdisciplinary and collaborative. Learn More Technicians move the Europa Clipper spacecraft inside the Payload Hazardous Servicing Facility to accommodate installation of its five-panel solar array at the agency’s Kennedy Space Center.NASA/Frank Michaux Space Operations The Space Operations Mission Directorate maintains a continuous human presence in space for the benefit of people on Earth. The programs within the directorate are the heart of NASA’s space exploration efforts, enabling Artemis, commercial space, science, and other agency missions through communication, launch services, research capabilities, and crew support. Learn More NASA astronaut and Expedition 68 Flight Engineer Nicole Mann is pictured in her Extravehicular Mobility Unit, or spacesuit, during her second spacewalk.NASA Space Technology Technology drives exploration and the space economy. NASA’s Space Technology Mission Directorate aims to transform future missions while ensuring American leadership in aerospace. The directorate develops, demonstrates, and transfers new space technologies that benefit NASA, commercial, and other government missions. Learn More Max Holliday, middle, installs one of the four PY4 spacecraft into the dispenser supplied by Maverick Space Systems ahead of vibration testing.NASA/Don Richey Directorate Leadership Aeronautics: Robert A. PearceFull BiographyExploration Systems: Catherine KoernerFull BiographyMission Support: David MitchellFull BiographyScience: Dr. Nicola FoxFull BiographySpace Operations: Ken BowersoxFull BiographySpace Technology: Clayton P. TurnerFull Biography Latest News More NASA News News Release3 Min ReadNASA Awards Launch Service for Mission to Study Storm Formation News Release4 Min ReadNASA Sets Coverage for Intuitive Machines’ Second Private Moon LandingBlog3 Min ReadDeparting Crew Talks to Journalists, Keeps Up Human Research and Lab Maintenance News Release2 Min ReadNASA Astronauts to Answer Questions from Students in Ohio, Texas Careers at NASA Align your talents with your passion and find out why NASA consistently is named a best place to work in the federal government. At NASA, you'll have an opportunity to work on unique and challenging projects that truly make an impact on humanity. Explore Opportunities about Careers at NASA Keep Exploring Discover More NASA Leadership NASA Organization NASA Centers and Facilities Missions"
