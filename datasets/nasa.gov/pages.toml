full_description = "About NASAOrganizationLeadershipNASA OrganizationNASA’s ImpactBudgets and ReportsCenters & FacilitiesAll NASA Centers & FacilitiesNASA HeadquartersAmes Research CenterArmstrong Flight Research CenterGlenn Research CenterGoddard Space Flight CenterGoddard Institute for Space StudiesJet Propulsion LaboratoryJohnson Space CenterKatherine Johnson IV and V FacilityKennedy Space CenterLangley Research CenterMarshall Space Flight CenterMichoud Assembly FacilityNASA Engineering and Safety CenterNASA Safety CenterNASA Shared Services CenterNeil A. Armstrong Test FacilityStennis Space CenterWallops Flight FacilityWhite Sands Test FacilityDirectoratesAll NASA DirectoratesAeronautics Research Mission DirectorateExploration Systems Development Mission DirectorateScience Mission DirectorateSpace Operations Mission DirectorateSpace Technology Mission DirectorateMission Support DirectoratePeopleNASA CareersNASA History Doing Business with NASA Work with NASA to explore and execute innovative, effective, and efficient acquisition business solutions to optimize capabilities and operations that enable NASA’s missions. Visit the Office of Procurement about Doing Business with NASA Partnerships Small Business Programs Vendor Database Partnering with NASA NASA offers 60 years of experience in advanced engineering and testing capabilities, cutting edge research and technology development, and unique assets for use by commercial industries, academic institutions, U.S. government agencies, and international entities. Partner With NASA Artist concept of commercial aircraft families with a Transonic Truss-Braced Wing configuration from the Sustainable Flight Demonstrator project.Boeing Small Businesses Make a Big Difference The vision of NASA’s Office of Small Business Programs is to promote and integrate all small businesses into the competitive base of contractors that pioneer the future of space exploration, scientific discovery, and aeronautics research. Hundreds of small businesses have contributed to some of NASA’s most premier space exploration missions, from the Space Launch System to the James Webb Space Telescope. Office of Small Business Programs Isabella Casillas Guzman, Administrator of the Small Business Administration, right, shakes hands with NASA Administrator Bill Nelson at the conclusion of an event held to unveil the 2022 Small Business Federal Procurement Scorecard.NASA/Aubrey Gemignani Join the NASA Vendor Database This database is open to all businesses (large and small) and colleges and universities that desire to work with NASA, as well as NASA employees who wish to view the landscape of prospective vendors. Registration Details DART team members carefully lower the DART spacecraft onto a low dolly in SpaceX’s payload processing facility on Vandenberg Space Force Base.NASA/Johns Hopkins APL/Ed Whitman NASA Brand and Collaborations Artifact Loans and TransfersThe Artifact Program educates, inspires, and builds connections with NASA through artifact loans and transfers to eligible museums, universities, and schools across the country.Read MoreExhibit Loans and CollaborationsNASA collaborates to create meaningful experiences and connections through exhibits at museums around the world, official NASA visitor centers, and high-profile events.Read MoreFilm and DocumentaryNASA participates in feature films, television shows, documentaries, multimedia projects, and interactions with celebrities to amplify NASA’s message and engage global, diverse audiences.Read MoreNASA Art ProgramThe NASA Art Program aims to inspire a new generation to connect with the agency by engaging in the creation of NASA-inspired art in communities across the country.Read MoreStrategic PartnershipsThrough engagement partnerships and collaborations, NASA reaches and inspires new audiences to engage in the agency's missions and discoveries, and boosts interest in science, technology, engineering, and math. Read MoreNASA Brand CenterThe Brand Center provides information on appropriate use of NASA images and multimedia, the strict regulations governing use of NASA logos, and more.Read MoreMerchandise ApprovalsStrict regulations govern the use of NASA logos and identifiers. NASA has established guidelines and best practices to ensure the agency's brand is used fairly and appropriately.Read More Resources Acquisition Forecast Annual forecast and semiannual update of expected contract opportunities or classes of contract opportunities. Agency Blackout Notices Information on final requests for proposals. SBIR and STTR Programs The Small Business Innovation Research (SBIR) and Small Business Technology Transfer (STTR) programs provide opportunities for small businesses and research institutions to partner with NASA. Unsolicited Proposal Format Guidance for the preparation and submission of unsolicited proposals. NASA FAR Supplement The official version of the National Aeronautics and Space Administration supplement to the Federal Acquisition Regulation (FAR) – NASA FAR Supplement (NFS). NASA Supplier Documentation Requirements for Software Producers In collaboration with the Office of Chief Information Officer (OCIO), attached is an updated memorandum to the Office of Procurement’s (OP) previously released guidance. Keep Exploring Discover More NASA Organization NASA Directorates NASA’s Impact Get Involved"
