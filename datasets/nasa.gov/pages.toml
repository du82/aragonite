full_description = "MultimediaImagesNASA+Podcastse-BooksGames and InteractivesMobile & Desktop Apps Sounds and Ringtones Translating NASA Data Into Sound There’s a new, immersive way to explore NASA’s data of our Universe. NASA has taken observational data from telescopes like NASA’s Chandra X-ray Observatory, Hubble Space Telescope, James Webb Space Telescope and others, and translated it into corresponding frequencies that can be heard by the human ear. A team of scientists, musicians, and a member of the blind and visually impaired community worked to adapt the NASA data. The audio tracks support blind and low-vision listeners first, but are designed to be captivating to anyone who tunes in. James Webb Space Telescope Sonifications This landscape of “mountains” and “valleys” speckled with glittering stars is actually the edge of a nearby, young, star-forming region called NGC 3324 in the Carina Nebula. Captured in infrared light by NASA’s new James Webb Space Telescope, this image reveals for the first time previously invisible areas of star birth.NASA, ESA, CSA, and STScI Explore infrared images and data from NASA’s James Webb Space Telescope through sound. Listeners can enter the soundscape of the Cosmic Cliffs in the Carina Nebula, explore the tones of the Southern Ring Nebula, and hear data from the transmission spectrum of an exoplanet. Webb’s Exoplanet WASP-96 b Sonification Webb’s Southern Ring Nebula Sonification: Mid-Infrared Webb’s Southern Ring Nebula Sonification: Near-Infrared Webb’s Southern Ring Nebula Sonification Webb’s Cosmic Cliffs Sonification: Stars Webb’s Cosmic Cliffs Sonification: Mountains Webb’s Cosmic Cliffs Sonification: Sky Webb’s Cosmic Cliffs Sonification Credit: NASA, ESA, CSA, STScI, and K.Arcand (CXC/SAO), M.Russo & A.Santaguida (SYSTEM Sounds), Q.Hart & C.Blome (STScI), and C.Malec (consultant). Hubble Space Telescope Sonifications This Hubble image, titled “Cosmic Reef” because of the resemblance to an undersea world, highlights the giant red nebula (NGC 2014) and its smaller blue neighbor (NGC 2020) in a vast star-forming region in the Large Magellanic Cloud. A grouping of bright, hefty stars, each 10 to 20 times more massive than our Sun, are the centerpiece of the image. Their cosmic winds and radiation shape the surrounding gas.NASA, ESA and STScI Ever wondered what the music of the spheres would sound like? Hubble brings us cosmic sights, but these astronomical marvels can be experienced with other senses as well. Through data sonification, the same digital data that gets translated into images is transformed into sound. Elements of the image, like brightness and position, are assigned pitches and volumes. No sound can travel in space, but sonifications provide a new way of experiencing and conceptualizing data. Sonifications allow the audience, including blind and visually impaired communities, to “listen” to astronomical images and explore their data. Hubble Space Telescope Sonifications Chandra X-ray Observatory Sonifications This composite image of the Crab Nebula, a supernova remnant, was assembled by combining data from five telescopes spanning nearly the entire breadth of the electromagnetic spectrum: the Very Large Array, the Spitzer Space Telescope, the Hubble Space Telescope, the XMM-Newton Observatory, and the Chandra X-ray Observatory. NASA, ESA, NRAO/AUI/NSF and G. Dubner (University of Buenos Aires) Sonification is the process that translates data into sound, and Chandra’s sound project brings our high-energy Universe to listeners for the first time. Listen to data translated from exploded stars, areas around black holes, clusters of stars and more. Galactic Center Cassiopeia A M16/Pillars of Creation Bullet Cluster Crab Nebula Supernova 1987A (SN 87A) Eta Carinae M87 Jet Sagittarius A* (Event Horizon Telescope Image) V404 Cygni Stephan’s Quintet NGC 6543 (Cat’s Eye Nebula) Chandra Deep Field Messier 51 (M51) Westerlund 2 Tycho Messier 87 (M87) Perseus Cluster Sagittarius A* Carina Nebula R Aquarii Messier 104 (M104) Credit: NASA, SAO, CXC, and K.Arcand (CXC/SAO), M.Russo & A.Santaguida (SYSTEM Sounds), and C.Malec (consultant). Sounds of Artemis I Moon Rocket Launch Liftoff! NASA’s Space Launch System carrying the Orion spacecraft lifts off the pad at Launch Complex 39B at the agency’s Kennedy Space Center in Florida at 1:47 a.m. EST on Nov. 16, 2022. Listen to the sounds of NASA’s Space Launch System (SLS) rocket roaring to life and lifting off from the launch pad for the first time. The Moon rocket, carrying the Orion spacecraft atop, launched the Artemis I test flight from Launch Complex 39B at NASA’s Kennedy Space Center in Florida at 1:47 a.m. EST on Wednesday, Nov. 16, 2022. As the rocket launched, NASA launch commentator Derrol Nail said, “We rise together, back to the Moon – and beyond.” Artemis I is the first in a series of increasingly complex missions to the Moon. With Artemis, NASA will land the first woman and the first person of color on the lunar surface and establish long-term exploration at the Moon in preparation for human missions to Mars. Downloads Liftoff Aug 15, 2023 MPEG (199.92 KB) We Rise Together Aug 14, 2023 MPEG (174.61 KB) Sounds of Mars from Perseverance Rover This image was taken during the first drive of NASA’s Perseverance rover on Mars on March 4, 2021. Perseverance landed on Feb. 18, 2021, and the team has been spending the weeks since landing checking out the rover to prepare for surface operations. First Audio Recording of Sounds on Mars This recording was made by the SuperCam instrument on NASA’s Perseverance Mars rover on Feb. 19, 2021, just about 18 hours after landing on the mission’s first sol or Martian day. The rover’s mast, holding the microphone, was still stowed on Perseverance’s deck, and so the sound is muffled, a little like the sound one hears listening to a seashell or having a hand cupped over the ear. Just a little wind can be heard. Credit: NASA/JPL-Caltech/LANL/CNES/CNRS/ISAE-Supaero Perseverance Rover’s SuperCam Records Wind on Mars This recording was made on Feb. 22, 2021, on the fourth sol (Martian day) by the SuperCam instrument on NASA’s Perseverance rover after deployment of the rover’s mast. It provides a different overall sound than the SuperCam audio recording from the mission’s first sol. Some wind can be heard, especially around 20 seconds into the recording. Rover background sounds have been removed. Credit: NASA/JPL-Caltech/LANL/CNES/CNRS/ISAE-Supaero First Acoustic Recording of Laser Shots on Mars This is the first acoustic recording of laser impacts on a rock target on Mars from March 2, 2021, the 12th sol (Martian day) from Perseverance’s SuperCam instrument. The sounds of 30 impacts are heard, some slightly louder than others. Variations in the intensity of the zapping sounds will provide information on the physical structure of the targets, such as its relative hardness or the presence of weathering coatings. The target, Máaz (“Mars” in Navajo), was about 10 feet (3.1 m) away. Credit: NASA/JPL-Caltech/LANL/CNES/CNRS/ISAE-Supaero NASA’s Ingenuity Mars Helicopter in Flight For the first time, a spacecraft on another planet has recorded the sounds of a separate spacecraft. NASA’s Perseverance Mars rover used its SuperCam microphone to listen to the Ingenuity helicopter on April 30, 2021 as it flew on Mars for the fourth time.With Perseverance parked 262 feet (80 meters) from the helicopter’s takeoff and landing spot, the mission wasn’t sure if the microphone would pick up any sound of the flight. Even during flight when the helicopter’s blades are spinning at 2,537 rpm, the sound is greatly muffled by the thin Martian atmosphere. It is further obscured by Martian wind gusts during the initial moments of the flight. Listen closely, though, and the helicopter’s hum can be heard faintly above the sound of those winds.Scientists made the audio, which is recorded in mono, easier to hear by isolating the 84 hertz helicopter blade sound, reducing the frequencies below 80 hertz and above 90 hertz, and increasing the volume of the remaining signal. Some frequencies were clipped to bring out the helicopter’s humCredit: NASA/JPL-Caltech/LANL/CNES/CNRS/ISAE-Supaéro NASA’s Perseverance Records a Martian Dust Devil This audio shows the results of NASA’s Perseverance Mars rover using its SuperCam microphone to record the sounds of a Martian dust devil – the first time any such recording has been made. The dust devil passed directly over Perseverance on Sept. 27, 2021, the 215th Martian day, or sol, of the mission.Credit: NASA/JPL-Caltech/LANL/CNES/CNRS/INTA-CSIC/Space Science Institute/ISAE-Supaero Perseverance Rover Records Puffs and Pings of Gaseous Dust Removal Tool Perseverance Rover Records Puffs and Pings of Gaseous Dust Removal Tool (filtered) This recording was made by the Perseverance Mars rover on February 9, 2022 (Sol 346). The puffs and pings of the rover’s Gaseous Dust Removal Tool (gDRT) were collected using a microphone on the rover’s chassis. The gRDT has a tank of nitrogen gas and is used during sample collection to blow the dust away and reveal the fresh rock surface underneath.Credit: NASA/JPL-Caltech Sounds of Perseverance Mars Rover Driving – Sol 16 (16 minutes) Listen to 16 minutes of raw, unfiltered sounds of the Perseverance Mars rover traveling in Jezero Crater. The noise generated by the interaction of the rover’s wheels and suspension with the surface can be heard, along with a high-pitched scratching noise. Perseverance’s engineering team continues to evaluate the source of the scratching noise, which may either be electromagnetic interference from one of the rover’s electronics boxes or interactions between the rover mobility system and the Martian surface. The entry, descent, and landing microphone was not intended for surface operations and had limited testing in this configuration before launch.Credit: NASA/JPL-Caltech Sounds of Perseverance Mars Rover Driving – Sol 16 (90-second highlights) NASA engineers combined three segments from the raw audio file recorded while the Perseverance Mars rover rolled across a section of Jezero Crater on sol 16 of the mission. Sections 0:20-0:45, 6:40-7:10, and 14:30-15:00 were combined into this 90-second highlight clip. There has been processing and editing to filter out some of the noise.Credit: NASA/JPL-Caltech Sounds from Mars – Filters out rover self-noise Sounds from Mars – Includes rover self-noise Audio of Juno’s Ganymede Flyby NASA’s Juno spacecraft captured this view of Jupiter during the mission’s 40th close pass by the giant planet on Feb. 25, 2022. The large, dark shadow on the left side of the image was cast by Jupiter’s moon Ganymede. Hear radio emissions collected during Juno’s June 7, 2021, flyby of Jupiter’s moon Ganymede.Credit: NASA/JPL-Caltech/SwRI/Univ of Iowa Audio of Juno’s Ganymede Flyby Sounds of Mars from InSight Lander NASA’s InSight Mars lander took this final selfie on April 24, 2022, the 1,211th Martian day, or sol, of the mission. The lander is covered with far more dust than it was in its first selfie, taken in December 2018, not long after landing – or in its second selfie, composed of images taken in March and April 2019. The arm needs to move several times in order to capture a full selfie. Because InSight’s dusty solar panels are producing less power, the team will soon put the lander’s robotic arm in its resting position (called the “retirement pose”) for the last time in May of 2022. Animation available at https://photojournal.jpl.nasa.gov/catalog/PIA25287 “Dinks and donks” from InSight’s seismometer A recording of “dinks and donks,” strange sounds created by friction inside of InSight’s seismometer, called SEIS. Scientists aren’t entirely sure what causes each of these sounds, by they are created by parts inside the seismometer contracting as they cool down, especially during sunset. These were recorded on just after sundown on July 16, 2019 (Sol 226). Magnitude 3.3 marsquake from July 25, 2019 A recording of a magnitude 3.3 marsquake from InSight’s seismometer, called SEIS. This quake was recorded on July 25, 2019 (Sol 235). Far below the human range of hearing, this sonification from SEIS had to be sped up and slightly processed to be audible through headphones. Magnitude 3.7 marsquake from May 22, 2019 A recording of a magnitude 3.7 marsquake from InSight’s seismometer, called SEIS. This quake was recorded on May 22, 2019 (the 173rd Martian day, or sol, of the mission). Far below the human range of hearing, this sonification from SEIS had to be sped up and slightly processed to be audible through headphones. Sounds of InSight’s robotic arm A recording of sounds created by InSight’s robotic arm as its camera scanned the surface of Mars on March 6, 2019, the 98th Martian day, or sol, of the mission. Also captured are wind gusts and “dinks” produced by friction inside of InSight’s seismometer, called SEIS. Raw Sounds from InSight’s Seismometer on Mars (full length) A subwoofer or earphones are needed to hear this clip. Listen to raw, unprocessed data from the seismometer on NASA’s InSight spacecraft of vibrations caused by wind moving over the solar panels on Mars. The sounds were recorded by two of the three short-period sensors on the seismometer (SEIS). Raw Sounds from InSight’s Seismometer on Mars (short clip) A subwoofer or earphones are needed to hear this clip. Listen to raw, unprocessed data from the seismometer on NASA’s InSight spacecraft of vibrations caused by wind moving over the solar panels on Mars. The sounds were recorded by two of the three short-period sensors on the seismometer (SEIS). More Audible Sounds from InSight’s Seismometer on Mars Listen to data from the seismometer on NASA’s InSight spacecraft of vibrations caused by Martian wind moving over the lander’s solar panels. In this version, the data have been processed to raise the frequencies by two octaves to make them more audible. Sounds from InSight’s Pressure Sensor on Mars Listen to data from the air pressure sensor on NASA’s InSight lander, indicating wind blowing by on Mars. The data were sped up by a factor of 100, shortening the duration of the recording and shifting it up in frequency 100 times (a little more than six octaves). Third Rock Radio NASA’s mission of discovery and exploration is being showcased in a custom-produced Internet music radio station that is crafted specifically to speak the language of tech-savvy young adults. Third Rock – America’s Space Station offers listeners a New Rock/Indie/Alternative format. The station is being developed and operated at no cost to the government through a Space Act Agreement with Houston-based RFC Media. Third Rock also will help partner companies fill high-tech job openings in the engineering, science and IT fields. Visit Third Rock. Visit Third Rock NASA on Soundcloud A close-up view of an astronaut’s bootprint in the lunar soil, photographed with a 70mm lunar surface camera d"
