["https://www.nasa.gov/centers-and-facilities/langley/una-reunion-familiar-de-la-nasa"]
title = "Una reunión familiar de la NASA por casualidad - NASA"
description = "Al crecer en Puerto Rico, Yomayra Cruz-Díaz no imaginó que algún día trabajaría en la NASA."
full_description = "2 min readUna reunión familiar de la NASA por casualidadJessica ArreolaSocial Media / Public Engagement LeadOct 13, 2024 Article Yomayra Cruz-Díaz, coordinadora de proyectos técnicos en NASA Langley con su hijo, Israel Martínez-Cruz. Martínez sirve en los Marines de los Estados Unidos y está destinado en la Estación Aérea de los Marines en Miramar. NASA / Jessica Arreola Read this story in English here. Al crecer en Puerto Rico, Yomayra Cruz-Díaz nunca imaginó que algún día trabajaría en la NASA. Actualmente , se desempeña como coordinadora de proyectos técnicos en el Centro de Investigación Langley de la NASA en Virginia, apoyando a su Dirección de Investigación Aeronáutica. El trabajo de Cruz-Díaz le requiere viajar para apoyar eventos de participación pública, y recientemente apoyó la presencia de la NASA en una exhibición aérea en San Diego, California, donde el puesto de la agencia presentó materiales STEM en español. Algo, o, mejor dicho, alguien hizo que este evento fuera especialmente único para Cruz-Díaz: su hijo, Israel Martínez-Cruz actualmente sirve en los Marines de los Estados Unidos y está asignado en la Estación Aérea en Miramar. En un golpe de suerte, ambos trabajaron en el mismo evento para sus respectivos empleadores. Al vivir en lados opuestos del país, no se habían visto en persona durante casi un año. Con sorpresa y alegría, se abrazaron. Al crecer en un hogar puertorriqueño, las conversaciones sobre los valores fundamentales eran sobre el tema de la familia. Martínez-Cruz recuerda haber visto a su madre trabajar en la NASA y sentirse inspirado por su ética de trabajo. Ese nivel de compromiso resulto ser hereditario. “Israel y yo compartiríamos el viaje en coche” , ella dijo. “El me dejaba en Langley y luego seguía el camino a su escuela de mecánica aeronáutica.” Martínez-Cruz se desempeña como controlador de tránsito aéreo, trabajo que Cruz-Díaz conocía pero que nunca había visto en persona. “Él me ha explicado lo que implica su trabajo, pero hacer un recorrido por su lugar de trabajo me da una comprensión completamente nueva,” ella dijo, después de un recorrido por la torre de control de tráfico aéreo. La NASA se enorgullece de celebrar el Mes de la Herencia Hispana, una celebración anual que rinde homenaje a las amplias y ricas historias, culturas y contribuciones de la comunidad Hispana y Latina. En palabras del administrador de la NASA, Bill Nelson, “Adelante y hacia arriba.” Facebook logo @NASA@NASAaero@NASA_es @NASA@NASAaero@NASA_es Instagram logo @NASA@NASAaero@NASA_es Linkedin logo @NASA Explore More 2 min read NASA Marks 110 Years Since Founding of Predecessor Organization Article 2 days ago 3 min read NASA’s X-59 Completes Electromagnetic Testing Article 1 week ago 4 min read NASA University Research Program Makes First Award to a Community College Project Article 1 week ago Keep Exploring Discover More Topics From NASA Missions Artemis Aeronautics STEM Explore NASA’s History Share Details Last Updated Oct 15, 2024 EditorJim BankeContactJessica Arreolajessica.arreola@nasa.govLocationNASA Langley Research Center Related TermsLangley Research CenterAeronáuticaAeronauticsHispanic Heritage MonthNASA en español"
