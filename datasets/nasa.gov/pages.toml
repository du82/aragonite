full_description = "Humans in SpaceHumans in SpaceHumans in Space HomeLiving in Space HomeCommercial Space HomeAstronauts HomeWhy go to space?Where are we going?Living in SpaceCommercial SpaceCommercial Space HomeLow Earth Orbit EconomyCommercial Human Landing SystemsLunar EconomyCommercial Lunar Payload ServicesAstronautsAstronauts HomeActive AstronautsManagement AstronautsFormer AstronautsAstronaut CandidatesPartner AstronautsBecome an AstronautSpacesuitsSpacecraft and RocketsMoreDestinationsNews and Media Commercial Space NASA is enabling commercial industry to build, own, and operate space systems with the agency purchasing services for its science and research needs. Industry also can use those same services for fully commercial activities in space. Through our public-private partnerships, we are helping open space to more science, more people, and more opportunities. The Low Earth Orbit Economy The low Earth orbit economy is a new and growing market of private companies providing access to, and services in, space. Customers include NASA, other government agencies, academic and research-based institutions, and other private companies. Low Earth Orbit Economy about The Low Earth Orbit Economy Location Low Earth orbit is 1,200 miles or less above Earth’s atmosphere. Did you know? 51 humans have flown on commercial vehicles to low Earth orbit. DID YOU KNOW? 2020 was the year of the first crewed flight on a commercial vehicle to the space station. in the future NASA is currently funding three companies to develop commercial space stations. Ride to the Moon? Human Landing Systems Bringing astronauts from orbit around the Moon onto lunar soil NASA’s commercial providers, Blue Origin and SpaceX, are building the human landing systems that will carry Artemis astronauts to the lunar surface and back to lunar orbit for their ride home to Earth aboard Orion. Commercial Human Landers about Human Landing Systems Side-by-side illustrations of the SpaceX Starship lunar lander and the Blue Origin Blue Moon lunar lander. SpaceX/Blue Origin Featured Story How NASA’s Work Led to Commercial Spaceflight Revolution For more than 60 years, NASA has pushed the boundaries of human exploration for the benefit of all, and now… Read the Story FAQs Commercial Space Frequently Asked Questions (FAQs) Do you have questions? We have answers! Learn more about low Earth orbit, legal, private astronaut missions, and commercial low Earth orbit partnerships through answers to a variety of frequently asked questions. View FAQs about Commercial Space Frequently Asked Questions (FAQs) A view of the Moon, Venus and Jupiter with the Earth’s atmospheric golden glow in the foreground at night was taken from the space station.NASA The Lunar Economy NASA is leading Artemis, humanity’s return to the Moon. With international partners and U.S. industry providers, the future at the Moon holds promise for a robust lunar marketplace. Lunar Economy about The Lunar Economy Location Earth’s Moon Formed 4.5 billion years ago DISTANCE 250,000 miles from Earth About Commercial Lunar Payload Services NASA is working with several American companies to deliver science and technology to the lunar surface through the Commercial Lunar Payload Services initiative. These companies, ranging in size, bid on delivering payloads for NASA. This includes everything from payload integration and operations, to launching from Earth and landing on the surface of the Moon. Under Artemis, commercial deliveries beginning in 2023 will perform science experiments, test technologies, and demonstrate capabilities to help NASA explore the Moon as it prepares for human missions. Commercial Lunar Payload Services about Commercial Lunar Payload Services Image of the Moon’s surface taken by Lunar Orbiter 3.NASA Featured Story What Is a Spacesuit? A spacesuit is much more than a set of clothes astronauts wear on spacewalks. A fully equipped spacesuit is really… Read the Story Commercial Space News Stay up-to-date with the latest content from NASA as we explore the universe and discover more about our home planet. Station Nation: Meet Chris Wade, Visiting Vehicle Integration Manager for SpaceX Vehicles 5 min read Chris Wade is a visiting vehicle integration manager for SpaceX vehicles in the International Space Station Transportation Integration Office. He… Article NASA Sets Coverage for Intuitive Machines’ Second Private Moon Landing 4 min read Carrying NASA technology demonstrations and science investigations, Intuitive Machines is targeting their Moon landing no earlier than 12:32 p.m. EST… News Release NASA Successfully Acquires GPS Signals on Moon 3 min read NASA and the Italian Space Agency made history on March 3 when the Lunar GNSS Receiver Experiment (LuGRE) became the… Article 1 2 3 … 367 Next Commercial Space 34 Images Go To Gallery Go To Gallery Facebook logo @NASA@ISS@NASAAstronauts@NASACommercialCrew @NASA@Commercial_Crew@ISS_Research@NASA_Astronauts@NASASpaceOps@Space_Station Instagram logo @NASA@ISS@NASAAstronauts Keep Exploring Discover More Topics From NASA Commercial Crew Program Overview Commercial Lunar Payload Services Low Earth Orbit Economy Space Operations Mission Directorate"
