title = "NASA Selects New Round of Student-Led Aviation Research Awards"
description = "NASA has selected two new university student teams to participate in real-world aviation research awards challenges meant to transform the skies above our communities."
full_description = "3 min readNASA Selects New Round of Student-Led Aviation Research AwardsJohn GouldAeronautics Research Mission DirectorateFeb 19, 2025 Article Contents Real World Research Awards Cerritos Community College Colorado School of Mines NASA / Getty Images NASA has selected two new university student teams to participate in real-world aviation research challenges meant to transform the skies above our communities. The research awards were made through NASA’s University Student Research Challenge (USRC), which provides students with opportunities to contribute to NASA’s flight research goals. This round is notable for including USRC’s first-ever award to a community college: Cerritos Community College. We’re trying to tap into the community college talent pool to bring new students to the table for aeronautics. steven holz NASA Project Manager “We’re trying to tap into the community college talent pool to bring new students to the table for aeronautics,” said Steven Holz, who manages the USRC award process. “Innovation comes from everywhere, and people with different viewpoints, educational backgrounds, and experiences like those in our community colleges are also interested in aeronautics and looking to make a difference.” Real World Research Awards Through USRC, students interact with real-world aspects of the research ecosystem both in and out of the laboratory. They will manage their own research projects, utilize state-of-the-art technology, and work alongside accomplished aeronautical researchers. Students are expected to make unique contributions to NASA’s research priorities. USRC provides more than just experience in technical research. Each team of students selected receives a USRC grant from NASA – and is tasked with the additional challenge of raising funds from the public through student-led crowdfunding. The process helps students develop skills in entrepreneurship and public communication. The new university teams and research topics are: Cerritos Community College “Project F.I.R.E. (Fire Intervention Retardant Expeller)” will explore how to mitigate wildfires by using environmentally friendly fire-retardant pellets dropped from drones. Cerritos Community College’s team includes lead Angel Ortega Barrera as well as Larisa Mayoral, Paola Mayoral Jimenez, Jenny Rodriguez, Logan Stahl, and Juan Villa, with faculty mentor Janet McLarty-Schroeder. This team also successfully participated with the same research topic in in NASA’s Gateway to Blue Skies competition, which aims to expand engagement between the NASA’s University Innovation project and universities, industry, and government partners. Colorado School of Mines The project “Design and Prototyping of a 9-phase Dual-Rotor Motor for Supersonic Electric Turbofan” will work on a scaled-down prototype for an electric turbofan for supersonic aircraft. The Colorado School of Mines team includes lead Mahzad Gholamian as well as Garret Reader, Mykola Mazur, and Mirali Seyedrezaei, with faculty mentor Omid Beik. Complete details on USRC awardees and solicitations, such as what to include in a proposal and how to submit it, are available on the NASA Aeronautics Research Mission Directorate solicitation page. About the AuthorJohn GouldAeronautics Research Mission DirectorateJohn Gould is a member of NASA Aeronautics' Strategic Communications team at NASA Headquarters in Washington, DC. He is dedicated to public service and NASA’s leading role in scientific exploration. Prior to working for NASA Aeronautics, he was a spaceflight historian and writer, having a lifelong passion for space and aviation. Facebook logo @NASA@NASAaero@NASA_es @NASA@NASAaero@NASA_es Instagram logo @NASA@NASAaero@NASA_es Linkedin logo @NASA Explore More 2 min read NASA Marks 110 Years Since Founding of Predecessor Organization Article 2 days ago 3 min read NASA’s X-59 Completes Electromagnetic Testing Article 1 week ago 4 min read NASA University Research Program Makes First Award to a