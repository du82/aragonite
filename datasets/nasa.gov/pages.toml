full_description = "FOIAFOIA HomeFOIA ContactsFOIA GuidanceAccess NASA RecordsNASA FOIA ReportsFOIA E-LibrariesSubmit a Request NASA FOIA Enacted in 1966, the Freedom of Information Act (FOIA) gives any person a right, enforceable in court, to obtain access to federal agency records, except to the extent that such records (or portions of them) are protected from public disclosure by one of nine exemptions or by one of three special law enforcement record exclusions. The FOIA thus established a statutory right of public access to Executive Branch information in the federal government. Wes Brown Chief FOIA Officer, Deputy Associate Administrator, Office of Communications Sarah Scharf Principal Agency FOIA Officer Stephanie Fox Deputy Agency FOIA Officer / FOIA Public Liaison Our Mission Our Vision Our Mission The National Aeronautics and Space Administration’s Freedom of Information Act (FOIA) program is designed to provide access to Agency documents through a citizen-centered service using a results-oriented FOIA program. Learn More About FOIA Artemis – Gateway – Artemis IV – Solar Arrays Our Vision Our vision is to create a cohesive and effective knowledge-sharing environment while safeguarding sensitive information in accordance with Federal laws and regulations. The NASA FOIA program is committed to providing the public with excellent customer service as well as access to disclosable agency documents in accordance with all appropriate laws and regulations. Learn More About FOIA Artist’s Concept of the Earth Entry System for Mars Sample Return FOIA Resources Explore our FOIA websites to learn more about NASA's FOIA program, the FOIA statute, and download records and reports. FOIA ContactsFOIA GuidanceFOIA ReportsFOIA E-Libraries Submit a FOIA Request To submit a FOIA request, please follow the link below. Submit a Request Keep Exploring Additional Resources From NASA NASA Organization NASA History Office Doing Business with NASA Space Technology Research Grants"
