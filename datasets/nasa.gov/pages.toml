full_description = "Advanced Air Vehicles ProgramHomeAeronautics Research Mission…Advanced Air Vehicles ProgramAdvanced Air Vehicles ProgramProjectsAdvanced Air Transport TechnologyCommercial Supersonic TechnologyHypersonic TechnologyHi-Rate Composite Aircraft ManufacturingHybrid Thermally Efficient CoreRevolutionary Vertical Lift TechnologyAboutLeadership and TeamContact NASA Advanced Air Vehicles Program Advanced Air Vehicles Program (AAVP) studies, evaluates and develops technologies and capabilities for new aircraft systems, and also explores far-future concepts that hold promise for revolutionary air-travel improvements. Learn More About AAVP about Advanced Air Vehicles Program PROGRAM DIRECTOR (PD) Dr. Nateri Madavan DEPUTY PD Dr. James (Jim) Heidmann Latest AAVP Program News More AAVP News Image Article1 Min ReadNASA Runs X-59 Engine with Maximum Afterburner for First TimeArticle2 Min ReadNASA, Notre Dame Connect Students to Inspire STEM CareersImage Article3 Min ReadNASA to Test Technology for X-59’s Unique Shock Wave MeasurementsArticle3 Min ReadNASA Flips Efficient Wing Concept for Testing 5 Min ReadNASA Funds New Studies Looking at Future of Sustainable AircraftArticle 3 Min ReadNASA, GE Aerospace Advancing Hybrid-Electric Airliners with HyTECArticle 2 Min ReadNASA Composite Manufacturing Initiative Gains Two New MembersArticle 2 Min ReadNASA Prepares for Air Taxi Passenger Comfort StudiesArticle AAVP Leadership Learn more about the leadership for the Advanced Air Vehicles Program. More Aeronautics Leadership Bios Dr. Nateri MadavanDirectorRead Nateri Madavan's BioDr. James (Jim) HeidmannDeputy DirectorRead Jim Heidmann's Bio Projects AAVP pursues its research goals across these projects. Advanced Air Transport Technology (AATT)NASA’s vision for advanced fixed-wing transport aircraft of the future features revolutionary energy efficiency and environmental compatibility. The overarching goal of the AATT project is to explore and develop technologies and concepts to enable this vision.Read More on AATTCommercial Supersonic Technology (CST)Supersonic vehicle research addresses the development of tools, technologies, and knowledge that will help eliminate today's technical barriers to practical commercial supersonic flight.Read More on CSTHypersonic Technology (HT)The HT project focuses on sustaining hypersonic competency for national needs while advancing fundamental hypersonics research. NASA maintains unique specialized facilities and experts who can explore ways to solve the challenges of high-speed flight.Read More on HTHi-Rate Composite Aircraft Manufacturing (HiCAM)The HiCAM project addresses an aviation industry need for more rapid production of composite aircraft to meet increasing global demand for lightweight transport aircraft. Read More on HiCAMHybrid Thermally Efficient Core (HyTEC)The Hybrid Thermally Efficient Core project is working with industry partners to develop small core engine technologies to enable fuel burn reductions, additional use of electric airplane systems through power extracted from the engine, and advance engine operability and compatibility with sustainable aviation fuels.Read More on HyTECRevolutionary Vertical Lift Technology (RVLT)With their unique ability to take off and land from any spot, and hover in place, vertical lift vehicles are increasingly being contemplated for use in new ways that go far beyond those considered when thinking of traditional helicopters. We invest in development of cutting-edge technology and tools with new focus on Advanced Air Mobility.Read More on RVLT Featured Video Advanced Air Vehicles Program Videos Watch informational videos on NASA’s Advanced Air Vehicles Program and the exciting work NASA is doing to better aviation. Watch More AAVP Videos on YouTube Advanced Air Vehicles Program Gallery 28 Images Go To Gallery Go To Gallery Quesst Mission Interested in flying to your next destination in half the time? NASA's Quesst mission is to lead a government-industry team to collect data that could make commercial supersonic flight over land possible, dramatically reducing air travel time in the United States or anywhere in the world. The centerpiece of the mission is the X-59 aircraft. Learn More About the Quesst Mission about Quesst Mission Learn More and Get Involved Research Solicitations Find opportunities to collaborate with NASA’s aeronautical innovators and/or contribute to their research to enable new and improved air transportation systems. ARMD Strategic Vision The Strategic Implementation Plan sets forth the NASA Aeronautics Research Mission Directorate vision for aeronautical research aimed at the next 25 years and beyond. Read this important document here. NASA Aeronautics Research Institute The NASA Aeronautics Research Institute promotes innovation in aeronautics across a broad spectrum of aeronautical challenges in the nation’s air transportation system. Learn about them here. NASA Advisory Council Aeronautics Committee The NASA Advisory Council's aeronautics committee advises the agency's leadership on strategic plans, programs, and other matters pertinent to aeronautics research. Public input at meetings is welcome. Read more here. Aeronautics STEM & Learning Resources Explore hands-on activities, interactive lesson plans, educator guides, and other downloadable content about aeronautics. Other Aeronautics topics Even More Aeronautics Supersonic Flight Research about flying faster than the speed of sound. Flight Innovation Stories about pioneering the frontiers of 21st century flight. Drones & You All about new ways to get from here to there in the air. Green Aviation Tech Learn about research to make aviation more sustainable. Air Traffic Solutions Read about how NASA is opening up the sky for all. Facebook logo @NASA@NASAaero@NASAes @NASA@NASAaero@NASA_es Instagram logo @NASA@NASAaero@NASA_es Linkedin logo @NASA Explore More 3 min read NASA’s X-59 Completes Electromagnetic Testing Article 1 week