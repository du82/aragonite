title = "FARMing with Data: OpenET Launches new Tool for Farmers and Ranchers - NASA"
description = "A NASA and U.S. Geological Survey (USGS)-supported research and development team is making it easier for farmers and ranchers to manage their water resources."
full_description = "6 min readFARMing with Data: OpenET Launches new Tool for Farmers and RanchersMilan LoiaconoScience Communication SpecialistMar 04, 2025 Article Contents OpenET Data Explorer Tool: The Road to FARMS New Features in FARMS Continuing Evolution of FARMS Dwane Roth (right), a fourth generation grain farmer in Finney County, Kansas, stands with nephew Zion (left) in one of their corn fields. Roth’s farm became one of the first Water Technology Farms in Kansas around 2016, and he has been using OpenET data for the past few years to track evapotranspiration rates and conserve water. Photo courtesy of Dwane Roth A NASA and U.S. Geological Survey (USGS)-supported research and development team is making it easier for farmers and ranchers to manage their water resources. The team, called OpenET, created the Farm and Ranch Management Support (FARMS) tool, which puts timely, high-resolution water data directly in the hands of individuals and small farm operators. By making the information more accessible, the platform can better support decision-making around agricultural planning, water conservation, and water efficiency. The OpenET team hopes this will help farmers who are working to build greater resiliency in local and regional agriculture communities. “It’s all about finding new ways to make satellite data easier to access and use for as many people as possible,” said Forrest Melton, the OpenET project scientist at NASA’s Ames Research Center in Silicon Valley. “The goal is to empower users with actionable, science-based data to support decisions about water management across the West.” The goal is to empower users with actionable, science-based data to support decisions about water management across the West. Forrest melton OpenET Project Scientist OpenET Data Explorer Tool: The Road to FARMS The OpenET data explorer tool centers on providing evapotranspiration data. Evapotranspiration (ET) refers to the amount of water leaving Earth’s surface and returning to the atmosphere through evaporation (from soil and surface water) and transpiration (water vapor released by crops and other plants). Evapotranspiration is an important factor in agriculture, water resource management, irrigation planning, drought monitoring, and fire risk evaluation. The FARMS resource is the third phase of OpenET’s Data Explorer tool, launched in 2021, which uses satellite data to quantify evapotranspiration across the western U.S. It starts with using Landsat data to measure patterns in land surface temperature and key indicators of vegetation conditions. The satellite data is combined with agricultural data, such as field boundaries, and weather data, such as air temperature, humidity, solar radiation, wind speed, and precipitation. All of these factors feed into a model, which calculates the final evapotranspiration data. The new FARMS interface was designed to make that data easier to access, with features that meet specific needs identified by users. “This amount of data can be complicated to use, so user input helped us shape FARMS,” said Jordan Harding, app developer and interface design leader from HabitatSeven. “It provides a mobile-friendly, map-based web interface designed to make it as easy as possible to get automated, regular reports.” Top: A section of the 2024 annual report Roth submits to the Farm Service Agency, with hand-written annotations marking which crop will be grown that year. Bottom: Those same fields in the new OpenET FARMS interface, with a dashboard on the left displaying evapotranspiration data over the course of 2024 at monthly intervals. Each color line corresponds to the same color field on the map, showcasing how much evapotranspiration rates can differ between different crops in the same vicinity. The unique shape of the purple field (forage sorghum), is an example of a case where FARMS’ custom shape feature is helpful. Once the initial report is set up, Roth can re-run reports for the same fields at any time. NASA/OpenET “The FARMS tool is designed to help farmers optimize irrigation timing and amounts, simplify planning for the upcoming irrigation season, and automate ET and water use reporting,” said Sara Larsen, CEO of OpenET. “All of this reduces waste, lowers costs, and informs crop planning.” Although FARMS is geared towards agriculture, the tool has value for other audiences in the western U.S. Land managers who evaluate the impacts of wildfire can use it to evaluate burn scars and changes to local hydrology. Similarly, resource managers can track evapotranspiration changes over time to evaluate the effectiveness of different forest management plans. New Features in FARMS To develop FARMS, the OpenET team held listening sessions with farmers, ranchers, and resource managers. One requested function was support for field-to-field comparisons; a feature for planning irrigation needs and identifying problem areas, like where pests or weeds may be impacting crop yields. The tool includes numerous options for drawing or selecting field boundaries, generating custom reports based on selected models and variables, and automatically re-running reports at daily or monthly intervals. The fine spatial resolution and long OpenET data record behind FARMS make these features more effective. Many existing global ET data products have a pixel size of over half a mile, which is too big to be practical for most farmers and ranchers. The FARMS interface provides insights at the scale of a quarter-acre per pixel, which offers multiple data points within an individual field. “If I had told my father about this 15 years ago, he would have called me crazy,” said Dwane Roth, a fourth-generation farmer in Kansas. “Thanks to OpenET, I can now monitor water loss from my crops in real-time. By combining it with data from our soil moisture probes, this tool is enabling us to produce more food with less water. It’s revolutionizing agriculture.” The FARMS mobile interface displays a six-year evapotranspiration report of a pear orchard owned by sixth-generation California farmer Brett Baker. The purple line in the dashboard report (left) corresponds with the field selected in purple on the map view (right), which users can toggle between using the green buttons in the top right corners. Running multi-year reports allows farmers to review historical trends. NASA/OpenET For those like sixth-generation California pear farmer Brett Baker, the 25-year span of ET data is part of what makes the tool so valuable. “My family has been farming the same crop on the same piece of ground for over 150 years,” Baker said. “Using FARMS gives us the ability to review historical trends and changes to understand what worked and what didn’t year to year: maybe I need to apply more fertilizer to that field, or better weed control to another. Farmers know their land, and FARMS provides a new tool that will allow us to make better use of land and resources.” According to Roth, the best feature of the tool is intangible. “Being a farmer is stressful,” Roth said. “OpenET is beneficial for the farm and the agronomic decisions, but I think the best thing it gives me is peace of mind.” Being a farmer is stressful. OpenET is beneficial for the farm and the agronomic decisions, but I think the best thing it gives me is peace of mind. Dwane Roth Fourth-Generation Kansas Grain Farmer Continuing Evolution of FARMS Over the coming months, the OpenET team plans to present the new tool at agricultural conferences and conventions in order to gather feedback from as many users as possible. “We know that there is already a demand for a seven-day forecast of ET, and I’m sure there will be requests about the interface itself,” said OpenET senior software engineer Will Carrara. “We’re definitely looking to the community to help us further refine that platform.” “I think there are many applications we haven’t even thought of yet,” Baker added. “The FARMS interface isn’t just a tool; it’s an entirely new toolbox itself. I’m excited to see what people do with it.” FARMS was developed through a public-private collaboration led by NASA, USGS, USDA, the non-profit OpenET, Inc., Desert Research Institute, Environmental Defense Fund, Google Earth Engine, HabitatSeven, California State University Monterey Bay, Chapman University, Cornell University, University of Nebraska-Lincoln, UC Berkeley and other universities, with input from more than 100 stakeholders. For resources/tutorials on how to use FARMS, please visit: https://openet.gitbook.io/docs/additional-resources/farms About the AuthorMilan LoiaconoScience Communication SpecialistMilan Loiacono is a science communication specialist for the Earth Science Division at NASA Ames Research Center. Share Details Last Updated Mar 04, 2025 Related TermsAmes Research Center's Science DirectorateAmes Research CenterEarth ScienceEarth Science DivisionWater & Energy Cycle Explore More 2 min read 2025 Aviation Weather Mission: Civil Air Patrol Cadets Help Scientists Study the Atmosphere with GLOBE Clouds The Science Activation Program’s NASA Earth Science Education Collaborative (NESEC) is working alongside the Civil… Article 15 hours ago 2 min read NASA Marks 110 Years Since Founding of Predecessor Organization Article 2 days ago 3 min read NASA Uses New Technology to Understand California Wildfires Article 5 days ago Keep Exploring Discover More Topics From NASA Missions Humans in Space Climate Change Solar System"
