description = "Exploration is really the essence of the human spirit."
full_description = "AstronautsHomeHumans In SpaceAstronautsActive AstronautsAstronauts HomeManagement AstronautsFormer AstronautsMoreAstronaut CandidatesPartner AstronautsBecome an AstronautSpacesuits Astronauts The term “astronaut” derives from the Greek words meaning “star sailor,” and refers to all who have been launched as crew members aboard NASA spacecraft bound for orbit and beyond. The term “astronaut” has been maintained as the title for those selected to join the NASA corps of astronauts who make “star sailing” their career profession. Quick Facts Since inception, NASA has selected 360 astronaut candidates: 299 men, 61 women; 212 military, 138 civilians; 191 pilots, 159 non-pilots. When Expedition 1 arrived at the International Space Station on Nov. 2, 2000, there has been a continuous human presence at the space station since. Today there are usually seven astronauts living on board at any given time, from a variety of countries. The first class of NASA astronauts was selected in 1959. They are known as the Mercury 7. At the Space Station Don Pettit NASA astronaut and Expedition 72 Flight Engineer Alexey Ovchinin Roscosmos cosmonaut and Expedition 72 Flight Engineer Ivan Vagner Roscosmos cosmonaut and Expedition 72 Flight Engineer Suni Williams NASA astronaut and Expedition 72 Commander Butch Wilmore NASA astronaut and Expedition 72 Flight Engineer Nick Hague NASA astronaut and Expedition 72 Flight Engineer Aleksandr Gorbunov Roscosmos cosmonaut and Expedition 72 Flight Engineer Latest Astronauts News View More Astronauts News Blog2 Min ReadNASA’s SpaceX Crew-10 Enters Quarantine Ahead of Launch News Release2 Min ReadNASA’s SpaceX Crew-9 to Discuss Space Station Mission, Upcoming Return 2 Min ReadNASA’s SpaceX Crew-10 Meets Dragon, Tests Equipment Ahead of LaunchBlog 2 Min ReadStacking Complete on Artemis II Rocket BoostersBlog 7 Min ReadNASA Sets Briefings for Next International Space Station Crew Missions News Release Active Astronauts Management Astronauts Former Astronauts Astronaut Candidates Partner Astronauts Active Astronauts Eligible for flight assignment. Read More About Active Astronauts View of Nicole Mann is posing for photo with Josh Cassada (left) and Frank Rubio (right) both wearing their Extravehicular Mobility Units (EMUs) during Extravehicular Activity (EVA) Preparation Activities in the Quest Airlock (A/L) during Expedition 68. NASA/Nicole Mann Management Astronauts Currently employed at NASA but are no longer eligible for flight assignment. Learn More about Management Astronauts NASA Administrator Bill Nelson, left, NASA Deputy Administrator Pam Melroy, and NASA Associate Administrator Bob Cabana, right, pose for a group photograph, Monday, Feb. 28, 2022, at the Mary W. Jackson NASA Headquarters building in Washington. Photo Credit: (NASA/Bill Ingalls) Former Astronauts Former astronauts are those who have left NASA, including those who are deceased. Read More About Former Astronauts The Apollo 11 crew conducting a crew compartment fit and functional check, of the equipment and storage locations, in their command module. Peering from the hatch are from left, Neil Armstrong, commander; Michael Collins, command module pilot; and Buzz Aldrin, lunar module pilot. Armstrong and Aldrin later conducted a similar check aboard the lunar module, which carried them down to the lunar surface on July 20, 1969.NASA Astronaut Candidates Selected by NASA as candidates for the NASA astronaut corps. Learn More About Astronaut Candidates Astronaut Candidate Class of 2021. Photo Date: December 3, 2021. Location: JSC Mall. Photographer: Robert Markowitz Partner Astronauts Astronauts from international space agencies who have trained or served with NASA Astronauts. Learn More About Partner Astronauts Astronaut Samantha Cristoforetti looks at the Earth through the cupola, the International Space Station’s “window to the world.” Training for Artemis ii View Our Artemis II Crew Reid Wiseman Commander Victor Glover Pilot Christina Koch Mission Specialist Jeremy Hansen Mission Specialist Astronaut Appearance Request The Astronaut Appearances Office in Houston, Texas coordinates and arranges astronaut appearances for astronauts who are actively employed by NASA. NASA astronauts appear before a variety of groups to inform the public about the U.S. space program. Typically, presentations are made to high schools and universities, community organizations, businesses and associations, or military organizations. Request Astronaut Appearance about Astronaut Appearance Request NASA’s SpaceX Crew-3 astronauts, from left to right, Raja Chari, Kayla Barron, Mark Vande Hei, and Tom Marshburn answer questions from students during their visit to Amidon-Bowen Elementary School, Thursday, Dec. 8, 2022, in Washington.NASA/Keegan Barber Exploration is really the essence of the human spirit. History Astronaut Selection More than 12,000 people applied to be an astronaut between March 2 and March 31, 2020. The astronaut selection committee is now in the process of reviewing those applications. NASA expects to announce its selections in mid-2021. Learn More About Astronaut Selection about Astronaut Selection (Jan. 10, 2020) — The 2017 Class of Astronauts participate in graduation ceremonies at the Johnson Space Center in Houston, Texas. From left are, NASA astronaut Jonny Kim, Canadian Space Agency (CSA) astronaut Joshua Kutryk, NASA astronaut Jessica Watkins, CSA astronaut Jennifer Sidey-Gibbon, NASA astronauts Kayla Barron, Jasmin Moghbeli, Loral O’Hara, Zena Cardman, Raja Chari, Matthew Dominick, Bob Hines and Warren Hoburg. This is the first class of astronauts to graduate under the Artemis program and are now eligible for assignments to the International Space Station, Artemis missions to the Moon, and ultimately, missions to Mars. Resources NASA Astronaut Fact Book November, 2024 Astronaut Health and Training Learn more about astronaut health and training. Astronaut Outreach and media resources JSC