title = "Aeronautics"
description = '''Welcome to NASA's online home for all things related to the first "A" in NASA —Aeronautics. Here you can stay informed about NASA's research to improve air travel and make it more sustainable.'''
full_description = '''AeronauticsSupersonic FlightGreen Aviation TechDrones & YouAir Traffic SolutionsMoreFlight InnovationScience in the AirNASA Aircraft Let’s Fly! Welcome to NASA’s online home for all things related to the first “A” in NASA —Aeronautics. Here you can stay informed about NASA’s research to improve air travel and make it more sustainable. And if you’re interested in how NASA airplanes support the agency’s science programs and flight operations, we’ve got you covered. NASA is with you when you fly. pictured: from 1975, the only time nasa's five ship fleet of F-104 starfighters were airborne at the same time.(see full image in aeronautics gallery below.) welcome to the flight line – FEATURED AERONAUTICS content Explore NASA's Aeronautics Research Mission Directorate Wind Tunnel 4-Foot Supersonic Unitary Plan Wind Tunnel From the Hangar NASA's new Boeing 777 based in Virginia. Aero e-Book Modeling Flight: The Role of Dynamically Scaled Free-Flight Models in Support of NASA's Aerospace Programs JSC Aircraft Ops Learn about the Aircraft Operations Division at Johnson Space Center and the airplanes they fly. Ames Research Center Read about aeronautics work at NASA's Ames Research Center in California. Latest Aeronautics News More NASA Aeronautics News Article2 Min ReadNASA Marks 110 Years Since Founding of Predecessor Organization Feature1 Min ReadThe NACA: Launching the Future of Flight News Release4 Min ReadNASA Remembers Long-Time Civil Servant John BoydArticle3 Min ReadNASA’s X-59 Completes Electromagnetic Testing 4 Min ReadNASA University Research Program Makes First Award to a Community College ProjectArticle 3 Min ReadNASA Selects New Round of Student-Led Aviation Research AwardsArticle 3 Min ReadNASA’s X-59 Turns Up Power, Throttles Through Engine TestsArticle 3 Min ReadNASA Supports GoAERO University Awardees for Emergency Aircraft PrototypingArticle NASA’s X-59 Fires Up Engine for Maximum Afterburner Testing 7 Images Go To Gallery Go To Gallery coming to an airport near you in 2050? NASA Funds New Studies Looking at Future of Sustainable Aircraft Picture yourself at an airport a few decades from now. What does your airliner look like? It’s more efficient, with lower emissions than today’s aircraft – what kinds of designs or technology make that possible? NASA is working to answer those questions by commissioning five new design studies looking to push the boundaries of possibility for sustainable aircraft. Read the story and see the ideas Artist’s concept of a 50-60 passenger hydrogen fuel cell electric plane created by Boeing through its future flight concept efforts. Aurora Flight Sciences, a Boeing Company, received an award through NASA’s Advanced Aircraft Concepts for Environmental Sustainability 2050 initiative to examine new alternative aviation fuels propulsion systems, aerodynamic technologies, and aircraft configurations, along with other technology areas.Boeing Aeronáutica en español Conozca los avances tecnológicos desarrollados por la NASA, la industria de la aviación está mejor equipada que nunca para transportar pasajeros y carga de manera segura y eficiente a destinos alrededor del mundo en español. Lee la noticia en español aquí NASA Aeronautics – A Vision for Aviation in the 21st Century NASA's Aeronautics Research Mission Directorate is working to enable industry to introduce transformative options for future air travel in at least four major areas. High-Speed Commercial FlightQuesst is NASA's mission to show the X-59 can fly supersonic without generating loud sonic booms and survey what people hear when it flies overhead. Reaction to the quieter sonic "thumps" will be shared with regulators who will then consider writing new rules to lift the ban on faster-than-sound flight over land.Read More on SupersonicsAdvanced Air MobilityAdvanced Air Mobility is NASA's mission to help emerging aviation markets safely develop an air transportation system that moves people and cargo between places previously not served or underserved by aviation, using revolutionary new aircraft that are only just now becoming possible thanks to converging technologies.Read More on Advanced Air MobilityUltra-Efficient AirlinersNASA is committed to supporting the U.S. climate goal of achieving net-zero greenhouse gas emissions from the aviation sector by 2050. Under the Sustainable Flight National Partnership, NASA is leading federal agencies and industry to accelerate the development of sustainable technologies. Read More on Ultra-Efficient AirlinersFuture Airspace and SafetyNASA is working with the Federal Aviation Administration and others to transform air traffic management systems to safely accommodate the growing demand of new air vehicles entering the airspace, enabling them to perform a variety of missions no matter what airspace that mission may require.Read More on Future Airspace and Safety AERONAUTICS RESEARCH MISSION Quesst Quesst is the name of NASA Aeronautics' mission to help take the first step toward enabling commercial, faster-than-sound air travel over land. The centerpiece of the mission is NASA's X-59 research aircraft. The experimental supersonic jet is designed with technology that reduces the loudness of a sonic boom to a gentle thump. NASA will fly the X-59 over select U.S. communities and take surveys to record what people think of the quieter sonic thumps. The human response data will be delivered to U.S. and international regulators, who will consider setting new rules that allow supersonic flight over land. Stay up to date at the Quesst mission page AAM News Feed Advanced Air Mobility Mission NASA’s Advanced Air Mobility (AAM) research will transform our communities by bringing the movement of people and goods off the ground, on demand, and into the sky. This air transportation system of the… Learn More Stunning Aeronautics Images Gallery 34 Images Go To Gallery Go To Gallery Featured Videos Aeronautics Videos Playlist Your next binge worthy series is right here. Enjoy this collection of videos that help tell the story of how NASA Aeronautics is transforming aviation for the 21st century. See the Aeronautics Video Playlist Aeronautics Innovation Challenges NASA’s Aeronautics Innovation Challenges are your entry points to the exciting, fast-moving aviation world of today. And they’re valuable ways for us to get inputs and ideas that may never have occurred to us. Thank you for joining our journey! Learn More about Aeronautics Innovation Challenges about Aeronautics Innovation Challenges Fly With Us! Start Your Own Aeronautics Flight Log Book NASA invites you, your family – even your friends and classmates – to sign up and add your name to our list of virtual passengers. Your name can ride with us on our X-planes, drones, and other flights as NASA explores ways to improve aviation for everyone. Print your personalized boarding passes, enter flights into your virtual flight log, and access activities, videos, and more! Set Up Your Flight Log Here about Start Your Own Aeronautics Flight Log Book The NACA The predecessor of NASA, the National Advisory Committee for Aeronautics (NACA) was founded in 1915 with the intent of being an advisory committee that would coordinate research underway elsewhere. It quickly became a leading research organization in the new field of aeronautics, pushing back the boundaries of flight until its transformation into NASA in 1958. Read More about the NACA about The NACA Here are Some Other Cool NASA Aeronautics Stuff to Check Out Aeronautics Innovation Challenges Learn more about NASA Aeronautics sponsored challenges and competitions. Aeronautics @ Home A collection of activities and lessons to learn more about NASA Aeronautics and the science of flight that you can do at home. STEM Learning Resources Explore hands-on activities, interactive lesson plans, educator guides, and other downloadable content related to aeronautics. Aeronautics Virtual Backgrounds Take video calls from your home or office in the cockpit of the X-59 or from inside a wind tunnel! And other aviation themes. Free E-Books to Download Add these books covering NASA Aeronautics and other aviation and space topics to your electronic library. NASA X Video Files This binge worthy page collects aeronautics-themed topics from the popular NASA X video series. NASA Aeronautics on Mars & Earth Learn more about NASA's Ingenuity Helicopter. Other Aeronautics topics Explore NASA's Aeronautics Research Mission Directorate Supersonic Flight Research about flying faster than the speed of sound. Flight Innovation Stories about pioneering the frontiers of 21st century flight. Drones & You All about new ways to get from here to there in the air. Green Aviation Tech Learn about research to make aviation more sustainable. Air Traffic Solutions Read about how NASA is opening up the sky for all. NASA Aircraft Information about NASA's fleet of aircraft. Science in the Air News about using NASA aircraft to better understand our world. Facebook logo @NASA@NASAaero@NASAes @NASA@NASAaero@NASA_es Instagram logo @NASA@NASAaero@NASA_es Linkedin logo @NASA Keep Exploring Discover More Topics From NASA Missions Artemis Aeronautics STEM Explore NASA’s History'''
