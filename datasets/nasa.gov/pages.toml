["https://www.nasa.gov/aeronautics/drones-and-you"]
title = "Drones and You"
description = "The Drones and You page is NASA’s vision for the Advanced Air Mobility (AAM) Mission which is to help emerging aviation markets to safely develop an air transportation system that moves people and cargo between places previously not served or underserved by aviation – local, regional, intraregional, urban – using revolutionary new aircraft that are only just now becoming possible."
full_description = "AeronauticsHomeAeronauticsDrones & YouSupersonic FlightGreen Aviation TechDrones & YouAir Traffic SolutionsMoreFlight InnovationScience in the AirNASA Aircraft Drones & You Look here for updates about NASA research into making it possible for drones of all types and sizes to safely move through the sky. This includes air taxis that promise to provide new personal flight options and robot drones designed to fly in atmospheres elsewhere in the solar system — among many other related areas of research. Latest News Related to Drones & You More Drones & You News Article4 Min ReadNASA Flight Tests Wildland Fire Tech Ahead of DemoArticle3 Min ReadNASA Small Business Funding Enables Aircraft Inspection by Drone 4 Min ReadNASA Kicks off Testing Campaign for Remotely Piloted Cargo FlightsArticle 3 Min ReadNASA Moves Drone Package Delivery Industry Closer to RealityArticle 2 Min ReadNASA Armstrong Builds Sensor Pod for Autonomous FlightImage Article Featured Story NASA Uses Two Worlds to Test Future Mars Helicopter Designs Engineers will go beyond the ends of the Earth to find more performance for future Mars helicopters. For the first… Read the Story Drones and You Gallery 19 Images Go To Gallery Go To Gallery Advanced Air Mobility Mission The vast majority of the research detailed on this Drones & You page resides in NASA's Air Mobility (AAM) mission. The AAM vision is to transform our communities by bringing the movement of people and goods off the ground, on demand, and into the sky. This air transportation system of the future will include low-altitude passenger transport, cargo delivery, and public service capabilities. This includes delivering data to guide industry's development of electric air taxis and drones and to assist the Federal Aviation Administration in safely integrating these vehicles into the national airspace. This will set the stage for a flourishing industry by 2030. Read More About the AAM Mission Several projects supporting NASA’s Advanced Air Mobility (AAM) mission are working on different elements to help make AAM a reality. For example, AAM could be used in future healthcare operations in the form of air taxi ambulances or delivery of medical supplies. This concept graphic shows how a future AAM vehicle could aid in healthcare by carrying passengers to a hospital.NASA Here is Some Other Cool NASA Aeronautics Stuff to Check Out Aeronautics @ Home A collection of activities and lessons to learn more about NASA Aeronautics and the science of flight that you can do at home. STEM Learning Resources Explore hands-on activities, interactive lesson plans, educator guides, and other downloadable content related to aeronautics. Aeronautics Backgrounds Take video calls from your home or office in the cockpit of the X-59 or from inside a wind tunnel! And other aviation themes. Free E-Books to Download Add these books covering NASA Aeronautics and other aviation and space topics to your electronic library. NASA X Video Files This binge worthy page collects aeronautics-themed topics from the popular NASA X video series. Other Aeronautics topics Even More Aeronautics Supersonic Flight Research about flying faster than the speed of sound. Flight Innovation Stories about pioneering the frontiers of 21st century flight. Drones & You All about new ways to get from here to there in the air. Green Aviation Tech Learn about research to make aviation more sustainable. Air Traffic Solutions Read about how NASA is opening up the sky for all. Facebook logo @NASA@NASAaero@NASAes @NASA@NASAaero@NASA_es Instagram logo @NASA@NASAaero@NASA_es Linkedin logo @NASA Keep Exploring Discover More Topics From NASA Missions Artemis Science Missions NACA to NASA to Now"
