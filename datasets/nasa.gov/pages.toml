["https://www.nasa.gov/feature/mejores-imagenes-de-ciencia-en-la-estacion-espacial-2024"]
title = "Mejores imágenes de Ciencia en la estación espacial 2024 - NASA"
description = "Los miembros de la tripulación de la Estación Espacial Internacional realizaron cientos de experimentos durante 2024."
full_description = "Scroll to Continue Mejores imágenes de Ciencia en la estación espacial 2024Los miembros de la tripulación de la Estación Espacial Internacional realizaron cientos de experimentos durante 2024, cubriendo campos científicos que van desde investigaciones sobre los seres humanos hasta ciencias de la Tierra y demostraciones de tecnología. Disfruta de esta galería de imágenes de algunos de estos experimentos.The International Space Station is pictured from inside a window aboard the SpaceX Crew Dragon Endeavour during a fly around of the orbiting lab that took place following its undocking from the Harmony module’s space-facing port on Nov. 8, 2021.NASA Los astronautas de la Expedición 70 de la NASA (de izquierda a derecha) Mike Barratt, Matthew Dominick y Loral O’Hara toman fotos de la Tierra desde el interior de la cúpula, la “ventana al mundo” de la Estación Espacial Internacional. A más de 400 kilómetros (250 millas) por encima de la superficie, la estación ofrece un punto de vista único para observar nuestro planeta.Crédito: NASAiss070e132878 (March 31, 2024) Expedition 70 NASA Astronauts (from left) Mike Barratt, Matthew Dominick, and Loral O’Hara take photos of Earth from inside the cupola, the International Space Station’s “window to the world.” Over 250 miles above the surface, station provides a unique vantage point to observe our planet.NASA El astronauta de la NASA Don Pettit fusiona la ciencia y el arte al convertir el agua en finas obleas de hielo utilizando un congelador de la estación espacial que se mantiene a -95,5 grados Celsius (-140 grados Fahrenheit). Pettit fotografió el hielo utilizando un equipo especial que llevó de la Tierra y que incluye un filtro polarizador.Crédito: NASA La astronauta de la NASA Tracy C. Dyson trabaja en Gaucho Lung, una investigación que estudia la administración de medicamentos en el sistema respiratorio en microgravedad, donde es posible aislar las fuerzas que afectan el comportamiento de los líquidos. Los resultados podrían identificar nuevas formas de administrar medicamentos y apoyar el desarrollo de recubrimientos que previenen la incrustación para sondas de intubación de líquidos utilizadas en el cuidado de la salud, la industria alimentaria y otras aplicaciones. Crédito: NASAiss071e092807 (May 20, 2024) NASA astronaut Tracy C. Dyson works on Gaucho Lung, which studies the delivery of drugs in the respiratory system in microgravity, where it is possible to isolate forces that affect liquid behavior. Results could identify new ways to administer drugs and support the development of anti-fouling coatings for liquid tubing used in health care, the food industry, and other applications.NASA La astronauta de la NASA Jeanette Epps trabaja en el Laboratorio de Ciencia de Materiales. Esta instalación es utilizada para realizar investigaciones sobre materiales básicos y descubrir nuevas aplicaciones para metales, aleaciones, semiconductores, polímeros y cerámicas existentes, tanto nuevos como mejorados.Crédito: NASAiss071e195867 (June 17, 2024) NASA astronaut Jeanette Epps works on the Materials Science Laboratory. This research facility is used to conduct basic materials research and discover new applications for existing, new, or improved metals, alloys, semiconductors, polymers, and ceramics.NASA La astronauta de la NASA Suni Williams trabaja en StemCellEX-H1, una tecnología para la producción en el espacio de células madre de seres humanos que son utilizadas como terapia para ciertas enfermedades de la sangre y diferentes tipos de cáncer. Es posible que en microgravedad se puedan producir estas células en mayor número y con mayor calidad de lo que actualmente es posible en tierra. Crédito: NASA La microgravedad afecta la forma en que el agua y los nutrientes son transportados a las plantas. La astronauta de la NASA Suni Williams trabaja en la investigación Gestión de agua en plantas 5/6, la cual estudia las propiedades físicas de los fluidos, como la tensión superficial, en el espacio. Los resultados podrían apoyar el diseño de sistemas para mejorar el cultivo de plantas en gravedad reducida. Crédito: NASANASA astronaut Nick Hague processes samples for the Rhodium Biomanufacturing 03 experiment. The investigation explores how microgravity affects biomanufacturing engineered bacteria and yeast. Results could help overcome challenges and advance the use of microbes to make food, pharmaceuticals, and other products in space. La astronauta de la NASA Jasmin Moghbeli sonríe junto al Hábitat Avanzado de Plantas, donde crecen varias plantas de tomate, como parte del estudio Hábitat Vegetal 06. Este estudio sobre cómo los vuelos espaciales afectan el sistema inmunológico de las plantas y la producción de vegetales podría ayudar a respaldar el cultivo de las plantas y la producción de alimentos en misiones futuras. Crédito: NASAiss070e073612 (Jan. 18, 2024) NASA astronaut Jasmin Moghbeli smiles next to the Advanced Plant Habitat, where multiple tomato plants grow as part of Plant Habitat-06. This study of how spaceflight affects plant immune systems and plant production could help support plant growth and food production on future missions.NASA Un eclipse solar total pasa sobre México, Estados Unidos y Canadá. Millones de personas presenciaron cómo los cielos se oscurecían cuando la Luna pasaba entre la Tierra y el Sol. Los astronautas a bordo de la estación fotografiaron la sombra lunar que recorría el continente norteamericano. Crédito: NASA El astronauta de la NASA Matthew Dominick sostiene una bolsa con una simulación de suelo lunar y otros materiales mezclados con un líquido para el estudio Endurecimiento del concreto: una investigación de la ESA (Agencia Espacial Europea) sobre cómo la falta de gravedad afecta el endurecimiento y las propiedades del concreto. El uso de materiales locales, como regolito o polvo, para construir hábitats espaciales en la Luna podría reducir la cantidad de materias primas que deben ser enviadas desde la Tierra. Los resultados también podrían proporcionar información sobre la resistencia del hormigón y sus propiedades macroscópicas para mejorar las fórmulas de cerca de 4.000 millones de toneladas de concreto producido en la Tierra cada año. Crédito: NASAiss071e462520 (Aug. 12, 2024) NASA astronaut Matthew Dominick holds a bag of simulated lunar soil and other materials mixed with a liquid for Concrete Hardening, an ESA (European Space Agency) investigation that studies how lack of gravity affects concrete hardening and properties. Using local materials, such as regolith or dust, to build space habitats on the Moon could reduce the quantity of raw materials that must be shipped from Earth. Results also could provide insight into concrete strength and macroscopic properties to improve formulas for the 4 billion or so tons of concrete produced on Earth each year.NASA La astronauta de la NASA Suni Williams instala el hardware para el Experimento Reactor de Lecho Compacto. En un reactor de lecho compacto, se llena o compacta un tubo con microesferas porosas para aumentar el contacto entre un líquido y un gas que fluyen a través de él. Estos reactores tienen diversas aplicaciones en sistemas de soporte vital, incluyendo la recuperación de agua y la gestión térmica, y en celdas de combustible en el espacio y en la Tierra. Crédito: NASAiss071e485832 (Aug. 15, 2024) NASA astronaut Suni Williams installs hardware for the Packed Bed Reactor Experiment. In a packed bed reactor, a tube is filled or packed with porous beads to increase contact between a liquid and a gas flowing through it. These reactors have a variety of applications in life support systems, including water recovery and thermal management, and in fuel cells in space and on Earth.NASA La JAXA (Agencia Japonesa de Exploración Aeroespacial) está haciendo pruebas para saber si esta cámara robótica de vuelo libre, conocida como JEM Internal Ball Camera 2 (Cámara esférica interna 2 del Módulo Experimental Japonés), puede maniobrar y navegar de forma autónoma a bordo de la estación espacial para recopilar videos e imágenes. Tener a un robot que realice estas tareas podría dejarle tiempo libre a la tripulación para otras actividades, como llevar a cabo investigaciones científicas. Crédito: JAXA/Satoshi Furukawa La investigación Fibras espaciales perfectas 1 fabricó más de 11 kilómetros (siete millas) de fibra óptica en un mes, lo que demuestra por primera vez que es posible producir fibra óptica en longitudes a escala comercial en el espacio. En la imagen, la astronauta de la NASA Loral O’Hara se prepara para trabajar con el hardware del experimento. La fibra óptica obtenida en microgravedad tiene mejor calidad que las fibras estiradas en la Tierra y posee muchas aplicaciones en medicina, defensa, ciberseguridad y telecomunicaciones en la Tierra y en el espacio. Crédito: NASAiss070E110532 (March 8, 2024) The Flawless Space Fibers-1 investigation manufactured more than seven miles of optical fiber in one month, demonstrating for the first time that commercial lengths of fiber can be produced in space. Here, NASA astronaut Loral O’Hara gets ready to work with the experiment hardware. Optical fiber drawn in microgravity is higher quality than fibers drawn on Earth and has many applications in medicine, defense, cybersecurity, and telecommunications on Earth and in space.NASA La astronauta de la NASA Jeanette Epps almacena muestras de sangre y saliva en un congelador científico para el experimento Ensayo sobre inmunidad, para su análisis futuro. Esta investigación sobre la inmunidad tiene como objetivo desarrollar una prueba inmunitaria funcional durante los vuelos para monitorear cómo los factores estresantes de los vuelos espaciales afectan las funciones inmunitarias en el espacio. Crédito: NASAiss071e414653 (Aug. 1, 2024) NASA astronaut Jeanette Epps stows blood and saliva samples from the Immunity Assay experiment in a science freezer for future analysis. Immunity Assay aims to develop an in-flight functional immune test to monitor how spaceflight stressors affect immune functions in space.NASA El cometa C/2023 A3 (Tsuchinshan-ATLAS) se encontraba a unos 71 millones de kilómetros (44 millones de millas) de distancia de la Tierra en esta foto tomada desde la Estación Espacial Internacional, mientras la estación orbitaba a más de 400 kilómetros (250 millas) sobre el sur del océano Atlántico. Esta vista desde la estación espacial permite tener una perspectiva única sin estar obstaculizada por la atmósfera de la Tierra. Los astronautas pueden captar imágenes nítidas que proporcionan a los científicos más información sobre los cometas y otros fenómenos celestes.Crédito: NASA El astronauta de la NASA Mike Barratt reemplaza componentes dentro del Bastidor Integrado de Combustión de la estación espacial. Esta instalación se utiliza para una serie de experimentos sobre combustión que incluyen estudios sobre el rendimiento del combustible, el comportamiento de las llamas y la prevención de incendios. Los resultados podrían mejorar la seguridad de la tripulación y proporcionar información para mejorar la eficacia energética en el espacio y en la Tierra. Crédito: NASAiss071e439784 (Aug. 5, 2024) NASA astronaut Mike Barratt replaces components inside the space station’s Combustion Integrated Rack. This facility is used for a range of combustion experiments including studies on fuel efficiency, flame behavior, and fire prevention. Results could improve crew safety and provide insights to improve energy efficiency in space and on Earth.NASA El astronauta de la NASA Butch Wilmore comprueba las configuraciones de los pequeños satélites CubeSat que están empacados dentro del J-SSOD, un lanzador de satélites único. Varios satélites son enviados al espacio a través de la esclusa de aire de la estación. La tecnología de los CubeSat hace que las investigaciones espaciales sean más accesibles y económicas para las organizaciones gubernamentales, públicas y privadas de todo el mundo. Crédito: NASAiss071e523308 (Aug. 21, 2024) NASA astronaut Butch Wilmore checks configurations of CubeSats packed inside the J-SSOD, a unique satellite deployer. Several satellites are sent into space through the station’s airlock. CubeSat technology makes space research more accessible and more affordable to government, public, and private organizations around the world.NASA ¡La Expedición 71 está lista para la ciencia! Este retrato del equipo de astronautas dentro del vestíbulo que está entre el módulo Unity de la estación y la nave espacial de carga Cygnus de Northrop Grumman muestra, desde abajo y en el sentido de las agujas del reloj, a los astronautas de la NASA Matthew Dominick, Jeanette Epps, Suni Williams, Mike Barratt, Tracy C. Dyson y Butch Wilmore. Crédito: NASA La astronauta de la NASA Jasmin Moghbeli trota en el sistema de cinta de correr T2 de la estación espacial. El ejercicio diario es un componente importante para mantenerse saludable en el espacio. Sin la gravedad de la Tierra, los huesos y los músculos se atrofian o se vuelven más pequeños y débiles. En su muñeca izquierda, Moghbeli lleva un Actiwatch, un monitor que mide parámetros corporales como el sueño y la frecuencia cardíaca. Crédito: NASAiss070e100775 (Feb. 25, 2024) NASA astronaut Jasmin Moghbeli runs on the T2 treadmill system on space station. Daily exercise is an important component of staying healthy in space. Without Earth’s gravity, bone and muscle atrophy or become smaller and weaker. On her left wrist, Moghbeli wears Actiwatch, a monitor that measures body metrics like sleep and heart rate.NASA La astronauta de la NASA Tracy C. Dyson lleva a cabo una demostración tecnológica con un robot de vuelo libre Astrobee, como parte de Zero Robotics, un concurso de escritura de software para estudiantes. El código de los ganadores es ejecutado en uno de los robots de la estación. Este programa educativo está dirigido a estudiantes de escuela intermedia y secundaria, para alentar a los estudiantes de todo el mundo a seguir temas en los campos de STEM. Crédito: NASAiss071e046270 (May 1, 2024) NASA astronaut Tracy C. Dyson performs a tech demonstration with an Astrobee as part of Zero Robotics, a student software writing competition. Winners have their code run on one of the robots on the station. The educational program reaches middle school and high school students, encouraging students around the world to pursue STEM topics.NASA La astronauta de la NASA Suni Williams supervisa los nuevos accesorios en forma de tentáculo de Astrobee durante la investigación REACCH. Esta fue una de las cuatro sesiones para demostrar la capacidad de REACCH de capturar objetos flotantes, una habilidad que podría ayudar a recuperar objetos en órbita. El desarrollo de esta tecnología robótica podría extender la vida útil de los satélites y facilitar la eliminación de desechos espaciales. Crédito: NASA La demostración técnica de cirugía robótica llevó a cabo pruebas técnicas para utilizar"
