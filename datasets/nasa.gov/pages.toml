description = "NASA's aeronautics research can be sorted into several categories, such as sustainable aviation, supersonic flight, drones, and air traffic management. But not all of NASA's aeronautical investigations fit perfectly into a specific category. This page is home to those stories of flight innovation."
full_description = "AeronauticsHomeAeronauticsFlight InnovationSupersonic FlightGreen Aviation TechDrones & YouAir Traffic SolutionsMoreFlight InnovationScience in the AirNASA Aircraft Flight Innovation NASA’s aeronautics research can be sorted into several categories, such as sustainable aviation, supersonic flight, drones, and air traffic management. But not all of NASA’s aeronautical investigations fit perfectly into a specific category. This page collects those stories of flight innovation from NASA, with an emphasis on NASA’s research collaborations with academia. Latest Flight Innovation News More Flight Innovation News Article4 Min ReadNASA University Research Program Makes First Award to a Community College ProjectArticle3 Min ReadNASA Selects New Round of Student-Led Aviation Research Awards 3 Min ReadNASA Supports GoAERO University Awardees for Emergency Aircraft PrototypingArticle 1 Min ReadLangley’s Propeller Research TunnelImage Article 3 Min ReadNASA Small Business Funding Enables Aircraft Inspection by DroneArticle Featured Story NASA Small Business Funding Enables Aircraft Inspection by Drone A small business called Near Earth Autonomy developed a time-saving solution using drones for pre-flight checks of commercial airliners through… Read the Story Flight Innovations Gallery 10 Images Go To Gallery Go To Gallery Here is Some Other Cool NASA Aeronautics Stuff to Check Out Aeronautics @ Home A collection of activities and lessons to learn more about NASA Aeronautics and the science of flight that you can do at home. STEM Learning Resources Explore hands-on activities, interactive lesson plans, educator guides, and other downloadable content related to aeronautics. Aeronautics Backgrounds Take video calls from your home or office in the cockpit of the X-59 or from inside a wind tunnel! And other aviation themes. Free E-Books to Download Add these books covering NASA Aeronautics and other aviation and space topics to your electronic library. NASA X Video Files This binge worthy page collects aeronautics-themed topics from the popular NASA X video series. Other Aeronautics topics Even More Aeronautics Supersonic Flight Research about flying faster than the speed of sound. Flight Innovation Stories about pioneering the frontiers of 21st century flight. Drones & You All about new ways to get from here to there in the air. Green Aviation Tech Learn about research to make aviation more sustainable. Air Traffic Solutions Read about how NASA is opening up the sky for all. Keep Exploring Discover More Topics From NASA Missions Humans In Space Solar System Exploration Follow Us on Social Media Explore NASA’s History"
