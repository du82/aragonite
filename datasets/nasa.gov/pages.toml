full_description = "Aeronautics Research Mission DirectorateHomeAeronautics Research Mission…Aeronautics STEMARMD ProgramsAdvanced Air Vehicles ProgramAirspace Operations and Safety ProgramIntegrated Aviation Systems ProgramTransformative Aeronautics Concepts ProgramAerosciences Evaluation and Test CapabilitiesNewsAboutOrganization and LeadershipCurrent SolicitationsNAC Aeronautics CommitteeAeronautics STEMAeronautics Innovation ChallengesAeronautics en EspanolContact NASA Aeronautics STEM Explore hands-on Aeronautics STEM activities for all ages and experience levels focused on aeronautics, physical science, engineering design, literacy, and more. Our wide variety of STEM resources are perfect for at-home, informal, and more formal learning environments, with some available in both English and Spanish. Access our Monthly Aeronautics STEM Newsletter here about Aeronautics STEM stem integration lead April Lanotte OSTEM embed Dave Berger Aeronautics Flight Log Start Your Own Aeronautics Flight Log NASA invites you, your family – even your friends and classmates – to sign up and add your name to our list of virtual passengers. Your name can ride with us on our X-planes, drones, and other flights as NASA explores ways to improve aviation for everyone. Print your personalized boarding passes, enter flights into your virtual flight log, and access activities, videos, and more! Set Up Your Flight Log Here about Start Your Own Aeronautics Flight Log Aeronautics @ Home Below are just a few items that are available. Please click on All to see the entire listing. View All Aero @ Home Activities Paper Airplane TemplateView Airplane TemplateTornado in a BottleView Tornado in a BottleX-59 3D PrintingView X-59 3D PrintingX-59 Maker BundleView X-59 Maker Bundle NASA Aeronautics Career Resources Wildfire Aeronautics Researcher VideoView the Wildfire Researcher VideoAero STEM Career FlyerView the Aero STEM Career FlyerThe Quiet Crew VideosView the Quiet Crew VideosMemory Metal Engineer VideoView Memory Metal Engineer VideoThermal Blanket Technician VideoView Thermal Blanket Tech. VideoWind Tunnel Engineers VideoView Wind Tunnel Engineers VideoDanielle Koch – Leveled ReaderRead about Danielle KochMaria Caballero – Leveled ReaderRead about Maria CaballeroRed Jensen – Leveled ReaderRead about Red JensenCareers at NASALearn more about Careers at NASANASA Internship ProgramLearn more about NASA InternshipsNASA Glenn Apprenticeship ProgramLearn more about NASA Glenn ApprenticeshipNCAS (NASA Community Aerospace Scholars)Learn more about the NCASULI (University Leadership Initiative)Learn more about ULINASA Pathways ProgramLearn more about NASA Pathways NASA Internships NASA Office of STEM Engagement (OSTEM) paid internships allow high school and college-level students to contribute to agency projects under the guidance of a NASA mentor. Learn more about NASA Interships about NASA Internships aeronautics educational resources K–12 Educator Resources Discover more resources to learn about aeronautics and flight. Learn more about the K-12 Educator Resources STEM Toolkits Explore NASA Aeronautics STEM Toolkits to learn more about supersonic flight, sustainable aviation and advanced air mobility. Quesst Supersonic STEM ToolkitLearn more on Supersonic FlightSustainable Aviation STEM ToolkitLearn more on Sustainable AviationAdvanced Air Mobility (AAM) STEM ToolkitLearn more on AAM Smart Skies Smart Skies is a program developed by NASA to engage participants in air traffic control applications of pre-algebraic math. Smart Skies OverviewThe program enables students to apply proportional reasoning to make decisions and resolve conflicts in realistic air traffic control problems.View the OverviewLineUp with MathLineUp With Math consists of six Problem Sets, enabling students to explore and apply decision-making and proportional reasoning skills to resolve distance-rate-time conflicts in realistic air traffic control problems.View LineUp with MathSimulatorAir traffic control Sector 33 which simulates what an air traffic controller is responsible for to keep the airspace safe. There are a series of problems to complete.View the Simulator 3D Print Items Explore NASA Aeronautics’ 3D print files and other maker-friendly files. This includes our X-59 snowflake that can be folded from paper, 3D printed, laser cut, and more. New files are being added all the time so check back soon for more great printable, cuttable, foldable, and etchable files. X-59 3D FilesView X-59 3D FilesX-59 Snowflake 3D File and MoreView X-59 Snowflake FilesX-66 3D FileView X-66 3D File Reading Leveled Readers and Literacy Read about historical and modern people's journeys in aviation. This section of education resources series brings the history of American aviation to life by highlighting the accomplishments of famous and historical aviators, the options for STEM careers as seen through the stories of contemporary NASA ARMD personnel, and acknowledging crucial milestones in aviation. Learn more about Leveled Readers and Literacy about Leveled Readers and Literacy Amelia Earhart (front row, center) on the steps of Langley Research Building in 1928 before a tour. Legend has it that, during the tour, part of her raccoon fur coat was sucked into a high speed wind tunnel. NASA e-Books NASA Aeronautics has many e-Books available to read and download. Explore the many e-books offered by NASA. View more NASA e-Books Book cover for “Dressing with Altitude,” a history of pressure suits used by pilots making high altitude flights.NASA Aeronautics Innovation Challenges Learn more about NASA Aeronautics sponsored challenges and competitions. Learn more about Aeronautics Innovation Challenges about Aeronautics Innovation Challenges Challenge Dream with Us Challenge Design challenge details can be found in the Learn More link. Come fly with us—we're excited to see what you dream up! Learn more about the Dream with Us Challenge about Dream with Us Challenge Do you dream of flying through the air in new ways? A dream that could make a great video, digital collage, painting, graphic novel story, or other project?NASA / Getty Images / Lillian GIpson Learn More and Get Involved Monthly Aeronautics STEM Newsletter Access our monthly STEM newsletters focused on NASA Aeronautics. Content for both K-12 and post-secondary educators and organizations. NASA Learning Resources Explore hands-on activities, interactive, lesson plans, educator guides, and other downloadable content about a variety of topics. Gateways to Blue Skies Explore hands-on activities, interactive, lesson plans, educator guides, and other downloadable content about this topic. The Beginner's Guide to Aeronautics Explore hands-on activities, interactive, lesson plans, educator guides, and other downloadable content about this topic. Museum in a Box The Museum in a Box program brings the physical sciences of flight to students in grades K-12. NARI Aeronautics Research Institute The NASA Aeronautics Research Institute promotes innovation in aeronautics across a broad spectrum of aeronautical challenges in the nation’s air transportation system. Langley Innovation Design Challenges The 2021-22 challenge was the final year for this activity. Our thanks to NASA Langley and Liz Ward for coordinating this challenge for more than ten years. Check here for past competitions and winners. Facebook logo @NASA@NASAaero@NASAes @NASA@NASAaero@NASA_es Instagram logo @NASA@NASAaero@NASA_es Linkedin logo @NASA Explore More 3 min read NASA’s X-59 Completes Electromagnetic Testing Article 1 week ago 4 min read NASA University Research Program Makes First Award to a Community College Project Article 1 week ago 3 min read NASA Selects New Round of Student-Led Aviation Research Awards Article 2 weeks ago Keep Exploring Discover More Topics From NASA Learning Resources Earth & Climate Technology NASA History"
