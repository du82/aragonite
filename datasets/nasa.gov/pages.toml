\t\t\t\t\tScroll to Continue"""
full_description = '''The NACA As we celebrate the 110th anniversary of the March 3, 1915 formation of NASA’s predecessor, the National Advisory Committee for Aeronautics, we take a deeper look at the contributions of the four research centers where it all began. Scroll to Continue It shall be the duty of the advisory committee for aeronautics to supervise and direct the scientific study of the problems of flight with a view to their practical solution. congressional direction in establishing the NACA in 1915 On December 17, 1903, two brothers from Dayton, Ohio, named Wilbur and Orville Wright, were successful in flying an airplane they built. Their powered aircraft flew for 12 seconds above the sand dunes of Kitty Hawk, North Carolina. Chapter 1 PRELUDE The Wright Brothers made history with their 1903 flight, but U.S. leadership in aviation during the next decade fell behind as Europe invested in aeronautical research before the first world war. On December 17, 1903, two brothers from Dayton, Ohio, named Wilbur and Orville Wright, were successful in flying an airplane they built. Their powered aircraft flew for 12 seconds above the sand dunes of Kitty Hawk, North Carolina. Scroll to Continue The U.S. Answers with the NACAThe U.S. responded to Europe’s aeronautical trailblazing in 1915 by forming a committee of government, military, and industry leaders. It was called the National Advisory Committee for Aeronautics, or the NACA — with each letter pronounced.The NACA contributed to some of the most important advancements in the history of flight. And its people, its laboratories, and legacy, became the basis for NASA at the dawn of the Space Age.GRUMMAN F6F-3 #874 AIRPLANE on the NACA Ames flight line Watch this 83-second video for a look back at the beginnings of the NACA. A modified Bell X-1 model is tested in a Langley wind tunnel in 1947. A version of this rocket plane is the one that first flew faster than sound that same year.NACA Chapter 2 ORIGINS NACA research at what is now Langley Research Center had a modest start with two hangars, an initial staff of eleven people, and a single wind tunnel whose design was obsolete by the time it began operations. A modified Bell X-1 model is tested in a Langley wind tunnel in 1947. A version of this rocket plane is the one that first flew faster than sound that same year.NACA Scroll to Continue An Immediate DifferenceDespite unassuming beginnings, NACA researchers wasted no time setting the gold standard for aeronautical innovations, many of which became the basis for aviation technologies still in use today.One of the earliest advances was the NACA cowling, an aerodynamically efficient engine cover that improved aircraft performance, fuel efficiency, and safety. It made such a difference that in 1929 the technology and its inventors were awarded the Collier Trophy, aviation’s highest honor.A Curtis Hawk AT-5A equipped with an NACA cowling is seen in October 1928 at the Langley Memorial Aeronautical Laboratory in Virginia. The cowling was an early, award-winning innovation developed by the National Advisory Committee for Aeronautics, the predecessor of NASA.NASA Watch this 2-minute and 14-second video describing Langley Research Center’s early contributions to aviation research and its spaceflight legacy. langley research center, virginia The Mother Center Founded in 1917, Langley Memorial Aeronautical Laboratory was the first established NACA facility. All other NACA research centers grew from Langley, giving it the nickname of the Mother Center. Explore Today's Langley Research Center This is an aerial photo of NASA’s Langley Research Center in Hampton, Virginia.NASA / Sean Smith A full-size Ryan FR-1 airplane is tested in the 40×80 wind tunnel at the NACA’s Ames Aeronautical Laboratory during 1944.NACA Chapter 3 GROWTH With an ever growing demand for advances in aviation to serve both military and civilian needs, the NACA had to grow as well and found just what it needed by locating its second aeronautics laboratory in what would become Silicon Valley near San Francisco. A full-size Ryan FR-1 airplane is tested in the 40×80 wind tunnel at the NACA’s Ames Aeronautical Laboratory during 1944.NACA Scroll to Continue Doing Things BigThe laid back West Coast culture didn’t keep researchers at Ames from making urgent, big strides in aviation during and after World War II with the help of what was then the world’s largest wind tunnel, which opened in 1944.Achievements at Ames were many, with notable ones including design improvements to the P-51 Mustang fighter that helped win the war, and a Collier Award-winning method for preventing fatal ice build up on wings.P-51 airplane model in the NACA Ames Research Center Transonic 16ft w.t. Watch this 2-minute and 38-second video about the early days of research at Ames and how that work paved the way for the center’s current contributions to NASA. ames research center, california West Coast Expansion Founded in 1939, Ames Aeronautical Laboratory gave the NACA room to establish new facilities and expanded research capabilities at a time when California's aviation industry was rapidly growing just before World War II. Explore Today's Ames Research Center This is an aerial photo from 2012 of NASA’s Ames Research Center on Moffett Field in Silicon Valley, California.NASA An NACA technician cleans a component of an experimental ramjet in the 8-foot by 6-foot supersonic wind tunnel in 1950 at what was then known as the Lewis Flight Propulsion Laboratory in Cleveland.NACA Chapter 4 ENGINES The desire for airplanes — and eventually rockets — to fly faster, higher, and farther meant the NACA needed new ideas and research capabilities for improving propulsion. The solutions would be found in a new engine laboratory set up in Ohio. An NACA technician cleans a component of an experimental ramjet in the 8-foot by 6-foot supersonic wind tunnel in 1950 at what was then known as the Lewis Flight Propulsion Laboratory in Cleveland.NACA Scroll to Continue Moving Right AlongFrom the NACA’s engine laboratory’s start in 1941, each decade saw propulsion advancements that began with piston-driven propellers; continued on with turbojets, pure jets, and ramjets; and then moved on to rocket engines to power the Space Age.National Aeronautics and Space Administration (NASA) Convair F-106B Delta Dart with a 32-spoke nozzle installed on its General Electric J85 test engine. Lewis acquired a Delta Dart fighter in 1966 to study the components for propulsion systems that could be applied to supersonic transport aircraft at transonic speeds. The F-106B was modified with two General Electric J85-13 engines under its wings to study these components. The original test plan was expanded to include the study of boattail drag, noise reduction, and inlets. From February to July 1971 the modified F-106B was used to study different ejector nozzles. Researchers conducted both acoustic and aerodynamic tests on the ground and in flight. Several models were created to test different suppression methods. NASA Lewis’ conical nozzle was used as the baseline configuration. Flightline and sideline microphones were set up on the ground. The F-106B would idle its own engine and buzz the recording station from an altitude of 300 feet at Mach 0.4 with the test engines firing. Researchers found that the suppression of the perceived noise level was usually lower during flight than the researchers had statistically predicted. The 64 and 32-spoke nozzles performed well in actual flight, but the others nozzles tended to negatively affect the engine’s performance. Different speeds or angles- -of-attack sometimes changed the noise levels. In the end, no general conclusions could be applied to all the nozzles. Watch this 2-minute and 4-second video showcasing Glenn’s work on propulsion for both aircraft and spacecraft. glenn research center, ohio The Power and the Glory Founded in 1941, the NACA's Aircraft Engine Research Laboratory took the lead in studying all aspects of aircraft propulsion, increasing available power and enabling faster aircraft for both military and civilian uses. Explore Today's Glenn Research Center This is an aerial view of NASA’s Glenn Research Center on Lewis Field in Cleveland.NASA The NACA Muroc Contingent in October 1947 in front of the Bell Aircraft Corporation X-1-2 and Boeing B-29 launch aircraft. NASA Chapter 5 AERONAUTICS Above the deserts of Southern California, in 1947, the American rocket-powered X-1 experimental aircraft broke the sound barrier as a small team of NACA specialists monitored the flight below. A golden age of flight research had begun. The NACA Muroc Contingent in October 1947 in front of the Bell Aircraft Corporation X-1-2 and Boeing B-29 launch aircraft. NASA Scroll to Continue X Marks the SpotFrom the X-1 in 1947 to the upcoming flights of the X-59 and X-66, experimental aircraft — X-planes — have been a staple of flight test operations at what is now Armstrong Flight Research Center. Work done by the NACA through 1958 and NASA ever since, not only with X-planes but research aircraft of all sorts, has advanced our understanding of all things aeronautics, making air travel one of the safest modes of transportation. Watch this 2-minute video about the NACA’s flight testing that sent aircraft of all sorts ever higher and faster, right to the edge of space and back. armstrong flight research center, california Pushing the Limits Thirteen people from the NACA's Langley Laboratory arrived at Muroc Army Air Field in 1946 to support testing of a rocket plane that first flew faster than sound a year later. From that seed grew the flight research center NASA operates today. Explore Today's Armstrong Flight Research Center The historic X-1E rocket plane is seen on display in front of the original National Advisory Committee on Aeronautics operations facility at Edwards Air Force Base, Calif. In this 2010 image, this is the “front door” to NASA’s Dryden Flight Research Center, now known as NASA’s Armstrong Flight Research Center.NASA / Jim Banke End of an Era and a New Beginning From 1915 to 1958, the NACA led the world in aviation research. During this golden age of aeronautical innovation, air travel evolved from small wood and fabric airplanes flying a few hundred feet high to rocket-propelled aircraft built from exotic metals cruising to the edge of space. The commercial jet age was taking off and the promise of supersonic airliners was just beyond the horizon. When the Soviet Union shocked the world with Sputnik in 1957, the U.S. reacted by creating a new agency in 1958 to research and develop the technology required to win the “Space Race.” The nation looked to the experienced experts at the NACA to form the foundation of the new National Aeronautics and Space Administration. The NACA was no more, but its rich heritage of research excellence lives on today within NASA’s Aeronautics Research Mission Directorate. NASA Encyclopedia The National Advisory Committee for Aeronautics With its elite research engineers and world-class test facilities, NASA’s predecessor, the NACA, was the nation’s premier aeronautical research institution for over 40 years. Read this History Piece on the NACA In 1946 the Lewis Flight Propulsion Laboratory became the NACA’s official icing research center. Lewis pilots flew the B-24M and XB-25E into perilous weather conditions all across the country to study both deicing technologies and the physics of ice-producing clouds. These dangerous flights led to advances in weather sensing instruments and flight planning.NACA The NACA 65 Images Go To Gallery Go To Gallery About the AuthorJim BankeManaging Editor/Senior WriterJim Banke is a veteran aviation and aerospace communicator with more than 35 years of experience as a writer, producer, consultant, and project manager based at Cape Canaveral, Florida. He is part of NASA Aeronautics' Strategic Communications Team and is Managing Editor for the Aeronautics topic on the NASA website. Share Details Last Updated Mar 03, 2025 Related TermsNational Advisory Committee for Aeronautics (NACA)AeronauticsAeronautics Research Mission DirectorateAmes Research CenterArmstrong Flight Research CenterGlenn Research CenterLangley Research CenterNASA AircraftNASA History National Aeronautics and Space Administration NASA explores the unknown in air and space, innovates for the benefit of humanity, and inspires the world through discovery. About NASA's Mission Join Us Home News & Events Multimedia NASA+ Missions Humans in Space Earth & Climate The Solar System The Universe Science Aeronautics Technology Learning Resources About NASA NASA en Español Follow NASA More NASA Social Accounts NASA Newsletters Sitemap For Media Privacy Policy FOIA No FEAR Act Office of the IG Budget & Annual Reports Agency Financial Reports Contact NASA Accessibility Page Last Updated: Mar 03, 2025 Page Editor: Jim Banke Responsible NASA Official: Abigail Bowman .hds-feature-intro{overflow:hidden;position:relative}.hds-tag-label{align-items:center;display:flex;justify-content:center}.hds-feature-intro-wrapper{display:grid;grid-template-rows:1fr max-content}.hds-feature-intro-content{align-items:center;display:flex;position:relative}.hds-feature-intro-content-inner{max-width:40rem}.hds-chapter-tag-wrapper{display:flex;width:100%}.hds-feature-intro-label .hds-tag-label-wrapper{align-items:center;display:flex;justify-content:center;position:relative}.hds-tag-label .hds-tag-label-wrapper{height:1.25rem;margin-right:.75rem;width:1.25rem}.hds-feature-intro-label .hds-tag-label-wrapper>svg{position:relative;width:100%}.hds-feature-intro-label .hds-tag-label-wrapper:before{animation:pulse 1.5s infinite;border:1px dashed #ff5c52;border-radius:50%;content:"";display:block;height:2rem;opacity:1;position:absolute;width:2rem}@keyframes pulse{0%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.2)}to{opacity:1;transform:scale(1)}}@media