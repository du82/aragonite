full_description = "About NASAOrganizationLeadershipNASA OrganizationNASA’s ImpactBudgets and ReportsCenters & FacilitiesAll NASA Centers & FacilitiesNASA HeadquartersAmes Research CenterArmstrong Flight Research CenterGlenn Research CenterGoddard Space Flight CenterGoddard Institute for Space StudiesJet Propulsion LaboratoryJohnson Space CenterKatherine Johnson IV and V FacilityKennedy Space CenterLangley Research CenterMarshall Space Flight CenterMichoud Assembly FacilityNASA Engineering and Safety CenterNASA Safety CenterNASA Shared Services CenterNeil A. Armstrong Test FacilityStennis Space CenterWallops Flight FacilityWhite Sands Test FacilityDirectoratesAll NASA DirectoratesAeronautics Research Mission DirectorateExploration Systems Development Mission DirectorateScience Mission DirectorateSpace Operations Mission DirectorateSpace Technology Mission DirectorateMission Support DirectoratePeopleNASA CareersNASA History Get Involved with NASA Join us! We invite members of the public to contribute their time and expertise to advancing research, solving problems, and potentially winning prizes as a result of their work. We also invite you to find out all of the ways you can bring NASA into your life through participating in experiences, learning engagements, and activities that you can do on your own. Help NASA Solve Challenges Participate in NASA Research Explore Student Opportunities Bring NASA into Your Space Attend a Virtual Event Stay Connected Help NASA Solve Challenges NASA invites the public to develop solutions in support of the agency's missions. Below are current opportunities, including prize competitions, challenges, crowdsourcing, and solicitations that address the agency's needs. Sustainable Business Model Challenge Climate change presents one of the most urgent crises of our time, with increasing threats to life, infrastructure, economies, and… NASA TechLeap Prize Information Flight Opportunities is excited to announce that NASA has issued a new challenge for its TechLeap Prize: the Space Technology… 3D Printable Bioreactor for Deep Space Food Production NASA’s Synthetic Biology Project is turning to the 3D printing experts in the GrabCAD community for ideas and/or designs that… 1 2 3 … 6 Next NASA TechLeap Prize New TechLeap Prize Now Open With its Space Technology Payload Challenge, NASA intends to award up to nine prizes worth up to $500,000 each plus the opportunity for a flight test to develop payloads and advance solutions that address a wide variety of NASA’s technology shortfalls to meet future exploration, science, and other mission needs. Learn More Participate in NASA Research Citizen Science Volunteer for a NASA Study Open Science Curriculum Research on the Station Science Research Technology Research Aeronautics Research Citizen Science NASA citizen science projects are open to everyone around the world, not limited to U.S. citizens or residents. NASA’s citizen science projects are collaborations between scientists and interested members of the public. Through these collaborations, volunteers (known as citizen scientists) have helped make thousands of important scientific discoveries. More than 450 NASA citizen scientists have been named as co-authors on refereed scientific publications. Want to work on some real NASA science? Be a Citizen Scientist! Read More The Biopolymer Research for In-Situ Capabilities team assembles the control experiments that will be delivered to middle school classrooms for the students to run as part of the citizen science program. Image courtesy of Ben Gao. Volunteer for a NASA Study Many people write to NASA regarding opportunities available for citizens to participate in a NASA study, such as the Bed Rest Study. To find information on how to volunteer with NASA, please visit the Analog Studies page. Read More PHOTO DATE: 04-01-19 LOCATION:Bldg. 220 – HERA Habitat SUBJECT: Photographic Support for Flight Analogs HERA Campaign 5 Mission 1 Crew exiting the HERA Habitat – with Sara Edwards, Roderick Borgie, Ian Porter and Dustin Wallace PHOTOGRAPHER: BILL STAFFORD Open Science Curriculum NASA is making a long-term commitment to building an inclusive open science community over the next decade. NASA’s Transform to Open Science (TOPS) initiative is designed to transform agencies, organizations, and communities to an inclusive culture of open science. The open science curriculum will introduce those beginning their open science journey to important definitions, tools, and resources; and provide participants at all levels recommendations on best practices. Read More Get Your Research On The Station Reference information and resources to provide insight into sending your science experiment or technology demonstration to the space station. Read More Astronaut Raja Chari works on the Food Physiology experiment inside the portable glovebag. Research Opportunities in Space and Earth Science NASA leads the nation on a great journey of discovery, seeking new knowledge and understanding of our planet Earth, our Sun and solar system, and the universe out to its farthest reaches and back to its earliest moments of existence. Find research opportunities and resources related to NASA science. Read More A preflight interior view of the incubator cassette from the Bioculture System. The Bioculture System is a biological science incubator for use on the International Space Station (ISS) with the capability of transporting active and stored investigations to ISS. This incubator supports a wide diversity of tissue, cell, and microbiological cultures and experiment methods to meet any spaceflight research investigation goals and objectives. The facility enables variable duration and long-duration cellular and microbiological investigations on ISS to meet the scientific needs of academic and biotechnology interests. Credits: NASA photo by Dominic Hart Space Technology Opportunities Technology drives exploration and the space economy. Learn about NASA’s space technology opportunities developing, demonstrating, and transferring new space technologies that benefit NASA, commercial, and other government missions. Read More NASA astronaut Kate Rubins, a crew member of Expedition 49 aboard the International Space Station, works on an experiment inside the station’s Microgravity Science Glovebox. The glovebox is one of the major dedicated science facilities inside the Destiny laboratory and provides a sealed environment for conducting science and technology experiments. The glovebox is particularly suited for handling hazardous materials when the crew is present. Aeronautics Research Find opportunities to collaborate with NASA’s aeronautical innovators and/or contribute to their research to enable new and improved air transportation systems. Read More NASA’s Systems Research Aircraft (SRA), a highly modified F-18 jet fighter, on an early research flight over Rogers Dry Lake. The former Navy aircraft was flown by NASA’s Dryden Flight Research Center at Edwards Air Force Base, California, to evaluate a number of experimental aerospace technologies in a multi-year, joint NASA/DOD/industry program. Bring NASA into Your Space Enhance student STEM engagement by providing hands-on activities and real-world problem-solving tasks that foster critical thinking and collaboration. Access interactive tools like simulations, data sets, and game platforms, to help students build confidence and curiosity in STEM subjects. Make a connection to skilled technical careers, to inspire students to see the practical applications and possibilities of their learning. Explore Resources about Bring NASA into Your Space Explore Student Opportunities Multiple challenges and opportunities reaching a broad audience of middle and high schools, colleges, and universities across the nation. See All NASA TechRise Student ChallengeMiddle/high school student teams are invited to submit science and technology experiment ideas to fly on a suborbital flight platform.Learn MoreNASA Student Launch ChallengeStudent Launch is a research-based, competitive, experiential exploration activity. This project offers multiple challenges reaching a broad audience of middle and high schools, colleges, and universities across the nation.Learn MoreFirst Nations LaunchThe competition offers Tribal college-level students the opportunity to demonstrate engineering and design skills through direct application in high-powered rocketry.Learn More Attend a Virtual Event Launches & Landings Virtual Guest Program Heliophysics Webinars Flight Opportunities Webinars Small Spacecraft Webinars Launches & Landings Tune in to scheduled mission updates that you can watch live. Read More NASA’s PACE (Plankton, Aerosol, Cloud, ocean Ecosystem) spacecraft, atop a SpaceX Falcon 9 rocket, successfully lifts off from Space Launch Complex 40 at Cape Canaveral Space Force Station in Florida at 1:33 a.m. EST Thursday, Feb. 8. PACE is NASA’s newest earth-observing satellite that will help increase our understanding of Earth’s oceans, atmosphere, and climate by delivering hyperspectral observations of microscopic marine organisms called phytoplankton, as well new data on clouds and aerosols. Virtual Guest Program Since 2020, NASA has invited you, the public, to be virtual guests at launches and milestone events. As a virtual guest, you have access to curated resources, schedule changes, and mission specific information straight to your inbox. Following each activity, guests are sent a stamp for your virtual guest passport! All resources, participation, and registration are FREE. Receive your invitation. Select your opportunities. Join us! Read More Heliophysics Big Year Free Monthly Webinars The Heliophysics Big Year is a global celebration of the Sun’s influence on Earth and the entire solar system. It began with the Annular Solar Eclipse on Oct. 14, 2023, continued through the Total Solar Eclipse on Apr. 8, 2024, and will conclude with Parker Solar Probe’s closest approach to the Sun in December 2024. The monthly webinars are for formal and informal educators, science communicators, and other heliophysics enthusiasts to promote the understanding of heliophysics in alignment with monthly HBY themes. Learn More and Register After 20 years in space, ESA and NASA’s Solar and Heliospheric Observatory, or SOHO, is still going strong. Originally launched in 1995 to study the sun and its influence out to the very edges of the solar system, SOHO revolutionized this field of science, known as heliophysics, providing the basis for nearly 5,000 scientific papers. Flight Opportunities Community of Practice Webinars Attend these monthly webinars to learn best practices and important lessons learned from suborbital and orbital researchers, flight providers, and NASA personnel experienced in using flight tests to advance technologies. Read More Small Spacecraft Community of Practice Webinars The Small Spacecraft Systems Virtual Institute hosts a public webinar series to share information with the community on work NASA, partner agencies, and other members of the community in the area of small spacecraft. Read More Four-CubeSat swarm of PyCubed-based spacecraft in the Small Spacecraft Technology lab. The goal of PY4 is to demonstrate spacecraft-to-spacecraft ranging, in-orbit relative navigation, and coordinated simultaneous multi-point radiation measurements.Credits: NASA/Don Richey Stay connected on social media @NASAPrize Help NASA explore creative possibilities for addressing the agency’s needs through prizes, challenges, and crowdsourcing opportunities. @DoNASAScience These projects are collaborations between scientists and members of the public. @NASASTEM We’re launching learning to new heights with STEM resources. NASA Newsletters Subscribe to free NASA newsletters. No matter your interests, NASA has a newsletter for you. Keep Exploring Discover More Opportunities to Get Involved NASA Prizes, Challenges, and Crowdsourcing NASA Internship Programs Open Innovation Success Stories Learning Resources"
