full_description = "3 min readUniversity High Knows the Answers at NASA JPL Regional Science BowlJet Propulsion LaboratoryMar 03, 2025 Article A team from University High School of Irvine, California, won the 2025 regional Science Bowl at NASA’s Jet Propulsion Laboratory on March 1. From left, co-coach Nick Brighton, sophomores Shloke Kamat and Timothy Chen, juniors Feodor Yevtushenko and Angelina Yan, senior Sara Yu, and coach David Knight. NASA/JPL-Caltech In a fast-paced competition, students showcased their knowledge across a wide range of science and math topics. What is the molecular geometry of sulfur tetrafluoride? Which layer of the Sun is thickest? What is the average of the first 10 prime numbers? If you answered “see-saw,” “radiation zone,” and “12.9,” respectively, then you know a tiny fraction of what high school students must learn to compete successfully in the National Science Bowl. On Saturday, March 1, students from University High School in Irvine answered enough of these kind of challenging questions correctly to earn the points to defeat 19 other high school teams, winning a regional Science Bowl competition hosted by NASA’s Jet Propulsion Laboratory in Southern California. Troy High, from Fullerton, won second place, while Arcadia High placed third. Some 100 students gathered at JPL for the fast-paced event, which drew schools from across Los Angeles, Orange, and San Bernardino counties. Teams are composed of four students and one alternate, with a teacher serving as coach. Two teams at a time face off in a round robin tournament, followed by tie-breaker and double-elimination rounds, then final matches. Students, coaches, and volunteers gathered on March 1 for the annual regional Science Bowl competition held at JPL, which has hosted the event since 1993. NASA/JPL-Caltech The questions — in biology, chemistry, Earth and space science, energy, mathematics, and physics — are at a college first-year level. Students spend months preparing, studying, quizzing each other, and practicing with “Jeopardy!”-style buzzers. It was the third year in a row for a University victory at the JPL-hosted event, and the championship round with Troy was a nail-biter until the very last question. The University team only had one returning student from the previous year’s team, junior Feodor Yevtushenko. Both he and longtime team coach and science teacher David Knight said the key to success is specialization — with each student focusing on particular topic areas. “I wake up and grind math before school,” Feodor said. “Being a jack-of-all-trades means you’re a jack-of-no-trades. You need ruthless precision and ruthless speed.” University also won for four years in row from 2018 to 2021. The school’s victory this year enables its team to travel to Washington in late April and vie for ultimate dominance alongside other regional event winners in the national finals. More than 10,000 students compete in some 115 regional events held across the country. Managed by the U.S. Department of Energy, the National Science Bowl was created in 1991 to make math and science fun for students, and to encourage them to pursue careers in those fields. It’s one of the largest academic competitions in the United States. JPL’s Public Services Office coordinates the regional contest with the help of volunteers from laboratory staff and former Science Bowl participants in the local community. This year marked JPL’s 33rd hosting the event. News Media Contact Melissa PamerJet Propulsion Laboratory, Pasadena, Calif.626-314-4928melissa.pamer@jpl.nasa.gov 2025-030 Share Details Last Updated Mar 03, 2025 Related TermsJet Propulsion LaboratorySTEM Engagement at NASA Explore More 3 min read NASA Uses New Technology to Understand California Wildfires Article 5 days ago 6 min read NASA’s Europa Clipper Uses Mars to Go the Distance Article 1 week ago 6 min read How NASA’s Lunar Trailblazer Will Make a Looping Voyage to the Moon Article 3 weeks ago Keep Exploring Discover Related Topics Missions Humans in Space Climate Change Solar System"
