full_description = "Restarting the Master Hand Knitter Level 1 Application Oct 28, 2024 For more info about the Master Hand Knitter program, see the TKGA website. For those who can use Ravelry and have accounts, you can see my progress on my project page. I’ll work through the list below over the next couple of weeks. Maybe I can get it in the mail before I leave for Vermont :) A catalogue of the things I need to do before I can mail my MHK Lv1 binder out: Note updated instruction date on cover page Double-check that the swatches are packed correctly (email and ask) Check swatches for any damage (bugs) Check prior answers in the worksheets Finish the worksheets/comparison table Make the mitten! Block the mitten! Photograph the mitten & post on Ravelry Do the mitten worksheet Check that the website references aren’t broken Print cover letter Print instruction cover page (with date) Double-check Ravelry photo documentation Double-check checklist on page 3 of instructions Write the paragraph for the stitch gauge worksheet. (4 references - 2 on analyzing gauge, 2 on measuring gauge) Changes the swatch portfolio: Preliminary Swatch Redo the swatch and include the pre-blocked gauge sheet too. Use the larger needle range to include US9. Redo answers to the worksheet Swatch 1 Find reference for increasing evenly in ribbing Reprint swatch sheet Swatch 2 Redo it, to do the pre-blocking question. Swatch 6 Get 4 references instead - 2 each for right and left lifted. All increase and decrease swatches Reread the “guide for another knitter” and see if it makes sense. Swatch 11 Does it still need a reference for the yarnover? (Mail and ask) Swatch 13 Add references for yarnover types Swatch 16 Double check against template Swatch 18 Separate references for Figure 8 join (2) and mattress stitch (2)"
