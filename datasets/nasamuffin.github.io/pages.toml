["https://nasamuffin.github.io/leave/cooking/2024/11/02/fall-butternut-pasta.html"]
title = "Fall Butternut Squash Pasta | Nasamuffin’s Geocities Page"
description = "On my very scientific Mastodon poll, a handful of people said they’d like to see food updates. So here’s a food update!"
full_description = "Fall Butternut Squash Pasta Nov 2, 2024 On my very scientific Mastodon poll, a handful of people said they’d like to see food updates. So here’s a food update! This morning we went to the farmer’s market in search of inspiring vegetables. And the market delivered! The veggie stalls have started to get their gourds in, which means I couldn’t resist the hilariously-oversized butternut squash. I even made my partner run back to the ATM to get cash for it, since neither of us came prepared. Knowing I wanted to make a creamy squash pasta, we went on the hunt - and found some lovely curly kale and a brick of cow’s feta, too. (Also, coffee!) I’ve got plans at 6, so I wanted to have a slightly early dinner. So I tore myself away from Tavern Talk around 2 and broke down the squash for roasting. Squash huge. Squash tough. But it turned to rust on my blade, as it were, and soon it was in the oven roasting to get some nice brown flavor on top, along with some garlic and red pepper. I had meant to roast the onions too, but there literally was not room on the pan, so I sliced up the onions to saute at the same time as the ground lamb, instead. After some musing about kale as the mathematician’s vegetable, I remembered that I also had some fresh thyme from last week’s winter root pasta, so I stripped a ton of that too. Weirdly, it’s a lot easier to cook ground meat without it turning into big chunks if you thaw it all the way first. Who knew? Also, at this time I remembered the half jar of sundried tomatoes, so those went in too. Yum. The squash came out and went into the blender, then into the meat, and I had a bit of time for a simmer while the pasta water heated up. Et voila! I stirred in the feta and a bit more pasta water at the same time as the thyme and the cooked pasta, and the whole thing came out a little sweet, very hearty and savory. We had it with some old vine zinfandel that my partner went out for, and they paired very nicely. Yum :)"
