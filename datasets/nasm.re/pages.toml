title = "[SECCON CTF 2022 Quals] babyfile | repr"
description = "Introductionbabyfile is a file stream exploitation I did during the SECCON CTF 2022 Quals event. I didn’t succeed to flag it within the 24 hours :(. But anyway I hope this write up will be interesting"
full_description = '''[SECCON CTF 2022 Quals] babyfile 2022-08-19 pwn 4k words SECCONctffile streamlinuxnasmpwn Introductionbabyfile is a file stream exploitation I did during the SECCON CTF 2022 Quals event. I didn’t succeed to flag it within the 24 hours :(. But anyway I hope this write up will be interesting to read given I show another way to gain code execution – I have not seen before – based on _IO_obstack_jumps! The related files can be found here. If you’re not familiar with file stream internals, I advice you to read my previous writeups about file stream exploitation, especially this one and this other one. TL;DR Populate base buffer with heap addresses with the help of _IO_file_doallocate. Make both input and output buffer equal to the base buffer with the help of _IO_file_underflow. Partial overwrite on right pointers to get a libc leak by simply flushing the file stream. Leak a heap address by printing a pointer stored within the main_arena. _IO_obstack_overflow ends up calling a function pointer stored within the file stream we have control over which leads to a call primitive (plus control over the first argument). Then I just called system("/bin/sh\x00"). What we haveThe challenge is basically opening /dev/null, asking for an offset and a value to write at fp + offset. And we can freely flush fp. The source code is prodided: Source code: 123456789101112131415161718192021222324252627282930313233343536373839404142434445464748495051525354555657585960616263646566676869707172737475767778#include <stdio.h>#include <stdlib.h>#include <unistd.h>static int menu(void);static int getnline(char *buf, int size);static int getint(void);#define write_str(s) write(STDOUT_FILENO, s, sizeof(s)-1)int main(void){ FILE *fp; alarm(30); write_str("Play with FILE structure\n"); if(!(fp = fopen("/dev/null", "r"))){ write_str("Open error"); return -1; } fp->_wide_data = NULL; for(;;){ switch(menu()){ case 0: goto END; case 1: fflush(fp); break; case 2: { unsigned char ofs; write_str("offset: "); if((ofs = getint()) & 0x80) ofs |= 0x40; write_str("value: "); ((char*)fp)[ofs] = getint(); } break; } write_str("Done.\n"); }END: write_str("Bye!"); _exit(0);}static int menu(void){ write_str("\nMENU\n" "1. Flush\n" "2. Trick\n" "0. Exit\n" "> "); return getint();}static int getnline(char *buf, int size){ int len; if(size <= 0 || (len = read(STDIN_FILENO, buf, size-1)) <= 0) return -1; if(buf[len-1]=='\n') len--; buf[len] = '\0'; return len;}static int getint(void){ char buf[0x10] = {}; getnline(buf, sizeof(buf)); return atoi(buf);} Exploitation ideasI tried (in this order) to: Get a libc leak by calling _IO_file_underflow to make input and output buffers equal to the base buffer that contains with the help of _IO_file_doallocate a heap address. And then flushing the file stream to leak the libc. Get a heap leak by leaking a heap pointer stored within the main_arena. Get an arbitrary write with a tcache dup technique, I got __free_hook as the last pointer available in the target tcache bin but I didn’t succeeded to get a shell >.<. Call primitive with control over the first argument by calling _IO_obstack_overflow (part of the _IO_obstack_jumps vtable). Then it allows us to call system("/bin/sh\x00"). Libc leakTo get a libc leak we have to write on stdout a certain amount of bytes that leak a libc address. To do so we’re looking for a way to make interesting pointers appear as the base buffer to then initialize both input and output buffer to the base buffer and then do a partial overwrite on these fields to point to an area that contains libc pointers. To get heap addresses within the base buffer we can misalign the vtable in such a way that fp->vtable->sync() calls _IO_default_doallocate. Then _IO_default_doallocate is called and does some operations: The initial state of the file stream looks like this: 1234567891011121314150x559c0955e2a0: 0x00000000fbad2488 0x00000000000000000x559c0955e2b0: 0x0000000000000000 0x00000000000000000x559c0955e2c0: 0x0000000000000000 0x00000000000000000x559c0955e2d0: 0x0000000000000000 0x00000000000000000x559c0955e2e0: 0x0000000000000000 0x00000000000000000x559c0955e2f0: 0x0000000000000000 0x00000000000000000x559c0955e300: 0x0000000000000000 0x00007f99db7c05c00x559c0955e310: 0x0000000000000003 0x00000000000000000x559c0955e320: 0x0000000000000000 0x0000559c0955e3800x559c0955e330: 0xffffffffffffffff 0x00000000000000000x559c0955e340: 0x0000000000000000 0x00000000000000000x559c0955e350: 0x0000000000000000 0x00000000000000000x559c0955e360: 0x0000000000000000 0x00000000000000000x559c0955e370: 0x0000000000000000 0x00007f99db7bc4a80x559c0955e380: 0x0000000100000001 0x00007f99db7c6580 It initializes the base buffer to a fresh BUFSIZE allocated buffer. 123456789101112int_IO_default_doallocate (FILE *fp){ char *buf; buf = malloc(BUFSIZ); if (__glibc_unlikely (buf == NULL)) return EOF; _IO_setb (fp, buf, buf+BUFSIZ, 1); return 1;} fp state after the _IO_default_doallocate: 1234567891011121314150x559c0955e2a0: 0x00000000fbad2488 0x00000000000000000x559c0955e2b0: 0x0000000000000000 0x00000000000000000x559c0955e2c0: 0x0000000000000000 0x00000000000000000x559c0955e2d0: 0x0000000000000000 0x0000559c0955e4800x559c0955e2e0: 0x0000559c09560480 0x00000000000000000x559c0955e2f0: 0x0000000000000000 0x00000000000000000x559c0955e300: 0x0000000000000000 0x00007f99db7c05c00x559c0955e310: 0x0000000000000003 0x00000000000000000x559c0955e320: 0x0000000000000000 0x0000559c0955e3800x559c0955e330: 0xffffffffffffffff 0x00000000000000000x559c0955e340: 0x0000000000000000 0x00000000000000000x559c0955e350: 0x0000000000000000 0x00000000000000000x559c0955e360: 0x0000000000000000 0x00000000000000000x559c0955e370: 0x0000000000000000 0x00007f99db7bc4a80x559c0955e380: 0x0000000100000001 0x00007f99db7c6580 Once we have a valid pointer into the base buffer, we try to get into both the input and output buffer the base pointer.Given the input / output buffer are NULL and that fp->flags is 0xfbad1800 | 0x8000 (plus 0x8000 => _IO_USER_LOCK to not stuck into fflush), we do not have issues with the checks. The issue with the _IO_SYSREAD call is described in the code below. _IO_new_file_underflow: 123456789101112131415161718192021222324252627282930313233343536373839404142434445464748495051525354555657585960616263646566676869707172737475767778798081828384int_IO_new_file_underflow (FILE *fp){ ssize_t count; /* C99 requires EOF to be "sticky". */ if (fp->_flags & _IO_EOF_SEEN) return EOF; if (fp->_flags & _IO_NO_READS) { fp->_flags |= _IO_ERR_SEEN; __set_errno (EBADF); return EOF; } if (fp->_IO_read_ptr < fp->_IO_read_end) return *(unsigned char *) fp->_IO_read_ptr; if (fp->_IO_buf_base == NULL) { /* Maybe we already have a push back pointer. */ if (fp->_IO_save_base != NULL) { free (fp->_IO_save_base); fp->_flags &= ~_IO_IN_BACKUP; } _IO_doallocbuf (fp); } /* FIXME This can/should be moved to genops ?? */ if (fp->_flags & (_IO_LINE_BUF|_IO_UNBUFFERED)) { /* We used to flush all line-buffered stream. This really isn't required by any standard. My recollection is that traditional Unix systems did this for stdout. stderr better not be line buffered. So we do just that here explicitly. --drepper */ _IO_acquire_lock (stdout); if ((stdout->_flags & (_IO_LINKED | _IO_NO_WRITES | _IO_LINE_BUF)) == (_IO_LINKED | _IO_LINE_BUF)) _IO_OVERFLOW (stdout, EOF); _IO_release_lock (stdout); } _IO_switch_to_get_mode (fp); /* This is very tricky. We have to adjust those pointers before we call _IO_SYSREAD () since we may longjump () out while waiting for input. Those pointers may be screwed up. H.J. */ fp->_IO_read_base = fp->_IO_read_ptr = fp->_IO_buf_base; fp->_IO_read_end = fp->_IO_buf_base; fp->_IO_write_base = fp->_IO_write_ptr = fp->_IO_write_end = fp->_IO_buf_base; /* Given the vtable is misaligned, _IO_SYSREAD will call _IO_default_pbackfail, the code is given after _IO_new_file_underflow */ count = _IO_SYSREAD (fp, fp->_IO_buf_base, fp->_IO_buf_end - fp->_IO_buf_base); if (count <= 0) { if (count ==