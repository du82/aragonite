title = "Linux file stream internals for fun and profit | repr"
description = "IntroductionFile streams are now a very common attack surface, here is a high level introduction that should make you understand the design of known attacks beyond the code reading for a particular fu"
full_description = '''Linux file stream internals for fun and profit 2022-08-19 pwn 3.7k words ctffile streamlinuxnasmpwn IntroductionFile streams are now a very common attack surface, here is a high level introduction that should make you understand the design of known attacks beyond the code reading for a particular function. I already talked about FSOP here. This article reviews glibc 2.36. Most of this article comes from this awesome series of articles about the _IO_FILE strcuture. Global designAs said in my previous writeup: Basically on linux “everything is a file” from the character device the any stream (error, input, output, opened file) we can interact with a resource by just by opening it and getting a file descriptor on it, right ? This way each file descripor has an associated structure called FILE you may have used if you have already done some stuff with files on linux. The struct _IO_FILE is defined as follows: 123456789101112131415161718192021222324252627282930313233343536373839404142434445464748495051525354/* The tag name of this struct is _IO_FILE to preserve historic C++ mangled names for functions taking FILE* arguments. That name should not be used in new code. */struct _IO_FILE{ int _flags; /* High-order word is _IO_MAGIC; rest is flags. */ /* The following pointers correspond to the C++ streambuf protocol. */ char *_IO_read_ptr; /* Current read pointer */ char *_IO_read_end; /* End of get area. */ char *_IO_read_base; /* Start of putback+get area. */ char *_IO_write_base; /* Start of put area. */ char *_IO_write_ptr; /* Current put pointer. */ char *_IO_write_end; /* End of put area. */ char *_IO_buf_base; /* Start of reserve area. */ char *_IO_buf_end; /* End of reserve area. */ /* The following fields are used to support backing up and undo. */ char *_IO_save_base; /* Pointer to start of non-current get area. */ char *_IO_backup_base; /* Pointer to first valid character of backup area */ char *_IO_save_end; /* Pointer to end of non-current get area. */ struct _IO_marker *_markers; struct _IO_FILE *_chain; int _fileno; int _flags2; __off_t _old_offset; /* This used to be _offset but it's too small. */ /* 1+column number of pbase(); 0 is unknown. */ unsigned short _cur_column; signed char _vtable_offset; char _shortbuf[1]; _IO_lock_t *_lock;#ifdef _IO_USE_OLD_IO_FILE};struct _IO_FILE_complete{ struct _IO_FILE _file;#endif __off64_t _offset; /* Wide character stream stuff. */ struct _IO_codecvt *_codecvt; struct _IO_wide_data *_wide_data; struct _IO_FILE *_freeres_list; void *_freeres_buf; size_t __pad5; int _mode; /* Make sure we don't get into trouble again. */ char _unused2[15 * sizeof (int) - 4 * sizeof (void *) - sizeof (size_t)];}; Before starting to describe each field of the structure, you have to understand that according to behaviour of the function that uses a file stream, only a small part of the _IO_FILE structure is used. For example if the file stream is byte oriented, _IO_wide_data related operations are not used. Let’s review the fields of the structure: _flags: High-order word is _IO_MAGIC, rest is flags. _IO_read_ptr address of input within the input buffer that has been already used. _IO_read_end end address of the input buffer. _IO_read_base base address of the input buffer. _IO_write_base base address of the ouput buffer. _IO_write_ptr points to the character that hasn’t been printed yet. _IO_write_end end address of the output buffer. _IO_buf_base base address for both input and output buffer. _IO_buf_end end address for both input and output buffer. _chain stands for the single linked list that links of all file streams. _fileno stands for the file descriptor associated to the file. _vtable_offset stands for the offset of the vtable we have to use. _offset stands for the current offset within the file. Common functions _IO_setb (FILE *f, char *base, char *end, int do_user_buf): Initializes the base buffer. Here is its implementation:123456789101112131415// https://elixir.bootlin.com/glibc/glibc-2.36/source/libio/genops.c#L328void_IO_setb (FILE *f, char *b, char *eb, int a){ if (f->_IO_buf_base && !(f->_flags & _IO_USER_BUF)) free (f->_IO_buf_base); f->_IO_buf_base = b; f->_IO_buf_end = eb; if (a) f->_flags &= ~_IO_USER_BUF; else f->_flags |= _IO_USER_BUF;}libc_hidden_def (_IO_setb) _IO_USER_BUF: Don’t deallocate buffer on close. _IO_setg(fp, base, current, end): Initializes read pointers. Here is its code:1234// https://elixir.bootlin.com/glibc/glibc-2.36/source/libio/libioP.h#L520#define _IO_setg(fp, eb, g, eg) ((fp)->_IO_read_base = (eb),\ (fp)->_IO_read_ptr = (g), (fp)->_IO_read_end = (eg)) fopenLet’s review the opening process of a file and how the _IO_FILE structure is intitialized. fopen is implemented in libio/iofopen.c: 123456789101112131415// https://elixir.bootlin.com/glibc/glibc-2.36/source/libio/iofopen.c#L83FILE *_IO_new_fopen (const char *filename, const char *mode){ return __fopen_internal (filename, mode, 1);}strong_alias (_IO_new_fopen, __new_fopen)versioned_symbol (libc, _IO_new_fopen, _IO_fopen, GLIBC_2_1);versioned_symbol (libc, __new_fopen, fopen, GLIBC_2_1);# if !defined O_LARGEFILE || O_LARGEFILE == 0weak_alias (_IO_new_fopen, _IO_fopen64)weak_alias (_IO_new_fopen, fopen64)# endif Then it calls __fopen_internal: 12345678910111213141516171819202122232425262728// https://elixir.bootlin.com/glibc/glibc-2.36/source/libio/iofopen.c#L56FILE *__fopen_internal (const char *filename, const char *mode, int is32){ struct locked_FILE { struct _IO_FILE_plus fp;#ifdef _IO_MTSAFE_IO _IO_lock_t lock;#endif struct _IO_wide_data wd; } *new_f = (struct locked_FILE *) malloc (sizeof (struct locked_FILE)); if (new_f == NULL) return NULL;#ifdef _IO_MTSAFE_IO new_f->fp.file._lock = &new_f->lock;#endif _IO_no_init (&new_f->fp.file, 0, 0, &new_f->wd, &_IO_wfile_jumps); _IO_JUMPS (&new_f->fp) = &_IO_file_jumps; _IO_new_file_init_internal (&new_f->fp); if (_IO_file_fopen ((FILE *) new_f, filename, mode, is32) != NULL) return __fopen_maybe_mmap (&new_f->fp.file); _IO_un_link (&new_f->fp); free (new_f); return NULL;} First, a struct locked_FILE is allocated on the heap. _IO_no_init – and _IO_old_init within it – null out the structure: 123456789101112131415161718192021222324252627282930313233343536373839404142434445464748495051525354555657585960616263// https://elixir.bootlin.com/glibc/glibc-2.36/source/libio/genops.c#L561void_IO_no_init (FILE *fp, int flags, int orientation, struct _IO_wide_data *wd, const struct _IO_jump_t *jmp){ _IO_old_init (fp, flags); fp->_mode = orientation; if (orientation >= 0) { fp->_wide_data = wd; fp->_wide_data->_IO_buf_base = NULL; fp->_wide_data->_IO_buf_end = NULL; fp->_wide_data->_IO_read_base = NULL; fp->_wide_data->_IO_read_ptr = NULL; fp->_wide_data->_IO_read_end = NULL; fp->_wide_data->_IO_write_base = NULL; fp->_wide_data->_IO_write_ptr = NULL; fp->_wide_data->_IO_write_end = NULL; fp->_wide_data->_IO_save_base = NULL; fp->_wide_data->_IO_backup_base = NULL; fp->_wide_data->_IO_save_end = NULL; fp->_wide_data->_wide_vtable = jmp; } else /* Cause predictable crash when a wide function is called on a byte stream. */ fp->_wide_data = (struct _IO_wide_data *) -1L; fp->_freeres_list = NULL;}// https://elixir.bootlin.com/glibc/glibc-2.36/source/libio/genops.c#L530void_IO_old_init (FILE *fp, int flags){ fp->_flags = _IO_MAGIC|flags; fp->_flags2 = 0; if (stdio_needs_locking) fp->_flags2 |= _IO_FLAGS2_NEED_LOCK; fp->_IO_buf_base = NULL; fp->_IO_buf_end = NULL; fp->_IO_read_base = NULL; fp->_IO_read_ptr = NULL; fp->_IO_read_end = NULL; fp->_IO_write_base = NULL; fp->_IO_write_ptr = NULL; fp->_IO_write_end = NULL; fp->_chain = NULL; /* Not necessary. */ fp->_IO_save_base = NULL; fp->_IO_backup_base = NULL; fp->_IO_save_end = NULL; fp->_markers = NULL; fp->_cur_column = 0;#if _IO_JUMPS_OFFSET fp->_vtable_offset = 0;#endif#ifdef _IO_MTSAFE_IO if (fp->_lock != NULL) _IO_lock_init (*fp->_lock);#endif} Then it initializes the vtable field field to &_IO_file_jumps initialized in /source/libio/fileops.c#L1432: 123456789101112131415161718192021222324252627// /source/libio/fileops.c#L1432const struct _IO_jump_t _IO_file_jumps libio_vtable ={ JUMP_INIT_DUMMY, JUMP_INIT(finish, _IO_file_finish), JUMP_INIT(overflow, _IO_file_overflow), JUMP_INIT(underflow, _IO_file_underflow), JUMP_INIT(uflow, _IO_default_uflow), JUMP_INIT(pbackfail, _IO_default_pbackfail), JUMP_INIT(xsputn, _IO_file_xsputn), JUMP_INIT(xsgetn, _IO_file_xsgetn), JUMP_INIT(seekoff, _IO_new_file_seekoff), JUMP_INIT(seekpos, _IO_default_seekpos), JUMP_INIT(setbuf, _IO_new_file_setbuf), JUMP_INIT(sync, _IO_new_file_sync), JUMP_INIT(doallocate, _IO_file_doallocate), JUMP_INIT(read, _IO_file_read), JUMP_INIT(write, _IO_new_file_write), JUMP_INIT(seek, _IO_file_seek), JUMP_INIT(close, _IO_file_close), JUMP_INIT(stat, _IO_file_stat), JUMP_INIT(showmanyc, _IO_default_showmanyc), JUMP_INIT(imbue, _IO_default_imbue)};libc_hidden_data_def (_IO_file_jumps) Most of the intialization stuff stands in the _IO_new_file_init_internal function: 1234567891011121314// https://elixir.bootlin.com/glibc/glibc-2.36/source/libio/fileops.c#L105void_IO_new_file_init_internal (struct _IO_FILE_plus *fp){ /* POSIX.1 allows another file handle to be used to change the position of our file descriptor. Hence we actually don't know the actual position before we do the first fseek (and until a following fflush). */ fp->file._offset = _IO_pos_BAD; fp->file._flags |= CLOSED_FILEBUF_FLAGS; _IO_link_in (fp); fp->file._fileno = -1;} fp->file._flags is initialized to CLOSED_FILEBUF_FLAGS which means according to its definition: 1234567// https://elixir.bootlin.com/glibc/glibc-2.36/source/libio/fileops.c#L100#define CLOSED_FILEBUF_FLAGS \ (_IO_IS_FILEBUF+_IO_NO_READS+_IO_NO_WRITES+_IO_TIED_PUT_GET)// https://elixir.bootlin.com/glibc/glibc-2.36/source/libio/libio.h#L78#define _IO_TIED_PUT_GET 0x0400 /* Put and get pointer move in unison. */ Then the fp (the file pointer) is linked into the single linked list that keeps track of every file stream, for which the HEAD is _IO_list_all._IO_link_in is defined like this: 12345678910111213141516171819202122232425// https://elixir.bootlin.com/glibc/glibc-2.36/source/libio/genops.c#L86void_IO_link_in (struct _IO_FILE_plus *fp){ if ((fp->file._flags & _IO_LINKED) == 0) { fp->file._flags |= _IO_LINKED;#ifdef _IO_MTSAFE_IO _IO_cleanup_region_start_noarg (flush_cleanup); _IO_lock_lock (list_all_lock); run_fp = (FILE *) fp; _IO_flockfile ((FILE *) fp);#endif fp->file._chain = (FILE *) _IO_list_all; _IO_list_all = fp;#ifdef _IO_MTSAFE_IO _IO_funlockfile ((FILE *) fp); run_fp = NULL; _IO_lock_unlock (list_all_lock); _IO_cleanup_region_end (0);#endif }}libc_hidden_def (_IO_link_in) Once it has been initialized, _IO_file_fopen is called to open the file with the right file and mode. Here is its definition:  https://elixir.bootlin.com/glibc/glibc-2.36/source/libio/fileops.c#L211FILE *_IO_new_file_fopen (FILE *fp, const char *filename, const char *mode, int is32not64){ int oflags = 0, omode; int read_write; int oprot = 0666; int i; FILE *result; const char *cs; const char *last_recognized; if (_IO_file_is_open (fp)) return 0; switch (*mode) { case 'r': omode = O_RDONLY; read_write = _IO_NO_WRITES; break; case 'w': omode = O_WRONLY; oflags = O_CREAT|O_TRUNC; read_write = _IO_NO_READS; break; case 'a': omode = O_WRONLY; oflags = O_CREAT|O_APPEND; read_write = _IO_NO_READS|_IO_IS_APPENDING; break; default: __set_errno (EINVAL); return NULL; } last_recognized = mode; for (i = 1; i < 7; ++i) { switch (*++mode) { case '\0': break; case '+': omode = O_RDWR; read_write &= _IO_IS_APPENDING; last_recognized = mode; continue; case 'x': oflags |= O_EXCL; last_recognized = mode; continue; case 'b': last_recognized = mode; continue; case 'm': fp->_flags2 |= _IO_FLAGS2_MMAP; continue; case 'c': fp->_flags2 |= _IO_FLAGS2_NOTCANCEL; continue; case 'e': oflags |= O_CLOEXEC; fp->_flags2 |= _IO_FLAGS2_CLOEXEC; continue; default: /* Ignore. */ continue; } break; } result = _IO_file_open (fp, filename, omode|oflags, oprot, read_write, is32not64); if (result != NULL) { /* Test whether the mode string specifies the conversion. */ cs = strstr (last_recognized + 1, ",ccs="); if (cs != NULL) { /* Yep. Load the appropriate conversions and set the orientation to wide. */ struct gconv_fcts fcts; struct _IO_codecvt *cc; char *endp = __strchrnul (cs + 5, ','); char *ccs = malloc (endp - (cs + 5) + 3); if (ccs == NULL) { int malloc_err = errno; /* Whatever malloc failed with. */ (void) _IO_file_close_it (fp); __set_errno (malloc_err); return NULL; } *((char *) __mempcpy (ccs, cs + 5, endp - (cs + 5))) = '\0'; strip (ccs, ccs); if (__wcsmbs_named_conv (&fcts, ccs[2] == '\0' ? upstr (ccs, cs + 5) : ccs) != 0) { /* Something went wrong, we cannot load the conversion modules. This means we cannot proceed since the user explicitly asked for these. */ (void) _IO_file_close_it (fp); free (ccs); __set_errno (EINVAL); return NULL; } free (ccs); assert (fcts.towc_nsteps == 1); assert (fcts.tomb_nsteps == 1); fp->_wide_data->_IO_read_ptr = fp->_wide_data->_IO_read_end; fp->_wide_data->_IO_write_ptr = fp->_wide_data->_IO_write_base; /* Clear the state. We start all over again. */ memset (&fp->_wide_data->_IO_state, '\0', sizeof (__mbstate_t)); memset (&fp->_wide_data->_IO_last_state, '\0', sizeof (__mbstate_t)); cc = fp->_codecvt = &fp->_wide_data->_codecvt; cc->__cd_in.step = fcts.towc; cc->__cd_in.step_data.__invocation_counter = 0; cc->__cd_in.step_data.__internal_use = 1; cc->__cd_in.step_data.__flags = __GCONV_IS_LAST; cc->__cd_in.step_data.__statep = &result->_wide_data->_IO_state; cc->__cd_out.step = fcts.tomb; cc->__cd_out.step_data.__invocation_counter = 0; cc->__cd_out.step_data.__internal_use = 1; cc->__cd_out.step_data.__flags = __GCONV_IS_LAST | __GCONV_TRANSLIT; cc->__cd_out.step_data.__statep = &result->_wide_data->_IO_state; /* From now on use the wide character callback functions. */ _IO_JUMPS_FILE_plus (fp) = fp->_wide_data->_wide_vtable; /* Set the mode now. */ result->_mode = 1; } } return result;}libc_hidden_ver (_IO_new_file_fopen, _IO_file_fopen) That’s a pretty huge function but most of it is just parsing and handling of a specific encoding for the file. First it checks if the file is already open then it parses the mode and once it’s done it calls _IO_file_open with the right flags. Then is the file requires a specific encoding it intitializes _wide_data and so on to properly handle it. Let’s take a look at the _IO_file_open function: 1234567891011121314151617181920212223242526272829303132// https://elixir.bootlin.com/glibc/glibc-2.36/source/libio/fileops.c#L180FILE *_IO_file_open (FILE *fp, const char *file'''
