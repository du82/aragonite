_read_base); _IO_setg (fp, new_buf, new_buf + (new_size - old_size), new_buf + new_size); fp->_IO_backup_base = fp->_IO_read_ptr; } *--fp->_IO_read_ptr = c; } return (unsigned char) c;}libc_hidden_def (_IO_default_pbackfail) fp state after the _IO_new_file_underflow: 1234567891011121314150x559c0955e2a0: 0x00000000fbad2588 0x0000559c0956050f0x559c0955e2b0: 0x0000559c09560590 0x0000559c095604900x559c0955e2c0: 0x0000559c0955e480 0x0000559c0955e4800x559c0955e2d0: 0x0000559c0955e480 0x0000559c0955e4800x559c0955e2e0: 0x0000559c09560480 0x0000559c0955e4800x559c0955e2f0: 0x0000559c09560510 0x0000559c0955e4800x559c0955e300: 0x0000000000000000 0x00007f99db7c05c00x559c0955e310: 0x0000000000000003 0x00000000000000000x559c0955e320: 0x0000000000000000 0x0000559c0955e3800x559c0955e330: 0xffffffffffffffff 0x00000000000000000x559c0955e340: 0x0000000000000000 0x00000000000000000x559c0955e350: 0x0000000000000000 0x00000000000000000x559c0955e360: 0x0000000000000000 0x00000000000000000x559c0955e370: 0x0000000000000000 0x00007f99db7bc4600x559c0955e380: 0x0000000100000001 0x00007f99db7c6580 Once we have the pointers at the right place, we can simply do some partial overwrites to the portion of the heap that contains a libc pointer. Indeed by taking a look at the memory at fp->_IO_base_buffer & ~0xff (to avoid 4 bits bruteforce) we can that we can directly reach a libc pointer: 123456789100x5649e8077400: 0x0000000000000000 0x00000000000000000x5649e8077410: 0x0000000000000000 0x00000000000000000x5649e8077420: 0x0000000000000000 0x00000000000000000x5649e8077430: 0x0000000000000000 0x00000000000000000x5649e8077440: 0x0000000000000000 0x00000000000000000x5649e8077450: 0x0000000000000000 0x00000000000000000x5649e8077460: 0x0000000000000000 0x00000000000000000x5649e8077470: 0x00007f4092dc3f60 0x00000000000020110x5649e8077480: 0x0000000000000000 0x00000000000000000x5649e8077490: 0x0000000000000000 0x0000000000000000 Then we have to actually doing the partial overwrite by corrupting certain pointers to leak this address with the help of _IO_fflush: 12345678910111213141516int_IO_fflush (FILE *fp){ if (fp == NULL) return _IO_flush_all (); else { int result; CHECK_FILE (fp, EOF); _IO_acquire_lock (fp); result = _IO_SYNC (fp) ? EOF : 0; _IO_release_lock (fp); return result; }}libc_hidden_def (_IO_fflush) It ends up calling _IO_new_file_sync(fp): 123456789101112131415161718192021222324252627int_IO_new_file_sync (FILE *fp){ ssize_t delta; int retval = 0; /* char* ptr = cur_ptr(); */ if (fp->_IO_write_ptr > fp->_IO_write_base) if (_IO_do_flush(fp)) return EOF; delta = fp->_IO_read_ptr - fp->_IO_read_end; if (delta != 0) { off64_t new_pos = _IO_SYSSEEK (fp, delta, 1); if (new_pos != (off64_t) EOF) fp->_IO_read_end = fp->_IO_read_ptr; else if (errno == ESPIPE) ; /* Ignore error from unseekable devices. */ else retval = EOF; } if (retval != EOF) fp->_offset = _IO_pos_BAD; /* FIXME: Cleanup - can this be shared? */ /* setg(base(), ptr, ptr); */ return retval;}libc_hidden_ver (_IO_new_file_sync, _IO_file_sync) I already talked about the way we can gain arbitrary read with FSOP attack on stdout in this article. The way we will get a leak is almost the same, first we need to trigger the first condition in _IO_new_file_sync in such a way that fp->_IO_write_ptr > fp->_IO_write_base will trigger _IO_do_flush(fp). Then _IO_do_flush triggers the classic code path I dump right below. I will not comment all of it, the only thing you have to remind is that given most of the buffers are already initialized to a valid heap address beyond the target we do not have to rewrite them, this way we will significantly reduce the amount of partial overwrite. 1234567#define _IO_do_flush(_f) \ ((_f)->_mode <= 0 \ ? _IO_do_write(_f, (_f)->_IO_write_base, \ (_f)->_IO_write_ptr-(_f)->_IO_write_base) \ : _IO_wdo_write(_f, (_f)->_wide_data->_IO_write_base, \ ((_f)->_wide_data->_IO_write_ptr \ - (_f)->_wide_data->_IO_write_base))) Condition:(_f)->_IO_write_ptr-(_f)->_IO_write_base) >= sizeof(uint8_t* ), (_f)->_IO_write_base == target. 1234567int_IO_new_do_write (FILE *fp, const char *data, size_t to_do){ return (to_do == 0 || (size_t) new_do_write (fp, data, to_do) == to_do) ? 0 : EOF;}libc_hidden_ver (_IO_new_do_write, _IO_do_write) 1234567891011121314151617181920212223242526272829static size_tnew_do_write (FILE *fp, const char *data, size_t to_do){ size_t count; if (fp->_flags & _IO_IS_APPENDING) /* On a system without a proper O_APPEND implementation, you would need to sys_seek(0, SEEK_END) here, but is not needed nor desirable for Unix- or Posix-like systems. Instead, just indicate that offset (before and after) is unpredictable. */ fp->_offset = _IO_pos_BAD; else if (fp->_IO_read_end != fp->_IO_write_base) { off64_t new_pos = _IO_SYSSEEK (fp, fp->_IO_write_base - fp->_IO_read_end, 1); if (new_pos == _IO_pos_BAD) return 0; fp->_offset = new_pos; } count = _IO_SYSWRITE (fp, data, to_do); if (fp->_cur_column && count) fp->_cur_column = _IO_adjust_column (fp->_cur_column - 1, data, count) + 1; _IO_s'''
