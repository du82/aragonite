title = "[FCSC 2021 - pwn] Itsy Mipsy router | repr"
description = "Itsy Mipsy Router (200 pts)Itsy Mipsy Router is a pwn challenge I did during the FCSC event.It’s not a very hard challenge but I found it very interesting because it was my first mips pwn challenge !"
full_description = '''[FCSC 2021 - pwn] Itsy Mipsy router 2021-05-03 pwn 3.8k words 2021FCSCctfmipsmipsyn4smnasmpwnret2school Itsy Mipsy Router (200 pts)Itsy Mipsy Router is a pwn challenge I did during the FCSC event.It’s not a very hard challenge but I found it very interesting because it was my first mips pwn challenge ! SetupSo basically we got this: On vous demander d’auditer un routeur à l’interface entre Internet et un réseau interne d’une entreprise. Le client vous demande si il est possible de lire les fichiers stockés sur la machine filer qui sert de serveur de fichiers HTTP.nc challenges2.france-cybersecurity-challenge.fr 4005 And for debugging purposes administrators provided a Docker file: 12345678910111213FROM debian:buster-slimRUN apt updateRUN apt install -yq socat qemu-user libc6-mips64-crossRUN apt cleanRUN rm -rf /var/lib/apt/lists/WORKDIR /appCOPY ./mipsy ./RUN rm /etc/ld.so.cacheEXPOSE 4000EXPOSE 1234CMD socat tcp-listen:4000,reuseaddr,fork exec:"qemu-mips64 -L /usr/mips64-linux-gnuabi64 ./mipsy" So because it’s not very convenient to debug it from the docker I tried to run it directly on my host with a gdb stub on port 5445. I setup my host by installing the right packages, deleting /etc/ld.so.cache and by the socat command on port 4000: 123456789101112$ uname -aLinux off 5.8.0-50-generic #56~20.04.1-Ubuntu SMP Mon Apr 12 21:46:35 UTC 2021 x86_64 x86_64 x86_64 GNU/Linux$ sudo apt install socat qemu-user libc6-mips64-crossLecture des listes de paquets... FaitConstruction de l'arbre des dépendances Lecture des informations d'état... Faitsocat est déjà la version la plus récente (1.7.3.3-2).libc6-mips64-cross est déjà la version la plus récente (2.30-0ubuntu2cross2).qemu-user est déjà la version la plus récente (1:4.2-3ubuntu6.15).0 mis à jour, 0 nouvellement installés, 0 à enlever et 17 non mis à jour.$ sudo rm -f /etc/ld.so.cache$ socat tcp-listen:4000,reuseaddr,fork exec:"qemu-mips64 -L /usr/mips64-linux-gnuabi64 -g 5445 ./mipsy" We can debug the running process with gdb-multiarch (with the path of my pwndbg’s gdbinit to get an cleaner output). 1234567$ gdb-multiarch -ex 'source /media/nasm/7044d811-e1cd-4997-97d5-c08072ce9497/Downloads/pwndbg/gdbinit.py' -q ./mipsyReading symbols from ./mipsy...(No debugging symbols found in ./mipsy)pwndbg: loaded 196 commands. Type pwndbg [filter] for a list.pwndbg: created $rebase, $ida gdb functions (can be used with print/break)pwndbg> target remote localhost:5445 To send the payload I used pwntools. 12345678from pwn import *def start(): # return remote("challenges2.france-cybersecurity-challenge.fr", 4005) return remote("localhost", 4000)io = start()print(io.recvuntil("] ").decode('utf-8')) Now we launch the python script to trigger the socat: 12$ python3 wu.py [+] Opening connection to localhost on port 4000: Done It does not return anything because it breaks in the shared libraries I guess, so now we can continue the execution in gdb: 12345678910111213141516171819202122232425262728Remote debugging using localhost:5445warning: Unable to find dynamic linker breakpoint function.GDB will be unable to debug shared library initializersand track explicitly loaded dynamic code.0x00000040008038d0 in ?? ()Could not check ASLR: Couldn't get personalityDownloading '/media/nasm/7044d811-e1cd-4997-97d5-c08072ce9497/ctf/fcsc/pwn/mipsy/mipsy' from the remote server: OKadd-symbol-file /tmp/tmpsjb8mqsa/mipsy 0x120000000 -s .MIPS.abiflags 0x2400002e0 -s .MIPS.options 0x2400002f8 -s .note.gnu.build-id 0x240000870 -s .dynamic 0x240000898 -s .hash 0x240000aa8 -s .dynsym 0x240001190 -s .dynstr 0x240002858 -s .gnu.version 0x240003b12 -s .gnu.version_r 0x240003cf8 -s .rel.dyn 0x240003d38 -s .init 0x240003d58 -s .text 0x240003de0 -s .MIPS.stubs 0x2400257a0 -s .fini 0x2400259c0 -s .rodata 0x240025a10 -s .interp 0x24002d280 -s .eh_frame_hdr 0x24002d290 -s .eh_frame 0x24002d2a8 -s .note.ABI-tag 0x24002d2e0 -s .ctors 0x24003df58 -s .dtors 0x24003df68 -s .data.rel.ro 0x24003df78 -s .data 0x240040000 -s .rld_map 0x240040020 -s .got 0x240040030 -s .sdata 0x240040840 -s .bss 0x240040850'context': Print out the current register, instruction, and stack context.Exception occurred: context: unsupported operand type(s) for +: 'NoneType' and 'int' (<class 'TypeError'>)For more info invoke `set exception-verbose on` and rerun the commandor debug it by yourself with `set exception-debugger on`pwndbg> vmmapLEGEND: STACK | HEAP | CODE | DATA | RWX | RODATA 0x120000000 0x12002e000 r-xp 2e000 0 /media/nasm/7044d811-e1cd-4997-97d5-c08072ce9497/ctf/fcsc/pwn/mipsy/mipsy 0x12002e000 0x12003d000 ---p f000 2d000 /media/nasm/7044d811-e1cd-4997-97d5-c08072ce9497/ctf/fcsc/pwn/mipsy/mipsy 0x12003d000 0x120040000 r--p 3000 2d000 /media/nasm/7044d811-e1cd-4997-97d5-c08072ce9497/ctf/fcsc/pwn/mipsy/mipsy 0x120040000 0x120043000 rw-p 3000 30000 /media/nasm/7044d811-e1cd-4997-97d5-c08072ce9497/ctf/fcsc/pwn/mipsy/mipsy 0x4000403000 0x4000828000 r--p 425000 0 <explored> 0x40007fe000 0x4000801000 rw-p 3000 0 [stack][QEMU target detected - vmmap result might not be accurate; see `help vmmap`]pwndbg> continueContinuing.warning: Could not load shared library symbols for 2 libraries, e.g. /lib/libc.so.6.Use the "info sharedlibrary" command to see the complete listing.Do you need "set solib-search-path" or "set sysroot"?[Inferior 1 (process 1) exited normally] The process exited because we didn’t inserted any breakpoints and so our python script outs this: 12345678910111213+---------------------------------+|/ \|| ITSY MIPSY ROUTER ||\ /|+---------------------------------+Menu: 0. Quit. 1. Show network interfaces 2. Ping internal HTTP file server 3. Log in as admin[guest@mipsy] We’re able to debug properly our process ! Reverse EngineeringWe can take a look at the binary by running the file command: 12$ file mipsy mipsy: ELF 64-bit MSB executable, MIPS, MIPS64 rel2 version 1 (SYSV), dynamically linked, interpreter /lib64/ld.so.1, BuildID[sha1]=e20cf7872e96482095ce68e6d4d03806d5928de4, for GNU/Linux 3.2.0, not stripped So it’s a mips64 big endian binary dynamically linked. As we see above, the program is asking for an input among 4 options: Quit, Show network interfaces, Ping internal HTTP file server and Login as admin. We can test these options remotely: 12345678910111213141516171819202122232425262728293031323334353637383940414243444546+---------------------------------+|/ \|| ITSY MIPSY ROUTER ||\ /|+---------------------------------+Menu: 0. Quit. 1. Show network interfaces 2. Ping internal HTTP file server 3. Log in as admin[guest@mipsy] $ 1The router has the following network interfaces:* lo* eth0* eth2* eth1Menu: 0. Quit. 1. Show network interfaces 2. Ping internal HTTP file server 3. Log in as admin[guest@mipsy] $ 2Success: HTTP file server is up!Menu: 0. Quit. 1. Show network interfaces 2. Ping internal HTTP file server 3. Log in as admin[guest@mipsy] $ 3Input your password:>>> l3eT_p4sSError: wrong password.Menu: 0. Quit. 1. Show network interfaces 2. Ping internal HTTP file server 3. Log in as admin[guest@mipsy] $ 0 It doesn’t give any interesting informations so instead of fuzzing manually the binary to find the vulnerability, I reversed the main functions in IDA. And particulary the code of the the function corresponding to the “Login as admin” feature. The assembly code of this function looks like such: 1234567891011121314151617181920212223242526272829303132333435363738394041424344454647484950515253545556575859606162636465666768697071.globl authenticateauthenticate:var_40= -0x40var_18= -0x18var_10= -0x10ret_addr= -8daddiu $sp, -0x90 ; Doubleword Add Immediate Unsignedsd $ra, 0x90+ret_addr($sp) ; Store Doublewordsd $fp, 0x90+var_10($sp) ; Store Doublewordsd $gp, 0x90+var_18($sp) ; Store Doublewordmove $fp, $splui $gp, 4 ; Load Upper Immediatedaddu $gp, $t9 ; Doubleword Add Unsigneddaddiu $gp, 0x3AA4 ; Doubleword Add Immediate Unsigneddli $v0, 0x120020000 ; Doubleword Load Immediatedaddiu $a0, $v0, (aInputYourPassw - 0x120020000) ; "Input your password:"dla $v0, puts ; Load 64-bit addressmove $t9, $v0jalr $t9 ; puts ; Jump And Link Registernopdli $v0, 0x120020000 ; Doubleword Load Immediatedaddiu $a0, $v0, (asc_120025B00 - 0x120020000) ; ">>> "dla $v0, printf ; Load 64-bit addressmove $t9, $v0jalr $t9 ; printf ; Jump And Link Registernopdla $v0, stdout ; Load 64-bit addressld $v0, (stdout - 0x120042BC8)($v0) ; Load Doublewordmove $a0, $v0 ; streamdla $v0, fflush ; Load 64-bit addressmove $t9, $v0jalr $t9 ; fflush ; Jump And Link Registernopmove $a0, $fpdla $v0, gets ; Load 64-bit addressmove $t9, $v0jalr $t9 ; gets ; Jump And Link Registernopdaddiu $v0, $fp, 0x50 ; Doubleword Add Immediate Unsignedli $a2, 0x20 ; ' ' ; nmove $a1, $zero ; cmove $a0, $v0 ; sdla $v0, memset ; Load 64-bit addressmove $t9, $v0jalr $t9 ; memset ; Jump And Link Registernopmove $a0, $fp ; sdla $v0, strlen ; Load 64-bit addressmove $t9, $v0jalr $t9 ; strlen ; Jump And Link Registernopdaddiu $v1, $fp, 0x50 ; Doubleword Add Immediate Unsignedmove $a2, $v1move $a1, $v0move $a0, $fpdla $v0, kdf ; Load 64-bit addressmove $t9, $v0bal kdf ; Branch Always and Linknopdaddiu $v1, $fp, 0x50 ; Doubleword Add Immediate Unsignedli $a2, 0x20 ; ' ' ; ndli $v0, 0x120020000 ; Doubleword Load Immediatedaddiu $a1, $v0, (unk_120025B08 - 0x120020000) ; s2move $a0, $v1 ; s1dla $v0, memcmp ; Load 64-bit addressmove $t9, $v0jalr $t9 ; memcmp ; Jump And Link Registernopbnez $v0, loc_120004688 ; Branch on Not Zero When I began this challenge I didn’t know anything about mips64 assembly but thanks to auto comments in IDA and to this and this, I understood very quickly the main components of the architecture. And that’s why I noticed a call to the gets function which as it’s known read an arbitrary number of bytes from stdin to the buffer indicated in argument, and so in our case in $fp, which is initialized to $sp-0x90. Next the call to gets, printf and fflush, it calls memset to set every bytes of another buffer allocated next to our input to zero. Then it computes the length of our input and calls the kdf function with the following arguments: kdf(char *input_password, int input_length, unsigned char *out). The kdf function is basically doing some encryption operations according to our input and its length and stores the result in the third argument.And the result of this encryption routine is compared to a constant value with memcmp. So we discovered the stack based buffer overflow which allows us to overwrite the saved instruction pointer saved at the functions’s prologue. ExploitationSince we understood the vulnerable function, we can represent the stackframe like that: 123456789101112131415161718192021222324$saved_fp-0x90+----------------------+ | | | | | buffer_password | | | | |$saved_fp-0x40+----------------------+ | | | | | out | | |$saved_fp-0x16+----------------------+ | saved_gp |$saved_fp-0x10+----------------------+ | saved_fp | $saved_fp-8+----------------------+ | saved_ra | $saved_fp+----------------------+ | | | calling function's | | stackframe | | | | | +----------------------+ And so, according to this schema, we overwrite the saved $ra from a padding of 0x90-0x8=0x88 bytes.But since we’re able to jmp everywhere, we have to figure out what kind of technique we want to use. One gadget ?For an obsure reason, I thought the gets function had for badchar the NULL byte, so I was looking for a one gadget in the binary.I discovered during the reverse engineering part an interesting snippet of code: 12345678910111213141516171819202122232425262728293031323334353637383940414243444546474849505152535455565758596061626364656667686970717273747576777879808182838485868788.text:0000000120003FC0 .globl ip.text:0000000120003FC0 ip: ; CODE XREF: main+260↓p.text:0000000120003FC0 ; DATA XREF: LOAD:0000000120002438↑o ....text:0000000120003FC0.text:0000000120003FC0 ret = -0x1050.text:0000000120003FC0 n_read = -0x104C .text:0000000120003FC0 fd = -0x1048.text:0000000120003FC0 var_1044 = -0x1044.text:0000000120003FC0 buf = -0x1040.text:0000000120003FC0 ptr_binsh = -0x40.text:0000000120003FC0 dash_c = -0x38.text:0000000120003FC0 var_30 = -0x30.text:0000000120003FC0 null = -0x28.text:0000000120003FC0 var_18 = -0x18.text:0000000120003FC0 var_10 = -0x10.text:0000000120003FC0 var_8 = -8.text:0000000120003FC0.text:0000000120003FC0 daddiu $sp, -0x1050 ; Doubleword Add Immediate Unsigned.text:0000000120003FC4 sd $ra, 0x1050+var_8($sp) ; Store Doubleword.text:0000000120003FC8 sd $fp, 0x1050+var_10($sp) ; Store Doubleword.text:0000000120003FCC sd $gp, 0x1050+var_18($sp) ; Store Doubleword.text:0000000120003FD0 move $fp, $sp ; prologue.text:0000000120003FD4 lui $gp, 4 ; Load Upper Immediate.text:0000000120003FD8 daddu $gp, $t9 ; Doubleword Add Unsigned.text:0000000120003FDC daddiu $gp, 0x4060 ; Doubleword Add Immediate Unsigned.text:0000000120003FE0 dli $v0, 0x120020000 ; Doubleword Load Immediate.text:0000000120003FE4 daddiu $v0, (aBinSh - 0x120020000) ; "/bin/sh".text:0000000120003FE8 sd $v0, 0x1010($fp) ; Store Doubleword.text:0000000120003FEC dli $v0, 0x120020000 ; Doubleword Load Immediate.text:0000000120003FF0 daddiu $v0, (aC - 0x120020000) ; "-c".text:0000000120003FF4 sd $v0, 0x1018($fp) ; Store Doubleword.text:0000000120003FF8 dli $v0, 0x120020000 ; Doubleword Load Immediate.text:0000000120003FFC daddiu $v0, (aListInterfaces - 0x120020000) ; "./list_interfaces.sh".text:0000000120004000 sd $v0, 0x1020($fp) ; Store Doubleword.text:0000000120004004 sd $zero, 0x1028($fp) ; Store Doubleword.text:0000000120004008 daddiu $v0, $fp, 8 ; Doubleword Add Immediate Unsigned.text:000000012000400C move $a0, $v0 ; pipedes.text:0000000120004010 dla $v0, pipe ; Load 64-bit address.text:0000000120004014 move $t9, $v0 ; pipe.text:0000000120004018 jalr $t9 ; pipe ; Jump And Link Register.text:000000012000401C nop ; nop.text:0000000120004020 move $v1, $v0 ; return value.text:0000000120004024 dli $v0, 0xFFFFFFFFFFFFFFFF ; Doubleword Load Immediate.text:0000000120004028 bne $v1, $v0, loc_120004070 ; Branch on Not Equal; skip.text:0000000120004070 loc_120004070: ; CODE XREF: ip+68↑j.text:0000000120004070 dla $v0, fork ; Load 64-bit address.text:0000000120004074 move $t9, $v0 ; fork.text:0000000120004078 jalr $t9 ; fork ; Jump And Link Register.text:000000012000407C nop ; nop.text:0000000120004080 sw $v0, 0($fp) ; Store Word.text:0000000120004084 lw $v1, 0($fp) ; Load Word.text:0000000120004088 dli $v0, -1 ; Doubleword Load Immediate.text:000000012000408C bne $v1, $v0, loc_1200040D4 ; Branch on Not Equal; skip.text:00000001200040D4 loc_1200040D4: ; CODE XREF: ip+CC↑j.text:00000001200040D4 lw $v0, 0($fp) ; Load Word.text:00000001200040D8 bnez $v0, loc_120004158 ; Branch on Not Zero.text:00000001200040DC nop ; nop.text:00000001200040E0 lw $v0, 0xC($fp) ; Load Word.text:00000001200040E4 li $a1, 1 ; fd2.text:00000001200040E8 move $a0, $v0 ; fd.text:00000001200040EC dla $v0, dup2 ; Load 64-bit address.text:00000001200040F0 move $t9, $v0 ; dup2.text:00000001200040F4 jalr $t9 ; dup2 ; Jump And Link Register.text:0000000120'''
