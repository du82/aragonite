["https://nasm.us/index.php"]
title = "NASM"
description = "The Netwide Assembler (NASM) is an assembler and disassembler for the Intel x86 architecture, used by developers worldwide"
full_description = "This is the project webpage for the Netwide Assembler (NASM), an assembler for the x86 CPU architecture portable to nearly every modern platform, and with code generation for many platforms old and new. As of version 2.07, NASM is now under the Simplified (2-clause) BSD license. The details of the license are available in the documentation. For users of RPM-based Linux distributions (e.g. Fedora, Red Hat, SUSE, ...), you can download the official NASM builds using dnf or yum by installing nasm.repo in your /etc/yum/yum.repos.d directory. NASM was originally developed by Simon Tatham and Julian Hall, and is now maintained by a team led by H. Peter Anvin. We're looking for your comments, suggestions and, of course, bug-reports. Report any suspicious behavior you encounter to help us improve the NASM for everyone! Don't worry if your report is not immediately addressed, even within the first few days, as this is usual for us. Your report will, however, be recorded and dealt with, of course, as time permits."
author = "Netwide Assembler (NASM) Team"
year_published = 2025
clearnet = "https://nasm.us/index.php"
