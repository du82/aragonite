["https://nasm.us/doc/nasmdocc.html"]
title = "NASM - The Netwide Assembler"
full_description = "Make the documentation stronger that -O0 or -O1 are probably not what the user wants. See section 2.1.24. Fix a number of issues when building from source, mostly involving configure or dependency generation. In particular, more aggressively avoid cross-compilation problems on Unix/Linux systems automatically invoking WINE. We could end up invoking WINE even when we didn't want to, making configure think it was running native when in fact cross-compiling. Windows host: add embedded manifest file. Without a manifest, Windows applications force a fixed PATH_MAX limit to any pathname; this is unnecessary. Add support for Flexible Return and Exception Delivery (FRED): the LKGS, ERETS and ERETU instructions. Preprocessor: allow the user to specify the desired radix for an evaluated parameter. It doesn't make any direct difference, but can be nice for debugging or turning into strings. See the = modifier in section 4.2.1. Documentation: correct a minor problem in the expression grammar for Dx statements, see section 3.2.1. Preprocessor: add a %hex() function, equivalent to %eval() except that it producess hexadecimal values that are nevertheless valid NASM numeric constants, see section 4.4.5. Preprocessor: fix the parameter number in error messages (should be 1-based, like %num references to multi-line macro arguments.) Documentation: be more clear than the bin format is simply a linker built into NASM. See section 8.1. LOCK XCHG reg,mem would issue a warning for being unlockable, which is incorrect. In this case the reg,mem encoding is simply an alias for the mem,reg encoding. However, XCHG is always locked, so create a new warning (-w+prefix-lock-xchg) to explicitly flag a user-specified LOCK XCHG; default off. Future versions of NASM may remove the LOCK prefix when optimization is enabled. Some target environments may have specific restrictions on what kinds of relocations are possible or allowed. The --reproducible option now leaves the filename field in the COFF object format blank. This was always rather useless since it is only 18 characters long; as such debug formats have to carry their own filename information anyway."
year_published = 2025
clearnet = "https://nasm.us/doc/nasmdocc.html"
