["https://www.nasuwt.org.uk/about-nasuwt/why-join.html"]
title = "NASUWT |  Why Join NASUWT?"
description = "Reasons to join NASUWT: as the UK union representing only teachers, our philosophy of putting teachers first means we are at the forefront of the campaign to ensure you are recognised and rewarded as a highly skilled professional."
full_description = "At any stage of your career [1], in any sector, you dedicate yourself to your students: and we’re here when you need support with over 100 years’ experience. Membership of NASUWT give you the best guaranteed support and representation available to teaching professionals in the UK at any stage of your career in any educational setting. This includes FREE training and events: The NASUWT Recruit a Friend Scheme [2] rewards you if you’re already a member if you recruit your friends and colleagues to join you. The rewards come in the form of Love2Shop vouchers, rising incrementally in value for every member you recruit. You receive vouchers to the value of £10, £15 or £20, depending on the number of members you recruit between 1 January 2024 and 31 December 2024. For example, if you recruit three members, you would receive £40 worth of vouchers made up of £10 for the first member and two x £15 for the second and third recruit. Invite your friends and colleagues to join and if they become members between 1 January 2024 and 31 December 2024, you will receive Love2Shop rewards to spend at over 20,000 stores, restaurants and attractions throughout the UK. Footnotes [1] NASUWT has separate free membership offers that students and newly qualified teachers can benefit from. [2] Recruit a Friend Scheme terms and conditions (login required) If you need legal assistance, NASUWT can offer you first-class support via a network of trained caseworkers and solicitors NASUWT membership gives you a number of discounts and deals on day trips, restaurants, airport parking and much more. As an NASUWT member, you get FREE exclusive access to a range of consultation conferences and seminars to keep you up to date on key issues NASUWT members enjoy exclusive FREE access to our training and development programme, which includes accredited training courses and CPD opportunities In addition to free membership, the NASUWT offers students invaluable support on their way to becoming a qualified teacher."
