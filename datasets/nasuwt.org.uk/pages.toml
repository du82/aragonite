["https://www.nasuwt.org.uk/article-listing/government-plans-for-education-accountability.html"]
title = "NASUWT |  NASUWT comments on Government plans for education accountability"
description = '"Only by delivering an effective balance of support and challenge can we have an accountability system that works for pupils,  parents and for schools," says Dr Patrick Roach.'
full_description = '''Commenting on the speech given by Education Secretary Bridget Phillipson on plans for accountability reform, Dr Patrick Roach, General Secretary of NASUWT – The Teachers’ Union, said: “NASUWT applauds the government’s ambition to drive better support for schools in raising educational standards for all pupils. “Only by delivering an effective balance of support and challenge can we have an accountability system that works for pupils, parents and for schools. "There should be no compromise on the importance of securing high standards but it should also be recognised that this can only be achieved where there is a shift from punishing to supporting our teachers and headteachers. “The punitive approach to holding teachers and leaders to account hasn’t worked and has been deeply damaging to morale and parental confidence. “The development of RISE teams will be key to providing struggling schools with the additional support they need. We welcome the government's initial additional investment in support for these schools. However, this must only be the start of delivering a more ambitious programme of investment to secure an effective support and improvement infrastructure available for every school. “Too many schools, pupils and staff have been denied access to the external services they need and starved of support as a consequence of the failed policies of the previous government. Today's announcement must now result in the change that schools, teachers and parents have been asking for. “Whilst we will be reviewing in detail the government's plans, we also look forward to working with the Government on its ambitions for improving opportunity and outcomes for all children." NASUWT members in England can get support, advice and information on employment-related issues using our Contact Member Advice (England) form. If you are an NASUWT School Representative, please contact your Local Association Secretary or National Executive Member. NASUWT members in Northern Ireland can get support, advice and information on employment-related issues using our Contact Member Advice (Northern Ireland) form. Members requiring professional support out of hours should contact their Local Association Secretary or National Executive Member. (You will need to log in to see your personalised information.)'''
