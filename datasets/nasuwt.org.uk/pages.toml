["https://www.nasuwt.org.uk/be-involved/advice-on-use-of-e-membership.html"]
title = "NASUWT |  Advice on Use of e-Membership"
description = "NASUWT guide for members and activists using the e-Membership portal."
full_description = "If you are already logged into the website, you can access e-Membership directly from this page. If you are not logged in, you will be directed to a login page from where you will be redirected to e-Membership. If you’ve never logged into the website, please see our guide to logging in. To view the different sections of your membership record, click on the My Pages dropdown menu and select the details you wish to view/edit. Via this menu, you can see and edit the details we hold on your membership record, such as: You can also view details of subscription status. You will need to contact us if you want to amend those. If you are a Union activist with rights to view records of members in your location and have signed a non-disclosure agreement, you will have an additional My Organisation dropdown menu through which you can search for members and schools as well as generate reports, labels and template letters. To improve the search facilities for Union activists, the search fields are now grouped into categories accessible by clicking on the appropriate tab. In order to improve the search functionality, at the end of fields there is a dropdown menu to further restrict the search results produced, date fields now have a calendar from which you can select the date, and fields with an associated list (you will see the word Select in these fields) produce a menu of possible search criteria. There are also fields containing the instruction Start Typing.... When you type into these fields, possible search options will appear. One example of this is the Schools field, which will generate a list of schools in your area which contain the text you are typing. To improve performance, it is not possible to do a blank search with no fields populated. If you wish to search for all members in your Local Association, select the Employment Details tab in the members search area and select an option in the LA field. We periodically make necessary changes to our e-Membership portal that enable us to work in compliance with GDPR and develop the system our activists require. We continue to ensure changes are compliant with new legislation. The initial phase has improved security and this required a new platform. The look and feel of the system changed, but the functionality remained the same. This enabled the system to be more easily used on a wider range of devices with, including mobile devices and tablets. The menu structure moved from the left-hand side of the page to a dropdown menu at the top of the page."
