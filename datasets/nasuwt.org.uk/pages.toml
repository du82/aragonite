["https://www.nasuwt.org.uk/advice/academies.html"]
title = "NASUWT |  Academies"
description = "The NASUWT is committed to supporting members in academies, offering a range of advice and campaigning on behalf of members in such schools."
full_description = "NASUWT is committed to supporting members in academies, offering a full range of advice and campaigning on behalf of members NASUWT gives full support to all members regardless of the type of school in which they teach. All state-funded schools, including academies, play a critical role in our public education service. To deliver educational entitlements to children and young people, teachers in all state-funded schools need to work within a national framework of pay and conditions of service that supports them in delivering high-quality education. It is important that senior leaders and governing bodies in all school types understand the inextricable links between the pay and conditions of teachers within a school, what enables pupils to fulfil their potential and how the school can achieve the best outcomes for their pupils. Consequently, NASUWT continues to campaign for national pay and conditions frameworks to apply in academy schools and for all children and young people to be taught by qualified teachers who are recognised and rewarded as highly skilled professionals and have working conditions that enable them to focus on teaching and learning. NASUWT supports members in academies, individually and collectively, in maintaining adherence to policies that protect the pay and conditions of service of teachers and headteachers. On the right/below, you can find briefings and model recognition and facility time agreements, as well as answers to some of your frequently asked questions about academies. Academies Enterprise Trust Academy Transformation Trust Aldridge Education Anthem Schools Trust (formerly CfBT) Ark Schools Aspirations Academy Trust Astrea Academies Trust Bellevue Place Academy Trust Brooke Weston Trust Burnt Mill Academy Trust Cambridge Meridian Academies Trust Catch22 Multi-Academies Trust Consilium Academies Trust Co-operative Academies Trust Creative Education Trust David Ross Education Trust The de Ferrers Trust Delta Academi