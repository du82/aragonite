["https://www.nasuwt.org.uk/about-us/nasuwt-equalities-policies-and-action-plans/nasuwt-code-of-conduct.html"]
title = "NASUWT |  NASUWT Code of Conduct"
description = "​NASUWT Code of Conduct underpins our commitment to ensuring that all members, representatives, staff, visitors, contractors and other third parties behave in a courteous manner at all times when engaged in work for, and on behalf of, the Union."
full_description = "This code of conduct applies to all meetings and events, both in person or online, and includes all forms of communication, including postings on social media NASUWT is committed to ensuring that all members, representatives, staff, visitors, contractors and other third parties behave in a courteous manner at all times when engaged in work for, and on behalf of, the Union. Aggressive, offensive, intimidatory or unacceptable behaviour will not be tolerated. NASUWT has zero tolerance for any type of harassment. This supports the commitment set out in the NASUWT’s rules to promote equality and inclusion for all and to eliminate all forms of harassment, including sexual harassment, prejudice and unfair discrimination. It is crucial that everyone can participate in NASUWT activities in an inclusive, respectful and safe environment. interact with colleagues and visitors in a respectful, considerate and inclusive manner. This includes refraining from behaviour that could be considered intimidation, harassment, abuse, discrimination or inappropriate conduct; let an official or NASUWT member of staff know, straight away, if you notice a potentially dangerous, or concerning, situation or someone in distress; use inclusive language that avoids offensive reference to someone’s race, ethnicity, age, religion, gender, sexual orientation, disability or marital status; and Sexism, ableism, homophobia or transphobia, racism (including antisemitism or islamophobia) or behaviour that discriminates against any protected group as defined in equalities legislation will not be tolerated. NASUWT takes all breaches of the Code of Conduct seriously. Breaches may be dealt with using the Union’s disciplinary procedures. Participants engaging in discriminatory or offensive behaviour may be subject to immediate removal from the meeting, course or event, refusal to attend future courses/events and disciplinary action under the NASUWT Code of Conduct. NASUWT members in England can get support, advice and information on employment-related issues using our Contact Member Advice (England) form. If you are an NASUWT School Representative, please contact your Local Association Secretary or National Executive Member."
author = "E&T"
year_published = 2025
