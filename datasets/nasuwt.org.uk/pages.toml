description = "Find and apply for NASUWT jobs and vacancies in offices across the UK."
full_description = "The NASUWT, The Teachers' Union, operates across the whole of the UK, representing teachers in England, Northern Ireland, Scotland and Wales. In addition, the Union represents teachers in the Channel Islands, the Isle of Man (IOM) and Gibraltar. The NASUWT represents teachers in all roles, including headteachers/principals, and organises in all sectors from early years to further education. The Union is affiliated to the TUC and ICTU. Our philosophy of putting teachers first enables the Union to campaign on behalf of teachers to ensure they are able to focus on their core roles of teaching and leading teaching and learning. We have nine Regional Centres across England, three National Centres in Northern Ireland, Scotland and Wales, and our Headquarters based in Rednal, Birmingham. Our National/Regional Centres are the frontline service providing support to teachers experiencing difficulties in the workplace that can include matters such as discrimination, the application of capability, disciplinary and grievance procedures, and collective disputes over management practices and policies. There is a range of opportunities available, including caseworkers, organisers and administrative support. The Rednal Head Office supports the activities of the Regional/National Centres, lay activists and members through the work of our Legal and Casework Team, Policy Development, Campaigning, Recruitment and Member Support Teams in addition to the HR, Finance, IT and Maintenance departments. Also based at Rednal is the Hillscourt Hotel and Conference Centre with a conference hall, meeting rooms, restaurant, bar and hotel rooms with opportunities for kitchen and restaurant, bar, reception and housekeeping staff. All our employees enjoy outstanding terms and conditions of employment, which include: If you are interested in joining us, please take a look at our current vacancies listed on the right/below. NASUWT members in England can get support, advice and information on employment-related issues using our Contact Member Advice (England) form. If you are an NASUWT School Representative, please contact your Local Association Secretary or National Executive Member."
