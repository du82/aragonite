["https://www.nasuwt.org.uk/be-involved/big-question-survey.html"]
title = "NASUWT |  Big Question Survey"
description = "The NASUWT Big Question Survey, carried out in February and March each year, is the only annual national survey of teachers and headteachers tracking trends in teachers’ and school leaders’ opinions."
full_description = "The survey was completed by 10,568 teachers from across England, Northern Ireland, Scotland, Wales and the Crown Dependencies. Section 1: Pay/pensions Section 2: Pupil health and wellbeing Section 3: Working practice and pupil behaviour Section 4: Bureaucracy and workload Section 5: Teaching quality Section 6: Your health and wellbeing Section 7: Job satisfaction In 2023, after NASUWT action that sent clear messages to all the UK governments and administrations that teachers had had enough of attacks on their pay and conditions, teachers did get pay increases in line with the review body recommendations or as a result of NASUWT negotiations. This may explain the small decline in the number of members who think teaching is not competitive with other professions compared to previous years, but teachers continue to be incredibly concerned about pay overall. In a positive trend, the number of teachers who tell us they are worried about their financial situation is down 7% and fewer teachers say they are cutting back on spending on essentials such as heating, food and clothing. However, in absolute numbers, it is clear that pay is still a concern with the teaching profession. More than eight in ten teachers are still worried about their financial situation, more than half have had to cut spending on food in the last 12 months and more than one in ten teachers still tell us that they have had to take a second job. The responses to questions about pupils’ health and wellbeing, as well as safeguarding, remain generally consistent with last year’s survey. Almost all teachers tell us they teach pupils with mental health challenges and that the rates of adverse emotional, personal or social issues have increased over the past 12 months. Shockingly, as with last year’s survey, eight in ten teachers feel that appropriate support is not available to address pupils’ mental health issues. In addition, more than half of teachers say that safeguarding referrals have increased over the last year and eight in ten teachers do feel supported to make safeguarding referrals within their school."
author = "CC"
