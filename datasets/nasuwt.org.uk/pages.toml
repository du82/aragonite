description = "NASUWT protecting teachers’ pay and conditions in Defence Children Services."
full_description = "The NASUWT membership has increased within Defence Children Services (DCS) and the Union’s influence has continued to grow across schools in Cyprus and other Ministry of Defence (MOD) establishments around the world. The NASUWT now represents the vast majority of the teaching staff in this sector. The NASUWT continues to have a direct relationship with the MOD through its contractual relationship with the MOD-recognised trade union Prospect. The NASUWT is the only teachers’ trade union representing teachers effectively in DCS schools. The NASUWT has a Local Association for teachers who work for DCS. Casework services are delivered to members via a network of lay officials, supported by the national centre. Members working in DCS schools requiring advice or casework representation arising out of their teaching employment should contact the DCS Local Association Secretary in the first instance. Contact details can be obtained by emailing the Membership Team. Members working at the Scottish MOD School, Queen Victoria in Dunblane, should email the Scotland National Centre. NASUWT members in England can get support, advice and information on employment-related issues using our Contact Member Advice (England) form. If you are an NASUWT School Representative, please contact your Local Association Secretary or National Executive Member. NASUWT members in Northern Ireland can get support, advice and information on employment-related issues using our Contact Member Advice (Northern Ireland) form. Members requiring professional support out of hours should contact their Local Association Secretary or National Executive Member. (You will need to log in to see your personalised information.) If you are an NASUWT member working in Scotland, you can email the Scotland National Centre for support, advice and information. Members requiring professional support out of hours should contact their Local Association Secretary or National Executive Member. (You will nee