["https://www.nasuwt.org.uk/advice.html"]
title = "NASUWT |  Advice"
description = "NASUWT publishes a range of advice to support teachers and school leaders in their careers."
full_description = "The NASUWT, The Teachers’ Union, provides you with expert help in every professional area of your career, including, for example, your pay and pension, conditions of service, maternity and paternity leave, behaviour management, inspection and performance management. Whether you’re a new teacher or a school leader working in England, Northern Ireland, Scotland or Wales, the NASUWT’s team of experts provides advice and guidance that will support you every day throughout your career. Information about your pay and pensions including pay scales, pay policies and performance management Advice on your rights and entitlements including sickness absence, directed time, flexible working, maternity and paternity rights and redundancy. Advice on issues such as assessment, behaviour, bullying, class sizes, curriculum, inspection, planning and special needs education. The NASUWT has published a range of advice and resources on issues that affect the safety of your teaching and learning environment. The NASUWT is committed to challenging discrimination, inequality and intolerance in the workplace and in wider society. Easy-to-use toolkits and checklists and in-depth advice and support, we’ve produced resources on issues such as stress, workload, mental health and abusive behaviour, plus links to our free training courses for members. NASUWT members in England can get support, advice and information on employment-related issues using our Contact Member Advice (England) form. If you are an NASUWT School Representative, please contact your Local Association Secretary or National Executive Member. NASUWT members in Northern Ireland can get support, advice and information on employment-related issues using our Contact Member Advice (Northern Ireland) form. Members requiring professional support out of hours should contact their Local Association Secretary or National Executive Member. (You will need to log in to see your personalised information.) If you are an NASUWT member working in Scotland, you can email the Scotland National Centre for support, advice and information. Members requiring professional support out of hours should contact their Local Association Secretary or National Executive Member. (You will need to log in to see your personalised information.)"
