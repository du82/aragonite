["https://www.nasuwt.org.uk/about-us/the-voice-of-teachers-since-1919.html"]
title = "NASUWT |  The Voice of Teachers Since 1919"
description = "The NASUWT, The Teacher's Union, was formed in 1919 through the struggle of ordinary teachers prepared to do extraordinary things. Our Union is made up of teachers who said enough is enough."
full_description = "For 100 years, the NASUWT has been the voice of teachers, rising above the noise created by the torrent of ill-advised and ill-informed reforms that have swept across our great public education service. All the ground-breaking victories achieved and the significant gains secured for teachers have been when the NASUWT has courageously stood alone for what is right, often against the prevailing views of the day. The NASUWT’s proud and rich history of fighting for the rights of teachers have secured meaningful improvements to teachers’ pay, pensions, and conditions of service. There have been many steps along the way and thousands of members working for the common good who have refused to be silent. Our past is the firm foundation for our future and we are rightly proud of it. A history that should not be ignored. A rich heritage to be built on for the future. NASUWT members in England can get support, advice and information on employment-related issues using our Contact Member Advice (England) form. If you are an NASUWT School Representative, please contact your Local Association Secretary or National Executive Member. NASUWT members in Northern Ireland can get support, advice and information on employment-related issues using our Contact Member Advice (Northern Ireland) form. Members requiring professional support out of hours should contact their Local Association Secretary or National Executive Member. (You will need to log in to see your personalised information.) If you are an NASUWT member working in Scotland, you can email the Scotland National Centre for support, advice and information. Members requiring professional support out of hours should contact their Local Association Secretary or National Executive Member. (You will need to log in to see your personalised information.) If you are an NASUWT member working in Wales, you can email the Wales/Cymru National Centre for support, advice and information. Members requiring professional support out of hours should contact their Local Association Secretary or National Executive Member. (You will need to log in to see your personalised information.)"
