["https://www.nasuwt.org.uk/contact-us/contact-member-advice-england.html"]
title = "NASUWT |  Contact Member Advice (England)"
description = "NASUWT members in England can get support, advice and information on employment-related issues by using this form to contact the Member Support Advice Team."
full_description = "The NASUWT has produced guidance on a wide range of topics in order to support our members. Answers to your most common questions can often be found on our Advice pages or in the list on the right/below. If your question remains unanswered, however, and you are a member teaching in England, please complete the contact form below and one of our advisers will respond to you as soon as possible. If you work in Northern Ireland, Scotland or Wales, see below. Please enter your details below. If you can’t provide your membership number, please enter your date of birth AND your postcode. We will not be able to contact you without these details unless you can provide your membership number. Please summarise below your employment query/issue, any actions you have taken to address it, any response from your employer or other relevant party and any question(s) you would specifically like us to respond to. If you have been invited to a meeting, or there are any other important dates that we need to be aware of, please ensure you confirm the date, time and venue of the meeting. To update your contact or employment details, please email the Membership Team, quoting your membership number. If you are an NASUWT School Representative, please contact your Local Association Secretary or National Executive Member. If you are an Accredited Caseworker, please contact your Regional Centre directly for advice, support and guidance. The NASUWT Member Support and Advice Team can advise members in England on employment-related issues at work. While we understand that issues at work can at times impact members’ health in many ways, NASUWT Member Support and Advice services can only signpost you to relevant support services outside the Union that can advise you on specific health issues. We cannot provide advice on any health issues impacting you. Our Wellbeing Tools for Teachers page also has a wealth of information and contacts for teachers suffering from health-related stress and anxiety, as well as details of our advocacy work on behalf of our members."
