["https://www.nasuwt.org.uk/article-listing/mps-backing-for-miscarriage-campaign-welcomed.html"]
title = "NASUWT |  MPs backing for miscarriage campaign welcomed"
description = "In a compassionate society, paid miscarriage leave should be a statutory right for all workers in all sectors."
full_description = "NASUWT – The Teachers’ Union has today welcomed a call by the House of Commons Women and Equalities Committee for a statutory minimum period of paid leave for all women and their partners who experience miscarriage prior to 24 weeks of pregnancy. The Union is pleased that the influential group of MPs have indicated they are looking to table amendments to the Government’s Employment Rights Bill to change the law. At its 2024 Annual Conference, NASUWT members passed a motion calling for miscarriage to be included within statutory maternity, paternity and parental bereavements rights so that workers experiencing the trauma of miscarriage have the right to paid time off. NASUWT General Secretary Dr Patrick Roach, said: “It is a really welcome development that this influential cross-party group of MPs are behind a change to the law. We hope Ministers will accept any amendments that seek to bring the law into line with the existing provision for those who lose a baby after 24 weeks. “Under the present law workers experiencing the trauma of miscarriage have to rely on the goodwill of their employer if they need time off after experiencing a miscarriage. “Those experiencing miscarriage should not have their grief compounded by having to go cap in hand to their employer or worrying about whether they can afford time off. “In a compassionate society, paid miscarriage leave should be a statutory right for all workers in all sectors. “NASUWT believes every teacher who experiences pregnancy loss should be given the time and space they need to deal with their loss and bereavement and recover and recuperate.” NASUWT members in England can get support, advice and information on employment-related issues using our Contact Member Advice (England) form. If you are an NASUWT School Representative, please contact your Local Association Secretary or National Executive Member. NASUWT members in Northern Ireland can get support, advice and information on employment-related issues using our Contact Member Advice (Northern Ireland) form. Members requiring professional support out of hours should contact their Local Association Secretary or National Executive Member. (You will need to log in to see your personalised information.)"
