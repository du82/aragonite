["https://www.nasuwt.org.uk/article-listing/members-strike-over-school-closure-plans.html"]
title = "NASUWT |  Members strike over school closure plans"
full_description = "Members of NASUWT – The Teachers’ Union at Lewis Girls School, Ystrad Mynach, Caerphilly, are taking strike action tomorrow (Wednesday) over plans to close the school and merge with Lewis Pengam School. The decision over the closure is being made without any consideration to the impact the changes will have on members' workload, working conditions and the welfare of members. Members have been given no assurances that they will not lose their jobs. NASUWT General Secretary Dr Patrick Roach said: “The local authority is attempting to force through the closure of this school. “We have yet to be reassured this merger with Lewis Pengam will happen fairly and without significant job losses or changes to teachers working conditions. “The approach taken so far is not in the interests of the school community and will only serve to escalate the dispute.” Neil Butler, NASUWT National Official Wales said: “The decision over the proposed closure of this school is being taken without proper consultation with the staff affected. “The changes are being brought in ahead of any the planning that needs to be done to ensure that quality education can continue to be provided in the transition. Many questions remain unanswered. “It is not acceptable for members to not know what is going to happen in terms of job losses and how their working conditions will be affected.” NASUWT members in England can get support, advice and information on employment-related issues using our Contact Member Advice (England) form. If you are an NASUWT School Representative, please contact your Local Association Secretary or National Executive Member. NASUWT members in Northern Ireland can get support, advice and information on employment-related issues using our Contact Member Advice (Northern Ireland) form. Members requiring professional support out of hours should contact their Local Association Secretary or National Executive Member. (You will need to log in to see your personalised information.)"
