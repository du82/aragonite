["https://www.nasuwt.org.uk/advice/isle-of-man.html"]
title = "NASUWT |  Isle of Man"
description = "NASUWT protecting teachers’ pay and conditions in the Isle of Man (IoM)."
full_description = "The NASUWT is the largest teachers’ union in the Isle of Man (IOM), representing over 600 teachers and lecturers across the island. Currently, the NASUWT is in dispute with the Department for Education, Sport and Culture (DESC) over pay, pensions and conditions of service, which includes the terms and conditions and the pay and appraisal processes. Although the Union remains in dispute, action has been paused following significant positive movement from the DESC on a number of issues, including the end of performance-related pay, as well as significant progress regarding the Trade Union Recognition Agreement. A full review of terms and conditions, to include the operation of rarely cover, is also to begin shortly. The Isle of Man is covered by the North West Regional Centre, which can be contacted by emailing [email protected]. NASUWT members in England can get support, advice and information on employment-related issues using our Contact Member Advice (England) form. If you are an NASUWT School Representative, please contact your Local Association Secretary or National Executive Member. NASUWT members in Northern Ireland can get support, advice and information on employment-related issues using our Contact Member Advice (Northern Ireland) form. Members requiring professional support out of hours should contact their Local Association Secretary or National Executive Member. (You will need to log in to see your personalised information.) If you are an NASUWT member working in Scotland, you can email the Scotland National Centre for support, advice and information. Members requiring professional support out of hours should contact their Local Association Secretary or National Executive Member. (You will need to log in to see your personalised information.) If you are an NASUWT member working in Wales, you can email the Wales/Cymru National Centre for support, advice and information. Members requiring professional support out of hours should contact their Local Association Secretary or National Executive Member. (You will need to log in to see your personalised information.)"
