["https://www.nasuwt.org.uk/about-us/nasuwt-equalities-policies-and-action-plans/nasuwt-anti-racism-policy.html"]
title = "NASUWT |  NASUWT Anti-racism Policy"
description = "The NASUWT is committed to preventing and addressing all forms of racism and providing an environment free from any form of harassment to ensure that members, staff and third parties are treated with dignity and respect."
full_description = "The NASUWT is committed to preventing and addressing all forms of racism and providing an environment free from any form of harassment to ensure that members, staff and third parties are treated with dignity and respect Policy statement TUC Anti-Racism Action Plan and Manifesto About this policy Who does this policy apply to? Who is responsible for this policy? What is anti-racism? The law Intersectional racism Unwanted racist conduct If you are a victim of racist abuse or harassment Making a formal complaint Formal investigations Action following the investigation The disciplinary process Appeals Support for those involved Confidentiality NASUWT as an employer Equality impact statement This Anti-Racism Policy document sits alongside the NASUWT Anti-Racism Action Plan adopted in 2022 (see right/below). The Action Plan commits the Union to a series of specific actions for securing racial justice in the workplace as well as within NASUWT through its systems, processes and policies. This policy reaffirms the Union’s statement of commitment to anti-racism as follows: NASUWT is committed to anti-racism and to rooting out racial prejudice, inequality, discrimination, injustice and hatred at all levels within our Union. We are committed to anti-racist action that will consciously and proactively challenge, oppose and seek to eradicate institutional and systemic racial injustice and inequality. We are committed to anti-racist action that ensures we have a working environment where racism is not tolerated, where staff and members from all backgrounds are confident and committed to tackling racial prejudice, discrimination, harassment and exclusion and where diversity is welcomed, celebrated and promoted. We are committed to anti-racist action that is rooted in transparent use of data about the treatment, experiences and viewpoints of Black staff and members. We are committed to anti-racist action that is focused on campaigning for racial justice within the Union and across wider society, both nationally and internationally."
author = "E&T"
year_published = 2025
