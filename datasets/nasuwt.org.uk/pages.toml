["https://www.nasuwt.org.uk/advice/supply-teacher.html"]
title = "NASUWT |  Supply Teacher"
description = "The NASUWT recognises that supply and substitute teachers are committed and dedicated professionals who make a vital contribution to securing high educational standards for all children and young people."
full_description = "This guide will help you understand your rights as a supply teacher under the Agency Workers Regulations, which ensure that agency workers such as supply teachers are entitled to equal treatment after a 12-week qualifying period. The majority of supply teachers are employed as agency workers through an employment business or supply agency. This guide will help you understand your rights and entitlements under the Regulations. The Covid-19 pandemic highlighted the importance of supply teachers and spotlighted the growing casualisation of work and the situation for supply teachers who are often left vulnerable to the vagaries of precarious, intermittent and insecure employment The NASUWT Health and Safety Checklist will assist supply teachers to stay safe and ensure you are aware of your health and safety responsibilities in keeping yourself and others safe. The NASUWT has concerns on the validity of statements made by online booking platforms for supply teachers The NASUWT is concerned about the growth and prevalence of umbrella companies in education and the lack of transparency regarding how they operate and what they do. The NASUWT wants to hear the experiences of supply teachers working for supply agencies in England and Wales. The NASUWT annual survey report into what you have told us about the experience of being a supply teacher, which informs the Union's campaigns for better terms and conditions. Advice on the number of ways in which supply teachers are employed in Wales, depending on local needs, language and subject requirements. The NASUWT is committed to ensuring that all supply teachers have the information they need and has produced this advice and guidance to assist them when looking to assert their rights in respect of holiday pay Campaigning to secure professional entitlements and securing decent pay and working conditions for supply teachers are key priorities for the NASUWT Our national Supply Teachers' Seminars allow you to find out more about the impact of government policy changes, take part in professional development workshops and find support on issues you face in the workplace"
