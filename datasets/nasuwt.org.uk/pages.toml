["https://www.nasuwt.org.uk/about-us/retired-member/local-retired-members-association.html"]
title = "NASUWT |  Retired Members Associations"
description = "Find your local retired members’ group here"
full_description = "Retired Members will be contacted by their Retired Members’ Association (RMA) with information about its activities soon after switching to the Retired Member subscription rate. You can contact your RMA Secretary by logging into the NASUWT website and going to My Local Association Secretary. Retiring members can obtain information about their prospective RMA by contacting either the Federation of Retired Members’ Associations (FRMA) Regional Executive Member for their region or the FRMA Secretary or Development Officer. Contact details can be found on the right/below under Retired Members Resources. Most RMAs also cover the area of several Local Associations - see the list below for the closest group to your location. North East North West East Midlands West Midlands South West South East The RMAs and their six constituent regions Active members meet monthly for lunch at pubs across the region whilst we try to organise a programme of visits and cultural activities which celebrates our region’s unique heritage and geography. The Association pays for these visits when it is able to and welcomes both members and their partners or guests. Our AGM is held at NASUWT North East Regional Centre in February. This reflects the strong relationship we enjoy with the local NASUWT and provides an opportunity to review our activities, to discuss issues of relevance to our members and to plan for the future - and to enjoy a good lunch! Teesside is a small and very active Association with 111 members. Fortunately, the area is geographically compact making access to meetings and social events relatively easy. The Committee is hardworking and meets four or five times a year (this includes the AGM) at the local Municipal Golf Club in Middlesbrough - central for all members. All members are welcome to attend and are encouraged to do so. The aims of the Association are: The social calendar provides a monthly pub lunch using local venues and two outings a year. These are well supported and very enjoyable. Teesside also runs a walking group and organises a local walk at the end of every month. An annual magazine is produced and many members contribute articles. The Secretary keeps the membership informed with regular newsletters which includes updates from the National Pensioners’ Convention and information on campaigns regarding issues affecting retired people. Our aim is to enjoy retirement and support one another."
