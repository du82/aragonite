["https://www.nasuwt.org.uk/be-involved/training-and-development/training-courses.html"]
title = "NASUWT |  Training Courses"
full_description = "The NASUWT invests in the provision of free, high-quality education and training courses for all its members and representatives across the UK. Members are the lifeblood of the NASUWT and our lay activists are the Union’s beating heart. Putting teachers first has always been our core mantra and philosophy. To do that, we are determined to support the work of lay activists through our Trade Union Education and Training Programme: Our programme of trade union education and training reflects our commitment nationally to support the work of lay activists and to ensure that you have the essential knowledge, skills and tools to win for our members and to grow the Union. Our Training Programme has been developed to inspire activism, renew our Union, increase member participation, and build our strength in depth. Strengthening our Union at every level, renewing our collectivism and building our resilience will be vital in the years ahead as we work together now and in the future to meet our shared aims and objectives. The NASUWT is committed to providing the best possible training experience for all its members and ensuring that our provision is fully accessible. We can provide information and services in alternative formats, along with other reasonable adjustments as requested. As some of these adjustments require time to arrange, we strongly suggest a request is submitted as soon as possible after you receive the course confirmation. Members should attend physical courses at their own Regional or National Centre, an adjacent Regional Centre (if applicable) or alternatively at our Headquarters in Birmingham. Members in Northern Ireland and Scotland should attend courses in their respective National Centres in Belfast and Edinburgh, where the course content will reflect the particular local circumstances. Members in Wales should attend courses either at the National Centre in Cardiff or the Regional Centre in St Asaph. For further clarification on any course, please email the Equality and Training Team. Student members can find details of relevant training, seminars and conferences on the NASUWT Student Hub. Location details can be found under the individual course listings."
