["https://www.nasuwt.org.uk/article-listing/nasuwt-comments-on-proposals-for-ofsted-reform.html"]
title = "NASUWT |  NASUWT comments on proposals for Ofsted reform"
description = '"The proposals published by Ofsted highlight how far away we still are from developing a fit-for-purpose approach to school accountability that serves the public interest whilst respecting, supporting and valuing the work of the teaching profession."'
full_description = 'Commenting on the proposals for reform of inspection published by Ofsted today, Dr Patrick Roach, NASUWT General Secretary, said: “It is to be welcomed that the Chief Inspector has committed to a genuine consultation around essential reforms to the inspection system in England. No one should be in any doubt that reform is necessary and long overdue. "However, it is deeply regrettable that the proposals published by Ofsted highlight how far away we still are from developing a fit-for-purpose approach to school accountability that serves the public interest whilst respecting, supporting and valuing the work of the teaching profession. "Whilst we will be seeking engagement on the detail set out in Ofsted’s proposals, it is already clear that further significant changes are still needed to the way in which inspections are undertaken and their outcomes reported. "Some of the proposals Ofsted has put forward may have merit, but others fail to address the root problems and could make the experience of inspection even worse. “Reform of inspection must not be limited to tinkering at the edges with grading scales and descriptors; we need to see fundamental reform to the climate, conditions and culture of the wider accountability framework within which Ofsted operates. “Whilst we welcome the Chief Inspector’s commitment to securing a constructive and collaborative relationship with the profession, we are concerned that the continuing high stakes system of inspection and accountability will do more harm than good and will not help Ofsted to build a relationship of trust with the profession. “The reforms needed will also require changes to be made by the government as well as by Ofsted. "We still need to see the government addressing the flawed legislative framework within which Ofsted is required to operate and which continues to undermine trust in inspection. "We have been clear from the outset that any effective reform to inspection must be capable of commanding the support of the profession. To date, we have seen too little engagement, especially on the big idea of the Report Card. This 12-week consultation must now provide the opportunity to lift the lid on Ofsted’s proposals and examine these changes in detail. “However, we are concerned that by insisting on a timescale for implementing these reforms from autumn 2025, the government risks preventing deep and meaningful engagement and testing of proposals that needs to be undertaken with the sector to ensure that the effectiveness of these reforms. If more time is needed, the government and Ofsted must ensure that more time is given to get these changes right. "It must never be forgotten that the impetus for the development of these proposals and recent debates about inspection and accountability were a consequence of the tragic death of headteacher Ruth Perry. It is vital that Ofsted and the Chief Inspector are able to demonstrate through this consultation that these proposals will ensure that all future inspections are carried out with professionalism, empathy, courtesy and respect.”'
