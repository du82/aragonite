["https://www.nasuwt.org.uk/advice/in-the-classroom.html"]
title = "NASUWT |  In the Classroom"
description = "Get the latest information and advice on matters affecting your teaching and learning inside the classroom such as inspection, curriculum, assessment, behaviour management, bullying, planning, special educational needs and teacher training."
full_description = "A framework to support action to support teachers and school leaders to decolonise the curriculum as part of anti-racist practice in their schools. The NASUWT has set out six principles for the ethical development and application of artificial intelligence and digital technologies in education This section contains information, advice and support on the assessment, curriculum and qualifications frameworks across the UK. A range of resources offering practical advice on how to manage behaviour within the classroom, including guides on reviewing behaviour management procedures and restorative behaviour practices. The bullying of pupils and staff can exist in many forms and is completely unacceptable. NASUWT has campaigned relentlessly for more to be done to tackle the issue. The information in this section focuses on work to ensure that children and young people are safe, secure, can make a contribution and enjoy good physical and mental health. The NASUWT continues to campaign for high quality early education in which qualified teachers take the lead role for teaching and leading teaching and learning. This section of the website provides advice, guidance and information for each UK inspection jurisdiction. We provide a brief explanation of the three international assessments of student performance used in the UK and consider the benefits and limitations of the studies. All teachers should have a guaranteed minimum of 10% timetabled planning, preparation and assessment (PPA) time marked on the timetable. The NASUWT’s mission is to create conditions that enable teachers to secure the best educational opportunities for all children and young people, with the values of equality, democracy, justice and solidarity at its heart. Advice that will help teachers and school leaders ensure that remote education is safe and sustainable for the workforce and secures the best educational experiences for children and young people. NASUWT offers advice on teacher training and maintaining professional teaching standards across the UK."
