description = "The offer of free membership for students extends to new teachers who join NASUWT or convert their student membership to full new teacher membership, entitling you to a range of services."
full_description = "As a new teacher member of NASUWT, you are entitled to a range of services to support your career. For details of the discounted subscriptions we offer new teachers, please see our Subscription Offers page. Our exclusive Starting Out member guides are tailored to your specific location and include advice and tips on everything you need to know as you start out in the teaching profession. Everything you need to know as an ECT, Beginning Teacher, Probationer Teacher or NQT on key issues related to the professional status of teachers, including the new Early Career Framework in England. Pay scales for England (plus London and fringe areas), Northern Ireland, Scotland and Wales, including leadership, FE and supply teachers Take a look at our advice on the dangers of social media in the classroom and what you can do to protect your personal and professional life. This free series of events is designed exclusively for our new teacher members to support your specific needs as you take those first steps in the teaching profession NASUWT has membership offers for students, newly qualified teachers and teachers on maternity, adoption or shared parental leave NASUWT membership gives you a number of discounts and deals on day trips, restaurants, airport parking and much more. If you require a response from us, please DO NOT use this form. Please use our Contact Us page instead. In our continued efforts to improve the website, we evaluate all the feedback you leave here because your insight is invaluable to us, but all your comments are processed anonymously and we are unable to respond to them directly. NASUWT members in England can get support, advice and information on employment-related issues using our Contact Member Advice (England) form. If you are an NASUWT School Representative, please contact your Local Association Secretary or National Executive Member. NASUWT members in Northern Ireland can get support, advice and information on employment-related