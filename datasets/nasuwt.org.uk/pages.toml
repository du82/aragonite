["https://www.nasuwt.org.uk/about-us/retired-member/bereavement-advice-and-guidance.html"]
title = "NASUWT |  Bereavement Advice and Guidance"
description = "The death of a loved one is a difficult time for everyone involved and it can be confusing for our members and their families. NASUWT has set out some useful advice and links to help you at this difficult time."
full_description = "The death of a loved one can be a difficult time for everyone involved and it can be confusing for our members and their families. Bereavement is a personal experience which can affect people in different ways. It can be a very emotional, stressful and often traumatic time and the emotions, including grief, can be overwhelming when having to comply with procedures such as registering the death and informing pension schemes (occupational, state and/or private pension), and banks or dealing with other personal and financial arrangements. Should you want access to help and further information, support and guidance is available at: One of the first procedures is to register the death. There is some departmental advice on how to do this and begin fulfilling legal and regulatory obligations on the Gov.uk step-by-step guide What to do when someone dies. Helpfully, the government’s Tell Us Once service allows you to inform all the relevant government departments in one go when someone dies. The service will inform government departments and agencies, e.g. HM Revenue and Customs (HMRC), Department for Work and Pensions (DWP), UK Passport Agency, Driver and Vehicle Licensing Agency (DVLA) and local councils. If you don’t use this service or choose not to, you can alternatively let the relevant organisations know about the death yourself. There is departmental guidance on how to do this on the Gov.uk Report the death without a Tell Us Once reference number. There may be financial implications for surviving spouses or other family/next of kin in terms of entitlement to state benefits and support, tax, allowances and additional entitlements, i.e. funeral costs. Further guidance on these issues is available on the Gov.uk Your benefits, tax and pension after the death of a partner page. The Teachers’ Pension Scheme (TPS) must be informed about the death in order to put in place any death benefits that you may be eligible to receive as a surviving spouse or in the capacity of a beneficiary/dependant. The easiest way to inform the TPS is by using the online form Death notification and application for death benefits. Alternatively, you can call the contact centre on 0345 606 6166 between 8.30am and 6pm Monday to Friday. The TPS will need to verify the deceased member’s service record and salary details etc. and process any death benefits, subject to eligibility. You may have to complete some application forms and apply for probate and a Power of Attorney to access benefits - the TPS will be able to advise on this further."
author = "CC"
year_published = 2025
