["https://www.nasuwt.org.uk/article-listing/minibus-safety-petition-launched.html"]
title = "NASUWT |  Minibus safety petition launched"
full_description = '''A UK-wide petition to put school minibus safety on the political agenda has been launched today. It is the latest stage of a campaign by the parents of a child killed in a minibus crash and NASUWT – The Teachers’ Union. Liz and Steve Fitzgerald’s daughter Claire was 13 when she was killed along with 11 other pupils and their teacher. The tragedy occurred on November 18th 1993 when a minibus from Hagley Roman Catholic High School crashed on the M40 near Warwick. Only two pupils survived. Although much has been done to improve the safety of minibuses themselves since the crash, the NASUWT is deeply concerned that the fundamental cause of the accident – a teacher driving a minibus when they shouldn’t have been – remains unresolved. NASUWT is calling on parents, teachers and the public to sign the petition on the House of Commons website and call on their MP to back the campaign to ensure all schools with minibuses are required to have a full public service vehicle operator’s licence. NASUWT General Secretary Dr Patrick Roach said: “Teachers can be expected to work for a full day in the classroom and then be asked to drive pupils often for hours at a time. This is completely unacceptable and must not be allowed to continue. “The campaign is gaining momentum with MPs giving their backing to close the loophole in the regulations, bring in statutory safeguards and ensure all drivers of minibuses have formal qualifications “Now we need to see concerted action by Ministers to ensure everything is done to prevent history repeating itself.” Liz Fitzgerald said: “Children at the moment are not as safe as they could be or should be. Children today are in exactly the same position as Claire was when she was killed.” Steve Fitzgerald said: “We would like everybody to sign the petition. We want to see change and we want to see it now.” Sarah Edwards, Liz and Steve’s MP said: "Children, teachers and staff travelling in school minibuses should be as safe as possible. Please sign the petition to help us drive a change in the law to prioritise driver qualifications and make sure school minibuses are safe for everyone. “I have supported Liz and Steve's campaign since I was first elected, and with a change in Government we have a new chance to make school minibuses safer"'''
author = "NASUWT"
year_published = 2025
