["https://www.nasuwt.org.uk/be-involved/events.html"]
title = "NASUWT |  Events"
description = "A round-up of events co-ordinated by the NASUWT includes events for all members in England, Northern Ireland, Scotland and Wales from newly qualified teachers to leaders, including supply and substitute teachers and members of under-represented groups."
full_description = "NASUWT members gather every year during the Easter break to debate the issues that are important to teachers, set the agenda for the coming year and recognise the work done by activists As part of our ongoing campaign work on race inequality, we've launched our Big Conversation on Racial Justice so that you can contact us direct to tell us your stories and raise your concerns The NASUWT programme of equalities Consultation Conferences is designed to engage members from under-represented groups to give them a platform to inform NASUWT policy and practice These briefings are one-day events that provide NASUWT activists with information on developments in equalities and other national issues Our annual seminar brings Health and Safety Representatives and other key office holders up to date with current health, safety and welfare issues in the workplace with keynote speeches, good practice seminars and Q&A sessions These annual health, safety and welfare events are specifically designed for Northern Ireland and Scotland Health and Safety Representatives and other key office holders NASUWT provides CPD, accredited training and events specifically tailored to the needs of its aspiring leaders and school and college leaders This free series of events is designed exclusively for our new teacher members to support your specific needs as you take those first steps in the teaching profession This training day will update attendees on recent developments affecting teachers‘ pay and conditions, the education system in the UK and the NASUWT response Our national Supply Teachers' Seminars allow you to find out more about the impact of government policy changes, take part in professional development workshops and find support on issues you face in the workplace An essential annual briefing to bring Training Officers up to date with key changes impacting NASUWT training NASUWT has partnered with Wesleyan Financial Services to provide a series of free-to-watch webinars designed specifically for teaching professionals"
