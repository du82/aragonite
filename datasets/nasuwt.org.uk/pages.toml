["https://www.nasuwt.org.uk/about-us/retired-member/winter-fuel-payment.html"]
title = "NASUWT |  Winter Fuel Payment"
description = "NASUWT will be responding to the government on the fairness, adequacy and value of pensions so that they allow for dignity in retirement."
full_description = "The Chancellor of the Exchequer, Rachel Reeves, has announced that, from winter 2024/25, households in England and Wales will no longer be entitled to the winter fuel payment unless they receive pension credit or certain other means-tested benefits. More than 10 million pensioners in England and Wales received the winter fuel payment for winter 2023/24 and therefore an estimated 10 million will be adversely impacted. The current winter fuel payment is: The decision is expected to save around £1.3 billion in 2024/25 and £1.5 billion in subsequent years. However, the proposals leave many pensioners in a position where they must choose to heat or eat this winter. The policy change has not been impact assessed by the Labour Party. Basing eligibility on receipt of means-tested benefits creates a ‘cliff edge’ where people who just miss out on benefits lose support completely. Pensioners eligible for, but not claiming, pension credit would also lose the winter fuel payment. Take-up of Pensions Credit has been a real issue and there are also concerns around the Department for Work and Pensions (DWP) being able to process claims. Winter fuel payments are devolved in Scotland and Northern Ireland. The Scottish Government and the Northern Ireland Executive have announced that due to funding cuts, they have no choice but to follow the UK Government’s decision to restrict payments. Pension credit is a means-tested benefit for people over state pension age who have a low income and has the effect of topping up their pension. Pension credit is a valuable benefit, worth £2,677 a year on average to eligible people. Anyone who qualifies for pension credit may also be entitled to other financial support, housing benefit, a reduction in council tax, or help with heating costs through winter fuel payments/warm homes discount. Pension credit tops-up weekly income to (April 2024): More than 850,000 older people are eligible for but not claiming pension credit. An estimated 130,000 older people miss out because they are just £500 over the income threshold to claim pension credit. [1] They could be better off by having lower income and claiming pension credit and the winter fuel payment. The DWP has reported a huge surge in applications recently, more so due to the cost of living and energy crises and state pension announcement on winter fuel payments being restricted. The DWP has reported 38,500 pension credit claims were submitted within the last five weeks. This is a 115% increase on the claims made in the previous five weeks. [2] Recent changes announced to the winter fuel payment mean that eligible pensioners will miss out on this support if they don’t claim pension credit before 21 December 2024."
author = "S&P"
year_published = 2025
