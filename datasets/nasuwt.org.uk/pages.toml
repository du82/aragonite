["https://www.nasuwt.org.uk/article-listing/nasuwt-comments-on-ifs-report-on-teacher-numbers.html"]
title = "NASUWT |  NASUWT comments on IFS report on teacher numbers"
description = "Cutting teacher numbers would not only damage life chances, it would be a false economy that would have impacts in the long term on Scotland’s future prosperity."
full_description = "Commenting on the on a report by the IFS suggesting teacher numbers in Scotland should be cut to in response to falling pupil numbers, Dr Patrick Roach, General Secretary of the NASUWT-The Teachers’ Union, said: “This report stands at odds with the generality of evidence from leading education countries which confirms that high investment in children’s education improves opportunity, outcomes and life chances. “Cutting teacher numbers would not only damage life chances, it would be a false economy that would have impacts in the long term on Scotland’s future prosperity. “Using changes in pupil numbers to justify cutting teacher numbers is not only short-changing children, it is based on a fallacy that there are already optimal numbers of teachers in schools. “Every parent would agree that investing more in teachers will reap rewards for children’s education, where teachers are better supported to do the job and pupils are better supported in their learning.” Mike Corbett, NASUWT Scotland National Official, said: “The IFS fails to take into account the rising volume of pupils with additional support needs, the number of which is expected to grow further in coming years. Cutting teacher numbers would further entrench existing inequalities in the outcomes and prospects for these pupils, which in turn would have a longer-term cost to society in terms of employment rates and physical and mental health. “Cutting teacher numbers would only exacerbate current problems with excessive workloads and working hours and negatively impact recruitment and retention. It could lead to a race to the bottom and undermine children and young people’s right to be taught by highly skilled, qualified and motivated teachers. “It should also be remembered that it was the commitment to post-pandemic 'Education Recovery', which prompted the Scottish Government to promise additional teacher numbers in the first place to help pupils who had struggled with or missed some of their education. But now we also need additional teachers to help address other post-Covid issues such as increased behavioural problems and poorer attendance. “Investment in teachers and in a high-quality education system is an investment in a fairer and more prosperous society and pays dividends that go beyond figures on a balance sheet.”"
author = "NASUWT"
year_published = 2025
