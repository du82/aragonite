["https://www.nasuwt.org.uk/advice/conditions-of-service/flexible-working/flexible-working-great-britain.html"]
title = "NASUWT |  Flexible Working (Great Britain)"
description = "A quick guide to help members in England and Wales understand their rights and how to go about making a flexible working request, including part time and job share."
full_description = "From April 2024, important changes have been introduced regarding flexible working and how requests for flexible working requests are handled. Under the Flexible Working (Amendment) Regulations 2023 and the Employment Relations (Flexible Working) Act 2023 the key changes are as follows: requests have to be dealt with by employers within two (not three) months of receipt of a request if no extension is agreed; employees will no longer, in their application, have to explain what effect the employee thinks agreeing to the request would have and how any such effect might be dealt with. The Union’s advice and guidance as detailed below and on subsequent pages has been updated accordingly, including revised Flexible Working Checklists for each nation which can be located on the right/below. Flexible working has a vital role to play in helping schools and colleges recruit, retain and motivate teachers. There is a significant body of evidence that shows the benefits of flexible working, such as increased productivity, a more motivated workforce, greater employee engagement and greater diversity among the workforce. Indeed, the Department for Education (DfE) in England notes that implementing flexible working allows schools to retain experienced staff, promote wellbeing and improve work/life balance. In addition, offering flexible working can help teachers adjust to different stages of their life, such as those with caring responsibilities and those looking to plan a phased retirement. [1] The NASUWT is aware that there are a significant number of members who would like to work more flexibly and achieve a better work/life balance. As such, the Union has produced this advice and guidance to ensure that members who are considering making a flexible working request are aware of their rights and entitlements and supported during this time. Flexible working can be seen as any arrangement that allows you to vary the amount, timing or location of your work. If you are considering making a request for flexible working, you should carefully consider which type of flexible working is best suited to you from the following:"
