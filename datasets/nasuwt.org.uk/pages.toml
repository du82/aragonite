["https://www.nasuwt.org.uk/about-us/nasuwt-equalities-policies-and-action-plans/nasuwt-sexual-harassment-policy.html"]
title = "NASUWT |  NASUWT Sexual Harassment Policy"
description = "The NASUWT is committed to preventing and addressing all forms of sexual harassment and providing an environment free from any form of harassment to ensure that members, staff and third parties are treated with dignity and respect."
full_description = "The NASUWT is committed to preventing and addressing all forms of sexual harassment and providing an environment free from any form of harassment to ensure that members, staff and third parties are treated with dignity and respect Introduction If you are being or have been sexually harassed Reporting an allegation Process summary flowchart The NASUWT is committed to providing an environment free from any form of harassment, including sexual harassment, to ensure that all members, staff and third parties are treated, and treat others, with dignity and respect. The NASUWT’s Rules seek to regulate relations between members through actively opposing all forms of harassment and to protect and promote the interests of members. NASUWT members and agents of the Union, including all lay officials, National Executive Members (NEMs) and National Officers, are expected to comply with this policy and any protocols, by-laws or other relevant procedures adopted by Conference or by the National Executive. This policy applies to all members of the Union, including elected lay representatives. This policy is relevant to Rule 27 of the Rules of the NASUWT and any Codes of Conduct of procedures issued by the Union. The Union will ensure that all proceedings in respect of sexual harassment are progressed in accordance with this policy. In the event of any conflict, the procedure within this policy for progressing complaints on matters relating to sexual harassment shall take precedence. Sexual harassment is unlawful under legislation including the Equality Act 2010 and the Sex Discrimination (Northern Ireland) Order 1976 (as Amended). Acts of sexual harassment will be considered to be in breach of this policy whether or not the sexual harassment is unlawful. Sexual harassment is unwanted conduct of a sexual nature with the purpose or effect of violating a person’s dignity or creating an intimidating, hostile, degrading or offensive environment for that person. In deciding whether an incident has the purpose or effect of violating a person’s dignity or creating an intimidating, hostile, degrading or offensive environment for that person, each of the following will be taken into account:"
