["https://www.nasuwt.org.uk/about-us/retired-member.html"]
title = "NASUWT |  Retired Members"
description = "All NASUWT members on retiring from teaching have continuing access to the following benefits irrespective of their age and circumstances of leaving the profession."
full_description = "Please log into the website using the link at the top of the page to access the Format magazine. Earlier editions of the magazine are available on the right/below. Over half of retired NASUWT members are worried about the cost of living crisis, according to a survey of our retired members. Forty-eight per cent of respondents to an FRMA (Federation of Retired Members’ Association) survey told us that they were ‘slightly worried’ about their financial situation and 5% were ‘very worried’. In addition, almost 1 in 5 members (19.73%) found it difficult or very difficult to cover the cost of their energy bills and just over 3% of retired members told us it was hard for them to cover the cost of their mortgage. Brian Roe, Vice-President of FRMA, said, ‘These figures should demolish the myth once and for all that teachers are on gold-plated pensions! ‘Too many of our members are struggling to cope, needing to use hard-earned savings and even foodbanks and other aid from charities. ‘For many years, teachers’ pay has definitely not kept up with inflation and cost of living increases. So pensions based on teacher salaries are also below what is needed. ‘Thanks to all the retired members who completed the survey and also to all the NASUWT staff who provided the technical expertise and helped with the distribution and collection of results.’ Over 1,000 members responded to the survey, which is more than 1 in 10 FRMA members, meaning the survey is a good representation of our retired membership. We hope this information will result in major discussions and ideas across NASUWT, including at meetings of Local Associations and RMAs. A more detailed breakdown of the findings derived from the questionnaire can be found on the right/below. Please feel free to pass on any comments, thoughts and suggestions about this survey to your FRMA Executive Member or Vice-President Brian Roe. All NASUWT members on retiring from teaching have continuing access to the following benefits irrespective of their age and circumstances on leaving the profession. This includes whether or not they pay a retired member’s subscription:"
