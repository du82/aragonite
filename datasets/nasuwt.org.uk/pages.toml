["https://www.nasuwt.org.uk/about-us/retired-member/pensioner-poverty.html"]
title = "NASUWT |  Pensioner Poverty"
description = "Findings from two reports, 'IFS: How have pensioner incomes and poverty changed in recent years?' and 'Living standards, poverty and inequality in the UK: 2024'."
full_description = "Pensioner incomes largely depend on pensions, from both state and private sources, 54% of pensioners received income from private pensions in 2019/20 compared with 50% in 2002/03. Pension incomes are driven by a combination of factors such as policy reforms, while state pension entitlements in particular have been subject to substantial reform. Between 2002/03 and 2011/12, median pensioner incomes grew by 22% after inflation. Poorer pensioners’ incomes were growing at a similar rate to average pensioner incomes prior to 2011 leading to relative pensioner poverty falling from 25% in 2002/03 to 13% in 2011/12. Since 2011, average pensioner incomes have been growing at a similar rate to working-age incomes. Average incomes for pensioners, which are now very similar to average incomes below state pension age, grew by 12% from 2011/12 to 2022/23, driven by higher state and private pension incomes. Since 2011, income growth for poor pensioners has lagged behind the population as a whole, rising by only 5% after inflation. This is in part because poor pensioners have benefited from neither the rises in employment income nor the rises in private pension income. This slow income growth for poorer pensioners means that relative pensioner poverty rose from 13% in 2011/12 to 16% in 2022/23, equivalent to an increase of 300,000 pensioners. Growth in state pension incomes has been offset in large part by falling levels of other benefits - higher state pensions increase pensioner incomes, making them increasingly ineligible for further means-tested state support - state pensions being the main source of income. Since the onset of the pandemic (2019/20 to 2022/23), lower income pensioners experienced higher income growth than higher income pensioners, as they received more state support during the cost-of-living crisis. However, these income poverty statistics understate the financial difficulties faced by poorer pensioners who were more exposed to sharp rises in gas, electricity and food prices."
author = "S&P"
year_published = 2025
