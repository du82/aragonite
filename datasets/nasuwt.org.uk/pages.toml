full_description = "Teachers cannot be required to routinely carry out administrative and clerical tasks that distract them from their core teaching and learning responsibilities. The NASUWT has produced advice and guidance to help you understand the rights and entitlements of those employed on a fixed-term contract. The NASUWT has produced guidance to help members understand their rights and how to go about making a flexible working request. Reduce your anxieties about your time off having a baby by reading NASUWT's advice on maternity leave and pay. Being made redundant can be an extremely worrying time. Read the NASUWT advice on the avenues available to you when you lose your employment. There may be circumstances when you are unable to work due to illness and this should be managed in a reasonable and professional way Four in every five teachers say that their workload and the stress of the job have increased and half of teachers say that workload has negatively affected their physical and mental health. Comprehensive information to assist teachers during leaving your job, bearing in mind that resignation can be a big step that requires due consideration. The NASUWT has published extensive advice on using school calendars and time budgets in England, Northern Ireland, Scotland and Wales. NASUWT members in England can get support, advice and information on employment-related issues using our Contact Member Advice (England) form. If you are an NASUWT School Representative, please contact your Local Association Secretary or National Executive Member. NASUWT members in Northern Ireland can get support, advice and information on employment-related issues using our Contact Member Advice (Northern Ireland) form. Members requiring professional support out of hours should contact their Local Association Secretary or National Executive Member. (You will need to log in to see your personalised information.) If you are an NASUWT member working in Scotland, you can email the