full_description = "Support staff unions are on action short of strike action across Northern Ireland and several unions have announced plans for strike action. NASUWT fully supports our sister unions and stand in solidarity with them. Currently, the action includes all controlled and maintained schools, but we understand that this may be extended to other schools soon. NASUWT advice to members in affected schools is that they should not undertake any additional work that may arise from the legal, legitimate action of another trade union. Please note that as per TNC 2015/1 Protocol for Home-School E-Learning (pdf), teachers cannot be compelled to participate in remote learning. NASUWT members in England can get support, advice and information on employment-related issues using our Contact Member Advice (England) form. If you are an NASUWT School Representative, please contact your Local Association Secretary or National Executive Member. NASUWT members in Northern Ireland can get support, advice and information on employment-related issues using our Contact Member Advice (Northern Ireland) form. Members requiring professional support out of hours should contact their Local Association Secretary or National Executive Member. (You will need to log in to see your personalised information.) If you are an NASUWT member working in Scotland, you can email the Scotland National Centre for support, advice and information. Members requiring professional support out of hours should contact their Local Association Secretary or National Executive Member. (You will need to log in to see your personalised information.) If you are an NASUWT member working in Wales, you can email the Wales/Cymru National Centre for support, advice and information. Members requiring professional support out of hours should contact their Local Association Secretary or National Executive Member. (You will need to log in to see your personalised information.) © 2025 NASUWT all rights reserved NASUWT, Ro