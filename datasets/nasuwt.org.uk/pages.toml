full_description = "Keeping your membership record up to date is important for you and for us - so we’ve provided several ways to make sure your details are accurate: if you’ve never logged in before or you’ve forgotten your password, you can use our forgotten password service to register for the first time or to reset your password. (If you require assistance with the login process, please see our Troubleshooting page.) if you don’t know your membership number, please include your date of birth and your home postcode. You can call our Membership Team to discuss your membership enquiry on 03330 145550 from Monday to Friday between 9am and 6pm. All the questions in this section are optional. If you prefer not to disclose any information in this section, please leave the answers blank. You can update aspects of your membership record yourself by logging into e-Membership via the website. [1] Once you’ve logged in, you can go to e-Membership using the links in your personalised panel wherever you are on the website. The panel will drop down when you click on your name at the top of any page. If you have any enquiries relating to subscriptions or bank details, they should be directed to the Membership Team. Footnote [1] You can use the forgotten password link if you’ve never logged in before or if you’ve forgotten your password. NASUWT members in England can get support, advice and information on employment-related issues using our Contact Member Advice (England) form. If you are an NASUWT School Representative, please contact your Local Association Secretary or National Executive Member. NASUWT members in Northern Ireland can get support, advice and information on employment-related issues using our Contact Member Advice (Northern Ireland) form. Members requiring professional support out of hours should contact their Local Association Secretary or National Executive Member. (You will need to log in to see your personalised information.) If you are an NASUWT member working in Scotland, you can email the Scotland National Centre for support, advice and information. Members requiring professional support out of hours should contact their Local Association Secretary or National Executive Member. (You will need to log in to see your personalised information.)"
