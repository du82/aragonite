["https://www.nasuwt.org.uk/article-listing/kent-teachers-strike-over-pensions.html"]
title = "NASUWT |  Kent teachers strike over attempts to downgrade pensions"
full_description = "Members of NASUWT-The Teachers’ Union at Farringtons School in Chislehurst, Kent, are today taking strike action over changes to their pensions which will make them significantly worse off in their retirement. The fee paying school is seeking to force teachers to accept detrimental changes to their pension contributions. Those wishing to remain in Teachers’ Pension Scheme (TPS) will see cuts to their pay or will have to join an inferior pension scheme. The employer has refused to recognise the NASUWT in discussions over the proposals and members have been left with no other option than to take strike action to seek to protect their incomes and their pensions. Further days of strike action are set to be taken on Tuesday 4 March, Wednesday 5 March, Tuesday 11 March, Wednesday 12 March and Thursday 13 March. Dr Patrick Roach, NASUWT General Secretary, said: “These unjustified plans are an attack on the financial security of hard-working teachers and will leave them worse off in retirement. “It is not acceptable to force teachers to be poorer in retirement or take a pay cut. “The Employer must withdraw these proposals and work with us so that further strike action can be avoided.” Colin Mills, NASUWT National Executive Member for Kent, said: “To take strike action is the last thing that teachers want to do but by undermining their future financial security they have been left with no choice. “The employer needs to withdraw its proposals immediately.” NASUWT members in England can get support, advice and information on employment-related issues using our Contact Member Advice (England) form. If you are an NASUWT School Representative, please contact your Local Association Secretary or National Executive Member. NASUWT members in Northern Ireland can get support, advice and information on employment-related issues using our Contact Member Advice (Northern Ireland) form. Members requiring professional support out of hours should contact their Local Association Secretary or National Executive Member. (You will need to log in to see your personalised information.)"
