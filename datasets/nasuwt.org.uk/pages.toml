["https://www.nasuwt.org.uk/about-us/subscriptions.html"]
title = "NASUWT |  Subscriptions - What You Should Pay"
description = "Find out what your subs will be this year, including payment periods and discount subscription rates. You can also find a link here to our special membership offers."
full_description = "Membership subs payable from 1 January 2025 Introductory offer Supply teachers Special membership offers Table of subscriptions for 2025 Earlier years subscriptions Included below are our subscription rates for 2025, along with payment periods and discounts for part-time and retired members. [1] The cost for a teacher working full time is £19.36 a month or £232.36 a year and less for part-time teachers, depending on your contracted hours of work. It is important to keep us informed of any changes to your circumstances. If you reduce or increase your hours, please contact the Membership Team to ensure you are paying the correct subscription rate. Any established teacher joining the union for the first time, and providing bank details for direct debit payments at the point of joining, will only pay £1 per month for the first three months of membership before moving onto the appropriate subscription rate for hours worked. [2] Subscription rates for supply teacher members are based on the average number of hours a supply teacher tells us they work in any given year. NASUWT makes every effort to inform all members in writing every year of the forthcoming subscription rates for the following calendar year. Given that any reductions in subscription rates due to a member’s change in circumstances can only be made at the point the Union is informed of the change, subscription rate changes cannot be made retrospectively. For details of special membership offers, including offers for students, new teachers who have recently qualified and those on maternity leave, plus how to claim tax relief, please see our Subscriptions - Membership Offers page. There are no hidden fees or local levies so you can rest assured that NASUWT, the teachers’ union, is the best value for money. For the purposes of claiming tax relief, please log in on Subscriptions - Membership Offers to see subscriptions rates for earlier years. Footnotes [1] National Rules of the Union, Rule 4(1)(a) Full Membership: All persons who are employed as qualified teachers and such other persons whose contract of employment requires them to teach, lecture or instruct whether on a full or part-time basis are eligible for Full Membership of the Union provided they support the Objects of the Union [2] This offer applies only to teachers who have not previously held NASUWT membership"
