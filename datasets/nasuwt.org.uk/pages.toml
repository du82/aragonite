["https://www.nasuwt.org.uk/advice/health-safety.html"]
title = "NASUWT |  Health and Safety"
description = "The NASUWT campaigns tirelessly to ensure that teachers' right to a safe teaching and learning environment is guaranteed. The NASUWT has produced leaflets  to deal with a variety of aspects of health and safety."
full_description = "Everything a Health and Safety Rep needs to know about your role, function and rights. We’ve also included an alphabetical list of health, safety and welfare issues, as well as further useful resources. It's important that questions are asked of employers to ensure they have sufficient oversight, procedures and processes in place to guarantee health and safety in the workplace. The NASUWT Risk Assessment Toolkit is a one-stop source of advice and guidance on ensuring the health and safety of teachers and pupils and the legal requirements on safety issues and contingency planning. Information and advice concerning health and safety management under the Management of Health and Safety at Work Regulations 1999. All teachers are entitled to teach in classrooms that are healthy and safe. The NASUWT has drawn up a checklist of ten top priorities for a safe and healthy classroom. It's easy to complete online and print for your records. Our Managing the Menopause Toolkit aims to help Workplace Reps have a greater understanding of the menopause and provides a framework for negotiation and consultation when working with employers. The Valued Worker Scheme is a cross-union initiative designed to recognise employers who treat their employees well and those who wish to treat their employees better. The Valued Worker Scheme page has information on the scheme, how it operates, and how employers can sign up to the scheme. The HSE has published The Talking Toolkit for Schools, with substantial input from the NASUWT, in a bid to get schools to talk openly and honestly about stress to help prevent problems or stop them getting worse. NASUWT members in England can get support, advice and information on employment-related issues using our Contact Member Advice (England) form. If you are an NASUWT School Representative, please contact your Local Association Secretary or National Executive Member. NASUWT members in Northern Ireland can get support, advice and information on employment-related issues using our Contact Member Advice (Northern Ireland) form. Members requiring professional support out of hours should contact their Local Association Secretary or National Executive Member. (You will need to log in to see your personalised information.)"
