["https://www.nasuwt.org.uk/about-us/who-s-who-at-nasuwt.html"]
title = "NASUWT |  Who’s Who at NASUWT"
description = "NASUWT National Officers, National Executive Members and the General Secretary Team."
full_description = "NASUWT is a union led by teachers for teachers. The main decision-making body of the Union consists of five National Officers who are elected by NASUWT members to serve a four-year cycle and the National Executive Committee who represent their District of the United Kingdom. The day-to-day running of NASUWT is the responsibility of the General Secretary Team. North East Districts 1-2 North West Districts 3-6 Yorkshire and Humberside Districts 7-9 East Midlands Districts 10-12 West Midlands Districts 13-15 Eastern Districts 16-18 South West District 19-21 Greater London District 22-25 South East District 26-29 Wales District 30-32 Scotland District 33 Northern Ireland District 34 Dr Patrick Roach took up office as NASUWT General Secretary in 2020, having previously served as Deputy General Secretary and in other senior roles since 1998. Jane Peckham became NASUWT Deputy General Secretary in May 2021, after serving as our National Official (Scotland) and as an Organiser in Scotland since joining us. Maggie Bremner became Assistant General Secretary (Administration and Resources) in 2020, having previously served as our Regional Organiser for the South East. Phil Siddle has been Assistant General Secretary (Regional Development and Support) since 2020, having headed up our Recruitment Team since joining us in 2008. NASUWT members in England can get support, advice and information on employment-related issues using our Contact Member Advice (England) form. If you are an NASUWT School Representative, please contact your Local Association Secretary or National Executive Member. NASUWT members in Northern Ireland can get support, advice and information on employment-related issues using our Contact Member Advice (Northern Ireland) form. Members requiring professional support out of hours should contact their Local Association Secretary or National Executive Member. (You will need to log in to see your personalised information.) If you are an NASUWT member working in Scotland, you can email the Scotland National Centre for support, advice and information. Members requiring professional support out of hours should contact their Local Association Secretary or National Executive Member. (You will need to log in to see your personalised information.)"
