["https://www.nasuwt.org.uk/advice/overseas-trained-teachers.html"]
title = "NASUWT |  Overseas Trained Teachers"
description = "The NASUWT works to overcome the raft of specific barriers and challenges experienced by overseas trained teachers in progressing their careers and lives."
full_description = "Teachers who are citizens of a European Economic Area (EEA) country or Switzerland who do not have settled or pre-settled status now need a visa to enable them to work in the UK. However, Irish citizens do not need a visa and continue to have a right to enter, live and work in the UK. Youth Mobility visa. Currently, this route is open to people under the age of 30 from Australia, Canada, Japan, Monaco, New Zealand, Hong Kong, Korea, San Marino, Taiwan and British Overseas Territories. People who graduate from a UK university, including those who graduate from a postgraduate initial teacher training course, can work in the UK for up to two years after graduating (three years for those who have a PhD). Graduates can work in any job, including working as a teacher, during this period. Teachers who work on a graduate visa will be able to switch to another visa, e.g. skilled worker visa, without leaving the country. The Government has set a minimum salary threshold for skilled worker visa. In Spring 2024, the salary threshold for skilled workers other than those in specified skilled occupations will be £38,700. However, this general salary threshold will not apply to teachers as they are treated differently for skilled worker visa purposes. The salary threshold for teachers will continue to be the minimum national pay rate for teachers. This requirement recognises that there are different pay rates for teachers in England, including inner and outer London rates, Northern Ireland, Scotland and Wales. It means that the threshold will depend on where in the UK the job is located and whether the teacher is working as a qualified teacher or an unqualified teacher. If a teacher works part-time, their pay will need to be prorated against the relevant national pay range. It will also need to meet the Home Office’s absolute “floor” threshold. In December 2023, the absolute floor threshold was £20,940. While no announcement has been made about increasing the floor threshold, it is possible that it will be increased in spring 2024. The visa rule changes will affect support staff roles such as teaching assistants, as these roles are not covered by the special considerations. This means that somebody applying for a skilled worker visa to enable them to work as a teaching assistant would need to meet the general salary threshold of £38,700."
author = "Ed"
year_published = 2025
