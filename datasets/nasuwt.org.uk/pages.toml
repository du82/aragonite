["https://www.nasuwt.org.uk/advice/teachers-in-residential-establishments.html"]
title = "NASUWT |  Teachers in Residential Establishments"
description = "NASUWT is committed to supporting teachers working in all sectors of the education system across the United Kingdom, including teachers working in a variety of residential settings, who often face particular issues and challenges"
full_description = "NASUWT is committed to supporting teachers working in all sectors of the education system across the United Kingdom, including teachers working in a variety of residential settings, who often face particular issues and challenges England Wales The Local Government Association (LGA) has issued Circular 232 for 2024/25 regarding the pay award for teachers working in residential establishments. The Circular is available to download at the top of the page. LGA Circular 232 confirms that there will be pay increases for 2024/25 for those classroom and leadership teachers employed under the terms of the School Teachers’ Pay and Conditions Document (STPCD). Further details on the 2024/25 pay award for teachers working in residential establishments in England can be found on our Pay Award (England) page. Whilst not referenced in the Circular, it should be noted that the revised STPCD in England permits the decoupling of pay from performance management. Whilst not referenced in the Circular, it should be noted that the revised STPCD now requires employers in England to make a choice about whether or not they will decouple pay from performance management. Residential establishments should be cognisant of this when revising pay policies. Indeed, NASUWT maintains that performance-related pay must be removed and pay and performance management policies amended accordingly. The Union has published updated checklists for pay policies and performance management policies with no link between pay and performance, which should be used to guide employers’ revisions to these policies. For teachers in residential establishments in Wales, pay arrangements are set by the School Teachers’ Pay and Conditions (Wales) Document (STPC(W)D). The pay scales for teachers in Wales are mandatory and establishments are therefore expected to revise their pay scales accordingly. Further details on the 2024/25 pay award for teachers working in residential establishments in Wales can be found on our Pay Award (Wales) page. As such, residential establishments in England and Wales should revise their pay scales accordingly."
