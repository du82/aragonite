["https://www.nasuwt.org.uk/article-listing/employment-rights-bill-amendments.html"]
title = "NASUWT |  NASUWT response to Employment Rights Bill amendments"
description = '“The amendments announced in the Bill, including those on the use of zero hours contracts, Statutory Sick Pay, and tackling non-compliance in the umbrella agency model will make a big difference to many teachers," said Dr Patrick Roach.'
full_description = "Commenting on the government’s announcement of amendments to the Employment Rights Bill, Dr Patrick Roach, General Secretary of NASUWT – The Teachers’ Union, said: “Today’s announcements on the Employment Rights Bill are welcome progress towards greater employment protections for a just, democratic society. For too long, unscrupulous employers have acted with impunity and workers have – quite literally – paid the price. “The amendments announced in the Bill, including those on the use of zero hours contracts, Statutory Sick Pay, and tackling non-compliance in the umbrella agency model will make a big difference to many teachers. Supply teachers in particular will benefit from these long overdue changes. “We look forward to continued partnership with the government on this inspiring agenda for employment rights reform.” NASUWT members in England can get support, advice and information on employment-related issues using our Contact Member Advice (England) form. If you are an NASUWT School Representative, please contact your Local Association Secretary or National Executive Member. NASUWT members in Northern Ireland can get support, advice and information on employment-related issues using our Contact Member Advice (Northern Ireland) form. Members requiring professional support out of hours should contact their Local Association Secretary or National Executive Member. (You will need to log in to see your personalised information.) If you are an NASUWT member working in Scotland, you can email the Scotland National Centre for support, advice and information. Members requiring professional support out of hours should contact their Local Association Secretary or National Executive Member. (You will need to log in to see your personalised information.) If you are an NASUWT member working in Wales, you can email the Wales/Cymru National Centre for support, advice and information. Members requiring professional support out of hours should contact their Local Association Secretary or National Executive Member. (You will need to log in to see your personalised information.)"
