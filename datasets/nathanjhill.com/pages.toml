title = "nathanjhill.com · Who is the immigrant?"
full_description = "Who is the immigrant? I’ve been reflecting on possessiveness in this country. Who belongs to who? Who belongs where? What does it mean to be an immigrant when many folks, who are white, no longer claim or understand our own roots as immigrants? When does a landscape belong to someone - after you are born there? Or after you are there for 100 years? When? I am thankful and thoughtful of Haitian neighbors who are being unfairly targeted. But I am also thinking hard about my own identity and who I say I am, as an ancestor of immigrants. September 14, 2024 4:10 AM Recent posts Can an old Chromebook find a new life in Linux? I'm posting from a Chromebook. Who is the immigrant? School Is Starting Labor Blessing for May Day Welcome to the new blog Dr. King Is Misquoted A Lot A Note about the End Times You are invited We are moving"
