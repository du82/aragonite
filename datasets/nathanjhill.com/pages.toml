["https://nathanjhill.com"]
title = "nathanjhill.com · Can an old Chromebook find a new life in Linux?"
full_description = "Can an old Chromebook find a new life in Linux? One night, with a cold beverage in hand, I skimmed through eBay as I often do, looking for interesting tech or bargains on the cheap. An auction was ending in 30 minutes for a Chromebook that was no longer receiving updates. These are a dime a dozen (see Woot, for example), but I had been hoping to tinker with an old Chromebook to see if I could turn it into a usable Linux laptop on the go. This little portable caught my eye because it had something seemingly rarer in the world of refurbished or end-of-life Chromebooks - a true 1080p screen and decent build quality. I bid the minimum amount, $10. Shipping was more expensive than my lowball bid. I thought nothing more of that fateful click until the morning brought news that I had won. Did I really need a Chromebook? I already had one that I had picked up for cheap years ago for my kids to use for school work and Youtube videos. It still works, I think, but had a poor screen (720p), limited RAM (2 GB), and occasionally flaked out. The keyboard, for instance, decided not to work one day. And then worked again months later. It’s a mystery. While thinking about canceling the bid and trying to weasel my way out of my poor life choices, the truth is that I was committed - committed to this machine (with a dent clearly described in the product information) and committed to this life-altering journey. Could I turn this intriguing, quiet Chromebook into a usable tool in my daily life? Some Caveats First, I like Chromebooks because their build is typically a little lighter and more constrained than clunky Thinkpads. They are also much cheaper since Chromebooks are common tools in many education institutions. Yes, you can spend $300 or more on a Chromebook with a powerful processor, but why? It’s a web browser, functional and very useful in its context, but a mixed bag for programming, video editing, gaming, or layout work. Dell Chromebooks, for instance, can be had for next to nothing, and they always impressed me with their general level of usability, battery life, and compactness. Lots of people would be fine with a Chromebook level of functionality to do typing, browsing, YouTube, email, and so on. My gut is that the most anyone should spend on a Chromebook is $100. If you can, spend even less, like $20. Or free. Second, laptops without fans are simply superior to any laptop with a fan. I’ve used all sorts of portables over the years, from my favorite PowerBook Pismo to the beautiful PowerBook G4 12 inch to awful Dell Inspiron to a work-provided MacBook Air M1. Once you hit that threshold of a highly performant laptop, running in near silence, it’s a beautiful thing, like moving into an apartment surrounded by respectful neighbors. This Chromebook has no fan, like so many others in that market segment. While certainly not the beefiest machine, anemic might be a better word, it works, and it is oh-so quiet. Third, I am an opinionated open-source aficionado. I love the idea of open source more than the experience. As such, I am never satisfied with distros and software packages that make poor choices. Yeah, this is super subjective, I know, but I don’t have time to uninstall a bunch of bloated unusable apps (looking at you, LibreOffice) or click around trying to figure out how to change a desktop wallpaper when a right-click on the desktop is all one should need. Maybe this is shaped by my experience coming from MacOS or Windows, but the default choices should be carefully and thoughtfully done. I don’t find that is true in the vast majority of Linux distros. When working with a resource-constrained system, this hits home harder because I have limited storage space and RAM and don’t have time to go hunting for minor changes to improve performance. Why not be solid and very functional out of the box regardless of your hardware? Why not be stricter about software choices? Introducing the Acer CB3-431 Say hello to the perfect Linux laptop, the Acer CB3-431. As is usually confusing with non-Mac hardware companies, a particular product may have a product description and model, but the individual specs may not match what you find on the maker’s website. My Chromebook Acer CB3-431, Model N16P5, is a 14” laptop with a 1920x1080p screen, Intel Celeron N3160 dual-core processor, 4GB of RAM (ugh), and, even worse, 16GB eMMC internal storage. The screen is the highlight. No, it’s not super high quality but compared to the dime-a-dozen 720p screens on many junk portables, it’s spacious and perfect. A decent webcam is built-in, the keyboard is a little mushy but responsive, and the touchpad is big even if nowhere as good as a MacBook Air (but what is). There are ports for a headphone jack, charger port, two USB 3.0 (I guess), and an HDMI port. Oh, and one of those security ports that no one uses, and I won’t need. Who is going to steal a $24 old Chromebook? What do I like? It has an aluminum casing that feels a step above your typical plastic Dell Chromebook. It sort of echoes the venerable MacBook Air designs, though certainly not as high quality. The battery life appears solid for a used machine. Linux tells me eight hours when fully charged. I could always replace the battery for pretty cheap if needed. The screen is 1080p and matches the 14” size of the portable. The keyboard is fine to type with, and the touchpad is big and centered. (Why do laptop companies sell off-centered touchpads?) Wifi and Bluetooth work. What I don’t like? Its slow-ish CPU is a factor, but the limited amount of RAM and the awful eMMC internal storage are more significant. The RAM is usable, I guess, but 8GB would be a nice boost for a cheap Linux machine like this. I hope to explore the possibilities of removing the internal storage with my limited soldering skills and replacing it with more capacity because 16GB is the hardest spec to work with when trying out various OS options. I wouldn’t mind a microSD card slot as an option. The power charging port wiggles. The corner of the Chromebook is dented near the port, so maybe something’s loose? I removed those dumb stickers that companies put on their laptops. Stop putting stickers on your hardware. Are you trying to cover up something? Overall, for $24.57 (which included shipping), I ended up with a working and capable portable to tinker with as a backup writing machine and open-source exploration station. Making Chromebook Open Of course, Chromebooks come pre-installed with ChromeOS, but once they run out of security updates, the sky is the limit. But you do need to unlock them first so you can write over the bootloader and make it possible to install another OS. Yes, there are options to make Linux coincide with a ChromeOS install, but why bother? If you brick it, you are out $20. To unlock the Acer so I could overwrite its internal storage, I had to remove a screw. This is so weird but also kind of cool. Many of these Chromebook motherboards mark this particular screw with a big arrow, while there may be other laptops that just ask for a certain keyboard combination. If you want to feel like a hacker, remove a write protection screw from a Chromebook while wearing sunglasses. My Distro of Choice Is… Identifying an ideal Linux distro was neither easy nor necessarily fun. Who wants to spend an afternoon downloading ISOs, burning them to a flash drive, and then hoping for the best? There are so many Linux distros out there in the wild right now that it is a maddening and frustrating process to find one that fits for you. There are more well-known entry points, like Ubuntu, PopOS!, or Linux Mint, but even then, as you look through the options and consider your limited storage space and specs, you have to settle for tradeoffs. Searching for “Linux distros” that run well on older hardware isn’t all that helpful either, as folks will offer suggestions like Damn Small Linux or Puppy Linux, which while “light” can be kind of a pain to actually use and feel cobbled together. And to be honest, from my experience, those desktop environments aren’t all that faster than a “heavier” desktop setup. Those more established Linux distros though require 6GB+ space to install their apps, quickly draining that internal storage. The first distro that struck a decent balance was Ultramarine Linux, a modified Budgie desktop built on top of Fedora. It was speedy enough, though I did have to uninstall LibreOffice and several other apps that served no purpose. Unfortunately, Ultramarine Linux has a slow release cycle and I couldn’t upgrade the kernel because the internal storage ran out of space. I like Fedora though. Are there other options I am unaware of? I dabbled with various XFCE-based distros, but they didn’t seem any faster or lighter on resources than Budgie. And of course, they were nowhere as beautiful. I even took a shot at a Fedora spin using LXQt, and again, while the printed requirements are lighter, you end up with a pretty ugly interface that doesn’t add much. And you still need to uninstall a cadre of apps that eat up space. I’m a huge fan of Fedora, so I was disappointed not to find an option that fit the strange niche of this particular portable. Sure, I could download a sort of base install iso and add what I needed via dnf, but I don’t have time for that. And I have a life. Somehow, along the way, I stumbled upon Q4OS, and while giving it a test run, I found exactly what I was looking for. Q4OS is a Debian-based KDE distribution that is performant and flexible. The interface comes packed with a few themes that, while not revolutionary, are familiar and thoughtfully put together. It's geared for all sorts of hardware, but the developers appear to have a soft spot for older machines. The first point in Q4OS’s favor was the nod toward being modern and speedy. KDE is not particularly a light interface but has improved by leaps and bounds in recent years. It’s familiar for folks coming from the Windows world and even the MacOS world. I love the familiarity, saving time when I want to do something trivial like changing desktop wallpaper or switching to a better font. Q4OS meets the tradeoffs I was looking for with excellent-looking and configurable themes that don’t go overboard. The ISO is also not as large as others, weighing in at 1.4 GB. The website suggests about 5 GB of space needed for a complete installation. Perfect. Second, the installer gives you the option to do a full install (everything), a basic install (just a web browser and essentials), or a minimal desktop image. Maybe Fedora and other installs have this and I didn’t see the option. No LibreOffice is a huge plus. Fewer Kapps. No unnecessary chat, social media, image editing, cybercoin apps. Just Firefox. That’s all I need. Third, I have space in internal storage again. If there was a deal breaker, the default approach when formatting the internal eMMC was to create an 8GB swap partition. Why? No one knows. That nearly crippled the machine, so I tried again, selecting swap as a file so I can keep the majority of my space as needed. Of course, this is a problem that I might need to revisit since swap can be crucial when putting your laptop to sleep. Fourth, Q4OS supports Chromebook keyboards (like so many others do). Make sure you choose that option during installation, and all of those fancy special keys work as intended, including volume up and down. Finally, after a 20-minute install, I could begin using my little portable for browsing, writing in Google Docs, watching a Youtube video, or poking around the terminal. How has the experience been? Again, the screen makes it pretty pleasant for browsing and even writing, and the Chromebook is physically light. I can toss it on the couch or leave it on a corner table when needed. While Firefox is my main browser, I also have Konqueror installed (a default but who uses it), LibreWolf (to do some light comparison with Firefox), and Dillo+ (more on that in a minute). I did install Okular in case I need to read a PDF. Minecraft can install and “works”, but the gameplay is super laggy. Removing it saved over 1GB of space. Kate is installed for text editing, but I could hardly say I am a fan. I prefer something like Remarkable, since markdown is a lot of fun. Best of all, no LibreOffice. I have 4GB of space free on the internal storage, which is workable if not perfect. I’d love to tweak that down some more. I’m using 3GB of RAM, so that’s not too bad. No thrashing of the swap yet. In Konsole, I’ve already tinkered with some basic installs of development tools, likely grabbing more of my precious space. For example, I installed Dillo+, a modified branch of the classic Dillo browser that takes “light on the resources” to another level. It has no JavaScript, which is kind of an upgrade over other browsers, but part of my test was just to download the source and install it. After getting the dependencies (g++ and numerous others), the whole process took about five minutes before I had a working browser to tinker with. Could this be a light development machine? I guess. Installing g++ and gcc and whatnot ate some of my precious space, but Minecraft takes its fair share of the blame. The only issue so far is annoying and hard to pin down. Sometimes, when I put the laptop to sleep (close the lid), the Chromebook greets me with a blank screen rather than the lock screen. To work around, I close the screen again, wait one or two seconds, then open it up. This time, the login screen appears. (A feature not a bug?) A few other notes: Disable Bluetooth until you need it, as it can be a significant battery drain when turned on. I haven’t tried the HDMI out yet, but it should work. I am using a 16GB USB thumb drive as a backup. It’s one of those low profile ones that sticks out just a little from the side of the laptop. Don’t forget to install an adblocker to save some precious CPU power, since ads are life destroyers. Some things I would love to see: How cool would it be for Linux distros (like Q4OS) to recognize limited constraints on a system and offer you meaningful options to make use of them. For example, Q4OS should recognize that 4GB of RAM is kind of unusual these days and especially notice limited internal storage space. Maybe there should be an option where you can turn an external USB drive into the install location of new applications and user files. Or turn off unnecessary system components. Other operating systems do this - seems trivial for Linux to offer such quality of life improvements. Firefox is the biggest resource hog, but it’s one of the few options for browsing anymore in the open-source world. I’m not a particular Chrome fan. Wouldn't it be great to have a solid browser that focused on performance for older machines? We can all dream. Conclusion Ultimately, this Chromebook is old but it has life. I leave it in my living room to do writing, browse Hacker-News, and fiddle around with the command l"
