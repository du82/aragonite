title = "nathanjhill.com · litany: a god who sends"
full_description = "litany: a god who sends Note: This litany is intended to be paired with those who have been silenced. The black tape is, again, optional, and the language is flexible. It does mirror each other, so that we enter into lament and then exit into action. (Before each stanza, reader removes black tape before speaking.) Reader Five: God, you created Creation and called it good. Enable us to move from silence into action to care for this Earth. Many: Here I am, Lord. Send me. (Before each stanza, reader removes black tape before speaking.) Reader Four: God, you created humanity and called us good. Challenge us to love each other and see the face of God in the eyes of a stranger, no matter who they are and how you created them. Many: Here I am, Lord. Send me. (Before each stanza, reader removes black tape before speaking.) Reader Three: God, you give abundantly - enough food for the world to eat and be filled. You give us enough, so transform the way we live that we may share this abundance so that no one is poor or without. Many: Here I am, Lord. Send me. (Before each stanza, reader removes black tape before speaking.) Reader Two: God, you come that we might have peace for neighborhoods and for nations. Through love and service, may we mend broken relationships and bend down to bless even those who intend us harm. Many: Here I am, Lord. Send me. (Before each stanza, reader removes black tape before speaking.) Reader One: God, you promise that the deepest night gives way to morning. You gather our tears and our hearts into your care and bless us. Renew us in the hope of resurrection and rest in You. Many: Here I am, Lord. Send me. Clergy: You have heard the good word. Even on this day of silence, God is not silent. God suffers alongside us, and God even now births a New Creation. Let us go to the tomb in expectation for what God is doing in and through us. April 26, 2019 3:46 AM litany Recent posts Can an old Chromebook find a new life in Linux? I'm posting from a Chromebook. Who is the immigrant? School Is Starting Labor Blessing for May Day Welcome to the new blog Dr. King Is Misquoted A Lot A Note about the End Times You are invited We are moving"
