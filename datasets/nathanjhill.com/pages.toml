["https://nathanjhill.com/2022/07/a-prayer-for-survival"]
title = "nathanjhill.com · A Prayer for Survival"
full_description = "A Prayer for Survival O God Who Reigns Over Death O God Who Shows Us How to Live, We honor your sacrifice and your love poured out. We honor the way you show up and lead us even when our lives are a mess. Help us survive, week to week, day to day. Help us survive in a world that is groaning and aching from violence, climate change, division, and inequality. Bless the survivors. Bless those who continue to love. Bless those who share of their lives though they sit with great trauma. And more than help us survive, empower us to witness to your good news - that proclaim freedom for those bound up, new relationships for those who are alone, inclusion for those pushed to the edges, rest and healing for those walking wounded. We ask your healing mercies on those recovering from COVID, …. and for family members recovering from surgery, …. Hold close those who are called to give care, for the worry and exhaustion in their bodies. Remind your church that we have much love to give, though we are changing, though things are difficult. May we ever look to you. We pray this in the name of Jesus, Our Risen One, the Suffering Servant, amen. July 8, 2022 3:59 AM prayer Recent posts Can an old Chromebook find a new life in Linux? I'm posting from a Chromebook. Who is the immigrant? School Is Starting Labor Blessing for May Day Welcome to the new blog Dr. King Is Misquoted A Lot A Note about the End Times You are invited We are moving"
