title = "nathanjhill.com · I'm posting from a Chromebook."
full_description = "I'm posting from a Chromebook. I love Black Friday, not necessarily for the discounts, but to scope out and take stock of all the subscriptions I am tied up with. Yes, I might start a new one (and save a buck), but I am challenged to let go of some ones that are too pricey or can be had for cheaper. A few tools that I use - Craft App is still pretty solid to use for about $44/year. I am still technically a student, so I might be able to get it for free if I asked. But I generally like the glorified note taking and writing app with presentation and media features. Generally. There are simpler options out there. I did sign up for a huge storage tear of iDrive, and it renews at $100. I may not keep it. It's not been completely useful, even for my big backups (like my NAS). Restream is amazing for live streaming. I'm good with it. And yes, I switched over to OMG.LOL for my personal blog from Write.As. I like the philosophy behind Write.As, but they hit some snags in development and things slowed down. OMG.LOL is simple, funny, and constantly adding cool little creative nuggets. Finally, I am typing this on a Chromebook running... LINUX. Wow. I picked up this laptop with 4GB of RAM and a 16GB internal drive (gross) for like $10 on eBay by accident. It works. It has a decent form factor (aluminum not plastic) and a 1080p screen. But Chrome was out, so I turned to various Linux distributions. Simply put, Ultramarine Linux was the best of the bunch. Fedora KDE Spin was pretty decent. But now I have settled on Q4OS, and it has been glorious. Based on Debian, there is an option to install a completely stripped down version of KDE, excluding dumb apps like LibreOffice. I can probably strip it down more, but for now, it works and gets solid performance out of an old Chromebook. I like bargains. Don't ever apologize for liking a good bargain. November 28, 2024 6:46 PM Recent posts Can an old Chromebook find a new life in Linux? I'm posting from a Chromebook. Who is the immigrant? School Is Starting Labor Blessing for May Day Welcome to the new blog Dr. King Is Misquoted A Lot A Note about the End Times You are invited We are moving"
