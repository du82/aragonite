["https://nathanjhill.com/2022/04/closing-prayer-for-easter"]
title = "nathanjhill.com · Closing Prayer for Easter"
full_description = "Closing Prayer for Easter O God of Resurrections, We are surprised this morning. Your goodness catches our breath. You remind us of the beauty and unpredictability of Creation. And You call us by name. We praise You - that nothing stands between us and Your love. We praise You - for overcoming death. We praise You - for calling us to be disciples, to co-create a New Creation with You. On this Easter day, as we rise to joy and celebration, guide our worship. Give us words to speak. Forgive us when we stumble and struggle. Heal us. Help us see and know and believe. And as You call us anew, send us out to usher in resurrection everywhere we go. May Your kingdom come, O Risen One. In the name of the Creator, Son, and Spirit, Amen! April 30, 2022 3:56 AM prayer easter Recent posts Can an old Chromebook find a new life in Linux? I'm posting from a Chromebook. Who is the immigrant? School Is Starting Labor Blessing for May Day Welcome to the new blog Dr. King Is Misquoted A Lot A Note about the End Times You are invited We are moving"
