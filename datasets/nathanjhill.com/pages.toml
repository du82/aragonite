full_description = "Labor Blessing for May Day Today, we cry out! We cry out for an economy that works for all people. We cry out for all work to be recognized with dignity. We cry out for safe working conditions, especially for those who keep our workplaces clean. We cry out to awake those in power who do not value our custodians and janitors. We cry out that hard hearts might break open with love. We cry out that those with the power might come to the table and give us what we are worth. We cry out to God, Creator and Sustainer, who hears the cries of those who suffer and longs for all of us to flourish. And we trust that God’s power is moving in our hands, our feet, and our cries! We cry out! Amen! May 2, 2024 4:15 AM labor prayer Recent posts Can an old Chromebook find a new life in Linux? I'm posting from a Chromebook. Who is the immigrant? School Is Starting Labor Blessing for May Day Welcome to the new blog Dr. King Is Misquoted A Lot A Note about the End Times You are invited We are moving"
