["https://nationthailand.com/blogs/news/policy/40046616"]
title = "‘Petty criminals’ – a single spark that ignited 20 years of violence"
description = "From January 2004 to December 2023, there were 2,296 violent incidents in Deep South"
full_description = '''"There is no separatism, no ideological terrorists, only petty criminals," said then-prime minister Thaksin Shinawatra after the "Pi-Leng Camp Weapons Raid" on January 4, 2004, and the burning of 18 schools. Thaksin was so furious that he reprimanded the military and soldiers for their lack of vigilance, saying, "If you have an entire battalion stationed there but still fail to be cautious, then you deserve to die." From January 2004 to December 2023, there were 2,296 violent incidents in the Deep South, resulting in 7,547 deaths and 14,028 injuries, according to data from the Southern Situation Monitoring Centre as of January 3, 2024. Thaksin was the one who imposed special security laws in the region, which remain in effect. Martial law was enacted on January 5, 2004, followed by the Emergency Decree on July 20, 2004, granting the military authority to detain suspects for interrogation without a warrant for up to seven days, even without flagrant wrongdoing. After the initial seven days, police could extend detention for up to 30 more days under the Emergency Decree. To manage security and development efforts in the region, the Southern Border Provinces Administrative Centre (SBPAC) and the Internal Security Operations Command (ISOC) Region 4 Forward Command were established. Nearly half a trillion baht has been allocated to address the ongoing unrest. The violent suppression of protests under Thaksin's administration marked the beginning of a crackdown-based approach to resolving conflict. The Krue Se Mosque incident in Pattani on April 28, 2004, ended with 108 fatalities, including 30 people killed inside the mosque. Most of the deceased were aged 15-20, armed only with machetes and daggers. The Tak Bai incident, one of the deadliest crackdowns, resulted in more than 85 deaths, most of them caused by suffocation during transport. Detainees were forced to lie face down, stacked on top of one another, in military trucks for three hours as they were transferred from Tak Bai district, Narathiwat, to Ingkhayutthaborihan Camp in Nong Chik district, Pattani. Many suffocated, while others suffered severe injuries, with some left permanently disabled.'''
author = "https://www.facebook.com/TheNationThailand/"
