["https://nationthailand.com/thailand/bangkok/40046889"]
title = "PM2.5 levels rising to unhealthy levels in five districts of Bangkok"
description = "Air quality in rest of the capital at good to moderate levels"
full_description = "The air quality in most of Bangkok’s metropolitan area was in “green” to “yellow” levels, or good to moderate, on Saturday morning, while five districts were in “orange” level, or starting to affect health. The Air Quality Information Centre of the Bangkok Metropolitan Administration (BMA) reported the average PM2.5 levels throughout the city on Saturday at 27.8 micrograms per cubic metre (µg/m³), well under the country’s standard of 37.5 µg/m³ over a three-hour average (5am to 7am). PM2.5 refers to fine particulate matter with a diameter of 2.5 micrometres or less, which can penetrate deep into the lungs and bloodstream, posing health risks such as respiratory and cardiovascular diseases. Major sources of PM2.5 include traffic emissions, factories, forest fires and burning of harvest leftovers. Five districts that reported the highest levels of PM2.5 are Nong Chok (41.2 µg/m³), Bang Na (40.4 µg/m³), Lat Krabang (40.4 µg/m³), Wang Thonglang (38.8 µg/m³), and Bueng Kum (38 µg/m³). The centre advised Bangkokians to wear facemasks, avoid spending time outdoors and work from home if possible. Those who experience symptoms such as coughing, eye irritation or having trouble breathing should see a physician, the centre added. Air quality can be checked daily on the AirBKK application, www.airbkk.com, Line Alert, as well as the Facebook page of the BMA’s Environment Department."
author = "https://www.facebook.com/TheNationThailand/"
