["https://nationthailand.com/blogs/news/policy/40046584"]
title = "Who owns Social Security funds?"
description = "Insured individuals cannot withdraw their own money but discover board is spending extravagantly"
full_description = '''Social Security is a welfare system for workers, born out of people's struggles. However, there are many questions about whether the fund’s purpose still serves the public. These concerns include doubts about transparency in budget management, such as the creation of a 275-million-baht app, and Social Security Board members’ luxurious study trips to Europe. The mandatory insurance for workers in the corporate system, who pay a monthly premium of 750 baht, is meant to share the burdens and provide a safety net for non-government employees. But is this system still fair and just for the labour force? In 2020, during the Covid-19 pandemic, many people suddenly lost their jobs as several businesses closed down. A group called the “Unpaid Beggars" emerged, demanding the return of their own contributions to the Social Security Fund as compensation. Many of them were too old to find new employment but were under 55, which is the minimum age to claim a pension or severance under Social Security. The group made three demands: Right to Choose: Insured individuals should have the right to choose whether, upon reaching the age of 55, they want to receive a pension or a severance payment. Refund: They propose to refund 30% or 50% of the total contributions paid into the Social Security Fund, to be given to insured individuals before they reach retirement age. However, all of these demands were ultimately unsuccessful. All requests were denied, and not a single baht could be refunded from the fund. The relevant authorities only promised to amend the Social Security Act, but to date, there has been no progress. Insured individuals in the Social Security system must contribute up to 750 baht per month (for those earning 15,000 baht or more). Employers match the contributions at the same rate, and the government adds 2.75% of the salary (with a salary ceiling of 15,000 baht). This means that individuals contribute more than 18,000 baht annually (for employees and employers with a salary of 15,000 baht). However, they receive fewer benefits compared with the universal health coverage system (the Gold Card).'''
author = "https://www.facebook.com/TheNationThailand/"
