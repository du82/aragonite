["https://nationthailand.com/news/world/40046886"]
title = "Trump and Zelensky clash, risking Ukraine's position in war with Russia (clip)"
description = "Ukrainian President Volodymyr Zelensky's meeting with Donald Trump ended in disaster on Friday, after the two leaders clashed in an extraordinary exchange before the world's media at the White House over the war with Russia."
full_description = '''Zelensky had sought to use the Oval Office meeting to secure US backing against Russian President Vladimir Putin, who ordered the invasion of Ukraine three years ago. Instead, Trump and Vice President JD Vance criticized Zelensky, accusing him of disrespect and further deepening tensions. A US official said the Ukrainian leader was asked to leave. A proposed US-Ukraine agreement to jointly develop Ukraine’s natural resources, which Kyiv and its European allies hoped would strengthen relations, was left unsigned. European leaders quickly backed Zelensky. German chancellor candidate Friedrich Merz warned, “We must never confuse aggressor and victim in this terrible war.” Zelensky also held calls with French President Emmanuel Macron, NATO Secretary General Mark Rutte, and EU Council President Antonio Costa. Britain is set to host a meeting with Zelensky and European leaders on Sunday to discuss security guarantees for any future peace deal with Moscow. Trump has lurched toward Russia since taking over as president, shocking traditional allies in Europe and beyond and leaving Ukraine increasingly vulnerable. Friday's outburst was the most public display of that shift. The already-tense meeting blew up when Vance stressed the need for diplomacy to resolve the biggest conflict in Europe since World War Two. Zelensky, his arms folded, countered that Putin could not be trusted and noted that Vance had never visited Ukraine. "What kind of diplomacy are you talking about, JD?" Zelensky asked after recounting failed diplomatic efforts with Russia. "I’m talking about the kind of diplomacy that's going to end the destruction of your country," Vance shot back. Zelensky openly challenged Trump over his softer approach toward Putin, urging him to "make no compromises with a killer." Trump, whose team said he and Vance were "standing up for Americans," quickly took to Truth Social after the meeting to accuse Zelensky of disrespecting the United States. "I have determined that President Zelensky is not ready for Peace if America is involved," he wrote, using an alternative spelling of the leader's name. "He can come back when he is ready for Peace."'''
