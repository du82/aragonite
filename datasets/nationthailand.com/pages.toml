title = "นโยบายความเป็นส่วนตัว"
full_description = "This Cookies Policy explains the meaning and usage of Cookies on the website www.nationthailand.com. Please study this policy to understand our practices in collecting, using, and disclosing Cookies as well as our options in Cookies usage. A Cookie is a small text file downloaded onto your computers or mobile telephone devices. Its purpose is to store information and settings for the use of various websites and/or applications such as information on language setting, information on your current access status, information on history of access to your preferred services so that you could use the websites and/or applications of the Nation Thailand (collectively as “Service”) uninterrupted. On this basis, a Cookie does not pose a danger to your computers or mobile telephone devices and the content in the Cookie may only be viewed or read via the Service which created it. 1. Session Cookies are Cookies kept temporarily to remember you during your visit to our website and will expire when you exit or after a set period of inactivity. This kind of Cookies will remember your web browsing history data each time you use the browser and will help maximize the efficiency of the website. 2. Persistent Cookies are Cookies that remember your preference within our website. They are kept in your computer and will be used every time you use the browser. We use these Cookies to help us ‘remember’ you each time you use our website, including remembering your personal interest, so that we can choose to display only the contents that match your interest. A Cookie will inform us which section of websites and/or applications of the Nation Thailand has been accessed by you so that we can offer you better experience with regard to the use of the Service consistently with your needs. In addition, using Cookies to record the initial settings of the Service will allow you to access the Service with the determined settings on every occasion of use except where Cookies are deleted. In the latter case, all the settings will be restored to the default settings."
