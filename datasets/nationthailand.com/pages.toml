["https://nationthailand.com/news/politics/40046927"]
title = "Nida Poll: Public dissatisfied with the performance of government, PM"
description = "Nida Poll reveals the 6-month performance of the 'Government-Paetongtarn,' showing high public dissatisfaction, with 13 ministries reporting high levels of dissatisfaction."
full_description = '''The National Institute of Development Administration (Nida Poll) conducted a survey on public opinion regarding "6 Months of Prime Minister Paetongtarn Shinawatra's Government," held between February 24-26, 2025. The survey was conducted among 1,310 samples, aged 18 and above, from all regions, education levels, professions, and income groups nationwide, regarding the public's satisfaction with the government's performance under Prime Minister Paetongtarn over the past six months. When asked about their satisfaction with the government's performance under Prime Minister Paetongtarn, 34.58% of respondents expressed dissatisfaction. The next group, 32.60%, indicated being somewhat satisfied. 20% stated they were completely dissatisfied, and 12.82% expressed high satisfaction. Regarding public confidence in Prime Minister Paetongtarn's ability to solve the country's problems, 36.41% of respondents said they had low confidence, followed by 26.26% who had no confidence at all, 25.04% who had moderate confidence, and 12.29% who had high confidence. Finally, when asked about public satisfaction with the performance of each ministry over the past six months, the NIDA Poll survey found that seven ministries received high satisfaction ratings: Ministry of Education: 35.04% were somewhat satisfied, 30.08% were dissatisfied, 19.08% were completely dissatisfied, and 12.29% were very satisfied. Ministry of Public Health: 32.45% were somewhat satisfied, 29.16% were dissatisfied, 19.08% were completely dissatisfied, and 17.02% were very satisfied. Ministry of Social Development and Human Security: 32.29% were somewhat satisfied, 29.39% were dissatisfied, 18.70% were completely dissatisfied, and 13.21% were very satisfied. Ministry of Tourism and Sports: 32.14% were somewhat satisfied, 27.25% were dissatisfied, 17.02% were completely dissatisfied, and 15.04% were very satisfied. Ministry of Culture: 31.53% were somewhat satisfied, 29.54% were dissatisfied, 17.94% were completely dissatisfied, and 12.29% were very satisfied.'''
