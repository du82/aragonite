["https://nationthailand.com/blogs/news/general/40046924"]
title = "Vietnam to waive public school tuition fees"
description = "The move marks a significant step in the country's efforts to expand access to education and reduce financial burdens on families."
full_description = "Vietnam's Politburo has announced a decision to fully waive tuition fees for students attending public schools from preschool through high school nationwide, effective September 2025. The move marks a significant step in the country's efforts to expand access to education and reduce financial burdens on families. The Politburo has tasked the Government Party Committee to instruct the Ministry of Education and Training, the Ministry of Finance, and relevant authorities in coordinating the policy implementation. Under Viet Nam's current Education Law, primary school students in public institutions are already exempt from tuition fees. Several localities, including Quang Ninh, Hai Phong, Yen Bai, Quang Nam, Khanh Hoa, Da Nang, Ba Ria - Vung Tau, Binh Duong, Long An, have already waived tuition fees for students. Preschool students, meanwhile, have been entitled to a tuition waiver since September 1, 2024, as stipulated in Government Decree No.81."
