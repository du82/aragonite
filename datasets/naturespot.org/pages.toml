["http://www.naturespot.org/support_naturespot"]
title = "Support for NatureSpot | NatureSpot"
full_description = "NatureSpot is a registered charity and run mainly by volunteers. However we need to raise several thousand pounds each year to pay for web costs, admin, maintenance and new developments. Any help you can give will be much appreciated. There are several ways for you to help NatureSpot: Donate You can make a financial donation using the NatureSpot People's Fundraising page. This fundraising platform is totally secure and they also collect Gift Aid from the Government on our behalf so every £1 you contribute earns £1.33 for the charity. You can choose to give a one-off or regular donation and pay by credit or debit card or by direct debit. If preferred, you can also donate using our Paypal account. Give as you live Similar to the above but covering a multitude of companies - so almost everything you buy online could trigger a donation to NatureSpot, again at no additional cost to you. Companies give a donation to charity of between 1 and 5% of your purchase total. It's easy to sign up and you can download an add-on to your browser to remind you to link your purchase. Visit Give As You Live and choose NatureSpot as the charity to support. eBay donations Do you have any unwanted books, clothing, furniture, camera or electronic equipment, tools, antiques, etc. that you could donate to NatureSpot for us to sell on eBay to raise funds? If you live in Leicestershire we can collect from you. We can even agree to share the income from more valuable items if you want us to sell it for you. Please contact us on info@naturespot.org to make or discuss a gift. Volunteer NatureSpot couldn't operate without a large team of volunteers. There is a wide range of jobs to do and many can be done from your own computer. See our volunteer page for a list of roles needed and get in touch if you would like to help."
