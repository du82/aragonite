title = "County Recorders | NatureSpot"
full_description = "VC55 Leicestershire and Rutland County Recorders Watsonian Vice-county 55 (VC55) is the name of the accepted area for recording wildlife in Leicestershire and Rutland. It roughly follows the current political boundaries of the two counties but isn't exactly the same as over the years these have been modified. Having a standard area where the boundaries never change allows current wildlife records to be compared with those from many years ago. The coordination and overseeing of the records for each wildlife group is the responsibility of a County Recorder or County Co-ordinator. These are volunteers with expert knowledge of that group. All NatureSpot records are shared with the County Recorders/Coordinators and they check the accuracy of the data before adding it to database of all records. Most are happy to help with ID queries. Information supplied by Leicestershire & Rutland Environmental Records Centre (LRERC) Taxon Group Name Status Email Algae Geoffrey Hall Co-ordinator geoffrey.hall@ntlworld.com Amphibians Ben Devine Recorder ben.devine@hotmail.co.uk Badgers Pam Mynott Recorder pamela.mynott@btinternet.com Bats Nathalie Cossa Recorder batrecords@outlook.com Birds Carl Baggott Recorder cdbaggott@gmail.com Bugs - Hemiptera Alan Cann, Kate Nightingale & Sue Timms Joint Co-ordinators alan.cann@gmail.com / suetimms@clara.co.uk / kate.h.nightingale@gmail.com Centipedes Helen Ikin Co-ordinator helen.canids@btinternet.com Coleoptera Graham Finch Co-ordinator finchgraham1@gmail.com Crayfish Jools Partridge Recorder jools.partridge@leics.gov.uk Diptera: Craneflies and allies John Kramer Recorder john.kramer@btinternet.com Diptera: Hoverflies, Soldierflies, Dolichopodidae (Long-legged flies), Conopidae Ray Morris Recorder ray@cactusbob.net Diptera: Stilt and Stalk flies Darwyn Sumner Recorder darwyn.sumner@ntlworld.com Dragonflies & Damselflies - Odonata Ian Merrill Recorder i.merrill@btopenworld.com Fishes Recorder Flowering plants and ferns Geoffrey