["https://naturespot.org/family/acarosporaceae"]
title = "Acarosporaceae | NatureSpot"
full_description = "Toggle navigation Secondary links About NatureSpot About Us Recording with NatureSpot Using the NatureSpot App Do I Need to Register? Become a NatureSpotter Support NatureSpot Volunteers Needed Our partners Data Protection and Terms of Use Image Copyright Annual Report Contact Us Help & Information FAQs Submitting records guide Editing your records Identification difficulty Notifications by email Verification Recording Trees, Wildflowers & Grasses County Recorders Species Lists in VC55 Photo of the Month Species Data Analysis NatureSpot YouTube Channel ID Help Getting identification help Apps for Identification Leicestershire ID Guides Wildlife Groups & Projects Botanical Society of the British Isles - Leicestershire & Rutland Butterfly Conservation, East Midlands Group Hathern Wildlife Group Hinckley Natural History Society Leicester City Flora 1744-2024 Leicester Literary and Philosophical Society - Natural History Section Leicestershire & Rutland Entomological Society Leicestershire & Rutland Mammal Group Leicestershire & Rutland Moth Recorders Leicestershire & Rutland Recorders Conference Leicestershire & Rutland Records Centre Leicestershire & Rutland Swift Partnership Leicestershire Amphibian & Reptile Network Leicestershire Badger Group Leicestershire Fungi Study Group Leicestershire Urban Verge Wildlife Project Leicestershire and Rutland Badger Group Leicestershire and Rutland Bat Group Leicestershire and Rutland Environmental Records Centre Leicestershire and Rutland Mammal Group Leicestershire and Rutland Ornithological Society Leicestershire and Rutland Wildlife Trust Loughborough Naturalists Group Market Bosworth and District Natural History Society Natural History Section, Leicester Literary & Philosophical Society Rutland Natural History Society Shepshed Biodiversity Group Blogs - Leicestershire and Rutland Wildlife Project tagging Events Log in NatureSpot The wildlife and wild places of Leicestershire and Rutland DiscoverIdentifyRecord Main menu Toggle navigation Home Latest images Species galleries Wild places How to Identify Home Lichens Acarosporaceae All images on this website have been taken in Leicestershire and Rutland by NatureSpot members. We welcome new contributions - just register and use the Submit Records form to post your photos. Click on any image below to visit the species page. The RED / AMBER / GREEN dots indicate how easy it is to identify the species - see our Identification Difficulty page for more information. A coloured rating followed by an exclamation mark denotes that different ID difficulties apply to either males and females or to the larvae - see the species page for more detail. Lichens Lichens are hard to classify as they are composite organisms where an algae (or cyanobacteria in some cases) lives within a fungal structure. They are a fascinating group to record as they can be found just about anywhere (trees, stones, walls, pavements, fenceposts, etc.) and are generally most easily seen in winter when there are few plants and insects to be found. If you are not familiar with lichens then the NatureSpot Beginners Guide to Recording Lichens is a useful way to get started as it features 10 of the most common and identifiable lichen species in Leicestershire and Rutland. British Lichen Society - including guides to 20 common lichens. www.britishlichens.co.uk - a comprehensive photo guide with useful categorisation of lichen-types but there is no information about the lichen species included. www.dorsetnature.co.uk/Dorset-lichen.html - a similarly excellent website with high quality images and details about each lichen species. The Field Studies Council produce a series of fold-out lichen guides that are both affordable and useful: Guide to Common Churchyard Lichens Guide to Common Urban Lichens: On Trees and Wood Guide to Common Urban Lichens: On Stones and Soil Guide to Lichens of Heaths and Moors Lichens - An Illustrated Guide (Frank Dobson) is a comprehensive 