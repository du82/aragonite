full_description = "Toggle navigation Secondary links About NatureSpot About Us Recording with NatureSpot Using the NatureSpot App Do I Need to Register? Become a NatureSpotter Support NatureSpot Volunteers Needed Our partners Data Protection and Terms of Use Image Copyright Annual Report Contact Us Help & Information FAQs Submitting records guide Editing your records Identification difficulty Notifications by email Verification Recording Trees, Wildflowers & Grasses County Recorders Species Lists in VC55 Photo of the Month Species Data Analysis NatureSpot YouTube Channel ID Help Getting identification help Apps for Identification Leicestershire ID Guides Wildlife Groups & Projects Botanical Society of the British Isles - Leicestershire & Rutland Butterfly Conservation, East Midlands Group Hathern Wildlife Group Hinckley Natural History Society Leicester City Flora 1744-2024 Leicester Literary and Philosophical Society - Natural History Section Leicestershire & Rutland Entomological Society Leicestershire & Rutland Mammal Group Leicestershire & Rutland Moth Recorders Leicestershire & Rutland Recorders Conference Leicestershire & Rutland Records Centre Leicestershire & Rutland Swift Partnership Leicestershire Amphibian & Reptile Network Leicestershire Badger Group Leicestershire Fungi Study Group Leicestershire Urban Verge Wildlife Project Leicestershire and Rutland Badger Group Leicestershire and Rutland Bat Group Leicestershire and Rutland Environmental Records Centre Leicestershire and Rutland Mammal Group Leicestershire and Rutland Ornithological Society Leicestershire and Rutland Wildlife Trust Loughborough Naturalists Group Market Bosworth and District Natural History Society Natural History Section, Leicester Literary & Philosophical Society Rutland Natural History Society Shepshed Biodiversity Group Blogs - Leicestershire and Rutland Wildlife Project tagging Events Log in NatureSpot The wildlife and wild places of Leicestershire and Rutland DiscoverIdentifyRecord Main menu Toggle navigation Home Latest images Species galleries Wild places How to Identify Home Wildflowers Acanthaceae All images on this website have been taken in Leicestershire and Rutland by NatureSpot members. We welcome new contributions - just register and use the Submit Records form to post your photos. Click on any image below to visit the species page. The RED / AMBER / GREEN dots indicate how easy it is to identify the species - see our Identification Difficulty page for more information. A coloured rating followed by an exclamation mark denotes that different ID difficulties apply to either males and females or to the larvae - see the species page for more detail. Wildflowers 'Wildflowers' is a popular name used by many field-guides to encompass flowering herbaceous species. 'Trees, Shrubs & Climbers', 'Grasses, Sedges & Rushes', 'Ferns & Horsetails', 'Mosses' and 'Liverworts' can be found in separate species Galleries. See our Recording Trees, Wildflowers & Grasses page for useful guidance on what to record. More on recording in Leicestershire and Rutland and contacts for our County Recorders are on the webpage of our local VC55 branch of the BSBI. Clive Stace’s ‘New Flora of the British Isles' - 4th edition (C&M Floristics, 2019) is the standard reference book that NatureSpot uses for verifying records. Leicestershire and Rutland resources VC55 Rare Plant Register (Hall, Woodward) - see this link for details. More on recording in Leicestershire and Rutland is on the webpage of our local VC55 branch of the BSBI, here. Useful websites and publications Facebook Group: Wildflowers of Britain & Ireland British Wild Flowers - an enthusiast's photo site. Comprehensive photo library but only one species at a time. BSBI Plant Identification - lots of resources for helping you to identify that plant! We recommend that you look at the 'Get Started' advice on the BSBI's website, which includes Andrew Branson's useful reviews of some popular field guides. The botanist’s bible is Clive Stace’s ‘New Flora of the British Isles' - 4th edition (C&M Floristics, 2019). Not for the faint-hearted, but it does include keys for the identification of all native, naturalised and crop plants in the British Isles, and is the standard reference book that NatureSpot uses for verifying records. To help identify plants that are not in flower, many botanists use John Poland and Eric Clement's 'The Vegetative Key to the British Flora' - 2nd edition (BSBI, 2020). The BSBI also publish a set of Handbooks on difficult plant groups, with detailed keys, descriptions and line drawings (for example, sedges, umbellifers, willows and poplars, grasses, pondweeds). These are excellent publications. There is also their Plant Crib guidance, with many useful tips for more difficult species. Specific ID resources may be found under each section, family or species in the galleries. If you know of other websites or books that you would recommend, do let us know: info@naturespot.org Acanthaceae Acanthus mollis Bear’s Breeches Search All species/taxa on NatureSpot: 8185 2025 running total No. of records: No. of species: No. of new species added: ? Wild places 20 Acre Piece NR Abbey Park Addah Wood, Clipsham Albert Village Lake, Pick T… Alistair's Wood, Lount Altar Stones Ambion Wood Anstey, Cropston Road Natur… Anstey, North Wood Armley Wood, Hambleton Arnesby Lutterworth Road ve… Arnesby Lutterworth Road ve… Asfordby Hill Ashby Canal, Bosworth Battl… Ashby Canal, Bosworth Rd to… Ashby Canal, Congerstone Ashby Canal, Dadlington to… Ashby Canal, Hinckley Ashby Canal, Hinckley N to… Ashby Canal, Market Boswort… Ashby Canal, Shackerstone Ashby Canal, Shackerstone t… Ashby Canal, Shenton Ashby Canal, Snarestone N t… Ashby Canal, Stoke Golding Ashby Lower Packington Rd v… Ashby Woulds Trail, Conkers… Ashby, Ingles Hill Wood Ashby, Prestop Park woodlan… Ashwell Churchyard Astill Lodge Park Attenborough Arboretum Aylestone Meadows Ayston Churchyard Bagworth Heath 