Record Main menu Toggle navigation Home Latest images Species galleries Wild places How to Identify Leicestershire and Rutland NatureSpotters Wanted! Wildlife is in trouble & effective conservation relies on knowing the status of each species. You can help by logging your wildlife sightings on NatureSpot (website | mobile app). Do I need to register? If you care about wildlife, record it! We need data on all species, common or rare. All records are passed on to local & national bodies & used to further our conservation knowledge. NatureSpot only collects data for Leicestershire & Rutland. If you record elsewhere, please use iRecord. Need identification help? Login <div class="antibot-no-js antibot-message antibot-message-warning">You must have JavaScript enabled to use this form.</div> Username or email address. Password Log in Create new accountReset your password Firethorn Leaf-minerPhyllonorycter leucographellaBarbara Cooper28/02/2025Long Clawson Latest species added to NatureSpot Brick TuftGroby JohnSwithland Wood12 February 2025 Events LRWT Charnwood Forest Wildlife Recording Group Tue, 04/03/2025 - 10:00 Raptors in the Autumn - Orchids in the Spring - some of the Wildlife of the South-West Algarve - Simon Bennett - Leicester Lit and Phil Natural History Section Wed, 05/03/2025 - 19:30 Quaker Meeting House, 16 Queens Road, Leicester LE2 1WP LROS - Pete Smith – Pura Vida, My Wildlife Highlights of Costa Rica Fri, 07/03/2025 - 19:30 St. Anne's Church Hall, Letchworth Road, Leicester LE3 6FN & on Zoom LNC - Raptors in Autumn, Orchids in Spring. Sat, 08/03/2025 - 19:30 George V Hall - behind The Village Hall on Main Street Woodhouse Eaves LE12 8RZ. Hall opens at 7pm. The making of Plant Atlas 2020, from field to folio - Dr Oli Pescott - Leicester Lit and Phil Joint Lecture with the Natural History Section Mon, 10/03/2025 - 19:30 Hansom Hall in the Leicester Adult Education College, 50-54 Belvoir St, Leicester LE1 6QL View all upcoming events Follow us News Photo of