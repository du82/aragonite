["https://naturespot.org/content/leicestershire-rutland-entomological-society"]
title = "Leicestershire & Rutland Entomological Society | NatureSpot"
full_description = '''Leicestershire Entomological Society was established in 1988 with the aim to foster the study and conservation of insects and other invertebrates in and around Leicestershire and Rutland (Watsonian Vice-County 55). In 2022 the Society changed its name to Leicestershire & Rutland Entomological Society (LRES) to reflect our area of operation. Membership Enquiries: LeicestershireRutlandEntSoc@gmail.com Download: LRES Membership Application Form 2024 Programme 2024-25: Meetings are on Thursdays at Kirby Muxloe Free Church, Main Street, Kirby Muxloe LE9 2AN (SK517042) (unless otherwise stated). Guests are welcome to join us at meetings. Map & directions: https://goo.gl/maps/anrvVpY6PqD2. Thursday September 12th 2024, 7.00-9.30pm - Member's Evening Thursday October 17th 2024, 7.00-9.30pm - Ray Morris, "Gall Midges" Thursday November 14th 2024, 7.00-9.30pm – Dave Nicholls, "Sawflies" FRIDAY December 13th, via Zoom - Kevin Rowley, Aquatic Bug Recorder for Northamptonshire, "Aquatic Invertebrates", 7.30pm Thursday January 16th, via Zoom - Martin Harvey, "Soldierflies and allies in Leicestershire and beyond", 7.30pm WEDNESDAY 5th February 2025 7.30pm - "Ants - Ecology and Behaviour", Brian Eversham, Chief Executive, Wildlife Trust for Bedfordshire, Cambridgeshire and Northamptonshire. Joint Meeting with Leicester Literary & Philosophical Society Natural History Section. Quaker Meeting House, 16 Queens Road, Leicester LE2 1WP. Thursday February 20th 2025, 7.00-9.30pm - Alan Cann, "Harvestmen" Thursday March 20th 2025, 7.00-9.30pm - Sue Timms/Kate Nightingale, "VC55 Bug Checklists" Thursday April 24th 2025, 7.00-9.30pm - AGM & Member's Evening Committee 2024: Nicola Bashforth Alan Cann - Secretary Ray Morris - Chair Sue Timms; Steve Woodward - Newsletter Editor Treasurer - Vacant LRES Videos (YouTube): https://www.youtube.com/@LRES-VC55 The following Society Occasional Publications and newsletters can be viewed as pdf files and copies may be saved and dist