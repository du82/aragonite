title = "Bryales | NatureSpot"
full_description = "Toggle navigation Secondary links About NatureSpot About Us Recording with NatureSpot Using the NatureSpot App Do I Need to Register? Become a NatureSpotter Support NatureSpot Volunteers Needed Our partners Data Protection and Terms of Use Image Copyright Annual Report Contact Us Help & Information FAQs Submitting records guide Editing your records Identification difficulty Notifications by email Verification Recording Trees, Wildflowers & Grasses County Recorders Species Lists in VC55 Photo of the Month Species Data Analysis NatureSpot YouTube Channel ID Help Getting identification help Apps for Identification Leicestershire ID Guides Wildlife Groups & Projects Botanical Society of the British Isles - Leicestershire & Rutland Butterfly Conservation, East Midlands Group Hathern Wildlife Group Hinckley Natural History Society Leicester City Flora 1744-2024 Leicester Literary and Philosophical Society - Natural History Section Leicestershire & Rutland Entomological Society Leicestershire & Rutland Mammal Group Leicestershire & Rutland Moth Recorders Leicestershire & Rutland Recorders Conference Leicestershire & Rutland Records Centre Leicestershire & Rutland Swift Partnership Leicestershire Amphibian & Reptile Network Leicestershire Badger Group Leicestershire Fungi Study Group Leicestershire Urban Verge Wildlife Project Leicestershire and Rutland Badger Group Leicestershire and Rutland Bat Group Leicestershire and Rutland Environmental Records Centre Leicestershire and Rutland Mammal Group Leicestershire and Rutland Ornithological Society Leicestershire and Rutland Wildlife Trust Loughborough Naturalists Group Market Bosworth and District Natural History Society Natural History Section, Leicester Literary & Philosophical Society Rutland Natural History Society Shepshed Biodiversity Group Blogs - Leicestershire and Rutland Wildlife Project tagging Events Log in NatureSpot The wildlife and wild places of Leicestershire and Rutland DiscoverIdentifyRecord Main menu Toggle navigation Home Latest images Species galleries Wild places How to Identify Home Mosses Acrocarpous mosses Bryales All images on this website have been taken in Leicestershire and Rutland by NatureSpot members. We welcome new contributions - just register and use the Submit Records form to post your photos. Click on any image below to visit the species page. The RED / AMBER / GREEN dots indicate how easy it is to identify the species - see our Identification Difficulty page for more information. A coloured rating followed by an exclamation mark denotes that different ID difficulties apply to either males and females or to the larvae - see the species page for more detail. Mosses Mosses, liverworts and hornworts are collectvely called Bryophytes. They are small flowerless green plants that reproduce through spores or asexually via gemmae or tubers. Unlike flowering plants, ferns and confider, they have no vascular system (the phloem or xylem vessels of floweing pakltns, ferns, conifers etc.) Instead, water an nutients diffuse directly into their thin tissue. As early colonisers they can be found in virtually all terrestrial habitats. Bare soil, wall tops, tarmac - indeed just about every crevice supports one or more species. As well as being all around us, they are a good option to study in January and February when most other plants and invertebrates are absent. Facebook Group: Bryophytes of Britain and Ireland The British Bryological Society provides some excellent online guidance to help identify mosses and liverworts. The BBS guides to common mosses and liverworts are very useful. Atherton, I., Bosanquet, S. & Lawley, M. (eds.) 2010. Mosses and Liverworts of Britain and Ireland: A Field Guide BBS is an accessible guide for non-specialists and is highly recommended. The BBS are currently planning a second edition. Watson, E.V. (1981) British Mosses and Liverworts (3rd edition) CUP has keys that are more technical, based on cell shape and leaf characteristics that may require microscopic examination, but be aware that since it was published, there have been some changes in taxonomy, and some new species have arrived in the Biritish Isles. Smith, A.J.E (2004) The Moss Flora of Britain and Ireland (2nd edition) CUP is the classic guide to mosses, illustrating all species known to occur in the British Isles and including a comprehensive key - essential for the serious bryologist. To identify some mosses, you may need to look at the microscopic details of the leaves - e.g. the cell shape in different parts of the leaf; whether there is a nerve in the leaf; whether the leaf margin is toothed, etc. For most species, the leaves are just one cell thick, and the shape of cells can be seen at low magnification. The BBS website includes micro-photoographs of the leaves of some species, and the drawings in Watson (ref. above) are very helpful. To begin with you will need to decided if the moss is a Sphagnum, or is acrocarpous or pleurocarpous. See sections below for help with this. Moss specimens will keep for a long time in paper packets (not plastic) once they have dried out. They re-hydrate very quickly once water is added. If you know of other websites or books that you would recommend, do let us know: info@naturespot.org Acrocarpous mosses Acrocarpous mosses have a tufted habit of growth made up of separate upright shoots, which are often simple but may be forked or with a few branches, often forming form dense cushions. In most cases the seta bearing the capsule arises from the tip of the shoot. Bryales Bryum argenteum Silver-moss Bryum argenteum Silver-moss Bryum capillare Capillary Thread-moss Bryum capillare Capillary Thread-moss Male with greenish hairpoints. What looks like anthers in the middle of a flower are the antheridia Bryum dichotomum Bicoloured Bryum Bryum moravicum Syed's Thread-moss Bryum pseudotriquetrum Marsh Bryum Leptobryum pyriforme Golden Thread-moss Mnium hornum Swan's-neck Thyme-moss Mn