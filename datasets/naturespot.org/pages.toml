title = "Leicestershire Amphibian & Reptile Network | NatureSpot"
full_description = "The Leicestershire Amphibian and Reptile Network (LARN) is an informal grouping of people interested in the status and distribution of these two vertebrate groups in Leicestershire and Rutland. The group are kept informed by a newsletter produced on a rather irregular basis – generally twice a year. The aims of the group are to encourage recording of herpetofauna species in the two counties, and to use the data to support conservation initiatives. There is no membership fee, and anyone wishing to join the group should contact the coordinator, Andrew Heaton, email aheaton@ntlworld.com. You can read/download the newsletters from the links below: LARN news - issue 29 - November 2016 LARN news - special 'Ladybird book' issue 28 - August 2016 LARN news - issue 27 - March 2016 LARN news - issue 26 - September 2015 LARN news - issue 25 - February 2015 LARN news - issue 24 - September 2014 LARN news - issue 23 - February 2014 LARN news - issue 22 - September 2013 LARN news - issue 21 - January 2013 LARN news - issue 20 - September 2012 LARN news - issue 19 - March 2012 LARN news - issue 18 - November 2011 LARN news - issue 17 - March 2011 LARN news - issue 16 - May 2010 LARN news - issue 15 - November 2009 LARN news - issue 14 - March 2009 LARN news - issue 13 - February 2008 LARN news - issue 12 - February 2007 LARN news - issue 11 - May 2006 LARN news - issue 10 - September 2005 LARN news - issue 9 - December 2004 (scanned copy) LARN news - issue 8 - March 2004 (scanned copy) LARN news - issue 7 - March 2003 (scanned copy) LARN news - issue 6 - January 2002 (scanned copy) LARN news - issue 5 - March 2001 (scanned copy) LARN news - issue 4 - November 2000 (scanned copy) LARN news - issue 3 - February 2000 (scanned copy) LARN news - issue 2 - October 1999 (scanned copy) LARN news - issue 1 - January 1999 (scanned copy)"
