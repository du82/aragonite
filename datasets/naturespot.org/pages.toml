["https://naturespot.org/content/leicestershire-rutland-records-centre"]
title = "Leicestershire & Rutland Environmental Records Centre | NatureSpot"
full_description = "The LRERC is part of Leicestershire County Council. It coordinates wildlife recording across the two counties and supports the work of the specialist County Recorders. The County Recorders are volunteers who collect and coordinate records for specific taxonomic groups in Leicestershire and Rutland. They usually possess the greatest expertise in their respective group. All records collected by NatureSpot are made available to both the LRERC and the County Recorders. The biological data at LRERC is managed by Kirsty Gamble. Enquiries to: Kirsty.Gamble@leics.gov.uk"
