full_description = "Toggle navigation Secondary links About NatureSpot About Us Recording with NatureSpot Using the NatureSpot App Do I Need to Register? Become a NatureSpotter Support NatureSpot Volunteers Needed Our partners Data Protection and Terms of Use Image Copyright Annual Report Contact Us Help & Information FAQs Submitting records guide Editing your records Identification difficulty Notifications by email Verification Recording Trees, Wildflowers & Grasses County Recorders Species Lists in VC55 Photo of the Month Species Data Analysis NatureSpot YouTube Channel ID Help Getting identification help Apps for Identification Leicestershire ID Guides Wildlife Groups & Projects Botanical Society of the British Isles - Leicestershire & Rutland Butterfly Conservation, East Midlands Group Hathern Wildlife Group Hinckley Natural History Society Leicester City Flora 1744-2024 Leicester Literary and Philosophical Society - Natural History Section Leicestershire & Rutland Entomological Society Leicestershire & Rutland Mammal Group Leicestershire & Rutland Moth Recorders Leicestershire & Rutland Recorders Conference Leicestershire & Rutland Records Centre Leicestershire & Rutland Swift Partnership Leicestershire Amphibian & Reptile Network Leicestershire Badger Group Leicestershire Fungi Study Group Leicestershire Urban Verge Wildlife Project Leicestershire and Rutland Badger Group Leicestershire and Rutland Bat Group Leicestershire and Rutland Environmental Records Centre Leicestershire and Rutland Mammal Group Leicestershire and Rutland Ornithological Society Leicestershire and Rutland Wildlife Trust Loughborough Naturalists Group Market Bosworth and District Natural History Society Natural History Section, Leicester Literary & Philosophical Society Rutland Natural History Society Shepshed Biodiversity Group Blogs - Leicestershire and Rutland Wildlife Project tagging Events Log in NatureSpot The wildlife and wild places of Leicestershire and Rutland DiscoverIdentifyRecord Main menu Toggle navigation Home Latest images Species galleries Wild places How to Identify Home Birds Accipitridae - Hawks, Eagles All images on this website have been taken in Leicestershire and Rutland by NatureSpot members. We welcome new contributions - just register and use the Submit Records form to post your photos. Click on any image below to visit the species page. The RED / AMBER / GREEN dots indicate how easy it is to identify the species - see our Identification Difficulty page for more information. A coloured rating followed by an exclamation mark denotes that different ID difficulties apply to either males and females or to the larvae - see the species page for more detail. Birds Birds are the most recorded group and the starting point for most people interested in wildlife. There are 616 species of bird currently listed as British wild species and 316 are listed on the Leicestershire and Rutland checklist, excluding a further 15 species likely to be escapees. 120 species are known to have bred in the two counties. The range and abundance of species changes over time and whilst some have become very rare others, such as Buzzard, Red Kite and Little Egret are now regular sightings. A few species have been recorded in VC55 that are not included in the British Ornithologists' Checklist and these are labelled as EXOTIC. Most are likely escapes from collections and domestic stock; there is no evidence of these species breeding in the wild. Leicestershire and Rutland resources Leicestershire & Rutland Ornithological Society offers an excellent local website with up to date news on what birds are around at the moment and also has a guide to good local birding sites. Facebook Group: LROS Checklist of birds for Leicestershire and Rutland Other useful websites and publications RSPB - comprehensive guide to British birds. Also, try out their Bird Identifier tool. Collins Bird Guide - for Britain and Europe. It is available in softback, hardback and large format. Britain's Birds: An Identification Guide to the Birds of Great Britain and Ireland (WILDGuides of Britain & Europe, 34) Collins Field Guide: Bird Songs and Calls of Britain and Northern Europe (Contains 2 accompanying CDs) - useful reference guide to bird sounds. Accipitridae - Hawks, Eagles Buteo buteo Buzzard Buteo buteo Buzzard Accipiter nisus Sparrowhawk male Accipiter nisus Sparrowhawk female Circus aeruginosus Marsh Harrier Milvus milvus Red Kite Search All species/taxa on NatureSpot: 8185 2025 running total No. of records: No. of species: No. of new species added: ? Wild places 20 Acre Piece NR Abbey Park Addah Wood, Clipsham Albert Village Lake, Pick T… Alistair's Wood, Lount Altar Stones Ambion Wood Anstey, Cropston Road Natur… Anstey, North Wood Armley Wood, Hambleton Arnesby Lutterworth Road ve… Arnesby Lutterworth Road ve… Asfordby Hill Ashby Canal, Bosworth Battl… Ashby Canal, Bosworth Rd to… Ashby Canal, Congerstone Ashby Canal, Dadlington to… Ashby Canal, Hinckley Ashby Canal, Hinckley N to… Ashby Canal, Market Boswort… Ashby Canal, Shackerstone Ashby Canal, Shackerstone t… Ashby Canal, Shenton Ashby Canal, Snarestone N t… Ashby Canal, Stoke Golding Ashby Lower Packington Rd v… Ashby Woulds Trail, Conkers… Ashby, Ingles Hill Wood Ashby, Prestop Park woodlan… Ashwell Churchyard Astill Lodge Park Attenborough Arboretum Aylestone Meadows Ayston Churchyard Bagworth Heath Woods Bagworth Wood Bardon Hill Barkby Beeby Road Verge Barkby Queniborough Rd verg… Barkestone Middle Street ve… Barkestone Middle Street ve… Barnsdale Wood Barrow Cotes Road verge Barrowden Back Road Verge Barrowden Church Lane Road… Barrowden Luffenham Road Ve… Barrowden Seaton Road Verge Barwell Stapleton Lane verg… Battram Turn North, Ellisto… Battram Woods Beacon Hill Country Park Belgrave Hall Gardens Bennion Pools Fishing Lakes… Bidwell Lane Road Verge, Cl… Billa Barra, Markfield Billesdon Woodland Pool Bisbrooke Churchyard Bisbrooke Road Verge Blaby Cemetery Blaby Oaks Bla