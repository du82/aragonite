["http://www.naturespot.org/content/leicestershire-and-rutland-mammal-group"]
title = "Leicestershire and Rutland Mammal Group | NatureSpot"
full_description = "The Leicestershire and Rutland Mammal Group aims to promote interest in local mammals, and to encourage more recording of these animals. We would like people to send in records of any mammals they see, or that they identify by one or more of their field signs. We are particularly interested in anyone who wants to join in a local project, or to lead on one of their own, to help our understanding of these often elusive creatures. Water Vole Project 2024 Water Voles are one of our most threatened species in danger of becoming extinct in the next 10 years. We are running training events with the help of Leicestershire & Rutland Wildlife Trust, East Mercia Rivers Trust and others to train volunteers to search for signs to help us find out if they are present or absent and what we can do to help them by managing and connecting habitats and reducing the risk of predation. If you would like to help get involved in surveying sites please contact the Group at landrmammals@gmail.com for more details. Where to find mammals Whilst many mammals are common they are often hard to see, though signs of their presence are all around us. It is perfectly acceptable to record mammals from their tracks and signs providing you can identify the species. Mole hills, droppings, hair, footprints, etc., are all useful evidence that can often be identified to a specific species. We will provide and update guides on how to help identify one field sign from another as well as verify any records sent in when needed. Records based on road kill sightings are also acceptable. The mammals gallery on NatureSpot includes images of many species and their field signs which is growing all the time as we spot more. All have been taken in Leicestershire or Rutland so there is a good chance of finding these species or their field signs too. What mammals to record We are interested in records of ALL mammals found in Leicestershire and Rutland (VC55) - both common and rare, whether from your garden, your local park, place or work, regular walking route or from a nature reserve. You don't need to have a photo to accompany your record for common species, but when recording those species that are less easy to identify, or if using field signs only, it may be helpful to add an image as it can help us to verify that your records are correct. Please see the guidance where this is required for certain species of mammals. Records submitted for uncommon species may also require a few notes to explain the key features that enabled you to identify the species. Where to send mammal records The easiest way to submit your wildlife records (for mammals and all other animals and plants) is to use the online recording form on NatureSpot. All submitted records are passed on to the local recording schemes for you. Just visit the Submit Records form and follow the simple instructions. A short video guide is available if needed. If you haven't got access to a computer then you can submit paper records to the Group. Request one from the Mammal Group from the contact email address shown below. Mammal tracks and signs Most mammals are difficult to see due to being nocturnal, secretive or small. However with a bit of detective work you can find signs of their presence and this is usually sufficient evidence to record them. Contact details LandRmammals@gmail.com Trail cameras Here are a selection of mammal videos caught on trail cameras on various Leicestershire & Rutland Wildlife Trust Nature Reserves. This is an excellent way of finding out what mammals are in your garden too, but please note that you should ask permission of any land owner before you use any recording equipment. Badger - https://www.youtube.com/watch?v=6n4pyZHYyZU Fox - https://www.youtube.com/watch?v=Xj-_cfhK7aw Hares - https://www.youtube.com/watch?v=3VbKgztLCSk Squirrel - https://www.youtube.com/watch?v=jPJBB_3FcY0 Muntjac - https://www.youtube.com/watch?v=LfbeX9aD4H8 National schemes you can get involved in As well as getting involved with projects run by the Leicestershire & Rutland Mammal Group you can find out about other national projects and recording at the websites below The Mammal Society; Bat Conservation Trust's - National Bat Monitoring Programme; People's Trust for Endangered Species PTES Links to Leicestershire & Rutland mammal groups (specific mammal genus/species) The Leicestershire & Rutland Badger Group: Like us on Facebook and Insta Look for - Leics.RutlandMammalGroup Leics&RutlandMammalGroup"
year_published = 2025
clearnet = "http://www.naturespot.org/content/leicestershire-and-rutland-mammal-group"
