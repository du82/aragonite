cord Main menu Toggle navigation Home Latest images Species galleries Wild places How to Identify Home Bugs Shieldbugs and allies (Heteroptera) Acanthosomatidae All images on this website have been taken in Leicestershire and Rutland by NatureSpot members. We welcome new contributions - just register and use the Submit Records form to post your photos. Click on any image below to visit the species page. The RED / AMBER / GREEN dots indicate how easy it is to identify the species - see our Identification Difficulty page for more information. A coloured rating followed by an exclamation mark denotes that different ID difficulties apply to either males and females or to the larvae - see the species page for more detail. Bugs Insects in the order Hemiptera are the 'true bugs'. They are unique amongst insects in having their mouthparts formed into a piercing beak or 'rostrum', used to suck juices from plants or other animals. Their life cycles do not have a larval and pupal stage; instead, juvenile bugs have a series of nymph-stages or 'instars', which progressively have more adult-like characteristics. Hemiptera are divided into distinct sub-orders: Heteroptera include the shield-bugs, plant bugs, ground bugs, water bugs and allied families. These have a thickened and opaque basal part to their forewings, with a transparent outer part. Auchenorrhyncha are the leafhoppers, planthoppers, cicadas and allies. Some authorities divide this into two separate sub-orders: Cicadamorpha and Fulgoromorpha. Many have enlarged back legs and can jump. Sternorrhyncha are aphids, psyllids and allies. Leicestershire and Rutland resources LESOPS 27 - A Two Year Study of Water Bugs at Priory Water, Leicestershire - Tony Cook, Frank Clark Other useful websites and publications Facebook Group: UK Hemiptera The British Bugs web site is one of the best of all online wildlife guides. If you are unsure which part of the insect the description refers to, see https://www.britishbugs.org.uk/bug_bits.html Facebook group for Aphids, Psyllids, Scales & allies (Hemiptera, Sternorrhyncha) UK Shield Bugs Yahoo Forum - it is free to join then you can access the photo library and ask for identification help. Identifying common British aphids - very useful photo guide with excellent ID information. Video: Introduction to UK True Bugs from The Tanyptera Project. LRES video: Water bugs and their allies Aquatic Heteroptera Recording Scheme website: https://aquaticbugs.com If you know of other websites or books that you would recommend, do let us know: info@naturespot.org Shieldbugs and allies (Heteroptera) This grouping comprises several families of shield-bugs (Pentatomoidea), Coreidae and Rhopalidae, plus a few other families that have not been recorded in Leicestershire and Rutland. They are predominantly insects of warner climates and are at the northern edge of their range in the UK. Several British species are only found in the south and east of Britain. However, species are spreading northwards, probably due to climate changes, and its is expected that new species to VC55 will arrive. They are covered by the Terrestrial Heteroptera Recording Scheme (Shield-bugs and allies) for Britain and Ireland – contact Tristan Bantock at records@britishbugs.org.uk. The name shield-bug comes from the large scutellum that covers most or all of the wings, which is often shield-shaped. They are sometimes called stink-bugs due to release of a pungent fluid when handled. In the adult, wings are held flat to the body, covered in the basal half by the triangular scutellum and the hardened forewings, called the ‘corium’. Many are large and strikingly marked, sometimes with a metallic sheen, but there are several small brown or black ground-dwelling species which are often overlooked. Some species are predatory, eating caterpillars and other insects. Other eat plant sap and are associated with trees. The nymphs of some species are brightly coloured in red, green or black, and some species have different colour-forms. There are usually 5 instars, with the thorax of the later instars showing the development of the adult wings. Nymphs can be difficult to identify, and some have a higher 'Red-Amber-Green' (RAG) rating than the adults. This is shown by a triangular warning symbol after the RAG camera symbol. Click on the image to find out more. Coreidae include the very common Dock Bug and the leather-bugs (known as ‘squash-bugs’ in the USA). Most are brownish in colour. Rhopalid bugs show a wide range of forms and colouring, including the common red and black Cinnamon bug, which has had a recent dramatic expansion of its range. Acanthosomatidae Acanthosoma haemorrhoidale Hawthorn Shieldbug late instar Acanthosoma haemorrhoidale Hawthorn Shieldbug Cyphostethus tristriatus Juniper Shieldbug Cyphostethus tristriatus Juniper Shieldbug Elasmostethus interstinctus Birch Shieldbug Elasmostethus interstinctus Birch Shieldbug nymph Elasmucha grisea Parent Bug Elasmucha grisea Parent Bug female with newly hatched young Elasmucha grisea Parent Bug final instar nymphs on Birch Search All species/taxa on NatureSpot: 8185 2025 running total No. of records: No. of species: No. of new species added: ? Wild places 20 Acre Piece NR Abbey Park Addah Wood, Clipsham Albert Village Lake, Pick T… Alistair's Wood, Lount Altar Stones Ambion Wood Anstey, Cropston Road Natur… Anstey, North Wood Armley Wood, Hambleton Arnesby Lutterworth Road ve… Arnesby Lutterworth Road ve… Asfordby Hill Ashby Canal, Bosworth Battl… Ashby Canal, Bosworth Rd to… Ashby Canal, Congerstone Ashby Canal, Dadlington to… Ashby Canal, Hinckley Ashby Canal, Hinckley N to… Ashby Canal, Market Boswort… Ashby Canal, Shackerstone Ashby Canal, Shackerstone t… Ashby Canal, Shenton Ashby Canal, Snarestone N t… Ashby Canal, Stoke Golding Ashby Lower Packington Rd v… Ashby Woulds Trail, Conkers… Ashby, Ingles Hill Wood Ashby, Prestop Park woodlan… Ashwell Churchyard Astill Lodge Park Attenborough Arboretum Aylest