["http://www.naturespot.org/content/market-bosworth-district-natural-history-society"]
title = "Market Bosworth & District Natural History Society | NatureSpot"
full_description = "​ About us The Market Bosworth & District Natural History Society is a group of very active local natural history enthusiasts. The Society enjoys a comprehensive programme of both indoor and outdoor meetings. In addition the Society also monitors a wildflower meadow on Bosworth Park. The Society was formed in January 1976 by twenty two local natural history enthusiasts. During the inaugural meeting it was agreed that the aims of the Society should be:- • To cover every aspect of natural history, and cater for all interests. • To hold monthly indoor meetings, and outdoor meetings wherever possible. • To make detailed investigations, with records, of particular sites. During the intervening years the Society has held closely to these aims and has grown to a current membership of around seventy. Read more about our trips and activities Contact us Telephone: 01455 824148 Email: jncrowley@btinternet.com Indoor Meetings 2025 Details of the 2025 indoor meetings are given below. Visitors are always welcome. Meetings start at 7:30pm and will be held at St Peter's School, Station Road, Market Bosworth, CV13 0NP. Confirmation of the meeting details will be emailed to members shortly before the meeting. Visitors are asked to contact Prue Crowley (jncrowley@btinternet.com) to arrange for details to be sent to you. For indoor meetings there is no charge for members (but there is an annual membership fee). Visitors are invited to make a donation, suggested amount £3.00. Tuesday January 21st AGM and Members Evening. Come and join us for a review of last year's meetings and outings and then enjoy a quiz and buffet. © Peter Sykes Tuesday February 25th - The Eyes Have It - vision and eye-mimicry in the animal kingdom. Dave Robinson Among his wildlife interests, Dave is a keen bird and moth recorder. His science background has led him to explore how birds and moths have a second pair of “eyes” that they use to deter predators. Tuesday March 18th Birds of SW Leicestershire Carl Baggott Carl has so much knowledge of our local birds, come and find out about some of the familiar and less familiar birds seen on our patch. Tuesday April 8th Owl pellets Derek Crawley Pellets of birds are fascinating and reveal a wealth of information about diet and therefore the lives of the creatures that regurgitate them. Tuesday May 20th Flowers of the Italian Dolomites Nick Crowley These mountains are composed of a distinctive type of limestone and have a beautiful flora. As the snow melts alpines that may have a short life are revealed while lower down traditional hay meadows abound. Tuesday September 16th Rewilding the garden Judith Boston Judith opens her garden as part of the National Gardens Scheme so not only knows how to garden conventionally but has also successfully combined this with gardening for nature. Come and learn how she has attracted an exciting list of birds and other wildlife to her garden. Tuesday October 14th. Wild Mull David Alesbrook David visits Mull a number of times each year and he has amassed great experience and wonderful photographs of its wonderful wildlife. Tuesday November 18th. Britain's rivers in crisis Jack Perks Jack Perks talked to the society in the early days of his career. He has since appeared on our screens in many nature programmes, often under the surface of our rivers! Tuesday January 20th 2026. AGM and Members Evening A review of 2025. Outings 2025 All dates are provisional, the final details of each outing will be announced at the preceding indoor meeting, and emailed to members before the outing. Visitors are always welcome. Saturday February 15th Middleton Lakes Saturday March 22nd Cossington Saturday April 12th Swithland Woods Saturday May 17th Moths and brunch June 21st Insect survey Charity Fields July (date tbc) Bagworth Heath August (date tbc) Saffron Brook / Aylestone Meadows Saturday September 20th Rutland Water October (date tbc) Fungi Foray Saturday November 22nd Urban walk Indoor Meetings 2021 During the Covid restrictions, our meeting were delivered via Zoom and recorded. You are welcome to watch them using the links below. Tuesday January 19th: AGM and talk, The North Coast - a Botanical Odyssey Ian Evans MBE A short AGM, followed by a fascinating introduction to the botany of Cape Wrath to the Caithness border, from the Society’s very first speaker. Catch up on the talk by clicking on the picture below. Tuesday February 23rd: The Spiti Valley & the search for Snow Leopards Janet Lancaster A remote Himalayan valley, including a search for Snow Leopards. Catch up on the talk by clicking on the picture below. Tuesday March 16th: Beacon Hill James Lovatt Beacon Hill’s past, present and future. Catch up on the talk by clicking on the picture below. Tuesday April 20th: The Great Fen: not just 20 years old Henry Stanier The latest news of a 50-year project to create a huge wetland area between Peterborough and Huntingdon. Tuesday May 18th: Northern Spain & Southern Morocco Nick Crowley An entertaining insight into the scenery and natural history of two wild areas of Europe. Catch up on the talk by clicking on the picture below. Tuesday September 21st: Fascinating Fungi Ben Devine An enthusiastic introduction to fungi by a Senior Nature Conservation Officer of the Leicester City Council. Catch up on the talk by clicking on the picture below. Note: This recording was made at an earlier event. Tuesday October 12th: The Allerton Project Dr. Alastair Leake How to combine productive farming with wildlife conservation. Catch up on the talk by clicking on the picture below. Tuesday November 16th: Leics & Rutland Swift Partnership Peter Williams Aiding the conservation of Swifts in Leics & Rutland. Catch up on the talk by clicking on the picture below. Tuesday January 18th 2022: AGM & Talk, The Wonderful World of Spiders Alan Cann A short AGM followed by a fascinating introduction to spiders, a much misunderstood species. Catch up on the talk by clicking on the picture below. < Indoor Meetings 2020 Tuesday November 24th: Yellowstone in the Fall (and Grand Teton) Nick Crowley The scenery, geology and especially the wildlife of this well-known National Park. Catch up on the talk by clicking on the picture below. Tuesday December 8th​: The North Yorkshire Turtle Dove Project Richard Baines The story of an award-winning project to help European Turtle Doves in North Yorkshire, set up and led by Richard Baines. © Richard Bennett Catch up on the talk by clicking on the picture below."
