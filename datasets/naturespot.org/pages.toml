["https://naturespot.org/content/partnership"]
title = "Partnership | NatureSpot"
full_description = "NatureSpot is a registered charity (1138852) and works in partnership with other organisations concerned with the conservation of biodiversity in Leicestershire and Rutland. These include: Leicestershire County Council Leicestershire County Council supports NatureSpot and this website as a valuable way of sharing local biodiversity information. The County Council's Historic and Natural Environment Team runs the County's local environment records centre based at Holly Hayes. NatureSpot's work will enable new wildlife information to be added to our databases which will support the local Recorders' network and help to make sure local planning decisions take the best local information about biodiversity into account. The County Council also manages a number of Country Parks, many of which provide important habitats for wildlife. Leicester City Council The City Council manages a large number of parks and green open spaces in Leicester, some of which are designated as Local Nature Reserves. Leicestershire and Rutland Wildlife Trust The LRWT nature conservation work is wide-ranging, including nature reserve management, provision of advice to Local Wildlife Site owners and managers, promotion of habitat networks (Living Landscapes), commenting on planning applications and local authority plans, advocacy, surveys and advice on protected species, general surveys, and (not least) involving people in all this."
