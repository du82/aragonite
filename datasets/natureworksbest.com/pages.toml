full_description = "FAQ Regarding My Treatment Of Cancer May 8, 2013 by Dr. Colleen Huber 0 Comments How do you treat cancer? I am a primary care physician, a Naturopathic Medical Doctor. I use natural treatments for cancer and other diseases. That is I use no chemotherapy, radiation or surgery. However, I do work with oncologists, the formal name for doctors who are cancer specialists. How do you work with oncologists? There […] Posted in:CancerUncategorized More 5 Things You Can Do To Improve Your Health March 26, 2013 by Dr. Colleen Huber 0 Comments 5 Simple Things You Can Do To Improve Your Health Externalize stress. Internalize joy. Eat foods in their raw, natural state. Get sunshine every week. Exercise. Externalize Stress This is the hardest of the five on this list, but essential to maintaining good health. In stressful situations, adrenalin, which is now known as epinephrine, is […] Posted in:CancerUncategorized More Low Thyroid: High Incidence In The U.S. February 23, 2013 by Dr. Colleen Huber 0 Comments Low Thyroid The thyroid gland, one of the most unremarkable features of our anatomy, not even large enough usually to make a bulge at the front of the neck where it resides, is actually quite important to good health and well-being. People with severe hypothyroidism, the clinical term for low thyroid function, have rather obvious […] Posted in:CancerUncategorized More Sports Nutrition Basics January 16, 2013 by Dr. Colleen Huber 0 Comments Sports Nutrition Basics This is the first in a series of articles on nutrition for special needs. The following is from a talk I recently gave at Whole Foods in Tempe Arizona to runners getting ready for a marathon. I reprint it here, because the principles below apply equally to all sports participants, even if […] Posted in:CancerUncategorized More Herb Of The Month: Tea Tree (Melaleuca Alternifolia) April 23, 2010 by Dr. Colleen Huber 0 Comments Herb Of The Month: Tea Tree (Melaleuca Alternifolia) Tea tree oil is a very popular product in health food stores, very handy for its anti-fungal and anti-bacterial effect, while being safe for topical use. Sometimes athlete’s foot and toenail fungus will respond better to repeated applications of tea tree oil than with any other application. […] Posted in:CancerUncategorized More"
