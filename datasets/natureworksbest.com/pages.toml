full_description = "aside Stevia Over Other Sweeteners August 25, 2023 by NatureWorksBest Comments are off Why have we recommended stevia over other sweeteners? Stevia plant with stevia powder Monkfruit has been shown to lower glucose levels, but it seems to do this by raising insulin, and it was found to do so in a dose-dependent manner. https://www.journalofdairyscience.org/article/S0022-0302(20)30130-2/fulltext Stevia was found to do the opposite: “Consumption of stevia in preloads significantly lowered postprandial insulin levels compared to both aspartame and sucrose, as well as postprandial glucose levels compared to sucrose.” https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2900484/ In the latter study, the participants “reported similar levels of satiety” for each sweetener tested. The problem with raising insulin is that it is insulin that delivers sugar to the cells, including to cancer. When sugar is consumed, and then enters the blood, the β-cells of the pancreas release insulin. This insulin travels throughout the body to promote the entry and storage of glucose in cells all over the body. Cancer takes so much more glucose than normal cells that you can actually see the rough outline of how much more on a PET scan. In a PET scan, radioactive glucose is injected into the body, and it goes to the cancer with such strong affinity, and then is picked up by the camera of the PET scan that you see nearly black-and-white differences showing where the sugar goes. The bright spots in the following image show cancerous tumors, where sugar was taken up avidly in the liver. In stark contrast, the surrounding red areas are normal tissue. It was sugar, delivered by insulin, that found the difference between the two types of tissue in the following photograph. PET / CT scan. Eur. J. Nucl. Med. Mol. Imaging 45 1742 Insulin is the main body chemical that puts that sugar into the cancer cells, giving cancer the main fuel that it needs to thrive. Therefore, the only sweetener we have recommended over the years is stevia. The results of this sweetener recommendation, plus the other treatments at our clinic, have been unsurpassed by any other clinic to our knowledge. See our documented results at https://natureworksbest.com/cancer-treatment-results/ Facebook Twitter Google+ Pinterest Posted in:Cancer See more Prev:Dr. Colleen Huber, Cancer & Biochemistry 32 Back: All Posts Next:Breast Cancer & Exercise: A Novel Theory"
