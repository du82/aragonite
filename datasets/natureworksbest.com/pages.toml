full_description = "Herb Of The Month: Wild Marjoram April 3, 2008 by Dr. Colleen Huber 0 Comments Wild Marjoram (Origanum vulgare) Herb of the month April 2008 Herb of the Month: Wild Marjoram (Origanum vulgare) Wild Marjoram (Origanum vulgare) has been used since ancient times as a remedy for poisonings with narcotics. One of the features of this plant that enables such a detoxification is that it is a “diaphoretic” which means that it will cause sweating. It is also a carminative, which is used for control of gassiness in the gut. And it is mildly stimulant, although not nearly so strongly as coffee or black tea (Camellia sinensis). Marjoram has been used to return menses to a woman who has stopped menstruating, and it is has been used as a poultice to relieve toothache. Tension headache responds to a tea made from the fresh leaves of marjoram, in which the volatile oils are released. Learn about how we use different natural methods to treat cancer at NatureWorksBest. Facebook Twitter Google+ Pinterest Posted in:CancerUncategorized See more Prev:101 Great Ways To Improve Your Health Back: All Posts Next:Pharmaceuticals In The Drinking Water About the Author Dr. Colleen Huber Dr. Colleen Huber founded the NatureWorksBest Clinic, and now is currently on sabbatical from practicing medicine, while writing books and articles, and staying involved with the clinic. Dr. Huber has served as President of the Naturopathic Cancer Society and co-founded the American Naturopathic Research Institute / Naturopathic Oncology Research Institute. At NatureWorksBest Clinic, the data supporting the clinic’s results in cancer treatment can be found here. Dr. Huber was the principal keynote speaker at the 2015 Euro Cancer Summit, and in 2014 was a speaker at the World Congress on Cancer Science and Therapy, and at the International Congress of Naturopathic Medicine. Many of her health articles have appeared on colleenhuber.substack.com. Her writing includes her book Choose Your Foods Like Your Life Depends On Them, Manifesto for a Cancer Patient, and other books and articles. Dr. Huber authored the largest and longest study in medical history on sugar intake in cancer patients, which was reported in thousands of media outlets around the world in 2014. Her academic writing has appeared in The Lancet and Cancer Strategies Journal, and other medical journals. Leave a ReplyYou must be logged in to post a comment."
