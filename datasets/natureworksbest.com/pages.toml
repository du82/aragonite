title = "Nature Works Best"
description = "Dr. Colleen Huber founded the NatureWorksBest Clinic, and now is currently on sabbatical from practicing medicine, while writing books and articles, and staying involved with the clinic. Dr. Huber has served as President of the Naturopathic Cancer Society and co-founded the American Naturopathic Research Institute / Naturopathic Oncology Research Institute. At NatureWorksBest Clinic, the data supporting the clinic’s results in cancer treatment can be found here. Dr. Huber was the principal keynote speaker at the 2015 Euro Cancer Summit, and in 2014 was a speaker at the World Congress on Cancer Science and Therapy, and at the International Congress of Naturopathic Medicine. Many of her health articles have appeared on colleenhuber.substack.com. Her writing includes her book Choose Your Foods Like Your Life Depends On Them, Manifesto for a Cancer Patient, and other books and articles. Dr. Huber authored the largest and longest study in medical history on sugar intake in cancer patients, which was reported in thousands of media outlets around the world in 2014. Her academic writing has appeared in The Lancet and Cancer Strategies Journal, and other medical journals."
full_description = "What Are Your Odds When You Have Cancer? June 6, 2017 by Dr. Colleen Huber Comments are off Colleen Huber, NMD Cancer patients ask a reasonable question: What are my chances? It is hard to get true numbers out of oncology clinics. As oncologist Dwight McKee MD has said, “Oncologists throw chemo at cancer for a little while, then send patients to hospice.”[1] After several chemo drugs are tried, over the course of months to years, the cancer patient must then hear, “There is nothing more that can be done for your cancer.” This was after conventional oncology implied to the patient that a cure or at least prolonged remission was possible. Oncologists also have a habit of telling an outright lie: “There is nothing else that works against cancer except chemotherapy and radiation. So you are going to start chemo this week.” So then when patients learn the hard way how wrong that is, they get discouraged, distrust these doctors, realize that their cancer is now too strong and too widespread to try anything different, and they go to hospice, and then their death is blamed on cancer, rather than deception, poor treatments and mismanagement. It just doesn’t have to be this way. We published all the results of our clinic online from 2009 to 2014, each year.[2] Then when gathering the data each year got to be too detailed, time-consuming and burdensome, we started surveying patients currently in treatment, and with more focused questions. Every oncology clinic should publish its results. This is the decent thing to do with cancer care. People need to know their odds. Doctors, patients have a right to know what you can and cannot do for them. If most of your patients die after a year or two of chemotherapy, then you have the obligation to disclose that to the public, so that people can make informed decisions. And let them know early enough that they can get effective treatment for their cancer! www.NatureWorksBest.com [1] D McKee. Integrative Cancer Medicine: Clinical Applications of Cancer Strategies. Conference, Scottsdale AZ. April 26 to 29, 2013. [2] /wp-content/uploads/2018/01/2017-Cancer-treatment-paper.2017.12.30.pdf Facebook Twitter Google+ Pinterest Posted in:CancerTagged with:cancer successcolleen huber See more Prev:What Can I Expect When I Visit a Naturopathic Oncologist? Back: All Posts Next:Chemotherapy Increases Risk of Metastasis About the Author Dr. Colleen Huber Dr. Colleen Huber founded the NatureWorksBest Clinic, and now is currently on sabbatical from practicing medicine, while writing books and articles, and staying involved with the clinic. Dr. Huber has served as President of the Naturopathic Cancer Society and co-founded the American Naturopathic Research Institute / Naturopathic Oncology Research Institute. At NatureWorksBest Clinic, the data supporting the clinic’s results in cancer treatment can be found here. Dr. Huber was the principal keynote speaker at the 2015 Euro Cancer Summit, and in 2014 was a speaker at the World Congress on Cancer Science and Therapy, and at the International Congress of Naturopathic Medicine. Many of her health articles have appeared on colleenhuber.substack.com. Her writing includes her book Choose Your Foods Like Your Life Depends On Them, Manifesto for a Cancer Patient, and other books and articles. Dr. Huber authored the largest and longest study in medical history on sugar intake in cancer patients, which was reported in thousands of media outlets around the world in 2014. Her academic writing has appeared in The Lancet and Cancer Strategies Journal, and other medical journals."
