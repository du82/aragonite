full_description = "Herb Of The Month: Wood Betony April 23, 2009 by Dr. Colleen Huber 0 Comments Herb Of The Month: Wood Betony Wood betony Wood betony or Stachys betonica was so highly prized in Europe that an Old Italian proverb advised: “Sell your coat and buy betony.” The Medicina Britannica of the 17th century primarily extols its virtues with regard to headache, claiming that “I have known the most obstinate headaches cured by breakfasting for a month or six weeks on a decoction of Betony made with new milk and strained.” Betony treats dyspepsia, poor appetite and indigestion, as well as internal wounds, including those of the GI tract. Sores, including mouth sores, ulcers and boils all are indications for the use of Betony. Wood betony was long considered to have powerful effect against evil spirits, and was planted in churchyards for this purpose. Many older churches and apothecary buildings still have wood betony growing around them to this day. Facebook Twitter Google+ Pinterest Posted in:CancerUncategorized See more Prev:Cheap Meat: An Accident Waiting To Happen Back: All Posts Next:Herb Of The Month: Tea Tree (Melaleuca Alternifolia) About the Author Dr. Colleen Huber Dr. Colleen Huber founded the NatureWorksBest Clinic, and now is currently on sabbatical from practicing medicine, while writing books and articles, and staying involved with the clinic. Dr. Huber has served as President of the Naturopathic Cancer Society and co-founded the American Naturopathic Research Institute / Naturopathic Oncology Research Institute. At NatureWorksBest Clinic, the data supporting the clinic’s results in cancer treatment can be found here. Dr. Huber was the principal keynote speaker at the 2015 Euro Cancer Summit, and in 2014 was a speaker at the World Congress on Cancer Science and Therapy, and at the International Congress of Naturopathic Medicine. Many of her health articles have appeared on colleenhuber.substack.com. Her writing includes her book Choose Your Food