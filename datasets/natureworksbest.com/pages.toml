full_description = "Vitamin Injections For Cancer Treatment Dr. Huber’s Nutrient Infusions Of equal emphasis with the food plan, are Dr. Huber’s Nutrient Infusions – nutrients that we administer three times per week to each cancer patient. These consist of high-dose intravenous vitamin C (ascorbic acid), as well as other nutrients chosen for specific anti-neoplastic effect with regard to the patient’s type of cancer. For solid malignant tumors, we address the problem of pH, by infusing both sodium bicarbonate to alkalinize systemically, as well as other specifically anti-cancer nutrients, tailored to the individual patient’s tumor load, type of cancer and other health circumstances. B vitamins and minerals and other nutrients are often added for synergistic effect with Vitamin C, or because of their history of reducing and eliminating tumors, or their usefulness in converting malignant tumors into benign tissue. Naturopathic training emphasizes the treatment of the individual with regard to the entire symptom picture. Therefore, there is no specific formula to be repeated in cookbook fashion from one patient to the next, or even for the same patient from one day to the next. Quantities of the different components of this combination vary among individual patients depending on symptoms, signs and type of cancer. Quantities also vary as the patient’s needs change. All components are kept far below the LD50 for each component, and are only administered if they have not produced any side effects in our patients. Intravenous Vitamin C Research has established that ascorbic acid taken orally cannot attain sufficiently high concentrations in the bloodstream to kill cancer cells. 1 However, intravenous use of ascorbic acid has been shown to rise to concentrations that have killed cancer cells in vivo >3 4 5 and in vitro.6 7 8 The ascorbic acid that we use is in much higher dose than would be tolerated orally, yet at a level where there is sufficient concentration of vitamin C in the bloodstream to create a substantial concentration of the products of vitamin C in the extracellular fluid.9 Intravenous doses of ascorbic acid have been found to produce from 25 to 70 times as much plasma concentration as may be attained by oral dosing.10 Research has confirmed that Vitamin C in such high concentration kills cancer cells while leaving normal tissue unharmed.11 12 Indeed the cancer patients whom we treat do not have side effects from these treatments, with few exceptions. Three of the exceptions were allergies to specific B vitamins in four individuals. Two of the three went into remission after we had removed the offending agent early on. One is still being treated. In addition to this directly and selectively cytotoxic effect on cancer cells, vitamin C has been shown to form collagen13 and to inhibit hyaluronidase14 leading to stronger membrane integrity and tensile strength15 of normal tissue, which inhibits invasion16 and thus metastases. Vitamin D Empirical data shows an inverse correlation between vitamin D intake and cancer incidence.17 18 19 Research over the last several years has confirmed the essential role that Vitamin D plays in cancer prevention and treatment.20 21 22 23 Vitamin D has been shown to induce differentiation,24 and apoptosis,25 to reduce proliferation by effect on signal transduction,26 to improve intercellular communication by means of gap junction communication preservation,27 to inhibit angiogenesis,28 29 and to inhibit metastasis.30 At our clinic, most cancer patients are prescribed a regular dose of Vitamin D that is compatible with customary sunlight exposure, current pharmaceuticals if any, as well as the assessed condition of the liver and gallbladder and calcium metabolizing mechanisms. Vitamin A Vitamin A is a less-widely appreciated but quite crucial part of the treatment protocol for its immune-stimulating property31 and inhibition of cancer cell migration32. Another very important quality of Vitamin A with regard to neoplastic cells is its ability to introduce differentiation.33 It has also been shown to induce apoptosis in cancer cells,34 as well as growth inhibition.35 Although there have been some objections made to Vitamin A for an allegedly competitive and detrimental effect to vitamin D,36 vitamin A seems to be vindicated by a preponderance of older research that supports the use of vitamin A and vitamin D dosed together.37 38 39 Essiac Tea We frequently add the recommendation to take Essiac tea (Resperin Canada Limited, Waterloo, Ontario, Canada), because of its long history in North America, over most of the last century of folk use (outside of conventional medicine) against a wide variety of cancers. Essiac was developed by a Canadian nurse, René Caisse, together with the Ojibwe people of Canada. It is a combination of four herbs, Arctium lappa, Rheum palmatum, Rumex acetosella, and Ulmus fulva. Later versions of Essiac, using additional herbs with some pro-estrogenic effect, have been linked to breast tissue proliferation,40 and we do not recommend those altered formulas. Essiac has been found to have in vitro cytotoxic effects specifically against neoplastic cells, without damage to normal cells.41 Its main effect seems to be protective against DNA damage.42 It also seems to have anti-proliferative effect.43 Digestive Enzymes For some of our patients, we have also used digestive enzymes apart from meals, for a presumed proteolytic effect against tumors. This use is still speculative and does not appear to be well-supported at this time in the medical literature. However, various digestive enzymes, and bromelain in particular, have been found to heighten immune system response to cancer 44 45 and to inhibit metastasis.46 47 For different cancers there are additional appropriate treatments. For example, Kenneth Proefrock NMD has done extensive original work with nebulizers, as well as in many other areas of medicine, which he taught us to use with lung cancer patients, as well as others with metastases the lungs, to good effect.48 Whereas all of the rest of our treatments arrive to the lungs by way of the bloodstream, Dr. Proefrock has introduced such nebulized botanicals and nutrients as required by the individual patient by way of the airways, thus carrying anti-neoplastic treatments to lung tissue via its other major port of entry. What did you think about this article? Do you have any questions about Dr. Hubers Nutrient Infusions? Let us know in the comments section below! Click Here To See The References 1 Creagan E, Moertel C, O’Fallon J, et al. Failure of high – dose Vitamin C (ascorbic acid) therapy to benefit patients with advanced cancer. A controlled trial. New Engl J Med 1979 Sep 27. 301(13): 687 – 90. 2 Moertel C, Fleming T, Creagan E., et al. High – dose vitamin C versus placebo in the treatment of patients with advanced cancer who have had no prior chemotherapy. A randomized double – blind comparison. New Engl J Med. 1985 Jan 17; 312(3): 137 – 41. 3 Cameron E, Campbell A. The Orthomolecular treatment of cancer: II. Clinical trial of high – dose ascorbic acid supplements in advanced human cancer. Chem Biol Interact. 1974; 9: 285 – 315. 4 Cameron E, Pauling L . Supplemental ascorbate in the supportive treatment of cancer: prolongation of survival times in terminal human cancer. Proc Natl Acad Sci. 1976. 73. 3685 – 89. 5 Cameron E., Pauling L. Supplemental ascorbate in the supportive treatment of cancer: re – evaluation of prolongation of survival times in advanced human cancer. Proc Natl Acad Sci. 1978 Sep; 75(9): 4538 – 42. 6 Bram S, Froussard P, Guichard M, et al. Vitamin C preferential toxicity for malignant melanoma cells. Nature 1980 Apr 17; 284(57)::629 – 31 . 7 Leung P, Miyashita K, Young M, et al. Cytotoxic effect of ascorbate and its derivatives on cultured malignant and non – malignant cell lines. Anticancer Res. 1993 Mar – Apr; 13(2): 475 – 80. 8 Sakagami H, Satoh K, Hakeda Y, et al. Apoptosis – inducing activity of vitamin C and vitamin K. Cell Mol. Biol 2000 Feb; 46(1): 129 – 43. 9 Chen Q, Espey M, Krishna M, et al. Pharmacologic ascorbic acid concentrations selectively kill cancer cells: action as a pro – drug to deliver hydrogen peroxide to tissues. Proc Natl Acad Sci. 2005 Sep; 102(38): 13604 – 09. 10 Padayatty S., Sun H, Wang Y, et al. Vitamin C pharmacokinetics: implications for oral and intravenous use. Ann Intern Med 2004 Apr 6;140(7): 533 – 37. 11 Chen Q, Espey M, Krishna M, et al. Pharmacologic ascorbic acid concentrations selectively kill cancer cells: action as a pro – drug to deliver hydrogen peroxide to tissues. Proc Natl Acad Sci. 2005 Sep. 102(38): 13604 – 09. 12 Padayatty S, Riordan H, Hewitt S, et al. Intravenously administered vitamin C as cancer therapy: three cases. Canadian Med Assn J. 2006 Mar 28; 174(7): 937 – 42. 13 Akiyama M, Nakamura M. Bone regeneration and neovascularization processes in a pellet culture system for periosteal cells. Cell Transplant. 2009 Apr 15. pii: CT – 1917. (Epub ahead of print). 14 Yogeeta S, Gnanapragasam A, Senthil Kumar S, et al. Synergistic salubrious effect of ferulic acid and ascorbic acid on membrane – bound phosphatases and lysosomal hydrolases during experimental myocardial infarction in rats . Life Sci. 2006 Dec.23; 80(3): 258 – 63. 15 Lin Y, Tan F, Marra K, et al. Synthesis and characterization of collagen/hyaluronan/chitosan composite sponges for potential biomedical applications. Acta Biomater. 2009 Apr 2. (Epub ahead of print). 16 Petrella B. Assessment of local proteolytic milieu as a factor in tumor invasiveness and metastasis formation: in vitro collagen degradation and invasion assays. Methods Mol Biol 2009; 511:75 – 84. 17 Penna – Martinez M, Ramos – Lopez E. Stern J, et al. Vitamin D receptor polymorphism s in differentiated thyroid carcinoma. Thyroid. 2009 Jun; 19(6): 623 – 8. 18 Robin K, Cutler G, Lazovich, D. Vitamin D intake and breast cancer risk in postmenopausal women: the 