full_description = "Herb Of The Month: Tea Tree (Melaleuca Alternifolia) April 23, 2010 by Dr. Colleen Huber 0 Comments Herb Of The Month: Tea Tree (Melaleuca Alternifolia) Tea tree oil is a very popular product in health food stores, very handy for its anti-fungal and anti-bacterial effect, while being safe for topical use. Sometimes athlete’s foot and toenail fungus will respond better to repeated applications of tea tree oil than with any other application. The name “tea tree” gives an incorrect impression. Actually the Australian aboriginal people call it “ti tree,” hence the name. It is only known to grow in Australia, although a few similar species grow in Indonesia and Malaysia also. Another reason that it is known as “tea tree” is because the fallen leaves in nearby streams turn the water a tea shade of brown, although this brew is not actually suitable for drinking. The oil is of medicinal effect and practical use. Facebook Twitter Google+ Pinterest Posted in:CancerUncategorized See more Prev:Herb Of The Month: Wood Betony Back: All Posts Next:Sports Nutrition Basics About the Author Dr. Colleen Huber Dr. Colleen Huber founded the NatureWorksBest Clinic, and now is currently on sabbatical from practicing medicine, while writing books and articles, and staying involved with the clinic. Dr. Huber has served as President of the Naturopathic Cancer Society and co-founded the American Naturopathic Research Institute / Naturopathic Oncology Research Institute. At NatureWorksBest Clinic, the data supporting the clinic’s results in cancer treatment can be found here. Dr. Huber was the principal keynote speaker at the 2015 Euro Cancer Summit, and in 2014 was a speaker at the World Congress on Cancer Science and Therapy, and at the International Congress of Naturopathic Medicine. Many of her health articles have appeared on colleenhuber.substack.com. Her writing includes her book Choose Your Foods Like Your Life Depends On Them, Manifesto for a Cancer Patient, and ot