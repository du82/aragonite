["https://natureworksbest.com/four-major-dietary-mistakes-made-by-most-cancer-patients"]
title = "Nature Works Best"
description = "Dr. Colleen Huber founded the NatureWorksBest Clinic, and now is currently on sabbatical from practicing medicine, while writing books and articles, and staying involved with the clinic. Dr. Huber has served as President of the Naturopathic Cancer Society and co-founded the American Naturopathic Research Institute / Naturopathic Oncology Research Institute. At NatureWorksBest Clinic, the data supporting the clinic’s results in cancer treatment can be found here. Dr. Huber was the principal keynote speaker at the 2015 Euro Cancer Summit, and in 2014 was a speaker at the World Congress on Cancer Science and Therapy, and at the International Congress of Naturopathic Medicine. Many of her health articles have appeared on colleenhuber.substack.com. Her writing includes her book Choose Your Foods Like Your Life Depends On Them, Manifesto for a Cancer Patient, and other books and articles. Dr. Huber authored the largest and longest study in medical history on sugar intake in cancer patients, which was reported in thousands of media outlets around the world in 2014. Her academic writing has appeared in The Lancet and Cancer Strategies Journal, and other medical journals."
full_description = "Four Major Dietary Mistakes Made by Most Cancer Patients June 11, 2019 by Dr. Colleen Huber 0 Comments Four Major Dietary Mistakes Made by Most Cancer Patients by Colleen Huber, NMD Given a disease as difficult as cancer, as one might imagine, the choices made by a cancer patient have tremendous impact on the course of the disease, the ease or difficulty of regaining health, indeed the very survival of the individual. This is all the more true in an outpatient setting. Whereas a hospitalized patient, or one under a highly toxic regimen, has the daily routine arranged by others, the ambulatory outpatient, in contrast, decides for themselves such routine events as diet and exercise and sleep habits. One of the most common mistakes cancer patients make is to take any of those for granted, or without careful consideration among available choices. In the 21st century developed world, food choices are more varied than ever before in human history, and people even in the same family can eat vastly differently from each other if they so choose. In Chapters 7 and 8 we showed how food choices can make life or death difference in cancer. We have found in our clinical practice that many dietary differences among cancer patients that create a flutter on the internet are of very little consequence. On the other hand, our clinic has conducted the longest and largest study to date of sugar consumption in cancer patients, and found an overwhelming difference in remission and survival between the sugar eaters and the sugar avoiders. See Chapter 8. However simple this concept is, and however well-documented in the medical literature going back almost a century, people still seek out and travel long distances to our clinic with considerable unease and confusion regarding the role of sugars in cancer growth and progression. Most cancer patients arrive saying that they have had a history of being a “sweet tooth.” This seems to be especially true for the pancreatic cancer patients, which should be easily understood when we consider one of the primary roles of the pancreas – one of the main reasons we even have a pancreas, is to regulate the amounts and distribution of sugar in the blood. Therefore, the pancreas has likely suffered some damage or at least extreme conditions by the time the individual receives a diagnosis of pancreatic cancer. But it is not only pancreatic cancer patients who enter our clinic with confusion over the role of sugar in cancer or what even constitutes “sugar.” Not by a long shot. Almost everyone asks in their first or second consult if it is alright to have honey or maple syrup or alcohol sugars. This is even after the first day, in which the individualized protocol we recommend – which is quite varied from one patient to the next – generally includes identical, one-size-fits-all boilerplate language of the following form: “It is essential to avoid sweeteners except for stevia.” This is bold, underlined and highlighted in yellow. Yet the most frequent question that we get from patients is what other sweeteners may be acceptable besides stevia. It’s not that our patients have trouble comprehending what we ask. Far from it; they have considered their options carefully, and have carefully and intelligently made the best and most survivable decision possible in coming to our clinic, I sincerely believe, and as we have amply demonstrated in Chapter 7. Rather, the problem is that sugar – like tobacco or alcohol – is a hard habit to kick, and giving it up all at once is a bracing and unpleasant prospect for many of our newcomers. They are looking for a way to have their cake and eat it too. Who can blame them, given the fond memories they’ve acquired throughout their lives of enjoying special occasions with our most globally acceptable social lubricant – desserts, sweets, soda and candy? Yet, this is the very thing I ask them to give up – with the lame apology that I am the Grinch that stole the Christmas cookies. I consider it my responsibility to offer satisfactory substitutes whenever I can, for the sweeteners that I’ve asked my patients to forgo. In our IV rooms, we have various stevia recipes, for such treats as apple pie or frozen coconut/carob cubes and a number of others. Some of them will most dearly miss sweetener in their coffee. For others, the delectable treat is ice cream, and for others it is chocolate. In each case, I make some suggestions until we discuss something palatable that can be made without high glycemic sweeteners. For ice cream, we discuss different fruits that can be added to heavy cream in a blender, to approximate the flavor and texture of ice cream. For chocolate, I recommend 85% cocoa content or higher, one or two small squares per day, in order to try to keep the sugar intake at 3 grams or less. In each case, over the course of our regular consults, patients usually want to discuss food choices and dessert strategies more than any other single topic. Also, I consider it my responsibility to eat only as I ask my patients to eat. Therefore, I have no sweets at all in my diet, except those sweetened with stevia, and my family follows the same diet, regardless of holidays or birthdays. (We know how to make some very nice holiday cookies with stevia and a stevia pumpkin pie on Thanksgiving, etc.) When I make apple pie at home, I actually don’t add any sweetener at all. I simply put apple slices, cinnamon, butter, coconut oil and flour into an unsweetened pie crust, bake at 40 minutes, and that seems to be a nice treat. Stevia also unfortunately does not grow with an instructional pamphlet attached to the stem, though it would likely be a lot more popular if that were a feature of the plant. The uninitiated assume that stevia will be less sweet than sugar, when in fact it is many times sweeter, hundreds of times more perceptibly sweet, in fact, in a volume-by-volume comparison. Therefore, those trying stevia for the first time often make the mistake of putting a teaspoonful or so in a cup of coffee or other drink, and then nearly gagging at the very unpalatable result. In fact, it takes anywhere from 7 to 12 drops only to sweeten a drink to satisfaction. I hear more than any other single protest, “I tried stevia, and I don’t like it.” My response is, “That’s likely because you had too much. Try this glass of lemonade: Squeeze ¼ lemon into a glass of water, and add 8 drops only of liquid stevia. Then you may want to add one or two more drops. I think you will find it to be far more pleasant than what you had before.” It seems a majority of patients had such a jarring experience with their first encounter with stevia that they don’t want to try the lemonade, and simply choose to give up all sweets. Fortunately, this abstinence is usually successful at our clinic, because the patients understand that the stakes are quite high. If they had met with the hundreds of patients we have met with over the last decade, and had gotten to know the sweet-eaters who then died of cancer, they would know that the stakes are indeed quite a bit higher than they had imagined. Thus we plug along on a daily basis, addressing our patients’ sugar nostalgia and anxiety on recipe-by-recipe basis, attempting to forge some common ground of acceptability, negotiating away this and urging that, hoping that they will each find some comfort and diligence in pursuing the new diet. Those who have made the mistake of not following the recommendation to eliminate sweeteners have more often than not (64% of the time in fact, as seen in Chapter 8) broken our hearts, and we have sent sympathy cards to their bereaved families. In 2016, two of the lucky ones, survivors, came back at the same time to our clinic with cancer recurrence. One was extroverted and the other was quiet by nature. They had each given up sweets, had a few months of our IV nutrient treatments for breast cancer and lymphoma respectively, and had gone into remission a few years earlier, and stayed in remission during those years. Then over time away from us, each began to eat sweets again. The extroverted patient recently told all fellow patients who would listen: “Don’t do what I did. I began to eat sugar again, and my cancer came back.” As might be imagined, her first-hand account was far more persuasive to the other patients than anything that I might say, although I used many more words and hours to say it. Certainly, there are a number of cancer survivors already who now owe their lives in part to her very timely warning. Mistake Number 1: Continuing to eat sweets after a cancer diagnosis. This, in our experience, is an even more likely cause of cancer-related death than chemotherapy or continued smoking. See Chapter 8. * * * There is another enormously common mistake that cancer patients make: Like much of the rest of the western hemisphere, cancer patients have been urged by the zeitgeist at large to become vegetarian for better health. On being diagnosed with cancer, and being forced to stare at the specter of one’s own mortality, the time seems urgent to finally follow the widely broadcast advice to become vegetarian or vegan. However, an extraordinarily high number of cancer patients had chosen this path long before diagnosis, and are then dismayed when they find themselves with cancer after making “healthier” choices than most of their peers and loved ones. Now I will readily acknowledge that a vegetarian diet may well be a preferable choice for a huge portion of the world’s population, varying considerably from say parts of India to say for example the Inuit, perhaps each of them being near the extremes on that particular dichotomy of vegan/vegetarian to omnivore to carnivore, among all human populations. Most of the rest of us throughout the world fall somewhere in between those polar opposites on the vegan-vegetarian-omnivore-carnivore continuum. I will also acknowledge that a vegan or vegetarian diet is much kinder to the planet and its domesticated animal inhabitants than any alternative. A plant-based diet is also far more efficient since it takes over two pounds of plant material and over a thousand gallons of water to make one pound of beef,i and it takes only dozens or hundreds of gallons of water to make one pound of plant material.ii With the earth’s still accelerating increase in human inhabitants on our Malthusian curve toward “population explosion,” and the domesticated animals that feed us, these numbers must be considered with increasing urgency globally in order to feed us all. However, when it comes to an individual who, at this relatively brief period of life, is suffering with cancer, such considerations must be put aside. Much as I think that people without cancer could reasonably consider a vegetarian diet, those with cancer cannot afford such a luxury. The reason is that ultimately, even the best quality carbohydrates break down and metabolize to a greater amount of sugar/glucose in the blood than the two dietary alternatives: fat and protein. In fact, that’s all we get. Regardless of the lovely smorgasbord available in 21st century supermarkets, if you look at it all in its most basic form, we have three types of food: carbohydrates, proteins and fats. Considering that carbohydrates, even those of the highest quality, the colorful vegetables, ultimately break down to sugars, we need to adopt the following strategy with cancer patients: Use proteins and especially fats to crowd out, or to displace, carbohydrates in the diet of cancer patients. Of the appetite that remains for carbohydrates, let us default primarily to those of highest quality: the green and yellow vegetables. I certainly did not invent this strategy. It not only proceeds logically from the findings of Otto Warburg, but such a diet already has a name: the ketogenic diet, as well as its more popular and easier approximation, the paleo diet, which I described and advocated in my 2007 book, Choose Your Foods Like Your Life Depends On Them, a book that was published before the Paleo Diet became popular, with the book of that name published in 2010.iii However, I certainly was not the first, and won’t be the last by any means to advocate such a diet. Every few years somebody writes the latest version of a healthy omnivore’s diet. Sally Fallon and Mary Enig’s book Nourishing Traditions is highly respected and the most comprehensive work I know with respect to a paleo-type diet. A strict ketogenic diet is comprised 80% of fat and 20% of a combination of proteins and carbohydrates. As we can imagine, this really leaves no room for a jelly donut or even a spinach salad. Imagine a bacon cheeseburger without a bun. Imagine a cup of heavy cream, with a little coffee added for flavor, a tablespoon of coconut oil and some nuts as a snack. Such a diet is not really the kind of diet that has appealed to the western palate. But there is a far worse problem with it: it is so extreme and restrictive that it is not tenable long-term. Yet the cancer patient needs to survive cancer long-term, and that is the dilemma that must be resolved to their ongoing satisfaction and to their best of health. Ketogenic diets have been wonderfully helpful in some of the most intractable cancers.iv v Yet despite this very encouraging success, the ketogenic diet is not permanently helpful unless it can be tolerated all the way through to remission. And in my experience, there’s the rub. That has been the deal breaker. Mistake Number 2 then for the cancer patient is abandoning the ketogenic diet with a reckless plunge into the candy store. I would not go there if I were you. If you want to abandon the ketogenic diet while you still have cancer, I would go paleo. It’s more tolerable long-term. People stay on a paleo diet for years and grow very comfortable with it. It will likely be tolerable for you well past evidence of your remission. Then if you want to ease off of that, you can go a little more vegetarian. If even a Paleo Diet is ultimately too restrictive, then have a Mediterranean Diet. This is primarily composed of vegetables, with substantial olive oil, moderate meats and whole grains. Again, desserts, sweets, sodas, candy are absolutely off-limits, out of the question. However, I advise you not to adopt the Mediterranean Diet while you have an active cancer. Wait until you are in confirmed remission for at least a year, and then you can transition to the Mediterranean Diet. But you will never be able to eat sweets again. Period. For life. The same life sentence that I am on and am grateful for, because I always feel well and strong, although I am growing alarmingly old. At least, I find such high numbers alarming. It’s okay; before you realize it, you can become comfortable with the Paleo or the Mediterranean lifestyle. * * * The third mistake is closely related. People often assume that veganism or vegetarianism is a good strategy to adopt during a bout with cancer. It is not, as I have "
