full_description = "Holistic Medicine – The Research Natural Therapies In Medical Literature We list below a number of studies showing the benefit of certain naturopathic interventions with respect to various disease conditions. These by no means represent all studies, only a sampling of the extant medical literature. Whenever feasible, and for the sake of brevity, we have limited our citations to a maximum of two per therapy and two therapies per disease condition. The amount of research supporting natural therapies is indeed extensive, well over one hundred times the number of medical journal articles cited herein. In choosing this relatively very small number of articles to cite here, we have opted for both a breadth of coverage of the many diseases having successful natural treatments, as well as a preference for the meta-analyses and larger studies over smaller studies and case studies. The reader should never consider the following information as a substitute for consultation with a naturopathic physician or another qualified health professional; if you are interested you can do so here. In fact, from reading the list below, one could not determine appropriate dosing or follow-up for any of the remedies described. Also, in some situations the below treatments may not be appropriate under a given set of circumstances or conditions. A basic tennant of Naturopathic treastment is to treat the whole person. Therefore, your naturopathic physician will work with you to determine which treatments are most appropriate given your condition and circumstances. Holistic Treatments By Condition Condition Treatment Resources Addiction Acupuncture G. ter Riet, et al. “A meta-analysis of studies into the effect of acupuncture on addiction,” British Journal of General Practice 1990; 40: 379-382. Alzheimer’s Disease L-Acetyl Carnitine B. Bowman, “Acetyl-L-Carnitine and Alzheimer’s Disease,” Nutrition Reviews 1992; 50: 142-44.M. Calvani, “Action of Acetyl-L-Carnitine In Neurodege