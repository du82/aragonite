title = "Nature Works Best"
description = "Dr. Colleen Huber founded the NatureWorksBest Clinic, and now is currently on sabbatical from practicing medicine, while writing books and articles, and staying involved with the clinic. Dr. Huber has served as President of the Naturopathic Cancer Society and co-founded the American Naturopathic Research Institute / Naturopathic Oncology Research Institute. At NatureWorksBest Clinic, the data supporting the clinic’s results in cancer treatment can be found here. Dr. Huber was the principal keynote speaker at the 2015 Euro Cancer Summit, and in 2014 was a speaker at the World Congress on Cancer Science and Therapy, and at the International Congress of Naturopathic Medicine. Many of her health articles have appeared on colleenhuber.substack.com. Her writing includes her book Choose Your Foods Like Your Life Depends On Them, Manifesto for a Cancer Patient, and other books and articles. Dr. Huber authored the largest and longest study in medical history on sugar intake in cancer patients, which was reported in thousands of media outlets around the world in 2014. Her academic writing has appeared in The Lancet and Cancer Strategies Journal, and other medical journals."
full_description = 'video Cancer & Biochemistry 4 August 12, 2018 by Dr. Colleen Huber 0 Comments var g1_var_1259655632 = {"html_code":"<div id=\"fluid-wrapper-counter-2\" class=\"g1-fluid-wrapper \" style=\"width:968px;\"><div style=\"padding-bottom:56.301652892562%;\"><iframe width=\"968\" height=\"545\" src=\"https:\/\/www.youtube.com\/embed\/scb7QTv0C5o?feature=oembed&amp;wmode=transparent&amp;autohide=1&amp;autoplay=0&amp;disablekb=0&amp;fs=1&amp;loop=0&amp;enablejsapi=1&amp;rel=0&amp;controls=2&amp;showinfo=0&amp;wmode=transparent&amp;autohide=2&amp;autoplay=0&amp;disablekb=0&amp;fs=1&amp;loop=0&amp;enablejsapi=1&amp;rel=0&amp;controls=2&amp;showinfo=1\" frameborder=\"0\" allow=\"autoplay; encrypted-media\" allowfullscreen><\/iframe><\/div><\/div>"}; HOW EXACTLY DOES SUGAR FEED CANCER? If you have not seen my video on vitamins B2 and B3, you may want to look at that one to see how normal bodily processes use those two vitamins for a very essential anti-cancer process, a process that all of our normal cells undergo all the time: oxidative phosphorylation and the electron transport chain. Now don’t worry about what each of those mean, except that normal tissue uses that. Cancer arises when we have damaged machinery in the cell: the mitochondria, which are our cells’ power plants, become damaged, and energy can no longer be produced in a normal way in a cell that has become cancerous. The electron transport chain is basically shut down, which means that the food we eat takes a different pathway, a pathway that favors cancer, the lactic acid production pathway. This lactic acid production is made possible by two things: One- The damaged electron transport chain shuts off the main road here to traffic – biochemical traffic of your incoming food molecules, that is – and so traffic of those molecules is forced to go a different way. Or if you look at it like a dam on a river – the flow is blocked from the normal river bed, and flooding has to happen over this way, a way that favors cancer. Or rather, this is the pathway left available to cancer, now that the normal pathway is blocked. That was the first thing that made cancer possible. Here is the second thing: Lots of sugar is eaten and drunk – especially through drinking, maybe a huge soda or other sweet drink, we get a lot of sugar fast! This river is really flooding up here, but look at downstream. Uh-oh. That got blocked from damage to the electron transport chain down here. So we are not going this way! Where do we have to go? The only place left is over here – the cancer pathway! This is a fermentation pathway that is now hugely used because of the massive amount of sugar that came in. There is only one thing to do with all of that sugar, since it cannot flow directly downstream, it has to come here, and it has to make cancer. The reason it has to make cancer, when we have all of these food molecules, especially a lot of sugar coming this way, is that cancer is kind of like a machine. It can take a lot of excess sugar, and it can process that sugar quickly, and get over here with that sugar very fast. A lot of sugar hanging around the bloodstream can become toxic and throw off normal balances a lot. But if that excess sugar takes the cancer pathway and becomes lactic acid, then it is a little more tolerable for the body. This, folks, is how sugar feeds cancer: Way too much sugar comes in at once – you know your favorite treats! [wagging finger], and then the only road available for that sugar to travel, once it’s in your body, is this road here, because the main road is closed off, from damage to the electron transport chain – then we have conditions ripe for cancer to develop: too much sugar coming into the system, and damage to the normal way of getting rid of that excess sugar, and having to take a lot of this alternate pathway. That’s where the sugar goes, letting cancer happen. And cancer allows the sugar to get processed away, to lactic acid. So why doesn’t exercise cause cancer if that makes lactic acid? Because it uses normal healthy tissue to make lactic acid, not cancerous tissue. In fact, there is a principle in chemistry that if you add end product of a chemical reaction, you shut down the reaction. Add lactic acid here, and you slow the traffic from here to here, that is from pyruvate to lactate. So exercise is generally helpful, and sweeteners DO NOT belong in the body of the cancer patient, because they feed this cancer pathway. Don’t say later that I didn’t warn you. I am Dr. Colleen Huber, it is May 18, 2018, and thanks for watching! Facebook Twitter Google+ Pinterest Posted in:CancerCancer & Biochemistry See more Prev:Cancer & Biochemistry 3 Back: All Posts Next:Cancer & Biochemistry 5 About the Author Dr. Colleen Huber Dr. Colleen Huber founded the NatureWorksBest Clinic, and now is currently on sabbatical from practicing medicine, while writing books and articles, and staying involved with the clinic. Dr. Huber has served as President of the Naturopathic Cancer Society and co-founded the American Naturopathic Research Institute / Naturopathic Oncology Research Institute. At NatureWorksBest Clinic, the data supporting the clinic’s results in cancer treatment can be found here. Dr. Huber was the principal keynote speaker at the 2015 Euro Cancer Summit, and in 2014 was a speaker at the World Congress on Cancer Science and Therapy, and at the International Congress of Naturopathic Medicine. Many of her health articles have appeared on colleenhuber.substack.com. Her writing includes her book Choose Your Foods Like Your Life Depends On Them, Manifesto for a Cancer Patient, and other books and articles. Dr. Huber authored the largest and longest study in medical history on sugar intake in cancer patients, which was reported in thousands of media outlets around the world in 2014. Her academic writing has appeared in The Lancet and Cancer Strategies Journal, and other medical journals.'
