bed&amp;wmode=transparent&amp;autohide=1&amp;autoplay=0&amp;disablekb=0&amp;fs=1&amp;loop=0&amp;enablejsapi=1&amp;rel=0&amp;controls=2&amp;showinfo=0&amp;wmode=transparent&amp;autohide=2&amp;autoplay=0&amp;disablekb=0&amp;fs=1&amp;loop=0&amp;enablejsapi=1&amp;rel=0&amp;controls=2&amp;showinfo=1\" frameborder=\"0\" allow=\"autoplay; encrypted-media\" allowfullscreen><\/iframe><\/div><\/div>"}; Cancer & Biochemistry 6 August 26, 2018 by Dr. Colleen Huber 0 Comments VITAMIN C AND ITS ROLE AGAINST CANCER Vitamin C has been appreciated for decades for its role against cancer as a pro-oxidant, which I will talk about in this video. However, recent research has shown why vitamin C’s effect in killing cancer is more permanent than the effect of chemotherapy, and I will talk about […] Posted in:CancerCancer & Biochemistry More'
