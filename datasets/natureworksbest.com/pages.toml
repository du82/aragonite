full_description = "Meet Our Team Dr. Colleen Huber Dr. Colleen Huber Dr. Colleen Huber founded the NatureWorksBest Clinic, and now is currently on sabbatical from practicing medicine, while writing books and articles, and staying involved with the clinic. Dr. Huber has served as President of the Naturopathic Cancer Society and co-founded the American Naturopathic Research Institute / Naturopathic Oncology Research Institute. At NatureWorksBest Clinic, the data supporting the clinic’s results in cancer treatment can be found here. Dr. Huber was the principal keynote speaker at the 2015 Euro Cancer Summit, and in 2014 was a speaker at the World Congress on Cancer Science and Therapy, and at the International Congress of Naturopathic Medicine. Many of her health articles have appeared on colleenhuber.substack.com. Her writing includes her book Choose Your Foods Like Your Life Depends On Them, Manifesto for a Cancer Patient, and other books and articles. Dr. Huber authored the largest and longest study in medical history on sugar intake in cancer patients, which was reported in thousands of media outlets around the world in 2014. Her academic writing has appeared in The Lancet and Cancer Strategies Journal, and other medical journals. Dr. Alan Bradford Dr. Alan Bradford, N.M.D. is a licensed Naturopathic Medical Doctor. After graduating with honors with a Bachelor of Science in Human Nutrition at Arizona State University, he completed a doctorate from Southwest College of Naturopathic Medicine. He is passionate about vitalistic natural medicine and helping patients achieve optimum health. Dr. Bradford has extensive training in metabolic disease, hormones, and using nutrition as a means to heal. This includes expertise in IV nutrient therapy, a foundational piece of the cancer protocols at Nature Works Best. He is the co-author of Please Bless the Refreshments: How to Really Nourish and Strengthen Your Body, and co-host of the popular podcast Community Guidelines, which features uncensored conversation about medical freedom, informed consent, and natural medicine. Since 2018, Dr. Bradford has been one of the only naturopathic physicians in Arizona credentialed to provide acupuncture services in the hospital setting. He holds a certification from the National Acupuncture Detoxification Association, and uses acupuncture as a means to treat addiction and substance abuse recovery, chronic pain, and as an adjunctive therapy in cancer treatment. Dr. Bradford is a strong advocate for personal medical choice and freedom. He approaches medicine with the idea that simple, personalized, gentle therapies are often best. Give the body what it needs to heal, and get out of the way. You can connect with Dr. Bradford online at Gab.com, Instagram, or subscribe to his free newsletter. Dr. Carol Spooner Dr. Carol Spooner has been serving the East Valley as a Naturopathic Medical Doctor (NMD) since 2008. She has incorporated integrative medicine into her practice, and has decades long knowledge and interest in nutrition and botanical medicine. Dr. Spooner has extensive experience with IV nutrient therapies, and keto, paleo and Mediterranean diets, and addresses the individual needs of the cancer patients at our clinic with these and additional complementary therapies as needed. Erik Wagner, FNP Erik is laser-focused on bringing cancer care back to the basic treatments that work best: The IV nutrients Help with getting sugar out of the diet Exercise In fact, Erik leads classes on how to get started with some exercise, no matter where you are starting out in your mobility and vitality. Erik Wagner, FNP has over a decade experience as a chiropractor. Chiropractors are one of the doctoral healthcare professionals with nutrition built into the curriculum. These days, Erik Wagner is also a Family Nurse Practitioner (FNP) and treats patients under that license. Erik Wagner has also completed the medical program at Montserrat University, and is planning to take his board exams at this writing. Erik Wagner’s broad range of practice experience, from chiropractic clinic to hospital and university hospital settings has provided a wide range of knowledge and experience to best meet the diverse needs of our patient population. Dr. Ellie Wright Dr. Wright started to work with cancer patients in 2015 as an intern at Nature Works Best Clinic with Dr Huber. The main treatments for cancer used here on a regular basis include: IV nutrients including high dose Vit C, hyperbaric oxygen therapy, and mistletoe therapy. At Nature Works Best Clinic, cancer patients choose either a natural approach or in combination with conventional treatments. When treating cancer, Dr. Wright addresses the entire person. Her focus in cancer patients is to get to the root cause and to detox the body from environmental toxins and emotional/mental toxicity. The goal for the cancer patients is to improve their quality of life and life extension. In focusing on these goals for cancer patients, Dr. Wright uses botanical medicine for sleep and digestion, amino acids therapy for balancing neurotransmitters, homeopathy for anxiety. In cancer patients, the immune system is decreased (stopped fighting) and her aim is to awake the Vital Forces through hydrotherapy, sauna, Mistletoe homeopathic extracts injections. She offers a variety of mind/body therapies including Hypnosis, Emotional Freedom Technique, Deep Breathing Technique, and NLP because she believes in the power of the Spirit. Medicine is about lifestyle, diet, attitudes that play a role in prevention and reoccurrence of cancer. In working with cancer patients she empowers them to make the healthy choices. To read more: https://magnoliapersonalizedmedicine.com/ You can find Dr. Wright on social media: www.linkedin.com/in/dr-el-wright777 We have developed the most effective cancer treatment that we have seen, & we do it without the side effects of chemotherapy & radiation. Give us a Call 480-839-2800 Learn More About Cancer Can We Answer Any Questions For You? Call Us 480-839-2800 Facebook Twitter Google+ Pinterest"
