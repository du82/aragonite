full_description = "Herb Of The Month: Coleus Forskohlii April 23, 2008 by Dr. Colleen Huber 0 Comments Herb Of The Month: Coleus Forskohlii Coleus forskohlii is a useful herb for a number of applications. It may be most useful in that it increases intracellular amounts of cyclic AMP. This is a naturally occurring compound in the body that allows for a lot of different cellular functions. One of the functions it seems to strengthen is thyroid function. However, coleus has been shown to be helpful in a number of other uses. One of the most promising is its use with glaucoma, in that it brings down pressure in the eye. Psoriasis has also responded favorably to coleus treatment, possibly because cyclic AMP tends to be low in skin affected by psoriasis. Facebook Twitter Google+ Pinterest Posted in:CancerUncategorized See more Prev:Pharmaceuticals In The Drinking Water Back: All Posts Next:Cheap Meat: An Accident Waiting To Happen About the Author Dr. Colleen Huber Dr. Colleen Huber founded the NatureWorksBest Clinic, and now is currently on sabbatical from practicing medicine, while writing books and articles, and staying involved with the clinic. Dr. Huber has served as President of the Naturopathic Cancer Society and co-founded the American Naturopathic Research Institute / Naturopathic Oncology Research Institute. At NatureWorksBest Clinic, the data supporting the clinic’s results in cancer treatment can be found here. Dr. Huber was the principal keynote speaker at the 2015 Euro Cancer Summit, and in 2014 was a speaker at the World Congress on Cancer Science and Therapy, and at the International Congress of Naturopathic Medicine. Many of her health articles have appeared on colleenhuber.substack.com. Her writing includes her book Choose Your Foods Like Your Life Depends On Them, Manifesto for a Cancer Patient, and other books and articles. Dr. Huber authored the largest and longest study in medical history on sugar intake in cancer patients, which was reported in tho