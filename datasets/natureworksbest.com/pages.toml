description = "Dr. Colleen Huber founded the NatureWorksBest Clinic, and now is currently on sabbatical from practicing medicine, while writing books and articles, and staying involved with the clinic. Dr. Huber has served as President of the Naturopathic Cancer Society and co-founded the American Naturopathic Research Institute / Naturopathic Oncology Research Institute. At NatureWorksBest Clinic, the data supporting the clinic’s results in cancer treatment can be found here. Dr. Huber was the principal keynote speaker at the 2015 Euro Cancer Summit, and in 2014 was a speaker at the World Congress on Cancer Science and Therapy, and at the International Congress of Naturopathic Medicine. Many of her health articles have appeared on colleenhuber.substack.com. Her writing includes her book Choose Your Foods Like Your Life Depends On Them, Manifesto for a Cancer Patient, and other books and articles. Dr. Huber authored the largest and longest study in medical history on sugar intake in cancer patients, which was reported in thousands of media outlets around the world in 2014. Her academic writing has appeared in The Lancet and Cancer Strategies Journal, and other medical journals."
full_description = "aside Breast Cancer & Exercise: A Novel Theory February 24, 2024 by Dr. Colleen Huber Comments are off A novel theory on breast cancer and exercise Dr. Colleen Huber What if there were an exercise that could reduce the risk of most breast cancers? A theory not yet in the medical literature A very brief overview of breast cancer distribution Breast cancer affects one in every eight women in the US. 54.3% of nearly one half million breast cancer patients studied had tumors diagnosed in the upper-outer quadrant of the breast. [1] This increased rate of UO breast tumors has not changed much in 42 years, 1984 to 2016. Data in pie chart from Al Ani, Shammout, et al. Breast cancer in previously… 2016. In a hemispherical breast, the upper-outer quadrant (UO) comprises only 25% of the breast volume. In a pendulous breast, that proportion of UO volume / total volume is even less, as the bulk of the breast mass in a pendulous breast is below (“inferior to” in anatomical language) the nipple line. From P. Lynch, Anatomy, Thorax, Breast. https://www.ncbi.nlm.nih.gov/books/NBK519575/ The predominance of breast tumors in the upper outer quadrant, therefore, defies a random distribution by over 200%, which is 54.3% / 25%. UO quadrant breast tumors generally have better outcomes than tumors in other areas of the breast. [2] It is possible that worse outcomes are seen with lower and medial breast tumors due to their being in an area that will less likely drain to axillary lymph, and more likely drain to the internal mammary lymph chain. [3] Lymph is one-third of the bodily fluid. It is a one-way circulatory system that collects debris from all over the body (the residuals from normal cell metabolism) into lymph nodes, and transports it along lymph chains, ultimately depositing this debris in the thoracic duct and then taking it out with the stool. The breast is a lymphatic dead-end so to speak, and part of the risk of breast cancer may be that the debris of cellular metabolism has a narrow path outward. The UO quadrant is most likely of all quadrants to drain to the axillary lymph chains, [4] where the lymph flow is more abundant than elsewhere surrounding the breast, draining about 75% of breast lymph. The advantage of that is to clear debris more reliably and quickly. Movement of the arms pumps lymph and thereby enhances this lymph flow to and through axillary chains rather than internal mammary chains, for more thorough clearance of metabolic wastes. Areas drained by the internal mammary chain, in contrast, have had more progression to later stage cancers. [5] Why are most breast tumors in the upper outer quadrant? The breast is composed of about 50% to 70% fat and 30% to 50% glandular tissue. [6] That ratio is about 50-50 before menopause, and then after menopause, glandular tissue is gradually replaced by fatty tissue. The predominance of breast cancer in the upper outer quadrant has been attributed to the high density of glandular tissue in this area, and the glandular tissue develops and proliferates under the influence of hormones secreted by the ovaries, [7] predominantly estrogen, but also prolactin during pregnancy, with somewhat less influence by progesterone. Glandular tissue is where most breast cancers arise. However, toxic chemical residues enter into and remain in that tissue. This includes carcinogenic compounds in underarm deodorants, antiperspirants or other cosmetics commonly used in that area, [8] which may be involved in the high incidence of breast cancer. Parabens have been used in deodorants to suppress growth of fungi, yeast and bacteria. [9] Paraben compounds have been found intact in both normal and cancerous breast tissue [10] and have shown estrogenic effects on breast tissue. [11] Aluminum and its salts are common ingredients in antiperspirant products. These compounds have been shown to alter estrogen action on tissues, as do other metals in the metalloestrogens category. [12] Where does exercise come in? The largest surface of breast tissue, the interior side, overlays and contacts the pectoralis major muscle, as seen on the reader’s left, more than 100 cm2 in the adult woman, somewhat larger than the palm of the hand. Pectoralis major and minor muscle tissue is thickest behind (deep to) the upper outer quadrant of the breast. Breast tissue and pectoral muscle are separated only by a thin 0.3 mm layer of pectoral fascia. So there is considerable surface area for interaction, as I will discuss below. [Illustration: Dr. Chaigasame, from Anatomy, Shoulder and Upper Limb, Pectoral Muscles. https://www.ncbi.nlm.nih.gov/books/NBK545241/Chest flies and cable chest pulls, and to a less targeted extent, bench presses and push-ups all work the pectoralis muscles. [Photos and diagrams from https://gethealthyu.com/exercise/chest-fly/, https://medium.com/@fitthour/ultimate-upper-chest-workout-with-cable-build-a-defined-chest-446f88a429b9, https://fitnessprogramer.com/exercise/bench-press/, and https://www.realsimple.com/how-to-do-pushups-7111348 respectively] Exertion of muscles produces lactic acid. This lactic acid, along with the physical stress of exercise, is followed by a sore sensation in the muscles used, especially during the next day or two. First the lactic acid clears, and then the muscles undergo repair, regeneration and even proliferation, as the muscles become bigger and stronger. Exercise has been shown to be effective against breast cancer, and was even more apparent in women with hormone-receptive tumors. [13] This meta-analysis examined 16 studies that found a significant reduction in early-stage breast cancer from exercise. [14] Any exercise at all has been found to be beneficial, even with as little as an hour per week of walking. Benefits were regardless of type of exercise, intensity or menopausal status. [15] The effect of exercise against breast cancer was shown in a meta-analysis of 42,602 women to beneficially impact survival whether the exercise / physical activity was done before or after diagnosis. A linear dose-response was shown, in which the more physical activity events, the more survival. [14] The correlation was so strong across all studies that irrefutable causation was established between exercise / physical activity and breast cancer survival. Lactic acid benefit against cancer Nobel prize biochemist Otto Warburg showed that cancerous cells are able to quickly convert an excess amount of sugar into lactate / lactic acid. It has been observed since Warburg’s time that sugar fuels cancer growth, and is its primary fuel, and PET imaging makes use of this fact. [16] The conversion of sugar to lactate (lactic acid) is the body’s way of disposing of a sudden and large amount of sugar, such as in a soda or dessert, in a way that helps prevent a hyperglycemic crisis. Stephanie Seneff of MIT calls this effect the cancer machine, its function of quickly converting a large amount of sugar to lactate. Cancer arises as an (undesirable) solution to a more immediately urgent problem of intolerably, even dangerously, high levels of dietary sugar. Lactate or lactic acid has been observed to seep into nearby tissues. [17] Stop a chemical reaction by adding end product. There is a principle in chemistry, LeChatelier’s Principle, which says this in part: If you want to stop a chemical reaction, or to discourage it from happening, add more of the end product of the reaction. Once more end product is added, the chemical reaction has no more reason to take place. Then it will slow down or stop. This is our goal with the cancer machine, to slow it down to an extent in which continued cancer cell survival is no longer viable, or to make it stop altogether. Breast cancer is by far the most common cancer in women. In the case of any cancer, the chemical reaction is sugar 🡪 lactate. Exercise also produces lactate in the muscle, but without producing cancer. Exercise is known to reduce or inhibit cancer. Pectoral muscle exercises produce lactic acid, which then seeps into nearby tissue, which in turn adds end product to the cancer chemical reaction of sugar 🡪 lactate. This then inhibits or stops the cancer chemical function and thus stops cancer. Therefore, pectoral exercises are a strategy to reduce breast cancer incidence, severity and / or risk. My theory Pectoral exercises add lactate adjacent to breast tissue, seeping into it, which places a biochemical obstacle in the cancer machine, with the result of depriving cancer of a reason to exist, at least in that area, particularly in the upper outer quadrants, but also throughout the deep breast tissue. Starting pectoral exercises Chest flies are often done starting with 5-pound weights, one in each hand, while lying face up, as in the top left photo above, bringing the hands apart and then raising to meet in the middle. The elbows are kept somewhat bent, and the motions are done smoothly and slowly. Anywhere from 10 to 20 reps are done at a time. Weights are often increased with time to 10 or 15lbs in each hand. Rest days are often used, and these exercises are usually done once or twice per week. A sore sensation can be expected the following day in these muscles, while the lactic acid buildup and microtears of muscle tissue are repaired. The purpose of these exercises is to add end-product to an unwanted chemical reaction: glucose 🡪 pyruvate 🡪 lactate, which is the cancer machine, in order to give cancer no more reason to exist, at least not in the breasts. Three French women pull a plow in 1914, which our contemporaries imitate while doing cable pull exercises. https://greatwar-1914.tumblr.com/post/165556014708/three-french-women-pull-a-plow-in-a-famous-image [1] Y Han, J Moore, et al. Do breast quadrants explain racial disparities in breast cancer outcomes? Aug 27 2019. Cancer Causes Control. https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6924513/ [2] D Gaffney, A Tsodikov et al. Diminished survival in patients with inner versus out quadrant breast cancers. Feb 1 2003. J Clin Oncol. 21 (3). 467-72. https://pubmed.ncbi.nlm.nih.gov/12560437/ [3] K Shahar, T Buchholz, et al. Lower and central tumor location correlates with lymphoscintigrphy drainage to the internal mammary chain lymph nodes in breast carcinoma. Feb 22 2005. Cancer. 103 (7). 1323-1329. https://acsjournals.onlinelibrary.wiley.com/doi/10.1002/cncr.20914 [4] S Estourgie, O Nieweg, et al. Lymphatic drainage patters from the breast. Feb 2004. Annals of Surgery. 239 (2). 232-237. https://www.ncbi.nlm.nih.gov/pmc/articles/PMC1356216/ [5] S Estourgie, P Tanis, et al. Should the hunt for internal mammary chain sentinel nodes begin? An evaluation of 150 breast cancer patients. Oct 2003. Ann. Surg. Oncol. 10 (8). 935-941. https://pubmed.ncbi.nlm.nih.gov/14527914/ [6] T Nelson, L Cerviño, et al. Classification of breast computed tomography data. Mar 2008. Med Phys. 35 (3). 1078-1086. https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2706664/ [7] C Briskin, B O’Malley. Hormone action in the mammary gland. Dec 2010. Cold Spring Harb Perspect. Biol. 2 (12). https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2982168/ [8] P Darbre. Underarm cosmetics and breast cancer. J Appl Toxicol. Mar-Apr 2003. 23 (2): 89-95. https://pubmed.ncbi.nlm.nih.gov/12666152/ [9] Penn Medicine. Is deodorant harmful for your health? June 2019. Univ. Penn. https://www.pennmedicine.org/updates/blogs/health-and-wellness/2019/june/deodorant [10] P Darbre, A Aljarrah, et al. Concentrations of parabens in human breast tumours. Jan Feb 2004. J Appl. Toxicol. 24 (1): 5-13. https://pubmed.ncbi.nlm.nih.gov/14745841/ [11] P Harvey, D Everett. Significance of the detection of esters of p-hydroxybenzoic acid (parabens) in human breast tumours. Jan 8 2004. J Appl Toxicol. 24 (1). 1-4. https://analyticalsciencejournals.onlinelibrary.wiley.com/doi/10.1002/jat.957 [12] P Darbre. Aluminium, antiperspirants and breast cancer. Sept 2005. J Inorg Biochem. 99 (9). 1912-1919. https://www.sciencedirect.com/science/article/abs/pii/S0162013405001613 [13] M Holmes, W Chen, et al. Physical activity and survival after breast cancer diagnosis. 2005. JAMA 293. 2479-2486. https://jamanetwork.com/journals/jama/fullarticle/200955 [14] D Schmid, M Leitzmann. Association between physical activity and mortality among breast cancer and colorectal cancer survivors: a systematic review and meta-analysis 2014. Ann Oncol. 25. 1293-1311. https://www.annalsofoncology.org/article/S0923-7534(19)36684-0/fulltext [15] F Bianchini, R Kaaks, et al. Weight control and physical activity in cancer prevention. February 21 2022. Obesity Reviews. 3 (1). 5-8. https://onlinelibrary.wiley.com/doi/abs/10.1046/j.1467-789X.2002.00046.x [16] C Huber. Cancer patients’ use of sweeteners: a 7-year controlled study. 2014. Int J Cancer Res Molec Mech. https://sciforschenonline.org/journals/cancer-research/IJCRMM-2-127.php [17] G Brooks. The science and translation of lactate shuttle theory. Apr 3 2018. Cell Metabolism. 27 (4). 757-785. https://www.cell.com/cell-metabolism/fulltext/S1550-4131(18)30186-4 Facebook Twitter Google+ Pinterest Posted in:CancerPhysical Activity / Exercise See more Prev:Stevia Over Other Sweeteners Back: All Posts About the Author Dr. Colleen Huber Dr. Colleen Huber founded the NatureWorksBest Clinic, and now is currently on sabbatical from practicing medicine, while writing books and articles, and staying involved with the clinic. Dr. Huber has served as President of the Naturopathic Cancer Society and co-founded the American Naturopathic Research Institute / Naturopathic Oncology Research Institute. At NatureWorksBest Clinic, the data supporting the clinic’s results in cancer treatment can be found here. Dr. Huber was the principal keynote speaker at the 2015 Euro Cancer Summit, and in 2014 was a speaker at the World Congress on Cancer Science and Therapy, and at the International Congress of Naturopathic Medicine. Many of her health articles have appeared on colleenhuber