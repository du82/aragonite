full_description = "Breast Thermography Over A Mammogram? February 26, 2014 by Dr. Colleen Huber 0 Comments Breast Thermography Medical thermography is not as well known as mammography for breast cancer screening and diagnosis, but there are a number of significant advantages. It is actually more effective at these than standard mammography in certain cases. Thermography is simply a two-dimensional temperature picture of the front of the body, showing hot spots and cooler areas. This is especially useful for breast cancer, because as in other cancers, tumors are greedy for nutrients, and actually create their own blood supply to feed themselves your body’s nutrients, in a process called angiogenesis, meaning new formation of blood vessels. Because blood is warmer than surrounding tissue (fat, bone, muscle, etc.), an excessive pool of blood in an area is a warning of possible cancer activity there. The color and black and white images provided by the thermographer shows these hot spots. An Advantage Of Thermography An advantage of thermography is that it is more sensitive than mammography, and can detect a tumor up to two years earlier than a mammogram. This is a considerable advantage given that a small tumor gives you more options and generally easier options for dealing with it than a larger tumor. Another important advantage of thermography is that it does not involve radiation to the breasts. There is no health risk associated with the procedure, which makes it ideal for repeated annual screening. Out of pocket costs for thermography generally start at about $200, and it is not yet covered by all insurance. Your naturopathic physician or other health care practitioner can further discuss options regarding both thermography as well as standard mammography. Watch this video as I speak about thermography and other questions about cancer. Facebook Twitter Google+ Pinterest Posted in:Cancer See more Prev:Sunshine or Drugs? Which is Better For Depression Back: All Posts Next:Poison, Burn, & Cut – Modern Cancer Treatments About the Author Dr. Colleen Huber Dr. Colleen Huber founded the NatureWorksBest Clinic, and now is currently on sabbatical from practicing medicine, while writing books and articles, and staying involved with the clinic. Dr. Huber has served as President of the Naturopathic Cancer Society and co-founded the American Naturopathic Research Institute / Naturopathic Oncology Research Institute. At NatureWorksBest Clinic, the data supporting the clinic’s results in cancer treatment can be found here. Dr. Huber was the principal keynote speaker at the 2015 Euro Cancer Summit, and in 2014 was a speaker at the World Congress on Cancer Science and Therapy, and at the International Congress of Naturopathic Medicine. Many of her health articles have appeared on colleenhuber.substack.com. Her writing includes her book Choose Your Foods Like Your Life Depends On Them, Manifesto for a Cancer Patient, and other books and articles. Dr. Huber authored the largest and longest study in medical history on sugar intake in cancer patients, which was reported in thousands of media outlets around the world in 2014. Her academic writing has appeared in The Lancet and Cancer Strategies Journal, and other medical journals. Leave a ReplyYou must be logged in to post a comment."
