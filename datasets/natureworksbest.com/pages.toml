full_description = "Breast Thermography Over A Mammogram? February 26, 2014 by Dr. Colleen Huber 0 Comments Breast Thermography Medical thermography is not as well known as mammography for breast cancer screening and diagnosis, but there are a number of significant advantages. It is actually more effective at these than standard mammography in certain cases. Thermography is simply a two-dimensional temperature picture of the front of the body, showing hot spots and […] Posted in:Cancer More Sunshine or Drugs? Which is Better For Depression February 2, 2014 by Dr. Colleen Huber 0 Comments Sunshine, Food, Exercise And Supplements vs Drugs The majority of my patients who have come to me on anti-depressant drugs have been able to get off of them, with the help of some of the following recommendations. Some cases of depression are mostly the result of inadequate perfusion and thus an inadequately functioning brain. One […] Posted in:CancerUncategorized More The Sleep Checklist: How To Help Your Body Sleep December 16, 2013 by Dr. Colleen Huber 0 Comments Make Sure Of The Following Before Considering Sleep Sedatives Don’t Ignore Thirst Early In The Day. Many people don’t feel thirsty early in the day and forget to drink water. Then, during your activities over the course of the day, you continually breathe out water vapor and continually sweat at least small unnoticeable amounts. That […] Posted in:CancerUncategorized More How To Get Kids To Eat Healthy – Part I November 22, 2013 by Dr. Colleen Huber 0 Comments Part I During at least some of childhood the grass is definitely greener elsewhere. One of the biggest challenges to your family’s healthy lifestyle is your children’s perception that other people are privileged simply because they eat differently. The parents’ strategic awareness and preparation for the child’s fascination with the Standard American Diet (SAD) is […] Posted in:CancerUncategorized More Halloween: How To Do It Healthier This Year October 29, 2013 by Dr. Colleen Huber 0 Comments A Healthy Halloween As a primary care physician, I see the first real wave of the cold season in the first few weeks after Halloween. Typically, patients will come in with runny nose, sore throat, cough, etc., with a story that goes something like this: “Well, the kids brought home these huge bags of Halloween […] Posted in:CancerUncategorized More"
