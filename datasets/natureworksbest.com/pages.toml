description = "Dr. Colleen Huber founded the NatureWorksBest Clinic, and now is currently on sabbatical from practicing medicine, while writing books and articles, and staying involved with the clinic. Dr. Huber has served as President of the Naturopathic Cancer Society and co-founded the American Naturopathic Research Institute / Naturopathic Oncology Research Institute. At NatureWorksBest Clinic, the data supporting the clinic’s results in cancer treatment can be found here. Dr. Huber was the principal keynote speaker at the 2015 Euro Cancer Summit, and in 2014 was a speaker at the World Congress on Cancer Science and Therapy, and at the International Congress of Naturopathic Medicine. Many of her health articles have appeared on colleenhuber.substack.com. Her writing includes her book Choose Your Foods Like Your Life Depends On Them, Manifesto for a Cancer Patient, and other books and articles. Dr. Huber authored the largest and longest study in medical history on sugar intake in cancer patients, which was reported in thousands of media outlets around the world in 2014. Her academic writing has appeared in The Lancet and Cancer Strategies Journal, and other medical journals."
full_description = 'video Cancer & Biochemistry 5 August 19, 2018 by Dr. Colleen Huber 0 Comments var g1_var_1082256576 = {"html_code":"<div id=\"fluid-wrapper-counter-2\" class=\"g1-fluid-wrapper \" style=\"width:968px;\"><div style=\"padding-bottom:56.301652892562%;\"><iframe width=\"968\" height=\"545\" src=\"https:\/\/www.youtube.com\/embed\/V8SHfv9zvnk?feature=oembed&amp;wmode=transparent&amp;autohide=1&amp;autoplay=0&amp;disablekb=0&amp;fs=1&amp;loop=0&amp;enablejsapi=1&amp;rel=0&amp;controls=2&amp;showinfo=0&amp;wmode=transparent&amp;autohide=2&amp;autoplay=0&amp;disablekb=0&amp;fs=1&amp;loop=0&amp;enablejsapi=1&amp;rel=0&amp;controls=2&amp;showinfo=1\" frameborder=\"0\" allow=\"autoplay; encrypted-media\" allowfullscreen><\/iframe><\/div><\/div>"}; WHAT IS ADENINE’S ROLE AGAINST CANCER? Hello, I am Dr. Colleen Huber. It is May 18, 2018, and today I want to talk to you about a nutrient that you have likely never even heard of – adenine, which used to be called Vitamin B4, but not so much anymore, because now we know that it is a part of other B vitamins, B2 and B3 specifically. Adenine is crucial to our building of DNA and RNA – which gives the genetic code that allows us to carry on traits from our ancestors, and create new cells from those templates. But today, we are more interested in another role of Vitamin B4, or adenine. That role is in the major energy molecule of all life: I am talking about ATP. ATP is also known as adenosine triphosphate, and adenine, or Vitamin B4, is an essential precursor molecule of ATP. Adenine, in turn, also is necessary to make new RNA and DNA, as well as carry out just about every major function in our cells. ATP can be seen as a basic unit of energy for cells. Adenine is therefore thought of as one of the most essential molecules for life. Let’s now look at how a lack of vitamin B4 can contribute to cancer. We saw in some of my previous videos how if the electron transport chain is damaged or shut down, it can lead to cancer. Adenine is an essential component of the final end product we need to avoid cancer: ATP. Right here at this point in the electron transport chain, right here near the end, we may not have enough adenine to make ADP, which is a precursor molecule to ATP – If we don’t have enough to make ATP, then the whole road gets closed off again – See how you need ALL of your nutrients!?? – If you don’t have enough adenine to make ATP, then the road is blocked. And again, traffic – biochemical traffic that is – the flow of your food molecules – that traffic gets diverted over here, to the cancer pathway. What you need is to provide yourself the necessary nutrients to keep ALL of this pathway open, and let metabolism flow along its normal pathway. Food sources of vitamin B4 or adenine are: Green, leafy vegetables, Cayenne pepper Berries and Whole grains. I am so happy you are taking an interest in the nutrients that help prevent cancer. That is very gratifying! Please remember that the inactive forms of B vitamins must be converted by a process called methylation that occurs in the liver, in order to become active bio-available forms, which can be absorbed and used by the body. I am Dr. Colleen Huber, it is May 18, 2018, and thanks for watching! Facebook Twitter Google+ Pinterest Posted in:CancerCancer & Biochemistry See more Prev:Cancer & Biochemistry 4 Back: All Posts Next:Cancer & Biochemistry 6 About the Author Dr. Colleen Huber Dr. Colleen Huber founded the NatureWorksBest Clinic, and now is currently on sabbatical from practicing medicine, while writing books and articles, and staying involved with the clinic. Dr. Huber has served as President of the Naturopathic Cancer Society and co-founded the American Naturopathic Research Institute / Naturopathic Oncology Research Institute. At NatureWorksBest Clinic, the data supporting the clinic’s results in cancer treatment can be found here. Dr. Huber was the principal keynote speaker at the 2015 Euro Cancer Summit, and in 2014 was a speaker at the World Congress on Cancer Science and Therapy, and at the International Congress of Naturopathic Medicine. Many of her health articles have appeared on colleenhuber.substack.com. Her writing includes her book Choose Your Foods Like Your Life Depends On Them, Manifesto for a Cancer Patient, and other books and articles. Dr. Huber authored the largest and longest study in medical history on sugar intake in cancer patients, which was reported in thousands of media outlets around the world in 2014. Her academic writing has appeared in The Lancet and Cancer Strategies Journal, and other medical journals.'
