description = "Dr. Colleen Huber founded the NatureWorksBest Clinic, and now is currently on sabbatical from practicing medicine, while writing books and articles, and staying involved with the clinic. Dr. Huber has served as President of the Naturopathic Cancer Society and co-founded the American Naturopathic Research Institute / Naturopathic Oncology Research Institute. At NatureWorksBest Clinic, the data supporting the clinic’s results in cancer treatment can be found here. Dr. Huber was the principal keynote speaker at the 2015 Euro Cancer Summit, and in 2014 was a speaker at the World Congress on Cancer Science and Therapy, and at the International Congress of Naturopathic Medicine. Many of her health articles have appeared on colleenhuber.substack.com. Her writing includes her book Choose Your Foods Like Your Life Depends On Them, Manifesto for a Cancer Patient, and other books and articles. Dr. Huber authored the largest and longest study in medical history on sugar intake in cancer patients, which was reported in thousands of media outlets around the world in 2014. Her academic writing has appeared in The Lancet and Cancer Strategies Journal, and other medical journals."
full_description = 'video Cancer & Biochemistry 3 July 25, 2018 by Dr. Colleen Huber 0 Comments var g1_var_1163815266 = {"html_code":"<div id=\"fluid-wrapper-counter-2\" class=\"g1-fluid-wrapper \" style=\"width:968px;\"><div style=\"padding-bottom:56.301652892562%;\"><iframe width=\"968\" height=\"545\" src=\"https:\/\/www.youtube.com\/embed\/J1XXc8Bg7dg?feature=oembed&amp;wmode=transparent&amp;autohide=1&amp;autoplay=0&amp;disablekb=0&amp;fs=1&amp;loop=0&amp;enablejsapi=1&amp;rel=0&amp;controls=2&amp;showinfo=0&amp;wmode=transparent&amp;autohide=2&amp;autoplay=0&amp;disablekb=0&amp;fs=1&amp;loop=0&amp;enablejsapi=1&amp;rel=0&amp;controls=2&amp;showinfo=1\" frameborder=\"0\" allow=\"autoplay; encrypted-media\" allowfullscreen><\/iframe><\/div><\/div>"}; In 2014, our clinic did the largest and longest study in medical history on sugar intake in cancer patients, and we still hold the record till the present: What did we find? Here is the bottom line: Cancer patients who avoided sweetened foods had more than TWICE the survival of those who consumed sweetened foods. Of those who had our IV nutrient treatments for cancer AND avoided sweetened foods, 90% went into remission. Of those who had our IV nutrient treatments and continued eating sweetened foods, only 36% went into remission. That’s 90% versus 36%! Sweeteners were the most decisive factor! This study can be found on our website, NatureWorksBest.com How do I define sweetened foods? Well, from 2006 on, I asked my cancer patients to please AVOID desserts, sweets, sodas and candy, as well as fruit juice and alcohol. Many cancer patients came in with a daily habit of eating several fruits. I also discouraged this, especially extra sweet fruits such as pineapple and banana. I also discourage juicing, because of the speed of the entry of sugar to the bloodstream. Please — eat a salad instead! What happens when a cancer patient eats sugar? Well, we see what goes on from this slide, showing a PET/CT. Now a PET/CT is an ingenious kind of imaging, and is the standard imaging used in oncology for this reason – because the PRECISION of the CT image is overlaid with the CANCER DETECTION that a PET scan does best. The PET by itself is a fuzzy image, but a very true one, because it shows us where the sugar goes – it goes to the cancer. However, the CT overlay is very helpful also, because it helps us to see outlines of organs more clearly, and the CT accurately shows tumor sizes. Now let’s take a look at this PET showing tumors in the liver: Look at this stark contrast between the cancerous tissue and non-cancerous tissue – an AMAZING contrast. Isn’t that something how different the two types of tissue look! See the dark area here where the injected sugar – by the way, in a PET you do get injected with a form of sugar – anyway, you can see the dark area here where the injected sugar shows the cancer as being quite different from the light area – which is the normal tissue. People wonder why I get so excited about this. They tell me, “My oncologist didn’t even mention this. He didn’t even tell me how the PET scan works. And he did not warn me that sugar feeds cancer. In fact, there is a huge candy bowl in his chemotherapy room!” The reason this matters SO VERY MUCH is this: The body builds a tumor out of our own cells – not an outside invader, like bacteria or a virus or a fungus. The body builds a tumor that is very much a part of us. Well, this makes MY job as a naturopathic oncologist very difficult! People ask me, “Can you get rid of my cancer with your IV nutrients?” That’s like asking me to get rid of your left arm without hurting your right arm, with an IV! Impossible, right? EXCEPT for this! Right here, where you see this dramatic contrast – this is what I can use to separate out cancer from non-cancer. This is where your cancerous tissue becomes distinct and apart from your normal tissue – only here, where the sugar goes one way and not so much the other. And that’s why I get so excited – because of the nearly impossible task of extracting cancer out of the body without cutting it out or burning it out – here alone I have some hope of eliminating that cancer, or at least making it metabolically inactive, or at least having it begin to go through apoptosis, to act like normal cells. This is my only hope, really, given the fact that I pledged to First Do No Harm, and so I am not allowed to, and well, I refuse to – poison you. At least, I can take advantage of this CRUCIAL DIFFERENCE between normal and cancerous tissue, and by jumping through that little window, I have my best opportunity to get your cancer into remission. Those of you who have seen our research and our documented studies, and for sure those of you who have been to our clinic, know of the many cancer survivors whom we have gotten into remission without toxic treatments. So it works! But the diet must be diligent. Also, I don’t know how to get cancer into remission with good diet alone. The IV nutrients are also necessary in my opinion. Exercise is also necessary. For those who refuse to exercise, they should get hyperbaric oxygen treatments, because if this natural treatment is going to work, we are going to have to increase oxygen in the body. I discuss all of this more in my book, Manifesto for a Cancer Patient. This book can be purchased on Amazon. Now I want to talk to you about a little of history here: There was a great scientist of the last century – one who does not get nearly enough credit, and that is because his discovery that sugar feeds cancer — OH YES! This has been known for almost 100 years! – is not such a convenient fact for a certain industry. This scientist’s name was Otto Warburg, the world’s leading biochemist of his time and Nobel Prize winner, who first made this discovery that cancer can hardly survive at all in a low sugar environment, and that cancer grows very aggressively in a high sugar environment. But cancer has become very big business. Chemotherapy costs a lot of money, and that financial influence is the dominant one that never shines the proper light on the science behind cancer metabolism. This is a crucial reason that very unfortunately, those of you seeing this video are probably hearing about the sugar cancer connection for the first time. This is a real problem! Every kid grows up knowing that smoking is bad for the lungs. We know that pregnant women should not drink alcohol, because it’s bad for the baby. We all know this. It’s common knowledge! Why aren’t we also told that sugar feeds cancer? Well, it does, and in my next video, if you can stay awake for it, I can get into some of the wonky science, the biochemistry showing just how that happens. Facebook Twitter Google+ Pinterest Posted in:CancerCancer & Biochemistry See more Prev:Cancer & Biochemistry 2 Back: All Posts Next:Cancer & Biochemistry 4 About the Author Dr. Colleen Huber Dr. Colleen Huber founded the NatureWorksBest Clinic, and now is currently on sabbatical from practicing medicine, while writing books and articles, and staying involved with the clinic. Dr. Huber has served as President of the Naturopathic Cancer Society and co-founded the American Naturopathic Research Institute / Naturopathic Oncology Research Institute. At NatureWorksBest Clinic, the data supporting the clinic’s results in cancer treatment can be found here. Dr. Huber was the principal keynote speaker at the 2015 Euro Cancer Summit, and in 2014 was a speaker at the World Congress on Cancer Science and Therapy, and at the International Congress of Naturopathic Medicine. Many of her health articles have appeared on colleenhuber.substack.com. Her writing includes her book Choose Your Foods Like Your Life Depends On Them, Manifesto for a Cancer Patient, and other books and articles. Dr. Huber authored the largest and longest study in medical history on sugar intake in cancer patients, which was reported in thousands of media outlets around the world in 2014. Her academic writing has appeared in The Lancet and Cancer Strategies Journal, and other medical journals.'
