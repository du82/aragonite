description = "Dr. Colleen Huber founded the NatureWorksBest Clinic, and now is currently on sabbatical from practicing medicine, while writing books and articles, and staying involved with the clinic. Dr. Huber has served as President of the Naturopathic Cancer Society and co-founded the American Naturopathic Research Institute / Naturopathic Oncology Research Institute. At NatureWorksBest Clinic, the data supporting the clinic’s results in cancer treatment can be found here. Dr. Huber was the principal keynote speaker at the 2015 Euro Cancer Summit, and in 2014 was a speaker at the World Congress on Cancer Science and Therapy, and at the International Congress of Naturopathic Medicine. Many of her health articles have appeared on colleenhuber.substack.com. Her writing includes her book Choose Your Foods Like Your Life Depends On Them, Manifesto for a Cancer Patient, and other books and articles. Dr. Huber authored the largest and longest study in medical history on sugar intake in cancer patients, which was reported in thousands of media outlets around the world in 2014. Her academic writing has appeared in The Lancet and Cancer Strategies Journal, and other medical journals."
full_description = "Cheap Meat: An Accident Waiting To Happen August 16, 2008 by Dr. Colleen Huber 0 Comments By Jo Robinson The latest fiasco in the U.S. livestock industry is that thousands of hogs and chickens have been raised on feed contaminated with melamine, the same chemical that has sickened thousands of cats and dogs. According to the U.S.D.A., some meat from those hogs and chickens has already entered our food supply. How did this happen? The story begins in China. Melamine is an inexpensive by-product of the coal industry. In a deceptive practice, some Chinese producers have been adding melamine to rice, wheat, and soy meal to make the products appear to contain more protein. (Melamine is not a protein and has no food value, but it is rich in nitrogen and mimics protein on standardized laboratory tests.) Melamine costs less than true sources of protein, so the manufacturer makes more money. The story continues in the United States. In order to lower the cost of pet food production, U.S. companies have been importing cheap protein meal from China. The pet food manufacturers had no way of knowing that some of these products were spiked with melamine. The exact number of dead and sickened pets is unknown. But how did melamine get fed to our pigs and chickens? A common cost-cutting practice in the livestock industry is to supplement animal feed with floor sweepings and other leftovers from pet food manufacturing plants. In recent months, however, some of the sweepings happened to be laced with melamine. In this serpentine fashion, a cost-cutting adulterant that was added to protein meal in China found its way into U.S. pet food, then U.S. livestock feed, and then the food on our dinner tables. The F.D.A. and the U.S.D.A. do not foresee any health consequences from eating melamine-spiced pork and poultry. This may prove to be true. The family pets that died ate the melamine itself; we are eating chickens and pigs that ate the melamine, diluting its concentration. We may have dodged the bullet this time, but as long as we continue to raise our livestock on a least-cost basis, our health is at risk. For example, many cost-cutting practices lower the nutritional value of our meat. Research shows that the nearly universal practice of fattening cattle on straw and grain instead of fresh pasture gives us beef that is higher in total fat and lower in antioxidants and omega-3 fatty acids. The practice causes no immediate harm, but our health may suffer over the long term. Some cost-cutting strategies are deadly. In the 1980s and 90s, feedlot managers tried to save money by feeding cattle scraps back to cattle. The tragic result was mad cow disease. Eating meat contaminated with trace amounts of melamine may cause little or no harm. Eating just one serving of beef from a mad cow can kill you. Adding more governmental oversight is a stop-gap solution. We need a sea change in the way we raise our livestock. We need to raise the animals on their native diets or on quality ingredients that match their original diets as closely as possible. When we feed wholesome feed to our animals, we can serve wholesome food to our families. We are what our animals eat. Jo Robinson is the originator and primary researcher of http://www.eatwild.com/, a science-based website that details the benefits of raising animals on pasture. She is also the author of Pasture Perfect, the Far-Reaching Benefits of Choosing Meat, Eggs, and Dairy Products from Grass-fed Animals. references Bernstein, J., et al. “Depression of Lymphocyte Transformation Following Oral Glucose Ingestion.” American Journal of Clinical Nutrition.1997;30:613. Jeppesen PB,et al. Antihyperglycemic and blood pressure-reducing effects of stevioside in the diabetic Goto-Kakizaki rat. Metabolism. 2003 Mar;52(3):372-8 Jeppesen PB, et al. Stevioside acts directly on pancreatic beta cells to secrete insulin: actions independent of cyclic adenosine monophosphate and adenosine triphosphate-sensitive K+-channel activity. Metabolism. 2000 Feb;49(2):208-14. Facebook Twitter Google+ Pinterest Posted in:CancerUncategorized See more Prev:Herb Of The Month: Coleus Forskohlii Back: All Posts Next:Herb Of The Month: Wood Betony About the Author Dr. Colleen Huber Dr. Colleen Huber founded the NatureWorksBest Clinic, and now is currently on sabbatical from practicing medicine, while writing books and articles, and staying involved with the clinic. Dr. Huber has served as President of the Naturopathic Cancer Society and co-founded the American Naturopathic Research Institute / Naturopathic Oncology Research Institute. At NatureWorksBest Clinic, the data supporting the clinic’s results in cancer treatment can be found here. Dr. Huber was the principal keynote speaker at the 2015 Euro Cancer Summit, and in 2014 was a speaker at the World Congress on Cancer Science and Therapy, and at the International Congress of Naturopathic Medicine. Many of her health articles have appeared on colleenhuber.substack.com. Her writing includes her book Choose Your Foods Like Your Life Depends On Them, Manifesto for a Cancer Patient, and other books and articles. Dr. Huber authored the largest and longest study in medical history on sugar intake in cancer patients, which was reported in thousands of media outlets around the world in 2014. Her academic writing has appeared in The Lancet and Cancer Strategies Journal, and other medical journals. Leave a ReplyYou must be logged in to post a comment."
