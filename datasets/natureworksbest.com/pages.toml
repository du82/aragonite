description = "Dr. Colleen Huber founded the NatureWorksBest Clinic, and now is currently on sabbatical from practicing medicine, while writing books and articles, and staying involved with the clinic. Dr. Huber has served as President of the Naturopathic Cancer Society and co-founded the American Naturopathic Research Institute / Naturopathic Oncology Research Institute. At NatureWorksBest Clinic, the data supporting the clinic’s results in cancer treatment can be found here. Dr. Huber was the principal keynote speaker at the 2015 Euro Cancer Summit, and in 2014 was a speaker at the World Congress on Cancer Science and Therapy, and at the International Congress of Naturopathic Medicine. Many of her health articles have appeared on colleenhuber.substack.com. Her writing includes her book Choose Your Foods Like Your Life Depends On Them, Manifesto for a Cancer Patient, and other books and articles. Dr. Huber authored the largest and longest study in medical history on sugar intake in cancer patients, which was reported in thousands of media outlets around the world in 2014. Her academic writing has appeared in The Lancet and Cancer Strategies Journal, and other medical journals."
full_description = "The Sugar Cancer Study Explained April 23, 2014 by Dr. Colleen Huber 1 Comment #g1-section-1.g1-section {background-color: #ffffff; background-repeat:no-repeat; background-position:left top; background-attachment:static; border-width:4px 0; padding-bottom:4px; padding-top:4px;} Eating Sugar Doubles Risk Of Death In Cancer Patients Groundbreaking Seven-Year Study Shows The Deadly Role Of Sugar For Cancer Patients A groundbreaking, seven-year human study, by Dr. Colleen Huber, NMD and her team at Nature Works Best, an alternative cancer clinic in Tempe, Arizona, exposes a severe threat to the survival of cancer patients – the consumption of sweetened food or drinks. Dr. Huber led a team of physicians in a seven-year interventional study where cancer patients avoided all types of sugar: honey, maple syrup, corn syrup, high fructose corn syrup, plant nectars, alcohol and fruit juices (which are high on the glycemic index). This is the first large, human, interventional study that has indicted sugar as deadly for cancer patients. All previous studies were in mice, or retrospective, or in fewer than 20 human subjects. Methods Since 2006, this clinic has collected data on sugar consumption in cancer patients, and has actively recommended, but never enforced in any way, avoiding the consumption of sweetened foods (except with the sweetener Stevia Rebaudiana, which has no sugar content or sugar alcohol content). In this controlled interventional study, we followed the diets and outcomes of all 317 cancer patients who came to our clinic with a diagnosis of cancer, and who stayed at least two weeks in our care. We treated with natural methods alone, choosing among methods with research-established anti-neoplastic effect, both oral and intravenous, dietary and supplemented, nutritional and herbal, having a preference for those with high patient tolerance and compatibility, and varying with individual needs and tolerance, according to the standard naturopathic principle of “Treat the whole person.” The Sugar & Cancer Study Results The results of the study showed the group of cancer patients who were steadfast in the recommended naturopathic treatments, but did not avoid eating sugar had a remission rate of 36%. The second group who were also steadfast in recommended naturopathic treatments, but did avoid eating sugar had a remission rate of 90%. That is they did not eat: sugar, cane sugar, honey, maple syrup, corn syrup, high fructose corn syrup, plant nectars, alcohol or fruit juices (except the sweetener Stevia Rebaudiana). Sweet Eaters Table 5: Steadfast patients, by stage of cancer Stage Total patients treated until remission or death Remission Died Remission / Total = Success Rate Total 25 9 16 36% Stage I through early Stage IV 22 9 13 41% I 5 4 1 80% II 4 3 1 75% III 3 0 3 0% Early IV 10 2 8 20% Late IV 3 0 3 0% Sweetener Avoiders Table 6: Steadfast patients, by stage of cancer Stage Total patients treated until remission or death Remission Died Remission / Total = Success Rate Total 158 142 16 90% Stage I through early Stage IV 139 135 4 97% I 60 60 0 100% II 26 26 0 100% III 14 14 0 100% Early IV 39 35 4 90% Late IV 19 7 12 37% All Patients Steadfast In Our Recommended Natropathic Treatments Sugar Eaters as Well as Sugar Avoiders Table 4: Steadfast patients, by stage of cancer Stage Total patients treated until remission or death Remission Died Remission / Total = Success Rate Total 183 151 32* 83% Stage I through early Stage IV 161 144 17 (including DDD) 89% I 65 64 1 98% II 30 29 1 97% III 17 14 3 82% Early IV 49 37 12 76% Late IV 22 7 15 32% *This number includes those who did not follow our dietary recommendations. Read the full report here – Eating sugar doubles risk of death in cancer patients. About Us Dr. Colleen Huber is the founder and director of Nature Works Best, a natural cancer clinic in Tempe, Arizona that focuses on holistic, naturopathic, and alternative cancer treatments – no chemotherapy or radiation is used. Treatment consists of Dr. Huber’s nutrient infusions, together with a simple food plan, which in steadfast patients, has achieved very high confirmed and assumed remission rates across all types and stages of cancer. While not all patients choose to follow the dietary restrictions, the infusion treatment plan alone has resulted in an unprecedented remission rate. Patients arrive at the clinic with different types of cancer, sometimes with different co-morbidities, and different patterns of metastases. All have done well, with the exception of some late Stage IV patients who reported they had already been treated by conventional cancer treatments. In the last five years, the clinic has lost only 32 of 317 patients. Facebook Twitter Google+ Pinterest Posted in:Cancer See more Prev:Migraines & Magnesium Back: All Posts Next:Dr. Weston Price – Widespread Disease Is A Modern Phenomenon About the Author Dr. Colleen Huber Dr. Colleen Huber founded the NatureWorksBest Clinic, and now is currently on sabbatical from practicing medicine, while writing books and articles, and staying involved with the clinic. Dr. Huber has served as President of the Naturopathic Cancer Society and co-founded the American Naturopathic Research Institute / Naturopathic Oncology Research Institute. At NatureWorksBest Clinic, the data supporting the clinic’s results in cancer treatment can be found here. Dr. Huber was the principal keynote speaker at the 2015 Euro Cancer Summit, and in 2014 was a speaker at the World Congress on Cancer Science and Therapy, and at the International Congress of Naturopathic Medicine. Many of her health articles have appeared on colleenhuber.substack.com. Her writing includes her book Choose Your Foods Like Your Life Depends On Them, Manifesto for a Cancer Patient, and other books and articles. Dr. Huber authored the largest and longest study in medical history on sugar intake in cancer patients, which was reported in thousands of media outlets around the world in 2014. Her academic writing has appeared in The Lancet and Cancer Strategies Journal, and other medical journals. One Ping Pingback: Study Finds Eating Sugar Doubles Risk of Death ... Leave a ReplyYou must be logged in to post a comment."
