title = "Nature Works Best"
description = "Dr. Colleen Huber founded the NatureWorksBest Clinic, and now is currently on sabbatical from practicing medicine, while writing books and articles, and staying involved with the clinic. Dr. Huber has served as President of the Naturopathic Cancer Society and co-founded the American Naturopathic Research Institute / Naturopathic Oncology Research Institute. At NatureWorksBest Clinic, the data supporting the clinic’s results in cancer treatment can be found here. Dr. Huber was the principal keynote speaker at the 2015 Euro Cancer Summit, and in 2014 was a speaker at the World Congress on Cancer Science and Therapy, and at the International Congress of Naturopathic Medicine. Many of her health articles have appeared on colleenhuber.substack.com. Her writing includes her book Choose Your Foods Like Your Life Depends On Them, Manifesto for a Cancer Patient, and other books and articles. Dr. Huber authored the largest and longest study in medical history on sugar intake in cancer patients, which was reported in thousands of media outlets around the world in 2014. Her academic writing has appeared in The Lancet and Cancer Strategies Journal, and other medical journals."
full_description = "Facts About Cancer That May Surprise You Colleen Huber, NMD April 20, 2014 by Dr. Colleen Huber 1 Comment Facts About Cancer That Will Likely Surprise You With page references to The Data 1) The worst thing you can eat while having cancer is sweeteners (sugar, fructose, artificial sweeteners, honey, maple syrup, etc. But stevia is okay. (p.4) 2) It is not a good idea to postpone natural treatments until after chemotherapy stops working. (p.23). 3) Sometimes our treatments did not succeed, but it cannot be assumed that conventional treatments would succeed when ours did not. (p.27). 4) Many people do not get a prompt confirmation of remission, but do well year after year anyway. (p.29). 5) A cancer patient who starts to feel better and stronger may sometimes develop a strange viewpoint that cancer is not very threatening, because they were able to defeat it so easily. (Most people know better than this.) (p.28). 6) There are people who wait years with a visible growing mass before seeing a doctor. (I wouldn’t do that if I were you.) (p.26). 7) Early Stage IV patients usually do well with our treatments. Late Stage IV patients have not been so lucky. (Table 5, pp. 24-25). 8) Surgery has combined with natural treatments very successfully in many cases. (p.25). 9) One way of looking at the status of cancer patients is to contact them every year and ask how they’re doing. It’s a lot more practical than expecting everybody to keep getting PET/CT scans. (p.22) 10) Forget finding a “magic bullet” for cancer. The reason that cancer still has such a high mortality rate is that the oncologists are going about it all wrong. You have to counteract every single mechanism that cancer uses to assault the body, and it all must happen simultaneously. And the only way a patient is going to tolerate that is with natural treatments, because they are tolerable, and chemotherapy is poorly tolerated. Only by doing this, do you have a good chance of defeating cancer. (pp.1, 3-4) Facebook Twitter Google+ Pinterest Posted in:Cancer See more Prev:Cure For The Common Cold Back: All Posts Next:Migraines & Magnesium About the Author Dr. Colleen Huber Dr. Colleen Huber founded the NatureWorksBest Clinic, and now is currently on sabbatical from practicing medicine, while writing books and articles, and staying involved with the clinic. Dr. Huber has served as President of the Naturopathic Cancer Society and co-founded the American Naturopathic Research Institute / Naturopathic Oncology Research Institute. At NatureWorksBest Clinic, the data supporting the clinic’s results in cancer treatment can be found here. Dr. Huber was the principal keynote speaker at the 2015 Euro Cancer Summit, and in 2014 was a speaker at the World Congress on Cancer Science and Therapy, and at the International Congress of Naturopathic Medicine. Many of her health articles have appeared on colleenhuber.substack.com. Her writing includes her book Choose Your Foods Like Your Life Depends On Them, Manifesto for a Cancer Patient, and other books and articles. Dr. Huber authored the largest and longest study in medical history on sugar intake in cancer patients, which was reported in thousands of media outlets around the world in 2014. Her academic writing has appeared in The Lancet and Cancer Strategies Journal, and other medical journals. One Ping Pingback: Food Cravings And Mineral Deficiencies | Natural Medicine Box Leave a ReplyYou must be logged in to post a comment."
