title = "Nature Works Best"
description = "Dr. Colleen Huber founded the NatureWorksBest Clinic, and now is currently on sabbatical from practicing medicine, while writing books and articles, and staying involved with the clinic. Dr. Huber has served as President of the Naturopathic Cancer Society and co-founded the American Naturopathic Research Institute / Naturopathic Oncology Research Institute. At NatureWorksBest Clinic, the data supporting the clinic’s results in cancer treatment can be found here. Dr. Huber was the principal keynote speaker at the 2015 Euro Cancer Summit, and in 2014 was a speaker at the World Congress on Cancer Science and Therapy, and at the International Congress of Naturopathic Medicine. Many of her health articles have appeared on colleenhuber.substack.com. Her writing includes her book Choose Your Foods Like Your Life Depends On Them, Manifesto for a Cancer Patient, and other books and articles. Dr. Huber authored the largest and longest study in medical history on sugar intake in cancer patients, which was reported in thousands of media outlets around the world in 2014. Her academic writing has appeared in The Lancet and Cancer Strategies Journal, and other medical journals."
full_description = "Poison, Burn, & Cut – Modern Cancer Treatments March 22, 2014 by Dr. Colleen Huber 0 Comments Chemo, Radiation & Surgery – Poison, Burn, & Cut On the most visible side of the whole field of cancer are chemotherapy, radiation and surgery. Some cancer patients refer to these simply as “poison, burn and cut.” For all the drastic effects on the body of such treatments, they have been the treatment of choice for the vast majority of cancer patients. Of course, many of these people do not know that alternatives exist, and are not informed of natural medical alternatives by anyone they know, least of all their doctors. Even more boldly, the advocates of chemo, radiation and surgery in the medical community are in the forefront of the news media talking about an imminent “cure” for cancer within the next few years, with themselves cast as the leading roles in the forefront of the search for a cure. Meanwhile, as if in a completely different plane of reality, there are those of us who work with cancer patients and natural treatments having a very different, very positive and health-affirming experience, and are not anywhere near the attention of the media regarding a possible cure. The reason for this is that nearly a century of intimidation has taught those of us who practice natural medicine that we’d better adhere to some basic guidelines regarding our place in the world. These are: That our place is at the outskirts of the medical field, as enforced by the FDA, and by our exclusion from hospital privileges, and that if we know what’s good for us, we’d better not forget that; that medical doctors have a higher social rank and consider themselves to be at a more powerful and authoritative professional rank than any other health care practitioner; That natural medicine must be suppressed to the point that it is merely complementary to the mainstream medicine of drugs and surgery and must only be used to the extent that it does not interfere with or preclude mainstream medicine; That regardless of the successes that we in natural medicine have had getting cancer patients into remission or helping them to stay in remission, we must never dare to express to anyone else (other health care professionals, cancer patients, the public in general, or the media) that we have had those successes; That we must pretend that there is freedom of speech regarding health and medicine despite the above severe restrictions that exist on that freedom, and that we should not complain about those restrictions. Natural Medicine From those outside the mainstream medical profession, including former insiders, much has been written about the mainstream efforts to exclude natural medicine. A fascinating exploration of this is Dr. Ralph Moss’s book The Cancer Industry, in which he describes his experiences as a cancer researcher and his fall from the cancer establishment once he disclosed his research showing a natural method to be more effective than mainstream methods at eliminating tumors. In fact, there are a number of natural cancer treatments that have shown greater effect than mainstream treatments. Because of inadequate and incomplete information about all the available natural cancer treatments, many patients make choices among these based on what they happen to hear about through the grapevine or stumble across on the internet. At our office, we have been very fortunate to be able to get many of our cancer patients into remission, with very few coming out of remission. For me, as their physician, I have to acknowledge what has worked in cancer treatment and what does not. This is the only way that we can maintain such good results. The most effective strategy for us has definitely been a multiple treatment strategy. I emphasize diet with my cancer patients as much as the individual natural medical treatments. In all cases, my treatment of cancer is aggressive. That is, we attack the cancer continually. However, in my practice, my cancer treatment is entirely natural. I use no chemotherapy or other pharmaceuticals to fight cancer. Treatments are entirely tailored to the individual. A breast cancer patient will get a different treatment protocol than a lung cancer patient. And different individuals with similar cancers may have somewhat different treatments. Regardless of whether the treatments are natural or mainstream, these must be aggressive, simply because cancer is a very aggressive disease. Either you kill it, or it kills you, and this happens continually. Cancer has been called a race against time. Unlike many other diseases processes, in which the patient has the option of waiting and watching and pondering the various options, your best chance of defeating cancer is with an early start in fighting it. We have also succeeded in helping people who started late, but that has come at the cost of a huge amount of time fighting the cancer, with additional expense to the patient. Patients have traveled from various parts of the west and Midwest for the cancer treatments that we offer at our office. Because it usually takes a number of months, usually at least 2-3 months, up to at least several months, to get a patient into remission, it is usually a good idea for patients to plan on renting a place to live while here in the Phoenix area for the duration of the treatments. * * * * * * * * Studies continue to affirm that a majority of cancer patients use some form of natural medicine. A brief summary follows: Broom A, Tovey P. Exploring the Temporal Dimensions in Cancer Patients’ Experiences of Nonbiomedical Therapeutics. Qual Health Res. 2008 Oct 27. Buettner C, Kroenke CH, Phillips RS, Davis RB, Eisenberg DM, Holmes MD. Correlates of use of different types of complementary and alternative medicine by breast cancer survivors in the nurses’ health study. Breast Cancer Res Treat. 2006 Nov;100(2):219-27. Epub 2006 Jul 5. Post-White J, Fitzgerald M, Hageness S, Sencer S. Complementary and Alternative Medicine Use in Children With Cancer and General and Specialty Pediatrics. J Pediatr Oncol Nurs. 2008 Oct 20. Robotin MC, Penman AG. Integrating complementary therapies into mainstream cancer care: which way forward? Med J Aust. 2006 Oct 2;185(7):377-9. Sparber A, Bauer L, Curt G, Eisenberg D, Levin T, Parks S, Steinberg SM, Wootton J. Use of complementary medicine by adult patients participating in cancer clinical trials. Oncol Nurs Forum. 2000 May;27(4):623-30. Swarup AB, Barrett W, Jazieh AR. The use of complementary and alternative medicine by cancer patients undergoing radiation therapy. Am J Clin Oncol. 2006 Oct;29(5):468-73. Weiger WA, Smith M, Boon H, Richardson MA, Kaptchuk TJ, Eisenberg DM. Advising patients who seek complementary and alternative medical therapies for cancer. Ann Intern Med. 2002 Dec 3;137(11):889-903. Erratum in: Ann Intern Med. 2003 Jul 15;139(2):155. Studies done throughout the world, in the US, UK, Australia, Turkey, Brazil, Norway, Switzerland, and The Netherlands show that CAM (complementary and alternative medicine) is being used everywhere. Facebook Twitter Google+ Pinterest Posted in:Treatments See more Prev:Breast Thermography Over A Mammogram? Back: All Posts Next:Cure For The Common Cold About the Author Dr. Colleen Huber Dr. Colleen Huber founded the NatureWorksBest Clinic, and now is currently on sabbatical from practicing medicine, while writing books and articles, and staying involved with the clinic. Dr. Huber has served as President of the Naturopathic Cancer Society and co-founded the American Naturopathic Research Institute / Naturopathic Oncology Research Institute. At NatureWorksBest Clinic, the data supporting the clinic’s results in cancer treatment can be found here. Dr. Huber was the principal keynote speaker at the 2015 Euro Cancer Summit, and in 2014 was a speaker at the World Congress on Cancer Science and Therapy, and at the International Congress of Naturopathic Medicine. Many of her health articles have appeared on colleenhuber.substack.com. Her writing includes her book Choose Your Foods Like Your Life Depends On Them, Manifesto for a Cancer Patient, and other books and articles. Dr. Huber authored the largest and longest study in medical history on sugar intake in cancer patients, which was reported in thousands of media outlets around the world in 2014. Her academic writing has appeared in The Lancet and Cancer Strategies Journal, and other medical journals. Leave a ReplyYou must be logged in to post a comment."
