full_description = "Welcome To Naturopathy Works Naturopathic Primary Care Clinic When I see all the unhealthy people around me, I thank God my PCP is a naturopath. Naturopathic Medicine Naturopathic physicians are naturopathic doctors (ND), or naturopathic medical doctors (NMD). After graduation from a four-year college or university, naturopaths are trained in four-year medical colleges just as other physicians are. Naturopathic Medical Doctors The difference is that in naturopathic medical school, in addition to learning such basic medical sciences as anatomy, physiology, biochemistry, microbiology, pathology, pharmacology, immunology, histology, neuroscience and genetics, naturopaths take classroom courses in the clinical sciences: obstetrics, gynecology, urology, cardiology, pulmonology, gastroenterology, endocrinology, rheumatology, oncology, gerontology, otorhinolaryngology and dermatology. Of course we aslo learn the naturopathic therapies. These include: clinical nutrition (that is nutrition as both a healing therapy and applied biochemistry), botanical medicine (nutritive and therapeutic herbs), homeopathy, Traditional Chinese Medicine such as acupuncture and Chinese herbs, as well as environmental medicine, physical medicine and hydrotherapy. Naturopaths are trained both in the classroom and in a variety of clinical settings. Throughout the naturopathic medical curriculum and professional careers naturopaths are required to take board exams to ensure that both the training and skills come up to the standards required across North America for the naturopathic profession. Just as for medical doctors and osteopaths, naturopathic physicians are required to take Continuing Education courses periodically in order to stay at peak competence. Naturopathic Physicians Are Licensed To Diagnose And Treat Disease In Arizona, naturopathic physicians are licensed to diagnose and treat disease with any combination of the therapies listed above. Thirteen other states, including the recent additions of California and Idaho, also license naturopathic physicians. So does every province in Canada. The difference with other doctors is this: a naturopath can help you feel much better and get rid of cancer without drugs. How is this possible? The licensed naturopath receives more classroom hours in medical sciences and natural therapies and their application to patients than any other type of physician. By the time naturopathic students get to the clinical training part of their curriculum, they know how to apply herbs, homeopathy, acupuncture, nutrients, physical manipulation, temperature modulation and detoxification for various disease conditions. They then still have two more years of clinical training to apply and refine those skills. At Nature Works Best, licensed NMD’s (Naturopathic Medical Doctors), have been classroom and clinically trained to practice medicine using herbs, homeopathy, nutrition, traditional Chinese medicine, hydrotherapy and physical medicine, as well as environmental medicine. How Much Worse Will Your Health Get Before You Finally Consult With a Naturopathic Physician? Meet Our Doctors For Naturopathy Works Primary Care Clinic Contact Us At The Number Below. Call Us 480-839-2800 Setup Your Apointment Facebook Twitter Google+ Pinterest"
