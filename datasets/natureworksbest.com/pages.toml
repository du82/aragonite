full_description = "Herb Of The Month: Gotu Kola September 10, 2013 by Dr. Colleen Huber 0 Comments Gotu kola (Centella asiatica) Gotu kola (Centella asiatica)is especially helpful for would healing and minimizing scar tissue at the site of a wound. Gotu kola has triterpenoids, a chemical compound that is useful for strengthening and repairing skin. It does this by stimulating blood flow to a wound and thereby concentrating antioxidants at a wound to stimulate healing. It is quite helpful in topical form; just make sure that if the skin is not intact over the wound that you have gotten an antiseptic topical preparation of gotu kola from your doctor. Otherwise, it can still be quite helpful even after the skin is intact. Gotu kola is also useful for varicose veins, because it improves the tone of the walls of the veins. The problem in varicose veins is that the walls are thin and thus leak fluid out, causing edema. Gotu kola prevents this problem and helps restore venous wall tone, which in turn relieves edema. Gotu kola is a native of East Asia, and should not be confused with kola nut, which is a plant of African origin. Gotu kola has another component however, asiaticoside, which has been associated with tumor growth in laboratory mice. So if there is any history of skin cancers, it would be best to avoid gotu kola. If taking it for skin lesions or varicose veins, try to limit your use of it to one month. Take a one-month break and then go back to it, to allow your body time to eliminate the problem compound. Facebook Twitter Google+ Pinterest Posted in:Cancer See more Prev:What To Look For In A Supplement Back: All Posts Next:Surgery: Speed Healing With Nature’s Help About the Author Dr. Colleen Huber Dr. Colleen Huber founded the NatureWorksBest Clinic, and now is currently on sabbatical from practicing medicine, while writing books and articles, and staying involved with the clinic. Dr. Huber has served as President of the Naturopathic Cancer Society and co-founded the American Naturopathic Research Institute / Naturopathic Oncology Research Institute. At NatureWorksBest Clinic, the data supporting the clinic’s results in cancer treatment can be found here. Dr. Huber was the principal keynote speaker at the 2015 Euro Cancer Summit, and in 2014 was a speaker at the World Congress on Cancer Science and Therapy, and at the International Congress of Naturopathic Medicine. Many of her health articles have appeared on colleenhuber.substack.com. Her writing includes her book Choose Your Foods Like Your Life Depends On Them, Manifesto for a Cancer Patient, and other books and articles. Dr. Huber authored the largest and longest study in medical history on sugar intake in cancer patients, which was reported in thousands of media outlets around the world in 2014. Her academic writing has appeared in The Lancet and Cancer Strategies Journal, and other medical journals. Leave a ReplyYou must be logged in to post a comment."
