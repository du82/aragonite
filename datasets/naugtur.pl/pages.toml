["https://naugtur.pl/writes/page/3"]
title = "Naugtur's scribbles"
full_description = '23. February 2017 in English Chaos Monkey for PM2 The term Chaos Monkey was coined by Netflix - it’s a tool that kills your production machines at random. more 06. September 2016 in Polski Panel dyskusyjny React vs Angular Po miesiącach wytężonej pracy i ciągłego przekładania na później, oddaję w wasze ręce… uszy? słuchawki? nagranie z panelu dyskusyjnego Rect vs Angular, który miałem okazję moderować w lutym tego roku. more 13. May 2015 in English Everything is an array index Javascript engines never cease to amuse me. Let’s look at our good old Array.prototype.splice [1,2,3].splice(0,1) //returns [1] [1,2,3].splice(1,1) //returns [2] [1,2,3].splice(undefined,1) // 1 [1,2,3].splice(false,1) // 1 [1,2,3].splice(true,1) // 2! Ok, so splice is accepting non-numbers and it’s casting them to booleans and then to numbers, right? Wrong. [1,2,3].splice({},1) // 1 [1,2,3].splice("",1) // 1 [1,2,3].splice("one",1) // 1 Confused? That’s still pretty consistent! Check this out: [1,2,3].splice([],1) //1 [1,2,3].splice([1],1) //2 [1,2,3].splice([2],1) //3 [1,2,3].splice([1,2],1) //1 Go home javascript, you’re drunk. more'
year_published = 2017
