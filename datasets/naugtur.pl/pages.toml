title = "Shared CI config with versioning - Naugtur's scribbles"
full_description = 'Gitlab CI is one of a bunch of CIs configurable with a file in the repository. With over 25 repositories sharing a similar configuration maintenance becomes annoying. My team is building integrations. We can’t seem to stop. There’s over 20 of them now and each has a build pipeline. We even managed to get them to be really consistent in terms of tooling, builds and deployment. sed in a loop was my editor of choice for a while. Now with everything reaching consistency, it’s time to address the overlap. But how? .gitlab-ci.yml defines the pipeline, so it’s not possible to install something external as the first step of the pipeline to affect the rest. .gitlab-ci.yml allows importing external files from the repo or a URL. That sounds great. External URLs don’t support authorization, so we’d have to put some infrastructure in place to have parts of .gitlab-ci.yml shared between projects, but not available to general public. You know, security. Also, if all configs point to the same URL, it’s just one version shared across all pipelines. Instant updates or no updates. The big leap I had to make was to think of .gitlab-ci.yml as code not configuration. If it’s code, I need to reuse it. If I’m reusing code, I put it in a shared library. If I have a library, I version it so I don’t have to spend a few days rolling it out to each project with each change, but can do so progressively when revisiting projects while they continue to work fine with previous version. The idea is not new. We’re using internal libraries to reuse code better. Logger, database abstractions etc. - they’re all packages we install in each app and their development follows semantic versioning. Here’s what I did Turn it into a library: extract common steps to files give them descriptive stage names parametrize with variables I can include a file and use a stage from it, put it in the right order with others etc. Included stages are configured with variables. Variables from the main yaml