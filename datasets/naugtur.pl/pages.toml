["http://naugtur.pl/writes/articles/what-if-were-overestimating-ai-again"]
title = "What if we're overestimating AI again? - Naugtur's scribbles"
full_description = "I wanted the title to say NLP not AI, but Natural Language Processing is not the first meaning of NLP anymore :/ Hi. I’m European. If you want to learn something about cultural differences I’ll teach you one thing today. People from Central Europe are not famous for being optimistic. The Hype(s) The first hype around machines and language I know of was when a demo of speech synthesizer was first presented to general public. There’s a great episode of 99% Invisible podcast detailing that. Now guess when was the first time a machine spoke words that were not pre-recorded. At the New York World’s Fair in 1939 Bell Labs presented “Voder” - short for “Voice Operating Demonstrator.” It was just few months before the Second World War. Everyone was amazed. And while the technology behind it was later used to digitize voice and is still pretty important, people did not get their personal assistant robots to chat with. The next great hype around NLP, off the top of my head, was ELIZA, a chat bot from 1966. It pretended to be a psychotherapist by scanning each sentence you type and figuring out how to ask another question so that it seems on-topic. Everyone thought passing the Turing test is right around the corner. 50 years later, and chatbots still have trouble getting their act together. Well, maybe ELIZA should have become the therapist for Microsoft’s Tay. It could turn out more entertaining than watching SeeBotsChat on Twitch. Sorry for the fast-forward, but from a layman’s perspective the industry has made insignificant progress until just recently. Most of the advancement in chatbots between 1966 and 2006 was a result of careful human labor, still echoed by pre-programmed goodies we tend to enjoy most. cheatsheet: questions to ask Siri There’s a long way to go from parsing a sentence to understanding it in context. The only way to do that known to our civilization is being human. Language is key to the definition of being human (or sentient life as we discover language capacity in animals). Language is a human thing My first job was at a company doing machine translation. It was a while before Google Translate came and destroyed the market. We had a demo plugged into the website, where you could translate 250 characters of text between various languages for free. I added monitoring of inputs and outputs so we could use sentences from random people to identify common errors and fix them. I remember looking at the logs once and noticing something weird. They didn’t look like random logs, they looked like a conversation. Moments later, I understood what I’m looking at. A guy was chatting with a girl and they didn’t know each other’s languages. He copied each line she posted in Russian and translated it to Polish. Then he wrote a response and translated the other way around. I went home with a nice anecdote. The next day I looked at the logs and they were still there. Forging a relationship. Also, good thing our translator knew some medical terms, if you know what I mean. I decided to give them some privacy and turned off the logs. The translation was pretty good compared to what Google initially offered. In other words, translation quality ranged from “weird but I can guess what it meant” to “entirely wrong”. That didn’t stop humans who wanted a relationship. What I want to say here is - natural language processing technology, even imperfect, will affect people’s lives in ways you don’t expect. And now The new hype is here. One can talk to machines and give commands. Provided that they start with the right safeword. Also, if you know someone who has an oldschool answering machine and Alexa in the same room buy them something nice. These machines don’t understand the context and can’t tell if you were meaning or even supposed to talk to them. But that’s ok. If you worked at a startup you know what happens when technology meets reality. MVP, scaling, pivots, product/market fit, move fast and break things. In other words - there will be limitations. Dear customer, if you want to be understood by our product, please use the following grammar structures and limit your vocabulary to avoid archaic phrases. Also, remember our product does not understand metaphors nor sarcasm. Now this is where I get anxious. Claims that language is deteriorating have been made for centuries but what if this time degrading language can really happen? It’s not what it used to be with language adapting to new generations. Unless you’re willing to consider machines the new generation of humanity. I’m not ready to do that. And remember, English is always the most polished case for NLP. What about all those languages that are harder? What about those languages that wouldn’t pay off? Are we ready to loose the language diversity of the World to get a new fancy hands-free communication device to the market early? Do we even have a say? Linguistic Relativity no longer claims language determines thinking entirely, but there is modern research into specific areas where language influences thought. Let’s hope we don’t implement 1984 Orwell’s “newspeak” to limit what we can think. Language processing technology is going mainstream and nothing can stop it now. We have no clue how it’s going to affect our lives. But it will. A lot. Dear reader. If you’re working on some AI for conversational interfaces, I hope you can share my concerns now. We are the generation that makes the choice between keeping and loosing the beautiful mess of human languages. You are one of the very few people who have a vote. Let’s make it count. … AI is coming. Hope for the best, prepare for the worst."
year_published = 2017
