title = "Promises"
full_description = 'The final value is "in" because then callback is always asynchronous, even if the promise is already resolved when .then is called. No stackoverflows if you make an infinite loop If you need to use a standard node-style asymchronous function, no need to manually wrap it with promise constructors. All popular promise implementations have helpers for that Reminder: a promise cannot be resolved multiple times. If someone wants it to, please call them an idiot. Worth mentioning - every retry is a new promise for an identical action. But if one failed, it cannot be repurposed.'
