["http://naugtur.pl/writes/articles/dla-prelegentow"]
title = "Angielski dla prelegentów w 10 minut - Naugtur's scribbles"
full_description = "Sam nie jestem native speaker’em i mam przed sobą jeszcze długą drogę zanim ktoś mnie z takowym pomyli. Ale widziałem nie jednego polskojęzycznego prelegenta mówiącego po angielsku i o ile zwykle mówią bardzo kompetentnie, to dość często powtarza się kilka prostych błędów, które rozpraszają słuchaczy. Piszę ten tekst od ponad roku, a przypadki zbieram od kilku lat. Zebrałem kilka porad, których stosunek wartości do poświęconego czasu wydaje się najlepszy. Jeśli masz niewiele czasu na podszlifowanie angielskiego, te dwie strony tekstu powinny zauważalnie pomóc. Na początek kilka wyrazów, które polskojęzyczni prelegenci często wymawiają nieco dziwnie: Talk Demo Data Code Have Through Which Were, are Header Body Graphics, physics Danger Result Effects Browser Router Jeśli masz 10 minut na podszlifowanie wymowy, skup się na tych wyrazach. Kliknij w link, kliknij w wyraz i spróbuj powtórzyć. Zabawnie robi się gdy zabieramy się za literowanie skrótów. Warto sobie sprawdzić jak dany skrót wymawiają inni. API to trzy osobne dźwięki. Na native speakerach nieporadne literowanie robi negatywne wrażenie, bo jest to jedna z pierwszych rzeczy, których uczą się w szkole w ramach nauki ortografii. Jeśli powiesz Apiii zamiast przeliterować - zwykle nic strasznego się nie stanie - postaraj się jednak unikać konsekwentnego wymawiania skrótu niepoprawnie przez całą prezentację. Zwróć uwagę na bardziej skomplikowane słowa w swojej prezentacji i sprawdź czy umiesz je wymówić. Niby jasne, ale piszę, żeby nie zapomnieć. Inne błędy to już naleciałości z języka polskiego i pozostałości po sposobie nauki charakterystycznym dla naszych szkół i podręczników. Jest kilka takich słów, które zwykle są zupełnie niepotrzebne a prawdopodobnie ich nadużywasz: actually, interesting, really, stuff. Na początek “actually”. O tym można napisać osobny artykuł (wiem bo czytałem). Polacy potrafią wstawić to słowo do co drugiego zdania, przez co brzmią jakby ciągle się komuś sprzeciwiali. To dlatego, że poprawnie użyte “actually” oznacza “tak naprawdę, to…”. Nigdy nie używaj “actually” mając na myśli “aktualnie”. W ogóle jeśli chcesz powiedzieć “actually” i nie jest to początek wypowiedzi, w której poprawiasz swojego rozmówcę - pomiń to słowo. Inne popularne błędy podczas prezentowania: unikaj dodawania “very” do przymiotników, które i tak są już mocne - “very huge” brzmi podobnie jak “bardzo najlepszy” dobrze: “do some work”, źle: “do some job” dobrze: “this is what it looks like”, źle “this is how it looks like” F-bomb i inne - wychodząc od naszych przekleństw łatwo uznać przekleństwa w języku angielskim za lekkie i zabawne. Mimo to unikaj ich w prezentacji jeśli nie masz 100% pewności, że to co powiesz będzie zabawne dla wszystkich “This interesting example” - pozwól publiczności zauważyć, że jest interesujący - nie trzeba im tego zapowiadać. Pamiętaj, że nawet jeśli nie mówisz idealnie, i tak łatwiej Cię zrozumieć niż przeciętnego mieszkańca Wysp Brytyjskich :)"
year_published = 2018
