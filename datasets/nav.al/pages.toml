title = "The Deutsch Files II"
description = "Brett Hall and I interview David Deutsch, physicist and author of The Beginning of Infinity. Also see The Deutsch Files I.  The universality of computation and explanation   So let’s go through The Fabric of Reality—the four theories. More"
full_description = "Jan 26 2024 The Deutsch Files II 1:14:27 Get podcast Apple Google Overcast Spotify YouTube Download Jan 26 2024 Brett Hall and I interview David Deutsch, physicist and author of The Beginning of Infinity. Also see The Deutsch Files I. The universality of computation and explanation Naval: So let’s go through The Fabric of Reality—the four theories. Feel free to start wherever you’d like, but the four theories that you think comprise the Theory of Everything and maybe especially what are the biggest things that even peers, colleagues, contemporaries don’t understand or don’t fully appreciate that makes each one of these deeper or perhaps more counterintuitive or more interesting than it might be at first glance. David Deutsch: Well, I don’t know, we can start with computers. As I said in the book, it’s hard actually to speak about any one of those things without mentioning the other three. But if we start with computers, I think there’s something really fundamental that Turing discovered, or rediscovered, because I think that Babbage and Lovelace also understood it, more or less. That’s the universality of computation, that computation is physically universal. So there are several ways of putting this, like a computer can mimic any physical object, or a computer can perform the computations that any other computer can perform. Now putting it the second way, it sounds like it’s a statement about all kinds of different computers and has nothing to do with trees and garages and windows and so on, but actually it has to do with everything. And therefore, people still, even today, are saying things like, “How do we know the brain is a computer? You’re just assuming the brain is a computer. Like in the 19th century, people thought the brain was a steam engine.” And I think Searle is one of the people who says that kind of thing, or has said that kind of thing. In order to understand Turing’s discovery, you’ve got to understand several things about it. One of which is that it’s a theory of physics and that is denied almost wholesale by mathematicians. So mathematicians are used to the theory of computation being a branch of mathematics. They love the theorems that you can prove and the theorems that you can’t prove and so on. And it’s not that they don’t want to admit, it’s not quite it. It’s that learning to be a mathematician apparently means adopting a certain worldview that makes it very hard to understand that computation is a physical process and is governed by laws of physics, which could be different. Whereas the laws of logic, they think, couldn’t be different, and therefore that things like whether P equals NP and whether the brain is a computer and so on isn’t a matter of physics. But it is, and the best physics we know (which could be wrong), says that computers are universal, that in a certain sense Turing’s computers are universal, and in a certain sense quantum computers are universal, or will be when they’re built, if they’re built. Brett Hall: Just on this, how do we know the brain is a computer? Turing’s thesis would say that all physical processes can be computed. So what a tree is doing, we can write a program and a Turing machine would be able to capture that. But the tree is not a computer, but the brain is? David: Well, the tree isn’t a general purpose computer. But you can think of Turing’s thesis, whatever you call it, the other way around as well, because the reason he wanted to make this imaginary machine out of paper is not that he wanted to understand paper, or as Feynman said he should have, but that he wanted to have a model of computation and he wanted to be able to say, to conjecture that it is obvious that anything that can be computed can be computed by this paper. Now, that means that he’s also assuming that this paper can also compute whatever a tree can compute, because you could regard the tree as a computer, and then Turing’s saying whatever it can compute is a subset of what Turing machines can compute and Turing machines are the ultimate. There’s nothing beyond that. That’s another thing that’s really important that when it comes to universality of explanation, people don’t get it because they don’t even get the universality of computation. They don’t understand that if someone says, “What if the aliens come from Alpha Centauri and they have better computers than us?” It’s impossible. They can have computers that are faster and have more memory, but that’s it. Our computers are the limit of what can be computed by anything in the universe. Unless quantum theory is wrong and so on, but that’s not what they’re saying. They’re not saying maybe quantum theory is wrong. They’re failing to make the connection in Turing’s argument between physical objects and mathematical objects—imaginary paper and anything else, like trees. I don’t know if that’s the thing that people tend to get wrong, but that’s one thing that I’ve seen a lot lately. The growth of knowledge begins with problems Naval: And that leads us into the others, both epistemology and quantum theory. Let’s go to the one where you, even though you may deny it, where I think you’ve made the most original contributions after computation, which is epistemology. We have to invoke his name just to point to it, but Popperian epistemology. What do people not appreciate or perhaps overlook or get wrong or not understand? Or is there another way of approaching it that might help people understand the fundamentals? David: Yeah, it’s more of another way of approaching it. So people do credit Popper with certain things, but they are unimportant things by comparison with his actual philosophical discoveries. Like that scientific theory ought to be testable. That’s true, you know, or 99 percent true, or something like that, and it is reasonably important in order to distinguish things, as Popper wanted to do, to distinguish things like fundamental physics from Marxism. So it’s useful for that, but it’s not such a big deal. I think my colleague Matjaž Leonardis said last year that to him the most important concept in Popper is the concept of a problem. Once you’ve understood what Popper means by a problem, you have this other way of understanding what epistemology is and so on. And I think I’ve come around to agreeing with that, because all previous epistemologies assumed that knowledge is, well, sometimes it’s called justified true belief, but I think it’s wider than that. I think the misconception is that we want knowledge because we want to rely on it, and therefore, wherever it comes from, which is mysterious, but that better be reliable too. That’s the intuitive idea that I think most people have and that most philosophers had over the millennia. Therefore, you want to say, well, what is absolutely certain? Is it the sayings of the gods, or of God? Is it immediate sensory perception? Or is it our tenuous memories of a previous life, like Plato tried to say? Because I think many serious philosophers have realized that the senses are imperfect and can be misleading. But then they said, okay, well, if not the senses, what can we rely on? And then Immanuel Kant said, “Oh, pure reason, you rely on pure reason.” And that led him to all sorts of rather silly conclusions. Whereas if you have the idea of a problem, as Popper understood it, which usually in Popper, the word problem refers to good things, although there are bad problems as well, like the problems of suffering and so on. But he mainly uses problems as used in science as an interesting thing which we haven’t solved yet, which we haven’t understood yet. And then, as soon as you think of science and rational thought generally as being about problems, then you lose the urge, the need to talk about where it comes from, because the problem is there to be solved, and the solution is what you want, not the justification of the solution by going back to first principles and proving that Jesus is the Son of God because he’s a descendant of King David because the prophecy said he had to be a descendant of King David. Therefore, we have to secretly invent a genealogy that goes right back to David in real life. And nobody has discovered a real genealogy that goes back that far, anywhere near that far. And the truth of Christianity doesn’t depend on it. It’s the wrong way of thinking about Christianity. But then, when it comes to religions, people then, because of this epistemological error, because of this complete disregard of problems as the origin of the growth of knowledge, the more important the thing they want to say they know, the more they want to justify what they think is the origin of it. So you have people waging wars and torturing each other to death because of their interpretation of what somebody who may not have existed said thousands of years ago and probably, even if he did say it, probably didn’t mean it in the way they mean today. We know because people do exactly this for people who lived a hundred years ago or indeed people who are alive today. So it’s a farce, but it’s also a tragedy, as Karl Marx said. The simple epistemological error leads to unlimited suffering. And it’s a common error, so I think if I had to pick something that most people don’t get about epistemology, it’s that the growth of knowledge begins with problems. Problems are clashes between ideas Brett: Let’s linger on that and focus a little bit more on the notion, therefore, of a problem in Popperian epistemology, given that most people will hear the word problem and think something negative. But you’ve already said that Popper speaks about problems as a good thing. Am I right in saying that it’s somehow a clash of ideas or where ideas are making claims about the one phenomena but are making different claims about or competing claims about this phenomena? David: Yes. And not only about phenomena, about anything, you know, about morality and pure mathematics and you name it. So, yes, there can’t be any one definition of the concept problem and Popper doesn’t do definitions quite rightly. But I think thinking of a problem as a clash, and it’s got to be a clash of ideas, or interpretations, or theories, or so on, is illuminating. Because if you think of it that way, then you start with the idea that they can’t both be true. I mean, that’s what the problem consists of, it’s realizing that they can’t both be true. It’s important to realize they could both be false, rather than say, we’ve got to find the true one. Usually they are both false, but usually there are important errors to correct, and usually there are important errors more in one of the clashing ideas than in the other. Popper also stresses, and this is also quite important, speaking of clashes, that a clash of ideas is very beneficial even if they are never resolved. Even if the parties with the ideas never agree, because when the ideas come into conflict with each other, almost without the people knowing it or wanting it, they get changed. Because even if you come out of an argument saying, “Oh, I’ve really showed it to them!” right? What you mean is, you’ve thought of a new angle, which you didn’t have before going into the discussion. You’ve thought of a new angle on your own view, which makes you more sure of it than before. And, although it’s not good to be sure of things, this change, this way of changing, the confrontation between ideas as being beneficial because they cause change in the ideas is also a beneficial side effect of Popper’s concept of a problem. Brett: I can hear the anti-Popperians or even the non-Popperians saying, but hold on, when you make an observation with a telescope of here’s Mercury, that’s an observation. That’s not an idea that you have. So the fact that it conflicts with the existing classical picture of how gravity works, that’s not a clash of ideas. It’s an observation that is clashing with grounds and an idea or a theory. David: Yeah. Well, you had two theories at the time. Both of them had their adherents, general relativity and Newton’s theory. There were also other tangential ideas. Like if you believe Newton’s theory, or if you adopted Newton’s theory and you wanted to reconcile that with the observations, because the observations were also a theory, and you could say that the astronomers are wrong, which they did actually. People said about Eddington that his observations were wrong, and it was only actually in very recent times that it was uncontroversially discovered that Eddington’s observations were in fact right. Even though they were incredibly hard to do and he didn’t get enough credit all those decades. So you had theories about the observations. Then there were theories to fix up Newton’s theory, like the theory that maybe there’s another planet that we don’t know about. And you could tie down that theory and say where the planet has to be, what its mass has to be, and so on. And you could then slowly rule out that this planet was there and Newton’s theory still be true. Of course, if Newton’s theory was wrong, then you can put the planet anywhere you like and make any modification you like to Newton’s theory. So that’s not how it works. We want good explanations. At that time you’re speaking of, Newton’s theory was a good explanation. It had some problems with it. Einstein’s also. And all relevant experiments—the observations of Mercury, the observations of the Eclipse, and so on, and all the subsidiary observations as well, were all in conflict. And the argument improved those theories until the clash was such that Einstein’s theory was the only good explanation left. You had an infinite number of bad explanations, they’re always left. But the only good one was Einstein’s theory, and I know you were looking over there through your telescope at the non-Popperian, but I think he’s gone now. Evolution is not the survival of the fittest Naval: Let’s talk about one of the remaining two, quantum physics or evolution by natural selection. David: There’s a very simple way in which people don’t get evolution, and it dates back to the old theories of evolution, like Lamarckism and I don’t know what they called Erasmus Darwin’s gradualism, or whatever, but anyway, these were attempts to account for the world around us without appealing to the supernatural. So both Lamarckism and Erasmus Darwin’s theory, I am probably not crediting the real author, the originator of that theory. They wanted to make sense of the world without appealing to the supernatural. And their ideas are still current, not under those names. Sometimes Lamarckism even under that name. And of course, there was Lysenkoism, which was a species of Lamarckism. But today, most scientifically minded people would say that they agree with Darwin’s theory of evolution, and then they would immediately, often, go on to say that after all, “the survival of the fittest”, and, you know, obviously the fittest are going to survive, and that’s not at a"
