title = "The Beginning of Infinity, Part 2"
description = "Part 2 of my interview with Brett Hall about The Beginning of Infinity. Also see Part 1.  With a Good Theory of Knowledge, You Can Decide What Else Is True  David Deutsch’s theory is centered around good explanations  David Deutsch has this great view of the world where he believes that everything important is understandable by a single human. More"
full_description = "Dec 22 2021 The Beginning of Infinity, Part 2 52:51 Get podcast Apple Google Overcast Spotify YouTube Download Dec 22 2021 Part 2 of my interview with Brett Hall about The Beginning of Infinity. Also see Part 1. With a Good Theory of Knowledge, You Can Decide What Else Is True David Deutsch’s theory is centered around good explanations Naval: David Deutsch has this great view of the world where he believes that everything important is understandable by a single human. By important he means the underlying base theories that drive most of reality. Deutsch fixates on four theories. I could argue maybe there are a few more, especially if you start getting into Adam Smith and The Wealth of Nations and a few other more sociological ones. But he’s obviously a physicist concerned more with reality and truth-seeking, not human systems. The four he picks are the theory of epistemology; the theory of evolution by natural selection; quantum theory, into which he subsumes relativity and other physics; and the theory of computation, which includes his theory of quantum computation. These four are fascinating. It’s probably worth exploring what’s interesting about each of them. What is the breakthrough here that might be nonobvious? Let’s start with epistemology. The reason I love The Beginning of Infinity is that Deutsch does a very rigorous review of what is correct in epistemology, what we know to be the best answers. Once you have a good theory of knowledge, then you can decide what else is true. If you’re starting with a bad basis for the theory of knowledge, then you’re going to decide on a bunch of things that are false when you think they might be true. And his epistemology is centered around good explanations. It takes Popper’s view of science and truth-seeking as being error-correcting mechanisms and expands on it. I’d love to hear your summary of the theory of knowledge, or epistemology, as Deutsch lays it out. No Truth Can Be Justified ‘Knowledge’ is just our best guess at the time Brett: Initial guesses at what ‘knowledge’ was all about amounted to what is known as the “justified true belief” vision of knowledge, and it’s still the most prevalent idea today. Anyone who calls themself a Bayesian is a justified true believer. This is the misconception that knowledge is about trying to justify your beliefs as true. And if you’ve done so, then you can say, “I know that thing.” If I can justify as true my theory of gravity, then I should believe that theory of gravity, and only then can I say that it’s known. The problem with this is that there is no method of showing any piece of knowledge is true. The improvement Deutsch promotes in his books is this vision that Popper gave us, that all we have are guesses about reality. They’re conjectures. People think, “Oh, that sounds a bit wishy-washy. It’s just a guess.” Well, it’s not a random guess. It’s a guess that has stood up against trials, against attempts to show that it’s false. It’s not that everyone who decides to have a guess stands on equal footing. When people are unable to show that something’s false—via this method of refutation—then we accept it as a piece of knowledge. This allows us to accept the fact that we’re going to be able to make progress in the future, because all of our knowledge is conjectural. All of it is our best guess at the time. There’s elasticity within the knowledge that allows us to say, “There’s going to be errors. We’re going to correct them and, thereby, be able to make progress into the infinite future.” This is unlike the previous conception of knowledge, which says, “Once you’ve justified something as true, well, it’s true.” If it’s true, that means there is nothing false about it and, therefore, it can’t possibly be refuted. That’s a very religious notion. The modern incantation of this is Bayesianism, which says, “You have a theory, you collect more evidence, and you become more and more confident over time that your theory is correct.” It gets a little bit worse than that, because then it says, “This Bayesian reasoning enables you to generate new theories.” Which it can’t. The best that it can hope to do is to show you that you are more confident in this theory than you are in that theory. The Popperian view says, “If you can show that there’s a flaw in a particular theory, you can discard that theory.” There Can Be No Final Theory of Gravity All we have are better and better approximations to reality Brett: In almost all cases, you only ever have one theory on offer. In the case of gravity, there literally is only one theory on offer at the moment. There’s general relativity. Previously we did have two theories. We had Newtonian gravity and we had general relativity—but we did a crucial experiment. This idea of a crucial experiment is the cherry on top of science. You’ve got these two competing theories. If the experiment goes one way, one theory is ruled out but the other theory is not. In which case, you keep that theory for so long as no problems arise. This vision of knowledge enables us to have an open-ended quest for progress. This is completely unlike any other idea about knowledge. The overwhelming majority of physicists are still Bayesian. And the reason they’re still Bayesian is that this is typically what’s taught in universities and this is what passes for an intellectually rigorous way of understanding the world. But all it is is what I would call species of scientism. It’s because they have a formula behind them, the Bayes’ theorem, which is a perfectly acceptable statistical formula. People use it all the time in perfectly legitimate ways. It’s just that it’s not an epistemology. It’s not a way of guaranteeing, or even being confident, that your theory is actually true. My favorite example of this: Prior to 1919, every single experiment that was done on gravity showed that it was consistent with Newton’s theory of gravity. What do Bayesians say in that situation? They say you’re getting more and more confident in Newton’s theory. How does that make sense? How do you square that the day before it was shown to be false was the day when you’re most confident in it? Now, a Popperian doesn’t have this problem. A Popperian says, “At no point was Newton’s theory actually true. It contained some truth, but that truth isn’t a thing that we can measure.” I say it contained some truth because it’s certainly got a more direct connection to reality than some other random person’s guess about the nature of gravity. Gravity does indeed approximately vary as the inverse square law, but not exactly. We needed general relativity to correct the errors in Newton’s theory of gravity. And even though general relativity is our best guess right now, it can’t ultimately be the final theory of gravity. There can be no final theory of gravity. All we have is better and better approximations to reality. Naval: I think the reason we fall into Bayesianism so easily is probably related to why we fall into pessimism so easily. We’re evolutionarily hardwired for Bayesianism. Every other animal on the planet that can form good explanations is a Bayesian. They’re just looking at repeated events and saying, “The sun rose yesterday. The sun will rise tomorrow.” Or, “That thing I touched is hot. It’s probably going to be hot in the future.” That is how most of our biological systems and most of our evolutionary heritage worked. It’s just now we have this neocortex that can form good explanations about the seen in terms of the unseen. That gives us a higher level of reasoning, but that higher level of reasoning is not instinctual to us. It requires effort. It requires deep thinking. We default to Bayesianism because that is how a lot of the natural world around us seems to work at least at the purely biological level. Genetic Evolution Was a Prelude to Memetic Evolution Ideas undergo the same evolutionary process as genes Brett: Popper has a book called “Objective Knowledge,” and it’s subtitled “An Evolutionary Approach.” And that’s no accident, either. There’s a symmetry between the theory of epistemology and the theory of evolution as we understand it. Before we understood what is known as the Darwinian theory of evolution, the only idea that people had was that these entities had to be created. All the plants and animals that you see around you had to be created by a creator. There was no other explanatory mechanism. Some people came up with the idea of gradual change over time. Lamarck was one. His idea was the reason why giraffes have long necks is that their ancestors had slightly shorter necks, so they tried to stretch their necks to reach the leaves they couldn’t reach. But again, there was no mechanism for this beyond the fact that an individual goes off to the gymnasium and works on their biceps and their biceps get a little bigger over time. Although you can work out in the gym and increase the size of your biceps, that doesn’t mean your children are going to inherit those characteristics. What Darwin came up with is a similar idea to what Popper had in knowledge. It was an error correction. The idea is that an organism would trial itself out in a particular environment and if it wasn’t, as we say, fit for that environment, then it would die off. But if it was fit in that environment, then it would survive. So you have this encounter with reality between living organisms and the environment. And it’s the environment that’s giving you feedback from reality and destroying those organisms that aren’t fit enough to survive. The Neo-Darwinist view is to give us what the unit of selection is. It’s not the group or the herd; it’s not even the individual. It’s the gene. It’s the selfish gene idea, which comes to us from Richard Dawkins, who says if any one of those genes happens to be not fit for the particular environment, that could cause the death of that organism. The species might survive, but its entire DNA will ever so subtly change over time as the environment changes. Now we have leveled that up. We human beings are the next step in that evolutionary process where we can create explanatory knowledge, which does the same thing. Deutsch likes to say, “Genetic evolution was merely a prelude. What’s coming next is memetic evolution.” The history of the universe from here on out is going to be the history of ideas undergoing the same evolutionary process as the genes did previously. Humans Are Exceptional Humans aren’t just a form of bacteria that overran the planet Naval: Three out of these four theories have an interesting pattern to them. With good explanations in epistemology, we’re saying conjectures and their refutations and error correction is how we improve knowledge. With genetic evolution, genetic mutations, variation and natural selection weed out the ones that didn’t work. Then there’s memetic evolution on top of that, where we have ideas and then criticism weeds out the ideas that don’t work. Related to that, in invention there’s trial and error. In capitalism, startups get created and the ones that have bad ideas fail. We see this pattern recurring over and over. What’s interesting, though, is there’s another metapattern here, that humans are exceptional. In epistemology, humans are the only non-Bayesian reasoners. In evolution, humans are the only memetic creatures that we know of. In the theory of computation, humans are the only universal explainers that we know of other than, of course, the computers that we’ve invented. Science took us from this view of humans being at the center of the universe to, “Actually, humans are nothing special. You’re just one little planet out of an almost infinite number of Kepler planets that could be bearing life out there.” But the three of these four theories that we’re talking about are pointing us in this direction of humans are exceptional. Humans are capable of maximal knowledge. One interesting realization for me was that even if you were God, even if you had infinite knowledge and power, even if you controlled the entire universe, you still wouldn’t know that you’re not in a simulation. You still could never prove that you’re not in the simulation. And even as God, there is no concept that you could hold in your head that a human being couldn’t hold. Unless, of course, the laws of physics are different. If the laws of physics are different, then all bets are off and who knows? But working within the current laws of physics, humans are capable of maximal knowledge and maximal awareness. That points to a world where humans are exceptional and not just another form of bacteria that got out of control and overran this planet. A lot of these fundamental theories lead to a viewpoint that humans are special, knowledge is infinite, and as long as we don’t destroy the means of error correction and we’re always creating new knowledge, then there’s good reason to be optimistic. We Are Qualitatively Different From Other Species There is no continuum between humans and chimpanzees Brett: You’re pointing out a minority opinion there. I think culture is still stuck in that second part of what you were saying. Originally we thought that we were at the center of the universe. This was the religious conception of man’s place in the cosmos. Earth was surrounded by the celestial spheres and everything orbited around it. So we were the inheritors of the entire universe, and God had gifted us with this. Then science showed us that, in fact, we’re not at a particularly special place in the universe. This is the cosmological principle, this idea that the universe is roughly the same at every single place and we are just one of those particularly unspecial places. Not only are we unspecial in the cosmological sense, but biologically we’re nothing particularly special, either. We’re just on the continuum between bacteria to cockroaches through to dogs and chimpanzees. An astrophysicist I absolutely love on almost every other topic, Neil deGrasse Tyson, was talking about how chimpanzees are a lot smarter than we think and how we might not be much better. This is what almost everyone thinks. This third view that a lot of us are trying to promote now is that it’s not a slight quantitative difference between chimpanzees and us. There is a continuum between bacteria to cockroaches to dogs and chimpanzees, but we’re off-axis. We are qualitatively different. All we need to do is open our eyes. You look out your window at that beautiful city that happens to be out there that cannot be explained by this gradual increase of biological complexity. More Compute Power Doesn’t Produce AGI Even the most powerful computers can’t answer ‘why?’ Naval: The artificial general intelligence crew gets it completely wrong, too: “Just add more compute power and you’ll get intelligence,” when we don’t know what it is underneath that makes us creative and allows us to come up with good explanations. People talk a lot about GPT-3, the text m"
