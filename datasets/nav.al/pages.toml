["https://nav.al/david-deutsch-2"]
title = "David Deutsch: Knowledge Creation and The Human Race, Part 2"
description = "Brett Hall and I interview David Deutsch, physicist and author of The Beginning of Infinity. Also see Part 1.  Popper’s Impact   One of the other things that is counterintuitive—and one of the misconceptions that I see crop up out there in academia, intellectual circles, education—is that people think that there’s a final theory. More"
full_description = "Aug 11 2023 David Deutsch: Knowledge Creation and The Human Race, Part 2 34:00 Get podcast Apple Google Overcast Spotify YouTube Download Aug 11 2023 Brett Hall and I interview David Deutsch, physicist and author of The Beginning of Infinity. Also see Part 1. Popper’s Impact Brett Hall: One of the other things that is counterintuitive—and one of the misconceptions that I see crop up out there in academia, intellectual circles, education—is that people think that there’s a final theory. [They think] what we’re trying to achieve is a bucket full of theories that will be the truth at the end of some period of discovery and that we’ll be able to carry around the bucket and say, “Here are all the truths. We’ve got no more work to do.” We’re going to sit down and do nothing, apparently, except let the AI take care of all the menial jobs. We’re going to be laying back on sun chairs and drinking cocktails or something like that. As far as I can tell, you are the only person today explaining that this whole vision of the way in which knowledge is constructed and what our purpose is in science and everywhere else, it’s completely misconceived. It’s not just that it’s a little bit wrong; it’s infinitely wrong. Because there won’t come a time when we’re going to be lying on the same chairs, drinking cocktails, intellectually speaking. Can you say a little bit more about that, because it did come from Popper? David Deutsch: Absolutely. Popper’s philosophy is actually very broad in a sense because it’s so deep. Popper only had one idea, and that is that it all begins with problems, and there’s no royal road to solving them. If you look at it the right way, that tells you to go to fallible and anti-authoritarianism and conjecture and criticism, and so on. Then he applied that to lots of different things and he wrote dozens of books. People bought them, and every philosopher has heard of him. But there, I have to draw the line. That’s as much success as he had. Nobody actually got it, not even many of his supporters. People tended to get part of it. Although when someone is very creative and successful in a particular area, they tend to be a Popperian in that area, and they usually insist that it’s a special property of that area. Brett Hall: They have to be. If you’re going to make progress, the only possible way of doing it is finding the problem, purported solutions, and then criticizing those solutions. So you’re necessarily a Popperian if you’re making progress, even if you don’t know it. Creative Guesses Naval: If I were to give an example of exactly what you’re talking about, I interviewed Matt Ridley, who was a hero of mine growing up. I read all of his popular science books. I remember his book Genome and his book The Rational Optimist. His most recent one is about innovation. It’s all about trial-and-error or variation of selection or, as you say in science, conjecture and criticism. These are all just the same method. These are creative guesses. Once you fully absorb this, it changes your view of the world. You just see that everything is creatively making guesses. We’re not copying. We’re not getting it from the environment. It’s not something that’s evident to us clearly in nature and then as we absorb it more and more as Bayesians or Inductivists, we somehow come up with the truth. Rather, everything is a theory-laden guess. It’s funny, I’m teaching this to my six-year-old because I want him to have a solid foundation, and he now understands intuitively that, “Yeah, everything is a guess.” So every time we get to something and he asks why, I say, “Let’s start making some guesses.” Once you absorb this view of the world, it is evident everywhere. For example, in my domain in technology and innovation, people think, “Yes, I’m being creative.” I’m guessing. The artists think they’re being creative, and they’re guessing. David Deutsch: By the way, you just mentioned a solid foundation of epistemology for your six-year-old. Even in Popperian epistemology, its role is not to be a solid foundation. It also requires improvement and is always imperfectly stated. I think that Popper didn’t concentrate enough on the concept of explanation, that the purpose of science is explanation. So one of the footnotes that I’ve added to Popperian epistemology is that it’s not just that good explanations are good heuristically and they help us to discover things; it’s rather that discovering them is what the whole thing is about. When you talk about, for example, testability, the only reason why testability is important is that in a particular field—namely physics—it’s the way one can test explanations. Experiments, Demonstrations, and Measurements David Deutsch: I’d like to draw a distinction between experiments, demonstrations, and measurements. When you do this experiment with the acid and base, since there’s no rival theory, what you’re doing is a demonstration. If you are showing that to a class of schoolchildren, you can say, “You’d never believe what happens when I pour this into that. You’ll never guess in a million years.” And then you pour it in and it changes color, and they say, “We’ve seen that kind of thing before.” But then it changes color back and then forward and back, and then you say, “How can that happen? That contradicts everything you’ve been told in chemistry so far. How can we find out? Some people say this was how it worked. Then someone else came along and said that was how it worked. How can we distinguish between those?” And that is an experiment. It’s testing two different explanations against each other, where you can’t tell without the experiment which is the good explanation. And then there’s a measurement, like the difference between what Newton did and what Cavendish did. Newton developed the theory of gravitation, but he never measured Newton’s constant. I think—don’t quote me on this—Newton could measure GM, where M is the mass of the Earth; he couldn’t measure G and M separately. And therefore when they guessed the mass of the sun and so on, it was always as a multiple of the mass of the Earth. Then Cavendish, by actually getting a hands-on experiment where you had a gravitational force between two things whose mass you could measure directly—by comparatively weighing them against a standard kilogram or whatever they had in those days—[showed] you can measure the constant. Now that is not an experiment. It’s called the Cavendish experiment. But in this terminology I’m trying to set up, that’s not an experiment because there’s only one explanation involved. Before, during, and after Cavendish’s experiments, he never doubted Newton’s theory of gravity. What he was trying to do was to measure Newton’s constant. Somebody could have come along and said, “Maybe Newton’s constant is different on different parts of the Earth.” But nobody did say that. If they had, then Cavendish’s measurement would’ve turned into an experiment. But there was no good explanation along those lines because Newton’s theory was incredibly successful, in part because it was so universal. So because of the problem situation at the time, what was missing was a measurement. Many experiments now that are called experiments are really measurements and many of them are really demonstrations—not that both measurements and demonstrations aren’t great. Naval: Let me make sure I understand. So you’re saying an experiment chooses between rival explanations or rival theories. A demonstration just shows, “If I do this, I get that. This is how the world seems to work. This is observable.” And the measurement can help refine a theory and make it more precise by figuring out things about it that we didn’t know. And those are three distinct things. And we use the term “experiment” loosely, but it’s really this key thing that is done once in a while to choose between two competing explanations, which is a very rare occurrence. It’s very rare to have two rival good explanations. Going back to good explanations for a moment, there are two other things I’ve seen mentioned. There are a few other techniques that I see you use a lot in the two books when referring to good and bad explanations. One is that good explanations make these risky predictions. Like Einstein had the prediction of the light bending around the sun or starlight bending around the sun. There are these risky and narrow predictions that before you would not have anticipated another one. You’ve talked about the simplest answer, or Solomonoff induction, where Solipsism is a bad explanation because you still have complex and autonomous entities but now you’ve added this extra entity in your mind. David Deutsch: I don’t mention Solomonoff induction, but I do mention in the book the simplest explanation. That’s not the right way to look at it, because you can only detect or measure or define simplicity once you have, let’s say, a theory of physics, then you can say that simplicity is the smallest number of bits in which a given program could be encoded. But if bits behaved differently, then things would become simple that were previously complex. And that’s exactly what happened with quantum computation. So there is no scale of complexity or simplicity that is prior to physics. You can, in principle, define complexity or simplicity. But it doesn’t make sense to ask how complex, say, a theory of physics is, because that’s the wrong way around. Simplicity is not prior to science; it’s posterior. Naval: This is also a theme running through your work. Computation has to be done in the real world and has to obey the laws of quantum physics. You talk about mathematics having to be bound to the laws of physics. So even the reductionist argument that, “No, all the good theories are basic,” just depends on what the laws of physics are and what the context you’re approaching it in is. David Deutsch: Exactly. And what you’ve just said refutes Solomonoff induction because that is based on a particular measure, namely the length of Turing computer programs. But he was unaware that he was assuming a complex structured theory of physics and then saying that we should choose the theory of physics that is simplest in those terms. I would expect that sometime after quantum theory, there’ll be yet another dispensation which will give us a different conception of complexity and simplicity. But already as a matter of logic, it doesn’t make sense to consider simplicity and complexity as being a priori fundamental compared with physics. Taking Theories Seriously Naval: One thing you bring up a lot, I would almost call it a Deutsch refutation—because I see you use this more often than almost any other author—is the theory refutes itself. For example, you talk about the precautionary principle. Since civilization has never followed the precautionary principle, if we start following it now, we’re no longer being precautionary. So it refutes itself. That’s one example, but you use many of these. So there’s these self-refutations buried in a lot of these theories. David Deutsch: Another way of putting that, though, rather than thinking of it as a method of refutation, is to think this is just what it means to take theories seriously, rather than just as forms of words that one learns to say. Like physics professors, when asked something important about quantum theory, they have learned to say, “Ah, well, it’s a particle in a wave at the same time.” And if the student says, “What does that mean?” The professor may well say, “You’ll get used to it. You will understand that eventually.” But what they often say, regrettably, is, “That’s the wrong question to ask. That’s not a meaningful question,” and “You are not allowed to ask that question.” But the question isn’t based in a misunderstanding of quantum theory; it’s the other way around. It’s taking quantum theory seriously and saying, “I want to understand quantum theory.” And saying that it’s both a particle and wave at the same time is not an answer to that question. It’s a way of shutting up the question. Brett Hall: I used to get, “It’s born as a particle, lives as a wave, and dies as a particle.” Because the experiments that capture the entity that’s moving will only ever capture the particle. But then the interference is explained by it being a wave. That was a tricky way of trying to get around the wave-particle duality by saying, “Well, not technically at the same time.” But there was no explanation for how it transitioned between being particle to wave or how it knew it should move between being a particle and a wave. David Deutsch: Yes. And, of course, it can move back as well. If you have a more complex interference experiment, it’s a particle, then a wave, then a particle. If you look at some of Vaidman’s experiments, it’s very hard to get your head around if you don’t have the Everett interpretation because it totally depends on taking seriously this quantum entity that cannot be described as a particle or a wave. Brett Hall: If what we’re saying of our good explanations is that they really are accounts of reality, in what sense are we getting closer to reality with the good explanations? My classic go-to example of Newton explaining gravity as this force that acts instantly on the bodies and then it is superseded by Einstein’s general relativity, where there is no such force whatsoever. We’re saying that this thing that was part of a good explanation no longer exists at all. David Deutsch: There are two answers to that question. One is in the book and one isn’t. In the book I say there are many concepts, laws, explanations that are shared between Newton’s theory and Einstein’s theory of gravity. For example, both theories adopt the heliocentric cosmology and they say that the motion of the Earth and the other planets in gravity is caused by the sun. It’s because the sun is there that an influence is felt. Now, the influence is not a force—it’s a coverture of space-time—but that curvature of space-time is caused by the mass of the sun. But there’s another sense in which say Newton’s theory and Einstein’s theory are more closely related than you might think. Newton’s theory contains the problems to which Einstein’s theory is the solution. Newton said that gravity travels instantaneously. That was a problem which people recognized before Einstein. They wanted to explain, “What does it even mean for something to travel instantly?” And then there was the fact that, if the universe lasts forever, as Newton thought, then how come in the long run it doesn’t all collapse? I don’t know if Newton was aware of what’s called Olber’s paradox, but according to Newton’s theory, if the universe is either infinite or very big, then the sky should be white. Again, that is a problem Newton’s theory can’t really answer. You have to make some very ad hoc assumptions to fit that into Newton’s theory as a cosmology. And Einstein’s theory just solves that problem, which was in N"
