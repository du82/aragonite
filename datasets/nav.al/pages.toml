full_description = "Oct 11 2024 The Deutsch Files IV Brett Hall and I interview David Deutsch, physicist and author of The Beginning of Infinity. Also see The Deutsch Files I, II, and III. I can only start with what understanding I want. And I know I’ve asked you this before, but I want to be pedantically exhaustive about connecting the four theories of The Fabric of Reality. More 1:25:05 Get podcast Apple Overcast Spotify YouTube Download Oct 11 2024 Feb 17 2024 The Deutsch Files III Brett Hall and I interview David Deutsch, physicist and author of The Beginning of Infinity. Also see The Deutsch Files I and The Deutsch Files II. Proving Something About AGI is Inherently Impossible On exactly that, the fact that the more that we summarize what I think is an exceedingly clear body of work in The Fabric of Reality and in The Beginning of Infinity; when nonetheless you explain it to people, as Popper says, it’s impossible to speak in such a way as to not be misunderstood. More 59:17 Get podcast Apple Google Overcast Spotify YouTube Download Feb 17 2024 Jan 26 2024 The Deutsch Files II Brett Hall and I interview David Deutsch, physicist and author of The Beginning of Infinity. Also see The Deutsch Files I. The universality of computation and explanation So let’s go through The Fabric of Reality—the four theories. More 1:14:27 Get podcast Apple Google Overcast Spotify YouTube Download Jan 26 2024 Jan 11 2024 The Deutsch Files I Brett Hall and I interview David Deutsch, physicist and author of The Beginning of Infinity. New: Discuss this episode on Airchat. We don’t really have an agenda. There is no goal to the conversation. The closest we can come up with is just to have a spontaneous free flowing talk about anything you want to talk about. More 54:52 Get podcast Apple Google Overcast Spotify YouTube Download Jan 11 2024 Aug 11 2023 David Deutsch: Knowledge Creation and The Human Race, Part 2 Brett Hall and I interview David Deutsch, physicist and author of The Beginning of Infinity. Also see Part 1. Popper’s Impact One of the other things that is counterintuitive—and one of the misconceptions that I see crop up out there in academia, intellectual circles, education—is that people think that there’s a final theory. More 34:00 Get podcast Apple Google Overcast Spotify YouTube Download Aug 11 2023"
