title = "The Deutsch Files III"
description = "Brett Hall and I interview David Deutsch, physicist and author of The Beginning of Infinity. Also see The Deutsch Files I and The Deutsch Files II.  Proving Something About AGI is Inherently Impossible   On exactly that, the fact that the more that we summarize what I think is an exceedingly clear body of work in The Fabric of Reality and in The Beginning of Infinity; when nonetheless you explain it to people, as Popper says, it’s impossible to speak in such a way as to not be misunderstood. More"
full_description = "Feb 17 2024 The Deutsch Files III 59:17 Get podcast Apple Google Overcast Spotify YouTube Download Feb 17 2024 Brett Hall and I interview David Deutsch, physicist and author of The Beginning of Infinity. Also see The Deutsch Files I and The Deutsch Files II. Proving Something About AGI is Inherently Impossible Brett Hall: On exactly that, the fact that the more that we summarize what I think is an exceedingly clear body of work in The Fabric of Reality and in The Beginning of Infinity; when nonetheless you explain it to people, as Popper says, it’s impossible to speak in such a way as to not be misunderstood. I was just reading today on Twitter, someone claiming that you have said, quoting you, and they’ve put it in quote marks, you have apparently said, Popper proves AI can’t be super intelligent. And, I sort of responded, “He never even speaks in those terms!”, that you wouldn’t rely upon the authority of Popper to begin with, you wouldn’t say proof. So, it’s just another example that you go out there and, as you say, these concentric circles of people that you bring into trying to understand your worldview, the misconceptions compound. I don’t know what you think about that. Have you said anything like Popper proves that—and this was from a journalist by the way, I think a reasonably respected journalist was saying this. David Deutsch: No, of course not. As you say, as soon as you see a claim that somebody has proved something, Then, you know, proved it from what? This isn’t going to be Popper, it isn’t going to be me. I’ve proved that if quantum theory is true, then the Turing conjecture is true in physics. That’s what you can do with a proof. Proving something about AGI is inherently impossible if we don’t have a theory of AGI. You can’t prove something about something that you can’t define. And anyway, proof isn’t what these kind of things are about. These kind of things are about argument. And Popper, I can’t recall Popper specifically saying anything about AI. It wasn’t a thing in those days. Brett: This word proof is something we haven’t talked about during our conversations, but you do hear it deployed quite often. You know, such and such has been proved, as if to say, this stands in contrast to our notion of conjectural knowledge or fallibility. After all, once something has been proved, can’t we carve it into stone and there it sits for all time? Is the notion of proof on a different level to the rest of our conjectural knowledge, because it sounds, I think, to the typical layperson as if it is. David: Yeah, well, it isn’t. The difference between mathematics and other fields, as I’ve often said, is not in the way we find knowledge about them, but in the subject matter. The subject matter of mathematics is necessary truth. So when we make a discovery in mathematics, we’re making a conjecture about what is necessary truth. We’re making a conjecture that something or other that we have defined is a necessary truth. But there isn’t a difference in the way we create knowledge in our minds about mathematics or computer science or psychology or physics. They’re all the same epistemologically. Creativity is Not Just Mixing Things Together Naval: One topic that I kind of want to get into a little bit, if I can switch for a moment, is the topic of creativity. And I know that it’s very poorly defined and something that we don’t quite have a grasp of. And on Airchat yesterday, I was talking to people and I made some comment about, as long as you have room for creativity, you have room for free-will. Because we don’t know where creativity comes from and so that allows you to have this freedom of operation based on your creative theories. I was making the point that true creativity is not from observation. It’s not from induction. It’s not from some algorithm that we know yet how to run, and it’s not just mixing things together. And immediately the response was someone said, “Well, can you give me some examples of this creativity you’re talking about?” So, I think to people, they feel like when we talk about this form of creativity, we’re just talking purely about scientific creativity like Einstein. And I think some of these examples that we use are so far out there that people think, well, they’re not talking about creativity, they’re talking about scientific discovery (which is not what they’re talking about). And so, most people seem to automatically fall into this trap that creativity is observation or recombination. And I wonder if we can just explore what creativity is, some real world examples that are just more down to earth, and just kind of, I’d love to once and for all put to bed this idea that it’s recombination. I think you’ve done a great job showing that it’s not observation, but I think the recombination metaphor keeps coming back. Frankly, because of authorities like Steve Jobs, who authoritatively said, creativity is just mixing things together. And that’s a quote you find on posters everywhere. David: Yeah, well, it’s only the word “just” that is false there. So, like I said yesterday, you know, it’s like saying humans are just atoms. We are just atoms in the sense that there isn’t any magic thing in addition to atoms that makes us, but that’s not to say that we are just atoms. If you take a snapshot of North America a thousand years ago and then take another snapshot today, the difference between the look of Manhattan Island, then and now, cannot be explained without invoking creativity. Nothing but creativity could have produced that. There are no natural processes that will ever produce something like a skyscraper. So, to explain the phenomena that happen on Manhattan Island, you need to invoke creativity. But now somebody will say, now point to some creativity. I can zoom down on a particular architect with his old fashioned draftsman’s board and his paper and his ruler and his compass and his brain and I can examine those with a microscope and somebody will ask me, “Well, at which point did creativity happen? What was creative about what that architect did that was not just atoms, and, if you like, bringing together ideas that had happened before.” Well, if all our ideas are just recombinations of ideas that have happened before, then there’s nothing new about the skyscraper that wasn’t already there when our ancestors were banging rocks together. But there is. They didn’t and couldn’t build skyscrapers, and we can and do. At least, I can’t. But the human species can. Naval: The other side, they’ll say, “Well, yeah, you can’t go straight from banging rocks to skyscrapers, but they went from banging rocks to figuring out how to shape rocks to build tools and then they recombined that knowledge of building tools and digging and so on and so forth.” It was step by step recombination, almost like an evolutionary process. David: Well, an evolutionary process is also not just recombination. It’s variation and selection. So, again, it’s the same thing. If you look at the DNA of successive generations of dinosaurs, and they turned into birds, each one of those steps is not evolutionary, and yet the whole sequence is. But it would be absurd to say the design of a pterodactyl was already in the DNA of non flying dinosaurs. Or that the pterodactyl is just a combination of different things that were in the dinosaurs. It’s just not true. The pterodactyl functionality was nowhere until it evolved. It wasn’t anywhere in the past, not in the dinosaurs and not in the single celled organisms that were the ancestors of dinosaurs. It just wasn’t there. It was new when the ability to fly evolved in the lineage of dinosaurs. The Superiority of Explanatory Knowledge Naval: In the pterodactyl case, there was one or a series of random mutations that turned out to be adaptive for that set of genes. And those mutations were essentially blind. They were broken DNA strands or just new DNA strands. And in the human case, that’s not quite what’s happening. The search space we’re going through is larger and we’re searching through it faster to make these creative leaps. Is that an intuition that you have? Is there any learning or knowledge behind that? I’m not trying to solve the problem of how creativity works. I know that’s an unsolved problem, but, for example, could one say that humans are narrowing the search space faster because the creative mutations, to coin a term, that we’re making are not random? They are more directed, or perhaps they’re random, but they’re random in our minds and we cut through them so fast without having to implement them in the real world, that perhaps we narrow the search space faster. Is our process faster? And if so, why? David: It’s not only faster, it is explanatory, which means that because it’s explanatory, it can leap over gaps in the knowledge space that couldn’t be traversed incrementally. So evolution, it’s not only millions of times slower, it’s inherently different in that not only can it only make small conjectures that are in the form of mutations, but it can only improve on things incrementally. So, you can only make pterodactyl wings if you previously had limbs, or if you previously had something that could be incrementally changed into wings, such that every microscopic change was still viable as an organism. So that’s why we can’t expect biological evolution, to [use] my favorite example again, to evolve a system for deflecting asteroids. That is because there is no incremental problem situation where the expenditure of energy or whatever to deflect the asteroid hit. It’s once every few million years, and it cannot exert evolutionary pressure. Naval: So basically, the creative guesses that humans make, because they’re explanatory in nature, they can leap through the entire idea space and form interconnections between any two ideas or any two states, whereas biological has to traverse through the physical world limitations and what the organism is capable of right now. David: Yes, and it has to traverse it while staying alive. It has to be a viable organism all the way through, whereas if you want a new design of airplane, and you say, “Maybe it would be better to have the tailplane as a single object rather than this thing with wings,” then, you know, I’ve just said that in one sentence. And if that’s a good idea, it could be criticized by an aeronautical engineer and so on. But to make that change incrementally, we’ll probably produce a whole series of airplanes that won’t fly. Naval: So is this a consequence of being universal in nature? We can model any system in our head and therefore we can connect any part of it to any other part of it? David: Yes, I mean that’s really what we mean by being universal. We can get to any idea. And criticize it for whether it is a good idea or not. So the aeronautical engineer doesn’t have to test every single airplane in his wild ideas—you know, maybe he has a wild idea driving to work one day, that maybe wings should be made of paper. Naval: So in that sense, the biological system is a highly focused analog computer that’s running sort of a single algorithm. And the virtual system in our head is more like a digital programmable computer. David: The DNA system is entirely digital. This incremental thing is not a continuous change. So, one mutation is still a quantum difference. If you had a difference that involved less than one base pair, then the whole DNA would fall apart. If you try to replace Adenine by glucose, then the whole thing wouldn’t work as DNA at all. Although we speak of evolution as happening incrementally, it’s incrementally in discrete steps. So, both thinking and biological evolution happen in discrete steps. Biological evolution happens, though, in very small steps, which are undesigned. So, there’s no designer that designs the next mutation, it’s random. Knowledge Laden Information is More Resilient Than Any Physical Object Brett: It strikes me that the SETI project is looking for biomarkers. They’re out there searching for evidence of biology. The way you’ve poetically framed this idea of, well, there are billions of asteroids out there right now across the universe crashing into billions of planets right now, but here might be the one place where if you had the telescope pointed from another planet towards us, you would see the repelling of asteroids. This would be an indication of intelligence. There’s no other explanation. There’s no biological explanation. There’s no random chance. There’s no magic. It must be explanatory creativity that does that thing. And talking about Manhattan before, everywhere across the earth are rocks being eroded and inevitably being eroded by weathering and rain and whatever. But in some places, the cities of the world, there are rocks, call them buildings, which are not being so eroded or insofar as they are, they’re being constantly repaired again by explanatory knowledge. And so that introduces this idea of knowledge as resilient information, the very thing that will outlive even the rocks. So long as we can continue to survive, then the knowledge that we have will continue to survive, outlasting the longest existing things in the cosmos. David:. Yes, very nicely put. And Shakespeare, by the way, also said the same thing in his sonnet. “So long lives this, and this gives life to thee.” He’s saying that his sonnet will outlive anything, and he’s right. Naval: Right. “Shall I compare thee to a summer’s day, thou art so fair,” or so temperate. Yes, that was a great one. It’s also similar to Ozymandias, if you’ve read that one by Shelley where it’s the artist’s conception that survives the empire and the king. David: Yes, exactly. And it’s simply literally true that knowledge laden information is more resilient than any physical object. Naval: Not to get personal for a moment, but is this an argument for spreading your ideas rather than having children? David: Well, as David Friedman says, “If the world is worth saving, it’s worth saving at a profit.” And I would generalize that: if the world is worth saving, it’s worth saving with fun. The Problems of Cloning People Naval: I think you’ve talked a little bit about AGI, or rather creating an AGI, or just people uploading their brains into a computer in the future. And if their minds are in the computer, if the same software is running, then that is a living being, that is a mind, that is the definition of a person. And this brings up all sorts of interesting paradoxes and situations which many sci-fi authors, including Greg Egan, have explored. What if you were to replicate this mind a billion times? What if you were to shut it down? What if you were to run it back in slow motion, what if you were to pause it? And I think, I don’t know how far we are from that, probably still quite far. Neal Stephenson also talked about it in his book, The Fall. There’s also cloning coming up. I mean, people are now successfully cloning dogs. It’s"
