["https://nav.al/vitalik-2"]
title = "Vitalik: Ethereum, Part 2"
description = "Haseeb and I interview Vitalik Buterin about Ethereum and blockchains. Also see Part 1.  Protocol Politics  The elder statesman of smart contract blockchains   Vitalik, I want to ask you a little bit about how your role has evolved since it began at Ethereum. More"
full_description = "Apr 14 2022 Vitalik: Ethereum, Part 2 24:59 Get podcast Apple Google Overcast Spotify YouTube Download Apr 14 2022 Haseeb and I interview Vitalik Buterin about Ethereum and blockchains. Also see Part 1. Protocol Politics The elder statesman of smart contract blockchains Haseeb: Vitalik, I want to ask you a little bit about how your role has evolved since it began at Ethereum. In the very beginning before all of this, of course, you were once the uppity young entrepreneur. It’s been six or seven years now, and you’ve moved on from being the entrepreneur to being the chief technologist to being the politician. You’re now sort of the elder statesman of smart contract blockchains. What have you learned about protocol politics? Vitalik: Protocol politics is less different from regular politics than you might think. It’s all this emergent phenomena of what happens when you stick many thousands of people together. You have incentives that are aligned in some cases; you have some competition in other cases. You have different groups of people that have different opinions, and they have to fight it out, sometimes within one protocol and sometimes between different protocols, where there’s competition. A lot of the dynamics that you get are surprisingly familiar to the kinds of religious fervor that you get when people defend their opinions. Is it better to have blockchains that have smaller blocks so they’re easier to verify, versus bigger blocks so that more people can afford to use them? People have very strong opinions in the same way that people have strong opinions about religion, or democracy, or freedom of speech, or the welfare state, or any other mainstream political topic. The Ethereum community Haseeb: It’s striking. I mean, you built your career as a response to Bitcoin maximalism and you’ve now lived long enough to see the rise of Ethereum maximalism. Three or four years ago, it didn’t seem like something that existed. And now it’s become very clear that as you have all these alternatives to Ethereum arising, there’s a strong need for people within Ethereum to set apart their identity from other people. So I’m curious how you think about how to keep Ethereum healthy and not see the Ethereum community degrade culturally and religiously the way that you saw the Bitcoin community degrade. Vitalik: One of the things that I feel like I’ve learned over the last decade is that people are at their morally worst not out of greed but out of fear. This is true in mainstream politics, and this is true in geopolitics. Naval: Covid showed that it was all fear-driven. The Russia-Ukraine crisis shows that Russia is not attacking Ukraine to get oil fields; it’s out of fear. The responses are all fear-based. Fear is used to justify all the horrible things from the Patriot Act to the Covid lockdowns. Fear drives at all. Greed is always done in your own name, and nobody wants to do it in their own name. Fear is always done in everybody else’s name. So you end up with a whole bunch of self-styled white knights battling each other. The DAO hack Vitalik: Right. And even when the leader actually is greedy and megalomaniacal, fear is what they use to sell it to everyone else. The times when I thought both the Bitcoin and the Ethereum community were both at their morally worst would probably be in the Bitcoin-to-cash, small versus big block war crisis, where people felt like there was this very zero sum struggle between one vision of what Bitcoin would be and another vision of what Bitcoin could be. A lot of principles got thrown out, and people behaved terribly in a bunch of ways. In the case of Ethereum, there was this big application called the DAO, and the DAO got hacked. And a big portion of all of the Eth was stuck in the DAO. If nothing had been done, the attacker would have been able to get it out after a couple of months. And this was less than a year into Ethereum’s history. So a decision was made to make a change to the rules of the Ethereum protocol to bail out the users of that application. There was this big debate. Some people thought this is fine one time because it was early days, and some people thought that it should be a principle that we never interfere and it’s best to start those principles from day one. We did end up hard-forking to fix the DAO, and a lot of people disagreed. That ended up splitting Ethereum into two chains, Ethereum and Ethereum Classic. Ethereum Classic refused to implement the hard-fork, so they let the attacker get away out of principle. The ways that both communities behaved at the time was not good. People were openly advocating that we should use trademark law to try to not allow Ethereum Classic to exist. And then people were advocating 51% attacks and all kinds of things. I think the reason why people were OK with things that they would totally not have been OK with at any other time is because they were afraid. Ethereum people were afraid that Ethereum Classic would replace and completely destroy Ethereum, and Ethereum Classic people were afraid that their principles were being destroyed by Ethereum, which could then grow to overtake the version of the chain that stuck to its principles. I feel the situation did end up working out well for most people. There hasn’t been a violation of that kind of immutability on Ethereum since, which isn’t something that a lot of people were projecting. A lot of people did think that if you violate the principles once, then it would be open season to do it many times. But no, people even valued not fixing the Parity wallet until a year later in order to set the counter-precedent. We actually do take this very seriously. Naval: There was a bug in a multisig wallet called the “Parity wallet,” which caused a massive loss of funds. But to be clear, I think the DAO hack was much larger in magnitude than anything subsequently, correct? Vitalik: Yeah, it was much larger and it was very unique in that it was even possible to fix it with a fork. Normally when a hack happens, the hacker gets the money instantly and there isn’t a way to fix it, even if you want to. So the DAO was really special and unique in that way. Vitalik’s finest and worst moments in protocol politics Haseeb: As a protocol politician, what do you feel has been your finest moment and your worst moment of blockchain statecraft? Vitalik: Least proud moment? Definitely the handling of the DAO fork situation. A lot of people did feel betrayed as a result of the DAO fork. A lot of people did feel like their expectations got violated. And a lot of people felt like their opinion was disrespected, especially people who opposed the fork. A lot of them did feel like there was this social environment where if you oppose the fork, then you’re evil because you’re pro hackers stealing millions of dollars. That environment ended up turning a lot of people off, and there was a lot more that we could have done to not create that environment and still make people feel welcome despite the disagreement. Haseeb: Do you regret the decision, or do you regret the way in which the decision was made? Vitalik: I don’t think I regret the decision. That decision did have a lot of positive consequences, too, in how it put a controversial stake in the ground. And people interpreted the stake in the ground in different ways. The way I interpret the stake in the ground is that it was a moral statement that said that you can believe in principles without assigning those principles an infinite amount of weight, without saying that we’re going to stick to those principles in absolutely all possible circumstances. That kind of moderation is something that’s very morally important to me personally. It’s very pragmatically important to me personally, too. Most people who try to take a more purist approach end up hitting a scenario that is extreme enough that they have to compromise. If you committed too hard to never compromising, then your rhetorical posture becomes even more screwed up. It’s better to be transparent about these things early on. People who are pragmatic and willing to look at things in a more moderate way, they’re definitely very happy as a result of that. There were even people who believed in moderation that actually opposed the DAO fork, which was interesting. Some ended up sticking with Ethereum despite the DAO fork happening. But there were a lot of people for whom the DAO fork was this watershed moment. They were curious about Ethereum before then, and then they realized that, “Oh wow, no, this was a centralized evil chain.”—which is unfortunate that we can’t satisfy everyone. But on the other hand satisfying everyone is expensive and satisfying everyone is so hard. I sometimes even think had we successfully satisfied everyone during the DAO fork, then might we not have had much harder politics to get proof-of-stake out the door? I don’t know. Becoming a Twitter memelord Naval: I see you taking incredible slings and arrows on Twitter and being very good natured about it. It’s something that Zooko seems to also do. The visible leaders of protocols—or creators or protocols, because I’m not even sure if Ethereum’s really led anymore—they tend to have this ability to operate in public either with a certain nonchalance or with a certain combativeness that normal humans I don’t think could sustain. How did that come about? Do you wish you just remained anonymous? Did you have to go through a learning curve to learn how to deal with all the trolls and all the haters and all the Bitcoin maxis attacking you? Do you wish you could just press a button and disappear from Eth, and then Eth goes into the foundation’s hands? Vitalik: There’s definitely a learning curve. There’s big mistakes that I made in my Twittering in years past, especially times when I would let myself get carried away in a particular discussion, and I’d say something and I feel like I’d have to justify myself, and I’d go into a deeper hole. Naval: You wish you didn’t argue as much on Twitter. Is that what you’re saying? Vitalik: Yeah. You learn over time that there is a good style. The good style, it accepts the criticism with grace. You learn what to respond to. You learn what to let slide, because realistically no one’s going to see it anyway. There’s definitely a subconscious, intuitive art to being a good Twitter memelord and being a good crypto memelord in general. Vitalik’s influence on Eth today Naval: How much influence do you have on Eth today, especially compared to the DAO fork time? My sense was in the DAO fork, you were very involved. If something of that magnitude came up today, how much influence would you ever have relative to what you had then? Vitalik: I feel like my influence in Ethereum keeps decreasing every six months. I have less now than I did six months ago. Six months ago, I had less than I had a year ago. And a year ago, I had less than I had 18 months ago. These days the number of people that even I have to convince to push in a particular direction is significant. If you watch some of the EIPs that I personally promote, some of them don’t even make it. So for a lot of them you have to try pretty hard to satisfy all people’s concerns. Naval: So what’s the biggest thing you’ve pushed that isn’t getting adopted? Vitalik: EIP-4488 is one example. If I had more control it would have been in Ethereum already. Naval: What is that one? Vitalik: This is the one to do a short-term decrease in the gas cost of call data. It’s a fairly technical change that makes roll-ups cheaper in the short-term. Haseeb: It seems to me like a lot of your evolving role within Ethereum shows the ways in which blockchains are like religions. Imagine Ethereum started off as a sect that you founded as a charismatic leader and you were like, “Hey, we’re going to break off from the religion of Bitcoin, or break off from the religion of Mastercoin. I believe in these new principles of Turing completeness.” Once upon a time you were the sect leader, and as the sect becomes a church, there becomes more bureaucracy, more vetocracy. There’s more and more mechanisms that are developing behind the scenes. And pretty soon you might be the charismatic voice of Ethereum, but the formal leadership of Ethereum has taken on its own life force. What is your observation of how Ethereum has become more systematized as a culture compared to what it was five years ago? It’s getting harder to do big things in Eth Vitalik: Today the protocol decisions tend to be done through this mechanism called the all-core devs call. This is a call that happens once every two weeks. As the name implies, all of the core developers come on line and talk about all the proposed protocol changes. Everything that people agree on gets accepted. And if people disagree, then it doesn’t get accepted. So there’s this fairly complicated pipeline that changes have to go through. Step one is the idea making stage. Then step two is the refining stage. Then there’s the stage of convincing more and more people, making a test implementation, eventually turning it into a fully formalized proposal that we call an EIP, an Ethereum Improvement Proposal. And then finally, you get sent to an all core devs, and then if all core devs accepts it, then it eventually goes into a hard-fork, which is what we call a protocol upgrade to Ethereum, which includes changes to the protocol that everyone has to download to get accepted to the network. So there’s this fairly long process. There’s many points along the way where different people have to agree. Even at the beginning, the research team has to agree. And then in the later stages, the core developers, the people actually writing the code, have to agree as well. So it’s definitely more vetocratic, considerably, than it was three years ago—and definitely much more than it was six years ago, when we could get a change accepted and it would get included very quickly. Even now, I feel like the window is closing on substantial things. It’s getting harder to do big things even today. Haseeb: How do you feel about that? Vitalik: In some ways, relieved. Ethereum becoming more vetocratic gives me more freedom to retire. Well, retire is a complicated word. I feel like I’ll keep doing things forever—but what kinds of things? As you’ve mentioned, my role is changing in complicated ways that are hard to describe. Goals Outside Ethereum Naval: What would you be working on if you weren’t working on Eth? Vitalik: Good question. I’d have my big long list of things that I think need to happen. And I would do some combination of writing about and explaining them and probably putting some of my own money into making them happen. I’d try to put teams together and make them happen. This would be things like account security, what we talked about with social recovery wallets, ideas around privacy, some of the secure blockchain-based voting stuff that I’ve been pushing. The entire roadm"
