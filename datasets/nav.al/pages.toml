title = "Vitalik: Ethereum, Part 1"
description = "Haseeb and I interview Vitalik Buterin about Ethereum and blockchains. Also see Part 2.  Transcript   Welcome back to the podcast. We have with us Haseeb Qureshi, who is a partner at Dragonfly and someone I used to work with back when I was more active in crypto-land. More"
full_description = "Apr 8 2022 Vitalik: Ethereum, Part 1 46:06 Get podcast Apple Google Overcast Spotify YouTube Download Apr 8 2022 Haseeb and I interview Vitalik Buterin about Ethereum and blockchains. Also see Part 2. Transcript Naval: Welcome back to the podcast. We have with us Haseeb Qureshi, who is a partner at Dragonfly and someone I used to work with back when I was more active in crypto-land. And we have Vitalik Buterin, who is, of course, the polymath genius—although he may bristle at that description—who created Ethereum, which was the first smart contract blockchain to gain any volume and changed the face of blockchain computing as we know it. Haseeb, do you want to give us a quick, one-paragraph background on yourself? Haseeb’s Background Haseeb: I’m a software engineer by background and I’m now an investor. I run Dragonfly Capital, which is a global crypto fund—we only invest in crypto—and I’ve been doing this for a little bit over four years now. It’s funny because when I first got into crypto, I remember I was actually at IC3, this academic crypto conference, where I met you and Vitalik for the first time. I had just left my job at Airbnb as a software engineer, and I remember I asked you, “What do you think is the most important problem to solve in crypto?” Your answer was something about wallets. You were like, “I think it’s important to build more wallets.” And at that time I had a vague understanding of what that meant, to build wallets. That was what triggered my dive down the rabbit hole of Ethereum. In the very early days when I was first really diving deep into crypto, after that IC3 conference, I remember coming away with a very strong feeling that Bitcoin was going to die. I was like, “Look at the obvious and massive delta in the intellectual energy and character of what’s going on in the Ethereum world, which is everything that I saw at IC3, versus what I saw in the Bitcoin world, which was a whole lot of religious anger and fervor and not a whole lot of innovation.” I turned out to have a very simplistic understanding at that time. But that was how I first got into crypto full-time, through that small interaction that you and I had back then. Naval: You also have a background as a poker player if I remember correctly. Haseeb: That is also correct. In a former life before I got into the technology world, I used to be a professional poker player for about five years. Naval: There’s a strangely large number of us who were either in Magic: The Gathering or in poker before we got into crypto. Vitalik: Or World of Warcraft. Naval: Maybe it’s just geeks and gamers. Haseeb: I do think it’s bigger than that. I have this theory that you and I have talked about before. Every generation there is some hustle that, if you’re really smart, very aggressive in looking for edges and not afraid of looking weird, there are ways to get ahead early or to make a lot of money in a way that’s nonobvious to most people and is maybe even slightly subversive. It’s the kind of thing your parents would raise their eyebrows at if you were spending a lot of time on it. In my day, that was poker. There was a time when it became fantasy sports, then it became crypto, then it became DeFi and liquidity mining, then it became NFT trading. Two years from now there’ll be something else. When NFTs are very professionalized and there’s not that much alpha to be made turning NFTs, there’ll be something else that young, really hungry people who are not afraid of looking dumb are going to be doing to make a lot of money. Naval: Vitalik, you want to give us a quick background? Vitalik’s Background Vitalik: I was born in Russia and moved to Canada when I was 6. When I was halfway through high school, I had already been doing a lot of math, a lot of programming, and I came upon this interesting Bitcoin thing. It fascinated me immediately because of how it combines all of my interests at the time. Bitcoin has the mathematical aspects, it has the cryptography, it has the computer science. It’s all open source software, and I was very into open source software at the time. And then also there’s these economic and political aspects. I had been following Austrian economics a little already. Bitcoin just hit all of those buttons. I started trying my best to join the Bitcoin community. I scoured through the Bitcoin forums looking for jobs that would pay in Bitcoin, because I figured the point of Bitcoin is that you’re supposed to earn it. I found someone willing to pay me 5 Bitcoins—which back then was $4—per article to write articles for his blog, which I did for a few months. Then, a poker player out of Romania named Mihai Alisie reached out to me and said that he was starting a Bitcoin magazine and wanted me to be the first writer. I immediately agreed, and I became the first writer for Bitcoin Magazine. I started doing more and more Bitcoin-related writing, learning about Bitcoin, and eventually more programming-related projects. I did some work for a covert coins library called Bitcoin X and started getting deeper and deeper into the space. Then in mid-2013, I decided that I would take half a year off of university and go around the world and visit all of the Bitcoin communities I could to understand them and see what everyone was up to. After a few months, I came upon these people who were trying to take the blockchain and extend it to do things other than cryptocurrency. There was this project called “Covert Coins” that had existed for a long time that was trying to use the blockchain as this database layer to issue other kinds of assets on top. You could issue shares and digital dollars on the blockchain. There was a project called “Master Coin” that was trying to extend that even further to create a full financial system, to do what we call “DeFi” today. This was a very early version of that. After I spent enough time in these circles, I eventually had my own idea for how to create a more general purpose version of all of these ideas: instead of a blockchain for one application, a blockchain that you could build any application on top of. And that’s where Ethereum came from. Naval: Ethereum is a blockchain on which you can build any application. And Bitcoin is obviously limited to trying to be new money or a new reserve currency, or nowadays some people say “digital gold.” So you were the original creator along with a team that coded it up, and you released it. How old were you when you did that? Vitalik: Nineteen. Naval: And how long had you been in computers at that point? When did you first start programming? Vitalik: I think I started programming when I was around ten or so. Naval: And were you mostly self-taught, or did you go to school for this? What’s the secret here, besides the obvious genetics? Vitalik: I just grew up programming video games for myself to play. I would make a video game, play it until I got tired, then make another video game, and then play it until I got tired. That’s pretty much how I learned all the way up until high school. Naval: Did your parents do anything or did the environment do anything uniquely to foster your development in programming? Vitalik: My parents did buy me a lot of programming books. They did find some programming classes for me and some math classes as well. They were definitely very supportive. Naval: And were you in a gifted program or just a normal public school system or private school? Vitalik: I was in the gifted program or the public schools up until eighth grade. Then for high school my parents moved me over to a private school, and I found the private school to be a much better experience. Naval: Did you meet most of your collaboration colleagues online, or was there a physical place that you were at? Where were they all hanging out for you to stumble into them? Vitalik: It was pretty much entirely online. The Bitcoin world lived on a forum, unless you were in one of the major cities like New York or San Francisco that had a community started almost from the beginning. Bitcoin Magazine was a fully remote company from day one. Bitcoin Weekly, the blog before Bitcoin Magazine, was also fully remote from day one. Naval: And to this day, most of your collaborators are pretty much spread out all over the world. Isn’t that correct? Vitalik: Pretty much. What Is Ethereum? A blockchain you can build any app on top of Naval: Ethereum came out to the world in 2014. If I remember correctly, you’d been developing it for a few years before that. There was a public sale, a lot of people got involved, and then in 2017 there was a boom around people building assets on top of Ethereum, different kinds of coins. Then, of course, gaming, NFTs, DeFi, and all of those things came along. Let’s go through the evolution of Ethereum. What does Ethereum do at a core level? What does it do well? And today, what does it do poorly? What does it need to get better at? Vitalik: I think of Ethereum as a general purpose blockchain. So instead of being a blockchain for one application, it’s a blockchain that you can build any application on top of. The way that you do this on Ethereum is you write a piece of code and you create a digital transaction that contains that piece of code and publishes it. When you publish this transaction and that transaction gets included into a block on the blockchain, this creates an object called a “contract.” This is a virtual object that the blockchain keeps track of. So a contract is an object that contains a piece of code. Now the blockchain has this object that has a piece of code and that is like a little application that the Ethereum blockchain maintains from that point forward. Anyone after that point can send another transaction that says, “I want to talk to this object.” So step one, I create a transaction that creates this object. We’ll call that object X. Then step two, you want to use my application, so you send the transaction, and in your transaction you say, “I want to talk to smart contract X, and here’s a little piece of data that says what I want to do with that application.” When that transaction gets coded in a block, the piece of code that I first published runs, taking as input the data from your transaction, and interprets it in whatever way it wants. We can make this more concrete with an example. Let’s say I have a company and I want to issue shares on the blockchain. I am going to create a transaction that contains a program. The rules of that program are going to say, “Well, what can you do with shares?” We’ll just say you can transfer your shares to someone else and you can vote, right? The program is going to interpret any data that it sees either as an instruction to transfer your shares to someone else or as an instruction to make a vote. I publish this transaction, and that initializes the whole thing. As part of that transaction, I might say, “Naval has 50 shares, Haseeb has 100 shares and I have 25 shares.” So now there is this thing on the blockchain and it has a piece of code. It has its own little memory that says, “I have 25, Haseeb has 100 and Naval has 50,” right? If Naval is feeling generous and wants to give half his shares to me, he is going to create a transaction. And that transaction is going to have some data. It’s going to encode this idea that I, being Naval, want to send 25 of my shares to Vitalik. So you create a transaction that encodes this and send it to the network, and it gets included into a block. Once it gets included, the piece of code runs. The piece of code sees the transaction and says, “OK, clearly I have to transfer 25 shares from Naval to Vitalik. Before, Naval had 50, so I’m going to subtract 25 and now Naval has 25. Before Vitalik had 25, now Vitalik has 50. I’m going to write down that Vitalik has 50 now. Good.” And that’s it. The transaction got processed. Advantages and Disadvantages of Ethereum Eth trades efficiency for transparency Naval: Why do all this in the cloud in this very convoluted way? This is very complicated. Why not just use a normal computer? Why not just send an email? Vitalik: This creates this very transparent, public record of what the rules are. There’s a guarantee that all of the interactions with this application that I created followed the rules. There is no actor that has a backdoor key. Naval: It’s a trusted computer in the cloud, and each of us can verify all of the activity. We can audit all of it, and we know that nobody cheated. Nobody else moved my funds. I was the one who moved the funds and everyone authenticated the code, which was exactly the code that was supposed to be run. And there are obviously sacrifices for this, right? This is not free. Vitalik: Exactly. Even I, as the creator of the contract in this example, do not have the ability to later go in and say, “Oh, I changed my mind. I’m going to give myself 400 shares.” Once I create it and publish it, I have no more privileges than anyone else. The application doesn’t even have an owner. So that’s powerful, right? Completely neutral, completely transparent, visible, treats everyone equally according to what the rules are. Now, what do you sacrifice for this? One big thing that you sacrifice is efficiency. The way that all of these blockchains, including Bitcoin and Ethereum, work is that you have this network of tens of thousands of computers, each of which helps to verify the transaction. When I broadcast this transaction, that transaction goes out to every single computer on the network and every single computer on the network runs that piece of code. Every single computer on the network verifies it. Every single computer on the network processes it. Naval: Parallel computing was, “I take my code, I split it across a thousand computers, and each one runs one-thousandth of the code.” Now I send it to a thousand computers, and all thousand computers run my code. Vitalik: Exactly, it’s very different computing. One way to intuitively think about why it makes sense is to compare text to audio and video. Right now we’re recording a podcast, and the podcast has some audio and some video. To see each other on video, there’s hundreds of thousands of bites that are flowing around between us every second. Technically, those hundreds of thousands of bites aren’t necessary. If you wanted to, we could just do the whole thing over a text conversation. But there are benefits to us being able to hear each other’s voices and see each other’s expressions. So there’s already lots of very high overhead computation that people do with their computers. Video and audio are great examples. Like plain text, Eth is simple and efficient The things that happen in the blockchain are more similar to text—like Naval minus 25, Vitalik plus 25. It’s this extremely simple, extremely efficient stuff. So, it’s perfectly viable to have many thousands of users and even millions of users’ activity all get verified by one single computer, because the blockchain does"
