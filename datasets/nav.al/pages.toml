["https://nav.al/deutsch-files-iv"]
title = "The Deutsch Files IV"
description = "Brett Hall and I interview David Deutsch, physicist and author of The Beginning of Infinity. Also see The Deutsch Files I, II, and III.   I can only start with what understanding I want. And I know I’ve asked you this before, but I want to be pedantically exhaustive about connecting the four theories of The Fabric of Reality. More"
full_description = "Oct 11 2024 The Deutsch Files IV 1:25:05 Get podcast Apple Overcast Spotify YouTube Download Oct 11 2024 Brett Hall and I interview David Deutsch, physicist and author of The Beginning of Infinity. Also see The Deutsch Files I, II, and III. Naval: I can only start with what understanding I want. And I know I’ve asked you this before, but I want to be pedantically exhaustive about connecting the four theories of The Fabric of Reality. And the reason I bring that up is because I think most people still view what you’ve written as being four separate things. And it’s hard enough to grasp these four separate things because they’re actually fairly deep and wide-ranging theories. But I think, in your mind, they connect together into one thing. Knowledge is a crystal and nature has no boundaries, right? These are just phrases, but these things all connect together. Connecting the Four Theories into a Unified Whole So we’ve talked in the past, for example, how epistemology and evolution connected, that they’re both forms of knowledge creation. We’ve talked about how quantum physics and computation connect to create quantum computation. I’d just love to get as many examples. How does physics connect to evolution? How does evolution connect to computation? For example, things that may be less obvious where people might view things as different theories, but to you, they’re fundamentally the same. David: Yeah. Evolution and epistemology, people find both of those, the connection between both of those and physics, very counterintuitive because most people think of physics in a very bottom-up way. And I think, for completely independent reasons, such as Constructor Theory, that’s a mistake. Ever since that idea caught on, like sometime after Newton, physicists have tried to shoehorn other physical theories into that mold, and that gives rise to, for example, the problem of the foundations of thermodynamics and statistical mechanics. How can you have an exact second law when the fundamental theories of physics are all time-reversible and the second law is time-irreversible? How can you have that? The prevailing view is thermodynamics and epistemology are both emergent theories. And, therefore, not fundamental from the physics point of view. And therefore, if we want to understand the universe at a fundamental level, we needn’t bother with those. Those are just like the theory of washing machines or gardening. I think that’s artificial. And especially when they have to get very embarrassed when they exclude thermodynamics from physics in that way. I think a theory which is going to go deeper than the current paradigm of physics is going to have to put emergent phenomena and emergent theories on the same level as microscopic theories. People talk about reductionism and holism and some people are reductionists and some people are holists. I think I want to put them both in a sack and tie it up and let them come out with a resolution. There cannot be a criterion for excluding a set of theories from the body of knowledge other than whether they’re good explanations. Yes, abandon them if they’re not good explanations. But if they are, why make a class distinction between them? It’s just going to lead to error. And I think it has led to errors in thinking about the world. So that’s the connection between physics and those two. Emergence Is Fundamental Naval: What you just said, for example, is that reductionist theories aren’t the only theories there are because they don’t form good explanations at the level where you need them. David: Yes. Naval: Because especially when you have emergence, then you have very unpredictable things. You’re not going to calculate all the particle collisions from the Big Bang till now to figure out how humans evolve. Or how species evolve. At every level of emergence, there is a possibility for an explanation that explains that level. And you need that explanation. David: Yes, exactly. Naval: So, I think that’s very helpful. And in your thermodynamics example, if you’re trying to figure out how a steam engine works, you’re not going to do statistical mechanics and trace every collision. You’re going to actually probably start at thermodynamics. Yes. And so, that’s a tie between, I guess, is it evolution and physics? No, it’s epistemology and physics. David: So, thermodynamics is emergent physics. And in terms of those four, it is epistemology. But that just shows that terminology is misleading. Brett: The terminology in particular of the word “fundamental”, which I think you use slightly differently to the majority of others, especially physicists, they hear, and anyone listening to this, hears fundamental and thinks reductionism automatically. For example, you would say that people are a fundamental feature of reality. So, what does fundamental therefore mean? David: So, fundamental ideas are the ones that are needed in more types of explanations. We’ll never get to the ultimate fundamental theory, because that would mean that there were no more problems. That can’t happen. But yes, so that’s how I use the word fundamental. Naval: I think you also said something related, which is that if reality is what is needed in your explanation or what has to exist in the explanation for the explanation to make sense. David: It’s a rule for deciding that something is real. Naval: Yeah. David: It’s not the meaning of real, because there are things we don’t understand about “real”. Like, in what sense are numbers real and abstract objects real? And in case physicists don’t like that, I always ask: In what sense are laws of physics real? Because we can’t trip over one, but on the other hand, we can’t understand anything in physics without them. So, they’re real. Brett: Some would claim we are cognitively incapable of understanding physics full stop up to a certain point. This is the idea that Richard Dawkins has of “Middle World” which was cropping up very recently in discussions. Our brain evolved on the African savannah in order to survive. So, it should be no mystery to us, no agreement about what quantum theory means, because in fact we are cognitively closed to understanding things that are too small, things that are outside middle world because they travel too fast or are too large like the entire cosmos. But this is flawed because of universality? David: Among other things. Naval: We understand quasars and subatomic particles. David: If that argument had been valid, then we would have stopped a long time ago in understanding things, especially like mathematics, but also physics. Brett: And that then brings up this connection or draws out this connection between quantum physics and epistemology. Can you draw that line, that connection? David: So, the nicest one, I think this is the one that Naval also likes best. The idea of a crystal in the multiverse. If knowledge is a kind of information, which once it’s there, keeps itself in existence and gets that property by error correction. Then, since there are many errors for every possible truth, many possible errors for every truth, then in the multiverse, if there’s error correction, then there are a bunch of unlike universes, which become alike in the region in which they’re correcting errors. And, so, that’s a striking connection between epistemology and physics. I hope that this kind of connection will be amplified once we get to formulating theories of knowledge and so on in constructor theory. Constructor theory isn’t limited to the parochial properties of quantum theory. It emerged from quantum theory, but it emerged from problems in quantum theory. But it’s a level of description, and I’m gesticulating as if it was a higher level, but actually it’s a lower level of description than quantum theory. It’s more reductionist than quantum theory, and yet it is more compatible with emergent properties. We’re hoping eventually that things like knowledge and economics, ultimately consciousness maybe, though my own view is that consciousness will require an extra idea, not just elaborating ideas from within constructor theory. It requires an idea, another idea, at least one. Constructor Theory Could Transform Multiple Fields Brett: Hitherto, the line from Newton through to Einstein and then to quantum theory has been ever more difficult and elaborate mathematics. And, so, then string theory comes along, and this I think leads to the general opinion that the next theory of physics will be more mathematically challenging, and hence all the reasons earlier that maybe we won’t be able to understand it. But constructor theory seems to have echoes of that famous Feynman line where he said that perhaps the ultimate laws of physics, or whatever he meant by that, would be more like the rules of the checkerboard than some fancy dynamical mathematical laws. Is that what you have in mind with constructor theory? Some checkerboard type notion of possible and impossible moves. David: Yeah, it could be just like that. If you have a listing of all the moves in a game of chess, you can’t understand what’s happening there unless you know the rules of chess. But knowing the rules of chess, the people who make chess programs think that if you know the rules of chess, you can understand all the games, but they’re not true. If you want to understand the games as opposed to just win them, then you need a lot more than just the rules. And yeah, Constructor Theory is just like that. We hope. Brett: But it’s more than just physics, as you say. This is an explanation that’s not merely about fundamental laws of physics, but is it extendable into biology and epistemology? David: Yeah. Or you could say that physics is going to consume all those fields, just like it has consumed many other fields. We think of Constructor Theory as a theory of physics. And if it consumes those fields, that’s what physics has always done. Naval: Okay. Can I back up for a second on Constructor Theory? Because I think it’s the part that might be understood the least by the general audience. I know that Chiara wrote a book on it. You have not yet written extensively for the lay people on it. What problem are you trying to solve? And where are you at so far? And what level of confidence do you have that this is the right thing to do, approach to go down? David: Oh, those are very long, long questions. Naval: It’s okay. I think the answer is illuminating. David: So, when I wrote my first paper on Constructor Theory, which was a philosophical paper, it didn’t really have any physics. It was published in Philosophical Journal and I wanted to explain what we were trying to do, what this research program is, because we didn’t know at the time, and we still don’t. What the definitive rules of constructor theory are going to be, we’re going to find those as we find the applications. So, I thought I would give some motivation. We don’t have a good theory of initial conditions. Think carefully, why should we need initial conditions when we are perfectly fine to have no theory of the final conditions? So that’s one thing. And then the thermodynamics thing. And then there’s the fact that things like computation and information can’t be expressed in the initial conditions plus laws of motion way. And I thought I would write a quick paper and I ended up with 18 motivations. And you can look up the paper if you want to see all 18. I can’t think of them all now, but this seemed to me a motivation for thinking that this constructor theoretic approach was a very simple change in worldview in a certain way. You can say very quickly what the change is, but the ramifications are huge. And it seems to touch all these problems in different fields. And that’s what motivated me to try to make a theory out of this. And the next thing that happened was that I gave a talk at the Clarendon Laboratory and Chiara was in the audience. She was a graduate student working on quantum information. And she came up to me afterwards and said, uh – what about – so that can’t be right. Can it? Because… I had indeed contradicted myself in the talk. And so, then she came round and, and we chatted about it, and I said, do you want to work on it? Because there’s a lot more to work on than one person can do, especially me. So, she said, yes. And since then, she’s worked on the Constructor Theory of Life, Constructor Theory of Probability, which in a way, translating existing theories into constructor theoretic form. And uncovering little nuggets. My favourite nugget is that in constructor theoretic thermodynamics, the first law is to do with information, not just the second law. So the way she defines the first law is similar to statistical mechanics, but you end up with the first law that’s about, you can do this and not that, you can do this and not that, and as a result, you get the version of the first law, but better than normal because it incidentally has the property that, let me see if I get this right, I think it incidentally has the property that there must be a lower bound on the energy, whereas existing thermodynamics doesn’t. You have to put that in as an extra axiom. And if there were no lower bound, then you could have an object that you were just extracting energy out of without violating second law, just first law, extracting energy forever. And that would make a perpetual motion machine of the first kind. In the existing thermodynamics, you have to impose that as an extra condition and construct theory, you don’t have to. Meanwhile, I’ve been, no, we, we have together been working on the Constructor Theory of Time. Yeah, perhaps I should say something about the Constructor Theory of Time. Really the first people to have this idea were Wheeler and DeWitt, who were trying to find a viable theory of quantum gravity. And they found a theory of quantum gravity in which there’s no time. Time doesn’t appear in the theory. There’s just different spaces, three dimensional spaces, which all have amplitudes, quantum mechanical amplitudes, and they all exist simultaneously. And time is an emergent property the way they are entangled with each other, but nothing ever changes. It’s just an emergent property of how they’re entangled. And then, Julian Barbour made a big thing out of it, wrote a whole book about it, then Page, so that was a theory tied to general relativity. It would only work in the context of general relativity. Page and Wootters made a construction that will work in any quantum theory, not just quantum theory of gravity, but any quantum theory, you can formulate a theory of time that doesn’t have things changing in it. And, so, the static universe still has time because of entanglement. So that is more general. It doesn’t require Wheeler and DeWitt’s specific theory of space time and when I saw Page and Wootters’ theory, I immediately thought, yeah, this is it. This is what time is. And then many people have tried to get something more out of "
