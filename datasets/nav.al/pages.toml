["https://nav.al/infinity"]
title = "The Beginning of Infinity, Part 1"
description = "A collection of all the episodes on The Beginning of Infinity.   Science Is the Engine That Pulls Humanity Forward  “Believe in science” is an oxymoron  Welcome, Brett, to the eponymous Naval podcast. The topic that we started out on was the timeless principles of wealth creation. More"
full_description = "Jul 2 2021 The Beginning of Infinity, Part 1 66:09 Get podcast Apple Google Overcast Spotify YouTube Download Jul 2 2021 A collection of all the episodes on The Beginning of Infinity. Science Is the Engine That Pulls Humanity Forward “Believe in science” is an oxymoron Naval: Welcome, Brett, to the eponymous Naval podcast. The topic that we started out on was the timeless principles of wealth creation. And then we touched a little bit on internal happiness and peace and well-being. I’m first and foremost a student of science. I’m a failed physicist, in the sense that I loved physics, I wanted to pursue it, but I never felt I was going to be great at it. I was more pulled into technology, which is applied science. Nevertheless, I remain a student of science. I remain fascinated by it. All of my real heroes are scientists, because I believe science is the engine that pulls humanity forward. We’re lucky to live in an age when scientific and technological progress seem not likely, but inevitable. We’ve gotten used to this idea that life always gets better. Despite all the complaining about how productivity growth is stagnant, the reality is, anyone who owns a smartphone or drives a car or even lives in a house has seen technology improve their quality of life over and over again. We take this progress for granted, and it’s thanks to science. To me, science is also the study of truth. What do we know to be true? How do we know something to be true? As I get older, I find myself incapable of having an attention span for anything that isn’t steeped in the truth. The background on this particular podcast series is that I thought I knew a lot about science. And there was a lot about science that I took for granted, such as what a scientific theory is and how scientific theories are formed. Most of us have a vague idea of it. Some people think science is what scientists do, which has a definitional problem. What is a scientist? Other people think science is making falsifiable or testable predictions, and maybe that’s closer to it. Sometimes people say, “It’s the scientific method.” And what is the scientific method? And then they start describing their junior high school chemistry experiment and lose the trail after that. Especially these days, when we’re told to “believe in science”—which is an oxymoron—people respect science, but they don’t understand what science is. The idea of what science is gets hijacked, sometimes by well-meaning people who want to convince you of the science and sometimes by not so well-meaning people who want to influence the way that you think and feel and act. The Beginning of Infinity David Deutsch’s book expanded my repertoire of reasoning Naval: I was pleasantly surprised a couple of years back when I opened an old book that I’d read a decade ago called The Beginning of Infinity by David Deutsch. Sometimes you read a book and it makes a difference right away. Sometimes you read a book and you don’t understand it; then you read it at the right time and it makes a difference. This time I went through it much more meticulously than I had in the past. Rather than reading it to say I was done reading it, I read it to understand the concepts and stopped at every point where something was new. It started re-forming my worldview. It changed the way that I think. I credit this book as being the only book in the last decade—except maybe a few of Nassim Taleb’s works and maybe one or two other scattered books—that made me smarter. They literally expanded the way that I think. They expanded not just the repertoire of my knowledge but the repertoire of my reasoning. People throw around the phrase “mental models” a lot. Most mental models aren’t worth reading or thinking about or listening to because they’re trivial. But the concepts that came out of The Beginning of Infinity are transformational because they very convincingly change the way that you look at what is true and what is not. Karl Popper laid out the theory of what is scientific and what is not; what is a good explanation and what is not. Deutsch dramatically expands on that in The Beginning of Infinity. The wide-ranging nature that he covers is incredible. He covers epistemology—which is the theory of knowledge—quantum mechanics, multiverse theory, infinity, mathematics, the reach of what is knowable and what is not knowable, universal explanations, the theory of computation, what is beauty, what systems of politics work better, how to raise your children, and more. These are all-encompassing, long-range philosophical ideas. Nullius in Verba Take no one’s word for it Naval: The Beginning of Infinity is not an easy book to read. Deutsch wrote it for other physicists and philosophers. He has a certain peer group that he respects, and that respects him, and he has to meet them at their level. I wanted to understand the principles in the book so I could confirm or refute them for myself. I love the old motto from the Royal Society, “Nullius in Verba,” which means, “Take no one’s word for it.” In other words, figure it out yourself. That’s the only way to know anything. To do that, I was reading the book and started reading blog posts on it. Eventually I came across Brett Hall and started listening to his podcast, ToKCast, which stands for the “Theory of Knowledge-Cast.” I’ve brought him on this podcast to discuss the ideas in The Beginning of Infinity. Brett, listening to your podcast helped me clarify a lot of these principles. I would love to explore the depth, clarity, reach, and importance of these ideas. Then hopefully someone out there can become smarter by it. Brett Hall: Hello Naval, it’s great to be here. You’ve raised so many interesting aspects of The Beginning of Infinity, which has become a real passion of mine. Like a lot of people who enter science, when I was at school I thought, “Well, I want to be an astronomer, so I’ll go to a university and do a physics degree, then do an astronomy degree, and then become a professional astronomer.” One day I picked up David Deutsch’s The Fabric of Reality in a bookstore and started reading it. The first chapter described what I was trying to achieve in my life. It was putting into words what I felt my university studies and my general outlook on life was about. Deutsch says that the ancient philosophers thought they could get an understanding of the entire world. As time passed, though, modern science made it seem as though this was an impossible project. There’s no way you could understand everything about reality. There’s too much to know. How could you possibly know everything? Explanations That Reach the Entire Universe We can understand anything that can be understood Brett: At the beginning of The Fabric of Reality, David Deutsch presents this idea that you don’t need to know every single fact to fundamentally understand everything that can be understood. He presents this vision that there are four fundamental theories from science and outside science: quantum theory, the theory of computation, evolution by natural selection, and epistemology—which is the theory of knowledge. Together they form the worldview, or lens, through which you can understand anything that can be understood. Naval: I saw a beautiful video with him on YouTube where he was making the same points. He said, “You don’t have to memorize and know every fact. You don’t have to know where every particle moved. If you understand the deep underlying theories behind everything, then you know at a high level how everything works.” And this can all be understood by a single person, a single brain, a single human being. It’s accessible to anybody. That is a jaw-droppingly powerful idea. We can have explanations that can reach the entire universe. It’s interesting that the theory of relativity is not in the list of four theories. Brett: Deutsch regards quantum theory as being deeper than the theory of relativity. It’s not to say that we’re dismissing relativity, but his guess is that quantum theory will be more foundational than the theory of relativity. There’ll be a space-time of the multiverse, and the multiverse is David’s explanation of quantum theory. That’s why relativity doesn’t appear among them. At some point most physicists expect that we’re going to have a unification of quantum theory and the theory of relativity. Read the Best 100 Books Over and Over Again Many claim to read, but very few understand Naval: The Beginning of Infinity reminds me the most of Gödel, Escher, Bach in that it is very wide-ranging and stitches together ideas from many different disciplines. It’s very difficult to understand and follow completely. Everyone claims to have read it, but, as far as I can tell, very few people understand it. I had this experience in college when I first found Hofstadter’s work. I remember that I put it on my bookshelf and I started reading it, and I started reading it, and I started reading it. About a year later, I was probably halfway through it. Then I just ran out of time. I had other things going on. I remember that I would approach my other friends in college and would say, “This is a great book, you should read it.” And a week later they’d roll back and say, “Yeah, I read Gödel, Escher, Bach. It was great.” And I felt like the stupidest person in college. It was only years later that I realized nobody had read it. When you get older, you get more confident in those confessionals, where you either say, “I didn’t read it” or “I read it at a constant pace and when I encountered something I didn’t understand, I kept going.” I confess, to this day I have not read all of Gödel, Escher, Bach. But at least at this point, I’ve gone through and found the parts that were most interesting to me—which were the Gödel parts—and did read those and try to understand them. I skipped the parts that were not as interesting to me—which were the Bach parts. The Beginning of Infinity is similar. Everybody in my social circle has it on their bookshelf. Many claim to have read it, but very few have gotten it. I go back to this point that was first eloquently stated on Twitter by a character named @illacertus, who essentially wrote,“I don’t want to read all the books; I just want to read the best 100 over and over again.” I’m currently stuck in a loop where, at least in science, I’m only going to read The Beginning of Infinity and The Fabric of Reality over and over again until I understand them fully. If I had read them 20 years ago, I would know a lot more, because then I would have chosen the right books and the right authors to read subsequently. It’s a hard book to follow. You should buy the hardcover and electronic versions, so you have it all. Brett: And the audio version. Naval: Get it every way possible. If you can get through it in the first sitting and understand all the points at a deep level, then congratulations. But if not, we’re hoping to break it down for you. We’re at the Beginning of an Infinity of Knowledge Progress is inevitable as long as we have good explanations Brett: The difference with The Beginning of Infinity is you’re getting a worldview. You’re not getting the standard take from physicists about how to understand quantum theory. You’re not getting the standard take of how to understand knowledge from philosophers. And you’re certainly not getting the standard take of how to understand mathematics from mathematicians. Deutsch is an expert in all these areas. Naval: What’s at the core of the worldview? Brett: Deutsch’s worldview is that reality is comprehensible. Problems are solvable, or “soluble,” as he writes. It’s a deeply rationally optimistic worldview that believes in good scientific explanations and progress. Progress is inevitable as long as we have these good explanations. Good explanations have tremendous reach. They are acts of creativity. Humans are problem solvers and can solve all problems. All sins and evil are due to a lack of knowledge. One can be optimistic about constant progress. That’s what the title refers to: We’re at the beginning of an infinite series of progress. It’s a very optimistic take. It states that we are at home in the universe and the universe is ours as a resource to learn about and exploit; that material wealth is a set of physical transformations that we can affect; that everything that is not forbidden by the laws of physics is eventually possible through knowledge and knowledge creation. He also writes about how humans are universal explainers, that anything that can be known and understood can be known and understood by human beings in the computation power of a human system. Everything is knowable by humans. We’re at the beginning of an infinity of knowledge. We understand things using good explanations and constantly replace old theories with better ones. There’s no endpoint in sight. There’s no perfection. Every theory can be falsified eventually and improved. We are on our way to being able to do everything that is not forbidden by the laws of physics. People Are a Force of Nature We create knowledge that transforms the universe Brett: Knowledge is what transforms the world. We can take some raw material that has no particular use and within that raw material, we can find uranium nuclei, which then can be used to create bombs or energy in a nuclear reactor. We can find within something that for almost the entire geological existence of the earth sat there inert and would have done nothing, absent people. People are the entities within the universe that create explanations. They’re able to explain what raw materials might be transformed into. Now, what are they transforming these raw materials into? Civilization. People creating knowledge end up becoming literally a force of nature. If we seek to explain something like the shape of a galaxy or the shape of a star, any astrophysicist will give you a story based upon the laws of physics about how gravity will pull things into spheres, how the laws of thermodynamics will cause certain kinds of gas to heat up and expand. All of the known laws of physics are sufficient to explain what we see out there in the cosmos. But the laws of physics alone will not be able to explain the appearance of Manhattan. You have to invoke things other than merely the fundamental laws of physics. You need to invoke the existence of people and their capacity to explain the world scientifically, philosophically and politically. It’s all of those things that will come together to explain why we have certain structures like skyscrapers in Manhattan. This is a profound idea. It’s an idea that seems to have been overlooked by scientists, many of whom have a reductionist idea about how to explain what we see in our environment. They seek to explain only the natural phenomena that are in an environment. Of course, everyone wants to know how the laws of nature work. But if we want to understand how the universe is going to evolve over tim"
