title = "David Deutsch: Knowledge Creation and The Human Race, Part 1"
description = "I interview David Deutsch, physicist and author of The Beginning of Infinity. Also see Part 2.  Background   My goal isn’t to do yet another podcast with David Deutsch. There are plenty of those. I would love to tease out some of the very counterintuitive learnings, put them down canonically in such a way that future generations can benefit from them, and make sure that none of this is lost.   Your work has been incredibly influential for me. More"
full_description = "Feb 11 2023 David Deutsch: Knowledge Creation and The Human Race, Part 1 43:49 Get podcast Apple Google Overcast Spotify YouTube Download Feb 11 2023 I interview David Deutsch, physicist and author of The Beginning of Infinity. Also see Part 2. Background Naval: My goal isn’t to do yet another podcast with David Deutsch. There are plenty of those. I would love to tease out some of the very counterintuitive learnings, put them down canonically in such a way that future generations can benefit from them, and make sure that none of this is lost. Your work has been incredibly influential for me. I carry a copy of The Beginning of Infinity or The Fabric of Reality with me wherever I go. I’m still reading these same books after two years, trying to absorb them into my worldview, and I learn something new from them every day. There’s a lot of counterintuitive things in there. You’re skewering a lot of sacred dogmas. Sometimes you do it in passing with a single sentence that takes me weeks to unpack properly. This recording is not for the philosophers, and it’s not for the physicists. This is for the layman, the average person. We want to introduce them to the principles of optimism, The Beginning of Infinity, what sustainability means, and anthropomorphic delusions. As an example, you overturn induction as a way of forming new scientific theories. That’s this idea that repeated observation is what leads you to the creation of new knowledge—and that’s not the case at all. This came from Popper, but you built upon it. You talk about how humans are very different and exceptional and how knowledge creation is a very exceptional thing that only happens in evolution and the human brain as far as we know. You talk about how the earth is not this hospitable, fragile spaceship earth biome that supports us, but rather it’s something that we engineer and we build to sustain us. I always recommend that people start with the first three chapters at The Beginning of Infinity because they’re easy to understand but they overturn more central dogmas that people are taking for granted in their base reasoning than almost any other book I’ve ever seen. I think it’s important to point out to listeners that your philosophy isn’t just some arbitrary set of axioms based on which you view the world. I think of it as a crystalline structure held together by good explanations and experimental evidence that then forms a self-consistent view of how things work. It operates at the intersection of these four strands that you talk about in the fabric of reality: epistemology, computation, physics, and evolution. The Human Race It’s intuitively obvious that humans are unique Let’s get into humans. There’s the classic model: You start with a fish and then it becomes a tadpole, and then a frog, and then some kind of a monkey, and then an upright, hunched over creature. A human is just this progression along all the animals. But in your explanation, there’s something fundamentally different that happens. You talked about this in a great video, which I encourage everybody to look up. It’s titled, “Chemical Scum That Dream of Distant Quasars.” What are humans, how are they unique, how are they exceptional, and how should we think of the human species relative to the other species that are on this planet? David Deutsch: Every animal is exceptional in some way. Otherwise, we wouldn’t call them different species. There’s the bird that can fly faster than any other bird, and there’s the bird that can fly higher than any other, and so on. It’s intuitively obvious that we are unique in some way that’s more important than all those other ways. As I say in The Beginning of Infinity, in many scientific laboratories around the world, there is a champagne bottle. That bottle and that fridge are physical objects. The people involved are physical objects. They all obey the laws of physics. And yet, in order to understand the behavior of the humans in regard to the champagne bottles stored for long periods in fridges—I’m thinking of aliens looking at humans—they have to understand what those humans are trying to achieve and whether they will or won’t achieve it. In other words, if you were an alien that was looking down on the earth and seeing what’s happening there and trying to explain it in order to explain everything that happens on earth—and let’s suppose that these aliens are so different from us, there’s nothing familiar about us—in order to understand stuff that happens on earth, they would need to know everything. Literally. For example, general relativity. They need that to explain why this one monkey, Einstein, was taken to Sweden and given some gold. If you want to explain that, you’ve got to invoke general relativity. Some people get the Fields medal for inventing a bit of mathematics. To understand why that person won the Fields medal, they’d have to understand mathematics. And there’s no end to this. They have to understand the whole of science, the whole of physics, even the whole of philosophy and morality. This is not true of any other animal. It’s not true of any other physical object. For all other physical objects—even really important ones like quasars and so on—you only need a tiny sliver of the laws of physics in order to understand their behavior in any kind of detail. To understand humans sufficiently well, you must understand everything sufficiently well. Humans are the only remaining physical systems that we know of in the universe of which that is true. Everything else is really inconsequential in that sense. Things that create knowledge are uniquely influential in the universe Naval: You have a beautiful definition of knowledge, which most people don’t even try to tackle, about how knowledge perpetuates itself in the environment. You gave some really good examples. One was around genes. Successful, highly adapted genes contain a lot of knowledge and can cause themselves to be replicated because they’re survivors. In the same way, knowledge itself is a survivor, in that if you transmit to me the knowledge of how to build a computer, it’s an incredibly useful thing. I’m going to build more and more computers and that knowledge will be passed on. Your underlying point that you repeated here was if you want to understand the physical universe you have to understand knowledge, because it is the thing that over time takes over and changes more and more the universe—more than almost anything else. You have to understand all the explanations behind it. You can’t just say “particle collisions” because that explains everything, so it explains nothing. It’s not a useful level to operate at. Therefore, the things that create knowledge are uniquely influential in the universe. And as far as we know, there are only two systems that create knowledge. There’s evolution and there are humans. But is there a difference even between these two forms of knowledge creation, between evolution and between humans? David: Yes. I have argued that the human way of creating knowledge is the ultimate one, that there aren’t any more powerful ones than that. This is the argument against the supernatural. Assuming that there is a form of knowledge creation that’s more powerful than ours is equivalent to invoking the supernatural, which is therefore a bad explanation—as invoking the supernatural always is. The difference between biological evolution and human creative thought is that biological evolution is inherently limited in its range. That’s because biological evolution has no foresight. It can’t see a problem and conjecture a solution. Whenever biological evolution produces a solution to something, it’s always before natural selection has even begun. This is Charles Darwin’s insight. This is the difference between Charles Darwin’s theory of evolution and the other theories of evolution that had been around for a century or more before that, including Charles Darwin’s grandfather and Lamarck. The thing they didn’t get is that the creation of knowledge in evolution begins before. That means that biological evolution can’t reach places that are not reachable by successive improvements, each of which allows a viable organism to exist. Creationists say that biological evolution has, in fact, reached things that are not reachable by incremental steps, each of which is a viable organism. They’re factually mistaken. The thing which they have in mind is the idea of a creator who can imagine things that don’t exist and who can create an idea that is not the culmination of a whole load of viable things. A thinking being can create something that’s a culmination of a whole load of non-viable things. Explanatory creativity makes humans unique Out of all the billions and billions of species that have ever existed, none of them has ever made a campfire, even though many of them would’ve been helped by having the genetic capacity to make campfires. The reason it didn’t happen in the biosphere is that there is no such thing as making a partially functional campfire; whereas there is, for example, with making hot water. The bombardier beetles squirt boiling water at their enemies. You can easily see that just squirting cold water at your enemies is not totally unhelpful. Then making it a bit hotter and a bit hotter. Squirting boiling water no doubt required many adaptations to make sure the beetle didn’t boil itself while it was making this boiling water. That happened because there was a sequence of steps in between, all of which were useful. But with campfires, it’s very hard to see how that could happen. Humans have explanatory creativity. Once you have that, you can get to the moon. You can cause asteroids which are heading towards the earth to turn around and go away. Perhaps no other planet in the universe has that power, and it has it only because of the presence of explanatory creativity on it. Naval: Related to that, I had the realization after reading your books that eventually we’re likely as humans to beat viruses in a resounding victory, because viruses obviously evolve as biological evolution and we are using memes and ideas and jumping far ahead. So we may be able to come up with some technology that can destroy all viruses. We can evolve our defense much faster. I did tweet something along these lines, and a lot of people attacked me over it because I don’t think they understand this difference between the two forms of knowledge creation we’re talking about here. David: We have what it takes to beat viruses. We have what it takes to solve those problems and to achieve victory. That doesn’t mean we will. We may decide not to. Naval: Related to that, the base philosophy today that seems to be very active in the West is that we’re running out of resources; humans are a virus that has overrun the earth and is using up scarce resources; therefore, the best thing we can do is to limit the number of people. People don’t say this outright because it’s distasteful, but they say it in all sorts of subtle ways like, “Use less energy. We’re running out of resources. More humans, just more mouths to feed.” Whereas, in the knowledge creation philosophy, it says, “Actually, humans are capable of creating incredible knowledge. And knowledge can transform things that we didn’t think of as resources into resources. And in that sense, every human is a lottery ticket on a fundamental breakthrough that might completely change how we think of the earth and biosphere and sustainability.” So how did you come to your current views on everything from natalism—should we have more children—to sustainability? Are we running out of resources to spaceship earth? Is this a unique and fragile biome that needs to be left alone? David: When I was a graduate student, I went to Texas for the first time. I encountered Libertarians for the first time. Those people had a slogan about immigration. The slogan was, “Two hands, one mouth,” which succinctly expresses the nature of human beings. They are, on balance, productive. They consume and they produce—but they produce more than they consume. I think that’s true of virtually all human beings. I think virtually all humans, apart from mass murderers or whatever, create more wealth than they destroy. Other things being equal, we should want more of them. Of course, if in a particular situation that would cause bringing someone into the world in the war zone, you might think that’s immoral because it’s unfair on them. But even then, if it’s not worth doing for moral reasons, as far as cold, hard economics goes, it’s probably better to do it. Knowledge Creation Preserving the means of error correction is the base of morality Naval: You define wealth in a beautiful way. You talk about wealth as a set of physical transformations that we can affect. So as a society it becomes very clear that knowledge leads directly to wealth creation for everybody. A given individual can obviously affect physical transformations proportional to the resources available to them—but much more proportional to the knowledge available to them. Knowledge is a huge force multiplier. You then define resources as the thing that you combine with knowledge to create wealth. New knowledge allows you to use new things as resources and discard old things that maybe we’re running out of. There are lots of examples of how we’ve done that in the past. For example, in energy we’ve gone from wood to coal to oil to nuclear. But then people say, “Now we’re out of ideas. Now we’re caught up. Now we’re done. There aren’t going to be new ideas, and now we have to freeze the frame and conserve what we have.” The counter to that is, “No, we’ll create new knowledge and have new resources. Don’t worry about the old ones.” Well they say, “If you’re going to have new resources, if you can’t think of them now, it’s not real.” This now gets into the realm of people demanding that if you’re going to claim that new knowledge will be created, you have to name that knowledge now. Otherwise it’s not real. But that seems like a Catch-22. David: It does, and it’s a bad argument. I don’t want to claim that the knowledge will be created. We’re fallible; we may not create it. We may destroy ourselves. We may miss the solution that’s right under our nose, so that when the snailiens come from another galaxy and look at us, they’ll say, “How can it possibly be that they failed to do so-and-so when it was right in front of them?” That could happen. I can’t prove or argue that it won’t happen. What I always argue, though, is that we have what it takes. We have everything that it takes to achieve that. If we don’t, it’ll be because of bad choices we have made, not because of constraints imposed on us by the planet or the solar system. Naval: It will be by anti-rational memes that restrict the creation of knowledge and the growth of knowledge. David: Maybe. Or maybe it’ll be by well-intentioned errors, which nobody could see why th"
