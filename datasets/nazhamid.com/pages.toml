["https://nazhamid.com/journal/music-in-2024"]
title = "Naz Hamid • Music in 2024"
description = """
Music in 2024
  The artists, albums, and songs that were a hell yes this year."""
full_description = '''The last few years have been great for discovering even more artists, and the revivals and reunions of some of them have produced music that is fresh, with new takes and, even better, genre-bending and blending. Here are the albums and songs that were a definite hell yes for me this year, which I kept on permanent heavy rotation. Balance and Composure, With You In Spirit I discovered Balance and Composure just two or so years ago. By then, I didn't realize they hadn't released an album since 2016 and had essentially broken up. But the three records they had made left a mark on me, bringing back the fire and emotion to emotional hardcore that was co-opted by mainstream "emo" bands that made up the When We Were Young megafestival in recent years. Lo and behold, they released a two-song EP in 2023, and in late 2024, the full-length With You In Spirit dropped, much to the joy of many fans, including myself. Produced and co-written with Will Yip, who I argue is producing some of the best artists today, it has a great sense of tone and production and brings everything that the band developed in their previous three albums into their best release to date. Singer and guitarist Jon Simmons' foray into autotuned R&B and hip-hop via his Cowards project has even more influence here, bringing some of the most melodic and catchy vocals with layers and call-and-response styles more evident than ever before, which pays huge dividends in this album. I dare you not to sing along with these bridges and choruses. Recommended tracks Any Means, Cross To Bear, Believe The Hype, With You In Spirit Bandcamp, Apple Music Pearl Jam, Dark Matter Speaking of great artists and interesting producers, Pearl Jam (arguably my favorite band) released Dark Matter in April 2024. Early stories of Eddie Vedder encouraging the band to work with his Earthlings side project mega-producer Andrew Watt riled up the fanbase, leading to lots of speculation based on Watt's recent rock work with Vedder, Post Malone, Ozzy Osbourne, Iggy Pop, and The Rolling Stones. What would he bring to the table? Well, Watt is a PJ superfan and indeed brought them back to form. I haven't been completely sold on a full album from them since Yield, but Dark Matter is the real deal. Rumors that this would be Ten or VS.-era PJ are a bit unfounded, but Watt smartly brought their early and latter-day work together, pushing them to write fast and write together for the first time in perhaps decades. The result is a top-to-bottom late-stage career highlight album, showcasing the best of what the band can still do in the right environment and conditions. The band sounds alive and energetic, and I've never heard drummer Matt Cameron sound as good with Pearl Jam as he did with Soundgarden until this album, where I'm finally glad someone unleashed him. Recommended tracks Scared of Fear, Wreckage, Dark Matter, Upper Hand, Waiting for Stevie, Setting Sun Apple Music Foxing, Foxing Foxing should be much, much bigger than they are. They originally began within that indie/emocore sound but broke free with one of the best albums I've ever heard, Nearer My God, which will go down as a desert island album. They followed up that ambition with more during the pandemic with Draw Down the Moon, but this eponymous album ratchets up the stakes and brings the noise. After the dramedy of DDTM, the original singles for this album, "Greyhound" and "Hell 99," gave us a real taste of the spectrum of the album, further expanding their sonics and sound. "Greyhound" sits nicely with anything on Nearer My God, but "Hell 99" is a leap forward in bridging their roots and the future. Every song on this album rewards the listener with varied dynamics that surprise at every turn. They self-produced this album, which further accentuates their desire to bring something always new to their sound. No song is clearly reminiscent of their older work except for "Greyhound," and yet they sound undeniably like Foxing. I wish all artists were able to challenge their existing sound with such great triumph. Recommended tracks Gratitude, Barking, Greyhound, Hall of Frozen Heads, Spit Bandcamp, Apple Music Fred again.., ten days Jen and I are unabashed fans of Fred Again.. Along with everyone else, we discovered him during the pandemic through his trilogy of albums that make up Actual Life 1, 2, and 3. We were such fans that we stood just outside the barriers for his show with Skrillex at Civic Center in San Francisco, just blocks from our home, and basked in the downtown rave that was all around us. Days before, I had snagged tickets to a three-night run at the Stanford Amphitheater for an almost intimate show in comparison. He released ten days just as fall began, and the anticipation was high. I wasn't sure what to expect given how cohesive and amazing the three Actual Life albums are, along with his piano renditions, collaboration album with Brian Eno, and collection of singles and songs called USB that he'd been playing live or dropping on SoundCloud. That sort of output has to deplete an artist, right? As we found out, only just a tiny bit. ten days is varied, and the collaborations and vocalists bring a much more delicate tone to the album. The absolute stunner is "backseat," featuring cut up, reversed, and sped-up vocals from Amber Bain of The Japanese House's track "Sunshine Baby," and a drum and vocal sample from Scott Hardkiss's God Within project from the track "Infinitely Gentle Blows." It's a top five song for me this year. Recommended tracks backseat, ten, places to be, just stand there, peace u need Bandcamp, Apple Music Site Nonsite, The Japan Series + Live at Delia’s Third Happening Site Nonsite is Simon Collison. Simon also happens to be a friend and design collaborator, and his musical and tangential design output as Site Nonsite is some of the best I've experienced. Part diary, part travelogue, part intimacy, part design project, all of it is channeled into the music and sounds that Collison weaves together here. While The Japan Series, his collected batch of EPs, tells a full story, it's his Live at Delia's Third Happening that expands and evolves what was originally created. Original in its own way, it's perhaps an even better curated expression of the music he's made prior. Pull on some headphones and go on a journey with Site Nonsite. Recommended tracks Angel Stain, Moss Garden, Sauce!, Hotel Sunroute Bandcamp, Apple Music The Cure, Songs Of A Lost World I hadn't expected a new The Cure album in 2024, but here we are. And wow, was it worth it. I wouldn't call myself a diehard fan, but there are many songs I love, and both the album and song Disintegration remain among my all-time favorites. The Cure in 2024 takes on a tonal and deeply atmospheric vibe that is unmistakably them, but it's longtime bassist Simon Gallup's basslines that always cut through, and here they're on full display with the treble amped up and distorted. Of course, Robert Smith is the center here. His restraint on vocals that still sound as if he were two decades younger, and his songwriting, are sublime. This is an album to truly give yourself into. Recommended tracks All I Ever Am, And Nothing Is Forever, Warsong, Endsong. Apple Music Drug Church, PRUDE Drug Church is proving to have longevity and a high rate of output with seemingly no end to their brand of post-hardcore punk. I continue to think of them as some Henry Rollins-era Black Flag (circa Damaged) funneled through a Weezer lens. Such acerbic vocals paired with some of the catchiest hooks deliver big time. Prude is their fifth album, landing in a trilogy of some of the densest and most cathartic albums during and coming out of the pandemic. Perhaps my favorite album cover this year. Recommended tracks Demolition Man, Chow, Myopic, Slide 2 Me, Business Ethics. Bandcamp, Apple Music Hot Water Music/Quicksand, Split EP A special shoutout to two bands that have had longevity and reunited: Hot Water Music has continued on with their brand of post-hardcore, while Walter Schreifels can't stop, and the reunion of Quicksand (hello again, Will Yip) after bassist Sergio Vega was ousted from Deftones is a lovely evolution of a band that's now showing a slightly softer, and perhaps age-appropriate, sound. This EP shows off their respective fires. Each band covers one of the other's songs and contributes new, unheard tracks. Hot Water Music covers the Quicksand classic "Fazer" faithfully while completely in tune with their sound. Quicksand's new contribution, "Supercollider," is a leftover from their post-reunion albums, but like many B-sides that have become classics, it should never have been left on the cutting room floor. Recommended tracks Fazer, Supercollider. Bandcamp, Apple Music Four Tet, Three Kieran Hebden (aka Four Tet) is always a consistent artist for me, but the last few albums since There Is Love In You haven't pulled me all the way through. "Lush" from 2017's New Energy showed what Hebden could do with commissioning a hang (or handpan) and centering a song around it. Three is the cohesive album I've been waiting for that pulls from all of Hebden's best work and delivers in spades. The album has an almost retro quality to it, with much warmth. It feels like a hug in the best way. "Loved" opened up the album to me, but "Skater" is what pulled me all the way in. Recommended tracks Skater, Loved, Three Drums, Mango Feedback Songs These were albums I enjoyed but in the spirit of albums being a hell yes, I found individual tracks that were real standouts. Shoreline, “Needles” and “Seoul” Every constructed enemy Is an outgrowth of white supremacy We’re being blessed with a covered face And the rope around our neck A punk-hardcore band from Germany also found their way into my ears, and Shoreline's third album is solid and refreshing. Two tracks really stand out though, "Needles" and "Seoul," and being fronted by a Korean vocalist, their on-the-nose lyrics about race and identity in the West resonated. Music seems to rarely take chances or be overt like this, and I welcome it. → Apple Music Jamie XX, “It’s So Good” Jamie XX's latest album has some filler for me, but "It's So Good" is as advertised. → Bandcamp J. Robbins, “Last War” A carnival For carnivores Those saboteurs No, you’re still fighting the last war You’ll die fighting the last war J. Robbins has been another artist and producer that will forever make me pay attention. Between the Jawbox reunion that I was fortunate to see a few years ago and his latest new solo album, his songwriting and sound couldn't be anyone else's. → Bandcamp Envy, “Beyond the Raindrops” Japanese post-hardcore legends Envy have seen their lineup shuffled around in recent years but have solidified under the leadership of vocalist Tetsuya Fukagawa, who returned after a brief two-year departure. "Eunoia" is their latest album but isn't a classic Envy album for me. Still, there are always a few gems, and this is one of them. → Bandcamp The Smile, “Instant Psalm” We don't get new Radiohead albums, but we get the wonderful output of The Smile. Their two new albums this year built on their debut. "Instant Psalm" is a soothing track that gets away from Radiohead comparisons and truly feels like The Smile. → Apple Music High Vis, “Mind’s a Lie” I loved High Vis's second album, 2022's Blending. "Trauma Bonds" was a true anthem, and I got to catch them at an intimate show here in San Francisco at Out of the Woods. Their follow-up album sees them wade further into indie territory. "Mind's A Lie" is a true standout, showcasing a '90s UK dance vibe and female vocal sample, which vocalist Graham Sayle slices through with his barking style. → Bandcamp Fontaines D.C., “Here’s The Thing” Everyone's all over "Favourite," but "Here's The Thing" has a vibe recalling the '80s pop songs coming out of the UK. → Bandcamp Eddie Vedder, “Save It For Later” This classic from The Beat was often played live by Pete Townshend, and Eddie Vedder has long admired The Who and Townshend, with "Baba O'Riley" a frequent setlist item during Pearl Jam sets. In addition, "Save It For Later" gets blended into the live version of "Better Man." So seeing this pop up on the second episode of season three of Chicago-centered "The Bear" was a real treat. The saxophone solo truly brings Vedder's rendition to life. → Apple Music Katie Gavin, “Sparrow” Apple Music played this on my Discover station, and it's a warm lullaby from MUNA singer Katie Gavin, who released a solo album this year on Phoebe Bridgers' label. It feels like a warm summer night filled with melancholy. → Bandcamp And So I Watch You From Afar, “Me and Dunbar” There's a thing that can happen with instrumental bands where their middle albums get a little too same-y. I had paused on And So I Watch You From Afar, but this year's Megafauna is a return to form. "Me and Dunbar" is an instant classic, and if you loved "7 Billion People All Alive At Once" from "Gangs," you'll love this one. → Bandcamp Let's see what 2025 brings for new music.'''
