["https://nazhamid.com/journal/less-precious"]
title = "Naz Hamid • Less Precious"
description = "The personal site of designer Naz Hamid."
full_description = "Social networking is about reach. It started small: your friends first, then grew outwards towards acquaintances and your professional life. It grew out to people who might follow you because of some shared interest, and then to complete strangers. Social media likes to tell you it’s about the content. People are “content creators” and not artists, filmmakers, comedians, or photographers. They may call themselves that, but if social media is their primary platform and the source of their audience, they too call it “creating content.” All in service of the algorithmic machine that needs to be constantly fed by humans until the machine itself feeds itself in an ouroboros of bullshit. Bots and AI all the way down. Some people believe that social media offers some semblance of permanence. They become attached to their body of work, their content. Their profile — their persona — becomes their identity, and the place where they can make or remake themselves. When the machine changes the rules, or the policy favors the platform provider’s business goals rather than your own, there is outrage. On the very platform itself, even. But you are a cog in the machine, under the guise of creating content, only to sell ads and reach in the Venn diagram of like-minded or interest-overlapping people. It’s not about your friends, your followers, or who you follow. It’s about who can see what, and what the people who make the platform deem to be the thing that makes them the most money. They reward and provide special access to those creators and influencers who are exemplary stars that everyone else should aspire to. The trap and the fallacy that people have fallen into is the idea that these platforms are the ONLY way to get further: to sell, to advertise, to be seen. You trade convenience and a “free” app for the ensnarement and caging of your creativity. Social networking and media should have always been temporal. These should be thoughts and creations you’re okay with letting go of into the wind. Social platforms are a distribution channel at best, and a mechanism to garner some notice. Some apps have leaned into this: messages that disappear or vanish, time-boxed content, and auto-deletion. Not everything is worthy of archival. In many instances, you’d even cringe at something you wrote ten, or even a year ago. If you care about your creativity, and what you make and bring into the world, I’d suggest having your own website. A place you can shape and change as often, or as little as you like. That is something worth being and feeling precious about."
