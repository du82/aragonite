["https://nazhamid.com/journal/goodbye-instagram"]
title = "Naz Hamid • Goodbye, Instagram"
description = """
Goodbye, Instagram
  Thanks for the memories, but good riddance."""
full_description = "I deleted Instagram two days ago. The reasons are as you would expect: doomscrolling, fatigue, vapidness, and of course, all of the horrifying[1] things Meta enables. Concerning Instagram itself, the list is long. The app started innocently enough: a place to visually share what you were doing right now. A successor to Flickr for the smartphone age, and combining the on-the-go status-style of Twitter, it launched in October 2010, and quickly became successful. I signed up for the service shortly after, on November 5, 2010, at 7:02pm.[2] It was a fun place, of course — the early days of social networks before we (as an industry) started calling them social graphs, and other terms that made these networks business-aligned. Sharing square 1:1 ratio photos immediately from your iPhone with Hipstamatic-like filters was a simple premise and took advantage of these new devices. It caught on amongst most I knew. You had Twitter and you had Instagram. Over the decades, and a big acquisition, the app started to head down the enshittification path. Competitors like Snapchat and VSCO[3] brought a bit of heat in various ways: Snapchat with its close-friends temporal content, VSCO with its more privacy-focused and artful social network, and then came TikTok. Instagram responded to any newcomers by simply ripping off their features wholesale. My own habits had naturally declined in recent years, and much like my abandonment of Twitter in 2015, Instagram existed on my device purely for direct messaging and keeping tabs on friends and family. My posting had gone down to almost nil, and I rarely interacted or cared about engagement anymore, even with a dedicated group of people who followed me (~3.4K, small by influencer standards, but sizable for someone who’s just doing my best to be myself). Inertia in a platform is borne out of convenience, and the FOMO of connections already made. As Mastodon and the indieweb has thankfully taken over my internet participation (this very website!), Nick Sherman summarized my own feelings on this, especially as someone who identifies with the DIY-skate-punk-musician-outsider ethos: It’s been a tough year so far but I really find joy in the community here on Mastodon and the larger Fediverse. There’s a satisfying DIY punk rock feeling to it all, as if I’m sticking it to dystopian billionaires every time I boost someone’s Mastodon post or fave someone’s Pixelfed image or try out some new Fedi app or follow some interesting stranger on some weird platform I’ve never heard of but can still interact with because it’s federated. It’s what the internet is supposed to feel like. — Nick Sherman I’m chasing a through line here with my last two posts and this one, and its been weighing on my mind amongst all of the modern horrors of our current world. It’s just one that I can control, and opt-out of.[4] It’s okay to like, or love something for a while in a mutually beneficial relationship, but when one side is only taking, it’s also freeing to let it go. Hey Instagram, see ya, wouldn’t wanna be ya. Content warning: This is just one example (please do your own research if you aren’t aware somehow) but Erin Kissane’s reporting here is astounding, heavy, damning, and dutiful work. ↩︎ I downloaded my archive and it’s surprisingly robust. It's also creepy at how much information is present on my habits and much more. ↩︎ Full disclosure: I worked at VSCO first as a contractor, then full-time from 2016-2018. ↩︎ If you stay, please consider not making them further money and using your data. ↩︎"
author = "Naz Hamid"
year_published = 2025
clearnet = "https://nazhamid.com/journal/goodbye-instagram"
