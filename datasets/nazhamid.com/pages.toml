["https://nazhamid.com/journal/let-this-be-a-moment"]
title = "Naz Hamid • Let This Be a Moment"
description = """
Let This Be a Moment
  Moments of otherness."""
full_description = "A moment when you discover that legacy media is not in your best interest, being fueled by advertising and bureaucratic bullshit. If you've worked anywhere, you should understand that no organization is immune to this. A moment when you might consider stepping out of your shoes and into someone else's—when a brown, black, or queer person has to endure difficult questions and situations that have never even occurred to you. A moment when you realize social media is also just media. They share the same goals and motivations: see this, read this, watch this, BUY THIS. We are being targeted so we will buy laundry pods. A moment when art matters more than ever. Capitalist media won by shifting the terms “creation,” “art,” “painting,” “photography,” “writing,” “music,” and more into the singular “content.” Artists are now just content creators chasing engagement, views, and memberships to gain sponsorships so you can buy some AG1. It's ads all the way down. A moment when we lost what membership means. What a club, guild, union, crew, league, or gang provides is solidarity and unity around a tight focus, with size not being the goal. Instead, everyone is now a member of a community that aims only to grow infinitely, not to sustain and nurture. Let this be the moment that opens you to owning your moments."
author = "Naz Hamid"
year_published = 2025
