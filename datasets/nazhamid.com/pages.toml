full_description = "About I'm Naz Hamid, a Malaysian-American design director and product designer. I grew up a third culture kid across London, Kuala Lumpur, and Chicago, before settling in San Francisco where I've lived for 16 years with my wife Jen Schuetz and our rescue Chihuahua, Barbara. Previously, I founded Weightshift and helped build the product design team at VSCO. The outdoors are a balm and a requirement for my well-being. I'm often outside running, overlanding, and rock climbing — movement is meditation. For more about why I write, see my interview on People & Blogs. If you’re curious about what I use, read my interview on Uses This. Published Select interviews, podcasts, print, &c. People & Blogs Naz Hamid A long running series by Manuel Moreale Uses This Naz Hamid A long running site by Waferbaby D806,740 Display screen with a transitional graphical user interface United States Patent Ep. 76: Craft is a Journey Presentable A podcast by Jeff Veen Ep. 12: Our Tools Give Us Superpowers Presentable A podcast by Jeff Veen How They Got There Interviews with digital designers about their careers A book by Khoi Vinh Discourse Naz Hamid interview A web series by Justin Kropp Workspiration Naz Hamid interview A website by Ilia Offscreen No. 5 Naz Hamid interview A magazine by Kai Brach The Great Discontent Jen Schuetz & Naz Hamid An interview series by The Great Discontent Design Is In The Details A List Apart A web content magazine headed by Jeffrey Zeldman Speaking Talks and workshops I’ve given. New Adventures Diverse Design: How We Build for People Jan 2019, Nottingham, United Kingdom CreativeWorks Talk: Hard Work & Hard Living Workshop: The Full-Stack Designer Oct 2017, Memphis, Tennessee, USA Brooklyn Beta 5 Hard Work & Hard Living Oct 2014, Brooklyn, New York, USA Designer Fund The Space Between the Notes Oct 2013, San Francisco, California, USA Asana & Designer Fund Skeuomorphism vs. Simplicity: A Town Hall Oct 2012, San Francisco, California, USA SXSW Interactive Design from the Gut: Dangerous or Differentiator Mar 2012, Austin, Texas, USA SXSW Interactive Built: Online Communities, Offline Relationships Mar 2011, Austin, Texas, USA AIGA Chicago Tools of the Trade: Creative Content for the Web Apr 2008, Chicago, Illinois, USA SXSW Interactive Design is in the Details Mar 2008, Austin, Texas, USA Making Media Connections Emerging Online News Outlets Jul 2006, Chicago, Illinois, USA UnderConsideration’s Speak Up SeriouSeries 3 Apr 2004, Chicago, Illinois, USA Colophon The site is handcoded by me in Nova, and built with Eleventy. The site is generated and served up by Netlify via a GitHub repo sync. Typography is primarily Tiempos for text and Söhne both by Klim Type Foundry. The photo of me on this page is taken by Jen Schuetz in the fall of 2023 at Great Sand Dunes National Park, in Colorado. Photographs are managed and edited in Adobe Lightroom for export. They are then optimized with ImageOptim, a tool I love dearly. Basic stats are collected, which you can see here, with GDPR and CCPA-compliant Umami — your privacy is respected (visitor data is anonymized), and no cookies are used. This version was launched in November 2023. Small updates are made often. A refresh happened in early February 2025. I acknowledge that I live on the unceded lands of the Muwekma, Ohlone, and Ramaytush indigenous peoples."
