["https://nazhamid.com/journal/bourdains-blessing"]
title = "Naz Hamid • Bourdain's Blessing"
description = """
Bourdain's Blessing
  Remembering the times I saw Anthony Bourdain and the lessons he left."""
full_description = "I’ll never forget the moment. I still walk past the jiujitsu gym, just a block over from our place and the moment comes rushing back. I was walking our dearly departed Boxer dog, Shaun. It was 2017. It was early. The Ralph Gracie Academy occupies a long stretch of Howard Street, with all-glass windows allowing you to see into the gym and when the sessions are going on. As I started to pass the Academy from east to west, I peeked in as I usually do and I did a double take. There, sitting half cross-legged and one knee up, was Anthony Bourdain, warming up on the mat. He looked at me, I looked at him. He knew I knew who he was, but I made no gesture. If I did, it was subtle, maybe a barely perceptible nod, but I respected his time and space, and kept moving. I knew he was in town filming an episode, and knew that he had gotten deeply involved in BJJ, leading to his lithe muscular physique and transformation during the run of Parts Unknown. The moment meant a lot to me, and it was the third time we had been in the same vicinity. The first was a decade plus earlier, Jen and I had seen him speak at the release of his book, The Nasty Bits, at the Borders on Michigan Avenue in Chicago. Anthony Bourdain speaking at Borders, May 30, 2006. Photo: Naz Hamid. The second was when we saw him here in San Francisco, during his Close to the Bone tour[1] in 2015. When I first read Kitchen Confidential, very early on, like many, the counter cultural vibe of the world of cooks was eye-opening and fascinating. I remember thinking that his writing reminded me in spirit of another favorite of mine, Henry Rollins, and in particular, Rollins’ Get In the Van, about his life joining and being in seminal punk band, Black Flag. Bourdain and Rollins share neither style nor tone in their writing. What they do share is a blunt, at times brutal, look at the worlds they occupied for many years. It was yeoman’s work, but they elevated it to art through sheer force of will and authenticity. I recently finished reading Tom Vitale’s In The Weeds: Around the World and Behind the Scenes with Anthony Bourdain. Tom was Bourdain’s long time director and producer, and would sometimes pop in front of the camera during the various permutations of his show. It’s a stunning, intimate, and similarly brutal recounting behind the scenes of the show, the crew, and Bourdain himself of course. Vitale’s up-close observations reveal that drive: Tony had an addictive personality and was without doubt a workaholic, choosing to travel over 250 days a year for as long as I’d known him. Whenever I used to suggest he take some time off, Tony would say, “Television is a cruel mistress. She does not let you cheat on her, even for a while.” Bourdain’s death struck me a year later. One of the few famous people I felt was a relative straight shooter, uncomfortable with his own fame, and conflicted. Vitale’s book confirms it, and reveals how complex the man could be. But it’s not just all Bourdain: Vitale takes the time to frame his own participation and evolution in the cult of Bourdain, and how it left the deepest of marks: Tony was complicated, hard to be around, and painful to be away from. Intellectually stimulating beyond compare, he was also frustrating, difficult, and even terrifying at times. But being pulled along in Tony’s supersonic wake meant everything in life was heightened. Even colors were brighter. As fall turned to winter, I’d continued far enough down the rabbit hole it was starting to feel like Tony was in the room with me. What Rollins and Bourdain affirm for me is that opening your mind, broadening your horizons, and seeing more of this world is essential to attempting to understand it: its people, its environment, and its future. Again from In The Weeds: “I used to have a pretty dim view of humanity,” Tony said. “But since I started traveling—particularly to places where I anticipated being treated badly—I am on balance pretty convinced that generally speaking the human race are doing the best they can to be as good as they can, under the circumstances, whatever they may be. I guess my hope is the more people see of the world, in person hopefully, or even on television, they see ordinary people doing ordinary things, so when news happens at least they have a better idea of who we’re talking about. Put a face to some empathy, to some kinship, to some understanding. This surely is a good thing. I hope it’s a useful thing.” I look back at my third-culture upbringing and consider it formative in how I see and understand the world. In Jen and my travels exploring the West, we continue to see more of that at the domestic level. Empathy is necessary to move forward, and I hope we can pause, take a breath, and find kindness. Close to the Bone Tour, July 26, 2015 at the Davies Symphony Hall. ↩︎"
author = "Naz Hamid"
year_published = 2025
clearnet = "https://nazhamid.com/journal/bourdains-blessing"
