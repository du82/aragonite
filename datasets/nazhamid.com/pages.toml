["https://nazhamid.com/journal/competency-vs-mastery"]
title = "Naz Hamid • Competency vs. Mastery"
description = """
Competency vs. Mastery
  What do you require of your users to use your product?"""
full_description = '''Another Zoom call ended. As is common, a few attendees would unmute themselves to speak temporarily. I noticed when people knew the unmute keyboard shortcut. Despite using the software for years now, it had eluded me (spacebar!). This was partly because I forgot to look it up after calls were over, and partly because it's not an action I do very often. I just click the audio button with my mouse when needed to toggle this. How barbaric! Perhaps I dislike this mode because it requires a temporal action: holding down the spacebar to unmute versus switching between modes with a little more... depth? Permanence? Commitment? It made me realize I only have some semblance of competency with so many available products. Very few require me to master them. For most, I learn just enough to enable me to achieve what I need. Beyond that, certain features remain tucked away unless they're something I do often or repetitively, thereby unlocking a 🤯 mode when I do discover them. Over the years, I've watched teams craft roadmaps, compile requirements, and establish metrics to further their products — each time prompting me to ask, "How many people need this?" A good feature or product should serve real needs or solve problems. And sometimes, its highest purpose is simply to delight. Yet I keep wondering, both in team discussions or in my own design work: Is this particular solution worth the investment? Users adopt a product for its advertised benefits. In the early stage, this makes up 90%–100% of the product. As the product stabilizes and grows, with pressure from investors and market forces, the percentage drops. The gap widens. Products then face a choice: refine their core offering through technological adaptation and user insight, or expand their feature set to attract a broader audience. How many users straddle the line between competency and mastery? And therefore, how much of your product should excel at a few crucial tasks versus performing adequately across many? Like many designers, I want my work to have meaningful impact. Yet when I examine my own behavior as a user, I find I only care about a few core features that make a product essential for its intended task[1]. To reiterate, many things drive product desicions—scale, ambition, growth, profit, and investor expectations. At its core, a product must execute so well that it becomes indispensable to its users. The fundamental question becomes: Do you create a product people love or one they merely tolerate? Do you build something users must choose to master, or one where everyone is the master? See Zoom. ↩︎'''
author = "Naz Hamid"
year_published = 2025
clearnet = "https://nazhamid.com/journal/competency-vs-mastery"
