title = "Naz Hamid • Tag, you’re it"
description = """
Tag, you’re it
  Answering the blog questions challenge."""
full_description = "Tagged by Scott and Luke and in thoughtful return, I’m answering the Blog Questions Challenge here. Some of these answers may overlap with the answers I gave Manu for his People & Blogs series, so I’ll do my best to do something a bit different. Please visit Manu’s P&B site though, and read through many of the excellent interviews there. Much credit to Bear Blog for these questions. Why did you start blogging in the first place? I noted how I appreciated the early bloggers, in particular from the Pyra Labs/Blogger crew, but to go back even further, I was fond of journaling early. Much of that was in the form of drawings as a child, then coupled with text. It wasn’t until I read about how musicians like Eddie Vedder of Pearl Jam would keep copious journals, and in particular, Henry Rollins’ Get In The Van, showed me that documenting your life was important as a record of a lived person. Rollins would later read from these journals early in his transition from full-time musician to spoken word artist, and the storytelling inspired me. Since I was online, and web design had captivated me, it all came together. What platform are you using to manage your blog and why did you choose it? I’m currently using the lovely static site generator, Eleventy (11ty). It pushes to a GitHub repository, which triggers a deploy to Netlify. After using so many different platforms over the decades, with my posts and data semi-locked in MySQL databases, the idea of a fast, file-first, SSG was the way I absolutely wanted to go when I started blogging at this domain. Steph Ango’s File Over App is a thoughtful read on data portability. Have you blogged on other platforms before? As mentioned just before this, yes. I started with Geocities, Livejournal, tried Greymatter, then Movable Type was the first to make it all click. I got really comfortable and pushed that system far — Gapers Block was the most involved version that I had done with multiple blogs running under one instance with different layouts and sections and includes all over the place. Dean Allen’s (RIP) Textpattern stole my heart away for many years after MT got acquired, and then I stopped blogging when Weightshift became my focus, and social media started to bloom. Weightshift used various kinds of CMS for clients: MT, TXP, ExpressionEngine, Craft, Wordpress, etc. I toyed with Tumblr, and other things, and eventually restarted with Jekyll, but quickly switched to 11ty. How do you write your posts? For example, in a local editing tool, or in a panel/dashboard that’s part of your blog? Most everything starts in Bear. I have a master note of ideas, that links out to other notes and I keep adding new ones, revisit others, and check off published ones. When do you feel most inspired to write? Whenever an idea strikes. This can happen at any time and drafts are started anywhere. I generally publish in the evening though. Do you publish immediately after writing, or do you let it simmer a bit as a draft? I used to be more immediate with my publishing decades ago, adhering to a near daily schedule. These days, some thought and care goes into each post, and if possible, I like to add a touch of flavor to a post, like the rotated album covers for the Music in 2024 post. What are you generally interested in writing about? How we as humans live in a world ever-changing because of technological influence and society’s adoption and adaptation to it. I love travel so posts about cultures and countries, as well as overlanding and camping domestically. And personal things that are more feeling the feels. Who are you writing for? Myself first, but through a lens of, “this information or thought could help someone else, and/or I’d love to share a different perspective that’s unique to me.” What’s your favorite post on your blog? 2023 in the Rearview is a big one, and I worked on that for a while. Taken for a Ride is a good one I think about taking a Waymo autonomous vehicle for the first time, but I like the sort of pieces that come from a more emotional and resilient place, like Let This Be a Moment, that allow me to work through things. Any future plans for your blog? Maybe a redesign, a move to another platform, or adding a new feature? I’m very content with 11ty. I’m constantly evolving and refactoring the design and code where I can see improvement. This is a lovely mode to be in: it’s iterative like software development than constantly new like marketing. As for features: a work section (underway), and better ways to showcase my photography, which is a longtime interest and activity for me. Tag ‘em. I’m going to tag Bix, Ethan, Gosha, Grant, Matt, Piper, Rachel, Simon, Susan, Thu, and Winnie."
