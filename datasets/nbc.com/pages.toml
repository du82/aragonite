["https://nbc.com/tickets/pages/tickets-and-nbc-studio-tour"]
title = "Tickets and Studio Tour - NBC.com"
description = "Get tickets to the NBC Studio Tour New York and your favorite shows like The Tonight Show Starring Jimmy Fallon, Saturday Night Live and more on NBC.com."
full_description = "Main ContentTickets and NBC Studio TourSEE FAVORITE NBC SHOWS LIVE!For Detailed Info, Check Out the Individual Shows Below: America's Got Talent American Ninja Warrior The Kelly Clarkson Show Late Night with Seth Meyers The Tour at NBC Studios - New York Saturday Night Live The Tonight Show Starring Jimmy Fallon The VoiceTickets are no longer available by mail for NBC shows taped in New York. All NBC ticket information (for NY) is detailed on our ticket line (212) 664-3056.America's Got TalentAmerica's Got Talent is back and tickets to be in the audience are FREE! Join host Terry Crews and judges Howie Mandel, Gabrielle Union, Julianne Hough and Simon Cowell as the country's best amateur performers compete. Get tickets for the Los Angeles shows now. CLICK HERE FOR AMERICA'S GOT TALENT TICKETS!Top of PageAmerican Ninja WarriorDon't miss your chance to see the excitement of American Ninja Warrior LIVE! CLICK HERE FOR TICKETS TO AMERICAN NINJA WARRIOR!Top of PageThe Kelly Clarkson ShowYou can reserve free tickets to see a taping of The Kelly Clarkson Show by going to: KellyClarksonShowTickets.com We release show dates and ticket requests as they become available. Please check 1iota to stay up to date on show and ticket availability. Requests cannot be submitted for dates that are not posted on the calendar. You must be at least eighteen (18) years of age at the time of taping to attend. No one under the age of 18 will be admitted into the show, regardless of whether a parent or guardian is present. Everyone in your confirmed party must present a valid photo I.D. containing date of birth upon arrival. You will need to sign up on 1iota to apply for tickets to The Kelly Clarkson Show. We recommend you do this in advance of the ticket release by clicking here: 1iota Member Sign-UpWhen you apply for tickets to The Kelly Clarkson Show, you will be automatically placed on a waiting list. At this point, you do not have a ticket. If we are able to fulfill your ticket request, you will be contacted through 1iota. If you are not notified by 1iota, we, unfortunately, were unable to fulfill your ticket request and you do not have tickets. All tickets are complimentary and may not be sold or auctioned. Beware of tickets offered for sale as they are invalid and will not be accepted. The Kelly Clarkson Show and NBCUniversal Media LLC reserve the right to REVOKE any ticket believed to have been purchased or sold. Any ticket may be REVOKED at any time at the discretion of show personnel. Standby Cards Standby cards are now available in the Shop at NBC Studios, located at 30 Rockefeller Plaza (via the 6th Avenue entrance between 49th & 50th St.) For more information regarding The Shop and its business hours, please visit The Shop at NBC Studios website.Top of PageLate Night with Seth MeyersYou can reserve free tickets to see a taping of Late Night with Seth Meyers by going to: 1iota.com.We release show dates and ticket requests as they become available. Please check 1iota to stay up to date on show and ticket availability. Requests cannot be submitted for dates that are not posted on the calendar.You must be at least sixteen (16) years of age at the time of taping to attend. No one under the age of 16 will be admitted into the show, regardless of whether a parent or guardian is present. Everyone in your confirmed party must present a valid photo I.D. containing date of birth upon arrival.You will need to sign up on 1iota to apply for tickets to Late Night with Seth Meyers. We recommend you do this in advance of the ticket release by clicking here: 1iota Member Sign-Up. When you apply for tickets to Late Night with Seth Meyers, you will be automatically placed on a waiting list. At this point, you do not have a ticket. If we are able to fulfill your ticket request, you will be contacted through 1iota. If you are not notified by 1iota, we, unfortunately, were unable to fulfill your ticket request and you do not have tickets.All tickets are complimentary and may not be sold or auctioned. Beware of tickets offered for sale as they are invalid and will not be accepted. Late Night with Seth Meyers and NBCUniversal Media LLC reserve the right to REVOKE any ticket believed to have been purchased or sold. Any ticket may be REVOKED at any time at the discretion of show personnel.Standby CardsAt 8am EST, standby cards will be available in the Shop at NBC Studios, located at 30 Rockefeller Plaza (via the 6th Avenue entrance between 49th & 50th St.), until 1:30pm EST.For more information regarding The Shop and its business hours, please visit The Shop at NBC Studios website.Space is limited! Anyone receiving a card must be 16 years of age or older (regardless of whether a parent or guardian is present). Standby cards are limited to one (1) per person and are issued on a first-come, first-served basis. Standby cards do not guarantee admission.Top of PageThe Tour at NBC Studios - New YorkThe Tour at NBC Studios takes you on an exciting journey through NBC Studios in Rockefeller Center where broadcast television was born, showcasing where some of today’s most popular shows are made, right in the heart of Manhattan. The Tour features behind-the scenes access to NBC’s most iconic television studios and video exhibits. The Tour showcases everything involved in television production and highlights the legacy of NBC in Rockefeller Center.Guests will have the opportunity to tour some of the studios where iconic shows like Saturday Night Live, The Tonight Show Starring Jimmy Fallon, and NBC News programs are produced and taped.The Tour at NBC Studios begins and ends at The Shop at NBC Studios, where you will find exclusive apparel and collectibles from your favorite NBC shows. The Shop is located on the lobby level of 30 Rock at Avenue of the Americas/ 6th Ave between 49th and 50th streets.To check availability and purchase a ticket, please go to www.thetouratnbcstudios.comTop of PageSaturday Night LiveThe Saturday Night Live ticket lottery for the 2025-2026 season will open at 12:00am EST on August 1, 2025 and run until 11:59pm EST on August 31, 2025. To enter the lottery, send an email to SNLTICKETS@NBCUNI.COM. You may only send one email per person. Submissions entered before or after the ticket lottery window will not be considered. Please include your first and last name and tell us why YOU would like to be a part of our studio audience! If you are selected, you will receive a set number of tickets for a random show date and time. Entering the lottery does not guarantee tickets, and you will only be notified in the event that you are chosen. You must be at least sixteen (16) years of age at the time of taping to attend. No one under the age of 16 will be admitted into the show, regardless of whether a parent or guardian is present. Everyone in your confirmed party must present a valid photo I.D. containing date of birth upon arrival.Saturday Night Live makes reasonable modifications of its policies, practices and procedures and provides reasonable accommodations. Guests are encouraged to request accommodations in advance to ensure that we have enough time to provide the necessary accommodations.All tickets are complimentary and may not be sold or auctioned. Beware of tickets offered for sale as they are invalid and will not be accepted. Saturday Night Live and NBCUniversal Media LLC reserve the right to REVOKE any ticket believed to have been purchased or sold. Any ticket may be REVOKED at any time at the discretion of show personnel. STANDBY CARDS WILL BE DISTRIBUTED AT 12:01AM THE SATURDAY OF A SHOW DAY Please read below for instructions on how to receive a standby card. BOOKING A STANDBY RESERVATION AT THE BELOW LINK IS THE ONLY WAY TO RECEIVE A STANDBY RESERVATION TO BOOK A STANDBY RESERVATION PLEASE FOLLOW THIS LINK: SNL STANDBY RESERVATION THIS LINK WILL OPEN AT 10AM ON THE THURSDAY BEFORE A SHOW. 1. Book a standby reservation by going to the link provided ABOVE. You may choose to book a reservation for either the 8pm dress rehearsal or the 11:30pm live broadcast. You will be asked for your first and last name, and your email address. After registering, you will receive a confirmation that you are now part of our queue.2. You will receive an email with your reservation number. Due to the number of requests, it may take several hours for your reservation number to arrive by email. A reservation number will be sent by email until we reach capacity per event. Reservation numbers will be issued in the order received.Please note duplicate submissions for the same date are not permitted. If you request a SNL standby reservation more than once, only your most recent (latest) submission will be considered and that submission will determine your reservation number.3. If you received a reply to your request with a reservation number, check-in at the in-person standby line at the 49th Street NBC Studios Marquee between 6pm and 7pm on the Friday before a show day. The exact location is 49 W. 49th Street between Fifth and Sixth Avenues. Everyone MUST be present with a photo ID (as specified below) at check-in. Anyone not present at check-in will forfeit their place in line. Reservations are non-transferable.4. You will be assisted to line up in numerical order based on your standby reservation.5. Standby cards will be handed out at approximately 12:01am on Saturday morning of a show day. Photo ID will be required again at this point. Standby cards are limited to one per person. Standby cards will not be distributed at any time other than 12:01am.We want to make sure the standby process is fair for everyone, so all standby line members must always remain in line after checking in Friday night. If you do not wait in line, you will not be admitted to the show. No “line-sitters” please.The use of: Alcohol Lounge chairs (regular chairs are permitted) Mattresses Sleeping bags Tents…will NOT be permitted in the standby line at any time.Of course, you are free to take minimal, necessary breaks (i.e., going to the bathroom) from the line. Please note that all standby reservations and cards are non-transferable and non-exchangeable. NBC staff reserve the right to revoke the cards of, or not issue any cards to, anyone in line for any reason, including if proper procedures are not followed.Remember, a standby card does not guarantee admission.Top of PageThe Tonight Show Starring Jimmy FallonYou can reserve free tickets to see a taping of The Tonight Show Starring Jimmy Fallon by going to: tonightshowtix.com. All available dates will be listed on the calendar.We release show dates and ticket requests as they become available. Please check back on 1iota to stay up to date on show and ticket availability. Requests cannot be submitted for dates that are not posted on the calendar. Please consult The Tonight Show's official ticketing Twitter account @FallonTix and this ticketing page to stay up-to-date on ticket release date info.You must be at least sixteen (16) years of age at the time of taping to attend. No one under the age of 16 will be admitted into the show, regardless of whether a parent or guardian is present. Everyone in your confirmed party must present a valid photo I.D. containing date of birth upon arrival.You will need to sign up on 1iota to apply for tickets to The Tonight Show Starring Jimmy Fallon. We recommend you do this in advance of the ticket release by clicking here: Tonight Show Member Sign-Up. When you apply for tickets to The Tonight Show Starring Jimmy Fallon, you will be automatically placed on a waiting list. At this point, you do not have a ticket. If we are able to fulfill your ticket request, you will be contacted through 1iota. If you are not notified by 1iota, we, unfortunately, were unable to fulfill your ticket request and you do not have tickets.All tickets are complimentary and may not be sold or auctioned. Beware of tickets offered for sale as they are invalid and will not be accepted. The Tonight Show Starring Jimmy Fallon and NBCUniversal Media LLC reserve the right to REVOKE any ticket believed to have been purchased or sold. Any ticket may be REVOKED at any time at the discretion of show personnel.Standby CardsStandby cards are now available in the Shop at NBC Studios, located at 30 Rockefeller Plaza (via the 6th Avenue entrance between 49th & 50th St.). Standby cards will be distributed from 8am – 3pm EST the morning of a show.Space is limited! Anyone receiving a card must be 16 years or older (regardless of whether a parent or guardian is present). Standby cards are limited to one per person and are issued on a first-come, first-served basis. Standby cards do not guarantee admission.Top of PageThe VoiceDon't miss your chance to see The Voice LIVE! Sign up for your free tickets, CLICK HERE FOR TICKETS TO THE VOICE.Top of Page #InlineCss-2150 .ScalableSalesPage .content { background-color: #ffffff; background-image: none; background-repeat: null; background-size: 100%; } @media (max-width: 481px) { #InlineCss-2150 figure.video-module-container { box-shadow: #ffffff inset 0 -1px 0 0; } } @media (max-width: 922px) { #InlineCss-2150 .ScalableSalesPage .content { background-image: none; background-repeat: null; background-size: 100%; } } NBC.comNBC Quick LinksAdvertiseLink TV ProviderFAQCastingContact UsLocal ScheduleTickets and NBC Studio TourCorporate InfoAccessibilityJobsAd ChoicesPrivacy PolicyYour Privacy ChoicesCA NoticeTerms of Service - NEWNBC AppPeacockAdvertiseClosed CaptioningParental Guidelines and TV RatingsVideo Viewing PolicyViewer PanelShopA Division of NBCUniversal©2025 NBCUniversal Media, LLC"
