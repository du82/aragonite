title = "Parental Guidelines & TV Ratings | Atlas CMS"
full_description = "Main ContentParental Guidelines & TV RatingsLEARN MORE ABOUT THE TV RATING FOR EVERY NBCU SHOW.inside a {color: #00b2eb;}TV ratings, much like feature film ratings, were created to give viewers guidelines to a television series' target audience and its potential content so that viewers can make informed choices on what they and their families watch. A rating may also be accompanied by a content label that further defines content within the program. Definitions for both the ratings and the labels are below.Here is what each rating representsTV-YAll ChildrenThis program is designed to be appropriate for all children.TV-Y7Older ChildrenThis program is designed for children age 7 and above.TV-Y7-FVOlder ChildrenThis program is designed for children age 7 and above and includes strong fantasy violence.TV-GGeneral AudienceMost parents would find this program suitable for all ages.TV-PGParental Guidance SuggestedThis program contains material that parents may find unsuitable for younger children.TV-14Parents Strongly CautionedThis program contains some material that many parents would find unsuitable for children less than 14 years of age.TV-MAMature Audience OnlyThis program is specifically designed to be viewed by adults and therefore may be unsuitable for children under 17.Here is how the labels are defined:V: ViolenceS: Sexual situationsL: Coarse languageD: Suggestive dialogueFV: Fantasy violence Got additional questions? Want to learn more about parental controls on your television? Visit The TV Boss site or the FCC Parents Place site for more information.URLS:http://www.thetvboss.org/http://reboot.fcc.gov/parents/ #InlineCss-3799 .ScalableSalesPage .content { background-color: #null; background-image: none; background-repeat: null; background-size: 100%; } @media (max-width: 481px) { #InlineCss-3799 figure.video-module-container { box-shadow: #null inset 0 -1px 0 0; } } @media (max-width: 922px) { #InlineCss-3799 .ScalableSalesPage .content { back