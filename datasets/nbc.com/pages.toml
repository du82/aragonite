title = "Now Casting - Annie LIVE and More - NBC.com"
description = "NBC's casting ANNIE LIVE now. Find NBC casting information and how to audition for your favorite NBC reality series, elimination contests and game shows."
full_description = '''Main ContentNow Casting for NBC ShowsWant to be a participant on an NBC show? Learn more!America's Got TalentThe VoiceWeakest LinkAMERICA'S GOT TALENTGot talent? We want to see it! NBC's top-rated summer series - and the only talent competition show open to any age and any talent - "America's Got Talent" is searching nationwide for the next season's contestants. The auditions are a once-in-a-lifetime opportunity for performers across the country to showcase their talent to the series' producers in hopes of being able to take the stage in front of the AGT judges.To audition in person or submit an audition video, visit our official casting site.Top of PageTHE VOICENBC’s The Voice is the unparalleled, Emmy Award-winning series that has captivated audiences worldwide with its unique format and exceptional talent.The Voice showcases the best artists from around the country and provides them with a once-in-a-lifetime opportunity: A chance to be mentored by four of the biggest names in the music industry.The Voice casting team is always on the search to find exceptional artists from around the country and their search continues year-round. We're looking for solo, duos and trios of all music genres, from pop and rock to R&B, alternative, Latin, country, blues and indie. We want to hear your voice and get to know your story. Don't miss this opportunity to showcase your talent and prove to us that YOU are The Voice.Submit your video audition and stay tuned for our Virtual Open Call Auditions. Go to the office casting site at NBCTheVoice.comTo audition you must be a legal resident of the United States, be 13 years of age or older and meet all other Eligibility Requirements.Top of PageWEAKEST LINK"Weakest Link" is now casting!! Your favorite game show with Emmy winner Jane Lynch is casting new episodes! Are you a trivia wiz? Are you fun and outgoing? Think you can outwit and outlast the competition? Come apply and play for the chance to win up to $1 Million!For your chance to participate, click HERE to apply now!!Top of Page #InlineCss-3522 .ScalableSalesPage .content { background-color: #null; background-image: none; background-repeat: null; background-size: 100%; } @media (max-width: 481px) { #InlineCss-3522 figure.video-module-container { box-shadow: #null inset 0 -1px 0 0; } } @media (max-width: 922px) { #InlineCss-3522 .ScalableSalesPage .content { background-image: none; background-repeat: null; background-size: 100%; } } NBC.comNBC Quick LinksAdvertiseLink TV ProviderFAQCastingContact UsLocal ScheduleTickets and NBC Studio TourCorporate InfoAccessibilityJobsAd ChoicesPrivacy PolicyYour Privacy ChoicesCA NoticeTerms of Service - NEWNBC AppPeacockAdvertiseClosed CaptioningParental Guidelines and TV RatingsVideo Viewing PolicyViewer PanelShopA Division of NBCUniversal©2025 NBCUniversal Media, LLC'''
