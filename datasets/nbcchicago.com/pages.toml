description = "Two of the world’s best rugby teams will host a massive rematch at Chicago’s Soldier Field, as Ireland and New Zealand will square off this fall."
full_description = '''Soldier Field Ireland vs. New Zealand rugby match coming to Chicago this fall Ireland's win over New Zealand in 2016 at Chicago's Soldier Field marked the first time they'd ever beaten the All-Blacks By NBC Chicago Staff • Published February 18, 2025 • Updated on February 18, 2025 at 1:50 pm BOOKMARKER Two of the world’s best rugby teams will host a massive rematch at Chicago’s Soldier Field, as Ireland and New Zealand will square off this fall. According to the Chicago Sports Commission, the match will take place on Saturday, Nov. 1, and will be a rematch of a 2016 clash that saw the Irish squad beat the All-Blacks for the first time in their 111-year history. 📺 24/7 Chicago news stream: Watch NBC 5 free wherever you are “Chicago is a world-class sports city, and we’re thrilled to welcome Ireland and the All Blacks back to Soldier Field,” Mayor Brandon Johnson said in a statement. Tickets will officially go on sale Friday at 10 a.m., with a pre-sale for tickets on Thursday morning, according to officials. More information can be found via this website. Prior to the 2016 showdown, Ireland had never beaten New Zealand in a rugby match, but following that contest the two teams have been much more evenly split, each winning five games apiece, according to the Irish Rugby federation. The contest is being held as the United States prepares to host the 2031 Men’s Rugby World Cup and the 2033 Women’s Rugby World Cup. “The continued growth of rugby in the United States is extremely exciting, and the IRFU is proud to be part of this journey as we prepare for the Rugby World Cups in 2031 and 2033,” Kevin Potts, the CEO of Ireland’s rugby organization, said in a statement. Local Cicero 4 hours ago Authorities identify person responsible for Cicero apartment building explosion Real ID 5 hours ago Here's who needs a Real ID – and who doesn't – as deadline approaches The 2023 men’s World Cup was won by South Africa, who successfully defended their titles with a championship match victory over New Zealand. The Women’s Rugby World Cup will take place later this year in England, with Ireland and New Zealand both among the 16 teams participating in that event. Feeling out of the loop? We'll catch you up on the Chicago news you need to know. Sign up for the weekly Chicago Catch-Up newsletter. This article tagged under: Soldier Field if (typeof adInstance === 'undefined') { adInstance = new AdLayersAPI(); } adInstance.lazyLoadAd({ slotName: 'mobilemultibox_belowarticle', format: 'mobilemultibox', targeting: {"slot":"mobilemultibox","pos":"mobilemultibox"} }); const taboolaLiveBlog = window.nbc.isLiveBlog; if (document.cookie.indexOf("scroll0=") < 0) { window._taboola = window._taboola || []; if (! taboolaLiveBlog) { _taboola.push({ article: 'auto', url: '' }); } _taboola.push({ mode: 'thumbnails-a', container: taboolaLiveBlog ? 'taboola-below-live-blog-thumbnails' : 'taboola-below-article-thumbnails', placement: decodeURIComponent( 'Below%20Article%20Thumbnails' ), target_type: 'mix' }); _taboola.push({ flush: true }); }; var isMobile = window.matchMedia('screen and (max-width: 767px)').matches; /** scroll cookie for scroll.com **/ if (document.cookie.indexOf("scroll0=") < 0 && isMobile) { window._taboola = window._taboola || []; _taboola.push({ mode: 'thumbs-feed-03-mobile', container: taboolaLiveBlog ? 'taboola-below-live-blog-thumbnails' : 'mobile-native-below-article', placement: taboolaLiveBlog ? 'App Below Live Blog Thumbnails - Fallback' : 'Below Article Thumbnails - Fallback', target_type: 'text' }); }; on now 11:30PM: NBC 5 Late News Trending Stories Real ID 12 Illinois DMVs will offer only Real ID services on Saturdays. List of locations Ukraine Zelenskyy seeks support at emergency European summit after bruising Trump encounter Trump Administration Trump signs order designating English as the official language of the US Cicero Authorities identify person responsible for Cicero apartment building explosion Real ID H