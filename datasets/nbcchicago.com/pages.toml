["https://www.nbcchicago.com/chicago-sports-bears-sox-cubs-bulls-blackhawks/united-center-transformation-project-approved-chicago-city-council/3678339"]
title = "Massive United Center project OK’ed by Chicago City Council – NBC Chicago"
description = "The owners of the NBA’s Chicago Bulls and NHL’s Blackhawks got the go-ahead to transform the area surrounding the United Center on Wednesday when the Chicago City Council approved a $7 billion plan to replace the parking lots with green space, mixed-income housing, a music hall and more. The 1901 Project, touted as the largest private investment in Chicago’s West Side, is being spearheaded by the Reinsdorf and Wirtz families, who own the arena. It is to be built in phases on more than 55 acres of privately owned land over about a decade-long period."
full_description = '''United Center Project to transform area around United Center given green light by City Council The approval was a key hurdle for the massive project, which could get underway in coming months Published February 20, 2025 • Updated on February 19, 2025 at 4:31 pm BOOKMARKER RIOS, Field Operations, Site Design Group Ltd. The owners of the NBA’s Chicago Bulls and NHL’s Blackhawks got the go-ahead to transform the area surrounding the United Center on Wednesday when the Chicago City Council approved a $7 billion plan to replace the parking lots with green space, mixed-income housing, a music hall and more. The 1901 Project, touted as the largest private investment in Chicago’s West Side, is being spearheaded by the Reinsdorf and Wirtz families, who own the arena. It is to be built in phases on more than 55 acres of privately owned land over about a decade-long period. 📺 24/7 Chicago news stream: Watch NBC 5 free wherever you are “Today is a historic moment for the West Side,” Bulls CEO Michael Reinsdorf said in a statement. "This project is more than just development. It’s a bold and unprecedented commitment to the future of our community. We are excited for the opportunity to reimagine what the future can look like. Our team is eager to get to work and turn this vision into reality.” The first phase calls for a 6,000-seat theater, multilevel parking facilities with rooftop greenspace, more pedestrian-friendly sidewalks and bike lanes, and hotel and retail space. Plans for future phases include housing and transportation enhancements. “We set out to do something with no existing blueprint,” Blackhawks chairman Danny Wirtz said. "Our commitment is to create spaces that empower all generations, fostering a thriving community that enhances the cultural and economic fabric of the West Side.” The approval for this project comes at a time when the NFL's Chicago Bears and MLB's Chicago White Sox — also owned by the Reinsdorfs — are looking to build new stadiums with public funding. The Bears are trying to build an enclosed stadium next to Soldier Field as part of a reimagined museum campus. They also own a 326-acre tract of land in suburban Arlington Heights that could also be the site of a future home, and have looked at the old Michael Reese Hospital site on the near South Side. Sports Donald Trump 3 hours ago Trump says in social media post he plans to pardon the late Pete Rose NBA Feb 28 Joel Embiid ruled out for rest of 2024-25 season, will focus on treatment and rehab The White Sox are looking to move out of Guaranteed Rate Field on the South Side and construct a new stadium as part of a ballpark village in the city’s South Loop with green spaces, residences and businesses. ___ Feeling out of the loop? We'll catch you up on the Chicago news you need to know. Sign up for the weekly Chicago Catch-Up newsletter. AP sports: https://apnews.com/sports Copyright The Associated Press This article tagged under: United Center if (typeof adInstance === 'undefined') { adInstance = new AdLayersAPI(); } adInstance.lazyLoadAd({ slotName: 'mobilemultibox_belowarticle', format: 'mobilemultibox', targeting: {"slot":"mobilemultibox","pos":"mobilemultibox"} }); const taboolaLiveBlog = window.nbc.isLiveBlog; if (document.cookie.indexOf("scroll0=") < 0) { window._taboola = window._taboola || []; if (! taboolaLiveBlog) { _taboola.push({ article: 'auto', url: '' }); } _taboola.push({ mode: 'thumbnails-a', container: taboolaLiveBlog ? 'taboola-below-live-blog-thumbnails' : 'taboola-below-article-thumbnails', placement: decodeURIComponent( 'Below%20Article%20Thumbnails' ), target_type: 'mix' }); _taboola.push({ flush: true }); }; var isMobile = window.matchMedia('screen and (max-width: 767px)').matches; /** scroll cookie for scroll.com **/ if (document.cookie.indexOf("scroll0=") < 0 && isMobile) { window._taboola = window._taboola || []; _taboola.push({ mode: 'thumbs-feed-03-mobile', container: taboolaLiveBlog ? 'taboola-below-live-blog