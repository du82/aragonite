title = "‘SNL’ cold open pokes fun at Zelenskyy Oval Office visit – NBC Chicago"
description = "Ukraine President Volodymyr Zelenskyy’s fiery and confrontational White House visit on Friday was the subject of the cold open for the latest episode of “Saturday Night Live,” and the sketch even featured show alum and “Austin Powers” star Mike Myers as billionaire Elon Musk."
full_description = '''Saturday Night Live Zelenskyy's fiery White House visit gets ‘SNL' cold open treatment The sketch featured comedian Mike Myers as billionaire Elon Musk. By NBC Staff • Published 15 mins ago • Updated 10 mins ago BOOKMARKER NBC Ukraine President Volodymyr Zelenskyy's fiery and confrontational White House visit on Friday was the subject of the cold open for the latest episode of "Saturday Night Live," and the sketch even featured show alum and "Austin Powers" star Mike Myers as billionaire Elon Musk. With cast member Mikey Day as Zelenskyy, James Austin Johnson as Trump, Bowen Yang as Vance and Marcello Hernandez as Secretary of State Marco Rubio, the sketch poked fun at the real-life Trump and Zelenskyy arguing in the Oval Office about whether the war, which began three years ago when Russia invaded Ukraine, was like a card game. 📺 24/7 Chicago news stream: Watch NBC 5 free wherever you are "You say you want to end this war, but frankly, you don't have the cards," Johnson as Trump said. "I have the cards, okay. I have skip, draw four. I have reverse. I have get out of jail free, the Supreme Court gave me that one." Day as Zelenskyy then suggested the American leaders visit Ukraine, to which Yang as Vance responded, "Hey! Don't you even dare. I have been to Ukraine... on Google Maps." The joke alluded to the fact that Vance said he had not been to Ukraine but had "watched and seen the stories" from the country's war efforts during the real-life exchange that shocked many of America's long-standing allies. Johnson as Trump then criticized Zelenskyy for not wearing a suit, saying, "It's disrespectful. Who shows up to the White House in a t-shirt and jeans like a garbage person." That is when Myers as Musk, wearing his signature "Tech Support" t-shirt and black overcoat comes into the sketch, along with a chainsaw, which the real-life Musk wielded at CPAC as a way to symbolize his slashing of the government. Entertainment News Celebrity News 9 hours ago Grammy-nominated R&B singer Angie Stone dies in car crash Oscars 13 hours ago Oscars 2025 what to know: How to watch, who is hosting, predictions and more "Donald, what are you doing in my office?" Myers as Musk asked Johnson as Trump. "You know I'm the president now, right?" See the full cold open here: Feeling out of the loop? We'll catch you up on the Chicago news you need to know. Sign up for the weekly Chicago Catch-Up newsletter. The guest host for this week's episode was comedian Shane Gillis, along with musical guest Tate McRae. The episode was the first since the "SNL 50: The Anniversary Celebration," which was a more than three hour special reunion of the long-running show's cast and iconic guest hosts. Next, Lady Gaga will serve as the guest hose and musical guest for the March 8 episode. This article tagged under: Saturday Night Live if (typeof adInstance === 'undefined') { adInstance = new AdLayersAPI(); } adInstance.lazyLoadAd({ slotName: 'mobilemultibox_belowarticle', format: 'mobilemultibox', targeting: {"slot":"mobilemultibox","pos":"mobilemultibox"} }); const taboolaLiveBlog = window.nbc.isLiveBlog; if (document.cookie.indexOf("scroll0=") < 0) { window._taboola = window._taboola || []; if (! taboolaLiveBlog) { _taboola.push({ article: 'auto', url: '' }); } _taboola.push({ mode: 'thumbnails-a', container: taboolaLiveBlog ? 'taboola-below-live-blog-thumbnails' : 'taboola-below-article-thumbnails', placement: decodeURIComponent( 'Below%20Article%20Thumbnails' ), target_type: 'mix' }); _taboola.push({ flush: true }); }; on now 12AM: NBC 5 Late News Trending Stories Real ID 12 Illinois DMVs will offer only Real ID services on Saturdays. List of locations Ukraine Zelenskyy seeks support at emergency European summit after bruising Trump encounter Trump Administration Trump signs order designating English as the official language of the US Real ID Here's who needs a Real ID – and who doesn't – as deadline approaches McDonald's McDonald's celebrating 5