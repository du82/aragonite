title = "Michelin-star chef says this is the No. 1 thing home cooks waste money on: ‘It’s a vanity in the kitchen’ – NBC New York"
description = "Chef Gabriel Kreuther says one of the biggest mistakes he sees home cooks making is outfitting their kitchen as if they were running a restaurant."
full_description = '''Money Report In partnership with news Michelin-star chef says this is the No. 1 thing home cooks waste money on: ‘It's a vanity in the kitchen' By Nicolas Vega, CNBC • Published March 1, 2025 • Updated on March 1, 2025 at 3:49 pm BOOKMARKER Getty Images Buying the same equipment as a Michelin-star chef probably won't help you cook like one. That's according to chef Gabriel Kreuther, whose eponymous two-star restaurant is one of the best dining experiences New York City has to offer. Speaking with CNBC Make It while promoting his new partnership with stainless steel cookware brand Cristel, Kreuther says one of the biggest mistakes he sees home cooks making is outfitting their kitchen as if they were running a restaurant. Watch NBC 4 free wherever you are WATCH HERE While it may be tempting to purchase similar pieces of equipment found in professional kitchens, Kreuther says that these specialized machines often don't fit a home cook's needs. Indeed, if you aren't making restaurant-sized portions, the machines might be more hassle than help. "If the production is not big enough, you'll find yourself cleaning for hours because you didn't have enough product and everything is just hanging on the sides of that food processor or machine," he says. "Because the recipe isn't big enough unless you cook for six or eight people." Get Tri-state area news delivered to your inbox with NBC New York's News Headlines newsletter. SIGN UP Time and time again, Kreuther sees home cooks shelling out hundreds of dollars for high-end kitchen tools that far exceed their needs. Neilson Barnard | Getty Images Entertainment | Getty ImagesChef Gabriel Kreuther's New York City restaurant has two Michelin stars. "What I see a lot when I cook things for people in private kitchens is you can find all kinds of food processors and machines, and a lot of them are barely used or not used at all," he says. "They become pieces of furniture." Money Report Cybersecurity 8 hours ago Reported global Microsoft outage leaves tens of thousands unable to access email and other apps news 11 hours ago Trump objected to Zelenskyy's tone and body language in Oval Office clash, White House says "Those machine are really sometimes just a vanity in the kitchen," he adds. If you're looking to upgrade your kitchen, he recommends starting with a good, wooden cutting board and some quality knives. Instead of looking for a pricey knife block that comes with a half dozen blades, he suggests investing in "one or two very good knives." "I will tell you from experience, after so many years in the kitchen, people tend to work 80% of the time with the same knife," he says. Go for a medium-sized knife and a smaller knife. If you really want to splurge, he says, buy yourself a steel to keep your blades sharp. "At the beginning of your career when you're a cook, your tendency is to have many knives because you think that more knives is better," he says. "And as you go into your career you see, like many times in life, that less is more." Want to earn some extra money on the side? Take CNBC's new online course How to Start a Side Hustle to learn tips to get started and strategies for success from top side hustle experts. Sign up today and use coupon code EARLYBIRD for an introductory discount of 30% off $97 (+taxes and fees) through April 1, 2025. Plus, sign up for CNBC Make It's newsletter to get tips and tricks for success at work, with money and in life. Also on CNBC Harvard law grad started soap business with $300 mixer—now it brings in millions Why Costco sells gold bars, diamonds: 'Affluent people love a good deal' M&M's will let you sleep in its Times Square store—take a look inside Subscribe to the CNBC YouTube Channel Morning Squawk Newsletter Copyright CNBC This article tagged under: news if (typeof adInstance === 'undefined') { adInstance = new AdLayersAPI(); } adInstance.lazyLoadAd({ slotName: 'mobilemultibox_belowarticle', format: 'mobilemultibox', targeting: 