full_description = '''Money Report In partnership with Cybersecurity Reported global Microsoft outage leaves tens of thousands unable to access email and other apps By Pia Singh, CNBC and Tanaya Macheel, CNBC • Published March 1, 2025 • Updated 5 hours ago BOOKMARKER Jeenah Moon | Bloomberg | Getty Images Tens of thousands of users were unable to access various Microsoft programs on Saturday afternoon. "We're investigating an issue in which users may be unable to access Outlook features and services," Microsoft 365 Status, the official Microsoft account for 365 service incidents, said in a post on X. "Additional details can be found under MO1020913 in the admin center." The number of reports that services such as Microsoft Outlook, Microsoft Exchange, Microsoft Teams, Microsoft 365 and Microsoft Azure were down spiked after 3:30 p.m. ET. More than 37,000 individuals reported an Outlook outage and roughly 24,000 reported an outage in the tech company's 365 service, according to Downdetector, while roughly 150 users reported their Teams accounts were down. Watch NBC 4 free wherever you are WATCH HERE The outages were most highly concentrated in the New York, Chicago and Los Angeles areas, per the Downdetector reports. Users also flooded social media site X complaining about their inability to access their Outlook emails, prompting concerns of a global Microsoft outage. Get Tri-state area news delivered to your inbox with NBC New York's News Headlines newsletter. SIGN UP Microsoft has not reported any issues on its service health update page, and the company has not responded to a request for comment. This story is developing. Please check back for updates. Also on CNBC Amazon eyes global expansion for its Temu, Shein competitor Intel delays Ohio chip plant opening to next decade, was to start production by 2026 Block's 28% plunge in February leads fintech sell-off, while Stripe valuation jumps Subscribe to the CNBC YouTube Channel Morning Squawk Newsletter Copyright C