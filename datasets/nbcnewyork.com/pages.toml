title = "Long Island news: Dozens of dead birds found on East Patchogue beach – NBC New York"
description = "A Long Island beachside community is worried about dozens of dead birds that have washed up on the shore and been found in backyards."
full_description = '''Animals Dozens of dead birds found on Long Island beach believed to have died from avian flu Residents of Patchogue Shores are staying away from the beach for now, hoping the issue will be resolved as the weather gets warmer. By Pei-Sze Cheng • Published February 27, 2025 • Updated on February 28, 2025 at 7:28 am BOOKMARKER NBC Universal, Inc. A Long Island beachside community in New York's Suffolk County is worried about dozens of dead birds that have washed up on the shore and been found in backyards, especially because officials believe the birds died from avian flu. Patchogue Shores in East Patchogue has a private community beach. Earlier this week, Tim Jones, the vice president of their association, was walking along the beach with his family when he noticed many dead birds. “I saw three seagulls, a cormorant, and I got a count of 11 ducks,” explained Jones. Watch NBC 4 free wherever you are WATCH HERE New Jersey Feb 26 Dead geese in 2 NJ counties test positive for bird flu, officials say Health Feb 22 Why isn't the U.S. using a bird flu vaccine in poultry? Trump Administration Feb 26 Egg prices could jump 41% this year, USDA says, as Trump's bird flu plan is unveiled NBC New York walked with him and saw a dead gull, a dead goose bobbing in the water and various other smaller birds strewn along the small stretch of sand. Get Tri-state area news delivered to your inbox with NBC New York's News Headlines newsletter. SIGN UP Jones contacted the Department of Environmental Conservation. The DEC said it appeared to be avian flu because there have been cases in Suffolk County and Nassau County before. Officials from the department urged the community to close the beach to avoid any contact with the dead birds. While bird-to-human transmission has been extremely low, the avian flu can be spread by direct contact through saliva, secretions and feces. It can also be spread through viral particles in the air and consumption of raw food and milk. Earlier this month, bird flu was detected at Crescent Duck Farm in Aquebogue. The farms owner forced to euthanize nearly a 100,000 ducks. Residents of Patchogue Shores are staying away from the beach for now, hoping the issue will be resolved as the weather gets warmer. "It’s very frightening, obviously, and I’m not quite sure what we can do about it at this point, other than to stay away,” said resident Janet Bondy, “But that becomes very difficult if you live down here." “It’s upsetting because people enjoy this. This is the one place where everybody who lives here enjoys, it’s something to have special, private, and it’s sad,” added Jones. The DEC says the wind may have brought the influx of dead birds to shore. While they are assessing the reports, they may decide to collect some bird specimens for testing. This article tagged under: AnimalsLong IslandSuffolk CountyHealth if (typeof adInstance === 'undefined') { adInstance = new AdLayersAPI(); } adInstance.lazyLoadAd({ slotName: 'mobilemultibox_belowarticle', format: 'mobilemultibox', targeting: {"slot":"mobilemultibox","pos":"mobilemultibox"} }); const taboolaLiveBlog = window.nbc.isLiveBlog; if (document.cookie.indexOf("scroll0=") < 0) { window._taboola = window._taboola || []; if (! taboolaLiveBlog) { _taboola.push({ article: 'auto', url: '' }); } _taboola.push({ mode: 'thumbnails-a', container: taboolaLiveBlog ? 'taboola-below-live-blog-thumbnails' : 'taboola-below-article-thumbnails', placement: decodeURIComponent( 'Below%20Article%20Thumbnails' ), target_type: 'mix' }); _taboola.push({ flush: true }); }; var isMobile = window.matchMedia('screen and (max-width: 767px)').matches; /** scroll cookie for scroll.com **/ if (document.cookie.indexOf("scroll0=") < 0 && isMobile) { window._taboola = window._taboola || []; _taboola.push({ mode: 'thumbs-feed-03-mobile', container: taboolaLiveBlog ? 'taboola-below-live-blog-thumbnails' : 'mobile-native-below-article', placement: taboolaLiveBlog ? 'App Below Live Blog Thum