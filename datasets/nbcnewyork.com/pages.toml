["https://www.nbcnewyork.com/new-york/hazel-dukes-civil-rights-activist-dies/6169032"]
title = "Hazel Dukes, civil rights activist and NAACP president, dies at 92 – NBC New York"
description = "Dr. Hazel Nell Dukes, a prominent civil rights activist and longtime president of the NAACP New York State Conference, has died at the age of 92. Her son released a statement Saturday morning confirming the passing of the activist, who spent decades of her work in and around New York. “Mom departed this life peacefully on the morning of March…"
full_description = '''New York Dr. Hazel Dukes, head of the New York NAACP, dies at 92 "We will never have another Hazel Dukes, but I am grateful that we had this one," Rev. Al Sharpton said of the late civil rights activist By NBC New York Staff • Published March 1, 2025 • Updated on March 1, 2025 at 11:25 am BOOKMARKER Getty Images Dr. Hazel Nell Dukes, a prominent civil rights activist and longtime president of the NAACP New York State Conference, has died at the age of 92. Her son released a statement Saturday morning confirming the passing of the activist, who spent decades of her work in and around New York. "Mom departed this life peacefully on the morning of March 1, 2025, surrounded by her loving family. Mom was a committed civil rights leader in New York City and the nation and worked tirelessly on the frontlines almost to the end," Ronald Dukes said in a statement on behalf of the family. Watch NBC 4 free wherever you are WATCH HERE Dukes was elected national president of the NAACP in 1989, where she served until 1992. She remains one of the few women to ever lead the organization. Rev. Al Sharpton described Dukes as a "force of nature for justice" and an "activist of the highest order." Get Tri-state area news delivered to your inbox with NBC New York's News Headlines newsletter. SIGN UP "We will never have another Hazel Dukes, but I am grateful that we had this one," Sharpton said of Dukes, whom he knew for more than 40 years. Dukes earned countless awards and recognition for her work on voting rights and fair housing, including the National Coalition of 100 Black Women’s Candace Award for community service, the Ellis Island Medal of Honor for patriotism and philanthropy, and the NAACP 108th Spingarn Medal – the highest or noblest achievement by a living African American in any honorable field. News politics 11 hours ago Cuomo mounts comeback, launches campaign for NYC mayor years after resignation Newark Airport 14 hours ago Cargo plane makes emergency landing at Newark after fiery bird strike Former Gov. Andrew Cuomo appeared to deliver the news of Dukes' passing in a post on X, formerly known as Twitter. "A great pioneer and warrior for social and racial justice, Hazel Dukes was my champion for as long as I can remember and close to all of us in the Cuomo family," Cuomo said. On Long Island, Nassau County Executive Bruce Blakeman said flags were be lowered to half staff until Dukes' burial "as a memorial to a great leader." This article tagged under: New York if (typeof adInstance === 'undefined') { adInstance = new AdLayersAPI(); } adInstance.lazyLoadAd({ slotName: 'mobilemultibox_belowarticle', format: 'mobilemultibox', targeting: {"slot":"mobilemultibox","pos":"mobilemultibox"} }); const taboolaLiveBlog = window.nbc.isLiveBlog; if (document.cookie.indexOf("scroll0=") < 0) { window._taboola = window._taboola || []; if (! taboolaLiveBlog) { _taboola.push({ article: 'auto', url: '' }); } _taboola.push({ mode: 'thumbnails-a', container: taboolaLiveBlog ? 'taboola-below-live-blog-thumbnails' : 'taboola-below-article-thumbnails', placement: decodeURIComponent( 'Below%20Article%20Thumbnails' ), target_type: 'mix' }); _taboola.push({ flush: true }); }; var isMobile = window.matchMedia('screen and (max-width: 767px)').matches; /** scroll cookie for scroll.com **/ if (document.cookie.indexOf("scroll0=") < 0 && isMobile) { window._taboola = window._taboola || []; _taboola.push({ mode: 'thumbs-feed-03-mobile', container: taboolaLiveBlog ? 'taboola-below-live-blog-thumbnails' : 'mobile-native-below-article', placement: taboolaLiveBlog ? 'App Below Live Blog Thumbnails - Fallback' : 'Below Article Thumbnails - Fallback', target_type: 'text' }); }; on now 12AM: News 4 New York Late News Trending Stories Donald Trump Trump kicks Zelensky out of White House after tense exchange; see full video politics Cuomo mounts comeback, launches campaign for NYC mayor years after resignation Bronx NYPD chaplain arrested for allegedly hi