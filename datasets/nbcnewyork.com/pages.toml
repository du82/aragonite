["https://www.nbcnewyork.com/news/local/trump-zelensky-full-video-white-house-leave/6168411"]
title = "Watch Trump Zelensky full video; White House kicks Ukraine out – NBC New York"
description = "President Donald Trump berated Ukrainian President Volodymyr Zelenskyy for being “disrespectful” Friday in an extraordinary Oval Office meeting, then abruptly called off the signing of a minerals deal with the U.S. that Trump said would have moved Ukraine closer to ending its war with Russia. The astonishing turn of events could scramble international affairs in Europe and around the globe…."
full_description = '''Donald Trump Trump kicks Zelensky out of White House after tense exchange; see full video The White House said the Ukraine delegation was told to leave after the heated exchange By Will Weissert l The Associated Press, Zeke Miller l The Associated Press and Justin Spike l The Associated Press • Published February 28, 2025 • Updated on February 28, 2025 at 2:51 pm BOOKMARKER NBC Universal, Inc. President Donald Trump berated Ukrainian President Volodymyr Zelenskyy for being “disrespectful” Friday in an extraordinary Oval Office meeting, then abruptly called off the signing of a minerals deal with the U.S. that Trump said would have moved Ukraine closer to ending its war with Russia. The astonishing turn of events could scramble international affairs in Europe and around the globe. During his visit with Trump, Zelenskyy had planned to sign the deal allowing the U.S. greater access to Ukraine's rare earth minerals, then hold a joint news conference. Instead, Ukraine's leader left the White House shortly after Trump shouted at him, showing open disdain. Untouched salad plates and other lunch items were being packed up outside the Cabinet room, where the lunch between Trump and Zelenskyy and their delegations was supposed to have taken place. Watch NBC 4 free wherever you are WATCH HERE The White House said the Ukraine delegation was told to leave. “You’re gambling with World War III, and what you’re doing is very disrespectful to the country, this country that’s backed you far more than a lot of people say they should have,” Trump told Zelenskky. Get Tri-state area news delivered to your inbox with NBC New York's News Headlines newsletter. SIGN UP The last 10 minutes of the nearly 45-minute meeting devolved into a tense back and forth between Trump, Vice President JD Vance and Zelenskyy, who had urged skepticism about Russia’s commitment to diplomacy, citing Moscow’s years of broken commitments on the global stage. Zelenskyy’s main objective going into the sit-down had been to press Trump not to abandon his country and to warn against moving too closely to Russian President Vladimir Putin. Instead he got shouted at while Trump appeared to play up the drama for the cameras. Local New York 7 hours ago New York's governor orders college to remove Palestinian studies job listing Music & Musicians 13 hours ago David Johansen, singer from the seminal punk band the New York Dolls, dies at 75 At one point, Zelenskyy said Putin had broken “his own signature” 25 times on ceasefires and other agreements and could not be trusted. Trump responded that Putin had not broken agreements with him and mostly ducked questions about offering security guarantees to Ukraine, saying he thought the minerals deal — which is now on-hold — would effectively end the fighting. Things first got testy after Vance challenged Zelenskyy, telling him, “Mr. President, with respect, I think it’s disrespectful for you to come to the Oval Office to try to litigate this in front of the American media.” Zelensky tried to object, prompting Trump to raise his voice and say, “You’re gambling with the lives of millions of people.” A short time later, Trump posted on his social media site that he had “determined” that Zelenskyy “is not ready for Peace.” “He disrespected the United States of America in its cherished Oval Office. He can come back when he is ready for Peace,” Trump wrote. Trump also suggested that the heated exchange was productive: “Much was learned that could never be understood without conversation under such fire and pressure. It’s amazing what comes out through emotion.” Democrats immediately criticized the administration for the breakdown. Democratic Senate leader Chuck Schumer said Trump and Vance “are doing Putin’s dirty work.” The testy exchange was especially surprising since it came a day after Trump struck a more conciliatory tone toward Ukraine, calling America’s support for the country against Russia’s invasion “a very worthy thing to do” and disclaiming any memory that he had called the Ukrainian leader a “dictator.” Trump and Zelenskyy spoke politely, even with admiration, of one of another for the first half hour of the meeting. But, when the Ukrainian leader raised alarm about trusting any promises from Putin to end the fighting, Vance offered his strong rebuke for airing disagreements with Trump in public. That instantly shifted the tenor of the conversation as Zelenskyy grew defensive and Trump and his vice president blasted him as ungrateful and issued stark warnings about future American support. “It’s going to be a very hard thing to do business like this,” Trump said to Zelenskyy as the two leaders talked over each other about past international support for Ukraine. Vance then interjected, “Again, just say thank you,” blasting Zelenskyy for litigating “disagreements” in front of the press. Trump seemed pleased that the scene was being recorded on camera. “I think it’s good for the American people to see what’s going on,” he added. Trump also suggested that Zelenskyy should not be demanding concessions. "You’re not in a good position. You don’t have the cards right now,” Trump said pointing his finger toward Zelenskyy. “With us you start having cards.” Shortly before the meeting ended, Trump offered, “This is going to be great television.” Before the blow-up, Zelenskyy had been expected to sign a landmark economic agreement with the U.S. aimed at financing the reconstruction of war-damaged Ukraine, a deal that would have closely tied the two countries together for years to come. As Ukrainian forces hold out against slow but steady advances by Russia’s larger and better-equipped army, leaders in Kyiv were pushing to ensure a potential U.S.-brokered peace plan would include guarantees for the country’s future security. Many Ukrainians fear that a hastily negotiated peace — especially one that makes too many concessions to Russian demands — would allow Moscow to rearm and consolidate its forces for a future invasion after current hostilities cease. Trump, a Republican, had framed the emerging agreement as a chance for Kyiv to compensate the U.S. for wartime aid sent under his predecessor, Democratic President Joe Biden. But Zelenskyy has remained firm that specific assurances for Ukraine’s security must accompany any agreement giving U.S. access to Ukraine’s resources. It was Zelenskyy’s fifth White House visit, but his previous four came during the Biden administration. The Ukrainian president also was meeting with U.S. senators during his time in Washington. Fears that Trump could broker a peace deal with Russia that is unfavorable to Ukraine have been amplified by recent precedent-busting actions by his administration. Trump held a lengthy phone call with Putin, and U.S. officials met with their Russian counterparts in Saudi Arabia without inviting European or Ukrainian leaders — both dramatic breaks with previous U.S. policy to isolate Putin over his invasion. Trump later seemed to falsely blame Ukraine for starting the war and called Zelenskyy a “dictator” for not holding elections after the end of his regular term last year, though Ukrainian law prohibits elections while martial law is in place. This article tagged under: Donald TrumpTrump Administration if (typeof adInstance === 'undefined') { adInstance = new AdLayersAPI(); } adInstance.lazyLoadAd({ slotName: 'mobilemultibox_belowarticle', format: 'mobilemultibox', targeting: {"slot":"mobilemultibox","pos":"mobilemultibox"} }); const taboolaLiveBlog = window.nbc.isLiveBlog; if (document.cookie.indexOf("scroll0=") < 0) { window._taboola = window._taboola || []; if (! taboolaLiveBlog) { _taboola.push({ article: 'auto', url: '' }); } _taboola.push({ mode: 'thumbnails-a', container: taboolaLiveBlog ? 'taboola-below-live-blog-thumbnails' : 'taboola-below-article-thumbnails', placement: decodeURIComponent( 'Below%20Article%20Thumbnails' ), target_type: 'mix' }); _taboola.push({ flush: true }