ndefined') { adInstance = new AdLayersAPI(); } adInstance.lazyLoadAd({ slotName: 'bottombox_225', format: 'bottombox', targeting: {"slot":"bottombox","pos":"bottombox"} }); if (typeof adInstance === 'undefined') { adInstance = new AdLayersAPI(); } adInstance.lazyLoadAd({ slotName: 'interstitial_738', format: 'interstitial', targeting: {"slot":"interstitial","pos":"interstitial"} }); if (typeof adInstance === 'undefined') { adInstance = new AdLayersAPI(); } adInstance.lazyLoadAd({ slotName: 'mobilebackstage_233', format: 'mobilebackstage', targeting: {"slot":"mobilebackstage","pos":"mobilebackstage"} });'''
