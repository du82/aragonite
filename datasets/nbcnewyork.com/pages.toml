title = "Grammy-nominated R&B singer Angie Stone dies in car crash – NBC New York"
description = "The 63-year-old singer helped form The Sequence, which became one of the first female groups to record a rap song."
full_description = '''Celebrity News Grammy-nominated R&B singer Angie Stone dies in car crash The 63-year-old singer helped form The Sequence, the first all-female group on the hip-hop trailblazing imprint Sugar Hill Records, becoming one of the first female groups to record a rap song. By The Associated Press • Published March 1, 2025 • Updated on March 1, 2025 at 3:49 pm BOOKMARKER Paras Griffin/Getty Images for TV One Grammy-nominated R&B singer Angie Stone, a member of the all-female hip hop trio The Sequence and known for the hit song “Wish I Didn't Miss You,” was killed early Saturday in a car crash. She was 63. “Unfortunately, at around 4 a.m. while heading back to Atlanta from Alabama, the Sprinter flipped over and was subsequently hit by a big rig,” music producer Walter Millsap III told The Associated Press in an email. “Thankfully, all survived except for Angie." The singer-songwriter created hits like “No More Rain (In This Cloud)” which reached No. 1 for 10 weeks on Billboard’s Adult R&B airplay chart, “Baby” with legendary soul singer Betty Wright, another No. 1 hit, and “Wish I Didn’t Miss You” and “Brotha.” Watch NBC 4 free wherever you are WATCH HERE She found a sweet spot in the early 2000s as neo-soul begin to dominate the R&B landscape with the emergence of singers like Erykah Badu, Jill Scott, Maxwell and D’Angelo. Her 2001 album “Mahagony Soul” reached No. 22 on the Billboard 200, while 2007’s “The Art Of Love & War” peaked at No. 11. Get Tri-state area news delivered to your inbox with NBC New York's News Headlines newsletter. SIGN UP r Music & Musicians Feb 24 Roberta Flack, Grammy-winning singer with an intimate style, dies at 88 Celebrity News Feb 19 ‘Wicked' choice: Cynthia Erivo will host the Tony Awards in June Saturday Night Live Feb 16 ‘SNL 50' begins with Paul Simon and Sabrina Carpenter duet, Steve Martin monologue The church-grown singer was born in Columbia, South Carolina. She helped form The Sequence, the first all-female group on the hip-hop trailblazing imprint Sugar Hill Records, becoming one of the first female groups to record a rap song. After finding success in the early 1980s, Stone later joined the trio Vertical Hold before launching her solo career. A Soul Train Lady of Soul winner, Stone went on to showcase her acting chops with film roles in “The Hot Chick” starring Rob Schneider, “The Fighting Temptations” which starred Cuba Gooding Jr. and Beyoncé, and “Ride Along” led by Ice Cube and Kevin Hart. She also hit the Broadway stage as Big Mama Morton in “Chicago,” and she showcased her vulnerability on the reality TV shows “Celebrity Fit Club” and “R&B Divas: Atlanta.” —— Associated Press reporter Gary Gerard Hamilton contributed to this report from New York. Copyright The Associated Press This article tagged under: Celebrity News if (typeof adInstance === 'undefined') { adInstance = new AdLayersAPI(); } adInstance.lazyLoadAd({ slotName: 'mobilemultibox_belowarticle', format: 'mobilemultibox', targeting: {"slot":"mobilemultibox","pos":"mobilemultibox"} }); const taboolaLiveBlog = window.nbc.isLiveBlog; if (document.cookie.indexOf("scroll0=") < 0) { window._taboola = window._taboola || []; if (! taboolaLiveBlog) { _taboola.push({ article: 'auto', url: '' }); } _taboola.push({ mode: 'thumbnails-a', container: taboolaLiveBlog ? 'taboola-below-live-blog-thumbnails' : 'taboola-below-article-thumbnails', placement: decodeURIComponent( 'Below%20Article%20Thumbnails' ), target_type: 'mix' }); _taboola.push({ flush: true }); }; on now 12AM: News 4 New York Late News Trending Stories Donald Trump Trump kicks Zelensky out of White House after tense exchange; see full video politics Cuomo mounts comeback, launches campaign for NYC mayor years after resignation news Zelenskyy won't apologize to Trump, but calls clash ‘not good for both sides' Bronx NYPD chaplain arrested for allegedly hiring sex worker in the Bronx New York New York's governor orders college to remove Palestinian studies job 