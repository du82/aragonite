full_description = '''About Us NBC New York Our Mission NBC 4 New York / WNBC is the flagship station of the NBCUniversal Local division of NBCUniversal, serving the New York Tri-State area for more than 75 years and featuring Alfred I. duPont-Columbia, Edward R. Murrow and Emmy® Award-winning journalists who are among the most accomplished in their field. The station includes the NBC 4 I-Team, New York’s largest televised investigative reporting unit, Better Get Baquero which has recovered more than $9 million for Tri-State consumers and Storm Team 4, certified by WeatheRate for delivering the Tri-State’s most accurate local weather forecast using cutting-edge technology such as Storm Tracker 4, a high-frequency S-Band dual polarization fixed Doppler weather radar. Our History NBC 4 New York/WNBC is the flagship station of the NBCUniversal Local division of NBCUniversal, serving the New York tri-state area for more than 75 years. What Do We Offer Our Audience? NBC 4 New York/WNBC offers more than 42 hours of locally-produced programming each week across all platforms, including NBC 4 New York’s digital platforms, which are among the most read and watched in the New York market. This includes the NBC 4 App, newsletters, dedicated Peacock, Roku, Samsung TV Plus, Xumo Play, and Amazon Fire 24/7 streaming channels along with unique, out-of-home viewing in local taxis. Our Impact NBC 4 New York/WNBC includes the NBC 4 I-Team, New York’s largest televised investigative reporting unit, Better Get Baquero, which has recovered more than $10 million for tri-State consumers and Storm Team 4, certified by WeatheRate for delivering the tri-state’s most accurate local weather forecast using cutting-edge technology such as Storm Tracker 4, a high-frequency S-Band dual polarization fixed Doppler weather radar. Our Awards NBC 4 New York/WNBC includes Alfred I. duPont-Columbia, Edward R. Murrow and Emmy® Award-winning journalists who are among the most accomplished in their fields. 