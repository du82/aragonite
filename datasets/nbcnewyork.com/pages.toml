["https://www.nbcnewyork.com/news/business/money-report/egg-prices-are-threatening-a-classic-holiday-tradition-easter-dye-kits/6167786"]
title = "Egg prices threaten Easter dye kit sales – NBC New York"
description = "The makers of Easter egg dye kits are bracing for the potential fallout if the egg shortage doesn't begin to clear up before the April 20 holiday."
full_description = '''Money Report In partnership with Easter Egg prices are threatening a classic holiday tradition: Easter dye kits By Sarah Whitten, CNBC • Published February 28, 2025 • Updated on February 28, 2025 at 9:44 am BOOKMARKER Melkinimages | E+ | Getty Images The makers of Easter egg dye kits are bracing for the potential fallout if the egg shortage doesn't begin to clear up before the April 20 holiday. For many companies that specialize in these activity sets, egg dye kits and related products make up a significant share of annual revenue. Some companies still expect to see solid business this Easter, bolstered by three extra weeks of selling and the draw of the tradition. The egg aisle is anything but cheaper by the dozen these days — and that's becoming a big problem ahead of the Easter holiday. The makers of Easter egg dye kits are bracing for the potential fallout if the egg shortage doesn't begin to clear up before the April 20 holiday. For many companies that specialize in these activity sets, egg dye kits and related products make up a significant share of annual revenue. Diminished sales could have a major impact on their bottom lines. Watch NBC 4 free wherever you are WATCH HERE "I think sales will be down," said Ashley Phelps, founder and CEO of Color Kitchen, a plant-based baking decoration company. "That remains to be seen, but I think it probably will be." Wholesale egg prices have eclipsed record levels, reaching a high of $8.58 per dozen amid a domestic bird flu outbreak, according to global commodity data firm Expana. More than 52 million egg-laying birds have died, leaving the national flock at just 280 million, a critically low level, said Ryan Hojnowski, a market reporter at Expana. Get Tri-state area news delivered to your inbox with NBC New York's News Headlines newsletter. SIGN UP He noted that rising prices have slowed consumer demand as retail egg prices average around $6 per dozen or higher. Additionally, many stores have implemented purchasing limits, restricting the number of cartons that customers can buy at one time. The combination of inflated price and limited availability could curtail sales of eggs for the Easter holiday, ultimately affecting the demand for egg dye kits. Money Report Cybersecurity 8 hours ago Reported global Microsoft outage leaves tens of thousands unable to access email and other apps news 10 hours ago Michelin-star chef says this is the No. 1 thing home cooks waste money on: ‘It's a vanity in the kitchen' Natural Earth Paint, a company that manufactures natural art supplies and craft kits for kids, typically sells between 40,000 and 50,000 egg dye kits around the Easter holiday, according to founder Leah Fanning. So far this year, the company's retail partners have ordered only 7,000 kits. "It's definitely a huge drop," Fanning said, noting that most buyers have cited the egg shortage for the smaller orders. Fanning told CNBC that the egg dye kits have been Natural Earth Paint's bestselling product for 13 years and kept the company in business for its first eight years. Of the company's more than 40 products, the egg dye kit remains its "absolute bestseller." She noted that while the majority of Natural Earth Paint's sales come from retail locations, online sales typically pick up around three weeks before Easter. That leaves the chance that direct-to-consumer sales could get a boost in mid-March. Anadolu | Getty ImagesA sign in a supermarket in New York City asks customers to limit their purchase of eggs to one carton, Feb. 13, 2025. The avian flu epidemic in the U.S. has sharply reduced the supply and raised the prices of eggs. Color Kitchen said its Easter items represent 20% of the company's total stock of items and outpace sales of all other items, including its Christmas icing kits. Phelps noted that most retailers order these egg kits months ahead of the holiday to ensure they are in stock immediately after Valentine's Day. She said retailers "took a little less product this year" given sensitivity to the inflationary environment. "The other concern is that, some of the grocery stores, if they don't sell through, then we get charged back for product that goes discounted to try and move it out of the store," Phelps said. "So, that's where we'll get hit if the stuff that's already been shipped out to grocery stores does not sell. That could potentially be very bad." Phelps said 75% of Color Kitchen sales are from the shelf. The remaining 25% is from direct-to-consumer sales on its website and on sites such as Amazon. Walking on eggshells There are some companies that still expect to see solid business this Easter. The holiday takes place in late April, giving companies three more weeks of sales compared with last year. Hey Buddy Hey Pal, a company that makes the Eggmazing Egg Decorator, a crafting tool that spins eggs so kids can use markers to color them, generates between 85% and 90% of its annual revenue from its Easter product. Last year, the company generated $14 million in sales, a 22% bump from the year prior. Curtis McGill, co-founder of Hey Buddy Hey Pal, said retailers have ordered fewer of its products this year. Still, the company said it expects another jump of 18% in annual revenue as it's set to sell between 600,000 and 700,000 egg decorators this year. Even as egg prices boil over, some dye kit makers see egg decorating as an essential tradition that few families will opt to skip, even if they reduce the number of eggs they use. Paas, the leader in the egg dye kit space, expects that some families will decorate fewer eggs this year, but said many will still participate in the tradition. "It's just such a sticky tradition," said Joe Ens, CEO of Signature Brands, which owns the 140-year-old iconic Paas brand. The company recently completed a survey of 120 consumers and found that 94% of them still plan on decorating eggs this holiday. "And the reason for that, other than the tradition being so important to consumers, is if you really break down the cost of the tradition, it is arguably the most affordable family tradition during any holiday," he said. Paas expects to sell more than 10 million kits this year, one of the company's strongest sell-ins ever, he said. Arts and crafts store chain Michaels said it's already seeing shoppers opt for egg-inspired products. The company told CNBC that 43% of its total Easter sales so far this year have been for plaster, plastic and craft eggs. Michaels said a particular craft egg kit designed to "mimic the traditional egg-decorating experience" is selling nearly three times faster than the company had anticipated. Similarly, Hey Buddy Hey Pal expects some families may opt to purchase wooden eggs instead of real ones. Though the alternatives are typically more expensive than real eggs, they're an opportunity to keep the creations around long after the holiday is over. "A lot could happen between now and then, we can continue to see an outbreak of avian flu and some different egg farms that hadn't been affected," said McGill. "It could get worse before it gets better. That's not the projections, but at this point ... I'm just gonna hold my breath until we get to April the 20th." Also on CNBC 1 in 5 Americans are 'doom spending' — here's how that can backfire We're lifting our price target on off-price retailer TJX after a strong quarter What we want to hear from Nvidia, Salesforce — plus, Lilly does what no other can Subscribe to the CNBC YouTube Channel Morning Squawk Newsletter Copyright CNBC This article tagged under: Easter if (typeof adInstance === 'undefined') { adInstance = new AdLayersAPI(); } adInstance.lazyLoadAd({ slotName: 'mobilemultibox_belowarticle', format: 'mobilemultibox', targeting: {"slot":"mobilemultibox","pos":"mobilemultibox"} }); const taboolaLiveBlog = window.nbc.isLiveBlog; if (document.cookie.indexOf("scroll0=") < 0) { window._taboola = window._taboola || []; if (! taboolaLiveBlog) { _taboola.push({ ar