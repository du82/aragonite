full_description = '''Broadway ‘Gypsy' cancels Friday night show as illness continues to impact Broadway company "Gypsy" has now canceled five shows this week By NBC New York Staff • Published December 27, 2024 • Updated on December 27, 2024 at 12:51 pm BOOKMARKER NBC Universal, Inc. "Gypsy," the latest revival of Stephen Sondheim's hit Broadway musical, has canceled a fifth performance as illnesses continue to hit the show's company. "Due to continued illness within the company, tonight’s performance is cancelled. We apologize for the inconvenience. Please check with your point of purchase to exchange or refund your tickets," a social media post on X read early Friday afternoon. Due to continued illness within the company, tonight’s performance is cancelled. We apologize for the inconvenience. Please check with your point of purchase to exchange or refund your tickets. pic.twitter.com/EO3QUYwaE7— Gypsy on Broadway (@gypsybway) December 27, 2024 Watch NBC 4 free wherever you are WATCH HERE The production's performances on Thursday afternoon and evening were also canceled for illness, with the evening performance canceled just under two hours to curtain. The show has now canceled the following performances: Get Tri-state area news delivered to your inbox with NBC New York's News Headlines newsletter. SIGN UP 12/23 evening performance 12/25 evening performance 12/26 matinee performance 12/26 evening performance 12/27 evening performance Earlier in the week, "Gypsy" said on social media, "Now that the production has opened, we are very quickly getting all our understudies up to speed." In the Wings Broadway Dec 26, 2024 ‘Gypsy' on Broadway cancels both shows Thursday as illnesses impact company Broadway Dec 23, 2024 ‘Gypsy' cancels Monday performance on Broadway over multiple illnesses Two performances are scheduled for Saturday, Dec. 28 -- at 2 and 8 p.m. "Gypsy" is playing at the Majestic Theatre on 44th Street. Opening night was Dec. 19. Audra McDonald and the very 