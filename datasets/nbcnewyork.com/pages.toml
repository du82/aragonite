title = "People who are truly content with life do these 10 little things every day: Ivy League-trained happiness expert – NBC New York"
description = "Author, speaker and happiness researcher Jessica Weiss shares the “small, intentional” habits that the happiest and most content people do every day."
full_description = '''Money Report In partnership with news People who are truly content with life do these 10 little things every day: Ivy League-trained happiness expert By Jessica Weiss, Contributor, CNBC • Published March 1, 2025 • Updated on March 1, 2025 at 9:07 am BOOKMARKER Delmaine Donson | Getty Images When life gets complicated, our instincts often lead us down the wrong path. We isolate ourselves when community could heal us, or we dream of endless free time when a new challenge could fulfill us. I've spent 15 years studying happiness, and I've had the opportunity to speak with thousands of people across all walks of life, spanning all income levels — from executives in corner offices to frontline workers. I've learned that no matter what their background or circumstances are, the happiest people have figured out how to actively train their brains to seek joy and contentment. Watch NBC 4 free wherever you are WATCH HERE DON'T MISS: How to start a side hustle to earn extra money What truly content people do every day Get Tri-state area news delivered to your inbox with NBC New York's News Headlines newsletter. SIGN UP 1. Prioritize friendships: The happiest people treat their close relationships as a non-negotiable rather than a "nice-to-have." And when they schedule friend time, they try to focus on doing activities together instead of just a quick catch-up. 2. Rest strategically: Mentally exhausted? Go for a jog. Brain fried from analytical work? Do something creative with your hands. The most content people know how to intentionally match what depleted them to their mode of recovery. Money Report Cybersecurity 6 hours ago Reported global Microsoft outage leaves tens of thousands unable to access email and other apps news 9 hours ago Michelin-star chef says this is the No. 1 thing home cooks waste money on: ‘It's a vanity in the kitchen' 3. Engage in creative work: People who spend time on creative activities, whether it's cooking, writing, gardening or painting, report significantly higher levels of happiness. When you create something new, even if it's a hilariously bad watercolor, your brain lights up in ways that scrolling on your phone never triggers. 4. Cultivate community: The next time you feel stressed or overwhelmed, reach out instead of pulling in. Help someone else or find a cause that fills you with a sense of purpose. Your brain might protest at first, but your happiness will soar. 5. Don't be afraid to geek out: The happiest people don't play it cool. They actively seek out the things, people and activities that light them up. You know the enthusiasm you feel when you talk about an activity you love? That's actually the secret ingredient to daily happiness. 6. Set firm boundaries: Research says we need two to five hours of free time every day for peak happiness. Happy people protect their "me time," and they know that those work emails can wait until later. 7. Manage your energy: Happy people recognize their personal peaks and valleys, scheduling demanding tasks when they're naturally most alert and recovery periods when they typically slump. They create days that flow with their biology, rather than fight against it. 8. Embrace micro-connections: Research shows that random conversations with people you don't know consistently improve your mood, so that chat with your barista might just be the happiness booster you never knew you were missing. 9. Savor the good: Truly content people don't rush. They slow down to fully absorb positive moments — the beauty of the sunset, the taste of good food, the feeling of accomplishment. By lingering in these experiences, they train their brains to experience joy more deeply. 10. Pursue meaningful progress: Content people are always celebrating the small wins along their journey. They understand that the sense of forward momentum itself generates more joy than reaching the final destination ever will. The happy mindset The people I've met who have true joy in their lives don't view happiness in terms of a spotlight moment — the standing ovation, the milestone achievement or the perfect day. They consider it more like a string of lights. Each small bulb might seem insignificant on its own, but together they create something magical. Start with just one of these small, intentional happiness habits today, and watch as your capacity for flourishing, satisfaction and contentment grows over time. Jessica Weiss is a keynote speaker and executive coach who teaches people and businesses how to find more happiness, fulfillment and satisfaction at work. With a background in positive psychology, she's spent 15 years working with global brands like Coca-Cola, Johnson & Johnson and American Express. She is the author of the upcoming book, "Happiness Works: The Science of Thriving at Work." She earned her BA from the University of Pennsylvania and an MBA from Columbia Business School. Want to earn some extra money on the side? Take CNBC's new online course How to Start a Side Hustle to learn tips to get started and strategies for success from top side hustle experts. Sign up today and use coupon code EARLYBIRD for an introductory discount of 30% off $97 (+taxes and fees) through April 1, 2025. Also on CNBC Use this 3-step guide to manage 'flight anxiety,' from a psychologist Harvard professor and author: My 4 rules for better conversations Psychologist: 3 red flag phrases 'gaslighters' use in romantic relationships Subscribe to the CNBC YouTube Channel Morning Squawk Newsletter Copyright CNBC This article tagged under: news if (typeof adInstance === 'undefined') { adInstance = new AdLayersAPI(); } adInstance.lazyLoadAd({ slotName: 'mobilemultibox_belowarticle', format: 'mobilemultibox', targeting: {"slot":"mobilemultibox","pos":"mobilemultibox"} }); const taboolaLiveBlog = window.nbc.isLiveBlog; if (document.cookie.indexOf("scroll0=") < 0) { window._taboola = window._taboola || []; if (! taboolaLiveBlog) { _taboola.push({ article: 'auto', 