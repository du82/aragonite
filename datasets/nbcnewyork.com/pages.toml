["https://www.nbcnewyork.com/news/business/money-report/another-near-miss-citigroup-mistakenly-credited-a-customer-account-with-81-trillion/6169099"]
title = "Another ‘near miss’: Citigroup mistakenly credited a customer account with $81 trillion – NBC New York"
description = "Citigroup mistakenly credit a customer’s account with $81 trillion last year when it meant to send just $280."
full_description = '''Money Report In partnership with news Another ‘near miss': Citigroup mistakenly credited a customer account with $81 trillion By Tanaya Macheel, CNBC • Published March 1, 2025 • Updated on March 1, 2025 at 3:44 pm BOOKMARKER Jim Dyson | Getty Images News | Getty Images Citigroup mistakenly credited a customer's account with $81 trillion last year when it meant to send just $280. The payment, which took place last April, was missed by two employees but caught 90 minutes after it was posted, the Financial Times reported Friday. The mistaken payment was reversed several hours later and reported to the Federal Reserve and Office of the Comptroller of the Currency as a "near miss." Citigroup mistakenly credited a customer's account with $81 trillion last year when it meant to send just $280. The payment, which took place last April, was missed by two employees but caught 90 minutes after it was posted, the Financial Times first reported Friday. It was reversed several hours later and reported to the Federal Reserve and Office of the Comptroller of the Currency as a "near miss." Watch NBC 4 free wherever you are WATCH HERE The event is the latest mistake disclosed by the Wall Street bank, which is struggling to overcome a series of operational errors in recent years. "Despite the fact that a payment of this size could not actually have been executed, our detective controls promptly identified the inputting error between two Citi ledger accounts, and we reversed the entry," Citi said in a statement to NBC News. "Our preventative controls would have also stopped any funds leaving the bank. While there was no impact to the bank or our client, the episode underscores our continued efforts to continue eliminating manual processes and automating controls through our Transformation." Get Tri-state area news delivered to your inbox with NBC New York's News Headlines newsletter. SIGN UP Citi neither confirmed nor provided comment on the number of near misses it has experienced. Near misses occur when a bank processes the wrong amount but is able to recover the funds. The bank suffered 10 near misses of $1 billion or more last year and 13 in the year prior, the according to the report. Money Report Cybersecurity 8 hours ago Reported global Microsoft outage leaves tens of thousands unable to access email and other apps news 11 hours ago Michelin-star chef says this is the No. 1 thing home cooks waste money on: ‘It's a vanity in the kitchen' The bank has been working to repair its reputation since it sent $900 million in error to creditors engaged in a contentious battle over the debt of cosmetics group Revlon five years ago — which led to the ousting of former CEO Michael Corbat, as well as big fines and regulatory consent orders requiring Citi to fix the issues. Corbat's successor, Jane Fraser, has said improving risk and controls is a top priority. The bank was still fined $136 million by regulators last year for not making enough progress on the improvements. Also on CNBC Best 0% interest credit cards How to buy a house with a low income CFPB leaders and Musk’s DOGE planned to fire nearly all staff, employees say Subscribe to the CNBC YouTube Channel Morning Squawk Newsletter Copyright CNBC This article tagged under: news if (typeof adInstance === 'undefined') { adInstance = new AdLayersAPI(); } adInstance.lazyLoadAd({ slotName: 'mobilemultibox_belowarticle', format: 'mobilemultibox', targeting: {"slot":"mobilemultibox","pos":"mobilemultibox"} }); const taboolaLiveBlog = window.nbc.isLiveBlog; if (document.cookie.indexOf("scroll0=") < 0) { window._taboola = window._taboola || []; if (! taboolaLiveBlog) { _taboola.push({ article: 'auto', url: '' }); } _taboola.push({ mode: 'thumbnails-a', container: taboolaLiveBlog ? 'taboola-below-live-blog-thumbnails' : 'taboola-below-article-thumbnails', placement: decodeURIComponent( 'Below%20Article%20Thumbnails' ), target_type: 'mix' }); _taboola.push({ flush: true }); }; var isMo