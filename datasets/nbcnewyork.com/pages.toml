full_description = '''New York How to watch NBC 4 New York News live for free anytime, on any device Watch 24/7 news, weather and more from the tri-state area on your favorite streaming platform. Published August 20, 2024 • Updated on January 22, 2025 at 10:13 pm BOOKMARKER You can now watch the latest news and weather reports from the tri-state area anytime, on any device. NBC New York News, our 24/7 streaming channel, is now available on Roku TV, Peacock, Fire TV, Samsung TV Plus, Xumo Play, Local Now, Pluto, Google TV, TCL, Xfinity, and Amazon Prime Video. You can also stream our channel on the NBC New York app or by tapping the “Watch News 24/7” button on NBCNewYork.com. Watch NBC 4 free wherever you are WATCH HERE What can you expect to see on our channel? You can watch 24/7 local news, weather forecasts, special reports, original content and live events in NYC and around the tri-state. Below are instructions on how to find our streaming channel on your favorite platform. Scroll through the list, or select a streaming platform to navigate to those instructions. Get Tri-state area news delivered to your inbox with NBC New York's News Headlines newsletter. SIGN UP NOTE: We will update this page when our streaming channel is available to watch on additional platforms. $(document).ready(function(){ function scrollToTargetAdjusted(which){ var element = document.getElementById(which); var headerOffset = 100; var elementPosition = element.getBoundingClientRect().top; var offsetPosition = elementPosition + window.pageYOffset - headerOffset; window.scrollTo({ top: offsetPosition, behavior: "smooth" }); } $(".fastnav").click(function() { //console.log($(this).attr("data-id")); scrollToTargetAdjusted($(this).attr("data-id")); }); }); FireTV Amazon Prime Video Google TV LocalNow Peacock Pluto Roku SamsungTV TCL Xfinity Xumo Play Amazon FireTV You can now find "NBC New York News" on the Fire TV Channels, available on Amazon Fire TV devices! No app download needed! 1. To find the channel, open Fire TV Channels on your Fire TV device, then click Local News in the News tab 2. Scroll to find "NBC New York News" Amazon Prime Video Amazon Prime Video is available as an app on Fire TV, Fire Tablets, and third party devices including Roku, Samsung Smart TVs, Apple TV, Xfinity, and Google TV. The app is also available on iPhone, iPad, and Android mobile devices and can additionally be accessed through web. 1. Open Prime Video app on your favorite device. 2. Select the "Live TV" tab 3. Select the "Local News" sub-tab 4. Search for "NBC New York News" Google TV Google TV comes with live TV channels at no charge and with no app installation, sign-up, or subscription needed. You can browse Google TV channels in the "Live" tab, your recommendations, or the Google TV channel player. Local Now Open the Local Now app on your favorite mobile device or streaming platform. Input your city in the "My City" section at the top of the channel guide or go here. Peacock Go to PeacockTV.com or download the Peacock app for your streaming device, phone or tablet. It's available for iPhone or Android. 1. Click on the "channels" tab in the app 2. Scroll through the channels to find "NBC New York News" Pluto 1. Open the Pluto app on your favorite mobile device or streaming platform 2. Search "NBC New York News" Roku TV Select the Live TV tile on your Roku TV home screen and then click the left arrow button OR 1. Open The Roku Channel app, click the left arrow button to access the left-hand navigation menu and select Live TV Type "NBC New York News" into the search bar on your Roku device Samsung TV Scroll through the guide to find your "NBC New York News" on Samsung TV Plus. Mobile: To watch "NBC New York News" on Samsung TV Plus on your Samsung mobile device, download the app in the Galaxy Store or Google Play Store. TV: To watch on your Samsung TV, navigate to the app bar on the bottom of your screen and search for channel 1035 or "NBC New York News". TCL Watching live TV on a TCL Roku TV1. Access the "Live TV Zone" from the left-hand navigation menu, right below "Home" and "Featured Free." 2. Scroll through the guide to find "NBC New York News" Watching live TV on a TCL with Google1. Click into the "Live TV" tab from the homescreen of all TCL TVs with Google TV. 2. Scroll through the guide to find "NBC New York News". Xfinity The first time you open the app on a specific device, you'll need to register the device on your account. Enter your Xfinity ID and password, then tap Continue. You only need to register this device once. On future visits, the mobile app will recognize this device and you won't need to sign in again. You can find "NBC New York News" by going to the Xfinity Stream App - and clicking "Live TV". Xumo Play Open the Xumo Play app on your favorite mobile device or streaming platform. 1. In the Live Guide there is a vertical list of content sections. Scroll down to the last option, "Local News" 2. Scroll through the local options and select "NBC New York News". This article tagged under: New York if (typeof adInstance === 'undefined') { adInstance = new AdLayersAPI(); } adInstance.lazyLoadAd({ slotName: 'mobilemultibox_belowarticle', format: 'mobilemultibox', targeting: {"slot":"mobilemultibox","pos":"mobilemultibox"} }); const taboolaLiveBlog = window.nbc.isLiveBlog; if (document.cookie.indexOf("scroll0=") < 0) { window._taboola = window._taboola || []; if (! taboolaLiveBlog) { _taboola.push({ article: 'auto', url: '' }); } _taboola.push({ mode: 'thumbnails-a', container: taboolaLiveBlog ? 'taboola-below-live-blog-thumbnails' : 'taboola-below-article-thumbnails', placement: decodeURIComponent( 'Below%20Article%20Thumbnails' ), target_type: 'mix' }); _taboola.push({ flush: true }); }; var isMobile = window.matchMedia('screen and (max-width: 767px)').matches; /** scroll cookie for scroll.com **/ if (document.cookie.indexOf("scroll0=") < 0 && isMobile) { window._taboola = window._taboola || []; _taboola.push({ 