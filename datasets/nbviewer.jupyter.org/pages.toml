["https://nbviewer.jupyter.org/faq"]
title = "Jupyter Notebook Viewer"
full_description = "nbviewer is a web application that lets you enter the URL of a Jupyter Notebook file, renders that notebook as a static HTML web page, and gives you a stable link to that page which you can share with others. nbviewer also supports browsing collections of notebooks (e.g., in a GitHub repository) and rendering notebooks in other formats (e.g., slides, scripts). nbviewer is an open source project under the larger Project Jupyter initiative along with other projects like Jupyter Notebook, JupyterLab, and JupyterHub. Project Jupyter runs a free, public instance of nbviewer at https://nbviewer.org. You can use it to render Jupyter Notebooks or browse notebook collections on GitHub. In either case, the notebooks must have public web URLs. nbviewer is written in Python and JavaScript, uses nbconvert to render notebooks, and uses Tornado as its web server. You can install nbconvert locally and run jupyter nbconvert to get the same functionality (and more). See the nbconvert documentation for details. nbviewer does not execute notebooks. It only renders the inputs and outputs saved in a notebook document as a web page. mybinder.org is a separate web service that lets you open notebooks in an executable environment, making your code immediately reproducible by anyone, anywhere. nbviewer shows an Execute on Binder icon in its navbar which nbviewer only supports launching notebooks stored on GitHub or as Gists on Binder. Binder does support other providers directly on the mybinder.org site. Binder tries to build a Docker image containing the notebooks and requirements declared in a git repository. The build will fail if the repository has a Dockerfile, requirements.txt, environment.yaml, etc. with issues. We suggest letting the repository owner know about the problem or submitting a pull request to help fix it. Binder builds a Docker image containing the notebooks in a git repository. Those notebooks may have requirements to run correctly such as libraries and data files. Binder can install these prerequisites as part of its build process, if the git repository declares them in a supported manner."
