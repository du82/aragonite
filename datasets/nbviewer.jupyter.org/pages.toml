full_description = "Part of the introductory series to using Python for Vision Research brought to you by the GestaltReVision group (KU Leuven, Belgium). This notebook is meant as an introduction to Python's essential scientific packages: Numpy, PIL, Matplotlib, and SciPy. Depending on what kind of values you want to store, Python variables can be of different data types. For instance: One useful data type is the list, which stores an ordered, mutable sequence of any data type, even mixed Re-usable pieces of code can be put into functions. Many pre-defined functions are available in Python packages. Functions can have both required and optional input arguments. When the function has no output argument, it returns None. Every variable in Python is actually an object. Objects bundle member variables with tightly connected member functions that (typically) use these member variables. Lists are a good example of this. The member variables in this case just contain the information on the elements in the list. They are 'hidden' and not intended to be used directly - you manipulate the list through its member functions. The functions above are in-place methods, changing the original list directly, and returning None. This is not always the case. Some member functions, for instance in strings, do not modify the original object, but return a second, modified object instead. But it doesn't. / and ** are not defined for lists; nor does the mean() function exist. + and * are defined, but they mean something else. Do you remember what they do? Enter Numpy, and its ndarray data type, allowing these elementwise computations on ordered sequences, and implementing a host of mathematical functions operating on them. Lists are converted to Numpy arrays through calling the np.array() constructor function, which takes a list and creates a new array object filled with the list's values. Numpy is a very large package, that we can't possibly cover completely. But we will cover enough to get you started. The most basic characteristics of a Numpy array are its shape and the data type of its elements, or dtype. For those of you who have worked in MATLAB before, this should be familiar."
