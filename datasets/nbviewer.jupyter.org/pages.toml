full_description = "Part of the introductory series to using Python for Vision Research brought to you by the GestaltReVision group (KU Leuven, Belgium). In the first two parts you will learn the basics of Python just enough to build a real working experiment. The goal of the first two classes is to build a Change Blindness experiment. We will work with pairs of images that only differ on a tiny detail, for example, a green traffic light might turn into red in a typical street scene. We will continuously switch between both images until the participant observes a difference between the two. In addition, half of the image pairs will be presented upright, whereas half will be inverted. To make the changes more difficult to detect, we will have bubbles of various sizes superimposed on the images, which will be repositioned to new random locations upon each image switch. When the participant detects the change, she should hit spacebar. Otherwise, after 30 seconds the experiment advances to the next stimulus. At any time, the participant can press escape to quit the experiment. If this is not very clear, find the full code of the experiment in script_final.py in the Part2 directory, and try running it yourself first. Question: How would you go about creating this experiment? We understand you don't know how to program yet, but simply try to list all steps that such experiment should perform. The answer is below but you will benefit massively from trying to produce it yourself. We will need our program to hold and handle many pieces of information. For instance, the reaction time recorded on a trial, or the duration of the image presentation. These value representations are called literals, since you would literally put into your program which value you want to be there. More commonly however, values are implied in expressions, which evaluate (e-value-ate) to a value. For instance, '5+3' does not represent the number 8 literally, but if you work it out, it does evaluate to 8. Therefore, an expression is any piece of code which represents a value."
