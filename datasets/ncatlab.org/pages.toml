["http://ncatlab.org/nlab/show/subset+collection"]
title = "subset collection in nLab"
full_description = 'In set theory and the foundations of mathematics, the axiom of fullness is an axiom intermediate in strength between the existence of power sets and function sets. Of course, these can only be distinguished in constructive mathematics, since classically power sets and function sets are equivalent (at least if you have the set 2={⊤,⊥}\mathbf{2} = \{\top, \bot\}). The axiom of subset collection combines fullness with the axiom of collection to apply in the situations where fullness is used. In the presence (I think) of either collection or full separation, subset collection is equivalent to fullness. In its guise as fullness, the axiom states that, given any sets XX and YY, there is a set F X,YF_{X,Y} of enough entire relations from XX to YY in this sense: We have written this in a material fashion; structurally, the axiom says that F X,YF_{X,Y} parametrises enough entire relations in this sense: (we think of E X,YE_{X,Y} as giving the evaluation, as a truth value, of rr, as an entire relation, on the elements aa and bb). In the context of material set theory, the structural axiom is weaker than the material axiom, but they become equivalent in the presence of restricted replacement, which is quite weak. You can also write down an internal version of fullness by adding arbitrary additional parameters to the structural version above (analogously to the generalisation from power set to power object, although more complicated since F X,YF_{X,Y} is not given by a universal property). Given function sets, fullness is equivalent to the set theory having sets of inhabited subsets, since an entire relation between AA and BB is a function from AA to the set of inhabited subsets of BB. (Power sets on the other hand are sets of all subsets). I need to look this up again, including the conditions for its equivalence with fullness. In the meantime, see the Stanford Encyclopedia’s list of axioms. In dependent type theory, given a Russell universe UU, the type of all entire relations between types A:UA:U and B:UB:U is given by the type'
