["http://ncatlab.org/nlab/show/axiom+of+multiple+choice"]
title = "axiom of multiple choice in nLab"
full_description = '''This article is about an axiom of constructive mathematics. Some set theory literature instead uses this name for an unrelated weakening of AC. For that notion, see (classical) axiom of multiple choice. The axiom of multiple choice (AMC) is a weaker version of the axiom of choice, which can hold in constructive mathematics. A set-indexed family {D c} c∈C\{D_c\}_{c\in C} of sets is said to be a collection family if for any c∈Cc\in C and any surjection E↠D cE\twoheadrightarrow D_c, there exists a c′∈Cc'\in C and a surjection D c′↠D cD_{c'}\twoheadrightarrow D_c which factors through EE. for every set XX, there exists a collection family {D c} c∈C\{D_c\}_{c\in C} such that X≅D cX\cong D_c for some cc (Michael Rathjen‘s formulation, attributed to Peter Aczel and Alex Simpson), or for every set XX, there exists a collection family {D c} c∈C\{D_c\}_{c\in C}, with CC inhabited, and a family of surjections {D c→X} c∈C\{D_c \to X\}_{c\in C} (the formulation originally given by Ieke Moerdijk and Erik Palmgren), or for every set XX, the full subcategory (Set/X) surj(Set/X)_{surj} of the slice category Set/XSet/X consisting of the surjections has a weakly initial set (in Benno van den Berg‘s formulation; this is also called WISC). The third is a weaker condition, and while some may refer to as a “weak axiom of multiple choice”, van den Berg obviously does not; he calls his the AMC and the Moerdijk-Palmgren formulation rather the “strong axiom of multiple choice”. Note that PP is a projective set if and only if the singleton family {P}\{P\} is a collection family. Therefore, since AC is equivalent to “all sets are projective,” it implies AMC. The Reflection Principle? (RP) is equivalent to AMC (the one called strong AMC by van den Berg). RP is motivated by the regular extension axiom (REA) from constructive set theory. RP states that every map belongs to a representable class of small maps. Rathjen proves that SVC also implies AMC. It follows that AMC holds in “most” models of set theory.'''
