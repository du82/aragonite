["https://ncatlab.org/nlab/show/Hamiltonian+mechanics"]
title = "Hamiltonian mechanics in nLab"
full_description = 'Hamiltonian mechanics is a formulation of mechanics in which the basic datum in a mechanical system is a function HH, the Hamiltonian of the system, which gives the total energy in the system in terms of the positions and momenta of the objects in the system. More abstractly, the Hamiltonian is a function on phase space, a manifold whose coordinates are generalised? positions q iq^i and momenta p ip_i. (Compare this to Lagrangian mechanics, in which the Lagrangian is a function on state space?, whose coordinates are generalised positions and velocities.) So to do Hamiltonian mechanics properly, you must ‘mind your pps and qqs’ (blame John Baez for this pun). To begin with, we often take phase space to be the cotangent bundle of configuration space. (Compare that state space is the tangent bundle of configuration space.) This comes equipped with a natural 22-form or simply ω=dp i∧dq i\omega = \mathrm{d}p_i \wedge \mathrm{d}q^i using the Einstein summation convention. This 22-form is closed, in fact exact, since it is the differential of the action form d¯S=p i∧dq i\bar{\mathrm{d}}S = p_i \wedge \mathrm{d}q^i, and therefore it is a symplectic form. However, it is also possible to take phase space to be any symplectic manifold, or even any Poisson manifold. In any case, phase space itself gives only the kinematics (in a momentum-based rather than velocity-based sense); you need the Hamiltonian HH to get the dynamics. Hamiltonian mechanics was developed originally for classical mechanics, but it is also the best known formulation of quantum mechanics; many students of physics (and even more so, students of chemistry) learn it only when they study the latter. This sometimes leads to confusion about the essential differences between classical and quantum physics. Hamiltonian mechanics is best formalized in terms of symplectic geometry as described for instance in the monograoph The dynamics is encoded by declaring that those trajectories γ:ℝ→X\gamma : \mathbb{R} \to X are the physically realized trajectories that satisfy the equation'
