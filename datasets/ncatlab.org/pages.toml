["https://ncatlab.org/nlab/show/Kalb-Ramond+field"]
title = "Kalb-Ramond field in nLab"
full_description = 'The Kalb-Ramond field or B-field is the higher U(1)-gauge field that generalizes the electromagnetic field from point particles to strings. Its dual incarnation in KK-compactifications of heterotic string theory to 4d is a candidate for the hypothetical axion field (Svrcek-Witten 06, p. 15). Recall that the electromagnetic field is modeled as a cocycle in degree 2 ordinary differential cohomology and that this mathematical model is fixed by the fact that charged particles that trace out 1-dimensional trajectories couple to the electromagnetic field by an action functional that sends each trajectory to the holonomy of a U(1)U(1)-connection on it. When replacing particles with 1-dimensional trajectories by strings with 2-dimensional trajectories, one accordingly expects that they may couple to a higher degree background field given by a degree 3 ordinary differential cohomology cocycle. In string theory this situation arises and the corresponding background field appears, where it is called the Kalb-Ramond field . Often it is also simply called the BB-field , after the standard symbol used for the 2-forms (B i∈Ω 2(U i))(B_i \in \Omega^2(U_i)) on patches U iU_i of a cover of spacetime when the differential cocycle is expressed in a Cech cohomology realization of Deligne cohomology. This is the analog of the local 1-forms (A i∈Ω 1(U i))(A_i \in \Omega^1(U_i)) in a Cech cocycle presentation of a line bundle with connection encoding the electromagnetic field. The field strength of the Kalb-Ramond field is a 3-form H∈ΩH \in \Omega. On each patch U iU_i it is given by And just as a degree 2 Deligne cocycle is equivalently encoded in a U(1)U(1)-principal bundle with connection, the degree 3 differential cocycle is equivalently encoded in The study of bundle gerbes was largely motivated and driven by the desire to understand the Kalb-Ramond field. The derivation of the fact that the Kalb-Ramond field that is locally given by a 2-form is globally really a degree 3 cocycle in the Deligne cohomology model for ordinary differential cohomology proceeds in in entire analogy with the corresponding discussion of the electromagnetic field:'
