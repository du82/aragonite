["https://ncatlab.org/nlab/show/6d+%282%2C0%29-supersymmetric+QFT"]
title = "D=6 N=(2,0) SCFT in nLab"
full_description = 'According to the classification of superconformal symmetry, there should exist superconformal field theories in 6 dimensions… …with (2,0)(2,0)-supersymmetry, that contain a self-dual higher gauge theory whose field configurations are connections on a 2-bundle (a circle 2-bundle with connection in the abelian case). This was derived by Claus, Kallosh & van Proeyen 1997, in the abelian case and to low order, as the small fluctuations of the Green-Schwarz sigma-model of the M5-brane around the embedding in the asymptotic boundary of the AdS-spacetime that is the near-horizon geometry of the black M5-brane. In accord with this the AdS7-CFT6 correspondence predicts that the nonabelian 6d theory is the corresponding theory for NN coincident M5-branes. In the non-abelian case it is expected (Witten 07) that the compactification of such theories are at the heart of the phenomenon that leads to S-duality in super Yang-Mills theory and further to geometric Langlands duality (Witten 09). Due to the self-duality a characterization of these theories by an action functional is subtle. Therefore more direct descriptions are still under investigation (for instance SSW11). Review includes (Moore11, Moore 12). For geometric engineering of the 6d (2,0)-superconformal QFT, see at duality between M-theory on Z2-orbifolds and type IIB string theory on K3-fibrations – Geometric engineering of 6d (2,0)-SCFT. Under AdS7/CFT6 the 6d (2,0)(2,0)-superconformal QFT is supposed to be dual to M-theory on anti de Sitter spacetime AdS 7×S 4AdS_7 \times S^4. The 5d (2,0)(2,0)-SCFT has tensionless 1-brane configurations. From the point of view of the ambient 11-dimensional supergravity these are the boundaries of M2-branes ending on the M5-branes. (GGT) The compactification of the 5-brane on a Riemann surface yields as worldvolume theory N=2 D=4 super Yang-Mills theory. See at N=2 D=4 SYM – Construction by compactification of 5-branes. The AGT correspondence relates the partition function of SU(2) n+3g−3SU(2)^{n+3g-3}-N=2 D=4 super Yang-Mills theory obtained by compactifying the 6d6d M5-brane theory on a Riemann surface C g,nC_{g,n} of genus gg with nn punctures to 2d Liouville theory on C g,nC_{g,n}.'
