["http://ncatlab.org/nlab/show/n-types+cover"]
title = "n-types cover in nLab"
full_description = 'The property that nn-types cover is a property of a higher category, or an axiom in its corresponding internal logic, which says roughly that every object is covered by one that is truncated at some level. A higher category is said to satisfy the (external) property that nn-types cover, or to have enough nn-types, if for every object XX there exists an nn-truncated object YY and an effective epimorphism Y→XY\to X. When n=0n=0 one also says that sets cover or that there are enough sets. Usually the category in question is some sort of topos or higher topos, or at least a pretopos of an appropriate sort. In this case, the property that nn-types cover means that the subcategory of nn-truncated objects is “generating” in an appropriate sense. When n=−1n=-1, however, having enough nn-types in this sense is not really a useful notion, because (−1)(-1)-truncated objects (subterminal objects) are not closed under coproducts. In this case a better condition is that all maps out of subterminal objects are jointly effective epimorphic. If n>0n\gt 0, then any n-localic (∞,1)-topos has enough (n−1)(n-1)-types, since every object is surjected onto by a coproduct of representables which are nn-truncated. The converse seems plausible as well. A specific example of a higher topos in which sets do not cover is the slice (∞,1)-topos ∞Gpd/B 2ℤ\infty Gpd / \mathbf{B}^2 \mathbb{Z} of ∞Grpd over the double delooping of the group of integers, which is equivalently the topos of ∞-actions of the ∞-group (2-group) Bℤ\mathbf{B} \mathbb{Z}. From this second perspective, a 1-truncated object of this topos is a groupoid (1-groupoid) together with an automorphism of its identity functor, i.e. an element of its center, and a morphism of such is a functor that respects these central elements. Such an object is 0-truncated if it is essentially discrete, in which case its center is also trivial; thus the 0-truncated objects are just ordinary sets. However, since functors must respect the central elements, there can be no surjective map from a 0-truncated object to a 1-truncated one whose chosen central element is nontrivial.'
year_published = 2025
