["http://ncatlab.org/nlab/show/axiom+of+replacement"]
title = "axiom of replacement in nLab"
full_description = 'Zwei äquivalente Vielheiten sind entweder beide ‘Mengen’ oder beide inkonsistent. Georg Cantor (1899)1 Axioms of collection and replacement are axiom schemata in set theory that permit to construct new sets from other already given sets, thereby contributing substantially to the size of the set-theoretic universe, and hence are seen as ‘strong’ foundational axioms. The most famous of these axiom schemata is the axiom of replacement2 of Zermelo-Fraenkel set theory that was suggested by A. Fraenkel and formulated by T. Skolem in 1922. Given a unary operation FF and a set xx it permits to collect all F(y)F(y) for y∈xy\in x into a new set. The resulting expansiveness of the set-theoretic universe is somewhat peripheral to the practice of ‘ordinary’ mathematics and therefore a structural set theory like ETCS can omit replacement without incurring a great loss3. Even in the context of a ZF-equivalent material set theory the axiom of replacement can be traded in for a reflection principle4. Axioms of replacement and collection become useful, however, whenever recursively constructing a set that is ‘larger’ than any set known before: what the axiom of replacement is mainly needed for in mathematical practice is to define families of sets indexed by some set II carrying some inductive structure as, typically, the set NN of natural numbers.5 In general, these axioms apply to a binary relation that relates elements of one set AA to arbitrary sets. However, we do not expect that the relation itself be an object in the theory; really, we have an axiom schema with one axiom for every binary predicate of the proper form. We will write this predicate as ϕ(x,Y)\phi(x,Y), where xx stands for an elment of AA and YY stands for any set. (Note that there may well be other free variables in the predicate.) Generally, ϕ\phi will need to be an entire relation for the axiom to apply; that is, the axiom has as a hypothesis that, for every x∈Ax \in A, there is some YY such that ϕ(x,Y)\phi(x,Y) holds. In versions called ‘replacement’ instead of ‘collection’, ϕ\phi also needs to be functional; that is, the axiom has the hypothesis that, for every x∈Ax \in A, there is a unique YY such that ϕ(x,Y)\phi(x,Y) holds. Thus, most of the ‘replacement’ versions only make sense if the language has a notion of equality of sets.'
year_published = 2025
