["http://ncatlab.org/nlab/show/WISC"]
title = "WISC in nLab"
full_description = 'The assumption that every set has a Weakly Initial Set of Covers, or WISCWISC, is a weak form of the axiom of choice. Like the axiom of multiple choice and the axiom of small violations of choice (which both imply it), it says intuitively that “ACAC fails to hold only in a small way” (i.e. not in a proper-class way). Precisely, WISCWISC is the statement that for any set XX, the full subcategory (Set/X) surj(Set/X)_{surj} of the slice category Set/XSet/X consisting of the surjections has a weakly initial set. In other words, there is a family of surjections {f i:P i↠X} i∈I\{f_i\colon P_i \twoheadrightarrow X\}_{i\in I} such that for any surjection Q↠XQ\twoheadrightarrow X, there exists some f if_i which factors through QQ. WISC is implied by COSHEP, since any surjection P↠XP\twoheadrightarrow X such that PP is projective is necessarily a weakly initial (singleton) set in (Set/X) surj(Set/X)_{surj}. WISC is also implied by the axiom of multiple choice (which is in turn implied by COSHEP). For if XX is in some collection family {D c} c∈C\{D_c\}_{c\in C}, then the family of all surjections of the form D c↠XD_c \twoheadrightarrow X is weakly initial in (Set/X) surj(Set/X)_{surj}. WISC also follows from the assertion that the free exact completion of SetSet is well-powered, which in turn follows from assertion that SetSet has a generic proof (so that Set ex/lexSet_{ex/lex} is a topos). Both of these can also be regarded as saying that choice is only violated “in a small way.” WISC implies that the category of anafunctors between any two small categories is essentially small; see here, or below. WISC implies (in ZF) that there exist arbitrarily large regular cardinals. Therefore, WISC is not provable in ZF, as Moti Gitik constructed a model of ZF with only one regular cardinal, using large cardinal assumptions. A proof without large cardinals was given in (Karagila). WISC implies the local essential smallness of Cat anaCat_ana, the bicategory of categories and anafunctors.'
