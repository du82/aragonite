["http://ncatlab.org/nlab/show/axiom+of+extensionality"]
title = "axiom of extensionality in nLab"
full_description = 'In material set theory, the axiom of extensionality says that the global membership relation ∈\in is an extensional relation on the class of all pure sets. Since any relation becomes extensional on its extensional quotient, one can interpret this axiom as a definition of equality. However, because the extensional quotient map need not reflect the relation, there is still content to the axiom: if two sets would be identified in the extensional quotient, then they must be members of the same sets and have the same sets as members. If one models pure sets in structural set theory, then this property may be made to hold by construction. In any unsorted set theory, the axiom of weak extensionality states that given a set AA and a set BB, A=BA = B if and only if for all CC, C∈AC \in A if and only if C∈BC \in B. The axiom of weak extensionality is a foundational axiom in most material set theories, such as Zermelo set theory and Mac Lane set theory, both which do not have the axiom of foundation, as well as ZFC which does have the axiom of foundation. In fully formal ETCS, where the basic objects of the theory are functions, 00 represents both the empty set and the identity function on the empty set, and 11 represents the singleton, the identity function of the singleton, and the sole element of the singleton all at the same time, there are three possible notions of sets: as identity functions set(a)≔dom(a)=a\mathrm{set}(a) \coloneqq \mathrm{dom}(a) = a or set(a)≔codom(a)=a\mathrm{set}(a) \coloneqq \mathrm{codom}(a) = a as functions into the singleton set(a)≔(codom(a)=1)\mathrm{set}(a) \coloneqq (\mathrm{codom}(a) = 1) The elements are functions with domain 11, element(a)≔(dom(a)=1)\mathrm{element}(a) \coloneqq (\mathrm{dom}(a) = 1) When sets are defined as functions into the singleton, the membership relation a∈ba \in b is defined by the function aa being an element, the function bb being a set, and the codomain of aa being bb Weak extensionality is a theorem in this case. By the universal property of the singleton, any two sets AA and BB with the same domain are equal to each other, which means that any proposition PP between AA and BB implies that A=BA = B, and thus that ∀C.(C∈A)⇔(C∈B)\forall C.(C \in A) \iff (C \in B) implies that A=BA = B. The converse follows from indiscernibility of identicals.'
