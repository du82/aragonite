["http://ncatlab.org/nlab/show/Vop%C4%9Bnka%27s+principle"]
title = "Vopěnka's principle in nLab"
full_description = 'Vopěnka’s principle is a large cardinal axiom which implies a good deal of simplification in the theory of locally presentable categories. It is fairly strong as large cardinal axioms go: Its consistency follows from the existence of huge cardinal?s, and it implies the existence of arbitrarily large measurable cardinals. For every proper class sequence ⟨M α|α∈Ord⟩\langle M_\alpha | \alpha \in Ord\rangle of first-order structures, there is a pair of ordinals α<β\alpha\lt\beta for which M αM_\alpha embeds elementarily into M βM_\beta. For CC a locally presentable category, every full subcategory D↪CD \hookrightarrow C which is closed under colimits is a coreflective subcategory. Every cofibrantly generated model category (in a slightly more general sense than usual) is a combinatorial model category. If one insists on the traditional stricter definition of cofibrant generated model category, then the VP still implies that these are all combinatorial. But the VP is slightly stronger than this statement. For CC a locally presentable category, every full subcategory D↪CD \hookrightarrow C which is closed under limits is a reflective subcategory. Vopěnka’s principle can be relativized to levels of the Lévy hierarchy by restricting the complexity of the (definable) classes to which it is applied. The following theorems are from (BCMR). From a category-theoretic perspective, Vopěnka’s principle can be motivated by applications and consequences, but it can also be argued for somewhat a priori, on the basis that large discrete categories are rather pathological objects. We can’t avoid them entirely (at least, not without restricting the rest of mathematics fairly severely), but maybe at least we can prevent them from occurring in some nice situations, such as full subcategories of locally presentable categories. See this MO answer. Let CC be a left proper combinatorial model category and Z∈Mor(C)Z \in Mor(C) a class of morphisms. Then the left Bousfield localization L ZWL_Z W exists.'
