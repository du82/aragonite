["https://ncatlab.org/nlab/edit/HomePage"]
title = "Editing HomePage in nLab"
full_description = '''+-- {: .rightHandSide} +-- {: .toc .clickDown tabindex="0"} ### Contents {: .clickToReveal} ### Contents {: .clickToHide tabindex="0"} +-- {: .hide} [[!include contents]] =-- +-- {: .hide} [[!include mathematicscontents]] =-- +-- {: .hide} [[!include physicscontents]] =-- =-- =-- +-- {: .query} $\,$ <div align="center" > <em>Search the nLab ([[Searching the nLab|hints]])</em> <form name="gsearch" method="get" action="https://www.google.com/search"><input type="text" size="30" name="as_q"/><input type="hidden" name="as_sitesearch" value="https://ncatlab.org/nlab/"/></form> </div> $\,$ =-- [[About|This]] is a [wiki](http://en.wikipedia.org/wiki/Wiki) for collaborative work on _[[Mathematics]]_, _[[Physics]]_, and _[[Philosophy]]_ --- especially (but far from exclusively) from the [[higher structures]] [[n-point of view|point of view]]: with a sympathy towards the tools and perspectives of [[homotopy theory]]/[[algebraic topology]], [[homotopy type theory|homotopy]] [[type theory]], [[higher category theory|higher]] [[category theory]] and [[higher algebra|higher]] [[categorical algebra]]. \tableofcontents ## Purpose {#purpose} The nLab records and explores a wide range of mathematics, physics, and philosophy. Along with work of an expository nature, original material can be found in abundance, as can notes from evolving research. Where mathematics, physics, and philosophy arise in other fields, computer science and linguistics for example, the nLab explores these too. If you take a little time to find something in the literature, or to work through a proof or example, or to find an intuitive or new way to think about something, add a note on it to the nLab! Others will benefit, and you may well find that it proves useful to you too. A fundamental idea behind the nLab is that the linking between pages of a wiki is a profound way to record knowledge, placing it in a rich context. For more, see also [[Urs Schreiber]]’s thoughts at [[schreiber:What is... the nLab|What is... the nLab?]]. ## nForum, discussion, comments, and questions {#Discussion} Most nLab pages have a corresponding discussion thread at the [nForum](https://nforum.ncatlab.org), linked to in the menus at the top and bottom of the page. For all but the most trivial edits (correcting spelling or punctuation, etc), we ask that you announce your changes at the nForum using the box at the bottom of the edit page. Typically this would be a short note summarising what you have done, but it can also include what you plan to do, or what you would like others to do! See [[nlabmeta:Welcome to the nForum]] for more on the nForum. If you have any questions about an nLab page, or would like to discuss or make a comment upon something in it, whether because you feel that something is wrong or missing or for any other reason, you are encouraged and very welcome to use the nForum discussion thread for the page for this purpose too. If the discussion thread does not yet exist, feel free to create it manually: use the 'nLab - Latest changes' category, and give it the same title (case-sensitive!) as the nLab page. The pages of the nLab have almost always been edited by several people. In almost all cases, we recommend that you use the nForum rather than contact an author of an edit directly, but if you do have a reason to do this, the history of edits to the page with the details of who made them can be found by clicking on 'History' at the bottom of the page. ## Contributing to the $n$Lab {#Contributing} If after looking around for a while you feel like contributing yourself, you are very welcome to do so! See [below](#SoftwareRequirements) for more on how to actually edit, as well as the [[HowTo]]. If you make any edits to the nLab, please follow the guidelines for announcing your changes at the [nForum](https://nforum.ncatlab.org) given [above](#Discussion). If you are unsure whether what you would like to contribute is appropriate, please ask at the nForum before making the edit. ## Viewing and editing the $n$Lab {#SoftwareRequirements} The nLab should be viewable and editable in any modern web browser on any device. For technical reasons, browsers which are able to render [MathML](http://en.wikipedia.org/wiki/MathML), such as Firefox, may render very large pages quicker than other browsers, but these pages are few and far between, and most people will be able to use the browser of their choice. The following custom themes are available for the nLab: * Dark theme by BinaryQuantumSoul: <https://userstyles.world/style/19674/nlab-full-redesign> * Dark theme by Paolo Perrone: <https://userstyles.world/style/15519/nlab-dark> Editing the nLab these days can be done more or less as in LaTeX. Macros are not currently available, but mathematics can be entered within dollar signs as usual, [theorem environments](https://ncatlab.org/nlab/show/HowTo#DefinitionTheoremProofEnvironments), sections and tables of contents can be defined as in LaTeX, [commutative diagrams](https://ncatlab.org/nlab/show/HowTo#diagrams) and figures can be created in Tikz or XyMatrix, and so on. For simple formatting, such as italics, and for some other things such as tables, [Markdown](https://en.wikipedia.org/wiki/Markdown) is used. See the [[HowTo]] for more on editing the nLab. ## Making use of material from the $n$Lab {#TermsOfUse} One goal of the $n$Lab is to help make information widely available and usefully related to other information. In this users and contributors are expected to follow traditional academic practice: * Using and distributing content obtained from the $n$Lab is free and encouraged if you acknowledge the source, as usual in academia. (There is currently no consensus on a more formal license statement, but if it matters check if relevant individual contributors state such on their $n$Lab homepages.) If you cite a page you may want to point to a specific version of it, because $n$Lab pages can change. You can find a list of all the versions of a page by clicking on the **History** link at the bottom of the page itself. * Conversely, any content contributed to the $n$Lab is publicly available and you should be aware that others may use your contributions (whatever you decide to do with their content elsewhere) and indeed may edit them. In the first case you trust that users will cite your contributions properly, in the second that they will respect and only improve on them. At the same time, you are expected to properly acknowledge sources of information for material entered into the $n$Lab. Usually this works well. If there is need for discussion, the [nForum](http://nforum.ncatlab.org) is the forum to turn to. If serious problems arise, the [steering committee](#SteeringCommitte) might intervene. ## Installation {#Installation} The domain `ncatlab.org` is owned by [[Urs Schreiber]]. The $n$Lab server is currently hosted at Carnegie Mellon University, kindly provided by [[Steve Awodey]]. The nLab's software and technical administrative matters are in the hands of the nLab's [[nLab meta:technical board]]. Much of the software behind the nLab has been written especially for the nLab: the latest source can be found at [GitHub](https://github.com/ncatlab/nlab). It was originally an instance of [Instiki](https://golem.ph.utexas.edu/wiki/instiki/show/HomePage). The $n$Lab page style is due to [[Jake Bian]], originating with his [Kan browser extension](https://github.com/jakebian/kan) The $n$Lab logo is due to [[David Roberts]], inspired by Matisse's painting _[La Gerbe](https://collections.lacma.org/node/207557)_. Besides being an inside reference to [[schreiber:Higher Structures|higher structures]] known as _[[gerbes]]_, the logo represents maybe [[computational trinitarianism]] or the [[Science of Logic|progression of modalities]] or generally the unity of diverse mathematical phenomena revealed by the [[nPOV]]. \linebreak ## Contact {#Contact} The default venue for all communication regarding the nLab is the [nForum](https://nforum.ncatlab.org/). When posting there you get to choose a "category"-label for your message: * Latest edit logs are to be posted under *[Latest changes](https://nforum.ncatlab.org/5/)*. * Organizational matters (such as concerning user accounts) are best posted under *[nLab Organisation](https://nforum.ncatlab.org/14/)*. * Technical bug reports or software feature requests are best raised in *[nLab Technical Matters](https://nforum.ncatlab.org/21/)* or directly on [github.com/ncatlab/nlab/issues](https://github.com/ncatlab/nlab/issues). Please do not try to contact the technical team on matters that are not purely technical: Policy decisions are made by the active nLab community or, if all fails, by the [Steering Committee](#SteeringCommitte). \linebreak ## Steering Committee {#SteeringCommitte} The $n$Lab is a community undertaking. But for all matters that do require that the $n$Lab is represented to the outside by an official decision-taking body, we have the [[nlabmeta:steering committee|steering committee]]. _Nobody "is in charge of the $n$Lab"._ But the steering committee is the closest approximation to a body being in charge that we have. category: meta [[!redirects HomePage]] [[!redirects Home Page]] [[!redirects Homepage]] [[!redirects Home page]] [[!redirects homepage]] [[!redirects home page]] [[!redirects nLab]]'''
