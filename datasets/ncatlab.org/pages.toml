["https://ncatlab.org/nlab/show/AQFT"]
title = "AQFT in nLab"
full_description = "Algebraic Quantum Field Theory or Axiomatic Quantum Field Theory or AQFT for short is a formalization of quantum field theory (and specifically full, hence non-perturbative quantum field theory) that axiomatizes the assignment of algebras of observables to patches of parameter space (spacetime, worldvolume) that one expects a quantum field theory to provide. As such, the approach of AQFT is roughly dual to that of FQFT, where instead spaces of states are assigned to boundaries of cobordisms and propagation maps between state spaces to cobordisms themselves. One may roughly think of AQFT as being a formalization of what in basic quantum mechanics textbooks is called the Heisenberg picture of quantum mechanics. On the other hand FQFT axiomatizes the Schrödinger picture . The axioms of traditional AQFT encode the properties of a local net of observables and are called the Haag-Kastler axioms. They are one of the oldest systems of axioms that seriously attempt to put quantum field theory on a solid conceptual footing. From the nPOV we may think of a local net as a co-flabby copresheaf of algebras on spacetime which satisfies a certain locality axiom with respect to the Lorentzian structure of spacetime: This is traditionally formulated (implicitly) as a structure in ordinary category theory. More recently, with the proof of the cobordism hypothesis and the corresponding (∞,n)-category-formulation of FQFT also higher categorical versions of systems of local algebras of observables are being put forward and studied. Three structures are curently being studied, that are all conceptually very similar and similar to the Haag-Kastler axioms: Initially, all three of these encoded what in physics are called Euclidean quantum field theories, whereas only the notion of local net incorporated the fact that the underlying spacetime of a quantum field theory is a smooth Lorentzian space. Recent developments in the formalism of factorization algebras have extended their theory to globally hyperbolic Lorentzian manifolds."
year_published = 2025
clearnet = "https://ncatlab.org/nlab/show/AQFT"
