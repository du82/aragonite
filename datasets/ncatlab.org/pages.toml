["https://ncatlab.org/nlab/show/FAQ"]
title = "FAQ in nLab"
full_description = 'The characters < and > are interpreted as beginning or ending HTML tags. To make a less-than or greater-than sign in iTeX math mode, use \lt and \gt respectively. For example, $0\lt 1$ produces 0<10\lt 1. By default, the itex syntax $...$ is disabled inside raw HTML. However, you can re-enable it by giving the HTML parameter markdown="1". Thus At least for tables, you can also use the PHP Markdown Extra syntax inside which $...$ works without a problem. One of the notable ways in which itex differs from latex is that in itex’s math mode, a string of letters without spaces in between is interpreted as a single identifier. This has the advantage that you can invent new identifiers without needing to use \operatorname or \DeclareMathOperator, but it means that when you don’t want a string of letters interpreted that way you need to put spaces in between. For example, $sin(x)$ produces sin(x)sin(x) which is probably what you want, but $h=gf$ produces h=gfh=gf, whereas you probably wanted to write $h=g f$ to get h=gfh=g f. On the other hand, you can (and, for the sake of the LaTeX output, probably should) use $\sin(x)$, etc. There are several bugs (or “edge cases”) in the handling of lists by Maruku (the formatting filter used by Instiki). These include: iTeX is not LaTeX. iTeX is a pure converter whereas LaTeX is a mixture of a converter and renderer (technically, latex is the rules for converting the input into pure TeX which is then rendered by tex, but since the conversion is also handled by tex, it can cheat and use information about the rendered output to reinterpret the input). Therefore getting the two to do exactly the same is never going to happen. On the other hand, the aim is to keep iTeX as close as possible to standard LaTeX whilst keeping in mind that iTeX produces MathML. Their similarity can make the differences all the more jarring. Here is a list of the differences that we know about together with suggested work-arounds. Numbers are one thing. The syntax $10^10$ produces 10 1010^10 in iTeX but 10 1010^{1}0 in LaTeX. The safe syntax is to always use braces: $10^{10}$ is consistent.'
year_published = 2025
