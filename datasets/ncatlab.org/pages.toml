["https://ncatlab.org/nlab/show/D%27Auria-Fre+formulation+of+supergravity"]
title = "D'Auria-Fré-Regge formulation of supergravity in nLab"
full_description = "The D’Auria-Fré-Regge formalism (due to Ne’eman & Regge 1978; D’Auria, Fré & Regge 1979, 80a, 80b, extensively developed by Castellani, D’Auria & Fré 1991) is a natural formulation of supergravity on “superspace” (with some hindsight: in higher super Cartan geometry) in general dimensions, including besides D=4 supergravity also type II supergravity and heterotic supergravity in dimension 10 as well as notably 11-dimensional supergravity. This proceeds in generalization of how Einstein gravity in first order formulation of gravity is equivalently the Cartan geometry for the inclusion of the Lorentz group inside the Poincare group: a field configuration of the field of gravity is equivalently a Cartan connection for this subgroup inclusion. Accordingly, low dimensional supergravity without extended supersymmetry is equivalently the super-Cartan geometry of the inclusion of the spin group into the super Poincaré group. What D’Auria-Fré implicitly observe (not in this homotopy theoretic language though, that was developed in Sati, Schreiber & Stasheff 09; Fiorenza, Schreiber & Stasheff 10, 13) is that for higher supergravity with extended supersymmetry such as 11-dimensional supergravity with its M-theory super Lie algebra symmetry, the description of the fields is in the higher differential geometry version of Cartan geometry, namely higher Cartan geometry, where the super Poincare Lie algebra is replaced by one of its exceptional super Lie n-algebra extensions (those that also control the brane scan), such as notably the supergravity Lie 3-algebra and the supergravity Lie 6-algebra. This is the refinement of super-Cartan geometry to higher Cartan geometry. This higher super Cartan geometry-description of supergravity is what D’Auria-Fré called the geometric approach to supergravity or geometric supergravity (e.g. D’Auria 20). Around 1981 D’Auria and Fré noticed, in GeSuGra, that the intricacies of various supergravity classical field theories have a strikingly powerful reformulation in terms of super semifree differential graded-commutative algebras."
