["https://ncatlab.org/nlab/show/Gleason%27s+theorem"]
title = "Gleason's theorem in nLab"
full_description = 'The classical Gleason theorem says that a state on the C*-algebra ℬ(ℋ)\mathcal{B}(\mathcal{H}) of all bounded operators on a Hilbert space is uniquely described by the values it takes on the orthogonal projections 𝒫\mathcal{P}, if the dimension of the Hilbert space ℋ\mathcal{H} is not 2. It is possible to extend the theorem to certain types of von Neumann algebras (e.g. obviously factors of type I 2I_2 have to be excluded). Gleason’s theorem is also valid for real and quaternionic Hilbert spaces as proved by Varadarajan in 1968. A gap of that proof has been fixed in 2018 by V.Moretti and M.Oppio. Roughly, Gleason’s theorem says that “a quantum state is completely determined by only knowing the answers to all of the possible yes/no questions”. Let ρ:𝒫→[0,1]\rho: \mathcal{P} \to [0, 1] such that for every finite family {P 1,...,P n:P i∈𝒫}\{ P_1, ..., P_n: P_i \in \mathcal{P} \} of pairwise orthogonal projections we have ρ(∑ i=1 nP i)=∑ i=1 nρ(P i)\rho(\sum_{i=1}^n P_i) = \sum_{i=1}^n \rho(P_i) , then ρ\rho is a finitely additive measure on 𝒫\mathcal{P}. If dim(ℋ)≠2dim(\mathcal{H}) \neq 2 then each finitely additive measure on 𝒫\mathcal{P} can be uniquely extended to a state on ℬ(ℋ)\mathcal{B}(\mathcal{H}). Conversly the restriction of every state to 𝒫\mathcal{P} is a finitley additive measure on 𝒫\mathcal{P}. The same holds for sigma-finite measures and normal states: Every sigma-finite measure can be extended to a normal state and every normal state restricts to a sigma-finite measure. In quantum information theory, one often considers positive operator-valued measures (POVMs) instead of Hermitian operators as observables. While a Hermitian operator is given by a family of projection operators P iP_i such that ∑ iP i=1\sum_i P_i = 1, a POVM is given more generally by any family of positive-semidefinite operators E iE_i such that ∑ iE i=1\sum_i E_i = 1. In the analog of Gleason’s Theorem for POVMs, therefore, we start with ρ:ℰ→[0,1]\rho\colon \mathcal{E} \to [0,1], where ℰ\mathcal{E} is the space of all positive-semidefinite operators. Then if ∑ iρ(E i)=1\sum_i \rho(E_i) = 1 whenever ρ(∑ iE i)=1\rho(\sum_i E_i) = 1, the theorem states that ρ\rho has a unique extension to a mixed quantum state.'
year_published = 2025
clearnet = "https://ncatlab.org/nlab/show/Gleason%27s+theorem"
