["http://ncatlab.org/nlab/show/excluded+middle"]
title = "excluded middle in nLab"
full_description = 'In logic, the principle of excluded middle states that every truth value is either true or false (Aristotle, MP1011b24). (This is sometimes called the ‘axiom’ or ‘law’ of excluded middle, either to emphasise that it is or is not optional; ‘principle’ is a relatively neutral term.) One of the many meanings of classical logic is to emphasise that this principle holds in the logic; in contrast, it fails in intuitionistic logic. The principle of excluded middle (hereafter, PEM), as a statement about truth values themselves, is accepted by nearly all mathematicians (classical mathematics); those who doubt or deny it are a distinct minority, the constructivists. However, when one internalises mathematics in categories other than the category of sets, there is no doubt that excluded middle often fails internally. See the examples listed at internal logic. (Those categories in which excluded middle holds are called Boolean; in general, the adjective ‘Boolean’ is often used to indicate the applicability of PEM.) Although the term ‘excluded middle’ (sometimes even excluded third) suggests that the principle does not apply in many-valued logics, that is not the point; many-valued logics are many-valued externally but may still be two-valued internally. In the language of categorial logic, whether a category has exactly two subterminal objects is in general independent of whether it is Boolean; instead, the category is Boolean iff the statement that it has exactly two subterminal objects holds in its internal logic (which is in general independent of whether that statement is true). In fact, intuitionistic logic proves that there is no truth value that is neither true nor false; in this sense, the possibility of a ‘middle’ or ‘third’ truth value is still ‘excluded’. But since the relevant de Morgan law fails in intuitionistic logic, we may not conclude that every truth value is either true or false, which is the actual PEM. In material set theory, Shulman 18 makes the distinction between full classical logic, where the principle of excluded middle holds for all logical formulae in the material set theory, and Δ 0\Delta_0-classical logic, where the principle of excluded middle holds for only holds for Δ 0\Delta_0-formulae. Δ 0\Delta_0-formulae are logical formulae where every quantifier QQ has to be bounded by the membership relation; i.e. Qx∈y.P(x)≔Qx.x∈y∧P(x)Q x \in y.P(x) \coloneqq Q x.x \in y \wedge P(x). In structural set theory, the above difference between full classical logic and Δ 0\Delta_0-classical logic in material set theory is the difference between defining structural set theory as a well-pointed Boolean topos in classical logic and in intuitionistic logic respectively.'
