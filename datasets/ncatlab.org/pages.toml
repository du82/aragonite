["http://ncatlab.org/nlab/show/axiom+of+separation"]
title = "axiom of separation in nLab"
full_description = '''This is about the axiom of separation in set theory. For the axioms in topology also called “separation”, see separation axioms. computational trinitarianism = propositions as types +programs as proofs +relation type theory/category theory In set theory, the axiom scheme of separation aka specification states that, given any set XX and any property PP of the elements of XX, there is a set It is important to specify what language PP can be written in. This connects the axiom to logic and the foundations of mathematics. Arguably, first-order logic developed in order to explain the meaning of Ernst Zermelo's axiom of separation (although Zermelo himself disagreed with the interpretation that this gave). Separation is (usually) given as an axiom scheme because there is one axiom for each way to state a property in the language. (We also allow parameters in PP.) For bounded separation aka restricted separation aka Δ 0\Delta_0-separation, PP must be written in the language of first-order set theory and all quantifications must be guarded by a set: of the form ∀x∈A\forall x \in A or ∃x∈A\exists x \in A for some set AA. For limited separation aka Δ 0 𝒫\Delta_0^{\mathcal{P}}-separation, PP must be written in the language of first-order set theory and all quantifications must be guarded by a set or a power class: of the form ∀x∈A\forall x \in A, ∃B⊆A\exists B \subseteq A, etc. Limited separation trivially implies bounded separation, while bounded separation implies limited separation if power sets exist. For full separation aka simply separation, PP must be written in the language of first-order set theory, but otherwise anything goes; in a class theory, PP must be guarded by a class. Full separation trivially implies limited separation. For large separation, PP must be written in the language of first-order class theory; of course, this only makes sense in a class theory. The difference in strength between the class theories MKMK and NBGNBG is precisely that the former has large separation but the latter does not.'''
year_published = 2025
