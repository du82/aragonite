["https://ncatlab.org/nlab/show/%27t+Hooft+double+line+notation"]
title = "'t Hooft double line notation in nLab"
full_description = 'What is called ’t Hooft double line notation (following ’t Hooft 74) is the observation that for the fundamental representations VV of semisimple Lie algebras 𝔤\mathfrak{g}. the Lie algebra weight of a 𝔤\mathfrak{g}-Yang-Mills theory Feynman diagram with internal/virtual gluon lines is equivalent to one without any virtual gluon-lines, obtained by: 1) using the Jacobi identity to replace all internal gluon vertices by (linear combinations of) quark-gluon vertices 2) replacing any remaining internal gluon line together with the quark interaction vertices at its ends (equivalently: an M2-brane 3-algebra tensor) by (a linear combination of) double quark-lines, according to the following rules: For example, for 𝔤=𝔰𝔬(N)\mathfrak{g} = \mathfrak{so}(N) a special orthogonal Lie algebra, the ’t Hooft double line notation of a single trivalent vertex inside a single Wilson loop is the following: Attribution. In ’t Hooft 74 this is observed for the unitary Lie algebra 𝔤=𝔲(N)\mathfrak{g} = \mathfrak{u}(N) (see also Bar-Natan 95 (34), Chmutov-Duzhin-Mostovoy 11, p. 177, in which case only the first summand of the expressions above appears. The generalization to arbitrary semisimple Lie algebras is observed in Cvitanović 76, Fig. 14, reviewed for su(N), so(N) and sp(N) in Cvitanović 08 (9.57), (10.13) and (12.9) and for so(N) in Chmutov-Duzhin-Mostovoy 11, 6.2.6. For the case 𝔰𝔬(N)\mathfrak{so}(N) see also Bar-Natan 95, Section 6.3 (with an eye towards Vassiliev knot invariants) and Cicuta 82, Ita-Nieder-Oz 02, Figure 3, McGreevy-Swingle 08, Figure 10 (with more discussion of the large N limit). The case of gl(N) is considered in Bar-Natan 96, Section 2.2, Chmutov-Duzhin-Mostovoy 11, 6.2.5, and the case sl(N) in Chmutov-Duzhin-Mostovoy 11, 6.1.8, Jackson-Moffat 19, Section 14.4. Furthermore, one may regard the resulting double-line diagrams as a ribbon graph thickening of the original Feynman diagrams, and thus as surfaces with boundary and with markings on the boundary.'
