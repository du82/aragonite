["https://ncatlab.org/nlab/show/KLT+relations"]
title = "KLT relations in nLab"
full_description = "In perturbative quantum field theory the KLT relations (Kawai-Lewellen-Tye 86) express tree level scattering amplitudes in (super-)gravity equivalently as squares of scattering amplitudes in (super-)Yang-Mills theory. These relations are manifest in perturbative string theory-UV-completions of Einstein-Yang-Mills theory, where they were originally found and from which the QFT relations have been deduced: in string theory the graviton is an excitation of the closed string and the gluon of the open string. But cylinder-shaped worldvolume may be read in two different ways: either as a closed string propagator or as an open string vacuum diagram. This open/closed string duality of string scattering amplitudes yields the KLT relations. Moreover, a color-kinematics duality suggest that these relations extend from tree level to all loop order. Zvi Bern, Perturbative Quantum Gravity and its Relation to Gauge Theory, LivingRev.Rel.5:5,2002 (arXiv:gr-qc/0206071) N. E. J. Bjerrum-Bohr, K. Risager, String theory and the KLT-relations between gravity and gauge theory including external matter (arXiv:hep-th/0407085) Zvi Bern, John Joseph Carrasco, Lance Dixon, Henrik Johansson, Radu Roiban, Amplitudes and Ultraviolet Behavior of N=8N=8 Supergravity, Fortschr. Phys. 59 (2011) 7-8 [arXiv:1103.1848, doi:10.1002/prop.201100037] Dhritiman Nandan, Jan Plefka, Oliver Schlotterer, Congkao Wen, Einstein-Yang-Mills from pure Yang-Mills amplitudes (arXiv:1607.05701) Luiz Antonio Barreiro, Ricardo Medina, The origin of the KLT relations and nonlinear relations for Yang-Mills amplitudes (arxiv:1910.13519) Pierre Vanhove, Federico Zerbini, Building blocks of closed and open string amplitudes (arXiv:2007.08981) The extension of the KLT relation beyond tree level to “quantum gravity is Yang-Mills squared” (“double copy” approach) originates with David C. Dunbar, Paul S. Norridge, Calculation of Graviton Scattering Amplitudes using String-Based Methods, Nucl.Phys. B433 (1995) 181-208 (arXiv:hep-th/9408014)"
