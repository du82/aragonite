["https://ncatlab.org/nlab/show/GUT"]
title = "GUT in nLab"
full_description = 'The standard model of particle physics asserts that the fundamental quantum physical fields and particles are modeled as sections of and connections on a vector bundle that is associated to a GG-principal bundle, where the Lie group GG – called the gauge group – is the product of (special) unitary groups G=SU(3)×SU(2)×U(1)G = SU(3) \times SU(2) \times U(1) (or rather a quotient of this by the cyclic group Z/6Z/6, see there) and where the representation of GG used to form the associated vector bundle looks fairly ad hoc on first sight. A grand unified theory (“GUT” for short) in this context is an attempt to realize the standard model as sitting inside a conceptually simpler model, in particular one for which the gauge group is a bigger but simpler group G^\hat{G}, preferably a simple Lie group in the technical sense, which contains GG as a subgroup. Such a grand unified theory would be phenomenologically viable if a process of spontaneous symmetry breaking at some high energy scale – the “GUT scale” – would reduce the model back to the standard model of particle physics without adding spurious extra effects that would not be in agreement with existing observations in experiment. The terminology “grand unified” here refers to the fact that such a single simple group G^\hat{G} would unify the fundamental forces of electromagnetism, the weak nuclear force and the strong nuclear force in a way that generalizes the way in which the electroweak field already unifies the weak nuclear force and electromagnetism, and electromagnetism already unifies, as the word says, electricity and magnetism. Since no GUT model has been fully validated yet (but see for instance Fong-Meloni 14), GUTs are models “beyond the standard model”. Often quantum physics “beyond the standard model” is expected to also say something sensible about quantum gravity and hence unify not just the three gauge forces but also the fourth known fundamental force, which is gravity. Models that aim to do all of this would then “unify” the entire content of the standard model of particle physics plus the standard model of cosmology, hence “everything that is known about fundamental physics” to date. Therefore such theories are then sometimes called a theory of everything.'
year_published = 2025
