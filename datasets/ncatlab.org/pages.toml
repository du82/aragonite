["https://ncatlab.org/nlab/show/Dijkgraaf-Witten+theory"]
title = "Dijkgraaf-Witten theory in nLab"
full_description = 'Dijkgraaf-Witten theory in dimension nn is the topological sigma-model quantum field theory whose target space is the classifying space of a discrete group and whose background gauge field is a circle n-bundle with connection on BG\mathbf{B}G (necessarily flat) which is equivalently a cocycle in the group cohomology of GG with coefficients in the circle group. Viewed in a broader context and generalizing: Dijkgraaf-Witten theory is the ∞-Chern-Simons theory induced from a characteristic class c:BG→B nU(1)\mathbf{c} : \mathbf{B}G \to \mathbf{B}^n U(1) on a discrete ∞-groupoid BG:=DiscBG\mathbf{B}G := Disc B G. If GG here is an ordinary discrete group this is traditional Dijkgraaf-Witten theory, if GG is a discrete 2-group and the background field is a circle 4-bundle, then this is called the Yetter model. This are the first two steps in filtering of target spaces by homotopy type truncation of ∞-Chern-Simons theory with discrete target spaces. We may think of this as describing the quantum mechanics of an (n−1)(n-1)-brane with nn-dimensional worldvolume Σ\Sigma propagating on BGB G and being charged under a higher analog of the electromagnetic field: a field configuration over Σ\Sigma (a Σ\Sigma-shaped trajectory) is a morphism ϕ:Σ→BG\phi : \Sigma \to \mathbf{B}G, hence equivalently a GG-principal bundle on Σ\Sigma. The configuration space of fields over Σ\Sigma is the groupoid of GG-principal bundles over Σ\Sigma. The background gauge field is a morphism α:BG→B nU(1)\alpha : \mathbf{B}G \to \mathbf{B}^n U(1) – hence a characteristic class for GG: a cocycle of degree nn in the group cohomology of GG. The value of the Lagrangian L(ϕ)L(\phi) on a field configuration ϕ\phi is the characteristic class of this bundle with respect to the universal characteristic class of the given circle n-bundle: This is the classical field theory input of the model. The extended quantum field theory defined by this is supposed to be a rule that assigns space of states to lower dimensional pieces of Σ\Sigma and to nn-dimensional Σ\Sigmas a propagator.'
