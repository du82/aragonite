["http://ncatlab.org/nlab/show/choice+operator"]
title = "choice operator in nLab"
full_description = 'computational trinitarianism = propositions as types +programs as proofs +relation type theory/category theory A (global) choice operator is structure included in some foundations of mathematics which provides a uniform way to choose an element of every inhabited set or class. In Hilbert‘s original formulation, for any property P(x)P(x) we can form a term εx.P(x)\varepsilon x.P(x) such that In other words, if PP holds of anything at all, then it holds of the particular term εx.P(x)\varepsilon x.P(x). A similar operator was used by Bourbaki and appears in FMathL?. In category theory, there are two different notions of logic, the usual external logic, and the internal logic of a category. These different notions of logic leads to different notions of a choice operator in category theory, an external choice operator and an internal choice operator Let ℰ\mathcal{E} be a well-pointed Heyting category. This allows for the objects of ℰ\mathcal{E} to behave as sets and morphisms x:Hom ℰ(1,X)x:\mathrm{Hom}_\mathcal{E}(1, X) from the terminal generator 1∈ℰ1 \in \mathcal{E} to any object X∈ℰX \in \mathcal{E} to behave as elements of XX. Then Hilbert’s formulation of the external (global) choice operator is rendered as the following: for any object X∈ℰX \in \mathcal{E} and any property P(x)P(x) on the hom-set Hom ℰ(1,X)\mathrm{Hom}_\mathcal{E}(1, X) we can form a morphism ε Xx.P(x)∈Hom ℰ(1,X)\varepsilon_X x.P(x) \in \mathrm{Hom}_\mathcal{E}(1, X) such that Let CC be a regular category. This implies that given an object X∈CX \in C, there is a support object [X]∈C[X] \in C, defined as the image of the unique morphism X→1X \to 1 into the terminal object 1∈C1 \in C. An internal (global) choice operator consists of, for every object XX, a morphism ε X:[X]→X\varepsilon_X:[X] \to X from the support object of XX to the original object XX. Hilbert’s original formulation of the choice operator translates over to the internal language of CC into the statement that for every object XX and subobject P↪XP \hookrightarrow X, there is a morphism ε P:[P]→P\varepsilon_P:[P] \to P from the support object of PP to PP itself. This implies the formulation above since the object XX is always a subobject of itself; conversely, if there is a morphism ε X:[X]→X\varepsilon_X:[X] \to X for every object X∈CX \in C, then there is a morphism ε P:[P]→P\varepsilon_P:[P] \to P for subobjects P↪XP \hookrightarrow X.'
