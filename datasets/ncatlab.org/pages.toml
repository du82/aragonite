["https://ncatlab.org/nlab/show/Haag-Kastler+axioms"]
title = "Haag-Kastler axioms in nLab"
full_description = 'The Haag–Kastler axioms (Haag-Kastler 64) (sometimes also called Araki–Haag–Kastler axioms) try to capture in a mathematically precise way the notion of quantum field theory (QFT), by axiomatizing how its algebras of quantum observables should depend on spacetime regions, namely as local nets of observables. to every causally closed subset 𝒪⊂X\mathcal{O} \subset X of spacetime XX there is associated a C*-algebra 𝒜(𝒪)\mathcal{A}(\mathcal{O}); for every inclusion 𝒪 1↪𝒪 2\mathcal{O}_1 \hookrightarrow \mathcal{O}_2 of such spacetime regions there is a corresponding inclusion 𝒜(𝒪 1)↪𝒜(𝒪 2)\mathcal{A}(\mathcal{O}_1) \hookrightarrow \mathcal{A}(\mathcal{O}_2) such that this respects composition of inclusions (hence such that 𝒜\mathcal{A} is a functor from the poset of causally closed subsets to C*-algebras) (causal locality) and such that whenever 𝒪 1,𝒪 2⊂𝒪⊂X\mathcal{O}_1, \mathcal{O}_2 \subset \mathcal{O} \subset X are spacelike separated, then the elements of the corresponding algebras of observables (graded-)commute with each other: The formulation of quantum field theory via these axioms has come to be known as algebraic quantum field theory or AQFT, for short. There are various further axioms in the list such as the time slice axiom. The precise details of the list of axioms is in flux as the theory develops. The Haag-Kastler axioms in their original form aim for the description of non-perturbative quantum field theory on Minkowski spacetime. They could be used to give rigorous proof of structural statements of QFT such as the spin-statistics theorem or the PCT theorem, but examples of interacting field theories in dimensions ≥4\geq 4 are missing. The observation that causal perturbation theory yields quantum observables that satisfy the Haag-Kastler axioms, except that C*-algebras are replaced by formal power series algebras, is due to (Il’in-Slavnov 78, Brunetti-Fredenhagen 00, Brunetti-Dütsch-Fredenhagen 09). See at S-Matrix – Causal Locality and Quantum Observables.'
year_published = 2025
clearnet = "https://ncatlab.org/nlab/show/Haag-Kastler+axioms"
