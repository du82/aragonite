["https://ncatlab.org/nlab/show/About"]
title = "About in nLab"
full_description = "The nLab is a collaborative wiki. It grew out of the desire (I, II) to have a place for development (the “Lab” in “nnLab”) and indexed archives of the ideas and concepts surrounding the discussions at the The nn-Category Café. These discussions primarily are about mathematics, physics and philosophy from the higher structures point of view of homotopy theory/algebraic topology, homotopy type theory, higher category theory and higher categorical algebra (the “nn” in “nnLab” and “nPOV”). The nnLab was created in November 2008 by Urs Schreiber, using software provided and set up by Jacques Distler. The name “nnLab” (short for “nn-Category Lab”, but perhaps less restrictive) was dreamt up by Lisa Raphals (John Baez‘s wife). Discussion of and around edits to the nnLab happen on the nnForum which roughly plays the role of the “talk”-pages at Wikipedia. The most apt analogy for the nnLab is of a group lab book. A lab book for a research scientist is a place where they write down anything that they consider relevant for their work; a group lab book is one that several researchers with common interests use. The material recorded in a lab book can include: Apart from not having actual physical experiments, this matches the content of the nnLab fairly well. The key difference between the nnLab and an “ordinary” lab book is that it is public. By making it public we hope to achieve two things: There is much more to a research project than that which appears in the final paper and we believe that since our results and our final proofs will be public, then both we and those who might read such a paper can benefit from beginning the interaction much earlier in its development. Thus by making our lab book public, we hope that casual passers-by will stop, read, and scribble something on it that will help us do our research. The nnLab is not a community project set up for the education and improvement of Humanity. It originally grew out of the The nn-Category Café and the loose-knit community surrounding that blog. It is not possible to give a precise description of who is in that community, and the community involved in the nnLab has itself evolved from that starting point. Moreover, even if it were possible to describe that community we would not wish to. We are not a closed group, we are always keen for others to join us. The two simple rules are:"
