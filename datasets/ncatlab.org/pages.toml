["http://ncatlab.org/nlab/show/quotient+set"]
title = "quotient set in nLab"
full_description = '''Given a set SS and an equivalence relation ≡\equiv on SS, the quotient set of SS by ≡\equiv is the set S/≡S/{\equiv} whose elements are the elements of SS but where two elements are now considered equal if in SS they were merely equivalent. If changing the definition of equality like this is not allowed in the given foundations of mathematics, then one can still define S/≡S/{\equiv} as a subset of the power set of SS. If there are also no (extensional) power sets in the foundations of mathematics, then there are two alternatives: The latter is the case if one assumes that Set\Set is a pretopos or a Grothendieck topos as given by Giraud's axioms). There are actually two possible axiom of quotient sets, depending on what definition of relation one uses. The weaker version of the axiom of quotient sets is the one which states that the coherent category SetSet is a pretopos: that every internal equivalence relation on a set AA, defined as a subset ≡\equiv of the Cartesian product A×AA \times A satisfying reflexivity, transitivity, and symmetry, has a quotient set A/≡A/\equiv. The stronger version of the axiom of quotient sets states that every proposition x≡yx \equiv y in the context of the variables x∈Ax \in A and y∈Ay \in A which satisfies reflexivity, transitivity, and symmetry has a quotient set A/≡A/\equiv. In some presentations of set theory, this is an axiom schema of quotient sets. In any case, the element of S/≡S/{\equiv} that comes from the element xx of SS may be denoted [x] ≡[x]_{\equiv}, or simply [x][x] if ≡{\equiv} is understood, or simply xx if there will be no confusion as to which set it is an element of. This [x][x] is called the equivalence class of xx with respect to ≡\equiv; the term ‘class’ here is an old word for ‘set’ (in the sense of ‘subset’) and refers to the definition (1) above, where [x][x] is literally the set AA. Let SS be a set and let ≡\equiv be an equivalence relation on SS. Let us define a quotient set algebra of SS and ≡\equiv to be a set AA with a function ιS→A\iota S \to A such that for all a∈Sa \in S and b∈Sb \in S, (a≡b)(a \equiv b) implies (ι(a)=ι(b))(\iota(a) = \iota(b)).'''
year_published = 2025
