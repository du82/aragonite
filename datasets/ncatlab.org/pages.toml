title = "function set in nLab"
full_description = 'Given sets AA and BB, the function set A BA^B is the set of all functions from BB to AA. In the foundations of mathematics, the existence of such a set may be taken to follow from the existence of power sets, from the axiom of subset collection, or as an axiom (the axiom of function sets) in its own right. Thinking of Set as a locally small category, this is a special case of a hom-set. Thinking of Set\Set as a cartesian closed category, this is a special case of an exponential object, which is a special case of an internal hom. Last revised on January 10, 2023 at 16:23:04. See the history of this page for a list of all contributions to it.'
