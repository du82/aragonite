["http://ncatlab.org/nlab/show/dependent+choice"]
title = "dependent choice in nLab"
full_description = '''In set theory, the axiom of dependent choice (DC) states that if XX is a nonempty (inhabited) set and if RR is a total binary relation on XX, then there exists a sequence x:ℕ→Xx\colon \mathbb{N} \to X such that (x n,x n+1)(x_n, x_{n+1}) belongs to RR for all n∈ℕn \in \mathbb{N}. It is strictly weaker than the full axiom of choice, but strictly stronger than the axiom of countable choice. It is called dependent choice because the available choices for x n+1x_{n+1} depend on the choice of x nx_n made at the previous stage. There is another way to express the axiom of dependent choice which uses surjections instead of entire relations: The axiom of dependent choice states that given a family of sets X nX_n and a family of surjections f n:X n+1→X nf_n:X_{n + 1} \to X_n indexed by natural numbers n∈ℕn \in \mathbb{N}: the projection function to X 0X_0 from the sequential limit lim←X n\underset{\leftarrow}\lim X_n of the above diagram is a surjection. More generally, given an elementary topos or a pretopos ℰ\mathcal{E} with sequential limits, the axiom of dependent choice states that given a sequence of objects X:ℕ→Ob(ℰ)X:\mathbb{N} \to \mathrm{Ob}(\mathcal{E}) and a dependent sequence of epimorphisms f n:hom ℰ(X n+1,X n)f_n:\mathrm{hom}_\mathcal{E}(X_{n + 1}, X_{n}) indexed by n∈ℕn \in \mathbb{N}, the projection function to X 0X_0 from the sequential limit lim←X n\underset{\leftarrow}\lim X_n of the above diagram is an epimorphism. In dependent type theory, the axiom of dependent choice states that if AA is an inhabited set and if RR is a entire relation on AA, then then there exists a sequence a:ℕ→Aa:\mathbb{N} \to A such that for all n:ℕn:\mathbb{N}, R(a(n),a(n+1))R(a(n), a(n + 1)) holds. If the dependent type theory has a type of all propositions Prop\mathrm{Prop}, this can be simplified down to the inference rule Typical applications of dependent choice include Kőnig's lemma? and the Baire category theorem for complete metric spaces.'''
