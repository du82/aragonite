["https://ncatlab.org/nlab/show/CFT"]
title = "conformal field theory in nLab"
full_description = 'Recall that a TQFT is an FQFT defined on the (∞,n)(\infty,n)-category of cobordisms whose morphisms are plain cobordisms and diffeomorphisms between these. In a conformal quantum field theory the cobordisms are equipped with a conformal structure (a Riemannian metric structure modulo pointwise rescaling): conformal cobordisms. A conformal field theory (CFT) is accordingly a functor on such a richer category of conformal cobordisms. See the discussion at FQFT for more details. The conformally invariant quantum field theories have fields for whom the correlation functions have a specific behaviour accounting for the conformal dimension of the fields. This kind of constraints coming from conformal invariance, leads to constraints on the possible behaviour of correlation functions; this has being formulated in 1971 by Polyakov as a conformal bootstrap program: the conformal invariance should be sufficient to classify consistent conformal QFTs directly from the analysis of symmetries, rather than computing the Feynman diagram perturbation series from some action functional; this avoids the usual problems with regularization and renormalization. Precisely in 2-dimensions is the representation theory of the conformal group exceptionally interesting. In d>2d \gt 2, the global transformations, i.e. the elements of the conformal group, are given by the Poincare algebra, dilations and special conformal transformations. In 22 dimensions, there are additionaly infinitely many local generators of conformal transformations whose commutation relations are given by the Virasoro algebra. This circumstance enables Belavin, Polyakov and Zamolodchikov to make a breakthrough in the bootstrap program in 1984 (what also helped a 1984-1985 revolution in string theory). There are well-developed tools for handling the theory locally (conformal nets, vertex operator algebras) and at least in the rational conformal field theory case there are complete classification results for the full theories (defined on cobordisms of all genera).'
year_published = 2025
clearnet = "https://ncatlab.org/nlab/show/CFT"
