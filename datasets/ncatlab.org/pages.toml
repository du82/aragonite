["http://ncatlab.org/nlab/show/axiom+of+materialization"]
title = "axiom of materialization in nLab"
full_description = 'An axiom of materialization states that every set is isomorphic to a pure set of a certain form. They can be formulated either in structural set theory or material set theory, and in reasonably strong set theories they are often provable. The axiom of well-founded materialization says that every set is isomorphic to a well-founded pure set, or equivalently (at least in a strong enough set theory) that every set can be embedded into a well-founded extensional graph. In material set theory this is also known as Coret’s Axiom B (Coret 64). The axiom of ill-founded materialization says that every set can be embedded in an strongly extensional graph. Since well-founded extensional graphs are strongly extensional, the well-founded axiom implies the ill-founded one. The axiom of well-founded materialization follows from the axiom of choice: every well-ordered set is a well-founded extensional graph, so if every set is well-orderable then the axiom follows. In material set theory, the axiom of well-founded materialization follows from the axiom of foundation, since then every set is already a well-founded pure set. Similarly, the axiom of ill-founded materialization follows from the axiom of anti-foundation. In the presence of excluded middle and the axiom of replacement, every strongly extensional graph can be embedded into a well-founded extensional graph. Specifically, a graph is a coalgebra for the powerset functor, hence has a cone over the terminal coalgebra sequence for that endofunctor (which exists using the axiom of replacement, even though it does not converge to a terminal coalgebra). The kernels of the maps in this cone are the approximations to the bisimilarity of the graph, and hence converge to it at some ordinal α\alpha (namely the Hartogs number of the lattice of binary relations; this uses excluded middle). By strong extensionality, the bisimilarity is the identity, so the α th\alpha^{\mathrm{th}} map in the cone is an injection into a well-founded set.'
year_published = 2025
clearnet = "http://ncatlab.org/nlab/show/axiom+of+materialization"
