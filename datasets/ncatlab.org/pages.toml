full_description = 'product, fiber product, base change, coproduct, pullback, pushout, cobase change, equalizer, coequalizer, join, meet, terminal object, initial object, direct product, direct sum In the strict sense of the word, a cartesian product is a product in Set, the category of sets. Hence for S 1S_1 and S 2S_2 two sets, their cartesian product is the set denoted S 1×S 2S_1\times S_2 whose elements are ordered pairs of elements in S 1S_1 and S 2S_2, respectively. The abstract concept of such products generalizes from Set to any other category (as a special case of a category-theoretic limit), only that in general products of any given objects may or may not actually exist in that category. (If they all exist, then one speaks of a cartesian monoidal category. Especially if the category is also a monoidal category with respect to some other tensor product, then one says “Cartesian product” to distinguish the two. For instance one speaks of the cartesian product on Cat and on 2Cat in contrast to the Gray tensor product.) A product created by the forgetful functor of a concrete category, especially in algebra, is often called a direct product (for instance a direct product of groups). Given any family (A i) i:I(A_i)_{i:I} of sets, the cartesian product ∏ iA i\prod_i A_i of the family is the set of all functions ff from the index set II with f jf_j in A jA_j for each jj in II. As stated, the target of such a function depends on the argument, which is natural in dependent type theory; but if you don’t like this, then define ∏ iA i\prod_i A_i to be the set of those functions ff from II to the disjoint union ⨄ iA i\biguplus_i A_i such that f j∈A jf_j \in A_j (treating A jA_j as a subset of ⨄ iA i\biguplus_i A_i as usual) for each jj in II. In traditional forms of set theory, one can also take the target of ff to be the union ⋃ iA i\bigcup_i A_i or even the class of all objects (equivalently, leave it unspecified). Given any category 𝒞\mathcal{C}, and any set {X i} 