["https://ncatlab.org/nlab/show/David+Roberts"]
title = "David Michael Roberts in nLab"
full_description = "I work on bundle gerbes, 2-bundles, geometric stacks and internal groupoids and categories, and category theory more generally with a side interest in foundations. I have a particular interest in constructing examples in (low-dimensional) higher geometry. From May 2022 I am a Visiting Associate Lecturer at the University of Adelaide, in the School of Computer and Mathematical Sciences, and I teach in the Maths Learning Centre (NB this is an independent part of the university, not attached to the School of Maths!). For August–December 2022 I am also a casual lecturer for two pure mathematics subjects at Flinders University. For March 2018–December 2021 I was a Research Associate (that is, a postdoc) at the Institute for Geometry and its Applications in the School of Mathematical Sciences at U Adelaide. Previous to this, for July-2017 to February 2018 I was a ‘Level B’ Lecturer (=Assistant Professor in the US system) in the School of Mathematical Sciences. I was also a Research Associate at U Adelaide from October 2012 to April 2015. I have also worked as an applied statistician/survey analyst/data analyst/consultant in the public sector, with 3+ years experience of daily work in the software SAS. You may also find me on: zbMATH, MathSciNet, Google Scholar, MathOverflow, arXiv, ORCiD, Publons, or my blog, theHigherGeometer. If you need it, here is my email: droberts.(fifth and largest-known Fermat prime)@gmail.[etc] or [first].[last]@adelaide.edu.au Classifying bi-invariant 2-forms on infinite-dimensional Lie groups (2023) arXiv:2311.03913. (submitted for publication) Rigid models for 2-gerbes I: Chern-Simons geometry (2022) arXiv:2209.05521. Joint with Raymond Vozzo. (submitted for publication) Homotopy types of topological stacks of categories, New York Journal of Mathematics, Volume 30 (2024), 940-955, journal version, arXiv:2204.02778 (this paper was written when I was a PhD student, in 2008/09, but only polished and released on the arXiv in 2022). Substructural fixed-point theorems and the diagonal argument: theme and variations, Compositionality 5, 8 (2023), doi:10.32408/compositionality-5-8, arXiv:2110.00239."
