["https://ncatlab.org/nlab/show/Kaluza-Klein+mechanism"]
title = "Kaluza-Klein mechanism in nLab"
full_description = 'geometry of physics: coordinate systems, smooth spaces, manifolds, smooth homotopy types, supergeometry pullback of differential forms, invariant differential form, Maurer-Cartan form, horizontal differential form, The Kaluza-Klein mechanism, named after Theodor Kaluza and Oskar Klein, is the observation that pure gravity on a product spacetime X×FX \times F with fixed metric g Fg_F on FF looks on XX, as an effective field theory, like gravity coupled to Yang-Mills theory – Einstein-Yang-Mills theory – for gauge group GG the Lie group of isometries of (F,g F)(F,g_F). In particular for F=S 1F = S^1 the circle, it yields electromagnetism coupled to gravity (a “graviphoton” field, but in addition also a dilaton) – Einstein-Maxwell theory. When applied to supergravity then this mechanism produces not just force fields but also fermionic matter in the resulting effective field theory, hence yields Einstein-Yang-Mills-Dirac theory, see the examples below at KK-reduction of 11d Supergravity. As such the KK-mechanism is not unlike the idea of geometrodynamics, according to which fundamentally there is only dynamical spacetime geometry in the form of gravity with all matter and other forces being special incarnations of this. Since in general relativity also the size and shape of the fiber FF is dynamical, generically effective field theories arising from KK-compactification contain spurious fields parameterizing the geometry of FF. In the simplest case this is just the dilaton, encoding the total volume of FF, more generally these fields are often called the moduli fields. Since these moduli fields are not observed in experiment, naive KK-models are generically phenomenologically unviable. However, in variants of gravity such as higher dimensional supergravity there are possibilities for the moduli to obtain masses and hence for the KK-models to become viable after all. This is the problem of moduli stabilization. More precisely, the Einstein-Hilbert action functional on pseudo-Riemannian metrics on a product spacetime X×FX \times F'
