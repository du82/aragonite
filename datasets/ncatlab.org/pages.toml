["http://ncatlab.org/nlab/show/countable+choice"]
title = "countable choice in nLab"
full_description = 'The axiom of countable choice (CCCC), also called AC ωAC_\omega or AC NAC_N, is a weak form of the axiom of choice; it says that the set of natural numbers is a projective object in Set. (Recall that the full axiom of choice states that every set is projective.) In classical mathematics, countable choice is usually accepted because the full axiom of choice is accepted. In constructive mathematics the situation is more subtle. For varying reasons, some schools of constructive mathematics accept countable choice (though they reject the full axiom of choice). On the other hand, countable choice is not valid in the internal logic of a general topos, so if one desires this level of generality then it should not be assumed. There are also philosophical constructivist arguments against it. Fred Richman (RichmanFTA) has said that Countable choice is a blind spot for constructive mathematicians in much the same way as excluded middle is for classical mathematicians. More explicitly, let XX be any set and let p:X→Np\colon X \to \mathbf{N} be a surjection. Then the axiom of countable choice states that pp has a section. If you phrase the axiom of choice in terms of entire relations, then countable choice states that any entire relation from N\mathbf{N} to any other set contains (in the 2-poset Rel) a functional entire relation. In dependent type theory, countable choice says that the dependent product of a family of inhabited sets indexed by the natural numbers is itself inhabited: Alternatively, the axiom of countable choice states that given a family of sets A(n)A(n) indexed by natural numbers nn and a family of propositions P(n,x)P(n, x) indexed by natural numbers nn and element x:A(n)x:A(n), if for all natural numbers nn there merely exists an element x:A(n)x:A(n) such that P(n,x)P(n, x), then there merely exists a dependent function g:∏ n:ℕA(n)g:\prod_{n:\mathbb{N}} A(n) such that for all natural numbers nn, P(n,g(n))P(n, g(n)): The Cauchy real numbers and Dedekind real numbers coincide (the law of excluded middle also separately implies this).'
