["http://ncatlab.org/nlab/show/Mostowski%27s+collapsing+lemma"]
title = "Mostowski's collapsing lemma in nLab"
full_description = "Mostowski’s collapsing lemma states that any extensional well-founded relation is isomorphic to a (necessarily unique) transitive set. Mostowski’s lemma can be proven in ZF set theory using the axiom of replacement and axiom of separation. In set theories that are not powerful enough to prove the lemma, it can be adopted as a separate axiom; in this case it is sometimes called Mostowski’s principle. Mostowski’s principle is sort of a “dual” of the axiom of foundation that the membership relation is well-founded (and, by the axiom of extensionality, extensional). A related principle for structural set theory is the axiom of well-founded materialization. Last revised on November 12, 2022 at 14:47:23. See the history of this page for a list of all contributions to it."
