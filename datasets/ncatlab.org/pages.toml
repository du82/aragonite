["http://ncatlab.org/nlab/show/axiom+of+infinity"]
title = "axiom of infinity in nLab"
full_description = 'In the foundations of mathematics, an axiom of infinity is any axiom that asserts that infinite sets exist. In set theory and set-level type theory, infinite sets cannot be constructed from finite sets, so their existence must be posited as an extra axiom. Further axioms, in this vein which assert the existence of even larger sets that cannot be constructed from smaller ones are called large cardinal axioms. One common form of the axiom of infinity says that the particular set NN of natural numbers exists. In material set theory this often takes the form of asserting that the von Neumann ordinal number ω\omega exists, where ω\omega is characterized as the smallest set such that ∅∈ω\emptyset\in\omega and whenever a∈ωa\in \omega then a∪{a}∈ωa\cup \{a\}\in \omega. In dependent type theory, it is possible to define a Tarski universe (V,∈)(V, \in) of pure sets which behaves as a material set theory. The universal type family of the Tarski universe is given by the type family x:V⊢∑ y:Vy∈xx:V \vdash \sum_{y:V} y \in x. The axiom of infinity is given by the following inference rule: In structural set theory the usual form of the axiom of infinity is the existence of a natural numbers object. There is an alternate way to express the axiom of infinity in a Tarski universe, as the axiom of resizing the set truncation of the type of finite types in UU, since isFinite\mathrm{isFinite} and set truncations are definable from the type of propositions in UU, ∑ A:UisProp(A)\sum_{A:U} \mathrm{isProp}(A), but they are all usually large, and so have to be resized to be small: Instead of a defining the natural numbers via its induction principle, one can instead define the integers via its induction principle, and then use the fact that disjoint unions are disjoint and ℤ≅ℤ⊎ℤ\mathbb{Z} \cong \mathbb{Z} \uplus \mathbb{Z} to construct the natural numbers. Alternatively, one can assume a (trichotomous) ordered integral domain ℤ\mathbb{Z}, such that every (trichotomous) ordered integral subdomain of ℤ\mathbb{Z} is equivalent to the improper subset of ℤ\mathbb{Z}. This defines the integers, since the integers are the initial (trichotomous) ordered integral domain and are strictly initial. Since the integers as defined automatically comes with a total order ≤\leq and a pseudo-order <\lt, one can define the natural numbers as the set of non-negative integers.'
