["https://ncatlab.org/nlab/show/%21-modality"]
title = "!-modality in nLab"
full_description = 'computational trinitarianism = propositions as types +programs as proofs +relation type theory/category theory In full linear logic [Girard 1987] and more generally in linear type theory there is assumed a (comonadic) modality traditionally denoted “!” whose role is to model the “underlying” classical (intuitionistic) type of a given linear type. This is alternatively called the “exponential modality” (for good reasons discussed below), or “storage modality” (as it allows to duplicate and hence “store” otherwise linear data) and sometimes pronounced “of course” (intended alongside “necessarily” and “possibly” as used in modal logic) or even “bang” (just in reference to the symbol “!”). In classical linear logic (meaning with involutive de Morgan duality), the de Morgan dual of “!” is denoted “?” and then sometimes pronounced “why not”. Today it is understood (cf. Melliès 2009, p. 36) that the exponential modality is best and generally to be thought as as, first of all a comonad on linear types (Seely 1989 §2, dePaiva 1989, Benton, Bierman, de Paiva and Hyland 1992) which, secondly, is induced by an adjunction to classical (meaning here: non-linear intuitionistic) types with special monoidal properties (Seely 1989 §2, Bierman 1994 pp. 157, Benton 1995). In a most elementary and illuminating example (which may not have received the attention it deserves, cf. the history at quantum logic): in which case the exponential modality acts by sending a vector space to the linear span of its underlying set This example is the 0-sector of the more famous stabilization ( ∞ \infty -)adjunction (Σ + ∞⊣Ω + ∞)(\Sigma_+^\infty \dashv \Omega_+^\infty) between (the homotopy theory of) topological spaces and (the stable homotopy theory of) module spectra equipped with the symmetric smash product of spectra (given by forming suspension spectra X↦Σ + ∞XX \mapsto \Sigma_+^\infty X), which points to a deeper origin of the “exponential modality”, see below and at linear homotopy type theory for more on this.'
