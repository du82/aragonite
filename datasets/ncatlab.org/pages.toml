["https://ncatlab.org/nlab/show/HowTo"]
title = "HowTo in nLab"
full_description = "If you feel you can most easily start by modifying an example, look at the template page and do experiments in the Sandbox. The following provides more details. For technical help with special features of Instiki (including peculiarities with itex), HTML and XML, and assorted specifics of the nLab, see also the FAQ. Hit “edit page” to see how pages are coded. Use the Sandbox to warm up. The key point is that links to other pages are placed in [[double brackets]]. There is no feature to preview your edits. Instead, submit them and then edit again. Two successive submissions with the same signature and made within 30 minutes of each other count as one. To create a new page on the nnLab first make an existing page request a link to it, and then click on that requested link. (At least one such page ought to exist, if your new page is related to anything, but if you just cannot think of any, use the Sandbox page). See the existing page render again, now with your edit included. If your new page name did not exist yet as a page, you will see that string appear, in the existing entry, in gray with a clickable question mark behind it. There is no preview mechanism: Just keep cycling through “Submit” and “Edit” until you are satisfied. Watch out: the name of a page is case sensitive, so make your link lowercase if it comes at the beginning of a sentence. ([[like this|Like this]].) We loosely agreed to try to follow that and some other naming conventions; see below. When you edit a page, you should put your name (with normal capitalisation and spacing) in the box after ‘Submit as’. If you don’t, then your contribution will be credited to ‘Anonymous’ (formerly the AnonymousCoward). Once you edit a page for the first time, your name will appear at the bottom, grayed out with a question mark since there is no page with your name yet. You may take this as an invitation to create a user page and tell us about yourself. But if you don’t want to or don’t have the time right now, you can forget about this. If you just want to show up on category: people, then you make a page containing only ‘category: people’ (or someone else may do this for you)."
