["http://ncatlab.org/nlab/show/empty+set"]
title = "empty set in nLab"
full_description = 'The empty set is unique in most membership-based foundations, but in any case we can say ‘the’ empty set, since any two empty sets are isomorphic by a unique isomorphism (the generalized the). Indeed, in any foundations (whether membership-based or structural), the empty set is characterized by a universal property: it is the initial object in the category Set of all sets: for every set SS, there is a unique function The empty set can be confusing, because it is a degenerate case. Indeed, it is defined as an exception: every set is inhabited, except the empty set. Nothing belongs to the empty set, but the empty set itself is something. Mathematics students are confused that there is a function from the empty set to itself, and even grown mathematicians will misstate definitions because they forget about the empty set. In terms of the empty set one can give sense to the natural number expression 0 00^0, the exponentiation of zero with itself, by defining the exponential m nm^n to be the cardinality of the hom-set hom Set([n],[m])\hom_{Set}([n], [m]) where [m][m] is an mm-element set. Then 0 0=10^0 = 1 because ∅\emptyset is an initial object. Endless debates (as seen for example at sci.math) about the meaning of 0 00^0 are most easily resolved by paying attention to how exponentiation (in a ring or rig that admits exponentiation) is defined. We have just observed how 0 0=10^0 = 1 makes good sense in the rig of natural numbers. But exponentiation for the real number field (x yx^y for x>0x \gt 0) is standardly defined by continuity considerations, and cannot be continuously extended to cover 0 00^0. Of course, that has nothing to do with the empty set! In set theory as a foundation of mathematics, the existence of the empty set is often taken as an axiom, the axiom of the null set. Actually, this axiom can be written in such a simple way that the name seems unmotivated: However, one can then use the axiom of separation (bounded separation is enough) to prove that there exists an empty set, and then use the axiom of extensionality to prove that this empty set is unique.'
