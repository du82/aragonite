["http://ncatlab.org/nlab/show/small+cardinality+selection+axiom"]
title = "small cardinality selection axiom in nLab"
full_description = 'The small cardinality selection axiom (SCSA) is a weak form of the axiom of choice, which asserts in a certain precise way that choice fails “in at most a small way”. It was introduced by Michael Makkai for the study of anafunctors, and thus it also has consequences for the existence of stack completions. Therefore, we have a class function assigning to each set AA, another set ‖A‖{\Vert A\Vert} and a bijection A≅‖A‖A \cong {\Vert A \Vert}, in such a way that ‖−‖{\Vert{-}\Vert} takes only set-many values on each isomorphism class in Set. There is also a “local version” of SCSA which can be stated as follows. Given a function f:A→If:A\to I, say that a function g:B→Jg:B\to J equipped with ϕ:J→I\phi:J\to I is a local pullback of ff if there is a pair of pullback squares in which pp is surjective. Then the local SCSA states: In more set-theoretic language, given a family of sets (A i) i∈I(A_i)_{i\in I}, define a family of sets (B j) j∈J(B_j)_{j\in J} equipped with ϕ:J→I\phi:J\to I to be a local reindexing of (A i)(A_i) if for each j∈Jj\in J there exists an isomorphism B j≅A ϕ(j)B_j \cong A_{\phi(j)} (but there is not necessarily a function picking out such an isomorphism). Then the local SCSA states that for any (A i) i∈I(A_i)_{i\in I} has a local reindexing (B j) j∈J(B_j)_{j\in J} with ϕ:J→I\phi:J\to I such that for any other local reindexing (C k) k∈K(C_k)_{k\in K} with ψ:K→I\psi:K\to I, there exists a function χ:K→J\chi : K\to J such that ϕχ=ψ\phi\chi = \psi and a specified family of isomorphisms C k≅B χ(k)C_k \cong B_{\chi(k)}. To deduce the local version from the global version, given (A i) i∈I(A_i)_{i\in I} let JJ be the set of pairs (i,Y)(i, Y) such that Y=‖X‖Y = \Vert X\Vert for some X≅A iX\cong A_i, with ϕ\phi the first projection and B (i,Y)=YB_{(i,Y)} = Y. Then given (C k) k∈K(C_k)_{k\in K} with ψ:K→I\psi:K\to I such that C k≅A ψ(k)C_k \cong A_{\psi(k)}, define χ(k)=(ψ(k),‖C k‖)\chi(k) = (\psi(k),\Vert C_k\Vert).'
