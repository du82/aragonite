["https://ncatlab.org/nlab/show/Fourier+transform"]
title = "Fourier transform in nLab"
full_description = 'Generally, a Fourier transform is an isomorphism between the algebra of complex-valued functions on a suitable topological group and a convolution product-algebra structure on the Pontrjagin dual group. The study of Fourier transforms is also called Fourier analysis. Typically, such as in the case over Cartesian space (def. below) this means to decompose any suitable function as a superposition of complex plane waves, which may be thought of as the “harmonics” of the given function. Therefore one speaks of harmonic analysis. The concept of Fourier transforms of functions generalizes in a variety of ways. Core part of the subject of Fourier analysis is the generalization to Fourier transform of distributions (def. below). The asymptotic growth of the Fourier transform of distributions reflects the singularity structure of the distributions, in dependence of the direction of the wave vector (the “wave front set”). The study of this behaviour is called microlocal analysis. If the role of complex plane waves in the Fourier transform are replaced by wavelets?, one speaks of the wavelet transform?. For noncommutative topological groups, instead of continuous characters one should consider irreducible unitary representations, which makes the subject much more difficult. There are also generalizations in noncommutative geometry, see quantum group Fourier transform. Let GG be a locally compact Hausdorff abelian topological group with invariant (= Haar) measure μ\mu. Then for each f∈L 1(G,μ)f\in L_1(G,\mu), define its Fourier transform f^\hat{f} as a function on its Pontrjagin dual group G^\hat{G} given by The Fourier transform of f∈L 1(G,μ)f\in L_1(G,\mu) is always continuous and bounded on G^\hat{G}; the transform of the convolution of two functions is the product of the transforms of each of the functions separately. In the classical case of Fourier series, where G=ℤG=\mathbb{Z} (the additive group of integers) and G^=S 1\hat{G}=S^1 (the circle group), the Fourier transform restricts to a unitary operator between the Hilbert spaces L 2(S 1,dt)L_2(S^1,d t) and l 2(ℤ)l_2(\mathbb{Z}) and the Fourier coefficients are the numbers'
