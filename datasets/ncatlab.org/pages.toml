["http://ncatlab.org/nlab/show/Whitehead+theorem"]
title = "Whitehead theorem in nLab"
full_description = 'fundamental ∞-groupoid in a locally ∞-connected (∞,1)-topos/of a locally ∞-connected (∞,1)-topos A simplicial map f:X→Yf\colon X\to Y between Kan complexes is a simplicial homotopy equivalence if and only if for any aa and bb that make the following square commute there is a diagonal arrow dd that makes the upper triangle commutative and the lower triangle commutative up to a homotopy h:Δ 1×Δ n→Yh\colon \Delta^1\times\Delta^n\to Y that is constant on the boundary Δ 1×∂Δ n\Delta^1\times\partial\Delta^n. Of course, this statement can be reformulated using homotopy groups like the version for topological spaces, but the above statement is more practical. If XX or YY is not a Kan complex, one can formulate a similar criterion using barycentric subdivisions of ∂Δ n\partial\Delta^n and Δ n\Delta^n. A simplicial map f:X→Yf\colon X\to Y between simplicial sets is a weak homotopy equivalence if and only if for any k≥0k\ge0 and for any aa and bb that make the following square commute In GG-equivariant homotopy theory the statement is that GG-homotopy equivalences between G-CW complexes are equivalent to maps that are weak homotopy equivalences on fixed point spaces H HH^H for all closed subgroups H⊂GH \subset G (e.g. Greenlees-May 95, theorem 2.4). See at equivariant Whitehead theorem. There is a notion of homotopy groups for objects in every ∞-stack (∞,1)-topos, as described at homotopy group (of an ∞-stack). Accordingly, there is a notion of weak homotopy equivalence in every ∞-stack (∞,1)-topos and hence an analog of the statement of Whiteheads theorem. One finds that The ∞-stack (∞,1)-toposes in which the Whitehead theorem does hold are the hypercomplete (∞,1)-toposes. These are precisely the ones that are presented by a local model structure on simplicial presheaves. For instance the hypercomplete (∞,1)(\infty,1)-topos Top is presented by the model structure on simplicial presheaves on the point, namely the model structure on simplicial sets.'
