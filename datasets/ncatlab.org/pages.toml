["https://ncatlab.org/nlab/show/%282%2C1%29-dimensional+Euclidean+field+theory"]
title = "(2|1)-dimensional Euclidean field theory in nLab"
full_description = 'This entry here is about the definition of (2|1)(2|1)-dimensional super-cobordism categories where cobordisms are Euclidean supermanifolds, and about the(2|1)the (2|1)-dimensional FQFTs given by functors on these. Previously we had defined smooth categories of Riemannian cobordisms. Now we pass from Riemannian manifolds to Euclidean supermanifolds and define the corresponding smooth cobordism category. Then we define (d|δ)(d|\delta)-dimensional Euclidean field theories to be smooth representations of these categories. As described at (2,1)-dimensional Euclidean field theories and tmf, the idea is that (2|1)(2|1)-dimensional Euclidean field theories are a geometric model for tmf cohomology theory. While there is no complete proof of this so far, in the next and final session it will be shows that the claim is true at least for the cohomology ring over the point: the partition function of a (2|1)(2|1)-dimensional EFT is a modular form. Hence (2|1)(2|1)-dimensional EFTs do yield the correct cohomology ring of tmf over the point. We will define a stack/fibered category on SDiffSDiff called EBord 2|1E Bord_{2|1} whose morphisms are smooth families of (2|1)-dimensional super-cobordisms, and a stack/fibered category sTV famsTV^{fam} of topological super vector bundles. strategy: From the path integral perspective we need some structure on Σ\Sigma such that the “space” of maps Maps(Σ,X)Maps(\Sigma,X) naturally carries some measure that allows to perform a path integral. This perspective suggests certain generalizations of the notion of Riemannian manifold to supermanifolds which may be a little different than what one might have thought of naively. We want to define Euclidean supermanifolds as a generalization of Riemannian manifold with flat Riemannian metric. a maximal atlas on XX consisting of charts such that all transition functions belong the the Euclidean group or Galileo group Similarly a Euclidean structure on a (d|δ)(d|\delta)-dimensional supermanifold is defined using the Euclidean super Lie group given by the semidirect product'
