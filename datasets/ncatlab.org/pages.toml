title = "regular extension axiom in nLab"
full_description = "The Regular Extension Axiom (REA) is a foundational axiom which asserts the existence of arbitrarily large regular cardinal-like sets. It has several variants, some of which are provable in ZF, some of which are provable from the axiom of choice or weaker variants thereof such as SVC, and some of which are not even provable in ZFC. REA is usually considered in the context of CZF. Peter Aczel, Hajime Ishihara, Takako Nemoto and Yasushi Sangu, Generalized geometric theories and set-generated classes, PDF Last revised on July 2, 2014 at 12:55:46. See the history of this page for a list of all contributions to it."
