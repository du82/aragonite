["https://ncatlab.org/nlab/show/Bell%27s+theorem"]
title = "Bell's inequality in nLab"
full_description = 'In quantum physics/quantum information theory, What came to be called Bell’s inequality (Bell 1964) is an inequality satisfied by the three pairwise correlation functions between three random variables defined on one and the same classical probability space. As such, it is an elementary statement about classical probability theory which as been argued (Pitowsky 1989a) to have been known already to Boole (1854). The point of the argument by Bell 1964 was to highlight that when taking these three random variables to be the results of quantum measurements of the spin of an electron along three pairwise non-orthogonal axes (as in the Stern-Gerlach experiment) then quantum theory predicts that this inequality is violated – implying that there is no single classical probability space (called a hidden variable in the context of interpretations of quantum mechanics) on which these three quantum measurement-results are jointly random variables. A number of experiments have sought to check Bell’s inequalities in quantum physics (“Bell tests”) and all claim to have verified that it is indeed violated in nature (see Aspect 2015), as predicted by quantum theory. Bell’s inequality has been and is receiving an enormous amount of attention, first in discussions of interpretations of quantum mechanics, but more recently and more concretely also in the context of quantum information theory. The following is fairly verbatim recap of the original argument in Bell 1964. For a streamlined re-statement see further below. Let us denote the result A of a measurement that is determined by a unit vector, a→\vec{a}, and some parameter λ\lambda as A(a→,λ)=±1A(\vec{a},\lambda)=\pm 1 where we further suppose that the outcome of the measurement is either +1 or -1. Likewise, we may do the same for the result B of a second measurement, i.e. B(b→,λ)B(\vec{b},\lambda). We further make the vital assumption that the result B does not depend on a→\vec{a} and likewise A does not depend on b→\vec{b}.'
