["http://ncatlab.org/nlab/show/axiom+of+pairing"]
title = "axiom of pairing in nLab"
full_description = 'In material set theory as a foundation of mathematics, the axiom of pairing is an important axiom needed to get the foundations off the ground (to mix metaphors). It states that pair sets exist. Axiom of pairing: If xx and yy are (material) sets, then there exists a set PP such that x∈Px \in P and y∈Py \in P. Using the axiom of separation (bounded separation is enough), we can prove the existence of a particular set PP such that xx and yy are the only members of PP. Using the axiom of extensionality, we can then prove that this set PP is unique; it is usually denoted {x,y}\{x,y\} and called the pair set of xx and yy. Note that {x,x}\{x,x\} may also be denoted simply {x}\{x\}. One could also assume that the material set theory has a primitive binary operation PP which takes of a material set xx and yy and returns a material set P(x,y)P(x, y). Then the axiom of pairing becomes Axiom of pairing: If xx and yy are (material) sets, then x∈P(x,y)x \in P(x, y) and y∈P(x,y)y \in P(x, y). Axiom of unordered pairing: If xx and yy are (material) sets, then there exists a set PP such that x∈Px \in P and y∈Py \in P and for all sets zz, z∈Pz \in P implies that z=xz = x or z=yz = y. Using the axiom of extensionality, we can then prove that this set PP is unique; it is usually denoted {x,y}\{x,y\} and called the pair set of xx and yy. Note that {x,x}\{x,x\} may also be denoted simply {x}\{x\}. One could also assume that the material set theory has a primitive binary operation {−,−}\{-,-\} which takes of a material set xx and yy and returns a material set {x,y}\{x, y\}. Then the axiom of pairing becomes Axiom of unordered pairing: If xx and yy are (material) sets, then x∈{x,y}x \in \{x, y\}, y∈{x,y}y \in \{x, y\}, and for all sets zz, z∈{x,y}z \in \{x, y\} implies that z=xz = x or z=yz = y. Let us assume that the material set theory has a primitive binary operation (−,−)(-,-) which takes of a material set xx and yy and returns a material set (x,y)(x, y). Axiom of ordered pairing: If xx and yy are (material) sets, then x∈(x,y)x \in (x, y), y∈(x,y)y \in (x, y), and for all sets aa and bb, (a,b)=(x,y)(a, b) = (x, y) if and only if a=xa = x and b=yb = y.'
