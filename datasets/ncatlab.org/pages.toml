["http://ncatlab.org/nlab/show/disjoint+union"]
title = "disjoint union in nLab"
full_description = '''product, fiber product, base change, coproduct, pullback, pushout, cobase change, equalizer, coequalizer, join, meet, terminal object, initial object, direct product, direct sum In a general category coproducts need not have the expected disjointness property of those in Set. If they do they are called disjoint coproducts. Given any family (A i) i:I(A_i)_{i:I} of sets, the (external) disjoint union ⨄ iA i\biguplus_i A_i (also written ∑ iA i\sum_i A_i, ∐ iA i\coprod_i A_i, etc) of the family is the set of all (ordered) pairs (i,a)(i,a) with ii in the index set II and aa in A iA_i. As stated, the type of the second element of such a pair depends on the first element, which is natural in dependent type theory (see at dependent sum type) and no problem for material set theory, but it may be ill formed in a structural set theory or in some forms of type theory, especially those based on the internal language of topos theory. Alternatively, one may define ⨄ iA i\biguplus_i A_i to be the set of those elements xx of the cartesian product ∏ i𝒫A i\prod_i \mathcal{P}A_i of the power sets such that there is exactly one index jj such that x jx_j is inhabited and that x jx_j is a singleton. If you're trying to be predicative too, then you may need to simply adopt the existence of disjoint unions as an axiom (the axiom of disjoint unions) in your foundations, stating the following facts about it. There is a natural injection A j→⨄ iA iA_j \to \biguplus_i A_i (mapping aa to (j,a)(j,a), or mapping aa to (i↦{a|i=j})(i \mapsto \{a \;|\; i = j\})) for each index jj. Conversely, for each element xx of ⨄ iA i\biguplus_i A_i, there is a unique index jj and such that xx is in the image of the injection from A jA_j. It is common to treat A jA_j as a subset of ⨄ iA i\biguplus_i A_i; so if no confusion can result (in particular, when the notation for an element of A jA_j always makes the ambient set clear), one often suppresses the index in the notation for an element of the disjoint union.'''
