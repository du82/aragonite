["http://ncatlab.org/nlab/show/presentation+axiom"]
title = "presentation axiom in nLab"
full_description = '''In the foundations of mathematics, it's interesting to consider the axiom that the Category of Sets Has Enough Projectives; in short: CoSHEP (pronounced /ko:-shep/). This is more commonly known as the presentation axiom: PAx. It is a weak form of the axiom of choice. For every set AA, there exists a set PP and a surjection P→AP \to A, such that every surjection X↠PX \twoheadrightarrow P has a section. The full axiom of choice states that every surjection X→AX \to A has a section; hence in the above PP may be chosen to be AA itself. An object PP in a category CC is (externally) projective iff the hom-functor C(P,−):C→SetC(P, -): C \to Set takes epis to epis. This is the same as saying: given an epi p:B→Ap: B \to A and a map f:P→Af: P \to A, there exists a lift g:P→Bg: P \to B in the sense that f=p∘gf = p \circ g. The dual axiom, that SetSet has enough injectives (that is, every set admits an injection into an injective set) is true in every topos: every power object is an injective object, and every object XX embeds in its power object PXP X via the singleton map {⋅}:X↪PX\{\cdot\}:X\hookrightarrow P X. The existence of sufficiently many projective presentations plays a central role in homological algebra as a means to construct projective resolutions of objects. Tradtionally one often uses the axiom of choice to prove that categories of modules have enough projectives, on the grounds that the free modules are projective. But the weaker assumption of CoSHEP is already sufficient for this purpose: while not every free module will be projective, one can still use CoSHEP to find a projective presentation for every free module (and thus for every module). This is discussed in more detail here. Note that we normally assume (3) for the category of sets, which is true in any (constructively) well-pointed pretopos and true internally in any pretopos whatsoever, so one normally says that DC and CC simply follow from the existence of enough projectives (CoSHEP). Equivalently, internal DC and internal CC follow from internal CoSHEP.'''
