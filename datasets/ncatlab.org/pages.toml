["https://ncatlab.org/nlab/show/2d+TQFT"]
title = "D=2 TQFT in nLab"
full_description = "When formulated as an (only) “globally” as 1-functors on a 1-category of cobordisms (see at FQFT for more), then D=2 TQFTs have a comparatively simple classification: the bulk field theory is determined by a commutative Frobenius algebra structure on the finite dimensional vector space assigned to the circle (Abrams 96). However, such global D=2 TQFTs with coefficients in Vect do not capture the D=2 TQFTs of most interest in quantum field theory, which instead are “cohomological quantum field theories” (Witten 91) such as the topological string A-model and B-model that participate in homological mirror symmetry. These richer D=2 TQFTs are instead local TQFTs in the sense of extended TQFT, i.e. they are (∞,2)-functors on a suitable (∞,2)-category of cobordisms (see at FQFT for more), typically on “non-compact” 2-d cobordisms, meaning on those that have non-vanishing outgoing bounary. As such they are now classified by Calabi-Yau objects in an symmetric monoidal (infinity,2)-category (Lurie 09, section 4.2). For coefficients in the (∞,2)-category of (∞,2)-vector space (i.e. A-∞ algebras with (∞,1)-bimodules between them in the (∞,1)-category of chain complexes), these theories had been introduced under the name “TCFT” in (Getzler 92, Segal 99) following ideas of Maxim Kontsevich, and have been classified in (Costello 04), see (Lurie 09, theorem 4.2.11, theorem 4.2.14). The following study of the behaviour of 2-dimensional TQFTs in terms of the topology of the moduli spaces of marked hyperbolic surfaces is due to Ezra Getzler. It provides a powerful way to read off various classification results for 2d QFTs from the homotopy groups of the corresponding modular operad. Let CoreCore(FinSet) be the core of the category of finite sets. Under union of sets this is a symmetric monoidal category. Then for CC any monoidal category, a symmetric monoidal functor Let now CC be a category with weak equivalences, then we can speak of a lax symmetric opmonoidal functor"
