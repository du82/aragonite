["https://ncatlab.org/nlab/show/FQFT"]
title = "functorial field theory in nLab"
full_description = 'Functorial quantum field theory or FQFT for short, is one of the two approaches of providing a precise mathematical formulation of and of axiomatizing quantum field theory. FQFT formalizes the Schrödinger picture of quantum mechanics (generalized to quantum field theory) where spaces of quantum states are assigned to space and where linear maps are assigned to trajectories/spacetimes interpolating between these spaces. The axioms of FQFT may be understood as formulating the basic properties that the path integral or S-matrix invoked in physics ought to satisfy, if they had been given a precise definition. Much work in quantum field theory is based on arguments invoking the concept of the path integral. While in the physics literature this is usually not a well defined object, it is generally assumed to satisfy a handful of properties, notably the sewing laws. These say, roughly, that the path integral over a domain Σ\Sigma which decomposes into subdomains Σ 1\Sigma_1 and Σ 2\Sigma_2 is the same as the path integral over Σ 1\Sigma_1 composed with that over Σ 2\Sigma_2. Accordingly it is the S-matrix that is manifestly incarnated in the Atiyah-Segal picture of functorial QFT: To a codimension-1 slice M d−1M_{d-1} of space this assigns a vector space Z(M d−1)Z(M_{d-1}) – the (Hilbert) space of quantum states over M d−1M_{d-1}; to a spacetime/worldvolume manifold MM with boundaries ∂M\partial M one assigns the quantum propagator which is the linear map Z(M):Z(∂ inM)→Z(∂ outM)Z(M) : Z(\partial_{in} M) \to Z(\partial_{out} M) that takes incoming states to outgoing states via propagation along the spacetime/worldvolume MM. This Z(M)Z(M) is alternatively known as the the scattering amplitude or S-matrix for propagation from ∂ inM\partial_{in}M to ∂ outM\partial_{out}M along a process of shape MM. Now for genuine topological field theories all spaces of quantum states are finite dimensional and hence we can equivalently consider the dual vector space (using that finite dimensional vector spaces form a compact closed category). Doing so the propagator map'
