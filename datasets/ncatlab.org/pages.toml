["http://ncatlab.org/nlab/show/axiom+of+foundation"]
title = "axiom of foundation in nLab"
full_description = '''In material set theory, the axiom of foundation, also called the axiom of regularity, states that the membership relation ∈\in on the proper class of all pure sets is well-founded. In structural set theory, accordingly, one uses well-founded relations in building structural models of well-founded pure sets. then x∈Ax \in A. Such an AA may be called a membership-inductive class. Then the axiom of foundation states that the only membership-inductive class of pure sets is the class of all pure sets. In this form, the axiom of foundation is also called ∈\in-induction. Although the statement here refers to proper classes, it can also be formulated as an axiom schema that makes no mention of classes. While the statement above follows how the axiom of foundation is generally used —to prove properties of pure sets by transfinite induction—, it is complicated. Two alternative formulations are given by the following lemmas: The axiom of foundation holds if and only if there exists no infinite descending sequence ⋯∈x 2∈x 1∈x 0\cdots \in x_2 \in x_1 \in x_0. First, suppose the axiom of foundation holds, and suppose there were such a sequence. Let AA be the class of all sets which are not equal to x ix_i for any ii. Then for any xx, if xx were equal to some x ix_i, then some t∈xt\in x would also be equal to some x jx_j, namely x i+1x_{i+1}; hence if all t∈xt\in x are in AA, so is xx. Thus, by the axiom of foundation, all sets are in AA, a contradiction. Second, suppose there are no such sequences, and let AA be as in the statement of foundation. Suppose that AA does not contain all sets. Then there exists an x 0∉Ax_0\notin A. By hypothesis on AA, there must exist an x 1∈x 0x_1\in x_0 such that x 1∉Ax_1 \notin A. And hence an x 2∈x 1x_2\in x_1 such that x 2∉Ax_2 \notin A, and so on, producing an infinite descending ∈\in-sequence in contradiction to our hypothesis; hence AA must contain all sets. This is essentially a version of Fermat's method of infinite descent modified to apply to transfinite induction instead of only to ordinary induction. It arguably provides the most direct intuitive picture of what the axiom means. Note that as a special case, it implies that no set can contain itself, since then ⋯∈x∈x∈x\cdots \in x\in x\in x would be an infinite chain.'''
