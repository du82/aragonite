["https://ncatlab.org/nlab/show/Categories+and+Sheaves"]
title = "Categories and Sheaves in nLab"
full_description = "on basics of category theory and the foundations of homological algebra and abelian sheaf cohomology. The book discusses the theory of presheaves and sheaves with an eye towards their application in homological algebra and with an outlook on stacks. A self-contained introduction of the basics of presheaf-categories with detailed discussion of representable functors and the corresponding notions of limits, colimits, adjoint functors and ind-objects forms the first third of the book. The second part describes central concepts and tools of modern category-theoretic homological algebra in terms of derived triangulated categories. The last part merges these two threads in a discussion of sheaves in general and abelian sheaves in particular. This provides the machinery for the consideration of abelian sheaf cohomology conceptually embedded into the general notion of cohomology and higher stacks, on which the last section provides an outlook. The organization and emphasis of the book (for instance of the category of sheaves as a localization of the category of presheaves) makes it a suitable 1-categorical preparation for the infinity-categorical discussion of sheaves in is the natural complementary reading. In particular sections V and VII there are directly useful for supplementing the concept of geometric morphism and its relation to localization. The following lists chapterwise linked lists of keywords to relevant and related existing entries, as far as they already exist. Last revised on June 19, 2024 at 08:48:27. See the history of this page for a list of all contributions to it."
