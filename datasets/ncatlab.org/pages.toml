["https://ncatlab.org/nlab/show/Hamiltonian+operator"]
title = "Hamiltonian in nLab"
full_description = 'Disambiguation: there is an unrelated notion of a Hamilton or Hamiltonian operator also called nabla in vector analysis?. Given a Poisson manifold (X,{−,−})(X, \{-,-\}) and a vector field v∈Γ(TX)v \in \Gamma(T X) , a Hamiltonian for vv is a smooth function h v∈C ∞(X)h_v \in C^\infty(X) such that {h v,−}\{h_v,-\} is the derivation corresponding to vv. Given a classical mechanical system evolving in time, there is a symplectic manifold (or at least Poisson manifold) equipped with the vector field that generates time evolution. Its Hamiltonian is often called the Hamiltonian. This is the concept that Hamilton originally considered and which hence gives the name to the general situaiton. The simplest, so-called “natural”, Hamiltonian (function) of a dynamical system is the sum of the kinetic and potential energy: Knowing only HH as a function on phase space (so as a function of position q iq^i and momentum p ip_i), we can derive other quantities as functions on phase space. In particular, we have: * velocity, v i=∂H/∂p iv^i = \partial{H}/\partial{p_i}, * force, f i=−∂H/∂q if_i = -\partial{H}/\partial{q^i}. Setting v i=dq i/dtv^i = \mathrm{d}q^i/\mathrm{d}t and f i=dp i/dtf_i = \mathrm{d}p_i/\mathrm{d}t, we derive the equations of motion in Hamiltonian mechanics. The quantum mechanics of a point particle in the Schrödinger picture is encoded in a Hilbert space bundle ℋ→ℝ\mathcal{H} \to \mathbb{R} with connection ∇\nabla over the real line – the worldline – of the particle. For t∈ℝt \in \mathbb{R} the fiber ℋ t\mathcal{H}_t is the space of quantum states of the system, at given parameter time tt. Since this bundle is necessarily trivializable, we imagine fixing a trivialization ℋ≃ℋ 0×ℝ\mathcal{H} \simeq \mathcal{H}_0 \times \mathbb{R}. Then the flat connection on the bundle is canonically a 1-form on ℝ\mathbb{R} with values in linear operators on H\mathbf{H}. The component H∈End(ℋ)H \in End(\mathcal{H}) of this canonical 1-form is the Hamilton(ian) operator (or the quantum Hamiltonian) of the system.'
