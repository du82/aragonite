["http://ncatlab.org/nlab/show/axiom+of+choice"]
title = "axiom of choice in nLab"
full_description = 'This means: for every surjection f:A→Bf\colon A \to B of sets, there is a function σ:B→A\sigma\colon B \to A (a section), such that Note that a surjection A→BA \to B of sets can be regarded as a BB-indexed family of inhabited sets, while the existence of a section is equivalent to a choice of one element in each set of this family. This reproduces the more classical form of the axiom of choice. When the full axiom of choice fails, it may still be valid for some restricted class of objects AA and/or BB. An object BB such that any epimorphism A→BA \to B splits is called projective; this means that one can make choices ‘indexed by’ BB. Dually, an object AA such that one can make choices ‘with values in’ AA is called a choice object (this is not quite equivalent to every epimorphism A→BA \to B splitting). In this form, the axiom of choice may look less mysterious than in its original formulation. For instance, it is clear that it fails in contexts such as C=C = Top and C=C = Diff, due to the existence of nontrivial topological and smooth fiber bundles. If CC is not balanced, such as a regular or coherent category which is not a pretopos, it may be more appropriate to replace in this statement “epimorphism” by regular epimorphism (or extremal epimorphism, effective epimorphism, etc.) In SetSet (and in any topos), all of these notions of epimorphism are the same. More generally still, if CC is a site, then the axiom of choice for CC may be taken to say that any cover U→XU\to X admits a section. Obviously this refers only to singleton covers, but if CC is superextensive then any covering family (p i:U i→X) i(p_i\colon U_i \to X)_i can be replaced by a singleton cover ∐ uU i→X\coprod_u U_i \to X. However, when working in a category that has an internal logic, we may want to “internalize” the axiom of choice by asserting, not that every epimorphism has a section, but that the statement “every epimorphism has a section” is true in the internal logic (or more precisely the stack semantics). An equivalent statement is that every object is internally projective. We call this the internal axiom of choice.'
