["http://ncatlab.org/nlab/show/Markov%27s+principle"]
title = "Markov's principle in nLab"
full_description = '''In constructive mathematics, Markov's principle is the (classically trivial) statement that any infinite sequence of 00 and 11 that is not all 11s must have a 00 somewhere. Stated in a more logical form, if PP is a predicate on natural numbers, then which is a theorem of intuitionistic logic. More generally, a set SS may be called Markovian if this principle holds for all predicates on SS. Every Kuratowski-finite set is Markovian, for example. Markov's principle is often stated in terms of infinite sequences of natural numbers, using Greek letters for sequences and Latin letters for individual numbers: Here, P(n)P(n) is the statement that α n=0\alpha_n = 0, and the hypothesis ∀n(P(n)∨¬P(n))\forall{n} (P(n) \vee \neg{P(n)}) is true for any sequence of natural numbers. Conversely, given any predicate PP satisfying this hypothesis, we can define α\alpha by α n=0\alpha_n = 0 if P(n)P(n) is true and α n=1\alpha_n = 1 if P(n)P(n) is false, so the two versions of Markov's principle are equivalent. In standard constructive mathematics (such as in the internal logic of a topos), it is possible that the only Markovian sets are the Kuratowski-finite sets. Thus, Markov's principle, stating that the set of natural numbers is Markovian, is nontrivial. (It is true, of course, in a Boolean topos; that is, Markov's principle follows from the principle of excluded middle.) Andrey Markov Jr (the one who proved undecidability theorems, and son of the great stochastician) belonged to the Russian school of constructivism, which saw mathematics as about computability. From this perspective, Markov's principle is justified as follows: We are justified in concluding ∃n¬P(n)\exists{n}\, \neg{P(n)} if we can actually compute a value of nn such that ¬P(n)\neg{P(n)} can be proved; since PP is decidable, it's enough to compute nn such that ¬P(n)\neg{P(n)} is true. And to compute this, you just set a computer working, deciding P(0),P(1),P(2),…P(0), P(1), P(2), \ldots, until it finds nn. Other constructivists find this argument unconvincing, since they're not convinced that the computer will ever stop, even though it's impossible that it continue forever.'''
