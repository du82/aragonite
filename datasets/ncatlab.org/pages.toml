["https://ncatlab.org/nlab/show/AKSZ+theory"]
title = "AKSZ sigma-model in nLab"
full_description = 'What is called the AKSZ formalism – after the initials of its four authors – Alexandrov, Maxim Kontsevich, Albert Schwarz, Oleg Zaboronsky – is a technique for constructing action functionals in BV-BRST formalism for sigma model quantum field theories whose target space is an symplectic Lie n-algebroid (𝔓,ω)(\mathfrak{P}, \omega). The action functional of AKSZ theory is that of ∞-Chern-Simons theory induced from the Chern-Simons element that correspondonds to the invariant polynomial ω\omega. Details on this are at ∞-Chern-Simons theory – Examples – AKSZ theory. whose action functional is, apart from a kinetic term, the transgression of some kind of cocycle on XX to the mapping space Map(Σ,X)\mathrm{Map}(\Sigma,X). Here the terms “space”, “maps” and “cocycles” are to be made precise in a suitable context. One says that Σ\Sigma is the worldvolume, XX is the target space and the cocycle is the background gauge field . For instance the ordinary charged particle (for instance an electron) is described by a σ\sigma-model where Σ=(0,t)⊂ℝ\Sigma = (0,t) \subset \mathbb{R} is the abstract worldline, where XX is a smooth (pseudo-)Riemannian manifold (for instance our spacetime) and where the background cocycle is a circle bundle with connection on XX (a degree-2 cocycle in ordinary differential cohomology of XX, representing a background electromagnetic field : up to a kinetic term the action functional is the holonomy of the connection over a given curve ϕ:Σ→X\phi : \Sigma \to X. The σ\sigma-models to be considered here are higher generalizations of this example, where the background gauge field is a cocycle of higher degree (a higher bundle with connection) and where the worldvolume is accordingly higher dimensional – and where XX is allowed to be not just a manifold but an approximation to a higher orbifold (a smooth ∞-groupoid). More precisely, here we take the category of spaces to be smooth dg-manifolds. One may imagine that we can equip this with an internal hom Maps(Σ,X)\mathrm{Maps}(\Sigma,X) given by ℤ\mathbb{Z}-graded objects. Given dg-manifolds Σ\Sigma and XX their canonical degree-1 vector fields v Σv_\Sigma and v Xv_X acting on the mapping space from the left and right. In this sense their linear combination v Σ+kv Xv_\Sigma + k \, v_X for some k∈ℝk \in \mathbb{R} equips also Maps(Σ,X)\mathrm{Maps}(\Sigma,X) with the structure of a differential graded smooth manifold.'
