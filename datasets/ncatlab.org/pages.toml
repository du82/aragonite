["https://ncatlab.org/nlab/show/Chern-Simons+theory"]
title = "Chern-Simons theory in nLab"
full_description = 'Topological Physics – Phenomena in physics controlled by the topology (often: the homotopy theory) of the physical system. The words “Chern–Simons theory” (after Shiing-shen Chern and James Simons who have their names attached to the Chern-Simons elements and Chern-Simons forms and Chern-Simons circle 3-bundle involved) can mean various things to various people, but it generally refers to the three-dimensional topological quantum field theory whose configuration space is the space of GG-principal bundles with connection on a bundle and whose Lagrangian is given by the Chern-Simons form of such a connection (for simply connected GG), or rather, more generally, whose action functional is given by the higher holonomy of the Chern-Simons circle 3-bundle. In other words, for GG a Lie group, Chern-Simons theory is a sigma-model TQFT whose target space is the smooth moduli stack BG conn\mathbf{B}G_{conn} of GG-principal connections, and whose background gauge field is a circle 3-bundle with connection on BG conn\mathbf{B}G_{conn}. The higher Chern class/Dixmier-Douady class of this three bundle is the level of the Chern-Simons theory. For GG semisimple this is the ∞-Chern-Simons theory induced from the canonical Chern-Simons element on a semisimple Lie algebra 𝔤\mathfrak{g}. For the special case that GG is a discrete group the theory reduces to the (much simpler) Dijkgraaf-Witten theory. The properties of the field configuration space of Chern-Simons theory depends on the properties of its gauge group GG. If GG is a simply connected Lie group, then the configuration space is isomorphic simply to the space of Lie algebra valued 1-forms on the given base manifold. Generally, though, it is given by GG-principal bundles with connection. We discuss the first case separately Let 𝔤\mathfrak{g} be a semisimple Lie algebra and write ⟨−,−⟩∈W(𝔤)\langle -,-\rangle \in W(\mathfrak{g}) for (some multiple of) its Killing form invariant polynomial (in the Weil algebra of 𝔤\mathfrak{g}).'
