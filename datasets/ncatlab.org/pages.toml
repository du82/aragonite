full_description = 'fundamental ∞-groupoid in a locally ∞-connected (∞,1)-topos/of a locally ∞-connected (∞,1)-topos which discusses the higher category theory of (∞,1)-categories in general and that of (∞,1)-categories of (∞,1)-sheaves (i.e. of ∞-stacks) – called (Grothendieck-Rezk-Lurie) (∞,1)-toposes – in particular; arXiv:math.CT/0608040 – this has been updated since the publication of the print version, including addition of some new material! One can think of Lurie’s book as a comprehensive study of the generalization of the above statement from 11 to (∞,1)(\infty,1) (recall the notion of (n,r)-category): Based on work by André Joyal on the quasi-category model for (∞,1)-categories, Lurie presents a comprehensive account of the theory of (∞,1)-categories including the definitions and properties of all the standard items familiar from category theory (limits, fibrations, etc.) Given the (∞,1)(\infty,1)-categorical machinery from the first part there are natural (∞,1)(\infty,1)-categorical versions of (∞,1)(\infty,1)-presheaf and (∞,1)(\infty,1)-sheaf categories (i.e. (∞,1)(\infty,1)-categories of ∞-stacks): the “∞\infty-topoi” that give the book its title (more descriptively, these would be called “Grothendieck (∞,1)(\infty,1)-topoi”). Lurie investigates their properties in great detail and thereby in particular puts the work by Brown, Joyal, Jardine, Toën on the model structure on simplicial presheaves into a coherent (∞,1)(\infty,1)-categorical context by showing that, indeed, these are models for ∞-stack (∞,1)-toposes. The book Higher topos theory together with Lurie’s work on Stable ∞-Categories is close to an (∞,1)(\infty,1)-categorical analog of the 1-categorical material as presented for instance in The book discusses crucial concepts and works out plenty of detailed properties. On first reading it may be helpful to skip over all the technical parts and pick out just the central conceptual ideas. These are the following:'
