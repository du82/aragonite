["https://ncatlab.org/nlab/show/BV-BRST+formalism"]
title = "BV-BRST formalism in nLab"
full_description = 'In physics and specifically in field theory, the BV-BRST formalism is a tool in homological algebra, higher differential geometry and derived geometry to handle the intersection- and quotient-constructions that appear in the construction of reduced phase spaces of Lagrangian field theories, in particular including gauge theories; (“Lagrangian BV”) In either case the BRST-BV complex C ∞(P BV)C^\infty(P^{BV}) is a model in dg-geometry of a joint homotopy intersection and homotopy quotient, hence of an (∞,1)-colimit and (∞,1)-limit, of a space in higher differential geometry/derived geometry. The classical Lagrangian BV-BRST complex of a Lagrangian field theory is, under suitable conditions, a homological resolution of the homotopy intersection with the Euler-Lagrange equations of motion (this is the BV part) of the homotopy quotient by the infinitesimal symmetries of the Lagrangian (this is the BRST part), and hence a homological model of the reduced phase space of the Lagrangian field theory. We discuss here the interpretation of the quantum BV-complex as a homological implementation of integration thought of as path integral-quantization (in perturbative quantum field theory). We indicate how on a finite dimensional smooth manifold the BV-algebra appearing in Lagrangian BV-formalism is the dual of the de Rham complex of configuration space in the presence of a volume form and how, by extention, this allows to interpret the BV-complex as a means for defining (path-)integration over general configuration spaces of fields by passing to BV-cochain cohomology. (The interpretation of the BV-differential as the dual de Rham differential necessary for this is due to (Witten 90) (Schwarz 92). A particularly clear-sighted account of the general relation is in Gwilliam 2013 ). Further below we discuss the generalization of these relation in terms of Poincaré duality on Hochschild (co)homology. The path integral in quantum field theory is supposed to be the integral over a configuration space XX of fields ϕ\phi using a measure μ S\mu_S which is thought of in the form'
