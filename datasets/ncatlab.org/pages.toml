["https://ncatlab.org/nlab/show/Green-Schwarz+mechanism"]
title = "Green-Schwarz mechanism in nLab"
full_description = 'A Green-Schwarz mechanism (named after Michael Green and John Schwarz) is a modification of an action functional of a quantum field theory involving higher gauge fields that makes a quantum anomaly of the original action functional disappear. An action functional in path integral quantization is said to be anomalous if it is only locally identified with a function on the configuration space of fields, but is globally instead a section of a line bundle (usually equipped with connection). Given two anomalous action functionals in this sense, it may happen that while the two corresponding line bundles on configuration space are each nontrivial, their tensor product becomes trivializable. In this case one can consider the non-anomalous action function given by the sum of the two anomalous action functionals. This is what is called anomaly cancellation of one piece of an action functional against another. the action functional for differential cocycles (higher connection, higher gauge theory) in the presence of electric and magnetic charges: A Green–Schwarz mechanism is the addition of an action functional for higher differential cocycles with magnetic charges such that their quantum anomaly cancels a given Pfaffian line bundle: so it is a choice of by itself ill-defined action functional for higher gauge theory that cancels the ill-definedness of an action functional for chiral fermions. In the more strict and original sense of the word, the Green–Schwarz mechanism is the application of this procedure in the theory called heterotic supergravity: there it so happens that the Pfaffian line bundle of the fermionic action has as Chern class the transgression of a degree-12 class in ordinary differential cohomology that factorizes as I 8∧I 4I_8 \wedge I_4. Since heterotic supergravity contains a higher gauge field that couples to strings, this is precisely of the form J electric∧J magneticJ_{electric} \wedge J_{magnetic} that the anomaly for the corresponding higher gauge theory in the presence of magnetic charges gives rise to. So the original Green–Schwarz anomaly cancellation mechanism consist of modifying the “naive” action functional for heterotic supergravity by adding the contribution that corresponds to adding a magnetic current of the form'
