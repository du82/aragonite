["https://ncatlab.org/nlab/print/HomePage"]
title = "nLab"
full_description = "This is a wiki for collaborative work on Mathematics, Physics, and Philosophy — especially (but far from exclusively) from the higher structures point of view: with a sympathy towards the tools and perspectives of homotopy theory/algebraic topology, homotopy type theory, higher category theory and higher categorical algebra. The nLab records and explores a wide range of mathematics, physics, and philosophy. Along with work of an expository nature, original material can be found in abundance, as can notes from evolving research. Where mathematics, physics, and philosophy arise in other fields, computer science and linguistics for example, the nLab explores these too. If you take a little time to find something in the literature, or to work through a proof or example, or to find an intuitive or new way to think about something, add a note on it to the nLab! Others will benefit, and you may well find that it proves useful to you too. A fundamental idea behind the nLab is that the linking between pages of a wiki is a profound way to record knowledge, placing it in a rich context. Most nLab pages have a corresponding discussion thread at the nForum, linked to in the menus at the top and bottom of the page. For all but the most trivial edits (correcting spelling or punctuation, etc), we ask that you announce your changes at the nForum using the box at the bottom of the edit page. Typically this would be a short note summarising what you have done, but it can also include what you plan to do, or what you would like others to do! See Welcome to the nForum for more on the nForum. If you have any questions about an nLab page, or would like to discuss or make a comment upon something in it, whether because you feel that something is wrong or missing or for any other reason, you are encouraged and very welcome to use the nForum discussion thread for the page for this purpose too. If the discussion thread does not yet exist, feel free to create it manually: use the ‘nLab - Latest changes’ category, and give it the same title (case-sensitive!) as the nLab page."
