["http://ncatlab.org/nlab/show/perfect+space"]
title = "perfect space in nLab"
full_description = '''see also differential topology, algebraic topology, functional analysis and topological homotopy theory sequentially compact, countably compact, locally compact, sigma-compact, paracompact, countably paracompact, strongly compact quotient projections out of compact Hausdorff spaces are closed precisely if the codomain is Hausdorff Georg Cantor used to define the continuum as a perfect space that is connected as well. Hence, the property of ‘being perfect’, as the name indicates as well, can be viewed as forming part of the concept of a ‘prototypical’ topological space. A topological space XX is perfect if it has no isolated points, i.e., if every point xx belongs to the topological closure of its complement X∖{x}X \setminus \{x\}. Sometimes one requires a perfect space to be inhabited (nonempty), although it is better to allow the empty space. In a topological space XX, a subset is said to be perfect if it is closed in XX and perfect in its subspace topology. In other words, a set AA is perfect if and only if it equals its set A′A' of accumulation points. Because of the closure requirement, being a perfect set/subset/subspace depends on the ambient space and is stronger than being a perfect space. (But XX is a perfect subset of itself iff XX is a perfect space.) In a topological space XX, a subset AA has the perfect-set property if it is either countable (possibly finite or even empty) or has an inhabited perfect subset. Of course, any perfect set has the perfect-set property. If for each set BB, (BB has a point apart from each point in AA if BB is inhabited and BB is perfect) and (BB is empty if BB is contained in AA and BB is perfect) and (BB has an isolated point if BB is contained in AA and inhabited), then AA is countable. The Cantor space 2 ℕ2^\mathbb{N} is perfect, in fact, it is the only totally disconnected, compact, metrizable space that is perfect. Every Polish space (including the previous two examples) is perfect. Furthermore, any closed subset of a Polish space has the perfect-set property.'''
