["http://ncatlab.org/nlab/show/%28classical%29+axiom+of+multiple+choice"]
title = "(classical) axiom of multiple choice in nLab"
full_description = 'This article is about a classical set theory axiom. Some literature instead uses this name for an unrelated weakening of AC. For that notion, see axiom of multiple choice. The axiom of multiple choice (AMC) weakens the axiom of choice by allowing choice functions to choose finite sets, rather than particular elements. For every set SS of non-empty sets, there is a function ff defined on SS such that ∀X∈S\forall X\in S, f(X)∈Xf(X)\in X. For every set SS of non-empty sets, there is a function ff defined on SS such that ∀X∈S\forall X\in S, f(X)⊆Xf(X)\subseteq X and f(X)f(X) is finite and non-empty. The axiom of multiple choice is equivalent to the axiom of choice modulo ZF set theory. However, it is strictly weaker in ZFA and other similar set theories. AMC holds in any permutation model with finite supports where each atom has a finite orbit. For a detailed proof, see Jech’s “The Axiom of Choice”, chapter 9. The constructive axiom by the same name is not historically related, and the two axioms are independent. Any permutation model will satisfy SVC, which Rathjen proves implies the constructive axiom, but this AMC can fail in a permutation model. Last revised on December 30, 2024 at 18:54:29. See the history of this page for a list of all contributions to it.'
