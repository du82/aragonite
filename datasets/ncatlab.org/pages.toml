["http://ncatlab.org/nlab/show/Grothendieck+universe"]
title = "Grothendieck universe in nLab"
full_description = 'Problems of set theory arise by the unjustified recursion of the naive notion of a ‘collection of things.’ If ‘Col’ is one notion of collections (such as ‘Set’ or ‘Class’), then the notion ‘Col of all Cols’ is in general problematic, as it is subject to the construction of Russell-style paradoxes (although it is not the only source of such paradoxes). One way out is to consider a hierarchy of notions of collections: Postulate that the collection of all ‘Col’s is not a ‘Col’ itself but instead is another notion of collection, ‘Col+’. We may thus speak of the ‘Col+ of all Cols.’ Similarly, the collection of all ‘Col+’-type collections may be taken to be ‘Col++,’ and so on. One formalization of this idea is that of a Grothendieck universe. This is defined to be a set U U that behaves like a ‘set+ of all sets’ in that all the standard operations of set theory (union, power set, etc.) can be performed on its elements. Although developed for application to category theory, the definition is usually given in a form that only makes sense in a membership-based set theory. On this page, we consider only that version; for a form that makes sense in structural set theory, please see universe in a topos. Some authors leave out (3), which allows the empty set ∅ \varnothing itself to be a Grothendieck universe. Other authors use the set ℕ \mathbb{N} of natural numbers in place of ∅ \empty in (3), which prevents the countable set V ω V_{\omega} of hereditarily finite sets from being a Grothendieck universe. From the definition above, one can prove additional closure properties of a universe U U , including the usual codings in pure set theory of function sets and cartesian products and disjoint unions of sets, using the following lemmata: By (2), 𝒫(u)∈U \mathcal{P}(u) \in U . Then as t∈𝒫(u) t \in \mathcal{P}(u) , we have t∈U t \in U by (1). As ∅∈U \empty \in U by (3), so are ⋆=df𝒫(∅) \star \stackrel{\text{df}}{=} \mathcal{P}(\empty) and TV=df𝒫(⋆) TV \stackrel{\text{df}}{=} \mathcal{P}(\star) by (2). Even in constructive mathematics, 2={⊥,⊤} 2 = \{ \bot,\top \} is a subset of TV TV , so 2∈U 2 \in U by Lemma 1. Then (⊥↦u,⊤↦v) (\bot \mapsto u,\top \mapsto v) is a function from 2→U 2 \to U , so the union u∪v u \cup v in U U by (4).'
