["https://ncatlab.org/nlab/show/%28%E2%88%9E%2Cn%29-category+of+cobordisms"]
title = "(infinity,n)-category of cobordisms in nLab"
full_description = 'flavors of bordism homology theories/cobordism cohomology theories, their representing Thom spectra and cobordism rings: nn-Dimensional manifolds (possibly and usually equipped with certain structure, notably for instance with orientation, framing-structure or more general G-structure) should naturally form an (∞,n)-category of extended cobordisms whose Here is an outline of the idea of the definition of Bord (∞,n)Bord_{(\infty,n)} as given in (Lurie) where the main point, apart from the (∞,n)-category machinery in the background, is definition 2.2.9. The idea is to start with thinking of nn-dimensional cobordisms as forming something like an n-fold category by simply saying that the collection of composites of cobordisms is given by big cobordisms with markings on them, indicating where we think of them as being composed. Let’s first do this for composition in one direction, as in an ordinary 1-category of nn-dimensional cobordisms. Consider a manifold X↪V×ℝX \hookrightarrow V \times \mathbb{R} embedded in a vector space of the form V×ℝV \times \mathbb{R}. We can think of this as a manifold canonically equipped with a coordinate function ϕ:X↪V×ℝ→ℝ\phi : X \hookrightarrow V \times \mathbb{R} \to \mathbb{R} that measures the “height” or maybe better the “length” of the embedded manifold. We can pick a bunch of numbers {t j∈ℝ}\{t_j \in \mathbb{R}\} and think of these as marking a bunch of slices of XX, the preimages ϕ −1(t j)\phi^{-1}(t_j). We can think of these slices as being the (n−1)(n-1)-dimensional boundary manifolds at which a sequence of manifolds have been glued together to produce XX. (there is an obvious picture to be drawn and uploaded here, maybe somebody finds the time and energy) In this way an embedded manifold X↪V×ℝX \hookrightarrow V \times \mathbb{R} and a set of kk-numbers {t i}\{t_i\} may represent an element in the space of sequences of composable cobordisms. To make this work as expected, the markings on XX may not be too irregular, so we should impose some conditions on what qualifies as a marked manifold. The precise statement is given further below.'
