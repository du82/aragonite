["https://ncatlab.org/nlab/show/A-model"]
title = "A-model in nLab"
full_description = 'What is called the A-model topological string is the 2-dimensional topological conformal field theory corresponding to the Calabi–Yau category called the Fukaya category of a symplectic manifold (X,ω)(X,\omega). This is the Poisson sigma-model of the underlying Poisson manifold after appropriate gauge fixing (AKSZ 97, p 19). The A-model on XX is effectively the Gromov–Witten theory of XX. The A-model arose in formal physics from considerations of superstring-propagation on Calabi-Yau spaces: it may be motivated by considering the vertex operator algebra of the 2dSCFT given by the supersymmetric sigma-model with target space XX and then deforming it such that one of the super-Virasoro generators squares to 00. The resulting “topologically twisted” algebra may then be read as being the BRST complex of a TCFT. One can also define an A-model for Landau–Ginzburg models. The category of D-branes for the corresponding open string theory is given by the Fukaya–Seidel category. The action functional of the A-model is that associated by AKSZ theory to a Lagrangian submanifold in a target symplectic Lie n-algebroid which is the Poisson Lie algebroid of a symplectic manifold. On coisotropic branes in symplectic target manifolds that arise by complexification of phase spaces, the boundary path integral of the A-model computes the quantization of that phase space. For details see The second quantization effective background field theory defined by the perturbation series of the A-model string has been argued to be Chern-Simons theory. (Witten 92, Costello 06) For more on this see at TCFT – Worldsheet and effective background theories. A related mechanism is that of world sheets for world sheets. That the A-model Lagrangian arises in AKSZ theory by gauge fixing the Poisson sigma-model was observed in Discussion of how the second quantization effective field theory given by the A-model perturbation series is Chern-Simons theory is in Last revised on May 6, 2021 at 22:32:50. See the history of this page for a list of all contributions to it.'
