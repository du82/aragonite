["https://ndepend.com/docs/ndepend-github-action"]
title = "NDepend GitHub Action"
description = "How to use the NDepend GitHub Action"
full_description = "This GitHub Action lets run an NDepend analysis after each rebuild and explore results in a shared interactive HTML+js report (see some sample reports here). Reports generated by the GitHub action contain links to code source hosted by GitHub. This Action can also fail the build upon some Quality Gate(s) failure and provide code quality estimations for each build or each pull-request. With a Developer license, the standalone app VisualNDepend.exe or the NDepend Visual Studio extension can download the NDepend Github Action analysis results locally for further exploration. From the left side bar goto Secrets > Actions, create a new secret named NDependLicense and paste the trial activation data obtained. The NDepend GitHub Action license activation is similar to the trial activation explained above. Associate your license key XYZ with your GitHub account from this url: https://www.ndepend.com/activation_githubaction?license=XYZ From there you obtain a textual activation data. Then go to the Settings of your GitHub repository. From the left side bar goto Secrets > Actions, create a new secret named NDependLicense and paste the textual activation data obtained. The ndepend action must be added after your build and unit testing actions, note that only the license parameter is mandatory. After the analysis, the ndepend result is stored as an artifact of your build, and to explore it you have two options: A quality gate is a code quality goal. Such quality goal must be enforced before releasing and eventually, before committing to source control. A dozen of default quality gates are proposed by NDepend. They are related to measures like technical debt amount, code coverage or amount of issues with particular severity. NDepend makes it easy to modify existing quality gates or create your own ones. This is explained here. If the build fails because of a quality gate failure and this option stopIfQGFailed, this is explained with an annotation: The detail of which quality gate(s) fail is then shown in the build summary (see the screenshot below in the next section)."
year_published = 2025
