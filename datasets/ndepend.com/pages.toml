["https://ndepend.com/docs/azure-devops-tfs-vsts-integration-ndepend"]
title = "Integrate NDepend with Azure DevOps"
description = ".NET Code Quality in Azure DevOps with the NDepend ADO Extension"
full_description = "Yes the extension supports both versions : Azure DevOps Services for the cloud version and Azure DevOps Server for the on-premises version. The NDepend extension does not use an endpoint to do the analysis. The NDepend tool is embedded in the extension and all the results are stored as a build artifacts in your server. No data goes outside of your server. To analyse an assembly , NDepend needs also its ODB file. And if for some assemblies the PDB file is not generated the assembly will not be parsed. More information in the Understand the NDepend Analysis Inputs documentation. To exclude some of your projects, you have to specify an NDepend project file (.ndproj extension) to your task. In such NDepend project you can specify the assemblies to analyze, and enable the Analyze only the assemblies from the NDepend Task flag (see the screenshot in the Build Task section of this documentation). The coverage ratio reported by the NDepend Azure DevOps/TFS extension can differ from the one you get from Visual Studio. This is because the NDepend coverage doesn't consider C# open and close braces characters { } as line of code that can be tested. If the discrepency is too high to be explained this way, maybe you need to take account of a .runsettings file during NDepend analysis. How to specify a .runsettings file is explained here. To have the same results you have to use the same .ndproj project file, define the same baseline and import the same coverage data. The NDepend Azure DevOps extension consists of a build task that analyses code and code coverage data yielded by the build process. The NDepend Azure DevOps/TFS hub presents the results which embed the NDepend dashboard and makes data actionable by drilling down into any item through a single click. The hub's Dashboard shows a recap of the most relevant data including technical debt estimations, code size, Quality Gates status, rules and issues numbers. A TFS build can be used as a baseline. All dashboard data is then diff-ed since the baseline. Each Dashboard item is clickable to view more."
year_published = 2025
