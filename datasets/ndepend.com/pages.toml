["https://ndepend.com/docs/devops-quality-gate-strategy"]
title = "Implement a Quality Gate strategy in your DevOps to fail the build when required"
description = "Implement a Quality Gate strategy in your DevOps to fail the build when some comitted code does'nt respect quality criterias"
full_description = "A quality gate is a code quality goal. A quality goal must be enforced before releasing and eventually, before committing to source control. A dozen of default Quality Gates are proposed by NDepend related to measures like technical debt amount, code coverage or amount of issues with particular severity. Quality Gates can be used to fail the build when certain criteria are not-verified. When at least one quality gate fails, NDepend.Console.exe returns a non-zero value that can be used to fail the build. In the Azure DevOps / TFS extension there is the setting Stop the build when at least one Quality Gate fails. The NDepend GitHub Action proposes a setting stopIfQGFailed to fail the build if at least one Quality Gate fails. What makes NDepend unique is that a quality gate is a textual C# LINQ Query that can be easily created, edited and customized. For example if you wish to enforce a certain amount of code coverage through a quality gate, you can just write: Notice also the special clauses failif (mandatory clause) and warnif (optional clause) that are specific to NDepend CQLinq. codebase.PercentageCoverage is actually a C# statement that NDepend evaluates. Both the quality gate fail/warn thresholds and its logic are embedded into a short textual query that can be easily edited. The quality gate logic can query anything:"
year_published = 2025
clearnet = "https://ndepend.com/docs/devops-quality-gate-strategy"
