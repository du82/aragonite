["https://ndepend.com/docs/Getting-Started-With-NDepend-Linux-macOS"]
title = "Getting Started with NDepend on Linux and macOS"
description = "A getting started guide and documentation for NDepend on Linux and macOS, the .NET static analysis and data visualization tool."
full_description = '''The primary goal of using NDepend.Console.MultiOS.dll on macOS or Linux is to generate code quality reports from a CI/CD pipeline. See some sample reports below.. We have plans to integrate with IDEs on macOS and Linux (Visual Studio for Mac, Rider, VS Code...) but we are not there yet. To run NDepend on macOS or Linux pre-installating .NET 9.0 or .NET 8.0 or .NET 7.0 is required. It can be downloaded from the official Microsoft page. Then download the NDepend zip redistributable that works on Windows, Linux and macOS. It is recommended to unzip the NDepend files in the /home/$user$/ndepend folder. This way no permission access exception should be thrown. ./net9.0/NDepend.Console.MultiOS.dll is a net9.0 cross-platform dll with entry point. Start evaluation with the command switch RegEval. (Same for ./net8.0 or ./net7.0) Here is an alternative guide by Nadir Badnjevic that could be helpful: "How to Set Up and Use NDepend on macOS for .NET Development." More information about report generation in the section Run an analysis and build a report below. Notice that on Linux and macOS the 4 diagrams are not yet generated. You can generate the report using a trial license, a Build-Machine license or with the NDepend GitHub Action, which requires a GitHub Action license. NDepend.Console.MultiOS.dll can be used with these arguments to register or unregister NDepend on a Linux or macOS machine (case-insensitive): A switch can be used as-is like RegEval or preceded by variousindicator like /RegEval, -RegEval or --RegEval. Each of these operation requires internet access to do a roundtrip with the NDepend server. If the current machine doesn't have internet access, a procedure is proposed to complete the operation by accessing manually the NDepend server from a connected machine. Notice that on Windows, a license key registered from NDepend v2021.1 (or lower) doesn't work with v2021.2 (or upper) NDepend.Console.MultiOS.dll. The reason is that .NET Core only supports Rijndael encryption algorithm with a block size of 128 bits while we used to rely on 256 bits in NDepend v2021.1 and lower (as shown in .NET Core source code).'''
