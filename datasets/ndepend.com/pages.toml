["https://ndepend.com/features"]
title = "NDepend Product Features"
description = '''
Product Features
					                NDepend is a .NET tool that provides deep insight into code bases.                                    The tool empowers developers, architects and executives to make intelligent decisions on projects.                                    The community name it the "Swiss Army Knife" for .NET programmers.'''
full_description = "Code Rule and Code Query Hundreds of default code rules to check against best practices. Support for Code Query over C# LINQ (CQLinq) to easily customize rules and query code. Powerful Dependency Graph and Matrix Explore how the code is actually structured and shed light on architectural flaws thanks to the most powerful code dependency graph and dependency matrix available in the tool industry. Smart Technical Debt Estimation For each issue, the cost to fix and the severity are estimated through smart and customizable C# formulas. Thus estimations proposed are realistic. Interactive Web Report Integrate NDepend analysis into your CI / CD pipeline and obtain interactive and detailed web reports to explore progression and prevent code quality degradation. Quality Gates Fail the build pipeline upon customizable PASS / WARN / FAIL code quality and security criteria. Import Roslyn and ReSharper Issues Gain a 360 view of your .NET code quality by importing your preferred Roslyn Analyzers' issues and ReSharper Code Inspections' issues into the NDepend web report and UI. Code Quality and Code Metrics Lines of Code, Cyclomatic Complexity, Coupling, Nesting Depth, Rank, NDepend supports them all (and much more). Trend Monitoring Get Trend Charts about pretty much any code metrics to master the evolution of your application. Harness Test Coverage Data Import test coverage data, and make the most of it in the NDepend feature-rich context. Code Diff since Baseline Compare two versions of a code base and its issues set, and browse diff and changes in any way you can think of. Warnings on Build Process Health Be warned of potential build process problems before they end up causing friction and pain. Detect Dependency Cycles Get rid of dependency cycles between components to achieve higher code maintainability. Enforce Immutability and Purity NDepend helps maintaining clean side-effects free code to write highly maintainable products. Real-World Proof Integrate with Visual Studio, Azure DevOps, GitHub and any other CI/CD pipeline, super fast and lightweight analysis, NDepend is conceived for real-world programmers."
