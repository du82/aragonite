["https://ndepend.com/Docs/Visual-Studio-Dependency-Graph"]
title = "Visual Studio - Explore existing .net code architecture"
description = "In this article you'll learn how to benefit from NDepend's dependency graph in order to explore your existing code architecture in the most comprehensive way."
full_description = "The NDepend dependency graph has been completely rebuilt within NDepend version 2020.1 released in April 2020. You might have used the NDepend dependency graph in the past but the new graph is certainly worth a try because it represents an important milestone in how code can be explored and navigated. Depending on the size of the application the default application map is made of application assemblies, namespaces, types or members. The algorithm to chose the level of elements shown on map is simple: it attempts to have around 1.000 elements. Search for elements by name on large graphs consisting of hundreds or thousands of elements in real-time. The short animation below searches all namespaces whose names contain the string customer, selects them and then expands them to show all their children classes. Files and Directories in the Visual Studio Solution Explorer can be dragged and dropped onto the graph. The short animation below shows a graph made of 15,000+ classes of .NET Core 3 with a zoom on System.String and then System.Dictionary<K,V>. Visually cluster nodes have an hexagonal honeycomb icon and their borders are dotted. Edges between cluster nodes are also dotted. Note that the number in parenthesis near Filter counts the number of code elements actually filtered-out. Instead of saving a list of elements shown on graph, the list of actions that leads to the persisted graph is persisted. This way the graph remains in-sync with changes when the code changes. If a pivot element is missing, like for example when attempting to restore an inheritance graph rooted on a base class removed or renamed, the load operation fails and a message is shown to the user explaining that a pivot element cannot be found by name. To get an inheritance graph just select one or several interfaces and click the link Classes Implementer in the navigation bar, or select one or several base classes and click the link Derived Classes in the navigation bar. It is often needed to know the types and methods involved in the coupling between two assemblies or two namespaces. Especially when we want to anticipate the impact of a refactoring."
