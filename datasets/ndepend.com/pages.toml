full_description = '''See Reporting Roslyn Analyzers' Issues that explains the benefit of importing Roslyn Analyzers's Issues with NDepend. When an NDepend project references one or several .NET solution file(s) the tool expects to collect Roslyn Analyzers' issues in .json files in the directory $(SolutionDir)\.sarif. The json format expected to describe issues to import is SARIF (Static Analysis Results Interchange Format). SARIF is not just about Roslyn Analyzers. Any .NET tool exporting code issues in a SARIF file format can be used, like for example, some custom tools in your company. To obtain SARIF .json files in a directory $(SolutionDir)\.sarif just create the file $(SolutionDir)\Directory.Build.Props that contains: When this Directory.Build.Props file exists, when compiling a solution, a file named ProjectFileName.json is created for each project in the directory $(SolutionDir)\.sarif. This file contains Roslyn Analyzers issues described through the SARIF format. Roslyn Analyzers issues are first-class citizens in NDepend. They are shown side by side with issues generated by CQLinq rules and ReSharper Code Inspections everywhere in the product. The file $(SolutionDir)\Directory.Build.Props can also be used to define one or several Roslyn Analyzers suite(s) applied to the projects of the solution. For example you might want to use... To avoid having duplicated rules you can turn-off some Roslyn Analyzers in a file named $(SolutionDir)\.editorconfig This way:'''
