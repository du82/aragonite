["https://ndi.video/industries/cloud"]
title = "NDI for Remote Cloud Productions: Increase your possibilites"
description = "Remote productions around the world are adopting NDI connectivity technology to set up the most flexible and cost-effective cloud workflows."
full_description = "Remote productions all around the world are adopting NDI connectivity technology as the backbone of their infrastructure to set up the most flexible and cost-effective cloud workflows in the business. Scale your operations as your needs evolve, accommodating varying levels of production without the need for significant upfront investment in physical hardware and infrastructure. NDI allows the production of live content using only software applications. Combining these elements with virtualization provides a unique opportunity where the cost per output is a fraction of what a traditional system costs, ensuring more return on investment. Cloud live productions are also carbon-efficient, as they can be delivered by remote teams. There is no need for OB trucks and large crews to be sent to the locations, saving on expenses and emissions. NDI consistently performs in workflows using multiple protocols. Whether you’re using SDI, SRT, HDMI, or all at the same time, NDI will enable seamless connections and smoother streaming. NDI also supports various codecs, like our proprietary SpeedHQ, found on the NDI High Bandwidth format, AVC (H.264), and HEVC (H.265), found on the NDI HX formats. NDI operates bi-directionally, with many streams on a shared connection. It’s resolution and frame-rate-independent and supports 4K resolutions and beyond. It also provides embedded alpha channel support, a unique feature in Video over IP, and custom per-channel metadata. NDI is natively unicast and doesn’t require strong synchronization technology, enabling you to send unlimited audio channels* over a single NDI stream. Today, leading cloud-based video editing and management platforms like BirdDog Connect, Ross Production Cloud, Vizrt’s Viz Now, or CloudMX Audio Mixer from Waves support NDI. NDI is also a standard connectivity feature in over 700 hardware products, including cameras, displays, and mixers. You’ll always find the right solution for your workflows. Before NDI, this multi-location remote production required one SDI converter per device, hundreds of meters of cabling, multiple SRT streams, complex routing, and multiple protocols in place."
