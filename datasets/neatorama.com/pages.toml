["https://www.neatorama.com/2025/02/26/The-Rise-and-Fall-of-the-Double-Feature"]
title = "The Rise and Fall of the Double Feature - Neatorama"
description = "Do you remember when movie theaters used to have double features? Two movie for the price of one! Which, of course, wasn't really the case, since double features were so common we didn't know what the proper price for one movie should be. Usually, the double feature paired an expensive Hollywood production (an A-movie) with a B-movie, which was made on a budget of less than $100,000, which could be as low as $10,000. People sometimes fumed about having to sit through the B-movie first in order to see the..."
full_description = '''The Rise and Fall of the Double Feature Miss Cellania • Wednesday, February 26, 2025 at 7:52 PM Do you remember when movie theaters used to have double features? Two movie for the price of one! Which, of course, wasn't really the case, since double features were so common we didn't know what the proper price for one movie should be. Usually, the double feature paired an expensive Hollywood production (an A-movie) with a B-movie, which was made on a budget of less than $100,000, which could be as low as $10,000. People sometimes fumed about having to sit through the B-movie first in order to see the film they really came for. Or if the B-movie played last, they only stayed because they felt they needed to get their money's worth. Or the double features might even be two B-movies, because the teenagers making out in a dark theater or a drive in didn't care. But the double feature wasn't just a marketing stunt that stuck around. It was a scheme to keep Hollywood studios in business, and theater owners didn't have a choice. It was only when antitrust laws were enacted and enforced that the double features went the way of the dodo. Whether you enjoyed them or not, you'll want to learn about how the double feature worked at JSTOR Daily. -via Damn Interesting (Image credit: Warner Bros./Toho) <a href="/2025/02/26/The-Rise-and-Fall-of-the-Double-Feature/?load_comments=1" title="View this post with up to its first 100 comments">Comments (<span class="comm_count-post-126157">2</span>)</a> document.write('Comments (<span class="comm_count-post-126157">2</span>)'); Newest 2 Newest 2 Comments rcxb • 28Feb25 10:06am • 0 Nothing in the world scarier than the idea of: "Teenagers from Outer Space" Abusive comment hidden. (Show it anyway.) Tony R • 27Feb25 8:41am • 0 This was a fun article on JSTOR Daily, but I think it has some incorrect information. All the info about the director Arthur Terry came from an article in "Film Comment" magazine, and if you read the article itself you can see that it's definitely a joke. I let them know about it, so that may be changed later. Abusive comment hidden. (Show it anyway.) Please enable JavaScript in your web browser to post a comment. Start New Comment Thread... Commenting on Neatorama will earn you NeatoPoints! Preview Comment me • seconds ago • 0 Abusive comment hidden. (Show it anyway.) Start New Thread Post Your Reply (function() { let quill = new Quill('#comm_body-post-126157', { modules: { toolbar: [ [ 'bold', 'italic', 'strike' ], [ 'blockquote' ], [ 'link' ], [ 'clean' ], ], }, theme: 'snow', }); let $toolbars = $('#comm_body-post-126157 .ql-toolbar'); if ($toolbars.length > 1) { $toolbars.eq(0).remove(); } quill.on('text-change', function() { let $editor = $('#comm_body-post-126157 .ql-editor'); let value = $editor.html(); $('#comm_body-value-post-126157').val(value); let $form = $('#commentform-post-126157'); let l = $.trim($editor.text()).length; $(".comment-submit.save,.comment-submit.preview", $form).prop({disabled:l == 0}); }); })(); Submit Comment Preview Cancel This reply comment will earn you 100 100 NeatoPoints ! Quick Sign In and Post Comment Register and Post Comment Hello! You need to sign in to comment. Please be courteous; see our Comment Policy. *Email *Password Forgot? Reset Password Sign In to Post Comment *Email *Password *Name Newsletter Exclusive contests & giveaways Register to Post New to Neatorama or haven't signed in before since the new version? Register an account! Already registered? Sign in to your existing Neatorama account. <a href="/2025/02/26/The-Rise-and-Fall-of-the-Double-Feature/?load_comments=1" title="View this post with up to its first 100 comments" class="icon-str"> <span class="span icon arrow-lg-circle-r m"></span> <span class="str"> <span>Click here to view up to the first 100 of this post's</span> <span class="comm_count-post-126157">2</span> <span>comments</span> </span> </a>'''
