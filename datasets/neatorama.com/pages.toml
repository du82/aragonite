["https://www.neatorama.com/2025/03/01/How-Weird-Are-Americas-Time-Zones"]
title = "How Weird Are America's Time Zones? - Neatorama"
description = "When you are very much used to something, it's hard to perceive how weird it is to outsiders. Most nations of the world are small enough to exist in only one time zone. And then there's China, which is very big and still only has one time zone, but that's a different story. Anyway, I live pretty close to a time zone border, and have always been conscious of how to calculate the time elsewhere. When living in Central Time, I got used to everything on TV being an hour earlier than it should. The lines betw..."
full_description = '''How Weird Are America's Time Zones? Miss Cellania • 2 hours ago When you are very much used to something, it's hard to perceive how weird it is to outsiders. Most nations of the world are small enough to exist in only one time zone. And then there's China, which is very big and still only has one time zone, but that's a different story. Anyway, I live pretty close to a time zone border, and have always been conscious of how to calculate the time elsewhere. When living in Central Time, I got used to everything on TV being an hour earlier than it should. The lines between zones aren't straight, and the reasons why are inexplicable. And then we're going to throw Daylight Saving Time in the mix. Someone who has never had to deal with time zones may find them quite confusing. Laurence Brown of Lost in the Pond explains how he first encountered American time zones and what it took to get used to them. There's a 77-second skippable ad at 3:20. <a href="/2025/03/01/How-Weird-Are-Americas-Time-Zones/?load_comments=1" title="View this post with up to its first 100 comments">Comments (<span class="comm_count-post-126167">0</span>)</a> document.write('Comments (<span class="comm_count-post-126167">0</span>)'); Please enable JavaScript in your web browser to post a comment. Start New Comment Thread... Commenting on Neatorama will earn you NeatoPoints! Preview Comment me • seconds ago • 0 Abusive comment hidden. (Show it anyway.) Start New Thread Post Your Reply (function() { let quill = new Quill('#comm_body-post-126167', { modules: { toolbar: [ [ 'bold', 'italic', 'strike' ], [ 'blockquote' ], [ 'link' ], [ 'clean' ], ], }, theme: 'snow', }); let $toolbars = $('#comm_body-post-126167 .ql-toolbar'); if ($toolbars.length > 1) { $toolbars.eq(0).remove(); } quill.on('text-change', function() { let $editor = $('#comm_body-post-126167 .ql-editor'); let value = $editor.html(); $('#comm_body-value-post-126167').val(value); let $form = $('#commentform-post-126167')