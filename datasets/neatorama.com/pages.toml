description = "At Neatorama.com, we appreciate your readership and respect your privacy. This privacy policy governs the way we collect and use your personal information. This policy may be revised or updated at any time, so please check back often to find the latest version.Collection and Use of Personal InformationNeatorama.com has two main parts: blog and online shop. You are required to register a username in order to comment on the blog. Your IP address is recorded when you comment as part of our effort to combat ..."
full_description = '''Privacy Policy & Contact Info Thursday, March 19, 2009 at 9:03 PM At Neatorama.com, we appreciate your readership and respect your privacy. This privacy policy governs the way we collect and use your personal information. This policy may be revised or updated at any time, so please check back often to find the latest version.Collection and Use of Personal InformationNeatorama.com has two main parts: blog and online shop. You are required to register a username in order to comment on the blog. Your IP address is recorded when you comment as part of our effort to combat spam and inappropriate comments.The blog has an "email this post to your friend" feature that lets you send a particular post in email format to up to 5 email addresses. To use this feature, we require that you provide your name and email addresses, as well as the names and email addresses of the persons you are sending the post. These information is recorded electronically and purged periodically. We do not keep these personal information and do not use it for any purpose other than to compile an aggregate statistical information (i.e. how many posts were emailed - not to or by whom).In order to process and ship your order, we require your personal information such as name, address, and telephone number, as well as financial information such as credit card number and expiration date. You may register a username in the online shop. This allows you to track the progress of your order. You may also place an order through a quick checkout procedure (without prior registration of a username). If we have trouble processing your order, we will use this information to contact you.In addition to personal information, we may also collect aggregate information about our visitors (that does not personally identify you), such as operating system, the browser you are using, the country of you are located, referring domain, and the domain name of your internet service provider.Use of Personal InformationAggregate Information (non-personally identifiable)We share aggregated demographic information about our user base with our partners and advertisers. This information does not identify individual users.Personally Identifiable InformationWe do not share, sell, or rent personally identifiable information with third parties. We reserve the right to disclose your personally identifiable information as required by law and when we believe that disclosure is necessary to protect our rights and/or to comply with a judicial proceeding, court order, or legal process served on our website.AgentsTo fulfill your online order, we may use an outside shipping company to fulfill drop-shipped orders, as well as a credit card processing company to bill you for goods. These companies do not retain, share, store, or use personally identifiable information for any other purpose.CookiesA cookie is a small text file stored on a user's computer for record-keeping purposes. We use cookies on this site. In some cases, we link the information stored in cookies to personally identifiable information you submit while on this site.We use both short-term (session) and long-term (persistent) cookies. We use session cookies to make it easier for you to navigate our website, for instance so you can comment on the blog and post on the forum without having to log in multiple times. Persistent cookies remain on your computer's hard drive for an extended period of time. By storing your login information, you do not have to log into your account every time you visit this website. You can remove persistent cookies by following the directions provided in your Internet browser's help file.Some of our business partners (advertisers) use cookies on our website. We have no access or control over these cookies. This privacy policy covers the use of cookies by Neatorama.com only and does not cover the use of cookies by any advertisers. See "Third Party Advertisers" below.Third Party AdvertisersWe allow third-party companies to serve ads and/or collect certain anonymous information when you visit our web site. These companies may use non-personally identifiable information (e.g., click stream information, browser type, time and date, subject of advertisements clicked or scrolled over) during your visits to this and other Web sites in order to provide advertisements about goods and services likely to be of interest to you. These companies typically use a cookie or third party web beacon to collect this information. To learn more about this behavioral advertising practice or to opt-out of this type of advertising, you can visit networkadvertising.org.Privacy Policy ChangesWe reserve the right to change this Privacy Policy from time to time, solely in our discretion. We encourage visitors to frequently check this page for any changes. Your continued use of this site after any change in this Privacy Policy will constitute your acceptance of such change.If you have any questions or suggestions regarding our Privacy Policy, please email info at neatorama dot com.Data DeletionTo request the deletion of your data, please email us at info@neatorama.com. Please include your name and email address.Contact InfoPlease contact us at our worldwide headquarters:Neatorama法律部Jl Raya Kebayoran Lama No. 557Jakarta 12220INDONESIA <a href="/privacy-policy/?load_comments=1" title="View this post with up to its first 100 comments">Comments (<span class="comm_count-post-23568">0</span>)</a> document.write('Comments (<span class="comm_count-post-23568">0</span>)'); Login to comment. <a href="/privacy-policy/?load_comments=1" title="View this post with up to its first 100 comments" class="icon-str"> <span class="span icon arrow-lg-circle-r m"></span> <span class="str"> <span>Click here to view up to the first 100 of this post's</span> <span class="comm_count-post-23568">0</span> <span>comments</span> </span> </a>'''
