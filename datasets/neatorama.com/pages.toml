title = "The Birth of the Fresno Nightcrawlers - Neatorama"
description = "Often when you hear about a cryptid, like Bigfoot or the chupacabra or a jackalope, it's a story that's been around so long that people cannot pinpoint when the legend started. But the urban legend of the Fresno Nightcrawlers not only has an exact start date, but it's relatively recent and there is video footage! This cryptid had the advantage of the internet, which quickly adopted it after the original 2007 video went viral. A Fresno Nightcrawler looks like a pair of legs that walk around by themselves...."
full_description = '''The Birth of the Fresno Nightcrawlers Miss Cellania • Thursday, February 27, 2025 at 6:39 PM Often when you hear about a cryptid, like Bigfoot or the chupacabra or a jackalope, it's a story that's been around so long that people cannot pinpoint when the legend started. But the urban legend of the Fresno Nightcrawlers not only has an exact start date, but it's relatively recent and there is video footage! This cryptid had the advantage of the internet, which quickly adopted it after the original 2007 video went viral. A Fresno Nightcrawler looks like a pair of legs that walk around by themselves. In most fan art, there's a head attached, but the video it is based on is so blurry you have to use your imagination. Luckily, that's what so many people on the 'net are good at. Is the Fresno Nightcrawler a hoax, a strange technical artifact, or something real that we just don't understand? Dr. Emily Zarka of Monstrum (previously at Neatorama) takes a good look at the video that made the Fresno Nightcrawler a thing. <a href="/2025/02/27/The-Birth-of-the-Fresno-Nightcrawlers/?load_comments=1" title="View this post with up to its first 100 comments">Comments (<span class="comm_count-post-126160">0</span>)</a> document.write('Comments (<span class="comm_count-post-126160">0</span>)'); Please enable JavaScript in your web browser to post a comment. Start New Comment Thread... Commenting on Neatorama will earn you NeatoPoints! Preview Comment me • seconds ago • 0 Abusive comment hidden. (Show it anyway.) Start New Thread Post Your Reply (function() { let quill = new Quill('#comm_body-post-126160', { modules: { toolbar: [ [ 'bold', 'italic', 'strike' ], [ 'blockquote' ], [ 'link' ], [ 'clean' ], ], }, theme: 'snow', }); let $toolbars = $('#comm_body-post-126160 .ql-toolbar'); if ($toolbars.length > 1) { $toolbars.eq(0).remove(); } quill.on('text-change', function() { let $editor = $('#comm_body-post-126160 .ql-editor'); let value = $editor.html(); $('#comm_b