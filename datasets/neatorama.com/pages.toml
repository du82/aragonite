full_description = '''Cement Mixer Truck Art John Farrier • Wednesday, February 26, 2025 at 6:05 AM Street Art Utopia brings to our attention cement mixer trucks painted to resemble matryoshka--Russian nesting dolls. This particular one is in Budapest, the capital of Hungary.In my mind, matryoshka are a traditional Russian handicraft. But according to a page maintained by the Russian Studies program at Macalester College, they date back to only 1892.Painting a cement mixer truck is evidently not a one-off project, as Street Art Utopia has located photos of at least three such rolling artworks.A commenter at that art blog points us to a cement mixer truck painted by Amsterdam-based artist Hugo Kaagman to look like the famed Delft porcelain. Tags: Matryoshka, Cement Mixer Trucks <a href="/2025/02/26/Cement-Mixer-Truck-Art/?load_comments=1" title="View this post with up to its first 100 comments">Comments (<span class="comm_count-post-126154">0</span>)</a> document.write('Comments (<span class="comm_count-post-126154">0</span>)'); Please enable JavaScript in your web browser to post a comment. Start New Comment Thread... Commenting on Neatorama will earn you NeatoPoints! Preview Comment me • seconds ago • 0 Abusive comment hidden. (Show it anyway.) Start New Thread Post Your Reply (function() { let quill = new Quill('#comm_body-post-126154', { modules: { toolbar: [ [ 'bold', 'italic', 'strike' ], [ 'blockquote' ], [ 'link' ], [ 'clean' ], ], }, theme: 'snow', }); let $toolbars = $('#comm_body-post-126154 .ql-toolbar'); if ($toolbars.length > 1) { $toolbars.eq(0).remove(); } quill.on('text-change', function() { let $editor = $('#comm_body-post-126154 .ql-editor'); let value = $editor.html(); $('#comm_body-value-post-126154').val(value); let $form = $('#commentform-post-126154'); let l = $.trim($editor.text()).length; $(".comment-submit.save,.comment-submit.preview", $form).prop({disabled:l == 0}); }); })(); Submit Comment Preview Cancel This reply comment will earn you 