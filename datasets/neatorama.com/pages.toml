["https://www.neatorama.com/neatobambino/2018/09/15/Your-Earliest-Childhood-Memory-is-Probably-Fake"]
title = "Your Earliest Childhood Memory is Probably Fake - Neatorama"
description = "What is your earliest memory? In a study of more than 6,000 people, the average age of a first memory was 3.24 years, but 40% reported memories from age two or earlier. Some even recall being an infant. Is that even possible?&nbsp; &nbsp;Researchers who have investigated memory development suggest that the neurological processes needed to form autobiographical memories are not fully developed until between the ages of three and four years. Other research has suggested that memories are linked to language..."
full_description = '''Your Earliest Childhood Memory is Probably Fake Miss Cellania • Saturday, September 15, 2018 at 9:49 AM • 8 What is your earliest memory? In a study of more than 6,000 people, the average age of a first memory was 3.24 years, but 40% reported memories from age two or earlier. Some even recall being an infant. Is that even possible? Researchers who have investigated memory development suggest that the neurological processes needed to form autobiographical memories are not fully developed until between the ages of three and four years. Other research has suggested that memories are linked to language development. Language allows children to share and discuss the past with others, enabling memories to be organised in a personal autobiography.So how can I remember being a baby? And why did 2,487 people from our study remember events that they dated from the age of two years and younger?Read about the study and possible explanations for people who remember infancy at Quartz. (Image credit: Martin Falbisoner) Like this? Please share & join us From the NeatoShop <a href="/neatobambino/2018/09/15/Your-Earliest-Childhood-Memory-is-Probably-Fake/?load_comments=1" title="View this post with up to its first 100 comments">Comments (<span class="comm_count-post-102542">7</span>)</a> document.write('Comments (<span class="comm_count-post-102542">7</span>)'); Newest 5 Newest 5 Comments BLACKLISTED: Alex Santoso • 16Sep18 3:24pm • 4 Or how about that memory and ideas can be "planted" (Source: I watched Inception). Abusive comment hidden. (Show it anyway.) BLACKLISTED: Miss Cellania in reply to Big O • 16Sep18 6:16am • 3 A younger sibling is probably a pretty common first memory, both because of the age and because it's a big change in your life. Abusive comment hidden. (Show it anyway.) BLACKLISTED: Big O • 16Sep18 4:01am • 3 Funny that my first memory is of my brother who is 4 years younger, showing up in a crib in MY bedroom. We shared a bedroom for the years following until I left home for college. Abusive comment hidden. (Show it anyway.) BLACKLISTED: PlasmaGryphon • 15Sep18 1:40pm • 4 There is a lot of research into how fickle and bad memory can be in different situations, including many where people are really confident in their memories. Abusive comment hidden. (Show it anyway.) BLACKLISTED: Edward • 14Sep18 9:00pm • 5 Let me see if I understand their premise. Their theory does not allow for early childhood memories so therefore they cannot really exist. When facts disagree with theory, cognitive dissonance analysis says that there are four ways to respond. This is the simplest and the worst. Abusive comment hidden. (Show it anyway.) Commenting is closed. <a href="/neatobambino/2018/09/15/Your-Earliest-Childhood-Memory-is-Probably-Fake/?load_comments=1" title="View this post with up to its first 100 comments" class="icon-str"> <span class="span icon arrow-lg-circle-r m"></span> <span class="str"> <span>Click here to view up to the first 100 of this post's</span> <span class="comm_count-post-102542">7</span> <span>comments</span> </span> </a> We hope you like this article! Please help us grow by sharing: Tweet Get Updates In Your Inbox Free weekly emails, plus get access to subscriber-only prizes. We won't share your email. You can cancel at any time.'''
