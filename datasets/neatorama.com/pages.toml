description = "In 1922, explorers discovered the tomb of Egypt's King Tutankhamun. Then we went a hundred years without finding the burial place of any pharaoh, until now. In 2022, a tomb was uncovered near Luxor that at first seemed to be for a royal woman. It was near the tomb of Hatshepsut, wife of Thutmose II, and near the wives of Thutmose III. But possessions found in the tomb more recently, namely alabaster flasks, have been identified as belonging to Thutmose II, so they believe this is his tomb. The mummy of T..."
full_description = '''For the First Time in 100 Years, an Egyptian King's Tomb Has Been Found Miss Cellania • Saturday, February 22, 2025 at 5:28 PM In 1922, explorers discovered the tomb of Egypt's King Tutankhamun. Then we went a hundred years without finding the burial place of any pharaoh, until now. In 2022, a tomb was uncovered near Luxor that at first seemed to be for a royal woman. It was near the tomb of Hatshepsut, wife of Thutmose II, and near the wives of Thutmose III. But possessions found in the tomb more recently, namely alabaster flasks, have been identified as belonging to Thutmose II, so they believe this is his tomb. The mummy of Thutmose II was discovered in 1881, along with other royal Egyptian mummies that had been moved from their tombs. Experts believe that Thutmose's tomb may have become flood, and the contents removed after that. The mummy is housed at the National Museum of Egyptian Civilization, and we don't know if there are any plans to reunite this pharaoh with his original tomb. Read up on this singular discovery at Smithsonian. (Image credit: Egyptian Ministry of Tourism and Antiquities) <a href="/2025/02/22/For-the-First-Time-in-100-Years-an-Egyptian-Kings-Tomb-Has-Been-Found/?load_comments=1" title="View this post with up to its first 100 comments">Comments (<span class="comm_count-post-126143">1</span>)</a> document.write('Comments (<span class="comm_count-post-126143">1</span>)'); Newest 1 Newest 1 Comment Stuart 1 • 23Feb25 11:19am • 0 chevron one encoded Abusive comment hidden. (Show it anyway.) Please enable JavaScript in your web browser to post a comment. Start New Comment Thread... Commenting on Neatorama will earn you NeatoPoints! Preview Comment me • seconds ago • 0 Abusive comment hidden. (Show it anyway.) Start New Thread Post Your Reply (function() { let quill = new Quill('#comm_body-post-126143', { modules: { toolbar: [ [ 'bold', 'italic', 'strike' ], [ 'blockquote' ], [ 'link' ], [ 'clean' ], ], }, theme: 'snow', });