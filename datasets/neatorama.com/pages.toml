["https://www.neatorama.com/2025/02/25/He-Accidentally-Set-a-World-Record-for-a-Marathon"]
title = "He Accidentally Set a World Record for a Marathon - Neatorama"
description = "Chris Terrill, despite being 73 years old, is quite an athlete. He has completed more than 50 marathons, and was registered for last year's Brighton Marathon in his native England. But then Terrill suffered an injury and got a hip replacement. Since he was already registered to run and raise money for wounded veterans, he decided to run the marathon anyway, on crutches. Terrill completed that marathon in six hours, 11 minutes and 11 seconds. That's quite an accomplishment, especially since he was on crut..."
full_description = '''He Accidentally Set a World Record for a Marathon Miss Cellania • Tuesday, February 25, 2025 at 10:08 AM Chris Terrill, despite being 73 years old, is quite an athlete. He has completed more than 50 marathons, and was registered for last year's Brighton Marathon in his native England. But then Terrill suffered an injury and got a hip replacement. Since he was already registered to run and raise money for wounded veterans, he decided to run the marathon anyway, on crutches. Terrill completed that marathon in six hours, 11 minutes and 11 seconds. That's quite an accomplishment, especially since he was on crutches. When people mentioned his feat may be a world record, he was astonished."If I'd known there was a record to be beaten, I'd have gone faster," he said.Terrill had even stopped to take selfies with his fans along the way! Since it wasn't an official attempt, the Guinness officials had to verify Terrill's feat by the race records, which took a year. Read about this iron man and his record at BBC. -via Metafilter (Image credit: Royal Navy and Royal Marines Charity) <a href="/2025/02/25/He-Accidentally-Set-a-World-Record-for-a-Marathon/?load_comments=1" title="View this post with up to its first 100 comments">Comments (<span class="comm_count-post-126151">0</span>)</a> document.write('Comments (<span class="comm_count-post-126151">0</span>)'); Please enable JavaScript in your web browser to post a comment. Start New Comment Thread... Commenting on Neatorama will earn you NeatoPoints! Preview Comment me • seconds ago • 0 Abusive comment hidden. (Show it anyway.) Start New Thread Post Your Reply (function() { let quill = new Quill('#comm_body-post-126151', { modules: { toolbar: [ [ 'bold', 'italic', 'strike' ], [ 'blockquote' ], [ 'link' ], [ 'clean' ], ], }, theme: 'snow', }); let $toolbars = $('#comm_body-post-126151 .ql-toolbar'); if ($toolbars.length > 1) { $toolbars.eq(0).remove(); } quill.on('text-change', function() { let $editor = $('#