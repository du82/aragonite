full_description = '''The Gallaudet Library Prank John Farrier • Saturday, February 22, 2025 at 6:44 AM Gallaudet University is a school in Washington, D.C. dedicated to the educational needs of deaf students. The appropriately-named blog Library Shenanigans described a vicious and cruel prank played on the beleaguered library staff in January of 1940.During the night, a cabal of hardened student criminals penetrated the library's security and turned every book around so that the spines faced inward. The above photo from the university's archives shows students examining the wreckage of their library before setting it to right by reversing the books.Now, 85 years later, the criminals must have long since descended to their graves and to pay for transgressions in an eternal torrent of brimstone-scented shushings.-via Weird Universe Tags: Libraries, Pranks, Gallaudet University <a href="/2025/02/22/The-Gallaudet-Library-Prank/?load_comments=1" title="View this post with up to its first 100 comments">Comments (<span class="comm_count-post-126141">2</span>)</a> document.write('Comments (<span class="comm_count-post-126141">2</span>)'); Newest 2 Newest 2 Comments sandyra • 23Feb25 6:14am • 1 I wonder, where I would find the mystery section? Abusive comment hidden. (Show it anyway.) gwdMaine • 22Feb25 10:26am • 1 Oh, the humanity! Abusive comment hidden. (Show it anyway.) Please enable JavaScript in your web browser to post a comment. Start New Comment Thread... Commenting on Neatorama will earn you NeatoPoints! Preview Comment me • seconds ago • 0 Abusive comment hidden. (Show it anyway.) Start New Thread Post Your Reply (function() { let quill = new Quill('#comm_body-post-126141', { modules: { toolbar: [ [ 'bold', 'italic', 'strike' ], [ 'blockquote' ], [ 'link' ], [ 'clean' ], ], }, theme: 'snow', }); let $toolbars = $('#comm_body-post-126141 .ql-toolbar'); if ($toolbars.length > 1) { $toolbars.eq(0).remove(); } quill.on('text-change', function() { let $editor = $('#co