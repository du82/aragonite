full_description = '''Reply All Miss Cellania • Friday, September 2, 2016 at 1:59 PM Best story in today's NYTimes pic.twitter.com/vgbQpHpMaB— David Wessel (@davidmwessel) September 2, 2016 Hitting “reply all” on a multi-person email can start a chain reaction that never ends. In fact, it can be like rolling a snowball down a mountain, where it gathers more and more snow until it’s bigger than a house. Sometimes it ends in a picnic and a viral story, like the Berkeley Spampocalypse last year. But usually, it just annoys everyone. The New York Times has some advice on such an event. -Thanks, John Farrier! View more fun pics over at our NeatoPicto Blog Tags: Reply All, Email Chain Related Neatorama Posts Email Etiquette Email Cliches in Real Life Comedy Sketch: Email in Real Life Email Trackers Let the Sender Know When You Open a Message Answering Email with “I Love You” Related NeatoShop Items Chunky Lover 53 Hedwig is my email Double Deuce! Secret Eating!!! Crazy Go Nuts Coffee <a href="/2016/09/02/Reply-All/?load_comments=1" title="View this post with up to its first 100 comments">Comments (<span class="comm_count-post-92391">0</span>)</a> document.write('Comments (<span class="comm_count-post-92391">0</span>)'); Login to comment. <a href="/2016/09/02/Reply-All/?load_comments=1" title="View this post with up to its first 100 comments" class="icon-str"> <span class="span icon arrow-lg-circle-r m"></span> <span class="str"> <span>Click here to view up to the first 100 of this post's</span> <span class="comm_count-post-92391">0</span> <span>comments</span> </span> </a>'''
