full_description = '''Website Accessibility Statement Saturday, May 1, 2021 at 2:51 AM Neatorama is committed to provide a website that is accessible to our users and aim to comply with all applicable standards of accessibility and usability. While we aim and strive to provide accessibility and usability for all users regardless of technology or ability, please note that accessibility is an ongoing effort and may not be possible in all areas with current technology and other restrictions.Please note that our website may link to, embed, or interface with third party websites and external content that we do not control, and may not follow the same accessibility standards, thus we are not responsible for these websites or content. Such links, embeds, or interface do not constitute or imply an endorsement or recommendation by us to third party websites or content.If you have any questions, or if you experience any difficulty in accessing any part of our website, please email us at info@neatorama.com. Please be sure to tell us the nature of the accessibility issue, specify the web page/web address of the page with the issue, as well as your preferred method of contact or alternative communication method so we can make all reasonable efforts to make that page accessible. <a href="/website-accessibility-statement/?load_comments=1" title="View this post with up to its first 100 comments">Comments (<span class="comm_count-post-118730">0</span>)</a> document.write('Comments (<span class="comm_count-post-118730">0</span>)'); Login to comment. <a href="/website-accessibility-statement/?load_comments=1" title="View this post with up to its first 100 comments" class="icon-str"> <span class="span icon arrow-lg-circle-r m"></span> <span class="str"> <span>Click here to view up to the first 100 of this post's</span> <span class="comm_count-post-118730">0</span> <span>comments</span> </span> </a>'''
