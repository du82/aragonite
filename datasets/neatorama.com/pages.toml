description = "My parents took me to the Outer Banks of North Carolina almost every year as I was growing up. I also took my children, although not as often. Even as a kid, I was astonished at how details of the land changed from year to year. That's because the ocean currents are building up and tearing down these barriers islands all the time. These same currents have been bringing down ships for hundreds of years- ever since transatlantic travel began. Add to that the fact that these islands were once a very popular..."
full_description = '''The Treacherous Ship's Graveyard of the Outer Banks Miss Cellania • Sunday, February 23, 2025 at 6:42 PM My parents took me to the Outer Banks of North Carolina almost every year as I was growing up. I also took my children, although not as often. Even as a kid, I was astonished at how details of the land changed from year to year. That's because the ocean currents are building up and tearing down these barriers islands all the time. These same currents have been bringing down ships for hundreds of years- ever since transatlantic travel began. Add to that the fact that these islands were once a very popular maritime destination for ships that did not want to be caught in a major port, and you start to see how this string of islands ended up with a reputation for destroying ships. Shipwrecks that have been buried for who know how long are still emerging from the shifting sands. But the sea around the Outer Banks isn't just swallowing ship these days- it's also taking down homes. PBS Terra explains what makes this stretch of coastline so dangerous. <a href="/2025/02/23/The-Treacherous-Ships-Graveyard-of-the-Outer-Banks/?load_comments=1" title="View this post with up to its first 100 comments">Comments (<span class="comm_count-post-126146">0</span>)</a> document.write('Comments (<span class="comm_count-post-126146">0</span>)'); Please enable JavaScript in your web browser to post a comment. Start New Comment Thread... Commenting on Neatorama will earn you NeatoPoints! Preview Comment me • seconds ago • 0 Abusive comment hidden. (Show it anyway.) Start New Thread Post Your Reply (function() { let quill = new Quill('#comm_body-post-126146', { modules: { toolbar: [ [ 'bold', 'italic', 'strike' ], [ 'blockquote' ], [ 'link' ], [ 'clean' ], ], }, theme: 'snow', }); let $toolbars = $('#comm_body-post-126146 .ql-toolbar'); if ($toolbars.length > 1) { $toolbars.eq(0).remove(); } quill.on('text-change', function() { let $editor = $('#comm_body-post-126146 