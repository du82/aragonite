title = "What's So Special About the Stoops of New York? - Neatorama"
description = 'People are very adaptable, and can make a culture out of a simple architectural feature. And thus it is with the iconic stoops of New York City. "Stoop" is a Dutch word for stairs, and in the 17th century, they built grand homes and apartment buildings in New Amsterdam with them for flood control reasons. But those stairs also became a front yard, a status symbol for those who kept servants in the basement, a garden, a place to socialize, and even a private store for the people who lived there. The stoop...'
full_description = '''What's So Special About the Stoops of New York? Miss Cellania • Saturday, February 22, 2025 at 4:08 PM People are very adaptable, and can make a culture out of a simple architectural feature. And thus it is with the iconic stoops of New York City. "Stoop" is a Dutch word for stairs, and in the 17th century, they built grand homes and apartment buildings in New Amsterdam with them for flood control reasons. But those stairs also became a front yard, a status symbol for those who kept servants in the basement, a garden, a place to socialize, and even a private store for the people who lived there. The stoop was the reason you knew all your neighbors. In the 20th century, the social aspect of the stoop started to fade away as more apartments had air conditioning, television, and later internet. But then the pandemic came along in 2020, and New Yorkers again returned to the stoop to get some human contact. -via Nag on the Lake <a href="/2025/02/22/Whats-So-Special-About-the-Stoops-of-New-York/?load_comments=1" title="View this post with up to its first 100 comments">Comments (<span class="comm_count-post-126142">0</span>)</a> document.write('Comments (<span class="comm_count-post-126142">0</span>)'); Please enable JavaScript in your web browser to post a comment. Start New Comment Thread... Commenting on Neatorama will earn you NeatoPoints! Preview Comment me • seconds ago • 0 Abusive comment hidden. (Show it anyway.) Start New Thread Post Your Reply (function() { let quill = new Quill('#comm_body-post-126142', { modules: { toolbar: [ [ 'bold', 'italic', 'strike' ], [ 'blockquote' ], [ 'link' ], [ 'clean' ], ], }, theme: 'snow', }); let $toolbars = $('#comm_body-post-126142 .ql-toolbar'); if ($toolbars.length > 1) { $toolbars.eq(0).remove(); } quill.on('text-change', function() { let $editor = $('#comm_body-post-126142 .ql-editor'); let value = $editor.html(); $('#comm_body-value-post-126142').val(value); let $form = $('#commentform-post-126142'); 