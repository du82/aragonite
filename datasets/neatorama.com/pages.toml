["https://www.neatorama.com/page/2"]
title = "Neatorama"
full_description = '''Chris Terrill, despite being 73 years old, is quite an athlete. He has completed more than 50 marathons, and was registered for last year's Brighton Marathon in his native England. But then Terrill suffered an injury and got a hip replacement. Since he was already registered to run and raise money for wounded veterans, he decided to run the marathon anyway, on crutches. Terrill completed that marathon in six hours, 11 minutes and 11 seconds. That's quite an accomplishment, especially since he was on crutches. When people mentioned his feat may be a world record, he was astonished. Terrill had even stopped to take selfies with his fans along the way! Since it wasn't an official attempt, the Guinness officials had to verify Terrill's feat by the race records, which took a year. Read about this iron man and his record at BBC. -via Metafilter (Image credit: Royal Navy and Royal Marines Charity) You've hear about "illegal" LEGO techniques or joins or methods. The LEGO company has no power of law over what you do with the LEGO pieces you have bought and paid for, so the term "illegal" should be taken with a grain of salt. But the company does have its own rules for users to follow. These rules are codified building techniques that try to ensure that whatever you build will be sturdy enough to stay built and won't warp or break the bricks you used to make it. I think some of these rules might be for safety's sake, too. Beyond that, this video gives us a glimpse into the world of the LEGO company and how they produce so many building pieces of so many different kinds, resulting in glorious sets designed for every type of fandom. It's a little over seven minutes long; the rest is an ad. <img src="https://uploads.neatorama.com/images/posts/149/126/126149/1740451187-0.jpg" alt="" width="600" height="2565" /> The Hubble telescope has been taking images of the Andromeda galaxy for years, and now that work has paid off in the form of the we have the largest galactic mosaic of all-time. The project is called PHAT: the Panchromatic Hubble Andromeda Treasury, and the result is a map of that entire galaxy, made from more than 600 images stitched together, comprising 2.5+ billion pixels. That's the big picture, so to speak. But Hubble takes images in X-ray, ultraviolet, and near infrared, too, so this image contains way more information than just what the Andromeda galaxy looks like. The full image shows us 200 million or so individual stars in the Andromeda galaxy. It is the closest large galaxy to our Milky Way, and is actually moving closer to us. But it's still more than 2.5 million light years away, and won't collide with our galaxy for another few billion years. Read about the Panchromatic Hubble Andromeda Treasury mosaic and zoom in on some images that tell us about those 200 million stars, at Big Think. (Image credit: NASA, ESA, Benjamin F. Williams (UWashington), Zhuo Chen (UWashington), L. Clifton Johnson (Northwestern); Image Processing: Joseph DePasquale (STScI))'''
