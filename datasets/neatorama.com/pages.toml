["https://www.neatorama.com/2025/02/26/Terribly-Dangerous-Things-We-Used-to-Buy-for-Babies"]
title = "Terribly Dangerous Things We Used to Buy for Babies - Neatorama"
description = '''Our modern lives have been shaped by technological breakthroughs and scientific discoveries that make our lives better. Often, the "making life better" part comes a long time before the "whoops- that's actually very dangerous" part. The automobile changed family life forever, as the large sedans of the past could haul all the kids at once! They could even be comfortably rocked to sleep in a baby hammock suspended across the back seat! The ad touts how this would keep your baby safe in the car, meaning so...'''
full_description = '''Terribly Dangerous Things We Used to Buy for Babies Miss Cellania • Wednesday, February 26, 2025 at 6:44 PM Our modern lives have been shaped by technological breakthroughs and scientific discoveries that make our lives better. Often, the "making life better" part comes a long time before the "whoops- that's actually very dangerous" part. The automobile changed family life forever, as the large sedans of the past could haul all the kids at once! They could even be comfortably rocked to sleep in a baby hammock suspended across the back seat! The ad touts how this would keep your baby safe in the car, meaning something like safe from rolling down the window and jumping out. However, in the event of a collision, it could easily become a slingshot. But the car hammock is just one of many products that went to market without someone trying to imagine what could possibly go wrong. Read about five of those dangerous items especially designed for babies, or rather, especially designed for the convenience of parents to the detriment of the child, at Cracked. <a href="/2025/02/26/Terribly-Dangerous-Things-We-Used-to-Buy-for-Babies/?load_comments=1" title="View this post with up to its first 100 comments">Comments (<span class="comm_count-post-126155">4</span>)</a> document.write('Comments (<span class="comm_count-post-126155">4</span>)'); Newest 4 Newest 4 Comments Andrew Dalke in reply to Miss Cellania • 28Feb25 11:36am • 0 That was a good hint! An English StackExchange discussion lists terms like "the deck", "the rear deck", with "back dash" as colloquial phrase, and "package shelf" for the UK, and with many (including my wife) using simply "the back window".(I think that last is a form of metonymy - if so, my 11th grade English teacher would be pleased.) Abusive comment hidden. (Show it anyway.) Miss Cellania • 28Feb25 9:36am • 0 I've heard that called the back dash, but I don't know if there's an official term for it. Abusive comment hidden. (Show it anyway.) Andrew Dalke • 28Feb25 8:45am • 0 Probably safer than sleeping on the .. I don't have a word for it. The shelf behind the rear seat, between the rear window and above the most forward part of the trunk. As a small kid I remember sleeping on that shelf in our 1973 Ford Galaxie sedan.When we got bigger, my sister and I would stuff the footwells and and nap laying flat. W/o seat belts, of course. Abusive comment hidden. (Show it anyway.) sandyra • 28Feb25 5:23am • 1 That hammock sling shot device sounds like fun. Mrs Winslow's teething syrup makes me wonder how many kids OD'd from it. Although living with chronic pain makes that tonic sound mighty good. Abusive comment hidden. (Show it anyway.) Please enable JavaScript in your web browser to post a comment. Start New Comment Thread... Commenting on Neatorama will earn you NeatoPoints! Preview Comment me • seconds ago • 0 Abusive comment hidden. (Show it anyway.) Start New Thread Post Your Reply (function() { let quill = new Quill('#comm_body-post-126155', { modules: { toolbar: [ [ 'bold', 'italic', 'strike' ], [ 'blockquote' ], [ 'link' ], [ 'clean' ], ], }, theme: 'snow', }); let $toolbars = $('#comm_body-post-126155 .ql-toolbar'); if ($toolbars.length > 1) { $toolbars.eq(0).remove(); } quill.on('text-change', function() { let $editor = $('#comm_body-post-126155 .ql-editor'); let value = $editor.html(); $('#comm_body-value-post-126155').val(value); let $form = $('#commentform-post-126155'); let l = $.trim($editor.text()).length; $(".comment-submit.save,.comment-submit.preview", $form).prop({disabled:l == 0}); }); })(); Submit Comment Preview Cancel This reply comment will earn you 100 100 NeatoPoints ! Quick Sign In and Post Comment Register and Post Comment Hello! You need to sign in to comment. Please be courteous; see our Comment Policy. *Email *Password Forgot? Reset Password Sign In to Post Comment *Email *Password *Name Newsletter Exclusive contests & giveaways Register to Post New to Neatorama or have