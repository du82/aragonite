["https://www.neatorama.com/2025/02/26/Luna-and-Her-Ears-Want-to-Make-Friends-with-You"]
title = "Luna and Her Ears Want to Make Friends with You - Neatorama"
description = '''Luna is described as a "unique-looking dog." That's quite an understatement! Luna has huge ears that stand straight up, and markings that make her nose look like a pig's snout. Her mouth is outlined in black, which just highlights how crooked her smile is. Her skull deformities are the result of distemper when she was a puppy, which she was very lucky to have survived. Distemper has a mortality rate of 50% in adult dogs, and 80% in puppies. Luna's color markings also accentuate her differences. There's r...'''
full_description = '''Luna and Her Ears Want to Make Friends with You Miss Cellania • Wednesday, February 26, 2025 at 7:12 PM Luna is described as a "unique-looking dog." That's quite an understatement! Luna has huge ears that stand straight up, and markings that make her nose look like a pig's snout. Her mouth is outlined in black, which just highlights how crooked her smile is. Her skull deformities are the result of distemper when she was a puppy, which she was very lucky to have survived. Distemper has a mortality rate of 50% in adult dogs, and 80% in puppies. Luna's color markings also accentuate her differences. There's really no explaining those ears! But Luna gets along fine, and has a great life with her human Danni, who is the daughter of Luna's original rescuer. Luna's bubbly personality -and her amusingly odd voice- endear her to everyone she meets. You can follow Luna and her adventures with Danni and with her new canine sibling Milo at Instagram. <a href="/2025/02/26/Luna-and-Her-Ears-Want-to-Make-Friends-with-You/?load_comments=1" title="View this post with up to its first 100 comments">Comments (<span class="comm_count-post-126156">0</span>)</a> document.write('Comments (<span class="comm_count-post-126156">0</span>)'); Please enable JavaScript in your web browser to post a comment. Start New Comment Thread... Commenting on Neatorama will earn you NeatoPoints! Preview Comment me • seconds ago • 0 Abusive comment hidden. (Show it anyway.) Start New Thread Post Your Reply (function() { let quill = new Quill('#comm_body-post-126156', { modules: { toolbar: [ [ 'bold', 'italic', 'strike' ], [ 'blockquote' ], [ 'link' ], [ 'clean' ], ], }, theme: 'snow', }); let $toolbars = $('#comm_body-post-126156 .ql-toolbar'); if ($toolbars.length > 1) { $toolbars.eq(0).remove(); } quill.on('text-change', function() { let $editor = $('#comm_body-post-126156 .ql-editor'); let value = $editor.html(); $('#comm_body-value-post-126156').val(value); let $form = $('#commentfo