["https://www.neatorama.com/2025/02/21/Even-Celebrities-Can-Fail-at-Email"]
title = "Even Celebrities Can Fail at Email - Neatorama"
description = '''Embed from Getty ImagesWhen sending out mass email notices, there's always the possibility of people responding with "reply all" instead of "reply." This results in an email storm as others engage, and any messages that try to stop the deluge only exacerbates it. It happened to the community of Berkeley, and to New York Times employees, and even to John Farrier. But not everyone is familiar with those stories, so it just keeps happening. The latest high-profile email storm was initiated on Valentines Day...'''
full_description = '''Even Celebrities Can Fail at Email Miss Cellania • Friday, February 21, 2025 at 5:03 PM Embed from Getty ImagesWhen sending out mass email notices, there's always the possibility of people responding with "reply all" instead of "reply." This results in an email storm as others engage, and any messages that try to stop the deluge only exacerbates it. It happened to the community of Berkeley, and to New York Times employees, and even to John Farrier. But not everyone is familiar with those stories, so it just keeps happening. The latest high-profile email storm was initiated on Valentines Day, when author Susan Morrison sent out invitations to an event for her biography of Lorne Michaels. This email list was rich with celebrities, authors, and comedians. And many of them responded with "reply all," which not only gave us a glimpse into their tastes and schedules, but invited the wittier folks among them to contribute to the chaos. For example, Tina Fey sent everyone a link to a YouTube video explaining why you shouldn't use "reply all." Colin Jost then announced to everyone that Fey's link was malware, and the only way to save your computer was to continue using "reply all." See the highlights of this high-profile email storm here. -via Metafilter <a href="/2025/02/21/Even-Celebrities-Can-Fail-at-Email/?load_comments=1" title="View this post with up to its first 100 comments">Comments (<span class="comm_count-post-126139">3</span>)</a> document.write('Comments (<span class="comm_count-post-126139">3</span>)'); Newest 3 Newest 3 Comments Mary Ann 02 • 22Feb25 6:45pm • 0 even celebrities...???? Are they not people? Do they have some special powers because they get their pictures taken a lot? Abusive comment hidden. (Show it anyway.) dennis 4 • 22Feb25 1:29pm • 0 Even more evil is the out of office auto reply-all. Abusive comment hidden. (Show it anyway.) John Farrier • 22Feb25 6:13am • 0 Yep. It happened to me. I survived. Abusive comment hidden. (