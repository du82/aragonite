title = "This Automata is an Orchestra of Skeletons - Neatorama"
description = "Italian artist Amedeo Capelli handcrafts whimsical automata scenes. When he decided to make a whole orchestra of skeleton musicians, he soon found out it was a lot more work than he had intended. The finished piece contains thousands of individually carved bits of wood, plus the rope, iron, and aluminum required to wire all the movement controls together. A single skeleton's movements are controlled by levers and a wire, but to control them all without making them move in simple unison required that Cape..."
full_description = '''This Automata is an Orchestra of Skeletons Miss Cellania • Thursday, October 24, 2024 at 1:11 PM Italian artist Amedeo Capelli handcrafts whimsical automata scenes. When he decided to make a whole orchestra of skeleton musicians, he soon found out it was a lot more work than he had intended. The finished piece contains thousands of individually carved bits of wood, plus the rope, iron, and aluminum required to wire all the movement controls together. A single skeleton's movements are controlled by levers and a wire, but to control them all without making them move in simple unison required that Capelli design an extra device. That control panel can be cranked by one person, but makes each skeleton move in its own way, which was what he was aiming for. Three weeks of intense work went into this orchestra. Here you watch them "play" Verdi's Dies Irae. Laughing Squid shows us more of Capelli's automata, including these skeletons at a Christmas concert, and one video that is literally jaw dropping. <a href="/2024/10/24/This-Automata-is-an-Orchestra-of-Skeletons/?load_comments=1" title="View this post with up to its first 100 comments">Comments (<span class="comm_count-post-125645">0</span>)</a> document.write('Comments (<span class="comm_count-post-125645">0</span>)'); Login to comment. <a href="/2024/10/24/This-Automata-is-an-Orchestra-of-Skeletons/?load_comments=1" title="View this post with up to its first 100 comments" class="icon-str"> <span class="span icon arrow-lg-circle-r m"></span> <span class="str"> <span>Click here to view up to the first 100 of this post's</span> <span class="comm_count-post-125645">0</span> <span>comments</span> </span> </a>'''
