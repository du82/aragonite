["https://www.neatorama.com/2025/02/28/An-Eye-Tooth-Becomes-a-Real-Eye-Tooth-When-Its-Transplanted-Into-Your-Eyeball"]
title = "An Eye Tooth Becomes a Real Eye Tooth When It's Transplanted Into Your Eyeball - Neatorama"
description = "You may have never heard of the medical procedure called osteo-odonto keratoprosthesis (OOKP), possibly because doctors call it tooth-in-eye surgery. Or maybe because your doctor has never proposed transplanting one of your teeth into your eye. This surgery has been done for decades in Australia and has a good track record for restoring sight for certain patients who suffer from corneal blindness and have a functioning retina. Surgeons remove a patient's canine (eye tooth) and cut it into a rectangle and..."
full_description = '''An Eye Tooth Becomes a Real Eye Tooth When It's Transplanted Into Your Eyeball Miss Cellania • Friday, February 28, 2025 at 8:50 AM You may have never heard of the medical procedure called osteo-odonto keratoprosthesis (OOKP), possibly because doctors call it tooth-in-eye surgery. Or maybe because your doctor has never proposed transplanting one of your teeth into your eye. This surgery has been done for decades in Australia and has a good track record for restoring sight for certain patients who suffer from corneal blindness and have a functioning retina. Surgeons remove a patient's canine (eye tooth) and cut it into a rectangle and drill a hole in it to house a telescopic lens. Then they attach it to the patient's inner cheek for a few months to grow tissue around it. Then they implant the tooth in the patient's eyeball! The bio-device works because tooth enamel is so hard, and because transplants from the patient's own body aren't rejected. Three Canadians have recently become the first in that country to try OOKP. Read how this bizarre but established transplant technique works at CBC. -via Boing Boing (Unrelated image credit: Reese Brown) <a href="/2025/02/28/An-Eye-Tooth-Becomes-a-Real-Eye-Tooth-When-Its-Transplanted-Into-Your-Eyeball/?load_comments=1" title="View this post with up to its first 100 comments">Comments (<span class="comm_count-post-126161">0</span>)</a> document.write('Comments (<span class="comm_count-post-126161">0</span>)'); Please enable JavaScript in your web browser to post a comment. Start New Comment Thread... Commenting on Neatorama will earn you NeatoPoints! Preview Comment me • seconds ago • 0 Abusive comment hidden. (Show it anyway.) Start New Thread Post Your Reply (function() { let quill = new Quill('#comm_body-post-126161', { modules: { toolbar: [ [ 'bold', 'italic', 'strike' ], [ 'blockquote' ], [ 'link' ], [ 'clean' ], ], }, theme: 'snow', }); let $toolbars = $('#comm_body-post-126161 .ql-toolbar'); if ($to