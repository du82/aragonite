title = "Everything You Didn't Know About Camels - Neatorama"
description = '''Camels have been called "the ships of the desert" because they are so good at negotiating hot, dry, sandy territory. Every part of their bodies is optimized for such a journey, but it took a long time to develop all those specialized features. Who better to explain those body parts than Ze Frank? As part of his True Facts series, he goes over a camel's body piece by piece to show us how weird they are, and how they are perfect for living in, and carrying people through, the desert. For example, it's hand...'''
full_description = '''Everything You Didn't Know About Camels Miss Cellania • Thursday, February 27, 2025 at 10:39 AM Camels have been called "the ships of the desert" because they are so good at negotiating hot, dry, sandy territory. Every part of their bodies is optimized for such a journey, but it took a long time to develop all those specialized features. Who better to explain those body parts than Ze Frank? As part of his True Facts series, he goes over a camel's body piece by piece to show us how weird they are, and how they are perfect for living in, and carrying people through, the desert. For example, it's handy to have tough pads to protect your body in areas where it comes in contact with the earth. Camels have them on their feet, their knees, and even their chests so they can sit down on hot sand. But it's their internal physiology that's really weird, from their red blood cells to their sinuses that are all optimized for desert survival. This video doesn't make me want to live in the desert any more than I already did, but it works for camels. There's a 70-second ad at 5:10. <a href="/2025/02/27/Everything-You-Didnt-Know-About-Camels/?load_comments=1" title="View this post with up to its first 100 comments">Comments (<span class="comm_count-post-126158">0</span>)</a> document.write('Comments (<span class="comm_count-post-126158">0</span>)'); Please enable JavaScript in your web browser to post a comment. Start New Comment Thread... Commenting on Neatorama will earn you NeatoPoints! Preview Comment me • seconds ago • 0 Abusive comment hidden. (Show it anyway.) Start New Thread Post Your Reply (function() { let quill = new Quill('#comm_body-post-126158', { modules: { toolbar: [ [ 'bold', 'italic', 'strike' ], [ 'blockquote' ], [ 'link' ], [ 'clean' ], ], }, theme: 'snow', }); let $toolbars = $('#comm_body-post-126158 .ql-toolbar'); if ($toolbars.length > 1) { $toolbars.eq(0).remove(); } quill.on('text-change', function() { let $editor = $('#comm_body-post