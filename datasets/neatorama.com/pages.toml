["https://www.neatorama.com/2025/02/23/James-Tilly-Matthews-Schizophrenic-and-Conspiracy-Theorist"]
title = "James Tilly Matthews, Schizophrenic and Conspiracy Theorist - Neatorama"
description = "Over two hundred years ago, James Tilly Matthews became the first documented case of schizophrenia. The condition no doubt existed before then, but mental illnesses were often lumped together and rarely documented in detail. Matthews was a writer, and so was his psychiatrist. His case is also an interesting glimpse at an early conspiracy theory. After involvement in certain factions of the French Revolution, Matthews was imprisoned, then later committed to the infamous Bedlam asylum. There he developed h..."
full_description = '''James Tilly Matthews, Schizophrenic and Conspiracy Theorist Miss Cellania • Sunday, February 23, 2025 at 6:00 AM Over two hundred years ago, James Tilly Matthews became the first documented case of schizophrenia. The condition no doubt existed before then, but mental illnesses were often lumped together and rarely documented in detail. Matthews was a writer, and so was his psychiatrist. His case is also an interesting glimpse at an early conspiracy theory. After involvement in certain factions of the French Revolution, Matthews was imprisoned, then later committed to the infamous Bedlam asylum. There he developed his theory about the "Air Loom," a device controlled by a small group of Jacobin terrorists, which he named, that could control or torture others from a distance.The Air Loom was fuelled by a grotesque mixture of substances, including “fetid effluvia,” “spermatic-animal-seminal rays,” “putrid human breath,” and “gaz from the anus of a horse.” Its magnetic discharges, Matthews insisted, could implant thoughts, emotions, and physical sensations directly into his brain.Friends and family spent years trying to free Matthews, as they claimed his lunacy was spurred by unfair imprisonment and the cruel conditions of Bedlam (both valid concerns). Indeed, Matthews' story contributed to the overdue reforms at the institution. Read about James Tilly Matthews and his delusions at Amusing Planet. (Image credit: James Tilly Matthews) <a href="/2025/02/23/James-Tilly-Matthews-Schizophrenic-and-Conspiracy-Theorist/?load_comments=1" title="View this post with up to its first 100 comments">Comments (<span class="comm_count-post-126145">0</span>)</a> document.write('Comments (<span class="comm_count-post-126145">0</span>)'); Please enable JavaScript in your web browser to post a comment. Start New Comment Thread... Commenting on Neatorama will earn you NeatoPoints! Preview Comment me • seconds ago • 0 Abusive comment hidden. (Show it anyway.) Start New Thread Post Your Reply (function() { let quill = new Quill('#comm_body-post-126145', { modules: { toolbar: [ [ 'bold', 'italic', 'strike' ], [ 'blockquote' ], [ 'link' ], [ 'clean' ], ], }, theme: 'snow', }); let $toolbars = $('#comm_body-post-126145 .ql-toolbar'); if ($toolbars.length > 1) { $toolbars.eq(0).remove(); } quill.on('text-change', function() { let $editor = $('#comm_body-post-126145 .ql-editor'); let value = $editor.html(); $('#comm_body-value-post-126145').val(value); let $form = $('#commentform-post-126145'); let l = $.trim($editor.text()).length; $(".comment-submit.save,.comment-submit.preview", $form).prop({disabled:l == 0}); }); })(); Submit Comment Preview Cancel This reply comment will earn you 100 100 NeatoPoints ! Quick Sign In and Post Comment Register and Post Comment Hello! You need to sign in to comment. Please be courteous; see our Comment Policy. *Email *Password Forgot? Reset Password Sign In to Post Comment *Email *Password *Name Newsletter Exclusive contests & giveaways Register to Post New to Neatorama or haven't signed in before since the new version? Register an account! Already registered? Sign in to your existing Neatorama account. <a href="/2025/02/23/James-Tilly-Matthews-Schizophrenic-and-Conspiracy-Theorist/?load_comments=1" title="View this post with up to its first 100 comments" class="icon-str"> <span class="span icon arrow-lg-circle-r m"></span> <span class="str"> <span>Click here to view up to the first 100 of this post's</span> <span class="comm_count-post-126145">0</span> <span>comments</span> </span> </a>'''
