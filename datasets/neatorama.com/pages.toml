full_description = '''Top Ten Baby Names of 2017 Miss Cellania • Saturday, May 12, 2018 at 5:25 AM • 4 Parents who are considering the naming of a new person this year might take inspiration from the list of the most popular baby names from last year. Or they might try their best to avoid them. After all, you don't want your daughter to be one of six girls with the same name in her class, do you? Or maybe you do. The Social Security Administration has released the statistics for baby names from 2017. On the same page, you can look up historical rankings of baby names, or enter a name and track its popularity over time. The names on the top ten didn't change all that much from last year; for girls, Emma has been #1 and Olivia #2 for four years now, and Liam was #2 in 2016. The names that show the most popularity increase are still fairly obscure (although Oaklynn might be pretty popular if you combine the different spellings). -via Mental Floss Tags: Baby Name, Baby Name 2017, Popular Baby Name Like this? Please share & join us Related Neatorama Posts A Colorful Map Showing The Top Baby Names Of 2016 By State The Biggest Changes on the 2016 SSA Baby Names List Hip Baby Name Ideas From The Dictionary Of Medieval Names 105 Years of Baby Names by State The Top Baby Names Of 2016 Related NeatoShop Items Baby Tree Don't push that button Berserk Baby Tree Baby Elephant Uni-Bunny Baby BABY PANTHER From the NeatoShop <a href="/neatobambino/2018/05/12/Top-Ten-Baby-Names-of-2017/?load_comments=1" title="View this post with up to its first 100 comments">Comments (<span class="comm_count-post-101761">0</span>)</a> document.write('Comments (<span class="comm_count-post-101761">0</span>)'); Commenting is closed. <a href="/neatobambino/2018/05/12/Top-Ten-Baby-Names-of-2017/?load_comments=1" title="View this post with up to its first 100 comments" class="icon-str"> <span class="span icon arrow-lg-circle-r m"></span> <span class="str"> <span>Click here to view up to the first 100 of 