full_description = '''The Great Garrett Underpants Miss Cellania • Thursday, July 12, 2018 at 6:01 AM • 15 Emilie and Ryan Matthias have cried oceans of tears over the last nine months as their 5-year-old son Garrett battled cancer. Garrett, though, never lost his sense of humor. So instead of a standard funeral, his parents are carrying out Garrett's wishes in a celebration of his life Saturday that will feature bouncy castles and an appearance by Batman. Here's just a portion of the obituary for Garrett Michael Matthias.When I die: I am going to be a gorilla and throw poo at Daddy!Burned or Buried: I want to be burned (like when Thor’s Mommy died) and made into a tree so I can live in it when I’m a gorillaBig or Small Funeral: Funerals are sad: I want 5 bouncy houses (because I’m 5), Batman, and snow conesEmilie and Ryan Matthias will honor Garrett’s final wishes by having a Celebration of Life on Saturday, July 14th from 5pm – 11pm at 2377 132nd Ct Van Meter, IowaNote: Symbolic Asgardian burial ceremony and fireworks will be held just after sunsetA private burial of Garrett’s ashes will be held at a later time once his parents figure out how the hell to get his ashes made into a tree and locate a nature preserve, so his tree resides in a protected area.There's a lot more to it, well worth a read. The Matthiases constructed the obituary from things Garrett said. It will be an awesome sendoff for an awesome kid. -via Metafilter (Image source: GoFundMe) Tags: Garrett Matthias, Obituary, Funeral, Child Cancer Like this? Please share & join us Related Neatorama Posts Big Bird Breaks Our Hearts German Village Sells Snow for Fundraising. The Story of Electron Boy, the Child Turned into a Superhero by the Make-A-Wish Foundation, Made into Comic Book Real Life Spider-Man Rescues Child From the NeatoShop <a href="/neatobambino/2018/07/12/The-Great-Garrett-Underpants/?load_comments=1" title="View this post with up to its first 100 comments">Comments (<span class="comm_count