title = "We Don't Really Know What the Dodo Looked Like - Neatorama"
description = "The dodo was a flightless bird native to Mauritius, and was first described in 1598. It's been said that the dodo was so friendly that it would walk right up to people, making it easy to kill. These birds didn't have any natural predators besides man, and the last confirmed sighting was in 1662. That's barely a half-century that we knew about them, and afterward it wwa said that dodos were mythical all along. But they were real, and we have a few skeletons to prove it. But I just now learned that we real..."
full_description = '''We Don't Really Know What the Dodo Looked Like Miss Cellania • Saturday, February 22, 2025 at 7:54 PM The dodo was a flightless bird native to Mauritius, and was first described in 1598. It's been said that the dodo was so friendly that it would walk right up to people, making it easy to kill. These birds didn't have any natural predators besides man, and the last confirmed sighting was in 1662. That's barely a half-century that we knew about them, and afterward it wwa said that dodos were mythical all along. But they were real, and we have a few skeletons to prove it. But I just now learned that we really don't know what the dodo looked like! A few paintings were made, but these were often painted by artists who had never seen the actual bird.Sir David Attenborough tells us what we know and what we don't know about the dodo, including some speculation on what they really looked like based on genetic testing. The animated dodo he is talking to may or may not be an accurate representative. Attenborough, however, is real in this clip from the PBS series Nature. -via Born in Space <a href="/2025/02/22/We-Dont-Really-Know-What-the-Dodo-Looked-Like/?load_comments=1" title="View this post with up to its first 100 comments">Comments (<span class="comm_count-post-126144">0</span>)</a> document.write('Comments (<span class="comm_count-post-126144">0</span>)'); Newest 1 Newest 1 Comment Please enable JavaScript in your web browser to post a comment. Start New Comment Thread... Commenting on Neatorama will earn you NeatoPoints! Preview Comment me • seconds ago • 0 Abusive comment hidden. (Show it anyway.) Start New Thread Post Your Reply (function() { let quill = new Quill('#comm_body-post-126144', { modules: { toolbar: [ [ 'bold', 'italic', 'strike' ], [ 'blockquote' ], [ 'link' ], [ 'clean' ], ], }, theme: 'snow', }); let $toolbars = $('#comm_body-post-126144 .ql-toolbar'); if ($toolbars.length > 1) { $toolbars.eq(0).remove(); } quill.on('text-change', 