["https://www.neatorama.com/2024/09/01/Meet-the-Dreaded-Jiangshi-the-Chinese-Hopping-Corpse"]
title = "Meet the Dreaded Jiangshi, the Chinese Hopping Corpse - Neatorama"
description = "Almost every culture has legends of restless human corpses that come back to terrify the living. What do they want? Zombies want to eat our brains, vampires want to drink our blood, and ghosts want revenge. The legendary Chinese ghost called Jiangshi makes more sense because what the dead want is their life force back, and they will take yours. What's really fascinating are the details that gave rise to the legend, which have to do with old Chinese funerary practices, and priests who were seen as control..."
full_description = '''Meet the Dreaded Jiangshi, the Chinese Hopping Corpse Miss Cellania • Sunday, September 1, 2024 at 4:11 AM Almost every culture has legends of restless human corpses that come back to terrify the living. What do they want? Zombies want to eat our brains, vampires want to drink our blood, and ghosts want revenge. The legendary Chinese ghost called Jiangshi makes more sense because what the dead want is their life force back, and they will take yours. What's really fascinating are the details that gave rise to the legend, which have to do with old Chinese funerary practices, and priests who were seen as controlling the movements of a corpse. Still, corpses are stiff and awkward, so the Jiangshi moves by hopping. That's how you recognize them. The claws and sharp teeth are a dead giveaway, too. Dr. Emily Zarka of Monstrum explains the origins of the Jiangshi and how the story has undergone alterations in the modern era as they merged somewhat with Western vampire legends for popular Hong Kong movies. Not only do you get the origin story of the Jiangshi, you also get some horror film recommendations. <a href="/2024/09/01/Meet-the-Dreaded-Jiangshi-the-Chinese-Hopping-Corpse/?load_comments=1" title="View this post with up to its first 100 comments">Comments (<span class="comm_count-post-125331">1</span>)</a> document.write('Comments (<span class="comm_count-post-125331">1</span>)'); Newest 1 Newest 1 Comment sandyra • 01Sep24 7:36am • 0 I think almost anyone can outrun a hopping corpse. Now, what if it were a crawler? That might work by sneaking up on sleeping people. Maybe they should have had it skipping? That's faster. But hopping? That makes noise. Nah, they didn't think that ghoul through. Abusive comment hidden. (Show it anyway.) Login to comment. <a href="/2024/09/01/Meet-the-Dreaded-Jiangshi-the-Chinese-Hopping-Corpse/?load_comments=1" title="View this post with up to its first 100 comments" class="icon-str"> <span class="span icon arrow-lg-circle-r m"></span> <span class="str"> <span>Click here to view up to the first 100 of this post's</span> <span class="comm_count-post-125331">1</span> <span>comments</span> </span> </a>'''
