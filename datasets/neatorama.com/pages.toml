full_description = '''Black Sabbath Performs a John Denver Song Miss Cellania • Friday, February 21, 2025 at 10:12 AM They were both hot artists in the 1970s, but there was never a collaboration between John Denver and Black Sabbath. It would be hard to even conceive of such a thing. Yet here we are, all these years later, listening to Ozzie sing the lyrics of "Take Me Home, Country Roads" to the tune of "War Pigs." You can thank There I Ruined It (previously at Neatorama) Rarely am I disappointed by a song from Dustin Ballard and company, and that's not saying I am disappointed with this one. However, when the music began began, I just wished it was the inverse, with Denver crooning the lyrics to "War Pigs." Lo and behold, we get a tiny snippet of such a song at the end. It's only 15 seconds worth, but you take what you can get. If the public demand is there, we may hear the entire song in the future. <a href="/2025/02/21/Black-Sabbath-Performs-a-John-Denver-Song/?load_comments=1" title="View this post with up to its first 100 comments">Comments (<span class="comm_count-post-126138">1</span>)</a> document.write('Comments (<span class="comm_count-post-126138">1</span>)'); Newest 1 Newest 1 Comment Alan...yes THAT Alan • 24Feb25 7:53pm • 0 This is exactly why computers were invented! Abusive comment hidden. (Show it anyway.) Please enable JavaScript in your web browser to post a comment. Start New Comment Thread... Commenting on Neatorama will earn you NeatoPoints! Preview Comment me • seconds ago • 0 Abusive comment hidden. (Show it anyway.) Start New Thread Post Your Reply (function() { let quill = new Quill('#comm_body-post-126138', { modules: { toolbar: [ [ 'bold', 'italic', 'strike' ], [ 'blockquote' ], [ 'link' ], [ 'clean' ], ], }, theme: 'snow', }); let $toolbars = $('#comm_body-post-126138 .ql-toolbar'); if ($toolbars.length > 1) { $toolbars.eq(0).remove(); } quill.on('text-change', function() { let $editor = $('#comm_body-post-126138 .ql-editor'); let value