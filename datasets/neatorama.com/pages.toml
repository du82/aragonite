["https://www.neatorama.com/spotlight"]
title = "Neatorama Spotlight"
full_description = '''Cinemaps: Plotting the Fantasy Worlds of the Silver Screen Miss Cellania • Tuesday, November 21, 2017 at 2:00 AM • 23 <img src="http://uploads.neatorama.com/images/posts/375/99/99375/1511112021-0.jpg" alt="" class="post-img-"/> Take a stroll through fantasyland, courtesy of Hollywood and Cinemaps! The new book Cinemaps: An Atlas of 35 Great Movies features 35 beautiful full-color maps of your favorite fictional movie worlds that will help you relive stories from 1933's King Kong through modern classics like Mad Max: Fury Road and Guardians of the Galaxy. Artist Andrew DeGraff illustrates the geography, the path of the plot, and the mood of each adventure, accompanied by A. D. Jameson's essay's on each film. Neatorama is pleased to give you a close look at some of these maps, with exclusive commentary by the artist. Continue reading 2 Load More Comments Commenting is closed. What Makes a Genius? Miss Cellania • Tuesday, April 25, 2017 at 11:00 AM • 15 <img src="http://uploads.neatorama.com/images/posts/8/96/96008/1493136194-0.jpg" alt="" class="post-img-"/> The May 2017 issue of National Geographic features an in-depth look at What Makes a Genius. Author Claudia Kalb and photographer Paolo Woods bring us examples of genius, from Leonardo da Vinci to jazz pianist Keith Jarrett, with an overview of the scientific research into what makes those kinds of people different from the rest of us. Continue reading to see a preview. Continue reading 1 Load More Comments Commenting is closed. Nikon Small World Photography Winners 2016 Miss Cellania • Wednesday, October 19, 2016 at 8:00 AM • 62 <img src="http://uploads.neatorama.com/images/posts/43/93/93043/1476879734-0.jpg" alt="" class="post-img-"/> Dr. Oscar Ruiz of the University of Texas MD Anderson Cancer Center won top honors today at the annual Nikon Small World competition with this image of a four-day-old zebrafish. The story of why he took it is as fascinating as the image. The Nikon Small World contest honors the beauty and technical skill shown in the tiniest parts of our world found through microphotography. See the top twenty photographs from the competition right here. Continue reading 1 Load More Comments Commenting is closed.'''
