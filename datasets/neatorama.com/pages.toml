title = 'Why There Are "Rules" for LEGO Bricks - Neatorama'
description = '''You've hear about "illegal" LEGO techniques or joins or methods. The LEGO company has no power of law over what you do with the LEGO pieces you have bought and paid for, so the term "illegal" should be taken with a grain of salt. But the company does have its own rules for users to follow. These rules are codified building techniques that try to ensure that whatever you build will be sturdy enough to stay built and won't warp or break the bricks you used to make it. I think some of these rules might be f...'''
full_description = '''Why There Are "Rules" for LEGO Bricks Miss Cellania • Monday, February 24, 2025 at 6:49 PM You've hear about "illegal" LEGO techniques or joins or methods. The LEGO company has no power of law over what you do with the LEGO pieces you have bought and paid for, so the term "illegal" should be taken with a grain of salt. But the company does have its own rules for users to follow. These rules are codified building techniques that try to ensure that whatever you build will be sturdy enough to stay built and won't warp or break the bricks you used to make it. I think some of these rules might be for safety's sake, too. Beyond that, this video gives us a glimpse into the world of the LEGO company and how they produce so many building pieces of so many different kinds, resulting in glorious sets designed for every type of fandom. It's a little over seven minutes long; the rest is an ad. <a href="/2025/02/24/Why-There-Are-Rules-for-LEGO-Bricks/?load_comments=1" title="View this post with up to its first 100 comments">Comments (<span class="comm_count-post-126150">0</span>)</a> document.write('Comments (<span class="comm_count-post-126150">0</span>)'); Please enable JavaScript in your web browser to post a comment. Start New Comment Thread... Commenting on Neatorama will earn you NeatoPoints! Preview Comment me • seconds ago • 0 Abusive comment hidden. (Show it anyway.) Start New Thread Post Your Reply (function() { let quill = new Quill('#comm_body-post-126150', { modules: { toolbar: [ [ 'bold', 'italic', 'strike' ], [ 'blockquote' ], [ 'link' ], [ 'clean' ], ], }, theme: 'snow', }); let $toolbars = $('#comm_body-post-126150 .ql-toolbar'); if ($toolbars.length > 1) { $toolbars.eq(0).remove(); } quill.on('text-change', function() { let $editor = $('#comm_body-post-126150 .ql-editor'); let value = $editor.html(); $('#comm_body-value-post-126150').val(value); let $form = $('#commentform-post-126150'); let l = $.trim($editor.text()).length; $(".comment-su