["https://www.neatorama.com/2025/02/22/What-Should-Be-on-an-Anti-Reading-List"]
title = "What Should Be on an Anti-Reading List? - Neatorama"
description = "Fun question from @Sam__Enright:What&rsquo;s the &ldquo;anti-reading list&rdquo; in your field of expertise? pic.twitter.com/vawry5SLok&mdash; Alec Stapp (@AlecStapp) February 21, 2025 This is an interesting question by Alec Stapp. What books are widely popular but regarded by scholars or experts within their respective fields as bunk?I have expertise in nothing, but the question reminds me of The Age of Arthur by John Morris. It's a history of early medieval Britain. The author, a highly respected histo..."
full_description = '''What Should Be on an Anti-Reading List? John Farrier • Saturday, February 22, 2025 at 6:27 AM Fun question from @Sam__Enright:What’s the “anti-reading list” in your field of expertise? pic.twitter.com/vawry5SLok— Alec Stapp (@AlecStapp) February 21, 2025 This is an interesting question by Alec Stapp. What books are widely popular but regarded by scholars or experts within their respective fields as bunk?I have expertise in nothing, but the question reminds me of The Age of Arthur by John Morris. It's a history of early medieval Britain. The author, a highly respected historian, argues for the historicity of Arthur as an actual person. Although widely read, other historians regard it as preposterous and the work greatly damaged Morris's reputation.Reading it, I could understand why. Morris describes historical records of various Celtic warlords in Fifth Century Britain and leaps to the conclusion these necessarily describe a real Arthur instead of, well, just various Celtic warlords.More generally, I'm skeptical of general purpose public intellectuals. I think it's impossible to be an expert in more than one field, so I hesitate to give credence to scholars writing or speaking outside of their expertise. And we should not underestimate the capacity of experts to be wrong.What books do you think should be on an anti-reading list as defined by Sam Enright?(Not just books that you don't like.) Tags: Reading, Books <a href="/2025/02/22/What-Should-Be-on-an-Anti-Reading-List/?load_comments=1" title="View this post with up to its first 100 comments">Comments (<span class="comm_count-post-126140">7</span>)</a> document.write('Comments (<span class="comm_count-post-126140">7</span>)'); Newest 5 Newest 5 Comments gwdMaine • 22Feb25 10:07am • 1 An Indigenous People's History of the United States - Roxanne Dunbar-OrtizI am not an expert either but my personal library has over thirty books covering the history of the American Indian Tribes. Biographies of the major players, multiple in some cases, along with histories of major events, battles, and massacres - The Trail of Tears, The Long March, Custer, Sitting Bull, Cochise, Geronimo, Red Cloud, The Osage - It's fair to say I'm well read.If one is looking for an objective point of view as told by the Indian side, this isn't it. Dunbar-Ortiz is much too casual with the word genocide. She writes from the view that colonization by itself is an act of genocide and it's all downhill from there. A brief overview of the remarkable state structure of the Iroquois Confederacy, but no mention that to get there, they destroyed the Mohicans, Huron, Neutral, Erie, Susquehannock, and northern Algonquins, with brutality many historians have labeled genocide. The founding of Jamestown is the Roots of Genocide; a second sub-chapter: Settler-Parasites Create The Virginia Colony.This history is nothing more than a biased diatribe against white America. Abusive comment hidden. (Show it anyway.) Jeff the Baptist in reply to John Farrier • 22Feb25 7:36am • 1 I think most places use it as an example of what not to do, a historians version of the Tacoma Narrow Bridge as it were. But there was a concerted effort to rehabilitate Bellesiles and the book around 2019. There are also people who just don't know the problems with it. Abusive comment hidden. (Show it anyway.) John Farrier • 22Feb25 7:25am • 0 It is good that Bellesiles faced real consequences for his fraud. I didn't know that the book was still being used actively. Abusive comment hidden. (Show it anyway.) Jeff the Baptist • 22Feb25 7:17am • 1 Here's another firearms related one: Arming America: The Origins of a National Gun Culture by Michael Bellesiles. This book came out in 2000 and was widely lauded for its rewrite of American firearms history, going so far as to win the Bancroft Prize in 2001. It is also the only work for which the Bancroft prize has been rescinded. The book is essentially a fraud. Bellesiles develops his narrative using property records which don't exist (like probate records destroyed in the San Francisco fire of 1906). Many of his quotes and citations are totally out of context. It was essentially acclaimed for entirely political reasons and once historians took a deeper look at it, its merit completely evaporated. But you will occasionally see people cite it either unaware of the issues or because they believe the work was the result of political backlash. Abusive comment hidden. (Show it anyway.) Jeff the Baptist • 22Feb25 6:57am • 1 Another one is anything on Colt firearms by R.L. Wilson. Wilson was a widely cited expert on Colts in the 1970s through the 1990s, wrote several books on the subject, and also worked as an appraiser and broker. The problem is he was also using his recognition to commit widespread fraud and enrich himself. His entire body of work, which dominated the Colt history for at least a generation, is now considered suspect.Ian McCollum (https://www.youtube.com/watch?v=2nhUpPbqD44) and C&Rsenal both did pieces on him. Abusive comment hidden. (Show it anyway.) Please enable JavaScript in your web browser to post a comment. Start New Comment Thread... Commenting on Neatorama will earn you NeatoPoints! Preview Comment me • seconds ago • 0 Abusive comment hidden. (Show it anyway.) Start New Thread Post Your Reply (function() { let quill = new Quill('#comm_body-post-126140', { modules: { toolbar: [ [ 'bold', 'italic', 'strike' ], [ 'blockquote' ], [ 'link' ], [ 'clean' ], ], }, theme: 'snow', }); let $toolbars = $('#comm_body-post-126140 .ql-toolbar'); if ($toolbars.length > 1) { $toolbars.eq(0).remove(); } quill.on('text-change', function() { let $editor = $('#comm_body-post-126140 .ql-editor'); let value = $editor.html(); $('#comm_body-value-post-126140').val(value); let $form = $('#commentform-post-126140'); let l = $.trim($editor.text()).length; $(".comment-submit.save,.comment-submit.preview", $form).prop({disabled:l == 0}); }); })(); Submit Commen