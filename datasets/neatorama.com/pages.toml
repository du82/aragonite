description = '''If you dislike horror movies, you might want to shield your children from them, but sooner or later they're going to see something that might traumatize them while visiting friends. If you enjoy horror movies, you don't want to traumatize your child and turn them against the movies you love. There are films made for children that will introduce them to the thrill of being scared -but not too scared. Den of Geek has a list of movies that "offer children a safe, but interesting, introduction to the world o...'''
full_description = '''Introducing Kids to Horror Films Miss Cellania • Friday, September 28, 2018 at 1:45 PM • 7 If you dislike horror movies, you might want to shield your children from them, but sooner or later they're going to see something that might traumatize them while visiting friends. If you enjoy horror movies, you don't want to traumatize your child and turn them against the movies you love. There are films made for children that will introduce them to the thrill of being scared -but not too scared. Den of Geek has a list of movies that "offer children a safe, but interesting, introduction to the world of horror, with archetypal tropes, characters and even the odd jump scare." The trick here is to watch with your children, so you can pause, explain, and reassure when necessary. When your child is older and has seen the movies made for kids, then what? Elementary students and tweens may get a thrill out of gore and jump scares, but to really appreciate the horror genre, they need to see well-made movies that engage the viewer. For that, you might consult the list of 81 Best Creepy Horror Movies, although you'll want to select movies you've already seen to ensure they are appropriate for your children. Older classics like Gaslight or The Uninvited will give them the creeps without the sex and violence of newer movies. Watching horror movies that are age-appropriate will help prepare your children for the time they are old enough to go to a theater without you. Like this? Please share & join us From the NeatoShop <a href="/neatobambino/2018/09/28/Introducing-Kids-to-Horror-Films/?load_comments=1" title="View this post with up to its first 100 comments">Comments (<span class="comm_count-post-102694">3</span>)</a> document.write('Comments (<span class="comm_count-post-102694">3</span>)'); Newest 3 Newest 3 Comments BLACKLISTED: Alan...yes THAT Alan • 28Sep18 9:11pm • 6 Poltergeist: When the kid turned on his bedroom light and the clown doll he'd left on the chair wasn't there any more. Scariest thing in the world to a 10-year-old kid. Still scary. Abusive comment hidden. (Show it anyway.) BLACKLISTED: Booga • 28Sep18 3:56pm • 4 I remember being introduced to horror via John Carpenter's "The Thing" when I was a kid. Specifically the electro-shocks to the chest scene. Nightmares for weeks... but that still didn't stop me from enjoying the movie years later once I could handle it. Even "The Secret of Nimh" had some scary themes and scenes for a kid. Abusive comment hidden. (Show it anyway.) BLACKLISTED: Miss Cellania • 27Sep18 5:03am • 4 The first adult horror film my kids saw was Carrie. I warned them as we went along that it was going to get scary. They were intrigued with the story, then by the time the prom went to hell, it became apparent that I oversold the horror, because they weren't that frightened. Abusive comment hidden. (Show it anyway.) Commenting is closed. <a href="/neatobambino/2018/09/28/Introducing-Kids-to-Horror-Films/?load_comments=1" title="View this post with up to its first 100 comments" class="icon-str"> <span class="span icon arrow-lg-circle-r m"></span> <span class="str"> <span>Click here to view up to the first 100 of this post's</span> <span class="comm_count-post-102694">3</span> <span>comments</span> </span> </a> We hope you like this article! Please help us grow by sharing: Tweet Get Updates In Your Inbox Free weekly emails, plus get access to subscriber-only prizes. We won't share your email. You can cancel at any time.'''
