["https://www.neatorama.com/neatobambino/2018/06/11/How-To-Get-Your-Kids-To-Do-Chores-Without-Resenting-It"]
title = "How To Get Your Kids To Do Chores (Without Resenting It) - Neatorama"
description = "Psychologists and anthropologists have long observed how children in Mexico and Guatemala help around the house. Not only do they begin doing household chores earlier than children in the US, they continue to do so as they grow up, and they don't have to be told to do so, or even asked to. They happily contribute their work on their own as a matter of course.They help do the laundry, help cook meals, help wash dishes. And they often do chores without being told. No gold stars or tie-ins to allowances nee..."
full_description = '''How To Get Your Kids To Do Chores (Without Resenting It) Miss Cellania • Monday, June 11, 2018 at 5:32 AM • 6 Psychologists and anthropologists have long observed how children in Mexico and Guatemala help around the house. Not only do they begin doing household chores earlier than children in the US, they continue to do so as they grow up, and they don't have to be told to do so, or even asked to. They happily contribute their work on their own as a matter of course.They help do the laundry, help cook meals, help wash dishes. And they often do chores without being told. No gold stars or tie-ins to allowances needed.In one study, psychologist Barbara Rogoff and her colleagues interviewed moms in Guadalajara, Mexico, who had indigenous ancestry. The researchers asked the moms what their children, who were all between the ages of 6 and 8, do to help around the house and how often they do these tasks voluntarily.The study — published in 2014 — contains some of the most remarkable quotes I have ever seen in a research article.For example, one mother said her 8-year-old daughter comes home from school and declares: "Mom, I'm going to help you do everything." Then she "picks up the entire house, voluntarily," the study reported."Another time, the mom comes home from work, and she's really tired," says Rogoff of the University of California, Santa Cruz. "She just plops herself down on the couch. And the daughter, says, 'Mom you're really tired, but we need to clean up the house. How about I turn on the radio and I take care of the kitchen and you take care of the living room and we'll have it all cleaned up?' "Volunteering to help is such an important trait in kids that Mexican families even have a term for it: acomedido.Recent research reveals the cultural differences in childrearing practices that lead to acomedido. Read how Mexican families teach children the value of household chores at NPR. -via Digg (Image credit: Adriana Zehbrauskas for NPR) Tags: Chores, Childrearing, Mexico, Guatemala, Housework Like this? Please share & join us Related Neatorama Posts Parenting through History: A Look at Childrearing in Five Historic Societies Things People Should, But Don't, Tell You About Having Kids The Barbarian’s Guide to Parenting Smaller Balls, Better Dads A Brief History of the Children's Menu Related NeatoShop Items Bad Children Mama Bear Loves Her Children Wolf children From the NeatoShop <a href="/neatobambino/2018/06/11/How-To-Get-Your-Kids-To-Do-Chores-Without-Resenting-It/?load_comments=1" title="View this post with up to its first 100 comments">Comments (<span class="comm_count-post-101912">4</span>)</a> document.write('Comments (<span class="comm_count-post-101912">4</span>)'); Newest 4 Newest 4 Comments BLACKLISTED: Miss Cellania in reply to Arvin • 13Jun18 2:40am • 2 Well then, I am glad to be wrong! Thanks, Arvin. Abusive comment hidden. (Show it anyway.) BLACKLISTED: Arvin • 12Jun18 10:30pm • 3 "For example, one mom told us: 'When my toddler was doing the dishes, at the beginning, the water was all over the place, but I would allow my son to the dishes because that's how he learned,' " she says. Abusive comment hidden. (Show it anyway.) BLACKLISTED: Alex Santoso • 12Jun18 2:11pm • 1 A key finding from the article:And they didn't need a reward for their assistance. In fact, the toddlers were less likely to help a second time if they were given a toy afterward, the study found."Children appear to have an intrinsic motivation to help," psychologists Felix Warneken and Michael Tomasello concluded. "And extrinsic rewards seem to undermine it." Abusive comment hidden. (Show it anyway.) BLACKLISTED: Miss Cellania • 11Jun18 5:34am • 5 And once you read the article, you realize it is all. About. Girls. No boys were mentioned at all, yet they didn't address that discrepancy. I have to wonder what the original research said. Abusive comment hidden. (Show it anyway.) Commenting is closed. <a href="/neatobambino/2018/06/11/How-To-Get-Your-Kids-To-Do-Chores-Without-Resenting-It/?load_comments=1" title="View this post with up to its first 100 comments" class="icon-str"> <span class="span icon arrow-lg-circle-r m"></span> <span class="str"> <span>Click here to view up to the first 100 of this post's</span> <span class="comm_count-post-101912">4</span> <span>comments</span> </span> </a> We hope you like this article! Please help us grow by sharing: Tweet Get Updates In Your Inbox Free weekly emails, plus get access to subscriber-only prizes. We won't share your email. You can cancel at any time.'''
