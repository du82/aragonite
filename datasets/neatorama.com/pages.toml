description = "The best art will be relatable to many people, and will touch your emotions. That's exactly what the kinetic sculpture Eternal Frustration does- it pushes our emotional buttons. All of us have spent way too much of our precious time trying to find the end of transparent tape on a roll. Box tape is even worse than cellophane tape. The process is like Sisyphus rolling a stone up hill, knowing that the task is futile in the long run. If you are lucky enough to find the end, you find that getting your finger..."
full_description = '''Kinetic Sculpture Illustrates Eternal Frustration Miss Cellania • Monday, February 24, 2025 at 10:06 AM The best art will be relatable to many people, and will touch your emotions. That's exactly what the kinetic sculpture Eternal Frustration does- it pushes our emotional buttons. All of us have spent way too much of our precious time trying to find the end of transparent tape on a roll. Box tape is even worse than cellophane tape. The process is like Sisyphus rolling a stone up hill, knowing that the task is futile in the long run. If you are lucky enough to find the end, you find that getting your fingernail under a corner isn't the end of your problems, because the tape will split just to spite you. The sculpture is from Italian designer Amedeo Capelli of Stoccafisso design (previously at Neatorama), who knows how to get a rise out of the viewer. Some of his more whimsical and pleasant automata are available at his Etsy shop. -via Boing Boing <a href="/2025/02/24/Kinetic-Sculpture-Illustrates-iEternal-Frustrationi/?load_comments=1" title="View this post with up to its first 100 comments">Comments (<span class="comm_count-post-126148">0</span>)</a> document.write('Comments (<span class="comm_count-post-126148">0</span>)'); Please enable JavaScript in your web browser to post a comment. Start New Comment Thread... Commenting on Neatorama will earn you NeatoPoints! Preview Comment me • seconds ago • 0 Abusive comment hidden. (Show it anyway.) Start New Thread Post Your Reply (function() { let quill = new Quill('#comm_body-post-126148', { modules: { toolbar: [ [ 'bold', 'italic', 'strike' ], [ 'blockquote' ], [ 'link' ], [ 'clean' ], ], }, theme: 'snow', }); let $toolbars = $('#comm_body-post-126148 .ql-toolbar'); if ($toolbars.length > 1) { $toolbars.eq(0).remove(); } quill.on('text-change', function() { let $editor = $('#comm_body-post-126148 .ql-editor'); let value = $editor.html(); $('#comm_body-value-post-126148').val(value); let $form = $(