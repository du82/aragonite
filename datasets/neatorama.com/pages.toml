["https://www.neatorama.com/2015/03/25/Berkeley-Spampocalypse"]
title = "Berkeley Spampocalypse - Neatorama"
description = "Have you ever been caught in an email storm? Someone sends an email to a list instead of one recipient, then some on the list hit &ldquo;reply all&rdquo; to complain about it, and the emails escalate from there. It&rsquo;s a mistake that has happened before, but this time it had a happy ending for some folks.It all started late last Tuesday when Nigel Guest, president of a Berkeley community group called the Council of Neighborhood Associations, attempted to send an email to himself that mistakenly hit t..."
full_description = '''Berkeley Spampocalypse Miss Cellania • Wednesday, March 25, 2015 at 10:00 PM Have you ever been caught in an email storm? Someone sends an email to a list instead of one recipient, then some on the list hit “reply all” to complain about it, and the emails escalate from there. It’s a mistake that has happened before, but this time it had a happy ending for some folks.It all started late last Tuesday when Nigel Guest, president of a Berkeley community group called the Council of Neighborhood Associations, attempted to send an email to himself that mistakenly hit the inboxes of thousands of registered voters.The brief email, with the subject line “test,” included a single character: “x.” Instead of ignoring the message, some of the recipients responded to ask why they gotten it. And, rather than replying only to Guest, they made the fateful, likely unintentional, decision to reply all.What resulted was a string of thousands of emails going to thousands of people in Berkeley -and elsewhere. Some people ignored it, some were upset, and some had fun with it. You can see an imgur gallery with selected emails from the storm, including memes and t-shirts to commemorate the event.One person in the chain asked when the potluck would be ...and the suggestion that they get together drew the immediate interest of list members who kept their sense of humor, so they started a Facebook group called CNA Survivors and an event page to plan the picnic. The picnic was held Sunday, and about 70 Berkeley voters came together in the spirit of community and shared tribulation.A good time was had by all …who attended. -via Metafilter(Image credit: Drew Wheeler) Tags: Email Storm, Spamocalypose, Berkeley, Reply All Related Neatorama Posts Comedy Sketch: Email in Real Life Trivial Revenge A Teenager Replies Dad Asks Three-Year-Old To List All The Bad Words He Knows The Most Canadian Story You've Read All Week Related NeatoShop Items That's all A-holes So long, and thanks for ALL the fish! Captain All Star Number 138 & 139 - Gotta' derp 'em all! Darth Maul - Star Wars Head Shape Carry All <a href="/2015/03/25/Berkeley-Spampocalypse/?load_comments=1" title="View this post with up to its first 100 comments">Comments (<span class="comm_count-post-80538">3</span>)</a> document.write('Comments (<span class="comm_count-post-80538">3</span>)'); Newest 3 Newest 3 Comments John Farrier in reply to Miss Cellania • 27Mar15 3:20pm • 1 Sadly, no. I did get a laugh, though. Abusive comment hidden. (Show it anyway.) Miss Cellania • 26Mar15 8:46pm • 0 Did you get a picnic out of it? Abusive comment hidden. (Show it anyway.) John Farrier • 26Mar15 6:37pm • 1 This happened once when I was working for a large city in the American South. Someone accidentally emailed every employee in the entire city. This was followed by many complaints, of course sent after clicking on Reply All. It lasted at least two days. Abusive comment hidden. (Show it anyway.) Login to comment. <a href="/2015/03/25/Berkeley-Spampocalypse/?load_comments=1" title="View this post with up to its first 100 comments" class="icon-str"> <span class="span icon arrow-lg-circle-r m"></span> <span class="str"> <span>Click here to view up to the first 100 of this post's</span> <span class="comm_count-post-80538">3</span> <span>comments</span> </span> </a>'''
