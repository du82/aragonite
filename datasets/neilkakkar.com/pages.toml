title = "The Best Things I Learned In 2019 | Neil Kakkar"
description = "Year of 2019 in review, with the biggest ideas discovered, top lessons learned, and statistics about the blog."
full_description = '''The Best Things I Learned In 2019 Jan 4, 2020 • Life I didn’t know this at the time, but I sowed the seeds for this review on January 1st, 2019, when I wrote about how my day went, what I did, and what I learned. It’s funny how most reviews focus on things that happened in the past three months - that’s more like a quarterly review that happens once a year, isn’t it? Since it’s fresher in the mind, and easier to spot the recent faults, these morph into goals and new years resolutions. But what about the nine months before that? What if the issue you’re thinking about isn’t one-off, but a structural problem? At least, that’s what my last years review was like. But, things have changed a lot. I’ve felt remarkable growth this past year. Part of it has to do with this blog, and part has to do with the processes I put in place to become happier and more productive. I’ll focus on the best things I learned, some of my processes, and in the end, I’ll share how the content on this blog changed, what makes great content, stats about the blog, and some cool stuff from the Idea Muse. Table of Contents Most things online are crap Platforms over optimizations Questions are more important than answers Focusing on what didn’t happen Focusing on the obvious The flipside Compounding is powerful. Building intuition for compounding even more so. Initially, compounding feels linear Compounding is asymmetric Thinking in Systems Environment design Reduce friction If it irritates you, its got to go Free up as much time as possible for meaningful work Reduce number of decisions Putting them all together I’m extremely fucking lucky Tracking The Numbers Bite-sized ideas The Blog The right kind of content Distribution is key Challenging my own ideas Cringe Posts Stats Idea Muse How the human body works Books I read Looking forward Friendships Appendix: Doing your own annual review let banner_width = 55; $(document).ready(() => { $('a[href^="#"]').on('click', function(event) { var hash = '#' + $(this).attr('href').split('#')[1] var element = $(hash) if (element.length) { event.preventDefault(); history.pushState(hash, undefined, hash) $('html, body').animate({scrollTop: element.offset().top - banner_width}, 500) } }); window.addEventListener('popstate', function(e) { if(e.state && e.state.startsWith('#') && $(e.state).length){ $('html, body').animate({scrollTop: $(e.state).offset().top - banner_width}, 500) } }); $('html, body').on("scroll mousedown wheel DOMMouseScroll mousewheel keyup touchmove", function(){ $('html, body').stop(); }); if (location.hash) { // $('html,body').animate({scrollTop: $(location.hash).offset().top - banner_width}, 500) }; }); Most things online are crap I spent most of my life living through informational junk. The more time I spent in here, the more normal it seemed. I was like a trash-picker, looking for gold. Swimming through this junk, as I found bits and pieces of gold, I realised the junk didn’t have to be a normal state. Gold exists. But, the probability of finding gold as a trash-picker is low. I’d rather be in an environment with a higher base-rate: like a miner in a gold mine. First, lets clarify what’s junk. Informational-junk is like empty calories. If you’re looking for energy, the empty calories will fill you. However, if you’re looking for nutrition, empty calories are the worst kind of food. Likewise, if you’re looking for entertainment, informational junk will fulfil you. However, if you’re looking for growth, junk is garbage. With this idea in place, figuring out if something is junk means asking myself these 2 questions. What is this piece trying to say? What did I learn? If the answer to 2 is nothing then it’s informational-junk. If I can’t figure out the answer to 1, it’s either junk or too smart for me to understand, which is as good as junk right now. Iron ore is just another rock to a hunter-gatherer without ironworks These questions work only after I’ve read the piece though. It’s again a bit like eating. I’m trying to test whether the food I ate was junk or not, after its already in my stomach and bloating me up. Thankfully, the number of ways to package food is limited. So, over time, you figure out what’s junk and what makes you feel good. With information, there are a million ways to package it. This makes it much easier to consume information junk: You’re duped into thinking its nutritious. However, there are a few popular packagings which are usually junk. My top one for these is listicles. It’s someone forcing themselves to come up with random ideas to end the post on a round number. How the heck are most listicles round numbers? This is one major reason I don’t use lists as headings on this blog: it’s a forcing function to reduce the quality of your post by padding it with junk. Building a stream of nutritional information is harder than eating well. This idea led to writing on information overload and my process for filtering out junk. The short version: choose interesting people as sources of information, set up filters on your sources, and increase your consumption bandwidth. Platforms over optimizations If there’s one big idea I’ve discovered, it’s this. For any long term project, build platforms before optimizations. To curb my anime addiction, I created a hack for myself: “I can only watch anime while standing or walking”. This made it super hard to continue binging through the night. But, there was no way to enforce this. 4 days later, I got back from the gym, was too tired to stand, forgot all about this hack, and fell back into my old habit of watching anime while sitting. When was the last time you read a new hack and decided to try it out? And about a month later, you come across it again, and realise you forgot to do it after the third day? Hacks are fleeting. Any optimization that wants to make it into your routine needs time, practice, and constant reminders. Note: A hack is an optimization. Hacks aren’t necessarily bad, despite the common usage of the word. I like this word, and to PG, me, and a few other people, hearing the word hack is exciting. There’s no negative connotation involved. It’s exciting to figure out whether the “hack” in question is brilliant or a regular duct-taping ugly hack. What if, instead, I block anime from my laptop, fix up the old laptop as the anime stand, take away the chair, and create this new platform for watching anime? A platform is a base - something for you to stand on. Somewhere where what you do accumulates. It can be a process, or a physical platform. Habits are platforms. An optimization is a hack that helps you work better. Intermittent fasting, summarizing everything you read in your mind, deciding not to jizz, or not to watch anime are optimizations. Optimizations are meaningful only in the context of a platform. Without a platform, they don’t help much.1 The platform in the above example is the old laptop sitting on a desk. The optimization is removing the chair, so I only watch anime while standing up. The optimization might be right or wrong, it might change over time, but the platform is there to stay. It’s more resilient. It might even be antifragile2, as changes give you new ideas to improve the platform. On the other hand, platforms can break, just like optimizations. The difference is that platforms break with a sound. They throw an alert for you to know that its breaking. Optimizations don’t have this built-in. For example, with my anime platform, if I get on my bed to watch anime, the first alarm bell rings. “Oh, I can’t access things here. Why not?”. The second, weaker alarm bell is when I get to the anime stand and look for a chair to sit on. Whoops. Of course, I could unblock things on my laptop, but that’s extra mental effort and a conscious breaking of the platform - the alarm bell blasts off in my head. At least, this platform exists in physical space. Thinking hacks, on the other hand, are all in the mind. There’s no physical reminder to make things easier. No physical alarm bells. This is where process driven platforms shine. I do daily and weekly reviews on interesting hacks and ideas. Having this process of coming back to things means I can write down every hack, and figure out how to put them on top of each other. No hack is ever lost, just replaced with a better hack. One of the most exciting questions I’m tackling right now is whether I can create a platform for thinking better? Questions are more important than answers Why does a cut on the finger bleed a little but the same depth cut on the wrist can bleed a lot more? Questions bring the obvious and what’s not being said into focus. They are like a magnifying glass, bringing things into focus. By definition, the obvious is never the focus. By design, we can’t focus on what we can’t see. Breaking through this is what makes Sherlock Holmes so great. I don’t know what’s going on in his mind (or Sir Arthur Conan Doyles’) - but he’s able to focus on both of these, instead of just what feels exciting. Focusing on what didn’t happen “The dog not barking meant the victim knew the murderer.” The happy path to this insight would look something like: Mrs X has a dog, doesn’t she? Yes. What was the dog doing? Not sure. It didn’t even bark? Yeah. How interesting. Why not? Because it knew the person. There were probably quite a few more lines of questioning that didn’t lead anywhere. The challenge was to find the first interesting question - “Does Mrs. X have a dog?” - and let it lead you to the answer. Focusing on the obvious “The world is full of obvious things which nobody by any chance ever observes.” - Sherlock Holmes It’s a rainy day. Watson is out all day. When he returns, Sherlock immediately comments, “Were you at the club the entire day?”. Can you guess how? If I wrote the hint in, it would stand out instead of being obvious: His shoes were clean. I can think super hard about what’s obvious, but unless I frame questions, that thinking goes no where. The obvious is not interesting. You need questions to make the obvious interesting. For example, in this case, I’d begin with: “Can I figure out where Watson is coming from?” My first instinctive answer is “Yes, why not?”. That begins a process of elimination. The clues come into focus only when I have the right question to ask. Where all could he go? - His doctor’s practice, the club, home, enjoying the streets outside. .. Oh, but it’s raining outside. So, did he go outdoors or indoors? This cues observation. Is he clean? Yes. Did he take a bath again? Probably not, he only takes a bath in the mornings. So, he wasn’t out in the rain for long. So, indoors. But his clinic is far away, so either the club or home. There’s nothing at home, thus the club. If he were married and with kids at this time, the answer might’ve been different. This example is a bit contrived, but it shows how to surface the obvious. I don’t intend to use this idea just for deduction3. It’s for everything I do, and everything I write. If what I write isn’t lead by an interesting question, what I produce is usually meh or clickbaity. I’d take it a step further: If what I think isn’t directed by an interesting question, what I produce is garbage. See cringe posts. I wrote most of these because I needed something to write, not because I had an interesting question to answer. “If you don’t have questions, you won’t find the answers.” - Claude Shannon The flipside Since questions are so great at focusing, it’s important that I don’t get held up by the wrong questions. A question is like holding a magnifying glass in broad daylight - focus on the wrong thing and you’re going to burn. That’s the difference between “Why do I suck?” and “How can I become better?” or “What can I learn from this mistake?”. Whatever I ask, I’ll find the answer to. To answer the question we began with, blood flow is proportional to the size of arteries. Bigger arteries imply faster blood flow. Thus, the same cut on a bigger artery is more damaging. As you can imagine, the wrist has a bigger artery than the finger. Fun biology facts hiding in plain sight. Yup, this is just one of the coolest things I learned this year. Compounding is powerful. Building intuition for compounding even more so. Coming back to platforms, the entire idea behind platforms is to leverage compounding. Since platforms accumulate, compounding goes hand in hand with platforms. This blog compounds. Every idea I learn and connect compounds my knowledge. Every gym session compounds.4 I sometimes don’t see the effects, and I often underestimate the impact, but I’ve seen them enough times to hunt for compounding everywhere. It’s a superpower. This raises an interesting question. How do I figure out if something compounds? The answer is in relativity and growth rates. Something compounds if its relative growth is greater than 0. As Paul Graham put it: When I first meet founders and ask what their growth rate is, sometimes they tell me “we get about a hundred new customers a month.” That’s not a rate. What matters is not the absolute number of new customers, but the ratio of new customers to existing ones. If you’re really getting a constant number of new customers every month, you’re in trouble, because that means your growth rate is decreasing. Probably the best example is compound interest, which by definition compounds. At every iteration, your total money grows by r%, the rate of interest. This extra money is added to your total, so on the next iteration you have more money than before, which means the growth is more. Then, how does knowledge compound? Money is continuous5, but ideas are discrete. I like to think of knowledge as connections between ideas (or information). If every idea you discover sits in its own silo, your knowledge isn’t compounding. On every iteration, you’re adding one more piece of information. This is what makes (re)reading easier than assimilating information to create knowledge. To create knowledge, you need to form connections between the ideas and facts you have. If every new idea creates k% more connections, you have compounding. This makes intuitive sense, since the more information you have, the more chances you have for connecting that information to create knowledge. Reality though is a bit more messy. Not all ideas spark connections. You might go a long time consuming information before you figure out how it all connects. This happened to me when I started researching about climate change, and had to project things out of my mind before I could make sense of it. A scary corollary of Paul Graham’s advice for start ups is that if you’re learning 1 new thing every day, but fail to make the necessary connections to convert it into knowledge, your growth rate is slowing. Is that a problem? I’m not sure. Growth start-ups and human brains aren’t isomorphic.6 Now that we understand compounding, we need to develop a feel for it. This helps recognize it in the wild. Initial'''
