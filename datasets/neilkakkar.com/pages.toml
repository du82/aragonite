title = "Bayes Theorem: A Framework for Critical Thinking | Neil Kakkar"
description = "This is a complete guide to Bayes Theorem for critical thinking. Learn why we think the way we do, and how we can do better. Everything arises from this simple formula from Probability Theory - Bayes Theorem."
full_description = '''Bayes Theorem: A Framework for Critical Thinking Aug 4, 2020 • Life • Tech Have you ever noticed how you can be fuming with anger one second, and absolutely calm the next? An asshole driver cuts you off on the highway, and you’re raging. A moment later, you notice him pull into the hospital and your anger melts away. “Yeah, maybe he has a patient in the car with him. Or, maybe someone close is dying. I guess he’s not an asshole after all.” An obscure rule from Probability Theory, called Bayes Theorem, explains this very well. This 9,000 word blog post is a complete introduction to Bayes Theorem and how to put it to practice. In short, Bayes Theorem is a framework for critical thinking. By the end of this post, you’ll be making better decisions, realise when you’re being unreasonable, and also understand why some people believe in UFOs. It’s a hefty promise, and there’s a good chance of failure. Implementing these ideas will take emotional effort, but it’s worth it. Thinking the driver is an asshole is normal. Bayes Theorem expects the same. The difference between Bayes and us is the intensity with which we believe. Most times, the seething anger isn’t warranted. This is probably why we feel stupid about all that anger. It melts away so quickly! This is calibration - aligning our emotions to the intensity of the situation - which we’ll cover as well. There’s no fancy math in this guide. We’re using Probability Theory, but aren’t going into the derivation, nor are we solving probability problems from school textbooks. These things are tedious without understanding the why. Instead, we’ll understand why Bayes Theorem matters, and how to apply it. To begin with, let’s play a game. Throughout this game, notice how you feel about your decisions. Notice what decisions you’re making, and notice how you find the answer. Table of Contents The 2,4,6 game Bayes Explanation Bayes Theorem Being Late Example Grinding the Gears The 4 Rules for being a good Bayesian Probability is a map of your understanding of the world Update incrementally Seek disconfirming evidence Remember your priors Destroying cognitive biases Seeking disconfirming evidence for Bayes The 2,4,6 Game Revisited The Being Late Example Revisited Getting stronger Improve your priors Become a master hypothesis builder Learn the Math Putting it all together in practice Hypotheses with frequencies Growing the disk Switching hypotheses Strong Opinions, Weakly Held? This seems very different to what I learned in school Epilogue: The End is the Beginning Appendix: More Good Examples let banner_width = 55; $(document).ready(() => { $('a[href^="#"]').on('click', function(event) { var hash = '#' + $(this).attr('href').split('#')[1] var element = $(hash) if (element.length) { event.preventDefault(); history.pushState(hash, undefined, hash) $('html, body').animate({scrollTop: element.offset().top - banner_width}, 500) } }); window.addEventListener('popstate', function(e) { if(e.state && e.state.startsWith('#') && $(e.state).length){ $('html, body').animate({scrollTop: $(e.state).offset().top - banner_width}, 500) } }); $('html, body').on("scroll mousedown wheel DOMMouseScroll mousewheel keyup touchmove", function(){ $('html, body').stop(); }); if (location.hash) { // $('html,body').animate({scrollTop: $(location.hash).offset().top - banner_width}, 500) }; }); The 2,4,6 game There’s a black box with a formula inside for generating 3 numbers. Your job is to try and guess this formula. The input box below is connected to the black box. If you give it 3 numbers, it’s going to tell you whether they follow the formula or not. Separate each number with a comma. To start you off, (2,4,6) follows the pattern. Try it out! Test Tries: 0 function checkNumbers() { let values, text; const target = document.getElementById("result") const tries = document.getElementById("tries") target.style.opacity = "0.5" setTimeout(function(){ const try_box = document.getElementById("try-box"); // Get the value of the input field values = try_box.value.trim().split(','); let valid = true let illegal = false if(values.length != 3) { illegal = true } for(let value of values) { if(isNaN(value) || !value) { illegal = true; } if(value < 0) { valid = false; } } if (illegal) { text = "Illegal"; } else if (valid) { text = "Yes"; } else { text = "No"; } target.innerHTML = text; target.style.opacity="1.0" // try_box.value = "" tries.innerHTML = parseInt(tries.innerHTML, 10) + 1 }, 500); } Did you figure it out? Write down your answer in here: Bayes Explanation Most people try some sequence of: (4,6,8), (1,2,3) … and end up with either increasing numbers, or increasing numbers that are even. Notice how you’re pretty confident in your answer by the time you write it down. You’ve tried a few examples, and all of them made sense! But perhaps you didn’t think to try (-1,2,10) or (4,2,6). If my comment made your confidence waver, go ahead and try the input box again. See if you can find a pattern that works. The answer is at the bottom of this section, but don’t skip ahead. Every sentence before that is setting up an important idea. Bayes Theorem If you’ve heard of Bayes theorem before, you know this formula: \[ P(H \mid E) = \frac{P(E \mid H) * P(H)}{P(E)} \] Indeed, that’s all there is to it. I bet you’ve also heard the famous formula: \(E = mc^2 \). That’s all there is to mass-energy equivalence. However, figuring out how to harness nuclear energy is still a hard problem. The formula made it possible, but implementing it still took 40 years. It’s the same with Bayes Theorem. The formula is exciting because of what it implies. We’re discovering the nuclear energy version of Bayes Theorem. Translated to English, the formula goes like this: To form accurate beliefs, you always start from the information you already have. You update beliefs. You don’t discard everything you know. The first key component is a hypothesis (H) - the belief we’re talking about. The second key component is the evidence (E) - what data do we have to support / reject the hypothesis. The third key component is probability (P) of the above two. This probability is our confidence in the belief. If you’re familiar with probability theory, you learned this in school. If not, don’t worry, there are excellent mathematical introductions to explain it to you. We’ll skip the math, and focus on how to use it. Our point of interest, and where bayes truly shines is where we compare two hypotheses. Instead of uncovering the absolute probabilities, which is hard, this focuses on how much more likely one hypothesis is, compared to another. Most reasoning in our mind takes this form. In this case, the formula looks like: \[ Posterior \hspace{2mm} Odds = Prior \hspace{2mm} Odds * Likelihood \hspace{2mm} Odds \] Posterior odds measure how likely a hypothesis is compared to another one. Prior odds measure how likely it was before we had any new evidence. Likelihood odds measure how well the evidence explains the current hypothesis, compared to the other one. We’ll explore what this means with the help of examples. \[ \text{Likelihood Odds} = \frac{ \text{Probability of evidence assuming hypothesis is true}}{\text{ Probability of evidence assuming competing hypothesis is true}}\] We’ll start with the 2,4,6 game to show how qualitatively, math and intuition agree. Then we’ll get into a simpler example where we’re miscalibrated and do the math. I’m going to choose my path through the 2,4,6 game, but I hope yours was similar enough. If not, try doing this on your own! I have a hypothesis I want to test, \(H_{3even}\) = 3 even numbers in increasing order. It’s implicit here, but the hypothesis I’m testing this against is \(H_{not-3even}\), or that the formula is not 3 even numbers in increasing order. I input (4,6,8) and the black box says “Yes”. My confidence in 3 even numbers rises. In Bayesian-speak, my posterior odds have increased, because the likelihood odds have increased. And the likelihood odds have increased, since the probability of (4,6,8) saying “Yes” is higher when the formula is \(H_{3even}\). You’ll notice how you feel every new number that matches your hypothesis makes your belief stronger. I try (1,2,3) next. “Yes”. What? I expected “No”! Everything tumbles, like it should, when you find something that doesn’t follow the pattern. The probability of (1,2,3) saying “Yes” is higher with \(H_{not-3even}\), since (1,2,3) are not all even. The likelihood odds are in favour of \(H_{not-3even}\) now, which means we discard \(H_{3even}\). In this case, one small piece of evidence was enough to completely flip the scales. Then, which new hypothesis should you try? The clues usually lie in how you disproved the previous hypothesis. I tried (1,2,3) which said “Yes”, when I expected it to say “No”. My new hypothesis thus became “3 increasing numbers”. Just like in the previous case, (4,2,6) saying “Yes” killed this hypothesis. My new hypothesis thus became “3 positive numbers”. I tried (-1,2,3), which said “No”! This was all I needed to become reasonably confident in “3 positive numbers”. The more negative numbers I tried, the more confident I got. 3 positive numbers is indeed correct.1 Graphically, this is what’s happening with the 3 hypotheses: confidences not calibrated Blue Box on Can we prove something to be true with Bayes? No matter how much data you have, you can never say something is true. This is the problem of induction. “No amount of observations of white swans can allow the inference that all swans are white, but the observation of a single black swan is sufficient to refute that conclusion.” However, after a certain level of confidence, you live your life believing it’s true. Once you start believing is when you must pay close attention to evidence that doesn’t fit. Calibration is key. What we’ve just shown is our thinking process, and how Bayes theorem is mostly aligned with it when we’re thinking well. Bayes theorem updates beliefs in the same direction our brains do, but what changes is how much each piece of evidence influences us! With this next example, let’s get into the basic math. We’ll revisit the 2,4,6 game in a bit. Being Late Example Your colleague is sometimes late to work. They’ve been on time 4 times, and late 3 times the past week. How many more times would it take you to start believing they’re “always” late? In my experience, just a few more times does the trick. But let’s use Bayes to calibrate. Since there’s no good reason to expect tardiness over punctuality, let’s say the prior odds are 1:1.2 The alternative hypothesis, the one we’re testing against is “not always being late”. To make this more concrete, let’s say this means they’re late only 10% of the time.3 We’ll use the data we have to calculate the likelihood of being late. We want to contrast the databeing late thrice, and on time 4 times with us believing that they’re almost always on time, or almost always late. Remember, to figure this out, we imagine believing the first hypothesis, then judge how likely the data is. Then, we imagine believing the second hypothesis, and judge how likely the data is. There are several ways to mathematically represent this data, from a binomial function to a beta distribution. However, we’re not getting into that yet. Today is more about an intuitive explanation, one which you’re more likely to use everyday. So try to imagine the odds for and against given this data.4 It’s a bit surprising to me that for someone who’s supposed to be always late, they’re on time more times than not. So this evidence is pretty unlikely for our hypothesis, while much more plausible when they’re not always late. I’ll give it likelihood odds of 1:10.5 Now, the posterior odds are \(1:10 * 1:1 = 1:10\). So, they’re 10 times less likely to be late than not.6 Huh, that’s surprising, isn’t it? Much lower than I imagined. Let’s take this example further. Say we want to figure out how many more times would they have to be late to get the odds up to 100:1 ? We’ll do the same updating process again. Prior odds = the old posterior odds = 1:10 for being late. Likelihood ratio = ?? Posterior odds = 100:1 Thus, likelihood ratio = 100:1 / 1:10 = 1000:1. Which means, they’ll have to be late for 12 days out of 20 to get these kind of odds.7 These numbers might feel weird. They are. We’re not used to calibrating, and in this specific case, we’re comparing two extreme hypotheses, which makes things weirder. Usually, this is a case of “I don’t know what the numbers mean”. We’ll explore this unsettling feeling in a bit. Neither hypothesis is close to what we’d expect anymore. After all, the colleague is late just 12 out of 20 days!? Why aren’t we considering another hypothesis - say, they’re late 60% of the time? Try this hypothesis out, it should blow the other 2 out of the park. You can use this calculator I built. For now, note that a little math helps us calibrate vastly better for the hypothesis we do have. It puts our emotions and thoughts into perspective. Also notice how we transformed the problem to become easier to grasp. Instead of applying the complicated version requiring pen and paper (what are the probabilities, what are the formulas, how do I find them?), we follow this “old odds times current likelihood equals new odds”. \[ Prior \hspace{2mm} Odds * Likelihood \hspace{2mm} Odds = Posterior \hspace{2mm} Odds\] When you have this model explaining how the “ideal you” thinks, you get a gears level understanding! This is epic because you can fiddle with the gears and see how your thinking changes. You can figure out best practices, and become a stronger thinker. This is exactly what we’re going to do next. Note: The mind doesn’t always work like Bayes Theorem prescribes. There’s lots of things Bayes can’t explain. Don’t try to fit everything you see into Bayes rule. But wherever beliefs are concerned, it’s a good model to use. Find the best beliefs and calibrate them! Grinding the Gears Let’s start grinding these gears. A meta-goal for this section is to make the gears visible to you. We are inching closer to the nuclear energy version of Bayes Theorem, but so far we’ve just seen how it’s possible. The next step is to learn how to do it ourselves. Using Bayes Theorem, try to answer this question: How can two people see the same things and reach different conclusions? Let’s first assume they’re Bayesian, and follow the rules. Can they reach different conclusions? Yes! The current data only gives us the likelihood odds. There’s a second component, the priors, that are yet to be used! In the “being late” example, we thought them up using our background knowledge. This is why they’re called priors: it’s information we already have. It’s plausible that two different people have different experiences, and different information. Which means, they can have different priors. Sometimes, these priors can get pretty strong. You, who has seen their colleague be late 3 out of '''
