title = "How Unix Works: Become a Better Software Engineer | Neil Kakkar"
description = "A tale of files and processes. Learn how Unix and Linux work from the ground up in this small complete guide to unix. Learn common mistakes people make while working with unix, and how to fix them. Figure out why unix vs linux doesn’t make sense."
full_description = '''How Unix Works: Become a Better Software Engineer Dec 14, 2019 • Tech Source: xkcd Unix is beautiful. Allow me to paint some happy little trees for you. I’m not going to explain a bunch of commands – that’s boring, and there’s a million tutorials on the web doing that already. I’m going to leave you with the ability to reason about the system. Every fancy thing you want done is one google search away. But understanding why the solution does what you want is not the same. That’s what gives you real power, the power to not be afraid.1 And since it rhymes, it must be true. I’ll put just enough commands for us to play along, assuming you’re starting from scratch. We’ll explore concepts, see them in practice in a shell, and then scream “I GET THIS!”. Along the way, we’ll also figure out what a shell really is. But we can’t begin without getting into the minds of the creators: exploring Unix’s philosophy. For now, we can assume Linux is Unix. If you want to know why that’s not really the case, you can skip to the bottom and come back. We’ll end the Unix vs linux confusion once and for all. Table of Contents Philosophy Processes Files Files and the File System iNodes File Permissions File Linking File Structure Processes Attributes Lifecycle File redirection Layers in Unix The Kernel Unix Utilities How the shell works The Pipe Everything about PATHs Writing Shell scripts Package Managers Brief History of Unix Conclusion Footnotes let banner_width = 55; $(document).ready(() => { $('a[href^="#"]').on('click', function(event) { var hash = '#' + $(this).attr('href').split('#')[1] var element = $(hash) if (element.length) { event.preventDefault(); history.pushState(hash, undefined, hash) $('html, body').animate({scrollTop: element.offset().top - banner_width}, 500) } }); window.addEventListener('popstate', function(e) { if(e.state && e.state.startsWith('#') && $(e.state).length){ $('html, body').animate({scrollTop: $(e.state).offset().top - banner_width}, 500) } }); $('html, body').on("scroll mousedown wheel DOMMouseScroll mousewheel keyup touchmove", function(){ $('html, body').stop(); }); if (location.hash) { // $('html,body').animate({scrollTop: $(location.hash).offset().top - banner_width}, 500) }; }); Philosophy Let’s start at the core - the philosophy behind Unix. Write programs that do one thing and do it well. Write programs to work together. (no extra output, don’t insist on interactive input) Write programs to handle text streams, because that is a universal interface. Unix also embraced the “Worse is better” philosophy. This thinking is powerful. On a higher level, we see it a lot in functional programming: Build atomic functions that focus on one thing, no extra output, and then compose them together to do complicated things. All functions in the composition are pure. No global variables to keep track of. Perhaps as a direct result, the design of Unix focuses on two major components: Processes and Files. Everything in Unix is either a process or a file. Nothing else. There’s a cyclical dependency between processes and files - if we start to go in depth into the explanation of either, we’ll need the other to support it. To break this loop, we’ll start with a brief overview of each and then dive in. And we’ll repeat this a few times to get to the bottom. Processes The browser you’re running is a process. So is the terminal, if you have it open.2 If not, now is a good time to open it. If you’re on Windows, docker works really well too. If you’re on a Mac, you can just use the cmd on mac - it’s a unix environment. In more abstract terms, a process is a running instance of code. The operating system gives resources to the process (like memory), then attaches some metadata to it (like who’s the owner), and then runs the code. The operating system, as a part of the resources, also provides 3 open files to every process: stdin, stdout and stderr. Files Everything that is not a process is a file. Yes, this means your printer, scanner, the terminal screen, the code for any process! They’re all files. If this sounds confusing, read on. We’ll clear this out. Your files on the filesystem are files - a string of bytes strung together to create something meaningful. Your photos are files. Your directories are files too! They just contain a list of files/directories present in current directory, exactly like a tree. The beauty of this is that I can “open” a directory file to see the contents as well! For example: $ vim . " ==================================================================== " Netrw Directory Listing (netrw v162) " /Users/Neil/examples " Sorted by size " Quick Help: <F1>:help -:go up dir D:delete R:rename s:sort-by " x:special " =================================================================== ../ ./ git-example/ unix-git/ unix-file-system-example/ I used Vim to open a file called .. Does this sound familiar? It’s how Unix stores the current directory. As you can see, it contains a list of files/directories in the current directory. A file is just a stream of data. Files and the File System With the idea of “Everything is a file” and “a file is a stream of data” in place, we can explore how things work further. On a unix system, the streams for getting input and writing output are predefined. This is precisely what Standard Input, stdin, Standard Output, stdout and Standard Error, stderr are for. stdin is the input data source. stdout is the output data source. stderr is the standard error output source. In a shell3, the stdin is input data from your keyboard, and both stdout and stderr are the screen.4 Now, we can redirect these streams to somewhere else, and our program doesn’t have to know! Irrespective of where the input comes from (keyboard or a text file), for any running process, it’s coming from stdin. Likewise for stdout and stderr. We’ll talk more about this when we get to processes which work with these streams. iNodes To have a file system in place, you need a structure to manage the filesystem. There isn’t just data in the file to take care of, but information about the data itself, called metadata. This includes where the data is stored, who owns it and who can see it. This is what inodes are - a data structure for your file metadata. Every file has a unique inode number. This becomes the unique identifier for the file while it exists. $ ls -li total 0 2015005 drwxr-xr-x 6 neil X 192 23 Oct 07:36 git-example 2514988 drwxr-xr-x 4 neil X 128 9 Oct 11:37 unix-git/ 2020303 drwxr-xr-x 4 neil X 128 23 Sep 11:46 unix-file-system-example/ See those numbers in the first column? Those are the iNodes!5 iNodes store all the metadata. stat is useful for looking at this metadata too. $ stat -LF . drwxrwxrwx 7 A B 224 Oct 28 07:15:48 2018 ./ The A and B are the User and Group names. Unix is a multi-user system. This is how Unix does it - Users and Groups are attributes of a file. A file with the User attribute set to X means that X owns the file. That’s all a user is to Unix. 224 is the file size, or the number of bytes in the file. Oct 28 07:15:48 2018 is the date last modified.6 Where did I get all this information from? man ls. Now come the interesting numbers and characters I’ve left out: drwxrwxrwx and 7. File Permissions Each file has permissions associated with it. Remember the user and group associated with the file? Every file stores who owns the file and which group the file belongs to. Likewise, every user also has a username and group. Coming to the -rwxrwxrwx string: this is the permissions for the owner, the group and others. r is for reading, w is for writing, x is for executing. For directories, this means being searchable. You only need 3 bits to represent permissions for each of user, group and others. You’ll notice that the string has 10 characters. The first one is a special entry type character to distinguish between directories, symlinks, character streams (stdin), and a few others. man ls to know more. $ stat -LF crw--w---- 1 neil tty 16,1 Dec 12 07:45:00 2019 (stdin) What if you wanted to change permissions? Say I don’t want anyone to search my personal folder (ahem). The creators of Unix thought about that. There’s a utility called chmod, which can modify permissions on files. In the backend you know now that chmod is interacting with the files inode. Since we need 3 bits to represent each permission, we can convert that to an integer and pass that to chmod. For example: chmod 721 . would mean rwx-w---x which means all permissions for the owner, write permissions to the group and execute permissions to others. I like the verbose form better: $ chmod u+rwx . # enable user for rwx $ chmod g+w . # enable group for w $ chmod o+x . # enable others for x You’re doing the exact same thing here. To set permissions for everyone, chmod a+x <file> is so much more easier! You could remove permissions as well, using - instead of +. To restrict access to my personal folder, I’ll do: chmod og-x nothing-interesting-here/. You can also restrict access to yourself, removing all read, write, and execution permissions for yourself. If the file metadata were stored in the file itself, you wouldn’t be able to change permissions again (since you can’t write to the file). That’s another reason why inodes are cool: they can always be modified by the file owner and root, so you can restore your permissions. Try doing this. File Linking Ever wondered why moving a Gigabyte file from one directory to another is blazing fast, while copying the same might take ages? Can you guess why now? It’s because when we mv, we’re moving the directory structure, not the actual file data. The inodes are a very useful abstraction over the filesystem. There’s other kinds of moving we can do: we can link files from one place to another, or make two filenames point to the same file. Two filenames that point to the same file are hard links. Think of them as aliases to a file. You’ve already seen two hard links: . and .. are hard links to current and parent directory on the system. Links from one place to another are symbolic links. A symbolic link is a new file, separate from original, that links to the original file. These are useful when you want to fix scripts that need to run in a new environment, or to make a copy of a file in order to satisfy installation requirements of a new program that expects the file to be in another location. $ ls -li total 0 25280489 -rw-r--r-- 1 neil X 0 8 Dec 08:48 a $ man ln # to check syntax for hard links $ ln a x # create x as a hard link to a $ ls -li total 0 25280489 -rw-r--r-- 2 neil X 0 8 Dec 08:48 a 25280489 -rw-r--r-- 2 neil X 0 8 Dec 08:48 x # Notice both files have the same inode number. # Modifying x or a is the same thing - both files get modified together. $ ln -s a y # create symbolic link to a $ ls -li total 0 25280489 -rw-r--r-- 2 neil X 0 8 Dec 08:48 a 25280489 -rw-r--r-- 2 neil X 0 8 Dec 08:48 x 25280699 lrwxr-xr-x 1 neil X 1 8 Dec 08:54 y -> a # y is a symbolic link, a new small file - see size is 1. $ cat y # shows that y (a) is empty $ echo lsd >> y $ cat y lsd $ cat a # modifying y modifies a lsd $ cat x # a is x lsd I’ve explained what’s happening above in the comments. Now what happens if you remove a, the file that y points to? $ rm a $ cat y cat: y: No such file or directory # y becomes useless $ ls -li 25280489 -rw-r--r-- 1 neil X 12 8 Dec 08:56 x 25280699 lrwxr-xr-x 1 neil X 1 8 Dec 08:54 y -> a This is a dangling symlink. It’s useless. The number after read-write permissions, or the 7 from when we did stat -LF . is the count of hard links to a file. When I created x, the number went up to 2. When I removed a, the number went back down to 1. We can also confirm that . and .. is indeed a hard link. Can you think how? $ ls -ail 25280488 drwxr-xr-x 7 neil X 224 9 Dec 20:19 . 1289985 drwxr-xr-x+ 83 neil X 2656 10 Dec 08:13 .. 25390377 drwxr-xr-x 5 neil X 160 9 Dec 19:13 sample_dir $ cd sample_dir $ ls -ail 25390377 drwxr-xr-x 5 neil X 160 9 Dec 19:13 . 25280488 drwxr-xr-x 7 neil X 224 9 Dec 20:19 .. 25390378 -rw-r--r-- 1 neil X 0 9 Dec 19:13 a Check the inode numbers. .. in sample_dir is 25280488, which is same as . in the parent directory. Also, sample_dir in the parent directory is 25390377, which is same as . inside sample_dir. File Structure It helps me to imagine the file system like a tree data structure (indeed, that’s what it is). Every node (inode) has a pointer to its parent, itself and all its children. This forms the directory structure. What’s the parent of /, the root directory? You have enough knowledge to answer this question now. The first thing I did was vim / to see if / has a parent pointer. It does. Then, I did ls -ail to see the iNode of the parent. It points to ., which is /. In summary, The file system is built using inodes and directory files Users are attributes of files and processes. This information is stored in the inodes iNodes are unique within a file system Multiple file systems can be mounted and abstracted into one logical tree Processes First, let’s get the definitions out of the way. There are three components to remember about a process: Program file: the code and data Process image: this stores the stack, variables currently defined, data, address space, and more. When it’s time to run, the OS knows exactly how to recreate the process using this image. Process: the running program in memory When a process starts running, it inherits the user ID and group ID from the parent process. This information controls the level of access to the process. Note: Access control is crucial for a secure system. This is one of the reasons running bare docker containers in production can be such a problem: it needs to run as root, which means bad things can happen. We can use setuid or setgid to enable a process to inherit the file owner permissions. setuid allows a process to inherit userID of the file in question. For example, to change passwords on linux (see this link for Mac) - we need to modify the file /etc/passwd. However, on checking permissions, we see that only root has access to write to this file.7 $ ls -ail /etc/passwd 3541354 -rw-r--r-- 1 root root 681 Nov 28 08:47 /etc/passwd Thus, when we call /usr/bin/passwd, the utility to help change passwords, it will inherit our userID, which will get access denied to /etc/passwd. This is where setuid comes in useful - it allows us to start usr/bin/passwd as root. $ ls -al /usr/bin/passwd -rwsr-xr-x 1 root root 27936 Mar 22 2019 /usr/bin/passwd The s instead of x in execution permissions shows that this process will run as root. To set and remove this bit, we can use chmod again. $ chmod u-s /usr/bin/passwd $ ls -al /usr/bin/passwd -rwxr-xr-x 1 root root 27936 Mar 22 2019 /usr/bin/passwd I did this in docker, so my true filesystem is safe. Attributes Like how all files on the filesystem have a unique inode, processes also have their unique identifiers called process IDs, or pid. Like how all files hav'''
