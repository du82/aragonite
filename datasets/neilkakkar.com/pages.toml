full_description = '''If Sapiens were a blog post Jun 29, 2019 • Notes I spent over 25 hours building a cut-down version of Sapiens. The goal? Future-me should be happy to read this once future-me forgets how we evolved. It’s massive for a blog post, just under 30 minutes, but that’s the best I could do, condensing 9 hours worth of material. I’ve tried to keep editing to a minimum: It’s the original text, edited to ensure it still flows like the book. You can get the book here1 The best way of navigating is clicking on the images. These are best experienced on a tablet or a laptop. I’ve also included the table of contents, which work well on every screen size. Table of Contents Development of brains Cognitive Revolution Agricultural Revolution Imagined Realities - Solving the co-ordination problem The imagined order is embedded in the material world. The imagined order shapes our desires. The imagined order is inter-subjective. Preserving the imagined reality More individual suffering Unification of Humankind Money How Money Works Proliferation of gold Empires The Imperial Cycle Religion Battle between good and evil for monotheism Towards principles other than god Scientific Revolution Imperialism and science Capitalism and science Industrial Revolution Aftereffects of Industry Collapse of family Movement from war to peace The End of Homo Sapiens let banner_width = 55; $(document).ready(() => { $('a[href^="#"]').on('click', function(event) { var hash = '#' + $(this).attr('href').split('#')[1] var element = $(hash) if (element.length) { event.preventDefault(); history.pushState(hash, undefined, hash) $('html, body').animate({scrollTop: element.offset().top - banner_width}, 500) } }); window.addEventListener('popstate', function(e) { if(e.state && e.state.startsWith('#') && $(e.state).length){ $('html, body').animate({scrollTop: $(e.state).offset().top - banner_width}, 500) } }); $('html, body').on("scroll mousedown wheel DOMMouseScroll mousewheel keyup touchmove", function(){ $('html, body').stop(); }); if (location.hash) { // $('html,body').animate({scrollTop: $(location.hash).offset().top - banner_width}, 500) }; }); Development of brains What caused our brains to develop? We’re not sure. It doesn’t seem likely. A larger brain needs more energy and thus reduces the chance you’ll survive. Getting more energy meant hunting more. One contributing factor was the domestication of fire. Fire paved the way for cooking. Whereas chimpanzees spend 5 hours a day chewing raw food, a single hour suffices for people eating cooked food. The advent of cooking enabled humans to eat more kinds of food, to devote less time to eating, and to make do with smaller teeth and shorter intestines. Some scholars believe there is a direct link between the advent of cooking, the shortening of the human intestinal track, and the growth of the human brain. Since long intestines and large brains are both massive energy consumers, it’s hard to have both. By shortening the intestines and decreasing their energy consumption, cooking inadvertently opened the way to the jumbo brains. And, we weren’t alone. Competing with us were the Neanderthals, among other species. They were stronger, they had bigger brains, and they could survive the cold. How come, then, did we “win”? We aren’t sure. The most likely answer is the very thing that makes the debate possible: Homo sapiens conquered the world thanks above all to its unique language. Cognitive Revolution The appearance of new ways of thinking and communicating, between 70,000 and 30,000 years ago, constitutes the Cognitive Revolution. What caused it? We’re not sure. The most commonly believed theory argues that accidental genetic mutations changed the inner wiring of the brains of Sapiens, enabling them to think in unprecedented ways and to communicate using a new type of language. We might call it the Tree of Knowledge mutation. What’s special about our language? Our language is amazingly supple. We can connect a limited number of sounds and signs to produce an infinite number of sentences, each with a distinct meaning. We can thereby ingest, store and communicate a prodigious amount of information about the surrounding world. A monkey can yell to its comrades, ‘Careful! A lion!’ But a modern human can tell her friends that this morning, near the bend in the river, she saw a lion tracking a herd of bison. She can then describe the exact location, including the different paths leading to the area. With this information, the members of her band can put their heads together and discuss whether they ought to approach the river in order to chase away the lion and hunt the bison. Yet the truly unique feature of our language is not its ability to transmit information about men and lions. Rather, it’s the ability to transmit information about things that do not exist at all. As far as we know, only Sapiens can talk about entire kinds of entities that they have never seen, touched or smelled. Using language, lots of humans could work together, form a tribe, help each other, and hunt together. However, communicating with lots of people brings with it new co-ordination problems. The critical threshold for a group interacting together is 150 people. How did Homo sapiens manage to cross this critical threshold, eventually founding cities comprising tens of thousands of inhabitants and empires ruling hundreds of millions? The secret was probably the appearance of fiction. Large numbers of strangers can cooperate successfully by believing in common myths. This is an imagined reality. Unlike lying, an imagined reality is something that everyone believes in, and as long as this communal belief persists, the imagined reality exerts force in the world. In other words, while the behaviour patterns of archaic humans remained fixed for tens of thousands of years, Sapiens could transform their social structures, the nature of their interpersonal relations, their economic activities and a host of other behaviours within a decade or two. For example, consider trade. Trade cannot exist without trust, and it is very difficult to trust strangers. The global trade network of today is based on our trust in such fictional entities as the dollar, the Federal Reserve Bank, and the totemic trademarks of corporations. When two strangers in a tribal society want to trade, they will often establish trust by appealing to a common god, mythical ancestor or totem animal. Our Tree of Knowledge mutation was significant. However, it’s not just our biology that brought us where we are today. Biology sets the basic parameters for the behaviour and capacities of Homo sapiens. The whole of history takes place within the bounds of this biological arena. This arena is extraordinarily large, allowing Sapiens to play an astounding variety of games. Thanks to their ability to invent fiction, Sapiens create more and more complex games, which each generation develops and elaborates even further Consequently, in order to understand how Sapiens behave, we must describe the historical evolution of their actions. Agricultural Revolution The currency of evolution is neither hunger nor pain, but rather copies of DNA helixes. Just as the economic success of a company is measured only by the number of dollars in its bank account, not by the happiness of its employees, so the evolutionary success of a species is measured by the number of copies of its DNA. If no more DNA copies remain, the species is extinct, just as a company without money is bankrupt. If a species boasts many DNA copies, it is a success, and the species flourishes. From such a perspective, 1,000 copies are always better than a hundred copies. This is the essence of the Agricultural Revolution: the ability to keep more people alive under worse conditions. Rather than heralding a new era of easy living, the Agricultural Revolution left farmers with lives generally more difficult and less satisfying than those of foragers. Hunter-gatherers spent their time in more stimulating and varied ways, and were less in danger of starvation and disease. The Agricultural Revolution certainly enlarged the sum total of food at the disposal of humankind, but the extra food did not translate into a better diet or more leisure. Rather, it translated into population explosions and pampered elites. The average farmer worked harder than the average forager, and got a worse diet in return. The Agricultural Revolution was history’s biggest fraud. Compared to foraging, working a bit harder on the farm meant more food. Settling down on the farm also meant greater freedom to reproduce - you’re not travelling all the time, so you can afford to have more children. This in turn, meant a higher population. And a higher population meant higher food requirements. Thus, the farmers were forced to work even harder. Why didn’t humans abandon farming when the plan backfired? Partly because it took generations for the small changes to accumulate and transform society and, by then, nobody remembered that they had ever lived differently. And partly because population growth burned humanity’s boats. If the adoption of ploughing increased a village’s population from a hundred to 110, which ten people would have volunteered to starve so that the others could go back to the good old times? There was no going back. The trap snapped shut. One of history’s few iron laws is that luxuries tend to become necessities and spawn new obligations This discrepancy between evolutionary success and individual suffering is perhaps the most important lesson we can draw from the Agricultural Revolution. When we study the narrative of plants such as wheat and maize, maybe the purely evolutionary perspective makes sense. Yet in the case of animals such as cattle, sheep and Sapiens, each with a complex world of sensations and emotions, we have to consider how evolutionary success translates into individual experience. Imagined Realities - Solving the co-ordination problem According to the science of biology, people were not ‘created’. They have evolved. And they certainly did not evolve to be ‘equal’. The idea of equality is inextricably intertwined with the idea of creation. A natural order is a stable order. There is no chance that gravity will cease to function tomorrow, even if people stop believing in it. In contrast, an imagined order is always in danger of collapse, because it depends upon myths, and myths vanish once people stop believing in them. In order to safeguard an imagined order, continuous and strenuous efforts are imperative. Some of these efforts take the shape of violence and coercion. To say that a social order is maintained by military force immediately raises the question: what maintains the military order? It is impossible to organise an army solely by coercion. At least some of the commanders and soldiers must truly believe in something, be it God, honour, motherland, manhood or money. To maintain an imagined order, we need people who believe in it - the military, the elites, and the peasants. Three main factors prevent people from realising that the order organising their lives exists only in their imagination: The imagined order is embedded in the material world. For example, houses have small rooms for every person living inside. This architecture promotes Individualism. The imagined order shapes our desires. Most people do not wish to accept that the order governing their lives is imaginary, but in fact every person is born into a pre-existing imagined order, and his or her desires are shaped from birth by its dominant myths. Our personal desires thereby become the imagined order’s most important defences. The elite of ancient Egypt spent their fortunes building pyramids and having their corpses mummified, but none of them thought of going shopping in Babylon or taking a skiing holiday in Phoenicia. People today spend a great deal of money on holidays abroad because they are true believers in the myths of romantic consumerism. Romanticism tells us that in order to make the most of our human potential we must have as many different experiences as we can. A wealthy man in ancient Egypt would never have dreamed of solving a relationship crisis by taking his wife on holiday to Babylon. Instead, he might have built for her the sumptuous tomb she had always wanted. Few question the myths that cause us to desire the pyramid in the first place. The imagined order is inter-subjective. Even if by some superhuman effort I succeed in freeing my personal desires from the grip of the imagined order, I am just one person. In order to change the imagined order I must convince millions of strangers to cooperate with me. For the imagined order is not a subjective order existing in my own imagination – it is rather an inter-subjective order, existing in the shared imagination of thousands and millions of people. The inter-subjective is something that exists within the communication network linking the subjective consciousness of many individuals. If a single individual changes his or her beliefs, or even dies, it is of little importance. However, if most individuals in the network die or change their beliefs, the inter-subjective phenomenon will mutate or disappear A change of such magnitude can be accomplished only with the help of a complex organisation, such as a political party, an ideological movement, or a religious cult. However, in order to establish such complex organisations, it’s necessary to convince many strangers to cooperate with one another. And this will happen only if these strangers believe in some shared myths. It follows that in order to change an existing imagined order, we must first believe in an alternative imagined order. Preserving the imagined reality After the imagined order, comes a means of facilitating and propagating the order. Between the years 3500 BC and 3000 BC, some unknown Sumerian geniuses invented a system for storing and processing information outside their brains, one that was custom-built to handle large amounts of mathematical data. The Sumerians thereby released their social order from the limitations of the human brain, opening the way for the appearance of cities, kingdoms and empires. The data-processing system invented by the Sumerians is called ‘writing’. Animals that engage strangers in ritualised aggression do so largely by instinct – puppies throughout the world have the rules for rough-and-tumble play hard-wired into their genes. But human teenagers have no genes for football. They can nevertheless play the game with complete strangers because they have all learned an identical set of ideas about football. These ideas are entirely imaginary, but if everyone shares them, we can all play the game. With greater numbers and growing imagined orders, we needed a system to organise the rules: No one person could remember all of them. Just imprinting a document in clay is not enough to guarantee efficient, accurate and '''
