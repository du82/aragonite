full_description = '''How not to be afraid of javascript anymore Feb 24, 2019 • Tech ( Created using Source ) Have you been there before? Where Javascript just doesn’t seem to work. Where the functions you write don’t do what you expect them to. Where this just doesn’t make sense. What is this? This is this. I have. So, I wrote this. It covers everything from closures and classes to objects and hoisting. It has helped me become a better developer. I hope it helps you too. Data Model The types Stick with me. I’m doing this because there are two not so well known types I want you to know about: Symbols and Numbers. Also the difference between undefined and null eludes many. Number String Boolean Function Object Symbol undefined and null Numbers All numbers in JS are “double precision 64-bit format IEEE 754 values”. Commonly known as floats, which means there is no concept of an integer. Your integers are stored as floats. To convert strings to numbers: use parseInt('123', 10) . The second argument is the base. So, when dealing with binary you could do: > parseInt('101',2) 5 Similarily, parseFloat('number') exists for floating point numbers. The base here is always 10. Symbols The only purpose of this data type is to identify object properties. Iteration protocol and Regex are the most popular examples using Symbols. We’ll cover the iteration protocol in Part 2! You can create one via Symbol(). Every call generates a new symbol. Thus, console.log(Symbol(42) === Symbol(42)) // false Symbols can persist across files in Javascript. In this sense, they are different from global variables. There exists a global symbol registry which stores all symbols encountered. To add a Symbol to the registry, use Symbol.for() and to retrieve the symbol use Symbol.keyFor(). More information on Symbols here Undefined and Null Why the distinction between undefined and null? By convention, Null indicates a deliberate non existing value. And undefined is an uninitialized value. For example, say you have a field which stores an ID if it exists. In this case, instead of using a magic value like “NOT_EXISTS”, you can use null. If it’s supposed to exist but isn’t there right now, you can show that via undefined. Variables and scopes Before ES2015 var was the only way to define variables. Further, we had only two scopes: global and function scope. Variables declared inside a function become local to that function. Anything outside the function scope can’t access them. Thus, they have function scope. After ES2015 ES2015 introduced two new ways of defining variables: let const With them comes the concept of block scope. A block is everything between two curly braces {..} ES2015 is backwards compatible, so you still can use vars, although their usage is discouraged. var x = 1; { var x = 2; } console.log(x) // OUTPUT: 2, as block doesn't mean anything to var. let x = 1; { let x = 2; } console.log(x) // OUTPUT: 1 Variable Hoisting Javscript has a peculiar idea with var called hoisting. function something() { console.log(name); let name = 'neil'; console.log(name); } Can you guess what would happen above? I say a ReferenceError: we are using the variable name before it’s defined. It makes sense, that’s what happens. However, if I were using var instead of let, I’d get no error. function something() { console.log(name); // OUTPUT: undefined var name = 'neil'; console.log(name); // OUTPUT: neil } What’s happening behind the scenes? function something() { var name; // variable hoisting console.log(name); // OUTPUT: undefined name = 'neil'; console.log(name); // OUTPUT: neil } This is another reason why the use of var is discouraged. It can lead to interesting bugs. Short circuit logic: && and || With Javascript, something peculiar goes on with logic operations. (And Python too) Something that lets you do arcane stuff like this: // o is an object var name = o && o.name; What do you think name is? If the object, o is null or undefined, name is null or undefined. If o is defined but o.name is undefined, name is undefined. If o is defined, o.name is defined, then name = o.name. We were using a boolean logic operator right? How is this possible then? The answer is short circuiting and truthiness. Truthiness A value is truthy if it evaluates to true in a Boolean context. All values are truthy except for the following falsy values: false 0 "" null undefined NaN Note: which means, {} and [] are truthy! A usual trick to convert something to it’s truthy value: !! ! converts to not -the falsy value- and ! again converts it back to true/false Short circuiting The idea is Boolean operators return the final value that makes the statement true or false, not whether the statement is true or false. Like we saw above, to convert it to the truthy value, you can use !!. Short circuiting happens when the boolean expression isn’t evaluated completely. For example, null && ... It doesn’t matter what ... is. null is falsy, so this expression would return null. Same case with [] || .... [] is truthy, so this expression would return [], irrespective of what ... is. Objects An Object in Javascript is a collection of name value pairs. If you’re coming from How not to be afraid of Python anymore, don’t confuse the Python Object with the javascript Object. The closest equivalence to the javascript Object is the python dict. For the types available in an Object, name: string or Symbol value: Anything Arrays are a special type of object. They have a magic property - length ( and a different prototype chain. See below) The length of the array is one more than the highest index. This is mutable, which means you can do funky stuff with it. ( Not recommended ) const funkyArray = []; funkyArray['0'] = 'abcd'; funkyArray['length'] = 3 > console.log(funkyArray); (3) ["abcd", empty × 2] > funkyArray[4] = 'x'; > console.log(funkyArray); (5) ["abcd", empty × 3, "x"] Notice the use of numbers and strings as array indexes. Numbers work because Objects implicitly call toString() on the name. Iterating over arrays and objects, using constructs like for...of, for...in and forEach is something I’ll leave for Part 2. ( Plus, an interesting bug when using objects as maps in Javascript! ) Global object A global object is an object that always exists in the global scope. In JavaScript, there’s always a global object defined. In a web browser, when scripts create global variables, they’re created as members of the global object 1. The global object’s interface depends on the execution context in which the script is running. For example: In a web browser, any code which the script doesn’t specifically start up as a background task has a Window as its global object. This is the vast majority of JavaScript code on the Web. Code running in a Worker has a WorkerGlobalScope object as its global object. Scripts running under Node.js have an object called global as their global object. 2 Functions In Javascript, functions are first class objects. They can have properties and methods like any other objects. They can be passed to other functions as parameters (meta-recursion! ). The way functions differ from objects is that they are callable. All functions extend the Function object. This object has no properties or methods pre-defined, but inherits some from the Function.prototype. ( This will become clear in the prototype section below ). Further, this Function object is a constructor for functions. You can create functions in at least 4 ways: function functionDeclaration() {}; var anonymousFunctionExpression = function() {}; var namedFunctionExpression = function named() {}; var arrowFunctionExpression = () => {}; var constructorFunction = new Function(...args, functionBody); // functionBody is a string The return statement can return a value at any time, terminating the function. Javascript returns undefined if it sees no return statement (or an empty return with no value). All arguments defined for the function go in arguments var. The default value for all the arguments is undefined. Have you ever seen the three dots in javascript before? ... . Like the one I used above in constructorFunction ?They boggled my mind the first time I saw them. They are a part of syntax in Javascript. It’s not pseudocode ( like I first thought ). They are the rest and spread parameter syntax. The are opposites of each other. spread spreads arguments, rest brings them back together. Here’s an example: Excuse the poorly designed function - which doesn’t need the arguments to be named - but I am making a point. const average = function( val1, val2, val3, ...otherValues) { // rest console.log(otherValues); let sum = 0; for (let i = 0; i < arguments.length; i++) { sum += arguments[i]; } return sum / arguments.length; } let values = [1, 2, 3, 4, 5, 6] const averageValue = average(...values); // spread What’s happening here? otherValues is using the rest syntax to collect an infinite number of arguments passed to average. The console.log() would print [4, 5, 6] above. values is using the spread syntax to convert the array into single arguments. It works such that behind the scenes, the below is equivalent to the above. const averageValue = average(1,2,3,4,5,6) Another thing to note is that default argument values are evaluated every time function is called, unlike python where it happens only once. There are 3 interesting prototype functions available to function objects. These are apply(), bind() and call(). The A,B,C of Javascript. With the advent of spread and rest syntax, apply() and call() aren’t different anymore. apply() calls a function with an array of args; call() calls a function with individual values. The cool bit is, they allow you to call the function with a custom this object. We will talk more about apply() and bind() once we cover the this object. Anonymous and inner functions const avg = function () { let sum = 0; for (let i = 0, argLength = arguments.length; i < argLength; i++) { // arguments variable is an array containing all args passed to the function. sum += arguments[i]; } return sum / arguments.length; // argLength isn't available here }; The expressions function avg() and var avg = function () are semantically equivalent. However, there is a distinction between the function name (here anonymous - so doesn’t exist) and the variable the function is assigned to. The function name cannot be changed, while the variable the function is assigned to can be reassigned. The function name can be used only within the function’s body. Attempting to use it outside the function’s body results in an error (or undefined if the function name was previously declared via a var statement). This idea of functions being passed as variables gives rise to enormous power. For example, you can hide local variables: var a = 1; var b = 2; (function() { var b = 3; // hidden local variable a += b; })(); a; // 4 b; // 2 The expression above is called an IIFE (Immediately invoked function expression) - where you create a function and immediately call it. Further, we can nest functions inside each other too! These are called inner functions. The important thing to keep in mind: inner functions have access to variables defined in the parent functions, but not the other way around. This is a direct result of closures, which we will cover soon. This lets you create functions like: let joiner = function(separator) { // The outer function defines separator return function(left, right) { return left + " " + separator + " " + right; // The inner function has access to separator } // This exposes the inner function to the outside world } let and = joiner("and"); and("red", "green"); // There's no way to change the separator for AND now; except by reassigning the function variable. // red and green const or = joiner("or"); // There's no way to change the separator for OR now. or("black", "white"); // black or white Function hoisting With function declarations, the function definitions are hoisted to the top of the scope. With function expressions, the function definitions aren’t hoisted. Okay, you might be confused about what’s the difference between the terms. I was. function declaredFunction() { // this is the function declaration // what comes here is the function definition } let functionExpression = function() { // this is a function expression // what comes here is the function definition } Classes and The Prototype Chain JavaScript uses functions as classes. The recently introduced class statement is syntactic sugar over functions. Since all data in javascript is an Object, it makes sense that our functions – which are a class constructor will return an Object. Thus, given all the basics we know about functions and objects, we can do something like this to create a class for, say ( thinks really hard to figure out a non trivial, useful and relatable example ) …. … .. . A tweet interface! That sounds like fun. Imagine you’re building your own front-end to show tweets, talking to the twitter API to get data for the tweets. function Tweet(id, username, content, parent = null) { return { id, // Javascript implicitly converts this into id: id username, content, getUrl: function() { return 'https://twitter.com/' + this.username + '/' + this.id; }, isComment: function() { return parent !== null; } }; } var t = Tweet(1, '@neilkakkar', 'How not to be afraid of JS anymore'); // Remember, we can fill any number of args // the rest are undefined or default // All args are in the arguments variable t.getUrl(); // "https://twitter.com/@neilkakkar/1" t.isComment(); // "false" this keyword references the current object. Using dot notation, this becomes the object on which dot was applied. Otherwise, it’s the global object. A note from MDN: In most cases, the value of this is determined by how a function is called. It can’t be set by assignment during execution, and it may be different each time the function is called. ES5 introduced the bind() method to set the value of a function’s this regardless of how it’s called, and ES2015 introduced arrow functions which don’t provide their own this binding (it retains the this value of the enclosing lexical context). This (pun intended) is a frequent cause of mistakes. For example: const t = Tweet(1, '@neilkakkar', 'How not to be afraid of JS anymore'); const urlFetcher = t.getUrl; // assigning the function urlFetcher(); // https://twitter.com/undefined/undefined When we call urlFetcher() alone, without using t.getUrl(), this is bound to the global object. Since there are no global variables called username or id we get undefined for each one. We can take advantage of the this keyword to improve our Tweet function. The idea is, instead of creating an object and returning that, we expect a new object (referenced by this) and modify its properties. function Tweet(id, username, content, parent = null) { this.id = id; this.username = username; this.content = content; this.getUrl = function() { return 'https://twitter.com/' + this.username + '''
