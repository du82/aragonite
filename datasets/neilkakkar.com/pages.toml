title = "How not to be afraid of vim anymore | Neil Kakkar"
description = """
I want to understand how the world works. This blog tracks my growth, the things
I've learned, and how I'm leveraging them to do epic things."""
full_description = 'How not to be afraid of vim anymore Dec 19, 2018 • Tech Originally published on Medium A curation of the most popular commands and how to use them (Source) If you’ve ever used Vim, you know how difficult it can get to reach the same speed as in a “normal” GUI editor. But once you do, the payoff is exponential — you get much more efficient at writing code. Of course, this isn’t the main reason for this post. The majority of the time goes — or should go — into designing a solution to your problem, not actually coding it; so optimizing the how-fast-you-code bit seems like the last thing to focus on. It’s not a leverage point. This post took shape because of another reason: the non-existence of GUIs on SSH’ed machines. What are you going to do now? Any machine where you have access to the terminal and you want to edit a file — You have 2 options: Give up, try to close Vim Master Vim Just making a copy of vimtutor wouldn’t help anyone. So here I’m using a different approach: I aggregated the best bits of vim that I use in everyday life as a software developer, along with mnemonics to remember the stuff by. This contains almost everything you need for regular editing and writing. The basics Stick with me, this isn’t about the commands but the ideology behind them! Modes Vim has 2 modes: Normal ( Command mode) Insert ( Edit mode ) When you open Vim, you start in normal mode. To enter back into normal mode at anytime, press the ESC key. Normal mode is where you can issue commands: the list of commands is endless! There are a lot of ways to enter insert mode. The most intuitive one is to use the i command. i for insert. In normal mode, press i and you’ll enter insert mode. Now anything you type will show up in the editor. One of the biggest hurdles, sorted. The mental model — to understand the idea: Since there is no GUI, there’s no concept of mouse clicks. There’s no menu to choose options from, there’s no right click. Hence, you need a way to get all this on the keyboard — your only input source. Having two modes achieves this! You can think of the Normal ( Command) mode as the Menu bar and mouse on steroids, while the Insert mode is like the normal mode in GUI editors ( where what you type shows up on the screen ). Words To Vim, words mean almost the same as what they mean to us — A set of characters separated by whitespace or special characters. The command is w. Command Anatomy Commands in Vim follow a set pattern. Knowing this would help put each command into a certain bucket of commands, thus building a better mental model for the same. Commands look like this: [action] {number} [motion] The action is what you want to do, The number is how many times you want to do that action, The motion is the range of that action. The motion is the scope. An example would make this clearer. Let us say, we want to delete the next 3 words, starting from the cursor. Here, the action is delete, the number is 3 and the motion is a word. The command action for delete is d. Hence, we get the final command as: d3w — delete the next 3 words. Omitting the number defaults to once. Motions can be used without an action, which defaults to navigation. Hence, typing w in command mode would move the cursor forward one word. We are well equipped now to start learning about the commands themselves (and a range of motions to use with them) Useful commands How to close Vim First things first, we don’t want to get stuck in Vim land without having an exit plan. Always have an exit strategy. :q to quit :q! to force quit :wq to save and quit Command Actions d : delete i : insert p : put / paste y : yank / copy x : cut u : undo di: delete inside*, yi : yank inside* v : visual / selection / : search % : parentheses matching, developers rejoice! :s : substitute! In other words, find-replace on steroids Since actions on the entire line are very frequent, the developers of vim created a new shorthand for them — omitting the need to add a motion. Repeat the action to apply on the entire line. For example: To delete the current line: dd To copy the current line: yy Neat, ain’t it? Command motions Motions go with actions as we have seen, and the available motions changes with the action. However, some motions are pretty uniform. w : beginning of next word (we’ve seen this before!) e : ending of current word b : beginning of previous word Arrow keys / {h,j,k,l} : respective motions. h,j,k,l are a substitute to the arrow keys, and the source of speed in Vim: You don’t have to move your hands away from the typing part of the keyboard. $ : end of line 0 : beginning of line G : end of file nG : jump to line number n ) : jump forward a sentence } : jump forward a paragraph This helps visualise better: ge b w e <- <- ---> ---> This is-a line, with special/separated/words (and some more). ~ <----- <----- --------------------> -----> gE B W E Armed with these actions and motions, we can create most of the basic commands in Vim. Here’s a list of 8 every day functions. Figure out the command to make them happen! Delete the next 3 lines ( including current line) Copy current word — cursor is at beginning of word Copy current word — it has special characters — cursor is in the middle of the word Navigate down 10 lines Delete everything inside the curly brackets Go up 2 paragraphs Paste the previously selected text 5 times. Edit where the cursor is present: “I can Vim now!” … Wait for it… … Here are the solutions: d3j yw yiW : the yank inside is to yank inside, and W is inside what to yank ( current word). This is amazingly useful, you can use all sorts of combinations with inside ! 10j di} : just like #3. 2{ : this was slightly more intuitive. { is to go up a para, } is to go down a para 5p : remember the optional numbers from the command anatomy? They can be used almost anywhere i I can Vim now! : i is to go into insert mode, then you can work like in a “normal” editor Alright, you made it! Congratulations, this is enough Vim to go about exploring on your own, adventurer. The tutorial is over. Good luck. If someone asks you about Vim, you can do better than using this meme. Explain it to them, or point them here ;) *Note: This is my model of Vim. It isn’t exactly how things work internally. If you look at the documentation ( :help user-manual ), you’ll see that d is the command, and the motion is iw, or “inside word”. There’s a deviation. Why? — because I feel this helps explain better. Bonus Here are some extra commands that come in handy: Split screen :vsplit <filename> Creates a vertical splitting. Enables you to copy-paste from one screen to another. To cycle between screen-splits: <ctrl-w> <ctrl-w> Alternatively, you could use the arrow keys / hjkl like so: <ctrl-w> h to go to previous screen. You can close windows as you normally do (:q), or — :only — to close all other windows Multiple Tabs :tabnew <filename> opens a new file in a new tab on Vim :tabn to go to next tab ( or :gt ) :tabp to go to previous tab ( or :gT ) Again, you can copy-paste from one tab into another. You can map this combination to a key of your choice too! I tried <Ctrl-Tab>, but that’s already reserved. What a bummer. Instead, we have: map <C-t><left> :tabp<cr> map <C-t><right> :tabn<cr> Which means followed by the `left` or `right` arrow key would let you switch between tabs. How exactly did I come up with this mapping? Check out this tutorial. Other stories in this series: How not to be afraid of GIT anymore You might also like How not to be afraid of javascript anymore How the medium earning algorithm works How not to be afraid of python anymore How Not to Be Afraid of Git Anymore options = { buttonMarkup: ` <div class="bigfoot-footnote__container"> <button href="#" class="footnote-button bigfoot-footnote__button" id="\{\{SUP:data-footnote-backlink-ref\}\}" data-footnote-number="\{\{FOOTNOTENUM\}\}" data-footnote-identifier="\{\{FOOTNOTEID\}\}" alt="See Footnote \{\{FOOTNOTENUM\}\}" rel="footnote" data-bigfoot-footnote="\{\{FOOTNOTECONTENT\}\}"> <span>\{\{FOOTNOTENUM\}\}</span> </button> </div>`, actionOriginalFN: "ignore", }; $.bigfoot(options);'
