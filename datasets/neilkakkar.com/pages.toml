 world. We’re always telling ourselves a story about how the world works, and this makes stories very powerful. For example, consider this story: An American couple crash their car, die, and ascend to Heaven. God meets them, and they ask “What were the real results of the 2020 election, and... Jan 2, 2021 10 Powerful Life Skills for the New Decade Over the past few years, I’ve noticed certain skills in people I admire, from Paul Graham, Vitalik Buterin, to Ender Wiggin. These are rare skills, responsible for making them who they are. Most normal people, including me, don’t realise it. This makes the skills powerful - not everyone can see them, and very few people... Nov 28, 2020 Games People Play - The Blogpost Have you ever had your boss pass their mistakes on to you? Well, Bob the Boss does. At a critical meeting, Bob asks his team for suggestions on how to fix things. Alice shares an interesting idea, and Bob takes it to upper management. However, it ends up making things worse. Tough luck. Bob then... Nov 15, 2020 4 Different Perspectives to Solve Problems Consider a team of engineers building a feature API for Snapchat. Let’s call them Ovah’s team. They’re facing two big problems: how to build it, and how long would it take. If they can’t figure out how to build it, the feature is dead already. If they take too long to build it, the feature... Sep 6, 2020 Things I Learned to Become a Senior Software Engineer In 2018, I started working at Bloomberg. Things have changed a lot since. I’m not the most junior member in the company anymore and I’ve mentored quite a few new engineers, which has been amazing. It helped me observe how others differ from me, absorb their best practices, and figure out things I’ve unconsciously been... Aug 4, 2020 Bayes Theorem: A Framework for Critical Thinking Have you ever noticed how you can be fuming with anger one second, and absolutely calm the next? An asshole driver cuts you off on the highway, and you’re raging. A moment later, 