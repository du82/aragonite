title = "neo4j-rest-client’s documentation — neo4j-rest-client 2.0.0 documentation"
full_description = 'neo4j-rest-client’s documentation¶ synopsis:Object-oriented Python library to interact with Neo4j standalone REST server. The main goal of neo4j-rest-client was to enable Python programmers already using Neo4j locally through python-embedded, to use the Neo4j REST server. So the syntax of neo4j-rest-client’s API is fully compatible with python-embedded. However, a new syntax is introduced in order to reach a more pythonic style and to enrich the API with the new features the Neo4j team introduces. Getting started¶ The main class is GraphDatabase, exactly how in python-embedded: >>> from neo4jrestclient.client import GraphDatabase >>> gdb = GraphDatabase("http://localhost:7474/db/data/") If /db/data/ is not added, neo4j-rest-client will do an extra request in order to know the endpoint for data. And now we are ready to create nodes and relationhips: >>> alice = gdb.nodes.create(name="Alice", age=30) >>> bob = gdb.nodes.create(name="Bob", age=30) >>> alice.relationships.create("Knows", bob, since=1980) Although using labels is usually easier: >>> people = gdb.labels.create("Person") >>> people.add(alice, bob) >>> carl = people.create(name="Carl", age=25) Now we can list and filter nodes according to the labels they are associated to: >>> people.filter(Q("age", "gte", 30)) Installation¶ Available through Python Package Index: $ pip install neo4jrestclient Contents: neo4j-rest-client’s documentation Installation Getting started Elements Nodes Relationships Labels Add and remove labels to/from a node List, get and filter Indices Queries Returned types Query statistics Graph and row data contents Filters Lookups Ordering Indices Slicing Traversals Extensions Transactions and Batch Transactions in Cypher Batch-based Transactions Options CACHE DEBUG SMART_DATES SMART_ERRORS TX_NAME URI_REWRITES VERIFY_SSL Changes 2.1.1 (2015-11-20) 2.1.0 (2014-11-09) 2.0.4 (2014-06-20) 2.0.3 (2014-05-16) 2.0.2 (2014-04-04) 2.0.1 (2014-03-23) 2.0.0 (2013-12-30) 1.9.0 (201