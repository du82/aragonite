title = "Klinik für Neonatologie - Charité – Universitätsmedizin Berlin"
description = "Homepage der Klinik für Neonatologie, Charité - Universitätsmedizin Berlin"
full_description = "Suche absenden Klinik für Neonatologie – Fachklinik für Früh- und Neugeborene und ihre Familien In der Neonatologie geht es um neugeborene Kinder, gesunde und kranke, reife sowie frühgeborene Kinder. Es geht um Sie, die Mütter, Väter und Familien. Die Klinik für Neonatologie ist spezialisiert auf Krankheiten, mit denen einige Kinder auf die Welt kommen und Krankheiten, die sie sich bei der Geburt und kurz danach zuziehen. Auch die Behandlung von Krankheiten, vor denen man Neugeborene bewahren kann, gehört zu den Schwerpunkten. In der Klinik für Neonatologie der Charité arbeiten rund 200 Ärztinnen, Ärzte, Pflegende, Mitarbeiter und Mitarbeiterinnen aus Technik, Organisation und psychosozialer Versorgung jeden Tag daran, für jedes Kind die beste Pflege sicherzustellen. Darüber hinaus ist die Klinik mit Spezialisten anderer Einrichtungen aus fast allen medizinischen Bereichen gut vernetzt. So finden wir für Sie auch in komplexen und schwierigen Situationen rasch die passenden Lösungen. Sie finden auf unseren Stationen erfahrenes und hochspezialisiertes Personal, ausgestattet mit modernster Technik. Kinderkrankenpflegekräfte, Kinderärztinnen und -ärzte sind ständig für Sie und Ihre Kinder im Einsatz. Sie, die Eltern, werden durch unsere Teams immer tatkräftig unterstützt, Sie können jederzeit zu Ihrem Kind und bei Bedarf auch in der Klinik übernachten. In den letzten fünf Jahren wurden in der Klinik jährlich über 1.250 Fälle behandelt. Laut einer Erhebung des Gemeinsamen Bundesausschusses ist unsere Einrichtung bei den Hochrisikofällen (Geburtsgewicht unter 1.500 Gramm) mit jährlich durchschnittlich 185 behandelten Fällen die führende neonatologische Einrichtung in Deutschland. Klinikdirektor - Prof.Dr. Christoph Bührer Team der Klinik Veranstaltungen Unterstützen Sie unsere Arbeit Förderverein für frühgeborene Kinder an der Charité e.V. Informationen für Einweisende 24/7 Notfallnummer für überweisende Ärzte und Ärztinnen Bilirubin-Ambulanz auf unserer neonatologischen Station 108i, am Campus Mitte der Charité Für Eltern Die Klinik für Neonatologie ist an zwei Standorten für Sie da Campus Charité Mitte(CCM) Campus Virchow-Klinikum(CVK) Neuigkeiten aus der Klinik Aktuelles11.12.2024Jahresbericht der Klinik für Neonatologie 2023 ist online Aktuelles30.09.2023Jahresbericht der Klinik für Neonatologie 2022 ist onlineAlle Meldungen"
