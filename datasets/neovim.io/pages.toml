["https://neovim.io/news/2014/sept"]
title = "Newsletter #3 - Better Late than Never - Neovim"
description = "Hyperextensible Vim-based text editor"
full_description = "Welcome to the third (and delayed) newsletter for Neovim, the project that aims to overhaul the Vim codebase. The next newsletter will be coming out near the beginning of November. It has changed to be every other month as to not overload any sensitive Neovim lovers with too much staggering awe. The Issue tracker on GitHub now has over 1,000 issues/pull requests. The lucky 1000th pull request was opened shortly before August. As mentioned in last July’s newsletter, the documentation has successfully been moved to neovim.io/doc/. It features some general documenation links as well as some more specific reports directed towards developers and contributors. These reports have already helped developers contribute and improve the codebase. @aktau has finished implementing the VimL system() function to use pipes and the job system instead of redirecting to temporary files. The change provides a nice speed boost and avoids some permission issues (mainly affecting Windows, which is not supported yet). The slowness of the old implementation of system() was especially noticeable when the called process had large output. An example of this is: system('cat largefile'). There has been one bug report concerning the new system() code: it doesn’t work well with the Selecta plugin as described here. @aktau leveraged libuv’s ability to provide a high resolution clock on many systems to improve Neovim’s profiling capability with this pull request. The previous implementation was using gettimeofday(). This was a blocker in getting Neovim to run on Windows (as detailed in the previous section) as this function wasn’t supported in Windows. MoonScript (a language that compiles to Lua) was chosen to be the language for unit tests. After updating the unit test library, Busted, some unit tests were failing. Thus it was decided to drop the dependency to simplify the tests and remove a layer of abstraction. @tarruda made the accompanying changes and pull request. Discussion arose regarding how Neovim wasn’t fully compliant with the specification of msgpack-rpc."
