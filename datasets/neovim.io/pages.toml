full_description = "Neovim was again accepted into the Google Summer of Code program. View our page on the GSoC website for details. Our ideas list runneth over! You’re also welcome to propose other ideas in chat or on the ticket tracker. Brock Mammen implemented a C# client for Nvim, and even went further with a Nvim extension for Visual Studio! He also made significant improvements to the build system, particularly for Windows/MSVC. breaks up the screen grid in per-window grids, allows UIs to set different sizes for each window grid and receive grid based events. The final product was integrated by mentor Björn Linse into the Nvim master branch, providing the foundation for the floating windows feature. This demo shows the feature being used in a popular plugin to reveal documentation with completion results: Our mentors are looking forward to your GSoC proposals in the next weeks! The best way to get familiar with Neovim development is to send a pull request to help out with a small bug or feature request. Working with students on pull requests is extremely helpful for determining mentor-student workflow. Neovim is a Vim-based text editor engineered for extensibility and usability, to encourage new applications and contributions. Follow @Neovim !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+'://platform.twitter.com/widgets.js';fjs.parentNode.insertBefore(js,fjs);}}(document, 'script', 'twitter-wjs');"
