title = "Newsletter #1 - A New Hope - Neovim"
description = "Hyperextensible Vim-based text editor"
full_description = "Welcome to the first newsletter for Neovim, a project that hopes to give a new beginning to a text editor that we all love. The plan is to release a newsletter each month to detail the progress and anything else newsworthy for the project. Future newsletters will be released on the first Friday of every month. That makes the next one scheduled for July 4th. You may be wondering, “just how much has changed since it forked from Vim?” Well, let’s look at some Git statistics. Taking into account the initial import of Vim which happened January 31, 2014, there have been 1,010 commits across 77 contributors. This has resulted in: 887 files changed, 575371 insertions(+), 500868 deletions(-) according to git diff --stat. Using a more sophisticated tool such as gitinspector, we can see some more interesting statistics. The entire report of the analysis can be viewed in this Gist. Now that we have detailed some of the milestones before the month of May started, we can now look at what has happened in the last month. Neovim has turned on some of the features that were optional in Vim at compile time. This has led to various ifdef FEAT_* macros that are no longer needed. These macros were removed. Discussion arose regarding Neovim’s inherited crypto code. It was determined that the crypto code should be removed rather than to provide a possibly insecure implementation. The removal was then promptly handled. Due to name collisions with some of Neovim’s headers, the source code was moved into a ‘nvim’ namespace. It was also determined that nvim would be the internal/technical identifier for the project from that point on. Vim did have some logging in place but effort was made to create a better logging utility. The utility uses macros and can log a standard debug message, basic info, a warning message or an error. The logging can be turned on or off depending on if NDEBUG or DISABLE_LOG is defined. There are Vim specific types that are used where standard types would be better options. The complete information regarding these types can be found in this guideline."
year_published = 2025
clearnet = "https://neovim.io/news/2014/june"
