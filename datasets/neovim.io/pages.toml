["https://neovim.io/node-client"]
title = "neovim"
description = "Documentation for neovim"
full_description = '''Or for non-plugin purposes, neovim works like any other NPM package. See below for a quickstart example that you can copy and run immediately. Neovim supports remote plugins, which are plugins implemented as Nvim API clients. This package contains both the "API client" (which talks to nvim) and "remote plugin host" (which discovers and runs Nvim node.js remote plugins). You can define a remote plugin as a file or folder in an rplugin/node/ directory on Nvim's 'runtimepath'. If the plugin is a folder, the main script from package.json will be loaded. The plugin must export a function which takes a NvimPlugin object as its only parameter. You may then register autocmds, commands and functions by calling methods on the NvimPlugin object. Avoid heavy initialisation or async functions at this stage, because Nvim may only be collecting information about your plugin without wishing to actually use it. Instead, wait for one of your autocmds, commands or functions to be called before starting any processing. Set your plugin to dev mode, which will cause the module to be reloaded on each invocation. alwaysInit will always attempt to attempt to re-instantiate the plugin. e.g. your plugin class will always get called on each invocation of your plugin's command. Registers an autocmd for the event name, calling your function fn with options. Pattern is the only required option. If you wish to call a method on an object you may pass fn as an array of [object, object.method]. By default autocmds, commands and functions are all treated as asynchronous and should return Promises (or should be async functions). Registers a command named by name, calling function fn with options. This will be invoked from nvim by entering :name in normal mode. Registers a function with name name, calling function fn with options. This will be invoked from nvim by entering eg :call name() in normal mode. For debugging and configuring logging, you can set the following environment variables which are used by the neovim package (or nvim itself where noted):'''
