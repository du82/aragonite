["https://neovim.io/news/2014/nov"]
title = "Newsletter #4 - Thanksvimming Day - Neovim"
description = "Hyperextensible Vim-based text editor"
full_description = "Welcome to the fourth newsletter for Neovim, the project that aims to overhaul the Vim code base. It also hopes to provide out of the box features yet a more powerful interface for extending the editor. You can now add a Neovim sticker to your laptop by heading over to the Neovim section of Unixstickers. Unixstickers will be donating a portion of the profits to ICCF Holland in support of Bram Moolenar’s work on Vim. During the last two months, the repo reached over 10,000 stargazers on Github. The repository also just tipped over the 100 person contributor mark. Floobits, a service that integrates with editors to make it easier to write code together, has deprecated its Vim plugin in favor of a plugin for Neovim. Already Floobits says that the new plugin “has fewer bugs and performs better” than their previous plugin. Read their entire write up to learn more about their thoughts or view the repository to see the code. @Shougo, creator of many Vim plugins, gave a talk about his experience and perspective of Neovim so far. Check out the English version of the slides to read his thoughts. @tarruda finished his pull request that did two things. It gave the initial implementation of remote plugins which are going to be plugins that run in external processes and communicate to Nvim through msgpack-rpc. Details can be found in :h remote-plugin. The second change is an improvement to the existing provider infrastructure to allow providers to be implemented in VimScript. This gives more flexibility as previously providers needed to be implemented using msgpack. More details for this can be found in the :h nvim-provider. If you run into issues with this new plugin system, it might be caused by stale files from old builds and/or old configurations. iconv is a library “for use on systems which don’t have one, or whose implementation cannot convert from/to Unicode.” During the migration to CMake, the macro USE_ICONV was missed which was used to indicate such a system. Thus Neovim never triggered specific encoding conversions when needed."
year_published = 2025
