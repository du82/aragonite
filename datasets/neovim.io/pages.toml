["https://neovim.io/news/2020/10"]
title = "Newsletter #10 - Neovim v0.4.4 - Neovim"
description = "Hyperextensible Vim-based text editor"
full_description = "Neovim is a fork of the venerable text-editor vim, focused on extensibility and usability. It is not a rewrite but a continuation and extension of Vim. Many clones and derivatives exist, some very clever—but none are Vim. Neovim is built for users who want the good parts of Vim, and more. See a list of differences via :help vim-differences. If you are interested in contributing to Neovim, visit the github page for details. We have a great test suite and automated CI, so you can just jump in and have a go. Don’t be afraid to open a PR to get comments or just take advantage of the infrastructure! To get in touch with the team, join the gitter channel (also accessible via IRC), or visit the Neovim subreddit, which many of the developers read. Taking part in conversations is a contribution, too! The last newsletter covered the release of Neovim v0.3.0, it is now time to do the same thing with the most exciting Neovim release that happened since then: v0.4.4! Neovim started detecting the background color of the terminal for xterm-compatible terminals (@joshtriplett, #9509) The 'fillchars' setting now has an eob option, letting users configure the character used to represent lines after the end of a buffer (previously hardcoded to ~) (@FriedSock, #8546) The CursorLine type will now be smarter: if its foreground color is not set, the text of the CursorLine will use the CursorLine’s background color and default syntax highlighting colors as foreground (@zhou13, #8578). The terminal UI can now support undercurl and colored underline, provided that your terminal has support for that (@blueyed, #9052). Neovim’s 'background' setting now defaults to dark to get a consistent setting across platforms (@justinmk, #9205). Floating windows! This enables all kinds of useful features, such as big clocks (@bfredl, @dzhou121, #6619) The wildmenu can now be turned into a popup menu with wildoptions=pum (@bfredl, #9607). In fact, that’s the default! There now are two events triggered when a UI connects to and disconnects from Neovim: UIEnter and UILeave (@equalsraf, #6917)."
