title = "Understanding and Interpereting Posts and guides on Tonymacx86.com correctly – Nerd-Tech.net"
description = "OK, You can consider this one of my major contributions to the Hackintosh community. I'm still a noob, so this took me a LOOOOOONG time, and is still needs user edits before the final version is posted. This is most likely going to be my longest post I’ve ever written, but hopefully, it will start…"
full_description = "Apple, Mac OS, iOS / Hackintosh / Technology / Uncategorized Understanding and Interpereting Posts and guides on Tonymacx86.com correctly 09/27/201809/06/2021 Dan RanLeave a comment OK, You can consider this one of my major contributions to the Hackintosh community. I’m still a noob, so this took me a LOOOOOONG time, and is still needs user edits before the final version is posted. This is most likely going to be my longest post I’ve ever written, but hopefully, it will start a thread that clears up many of the power management instructions in your Hackintosh. The reason I am writing this is because it has been a year now, and I still cannot get my power management to work. I have gone over the macOS Native CPU/IGPU Power Management/[Guide] Native Power Management for Laptops guides (all versions) over 100 times each and still can’t figure out PM. I think the biggest problem we have in this forum, is that most of our smartest engineers/hackers, although helpful, really lack the ability to transcribe computer short-hand language into actual translated newbie Dictatable Human Language (DHL). I love you guys for all the time and support you put into this helping others on this forum, but lets be fair, you weren’t English majors in college. Therefore, the goal of this post, is to not necessarily solve my PM problems, or even ask questions regarding my PM problems, but rather to get to the fundamental root of my PM problems, by verifying that I am reading, interpreting, and transcribing this guide correctly. The purpose of this post is to clarify and eliminate any assumptions made by the writer about the reader, and vice versa. Consider this post an instruction manual on how to make a peanut butter and jelly sandwich, for a person who has never seen a knife, bread, peanut butter, or jelly ever in their life. The purpose of this post is to close the gap between the advanced user (or programmers), and complete and utter noobs like myself. I plan to repost theses guides (in parts), starting with macOS Native CPU/IGPU Power Management in an attempt to transcribe them to a Dictatable Human Language (DHL) interpretation of the instructions. After my notes and edits of each guide are cross referenced by the elders, and fully understood as well as articulated by yours truly, I will post the final versions which will be highly step by step noob friendly. I currently have a double-edged luxury that most don’t, and this is my contribution to help those who aren’t on FUNemployment (like me) and don’t have 8 hours a day to research and study everything in this forum. For this to be a success, and possibly transcribed for many other guides, I am requesting that any moderators or advanced users, please go over my Dictatable Human Language (DHL) interpretation of the instructions, and correct them as you see fit. I have predominantly used yes/no and true/false statements in order to simplify the details and eliminate ambiguity (if’s, and’s, but’s). This will also make editing simpler requiring less lengthy explanations. I don’t fully understand the instructions, so there is bound to be error on my part. But hopefully, after people contribute, we can get a very newbie friendly and more navigable set of instructions for newbie challenged users like myself. After ambiguity is resolved and the instructions are clarified to noob level, I would hope to make final cut’s and post a final version. Anyways, wish me luck, and thanks for the help! macOS Native CPU/IGPU Power Management Native macOS power management delivers the best combination of processor and graphics performance and efficiency. The ingredients are an installed processor a XCPM enabling ssdt, a compatible system definition and the native power management kext. Native power management does not require specific BIOS settings or anything more than installing one power management ssdt. Credit, PluginType=1 only technique by RehabMan. To be clear, native power management is not mandatory. The consequences are not severe. Performance is similar, however, higher temps (~10 C), more power (5-10 W) and sleep problems are likely. Change Log v1.1 – 11/28/17: Clover XPCM Support/v4307 and newer: config.plist/ACPI/SSDT/Generate/PluginType=YES v1.0 – 5/24/17: Initial Release //Interpretation – 1a //The change log indicates what additions (not deletions) have been added to the initial release. For example, in v1.1, the //change log indicates that as of clover v4307, Native XPCM is possible using clover. //*The “• config.plist/ACPI/SSDT/Generate/PluginType=YES” below the changelog note, indicates that, in order to enable //this added Native XCPM feature of Clover, one must edit the config.plist in plistedit pro or Xcode, and create the entry //“key=PluginType, with a Class=Boolean, and Value=Yes” under xCode>ACPI>SSDT>Generate in your plist file (T/F?).​ //*This exact same entry can also be denoted in xCode as “key=PluginType, with a Class=Number, and Value=1” under //xCode>ACPI>SSDT>Generate in your plist file (T/F?). ​ //*PluginType=yes, and PluginType=1 are two ways of denoting the same thing (T/F?).​ //Is this transcribed interpretation Correct and all encompassing? //Yes/no? //Would you revise?​ Requirements OS X/10.10 or newer Desktop/Laptop only BIOS Load Optimized Defaults //Interpretation – 1b // This holds true for all Bios’s with no exceptions (T/F?). //Q: Defaults in Gigabyte Bios has Power Management and (Peg) Disabled. Does this prevent the mono from passing on PM // control to the kernel or cpu? // Is this transcribed interpretation Correct and all encompassing? // Yes/no? // Would you revise?​ Verify stock clock ​ // Interpretation -1c //Self Explanatory, no interpretation required. //Is this transcribed interpretation Correct and all encompassing? //Yes/no? //Would you revise? System Definition/SMBIOS (see Note 1, below) //Interpretation – 1d //Your system definitions and SMBIOS settings must adhere to the requirement indicated in “Note 1”. ATTENTION: let it be //noted, that the note reference indicator labeled “(See Note 1, below)”, on this guide is NOT referencing the notes in the //“Notes” section at the bottom of this page, but is instead referencing the table in the entitled “Settings: 7th & 6th //Generation/5th & 4th Generation”. Note reference indicators can be transcribed in multiple ways, with each //transcription giving different meaning as to the section of notes being referenced. With the exception of the note //reference indicator “Note 1, below”, Notes that are in direct reference to the “Notes” Section at the bottom of this guide, //can be identified by the word “note” followed by a space, note reference indicator number, comma, space and the word //“below”. //Ex:note 2, below. In addition, The note markers referencing the “Notes” section at the bottom of this can be indicated by //underscore between the word “Note” and the note reference indicator number, as seen on the table in the section entitled //“Settings: 7th & 6th Generation/5th & 4th Generation” ex: note_4. //Is this transcribed interpretation Correct and all encompassing? //Yes/no? //Would you revise? ​ Native CPU PM (PluginType=1) ​ //Interpretation – 1e //Native CPU Power Management is a requirement and must be activated. PluginType=1 is a setting in clover that //activates Native CPU Power Management. The PluginType=1 setting is not the same as //CloverConfigurator>Acpi>SSDT>GenerateOptions>PluginType>√ (T/F?). The PluginType=1 setting is not the //same as CloverConfigurator>Acpi>SSDT>Plugin Type 1. PluginType=1 is the same as editing config.plist in //PlistEditPro or //xCode>ACPI>SSDT>Generate>key=PluginType, Class=Boolean, Value=YES (T/F?). PluginType=1 //is also the same as //editing config.plist in PlistEditPro or xCode>ACPI>SSDT>Generate>key=PluginType, //Class=Number, Value=1 (T/F?). //Is this transcribed interpretation Correct and all encompassing? //Yes/no? //Would you revise? Do not use CloverConfigurator, disables property ​ //Interpretation – 1f //As of CloverConfigurator v4.60.0.0 being used in conjunction with Clover revision 4392, the above statement still holds //true (T/F?). //Is this transcribed interpretation Correct and all encompassing? //Yes/no? //Would you revise? ​ Native IGPU PM (dsdt/GFX0 > dsdt/IGPU), one or the other ​ //Interpretation – 1g //Native Integrated Graphics Processing Unit (the graphics processor built into your mobo) Power management (is //required?) and must be activated. If you are using an external graphics card (discreet graphics) on a desktop, then this //does not apply, even if your mobo has a discreet graphics card (T/F?). This only applies to you if you are using the //integrated graphics card on your desktop mobo as your main graphics output, or if you are using a laptop with integrated //graphics (T/F?). //*** Please correct the above true or false (T/F) statements. //*** Error! Human is unable to transcribe the short hand robot term “Dsdt/GFX0>dsdt/IGPU”. //Dsdt/GFX0>dsdt/IGPU makes no sense whatsoever. Try reading this aloud in Dictatable Human Language (DHL) and type //how you read this line. No Siri’s allowed please. //Please make edits to transcribe this terminology and meaning into a Dictatable Human Language (DHL) (Preferably //English). Thanks for the edit. //Is this transcribed interpretation Correct and all encompassing? //Yes/no? //Would you revise? config.plist (see Attached, end of Post #1) or ​ //Interpretation – 1h //You may enable native IGPU PM by editing your clover config.plist by adding a patch with Plist Edit Pro or xCode in //accordance with the instructions in the “Clover patch: config.plist/ACPI/DSDT/patches/“ section below. If you adhere to //these instructions, copying and pasting the “find and replace” items noted in “config-audio cloverHDMI.plist.zip” you will //find that the following edits below are made: //xCode>ACPI>DSDT>Patches>Item 0>Key=Comment, Type=String, Value=Intel GPU PM- Rename GFX0 to IGPU //xCode>ACPI>DSDT>Patches>Item 0>Key=Find, Type=Data, Value=47465830 //xCode>ACPI>DSDT>Patches>Item 0>Key=Replace, Type=Data, Value=49475055 //No further copying and pasting is necessary at this point. //Is this transcribed interpretation Correct and all encompassing? //Yes/no? //Would you revise? HDMI audio ssdt: HDMI Audio AppleHDA/cloverHDMI //Interpretation – 1i //The 2nd method to enabling native IGPU PM is by injecting an HDMI audio ssdt. In particular, you may use this //(deprecated) method https://www.tonymacx86.com/threads/audio-hdmi-audio-applehda-guide.143760/#post886766 if //you are running Mac OS Sierra or below. You must use this method https://www.tonymacx86.com/threads/audio-hdmi //audio-applehda-guide.143760/#post886766 if you are running High Sierra or above. Both deprecated and current //methods require the use of audio_cloverHDMI130.zip //Is this transcribed interpretation Correct and all encompassing? //Yes/no? //Would you revise? ​ Supported CPU/IGPU – XPCM/Intel Speed Step Kaby Lake/HD630+ (Core i3/5/7 7xxx, 7th Generation; 100/200 Series motherboards) Sky Lake/HD530+ (Core i3/5/7 6xxx, 6th Generation; 100/200 Series motherboards) Broadwell/HD6000+ (Core i3/5/7 5xxx, 5th Generation, note 2; 8/9 Series motherboards) Haswell/HD4600+ (Core i3/5/7 4xxx, 4th Generation; 8/9 Series motherboards) //Interpretation – 1j //If your CPU/IGPU, generation, and mobo series match the above criteria, then your must ? use XPCM and/or? Speed //Step. If your CPU/IGPU, generation, and mobo series match the above criteria, then you must carry on with the rest of //guide, ignoring the post directly below this regarding Ivy Bridge/Sandy Bridge 6/7 series mobos. //Is this transcribed interpretation Correct and all encompassing? //Yes/no? //Would you revise? ​ Supported CPU/IGPU – see Mavericks: Native CPU/IGPU Power Management/Post #1 Ivy Bridge/HD4000 (Core i3/5/7 3xxx, 3rd Generation; 6/7 Series motherboards) Sandy Bridge/HD3000 (Core i3/5/7 2xxx, 2nd Generation; 6/7 Series motherboards) //Interpretation – 1k //If your CPU/IGPU, generation, and mono series match the above criteria, then follow the instructions in post #1 (the post //entitled “Installation” located beneath the“Settings: Haswell/Ivy Bridge/Sandy Bridge” chart ) of THIS LINK //Is this transcribed interpretation Correct and all encompassing? //Yes/no? //Would you revise? ​ Native Power Management Recipe //Interpretation – 1l //Below are the 3 required? adjustments that must be made in order for your hack run native PM (T/F?). System Definition/SMBIOS: match processor generation/desktop or laptop //Interpretation – 1m //Proper data corresponding to System Bios (SMBIOS) is 1/3rd of the Native Power Management Recipe. Your system //Definition (and all of it’s correlating data that is entered in your SMBIOS Section of clover config.plist), must match your //processor generation and pc type (desktop/laptop). //Is this transcribed interpretation Correct and all encompassing? //Yes/no? //Would you revise? CPU PM – PluginType=1 //Interpretation – 1n //CPU Power management is 1/3rd of the Native Power Management Recipe. For CPU Power Management to work, //PluginType must be = to 1. There are 3 ways of doing this. Only choose one of the following ways: //You can set PluginType=1 using a compiled ssdt named “SSDT-PluginType1.aml”and placing it in your // /EFI/CLOVER/ACPI/Patched folder on your mounted EFI drive //You can set this in config.plist>xCode>ACPI>SSDT>Generate>Key=PluginType, Class=Boolean, Value=NO. //This is the same as config.plist>xCode>ACPI>SSDT>Generate>Key=PluginType, Class=Number, Value=1. //Is this transcribed interpretation Correct and all encompassing? //Yes/no? //Would you revise? GPU PM – dsdt/IGPU@2 //Interpretation – 1o //GPU Power management is 1/3rd of the Native Power Management Recipe. //*** Error! Human is unable to transcribe the short hand robot term “dsdt/IGPU@2” //dsdt/IGPU@2 makes no sense whatsoever. Try reading this aloud in Dictatable Human Language (DHL) and type back //how you read this line. No Siri’s allowed please. //Please make edits to transcribe this terminology and meaning into a Dictatable Human Language (DHL) (Preferably //English). //Thanks for the edit. //Is this transcribed interpretation Correct and all encompassing? //Yes/no? //Would you revise? ​ Not Considered HWP (hardware controlled performance)​ Intel Speed Shift (6th generation and newer) ​ //Interpretation -1p //Self Explanatory, no interpretation required. //Is this transcribed interpretation Correct and all encompassing? //Yes/no? //Would you revise?​ X58/X79/X99 //Interpretation – 1q //Self Explanatory, no interpretation required. //Is this transcribed interpretation Correct and all encompassing? //Yes/no? //Would you revise​ NullCPUPowerManagement.kext //Interpretation – 1r //Self Explanatory, no interpretation required. //Is this transcribed interpretation Correct and all encompassing? //Yes/no? //Would you revise?​ Overclocking //Interpretation – 1s /"
