full_description = "How to automatically unlock your Mac with your iPhone using touch ID or proximity detection. 09/14/201809/06/2021 Dan RanLeave a comment Although new Apple Macbooks have the ability to quickly unlock your mac using your fingerprint with touchbar, there are still plenty of Macs out there (Macbooks built before the touchbar feature, iMacs, Mac Pro’s, and even Hackintoshes etc.) that don’t natively support this feature (Hello Apple, you make the software and hardware for your products, this is a no brainer). If you are like me and either have your mac locked with an annoyingly long (but secure) password, or, you just hate typing your mac password all the time, there are a couple ways you can make things easier for yourself. Unlocking your Mac with your iPhone’s Touch ID, or it’s bluetooth and wifi proximity sensors, is possible, but the solution comes from 3rd party apps as opposed to natively being a part of Mac OS (why Apple why?). Read More » Rate this:Share this:FacebookTwitterRedditEmailTumblrLinkedInLike Loading..."
