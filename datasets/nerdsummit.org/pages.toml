full_description = 'NERD Summit 2024 Sponsorship Information NERD Summit is approaching and we are excited to tell you about our great sponsorship opportunities. Your support is much appreciated to help make this fantastic community event happen. NERD Summit is a free mini-conference centered on current and emerging languages and techniques in web development, UX, AI, and much more. Every year since 2014, several hundred information technology professionals descend on NERD Summit. NERD Summit features knowledgeable speakers, educational workshops; entertaining and informative keynote speakers; and invaluable opportunities for attendees to network with others in and around New England. NERD Summit has been an incredible success thanks to excellent presenters, generous sponsors, and an enthusiastic community. Sponsor packages are designed to help your organization with brand awareness, talent recruitment, and networking with potential partners and customers! SPONSOR NERD SUMMIT 2024 NERD Summit Sponsorship Opportunities: Platinum Conference Program Sponsor $4,000 Includes a sponsor table in the main room, logo on program cover, full page ad in the program, top mentions on website, email news, social media and signage, plus 4 tickets Friday Night Party Sponsor $2,000 (one available) Includes a sponsor table in the main room, sign at front of party room "This party is sponsored by _______", half page ad in the program, mention on the website, email news and social media, plus 2 event tickets. Gold Conference Program Sponsor $2,000 Includes a sponsor table in the main room, half page ad in the program, mentions on website, email news, social media and signage, plus 2 event tickets Friday Keynote Sponsor $1000 (one available) Includes a sponsor table in the main room, sign at front of room "This keynote is sponsored by _______", quarter page ad in the program, mention on the website, email news and social media, plus 2 event tickets. Saturday Keynote Sponsor $1000 (one available) Includes a sponsor table in the main room, sign at front of room "This keynote is sponsored by _______", quarter page ad in the program, mention on the website, email news and social media, plus 2 event tickets. Silver Conference Program Sponsor $1000 Includes a sponsor table in the main room, quarter page ad in the program, mentions on website, email news, social media and signage, plus two event tickets Bronze Conference Program Sponsor $500 Includes a sponsor table in the main room, highlighted listing in program, mentions on website, email news, social media and signage Community Sponsor $250 Includes mentions on website, email news, social media and signage, listed in program SPONSOR NERD SUMMIT 2024 Email [email protected] if you have questions.'
