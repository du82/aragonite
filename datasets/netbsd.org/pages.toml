["https://netbsd.org/releases"]
title = "NetBSD releases"
full_description = "NetBSD releases NetBSD 10.1: the latest release Formal releases provide a stable, supported platform for use in production systems. They are also the proper choice for starters and for everyone who wants to get to know NetBSD. The latest formal release is NetBSD 10.1 (release information). More information about the NetBSD releases: NetBSD release glossary and graphs The history of NetBSD releases Previous formal NetBSD releases Supported Releases The following releases are currently supported. This means that they receive bug fixes. Anything older then the releases below are no longer supported and will not receive any bug fixes, including security fixes. Any changes made to the releases below will be included in the next release of the same series when and if one is made. That is, changes made to NetBSD 10.0 will appear in 10.1 and changes made to NetBSD 9.4 will appear in NetBSD 9.5. The NetBSD 10.x series: NetBSD 10.1 The NetBSD 9.x series: NetBSD 9.4 NetBSD-current NetBSD-current is the development version of NetBSD. Builds of -current generally provide more features than formal releases, but have not had the same degree of testing, and should be avoided on production systems where possible. They are aimed at developers, experienced testers, and early adopters. More information is available at the NetBSD-current page."
year_published = 2025
