["https://netbsd.org/foundation"]
title = "The NetBSD Foundation, Inc."
full_description = "The NetBSD Foundation, Inc. What is The NetBSD Foundation? The NetBSD Foundation serves as the legal entity which owns several of the NetBSD Project servers, handles donations of money, services, hardware or time to the project, and administers NetBSD copyrights. The NetBSD Foundation is incorporated in the State of Delaware, and is governed by a set of bylaws. The NetBSD Foundation is a non-profit organisation as per section 501(c)(3) of the Internal Revenue Code. The NetBSD Foundation has a Board of Directors, who may be contacted at <board@NetBSD.org>. The Board members were elected by the NetBSD Developer community, following the Board election procedure. Organizational structure Various committees have been set up by the Board: see the Executive Committees of the NetBSD Foundation page for details. Board, Office holders and Officers The current members of the NetBSD Foundation's Board of Directors are: David Brownlee <abs@NetBSD.org> Member of board: 2023-now; Term expires: 2025; Last elected: 2023 William J. Coldwell <billc@NetBSD.org> Member of board: 2015-now; Term expires: 2025; Last elected: 2023 David A. Holland <dholland@NetBSD.org> Member of board: 2024-now; Term expires: 2026; Last elected: 2024 Pierre Pronchery <khorben@NetBSD.org> Member of board: 2022-now; Term expires: 2026; Last elected: 2024 Leonardo Taccari <leot@NetBSD.org> Member of board: 2019-now; Term expires: 2025; Last elected: 2023 Michael van Elst <mlelstv@NetBSD.org> Member of board: 2016-now; Term expires: 2026; Last elected: 2024 Taylor R. Campbell <riastradh@NetBSD.org> Member of board: 2016-now; Term expires: 2026; Last elected: 2024 The office holders of the Foundation are: President: William J. Coldwell <billc@NetBSD.org> Vice President: Leonardo Taccari <leot@NetBSD.org> Secretary: Christos Zoulas <christos@NetBSD.org> Assistant Secretary: - <-> Treasurer: Christos Zoulas <christos@NetBSD.org> Assistant Treasurer: Taylor R. Campbell <riastradh@NetBSD.org> Policies The NetBSD Foundation has implemented the following policies: NetBSD Foundation Donation Policy. (2003/07/15) New NetBSD developer application procedure NetBSD Foundation Reimbursement Policy Resolutions The NetBSD Foundation has passed the following resolutions: Formation of administration-exec@NetBSD.org. (2003/01/14, amended 2003/03/11, dissolved 2008/03, written resolution 2017/02/15) Formation of communication-exec@NetBSD.org. (2003/01/14, amended 2003/03/11, dissolved 2008/03, written resolution 2017/02/15) Formation of finance-exec@NetBSD.org. (2003/01/14, amended 2003/03/11) Formation of membership-exec@NetBSD.org. (2003/01/14, amended 2003/03/11) Formation of technical-exec@NetBSD.org. (2003/01/14, amended 2003/03/11, dissolved 2008/03, written resolution 2017/02/15) Formation of core@NetBSD.org. (2003/09/23) Formation of pkgsrc-pmc@NetBSD.org. (2003/12/02) Formation of www-pmc@NetBSD.org. (2004/10/06) Formation of concom@NetBSD.org. (2016/08/10), amended 2017/11/08 Reports The following status reports of the NetBSD Foundation are available: Financial report: 2023 Financial report: 2022 Financial report: 2021 Financial report: 2020 Financial report: 2019 Financial report: 2018 Financial report: 2017 Financial report: 2016 Financial report: 2015 Financial report: 2014 Financial report: 2013 Financial report: 2012 Financial report: 2011 Financial report: 2010 Financial report: 2009 Financial report: 2008 Financial report: 2007 Quarterly Status Report: January - June 2007 Financial report: 2006 “Quarterly” Status Report: April - December 2006 Financial report: 2005 Quarterly Status Report: January - March 2006 Quarterly Status Report: July - December 2005 Financial report: 2004 Quarterly Status Report: April - June 2005 Quarterly Status Report: January - March 2005 Annual Group Meeting: 2004 Quarterly Status Report: October - December 2004 Quarterly Status Report: July - September 2004 Quarterly Status Report: April - June 2004 Quarterly Status Report: January - March 2004 Annual Group Meeting: 2003 Press releases Press releases from NetBSD Foundation and media information are available at the Media and Press Information webpage."
