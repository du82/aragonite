title = "The NetBSD Project"
full_description = '''The NetBSD Project NetBSD is a free, fast, secure, and highly portable Unix-like Open Source operating system. It is available for a wide range of platforms, from large-scale servers and powerful desktop systems to handheld and embedded devices. » Learn more 10.1 available! The NetBSD project is pleased to announce the first update to the NetBSD 10 release branch » NetBSD 10.1 « Get NetBSD NetBSD 10.1, released on December 16, 2024. » Release Notes CPU Machines Install media amd64 64-bit x86-family machines with AMD or Intel CPUs USB image, CD arm ARM systems like Raspberry Pi, PINE64, ODROID, "ServerReady" machines more Various boards, original RPi i386 32-bit x86-family generic machines USB image, CD mips MIPS systems like EdgeRouter, Loongson, Malta octeon, mips64el, mipsel powerpc PowerPC systems like Nintendo Wii, DHT Walnut, RouterBOARD wii, others sparc64 Sun UltraSPARC CD others Amiga, Alpha, Apple PowerPC/68K, Dreamcast, SPARC32, VAX, more architectures various A signed list of hashes for the NetBSD 10.1 distribution. The NetBSD Security Officer's PGP key used to sign the list of hashes. Donate Donations to The NetBSD Foundation allow the project to purchase build hardware and fund development. Some recently funded projects are: arm64 package build server Wi-Fi renewal LLDB and upstream LLVM support ptrace and GDB improvements Please consider donating if you would like to see more of this work: Donate using Stripe Donate or Subscribe with PayPal Sponsor NetBSD on GitHub Latest News (RSS) NetBSD 10.1 released16 Dec 2024 New Security Advisory: NetBSD-SA2024-002 OpenSSH CVE-2024-6387 `regreSSHion'02 Jul 2024 NetBSD 8.3 + End-of-Support for NetBSD 8.x4 May 2024 NetBSD 9.4 is available!20 Apr 2024 Upcoming Events FOSDEM '25, Brussels, BelgiumFeb 2025 AsiaBSDCon 2025, Tokyo, JapanMar 2025 BSDCan 2025, Ottawa, CanadaJun 2025 EuroBSDcon 2025, Zagreb, CroatiaSep 2025 » Archive'''
