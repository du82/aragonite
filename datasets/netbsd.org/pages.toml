["https://netbsd.org/mailinglists"]
title = "NetBSD mailing lists"
full_description = "NetBSD mailing lists Introduction The NetBSD Project provides a variety of public mailing lists to facilitate communication between the users and developers of NetBSD. All of the mailing lists are served by the Majordomo mailing list management package, and you can find out more about how to use the NetBSD Project's Majordomo by mailing <majordomo@NetBSD.org> with an empty message body. Please note that to reduce spam and improve accessibility, NetBSD mailing lists only accept plain text email, which many email clients don't send by default. The Use Plaintext Email website has advice on configuring various email clients to use plain text. To unsubscribe from a mailing list send an email message to <majordomo@NetBSD.org> containing only the message unsubscribe listname. Note Any and all posts to our mailing lists are archived across the internet virtually forever and are impossible for us to remove. Please consider any content, including the email address used to post to the list, as public information. You may also wish to consider this when engaging in personal conversations with other members on the public mailing lists. List descriptions General lists Port specific lists Obsolete lists (archive only) coverity-updates current-users netbsd-advocacy netbsd-announce netbsd-bugs netbsd-ci netbsd-docs netbsd-ports netbsd-syzbot netbsd-users pkgsrc-bugs pkgsrc-bulk pkgsrc-changes pkgsrc-users pkgsrc-wip-changes regional-au regional-boston regional-ca regional-cs regional-de regional-fr regional-it regional-jp regional-london regional-nyc regional-pl regional-sfba security-announce source-changes source-changes-full source-changes-d tech-crypto tech-embed tech-install tech-kern tech-misc tech-net tech-pkg tech-ports tech-repository tech-security tech-toolchain tech-userlevel tech-x11 www-changes port-acorn32 port-alpha port-amd64 port-amiga port-arm port-atari port-bebox port-cats port-dreamcast port-hp300 port-hpcarm port-hpcsh port-hppa port-i386 port-ia64 port-ibmnws port-iyonix port-luna68k port-m68k port-mac68k port-macppc port-mips port-mvme68k port-mvmeppc port-news68k port-next68k port-ofppc port-pc532 port-pdp10 port-powerpc port-prep port-riscv port-s390 port-sandpoint port-sh3 port-sparc port-sparc64 port-sun2 port-sun3 port-vax port-x68k port-xen port-zaurus amiga amiga-dev amiga-x m68k macbsd-development macbsd-general netbsd-desktop netbsd-help netbsd-java netbsd-jobs netbsd-news port-hp700 tech-multimedia atf-devel regional-ch regional-helsinki regional-nordic tech-cluster tech-smp tech-perform port-acorn26 port-algor port-arc port-cobalt port-evbmips port-ews4800mips port-hpcmips port-mipsco port-newsmips port-sbmips port-sgimips port-pmax port-playstation2 port-avr32 List descriptions General lists coverity-updates: This mailing list gets fed with new issues found by Coverity. Subscribe Browse current-users: This is a forum for all people using an up-to-date version of the NetBSD-current source tree. It is a good forum for talking about `gotchas' in the tree. Since the NetBSD-current tree is a quickly moving target, please confirm any problems with the latest tree before posting. Subscribe Browse NNTP netbsd-advocacy: This mailing list is for open discussion on how to promote the project. Subscribe Browse NNTP netbsd-announce: This mailing list is for announcements about NetBSD. Subscribe Browse NNTP netbsd-bugs: This mailing list is where you can discuss bugs in NetBSD. All NetBSD bug reports sent with send-pr(1) appear here. Subscribe Browse NNTP netbsd-ci: This mailing list is receives reports from the NetBSD Continuous Integration (CI) infrastructure and discussion about it. Subscribe Browse netbsd-docs: This mailing list is for discussing NetBSD documentation. Subscribe Browse NNTP netbsd-ports: This list is for people working on or generally interested in ports of NetBSD to various types of computers. Subscribe Browse NNTP netbsd-syzbot: This mailing list receives bug reports and status updates for bugs found in the NetBSD kernel by Google's syzkaller / syzbot kernel fuzzing tool. This list is a local copy of mail sent to the <syzkaller-netbsd-bugs@googlegroups.com> Google Group. Please do not send mail directly to this NetBSD.org list, because anyone subscribed directly to the Google Group will not receive it. See the syzkaller documentation and the syzbot documentation for more information about this tool and service. Subscribe Browse netbsd-users: This list provides a general help forum where users can discuss using NetBSD, regardless of platform. As a large number of subscribers receive this list, please use your good judgement when posting. Technical discussion related to the development and design of NetBSD itself aren't appropriate on this list and are better voiced in a more narrowly-focused technical list. Subscribe Browse NNTP pkgsrc-bugs: All bug reports in category “pkg” sent with send-pr(1) appear here. Please do not report your bugs here. Subscribe Browse NNTP pkgsrc-bulk: This mailing list receives reports and build logs of pkgsrc bulk builds. Subscribe Browse NNTP pkgsrc-changes: This list is for those who are interested in getting a commit message with the diff of the change attached for every change committed to the NetBSD Packages Collection (pkgsrc). It is also available in digest form, meaning one daily message containing all commit messages for changes to the package source tree in that 24 hour period. Subscribe Browse NNTP pkgsrc-users: This is a general-purpose list for most issues regarding the NetBSD Packages Collection (pkgsrc), regardless of platform, e.g. soliciting user help for pkgsrc configuration, unexpected build failures, using particular packages, upgrading pkgsrc installations, questions regarding the pkgsrc release branches, etc. General announcements or proposals for changes that impact the pkgsrc user community, e.g. major infrastructure changes, new features, package removals, etc., may also be posted. Subscribe Browse NNTP pkgsrc-wip-changes: This list is for those who are interested in getting a commit message and diffs for every change committed to the NetBSD Packages Collection WIP (work-in-progress) packages. This repository is open to all contributors, TNF member or not. Subscribe Browse regional-au: Discussion relevant to users in Australia. Subscribe Browse regional-boston: Discussion relevant to users in Boston, USA. Subscribe Browse regional-ca: Discussion relevant to users in Canada. Subscribe Browse regional-cs: Discussion relevant to users in Czech Republic & Slovak Republic. Subscribe Browse regional-de: Discussion relevant to users in Germany and other German speaking countries. Subscribe Browse NNTP regional-fr: Discussion relevant to users in France. Subscribe Browse regional-it: Discussion relevant to users in Italy. Subscribe Browse regional-jp: Discussion relevant to users in Japan. Subscribe Browse regional-london: Discussion relevant to users in London, UK. Subscribe Browse regional-nyc: Discussion relevant to users in New York City, USA. Subscribe Browse NNTP regional-pl: Discussion relevant to users in Poland. Subscribe Browse regional-sfba: Discussion relevant to users in the San Francisco Bay Area, USA. Subscribe Browse security-announce: Announcements from the NetBSD Security Officer group. e.g. Security Advisories and Security Notes. Information on reporting a security issue is available at the Security and NetBSD webpage. The tech-security mailing list can be used for discussing security issues related to NetBSD. Subscribe Browse source-changes: This list is for those who are interested in getting a commit message for every change committed to the NetBSD source tree. It is also available in digest form, meaning one daily message containing all commit messages for changes to the source tree in that 24 hour period. Subscribe Browse NNTP source-changes-full: This list is for those who are interested in getting a commit message with the diff of the change attached for every change committed to the NetBSD source tree. It is also available in digest form, meaning one daily message containing all commit messages for changes to the source tree in that 24 hour period. Note that this list is not archived on mail-index.NetBSD.org. Subscribe Browse source-changes-d: This list receives replies to commit messages on source-changes and source-changes-full. Subscribe Browse tech-crypto: Technical discussion regarding cryptography in the NetBSD system. Subscribe Browse NNTP tech-embed: Discussions about using NetBSD in embedded systems. Subscribe Browse NNTP tech-install: Technical discussion of improvements to NetBSD's installation software. NOTE: This mailing list is not for assistance with installing NetBSD. If you have problems installing NetBSD, see netbsd-users instead! Subscribe Browse NNTP tech-kern: Discussion of general technical kernel issues. Subscribe Browse NNTP tech-misc: Discussion of technical issues that aren't really appropriate for any of the other tech-* lists. Subscribe Browse NNTP tech-net: Discussion of technical issues relating to NetBSD's networking subsystem. Subscribe Browse NNTP tech-pkg: Discussion of technical issues related to development of the NetBSD Packages Collection (pkgsrc), e.g. soliciting feedback for changes to pkgsrc infrastructure, proposed new features, questions related to porting pkgsrc to a new platform, advice for maintaining a package, patches that affect many packages, help requests moved from pkgsrc-users@NetBSD.org when an infrastructure bug is found, etc. Subscribe Browse NNTP tech-ports: Discussion of technical issues related to porting NetBSD to different hardware. Subscribe Browse NNTP tech-repository: Discussions about the NetBSD source code control system. Subscribe Browse tech-security: Technical discussion regarding security issues in NetBSD. Subscribe Browse NNTP tech-toolchain: Technical discussion of toolchain and build system issues. Subscribe Browse NNTP tech-userlevel: Discussion of non-kernel related technical issues, such as POSIX compliance, compilation environment, etc. Subscribe Browse NNTP tech-x11: Discussion of the X11 window system as used with NetBSD. Subscribe Browse NNTP www-changes: This list is for those who are interested in getting a commit message for every change committed to the NetBSD WWW server's documents. Subscribe Browse NNTP Port specific lists port-acorn32: Discussion of issues specific to NetBSD on ARM6 and newer based machines (NetBSD/acorn32). There is also a port-arm list for questions related to all ARM based ports. Subscribe Browse NNTP port-alpha: Discussion of issues specific to NetBSD on Digital's Alpha AXP systems (NetBSD/alpha). Subscribe Browse NNTP port-amd64: Discussion of issues specific to NetBSD on AMD64 based machines (NetBSD/amd64). Subscribe Browse NNTP port-amiga: Discussion of issues specific to NetBSD on Commodore's Amiga and MacroSystem's DraCo machines (NetBSD/amiga). There is also a port-m68k list for questions related to all Motorola 68k based ports. NoteThis list supersedes the amiga, amiga-dev, and amiga-x lists. Subscribe Browse NNTP port-arm: Discussion of issues relevant to all ARM-based NetBSD ports. There are lists for the individual ports and they should be used for port-specific questions and information: port-acorn32, port-cats, and port-hpcarm. Subscribe Browse NNTP port-atari: Discussion of issues specific to NetBSD on Atari's TT030, Falcon, and Hades machines (NetBSD/atari). There is also a port-m68k list for questions related to all Motorola 68k based ports. Subscribe Browse NNTP port-bebox: Discussion of issues specific to NetBSD on Be, Inc.'s PowerPC based BeBox computer (NetBSD/bebox). There is also a port-powerpc list for questions related to all PowerPC based ports. Subscribe Browse NNTP port-cats: Discussion of issues specific to NetBSD on ARM based Chalice Technology CATS machines and EBSA evaluation boards (NetBSD/cats). There is also a port-arm list for questions related to all ARM based ports. Subscribe Browse NNTP port-dreamcast: Discussion of issues specific to NetBSD on Sega Dreamcast (NetBSD/dreamcast). There is also a port-sh3 list for questions related to all Hitachi Super-H (SH3/4) chips-based ports. Subscribe Browse NNTP port-hp300: Discussion of issues specific to NetBSD on Hewlett-Packard's 9000/300 and 9000/400 series machines (NetBSD/hp300). There is also a port-m68k list for questions related to all Motorola 68k based ports. Subscribe Browse NNTP port-hpcarm: Discussion of issues specific to NetBSD on ARM based Windows CE PDA machines (NetBSD/hpcarm). There is also a port-arm list for questions related to all ARM based ports. Subscribe Browse NNTP port-hpcsh: Discussion of issues specific to NetBSD on Hitachi Super-H (SH3/4) family based Windows CE PDA machines (NetBSD/hpcsh). There is also a port-sh3 list for questions related to all Hitachi Super-H (SH3/4) based ports. Subscribe Browse NNTP port-hppa: Discussion of issues specific to NetBSD on Hewlett-Packard's 9000/700 HP-PA RISC machines (NetBSD/hppa). Subscribe Browse port-i386: Discussion of issues specific to NetBSD on IBM PC clones with i386 or better CPUs (NetBSD/i386). Subscribe Browse NNTP port-ia64: Discussion of issues specific to NetBSD on Intel Itanium Processor Family CPUs (NetBSD/ia64). Subscribe Browse NNTP port-ibmnws: Discussion of issues specific to NetBSD on IBM Network Station Series 1000 PowerPC-based computers (NetBSD/ibmnws). There is also a port-powerpc list for questions related to all PowerPC based ports. Subscribe Browse port-iyonix: Discussion of issues specific to NetBSD on the ARM based Iyonix PC (NetBSD/iyonix). Subscribe Browse port-luna68k: Discussion of issues specific to NetBSD on 68k based OMRON LUNA machines (NetBSD/luna68k). There is also a port-m68k list for questions related to all Motorola 68k based ports. Subscribe Browse NNTP port-m68k: Discussion of issues relevant to all m68k-based NetBSD ports. There are lists for the individual ports and they should be used for port-specific questions and information: port-amiga, port-atari, port-hp300, port-luna68k, port-mac68k, port-mvme68k, port-news68k, port-next68k, port-sun2, port-sun3, and port-x68k. Subscribe Browse NNTP port-mac68k: Discussion of issues specific to NetBSD on Apple's m68k based Macintosh machines (NetBSD/mac68k). There is also a port-m68k list for questions related to all Motorola 68k based ports. NoteThis list supersedes both the macbsd-general and macbsd-development lists. Subscribe Browse NNTP port-macppc: Discussion of issues specific to NetBSD on Apple's PowerPC based Macintosh machines (NetBSD/macppc). There is also a port-powerpc list for questions related to all PowerPC based ports. Subscribe Browse NNTP port-mips: Discussion of issues relevant to all MIPS-based NetBSD ports. Subscribe Browse NNTP port-mvme68k: Discussion of issues specific to NetBSD on Motorola's 68k VME board computers (NetBSD/mvme68k). There is also a p"
