title = "The NetBSD Port Maintainers"
full_description = "The NetBSD Port Maintainers The NetBSD port maintainers fix and improve the various ports of NetBSD. There is one port maintainer or a team of two co-maintainers per type of machine that the NetBSD operating system supports. A port's maintainer is the final authority about changes being made to that port, and is responsible for attempting to fix problems with the port and for integrating improvements into the port in a timely manner. If a port doesn't have a maintainer, then we can't consider it ``supported.'' Being a port maintainer is hard work, but is crucial to the NetBSD Project's continued success. The NetBSD Port Maintainers (in alphabetical order by port name) Port Name(s) E-mail Address(es) acorn32 Reinoud Zandijk <reinoud> alpha Matt Thomas <matt> amd64 David Laight <dsl> amiga Ignatios Souvatzis <is> amigappc Ignatios Souvatzis <is> arc Noriyuki Soda <soda> atari Julian Coleman <jdc> cobalt Erik Berls <cyber> evbmips Simon Burge <simonb> ews4800mips Izumi Tsutsui <tsutsui> hp300 Izumi Tsutsui <tsutsui> hpcsh Valeriy E. Ushakov <uwe> hppa Nick Hudson <skrll> i386 David Laight <dsl> ibmnws Matt Thomas <matt> iyonix Gavan Fantom <gavan> landisk Valeriy E. Ushakov <uwe> luna68k Izumi Tsutsui <tsutsui> mac68k Martin Husemann <martin> � John Klos <jklos> macppc Michael Lorenz <macallan> netwinder Matt Thomas <matt> news68k Izumi Tsutsui <tsutsui> pmax Simon Burge <simonb> sandpoint Tohru Nishimura <nisimura> sbmips Simon Burge <simonb> sgimips S�ren J�rvang <soren> sh3 SAITOH Masanobu <msaitoh> sparc64 Martin Husemann <martin> vax Anders Magnusson <ragge> x68k NISHIMURA Takeshi <nsmrtks> xen Manuel Bouyer <bouyer>"
