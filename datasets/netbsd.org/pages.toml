["https://netbsd.org/people/groups"]
title = "NetBSD People: Other Groups within the NetBSD Project"
full_description = "NetBSD People: Other Groups within the NetBSD Project Other Groups within the NetBSD Project The page lists the other groups within NetBSD, their areas of responsibility, and contact information. Most NetBSD Developers aren't involved in any of these groups, but still benefit and contribute substantially to the Project. Without all of these people, NetBSD wouldn't exist. The general groups within the developer community are: NetBSD Developers NetBSD Core Group NetBSD Foundation Other groups within the NetBSD Project are: Accounts - accounts@NetBSD.org Admins - admins@NetBSD.org Announce - announce@NetBSD.org Entomologist - gnats-admin@NetBSD.org Mirrors - mirrors@NetBSD.org Packages - packages@NetBSD.org pkgsrc Releng - releng-pkgsrc@NetBSD.org pkgsrc Security Team - pkgsrc-security@NetBSD.org Releng - releng@NetBSD.org Security Alert - security-alert@NetBSD.org Security Officer - security-officer@NetBSD.org Security Team - security-team@NetBSD.org WWW - www@NetBSD.org pkgsrc Bug People Groups Accounts - accounts@NetBSD.org Responsible for creation of project host developer accounts for those individuals invited to join The NetBSD Project. Members: NetBSD System Administration Group. Admins - admins@NetBSD.org Responsible for changes to NetBSD Project hosts. If it needs root, ask here. This is also an appropriate contact for reporting account related problems. Members: Phil Nelson, Jeff Rizzo, Thor Lancelot Simon, Noriyuki Soda, T K Spindler, Matthew Sporleder, Kimmo Suominen, S.P.Zeidler, and Christos Zoulas. Announce - announce@NetBSD.org Moderates posting to <netbsd-announce@NetBSD.org>. Herb Peyerl currently is responsible for this task. Entomologist - gnats-admin@NetBSD.org Keeper of the GNATS database, master of bug classification and statistics. Members: David A. Holland. Mirrors - mirrors@NetBSD.org This is the group that handles requests and communication with those wishing to run a mirror. Members: WWW. Packages - packages@NetBSD.org The people who handle pkgsrc. Members: Jason Bacon, Christoph Badura, Michael B�uerle, Stephen Borrill, Manuel Bouyer, David Brownlee, Aleksey Cheusov, Adam Ciarcinski, Dan C�rnaț, Alistair G. Crooks, Masatake Daimon, Mark Davies, Jarom�r Doleček, Jun Ebihara, Stoned Elipot, Gavan Fantom, Hubert Feyrer, Nick Hudson, Soren Jacobsen, Takahiro Kambe, Min Sik Kim, Thomas Klausner, Juraj Lutter, Dan McMahill, Thomas Merkel, John Nemeth, Richard Palo, Jonathan Perkin, Nils Ratusznik, Jeremy C. Reed, Jens Rehsack, Jeff Rizzo, Niclas Rosenvik, Matthias Scheler, Amitai Schleier, Jonathan Schleifer, Olaf Seibert, John R. Shannon, Benny Siegert, J�rg Sonnenberger, Matthew Sporleder, Adrian Steinmann, Kimmo Suominen, Leonardo Taccari, Shin'ichiro Taya, Krister Walfridsson, Patrick Welche, Lex Wennmacher, and Sebastian Wiedenroth. pkgsrc Releng - releng-pkgsrc@NetBSD.org The pkgsrc Release Engineering Group. They manage stable branches, process pullups and schedule freeze periods. Members: Benny Siegert, and S.P.Zeidler. pkgsrc Security Team - pkgsrc-security@NetBSD.org Responsible for handling pkgsrc security issues. Members: Thomas Klausner, Thomas Merkel, Tobias Nygren, and Leonardo Taccari. Releng - releng@NetBSD.org The Release Engineering group. They organize release schedules, policies, and pullups. Members: Stephen Borrill, Manuel Bouyer, David Brownlee, Julian Coleman, Alistair G. Crooks, Havard Eidnes, Martin Husemann, Soren Jacobsen, Phil Nelson, Jeff Rizzo, and SAITOH Masanobu. Security Alert - security-alert@NetBSD.org An emergency contact address for notifying the NetBSD project of security issues. Less of a formal 'group' than security-officer, below. Members: David Maxwell, S.P.Zeidler, NetBSD Core, and NetBSD Security-Officer. Security Officer - security-officer@NetBSD.org Responsible for handling security issue resolution and announcements. Members: Taylor R. Campbell, Alistair G. Crooks, and Christos Zoulas. Security Team - security-team@NetBSD.org Responsible for assisting to resolve security issues and preparing announcements. Members: Erik Berls, William J. Coldwell, Mateusz Kocielski, Cherry G. Mathew, Maya Rashish, Jonathan Schleifer, J�rg Sonnenberger, S.P.Zeidler, NetBSD Core and NetBSD Security-Officer. WWW - www@NetBSD.org A group responsible for maintenance and additions to the NetBSD web site content (though all developers are encouraged to checkout htdocs and add anything they see fit). This group also replies to feedback from the web page forms and handles submissions to the NetBSD gallery. Members: David Brownlee, D'Arcy J.M. Cain, Jun Ebihara, Erik Fair, Hubert Feyrer, David Maxwell, Phil Nelson, Herb Peyerl, Jeremy C. Reed, Reed Shadgett, Noriyuki Soda, and Leonardo Taccari."
