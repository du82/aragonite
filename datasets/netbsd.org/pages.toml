title = "NetBSD People: The NetBSD Core Group"
full_description = "NetBSD People: The NetBSD Core Group If the NetBSD Project were a large company, the NetBSD core group would be the technical management. No, it's not just dead weight. Rather, members of the core group set the direction and goals of the NetBSD Project as a whole, promote people's interest in the NetBSD Project and the system it produces, and consider the serious architectural questions that need to be addressed if the NetBSD Project is going to keep producing a viable system. The NetBSD Core Group can be reached at: <core@NetBSD.org>. The current NetBSD Core Group is: Christos Zoulas <christos@NetBSD.org> Chuck Silvers <chs@NetBSD.org> Martin Husemann <martin@NetBSD.org> Matthew Green <mrg@NetBSD.org> Rin Okuyama <rin@NetBSD.org> Robert Elz <kre@NetBSD.org> Taylor R. Campbell <riastradh@NetBSD.org> Previous NetBSD Core Group members: Alan Barrett Allen Briggs <briggs@NetBSD.org> J.T. Conklin Chris G. Demetriou Theo de Raadt Quentin Garnier <cube@NetBSD.org> Adam Glass Jun-ichiro itojun Hagino Charles Hannum Antti Kantee Paul Kranenburg Frank van der Linden <fvdl@NetBSD.org> Luke Mewburn <lukem@NetBSD.org> Herb Peyerl Scott Reynolds YAMAMOTO Takashi Jason Thorpe Valeriy E. Ushakov Matt Thomas <matt@NetBSD.org> Alistair Crooks <agc@NetBSD.org>"
