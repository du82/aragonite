["https://netbsd.org/community"]
title = "NetBSD Community"
full_description = '''NetBSD Community Get in contact with other NetBSD users. Ask for help or share your experience and technical knowledge. Explore the activities and resources of the NetBSD community. Mailing lists NetBSD primarily "happens" on the mailing lists, and it's recommended to direct questions and contributions to the lists so your queries get noticed. If you don't want to subscribe and receive regular emails, you can browse the lists via web or NNTP and send mail without a subscription. Most user-relevant discussions happen on netbsd-users and current-users, while the main developer-relevant lists are tech-userlevel and tech-kern. Mailing lists and archives (as an alternative: MARC) Social Media NetBSD on ActivityPub/Mastodon Online chats IRC - NetBSD channels are available on the following IRC networks: #NetBSD on libera #NetBSD-code on libera #pkgsrc on libera #NetBSD on IRCnet Matrix NetBSD rooms: NetBSD main room pkgsrc main room IRC channels and Matrix rooms may not be active all the time, especially after midnight in Europe. If you don't immediately get a response, it's better to leave the client open and stay connected and wait than immediately leave (if you quit the client, you won't ever get a response). Internet forums, discussion groups, etc /r/NetBSD on Reddit NetBSD on UnitedBSD NetBSD on BSDForen (German language) NetBSD on DaemonForums Community-run public access servers SDF.org tilde.pink User groups and regional resources User groups and other regional resources of the NetBSD community Usenet newsgroups comp.unix.bsd.netbsd.announce comp.unix.bsd.netbsd.misc comp.unix.bsd.misc'''
