title = "Netflix Open Source Software Center"
description = "Netflix Open Source"
full_description = '''We would like to thank all of those who contribute to the Netflix open source community including our Netflix developers, all external contributors, and our active user base. Netflix Open Source won the JAX Special Jury Award. Jury member Neal Ford was quoted as saying "that architecture is cool again, that it can be used as a business differentiator, and when done right it is a huge advantage. Netflix showed the power of internalizing DevOps into their architecture; all architectures will do this in the future." For the simple approach, try out our ZeroToDocker container images. After downloading the images, you can be up and running NetflixOSS in just a few minutes. After you've tackled that, check out the IBM ACME Air and Flux Capacitor apps, and the Zero-to-Cloud workshop. If you are looking to have a large impact at a growing company and work with a high performance team - start here. Work with talented colleagues on hard problems that affect millions of customers. At Netflix we value high performance, freedom and responsibility. We don't focus on rules, processes or procedures. We are candid and transparent and seek excellence in everything that we do. We tackle problems others have not been able to solve. We license great content, build systems at scale and use data to push the business forward. We connect people with movies and television globally. Netflix is committed to open source. Netflix both leverages and provides open source technology focused on providing the leading Internet television network. Our technology focuses on providing immersive experiences across all internet-connected screens. Netflix's deployment technology allows for continuous build and integration into our worldwide deployments serving members in over 50 countries. Our focus on reliability defined the bar for cloud based elastic deployments with several layers of failover. Netflix also provides the technology to operate services responsibly with operational insight, peak performance, and security. We provide technologies for data (persistent & semi-persistent) that serve the real-time load to our 62 million members, as well as power the big data analytics that allow us to make informed decisions on how to improve our service. If you want to learn more, jump into any of the functional areas below to learn more.'''
