title = "Open Sourcing Zuul 2. The latest version of Netflix's Cloud… | by Netflix Technology Blog | Netflix TechBlog"
description = "Netflix's core service for handling all incoming traffic into Netflix's cloud services, Zuul 2,  is now available as OSS . Read how we use it to handle more than 1 million requests/sec and much more."
full_description = "Open Sourcing Zuul 2Netflix Technology Blog·FollowPublished inNetflix TechBlog·7 min read·May 21, 2018--8ListenShareWe are excited to announce the open sourcing of Zuul 2, Netflix’s cloud gateway. We use Zuul 2 at Netflix as the front door for all requests coming into Netflix’s cloud infrastructure. Zuul 2 significantly improves the architecture and features that allow our gateway to handle, route, and protect Netflix’s cloud systems, and helps provide our 125 million members the best experience possible. The Cloud Gateway team at Netflix runs and operates more than 80 clusters of Zuul 2, sending traffic to about 100 (and growing) backend service clusters which amounts to more than 1 million requests per second. Nearly all of this traffic is from customer devices and browsers that enable the discovery and playback experience you are likely familiar with.This post will overview Zuul 2, provide details on some of the interesting features we are releasing today, and discuss some of the other projects that we’re building with Zuul 2.How Zuul 2 WorksFor context, here’s a high-level diagram of Zuul 2’s architecture:The Netty handlers on the front and back of the filters are mainly responsible for handling the network protocol, web server, connection management and proxying work. With those inner workings abstracted away, the filters do all of the heavy lifting. The inbound filters run before proxying the request and can be used for authentication, routing, or decorating the request. The endpoint filters can either be used to return a static response or proxy the request to the backend service (or origin as we call it). The outbound filters run after a response has been returned and can be used for things like gzipping, metrics, or adding/removing custom headers.Zuul’s functionality depends almost entirely on the logic that you add in each filter. That means you can deploy it in multiple contexts and have it solve different problems based on the configurations and filters it is running.We use Zuul at the entrypoint of all external traffic into Netflix’s cloud services and we’ve started using it for routing internal traffic, as well. We deploy the same core but with a substantially reduced amount of functionality (i.e. fewer filters). This allows us to leverage load balancing, self service routing, and resiliency features for internal traffic.Open SourceThe Zuul code that’s running today is the most stable and resilient version of Zuul yet. The various phases of evolving and refactoring the codebase have paid dividends and we couldn’t be happier to share it with you.Today we are releasing many core features. Here are the ones we’re most excited about:Server ProtocolsHTTP/2 — full server support for inbound HTTP/2 connectionsMutual TLS — allow for running Zuul in more secure scenariosResiliency FeaturesAdaptive Retries — the core retry logic that we use at Netflix to increase our resiliency and availabilityOrigin Concurrency Protection — configurable concurrency limits to protect your origins from getting overloaded and protect other origins behind Zuul from each otherOperational FeaturesRequest Passport — track all the lifecycle events for each request, which is invaluable for debugging async requestsStatus Categories — an enumeration of possible success and failure states for requests that are more granular than HTTP status codesRequest Attempts — track proxy attempts and status of each, particularly useful for debugging retries and routingWe are also working on some features that will be coming soon, including:Websocket/SSE — support for side-channel push notificationsThrottling and rate-limiting — protection from malicious client connections and requests, helping defend against volumetric attacksBrownout filters — for disabling certain CPU-intensive features when Zuul is overloadedConfigurable routing — file-based routing configuration, instead of having to create routing filters in ZuulWe would love to hear from you and see all the new and interesting applications of Zuul. For instructions on getting started, please visit our wiki page.Leveraging Zuul 2 at NetflixInternally, there are several major features that we’ve been working on but have not open sourced yet. Each one deserves its own blog post, but let’s go over them briefly.Self Service RoutingThe most widely-used feature by our partners is self service routing. We provide an application and API for users to create routing rules based on any criteria in the request URL, path, query params, or headers. We then publish these routing rules to all the Zuul instances.The main use case is for routing traffic to a specific test or staging cluster. However, there are many use cases for real production traffic. For example:Services needing to shard their traffic create routing rules that map certain paths or prefixes to separate originsDevelopers onboard new services by creating a route that maps a new hostname to their new originDevelopers run load tests by routing a percentage of existing traffic to a small cluster and ensuring applications will degrade gracefully under loadTeams refactoring applications migrate to a new origin slowly by creating rules mapping traffic gradually, one path at a timeTeams test changes (canary testing) by sending a small percentage of traffic to an instrumented cluster running the new buildIf teams need to test changes requiring multiple consecutive requests on their new build, they run sticky canary tests that route the same users to their new build for brief periods of timeSecurity teams create rules that reject “bad” requests based on path or header rules across all Zuul clustersAs you can see we use self service routing extensively and are increasing the customizability and scope of routes to allow for even more use cases.Load Balancing for ResiliencyAnother major feature we’ve worked on is making load balancing to origins more intelligent. We are able to route around failures, slowness, GC issues, and various other things that crop up often when running large amounts of nodes. The goal of this work is to increase resiliency, availability, and quality of service for all Netflix services.We have several cases that we handle:Cold InstancesWhen new origin instances start up, we send them a reduced amount of traffic for some time, until they’re warmed up. This was an issue we observed for applications with large codebases and huge metaspace usage. It takes a significant amount of time for these apps to JIT their code and be ready to handle a large amount of traffic.We also generally bias the traffic to older instances and if we happen to hit a cold instance that throttles, we can always retry on a warm one. This gives us an order of magnitude improvement in availability.High Error RatesErrors happen all the time and for varying reasons, whether it’s because of a bug in the code, a bad instance, or an invalid configuration property being set. Fortunately, as a proxy, we can detect errors reliably — either we get a 5xx error or there are connectivity problems to the service.We track error rates for each origin and if the error rate is high enough, it implies the entire service is in trouble. We throttle retries from devices and disable internal retries to allow the service to recover. Moreover, we also track successive failures per instance and blacklist the bad ones for a period of time.Overloaded InstancesWith the above approaches we send less traffic to servers in a cluster that are throttling or refusing connections, and lessened the impact by retrying those failed requests on other servers.We’re now rolling out an additional approach where we aim to avoid overloading servers in the first place. This is achieved by allowing origins to signal to Zuul their current utilization, which Zuul then uses as a factor in its load-balancing choices — leading to reduced error rates, retries, and latency.The origins add a header to all responses stating their utilization as a percentage, along with a target utilization they would like to have across the cluster. Calculating the percentage is completely up to each application and engineers can use whatever metric suits them best. This allows for a general solution as opposed to us trying to come up with a one-size-fits-all approach.With this functionality in place, we assign a score (combination of instance utilization and other factors like the ones above) to each instance and do a choice-of-two load balancing selection.Anomaly Detection and Contextual AlertingAs we grew from just a handful of origins to a new world where anyone can quickly spin up a container cluster and put it behind Zuul, we found there was a need to automatically detect and pinpoint origin failures.With the help of Mantis real time event streaming, we built an anomaly detector that aggregates error rates per service and notifies us in real time when services are in trouble. It takes all of the anomalies in a given time window and creates a timeline of all the origins in trouble. We then create a contextual alert email with the timeline of events and services affected. This allows an operator to quickly correlate these events and orient themselves to debug a specific app or feature, and ultimately find the root cause.In fact, it was so useful that we expanded it to send notifications to the origin teams themselves. We’ve also added more internal applications, other than Zuul, and can build a much more extensive timeline of events. This has been a huge help during production incidents and helps operators quickly detect and fix problems before they cascade into massive outages.We hope to open source as many of the above features as we can. Keep watching the tech blog for more depth on them in the future. If you want to help us solve these kinds of problem, please check out our jobs site.— Arthur Gonigberg ( @agonigberg ), Mikey Cohen (@moldfarm ), Michael Smith (@kerumai ), Gaya Varadarajan ( @gaya3varadhu ), Sudheer Vinukonda ( @apachesudheerv ), Susheel Aroskar (@susheelaroskar )"
