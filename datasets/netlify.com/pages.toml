["https://netlify.com/about"]
title = "About Netlify"
description = "At Netlify, we aim to perfect a unified platform that automates code; creating high-performant sites and web-apps. Learn more about Netlify."
full_description = 'About Netlify We want the web to win Netlify is the platform developers love for building highly-performant and dynamic websites, e-commerce stores and web applications. By uniting an extensive ecosystem of technologies, services and APIs into one workflow, Netlify unlocks new levels of team productivity, while saving time and money. Our bet on Jamstack is quickly coming true. The web is rapidly changing away from monolithic to decoupled apps, and web developers are storming ahead with more power than ever. Netlify is built to cater to that movement, and in just a few years we’ve on-boarded millions of developers and businesses, and are building and serving millions of web projects daily around the globe. Fun fact: An estimated 16% of the internet population visits a website or web app on Netlify each month. A company is as good as its team At Netlify, we have a distributed culture rather than just being "remote-friendly." Simply put, we strive to be a workplace where you can work from home and have an equal opportunity to influence decisions and culture across the organization. We tackle complex problems, in a remote-first environment while caring deeply about what we do and having fun. Culture If a company is as good as the team of people who work there, then a team is as good as its culture. We aim to be as intentional as we can in how we scale both our organization and culture. Read all about our philosophy and values﻿ Distribution Netlify is a distributed company. We work remotely and bring team members together on occasion around the world and in our home base in San Francisco. We’ve structured Netlify to support this and we pride ourselves on having a distributed culture. Read more about the things we do to support it﻿ Careers We’re a tightly knit team of driven, mission-focused people. We’re growing rapidly while still nurturing our culture by carefully adding passionate and empathetic people. We have lots of open positions. That said, we hire people, not roles. Together we will carve out the right fit that gives you maximum joy and sets you up for success, while making sure it’s what we need to keep taking strides in creating a better web. For all of us. Can you find yourself in the above? Join us. Check open positions'
