full_description = '(function(){const i=window.matchMedia("(prefers-reduced-motion)");document.addEventListener("DOMContentLoaded",function(){var o=[].slice.call(document.querySelectorAll("video.lazy"));if("IntersectionObserver"in window){var r=new IntersectionObserver(function(e){e.forEach(function(t){if(t.isIntersecting){for(var c in t.target.children){var n=t.target.children[c];typeof n.tagName=="string"&&n.tagName==="SOURCE"&&(n.src=n.dataset.src||"")}let a=t.target;a.load(),a.classList.remove("lazy"),r.unobserve(t.target)}})});o.forEach(function(e){i.matches||e.setAttribute("autoplay",""),r.observe(e)})}})})(); Case Study The making of mammut.com See how Netlify helped Mammut reach new heights. Watch now Mammut means quality - in brand and in technology Mammut, a Swiss brand established in 1862, is a market leader in avalanche technology and premium performance gear. Mammut makes performance apparel and high-quality gear for climbers, mountaineers and skiers. Their mission is to create products that empower outdoor adventurists to reach new heights. For Mammut, Netlify is the clear choice Mammut came to Netlify because they needed a performant, interoperable Composable Web Platform that could deliver a best-in-class digital brand experience for their customers. They needed a partner that could keep their site reliable and performant during peak retail season and unexpected traffic spikes. For more on this: check out Part 4. This is the making of Mammut.com Part 1: The history of the Mammut brand Length: 3 mins Watch Part 1 Part 2: Building a brand experience Length: 3 mins Watch Part 2 Part 3: Omni-channel innovation Length: 2:30 mins Watch Part 3 Part 4: Leveraging AI and meeting Frank Ocean level demand Length: 3 mins Watch Part 4 Get a comprehensive and actionable evaluation of your current web architecture. Get your assessment'
