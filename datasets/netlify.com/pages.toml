w()).toString(36);this.tabs.forEach((t,s)=>{const i=this.panels[s];t.id||=`${e}-tab-${s}`,i.id||=`${e}-panel-${s}`,t.setAttribute("aria-controls",i.id),i.setAttribute("aria-labelledby",t.id)})}updateSelection(){const e=new Event("tab-change");this.tabs.forEach((t,s)=>{const i=this.panels[s],l=t.getAttribute("aria-selected")==="true";t.setAttribute("aria-selected",l?"true":"false"),t.setAttribute("tabindex",l?"0":"-1"),i.hidden=!l}),this.selected.dispatchEvent(e)}setupEvents(){this.tabs.forEach(e=>{e.addEventListener("click",()=>{this.selected!==e&&(this.selected=e,this.selected.focus())}),e.addEventListener("keydown",t=>{t.key==="ArrowLeft"?this.selected=e.previousElementSibling??this.tabs.at(-1):t.key==="ArrowRight"&&(this.selected=e.nextElementSibling??this.tabs.at(0)),["ArrowLeft","ArrowRight"].includes(t.key)&&this.selected.focus()})})}}customElements.define("the-tabs",r); Deploy to Netlify'''
