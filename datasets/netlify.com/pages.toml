title = "Changelog | Netlify"
description = """
Simplify authentication and authorization for your sites and apps with the Auth0 extension. The Auth0 extension lets you connect your Netlify team and its apps to Auth0 from the Netlify Dashboard.
You can also add authorization to your functions to manage access across multiple services. For an example, check out our docs on creating a function to use Auth0 on the backend.
Learn more about our Auth0 partnership or using the Auth0 extension."""
full_description = '''Changelog All Tags AI AX Build CLI Extensions Forms Functions SDK Updates Workflow const n=document.querySelector(".tag-input");n?.addEventListener("change",t=>{const e=t.target?.value;window.location=e==="all"?"/changelog/":`/changelog/tag/${e}/`}); Subscribe to feed Auth0 extension now available February 28, 2025 extensions Simplify authentication and authorization for your sites and apps with the Auth0 extension. The Auth0 extension lets you connect your Netlify team and its apps to Auth0 from the Netlify Dashboard. You can also add authorization to your functions to manage access across multiple services. For an example, check out our docs on creating a function to use Auth0 on the backend. Learn more about our Auth0 partnership or using the Auth0 extension. Permalink to Auth0 extension now available Permalink Deprecation of Netlify Identity February 28, 2025 Netlify Identity and the underlying GoTrue API are now officially deprecated. This means that: They are still available for existing users and services. They will not be updated beyond major security issues. We will no longer fix bugs or offer troubleshooting support. For help exporting your data to migrate, reach out to Support. We recommend using an alternative, such as the official Auth0 extension for Netlify, which simplifies authentication and authorization for your sites and apps. Learn more about setting up the Auth0 extension and why we’ve made these changes. For an alternative to the GoTrue API, we recommend Supabase Auth, an actively maintained fork of GoTrue. Permalink to Deprecation of Netlify Identity Permalink Team selection for claimed sites February 26, 2025 ai ax When claiming apps created by partner tools or AI code generation tools like Bolt, you’re now able to select which of your Netlify teams to claim the app into, offering greater flexibility for your workflows. Permalink to Team selection for claimed sites Permalink Codezero extension now available February 21, 2025 • Article Learn how the Codezero extension for Netlify enables secure local development with internal APIs and services through Zero Environment Development, without exposing private infrastructure. Permalink to Codezero extension now available Permalink New API for partners to deploy fullstack websites on Netlify February 19, 2025 ax ai Platforms on Netlify can now deploy fullstack websites on behalf of users - complete with functions, edge functions, extensions, redirects, and more. Sounds interesting? Get started with this developer guide. Permalink to New API for partners to deploy fullstack websites on Netlify Permalink Set up deploys for all branches with a prefix February 18, 2025 build workflow We now support configuring your site to deploy all branches with a specific prefix. Leverage the new functionality by configuring Branch Deploys in Site Configuration > Continuous deployment. Add a wildcard at the end of your prefix to deploy all branches beginning with the given text - for example, enter release/* to automatically deploy release/alpha-1, release/v2, and so on. Permalink to Set up deploys for all branches with a prefix Permalink Form detection now autoenabled for partner and AI-generated sites February 14, 2025 ai forms Previously, users creating sites through partner tools or AI code generation tools like Bolt had to manually enable form detection—often causing confusion and blocking access to submissions. Now, form detection is autoenabled, allowing end users, especially low-code users, to start collecting submissions immediately without extra setup. This update reduces friction for both partner tool users and AI-generated site deployments, ensuring a smoother experience. Permalink to Form detection now autoenabled for partner and AI-generated sites Permalink Official Netlify context for AI developer tools February 13, 2025 ax ai Netlify now provides official AI context files to improve the accuracy and reliability of AI coding assistants like Cursor, Windsurf, and GitHub Copilot. Developers can easily integrate the context files into their projects, with specific support for Cursor and other AI tools. Additionally, Netlify CLI (v18.1.0+) includes a netlify recipes ai-context command for seamless context management, allowing for easy updates while preserving custom overrides. With this realease, Netlify’s documentation also now supports a /llms.txt resource, enabling AI tools that automatically reference https://docs.netlify.com/llms.txt to have enhanced web context. To learn more about this and how to use it, check out our documentation. Permalink to Official Netlify context for AI developer tools Permalink Learn more about Official Netlify context for AI developer tools Learn More Deployment label update for AI partner integrations February 10, 2025 ai ax We’ve made a small but meaningful update to how deployment statuses are displayed in the Netlify UI. Previously, when a site was deployed from a partner site (such as Bolt, for example), the label simply read “Manual deploy.” Now, you’ll see “Deployed from [Partner name]” instead. This change helps provide clearer visibility into where your deployments are coming from, making it easier to track automated workflows and integrations. If you’re working with partners like Bolt, this update ensures your deployment history reflects that connection, reducing ambiguity and improving collaboration. It doesn’t change anything about how deployments work—just a small tweak to make things clearer and more informative. Let us know if you have feedback, and happy deploying! Permalink to Deployment label update for AI partner integrations Permalink Next page const t=document.querySelector("#cta-changelog-hero-subscribeForUpdates");t?.addEventListener("click",e=>{e.preventDefault(),document.querySelector("#hubspot-form-site-footer input[name='email']")?.focus()});'''
