["https://netlify.com/careers"]
title = "Careers at Netlify: Help us build a better Web"
description = "The web is changing — it’s Netlify’s mission to make sure it changes for the better. Our tools help create modern sites that are many times faster and more secure, scalable, and compatible with modern workflows. The ease of developing and managing sites on Netlify has earned us tons of praise from developers all over the world."
full_description = 'Careers at Netlify Help us build a better web Find a Job Our mission The web is changing — it’s Netlify’s vision to make sure it changes for the better. When you are interacting with stores, sites or apps for any of our customers’ best loved products, those websites are powered by Netlify. Netlify brings together the entire ecosystem of web development tools and APIs into one simplified development workflow. Our vision is to empower global teams to build a faster, personal and safer web. At Netlify, we have a distributed culture rather than just being "remote-friendly." Simply put, we strive to be a workplace where you can work from home and have an equal opportunity to influence decisions and culture across the organization. We tackle complex problems, in a remote first environment while caring deeply about what we do and having fun. Launch something amazing with your career Health, Wellness, & Education We offer full benefits including flexible time off, sponsored mental health resources, at least 16 weeks of parental leave, $2k/yearly learning and development allowance, 401k, and more. Home Office Build out a home office with a generous starting stipend. Expense your internet, cell phone, or co-working membership within a monthly allowance. In-person Connection We are a distributed culture but we also like to get together and meet! Netli-meet your coworkers at annual team offsites and all hands. Our Values Netlivate We look to make things simpler vs. complicated when it comes to planning, engaging, and delivering results with our customers and partners. Weigh In, Then Buy In Curious and open-minded vs. pushing an agenda. Ask tough questions yet are willing to be asked and answer similar questions. We are data-driven, and we commit to moving forward as a team. Own It, Ship It We seize the opportunity in front of us. We take chances as we are creating a new market. We take ownership and responsibility of our work vs. blame or deflect to others. We admit mistakes, ask for help, apologize, and be open and honest when we don’t know something. We don’t quit and are relentlessly resourceful. We choose impact and prioritize success. Care Deeply, and Have Fun We are passionate about the work we do and the impact we have. We are also passionate about our customers and partners both internal and external to Netlify. We understand there are bad moments, not bad days. We contribute with levity and fun and lift the spirits of others around us. Diversity = Intelligence We foster and build an inclusive and diverse culture, which makes us stronger and smarter. Diversity will allow us to deliver the best product and services to our developers, customers, and partners globally. We continually strive to be more emotionally intelligent. We will hire as an organization consistently improving the diversity of our teams to be representative of the world. Meet our Netlifiers Dana Lawson Senior VP, Engineering Netlify People Team Bhavana Srinivas Senior Solutions Engineer Netlify People Team Read more﻿ What if I need an accommodation for the interview? No problem! If you need accommodations for the interviews, please let your recruiter know or contact accommodations@netlify.com Find your dream job Search by Keywords Category AllG&AGTMR&D Find Jobs Showing All Openings 4 Results Job listings at Netlify Job Title Category Location Account Executive Category GTM Location RemoteSenior Infrastructure Site Reliability Engineer Category R&D Location RemoteStaff Infrastructure Site Reliability Engineer (EMEA) Category R&D Location RemoteYour Chance to Join Our Talent Community! Category G&A Location Remote Start a new search or clear filters. Don’t see a position that fits your skill set? No worries! Netlify loves talented, hard working people. We are always collecting the best candidates to consider for future positions. Tell us what you love to do! Apply now'
