["https://netlify.com/code-of-conduct"]
title = "Netlify Code of Conduct | Netlify"
description = "Realize the speed, agility and performance of a scalable, composable web architecture with Netlify. Explore the composable web platform now!"
full_description = "Netlify Code of Conduct Welcome! We strive to make Netlify a friendly, welcoming, judgment- and harassment-free place for individuals to learn, connect, and grow together. As a diverse, global community, we have members from every gender, sexuality, gender expression, race, ethnicity, tribal background, religious affiliation, citizenship and nationality, age, physical ability, educational background, experience level that you can think of - and want everyone to feel welcome at this event, whether attending in person, or virtually via the live stream! It’s not only our hope, but our expectation, that you’ll abide by these three basic ground rules not only at this event, but also at the social events that may take place afterward, or adjacent this or any conference we organize: We approach interactions with thoughtfulness and care. We are patient & kind to others. We don’t dismiss someone because they have a different level of experience, are of a different background, or have a difference of opinion than us. We are respectful when we disagree with someone. There is a human in front of us. We don’t allow frustration to turn into a personal attack. A community where people feel uncomfortable or threatened is not a productive one. We are collectively responsible for each other. We work to correct mistakes when they occur. No one is expected to always be perfect or to know everything - sometimes even good intentions have unwanted outcomes. But how we respond to criticism is important. If someone criticizes our conduct, or points out ways we have harmed someone, we listen without taking it personally, and work towards a resolution - together. We will not tolerate the following: Violent threats or language. Discriminatory or derogatory jokes and language. Disrespecting people’s stated pronouns and gender identity, or current name. Posting sexually explicit or violent material. Posting, or threatening to post, people’s personally identifying information (“doxing”). Insults, especially those using discriminatory terms or slurs. Behavior that could be perceived as sexual attention. Sexual language and imagery Deliberate intimidation, stalking, or following before/at/after official or unofficial events Harassing photography or recording Sustained disruption of talks or other events Inappropriate physical contact Advocating for or encouraging any of the above behaviors. If someone has said or done something that violates this code of conduct, please refer to the Resolving Code of Conduct Violations section below. Resolving Code of Conduct Violations If something has happened that excludes you or is making you have a bad experience, here is what should happen next. Are you safe? If not, get to a safe place. Can you talk to someone you trust about what happened? In the moment Evaluate the situation - is it safe to talk to the person directly about this incident? As soon as possible Try and speak with the person privately, in person if you can. Try and work to a resolution together. If it goes well, great! If it does not go well, please speak to an organizer as soon as you can. If it seems safe or the conversation did not go well, speak to an organizer about what happened as soon as you can. If it does not seem safe or the conversation did not go well, speak to an organizer about what happened as soon as you can. After the fact Organizers are familiar with this Code of Conduct and will take reports of CoC violations seriously. They will ask you details such as: time / place / manner of the alleged violation. whether there were additional witnesses or other people involved. contact or identifying information about the person who allegedly violated the CoC. whether or not you would prefer to have your complaint be kept anonymous in the situation You can help us by giving us as much detail as you can about what occurred. Organizers will work with staff to evaluate what happened, inform the person(s) in question that a violation was reported, and establish next steps. Enforcement This Code of Conduct covers a variety of different spaces of interaction. If you’d like to report a CoC violation that happens… Please speak to any Netlify staff member, who will locate those of us who are trained to take statements. Depending on the severity of the issue, the person may receive a last-chance warning, may be asked to leave the event, or may receive a future ban. In very severe cases, we reserve the right to involve law enforcement should we feel it necessary. Tickets or other participation fees won’t be refunded for people who are removed for CoC violations."
