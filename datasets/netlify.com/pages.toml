["https://netlify.com/oreilly-jamstack"]
title = "Netlify: Develop & deploy the best web experiences in record time"
description = "A powerful serverless platform with an intuitive git-based workflow. Automated deployments, shareable previews, and much more. Get started for free!"
full_description = "Modern Web Development on the Jamstack New Techniques for Ultra Fast Sites and Web Applications by Mathias Biilmann & Phil HawksworthAudiobook now available! Download the eBook or Audiobook Don’t fill this out if you’re human: Business Email First name Last name Organization Company size Please Select 1-10 11-50 51-200 201-500 501-2,000 2,001-5,000 5,000+ UTM Campaign UTM Content UTM Medium UTM Source UTM Term GCLID Send me product news and updates from Netlify Get the eBook or Audiobook Get the comprehensive guide to Jamstack best practices This practical report explains how to run your web projects—from simple sites to complex applications—on the Jamstack, a modern web architecture for deploying fast, secure and highly-scalable sites that don’t require a traditional origin server. With this report, you’ll explore:Methods for solving web development challenges—from bloated legacy architecture to managing microservicesWhy the Jamstack’s cleaner architecture eliminates the need to scale sites up frontHow separating the frontend from your build process makes maintenance easierBest practices for adopting the Jamstack in your organizationA case study that examines how Smashing Magazine applied the Jamstack for commerce, authentication and membership, and publishing at scaleAbout the authors Mathias Biilmann Mathias (Matt) Biilmann is CEO of Netlify, a company he co-founded in 2014 and today is one of the fastest growing web development platforms. He has been building developer tools, content management systems and web infrastructure for more than 30 years and is recognized for coining the term “Jamstack.” An active participant in open source, Matt has contributed to well-known projects in more than a dozen languages at all layers of the stack. Matt grew up in Denmark, where he trained as a musician and music journalist. Phil Hawksworth Phil is Principal Developer Relations Engineer at Netlify. With 25 years of building web applications for companies such as Google, Apple, Nike, and The London Stock Exchange, Phil has worked to challenge traditional technical architectures in favor of simplicity and effectiveness. Key contributors and reviewers Chris Bach Chris Bach is Chief Strategy and Creative Officer and co-founder of Netlify, launched in 2015 and today is one of the most popular web development platforms. Chris is on the Board of the MACH Alliance, is an avid investor in the modern web ecosystem, and sits on a number of advisory boards. Before Netlify he spent 14 years in the agency world as a founder, CEO and Chief Digital Officer. He started Denmark’s first hybrid production agency and won 20+ awards including Cannes Lions, New York Festivals, Eurobest and other competitions. At Netlify he also stands behind jamstack.org and is one of the originators of the Jamstack term. Todd Morey Todd is creative director at Netlify, a passionate user of Jamstack technologies, and one of the early investors in the company. He co-founded The Rackspace Cloud and was creative director at the OpenStack Foundation. Tara Z. Manicsic Tara is a lifelong student, teacher, and maker. She has spent her career using JavaScript on both back-end and frontend to create applications. A Developer Experience Engineer for Netlify, Google Developer Expert, and international technical speaker, she focuses on conveying the codebase she has learned. In her free time she works in her community to educate and learn from other developers."
