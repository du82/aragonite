["https://netlify.com/platform/core/analytics"]
title = "Site Analytics | Netlify Docs"
description = "Monitor trends in site activity without compromising site performance. Learn how to set up our Analytics service and filter data by time span."
full_description = "Welcome HomeGet startedAdd new siteBuild with AI Get help Platform What is Netlify?Who is Netlify for? Checklists How we release Platform primitives Overview Functions Edge Functions Image CDN BlobsCachingDev Server Platform extensions Frameworks Overview Framework support Use environment variables with frameworksFrameworks APIDeveloper tools CLI API Terraform ProviderNetlify SDKCommand PaletteIntegrate & extend Overview Integrations Build Plugins Netlify App for SlackExtend NetlifyConfigure & deploy site Git Environment variables Configure builds Site deploys Domains Static routing Forms Visual editing Visual Editor AI-Assisted PublishingVisual editor referenceManage data Connect Site & team management Accounts & billing Security Monitor sites Site Analytics OverviewHow Site Analytics worksSite Analytics usage & billing Real User MetricsFunction MetricsMonitor buildsLighthouse Logs NotificationsStatus badges Contact Forums Contact support Log in Sign up On this page Get started Charts Filters 30 days filter 7 days filter 24 hours filter Remove Site Analytics Site & team management /Monitor sites /Site Analytics / Site Analytics With Netlify Site Analytics, you can get a deeper understanding of your projects by monitoring trends in site activity. Server-side data collection for Site Analytics complies with the General Data Protection Regulation (GDPR), has no impact on site performance, is not stopped by ad blockers, and does not require any extra configuration. # Get started To enable Site Analytics for your site, go to Metrics > Site Analytics and select Enable Analytics. Once enabled for your site, data collection begins when your site is first deployed rather than starting when you enable Site Analytics. Up to 30 days of historical data will be backfilled in your charts. # Charts Pageviews: instances of your site’s pages being served. Unique visitors: different IP addresses engaging with your site. Top locations: locations where your site has had the most pageviews. Top pages: pages of your site that have had the most pageviews. Top resources not found: resource requests for your site that returned the most 404 errors. Top sources: URLs that generated the most traffic to your site. Bandwidth used: how much data has been served by our CDN for your site. By default, Site Analytics charts are scoped to the last 30 days. Filters are available for other time spans. The Pageviews and Unique visitors charts plot daily metrics. You can examine the charts to explore day-level details. Data for the current day updates hourly. In the Top locations chart, you can examine the map to explore pageview counts for all locations. In the Top pages and Top sources charts, you can select the URL of any source or page to visit it in a new tab. Similarly, in the Top resources not found chart, you can select the URL of any resource to visit the 404 page served for it in a new tab. The Bandwidth used chart plots daily metrics. You can examine the chart to explore day-level details about your site’s bandwidth usage. Data for the current day updates hourly. # Filters Filters allow you to check your Analytics data over the span of 30 days, 7 days, or 24 hours. You can review your Analytics data from the last 30 days in 7-day or 24-hour increments by choosing the 7 days or 24 hours filter and then selecting Previous. # 30 days filter By default, the Analytics page loads all available data for the last 30 days. # 7 days filter To scope Analytics data to the last 7 days, select the 7 days filter. To review data for other 7-day periods within the last 30 days, select Previous. Charts using the 7 days filter plot daily metrics. You can examine the charts to explore day-level details. Data for the current day updates hourly. # 24 hours filter To scope the data to the last day, select the 24 hours filter. Both the range and granularity of the data will update and all data on the page will be scoped to the last day by default. To review data for other 24-hour periods within the last 30 days, select Previous. Charts plot hourly metrics. You can examine the charts to explore hour-level details. Visit our Forums to get inspired, ask questions, and share ideas and feature requests about Netlify Analytics. # Remove Site Analytics To cancel the Site Analytics service for a site, go to Metrics > Site Analytics > Danger zone. Select Cancel Site Analytics service. Site Analytics charts for your site will no longer be available. Last updated: May 10, 2024 How it works → Did you find this doc useful? Your feedback helps us improve our docs. Do not fill in this field What else would you like to tell us about this doc? Send Netlify Careers Blog Terms Privacy Select a theme SystemLightDark © 2025 Netlify"
