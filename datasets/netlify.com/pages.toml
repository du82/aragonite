title = "Netlify’s commitment to protect your data | Netlify"
description = "Accelerate the time to deploy your websites and apps. Bring your integrations and APIs together on one powerful serverless platform. Get started for free!"
full_description = "Netlify’s commitment to protect your dataNetlify is committed to helping users understand the General Data Protection Regulation (GDPR) and California Consumer Privacy Act (CCPA) and to comply with its requirements. We’ve partnered with legal experts in Europe and the US to ensure that our products and contractual commitments are in line with GDPR regulations.We’ll also continue monitoring best practices around GDPR and CCPA compliance and update our commitments if they change. Please see our privacy policy for privacy related information.What rights do I have regarding my information?Residents of the European Union (EU) and California have strong rights related to the use of your data. Netlify chooses to apply these rights to all customers regardless of location.Under EU GDPR, EU residents rights include the following:The right to access – You have the right to request copies of your personal data.The right to rectification – You have the right to request that we correct any information you believe is inaccurate or incomplete. If you have an account with Netlify, you can make some of these corrections directly by logging in to your account.The right to erasure – You have the right to request that we erase your personal data, under certain conditions.The right to restrict processing – You have the right to request that we restrict the processing of your personal data, under certain conditions.The right to object to processing – You have the right to object to our processing of your personal data, under certain conditions.The right to data portability – You have the right to request that we transfer the data that we have collected to another organization, or directly to you, under certain conditions.Under UK GDPR, UK residents rights include the following:The right to be informedThe right of accessThe right to rectificationThe right to erasureThe right to restrict processingThe right to data portabilityThe right to objectRights in relation to automated decision making and profiling.Under CCPA, California residents rights include the following:Request that a business delete any personal data about the consumer that a business has collected.Request that a business that collects a consumer's personal data disclose the categories and specific pieces of personal data that a business has collected about consumers.Request that a business that sells a consumer's personal data, not sell the consumer's personal data. Please note that Netlify does not sell person dataRight to non-discrimination of service or price if you exercise your privacy rights.Data Processing Agreement (DPA)Our DPA is incorporated by reference in Netlify’s terms and conditions.If you want to download a copy for your record, our DPA is available here:Netlify DPA."
