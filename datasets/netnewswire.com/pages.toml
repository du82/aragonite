["https://netnewswire.com/why-write-rss-reader.html"]
title = "NetNewsWire: Why Write an RSS Reader"
description = "We support the open web — and we love high-quality Mac and iOS apps."
full_description = "Why Write an RSS Reader We support the open web. The big social networking sites are damaging society and eroding democracy — and we believe one of the ways out of this is to get our news via the open web rather than from Twitter and Facebook. NetNewsWire is part of repairing the web we lost, and it’s part of building the web we want. That future web should not include viral hate speech, abuse, massive corporate surveillance, or successful influence operations by hostile governments and entities opposed to democracy. NetNewsWire isn’t the answer — it’s an answer. It’s just a small part of what needs to be done. But it’s the work we personally know how to do, so we do it. We also love high-quality Mac and iOS apps, and we hope that NetNewsWire will be an example. The code is available for anyone to learn from and use. We believe it’s one of the largest open source projects written (almost entirely) in Swift."
year_published = 2025
