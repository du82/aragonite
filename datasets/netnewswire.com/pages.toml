["https://netnewswire.com/history.html"]
title = "NetNewsWire: NetNewsWire History"
description = "Timeline about the long history of NetNewsWire, starting in 2002."
full_description = "NetNewsWire History Indie Era May 2002: MacNewsWire 1.0b6 — NetNewsWire’s immediate predecessor — ships 2002 July 12: NetNewsWire Lite 1.0 public beta 2002 September 19: NetNewsWire Lite 1.0 2003 February 11: NetNewsWire 1.0 2005 May 12: NetNewsWire 2.0 NewsGator Era 2005 October 4: NewsGator acquires NetNewsWire Brent takes a job at NewsGator and continues to work on NetNewsWire as lead (and usually only) developer. 2007 June 5: NetNewsWire 3.0 2008 July 10: NetNewsWire 1.0 for iPhone ships on day one of the App Store 2009 September 23: NetNewsWire 2.0 for iPhone 2010 April 3: NetNewsWire 1.0 for iPad 2011 March 2: NetNewsWire Lite 4.0 Black Pixel Era 2011 June 3: NetNewsWire acquired by Black Pixel Brent continues to work at NewsGator for a couple more years. He no longer works on NetNewsWire. 2014: Brent begins work on a new RSS reader for Mac called Evergreen. 2015 September 3: Black Pixel releases NetNewsWire 4.0 Black Pixel also makes versions for iOS and Apple TV 2017 June 1: Brent announces Evergreen Back Home, Open Source Era 2018 August 31: NetNewsWire Comes Home Black Pixel generously returns the name “NetNewsWire” to Brent. Brent renames Evergreen to NetNewsWire. What was to ship as Evergreen 1.0 will now ship as NetNewsWire 5.0. NetNewsWire is free and open source. 2019 August 12: NetNewsWire 5.0 public beta 2019 August 26: NetNewsWire 5.0 2020 March 9: NetNewsWire 5.0 for iOS 2020 September 19: NetNewsWire 5.1 for Mac 2021 March 27: NetNewsWire 6.0 for Mac"
