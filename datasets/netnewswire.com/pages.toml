["https://netnewswire.com/privacypolicy.html"]
title = "NetNewsWire: Privacy Policy"
description = "Our privacy policy explains what information we get and how we use it."
full_description = "Privacy Policy This policy describes the information Ranchero Software and Brent Simmons may receive from NetNewsWire users and how that information is handled. There are two things we do: We gather crash logs from NetNewsWire users who opt in. We log traffic to our website, which we view in aggregate. In other words, we don’t want any private information — except that we want to be able to identify and fix crashing bugs, and we like to know things like how many times the app has been downloaded. Details on these, and other privacy topics, are below. Crash Logs If you opt in to sending crash logs, we will have a copy of your crash logs. If you’re using an App Store version of the app, and you opt in with Apple, then Apple has a copy and we have a copy. If you’re using a Mac version downloaded directly from us, and you opt in, then it’s just us. When NetNewsWire for Mac sends a crash log directly to us, it sends only the text of the crash log. No additional information, such as email address, is sent (though our website logging system — see below — will record some information, including time and IP address). Crash logs are stored privately and are kept confidential. However, we may make significant parts of a crash log available publicly when there‘s no personal identification in that part of the crash log. For example, we might share something like this: Thread 0 Crashed:: Dispatch queue: com.apple.main-thread 0 libsystem_secinit.dylib 0x00007fff6c06689f _libsecinit_setup_secinitd_client + 1393 1 libsystem_secinit.dylib 0x00007fff6c0662cd _libsecinit_initialize_once + 13 2 libdispatch.dylib 0x00007fff6be17dcf _dispatch_client_callout + 8 3 libdispatch.dylib 0x00007fff6be19515 _dispatch_once_callout + 20 4 libsystem_secinit.dylib 0x00007fff6c0662be _libsecinit_initializer + 79 5 libSystem.B.dylib 0x00007fff692639d4 libSystem_initializer + 136 This is entirely for the purpose of fixing crashing bugs. Website Logging Visits to our website — including downloads of the app and of our RSS feeds (including the app-update feed) — are logged via a standard logging mechanism, and this includes IP addresses. Our website logs are confidential and stored privately. We look at the logs in aggregate — for instance, to find how many times NetNewsWire was downloaded on a given day. Other topics Cookies, JavaScript, Ads Neither ranchero.com nor inessential.com use any cookies or JavaScript, and they do not display any ads. Related sites The NetNewsWire GitHub repository does use cookies and JavaScript, because that’s how GitHub works. The repository, including the issue tracker and anything you post there, is public. See GitHub’s privacy policy for more information. The NetNewsWire Slack group also uses cookies and JavaScript, because that’s how Slack works. The group is public: anyone may join. See Slack’s privacy policy for more info. Posting to the GitHub repository and joining the Slack group are optional, opt-in activities. Content in NetNewsWire NetNewsWire displays HTML that comes from feeds from other sites. Some of these sites may do some kind of analytics so that, for instance, they can count how many times a given article in an RSS feed has been read. Refer to the privacy policies of the individual sites for more information. Questions or comments If you have questions or comments about this privacy policy, please contact brent@ranchero.com. This policy is stored in the NetNewsWire GitHub repository, where you can track any changes we might make."
