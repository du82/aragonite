full_description = 'All protocol information on this site is provided in the hope that it will be useful. Some are officially provided by the manufacturers, while others are the result of reverse engineering work. However, UPS hardware is plentiful and varied. Test your software thoroughly, as these documents may not always reflect the reality within your equipment! APC APC’s smart protocol - unofficial decoding work cross-check with APC Smart UPS protocol rendition of the apc-ups protocol documentation project Belkin Belkin’s smart protocol - unofficial decoding work on the Regulator Pro Belkin UPS Protocol - protocol specifications Belkin Universal UPS - courtesy of Peter Selinger CyberPower https://www.cyberpowersystems.com/products/software/mib-files/ CyberPower UPS MIB v2.3 (TXT, 330 KB) CyberPower UPS MIB v2.9 (TXT, 341 KB) CyberPower UPS MIB v2.11 (TXT, 420 KB) Delta Delta UPS v4 SNMP definitions (TXT, 46 KB) Eaton Documents in this section are provided courtesy of Eaton. UPScode II Concept Description (ODT, 50 KB) MGE Office Protection Systems protocol library (serial SHUT, USB and SNMP protocols) EATON (prev. Powerware) XCP protocol: X-format Communications Protocol (XCP) Specification (PDF, 996 KB) XCP Alarm Map (PDF, 54 KB) XCP Meter Map (PDF, 21 KB) EATON SNMP Management Information Base: EATON general SNMP definitions (TXT, 6.7 KB) EATON PowerMIB (XUPS-MIB) (TXT, 71 KB) EATON ePDU G2/G3 (EPDU-MIB) (TXT, 83 KB) EATON ATS (ATS-MIB) (TXT, 19 KB) The MIB module for Eaton ATS (Automatic Transfer Switch) (TXT, 23 KB) The MIB module for Eaton Environment Monitoring Probes (EMP) (TXT, 9.2 KB) The MIB module for "pulizzi" Eaton Monitored ePDUs (Enclosed Power Distribution Units) with blue local display (TXT, 44 KB) The MIB module for "pulizzi" Eaton Switched ePDUs (Enclosed Power Distribution Units) (TXT, 114 KB) The MIB module for "genesis2" Eaton Monitored ePDUs (Enclosed Power Distribution Units) (TXT, 4.5 KB) The MIB module for objects and notifications supported by Eaton’s Toolkit-enabled Power Xpert Gateways (TXT, 18 KB) MGE Pulsar, version 1.7 AE (TXT, 91 KB) The MIB module for "pulizzi" Eaton Switched ePDUs (Enclosed Power Distribution Units) (TXT, 14 KB) The MIB module for Power Distribution Unit by Aphel Ltd. (TXT, 21 KB) Best Fortress protocol - for LI 520, 720, 1020, and 1420 models SOLA/Best Power protocol (Phoenixtec) - courtesy of Invensys Energy Systems Huawei Support of Huawei UPS2000 1/2/3KRT (Modbus RTU) — based on Huawei UPS2000 (1 kVA-3 kVA) Modbus Protocol Development Guide Legrand Documents officially provided by Legrand. Meta System UPS protocol v1.20b (PDF, 420 KB) — for ECO, HF, ALLY HF, MEGALINE and DHEA series Legrand (prev. Meta System) UPS protocol v1.21 (PDF, 264 KB) — for MEGALINE, WHAD, DHEA and ALLY HF series MicroDowell MicroDowell UPS Serial Protocol v3.3.1 (PDF, 225KB) MGE Documents in this section are provided courtesy of MGE Office Protection Systems, and formerly MGE UPS SYSTEMS. These have been mirrored from their their web server. The Utalk (legacy ASCII protocol) documents only applies to MGE UPS SYSTEMS. MGE UPS SYSTEMS SNMP MIBS descriptions (PDF, 78 KB) MGE USB Devices Draft AA - official MGE HID UPS data (PDF, 310 KB) Simplified SHUT protocol (PDF, 63 KB) U-Talk protocol general specifications (PDF, 104 KB) U-Talk command set specifications (PDF, 288 KB) U-Talk basic command set for UPS single monitoring communication (PDF, 7 KB) ONEAC ONEAC serial information - protocol specification Opti-UPS Opti-UPS protocol - more guesswork Powercom (PCM) All these document are officially provided by Powercom USB information for BNT series USB information for IMPERIAL series USB information for SKP series USB information for WOW series Some information is also available on their site and mirrored with NUT: USB HID protocol implementation (mirror) Serial Megatec Qx variant protocol implementation (mirror) PowerKinetics PowerKinetics MiniCOL protocol - courtesy of PowerKinetics technical support Riello All these document are officially provided by Riello GPSER protocol Sentry HPS / HTS protocol UPS protocol list Salicru Serial comm protocol used with Twin Pro2 700VA – 3KVA series UPS (a Megatec Qx dialect) VNATA vnata UPS Communication Protocol 1K~3K (a Megatec Qx dialect) Standard protocols SEC SEC protocol - superset of the US9003, below SEC UPS Standard Protocol - protocol specification SEC Standard UPS Communication interface - details of SEC communication interface US9003 UPS Communication Interface SNMP Documents in this section are provided courtesy of various manufacturers. IETF Management Information Base: UPS MIB (RFC 1628) (TXT, 64 KB) fixed UPS MIB (RFC 1628) (TXT, 45 KB) APC Management Information Base: UPS MIB (PowerNet) (TXT, 484 KB) MIB description (PDF, 998 KB) Delta Management Information Base: Delta UPS v4 SNMP definitions (TXT, 46 KB) MGE Management Information Base: UPS MIB (MGE-MIB) (TXT, 76 KB) MIB description (PDF, 78 KB) EATON Management Information Base: EATON general SNMP definitions (TXT, 6.7 KB) EATON PowerMIB (XUPS-MIB) (TXT, 71 KB EATON ePDU G2/G3 (EPDU-MIB) (TXT, 79 KB) EATON ATS (ATS-MIB) (TXT, 19 KB) HP/Compaq Management Information Base: HP/Compaq Power MIB (TXT, 68 KB) HP/Compaq UPS MIB (TXT, 24 KB) Offsite links Liebert MIBs Best Power MIB USB/HID Power Devices Class Power Device Class Document 1.0 library page Currently published revision of USB Usage Tables for HID Power Devices (offsite PDF, 981 KB) Various Megatec UPS Protocol Voltronic Power Voltronic Power UPS Protocol - unofficial decoding work Voltronic Power - ‘QS’ Protocols External SNMP MIB collections https://github.com/librenms/librenms/tree/master/mibs'
