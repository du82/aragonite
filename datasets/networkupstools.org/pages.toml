["https://networkupstools.org/docs/FAQ.html"]
title = ""
full_description = 'Drivers are occasionally removed from the tree if they are no longer receiving maintenance, or sometimes renamed to better reflect their hardware support scope or replaced by a more generic driver. There have been several architectural changes to the driver code in recent times, and drivers which were not converted by someone are eventually dropped. This is called progress. We do this in order to avoid a situation where someone believes that a driver is being maintained when it is actually rotting slowly in the tree. It also keeps the tree free of old compatibility hacks for code that nobody actually uses anyway. To get a driver back into current releases, you need to convert it yourself or get someone to do it for you. This is not difficult. The hardest part of any driver is decoding the protocol, and that’s already been done in the old version. The drivers drop root privileges long before the serial or USB port is opened. You’ll need to change the permissions on that port so that their new user id can access it. Normally this is nobody, but it may be changed at compile-time by using configure --with-user or in the ups.conf file for driver settings with user=.... Now is a good time to point out that using nobody is a bad idea, since it’s a hack for NFS access. You should create a new role account (perhaps called ups or nut), and use that instead. Also, scroll down to the "security domains" question to see an even better way of restricting privileged operations. Neither the drivers nor upsd ever need root powers, and that answer tells you how to make it work. You can also specify a user with user= in the global part of ups.conf(5). Just define it before any of your [sections]: In this case, "access denied" means the access to upsd(8), not the device communication port. You’re being denied since the system has no permission to speak to upsd according to its access controls. Verify your LISTEN directive. It should be one of the valid IP addresses for the computer running upsd (or 0.0.0.0, which is INADDR_ANY), not an address for a client.'
year_published = 2025
clearnet = "https://networkupstools.org/docs/FAQ.html"
