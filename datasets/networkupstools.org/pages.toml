full_description = 'User Documentation FAQ - Frequently Asked Questions (online) (PDF) NUT User Manual (online) (PDF) Cables information (online) (PDF) User manual pages Devices Dumps Library (DDL): Provides information on how devices are supported; see also the HCL Notes on NUT monitoring of USB devices in Solaris and related operating systems NUT Configuration Examples book maintained by Roger Price NUT GitHub Wiki Developer Documentation NUT Developer Guide (online) (PDF) NUT Packager Guide (online) (PDF) NUT Release Notes (online) (PDF) NUT Change Log (online) (PDF) UPS protocols library Developer manual pages NUT Quality Assurance Devices Dumps Library (DDL): Provides simulation data to the driver Data dumps for the DDL Note: both developers contributing a driver and users using an existing driver for device not previously documented as supported by it, are welcome to report new data for the Devices Dumps Library (DDL) mentioned above. Best of all such "data dump" reports can be prepared by the tools/nut-ddl-dump.sh script from the main NUT codebase, and reported on the NUT mailing list or via NUT issues on GitHub or as a pull request against the NUT Devices Dumps Library following the naming and other rules described in the DDL documentation page. Data dumps collected by the tools above, or by upsc client, or by drivers in exploratory data-dumping mode (with -d 1 argument), can be compared by tools/nut-dumpdiff.sh script from the main NUT codebase, which strips away lines with only numeric values (aiming to minimize the risk of losing meaningful changes like counters). Offsite Links These are general information about UPS, PDU, ATS, PSU and SCD: UPS HOWTO (The Linux Documentation Project) UPS on Wikipedia PDU on Wikipedia Automatic Transfer Switch Power Supply Units Solar controller on Wikipedia UPS on The PC Guide These are writeups by users of the software. NUT Configuration Examples and helper scripts (Roger Price) (sources replicated in NUT GitHub organization as ConfigExamples, TLS-UPSmon, and TLS-Shims) Deploying NUT on an Ubuntu 10.04 cluster (Stefano Angelone) Monitoring a UPS with nut on Debian or Ubuntu Linux (Avery Fay) Installation et gestion d’un UPS USB en réseau sous linux (Olivier Van Hoof, french) Network UPS Tools (NUT) on Mac OS X (10.4.10) (Andy Poush) Interfacing a Contact-Closure UPS to Mac OS X and Linux (David Hough) How to use UPS with nut on RedHat / Fedora Core (Kazutoshi Morioka) FreeBSD installation procedure (Thierry Thomas, from FreeBSD) Gestionando un SAI desde OpenBSD con NUT (Juan J. Martinez, spanish) HOWTO: MGE Ellipse 300 on gentoo (nielchiano) Cum se configurează un UPS Apollo seria 1000F pe Linux (deschis, Romanian) Install a UPS (nut) on a Buffalo NAS (various authors) NUT Korean GuideBook (PointBre) USB UPS, notifications, and Home Assistant (James Ridgway) PowerWalker UPS on Fedora Server 36 (Michael Hirschler) Video articles are also available: Network UPS Tools (NUT Server) Ultimate Guide (Techno Tim) News articles and Press releases Linux UPS Without Tears (A. Lizard) Graceful UPS shutdowns on Linux (Carla Schroder)'
