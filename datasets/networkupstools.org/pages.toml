["https://networkupstools.org/acknowledgements.html"]
title = "Network UPS Tools - Acknowledgements"
description = "Power Devices support"
full_description = "The situation has evolved, and since 2011 Eaton does not support NUT anymore. This may still evolve in the future. But for now, please do not consider anymore that buying Eaton products will provide you with official support from Eaton, or a better level of device support in NUT. If a company or individual isn’t listed here, then we probably don’t have enough information about the situation. Developers are kindly requested to report vendor contributions to the NUT team so this list may reflect their help, as well as convey a sense of official support (at least, that drivers were proposed according to the know-how coming from specs and knowledge about hardware and firmware capabilities, and not acquired via reverse engineering with a certain degree of unreliability and incompleteness). If we have left you out, please send us some mail or post a pull request to update this document in GitHub."
