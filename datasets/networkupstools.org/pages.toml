["https://networkupstools.org/stable-hcl.html"]
title = "Network UPS Tools - Hardware compatibility list"
description = "Power Devices support"
full_description = 'Before you buy, take a look at the Acknowledgements for information about which drivers are developed with the support of the manufacturer. Be sure to also read the footnotes. For a list of user-reported dumps of NUT-supported devices, go visit the Devices Dumps Library. If your device isn’t listed First, if there are other models by the same manufacturer, try their drivers. You may find that it "just works" or mostly works. In either case, send in a report so this list and the driver can be improved. Next, if you don’t find any match, there are a few drivers that have a good chance of working on random hardware. These are indicated in the Various entries above. After doing that, if those aren’t working, you might try running other ones from the set to see if anything works. Sometimes you get lucky. Finally, if absolutely nothing works and your cabling is OK, try contacting the list and we will see what we can do for you. In general, if a driver does not exist, that’s due to the lack of overlap between the set of developers and the set of owners of that hardware. The way to fix it is to turn a developer into an owner, or an owner into a developer. Report new devices, omissions or errors There are a lot of power devices hardware for sale, and it’s possible that we have missed listing some that are supported, or made an error. So that this list can be as accurate as possible, please report any omissions to the NUT Developers mailing list or the NUT issue tracker on GitHub, including the following information: mail subject: [HCL] <Manufacturer> <Device> supported by <driver> or tag the issue "HCL" and title it: <Manufacturer> <Device> supported by <driver> replacing Manufacturer, Device and driver by your specific values, mail or issue body: Device manufacturer and name, upsc output (upsrw and upscmd outputs are also welcome), shutdown sequence testing results: a statement that you have actually tested it successfully is enough for now, a link to the manufacturer’s online description of the device is also appreciated. Linking to the HCL You can create a direct link to the HCL, specifying some filters within the URL (JavaScript must be enabled in the browser for this to work). This allows you to select devices that matches some specific criteria, like a connection type or a manufacturer. All filters available on the page itself are also available for use in the URL. The form of the URL is the following: https://www.networkupstools.org/stable-hcl.html?<filter-name>=<filter-value> Table 1. Possible values <filter-name> <filter-value> support-level a number from 1 to 5 device-type ups for uninterruptible power supply pdu for power distribution unit psu for power supply unit scd for solar controller device manufacturer a manufacturer name from the selection list model a model name from the selection list connection USB Serial Network You can combine multiple filters, using ampersand (&). For example, if you only want to select USB units from Eaton, use: https://www.networkupstools.org/stable-hcl.html?manufacturer=Eaton&connection=USB'
year_published = 2025
clearnet = "https://networkupstools.org/stable-hcl.html"
