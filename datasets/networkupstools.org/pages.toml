full_description = '''Dell__UPS_Tower_1920W_HV__snmp-ups__2.6.0__01.dev Dell__UPS_Tower_1920W_HV__snmp-ups__2.6.0__01.seq Eaton__9395_550KVA__bcmxcp__2.4.3__01.nds Eaton__ePDU_Managed_Aphel__snmp-ups__2.6.1__01.dev HP__RT3000_1fe5__usbhid-ups__2.6.3__01.dev #RW:<var.name>:STRING:<length> Note that, since the length of RW STRING variables wasn’t published by upsrw before 2.7.1, you can omit it and the preceeding colon, i.e: #RW:<var.name>:STRING <var.name>: <value> #COMMENT: <comment> #RW:<var.name>:STRING:<length> #COMMENT: <comment> #RW:<var.name>:RANGE:"<min>" "<max>" #COMMENT <comment> #RW:<var.name>:ENUM:"<enumerated value>"#COMMENT: <comment> #CMD:<command.name> #COMMENT: <comment> (don’t forget the leading hash in RW and CMD lines) Note that the colon after #COMMENT is not mandatory. <var.name>: <value> #COMMENT: <comment> #RW:<var.name>:STRING:<length> #COMMENT: <comment> #RW:<var.name>:RANGE:"<min>" "<max>" #COMMENT <comment> #RW:<var.name>:ENUM:"<enumerated value>"#COMMENT: <comment> #CMD:<command.name> #COMMENT: <comment> # <var.name>:COMMENT: # <comment> # ... # <comment> # <var.name>:EOC (The trailing colon after :COMMENT or :EOC is not mandatory.) e.g.: # battery.charge:COMMENT: # The values reported by NUT are all bogus, I keep getting something like this: # # ---- # battery.charge: -1 # battery.charge: -10 # ---- # # and so on.. # # Should I start finding rainbows or a whole universe where unicorns rule the world to get it working? # battery.charge:EOC # battery.charge:COMMENT: # The values reported by NUT are all bogus, I keep getting something like this: # # ---- # battery.charge: -1 # battery.charge: -10 # ---- # # and so on.. # # Should I start finding rainbows or a whole universe where unicorns rule the world to get it working? # battery.charge:EOC # <command.name>:COMMENT: # <comment> # ... # <comment> # <command.name>:EOC (The trailing colon after :COMMENT or :EOC is not mandatory.) e.g.: # shutdown.return:COMMENT # Why doesn't this command work? # # For my continued misery of course! # shutdown.return:EOC'''
