full_description = 'APC 940-0024C clone From D. Stimits The original 940-0024C diagram was contributed by Steve Draper. 940-0024E clone Reported by Jonathan Laventhol This cable is said to use the same wiring as 940-0024C clone. 940-0024C clone for Macs From Miguel Howard Belkin OmniGuard F6C***-RKM From "Daniel" A straight-through RS-232 cable (with pins 2-7 connected through) should work with the following models: F6C110-RKM-2U F6C150-RKM-2U F6C230-RKM-2U F6C320-RKM-3U Eaton Documents in this section are provided courtesy of Eaton. MGE Office Protection Systems The three first cables also applies to MGE UPS SYSTEMS and Eaton. DB9-DB9 cable (ref 66049) This is the standard serial cable, used on most units. DB9-RJ45 cable This cable is used on the more recent models, including Ellipse MAX, Protection Station, … NMC DB9-RJ45 cable The following applies to the MGE 66102 NMC (Network Management Card), and possibly other models. The NMC connection is an 8P8C RJ45-style jack. Signal PC NMC 1,4,6 TxD 2 3 RxD 3 6 GND 5 4 7,8 shield shield USB-RJ45 cable This cable is used also on the more recent models, including Ellipse MAX, Protection Station, … DB9-RJ12 cable This cable is used on some older Ellipse models. Powerware LanSafe SOLA-330 Just uses a normal serial cable, with pin 1-1 through to 9-9. HP - Compaq Older Compaq UPS Family This cable can be used with the following models: T700, T1000, T1500, T1500j, T700h, T1000h, T1500h, R1500, R1500j, R1500h, T2000, T2000j, T2400h, T2400h-NA, R3000 / R3000j, R3000h, R3000h-International, R3000h-NA, R6000h-NA, R6000i, R6000j. UPS PC 9 pin connector 1 --------- 3 2 --------- 2 4 -\ 4 --------- 5 | 6 -/ 6 --------- 7 Contributed by Kjell Claesson and Arnaud Quette. Phoenixtec (Best Power) Many Best Power units (including the Patriot Pro II) have a female DB-9 socket with a non-standard pinout. Signal PC UPS 1,4,6 NC TxD 2 2 RxD 3 1 GND 5 4 7,8 NC Sources: http://pinoutsguide.com/UPS/best_power_pinout.shtml http://lit.powerware.com