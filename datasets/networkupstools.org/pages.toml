["https://networkupstools.org/docs/user-manual.chunked/NUT_Security.html"]
title = "10. Notes on securing NUT"
full_description = 'Many internal and external mechanisms exist to secure NUT. And several steps are needed to ensure that your NUT setup meets your security requirements. This chapter will present you these mechanisms, by increasing order of security level. This means that the more security you need, the more mechanisms you will have to apply. You may want to have a look at NUT Quality Assurance, since some topics are related to NUT security and reliability. As of NUT 2.8.0, a new release key is used, but the nut-key.gpg should be cumulative with older chain key files (includes them). You can view the key list in a downloaded copy of the URL above with: …and as of this writing, it should contain two key sets for various identities of "Arnaud Quette" and one set of "Jim Klimov". Just in case, the previous key file used since NUT 2.7.3 release is stored as NUT old maintainer’s signature for 2.7.3-2.7.4 releases In order to verify an even older release, please use NUT old maintainer’s signature since 2002 until 2.7.3 release You should see a message mentioning a "Good signature", with formatting which depends on your gpg version, like: As a weaker but simpler alternative to verifying a signature, you can verify just the accompanying checksums of the source archive file. This is useful primarily to check against bit-rot in original storage or in transit. As far as disclaimers go: ideally, you should cover all provided algorithms — e.g. MD5 and SHA256 — to minimize the chance that intentional malicious tampering on the wire goes undetected. A myriad tools can check that on various platforms; some examples follow: All configuration files should be protected so that the world can’t read them. Use the following commands to accomplish this: Finally, the state path directory, which holds the communication between the driver(s) and upsd, should also be secured. Administrative commands such as setting variables and the instant commands are powerful, and access to them needs to be restricted.'
year_published = 2025
clearnet = "https://networkupstools.org/docs/user-manual.chunked/NUT_Security.html"
