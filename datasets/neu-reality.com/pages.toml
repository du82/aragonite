["https://neu-reality.com/2019/02/holobionts"]
title = "演化让微生物与我们成为一体？ – 神经现实"
description = "当个体是宿主及其微生物群落组成的生态系统时，适者生存是如何进行的？生物学家正在争论是否应当修正演化论。"
full_description = "黄昏降临在坦桑尼亚平原上。天空的紫色更深了，一条雌斑鬣狗独自醒来。它巡视着家族领地，用尾下的酸味粘性物划出界限。它试图从微风中嗅出发情雄性的气味，而无视了前夜的残羹令肚子发出的咕咕声和身侧的瘙痒。这只形单影只的鬣狗正在为了生存而选择接下来的行动。 但它并不孤独。它分泌的粘性物并不仅仅是它自己的功劳，也归功于成千上万居住在它香腺中的细菌。微风中潜在异性的气味也来自于独特的微生物群。它肠道里的各种细菌帮助它消化食物，还有一些细菌则帮助它的免疫系统抵御寄生虫和病菌对皮肤和其他组织的入侵。 那么，在坦桑尼亚平原上挣扎求生的究竟是谁？应当把斑鬣狗和它体内的微生物分开看待吗？它们的相互作用是否形成了一种新的形式，超越了它们独立的存在？ “几十年甚至几个世纪以来，我们都低估了微生物对个体特征的潜在贡献，” 韦恩州立大学的微生物学家凯文·泰斯（Kevin Theis）说，他研究帮助鬣狗分泌黏液的微生物，“如果决定重要特征的基因是来自于微生物而非动物本身，那么我们需要采取系统的观念，将宿主-微生物系统看作一个整体。” 仔细观察任一动植物，你都会发现一大群细菌、真菌、病毒，它们形成了一个复杂而相互关联的生态系统。近期激增的一系列研究展示了我们如何高度依赖这些微生物来维持身体机能，为“何为个体”这一课题带来了众多疑问。 消化和免疫等生命功能长久以来都被认为是在自然选择，即差异化生存繁衍作用下，在单个有机体范围内发展和完善的。但如果我们的身体不是由同种细胞独裁统治，而是多种细胞的联合国，我们又该怎么解释它们的演化呢？ 一些生物学家呼吁对演化论进行全面升级，称过去由研究更大、更易理解的生物而发展出来的想法已经过时了。另一些人则认为现存理论只是需要更谨慎地使用。所有人都同意，宏观和微观世界不可避免地相互依赖，而生物学家必须探索其相互关系的前沿。"
author = "Jonathan Lambert"
year_published = 2019
year_updated = 2019
