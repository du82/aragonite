["https://neu-reality.com/2019/06/disorder"]
title = "为无序辩护 – 神经现实"
description = """
关于作者

Alan Lightman
-                                 
小说家、散文作家和物理学家，MIT 人文实践教授。著有 Einstein’s Dreams、In Praise of Wasting Time 等。现居波士顿。"""
full_description = "在印度南嘉寺（Namgyal monastery）有一种仪式，佛教僧侣会在仪式中创作图样精美复杂的彩色沙画曼陀罗（mandalas）。每一幅曼陀罗的直径长达三米，如此巨作需要耗时数周才能完成。作画期间，几个身着橘袍的僧侣们弓着身子跪在一个平台上，刮擦金属小瓶。沙子从小瓶的细孔中喷出，一次只有几颗沙，落入由粉笔准确勾勒的区域里。慢慢地、慢慢地，古老的图案绘制成了。等到大功告成，僧侣们念一段经，停留一小会儿，然后五分钟内把沙画全部抹掉。 虽然我没有亲眼看到过这个仪式，但是我在东南亚旅游的时候见过不少曼陀罗。在佛教里，曼陀罗的创造和毁灭象征了尘世的无常。这一仪式也让我想起有序（order）和无序（disorder）在世界核心玄妙的共生关系。 有些出人意料的是，无序不只是存在于大自然，无序更是大自然的养料。植物、星星、生命甚至时间之矢都依赖着无序。我们人类也一样——尤其是当我们把随机性、新奇性、自发性、自由意志和不可预测性等概念与无序捆绑在一起的时候。或许我们可以把这些概念都归类为超自然的。与无序对立的有序，则与系统、规律、理由、理性、模式、可预测性等概念相近。虽说这两个概念集的关系不像黄昏与黎明那样对应，但它们也有许多共通之处。 从现代美学就能看出，我们本能地被有序和无序同时吸引着。我们喜欢事物具有对称性与有规律可循的模式，但我们也渴望一点不对称。英国艺术史家恩斯特·贡布里希（Ernst Gombrich）认为，虽然人类心理在深层次上偏爱有序，但绝对有序的艺术却很无趣。“无论我们怎么分析规则与不规则之间的区别，”他在1979年的《秩序感》中写道，“我们最终不得不解释审美经验中最基础的事实——愉悦感总是介于乏味和困惑两者之间。”当太多有序的事物摆在面前，我们就不再感兴趣。而太多的无序，也无法让人感兴趣。我妻子是个画家，她习惯在画布的一角抹上一道色彩来打破平衡，好让作品更吸引人。可见，我们的视觉甜点（sweet-spot）介于乏味与困惑之间，介于可预测性和陌生感之间。"
author = "Alan Lightman"
year_published = 2019
year_updated = 2019
