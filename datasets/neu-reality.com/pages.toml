title = "我们的大脑会掷硬币吗？来聊聊决策的神经机制 – 神经现实"
description = """
关于作者

杨天明
-                                 
中科院神经科学研究所、脑科学与智能技术卓越创新中心研究员。曾获得中科院百人计划、上海市浦江人才计划等支持。复旦大学生物化学学士，美国贝勒医学院神经科学博士。从事大脑的抉择和认知的神经机制研究以及大脑的人工神经网络模型研究20多年，曾在Nature、Neuron等杂志发表多篇第一或通讯作者论文，对我们了解由大脑前额叶以及后顶叶等高级脑区所组成的神经环路在抉择和认知过程中所起到的作用作出了重要贡献。"""
