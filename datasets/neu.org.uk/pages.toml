title = "Pride | National Education Union"
description = "The NEU actively takes part in LGBT+ Pride events across the country. Here you can find out how to join other NEU members at Pride events."
full_description = 'We believe in LGBT+ inclusion and we value LGBT+ educators’ vital role in our education system. Our campaign, ‘Inclusion not Exclusion’, calls for a strong defence of LGBT+ education and support for our LGBT+ educators.Together, we believe we can win a better education system for all.Find an eventOrder Pride crates Breadcrumbs Home Advice Equality LGBT+ equality Pride Pride The NEU actively takes part in LGBT+ Pride events across the country. Here you can find out how to join other NEU members at Pride events. In this section Show sidebar Pride Trans inclusion toolkit NEU statement on transphobia Supporting trans and gender questioning students We believe in LGBT+ inclusion and we value LGBT+ educators’ vital role in our education system. Our campaign, ‘Inclusion not Exclusion’, calls for a strong defence of LGBT+ education and support for our LGBT+ educators.Together, we believe we can win a better education system for all.Find an eventOrder Pride crates Find your nearest Pride event and join fellow NEU members: #can_embed_form.can_768 #can_main_col, #can_embed_form.can_768 #can_sidebar {float:none!important;width:100%!important;} #event_desc, #logo_wrap, #action_info{display:none!important} What’s a ‘Pride Crate’? It’s a box of materials you can order via your district that has everything you need. See the ordering form. Where’s my nearest pride event and when is it happening? Check out this list of Pride events taking place in England, Wales, and Northern Ireland. Decide what you want to do and resources you need Do you want to march? Do you want a stall? Do you want both? Make some preliminary decisions, including where you will want people to meet and what time, and then have a think about what resources you need. Identify how you book a place in the march and/or a stall. Contact your district secretary with a plan, detailing any costs and ask them if its agreeable. Use this page to order your pride materials. Promote your pride event Use our LGBT+ educators events system to host your online RSVP page. It’s super easy to use, you just put the details of your event in the system, create an account and authenticate by responding to a confirmation email that’s sent to you. Always check your spam.This means you have a unique online page which tells people what’s going on and gives the ability to RSVP. Check out this example.After you’ve got your RSVP page set up, go online, and promote it in any NEU Facebook or WhatsApp groups. Ask your district secretary to email details out to members. If you build it, they will come! Build a pride team Develop a plan for the day with those who have RSVPed. Make them feel part of a team and think about creating a special WhatsApp group. Ordering materials for LGBT+ activities and Pride events Stall boxescost is £275 plus delivery and contain the following:350 Leaflets, 120 pin Badges, 60 A4 sheet stickers, 60 Fans10 pride T-shirts (various sizes S, M, L, XL & XL), 60 Tote bags, 60 Lanyards, 10 Flags1 Banner and 5 placards (various designs)March boxescost £330 plus delivery and contain the following:350 Leaflets, 120 pin Badges, 60 A4 sheet stickers, 60 Fans, 60 Flags (with sticks)10 pride T-shirts (various sizes S, M, L, XL & XL), 60 Tote bags, 60 Lanyards1 Banner and Stick, 20 placards (various designs)We have a limited stock of special edition NEU Pride Tablecloths which are available for £50 via the NEU shop here.Please allow up to 7 working days before your event to ensure the box arrives in good time.This form will close in July and reopen in September (no orders processed over August).If you have any questions about Pride: email [email protected] Pride crates <div class="antibot-no-js antibot-message antibot-message-warning">You must have JavaScript enabled to use this form.</div> Current Order details Delivery details Authorisation Complete First name Surname Membership number Email address Phone number Once the order is received, it will reviewed and despatched within 7 working days of your order submission Materials required Crate orders are limited to a maximum of two per District. March crate£330+ £15 P&P tracked deliveryContents:Give-away itemsLeaflets, 120 pin Badges, A4 sheet stickers, 60 Fans, 60 Flags (with sticks)Members only items10 pride T-shirts (various sizes S, M, L, XL & XXL), 60 Tote bags, 60 LanyardsEvent specific items1 Banner and Stick, 20 placards (various designs) March crate Number of crates required Stall crate£275 + £15 P&P tracked deliveryContents:Give-away itemsLeaflets, 120 pin Badges, A4 sheet stickers, 60 FansMembers only items10 pride T-shirts (various sizes S, M, L, XL & XXL), 60 Tote bags, 60 Lanyards, 10 FlagsEvent specific items1 Banner and 5 placards (various designs) Stall crate Number of crates required Tablecloth£60 Tablecloth Extra t-shirts10 for £60 tshirt Extra lanyards50 for £25 lanyard Extra fans50 for £12 fan Leave this field blank'
