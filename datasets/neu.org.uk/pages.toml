["https://neu.org.uk/advice/classroom/send"]
title = "SEND | National Education Union"
description = "Building inclusion in schools and colleges."
full_description = "Inclusion challengesThe NEU wants the Government to address these 5 immediate challenges on inclusion:Needs led funding – for SEND support, Education, Health and Care (EHC) plans and local SEND and mental health services. A strategy to reduce Special Educational Needs Coordinator (SENCO) workload. Support staff numbers must be maintained and increased. Time for staff planning, family liaison and CPD. DFE must support knowledge exchange and professional skills around inclusion across all curriculum subjects. The following goals can build positive experiences for learners with SEND:Every child/young person attends a school/college with an inclusive ethos. Every student is assessed early and regularly for learning and social and emotional needs and appropriate support can be provided. Every child/young person has a strong relationship with a trusted adult in school/college. Parents/carers are engaged partners. Safety Valve and Delivering Better ValueThe Plan produced by the government seeks to work with local authorities and schools on money-saving projects designed to ensure more SEND students are educated in mainstream without first putting the support mechanisms in place for this to work. Elements of the Improvement Plan, including a National Standard and an electronic EHCP template are being piloted but little information about their impact has been shared by the DfE.If you are in a school or LA piloting any of the Improvement Plan proposals, please let us know how they are affecting your workload and impacting support for SEND students. Have your say on SEND The Education Select Committee are calling for evidence on 'Solving the SEND Crisis' and want to hear about what works well in your workplaces. Have your say The Call for Evidence lists a range of questions on:Support for children and young people with SEND.Current and Future model of SEND provision.Finance, funding and capacity of SEND provision.Accountability and inspection of SEND provision.To respond you don't have to answer all of the questions, but your points should relate to the terms of reference listed. Please consider submitting your views and evidence of your experience around what would make things better for staff and the SEND students you work with everyday. You could do it as a workplace union group or as an individual.The Union will be sending in a response addressing all of the questions with our evidence but MPs on the committee also need to hear about the everyday practice in your school or college.Add your evidence"
year_published = 2025
