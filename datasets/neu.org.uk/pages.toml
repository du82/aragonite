["https://neu.org.uk/advice/classroom/teaching-resources/supporting-language-development"]
title = "Supporting language development | National Education Union"
description = "Classroom resources on key actions to aid language development in school."
full_description = "Many people take communication for granted, but for some children communicating is difficult. Language is used to teach a lesson and explain tasks and pupils are required to use language to extend, clarify and consolidate ideas.Our new resources produced with Speech and Language UK, the speech and language specialists, aim to assist classroom teachers and support staff in supporting children and young people's language and communication skills.Due to the Covid-19 pandemic, the number of children and young people with speech, language and communication difficulties increased.Without being a replacement for expert support, the leaflets outline key actions that schools can take to enhance all children's communication as well as provide effective support for those who need a more targeted approach. They include tips for understanding language progression as well as signposting to resources.Members should seek advice from their mentor, Head of Year or SENCO where they have concerns about a student's speech, language and communication development or progress. Language development in Early Years Produced by Speech and Language UK/NEU: 4 key things you can do to enhance early years school children’s communication. Language development in primary years Produced by Speech and Language UK/NEU: 4 key things you can do to enhance primary school children’s communication. Language development in secondary years Produced by Speech and Language UK/NEU: 4 key things you can do to enhance secondary school children’s communication."
