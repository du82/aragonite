["https://neu.org.uk/advice/classroom/teaching-resources/full-story/chapter-books-and-non-fiction"]
title = "Chapter books and non-fiction | National Education Union"
description = """
The Twitches Meet a Puppy is the third in a series of books about Stevie who owns a doll’s house occupied by four toy bunnies. Unbeknownst to their owner, they come to life whenever her back is turned. So begins two parallel narratives about the disruption caused to the household when Stevie’s dad moves in to look after her while mum is away working. Along with dad comes his husband, Stuart, and Stuart’s new puppy who brings mayhem in his wake.

The real joy of this story lies in the fact that the inclusive elements – dad’s husband; Stevie’s mixed-heritage friend, Eshe; Stuart’s prosthetic leg – are very clearly shown but never remarked upon. We only know that Stuart has a disability because it is apparent in the illustrations. No one in the story, it seems, deems any of these relationships or identities worthy of comment. Implicit inclusion at its best.

The book is probably best suited to Year 3 and 4 readers and is one of a relatively new but very popular genre of highly illustrated chapter books."""
full_description = "As with previous resources in this series, we have concentrated primarily on picture books for a variety of ages. However, it is important that children can also find chapter books and non-fiction that feature Disabled characters. Here are four books suitable for KS2 readers of varying confidence Some popular children’s titles can be problematic (see the Introduction for more on this). We have avoided books focusing on bullying or about Disabled people overcoming seemingly insurmountable obstacles. Of course, bullying narratives are important, but they are unlikely to aid inclusion when they focus on already marginalised groups. And books about extraordinary achievements generally have little to do with the everyday lives of most children and young people. The Twitches Meet a Puppy by Hayley Scott and Pippa Curnick. A Storm of Strawberries by Jo Cotterill. Running on Empty by S. E. Durrant. I Am Not a Label by Cerrie Burnell and Lauren Baldo. We have focused here on positive stories in which the protagonists have real agency. There are challenges and, as in life, not all of them are overcome but all the characters in these stories are defined by their interests rather than their disabilities or other people’s attitudes towards them."
