["https://neu.org.uk/about/nations/neu-northern-ireland/teachers-time-budget-arrangements/understanding-your-teachers-time-budget-northern-ireland"]
title = "Understanding your teacher’s time budget in Northern Ireland | National Education Union"
description = """
Every teacher must be provided, through consultation with their principal, an agreed, individual time budget which incorporates all their tasks, duties, and responsibilities.

Everything you are directed to do must be reasonable and capable of being carried out during normal contractual hours (1265) i.e. within the working day (Directed Time).

This is confirmed by TNC 2020/1 Advice on Developing Directed Time Budgets."""
full_description = "All teachers in NI should have had an agreed time budget in place since the end of October 2020 – that deadline has passed! Time Budgets were a key part of the 2020 Pay and Workload Agreement where all parties agree to a series of measures to address teacher concerns about workload and accountability. Key Point of the Agreement are: Teachers’ Hours (Directed Time) are: 195 days per year (non-teaching days should be reasonably contiguous with teaching days) and no more than 190 days teaching children up to 1,265 hours per year. Class Contact Time is: part of Directed Time up to 23.5 hours per week (post primary) (893 hours per annum) and includes of cover. Planning, Preparation and Assessment (PPA): Directed Time includes time set aside for PPA The Pay & Workload Agreement guarantees that 10% of Directed Time (126.5 Hours per annum) is set aside for PPA Dedicated PPA time enables teachers to raise standards through individual and collaborative professional activity. Play video Guide on what to expect from your time budget and includes advice for part time and supply teachers. Time budgeting guide (Northern Ireland) NEU-NI guide and checklist to support time budgeting, including a summary of checks you should do. Time budget calculator (Northern Ireland) NEU NI directed time budget spreadsheet calculator to help you ensure that all directed time, and your duties, are included in the maximum 195 days and 1265 hours that you are contracted to work. School calendar calculator (Northern Ireland) Part-time teachers in Northern Ireland should use this calculator to ensure you are not working beyond your allocated pro rata days. Teachers’ time budget arrangements No teacher in Northern Ireland should be directed to work more than 32.4 hours in a single week. Directed time A directed time calendar is important to ensure teachers’ hours are reasonable and is standard practice within the profession."
