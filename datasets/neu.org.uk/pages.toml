["https://neu.org.uk/about/international/development-co-operation"]
title = "Development co-operation | National Education Union"
description = "Education is central to achieving sustainable development."
full_description = 'The NEU supports the Sustainable Development Goals (SDGs), and in particular SDG4, the global target of enrolment and completion of free, high-quality public education for all.Send My Friend to School launches Right Climate to Learn reportNEU partner Send My Friend to School has launched a new policy report on education and climate change. This report sets out the interplay between education and climate change and makes the case that education must be a central pillar of an effective global climate response.The NEU are a core supporter of the Send My Friend to School campaign. You can read the report on Send My Friend’s website.DCI Palestine - Latest report on child prisonersNEU partner organisation DCI Palestine has released a new report, “Isolated & Alone: Palestinian Children Held in Solitary Confinement by Israeli Authorities for Interrogation”. The report evaluates and details patterns of arrest, detention conditions, and interrogation practices by Israeli authorities. The report concludes that the physical and social isolation of Palestinian children for interrogation purposes by Israeli authorities is a practice that amounts to torture or cruel, inhuman, or degrading treatment under international law.Send My Friend to School demands: "Keep all my friends learning”A quality education is critical to children’s safety, opportunities and ability to reach their potential. However, education around the world, and the hope that it brings, is facing a generation-defining emergency: COVID-19. Every child has the right to a quality education, but the COVID-19 pandemic has obstructed this right on an unprecedented scale.The poorest and most marginalised children - girls, refugees, disabled children - were less likely to be in school and learning before the pandemic hit. Now, these children, their learning and their opportunities are bearing the brunt of a global pandemic. In the face of COVID-19, urgent action is needed to guarantee all children their right to a quality education and to reignite commitments to get every child learning.Read Send My Friend’s policy briefing and download a free campaign pack and teaching resources.The Right Climate to LearnThrough Sustainable Development Goal 4 (SDG 4), the global community has committed to realising the right to quality education for all by 2030. However, the climate crisis jeopardises this promise. Despite global commitments, education continues to be interrupted for children and young people around the world. The NEU is a key partner in the Send My Friend to School coalition. Read its report, The Right Climate to Learn.'
year_published = 2025
