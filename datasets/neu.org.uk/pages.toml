full_description = "Recruitment materials Order all trainee and general recruitment materials including application forms, flyers and posters, along with recruitment publications for leaders and educational professionals Reps’ guide to recruitment This guide covers everything you need to know to recruit new members – from how to have recruitment conversations, to ordering recruitment materials for your noticeboard. Trade union facilities time The role of the NEU representative has many different responsibilities including advice, representation, and negotiation; to effectively carry out this role, reps need time off with pay. How to organise a great workplace meeting Organising a workplace meeting as a rep can be a bit of a hassle. Here are some tips to get you organising. Leaders in union meetings Guidance on including leadership members and managing workplace union meetings. Using WhatsApp An overview of how to use WhatsApp effectively for union communications: chats without chattering Appraisal and accountability bargaining toolkit Guidance and resources for appraisal and accountability bargaining in your workplace to secure reduced workload and ensure educators can develop their professional practice. Pay bargaining toolkit Guidance and resources for pay bargaining in your workplace to ensure teachers and support staff are fairly paid. Reps directed time letters Template letters to request for meeting to discuss workload, follow up and final letter if there's no response. Reps model directed time meeting presentation Starting to tackle workload: the directed time calendar. Behaviour policy checklist for schools and colleges The aim of this checklist on behaviour is to provide a framework that schools can adopt to enable the support, appropriate information and understanding that is needed for success. Behaviour policy checklist for early career teachers and mentors The aim of this checklist on behaviour for early career teachers (ECTs) and their mentors is to provide a framework that schools can adopt to enable the support, appropriate information and understanding that is needed for success."
