["https://neu.org.uk/advice/classroom/teaching-resources/challenging-gender-stereotypes-stem"]
title = "Challenging gender stereotypes in STEM | National Education Union"
description = "Resources for the classroom help girls learn about female role models in STEM subjects and support their aspirations and subject choices."
full_description = "Science, Technology, Engineering and Mathematics (STEM) subjects are still largely dominated by boys and young men. By not choosing these subjects, and the careers that follow, girls’ are losing out on earnings and opportunities. What’s more, the day to day world around us that benefits from STEM is missing out on the vital input women bring to the work they do. Decades of work by educators to change this situation is working, more girls are choosing STEM subjects. But there is still a long way to go to tackle negative gender stereotypes that hold girls and non-binary students back from choosing STEM subjects. Katherine Johnson: Lesson planner and teaching notes Katherine is a mathematician who contributed to the US space programs with the early application of computers at NASA. Dr Nita Patel: Lesson planner and teaching notes Nita Patel is an Indian-American physician and vaccinologist who leads vaccine development at Novavax. Sheila Scott OBE: Lesson planner and teaching notes Sheila Scott OBE was an English aviator who broke over 100 aviation records through her long-distance flight endeavours. Victoria Velez: Lesson planner and teaching notes Victoria followed her heart to a career that focuses her love of hands-on problem solving into engineering medical technologies that save lives. Orla Murphy: Lesson planner and teaching notes Orla Murphy is an audio engineer at Jaguar Land Rover. Hiu Wai Lee: Lesson planner and teaching notes Hiu Wai is currently a first-year PhD student on cranial suture evolution on archosaurs, which include birds, crocodiles, non-avian dinosaurs, and their common ancestors. Amanda Obidike: Lesson planner and teaching notes Amanda is a Data Scientist and she is the Founder of STEMi Makers Africa. Dr Tessa Lau: Lesson planner and teaching notes Dr Tessa Lau is the Chief Robot Whisperer at Savioke, Inc. where she is creating a new generation of user-friendly robots that work safely, securely and reliably in human environments. Anisah Osman Britton: Lesson planner and teaching notes Anisah is the Chief Technology Officer and Head of Ecommerce at VinoKilo, a German vintage fashion brand."
