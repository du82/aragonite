full_description = "Income and ExpenditureThe total income of the union for the period was £78,880,780. This amount included payments of £69,598,372 in respect of membership income of the union. Of total income, £78,378,438 relates to the general fund (£69,096,030 from membership).The union’s total expenditure for the period was £76,116,227, of which £75,699,670 relates to the general fund.Political FundIn respect of the union’s political fund, its total income was £502,342 and total expenditure was £416,557. Find out more information about the Political Fund - including the opt-out process.Salary paid to and other benefits provided to the General SecretariesThe general secretaries of the union were paid £244,123 in respect of salary and £37,032 in respect of benefits.Irregularity statement A member who is concerned that some irregularity may be occurring, or have occurred, in the conduct of the financial affairs of the union may take steps with a view to investigating further, obtaining clarification and, if necessary, securing regularisation of that conduct.The member may raise any such concern with such one or more of the following as it seems appropriate to raise it with: the officials of the union, the trustees of the property of the union, the auditor or auditors of the union, the Certification Officer (who is an independent officer appointed by the Secretary of State) and the police.Where a member believes that the financial affairs of the union have been or are being conducted in breach of the law or in breach of the rules of the union and contemplates bringing civil proceedings against the union or responsible officials or trustees, he should consider obtaining independent legal advice."
