title = "Annual conference | National Education Union"
description = "Conference is the main decision making body of the union where changes to policy and the rules are agreed."
full_description = "FAQ for new delegates This FAQ are designed to help if this is your first annual conference or if you’ve been before, but didn’t understand how everything worked. Conference information for district officers only All information regarding how to register delegates, submit motions, nominate members to the conference committee etc are on the Officers’ SharePoint. Breadcrumbs Home About About us Annual conference Annual conference Conference is the main decision making body of the union where changes to policy and the rules are agreed. As well as debate, there is an exhibition, fringe meetings and CPD sessions. Annual Conference usually occurs once a year, just before Easter. Annual Conference is attended by up to 1600 delegates, most directly elected to represent their districts, sector or equality groups. Other than the rare occasions when all members are balloted, conference is the ultimate decision-making body of the union. As well as setting policy, conference agrees changes to the union’s rules and signs off the annual accounts.Most members of conference are elected by their districts. Each district is allocated a maximum number of delegates based on the size of its total membership.Members of conference are elected for twelve months. Although very rare, special meetings of conference members can be called at other times of the year. Annual Conference 2025 Annual conference 2025 will be held at the Harrogate Convention Centre from Monday 14 April until Thursday 17 April. Find out more FAQ for new delegates This FAQ are designed to help if this is your first annual conference or if you’ve been before, but didn’t understand how everything worked. Conference information for district officers only All information regarding how to register delegates, submit motions, nominate members to the conference committee etc are on the Officers’ SharePoint. Past Conference Annual conference 2024 highlights NEU Annual Conference 2024 highlights Annual conference 2023 highlights Annual Conference 2023 highlights and press releases Facebook Facebook (opens in a new window) Twitter Twitter (opens in a new window) LinkedIn LinkedIn (opens in a new window) Back to top"
