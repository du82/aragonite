["https://neu.org.uk/about/about-us/rules-and-procedures/non-member-complaints-procedure"]
title = "Non-member complaints procedure | National Education Union"
description = "This sets out the procedure for external bodies to raise concerns about the conduct of an NEU representative, whether they are an elected officer of the Union or a member of staff."
full_description = "The National Education Union is committed to providing members with the best possible support and advice and representation at all levels. Elected local officers, NEU representatives and staff are trained and supported to be effective on behalf of members and the Union realises that this will at times put them in a position of disagreement and possible conflict with managers and employers. The National Education Union aims to respond to all complaints within six weeks of receipt.In the first instance, concerns should be brought to the attention of the NEU officer concerned. If this does not resolve the issues the concerns should be put in writing to the relevant Regional or Wales Secretary. If the complaint is about the Regional or Wales Secretary this should be made in writing to the General Secretary at National Education Union, Hamilton House, Mabledon Place, London. WC1H 9BD or by email to [email protected]"
