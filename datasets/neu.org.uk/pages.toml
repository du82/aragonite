["https://neu.org.uk/advice/equality/race-equality/decolonising-education"]
title = "Decolonising education | National Education Union"
description = "Rebuilding a school system that supports all students, staff and teachers and is responsive to the particular needs of each and every child."
full_description = "What is decolonising education?It is important that the term decolonising education holds meaning.Decolonisation can mean a process of withdrawal of political, military and governmental rule of a colonised land by its invaders. In education decolonising movements started in Universities across the world and in the UK. They have been addressing education to ensure that global histories and events include the perspectives of the once colonised or enslaved people. Many Higher Education institutions have a well-developed decolonising education programme. NEU members wanted a conference to see how such programmes might apply in primary or secondary education.In practice, decolonising education means rebuilding a school system that supports all students, staff and teachers. A system that is responsive to the particular needs of each and every child.Decolonising education involves examining the limitations and biases of the current curriculum; the omissions in initial teacher education and training; and examining the political and societal legacies of colonialism and how they have influenced education policies. Anti-racism charter A framework for developing an anti-racist approach in schools and colleges. It will support schools/colleges, teachers children and young people to address racism."
year_published = 2025
clearnet = "https://neu.org.uk/advice/equality/race-equality/decolonising-education"
