["https://neu.org.uk/advice/classroom/behaviour-schools/preventing-and-reducing-exclusions/rsa-report-pinball-kids"]
title = "RSA report on Pinball Kids | National Education Union"
description = "To reduce unnecessary exclusions, we need to address the systemic causes of rising exclusions."
full_description = "What we can learn from the RSA report on Pinball KidsIn March 2020, the RSA worked with the Esmee Fairburn Foundation to explore why there has been a 60% increase in the number of pupils permanently excluded from England’s schools over a five-year period. The report explored the causes of rising exclusions; including wider societal factors; direct consequences of deliberate policy making; and unintended consequences of policy making.The NEU agrees with the conclusions of the report. These conclusions were that, to reduce unnecessary exclusions, we need to address the systemic causes of rising exclusions and to create the conditions, within schools, which allow schools to hold onto, and meet the pastoral and learning needs of, at-risk children. Indeed, pastoral and learning needs are inextricably linked, and have a reciprocal relationship. Reviewing behaviour policy Practical advice on reviewing your behaviour policy for a whole school approach to making meaningful change. Pinball Kids: preventing school exclusions Read the full RSA report and their conclusions about the conditions for change we need to create."
year_published = 2025
