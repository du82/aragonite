["https://neu.org.uk/advice/classroom/behaviour-schools/preventing-and-reducing-exclusions/support-looked-after-children-care"]
title = "Support for looked after children in care | National Education Union"
description = "Advice on how to prevent and reduce school exclusions for students in care."
full_description = "Attendance, engagement and exclusion need to be considered together for looked after children. Children in care are three times more likely to be excluded than other children but it is really important to know that many young people in care do well in their education.What you can do to improve attendanceChildren in care are more likely to miss education because of disruption in their lives.You can help to improve a child in care’s attendance by talking to them and their carer.You should talk to the young person about:the importance of coming to school.How they feel about going to school.Their ambitions for the future and how being at school will help them with further education or getting a job.You should tell the young person’s foster carer:who they should contact at school if there are problems at home.To talk to the school about anything that stops the young person from attending.That they must ring the school first thing in the morning if the young person can’t go in.That the setting will contact them if the young person doesn’t arrive at school and you haven’t heard from the carer. Creating a sense of place and belonging in schools The importance of creating an environment where everyone can feel confident and safe in their identity."
year_published = 2025
