["https://neu.org.uk/advice/classroom/teaching-resources/mosaic-victims-nazi-persecution"]
title = "Mosaic: Victims of Nazi persecution | National Education Union"
description = "A comprehensive set of teaching resources on the Holocaust and Nazi persecution, produced by the NEU and the Holocaust Educational Trust."
full_description = "These resources include classroom activities as well as downloadable postcards and posters covering the persecution of Black people, disabled people, Gypsies and Porrajmos, Poles and gay men. The incredible Paul's journey and Martin and Erica's journey stories are also available to download for free with accompanying teachers notes. Martin and Erica's Journey This is the story of Martin and Erica Stern and the journey they were forced to make through Europe during the Second World War. Martin and Erica's Journey notes Teaching notes on the content and usage of the 'Martin and Erica's Journey' section of the resource, together with advice on the pedagogical challenges and conceptual issues it raises. Paul's journey Paul’s story, like that of millions of other Jewish people in Hitler’s Europe 1933-45, is a story of fear, persecution and cruelty, which illustrates the dangers of sectarianism and ethnic or racial prejudice – a lesson we must never forget. Paul's Journey notes Teaching notes on the content and usage of the 'Paul's Journey' section of the resource, together with advice on the pedagogical challenges and conceptual issues it raises. Mosaic: Victims of Nazi Persecution notes Guidance notes for the Mosaic resource, designed to help students explore the diverse experiences of the many groups of people persecuted during the era of the Third Reich. Czesława Kwoka postcard Czesława Kwoka was born on 15th August 1928 in Wólka Złojecka, a small village near the city of Zamość in south-eastern Poland. Persecution of Poles poster Why would a Government not allow children to go to school? Why would children be stolen from their families? What do you understand by the term ‘Germanisation’? Persecution of Poles notes Teaching notes on the content and usage of the 'Persecution of Poles' section of the resource, together with advice on the pedagogical challenges and conceptual issues it raises. Konstantin Alexandrovich Shilov postcard Konstantin Alexandrovich Shilov was born in Bugulma in Russia in 1913 and, like millions of other Russians of his generation, he experienced great hardship during his childhood."
year_published = 2025
