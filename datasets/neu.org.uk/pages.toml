["https://neu.org.uk/about/nations/neu-northern-ireland/pay-scales-northern-ireland"]
title = "Pay scales – Northern Ireland | National Education Union"
description = "Pay scales for Northern Ireland following the pay rise from 1 September 2023."
full_description = "Teachers in Northern Ireland received an increase of 4.1% in salary rates, plus a consolidated £1,000 payment, from 1 September 2023. In accordance with the provisions of Article 69(1) and (6) of the Education and Libraries (Northern Ireland) Order 1986, following negotiations with Teachers’ Unions, the Department of Education has determined that the salaries and allowances to be paid to teachers in grant-aided schools shall be those set out below:Annual Salary (£) From 1 September 2023:September 2023 pay pointsPointPayM2£30,000M3£32,067M4£34,458M5£37,093M6£39,946UPS 1£43,191UPS 2£44,753UPS 3£46,368Schools can award only one of five Teaching Allowances (TA) to a classroom teacher. It is not possible to award more than one TA to a teacher to recognise different areas of responsibility. TAs may be split between a combination of full-time teachers, part-time teachers or both, provided that the full value of the TA is used and not exceeded. A part-time teacher may be awarded: (i) a full Teaching Allowance provided the Board of Governors is satisfied that the duties of the Teaching Allowance are able to be fully and effectively carried out within the teacher’s available working hours; or (ii) a Teaching Allowance on a pro rata basis commensurate with his/her hours and, the balance of that teacher’s allowance may be awarded to another part-time or full-time teacher.The current value of Teaching Allowances (September 2020) are:Teaching AllowancesTAAmountTA 1£2,282 TA 2£4,609TA 3£7,912TA 4£10,897TA 5£14,705The ‘leadership scale’ is the salaries for principals and vice-principals and ranges from L1 = £47,241, to L43 = £130,715.Leaders progress incrementally up the leadership scale depending on the range that applies to their school. Northern Ireland teachers' pay and allowances Northern Ireland Department of Education circulars containing information about teachers pay. Pay scales for support staff Pay scales for support staff in England, Wales and Northern Ireland. Most support staff are employed on the local government pay scales determined for local government services."
