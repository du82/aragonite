["https://neu.org.uk/advice/classroom/teaching-resources/full-story/books-young-children"]
title = "Books for young children | National Education Union"
description = """
One, Two Three… Jump! is part of a series of beautifully illustrated picture books – with a couple of words of text on each page – that explore a range of different movements (running, crawling, climbing etc). They can be used both as early readers and alongside movement games to build confidence and have fun. As well as jumping, this title includes related activities such as falling over (“bump!”) and demonstrates that you can jump while sitting down or holding onto something to help you balance. Included in the pictures, children may notice leg splints, a cochlear implant, and a safety helmet as might be worn by a child with epilepsy, haemophilia or balance disorders. 

This is a title toddlers will happily return to many times. You could just enjoy it with them or, sometimes, notice the full range of differences on display – from the multi-ethnic cast of characters to the range of clothing and hats – alongside those related to ability. 

Ask


\tHow many different ways can you move from one place to another?
\tWhat can help you to move?"""
full_description = "Books for young children One. Two, Three… Jump! By Carol Thompson One. Two, Three… Run! By Carol Thompson Mary Had a Little Lamb By Marina Aizen Zeki Can Swim By Anna McQuinn And Ruth Hearson Children of any age may be disabled or have family members with impairments and it is important that all children see disability as part of everyday life. Literature is a powerful way of enabling children to reflect on their identities and become familiar with those which may differ from their own. Whatever their age, they deserve to see both themselves and the full diversity of humanity in the stories they read. Here are four titles that are suitable for the very young and feature Disabled characters with different degrees of prominence. They are about playing and having fun with family and friends but all of them also place disability in the context of a broad spectrum of difference. We’ll talk more about books that focus on celebrating diversity itself in the next section."
year_published = 2025
