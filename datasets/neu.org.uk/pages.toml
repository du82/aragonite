["https://neu.org.uk/about/about-us/who-who"]
title = "Who is who | National Education Union"
description = "The day to day running of the union is led by the union leadership team."
full_description = "National executive The NEU Executive comprises the National Officers, 49 Geographical members, three equality constituency members and three sector seat constituency members. Districts and branches The structure of NEU districts, district contact details and how to get involved with your union, locally. Breadcrumbs Home About About us Who is who Who is who The day to day running of the union is led by the union leadership team. Union leadership Daniel Kebede General Secretary, National Education Union Daniel represents the interests of his members to the government, and to a wide variety of other stakeholders. close Daniel Kebede General Secretary, National Education Union Daniel is a former Primary teacher and rep in North Tyneside. He was an NEU rep and officer from 2013 undertaking casework/negotiation. He concluded disputes for members including an end to: submitting planning to SLT, displaying planning, fortnightly book scrutinise and numeric targets and campaigned for fair funding/pay/workload. He was awarded national Blair Peach Award for outstanding contribution to anti-racist work in 2017.He served on the NEU National Executive committee and was elected Senior Vice President of National Education Union in 2020. He became the National President of National Education Union in September 2021 and represented the union on various platforms in UK and abroad.He was elected NEU General Secretary in 2023. National executive The NEU Executive comprises the National Officers, 49 Geographical members, three equality constituency members and three sector seat constituency members. Districts and branches The structure of NEU districts, district contact details and how to get involved with your union, locally. Facebook Facebook (opens in a new window) Twitter Twitter (opens in a new window) LinkedIn LinkedIn (opens in a new window) Back to top"
