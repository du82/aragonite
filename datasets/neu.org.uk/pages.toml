["https://neu.org.uk/advice/equality/disability-equality/reasonable-adjustments-making-work-fit"]
title = "Reasonable adjustments: Making work fit | National Education Union"
description = "Reasonable adjustments are primarily concerned with enabling disabled workers to remain in or return to work."
full_description = '''Reasonable adjustments are changes to the workplace that enable you to work safely and productively. Reasonable adjustments could include: Installation of a ramp for wheelchair users; Provision of a specialist chair or standing desk for staff with back problems; Changing working hours or patterns of work; Avoid excessive lesson observations and surprise ‘drop ins’ that can exacerbate anxiety. For more suggested 'low cost' or 'no cost' reasonable adjustments, with case studies, see "Reasonable adjustments and case studies" in the Disability toolkit or see the breakdown by impairment or condition below. Many reasonable adjustments are good practice and should be put in place by all employers. School and college leaders can create flexible timetables, for example, that take account of staff needs, without waiting for a member of staff to ask. However, if you require reasonable adjustments that are specific to you or to your conditions, you will need to provide the employer – or someone acting on the employer’s behalf – with sufficient information to carry out that adjustment. If you are reluctant to disclose the nature of your disability, the Union’s advice is to make your condition and concerns about being disadvantaged known to an occupational health adviser, or where one is not available, to a HR officer or a recruitment agent, where appropriate. Such individuals will then be expected to act in strictest confidence and with great sensitivity when advising line managers etc. of the effects of your condition and the reasonable adjustments required as a result. As an NEU member, you do not need to do this alone. AdviceLine can provide guidance on your rights. The disability toolkit provides guidance for reps, branch secretaries and caseworkers about how to support disabled members. Model reasonable adjustments disability passport The reasonable adjustments disability passport is a tool to record the reasonable adjustments agreed between a worker and their line manager. It is designed to provide a documented record of an individual’s needs, which will allow them to function to…'''
