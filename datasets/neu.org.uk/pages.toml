full_description = "Potentially sensitive advice and guidance for NEU officers is held on our secure Officers Sharepoint. Access is granted via an NEU email account, and officers will be automatically added when their account is activated. Play video Using the membership system Officer portal You can check and update members' details on the officer portal system which is available to officers who have been elected as NEU secretaries, assistant secretaries and membership secretaries. New secretaries should email [email protected]. Ordering recruitment materials Order all trainee and general recruitment materials including applications forms, flyers and posters, along with recruitment items for leaders and School Direct using our recruitment materials order form. Access to data and bulk email guide NEU officers can send bulk email to members in their district by using Action Network. We have available Action Network help guides to help you with using the system. Action Network NEU officers can send bulk email to members in their district by using Action Network. Request branch or district e-mail accounts If you have been elected as a new officer, you can request branch or district e-mail account from IT Information. NEU business cards Officers can now order 'business' style cards for local officers in districts and, where necessary, for officers at branch level. These requests will be managed by Despatch, Head Office. Adopting this approach allows us to bulk purchase the cards at a… ID badge Officers can now order a laminated ID badge to include name, position, district/branch, NEU logo and photo. The cost of this is covered by HQ. District and branch contact pages Every NEU branch or district has its member contacts on the NEU website. Officers currently do not have editorial access to these contact cards. Progress on this will be updated via the e-bulletin."
