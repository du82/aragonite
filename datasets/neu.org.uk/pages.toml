["https://neu.org.uk/about/nations/neu-northern-ireland/teachers-time-budget-arrangements-northern-ireland"]
title = "Teachers’ time budget arrangements in Northern Ireland | National Education Union"
description = "No teacher in Northern Ireland should be directed to work more than 32.4 hours in a single week."
full_description = "As negotiated by NEU along with colleague in the Northern Ireland Teachers Council (NITC), until individual time budgets are in place, no teacher should be directed to work more than 32.4 hours in a single week.It has been agreed that each working day since 31 July 2020 is deemed as 6.5 hours and deducted from the 1265 annual hours maximum.Please also note that teachers can be directed to carry out duties from home or school.What you should do:Share this information with NEU teaching colleagues.Note the revised deadline of 30 October.Share the NEU Check-list, advice and Flow Chart with teaching colleaguesKeep a ‘tally’ of days worked from 1 August (deemed 6.5 hours allocation per day).Make sure they know now (not 30 October), which 195 days they are required to work, and whether their allocation is correct*.* Monitor if the school has “missed” or not recorded any days that you have worked – for example, Exam result days, August INSET days, or Saturday sports for those contracted to work them.If you have any concerns, please contact us. Understanding your teacher’s time budget Advice to help NI teacher members understand their entitlements and what to do if they have concerns about workload. Find out more Part-time teachers: Are you exceeding your workday limit? Are you a part-time teacher in Northern Ireland? You should ensure you are not working beyond your allocated pro rata days. It's important that you are not being overworked and working any unpaid days. Time budget flowchart (Northern Ireland) Time-budget summary of checks members in Northern Ireland should do. Time budgeting guide (Northern Ireland) NEU-NI guide and checklist to support time budgeting, including a summary of checks you should do. Directed Time budgets – transitional arrangements letter Letter to principals from the Teachers' Salaries and Conditions of Service Committee (Schools) Management Side on Directed Time budgets in Northern Ireland."
year_published = 2025
clearnet = "https://neu.org.uk/about/nations/neu-northern-ireland/teachers-time-budget-arrangements-northern-ireland"
