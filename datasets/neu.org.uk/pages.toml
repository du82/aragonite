["https://neu.org.uk/about/nations/neu-northern-ireland/neu-northern-ireland-staff"]
title = "NEU Northern Ireland staff | National Education Union"
description = "NEU Northern Ireland office staff roles and how they can help."
full_description = "Breadcrumbs Home About Nations NEU Northern Ireland NEU Northern Ireland staff NEU Northern Ireland staff NEU Northern Ireland office staff roles and how they can help. NEU Northern Ireland has a staff of four regional officials. Pauline Buchanan Regional Secretary Pauline has led NEU in Northern Ireland as regional secretary since 2022. close Pauline Buchanan Regional Secretary Pauline has led NEU in Northern Ireland as regional secretary since 2022 and is NEU’s negotiator within the NITC and Teachers Negotiating Committee. Prior to her position in the Northern Ireland Office she was the Regional Secretary for London. Danielle Black Regional officer Danielle Black is responsible for casework, national training, recruitment and organising. close Danielle Black Regional officer Danielle Black joined NEU in 2021, and is responsible for casework, national training, recruitment and organising. She represents the union on a range of negotiating forums and sits on the LRA Independent Appeals Panel. Danielle is staff lead for Disability, New Professionals and Young Workers and the Women’s Organising Forum.She previously worked for the Bar of Northern Ireland and Ulster University Students’ Union, where she was responsible for the student advice service and driving positive change in Higher Education. Simon Salter Regional support officer Simon Salter is normally the first point of contact at the NEU’s Belfast Office. close Simon Salter Regional support officer Simon Salter has been Regional Support Officer in Northern Ireland since 2018. Simon is normally the first point of contact at the NEU’s Belfast Office, managing the office phones and offering members a wide range of support and advice, relating to employment law. He specialises in time budget queries, developing an inhouse calculator used to analyse workload expectations using the school calendar, timetable, and time budgets. He represents the NEU and NITC in the Temporary and Substitute Review and is also on a working group tasked with replacing the current NISTR system. Facebook Facebook (opens in a new window) Twitter Twitter (opens in a new window) LinkedIn LinkedIn (opens in a new window) Back to top"
