["https://neu.org.uk/advice/classroom/teaching-resources/climate-change"]
title = "Climate change | National Education Union"
description = "Climate change is real and is threatening our future. It is our young generations that will lose the most if it is not addressed now."
full_description = "Climate and Nature Bill NEU statement on a missed opportunity to rise to the challenge of the climate and nature crisis. Read here As educators, it is paramount that we enable children to understand the climate crisis and equip them with the skills and knowledge to build a more sustainable future.In April 2022, the DfE began implementing its Climate Change Strategy, which can be accessed here.We are campaigning for a “just transition” to a greener economy, so changes needed to combat and mitigate against climate change are managed in a way that protects all.A just transition would mean protections against working in extreme temperatures in heatwaves and safely removing asbestos as part of the process of retrofitting schools to make them more climate resilient and energy efficient.TUC – Climate Emergency: Winning a Just Transition calls for timely, worker-friendly climate action to protect the planet and future-proof obs. Schools built for the future have major construction and education unions making sure the UK’s school buildings are fit for the future and energy efficient. Addressing the climate crisis from the chalkface Dr Meryl Batchelder, explains how climate education can be embraced in schools. Making schools sustainable Simple adaptations to education buildings can help meet climate targets, make buildings more resilient to climate change, more energy efficient and healthier places to work and learn. The climate crisis is a class issue Working people must not be left behind in a transition from carbon. The costs must fall on those most able to pay."
