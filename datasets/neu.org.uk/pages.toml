full_description = "Educators against the far-right There are many areas of teaching and activities in your school which can counter racist narratives, prejudice against refugees and intolerance. Black History Month resources October is Black History Month, a time to recognise and celebrate the invaluable contributions of Black people in the UK and around the world. Windrush education Windrush Day marks the day SS Empire Windrush arrived at Tilbury Docks in Essex in 1948. Climate change Climate change is real and is threatening our future. It is our young generations that will lose the most if it is not addressed now. Breaking the Mould The NEU worked with five primary schools over two years to consider how ‘traditional’ gender stereotypes could be challenged in nursery and primary classrooms. The Full Story How books for early years and primary age children can be used to promote disability inclusion. Supporting language development Classroom resources on key actions to aid language development in school. Challenging gender stereotypes in STEM Resources for the classroom help girls learn about female role models in STEM subjects and support their aspirations and subject choices. Welcoming refugee children Find out more about the experiences of refugee children in UK schools and how they make new connections in their communities. Mosaic: Victims of Nazi persecution A comprehensive set of teaching resources on the Holocaust and Nazi persecution, produced by the NEU and the Holocaust Educational Trust. Tackling antisemitism Antisemitism is racism against Jewish people. Like other forms of racism, it is on the rise and needs to be tackled. Women Chainmakers If ever there was a moment in time to evaluate the progress made towards gender equality, that moment is now. Israel/Palestine: Issues for schools This advice aims to support members to deal with the reactions of pupils and the wider community to the Israel/Palestine conflict. This guidance was reissued in October 2