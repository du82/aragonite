["https://neu.org.uk/advice/equality/lgbt-equality"]
title = "LGBT+ equality | National Education Union"
description = "LGBT+ education professionals, pupils and families are vital members of all nursery, school and college communities and of our union."
full_description = "NEU LGBT+ inclusion charter The NEU LGBT+ charter is a clear, practical, hands-on guide for how educators might initiate work on LGBT+ equality, develop their approach further or add to what they do already. Pride The NEU actively takes part in LGBT+ Pride events across the country. Here you can find out how to join other NEU members at Pride events. Supporting trans and gender questioning students Advice to help school and college staff support gender variant or questioning students in the educational environment. NEU statement on transphobia A clear expression of the union’s commitment to protecting trans members from harassment and offensive conduct. Trans educators toolkit Toolkit with advice and guidance on transitioning for trans educators and employers. Sexual orientation discrimination All teachers and educational professionals have specific protection from discrimination at work on grounds of sexual orientation and civil partnership under the Equality Act 2010. Transgender discrimination All trans teachers and educational professionals have specific protection from discrimination at work on grounds of sex and transgender status under the Equality Act 2010, as well as from the unlawful disclosure of transgender status. Our Histories - teaching pack for key stage 1-2 Recognising International Equality events in January and February. Every child, every family This resource will help you to promote LGBT+ inclusion through reading. It’s designed to help you include every child and make sure every child has ways to see their family and relatives represented positively in their school. Protect trans and non-binary students Schools work carefully to engage and communicate with parents and carers appropriately, but the Government is making the job of schools harder not easier. Government’s draft schools and college guidance on trans and non-binary students It is important to underline that schools do not need to change their current policies at this stage. New statutory RSE and health education guidance is a welcome step forward There is an urgent need to ensure that children and young people are equipped with the knowledge and the skills to stay safe and develop healthy, happy and equal relationships."
