["https://neu.org.uk/about/about-us/rules-and-procedures/national-education-union-rule-book"]
title = "National Education Union rule book | National Education Union"
description = "1.1 A member of the Union commits a disciplinary offence if that member :acts contrary to the Code of Professional Conduct of the Union;acts contrary to the Rules of the Union;refuses to comply with a lawful instruction of the Union;is knowingly involved in any fraud on the Union or misappropriation of Union funds or property;misuses protected data contrary to the Data Protection Act Licence of the Union ;frustrates any decision or penalty of the National Disciplinary Committee or National Appeals Committee; orin any other way engages in conduct which brings injury or discredit to the Union."
full_description = "The objects of the Union shall, so far as may be lawful, be to educate, organise, influence and negotiate, as follows:Promote the power of education as a critical and creative process which enables learners to understand and contribute to wider society and the world in which they live and to change it for the better; to influence education policy through lobbying and the promotion of research; to be the campaigning voice of teachers, lecturers, support staff and leaders across the sectorProtect and improve the status and to further the legitimate professional interests of members involved in the delivery of education, by retaining or seeking recognition in work places at all levels and nationally, and through effective collective bargaining within the jurisdiction of the organisationPromote equality and fair treatment for education professionals and seek recognition for the importance of education as a vehicle for achieving equality within society, whether for those with protected characteristics or suffering poverty or social disadvantageSeek to organise the entire education profession through engagement at local level by recruiting and developing workplace representatives in order to strengthen collective workplace organisationEnsure that all members have the same opportunity to be represented, participate, be heard and to contribute towards the policies of the organisationPromote individual entitlement to employer funded continuing professional development (CPD) for education professionals and to provide a range of CPD opportunities to support members in developing their careersSeek to influence the political agenda whilst maintaining independence from any political partyParticipate in the wider trade union movement and promote the nature of education globally including through Education International. pdf Download Rule book"
year_published = 2025
clearnet = "https://neu.org.uk/about/about-us/rules-and-procedures/national-education-union-rule-book"
