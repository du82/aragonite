["https://neu.org.uk/about/international/development-co-operation/young-people-palestine"]
title = "Young people in Palestine | National Education Union"
description = "All children have the right to life, to live and play without fear of violence and to attend school and learn in safety."
full_description = "The NEU welcomes the announcement on 15 January 2025 of a ceasefire between the Israeli Government and Hamas. We look forward to the imminent and safe release of all Israeli hostages, the release of Palestinian prisoners and the permanent cessation of all hostilities.We urge the international community to work at pace to ensure aid is delivered to the people of Gaza without hindrance, that the ceasefire is fully implemented and that human rights, international law, and the sovereignty of the Palestinian people is upheld.Education under attack in PalestineIn Gaza, education has been entirely halted since October 2023 for over 625,000 children and 22,000 teachers. Over 17,000 children and more than 400 teachers and educational professionals have been killed. More than 95% of schools have been damaged or completely destroyed. In the West Bank, at least 224 children have been killed by Israeli forces or settlers since January 2023. Access to education has also been severely disrupted for 782,000 students due to movement restrictions, military operations and settler violence.The NEU urges the UK Government to recognise the catastrophic damages to the education system in Gaza and work with donors to mobilise the funds needed to support the immediate education requirements and long-term education reconstruction, including by scaling up support to UNWRA and ensuring it is able to operate fully across Gaza and the West Bank."
