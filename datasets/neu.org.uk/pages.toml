["https://neu.org.uk/about/nations/neu-northern-ireland/teachers-time-budget-arrangements/part-time-teachers-northern-ireland-are-you-exceeding-your-workday-limit"]
title = "Part-time teachers in Northern Ireland: Are you exceeding your workday limit? | National Education Union"
description = "Are you a part-time teacher in Northern Ireland? You should ensure you are not working beyond your allocated pro rata days. It's important that you are not being overworked and working any unpaid days."
full_description = "To help determine if you are working beyond your contracted days, we recommend using NEU’s simple calculator to input your working days to see if you are exceeding the limit. If you find that you are working more than you should be, it's crucial to address this issue with your workplace representative.If you face any issues with your Principal please contact the Northern Ireland office at [email protected] for further assistance. We have already successfully retrieved time off in lieu and extra pay (1/195) for part time members who have exceeded their pro rata days. Working beyond your contracted days can have negative impacts on your well-being, work-life balance, and overall job satisfaction. It's important to advocate for yourself and ensure that you are being treated fairly in your position.Don't hesitate to reach out for support and guidance if you believe you are working beyond your 195 pro rata days as a part-time teacher in Northern Ireland. Your well-being and rights in the workplace are important, and it's essential to address any concerns or issues promptly. School calendar calculator (Northern Ireland) Part-time teachers in Northern Ireland should use this calculator to ensure you are not working beyond your allocated pro rata days. Teachers’ time budget arrangements No teacher in Northern Ireland should be directed to work more than 32.4 hours in a single week."
year_published = 2025
