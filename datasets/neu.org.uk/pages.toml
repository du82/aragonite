["https://neu.org.uk/advice/classroom/teaching-resources/tackling-antisemitism"]
title = "Tackling antisemitism | National Education Union"
description = "Antisemitism is racism against Jewish people. Like other forms of racism, it is on the rise and needs to be tackled."
full_description = "The Community Security Trust (CST) recorded 1,668 antisemitic incidents in the UK in 2020: the third-highest total it has ever recorded in a single calendar year. The rise of antisemitism should be of real concern to everyone; it is relevant to all schools as we need to use education to tackle the ideas and stereotypes that cause this form of racism.The TUC’s Racism Ruins Lives survey (2017) revealed that Jewish workers experienced wide-ranging antisemitism in their workplaces and often felt unable to talk to their union due to the extent of the problem. The union movement must play a key role in leading by example and challenging antisemitism whenever it happens.The NEU thinks education must be a tool in challenging antisemitism, in terms of preventing negative ideas and prejudice, and responding to incidents of antisemitism in schools or local communities. Silence is the wrong approach, and the historical causes of antisemitism must be covered in classes.It is vital that we make progress and develop anti-racist educational approaches, so that Jewish communities are free from the scourge of antisemitism. A key part of tackling antisemitism is through education, in terms of using the whole curriculum and developing a whole-school culture where racism is taken seriously and challenged. Education is key to addressing bias and prejudice. Holocaust Memorial Day Trust resources Resources to support teachers and learners to find out more about the Holocaust. Holocaust Education Trust Resources: Resources for teachers Exploring the Holocaust is the HET’s flagship resource which offers a free, comprehensive and flexible cross-curricular scheme of work for the teaching of the Holocaust at Key Stage 3. TUC – Talking About Antisemitism A TUC guide for union reps on discussing and tackling antisemitism in the workplace. Facing History and Ourselves A wide range of flexible, multimedia materials, from primary sources and streaming video, to teaching strategies, lessons and units, and more."
