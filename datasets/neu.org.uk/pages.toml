["https://neu.org.uk/about/about-us/neu-structure/national-executive/executive-elections-faq"]
title = "Executive elections FAQ | National Education Union"
description = "The NEU Rules state that it must be 35 signatures from members from at least 3 workplaces, so it has to be a minimum of 3 workplaces."
full_description = "35 members’ nominations over 3 workplaces – is it a minimum of 3 workplaces or can it ONLY be 3 workplaces? The NEU Rules state that it must be 35 signatures from members from at least 3 workplaces, so it has to be a minimum of 3 workplaces. Would I still need nominations from districts if I collect 35 members’ nominations? No, nominations can happen either through district quorate general meetings OR 35 members’ nominations. Could I submit more members’ names or does it have to be exactly 35 members for nomination? Only 35 members’ names are required but more names in support of a nomination can be submitted. The wording in the election material (the candidates’ booklet) will read: Ms X plus 34 members regardless of the number of members in excess of the 35 required. The members must be in-service members (that is not student, associate or retired members). If our district holds a quorate General Meeting before 1 March, could we make nominations for both the By-election and the National Election? Yes, you can. In order to be eligible for nomination for election in the Sector and Section seats, what’s the ‘effective’ date under Rule? 21 January 2021 – this is the date on which the timetable was notified to the members on the register for sectors/sections. Are candidates entitled to know which district/workplace nominations have been received in their name? A candidate can ask whether a nomination has been received. The Office staff cannot provide lists of nominating districts and workplaces until the nominations close. This information will then be sent via circular to local districts and a link provided to this information in the weekly e-Bulletin and on the website. Who is eligible for nomination in the District 8 By-elections? In order to be eligible for nomination, a candidate must have at least three years' prior membership of the Union. Members, other than student members and those who have retired or those who have otherwise left the profession, shall be eligible for nomination for Electoral District Members Seats in accordance with Rules 13.8.7 and 13.12.4. Who is eligible for nomination in the District 11 By-elections? In order to be eligible for nomination, a candidate must have at least three years' prior membership of the Union. Members, other than student members and those who have retired or those who have otherwise left the profession, shall be eligible for nomination for Electoral District Members Seats in accordance with Rules 13.8.7 and 13.12.4. The candidates must be women. Roles and responsibilities of national officers PresidentThe President chairs conference, the Executive and the Officer Steering Group, as well as representing the Union on the national and international stage.Senior Vice-PresidentThe Senior Vice-President will take office as President from September 2025.The Senior Vice‑President elected shall be the President in the year following his or her election and shall hold office as Past‑President during the two years next following provided membership of the Union be retained.Junior Vice-PresidentThe Junior Vice-President will take office as President from September 2026.The Junior Vice‑President elected shall be the Senior Vice‑President in the year following his or her election and shall hold office as President and Past‑President respectively during the two succeeding years provided membership of the Union be retained.Treasurer The Treasurer of the Union plays a vital role in relation to the best use of the NEU resources, including your subscriptions and is responsible to the Executive and Conference for the overall administration of the Union’s finances.Membership & equalities officerThe Membership & Equalities Officer has an overview of and contributes to the Union’s recruitment and equalities strategies."
year_published = 2025
