["https://neu.org.uk/about/nations/neu-northern-ireland/teachers-pay-campaign-northern-ireland/joint-consultations-workload"]
title = "Joint consultations on workload | National Education Union"
description = "Northern Ireland members will be consulted on workload issues from 20 February to 10 March. Book now"
full_description = "Following the outcome of the NITC constituent members consultation around the pay offer from management side, NITC informed management side that it was not in a position to accept the offer.NITC has requested that further negotiations take place in an attempt to find a solution that is acceptable to teachers and school leaders. While the recommendations of the Workforce reviews being enacted has the potential to create the conditions for a reduction in teacher workload, NEU along with other teaching unions remain keen to engage with members to find a definitive understanding of the workload issue in schools.Any proposed change to working conditions cannot be a one size fits all solution as the issues will vary depending on which sector (primary, post primary, special, nursery or support services) teachers or school leaders work in.To this end, NEU, INTO and UTU are organising joint consultations with members beginning next Thursday in Belfast at The Stormont Hotel, with regional meetings in Omagh, Ballynahinch, Ballymena, Derry, Newry, Armagh and Cookstown running until the 10th of March. Meetings will be between 4:30 and 6:30 pm.It is hoped that by end of the consultation we will have some specific proposals to put to management side to address workload at school level.The Joint Consultation Meeting with members in the City Hotel, Derry, scheduled for Tuesday 4 March has been rescheduled to Monday 3 March. The time and venue remains the same, 4.30 – 6.30pm in the City Hotel Derry.LocationDateRegistrationBelfast: Stormont HotelThursday, 20 FebruaryRegister HEREOmagh: Silverbirch HotelMonday, 24 FebruaryRegister HEREBallynahinch: Millbrook Lodge HotelTuesday, 25 FebruaryRegister HEREBallymena: Tullyglass House HotelWednesday, 26 FebruaryRegister HEREDerry: City HotelMonday, 3 MarchRegister HERENewry: Canal Court HotelWednesday, 5 MarchRegister HEREArmagh: Armagh City HotelThursday, 6 MarchRegister HERECookstown: Glenavon HotelMonday, 10 MarchRegister HERE"
