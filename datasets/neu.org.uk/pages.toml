description = "For advice and support on employment issues."
full_description = "Breadcrumbs Home About Contact us AdviceLine AdviceLine About advicelineWe provide advice on your rights and how to resolve employment issues as a union member. Our expertise can help you to enforce your rights and to build union strength in the workplace. For support with your mental health and general well-being, please see the details for the Education Support Partnership. Opening hours :AdviceLine phone lines are open Monday – Friday, 9 am – 7 pm, except for 11 am -12 pm every Tuesday. Having issues at work? If you are experiencing work-related issues, contact your workplace representative. If there is no representative in your workplace, consider electing one.Please also check the adviceline FAQ and advice pages to see if your issue is covered. For queries about existing issues being handled by an NEU caseworker, please contact your caseworker directly. The AdviceLine cannot cross-advise on existing casework. Unfortunately, the NEU cannot offer representation or assistance, including advice, for problems that existed before joining the NEU. How to contact adviceline:You can complete the adviceline contact form for straightforward enquiries and one of our advisors will respond as soon as possibleAlternatively, if your issue is more complex you can call us on 0345 811 8111.When calling, please have the following details ready:Your NEU membership number.Type of workplace you work at (e.g., maintained school, academy, independent). Relevant documents such as a copy of your contract and workplace policies. A brief timeline of the main events related to your enquiry.Please note that due to high call volume, longer waiting times are expected. I have read all of the above and want to message adviceline Contact adviceline Facebook Facebook (opens in a new window) Twitter Twitter (opens in a new window) LinkedIn LinkedIn (opens in a new window) Back to top"
