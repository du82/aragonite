["https://neu.org.uk/advice"]
title = "Advice | National Education Union"
description = "Maintained (local authority) schools:Teachers’ national sick pay entitlements, set out in the Burgundy Book, give a sliding scale according to aggregated service as follows:In your first year of teaching you are entitled to full pay for 25 working days and after 4 calendar months you are entitled to 50 working days on half pay.In the second year of teaching you are entitled to full pay for 50 working days and half pay for 50 working days.In the third year of teaching you are entitled to full pay for 75 working days and half pay for 75 working days.In the fourth year and subsequent years of teaching you are entitled to full pay for 100 working days and half pay for 100 working days.The sick leave entitlement runs from April 1st until March 31st. It should also be noted that the Burgundy Book scheme operates on the basis of working days; holidays and weekends do not count against these entitlements. Teachers are required to submit fit notes over holiday periods if they would have been too unwell to attend work.  Academies, Independent and Free schools:These schools may set their own sick pay schemes, but a number follow the provisions of the Burgundy Book sick pay scheme.  Any variations will be set out in your contract of employment and should be checked for details.  You should also check your employer’s sick policy.Teachers’ sick pay"
full_description = "Frequently asked questionsThe five most common questions asked by members: What is my sickness entitlement as a teacher? Maintained (local authority) schools:Teachers’ national sick pay entitlements, set out in the Burgundy Book, give a sliding scale according to aggregated service as follows:In your first year of teaching you are entitled to full pay for 25 working days and after 4 calendar months you are entitled to 50 working days on half pay.In the second year of teaching you are entitled to full pay for 50 working days and half pay for 50 working days.In the third year of teaching you are entitled to full pay for 75 working days and half pay for 75 working days.In the fourth year and subsequent years of teaching you are entitled to full pay for 100 working days and half pay for 100 working days.The sick leave entitlement runs from April 1st until March 31st. It should also be noted that the Burgundy Book scheme operates on the basis of working days; holidays and weekends do not count against these entitlements. Teachers are required to submit fit notes over holiday periods if they would have been too unwell to attend work. Academies, Independent and Free schools:These schools may set their own sick pay schemes, but a number follow the provisions of the Burgundy Book sick pay scheme. Any variations will be set out in your contract of employment and should be checked for details. You should also check your employer’s sick policy.Teachers’ sick pay What are the relevant notice periods for teachers? Maintained (local authority) schoolsYou must give the following notice in line with the Burgundy Book:2 months’ notice submitted by 28 February to leave on 30 April3 months’ notice submitted by 31 May to leave on 31 August2 months submitted by 31 October to leave on 31 DecemberYou are free to try and negotiate an earlier release date, but this will be at the head’s discretion and they are under no obligation to release you early. If you miss the notice deadlines set out above your head may retain you until the next leaving dates set out above. If a notice deadline set out above falls in a school holiday you can still email your notice to the head by the required date.Academies and Free SchoolsThese are usually the same as maintained schools but check your contract.Independent schools and collegesYou must give notice as per your contract. As with maintained schools, you are free to try and negotiate an earlier notice period, but this will be considered at your employer’s discretion. Notice periods How much maternity pay am I entitled to? Your rights to maternity leave and pay depend on a number of factors. These include your pregnancy dates, your role, your employment status, your type of school or college, your length of continuous service, what your NEU reps have negotiated and your earnings. To access your rights, you’ll need to notify your employer of your intention to take maternity leave and pay. To work out your entitlements, please read our Maternity leave and pay overview, which will signpost you to more detailed guidance specific to your circumstances.Find out more advice on maternity leave and pay What is included in directed time under the School Teachers’ Pay and Conditions Document (STPCD)? All timetabled teaching time, PPA, registration, mid-session breaks, trapped time, staff meetings, parents’ evenings, INSET days – it essentially includes all time you are directed to be working in the school except for your lunch break. After-school clubs are voluntary, so if you choose to participate in them, they cannot be included in your directed time. See our frequently asked questions on directed time for more.Read more about directed time. An allegation has been made against me. What should I do? You need to establish what action your employer is going to take. Your employer has a duty to investigate any allegations they receive. The investigation is a fact-finding exercise to collect all the relevant information about the allegation. It is likely you will be asked for your version of events at an investigation meeting. If you are invited to an investigation meeting there is no statutory right to have representation at an investigation meeting however, some employers will allow you to be accompanied. If allowed, you can ask your workplace NEU school representative or, if there is no rep, a trusted colleague to attend with you. Your rep or colleague cannot speak on your behalf during an investigation meeting. The NEU does not routinely arrange representation at investigation meetings for this reason and because no action can be taken against you at the investigation stage.Contact the Union if you are suspended or invited to a disciplinary hearing. Disciplinary model policy"
year_published = 2025
clearnet = "https://neu.org.uk/advice"
