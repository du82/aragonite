title = "Barnet | National Education Union"
description = "NEU's Barnet District was formed on 1st January 2019 following the amalgamation of the National Union of Teachers (NUT) and the Association of Teachers and Lecturers (ATL).I hope you find these pages useful and please let me know if there is anything else you would like added.Keith Nason, SecretaryBarnet District is in the London Region. If you need to contact the London Office please call 020 8477 1234 or use the email contact form."
full_description = "Need Help or Advice Your first point of contact for advice and support from the union should be your National Education Union workplace representative. Before contacting the Advice Line, Branch, District or Region please see if your query can be addressed in our advice section. Barnet NEU WhatsApp Groups RepsReps and Ballot VolunteersHealth and SafetyBlack EducatorsLGBT+EYFSCovid Support including Long CovidTo maintain members privacy, if your phone number does not match the membership records you may be removed from a group.Many school NEU groups have their own WhatsApp - please ask your rep (if your school does not have a rep, how about you being the rep?) Annual Conference Delegates Your delegates for Annual Conference 2025 are:David BallDominique Carruthers-ReeveMatthew CooperEfrem CraigJessica DunnSarah EatonTamamzer KavrutBahir LaattoeKate ManktelowIlga MezatucaKeith NasonZeenat Syed Committee 2024/2025 President: Efrem CraigSecretary: Keith NasonAssistant Secretaries: Dominique Carruthers-Reeve and Sarah EatonTreasurer: Beveley SmithEqualities Officer: Bahir LaattoeHealth and Safety Adviser: VacantEnvironmental Officer: Ilga MezatucaIndependent Schools Officer: Margaret BoyleInternational Solidarity Officer: Bahir LaattoeSupply Teacher Officer: Zeenat SyedSupport Staff Officer: David BallWomen's Officer: Kate ManktelowCommitte Members:Louise Dobson (ex-Offico - Barnet and Southgate College Joint Branch Secretary)Zoe MacGechan (ex-Offico - Barnet and Southgate College Joint Branch Secretary) Barnet's National Executive members Barnet District is in National Executive District 15 (I know it is confusing for District to have two definitions in the NEU) along with Brent, Ealing, Enfield, Harrow, Hillingdon, Hounslow, Kingston upon Thames, Merton, Richmond upon Thames, Sutton.For more details about the National Executive please go to National Executive webpage."
