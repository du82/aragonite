["https://neu.org.uk/about/about-us/political-fund/party-conferences"]
title = "Party conferences | National Education Union"
description = "Each year, the NEU participates in the Green, Liberal Democrat, Labour, and Conservative Party Conferences, held throughout September and October."
full_description = "What are party conferences?Party Conferences are key gatherings organised by political parties, providing an opportunity for members and leaders to come together to discuss policies, set agendas, and shape the direction of the party. For Green, Liberal Democrat, Labour members, conference also provides an opportunity to debate and vote on party issues.Conferences are attended by politicians, party members, the media, trade unions, and a variety of other organisations. They give the NEU a platform to engage directly with policymakers, advocate for our campaigns, and highlight the critical issues facing education today.What is TUC Congress?In addition to party conferences, the NEU also takes part in TUC Congress. Affiliated unions send delegates to Congress to propose, discuss, and vote on motions that will guide the TUC's work for the coming year. What role can the Green Party play in shaping education policy in the new Parliament? How the Green Party can make an impact on education and reduce inequality. What does Labour’s first Budget and spending review need to deliver to break down barriers to opportunity? What investments are needed to ensure every child and young person can thrive? What should the Liberal Democrats' priorities on education be for the new Parliament? Using new strength to set priorities. Is social media a friend or foe of young people? Would banning children’s access to social media and smartphones better protect their mental health? What should the Conservatives' priorities be on education in the new Parliament? As the Official Opposition, the Conservative Party's role in shaping the future of education has evolved. Is social media a friend or foe of young people? NEU/CES Would banning children’s access to social media and smart phones better protect their mental health?"
year_published = 2025
