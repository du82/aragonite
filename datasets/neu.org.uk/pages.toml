["https://neu.org.uk/about/reps/learning-reps"]
title = "Learning reps | National Education Union"
description = "Our workplace learning representatives are accredited union reps and are there to support members with their professional and personal learning."
full_description = "Our workplace learning representatives are accredited union reps and are there to support members with their professional and personal learning and use the learning agenda to build and strengthen the NEU through organising, reaching out to non-members and supporting union policy and campaigns.What does a workplace learning rep do?Identify learning needs of membersWork with management to improve access and quality of current provisionDevelop a trade union approach to learning and recognise sources of supportListen to members concerns on learningPromote CPD opportunitiesInvolve members in the NEU through learning and CPDUsing learning to organise in the workplaceBeing a workplace learning rep offers the opportunity to:Get involved in the NEUUse learning to support members in the workplaceBuild and strengthen the NEU though the learning agendaRecruit non-membersSupport union policy and campaignsLegal rights of workplace learning repsThe 2002 Employment Act introduced statutory rights to time off for union appointed workplace learning representatives to carry out their duties and to attend training. The new provisions came into force in April 2003, as did a revised Advisory, Conciliation and Arbitration Service (ACAS) code of practice which included guidance on their practical application. These rights include:reasonable paid time off to train as a WLRreasonable paid time off to carry out the duties of a WLRIn addition, the Code of Practice recommended that:reasonable time off should also be considered for further training to help Union WLRs develop their skills and competencies.it may be helpful if WLRs attended meetings concerned with agreeing and promoting learning agreements.employers may also see it in their interests to grant paid time off for WLRs to attend meetings with external partners concerned with the development and provision of workforce training.recognition be given to the varying roles of WLRs where the post holder also undertakes additional duties as a union representative.Statutory functionsThe functions for which time off as a WLR is allowed are:analysing learning or training needsproviding information and advice about learning or training mattersarranging learning or trainingpromoting the value of learning or trainingconsulting the employer about carrying on any such activitiespreparation to carry out any of the above activitiesundergoing relevant training.In practice, your role and responsibilities as a WLR will vary depending on your workplace but the expectation is that you will carry out at least one or more of the above functions.Rights of MembersThe legislation also gives union members an entitlement to unpaid time off to consult their workplace learning representative, as long as the union is recognised in their workplace."
year_published = 2025
