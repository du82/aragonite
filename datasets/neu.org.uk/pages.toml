description = "The Support Staff National Council (SSNC) is the main representative body for support staff within the National Education Union."
full_description = "It is made up of representatives from the Regions, Wales and Northern Ireland, as well as three representatives of the NEU Executive. It is chaired by the support staff reserved seat-holder on the Executive . The Support staff national council (SSNC) meets on a termly basis.The SSNC has been given a two-pronged remit by the NEU Executive: Organising, and Policy Development:OrganisingThe main focus of NC meetings will be on sharing members’ experiences of organising activities.SSNC members are expected to engage with members and help develop local activist networks at Regional/Wales/Northern Ireland level, and also to report in writing to each Regional/Wales/Northern Ireland Council meeting and engage with Regional/Wales/Northern Ireland Council delegates as required. Policy DevelopmentThe NC shall be responsible for advising the Executive on matters which the Executive has asked it to consider, allowing for more detailed work than strategy committees are able to undertake.Organising and/or policy recommendations will go to the Executive and/or its strategy committees, as determined by the Officer Steering Group."
