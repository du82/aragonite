full_description = "IntroductionSince September 2020, Relationships Education, Health Education, and Relationships and Sex Education became compulsory in England. Relationships, Sex and Health Education is sometimes shortened to RSHE.From September 2021, schools are expected to teach an RSHE curriculum that meets the Department’s statutory guidance.The NEU wants to support all schools to build an effective, inclusive and needs-led RSHE. We encourage schools to keep engaging with parents and pupils as much as possible to help inform curriculum planning and to identify gaps in learning that may have been exacerbated by the pandemic, so that topics can be picked up later. Relationships education - model policy for primary schools The aim of this model policy on relationships education for primary schools is to provide a framework that schools can adopt to updating your policy and will help you to comply with the requirements. Relationships and sex education - model policy for secondary schools The aim of this model policy on relationships and sex education (RSE) for secondary schools is to provide a framework that schools can adopt to update their RSE policy. AGENDA teachers resource AGENDA is an online resource for educators who want to empower children (age 7-18) to make positive relationships matter in their schools and communities. Supporting trans and gender questioning students Advice to help school and college staff support gender variant or questioning students in the educational environment. Preventing sexism & sexual harassment This toolkit aims to help NEU members take the steps needed to prevent sexism and sexual harassment. RSHE guidance for schools Yet more culture war noise from an ill-informed and out of touch Government. NEU and NSPCC survey into school readiness for RSE lessons 2020 New relationships and sex education lessons ‘undermined’ as teachers have said they lack confidence."
