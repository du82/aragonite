["https://neu.org.uk/about/about-us/neu-structure/national-councils-and-organising-forums/independent-sector-national-council"]
title = "Independent sector national council | National Education Union"
description = "The National Council – the independent sector is an elected member group that helps organise and promote the engagement of members working in the independent sector."
full_description = "It is one of the dedicated representative groups representing several specific Sections or specific interest groups. In respect of members working in the independent or FE sector; or members working in support staff or leadership roles; these groups are called National Councils. Other groups are known as Organising Forums.About the National CouncilThe group comprises representatives elected by Regional/Wales Councils and 3 Executive members. Regional/Wales representation is based on 3 per area (at least two of whom should be female) with 5 from the London Region (at least three of whom should be female). The Executive will elect one of the Executive members as Chair, and the Vice-Chair will be elected by the Regional/Wales representatives.RemitThe focus of Regional/Wales National Council representatives is to encourage and facilitate the active participation of independent sector members in the union. Amongst other things, this includes helping to develop local activist networks, promoting local sector events or campaigns.Integral to this is working with colleagues on the Regional/Wales Council. This includes attending, and providing a written report to, the Regional/Wales Council meeting.PolicyThe Executive may ask the National Council to consider and advise on policy issues relating to the sector, to allow more detailed work than strategy committees are able to undertake.Organising and/or policy recommendations will go to the Executive and/or its strategy committees, as determined by the Officer Steering Group.MeetingsThe group meets once a term. This is usually on a Saturday in London, expenses are paid. This academic year, the Council meets on 19 October 2024, 8 February 2025, and 17 May 2025.Annual conferenceThe group also plays an active role in the yearly NEU independent sector conference.MembersThe National Council Independent Sector members are as follows :Carolina Avila-JonesSara BassettMelanie CaiazzaDan CurranEmma Douglas Lee FlanaganRebecca HayesHannah LakeJo LyonsEdel McInerneyBrian MetcalfShaun Murtagh-HowardLoretta NwakaFran RylandClaire RickardPhil RowettRaul Sanchez SauraJames SnyderDawn TaylorStuart TaylorJade WatsonGetting involved locallyIf you would like to be involved in local activity in the sector, please contact the Regional Secretary and ask to be put in contact with your regional independent sector representatives.Applying to be on the National CouncilApplications were invited from interested members over the summer. Not all places were filled. If you are interested in applying, please contact your Regional Secretary to express your interest."
year_published = 2025
