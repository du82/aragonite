full_description = "Education is key to deconstruct racial narratives. This is essential to achieve progress towards racial equality, reduce harassment and combat violence. Schools and colleges have a significant ability to impact how children and young people feel about themselves, each other and their community. The NEU is committed to supporting our members and workplace representative to share good practice about education which counters the far right; which challenges perceived ideas around race; and which actively builds anti-racist teaching practice.The far-right is also disseminating views which are sexist, undermine LGBT+ equality and disability equality. Stand up to Racism (SUTR)The NEU is partners with SUTR and encourages members to look out for rallies, local meetings and events in your area. A whole school approach to challenging racismThis NEU framework supports schools and colleges to open conversations about racism, your local context and community. It prompts questions about where your school strategy is good and where it might need more thinking. Anti racist Framework"
