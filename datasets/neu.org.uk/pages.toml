["https://neu.org.uk/advice/classroom/behaviour-schools/creating-sense-place-and-belonging-schools"]
title = "Creating a sense of place and belonging in schools | National Education Union"
description = "The importance of creating an environment where everyone can feel confident and safe in their identity."
full_description = "The NEU commissioned research, 'Place and Belonging in School: why it matters today' offers examples of how intentional whole-school practice can help create a climate of welcome and belonging in school. A purposeful approach which brings everyone on board, enriches the lives of all concerned and sets the school on a positive and upward trajectory.The context for the research was one of growing concerns about the rapid increase in rates of exclusions and alienation, and the impact of this on young people’s well-being mental health and life chancesThis report illustrates what is possible – even in the most challenging of contexts – and how rewarding and joyful this is.The Belonging ChallengeThe Belonging Opportunity1 in 4 young people feel they do not belong in school: a figure which is rising.A sense of belonging has been linked to:Children from disadvantaged communities are twice as likely as their more advantaged peers to feel they don’t belong and four times more likely to be excluded.Increased student motivation.Black Caribbean and special educational needs children are more likely to be excluded than their peers.Increased staff well-being, motivation and retention.Young people who experience a sense of exclusion from school or society seek ‘belongingness’ elsewhere.Reductions in student absenteeism.-Other positive social outcomes e.g. health and well-being.-Improved academic achievement.-A growing sense of agency in students and staff: a belief that they can make a difference. Place and belonging in school: Why it matters today Case studies from a research-based inquiry undertaken by The Art of Possibilities & UCL, Institute of Education. Belonging, behaviour and inclusion in schools: What does research tell us? A Research-based Inquiry undertaken by The Art of Possibilities & UCL, Institute of Education. Belonging and leadership The NEU’s ‘Belonging’ research highlights that where school leaders developed an intentional approach focused on changing learning and teaching."
