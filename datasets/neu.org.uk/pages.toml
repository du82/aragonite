["https://neu.org.uk/abolish-ofsted/ofsted-risk-assessment-guide"]
title = "Ofsted risk assessment guide | National Education Union"
description = "Risk assessment guide to help employers, in consultation with the recognised trade unions, assess the extent of harm that may be caused by the Ofsted process and take practical steps to minimise these risks."
full_description = "What is a risk assessment?It is a systematic process of identifying hazards (anything which could cause harm in the work environment), evaluating the risk of such harm arising and implementing reasonable control measures to prevent or reduce the risk. It is a legal requirement upon employers who have a duty not only to assess the risks to the health and safety of employees whilst at work but also to do the same for ‘persons not in their employment’, which includes pupils. Schools also owe a duty of care to pupils to safeguard them from harm and promote their wellbeing.Who should undertake such a risk assessment and when should it happen?Risk assessments are the responsibility of employers under health and safety law. In a school this could be a local authority, trust, or governing body, depending on the school’s status. Doing this properly means employers ‘having the back’ of school leaders and other staff so that nobody feels that they are bearing this burden alone.The role of NEU reps/health and safety reps is to press for, and be consulted on, the risk assessment to make sure it is suitable and sufficient.Such a risk assessment should be conducted and reviewed at regular intervals, not just undertaken once Ofsted has announced its visit, because the impact of an Ofsted inspection isn’t limited to the actual inspection, nor to the immediate time before or after.Why should the Ofsted process be risk assessed?Ofsted is a pressurised and high stakes inspection system which can cause anxiety, stress and unsustainable workload for staff, including leaders. According to the latest health and safety statistics, the education sector has higher-than-average rates of work-related stress, depression or anxiety. Ofsted can also cause distress for pupils according to latest NEU polling, which highlights pupils feeling belittled and in tears following meetings with inspectors.The impact of an impending Ofsted inspection and its aftermath on staff, including leaders, is well documented. NEU’s Job Quality report (2023) shows that teachers have increased job satisfaction when they believe that the tasks that they undertake are worthwhile to their pupils. Being overburdened with tasks that only serve a bureaucratic purpose leads teachers to feel stressed and undervalued as professionals. The NEU’s School leadership in current times: As school leaders see it (2023) shows that leaders feel that Ofsted pressure and preparation for inspection is the major cause of their frustration.In some tragic cases, Ofsted has been identified as a contributory factor to suicides. In the case of Ruth Perry, the coroner found that a ‘rude and intimidating’ Ofsted inspection contributed to her suicide, a belief shared by her GP. The coroner also stated that unless action is taken there is a risk that future deaths could occur.The title of Ofsted’s response to the coroner’s findings: ‘Prevention of Future Deaths’ is a stark reminder about the severity of the harm that can be caused by Ofsted."
year_published = 2025
