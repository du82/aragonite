["https://neu.org.uk/about/about-us/political-fund"]
title = "Political fund | National Education Union"
description = "The funds we collect from members who wish to contribute will be used to influence politicians at events including party conferences, to oppose racism and fascism, and to encourage people to register to vote."
full_description = "The NEU does not affiliate to and does not financially support any political party. The NEU is the largest unaffiliated union in the country. We maintain our political independence in order to persuade every party to make the best decisions for education professionals and children and young people.Like 17 other unions in the TUC, the NEU has a non-party political fund whereby members can opt to pay a small amount on top of their membership subscriptions to support our campaigning work.Non-party political funds are not uncommon among trade unions - education unions, NASUWT, UCU, EIS and Prospect have funds and they also don’t affiliate to any political party.The rules of the NEU state that the political fund can only be used for the following activities:To encourage members, people generally or specific groups of people (e.g. young people) to register to vote.To persuade people not to vote for political parties and their candidates who promote racist, fascist or similar views.To pay for the NEU’s attendance at the annual conferences or other meetings of political parties.How did the NEU political fund come aboutThe NEU’s political fund was set up in November 2017 after members voted YES in a ballot to it being established.How to opt-outMembers can opt-out of contributing to the fund by completing and returning a notice of exemption. BallotThe NEU’s non-party political fund was set up in November 2017 after members voted YES in a ballot. The funds we collect from members who wish to contribute will be used to influence politicians at events including party conferences, to oppose racism and fascism, and to encourage people to register to vote.The union will on request supply the result of the ballot and the independent Scrutineer’s Report to a member of the National Education Union, free of charge. Please send your request to [email protected]. doc Notice of exemption"
year_published = 2025
clearnet = "https://neu.org.uk/about/about-us/political-fund"
