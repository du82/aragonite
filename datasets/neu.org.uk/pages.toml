["https://neu.org.uk/advice/data-protection-workplace-reps"]
title = "Data protection for workplace reps | National Education Union"
description = "Reps’ responsibilities relating to data protection."
full_description = "As a union rep you are implicitly agreeing to abide by the union’s responsibilities to data protection. You will have access to lists of members in your workplace and handle some casework, so it is important you use reasonable security measures to safeguard members’ data at every stage.This guide highlights the core of your responsibilities and will be updated as appropriate.Start of role - workplace repAt the start of your role as a rep carrying out the following should ensure a responsible approach to data protection:Read and understand and keep to hand this page, making a note of where other supporting information can be found, eg reps’ training course materials. Read and understand the data protection statement - as a rep you have implicitly signed up to this.Register and receive your official union access to members’ lists.All devices where you may access lists of members must be password-protected or ensure you have your own secure login if the device is a shared resource.You are not obligated to share the list of members in your school with your head/principal or anyone else, under any circumstances. Rights and obligations A broad outline of rights and responsibilities under data protection legislation. Disclosing capability information The circumstances in which schools in England may disclose capability information to prospective employers. Health enquiries and applicants for work Clarification of the circumstances in which existing and prospective employers are entitled to make enquiries about a worker’s health. Data protection Advice on what rights you have in relation to data about you, what data reps can use and the rules around capability and health information."
