["https://neu.org.uk/about/reps/health-and-safety-rep"]
title = "Health and safety rep | National Education Union"
description = "Resources and information for NEU health and safety representatives."
full_description = "Excessive workload, harassment, deteriorating buildings and the impact of climate change are amongst some of the key health and safety concerns of education workers. Becoming a health and safety rep is exciting and rewarding, as you will be carrying out vital work.What does a health and safety (h&s) rep do?The single most important job of the h&s rep is to make everyone aware that the NEU is a strong collective voice for members. Strong union groups experience fewer workplace issues including health and safety issues – union presence stops management causing problems. Specific functions includePlan and carry out termly h&s inspections - using our checklist - at your workplace and submit subsequent reports to the employerBe available to talk to members about h&s questions and concerns, consider their collective potential and raise with managementInvestigate members’ concerns about health, safety, welfare and the environment and consider their collective potential and raise with management.Check that action has been taken to resolve any problems that have been reported to the employerBuild relationships with other union representatives and managers to help resolve potential h&s problems at an early stage. Play video Health and safety policy checklist The aim of this health and safety policy checklist is assist NEU reps to assess whether a policy to manage health and safety is acceptable. Health and safety model policy for academies The aim of this model policy on health and safety for academies is to provide a framework that schools can adopt to assess risks within the workplace, record their assessment of these risks and put measures in place to remove them. Safety rep inspection checklist The safety rep inspection checklist and report form is designed to help you carry out a safety inspection in your school or college and report any issues. Health and safety reps model letters Use these letters to help you in your role as health and safety representative to inform your employer of your appointment, to carry out safety inspections and to set up a safety committee."
