["https://neu.org.uk/about/reps/reps-resources/our-bargaining-strategy"]
title = "Our bargaining strategy | National Education Union"
description = "The NEU aspires to be a mass democratic, participatory union based on having an effective workplace presence. Central to this is our bargaining strategy."
full_description = "The key aims of our bargaining strategy are:Securing bargaining arrangementsMaintaining and extending national machinery and national arrangements.Tackling fragmentationReducing the number of bargaining units and extending multi-employer negotiations.Making bargaining meaningful & relevant for membersEnsuring member-determined outcomes in all cases.Supporting our negotiators at all levels Equipping and supporting lay negotiators to negotiate with their employer at their workplace.Central elements of the Bargaining Strategy are the bargaining calendar and the bargaining cycle. Bargaining calendar poster: Autumn term: Pay Poster to advertise a meeting on pay bargaining in your workplace during autumn term to make decisions together and democratically, so as a rep, you are mandated to negotiate changes. Bargaining calendar poster: Spring term: Appraisal and accountability Poster to advertise a meeting on appraisal and accountability bargaining during spring term to make decisions together and democratically, so as a rep, you are mandated to negotiate changes. Bargaining calendar poster: Summer term: Workload Poster to advertise a meeting on workload in your workplace during summer term to make decisions together and democratically, so as a rep, you are mandated to negotiate changes."
