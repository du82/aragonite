["https://neu.org.uk/advice/equality/sex-and-gender-equality/preventing-sexism-sexual-harassment"]
title = "Preventing sexism & sexual harassment | National Education Union"
description = "This toolkit aims to help NEU members take the steps needed to prevent sexism and sexual harassment."
full_description = "What does a whole school approach to preventing sexism and sexual harassment look like? And how do we make it happen?To properly address sexism and sexual harassment in schools, we need to address it across the school. To help ensure you are reaching all areas, the NEU has created this model looking at themes and threads across the school. Getting started: A whole school approach to preventing sexism and sexual harassment Getting started guidance, part of the NEU toolkit for preventing sexism and sexual harassment in schools. Empower, educate and inspire: how to support students to make change happen Know your rights, you have a right to be safe at work and to work free from sexist comments, sexual harassment and abuse. Sexual harassment: Ten top tips for your rights as a professional at work Use these top tips and model clauses to build your own school policies. Start conversations that will inform the content of your school policy. It’s Not OK: Ten top tips on using a bystander intervention model Taking a whole-school approach to developing a sense of community responsibility to prevent sexism and sexual harassment. Working with boys and young men to prevent sexism and sexual harassment Tackling misogyny, from banter to Andrew Tate, requires including boys and young men as part of the solution. It's Not OK whole school approach poster A whole school approach to preventing sexism and sexual harassment. It's Not OK school poster It's Not OK Poster for schools, who can add information about school’s support services at the bottom. It's Not OK: Sexism has become normalised poster National Education Union research found that sexism and sexual harassment in schools has been normalised and is rarely reported."
