["https://neu.org.uk/advice/classroom/safeguarding/fgm-mandatory-reporting"]
title = "FGM: mandatory reporting | National Education Union"
description = "As stated above, visual identification will generally apply to healthcare professionals. However, Home Office guidance states: “For teachers… there are no circumstances in which you should be examining a girl. It is possible that a teacher, perhaps assisting a young child in the toilet or changing a nappy, may see something which appears to show that FGM may have taken place. In such circumstances, the teacher must make a report under the duty, but should not conduct any further examination of the child.”Teachers in special schools or working with pupils with special educational needs (SEN) in mainstream schools may also have greater personal contact with pupils in terms of assistance with toileting or changing, and may also fall into the same category as those working with younger children.The union’s concern is that the Home Office statement implies the physical signs of FGM should be obvious to anyone that sees it, and yet the Government has previously acknowledged that even expert clinicians can struggle to identify cases. To ensure that you and other teachers at your school/college are not held up to the same standards as clinicians, you should seek written assurance from your employer that a failure to identify the physical signs of FGM will not lead to disciplinary action. If employers feel that that is an unreasonable request, they should invest in appropriate training for all their teaching staff."
full_description = "Female genital mutilation (FGM) involves cutting or injuring the female genital organs for non-medical reasons. It is a practice that is not condoned by any religion and can leave physical and mental scars on the girl involved. Since 1985, it has been illegal in the UK, but many young girls are sent abroad to have the procedure carried out.The police estimate that around 144,000 girls living in the UK were born of women from FGM-practicing countries. It is a widespread and complex issue predominantly involving countries in Africa and Asia. While parents may not wish their daughter to undergo a procedure, they may face pressure from their families and communities.The NEU has always welcomed the Government’s commitment to addressing FGM and believes that all types of gender-based violence can, and should be, tackled through partnership with health professionals, social care and the police.The NEU knows that the safeguarding of children is of paramount importance to members. Mandatory reportingUnder the mandatory reporting legislation, teachers are required to report known cases of FGM in under-18s to the police. A known case is where there has been visual identification (this usually applies to healthcare professionals) or direct verbal disclosure.If you are a teacher and a pupil who is under 18 informs you that they have undergone FGM, you must ring the non-emergency 101 number within 48 hours. You should make a note of your actions and record the police reference number as evidence that you have complied with the duty.The duty does not apply if the person has reason to believe that another person working in that profession has previously made an FGM notification in connection with the same act of mutilation.If you are in any doubt, you should speak to your designated safeguarding lead, but remember the duty is individual not organisational. Once you have made your report via the 101 number, you have met the duty. I am a teacher, not a clinician. How am I supposed to recognise the physical signs of FGM? As stated above, visual identification will generally apply to healthcare professionals. However, Home Office guidance states: “For teachers… there are no circumstances in which you should be examining a girl. It is possible that a teacher, perhaps assisting a young child in the toilet or changing a nappy, may see something which appears to show that FGM may have taken place. In such circumstances, the teacher must make a report under the duty, but should not conduct any further examination of the child.”Teachers in special schools or working with pupils with special educational needs (SEN) in mainstream schools may also have greater personal contact with pupils in terms of assistance with toileting or changing, and may also fall into the same category as those working with younger children.The union’s concern is that the Home Office statement implies the physical signs of FGM should be obvious to anyone that sees it, and yet the Government has previously acknowledged that even expert clinicians can struggle to identify cases. To ensure that you and other teachers at your school/college are not held up to the same standards as clinicians, you should seek written assurance from your employer that a failure to identify the physical signs of FGM will not lead to disciplinary action. If employers feel that that is an unreasonable request, they should invest in appropriate training for all their teaching staff. I have been told by a pupil that she has undergone an FGM procedure. What information will I need to give to the 101 operator? Explain that you are making a report under the FGM mandatory reporting duty and provide your details:work contact details and times when you will be available to be called back.your role.your place of work.Provide the details of your organisation’s designated safeguarding lead:name.work contact details.place of work.The girl’s detailsname.age/date of birth.address.If applicable, confirm that you have undertaken, or will undertake, safeguarding actions.The police recommend you explain to the girl that you are making the report and why. You should make the report within 48 hours. It is unlikely that a uniformed response is necessary; instead, a detective from child protection is likely to make a follow-up telephone call. What should I do if the matter falls outside of the above? Teaching assistants and other support staff are not covered by the mandatory reporting duty. They should instead follow the normal safeguarding route. A suspicion (as opposed to a disclosure) that FGM has been performed on a pupil should also be dealt with through the usual safeguarding procedures. The mandatory reporting duty only applies to a direct disclosure/visual identification.You should telephone 999 if it is an emergency, i.e., a pupil discloses that they or a sibling are in imminent danger of being subjected to FGM or if a pupil is suffering severe medical complications of FGM. What happens if I fail to report a direct disclosure? Failure to comply with the mandatory reporting duty (within 30 days) will not lead to criminal sanctions, but you may face disciplinary action. Is it right that I should be asked to ‘shop’ any pupil who informs me that they are going to visit relatives in a part of the world where FGM is practised? The union is concerned that, as with most safeguarding issues, there are schools/colleges and even local authorities that will act overzealously and impose far more onerous requirements on their staff than the law or Government guidance warrants. We are aware of schools, for example, that require staff to notify a senior manager whenever a pupil with a family from a country where FGM is practiced indicates that she is going there on holiday. The union believes this practice to be contrary to the public sector equality duty in that it promotes rather than eliminates race discrimination; instead of fostering good relations it alienates segments of the school community, particularly those of African and Asian origin. A holiday to a country in which FGM is practised may be a risk factor, but it should be viewed as only one of a number of factors to be considered when assessing risk. Staff should be asked to notify senior managers of a family’s holiday plans only in respect of children who are assessed as at risk and not of all children with a particular nationality or ethnic background."
year_published = 2025
clearnet = "https://neu.org.uk/advice/classroom/safeguarding/fgm-mandatory-reporting"
