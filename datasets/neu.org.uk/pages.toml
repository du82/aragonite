["https://neu.org.uk/abolish-ofsted"]
title = "Abolish Ofsted | National Education Union"
description = "The Beyond Ofsted Inquiry has called for an immediate pause to all routine Ofsted inspections to allow time to rest and regain the profession's trust. Duty of care must be any inspectorate’s top priority. School leaders can support this by:Removing reference to Ofsted - Remove all references to your school’s Ofsted grading from banners on your school gates and letterheads. Don’t mention it at parents’ evenings/open days.Stepping down from Ofsted roles - We urge you, alongside our sister union the NAHT, to step down from serving as Ofsted inspectors."
full_description = '''Make your voice heard! Get involved in the Ofsted consultation.Ofsted have announced the launch of a consultation covering plans for a new ‘report card’ system and Inspection Framework.Whilst the NEU continues to campaign on a national level for a new system that is supportive, effective and fair, it is vital that members make their views on Ofsted’s latest proposals by responding to the consultation.Ofsted promised to create something that will ‘feel very different’ – but what we’ve seen proposed isn’t progress.An inspection system should not cause teachers and other school staff sleepless nights, anxiety, and an urge to leave the profession. We will be issuing some tips to help on how to respond to the consultation shortly – watch this space.Respond to the consultation Is Ofsted ‘independent’? Education journalist Warwick Mansell questions Ofsted's claim of impartiality regarding recruitment to its controversial "curriculum unit" Hungry for change Students Hamza Shahbaz and Gabriel Perez detail their experiences of campaigning for much needed change in the education system, specifically around the outdated Ofsted inspectorate. Ofsted is more stick than carrot Jane Perryman, Professor of Sociology of Education at UCL, explains why only an alternative system to Ofsted can provide the support schools deserve. Ofsted: not fit for purpose Head teacher Cathy Earley shines a light on the startling gaps in Ofsted inspector expertise. Ofsted is a huge cloud constantly hanging overhead NEU Leadership member Phillipa Kearns describes working at the chalkface whilst the daily worry of receiving ‘the call’ looms large. An alternative to high-stakes inspection Ken Johnson, NEU Leadership member and head teacher, sets out his thoughts on an alternative to the toxic Ofsted inspection system. Ofsted’s consultation on new inspection proposals Ofsted's failure to take seriously the concerns of the profession shows it is incapable of introspection or change. This new consultation points only to continued disaster.'''
year_published = 2025
clearnet = "https://neu.org.uk/abolish-ofsted"
