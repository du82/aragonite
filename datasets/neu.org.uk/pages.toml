title = "National executive | National Education Union"
description = "City of Sunderland, City of York, Co Durham, Cumbria, Darlington, Gateshead, Hartlepool, Middlesbrough, Newcastle upon Tyne, Northumberland, North Tyneside, North Yorkshire, Redcar & Cleveland, South Tyneside, StocktonNicola HawkinsPaul WelchLouise Moores"
full_description = "The NEU Executive comprises the National Officers, 49 Geographical members, three equality constituency members and three sector seat constituency members. The Executive is responsible for the governance, management and control of the Union by Rule. The Executive meets eight times per year.Nominations for all executive seats are made by NEU districts and by workplaces (in specific circumstances as laid down in the rule) for geographical and sector seats.All members other than associate and student members are eligible to vote in the elections for the geographical seat-holders.In addition, members registered in the relevant employment categories (support staff, post-16 and independent) on the date the elections open (3 April) will be entitled to vote in the elections for the three-sector seat-holders.Members who have indicated on their membership record/equality information that they are Black, disabled and/or LGBT+ by the date the elections open will be eligible to vote in the elections for the three equality seat-holders. You can update your equality data by logging onto myNEU.Elections to the Executive and the Officer body are held biennially in alternate years. Information about these elections, and any by-elections occurring when we have vacancies on the Executive, is circulated to district officers. If you wish to know more about how candidates in these elections are nominated, please contact your district. National Officers (2024-2025)President - Sarah KilpatrickVice-President – Ed HarlowPast President – Emma RoseTreasurer - Hazel DansonMembership and Equalities Officer – Mairead CanavanExecutive schedule of meetings25 January 202513 March 202510 May 202512 June 2025 (Awayday - Provisional )19 June 202517 July 202526 September 2025 (Induction)27 September 202523 October 202529 November 2025 ConstituenciesEquality ConstituenciesBlack Member Constituency – HENRY, Denise SLGBT+ Member Constituency – DE GROOT, KaceyDisabled Member Constituency – JOHNSON, ColleenSector Seat ConstituenciesIndependent Schools Constituency – METCALF, BrianPost-16 Establishments Constituency – BLACKIE, DuncanSupport Staff Constituency – FARTHING, Emma"
