["https://neu.org.uk/about/reps"]
title = "Reps | National Education Union"
description = "Our reps are the heart of the NEU – the largest education union in Europe. The role of a workplace rep is really rewarding and many of the skills you will develop are transferable to your professional life."
full_description = "Whether in a school, college or elsewhere in the education service, the role of the workplace representative (rep) is a vital one for the National Education Union. Our reps help us build the union and support our members.Becoming a rep is a way to bring about positive changes in the workplace. By training as a rep, you will develop your skills, help to grow the union by recruiting new members, and encourage others to get involved to build a strong and effective workplace group. The NEU will support you every step of the way with a comprehensive rep training programme.We also provide tailored training for new and existing workplace, health and safety and union learning reps (ULRs). We have developed a comprehensive support and development programme, which enables reps to build their skills and confidence in union work.Whatever the scope of your role - from ensuring posters, advice and guidance are displayed on the staff noticeboard, to liaising directly with the head teacher or principal, to representing your work colleagues - we could not function without you. Workplace reps Whether in a school, college or elsewhere in the education service, the role of the workplace representative (rep) is a vital one for the National Education Union. Learning reps Our workplace learning representatives are accredited union reps and are there to support members with their professional and personal learning. Winning in the workplace Local campaigns and success stories of reps and activists across the country. NEU awards NEU present recognition awards to members, officers or individuals who are committed to education and have made exemplary contributions in their workplace or district or branch."
