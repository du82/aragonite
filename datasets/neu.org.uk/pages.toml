full_description = "There are a range of reasons why behaviour that challenges is on the increase including reductions in support staff in classrooms and individual student support, the growth of unmet SEND need due to long waiting times for assessment and specialist support, and increased child poverty leading to hunger.We advise that conversations about behaviour should actually be conversations about well-being, setting clear expectations about school values and understanding what are the barriers to learning.Creating a behaviour policy that gives staff confidenceSupporting positive behaviour, social and emotional skills is a challenging part of professional practice. Staff need time to talk about the behaviour policy, collaborate with colleagues and refer students with specific need for extra help. Reviewing behaviour policy Practical advice on reviewing your behaviour policy for a whole school approach to making meaningful change. Behaviour policy checklist for schools and colleges The aim of this checklist on behaviour is to provide a framework that schools can adopt to enable the support, appropriate information and understanding that is needed for success. Behaviour policy checklist for early career teachers and mentors The aim of this checklist on behaviour for early career teachers (ECTs) and their mentors is to provide a framework that schools can adopt to enable the support, appropriate information and understanding that is needed for success. Positive behaviour management – England/Northern Ireland This guide offers tips on supporting key areas of behaviour as you develop your experience in the classroom. Positive behaviour management – Wales (Bilingual) This guide offers tips in English and Welsh on supporting key areas of behaviour as you develop your experience in the classroom. Individual pupil behaviour - risk assessments Behaviour risk audits have the maximum degree of success where there are established systems for the efficient collation of pupil behaviour data."
