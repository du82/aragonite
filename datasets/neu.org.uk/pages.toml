full_description = "Family rights Teachers and support staff rights to time off to deal with family-related issues, from child birth to a death in the family. Sex discrimination All teachers and educational professionals have specific protection from discrimination at work on grounds of sex, marriage, civil partnership, pregnancy, maternity and transgender status, and to equal pay under the Equality Act 2010. Being pregnant at work The rights of pregnant teachers and support staff - to privacy and dignity at work, individual risk assessments, safe and fair working arrangements. Breastfeeding women at work How to help secure safety, privacy, dignity and equity for women who are breastfeeding on return to work from maternity leave. Pregnancy loss and termination Support for teachers and support staff in schools and colleges experiencing pregnancy loss or termination. Preventing sexism & sexual harassment This toolkit aims to help NEU members take the steps needed to prevent sexism and sexual harassment. Working through the menopause Menopause support - workplace guidance, adjustments, and resources for educators. Domestic abuse and the workplace toolkit This NEU toolkit is designed to support members affected at work by domestic abuse and to help other members, reps and leaders support them. Adultification of Black girls in secondary education Report out of a Westminster roundtable convened by the NEU and the All-Party Political Group on Race and Equality in Education. Challenging gender stereotypes in STEM Resources for the classroom help girls learn about female role models in STEM subjects and support their aspirations and subject choices. Breaking the Mould The NEU worked with five primary schools over two years to consider how ‘traditional’ gender stereotypes could be challenged in nursery and primary classrooms. Women Chainmakers If ever there was a moment in time to evaluate the progress made towards gender equality, that moment is now."
