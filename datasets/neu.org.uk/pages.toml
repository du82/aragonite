["https://neu.org.uk/advice/equality/lgbt-equality/trans-educators-toolkit"]
title = "Trans educators toolkit | National Education Union"
description = "Toolkit with advice and guidance on transitioning for trans educators and employers."
full_description = "The NEU is committed to the important right for people who are trans or non-binary to self-identify. The NEU recognises trans and non-binary identities and is aware and concerned about the unacceptable levels of discrimination faced by trans and non-binary staff in workplaces and within society.This toolkit includes guidance on transitioning from the point of view of trans educators and of their employers.All trans teachers and educational professionals have specific protection from harassment and discrimination at work on grounds of sex and transgender status under the Equality Act 2010, and from the unlawful disclosure of transgender status.You are protected whether you are a man or a woman, before, after or during your gender re-assignment. You are protected if you live your life in the gender opposite to your birth gender, whether or not you are under medical supervision.You are protected whether you are permanent, fixed-term, full-time, part-time, supply or agency. Advice for trans educators This know-your-rights guide is primarily to support trans educators who are proposing to transition at work. Advice for employers on transition care plans This guide is designed to support school leaders and other educational professionals in ensuring good practice around planning for trans staff."
