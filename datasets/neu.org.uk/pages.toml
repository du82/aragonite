full_description = "Suspensions and permanent exclusions A reversal in suspension and exclusion figures requires bold and significant change to a system run into the ground by the previous administration. Teacher wellbeing index Lack of funding for SEND and mental health specialists has real consequences. Research shows decline in reading for pleasure Reading for pleasure is an essential part of children’s literacy, wellbeing, and all-round development. Pay scales for support staff Pay scales for support staff in England, Wales and Northern Ireland. Most support staff are employed on the local government pay scales determined for local government services. Supporting members with long Covid Northern Ireland principals and managers guide to supporting staff with long Covid. Teachers’ terms and conditions Details of the legislation and negotiated agreements that make us the terms and conditions of teachers in Northern Ireland. Sick leave and attendance procedure Specific advice on sickness absence monitoring for teachers in Northern Ireland. Teachers’ time budget arrangements No teacher in Northern Ireland should be directed to work more than 32.4 hours in a single week. Equality legislation Comparing the equality legislation between Great Britain (GB) and Northern Ireland (NI). Maternity rights All teachers in Northern Ireland are entitled to one years’ maternity leave consisting of 26 weeks ordinary and 26 weeks additional leave. Shared parental leave The Work and Families (Northern Ireland) Act 2015 provides an opportunity for parents to take advantage of additional flexibility in the way they choose to care for a new arrival to the family. Thinking about retirement? Information about the two pension schemes in Northern Ireland and financial planning for retirement."
