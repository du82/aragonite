full_description = "Neues aus der Zukunft #49: Fokus aufs Auto, neue Industrien, Roboter und Babies 🚗 In der heutigen Ausgabe liegt der Fokus auf autonomen Fahrzeugen. Wie ist es, von einem (fast) führerlosen Taxi kutschiert zu werden? Wie kommunizieren diese Maschinen mit menschlichen Verkehrsteilnehmern? Auf welche Industrien werden sie Einfluss ausüben? Und wie denkt der Durchschnittsbürger über sie? 🤖 Apropos “Industrie”: in den USA wurde gerade eine komplett neue eröffnet. Und in Afrika entwickeln sich nach und nach neue Märkte fast aus dem Nichts. Irre. Weiterlesen → → 2016-09-15 @ 11:00 Neues aus der Zukunft #48: Watson rettet Patientenleben, Smart Dust, private Mondmissionen Eine künstliche Intelligenz sticht Fachärzte aus, weil sie aufgrund massiv größerer Informationsmengen eine bessere Diagnose stellt — und rettet damit einen Menschen. Eine private Firma erhält die Genehmigung, 2017 auf dem Mond zu landen. Künstliche Fotosynthese, die Treibstoff erzeugt. Winzige Sensoren, die ungeahnte Möglichkeiten in der Medizin ermöglichen. Fühlbare und sichtbare Beschleunigung bei der Einführung autonomer Fahrzeuge. 2016 hat rein technologisch bis jetzt nicht enttäuscht, finde ich. 😀 Seid so lieb und empfehlt mich weiter: Weiterlesen → → 2016-08-25 @ 11:00 Neues aus der Zukunft #47: Hochbeinige Busse, Bioelektronik, Hogwarts-Hut mit KI Wer dieser Tage in Düsseldorf unterwegs ist, und eine kleine graue Box mit sechs Rädern durch die Straßen flitzen sieht, groß wie ein Briefkasten — keine Angst, das ist nur eine neue Lieferdrone im Einsatz. Was sie wohl durch die Gegend fährt? Bioelektronik vielleicht, oder synthetische Bakterien, oder ein Weckglas voll mit Nanorobotern… Wir wissen es nicht. Also lehnen wir uns zurück im Sitz, ziehen den Sortierhut etwas tiefer ins Gesicht und schauen von oben auf die Autos, über die unser Bus rollt. Weiterlesen → → 2016-08-05 @ 11:00 Neues aus der Zukunft #46: 🚀 NewSpace-Finanzierung, Entwicklungsländer-Biotech, fehlende Weitsicht Heute blicke ich mal wieder ein wenig zu den Sternen, freue mich über Sport-Roboter (die uns überraschenderweise nicht die Notwendigkeit eigener Bewegung abnehmen!), schaue auf 21.-Jahrhundert-Medizin in Entwicklungsländern, und frage mich, ob unsere Gesellschaft genug über die Zukunft nachdenkt (Spoiler: nope). 💛💛💛 Werdet vielbeachtete Thought Leader in Eurem Freundeskreis, erntet Bewunderung und Aufmerksamkeit! Schickt die aktuelle Ausgabe einfach an Freunde & Familie weiter, gefälltmirt sie auf Facebook oder teilt NadZ auf Twitter! Weiterlesen → → 2016-07-17 @ 11:00"
