["https://www.newindianexpress.com/world/2025/Mar/02/israel-supports-a-us-proposal-to-extend-gaza-ceasefires-first-phase-hamas-wants-phase-2"]
title = "Israel supports a US proposal to extend Gaza ceasefire's first phase; Hamas wants Phase 2"
description = "CAIRO: Israel's government said early Sunday it supports a proposal to extend the first phase of the ceasefire in Gaza through Ramadan and Passover, though Hama"
full_description = '''CAIRO: Israel's government said early Sunday it supports a proposal to extend the first phase of the ceasefire in Gaza through Ramadan and Passover, though Hamas has insisted on negotiating the truce's second phase instead. The statement by Prime Minister Benjamin Netanyahu's office came minutes after the first phase ended, and as talks have begun on starting the second phase that's aimed at ending the war and seeing all remaining living hostages in Gaza returned home. The statement gives new details on what Israel described as a U.S. proposal: A ceasefire extension through Passover, or April 20. On the first day, half the hostages, alive and dead, would be released. The rest would be released if agreement is reached on a permanent ceasefire. The statement said it was proposed after U.S. envoy Steve Witkoff got "the impression that at this stage there was no possibility of bridging the positions of the parties to end the war, and that more time was needed for talks on a permanent ceasefire." There was no immediate comment from Hamas, which earlier rejected an Israeli proposal to extend the ceasefire's first phase by 42 days — doubling its length — saying it goes against the truce agreement, according to a member of the group who requested anonymity to discuss the closed-door negotiations. Officials from Israel and mediators Qatar, Egypt and the United States have been involved in negotiations on starting the ceasefire's second phase in Cairo. But Basem Naim, a member of Hamas' political bureau, told The Associated Press there had been "no progress" before Israeli negotiators returned home on Friday. Hamas did not attend, but its position has been represented through Egyptian and Qatari mediators. Under the ceasefire deal's terms, fighting should not resume while negotiations are underway on phase two. Israel's new statement says it can return to fighting "if it believes that the negotiations are ineffective," and it noted Hamas' refusal to accept the proposal for an extension of the first phase.'''
author = "Associated Press"
