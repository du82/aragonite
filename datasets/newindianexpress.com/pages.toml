["https://www.newindianexpress.com/cities/delhi/2025/Feb/25/cag-report-tabled-by-delhi-government-flags-rs-2002-crore-revenue-loss-due-to-aaps-liquor-policy"]
title = "CAG report tabled by Delhi government flags Rs 2,002 crore revenue loss due to AAP’s liquor policy"
description = "NEW DELHI: The CAG report on the Delhi Excise Policy tabled during Delhi Assembly session on Tuesday said that various steps resulted in losses of varying amoun"
full_description = "NEW DELHI: The CAG report on the Delhi Excise Policy tabled during Delhi Assembly session on Tuesday said that various steps resulted in losses of varying amounts, for example: not opening retail shops in non-conforming wards (941.53 crore), failure to re-tender surrendered licenses (1890 crore), citing Covid-19-fee waiver to zonal licensees against Excise Department's advice (144 crore), failure to collect proper security deposits from zonal licensees (27 crore). The report said that failure to enforce Rule 35 of the Delhi Excise Rules, 2010, resulted in grant of licenses to wholesalers having interests in manufacturing and wholesalers having relationships with retailers. This polluted the entire liquor supply chain with common beneficial ownership across licensees in manufacturing, wholesale, and retail. This was done saying it was necessary to compensate for a quality checking system involving setting up government-approved labs at warehouses. However, no labs were set up. Thus, the profit margin of wholesale licenses increased, while revenue went down. The AAP government awarded retail liquor licenses without proper checks on solvency, financial statements, and criminal records. Running a liquor zone required an initial investment of over 100 crore, yet no qualifying financial criteria was set. Thus licenses were given to financially weak entities, with multiple bidders reporting minimal to zero income in the last 3 years. These measures suggest proxy ownership, raising questions about political favouritism and backdoor deals. The AAP government disregarded recommendations of its own Expert Committee while drafting the 2021-22 Excise Policy, with no justification recorded. The policy permitted a single applicant to operate up to 54 liquor vends, (previous limit was 2) - paving the way for monopolies and cartelization. Earlier, government corporations operated 377 retail vends, while 262 were run by private individuals. The new policy created 32 retail zones with 849 vends, but licenses were given to only 22 private entities - reducing transparency and fairness."
author = "Anup Verma"
