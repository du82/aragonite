title = "Polling underway for municipal elections in Haryana"
description = "CHANDIGARH: Polling was underway for election of mayors and all ward members in seven municipal corporations and some other municipalities of Haryana on Sunday,"
full_description = '''CHANDIGARH: Polling was underway for election of mayors and all ward members in seven municipal corporations and some other municipalities of Haryana on Sunday, officials said. Voting is being held for the election of mayors and all ward members in seven municipal corporations of Gurugram, Manesar, Faridabad, Hisar, Rohtak, Karnal, and Yamunanagar. Additionally, by-elections for the post of mayor in Ambala and Sonipat municipal corporations, are also taking place. Similarly, elections are being conducted for the president and all ward members of four municipal councils of Ambala Sadar, Pataudi Jatoli Mandi, Thanesar, and Sirsa. Bye-election is also being held for the post of president in municipal council Sohna, district Gurugram. VIDEO | Haryana: Security deployed outside a polling booth in Karnal as municipal election is underway.(Full video available on PTI Videos - https://t.co/n147TvrpG7) pic.twitter.com/fvV2N54EzC Voting is also taking place for the election of presidents and all ward members in 21 municipal committees. Bye-elections for the post of president in Assandh (Karnal district) and Ismailabad (Kurukshetra district) municipal committee is also taking place. Among the early voters included Union Minister Manohar Lal Khattar, who cast his vote at a polling booth in Karnal. Khattar appealed to voters to come out and cast their vote. VIDEO | Haryana Municipal Elections: Union Minister and Former CM of Haryana Manohar Lal Khattar (@mlkhattar) is in Karnal to cast his vote. Here's what he said:"The local government is an important part in democracy. The BJP got successes in Lok Sabha and Vidhan Sabha… pic.twitter.com/P8rmJHFlep Haryana State Election Commissioner Dhanpat Singh said extensive arrangements, including those pertaining to security, have been made for the free, fair and transparent elections of the urban local bodies. After the completion of the election process, vote counting will begin at 8 AM on March 12, and results will be declared on the same day.'''
