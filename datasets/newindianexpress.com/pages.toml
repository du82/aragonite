["https://www.newindianexpress.com/web-only/2025/Feb/22/playing-kings-indian-defence-to-president-trumps-potentially-675-trillion-tariff-gambit"]
title = "Playing King's Indian Defence to President Trump's potentially $6.75 trillion tariff gambit"
description = "The much-feared global trade tariff tussle 2.0 is here and real.As US President Donald Trump completes one month in office, economies are grudgingly settling in"
full_description = '''As US President Donald Trump completes one month in office, economies are grudgingly settling into battle stance, with some like China even throwing in a game-on sign along with retaliatory levies. Put simply, a tariff is a tax. It's a crucial source of revenue for governments, but there's no single precedent where consumers got richer due to tariffs. If anything, these mind-numbing levies make consumers worse off, either due to a rise in prices or supply shortages, or both. In Trump's worldview, however, tariffs can do magical things to make everyone's lives better. In just the past few weeks, he qualified it with repeated remarks. Sample some. Tariff is the most beautiful word in the dictionary, next only to God, religion and love, Trump quipped during his recent press briefing. Further, he reasoned that, "When you're the pot of gold, the tariffs are very good, they're very powerful, and they're going to make our country very rich again." A few days later, he stressed again: "Tariffs are going to makes us rich as hell... and bring back businesses that left us." But economists and policy wonks disagree and insist that tariffs aren't a magic wand, but can make living expensive and difficult. So they appeal for less sacrifice and more practicality. Punching numbers, they estimate that if the 10% additional tariffs on Chinese goods along with the proposed 25% tariffs on all Mexican and Canadian goods announced on February 1 were to come into effect, they would cost the average American household $800 more this year alone. Alarmingly, estimates also peg that the series of sweeping tariffs targeting all major US trading partners could spark a geopolitical bloc-based trade war, potentially costing the global economy up to $6.75 trillion. Holy moly! But Trump and his team of trade warriors justify that when applied surgically, tariffs are a justifiable way to nurture domestic industries and jobs. As Stephen Mirran, chief of Trump's Council of Economic Advisers, argued in a recent paper, tariffs can correct the effects of cheap products being dumped from abroad to undercut local firms, or provide a way for governments to prop up parts of an economy deemed vital for stability, security or both. In short-term, tariffs can even serve as an ample source of government revenue.'''
author = "Sunitha Natti"
year_published = 2025
year_updated = 2025
clearnet = "https://www.newindianexpress.com/web-only/2025/Feb/22/playing-kings-indian-defence-to-president-trumps-potentially-675-trillion-tariff-gambit"
tags = ["$6.75", "actually", "channel", "cities", "defence", "donald trump", "download", "express", "follow", "gambit"]
language = "en"
