["https://www.newindianexpress.com/web-only/2025/Feb/24/usaid-spent-more-than-it-was-obliged-to-in-pre-election-years-in-india-from-2008-data"]
title = "USAID spent more than it was obliged to in pre-election years in India from 2008: Data"
description = "President Trump might still be harrumphing about the $21 million that he insists went out from the controversial USAID for voter turnouts ahead of the 2024 elec"
full_description = "President Trump might still be harrumphing about the $21 million that he insists went out from the controversial USAID for voter turnouts ahead of the 2024 elections in India. This despite India's Ministry of Finance rubbishing his claims. But as that battle continues to rage, another unusual pattern has emerged. This surrounds the USAID's financial obligations and actual disbursements data a year ahead of general elections in India for more than fifteen years, harking back to the 2009 Lok Sabha elections. Data sourced from ForeignAssistance.gov, the central resource for budgetary and financial data produced by US government agencies managing foreign assistance portfolios, shows that at least in the past four instances of the 2024, 2019, 2014 and 2009 election years, disbursements from USAID were higher than obligations in each of the preceding years. In other words, the years ahead of the 2024, 2019, 2014 and 2009 general elections, i.e., 2023, 2018, 2013 and 2008 saw higher amounts being spent by USAID than was originally allocated. If 2023 saw over $48 million higher disbursements than obligations, 2018 had a higher spending of $13 million. Likewise, 2013 saw almost $27 million higher disbursements than initially sanctioned, while 2008 saw the release of $11 million in additional funding. Interestingly, the trend holds true even if you consider funding from all other US government agencies. For instance, 2023 saw $50 million higher disbursements than obligations, 2018 had a higher spending of $30 million. Likewise, 2013 saw $22 million higher disbursements than initial sanctions. All these sums are inclusive of USAID funding. 2008 - or the year preceding the 2009 general election - was an exception, when obligations and disbursements remained the same at $140 million. However, the outlays were higher two years before the election, i.e, 2007 by $20 million. Cost overruns, delays in fund releases or even undershooting of actual financial assistance isn't uncommon, be it in private or government projects. While the difference in initial estimates and actual disbursements ahead of election years isn't indicative of any foul play, the steady pattern does raise an eyebrow amid the ongoing row over USAID funding."
author = "Sunitha Natti"
year_published = 2025
year_updated = 2025
