["https://www.newindianexpress.com/web-only/2025/Mar/01/is-the-rise-of-reel-films-killing-or-creating-a-new-form-of-cinema"]
title = "Is the rise of reel-films killing or creating a new form of cinema?"
description = "We were three screenwriters who had gone to watch&nbsp;Animal. Beyond the snowballing judgment everyone showered at the film, we were stuck by the number of met"
full_description = 'We were three screenwriters who had gone to watch Animal. Beyond the snowballing judgment everyone showered at the film, we were stuck by the number of metaphors Sandeep Vanga Reddy was trying to juggle: Indo-Pak partition, Kashmir conflict, man as an animal, generational father-son conflict, etc. Usually, as screenwriters, we learn to tackle one metaphor per film and go soul-ripping deep into it. But here was Reddy, as unhinged with his metaphors as his protagonist with violence. Was he trying something so different the three of us weren’t getting? I did have an inkling then, but it clarified itself after Shankar, promoting his upcoming film Game Changer, said, "Today’s audience has a very short attention span. They watch reels, so we kept that in mind while making Game Changer." Damn! Animal was a ‘Reel film’ (no, not as opposed to a real film). I watched the film again and realised you can chop its 201-minute runtime into hundreds of reels. Call it the fast-foodization of cinema. Films have always been about what we call ‘moments’. As screenwriters, one of our primary jobs is to craft those moments you’ll carry back home. Watch a really good film, and you’ll realise that each scene is self-contained and, like the larger film, has a central dramatic conflict with a sort of resolution, a kind of ‘this happened’ leading to ‘therefore’ in the next scene. Every scene has to craft the conflict between characters to advance the film’s narrative. So, in that sense, every film is already made up of many ‘reels’. So what’s different between this and what Animal or Game Changer are doing? The answer can be found in psychology. What is the most priceless commodity in the world today? Gold, diamond, oil, data? Nope! The most coveted asset in the third decade of the third millennium is attention. Go to the ‘Digital Wellbeing’ settings on your phone and see how many notifications pop daily. Yesterday, 639 notifications vied for my attention. That’s like one every two minutes of the day.'
author = "Satyen K Bordoloi"
year_published = 2025
year_updated = 2025
