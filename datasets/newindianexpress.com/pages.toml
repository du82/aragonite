["https://www.newindianexpress.com/web-only/2025/Feb/21/hollywoods-ai-showdown-chris-keysers-battle-to-save-scriptwriting-from-chatgpt"]
title = "Chris Keyser's Fight Against AI: Safeguarding Scriptwriting in Hollywood"
description = "Chris Keyser is no stranger to Hollywood's glittering accolades. As the writer behind the Golden Globe-winning drama&nbsp;Party of Five&nbsp;and the Netflix ser"
full_description = '''Chris Keyser is no stranger to Hollywood's glittering accolades. As the writer behind the Golden Globe-winning drama Party of Five and the Netflix series The Society, his work has left an indelible mark on the entertainment industry. But in 2023, he made headlines for a different reason: leading the Writers Guild of America (WGA) strike as co-chair of the negotiating committee. One of the strike's key demands? Regulation against the use of AI in screenwriting. When I met Chris at the Screenwriters Association's 7th Indian Screenwriters Conference in Mumbai, I couldn't resist asking him the burning question: Does AI have any legitimate uses in writing? His answer was as nuanced as his scripts. "I'm not opposed to all technology that increases productivity, including AI," he began. "But I'm also not the type to say, 'Give me 27 plots and let me pick from them.'" The Ethical Dilemma: Chris' first objection to AI isn't about efficiency or creativity — it's about ethics. "Before we write anything, we have to sign a certificate of authorship claiming what we write is all ours," he explained. "But anyone who uses AI with an actual script, I think, is not in a position to sign that because they have no idea what has been fed into that large language model." This ethical quandary is at the heart of the debate. Can a writer truly claim ownership of a story if parts of it were generated by a machine trained on countless other works? Chris doesn't think so. "Writing itself, the act of creating something that's original — I think, to whatever extent possible, I'd like to see AI being off limits to that." "One of the things that's good about writing is the diversity of voices that come out. New points of view, new ways of thinking about the world," he said. "Whereas AI is sort of the collector of the average of all of us." This sentiment strikes a chord. AI, by its very nature, is a tool that aggregates and synthesises existing data. It can mimic patterns and styles, but can it truly innovate? Can it capture the raw, unfiltered essence of human experience?'''
author = "Satyen K Bordoloi"
year_published = 2025
year_updated = 2025
