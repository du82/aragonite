["https://www.newindianexpress.com/nation/2025/Mar/01/congress-workers-body-found-stuffed-in-suitcase-in-haryanas-rohtak-party-demands-high-level-probe"]
title = "Congress worker's body found stuffed in suitcase in Haryana's Rohtak, party demands high-level probe"
description = "CHANDIGARH: A body of a woman Congress worker was found stuffed in a suitcase in Haryana's Rohtak district on Saturday.The stuffed suitcase was found near Sampl"
full_description = '''CHANDIGARH: A body of a woman Congress worker was found stuffed in a suitcase in Haryana's Rohtak district on Saturday. The stuffed suitcase was found near Sampla bus stand and the woman was identified as a 22-year-old resident of Vijay Nagar in Rohtak, according to the police. Sampla Police Station Inspector Bijender Singh stated that an investigation was underway and a case had been registered. Meanwhile, former Chief Minister Bhupinder Singh Hooda expressed deep shock over the incident, calling it extremely distressing. Former Haryana CM and Congress leader Bhupinder Singh Hooda tweets, "The news of the barbaric murder of active Congress worker Himani Narwal in Rohtak is extremely sad and shocking. I pay my tribute to the departed soul and express my deepest condolences to the family members.… https://t.co/FA3p8jiDhn pic.twitter.com/CLpYJmuC3Z This in itself is a blot on the law and order of the state. There should be a high-level, impartial investigation into this entire case, and the culprits should receive the harshest punishment as soon as possible," Hooda said in a statement. He further emphasised the need for strict action in crimes against women, stating, "If any such incident occurs, the government and the entire law and order system should take exemplary action so that in the future, anyone with criminal tendencies will think a thousand times before committing such an act." The senior Congress leader also criticised the state's law enforcement, stating that this tragic incident has once again highlighted the "complete collapse" of law and order in Haryana'''
author = "PTI"
