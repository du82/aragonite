["https://www.newindianexpress.com/thesundaystandard/2025/Mar/02/50-rescued-four-dead-in-uttarakhand-avalanche"]
title = "50 rescued, four dead in Uttarakhand avalanche"
description = "DEHRADUN: Fifty workers were pulled out safely from the snow-covered debris of an avalanche that smashed a Border Roads Organisation (BRO) camp in Mana village"
full_description = "DEHRADUN: Fifty workers were pulled out safely from the snow-covered debris of an avalanche that smashed a Border Roads Organisation (BRO) camp in Mana village in Uttarakhand’s Chamoli district, but the desperate search for survivors turned grim as four workers succumbed to injuries on Saturday even as rescuers raced against time to find five workers still unaccounted for. The avalanche hit the camp between Mana and Badrinath between 5.30 am and 6 am on Friday, burying 55 workers inside eight containers and a shed. Thirty-three of them were rescued by Friday night and 17 on Saturday. Rain and snowfall thwarted rescue efforts. As the weather cleared up on Saturday morning, the Army and ITBP personnel resumed operations, District Disaster Management Officer N K Joshi said. Six helicopters, including three of the Army aviation, two of air force and one civil copter hired by the Army were pressed into rescue efforts, Army PRO Lt Col Manish Shrivastava said. Located 3 km from Badrinath, Mana is the last village on the India-Tibet border at a height of 3,200 metres. Lt Gen Anindya Sengupta, GOC-in C Central Command and Lt Gen D G Mishra, GOC Uttar Bharat, reached the avalanche site to monitor rescue operations. Lt Gen Sengupta said movement by road is impossible as roads are clogged by snow. The Badrinath-Joshimath highway is blocked at 15-20 places, he said. Prime Minister Narendra Modi called Chief Minister Pushkar Dhami to take stock of the rescue operations. The deceased were identified as Mahendra Pal and Jitendra Singh from Himachal Pradesh, Manjeet Yadav from Uttar Pradesh, and Alok Yadav from Uttarakhand. \b"
author = "Narendra Sethi"
