["https://www.newindianexpress.com/web-only/2025/Feb/25/south-cinemas-billion-dollar-secrets-that-bollywood-executives-are-hiding-from-you"]
title = "South Cinema's Billion-Dollar Secrets: Lessons Bollywood Needs to Learn"
description = "Here's a mind-boggling fact: Of the eight Indian films that have crossed the magical Rs 1000 crore mark, only two – Dangal and Pathaan – are pure Bollywood prod"
full_description = '''Here's a mind-boggling fact: Of the eight Indian films that have crossed the magical Rs 1000 crore mark, only two – Dangal and Pathaan – are pure Bollywood productions. The other six? Five are entirely Southern creations (Baahubali, Pushpa 2, RRR, KGF: Chapter 2, and Kalki 2898 AD), while the sixth, Jawan, was helmed by a Southern hitmaker. Clearly, our Southern cousins are doing something brilliantly right — or Bollywood is doing something spectacularly wrong. To uncover this mystery, you'd need to take a trip South — or have Southern cinema experts give Bollywood a much-needed wake-up call. That's exactly what the Screenwriters Association (SWA) orchestrated at a panel during their Seventh conference. With representatives from all four Southern film industries, the panel painted a vivid picture of their filmmaking approach. If Bollywood is willing to listen, here are five game-changing lessons that could help Mumbai cinema course correct and start minting billions again. 1. ROOTEDNESS: Stay True to Your Soil: Vivek Athreya, representing the Telugu film industry and director of hits like Mental Madhilo, Brochevarevarura, Ante Sundaraniki and the recent vigilante success Saripodhaa Sanivaaram, put it perfectly: "In south cinema, the films are rooted. The ideas are rooted. KGF and Pushpa worked not because of the scale of the film, but rootedness of the characters and emotions." Consider this pitch: a hot-headed village nobody starts looting jungle redwood. When presented to Bollywood producers, the typical responses would have been painfully predictable: "Who'd relate to a village loser? Too small for the big screen! Not pan-India enough — maybe OTT? Can you make it for two crores?" Yet this very concept became the Pushpa franchise, which has raked in over Rs 2000 crores so far! In its obsession with creating 'pan-India' films, Bollywood often ends up making parodies of itself. By trying to please everyone, it pleases no one. Like the mythical Trishankhu, Bollywood dangles in limbo – neither here nor there, a true "dhobi ka kutta" suspended in its own bubble.'''
author = "Satyen K Bordoloi"
year_published = 2025
year_updated = 2025
