["https://www.newindianexpress.com/web-only/2025/Feb/28/india-emerging-from-valley-of-gloom-but-economic-nirvana-will-have-to-wait"]
title = "India emerging from valley of gloom, but economic nirvana will have to wait"
description = "India's slowdown storm seems to have passed, with Q3 real GDP growth settling at 6.2%, breaking away from the 7-quarter-low of 5.6% seen in Q2.The uptick was dr"
full_description = "India's slowdown storm seems to have passed, with Q3 real GDP growth settling at 6.2%, breaking away from the 7-quarter-low of 5.6% seen in Q2. As for the full fiscal year FY25, the second advance estimates released Friday pegged growth at 6.5%, in line with consensus estimates of about 6.4%. While Q3 data indicates that we are emerging from the valley of gloom, it's unlikely that we are headed towards an economic miracle next fiscal. Both the RBI and the Economic Survey have pegged FY26 growth below 7% and given that global growth prospects remain uncertain with US President Donald Trump threatening to upend trade with tariffs, the much-desired 8% expansion remains almost godlike in its distance. That said, the National Statistics Office's latest data dispatch was all about data revisions. The first revised estimates for FY24 show real GDP growth rate at 9.2% -- the highest in the previous 12 years barring FY22. The growth was led by double-digit growth rates in the manufacturing sector at 12.3%, construction sector at 10.4% and financial, real estate & professional services sector at 10.3%. Likewise, the final estimates for FY23 show growth at 7.6%. Lastly, FY25, Q2 GDP growth rate too has been modestly revised upwards to 5.6%, as against 5.4% projected earlier. In absolute numbers, real GDP for FY25 is pegged at Rs 187.95 lakh crore as against the first revised estimates of Rs 176.51 lakh crore. In Q2, real GDP is estimated at Rs 47.17 lakh crore compared to Rs 44.44 lakh crore during the same period last year. Coming to the sub-components of national output, it seems as though the troubles of the economy are moving from one shoulder merely to land upon the other. For instance, if the first two quarters of FY25 saw agriculture and mining suffering the slowdown blues, manufacturing and services will likely bear the brunt during the second half. For the full fiscal FY25 though, while agriculture sector turned the corner, the industry and services sector have miles to go. On a sequential basis though, all three sectors performed relatively better."
author = "Sunitha Natti"
year_published = 2025
year_updated = 2025
