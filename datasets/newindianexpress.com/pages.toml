["https://www.newindianexpress.com/web-only/2025/Feb/26/rage-of-an-angel-did-money-woes-alone-drive-a-23-year-old-to-bludgeon-five-people-to-death"]
title = "Rage of an 'angel': Did money woes alone drive a 23-year-old to bludgeon five people to death?"
description = "It was a bloody Monday in Thiruvananthapuram that shook Kerala and the rest of India.Extreme love and extreme hatred had combined to fuel a murderous spree that"
full_description = '''Extreme love and extreme hatred had combined to fuel a murderous spree that claimed five lives in the most brutal manner. The perpetrator was just 23 years old and looked 'angelic' in the first photos that were shared of him. "He always carried an air of poise wherever he went. He was protective of his family, especially his younger brother Afsan. He would take his mother to the bank and for shopping and we've never heard of him misbehaving with either his mother or other family members," said Suhra Salim, a block panchayat member, who thought she knew Afan well enough. What then prompted this 23-year-old from Perumala near Venjaramoodu town in the Kerala capital to bludgeon four members of his family and his girlfriend to death? And with such icy planning, 'poise' and calculation that even the cops initially found it difficult to believe him when he stepped in to give his confession. The discovery of the bloody remains of Afan's younger brother Afsan (14), girlfriend Farsana (22) , grandmother Salma Beevi (92), uncle Latheef (62) and aunt Sajitha Beevi (55) -- one after another -- soon made everybody realise that they had been pulled headlong into one nightmarish tale. There should have been a sixth victim. Afan had attacked his mother Shemi first and left her for dead. She is recuperating in a private hospital, still unaware her son had killed five others, including her other son. The prime motive behind the gruesome murders is believed to be the financial woes the family had been reeling under. Some mention a debt as large as Rs 75 lakh. So heavy was the burden that Afan is believed to have had to beg for help to fund his younger brother's education. "His father Rahim has been embroiled in a legal issue in Saudi Arabia and has not been able to renew his documents. So, he is unable to work and earn money. He earlier ran an automobile spare parts business, which ran into losses. He owes people money and there is a police case for that. Because of that he has not been able to exit the kingdom for the past seven years," said a senior police officer.'''
author = "Shan AS"
year_published = 2025
year_updated = 2025
