["https://www.newindianexpress.com/web-only/2025/Feb/19/start-action-cut-tragedy-unfolds-as-malayalam-film-industry-in-deep-financial-crisis-bicker-in-public"]
title = "Start, Action, Cut: Tragedy unfolds as Malayalam film industry, in deep financial crisis, bicker in public"
description = "With a slew of flops on the box office and no takers for many films on OTT platforms, the Malayalam film industry is staring at a huge crisis.The situation came"
full_description = '''With a slew of flops on the box office and no takers for many films on OTT platforms, the Malayalam film industry is staring at a huge crisis. The situation came to a boil when G Suresh Kumar, the vice president of the Kerala Film Producers Association (KFPA), announced an industry-wide strike June 1 onwards, after he launched a scathing attack against the actors and other technicians. He alleged that they were hiking their remuneration manifold after one or two films, leading to the current mess. Antony Perumbavoor of Ashirwad Films, a major producer in Malayalam film industry, rebuffed Suresh Kumar's claims in a Facebook post saying the decision to go for a strike was announced without proper discussion among the stakeholders, and that it would affect a large number of people without any income. The ongoing financial crisis in the Malayalam film industry began during the COVID-19 period, which forced theatres to shut down, and movies were produced targeting OTT audiences. The next two years viz., 2022 and 2023 saw 400 films getting released but most of them bombed at the box office. The industry showed signs of revival in the first half of 2024, with several films, including Manjummel Boys, Aavesham, and Premalu, entering the Rs 100 crore club, and the trend gave hope to the industry. "No Malayalam films have helped producers to get Rs 100 crore from the box office. The figures that they are revealing are the gross collections. If you receive Re 1 from the theatres, the producer gets only 25 paise," said Suresh Kumar. "The production cost is high. The remuneration of actors, chief technicians, and directors is high. If the situation continues, the producers will have to struggle,” he said. A joint meeting by KFPA, the Kerala Film Distributors Association, the Film Employees Federation of Kerala, and the Film Exhibitors United Organisation of Kerala recently decided to go on a strike to highlight the losses the Malayalam film industry was going through. Suresh Kumar also said that film produced by actors will not be allowed to screen, perhaps an open challenge, not seen in the past.A week later, Antony Perumbavoor wrote a Facebook post against the proposed strike. Actors Prithviraj, Unni Mukundan, Aju Varghese, and Mohanlal rallied behind Antony, sharing the post.'''
author = "Anna Jose"
year_published = 2025
year_updated = 2025
