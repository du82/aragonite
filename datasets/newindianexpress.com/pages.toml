["https://www.newindianexpress.com/world/2025/Mar/02/zelenskyy-embraced-by-british-prime-minister-a-day-after-white-house-blowout"]
title = "Zelenskyy embraced by British prime minister a day after White House blowout"
description = "LONDON: British Prime Minister Keir Starmer embraced Ukrainian President Volodymyr Zelenskyy on Saturday and told him he had the U.K.'s unwavering support, a da"
full_description = '''LONDON: British Prime Minister Keir Starmer embraced Ukrainian President Volodymyr Zelenskyy on Saturday and told him he had the U.K.'s unwavering support, a day after the blowout at the White House with President Donald Trump. Zelenskyy arrived to cheers from people who had gathered outside of 10 Downing St., where Starmer gave him a hug and ushered him inside. The two leaders met on the eve of a meeting of European leaders in London. Called to discuss how European nations can defend Ukraine — and themselves — if the U.S. withdraws support, it has taken on new urgency following Trump's televised berating of Zelenskyy. "And as you heard from the cheers on the street outside, you have full backing across the United Kingdom," Starmer told the leader of the war-torn country. "We stand with you, with Ukraine, for as long as it may take." After the meeting, Britain announced it was extending a 2.26 billion pound ($2.84 billion) loan to Kyiv for military procurement, with the money coming from the profits on frozen Russian assets. It's Britain's contribution to a $50 billion package of support pledged by the G-7 group of wealthy industrialized nations. Zelenskyy thanked Britain in a statement on X, saying: "This is true justice – the one who started the war must be the one to pay." London. A meaningful and warm meeting with Prime Minister @Keir_Starmer.During our talks, we discussed the challenges facing Ukraine and all of Europe, coordination with partners, concrete steps to strengthen Ukraine’s position, and ending the war with a just peace, along with… pic.twitter.com/IAwcPgbhYW Starmer spoke to both Trump and French President Emmanuel Macron on Saturday evening after meeting Zelenskyy, the prime minister's office said. The meeting comes the day after an extraordinary diplomatic meltdown when Trump and Vice President JD Vance blasted Zelenskyy in the Oval Office on live television for not being grateful enough for U.S. support. Zelenskyy had been poised to ink a deal to give the U.S. access to mineral riches as Trump pressures Ukraine to reach a deal to end the war with Russia. But he left town without signing anything.'''
author = "Associated Press"
year_published = 2025
year_updated = 2025
