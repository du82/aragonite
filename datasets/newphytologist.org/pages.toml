["https://www.newphytologist.org/nextgenevent/2014"]
title = "Next generation scientists 2014"
description = "Next generation scientists 2014"
full_description = "Thank you to all of our organisers, speakers, mentors, and delegates for making the New Phytologist next generation scientists meeting in Norwich enjoyable, stimulating and productive. New Phytologist next generation scientists was a fully-funded event for early-career scientists held at the John Innes Centre (Norwich, UK) on 29–30 July 2014. Further information can be found below and on the linked pages, or feel free to contact us with any queries by email at np-symposia@lancaster.ac.uk. With support from the New Phytologist Trust and Wiley, New Phytologist next generation scientists was a fully-funded event with the unique aim to provide the next generation of plant scientists a chance to share their work with their peers and outstanding international scientists in a stimulating, supportive and exciting environment. The meeting took place in July 2014 at the John Innes Centre in Norwich, UK. Hannah Kuhn, P42, ‘Involvement of ORA59 in mlo-based resistance of Arabidopsis thaliana against powdery mildew fungi’ Jack Lee, P47, ‘TaR1 provides a link between chromatin remodelling and wheat defence against Mycosphaerella graminicola’ Shane Rothwell, P68, ‘Liming (to recommended rates) limits legume growth and gas exchange by increasing root-to-shoot signalling of the phytohormone abscisic acid’ The meeting was a great success and we have received a lot of very positive and encouraging feedback. We hope to run similar meetings in the future so if you have any suggestions on how we could improve this event please get in touch: np-symposia@lancaster.ac.uk. Great organization, excellent content, great focus and selection of topics! Over the course of 24 hours I shared my research with more people (through having conversations) than during a 4 day conference where I gave a talk (!). This was a really amazing symposium. I would highly recommend hosting this event on an annual or biennial basis. Seems that everyone benefitted from the event. As the workshop included the whole field of plant science, I was a bit concerned that I might hear quite some talks without any interest to me. This was not the case at all, however. The talks were all very interesting and of high quality."
