title = "Tansley Medal - Awards"
description = "New Phytologist Tansley Medal, awarded in recognition of an outstanding contribution to research in plant science by an individual in the early stages of their career"
full_description = "The New Phytologist Tansley Medal is awarded annually in recognition of an outstanding contribution to research in plant science by an individual with three to five years’ experience since gaining / defending their PhD. Shortlisted candidates are invited to author a Tansley insight review for publication in New Phytologist and the winner(s) receives a prize of £2,000 (GBP). Applications for the 2025 New Phytologist Tansley Medal closed on 1 November 2024. We aim to confirm the shortlist by mid-December. We are delighted to announce that the 2024 New Phytologist Tansley Medal for excellence in plant science has been awarded to Matthew Naish. We are delighted to announce that the 2023 New Phytologist Tansley Medal for excellence in plant science has been awarded to Martina Legris."
