["https://newphytologist.org/events/now/npn-26-nov-2024"]
title = "26 November 2024 – Stomata"
description = "New Phytologist Now: Stomata, 26 November 2024"
full_description = "Following on from the highly successful 46th New Phytologist Symposium: Stomata, we present two further talks from leading scientists that were unable to join us in Kaifeng. Sarah M. (Sally) Assmann is the Waller Professor of Plant Biology at the Pennsylvania State University. She has a long-standing interest in how guard cells perceive and respond to environmental signals, at scales ranging from molecular mechanisms to field trials. Her group also has a major interest in how abiotic stressors alter mRNA structure, with functional consequences. Her research is supported by the U.S. National Science Foundation (NSF), the U.S. Department of Agriculture/National Institute of Food and Agriculture (USDA/NIFA), and the U.S. National Institutes of Health (NIH). Dr. Assmann previously served as President of the American Society of Plant Biologists (ASPB). She is a Fellow of ASPB and a Fellow of the American Association for the Advancement of Science (AAAS). Torii received B.S., M.S., and Ph.D. degree from the University of Tsukuba. She became a tenure-track Assistant Professor at the Department of Biology (formerly Botany), University of Washington in 1999, then became Associate Professor in 2005, Full Professor in 2009, and received the title of College of Arts and Sciences Endowed Distinguished Professor of Biology in 2011. Since 2011, Torii is an investigator of Howard Hughes Medical Institute (HHMI). Currently, she is Johnson & Johnson Centennial Chair in Plant Cell Biology at the Department of Molecular Biosciences, The University of Texas at Austin. Since 2013-2022, Torii ran her second lab at the Institute of Transformative Biomolecules (WPI-ITbM) at Nagoya University, Japan as an Oversea Principal Investigator."
