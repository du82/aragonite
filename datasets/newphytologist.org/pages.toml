["http://www.newphytologist.org/events/now/june-2023"]
title = "New Phytologist Now: Frontiers in plant–microbe interactions"
description = "Plant-microbe Interactions"
full_description = "We present an exciting two-part webinar highlighting the latest research in plant–microbe interactions, hosted by Francis Martin. Following the recent publication of our collection on the ‘Impact of global change on the plant microbiome’, and ahead of the forthcoming special issue on ‘Mycorrhizal research now: from micro-to macro scale’, these webinars will explore the latest research on the fascinating and complex relationships between plants and microbes. Leading researchers will share their insights into the molecular mechanisms that underlie the symbiotic relationships between plants and different types of microbes, including nodulating bacteria, endophytes, and mycorrhizal fungi. Subscribe to the New Phytologist Foundation newsletter to be the first to know about upcoming events!"
