["https://newphytologist.org/events/now/npn-18-may-2022"]
title = "18 May 2022 – Plant signalling and stress"
description = "New Phytologist Now, Season Two Plant signalling and stress"
full_description = "Hosted by New Phytologist Advisor, Yoselin Benitez-Alfonso, Centre for Plant Science, University of Leeds Amy completed her PhD in plant molecular biology in Keith Lindsey’s group at Durham University. During her PhD she investigated the hormone signalling involved in root responses to a barrier. Her research focused on the model species Arabidopsis and involved a range of techniques including RNA-Sequencing, reporter line analysis, genetics and chemical intervention. In 2021 she joined the newly formed Crop Science Centre at Cambridge University as a Senior Research Assistant. Here she is involved in work investigating and engineering improved nutrient symbiosis in crops. Joris studied biology at Ghent university in Belgium and became very interested in the molecular mechanisms that regulate animal and plant development. In 2017, he joined the Root Development group of Prof. dr. Tom Beeckman at the VIB-UGent Center for Plant Systems Biology as a PhD Student. His PhD project is now being finalised and mainly focused on understanding how GOLVEN signaling peptides control the architecture of the root system in Arabidopsis thaliana, which led to the findings that were recently published in New Phytologist. Yingxuan obtained his PhD from the University of Melbourne in 2021. He is now a Postdoctoral Researcher in La Trobe University. His research interest is understanding how plant cell surface glycoproteins regulate cell wall development in response to environmental signals. He expects to apply this knowledge about cell surface sensing mechanisms into editing better plants for wood and food production."
