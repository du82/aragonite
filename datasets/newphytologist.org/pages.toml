The Nation and the Athenaeum (3 Oct), 19–20. 44. Tansley AG. 1925. Summary of vegetational work and problems in the Dominions. In: Brooks FT, ed. Imperial Botanical Conference 1924. Cambridge, UK: Cambridge University Press, 259–269. 45. Tansley AG. 1925. The vegetation of the southern English chalk (Obere Kreide-Formation). Festschrift Carl Schröter. Verüffentlichungen des Geobotanischen Institutes Rübel in Zürich 3: 406–430. 46. Tansley AG, Adamson RS. 1925. Studies of the vegetation of the English chalk: III the chalk grasslands of the Hampshire–Sussex border. Journal of Ecology 13: 177–223. 47. Tansley AG, Adamson RS. 1926. Studies of the vegetation of the English chalk: IV a preliminary survey of the chalk grasslands of the Sussex Downs. Journal of Ecology 14: 1–32. 48. Tansley AG, Chipp TF. 1926. Aims and methods in the study of vegetation. London, UK: Whitefriars Press. [Edited for and published by the British Empire Vegetation Committee and Crown Agents for the Colonies. Tansley and Chipp wrote most of Part I, Nature and Aims of the Study of Vegetation; Plant Communities; Factors of the Habitat; Training; Methods of Investigation; and Collecting]. 49. Tansley AG. 1927. The future development and functions of the Oxford Department of Botany. Oxford, UK: Clarendon Press. 50. Tansley AG. 1928. Reviews. Journal of Ecology 16: 163–71. [Books reviewed: Elton, C. Animal ecology, London, Sidgwick and Jackson; Rayner MC. Mycorrhiza, an account on non-pathogenic infection by Fungi in Vascular Plants and Bryophytes. New Phytologist reprint no.15; Audus JW. One of nature’s wonderlands, the Victorian Grampians. Melbourne, Australia: Ramsay.] 51. Tansley AG. 1929. Succession: the concept and its values. Proceedings of the International Congress of Plant Sciences, Ithaca. 1: 677. Manasha, Wis.: Banta. 52. Godwin H, Tansley AG. 1929. The vegetation of Wicken Fen. In: Gardiner S, ed. The natural history of Wicken Fen, part V. Cambridge, UK: Bowes & Bowes. 53. Tansley AG. 1931. Obituary notice: Charles Edward Moss. Journal of Ecology 19: 209–214. 54. Tansley AG, Watt AS. 1932. British beechwoods. Die Buchenwälder Europas, Verüffentlichungen des Geobotanischen Institutes Rübel in Zürich 3: 294–361. 55. Tansley AG. 1935. The use and abuse of vegetational concepts and terms. Ecology 16: 284–307. [Reprinted as part of Trudgill S. 2007. Classics in physical geography revisited, Tansley, A.G. 1935: The use and abuse of vegetational concepts and terms. Ecology 16: 284-307.] 56. Tansley AG. 1936. Prof. Frank Cavers. Nature 137: 1022. 57. Tansley AG. 1939. British ecology during the past quarter-century: The plant community and the ecosystem. Journal of Ecology 27: 513–530. 58. Tansley AG. 1939. Obituary: Carl Schröter, 1855–1939. Journal of Ecology 27: 531–534. 59. Tansley AG. 1939. Arthur Harry Church. 1865–1937. Obituary Notices of Fellows of the Royal Society 2: 433–443. 60. Tansley AG. 1939. The British Islands and their vegetation. Cambridge, UK: Cambridge University Press. [Reprinted in 1949 with corrections] 61. Tansley AG. 1940. Obituary: Henry Chandler Cowles, 1869–1939. Journal of Ecology 28: 450–452. 62. Tansley AG. 1940. Natural and semi-natural British woodlands. Forestry 14: 1–21. 63. Tansley AG. 1942. The values of science to humanity. Nature 150: 104–110. [Text of the Herbert Spencer Lecture: mainly psychology and philosophy] 64. Godwin H, Tansley AG. 1942. The vegetation of Wicken Fen. [Offprint No. 37 from an unidentified periodical. In stock at the Bodleian Library, Oxford University]. 65. Tansley AG. 1943. Nature reserves. The Spectator, 519-520. 66. Tansley AG. 1945. Our heritage of wild nature: a plea for organized nature conservation. Cambridge, UK: Cambridge University Press. 67. Tansley AG. 1946. Introduction to plant ecology. London, UK: Allen and Unwin. [Revision of Practical plant ecology, 1923] 68. Tansley AG. 1946. Discussion of fundamental research in relation to the community. Advancement of Science 3: 294–295. 69. Baker JR, Tansley AG. 1946. The course of the controversy on freedom in science. Nature 158: 574–576. 70. Tansley AG, Price Evans E. 1946. Plant ecology and the school. London, UK: Allen & Unwin. 71. Tansley AG. 1947. Obituary Notice. Frederick Edward Clements, 1874–1945. Journal of Ecology 34: 194–196. 72. Tansley AG. 1947. The early history of modern plant ecology in Britain. Journal of Ecology 35: 130–137. 73. Tansley AG. 1949. Britain’s green mantle: past, present, and future. London, UK: Allen and Unwin. [Revised by M. C. F. Proctor, 1968] 74. Tansley AG. 1951. What is ecology? Council for the Promotion of Field Studies. [Reprinted (1987) in the Biological Journal of the Linnean Society.] 75. Tansley AG. 1952. Oaks and oak woods. London, UK: Methuen. [For students at field study centres.] 76. Tansley AG. 1954. Some reminiscences. Vegetatio 5–6: vii–viii. Notes In addition, see reference 102 (below). Book reviews are included where Tansley’s review added significantly to the subject. As Editor of New Phytologist, Tansley also wrote anonymous contributions, reviewing local meetings or dealing with subjects as diverse as ‘The opening of the new botanical school at Cambridge’ (3: 61–63) and ‘The National Union of Scientific Workers’ (17: 1–2). Tansley may have been short of copy for Volume 1 of New Phytologist for pages 121-124 contain a letter ‘To the Editor of the “New Phytologist” on ‘”Reduction” in descent’. The letter is signed by AG Tansley, University College, June 1902."
