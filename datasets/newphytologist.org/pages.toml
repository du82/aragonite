["https://newphytologist.org/journals/plants-people-planet"]
title = "Plants, People, Planet - Journals"
description = "Plants, People, Planet journal"
full_description = "Plants, People, Planet publishes innovative plant-focused research at the intersection of plants, society, and the planet. We are a broad-scope journal and will consider all disciplinary plant-focused studies, as well as inter/transdisciplinary plant-focused studies, with societal impact and wide interest. We encourage work that seeks to address global issues with plant-focused solutions or questions. Given the vital importance of plants and plant-focused research to tackling major global challenges – such as climate change, biodiversity loss, human health and wellbeing – we are an ideal forum for highlighting work with implications for policy or for studies with practical applications. We welcome timely Reviews that synthesise the latest literature on topics of relevance to the journal’s interests. Reviews should consider the pathways to societal impact and reflect on the intersection of their area with other disciplines to drive forward developments in understanding. We also welcome authoritative Opinion pieces at the interface between plants and society. Opinions should provide novel and constructive perspectives related to debates of broad interest, or consider the role of plants or plant-focused research in innovative ways to advance thinking on global issues. When preparing to submit a manuscript to Plants, People, Planet, authors should carefully consider the impact of their work on people’s daily lives and on the world in which we live, and ensure their study and its findings are framed and discussed within this context. These types of wider societal aspects should be at the forefront of a submission, starting with the title, which should be written to reflect the journal’s interests and appeal to a broad audience, right through to the conclusion, which should carefully consider the immediate or potential impact of the work for people and the planet. Studies where one of the central motivations is benefit to society or to tackle global challenges are ideal for the journal."
year_published = 2025
clearnet = "https://newphytologist.org/journals/plants-people-planet"
