["https://www.newphytologist.org/nextgeneventpages/index/39"]
title = "Frequently asked questions  - Next generation scientists 2025"
full_description = "We are using Oxford Abstracts for applications. If you have not previously used Oxford Abstracts, you will need to sign up for an account with an email address. Oxford Abstracts provides a guide to making a submission. Once you have logged into your Oxford Abstracts account, you will be able to start your application. Please note that the system may use the term 'author' instead of applicant. Please ensure you complete all mandatory fields. Incomplete applications may be rejected. Once you submit your application you can amend it up to the deadline of 27 January 2025. If you want to save your application and continue working on it later, please ensure that you click 'next page' or 'submit'. You may be notified of incomplete fields, but this will save your progress and you can return later to complete the form. The Oxford abstract portal will format your abstract for you. The main text of the abstract should be no more than 200 words and should provide concise details of the background and objective(s) of the investigation, methods used, results and conclusions. Applicants are assessed based on the suitability of their research interests, as demonstrated in their proposed abstract. Abstracts are reviewed by New Phytologist Editorial and Advisory Board members and senior members of the organising committee. In addition to the suitability of their research interests, applicants will also be assessed on the strength of their personal statement and their letter of recommendation. You should review the descriptions of the sections of New Phytologist, and chose the section that best fits your work. If you are having difficulty deciding, you may want to review the research interests of our Editorial Board and choose the section of the Editor(s) that best match your own interests. Applicants should be either a current PhD candidate in plant science or have completed their PhD within the last five years. The number of years of experience excludes career breaks and should be calculated back from the date of the symposium, therefore for the 2025 symposium, a candidate that has not had a career break should not have completed their PhD before August 2020."
