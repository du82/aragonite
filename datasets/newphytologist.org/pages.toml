["https://newphytologist.org/news/view/352"]
title = "The challenges faced by plant biology researchers in the Global South"
description = "News item: The challenges faced by plant biology researchers in the Global South"
full_description = "In an article in the journal New Phytologist, a group of researchers led by José M. Estevez and Gabriela Auge call for reflection on the inequalities they face in their discipline, in comparison to their colleagues in the Global North. Although the work carried out in the field of plant biology by researchers from countries in the Global South is of high quality and their contributions are relevant to the discipline, their recognition at the international level is far from that received by their peers in the Global North. To highlight this situation, the journal New Phytologist published an article written by José Manuel Estevez, head of the Laboratory of Molecular Basis of Plant Development at Fundación Instituto Leloir, Argentina, and plant specialist Gabriela Auge, in which they explain the possible reasons behind these inequalities and propose ways to address the challenges in overcoming them. 'We try to show that although our community is thriving, the recognition does not match the impact that our work has in the field,' explains Auge, who leads the Plant Environmental Memory Laboratory at the Institute of Agrotechnology and Molecular Biology (IABIMO), which is part of INTA and CONICET in Argentina. 'I am sure that this is not something exclusive to those of us who do research in plants, but that it also happens in other fields of science,' she emphasises. Recent studies show that articles on plant biology written by North American authors receive, on average, twice as many citations as those from Latin American countries and sub-Saharan Africa, despite being published in journals with similar impact factors. This discrepancy is even more evident in ‘elite’ journals (with an impact factor greater than 7), where the difference can be quadrupled. 'National publication rates are positively correlated with GDP and R&D expenditure, with the majority of publications coming from the United States, Western European countries and China,' the authors state in the article. 'However, emerging economies such as India, Brazil, Iran, South Africa, Mexico and Argentina have also made notable contributions to increasing research output in upper-middle-income countries.'"
year_published = 2025
clearnet = "https://newphytologist.org/news/view/352"
