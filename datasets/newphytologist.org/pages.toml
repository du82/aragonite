["https://www.newphytologist.org/news/view/339"]
title = "New Phytologist Tansley Medal 2023 winner Martina Legris"
description = "News item: New Phytologist Tansley Medal 2023 winner Martina Legris"
full_description = "We are delighted to announce that the 2023 New Phytologist Tansley Medal for excellence in plant science has been awarded to Martina Legris. Martina is a postdoctoral researcher at the Centre for Integrative Genomics at the University of Lausanne, Switzerland. She is fascinated by plant developmental plasticity, and has been working on plant development in response to light and temperature signals from the environment using a variety of techniques, including molecular genetics, genome-wise expression studies, cell biology, biochemistry, and imaging of growth processes. In her Tansley insight 'Light and temperature regulation of leaf morphogenesis in Arabidopsis', Martina reviews the latest discoveries and understanding of environmental regulation of Arabidopsis leaf development, comparing signalling mechanisms between leaves and seedlings. Adrien Burlacot is a Principle Investigator in the Department of Plant Biology at the Carnegie Institution for Science, Stanford, CA, USA. Adrien's Tansley insight is titled 'Quantifying the roles of algal photosynthetic electron pathways: a milestone towards photosynthetic robustness'. James Clark is a Research Fellow at the Milner Centre for Evolution at the University of Bath, UK. James' Tansley insight is titled 'Genome evolution in plants and the origins of innovation'. Jenn Coughlan is an Assistant Professor in the Department of Ecology and Evolution, at Yale University, New Haven, CT, USA. Jenn's Tansley insight is titled 'The role of conflict in shaping plant biodiversity'. Jiorgos Kourelis is a Senior Postdoctoral Scientist at The Sainsbury Laboratory, Norwich, UK. Jiorgos' Tansley insight is titled 'Interplay between cell-surface receptor and intracellular NLR-mediated immune responses'. We offer our warmest congratulations to Martina and her fellow finalists, and wish them continued success in their future careers. The New Phytologist Tansley Medal for excellence in plant science is awarded annually in recognition of outstanding contributions to research by individuals in the early stages of their career. Applications for the 2024 New Phytologist Tansley Medal have closed, but you can be the first to know when applications for the 2025 New Phytologist Tansley Medal open by signing up to our mailing list."
year_published = 2025
clearnet = "https://www.newphytologist.org/news/view/339"
