["https://newphytologist.org/news/view/332"]
title = "Call for papers for a joint Special Collection – Anthromes and terrestrial carbon: from the deep past to net-zero"
description = "Call for papers: Anthromes and terrestrial carbon: From the deep past to net-zero"
full_description = "The New Phytologist Foundation invited abstracts for a joint Special Collection of Plants, People, Planet and New Phytologist on the theme of Anthromes and terrestrial carbon to build upon the success of the recent symposium on this topic. Anthropogenic biomes (anthromes, where interactions with people are explicitly recognized) cover the majority of Earth’s land surface and have done so since at least the beginning of the Holocene. This collection seeks to explore the inter-relationship of people, CO2-fertilisation, and terrestrial carbon source–sink dynamics during the deep past, through major cultural transitions, and in the net-zero motivated near-future. Aiming to bring together a collection of work that provides a global view of the multifaceted impacts of people on terrestrial carbon through time, we encourage submissions across disciplines (e.g. ecology, environmental and Earth system science, anthropology, political science, economics, and many others). We hope this collection will build on the goals of the associated symposium: 1) To build community; 2) Synthesise how developing understanding of anthromes influences our understanding of CO2-fertilisation of the natural land sink; 3) Discuss the impacts of human cultures through the deep past, industrial period, and into the future on terrestrial ecosystem carbon; 4) To consider net-zero culture as a driver of land carbon change, including the equity outcomes of the race to net-zero. While in this collection we focus on how an ‘anthromes lens’ alters our view of terrestrial carbon dynamics, manuscripts that demonstrate how this lens alters our understanding of other ecosystem functions and biodiversity will also be considered. On submission of abstracts in response to this call (see submission procedure below), authors may select their preferred journal and indicate whether they would also consent to consideration by the other journal, if judged appropriate by the editors. Plants, People, Planet publishes plant-focussed research with impact on people, society and the planet, and welcomes cross-disciplinary work. Manuscripts to be submitted to Plants, People, Planet could aim at unveiling compelling patterns, synthesising knowledge or providing perspectives and case studies, as original articles, reviews or other formats considered by the journal. The journal is particularly interested in studies that showcase how important plant-focused research is to society and people’s daily lives, including work with implications for policy and/or practice."
year_published = 2025
