["https://www.newphytologist.org/news/view/297"]
title = "Deadline extended! Call for papers: Madagascar's grassy biomes, from Holocene to Anthropocene"
description = "Plants People Planet call for papers: Madagascar's grassy biomes"
full_description = "Madagascar has become well-known for the rapid decline of its native biodiversity. Open biomes – especially grasslands and savannas – make up the majority of the island’s vegetation cover today, but the extent of grasslands and their expansion relative to human colonisation in the Holocene have been the subject of intense and ongoing debate. As a result, giving practical recommendations for conservation policies and supporting livelihoods of the Malagasy people is challenging. This special issue of Plants, People, Planet will bring together an exciting body of interdisciplinary research, reviews, case studies, and opinion pieces, focused on Malagasy grasslands, their management / conservation and their relevance for Malagasy society. We encourage submissions from researchers working in diverse backgrounds – earth, natural, and social sciences – with a past, present and future lens, to improve the theoretical and empirical understanding of open ecosystems and their contributions to livelihoods and conservation on Madagascar. We welcome submissions by 31 January 2023. Please contact the editorial office if you have any questions or a potential manuscript that you would like to discuss. Dylan Davis, Jan Hackel, Leanne Phelps, Tanambelo Rasolondrainy, Estelle Razanatsoa, and George Tiley Plants, People, Planet, owned by the not-for-profit New Phytologist Foundation, is an Open Access journal that aims to celebrate everything new, innovative and exciting in plant-focused research that is relevant to society and people’s daily lives. Articles submitted for consideration in Plants, People, Planet will be subject to peer review and must meet the aims and scope of the journal. Articles should include an engaging 100 word Societal Impact Statement to highlight why the work matters to people, society and the planet. We can publish alternative language versions of the Societal Impact Statement to enhance the reach and impact of your work. Please include any translated versions of this text, when submitting your work. Alternative language Societal Impact Statements are especially encouraged in Malagasy and / or French for the special issue. Please see an example of an alternative language Societal Impact Statement in English, French and Spanish."
year_published = 2025
