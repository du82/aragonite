["https://newphytologist.org/workshops/22"]
title = "22nd New Phytologist Workshop"
description = "22nd New Phytologist Workshop: Energy costs of mechanisms for salinity tolerance in crop plants: a cost-benefit analysis"
full_description = "Following this workshop, a feature issue on Salt Tolerance was published in New Phytologist. You can read the feature issue here. To complete a cost-benefit analysis in terms of energy demands of mechanisms of salinity tolerance in crop plants. This will take the form of calculating the ATP costs of regulating the uptake of the Na+ and Cl– from the soil, transporting Na+ and Cl– across roots and into leaves, and intracellular compartmentation of these ions to avoid Na+ and Cl- toxicity. The costs will be weighed against the benefits of avoiding ion toxicity and the costs of replacing ions with organic compounds for osmotic adjustment. Water flow coupled to ion fluxes at the protein and organ level will be a novel component of the analysis. We will bring together international expertise in seven key areas not traditionally discussed in salinity tolerance research. This will produce a unique analysis for framing salinity tolerance research and produce high impact publications."
year_published = 2025
