["https://newphytologist.org/symposia/12"]
title = "12th New Phytologist Symposium"
description = "12th New Phytologist Symposium"
full_description = "The ongoing effort to sequence the Populus genome is enabling new areas of research related to the genetic basis of adaptation. This symposium will explore the prospects for capitalizing upon model plant research and integrating molecular studies with traditional ecological and population genetics approaches to elucidate the molecular mechanisms by which plants adapt and respond to environmental stresses. New Phytologist sees areas at the interface between genomics and ecology, and the genetic basis of environmental adaptation as rapidly expanding key themes for the future. In light of this we are redefining the scope of the Function Section with a view to encouraging the best of the new emerging research. The 12th New Phytologist Symposium will hopefully not only serve to stimulate research in Populus, but also highlight the new perspectives of the Function section. We will also be producing a special issue based on the subject of the meeting. Two to three days of invited talks, posters, and discussion in the foothills of the Great Smoky Mountains during the beautiful fall color season. As usual the New Phytologist Trust is offering a number of bursaries for those research students and postdoctoral scientists who are presenting posters. There will be two prizes of 250 US dollars awarded for the best posters. Every participant at the meeting will have an opportunity to vote for the poster that they judge to be the best, based on the science presented in the best way in poster format. If you would like to receive further information relating to this meeting please get in touch with Holly Slater (New Phytologist) – h.slater@lancaster.ac.uk New Phytologist Central Office Bailrigg House Lancaster University LA1 4YE, UK Tel: +44 1524 594 691 Fax: +44 1524 594 696"
