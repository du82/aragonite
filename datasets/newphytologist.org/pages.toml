["https://newphytologist.org/symposia/13"]
title = "13th New Phytologist Symposium"
description = "13th New Phytologist Symposium"
full_description = "There is increasing evidence that components present in the plant extracellular matrix (cell wall and cuticle) have a major role to play in the control of plant development (reviewed in, Bird & Gray (2003), Signals from the cuticle affect epidermal cell differentiation. New Phytol 157: 9-23; Brownlee (2002), Role of the extracellular matrix in cell-cell signalling: paracrine paradigms. Curr Opin Plant Biol: 5, 396-401). For example cell wall polysaccharides are known to influence early zygote development in Fucus and cell differentiation in higher plants. In addition the lipids present in epicuticular waxes are known to influence the development of guard and other epidermal cells while recent work shows the mutants carrying lesions in cutin biosynthetic genes display malformed epidermis. The primary aim of this discussion-based meeting is to bring together biochemists, physiologists, cell biologist and geneticists working on different experimental systems in order to focus on this topical issue in plant developmental biology. The symposium will take place over two days at the Linnean Society of London, Burlington House, Piccadilly, UK. Eight invited talks will form the basis of discussion at what will be a relatively small meeting (up to 75 participants) which we hope will provide an ideal and informal atmosphere for the stimulation and exchange of ideas and the building of collaborations. If you would like to receive further information relating to this meeting please get in touch with Holly Slater (New Phytologist) – h.slater@lancaster.ac.uk New Phytologist Central Office Bailrigg House Lancaster University LA1 4YE, UK. Tel: +44 1524 594 691 Fax: +44 1524 594 696"
