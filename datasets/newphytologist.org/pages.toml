full_description = "New Phytologist Now is an online event series where you can discover the latest and most exciting plant science research. Following on from the highly successful 46th New Phytologist Symposium: Stomata, we present two further talks from leading scientists that were unable to join us in Kaifeng. These events are held on Zoom Webinar and will be recorded and available on demand on the New Phytologist Now Cassyni page. Subscribe on Cassyni to keep up to date with all the webinars, or register for the individual event. Sign up to our events mailing list to be kept up to date. If you have any other queries, please contact Christine Phillips, Events and Promotions Manager. An exciting two-part webinar highlighting the latest research in plant–microbe interactions, hosted by Francis Martin. In the spring of 2022 we hosted five webinars which featured up to three authors presenting their work on a common theme, hosted by a New Phytologist Editorial or Advisory Board member, followed by a live audience Q&A. All events were recorded and are available to watch on demand. In December of 2021 we launched the inaugural season of New Phytologist Now with three talks from recent New Phytologist Tansley Medal winners. Watch all the events on demand. The New Phytologist Tansley Medal is awarded annually in recognition of an outstanding contribution to research in plant science by an individual in the early stages of their career (including students and any researcher with up to five years’ experience since gaining / defending their PhD). Shortlisted candidates are invited to author a Tansley insight review for publication in New Phytologist and the winner(s) receives a prize of £2,000 (GBP)."
