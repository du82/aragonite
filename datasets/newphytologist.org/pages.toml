["http://newphytologist.org/symposiums/view/5"]
title = "34th New Phytologist Symposium"
description = "34th New Phytologist Symposium: Systems biology and ecology of CAM plants. Taking place at the Granlibakken Resort and Conference Center, Tahoe City, CA, USA, from 15-18 July 2014."
full_description = "Thanks to all of our symposium organisers, speakers and delegates who helped to make the 34th NPS a great success. We will continue to update this site with related information and meeting outputs as they become available, however if you have any questions please do contact us by email: New Phytologist Symposia on twitter @NewPhyt (symposium hashtag is #34NPS) or on Facebook. A free-to-access meeting report entitled 'Crassulacean acid metabolism biology' written by Travis Garcia, Karolina Heyduk, Emily Kuzmick and Jesse Mayer was published in issue 204:4 of New Phytologist. Juan Beltran, P2, ‘Evolutionary origins and ecophysiology of CAM photosynthesis in the montane genus Puya (Bromeliaceae)’ Paul Abraham, P1, ‘Capturing the dynamics of CAM: transcriptome and proteome analysis of diel cycle gene expression in Agave americana’ Erin Casey, P4, ‘The role of the chloroplastic glucose transporter in the operation of CAM in Kalanchoë fedtschenkoi’ Crassulacean acid metabolism (CAM) is a striking example of convergent evolution found in about 7% of higher plants that significantly enhances plant water use efficiency by facilitating the nocturnal uptake of CO2 coupled with day-time stomatal closure. The increased frequency of drought over the past century as well as substantial current variation and predicted future increases in its global occurrence has intensified interest in understanding how CAM plants are so well adapted to survive in water-limited environments. High-throughput sequencing of transcriptome, genome and proteome has been initiated internationally for several CAM species and the large-volume datasets generated from these projects look set to provide a step-change in our understanding of the mechanistic basis and evolutionary origins of CAM biochemistry. Effective utilization of these resources requires collaboration among molecular geneticists, physiologists, ecologists and taxonomists to generate hypotheses that expand the potential of the CAM system for developing more water-use-efficient crops, and for informing the improvement of economically and ecologically relevant CAM species for bioenergy production and maintenance of ecosystem services."
