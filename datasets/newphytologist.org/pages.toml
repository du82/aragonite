full_description = "On behalf of the New Phytologist Trust and symposium organisers, I would like to thank all of the delegates who participated in ‘Colonization of the terrestrial environment 2016’! Read the 38th New Phytologist Symposium Meeting report: 'Life's a beach – the colonization of the terrestrial environment' by Andrew Plackett and Juliet Coates. Congratulations to the winner of the 38th New Phytologist Symposium poster prize, Katie Field, with her poster 'Symbiotic options for the conquest of land'. Read Katie Field's Profile, in issue 212:4 of New Phytologist. Congratulations also to the runners up, Elise Biersma, with her poster entitled 'Global biogeography of the bipolar moss Polytrichum juniperinum reveals origin in Antarctic region' and Sandy Hetherington, with his poster, 'Unique cellular organisation in the oldest root meristem'. Watch all of the presentations recorded at the 38th New Phytologist Symposium on our Youtube playlist: .embed-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; } .embed-container iframe, .embed-container object, .embed-container embed { position: absolute; top: 0; left: 0; width: 100%; height: 100%; } The meeting took place over three days in Bristol, UK. It included a number of invited and selected talks (chosen from submitted poster abstracts), dedicated time for a poster session and a conference dinner. The purpose of this symposium was to explore the contribution that plants and mycorrhizal fungi made to the colonization of the terrestrial environment. Building on the success of the 25th New Phytologist Symposium the focus was on exploring current uncertainties in four major themes:"
