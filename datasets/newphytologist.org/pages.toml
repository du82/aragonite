["https://newphytologist.org/trust/code_of_conduct"]
title = "Code of Conduct - New Phytologist Foundation events  - The Foundation"
description = "New Phytologist Foundation code of conduct"
full_description = "The New Phytologist Foundation celebrates diversity, and we expect participants in our meetings to be respectful, considerate and supportive of each other, to offer constructive critiques and embrace the variety of opinions on offer. New Phytologist Foundation events are an opportunity to share, develop and broaden our viewpoints within a safe and inclusive setting. The New Phytologist Foundation has established a set of core principles that outline the standards expected of individuals involved in the Foundation’s activities, including symposia and workshops. We strive to treat all individuals with respect and promote a safe environment free from discrimination, harassment, and victimization. We will not tolerate behaviours that involve discrimination of individuals or groups on the basis of sex, race, ethnicity, gender identity, age, religion, disability, or any other characteristic protected by applicable laws. Sexual harassment, bullying, intimidation, or harassment in any form will not be tolerated. Any delegates that do not meet the expected respectful behaviour may be immediately removed from the online or physical meeting. If you have any concerns or suggestions, please speak to the Events and Promotions Manager, Christine Phillips, the Executive Editor, Sarah Lennon, or one of the organising committee. Alternatively, you can email np-symposia@lancaster.ac.uk We want to provide a safe environment for all of our delegates and will update COVID-19 protocols as necessary in the run-up to the symposium. The New Phytologist Foundation will be following all protocols issued at the national, local and host institution level. We will also enact additional best practice measures to ensure the safety of all participants as needed. Should an attendee test positive for COVID-19 after arriving / during the event, they should isolate in their room and inform the organisers by phone or email. All delegates are encouraged to ensure that they have appropriate travel insurance with health care, COVID-19 and cancellation cover."
year_published = 2025
