full_description = "The following students and early-stage career scientists (researchers in their first post-doctoral position) have been awarded New Phytologist Symposium grants. Poster prize winners for the various symposia are also listed here. Julieta Mallerman, Instituto de Investigaciones Fisiológicas y Ecológicas vinculadas a la Agricultura (IFEVA) The winner of the poster prize was Katie Field. The runners up were Elise Biersma and Alexander Hetherington. Meeting delegates voted for one winner and two runners up. The winner of the poster prize was Libera Lo Presti, Max Planck Institute for Terrestrial Microbiology, Germany. The runners up were Kasia Dinkeloo, Virginia Tech, USA, and Guillaume Robin, INRA, France. The judges awarded a joint first prize to Geneviève Parent (Université Laval, Canada) and Barnabas Daru (University of Pretoria, South Africa). The judges awarded first prize to Juan Beltran (University of Oxford, UK). Runner-up prizes were awarded to: Paul Abraham (Oak Ridge National Laboratory, TN, USA) and Erin Casey (Newcastle University, UK) The judges awarded first prize to Tania Wyss (University of Lausanne, Switzerland). Runner-up prizes went to: Lena Neuenkamp (University of Tartu, Estonia), Tessa Camenzind (Freie Universität Berlin, Germany), Katie Field (University of Sheffield, UK). The judges awarded joint first prize to Luis Ignacio Pérez (IFEVA - Universidad de Buenos Aires - CONICET, Argentina) and Serena Thomson (University of Warwick, UK). Runner-up prizes went to: Ruth Campe (RWTH Aachen University, Germany), Kiran Gadhave (Royal Holloway, University of London, UK), Mickaël Gaillard (University of Neuchâtel, Switzerland), Laura Martínez (IFEVA - Universidad de Buenos Aires - CONICET, Argentina), and Hao Xu (University of Alberta, Canada) The judges awarded first prize to Florent Martos, University of Kwazulu-Natal, South Africa. Runner-up poster prizes went to: Karin Gross, University of Zurich, Switzerland, Ursula Jaros, Univers