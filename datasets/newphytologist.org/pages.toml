["https://newphytologist.org/nextgenevents/2025"]
title = "Next generation scientists 2025"
full_description = "New Phytologist next generation scientists meetings are free events with the unique aim to provide the next generation of plant scientists a chance to share their work with their peers and outstanding international scientists in a stimulating, supportive and exciting environment. Attendance at the symposium is by application. Applications will be assessed based on the suitability of the early career researcher’s research interests in plant science, linked to the Aims and Scope of New Phytologist. This should be demonstrated in their personal statement and their letter of support from an established researcher. There are limited places to attend this symposium. All attendees will be expected to present a poster unless they are selected for a talk, in which case they would not be expected to also present a poster. Applications to attend are open to all plant science post-graduate researchers working towards a PhD, or for early career researchers who completed their PhD no more than five years ago. The number of years of experience excludes career breaks and should be calculated back from the date of the symposium, therefore for the 2025 symposium, a candidate that has not had a career break should have completed their PhD after August 2020. Eligibility is determined from the date that your PhD was passed / confirmed / gained, which may be the date of a successful thesis defence or the date that final corrections are accepted by your institution. This is not the date when your degree may have been officially presented / awarded / conferred in a graduation ceremony, as in many cases this could be significantly after the PhD was completed. Delegates who have attended a previous New Phytologist next generation scientists symposium in person would generally not be eligible to attend as a delegate in person a second time. The decision of the organising committee on applicant selection is final. The New Phytologist Foundation reserves the right to deny the application of any delegate."
