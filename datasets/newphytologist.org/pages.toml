["https://www.newphytologist.org/news/view/310"]
title = "Call for papers: Forgotten crops, agricultural change and food heritage"
description = "Call for papers: Forgotten crops, agricultural change and food heritage"
full_description = "Over the last century, crop diversity loss has accelerated globally, and a narrowing range of food species has become dominant. There is increasing consensus on the need to conserve local crop species and varieties in situ, and to re-diversify food systems. Many little-known or ‘forgotten’ crops are still cultivated and important in local food systems, or were until recently. These crops are poorly documented, rarely collected, and sometimes endangered. In this special issue, we will provide a forum to learn from initiatives and projects that aim to revive, protect, and promote forgotten crops. We especially encourage dialogue around interdisciplinary and cross-sector approaches to crops in their local cultural, ecological, and historical contexts, from farm to plate. The importance of understanding links between culture and biodiversity (biocultural relationships) is increasingly highlighted in research literature, but studies that combine methodologies from the humanities, social sciences and life sciences remain limited in practice. 'Agricultural heritage' and 'food heritage' are heuristic concepts that allow us to examine how crop diversity is interconnected with culture-specific crop production, utilization, and associated traditional ecological knowledge. Deep-time perspectives on the forces influencing present-day agrobiodiversity and the sustainability of agricultural practices are also growing areas of research, but remain largely unlinked to modern agricultural and social development. For this special issue, we seek contributions related to conserving and reviving forgotten crops, breeding, agronomy, agricultural heritage, and food heritage, including (but not limited to) the following topics: Submissions can follow a short to long format for new research, case-studies, perspectives and opinions, or reviews. Please submit your manuscript by 31 January, 2023. Please contact the editorial office if you have any questions, or a potential manuscript that you would like to discuss."
year_published = 2025
clearnet = "https://www.newphytologist.org/news/view/310"
