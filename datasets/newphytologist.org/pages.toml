["https://www.newphytologist.org/news/view/303"]
title = "Plants, People, Planet call for papers: Agricultural biotechnology"
description = "Plants, People, Planet call for papers: Agricultural biotechnology"
full_description = "With a rapidly expanding human population, urbanisation, poverty and threats from climate change, new innovations are desperately needed to ensure future food security and nutrition requirements in a just and sustainable manner. Agricultural Biotechnology has the potential to achieve step changes in crop productivity to meet these needs whilst minimising agricultural environmental impacts, but critical questions remain on how the technology is developed and used, and for whom. More generally, agricultural biotechnology is inevitably intertwined with issues of politics, economics, and culture that shape how and if the technology will contribute to global food security, empower marginalised voices and produce transformative change that fosters healthy relations between plants, people and the planet. This special collection will present the role of natural and social science as ‘honest brokers’ of agricultural biotechnology to help engage, enrich debate, and inform policy. To achieve this, the special collection will provide a forum for works on both the current and prospective positive and negative impacts of agricultural biotechnology to the environment and society. We encourage articles from across disciplines and around the globe to provide a comprehensive range of views surrounding agricultural biotechnology and its progress. We especially encourage submissions from the Global South. Please note, special collection articles will be published in regular issues of Plants, People, Planet as they are accepted for publication. Accepted articles will then be compiled to form the special collection, which will be updated at frequent intervals. We welcome the submission of articles on an ongoing basis. The first iteration of the collection will be composed of articles submitted no later than 15 February 2023. We encourage expressions of interest and abstracts for consideration at any time. Please get in touch with your article ideas at ppp@lancaster.ac.uk. Plants, People, Planet, published by the not-for-profit New Phytologist Foundation, is an Open Access journal that aims to celebrate everything new, innovative and exciting in plant-focused research that is relevant to society and people’s daily lives."
year_published = 2025
clearnet = "https://www.newphytologist.org/news/view/303"
tags = ["africa", "agricultural", "biotechnology", "biotechnology,", "call", "climate", "current", "economics", "february", "focus"]
