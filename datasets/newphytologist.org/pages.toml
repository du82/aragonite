full_description = "The New Phytologist Tansley Medal is awarded annually in recognition of an outstanding contribution to research in plant science by an individual in the early stages of their career (including any researcher with three to five years’ experience since gaining / defending their PhD). Shortlisted candidates are invited to author a Tansley insight review for publication in New Phytologist and the winner(s) receives a prize of £2,000 (GBP). 'The Tansley Medal competition is unique because the shortlisted candidates have the opportunity to write a Tansley insight – immensely valuable experience for an early career researcher.' 'Winning the New Phytologist Tansley Medal was a beautiful recognition from the plant science community, and it allowed me to gain visibility in a key moment of my career, while starting my research group.' Join us in conversation with Martina Legris in this free webinar hosted by New Phytologist Editor John Christie."
