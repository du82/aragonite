["https://www.newphytologist.org/news/view/55"]
title = "New Phytologist Trust prize winners at ESA 2014"
description = "Announcing the winners of two student prizes sponsored by the New Phytologist Trust, awarded at the 2014 Ecological Society of America annual meeting held in Sacramento, CA, USA. Danielle Marias and Kelly Hopping"
full_description = 'We are delighted to announce the winners of two student prizes sponsored by the New Phytologist Trust, awarded at the 2014 Ecological Society of America annual meeting held in Sacramento, CA, USA earlier this year. The winner of the ESA Physiological Ecology Section New Phytologist Poster Prize is Danielle Marias (Oregon State University, USA) for her poster presentation: ‘Thermotolerance of Coffea arabica: potential implications in a warming world" with co-authors Rick Meinzer and Chris Still.’ Read more about Danielle’s research on her website http://danielleemarias.wix.com/danielleemarias The winner of the ESA Biogeosciences Section award for best student Best Student Presentation, is Kelly Hopping (Colorado State University, USA) for her talk on: ‘Climate change and grazing drive cascading responses in plant communities and carbon cycling on the Tibetan Plateau’. Read more about Kelly’s research on her website http://warnercnr.colostate.edu/~khopping/index.html Supporting and nurturing the next generation of plant scientists is a core aspect of the activities of the New Phytologist Trust and the Trust is able to provide small grants to fund awards such as these via the New Phytologist Trust Innovation Grants. If you would like to apply for an innovation grant please send a preliminary enquiry to the Managing Editor.'
