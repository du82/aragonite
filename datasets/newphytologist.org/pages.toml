["https://www.newphytologist.org/news/view/295"]
title = "Call for papers: Global plant diversity and distribution"
description = "Call for papers: Global plant diversity and distribution"
full_description = "The New Phytologist Foundation is calling for submission of abstracts for a joint special issue of New Phytologist and Plants, People, Planet on the theme of Global Plant Diversity and Distribution. This collection of peer-reviewed papers will celebrate the completion in November 2021 of the World Checklist of Vascular Plants (WCVP) from the Royal Botanic Gardens, Kew, an endeavour led by Rafaël Govaerts and his team over more than two decades. The dataset contains nearly 1.4 million plant names, of which 345,000 are accepted species. Since its inception in 1988, it has been continuously updated with newly published data, and is now complete, with geographic data for all taxa. With this vast and robust dataset, either alone or integrated with other data, new and exciting questions can be explored with an increased level of confidence. The release of the full WCVP dataset (in advance for contributors to this joint issue, and in November 2022 for the wider public) is therefore likely to be transformational in biodiversity studies, helping to bring plant science up to speed with work on other organism groups, such as mammals and birds. This critical mass of information means that there is now a perfect opportunity to synthesise and advance plant diversity and distribution knowledge on a global level. A team of editors is proposing to bring together the research community to attempt such a synthesis, in a series of papers that explore these plant data in the New Phytologist Foundation’s internationally leading journals: New Phytologist, and Plants, People, Planet. The papers will include analyses of the WCVP alone or in combination with other data sources. They may focus on multiple aspects of patterns and drivers of diversity, endemism, threat and bioregionalisation, gap analyses for collections, and priority areas for conservation, among others. On submission of abstracts in response to this call, authors must specify their preferred journal and indicate whether they would also consent to consideration by the other journal, if judged appropriate by the editors. If you are unsure of which journal to specify, please contact the New Phytologist Foundation’s Executive Editor, Sarah Lennon."
year_published = 2025
