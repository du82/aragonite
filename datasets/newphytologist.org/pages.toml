["https://newphytologist.org/news/view/100"]
title = "Viewpoint: Standard syntax for synthetic biology"
description = "Viewpoint: Standard syntax for synthetic biology"
full_description = "An international team of plant scientists and synthetic biologists have outlined a ‘common grammar’ for use when assembling multiple DNA fragments to be inserted into eukaryotic organisms, described in a Viewpoint in New Phytologist (available as Early View). Until recently, the co-assembly of several DNA sequences into a single plasmid for use in genetic engineering was inefficient and time consuming, but advances in synthetic biology techniques have allowed a library of standardised biological parts to be developed for rapid assembly. In their Viewpoint article, Nicola Patron and her colleagues describe how ‘Golden Gate’ cloning, which allows the simultaneous and ordered assembly of DNA fragments using a set of synthetic biology tools, will “simplify the process of designing, constructing and modifying complex biological systems”. Golden Gate cloning makes use of Type IIS restriction enzymes, which, unlike Type II restriction enzymes, recognise non-palindromic sequence motifs and can cleave the DNA outside of their restriction site. This allows users to define the overhang sequence at the ends of their fragment, producing fragment-specific ends that can be used to simultaneously assemble many DNA strands in a specific order. Image: Synthetic plant biologists can use Type IIS restriction enzymes to produce compatible overhang sequences at the ends of their DNA fragments, enabling simultaneous and ordered assembly of all parts in a combined digestion-ligation reaction. Image credit: Patron et al., 2015. Several research groups have developed their own Golden Gate tools that are incompatible with other laboratories. The shared syntax of standardised reusable components developed Patron et al. will facilitate cooperation throughout the plant science community, accelerating bioengineering and enabling new innovations in plant synthetic biology. Image: The universal acceptor plasmid described by Patron et al. (2015) is a tool used in Golden Gate cloning. Image credit: Patron et al. (2015)."
year_published = 2025
clearnet = "https://newphytologist.org/news/view/100"
