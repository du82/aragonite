["https://newphytologist.org/symposia/31"]
title = "31st New Phytologist Symposium"
description = "31st New Phytologist Symposium. Orchid symbioses: models for evolutionary ecology"
full_description = "Thanks to all of our symposium organisers, speakers and delegates who helped to make the 31st NPS such a great success. We will continue to update this site with related information as it becomes available. A cluster of papers highlighting the use of orchids as models to investigate the ecology and evolution of biological interactions was published in Volume 202, Issue 2 of New Phytologist. Click here to see the list of associated papers. Congratulations to Florent Martos (University of Kwazulu-Natal, South Africa) who was the winner of the New Phytologist poster prize for his poster 'Evidence for extreme specialization in both above- and belowground symbioses in Gastrodia (Orchidaceae)'. Karin Gross (University of Zurich, Switzerland): ‘Floral signal evolution in the rewarding orchid genus Gymnadenia is influenced by pollinators and ploidy level.’ Ursula Jaros (University of Salzburg, Austria): ‘Reproductive and population genetic consequences of remote island colonization in Bulbophyllum occultum THOUARS (Orchidaceae) from Madagascar and La Réunion’ Rafael Valadares (Universidade de São Paulo, Brazil): ‘Differential protein accumulation in mycorrhizal and non-mycorrhizal roots of Oeceoclades maculate’ Orchids are outstanding models of biological interactions, due to their strong and diverse links with pollinators and mycorrhizal fungi, which are required for their germination. Biological interactions have strongly shaped the life cycle, reproductive biology and morphology of orchids. In addition, both kinds of interactions range from mutualistic to exploitive in mycoheterotrophic or pollinator-deceiving species. Indeed, the 24000 species of this family have already attracted a large number of research programs. Many tools have recently been applied to the study of orchid interactions, such as chemical ecology, stable isotopes, high-throughput sequencing and in vitroexperimental designs, and data from tropical ecosystems are now increasingly published. A wide spectrum of conceptual evolutionary frameworks, such as general evolutionary theories on mutualism and plant distribution, as well as robust phylogenies are now available, but still poorly utilised in orchid research."
