["https://newphytologist.org/news/view/337"]
title = "Grapes: global status and future potential – a call for papers"
description = "Grapes: global status and future potential – a call for papers"
full_description = "Grapes (Vitis L. - Vitaceae) are one of the world’s oldest and most widely consumed fruit crops. Globally, wine and table grapes have mainly been harvested from the domesticated European grapevine (Vitis vinifera L.). However, many species in the Vitis genus are of increasing global importance for breeding V. vinifera and direct production, although they remain poorly known and under-explored. In this Special Collection of Plants, People, Planet we explore and celebrate the historical and current contributions, as well as the future potential, of Vitis. We seek the submission of manuscripts that describe the current state of knowledge on Vitis including, but not limited to, agronomy, biodiversity, biogeography, breeding, biology, conservation status, ecology, enology, evolutionary history, genetics and genomics, microbiology, physiology, viticulture, and taxonomy, as well as historical and contemporary uses of Vitis species. We encourage manuscripts from across disciplines and around the globe, with particular interest in the diversity in North America and in eastern Asia - which is so rich at the taxon level but so poorly described. We especially welcome: Contributions to the Special Collection can be submitted under the Research, Review, Opinion, Methods and Techniques, or Brief Report categories. However, if you have any questions about how to categorize or format your manuscript please contact us, and we will be able to help. Please note, Special Collection articles will be published in regular issues of Plants, People, Planet as they are accepted for publication, before being compiled together in a virtual collection with an overarching Editorial that discusses the papers and key themes. We welcome the submission of full manuscripts no later than 30 April 2024. We encourage expressions of interest and abstracts for consideration. Please get in touch with your article ideas at ppp@lancaster.ac.uk. The Special Collection Editors: Allison Miller, Colin Khoury, Anne Fennell, Zoë Migicovsky, and Jun Wen"
year_published = 2025
clearnet = "https://newphytologist.org/news/view/337"
tags = ["2024.", "april", "articles", "brief", "call", "call for papers; plants", "collection", "contact", "deadline", "full"]
