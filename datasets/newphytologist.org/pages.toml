["https://www.newphytologist.org/symposia/45"]
title = "45th New Phytologist Symposium"
description = "45th New Phytologist Symposium: Ecological and evolutionary consequences of plant–fungal invasions"
full_description = "The New Phytologist Foundation is calling for the submission of abstracts for a joint Special Collection of Plants, People, Planet and New Phytologist on the theme of ‘Ecological and evolutionary consequences of plant–fungal invasions'. Cecelia Stokes [#3] Can mushroom toxins enable a biological invasion? Testing enemy release and novel weapons hypotheses with invasive death caps Read our Profile on Cecelia Stokes Anna Abrahão [#1] Direct-seeding restoration is associated with acquisitive nutrient-use and -acquisition traits Corinne Vietorisz [#4] Pine encroachment into hardwood forests alters soil fungal communities with consequences for soil nutrient cycling Guilherme Alencar [#8] Water use strategies differ between native and invasive African grasses in the Cerrado Naara Christine Ferreira Ximenes [#13] Arbuscular mycorrhizal fungi and dark septate endophytes in Brazilian semiarid forests and savannas along a water-stress gradient Naoto Nakamura [#14] The relationship between population density of invasive plants and soil microbial communities Silmar Primieri [#18] Multipartite symbioses of Mimosa scabrella: interactions among partners determine biological processes As human activities increasingly alter the distribution and relative dominance of plant and soil fungal communities through introductions and management, it is becoming critical to understand the consequences of these changes for biodiversity and ecosystem functions. Although some case studies demonstrate that introduced plants and fungi bring highly novel traits into ecosystems, relatively little is known about the broad biogeographic patterns, ecological/evolutionary dynamics, and ecosystem/biogeochemical consequences of such introductions. We are aware of numerous individual projects on major plant–fungal co-invasions, and a recent paper (‘The emerging science of linked plant–fungal invasions’ by Dickie et al., New Phytol 215:1314–1332) made important contributions to a conceptual framework. This international symposium will build on this foundation, allowing a synthesis of results to date by identifying common themes/goals, developing collaborations across native/introduced ranges, and leveraging a global network to identify questions of large geographic scope."
year_published = 2025
clearnet = "https://www.newphytologist.org/symposia/45"
