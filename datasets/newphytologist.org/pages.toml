["https://newphytologist.org/reviews/about"]
title = "New Phytologist review articles"
description = "New Phytologist review articles - descriptions of each of our different review types including  Tansley reviews and Tansley insights"
full_description = "New Phytologist publishes three types of review articles: our in-depth Tansley reviews, our shorter, focussed Tansley insights, and our mid-size Research reviews. With the exception of Research reviews, which may be submitted at any time, all other review types are by invitation-only. Enquiries or suggestions about reviews are of course welcome at any time (contact: Holly Slater, Senior Commissioning Editor np-managinged@lancaster.ac.uk) On this page you will find descriptions of each article type together with the five most recently published reviews. Search our reviews database here Patrick P. Edger; Douglas E. Soltis; Shunsuke Yoshioka; Mario Vallejo-Marin; Rie Shimizu-Inatsugi; Kentaro K. Shimizu; Armel Salmon; Simon Hiscock; Malika Ainouche; Pamela S. Soltis The New Phytologist Tansley review series was initiated in 1985 to provide a service to the plant science community. Named in recognition of the journal’s founder, Sir Arthur Tansley, these specially invited in-depth reviews have proved to be both authoritative and accessible – all are written by scientists engaged in the most exciting, ground-breaking research. In keeping with Tansley's philosophy, we encourage a personal perspective, with lively and thought provoking discussion. Another trademark of the Tansley review is that, whilst we expect relevant older work to be discussed, the review should be less of an exercise in literature documentation and more of a forum for the synthesis and presentation of ideas. A typical Tansley review is 6000 - 8000 words in length, with up to 150 references and 8 figures. Tansley insights provide a platform for short (c. 2000 words, with up to 40 references and 4 figures) and timely reviews that highlight recent developments or discoveries within the plant sciences. These articles focus on one specific area of a field, rather than providing a full literature review, and in this way will generally concentrate on reviewing the most recent articles (past two years). In keeping with Tansley's philosophy, personal perspectives are encouraged, whilst maintaining a balanced outlook. Importantly, Tansley insights will be written in a clear and concise format that is accessible to our general readership. From 2015 short-listed Tansley Medal candidates will write a single-authored Tansley insight as part of the competition process."
year_published = 2025
