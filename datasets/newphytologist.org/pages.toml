full_description = "We are delighted to announce that the 2023 New Phytologist Tansley Medal for excellence in plant science has been awarded to Martina Legris. Watch Martina's New Phytologist Now webinar: Light and temperature regulation of leaf morphogenesis in Arabidopsis It is our great pleasure to announce that the 2022 New Phytologist Tansley Medal for Excellence in Plant Science has been awarded jointly to Leander Anderegg and Moi Exposito-Alonso. It is our great pleasure to announce that the 2021 New Phytologist Tansley Medal for Excellence in Plant Science has been awarded jointly to Michal Bogdziewicz and Anna T Trugman. We are delighted to announce that the 2020 New Phytologist Tansley Medal for Excellence in Plant Science was awarded to Tommaso Jucker of the University of Bristol, UK. Tommaso's Tansley insight is titled 'Deciphering the fingerprint of distubrance on the three-dimensional structure of the world's forests'. The judging panel for the 2020 competition was comprised of New Phytologist Editors Amy Austin, Liam Dolan, and Elena Kramer. We are delighted to announce two winners for this year's New Phytologist Tansley Medal for Excellence in Plant Science! The judges voted to award two Tansley Medals to: The judging panel was comprised of New Phytologist Editors Prof. Amy Austin, Prof. Liam Dolan, and Prof. Elena Kramer. We are very pleased to celebrate two winners for this year's New Phytologist Tansley Medal for Excellence in Plant Science! The judges voted to award the prize jointly to: The judging panel was comprised of New Phytologist Editors Prof. Amy Austin, Prof. Liam Dolan, Prof. Elena Kramer, and Prof. Natalia Requena. Read the Editorial by Lennon & Dolan The New Phytologist Tansley Medal 2018 – Liana Burghardt and Jana Sperschneider We are delighted to announce the winner of the 2017 New Phytologist Tansley Medal for Excellence in Plant Science. This year, the judges have decided to award the Medal to Stella Cesari, of INRA, UMR-BGPI, M