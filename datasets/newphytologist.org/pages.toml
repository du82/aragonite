title = "Next Generation Scientists"
description = "Next Generation Scientists"
full_description = "New Phytologist next generation scientists is now an annual event. In 2025 it will be held at the University of Birmingham, UK. New Phytologist next generation scientists meetings are free events with the unique aim to provide the next generation of plant scientists a chance to share their work with their peers and outstanding international scientists in a stimulating, supportive and exciting environment. The first meeting took place in July 2014 at the John Innes Centre in Norwich, UK, followed by a second in 2017. The 2019 meeting took take place at University College Dublin, Ireland. The 2022 meeting took place at the Delta Centre in Tartu, Estonia, and the New Phytologist next generation scientists 2023 took place on 2–5 July 2023 at the National University of Singapore. In 2024 it was held at Duke University, Durham, NC, USA."
