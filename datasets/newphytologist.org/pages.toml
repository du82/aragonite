["https://newphytologist.org/news/view/336"]
title = "Call for papers: Methodologies for investigating plant awareness"
description = "Call for papers: Methodologies for investigating plant awareness"
full_description = "Plants, People, Planet is calling for the submission of papers for a Special Issue on ‘Methodologies for investigating and fostering plant awareness’ to build upon the success of the recent symposium on this topic. Biologists have long bemoaned the lack of interest in plants, a phenomenon that was originally known as 'plant blindness', but which has more recently been described as 'plant awareness disparity' or 'low plant awareness'. Plant awareness has never been more important than in the current ecological crisis. However, the methodological aspects of this arena call for further work. Our aim with this Special Issue is to stimulate methods-based discussions about plant awareness. We are seeking contributions that explore and examine a variety of perspectives about plant awareness, compare assessment tools for studying its characteristics and discuss evidence-based practice and innovation for teaching and learning. We are particularly keen to receive submissions that consider the central question: What are the methodologies used for investigating plant awareness and what are their relative affordances and constraints for advancing our understanding of this construct? The Guest Editors encourage submissions from a diverse range of disciplines, including, but not limited to: ecology, biology, education, psychology, geography, the arts and humanities, using quantitative and qualitative methodologies. Plants, People, Planet publishes plant-focussed research with impact on people, society and the planet, and welcomes cross-disciplinary work. Manuscripts submitted to Plants, People, Planet could aim at unveiling compelling patterns, synthesising knowledge or providing perspectives and case studies, as original articles, reviews or other formats considered by the journal. The journal is particularly interested in studies that showcase how important plant-focused research is to society and people’s daily lives, including work with implications for policy and/or practice."
