title = "Next generation scientists 2023"
description = "New Phytologist next generation scientists 2023"
full_description = 'New Phytologist next generation scientists 2023 took place on 2–5 July 2023 at the National University of Singapore. We are delighted to announce the winners of the 2023 New Phytologist next generation scientists poster competition. Winner - Chung-Wing Ko, Nanyang Technological University, Singapore for her poster "Root traits and belowground characteristics reveal nutrient uptake strategies across old-growth and secondary forests in Singapore’s Central Catchment Nature Reserve" New Phytologist next generation scientists meetings are free events with the unique aim to provide the next generation of plant scientists a chance to share their work with their peers and outstanding international scientists in a stimulating, supportive and exciting environment. This event is exclusively for early career researchers, including students and any researcher with up to five years’ experience since gaining/defending their PhD, excluding career breaks. Successful applicants will receive free registration. Delegates attending from outside of Singapore will receive three nights of accommodation in student halls of residence at the National University of Singapore, as well as a travel grant to support their travel to the event.'
