["https://www.newphytologist.org/news/view/353"]
title = "Call for papers: New Phytologist Special Collection on Stomata"
description = "Call for paper: New Phytologist Special Collection on Stomata"
full_description = "As highlighted at the 46th New Phytologist Symposium, there have been dramatic developments in our understanding of stomata in recent years. These extend from how stomata function and development is controlled, to their evolution and the impact of manipulating stomatal function on plant water-use efficiency. With this Special Collection we aim to review these developments and plan for future stomatal research needs, including research of both a fundamental nature and that which will result in short-term societal benefits. Given the context of environmental change that affects all parts of the globe, it is essential to place stomatal research in this overarching context and we welcome submissions on this topic. This call for papers is now closed. All abstracts of potential articles will be considered for their suitability, and we will aim to get a decision back to authors within three weeks of abstract submission. The deadline to submit the full manuscript will be 30 June 2025, but you are welcome to submit before this date if your manuscript is ready. Authors must also ensure they refer to the full Author guidelines before submission, which contain full information on how to compile your manuscript, as well as full details on style and legal requirements. Please contact Holly Slater, Senior Commissioning Editor, New Phytologist (np-commissions@lancaster.ac.uk), with any queries."
