["https://newphytologist.org/news/view/346"]
title = "Plants, People, Planet call for papers: Innovation in plant and soil sciences to tackle critical global challenges"
description = "Plants, People, Planet call for papers: Innovation in plant and soil sciences to tackle critical global challenges"
full_description = '''Plants, People, Planet is calling for submission of abstracts for a Special Issue on the theme of 'Innovation in plant and soil sciences to tackle critical global challenges'. Read the editorial "Innovation in plant and soil sciences to tackle critical global challenges" in Plants, People, Planet The environmental consequences of anthropogenic climate change and other types of environmental degradation pose enormous challenges for the future of human societies, requiring us to balance consumption with conservation and production with restoration to increase sustainability. Plants and soils are at the very centre of these challenges. As they are directly affected by climate change, they can serve as key indicators of climate change. At the same time, they can offer opportunities to develop strategies that aim to mitigate and minimise environmental, biodiversity and societal impacts of climate change. The complexity of the current challenges require a paradigm shift in how we use and manage our planet's plants and soils so that new approaches prioritise both productivity and sustainability to support the global population, while minimising adverse impacts on the wider environment. To address these pressing challenges, it is critical that researchers in plant and soil sciences come together to develop solutions to drive adaptation to changing conditions and mitigation of past and current damage. In this Special Issue of Plants, People, Planet, we will bring together an exciting collection of innovative new research, reviews, reports and opinion pieces exploring the latest innovations in plant and soil sciences and their contributions to addressing the climate and ecological crises. We welcome suggestions for potential articles covering all aspects of plant and soil research in the context of global change and associated challenges. We welcome articles within (but not limited to) the following broad themes: To promote scientific inclusion, diversity and equity, we particularly welcome submissions from under-represented groups, ethnic minorities, low-income countries, and authors at a diversity of career stages.'''
year_published = 2025
