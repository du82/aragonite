["https://www.newphytologist.org/news/view/338"]
title = "Call for papers: Nectar and nectaries"
description = "New Phytologist call for papers: Nectar and nectaries"
full_description = "Nectar, referred to as the 'drink of the gods' in Homer's Iliad, is the central bridge between flowering plants (angiosperms) and the pollinating animals on which these plants rely. The consumption of nectar and the subsequent transfer of pollen by specific pollinators are vital to the reproductive success of most angiosperms. In flowering plants, nectar is produced and secreted by specialized tissues termed the nectary, which can be found on many disparate organs of the plant body but primarily the floral organs. The presence of nectaries has independently evolved multiple times during angiosperm evolution, and many aspects of the nectary and associated organs have diversified to accommodate different pollinators. Over the last decade, research into all aspects of nectar and nectary biology has expanded rapidly. We feel the time is ripe to collate and review these developments in a Special Collection. We are inviting papers on this diverse topic, where active areas of study range from nectar composition, physiology and metabolomics to nectary development and evolution, to the ecology of plant–pollinator interactions, nectar microbiomes, and more. To register your interest in submitting a manuscript, please complete the form by clicking the button below: If you are unable to use the form, you may send an email to the Senior Commissioning Editor, Holly Slater, indicating: Author guidelines specific to this special collection can be found here, and if you have any queries, please do not hesitate to get in touch."
