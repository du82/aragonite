["https://newphytologist.org/news/view/102"]
title = "New Phytologist Editors’ Choice October 2015"
description = "New Phytologist Editors' choice October 2015, 208:1"
full_description = "In June 2012 the 4th New Phytologist Workshop on synthetic biology brought together scientists working in the highly interdisciplinary field of synthetic biology to discuss research across three key themes, including ‘Engineering principles and approaches in synthetic biology’; ‘Synthetic biology in microbes’; and ‘Synthetic biology in plants’. The presentations from this Workshop are freely available: https://www.newphytologist.org/workshops/view/5. It is fitting, therefore, that we take this opportunity to highlight a cluster of articles published in the most recent issue of New Phytologist, which develop the themes discussed at the June 2012 Workshop. First, a new Viewpoint article in the Forum section of the journal outlines the development of the first common standard for the assembly of DNA parts for plant synthetic biology. This work led by Dr Nicola Patron of the Sainsbury Laboratory, Norwich, UK, describes the development of a standard for Type IIS restriction endonuclease-mediated assembly, defining a common syntax of 12 fusion sites to enable the assembly of eukaryotic transcriptional units. This common syntax is the result of work by leaders of the international plant science and synthetic biology communities, including inventors, developers and adopters of Type IIS cloning methods. Figure 3 from Patron et al. (2015). Twelve fusion sites have been defined. These sites allow a multitude of standard parts to be generated. Standard parts comprise any portion of a gene cloned into a plasmid flanked by a convergent pair of BsaI recognition sequences. Parts can comprise the region between an adjacent pair of adjacent fusion sites. Alternatively, to reduce complexity or when a particular functional element is not required, parts can span multiple fusion sites (examples in pink boxes). Also in the Forum, a Meeting Report by Ruth Carmichael and co-authors highlights the ERASynBio/OpenPlant summer school for early career researchers, held in September 2014. This meeting aimed to provide participants with an introduction to synthetic biology in plant systems, and it marks the second ERASynBio-funded summer school that brought together early career researchers for synthetic biology training and networking."
year_published = 2025
