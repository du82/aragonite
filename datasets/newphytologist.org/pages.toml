["https://www.newphytologist.org/news/view/287"]
title = "Call for papers: Fruit in focus"
description = "News item: Call for papers: Fruit in focus"
full_description = "From the forbidden fruit in the Garden of Eden, to thousands of years pressing grapes into wine, to the role of citrus in combating scurvy on long sea voyages, fruit have played an important role in shaping human history and culture. Flowering plants and their fruit are biologically important as part of complex ecosystems, not only as a food for a broad diversity of organisms, but also as a critical source of essential nutrients for people around the world. 2021, the UN General Assembly's International Year of Fruit and Vegetables, is the ideal time for researchers to come together to reflect upon and share the importance of fruit to natural ecosystems and society in a special issue of Plants, People, Planet. Flora Obscura articles on new or unusual species of fruit or plants with interesting biology that produce fruit, potentially as part of a relationship with another species The guidelines and article types stipulated above are flexible. However, articles related to these topics should all set research within the context of their wider relevance to people, society, and the planet. We welcome submissions from the community by 15 March 2022. Please contact the editorial office if you have any questions or a potential manuscript that you would like to discuss. Plants, People, Planet (opens in a new tab), owned by the not-for-profit New Phytologist Foundation, is an Open Access journal that aims to celebrate everything new, innovative and exciting in plant-focused research that is relevant to society and people's daily lives. Manuscripts submitted for consideration in Plants, People, Planet will be subject to peer review and must meet the aims and scope of the journal (opens in a new tab). Articles should include an engaging 100 word Societal Impact Statement to highlight why the work matters to people, society and the planet. Before submission, please read the full Author Guidelines (opens in a new tab), which contain information on article types and format, as well as details on how to compile your manuscript. Please contact the editorial office if you have any questions or a potential manuscript that you'd like to discuss."
year_published = 2025
clearnet = "https://www.newphytologist.org/news/view/287"
