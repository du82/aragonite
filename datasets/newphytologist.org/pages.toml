["https://newphytologist.org/news/view/345"]
title = "New Phytologist seeks a new Editor-in-Chief from 2025"
description = "News item: New Phytologist seeks a new Editor-in-Chief from 2025"
full_description = "New Phytologist is seeking a new Editor-in-Chief to succeed Professor Alistair Hetherington, who will step down from the role at the end of December 2024. New Phytologist is a leading international plant science journal that publishes excellent, novel, rigorous and timely research and scholarship in plant science and its applications. Published by the not-for-profit New Phytologist Foundation, all excess revenues from the publication are put back into the plant science research community. The journal aims to provide an outstanding level of service to its authors, reviewers, and readers. The Editor-in-Chief of New Phytologist leads and oversees the journal’s editorial policy, vision and scientific direction and strategy. Supported by the Executive Editor, Managing Editor, Section Editors and wider editorial board, the Editor-in-Chief ensures that the journal’s published content and associated activities support the mission of the New Phytologist Foundation to serve the global plant science community. The Editor-in-Chief is also involved in Foundation activities as a member of the Board of Trustees, such as making decisions on which symposia, workshops and grants will be supported. The Editor-in-Chief reports twice annually on the activities and strategic direction of the journal to the Board of Trustees. The New Phytologist Foundation Trustees would like to hear from suitably qualified plant scientists to lead the next phase of the journal’s development. Full information is given in the journal details, key duties and essential criteria, below. The appointment is for an initial five-year term, commencing 1 January 2025, there will be scope for the successful candidate to shadow the current Editor-in-Chief, Professor Alistair Hetherington, before they commence their duties. An annual editorial support package will be made available to the successful candidate. Applicants should register their interest by completing this form, where they will be asked to provide a brief description of their career to date, their vision for the journal, and their suitability for the role. Deadline: 1 June 2024."
