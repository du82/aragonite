full_description = "We're working on a number of initiatives that we would like to share with you, including three upcoming symposia, a new call for papers in Plants, People, Planet, and a brand new special issue of New Phytologist. We also would like to take the opportunity to highlight our call for expressions of interest for the Editor-in-Chief role at New Phytologist. To be the first to know about opportunities like these, sign up for our newsletter. Please share these opportunities with colleagues, students and lab members that may find them of interest! New Phytologist is seeking a new Editor-in-Chief to succeed Professor Alistair Hetherington, who will step down from the role at the end of December 2024. In this New Phytologist Special Issue, we bring together a collection of studies, which examine various types of mycorrhizal symbioses, such as arbuscular mycorrhizal, orchid mycorrhizal, ericoid mycorrhizal, and ectomycorrhizal associations. Plants, People, Planet is calling for submission of abstracts for a Special Issue on the theme of 'Innovation in plant and soil sciences to tackle critical global challenges'. The Oak Spring Garden Foundation is currently offering a number of awards and fellowships across many aspects of plant focused research: The New Phytologist Foundation is a not-for-profit organisation committed to the advancement and dissemination of knowledge and research in plant science."
