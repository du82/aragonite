["https://newphytologist.org/symposia/16"]
title = "16th New Phytologist Symposium"
description = "16th New Phytologist Symposium"
full_description = "Impact of genomics on fungal biology, a meeting report on the 16th NPS by Ralf Voegele and Kurt Mendgen. First prize went to Minna Kemppainen for her poster entitledAgrobacterium-based gene transfer for post-genomic research in Laccaria bicolor. Two runner-up prizes were also awarded to Aurélie Deveau and Aurélie Huser. Click on the posters to download the pdf version, poster abstracts are listed in the abstract book Whole genome sequencing and functional genomics are revolutionizing our understanding of biological mechanisms in fungi. To date, the genomes of 40 fungal species (both ascomycetous and basidiomycetous) have been released and a further 50 genome-sequencing projects are underway, and include pathogens and symbiotic fungi as well as those that serve as basic models for molecular and cellular biology. The overall purpose of these initiatives is to build on available resources and to provide a comprehensive understanding of fungal biology, ecology and biotechnology. Remarkable progress has been made already and through the combination of comparative genomics of saprobic, pathogenic and symbiotic fungi and new experimental approaches (such as transcriptomics, proteomics, metabolomics and imaging of living cells) a conceptual framework is being generated for understanding the development, physiology and ecology of fungi, in which model predictions can now be tested at the molecular level. This symposium will bring together relevant parties involved in fundamental and practical aspects of this exciting and multidisciplinary subject area in order to provide a timely discussion forum for a better appreciation of fungal genomics and its impact on the biology of these organisms. Three days of invited talks, posters, and discussion in the city of Nancy (France), world-famous for its beautiful Golden Gates of Stanislas Square and ‘Art Nouveau’ houses and museum. The meeting will be divided into the following themes: 1) Fungal structure and development, 2) Fungal genomics - from sequence to application, 3) Secretion and transport systems, and 4) Metabolomics. We hope that this will stimulate discussion and the exchange of ideas at what will be a relatively small (around 100–120 delegates) and informal meeting."
