["https://www.newphytologist.org/news/view/343"]
title = "Call for papers: Harnessing the benefits of specimen digitisation - deadline extended to 6 May 2024!"
description = "Call for papers: Harnessing the benefits of specimen digitisation"
full_description = "The New Phytologist Foundation is calling for submission of abstracts for a joint special issue of New Phytologist and Plants, People, Planet on the theme of 'Harnessing the benefits of specimen digitisation'. The world’s c. 3000 herbaria and fungaria house the most complete, expertly curated and important source of information for plant and fungal life on Earth. While their specimens have long been locked in cupboards only accessible to physical visitors, massive efforts are now underway to unlock the wealth of information they contain: from high-resolution images to -omics analyses and rich multimodal meta-data. But how can this emerging digital and inter-connected data resource, capturing a rapidly increasing proportion of the world’s 400 million plant and fungal specimens, help us address pressing scientific, environmental and societal challenges? We are particularly keen to receive proposals for studies from authors based in Africa and Asia. This inter-disciplinary special collection aims to address this overarching question by soliciting contributions from researchers from around the world. A selection of the peer-reviewed papers that are accepted will feed into the Royal Botanic Gardens Kew’s State of the World’s Plants and Fungi 2026 report – a globally acclaimed publication aimed at the general public and policymakers. The last report resulted in over 1,000 pieces of press and media coverage globally and the papers in the special collection have been downloaded more than 48,000 times. We expect this collection to attract a similar level of attention. The timing of publication will follow completion of RBG Kew’s own digitisation programme for its herbarium and fungarium – which rank among the world’s largest, and together house c. 8.5 million specimens. Through varied approaches, from optimising digital methodologies and data capture, to the use of artificial intelligence, DNA sequencing and georeferencing at scale; and by exploring various data resources, from the images themselves to their integration with citizen science observations or socio-, economic- or climatic data, we encourage submissions that break new ground in data-related topics and, combined, take us closer to a Digital Revolution."
year_published = 2025
clearnet = "https://www.newphytologist.org/news/view/343"
tags = ["2024!", "2024:", "2025:", "2026:", "acknowledgments", "address", "and,", "author", "authors", "benefits"]
