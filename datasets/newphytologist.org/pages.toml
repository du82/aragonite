of Morphologie und Biologie der Algen by Friedrich Oltmans. New Phytologist 5: 34–46. 18. Tansley AG. 1907-8. Lectures on the evolution of the filicinean vascular system. New Phytologist 6: 25–35, 53–68, 109–120, 135–147, 148–155, 187–203, 219–238, 253–269; 7: 1–16, 29–40. [A course of Advanced Lectures in Botany given for the University of London at University College in the Lent Term, 1907] 19. Moss CE, Rankin WM, Tansley AG. 1910. The woodlands of England. New Phytologist 9: 125, 130–131, 147. 20. Tansley AG. 1911. The International Phytogeographical Excursion in the British Isles. New Phytologist 10: 271–291. 21. Blackman FF, Tansley AG. 1911. Review of a textbook of botany for colleges and universities. Vol.1. Morphology and physiology by Coulter JM, Barnes CR, Cowles H. New Phytologist 10: 349–359. 22. Tansley AG. 1911. Medullary rays and the evolution of the herbaceous habit. A review of books by Eames AJ, Bailey IW, Thompson WP and Groom P. New Phytologist 10: 362–366. 23. Tansley AG. 1911. Types of British vegetation. Cambridge, UK: Cambridge University Press. [edited for, and published by, the Central Committee for the Survey and Study of British Vegetation: copies given to all those attending the International Phytogeographic Excursion, 1911]. 24. Tansley AG. 1912. The forest of Provence. Gardeners Chronicle 51: 89–90, 112–113, 131. 25. Tansley AG. 1913. A universal classification of plant communities. Journal of Ecology 1: 27–42. 26. Tansley AG. 1913. Primary survey of the Peak District of Derbyshire. Journal of Ecology 1: 275–285. 27. Tansley AG. 1913–1914. The International Phytogeographic Excursion in America in 1913. New Phytologist 12: 322–336; 13: 325–333. 28. Tansley AG. 1913. In: Hampstead Heath: its geology and natural history. London, UK: T. Fisher Unwin, 87–92. [Cited by Tansley, p. 324, in The British Islands and their vegetation, 1939] 29. Tansley AG. 1914. Presidential address. Journal of Ecology 2: 194–203. 30. Thompson HS. 1914. Flowering