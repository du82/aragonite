["https://newphytologist.org/awards/tansleymedal/selection"]
title = "Selection Procedure"
description = "Tansley Medal Selection Procedure"
full_description = "Selection is a multi-stage process based on the scientific achievements of the candidate and a short review article intended for publication. The subject areas considered must conform to the aims and scope of the journal New Phytologist, which falls into 5 broad sections – Physiology & Development, Environment, Interaction, Evolution, and Transformative Plant Biotechnology – articles cover topics that range from intracellular processes through to global environmental change. Please ensure that you have read the Tansley Medal rules before applying. The completed 2025 New Phytologist Tansley Medal pro forma which should include: 1) A 300-word personal statement describing their scientific achievements to date. 2) 3 selected papers that best represent their research discoveries. 3) A brief outline, maximum 100 words, of what their Tansley insight would cover, if shortlisted. A letter of recommendation / reference (maximum 300 words) from a scientist who has agreed to support the application, usually the applicant's group leader. This letter can be submitted as part of the application or can be sent by email directly from the referee to Holly Slater (np-managinged@lancaster.ac.uk). This must be received by 1 November 2024. Applicants must provide the contact details of their referee during the online application process. If you are selected to go forward to the second round, you will be notified within 6 weeks of the the submission deadline and invited to write a single-authored Tansley insight, which should typically focus on the subject area to which your publications have contributed; care should be taken to ensure a balanced view is presented. These short reviews will be c. 2000 words, and contain up to four display elements and 40 references. Manuscripts will be handled by a relevant New Phytologist subject Editor and sent for external peer review. All competition articles that pass successfully through peer review will be published in New Phytologist and the Tansley Medal winner selected by the judges from these final articles."
year_published = 2025
clearnet = "https://newphytologist.org/awards/tansleymedal/selection"
