["https://newphytologist.org/events/now/december-2021"]
title = "New Phytologist Now – Dec 2021 - Tansley Medal Winners"
description = "New Phytologist Now Tansley Medal winners"
full_description = "New Phytologist Now launched its inaugural season with three talks from recent Tansley Medal winners. Philippa’s research focuses on understanding the role of senescence in determining the nutrient content of wheat grain. By adopting an array of genetic and genomic approaches, Philippa aims to elucidate the developmental mechanisms controlling this, as well as the identification of new targets for breeding wheat with improved nutritional value. Philippa’s work also extends to the development of key resources for wheat genomics. She considers the opportunities for using cereal crops as experimental systems in her Tansley insight ‘Blurring the boundaries between cereal crops and model plants’. Philippa was joined by New Phytologist Editors Alistair Hetherington and Teresa Fitzpatrick. Kai is a global ecologist and quantitative environmental whose work integrates ecological theory with advanced statistical and computing science tools to study the impact of global change on plants. His current research focuses on plant and soil responses to environmental change, both spatially and temporally. Kai’s Tansley insight is entitled ‘Understanding forest dynamics by integrating age and environmental change’ and it explores how global forest-age data and hierarchical models can help us better understand forest dynamics. Kai was joined by New Phytologist Editors Alistair Hetherington and Amy Austin. Evolving together, evolving apart: Measuring the fitness of rhizobial bacteria in and out of symbiosis with leguminous plants Liana works primarily on the nitrogen-fixing symbiosis between rhizobial bacteria and leguminous plants (specifically Medicago–Ensifer), and her work uses evolutionary and ecological approaches and advances in sequencing technology to understand mutualistic interactions in natural and agricultural systems in a changing climate. This is the focus of her Tansley insight ‘Evolving together, evolving apart: measuring the fitness of rhizobial bacteria in and out of symbiosis with leguminous plants’. Liana was joined by New Phytologist Editors Amy Austin and Francis Martin."
