title = "Privacy policy - The Foundation"
description = "New Phytologist foundation privacy policy"
full_description = "The New Phytologist Foundation recognises the importance of protecting personal information. By submitting your information to the New Phytologist Foundation, you consent to the practices outlined below. If you are less than 18 years of age, then you must first seek the consent of your parent or guardian prior to submitting any personal information. This privacy policy describes how the New Phytologist Foundation collects and uses the personal information you provide to the New Phytologist Foundation, in the course of your activities either as: It also describes the choices available to you regarding our use of your personal information and how you can access and update this information. The New Phytologist Foundation is the Controller of data for the purposes of the GDPR. The New Phytologist Foundation is a not for profit organisation, registered as a charity in the UK (registered charity number: 1154867). The New Phytologist Foundation’s registered address is Furness Main, B floor, Office B089, Furness College, Lancaster University, Lancaster, LA1 4YG, United Kingdom. The types of personal information that the New Phytologist Foundation collects directly from you may include: The New Phytologist Foundation may receive information about you from with third parties we work with, e.g. John Wiley & Sons, inc. The New Phytologist Foundation may use your personal information in the performance of any interaction we enter into with you, to comply with legal obligations, or where the New Phytologist Foundation has a legitimate interest in using your information to enhance the services we provide. Legitimate purposes include, but are not limited to, one or all of the following: In addition, we may use your information in the following ways (after obtaining your consent, if required): Personal information will not be kept longer than is necessary for the purpose for which it was collected. This means that, unless information must be retained for legal or archival purposes, personal information will be securely destroyed, put beyond use or erased from the New Phytologist Foundation's systems when it is no longer required or, where applicable, following a request from you to destroy or erase your personal information."
