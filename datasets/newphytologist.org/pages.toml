description = "New Phytologist Now, Season Two Plant adaptation, domestication and invasion ecology"
full_description = "This event was recorded and can be watched on-demand at the New Phytologist Now Cassyni webinar page. Anahí Fernandez, Postdoctoral Researcher, IRNAD: Research Institute on Natural Resources, Agroecology and Rural Development, Argentina Anahí studied for a bachelor's degree and a doctorate in biological sciences at the National University of Comahue and is currently doing a post-doctorate at the Natural Resources, Agroecology and Rural Development Research Institute (IRNAD) in Patagonia, Argentina. Her research focuses on ecology of plant-insect interaction in agroecosystem context, specifically how crop management practices modify the way pollinators and herbivores interact with cultivated species. Her current aim is to understand how polyculture systems may regulate pollination and herbivory control through resource provision. Ayub is a Senior Lecturer at the Department of Applied Biology, Technical University of Kenya. He obtained a PhD in Genetics and Evolution at the University of Granada, Spain. He previously did post-doctoral research at the University of Konstanz in Germany and the Chinese Academy of Sciences in Beijing. His research mainly focuses on dissection of ecological and evolutionary mechanisms that underlie ecological impacts of invasive plant species."
