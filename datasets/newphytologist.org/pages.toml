["https://newphytologist.org/events"]
title = "Events"
description = "New Phytologist Foundation Events"
full_description = "The New Phytologist Foundation supports plant science by reinvesting excess revenue from the publication of New Phytologist and Plants, People, Planet into events that support emerging and developing areas in plant science. More information about our various event types can be found below. New Phytologist next generation scientists is a series of events aimed at early career researchers, to provide the next generation of plant scientists a chance to share their work with their peers and outstanding international scientists in a stimulating, supportive and exciting environment. These events are co-funded by the New Phytologist Foundation and Wiley and are free to attend. New Phytologist Now is an online event series where you can discover the latest and most exciting plant science research published in New Phytologist. Since 1995, the internationally renowned series of New Phytologist Symposia have aimed to support emerging and key areas of research. Usually these meetings would be expected to extend over one to three days, with invited speakers and a maximum of 120 delegates. In this way we hope to provide an informal atmosphere for the stimulation and exchange of ideas and the building of collaborations. Please check the event webpages for the latest updates or email np-symposia@lancaster.ac.uk with any queries. New Phytologist Workshops aim to facilitate advances in plant science by bringing together a small number of scientists who wish to focus and brainstorm a particular topic or issue. The format is intentionally flexible to suit a range of projects, but this might, for example, include a working group that intends to focus on analysing new data or indeed analysing old data in the light of new techniques and planning the way forward. New Phytologist Workshop proposals are welcomed throughout the year. Download the Workshop proposal pro forma."
