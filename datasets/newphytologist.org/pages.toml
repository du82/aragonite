["https://www.newphytologist.org/journals/new-phytologist"]
title = "New Phytologist - Journals"
description = "New Phytologist journal"
full_description = "New Phytologist publishes excellent, novel, rigorous and timely research and scholarship in plant science and its applications. Falling within five sections – Physiology & Development, Environment, Interaction, Evolution and Transformative Plant Biotechnology – articles cover topics that range from intracellular processes to global environmental change. Cross-disciplinary approaches are particularly encouraged, but for guidance the journal is organised as below. We recognise that techniques from molecular and cell biology, and functional genomics through to modelling and system-based approaches will be applied across the whole spectrum of plant science: All New Phytologist submissions should focus on timely research that provides new insights into the broad principles of plant science. The original research should address clear hypotheses or questions and offer new insights on topics of interest to a broad cross-section of our readers. In addition to original research articles, short Letters, and other submissions to the Forum section, as well as Research reviews, Rapid reports and both Modelling / Theory and Methods papers, and Viewpoints are also encouraged. Please refer to the full Author Guidelines for further information. New Phytologist is owned by a not-for-profit organisation dedicated to the promotion of plant science, facilitating projects from frequent events to free access for our Tansley reviews. Watch Editor-in-Chief Alistair Hetherington's short guide to publishing in New Phytologist, for early-career researchers: We offer our thanks to all the individuals who have acted as reviewers of manuscripts. The Editorial Board and Central Office staff greatly appreciate the contribution of our reviewers, each of whom volunteered their time and expertise to provide comment on new submissions. The input of these individuals is crucial in maintaining the excellence of the journal."
