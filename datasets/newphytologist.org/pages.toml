["https://www.newphytologist.org/news/view/288"]
title = "Global Tree Assessment – special issue call for papers!"
description = "News item: Global Tree Assessment – Plants, People, Planet special issue call for papers!"
full_description = "Trees form forested ecosystems and tree species composition and richness determine ecosystem properties. The conservation status of these tree species is therefore of key importance to planning resilient management strategies and prioritising actions, both geographically and taxonomically. With the publication of the results from the Global Tree Assessment, we now have a comprehensive and uniform knowledge about the threat level for tree species globally. This special issue of Plants, People, Planet will highlight key achievements, implication of results, lessons learned, and evaluate future steps. Articles will focus on specific geographic regions or taxonomic groups, detailing progress and pitfalls. The evaluation of endemic species and comparison across groups is of particular importance and interest. Given the context of the UN Decade on Ecosystem Restoration, we invite authors to submit manuscripts that build upon the Global Tree Assessment and place the work in the context of restoring forested ecosystems globally. We welcome submissions by 31 January 2022, however, please contact us if you have any questions concerning the submission deadline or if you have a potential manuscript that you would like to discuss. Plants, People, Planet, published by the not-for-profit New Phytologist Foundation, is an Open Access journal that aims to celebrate everything new, innovative and exciting in plant-focused research that is relevant to society and people’s daily lives. Papers submitted for consideration in Plants, People, Planet will be subject to peer review and must meet the aims and scope of the journal. Articles should include an engaging 100 word Societal Impact Statement to highlight why the work matters to people, society and the planet. Please refer to the full Author Guidelines before submission, which contain information on article types and format, as well as details on how to compile the electronic version of your manuscript. Please contact us if you have questions or a potential manuscript that you’d like to discuss."
year_published = 2025
clearnet = "https://www.newphytologist.org/news/view/288"
