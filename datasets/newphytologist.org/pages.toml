["https://www.newphytologist.org/news/view/349"]
title = "Call for papers: Ecological and evolutionary consequences of plant–fungal invasions"
description = "Call for papers: Ecological and evolutionary consequences of plant-fungal invasions"
full_description = "The New Phytologist Foundation is calling for the submission of abstracts for a joint Special Collection of Plants, People, Planet and New Phytologist on the theme of ‘Ecological and evolutionary consequences of plant–fungal invasions'. As human activities increasingly alter the distribution and relative dominance of plant and soil fungal communities through introductions and management, it is becoming critical to understand the consequences of these changes for biodiversity and ecosystem functions. The 45th New Phytologist Symposium: Ecological and evolutionary consequences of plant–fungal invasions, held in Campinas, Brazil in June, aimed to highlight this hugely important topic, bringing together over 90 researchers for lively discussion, talks and posters. Following a highly stimulating symposium we are delighted to welcome submissions to New Phytologist and Plants, People, Planet from symposium delegates and interested researchers. Authors must ensure they refer to the full Author guidelines before submission, which contain full information on how to compile the electronic version of your manuscript, as well as full details on style and legal requirements. Please contact Holly Slater, Senior Commissioning Editor, New Phytologist (np-commissions@lancaster.ac.uk), with any queries."
