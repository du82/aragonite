["https://www.newphytologist.org/news/view/326"]
title = "Call for papersMycorrhizal research now: from the micro- to the macro-scale"
description = "Call for papers: Call for papers: Mycorrhizal research now – from the micro- to the macro-scale"
full_description = "Almost all land plants form symbiotic associations with mycorrhizal fungi. These mutualistic mycorrhizal symbioses play a key role in terrestrial ecosystems as they regulate nutrient and carbon cycles, and influence soil structure and ecosystem multifunctionality. Furthermore, mycorrhizal fungi influence plant productivity and plant diversity, and connect plants below ground via a hyphal network. Global surveys have uncovered the unexpected diversity of mycorrhizal associations and their spatial and temporal dynamics. The numerous biochemical, genetic and transcriptomic efforts are currently being aided by a massive effort to sequence the genomes of multiple fungal symbionts. Data produced from these projectes will serve as building blocks for an extensive framework enabling scientists to ask a broad spectrum of biological, ecological and evolutionary questions about the role of mycorrhizal fungi in plant growth and evolution, soil structure and responses to environmental changes, and global carbon and nutrient cycles. Reviewing the different facets of mycorrhizal science couldn't be more topical. In this Special Issue we aim to present the full breadth of on-going mycorrhizal research now, from the micro- to macro-scale. We have commissioned a set of reviews and perspectives pieces which will be complemented by a collection of original research papers. Author guidelines can be found here. If you have any queries about this Special Issue, please do not hesitate to send an email to the Senior Commissioning Editor, Holly Slater. To receive information about future calls for papers, New Phytologist Foundation events and opportunities for early career researchers, subscribe to our email newsletter. For more details about how we use the information provided in this form, please see our Privacy policy."
year_published = 2025
