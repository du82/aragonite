["https://newphytologist.org/events/now/npn-25-may-2022"]
title = "25 May 2022 – Stomata"
full_description = "Maoya is an ecohydrologist that combines parsimonious models and data science to analyze vegetation water-carbon tradeoffs and their interactions with climate, encoded in leaf to satellite observations. Maoya received a PhD in Water Resources Engineering from Oregon State University in 2019 with the support of an NSF graduate research fellowship then spent two years as a postdoctoral researcher in the Department of Crop Production Ecology at the Swedish University of Agricultural Sciences. She has been a postdoctoral researcher in the Department of Environmental Science, Policy and Management at UC Berkeley since 2022. Xiaoyu completed her PhD at University of Science and Technology of China (USTC) in 2014 under the supervision of Professor Chengbin Xiang. She mainly focused on understanding the molecular mechanism of stomatal development in response to water deprivation. Thereafter she joined the Juan Dong group at Rutgers University as a postdoctoral fellow. She is currently a Research Associate at Rutgers University. Her research interests include the phosphatase function in cell polarity establishment and in stomatal development. Silvere’s research covers topics related to modelling and sensing plant responses under a dynamic environment. In particular, he is interested in developing new measurements techniques and models to further our knowledge of gas exchange and energy balance at different levels of integration (e.g. cell to the canopy, day to growing season). He aims to contribute to improving energy use efficiency in controlled environment agriculture (greenhouses and vertical farms) by for example increasing crops’ light use efficiency."
