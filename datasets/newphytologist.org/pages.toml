["https://newphytologist.org/workshops/20"]
title = "20th New Phytologist Workshop"
description = "20th New Phytologist Workshop: Molecular mechanisms underlying the rapid evolution of plant–microbe interactions"
full_description = "Plants can be colonised by a broad range of microorganisms, ranging from prokaryotes to fungi and oomycetes. Notably, the two partners in these interactions (plant and microbe) are both subject to rapid adaptation by fast evolution. In nature, this is exemplified by the constant emergence of new resistance specificities on the host side and new virulence determinants on the pathogen side. However, the molecular mechanisms underlying these rapid adaptations are poorly understood. This workshop will bring together a selection of internationally renowned experts working on both the host and the pathogen side to discuss the spectrum of molecular events that can lead to rapid adaptation by (co-)evolution of the respective interaction partners. The expertise of the proposed scientists covers molecular evolution, evolution theory, molecular phytopathology and microbial pathogenomics. The workshop is meant to integrate a core group of researchers already collaborating within a priority program funded by the German Research Foundation (DFG; priority program 'SPP1819: Rapid evolutionary adaptation – potential and constraints') with a wide range of international scientists with similar research interests."
year_published = 2025
clearnet = "https://newphytologist.org/workshops/20"
tags = ["20th", "8–9", "committee", "evolution", "february", "goal", "interactions", "mechanisms", "molecular", "organising"]
