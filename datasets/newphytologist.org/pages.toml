["https://www.newphytologist.org/trust/about"]
title = "The Foundation"
description = "Mission and background of The New Phytologist Foundation"
full_description = "The New Phytologist Foundation is an independent, non-profit-making organization dedicated to the promotion of plant science. The Foundation’s main activity is the publication of the journals New Phytologist, an international, online-only journal, which publishes original research on all aspects of plant science and Plants, People, Planet, an Open Access interdisciplinary journal focusing on the interface between plant-focused research and society. The majority of the Foundation’s funds come from subscription and Open Access income across our two journals. Any excess revenue from the publication of the journals is put straight back into supporting our community. This is achieved by funding a wide range of activities, for example: the organisation and sponsorship of symposia, workshops and meetings; grant schemes; sponsorship of various awards for early-stage career scientists, including the Tansley Medal named after New Phytologist’s founder Sir Arthur Tansley; and ensuring that research published in the journals is as widely and openly available as possible. For example, all of our New Phytologist Tansley reviews and insights and Forum articles are immediately available to access free of charge upon publication, and all other content is made freely available one year after publication and Plants, People, Planet is fully Open Access. Similarly, the Foundation issued over £600,000 of funds in 2019 to support symposia, workshops and in charitable grants. All of these actions have a common goal to promote emerging areas of plant science and to encourage continued progress and innovation in the field. As a hybrid journal, New Phytologist receives subscription income as well as Open Access income. New Phytologist offers authors the opportunity to publish Open Access upon payment of an Article Publication Charge (APC), should their funder require it, or via the traditional route, where no fees are required of the author and the work is available to subscribers only. Ensuring easy access to research was a founding principle of New Phytologist, and authors publishing via the traditional route enjoy licence terms that allow them to self-archive the accepted version of their paper, ensuring compliance with Plan S funders, for example."
year_published = 2025
