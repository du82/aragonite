["https://www.newphytologist.org/news/view/309"]
title = "Call for papers: Parasitic plants, people and planet"
description = "News item: Call for papers: Parasitic plants – impacts on people and planet"
full_description = "Over one per cent of flowering plants are parasitic and extract food and water from other plants. They have a profound effect on both natural and agricultural systems. They include evolutionary enigmas, for example plants that grow inside other plants, and ecosystem engineers, for example hemiparasites that regulate biodiversity in plant communities. Parasitic plants are also a powerful public engagement mechanic at a time when fostering care and attention for plants has never been more urgent. As weeds, some parasitic plants have a significant impact on the health, wellbeing, and livelihoods of people around the world. The genera Striga (witchweeds), Orobanche and Phelipanche (broomrapes) in the family Orobanchaceae, are some of the most destructive weeds globally. These parasites infect over 50 million hectares of arable land in sub-Saharan Africa resulting in annual losses of more than US$10 billion. This dire situation will be made worse by the effects of climate change and requires urgent solutions. Emerging research now provides insights that will enable strategies for controlling parasitic weeds using cross-disciplinary approaches. This special issue will highlight current research on parasitic plants following the 16th World Congress on Parasitic Plants held in Nairobi, Kenya between July 3 and July 8, 2022. Interdisciplinary approaches to examining the evolutionary ecology of parasitic plants, and addressing the challenges associated with parasitic weeds and their impact on people, society and the wider world are all encouraged. Submissions are welcome on a broad range of research topics, including but not exclusively: To ensure special issue manuscripts meet the aims and scope of Plants, People, Planet, submissions should be placed in the wider context of their relevance to people, society and the planet, including any implications for policy and / or practice. These themes should also be highlighted in a 100 word Societal Impact Statement to accompany submissions (please see the submission guidelines below for details)."
