full_description = "New Phytologist Workshops aim to facilitate advances in plant science by bringing together a small number of scientists who wish to focus and brainstorm a particular topic or issue. The format is intentionally flexible to suit a range of projects, but this might, for example, include a working group that intends to focus on analysing new data or indeed analysing old data in the light of new techniques and planning the way forward. The output from the workshop would be written up and submitted for publication to New Phytologist as a research manuscript or synthesis paper, or in some cases a position paper intended for the Forum section. If you are interested in organising a New Phytologist Workshop, please complete the workshop proposal pro-forma and email this to us (contact details are on the form). Workshop proposals are accepted throughout the year and are considered twice annually."
