["https://newphytologist.org/symposia/22"]
title = "22nd New Phytologist Symposium"
description = "22nd New Phytologist Symposium"
full_description = "In April 2014 we published a Virtual Special Issue on 'Phytopathogen effector proteins'. Click here to find out more. Thank you to all organisers, speakers, and delegates who helped to make the 22ndNPS a great success. We will continue to update the site with related information. Johana Misas-Villamil Max Planck Institute for Plant Breeding Research, Cologne, Germany (Download poster) Effectors are defined as molecules produced by bio-aggressors/pathogens/symbionts to manipulate their host plants, thereby facilitating infection (virulence or symbiotic factors, toxins, inhibitors) and/or triggering defense responses (avirulence factors, elicitors). This dual (and conflicting) activity of effectors has been broadly reported in many plant–microbial interactions. This research topic is actively investigated using a combination of approaches (genetics, molecular biology, biochemistry, physiology and developmental biology) and benefits from the recent advances in plant and microbial functional genomics and genome-wide evolutionary analyses. Tremendous progress has been made in recent years but many questions remain unanswered. The 22nd New Phytologist Symposium aims to act as a catalyst for future research by bringing together scientists working on plant–microbe interactions across a range of organisms (viruses, bacteria, fungi and nematodes) to identify and focus on these important questions. The symposium will take place over four days at the INRA Versailles Research Centre, Paris, France. Over 20 talks will form the basis of discussion at what will be a relatively small meeting (up to 120 participants). Following each 30-minute talk there will be 10-minute period for discussion rather than the usual brief question time. In this way we hope to provide a lively forum for exchanging ideas and discussing new approaches. There will also be a poster session and reception on the Monday evening and conference dinner on the Tuesday evening."
