title = "42nd New Phytologist Symposium"
description = "42nd New Phytologist Symposium: The biology of wood - from cell to trees"
full_description = "Thank you to everybody who attended 'The biology of wood: from cell to trees'. We hope that you enjoyed the meeting and found it useful. You can now read the meeting report for this symposium: From the micro to the macro - a panoptic lens on wood biology. A virtual issue on the Biology of Wood, which highlights the central role of wood biology in basic plant science as well as critical ecological, environmental, economic and societal issues, is now available to read here. Congratulations to Jan Lyczakowski (First Prize), Kelly Balmant (Runner Up), and Masaki Kobayashi (Runner Up)!"
