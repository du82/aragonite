["https://www.newphytologist.org/nextgeneventpages/index/38"]
title = "Application and travel grant information 2025 - Next generation scientists 2025"
full_description = "Thank you for your interest in attending New Phytologist next generation scientists 2025, due to be held at the University of Birmingham from Monday 4 August to Thursday 7 August. Applications to attend this symposium closed on 27 January 2025. This event is exclusively for early career researchers (including students and any researcher with up to five years’ experience since gaining/defending their PhD, excluding career breaks). Attendance will be limited to approximately 100 early career participants. Appplications have now closed. All successful applicants will present either a poster, or a 15 minute talk based on their submitted abstract. Delegates selected to attend New Phytologist next generation scientists will receive a travel grant to support their attendance. The travel grant will be paid directly by bank transfer after the event to the delegate's nominated account. Travel grants are based on your location: We appreciate that some delegates may have limited funding. The New Phytologist Foundation has limited additional funds for delegates where travel costs exceed the travel grants, and where additional funding sources are unavailable. Additional travel grants are generally in the range of £100–£500. Full details on how to apply will be confirmed to successful applicants."
