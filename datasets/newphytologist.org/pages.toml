["https://www.newphytologist.org/subpages/index/26"]
title = "Brief Author Guidelines for Special Collections"
full_description = "Brief guidelines for Special Collections are given below, however, please refer to the respective journal's full Author Guidelines for final preparation as these contain detailed information on how to compile the electronic version of your manuscript, style and legal requirements. Manuscripts that are to be considered for New Phytologist Special Collections should conform to the full Author Guidelines. It is important to note that Special Collection submissions are treated in exactly the same way as regular manuscripts submitted to the journal (i.e. they will go through the same peer review system as regular manuscripts and acceptance is not guaranteed). Special Collection manuscripts must therefore focus on timely research that provides new insights into the broad principles of plant science. In addressing such questions, research manuscripts will focus entirely on the presentation of new data (mixed part review / part data papers are not encouraged). The word limit for research manuscripts is 6500 words. Synthesis and Modelling / Theory papers will generally fall into the research manuscript category and the headings can be adapted accordingly (e.g. in the case of Modelling / Theory papers, include a heading of Description in place of Materials and Methods, to include description of the model or theoretical framework). New Phytologist also publishes a number of additional formats under the Forum and Review sections. These are generally commissioned ahead of time, but please do get in touch should you have any suggestions (np-commissions@lancaster.ac.uk). All manuscripts submitted for consideration in Plants, People, Planet should conform to the journal’s Author Guidelines. Submitted manuscripts will be subject to peer review and must meet the aims and scope and quality criteria of the journal. In particular, all manuscripts should consider the wider implications / impact of the work for people, society and the planet, including any implications for policy and / or practice. These aspects will be considered by the editor and reviewers when evaluating manuscripts and should be at the forefront of works, including in the 100-word Societal Impact Statement on the title page of the submission. We especially welcome:"
