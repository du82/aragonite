["https://newphytologist.org/news/view/355"]
title = "New Phytologist Tansley Medal 2024 winner: Matthew Naish"
description = "News item: New Phytologist Tansley Medal 2024 winner Matthew Naish"
full_description = "We are delighted to announce that the 2024 New Phytologist Tansley Medal for excellence in plant science has been awarded to Matthew Naish. Matthew is a Broodbank Senior Research Fellow in the Department of Plant Sciences at the University of Cambridge, UK, with research interests centred on plant genetics and epigenetics. A core focus of his work is understanding the regulation of centromeres – a crucial chromosome region responsible for accurate chromosome segregation during cell division. In his Tansley insight 'Bridging the gap: unravelling plant centromeres in the telomere-to-telomere era', Matthew summarises the state of our understanding of sequence organisation and epigenetic control of centromeres in plants. We offer our warmest congratulations to Matthew and his fellow finalists, and wish them continued success in their future careers. The New Phytologist Tansley Medal for excellence in plant science is awarded annually in recognition of outstanding contributions to research by individuals in the early stages of their career. Applications for the 2025 New Phytologist Tansley Medal have closed, but you can be the first to know when applications for the 2026 New Phytologist Tansley Medal open by signing up to our mailing list. The judging panel for the 2024 Tansley Medal competition was comprised of New Phytologist Editors: Amy T. Austin (Buenos Aires, Argentina), Ian A. Dickie (Canterbury, New Zealand) Liam Dolan (Vienna, Austria), Elena M. Kramer (Cambridge, MA, USA) and Shuhua Yang (Beijing, China). The New Phytologist Foundation supports early career plant scientists, through a number of initiatives including the annual Tansley Medal competition and the New Phytologist next generation scientists symposium. New Phytologist next generation scientists 2025 will be held in Birmingham, UK, in early August 2025. Applications will open in December. The New Phytologist Foundation is a not-for-profit organisation committed to the advancement and dissemination of knowledge and research in plant science. The Foundation currently fulfils this objective by publishing the scholarly journals New Phytologist and Plants, People, Planet and by funding a wide range of activities, such as the international New Phytologist Symposia and Workshop series, awarding grants, and the sponsorship of awards such as the Tansley Medal, named after New Phytologist’s founder Sir Arthur Tansley."
