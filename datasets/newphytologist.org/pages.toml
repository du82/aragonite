["https://newphytologist.org/workshops/10"]
title = "10th New Phytologist Workshop"
description = "10th New Phytologist Workshop: Origin and evolution of plants and their interactions with fungi. September 2014 at the Natural History Museum London. Organised by Christine Strulluâ€Derrien, Paul Kenrick, Francis Martin, Marcâ€AndrÃ© Selosse"
full_description = "A meeting report entitled 'Plants, fungi and oomycetes: a 400-million year affair that shapes the biosphere' authored by Marc-André Selosse, Christine Strullu-Derrien, Francis M. Martin, Sophien Kamoun and Paul Kenrick, was published in issue 206:2 (April 2015) of New Phytologist. Read the free to access report here. Our overall goal is to understand how plants and their eukaryotic symbionts (fungi and fungi-like microorganisms, especially oomycetes) co-evolved during the early development of terrestrial ecosystems. Several diverse and rapidly developing disciplines are relevant to addressing this goal. Our workshop is designed to bringing together experts from across these disciplines to learn about recent developments, understand the range of approaches and to explore potential cross disciplinary collaborations. 1. We will bring together a multidisciplinary group of specialists in the biology and phylogenetics of living bryophytes and of fungi, experts on the evolution of plant-­fungal interactions (biochemical/physiological/ecological) and specialists on the early fossil record. Our focus will be to determine how expertise in these diverse disciplines could be harnessed to investigate the early evolution of key events, metabolic pathways, and symbiotic associations. 2. We will identify themes which cut across the different disciplines and how best to harness collaboration. For example, recent genomic and molecular clock analyses indicate that the origin of lignin decomposition coincided with the end of the Carboniferous Period. A carefully constructed investigation of Palaeozoic Era fossil plants (e.g. evidence of white rots) and analyses of sediment geochemistry documenting could test these hypotheses. A second area of interest is arbuscular mycorrhizal symbioses, where much remains to be learned about the early evolution of the trait. This would benefit from focused discussion by experts on living bryophyte/fungal systems, developmental biologists and palaeontologists. A third area of interest is the early evolution and development of soil ecosystems, in which the identification and characterisation of modern analogues could greatly assist interpretation of sediments in the early fossil record."
year_published = 2025
clearnet = "https://newphytologist.org/workshops/10"
tags = ["10th", "10th new phytologist workshop", "2014,", "9–10", "bryophytes", "committee", "contact", "evolution", "evolution.", "francis martin"]
