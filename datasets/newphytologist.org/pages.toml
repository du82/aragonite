["https://newphytologist.org/symposia/18"]
title = "18th New Phytologist Symposium"
description = "18th New Phytologist Symposium"
full_description = "Joint first prize was awarded to Björn Sieberer and Rainer Waadt for their posters entitled Calcium spiking in Medicago truncatula root cells during rhizobial infection and The calcium sensor CBL10 mediates salt tolerance by regulating ion homeostasis in Arabidopsis. Click on the posters to download the PDF version, poster abstracts are listed in the abstract book The calcium ion is a universal intracellular second messenger used in numerous plant signal transduction pathways. Since the last major international ‘plant calcium’ meeting in 1985 the field has matured and moved on from simple cataloguing of the involvement of calcium ions in diverse signalling pathways to detailed investigations of the individual components of the calcium homeostatic machinery and identification of the components up and down stream of the calcium signal. The aim of this conference is to consider the ‘state of the art’ and to engage in horizon scanning exercises that are only possible in relatively small discussion-focussed meetings. Major issues to be discussed include a) the role calcium ions in controlling nuclear function b) the identification and regulation of calcium responsive transcriptional regulators c) the molecular identification of calcium channels d) the interaction of calcium with other second messengers such as reactive oxygen species and e) how calcium signals are decoded. We wish to explore the involvement of calcium in mycorrhizal and rhizobium based signalling systems, disease resistance and the involvement of calcium in circadian phenomena. The symposium will take place over three days at the Royal Dublin Society (RDS), Dublin. Thirteen invited talks will form the basis of discussion at what will be a relatively small meeting (up to 120 participants) which we hope will provide an ideal and informal atmosphere for the stimulation and exchange of ideas and the building of collaborations. If you would like to receive further information relating to this meeting please get in touch with Helen Pinfield-Wells (New Phytologist) – newphytsymp@lancaster.ac.uk New Phytologist Central Office Bailrigg House Lancaster University LA1 4YE, UK. Tel: +44 1524 594 691 Fax: +44 1524 594 696"
