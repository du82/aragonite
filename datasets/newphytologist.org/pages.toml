title = "Next generation scientists 2017"
description = "New Phytologist next generation scientists 2017"
full_description = "The second New Phytologist next generation scientists meeting took place at the John Innes Centre in Norwich, 24–26 July 2017. On behalf of the New Phytologist Trust, Wiley and the organisers, we would like to thank all of the local organisers, workshop participants and delegates for making next generation scientists 2017 a successful meeting! Hetherington, F. M. and Nützmann, H.-W. (2018) Embracing the next generation of plant scientists. New Phytologist 217: 504–506. doi: 10.1111/nph.14963 Congratulations to New Phytologist next generation scientists poster prize winner Matous Glanc, IST, Austria, with his poster: 'Re-establishment of cell polarity following cell division', and to runner-up Gabriela Doria, University of Cambridge, with her poster: 'Petal epidermal morphology and plant-pollinator interaction in the genus Nicotiana'. Well done to everybody who presented a poster - the quality was excellent."
