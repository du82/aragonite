["https://www.newphytologist.org/news/view/268"]
title = "Thank you to all of our reviewers in 2020!"
description = "News item: Thanking New Phytologist's 2020 reviewers"
full_description = "We would like to thank all the individuals that reviewed manuscripts for New Phytologist in 2020. The Editorial Board and Central Office staff greatly appreciate the contribution of our reviewers, each of whom volunteered their time and expertise to provide comment on new submissions. The input of these individuals is crucial in maintaining the excellence of the journal. We are interested in fostering and developing the careers of early career scientists and in particular we recognise that reviewing manuscripts can be a valuable learning experience for early career researchers. New Phytologist is happy to consider co-reviews – if you wish to co-review, please let the New Phytologist Central Office know."
