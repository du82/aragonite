["https://newphytologist.org/trust/tansley/life-events"]
title = "Life Events - Sir Arthur George Tansley, 1871–1955"
description = "Information about Sir Arthur George Tansley, 1871 – 1955, botanist, ecologist, psychologist, founder of New Phytologist: 6. MAJOR EVENTS IN THE LIFE OF ARTHUR TANSLEY"
full_description = "Born 15 August, 33 Regent Square, London, to George and Amelia (née Lawrence). George taught at the Working Men’s College, Gt Ormond St. Natural Sciences Tripos, Trinity College, Cambridge. Part I 1893, Part II 1894 (botany with zoology subsidiary) Daughter Katharine born. Founded the Central Committee for the Survey and Study of British Vegetation (i.e. British Vegetation Committee). Committee members formed the first Council of the British Ecological Society (BES) in 1913. President Botanical Section, K, British Association for the Advancement of Science. Resigned University lectureship and moved his family to Vienna. Studied under Freud. Returned to his home in Grantchester, Cambridge. At the Imperial Botanical Congress, was made Chairman of the British Empire Vegetation Committee. Vice-chair and chair of the government’s Wild Life Conservation Special Committee (associated with the ‘Hobhouse Committee’ exploring the establishment of National Parks). Recommended formation of the Nature Conservancy, which should establish National Nature Reserves. Chairman of the new Nature Conservancy (which later evolved into the Natural Environment Research Council)"
