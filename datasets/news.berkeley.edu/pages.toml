["https://news.berkeley.edu/2025/01/09/a-message-from-chancellor-lyons-a-time-for-caring-and-compassion"]
title = "A message from Chancellor Lyons: A time for caring and compassion - Berkeley News"
description = "Chancellor Rich Lyons writes in support of those affected by the Los Angeles wildfires."
full_description = "Campus & community, Campus news A message from Chancellor Lyons: A time for caring and compassion Chancellor Rich Lyons writes in support of those affected by the Los Angeles wildfires. By Public Affairs Sepe Rafiei and Brian Wollitz/UC Berkeley January 9, 2025 The following message was sent to all UC Berkeley students, staff, faculty and academics on Thursday, Jan. 9. Resources for campus community members affected by the fires are listed below. On behalf of our university, I write to offer our sympathy and support to our friends and neighbors in Southern California, and to the members of our own extended campus community, whose lives are being profoundly affected by the unprecedented fires raging in and around Los Angeles. The ongoing destruction and devastation defy description. The horror and heartbreak demand our empathy and compassion. We are already aware of too many students, staff, faculty and alumni who have lost their homes, or are now coming to the aid of loved ones who are facing egregious losses, the challenges of long-term displacement, and the ongoing threat of spreading fires. We have already sent to all of our students from the Los Angeles and Ventura areas a message that details the supportive campus services on offer for them. Please share and use them as needed. For any other campus community members in need of help, I urge you to review and make use of our services at https://supportal.berkeley.edu/. And this document offers additional information about supportive resources on campus and in the Los Angeles area. We are also well aware that for many of our students the financial impact of this tragedy may very well generate a range of needs from additional mental health support, academic accommodations, a change in financial aid status, and/or an increase in the basic needs support. To each and every campus community member whose life and loved ones are being affected by the fires, I want you to know that we are here for you now, and on the road ahead. And, I ask everyone to keep in mind that trauma can have lasting, long-term consequences. We will need to be at our best and continue to be supportive for many months to come. Additional information about trauma and crisis care can be found here and here. If you are seeking ways to support and are able, we encourage you to give to the Student Emergency Fund to support students in need, as they transition back to campus. Donations can be made here: Student Emergency Fund. I am grateful for the caring and compassion of the Cal community, and I know we can and will rise in support of our friends and colleagues, our neighbors and fellow Californians. In community, Richard K. Lyons Campus resources Resources for UC Berkeley students Should you be grappling with the repercussions of this event, we encourage you to explore academic flexibility in consultation with your instructors. Visit the Academic Accommodations Hub (link is external) for more information. General Support: Visit the Office of the Associate Vice Chancellor and Dean of Students’ Well Being resource (link is external), which provides more information about holistic wellness resources across campus. Mental Health Support: Campus counselors at University Health Services at the Tang Center are available on a drop-in basis for urgent concerns. Visit the Counseling and Psychological Services (CAPS) website (link is external) or call at (510) 642-9494. When the Tang Center is closed, call the after hours counseling line (855) 817-5667 Same-Day appointments (link is external) Students can call (510) 642-9494 or go on eTang portal (link is external) to book an appointment. Calling is always the best way, as we hold urgent appointment slots that we don’t release to web-booking on eTang. Aside from psychiatry visits, there’s no charge for students, regardless of insurance. Let’s Talk consultations (link is external): 20-30 minute consultations for students interested in speaking with a counselor or asking questions about how counseling works or mental health resources, etc. Financial Support: Learn more about short-term emergency loans (link is external), or contact Cal Student Central (link is external) if you need assistance. Student Legal Services (link is external) for advice on legal questions, rights, and obligations. Resources for UC Berkeley faculty and staff Be Well at Work – Employee Assistance (link is external) provides free, confidential counseling and referrals for staff. To schedule an appointment with an Employee Assistance counselor, please contact (510) 643-7754 or email. [email protected] (link sends e-mail) If any of you are grappling with the aftermath of this incident, please consider discussing accommodations with your respective human resources officer in your department."
