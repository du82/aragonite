title = "Berkeley Voices - Berkeley News"
description = "Berkeley Voices explores the work and lives of fascinating UC Berkeley faculty, students, staff, and visiting scholars and artists. It aims to educate listeners about Berkeley’s advances in teaching and research, spark curiosity about the deeper layers of American history and to build community across our diverse campus. It’s produced and hosted by Anne Brice in the Office of Communications and Public Affairs. Follow Berkeley Voices. For the 2024-25 academic year on Berkeley Voices, we’re exploring the theme of transformation. In eight episodes, we’re exploring how transformation — of ideas, of research, of perspective — shows up in the work that happens every day at UC Berkeley. New episodes come out on the last Monday of each month, from October through May. See all episodes in the series. Also, check out Berkeley Talks, a UC Berkeley News podcast that features lectures and conversations at Berkeley. And see our guide to starting your own podcast at Berkeley."
full_description = "Podcast: Berkeley Voices Berkeley Voices explores the work and lives of fascinating UC Berkeley faculty, students, staff, and visiting scholars and artists. It aims to educate listeners about Berkeley’s advances in teaching and research, spark curiosity about the deeper layers of American history and to build community across our diverse campus. It's produced and hosted by Anne Brice in the Office of Communications and Public Affairs. Follow Berkeley Voices. For the 2024-25 academic year on Berkeley Voices, we’re exploring the theme of transformation. In eight episodes, we’re exploring how transformation — of ideas, of research, of perspective — shows up in the work that happens every day at UC Berkeley. New episodes come out on the last Monday of each month, from October through May. See all episodes in the series. Also, check out Berkeley Talks, a UC Berkeley News podcast that features lectures and conversations at Berkeley. And see our guide to starting your own podcast at Berkeley. Arts & culture Berkeley Voices: From Victorian-era letters to Swiftie bracelets, an evolution of American friendship An American studies class at UC Berkeley explores how the depiction of friendship in popular culture and media has shifted throughout history, and what it looks like today. Mind & body Berkeley Voices: We learn what to fear. Can we unlearn it? Research Berkeley Voices: Think you know what dinosaurs were like? Think again. Arts & culture Berkeley Voices: As crises escalate, so does our fascination with cults Berkeley Voices: Psychopathy goes undetected in some people. Why? Berkeley Voices: One brain, two languages Berkeley Voices: A language divided Berkeley Voices: A linguist’s quest to legitimize U.S. Spanish Berkeley Voices: Medieval song holds clues to lost dialects Berkeley Voices: Art student’s photo series explores masculine vulnerability Berkeley Voices: Take the first Black history tour at UC Berkeley Bonobos and chimps show ‘a rich recogniti