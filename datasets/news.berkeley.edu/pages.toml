full_description = "Podcasts UC Berkeley’s Office of Communications and Public Affairs produces two UC Berkeley News podcasts — award-winning Berkeley Voices and Berkeley Talks. You can listen and read transcripts on UC Berkeley News, and follow both shows on your favorite podcast listening app or on YouTube. To learn how to start your own podcast at Berkeley, which includes campus podcast requirements, see our campus guide to podcasting. Berkeley Voices Berkeley Voices explores the work and lives of fascinating UC Berkeley faculty, students, staff, and visiting scholars and artists. It aims to educate listeners about Berkeley’s advances in teaching and research, spark curiosity about the deeper layers of American history and to build community across our diverse campus. For the 2024-25 academic year on Berkeley Voices, we’re exploring the theme of transformation. In eight episodes, we’re exploring how transformation — of ideas, of research, of perspective — shows up in the work that happens every day at UC Berkeley. New episodes come out on the last Monday of each month, from October through May. See all episodes in the series. Berkeley Voices: From Victorian-era letters to Swiftie bracelets, an evolution of American friendship Berkeley Voices: We learn what to fear. Can we unlearn it? Berkeley Voices: Think you know what dinosaurs were like? Think again. Berkeley Voices: As crises escalate, so does our fascination with cults Berkeley Voices: Psychopathy goes undetected in some people. Why? Berkeley Voices: One brain, two languages More Berkeley Voices Berkeley Talks Lectures and conversations at UC Berkeley. Berkeley Talks: Does democracy work? Berkeley Talks: The transformation of US medical debt collection Berkeley Talks: Coming of age as an unaccompanied migrant youth in the US Berkeley Talks: A blueprint for creating a world where everyone belongs Berkeley Talks: Poet Ocean Vuong on disobedience and the power of language Berkeley Talks: How do we make better decisions? More Berkeley Talks"
