full_description = '''CNET's AI PolicyWith proper guardrails, new tools can assist us in producing expert, unique and helpful advice.Published June 2023 | Updated December 2024 CNET has built our expertise through nearly 30 years of testing and assessing new technology. Our goal is to drive conversations about how those advancements -- including generative AI -- can solve real-world problems, because we believe you can create a better future when you understand new ideas. Our commitment is to be transparent about our process and results and to deploy new tools in smart and ethical ways.As of this writing, CNET does not use generative AI to create any text, imagery or video published on our site or its platforms, except as examples of AI capabilities in coverage of tools on the market. Previously published AI-assisted content remains on a small fraction of our work: 34 stories, each with a disclosure next to the byline, compared to the 10,000-plus new stories we produce each year.We're proud to be the No. 1 tech news site and powered by creative, hands-on experts who use new tools thoughtfully and ethically. Our standard for evaluating the use of AI in content includes three tenets:One, every piece of content we publish is factual, original and edited by a human, whether it's created by a human alone or assisted by an AI tool (like Otter.ai, a speech-to-text tool we use for note-taking and transcription) or our former in-house AI engine, called RAMP (for Responsible AI Machine Partner.) If we decide as an editorial team to use generative AI to create any future content, that content will be sourced from our own data, our own previously published work or carefully fact-checked by a CNET editor to ensure accuracy and appropriately cited sources.Two, on any CNET stories or pages that feature text that originated from AI tools, we'll include that information in a disclosure -- specifically, in a secondary byline at the top of the story. Readers should know if AI was used to generate any significant portion of the information they're reading beyond standard implementations such as autocorrect or transcription tools.Three, authors and creators are always credited for their work. The use of any AI tools we may test or adopt will include staff training on processes that prioritize accurate sourcing and meet our standards of citation.CNET's use of AI is guided in part by a working group of staffers from across our organization who regularly meet to collaborate on principles that establish how we work with new and emerging tools. This page will keep you informed of that work, and we'll update it as we learn and adjust.Here are some examples of places in our work where we have previously used RAMP or may consider using another generative AI tool. Organizing large amounts of information: After decades of reporting and testing products, we've got loads of valuable data -- and so do our trusted partners. One way we can use AI is to analyze and sort that information to create specific guidance, such as in geographically targeted guides of local services. For example, this guide to the best internet service providers in Bismarck, North Dakota, used RAMP to gather speed, pricing and availability information from a proprietary database, and that is noted next to the byline with the phrase "Assisted by AI." A staff writer then reviewed, fact-checked and added additional subject matter expertise to RAMP's drafted content, which was trained on CNET's archive. We are not actively publishing new RAMP-assisted work.Speeding up certain research and administrative portions of our workflow: CNET editors could use AI to help automate some portions of our work so we can focus on the parts that add the most unique value. This might include creating outlines of a given topic or analyzing written work to let us know if it's missing key themes or relevant context we can add.Here are situations where we won't be using AI:Writing full stories: None of the stories on CNET have been or will be completely written by an AI. If that changes, as technology and our processes evolve, we will disclose it here. For now, the 34 articles with our AI disclosures may contain portions of text that were generated by AI and then edited and fact-checked by our editors.Product testing: We're not using AI tools to do any of the hands-on, product-based testing that informs our reviews and ratings -- except in cases where we're reviewing and rating AI tools themselves and need to generate examples of their output, as we do within AI Atlas, our human-created compendium of AI news and information. All CNET reviews are performed by our trusted, experienced and award-winning human experts, many of whom have a decade or more of experience with the tech they review. See here for more information about how we test everything.Generating images and videos: CNET staff photographers and video producers are evaluating approaches and best practices regarding the use of generative AI to create images and videos. As of now, CNET is not publishing AI-generated images or videos except as examples of AI capabilities.CNET will block bots that scrape our content to train their large language models (LLMs). However, we are making a few exceptions for bots whose services cite and link back to our content.We're continuing to test AI tools and we expect that the future will bring many new ways to use them. We'll continue to let you know about our progress. .c-layoutDefault_page .lg\:u-col-6 { grid-column-start: 4; margin-top: 30px; } @media screen and (max-width: 1024px) { .c-layoutDefault_page .lg\:u-col-6 { grid-column-end: 12; grid-column-start: 1; }'''
year_published = 2025
