full_description = "Voices CNET Voices is a select group of creators, experts and thought leaders who share first-person perspectives on technology and its intersections with our lives. CNET Voices writers are independent CNET contributors. All Voices content is original. Some Voices content is paid content, labeled clearly and prominently. Contact the editor. Our contributors Deenie Hartzog-Mislock Fei Wu Justin Eastzer Kimanzi Constable Vee Weir Vanessa Hand Orellana Deenie Hartzog-Mislock CNET Voices Contributor facebook x email Location Raleigh, NC Expertise Women's Health, Lifestyle, Beauty Tech, Parenting About me facebook x email Deenie is a CNET Voices contributor covering women's health. She has a 15+ year career as a marketing copy director, and is also an essayist with bylines in The New York Times Modern Love column, Slate, Longreads, Refinery29, and more. She writes a newsletter called BLURT, in which she explores what makes our lives both mundane and majestic. You can learn more about her career at deeniehartzog-mislock.com. Latest from Deenie Fei Wu CNET Voices Contributor facebook x email Location Boston, MA Expertise Consumer Tech, Artificial Intelligence, Creator Economy About me facebook x email Fei Wu is a Chinese-American video marketing expert and virtual event strategist. She helps creators and businesses turn their visions and expertise into digital-driven brands that elevate their services, products, and partnerships. She is a bilingual podcaster (English and Mandarin Chinese), the creator of the Feisworld YouTube channel and Feisworld Podcast (菲的世界播客), and created a Feisworld documentary series, which debuted on Amazon Prime in 2019. Learn more about Fei at feisworld.com. Latest from Fei Justin Eastzer CNET Voices Contributor facebook x email Location New York, NY Expertise Nearly a decade of experience creating for video platforms like YouTube and three years' experience building Diabetech, a leading diabetes technology news source. About me facebook x email Justin Eastzer is a CNET Voices Contributor and former CNET host. Prior to CNET, he worked in Hollywood in TV development and on shows like America's Got Talent. As the founder of Diabetech, he now reports on consumer and diabetes technology on YouTube, Instagram, TikTok and the Diabetech podcast. Justin's mission is to educate his viewers so they can live a happier, healthier, tech-ier and more informed life. Latest from Justin Kimanzi Constable CNET Voices Contributor facebook x email Location Remote (Digital Nomad) Expertise Travel, Commerce, Entrepreneurship, Digital Nomadism, Broadband, Energy About me facebook x email Kimanzi Constable is a CNET Voices contributor who writes about energy, personal finance, broadband and entrepreneurship. He is the author of four books and a freelance writer whose articles have been published in Fortune, AskMen, Forbes, Entrepreneur, Insider, SUCCESS Magazine, Parents, Travel & Leisure, NBC, CBS, Black Enterprise and over 80 other publications and magazines. He's a global traveler who has been to nearly countries and counting. Keep up with his writing at kconstable.com. Latest from Kimanzi Vee Weir CNET Voices Contributor facebook x email Location Boulder, CO Expertise Personal Finance, Consumer Behavior, Saving, Investing, Economy About me facebook x email Vee Weir is an award-winning, anti-capitalist personal finance content creator and business owner. Her main focus and mission is to challenge common money myths, dismantle barriers preventing access to financial information and examine how capitalism negatively impacts the working class. She is currently an AFC® candidate. When she's not online she spends her time hiking with her partner and three dogs in the Rocky Mountains of Colorado. Latest from Vee Vanessa Hand Orellana CNET Voices Contributor facebook x email Location San Francisco, CA Expertise Consumer Technology, Smart Home, Family, Apps, Wearables About me facebook x email Vanessa is a CNET Voices Contributor and was previously CNET's head of wearables, reviewing and writing about the latest smartwatches and fitness trackers. She joined the brand first as an on-camera reporter for CNET's Spanish-language site, then moved on to the English side to host and produce some of CNET's videos and YouTube series. When she's not testing out smartwatches or dropping phones, you can catch her on a hike or trail run with her family. Latest from Vanessa"
