description = "Our CNET editors share their top gift recommendations for every occasion"
full_description = '''Bokksu collects some of the best snacks from Japan and compiles them in a one-time or recurring monthly curated tasting box. I've both given and received a Bokksu and it is always a hit. Inside the unmistakable orange boxes, you'll find eats like seaweed tempura, green tea and lemon cakes along with Japanese candy such as yuzu gummies and matcha-strawberry Kit-Kats. What's more, Bokksu includes some info-packed literature explaining a bit about each, including historical and cultural significance. Bokksu boxes start at $40 a month for subscriptions and $50 for a one-time send. CNET's Chris Wedel borrowed a pair of these glasses for an international flight, and will travel never travel without them again. "The ability to have as much display space as I need for work, and a comfortable viewing angle for watching movies or playing games, makes travel so much more bearable. The glasses are also great for working on the go once you arrive at your destination." For more details on them, you can check out CNET's review of the Xreal Air Pro 2 smart glasses. Billed as the human dog bed, the Plufl has been getting a lot of play on TikTok and other social media channels, so we decided to try one. The "bed" actually comes in four pieces: the cover, two fairly long tube-like pillows and a slim, oval "mattress" made out of memory foam. You stuff everything inside the cover -- assembly takes about 15 minutes -- and lo and behold, you're looking at a giant dog bed (or a plush life raft that doesn't float) big enough for a human. Not only is it quite comfortable for homo sapiens, but our family canine immediately sought refuge in this much larger, roomier version of his bed. While the Plufl is slightly more suitable for small or average-size humans, as long as you aren't really tall, it should accommodate you. It comes in a few colors, and the cover is removable and washable. BioLite has several portable lighting options, and the Alpenglow 500 is one of its more recent additions. It's a portable lantern that has multiple modes and color options. As its name implies, it delivers 500 lumens, and as CNET's David Carnoy notes, it is indeed pretty bright.'''
