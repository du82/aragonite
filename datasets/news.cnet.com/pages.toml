["https://news.cnet.com/home/energy-and-utilities/features/the-us-power-grid-has-a-problem-your-house-could-help-solve-it"]
title = "The US Power Grid Has a Problem. Your House Could Help Solve It - CNET"
description = "Willing to let your utility borrow your thermostat? It could help save billions of dollars in infrastructure costs while lowering your power bill."
full_description = "Zooey Liao/CNET The US Power Grid Has a Problem. Your House Could Help Solve It Willing to let your utility borrow your thermostat? It could help save billions of dollars in infrastructure costs while lowering your power bill. Jon Reed Senior Editor Jon Reed is a senior editor overseeing coverage for CNET's home, energy and utilities category. Jon has over a decade of experience of writing and reporting as a statehouse reporter in Columbus, Ohio, a crime reporter in Birmingham, Alabama, and as an mortgage and housing market editor for TIME's former personal finance brand, NextAdvisor. Jon now leads coverage and strategy on CNET's Energy category and aims to help readers take charge of their home's energy usage and costs. Jon has first-hand experience testing home energy products such as portable power stations, home battery solutions and smart thermostats. Jon has showcased his expertise live on TV for news networks and his written work is often cited in major publications such as This Week in CleanTech, NASDAQ and MorningBrew's newsletter. When not asking people questions about energy, he can usually be found half asleep trying to read a long history book while surrounded by multiple cats. You can reach Jon at joreed@cnet.com Expertise Energy, Solar Power, Renewable Energy, Climate Issues, Virtual Power Plants, Grid Infrastructure, Electric Vehicles, Plug-in Hybrids, Energy-Savings Tips, Smart Thermostats, Portable Power Stations, Home Battery Solutions, EV Charging Infrastructure, Home See full bio Jon Reed Aug. 18, 2024 5:00 a.m. PT 21 min read This story is part of CNET Zero, a series that chronicles the impact of climate change and explores what's being done about the problem. It's not apparent from the curb what makes the Hillside development at O'Brien Farm in South Burlington, Vermont, different from any other tract of homes being built around suburban America. The street I pull onto looks like an evolutionary chart of suburbia: At one end stand complete, freshly painted 2,500-square-foot houses with well-manicured lawns and landscaping. Moving northward along Leo Lane, I see some homes missing finishing touches, then some missing garage doors, then wooden skeletons. Finally, there are bare patches of dirt. I get stuck behind a dump truck. I had to look — and listen — closely to see what makes this development a glimpse of something new. It's not just an innovative way of building a community. It's a way of future-proofing the American electric grid through the clean energy transition and climate change. Once people move in, these homes will work together with others from across the state to form a virtual power plant, ensuring consistent power and saving both the grid and residents money. In some programs like these, people have negative power bills. That's the promise of a virtual power plant. Touring the model home, the first thing I notice is the sounds. Outside is a busy construction site, filled with the noise of front-end loaders and that dump truck. Inside the house, I can't hear it. These homes are built with enough insulation to keep comfortable air inside and the cold New England winter — or, as was the case when I visited, a hot and humid New England summer — on the outside. I can't feel the heat in here. It's a little chilly. Next up: the appliances. In the kitchen, there's an energy-efficient induction cooktop. An iPad sits on the counter tuned to the SPAN app, which provides control over every circuit in the home and a view of the home's energy use. For those who own an electric vehicle, in the garage is a SPAN EV charger, which comes with the house. In the basement, a utility closet houses a large Mitsubishi Electric heat pump air handler — it's the heater in the winter and the air conditioner in the summer. It's all-electric and barely makes a sound.The water heater, also powered by a heat pump, is in another closet. On the wall across from it is the SPAN smart electrical panel controlled by that iPad in the kitchen. Next to that: three Tesla Powerwall batteries, packing 40.5 kilowatt-hours of energy storage, enough to get a household through a lengthy blackout. In this article: Inside a virtual power plant What's wrong with the grid we've got? The changing ways we generate electricity When your home is the power plant We're using more electricity, and in different ways Shaving peaks and saving power Why your electricity use matters Demand reduction in action Can VPPs save the grid? How to sign up for a VPP A new home: batteries included Those Powerwalls are also wired to the 8kW Qcells solar panel system on the rooftop. That app on the kitchen counter shows just how much power this house has gotten from the panels so far today, and how much it's had to buy from Green Mountain Power, the electric utility that leases out the Powerwalls. The model home of the Hillside at O'Brien Farm development in South Burlington, Vermont, offers a glimpse at an all-electric, connected energy future. Jon Reed/CNETThis entire home is a collaboration between GMP and the developer, O'Brien Brothers. Every house in this development will come with a system like this, resulting in an entire neighborhood of energy-efficient homes equipped with solar panels, backup batteries and all-electric appliances. One thing I can't see: There isn't an inch of fossil-fuel pipe in this soon-to-be neighborhood. The gas company would've put it in for free, but O'Brien Brothers said no thanks. The people who move in here will know their energy use isn't contributing to the fossil fuel emissions driving climate change. For the power company, the neighborhood includes some ways to save energy and money. But perhaps most importantly, this neighborhood can help the country's increasingly stressed electric grid. That's because all of those batteries and EV chargers don't just stand alone — they're connected, and when the grid needs it, GMP can put them to use with a few clicks of a mouse. Across the country, electric utilities are turning to virtual power plants, or VPPs, to bridge the gap between spikes in electricity demand and the limited generation and infrastructure currently available. These programs can do the work of far more costly and dirty natural gas power plants, and they can be activated in seconds. As the US power grid faces massive challenges, these VPP programs are making individual customers — their batteries, their thermostats, their EV chargers — part of the solution. Green Mountain Power likes to refer to its VPP, which includes more than 3,000 home batteries across the state, as a real power plant. \"This is our largest generating facility, all of this network of stored energy,\" says Kristin Carlson, GMP's vice president for strategy and external relations. \"It's obviously a great experience for the people who live in the homes, but then it's benefiting all of our other customers as well.\" The clean energy transition is changing the way we generate electricity, and climate change is making it harder to keep the lights on through increasingly severe weather. American consumers face rising power bills as infrastructure costs and energy supplies push up the price of electricity and as they use more power to charge their EVs or run all-electric heating and cooling, all areas where fossil fuels are on the way out. It's easy to think of solar panels and home batteries as routes to energy independence, to cutting oneself off from the grid and its vulnerabilities and going it on your own. But what if the solution to both of these problems isn't energy independence but energy interdependence? A report last year by the US Department of Energy estimated that deploying 80 to 160 gigawatts of VPP capacity by 2030, on top of the existing 30 to 60 GW, could save $10 billion in annual grid costs. From New England to Hawaii, VPPs are an increasingly important item in the toolbox of the US electric system. So why isn't your home part of a VPP yet? I talked to energy experts, executives, policymakers and consumers to find out. Here's how they work, why the old grid isn't cutting it anymore and what you need to know about your home's electric future. Inside a virtual power plant Green Mountain Power's headquarters is in Colchester, a short drive from Burlington, and inside it is a control room. Across one entire wall is \"The Grid,\" visualized. A massive diagram, like a high-tech subway map, shows the names for each generator and substation (one is simply \"Ben & Jerry's\") and the controllers sitting at monitor-laden desks keep a close eye for lines that are damaged or out of commission. This is what I picture when I think about the grid. This chart, showing the energy load for Green Mountain Power in Vermont on July 9, 2024, illustrates the savings and reduced peak from use of the utility's virtual power plant. Zooey Liao/CNETThe VPP? It's not here. It's on the other side of the secure door and bulletproof glass that guard the control room. It's at a desk a few feet away, on the laptop of Maddy Murray-Clasen, GMP's innovation project manager. From a program called Virtual Peaker, Murray-Clasen monitors and controls all of the batteries and EV chargers in the company's VPP. When her colleagues predict an extra oomph of power might be needed, she schedules an event for that day. It could be a particularly hot summer day, when late afternoon and early evening might see Vermonters get home from work and simultaneously blast their air conditioners. When demand is high and supply is low like this, the batteries can discharge power onto the grid. A homeowner's Tesla Powerwall, for example, will release all but 10% of its potential stored energy, leaving enough for backup in case of an outage. That's unlikely to be needed — this whole system is designed to prevent those outages in the first place. \"Who doesn't lean toward energy savings and hedging against the future volatility of energy markets?\" Evan Langfeldt, O'Brien Brothers CEO For an EV charger, GMP will ask customers for permission to turn off their charger during a grid event, meaning someone mindlessly charging their vehicle won't be contributing to a strain on the system. You'd have the choice to opt out of this, although instead of paying the usual discounted rate you'd get for charging your EV, you'll have to pay the higher standard electric rate. That's rare, occurring less than one-tenth of 1% of the time, Murray-Clasen says. In the energy industry, the traditional systems that provide emergency power to the grid are known as peaker plants. These facilities, usually powered by natural gas, are activated fairly quickly when energy is needed. They may sit idle for much of the year, jumping into action only on the most demanding days. They're expensive to build and maintain, and when they're used, they're belching climate-warming fossil fuel emissions. The VPP, on the other hand, is using your home's batteries to deal with those peaks. And Green Mountain Power's generation is entirely carbon-free. GMP has never actually had to switch on its VPP unexpectedly in an emergency — the utility usually know at least a day in advance when it'll be needed — but I want to know how quickly it could be activated (for context, a peaker plant can turn on quickly, but not instantaneously). Murray-Clasen thinks about it and runs through how quickly she could click everything. \"Less than a minute to log in and click go,\" she says. That kind of speed might be necessary, considering all the hurdles facing our energy system. The \"grid\" is controlled from screens like this one at Green Mountain Power in Vermont. Jon Reed/CNET What's wrong with the grid we've got? It's been called the world's largest machine. Hundreds of thousands of miles of wires connecting everything from the Hoover Dam to your home and the coffee shop down the street. It's dotted with substations and transformers and strung with transmission lines stretching as far as the eye can see. When part of it fails for even a few hours, that makes the news, and if part of it fails for a longer period, the effects can be deadly. The prospect of the whole thing failing at once keeps national security experts up at night. It cost more than a trillion dollars to build, and this machine, the US electric grid, has problems. \"Today, it's very clear that we don't use the machine efficiently,\" Jigar Shah, director of the US Department of Energy's Loan Programs Office, told me last year. \"There's no other machine in the world that you spend a trillion dollars on that you're not trying to get the most out of it.\" The clean energy transition is changing the way we generate electricity, and climate change is making it harder to keep the lights on through increasingly severe weather. But the problems stretch beyond inefficiency. For about two decades, the grid has been sufficient. It's had its struggles, but it's largely been up to the task. That's because, each year, we've asked about the same of it as we did the year before. That's changing, and fast. \"We've underinvested in the grid for many years in the country for many, many reasons, and it's coming home to roost now,\" says Mark Dyson, managing director with the Carbon-Free Electricity Program at the clean energy think tank RMI. The problem is on the mind of energy experts from the federal government down, and one of many potential answers comes in the form of better coordination among the appliances in your homes and offices. A VPP is relatively cheap and can be easily scaled, but to understand its potential role, you have to grasp the scope of the grid's issues. Estimates from the Department of Energy found that, when costs and benefits were considered, a virtual power plant can provide electricity at a demand peak at a much lower cost than a natural gas peaker plant. Zooey Liao/CNET The changing ways we generate electricity In 2023, fossil fuels still accounted for 60% of US utility-scale electricity generation, EIA reports. The bulk of that came from natural gas, at 43.1%. But renewables are growing quickly, accounting for 21.4% last year. Renewable energy has a big advantage over fossil fuels. Namely, that the burning of fossil fuels for energy is the biggest single driver of climate change. \"You'll see utilities become this energy services platform for the community.\" John Farmer, senior communications consultant for PGE A working group of the Intergovernmental Panel on Climate Change said in 2022 that holding global warming under 2 degrees Celsius will require \"substantial energy system changes over the next 30 years. This includes reduced fossil fuel consumption, increased production from low- and zero-carbon energy sources, and increased use of electricity and alternative energy carriers.\" But renewable energy, particularly solar power, has a distinct disadvantage: The sun and the wind don't follow the commands of US grid operators. When the sun isn't out and the wind isn't blowing, they'"
