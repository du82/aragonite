uts the spotlight on the latest and most important developments in artificial intelligence. Full bio your trusted source on ai CNET has been covering AI for more than two decades. Now we're bringing you a new wave of expert, unique and helpful insights, through in-depth explainers, hands-on product reviews, how-to posts and more, to help you see how AI fits into your life. How to Use ChatGPT: A Beginner's Guide By Amanda Smith Take Back Your iPhone Storage by Turning Off Apple Intelligence. Here's How By Jeff Carlson How to Detect AI Writing By Rachel Kane AI Scammers Are Creating More Believable Schemes. Here's How to Stay Safe By Neal O'Farrell How to Use Spotify's AI DJ By Rachel Kane How to Create AI Images: A Complete Guide With Expert Advice By Katelyn Chedraoui Meal Planning With ChatGPT Saved Me Money and Time By Corin Cesaric How to Use AI to Make a Work Presentation By Carly Quellman glossary glossary hallucination large language model machine learning multimodal prompt hallucination An incorrect or made-up response from generative AI but stated confidently as fact. See full glossary faqs faqs What is Apple Intelligence? Apple Intelligence is the name Apple has given to the generative AI tools it's introducing into certain iPhones, iPads and Macs: the iPhone 16 line, iPhone 15 Pro models, and Macs and iPads with M-series chips. The first, modest set of features arrived in October 2024 as part of iOS 18.1, iPadOS 18.1 and MacOS Sequoia 15.1, and included some writing tools, a Clean Up tool for photos and an upgrade to Siri. Later in the year, iOS 18.2 brought more AI features, including Genmoji, Visual Intelligence and ChatGPT integration for Siri. Learn more What is GPT-4o and how does it relate to ChatGPT? GPT-4o (the o is for "omni") is the May 2024 update from OpenAI to the AI engine that powers ChatGPT, and it's two times faster than GPT-4 Turbo, which debuted in late 2023. Your prompts can include any combination of text, audio, images and video, and the responses generated will be able to include similar combinations. According to OpenAI, GPT-4o brings "GPT-4-level intelligence to everything" including the free version of ChatGPT, though paying customers will get five times the capacity. New real-time speech functionality means you can interact with ChatGPT in a more conversational way. Learn more What are AI tokens and how do they work? Tokens are pieces of words that an LLM evaluates to understand the broader context of a query. Each token is made up of roughly four characters in English. They can be letters, numbers, spaces, special characters and more. For example, the sentence "You miss 100% of the shots you don't take" consists of 11 tokens. (If you swap out the percentage symbol for the word "percent," the count increases to 13 tokens.) Tokens are used both as inputs and outputs. When you input a query into an AI model, the model breaks down the words into tokens, analyzes them and delivers a response in tokens that are then converted into words you'll understand. Learn more What is an AI hallucination? A generative AI model "hallucinates" when it delivers false or misleading information. This happens because of how the models are trained, on massive amounts of data, like articles, books, code and social media posts. In creating its response to a prompt, the AI makes inferences about what words should come next, but it lacks contextual information so it may generate wording that seems plausible but isn't true. Hallucinations can also result from improper training and/or biased or insufficient data, which leave the model unprepared to answer certain questions. Learn more Showing 1 of 4 our ai experts Our writers and editors know the subject cold. Here are CNET's leading authorities on AI. Katelyn Chedraoui Katelyn writes about social media and online services, with an eye for how AI can work for you. Imad Khan Imad covers Google and all its AI products, as well as those from Microsoft, OpenAI and more. Patrick Holland An expert in mobile tech, Patrick has the lowdown on how AI is showing up in the phones in your pocket. AI Atlas is 100% human-generated. For more, see CNET's AI policy. trending topics Amazon's Alexa Set for Major AI Upgrade Wednesday: Here's What to Expect By Samantha Kelly Annie Lennox, Kate Bush, Others Contribute to Silent Album to Fight AI Proposals By Omar Gallaga Apple's iPhone 16E Brings Apple Intelligence Features With a Cheaper Price Tag By Abrar Al-Heeti Humane AI Pins Will Stop Working at the End of This Week By Gael Cooper Apple Update Teases Google Gemini Integration on iPhones By Samantha Kelly Scarlett Johansson Urges AI Guardrails After She's Shown in Fake Anti-Ye Video By Samantha Kelly Google Launches Gemini 2.0 for Everyone. Here Are the Highlights By Joe Hindy One-Two AI Punch: DeepSeek's Image Generator Follows Its Earthshaking Model Release By Samantha Kelly Home Security How AI Has Started Sorting Through Your Home Security Videos Here's how these new features tap into home security camera footage -- and if you can turn them off. By Tyler Lacoma ai atlas must-read more news These 6 Apple Intelligence Features Elevate the iPhone 16E 1 day ago OpenAI Says Its New ChatGPT 4.5 Has Better Emotional Intelligence 2 days ago Viral Trump Gaza Video Shows How Quickly AI Slop Can Spread 2 days ago How to Use AI to Find a Constellation 2 days ago I Tried AI to Help Me Tackle an $18K Debt, but It Went Comically Wrong 2 days ago AI Has Started Searching Through Your Smart Home Videos: Should You Worry? 2 days ago Is Apple Intelligence Getting in Your Face? Here's How to Turn It Off 2 days ago iPhone 16E Review: For $599, It's Good but Also Kind of Odd 3 days ago Apple Says It's Fixing Transcription Glitch That Transcribes 'Racist' as 'Trump' 3 days ago OpenAI Rolls Out Deep Research Access to More ChatGPT Users 3 days ago Load more .c-atlasHero_sponsorImage { width: 130px; }'''
