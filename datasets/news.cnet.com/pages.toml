["https://news.cnet.com/tech/mobile/features/a-cambrian-explosion-ais-radical-reshaping-of-your-phone-coming-soon"]
title = "'A Cambrian Explosion': AI's Radical Reshaping of Your Phone, Coming Soon - CNET"
description = "Smartphones will get much better at meeting your needs, thanks to artificial intelligence. And that's just for starters."
full_description = '''Getty Image/ Jeffrey Hazelwood/ CNET 'A Cambrian Explosion': AI's Radical Reshaping of Your Phone, Coming Soon Smartphones will get much better at meeting your needs, thanks to artificial intelligence. And that's just for starters. Lisa Eadicicco Former Senior Editor Lisa Eadicicco covered mobile devices. Prior to joining CNET, she served as a senior tech correspondent at Insider, reporting on Apple and the broader consumer tech industry. She was also a tech columnist for Time magazine and got her start as a staff writer for Laptop Mag and Tom's Guide. Expertise Apple | Samsung | Google | Smartphones | Smartwatches | Wearables | Fitness trackers See full bio Lisa Eadicicco Sept. 22, 2024 6:00 a.m. PT 16 min read In sci-fi shows like Westworld and The Expanse, characters use evolved mobile devices with sleek transparent designs that can project holograms or magically morph their interface as needed. Fanciful? Maybe. But smartphones are about to take a leap forward. Today, tech giants are putting the pieces in place for advancements in artificial intelligence that will push the smartphone into its next era — and soon. Within the next few years, experts say, our phones will be much more intuitive, helpful and even friendly. That shift would not only make phones feel fresh and interesting in ways they haven't been for years but could also liberate us from being immersed in our screens. Just this month, Apple announced the iPhone 16 and iPhone16 Pro, which it's trumpeting as the first iPhones built for the company's new AI system, Apple Intelligence. The new phones include a dedicated button for triggering the camera and "visual intelligence," an AI-fueled camera mode that lets you learn about your environment just by pointing your phone and pushing a button. In the future that companies like Apple, OpenAI, Samsung and Google are sketching out, your phone's camera won't just be for snapping selfies or documenting your vacation — it'll be a wider window into the world around you. Apple's upcoming visual intelligence feature is just one example. And that's only the starting point. Amy Webb, a quantitative futurist and founder and CEO of the Future Today Institute, says she's seeing an "extraordinary number" of new devices, patents and funding rounds involving new tech devices without screens, adding that the phone as we know it may eventually "fade into the background." She likens it to the evolutionary burst millions of years ago that introduced a stunningly broad range of animals."At the moment, we are at the beginning of a Cambrian explosion of devices and sensors," she says. In this article: AI arrives to breathe new life into the smartphone Phones have eyes (and voices) Smarter software AI has big potential… and big problems Devices of the futureFor now, most smartphones will continue to look like the slabs of glass and metal we carry around today for the foreseeable future (sorry, no holograms or see-through screens yet). But they'll get better at surfacing information the moment we need it, almost like the adaptable software shown on the devices in The Expanse. Instead of constantly jumping between apps and digging through menus, you may find yourself simply speaking to your phone to get things done. Or better yet, your phone's screen may show exactly what you need without you even having to ask. "My very top-down view is that long term, I would like a phone where you would never have to go into the settings menu," Patrick Chomet, Samsung's executive vice president and head of customer experience, tells me. "You shouldn't have to know the name of any feature. And we wouldn't have to name them, because the device would have full enough intelligence and context to support the actions that you want to do." Speaking with tech executives, analysts and futurists, and drawing on my own experience trying new devices and cutting-edge virtual assistants, has painted a picture of where the smartphone is headed. AI arrives to breathe new life into the smartphone At a time when the majority of people in the world own a smartphone, the idea of having a supercomputer in your pocket isn't as novel as it once was. It's harder than ever to get consumers excited about new phones — as innovative as folding phones are, they haven't exactly ignited much fervor among consumers. And there's data to show it. Forty-four percent of smartphone owners upgrade their phone only when it breaks or needs replacing, according to a CNET survey published in September based on data collected by YouGov. The same survey also indicated that consumers hold onto their phones for three years or longer, aligning with comments Verizon CEO Hans Vestberg made to CNBC in July that subscribers keep their phones for way over 36 months. Although the smartphone market began to rebound this year, sales reached nearly a decade low in 2023, according to Counterpoint. "The smartphone has become commoditized, so they're all fairly similar," says Webb. "Even though you have two predominant operating systems that are different, they're also not totally different from each other." But following the explosive launch of ChatGPT in late 2022, smartphone makers saw an opportunity for AI to chart a new path for our smartphones. The first wave of generative AI features has largely focused on very specific use cases, such as editing a photo, summarizing a transcript or translating a conversation. Niche as these tools may be, they bring something to the smartphone experience that's been sorely lacking in recent years: features that feel genuinely new, like the ability to create an image from scratch with just a few taps. Yet this is just the beginning of what tech leaders see as being a more significant breakthrough in the smartphone's growth. The next stage of AI-fueled updates could lay the groundwork for a future in which we don't need to open as many apps, menus or services to get things done on our phones. As phones get smarter and better at understanding our intentions, we'll find ourselves relying on screens less. It's a transformation that Sameer Samat, Google's president of the Android ecosystem, and Sissie Hsiao, vice president and general manager of Gemini experiences, have been thinking about a lot — and that's important considering Android powers nearly 80% of the world's smartphones, according to Counterpoint Research. Samat tells me how Google is "rebuilding" Android, with AI being at the center of it all, and of course Gemini — the company's AI assistant — being the star. "This is not your traditional assistant anymore," Hsiao says. "This is really capable of doing new things." Zooey Liao/CNET Phones have eyes (and voices) Advancements in generative AI have made virtual assistants much smarter and more conversational than the Siris and Alexas of years past. Instead of just answering questions, voice-enabled helpers are getting better at sounding more natural and convincing. Nick Turley, OpenAI's product lead for ChatGPT, thinks speaking to our devices will go from niche to mainstream the same way chatbots have over the past two years. "A year from now, I would suspect that voice could be the primary way that people use [ChatGPT]," he says. It's not just words anymore, either; tech companies and phone makers want our devices to get better at "seeing" our surroundings too. That message was clear during Apple's annual device event on Sept. 9, where it introduced a new feature coming to the iPhone 16 called visual intelligence. With the push of the iPhone 16's new Camera Control button, you'll be able to point the phone at a restaurant and find its hours or scan a flier for an event to add it to your calendar. There are also on-screen buttons for launching a Google search based on your photo or for asking ChatGPT about an image. Based on Apple's pre-recorded demo, it looks like a new type of visual interface for the iPhone that leans on the camera as the primary means of input, instead of opening an app and typing or swiping. "I imagine that ChatGPT in five years is out there performing actions for you, on your behalf, rather than just responding." Nick Turley, OpenAI's product lead for ChatGPT Apple is just the latest tech company to explore an idea like this. In May, OpenAI showed how the chatbot could recognize math equations and provide tips in real time, like a virtual math tutor, just by pointing your phone at the problem. Google's Gemini helper can analyze the contents of a YouTube video to answer questions about it. For Google, Gemini's current capabilities are laying the groundwork for a more ambitious rethinking of the virtual assistant: Project Astra. The prototype digital assistant can "see" and "understand" your surroundings using your phone's camera and combine that data with speech input to process requests. In a video shown at Google's developer conference in May, the user pointed a phone at a speaker sitting on someone's desk, drew an arrow on the phone's screen pointing at a particular part of the speaker and asked, "What is that part of the speaker called?" Astra responded that it was a tweeter, and explained what that component does. CNET's Lexy Savvides briefly tried Google's Project Astra demo at Google I/O and witnessed how it could generate a story based on pictures of animals held in front of the camera. Google/Jeffrey Hazelwood/CNET"[Gemini Live] is really the start of a journey towards fully expressive, multi-modality," Hsiao says, adding that the first place the tech behind Astra will be widely available is in Gemini on smartphones, although she didn't specify launch timing. "Already in Gemini Live, you can speak to it; it speaks back to you. We envision taking that with Astra into turning on the camera so it can also see and engage with you in audio full bore." It's all starting to feel more like science fiction, so much so in fact that OpenAI found itself in hot water over accusations that it copied the voice of Scarlett Johansson, who played the astoundingly human-like virtual assistant in the 2013 Spike Jonze movie Her, for one of ChatGPT's voices. Saar Gur, general partner at the venture capital firm CRV, who specializes in spotting companies that lean into shifts in consumer behavior, thinks voice interaction as a computing interface is "underestimated" today. He believes speaking with AI agents will increasingly become the norm. "It will be much more common instead of, 'let me Google that,' that this voice [assistant] will enter a conversation you and I are having," Gur says. Going a step beyond that, Gur sees an opportunity for AI personas to provide entertainment and companionship in ways they aren't today. He refers to his teenage son, who frequently chats with other gamers on Discord, as a hypothetical example of how AI avatars can be used for more than just retrieving information. The next stage of AI-fueled updates could lay the groundwork for a future in which we don't need to open as many apps, menus or services to get things done on our phones. "Many of his friends are people he's never met," he says. "The idea that now there can be chatbots that are actually much safer for him to interact with, because they're not real people that could then take his password and share it somewhere else." And he's not alone; entrepreneur Avi Schiffmann made headlines in July for developing a smart pendant with an embedded AI assistant called Friend that's designed specifically for, well, friendship. Smarter software For devices with "smart" in their name, today's phones don't always feel very intelligent. It's up to the user to do a lot of the work when it comes to basic tasks, like toggling settings and catching up on notifications. "For the most part, the interaction, the process is still very manual," Webb says. "It requires you to look at a screen and type some stuff in." Getty Images/Jeffrey Hazelwood/CNETBut tech companies think AI might be the key to solving that problem, and it could prevent us from keeping our noses buried in our phones as often. It's one of the key tenets of Apple Intelligence, which will start rolling out next month, as evidenced by visual intelligence and other previously announced features. Apple's upgraded Siri is equipped with knowledge about Apple product settings, which should enable it to be a personal IT department and copilot for navigating your device, among other things. Apple's 13-year-old virtual assistant will also be able to take actions for you within apps and is getting better at understanding the context behind the information stored on your phone, enabling it to answer new types of questions. One example shown at the company's Worldwide Developers Conference in June involved asking Siri a question like, "When is my mom's flight landing?" and having it cross reference email and real-time flight tracking. You would then be able to follow up with a query like, "What's our lunch plan?" and have Siri extract details from a text message. ChatGPT, best known for providing conversational, human-like responses today, will also likely evolve to do more things on your behalf, Turley says. "While ChatGPT has begun to do things like create an image or perform a task, in many cases, [it's] still giving you text back," he says. "And I imagine that ChatGPT in five years is out there performing actions for you, on your behalf, rather than just responding." Chomet, the Samsung executive, has bold ideas for how AI could make our phones easier to use. His long-term goal is to make it so that users never have to open the settings menu on a Samsung phone ever again. The company's approach is all about making various "touch points" on Samsung devices — that is, the parts of the operating system we interact with, such as the keyboard and camera — smart enough to predict what the user wants. "I would like a phone where you would never have to go into the settings menu. ... You shouldn't have to know the name of any feature." Patrick Chomet, Samsung EVP and head of customer experience He acknowledges ways in which Galaxy phones are already doing this, such as the keyboard, which now includes built-in tools for text translation and rewriting messages. Other aspects of the operating system, like widgets, notifications, the lock screen and settings menu on Samsung phones, are next. Chomet sees a future in which you might not even have to think about what to do next on your phone. "[You'd] never have to go to the settings, or you never have to look for the next action," he says. "You may not need to open [an] app." It's a problem that companies beyond OpenAI, Google, Samsung and Apple are trying to solve. Startup Brain.ai, for example, has created smartphone software that can assemble an interface based on the task at hand rather than ping-ponging between apps. My colleague Katie Collins saw the technology in action earlier this year at Mobile World Congress during a demo in which Brain.ai CEO Jerry Yue simply asked the ph'''
