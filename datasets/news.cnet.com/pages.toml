full_description = '''Jump to Section... Best Mattress to Buy on Amazon in 2025 Wellness Sleep Article updated on March 1, 2025 at 9:00 AM PST Best Mattress to Buy on Amazon in 2025 Amazon has a wide range of products, including high-quality mattresses from top brands. These are CNET’s picks for the best mattresses available from the online retailer. If you want a new mattress, Amazon is a great place to start your search. Amazon has a wide variety of mattresses from popular brands, and the prices are hard to beat. With Amazon, you can browse some of the best mattresses from the comfort of your home. Big-name brands? It has them -- such as Nectar’s plush memory foam options -- and plenty of budget-friendly finds to boot. Our team of sleep experts has tested the best mattresses Amazon has to offer to meet every sleep style and need. From cloud-like memory foam to cooling tech, we’ve put our experience testing more than 300 beds to work to find the top options. Our testers represent different body types, sleeping positions and preferences, so we’ve curated a list with options that are guaranteed to help you sleep better. Our Picks How we sort our mattresses How it works To ensure we give you the best search experience, our selection of mattresses can be sorted in 4 different ways: • Recommended • Highest price: $$$ - $ • Lowest price: $ - $$$ • Branded: Alphabetical Sort by Filter by Firmness Firmness Select all Soft (1-4) Only Medium (5-8) Only Firm (9-10) Only Clear Sleep style Sleep style Select all Back Only Combination Only Side Only Stomach Only Clear Mattress type Mattress type Select all Hybrid Only Memory foam Only Air mattress Only Clear Best overall mattress on Amazon Nectar Premier Hybrid View details $2,286 $949 at Amazon View details Best hybrid mattress on Amazon Tuft and Needle Nod Hybrid View details $999 at Amazon View details Best latex mattress on Amazon Awara Premier View details Save up to 50% off mattresses $1,329 at Amazon View details Most affordable mattress on Amazon Amazon Basics mattress View details $276 at Amazon View details Best memory foam mattress on Amazon Lucid 10-inch memory foam mattress (Update: Out of Stock) View details $349 at Amazon View details What’s the best mattress to buy on Amazon overall? Dillon Payne/CNETIf you want a mattress from Amazon made by a trustworthy brand that’s comfortable and affordable, the Nectar Premier is one of our team’s favorite picks. It’s a crowd-favorite bed perfect for memory foam lovers who want a mattress that’s not too dense but still perfectly cradles their curves. It's available in an all-foam or hybrid construction. The average person will like this bed, though it might be a little too firm for petite or side sleepers.See at AmazonBest mattresses on Amazon in 2025 Compare Hide our expert take Photo Gallery 1/1 $2,286$949 at Amazon Pros Great pressure relief&nbsp; Has a true memory foam feel Affordable for the quality&nbsp; Cons Not everyone likes memory foam&nbsp; More expensive than the Nectar Original mattress Type Memory foam mattressFirmness 6 or medium to medium firmTrial 365 nightsWarranty Forever warranty Full Review Nectar Premier Review Best overall mattress on Amazon Nectar Premier Hybrid 7.9 Photo Gallery 1/1 $949 at Amazon Why we chose the Nectar Premier Hybrid: The best overall mattress on Amazon is the Nectar Premier. It’s a 13-inch thick mattress that’s a memory foam lover’s dream. It’s more responsive than the Nectar Original mattress, meaning it won’t be as dense and slow-moving. There’s no question it still feels like memory foam. The Nectar Premier is available in an all-foam and hybrid construction. The hybrid version will give you more support and durability in the long run, especially for heavier people. You’ll also get a bit more bounce and airflow thanks to coils, although it sacrifices some motion isolation. The Nectar Premier is around medium firmness. Any sleeping position can sleep comfortably on it. It’s an excellent choice for couples with different sleeping positions and who need a bed that accommodates both. CNET Score Breakdown 7.9 /10 SCORE Performance 9 Policies 8.5 Durability 7 Features 7 Hide our expert take Compare Show our expert take Photo Gallery 1/1 $999 at Amazon Pros Suitable for all sleeping positions It’s a cheap mattress option that supports all body types Cons Might feel too soft for a heavy back or stomach sleeper Type Poly foam mattressFirmness Medium or 5Trial 100 nightsWarranty 10-year limited warranty Full Review Tuft and Needle Nod Review Best hybrid mattress on Amazon Tuft and Needle Nod Hybrid 7.3 Photo Gallery 1/1 $999 at Amazon Why we chose the Tuft and Needle Hybrid: A hybrid bed contains foam and steel coils. This typically makes them more durable and more expensive, but not in this case. I think the Tuft and Needle Nod Hybrid is the best mattress to buy on Amazon that has a coil and foam construction. Tuft and Needle are up there in popularity with Nectar, and the Nod is its Amazon-exclusive bed. The hybrid model is 10 inches thick and has a three-layer construction fit with 6-inch coils and two layers of foam. It’s a safe pick because it’s generally comfortable for any sleeping position or body type and is cheaper than most competitors. A 10-inch Tuft and Needle Nod Hybrid mattress in a queen size will usually run you around $999, but can sometimes be found on sale for less. CNET Score Breakdown 7.3 /10 SCORE Performance 7 Policies 7 Durability 7 Features 8 Show our expert take Compare Show our expert take Photo Gallery 1/1 Save up to 50% off mattresses $1,329 at Amazon Pros Its medium-firm feel makes it ideal for back, stomach and combo sleepers Good for all body types Made with sustainably sourced and green materials Cons A little too firm for strict side sleepers It’s the most expensive bed on our list Type Latex hybrid mattressFirmness Medium-firm or 7Trial 365 nightsWarranty Lifetime warranty Full Review Awara Premier Review Best latex mattress on Amazon Awara Premier 8.1 Photo Gallery 1/1 Save up to 50% off mattresses $1,329 at Amazon Why we chose the Awara Premier: Latex mattresses are a hot commodity on Amazon, as a few of our picks are sold out or nearly so. The Awara Premier is the premium version of one of our personal favorites, the Awara 10-inch Hybrid. This one is 12 inches thick with 8-inch pocketed coils, four inches of latex foam and a natural wool and organic Euro-top. It looks and feels like a fancy mattress but has good value. Mattresses made with natural latex are hypoallergenic, antimicrobial and eco-friendly. Considering this and its strong hybrid construction, it could sell for over $1,650. A queen size goes for just under $1,400 on Amazon. CNET Score Breakdown 8.1 /10 SCORE Performance 7 Policies 9 Durability 8.5 Features 8 Show our expert take Compare Show our expert take Photo Gallery 1/1 $276 at Amazon Pros Multiple heights to choose from Two firmness-level options are available Cons Heavier sleepers may want to consider a more supportive hybrid mattress Shorter trial and warranty period than the other picks Type Memory foam mattressFirmness 2 firmness levels | medium-firm or 6-7 and plush or 4-5Trial 30 daysWarranty 1-year Most affordable mattress on Amazon Amazon Basics mattress 6.9 Photo Gallery 1/1 $276 at Amazon Why we chose the Amazon Basics mattress: Amazon couldn’t sell other brands' mattresses without jumping in for a piece of the pie. The result is the most affordable mattress on Amazon with the queen-size 8-inch bed retailing for only $277. It has a pressure-relieving memory foam top layer and is available in multiple firmness options. Although the mattress is topped with memory foam, you'll get more of a neutral foam feel when you lie on it. You're not going to sink very far into the memory foam like Nectar. You can also choose among multiple height options, but the 10-inch mattress offers a good balance between value and construction. The thicker the Amazon Basics bed, the more you’re going to pay. If you have a low budget and just want a good bed, we think this will be one of your best bets. CNET Score Breakdown 6.9 /10 SCORE Performance 7 Policies 6.5 Durability 6 Features 8 Show our expert take Compare Show our expert take Photo Gallery 1/1 $349 at Amazon Pros Multiple firmness levels to choose from Accommodating for all sleeping positions Cons Not ideal for people over 230 pounds in the long term Type Memory foam mattressFirmnes Medium-soft or 3Trial 30 nightsWarranty 10-year limited warranty Full Review Lucid 10-inch Gel Memory Foam Review Best memory foam mattress on Amazon Lucid 10-inch memory foam mattress (Update: Out of Stock) 7.6 Photo Gallery 1/1 $349 at Amazon Why we chose the Lucid Memory Foam mattress: The Lucid 10-inch memory foam mattress on Amazon checks boxes for people who like the dense, hugging feel of memory foam and want to pay a minimum price. It’s one of the cheaper picks on our list next to the AmazonBasics mattress.The primary comfort layer in this all-foam mattress is gel memory foam, which helps regulate temperature better than traditional memory foam. It also has a slow-responding feel that takes a few moments to respond to pressure and bounce back to normal. You get the slow, sinking feeling of memory foam with the Lucid mattress. Memory foam lovers of all sleeping positions can enjoy the Lucid 10-inch Memory Foam bed because it’s available in all firmness levels. CNET Score Breakdown 7.6 /10 SCORE Performance 8 Policies 7 Durability 7 Features 8.5 Show our expert take How we test mattresses CNET video producer Jon Gomez captures mattress expert Dillon Payne testing the edge support of a mattress. Aly Lopez/CNETCNET editors pick the products and services we write about based on editorial merit. When you buy through our links, we may get a commission. Firmness: Our team takes turns trying out the mattress and laying on top to determine if it’s soft, firm or somewhere in between. Firmness level is an important factor in choosing the best mattress for you. Feel: We get hands-on with our mattresses; we squish, squeeze and lay on the beds to get a feel for the materials inside. Memory foam makes a mattress slow-responding and pressure relieving, while coils or latex foam are bouncy. Durability: We typically analyze construction to get a sense of how durable a mattress is, since most of our beds don’t go through the type of wear and tear in our testing period that occurs over the eight-plus years you’ll be sleeping on it. Hybrid mattresses made with coils are more durable and long-lasting than foam beds. Body type: Heavier individuals should opt for a hybrid mattress because these types of beds offer more support and durability, especially in the long run. Sleeping position: We get really physical and flip around the mattresses, testing each sleeping position: side, back, stomach and combination. Wesley Ott/CNETMotion isolation: If you sleep with a partner you’ll want to consider this feature. We test motion isolation by placing a cup of water at the end of a bed and bouncing it around to test how well it absorbs motion. Edge support: We analyze a mattress's materials and physically lay on each edge of the mattress to get a feel for how well it'll keep us feeling sturdy. Show more What to look for in an Amazon mattress FirmnessThis is something you should consider when looking for any mattress. Side sleepers usually prefer a softer mattress that provides give and comfort underneath the hips and shoulders. Back and stomach sleepers will like a firmer mattress that provides back support. Body typeOur best mattresses on Amazon include a few hybrid picks, which are great for heavier sleepers or anyone looking for additional back support. Customer reviewsOne of the most important things you can do when choosing your next bed is read customer reviews. They will give you first-hand experiences of how the bed was delivered and how it feels.Mattress typeThere are several mattress types to choose from. Memory foam and hybrid constructions are the most popular, though latex and innerspring mattresses are also popular. Deciding what type of mattress you want will help narrow down your options and find your next bed faster.TrialWhen it comes to buying a bed online, you should consider the length of time you get to test your mattress "risk-free." It takes around 30 days for your body to become acclimated to a mattress, so some people need a longer trial period. WarrantyA bed’s warranty partly speaks to its durability and how long a brand is willing to back its product. In our experience, the most quality, long-lasting mattresses come with longer warranty periods. Show more Best mattresses on Amazon FAQ Does Amazon sell quality mattresses? Yes, Amazon carries several top-rated beds from popular name brands and even makes its own mattresses. While you won’t find a full catalog of brands, you can definitely find some good budget-friendly picks. What is the most highly recommended mattress on Amazon? We recommend the Nectar Premier Hybrid, along with a handful of other beds the CNET sleep editors have personally tested from Amazon. Can you return a mattress to Amazon? You can return most mattresses you buy on Amazon, but every bed has its own trial period. Be sure to read up on return and trial policies before buying a mattress on Amazon. Our Experts Written by McKenzie Dillon Our expert, award-winning staff selects the products we cover and rigorously researches and tests our top picks. If you buy through our links, we may get a commission. Reviews ethics statement How we test McKenzie Dillon Writer McKenzie, a Certified Sleep Science Coach and proclaimed mattress expert, has been writing sleep content in the wellness space for over four years. After earning her certification from the Spencer Institute and dedicating hundreds of hours to sleep research, she has extensive knowledge on the topic and how to improve your quality of rest. Having more experience with lying on mattresses than most, McKenzie has reviewed over 150 beds and a variety of different sleep products including pillows, mattress toppers and sheets. McKenzie has also been a guest on multiple radio shows including WGN Chicago as a sleep expert and contributed sleep advice to over 50 different websites. Expertise Certified Sleep Science Coach, Certified Stress Management Coach, Bachelor of English. See full bio vs Compare Back to selection The information contained in this article is for educational and informational purposes only and is not intended as health or medical advice. Always consult a physician or other qualified health provider regarding any questions you may have about a medical condition or health objectives. Mattress Buying Guides Type Best Mattress Best Air Mattress Best Adjustable Mattress Best Mattress in a Box Best Memory Foam Mattress People Best Mattress for Side Sleepers Best Mattress for Stomach Sleepers Best Mattress for Back Pain Best Mattress for Heavy Pe'''
