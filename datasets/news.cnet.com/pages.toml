title = "Best Desktop Computer for 2025: Top Picks for Macs and PCs - CNET"
description = "These are CNET editors’ top picks for best desktop computers, including both Macs and Windows PCs, plus advice on what you should look for in your next desktop."
full_description = "Jump to Section... Best Desktop Computer for 2025: Top Picks for Macs and PCs Tech Computing Article updated on March 1, 2025 at 9:54 AM PST Best Desktop Computer for 2025: Top Picks for Macs and PCs These are CNET editors’ top picks for best desktop computers, including both Macs and Windows PCs, plus advice on what you should look for in your next desktop. Desktop PCs still pass through the CNET Labs occasionally, but laptops occupy most of our editors' time and effort with CNET's hands-on reviews. Because we test far more laptops than desktops, some of our current desktop recommendations are based on previous versions that we tested and reviewed. We also have general PC configuration suggestions that we haven't specifically tested but are based on our experience with similarly configured computers. These guidelines should be helpful if you're looking for the best value when customizing a PC to order. Our Picks Best overall desktop Apple iMac M4 (2024) View details $1,299 at Best Buy View details Best desktop computer for working from home Dell XPS 8960 Desktop View details $1,400 at Best Buy View details Best mainstream gaming desktop Lenovo Legion Tower 7i Gen 8 View details $2,549 at Lenovo View details Best compact gaming PC Minisforum AtomMan G7 Ti View details $1,279 at Minisforum View details Best budget desktop computer Apple Mac Mini M4 (2024) View details $549 at Amazon View details Best highly customizable gaming PC Origin Genesis PC View details $5,611 at Origin View details Best mainstream Mac desktop Apple Mac Studio (2024) View details $1,999 at Best Buy View details Show 2 more What is the best desktop computer overall?The best desktop for most people is Apple's new M4-based iMac. It integrates the display and offers everything you could want in an all-in-one. For a reasonable sum, the iMac provides a fantastic design centered on a high-resolution, 24-inch display powered by Apple's new M4 processor. Performance from Apple's latest silicon is, without a doubt, impressive on all counts. If you need more screen space than you'd get with a laptop, the 24-inch iMac gives you added room on which to work and play. Yet, with its compact design and power cable that magnetically pops into place, the iMac is easy to relocate from room to room. The computer is also available in seven fun colors with accessories to match. If you're looking for a traditional tower desktop or a small-form-factor PC instead of an all-in-one like the iMac, then keep reading because we also have recommendations for those. We'll update this best desktop computer list periodically. Best desktop computers of 2025 Hide our expert take Photo Gallery 1/1 $1,299 at Best Buy Pros Elegant, compact design 16GB RAM is new minimum without price increase Nano-texture glass is effective in reducing glare and reflections Sweet-sounding six-speaker set Cons Standard 256GB SSD is insufficient Upgrades are pricey Misses out on Wi-Fi 7 Processor tested Apple M4 10-core CPUGraphics tested Apple M4 10-core GPUOperating system MacOS Full Review Read full review Best overall desktop Apple iMac M4 (2024) 8.6 Photo Gallery 1/1 $1,299 at Best Buy The 24-inch iMac is especially well-suited as a family computer or if you want something other than a laptop to easily move from room to room. It's small enough to squeeze into tighter spaces, like a kitchen nook, but big enough to spread out your work, kick back and stream a movie or do some casual gaming. With the recent update to Apple’s M4 processor, the iMac is a more capable machine, especially with its new minimum 16GB of RAM. It also supplies an improved Center Stage webcam. And if you plan to put it in a bright and sunny room, there’s an optional nano-texture glass option that reduces glare and reflections.The iMac starts at $1,299 for a configuration that features an M4 chip with an eight-core CPU and eight-core GPU along with a 16-core Neural Engine for running Apple Intelligence, the company's suite of AI features. It also includes Apple’s Magic Keyboard and Magic Mouse, which are now USB-C. An upgraded M4 chip with two more CPU cores and two more GPU cores is available, and you can also choose to expand the memory and SSD capacity. CNET Score Breakdown 8.6 /10 SCORE Design 9 Features 9 Performance 8 Hide our expert take Show our expert take Photo Gallery 1/1 $1,400 at Best Buy Pros Excellent gaming and office performance Tame looks Ample front I/O Quiet operation Cons Proprietary motherboard limits upgrade options No dust filtration Lackluster storage speeds for the price Processor tested Intel Core i7-14700KGraphics tested Nvidia GeForce RTX 4080 SuperOperating system Windows 11 Home Full Review Read full review Best desktop computer for working from home Dell XPS 8960 Desktop Photo Gallery 1/1 $1,400 at Best Buy Dell’s XPS 8960 is an Alienware in a business suit. Its tame looks let it blend in anywhere -- home office, den, guest room -- but has optional performance upgrades that allow it to run graphics tasks and games exceptionally well. The case's tight confines might seem like they'd choke its mighty components, but it runs demanding workloads and even 4K gaming, all without making too much noise or running into serious thermal throttling. If you're looking for a quiet, high-powered PC without the usual gaming PC flash, this XPS is that sleeper. Show our expert take Show our expert take Photo Gallery 1/1 $2,549 at Lenovo Pros Great 1080p and 4K performance Some quick and easy upgrade options Good looks and abundant lighting Quiet operation alongside sustained speeds Cons Lenovo's nebulous pricing leaves some uncertainty Could use more USB-C ports Limited dust filtration Processor tested Intel Core i9-14900KFGraphics tested Nvidia GeForce RTX 4080 SuperOperating system Windows 11 Home Full Review Read full review Best mainstream gaming desktop Lenovo Legion Tower 7i Gen 8 Photo Gallery 1/1 $2,549 at Lenovo While we like all-in-ones for their convenience, they're not easy to upgrade, if they can be at all. Gamers and other power users need a traditional tower PC for its upgradability. And while building your own PC can often be the most cost-effective way to get a powerful gaming PC, it comes with its own share of hurdles. Lenovo's Legion Tower 7i Gen 8 is a prebuilt system that offers a respectable array of powerful hardware packed in, wired up and cooled for only a small premium over what you'd pay if you tried to DIY. It’s an excellent gaming PC with both style and substance. Show our expert take Show our expert take Photo Gallery 1/1 $1,279 at Minisforum Pros Incredibly compact for a desktop Fast, sustainable performance Extra M.2 drive slot Cons GPU is a slower mobile version Costs as much as high-end laptops Underwhelming storage Processor tested Intel Core i9-14900HXGraphics tested Nvidia GeForce RTX 4070 (mobile)Operating system Windows 11 Home Full Review Read full review Best compact gaming PC Minisforum AtomMan G7 Ti Photo Gallery 1/1 $1,279 at Minisforum If you're looking for a powerful gaming system that takes up almost no space, the Minisforum AtomMan G7 Ti might just be it. This system packs powerful gaming laptop internals into an ultraslim tower PC form. Between its Intel HX-Series processor -- a desktop-class chip -- and its Nvidia RTX 4070 mobile GPU, it can keep up with office workloads and high frame-rate gaming. The CPU is properly fast, and the GPU does a decent job, though it slightly lags behind desktop RTX 4070 GPUs. Its clever, compact cooling system effectively keeps thermals in check. Show our expert take Show our expert take Photo Gallery 1/1 $549 at Amazon $599 at Best Buy $599 at Apple Pros Ultracompact design Strong performance Ample amount of ports Good starting price Supports up to 3 displays Cons M4 Pro more than doubles base price Potentially awkward power button placement Only 256GB SSD in base model Processor tested Apple M4 10-core CPUGraphics tested Apple M4 10-core GPUOperating system MacOS Full Review Read full review Best budget desktop computer Apple Mac Mini M4 (2024) 8.0 Photo Gallery 1/1 $549 at Amazon $599 at Best Buy $599 at Apple The Mac Mini desktop is one of Apple's longest-standing product lines, dating back to 2005 (in a pre-Intel version), a year before the first MacBook. And starting at $599, it remains the least expensive way to get a MacOS computer by a large margin. Unlike Apple's MacBook Pro and Air laptops, or the iMac desktop, the Mini is designed to work behind the scenes, fitting into small spaces and pairing with your choice of display and input devices.The surprising thing about the M4 Mac Mini isn't that Apple made it smaller; it's how much smaller it is than its M2-powered predecessor and how it can still have a more powerful M4 Pro chip in it and stay cool. The Mini can fit in your hand and be everything from an everyday home office computer to a full-on professional content-creation machine -- and an easily portable one at that -- with support for up to three 6K-resolution displays. CNET Score Breakdown 8.0 /10 SCORE Design 9 Features 7 Performance 8 Show our expert take Show our expert take Photo Gallery 1/1 $5,611 at Origin Pros Well designed Corsair case options Lots of configuration choices Cons Fan profile has them spinning up and down too frequently You have to watch your initial configuration for upgradeability Processor tested Intel Core i9-12900KGraphics tested Nvidia GeForce RTX 3080 TiOperating system Windows 11 Home Full Review Read full review Best highly customizable gaming PC Origin Genesis PC 8.2 Photo Gallery 1/1 $5,611 at Origin If you're dissatisfied with the lack of configuration options available for prebuilt gaming desktops, going with a custom builder is the best way to sate your appetite. The cost of a custom-configured system that's fully decked out might be too costly for PC users. Many people don't need everything maxed out, even for gaming, but you can get reasonable configurations for about half the price of the $5,000-plus system we tested.Origin PC builds good, solid systems. Unless you're looking for something dirt cheap, you'll be able to put together something you like at a price you can tolerate. Origin's Neuron series starts at around $2,000, and the high-end Genesis line begins at roughly double that. A pre-configured Origin Genesis 5000D, for example, costs $5,611 and features a Core i9-14900K, 64GB of RAM and GeForce RTX 4090 graphics. CNET Score Breakdown 8.2 /10 SCORE Design 9 Features 8 Performance 8 Show our expert take Show our expert take Photo Gallery 1/1 $1,999 at Best Buy Pros Fast and quiet Relatively compact HDMI 2.1 Cons M2 Max model has two fewer Thunderbolt connections than the M2 Ultra Processor tested Apple M2 Max 12-core CPUGraphics tested Apple M2 Max 38-core GPUOperating system MacOS Full Review Read full review Best mainstream Mac desktop Apple Mac Studio (2024) 8.2 Photo Gallery 1/1 $1,999 at Best Buy The Mac Pro has long been the top dog in Apple's computer lineup but starts at a whopping $6,999. By comparison, the mainstream Mac Studio is far more affordable, starting at a reasonable $1,999. The baseline Mac Studio model features Apple's M2 Max processor, 32GB of RAM and a 512GB SSD. The step-up $3,999 model bumps you up to the more powerful M2 Ultra chip while doubling the RAM and SSD capacity. Either model is essentially a Mac Mini on steroids, and for anyone who doesn't want to shell out for a Mac Pro, it's a great pick for running creative-centric Mac apps, including animation, graphics, video-editing and audio-editing software. Be aware, however, that the Mac Studio is expected to get an M4 update sometime next year. CNET Score Breakdown 8.2 /10 SCORE Design 8.5 Features 8 Performance 8 Show our expert take How we test desktops The review process for desktops consists of two parts: performance testing under controlled conditions in the CNET Labs and extensive hands-on use by our reviewers. This includes evaluating a device's aesthetics, ergonomics and features with respect to price. A final review verdict is a combination of both objective and subjective judgments. We test all desktops with a core set of benchmarks, including Primate Labs Geekbench 5 and 6, Cinebench R23, PCMark 10, a variety of 3DMark benchmarks (whichever can run on the desktop), UL Procyon Photo and Video (where supported), and our own battery life test. If a desktop is intended for gaming, we'll also run benchmarks from Guardians of the Galaxy, The Rift Breaker (CPU and GPU) and Shadow of the Tomb Raider.For the hands-on, the reviewer uses it for their work during the review period, evaluating how well the design, features (such as the screen, camera and speakers) and manufacturer-supplied software operate as a cohesive whole. We also place importance on how well they work given their cost and where the manufacturer has potentially made upgrades or tradeoffs for its price.The list of benchmarking software and comparison criteria we use changes over time as the devices we test evolve. You can find a more detailed description of our test methodology on our page on how we test computers. Show more Factors to consider when buying a desktop computer PriceYou can find a good PC tower from brands like Acer, Asus, Dell or HP for between $500 and $600 that will prove useful for years for general use. The specs we'd suggest for a basic Windows 11 machine:Intel Core i5 (13th- or 14th-gen) or AMD Ryzen 5 (6000, 7000 or 8000 series)Default integrated graphics (such as Intel UHD or Iris or baseline AMD Radeon)16GB of RAM or more 512GB or larger NVMe SSD driveFour or more USB 3.1 or 3.2 ports with USB-C and USB-A formats (at least one or two on the front)Wi-Fi and Bluetooth wirelessAt least one PCI-E (x16) expansion slot (for adding a video card)Do you want to do some PC gaming, or do you spend time editing photos or videos? You'll want to level up the configuration with more RAM and better graphics options. Expect price points to be between $800 and $1,200 (or even higher) if you go for a more bleeding-edge video card.Nvidia RTX or AMD Radeon RX graphics card (GPU)16GB of RAM or more450-watt (or more) power supplyOperating systemMicrosoft Windows and Apple's MacOS do basically the same things, but they do them differently. Unless there's an OS-specific application you need, go with the one you feel most comfortable using. Most desktops run Microsoft Windows while Apple's iMac, Mac Mini, Mac Studio and Mac Pro desktops feature Apple's MacOS. There is also the odd Chromebox offering based on Google's ChromeOS. A Chromebox is easier to use and usually cheaper than a Windows PC or Mac but can't run Windows or Mac software.ProcessorThe processor, aka the CPU, is the brain of a desktop. Intel and AMD are the main CPU makers for Windows desktops. Both offer a staggering selection of processors. You can head to Intel's or AMD's sites for explanations so you get the performance you want. Intel's current lineup "
