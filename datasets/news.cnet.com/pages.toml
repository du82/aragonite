full_description = '''Tech Gaming Today's NYT Connections: Sports Edition Hints and Answers for March 2, #160 Hints and answers for the NYT Connections: Sports Edition puzzle, No. 160, for March 2. Gael Cooper CNET editor Gael Fashingbauer Cooper, a journalist and pop-culture junkie, is co-author of "Whatever Happened to Pudding Pops? The Lost Toys, Tastes and Trends of the '70s and '80s," as well as "The Totally Sweet '90s." She's been a journalist since 1989, working at Mpls.St.Paul Magazine, Twin Cities Sidewalk, the Minneapolis Star Tribune, and NBC News Digital. She's Gen X in birthdate, word and deed. If Marathon candy bars ever come back, she'll be first in line. Expertise Breaking news, entertainment, lifestyle, travel, food, shopping and deals, product reviews, money and finance, video games, pets, history, books, technology history, and generational studies Credentials Co-author of two Gen X pop-culture encyclopedia for Penguin Books. Won "Headline Writer of the Year"​ award for 2017, 2014 and 2013 from the American Copy Editors Society. Won first place in headline writing from the 2013 Society for Features Journalism. See full bio Gael Cooper March 1, 2025 1:00 p.m. PT 2 min read Here are the answers for Connections: Sports Edition. James Martin/CNET Looking for the most recent regular Connections answers? Click here for today's Connections hints, as well as our daily answers and hints for The New York Times Mini Crossword, Wordle and Strands puzzles.Lights, camera, sports action! Connections: Sports Edition pays tribute to Sunday's Oscars with a sports movie-themed puzzle. Read on for hints and the answers.Connections: Sports Edition is out of beta now, making its debut on Super Bowl Sunday, Feb. 9. That's a sign that the game has earned enough loyal players that The Athletic, the subscription-based sports journalism site owned by the Times, will continue to publish it. It doesn't show up in the NYT Games app but now appears in The Athletic's own app. Or