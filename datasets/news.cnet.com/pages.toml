title = "Forget the $599 iPhone 16E: Samsung's New Galaxy A Phones Are Truly Affordable - CNET"
description = "The Galaxy A36, A26 and A56 get display and camera upgrades and six years of OS and security updates that should help you stretch your dollar even further."
full_description = '''Tech Mobile Forget the $599 iPhone 16E: Samsung's New Galaxy A Phones Are Truly Affordable The Galaxy A36, A26 and A56 get display and camera upgrades and six years of OS and security updates that should help you stretch your dollar even further. Abrar Al-Heeti Technology Reporter Abrar Al-Heeti is a technology reporter for CNET, with an interest in phones, streaming, autonomous cars, internet trends, entertainment, pop culture and digital accessibility. She's also worked for CNET's video, culture and news teams. She graduated with bachelor's and master's degrees in journalism from the University of Illinois at Urbana-Champaign. Though Illinois is home, she now loves San Francisco -- steep inclines and all. Expertise Abrar has spent her career at CNET analyzing tech trends while also writing news, reviews and commentaries across mobile, streaming and online culture. Credentials Named a Tech Media Trailblazer by the Consumer Technology Association in 2019, a winner of SPJ NorCal's Excellence in Journalism Awards in 2022 and has three times been a finalist in the LA Press Club's National Arts & Entertainment Journalism Awards. See full bio Abrar Al-Heeti March 1, 2025 3:00 p.m. PT 5 min read For 2025, the Galaxy A series has three models: the Galaxy A36 (left), the Galaxy A26 (right) and the Galaxy A56 (not pictured). Samsung Samsung has debuted its latest midrange phones, the Galaxy A36 and A26, which have larger displays, more powerful processors and, inevitably, new AI features. The phones cost $400 and $300, respectively, and go on sale in late March.The company also unveiled the Galaxy A56 phone, priced at $500, which will be available later this year. The A56 has a bigger display than last year's Galaxy A55, new AI capabilities and camera improvements, Samsung says. Arriving on the heels of the $599 iPhone 16E, Apple's idea of an affordable phone that's far from cheap, all three new Samsung Galaxy A phones seem to prove a phone-maker can still make a device that's truly affordable and flexes new features like Android 15 and One UI 7. All the phones are built to last, with six years of OS and security updates, Samsung's Knox Vault for device security and privacy, and an IP67 rating for dust and water resistance. Samsung's announcement comes just ahead of Mobile World Congress in Barcelona. Here's everything to know about the Galaxy A36, A26 and A56. Samsung Galaxy A36: $400 The Galaxy A36 5G costs $400. SamsungAt 8.2mm thick and 196 grams, the Galaxy A36 5G is thinner and lighter than last year's A35 5G, which was 7.4mm thick and weighed 209 grams. Like last year, the phone packs a 5,000 mAh battery, but now features 45-watt super fast charging, which Samsung says can charge the phone nearly 70% in 30 minutes. (CNET will test this once we check out the devices ourselves, so stay tuned.)Thinner bezels bump the display to 6.7 inches, compared to the A35's 6.6 inches. The A36 features a 120Hz refresh rate, and an increased peak brightness of 1,900 nits, ideally making it easier to see the screen even if you're in a brightly lit environment. Both the front and back feature Corning's Gorilla Glass Victus Plus, which Samsung says improves durability. The company says they're all "FHD+" resolution, which usually means 2,220x1,080 pixels.Cameras get an upgrade, too, with support for HDR video recording on the 50-megapixel main camera. Like last year's phone, the A36 also features an 8-megapixel ultrawide and 5-megapixel macro camera. The front camera goes from 13 to 12 megapixels, but supports 10-bit HDR video recording. It's worth noting that more megapixels doesn't automatically mean a better camera.HDR support can help images and videos have a wider dynamic range (the difference between the brightest parts of an image and the darkest parts) and look more detailed and colorful. For nighttime shots, Samsung says larger pixels serve up sharper, more vibrant images with minimal noise, even in extremely low light -- larger pixels can gather more light and have less image noise. Stay tuned to CNET's tests to see how the camera performs. The Galaxy A36 5G runs Android 15 and OneUi 7. SamsungYou'll find AI features on the A36 like Google's Circle to Search, which can now also translate on-screen text and identify music. Samsung debuted these new capabilities on its flagship Galaxy S25 lineup in January. AI-powered photo editing tools include an enhanced Object Eraser that now lets you select multiple objects to be removed, and a Filter feature that lets you create a custom filter based on any photo. For example, if you have a shot of a sunset and you like the tone of the image, you can apply that filter to other photos, too. Edit Suggestion will use AI to analyze an image and serve up recommendations to improve it, like removing shadows or reflections. The A36 is powered by Qualcomm's Snapdragon 6 Gen 3 processor, versus the Exynos 1380 featured on the Galaxy A35. It comes with 6GB of RAM and 128GB of storage. Samsung says there's also a larger cooling system to better dissipate heat and optimize for gameplay and streaming. The Galaxy A36 will be available on March 26 in black and lavender. An exclusive lime version is also available through Best Buy. Read more: Best Android Phone for 2025Samsung Galaxy A26: $300 The Galaxy A26 5H costs $300. SamsungThe (even cheaper) Galaxy S26 is also thinner than its predecessor, measuring at 7.7mm compared to the Galaxy A25's 8.3mm. It also gets a bigger FHD+ display, thanks to reduced bezels, matching the A36's 6.5 inches. It shares a 120Hz refresh rate. While last year's A25 featured a glass front and plastic back, the A26 steps things up with Gorilla Glass Victus Plus on both the front and back, just like the A36. The frame remains plastic. Like last year's model, the A26 features a 50-megapixel wide-angle camera, 8-megapixel ultrawide camera and 2-megapixel macro camera, as well as a 13-megapixel selfie camera. The Galaxy A26 5G is the cheapest of the three new A series phones from Samsung. SamsungDespite the lower price, you'll still get AI features like Photo Edit Suggestion and Object Eraser, as well as Circle to Search. The A26 runs the Exynos 1380 chipset, and comes with 6GB of RAM and 128GB of storage. It also has expandable memory up to 2TB, and packs a 5,000 mAh battery. The A26 will become available March 28, and is only available in black. Read more: These Are the Best Camera Phones for 2025Samsung Galaxy A56: $500To complete the trio, the Galaxy A56 has a 6.7-inch display and a 5,000 mAh battery, which, like the A36, supports 45-watt charging. The A56 is powered by the Exynos 1580 chipset and also has a larger vapor chamber to help you play games and watch videos for longer.The A56 has a 50-megapixel wide camera, a 12-megapixel ultrawide camera and a 5-megapixel macro camera. The selfie camera has a 12-megapixel sensor compared to the Galaxy A55's 32-megapixel front-facing camera, which took either 12- or 8-megapixel images after pixel binning. The selfie camera also gets 10-bit HDR support, and a Low Noise Mode helps to take sharper low-light photos, Samsung says. A feature only available on the A56 is called Best Face, which can help you nail a group photo by choosing the best expressions on up to five people and then combining them into one image. This is similar -- in name and in execution -- to Google's Best Take feature on the Pixel series. The A56 also gets an enhanced Object Eraser and Filter capabilities. Samsung hasn't yet shared color options for the A56, and has only said it'll be available later this year. Samsung Galaxy A56, A36 and A26 specs Samsung Galaxy A56 5GSamsung Galaxy A36 5GSamsung Galaxy A26 5G Display size, tech, resolution, refresh rate 6.7-inch AMOLED; FHD+; 120Hz refresh rate6.7-inch AMOLED; FHD+; 120Hz refresh rate6.7-inch AMOLED; FHD+; 120Hz refresh ratePixel density TBDTBDTBDDimensions (inches) 6.39 x 3.05 x 0.29 in6.41 x 3.08 x 0.29 in6.46 x 3.05 x 0.3o inDimensions (millimeters) 162.2 x 77.5 x 7.4 mm162.9 x 78.2 x 7.4 mm164 x 77.5 x 7.7 mmWeight (grams, ounces) 198g (6.94 oz.)195g (6.89 oz.)200g (7.05 oz.)Mobile software Android 15Android 15Android 15Camera 50-megapixel (wide), 12-megapixel (ultrawide), 5-megapixel (macro)50-megapixel (wide), 8-megapixel (ultrawide), 5-megapixel (macro)50-megapixel (wide), 8-megapixel (ultrawide), 2-megapixel (macro)Front-facing camera 12-megapixel12-megapixel13-megapixelVideo capture TBDTBDTBDProcessor Exynos 1580Snapdragon 6 Gen 3Exynos 1380RAM + storage 8GB + 128GB6GB + 128GB6GB + 128GBExpandable storage NoneNoneNoneBattery 5,000 mAh5,000 mAh5,000 mAhFingerprint sensor TBDTBDTBDConnector USB-CUSB-CUSB-CHeadphone jack NoneNoneNoneSpecial features Galaxy AI, OneUI 7, Circle To Search, Best Face, Object Eraser, 6 generations of Andoid OS, 6 years of software and security support, IP67 water and dust resistance, 10-bit HDR recording, 1,200 nits peak brightnessGalaxy AI, OneUI 7, Circle To Search, Object Eraser, 6 generations of Andoid OS, 6 years of software and security support, IP67 water and dust resistance, 10-bit HDR recording, 1,900 nits peak brightness, Gorilla Glass Victus PlusGalaxy AI, OneUI 7, Circle To Search, Object Eraser, 6 generations of Android OS, 6 years of software and security support, IP67 water and dust resistance, 10-bit HDR recording, Gorilla Glass Victus PlusUS price starts at $500 (128GB)$400 (128GB)$300 (128GB)UK price starts at Converts to £400Converts to £320Converts to £240Australia price starts at Converts to AU$805Converts to AU$645Converts to AU$485 Mobile Guides Phones Best iPhone Best Galaxy S24 Deals Best Phone Best iPhone Deals Samsung Galaxy S24 Review Best Android Phones Best Samsung Galaxy Phone Pixel 8 Pro Review iPhone 15 Pro/Pro Max Review Best iPhone 15 Deals Foldable Phones Best Foldable Phones Galaxy Z Fold 5 Review OnePlus Open Review Best Galaxy Z Flip Deals Headphones Best Wireless Earbuds Best Noise Canceling Headphones Best Head