["https://news.cnet.com/personal-finance/credit-cards/features/maxed-out-inside-americas-credit-card-debt-crisis-and-what-we-do-next"]
title = "Maxed Out: Inside America's $1.14 Trillion Credit Card Debt Crisis - CNET"
description = "A complex web of policy, psychology and profit has consumers staring down record-high balances. Five everyday borrowers shared how they got here."
full_description = '''Zooey Liao/CNET Maxed Out: Inside America's $1.14 Trillion Credit Card Debt Crisis A complex web of policy, psychology and profit has consumers staring down record-high balances. Five everyday borrowers shared how they got here. Nick Wolny Managing Editor A classically trained French hornist by education, Nick Wolny is a managing editor at CNET, where he oversees the CNET Voices program and branded content division. He is also the finance columnist for Out magazine and a frequent television correspondent. Nick has previously written for Fast Company, Business Insider, Fortune, Entrepreneur magazine and The Advocate on LGBTQ+ economic topics, and is working on his first book, Money Proud, which is scheduled to release with HarperCollins in 2026. A rural Illinois boy at heart, he's now based in Los Angeles. Expertise Consumer spending | Consumer tech | Personal finance | Financial independence (FI) movement | LGBTQ+ equity Credentials He was named a "40 under 40" by the Houston Business Journal in 2021. See full bio Nick Wolny Aug. 7, 2024 12:56 p.m. PT 16 min read As soon as Josué Henriquez turned 18, he applied for a credit card. He wanted to start building his credit so he could one day finance the purchase of a car or home. "I was told it was the only way I could start my credit in this country," he says, having relocated to the US from El Salvador as a child.His credit card limit was low at just $500, with a requirement to keep $250 in a savings account at all times. But over the next decade, as more offers rolled in, both his credit limits and balances ratcheted up. Henriquez's credit card bills ballooned to over $25,000, and he eventually sought out a debt settlement company for help."I had five credit cards at the time. Now I only have two," he tells me. The rest were shut down as part of his debt management plan, which ravaged his credit report. Now 33, the San Francisco resident eventually got his high-interest debt down to zero by following a four-year payment plan.Many of us are headed in the opposite direction. Credit card debt in America continues to break records. After a brief payoff period during COVID-19 lockdown powered mainly by stimulus checks, our collective overall credit card bill became a 13-digit number last year, and now sits at $1.14 trillion according to the most recent Household Debt and Credit report from the Federal Reserve Bank of New York's Center for Microeconomic Data. Consumers typically make larger credit card payments in the first quarter, but both this year and last year the quarter-over-quarter balance remained nearly flat.What's more alarming is that the cost of carrying this debt has also increased. Credit card APRs went up 30% in an 18-month period to the highest interest rate we've ever seen, rendering monthly payments less productive and eating away at consumers' budgets more than ever before. Credit card debt is just one type of debt we face in our lifetimes, along with mortgages, car loans, student loans and medical debt. But the credit card is uniquely powerful. It's comparatively easy to obtain, aggressively marketed and leaves a lasting mark on your credit report, the financial reputation marker that determines your credit score and eligibility to fund future milestone purchases at reasonable interest rates. Credit cards are "easy," says LendingClub Chief Customer Officer Mark Elliot, and that's part of the problem."Credit cards are wonderful from a convenience perspective, but if you use them as a loan, you really need to know how to manage them," Elliot says. "Unfortunately, consumers are still not at a place where they're really using them as wisely as we would like to see."The way we use a credit card often reflects the learned behaviors and financial education we've internalized throughout our lives, and advertisers like to exploit this sometimes-irrational psychology. Using a credit card has never been easier, as digital wallets now let us make certain purchases with a single click, tap or scan. E-commerce has also accelerated new financing iterations like "buy now, pay later," a credit card döppelganger that gives us yet another way to trick our brains by separating the act of buying from the act of paying. One Harris poll found that 43% of BNPL users were behind on payments and that a third of respondents had over $1,000 in outstanding BNPL loans.Then there are the vibes. A credit card isn't necessarily bad, especially if you pay off your balance every month, and the perks and points are sexy. But the credit card debt is uncomfortable to talk about; it feels shameful and taboo. "How we got into this mess is the discomfort around confronting what credit card debt is and how to get rid of it," says Nikki Macdonald, a certified financial planner at Northwestern Mutual. In this article: Why we rack up credit card bills to feel better Credit card balances have become our emergency funds Credit card math is hard to grasp Your minimum payment is really profitable for lenders You can't opt out of the credit card machine How to navigate the credit card debt crunch Credit can be a helpful tool in hard times, but it can also be quietly destructive. As I spoke with borrowers, financial experts and scholars on the topic, it became clear that behind our fantastic plastic is a powerful system that has become increasingly deregulated and exploitative, making it harder to escape the debt machine.These are the stories of those systems, the people navigating them and what we can do to better secure our financial future."How we got into this mess is the discomfort around confronting what credit card debt is and how to get rid of it." Nikki Macdonald, certified financial planner, Northwestern Mutual Why we rack up credit card bills to feel betterFor Carmen Cusido, a 40-year-old public relations professional based in New Jersey, spending was a way to navigate grief. "My mom died April 28, 2019, and my dad died on August 22, 2020," she tells me. "At that point, I was like, 'Oh my God, I'm completely alone in the world.'" She invested in therapy to support her mental health, and traveled to four new countries. "I would always find deals. I didn't think I was spending that much money," she says. Carmen Cusido Photo courtesy of Carmen Cusido. Illustration by Zooey Liao/CNETAt the start of 2023, Cusido took out a $13,000 debt consolidation loan to streamline her credit card balances into one monthly payment. But instead of her total debt burden going down, it's gone up."I've had a lot of heartbreak," she says. She broke off an engagement last spring and booked a trip to Greece to get away from it all, blowing the budget. Upon reflection, Cusido noted how previous experiences had shaped some of her money behaviors. "I've had unhealthy relationships in the past. One boyfriend I had early on in life told me my teeth are crooked, so I got braces again. Then a different boyfriend told me my clothes were drab. Now I have two and a half closets' worth of clothes." She says her current goal is to have half her loan debt paid down over the next six months.The people you care about can leave both positive and negative lasting impressions on you, and how you spend money may be directly tied to the experiences you've had in your relationships, says Traci Williams, a board-certified psychologist and certified financial therapist. "The pain of your experience lingers if it isn't addressed, and spending money is one way you might try to soothe that pain," she tells me.The psychology of retail therapyWhen we're stressed or sad, we want something that will make us feel better. We've come up with a pet name for this fix: retail therapy. There are two psychological feedback loops at work in retail therapy, and both of them are easy to reinforce.The first is that the mere anticipation of using a credit card for a purchase activates the reward network in our brain, according to a 2021 study published in Scientific Reports. Researchers did brain scans of subjects as they considered buying Xbox controllers. What they found was a strong "step on the gas" correlation; the opportunity to pay with a credit card-powered repayment plan was exciting and anticipatory for the brain, releasing dopamine. In this way, the neurochemistry behind using a credit card is similar to that of amphetamines."Overspending can serve as a coping skill. It's an unhealthy coping skill with potentially long-lasting negative consequences, but a way to cope nonetheless," Williams says. "I would always find deals. I didn't think I was spending that much money." Carmen Cusido A second feedback loop in retail therapy is the omnipresence of targeted advertising. We buy what we are told will make us happy, healthy, thin and rich. This was not always the case.By the early 20th century, most Americans had the basic necessities in life, and consumerism became increasingly necessary to prop up capitalism and supply chains. Corporations became more intentional about the long game of shaping the thoughts of the typical consumer through advertising. They swirled together product features with desire, like when cigarettes were marketed to women as a way to remain thin. Today's car commercials are a classic example of these nuanced marketing techniques. People became interested in buying things not only for utility, but also to align with a status or image that was reinforced to them by retailers.One way this targeted advertising shapes our perception is through sheer repetition. Those damn display ads follow you around for a reason: The more we see something, the more familiar it feels, and humans are drawn to familiarity. In psychology, this is known as the mere-exposure effect. "It can be helpful to remind yourself that a company's goal is to get you to spend," Williams says. Carmen Cusido, 40, during a trip to Monaco. She traveled more after her parents died in 2019 and 2020 as a way to navigate grief. Photo courtesy of Carmen Cusido. Illustration by Zooey Liao/CNETCredit card issuers use these same targeted advertising techniques and were innovators for doing so. As a result, the credit card market matured in the US more rapidly than in other countries, says Josh Lauer, associate professor of communications at the University of New Hampshire and author of the book Creditworthy: A History of Consumer Surveillance and Financial Identity in America."An element of sophistication in this credit card industry was producing applicants using credit profiles to make guesses about who should be targeted for a promotion," Lauer tells me. Retail therapy reinforces behavioral patterns. Credit cards add an extra dopamine hit, and advertisers aim to exploit this brain chemistry however they can.Credit card balances have become our emergency funds Ian Group Photo courtesy of Ian Group. Illustration by Zooey Liao/CNETAbout 55% of Americans live paycheck to paycheck, 36% have more credit card debt than emergency savings and 22% have no emergency fund at all. Many people lean into credit cards for emergency expenses not because they want to, but because they have to.When you need extra cash for an emergency and don't have it, credit cards and personal loans are the fastest way to cover unexpected costs. Ian Group, a current personal finance creator and former lawyer, found this out the hard way."I figured I would come out of law school, make a lot of money and the loans wouldn't be a big deal," he tells me. Although he graduated at the top of his class, he also had $190,000 in student loans, and could only land a clerkship with a $50,000 salary. This left little wiggle room for emergencies, let alone making full loan payments."Things just came up, which I think resonates with a lot of people who are in credit card debt," he says. Since all his monthly income went toward living expenses, setbacks like car troubles were financed with a swipe, and Group soon racked up $20,000 in credit card debt. He also took a forbearance on his student loans during his clerkship, which paused his payments, but interest kept accruing. His student loan debt grew faster, reaching $210,000 at its peak."I felt really sick when I saw that," he says. "I should have paid more attention, because those decisions had a big ripple effect on my future."The inertia of building up an emergency fundEmergency funds are a challenge for millions because income has stagnated in comparison to both rising worker productivity and the rising cost of goods. From 1979 to 2013, hourly pay for middle-wage workers increased 6% and pay for low-wage workers decreased 5%, whereas pay for very high-wage workers increased 41%, according to the Economic Policy Institute, a nonprofit think tank. "I really should have paid more attention, because those [spending] decisions had a big ripple effect on my future." Ian Group If we don't have much in savings, we're more likely to lean into credit cards and carry higher-interest balances when budgets are strained. Current credit card provider APRs make this strategy more treacherous. When inflation hit a 40-year high in 2022, the Federal Reserve stepped in to try to slow down the economy. The central bank raised rates 11 times, driving up the cost of borrowing. Anytime the Fed raises rates, a credit card provider will typically raise interest rates on their credit card products, too. Average APRs have spiked to over 20%, a 30% increase over the last year and a half, with retail card APRs at nearly 29%, and revolving credit card interest is the dominant profit driver for banks and lenders.For those who choose higher education, an additional financial hurdle looms. From 2000 to 2020, average post-secondary tuition costs outpaced wage growth by 111.4%, according to the Education Data Initiative, and students now borrow an average of $30,000 for a bachelor's degree. Average student loan debt has tripled since 2007. Debt burdens have become so mainstream that some employers are adjusting their benefits packages to allow workers to substitute a student loan payment stipend for their 401(k) match, an alternative that leaves workers perilously behind on saving for retirement. Ian Group, 38, pictured here in New York City. After he graduated law school with $190,000 in student loans, his initial clerkship salary left no wiggle room to save. When emergencies came up, he paid for them with a credit card, accumulating an additional $20,000 in credit card debt. Photo courtesy of Ian Group. Illustration by Zooey Liao/CNETGeneration Z, the population segment born between 1996 and 2010, is already feeling the credit card inertia that often comes from having low cash reserves. An FRBNY report found that 1 in 7 Gen Z credit cardholders is already maxed out; this is partially because younger borrowers typically have lower credit limits. The median credit limit for Gen Z borrowers was $4,500, compared to at least $16,000 for older generations.Today's young people also adopt credit cards mor'''
