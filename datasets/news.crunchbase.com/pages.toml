title = "Asia Funding Limps Along, Hits Lowest Level Since 2015"
description = "Despite venture funding starting to pick up globally, Asia funding can’t seem to get on board. The region suffered its worst quarter for venture funding since the final quarter of 2015, with Asia-based startups raising only $14.6 billion — a 32% dropoff year to year."
full_description = '''Artificial intelligence • Funding reports • Regional • Venture Asia Funding Limps Along, Hits Lowest Level Since 2015 Chris MetinkoJuly 11, 2024 <img alt='' src='https://secure.gravatar.com/avatar/1e814790d509621a16d3da36575b8ff0?s=112&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/1e814790d509621a16d3da36575b8ff0?s=224&#038;d=mm&#038;r=g 2x' class='avatar avatar-112 photo' height='112' width='112' decoding='async'/> Chris Metinko 10 Shares Email Facebook Twitter LinkedIn Despite a slight resurgence across the global venture funding landscape, Asia seems to be left behind. The region suffered its worst quarter for venture funding since the final quarter of 2015, with Asia-based startups raising only $14.6 billion — a 24% decline from Q1 and a 32% dropoff year to year. !function(e,n,i,s){var d="InfogramEmbeds";var o=e.getElementsByTagName(n)[0];if(window[d]&&window[d].initialized)window[d].process&&window[d].process();else if(!e.getElementById(i)){var r=e.createElement(n);r.async=1,r.id=i,r.src=s,o.parentNode.insertBefore(r,o)}}(document,"script","infogram-async","https://e.infogram.com/js/dist/embed-loader-min.js"); In addition, deal volume in the region continues to decline, with only 1,511 funding deals announced in Q2. That number represents a 15% drop from Q1 and a more pronounced 27% fall from Q2 last year. !function(e,n,i,s){var d="InfogramEmbeds";var o=e.getElementsByTagName(n)[0];if(window[d]&&window[d].initialized)window[d].process&&window[d].process();else if(!e.getElementById(i)){var r=e.createElement(n);r.async=1,r.id=i,r.src=s,o.parentNode.insertBefore(r,o)}}(document,"script","infogram-async","https://e.infogram.com/js/dist/embed-loader-min.js"); Late-stage rounds continue to slide Of course, what really moves the needle are the late-stage growth rounds. However, growth rounds in Asia totaled only $14.6 billion — the lowest in a quarter since 2019. That number represents a steep decline of 24% from Q1 and an even bigger 32% dip from Q2 2023. !function(e,n,i,s){var d="InfogramEmbeds";var o=e.getElementsByTagName(n)[0];if(window[d]&&window[d].initialized)window[d].process&&window[d].process();else if(!e.getElementById(i)){var r=e.createElement(n);r.async=1,r.id=i,r.src=s,o.parentNode.insertBefore(r,o)}}(document,"script","infogram-async","https://e.infogram.com/js/dist/embed-loader-min.js"); Unlike other regions that saw billion-dollar rounds, Asia was left out of the big-money craze, although there were a handful of deals in the quarter worth more than a half-billion dollars: China-based Hozon, an electric-vehicle startup, locked up a $690 million venture funding round. Indian grocery delivery startup Zepto raised a $665 million round, doubling its valuation to $3.6 billion. China-based Unisoc, a semiconductor company focused on chipsets in mobile communications and IoT, raised a round worth approximately $552 million. Dealmaking volume also fell, with only 134 late-stage growth rounds in Q2. That’s a 21% drop from Q1 and a 14% decline year to year. Early-stage funding suffers While any type of significant decline in venture is almost always directly attributable to late-stage funding, there also was an eye-catching fall in early-stage dealmaking. Early-stage dollar volume fell to only $4.9 billion — a staggering 53% decline from the first quarter and a 39% dive year to year. !function(e,n,i,s){var d="InfogramEmbeds";var o=e.getElementsByTagName(n)[0];if(window[d]&&window[d].initialized)window[d].process&&window[d].process();else if(!e.getElementById(i)){var r=e.createElement(n);r.async=1,r.id=i,r.src=s,o.parentNode.insertBefore(r,o)}}(document,"script","infogram-async","https://e.infogram.com/js/dist/embed-loader-min.js"); Dealmaking volume diminished only slightly, with 539 rounds being announced in Q2. That number reflects declines of only 7% from Q1 and 16% from Q2 of last year. Seed does not sprout To be honest, with the above numbers looking like they do, seed and angel funding certainly weren’t going to save the region’s venture funding totals. While such rounds may produce interesting deals, they are not big money. Angel and seed actually were up slightly both quarter to quarter and year to year, totaling $1.9 billion — slightly above Q1’s $1.7 billion. !function(e,n,i,s){var d="InfogramEmbeds";var o=e.getElementsByTagName(n)[0];if(window[d]&&window[d].initialized)window[d].process&&window[d].process();else if(!e.getElementById(i)){var r=e.createElement(n);r.async=1,r.id=i,r.src=s,o.parentNode.insertBefore(r,o)}}(document,"script","infogram-async","https://e.infogram.com/js/dist/embed-loader-min.js"); However, deal flow shrank to only 834 deals — a 19% drop from Q1 and a 34% decline from Q2 2023. In fact, it’s the lowest amount of seed and angel deals in at least a few years. Decline by country This region is dominated by one player: the Red Dragon. That dragon did not breath fire this past quarter, as venture funding in China plummeted. Venture funding in the country hit only $6.9 billion — down an eye-popping 46% from Q1 and 33% from Q2 2023. India, by far the region’s second-largest venture market, saw $3.4 billion of funding. That represents a 27% uptick from Q1, but a 9% drop from Q2 last year. What it means The shrinking of the venture market through the last handful of quarters is shocking. While everyone knew 2021’s high could not be sustained, it seemed inevitable the drop in dollar volume would subside. However, despite a brief respite in the middle of last year, the market has continued in reverse and seems to be entering back to where it was a decade ago. Even AI — the latest craze among all venture capitalists today — could not save the Asian venture market. AI-related startups in the region raised only about $2.5 billion, per Crunchbase data. That’s a pittance when compared to North American AI-focused startups, which pulled in $16.8 billion in Q2. While some AI firms, such as China’s Zhipu AI and South Korea’s 42dot, raised big rounds well over nine figures, there just simply were not enough of them. The trade and investment tensions between China and the West, along with the region’s continuing rocky economy, are not helping. China’s regulatory policies around venture and IPOs likely also have not helped, but recently there have been signs of officials willing to change that to jump-start the declining market. It was recently reported that mainland China IPOs raised only $4.6 billion in the first six months of the year — a drop of 85% from H1 2023. Such actions likely will be needed if the region is to stop its downward tumble. Methodology The data contained in this report comes directly from Crunchbase, and is based on reported data. Data reported is as of July 7, 2024. Note that data lags are most pronounced at the earliest stages of venture activity, with seed funding amounts increasing significantly after the end of a quarter/year. Please note that all funding values are given in U.S. dollars unless otherwise noted. Crunchbase converts foreign currencies to U.S. dollars at the prevailing spot rate from the date funding rounds, acquisitions, IPOs and other financial events are reported. Even if those events were added to Crunchbase long after the event was announced, foreign currency transactions are converted at the historic spot price. Glossary of funding terms We have made a change to how we include corporate funding rounds in our reporting as of January 2023. Corporate rounds are only included if a company has raised an equity funding at seed through a venture series funding round. Seed and angel consists of seed, pre-seed and angel rounds. Crunchbase also includes venture rounds of unknown series, equity crowdfunding and convertible notes at $3 million (USD or as-converted USD equivalent) or less. Early-stage consists of Series A and Series B rounds, as well as other round types. Crunchbase includes venture rounds of unknown series, corporate venture and other rounds above $3 million, and those less than or equal to $15 million. Late-stage consists of Series C, Series D, Series E and later-lettered venture rounds following the “Series [Letter]” naming convention. Also included are venture rounds of unknown series, corporate venture and other rounds above $15 million. Technology growth is a private-equity round raised by a company that has previously raised a “venture” round. (So basically, any round from the previously defined stages.) Illustration: Dom Guzman <img src="https://news.crunchbase.com/wp-content/uploads/Quarterly-Asia-1.jpg" class="ss-hidden-pin-image" data-pin-url="https://news.crunchbase.com/ai/asia-venture-42dot-hozon-zepto-china/" data-pin-media="https://news.crunchbase.com/wp-content/uploads/Quarterly-Asia-1.jpg" data-pin-description="Asia Funding Limps Along, Hits Lowest Level Since 2015"/> TagsAI Artificial Intelligence startups venture venture funding Stay up to date with recent funding rounds, acquisitions, and more with the Crunchbase Daily. You may also like <img width="470" height="352" src="https://news.crunchbase.com/wp-content/uploads/Top_10_-470x352.jpeg" class="attachment-herald-lay-c size-herald-lay-c wp-post-image" alt="Illustration of gardener holding a rake. Venture" decoding="async" srcset="https://news.crunchbase.com/wp-content/uploads/Top_10_-470x352.jpeg 470w, https://news.crunchbase.com/wp-content/uploads/Top_10_-640x480.jpeg 640w, https://news.crunchbase.com/wp-content/uploads/Top_10_-74x55.jpeg 74w, https://news.crunchbase.com/wp-content/uploads/Top_10_-111x83.jpeg 111w, https://news.crunchbase.com/wp-content/uploads/Top_10_-215x161.jpeg 215w, https://news.crunchbase.com/wp-content/uploads/Top_10_-300x225.jpeg 300w, https://news.crunchbase.com/wp-content/uploads/Top_10_-632x474.jpeg 632w, https://news.crunchbase.com/wp-content/uploads/Top_10_-536x402.jpeg 536w" sizes="(max-width: 470px) 100vw, 470px" /> Artificial intelligence • Cybersecurity • Health, Wellness & Biotech • Sales & Market