["https://news.crunchbase.com/ai/anthropic-funding-lightspeed-xai-openai"]
title = "Anthropic Nears Closing Of $3.5B Funding At $61.5B Valuation — Report"
description = "Anthropic, a ChatGPT rival with its AI assistant Claude, is finalizing a fresh $3.5 billion funding round that would value it at $61.5 billion, per The Wall Street Journal."
full_description = '''Artificial intelligence Anthropic Nears Closing Of $3.5B Funding At $61.5B Valuation — Report Chris MetinkoFebruary 25, 2025 <img alt='' src='https://secure.gravatar.com/avatar/1e814790d509621a16d3da36575b8ff0?s=112&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/1e814790d509621a16d3da36575b8ff0?s=224&#038;d=mm&#038;r=g 2x' class='avatar avatar-112 photo' height='112' width='112' decoding='async'/> Chris Metinko 5 Shares Email Facebook Twitter LinkedIn Anthropic, a ChatGPT rival with its AI assistant Claude, is finalizing a fresh $3.5 billion funding round that would value it at $61.5 billion, per The Wall Street Journal. Investors in the new megaround would include Lightspeed Venture Partners, General Catalyst, Bessemer Venture Partners and Abu Dhabi-based investment firm MGX. Anthropic was last valued at $18.5 billion in February 2024. The round would value Anthropic at more than Elon Musk’s xAI, which was valued at $50 million in November after its $6 billion Series C (which Lightspeed and MGX also participated in). However, the new round values Anthropic well behind OpenAI, which is closing in on its own new $40 billion funding from SoftBank that will value it at a mind-blowing $260 billion. More money The finalizing of the new round comes just about a month after Anthropic reportedly raised a fresh $1 billion from previous investor Google, which had invested $2 billion in October 2023. The new funding — which was first reported last month — also comes just a couple of weeks after it was reported the startup was in advanced talks to raise $2 billion in a deal led by Lightspeed Venture Partners that would value it at $60 billion. That Google deal came just two months after Amazon agreed to invest another $4 billion in the AI startup. That deal followed Amazon’s 2023 announcement to invest up to $4 billion in Anthropic — a deal that gave the Seattle-based e-commerce and cloud titan a minority stake in the startup. Related readi