nly screen and (max-width: 1024px) and (min-width: 768px) { .wbg-details-wrapper { width: 100%; float: none; padding-right: 0; } } @media only screen and (max-width: 767px) { .wbg-details-wrapper { width: 100%; float: none; padding-right: 0; } .wbg-sidebar-right { display: block; width: 300px; margin: 0 auto; } } A Girl, a Raccoon, and the Midnight Moon By: Karen Romano Young; illustrated by Jessixa Bagley Category: Fiction Published: 2020 More Details Description: Recommended by Peter Girguis, Professor of Organismic and Evolutionary Biology A reclusive young bibliophile named Pearl learns that her New York City branch library’s beloved statue of the poet Edna St. Vincent Millay has been beheaded. Thus starts Pearl’s intense three-month saga (from August to November) in which she learns that: 1. There are reading raccoons inhabiting her library (and likely the whole city); 2. Her library may be shut down because of age and community apathy; and 3. She must come out of her social shell to help her new friends and everyone who will be impacted! Topics of social justice, homelessness, friendship, community action, individual power to effect change, and the many gifts of imagination are all investigated through the endearing antics of the characters. Karen Romano Young has cleverly included a “secret sidebar author” whose sage advice propels the storyline and keeps you guessing until the very end of this twisty coming-of-age tale. Warning: You will likely be strongly compelled to (safely) hug your local library and librarians. Bring your library card! Back to all books"
