full_description = "Life | Work A series focused on the personal side of Harvard research and teaching. Health Aha moment in psych class clarifies childhood mystery Inspires Susan Kuo’s research probing role of genetics in schizophrenia, autism Campus & Community Seeing is believing Personal and global history made Jeremy Weinstein want to change the world. As dean of the Kennedy School, he’s found the perfect place to do it. Health ‘Heartbreaking’ encounter inspired long view on alcohol One encounter changed everything for researcher who hopes to help mothers and families detect and treat the effects of dangerous drinking Nation & World How to help urban young people progress? Nurture hope. Youth development specialist promotes holistic approach to healing, growth of individuals, communities amid poverty, drugs, trauma Health Her friends’ parents were dying of cancer. Then her mom got sick. Childhood tragedy sparks Harvard researcher Jen Cruz’s quest to root out public health inequities Nation & World Someone stole Karestan Koenen’s future. She took it back. Trauma expert speaks from brutal experience Video All from this series ‘What is compelling to do right now?’ Marshall Ganz started at Harvard but took some time off — about three decades — to become Civil Rights, labor, political organizer, and finally scholar, mentor. September 26, 2023 Car bombing in Pakistan nearly took her father’s life — and changed hers Mashail Malik was always interested in the human experience. At first it took her to literature, philosophy but now her focus is ethnic, identity politics. June 20, 2023 James Riley’s indelible past Graffiti of his Los Angeles youth colors the work of Business School sociologist. May 12, 2023 Desire to battle climate change rooted in childhood Environmental science and engineering doctoral student grew up next door to family’s palm-oil refinery outside Bangkok. April 12, 2023 The art of self-healing “There is this culture that doctors are supposed to be perfect … and that culture makes it harder for us to ask for help.” March 14, 2023"
