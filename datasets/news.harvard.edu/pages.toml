Description:                                                                                                        Recommended by Julie Fiveash, librarian for American Indigenous Studies
This YA graphic novel is about two separate journeys with magic and self-reflection. I love how it shows the two characters’ struggle to understand aspects about themselves and how it highlights the fears one can have with leaving and coming back changed. The art is immensely gorgeous and if you enjoy this, you’ll also enjoy Jessi Zabarsky’s other book, “Witchlight.”


Back to all books"""
