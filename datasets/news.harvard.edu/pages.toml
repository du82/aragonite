description = """
Description:                                                                                                        Recommended by Ya-Chieh Hsu, Professor of Stem Cell and Regenerative Biology
Although Elizabeth Gilbert writes from a writer’s perspective, I find it immensely inspiring for my own scientific endeavors, which are also deeply connected to creativity. One chapter, “Walk Proudly,” resonated with me so deeply that I have shared it with many people and listened to it countless times — it empowers me whenever I need to be brave.
 


Back to all books"""
