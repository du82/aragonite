["https://news.harvard.edu/gazette/story/2025/02/what-electric-fish-can-teach-scientists-about-neuroai"]
title = "What electric fish can teach scientists about NeuroAI — Harvard Gazette"
description = "Modeling their behaviors may help in development of new AI systems."
full_description = "Science & Tech What electric fish can teach scientists about NeuroAI The elephantnose fish, a weakly electric fish named for the trunk-like protrusion on its head, was studied by researchers. Yohan J. John Harvard Correspondent February 10, 2025 5 min read Modeling their behaviors may help in development of new AI systems Electric fish are among the most intriguing specimens in nature’s cabinet of curiosities. They “see” their world and each other by sensing — and generating their own — electric fields. This unique ability provides a key area of exploration for the emerging field of NeuroAI, which explores the perceptual and cognitive capacities of both natural and artificial systems. For Kanaka Rajan, Kempner Institute investigator and associate professor in the Department of Neurobiology at Harvard Medical School, electric fish represent a potential source of wider insight into “collective intelligence,” which emerges from interactions among different goal-oriented entities. Rajan and her team believe that studying weakly electric fish might be a steppingstone to understanding multi-agent intelligence, potentially shedding light on the complex dynamics that are a hallmark of animal and human societies. Rajan and her collaborators investigated the Gnathonemus petersii, or Peter’s elephantnose fish, a weakly electric fish named for the trunk-like protrusion on their heads. Native to the rivers of western and central Africa, elephantnose fish prefer to live in muddy pools and shady, slow-moving streams. With the help of electro-sense, the fish are able to penetrate their muddy environments by producing pulses known as electric organ discharges, or EODs. “They do everything in their lives through electric pulses,” says Rajan. “Their communication, their mating habits, their pursuit, their aggression, cooperation, competition, everything is governed by these pulses that they emit.” Because Rajan and her team are interested in how agents — which could be humans, animals, robots, or language models — interact with each other at different scales, elephantnose fish offer an opportunity to study emergent, coordinated communication, or agent interaction, in a relatively simple context. Here’s where the weakly electric fish come in. Their “language” consists of streams of identical electrical pulses. Their “sentences” vary in terms of how often these “syllables” are emitted by each fish. But even though these animals’ forms of communication are simpler than humans’, they still display emergent, coordinated behaviors that could shed light on much more complex social dynamics. Modeling these behaviors can also help in the development of new AI systems. The key idea when studying collective intelligence is that social dynamics are not simply the sum of individual behaviors, or even of pairwise interactions. For example, the distinctive behaviors that can arise in groups of humans at a party are much more complex than a collection of two-person conversations. This could be because each conversation carries with it a memory remnant from the previous conversation, even if it occurred with an entirely different person, or because a three-way discussion has nuances that cannot be captured wholly by the sum of every possible two-person chat. Plus, the overall context matters when it comes to human behaviors — whether it is a work or an after-work event, for example, or whether the situation takes place between peers or within a social hierarchy. Elephantnose fish demonstrate this sort of collective intelligence in striking ways. In a study by Federico Pedraja and Nathaniel Sawtell, one of Rajan’s key collaborators at Columbia University, elephantnose fish in a group were seen to piggyback off each other’s ability to search for food. If one fish happens to find a promising source of food, it can send out pulses that nearby fish can detect. As a result, other fish can expend less energy on foraging directly and simply follow the leader. Through this and other types of collective communication, the fish are able to exhibit social behaviors that can help them survive and thrive in certain environments. Rajan and her team built computer models using artificial agents that mimic elephantnose fish. By manipulating factors that would be impossible to control experimentally in real fish, Rajan and her team were able to simulate and study how collective intelligence emerges in different contexts. Their work at the Kempner Institute has begun to reveal some fascinating results. Evolutionary simulations, in which artificial fish must survive in order to pass on their characteristics to the next generation, suggest that the availability of food determines whether the fish engage primarily in cooperation or in competition. Reducing the reliability of food sources increases the likelihood that the population will engage in competitive behaviors. Cooperation and competition aren’t hardwired into these artificial agents. Rather, these behaviors emerge over the course of multiple generations through a simulated version of natural selection. Rajan aims to expand this project to gradually encompass more and more complexity, including better understanding the process of learning in individual agents and the emergence of different survival strategies. One key question the team is starting to address is whether there are universal laws governing social interactions. Is there, for example, a “critical mass” of agents that can optimally cooperate? Or a threshold after which competition becomes excessive? This kind of work has intriguing implications for human cooperation but is also relevant to applied AI research. Principles of collective intelligence may play an important role in how individual AI systems interact and communicate with one another. Cooperative teams of AI agents — sometimes referred to as “swarms” — are promising for tech applications, potentially allowing for faster, more complex, and more adaptable problem-solving. Only time will tell if such AI “hive minds” prove useful, but in the meantime, foundational work of the kind pursued by Rajan and her collaborators is shedding light on how both biological and artificial agents can work together to produce collective intelligence. Share this article Share on Facebook Share on LinkedIn Email article Print/PDF"
author = "Yohan J. John"
year_published = 2025
year_updated = 2025
