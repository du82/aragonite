full_description = "Work & Economy Is AI already shaking up labor market? 4 trends point to major change, say researchers who studied century of tech disruptions How to avoid really bad decisions. (Hint: One tip is just hit pause.) Business ethicist details ways to analyze complex, thorny issues, legal gray areas, and offers advice we can all use Is small thinking the new American way? Study says tighter land-use controls have hurt productivity and innovation among builders, fueling housing crisis How China tariffs could backfire on U.S. Economists say there could be unintended consequences, including higher prices, supply chain disruptions, and possibly opening door to improving Beijing’s ties to American allies How free-market policymakers got it all wrong for decades Conservative economist says singular focus on deregulation, unfettered trade failed to deliver for American households Are rich different from you and me? Would we be better off without them? Safra Center for Ethics debate weighs extreme wealth, philanthropy, income inequality, and redistribution All Work & Economy Millions of workers are also juggling caregiving. Employers need to rethink. Business School report finds rigid hiring policies, work rules, scheduling hurt employees but also productivity, retention, bottom line October 10, 2024 What skeptics get wrong about liberal arts In podcast episode, an economist, an educator, and a philosopher make the case it’s as essential as ever in today’s job market October 9, 2024 Generative AI embraced faster than internet, PCs Study finds nearly 40 percent of Americans have used technology for tasks at work and at home October 4, 2024 Consumers to see benefits of Fed rate cut, but how much and when are less clear Jason Furman looks at decision, considers what it means to economy, both Wall Street and Main Street September 19, 2024 Raise corporate tax rates! No, cut them! Maybe take a look first? New study scrutinizes what did, did not work as disputed 2017 law becomes partisan football in election year September 10, 2024 You want to be boss. You probably won’t be good at it. Study pinpoints two measures that predict effective managers August 27, 2024 Revising the cost of climate change New study of economic toll yields projections ‘six times larger than previous estimates’ August 26, 2024 Finding lessons on power of federally funded childcare for working mothers New research by Claudia Goldin takes look at World War II-era Lanham Act August 14, 2024 Economic prospects brighten for children of low-income Black Americans, study finds Opportunity Insights also finds gap widening between whites at top, bottom July 31, 2024 More money, empowerment — and less chance of domestic abuse Study examines benefits for working women who help produce Rwandan specialty coffee July 25, 2024 Books that pay off Recommendations from three Harvard economists, including Nobel laureate Claudia Goldin July 16, 2024 Why do I like what I like? Your preferences aren’t as original as you may think, says behavior scientist July 9, 2024 Could high office-vacancy rates damage economy this year? Kenneth Rogoff sees tough road for some banks as surge of real estate loans come due by 2025, but doesn’t expect wider meltdown June 26, 2024 Americans hate inflation, full stop No traction for more positive economic developments, research says June 20, 2024 More educated communities tend to be healthier. Why? Culture. New study finds places with more college graduates tend to develop better lifestyle habits overall May 13, 2024 Lending a hand to a former student — Boston’s mayor Economist gathers group of Boston area academics to assess costs of creating tax incentives for developers to ease housing crunch March 14, 2024 Where money isn’t cheap, misery follows Student’s analysis of global attitudes called key contribution to research linking higher cost of borrowing to persistent consumer gloom March 13, 2024 Larger lesson about tariffs in a move that helped Trump but not the country Researcher details findings on policy that failed to boost U.S. employment even as it scored political points March 13, 2024 Fed delivers good news overall on economy Economist Jeffrey Frankel says the central bank held off on easing interest rates, but signs point to soft landing February 1, 2024 Studying ‘why women are interesting, and men are boring’ Nobel laureate Claudia Goldin recounts pioneering career spent tracing major part of U.S. workforce, economy hidden in plain sight January 26, 2024 Confused about changes in tipping customs? You’re not alone. Customer relations expert says technologies, COVID changed behaviors across the U.S. December 15, 2023 We’ll gather together — even though everything seems so much more expensive Economists explain why Americans feel inflation, economy are much, much worse than they actually are November 21, 2023 ‘Glass ceiling’ is problem, but so are ‘broken rungs’ New report examines myths hampering advancement of women in workplace, actual barriers, and possible solutions November 20, 2023 ‘Shark Tank’s’ Kevin O’Leary talks startups and setbacks The celebrity entrepreneur explained what it takes for a founder to develop a product or service, raise capital from investors, and grow from a small business into a larger enterprise. October 26, 2023 Gender pay gap? Culprit is ‘greedy work’ In “Career and Family” Claudia Goldin tracks evolution through 20th-century gains to era of earning inequality that forces harsh life choices. October 17, 2023 Is ChatGPT more foul than fair? Copyright expert Rebecca Tushnet discusses the growing battle between book authors and tech companies who use their books to improve generative AI products like ChatGPT without their consent or compensation. September 21, 2023 How Jeanne Gang married soaring wonder, structural necessity at Gilder Center The Design School professor talks about her latest project, a new wing for New York City’s American Museum of Natural History. September 15, 2023 So what exactly is Google accused of? Much comes down to how much influence the search giant wields on default setting on devices, digital economy expert says. September 14, 2023 You bought an electric car. Why did your carbon footprint grow? It may sound counterintuitive but you probably don’t drive enough, says grad’s research on the effectiveness of government incentives. August 28, 2023 Don’t tell Bob in accounting he’s a raging jerk (even if he is) Conflict is a natural part of any office. Clare Fowler’s new book offers a practical guide to managing it with confidence. August 16, 2023 1 2 3 … 7 →"
