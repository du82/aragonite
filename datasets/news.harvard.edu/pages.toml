full_description = "A podcast where the life of the mind meets everyday life. Join Harvard Gazette writer Samantha Laine Perfas as she convenes experts from different disciplines for conversations about issues that affect people in real, tangible ways. Produced by Harvard University. Find us on Apple Podcasts, Spotify, and YouTube. Featured Episode Transcript Robert Waldinger: The more we resist change, the more we suffer. There’s a phrase I like. It says, “Let go or be dragged.” There is just constant movement of the universe and all of us as individuals as part of the universe. Samantha Laine Perfas: You can’t teach an old dog new tricks, goes the saying, and sometimes this feels true. But the idea that people can’t change is a myth. Research shows that people are capable of making dramatic shifts at nearly every stage of life in spite of our habits and biases. So how much of that change is within our control and how much is at the mercy of our circumstances? Welcome to “Harvard Thinking,” a podcast where the life of the mind meets everyday life. Today, we’re joined by: Mahzarin Banaji: Mahzarin Banaji. I’m an experimental psychologist. I live and work in the Department of Psychology at Harvard University. Laine Perfas: Her work focuses on implicit bias, and she co-wrote the best-seller “Blindspot: Hidden Biases of Good People.” Next: Waldinger: Bob Waldinger. I’m professor of psychiatry at Harvard Medical School Laine Perfas: He also directs the Harvard Study on Adult Development, one of the longest-running studies on human happiness and well-being. It tracks the lives of participants over 80 years. And finally: Richard Weissbourd: Rick Weissbourd. I’m a senior lecturer at the Grad School of Education. I’ve also taught at the Kennedy School of Government for many years. Laine Perfas: He’s a psychologist and is the director of the Making Caring Common Project at GSE. And I’m Samantha Laine Perfas, your host, and a writer for The Harvard Gazette. Today, we’ll discuss how, when, and why we change, intentionally and otherwise. It feels like we live in a culture that is constantly pushing us to do more, be more. Why do we focus on changing ourselves so much? Waldinger: What’s so striking is that for a long time, developmental scientists focused almost exclusively on children, because children change so dramatically, right before our eyes. And people thought once we got into our 20s, we found work, if we were lucky we found love, and then we were good to go, we were set, and people didn’t change much across adulthood. People began to look more closely and look at their own experience and realize how much change happens psychologically and biologically across the adult lifespan. And so you began to see the kinds of studies of change across adulthood that my study represents that was begun in 1938. But for a long time, adult development was the kind of poor stepchild of developmental science. Banaji: Psychologists, I think, have been remiss in really studying the two ends of life, right? As Bob said, because we are interested in development for a variety of reasons, we focus on from the day a baby is born and we go through, really, well, the adolescent years because we’re interested in the emotional mind and what happens, the volatility during adolescence, and change and so on. And then we know nothing until again, we get to a much older age where we worry and think about the last decade of life. But every decade we’re changing. We’re entirely different people. Weissbourd: There’s so many different domains of change, right? And I think we do have a pretty strong belief in our culture that we can become more effective or competent, that we can become happier. There’s a billion-dollar self-help industry out there that is trying to make people feel better. My work is primarily on moral development, and I don’t think we have strong notions of change in adult life, and that’s a real problem. There’s a notion in many parts of the country that you’re born good or bad, and you’re going to be good or bad your whole life, and I think we’d be a much healthier culture if we saw ourselves as having the capacity to love other people well and more deeply and empathize more deeply. You can have better relationships. And that’s probably the strongest source of happiness we have. I would just say one other thing, and it’s really partly a question for all of you. But, I think sometimes people don’t think they change because the narrator doesn’t change. Meaning the person, the thing telling the story of their lives doesn’t feel like it changes. And when I ask people about their narrator, do they have the same narrator when they were 8 or 16 or 30 or 50? Most people think the narrator is the same. So if you think of the narrator as the self and the continuity of the self, I think that’s one of the reasons people often think we’re not changing. Banaji: I’m remembering my good friend Walter Mischel’s theory of personality and this idea that we believe so much that we and other people are largely consistent across different situations. The lovely example that Walter gives is that we meet people in certain roles so we don’t even know the variability of those people. I know the janitor who stops by my office every evening as a janitor, I don’t know him as a father or as a jazz musician or whatever else. These things give us a false sense of continuity. And I think this spills over into feeling change isn’t present or happening when in fact it is. It’s like our skin. I think I’m right that the epidermis, once a month, we have a new skin and even in older people, it’s only a little slower. It’s every two months. But I don’t notice that and that might be an interesting metaphor for us, that something so close to us on our body that we see all the time is going through an entire regeneration every month, but we don’t notice it. Waldinger: It’s interesting because I think we’re ambivalent about change, that the mind in many ways craves permanence. Rick, as you’re saying, we have this sense of the narrator being the same narrator when I was 8 years old and now when I’m in my 70s, and of course that’s absurd. I’m a Zen practitioner, and the core teachings of Zen and Buddhism is that the self is a fiction. It’s a helpful fiction that we construct to get through the world, but it’s actually fictitious, and constantly changing. But at the same time, as we want permanence, we want something fixed, we say, “Oh, I want to improve.” And so we get on this endless treadmill of self-improvement. So we really have quite a complex relationship with the idea of change, we human beings. Weissbourd: I’m one of those people who do have a strong sense of self-sameness, that I am the same person when I was 8. Is that not true for you? Waldinger: When I was 8, I really thought I could be Superman; and I had a cape and I had a Superman outfit, and I ran around and I jumped on and off my bed. I don’t do that anymore, Rick. Laine Perfas: Maybe you should. Sounds like a great Saturday afternoon. Banaji: You know, there’s a lovely piece that Robert Sapolsky, the neurobiologist, wrote, in, I think it was in the ’80s. I remember reading it and smiling because I was still in my 20s. And he said something like, “My research assistant colors his hair purple one week and green the other week. He listens to classical music and pop. He eats regular foods and weird foods.” And he said, “Look at me, I’ve had the same shoulder-length ponytail for the last 40 years and I only listen to reggae and so on.” And he concluded that piece by saying if you haven’t changed by a certain age for certain things, you never will. If you haven’t eaten sushi by the age of 22, you never will. If you haven’t had your nose pierced by 17, you never will. So there are certain things that, yes, it feels that way, but maybe there are bigger changes that happen later in life. Waldinger: One thing that I’ve been impressed by as I study people getting older is that the big change is in our perception of the finiteness of life. That we all know we’re going to die from a pretty young age, but most of us say, “Ah, it’s way in the future” or “I’m going to be the exception here. I won’t die. Everybody else will.” And then what Laura Carstensen’s work shows, and many people’s, is that in about our mid-40s, we really begin to get a more visceral sense of the finiteness of life and that sense of our mortality increases from the mid-40s onward. You can document it pretty precisely and that institutes a whole set of shifts in how we see ourselves, how we see this narrator moving through the world, and how we see our time horizon. There are some things that are going to change just because of the fact of death. Laine Perfas: It does seem like some people are very open to change, and they’re constantly learning and growing, But then there are other people who are very comfortable with how they are, even if other people maybe think they should change. It makes me wonder, are there some people who are more susceptible to change than others, or more open to it? Banaji: As with almost any other psychological physical property, yes, there are individual differences and far be it for me to bring up anything political in this moment. But one of the differences between what we consider to be liberal versus conservative, the dictionary definition, is that one group looks forward and wants change and wants to leave behind old ways of doing things. And the other wants tradition and stability. There’s nothing good or bad here. These are both forces. But this is a real difference, I think, in almost every culture. I was born and raised in India, I’ve lived most of my adult life here, and in both cultures, I’ve seen these two big movements pull and push in opposite directions. And I guess at some level, I’d like to think theoretically that it’s good to have a bit of that pull and push. Waldinger: And as I understand it, there’s some theory and some grounding in empirical data that some of this may be biologically based, that some of us are temperamentally more inclined to resist change. We humans are arrayed on a spectrum, perhaps even biologically, about how much we welcome versus resist change. Banaji: I can’t help but mention my colleague Jerry Kagan. Jerry’s notion of temperament in early childhood, he had this view that there were certain personality dimensions that are biologically present in early childhood. And I really believe that some of those very much link up to what you’re saying, Bob. So for example, I have a sister who was very shy, anxious, would hold my little frock and hang behind me. And I was so extroverted that at age 6, I wanted to leave home and go off somewhere else. And I feel that this difference in shyness or anxiety or whatever you want to call it, has played a role in our political beliefs. I am open to new experiences. I meet very different people and packed a bag at 21 and with $40 in my pocket took off without knowing anybody in this country. She wouldn’t leave home without thinking for three hours about what she’s going to do. And this does lead to very different outcomes. Weissbourd: Yeah, there’s some people who are temperamentally very risk-averse and there are other people who are risk junkies. Laine Perfas: It is worth mentioning, you know, not all change that we experience is desirable or beneficial. You know, if we encounter trauma or negative experiences, if you’ve been in a really bad breakup and the experience leaves you cynical and love-averse. When we’re going through life and we’re experiencing negative experiences that might push us to change ourselves in ways that might be more harmful or cause us to withdraw, how do we wrestle with that tension versus still being open to the world, not really knowing what might happen? Waldinger: A lot of my clinical work is psychotherapy. That’s my specialty; actually, I still, every day, I see a couple of people in psychotherapy. And what you see is tremendous variability in people’s willingness, interest in, and ability to make internal shifts in how they see the world and how they experience themselves. And some of that, Sam, is based on what you’re describing, which is some people have had negative experiences that seem to have really baked in certain ways of experiencing themselves in the world and certain expectations of the world and of people as being reliable or not reliable, as being intentionally harmful or basically good. Weissbourd: I would say that most of us experience disillusionment at some point in our lives. My dissertation was on the disillusionment of Vietnam veterans, but I think it’s a very common experience. And I think people can respond to disillusionment by becoming bitter and withdrawing and cynical. They can also respond to disillusionment by developing a more encompassing understanding of reality and thriving, flourishing in the world. We have huge literatures on grief and trauma and depression. We don’t really talk enough about disillusionment, and I think it’s a powerful experience for a lot of people. Banaji: My colleague Steve Pinker is very fond of pointing out to us something that I think is true, that we may think that we are not changing for the good, but whether you look at women’s rights, whether you look at homicide rates, unemployment, other measures of the economy, happiness — if you take even a 20-year view on most of them, there’s improvement. If you take a 100- or 200-year view, there’s no question that there’s a lot of improvement. Yes, there are pockets where things are getting worse. I’ll put climate in that box and make sure that we don’t forget that. But on many of these things, we are improving. And I come from a country that got independence in ’47, and the remarkable changes I’ve seen over the course of my lifetime in India are just mind-boggling. But our aspirations, I think, for better, which is a very good thing, I think often lead us to not see real progress that has also been made. Waldinger: And to your point, our cognitive bias that’s built in, our bias to pay more attention to what’s negative and to remember what’s negative longer than what’s positive. When we’re younger, that changes as we get older, but that cognitive bias makes us vulnerable to having this sense that everything’s falling apart and inflamed. Banaji: I myself showed that bias. When we began to do research on implicit bias, I said to my students, don’t even bother looking for change in it. It’s not going to change. It’s implicit. It’s not controllable. That’s the nature of this beast. We can focus on changing people’s conscious attitudes, but this thing is not going to change, not in my lifetime, and I was completely and utterly wrong on that because even implicit bias, which is not easy to control, we’ve seen something like a 64 percent drop-off in anti-gay bias in a 14-year period. This alone is mind-boggling. How did our culture change so d"
