full_description = "De develop branch van de Micropub plugin voor Grav ondersteunt nu ook de Destination extensie. Also on: De laatste leesmap van 2017. Een bijzonder jaar voor me op digitaal gebied. De afgelopen maanden heb ik me weer vol enthousiasme en interesse gestort op het zelf bouwen, onderhouden en beheren van mijn website. Waar je nu naar kijkt. Ik leer nog elke dag en ik voel me lekker bij het zelf klussen, volledig alles zelf in de hand hebben. Er is niets mis met klik-en-klare oplossingen als WordPress of Medium, maar ik kies liever een ander pad voor nu. Een pad wat ik in 2018 verder zal uitdiepen voor mezelf. Veel goeds voor al mijn lezers, geniet van elkaar en de oliebollen vanavond en laat het vuur Wat is POSSE en PESOS op het IndieWeb? by Frank Meeuwsen (Digging the digital) Nieuwe termen, nieuwe wijn? Of is het meer van wat we al kenden? ​​​​​ Syndicated copies to: Seb heeft Dit moet iedereen met een website horen, of: de vette rekening van Permisson Machine – een nieuwe podcast van ‘De Eeuw van de Amateur’ van Botte Jellema gebookmarkt."
