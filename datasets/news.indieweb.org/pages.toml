full_description = "Reciamente, he notado algunas personas se refieren a sus páginas de nivel superior como “slash pages” (páginas barra). Honestamente, mi primera reacción fue «¿No son esas simplemente ‹páginas›?», pero he llegado a encontrar el término un poco divertido. Pero, cuando la gente empezó a añadir una página barra /slashes, pensé «¿No es una mapa de sitio?». Los mapas de sitios XML son comunes para ayudar los motores de búsqueda, pero hay muchos ejemplos de mapas de sitios ... © 2025 by Aaron Parecki. IndieNews fait partie de IndieWebCamp. Este código es de código abierto. Siéntase libre de enviar un pull request, o abrir un issue."
