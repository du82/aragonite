["https://news.indieweb.org/de"]
title = "IndieNews de"
full_description = "SemPress war das erste WordPress Theme (September 2002), das Microformats 2 unterstützte und somit voll IndieWeb-kompatibel war. Seit ein paar Monaten/Jahren gibt es zwar weitere Themes die MF2 unterstützen, aber SemPress ist seit fast 7 Jahren (Dezember 2002) immer noch das einzige, das über WordPress.org installierbar (ist das ein Wort?) ist. Prateek Saxena arbeitet gerade daran, das zu ändern! Sein Theme ist seit diesem Jahr auf WordPress.org und er arbeitet fleißig am MF2 ... The Indie Web: Who owns your identity? Dawn Foster schreibt auf Gigaom über die Indie Web-Bewegung: The Indie Web movement is primarily about ownership and control over your identity. The difficulty is that many of the tools that we need to achieve the complete vision of data ownership just don’t exist yet, or they exist, but not in a way that is accessible to most people. During IndieWebCamp, we focused on discussing these current issues and starting to build some of the tools necessary ... My Webmention plugin for #WordPress should be kind of stable now… Time to ping the #IndieWeb #Conversations from @eschnou, @Barnaby Walters, @Ben Werdmuller, @Tom Morris, @Will Norris, @Glenn Jones and @Aaron Parecki. …and some <3 for Sandeep Shetty Great idea of Sandeep Shetty to use the u-like (microformats-2) and webmentions for federated social likes! Works like a charm! #indieweb The #indieweb as a minimum viable social web ecosystem Schöner Artikel von Ben Werd über das IndieWeb und Idno!"
