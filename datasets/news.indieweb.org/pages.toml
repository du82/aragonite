["https://news.indieweb.org/fr"]
title = "IndieNews fr"
full_description = "I wrote a little #elixir program, called LastCrusader: https://github.com/jpcaruana/last_crusader. Not a 100% static solution, but a fun experiment.commits to Github from micropub endpointlistens for pusblishsends webmentions to targets (and update links when appropriate) for POSSE thanks to https://brid.gy/ and https://fed.brid.gy/Posté également sur IndieNews I think boring websites like mine are possible for more people. It’s less a function of the expected number of visitors, but rather a function of its intended purpose. If your website has a well-defined purpose, maybe boring technology could be good for you. Same vibe here @Pseudomanifold #indieweb #boring tech Posté également sur IndieNews Première note postée avec un service de micropub sur mon propre serveur :) Il reste encore 2/3 petites choses à peaufiner, mais ça avance !Posté également sur IndieNews Mon petit serveur LastCrusader envoie désormais des webmentions à toutes les cibles concernées :) Pas mal de chemin parcouru depuis le lancement de ce petit projet !Posté également sur IndieNews"
