["https://news.indieweb.org/how-to-submit-a-post"]
title = "IndieNews - How to submit a post"
full_description = "In order to submit a post, you do not need an IndieNews account. Instead, you can only submit posts from your own site by linking to the IndieNews site and sending a notification using the webmention protocol! To submit someone else's post, you can post a bookmark on your site and submit that URL to IndieNews! Post an h-entry as normal, then include a u-bookmark-of property linking to the actual URL you want to submit. Inside the h-entry, add a link to the IndieNews home page for your language with the class u-syndication or u-category. This usually looks something like the following: If your website sends Webmentions automatically, then you don't need to worry about this step. Otherwise, follow the instructions below to send a Webmention, or just use the Webmention form available at the IndieNews Webmention endpoint. Make a POST request to https://news.indieweb.org/en/webmention with two parameters, source and target, where target is https://news.indieweb.org/en and source is http://example.com/100 assuming you are submitting a page on your site with the url http://example.com/100. Note that each language's home page has a unique Webmention endpoint, so you should do the Webmention endpoint discovery as normal to find it. You can find the permalink of your syndication by looking for the Location header in the response. You can then update your post with that URL so that your post always links to the IndieNews permalink instead of the IndieNews home page. This webmention endpoint also returns more data that is useful for debugging purposes while you're initially trying it out. If you update the post (for example trying to debug the microformats markup, or changing the post title), you can re-send the webmention. The existing IndieNews post will be updated with the new information found. Your page must be marked up with an h-entry or an h-event, IndieNews will use the name in the entry as the title of the submission. If an h-card is present, author information will be pulled from there, otherwise it will fall back to using the domain name as the author."
year_published = 2025
clearnet = "https://news.indieweb.org/how-to-submit-a-post"
