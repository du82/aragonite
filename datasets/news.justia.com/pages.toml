full_description = '''The change ends statutory protections for transgender people from discrimination in areas such as employment, housing, and education. Missouri Attorney General Andrew Bailey filed a lawsuit against Starbucks on Tuesday, February 11, 2025, in the U.S. District Court for the Eastern District of Missouri, alleging that Starbucks uses diversity, equity, and inclusion policies to discriminate on the basis of race, gender, and sexual orientation. A federal judge dismissed a lawsuit against X (formerly Twitter) on Wednesday that alleged that the company violated the Americans With Disabilities Act when it began to require employees to come into an office instead of working remotely. The Supreme Court ruled on Wednesday that employees are not required to show significant harm in federal discrimination lawsuits involving job transfers. Workday, Inc., a company that provides applicant screening services to employers, has been accused of engaging in illegal discrimination due to its use of AI. On Thursday, June 29, 2023, the U.S. Supreme Court ruled in favor of Gerald Groff, a former United States Postal Service worker who resigned due to not receiving religious accommodations over Sunday hours. In a 6-3 decision, the Supreme Court on Thursday ruled against the use of race as a factor in university admissions programs. The ACLU argues that Florida has violated constitutional principles by passing a law that would largely prevent people "domiciled" in China from acquiring real estate in the state. The EEOC alleges that Walmart violated federal disability discrimination law by refusing to provide reasonable accommodations to a deli associate with Crohn's disease. A California agency sued Tesla on Wednesday, alleging that the company racially discriminated against and harassed workers at its Fremont, California plant.'''
