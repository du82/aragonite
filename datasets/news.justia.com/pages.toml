["https://news.justia.com/category/immigration"]
title = "Immigration Category Archives — Justia News Legal News and Featured Federal Dockets :: Justia Legal News"
description = "Legal News and Featured Federal Dockets :: Justia Legal News"
full_description = '''The new laws continue a trend of states getting more involved in immigration enforcement, which was traditionally left to the federal government. The ruling addressed the effects of an illegal policy that DHS had authorized at ports of entry on the U.S.-Mexico border. On November 19, 2020, U.S. Customs and Border Protection (CBP) proposed an expansion of facial recognition at the border to include photographs of every non-citizen coming in or out of the United States, regardless of their means of travel, entry and exit points, or even age. A ruling issued last week by the US District Court for the District of Maryland states that the federal government must face a lawsuit filed by the families of US citizen children whose parents have been denied coronavirus stimulus checks due to their status as undocumented immigrants. The court rejected the Department of Justice's arguments that federal officials are immune from constitutional claims arising from how Congress and the US Treasury Department decided to administer relief funds. A class action lawsuit has been filed in Illinois federal court naming defendants including President Donald Trump, Senate Majority Leader Mitch McConnell, and US Treasury Secretary Steven Mnuchin by a US citizen who alleges that he was unlawfully denied a stimulus payment because he is married to an immigrant. The plaintiff claims that the federal government's restriction allowing only married couples who both have valid Social Security numbers to receive payments is a form of discrimination and violates the US Constitution. The U.S. District Court for the District of Columbia has ruled that the Trump Administration failed to follow procedures set forth under federal law in appointing Ken Cuccinelli to a leadership role in US Citizenship and Immigration Services (USCIS) in 2019. As a result, two rule changes to the asylum process implemented under his leadership should be considered nullified, according to the judge. A new lawsuit filed on behalf of 12 plaintiffs aims to protect immigrant children from "aging out" of the immigration system when they turn 21 if their parents are H-1B visa holders from India. Dependents of H-1B holders have the ability to remain in dependent H-4 status if their wait for lawful permanent resident status is increased due to per country limits on the number of immigrant visas. However, current per country limits and national origin-specific visa bulletin charts dictate that children from India are subject to decades-long waits, which causes them to lose eligibility to immigrate with their parents when they turn 21.'''
