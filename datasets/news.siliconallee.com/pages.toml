["https://news.siliconallee.com/2020/06/06/our-commitment-to-diversity-and-fighting-racism"]
title = "Our Commitment to Diversity and Fighting Racism at Silicon Allee"
description = "Necessary cookies are absolutely essential for the website to function properly. This category only includes cookies that ensures basic functionalities and security features of the website. These cookies do not store any personal information."
full_description = "In the US, George Floyd was murdered by policemen and pitted daily against a system built with racist motives. He was not alone. Sadly his murder is not an isolated incident and racist police violence, oppression and racist murders are committed everywhere, including Germany. At Silicon Allee we have been publicly quiet so far but that doesn’t mean we’ve been silent. Our team has been having passionate debates internally about how we can create a real impact and where our place is in this problem. We wanted to formulate a meaningful message with actionable items for our community; not a black square or a hashtag. We unequivocally condemn the injustices and violence that the black community faces on a daily basis worldwide and we are committed to taking action to dismantle racist systems. At Silicon Allee, we have always preached that diversity is the reason for our success. We know that Berlin’s startup scene would be nothing without the input of migrants and the welcoming policies of the Berlin and German governments. The support of new arrivals to Germany is core to our mission. But we know we can do more in amplifying marginalized voices, standing up in the fight against racism and holding our elected officials accountable. Firstly, below we’ve shared resources which include organizations to donate to, social justice leaders to follow, anti-racism books to read, and anti-racism resources, some of them specifically for the tech and VC community. We know it can be overwhelming. We chose to donate to the Initiative Schwarze Menschen in Deutschland e.V.. We encourage you to donate to one organization as well. Just one to start. Like founding a startup, once you take that first step you likely won’t stop. Secondly, we are pledging to reserve up to half of the remaining spots in our Berlin Founders Fund for entrepreneurs of color or other marginalized groups. Please apply to BFF if you are a founder from a diverse background. You are welcome! Our team and our network are excited to support you."
