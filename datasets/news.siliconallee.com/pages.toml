["https://news.siliconallee.com/2022/09/14/south-koreas-innovation-startup-gaining-momentum"]
title = "How South Korea’s Innovation Startup Scene is Gaining Momentum"
description = "Necessary cookies are absolutely essential for the website to function properly. This category only includes cookies that ensures basic functionalities and security features of the website. These cookies do not store any personal information."
full_description = "But, he’s got a point. The motherland of major conglomerates like Samsung, Hyundai, and LG, and the country where Google created its first-ever campus in Asia, South Korea has a strong foundation for innovation. With Korean actor O Yeong-su winning Korea’s first Golden Globe award for his role in Netflix hit “Squid Game” and the exponential rise of K-Pop, fascination in South Korean culture in the west is growing, with entertainment leading the way. “A lot of people didn’t know about Korea until recently, the entertainment business has been thriving, but that’s just the start of it. We’ve gone from third world to first world in such a short time and this dramatic transformation means we understand both sides. We’re now a thriving democracy and a healthy model for the community which nurtures the soil for startups”. There are now 24 unicorns in South Korea, compared to 39 in Germany, and in 2019 they beat China, Germany, and Sweden in their innovation ranking in the Bloomberg Innovation Index. South Korea is now the 10th-largest economy in the world. In 2021, there was 78% more venture capital funding for startups in South Korea compared to the previous year. Startups in South Korea also created more jobs in 2021 than the four largest conglomerates combined. The startup scene in South Korea is clearly having a moment. Backed by the Korean government who want to encourage more entrepreneurial people to start a business as an alternative career path to the big market players. The government has shown clear commitment to the startup scene with billions of dollars invested in innovation since 2013. The president asserted in a recent press conference that the government intends to invest $12 billion more over the next four years. Marta Allina, whom Silicon Allee met several years ago in Berlin (during which time we might have inspired her to start her own startup community in Seoul), has been living in Korea for the past 14 years, she’s ex-Samsung but now calls herself an ‘ecosystem builder’. Marta started Seoul Start-ups to help run programs for startups that want to expand abroad, or who want to tap into the Korean start-up scene."
