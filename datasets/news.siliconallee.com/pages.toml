title = "The Meat on the Bones of Germany's Digital Policy: Merkel at Digitising Europe - Berlin Tech News from Silicon Allee"
description = "Necessary cookies are absolutely essential for the website to function properly. This category only includes cookies that ensures basic functionalities and security features of the website. These cookies do not store any personal information."
full_description = "The irony was too obvious to miss: German Chancellor Angela Merkel, together with senior management from Vodafone, ruminating over Europe’s digital future in a building which once held enormous amounts of gas. But while there was plenty of hot air at the Digitising Europe conference at the Gasometer Schöneberg – just like any conference – there were also signs that the Chancellor is increasingly on message when it comes to Germany’s digital economy; certainly compared with her previous speech to the tech masses. Among the topics she touched on in her speech, held in a sealed-off venue amid high security, was the need for Europe to compete on a global level as a whole rather than as a collection of individual countries, how a focus on developing the digital economy can help tackle the continent’s horrific youth unemployment problem, making it easier to set up and grow a startup, and even the need to compromise when it comes to data privacy on the Internet. Since her appearance at the Internet & Startups in Deutschland event in March last year, Merkel has started to add some meat to the bones of her digital policies. Some of the ground she covered* at Thursday’s conference, which was hosted by the Vodafone Institute for Society and Communications, included: “This is the right moment for us to really try to fill that gap and to grow into this Internet of Things market. This is not only an opportunity, it is a need, a necessity, because if we are unable to do this now, we Europeans as a whole will fall behind in international competition.” “Berlin stands for change. Only a dew days ago, we celebrated the 25th anniversary of the fall of the Berlin Wall. We see what has grown up in the meantime since the Wall fell. We have seen the number of young startups, the creative scene of Berlin that has developed immensely. Berlin no longer has that much of an industrial base. But it does have a very promising startup scene, one that needs to be supported. So one of the questions [for] the federal government is how can we create even better framework conditions for young people to set up startups.”"
