["https://news.siliconallee.com/2021/10/13/you-can-now-form-a-german-company-online-except-not-really"]
title = "You can now form a German company online – except, not really - Berlin Tech News from Silicon Allee"
description = "Germany has dipped its toes in the digital future, by passing a law that on the surface promises to bring the country into the modern era alongside countries like Estonia, Portugal, the UK, the US, and countless others by allowing a company to be formed online. This should be great news for the startup scene […]"
full_description = "Germany has dipped its toes in the digital future, by passing a law that on the surface promises to bring the country into the modern era alongside countries like Estonia, Portugal, the UK, the US, and countless others by allowing a company to be formed online. This should be great news for the startup scene which has long-complained about the cumbersome systems of notaries, physical signatures and in-person meetings that have plagued the founding process here. Unfortunately, despite the bold claims made by the new law (that was mandated by the Digital Directive of the European Parliament) there is very little innovation actually in the bill and Germany has done everything it can to ensure the engrained power structures remain and the powerful notary lobby has everything to gain from the new setup. In short, its allowing for a small degree of digitzation of the antiquated role of the notary in Germany, rather than truly digitizing the company formation process. There is a great write up by PWC (in German) on the topic, so I’ll just summarize my findings and add my opinions below. I would recommend reading the article in reverse though so PWC’s precise analysis isn’t lost: The online notarial procedure, which will be available from August 1, 2022, is an important step towards digitization in corporate law. However, it is unclear whether in practice it will make a significant contribution to the intended acceleration of the formation process. So, while we have heard promises forever from politicians that they would ease the bureaucracy regarding company setup in Germany, this is at least a concrete indication that the government has some modicum of desire to be digital. But it is not much of a change in the status quo. The area is still ripe for disruption by a clever entrepreneur. Most importantly, and we bring this up every time a politician mentions the topic in the statement above, this doesn’t address the main problem with managing a company in Germany, and that’s the time, effort, stress and costs it takes to shut down a legal entity. This, on average, based on my personal knowledge and conversations, takes three to four years. Come startup, but you better not fail in Germany!"
