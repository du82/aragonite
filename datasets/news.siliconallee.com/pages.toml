["https://news.siliconallee.com/2020/10/26/germany-is-going-to-be-the-epicenter-of-worldwide-green-innovation"]
title = "Germany is Going to be the Epicenter of Worldwide Green Innovation"
description = "Necessary cookies are absolutely essential for the website to function properly. This category only includes cookies that ensures basic functionalities and security features of the website. These cookies do not store any personal information."
full_description = "With the dire warnings released last year that we have 10 (to maybe 20) years to meaningfully affect climate change, humanity finally seems to be getting off the proverbial procrastination couch and starting to take real action. We’re also seeing a new focus on sustainability in the technology sector. In fact, we are living through an inflection point in technology’s response to the climate crisis, and we have the power to tip it in a direction for good, and to our benefit. Before 2019, you may have seen more sustainably produced products in your local boutique, dabbled in veganism after watching Cowspiracy or refused plastic takeaway containers more often after seeing countless YouTube videos about the massive plastic trash island in the Pacific. I know I did. But to me some of the first indicators of the new climate movement entering the mainstream were youth-driven activist groups such as Fridays for Future, Extinction Rebellion, the Sunrise Movement and my personal favorite, Ende Gelände. Thank God for young people with the energy, passion and optimism to really start a shake up that was long overdue. The internet celebrity of Greta Thunberg and 4 million people (1.4 Million in Germany alone) joining the 2019 Climate Strike were big indicators that climate activism had entered the public consciousness. But it wasn’t just, or maybe it was partially because of, youth driven climate groups that society really started changing. In the Summer of 2019, the Green Party swept the European Parliament elections in an unexpected “Green Wave.” This sent a clear signal to Brussels that the environment should be top of mind for Europe’s policy making. The Greens didn’t take their mandate lightly and got right to work. If you haven’t been paying attention to European legislative movements, and to be honest, most people don’t, in the last year we have seen huge climate-related policy initiatives somewhat quietly passed in Brussels. European Commission President Ursula von der Leyen beat AOC and her American counterparts to the punch and set into motion the European Green Deal in late 2019 which contains a binding European Climate Law; all with the goal of getting Europe to climate neutrality by 2030."
author = "Silicon Allee UG"
year_published = 2020
