["https://news.siliconallee.com/2020/10/12/focus-on-founders-with-ackeem-ngweya-shariff-vreugd"]
title = "Focus on Founders with Ackeem Ngwenya + Shariff Vreugd - Berlin Tech News from Silicon Allee"
description = "In this interview we talk to Ackeem Ngwenya and Shariff Vreugd, Co-founders of Reframd. These two inspiring entrepreneurs are on a mission to create a more inclusive product line -- one that changes the way eyewear fits Black people's nose profiles."
full_description = "In this interview we talk to Ackeem Ngwenya and Shariff Vreugd, Co-founders of Reframd. These two inspiring entrepreneurs are on a mission to create a more inclusive product line — one that changes the way eyewear fits Black people’s nose profiles. Ackeem: Reframd as an idea was started over three years ago. I started actively working on it mid 2019, Shariff joined at the end of 2019. Shariff: The idea came from Ackeem, who was already working on the project. We met in august 2019 and I joined a few months later. Shariff: After Ackeem explained the project to me, I became an instant fan. I thought, this has huge potential. Ackeem: The start-up team has to be aligned on most things, you can disagree on matters but not on values; Sometimes investors do not get an idea because they fail to emphasize other people’s problems; Perseverance is a key ingredient to success; There will be many failures. Shariff: Team dynamics are really important. It’s key to find like-minded people with different skill sets that complement yours. Starting a business takes more than just coming up with new ideas. In order to execute new ideas, you will find yourself constantly studying new material. As an entrepreneur, you have to be ready to explore new terrain, be open to new possibilities, and not get stuck in yesterday’s practices. Ackeem: Patrice Lumumba, M. C. Escher, Mrs. Pland (my high school English Teacher), Peter Clark (South African Visual Artist), Joy Buolamwini, and Albert Einstein. Ackeem: Learning, improvement and that assumptions don’t necessarily have to be correct the first time. Shariff: Failure plays a very important role in every entrepreneurial success: it’s through failure that you learn and grow. If you aren’t failing you’re not trying hard enough. There will always be a lot of mistakes and failures involved in trying new stuff. Shariff: When you’re curious, you’re present, observing the world around you. This active state of mind can lead to the discovery of new ideas. Curiosity also opens your mind to new possibilities. You have to be comfortable doing outreach and creating new business opportunities. It is important for an entrepreneur to be able to adapt well to changing market conditions and demands. Being self-aware is not only about identifying strengths and weaknesses, but it’s also recognizing what causes you to feel those ways and do those things."
