["https://news.siliconallee.com/2020/04/16/london-and-berlin-look-to-build-bridges-despite-global-challenges-announcing-silicon-allee-x-london-partners"]
title = "London and Berlin Look to Build Bridges Despite Global Challenges: Announcing Silicon Allee x London & Partners - Berlin Tech News from Silicon Allee"
description = "Silicon Allee is proud to announce a year-long events and content collaboration with London & Partners. The partnership will demonstrate the solidarity and collaboration between London and Berlin’s startup communities."
full_description = "The Bridge is a series of articles exploring connections between the European tech capitals of Berlin and London supported through our partnership with London & Partners. Silicon Allee is proud to announce a year-long events and content collaboration with London & Partners. The partnership will demonstrate the solidarity and collaboration between London and Berlin’s startup communities. It was a typical workday in late November 2019. The Silicon Allee campus was bustling with face-to-face meetings and Brexit updates dominated the headlines. The UK was still part of the EU. A global pandemic had not yet swept across the world. This was an era now known as “simpler times.” On that day, Silicon Allee and London & Partners, the promotional arm for London, got together and birthed an idea called The Bridge – a content and events series designed to strengthen and celebrate Berlin and London as Europe’s leading startup hubs. Fast forward to now: the world has changed quite a bit. Recent events have threatened the already strong connections between London and German tech hotspots. As a result, the important ties between the two hubs must be reinforced – now more than ever. Our initial idea with The Bridge has transformed into a collaboration with more focus and purpose than we could have imagined. Silicon Allee is no stranger to sprouting seeds through concrete. We prefer a bit of friction. Friction means that there’s a chance we can make significant positive shifts, even if it’s little by little. As most of us in the startup world know first-hand, when it’s smooth sailing, then there’s probably not enough risk involved. So even though a virus has swept the globe and transformed the way we work and do business, it’s also challenged us in a positive way, and strengthened our original mission with The Bridge. We thought, why not kick this off quarantine style? We’re excited to see what ideas, business models, startups and pivots come out of this crisis in both London and Germany. Entrepreneurs are resourceful and resilient. Just look at the 2008 recession: some of the biggest brands in the world today were founded immediately after."
