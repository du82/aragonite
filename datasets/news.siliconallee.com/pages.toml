["https://news.siliconallee.com/2022/11/23/vc-investing-in-germany-complicated-not-impossible"]
title = "VC Investing In Germany: A Guide for Foreign Investors"
description = "Necessary cookies are absolutely essential for the website to function properly. This category only includes cookies that ensures basic functionalities and security features of the website. These cookies do not store any personal information."
full_description = "This article is published as part of Skytrain – a transatlantic investor community bridging the gap between investors and VC funds in the US and Berlin. Join the network or learn more about what we do here. There are many reasons why Germany is the biggest economy in Europe and the fourth largest in the world. A competitive capital goods exporter, high purchasing power, and efficient vocational education system all contribute. But one of the most recent reasons for Germany’s economic prowess is its drive to become a hub of innovation. Now, Germany is one of the brightest startup hotspots in the world. In 2021, over $100 Billion in venture capital was invested in German startups with Berlin becoming one of the most unicorn dense cities on the continent. With all that growth, it’s no wonder that more and more investors are looking across the pond for their next big deal. But let’s face it. Germany doesn’t have the best reputation when it comes to streamlined bureaucracy. That’s where we come in. In this article, we’re going to give you an overview of venture capital funds in Germany – how they work, what that means for international investors, and the best ways to put your dollars to work in the lucrative German VC market. Venture Capital funds and other alternative investment funds (AIF) – domiciled or distributed in Germany – are regulated by the German Capital Investment Code (KAGB). It’s essentially the German version of an EU directive: the Alternative Investment Fund Managers Directive (AIFMD) – aimed at tightening up regulation of hedge funds, private equity funds and real estate investment funds. The German interpretation of this EU directive by the German Federal Financial Supervisory Authority (BaFin). Remember that acronym – it will come back later in this article and likely never leave you alone. Anyway, the German interpretation of this EU directive is a tad stricter than that of most other EU countries. So a lot of German fund managers have historically taken a more international approach – and set up their funds either onshore (i.e., Luxembourg, the Netherlands, Ireland) or offshore (i.e., Guernsey, Jersey)."
