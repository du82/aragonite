["https://news.siliconallee.com/2019/12/20/solar-electric-car-startup-sono-motors-has-less-than-two-weeks-to-crowdfund-e50m"]
title = "Solar Electric Car Startup Sono Motors has less than Two Weeks to Crowdfund €50m - Berlin Tech News from Silicon Allee"
description = "A Munich-based startup has dumped prospective investment deals to embark on an ambitious — some say impossible — crowdfunding campaign to get its solar electric vehicle into production. But will it make it?"
full_description = "This article was produced by Silicon Allee for Sifted.eu as part of our partnership to give German tech news a wider audience. Some think Germany’s Sono Motors will need a Christmas miracle to successfully crowdfund €50m by the end of the month. The company’s founders, though, remain confident. The Munich-based startup’s target is ambitious. It has given itself less than a month to raise the €50m it needs to get its solar electric vehicle (SEV), the Sion, onto Europe’s roads — and, with 10 days left, still needs €33m more. Cofounder and chief executive Jona Christians says that if they don’t raise the full amount the outcome is straightforward. Crowdfunding wasn’t Sono’s only option, however. The founders were offered contracts by and “had discussions that went very well” with prospective investors — but realised this would have required them to ditch their product. “We didn’t say no to investors. We said no to those investors who didn’t have an interest in bringing the Sion onto the street,” Hahn explained ahead of a crowdfunding event at Berlin’s MotionLab. “We cannot stand in front of the 10,000 reservation holders, the people, and tell them we sold the company for the money, but you do not get your car. And it’s not the easy way. It’s by far not the easy way,” Christians says. Europe is “obsolete” and the battle to shape the future of transport is in the US, says Einride’s CEO The Sion is not a flashy car. It’s a four-door, family-friendly hatchback with a trailer hitch for a price tag of €25,500. Slicked in solar cells, the Sion also only comes in one colour — black. Before the campaign Sono Motors received 10,000 pre-orders and conducted over 13,000 test drives across Europe with its current prototype. It has a 255km range, a bidirectional charger (Sion can store your energy “and give it back to you”) and sharing services through its app, goSono. Hahn compares the sharing services to Airbnb: instead of the car sitting unused while on vacation, its owner can lend it to someone for a specified time."
