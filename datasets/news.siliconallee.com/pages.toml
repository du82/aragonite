["https://news.siliconallee.com/2022/12/01/cambridge-grad-founder-taming-chronic-pain"]
title = "The Cambridge Grad and Founder on a Mission to Tame Chronic Pain"
description = "Necessary cookies are absolutely essential for the website to function properly. This category only includes cookies that ensures basic functionalities and security features of the website. These cookies do not store any personal information."
full_description = "Nicola is originally from Austria and studied Entrepreneurship at The University of Cambridge and MSc in Healthcare & Design at Imperial College London. She’s now a multi-award-winning entrepreneur and founder of Happyr Health. She’s not only successful, but she’s also really lovely and delivered the interview with so much serenity and poise, you’d never know how much she’s got going on behind the scenes. Nicola revealed her secrets to how she keeps it so cool, calm and collected while having so much on her shoulders. She seriously knows her stuff and is building a product backed by thorough and extensive healthcare research, testing and development. There’s an image and expectation in the entrepreneurship field that you have to work hard and work is all you should do. But if you leave out life, you miss out on a lot of opportunities for creativity. Happyr Health’s overall goal is to provide self care tools for teenagers and young people with chronic pain. Being a migraine sufferer since she was young, Nicola knows first hand the struggle to live a normal daily life and how few others truly understand what’s going on. She explained how the biggest challenge with chronic pain management is that it’s not just physical pain, ‘it’s also emotional and social challenges because you feel pain all the time, and as a young person your life changes all the time, there’s so much happening and you’re trying to find your place in the world’. So there is a need to not only treat the physical pain, but also the the emotional pain. Our core product is an app, Tamer, which is all about taming your pain. You get personalised self-care exercises that are recommended from research studies, mainly based on cognitive behavioural therapy and following those you’ll learn more about yourself and how they can help you, so you’re building your self-care rituals. Nicola and her co-founder Cornelius met at another startup, they found they worked together well, had complimentary skills and shared the same vision, ‘it came together well’, Nicola said."
