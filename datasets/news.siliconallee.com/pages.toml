["https://news.siliconallee.com/2020/07/22/focus-on-founders-nicolas-heymann"]
title = "Focus on Founders with Nicolas Heymann - Berlin Tech News from Silicon Allee"
description = "Necessary cookies are absolutely essential for the website to function properly. This category only includes cookies that ensures basic functionalities and security features of the website. These cookies do not store any personal information."
full_description = "In this interview we chat with Nicolas Heymann, co-founder of Heritage Type, a platform for artistic graphic design. He’s an introverted extrovert who believes in positive psychology and quickly killing things that don’t work. We were both running our own businesses for years and wanted to build something more scalable together. We’ve tested a lot of things and my co-founder was working in the design industry. We created a digital product that people liked and that at the same time would have good scalability. There are many things. I think focusing on something sustainable is important since founding something mostly ends up a marathon. Also it’s always good to know how to sell anything. It’s very important to stay on track, not to get distracted. Kobe Bryant, Karl Lagerfeld, Clayton Christensen, Jean-Noël Kapferer, Shawn Achor, and Sundar Pichai I guess it’s important and helpful to learn how to fail professionally. Having operational definitions for everything helps a lot. Give anything a certain time period and then just kill things that don’t work. It depends. Personally, I’m more introverted and I don’t disclose any information about myself, but I can be extroverted and sell to other people. Back in kindergarten I was trying to sell my own lego construction sets packed in egg cartons. People didn’t really understand what I was doing, but I actually put real effort in. I even tried to write the manuals as far as I could at the time. Everyday should be a good one. Exceptional good days are mostly driven by good people, good conversations, new learnings, and new experiences. It doesn’t tell any personal value, like that I‘m exceptionally motivated and a lot of fun to be around. Like how things are at university I once ended up on a really crazy party. It turned out later on it was an event by one of the outlaw motorcycle clubs. I always try to encourage people to have more interactions together. I travelled a lot and I feel that in western countries the majority can’t speak to anyone new. It almost feels like people are scared of each other that they would lose something. In fact we can only gain from these experiences. Just remember ‘everyone knows something you don’t know’. I’d just say go crazy, speak to anyone, help people, ask for help and do things before you regret not having tried them."
author = "Silicon Allee UG"
year_published = 2020
year_updated = 2022
