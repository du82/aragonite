["https://news.siliconallee.com/2023/07/13/medtech-ai-powered-solution-by-formly-ai"]
title = "Simplifying Compliance in the MedTech Industry: The AI-Powered Solution by Formly.ai - Berlin Tech News from Silicon Allee"
description = "Discover how Spencer and his team at Formly.ai are revolutionizing the way medical device manufacturers navigate regulatory documentation with their innovative software platform. I interviewed Spencer Todd, from Formly, who told us all about his path to founding and developing their product. A bit of background In the dynamic realm of healthcare technology, Spencer is […]"
full_description = "Discover how Spencer and his team at Formly.ai are revolutionizing the way medical device manufacturers navigate regulatory documentation with their innovative software platform. I interviewed Spencer Todd, from Formly, who told us all about his path to founding and developing their product. In the dynamic realm of healthcare technology, Spencer is a visionary entrepreneur dedicated to revolutionizing the medical device industry. As the co-founder and CEO of Formly.ai, he is leveraging his background and using artificial intelligence and machine learning to drive transformative change in the MedTech industry. The traditional and manual process for registering medical devices means companies often face efficiency, accuracy, and compliance challenges. Recognizing these limitations, Spencer founded Formly.ai with a mission to streamline and simplify the medical device compliance process. “I’m a co-founder of Formly.ai, and I was born in Annapolis, Maryland, just outside of Washington, DC. I attended school in Charleston, South Carolina, where I currently live. I did my PhD in Baltimore, Maryland, studying toxicology, specifically neurotoxicology and how pesticides affect neurodevelopment.” “While working in the lab, I realized that I didn’t want to spend my entire career there. I started working at the FDA in Washington, DC, where I gained firsthand experience with device regulatory processes. I observed how much companies paid to complete regulatory documentation, and that’s when the idea for Formly started taking shape.” “Delivering newspapers when I was 12. I had to go collect money from people for newspaper subscriptions so it kind of forced me to talk to people which I think helped to hone my people skills from the very beginning”. “I actually met our CTO Severin Hoegl, I met him through Silicon Allee. He’s great because he has worked in regulated healthcare for a while. Him and I hit it off and understood the issues that people were facing”."
