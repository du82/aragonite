["https://news.siliconallee.com/2020/06/23/focus-on-founders-an-interview-with-jonas-luthke-ina-wortmann"]
title = "Focus on Founders with Jonas Lüthke + Ina Wortmann - Berlin Tech News from Silicon Allee"
description = "In this interview, we talk to the co-founders of TravelSpend, Jonas Lüthke and Ina Wortmann. As a couple, they share many things, including their passion for travel, independence, and product development. Their app began as a side project but, after almost immediate traction, they decided to take it to the next level.  What are your specific […]"
full_description = "In this interview, we talk to the co-founders of TravelSpend, Jonas Lüthke and Ina Wortmann. As a couple, they share many things, including their passion for travel, independence, and product development. Their app began as a side project but, after almost immediate traction, they decided to take it to the next level. Jonas: We both have a strong product focus. When it comes to development, I usually work on our Android app. I’m also doing most of the design work. Ina: The iOS app is mainly my responsibility. Apart from that, we usually cover all areas together. We really like the idea that both of us can do and decide everything together. Jonas: Ina is my co-founder and my life partner too. We met at university in Hamburg and we’ve been together for over nine years. Jonas: We founded our company a few months ago in March, 2020. But the idea for TravelSpend was born some time ago during a trip through Southeast Asia. In 2016, after spending two years in London we quit our jobs to take some time off and travel for a while. We had saved up € 6,000 each and wanted to travel for at least six months. Soon after starting our adventure in Hanoi, Vietnam we realized that we needed to keep track of our spending to make sure we stick to our budget. We searched the App Store for a good travel budgeting app but didn’t find anything decent. So we decided to build an app ourselves. Jonas: Initially, TravelSpend was just a small side project. But when we published it on the App Store, we soon got some traction and a lot of positive feedback from users. This eventually motivated us to go full-time and grow it to the next level. Ina: Two things were important when starting the company. On one hand, I wanted to have the freedom to do whatever I wanted to. If I feel like I want to work from another place, I want to be able to do that. On the other hand, it makes a huge difference when you are working on your own projects. You have more responsibilities and you can choose what directions to take your projects and ideas in."
