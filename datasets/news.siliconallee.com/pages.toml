["https://news.siliconallee.com/2021/03/08/what-international-womens-day-means-to-me"]
title = "What International Women's Day Means to Me - Berlin Tech News from Silicon Allee"
description = "Necessary cookies are absolutely essential for the website to function properly. This category only includes cookies that ensures basic functionalities and security features of the website. These cookies do not store any personal information."
full_description = "Representation matters, from seeing Kamala Harris as the first Black, Indian, and Woman to become US Vice President, to seeing 14 diverse women receiving funding and support through our Berlin Founders Fund — these moments give me hope. On International Women’s Day, I honor all of the remarkable women in my life who are navigating business and family, empowering other women, leading with empathy, and learning to listen to their intuition, rather than following the status quo. As Head of Brand Communications at Silicon Allee and the Berlin Founders Fund, I have the privilege of supporting a portfolio that comprises 47% women. At BFF, we believe that representation and a seat at the table are essential to fight systemic gender bias and racism. The ‘glass ceiling’ can be seen as both an institutional limitation to progress and a figurative one from not being able to “see” ourselves in a certain role. Today I want to celebrate the women of BFF and acknowledge all of the women who have paved the way to empower the next generation to see themselves differently, push boundaries, and build a better future. I look forward to more women leading conscious and sustainable businesses, working together to challenge systemic oppression, and dismantling the patriarchy. In 2019, Berlin’s parliament approved a bill to make International Women’s Day a public holiday, making Berlin the first of Germany’s 16 states to take this step. Go Deutschland! You might be asking, why in 2021 do we still need this day? Well here’s a not-so-fun fact: Only 4.9% of Fortune 500 CEOs and 2% of S&P 500 CEOs are women. And those numbers are declining globally. In Germany, specifically, the numbers are even bleaker. Last year, to drive more women into leadership roles, the parties in Angela Merkel’s coalition agreed to introduce a mandatory quota for women in senior management roles at listed German companies. Women currently make up only 12.8% of the management boards of German companies listed on the blue-chip Dax index, according to a recent survey by the Swedish-German AllBright Foundation. To put this in perspective, according to the Financial Times, the proportion of women in leadership roles is 28.6% in the US, 24.9% in Sweden, and 24.5% in the UK."
