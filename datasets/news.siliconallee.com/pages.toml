["https://news.siliconallee.com/2020/04/16/hackathons-take-aim-at-coronavirus"]
title = "Hackathons Take Aim at Coronavirus - Berlin Tech News from Silicon Allee"
description = "This article was produced by Silicon Allee for Sifted.eu as part of our partnership to give German tech news a wider audience."
full_description = "This article was produced by Silicon Allee for Sifted.eu as part of our partnership to give German tech news a wider audience. “We invited 43,000 people to Slack, and the way we planned on doing it didn’t work out,” says Anna Hupperth, head of communications for Tech4Germany — one of the organisers of the online event dedicated to hacking solutions for Covid-19. “Basically there were 20,000 people standing in front of our ‘door’ and we couldn’t let them in.” While not ideal, it was a sign of just how in-demand the event was in the tech community — a little example of the explosive popularity of hackathons in recent weeks as the world scrambles to find solutions to issues around coronavirus. Hackathons were made popular decades ago by the software community as communal, all-night sessions working insanely hard on specific problems. Today, with much of the world on lockdown, the sessions are online but the spirit remains. Last week saw The Global Hack, where 15,000 coders, engineers and designers came together to find ways to help in the pandemic. Famous supporters included LinkedIn’s Reid Hoffman and Sam Altman, former president of Y-Combinator. Other recent hackathons include one organised by Massachusetts Institute of Technology (MIT) in the US, with its “Beat the Pandemic” series of virtual hackathons, and one by WHO Africa. Hack from Home is another global hackathon initiated by Dataswift, partnering universities and NHSX. The European Commission is also planning its own pan-European hackathon, #EUvsVirus, after witnessing the success and participation in hackathons across its member states, including Estonia, Finland, Poland, Italy and Belgium. Inspired by a similar event in Estonia, WirVsVirus came together in a matter of days. Tech4Germany — the technology task force for the German federal government — brought the idea to the attention of the federal chancellery. It soon spiralled into an initiative backed by the entirety of the federal government, with seven other participating organisations."
