["https://news.siliconallee.com/2023/05/05/luise-and-dana-taking-on-endometriosis"]
title = "Shining a Light on Women's Health: Luise Müller and Dana Aronovici's Journey on Taking on Endometriosis - Berlin Tech News from Silicon Allee"
description = "In a world where women’s health is often overlooked or underfunded, two women have been on a mission to change the game. Meet Dana and Luise, two of our Berlin Founders Fund founders of FemXX, a health tech startup dedicated to empowering women with Endometriosis. Endometriosis is an often very painful chronic disease where tissue […]"
full_description = "In a world where women’s health is often overlooked or underfunded, two women have been on a mission to change the game. Meet Dana and Luise, two of our Berlin Founders Fund founders of FemXX, a health tech startup dedicated to empowering women with Endometriosis. Endometriosis is an often very painful chronic disease where tissue similar to the linen of the uterus grows somewhere else and creates pain and tension there. The most typical symptoms are really painful cramps during your menstruation, but also, bladder problems, digestion problems, and most of all, infertility. Endometriosis is in 50% of all infertility cases, Luise explained to me during our interview. The co-founders realized that women with endometriosis have a lot of experiences and knowledge to share, but they don’t have a voice and their data is not available. Their product is designed to offer support to countless women who are grappling with the challenges of endometriosis. It’s a blend of a compassionate community and an extensive database of information. By gathering and organizing the first-hand experiences of women with this disease, their platform enables users to search and filter the database, allowing them to draw comparisons and gain emotional support in the shared experiences of others. This invaluable resource serves as a beacon of hope for women with endometriosis, providing them with the support and guidance they need to navigate their personal journeys. “We connected right away over our passion for feminism. We want to create a more equal world where people are not left out or not listened to because of their gender or whatever attributes. That really connected us. How is it possible that’s such a disease that is affecting so many people is so underrepresented? The topic of underrepresentation really got us hooked!” Dana, who originally comes from Italy but was born in Israel, has a Computer Engineering Bachelor’s degree from Italy and a Master’s degree in Robotics from Switzerland. Her interest in the medical field was sparked by her previous job, where she worked in a company that produced robots for the rehabilitation of paralyzed patients. Luise, on the other hand, previously worked in the chocolate confectionary industry and has experience in building communities, before co-founding FemXX."
author = "Silicon Allee UG"
