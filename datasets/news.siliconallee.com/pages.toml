["https://news.siliconallee.com/2023/08/10/actors-entities-and-temporal-workflows"]
title = "Actors, Entities, and Temporal Workflows - Berlin Tech News from Silicon Allee"
description = "This article was written by Andrew Fitz Gibbon at Temporal.ai. Find out more via their website. System design patterns exist to make applications easier to write. Think MVC for user-facing applications, circuit breakers for traffic routing, CQRS for data management, or “12-factor apps” for, well, everything. Most of these patterns are “technology first” in that […]"
full_description = "System design patterns exist to make applications easier to write. Think MVC for user-facing applications, circuit breakers for traffic routing, CQRS for data management, or “12-factor apps” for, well, everything. Most of these patterns are “technology first” in that they’re meant to alleviate and mitigate shortcomings in our infrastructure: no single server can handle an infinite number of requests, so we need design patterns like load balancing and circuit breaking and models like client-server or peer-to-peer architectures. But other patterns and models do apply differently depending on the domain. One example is the Actor Model. Like the fundamental tenet of “everything is an object” in object-oriented programming, the Actor Model presumes that everything is an actor. At their most basic, Sctors accept and respond to messages, maintain state, and can create other Actors. This blog post will give a short primer on the Actor Model and then show how to build Temporal Workflows that act like Actors. The Actor Model came about in part to make it easier to build and reason about highly parallel systems in early (1960s and 70s) AI research. As you might expect, one of the biggest challenges with these highly parallel systems is properly managing the global state that every process, thread, or other unit of execution can access concurrently. Two-phase commit, leader election, global mutexes, deadlock detection, and many other algorithms start to haunt your memories. All of these come about (as it can for the Actor model, too) because concurrency and parallelism are facts of our computing lives. These terms (parallelism and concurrency) come up a lot, always together, and always confusingly; let’s take a moment to clarify what we mean by them—this will become important when we get to Actors on Temporal later in this post. My colleague Sergey wrote a blog post a couple of years ago imploring everyone to stop using the term “Actor,” as it’s a term that comes with “a minefield of conflations.” But at the core, Actors are defined as being able to do three things. They:"
