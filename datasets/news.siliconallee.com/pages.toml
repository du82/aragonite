["https://news.siliconallee.com/2020/06/30/is-germany-ready-for-mental-health-tech"]
title = "Is Germany Ready for Mental Health Tech? - Berlin Tech News from Silicon Allee"
description = "This article was produced by Silicon Allee for Sifted.eu as part of our partnership to give German tech news a wider audience."
full_description = "This article was produced by Silicon Allee for Sifted.eu as part of our partnership to give German tech news a wider audience. It takes about 20 weeks, on average, to begin treatment from a licensed therapist through the German healthcare system. For non-native German speakers, who make up a large portion of Berlin’s vibrant international population, it can be an even bleaker process trying to find mental health support in English or in their mother tongue. “You have to be really fortunate to find [a psychologist] who can take you if you want the insurance to cover [treatment],” clinical psychologist Johanne Schwensen told Sifted. “Plus, the health insurance providers in Germany are also only obliged to cover the treatment of mental health issues that are both urgent and severe.” But it’s not just the insurance system that those looking for mental health support come up against; there’s also the stigma. “The topic of mental health at work has been a taboo for too long,” says Lisa Meyer, marketing director at Olaf, a wellbeing platform for remote employees based in Berlin. “But the Covid-19 pandemic might finally help break the mental health stigma. “Everyone has felt the impact of isolation, longer working hours at home and troubles separating professional and personal life in the new reality. As a result, businesses start to acknowledge that it’s ok not to be ok.” The Covid-19 pandemic has increased the need for — and visibility of — digital mental health services across Europe. Swedish healthtech company Livi saw demand for its mental health services increase by 50% in Sweden since the start of the pandemic, while in the UK, 79% of businesses reported an increase in requests for mental health support from employees. Meanwhile in Germany, where mental health issues have for a while now been the second biggest cause of workplace absenteeism, there’s a new crop of mental health startups – the vast majority of them based in Berlin — ready to provide their services."
author = "Silicon Allee UG"
