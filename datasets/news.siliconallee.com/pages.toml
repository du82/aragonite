["https://news.siliconallee.com/2020/04/09/focus-on-founders-an-interview-with-johanne-schwensen"]
title = "Focus on Founders with Johanne Schwensen - Berlin Tech News from Silicon Allee"
description = "Necessary cookies are absolutely essential for the website to function properly. This category only includes cookies that ensures basic functionalities and security features of the website. These cookies do not store any personal information."
full_description = "In this interview we talk to Johanne Schwensen, CEO of It’s Complicated, extroverted entrepreneur, mother of two, ex-techno DJ and practicing psychologist. We are four. Two therapists who came up with the idea and two developers who we got on board with the idea, actually just through meeting over lunch one day. Their web agency is on the floor above our therapist practice, so our founding team is very much the product of convenience and maybe even, to use a Jungian term, synchronicity! End of 2017. The idea came during conversations with two of the people I’m closest with – my husband, Jesper, and my business partner, Jakob. We were sharing our frustrations about the user-unfriendliness of the therapist directories available to us and then the idea started brewing. Initially, we wanted my husband, who is a software developer, to build the platform for us, but he joined a web-agency and unfortunately didn’t have the time. It came out of a simple need to please! Most therapists are inherently people-pleasing and so Jakob and I hated that we couldn’t say yes to all of the therapists who wanted to work with us at Mittelweg 50. It also pained us that we couldn’t match all of the client referrals we received with appropriate therapists, because the therapists working with us already had full practices. When It’s Complicated went live, we were finally able to give the therapists and therapy-seekers who contacted us the help they needed. We weren’t restricted to our brick-and-mortar practice, but could build and grow a supportive and diverse community and online marketplace for therapists. A lot of patience and agility is required. You have to be prepared to have your mind changed constantly. For instance, I initially assumed that therapists’ biggest concern and need is getting more clients, but by talking to my therapist colleagues and conducting polls I found out that they were just like me – they regarded community over anything else. They can be real people in your life or people whose careers you follow and have benefited from by reading their words, watching their journey, etc."
author = "Silicon Allee UG"
