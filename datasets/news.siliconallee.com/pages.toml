["https://news.siliconallee.com/2020/07/08/focus-on-founders-an-interview-with-deniz-ficicioglu-jacob-von-manteuffel"]
title = "Focus on Founders with Deniz Ficicioglu and Jacob von Manteuffel - Berlin Tech News from Silicon Allee"
description = "In this interview we chat with the co-founders of betterfish, Deniz Ficicioglu and Jacob von Manteuffel. They met serendipitously over their shared passion for seaweed and a vision to do something different. As co-founders they have complimentary skill sets and understand that building a startup requires fast decision-making, ambition, and a bit of naiveté."
full_description = "In this interview we chat with the co-founders of betterfish, Deniz Ficicioglu and Jacob von Manteuffel. They met serendipitously over their shared passion for seaweed and a vision to do something different. As co-founders they have complimentary skill sets and understand that building a startup requires fast decision-making, ambition, and a bit of naiveté. Deniz: In 2018 I was working at a food innovation hub in Berlin, collaborating with innovators who want to make a difference. Jacob: My project partner at that time and I were just about to embark on our journey to shoot a documentary on seaweed farming and we got introduced to Deniz. Deniz: Half a year later I quit my job and got back in touch through LinkedIn. Jacob was looking for a Co-founder and we just started working together, no contract, no expectations. Deniz: We’re really fascinated with seaweed because it’s a zero input crop and it doesn’t require much resources to grow. We want to make seaweed a mainstream ingredient in Europe and find the biggest leverage to do this. Betterfish is our idea to achieve this. We couldn’t accept that people aren’t eating seaweed on a regular basis. Deniz: Every day has a crazy high or crazy low, otherwise it’s not an entrepreneurial journey. It’s not smooth sailing all the time. Deniz: We don’t have any mentors but we’re actually thinking of creating an advisory board for ourselves. So if you feel like you can handle these two seaweed nerds, shoot us a message at hello@betterfish.de. Jacob: I don’t have any mentors but I’m open for someone to teach me something! A lot of teenagers have stars on their wall but I wasn’t like that. I never really had a figure or great example of someone I would look up to or a mentor. I still don’t have that. Deniz: It would be fun to have Guy Raz, the host of How I Built This podcast, Ferdinand von Schirach, Angela Merkel… Deniz: You only learn whether something works out or not when you make decisions. If you make these decisions early on in your process you also learn early on and move on quickly. Don’t get hung up on failure."
