["https://news.siliconallee.com/2021/02/09/focus-on-founders-with-stefanie-raffelsieper-nayara-branco-saeuberlich"]
title = "Focus on Founders with Stefanie Raffelsieper + Nayara Branco-Saeuberlich - Berlin Tech News from Silicon Allee"
description = "We Zoomed with Stefanie and Nayara of branayama, a word play on the breathing technique in yoga called Pranayama. It is the life energy that translates into a holistic attitude on living life powerfully and feeding yourself beyond the physical body and mind. Branayama is on a mission to empower mothers to care about themselves as much as they care about their babies."
full_description = "We Zoomed with Stefanie and Nayara of branayama, a word play on the breathing technique in yoga called Pranayama. It is the life energy that translates into a holistic attitude on living life powerfully and feeding yourself beyond the physical body and mind. Branayama is on a mission to empower mothers to care about themselves as much as they care about their babies. SR: I am the Founder – I am leading on the product, creating the brand and overall vision, basically overseeing everything. NBS: From Brazil, but lived in the US for over 20 years. I would say I am a Brazilian child and an American adult. I’ve been in Berlin for almost 5 years. NBS: It’s been a short and intense time, but I’ve learned that there is no app or software in the world that will replace working together in the same room as your colleagues. Those moments that Steffi and I manage to be together are the most productive and that’s super interesting. It’s something to always keep in mind, how can we stay creative and collaborative. SR: I worked in food for over ten years pushing for sustainable change. I consulted big companies and realized that sustainability for them was a trend to follow rather than something they were truly convinced about. So I became more and more frustrated. At the same time I became a mom and was dealing with a newborn baby and the messiness of breastfeeding. I hated the ugly nursing bras and the pads and was shocked that the industry lets women deal with this completely outdated system that on top produces an enormous amount of waste. I knew I had to do something about it. So I started to develop a prototype. SR: Both of my grandmothers. My dad’s mother had to raise her three kids as a single mother. She worked at the post office stamping letters. When I was a little kid, she was still working there. Being a mom, being a woman, not coming from a wealthy background it is such a privilege to be a founder. One thing I also learned in the founding process, I have never worked with a team. It was always me working with freelancers. This is the first time I am building this team. And I feel like they are my mentors. They inspire me."
