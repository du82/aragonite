["https://news.siliconallee.com/2020/09/02/vaccines-video-care-and-the-medtech-revolution"]
title = "Vaccines, Video Care and the Medtech Revolution - Berlin Tech News from Silicon Allee"
description = "In the last six months, Medtech has claimed its space in the global spotlight. We’re celebrating this flourishing sector by highlighting some of the growing Medtech companies in London and Berlin."
full_description = "The Bridge is a series of articles exploring connections between the European tech capitals of Berlin and London supported through our partnership with London & Partners. In the last six months, Medtech has claimed its space in the global spotlight. We’re celebrating this flourishing sector by highlighting some of the growing Medtech companies in London and Berlin. Living in the midst of a global pandemic has shone a spotlight on Medtech in ways we wouldn’t have otherwise seen in our lifetime. With every glance at a person wearing a mask, every public cheer for healthcare workers, every update about Covid-19 vaccines and every account of medical technology that keeps our loved ones alive, we gain a deeper understanding of just how important medical innovation is in our world. In The Bridge series, we aim to highlight the unique strengths of London and Berlin as startup hubs while finding common ground between the two. The Medtech sector perfectly encapsulates these realities, as both cities build their own vital medical ecosystems and nurture companies that are changing the global healthcare landscape. As Europe moves forward in pandemic times, we want to bring the entirety of Medtech back into the spotlight: What are some of the most intriguing areas of focus right now, and which companies are rising to the top? How are London and Berlin ideal grounds for building Medtech solutions that positively change the world? Fueled by four of the world’s top 50 universities and over 30 VC’s specializing in life sciences, London’s startups are consistently primed to become pioneers in Europe’s cutting edge Medtech. The city is home to over 350 Medtech companies, over half of which operate in digital health. “London is truly a global leader in cutting-edge health technologies, where biology meets data and AI. We are one of the few places in the world fully ready to take on the life sciences challenges of the future,” said Neelam Patel, CEO of MedCity – an organization which represents the life sciences cluster of London and the Greater South East of England."
