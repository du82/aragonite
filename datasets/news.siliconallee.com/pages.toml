["https://news.siliconallee.com/2024/01/30/berlin-climate-tech-startup-bluelayer-secures-10m"]
title = "Berlin Climate Tech Startup, BlueLayer, $10M Funding, Carbon Credits"
description = "Necessary cookies are absolutely essential for the website to function properly. This category only includes cookies that ensures basic functionalities and security features of the website. These cookies do not store any personal information."
full_description = "Under the Climate Action Programme 2030, the German government made a binding undertaking to reduce greenhouse gas emissions by 55% by 2030. Large companies are under pressure to achieve net-zero commitments. In their pursuit of net-zero goals, companies buy carbon credits from the market to neutralize and balance their environmental impact. Carbon credits are created and sold by companies who are developing carbon avoidance or removal projects. BlueLayer’s innovative software platform is helping the companies and people scaling those carbon reducing projects. In an exclusive interview, I spoke with two of the three co-founders, namely Alexander Argyros and Vivian Bertseka, with the third co-founder being Gerardo Bonilla. Operating in stealth mode since its establishment in 2022, BlueLayer, headquartered in Berlin, has successfully raised $10m as part of two funding rounds. Their most recent seed round of $5.6m was led by European Software VC Point Nine, and supported by a group of families and individuals with expertise in carbon markets. Their pre-seed round, held in 2022, was raised by over 50 contributors, including notable figures from Generation Investment Management, ICE NYSE, BloombergNEF, and others. “We partnered with two of the largest organizations issuing carbon credits and designed our product for their needs through regular calls and feedback sessions. Today we have the most comprehensive end-to-end platform meeting the real needs of project developers.” Alexander Argyros, CEO. BlueLayer is also supported by over 50 industry veterans, subject matter experts and climate leaders, who together form a supportive community available to their customers. “While it’s not the panacea to decarbonise the economy, we do believe that the carbon project developer market will (and needs to) grow tremendously to reach our decarbonisation goals. We are looking forward to supporting Alexander, Vivian, Gerardo, and their team as they build a core infrastructure for this important industry”. Louis Coppey, Partner at Point Nine."
