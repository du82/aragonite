["https://news.siliconallee.com/2021/10/28/silicon-allee-offers-residency-program-to-help-japanese-scaleups-enter-europe"]
title = "New Soft Landing Program for Startups coming into Germany & Europe"
description = "Necessary cookies are absolutely essential for the website to function properly. This category only includes cookies that ensures basic functionalities and security features of the website. These cookies do not store any personal information."
full_description = "In 2019 the EU and Japan struck a deal to create the most extensive global trade zone. Many of us missed that news because we were caught in a media storm about BREXIT and the US/China trade war. The deal removed 99% of tariffs between the two markets who share 40% of global trade. This deal likely means that we’re going to see a lot more Japanese companies eyeing European expansion. Here at Silicon Allee, we’re very excited to be part of this new era, which is why we have partnered with the Japan External Trade Organization (JETRO) to pilot our new soft landing program for internationally expanding startups, the Residency. ‘I’m excited for Residency to become a bridge for global startup ecosystems and startups to expand to Europe, and it’s great to have a founding partner like JETRO. Berlin is the startup capital of Europe, so it’s going to be the first to experience this new wave of Japanese startups coming to Europe.’ Silicon Allee The first six-month program starts in October and sees us continue our mission to ‘build bridges and provide access’ for startups so they can get to their next stage. Specifically, the Residency soft landing program will welcome six Japanese ‘scaleups’ and help them crack the German market. Making headway in new markets is notoriously hard. And the absence of a strong network or deep understanding of how different cultures do business can be the failing point for any international expansion, regardless of how good the tech might be. ‘Over the last decade, we have amassed a robust network in Berlin, throughout Germany, across the EU, and into other continents. From VCs to founders and C-Level decision-makers at big corporations to industry experts, we can connect and facilitate meetings and mentorship that can have a massive impact on a startup’s future success. This ability is what launched the idea for the Residency.’ JETRO also saw the value in accessing our network to help some portfolio startups prepare for a successful first step into the European market. As a result, Silicon Allee and JETRO have created our first Residency program specifically for the Japanese startups, participants of the X-HUB Tokyo program, which the Tokyo Metropolitan Government organizes, that will feature mentoring, meetings, and targeted business introductions."
