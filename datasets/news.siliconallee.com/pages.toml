["https://news.siliconallee.com/2020/07/30/powered-by-ai-driven-by-people-protecting-identities-in-an-increasingly-connected-world"]
title = "Powered by AI, Driven by People: Protecting Identities in an Increasingly Connected World - Berlin Tech News from Silicon Allee"
description = "The Bridge is a series of articles exploring connections between the European tech capitals of Berlin and London supported through our partnership with London & Partners."
full_description = "The Bridge is a series of articles exploring connections between the European tech capitals of Berlin and London supported through our partnership with London & Partners. Berlin and London are home to cutting edge AI companies working to meet privacy demands for digital identities and online activity. Privacy and security may not be the sexiest of topics in the tech world, but they’re certainly among the most important when it comes to thinking about our digital future. Data has become both a building block of our society and a precious resource to be harnessed, but in the wrong hands, it can create lasting, irreversible damage. Knowing this, we should all be asking ourselves: Who should control the sheer volume of data that many of us produce on a daily basis, how can we ensure it’s not used against us and how can we use it for greater good? When it comes to answering these tough questions, the lines are often blurred. That’s why AI companies working in the privacy space are so vital. And the more we dig into their inner workings, the more fascinating they become. London and Berlin are both home to thriving AI ecosystems, with companies specifically addressing these global challenges through data-driven tech. We spoke to several companies working towards sustainable, AI-driven privacy solutions in both cities, uncovering some of their stories, motivations and direction. Germany’s rich research, development and technical landscape produces a vibrant interdisciplinary AI ecosystem. More than 200 AI companies currently generate a turnover of €0.5bn, and this number is set to rise to €2bn by 2025. Two of the region’s standout companies working on privacy solutions – Ocean Protocol and Merantix – gave us a peek at their inner workings. The founders of Ocean Protocol – a company pioneering decentralized data marketplaces – are no strangers to privacy and security innovation. In 2013, they founded ascribe.io to put intellectual property on the blockchain. Their pivot into data decentralization and privacy felt like a logical next step when considering the importance of the new “Data Economy.”"
