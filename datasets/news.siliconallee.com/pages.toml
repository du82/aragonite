["https://news.siliconallee.com/2022/08/31/navigating-german-investment-syndicates"]
title = "Navigating the World Of German Investment Syndicates: A Guide For VCs - Berlin Tech News from Silicon Allee"
description = "Necessary cookies are absolutely essential for the website to function properly. This category only includes cookies that ensures basic functionalities and security features of the website. These cookies do not store any personal information."
full_description = "This article is published as part of Skytrain – a transatlantic investor community bridging the gap between investors and VC funds in the US and Berlin. Join the network or learn more about what we do here. On July 5, 2022, we met with Niklas Jansen, co-founder of Blinkist and – since 2018 – angel investor in primarily pre-seed and seed companies. Over the last year he’s focused heavily on bringing together an international investor syndicate here in Berlin. In the last 6 months (at the time of writing) Niklas and his syndicate have invested in 6 companies with around €250,000 – €500,000 per deal. Some of whom are already raising follow on rounds – which, given the current market environment, is pretty amazing stuff! A Syndicate is a group of investors that pool their funds via an SPV in order to make an investment. The Syndicate Lead is the person responsible for organizing the syndicate. An SPV is a “Special Purpose Vehicle”; a legal entity set up for a specific purpose. In this case, it’s used to pool funds from a syndicate of multiple investors in order to purchase shares in a startup. You can think of it as a fund set up to do a single deal. Another thing you need to know is that it will require some organizing. You should definitely have a ball-park figure in mind when you approach both the founders and your investment syndicate. The SPV can take the form of a limited partnership, limited liability company or corporation. Most German SPVs are registered as a limited liability company (GmbH), likely because it’s the most flexible and easiest to form. Plus, foreign nationals can own 100% of the shares. The procedure for setting up an SPV is fairly simple (by German standards). Even so, we recommend getting legal advice from a professional lawyer. There are also several software providers who can do all the heavy legal lifting and help set up syndicates for you. Stay tuned for our review of those companies soon. When it comes to pitching the founders you want to invest in, transparency is key. Make sure the founders know exactly what a syndicate is and how it works."
author = "Silicon Allee UG"
