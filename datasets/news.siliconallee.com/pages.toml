["https://news.siliconallee.com/2014/12/08/sony-learning-information-security-lessons-the-hard-way"]
title = "The Sony Pictures Hack and Learning Information Security Lessons the Hard Way - Berlin Tech News from Silicon Allee"
description = "Necessary cookies are absolutely essential for the website to function properly. This category only includes cookies that ensures basic functionalities and security features of the website. These cookies do not store any personal information."
full_description = "This column is intended for a business audience, and lacks technical details – it is the author’s intent to communicate sound security strategies to C-level personnel tasked with making decisions about them: CIOs haven’t been around for very long, and CISOs are newer still. Worse, security in the Age of Information is a nuanced art, requiring both passion and finesse to effectively pursue and execute. Unfortunately for many, the Information Technology and Information Security industries are filled with just as much bad advice as good, coupled with media sensationalism and misinformation. Hollywood almost always gets everything wrong about hacking… however, one trope stands out in its uncanny predictive power: It is only a matter of time before your business experiences some sort of compromise, and it’s up to you to limit how bad it will be. The recent compromise of Sony Pictures computer systems and subsequent theft and distribution of data by the purported hacker group Guardians of Peace is shocking in its scope and damage. Some reports have suggested that Sony’s internal systems may have been compromised for up to a year before the group executed its actions to render systems inoperable and state their demands. The breadth and depth of the data released to the public is, simply put, stunning: Human Resources documents detailing sensitive employee information such as home addresses, 47,000 social security numbers, pay scales, performance reviews, healthcare information and more, are now freely available via BitTorrent to any interested party. Recruitment strategies, marketing information, policy documents, multiple pre-release and post-release films, scripts for films not-yet-in-production… the extent of the data is staggering: terabytes worth, much of which would be considered confidential or sensitive. The scope of the data breach allows deductive reasoning to provide insight into the level of access which the ‘Guardians of Peace’ were able to obtain: pre-release films and scripts are doubtlessly stored in different folders, in different shares and (most likely) on different servers on Sony’s internal network. This is a strong indicator that multiple, independent systems and areas of Sony’s infrastructure were compromised. Lending further weight to this conclusion is the purported seeding of Sony breach data by compromised servers assigned to Sony’s Playstation Network. Sony previously stated that its networks were physically and logically separated."
author = "Silicon Allee UG"
