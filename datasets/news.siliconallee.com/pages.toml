["https://news.siliconallee.com/2014/12/17/twilio-ceo-jeff-lawson-qa-were-trying-to-make-communication-less-dumb"]
title = "Twilio CEO Jeff Lawson Q&A: 'We're Trying to Make Communication Less Dumb' - Berlin Tech News from Silicon Allee"
description = "If you have ever received a notification text from an app on your smartphone, there is a decent chance it was powered by Twilio. The San Francisco-based cloud communications company, which was founded in 2008, finally launched in Germany last week, with carsharing platform DriveNow as its launch partner. Jeff Lawson, CEO of Twilio, was […]"
full_description = "If you have ever received a notification text from an app on your smartphone, there is a decent chance it was powered by Twilio. The San Francisco-based cloud communications company, which was founded in 2008, finally launched in Germany last week, with carsharing platform DriveNow as its launch partner. Jeff Lawson, CEO of Twilio, was in Berlin to celebrate the launch, and he sat down with Silicon Allee to talk about how the way we communicate is finally going to become less dumb and why the German capital is the place to be. JEFF LAWSON: A hundred and fifty years ago, Alexander Graham Bell made the first phone call, by stringing together a speaker, and a microphone and some copper wire. What’s amazing about how the 150 years since have progressed is that while the technology has gotten much more complicated and sophisticated, how we interact on the phone has actually changed very little. Even though there’s a phone app on our smartphone now, it’s functionally identical to a phone your grandparents might have used. If you think about it, the only real thing that has changed is moving from operators to rotary to touchtone. But we still make a call, someone might answer and we say hello, we may have no idea why they’re calling. That’s a what you call a dumb phone call. And we see all that as about to change. Twilio is here to migrate communications from its legacy in hardware, in the physical networks and all the Alexander Graham Bell stuff, to its future which is purely based on software. By doing so, by migrating our communications into software, we can now integrate it into all the other applications and experiences and workflows that we use, to make our communications more meaningful and relevant and contextual. And so, Twilio is a cloud communications platform as a service that lets developers incorporate phone calls and text messages into their applications in order to make their them communicate. JL: If you think about it, you have things like Voice Over IP (VOIP), but that has not made our communications any better. It’s made them a little cheaper, but it has not changed how we interact with our technology. To us, this meaningful change in our communications comes about when you integrate it with the other things that we are doing. So for example, Uber is one of our customers. Uber is often cited as having this great customer experience and they do if you compare it with how it used to be, at least in San Francisco."
author = "Silicon Allee UG"
