description = "Necessary cookies are absolutely essential for the website to function properly. This category only includes cookies that ensures basic functionalities and security features of the website. These cookies do not store any personal information."
full_description = "In this interview we talk with Margaux Aliamus + Manya Rahbari, co-founders of Cycles. We learn about their shared passion for startups and their drive to shape the future of women’s health. Margaux: I started flirting with the idea around a year ago. I was passionate about women’s health innovation (FemTech), the industry was booming, and I wanted to start a new company in that field, so I started a research project to study the gaps in the market and build a network and expertise in the field. At the same time I was suffering from hormonal imbalance and all sorts of pains because of that (period pain, hair issues, acne, libido issues). I discovered how few solutions doctors were able to offer me, if they even cared at all. I went looking on my own and discovered a whole new world online, hundreds of communities of women, frustrated by the lack of interest of their doctors, exchanging advice, tips and home-made remedies. All this knowledge is scattered, home-made is not always safe, and there are huge inefficiencies there. So I realized we need a solution for all these women: a source of curated knowledge and remedies all in one place. And the idea for Cycles was born, a companion brand providing solutions to solve women’s pain points and educating them about their own health specificities. Manya: When Margaux first told me about her mission I immediately knew that was something I could fully stand behind and support with my skills. So I decided to fade out of my position as Head of Product at Recare, the leading digital platform for hospital patient transfers in Germany, to join Margaux on her mission to improve women’s pain. Margaux: I always knew I wanted to start a company. During business school everybody was doing internships in big corporations, but I hated how specific the jobs were and how little autonomy there was. I wanted to do a bit of everything. So I went to startups and loved it from day one. After a couple of internships and my first two jobs in the startup space, I knew I wanted to do it on my own. The first company I founded was a booking platform for sunbeds on southern European beaches. Cycles is my second company, and probably not the last."
