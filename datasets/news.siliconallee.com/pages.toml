["https://news.siliconallee.com/2022/04/22/berlin-founders-fund-review"]
title = "Joining Forces With Government to Grow Startups - Berlin Tech News from Silicon Allee"
description = "Necessary cookies are absolutely essential for the website to function properly. This category only includes cookies that ensures basic functionalities and security features of the website. These cookies do not store any personal information."
full_description = "Two years ago, we did something very new and foreign to us; we accepted government funding. More specifically, we were awarded €1.4M from the government and “invested” it in 15 pre-seed startups between 2019 and 2021. We called this weird experiment the Berlin Founders Fund (BFF). The BFF acronym was a little pun on another meaning of the acronym ‘Best Friends Forever,’ but this name also guided us in the relationship we aimed to have with the BFF startups and founders. We just wrapped up the first BFF fund (we call it 1.0) and thought it would be valuable for you to see what happened, what we learned and what we’re doing next. The Berlin government took a risk by trusting smart people (us and the BFF Founders) with free money, and it worked: “We couldn’t have done it without BFF. The team is amazing! I don’t know of another program with such a well-curated, diverse, and inclusive approach.” “Access to great mentors and intro to VCs. BFF helped us by opening up their network to us, connecting us with the right people and with the expertise we needed at the right time.” “The experienced team and their network. Everyone in the team understands what it means to start a business and what kind of struggles one might go through. They are extremely supportive, friendly and genuine. Also, they are a great sparring partner in the most difficult situations.” “I was deeply impressed. This was the highest founder quality across the board I have seen in an accelerator program for a long, long time.” These are the startups we funded; TravelSpend, Plantclub, It’s Complicated, Heritage Type, Circles, Athleads, Reframd, O Water, Vaayu, Bina, Branayama, Agrivero, Finmid, BettaF!sh The success of any given company is highly linked to the founder’s ability to access capital, so it was essential for us to set up a strong foundation and structure to help. Our funding provided a valuable financial runway for the founders to develop ideas and launch products that people and companies desire. So far, Heritage Type has succeeded in:"
