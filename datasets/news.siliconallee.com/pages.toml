["https://news.siliconallee.com/2020/12/07/collaborate-to-innovate-how-germany-and-the-uk-come-together-to-solve-global-challenges"]
title = "Collaborate to Innovate: How Germany and the UK Come Together to Solve Global Challenges - Berlin Tech News from Silicon Allee"
description = "The Bridge is a series of articles exploring connections between the European tech capitals of Berlin and London supported through our partnership with London & Partners."
full_description = "The Bridge is a series of articles exploring connections between the European tech capitals of Berlin and London supported through our partnership with London & Partners. A profile of some of the region’s most important partnerships tackling issues such as air quality, farming and transportation. When it comes to the brainpower behind innovation, two heads are often better than one. Multiple perspectives coming together helps to create the most viable ideas and serves as the best defense for any challenging curveballs (it’s why the co-founder dynamic works so well). The same goes for cities. One region’s success story with a new technology may be another region’s blueprint for achieving the same; any challenging experiences faced by one can serve as learning material for another to avoid the same pitfalls. This is the idea behind cross-border collaboration to scale up new technologies that solve global issues. Europe’s high concentration of differing regulatory environments is the ideal ground for this type of collaborative innovation. “When it comes to innovation, we tend to pilot things a little bit too much,” said Nathan Pierce, the Program Director for Sharing Cities, a London-led international smart cities program that explores ways in which European cities can collaborate on building and scaling smart city solutions. “If at all possible we can learn from other cities who have already deployed the technology, it helps to speed everything up.” Germany and the UK have long been fruitful collaborators when it comes to tackling global issues such as air pollution, transportation, farming and connectivity. We’ve selected a few examples of companies and initiatives pushing the envelope of innovation in these areas through cross-border collaboration. On Glasshouse Street, near Piccadilly Circus in London, stands one CityTree: the pioneering air quality creation of Berlin-based Greencity Solutions. At four meters high, the peculiar looking artificial hedge absorbs pollution and emits fresh air – effectively doing the work of 275 trees in one small space. The pods of moss that line a CityTree “inhale” the types of particulate matter that is the cause of one in seven deaths worldwide."
