["https://news.siliconallee.com/2021/03/16/you-dont-need-a-notary-for-your-seed-round"]
title = "You Don’t Need a Notary for Your Seed Round - Berlin Tech News from Silicon Allee"
description = "In Leapfunder’s most recent article, you learned why an investor pool is critical for your company. Now you have the opportunity to find out if you need a notary for your seed round. We often hear people are asking: why do we need to go through so much paperwork when setting up our company? Why […]"
full_description = "In Leapfunder’s most recent article, you learned why an investor pool is critical for your company. Now you have the opportunity to find out if you need a notary for your seed round. We often hear people are asking: why do we need to go through so much paperwork when setting up our company? Why is there so much legal paperwork to divide up the shares? Well, the answer is that you could probably get away without most of these formalities as long as everybody is friends, right? In the same way, you can probably have dinner and split the bill fairly at the end of the evening. But what happens if you’re no longer friends a few years later? It’s important to have a proper legal process when forming a company, even if you are doing this with your best buddy. Most legal stuff can be organised with an attorney. In some countries and in some situations, you also need a notary. A notary can act as a legal advisor, but more notably a notary is a strong witness that everything was legally organised. Whether you need a notary in a particular country depends on the law in that country. Some countries insist that a strong witness is present for the most important legal actions. Some countries don’t feel they need this additional witness. The guidelines below apply to Germany. In Germany, a notary is normally needed to create a limited liability company. The notary will put together the paperwork, and register the company with the official register of companies. The same is true for creating new shares. This important step in the life of the company usually requires a notary to be present. That means that if someone holds a share certificate there is a powerful witness statement from a notary to prove that those shares are real. It’s now widely accepted in Germany that you can do a convertible note investment round without a notary. For this to be possible your ‘Wandeldarlehen’ does need to meet certain requirements. Any experienced startup lawyer can help you set it upright."
