["https://news.siliconallee.com/2020/01/30/is-this-the-future-of-urban-parcel-deliveries"]
title = "Is this the Future of Urban Parcel Deliveries? - Berlin Tech News from Silicon Allee"
description = "The way we move in cities makes no sense, according to the cofounder and chief executive of e-mobility startup ONO. “I think the way we move things and people in cities is stupid,” Beres Seelbach, founder and chief executive of ONO, tells Sifted. “There’s a much smarter and [more] efficient way to do this, to […]"
full_description = "This article was produced by Silicon Allee for Sifted.eu as part of our partnership to give German tech news a wider audience. The way we move in cities makes no sense, according to the cofounder and chief executive of e-mobility startup ONO. “I think the way we move things and people in cities is stupid,” Beres Seelbach, founder and chief executive of ONO, tells Sifted. “There’s a much smarter and [more] efficient way to do this, to save resources and improve [the] quality of life in cities.” So, his Berlin-based company has designed a new type of electric cargo-carrying vehicle in an attempt to tackle this messy state of city logistics by first improving “last mile” deliveries, the final leg of deliveries between the transportation hub and a recipient’s doorstep. According to Seelbach the advantage of ONO’s Pedal Assisted Transporter, or PAT, is that compared to cars it can sidestep traffic congestion, parking problems and is better for the environment as it does not burn petrol. ONO doesn’t yet view private individuals as its target customers, but rather businesses with delivery services, like a UPS or a local flower shop. The delivery market, particularly in Germany, is large. McKinsey assessed just last year that a person in Germany receives an average of 24 parcels per year. The only country, out of the 17 countries analysed, where a person receives more parcels on average was China. There, someone receives on average over 70 parcels per year. Delivery companies Hermes and GLS are already set to begin using ONO’s PAT this spring and summer in Berlin, but other non-parcel delivery companies, like catering and dry-cleaning businesses, are expressing interest. From the outside, the PAT looks both curious and familiar. It looks like a three-wheeled pint-sized truck that is accompanied by a soft humming noise. From the driver’s seat, the PAT also feels strange but, as Sifted learned at a short test drive, also practical. Seelbach describes coming across a YouTube video from UPS about using cargo bikes for last mile deliveries in Hamburg as the “tipping point” for him."
