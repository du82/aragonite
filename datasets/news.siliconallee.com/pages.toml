full_description = "On May 7th Stefanie Raffelsieper, Founder of Branayama, hosted our monthly BFF Founder Meetup on the topic of crowdfunding. They reached their initial goal of 10k € on day four of their Kickstarter campaign! The BFF Monthly Founder Meetup is a peer to peer learning and skill sharing format offering internal support, problem solving and special time for Q&A. This internal event happens once a month, where each founder gets the opportunity to host a topic of his/her choice. 20 of them were personally delivered to their favorite investors and further 30 were awarded to Instagram competition winners. Look out for the next BFF portfolio startup Reframd’s launch of their Kickstarter campaign on June 15th. Sign up here to get notified! Get emails you’ll actually want to open from Silicon Allee. With the latest startup news, invitations to events, inspiration and more."
