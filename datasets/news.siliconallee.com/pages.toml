["https://news.siliconallee.com/2020/04/28/the-make-or-break-opportunity-for-telehealth-startups"]
title = "The Make-or-Break Opportunity for Telehealth Startups - Berlin Tech News from Silicon Allee"
description = "This article was produced by Silicon Allee for Sifted.eu as part of our partnership to give German tech news a wider audience."
full_description = "This article was produced by Silicon Allee for Sifted.eu as part of our partnership to give German tech news a wider audience. Healthcare startups which have been patiently building and scaling for years are now facing the challenge of hyper-growth. In late March, Klara cofounders Simon Bolz and Simon Lorenz had a make-or-break talk with their engineering team. The German healthcare communication platform had just received dozens of calls from healthcare facilities urgently asking for ways to treat patients remotely via videolink. The company, which now operates in the US, had spent six and a half years building a communication workflow management tool for healthcare professionals but wasn’t focused on video. “We had to make a decision: either we try to paddle and go with that wave, or not. And I think everybody understood that this is the time to step up,” Bolz tells Sifted. The Klara engineering team said they were confident about doing it, and indeed the company ended up being able to provide the service in less than a week. Now, three weeks after launch, the video service is approaching 10,000 video visits per day, with some customers having upwards of 100 visits per day, says the company. But it was a risk. With Covid-19 sweeping the globe and government lockdowns in full swing, healthtech companies worldwide have experienced a similar moment: the stark realisation that their team can make a huge and immediate impact, with potentially lasting results for company growth and long-term transformation of the industry as a whole. That is, if they seize the opportunity. Like Klara, the UK’s accuRx had a similar push that resulted in the team building a video platform over a weekend. Germany’s telemedicine pioneers TeleClinic — which was directly responsible for helping diagnose some of the first reported instances of Covid-19 in Germany — met its 60% week-over-week growth head-on by rolling out at-home testing kits. French startup Doctolib — which started as a way to help doctors manage appointments and accept online appointments, but has since moved to video consultations — has seen a huge surge in demand for video. It has waived subscriptions for its video service during the pandemic, further turbocharging usage."
author = "Silicon Allee UG"
