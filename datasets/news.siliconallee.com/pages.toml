["https://news.siliconallee.com/2022/11/01/founder-stories-conor-lamb-skintheory"]
title = "Founder Stories with Conor Lamb from SkinTheory - Berlin Tech News from Silicon Allee"
description = "At college, Conor experienced firsthand the struggle and confusion that acne can cause, as well as a lack of information and support for the different factors that could be causing it. He then realized he was part of the 744 million globally that suffer from it and wanted to create something to help them. That’s […]"
full_description = "I’m from the US, Philly, I’m half Irish as well. I went to the University of Pittsburgh and studied Computer Science. I was actually a Caddy at a Country Club, it was my first customer service experience. I learned a lot, played a lot of golf, and did it from age 14 to after college. I always wanted to start my own business, there was some sort of American Dream there, I don’t know if that’s real but… I tried to sell stuff on eBay as a kid. I had a business selling car wiring things for car audio. Made a little bit of money, then I went to college and had a bunch of ideas but didn’t do anything until the idea for SkinTheory came along. I love Berlin, it’s amazing. I moved here from Dublin. Berlin is a great hybrid between a great tech hub, but it’s also incredibly artistic. I love to have both sides. And you can drink outside, which is a huge plus. The winter can be a bit grey for a long time, but that’s ok. Kinda strange story with him. Y Combinator is a startup school for video learning. They introduced this co-founder dating service (or matching), basically like Tinder for co-founders. I met Moé through that service and then we met for a coffee. He really dug the SkinTheory idea. He’s a smart cookie. SkinTheory takes the mystery out of skin care. It’s a tracker to track your skin and tell you what is causing your acne, suggest what you should do to solve it and what’s best for your skin specifically. It can also track your different treatments and surface information that’s actually useful instead of miracle promises. Our new app has the ability to track diet and periods to better understand and solve skin problems associated. It started from college when I first got really bad acne at 19. I was going to the dermatologist a bunch, did Accutane a bunch, it was incredibly hard to solve. It’s also really depressing and destroys your confidence. I would leave class early because I felt so uncomfortable. Eventually I decided to be much more scientific about it and started tracking my skin. I used Google Sheets to track each experiment I did. After 6 months or so I figured out the combination that worked for me."
