["https://news.siliconallee.com/2020/08/26/focus-on-founders-noam-gerstein-zachary-bowen"]
title = "Focus on Founders with Noam Gerstein + Zachary Bowen - Berlin Tech News from Silicon Allee"
description = "In this interview we chat with Noam Gerstein and Zachary Bowen, co-founders of bina, a complete, comprehensive digital elementary school. We learn that bina means wisdom in Hebrew, the importance of failure in making progress, and that today these two founders are on a mission to change education for good."
full_description = "In this interview we chat with Noam Gerstein and Zachary Bowen, co-founders of bina, a complete, comprehensive digital elementary school. We learn that bina means wisdom in Hebrew, the importance of failure in making progress, and that today these two founders are on a mission to change education for good. Noam: I am not a “eureka” type of person; I think iteratively. bina was, and is, built very slowly through a long process of research. Zach: Noam and I met in January and started talking about the role of AI and machine learning in bina. The possibilities were exciting, but it quickly became clear to me how important it was going to be to get the more basic technologies set up from the start in a way that would support data science as the company grew. Noam: I didn’t want to start “a” company but rather “this” company. I like solving problems (yes, please, give me a riddle!) and creating realities. Attempting to improve early education at scale is not a problem I picked, rather a monster haunting me for years. I feel a social obligation to serve. Zach: I’ve felt for some time that I was missing out as an engineer. I have an interest in “big picture” thinking. Beyond that, bina is a project that has the potential to make the world a better place, which is inspiring. 1. The most beautiful lessons are kindness and intelligence of people and their willingness to share their expertise and effort. Building a community is not something one does alone, it is the collective effort of numerous idealistic and realistic people. I am humbled to be one of the curators of this brilliance. 3. People have varying rhythms and intensities. Those variations are vital to us thriving as a company– just as other diversities are. 4. I am bound to feel deeply embarrassed when managing to get something off the ground. It is immensely painful. And it is the best way to learn precisely how we can do better. Zach: I’ve had to learn to get way outside my comfort zone, which means trying things that scare me, and possibly making mistakes. I’ve learned how easy it is to get caught up in work and forget about family, sleep, etc., and how important it is to set some space aside for myself. And I’ve learned to be honest with my teammates about the struggles we’re all going through at this stage in the company and be empathetic, both in how I ask for and offer support to the people around me."
