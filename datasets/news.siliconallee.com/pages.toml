["https://news.siliconallee.com/2021/03/24/by-women-for-women-the-organizations-supporting-female-entrepreneurs-in-berlin-and-london"]
title = "By Women, for Women: the Organizations Supporting Female Entrepreneurs in Berlin and London - Berlin Tech News from Silicon Allee"
description = "The Bridge is a series of articles exploring connections between the European tech capitals of Berlin and London supported through our partnership with London & Partners."
full_description = "The Bridge is a series of articles exploring connections between the European tech capitals of Berlin and London supported through our partnership with London & Partners. Tech-focused initiatives are leveling the playing field for women entrepreneurs in London, Berlin and throughout Europe. By women. For women. These are the characteristics that unite an important new crop of organizations within the European entrepreneurial space. Support groups, networking opportunities, company builders and more are gaining traction in the startup ecosystem to help solve the woeful underrepresentation of women entrepreneurs. Despite women pioneering European companies and climbing steadily in leadership roles over the long term, the numbers are still far from amazing. Only 15.7% of founders in Germany are female, according to the Female Founders Monitor 2020. Women face unique obstacles and decisions stemming from long-term underrepresentation. In this article, we’re highlighting just a few of the initiatives looking to change this reality. While we touch only on Berlin and London-based entrepreneurial organizations here, there are plenty to be found throughout Europe. You might also want to head over to EU Startups’ list of Top 50 Most Influential Women in the European Startup and VC Space for more exploration. Alma Angels is a London-based community of angel investors in support of female founders. Its members-only format ensures that every participant remains actively pledged to invest in female-founded companies. Alma Angels may be for angel investments only, but Co-founder Deepali Nangia also serves as Venture Partner with Speedinvest and an angel investor with Atomico – both focusing on female founders. “Early stage capital or first funds are hardest to raise for all founders – and even more so for female founders who tend not to be second time operators, don’t have access to warm intros and face more conscious and unconscious bias during the fundraising process,” Nangia said. “This is exacerbated further when it comes to ethnic minorities and overlooked communities. Female founders, irrespective of ethnicity, sexuality or gender, all have equal access to all the investors in our community. We also measure and track data points in our pipeline and deal flow – such as gender and ethnicity – so as to ensure we are doing what we set out to do.”"
