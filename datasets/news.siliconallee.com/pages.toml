["https://news.siliconallee.com/2021/04/22/focus-on-founders-with-anita-daminov"]
title = "Focus on Founders with Anita Daminov - Berlin Tech News from Silicon Allee"
description = "For Earth Day we are shining a light on one of the Berlin Founders Fund portfolio companies, Vaayu, who are empowering retailers to track and cut their carbon emissions. Anita Daminov, Co-Founder (product and design lead), talks to us about her experience developing products, the importance of iterating quickly, and caring deeply about the future of our planet."
full_description = "For Earth Day we are shining a light on one of the Berlin Founders Fund portfolio companies, Vaayu, who are empowering retailers to track and cut their carbon emissions. Anita Daminov, Co-Founder (product and design lead), talks to us about her experience developing products, the importance of iterating quickly, and caring deeply about the future of our planet. I’m responsible for product and design. So I’m responsible for building out the product (together with tech) and making sure it meets our users’ needs. It is always different. It’s a mix of talking to customers understanding what they need and trying to prioritize the features that we should build out, talking to tech to understand how we can best do it from a technical perspective, creating ideas in wireframes, discussing them with the team to make sure that they actually are good and then putting them in high fidelity designs that can be implemented by the tech department. Working on Product is great because you are always in the center of everything that is going on. It was a joint effort between the three of us – Nam, Luca and me. You need a lot of climate expertise to come up with approaches to the problem. There’s so many complex issues that you can tackle in the climate space and there are also multiple approaches to how you can do it. In general there’s a lot of environmental issues that we’re looking at and I think carbon is one that makes the climate problem measurable at scale. Carbon offers a good opportunity to understand how businesses can improve, but is certainly not the only one, and also not the only one we will focus on in the long run. It makes things comparable and that allows us to understand where a company stands and how it can get better quantifiably. We wanted to address retail because we believe that there is a lot of customer pressure in the market and there is a strong need for transparency. We believe that brands will adapt to their customer needs and create better products. So that makes it a very exciting space!"
