["https://news.siliconallee.com/2023/01/11/hustle-your-german-vc-fund-into-existence"]
title = "How to Hustle your German VC Fund into Existence - Berlin Tech News from Silicon Allee"
description = "We spoke with Marc Penkala to pick his brain on the ins and outs of running a VC fund in Germany.  And he knows a thing or two.  Marc has spent the last 10 years as an angel, investing in early-stage venture capital around the globe. Then going on to build his own vehicle – […]"
full_description = "This article is published as part of Skytrain – a transatlantic investor community bridging the gap between investors and VC funds in the US and Berlin. Join the network or learn more about what we do here. Marc has spent the last 10 years as an angel, investing in early-stage venture capital around the globe. Then going on to build his own vehicle – Minimal VC – where he currently has around 30 investments in his portfolio. Marc is also a founding partner at āltitude – a fund that works together with Angels to supercharge their deals by up to €100K. Most recently, Marc has been spending his time consulting emerging fund managers on legal and organizational structuring and is currently in the process of building his own fund. The very first thing you need to do is pick a location to domicile your fund. If you haven’t done that yet, we recommend you do. You and a group of peers – with a background as VCs, angels or founders – get together and decide you want to start a fund. So, you go to a lawyer and make your intentions known. The lawyer says “great, happy to help. It’s gonna cost you €150K”. The first part of the process is agreeing on the summary of terms. This is basically the 30,000 foot view of the fund strategy. It’s going to include all the details of your investment thesis (fund size, sector, stage, etc.) plus all the admin stuff like, management fees, carry, admin responsibilities, bookkeeping, etc.) If you haven’t got this far yet, check out this article on the 5 decisions you need to make before setting up a VC fund. The lawyers will incorporate the various entities you need to raise, manage and distribute capital. In Germany, that would be the complimentary limited company (GmbH), a management GmbH, and a limited partnership (KG) for each of the limited partners (LP) that connects them with the management entity as the general partner (GP). In this way, all liability is with the GmbH. All three companies can be created at the same notary appointment. Then you pay in the shared capital (€25,000 to form the GmbH) and get everything noted in the trade register."
author = "Silicon Allee UG"
