["https://news.siliconallee.com/2021/02/23/createch-the-burgeoning-sector-you-wont-see-in-the-tech-headlines"]
title = "Createch: The Burgeoning Sector You Won’t See in the Tech Headlines - Berlin Tech News from Silicon Allee"
description = "The intersection of creativity and technology is producing a wave of startups in fashion, adtech and gaming that are helping change the global conversation around what it means to implement a multidisciplinary approach."
full_description = "The Bridge is a series of articles exploring connections between the European tech capitals of Berlin and London supported through our partnership with London & Partners. The intersection of creativity and technology is producing a wave of startups in fashion, adtech and gaming that are helping change the global conversation around what it means to implement a multidisciplinary approach. Berlin and London each have their unique creative reputations. The German capital’s underground and DIY flair allows creatives to unleash their wildest ideas without major barriers, whereas the fast-paced, powerhouse hub of London is home to titans of global creative industries. Despite these long-standing reputations, startups in the sector known as Createch are showing that anything is possible in either place – especially as geographical barriers become obsolete and more creative collaboration takes place remotely. This small but fast-growing tech sector contains startups working at the intersection of creativity and technology, with a creative element – such as design, storytelling or visual art – driving the innovation forward. We often think of tech as incorporating some form of automation or big data analytics, and while many Createch companies incorporate these too, it’s creativity that enables the products and services in this sector. Think about fashtech, adtech and gaming – all of which evolve, in large part, due to the creative minds behind the scenes. We’re inspired daily by two Createch companies in our BFF portfolio, who are working hard to move forward with the launch of their products via Kickstarter campaigns despite the pandemic. Branayama is set to manufacture a chic sustainable nursing bra with exclusive two-layer technology, and Reframd is readying its campaign to create custom-made eyewear designed and digitally crafted to fit the low and wide nose bridge profiles of Afropolitans and other under-represented communities. Our Kickstarter crowdfunding campaign will be live towards the end of spring. We have started to outline our campaign, including the expertise that we will need. The pandemic has removed distractions and improved focus. What better opportunity to laser focus on building unique products?"
author = "Silicon Allee UG"
year_published = 2021
year_updated = 2022
