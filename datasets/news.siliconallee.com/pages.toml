["https://news.siliconallee.com/2020/09/29/focus-on-founders-jack-lancaster-max-brenssell"]
title = "Focus on Founders with Jack Lancaster + Max Brenssell - Berlin Tech News from Silicon Allee"
description = "In this interview we talk to Jack Lancaster and Max Brennsell, Co-founders of Plantclub.io, providing healthy, beautiful workplace plants that bring life, wherever you work. Find out how the idea for Plantclub was born (hint: Jack's 38 plant mini-jungle at home) and that both Max and Jack can agree on one thing: Jazzy hip-hop is a genre of music that defines their life as entrepreneurs – keep things ticking, while staying upbeat."
full_description = "In this interview we talk to Jack Lancaster and Max Brennsell, Co-founders of Plantclub.io, providing healthy, beautiful workplace plants that bring life, wherever you work. Find out how the idea for Plantclub was born (hint: Jack’s 38 plant mini-jungle at home) and that both Max and Jack can agree on one thing: Jazzy hip-hop is a genre of music that defines their life as entrepreneurs – keep things ticking, while staying upbeat. Jack: Originally I wanted to call it Botanical, which is a crap name. My girlfriend suggested Plantclub and the domain was available so that made the decision pretty easy. Max didn’t complain too much. Jack: The idea originally came to me in a different form back in September 2019. With 38 plants in my apartment, I was struggling to remember when to water what and how much. I wanted to build an app to help people with this. I know the value of validating your ideas with user research from working as a product manager. Fast forward 20 or so user interviews, I realised that many people like plants to be a break from technology and prefer to work things out on their own. By luck, I spoke to a couple of office managers though, and started talking about plants in their workplaces. After more user interviews, it really became clear that there was an opportunity there and Max came on board. From there things became more structured and focused. Max: It felt like a very organic process. User interviews resulted in first beta-members which then referred other potential member companies and so on. Generally speaking, we felt that co-founding Plantclub would enable us to work as independently and flexibly as possible while allowing us to learn about a lot of new things very quickly. Jack: Building a company is also about being as self-critical as possible with every idea you have, and not being afraid to say no to opportunities. As founders, we have such finite time that to actually have a chance of building something great, we need to say no to a ton of things that we could do that look appealing."
