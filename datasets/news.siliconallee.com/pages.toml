["https://news.siliconallee.com/2021/06/08/focus-on-founders-with-darina-onoprienko-lina-gundelwein"]
title = "Focus on Founders with Darina Onoprienko + Lina Gundelwein - Berlin Tech News from Silicon Allee"
description = "Necessary cookies are absolutely essential for the website to function properly. This category only includes cookies that ensures basic functionalities and security features of the website. These cookies do not store any personal information."
full_description = "Darina Onoprienko and Lina Gundelwein, Co-founders at Agrivero.ai recognized firsthand the problems that coffee traders face when it comes to quality and aim to be impactful change-makers in this space. They start their day with a coffee, slowly enjoying every sip, and determination to provide quality control and traceability of green coffee for producers, traders, and roasters through their AI-enabled solution. Darina: Me and Anton are from Russia, and Lina is from Germany. Anton still lives in St. Petersburg and we’re waiting for his visa to get approved so that he can join us here in Berlin. Darina: I started at the beginning of 2020. The idea came to me when I was working on supply chain insurance and got in contact with coffee suppliers and saw firsthand their problems. I got curious and investigated further, discovering the problem of subjective, manual quality analysis in the green coffee business. Darina: I was running another startup before and started to understand the problems coffee traders face. I started to dig deeper, doing first customer interviews, and then went to Colombia to see for myself what’s going on in the origin. I met producers, cooperatives and some traders. Coming back to Germany, I already knew I wanted to work on this problem and I started to build a team. Lina: I have known Darina for several years, since we lived together in a flat-share. I followed her journey as an interested friend until she asked me if I knew someone with image processing and AI skills, project leading experience and openness towards a new challenge. I felt like she just described me and this is how I came onboard. There are too many people who offer you entertainment and fluff, but not value (events, programs, accelerators) and there are tons of crappy deals being offered, don’t fool yourself! Think twice. Darina: We have different mentor sessions with BFF, and I cannot even express how valuable they are. They help a lot with “tactics” and help me to implement best practices in sales or marketing. Those sessions happen exactly when they are needed, so it’s cool. I guess in my life there is a life-long mentor, my friend Amanda, who has no fear and she helps me to understand my choices in life and business better."
