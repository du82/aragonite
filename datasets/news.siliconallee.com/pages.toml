["https://news.siliconallee.com/2021/05/10/the-insidiousness-of-greenwashing-a-panel-discussion"]
title = "The Insidiousness of Greenwashing: a Panel Discussion - Berlin Tech News from Silicon Allee"
description = "Necessary cookies are absolutely essential for the website to function properly. This category only includes cookies that ensures basic functionalities and security features of the website. These cookies do not store any personal information."
full_description = "On April 23rd, in celebration of Earth Day, James Balzer led a critical discussion among panelists Lubomila Jordanova, Alina Bassi, John Paul Jose, and Namrata Sandhu on the insidious effects of greenwashing. Here are a few highlights to help you discern truth from fiction, find transparency in the fashion industry, and contribute to positive future impact. Be sure to read until the end, there are some great sustainable business recommendations from the panelists. Lubomila Jordanova: 50% of claims for carbon neutrality and net zero targets that have been set are not backed by data. This, in a nutshell, means that a company with a marketing campaign claiming carbon neutrality is at an equal battlefield as the one that is really developing a deep understanding of what kind of processes, materials, and factors they have today contributing to CO2 emissions. Alina Bassi: There is an evident lack of transparency due to brands not naming their manufacturers, suppliers, or raw material suppliers. If we’re not able to even understand where their materials come from or what they’re made of, then how can we really be sure that something is truly sustainable? John Paul Jose: Norway is one of the largest countries in progress with the use of electric vehicles but at the same time it’s one of the largest nations investing largely on oil. So on the front line they say ‘yeah we’re moving towards a sustainable future by using electric vehicles and our consumers are very much oriented toward sustainability,’ but at the same time the nation itself has a lot of promotions for the oil industry so they’re actually diluting real progress. Namrata Sandhu: I think we need a lot more of that from brands and businesses, just the honesty to say ‘we don’t know all of this information but we’re on the way and we’re happy to take the feedback on board’ and be really transparent with that. Alina Bassi: I like to give the example of H&M. People give them a bad name but to be honest, there’s a reason for it. If you are an organization promoting fast fashion but you have one small eco line, that doesn’t mean that all is solved. They also don’t pay their workers fairly, so to me they are the perfect example of a brand that is contributing to fast fashion but also trying to greenwash."
