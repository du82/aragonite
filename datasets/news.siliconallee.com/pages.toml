["https://news.siliconallee.com/2020/05/28/focus-on-founders-an-interview-with-dinarte-jesus-jens-hillmann"]
title = "Focus on Founders with Dinarte Jesus + Jens Hillmann - Berlin Tech News from Silicon Allee"
description = "In this interview we chat with the co-founders Dinarte Jesus + Jens Hillmann of Athleads. We discuss the importance of being a team player in sports and in life, how embracing failure is part of the learning process and how Covid-19 has forced them to pivot."
full_description = "In this interview we chat with co-founders Dinarte Jesus + Jens Hillmann of Athleads. We discuss the importance of being a team player in sports and in life, how embracing failure is part of the learning process and how Covid-19 has forced them to pivot. Dinarte: Three years ago I started researching the football market to understand how to increase the opportunity for football players to become professional. Dinarte: As a kid I practiced football for over eight years, but due to a lack of opportunities and support I was unable to transition to the professional level. I played for a couple of teams, one was CF Andorinha, Cristiano Ronaldo’s first team. Unfortunately when I was practicing there he wasn’t playing for the team anymore, but it definitely gave me hope and that anything is possible. Jens: Throughout the year 2019, I was Dinarte’s advisor at Athleads. In a customer interview with a Portuguese soccer club we learned that they were struggling to manage their scout’s schedules and scouting reports. They were failing to make general purpose project management tools work for them. At the time Athleads was going to be a marketplace to sell match and player reports to clubs. This sparked the conversations between Dinarte and I that lead to me joining as a co-founder when Dinarte had secured funding from BFF. Dinarte: Football taught me how to be a team player, but entrepreneurship has shown me even more the importance of this. You can have an amazing idea, but if you don’t have the right team to execute your idea, it’s worthless. On the other hand, if you have a “bad” idea with the right team you can iterate and develop it to become something great. The other big lesson is the importance of timing. We see many examples of startups who have a great team with an amazing idea, but isn’t just the right time for the market. Jens: It’s hard talking to users to find out what they want – they use cryptic language. It’s difficult to get people to do new things and establish new behaviors. Even if it’s possible, you need to attach to an established behavior or way of doing things before you can get them to take new actions."
author = "Silicon Allee UG"
