["https://news.siliconallee.com/2019/12/02/how-the-secure-messaging-app-wire-is-taking-on-slack-and-microsoft-teams"]
title = "How the Secure Messaging App Wire is Taking on Slack and Microsoft Teams - Berlin Tech News from Silicon Allee"
description = "Chief executive Morten Brøgger says his company isn’t competing with other, more consumer-driven encrypted messaging apps anymore. Instead he’s taking on Slack and Microsoft Teams."
full_description = "This article was produced by Silicon Allee for Sifted.eu as part of our partnership to give German tech news a wider audience. With 1.6bn users, WhatsApp has won the battle to be the world’s biggest messaging app. But Morten Brøgger, the chief executive of European startup Wire, says that he hopes to become a global champion for workplace messaging. “On the consumer side WhatsApp may have won the battle of the world,” Brøgger tells Sifted at his company’s Berlin offices. “But right now we’re getting great momentum on the enterprise side. We want to be the best communication tool for enterprises, for work.” The current international powerhouses for workplace collaboration are Slack, which counts 12m daily active users, and Microsoft Teams, which has 20m daily active users. Last month Microsoft said those latest numbers represent a 50% increase in users from July of this year, a stunning climb that is probably causing Slack to sweat. The Switzerland-based company, which closed an $8.2m Series A funding round earlier this year (the first it has ever disclosed) from US investor Morpheus Ventures, says its unique selling point is its focus on security, at a time when this a growing concern for companies worldwide. Wire says its daily active users are in the hundreds of thousands. “Where we’re really trying to disrupt is make that type of communication secure. That’s where we’re the best,” Brøgger says, boasting how big corporate clients such as EY, Intel and Philips are among the 700 enterprise clients using the platform. “There’s no one on the market who does it as well as we do.” Launched in 2012 by Alan Duric and Jonathan Christensen, an alumnus of the internet telecommunications tool Skype, Wire was originally a consumer app. Duric is still the company’s joint chief technology officer and chief operating officer in Switzerland. Funded mostly by Skype cofounder Janus Friis, Wire never seemed to gain the same traction on the consumer side as other secure messaging apps like Telegram and Signal."
