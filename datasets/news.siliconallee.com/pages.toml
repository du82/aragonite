["https://news.siliconallee.com/2019/11/22/the-berlin-based-founder-trying-to-reshape-the-business-travel-market"]
title = "The Berlin-based Founder Trying to Reshape the Business Travel Market - Berlin Tech News from Silicon Allee"
description = "A few unanswered emails and stubborn accountants were what sparked Comtravo founder and chief executive Michael Riegel to rethink how business travel bookings for small companies are made."
full_description = "This article was produced by Silicon Allee for Sifted.eu as part of our partnership to give German tech news a wider audience. A few unanswered emails and stubborn accountants were what sparked Comtravo founder and chief executive Michael Riegel to rethink how business travel bookings for small companies are made. While working for a small company in San Francisco, Riegel struggled to work out what they were actually spending on travel from his accounts department. “This was the point in time I Googled ‘travel management solutions’,” the 32-year-old tells Sifted. Riegel sent the four top companies an email but got no response for weeks. He realised that his company was too small to be worth it. Maybe, he then asked himself, there is a gap in the market here. Traditionally, booking travel is enormously time-consuming for small companies without a costly dedicated travel management company to help them. Mixing machine learning and artificial intelligence technologies — with the occasional human travel agent — Comtravo is trying to help by automating the old-school, manual processes. Already the platform has automated 60% of the travel booking process for small-midsize enterprises. With a recent addition of €21m in Series B funding earlier this month from backers Endeit Capital and Deutsche Bank, the Berlin-based company now has its eyes set on automating 80% of the process. Founded in 2015, Comtravo processes approximately 1,000 bookings per day and counts companies such as HelloFresh and LG Innotek among its customers. Over the last few years the company has developed a natural language processing (NLP) technology to help process bookings. But first, Riegel, who has a business background, and his team looked into “convenient” booking behaviours. They observed that most employees at big consultancies simply emailed secretaries to schedule travel. “It’s not like we knew there [was] this crazy NLP technology [and asked] where can we apply it? But we started from the problem,” Riegel tells Sifted. “We knew, okay, we have this booking behaviour. Is there a way to automate this?”"
