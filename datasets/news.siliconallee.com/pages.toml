["https://news.siliconallee.com/2023/01/24/crowdfunding-answer-to-democratizing-venture-capital"]
title = "Is Crowdfunding the Answer to Democratizing Venture Capital? - Berlin Tech News from Silicon Allee"
description = "Getting a foot in the door of venture capital as a new investor used to be more challenging than beating Elon Musk in a controversial Tweet competition. Aside from the typical in-crowd bias in a community as close-knit as VC, there are good reasons why venture capital has traditionally been kept away from the consumer […]"
full_description = "This article is published as part of Skytrain – a transatlantic investor community bridging the gap between investors and VC funds in the US and Berlin. Join the network or learn more about what we do here. Getting a foot in the door of venture capital as a new investor used to be more challenging than beating Elon Musk in a controversial Tweet competition. Aside from the typical in-crowd bias in a community as close-knit as VC, there are good reasons why venture capital has traditionally been kept away from the consumer investment market. Investing in startups is high-risk and definitely not for the faint-hearted so a lot of governments (on both sides of the Atlantic) made the regulations for taking VC to the consumer market very tight indeed. Thankfully, things have changed somewhat (since 2016 in the US and more recently in the EU) and there are some visionary companies taking advantage and making “venture-as-a-service” a reality – closing the door on VIP venture capitalism and enabling everyday people to get in on the action and do their part in helping founders bring their business dreams to life. There are a few notable players in the Syndicate/SVP market (as we covered in this article) but we decided to take a deeper look at crowdfunding platforms that focus on equity investing. We secured an interview with Katie Powers – head of EU operations at Wefunder. Wefunder is currently the largest equity crowdfunding platform in the US so we’re going to start there and use them as a baseline. Wefunder popped onto the scene in 2016, in response to changes in US law allowing everyday people to invest as little as $100 in startups and small businesses. Since then, they’ve raised just over half a billion USD for around 2000 companies – and amassed a network of 1.5 million users with around half a million actively investing. On their site, you’ll be more likely to find the term ”community rounds” than crowdfunding or crowd-investing. And we agree that it does a much better job of summing up the role that Wefunder and other venture-as-a-service providers fill in the startup funding process."
