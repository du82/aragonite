["https://news.siliconallee.com/2020/11/11/what-does-diversity-in-tech-actually-mean"]
title = "What Does Diversity in Tech Actually Mean? - Berlin Tech News from Silicon Allee"
description = "The Bridge is a series of articles exploring connections between the European tech capitals of Berlin and London supported through our partnership with London & Partners."
full_description = "The Bridge is a series of articles exploring connections between the European tech capitals of Berlin and London supported through our partnership with London & Partners. Perspectives and insights from A Seat at the Table, a panel discussion hosted by Silicon Allee and London & Partners. On October 6th, The Bridge hosted an online panel discussion, A Seat at the Table, which focused on one of the most important topics in tech right now: diversity. The panel helped not only to shed light on the perspectives of people of color working in tech, but also to share insights on what the tech community should understand about progress when it comes to tackling issues faced by underrepresented groups. One of the biggest themes was that it’s not enough to include or recruit marginalized groups. We must aim to achieve sustainable participation – active involvement of underrepresented groups in a way that results in innovation that outlives our current generation. It also highlighted the importance of geographical links between tech hubs to make progress on systemic racism and inequalities. When it comes to discourse, some regions tend to be more progressive than others. Through cross-continental discussion – particularly between Germany and the UK – we can learn from each other and help to accelerate systemic change. The remote event began with a fireside chat with Mark Martin, Founder of UK Black Tech, and Kave Bulambo, Founder of Black in Tech Berlin, who each discussed their vision and focus on sustainable participation and wellbeing for Black professionals in tech. Martin, a computer scientist who has worked in education for 17 years, often noticed his young students feeling discouraged about their lack of access to the tech world. To them, the booming tech cities felt like faraway utopias. After traveling and working with Microsoft, Martin founded UK Black Tech and launched a 100-year plan with 5 objectives: visibility, community building, participation, generational economics and sustainability."
author = "Silicon Allee UG"
