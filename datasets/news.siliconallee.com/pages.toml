["https://news.siliconallee.com/2022/11/08/8-ways-american-angels-access-german-vc-market"]
title = "8 Ways American Angels Can Access the German VC Market - Berlin Tech News from Silicon Allee"
description = "This article is published as part of Skytrain – a transatlantic investor community bridging the gap between investors and VC funds in the US and Berlin. Join the network or learn more about what we do here. More than almost any other investment vehicle, venture capital has always been a bit of an ‘invitation only’ […]"
full_description = "This article is published as part of Skytrain – a transatlantic investor community bridging the gap between investors and VC funds in the US and Berlin. Join the network or learn more about what we do here. But the landscape has changed a lot in the last few years. Opportunities for private investors to become Angels are popping up all over the place and the democratization of VC seems more and more inevitable. For any private investor looking for a way into the VC market, there are basically 8 roads you can take: Let’s take a look at each one in turn and how they can be used as an in-road to investing in the lucrative German VC market. Buying shares in listed VC funds is a relatively low barrier to entry as the minimum investment is much lower. There are a few German VC funds listed on the stock exchange with wide portfolios – many of them also have a VC arm that invests in German startups but we recommend doing the due diligence to find the right option for you. Investing as an LP of a VC fund is another way in but entry barriers – while not as high as those for leading US funds – are still pretty high. The biggest funds with the best access to deal flow only accept tickets starting at €3-5M. The VC firms behind the deals launch various funds at different times for LPs. Accessing good deal flow in German VC funds – like everywhere – really comes down to your network and timing. We’ve seen minimum tickets on private deals in Berlin ranging from €5,000 to €250,000 and of course going into the multiple 7-figure mark. That being said, two things that are even more important than capital for VCs are specialized knowledge and what the Germans call “Vitamin B” – meaning Beziehug (relationship) or in other words, network. So, any successful tech entrepreneur with an established network will stand a much better chance of getting their foot in the door as an LP with the bigger German VC firms. As always, you need to take a close look at the costs when buying into funds. Often you’ll have to pay an ‘agio’ (premium) when buying the fund shares – usually around 5 percent of the investment amount."
