["https://news.siliconallee.com/2022/09/21/10-venture-as-service-providers-for-funds"]
title = "Top 10 Venture-as-a-Service Providers for Funds and SPVs - Berlin Tech News from Silicon Allee"
description = "This article is published as part of Skytrain – a transatlantic investor community bridging the gap between investors and VC funds in the US and Berlin. Join the network or learn more about what we do here. Running a venture capital fund can definitely be a challenge. In fact, one of the biggest challenges of […]"
full_description = "Luckily, there are many savvy software providers out there who’ve lept in to save the day and specialize in solutions for venture capital funds and special purpose vehicles (SPVs). In our search we’ve turned up quite a few – they’re definitely not all perfect so, as this article is a part of the Skytrain project, we’ve added a note for each about the compatibility for US – EU investing. It just wouldn’t be right to make this list without mentioning one of the OG innovators in this space, AngelList. AngelList’s mission is pretty simple: “To increase the number of successful startups in the world”. They have an array of different products available for investors, fund managers and founders and we encourage you to take a look as they keep adding more. Also take their clever Fund Calculator tool for a spin. Here, we’ll take a look at the 2 products that we found most relevant and innovative for German VC funds and SPVs. AngelList’s Rolling Funds are open-ended venture capital funds that allow LPs to subscribe on a quarterly basis. AngelList is the only service who has been able to figure out the legal complexity of this type of fund and turn it into a product so far. The always-on quarterly subscription model means fund leads can continuously accept new capital and LPs get a quarterly investment schedule rather than a one-time commitment to a fund. That means that LPs can very easily commit more or less capital as their investment goals change but should likely allocate it across every quarter. The reasoning we have found is, for example, if the LP invests in Q1 but not in Q2 and a company is funded in Q2 that goes on to be a unicorn the LP sees no returns from supporting the fund. AngelList’s SPV solution will handle all the back office stuff (legal formation, capital calls, tax documents, etc). The major advantage to setting up a syndicate though AngelList is the potential to open your deals to their Private Capital Network and the general network containing big name VCs like Sequoia Capital, Andreessen Horowitz, Khosla Ventures, Founders Fund, as well as thousands of smaller LPs. They have a large pool of accredited investors you can tap into with minimal effort."
