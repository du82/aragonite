["https://news.siliconallee.com/2021/03/10/focus-on-founders-with-kyle-smith"]
title = "Focus on Founders with Kyle Smith - Berlin Tech News from Silicon Allee"
description = "Meet Kyle Smith, Co-Founder & CEO of Play Forge, currently in stealth mode. At age 18, he started working in the gaming industry, learning the ins and outs of the biz from the ground up. He is a proud lefty who thinks stand-up comedians are the smartest people in the world and that Berlin is the best city on the planet."
full_description = "Meet Kyle Smith, Co-Founder & CEO of Play Forge, currently in stealth mode. At age 18, he started working in the gaming industry, learning the ins and outs of the biz from the ground up. He is a proud lefty who thinks stand-up comedians are the smartest people in the world and that Berlin is the best city on the planet. CEO / Co-founder – I am focused on the product and handle the business side of things, but when it comes to content, I will focus on the strategy, market research, and competitive analysis. I like to find gaps in the market. There’s two of us. Nick Carr is my Co-founder. He is focused on marketing, and has a functional performance marketing and publishing background. I started working in quality assurance at EA (Electronic Arts) when I was 18 years old. I pitched Playground then got promoted to AP to work on it. it sold well enough where I got to keep my job and then I worked on some new IP and sports stuff. After that, I went on to focus on design as a lead designer for 7 years. A few years ago I was hanging out with a few folks at a bar in Silverlake, LA. They were working on a hugely successful game with a really player friendly business model. I asked what their monetisation conversion rate was and it was just through the roof compared to what we were used to on our side of the industry. It floored me and I couldn’t stop thinking about it. The day to day can be really tough but it’s the big outcomes that are exciting and worth it. There’s a lot of iterative, redundant work and that’s how you make cool stuff. Take your time for the big decisions. Do lots of research but they should also just make sense in your gut. Make sure you’re the right person to do something. Hire people that counter your weaknesses. Get out of the way of your team’s success. Work on stuff people haven’t done yet. Solve real problems people actually have that add obvious value. There’s a few folks in the games industry I keep up with that coached me when I was still a kid at EA. But, I’m mostly inspired by film directors and stand-up comedians. They’re the smartest people in the world and take the biggest risks."
