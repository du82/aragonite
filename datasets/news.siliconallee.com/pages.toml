["https://news.siliconallee.com/2024/08/23/tech-runs-deep-but-does-it-run-diverse"]
title = "Tech Runs Deep, But Does It Run Diverse? - Berlin Tech News from Silicon Allee"
description = "Many women are paving the way in deep tech, but there is still a long way to go ’til diversity is achieved. Since partnering with Fraunhofer HHI, we are now focused on growing deep tech businesses and have been paying attention to the state of diversity. One in four European startups is now in deep […]"
full_description = "Many women are paving the way in deep tech, but there is still a long way to go ’til diversity is achieved. Since partnering with Fraunhofer HHI, we are now focused on growing deep tech businesses and have been paying attention to the state of diversity. ”When reviewing applications for our accelerator program, I have noticed that the number of female-owned startups is relatively low. What’s even more interesting is that, in my experience working in tech, the more niche the field, the greater the diversity issue becomes.” As pioneers in Berlin’s tech ecosystem, we have experienced the positive impact of creating an environment where women feel seen, heard, represented, and supported. This inspired the creation of our Women in Deep Tech event, aimed at sparking conversations on this topic. We look forward to shedding light on the realistic stories of women in deep tech who have thrived despite sexism, inspiring women in Berlin, Germany, Europe, and around the world! Thankfully, admist the startling stats, things are changing. More women are pursuing STEM degrees, with 32.8% of STEM graduates in the EU now being female. How does this help? A lot of deep tech companies are university spin outs. Therefore more women studying STEM degrees = more women in deep tech roles (ceterius paribus) In an interview with us, Monique Kugtlisch, innovation manager at Fraunhofer HHI, noted that highlighting non-STEM degrees that can lead to careers in deep tech might be a good way to encourage more female participation – especially as that was her path. On another positive note, the annual investment in startups (co-) founded by women has also increased by more than 10x over the past decade Having women at different levels, including the lower levels, in the investment process is defintely a great impact. Suprisingly, I have found that Germany has a bit more female VC capital presence, which obviously encourages more empathy for female founders and potential female founders.’’"
