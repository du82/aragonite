title = "Swiss Startup Founder Helps 10,000 Therapists to Treat Patients Online"
description = "Necessary cookies are absolutely essential for the website to function properly. This category only includes cookies that ensures basic functionalities and security features of the website. These cookies do not store any personal information."
full_description = "I first met Yanick and Benjamin, the co-founders of bilateralstimulation.io, at a Berlin Founders Fund pitch event, and I was seriously impressed. Their business idea is killer – it solves a real problem for therapists and their pitch was on point. I’m a fan of their mission to modernize healthcare and make it more accessible to everyone. These guys are not only smart but also super efficient. I interviewed Yanick Steinbeck to find out more about his story, and got his top tips for founders! We build software and hardware for therapists to enable them to practice a specific kind of therapy online called EMDR. “It went viral in the EMDR therapist community. The week after launch the site went down because there was so much traffic. I started getting emails from the US, Uganda, India from therapists using it and asking to add new features. 5000 people were using it. It went from weekend project, to side project, to company”. – Yanick “I’m from Switzerland, I’m 29, I studied Business and my first job was in Product Management in Berlin. Then I transitioned to the technology side of startups, I worked as a software engineer. Bilateralstimulation.io brings together by business background and my software background”. Yanick explained that he was a patient of EMDR (Eye movement desensitization and reprocessing) therapy a few years ago and had really benefitted from the therapy. Then during the global pandemic, he decided to build the software needed to enable his own therapist to be able to practice online. “Yes, my friend Benjamin Viehauser joined shortly after I quit my job to focus on bilateralstimulation.io, I’ve known him for a long time, I met him in the US when we were exchange students”. “I love snowboarding, last winter I think I snowboarded a total of 4 weeks, I grew up with it in Switzerland and in the last 2 years I started getting more serious about it”. It’s a method of therapy used to treat trauma, such as PTSD, for war veterans, rape victims, depression and eating disorders, Yanick explained. Your brain is really good at pushing away traumatic experiences. EMDR uses bilateral stimulation to distract your brain so it can’t jump to its natural defence mechanism of suppressing the memory. Bilateral stimulation, as the name suggests, stimulates your brain left and right. It does this through 1. visual (eye movements), 2. auditory (sounds) and 3. tactile (vibrations). This method is more successful at healing trauma than normal therapy. We built the software and hardware that allows therapists to practice EMDR in person and online."
