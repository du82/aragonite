["https://news.siliconallee.com/2023/06/22/why-fund-of-funds-could-be-the-secret-to-diversifying-your-vc-portfolio-in-germany-and-the-rest-of-europe"]
title = "Why Fund of Funds Could Be the Secret to Diversifying Your VC Portfolio in Germany and the Rest of Europe - Berlin Tech News from Silicon Allee"
description = "This article is published as part of Skytrain – a transatlantic investor community bridging the gap between investors and VC funds in the US and Berlin. Join the network or learn more about what we do here. If you want to invest in some high-risk, high-reward startups but have no idea which will be the […]"
full_description = "This article is published as part of Skytrain – a transatlantic investor community bridging the gap between investors and VC funds in the US and Berlin. Join the network or learn more about what we do here. If you want to invest in some high-risk, high-reward startups but have no idea which will be the next Unicorn and which will be sent to the glue factory, that’s where funds of funds (FoF) might just come in to save the day! These fund of funds are pretty special – they give limited partners (that’s LPs for short) access to a variety of top-notch VC funds. Plus, by spreading the love around, they can bring in better returns. And hey, they’re not just about making money – they’re also seen as key players in helping the VC ecosystem mature. In this article, we’re going to give you a bird’s-eye view of what FoFs are all about and what you should keep an eye on as an LP or a potential fund manager. Oh, and of course, this wouldn’t be a Skytrain article if we didn’t focus on Germany, so there’s plenty of info there, too. To help us put this together we consulted experienced FoF investor and founder of Multiple Capital, Ertan Can Over the last 10 years, Ertan has been deeply involved in the European venture Fund of Funds scene. Starting at a family office in 2013 and building the first pan-European micro VC FoF. In 2018, he went on to found Multiple Capital, a FoF focussed on micro VCs (€5-50M). Now, he’s going on to start his third fund. So, yeah, with 10 years of experience investing in almost 50 funds, with over 1,200 portfolio companies, it’s safe to say he knows his onions. Well, the answer’s really in the name. Just like a regular VC fund, you have Limited Partners (LPs) as investors, but instead of investing the fund’s capital directly into startups, you put that money into other VC funds. Of course, there are FoFs that invest in pretty much any kind of asset class (private equity, real estate, hedge funds, stocks, etc.) but as we’re all about venture capital around here, that’s what we’ll focus on."
