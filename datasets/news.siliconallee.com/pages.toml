["https://news.siliconallee.com/2023/04/06/how-to-navigate-the-infamous-german-tax-system"]
title = "How to Navigate the Infamous German Tax System - a (Quick) Guide for VCs - Berlin Tech News from Silicon Allee"
description = "For non-EU based investors, navigating the tax system in a foreign country can be a whole new level of headache. With the right knowledge and planning, non-EU based VCs and angels can still  successfully invest in German startups while minimizing their tax liabilities."
full_description = "This article is published as part of Skytrain – a transatlantic investor community bridging the gap between investors and VC funds in the US and Berlin. Join the network or learn more about what we do here. Disclaimer: this article should not be taken or considered as legal advice. Our aim is only to give you an overview and introduction so that you can better find your path of growth and investment in an optimized legal organization form. For non-EU based investors, navigating the tax system in a foreign country can be a whole new level of headache. That goes double when the tax system is complex and nuanced, which is true for Germany. But put away the Aspirin®, because, with the right knowledge and planning, non-EU based VCs and angels can still successfully invest in German startups while minimizing their tax liabilities. Here are some key things non-EU based investors looking to invest in German startups should keep in mind: The first question you need to ask is: what is my current tax residency status? This will decide whether or not you’re entitled to certain tax exemptions or treaty benefits under Germany’s Double Taxation Agreements (DTA). For example, under the DTA, USA/Germany withholding taxes on dividends can be reduced to 0% if the shareholder holds 80% in the company or 5% if the shareholder holds 10%. However, benefits like this are increasingly becoming subject to strict anti-avoidance principles. For example, the respective US person has to demonstrate “substance” from a tax perspective. On top of that, as a matter of control, the tax authorities are required to exchange information regarding tax payers and relevant tax information. The tax residency status is not always easy to determine, in particular, if the legal owner is for tax purposes a transparent or tax exempt entity. In that respect several anti-abuse regulations exist under national law but also under DTAs. What’s more, even if you’ve determined your tax residency status, you may still have a presence in Germany through a permanent establishment so at least you have limited tax liability in Germany."
author = "Silicon Allee UG"
year_published = 2023
year_updated = 2023
clearnet = "https://news.siliconallee.com/2023/04/06/how-to-navigate-the-infamous-german-tax-system"
