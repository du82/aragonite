["https://news.siliconallee.com/2020/02/20/german-unicorn-celonis-secret-sauce-universities"]
title = "German Unicorn Celonis’ Secret Sauce: Universities - Berlin Tech News from Silicon Allee"
description = "Celonis is valued at over $2.5bn — but the deeptech company which started as a university project still relishes its research roots."
full_description = "This article was produced by Silicon Allee for Sifted.eu as part of our partnership to give German tech news a wider audience. Earlier this month German unicorn Celonis leased an entire floor of one of New York’s most prestigious addresses: One World Trade Center. It was a statement about the wealth and power of the $2.5bn tech company, which has big plans to conquer the US market. But back in the Munich headquarters of the world-leading “process mining” company, which allows large companies like Siemens, 3M, Airbus and Vodafone to dig into how their operations are working, the vibe is less shock-and-awe and more back-to-school. On a recent visit by Sifted, new employees mingled with staff as if they were first-year students during university orientation. Conversations about project presentations mix with chatter about lunch hotspots. There’s even a floor called “The Academy”. It was employee onboarding week — but that’s also just the atmosphere of the company, says cofounder and co-chief executive of Celonis, Alexander Rinke. Sandwiched between two of Germany’s leading universities, Ludwig-Maximilians-Universität (LMU) and the Technische Universität München (TUM), Celonis is hiring heaps of young talent. Despite the money and status, Celonis is at its heart rooted in its founders’ former university paths in data science and the kind of academic research found at the leading universities it sits so close to. The story of how Celonis was founded in 2011 by three German university students — Rinke, Bastian Nominacher and Martin Klenk — goes like this. While attending TUM, the three students were assigned an internship to help regional broadcaster Bayerischer Rundfunk improve its customer service hotline, which was too slow. “We would call the hotline, and mystery call them and [take] notes,” he says, explaining the very manual processes of their research. “We really didn’t get very far. So, we felt we really didn’t make an impact.”"
