["https://news.stanford.edu/2019/08/26/water-droplets-spontaneously-produce-hydrogen-peroxide"]
title = "Water droplets spontaneously produce hydrogen peroxide | Stanford Report"
description = "Despite its abundance, water retains a great many secrets. Among them, Stanford chemists have discovered, is that water microdroplets spontaneously produce hydrogen peroxide."
full_description = "Water is everywhere on Earth, but maybe that just gives it more space to hide its secrets. Its latest surprise, Stanford researchers report Aug. 26 in Proceedings of the National Academy of Sciences, is that microscopic droplets of water spontaneously produce hydrogen peroxide. Chemistry Professor Richard Zare and his lab have shown that water microdroplets spontaneously – and unexpectedly – produce hydrogen peroxide. (Image credit: L.A. Cicero) The discovery could pave the way for greener ways to produce the molecule, a common bleaching agent and disinfectant, said Richard Zare, the Marguerite Blake Wilbur Professor in Natural Science and a professor of chemistry in the Stanford School of Humanities and Sciences.“Water is one of the most commonly found materials, and it’s been studied for years and years and you would think that there was nothing more to learn about this molecule. But here’s yet another surprise,” said Zare, who is also a member of Stanford Bio-X.The discovery was made serendipitously while Zare and his lab were studying a new, more efficient way to create gold nanostructures in tiny water droplets known as microdroplets. To make those structures, the team added an additional molecule called a reducing agent. As a control test, Zare suggested seeing if they could create gold nanostructures without the reducing agent. Theoretically that should have been impossible, but it worked anyway – hinting at an as yet undiscovered feature of microdroplet chemistry.The team eventually traced those results to the presence of a molecule called hydroxyl – a single hydrogen atom paired with an oxygen atom – that can also act as a reducing agent. That equally unexpected result led Katherine Walker, at the time a graduate student in Zare’s lab, to wonder whether hydrogen peroxide – a molecule with two hydrogen and two oxygen atoms – was also present.To find out, Zare, Walker, staff scientist Jae Kyoo Lee and colleagues conducted a series of tests, the simplest of which involved spraying ostensibly pure water microdroplets onto a surface treated so that it would turn blue in the presence of hydrogen peroxide – and turn blue it did. Additional tests confirmed that water microdroplets spontaneously form hydrogen peroxide, that smaller microdroplets produced higher concentrations of the molecule, and that hydrogen peroxide was not lost when the microdroplets recombined into bulk water. Go to the web site to view the video. Video by Jae Kyoo Lee and Hyun Soo Han In this demonstration, a test strip turns blue when sprayed with water microdroplets, indicating the presence of hydrogen peroxide. The researchers ruled out a number of possible explanations before arriving at what they argue is the most likely explanation for hydrogen peroxide’s presence. They suggest that a strong electric field near the surface of water microdroplets in air triggers hydroxyl molecules to bind into hydrogen peroxide.Although the results are something of a basic science curiosity, Zare said, they could have important practical consequences. Hydrogen peroxide is an important commercial and industrial chemical, most often manufactured through an ecologically unfriendly process. The new discovery could help make those methods greener, Zare said, and it could lead to simpler ways to disinfect surfaces – simply spraying water microdroplets on a table or floor might be enough to clean it.“I think it could be one of the most important things I’ve ever done,” Zare said.Additional authors include Robert Waymouth, the Robert Eckles Swain Professor in Chemistry; Friedrich Prinz, the Finmeccanica Professor and a professor of mechanical engineering and of materials science and engineering; postdoctoral fellow Hyun Soo Han; and researchers from the Institute for Basic Science and the Daegu Gyeongbuk Institute of Science and Technology.Zare is also a member of the Cardiovascular Institute, the Stanford Cancer Institute, Stanford ChEM-H, the Stanford Woods Institute for the Environment and the Wu Tsai Neurosciences Institute.The research was funded in part by a grant from the U.S. Air Force Office of Scientific Research and the Institute for Basic Science, South Korea.To read all stories about Stanford science, subscribe to the biweekly Stanford Science Digest. Media Contacts Nathan Collins, Stanford News Service: (650) 228-4677, nac@stanford.edu Subscribe to Stanford ReportNews, insights and events delivered to your inbox each weekday morning.Sign upPopular storiesAn update on staff hiringChanges in brain’s ‘sugar shield’ could be key to understanding effects of agingNew device produces critical fertilizer ingredient from thin airGenerative AI tool marks a milestone in biologyAbbas Milani’s mission to preserve Iranian history"
