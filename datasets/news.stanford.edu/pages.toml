["https://news.stanford.edu/stories/2025/02/future-coronary-arteries"]
title = "Advancements in treatment of heart blockages could do away with invasive bypass surgeries | Stanford Report"
description = "In the latest episode of The Future of Everything podcast, an expert in the biology of the human heart explains how bypass surgeries could be replaced by medicines that regrow new arteries to replace blocked ones."
full_description = "Guest Kristy Red-Horse is a biologist who specializes in coronary artery development and disease. She says the latest advances in treatment of blockages could do away with invasive bypass surgeries in favor of growing new arteries using molecules like CXCL12, known to promote artery regrowth in mice. Red-Horse explains how leaps forward in medical imaging, expanding atlases of gene expressions, and new drug delivery mechanisms could someday lead to trials in humans.But, before that day can arrive, much work remains, as Red-Horse tells host Russ Altman in this episode of Stanford Engineering’s The Future of Everything podcast.For more informationThis story was originally published by Stanford Engineering. Subscribe to Stanford ReportNews, insights and events delivered to your inbox each weekday morning.Sign upPopular storiesAn update on staff hiringChanges in brain’s ‘sugar shield’ could be key to understanding effects of agingNew device produces critical fertilizer ingredient from thin airGenerative AI tool marks a milestone in biologyAbbas Milani’s mission to preserve Iranian history"
