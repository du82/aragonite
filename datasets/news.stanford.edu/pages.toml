["https://news.stanford.edu/stories/2024/12/new-device-produces-critical-fertilizer-ingredient-from-thin-air"]
title = "New device produces critical fertilizer ingredient from thin air | Stanford Report"
description = "A new prototype device demonstrates an innovative approach to producing ammonia – a key component of fertilizer – that could transform an industry responsible for about one-third of global greenhouse gas emissions."
full_description = "The air around us contains a powerful solution for making agriculture more sustainable. Researchers at Stanford University and King Fahd University of Petroleum and Minerals in Saudi Arabia have developed a prototype device that can produce ammonia – a key fertilizer ingredient – using wind energy to draw air through a mesh. The approach they developed, if perfected, might eliminate the need for a century-old method that produces ammonia by combining nitrogen and hydrogen at high pressures and temperatures. The older method consumes 2% of global energy and contributes 1% of annual carbon dioxide emissions from its reliance on natural gas.The study, published Dec. 13 in Science Advances, involved the first on-site – rather than in a lab – demonstration of the technology. The researchers envision someday integrating the device into irrigation systems, enabling farmers to generate fertilizer directly from the air.“This breakthrough allows us to harness the nitrogen in our air and produce ammonia sustainably,” said study senior author Richard Zare, the Marguerite Blake Wilbur Professor in Natural Science and professor of chemistry in the Stanford School of Humanities and Sciences. “It’s a significant step toward a decentralized and eco-friendly approach to agriculture.”Agriculture is the source of about a third of all greenhouse gas emissions, according to the UN Environment Programme.A cleaner alternativeIn preparation for designing their device, the researchers studied how different environmental factors – like humidity, wind speed, salt levels, and acidity – affect ammonia production. They also looked at how the size of water droplets, the concentration of the solution, and the contact of water with materials that do not dissolve in water impact the process. Lastly, they tested the best mix of iron oxide and an acid polymer with fluorine and sulfur to determine the ideal conditions for producing ammonia and understand how these catalyst materials interact with water droplets.The Stanford team’s process makes ammonia cleanly and inexpensively and utilizes the surrounding air to get nitrogen and hydrogen from water vapor. By passing air through a mesh coated with catalysts to facilitate the necessary reaction, the researchers produced enough ammonia with a sufficiently high concentration to serve as a hydroponic fertilizer in greenhouse settings. Unlike traditional methods, the new technique operates at room temperature and standard atmospheric pressure, requiring no external voltage source to be attached to the mesh. Farmers could run the portable device onsite, eliminating the need to purchase and ship fertilizer from a manufacturer.“This approach significantly reduces the carbon footprint of ammonia production,” said study lead author Xiaowei Song, a chemistry research scientist at Stanford.In laboratory experiments, the team demonstrated further potential by recycling water through a spraying system, achieving ammonia concentrations sufficient to fertilize plants grown in a greenhouse after just two hours. By incorporating a filter made from a microporous stone material, this approach could produce enough ammonia to support broader agricultural applications.A future without fossil fuelsThe device is two to three years away from being market-ready, according to study co-author Chanbasha Basheer of King Fahd University of Petroleum and Minerals. In the meantime, the researchers plan to use increasingly large mesh systems to produce more ammonia. “There is a lot of room to develop this,” Basheer said.Ammonia’s importance extends beyond fertilizers. As a clean energy carrier, it can store and transport renewable energy more efficiently than hydrogen gas due to its higher energy density. The innovation positions ammonia as a linchpin in decarbonizing industries like shipping and power generation.“Green ammonia represents a new frontier in sustainability,” Zare said. “This method, if it can be scaled up economically, could drastically reduce our reliance on fossil fuels across multiple sectors.”Related storyFor eco-friendly ammonia, just add waterA triphasic cocktail of water, nitrogen gas, and a solid catalyst sprayed through a low-tech, garden variety, gas-powered sprayer yields ammonia at low energy and low cost.For more informationCo-authors of the study also include Jinheng Xu, a PhD student in chemistry in the Stanford School of Humanities and Sciences.Zare is also a professor, by courtesy, of physics in the Stanford School of Humanities and Sciences and an affiliate of the Stanford Woods Institute for the Environment.The study was funded by the U.S. Air Force Office of Scientific Research and King Fahd University of Petroleum and Minerals. Media contactMarijane Leonard, Stanford School of Humanities and Sciences: marijane.leonard@stanford.edu Subscribe to Stanford ReportNews, insights and events delivered to your inbox each weekday morning.Sign upPopular storiesAn update on staff hiringChanges in brain’s ‘sugar shield’ could be key to understanding effects of agingNew device produces critical fertilizer ingredient from thin airGenerative AI tool marks a milestone in biologyAbbas Milani’s mission to preserve Iranian history"
