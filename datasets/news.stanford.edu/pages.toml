title = "Stanford Heritage Dance Series explores transformative power of dance in health | Stanford Report"
description = "A dance series from Stanford’s Medicine, Movement and Dance Program encourages movement as a way to promote cognition and help prevent dementia and other diseases."
full_description = "Vidyani Suryadevara, director of the Stanford Heritage Dance Series, explores the transformative power of dance in health and well-being. Lifestyle interventions like dance promote physical activity and cognition and can help prevent dementia and other diseases, Suryadevara said. The dance series, part of the Stanford Medical Humanities and Arts’ Medicine, Movement and Dance Program, seeks to highlight diverse dance groups on campus, engage faculty and students in research, and promote the importance of arts in medicine. Subscribe to Stanford ReportNews, insights and events delivered to your inbox each weekday morning.Sign upPopular storiesAn update on staff hiringChanges in brain’s ‘sugar shield’ could be key to understanding effects of agingNew device produces critical fertilizer ingredient from thin airGenerative AI tool marks a milestone in biologyAbbas Milani’s mission to preserve Iranian history"
