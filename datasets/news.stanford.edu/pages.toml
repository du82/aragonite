["https://news.stanford.edu/2018/04/19/stanford-scientists-create-gold-nanoparticles-water"]
title = "Stanford scientists create gold nanoparticles in water | Stanford Report"
description = "The discovery that water microdroplets can replace potentially toxic agents in the creation of gold nanoparticles and nanowires could help usher in a new era of “green chemistry.”"
full_description = "An experiment that, by design, was not supposed to turn up anything of note instead produced a “bewildering” surprise, according to the Stanford scientists who made the discovery: a new way of creating gold nanoparticles and nanowires using water droplets. Gold nanoparticles are attached to threads of gold nanowires. Both structures were formed using a novel redox reaction involving water microdroplets. (Image credit: Courtesy of Jae Kyoo Lee) The technique, detailed April 19 in the journal Nature Communications, is the latest discovery in the new field of on-droplet chemistry and could lead to more environmentally friendly ways to produce nanoparticles of gold and other metals, said study leader Richard Zare, a chemist in the School of Humanities and Sciences and a co-founder of Stanford Bio-X.“Being able to do reactions in water means you don’t have to worry about contamination. It’s green chemistry,” said Zare, who is the Marguerite Blake Wilbur Professor in Natural Science at Stanford.Noble metalGold is known as a noble metal because it is relatively unreactive. Unlike base metals such as nickel and copper, gold is resistant to corrosion and oxidation, which is one reason it is such a popular metal for jewelry.Around the mid-1980s, however, scientists discovered that gold’s chemical aloofness only manifests at large, or macroscopic, scales. At the nanometer scale, gold particles are very chemically reactive and make excellent catalysts. Today, gold nanostructures have found a role in a wide variety of applications, including bio-imaging, drug delivery, toxic gas detection and biosensors.Until now, however, the only reliable way to make gold nanoparticles was to combine the gold precursor chloroauric acid with a reducing agent such as sodium borohydride.The reaction transfers electrons from the reducing agent to the chloroauric acid, liberating gold atoms in the process. Depending on how the gold atoms then clump together, they can form nano-size beads, wires, rods, prisms and more.A spritz of goldRecently, Zare and his colleagues wondered whether this gold-producing reaction would proceed any differently with tiny, micron-size droplets of chloroauric acid and sodium borohydide. How large is a microdroplet? “It is like squeezing a perfume bottle and out spritzes a mist of microdroplets,” Zare said.From previous experiments, the scientists knew that some chemical reactions proceed much faster in microdroplets than in larger solution volumes.Indeed, the team observed that gold nanoparticle grew over 100,000 times faster in microdroplets. However, the most striking observation came while running a control experiment in which they replaced the reducing agent – which ordinarily releases the gold particles – with microdroplets of water.“Much to our bewilderment, we found that gold nanostructures could be made without any added reducing agents,” said study first author Jae Kyoo Lee, a research associate.Viewed under an electron microscope, the gold nanoparticles and nanowires appear fused together like berry clusters on a branch.The surprise finding means that pure water microdroplets can serve as microreactors for the production of gold nanostructures. “This is yet more evidence that reactions in water droplets can be fundamentally different from those in bulk water,” said study coauthor Devleena Samanta, a former graduate student in Zare’s lab and co-author on the paper.If the process can be scaled up, it could eliminate the need for potentially toxic reducing agents that have harmful health side effects or that can pollute waterways, Zare said.It’s still unclear why water microdroplets are able to replace a reducing agent in this reaction. One possibility is that transforming the water into microdroplets greatly increases its surface area, creating the opportunity for a strong electric field to form at the air-water interface, which may promote the formation of gold nanoparticles and nanowires.“The surface area atop a one-liter beaker of water is less than one square meter. But if you turn the water in that beaker into microdroplets, you will get about 3,000 square meters of surface area – about the size of half a football field,” Zare said.The team is exploring ways to utilize the nanostructures for various catalytic and biomedical applications and to refine their technique to create gold films.“We observed a network of nanowires that may allow the formation of a thin layer of nanowires,” Samanta said.Zare is also a member of the Stanford Cardiovascular Institute, the Stanford Cancer Institute, the Stanford Neurosciences Institute and the Stanford Woods Institute for the Environment. He is also a faculty fellow of Stanford ChEM-H. Funding for this research was provided by U.S. Air Force Office of Scientific Research through Basic Research, the Institute for Basic Science in Korea, the Winston Chen Stanford Graduate Fellowship, the Center for Molecular Analysis and Design, and the National Science Foundation.Other co-authors on the study include Hong Gil Nam at DGIST in South Korea. Media Contacts Richard Zare, School of Humanities and Sciences: (650) 723-3062, zare@stanford.eduKer Than, School of Humanities and Sciences: (650) 723-9820, kerthan@stanford.edu Subscribe to Stanford ReportNews, insights and events delivered to your inbox each weekday morning.Sign upPopular storiesAn update on staff hiringChanges in brain’s ‘sugar shield’ could be key to understanding effects of agingNew device produces critical fertilizer ingredient from thin airGenerative AI tool marks a milestone in biologyAbbas Milani’s mission to preserve Iranian history"
year_published = 2025
clearnet = "https://news.stanford.edu/2018/04/19/stanford-scientists-create-gold-nanoparticles-water"
