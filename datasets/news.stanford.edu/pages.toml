["https://news.stanford.edu/stories/2023/04/ecofriendly-ammonia-just-add-water"]
title = "For eco-friendly ammonia, just add water | Stanford Report"
description = "A triphasic cocktail of water, nitrogen gas, and a solid catalyst sprayed through a low-tech, garden variety, gas-powered sprayer yields ammonia at low energy and low cost."
full_description = "Stanford researchers have discovered a simple and environmentally sound way to make ammonia with tiny droplets of water and nitrogen from the air. Richard Zare (Image credit: Do Pham/Stanford University) Ammonia (NH3) is the starting point for producing chemical fertilizers for farm crops. For over a century, the world has relied on the Haber-Bosch process to yield ammonia in bulk, a breakthrough that helped revolutionize agriculture and feed a booming human population. But the industrial procedure is energy intensive. To break nitrogen’s strong bonds, the Haber-Bosch process requires roughly 80-300 atmospheres of pressure and temperatures around 572-1000 F (300-500 C). The steam-treating of natural gas involved in the process also releases ample amounts of climate-changing carbon dioxide.All told, to satisfy the current annual worldwide demand for 150 million metric tons of ammonia, the Haber-Bosch process gobbles up more than 2% of global energy and accounts for about 1% of the carbon dioxide emitted into the atmosphere.In contrast, the innovative method debuted by the Stanford researchers requires less specialized circumstances.“We were shocked to see that we could generate ammonia in benign, everyday temperature-and-pressure environments with just air and water and using something as basic as a sprayer,” said study senior author Richard Zare, the Marguerite Blake Wilbur Professor in Natural Science and a professor of chemistry in the Stanford School of Humanities and Sciences. “If this process can be scaled up, it would represent an eco-friendly new way of making ammonia, which is one of the most important chemical processes that takes place in the world.”The new method also uses little energy and at low cost, thus pointing a way forward to potentially producing the valuable chemical in a sustainable manner. Xiaowei Song, a postdoctoral scholar in chemistry at Stanford, is the lead author of the study, published April 10 in the Proceedings of the National Academy of Sciences.New chemistry from blue-sky studyThe new chemistry discovered follows in the footsteps of pioneering work by Zare’s lab in recent years examining the long-overlooked and surprisingly high reactivity of water microdroplets. In a 2019 study, Zare and colleagues novelly demonstrated that caustic hydrogen peroxide spontaneously forms in microdroplets in contact with surfaces. Experiments since have borne out a mechanism of electric charge jumping between the liquid and solid materials and generating molecular fragments, known as reactive oxygen species. The nitrogen challenge The setup successfully broke apart the pairs of atoms comprising nitrogen molecules – no mean feat, given the three powerful covalent bonds linking the atoms. Those bonds are the reason why even though nitrogen is all around us, it is unable to be utilized by plants (or us) while still in its gaseous form. Plants need nitrogen to make proteins, nucleic acids, and other critical biomolecules such as chlorophyll; we and other animals obtain much of our vital nitrogen by eating plant matter. The discovery that access to nitrogen is a severely limiting factor in crop productivity led to the present widespread use of ammonia and related compounds made from ammonia as fertilizers for crop production to feed the world. Taking those findings further, Song and Zare began a collaboration with study co-author Basheer Chanbasha, a professor of chemistry at King Fahd University of Petroleum and Minerals in Saudi Arabia. Chanbasha specializes in nanomaterials for energy, petrochemical and environment applications and came to Stanford as a visiting scholar last summer.The research team zeroed in on a catalyst – the term for any substance that boosts the rate of a chemical reaction but is not itself degraded or changed by the reaction – that they suspected could help blaze a chemical pathway toward ammonia. The catalyst consists of an iron oxide, called magnetite, and a synthetic membrane invented in the 1960s that is composed of repeating chains of two large molecules.The researchers applied the catalyst to a graphite mesh that Song incorporated into a gas-powered sprayer. The sprayer blasted out microdroplets in which pumped water (H2O) and compressed molecular nitrogen (N2) reacted together in the presence of the catalyst. Using a device called a mass spectrometer, Song analyzed the microdroplets’ characteristics and saw the signature of ammonia in the collected data.Low-tech, low-energy ammonia synthesisZare and colleagues were very pleased with this result, especially in light of the relatively low-tech approach. “Our method does not require the application of any electrical voltage or form of radiation,” said Zare. Related Stories Science & Technology Water droplets spontaneously produce hydrogen peroxide Despite its abundance, water retains a great many secrets. Among them, Stanford chemist Richard Zare and his lab have discovered, is that water microdroplets spontaneously produce hydrogen peroxide. Science & Technology How benign water transforms into harsh hydrogen peroxide A Stanford researcher and colleagues have shown that electric charge transfer when water droplets contact solid materials can spontaneously produce hydrogen peroxide, a finding with implications for cleaning and disinfection efforts. From a broader chemistry perspective, the method is remarkable in that it uses three phases of matter: nitrogen as gas, water as liquid, and catalyst as solid. “To our knowledge, the idea of using gas, liquid, and solid all at the same time to cause a chemical transformation is a first of its kind and has a huge potential for advancing other chemical transformations,” said Zare.While promising, the ammonia production method revealed by Zare, Song, and Chanbasha for now is only at the demonstration stage. The researchers plan to explore how to concentrate the produced ammonia as well as gauge how the process could potentially be scaled up to commercially viable levels. While Haber-Bosch is only efficient when pursued at huge facilities, the new ammonia-making method could be portable and done on-site or even on-demand at farms. That, in turn, would slash the greenhouse gas emissions related to the transportation of ammonia from far-off factories.“With further development, we’re hoping our ammonia generation method could help address the two major looming problems of continuing to feed Earth’s growing population of billions of people, while still mitigating climate change,” said Zare. “We are hopeful and excited to continue this line of research.” Zare is also a member of Stanford Bio-X, the Cardiovascular Institute, the Stanford Cancer Institute, Stanford ChEM-H, the Stanford Woods Institute for the Environment, and the Wu Tsai Neurosciences Institute. The research was funded in part by the U.S. Air Force Office of Scientific Research through the Multidisciplinary University Research Initiative. To read all stories about Stanford science, subscribe to the biweekly Stanford Science Digest. Subscribe to Stanford ReportNews, insights and events delivered to your inbox each weekday morning.Sign upPopular storiesAn update on staff hiringChanges in brain’s ‘sugar shield’ could be key to understanding effects of agingNew device produces critical fertilizer ingredient from thin airGenerative AI tool marks a milestone in biologyAbbas Milani’s mission to preserve Iranian history"
