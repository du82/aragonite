["https://news.stanford.edu/stories/2025/02/future-liquid-biopsy"]
title = "Liquid biopsies promise a less invasive way to diagnose disease | Stanford Report"
description = "In the latest episode of The Future of Everything podcast, physician Ash Alizadeh talks with host Russ Altman about a biopsy option that doesn’t involve surgery."
full_description = "It is coursing through every patient’s veins. Traditionally, biopsies have required invasively gathering tissue – from a lung, a liver, or a fetus. Now it’s possible to look for disease without surgery. The DNA is sitting there in the bloodstream, physician Ash Alizadeh tells host Russ Altman, as they preview the age of liquid biopsies on this episode of Stanford Engineering’s The Future of Everything podcast.For more informationThis story was originally published by Stanford Engineering. Subscribe to Stanford ReportNews, insights and events delivered to your inbox each weekday morning.Sign upPopular storiesAn update on staff hiringChanges in brain’s ‘sugar shield’ could be key to understanding effects of agingNew device produces critical fertilizer ingredient from thin airGenerative AI tool marks a milestone in biologyAbbas Milani’s mission to preserve Iranian history"
