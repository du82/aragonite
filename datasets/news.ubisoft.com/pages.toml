["https://news.ubisoft.com/en-us/article/4IUTIzwOdeRG4l3ms7h1Dz/siege-x-showcase-announced-operation-prep-phase-operator-and-gadget-guide"]
title = "Siege X Showcase Announced, Operation Prep Phase Operator and Gadget Guide"
description = "The future of Rainbow Six Siege will be revealed March 13 at the Siege X Showcase; new Attacker Rauora coming in Year 10 Season 1."
full_description = "A new era of Rainbow Six Siege will be revealed on March 13 at the Siege X Showcase. A teaser shown during the championship weekend of the Six Invitational offered glimpses of the biggest transformation in the game's history, including graphical and audio upgrades, deepened tactical gameplay, and new ways to play the game. Tune in live for the showcase on March 13 at 10AM PT / 6PM CET on the Rainbow Six Siege Twitch channel, and learn more about how you can attend the event in-person in Atlanta, GA. Year 10 of Rainbow Six Siege will also kick off soon with the launch of the first season: Operation Prep Phase. A new Operator named Rauora will join the Attackers and use her D.O.M. Launcher to deploy bulletproof panels in doorways, helping her team reshape the battlefield and dictate the flow of combat. Rauora will be available at the start of the season with the Operation Prep Phase Battle Pass, and unlockable two weeks later with Renown or R6 Credits. Rauora hails from New Zealand and brings a powerful pair of primary weapons into the fray: the 417 designated marksman rifle or the M249 light machinegun. As her secondary weapon, she packs the GSH-18 9mm pistol or the new Reaper MK2 machine pistol. The Reaper is equipped with a red dot sight and an extended magazine, making Rauora very dangerous indeed in close quarters combat. Smoke grenades or breach charges round out her kit. Rauora's gadget is the Deployable Omnilink Mesh (D.O.M.) Launcher, a bulletproof smart cover system that deploys exclusively in doorways. When Rauora takes aim at a doorway, an on-screen icon indicates when she has a valid target and can fire the gadget. Once the projectile reaches the door, it attaches and deploys a bulletproof panel that reaches all the way to the ground. This is unusual for Siege as there is usually room for drones to pass underneath barricades, but the smart cover panel can sense when a drone is nearby; it will then lift the panel slightly and allowing the drone to pass through before fully closing once more."
year_published = 2025
year_updated = 2025
