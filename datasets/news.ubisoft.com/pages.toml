["https://news.ubisoft.com/en-us/article/76r00XL6ykb5dewZt3Hnf9/invincible-guarding-the-globe-gets-major-update"]
title = "Invincible: Guarding the Globe Gets Major Update"
description = "Invincible Season 3 is now available on Amazon Prime Video. Play special levels inspired by the TV series in this free-to-play idle squad RPG."
full_description = "Invincible: Guarding the Globe, the idle squad RPG for iOS and Android devices, just got its biggest update to date, coinciding with the premiere of Amazon Prime Video's Invincible Season 3. The update introduces new levels, a new artifact, quality of life improvements like new leaderboards, and more to the mobile game. The update draws inspiration from Invincible Season 3, starting with Cecil's Nightmares: new levels are inspired by the twists and turns of Season 3. Additionally, two new characters are set to make their way into Invincible: Guarding the Globe, to be revealed with their appearance in Season 3 on the show. The new artifact is the Medical Headband, a Global Defense Agency (GDA) device used to check vitals. Once equipped on your hero, it will trigger, healing all allies within the area of effect. Invincible: Guarding the Globe also added the GDA Pass, offering players a new way to earn in-game rewards. Players can collect Pass Tokens by completing daily missions and GDA Ops, and participating in Alliances; those Tokens can then be used to advance in the GDA Pass and unlock rewards. There are three GDA passes available: Based on the award-winning comic book series by Robert Kirkman, Cory Walker, and Ryan Ottley, Invincible follows 19-year-old Mark Grayson as he inherits his father's superpowers and sets out to become Earth's greatest defender, only to discover the job is more challenging than he could have ever imagined. In this new season, Mark is forced to face his past, and his future, while discovering how much further he'll need to go to protect the people he loves. Starring Steven Yeun, Sandra Oh, and J.K. Simmons, Invincible's voice cast also includes Seth Rogen, Walton Goggins, Gillian Jacobs, Jason Mantzoukas, Zazie Beetz, Zachary Quinto, and more. Season 3 will also include the voices of Aaron Paul, Simu Liu, Kate Mara, and Jonathan Banks."
year_published = 2025
year_updated = 2025
