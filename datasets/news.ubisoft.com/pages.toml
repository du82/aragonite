["https://news.ubisoft.com/en-us/article/6l2CWpw793DWIvCnyOMjji/assassins-creed-leaps-into-balatro"]
title = "Assassin’s Creed Leaps Into Balatro"
description = "In the free Friends of Jimbo 4 update, the roguelike poker game is gaining some familiar faces from Assassin’s Creed II, Assassin’s Creed Syndicate, and Assassin’s Creed Shadows."
full_description = "Assassin's Creed joined Balatro as part of the roguelike poker game's free Friends of Jimbo 4 collaboration pack. As part of the update, players can swap out the traditional King, Queen, Jack of Spades with Assassin's Creed protagonists throughout the ages: Ezio Auditore; Jacob Frye; and Fujibayashi Naoe, a stealthy shinobi and one of Assassin's Creed Shadows two playable characters. Play as Naoe in Assassin's Creed Shadows when it releases on March 20 for PlayStation 5, Xbox Series X|S, Amazon Luna, Mac, and PC through the Ubisoft Store, Ubisoft+ Premium, Steam, and the Epic Games Store. Pre-order the game today to receive the Claws of Awaji expansion and Thrown to the Dogs bonus quest for free."
