["https://news.ubisoft.com/en-us/article/7xdOzwdUYRkxT4AREx9Pjb/assassins-creed-shadows-and-lexip-team-up-for-exclusive-gaming-merch"]
title = "Assassin’s Creed Shadows and Lexip Team Up for Exclusive Gaming Merch"
