["https://news.ubisoft.com/en-us/article/2F04A5vOnSDsXkP9EJAymn/rainbow-six-siege-assault-on-hereford-event-begins-today"]
title = "Rainbow Six Siege Assault on Hereford Event Begins Today"
description = "Play three game modes in a single match in this brand new event; new bundles available for Ying, Mozzie, and Montagne."
full_description = "Team Rainbow is facing a threat like never before in Assault on Hereford, a limited-time Rainbow Six Siege event running from today through February 19. In a first for Siege, players can play up to three game modes in a single match as Team Rainbow clashes with the Keres Legion, a new playable faction made up of modified versions of Striker and Sentry. Set on a version of Hereford Base that's on the brink of collapse, the scenario plays out over three rounds with narrative cinematics to set the stage as the tension escalates. New cosmetic bundles for Ying, Mozzie, and Montagne are available for a limited time as part of the Assault on Hereford Collection, along with Keres Legion-themed bundles for Striker and Sentry. Log in during the event to unlock a free cosmetic Collection pack with a chance to unlock any of the items in these bundles, and tackle event challenges for the chance to earn more. In the first round of Assault on Hereford, Team Rainbow must attack the outdoor section of the map while the Keres Legion defends in a secure area showdown. If Team Rainbow succeeds, the match progresses to the next round, in which Keres Legion attempts to hack into the on-site Rainbow servers by planting a device using bomb mode rules. If Team Rainbow manages to stop Keres Legion in this round, then the final round begins and they must extract their VIP - Deimos - from the facility in a hostage mode finale. Team Rainbow must win all three rounds to win the match, but don't worry, they will have some respawn assistance. Attrition rules apply, meaning that on each round, Team Rainbow has a set pool of Operators they can choose from. Eliminated Operators are removed from the pool, but as long as there are remaining Operators to choose from, a Team Rainbow player can respawn. If, however, all the Team Rainbow Operators are eliminated in a given round, or Team Rainbow fails to complete their objective, the Keres Legion will be victorious. Keres Legion respawns are active throughout every round."
year_published = 2025
year_updated = 2025
