["https://news.ubisoft.com/en-us/article/2CBIpEmfQjY0bFcm7YPGI/watch-the-new-side-quest-trailer-now"]
title = "Watch the New Side Quest Trailer Now"
description = "The new anthology series from Apple TV+ is an expansion of the Mythic Quest universe, and follows the lives of the employees, fans, and players who are impacted by the game."
full_description = "Side Quest, the all-new show from Apple TV+ and Ubisoft Film & Television, debuted its trailer today ahead of its March 26 premiere. The anthology series is an expansion of Apple TV+'s Mythic Quest universe, inspired by Mythic Quest's standalone episodes like A Dark Quiet Death, Backstory, and Sarian. Side Quest follows the lives of employees, fans, and players who are impacted by the game. Side Quest stars Rob McElhenney, Anna Konkle, Derek Waters, William Stanford Davis, Bria Samoné Henderson, Rome Flynn, Leonard Robinson, Gary Kraus, Annamarie Kasper, Esai Morales, and Shalita Grant, among many others. The series is developed and executive produced by Ashly Burch, John Howell Harris, and Katie McElhenney, with Megan Ganz, Rob McElhenney, David Hornsby, Charlie Day, Todd Biermann, Nick Frenkel, Michael Rotenberg, Margaret Boykin, and Genevieve Jones also serving as executive producers. Side Quest is produced for Apple TV+ by Ubisoft Film & Television, 3 Arts Entertainment, and Lionsgate. Catch up on Mythic Quest Season 4 today on Apple TV+, and don't miss Side Quest when all four episodes release on March 26."
