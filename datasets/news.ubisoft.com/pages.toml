full_description = "In Assassin's Creed Shadows, players will explore feudal Japan as the fierce samurai Yasuke and stealthy shinobi Naoe. Ubisoft and gaming-peripheral maker Lexip have teamed up to help you play Assassin's Creed Shadows in style with a gaming accessory collaboration featuring six custom items and unique bundles that will include the game itself when it launches on March 20 for PlayStation 5, Xbox Series X|S, MacOS, and PC via Steam, the Ubisoft Store, and Epic Games Store. Additionally, all items are available along with the standard edition of the game through a series of bundles: Assassin's Creed Shadows releases on March 20 for PlayStation 5, Xbox Series X|S, MacOS, and PC via Steam, the Ubisoft Store, and Epic Games Store."
