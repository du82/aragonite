full_description = "The new anthology series from Apple TV+ is an expansion of the Mythic Quest universe, and follows the lives of the employees, fans, and players who are impacted by the game. The Guardians crossover will introduce the Hunter, Warlock, and Titan character classes to the free-to-play platform fighter, with more to be revealed soon. In the free Friends of Jimbo 4 update, the roguelike poker game is gaining some familiar faces from Assassin’s Creed II, Assassin’s Creed Syndicate, and Assassin’s Creed Shadows. Season 3 of Year 6 brings the search for Alani Kelso, seasonal journey updates, new season pass rewards, and more. The future of Rainbow Six Siege will be revealed March 13 at the Siege X Showcase; new Attacker Rauora coming in Year 10 Season 1. Invincible Season 3 is now available on Amazon Prime Video. Play special levels inspired by the TV series in this free-to-play idle squad RPG. Play three game modes in a single match in this brand new event; new bundles available for Ying, Mozzie, and Montagne."
