title = "A married couple was murdered in Pennsylvania. Are Zizians responsible?"
description = "A person of interest in the murder of Richard and Rita Zajko – their daughter, Michelle – is part of a cultlike group known as the Zizians."
full_description = '''{"@context":"http://schema.org","@type":"NewsArticle","mainEntityOfPage":"https://www.yahoo.com/news/married-couple-murdered-pennsylvania-zizians-190041170.html","headline":"A married couple was murdered in Pennsylvania. Are Zizians responsible?","datePublished":"2025-03-01T19:00:41.000Z","dateModified":"2025-03-01T19:00:41.000Z","keywords":["Michelle Zajko","Pennsylvania state troopers","search warrant","Vermont","Rita Zajko","Pa","Michelle","Richard Zajko","Vermont"],"description":"A person of interest in the murder of Richard and Rita Zajko – their daughter, Michelle – is part of a cultlike group known as the Zizians.","publisher":{"@type":"Organization","name":"Yahoo News","logo":{"@type":"ImageObject","url":"https://s.yimg.com/rz/p/yahoo_news_en-US_h_p_news_2.png","width":310,"height":50},"url":"https://www.yahoo.com/news/"},"author":{"@type":"Person","name":"Rich Schapiro","url":"","jobTitle":""},"creator":{"@type":"Person","name":"Rich Schapiro","url":"","jobTitle":""},"provider":{"@type":"Organization","name":"NBC News","url":"https://www.nbcnews.com/","logo":{"@type":"ImageObject","width":513,"height":100,"url":"https://s.yimg.com/os/creatr-uploaded-images/2023-12/90fe2e40-9383-11ee-afba-e10366cf6e23"}},"image":{"@type":"ImageObject","url":"https://s.yimg.com/ny/api/res/1.2/bQwX4J.UmRLKmC3eD93oNw--/YXBwaWQ9aGlnaGxhbmRlcjt3PTEyNDI7aD04Mjg-/https://media.zenfs.com/en/nbc_news_122/9bc57650446a0e6d495a2555f9d66c9a","height":828,"width":1242},"thumbnailUrl":"https://s.yimg.com/ny/api/res/1.2/bQwX4J.UmRLKmC3eD93oNw--/YXBwaWQ9aGlnaGxhbmRlcjt3PTEyNDI7aD04Mjg-/https://media.zenfs.com/en/nbc_news_122/9bc57650446a0e6d495a2555f9d66c9a"}A married couple was murdered in Pennsylvania. Are Zizians responsible?Rich SchapiroSat, March 1, 2025 at 7:00 PM UTC10 min readA married couple was murdered in Pennsylvania. Are Zizians responsible?Around 9 p.m. on Jan. 12, 2023, a pair of Pennsylvania state troopers showed up at a hotel near the Philadelphia airport.Ten days earlier, a married couple, Richard and Rita Zajko, had been found shot dead inside their home in Chester Heights, a well-to-do Philly suburb. The troopers arrived at the hotel in search of the murder weapon. They had a search warrant targeting a person close to the Zajkos: their daughter, Michelle.The troopers found Michelle Zajko, then 30, and brought her to their barracks for questioning. But she refused to cooperate and was allowed to leave, according to a law enforcement affidavit.AdvertisementAdvertisement#R18akb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #R18akb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Advertisement#R28akb3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #R28akb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Then something strange happened.Troopers told Zajko to wait in the lobby so they could return her car. She bolted instead, leaving behind her vehicle and $40,000 in cash that was found inside of it, according to the affidavit.Michelle Zajko.The murder case went cold for the next two years. But it gained renewed attention in January after prosecutors linked a person of interest in the killing, now known to be Zajko, to other suspects in violent crimes in California and Vermont — people who are members of a cultlike group of highly educated, AI-obsessed vegans known as the Zizians.Zajko’s whereabouts had remained a mystery after she fled the state police barracks. But last month, she and two associates who had also been questioned in the killing of her parents were arrested in Maryland on trespassing and weapons charges.AdvertisementAdvertisement#R18mkb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #R18mkb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Advertisement#R28mkb3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #R28mkb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }The trio were ordered to remain behind bars after a prosecutor said in court that they were part of a group “tied to multiple homicides that have occurred across the United States.”Neither Zajko nor anyone else has been charged in her parents’ murder, but family and friends say they now have hope for the first time that there will be a break in the case.“Hopefully, there will finally be justice for Rich and Rita,” said a family friend who spoke on the condition of anonymity.A bright futureThe Zajkos’ home in Chester Heights, Pa.The Zajkos lived in a neighborhood of stately homes and well-landscaped lawns located about 30 miles west of Philadelphia.AdvertisementAdvertisement#R194kb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #R194kb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Advertisement#R294kb3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #R294kb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Michelle was their only child. She was adopted as a baby and raised at the home in Chester Heights.She went on to study biology at the now-defunct Cabrini University in Pennsylvania before earning a master's degree in bioinformatics at Temple University, according to her LinkedIn page.She was a high-achieving student with lofty goals. Michelle Zajko worked as a research intern at the esteemed Children’s Hospital of Philadelphia. She also interned at NASA’s Ames Research Center in California, studying how spaceflight stresses the human body.“I want to help save people for my career,” she told the Cabrini University student newspaper.AdvertisementAdvertisement#R19gkb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #R19gkb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Advertisement#R29gkb3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #R29gkb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Her parents owned several rental units in a development in the nearby town of Aston. In the years before the killings, Richard Zajko spent much of his time checking in on their tenants and fixing whatever needed to be fixed, two of the tenants said in interviews.“If there was an issue, he was Johnny on the spot,” said one who asked to remain anonymous.Richard and Rita Zajko in 1993.AdvertisementAdvertisement#R19okb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #R19okb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }But Richard Zajko wasn’t just a responsive landlord. He charged his tenants far less than other units went for and repeatedly encouraged them to save enough so that they could buy their own homes, according to the two former tenants.“He genuinely cared about people,” said the other tenant, who also asked to remain anonymous.When he found out a couple renting one of his apartments was having a baby, Zajko lit up. He talked about how thrilled he and his wife were when they adopted their daughter.Michelle was in her late 20s by then and had left home long ago. But Zajko made an offer to the tenants that left them stunned: Would they like to have Michelle’s baby clothes?A shocking crimeInvestigators determined that the Zajkos were killed on Dec. 31, 2022 — the same day Michelle turned 30.AdvertisementAdvertisement#R1a6kb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #R1a6kb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Rita, 69, had a gunshot wound to the back of her head, her autopsy found. Richard, 71, had taken a bullet to his right hand and another to his right temple, according to his autopsy.Their bodies were discovered in an upstairs bedroom. No gun was found at the scene, according to court records, but there were two 9 mm shell casings — each bearing a stamped impression of “9mm Luger +P SIG.”Three days later, investigators with the Vermont and Pennsylvania state police traveled to Michelle Zajko’s home in Coventry, Vermont, a remote town about 20 miles south of the Canadian border. Zajko confirmed to the investigators that she owned a firearm — a semiautomatic handgun that fires 9 mm-type ammunition, according to court records.She allowed the investigators to hold the gun, but they didn’t have a warrant to seize it.AdvertisementAdvertisement#R1agkb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #R1agkb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }“In handling and observing said firearm, it was found to be free of dust, dirt or debris — appearing to be well kept and recently cleaned and/or serviced,” a Vermont State Police search warrant affidavit said.Zajko told troopers that she was in Vermont in the days before and after New Year’s Eve, the affidavit says, and that she had not spoken to her parents since January 2022.The investigators later learned that Zajko had purchased the gun at a local sporting goods store, along with a box of ammunition of the same manufacture and type as the spent casings found at the murder scene in Pennsylvania, the affidavit says.They sought a search warrant for the gun and ammunition that they believed was still inside Zajko’s home. But on the same day it was filed, Jan. 12, 2023, Zajko was actually in Pennsylvania for her parents’ funeral. That’s when Pennsylvania state troopers, carrying a separate search warrant, went to the Candlewood Suites hotel in pursuit of Zajko and her gun.AdvertisementAdvertisement#R1aqkb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #R1aqkb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }There was no gun or ammunition inside Zajko’s hotel room. But after she allegedly bolted from the Pennsylvania State Police barracks, troopers returned to the hotel and found the gun in a room where two of her associates were staying, the Vermont state police affidavit says.The investigators tried to reach Zajko again but had no luck. She was, at that point, in the wind.Six deaths in three statesTwo years passed with no developments in the case. Then on Jan. 20 of this year, a Border Patrol agent, David Maland, was killed in a gunbattle in northern Vermont. The shooting broke out after Maland and other agents pulled over a car that was occupied by two people — Ophelia Bauckholt and Teresa Youngblut.Federal prosecutors say Youngblut opened fire after she got out of the car, prompting at least one agent to shoot back. Bauckholt was fatally shot as she drew a gun, prosecutors say, and Youngblut was also shot but survived.A Border Patrol officer deploys a flare while blocking Interstate 91, a day after David Maland was shot and killed on the highway in Coventry, Vt.Prosecutors have not disclosed a motive in the shooting. They have also not made clear whether Maland was struck by one of the bullets fired by Youngblut or by one of his fellow agents. She has pleaded not guilty to two federal weapons charges.AdvertisementAdvertisement#R1bakb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #R1bakb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Vermont prosecutors said the person who provided the guns used by Youngblut and Bauckholt was a person of interest in a double murder in Pennsylvania — a reference to the Zajkos’ killing.The Bureau of Alcohol, Tobacco, Firearms and Explosives, or ATF, later said that person was Zajko. She was charged last month with lying to a gun dealer by providing a false address at the time of the buys.Teresa Youngblut at Newport City Inn and Suites in Vermont.All three — Zajko, Youngblut and Bauckholt — have ties to the group known as the Zizians, according to people who know or knew them. They splintered off from the so-called rationalist community in Berkeley, California, which attracts high-IQ individuals committed to tackling what they consider existential threats like the rise of AI.Zizians have been tied to six violent deaths across the U.S.Members of the group were accused of assaulting an elderly California man, Curtis Lind, with a samurai sword in 2022 — an attack that left one of them dead after the man opened fire, according to police and prosecutors in the town of Vallejo.Lind was set to testify against his alleged attackers later this year. But he was fatally stabbed outside his home in January. Another member of the group has been charged in the murder.Curtis Lind after the November 2022 attack.The leader of the group is believed to be an Alaskan computer scientist and blogger named Jack “Ziz” LaSota, according to people familiar with the group.LaSota was one of the two other people questioned in the Zajkos’ murder, along with a former housemate of Michelle Zajko’s, Daniel Blank. LaSota and Blank were also staying at the same Philadelphia-area hotel where state troopers had executed search warrants following the Zajkos’ murder.Michelle Zajko’s gun was discovered in the room where LaSota and Blank were staying, according to Pennsylvania State Police. LaSota, who identifies as female, spent five months in jail after she was charged with obstructing the investigation. After she was released on bail, she failed to show up in court, prompting the judge to issue a bench warrant.The whereabouts of all three were unknown until last month.From left, Daniel Blank, Michelle Zajko and Jack LaSota.‘No answers’On Feb. 16, a man in the western Maryland town of Frostburg called police to report three suspicious people on his property, according to prosecutors. They had arrived in box trucks and were wearing all black.Charging documents say that when police arrived, they found Zajko and LaSota in one of the trucks, both wearing gun belts with ammunition. Zajko refused to put her hands behind her back and was forcibly taken to the ground. In Zajko’s waistband, the officers found a handgun, according to the documents.She was charged with trespassing, along with obstruction and weapons offenses. Her lawyer, George McKinley, told NBC News his client “does not wish to release any statements at this time.”Back in Pennsylvania, friends of the Zajkos have long wondered why they were murdered.Authorities have yet to disclose any suspected motive, but additional evidence did appear in the Pennsylvania State Police search warrant affidavit.The morning after the Zajkos’ bodies were discovered, Pennsylvania state troopers reviewed video footage from a neighbor’s Ring camera.It showed a car pulling up to the Zajkos’ home just before 11:30 p.m. Two minutes later, a high-pitched voice is heard yelling what sounds like “Mom!” followed by, “Oh, my God! Oh, God!” the affidavit says.Michelle Zajko had allegedly told investigators that she hadn’t spoken to her parents in about a year. But state troopers discovered that Rita Zajko had tried to communicate with her daughter.On Rita’s phone, the authorities found messages to Michelle about “savings bonds for which it is believ'''
