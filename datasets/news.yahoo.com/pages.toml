full_description = '{"@context":"http://schema.org","@type":"NewsArticle","mainEntityOfPage":"https://www.yahoo.com/news/1991-ice-storm-froze-rochester-012859301.html","headline":"The 1991 Ice Storm that froze Rochester: See rare photos from the historic event","datePublished":"2025-03-02T01:28:59.000Z","dateModified":"2025-03-02T01:28:59.000Z","keywords":["Rochester, New York","Rochester Ice Storm"],"description":"Who could forget the devastating Ice Storm of 1991? See the stunning photos of what happened.","publisher":{"@type":"Organization","name":"Yahoo News","logo":{"@type":"ImageObject","url":"https://s.yimg.com/rz/p/yahoo_news_en-US_h_p_news_2.png","width":310,"height":50},"url":"https://www.yahoo.com/news/"},"author":{"@type":"Person","name":"New York Connect Team","url":"","jobTitle":""},"creator":{"@type":"Person","name":"New York Connect Team","url":"","jobTitle":""},"provider":{"@type":"Organization","name":"Democrat and Chronicle","url":"https://www.democratandchronicle.com"},"image":{"@type":"ImageObject","url":"https://s.yimg.com/ny/api/res/1.2/Oz.FqihZoXNBQ3jcK_hD8w--/YXBwaWQ9aGlnaGxhbmRlcjt3PTEyNDI7aD04NTY-/https://media.zenfs.com/en/democrat-and-chronicle/6ea072fc54c9efc8ef7c8b1efd1579cf","height":856,"width":1242},"thumbnailUrl":"https://s.yimg.com/ny/api/res/1.2/Oz.FqihZoXNBQ3jcK_hD8w--/YXBwaWQ9aGlnaGxhbmRlcjt3PTEyNDI7aD04NTY-/https://media.zenfs.com/en/democrat-and-chronicle/6ea072fc54c9efc8ef7c8b1efd1579cf"}Democrat and ChronicleThe 1991 Ice Storm that froze Rochester: See rare photos from the historic eventNew York Connect TeamSun, March 2, 2025 at 1:28 AM UTC1 min readWho could forget the devastating Ice Storm of 1991 in Rochester, New York? Beginning on the afternoon of Sunday, March 3, the storm paralyzed the region.Ice-covered tree limbs crashed down, blocking roads and bringing down live power lines, leaving more than 200,000 homes and businesses without power. It took 14 days to restore electricity to most RG&E customers.What happened during the 1991 Rochester Ice Storm?The storm hit late on Sunday, March 3, 1991.More than 200,000 homes and businesses in western New York lost power, with RG&E customers experiencing a collective 25.5 million hours of electrical service loss.It took 14 days to restore electricity for most RG&E customers.Governor Mario M. Cuomo declared a state of emergency across 19 counties.Tragically, a 73-year-old woman was found dead from exposure in her unheated Portland Avenue home on March 11—nine days after the storm hit.Insurance companies paid $75 million in claims related to the storm.The total cost of the storm reached $170 million—equivalent to over $300 million today.On May 16, 1991, the Democrat and Chronicle reported on a 124-page internal RG&E report assessing how to improve storm response in the future.This article originally appeared on Rochester Democrat and Chronicle: Ice Storm 1991 in Rochester NY: See rare photos from historic eventAdvertisement#Rbj3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #Rbj3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }About Our AdsSolve the daily Crossword37,850 people played the daily Crossword recently. Can you solve it faster than others?37,850 people played the daily Crossword recently. Can you solve it faster than others?CrosswordPlay on Yahoo'
