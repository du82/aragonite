d.","thumbnailUrl":"https://s.yimg.com/uu/api/res/1.2/12O2BpcOy9rb2FCuNf9uVw--~B/aD0xMDgwO3c9MTkyMDthcHBpZD15dGFjaHlvbg--/https://media.zenfs.com/en/nbcu_713/cb406d2f4c32ba75b9370b0e1bec6131","duration":"PT1M49S","contentUrl":"","embedUrl":"https://news.yahoo.com/video/gene-hackmans-daughter-elizabeth-jean-192439680.html?format=embed","identifier":"79ada59c-1ec2-39a4-baa9-3dc7b7c6f4eb"}Gene Hackman Death Case: Pills Found by Wife’s Body IdentifiedWill ReidSat, March 1, 2025 at 12:54 AM UTC3 min readYahoo is using AI to generate takeaways from this article. This means the info may not always match what's in the article. Reporting mistakes helps us improve the experience.Generate Key TakeawaysOriginally appeared on E! OnlineThe investigation into the deaths of Gene Hackman and Betsy Arakawa has yielded new findings.After the couple and one of their three dogs were found dead in their New Mexico home Feb. 26, Santa Fe County Sheriff Adan Mendoza offered new details about critical evidence in the case.Arakawa, 65, was found lying on the bathroom floor with a space heater and an open bottle of prescription medication nearby with pills “scattered on the counter-top,” per an affidavit for the search warrant obtained by NBC News Feb. 27. The medications taken from the home were an unspecified thyroid medication, the painkiller Tylenol and the blood pressure medication Diltiazem, according to the outlet.AdvertisementAdvertisement#R18akb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #R18akb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Advertisement#R28akb3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #R28akb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Investigators also collected records from MyQuest—an online health lab results portal—as well as a 2025 monthly planner and two green cellphones using the warrant.Earlier in the day, Mendoza stressed the significance of the pills amid the ongoing investigation, characterizing them as “something of concern.”For a look at Gene Hackman through the years, keep scrolling.(E!, NBC News and Today are all part of the NBCUniversal family.)More from E! OnlineChanning Tatum and Model Inka Williams Confirm Romance at Pre-Oscars 2025 PartyElon Musk Welcomes Baby No. 4 With Shivon Zilis, His 14th ChildAlix Earle Breaks Silence on Her Podcast Getting Dropped by Alex Cooper's Company“That’s obviously very important evidence at the scene,” he told Savannah Guthrie during an interview on Today. “That information was collected, that information was passed to the office of the medical investigator to help them make a determination. So we’re looking at that specifically and other medications that were possibly in the residence.”Ron Galella/Ron Galella Collection via Getty ImagesThe sheriff also noted that a full toxicology report “could take up to three months or even possibly longer” to complete, but added that his team is “hoping it comes sooner than later.”AdvertisementAdvertisement#R190kb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #R190kb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Advertisement#R290kb3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #R290kb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Meanwhile, authorities have ruled out the possibility that the couple and their dog died of carbon monoxide poisoning after both Hackman and Arakawa tested negative for the substance, Mendoza said in a Feb. 28 press conference. However, he noted that police could revisit the cause if “there's something else that comes back in the toxicology report.”For a look at Gene Hackman through the years, keep scrolling.(E!, NBC News and Today are all part of the NBCUniversal family.)1965Image/Getty Images1969Michael Ochs Archives/Getty Images1971Getty ImagesAdvertisementAdvertisement#R19okb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #R19okb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Advertisement#R29okb3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #R29okb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }1974Tony Korody/Sygma/Sygma via Getty Images1976Fairchild Archive/WWD/Penske Media via Getty Images1986Donaldson Collection/Michael Ochs Archives/Getty Images1988Jim Smeal/Ron Galella Collection via Getty ImagesAdvertisementAdvertisement#R1aikb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #R1aikb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Advertisement#R2aikb3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #R2aikb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }1988Mario Ruiz/Getty Images1989Purschke/ullstein bild via Getty Images1991Ron Galella, Ltd./Ron Galella Collection via Getty Images1992Ron Galella/Ron Galella Collection via Getty ImagesAdvertisementAdvertisement#R1bckb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #R1bckb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }1993Margaret Norton/NBCU Photo Bank/NBCUniversal via Getty Images via Getty Images1993Jeffrey Mayer/WireImage1993Avalon/Getty Images1995TriStar Pictures/Sunset Boulevard/Corbis via Getty ImagesAdvertisementAdvertisement#R1c6kb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #R1c6kb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }1996Ron Davis/Getty Images1996Jan Jarecki/Penske Media via Getty Images2000Tim Boyle/Newsmakers2001Takashi Seida/Heightened Productions Inc. via Getty ImagesAdvertisementAdvertisement#R1d0kb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #R1d0kb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }2001LUCY NICHOLSON/AFP via Getty Images2003Vera Anderson/WireImage2003Chris Haston/NBCU Photo Bank/NBCUnive