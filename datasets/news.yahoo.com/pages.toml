full_description = '''{"@context":"http://schema.org","@type":"NewsArticle","mainEntityOfPage":"https://www.yahoo.com/news/invasive-and-delicious-the-federal-government-is-begging-people-to-eat-this-massive-harmful-rodent-species-202015284.html","headline":"'Invasive and delicious': The federal government is begging people to eat this massive, harmful rodent species","datePublished":"2025-02-28T20:20:16.000Z","dateModified":"2025-02-28T20:20:16.000Z","keywords":["invasive species","Fish and Wildlife Service","Getty Images"],"description":"Non-native species can devastate vulnerable ecosystems. Conservationists are hoping that the promise of a tasty meal will encourage hunters to help eliminate...","publisher":{"@type":"Organization","name":"Yahoo News","logo":{"@type":"ImageObject","url":"https://s.yimg.com/rz/p/yahoo_news_en-US_h_p_news_2.png","width":310,"height":50},"url":"https://www.yahoo.com/news/"},"author":{"@type":"Person","name":"Mike Bebernes","url":"https://www.yahoo.com/author/mike-bebernes/","jobTitle":"Reporter"},"creator":{"@type":"Person","name":"Mike Bebernes","url":"https://www.yahoo.com/author/mike-bebernes/","jobTitle":"Reporter"},"provider":{"@type":"Organization","name":"Yahoo News","url":"https://news.yahoo.com/","logo":{"@type":"ImageObject","width":422,"height":100,"url":"https://s.yimg.com/cv/apiv2/hlogos/yahoo_NEWS_Light.png"}},"image":{"@type":"ImageObject","url":"https://s.yimg.com/ny/api/res/1.2/4B8QZMzlfdlER4YAbOIa8g--/YXBwaWQ9aGlnaGxhbmRlcjt3PTEyNDI7aD03OTQ-/https://s.yimg.com/os/creatr-uploaded-images/2025-02/cf21a4e0-f606-11ef-b5e5-997c6a1c19bb","height":794,"width":1242},"thumbnailUrl":"https://s.yimg.com/ny/api/res/1.2/4B8QZMzlfdlER4YAbOIa8g--/YXBwaWQ9aGlnaGxhbmRlcjt3PTEyNDI7aD03OTQ-/https://s.yimg.com/os/creatr-uploaded-images/2025-02/cf21a4e0-f606-11ef-b5e5-997c6a1c19bb"}'Invasive and delicious': The federal government is begging people to eat this massive, harmful rodent speciesThe nutria is one of five edible creatures that conservationists are hoping hunters will help eradicate.Mike BebernesReporterUpdated Fri, February 28, 2025 at 8:20 PM UTC3 min readAn adult nutria (Myocastor coypus). (Wolfram Steinberg/Picture Alliance via Getty Images)Yahoo is using AI to generate takeaways from this article. This means the info may not always match what's in the article. Reporting mistakes helps us improve the experience.Generate Key TakeawaysThe U.S. Fish and Wildlife Service is urging Americans to fill their bellies with invasive species that are wreaking havoc on habitats across the country.As part of its National Invasive Species Awareness Week, which ends Friday, the agency released a list of five invasive creatures that they’re encouraging people to hunt and eat as a way to protect native species.“Some of the biggest ecological nightmares are critters that don’t belong here,” the USFWS wrote in a public advisory released late last week. “Invasive species outcompete native wildlife, destroy habitats, and mess up ecosystems. But rather than just complaining about them, let’s put them on the menu.”‘Something out of a disaster movie’At the top of the list is the nutria, a large, water-loving rodent that resembles a beaver without the trademark flat tail. Nutria are native to the swamps of South America. They were brought to the U.S. by fur traders in the 1930s, and many were released into the wild after the market for nutria fur dried up. Since then, nutria have been a menace in marshlands in several regions of the country — particularly along the Gulf Coast, but also on the Atlantic coast and in the Pacific Northwest and parts of California.Nutria are a perfect example of how the introduction of an invasive species can throw off the delicate balance that has developed inside vulnerable ecosystems over centuries of evolution. They are voracious herbivores that can consume up to a quarter of their body weight in a single day. They eat so much that they can devastate the local plant species that keep marshlands stable.AdvertisementAdvertisement#Ragkb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #Ragkb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Advertisement#Rigkb3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #Rigkb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Newsletter: The YodelTrusted news and daily delights, right in your inboxSee for yourself — The Yodel is the go-to source for daily news, entertainment and feel-good stories.Sign upBy signing up, you agree to our Terms and Privacy Policy.“Their nonstop munching and burrowing destroy the plants that keep marshes stable, leading to erosion, loss of habitat, and wetlands that look like something out of a disaster movie,” the USFWS wrote in a Facebook post.Along with the federal government, at least five states have launched nutria eradication programs over the past 25 years that have significantly reduced the damage these creatures cause. In the year 2000, nutria were estimated to be destroying 100,000 acres of Louisiana wetlands per year, according to the state’s Department of Wildlife and Fisheries. Last year, that figure had dropped to just 5,500 acres.On the menuGovernment conservationists are hoping that the appeal of a tasty meal might encourage local hunters to help support their anti-nutria campaign. The USFWS describes nutria meat as lean and mild, with a flavor similar to “rabbit or even the dark meat of a turkey.”A cookbook published in 1963 lists nearly two dozen nutria recipes, including Chicken Fried Nutria and Macaroni-Nutria Casserole. The state of Louisiana has even shared a recipe for Smoked Nutria and Andouille Sausage Gumbo.AdvertisementAdvertisement#Raukb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #Raukb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Advertisement#Riukb3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #Riukb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }The U.S. Department of Agriculture recognizes more than 200 invasive species that exist throughout the country. That list includes land animals, sea creatures, bugs, plants and even viruses. Most of the entries are either inedible or unappealing to eat.The other edible, or even downright tasty, creatures on the USFWS list are the northern snakehead fish, the green iguana, several species of invasive carp and feral hogs.The agency urges anyone considering embarking on an invasive species hunt to check with local authorities to ensure that it’s legal where they live and to take special care when preparing the meat to avoid any risk of foodborne illness that is inherent any time you’re dealing with wild game.Advertisement#Rbj3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #Rbj3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }About Our AdsSolve the daily Crossword37,850 people played the daily Crossword recently. Can you solve it faster than others?37,850 people played the daily Crossword recently. Can you solve it faster than others?CrosswordPlay on Yahoo'''
