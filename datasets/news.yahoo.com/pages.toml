TakeawaysThe BriefPrime Healthcare, a California-based national health care system, said it acquired eight Chicago-area hospitals.The national system also said it will take over multiple senior living and care facilities in Chicago and surrounding suburbs.Prime Healthcare promised millions of dollars of investments into improving and upgrading the facilities.A California-based healthcare company officially acquired eight hospitals and multiple senior living and care facilities in the Chicago area.Prime Healthcare, which already operates hospitals and other facilities in 14 states, announced the acquisition on Saturday.Major change in health careWhat we knowThe Illinois Health Facilities and Services Review Board approved the acquisition after an extensive review process.AdvertisementAdvertisement#Ragkb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #Ragkb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Advertisement#Rigkb3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #Rigkb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }After taking over the Chicago area hospitals and other facilities, Prime Healthcare now operates 51 hospitals, more than 360 outpatient locations and oversees nearly 57,000 employees and affiliated physicians.The system touted its high rankings for health care and track record of turning around financially struggling hospitals.Prime Healthcare said it made employment offers to "substantially all associates at the Chicago area facilities it acquired. The company also said it's committed $250 million for facility upgrades, capital improvements and technology and systems upgrades.Prime Healthcare will now oversee the following hospitals:AdvertisementAdvertisement#Raqkb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #Raqkb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Advertisement#Riqkb3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #Riqkb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Holy Family Medical Center in Des PlainesMercy Medical Center in AuroraResurrection Medical Center in ChicagoSaint Francis Hospital in EvanstonSaint Joseph Medical Center in JolietSaint Joseph Hospital in ElginSt. Mary’s Hospital in KankakeeSaint May of Nazareth Hospital in ChicagoPrime Healthcare will also take over several home health and senior living facilities:Fox Knoll Village in AuroraVilla Franciscan Place in JolietHeritage Village and Heritage Lodge in KankakeeResurrection Place in Park RidgeRainbow Hospice in ChicagoAscension at Home Illinois in JolietAscension at Home Illinois in KankakeeThe system also said it will preserve charity care programs and the hospitals' affiliation with the Catholic church.What they're sayingLocal officials praised the deal for Prime Healthcare to take over the hospitals and facilities in Chicago and throughout the suburbs."This transition marks a significant moment in our community, but I want to make it clear: the quality of care our residents rely on will not be compromised," said Chicago Ald. Daniel La Spata (1st Ward) in a statement. "Prime Healthcare has committed to not only maintaining but enhancing the services at Saint Mary Hospital, ensuring that our neighborhood continues to have access to top-tier medical care."AdvertisementAdvertisement#Rbckb3dd8aqfnntkqH1 { display: none; } @media screen and (max-width: 767.95px) { #Rbckb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }Advertisement#Rjckb3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #Rjckb3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }State Rep. Eva-Dina Delgado (D-Chicago) also praised the acquisition."This acquisition represents an opportunity for our community to benefit from Prime Healthcare's commitment to compassionate, high-quality care," said Delgado, in a statement "I am looking forward to seeing the positive impact this transition will bring to our neighborhoods, from preserving critical healthcare services to creating new opportunities for healthcare professionals."Advertisement#Rbj3dd8aqfnntkqH1 { display: none; } @media screen and (min-width: 768px) { #Rbj3dd8aqfnntkqH1 { display: flex; } iframe { max-width: 100vw; } }About Our AdsSolve the daily Crossword37,850 people played the daily Crossword recently. Can you solve it faster than others?37,850 people played the daily Crossword recently. Can you solve it faster than others?CrosswordPlay on Yahoo'''
