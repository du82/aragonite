["https://news.ycombinator.com/newsfaq.html"]
title = "Hacker News FAQ"
full_description = "The basic algorithm divides points by a power of the time since a story was submitted. Comments in threads are ranked the same way. Other factors affecting rank include user flags, anti-abuse software, software which demotes overheated discussions, account or site weighting, and moderator action. Roughly, the number of upvotes on their posts minus the number of downvotes. These don't match up exactly. Some votes are dropped by anti-abuse software. There are no down arrows on stories. They appear on comments after users reach a certain karma threshold, but never on direct replies. You can't. This is to prevent people from submitting a link with their comments in a privileged position at the top of the page. If you want to submit a link with comments, just submit the link, then add a regular comment. Ask HN lists questions and other text submissions. Show HN is for sharing your personal work and has special rules. All Ask HNs appear on newest and asknew, and all Show HNs on newest and shownew, but there is a small points threshold before a post makes it to ask or show. Faded text means that a comment has been downvoted. You can read the comment in normal text by clicking on its timestamp to go to its page. Moderators sometimes also add [flagged] (though not usually on submissions), and sometimes turn flags off when they are unfair. Click on its timestamp to go to its page, then click the 'flag' link at the top. There's a small karma threshold before flag links appear. Dead posts aren't displayed by default, but you can see them all by turning on 'showdead' in your profile. If you see a [dead] post that shouldn't be dead, you can vouch for it. Click on its timestamp to go to its page, then click 'vouch' at the top. When enough users do this, the post is restored. There's a small karma threshold before vouch links appear. The author deleted the post, or asked us to. Unlike dead posts, these remain deleted even when showdead is turned on. If a story has not had significant attention in the last year or so, a small number of reposts is ok. Otherwise we bury reposts as duplicates."
