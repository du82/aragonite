["https://news.ycombinator.com/newcomments"]
title = "New Comments | Hacker News"
full_description = "The calculus is very different. IE could be developed at a 100% loss for the company if it still otherwise helped Microsoft, which is what happened. Chrome operates similarly. Firefox needs to generate enough money to sustain itself indefinitely. So when there are signs their main source of funding may vanish, they need to keep a war chest together and have investments to weather any oncoming storm. Otherwise they just collapse. The only real functional way forward at this point is some form of mass protest or resistance, which I see as unlikely to occur (and which I am not necessarily advocating for here on HN). Barring that, the reality is that scientific progress will move away from the US and towards our enemies, and we will just have to live with the consequences of the choices we made. The only thing Congress could do is impeach the president and remove him from office, but that seems unlikely when roughly half the country is ecstatic about what he is doing. Congress is supposed to control spending and taxation. The administration is claiming a ton of powers related, especially, to spending. Various actions they’ve taken certainly violate the constitution and laws that exist to ensure Congress’ budget isn’t simply ignored by a president. This is another matter for the courts… unless the Supreme Court decides to rule that the radical and unprecedented far-right “unitary executive” interpretation is correct, in which case we’ve just entered a new and far worse era of American government, and it’s all “legal”. I give it 50/50 they do that. > The Department of Justice said it would move to dismiss all the charges against Meng when the deferral period ends on 21 December 2022… > On 1 December 2022, the prosecution asked a judge to dismiss bank fraud and other charges against her,[58] and the judge dismissed the charges.[17] Impeachment. In a functioning government. Because the elected person campaigned on not doing any of these things. In fact he's putting into play Project 2025, the thing that he explicitly disclaimed knowledge of prior to the elections."
year_published = 2025
clearnet = "https://news.ycombinator.com/newcomments"
