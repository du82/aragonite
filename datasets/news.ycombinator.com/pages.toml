title = "Best Comments | Hacker News"
full_description = '''But boy, will the nations of the world remember this -- how quickly the US can turn from ally to bully. A really bad day for US foreign policy. Whether the senior powers in America are compromised, complicit, or opportunist, it doesn't matter. America is being damaged. Russian interests are being prioritized over American interests. Our military is too powerful for direct conflict, so alternative conflict against our political structure and economy is more logical. America is experiencing a decapitation strike, and our military is not defending us from these domestic enemies. https://archive.is/1xkxK (Decapitation Strike -- Timothy Snyder) 1. There are claims that federal spending is out of control. How do you square that with the fact that spending as a percentage of GDP is only slightly elevated compared to the historical average going back to at least the 1970s, with the main deviation in the past few years coming from the after-effects of the pandemic? [1] 2. Federal spending largely falls into a few categories: taking care of the elderly (36%), defense and veterans (20%), taking care of the poor or disabled (22%), and interest on existing debt (13%). [2] This adds up to 91% of the budget. The US population is aging, which means that 36% slice is going to naturally grow. What do you think should be cut, and how? 3. The US pays far more for health care (28% of the budget if you include Medicare) and with worse outcomes on average. Why shouldn't the health insurance industry be the first item on the chopping block? 4. Corporate tax receipts have been steadily falling as a percentage of GDP. [3] Why shouldn't corporations (that benefit from a healthy and educated workforce, a safe and secure environment, a working transportation system, etc.) be paying their fair share to keep the national debt in check? "We don't really know what this is good for, but spent a lot of money and time making it and are under intense pressure to announce new things right now. If you can figure something out, we need you to help us."'''
