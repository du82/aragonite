["https://news.ycombinator.com/highlights"]
title = "highlights | Hacker News"
full_description = '''In any event, the elaborate arm mechanism, dome plastics we would not know until the model was unveiled to the world at whatever the event was. Before that though, the steel box didn't stop us from opening it up to look inside. Though our steel enclosures had something closer to a baseball "home plate" footprint, when we peeked inside we saw the circular PCB and knew we were being duped. With the dangly display they seemed to go quicker than other prototypes to the dumpsters left in Apple's hallways when the actual product was released. I am aware of three MAME machines I built around discarded prototypes. (Shhh!!!!) I think two of the three prototypes running MAME died eventually — the third I left behind at Apple when I retired. So, fate unknown. Shortly after though is probably when Apple started locking the dumpsters to keep out the divers like me. (Well, probably more to keep them from ending up on eBay I suspect.) It became almost a ritual in the first term of the school year for us to make a visit to IT Support and request a second account... there was always a bit of contention between us about who got the 'proper' username and who got the disambiguated one! In the Blekko search engine back end we built an index that was 'eventually consistent' which allowed updates to the index to be propagated to the user facing index more quickly, at the expense that two users doing the exact same query would get slightly different results. If they kept doing those same queries they would eventually get the exact same results. Systems like this bring in a lot of control systems theory because they have the potential to oscillate if there is positive feedback (and in search engines that positive feedback comes from the ranker which is looking at which link you clicked and giving it a higher weight) and it is important that they not go crazy. Some of the most interesting, and most subtle, algorithm work was done keeping that system "critically damped" so that it would converge quickly.'''
year_published = 2025
clearnet = "https://news.ycombinator.com/highlights"
