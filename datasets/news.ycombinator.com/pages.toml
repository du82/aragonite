title = "Noob Comments | Hacker News"
full_description = '''In fact the only reason I'm replying to your comment is because instead of being a bottle deep in front of the TV at this point in the evening I got bored after one glass and decided to noddle around on the internets. Ask any heavy drinker/alcoholic and they will tell you that one doesn't just have 'one' drink and then move on with something else. One is always too much, and never enough. Now it feels like enough. India which was at that was relatively in a good economic state, should've been a industrial super-power. Except, the "benign" British scuttled not only industrialization, but India's own traditional education and social systems. Revenue did indeed decline from 2000 to 2010, but the trend begins to reverse quite immediately after 2010. On page 15 of the 2023 IRS Data Book [0], total reported revenues were: Adjusted to 2010 dollars using a calculator from the Federal Reserve Bank of Minneapolis [1] for sake of comparison: Using the population figures from the census data you provided, this works out to a per capita revenue of: I notice that some of the decreases and increases in revenue seem to correlate with periods of relative economic prosperity (e.g. the height of the dotcom boom around the year 2000) and periods of relative privation (e.g. the economy was still recovering from the Great Recession in 2010). I don't have any insight into whether these macro events have a more substantial impact on revenue collection in comparison to any changes in tax policy that might have occurred during these periods, but it doesn't seem like a coincidence. Like, I just paid off a car for a friend out of pocket. He burst into tears and cooked me a three course dinner. This man isn't even below the poverty line, but he still struggles to budget rent, food, car payments, healthcare payments, and support his family. Saving is simply not possible most months of the year. Money very literally represents completely different value when you have none. It's.... survival. It's what prevents you from being as happy as the people on tv.'''
