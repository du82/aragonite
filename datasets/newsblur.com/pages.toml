["https://newsblur.com/api"]
title = "The NewsBlur API"
description = "Login as an existing user."
full_description = "NewsBlur is a personal news reader that brings people together to talk about the world. A new sound of an old instrument. NewsBlur's API allows users to retrieve their feeds, feed counts, feed icons, feed statistics, and individual feed stories. No API key is required, but you are required to authenticate before using any of the API endpoints. Please be considerate, and don't hammer our servers. We're quite pleased to point out that this entire API is open-source, including the implementation of the endpoints. You can find the source of the /reader/ views source, /social/ views source, /rss_feeds/ views source, as well as the API definitions in YAML. We love pull requests. If you want to add an endpoint, modify output, or make something better, NewsBlur's repo on Github is the place to make that happen. NewsBlur supports OAuth but to have an OAuth enabled client you must email Samuel to request a client ID and secret. You will need to provide your NewsBlur username, redirect URI (often just your client app's website), and app name. To use OAuth when authenticating requests, be sure to pass the Bearer HTTP header with every request, just as you would on any other OAuth API. Use the /oauth/authorize endpoint to begin the OAuth authentication procedure. Use the /oauth/token endpoint to receive your authorized token, which you can pass in with every request. You are not required to use OAuth, in which case you will need to pass the newsblur_sessionid cookie with every request. This cookie is set on login. NewsBlur's API allows users to retrieve their feeds, feed counts, feed icons, feed statistics, and individual feed stories. No API key is required, but you are required to authenticate before using any of the API endpoints. Please be considerate, and don't hammer our servers. If your project or application allows users to interact with data from NewsBlur, you must cite NewsBlur as the source of your data. You may use the API commercially, by which we mean you may charge people money to use your project which itself uses the API. You may not, however, sell advertising against any data retrieved from NewsBlur's API. Essentially, you can charge money for your application or service, but not wrap NewsBlur in advertisements."
