["https://newsblur.com/privacy"]
title = "Privacy Policy"
full_description = "This policy applies to all information collected or submitted on NewsBlur’s website and our apps for iPhone, Android, and any other devices and platforms. When creating an account, you will be asked to enter an email address and a password. Email addresses are only used for logging in and password resets. We don’t sell emails. If you enable notifications, we must store a token to send them. We use push notifications to initiate background downloads and notify you of new stories. We never use notifications for marketing. We store information about the stories you've read to sync this information between the website and your devices. We also collect anonymous statistics of training data that is available for all users under Statistics on a per feed basis. We use cookies on the site and similar tokens in the app to keep you logged in. Like most websites and apps, we also store information through the use of software that may be transparent to users. For example, we may log your IP address and general information about your browser or device. NewsBlur’s iOS, Android, and web apps collects aggregate, anonymous statistics, such as the percentage of users who use particular features, to improve the app and prioritize future development efforts. Crash reports are also collected to help improve the app. We do not share your personal information with outside parties except to the extent necessary to accomplish NewsBlur’s functionality. In other words, your information is not sold or given away to any third-parties. In the future, we may sell to, buy, merge with, or partner with other businesses. In such transactions, user information may be among the transferred assets. For instance, if you choose to use SSL/https, all communication with the app and website will be sent over HTTPS, and passwords are not stored: they are hashed using advanced, well-researched methods. You may access or change your information or delete your account at any time from the website, under Manage > Account. You may also choose to cancel your subscription from the website in the same dialog."
