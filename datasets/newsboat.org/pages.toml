["https://newsboat.org/releases/2.10.2/docs/faq.html"]
title = "Newsboat FAQ"
full_description = "Numbers that start with zero are treated as octal; starting with Newsboat 2.10, these are not allowed since they only add confusion. Convert octal numbers to decimal, and drop the leading zero. For example, color01 should be replaced with color1, color016 with color14 etc. This is supported since Newsbeuter 0.7. All you need to do is add the following line to your ~/.newsboat/urls file: Newsboat has to behave like that in order to accomodate users of text-based browsers like lynx and w3c. It has to relinquish the terminal and stay out of the way, otherwise people won’t be able to see their browsers."
