["https://newsboat.org/releases/2.10.2/docs/newsboat.html"]
title = "The Newsboat RSS Feedreader"
full_description = 'Newsboat is an RSS/Atom feedreader. RSS and Atom are a number of widely-used XML formats to transmit, publish and syndicate articles, for example news or blog articles. Newsboat is designed to be used on text terminals on Unix or Unix-like systems such as GNU/Linux, FreeBSD or macOS. "Newsboat" is a play on the name of its ancestor, "Newsbeuter". They’re spelled quite differently, but sound similar. ("Newsbeuter" is a pun on German word "wildbeuter"; "newsboat" is an English word.) Newsboats were the vessels that collected and delivered news shuffling between boats in the port. Newsboat the program will collect the news for you, just like its namesakes did back in the day. Newsboat is available as source package. Simply go to https://newsboat.org/ and download the latest source package, which is usually in the .tar.gz file format. Alternatively, you can check out the latest development source tree from the newsboat Git repository by running the following command on the commandline: Newsboat depends on a number of libraries to function correctly. This table lists these dependencies. Please be aware that the list libraries may themselves depend on other libraries. These dependencies are not listed here. Please also be aware that you need a recent C++ compiler. If you intend to modify and regenerate the filter language parser, you will also need Coco/R for C++, which you can download from http://www.ssw.uni-linz.ac.at/coco/. The Coco/R binary must be installed as cococpp in your PATH. Debian users only need to install the package coco-cpp. Use the regenerate-parser make target to regenerate the necessary files. After you’ve downloaded and installed the dependencies mentioned above, you can start compiling and installing newsboat. To compile newsboat, simply run make in the source tree. After a short time, this should complete successfully, and you can go on with installation by running make install. By default, this will install the newsboat binary to the /usr/local/bin directory. You can provide an alternative installation path using the prefix parameter, e.g. running make install prefix=/opt/newsboat will install the binary to the directory /opt/newsboat/bin.'
