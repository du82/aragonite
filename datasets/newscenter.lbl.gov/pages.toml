["https://newscenter.lbl.gov/videos"]
title = "Videos – Berkeley Lab News Center"
description = "Check out these featured videos to learn about Berkeley Lab’s latest research and how it may lead to the solutions of tomorrow."
full_description = "The Basics2Breakthroughs video series focuses on early career scientists discussing their research and what they hope for the future in that research. The “Science in Motion” video series focuses on real approaches, technologies, and solutions that Berkeley Lab is using to solve complex challenges for science, people, and the planet. Researcher Katie Klymko studies current and future quantum computing hardware and their potential to power new algorithms. Her work aims to accelerate complex computations and new discoveries in fields like biology, chemistry, and materials science. For the first time, scientists streamed raw physics data across the entire country in real time, at 100 Gbps, with no buffering or temporal storage. The EJFAT prototype has been designed to allow different types of facilities like X-ray light sources and particle accelerators to stream data to multiple supercomputers for processing and analysis. Successfully enabling such streaming means that researchers can more quickly and easily calibrate and steer time-sensitive experiments while they’re happening."
