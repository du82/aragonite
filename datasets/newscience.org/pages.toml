title = "New Science's Report on the NIH - New Science"
description = """
Introduction In 2006, the National Institutes of Health Reform Act passed Congress. 1 This droll, political document established a Scientific Management Review Board within the NIH. That board — comprised of Dr. Anthony Fauci, a former Lockheed Martin CEO and high-ranking NIH officials — was tasked with issuing recommendations for NIH reform; a noble and useful purpose.
The board has not held a meeting since July 2015 and has written just eight reports in total, all of them between …"""
full_description = "New Science's Report on the NIH By Matt Faherty April 2022 Last month, Congress seeded the Advanced Research Projects Agency for Health (ARPA-H) with $1 billion. The new agency, tasked with “moonshot” biomedical research, is modeled on the Defense Advanced Research Projects Agency, or DARPA, which emphasizes nimble and ambitious projects. ARPA-H will solicit research ideas around key topics and fund the best proposals with milestone-based contracts. The National Institutes of Health (NIH), by comparison, invests about $40 billion into biomedical research each year, but has historically been considered risk-averse. According to a report by Science, many urged the government to make ARPA-H an independent agency to avoid the bureaucratic layers of the NIH. By the end of March, though, STAT reported that ARPA-H would exist “under the auspices” of the NIH, but report directly to the U.S. Secretary of Health and Human Services, Xavier Becerra. This strange bureaucratic outgrowth, then, is a child of appeasement: ARPA-H fundees will have access to the vast breadth of scientists and institutional knowledge embedded in the NIH, while remaining distant enough to not get tied up in the bias and entrenched interests of the agency. To understand why an agency like ARPA-H — tasked with finding breakthroughs in Alzheimer’s, cancer and diabetes treatments — was needed in the first place, one must first understand the NIH. In this analysis from New Science, writer Matt Faherty synthesizes dozens of interviews with current and former NIH employees and grant recipients, as well as hundreds of documents from the academic literature, to provide a comprehensive, but non-exhaustive, overview of the NIH’s operations and impact on bioscience research. Our findings are complex and laden with opposing truths: Yes, the NIH has been the main driver of bioscience innovation for more than 80 years. Without the hundreds of billions of dollars that the NIH has allocated to U.S. scientists, the world, perhaps, would not have CRISPR gene-editing technologies or modern CAR-T therapies to treat cancer. But the NIH, like all giant bureaucracies, suffers from structural problems that hinder its efficiency and leads to considerable, wasteful spending. The agency is risk-averse and excessively funds an aging cadre of scientists, likely at the cost of losing young scientists and missing out on ambitious, transformative ideas. Just ten U.S. universities receive 22% of the NIH’s total extramural grant budget. Still, the agency is revered; almost every scientist that we spoke with agreed its budget should be expanded. If the NIH is the fundamental driver of American bioscience, then hopefully the organization can be induced from within, or from without, to more actively seek improvements. In this document, we break down the NIH’s history and bias, its triumphs and failures. Thank you for reading, The New Science Team Table of Contents Part 1: Big Picture The NIH is Highly Regarded The NIH Is Vital to Careers The Boom Decade Entrenched Interests Institutional Conservatism Francis Collins Part 2: Research Conservatism Aversion to High-Risk Research The “Benevolent Ponzi Scheme” Could The NIH be Slowing Research? The Gravity Well Effect Basic Vs. Applied Research Why Is the NIH Moving Away from Basic and High-Risk Research? Part 3: Research Funding Inequality Researchers Institutions Geography Gini Coefficients Did the Boom Decade cause a concentration of funding among top NIH institutional recipients? The Case for Current Efficiency The Case Against Current Efficiency Proposed Reforms to Funding Inequalities The Failure of the Grant Support Index Researcher Age Part 4: Extramural Research How Study Sections Work Study Section Structure and Process “Groupthink” and Other Issues One “No” is Enough to Kill a Grant Why do Researchers Serve on Study Sections? Application Response Times Proposed Reforms to Study Sections In Defense of Study Sections Transparency of Funding Decisions Grant Writing and Maintenance Part 5: Indirect Costs How are Indirect Cost Rates Calculated? Are Universities Profiting from the Indirect Cost System? Are Indirect Cost Rates Too Low? Impact of Indirect Costs on Researchers Slush Funds and Aggregations How Do Indirect Costs Affect University Hiring? Potential Reforms Part 6: Intramural Research NIH Salaries are Not Competitive Federal Employee Regulations Detractors of Intramural NIH Research Part 7: Political Influences Too Much Trend Chasing Or Maybe Not Enough Trend Chasing Lobbying by Universities and Nonprofits Electoral Pressure Other Instances of Influence on the NIH Part 8: Concluding Thoughts Size, Reproducibility and Intramural Funds Slow and Steady Entrenched Interests Forward Facing Introduction In 2006, the National Institutes of Health Reform Act passed Congress. 1 This droll, political document established a Scientific Management Review Board within the NIH. That board — comprised of Dr. Anthony Fauci, a former Lockheed Martin CEO and high-ranking NIH officials — was tasked with issuing recommendations for NIH reform; a noble and useful purpose. The board has not held a meeting since July 2015 and has written just eight reports in total, all of them between 2010 and 2015. The committee, staffed by high-ranking officials and with the power to identify flaws and encourage reforms in the NIH, has quietly gone defunct. That should be concerning, in part, because the NIH is a behemoth institution with an annual budget of $42.9 billion in 2021 and $51.96 billion in 2022. It consists of 21 institutes, 6 centers and 300,000 current grant recipients and spends about ten times more on bioscience than the next highest-spending government agency (the European Research Council 2) and more than the entire government spending for about two-thirds of the world’s countries. It spends 20 times more on biomedical research, per year, than the Bill and Melinda Gates Foundation. 3 And yet, it does not have a functional internal board to offer feedback or propose reforms. The NIH is the foundational engine of modern bioscience and has contributed to countless breakthroughs, even in a purely modern context — just look at the Human Genome Project and mRNA vaccines. Currently led by Lawrence Tabak, the NIH was formed in 1930 under the Ransdell Act as The National Institute of Health. It was given a single mandate: promote public health through funding internal and external research into biomedical domains. Research activities at the NIH are still divided into two categories: intramural and extramural. Intramural research, which constitutes 10-12% of the NIH’s annual budget, is conducted in NIH labs on NIH property by NIH employees and contractors. Currently, there are over 5,000 individuals conducting intramural research, including 1,200 principal investigators and 4,000 postdoctoral fellows.4 Extramural research is carried out by universities, non-profits, hospitals, and companies with NIH funding that amounts to around 80% of its annual spending. Roughly two-thirds of this extramural spending goes directly to 300,000+ researchers5, while the remaining third goes to host institutions to reimburse their expenses related to government-funded research. In its 90 year history, the NIH has largely staved off politicization; its inflation-adjusted budget has gone up 52% over the last 30 years. Support for government-funded research regularly polls in the high 70 to 80 percent range. Although the NIH is a division within the larger Department of Health and Human Services (HHS), its funding is determined independently by Congress. Since 1938 (the earliest year with financial data), the NIH’s annual budget has decreased only six times. Tens of thousands of people benefit from the NIH through employment. Hundreds of thousands of researchers at universities, private labs, and companies benefit from the NIH through grants. Hundreds of universities, including nearly all of America’s most elite universities, also benefit from the NIH through grants, a large portion of which (more than $10 billion per year) goes straight to those universities and subsidizes their facilities. Pharmaceutical and biotech companies benefit from the NIH by generating basic research, which they then turn into intellectual property and marketable products. The general public benefits from the NIH by reaping the benefits of bio-scientific advancements. It’s not surprising, then, that few people march in the street to reduce the NIH’s budget. No politician campaigns on cutting funds for Alzheimer’s research. Private industries, non-profits and interest groups don’t have a concerted interest in fighting the NIH, which ostensibly exists to promote public health, and is ultimately answerable to the American people. While this popularity can be seen as evidence of its success, we should also recognize the perils of the largest research organization on earth being a government bureaucracy with overwhelming support and virtually no opposition. The NIH’s extramural research is systematically biased in favor of conservative research. This conservatism is a result of both institutional inertia, concerns by the NIH leadership that the organization could lose the support of Congress, and efforts by NIH beneficiaries to maintain the status quo. The extramural grant distribution process, which is run through peer review “study sections,” is badly in need of reform. Though there is considerable variability among study sections, many are beset by groupthink, arbitrary evaluation factors, and political gamesmanship. The NIH may be hamstringing bioscience progress, despite the huge amount of funds it distributes, because its sheer hegemony steers the entire industry by setting standards for scientific work and priorities. Most problematic, the NIH is highly resistant to reform. Many proposals have been shot down during discussion phases, or scaled back before implementation. The NIH’s own internal review board has been inactive since 2015, as mentioned at the start of this report section. Still, many of the NIH’s problems are likely a natural product of being a $40 billion+ per year government bureaucracy. To understand this duality and the inherent complexity of the NIH, I interviewed 41 people and had more informal discussions with about half a dozen more while drafting this article. Eleven sources formerly or currently work in the NIH intramural programs, 24 currently or formerly received extramural funding, 18 currently or formerly served on or ran study sections, five held leadership or advisory positions at the NIH, and six held leadership positions in other bioscience research funding institutions.· I did my best to talk to a wide range of people, spanning mainstream and heterodox positions. Some interviewees had decades of experience with NIH funding, while others left scientific research partially out of a dissatisfaction with academia. Every person that I interviewed was granted anonymity. Despite that promise, quite a few said, during the interview, that they would be concerned about their jobs or ability to get a grant from the NIH in the future if they were publicly attached to a criticism of the NIH. One interviewee referred to a “fortress mentality” within the organization. A few also stated that, regardless of how much I guaranteed anonymity, many researchers would refuse to talk to me because the risk was too great. One interviewee asked three other researchers to talk to me, and all three declined explicitly on these grounds. This is concerning, in part, because the NIH undoubtedly has flaws, it is drifting away from basic research, and it is in clear need of reform. Through my research, I have attempted to establish a comprehensive evaluation of the NIH. My objective is to both present a synthesized consensus of views on the NIH and its many components, and to present dissenting views, especially since many issues at the NIH have provoked mutually incompatible stances on how to improve operations. My goal is to understand what works and what doesn’t work, the nature of the NIH’s incentive structure, where the organization can most be improved, and how the NIH impacts American and global bioscience. I admit that despite the length of this work (33,000 words), I have not covered everything about the NIH. I did my best to broach every interesting topic, but based on feedback from reviewers, I know I have left plenty unsaid; especially the NIH’s impact on scientific journals and publishing. Hopefully others will build on what I have written. Part 1: Big Picture The NIH is Highly Regarded I think the key issue in this large-scale assessment is quality vs. quantity. Has the NIH pushed global science forward because it has funded so many great researchers? Or, because it has so much money, is it pretty much impossible not to fund great researchers when the vast majority of that money gets pumped into elite research institutions? With a few exceptions, all interviewees agreed that the NIH funds lots of good research and has been invaluable to global bioscience progress. Many praised the government’s role in providing funding to so many researchers for over half a century. One interviewee said he “has a tremendous love for the NIH.” Another interviewee, who was born overseas, said the NIH is “part of what makes America great.” When asked whether the NIH’s budget should be increased, decreased, or remain the same, nearly all respondents supported increases. Most commonly, they supported a doubling or even tripling of the NIH budget. Even many of the more critical interviewees supported budget increases. I would rate only five interviewees as net-negative on the NIH as a whole, none of whom had long histories of interactions with the NIH. All emphasized that the NIH’s policies created incentives that rendered its research overly conservative (in an institutional sense), too concentrated in top-level institutions, and likely slowed bioscience research on the margin. The NIH Is Vital to Careers Attaining an NIH grant is nearly essential to having a career in bioscience.6 One interviewee called it the “bread-and-butter” of research, while another called it the “lifeblood” of bioscience research. Multiple interviewees noted that universities de facto require the attainment of multiple NIH or comparable federal grants to become professors and attain tenure. This trend is driven more by economics than anything else. NIH grants are more numerous, pay higher amounts, and last longer periods of time than any other bioscience grants given by the public or private sector. Or, rather, NIH grants have the combination of all three of these qualities, whereas other top institutions only have one or two of them. For instance, there are grants that provide equivalent amounts of money and (often more) time, like from the Howard Hughes Medical Institute (HHMI), but these are far less numerous and therefore harde"
