full_description = "New Science is building new institutions of basic science. Science is the driving force of humanity. Today, science is in crisis. Over the next several decades, New Science will help to create a network of new scientific institutes pursuing basic research while not being dependent on universities, the NIH, and the rest of traditional academia and, importantly, not being dominated culturally by academia. We intend to both enable researchers who would’ve been working in traditional academia to work on problems they could not work on in academia and to increase the absolute number of people who work on pushing the frontier of science, by attracting those who want to pursue basic research but would not have chosen to pursue a career in traditional academia. New Science is a 501(c)3 research nonprofit incorporated in Massachusetts. Contact: alexey@newscience.org 2025 Fellows: Maggie Li (tissue engineering, biophysics), an undergraduate @ University of Toronto. Kiran Kling (climate engineering), an independent researcher. Lev Chizhov (neurotech), an undergraduate @ École Polytechnique. You?.. 2024 Fellows: Michael Domarkas (organoids, neuroscience, and AI), a high school student. Suspended Reason (cultural history), an independent researcher. Andy Kong (human implants), an independent researcher. Max Shirokawa (atomic physics & open science), a graduate student @ MIT. Theia Vogel (multi-agent AI & ML interpretability), an independent researcher. Joshua Bauchner (history of science & the origin of scientific ideas), an independent researcher. Mike Ferguson (developmental biology & tissue engineering), an independent researcher. Samarth Jajoo (ML & proteomics), an undergraduate student @ UC Berkeley. Katya Osipova (evolution & genomics), a postdoc @ Harvard. Seyone Chithrananda (ML & proteomics), an undergraduate student @ UC Berkeley. 2023 Grantees Kevin Liu (computational democracy & AI preparedness), an undergraduate student @ Stanford. Currently @ OpenAI. Benjamin Chang (bio & ML), an undergraduate student @ Harvard. Collin Burns (AI safety), a graduate student @ UC Berkeley. Currently @ OpenAI. Collin Juurakko (biopreservation), a postdoc @ Queen’s University. Currently Founder @ Advanced Agriscience. Alex Epstein (single-cell RNA sequencing), a graduate student @ Rockefeller. Nora Belrose (ML interpretability), Head of interpretability research @ EleutherAI. Neuromatch (online neuroscience education). Daniel Barabasi (connectomics), a graduate student @ Harvard. Currently a Fellow @ Broad. Ryan Flynn (glycans & RNA, molecular biology), a Professor @ Boston Children’s Hospital. Daniel Paleka (ML interpretability), a graduate student @ ETH Zurich. 2022 One-year Fellows: Julie Chen (the role of DNA methylation in aging), an undergraduate @ Stanford. Scott Berger (evolution of multicellularity), a graduate student in the Chistol Lab @ Stanford. 2022 Summer Fellows: Avadhoot Jadhav (synthetic biology & virology), a Master’s student @ IISER Pune. Currently a Research Fellow in the Ploegh Lab @ Harvard Diana Leung (cellular communication & adaption), an independent researcher. Katherine Xiang (protein sequencing), a graduate student at Harvard. Kian Faizi (synthetic biology & evolution), a graduate student in the Phillips Lab @ Caltech. Riley Stockard (synthetic biology), a graduate student in the Lim Lab @ UC Berkeley. See details of fellows' projects here. 2022 Grantees Adam Green (ML & bio), an independent researcher. Currently the CEO @ Markov Bio. Adam Strandberg (cell biology), an independent researcher. Currently a graduate student in the Needleman Lab @ Harvard. Dylan Husmann (cancer research), a graduate student in the Gozani lab @ Stanford. Currently a postdoc in the Gozani lab @ Stanford. Roger’s Bacon (speculative metascience), an independent researcher. James Heathers (automated error detection in scientific papers). Currently a co-founder @ Fuel My Day Foods. Isaak Freeman (neuroscience/BCI research), an undergraduate student at UC Berkeley. Currently a graduate student in the Boyden Lab @ MIT Phillip Compeau (online biology education), a Professor @ CMU. Étienne Fortier-Dubois (metascience), an independent researcher. Currently an AI evaluation specialist @ Elicit. Michael Trinh (RNA sensing), an undergraduate student @ Univeristy of Toronto. Currently a Master’s student @ McGill. are you doing something truly exciting?"
