["https://www.newsguardtech.com/careers/editorial-intern-summer-2025"]
title = "Editorial Intern, Summer 2025 - NewsGuard"
description = "NewsGuard offers paid internship opportunities to current students (undergraduate and graduate) and recent graduates (associates/bachelors/masters degree completion within four months of start of internship).  About NewsGuard Internships NewsGuard’s interns help advance our mission of fighting online misinformation and equipping internet users everywhere with the context they need to find credible news sources online. We aim […]"
full_description = "Editorial Intern, Summer 2025 NewsGuard offers paid internship opportunities to current students (undergraduate and graduate) and recent graduates (associates/bachelors/masters degree completion within four months of start of internship). About NewsGuard Internships NewsGuard’s interns help advance our mission of fighting online misinformation and equipping internet users everywhere with the context they need to find credible news sources online. We aim to ensure every intern leaves with new skills, valuable journalism experience, and new expertise in assessing news media credibility and identifying misinformation. NewsGuard interns learn and practice high-quality, professional journalism, working directly with experienced reporters and editors, including former senior editors from Reuters, The Associated Press, The Chicago Tribune, and other publications. Interns are trained in NewsGuard’s techniques for identifying and refuting online misinformation and rating the credibility of news sources — spanning websites, TV news shows and networks, and podcasts. Interns gain a wide range of reporting, research, and writing skills, such as how to uncover the ownership and financing of online news sources, and how to identify and debunk false claims. Interns will develop writing clear, detailed journalistic writing skills while producing detailed reports about the credibility of news and information sources designed for a mass audience. Interns will be expected to assist with updating and maintaining NewsGuard’s reporting on over 9,000 news and information websites. Interns may also have the opportunity to own specific projects that directly impact NewsGuard’s work fighting misinformation. Past intern projects have included: Developing a system for rating and assessing networks of news websites with similar content and ownership, building out a database of known misinformation narratives and hoaxes, helping to develop and grow a news literacy program that aims to educate internet users ranging from students to senior citizens about how to identify trustworthy information and avoid misinformation online, and contributing to the launch of a broadcast news rating service. We aim for every intern to leave NewsGuard with bylines, clips, and other specific examples and artifacts of their work that will help them demonstrate what they have learned. For interns who show particular skill and promise, we may also offer full-time positions once they graduate or following the end of the summer program. Interns may also be considered for freelance (contributor) roles at the end of their term. Requirements and Eligibility Summer interns must meet the following requirements: Be a student at a degree-granting institution or recent graduate Knowledge of the US news media landscape Be able to work remotely, or in-person in the NYC NewsGuard office Be able to work full-time, 40 hours per week Actively studying journalism or demonstrate a commitment to the profession through other work, internships or other means Internship Dates Summer internships run approximately 10 weeks, with all interns starting the week of June 2, 2025. Salary US-based interns are paid $17/hour. Application Dates and Process Applications will be accepted until 5:00pm ET on Friday, April 4, 2025. Interviews will run from approximately Monday, April 7, 2025, through Wednesday, April 25, 2025. Candidates must complete the following tasks for consideration: Provide a current resume/CV with relevant academic and/or professional work experiences Complete a questionnaire (see NewsGuard’s application form below) Provide three references (academic and/or professional) Submit the above items via NewsGuard’s application form Be available for interview(s) with NewsGuard staff members Global Leader in Information Reliability Ratings Careers Press Privacy Policy Get NewsGuard Terms of Service Contact Cookie Notice Support About 25 W. 52nd Street, 15th Floor New York, NY 10019 Bluesky X Facebook LinkedIn © 2024 NewsGuard® Technologies, Inc. NewsGuard Technologies is solely responsible for the content."
