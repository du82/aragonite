["https://www.newsguardtech.com/it/chi-siamo/perche-puoi-fidarti-di-noi"]
title = "Perché puoi fidarti di noi? - NewsGuard"
description = "Perché siamo giornalisti esperti, che hanno dedicato la propria vita a questa professione. Crediamo profondamente che un giornalismo svolto in modo affidabile abbia un ruolo centrale in una vera democrazia. (Per levare ogni dubbio, i nostri giornalisti provengono tutti da esperienze diverse, e non hanno nessun interesse politico da servire.) Perché puoi leggere i titoli […]"
full_description = "Perché puoi fidarti di noi? Perché siamo giornalisti esperti, che hanno dedicato la propria vita a questa professione. Crediamo profondamente che un giornalismo svolto in modo affidabile abbia un ruolo centrale in una vera democrazia. (Per levare ogni dubbio, i nostri giornalisti provengono tutti da esperienze diverse, e non hanno nessun interesse politico da servire.) Perché puoi leggere i titoli e il curriculum di tutti coloro che in NewsGuard si occupano di svolgere le valutazioni dei siti e di preparare le etichette nutrizionali. Per vedere i nomi e leggere le biografie del nostro staff e dei nostri autori, clicca qui. Perché abbiamo delle norme etiche e delle norme sui conflitti di interesse che tutti i nostri analisti e redattori devono rispettare. Puoi leggere queste norme qui. Perché siamo totalmente trasparenti in tutti i nostri processi decisionali. Le note che compiliamo nelle nostre etichette nutrizionali spiegano chiaramente perché arriviamo a determinate conclusioni. Divulghiamo e spieghiamo in dettaglio i nove criteri che usiamo per valutare ogni sito di notizie riguardo alle pratiche giornalistiche che mette in atto. Non lavoriamo come gli algoritmi. Perché cerchiamo con determinazione la collaborazione dei direttori e dei redattori dei siti di cui ci occupiamo, prima di scrivere qualcosa di negativo sul loro sito. Aggiungiamo sempre i loro commenti nelle nostre etichette nutrizionali (o le modifichiamo dopo aver valutato il loro contributo nel caso in cui le nostre conclusioni iniziali fossero sbagliate). Gli algoritmi non contattano nessuno per chiedere commenti. Perché pubblicheremo sempre tutti i reclami che riceveremo dai proprietari dei siti, riguardo a qualsiasi cosa abbiamo scritto su di loro. Risponderemo pubblicamente e, valutato il reclamo, quando sarà corretto rettificare lo faremo con trasparenza. Puoi leggere la nostra procedura per rettificare gli errori qui. Perché non accettiamo compensi da nessuno dei siti che analizziamo (le nostre entrate provengono dalle piattaforme e dai motori di ricerca a cui concediamo il permesso di aggiungere le nostre valutazioni nei feed e nei risultati di ricerca). Abbiamo analizzato oltre 7.500 siti, responsabili del 95% dell’engagement online in Italia, Francia, Germania, Regno Unito, Canada e Stati Uniti. Perché l’approccio di NewsGuard è supportato dalla ricerca. Leggi il White Paper sulla Disinformazione per saperne di più. Perché il nostro unico scopo è fornirti più informazioni sulle fonti delle notizie che trovi online. Il nostro successo dipende interamente dall’essere affidabili e autorevoli. Lo strumento sull’affidabilità di internet Chi siamo Media Scarica NewsGuard Invia un commento Assistenza Informativa sulla privacy Termini di Servizio Cookie Notice 25 W. 52nd Street, 15th Floor New York, NY 10019 Bluesky X Facebook LinkedIn © 2024 NewsGuard® Technologies, Inc. NewsGuard Technologies is solely responsible for the content."
