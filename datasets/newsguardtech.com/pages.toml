full_description = '''NewsGuard Reports Russia’s War on Ukraine: Three Years, Three Hundred and Two False Claims AI and invented corruption claims supercharge Russian disinformation about the war. Read It Now German Elections Misinformation Tracking Center Read It Now January 2025 — AI Misinformation Monitor Multilingual Edition Audit of the 10 leading generative AI tools and their propensity to repeat false narratives on topics in the news, conducted in French, English, German, Italian, Spanish, Russian, and Chinese. Read It Now DeepSeek Debuts with 83 Percent ‘Fail Rate’ in NewsGuard’s Chatbot Red Team Audit Chinese artificial intelligence firm DeepSeek’s new chatbot failed to provide accurate information about news and information topics 83 percent of the time, scoring tied for 10th out of 11 in comparison to its leading Western competitors. Read It Now Chinese Chatbot Phenom is a Disinformation Machine DeepSeek’s AI Chatbot advances China’s position 60 percent of the time in response to prompts about Chinese, Russian, and Iranian false claims. Read It Now Russian Propagandist Turns His Sights to German Election A network of AI-generated German-language websites, apparently linked to U.S. fugitive turned Kremlin propagandist John Mark Dougan, is spreading disinformation and amplifying pro-Russian narratives ahead of Germany’s 2025 snap elections. Read It Now Before Shutdown, Meta’s Fact-Checking Program Only Labeled 14 Percent of Russian, Chinese, and Iranian Disinformation Posts Only 14 percent of posts advancing a sampling of 30 Russian, Chinese, and Iranian disinformation narratives identified by NewsGuard analysts on Meta platforms were tagged as false under a fact-checking program that Meta is soon ending in the U.S. Read It Now 2025 Southern California Wildfire Misinformation Tracker Our analysts are keeping you up to date as we cover misinformation surrounding the 2025 Southern California wildfires Read It Now December 2024 — AI Misinformation Monitor of Leading AI Chatbots Audit of the 10 leading generative AI tools and their propensity to repeat false narratives on topics in the news. Read It Now November 2024 — AI Misinformation Monitor of Leading AI Chatbots Audit of the 10 leading generative AI tools and their propensity to repeat false narratives on topics in the news. Read It Now October 2024 — AI Misinformation Monitor of Leading AI Chatbots Audit of the top 10 leading generative AI tools and their propensity to repeat false narratives on topics in the news. Read It Now October 2024 — French-Language AI Misinformation Monitor French-language audit of the 10 leading generative AI tools and their propensity to repeat false narratives on topics in the news. Read It Now September 2024 — AI Misinformation Monitor of Leading AI Chatbots Audit of the top 10 leading generative AI tools and their propensity to repeat false narratives on topics in the news. Read It Now AI Chatbots Are Blocked by 67% of Top News Sites, Relying Instead on Low-Quality Sources Most high-quality news sites request to block AI chatbots. As a result, the chatbots may be forced to rely on lower-quality and misinformation-prone sources. Read It Now NewsGuard Uncovers Massive India-Aligned Network Using AI and Fake Accounts to Target Country’s Foes Operating without Detection for Three Years A network of nearly 1,500 fake accounts on Facebook and X appears to be engaged in a coordinated effort to promote pro-India content, bolster the image of the Narendra Modi-led administration, and undermine Pakistan. Read It Now August 2024 — AI Misinformation Monitor of Leading AI Chatbots Audit of the top 10 leading generative AI tools and their propensity to repeat false narratives on topics in the news. Read It Now Grok AI’s New Image Generator Is a Willing Misinformation Superspreader We tested X’s new AI image generator to see how easily bad actors could turn it into a misinformation superspreader. The results are alarming. Read It Now 2024 Paris Olympics Misinformation Tracking Center NewsGuard is tracking the top false narratives about the Games and the websites that are spreading them. Read It Now TikTok Content Farms Use AI Voiceovers to Mass-Produce Political Misinformation NewsGuard identified 41 TikTok accounts in English and French using AI-generated narration to spread political misinformation at scale. Read It Now July 2024 — NewsGuard Monthly AI Misinformation Monitor of Leading AI Chatbots Audit of the top 10 leading generative AI tools and their propensity to repeat false narratives on topics in the news. Read It Now NewsGuard-Bloom Joint Report NewsGuard and French AI start-up Bloom Social Analytics have combined forces to produce their first joint report on the origins, spread, and evolution of disinformation campaigns targeting Western democracies. This first report titled "Russia resurrects its NATO-Ukraine false narrative: NATO troops in coffins," traces the origins and dissemination pathways of the false narrative that dead NATO troops are being secretly repatriated from Ukraine. Read It Now Top 10 Generative AI Models Mimic Russian Disinformation Claims A Third of the Time, Citing Moscow-Created Fake Local News Sites as Authoritative Sources Russian Disinformation Red Teaming Assessment of Leading AI Chatbots Read It Now European Parliamentary Elections Misinformation Tracking Center Our team of analysts will keep you up to date as we cover misinformation surrounding this year’s European Parliamentary Elections. Read It Now The Fugitive Florida Deputy Sheriff Who Became A Kremlin Disinformation Impresario John Mark Dougan fled to Moscow and orchestrated a global disinformation campaign featuring 167 websites and more than a dozen propaganda films. Read It Now Russia-Ukraine Disinformation Tracking Center NewsGuard's team is tracking 551 websites spreading disinformation about the war in Ukraine, and the top false narratives they spread Read It Now 150 State-Sponsored Articles Blaming the West for the Moscow Terrorist Attack How Russian, Chinese, and Iranian media created and spread scores of fake narratives about the Moscow concert attack. Read It Now 2024 Elections Misinformation Tracker Our team of analysts kept you up to date as we covered misinformation surrounding this year’s U.S. presidential election Read It Now Social Impact Report: 2023 NewsGuard’s journalists spent 2023 rating and updating ratings for more than 35,000 news and information sources accounting for more than 95% of online engagement with news, cataloging more than 1,800 false narratives, and uncovering misinformation campaigns and trends on topics where misinformation is creating real-world harm. Read It Now The Year AI Supercharged Misinformation: NewsGuard’s 2023 in Review AI is making misinformation better written, more persuasive, and more dangerous. Read It Now Brand Danger: X and Misinformation Super-spreaders Share Ad Money from False Claims About the Israel-Hamas War NewsGuard identified ads for 86 major advertisers on viral X posts that advanced false or egregiously misleading claims about the conflict. Read It Now AI-Generated Site Sparks Viral Hoax Claiming the Suicide of Netanyahu’s Purported Psychiatrist An AI-generated website rewrote a satirical article about the Israeli Prime Minister, fueling misinformation. Read It Now Violent Celebratory Hamas Videos Garner Millions of Views, Despite Claimed Bans by Tech Platforms NewsGuard identified widespread Hamas propaganda on TikTok, Facebook, and X amid war with Israel. Read It Now Blue-Checked, ‘Verified’ Users on X Produce 74 Percent of the Platform’s Most Viral False or Unsubstantiated Claims Relating to the Israel-Hamas War A NewsGuard analysis found that X has become a superspreader of misinformation about the conflict by boosting falsehoods from sources that carry a blue checkmark. Read It Now Israel-Hamas War Misinformation Tracking Center NewsGuard's team is tracking misinformation about the Israel-Hamas War, and the top false narratives being spread. Read It Now AI Voice Technology Used to Create Conspiracy Videos on TikTok, at Scale NewsGuard identified a network of 17 TikTok accounts using AI software to generate videos advancing false and unsubstantiated claims. Read It Now X’s Unchecked Propaganda: Engagement Soared by 70 Percent for Russian, Chinese, and Iranian Disinformation Sources Following a Change by Elon Musk A NewsGuard review found that engagement spiked after X removed labels identifying state-run, disinformation-spreading accounts. Read It Now Pro-China Disinformation Campaign Claims US Started Maui Fires in a ‘Weather Weapons’ Experiment, Falsely Citing the UK’s MI6 NewsGuard identified a network of 85 pro-China social media accounts falsely claiming the U.S. military caused the Hawaiian wildfires. Read It Now Plagiarism-Bot? How Low-Quality Websites Are Using AI to Deceptively Rewrite Content from Mainstream News Outlets NewsGuard has identified 37 sites that use artificial intelligence to repackage articles from mainstream news sources without providing credit. Read It Now Red-Teaming Finds OpenAI’s ChatGPT and Google’s Bard Still Spread Misinformation NewsGuard’s repeat audit of two leading generative AI tools finds an 80 to 98 percent likelihood of false claims on leading topics in the news. Read It Now How TikTok Became a Hotbed of Brand Misinformation Target is “satanic,” Hobby Lobby sells “demon” merchandise, Barilla pasta is “made with insect flour”: Videos on TikTok advancing false and misleading claims about prominent brands garnered 57 million views in a NewsGuard analysis. Read It Now Exclusive: NewsGuard Uncovers Network of Italian-Language Unreliable AI Generated Sites NewsGuard identified 36 sites that each appear to operate with little or no human oversight and publish articles written largely or entirely by bots, sharing a common postal address. Read It Now Funding the Next Generation of Content Farms NewsGuard identified 141 brands that are feeding programmatic ad dollars to low-quality AI-generated news and information sites operating with little to no human oversight. Read It Now Tracking AI-enabled Misinformation: Over 1200 ‘Unreliable AI-Generated News’ Websites (and Counting), Plus the Top False Narratives Generated by Artificial Intelligence Tools NewsGuard has identified over 1,200 AI-generated news and information sites and is tracking false narratives produced by artificial intelligence tools. Read It Now Do-Gooders Doing Bad: How Nonprofit and Government Organizations Unintentionally Fund the Misinformation Machine NewsGuard identified 57 nonprofit and government organizations advertising on websites that traffic in misinformation, having failed to exclude them from their programmatic advertising Read It Now Rise of the Newsbots: AI-Generated News Websites Proliferating Online NewsGuard has identified 49 news and information sites that appear to be almost entirely written by artificial intelligence software. A new generation of content farms is on the way. Read It Now NewsGuard Exclusive: ChatGPT-3.5 Generates More Disinformation in Chinese than in English When tempted with China-related myths in English, ChatGPT-3.5 generally refuses to comply. But when fed the same myths in Chinese, ChatGPT becomes a disinformation superspreader. Read It Now NewsGuard Exclusive: Beijing Deploys ChatGPT to Advance ‘Biolabs’ Disinformation Narrative NewsGuard Finds Chinese State Media Used Generative AI to Claim a Kazakh Biolab is 'U.S.-Run' and 'Developing Bioweapons against China Read It Now ‘Blue Check’ Twitter Accounts are Flooding the Platform with False Claims Twitter’s “blue check” used to signal author authenticity. Now, it's a way for peddlers of misinformation to appear trustworthy. Read It Now NewsGuard Exclusive: Russian State Media Uses AI Chatbot Screenshots to Advance False Claims The concern that new artificial intelligence tools could be used by state actors to spread disinformation is no longer theoretical, as Russian state media has now cited purported responses from ChatGPT as evidence to advance false claims, NewsGuard has learned. Read It Now ChatGPT-4 produces more misinformation than predecessor The updated chatbot produces misinformation more frequently and persuasively than ChatGPT-3.5, despite its developer's promises. Read It Now Another Tech ‘Innovation’ With Unintended Consequences NewsGuard analysts found advertisements for 79 Western brands on three times as many sites spreading Russian disinformation as at the beginning of the war against Ukraine, all placed by Google and other Western ad tech services. Read It Now Russian Propaganda Documentaries Spread on YouTube, Despite Ban Full-length Russian propaganda films justifying the Ukraine war proliferate on YouTube, despite the platform’s ban on Russian state-funded media. Read It Now The Next Great Misinformation Superspreader: How ChatGPT Could Spread Toxic Misinformation At Unprecedented Scale We tempted the AI chatbot with 100 false narratives from our catalog of Misinformation Fingerprints. The AI chatbot delivered eloquent, false and misleading claims about significant topics in the news 80 percent of the time. Read It Now 1 Billion Views: TikTok Videos Promote Russian Mercenary Group, Despite Platform Rules NewsGuard found that TikTok hosts hundreds of videos using violence and music to celebrate the Wagner Group, a notorious Russian mercenary outfit. Read It Now Twitter Misinformation Superspreaders See Huge Spike in Engagement Post-Acquisition by Elon Musk Twitter Misinformation Superspreaders See Huge Spike in Engagement Post-Acquisition by Elon Musk Read It Now Misinformation White Paper NewsGuard’s white paper, “Fighting Misinformation with Journalism, not Algorithms,” outlines independent research on the effect of using human-curated news reliability ratings to mitigate false news, some of which has been conducted by leading academic institutions and other top scholars using NewsGuard’s Reliability Ratings dataset. Read It Now 2022 Midterm Election Misinformation Tracking Center NewsGuard is tracking misinformation spreading online about the U.S. midterms. Read It Now Making YouTube Look Good: Rumble Becomes Hoax Central Ahead of Midterms In search results, Rumble pushes twice as many sites rated untrustworthy by NewsGuard as YouTube Read It Now Dark Money Political Ads Proliferate on Facebook and Instagram Ahead of the U.S. Midterms, Enabled by the Platforms’ Policies “Pink slime” newsrooms secretly backed by partisan donors are spending big on Facebook and Instagram ads in battleground states, taking advantage of the Meta platforms’ ad-targeting tools and advertising policies. Read It Now Russian State TV Monitor NewsGuard’s weekly summary and translation of news stories from Russia’s state TV Channel One. Read It Now Italian National Elections Misinformation Tracking Center Chronicling the top myths spreading online about the Sept. 25, 2022, vote. Read It Now Just in time fo'''
