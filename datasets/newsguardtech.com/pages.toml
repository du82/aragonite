full_description = "Rating Process and Criteria: TV Programs and Networks NewsGuard employs a team of trained journalists and experienced editors to review and rate televised news programs and networks by watching a representative sample of individual programs and reading a representative sample of program transcripts. The ratings are based on the programs’ adherence to four journalistic criteria. The criteria assess the journalistic standards of each show or network — as well as the overall journalistic standards of the organization associated with it. Based on a site’s performance on the four criteria, it is assigned a Red, Yellow, or Green rating — a risk level; and a safety score from 0-10, indicating its credibility. These scores can used by advertisers and ad agencies as a factor as they make decisions about where they will purchase ads as they plan advertising campaigns for brands and products. Rating Categories Our TV program and network ratings serve as a guide to gauge the general brand-safety and brand-suitability risk for an advertiser of advertising on a particular TV program or network. Based on NewsGuard’s judgment with regard to whether the show generally adheres to each of the criteria, a program or network receives a score from 0-10. That score determines in which risk category the program or network falls. Here are NewsGuard’s four score bands: Lowest risk (10 pts) / Low risk (8-9 pts) advertising environment Some risk (5-7 pts) advertising environment High risk (0-4 pts) advertising environment NewsGuard’s ratings aim to help advertisers make judgments about placing ads on TV programs or networks. Advertisers can use our score bands in conjunction with their own threshold of risk and create inclusion and exclusion lists accordingly. Note: NewsGuard reviews each program and its rating at least quarterly by reviewing a broad, representative sample of program segments and transcripts. However, the resulting scores are based on what NewsGuard judges to be the program’s general standards. Although the scores reflect the management of each show’s commitment to those standards, or lack thereof, they cannot predict deviations from those standards that might occur during a given telecast. Rating Criteria The journalists at NewsGuard assess television news programs and networks based on four criteria. Each is worth a certain number of points, as indicated below, based on its importance. Criteria are evaluated on a pass/fail basis, meaning that a program or network either receives all of the points associated with a criterion or none of them. The criteria and their definitions are listed below: Does not repeatedly convey false information: This network or program does not regularly allow clearly false facts of significant importance to be conveyed by the on-air talent or an interviewee in a way that is unchallenged by other on-air talent or another interviewee. (4 Points) Conveys news on important topics responsibly: This network or program rarely if ever conveys unchallenged false facts, presents unsubstantiated claims as fact, or distorts or misrepresents information regarding important issues. (3 Points) Presents multiple viewpoints: When the on-air talent or guests offer opinions on significant issues, care is generally taken by this network or program to present alternative viewpoints. (2 Points) News organization associated with this program adheres strongly to journalistic standards: The website of the network that airs this program passes all NewsGuard’s credibility criteria. (1 Point) Rating Process The rating process is designed to ensure that NewsGuard’s four basic, apolitical journalistic criteria are applied equally and accurately to all TV programs and networks, regardless of the TV program or network’s topic, tone, or political leaning, if any. Steps include: An analyst assesses the contents of the TV program against four journalistic criteria. Our analysts are trained journalists who conduct reporting to determine relevant details of the program’s credibility practices. The analyst drafts a “TV Label” for the program or network based on this reporting. TV Labels consist of a grid showing the site’s performance on each of the four criteria and a written explanation of the content on the site and why it received its rating. If an analyst believes a program or network may fail one of the first three criteria, the analyst contacts the program or network to attempt to seek comment before publishing the rating. If a representative for the program or network provides a comment, that comment is included in the written assessment of the program or network to provide users with the program or network’s perspective. The rating is reviewed and fact-checked by experienced editors. Multiple senior editors review every TV Label prior to publication. The program or network receives a red, yellow, or green rating based on the four journalistic criteria. The site’s red, yellow, or green rating is determined solely based on the four criteria. In addition, if the show being rated is highly opinionated, that designation is included as a meta-data tag to be used by advertisers that seek to avoid highly opinionated programs. Our team periodically at least quarterly updates its rating of each site. If a site changes its practices, its score on one or more of the four criteria may change. We practice accountability and show our work. Each TV Label contains the names of the writer and editors who worked on the rating. The backgrounds of the analysts and editors named, as well as those of the supervising editors, can be found by clicking on their names or going to the Our Team page of this website. If a program or network disagrees with our rating for its site, it can write a response or complaint using our contact page. Any such complaints will be published on our website here and linked from the program or network’s TV Label. NewsGuard TV Ratings FAQs How does NewsGuard choose which TV programs and networks to rate? NewsGuard works with advertising agencies to determine the TV programs and networks that receive the most engagement and ad spend. These programs are given priority as programs and networks to rate. Beyond that, NewsGuard’s team uses editorial judgement to determine which additional TV programs and networks to rate. How does NewsGuard evaluate TV programs versus TV networks? NewsGuard’s TV Labels for programs and networks are based on the same set of criteria but differ in scope. For program labels, NewsGuard’s analysts limit their assessment to a specific show’s content and practices. For network labels, NewsGuard’s analysts review a cross section of content from multiple shows within a network to gauge the network’s overall editorial standards. For both TV program and network labels, analysts review a recent sampling of broadcasted content and read a sampling of transcripts, then call for comment if a program or network fails one of the criteria, and update labels roughly every three months. How did NewsGuard develop its criteria to rate TV programs and networks? NewsGuard’s criteria were developed by NewsGuard’s team of journalists and editors. They are based on longstanding, widely accepted journalistic standards of accuracy. The criteria were adapted from NewsGuard’s rating criteria for news websites, drawing on many of the same principles and applying them to a television format. The criteria focus on whether a program or network conveys egregiously false information on important topics; whether it does so repeatedly or only occasionally; whether it challenges guests or interviewees who make false claims; and whether it presents multiple perspectives on key issues. What and how much content does NewsGuard review before rating a TV program or network? NewsGuard’s analysts review a sampling of video content of the broadcast over a three-month period from the time of review. This ensures the rating is based on a review of the program or network’s recent practices. Additionally, our analysts browse and search a repository of episodes and episode transcripts from the past 90 days. If necessary, they conduct searches on noteworthy topics such as COVID-19 and elections to understand how each program covered top news topics, especially topics about which key facts are disputed or which are the subject of significant debate. Our analysts also look for important moments in a TV program or network’s recent history, such as recent controversies, retractions, awards and accolades, and examine corresponding video clips. Before quoting, transcripts are always confirmed against original video clips to ensure accuracy. How often does NewsGuard update its ratings and Labels? As a matter of practice, NewsGuard aims to review and refresh its ratings for all programs and networks every three months. However, more frequent updates will occur if circumstances warrant — such as a change in ownership, a change in practices, or if the program or network wins an award or becomes embroiled in a controversy. Read our About, FAQ, and Why should anyone trust NewsGuard? pages for more information on us and our work. Global Leader in Information Reliability Ratings Careers Press Privacy Policy Get NewsGuard Terms of Service Contact Cookie Notice Support About 25 W. 52nd Street, 15th Floor New York, NY 10019 Bluesky X Facebook LinkedIn © 2024 NewsGuard® Technologies, Inc. NewsGuard Technologies is solely responsible for the content."
