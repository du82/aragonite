["https://www.newsguardtech.com/de/uber-uns/warum-sollten-sie-uns-vertrauen"]
title = "Warum sollten Sie uns vertrauen? - NewsGuard"
description = "Weil wir ausgebildete Journalisten sind und unsere ganze Laufbahn diesem Beruf gewidmet haben. Zuverlässiger Journalismus und seine zentrale Rolle in der Demokratie liegen uns sehr am Herzen. (Übrigens: unsere erfahrenen Journalisten bringen unterschiedliche Hintergründe mit und verfolgen keine politische Agenda.) Weil Sie zu jeder NewsGuard-Bewertung und zu jedem Mediensteckbrief, den Sie lesen, auch die Qualifikationen […]"
full_description = "Warum sollten Sie uns vertrauen? Weil wir ausgebildete Journalisten sind und unsere ganze Laufbahn diesem Beruf gewidmet haben. Zuverlässiger Journalismus und seine zentrale Rolle in der Demokratie liegen uns sehr am Herzen. (Übrigens: unsere erfahrenen Journalisten bringen unterschiedliche Hintergründe mit und verfolgen keine politische Agenda.) Weil Sie zu jeder NewsGuard-Bewertung und zu jedem Mediensteckbrief, den Sie lesen, auch die Qualifikationen und Profile der verantwortlichen Redakteure aufrufen können. Die Namen und Biografien unserer Mitarbeiter finden Sie hier. Weil wir eine Richtlinie zu Ethik und Interessenkonflikten haben, der alle unsere Analysten und Redakteure zustimmen müssen. Diese Richtlinie finden Sie hier. Weil wir transparent damit umgehen, wie wir sämtliche Entscheidungen treffen. Unsere Mediensteckbriefe erläutern den Hintergrund zu jeder unserer Entscheidungen. Die neun Kriterien, die wir zur Bewertung der journalistischen Praktiken der Webseiten heranziehen, legen wir offen und erläutern sie ausführlich. Wir sind kein undurchsichtiger Algorithmus. Weil wir konzertierte Anstrengungen unternehmen, von jedem Webseiten-Herausgeber oder -Manager eine Stellungnahme einzuholen, bevor wir etwas Negatives über die Website schreiben. Diese Stellungnahmen werden grundsätzlich immer in unsere Medien-Steckbriefe mit aufgenommen (oder aber wir nehmen nach Abwägung der Stellungnahme Änderungen vor, wenn sich unsere ursprüngliche Schlussfolgerung als falsch erweist). Wir leisten daher wesentlich mehr als Algorithmen. Weil wir Beschwerden von Webseiten-Inhabern über jegliche zu ihrer Seite gemachten Aussagen veröffentlichen. Und wir reagieren öffentlich – und berichtigen uns gegebenenfalls öffentlich nach Prüfung der Beschwerde. Unsere Richtlinie zu Korrektur von Fehlern finden Sie hier. Weil wir von den bewerteten Webseiten keine Gelder annehmen. (Unsere Einnahmen stammen von Plattformen und Suchmaschinen, die unsere Bewertungen lizenzieren und in ihre Feeds und Suchergebnisse integrieren.) Wir haben über 7.500 Webseiten bewertet, die zusammen 95% der Online-Interaktionen in Deutschland, Frankreich, Italien, Kanada und den USA ausmachen. Weil unser einziges Ziel ist, Menschen besser über die Nachrichtenquellen zu informieren, die sie online vorfinden. Unser Erfolg hängt vollständig von unserer Vertrauenswürdigkeit und Zuverlässigkeit ab. Das Vertrauens-Tool fürs Netz Bewertungen Über Uns Presse NewsGuard herunterladen Kontakt Impressum Kunden-Support Datenschutzerklärung Nutzungsbedingungen Cookie-Erklärung 25 W. 52nd Street, 15th Floor New York, NY 10019 Bluesky X Facebook LinkedIn © 2024 NewsGuard® Technologies, Inc. NewsGuard Technologies is solely responsible for the content."
