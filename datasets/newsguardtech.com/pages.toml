full_description = "Cynthia Brill General Counsel [email protected] Cynthia Brill is General Counsel of NewsGuard Technologies, Inc. She previously served as General Counsel to Journalism Online, LLC; Verified Identity Pass (Clear Pass for airport security checkpoints); American Lawyer Media, and Court TV. Prior to that, Brill worked as a commercial litigator at two major law firms in New York City. Brill is currently the Board Chair of Neighbors Link, a nonprofit in Westchester County, New York, which serves immigrants. She has also served on the boards of Phoenix House; the League of Conservation Voters; and The Fund for Public Advocacy. She holds a B.A. from Yale College and a J.D. from New York University. Personal: Married to NewsGuard Co-CEO Steven Brill. Global Leader in Information Reliability Ratings Careers Press Privacy Policy Get NewsGuard Terms of Service Contact Cookie Notice Support About 25 W. 52nd Street, 15th Floor New York, NY 10019 Bluesky X Facebook LinkedIn © 2024 NewsGuard® Technologies, Inc. NewsGuard Technologies is solely responsible for the content."
