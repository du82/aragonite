["https://www.newsguardtech.com/careers/director-marketing"]
title = "Director, Marketing - NewsGuard"
description = "New York, NY The Role NewsGuard is looking for a marketing leader to build widespread awareness of our work helping enterprises and consumers identify reliable information online–and to create demand for the solutions we offer to technology platforms, AI companies, the advertising industry, news aggregators, and news consumers worldwide. NewsGuard’s team of journalistically trained analysts […]"
full_description = "Director, Marketing New York, NY The Role NewsGuard is looking for a marketing leader to build widespread awareness of our work helping enterprises and consumers identify reliable information online–and to create demand for the solutions we offer to technology platforms, AI companies, the advertising industry, news aggregators, and news consumers worldwide. NewsGuard’s team of journalistically trained analysts provides reliability ratings for 35,000 news and information sources based on nonpartisan journalistic criteria and machine-readable “Misinformation Fingerprints” for tracking false claims spreading online. Our revenue focus is chiefly B-to-B data licensing: We license our data to major technology platforms, advertising companies, AI companies, and others seeking to protect against misinformation targeting their users. Our data and reporting also provide consumers with better context on the news they encounter online through a news-literacy browser extension and our public newsletter, Reality Check. Reporting directly to NewsGuard’s General Manager and working closely with the business development team and executive team, the Director of Marketing will seek to elevate NewsGuard’s brand awareness among our licensing prospects, decision makers in the key industries we serve, and, for our consumer products, the general public. The ideal candidate is a proactive self-starter who thinks big and moves quickly, believes in NewsGuard’s mission, and excels in an entrepreneurial culture and environment. Candidates must have demonstrated an ability to work on marketing and communications initiatives in B-to-B and B-to-C contexts. Key Responsibilities Include: NewsGuard is looking for a marketing leader to build widespread awareness of our work combating misinformation and create demand for the solutions we offer to technology platforms, AI companies, the advertising industry, news aggregators, the defense industry and news consumers worldwide. NewsGuard’s team of journalistically trained analysts provides trust ratings for 35,000 news and information sources based on nonpartisan journalistic criteria and machine-readable “Misinformation Fingerprints” for tracking false claims spreading online. Our revenue focus is chiefly B-to-B data licensing: We license our data to major technology platforms, advertising companies, AI companies, and others seeking to protect against misinformation targeting their users. Our data and reporting also provide consumers with better context on the news they encounter online through a news-literacy browser extension and our public newsletter, Reality Check. Reporting directly to NewsGuard’s General Manager and working closely with the business development team and executive team, the Director of Marketing will seek to elevate NewsGuard’s brand awareness among our licensing prospects, decision makers in the key industries we serve, and, for our consumer products, the general public. The ideal candidate is a proactive self-starter who thinks big and moves quickly, believes in NewsGuard’s mission, and excels in an entrepreneurial culture and environment. Candidates must have demonstrated an ability to work on marketing and communications initiatives in B-to-B and B-to-C contexts. We’d like to hear from you if you have: Career experience in B-to-B marketing that demonstrates your ability to develop, and implement strategic marketing activities that deliver tangible results An ambitious and entrepreneurial mindset and approach to your work Experience working in a high-growth startup environment Experience growing consumer demand through digital growth marketing A demonstrated passion for journalism is a plus Salary USD $90,000-$140,000 dependent on experience, plus stock options How to Apply: Send a resume and cover letter to [email protected] About NewsGuard Launched in March 2018 by media entrepreneur and award-winning journalist Steven Brill and former Wall Street Journal publisher Gordon Crovitz, NewsGuard provides reliability ratings and detailed “Nutrition Labels” for 35,000 news and information publishers across the open web, social media, and major content platforms. NewsGuard’s ratings are produced by experienced journalists using apolitical criteria and cover publishers that account for 95% of online engagement in covered markets. NewsGuard also offers a separate product, its Misinformation Fingerprints™ data feed, which contains rich data designed for human- and automated tracking and detection of false narratives spreading online. Misinformation Fingerprints cover a wide range of misinformation topics including elections, politics, health, armed conflicts, international crises, terrorism, business and finance, and more. Data is captured in multiple languages for claims spreading across 84 countries worldwide. NewsGuard’s ratings and Nutrition Labels are licensed by technology and social media platforms, search engines, AI companies, news aggregators, education companies, to help protect their users from mis- and disinformation. Advertisers and ad tech platforms use NewsGuard’s data to target advertising to trustworthy news and avoid wasting ad dollars by monetizing mis- and disinformation that undermines their brand’s credibility. Consumers access NewsGuard’s data directly through a news-literacy browser extension and NewsGuard’s public newsletter, Reality Check, which helps consumers make sense of misinformation spreading online. Global Leader in Information Reliability Ratings Careers Press Privacy Policy Get NewsGuard Terms of Service Contact Cookie Notice Support About 25 W. 52nd Street, 15th Floor New York, NY 10019 Bluesky X Facebook LinkedIn © 2024 NewsGuard® Technologies, Inc. NewsGuard Technologies is solely responsible for the content."
