ralleled insights on the credibility of news websites. This is crucial, given the major threat that non-credible narratives have on corporate reputation. Our in-house Kekst CNC Intelligence team relies on NewsGuard’s transparent methodology to protect some of the world’s best known companies detect and manage risk.” Michael White Director, Kekst CNC “Misinformation narratives pollute public opinion every day, but they can be hard to identify just by looking at the content. The context, such as the credibility of the news source, often gives clear hints. Pulsar has a long history of adding context to the content we see online, and this partnership with NewsGuard adds another crucial piece of background to help PR professionals and marketers stay ahead.” Francesco D’Orazio Founder and CEO, Pulsar Platform “With NewsGuard's best-in-class credibility ratings now integrated into our platform, PeakMetrics clients can track relevant mentions and narratives while immediately understanding critical context. NewsGuard's Nutrition Labels shine a light on how ratings are determined, enabling our clients to take swift action when risky narratives spread or adverse mentions occur on unreliable sites.” Nick Loui CEO, PeakMetrics “Knowing whether to trust in the reliability and accuracy of information found online is a major issue today. [Meltwater's] partnership with NewsGuard gives our customers richer insight into that source base. This partnership will provide customers with an additional lens to understand and report on the quality and credibility of their news coverage, as well as potential misinformation around their brand on social media.” John Box CEO, Meltwater Case Study Pulsar Platform Integrates Reliability Ratings Data into Audience Intelligence Global audience intelligence platform Pulsar partnered with NewsGuard in February 2022 to provide PR experts with NewsGuard’s Reliability Ratings, indicating the general trustworthiness of thousands of news organizations. Read More Press Release PeakMetrics Brings NewsGuard Source Ratings to Clients, Helping Them Manage Brand Risk Brands on PeakMetrics can track the prominence of relevant narratives over time, filter their mentions or search results by NewsGuard credibility level, and see whether their brand or competitors appear on credible news sources or on misinformation websites. Read More Global Leader in Information Reliability Ratings Careers Press Privacy Policy Get NewsGuard Terms of Service Contact Cookie Notice Support About 25 W. 52nd Street, 15th Floor New York, NY 10019 Bluesky X Facebook LinkedIn © 2024 NewsGuard® Technologies, Inc. NewsGuard Technologies is solely responsible for the content.'''
