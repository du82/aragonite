description = "Last Updated: October 17, 2019 Like most businesses, NewsGuard Technologies, Inc. (“NewsGuard”, “we”, “us” or “our”)  employs cookies and similar technologies. This Cookie Notice tells you about our use of cookies and similar technologies on our browser extension and website www.newsguardtech.com (together our “Services”).  For further information about how we use, store, disclose and process […]"
full_description = "Cookie Notice Last Updated: October 17, 2019 Like most businesses, NewsGuard Technologies, Inc. (“NewsGuard”, “we”, “us” or “our”) employs cookies and similar technologies. This Cookie Notice tells you about our use of cookies and similar technologies on our browser extension and website www.newsguardtech.com (together our “Services”). For further information about how we use, store, disclose and process personal information that we obtain through or in connection with the use of our Services, please visit our Privacy Policy. When you first access our website from certain jurisdictions, you will receive a message advising you that cookies and similar technologies are in use. By clicking “accept”, you signify that you understand and agree to the use of these technologies, as described in this Cookie Notice. You do not have to accept cookies and consent can be withdrawn at any time (See ‘How to Control Cookies’, below). You can change your browser or device settings to refuse or restrict cookies, and you may delete them after they have been placed on your device at any time. 1. What are cookies? Cookies are small files containing a string of characters which we may store on your computer or mobile device when you visit our Services. When you visit our Services, the cookies allow us to recognize your browser. Cookies may store your preferences and other information but cannot read data off your hard disk or read cookie files created by other sites. Cookies set by a website owner (in this case, NewsGuard) are called “first party cookies”. Cookies set by parties other than the website owner (e.g. Google) are called “third party cookies”. Third party cookies enable third party features or functionality to be provided on or through the Services (e.g. analytics). 2. The Cookies We Use The information that we collect with cookies allows us to statistically analyze usage of our Services, and to improve and customize our content and other offerings. However, we only disclose information collected with cookies to third parties on an aggregated basis without the use of any information that personally identifies you. The specific types of first party and third party cookies placed by our Services and the purposes they perform are described in the table below: Type of Cookies Who serves these cookies How to Refuse Strictly Necessary Cookies These are cookies that are required for the operation of our website. NewsGuard CookiePro These cookies are strictly necessary to deliver the Services and therefore cannot be refused. They can be deleted or blocked using your browser settings, however (see Section 3, How to Control Cookies, below). Performance and Functionality Cookies These are used to recognize you when you return to our website. This enables us to personalize our content for you and remember your preferences (for example, your choice of language or region), but are non-essential to the performance of the website. NewsGuard These cookies can be deleted or blocked using your browser settings (see Section 3, How to Control Cookies, below). Analytical Cookies These cookies collect information about how users access and move through the Services. These cookies also collect geolocation information (this is limited to the region from which you access our website or use our browser extension) and information about the computer, mobile device or other device you use to access the Services, such as web browser type, language and version, screen size and other transactional information. We use this information in aggregate form to help us to improve the way our Services work. Google Analytics These cookies can be deleted or blocked using your browser settings (see Section 3, How to Control Cookies, below). Alternatively, please follow the link below to opt-out: – Google Analytics: https://tools.google.com/dlpage/gaoptout 3. How to Control Cookies Website When you first access our website from certain jurisdictions, you will receive a message advising you that cookies and similar technologies are in use. You do not have to accept cookies and consent can be withdrawn at any time. You can do this by clicking the appropriate opt-out provided in the cookie table above or by activating the settings on your browser that allows you to refuse all or some cookies. Please follow the links below to helpful information for the most popular browsers: Microsoft Internet Explorerhttps://support.microsoft.com/en-gb/help/17442/windows-internet-explorer-delete-manage-cookies Google Chrome https://support.google.com/chrome/answer/95647?co=GENIE.Platform%3DDesktop&hl=enMozilla Firefox https://support.mozilla.org/en-US/kb/enable-and-disable-cookies-website-preferences Apple Safarihttps://support.apple.com/guide/safari/manage-cookies-and-website-data-sfri11471/mac In addition, you can exercise advertising cookie choices by visiting: http://www.aboutads.info/choices/http://www.networkadvertising.org/choices/ OR http://youronlinechoices.com/ These opt-out tools are provided by third parties, not NewsGuard. NewsGuard does not control or operate these tools or the choices that advertisers and others provide through these tools. Browser extension You may opt-in to, and out of, our use of analytics cookies via the browser extension settings at any time. Cookies will not be placed via the browser extension unless you have first given your valid consent to placement. 4. Changes to this Cookie Notice Any changes we make to our Cookie Notice in the future will be posted on this page and, where appropriate, notified to you by e-mail. Please check back frequently to see any updates or changes to this Cookie Notice. 5. Contact us If you have any questions or concerns about this Cookie Notice or NewsGuard’s data practices, please see our Privacy Policy, or contact us using the details set out below: Email address: [email protected]Postal address: NewsGuard Technologies, Inc., 25 West 52nd Street, New York, NY 10019Telephone number: +1-740-480-1850 Global Leader in Information Reliability Ratings Careers Press Privacy Policy Get NewsGuard Terms of Service Contact Cookie Notice Support About 25 W. 52nd Street, 15th Floor New York, NY 10019 Bluesky X Facebook LinkedIn © 2024 NewsGuard® Technologies, Inc. NewsGuard Technologies is solely responsible for the content."
