description = "Chine Labbe is Managing Editor & Vice President Partnerships, Europe and Canada at NewsGuard. In April 2023, she was appointed by Radio France’s Board of Directors as a member of the Committee on Honesty, Independence and Pluralism for the programs of Radio France (the French national public radio.)  In recent years, she has also collaborated […]"
full_description = "Chine Labbe Managing Editor & Vice President Partnerships, Europe and Canada [email protected] Chine Labbe is Managing Editor & Vice President Partnerships, Europe and Canada at NewsGuard. In April 2023, she was appointed by Radio France’s Board of Directors as a member of the Committee on Honesty, Independence and Pluralism for the programs of Radio France (the French national public radio.) In recent years, she has also collaborated with the Sciences Po Journalism School, in Paris, helping evaluate student application files. Labbe previously worked in New York as the host and producer of Good Code, a podcast on ethics in the digital world that she created in September 2018 with Cornell Tech’s Digital Life Initiative. Before that, she worked as a reporter for Reuters in Paris, where she covered politics, courts, and terrorism, as multimedia producer for The Economist in New York, and she freelanced for the French national public radio. In 2009, she won the Anna Lindh Journalist Award for a radio documentary broadcast on France Culture. Labbe received a dual masters degree from the Columbia University Graduate School of Journalism and the Sciences Po Graduate School of Journalism. She was the recipient of a Fulbright scholarship. Global Leader in Information Reliability Ratings Careers Press Privacy Policy Get NewsGuard Terms of Service Contact Cookie Notice Support About 25 W. 52nd Street, 15th Floor New York, NY 10019 Bluesky X Facebook LinkedIn © 2024 NewsGuard® Technologies, Inc. NewsGuard Technologies is solely responsible for the content."
