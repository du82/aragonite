full_description = "Giulia Pozzi Senior Analyst [email protected] Giulia Pozzi is a Senior Analyst at NewsGuard. Pozzi was born in Italy and earned a Master’s degree in Modern Philology at Università Cattolica in Milan. She also holds a Journalism degree from Fondazione Lelio Basso’s Journalism School in Rome. Pozzi worked as a politics and foreign affairs reporter at the Italian news website DiariodelWeb.it for four years and as a United Nations correspondent at the New York City-based online newspaper La Voce di New York for two years. She also contributed to L’Espresso, Sette, and Linkiesta.it. In 2021, she graduated from Columbia University Graduate School of Journalism, where she attended the mid-career Master of Arts program in Politics. Global Leader in Information Reliability Ratings Careers Press Privacy Policy Get NewsGuard Terms of Service Contact Cookie Notice Support About 25 W. 52nd Street, 15th Floor New York, NY 10019 Bluesky X Facebook LinkedIn © 2024 NewsGuard® Technologies, Inc. NewsGuard Technologies is solely responsible for the content."
