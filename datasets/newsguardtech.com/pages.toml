o date. We expect that it will prove essential in our research.” Brendan Nyhan James O. Freedman Presidential Professor, Department of Government, Dartmouth College White Paper Research Backing NewsGuard's Reliability Ratings This white paper summarizes research into misinformation's impact and potential solutions, illustrating how NewsGuard offers an effective approach backed by research. The paper also describes research projects that have been conducted using NewsGuard data. Read More Case Study Read about NewsGuard's data and the "Iffy" Quotient The University of Michigan’s School of Information Center for Social Media Responsibility created a metric called the “Iffy Quotient,” which uses NewsGuard data and measures the percentage of the most popular news URLs on Facebook and Twitter that are from “iffy” sites that frequently publish unreliable information. Read More Case Study Analyzing Content Recommendation Algorithms Researchers at Dartmouth, Indiana, and South Florida use NewsGuard’s Index to develop improved content recommendation algorithms. A project led by Brendan Nyhan from Dartmouth College, Giovanni Luca Ciampaglia from the University of South Florida, and Filippo Menczer and Alessandro Flammini from Indiana University used the Index to study how to improve the diversity of information circulating on social media. Read More Global Leader in Information Reliability Ratings Careers Press Privacy Policy Get NewsGuard Terms of Service Contact Cookie Notice Support About 25 W. 52nd Street, 15th Floor New York, NY 10019 Bluesky X Facebook LinkedIn © 2024 NewsGuard® Technologies, Inc. NewsGuard Technologies is solely responsible for the content.'''
