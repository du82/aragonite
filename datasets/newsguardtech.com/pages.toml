["https://www.newsguardtech.com/insights"]
title = "NewsGuard Insights - NewsGuard"
description = "Announcements, case studies, and more from the NewsGuard team."
full_description = "NewsGuard Insights Announcements, case studies, and more from the NewsGuard team. Data shows advertising on news brings major benefits to ad performance. So why don’t brands advertise on news? Read It Now Watch Out: AI “News” Sites Are on the Rise Safeguard yourself against misinformation by staying alert to the rise of AI-generated websites. Read It Now How Journalistic Red-Teaming Can Help AI Companies Fix Misinformation Blindspots Journalists should never act as enemies of truth — except when conducting misinformation red-team evaluations. Read It Now Five Considerations When Crafting Your Company’s Anti-Misinformation Strategy Misinformation is no longer just a reputational issue: It impacts corporate security, advertising, and employee safety, among other business areas. Read on to learn about how companies can develop cross-functional approaches to tackling misinformation. Read It Now Academic Researchers Make the Case that Search Engines Should Include Trust Indicators for News and Information. Here’s Why: A study using NewsGuard data found that using online search to evaluate the truthfulness of false news articles actually increases the probability of believing them. Read It Now Five Ways NewsGuard Has Made a Difference in Five Years Here’s how NewsGuard has contributed to the fight against misinformation over the last five years, through partnerships across advertising, AI, education, audience intelligence, and academic research. Read It Now How AI Companies Can Use NewsGuard Trust Data for Text, Image, Video and Audio Generators An overview of how AI companies use NewsGuard’s data to strengthen the safety and transparency of their user outputs, and why companies have chosen NewsGuard for their trust and safety tech stack. Read It Now Three Ways Brands Can Protect Themselves from Misinformation in an Election Year A summary of election-related insights recently shared by NewsGuard’s editorial team in briefings for journalists and the trust and safety industry, adapted for a brand audience. Read It Now NewsGuard in Italy: Our Progress and Partnerships NewsGuard’s award-winning Italian editorial coverage, reporting, partnerships, research, and media literacy efforts have had broad impact. Read It Now How the U.K. Government Used NewsGuard’s Pulsar Integration To Detect Misinformation Narratives The U.K. Government’s Department of Culture, Media and Sport (DCMS) analyzes public conversations to inform government policy and communications with the help of Pulsar and its NewsGuard integration. Read It Now Why the ‘Wisdom of the Crowd’ Can’t Make Generative AI Safe from Misinformation The crowd may be able to provide reliable feedback on AI-generated text output about how to scramble an egg—but not about whether Covid vaccines work or Nazis rule Ukraine. However, trained journalists applying transparent, accountable, and apolitical criteria can offer AI models trustworthy training data. Read It Now Four Months of NewsGuard in Australia/New Zealand: Our Progress and Partnerships So Far A summary of the highlights of our first few months in Australia and New Zealand. Read It Now It’s Time for a New Standard of Brand Safety Smart industries evolve to meet new challenges. It’s time for Brand Safety to meet this test, with new transparent and accountable tools. Read It Now Safeguarding Generative AI Models from Spreading Misinformation with Transparently Sourced Data The rapidly advancing capabilities of AI models require transparently sourced data inputs for fine-tuning models and providing guardrails during post-processing of outputs. NewsGuard for AI solves this misinformation problem, which has undermined trust in AI. Read It Now How brands can use NewsGuard to protect themselves from the onslaught of AI-produced misinformation websites AI-produced misinformation websites are now proliferating online. Here’s how advertisers and brands can keep themselves protected from harmful adjacencies using NewsGuard’s meticulous, transparent site credibility ratings. Read It Now How NewsGuard’s Misinformation Fingerprints Provide Early Warning Alerts for Emerging Online Threats NewsGuard’s constantly updated catalog of machine-readable false narratives helps teams in the AI, digital-platform, defense, and reputation-management sectors stay abreast of emerging falsehoods circulating online to track and mitigate the spread of misinformation. Read It Now Load More Global Leader in Information Reliability Ratings Careers Press Privacy Policy Get NewsGuard Terms of Service Contact Cookie Notice Support About 25 W. 52nd Street, 15th Floor New York, NY 10019 Bluesky X Facebook LinkedIn © 2024 NewsGuard® Technologies, Inc. NewsGuard Technologies is solely responsible for the content."
