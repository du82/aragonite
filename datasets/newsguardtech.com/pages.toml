["https://www.newsguardtech.com/fr/notice-concernant-les-cookies"]
title = "Notice concernant les cookies - NewsGuard"
description = "Dernière mise à jour : 17 Octobre 2019 Comme la plupart des entreprises, NewsGuard Technologies, Inc. (“NewsGuard”, “nous” ou “notre”) utilise des cookies ou des technologies similaires. Cette notice relative aux cookies vous informe sur notre utilisation des cookies et des technologies similaires sur notre extension de navigateur et notre site www.newsguardtech.com (qui constituent ensemble […]"
full_description = "Notice concernant les cookies Dernière mise à jour : 17 Octobre 2019 Comme la plupart des entreprises, NewsGuard Technologies, Inc. (“NewsGuard”, “nous” ou “notre”) utilise des cookies ou des technologies similaires. Cette notice relative aux cookies vous informe sur notre utilisation des cookies et des technologies similaires sur notre extension de navigateur et notre site www.newsguardtech.com (qui constituent ensemble nos “Services”). Pour plus d’informations concernant notre utilisation, conservation, partage et traitement des données personnelles que nous obtenons via, ou en relation avec l’utilisation de nos services, merci de consulter notre politique de confidentialité. Lorsque vous accédez à notre site pour la première fois depuis certaines juridictions, vous recevrez un message vous prévenant que des cookies et des technologies similaires sont utilisés. En cliquant “Accepter”, vous indiquez que vous comprenez et acceptez l’utilisation de ces technologies, telles que décrites dans cette notice relatives aux cookies. Vous n’avez pas à accepter les cookies et votre consentement peut être retiré à tout moment. (Voir “Comment contrôler les cookies” ci-dessous) Vous pouvez changer votre navigateur et vos paramètres de navigation pour refuser ou restreindre les cookies et vous pouvez les supprimeraprès leur installation sur votre appareilà tout moment. 1. Que sont les cookies ? Les cookies sont des fichiers contenant des chaînes de caractères que nous pouvons conserver sur votre ordinateur ou téléphone portable lorsque vous visitez nos services. Lorsque vous visitez nos services, les cookies nous permettent de reconnaître votre navigateur. Les cookies peuvent conserver vos préférences et d’autres informations mais ils ne peuvent pas lire d’informations sur votre disque dur ou accéder à des cookies créés par d’autres sites. Les cookies déposéspar le propriétaire d’un site (en l’occurence, NewsGuard) sont appelés “cookies internes”. Les cookies déposés par des groupes distincts du propriétaire d’un site (par exemple Google) sont appelés “cookies tiers”. Les cookies tiers permettent aux fonctionnalités proposées par des tiers d’être utilisés sur ou via les services (par exemple des analyses de données), 2. Les cookies que nous utilisons Les informations que nous collectons grâce aux cookies nous permettent d’analyser statistiquement l’utilisation de nos services et d’améliorer et personnaliser notre contenu et nos autres offres. Cependant, nous ne partageons les données collectées grâce aux cookies avec des tiers que sous forme agrégée, sans utiliser d’information qui vous identifie personnellement. Les spécificités des cookies internes et tiers déposés par nos services, et les objectifs qu’ils poursuivent sont décrits dans le tableau ci-dessous : Type de cookies Qui propose ces cookies Comment les refuser Cookies strictement nécessaires Ce sont des cookies qui sont nécessaires au fonctionnement de notre siteNewsGuard CookiePro Ces cookies sont absolument nécessaires à la distribution de nos services et ne peuvent donc pas être refusés. Ils peuvent toutefois être supprimés ou bloqués en utilisant vos paramètres de navigateurs. (voir Section 3, Comment contrôler vos cookies, ci-dessous.) Cookies de performance et de fonctionnalitésCes cookies sont utilisés pour vous reconnaître lorsque vous revenez sur notre site. Cela nous permet de personnaliser notre contenu pour vous et de nous souvenir de vos préférences (par exemple votre choix de langue ou de région), mais il ne sont pas essentiels au fonctionnement du site. NewsGuard Ces cookies peuvent être supprimés ou bloqués en utilisant vos paramètres de navigateurs (voir Section 3, Comment contrôler vos cookies, ci-dessous) Cookies analytiquesCes cookies collectent des informations sur la manière dont les utilisateurs accèdent aux services, et s’y déplacent. Ces cookies collectent également des données de géolocalisation (limité à la région depuis laquelle vous accédez à notre site ou utilisez notre extension de navigateur) et des informations sur l’ordinateur ou l’appareil mobile que vous utilisez pour vous connecter aux services, comme le type de navigateur, la langue, la version, la taille de l’écran, et d’autres informations transactionnelles. Nous utilisons ces informations sous forme agrégée pour nous aider à améliorer la manière dont nos services fonctionnent. Google Analytics Ces cookies peuvent être supprimés ou bloqués en utilisant vos paramètres de navigateurs (voir Section 3, Comment contrôler vos cookies, ci-dessous). Sinon, suivez le lien ci-dessous pour vous exclure :Google Analytics: https://tools.google.com/dlpage/gaoptout 3. Comment contrôler les cookies Site web Lorsque vous accédez pour la première fois au site depuis certaines juridictions, vous recevrez un message vous prévenant que des cookies et technologies similaires sont utilisés. Vous n’avez pas à accepter les cookies et votre consentement peut être retiré à tout moment. Vous pouvez le faire en cliquant sur le lien d’exclusion proposé dans le tableau ci-dessus ou en activant les paramètres de votre navigateur vous permettant de refuser tous ou certains cookies. Suivez les liens suivant pour des informations concernant les navigateurs les plus utilisés : Microsoft Internet Explorer :https://support.microsoft.com/en-gb/help/17442/windows-internet-explorer-delete-manage-cookies Google Chrome : https://support.google.com/chrome/answer/95647?co=GENIE.Platform%3DDesktop&hl=enMozilla Firefox : https://support.mozilla.org/en-US/kb/enable-and-disable-cookies-website-preferences Apple Safari : https://support.apple.com/guide/safari/manage-cookies-and-website-data-sfri11471/mac Parallèlement, vous pouvez faire connaître votre choix de gestion des cookies publicitaires à ces adresses : http://www.aboutads.info/choices/, http://www.networkadvertising.org/choices/; ou http://youronlinechoices.com/. Ces outils d’exclusion sont proposés par des acteurs tiers, et non par NewsGuard. NewsGuard ne contrôle pas et ne gère pas ces outils ni les choix proposés via ces outils par des publicitaires ou d’autres. Extension de navigateur Vous pouvez autoriser ou exclure notre utilisation de cookies analytiques à tout moment via les réglages de votre extension de navigateur. Les cookies ne seront pas déposés sur l’extension de navigateur tant que vous n’aurez pas donné votre consentement explicite à ce dépôt. 4. Changement de notre notice relative aux cookies Tout modification de notre notice relative aux cookies à l’avenir sera publiée sur cette page, et vous sera signalée par email quand nécessaire. Veuillez visiter cette page régulièrement pour vérifier d’éventuels changements ou mises à jour de notre notice relative aux cookies. 5. Nous contacter Si vous avez des questions ou des remarques sur notre notice relative aux cookies ou sur les pratiques de NewsGuard concernant les données, veuillez consulter notre politique de confidentialité ou nous contacter en utilisant les coordonnées ci-dessous : Adresse email: [email protected]Adresse postale: NewsGuard Technologies, Inc., 25 West 52nd Street, New York, NY 10019Numéro de téléphone: +1-740-480-1850 L'outil de confiance sur Internet À propos Presse Obtenir NewsGuard Réagir Support Politique de confidentialité Conditions d’utilisation Notice concernant les cookies 25 W. 52nd Street, 15th Floor New York, NY 10019 Bluesky X Facebook LinkedIn © 2024 NewsGuard® Technologies, Inc. NewsGuard Technologies is solely responsible for the content."
year_published = 2025
year_updated = 2021
