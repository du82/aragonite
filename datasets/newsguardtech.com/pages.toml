full_description = "Carter Stone VP of Responsible Advertising and Strategic Partnerships [email protected] Carter Stone leads NewsGuard’s strategic partnerships initiative, developing relationships with technology companies, enterprise brands, B2B information companies, and more. Before joining NewsGuard, Stone was a member of the founding team at Press+, a digital subscription platform for news publishers, where he served as Director of Sales and Strategy. After Press+ merged with Piano Media in 2015, Stone stayed on as Sr. Director of Sales and Strategy. He most recently worked as Director of Sales at Brickwork Software, a retail software company in NYC. Stone earned a bachelor’s degrees in Corporate Strategy and History from Vanderbilt University and a Masters in Business Administration from NYU Stern School of Business. Global Leader in Information Reliability Ratings Careers Press Privacy Policy Get NewsGuard Terms of Service Contact Cookie Notice Support About 25 W. 52nd Street, 15th Floor New York, NY 10019 Bluesky X Facebook LinkedIn © 2024 NewsGuard® Technologies, Inc. NewsGuard Technologies is solely responsible for the content."
