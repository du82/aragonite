full_description = "Andie Slomka Staff Analyst [email protected] Andie Slomka is a Staff Analyst for NewsGuard. Slomka is a graduate of Purdue University with bachelor’s degrees in Genetics and Political Science. She was a founding member and former chair of the Center for C-SPAN Scholarship & Engagement (CCSE) Student Community, a non-partisan, student-run organization that seeks to facilitate discussion between undergraduate students and experts in the political communication field. Slomka also interned with C-SPAN during the 2020 Iowa Caucuses and worked as a consultant on the C-SPAN History Project. Global Leader in Information Reliability Ratings Careers Press Privacy Policy Get NewsGuard Terms of Service Contact Cookie Notice Support About 25 W. 52nd Street, 15th Floor New York, NY 10019 Bluesky X Facebook LinkedIn © 2024 NewsGuard® Technologies, Inc. NewsGuard Technologies is solely responsible for the content."
