["https://www.newsguardtech.com/newsguard-faq"]
title = "NewsGuard FAQ - NewsGuard"
full_description = "NewsGuard FAQ Learn more about NewsGuard with answers to these Frequently Asked Questions Get NewsGuard Have questions about NewsGuard? We have answers. Browse through the list of Frequently Asked Questions below. Have a question we haven’t answered yet? Submit it here. About NewsGuard What is NewsGuard? NewsGuard is a tool that shows you trust scores and ratings for more than 35,000+ news sources as you browse the internet. It can be installed as a browser extension that works within your internet browser as you search for news and information online. NewsGuard scores and ratings are also available as an app on mobile devices, and are integrated directly into products such as Microsoft Edge. For marketers, NewsGuard offers NewsGuard for Advertising, a service to help advertisers identify credible news sources for their ad placements while avoiding sites that do not adhere to their standards. NewsGuard was created by a team of journalists who assess the credibility and transparency of news and information websites based on nine journalistic criteria, such as whether the site repeatedly publishes false content, whether it discloses who owns and finances it, and whether it corrects factual errors when they occur. Based on the nine basic, apolitical criteria, each site receives a trust score of 0-100 points which determines an overall rating ranging from “High Credibility” to “Proceed with Caution.” A detailed “Nutrition Label” explains who is behind the site, why it received its score and rating, and specific examples of any trust issues our team found. When you install the NewsGuard browser extension in your browser, NewsGuard will insert icons denoting each site’s trust score next to links on search engines like Google or Bing and on social media platforms like Facebook, Twitter and Reddit. If you hover your mouse over a NewsGuard icon, you’ll see a brief summary of NewsGuard’s review of the site. If you click “See the Full Nutrition Label,” you’ll be taken to a page with more detail explaining the score and rating. Who is behind NewsGuard? NewsGuard was launched by a team of experienced journalists, including the former publisher of The Wall Street Journal, the founder of the American Lawyer and CourtTV, and former top editors at Reuters, the Associated Press, and the Chicago Tribune. NewsGuard’s team includes a wide range of journalists and editors from diverse journalistic backgrounds in the countries in which we operate—currently, the U.S., U.K., Canada, Germany, France, Italy, Austria, Australia, and New Zealand. (NewsGuard has rated all the news and information websites that account for at least 95% of online engagement in each country.) Learn more about NewsGuard’s team. NewsGuard’s team believes in transparency and accountability, so in addition to our team, all of our investors are disclosed prominently on our website. How does NewsGuard determine which information sources are credible? The journalists at NewsGuard assess news and information sites based on nine journalistic criteria. The rating process is designed to ensure our nine basic, apolitical journalistic criteria are applied fairly and accurately to all sites, regardless of the site’s topic, tone, or political leaning if any. Steps include: A trained journalist assesses the contents of the site against nine journalistic criteria. Our analysts are trained journalists who conduct reporting to determine relevant details of the website’s ownership, financing, credibility, and transparency practices. The analyst drafts a written “Nutrition Label” for the site based on their reporting. Nutrition labels consist of a grid showing the site’s performance on each of the nine criteria and a written explanation of the content on the site, who’s behind it, and why it received its rating. We call the website for comment. If an analyst believes a site may fail one or more of the nine criteria, the analyst will contact the website to attempt to seek comment before publishing the rating. If a representative for the website provides a comment, that comment is included in the written assessment of the site to provide users with the website’s perspective. The rating is reviewed and fact-checked by experienced editors. Multiple senior editors review every Nutrition Label prior to publication to ensure that the rating is as fair and accurate as possible. The site receives a 0-100 trust score and reliability rating based on the nine journalistic criteria. The site’s score is determined solely based on the nine criteria. We update Nutrition Labels periodically. Our team periodically updates its rating of each site. If a site changes its practices, its performance on one or more of the nine criteria may change. Hundreds of websites have improved their transparency or credibility practices as a result of our rating process. We practice accountability and show our work. Each Nutrition Label contains the names of the writer and editors who worked on the rating. The backgrounds of the analysts and editors named, as well as those of the supervising editors, can be found by clicking on their names or going to the Our Team page of this website. If a website disagrees with our rating for its site, it can write a response or complaint using our contact page. Any such complaints will be published on our website here and linked from the site’s Nutrition Label. How does NewsGuard choose which websites to rate? NewsGuard rates the more than 35,000 news sources responsible for approximately 95% of all the news and information consumed and shared online in the U.S., U.K., Canada, Germany, France, Italy, Austria, Australia, and New Zealand. NewsGuard derives this list of sites from data services that track online activity. We also supplement this data in a number of ways: We apply editorial judgment to rate some sites that are well known and influential but that might not have that enough online engagement to be in the top 95%. Although we rate all sites in the top 95% even if they might not want to be rated, we also gladly respond to requests from smaller sites or newly launched sites that want to be rated. For sites that frequently change domains or launch new domains with the same content, we track when a new domain is launched and apply our rating to that new website, even when it is not yet in the top 95%. Our Rapid Response Team identifies suddenly trending news from websites that we have not yet rated because they have only suddenly published stories that have become popular. In many cases, these websites are created in order to publish misinformation or disinformation. How often does NewsGuard update its ratings and Nutrition Labels? As a matter of practice NewsGuard aims to review and refresh its ratings for all sites at least annually. However, more frequent updates will occur if circumstances warrant it—such as a change in ownership, a change in practices, or if the site wins an award or becomes embroiled in a controversy. How does NewsGuard handle new websites that start trending with false information—or existing websites that change domains? NewsGuard has a Rapid Response Team on call on a 24-hour basis. It receives alerts from a software system NewsGuard has created that informs the team about a news item from a site that seems about to trend online that NewsGuard has not yet reviewed (perhaps because it is a false news site that went up in Russia during the night). NewsGuard will review and assess that site within hours, so that it has a NewsGuard score, rating, and Nutrition Label before it goes viral. In this way, NewsGuard “prebunks” false stories from websites that regularly publish false content. How does NewsGuard avoid bias, such as favoring one political ideology or party? NewsGuard rates sites using a set of apolitical journalistic criteria and a transparent process, which is described in detail here. We use the same nine criteria for assessing all news websites. These basic, apolitical criteria are all established basic principles of reliable journalism, whether for news-based sites or for opinion-based sites. Detailed definitions of each criterion, including reasons why a site might pass or fail, are published publicly here. Our criteria are applied equally to all publishers regardless of political orientation, if any, and in the same way for an established newspaper or broadcaster as for a new digital website or popular blogger. Each rating we issue is reviewed by multiple layers of editors and fact-checkers to mitigate the bias of any individual involved in the rating and to ensure we are being as factual, fair, and consistent as possible. We publish a detailed report describing our rationale for our rating of each publisher, which we call a “Nutrition Label.” Each Nutrition Label provides evidence and analysis explaining our judgement of the site’s rating on each of the nine criteria. We make these Nutrition Labels available to the publishers being rated as well as to users of our browser extension and other products, so that anyone using NewsGuard can understand the reasoning behind our rating and make their own judgments about how much to trust each site. In addition, if our reporting determines that a site fails any one of the nine criteria, our analysts contact the site for comment. This gives the site a chance to remedy any issues we’ve raised, point us to information we’ve missed, or provide comments disagreeing with our assessment–which we include in our written report about the site’s rating so that each user can see the site’s point of view and decide for themselves. We hope all websites will earn “High Credibility” ratings and be generally reliable to consumers. Publishers across the political spectrum have worked to improve their NewsGuard scores through our rating process by better adhering to the journalistic standards we assess. Why should anyone trust NewsGuard? Because the leadership and staff of NewsGuard use basic, apolitical, criteria of journalistic practice for their assessments and because they are a group of trained journalists who have spent their careers dedicated to the profession. Steven Brill is one of America’s most respected magazine writers and non-fiction book authors. Gordon Crovitz was a highly regarded columnist for the Wall Street Journal editorial page—and The Wall Street Journal’s publisher. Our senior editorial advisors in each country have similar backgrounds, such as our UK senior editorial advisor who was a journalist at the BBC for 30 years, including as global news editor, and our Italian senior editorial advisor who spent 30 years at ANSA (the Italian version of the AP), including as editor in chief. They and the journalists they have recruited care deeply about reliable journalism’s pivotal role in democracy. These experienced journalists come from diverse backgrounds and have no political axes to grind. In fact, you can see the credentials and backgrounds of everyone responsible for every NewsGuard score, rating and Nutrition Label that you read. NewsGuard has an ethics and conflicts of interest policy that every analyst and editor has to agree to. Click to see the policy. NewsGuard is transparent about how all decisions are made. It discloses and explains in detail the nine criteria NewsGuard examines in order to rate each news site on its journalistic practices. The Nutrition Label write-ups explain what’s behind each decision. NewsGuard makes concerted attempts to get comment from every website’s editor or manager before NewsGuard writes anything negative about the site, and always include the comments in the Nutrition Labels (or make changes after weighing the comment and realizing NewsGuard’s initial conclusion was wrong). NewsGuard posts any complaints from website proprietors about anything that is written about them. And NewsGuard’s leaders answer them publicly – and when warranted will make corrections, publicly, after they consider the complaint. NewsGuard accepts no fees from the news websites it reviews. NewsGuard’s revenue comes from the fees that technology companies such as access providers, platforms and search engines pay for licensing NewsGuard trust scores and ratings. Many websites cite their NewsGuard score in their About sections and run advertising explaining their NewsGuard scores. Bringing more information to people about the news sources they encounter online is NewsGuard’s only business. The success of this venture depends entirely on being trustworthy and reliable. Does NewsGuard restrict or censor speech? No. NewsGuard offers platforms, search engines, internet users, and others an alternative to blocking or censoring content that may contain misinformation. To date, platforms and search engines have altered among three bad solutions to the online misinformation problem: either blocking untrustworthy content and accounts entirely, which leads to accusations of bias and favoritism; providing fact-checks next to false content, which only happens after the fact (and often after falsehoods have already spread widely); or allowing unreliable information to flourish. NewsGuard presents an alternative option: providing users with the context they need to assess different information sources for themselves and make their own judgments. By providing transparent, detailed warning labels that don’t block users from viewing content, NewsGuard avoids the problem of having a small number of huge technology companies become the arbiters of truth online. By rating at the source level, rather than fact-checking each new false claim that comes out, NewsGuard avoids the problem of fact-checker warning labels coming after a myth has spread–because any misinformation source that is rated by NewsGuard will already have a warning on it, “prebunking” the site’s next falsehood as it is published. And by providing users with detailed source credibility information, NewsGuard gives internet users the tools they need to understand how to find credible information and avoid misinformation. This approach is one reason why librarians partner with NewsGuard. Librarians have always fought for the right of people to have access to everything at the same time that they have rightly seen their role as giving their library patrons information about what’s on their shelves. How does NewsGuard make money? NewsGuard makes money by selling subscriptions to its browser extension and Reality Check newsletter, and by licensing access to its database of independent ratings to companies that want to provide their customers with reliable information from trustworthy sources. NewsGuard’s licensees include search engines and platforms, AI companies, advertising companies, educational organizations, cybersecurity companies, researchers and more. Note: NewsGuard’s browser extension is strictly for personal use or for use by NewsGuard’s news literacy partners. Any commercial use of NewsGuard without a commercial license is strictl"
