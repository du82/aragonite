full_description = "Gordon Crovitz Co-CEO and Co-Editor-In-Chief [email protected] Journalist and Executive – Former publisher, editorial board member and opinion columnist for The Wall Street Journal, board member of Business Insider, editor or contributor to books published by the American Enterprise Institute and Heritage Foundation, founder of Factiva and co-founder of Press+ Areas of particular expertise: Technology policy (wrote WSJ “Information Age” column, 2008-16); legal affairs (wrote WSJ “Rule of Law” column, 1986-1991); Asia (editor and publisher of the Far Eastern Economic Review, Hong Kong, 1991-1996); global economics, trade and defense (founding editorial page editor of WSJ Europe, Brussels, 1982-1984) Recent Co-Founder in 2018 of NewsGuard, Inc, which rates the reliability of news and information websites Interim CEO, Houghton Mifflin Harcourt, the largest K-12 education publisher in the U.S., 2016-17 Partner, NextNews Ventures Columnist, “Information Age” for The Wall Street Journal, 2008-2016 Member, Board of Directors of public companies: Houghton Mifflin Harcourt and Marin Software Member, Board of Directors of private companies: Business Insider, Blurb, and Spirited Media Member, Board of Directors of the American Association of Rhodes Scholars Member, Council on Foreign Relations Earlier Co-founder: Journalism Online, LLC, conceived in 2009 to create a new, viable business model for journalism to flourish online. More than 500 newspaper and magazines launched their paid content initiatives on Journalism Online’s Press+ platform. The company was sold to RR Donnelley in 2011 Member, Board of Directors of public companies: Dun & Bradstreet Member, Board of Directors of private companies: ProQuest, Minneapolis Star Tribune, and Factiva Publisher, The Wall Street Journal and Executive Vice President of Dow Jones and President, Consumer Media Group, 2006-2007 President, Dow Jones Electronic Publishing, 1998-2006 Founder and chairman, Factiva, 1999 Vice President for Strategic Planning & Development, Dow Jones, 1997-1998 Chairman, Dow Jones Asia; Managing Director, Asia of Telerate, Hong Kong, 1996-1997 Editor and Publisher, Far Eastern Economic Review, Hong Kong, 1992-1996 Assistant editor and editorial board member, The Wall Street Journal editorial page, 1981-1992 Founding editorial page editor of The Wall Street Journal Europe, 1982-1984 Columnist, “Rule of Law” for The Wall Street Journal, 1986-1991 Co-editor, The Fettered Presidency: Legal Constraints on the Executive Branch (American Enterprise Institute, 1989) Contributor, The Imperial Congress: Crisis in the Separation of Powers (Heritage Foundation, 1989) Wrote magazine articles for Commentary, National Review and Reason magazines Frequent speaker, Federalist Society, 1986-1991 Summer Associate, Davis Polk & Wardwell law firm, 1985 Co-founder, Chicago Journal newspaper, 1976-1980 Graduate of The University of Chicago with law degrees from Oxford University and Yale Law School Global Leader in Information Reliability Ratings Careers Press Privacy Policy Get NewsGuard Terms of Service Contact Cookie Notice Support About 25 W. 52nd Street, 15th Floor New York, NY 10019 Bluesky X Facebook LinkedIn © 2024 NewsGuard® Technologies, Inc. NewsGuard Technologies is solely responsible for the content."
