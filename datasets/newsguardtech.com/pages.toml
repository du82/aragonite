["https://www.newsguardtech.com/careers/staff-reporter-business-finance"]
title = "Staff Reporter, Business and Finance Misinformation - NewsGuard"
description = "Full Time – New York, NY Job Description NewsGuard is seeking an energetic and entrepreneurial journalist to help us expand our work reporting on misinformation related to finance and business.  NewsGuard journalists fight misinformation and disinformation, primarily by producing detailed ratings for news and information sites that assess each site’s trustworthiness based on nine apolitical, […]"
full_description = "Staff Reporter, Business and Finance Misinformation Full Time – New York, NY Job Description NewsGuard is seeking an energetic and entrepreneurial journalist to help us expand our work reporting on misinformation related to finance and business. NewsGuard journalists fight misinformation and disinformation, primarily by producing detailed ratings for news and information sites that assess each site’s trustworthiness based on nine apolitical, journalistic criteria. NewsGuard has published ratings that assess the credibility and transparency of more than 11,000 global news and information sources Journalists at NewsGuard use reporting skills to track down funding and ownership for anonymous websites that spread falsehoods, debunk inaccuracies, and preemptively warn users about dubious sources before they are widely shared. NewsGuard reporters also have the opportunity to write in-depth, high-profile reports about key trends and issues in online misinformation. NewsGuard’s reporting is regularly covered and cross-published in outlets such as The New York Times, The Guardian, The Wall Street Journal, Les Echos, Welt, La Repubblica, The Washington Post, Politico, Newsweek, and others. The Business, Finance, and Brand Misinformation reporter will help identify misinformation that affects global financial markets, major companies and brands, produce misinformation fingerprints that identify trending false narratives, and financial enterprise related to misinformation. Ideal candidates for this job will: Have two to five years of full-time experience in digital or broadcast journalism, including deep understanding of business and finance journalism, market coverage, and big brands. Have impeccable news judgment and excellent writing, reporting, and fact-checking skills with a strong eye for detail. Write simply and succinctly, avoiding jargon or flowery language. Have experience navigating social media platforms and apps for online disinformation. Excellent communication skills and the ability to collaborate with other team leaders and stakeholders in the U.S. and European markets. Consume and engage with news in various formats, ranging from podcasts and streaming services, to the digital versions of “legacy” news outlets. Be curious, thorough, and persistent, with the ability to ferret out information, such as a publication’s ownership or financial backing, through reporting and research. Approach the role in a determinedly apolitical, non-ideological manner. Be eager to work for a fast-paced, ambitious, journalism organization obsessed with quality and where the product and processes are continually evolving. Be eager to be mentored and have their careers advanced by some of the most accomplished journalists in the business. Be committed to NewsGuard’s mission and vision. NewsGuard is based in New York City. The ability to work from New York is preferred, but many of our analysts work around the world, and strong remote candidates will be considered. Salary US-based staff: $52,000 – $80,000 per year, depending on experience. Application Dates and Process Applications will be reviewed, and interviews held, on a rolling basis. NewsGuard will contact applicants for an initial interview, with the potential for follow up meeting(s) with senior staff. Candidates must complete the following tasks for consideration: Provide a current resume/CV with professional work experiences (cover letter optional, but encouraged). Provide three references. Submit the above items via NewsGuard’s application form. Be available for interview(s) with NewsGuard staff members and able to take a writing test. Global Leader in Information Reliability Ratings Careers Press Privacy Policy Get NewsGuard Terms of Service Contact Cookie Notice Support About 25 W. 52nd Street, 15th Floor New York, NY 10019 Bluesky X Facebook LinkedIn © 2024 NewsGuard® Technologies, Inc. NewsGuard Technologies is solely responsible for the content."
