ERMS AND CONDITIONS OF THESE TERMS OF SERVICE, OR ANY FUTURE CHANGES, ARE UNACCEPTABLE TO YOU, YOU MAY DISCONTINUE YOUR USE OF THE SERVICES. YOUR CONTINUED USE OF THE SERVICES NOW, OR FOLLOWING THE POSTING OF UPDATED TERMS OF SERVICE, WILL INDICATE ACCEPTANCE BY YOU OF SUCH TERMS OF SERVICE, CHANGES, OR MODIFICATIONS. 1.4 We may change, suspend or discontinue any aspect of the Services at any time, including the availability of any Services feature, database, or content. We may also impose limits on certain features and services or restrict your access to parts or all of the Services without notice or liability. 2. CONTENT ON THE SERVICES 2.1 The contents of the Services, including the Site, are intended for your personal, non-commercial use and are protected by copyright, and owned or controlled by NewsGuard or the party credited as the provider of the content. NewsGuard also owns copyright in the selection, coordination, compilation, and enhancement of such content (“Arrangement”). You shall abide by all additional copyright notices, information, or restrictions contained in any content accessed through the Service. 2.2 The Services and content are protected by copyrights, trademarks, trade secrets, database rights, and other intellectual or proprietary rights therein pursuant to U.S. and international laws. You may not modify, publish, transmit, participate in the transfer or sale of, reproduce, create new works from, distribute, perform, display, communicate to the public or in any way exploit, any of the content (or its arrangement) or the Services (including Software) in whole or in part. 3. PERSONAL SUBSCRIPTION SERVICES 3.1 We offer subscriptions to our browser extension and mobile apps. We will try to process your subscription promptly. By submitting your payment details, you are making an offer to us to buy a subscription and your offer will be accepted by us only once we have successfully verified your payment details. If we do not receive payment authori