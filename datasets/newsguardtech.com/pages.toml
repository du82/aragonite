title = "Careers at NewsGuard - NewsGuard"
full_description = "We're hiring! Help us build a team committed to accuracy and accountability in journalism. Available Roles: Director, Marketing: NewsGuard is looking for a marketing leader to build widespread awareness of our work combating misinformation and create demand for the solutions we offer to technology platforms, AI companies, the advertising industry, news aggregators, the defense industry and news consumers worldwide. Staff Reporter, Media and Misinformation: Join NewsGuard’s team as an analyst rating and reviewing news sources, and reporting on trends in digital news and online misinformation. Staff Reporter, Business and Finance Misinformation: Join NewsGuard’s team as an analyst rating and reviewing business and finance-related news sources, and reporting on trends in digital news and online misinformation. Contributing Analyst – UK: The UK Contributing Analyst will work with the NewsGuard UK team to review and rate news and information sites based in the UK. Editorial Intern, Summer 2025: Join NewsGuard's team as an intern to gain a wide range of reporting, research, and writing skills and help advance our mission of fighting online misinformation. Building Trust For All In order to restore trust and accountability in media, we need to build confidence in NewsGuard among news consumers from a wide range of backgrounds and perspectives. That’s why we’re committed to creating a team that is diverse and inclusive in every way possible. NewsGuard encourages members of traditionally underrepresented communities to apply, including women, people of color, veterans, LGBTQ+ people and people with disabilities. We are committed to building an inclusive news organization that represents the audiences and clients we serve. Our ideal candidate values accuracy, fairness, and journalistic rigor. We look for candidates who… Bring reporting experience. If you want to join the NewsGuard team, be ready to demonstrate that you have the skill and experience to interview sources, conduct research, find primary-source documents, communicate professionally, and avoid bias. Call for comment. NewsGuard’s rating process goes beyond just reading and researching sites online. Journalists at NewsGuard know how to be persistent and even dogged, calling sources for comment multiple times if needed. Strive for fairness. Rating and reviewing news and information sites means encountering a wide range of topics, worldviews and political perspectives. Candidates seeking to join NewsGuard’s team must be committed to treating every site fairly, basing its rating on NewsGuard’s nine journalistic criteria and rating system and nothing else. Leave politics at the door. At NewsGuard, we seek to keep politics out of the equation and assess each site based on its journalistic practices. This means avoiding both real and perceived bias and signing a strict ethics and conflict of interests policy. Adapt and learn. NewsGuard is a startup and a frontrunner in the creation of a new industry. NewsGuard team members should be adaptable, ready for change, and eager to contribute new ideas. Global Leader in Information Reliability Ratings Careers Press Privacy Policy Get NewsGuard Terms of Service Contact Cookie Notice Support About 25 W. 52nd Street, 15th Floor New York, NY 10019 Bluesky X Facebook LinkedIn © 2024 NewsGuard® Technologies, Inc. NewsGuard Technologies is solely responsible for the content."
