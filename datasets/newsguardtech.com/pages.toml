["https://www.newsguardtech.com/it/cookie-notice"]
title = "Cookie Notice - NewsGuard"
description = "Ultimo aggiornamento: 17 Ottobre, 2019 Come la maggior parte delle aziende, NewsGuard Technologies, Inc. (“NewsGuard”, “noi” o “nostro”) usa cookie e tecnologie simili. Questa Cookie Notice ti spiega in che modo usiamo i cookie e tecnologie simili sulla nostra estensione per browser e sul nostro sito www.newsguardtech.com (insieme, i nostri “Servizi”). Per ulteriori informazioni su […]"
full_description = "Cookie Notice Ultimo aggiornamento: 17 Ottobre, 2019 Come la maggior parte delle aziende, NewsGuard Technologies, Inc. (“NewsGuard”, “noi” o “nostro”) usa cookie e tecnologie simili. Questa Cookie Notice ti spiega in che modo usiamo i cookie e tecnologie simili sulla nostra estensione per browser e sul nostro sito www.newsguardtech.com (insieme, i nostri “Servizi”). Per ulteriori informazioni su come usiamo, conserviamo, divulghiamo e gestiamo le informazioni personali che otteniamo attraverso o insieme all’uso dei nostri Servizi leggete la nostra Privacy Policy. Quando accedi per la prima volta al nostro sito in alcuni paesi riceverai un messaggio per avvisarti che vengono usati cookie e tecnologie simili. Cliccando “accetta” consenti l’uso di queste tecnologie nel modo in cui viene descritto in questa Cookie Notice. Non sei obbligato ad accettare l’uso dei cookie e puoi ritirare il tuo consenso (vedi qui sotto “Come controllare i cookie”). Puoi cambiare le impostazioni del tuo browser o del tuo device in modo da rifiutare o restringere l’uso dei cookie. Puoi anche cancellarli in ogni momento. 1. Cosa sono i cookie? I cookie sono piccoli file che contengono una stringa di caratteri che possiamo inserire nel tuo computer o nel tuo dispositivo mobile quando visiti i nostri Servizi. Quando visiti i nostri Servizi i cookie ci permettono di riconoscere il tuo browser. I cookie possono salvare le tue preferenze e altre informazioni ma non possono leggere i dati del tuo disco fisso o i cookie creati da altri siti visitati. I cookie creati dal proprietario di un sito (in questo caso NewsGuard) sono chiamati “first party cookies”. I cookie creati da entità diverse dal proprietario di un sito (per esempio Google) sono chiamati “third party cookies”. I third party cookie danno la possibilità di attivare funzioni di terze parti sui nostri Servizi (per esempio analytics). 2. Quali cookie usiamo Le informazioni che raccogliamo attraverso i cookie ci permettono di analizzare statisticamente l’uso dei nostri Servizi, e migliorare e personalizzare i nostri contenuti e altre offerte. Tuttavia condividiamo con terze parti le informazioni che raccogliamo attraverso i cookie in modo aggregato senza l’uso di alcuna informazione che possa identificare i singoli utenti. I tipi specifici di “first party cookies” e “third party cookies” che vengono inseriti dai nostri Servizi, e gli obiettivi che hanno sono descritti nella tabella che segue: Tipo di cookie Da chi sono usati questi cookie Come rifiutarli Cookie strettamente necessariCi sono cookie che sono richiesti per le operazioni del nostro sito. NewsGuard CookiePro Questi cookie sono strettamente necessari per fornire i Servizi e non possono essere rifiutati. Possono essere cancellati o bloccati impostandolo nel tuo browser, tuttavia (confronta la Sezione 3, Come controllare i cookie, qui di seguito).Cookie delle performance e sulla funzionalitàQuesti sono usati per riconoscere quando torni al nostro sito web. Questo ci consente di personalizzare i nostri contenuti per te e ricordare le tue preferenze (ad esempio, la tua scelta della lingua o della regione), ma non sono essenziali per le performance del sito. NewsGuard Questi cookie possono essere eliminati o bloccati usando le impostazioni del browser (vedere la sezione 3, Come controllare i cookie, qui di seguito).Cookie analiticiCon questi cookie vengono raccolte informazioni su come gli utenti accedono e si muovono all’interno dei Servizi. Anche questi cookie raccolgono informazioni di geolocalizzazione (questo è limitato alla regione da cui accedi al nostro sito o usi la nostra estensione per browser) e informazioni sul computer, dispositivo mobile o altro dispositivo che usi per accedere ai Servizi, come il tipo di browser, la lingua e la versione, le dimensioni dello schermo e altre informazioni transazionali. Usiamo queste informazioni aggregate per migliorare i nostri Servizi. Google Analytics Questi cookie possono essere eliminati o bloccati usando le impostazioni del browser (vedere la sezione 3, Come controllare i cookie, qui di seguito). In alternativa, segui il link qui sotto per rinunciare: Google Analytics:https://tools.google.com/dlpage/gaoptout 3. Come controllare i cookie Sito Quando accedi per la prima volta al nostro sito da certi paesi ricevi un messaggio per avvisarti che vengono usati cookie e tecnologie simili. Non sei obbligato ad accettare i cookie e puoi ritirare il tuo consenso in ogni momento. Puoi farlo cliccando sulla clausola di recesso fornita nella tabella dei cookie o attivando sul tuo browser le impostazioni che ti permettono di rifiutare tutti o alcuni cookie. Segui i link di seguito per avere informazioni utili sui browser più diffusi: Microsoft Internet Explorer:https://support.microsoft.com/en-gb/help/17442/windows-internet-explorer-delete-manage-cookies Google Chrome:https://support.google.com/chrome/answer/95647?co=GENIE.Platform%3DDesktop&hl=enMozilla Firefox:https://support.mozilla.org/en-US/kb/enable-and-disable-cookies-website-preferences Apple Safari: https://support.apple.com/guide/safari/manage-cookies-and-website-data-sfri11471/mac Inoltre, puoi impostare la gestione dei cookie legati alle pubblicità visitando: http://www.aboutads.info/choices/, http://www.networkadvertising.org/choices/; o http://youronlinechoices.com/. Il servizio per ritirare il tuo consenso è fornito da terze parti, non da NewsGuard. NewsGuard non controlla o gestisce questi strumenti o le scelte che i servizi di pubblicità e altri forniscono attraverso questi servizi. Estensione per browser Puoi accettare o negare l’uso di cookie per l’analisi di dati attraverso le impostazioni del tuo browser in ogni momento. I cookie non saranno impiegati dalla estensione per browser se non verrà dato il consenso. 4. Cambiamenti a questa Cookie Notice Ogni cambiamento che faremo alla nostra Cookie Notice sarà pubblicato su questa pagina e, se necessario, notificato via mail. Controlla in modo frequente i nostri aggiornamenti o cambiamenti alla nostra Cookie Notice. 5. Contattaci Se hai domande o dubbi sulla nostra Cookie Notice o sulle pratiche di gestione dei dati da parte di NewsGuard, leggi la nostra Privacy Policy o contattaci in uno dei seguenti modi: ● Email: [email protected] ● Indirizzo postale: NewsGuard Technologies, Inc., 25 West 52nd Street, New York, NY 10019 ● Numero di telefono: +1-740-480-1850 Lo strumento sull’affidabilità di internet Chi siamo Media Scarica NewsGuard Invia un commento Assistenza Informativa sulla privacy Termini di Servizio Cookie Notice 25 W. 52nd Street, 15th Floor New York, NY 10019 Bluesky X Facebook LinkedIn © 2024 NewsGuard® Technologies, Inc. NewsGuard Technologies is solely responsible for the content."
