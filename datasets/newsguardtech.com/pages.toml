full_description = "Amy Westfeldt Managing Editor [email protected] Amy Westfeldt is Managing Editor of NewsGuard. She spent most of her career as an editor and reporter at The Associated Press. She worked most recently as a news manager at a global coordination hub called the Nerve Center, working closely with digital customers. Westfeldt produced the AP’s first fact checks of false claims in news stories shortly after the 2016 election, as part of an initiative with Facebook. She founded the “Not Real News” fixture — a weekly roundup of viral, untrue claims circulating online — and ran a Trending News Desk. Earlier in her career, she worked as an editor at the AP’s national and Top Stories desks and ran the AP’s New York City bureau. She covered post-September 11 issues as a reporter, including the rebuilding of the World Trade Center and illnesses and deaths associated with the cleanup of the site. Westfeldt has a bachelor’s degree in English from the University of Pennsylvania. Global Leader in Information Reliability Ratings Careers Press Privacy Policy Get NewsGuard Terms of Service Contact Cookie Notice Support About 25 W. 52nd Street, 15th Floor New York, NY 10019 Bluesky X Facebook LinkedIn © 2024 NewsGuard® Technologies, Inc. NewsGuard Technologies is solely responsible for the content."
