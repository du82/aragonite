["https://www.newsguardtech.com/de/datenschutzerklarung"]
title = "Datenschutzerklärung - NewsGuard"
description = "NewsGuard Technologies, Inc. (“NewsGuard,” “wir”, “uns” oder “unser”) legt großen Wert auf Ihre Privatsphäre und die Sicherheit Ihrer Daten. Im Rahmen unserer Unternehmenskultur der Transparenz wollen wir deutlich machen, wie und warum wir Informationen sammeln, verwenden und offenlegen. Diese Datenschutzerklärung erläutert unsere Vorgehensweisen in Verbindung mit Ihrem Zugriff auf unsere Webseite und auf alle anderen […]"
full_description = "Datenschutzerklärung NewsGuard Technologies, Inc. (“NewsGuard,” “wir”, “uns” oder “unser”) legt großen Wert auf Ihre Privatsphäre und die Sicherheit Ihrer Daten. Im Rahmen unserer Unternehmenskultur der Transparenz wollen wir deutlich machen, wie und warum wir Informationen sammeln, verwenden und offenlegen. Diese Datenschutzerklärung erläutert unsere Vorgehensweisen in Verbindung mit Ihrem Zugriff auf unsere Webseite und auf alle anderen Anwendungen, die uns gehören und von uns betrieben werden, einschließlich der Browser-Erweiterung NewsGuard. Zu Ihrer Bequemlichkeit und Auskunft enthalten einige unserer Produkte Verlinkungen zu anderen Webseiten. Wir sind weder für die Datenschutzpraktiken noch für den Inhalt dieser Webseiten verantwortlich. Allgemeines Für die Zwecke der Datenschutz-Grundverordnung 2016/679 (die “DSGVO”), ist NewsGuard Technologies, Inc. der “Datenverantwortliche” und somit zuständig für die europäischen personenbezogenen Daten, die über die Webseite www.newsguardtech.com (die “Webseite”) erfasst werden. Wenn Sie Fragen oder Beschwerden zu unserer Datenschutzerklärung haben, wenden Sie sich bitte über die folgenden Kontaktdaten an NewsGuard: Per E-Mail: [email protected] Per Post: NewsGuard Technologies, Inc.25 West 52nd StreetNew York, NY 10019Attn.: Privacy Counsel Per Telefon: +1-740-480-1850 EU-Vertreter VeraSafe wurde gemäß Artikel 27 des DSGVO zum Vertreter von NewsGuard in der Europäischen Union für Fragen des Datenschutzes ernannt. VeraSafe kann neben NewsGuard nur für Angelegenheiten im Zusammenhang mit der Verarbeitung Ihrer personenbezogenen Daten kontaktiert werden. Um eine solche Anfrage zu stellen, wenden Sie sich bitte an VeraSafe über die unten aufgeführten Angaben: Per E-Mail Formular: https://www.verasafe.com/privacy-services/contact-article-27-representative Per Post: VeraSafe Ireland Ltd.Unit 3D North Point HouseNorth Point Business ParkNew Mallow RoadCork T23AT2PIreland Per Telefon: +420 228 881 031 Personenbezogene Daten Der in dieser Datenschutzerklärung verwendete Begriff “personenbezogene Daten” bezeichnet alle Informationen, die es uns tatsächlich ermöglichen oder uns ermöglichen können, Sie direkt oder indirekt durch Bezugnahme auf einen Bezeichner wie Ihren Namen, Ihre Identifikationsnummer, Standortangaben, Online-Kennung oder einen oder mehrere für Sie spezifische Faktoren zu identifizieren. Kategorien von personenbezogenen Daten, die von NewsGuard erfasst werden KontoinformationenWenn Sie sich entscheiden, ein Konto zu erstellen, um unsere Browser-Erweiterung zu verwenden, werden Sie gebeten, uns einige spezifische Informationen mitzuteilen, darunter: Ihren Namen, Ihre E-Mail-Adresse, Anmeldedaten wie Benutzername und Passwort, das Land, in dem Sie wohnen, und Zahlungsdaten.Wir nutzen einen Drittanbieter für die Verarbeitung der an uns geleisteten Zahlungen. In Verbindung mit der Verarbeitung solcher Zahlungen speichern wir keine personenbezogenen Daten oder Finanzinformationen wie Kreditkartennummern. Vielmehr werden all diese Informationen direkt an unseren Drittverarbeiter Stripe weitergegeben, dessen Verwendung Ihrer persönlichen Daten durch deren Datenschutzerklärung geregelt ist, die unter https://stripe.com/us/privacy eingesehen werden kann.Für den Fall, dass Ihr Kauf über den App Store von Apple erfolgt, unterliegen Ihre persönlichen Daten den Datenschutzrichtlinien von Apple, die unter https://www.apple.com/legal/privacy/en-ww/ eingesehen werden können. Personenbezogene Daten, die Sie uns zur Verfügung stellenBesucher der Webseite und Benutzer unserer Browser-Erweiterung und mobilen Apps stellen uns personenbezogene Daten auf verschiedene Weisen zur Verfügung. Dies gilt beispielsweise für das Abonnieren unserer Browser-Erweiterung, unserer mobilen Apps oder unseres Newsletters, oder falls Sie uns Feedback schicken, oder einen grammatikalischen oder sachlichen Fehler in einem unserer Labels uns melden.Die personenbezogenen Daten, die Sie uns zur Verfügung stellen, können “Kontaktinformationen” wie Vorname, Nachname, E-Mail-Adresse, Telefonnummer und Postanschrift enthalten. Personenbezogene Daten, die wir erfassen.Wenn Sie unsere Webseite besuchen oder unsere Browser-Erweiterung oder mobilen Apps verwenden, erfassen wir möglicherweise “Daten zur elektronischen Identifizierung”, einschließlich: Internet-Protokoll (IP) Adresse; Informationen über den Computer, das mobile Gerät oder ein anderes Gerät, mit dem Sie auf die Webseite, die Browser-Erweiterung oder mobilen Apps zugreifen, wie z.B. den Typ des Webbrowsers, Sprache und Version, Bildschirmgröße und andere Übertragungsdaten; Geolokationsdaten (dies ist auf die Region beschränkt, von der aus Sie auf unsere Webseite, Browser-Erweiterung oder mobilen Apps zugreifen oder unsere Browser-Erweiterung verwenden); und Informationen über Ihren Zugriff, einschließlich der Seiten, die Sie angesehen oder gesucht haben, Seitengeschwindigkeit, Download-Fehler, Dauer der Zugriffe auf bestimmte Seiten, Informationen zur Seiteninteraktion (z.B. Scrollen, Klicken und Bewegen der Maus) und Methoden zum Durchsuchen der Seite, usw. Verwendung Ihrer personenbezogener Daten Wir werden Ihre personenbezogenen Daten für die folgenden Zwecke verwenden, die für die Ausführung eines Vertrages zwischen Ihnen und uns erforderlich sind (einschließlich unserer Nutzungsbedingungen) oder um Fragen zu beantworten oder auf Ihre Anfrage hin vor Abschluss eines Vertrages Maßnahmen zu ergreifen: Um unsere Dienstleistungen zu erbringen; Um Sie über Änderungen an unseren Diensten zu informieren; und Zur Beantwortung von Fragen und zur Bereitstellung technischer Unterstützung. Wir werden Ihre personenbezogenen Daten für die folgenden Zwecke verarbeiten, soweit dies für unsere legitimen Geschäftsinteressen angemessen und erforderlich ist, oder sofern Sie Ihre Einwilligung zur Verarbeitung in Kenntnis der Sachlage gegeben haben, wenn diese nach geltendem Recht erforderlich ist (diese Einwilligung kann jederzeit widerrufen werden): Um auf Feedback-Einsendungen zu antworten; Um auf Fehler in unseren Labels zu reagieren; Um Betrug, böswillige Aktivitäten oder Missbrauch unserer Webseite, Browser-Erweiterung und mobilen Apps zu verhindern oder aufzudecken, und unsere Webseite, Browser-Erweiterung und mobilen Apps zu schützen; Zur Verwaltung unserer Webseite, Browser-Erweiterung und mobilen Apps und zur Fehlerbehebung, Datenanalyse, Prüfung, Recherche und statistischen Analyse; Um Produkte und Dienstleistungen zu entwickeln, die Ihren Bedürfnissen entsprechen könnten; Um grundlegende Informationen über die Nutzung unserer Webseite, Browser-Erweiterung und mobilen Apps zu erhalten, wie z.B. auf welche Labels am meisten zugegriffen wird oder welche geografischen Gebiete die meisten Nutzer hervorbringen; Um unsere Dienste zu betreiben, zu verbessern und zu optimieren, z.B. durch Überprüfung der Zugriffe auf unsere Webseite und ihre verschiedenen Teilbereiche sowie die Nutzung unserer Browser-Erweiterung und mobilen Apps; Zum Schutz unserer gesetzlichen Rechte und unseres Eigentums im Zusammenhang mit unseren Dienstleistungen; Um Betrug oder potenziell illegale Aktivitäten zu untersuchen und zu verhindern und potenzielle Verletzungen unserer Allgemeinen Geschäftsbedingungen zu untersuchen und die Geschäftsbedingungen durchzusetzen; Um Sie auf dem Laufenden zu halten, indem wir Ihnen NewsGuard-Newsletter zusenden; und Um Ihnen persönliche Werbemitteilungen zukommen zu lassen, um Sie über unsere Produkte und Dienstleistungen zu informieren, die für Sie von Interesse sein könnten. Gibt NewsGuard Ihre personenbezogenen Daten weiter, wenn Sie unsere Webseite besuchen? Wir verkaufen keine Werbung jeglicher Art oder und ermöglichen keine Vermarktung durch Dritte. Daher werden wir Ihre personenbezogenen Daten nicht verkaufen, verleihen oder an Dritte weitergeben, außer in den in dieser Datenschutzerklärung vorgesehenen Situationen oder ohne Ihre vorherige Zustimmung. Wir können personenbezogene Daten auf folgende Weise weitergeben: Wir werden personenbezogene Daten weitergeben an unsere Dienstleister, die durch Gesetz und Vertrag verpflichtet sind, Ihre personenbezogenen Daten zu schützen und Ihre personenbezogenen Daten nur in Übereinstimmung mit unseren Anweisungen zu verwenden. Wenn Sie Seiten auf unserer Webseite besuchen, die sich auf die Produkte von NewsGuard für Unternehmen beziehen, können die durch Cookies und ähnliche Technologien erfassten Daten von unseren Datenpartnern oder Online-Verkäufern verwendet werden, um diese Aktivitäten mit anderen persönlichen Informationen, die sie oder andere über Sie haben, zu verknüpfen. Das schließt auch die Verknüpfung mit Ihrer E-Mail-Adresse oder Postanschrift ein. Dies ermöglicht es uns, Mitteilungen und Marketingmaterial an diese E-Mails und Postadressen zu senden. Sie können sich gegen den Erhalt dieser Werbung entscheiden, indem Sie auf https://app.retention.com/optout gehen. Bitte beachten Sie, dass wir diese Verwendung von Cookies und ähnlichen Technologien durch unsere Online-Datenpartner oder -Anbieter NICHT einsetzen, um Ihre Aktivitäten mit anderen persönlichen Informationen in Verbindung zu bringen, die sie oder andere über Sie auf Seiten haben, die mit der Browser-Erweiterung von NewsGuard verbunden sind. Dies gilt auch für “Mein Konto”-Seiten, Seiten mit Reliability Scores oder Seiten, die für die Browser-Erweiterung werben. Wir werden personenbezogene Daten weitergeben oo es erforderlich ist, um unsere Rechte durchzusetzen, unser Eigentum zu schützen oder die Rechte und die Sicherheit von NewsGuard und anderen zu schützen oder externe Auditierungs-, Konformitäts- und Verwaltungsfunktionen zu unterstützen. Wir können personenbezogene Daten an einen oder mehrere Dritte im Zusammenhang mit oder während der Verhandlung einer Fusion, Finanzierung, Übernahme oder Auflösung, eines Übergangs oder eines Verfahrens weitergeben, das den Verkauf, die Übertragung, die Veräußerung oder die Offenlegung des gesamten oder eines Teils unseres Unternehmens oder unserer Vermögenswerte betrifft. Wir werden personenbezogene Daten offenlegen, wenn dies gesetzlich vorgeschrieben ist und als Reaktion auf rechtmäßige Anfragen von Behörden, einschließlich der Erfüllung nationaler Sicherheits- oder Strafverfolgungsanforderungen, wie beispielsweise als Reaktion auf eine Vorladung oder eine andere Anfrage, einschließlich an Strafverfolgungsbehörden und Gerichte in den Vereinigten Staaten und anderen Ländern, in denen wir tätig sind. Um unseren Kunden Gebühren in Rechnung zu stellen: Unsere autorisierten Zahlungsabwickler verwenden Ihre personenbezogenen Daten, um Zahlungen entgegenzunehmen, Rückerstattungen zu leisten und um betrügerische Aktivitäten aufzudecken und zu verhindern. Sie können Ihre Abonnement- und Zahlungsinformationen verwalten, indem Sie den Kontobereich besuchen. Wir werden Ihre personenbezogenen Daten nur an vertrauenswürdige Dritte weitergeben, die ausreichende Garantien in Bezug auf die technischen und organisatorischen Sicherheitsmaßnahmen für die Verarbeitung bieten und die eine Verpflichtung zur Einhaltung dieser Maßnahmen nachweisen können. Wenn personenbezogene Daten von Personen mit Sitz im Europäischen Wirtschaftsraum (“EWR”) an Dritte mit Sitz in einem Nicht-EWR-Land weitergegeben werden, die keine Angemessenheitsentscheidung der Europäischen Kommission erhalten haben, stützen wir uns auf angemessene Garantien, wie die von der Europäischen Kommission genehmigten Standardvertragsklauseln und den EU-USA-Datenschutzrahmen, um die personenbezogenen Daten zu übertragen. Gibt NewsGuard Ihre personenbezogenen Daten weiter, wenn Sie Benachrichtigungen auf Ihren mobilen Apps erlauben? Wenn Sie Benachrichtigungen auf Ihrer mobilen App aktivieren, verwendet NewsGuard verschiedene Technologien wie z. B. ein lokales VPN-Profil, um die Domain-Namen der von Ihnen besuchten Webseiten zu erfassen. So kann NewsGuard Sie benachrichtigen, wenn Sie eine Webseite mit einer roten Bewertung aufrufen. NewsGuard verkauft, verwendet oder gibt Ihre Daten zu keinem Zweck an Dritte weiter. Die Daten, die NewsGuard über die von Ihnen besuchten Domains verwendet, um Ihnen Benachrichtigungen über Bewertungen zu senden, werden niemals von Ihrem Gerät gesendet, sie werden niemals für eine Datensammlung verwendet, und sie werden niemals in irgendeiner Weise an Dritte weitergegeben. Wie und für wie lange speichern wir Ihre personenbezogenen Daten? Wir speichern Ihre personenbezogenen Daten auf interne Datenbanken und nicht länger als für den Zweck, für den diese personenbezogenen Daten verarbeitet werden, in einer Datenbank. Personenbezogene Daten aus dem Kontaktformular werden sechs Monate nach Ihrer Einreichung gelöscht. Backups werden maximal sechs Monate lang aufbewahrt und danach sicher gelöscht. Sie können jederzeit beantragen, dass diese Daten gelöscht werden. Personenbezogene Daten für Abonnenten bestehen aus zwei Teilen: Informationen, die wir in unseren internen Datenbanken speichern, und Informationen, die in unserem Drittverarbeiter, Stripe, gespeichert sind. Wir bewahren die in unseren internen Datenbanken gespeicherten Daten für zwei Jahre nach Ihrem Kündigungsdatum auf, um gesetzliche, steuerliche und buchhalterische Verpflichtungen zu erfüllen. Wenn Sie NewsGuard noch nie abonniert haben, aber persönliche Daten im Rahmen der Registrierung für das Abonnement angegeben haben, können Sie die Löschung Ihrer Registrierung beantragen. Wenn Sie Ihr Abonnement direkt bei NewsGuard erworben haben, werden Ihre personenbezogenen Daten ebenfalls auf unbestimmte Zeit von Stripe gespeichert, um ihren jeweiligen rechtlichen, steuerlichen, buchhalterischen und finanziellen Verpflichtungen nachzukommen. Wenn Sie Ihr Abonnement im App Store von Apple erworben haben, unterliegen die Aufbewahrung und Sicherheit Ihrer personenbezogenen Daten ebenfalls der Datenschutzrichtlinie von Apple. Wir konzipieren unsere Datenerfassungs- und Speichersysteme mit dem Schwerpunkt auf Ihrer Sicherheit und Ihrem Datenschutz. Wir verwenden branchenübliche Verfahren zum Schutz Ihrer Einreichung, einschließlich Firewalls, SSL-Verschlüsselung und Co-Lokalisierung in rund um die Uhr gesicherten, kontrollierten Umgebungen. Wenn Sie ein Abonnement bei NewsGuard erworben haben, werden Ihre Finanzdaten zusätzlich von einem zertifizierten PCI Level 1 Service Provider gespeichert, der strengsten Zertifizierungsstufe, die in der Zahlungsbranche verfügbar ist. Ändern von personenbezogenen Daten Sie haben das Recht, innerhalb der letzten sechs Monate Kopien Ihrer persönlichen Beiträge durch das nutzergenerierte NewsGuard Feedback-Formular anzufordern. Sie haben das Recht, auf Ihre personenbezogenen Daten zuzugreifen, sie zu korrigieren und deren Entfernung zu verlangen, indem Sie uns eine E-Mail an folgende Adresse senden [email protected]. Europäische Datenschutzrechte Unter bestimmten Umständen haben Sie möglicherweise die folgenden Rechte in Bezug auf Ihre personenb"
