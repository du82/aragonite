description = "NewsGuard’s white paper, “Fighting Misinformation with Journalism, not Algorithms,” outlines independent research on the effect of using human-curated news reliability ratings to mitigate false news, some of which has been conducted by leading academic institutions and other top scholars using NewsGuard’s Reliability Ratings dataset."
full_description = '''Misinformation White Paper Independent Research Shows Human-Curated News Reliability Ratings Work to Mitigate False News NewsGuard’s white paper, “Fighting Misinformation with Journalism, not Algorithms,” outlines independent research on the effect of using human-curated news reliability ratings to mitigate false news, some of which has been conducted by leading academic institutions and other top scholars using NewsGuard’s Reliability Ratings dataset. As researchers, media experts, and policy analysts redouble their efforts to assess the impact of misinformation and test effective ways to counter the spread of misinformation online, NewsGuard’s human-powered ratings of all the news and information sources that account for 95% of engagement online has become an essential benchmark. Since NewsGuard’s founding in 2018, researchers at 25 academic, nonprofit, and corporate institutions have licensed NewsGuard’s data for their work. To read the results of their work and those of others, download the PDF below. Download the PDF To download NewsGuard's Misinformation Whitepaper, please fill out your details below to receive a copy of the Whitepaper. Name* First Last Email* Company*By submitting this form, you agree to receive email communications from NewsGuard.NameThis field is for validation purposes and should be left unchanged. Submit /* <![CDATA[ */ gform.initializeOnLoaded( function() {gformInitSpinner( 71, 'https://www.newsguardtech.com/wp-content/plugins/gravityforms/images/spinner.svg', true );jQuery('#gform_ajax_frame_71').on('load',function(){var contents = jQuery(this).contents().find('*').html();var is_postback = contents.indexOf('GF_AJAX_POSTBACK') >= 0;if(!is_postback){return;}var form_content = jQuery(this).contents().find('#gform_wrapper_71');var is_confirmation = jQuery(this).contents().find('#gform_confirmation_wrapper_71').length > 0;var is_redirect = contents.indexOf('gformRedirect(){') >= 0;var is_form = form_content.length > 0 &