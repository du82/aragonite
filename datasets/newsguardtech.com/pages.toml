full_description = '''A powerful media literacy tool for citizens, librarians, educators, and students NewsGuard provides communities with media literacy resources that help guide learners of all ages through the overwhelming landscape of online news and information. More than 800 public libraries globally offer NewsGuard’s browser extension to patrons, and educators worldwide consult NewsGuard’s extension and other educational resources to help students develop source evaluation skills. Get NewsGuard's browser extension SCHOOLS & UNIVERSITIES Click "Learn More" for information about our work with schools, and resources for students and educators. Learn More PUBLIC LIBRARIES Click "Learn More" for information about our work with libraries. Learn More OLDER POPULATIONS Click "Learn More" for information about our work with older populations in partnership with the U.K. government. Learn More Global Leader in Information Reliability Ratings Careers Press Privacy Policy Get NewsGuard Terms of Service Contact Cookie Notice Support About 25 W. 52nd Street, 15th Floor New York, NY 10019 Bluesky X Facebook LinkedIn © 2024 NewsGuard® Technologies, Inc. NewsGuard Technologies is solely responsible for the content.'''
