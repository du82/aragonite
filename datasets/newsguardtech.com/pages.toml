["https://www.newsguardtech.com/ratings/rating-process-criteria"]
title = "Website Rating Process and Criteria - NewsGuard"
full_description = "Website Rating Process and Criteria NewsGuard employs a team of journalists and experienced editors to produce reliability ratings and scores for news and information websites based on nine journalistic criteria. The criteria assess basic practices of credibility and transparency. Based on our analysts’ judgment of a site’s performance on these nine apolitical criteria, which are each weighted differently with the points for all adding up to 100, each site is assigned a 0-100 score, also expressed as 0% to 100%, and a rating level indicating the degree to which, in NewsGuard’s judgment, it adheres to the weighted criteria. The accompanying Nutrition Label, accessible by clicking through from the listed score, then explains how NewsGuard arrived at its assessment. Score and Rating Levels For NewsGuard’s browser extension users, each site’s score is displayed next to links on search engines and social media platforms in the form of an icon. For example: The language that introduces and summarizes each website’s score varies, depending on the score, as follows: 100 (or 100%) High Credibility: This website adheres to all nine standards of credibility and transparency. 75-99 (or 75%-99%) Generally Credible: This website mostly adheres to basic standards of credibility and transparency. 60-74 (or 60%-74%) Credible with Exceptions: This website generally maintains basic standards of credibility and transparency—with significant exceptions. 40-59 (or 40%-59%) Proceed with Caution: This website is unreliable because it fails to adhere to several basic journalistic standards. 0-39 (or 0% to 39%) Proceed with Maximum Caution: This website is unreliable because it severely violates basic journalistic standards. In addition, some websites by their nature do not receive a score based on their adherence to the nine criteria because the criteria are not directly relevant to them. However, they do receive a Nutrition Label that describes the website more generally. There are two such categories of websites: Satire: A humor or satire site receives a satire rating, indicating that while it may use news as a basis for satire, it is not a traditional news website. We do not rate these sites according to the nine journalistic criteria, but we do provide a description of each site including, if possible, who is behind it. Platform: A site receives a platform rating if it primarily hosts content directly published by users with limited vetting, if that content is presented in such a way that a typical reader would understand that it is not vetted, and if the site does not publish a significant amount of original content. Information from platform sites may or may not be reliable. We do not rate these sites according to the nine journalistic criteria, but we do provide a description of each site and its practices. Rating Criteria NewsGuard‘s scores and ratings for news and information sites are based on nine apolitical criteria that assess the website’s credibility and transparency. As noted, each criterion is worth a certain number of points out of 100, weighted based on importance, as indicated below. All criteria are pass-fail, meaning that a site either receives all of the points associated with the criterion or receives no points for that criterion. In some instances, this may make the scores less precise, but the alternative of giving sites some but not all of the relevant points is not feasible for a process that involves human beings rating thousands of news sites. In some specific cases described below, a site can receive an “N/A” for a criterion that NewsGuard determines does not apply to the website, in which case the publisher receives the points associated with that criterion. Again, satire sites and platforms are given separate designations and are not scored using the nine criteria. Each score is described in detail in the Nutrition Label, which explains why NewsGuard made its determination on each of the criteria, provides evidence and examples to back up NewsGuard’s judgments, includes any relevant comments from the publisher, and indicates the history of the sites’ ratings. We always seek feedback from publishers that appear to fail any of our criteria before we publish a rating or an updated rating, ensuring a publisher has the ability to reply. The criteria below are listed in order of their importance in determining a site’s 0-100 score. Last updated February 3, 2023 Credibility Does not repeatedly publish false or egregiously misleading content: The site does not repeatedly and currently produce content that has been found to be clearly and significantly false or egregiously misleading, and which has not been quickly and prominently corrected. There is a “high bar” for failing this criterion. In practice, it means that on any given day the website is likely to display significantly false or egregiously misleading content. (22 Points.) See Details Here are some reasons that a site might pass this criterion: The site has not been found currently and repeatedly to publish clearly and significantly false or egregiously misleading information, even if it may have published such content in the past or even recently, whereupon it is likely to fail the criteria for not gathering and presenting news responsibly. Factual errors or misstatements on the site are generally minor. Major mistakes are generally quickly and transparently corrected or retracted. If the website repeatedly published significantly false or egregiously misleading content in the past, it has not regularly published such content in recent months. If the website repeatedly and accurately quotes other publications or sources making significantly false or egregiously misleading claims, it generally does not present those false claims as fact. However, doing so, especially without questioning the quoted false claim or presenting an alternative view, might mean that it will fail the criterion for gathering and presenting news responsibly. If the website sometimes publishes significant false or egregiously misleading claims, those claims represent a small proportion of its overall content, which otherwise generally adheres to journalistic standards. Here are some reasons that a site might fail this criterion: The site has displayed a pattern of publishing clearly and significantly false or egregiously misleading claims on a regular and ongoing basis—meaning that a user is likely to encounter such a false or misleading claim on any given visit to the site. Clearly and significantly false means that there is clear, credible evidence contradicting the claim such that a reasonable person taking care to get the facts right would be unlikely to make the false claim. Egregiously misleading means that facts are presented in a way that would cause an average reader to receive a clearly and significantly distorted view of the facts at hand—for example, failure to include any of the extensive countervailing information that overwhelmingly contradicts or undermines a claim being made. The site has published significantly false or egregiously misleading content in the past that is still featured on the site in a manner in which current users are likely to encounter it—for example, on a dedicated section linked from the homepage or on a topic page aggregating the site’s coverage of a topic currently of interest. The site repeatedly states as fact claims that are contradicted by an abundance of scientific evidence. The site repeatedly promotes conspiracy theories that cannot be disproven but have no basis in fact and are contradicted by an abundance of credible evidence. The site repeatedly and accurately quotes other publications or sources making significantly false or egregiously misleading claims and presents those false claims as fact. In some cases, a government-owned outlet that repeatedly and accurately, but uncritically, quotes the false or egregiously misleading claims of its government owner will fail this criterion. This is especially likely to be the case where the news outlet does not have an effective charter enabling it to publish independently of the views of the government. Note: In assessing this criterion, NewsGuard reviews both claims made in news articles and factual statements made in opinion pieces, even if those pieces are clearly labeled as opinion. Gathers and presents information responsibly: Content providers are generally fair and accurate in reporting and presenting information. They reference multiple sources, preferably those that present direct, firsthand information on a subject or event or from credible secondhand news sources, and they do not egregiously distort or misrepresent information to make an argument or report on a subject. (18 Points) See Details Here are some reasons that a site might pass this criterion: The site generally reports on events factually and presents information in context. The site generally attributes information to credible sources and credits content that it republishes to the original source. The site generally publishes claims that can be verified, either by attributing information to reliable sources or providing evidence or firsthand reporting. When articles quote someone making a clearly false claim, the site typically notes the falsehood to readers. When articles quote someone making an unsubstantiated claim for which there is significant countervailing evidence, the site typically includes countervailing evidence or notes that the claim is unsubstantiated. If the site has made some false or unsubstantiated claims, it has not repeatedly done so. If the site publishes content generated by artificial intelligence, there is adequate oversight of that content to prevent egregious errors. Here are some reasons that a site might fail this criterion: The site egregiously distorts or misrepresents facts—for example, taking quotes out of context or citing a scientific study to make a false point not supported by the research. The site fails NewsGuard’s criterion for not repeatedly publishing false content. The site regularly quotes sources or other publications making clearly false claims without noting that those claims are false. The site regularly quotes sources or other publications making unsubstantiated claims about which there is credible countervailing evidence without noting that the information is unsubstantiated or providing some countervailing evidence. The site has published numerous older, clearly false claims on significant topics that remain online uncorrected, even if it has not published such claims recently. The site publishes one-sided coverage of issues, such as politics, without clearly disclosing that it is owned or financed by a government or organization that supports the site’s views—for example, a website owned by a political campaign that publishes negative stories about other candidates without disclosing that conflict of interest. The website publishes poorly sourced information that is difficult to verify and omits context such as times, places, and names. The site routinely republishes content from other publishers without attribution or credit to the original source. The website predominantly cites anonymous sources whose connection to the information is not clearly described. The site publishes content generated by artificial intelligence without disclosure to readers and without adequate oversight of that content, resulting in egregious errors. Has effective practices for correcting errors: The site regularly identifies errors and publishes clarifications and corrections, transparently acknowledges errors, and does not regularly leave significant false content uncorrected. (12.5 Points) See Details Here are some reasons that a site might pass this criterion: There is evidence that the site has a regular practice of correcting errors in its stories, publishing at least one correction a year and publishing previous corrections in past years. Corrections are visible and the error being corrected generally is clearly described to the reader. The site has not yet been publishing content for a full year and, while it has not published corrections, NewsGuard’s review did not find clearly false claims that would require a correction—making it too early for NewsGuard to find a failure on this criterion. Note: A Nutrition Label may note that a site has published a corrections policy, but the existence of such a policy is not necessary to pass this criterion. Here are some reasons that a site may fail this criterion: The site does not regularly correct errors, meaning NewsGuard could not find evidence of at least one correction issued per year in recent years. The site repeatedly deletes or edits inaccurate content to remove errors instead of transparently issuing corrections. The site previously published transparent corrections but has not done so in the last 12 months. The site only corrects errors as a result of NewsGuard’s review process. Even if the site regularly issues corrections for minor errors, it repeatedly leaves significantly false claims uncorrected. Handles the difference between news and opinion responsibly: Content providers who convey the impression that they report news or a mix of news and opinion distinguish opinion from news reporting, and when reporting news, do not egregiously cherry pick facts or stories to advance opinions. Content providers who advance a particular point of view disclose that point of view. (12.5 Points) See Details Here are some reasons that a site might pass this criterion: The site publishes opinion content in a designated section clearly labeled as opinion using terminology that would be understood by the average reader, such as “opinion,” “editorial,” “commentary,” “analysis” or another label that an average reader would understand. The content signals that it is the opinion of the author by providing the author’s name with a colon in the headline. If the site has an overall agenda or point of view in its news coverage that it advances by its choice of the stories it covers or the views that the stories advance, it clearly discloses and describes its perspective to readers somewhere prominent on the site—such as on an about page or the site’s homepage. Content presented as news generally does not contain opinionated language. The site clearly describes itself as an opinion site, does not purport to publish straightforward news content, and does not present any of its content as news. Here are some of the reasons that a site might fail this criterion: Content presented as news frequently contains opinionated language. The site advances a particular point of view through clearly one-sided story selection that advances that point of view without disclosing that perspective to readers. The site mixes news stories and opinion stories throughout the site without clearly distinguishing between the two types of stories. The site inaccurately label"
