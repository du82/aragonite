["https://www.newsguardtech.com/fr/a-propos/pourquoi-nous-faire-confiance"]
title = "Pourquoi nous faire confiance ? - NewsGuard"
description = "Nous sommes des journalistes professionnels, qui ont dédié leur carrière à leur profession. Nous attachons une grande importance au rôle central du journalisme de qualité dans la démocratie. (Au cas où vous vous poseriez la question, nos journalistes expérimentés proviennent d’horizons divers et n’ont aucun intérêt politique à défendre.) Vous pouvez voir les qualifications et […]"
full_description = "Pourquoi nous faire confiance ? Nous sommes des journalistes professionnels, qui ont dédié leur carrière à leur profession. Nous attachons une grande importance au rôle central du journalisme de qualité dans la démocratie. (Au cas où vous vous poseriez la question, nos journalistes expérimentés proviennent d’horizons divers et n’ont aucun intérêt politique à défendre.) Vous pouvez voir les qualifications et le parcours de chaque personne responsable des notations de fiabilité et des Etiquettes Nutritionnelles de NewsGuard que vous lisez. Cliquez ici pour accéder aux noms et aux biographies de nos employés et contributeurs. Nous avons une politique sur l’éthique et les conflits d’intérêts que nos analystes et nos rédacteurs se sont engagés à respecter. Vous pouvez lire cette politique ici. Nous prenons nos décisions de façon entièrement transparente. Les articles accompagnant nos Etiquettes Nutritionnelles expliquent ce qui sous-tend nos décisions. Nous révélons et expliquons en détail les neuf critères sur lesquels nous nous basons pour évaluer les pratiques journalistiques de chaque site d’information. Nous ne sommes pas la boîte noire d’un algorithme. Nous faisons de véritables tentatives pour recueillir des réactions de chaque rédacteur en chef ou responsable d’un site avant d’écrire quoi que ce soit de négatif à son sujet. Nous incluons toujours ces réactions à nos Etiquettes Nutritionnelles (ou apportons des changements après avoir évalué le commentaire et réalisé que notre conclusion première était erronée, le cas échéant). Les algorithmes, eux, n’appellent pas pour demander un commentaire. Nous publions toute plainte provenant du propriétaire d’un site au sujet de ce que nous avons écrit le concernant. Nous y répondons publiquement, et, le cas échéant, nous apportons des corrections publiquement à notre analyse après avoir examiné la plainte. Vous pouvez lire notre politique sur la correction des erreurs ou des fautes ici. Nous n’acceptons aucune rémunération des sites internet que nous évaluons. (Nos revenus proviennent des plateformes et des moteurs de recherche qui souscrivent à nos évaluations afin de les inclure à leurs flux et résultats de recherche, et de l’achat de licences par d’autres entreprises ou chercheurs). Nous évaluons tous les sites d’information et d’actualité (plus de 7.500 sites) dont les contenus représentent 95% de l’engagement avec l’actualité en ligne aux États-Unis, au Royaume-Uni, en Canada, en France, en Allemagne et en Italie. Fournir plus d’informations aux personnes sur les sources des informations qu’elles lisent en ligne est notre seule activité. Notre réussite dépend entièrement de notre crédibilité et de notre fiabilité. L'outil de confiance sur Internet À propos Presse Obtenir NewsGuard Réagir Support Politique de confidentialité Conditions d’utilisation Notice concernant les cookies 25 W. 52nd Street, 15th Floor New York, NY 10019 Bluesky X Facebook LinkedIn © 2024 NewsGuard® Technologies, Inc. NewsGuard Technologies is solely responsible for the content."
