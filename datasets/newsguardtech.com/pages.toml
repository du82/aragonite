title = "Cookie-Erklärung - NewsGuard"
description = "Zuletzt aktualisiert: 17 Oktober 2019 Wie die meisten Unternehmen verwendet auch NewsGuard Technologies, Inc. (“NewsGuard”, “wir”, “uns” oder “unser”) Cookies und ähnliche Technologien. Diese Cookie-Erklärung informiert Sie über den Einsatz von Cookies und ähnlichen Technologien in unserer Browser-Erweiterung und auf der Webseite www.newsguardtech.com (beide zusammen bilden unsere “Dienste”).  Weitere Informationen darüber, wie wir personenbezogene Daten, […]"
full_description = "Cookie-Erklärung Zuletzt aktualisiert: 17 Oktober 2019 Wie die meisten Unternehmen verwendet auch NewsGuard Technologies, Inc. (“NewsGuard”, “wir”, “uns” oder “unser”) Cookies und ähnliche Technologien. Diese Cookie-Erklärung informiert Sie über den Einsatz von Cookies und ähnlichen Technologien in unserer Browser-Erweiterung und auf der Webseite www.newsguardtech.com (beide zusammen bilden unsere “Dienste”). Weitere Informationen darüber, wie wir personenbezogene Daten, die wir durch oder im Zusammenhang mit der Nutzung unserer Dienste erhalten, verwenden, speichern, offenlegen und verarbeiten, finden Sie in unserer Datenschutzerklärung. Wenn Sie aus bestimmten Ländern zum ersten Mal auf unsere Webseite zugreifen, erhalten Sie eine Nachricht, die Sie darauf hinweist, dass Cookies und ähnliche Technologien verwendet werden. Indem Sie auf “Akzeptieren” klicken, erklären Sie, dass Sie die Verwendung dieser Technologien, wie in dieser Cookie-Erklärung beschrieben, verstehen und akzeptieren. Sie müssen Cookies nicht akzeptieren und die Einwilligung kann jederzeit widerrufen werden (siehe “Wie man Cookies kontrolliert“, unten). Sie können Ihre Browser- oder Geräteeinstellungen ändern, um Cookies abzulehnen oder einzuschränken, und Sie können sie jederzeit löschen, nachdem sie auf Ihrem Gerät abgelegt wurden. 1. Was sind Cookies? Cookies sind kompakte Dateien mit einer Reihe von Zeichen, die wir auf Ihrem Computer oder mobilen Gerät speichern können, wenn Sie unsere Dienste nutzen. Wenn Sie unsere Dienste aufrufen, ermöglichen uns die Cookies, Ihren Browser zu erkennen. Cookies können Ihre Präferenzen und andere Informationen speichern, aber keine Daten von Ihrer Festplatte lesen oder Cookie-Dateien lesen, die von anderen Webseiten erstellt wurden. Cookies, die von einem Webseiteninhaber (in diesem Fall NewsGuard) eingesetzt werden, werden als “Erstanbieter-Cookies” bezeichnet. Cookies, die von anderen Personen als dem Webseiteninhaber (z.B. Google) eingesetzt werden, werden als “Cookies von Dritten” bezeichnet. Cookies von Drittanbietern ermöglichen es, Funktionen von Drittanbietern auf oder über die Dienste bereitzustellen (z.B. Analysen). 2. Die von uns verwendeten Cookies Die Informationen, die wir mit Hilfe von Cookies sammeln, ermöglichen es uns, die Nutzung unserer Dienste statistisch zu analysieren und unsere Inhalte und andere Angebote zu verbessern und anzupassen. Wir geben jedoch nur Daten, die mit Hilfe von Cookies gesammelt wurden, in zusammengefasster Form an Dritte weiter, ohne die Verwendung von Daten, die Sie persönlich identifizieren. Die jeweiligen Arten von Erst- und Drittanbieter-Cookies, die von unseren Diensten eingesetzt werden, und die Zwecke, die sie erfüllen, sind in der folgenden Tabelle beschrieben: Type of Cookies Wer diese Cookies einsetzt Wie man sie ablehnt Streng notwendige CookiesDies sind Cookies, die für den Betrieb unserer Webseite erforderlich sind. NewsGuard CookiePro Diese Cookies sind für die Bereitstellung der Dienste unbedingt erforderlich und können daher nicht abgelehnt werden. Sie können jedoch über Ihre Browsereinstellungen gelöscht oder blockiert werden (siehe Abschnitt 3, Wie man Cookies kontrolliert). Leistungs- und Funktions-CookiesDiese werden verwendet, um Sie zu erkennen, wenn Sie auf unsere Webseite zurückkehren. Dies ermöglicht uns, unsere Inhalte für Sie zu personalisieren und Ihre Präferenzen (z.B. die Wahl der Sprache oder der Region) zu speichern, ist aber für die Leistung der Webseite nicht von Bedeutung. NewsGuard Diese Cookies können über Ihre Browsereinstellungen gelöscht oder blockiert werden (siehe Abschnitt 3, Wie man Cookies kontrolliert). Analytische CookiesDiese Cookies sammeln Informationen darüber, wie Benutzer auf die Dienste zugreifen und sich durch sie bewegen. Diese Cookies erfassen auch Geolokalisierungsdaten (dies ist auf die Region beschränkt, von der aus Sie auf unsere Webseite zugreifen oder unsere Browser-Erweiterung verwenden) und Informationen über den Computer, das mobile Gerät oder ein anderes Gerät, mit dem Sie auf die Dienste zugreifen, wie z.B. den Typ des Webbrowsers, Sprache und Version, Bildschirmgröße und andere Übertragungsdaten. Wir verwenden diese Informationen in zusammengefasster Form, um die Funktionsweise unserer Dienste zu verbessern. Google Analytics Diese Cookies können über Ihre Browsereinstellungen gelöscht oder blockiert werden (siehe Abschnitt 3, Wie man Cookies kontrolliert). Alternativ können Sie auch dem untenstehenden Link folgen, um sich abzumelden:Google Analytics: https://tools.google.com/dlpage/gaoptout?hl=de 3. Wie man Cookies kontrolliert Webseite Wenn Sie aus bestimmten Ländern zum ersten Mal auf unsere Webseite zugreifen, erhalten Sie eine Nachricht, die Sie darauf hinweist, dass Cookies und ähnliche Technologien verwendet werden. Sie müssen Cookies nicht akzeptieren und die Einwilligung kann jederzeit widerrufen werden. Sie können dies tun, indem Sie auf die entsprechende Abmeldung in der obigen Cookie-Tabelle klicken oder die Einstellungen in Ihrem Browser aktivieren, mit denen Sie alle oder bestimmte Cookies ablehnen können. Bitte folgen Sie den untenstehenden Links zu hilfreichen Informationen für die gängigsten Browser: Microsoft Internet Explorer:https://support.microsoft.com/de-de/help/17442/windows-internet-explorer-delete-manage-cookiesGoogle Chrome: https://support.google.com/chrome/answer/95647?co=GENIE.Platform%3DDesktop&hl=deMozilla Firefox: https://support.mozilla.org/de/kb/cookies-erlauben-und-ablehnenApple Safari: https://support.apple.com/guide/safari/manage-cookies-and-website-data-sfri11471/mac Darüber hinaus können Sie eine Auswahl an Werbe-Cookies hier treffen: http://www.aboutads.info/choices/, http://www.networkadvertising.org/choices/; or http://youronlinechoices.com/. Diese Abmelde-Tools werden von Dritten und nicht von NewsGuard bereitgestellt. NewsGuard kontrolliert oder betreibt diese Tools oder die Wahlmöglichkeiten, die Werbetreibende und andere durch diese Tools bieten, nicht. Browser-Extension Sie können die Verwendung von Analytischen Cookies über die Einstellungen der Browser-Erweiterung jederzeit an- und abmelden. Über die Browser-Erweiterung werden keine Cookies eingesetzt, es sei denn, Sie haben zuvor Ihre gültige Zustimmung zur Platzierung erteilt. 4. Änderungen dieser Cookie-Erklärung Alle Änderungen, die wir in Zukunft an unserer Cookie-Erklärung vornehmen, werden auf dieser Seite veröffentlicht und Ihnen gegebenenfalls per E-Mail mitgeteilt. Bitte schauen Sie regelmäßig vorbei, um Aktualisierungen oder Änderungen dieser Cookie-Erklärung zu sehen. 5. Kontaktaufnahme mit uns Wenn Sie Fragen oder Bedenken zu dieser Cookie-Erklärung oder den Datenschutzpraktiken von NewsGuard haben, lesen Sie bitte unsere Datenschutzerklärung oder kontaktieren Sie uns über die unten aufgeführten Details: E-Mail Adresse: [email protected]Postanschrift: NewsGuard Technologies, Inc., 25 West 52nd Street, New York, NY 10019Telefonnummer: +1-740-480-1850 Das Vertrauens-Tool fürs Netz Bewertungen Über Uns Presse NewsGuard herunterladen Kontakt Impressum Kunden-Support Datenschutzerklärung Nutzungsbedingungen Cookie-Erklärung 25 W. 52nd Street, 15th Floor New York, NY 10019 Bluesky X Facebook LinkedIn © 2024 NewsGuard® Technologies, Inc. NewsGuard Technologies is solely responsible for the content."
