["https://www.newsguardtech.com/careers/contributing-analyst-uk"]
title = "Contributing Analyst - UK - NewsGuard"
description = "Freelance – Europe & Remote Job Description NewsGuard’s Contributing Analysts fight misinformation and disinformation, primarily by producing detailed ratings for news and information sites that assess each site’s trustworthiness based on nine apolitical, journalistic criteria. The UK Contributing Analyst will work with the NewsGuard UK team to review and rate news and information sites based […]"
full_description = "Contributing Analyst – UK Freelance – Europe & Remote Job Description NewsGuard’s Contributing Analysts fight misinformation and disinformation, primarily by producing detailed ratings for news and information sites that assess each site’s trustworthiness based on nine apolitical, journalistic criteria. The UK Contributing Analyst will work with the NewsGuard UK team to review and rate news and information sites based in the UK. Journalists at NewsGuard use reporting skills to track down funding and ownership for anonymous websites that spread falsehoods, debunk inaccuracies, and preemptively warn users about dubious sources before they are widely shared. Ideal candidate qualifications Our ideal candidate values accuracy, fairness, and journalistic rigor. We look for candidates (journalists, journalism students, researchers with knowledge of the media industry) who… Have college journalism experience or one to two years of industry or other relevant professional experience. Have excellent writing, reporting, and fact-checking skills with a strong eye for detail. Write simply and succinctly, avoiding jargon or flowery language. Have experience navigating social media platforms and apps for online disinformation. Consume and engage with news in various formats, ranging from podcasts and streaming services, to the digital versions of “legacy” news outlets. Be curious, thorough, and persistent, with the ability to ferret out information, such as a publication’s ownership or financial backing, through reporting and research. Approach the role in a determinedly apolitical, non-ideological manner. Be available to work at least 15 hours per month. Demonstrate knowledge of the UK media landscape, political and cultural issues. Candidates must complete the following tasks for consideration: Provide a current resume/CV with professional work experiences (cover letter optional, but encouraged). Provide three references. Submit the above items via NewsGuard’s application form. Be available for interview(s) with NewsGuard staff members and able to take a writing test. About NewsGuard NewsGuard uses journalism to fight false news, propaganda, and misinformation. Our analysts, who are trained journalists, rate and review online news sources based on nine basic, apolitical journalistic criteria to help readers and viewers know which ones follow basic standards of credibility and transparency–and which do not. NewsGuard was founded by Steven Brill (award-winning journalist and co-founder of The American Lawyer, CourtTV, and other companies) and Gordon Crovitz (former publisher of the Wall Street Journal). NewsGuard’s data is used by a wide range of companies and institutions to combat misinformation, including the World Health Organization, the U.S. State Department and U.S. Cyber Command, the U.K. government, technology companies such as Microsoft and BT, and a wide range of research and academic partners. Building Trust For All In order to restore trust and accountability in media, we need to build trust in NewsGuard among news consumers from a wide range of backgrounds and perspectives. That’s why we’re committed to creating a team that is diverse and inclusive in every way possible—one that brings a breadth of different experiences, beliefs and perspectives to the table. We aim to hire journalists from a range of racial and ethnic backgrounds, political perspectives, geographical origins, gender identities, and more. NewsGuard is an equal opportunity employer. Global Leader in Information Reliability Ratings Careers Press Privacy Policy Get NewsGuard Terms of Service Contact Cookie Notice Support About 25 W. 52nd Street, 15th Floor New York, NY 10019 Bluesky X Facebook LinkedIn © 2024 NewsGuard® Technologies, Inc. NewsGuard Technologies is solely responsible for the content."
