title = "Bewertungsprozess und Kriterien - NewsGuard"
full_description = "Bewertungsprozess und Kriterien NewsGuard verfügt über ein Team von ausgebildeten Journalist:innen und erfahrenen Redakteur:innen, die anhand von neun journalistischen Kriterien Bewertungen und Mediensteckbriefe für Nachrichten- und Informationsseiten erstellen. Die Kriterien spiegeln grundlegende Anforderungen an Glaubwürdigkeit und Transparenz wider. Abhängig davon, inwieweit sie diese neun unpolitischen Kriterien erfüllen, die jeweils unterschiedlich gewichtet werden, erhalten die Webseiten einen Score von 0 bis 100. Dieser wird auch als Prozentzahl dargestellt, sowie mit einer Rating-Einordnung versehen, die verdeutlicht, wie viele der gewichteten Kriterien erfüllt werden. Der Mediensteckbrief für jede Webseite (auf den man per Klick auf die Bewertung gelangt), erläutert zudem im Detail, wie das Team von NewsGuard zu seiner Bewertung kam. Score und Rating-Level Für Nutzer:innen der Browser-Erweiterung wird die Bewertung jeder Webseite in Form eines Symbols neben den Links in Suchmaschinen und auf Social Media-Plattformen angezeigt. Zum Beispiel so: Die kurze, zusammenfassende Beschreibung zur jeweiligen Bewertung der Webseite variiert je nach Score: 100 (oder 100%) Sehr glaubwürdig: Diese Webseite erfüllt alle neun Standards für Glaubwürdigkeit und Transparenz. 75-99 (oder 75%-99%) Größtenteils glaubwürdig: Diese Webseite entspricht weitgehend den grundlegenden Standards der Glaubwürdigkeit und Transparenz. 60-74 (oder 60%-74%) Glaubwürdig mit Ausnahmen: Diese Webseite hält im Allgemeinen grundlegende Standards der Glaubwürdigkeit und Transparenz ein – jedoch mit erheblichen Einschränkungen. 40-59 (oder 40%-59%) Mit Vorsicht fortfahren: Diese Webseite ist unzuverlässig, da sie einige grundlegende journalistische Standards nicht einhält. 0-39 (oder 0% to 39%) Höchste Vorsicht ist geboten: Diese Webseite ist unzuverlässig, da sie in hohem Maße gegen grundlegende journalistische Standards verstößt. Darüber hinaus erhalten einige Webseiten keinen Score anhand der neun Kriterien, da diese nicht für sie relevant sind. Sie erhalten jedoch einen Mediensteckbrief, der die Webseite im Allgemeinen beschreibt. Es gibt zwei solcher Kategorien von Webseiten: Satire: Eine Humor- oder Satire-Webseite erhält die Bewertung „Satire“, was darauf hinweist, dass es sich nicht um eine echte Nachrichten-Webseite handelt. Wir bewerten diese Seiten nicht nach den neun journalistischen Kriterien, verfassen jedoch eine Beschreibung der jeweiligen Webseite. Sofern möglich, geben wir auch die dahinter stehenden Verantwortlichen an. Plattform: Eine Webseite wird als Plattform eingestuft, wenn sie in erster Linie Inhalte enthält, die von Nutzern direkt veröffentlicht und nur in begrenztem Umfang überprüft wurden, wenn diese Inhalte so präsentiert werden, dass ein Durchschnittsleser versteht, dass sie nicht überprüft wurden, und wenn die Webseite keine nennenswerte Menge an Originalinhalten veröffentlicht. Informationen von Plattformseiten können verlässlich sein, müssen es aber nicht. Wir bewerten diese Webseiten nicht nach den neun journalistischen Kriterien, sondern beschreiben die einzelnen Seiten und ihre Praktiken. Bewertungskriterien NewsGuards Bewertungen und Mediensteckbriefe für Nachrichten- und Informationsseiten basieren auf neun unpolitischen Kriterien der Glaubwürdigkeit und Transparenz. Diese sind nach Relevanz gewichtet (siehe unten). Alle Kriterien werden mit “erfüllt” oder “nicht erfüllt” bewertet, d. h. eine Webseite erhält entweder alle mit dem Kriterium verbundenen Punkte oder keine der Punkte. In einigen Fällen kann dies dazu führen, dass die Bewertungen weniger präzise ausfallen. Die Alternative, einigen Webseiten teilweise Punkte zu geben, ist jedoch bei dem aufwändigen Prozess der Bewertung tausender Nachrichtenseiten nicht umsetzbar. In einigen speziellen Fällen, die weiter unten beschrieben werden, kann eine Webseite ein “N/A” für ein Kriterium erhalten. Dort kam NewsGuard zu dem Ergebnis, dass das Kriterium nicht auf die Webseite zutrifft. In diesen Fällen erhält die Webseite die mit dem Kriterium verbundenen Punkte. Satire-Seiten und Plattformen werden gesondert gekennzeichnet und nicht anhand der neun Kriterien bewertet. Jede Bewertung wird detailliert im Mediensteckbrief beschrieben. Dieser erklärt, warum NewsGuard das jeweilige Kriterium als erfüllt oder nicht erfüllt gewertet hat. Er führt außerdem alle Belege und Beispiele zur Untermauerung der Bewertungen an sowie alle relevanten Kommentare der Eigentümer:innen der Webseite. Bevor NewsGuard eine Bewertung oder ein Update der Bewertung veröffentlicht, kontaktiert das Journalist:innen-Team immer die Webseitenanbieter:innen, bei denen Punkte abgezogen werden, um Möglichkeit zur Stellungnahme zu geben. Die folgenden Kriterien sind in der Reihenfolge ihrer Gewichtung für die Bewertung einer Webseite von 0-100 aufgeführt. Zuletzt aktualisiert am 17. Februar 2023 Glaubwürdigkeit Es werden nicht wiederholt falsche oder grob irreführende Inhalte veröffentlicht: Die Webseite veröffentlicht nicht wiederholt und aktuell Inhalte, die sich als signifikant falsch oder grob irreführend erwiesen haben und die nicht rasch und sichtbar richtig gestellt wurden. Die Schwelle bei diesem Kriterium liegt hoch. In der Praxis bedeutet dies, dass die Webseite an einem beliebigen Tag mit hoher Wahrscheinlichkeit signifikant falsche oder grob irreführende Informationen anzeigt. (22 Punkte) Siehe Einzelheiten Hier sind einige Gründe, warum eine Webseite dieses Kriterium erfüllen könnte: Die Webseite veröffentlicht weder aktuell noch wiederholt signifikant falsche oder grob irreführende Informationen. (Dies wird unabhängig davon betrachtet, ob eine Webseite in der Vergangenheit solche Inhalte veröffentlicht hat. In diesem Fall erfüllt sie möglicherweise das zweite Kriterium, die verantwortungsbewusste Recherche und Aufbereitung von Informationen, nicht.) In der Regel findet man auf der Webseite keine oder nur vereinzelt sachliche Fehler oder Falschmeldungen. Inhaltliche Fehler werden in der Regel schnell und transparent korrigiert. Obwohl eine Webseite in der Vergangenheit wiederholt signifikant falsche oder grob irreführende Informationen veröffentlicht hat, war das in den letzten Monaten nicht mehr der Fall. Wenn die Webseite andere Publikationen oder Quellen zitiert, die Falschbehauptungen aufstellen, werden diese Behauptungen nicht als Tatsachen dargestellt und entsprechend eingeordnet. (Stellt eine Webseite die zitierten falschen Behauptungen nicht in den richtigen Kontext oder präsentiert nur eine bestimmte Sichtweise ohne Einbezug der Fakten, kann es bedeuten, dass die Webseite das Kriterium “verantwortungsbewusste Recherche und Aufbereitung von Informationen” nicht erfüllt.) Wenn die Webseite gelegentlich signifikant falsche oder grob irreführende Behauptungen veröffentlicht, machen diese nur einen kleinen Teil des Gesamtinhalts aus, der ansonsten journalistischen Standards entspricht. Hier sind einige Gründe, warum eine Webseite dieses Kriterium nicht erfüllen könnte: Die Webseite zeigt ein Muster, in dem sie regelmäßig und kontinuierlich signifikant falsche oder grob irreführende Behauptungen veröffentlicht. Das heißt, dass Nutzer:innen bei einem beliebigen Besuch der Webseite wahrscheinlich auf eine solche falsche oder irreführende Behauptung stoßen würden. Signifikant falsch bedeutet, dass es eindeutige, glaubwürdige Beweise gibt, die der Behauptung widersprechen. In einem solchen Fall, würde eine vernünftige Person, die darauf achtet, die Fakten richtig einzuordnen, die falsche Behauptung wahrscheinlich nicht aufstellen. Grob irreführend bedeutet, dass die Fakten so dargestellt werden, dass ein durchschnittlicher Leser ein deutlich und erheblich verzerrtes Bild der vorliegenden Fakten erhält – beispielsweise durch das Fehlen umfangreicher gegenteiliger Informationen, die die Behauptungen in hohem Maße widerlegen oder sie entkräften. Die Webseite hat in der Vergangenheit signifikant falsche oder grob irreführende Informationen veröffentlicht, die immer noch auf der Webseite zu finden sind, und zwar in einer Art und Weise, in der Nutzer:innen wahrscheinlich auf sie stoßen werden, z. B. in einem gesonderten Bereich, der von der Startseite aus verlinkt ist, oder auf einer Themenseite, die die Berichterstattung der Webseite zu einem aktuellen Thema zusammenfasst. Auf der Webseite werden wiederholt Behauptungen aufgestellt, die durch eine Fülle wissenschaftlicher und anderer glaubwürdiger Beweise widerlegt werden. Auf der Webseite werden regelmäßig Quellen oder andere Veröffentlichungen zitiert, in denen Informationen veröffentlicht werden, die signifikant falsch oder grob irreführend sind, ohne dass darauf hingewiesen wird, dass diese Informationen falsch sind. Auf der Webseite werden wiederholt Verschwörungserzählungen verbreitet, die nicht widerlegt werden können, aber keine Faktengrundlage haben und gegen die eine Fülle von glaubwürdigen Beweisen spricht. Unter Umständen erfüllt auch ein staatliches Medium, das die falschen Behauptungen seines staatlichen Eigentümers wiedergibt oder ohne Einordnung zitiert, dieses Kriterium nicht. Dies ist vor allem dann der Fall, wenn die Nachrichtenorganisation nicht über eine wirksame Satzung verfügt oder mit der rechtlichen Unabhängigkeit ausgestattet ist, Nachrichten unabhängig von den Ansichten der Regierung zu publizieren. Hinweis: Bei der Bewertung dieses Kriteriums prüft NewsGuard sowohl Behauptungen in Nachrichtenartikeln als auch Tatsachenbehauptungen in Meinungsartikeln, selbst wenn diese eindeutig als Meinung gekennzeichnet sind. Verantwortungsbewusste Recherche und Aufbereitung von Informationen: Journalist:innen bemühen sich um akkurate, unabhängige und ausgewogene Recherchen, die auf einer Vielzahl von Quellen beruhen, bevorzugt auf Original- oder auf glaubwürdigen Sekundärquellen. Die Berichterstattung verzerrt Informationen nicht oder stellt diese falsch dar, um den eigenen Standpunkt zu unterstützen. Siehe Einzelheiten Hier sind einige Gründe, warum eine Webseite dieses Kriterium erfüllen könnte: Die Webseite berichtet in der Regel sachlich über Ereignisse und stellt Informationen im Kontext dar. Die Webseite verweist in der Regel auf glaubwürdige Quellen und nennt bei der Wiederveröffentlichung von Inhalten die Originalquelle. Die Webseite veröffentlicht in der Regel Behauptungen, die überprüft werden können, entweder durch die Angabe zuverlässiger Quellen oder durch die Bereitstellung von Belegen oder Berichten aus erster Hand. Wenn Artikel Personen zitieren, die eindeutig falsche Behauptungen aufstellen, weist die Webseite die Leser in der Regel auf die unzutreffenden Angaben hin. Wenn Artikel Personen zitieren, die eine unbelegte Behauptung aufstellen, für die es erhebliche Belege gibt, die dagegen sprechen, gibt die Webseite in der Regel auch diese an. Oder sie weist darauf hin, dass die Behauptung unbelegt ist. Die Webseite hat zwar vereinzelte falsche oder unbelegte Behauptungen aufgestellt, hat dies jedoch nicht wiederholt getan. Wenn die Webseite durch künstliche Intelligenz generierte Inhalte veröffentlicht, gibt es eine angemessene Überprüfung dieser Inhalte, um grobe Fehler zu vermeiden. Hier sind einige Gründe, warum eine Webseite dieses Kriterium nicht erfüllen könnte: Die Webseite verzerrt oder stellt Tatsachen falsch dar, indem sie z.B. Zitate aus dem Zusammenhang reißt oder eine wissenschaftliche Studie zitiert, um eine falsche Behauptung aufzustellen, die durch die Forschung nicht gestützt wird. Die Webseite erfüllt nicht das erste Kriterium von NewsGuard und veröffentlicht wiederholt falsche Inhalte. Die Webseite zitiert regelmäßig Quellen oder andere Medien, die eindeutig falsche Behauptungen aufstellen, ohne darauf hinzuweisen, dass diese Behauptungen falsch sind. Die Webseite zitiert regelmäßig Quellen oder andere Publikationen, die unbegründete Behauptungen aufstellen, für die es glaubwürdige Gegenbeweise gibt, ohne darauf hinzuweisen, dass die Informationen unbegründet sind oder Gegenbeweise existieren. Die Webseite hat zahlreiche ältere, eindeutig falsche Behauptungen zu wichtigen Themen veröffentlicht, die unkorrigiert online bleiben. (Dieser Punkt ist relevant, selbst wenn die Webseite solche Behauptungen in letzter Zeit nicht mehr veröffentlicht hat.) Die Website berichtet einseitig über Themen, wie z.B. Politik, ohne eindeutig offenzulegen, dass sie einer Regierung oder Organisation angehört oder von ihr finanziert wird, die die Ansichten der Website unterstützt ⁠— z.B. eine Website, die einer politischen Kampagne angehört und negative Berichte über andere Kandidaten veröffentlicht, ohne diesen Interessenkonflikt offenzulegen. Die Webseite veröffentlicht schlecht recherchierte Informationen, die schwer zu überprüfen sind, indem sie etwa den Kontext wie Zeiten, Orte und Namen weglässt. Die Webseite veröffentlicht regelmäßig Inhalte von anderen Herausgebern ohne Nennung der ursprünglichen Quelle. Die Webseite zitiert überwiegend anonyme Quellen, deren Verbindung zu den Informationen nicht klar beschrieben ist. Die Webseite veröffentlicht von künstlicher Intelligenz generierte Inhalte, ohne die Leser darüber zu informieren und ohne eine angemessene Überprüfung dieser Inhalte, was zu groben Fehlern führt. Die Webseite verfolgt wirkungsvolle Standards zur Korrektur von Fehlern: Die Webseite identifiziert regelmäßig Fehler und veröffentlicht Klarstellungen und Korrekturen. Sie korrigiert Fehler transparent und lässt eindeutig falsche Inhalte nicht unkorrigiert stehen. (12.5 Punkte) Siehe Einzelheiten Hier sind einige Gründe, warum eine Webseite dieses Kriterium erfüllen könnte: Die Webseite korrigiert regelmäßig Fehler in ihren Beiträgen. Es wurde mindestens eine Korrektur pro Jahr veröffentlicht und auch in den vergangenen Jahren wurden Korrekturen veröffentlicht. Die Korrekturen sind erkennbar, und der korrigierte Fehler wird Leser:innen klar beschrieben. Die Webseite veröffentlicht noch kein ganzes Jahr lang Inhalte, und obwohl sie noch keine Korrekturen veröffentlicht hat, wurden bei der Überprüfung durch NewsGuard keine eindeutig falschen Behauptungen gefunden, die eine Korrektur erfordern würden. Es ist also noch zu früh für NewsGuard, ein Versäumnis bei diesem Kriterium festzustellen. Hinweis: Ein Mediensteckbrief kann darauf hinweisen, dass eine Webseite Korrekturrichtlinien veröffentlicht, aber eine solche Richtlinie ist nicht notwendig, um dieses Kriterium zu erfüllen. Hier sind einige Gründe, warum eine Webseite dieses Kriterium nicht erfüllen könnte: Die Webseite korrigiert nicht regelmäßig Fehler, d.h. NewsGuard konnte in den letzten Jahren nicht nachweisen, dass mindestens eine Korrektur pro Jahr vorgenommen wurde. Die Webseite löscht oder korrigiert wiederholt Inhalte, um Fehler zu beseitigen, ohne dabei Korrekturen transparent zu veröffentlichen. Die Webseite hat früher transparente Korrekturen veröffentlicht, aber nicht in den letzten zwölf Monaten. Die Webseite korrigiert Fehler nur"
