["https://www.newsguardtech.com/how-it-works"]
title = "Get NewsGuard for your browser - NewsGuard"
description = "NewsGuard’s browser extension displays NewsGuard trust score icons next to links on search engines, social media feeds, and other platforms, for more than 35,000+ news sources that account for 95% of engagement with news in the U.S., U.K., Canada, France, Germany, Austria, Italy, Australia, and New Zealand."
full_description = "Get NewsGuard for your browser Trust your news at a glance. Our global team of journalists has rated the reliability of more than 35,000 news sources based on nonpartisan criteria. Install NewsGuard to see ratings as you browse news on social platforms, search engines, or websites. Get NewsGuard Insight with a hover, depth with a click. Icons next to links show each site’s score at a glance. Hover your mouse over the icon for a quick summary or click to view a detailed review and “Nutrition Label” explaining the site’s ownership, content, and reliability. Context on news around the globe. NewsGuard’s ratings cover news outlets accounting for 95% of online engagement in the U.S., U.K., Canada, Australia, New Zealand, France, Germany, Austria, and Italy—with ratings of selected outlets in other markets. Try it free with no obligation. Experience NewsGuard free with a two-week trial. If you love it, sign up for a monthly subscription for $4.95/month for continued access. Microsoft Edge browser users receive free access courtesy of Microsoft. Get NewsGuard Global Leader in Information Reliability Ratings Careers Press Privacy Policy Get NewsGuard Terms of Service Contact Cookie Notice Support About 25 W. 52nd Street, 15th Floor New York, NY 10019 Bluesky X Facebook LinkedIn © 2024 NewsGuard® Technologies, Inc. NewsGuard Technologies is solely responsible for the content."
