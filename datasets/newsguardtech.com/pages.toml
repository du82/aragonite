full_description = '''Data and tools to combat hostile foreign information operations targeting democracies worldwide NewsGuard’s information analysts are experienced journalists trained to identify and track foreign state-sponsored disinformation sources and narratives targeting democracies worldwide. Using OSINT methods and a thorough, journalistic approach, NewsGuard’s team captures data and insights about disinformation sources and narratives. These can be used by analysts as an early warning system about emerging threats and layered on to existing open source collection and analysis tools to provide an additional layer of human-intelligence insights. Our solutions include: Foreign Malign Actor Data: Detailed data on known publishers affiliated with foreign state media or state-sponsored disinformation operations. State-Sponsored Disinformation Fingerprints: Thorough data seeds for identifying, tracking, and tracing the origins of false claims emerging from foreign state-sponsored disinformation campaigns. Provenance Tracing: Data tracing disinformation narratives back to their original foreign state-sponsored sources. Early Warning Alerts: Daily or weekly reports based on active monitoring for new and emerging state-sponsored disinformation risks, such as new narratives, campaigns, malign actors, or tactics and methods. Contact Us Want more information about NewsGuard? Please fill out this form and someone from our staff will be in touch with you shortly. Name* First Last Email* PhoneCompany*Please Select* Yes No NoteBy submitting this form, you agree to receive email communications from NewsGuard.CAPTCHAEmailThis field is for validation purposes and should be left unchanged. Send /* <![CDATA[ */ gform.initializeOnLoaded( function() {gformInitSpinner( 13, 'https://www.newsguardtech.com/wp-content/plugins/gravityforms/images/spinner.svg', true );jQuery('#gform_ajax_frame_13').on('load',function(){var contents = jQuery(this).contents().find('*').html();var is_pos