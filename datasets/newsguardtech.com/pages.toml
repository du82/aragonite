["https://www.newsguardtech.com/about/team/eric-effron"]
title = "Eric Effron - NewsGuard"
description = "Eric Effron is Editorial Director of NewsGuard, overseeing the editorial staff. He previously worked at Reuters, where he supervised coverage of media, technology, and other industries. He joined Reuters in 2010 as founding editor of Reuters Legal, launching a newsfeed aimed at legal professionals and overseeing U.S. legal coverage for the global Reuters wire. Prior […]"
full_description = "Eric Effron Editorial Director [email protected] Eric Effron is Editorial Director of NewsGuard, overseeing the editorial staff. He previously worked at Reuters, where he supervised coverage of media, technology, and other industries. He joined Reuters in 2010 as founding editor of Reuters Legal, launching a newsfeed aimed at legal professionals and overseeing U.S. legal coverage for the global Reuters wire. Prior to Reuters, Effron served as Executive Editor of The Week magazine, a newsweekly that provides a summation of top news and opinion articles from across the Internet and the globe. He also oversaw the magazine’s annual Opinion Awards, recognizing the nation’s top columnists, editorial cartoonists, and bloggers. Earlier in his career, Effron served as Editor and Publisher of Legal Times, a weekly newspaper about law and lobbying in Washington; and Editor of Brill’s Content, a magazine about the press and the media aimed at media consumers. Effron graduated from Clark University and received a Masters from the Columbia University Graduate School of Journalism. Global Leader in Information Reliability Ratings Careers Press Privacy Policy Get NewsGuard Terms of Service Contact Cookie Notice Support About 25 W. 52nd Street, 15th Floor New York, NY 10019 Bluesky X Facebook LinkedIn © 2024 NewsGuard® Technologies, Inc. NewsGuard Technologies is solely responsible for the content."
