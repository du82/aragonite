full_description = '''Misinformation Fingerprints™ Process NewsGuard’s Misinformation Fingerprints™ are a human- and machine-readable catalog of the top false narratives spreading online. They provide human-vetted, transparently sourced data, alerting licensees to significant false claims as they arise, detailing their provenance, and tracking how they spread across social media platforms and the open web. Licensees include social media companies seeking to mitigate falsehoods on their platforms, and the defense and intelligence communities seeking to counter Russian, Chinese, Iranian and other information operations hostile to democracies. The Misinformation Fingerprints™ are created using a proprietary process conducted by NewsGuard’s team of expert misinformation and disinformation researchers—aided by machine learning and other technology tools: Learn More About Licensing Our Misinformation Fingerprints™ Want more information about NewsGuard? Please fill out this form and someone from our staff will be in touch with you shortly. Name* First Last Email* PhoneCompany*Please Select* Yes No NoteBy submitting this form, you agree to receive email communications from NewsGuard.CAPTCHANameThis field is for validation purposes and should be left unchanged. Send /* <![CDATA[ */ gform.initializeOnLoaded( function() {gformInitSpinner( 13, 'https://www.newsguardtech.com/wp-content/plugins/gravityforms/images/spinner.svg', true );jQuery('#gform_ajax_frame_13').on('load',function(){var contents = jQuery(this).contents().find('*').html();var is_postback = contents.indexOf('GF_AJAX_POSTBACK') >= 0;if(!is_postback){return;}var form_content = jQuery(this).contents().find('#gform_wrapper_13');var is_confirmation = jQuery(this).contents().find('#gform_confirmation_wrapper_13').length > 0;var is_redirect = contents.indexOf('gformRedirect(){') >= 0;var is_form = form_content.length > 0 && ! is_redirect && ! is_confirmation;var mt = parseInt(jQuery('html').css('margin-top'), 10) + par