title = "What comes next? | Weekly Filet #505"
description = "Every week, Heatmap News Executive Editor Robinson Meyer and Princeton University Professor and energy systems expert Jesse Jenkins make sense of the biggest shift of our time -- navigating the energy transition away from fossil fuels. Drawing on their years of experience reporting on and researching climate change and decarbonization, Meyer and Jenkins unpack the most important issues of the week and how the impacts of climate change and efforts to address it are transforming our economy, politics, and society at large. Music by Adam Kromelow. Hosted on Acast. See acast.com/privacy for more information."
full_description = "What comes next? Plus: How to become collapse aware & How to survive the broligarchy (#505) David Bauer 22 Nov 2024 — 5 min read This is David, your human alternative to the For You feed, and you're reading the Weekly Filet, the newsletter for curious minds who love when something makes them go «Huh, I never thought of it this way!». As every Friday, I have some recommendations for you, to make sense of what’s happening, and imagine what could be. It's great to have you.1. The World Will Miss 1.5C. What Comes Next?This 60 minute podcast episode is for anyone who cares about a liveable planet, but who isn't following climate news very closely. You might have heard about the 1.5 degree goal that we're about to miss. This conversation gives a good understanding of what this means (and doesn't mean), and what's next. Highly recommended.The World Will Miss 1.5C. What Comes Next? - Shift Key with Robinson Meyer and Jesse JenkinsEvery week, Heatmap News Executive Editor Robinson Meyer and Princeton University Professor and energy systems expert Jesse Jenkins make sense of the biggest shift of our time -- navigating the energy transition away from fossil fuels. Drawing on their years of experience reporting on and researching climate change and decarbonization, Meyer and Jenkins unpack the most important issues of the week and how the impacts of climate change and efforts to address it are transforming our economy, politics, and society at large. Music by Adam Kromelow. Hosted on Acast. See acast.com/privacy for more information.Pocket CastsPocket Casts2. How to survive the broligarchy: 20 lessons for the post-truth worldWhen someone tells you who they are, believe them. Do not kiss the ring. Do not bend to power. Know what you stand for and what you think is good. Find allies in unlikely places. And other words of wisdom.How to survive the broligarchy: 20 lessons for the post-truth world | Carole CadwalladrIn the wake of Trump’s unnerving appointees, the investigative journalist and veteran of the libel court offers pointers on coping in an age of surveillanceThe GuardianCarole Cadwalladr3. 17 key charts to understand the COVID-19 pandemicFive years ago, the first person got infected with a novel coronavirus. Five years! My memory of that time oscillates between something that feels very recent still, and something far, far gone. Our World In Data provided much of the data that helped us make (some) sense of what was happening and that powered all these charts we were staring at, hoping for curves to bend. They have now published an extensive retrospective, which also reminds us that to this day people are suffering from, and dying of Covid. Five years later, an estimated 27 million people have lost their lives.17 key charts to understand the COVID-19 pandemicThe pandemic has resulted in over twenty million deaths. In this article, we review the key insights from global data on COVID-19.Our World in DataBy: Saloni Dattani and Lucas Rodés-Guirao4. How I became 'collapse aware'«To be collapse aware is to live with the sense that something about the way we live is coming to an end.» A personal essay that, to me, felt like it captured something raw and true that was hiding in plain sight. It ends on a more positive note than you'd expect.How I became ‘collapse aware’And started to imagine what comes nextWhat Do We Do Now That We're Here?Rosie Spinks5. 1000 questions to save wisdomYou might need a little time for this one. It's indeed 1000 questions, and no easy ones, with the «simple goal to preserve wisdom, for you, your family or the world».The 1000 word Save Wisdom Questions. – SaveWisdom.orgSaveWisdom.orgWhat else?Instant-gratification links that make you go wow! or aha! the moment you click.A realtime map of Scotland's named ice gritters. Say hello to «Lord Coldemort», «Sir David Attenbrrrrrr» and «For Your Ice Only».Really quite embarrassing how low Switzerland ranks here, having dropped another 12 ranks.I'm team «beach master»: Shortlisted photos from the 2024 Close-Up Photographer of the YearEar candy: the first track from Nils Frahm's upcoming record.I like this «living book cover», as they call it. Scroll to experience it.An interactive map, circa 1618.Books for curious minds Some new ones as I read them, some older ones that continue to inform how I look at the world and myself. More on my digital bookshelf.A wonderful book on the materials our modern world runs on — from concrete, steel and glass to paper, foam and graphite (also: chocolate). Nerdy in all the best ways. Buy it here.A gem from the archivenone*: An out of the box puzzle gamenone*: An out of the box puzzle gamenone*none*The Weekly Filet archive offers more than 2500 hand-picked links since 2011, like this one. You can search by interests, explore collections, shuffle for a gem or check out my all-time favs.That's it for this week. Thanks for reading. I wish you a nice weekend and hope to see you again next Friday!— David"
