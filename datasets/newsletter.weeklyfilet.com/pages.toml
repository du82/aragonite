["https://newsletter.weeklyfilet.com/the-crisis-era"]
title = "The Crisis Era | Weekly Filet #497"
description = "Listen to the latest episodes of The Third Information Crisis by Naomi Alderman on BBC Sounds"
full_description = "The Crisis Era What is the most useful thing you could know about your own life? (#497) David Bauer 12 Jul 2024 — 4 min read 1. The Third Information CrisisWhat is the most useful thing you could know about your own life? Thus begins this series of audio essays from the BBC. The answer Naomi Alderman suggests: the name of the era you're living through. And she argues that we should think of our current era as the third great information crisis, brought about by digital communication. A joy to listen to, and inspiring all sorts of reflections.BBC Sounds - The Third Information Crisis by Naomi Alderman - Available EpisodesListen to the latest episodes of The Third Information Crisis by Naomi Alderman on BBC SoundsBBC2. In defense of an old pixelI love watching people who are so passionate about a very particular thing that you can't help but get excited about it yourself. Point in case: This 25-minute presentation by designer Marcin Wichary about pixel fonts. It's not just super fascinating – I dare you to find me a presentation with nicer animations.Config 2024: In defense of an old pixel (Marcin Wichary, Director of Design, Figma) | FigmaConfig 2024: In defense of an old pixel (Marcin Wichary, Director of Design, Figma)Say hi to Marcin. He’s obsessed with pixel fonts and wants to take you on…YouTubeFun fact: Marcin is the original creator of the game that my YouDon'tKnowAfrica is based upon.3. ​​Trump’s Second TermI had gotten a bit tired of John Oliver's approach, but this is a good one: on the people and organisations plotting a radical, authoritarian second Trump term. Their «Project 2025» is no secret, quite the opposite: Whoever is willing to pay attention, gets to see what these people are planning. What makes this so scary is that they don't even need to hide their intentions – because they know there's ample support for these plans.Trump’s Second Term: Last Week Tonight with John Oliver (HBO)John Oliver discusses Donald Trump’s plans for a second term, why it could be much worse than his first term, and what Trump has in common with a hamster. Co…YouTube4. Gradually, then Suddenly: Upon the ThresholdThresholds are a good way of making sense of technological change. These moments when a technology makes a leap from barely useable to surprisingly good. AI has, undeniably, passed lots of thresholds in the past year. But here's the catch: Unlike with other technologies, it is hard to measure when an AI crosses a threshold. Here's where the idea of the «impossibility list» comes into play...Gradually, then Suddenly: Upon the ThresholdSmall improvements can lead to big changesOne Useful ThingEthan Mollick5. The shape of informationDon't we all know the problem: You have been gifted 100 expensive wine bottles by 100 different people. But you learn that one of the bottles has been poisoned, and you have no idea which one. Interesting, slightly nerdy piece on how to extract insights with seemingly limited resources.The shape of informationHow to extract insights with seemingly limited resourcesUnderstanding the unseenAdam KucharskiWhat else?Instant-gratification links that make you go wow! or aha! the moment you click.The always excellent «Land of the Giants» podcast is back. Season 10 is about Disney.Seems a bit early to call it «100 Best Books of the 21st Century», but who am I to judge.A color picker that lets you describe a color and get an exact hex value for it.This font calls bullshit on your bullshit.«Listen to the laughing of an unidentified fish» – the (dying) sounds of a coral reef.Books for curious minds: Why We Make Things and Why It Matters Why We Make Things and Why It Matters by Peter Korn (2015)«As a maker, you put one foot in front of the other, and you own the journey.» A beautiful memoir, and an encouraging read for anyone unsure whether to follow their passion. In every issue, I recommend one book. Some new ones as I read them, some older ones that continue to inform how I look at the world and myself.A gem from the archiveIf you could – with no loss of energy – quit sleeping altogether, would you?Technology to cut down on sleep is just around the corner | Aeon EssaysNew technologies are emerging that could radically reduce our need to sleep - if we can bear to use themAeon MagazineThis is a randomly picked gem from the archive of the Weekly Filet, going back to 2011. You can also search the archive, shuffle for a gem yourself, or browse this collection of some of my all-time favs.Thanks for reading. I wish you a nice weekend and hope to see you again next Friday!— David 👋"
