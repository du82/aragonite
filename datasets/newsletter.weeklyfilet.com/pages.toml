title = "Why members matter"
description = """
Thank you for reading my newsletter Weekly Filet and following my recommendations on what to read, watch and listen to.

If you value my work, I’m asking you to become a Weekly Filet member.

In most newsletters, I include a short prompt inviting free members to become paying members"""
full_description = "Why members matter Thank you for reading my newsletter Weekly Filet and following my recommendations on what to read, watch and listen to.If you value my work, I’m asking you to become a Weekly Filet member.In most newsletters, I include a short prompt inviting free members to become paying members — this dedicated page is to give you a bit more context on why members matter so much for the Weekly Filet.Why you should become a memberCurrently, 91% of supporters renew their membership when it ends. So there seem to be lots of good reasons for becoming a member, let's start with...What you getAs a paying member you get the extended version of the newsletter every week.💡Five recommendations on what to read, watch and listen to🍫 a set of instant-gratification links (always the most clicked links each week)📚 a personal book recommendation each week🚫 no ads, everHere’s what that looks like: The True Silent Majority.Obviously, as soon as you become a member, you get access to the complete archive, going back to 2011Finally, with your membership, you enable all the work I do that is accessible to everyone, like the annual book club or the collections.What I getThe Weekly Filet is 100% independent. Without paying members, I could not sustain the effort needed to produce it. I could not pay others for their contributions. More members mean I can experiment with new formats and invest more time in making the newsletter even better. Lastly, I’m not gonna lie: The appreciation that comes with someone deciding my newsletter is worth paying for feels good.Sounds good — what does it cost?The Weekly Filet membership comes in two tiers.Become a member for $40/year – that gives you everything mentioned above.Become a Friend of the Filet for $100/year – that makes you the kind of supporter everyone wishes they had. It gives you everything mentioned above, plus lets you give a free membership to a friend of yours.Become a member nowI’m sorry, I can’t afford thatIf you’d like to support the Weekly Filet, but can’t afford the full price, send me an email and we’ll work something out. Don’t worry, I won’t be making this complicated, I trust you.Thank you!I’m fully aware that I’m not the only one asking for your money and I understand if you prefer or need to spend it elsewhere. However, paid memberships are what keeps me going and this newsletter alive, so it’s important for me to ask. I promise not to become obnoxious by asking all the time.Whatever you decide — thank you for reading this far, thank you for reading my newsletter, thank you for your support. It means a lot.See you next Friday!Best.DavidPS: There’s one more way to support the Weekly Filet, and it’s free. Give it a shout-out on social media or invite a friend to sign up. Simply share this page."
