["https://newsletter.weeklyfilet.com/meditations-in-an-emergency"]
title = "Meditations in an Emergency | Weekly Filet #516"
description = "We are very clearly in a lot of emergencies right now. They demand action. But action demands thought and thoughtfulness: who are we, what are our values, our goals, our allies, our possibilities, and our powers? What can we learn from those who’ve faced similar crises, what’s distinct about this"
full_description = "Meditations in an Emergency And why every organisation needs a keeper of the truth. (#516) David Bauer 14 Feb 2025 — 5 min read This is David, your personal attention guide, and you're reading the Weekly Filet, the newsletter for curious minds who love when something makes them go «Huh, I never thought of it this way!». As every Friday, I try to help you make sense of what’s happening, and imagine what could be. I'm glad you're here.1. Meditations in an Emergency«Nobody wants an emergency, but perhaps we should want some of the remarkable things that can happen during them.» Whenever hope is running short, it's a good idea to read Rebecca Solnit. The American writer and activist has started «Meditations in an Emergency», a new publication to meet the moment (on the same platform that this newsletter is hosted – hello fellow Ghost writer!). Her launch essay is a reminder of what's possible, and a call to action. «No one knows what happens next. But I do know what happens next can and must be in part what we do next, in a thousand ways.»Welcome to Meditations in an EmergencyWe are very clearly in a lot of emergencies right now. They demand action. But action demands thought and thoughtfulness: who are we, what are our values, our goals, our allies, our possibilities, and our powers? What can we learn from those who’ve faced similar crises, what’s distinct about thisMeditations in an EmergencyRebecca Solnit2. How could Trump end the war?Uncomfortable to listen to, but insightful nonetheless. A former national security official under Trump – who still supports him, one should add – lays out the plan for bringing peace to Ukraine. It's not what anyone should wish for (I'm reminded of what Anne Applebaum wrote in 2022: «The war won’t end until Putin loses.»). But it's what Trump is currently pushing for – and thus worth understanding. BBC News - Ukrainecast, How could Trump end the war?A former Trump aide on how peace might be achievedBBC3. ​​You Exist In The Long ContextFascinating – both for what it is, and how it came to be. An interactive Whodunit that puts you in the role of a detective who needs to solve a crime within ten steps. It's made by giving a large language model the crime story, plus a 400-word prompt to turn it into an interactive role play. The complete prompt is there for you to copy – and turn any story or historical event into a roleplay.You Exist In The Long ContextThoughts on the quiet revolution of long-context AI models, from NotebookLM’s Editorial Director Steven Johnson.Steven Johnson4. Antibiotic Resistance Is Here. Millions of People Are DyingAntibiotics are a remarkable discovery that has saved countless lives. We can't take their help for granted. Five million people annually die because they don't respond to antibiotics. By 2050, more people will die from antimicrobial resistance than from cancer. A good explainer of what's happening, and what can be done.Antibiotic Resistance Is Here. Millions of People Are Dying.Scientists and doctors can’t keep up with the tidal wave of people whose bodies don’t respond to basic antimicrobial treatment.Global Press JournalGPJ Reporters5. Bits, Features, and TruthAn insightful dissection of team dynamics, and why every organisation needs a keeper of the truth (and clarity about who it is).Bits, Features, and TruthThere’s a meeting going on right now. It’s a cross-functional meeting, which means that not only are multiple departments in the organization represented, but multiple expertise types, attitudes, and agendas as well. The cross-functional nature of this meeting means a program manager is present andRands in ReposeName *What else?Instant-gratification links that make you go wow! or aha! the moment you click.When The Guardian asked me to nominate «spineless superstars» in their newsletter, this is not what I expected.Apparently, there are around 350 pasta shapes. Reminded me of this wonderful podcast: Mission ImPASTAble. Birds lookin' good. Bird Photographer of the Year winners.This week in my ears: the ambient, focus-inducing tunes from Sunset, Detective.I wish I had the time for this Malmö Residency. Maybe you do?How long do you need to add together 100 4-digit numbers? 30 seconds, if you're this guy.What do you get when you cross a joke with a rhetorical question? Click if you need to.Books for curious minds Some new ones as I read them, some older ones that continue to inform how I look at the world and myself. More on my digital bookshelf.A wonderful — and useful — book, which comes with the smoothest chapter transitions one could imagine. Buy it here.A gem from the archiveThe War Won’t End Until Putin LosesOffering the Russian president a face-saving compromise will only enable future aggression.The AtlanticAnne ApplebaumThe Weekly Filet archive offers more than 2500 hand-picked links since 2011, like this one. You can search by interests, explore collections, shuffle for a gem or check out my all-time favs.That's it for this week. Thanks for reading. I wish you a nice weekend and hope to see you again next Friday!— David"
