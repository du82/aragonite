title = "🏆 Weekly Filet Awards 2024"
description = "It’s very hard to slow down and look closely at something. You may find it’s worth it."
full_description = "Weekly Filet Awards 2024 The best of the best of the year, in the most unglamorous yet heartfelt ceremony of the year. David Bauer 27 Dec 2024 — 8 min read This is David, your personal curator of the best of the web. You're reading the Weekly Filet, the newsletter for curious minds who love when something makes them go «Huh, I never thought of it this way!». We're rounding off this year with a first: the Weekly Filet Awards to remind ourselves of the outstanding work published this year.We have 11 categories, from Attention Grab of The Year to History Lesson Not Learnt of The Year. Ready? Go.Most Charming Rabbit Hole Invitation of The YearSuch a wonderful talk about appreciating the small things, finding beauty and wonder in unexpected places. «I highly encourage you to go down all the rabbit holes. […] I just want us to appreciate everything endlessly.» (It starts a bit slow and confusing, but trust me, it’s so worth it.)Attention Grab of The YearPart of a series the NYT launched this year, which invites – well, rather: challenges – you to look at art for 10 minutes straight. I like how the subtle hints help you stay focused and immerse yourself rather than simply obsess over the passage of time.Test Your Focus: Can You Spend 10 Minutes With One Painting?It’s very hard to slow down and look closely at something. You may find it’s worth it.The New York TimesFrancesca Paris and Larry BuchananCollector of Secrets of The YearFrank Warren had a boring job, and suddenly, an idea. He addressed 3000 postcards to himself and started handing them out to strangers, with a simple message: «Hi, I’m Frank. And I collect secrets.» Soon enough, the secrets started coming to his mailbox. And they never stopped. Today, Frank’s collection has grown to more than a million. What a great story.Dark Matter | HazlittFor twenty years, PostSecret has broadcast suburban America’s hidden truths—and revealed the limits of limitless disclosure.HazlittMeg BernhardHistory Lesson Not Learnt of The YearIt was a chilling read back in March, it's even more so after Trump's re-election. Zooming all the way into the year 1932, the story of «how a country with a functional, if flawed, democratic machinery handed absolute power over to someone who could never claim a majority in an actual election and whom the entire conservative political class regarded as a chaotic clown with a violent following.»The Forgotten History of Hitler’s Establishment EnablersThe Nazi leader didn’t seize power; he was given it.The New YorkerAdam GopnikUnified Theory of The YearYou’re born with a finite number of fucks to give. So your challenge in life is to give a fuck about the right things, and make sure you never run out of fucks to give. The unified theory of fucks comes with a life hack: the infinite fucks loop, if you will.A unified theory of fucksWhere to give all your precious fucks.A Working LibraryMandy Brown New here? Sign up for free to get recommendations like these in your inbox every Friday. Sign up .nc-loop-dots-4-24-icon-o{--animation-duration:0.8s} .nc-loop-dots-4-24-icon-o *{opacity:.4;transform:scale(.75);animation:nc-loop-dots-4-anim var(--animation-duration) infinite} .nc-loop-dots-4-24-icon-o :nth-child(1){transform-origin:4px 12px;animation-delay:-.3s;animation-delay:calc(var(--animation-duration)/-2.666)} .nc-loop-dots-4-24-icon-o :nth-child(2){transform-origin:12px 12px;animation-delay:-.15s;animation-delay:calc(var(--animation-duration)/-5.333)} .nc-loop-dots-4-24-icon-o :nth-child(3){transform-origin:20px 12px} @keyframes nc-loop-dots-4-anim{0%,100%{opacity:.4;transform:scale(.75)}50%{opacity:1;transform:scale(1)}} Email sent! Check your inbox to complete your signup. Undecided? Learn more Nature-Inspired User Manual of The YearI love how applying the right metaphor adds an entire new layer to a not-so-new take: The internet has become too centralised, too dominated by very few giant players. «When we simplify complex systems, we destroy them, and the devastating consequences sometimes aren’t obvious until it’s too late.» This wonderful essay uses nature to chart path forward to a reinvigorated, more resilient internet.We Need To Rewild The Internet | NOEMAThe internet has become an extractive and fragile monoculture. But we can revitalize it using lessons learned by ecologists.NOEMAMaria FarrellThis issue is sponsored by Meco. If you like newsletters, but not the fact that they pile up in your inbox, you should try Meco. It's a free app just for newsletter reading, and you can add all your existing subscriptions in seconds.👆 Ads like this one support the free version of the Weekly Filet. Go ad-free with a membership.Kathryn Schulz Essay of The Year (because she's in a league of her own)Kathryn Schulz will get me interested in any topic, no exceptions. Here it's comparative thanatology – the study of how different species respond to death. Of course, this turns out to be an extremely fascinating field of study – sometimes «at the intersection of love, death, and dinner», as Schulz writes. What’s not to love!What Do Animals Understand About Death?The question isn’t whether other creatures share our concept of mortality; it’s whether any living being truly grasps what it means to die.The New YorkerKathryn SchulzRunner-up: The Secrets of SuspenseMind-Blowing Essay That Might or Might Not Look Silly in a Few Years of The Year Dario Amodei, the founder of Anthropic, lays out his vision of what a world with powerful AI might look like if everything goes right. I like how clearly he describes what the best-case scenario would look like. It makes everything tangible – and disputable. Here’s one key takeaway: «After powerful AI is developed, we will in a few years make all the progress in biology and medicine that we would have made in the whole 21st century.»Dario Amodei — Machines of Loving GraceHow AI Could Transform the World for the BetterDario AmodeiWitnesses of The YearThe most horrifying thing I read all year. An eyewitness report from two doctors who return from Gaza with images and smells they won’t be able to forget, and an appeal: «We must decide, once and for all: are we for or against murdering children?» ⚠️ Contains images and descriptions that are hard to stomach – which is kind of the point of the whole story, but be warned and maybe pass on this one if you don’t feel comfortable exposing yourself to it.👨‍⚕️ We Volunteered at a Gaza Hospital. What We Saw Was Unspeakable.Nerdy Deep Dive of The YearI love watching people who are so passionate about a very particular thing that you can’t help but get excited about it yourself. Case in point: This 25-minute presentation by designer Marcin Wichary about pixel fonts. It’s not just super fascinating – I dare you to find me a presentation with nicer animations.Happy Ending of The Year«If people are going to say nice things about me, I’d rather hear it» – well, you have a point there. When you know you’re going to die soon, why not gather with all your loved ones while you’re still there? And make it a celebration of life instead of the mourning of death? ‘I didn’t realise I was so loved’: the people hosting their own ‘living funerals’Wouldn’t it be nice to hear all the lovely things friends and family might say about us at our funeral? Isabelle Aron meets five people – some with a terminal diagnosis – who have done just thatThe GuardianIsabelle AronGo deeperThe Weekly Filet archive now holds 2622 manually curated gems, some of the best things on the web since 2011. You can search the archive, click for a random gem or browse my collections.Making Sense of the Climate CrisisMaking Sense of Artificial IntelligenceThe Stuff Our Modern World Runs OnThe Art of Thinking (Differently)Bingeworthy PodcastsGreat Reads That Aged WellThat's it for this year. Thanks you for following along. I wish you a calm and happy end of the year, and look forward to seeing you again in 2025.Before you go: If you appreciate my work and want to help me keep going, please consider supporting me with a membership. It's $40 a year, less than a dollar per week with a guaranteed «Huh, I never thought of it this way!» moment each time.Become a member for $40 a yearNot ready to commit, but you still want to support my work? Leave a tip— David"
