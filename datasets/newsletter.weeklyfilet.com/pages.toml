["https://newsletter.weeklyfilet.com/what-are-we-seeing"]
title = "What are we seeing? | Weekly Filet #515"
description = "Look closely at the first two weeks of Donald Trump’s second term and you’ll see something very different than what he wants you to see."
full_description = "What are we seeing? Plus: Building churches upside-down and humanity's last exam. (#515) David Bauer 07 Feb 2025 — 4 min read This is David, your human beacon in a sea of content, and you're reading the Weekly Filet, the newsletter for curious minds who love when something makes them go «Huh, I never thought of it this way!». As every Friday, I'm trying to help you make sense of what’s happening, and imagine what could be. Thanks for following along.1. Don't Believe HimAn essay on Trump that had me thinking this week, as it offers a perspective that contrasts with pretty much everything else I'm gathering these days. The key argument: What we see is a «projection of strength [that] obscures the reality of weakness». A mirage of power that only works as long as enough people believe it. The argument makes sense when I listen to it, it really does. And yet: It does not (yet) compute.Opinion | Don’t Believe HimLook closely at the first two weeks of Donald Trump’s second term and you’ll see something very different than what he wants you to see.The New York TimesEzra Klein2. This Is So Much Worse Than Last TimeA matter-of-factly description of all the craziness that we witnessed in the first two weeks of the new administration. Even if this were weakness masquerading as strength, the damage being done is astounding. Then again, calling it «a distributed denial of service attack on people who believe in reality» echoes the argument from Klein's essay above.This Is So Much Worse Than Last TimeWhy Democrats and the media are struggling to capture the insanity—and danger—of the new Trump administration.The New RepublicAlex Shephard3. ​​How Upside-Down Models Revolutionized ArchitectureHow creating a model upside-down made the impossible possible with St. Paul's Cathedral in London, and paved a new path for imagining complex structures.4. The New ZuckThis one-hour episode is the best reconstruction I've encountered of how Mark Zuckerberg became Maga Zuckerberg.The New Zuckerberg - Search EngineNo question too big, no question too small. On Search Engine, PJ Vogt answers the questions you might ask the internet when you can’t sleep. If you find the world bewildering, but also sometimes enjoy being bewildered by it, we’re here for you. Edited by Sruthi Pinnamaneni. ***Named one of the best podcasts by Vulture, Time, The Economist, & Vogue. (OK, in 2023, but still...)***Pocket CastsPocket Casts5. Humanity’s Last ExamThis is a fascinating challenge: To test when – if ever, but yes, more likely: when – artificial intelligence surpasses human intelligence, scientists are designing a super-hard exam, called Humanity's Last Exam. 3000 multiple-choice and short answer questions, with areas ranging from hummingbird anatomy to rocket engineering.When A.I. Passes This Test, Look OutThe creators of a new test called “Humanity’s Last Exam” argue we may soon lose the ability to create tests hard enough for A.I. models.The New York TimesKevin RooseReporting from San Francisco This post is for paying subscribers only Subscribe now Already have an account? Sign in"
