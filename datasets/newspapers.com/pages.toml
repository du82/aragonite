description = "Humphrey DeForest Bogart (December 25, 1899 – January 14, 1957) was an American film and stage actor. His performances in numerous films from the Classical Hollywood era made him a cultural icon In 1999, the American Film Institute ranked him as the greatest male star of American cinema. Wikipedia Learn more about through historical newspapers […]"
full_description = '''Humphrey Bogart Humphrey Bogart, c. 1940 Humphrey DeForest Bogart (December 25, 1899 – January 14, 1957) was an American film and stage actor. His performances in numerous films from the Classical Hollywood era made him a cultural icon In 1999, the American Film Institute ranked him as the greatest male star of American cinema. Wikipedia Learn more about Humphrey Bogart through historical newspapers from our archives. Explore newspaper articles, headlines, images, and other primary sources below. Articles and Clippings about Humphrey Bogart Humphrey Bogart's father and mother close their summer cottage for the year in 1902 Sun, Oct 5, 1902 – 14 · Buffalo Courier (Buffalo, New York, United States of America) · Newspapers.comPhoto of Humphrey Bogart and other cast members of Broadway play "The Cradle Snatchers" 1925 Sun, Sep 6, 1925 – 72 · Daily News (New York, New York, United States of America) · Newspapers.comHumphrey Bogart and first wife Helen Menken get a divorce in 1927 Sat, Nov 19, 1927 – 161 · Daily News (New York, New York, United States of America) · Newspapers.comHumphrey Bogart moves from New York and Broadway to pursue a career in Hollywood Sun, Oct 19, 1930 – 39 · The Los Angeles Times (Los Angeles, Los Angeles, California, United States of America) · Newspapers.comNew to Hollywood, Humphrey Bogart asks where all the wild parties are Mon, Nov 24, 1930 – Page 4 · The San Bernardino County Sun (San Bernardino, San Bernardino, California) · Newspapers.comHumphrey Bogart to divorce his second wife, Mary Phillips, in 1937 Sat, Jan 30, 1937 – Page 8 · Pittsburgh Post-Gazette (Pittsburgh, Allegheny, Pennsylvania) · Newspapers.comThe 5’11” Humphrey Bogart enjoys the villain roles he is known for in many of his movies Sun, Feb 25, 1940 – 46 · The Baltimore Sun (Baltimore, Baltimore, Maryland, United States of America) · Newspapers.comHumphrey Bogart is cast as a gangster in his new 1942 movie “The Big Shot” Sun, Aug 9, 1942 – 21 · The Jackson Sun (Jackson, Tennessee) · Newspapers.comDespite playing tough characters in past, Bogart wants to try playing a romantic hero Tue, Jan 27, 1942 – 12 · The Record (Hackensack, Bergen, New Jersey, United States of America) · Newspapers.comPhoto of Humphrey Bogart and Ingrid Bergman in the 1942 film “Casablanca” Thu, Mar 11, 1943 – 7 · The Daily Times (Davenport, Scott, Iowa, United States of America) · Newspapers.comHumphrey Bogart is interviewed about his upbringing and his career Sun, May 7, 1944 – Page 25 · The Ogden Standard-Examiner (Ogden, Weber, Utah) · Newspapers.comPhoto of Humphrey Bogart and Lauren Bacall in their new movie “To Have and Have Not” Thu, Mar 8, 1945 – Page 10 · Democrat and Chronicle (Rochester, Monroe, New York, United States of America) · Newspapers.comDelay in Humphrey Bogart’s divorce to 3rd wife Mayo Methot delays his wedding to Lauren Bacall Sat, May 5, 1945 – 3 · The Austin American (Austin, Travis, Texas, United States of America) · Newspapers.comHumphrey Bogart talks about his ideas on rearing children Tue, May 24, 1949 – Page 8 · The Rhinelander Daily News (Rhinelander, Oneida, Wisconsin) · Newspapers.comBogart discusses his current career as well as his home life with his wife and son, Stephen Sun, Jan 28, 1951 – 99 · The Los Angeles Times (Los Angeles, Los Angeles, California, United States of America) · Newspapers.comBehind the scenes of filming "The African Queen" with Humphrey Bogart and Katharine Hepburn Sun, Aug 12, 1951 – Page 14 · The Sydney Morning Herald (Sydney, New South Wales, Australia) · Newspapers.comPhoto of Humphrey Bogart riding a donkey in Italy; Says it was John Huston's idea Sun, Dec 13, 1953 – Page 93 · The Courier-Journal (Louisville, Jefferson, Kentucky, United States of America) · Newspapers.comHumphrey Bogart and Audrey Hepburn in the 1954 movie “Sabrina” Wed, Oct 6, 1954 – 53 · The Evening Sun (Baltimore, Maryland, United States of America) · Newspapers.comPhoto of Humphrey Bogart with his wife Lauren Bacall, son Stephen, and daughter Leslie Tue, Jan 15, 1957 – Page 6 · The Morning News (Wilmington, New Castle, Delaware, United States of America) · Newspapers.comObituary for Humphrey Bogart, who died on January 14, 1957, due to cancer Tue, Jan 15, 1957 – 3 · Elmira Advertiser (Elmira, New York, United States of America) · Newspapers.comHumphrey Bogart tops American Film Institute's list of male screen legends in 1999 Thu, Jun 17, 1999 – 14 · The Monitor (McAllen, Hidalgo, Texas, United States of America) · Newspapers.com Cite this page "Humphrey Bogart," Newspapers.com Topics (https://www.newspapers.com/topics/famous-people/humphrey-bogart/ : accessed March 2, 2025) Other Topics found in NewspapersIda B. WellsMuhammad Ali1969 WoodstockBeatrix Potter Related Topics Norman Rockwell Elvis Presley Charlie Chaplin Walt Disney Topics Arts & Entertainment, Famous People actors The views and opinions expressed in these newspaper articles and clippings are those of the authors and do not necessarily reflect the views and opinions of Newspapers.com or Ancestry.'''
