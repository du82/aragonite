full_description = '{"@context":"https://schema.org","@type":"NewsArticle","accessMode":["textOnVisual","textual"],"datePublished":"1966-02-20","publisher":{"@type":"Organization","legalName":"Idaho State Journal"},"about":"Judy NELSON, Glenn AMES Tell Summer Wedding Plans","image":"https://img.newspapers.com/img/thumbnail/15844216/252/260/1287_0_862_1746.jpg","locationCreated":"Pocatello, Idaho","pageStart":"Page 24","text":"of crowned of streamers to Oflices chairman, Valentine Valentine Judy Nelson, Glenn Ames Tell Summer Wedding Plans Announcement is being made Mr. and Mrs. Earl Nelson, 813 Jefferson, of the engagement and approaching marriage of their daughter, Judy, to Glenn E. Ames, son of Mr. and Mrs. Clyde Ames, 1036 North Eighth. The wedding will be solemnized July 22 at the Alameda LDS Stake House on Alameda Road. The bride-to-be is a 1963 graduate of Pocatello High School. She now is employed by Farmers Insurance Group in the South Fifth office. The future bridegroom also attended Pocatello High School and served the Air Force. He| plans to enroll at Idaho State University for the fall semester lot 1967.&quot; .."}FreeviewEnjoy this clipping for freeEnjoy this clippingTry 7 Days Free to get access to 1 billion+ pagesTry 7 Days Free7 Days FreeIdaho State JournalPocatello, Idaho • Sun, Feb 20, 1966Page 24Judy NELSON, Glenn AMES Tell Summer Wedding PlansTags:marriageSave to AncestryShareMoreorLesslike this?Save to AncestryShareMoreLessJudy NELSON, Glenn AMES Tell Summer Wedding PlansTags:marriageSearch the largest online newspaper archiveMore Clippings by tags, date and locationLoading Loading Loading Loading Trending ClippingsLoading Loading Loading Loading View All ClippingsIdaho State JournalPocatello, Idaho • Sun, Feb 20, 1966Page 24CLIPPED BYststar • 11 hours agoTopics to BrowseElvis PresleyNorman RockwellAtomic Bombings of Hiroshima and Nagasaki19th AmendmentAmistad CaseUSS IndianapolisTry 7 Days FreeHide Article Text (OCR) •Source Citation•Report a p