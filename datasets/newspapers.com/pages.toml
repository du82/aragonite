full_description = "AccountIntroduction and SearchingHow to Use the ViewerSearch AlertsAccount SupportSubscription OptionsSomething not workingFollowing a Paper or PersonUsing Profile PagesHelp HomepageAccount SupportBack to HelpI have questions about my account on Newspapers.com™?For questions about billing, cancellation, account status, or changing your account settings, please go to Account Details.How do I manage what emails I receive from Newspapers.com™?To manage the email notifications and email communications you receive, please go to Communication Settings.What memberships does Newspapers.com offer?Choose a plan for additional details on pricing and subscriptions.You can also access Newspapers.com through various libraries and institutions. Check your local library for availability.Which payment methods do you accept?We accept all major credit cards (Visa, MasterCard, American Express, and Discover) or debit cards carrying the logo for one of these major credit card companies. All prices are in US Dollars.We do not currently accept PayPal, personal checks or money orders.If you have any questions please contact us.How do I stop my account from auto-renewal or cancel my subscription?Visit the Subscription & Payment section of Account DetailsClick on “Cancel and End Subscription”Follow the steps to finish cancelling your subscription**Cancelling your subscription will end your subscription on the expiration date stated in Account Details.Why am I being charged tax?Newspapers.com is a US website under Ancestry® which means that taxes still apply in most countries for an order to be processed. When you sign up to a subscription, your tax will be calculated automatically, and added to your billing. Tax rates vary by country and unfortunately are out of our control. If you have more questions about this, contact us.Other questionsIf you have other questions please contact us or you can leave us phone message at 1-877-519-0129 and we will get back to you in a timely manner."
