Anglicanaidd. Ymhlith perchnogion y papur oedd Thomas L. James (ca. 1895-), Thomas J. Morris (ca. 1906-) a C. Dudley Morris (ca. 1920-). Teitlau cysylltiol: Potter's electric news (1855-1869). Abstract (lang="en") A weekly English language newspaper, which circulated in the main coastal towns of Pembrokeshire & Cardiganshire. The newspaper's main content advocated agricultural and commercial interests, but also included topics on such themes as politics, literature and religion. It was also a conservative paper and a strong supporter of the Church of England. Joseph Potter was a notable editor. From about 1895 it was owned by Thomas L. James, but then was sold on to Thomas J. Morris (ca. 1906) and then C. Dudley Morris (ca. 1920-). Associated title: Potter's electric news (1855-1869). Note: date/sequential designation Began with issue for: No. 1 (5 Jan. 1844). Ended with issue for: No. 5686 (10 Dec.1924). Note Description based on issue for: No. 718 (8 Jan. 1858). Note: issuing body note (lang="cy") Cyhoeddwyd yn Hwlffordd gan Joseph Potter. Note: issuing body note (lang="en") Published in Haverfordwest by Joseph Potter. Note Absorbed in 1869: Potter's electric news. Subject (LCSH) Geographic Pembrokeshire (Wales) Genre Newspapers Subject (LCSH) Geographic Haverfordwest (Wales) Genre Newspapers Related Item: preceding Title Information Title Potter's electric news Identifier: Local (WlAbNL)004578188 Record Information descriptionStandard aacr2 Record Content Source (marcorg) WlAbNL Record Creation Date (encoding="marc") 081017 Record Change Date (encoding="iso8601") 20111202135800.0 Record Identifier (source="WlAbNL") vtls004577815 Origin of Record Converted from MARCXML to MODS version 3.3 using MARC21slim2MODS3-3.xsl (Revision 1.54) languageOfCataloging Language Term: Code (ISO639-2B) eng View All Available Issues Select a year between 1844 and 1910 // make a js array from $issueList var issueList = [{"type":"newspapers","provider":"WlAbNL","collection_title":"The