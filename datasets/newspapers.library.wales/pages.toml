full_description = '''Home About Advanced Search New Search Help Search History Please review your cookie consent and accept 'Search History' to enable search logging Welsh Newspapers Search 15 million Welsh newspaper articles Seren Cymru A Welsh language newspaper, which was established, initially unsuccessfully, in Carmarthen in 1851 by Samuel Evans (Gomerydd, 1793-1856), but was later re-established in 1856, under the editorship of J. Emlyn Jones (Ioan Emlyn, 1818-1873). The newspaper's main content included local, national and foreign news, together with radical viewpoints. It began as a biweekly paper, but in 1863 it changed to a weekly one. The printer W. Morgan Evans owned the paper until 1880, when he sold it onto a Baptist company. Amongst the newspaper's editors were Benjamin Thomas (Myfyr Emlyn, 1836-1893), John Gwili Jenkins (1872-1936) and D. Eirwyn Morgan (1918-1982). COPYRIGHT: COPYRIGHTED FREQUENCY: Wythnosol = Weekly, 1863- PUBLISHER: Published by W. Morgan Evans, Carmarthen; W. Morgan Evans & Son, Carmarthen (ca. 1906-); Baptist Bookroom Ltd., Swansea (ca. 1940-); Ilston Press, Swansea (ca. 1965-) ISSUE DATES: 1851 - 1919(2,958 available issues) View Full Details Metadata Title Information Title Seren Cymru Name: Personal Name Part Evans, Samuel Name Part: Date 1793-1856 Role Role Term: Text editor. Name: Personal Name Part Jones, John Emlyn Name Part: Date 1818-1873 Role Role Term: Text editor. Name: Personal Name Part Thomas, B. (Benjamin) Name Part: Terms of Address Myfyr Emlyn Name Part: Date 1836-1893 Role Role Term: Text editor. Name: Personal Name Part Gwili Name Part: Date 1872-1936 Role Role Term: Text editor. Name: Personal Name Part Morgan, D. Eirwyn (David Eirwyn) Name Part: Date 1918-1982 Role Role Term: Text editor. Type of Resource text Genre (marcgt) newspaper Genre () Welsh newspapers-Wales, Mid. Origin Information Place Place Term: Code (MARC Country Code) wlk Place Place Term: Text Caerfyrddin [Carmarthen] Publisher William Morgan Evans Date Issued 1851-1852, 1856- Date Created: Start (encoding="marc") 1851 Date Created: End (encoding="marc") 20uu Frequency Wythnosol = Weekly, 1863- Frequency Pythefnosol = Biweekly, 1851-1862 Language Language Term: Code (ISO639-2B) wel Physical Description Form (marcform) print Extent v. : ill. ; 43 cm. Abstract (lang="cy") Papur newydd Cymraeg a sefydlwyd yn 1851 yng Nghaerfyrddin gan Samuel Evans (Gomerydd, 1793-1856). Ni lwyddodd y papur ac fe ddaeth i ben yn 1852. Yn 1856 dechreuwyd ei gyhoeddi unwaith eto o dan olygiaeth J. Emlyn Jones (Ioan Emlyn, 1818-1873). Papur pythefnosol ydoedd tan iddo droi'n wythnosol yn 1863. Cofnodai'r papur newyddion tramor, cenedlaethol a lleol, a chynhwysodd safbwyntiau radicalaidd. 'Roedd yn eiddo i W. Morgan Evans, argraffydd y papur, tan iddo gael ei werthu yn 1880 i gwmni o Fedyddwyr. Ymhlith ei olygyddion 'roedd Benjamin Thomas (Myfyr Emlyn, 1836-1893), John Gwili Jenkins (1872-1936) a D. Eirwyn Morgan (1918-1982). Abstract (lang="en") A Welsh language newspaper, which was established, initially unsuccessfully, in Carmarthen in 1851 by Samuel Evans (Gomerydd, 1793-1856), but was later re-established in 1856, under the editorship of J. Emlyn Jones (Ioan Emlyn, 1818-1873). The newspaper's main content included local, national and foreign news, together with radical viewpoints. It began as a biweekly paper, but in 1863 it changed to a weekly one. The printer W. Morgan Evans owned the paper until 1880, when he sold it onto a Baptist company. Amongst the newspaper's editors were Benjamin Thomas (Myfyr Emlyn, 1836-1893), John Gwili Jenkins (1872-1936) and D. Eirwyn Morgan (1918-1982). Note: date/sequential designation Dechreuodd gyda rhifyn ar gyfer = Began with issue for: Cyf. I, rhif. 1 (13 Awst 1851). Note Seiliwyd y disgrifiad ar rhifyn ar gyfer = Description based on issue for: Cyf. I, rhif. 1 (13 Awst 1851). Note Is-deitl yn amrywio = Subtitle varies. Note Cyhoeddwyd rhifynnau hwyrach yn = Later issues published: Ab