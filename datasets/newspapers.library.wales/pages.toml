full_description = '''Home About Advanced Search New Search Help Search History Please review your cookie consent and accept 'Search History' to enable search logging Welsh Newspapers Search 15 million Welsh newspaper articles The London Kelt A weekly English and Welsh language newspaper, established in 1895 by Thomas John Evans (1863-1932) who also edited it for almost 20 years. In 1897 it changed into 'Celt Llundain = London Kelt', but was eventually absorbed into 'London Welshman'. The newspaper's main content included Welsh national news, news relating to the Welsh of London, general news, politics and sports, together with extracts of literature. Amongst the newspaper's notable contributors was Timothy Eynon Davies (1854-1935). COPYRIGHT: UNKNOWN FREQUENCY: Weekly PUBLISHER: Published in London by Grellier & Son. ISSUE DATES: 1895 - 1904(455 available issues) View Full Details Metadata Title Information Non Sort The Title London Kelt Name: Personal Name Part Evans, Thomas John Name Part: Date 1863-1932 Role Role Term: Text editor. Name: Personal Name Part Davies, T. Eynon (Timothy Eynon) Name Part: Date 1854-1935 Role Role Term: Text contributor. Type of Resource text Genre (marcgt) newspaper Genre () Welsh newspapers-London (England) Origin Information Place Place Term: Code (MARC Country Code) enk Place Place Term: Text London Publisher J. G. Grellier Date Issued 1895-1896 Date Created: Start (encoding="marc") 1895 Date Created: End (encoding="marc") 1896 Frequency Weekly Language Language Term: Code (ISO639-2B) eng Language Language Term: Code (ISO639-2B) wel Physical Description Form (marcform) print Extent v. : ill. ; 25 cm. Abstract (lang="cy") Papur newydd wythnosol cenedlaetholgar a gyhoeddwyd yn ddwyieithog. Cafodd ei sefydlu yn 1895 gan Thomas John Evans (1863-1932) a fu hefyd yn olygydd am bron i 20 mlynedd. Yn 1897 newidiodd ei enw i 'Celt Llundain = London Kelt' ac yn 1904 fe'i amlyncwyd gan y 'London Welshman'. Cofnodai newyddion o Gymru ac am y Cymry yn Llundain, ynghyd a newyddion cyffredinol, gwleidyddol a chwaraeon. Cynhwysai hefyd weithiau llenyddol. Un o'i gyfrannwyr cyson oedd Timothy Eynon Davies (1854-1935). Teitlau cysylltiol: Celt Llundain (1897-1904). Abstract (lang="en") A weekly English and Welsh language newspaper, established in 1895 by Thomas John Evans (1863-1932) who also edited it for almost 20 years. In 1897 it changed into 'Celt Llundain = London Kelt', but was eventually absorbed into 'London Welshman'. The newspaper's main content included Welsh national news, news relating to the Welsh of London, general news, politics and sports, together with extracts of literature. Amongst the newspaper's notable contributors was Timothy Eynon Davies (1854-1935). Note: date/sequential designation Dechreuodd gyda rhifyn ar gyfer = Began with: No. 1 (12 Jan. 1895). Gorffennodd gyda rhifyn ar gyfer = Ended with issue for: No. 117 (26 Dec. 1896). Note Seiliwyd y disgrifiad ar rhifyn ar gyfer = Description based on issue for: Vol. I, no. 1 (12 Jan. 1895) Note: issuing body note (lang="cy") Cyhoeddwyd yn Llundain gan Grellier & Son. Note: issuing body note (lang="en") Published in London by Grellier & Son. Note Continued in 1897 as: Celt Llundain = The London Kelt. Subject (LCSH) Topic Welsh Geographic England Geographic London Genre Newspapers Subject (LCSH) Geographic London (England) Genre Newspapers Subject (LCSH) Geographic Wales Genre Newspapers Related Item: succeeding Title Information Title Celt Llundain = The London Kelt Identifier: Local (WlAbNL)002993107 Record Information descriptionStandard aacr2 Record Content Source (marcorg) WlAbNL Record Creation Date (encoding="marc") 080922 Record Change Date (encoding="iso8601") 20110427153900.0 Record Identifier (source="WlAbNL") vtls004564388 Origin of Record Converted from MARCXML to MODS version 3.3 using MARC21slim2MODS3-3.xsl (Revision 1.54) languageOfCataloging Language Term: Code (ISO639-2B) eng View All Available Issues Select a year betwee