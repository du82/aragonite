 Gorllewin Trefaldwyn. Ymhlith perchnogion y papur bu John Morgan (ca. 1895) a David Rowlands (ca. 1910). Bu Richard Hughes Williams (Dic Tryfan, 1878?-1919) yn olygydd ar y papur rhwng 1913 a 1915. Abstract (lang="en") A weekly English language newspaper, supportive of conservative politics, which circulated in Ceredigion, South Merionethshire and West Montgomeryshire. The newspaper's main content included local and district news, together with a list of visitors. From about 1895 it was owned by John Morgan, but was later sold on to David Rowlands (ca. 1910). Richard Hughes Williams (Dic Tryfan, 1878?-1919) was a notable editor from 1913 to 1915. Note: date/sequential designation Began with issue for: No. 1 (19 June 1858). Ended with issue for: No. 2948 (8 May 1915). Note Description based on issue for: No. 1 (19 June 1858). Note Subtitle varies. Note: issuing body note (lang="cy") Cyhoeddwyd yn Aberystwyth gan David Jenkins. Note: issuing body note (lang="en") Published in Aberystwyth by David Jenkins. Note Absorbed by: Montgomery county times and Shropshire and Mid-Wales advertiser. Subject (LCSH) Geographic Aberystwyth (Wales) Genre Newspapers Subject (LCSH) Geographic Cardiganshire (Wales) Genre Newspapers Subject (LCSH) Geographic Montgomeryshire (Wales) Genre Newspapers Related Item: succeeding Title Information Title Montgomery county times and Shropshire and Mid-Wales advertiser Identifier: Local (WlAbNL)003060770 Record Information descriptionStandard aacr2 Record Content Source (marcorg) WlAbNL Record Creation Date (encoding="marc") 991007 Record Change Date (encoding="iso8601") 20111202135600.0 Record Identifier (source="WlAbNL") vtls003004119 Origin of Record Converted from MARCXML to MODS version 3.3 using MARC21slim2MODS3-3.xsl (Revision 1.54) languageOfCataloging Language Term: Code (ISO639-2B) eng View All Available Issues Select a year between 1858 and 1910 // make a js array from $issueList var issueList = [{"type":"newspapers","provider":"WlAbNL"