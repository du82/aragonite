full_description = '''Home About Advanced Search New Search Help Search History Please review your cookie consent and accept 'Search History' to enable search logging Welsh Newspapers Search 15 million Welsh newspaper articles Potter's Electric News A weekly English language newspaper, which circulated around Haverfordwest, Begelly, Fishguard, Tenby & Milford Haven. The newspaper's main content included local news, foreign news, advertisements and railway timetables and was published and edited by Joseph Potter. At its peak, it had a weekly circulation of 2000, but was eventually absorbed into 'Pembrokeshire herald and general advertiser'. Associated titles: Pembrokeshire herald and general advertiser (1844-1924). COPYRIGHT: PUBLIC DOMAIN FREQUENCY: Weekly PUBLISHER: Published in Haverfordwest by Joseph Potter. ISSUE DATES: 1859 - 1868(399 available issues) View Full Details Metadata Title Information Title Potter's electric news Name: Personal Name Part Potter, Joseph Name Part: Date 1818-1895 Role Role Term: Text printer. Type of Resource text Genre (marcgt) newspaper Genre () English newspapers-Wales, West. Origin Information Place Place Term: Code (MARC Country Code) wlk Place Place Term: Text Haverfordwest Publisher Joseph Potter Date Issued 1855-1869 Date Created: Start (encoding="marc") 1855 Date Created: End (encoding="marc") 1869 Frequency Weekly Language Language Term: Code (ISO639-2B) eng Physical Description Form (marcform) print Extent v. : ill. ; 51 cm. Abstract (lang="cy") Papur newydd wythnosol a gyhoeddwyd yn Saesneg. Cylchredwyd yn Hwlffordd, Begeli, Abergwaun, Dinbych-y-pysgod ac Aberdaugleddau. Cyhoeddwyd a golygwyd y papur gan Joseph Potter. Ar un adeg 'roedd i'r papur cylchrediad o 2000 o rifynnau'r wythnos. Cofnodai hysbysebion lleol, newyddion lleol a thramor ac amserlenni'r trenau. Fe'i amlyncwyd gan y 'Pembrokeshire herald and general advertiser'. Teitlau cysylltiol: Pembrokeshire herald and general advertiser (1844-1924). Abstract (lang="e