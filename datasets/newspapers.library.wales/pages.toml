full_description = '''Home About Advanced Search New Search Help Search History Please review your cookie consent and accept 'Search History' to enable search logging Welsh Newspapers Search 15 million Welsh newspaper articles Tarian Y Gweithiwr A weekly Welsh language newspaper and supporter of radical principles. The newspaper's main content included political news and opinion, with an emphasis on workers' rights, which made it popular with the iron and tin miners of South Wales. Other topics covered included information on the eisteddfodau, local history, poetry and foreign news, together with attacks on landlordism, Toryism and the established church. Amongst the paper's notable editors were Edward Davies of Rhymney, John Morgan Jones, D. Silyn Evans and J. Tywi Jones, with literary contributions also from J. Dyfnallt Owen and John Morris-Jones, Saunders Lewis. At its peak the weekly circulation reached about 15,000. Associated titles: Y Darian (1914-1934). COPYRIGHT: UNKNOWN FREQUENCY: Wythnosol = Weekly PUBLISHER: Published in Aberdare by Mills, Lynch, & Davies, 1875-ca. 1896; G. M. Evans, ca. 1897-ca. 1909. ISSUE DATES: 1875 - 1910(1,804 available issues) View Full Details Metadata Title Information Title Tarian y gweithiwr Subtitle cofnodydd helyntion gweithfaol, llenyddol, a gwleidyddol, yn nghyda newyddion Cymreig, cyffredinol, a thramor Name: Personal Name Part Evans, D. Silyn Role Role Term: Text editor. Name: Personal Name Part Jones, J. Tywi Name Part: Date 1870-1948 Role Role Term: Text editor. Type of Resource text Genre (marcgt) periodical Genre () Welsh newspapers-Wales, South. Origin Information Place Place Term: Code (MARC Country Code) wlk Place Place Term: Text Aberdare Publisher Mills, Lynch, & Davies Date Issued 1875-1914 Date Created: Start (encoding="marc") 1829 Date Created: End (encoding="marc") 1914 Frequency Wythnosol = Weekly Language Language Term: Code (ISO639-2B) wel Physical Description Form (marcform) print Extent v. ; 43 cm. Abstract (lang="cy") Papur newydd Cymraeg radicalaidd a gyhoeddwyd yn wythnosol. Bwriad y papur oedd bod yn gyfrwng i dynnu sylw at iawnderau'r gweithwyr, ac oherwydd hynny mawr oedd ei apêl i lowyr a gweithwyr haearn ac alcan De Cymru. Cynhwysodd hefyd erthyglau diwylliannol am eisteddfodau, hanes lleol, barddoniaeth a newyddion tramor. Cafwyd ynddo ymosodiadau yn erbyn landlordiaeth, Torïaeth a'r Eglwys Sefydledig. Edward Davies, Rhymni a John Morgan Jones oedd yn gyfrifol am ysgrifennu'r erthyglau golygyddol i ddechrau, cyn i D. Silyn Evans a J. Tywi Jones gymryd yr olygyddiaeth. Ymhlith y cyfranwyr cyson oedd llenorion megis J. Dyfnallt Owen, John Morris-Jones a Saunders Lewis. Yn ei anterth, llwyddai'r papur i werthu tua phymtheg mil o gopïau bob wythnos. Teitlau cysylltiol: Y Darian (1914-1934). Abstract (lang="en") A weekly Welsh language newspaper and supporter of radical principles. The newspaper's main content included political news and opinion, with an emphasis on workers' rights, which made it popular with the iron and tin miners of South Wales. Other topics covered included information on the eisteddfodau, local history, poetry and foreign news, together with attacks on landlordism, Toryism and the established church. Amongst the paper's notable editors were Edward Davies of Rhymney, John Morgan Jones, D. Silyn Evans and J. Tywi Jones, with literary contributions also from J. Dyfnallt Owen and John Morris-Jones, Saunders Lewis. At its peak the weekly circulation reached about 15,000. Associated titles: Y Darian (1914-1934). Note: date/sequential designation Dechreuodd gyda rhifyn ar gyfer = Began with issue for: Rhif. 1 (15 Ion. 1875). Gorffennodd gyda rhifyn ar gyfer = Ended with issue for: Rhif. 2062 (9 Gorff. 1914). Note Seiliwyd y disgrifiad ar y rhifyn ar gyfer = Description based on issue for: Rhif. 1 (15 Ion. 1875). Note Is-deitl yn amrywio = Subtitle varies. Note: issuing body note (lang="cy") Cyhoeddwyd yn Aberdâr gan Mills, Lynch, & Davies, 1875-