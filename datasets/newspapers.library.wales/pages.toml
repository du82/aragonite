full_description = '''Home About Advanced Search New Search Help Search History Please review your cookie consent and accept 'Search History' to enable search logging Welsh Newspapers Search 15 million Welsh newspaper articles Y Goleuad A weekly Welsh language newspaper, supportive of liberal politics and which circulated for the Welsh Calvinistic Methodists throughout Wales, including the Welsh of Liverpool, Manchester, London and Bristol. The newspaper's main content reflected the denominational interests and news relating to the Union, while also advocating temperance and radicalism. Established in 1869 as a private venture, it was then subsequently bought by the Union in 1911. Amongst its editors were John Davies (Gwyneddon, 1832-1904) and John Roberts (Ieuan Gwyllt, 1822-1877). COPYRIGHT: UNKNOWN FREQUENCY: Wythnosol = Weekly PUBLISHER: Published by John Davies, 1869-ca. 1894; E. E. Evans, Dolgellau, ca. 1895-ca. 1919; Welsh National Press Co. Ltd, Caernarfon, ca. 1920-ca. 1939; C. M. Book Agency, Caernarfon, ca. 1940-. ISSUE DATES: 1869 - 1919(2,189 available issues) View Full Details Metadata Title Information Non Sort Y Title goleuad Subtitle newyddiadur wythnosol at wasanaeth crefydd, llenyddiaeth, gwleidyddiaeth, a moesau Name: Personal Name Part Roberts, John Name Part: Terms of Address Ieuan Gwyllt Name Part: Date 1822-1877 Role Role Term: Text editor. Name: Personal Name Part Davies, John Name Part: Terms of Address Gwyneddon Name Part: Date 1832-1904 Role Role Term: Text editor Type of Resource text Genre (marcgt) newspaper Genre () Welsh newspapers-Wales, North. Genre () Welsh newspapers-Wales, South. Genre () Welsh newspapers-Wales, West. Genre () Welsh newspapers-Wales, Mid. Origin Information Place Place Term: Code (MARC Country Code) wlk Place Place Term: Text Caernarfon Publisher John Davies Date Issued 1869-1990 Date Created: Start (encoding="marc") 1869 Date Created: End (encoding="marc") 1990 Frequency Wythnosol = Weekly Language Language Term: Code (ISO639-2B) wel Physical Description Form (marcform) print Extent v. : ill. ; 37 cm. Abstract (lang="cy") Papur newydd y Methodistiaid Calfinaidd, a gefnogai'r blaid ryddfrydol. Sefydlwyd ym 1869 fel menter breifat, ond fe'i prynwyd gan y Cyfundeb yn 1911. Adlewyrchai ddiddordebau'r enwad a newyddion yn ymwneud â'r Cyfundeb. Ymdrechai hefyd i hyrwyddo dirwest a chreu barn radicalaidd ymhlith y Methodistiaid Calfinaidd. Ei olygydd cyntaf oedd John Davies (Gwyneddon, 1832-1904) ac fe'i olynwyd gan John Roberts (Ieuan Gwyllt, 1822-1877) ac eraill. Cylchredwyd y papur trwy Gymru gyfan ac hefyd i'r Cymry yn Lerpwl, Manceinion, Llundain a Bryste. Abstract (lang="en") A weekly Welsh language newspaper, supportive of liberal politics and which circulated for the Welsh Calvinistic Methodists throughout Wales, including the Welsh of Liverpool, Manchester, London and Bristol. The newspaper's main content reflected the denominational interests and news relating to the Union, while also advocating temperance and radicalism. Established in 1869 as a private venture, it was then subsequently bought by the Union in 1911. Amongst its editors were John Davies (Gwyneddon, 1832-1904) and John Roberts (Ieuan Gwyllt, 1822-1877). Note: date/sequential designation Dechreuodd gyda rhifyn ar gyfer = Began with issue for: Cyf. I, rhif. 1 (30 Hyd. 1869). Gorffennodd gyda rhifyn ar gyfer = Ended with issue for: Cyf. CXVIII, rhif. 51/52 (21 a 28 Rhag. 1990). Note Seiliwyd y disgrifiad ar y rhifyn ar gyfer = Description based on issue for: Cyf. I, rhif. 1 (30 Hyd. 1869). Note Is-deitl yn amrywio = Subtitle varies. Note: issuing body note (lang="cy") Cyhoeddwyd gan John Davies (1869-ca.1894); E. E. Evans, Dolgellau (ca.1895-ca.1919); Welsh National Press Co. Ltd, Caernarfon (ca.1920-ca.1939); C. M. Book Agency, Caernarfon (ca.1940-). Note: issuing body note (lang="en") Published by John Davies, 1869-ca. 1894; E. E. Evans, Dolgellau, ca. 1895-ca. 1919; Welsh National Press Co. Ltd, Caernarfo