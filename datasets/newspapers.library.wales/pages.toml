full_description = '''Home About Advanced Search New Search Help Search History Please review your cookie consent and accept 'Search History' to enable search logging Welsh Newspapers Search 15 million Welsh newspaper articles Y Gwyliedydd A weekly Welsh language newspaper, published by the Wesleyan Church and which circulated in North and South Wales, together with the main cities of England. The newspaper's main content included local news and amongst the newspaper's founders was William Hugh Evans (Gwyllt y Mynydd, 1831-1909), who also edited the paper for 13 years; other notable editors included John Hughes (Glanystwyth, 1842-1902) and John Jones (Vulcan, 1825-1889). Associated titles: Gwyliedydd newydd (1910-1977). COPYRIGHT: UNKNOWN FREQUENCY: Weekly PUBLISHER: Published in Rhyl by Amos Brothers. ISSUE DATES: 1877 - 1908(1,661 available issues) View Full Details Metadata Title Information Non Sort Y Title gwyliedydd Subtitle newyddiadur ac adolygydd wythnosol Title Information: uniform Title Y gwyliedydd (Rhyl) Name: Personal Name Part Evans, William Hugh Name Part: Terms of Address Gwyllt y Mynydd Name Part: Date 1831-1909 Role Role Term: Text editor. Name: Personal Name Part Hughes, John Name Part: Date 1842-1902 Role Role Term: Text editor. Name: Personal Name Part Jones, John Name Part: Date 1825-1889 Role Role Term: Text editor. Type of Resource text Genre (marcgt) newspaper Genre () Welsh newspapers-Wales, North. Genre () Welsh newspapers-Wales, South. Origin Information Place Place Term: Code (MARC Country Code) wlk Place Place Term: Text Rhyl Publisher Amos Brothers Date Issued 1877-1909 Date Created: Start (encoding="marc") 1877 Date Created: End (encoding="marc") 1909 Frequency Weekly Language Language Term: Code (ISO639-2B) wel Physical Description Form (marcform) print Extent v. : ill. ; 44 cm. Abstract (lang="cy") Papur newydd wythnosol Cymraeg ei iaith a gyhoeddwyd gan y Wesleaid. Cylchredwyd yng Ngogledd a De Cymru a phrif drefi Lloegr. Cyflwynai safbwynt yr enwad ynghyd a newyddion lleol. Un a fu'n rhan o'i sefydlu oedd William Hugh Evans (Gwyllt y Mynydd, 1831-1909), bu'n olygydd hefyd am 13 mlynedd. Ymhlith golygyddion eraill y papur oedd John Hughes (Glanystwyth, 1842-1902) a John Jones (Vulcan, 1825-1889). Teitlau cysylltiol: Gwyliedydd newydd (1910-1977). Abstract (lang="en") A weekly Welsh language newspaper, published by the Wesleyan Church and which circulated in North and South Wales, together with the main cities of England. The newspaper's main content included local news and amongst the newspaper's founders was William Hugh Evans (Gwyllt y Mynydd, 1831-1909), who also edited the paper for 13 years; other notable editors included John Hughes (Glanystwyth, 1842-1902) and John Jones (Vulcan, 1825-1889). Associated titles: Gwyliedydd newydd (1910-1977). Note: date/sequential designation Dechreuodd gyda rhifyn ar gyfer = Began with issue for: Rhif. 1, cyf. 1 (2 Maw. 1877). Gorffennodd gyda rhifyn ar gyfer = Ended with issue for: 9 Medi 1909. Note Disgrifiad yn seiliedig ar rhifyn ar gyfer = Description based on issue for: Rhif. 1, cyf. 1 (2 Maw. 1877). Note: issuing body note (lang="cy") Cyhoeddwyd yn y Rhyl gan Amos Brothers. Note: issuing body note (lang="en") Published in Rhyl by Amos Brothers. Note Parhau yn 1910 fel = Continues in 1910 by: Gwyliedydd newydd ac adolygydd wythnosol. Subject (LCSH) Geographic Wales Genre Newspapers Temporal 19th century Related Item: succeeding Title Information Title Gwyliedydd newydd Identifier: Local (WlAbNL)004566044 Record Information descriptionStandard aacr2 Record Content Source (marcorg) WlAbNL Record Creation Date (encoding="marc") 081020 Record Change Date (encoding="iso8601") 20121004151300.0 Record Identifier (source="WlAbNL") vtls004578744 Origin of Record Converted from MARCXML to MODS version 3.3 using MARC21slim2MODS3-3.xsl (Revision 1.54) languageOfCataloging Language Term: Code (ISO639-2B) eng View All Available Issues Select a year between 187