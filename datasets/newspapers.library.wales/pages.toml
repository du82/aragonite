full_description = '''Home About Advanced Search New Search Help Search History Please review your cookie consent and accept 'Search History' to enable search logging Welsh Newspapers Search 15 million Welsh newspaper articles The Cambrian News and Merionethshire Standard A weekly newspaper published mainly in English, circulating around the districts of North and Mid Wales. The newspaper's main content included local and general news, advertisements, sports and leisure reports. It also included several Welsh articles. Amongst the newspaper's editors were Sir John Gibson (1841-1915) and Dewi Morgan (Dewi Teifi, 1877-1971). At its peak the weekly circulation reached over 25,000. It is currently owned by the Cambrian News Ltd. Associated titles: Merionethshire Standard and Mid-Wales Herald (1864-1868). COPYRIGHT: COPYRIGHTED FREQUENCY: Weekly PUBLISHER: Published in Aberystwyth by J. J. Gibson (ca. 1895-); Cambrian News (Aberystwyth) Ltd. (ca. 1920-) and printed in Bala by John Askew Roberts, Edward Woodall & Richard Henry Venables (1896-). ISSUE DATES: 1869 - 1919(3,274 available issues) View Full Details Metadata Title Information Non Sort The Title Cambrian news and Merionethshire standard Name: Personal Name Part Gibson, John Name Part: Date 1841-1915 Role Role Term: Text editor. Name: Personal Name Part Morgan, Dewi Name Part: Date 1877-1971 Role Role Term: Text editor. Type of Resource text Genre (marcgt) newspaper Genre () English newspapers-Wales, Mid. Genre () English newspapers-Wales, North. Origin Information Place Place Term: Code (MARC Country Code) wlk Place Place Term: Text Bala Publisher John Askew Roberts, Edward Woodall & Richard Henry Venables Date Issued 1869- Date Created: Start (encoding="marc") 1869 Date Created: End (encoding="marc") 9999 Frequency Weekly Language Language Term: Code (ISO639-2B) eng Physical Description Form (marcform) print Extent v. : ill. ; 60 cm. Abstract (lang="en") A weekly newspaper published mainly in English, circulating around the districts of North and Mid Wales. The newspaper's main content included local and general news, advertisements, sports and leisure reports. It also included several Welsh articles. Amongst the newspaper's editors were Sir John Gibson (1841-1915) and Dewi Morgan (Dewi Teifi, 1877-1971). At its peak the weekly circulation reached over 25,000. It is currently owned by the Cambrian News Ltd. Associated titles: Merionethshire Standard and Mid-Wales Herald (1864-1868). Abstract (lang="cy") Papur newydd wythnosol a gyhoeddwyd yn Saesneg yn bennaf. Cylchredwyd yng Nghanolbarth a Gogledd Cymru. Cofnodai newyddion lleol a chyffredinol, hysbysebion, chwaraeon ac erthyglau Cymraeg. Ymhlith ei olygyddion bu Syr John Gibson (1841-1915) a Dewi Morgan (Dewi Teifi, 1877-1971). Yn ystod ei anterth bu iddo gylchrediad wythnosol o dros 25,000 o gopïau. Bellach fe'i perchnogir gan y Cambrian News Ltd. Teitlau cysylltiol: Merionethshire Standard and Mid-Wales Herald (1864-1868). Note: date/sequential designation Began with: No. 384 (9 Jan. 1869). Note Description based on: No. 384 (9 Jan. 1869). Note: issuing body note (lang="en") Published in Aberystwyth by J. J. Gibson (ca. 1895-); Cambrian News (Aberystwyth) Ltd. (ca. 1920-) and printed in Bala by John Askew Roberts, Edward Woodall & Richard Henry Venables (1896-). Note: issuing body note (lang="cy") Cyhoeddwyd yn Aberystwyth gan J. J. Gibson (ca.1895-); Cambrian News (Aberystwyth) Ltd. (ca.1920-), ac fe'i argraffwyd yn y Bala gan John Askew Roberts, Edward Woodall & Richard Henry Venables (1896-). Subject (LCSH) Geographic Cardiganshire (Wales) Genre Newspapers Temporal 19th century Subject (LCSH) Geographic Merioneth (Wales) Genre Newspapers Temporal 19th century Subject (LCSH) Geographic Wales, Mid Genre Newspapers Subject (LCSH) Geographic Wales, North Genre Newspapers Related Item: preceding Title Information Title Merionethshire standard and mid-Wales herald Identifier: Local (WlAbNL)006012816 Record Information de