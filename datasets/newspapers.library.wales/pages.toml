title = "Welsh Newspapers             - Browse"
full_description = '''Home About Advanced Search New Search Help Search History Please review your cookie consent and accept 'Search History' to enable search logging Welsh Newspapers Search 15 million Welsh newspaper articles Y Gwladgarwr A weekly Welsh language newspaper, supportive of liberal politics and the causes of the working classes which circulated in South Wales. David Williams (Alaw Goch, 1809-1863), Abraham Mason and William Williams (Carw Coch, 1808-1872) founded the newspaper and amongst the editors were Lewis William Lewis (Llew Llwyfo, 1831-1901) and John Roberts (Ieuan Gwyllt, 1822-1877). Walter Lloyd (1822-1883) became the newspaper's proprietor in November 1859. The newspaper was chiefly devoted to Welsh literature and gave a chance for the poets and authors of the valleys and South Wales, to publish their works. Amongst the newspaper's poetry editors were William Williams (Caledfryn, 1801-1869) and William Thomas (Islwyn, 1832-1878). COPYRIGHT: UNKNOWN FREQUENCY: Wythnosol = Weekly PUBLISHER: Published in Aberdare by Abraham Mason. ISSUE DATES: 1858 - 1884(1,266 available issues) View Full Details Metadata Title Information Non Sort Y Title gwladgarwr Subtitle cofnodydd llenyddiaeth, celfyddyd, gwyddoniaeth, gwleidyddiaeth, a hanesyddiaeth cyffredinol Name: Personal Name Part Lewis, Lewis William Name Part: Terms of Address Llew Llwyfo Name Part: Date 1831-1901 Role Role Term: Text editor. Name: Personal Name Part Roberts, John Name Part: Terms of Address Ieuan Gwyllt Name Part: Date 1822-1877 Role Role Term: Text editor. Name: Personal Name Part Caledfryn Name Part: Date 1801-1869 Role Role Term: Text editor. Name: Personal Name Part Islwyn Name Part: Date 1832-1878 Role Role Term: Text editor. Name: Personal Name Part Lloyd, Walter Name Part: Date 1822-1883 Role Role Term: Text publisher. Type of Resource text Genre (marcgt) newspaper Genre () Welsh newspapers-Wales, South. Origin Information Place Place Term: Code (MARC Country Code) wlk Place Place Term: Text Aberdare Publisher Abraham Mason Date Issued 1858-1884 Date Created: Start (encoding="marc") 1858 Date Created: End (encoding="marc") 1884 Frequency Wythnosol = Weekly Language Language Term: Code (ISO639-2B) wel Physical Description Form (marcform) print Extent v. ; 38 cm. Abstract (lang="cy") Papur newydd wythnosol â chylchrediad eang yng nghymoedd diwydiannol De Cymru. Yr oedd iddo dueddiadau rhyddfrydol, a phleidiau achos y gweithwyr ac ymneilltuaeth. Ond fe ddaeth i'r bri yn bennaf fel papur llenyddol, a rhoddodd gyfle i feirdd a llenorion cymoedd y De gyhoeddi eu cyfansoddiadau. Bu'r golofn farddol dan olygiaeth William Williams (Caledfryn, 1801-1869), William Thomas (Islwyn, 1832-1878) ac eraill. Daeth Walter Lloyd (1822-1883) yn berchennog ar y papur ym mis Tachwedd 1859. Fe'i sefydlwyd gan rhai o wŷr amlycaf Aberdâr, yn eu plith David Williams (Alaw Goch, 1809-1863), Abraham Mason a William Williams (Carw Coch, 1808-1872). Ymhlith golygyddion y papur oedd Lewis William Lewis (Llew Llwyfo, 1831-1901) a John Roberts (Ieuan Gwyllt, 1822-1877). Abstract (lang="en") A weekly Welsh language newspaper, supportive of liberal politics and the causes of the working classes which circulated in South Wales. David Williams (Alaw Goch, 1809-1863), Abraham Mason and William Williams (Carw Coch, 1808-1872) founded the newspaper and amongst the editors were Lewis William Lewis (Llew Llwyfo, 1831-1901) and John Roberts (Ieuan Gwyllt, 1822-1877). Walter Lloyd (1822-1883) became the newspaper's proprietor in November 1859. The newspaper was chiefly devoted to Welsh literature and gave a chance for the poets and authors of the valleys and South Wales, to publish their works. Amongst the newspaper's poetry editors were William Williams (Caledfryn, 1801-1869) and William Thomas (Islwyn, 1832-1878). Note: date/sequential designation Dechreuodd gyda rhifyn ar gyfer = Began with issue for: Rhif. 1 (15 Mai 1858). Gorffennodd gyda rhifyn ar gyfer = Ended with issue 