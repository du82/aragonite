description = "Developers New Star Games, the BAFTA award-winning studio behind hit games like New Star Soccer, Retro Goal and Retro Bowl are pleased to announce a new FREE game mode for their retro styled arcade racer, New Star GP.Introducing an entirely new game mode focused on setting the fastest time on one lap of any track in the game. Outpace your opponents’ ghost-cars and claim your place on the leaderboards! This FREE update is now available for PC Steam and will be coming to the console versions very"
full_description = "05 JUN 2024: NEW STAR GP ADDS HOT LAP MODEDevelopers New Star Games, the BAFTA award-winning studio behind hit games like New Star Soccer, Retro Goal and Retro Bowl are pleased to announce a new FREE game mode for their retro styled arcade racer, New Star GP.Introducing an entirely new game mode focused on setting the fastest time on one lap of any track in the game. Outpace your opponents’ ghost-cars and claim your place on the leaderboards! This FREE update is now available for PC Steam and will be coming to the console versions very soon.New Star GP is a fast and exciting arcade motorsport game with stunning retro visuals. Like all New Star Games’ titles, New Star GP is simple to play at heart, but contains a surprising amount of depth and details that reward players with an experience like no other game they’ve played. In addition to the new Hot Lap game mode. The game has 176 unique events to play, including time trials, checkpoint races, reverse races, rival races, elimination events, and GP styled races! Compete against 45 unique drivers across the decades of racing, each with their own personalities and driving styles. Race on 17 gorgeous track locations around the world, all with unique playing styles, weather conditions and track abrasion values, providing a varied racing experience that requires different race strategies to maximise the chances of success.New Star GP also boasts 17 unique championship competitions set across the tracks from the career mode that can be enjoyed either in single player, or with up to 4 players. Each has a unique roster of tracks and game settings. The game also has a creation mode that allows players to create their own, bespoke championship competitions. Set the number of laps, weather, track configuration, difficulty, race speed, and a host of other options. Custom competitions can be raced in single or multiplayer with up to 4 players. With a 96% positive review rating on Steam and excellent reviews across all platforms, now is the perfect time to join the ever growing community of players who appreciate a truly unique racing experience. Additionally, until the 16th June, Steam customers can take advantage of a 40% reduction in price.New Star GP has been developed by New Star Games and published by Five Aces Publishing."
