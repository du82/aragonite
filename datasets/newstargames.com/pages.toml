full_description = "24 JAN 2019: NEW STAR MANAGER ON SWITCHWelcome to New Star Manager - the immersive sports management game from Simon Read, creator of the BAFTA Award-winning New Star Soccer series. Developers New Star Games are pleased to announce today that New Star Manager is on its way to the Nintendo Switch on the 31st of January. Already highly acclaimed on Steam, iOS and Android and with over 1.5 million downloads, Pocket Gamer awarded New Star Manager its highly-coveted Platinum Award, saying “New Star Manager takes the frame of the original game, and builds something utterly wonderful on top of it.”The Switch launch also marks a very special day in the history of New Star Games; this is what Simon Read, creator and owner of New Star Games had to say: - “This is a momentous occasion for myself and New Star Games – our first console title! I am particularly excited about giving Switch owners the chance to play New Star Manager using a system that can effortlessly switch from touch screen to controller. Our team have done an amazing job in making the controls feel slick and intuitive and I can’t wait to see the response.” Welcome to New Star Manager - the immersive sports management game from Simon Read, creator of the BAFTA Award-winning New Star Soccer series. Developers New Star Games are pleased to announce today that New Star Manager is on its way to the Nintendo Switch on the 31st of January. Already highly acclaimed on Steam, iOS and Android and with over 1.5 million downloads, Pocket Gamer awarded New Star Manager its highly-coveted Platinum Award, saying “New Star Manager takes the frame of the original game, and builds something utterly wonderful on top of it.”The Switch launch also marks a very special day in the history of New Star Games; this is what Simon Read, creator and owner of New Star Games had to say: - “This is a momentous occasion for myself and New Star Games – our first console title! I am particularly excited about giving Switch owners the chance to play New Star Manager using a system that can effortlessly switch from touch screen to controller. Our team have done an amazing job in making the controls feel slick and intuitive and I can’t wait to see the response.”"
