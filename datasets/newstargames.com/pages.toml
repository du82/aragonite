["https://www.newstargames.com/news/page/12"]
title = "NEWS | newstargames.com | Page 12 of 12"
description = "01 FEB 2019: NEW STAR MANAGER SWITCH RELEASEDevelopers New Star Games announced today that New Star Manager, the latest instalment of the BAFTA award-winning New Star series, kicks off today on the Nintendo Switch priced at £14.99 / €16.99 / $19.99. New Star Manager is a pure soccer management simulation, allowing fans to be much more than just a player. Responsible for the day-to-day running of the underperforming New Star FC, fans must take full ownership of every aspect of the club, from constructing vital club facilities, managing players’ training regimes and sponsorship deals, to hiring and firing the backroom staff. Managers are also responsible for keeping players’ heads in the game by monitoring their concerns, outbursts, and quirks. Not to mention the constant battle of managing club finances, keeping the board and the fans on side and navigating the hostile waters of the sporting press.Already highly acclaimed on Steam, iOS and Android and with over 1.5 million downloads, Pocket Gamer awarded New Star Manager its highly-coveted Platinum Award, saying “New Star Manager takes the frame of the original game, and builds something utterly wonderful on top of it.”The Switch release is the first console title for both New Star Games and publisher Five Aces. Martyn Brown, managing director of Five Aces Publishing said, “We’re absolutely delighted to make our debut on Nintendo Switch with New Star Manager, we hope console players enjoy the game amid further critical acclaim.”"
