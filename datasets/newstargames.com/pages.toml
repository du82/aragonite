full_description = '''RETRO GOALRETRO GOALDOWNLOAD NOWRetro Goal is a fast and exciting mix of arcade soccer action and simple team management, from the developers of hit sports games New Star Soccer and Retro Bowl. With graphics inspired by the most beloved football games of 16-bit era and the accuracy of modern touchscreen controls, you'll be slotting away goal after goal with pixel-perfect precision. Choose a team from the world's favourite leagues and recruit the superstars, professionals and hotheads who will lead you to victory - then take full control on the pitch and make every touch count! ​ SOME REVIEWS: ​ "Retro Goal is a distinctively light and fun take on football, coming at a budget price and having enough depth and charm to get players hooked. It has a stylish look and will raise a smile among enthusiasts... it is excellent and irreverent fun that feels at home on the Switch." - NINTENDO LIFE ​ "Retro Goal, despite its simplistic design and gameplay, left me enamored of its sheer quality. It's easily the most fun I've had on my Nintendo Switch since finishing Bayonetta 3, and that's saying a lot. As someone who has little to no knowledge of soccer, aprt from its basic rules, I was pleasantly surprised by how good the gameplay felt and how easily I got addicted to it." - SPORTSKEEDA ​ "Retro Goal falls into a very satisfying middle ground between arcade soccer action and light management sim. Impressively, it also has a finely-tuned difficulty curve that you can ease by paying if you'd like, but provides a healthy and fair challenge if you don't. Most importantly, it feels like a sports game without trying to be too realistic or granular. Retro Goal is now my go-to mobile sports game, and I'm not sure there's any good reason why it shouldn't be yours, either." - 148APPSDOWNLOAD NOWLIKE THE GAME? BUY THE MERCH!From the official New Star Games shop on Redbubble!'''
