D ANDROID UPDATES COMING SOON FOR "RETRO BOWL" & "NEW STAR SOCCER" UPDATE ON STEAM FOR "NEW STAR GP" UPDATE NOW LIVE FOR "RETRO BOWL COLLEGE" "RETRO SLAM TENNIS" ARRIVES FOR iOS AND ANDROID UPDATES COMING SOON FOR "RETRO BOWL" & "NEW STAR SOCCER" UPDATE ON STEAM FOR "NEW STAR GP" UPDATE NOW LIVE FOR "RETRO BOWL COLLEGE" "RETRO SLAM TENNIS" ARRIVES FOR iOS AND ANDROID UPDATES COMING SOON FOR "RETRO BOWL" & "NEW STAR SOCCER" UPDATE ON STEAM FOR "NEW STAR GP" UPDATE NOW LIVE FOR "RETRO BOWL COLLEGE" "RETRO SLAM TENNIS" ARRIVES FOR iOS AND ANDROID UPDATES COMING SOON FOR "RETRO BOWL" & "NEW STAR SOCCER" UPDATE ON STEAM FOR "NEW STAR GP" UPDATE NOW LIVE FOR "RETRO BOWL COLLEGE" "RETRO SLAM TENNIS" ARRIVES FOR iOS AND ANDROID UPDATES COMING SOON FOR "RETRO BOWL" & "NEW STAR SOCCER" UPDATE ON STEAM FOR "NEW STAR GP" UPDATE NOW LIVE FOR "RETRO BOWL COLLEGE" "RETRO SLAM TENNIS" ARRIVES FOR iOS AND ANDROID UPDATES COMING SOON FOR "RETRO BOWL" & "NEW STAR SOCCER" UPDATE ON STEAM FOR "NEW STAR GP" UPDATE NOW LIVE FOR "RETRO BOWL COLLEGE" "RETRO SLAM TENNIS" ARRIVES FOR iOS AND ANDROID UPDATES COMING SOON FOR "RETRO BOWL" & "NEW STAR SOCCER" UPDATE ON STEAM FOR "NEW STAR GP" UPDATE NOW LIVE FOR "RETRO BOWL COLLEGE" PlayHEY THERE!We’re New Star Games, a small but experienced development team with a track record of high-quality titles across many platforms over many years. We’ve had a string of successes on mobile and Switch with the New Star and Retro games, and the sensational Retro Bowl being the #1 app on the US App Store. Our team boasts the super-talented Simon Read, the man behind the original New Star Soccer, and a collection of industry veterans who’ve worked at major studios on titles such as the Worms series (Team17), Lemmings (Team17), Call of Duty: Strike Team (Activision), Red Dead Redemption (Rockstar), and the Grand Theft Auto series (Rockstar). We mostly develop retro sports-RPG games in which fun, simplicity, and surprising depth is the focus.OUR GAMESLATEST NEWS25 Feb 2025: Developers New Star Games, the BAFTA award-winning studio behind hit games like New Star Soccer, Retro Goal and Retro Bowl are pleased to announce that their new retro-styled Tennis game, Retro Slam Tennis, is now available to download for FREE on mobile devices. ​ Get ready to be the next tennis sensation! Work your way up the ranks and strive to be the world's best player. Compete on hard, clay and grass courts, hire coaches and complete their challenges, manage relationships with friends and family, acquire sponsors, buy luxury items, buy equipment, chug a can of NRG (or two) and oh - don't forget about your social media followers! Retro Slam Tennis is a full-on role-playing experience where if you work hard and hone your skills then you can be the "new star" in world tennis! Watch the Retro Slam Tennis trailer here: - https://youtube.com/shorts/aJtTh0iq7dQ Simon Read, founder of New Star Games, had this to say about the game. “I have been wanting to make a tennis game for many years, using a similar approach to that of New Star Soccer with both the gameplay mechanic and the tongue-in-cheek simulation of a player career. Now it's finally here I can't wait to see how players take to it.” ​16 Jan 2025: Ever fancied a New Star Games T-shirt? Perhaps you’d like a New Star GP phone case? Well if that’s the case, we’ve got you covered! We’ve recently set up a shop on Redbubble and have been working on some designs for anyone who’d like some New Star Games themed clothing or accessories. If you’d like to take a look, click below: ​ ​LIKE OUR GAMES? BUY OUR MERCH!From the official New Star Games shop on Redbubble!SEE MOREPLAYER OPINIONIn summary, New Star GP is more than just a game; it is a comprehensive racing adventure that cleverly connects the thrill of arcade races with the depth of a simulation. The career mode, the strategic racing mechanics and the captivating driver dynamics make it an outstanding title. Whether you are a veteran of racing games or a novice who wants to experience the thrill of a race...NEW STAR GP OFFERS AN EXPERIENCE YOU CAN'T PUT DOWN.- INSIDE XBOXOUR GAMESNFL RETRO BOWL '25NFL RETRO BOWL '25SEE MORERETRO SLAM TENNISRETRO SLAM TENNISSEE MORERETRO BOWLRETRO BOWL SEE MORENEW STAR GPNEW STAR GPSEE MORERETRO BOWL COLLEGERETRO BOWL COLLEGESEE MORENEW STAR MANAGERNEW STAR MANAGERSEE MORERETRO GOALRETRO GOALSEE MORENEW STAR SOCCERNEW STAR SOCCERSEE MORENEW STAR CRICKETNEW STAR CRICKETSEE MORENEW STAR BASEBALLNEW STAR BASEBALLSEE MORELIKE OUR GAMES? BUY OUR MERCH!From the official New Star Games shop on Redbubble!CONTACTIf you are experiencing a problem with one of our games, please contact us on: support@newstargames.com ​ If you are press or media and would like to review our products, please contact us on: pr@newstargames.com ​ If you have a business enquiry, please contact us on: paul@fiveaces.uk ​ If you have a game concept that you'd like us to look at, please contact us on: concepts@fiveaces.uk'''
