full_description = "09 FEB 2023: EXHIBITION MODE FOR RETRO BOWLDeveloper New Star Games, the BAFTA award-winning studio, are pleased to announce that their smash-hit retro styled American football game, Retro Bowl, now has a brand new Exhibition mode ready for this weekend’s Super Bowl action and it’s FREE for all mobile players. This feature will also be coming to the Nintendo Switch version soon. The new mode allows for a one-off special game, where you can play against the AI or you can play against another player using pass n’ play. Finally, an opportunity to prove among friends and family who the greatest Retro Bowl player really is. Bragging rights unlocked! With more than 17 million downloads on mobile and over 50 million gameplay sessions on Poki and Kongregate, Retro Bowl continues to be incredibly popular and as the real life Super Bowl approaches, now is the perfect time for the armchair quarterback to finally prove a point. Presented in a glorious retro style, the game has simple roster management, including press duties and the handling of fragile egos, while on the field you get to call the shots. Can you pass the grade and take your team all the way to the ultimate prize? Can you win the Retro Bowl? Developer New Star Games, the BAFTA award-winning studio, are pleased to announce that their smash-hit retro styled American football game, Retro Bowl, now has a brand new Exhibition mode ready for this weekend’s Super Bowl action and it’s FREE for all mobile players. This feature will also be coming to the Nintendo Switch version soon. The new mode allows for a one-off special game, where you can play against the AI or you can play against another player using pass n’ play. Finally, an opportunity to prove among friends and family who the greatest Retro Bowl player really is. Bragging rights unlocked! With more than 17 million downloads on mobile and over 50 million gameplay sessions on Poki and Kongregate, Retro Bowl continues to be incredibly popular and as the real life Super Bowl approaches, now is the perfect time for the armchair quarterback to finally prove a point. Presented in a glorious retro style, the game has simple roster management, including press duties and the handling of fragile egos, while on the field you get to call the shots. Can you pass the grade and take your team all the way to the ultimate prize? Can you win the Retro Bowl?"
