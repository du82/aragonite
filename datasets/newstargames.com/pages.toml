full_description = "24 JUN 2021: RETRO GOAL OUT NOWDevelopers New Star Games announced today that Retro Goal, the latest game from the BAFTA award-winning studio has launched on iOS devices with the Android version to follow soon after.Retro Goal is a fast and exciting mix of arcade soccer action and simple team management, from the developers of hit sports games New Star Soccer and Retro Bowl. Play the first 10 matches for free before unlocking the rest of the game to shoot for glory!With graphics inspired by the most beloved football games of 16-bit era and the accuracy of modern touchscreen controls, you'll be slotting away goal after goal with pixel-perfect precision. Choose a team from the world's favourite leagues and recruit the superstars, professionals and hotheads who will lead you to victory - then take full control on the pitch and make every touch count!Simon Read, founder of New Star Games had this to say about the new game. “Retro Goal is our love letter to 16-bit football, an effort to capture the gorgeous look of 90s videogames whilst bringing the gameplay up to date for modern devices. I am so pleased with how the game has turned out and now I can't wait for players to get their hands on it.”Download for FREE from iTunes: https://apps.apple.com/app/retro-goal/id1535765855 Developers New Star Games announced today that Retro Goal, the latest game from the BAFTA award-winning studio has launched on iOS devices with the Android version to follow soon after.Retro Goal is a fast and exciting mix of arcade soccer action and simple team management, from the developers of hit sports games New Star Soccer and Retro Bowl. Play the first 10 matches for free before unlocking the rest of the game to shoot for glory!With graphics inspired by the most beloved football games of 16-bit era and the accuracy of modern touchscreen controls, you'll be slotting away goal after goal with pixel-perfect precision. Choose a team from the world's favourite leagues and recruit the superstars, professionals and hotheads who will lead you to victory - then take full control on the pitch and make every touch count!Simon Read, founder of New Star Games had this to say about the new game. “Retro Goal is our love letter to 16-bit football, an effort to capture the gorgeous look of 90s videogames whilst bringing the gameplay up to date for modern devices. I am so pleased with how the game has turned out and now I can't wait for players to get their hands on it.”Download for FREE from iTunes: https://apps.apple.com/app/retro-goal/id1535765855"
