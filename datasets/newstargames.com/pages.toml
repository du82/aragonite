["https://www.newstargames.com/news/page/2"]
title = "NEWS | newstargames.com | Page 2 of 12"
description = "16 JAN 2025: MARTYN BROWNWe are deeply saddened by the news of the passing of Martyn Brown, co-founder of Five Aces Publishing and a good friend of everyone here at New Star Games. Martyn helped support independent games and game makers with his generosity, humour and games knowledge. He played a key part in our growth and success as a company and we will be eternally grateful for the work he did with us. He was passionate about games and the games industry and always had time to help. His sense of fun made him a truly unique and wonderful man and we will all miss him greatly. Martyn passed away peacefully in his sleep surrounded by family, following a prolonged battle with a series of strokes. He will be much missed by us, his family, and his many games industry friends. Our thoughts are with his family at this difficult time."
full_description = "16 JAN 2025: MARTYN BROWNWe are deeply saddened by the news of the passing of Martyn Brown, co-founder of Five Aces Publishing and a good friend of everyone here at New Star Games. Martyn helped support independent games and game makers with his generosity, humour and games knowledge. He played a key part in our growth and success as a company and we will be eternally grateful for the work he did with us. He was passionate about games and the games industry and always had time to help. His sense of fun made him a truly unique and wonderful man and we will all miss him greatly. Martyn passed away peacefully in his sleep surrounded by family, following a prolonged battle with a series of strokes. He will be much missed by us, his family, and his many games industry friends. Our thoughts are with his family at this difficult time. We are deeply saddened by the news of the passing of Martyn Brown, co-founder of Five Aces Publishing and a good friend of everyone here at New Star Games. Martyn helped support independent games and game makers with his generosity, humour and games knowledge. He played a key part in our growth and success as a company and we will be eternally grateful for the work he did with us. He was passionate about games and the games industry and always had time to help. His sense of fun made him a truly unique and wonderful man and we will all miss him greatly. Martyn passed away peacefully in his sleep surrounded by family, following a prolonged battle with a series of strokes. He will be much missed by us, his family, and his many games industry friends. Our thoughts are with his family at this difficult time. 09 JAN 2025: BACK TO WORK!What are we working on right now and what can you expect from us over the next few weeks and months?· Retro Slam Tennis global release on mobile devices. Hopefully launching in just a few weeks’ time!· New Star GP updates on console and PC Steam over the next few months.· New Star GP mobile release. If things go to plan it will only be a few weeks before we can launch.· A NEW gameplay feature for Retro Bowl, to be revealed very soon!· The next Retro Bowl College will be an update for problems with route positioning.· Retro Bowl College SIM and Exhibition modes!· NFL Retro Bowl 25 updates leading up to the Super Bowl to add even more players to the game!· Retro Goal and New Star Soccer updates! (specific details to follow soon)Also, keep an eye on our social media accounts for details of a Super Bowl prediction competition.2025 is shaping up to be very busy for us, but our team is committed to not only supporting our existing titles, but also working on new games and features that we think you will enjoy."
