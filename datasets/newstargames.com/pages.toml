description = 'The official spin-off of the smash hit "Retro Bowl" takes you back to the old-school. Make a name for yourself as a winning Head Coach for one of 250 College teams.'
full_description = '''RETRO BOWL COLLEGERETRO BOWL COLLEGEDOWNLOAD NOWThe official spin-off of the smash hit Retro Bowl takes you back to the old-school. If you thought managing a Pro Team was a challenge - you've seen nothing yet! Make a name for yourself as a winning Head Coach for one of 250 College teams. Manage tight budgets and encourage your hot-headed young players to keep their eye on the ball when they're surrounded by the temptations and distractions of College life. Can you tell the difference between the next Pro Football superstar and the party animal who doesn't know when to quit? Can you foster their talents and help them make the Draft? Can you turn your school into the greatest Football College of all time? ​ SOME REVIEWS: ​ "For the true fans of the game, Retro Bowl College offers an unlimited bundle for 99 cents that allows the player even more control of the game. Users unlock the ability to change the uniforms of the teams and the coach, as well as an extra touch of realism added to the game with changing weather and controllable kick returns. I highly recommend the game." - GHS TIMBERLINES ​ "Retro Bowl College is a welcome addition to the series. There’s enough differences between this and the original Retro Bowl to have both on your device. If you’re a fan of football games, Retro Bowl College is definitely worth digging into." - SNAPP ATTACKDOWNLOAD NOWLIKE THE GAME? BUY THE MERCH!From the official shop of @PIXELNFL, the artist behind the unique retro style of RETRO BOWL'''
