title = "20 DEC 2024: HAPPY HOLIDAYS!"
description = "20 Dec 2024: ​Happy Holidays! ​​Today is our last working day in the office for this year and we just wanted to take the time to express our appreciation for everyone who has supported us in 2024. We also want to thank our staff for all the hard work they've put in this year.​We succesfully launched New Star GP on 4 different platforms & NFL Retro Bowl 25 on Apple Arcade, alongside numerous updates for our games & created a brand new website! But 2025 is already looking even busier. What can you"
full_description = "20 DEC 2024: HAPPY HOLIDAYS!20 Dec 2024: ​Happy Holidays! ​​Today is our last working day in the office for this year and we just wanted to take the time to express our appreciation for everyone who has supported us in 2024. We also want to thank our staff for all the hard work they've put in this year.​We succesfully launched New Star GP on 4 different platforms & NFL Retro Bowl 25 on Apple Arcade, alongside numerous updates for our games & created a brand new website! But 2025 is already looking even busier. What can you expect to see from us in the coming weeks and months?​Our next game, Retro Slam Tennis, is shaping up to be released 1st quarter 2025. Have a look at the Retro Slam Tennis page on this website for some gameplay footage. ​We are also pleased to announce that New Star GP will be getting a mobile release, also in the 1st quarter of 2025. We will have footage and more screenshots of the game to show you in January. What about our existing games?​We have a new gameplay feature coming to the original Retro Bowl early next year alongside the much anticipated SIM and Exhibition modes for Retro Bowl College. NFL Retro Bowl will also have more updates as we move towards the Superbowl!We also have updates planned for Retro Goal and a very long overdue update for New Star Soccer and all of that is just in the first few months of next year. We hope everyone is able to enjoy a break at the end of this year and we will see you in 2025!​​​​ 20 Dec 2024: ​Happy Holidays! ​​Today is our last working day in the office for this year and we just wanted to take the time to express our appreciation for everyone who has supported us in 2024. We also want to thank our staff for all the hard work they've put in this year.​We succesfully launched New Star GP on 4 different platforms & NFL Retro Bowl 25 on Apple Arcade, alongside numerous updates for our games & created a brand new website! But 2025 is already looking even busier. What can you expect to see from us in the coming weeks and months?​Our next game, Retro Slam Tennis, is shaping up to be released 1st quarter 2025. Have a look at the Retro Slam Tennis page on this website for some gameplay footage. ​We are also pleased to announce that New Star GP will be getting a mobile release, also in the 1st quarter of 2025. We will have footage and more screenshots of the game to show you in January. What about our existing games?​We have a new gameplay feature coming to the original Retro Bowl early next year alongside the much anticipated SIM and Exhibition modes for Retro Bowl College. NFL Retro Bowl will also have more updates as we move towards the Superbowl!We also have updates planned for Retro Goal and a very long overdue update for New Star Soccer and all of that is just in the first few months of next year. We hope everyone is able to enjoy a break at the end of this year and we will see you in 2025!​​​​"
