["https://www.newstargames.com/post/28-oct-2024-new-star-gp-inducted-to-famitsu-gold-hall-of-fame"]
title = "28 OCT 2024: NEW STAR GP INDUCTED TO FAMITSU GOLD HALL OF FAME"
description = "28th Oct, 2024: New Star GP, published in Japan as GP Club Life by Rainy Frog, has been inducted into the Famitsu Weekly Gold Hall of Fame. In reviewing the game, the magazine said: “Rather than pursuing the ultimate simulation, the game is designed to be fun, with the focus on boosting and the exhilaration of overtaking opponents. There are multiple camera options, including a birds-eye view, and the feel of the game is reminiscent of old-school retro racing games. The game UI is easy to unders"
full_description = "28 OCT 2024: NEW STAR GP INDUCTED TO FAMITSU GOLD HALL OF FAME28th Oct, 2024: New Star GP, published in Japan as GP Club Life by Rainy Frog, has been inducted into the Famitsu Weekly Gold Hall of Fame. In reviewing the game, the magazine said: “Rather than pursuing the ultimate simulation, the game is designed to be fun, with the focus on boosting and the exhilaration of overtaking opponents. There are multiple camera options, including a birds-eye view, and the feel of the game is reminiscent of old-school retro racing games. The game UI is easy to understand, while the campaign features car tuning, pit stops, and interactions with your staff. It’s an experience that can be enjoyed by players with a wide range of abilities, and the game’s depth and price are great considering the amount of content.” New Star GP is available now on Steam, Switch, PlayStation, and Xbox. 28th Oct, 2024: New Star GP, published in Japan as GP Club Life by Rainy Frog, has been inducted into the Famitsu Weekly Gold Hall of Fame. In reviewing the game, the magazine said: “Rather than pursuing the ultimate simulation, the game is designed to be fun, with the focus on boosting and the exhilaration of overtaking opponents. There are multiple camera options, including a birds-eye view, and the feel of the game is reminiscent of old-school retro racing games. The game UI is easy to understand, while the campaign features car tuning, pit stops, and interactions with your staff. It’s an experience that can be enjoyed by players with a wide range of abilities, and the game’s depth and price are great considering the amount of content.” New Star GP is available now on Steam, Switch, PlayStation, and Xbox."
