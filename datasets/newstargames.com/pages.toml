title = "NEW STAR CRICKET | newstargames.com"
description = 'In "New Star Cricket", you are the star of the show, launching your cricket career as a promising young academy player. Build your skills, purchase all the trappings of a professional cricket player and rise to the pinnacle of the sport, playing in competitions all over the world!'
full_description = '''NEW STAR CRICKETNEW STAR CRICKETDOWNLOAD NOWA big welcome from New Star Games as we expand the BAFTA award-winning gameplay of New Star Soccer into a whole new sporting arena! In New Star Cricket, you are the star of the show, launching your cricket career as a promising young academy player. Build your skills, purchase all the trappings of a professional cricket player and rise to the pinnacle of the sport, playing in competitions all over the world! As your career progresses, you must manage your relationships, keeping team-mates, the coach, your partner and your sponsors happy as you face dilemmas and exciting twists along the way. Experience life as a professional cricketer, play for your national team and revel in the authenticity of a mobile cricket title that captures the spirit, skills, excitement and teams from the many cricket leagues around the world! Equally enjoyable as a snack game for a few minutes or an intensive few hours, New Star Cricket will leave you entertained, amused and hungry for more, and it’s entirely free to play without any restriction! What are you waiting for? This huge, detailed cricket universe is yours to own. So get your bat and ball and earn your first contract! KEY FEATURES: - Free to play! Hundreds of hours of entertainment at your fingertips! - Super-addictive, exciting representation of the modern cricket game! - Create your alter ego and bat, bowl, run, catch and throw your way through the leagues to International glory! - Play with amazing high-performance cricket bats from the legendary Gunn & Moore®! - Experience highs and lows, make key decisions and build your celebrity lifestyle! - Hire agents, trainers, learn new skills, develop your talent! - Enjoy the casino, own race-horses and more besides – but don’t forget to keep the boss sweet! ​ SOME REVIEWS: "If you're a cricket nut, then New Star Cricket is an obvious purchase. It's got much of the charm of New Star Soccer, but with more varied, phase-based matchplay." - POCKET GAMER ​ "There are the same challenges on managing the support of fans, the team and the manager, and even the new graphical style from the New Star Soccer update is present. However, this is by no means a bad thing – with different tasks such as batting and catching the ball, and within a sport that will likely appeal to a completely different fanbase, New Star Cricket should be a lot of fun for both hardcore bat-and-ball aficionados and fans of the series in general." - TOUCH ARCADEDOWNLOAD NOWLIKE THE GAME? BUY THE MERCH!From the official New Star Games shop on Redbubble!'''
