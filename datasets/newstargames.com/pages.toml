full_description = '''NEW STAR SOCCERNEW STAR SOCCERDOWNLOAD NOWWelcome to New Star Soccer, “The best football game on mobile and tablets.” (Eurogamer). The soccer game acclaimed and adored by players and the gaming press alike.You are the star of the show as you launch your soccer career as a promising 16 year old in this BAFTA award-winning, App Store #1 sports RPG from New Star Games. Build your skills, lifestyle and ride the roller-coaster of life as you experience every emotion this great sport has to offer! ​ Manage your relationships, keeping team-mates, the coach, your partner and your sponsors happy as you face dilemmas and exciting twists along the way. Risk your earnings in the casino, explore sinister bribes and eventually retire to set a new career game score! Equally enjoyable as a snack game for a few minutes or an intensive few hours, New Star Soccer will leave you entertained, amused and hungry for more, and it’s entirely free to play without any restriction! ​ Instinctive controls, laced with detail, entertainment, mini-games, shocks, surprises and sheer unadulterated joy, New Star Soccer is a delight from start to finish.What are you waiting for? This huge, detailed football universe is yours to own. To the training ground and earn your first contract… ​ KEY FEATURES: - Free to play! Hundreds of hours of entertainment at your fingertips! - Super addictive, exciting simulation of the modern football universe! - Create your alter ego and make your way through the leagues to International glory! - Experience highs and lows, make key decisions and build your celebrity lifestyle! - Hire agents, trainers, learn new skills, develop your talent! - Enjoy the casino, own race-horses and more besides - but don't forget to keep the boss sweet! ​ SOME REVIEWS: ​ "A pristine game. 5/5" - THE SUN ​ “The perfect marriage of quick play phone game, football management, sim and RPG” - KOTAKU ​ “An essential download” - GAME TRAILERS ​ “New Star Soccer is one of the most addictive games ever”. - SUNDAY MIRROR ​ "So engrossing you'll be playing until your phone battery dies. 5/5" - SUNDAY TIMESDOWNLOAD NOWLIKE THE GAME? BUY THE MERCH!From the official New Star Games shop on Redbubble!'''
