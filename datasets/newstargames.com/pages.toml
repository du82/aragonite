["https://www.newstargames.com/post/24-jan-2025-busy-week"]
title = "24 JAN 2025: BUSY WEEK"
description = "This week we have been busy working on multiple games. We are getting close to releasing New Star GP and Retro Slam Tennis on mobile and we also updated NFL Retro Bowl 25 with 30 new players, alongside fixes to salary cap issues and postseason overtime possesion. We also asked for extra Beta testers for Retro Bowl and Retro Bowl College on Android, as we get closer to adding new features to both games. In less than 24 hours we had more than enough applicants, so hopefully in the next week or two"
full_description = "24 JAN 2025: BUSY WEEKThis week we have been busy working on multiple games. We are getting close to releasing New Star GP and Retro Slam Tennis on mobile and we also updated NFL Retro Bowl 25 with 30 new players, alongside fixes to salary cap issues and postseason overtime possesion. We also asked for extra Beta testers for Retro Bowl and Retro Bowl College on Android, as we get closer to adding new features to both games. In less than 24 hours we had more than enough applicants, so hopefully in the next week or two we should have Beta builds going out to our new testers. If you follow Retro Bowl on X, you will also have noticed that we've been doing NFL Playoff predictions, with a high degree of success, but stay tuned next week to learn of details of an exciting Super Bowl competition! This week we have been busy working on multiple games. We are getting close to releasing New Star GP and Retro Slam Tennis on mobile and we also updated NFL Retro Bowl 25 with 30 new players, alongside fixes to salary cap issues and postseason overtime possesion. We also asked for extra Beta testers for Retro Bowl and Retro Bowl College on Android, as we get closer to adding new features to both games. In less than 24 hours we had more than enough applicants, so hopefully in the next week or two we should have Beta builds going out to our new testers. If you follow Retro Bowl on X, you will also have noticed that we've been doing NFL Playoff predictions, with a high degree of success, but stay tuned next week to learn of details of an exciting Super Bowl competition!"
