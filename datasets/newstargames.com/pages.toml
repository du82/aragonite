title = "NEWS | newstargames.com | Page 3 of 12"
description = "13 DEC 2024: THIS WEEK, WE RELEASED UPDATES FOR RETRO BOWL AND NFL RETRO BOWL 25. Retro Bowl (IOS 1.6.12 ANDROID 1.6.13) Kick Returns option (available in Unlimited version) is now saved per career. This should eliminate the crash which could be caused by having two returners selected with 2023 rules.Fix (when starting a new career) for Retro Bowl LIX winners being omitted from the Winners' History.Help message now correct for touchbacks when using 2024 rules.​NFL Retro Bowl 25 (IOS 1.0.10)Here come the Defensive Backs...and here come the Offensive Linemen! Over 190 rostered DBs and over 100 rostered OLs have been added to the team builder at the start of each new career, giving you more Superstar variety than ever before!"
full_description = '''13 DEC 2024: THIS WEEK, WE RELEASED UPDATES FOR RETRO BOWL AND NFL RETRO BOWL 25. Retro Bowl (IOS 1.6.12 ANDROID 1.6.13) Kick Returns option (available in Unlimited version) is now saved per career. This should eliminate the crash which could be caused by having two returners selected with 2023 rules.Fix (when starting a new career) for Retro Bowl LIX winners being omitted from the Winners' History.Help message now correct for touchbacks when using 2024 rules.​NFL Retro Bowl 25 (IOS 1.0.10)Here come the Defensive Backs...and here come the Offensive Linemen! Over 190 rostered DBs and over 100 rostered OLs have been added to the team builder at the start of each new career, giving you more Superstar variety than ever before! Retro Bowl (IOS 1.6.12 ANDROID 1.6.13) Kick Returns option (available in Unlimited version) is now saved per career. This should eliminate the crash which could be caused by having two returners selected with 2023 rules.Fix (when starting a new career) for Retro Bowl LIX winners being omitted from the Winners' History.Help message now correct for touchbacks when using 2024 rules.​NFL Retro Bowl 25 (IOS 1.0.10)Here come the Defensive Backs...and here come the Offensive Linemen! Over 190 rostered DBs and over 100 rostered OLs have been added to the team builder at the start of each new career, giving you more Superstar variety than ever before! 04 DEC 2024: NEW NFL RETRO BOWL 25 UPDATENew NFL Retro Bowl 25 update went live last night. In addition to the points mentioned below, we've added a little something extra to the game for when you win the Super Bowl. Hope you like it.​ New NFL Retro Bowl 25 update went live last night. In addition to the points mentioned below, we've added a little something extra to the game for when you win the Super Bowl. Hope you like it.​ 02 DEC 2024: NEW PRICE FOR NEW STAR GPThere's a new price for New Star GP on Steam & Xbox (UK £9.99), with PlayStation & Switch to follow soon.We are absolutely delighted with all the great reviews & feedback on New Star GP, and we genuinely feel very proud to have made this game but feel like it would be a shame for it to be forever labelled as a "hidden gem".'''
