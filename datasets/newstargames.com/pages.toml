["https://www.newstargames.com/post/02-nov-2022-retro-goal-coming-to-switch"]
title = "02 NOV 2022: RETRO GOAL COMING TO SWITCH"
description = "Developers New Star Games, the BAFTA award-winning studio behind hit games like Retro Bowl and New Star Soccer announced today that Retro Goal, is coming to the Nintendo Switch later this month, just in time for the World Cup. Retro Goal is a fast and exciting mix of arcade soccer action and simple team management.Retro Goal allows you to play it your way. From the Hollywood pass to the hospital ball, an absolute screamer or simple tap-in, will your game day skills match your managerial knowhow?"
full_description = "02 NOV 2022: RETRO GOAL COMING TO SWITCHDevelopers New Star Games, the BAFTA award-winning studio behind hit games like Retro Bowl and New Star Soccer announced today that Retro Goal, is coming to the Nintendo Switch later this month, just in time for the World Cup. Retro Goal is a fast and exciting mix of arcade soccer action and simple team management.Retro Goal allows you to play it your way. From the Hollywood pass to the hospital ball, an absolute screamer or simple tap-in, will your game day skills match your managerial knowhow? Are you a great man manager or will you lose the dressing room? And most importantly will that new striker you’ve just signed be able to perform on a cold, wet, night in Stoke?With graphics inspired by the most beloved football games of the 16-bit era and the accuracy of modern touchscreen and Joy-Con™ controls, you'll be slotting away goal after goal with pixel-perfect precision. Choose one of the 496 playable teams from 24 of the world's favourite leagues and recruit the superstars, professionals and hotheads who will lead you to victory - then take full control on the pitch and make every touch count!Simon Read, founder of New Star Games, had this to say about the game. “Retro Goal is our love letter to 16-bit football, an effort to capture the gorgeous look of 90s videogames whilst bringing the gameplay up to date for modern devices. Seeing our games on Nintendo hardware is always a thrill and Retro Goal plays so nicely on Switch. I can't wait for football fans to get their hands on it!” Developers New Star Games, the BAFTA award-winning studio behind hit games like Retro Bowl and New Star Soccer announced today that Retro Goal, is coming to the Nintendo Switch later this month, just in time for the World Cup. Retro Goal is a fast and exciting mix of arcade soccer action and simple team management.Retro Goal allows you to play it your way. From the Hollywood pass to the hospital ball, an absolute screamer or simple tap-in, will your game day skills match your managerial knowhow? Are you a great man manager or will you lose the dressing room? And most importantly will that new striker you’ve just signed be able to perform on a cold, wet, night in Stoke?With graphics inspired by the most beloved football games of the 16-bit era and the accuracy of modern touchscreen and Joy-Con™ controls, you'll be slotting away goal after goal with pixel-perfect precision. Choose one of the 496 playable teams from 24 of the world's favourite leagues and recruit the superstars, professionals and hotheads who will lead you to victory - then take full control on the pitch and make every touch count!Simon Read, founder of New Star Games, had this to say about the game. “Retro Goal is our love letter to 16-bit football, an effort to capture the gorgeous look of 90s videogames whilst bringing the gameplay up to date for modern devices. Seeing our games on Nintendo hardware is always a thrill and Retro Goal plays so nicely on Switch. I can't wait for football fans to get their hands on it!”"
