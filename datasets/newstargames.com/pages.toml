full_description = "RETRO BOWLRETRO BOWLDOWNLOAD NOWRetro Bowl is the perfect game for the armchair quarterback to finally prove a point. Presented in a glorious retro style, the game has simple roster management, including press duties and the handling of fragile egos, while on the field you get to call the shots. Can you pass the grade and take your team all the way to the ultimate prize? Can you win the Retro Bowl? Released in 2020, Retro Bowl has topped the App Store charts as the #1 TOP FREE APP in the US and gone on to commercial success and critical acclaim, and is currently rated at a mighty 4.8 on the App Store. Here’s a sample of just some of the reviews: SOME REVIEWS: “The best mobile sports game I’ve played. There’s enough in this game to ensure it becomes a part of your daily gaming, but you might want to be careful. I found myself with my head stuck in my phone for over 3 hours the first day I downloaded this game.” - POPCORN BANTER “Joy is a hard thing to quantify. Review percentages for graphics and audio are common, but the indescribable feeling of a game that brightens your day is often overlooked. Retro Bowl is a perfect example of gaming joy.” - THE SIXTH AXIS “Whether you're an American football fan or not, you should definitely try Retro Bowl. The games are quick to complete, making Retro Bowl perfect for on-the-go play. Although it's so enjoyable you might find it tricky to stop at one match.” - POCKET GAMER “Retro Bowl is the best football game this year. It is great game to play while staying inside, waiting for real sports to come back. Turn off the ludicrous H-O-R-S-E challenge, fire up Retro Bowl and lead your team to victory!” - THE RETRO NETWORK ​DOWNLOAD NOWLIKE THE GAME? BUY THE MERCH!From the official shop of @PIXELNFL, the artist behind the unique retro style of RETRO BOWL"
