description = "08 FEB 2023: RETRO GOAL GOES FREE TO PLAYDeveloper New Star Games, the BAFTA award-winning studio behind hit games like Retro Bowl and New Star Soccer, are pleased to announce that their 90’s styled soccer game, Retro Goal on mobile devices is now FREE to play in career mode.Players no longer have to pay to continue playing after the previous limit, and the game continues to be an advert-free experience. Players now have the option to purchase an optional “unlimited mode” which has the following benefits.·       500 Free Bux·       Global Championship tournament mode·       Additional Difficulty options·       Additional Season Length options·       Weather effects·       The ability to save players in the Hall of Fame·       All future planned features, such as an in-game editor (coming soon)·       And of course to help support future development!Retro Goal is a fast and exciting mix of arcade soccer action and simple team management. With graphics inspired by the most beloved football games of 16-bit era and the accuracy of modern touchscreen controls, you'll be slotting away goal after goal with pixel-perfect precision. Choose a team from the world's favourite leagues and recruit the superstars, professionals and hotheads who will lead you to victory - then take full control on the pitch and make every touch count!"
