["https://www.newstargames.com/new-star-gp"]
title = "NEW STAR GP | newstargames.com"
description = '"New Star GP" is the arcade racing game where every decision counts - on and off the track! Take control of your own motorsport team, guide your team’s technological development, plan your race strategy, take the wheel, and drive to victory!'
full_description = "NEW STAR GPNEW STAR GPDOWNLOAD NOWNew Star GP is the arcade racing game where every decision counts - on and off the track! You take control of your own motorsport team, guide your team’s technological development, plan your race strategy, take the wheel, and drive to victory! With a simple but deep gameplay experience and appealing retrovisuals, NEW STAR GP puts you in the driving seat for every twist and turn as you manage and race your team through decades of racing, from the 1980s all the way to the present day! The game features: STUNNING RETRO VISUALS Beautifully rendered retro looks and a driving retro soundtrack that bring back fond memories of the iconic racing games of the 1990s. CHOOSE YOUR RACE STRATEGY! A pick-up-and-play arcade driving experience that has more depth than you think. While anyone can take the wheel and have success, those who want to trulymaster the game will want to make use of tyre choice and wear, component reliability, slipstreaming opponents, fuel load, and even pit strategy. Anything canhappen in races, from catastrophic component failures and dynamic weather changes, to tyre blowouts and multi-car pileups. START YOUR CAREER IN THE 80s Compete in GPs, Elimination Races, Time Trials, Checkpoint Races, and one-on-one Rival Races. In between events, choose how to upgrade your car, or whichstaff perks to equip: from sponsored car components to faster pit stops. When you’ve won a season, progress to the next decade of racing and face a new setof opponents and challenges in a brand new car! RACE ICONIC LOCATIONS AROUND THE WORLD! Race a myriad of events across the decades at some of the most iconic racing locations around the world. Earn rewards for setting personal bests! CHALLENGE YOUR FRIENDS IN SPLIT-SCREEN MULTIPLAYER! Enjoy the game with your friends with a fun split-screen social multiplayer mode. Play with 2, 3, or 4 players, choose your car, driver, handicap, and play mode,and any of the tracks to compete on. Points carry over from event to event, so it’s as easy to play one race as it is to play a whole season of racing together. ​ SOME REVIEWS: ​ “If you have any interest in motorsport and are looking for a new speed fix, you’d do well to get behind the wheel of New Star GP at the earliest opportunity… New Star GP is probably the best arcade racer currently available on the market. And it’s certainly one of the most fun of all those games that centre on F1.” - THE XBOX HUB ​ “New Star GP is undoubtedly the best neo-retro racing game of recent years. Generous in its content with a large number of circuits, it’s also the detailed approach of its gameplay mechanics that makes the difference.” - XBOX MAG ​ “Thrilling arcade racing, vibrant low-poly visuals, and engaging team management mechanics combine to make New Star GP one of the best and most compelling retro-style arcade racers. Who says arcade racing is dead?“ - RACING GAMES GG ​ “In summary, New Star GP is more than just a game; it is a comprehensive racing adventure that cleverly connects the thrill of arcade races with the depth of a simulation. The career mode, the strategic racing mechanics and the captivating driver dynamics make it an outstanding title. Whether you are a veteran of racing games or a novice who wants to experience the thrill of a race, New Star GP offers an experience that you can’t put down.” - INSIDE XBOXDOWNLOAD NOWLIKE THE GAME? BUY THE MERCH!From the official New Star Games shop on Redbubble!"
