["https://www.newstargames.com/post/22-feb-2024-new-star-gp-release-date-confirmed-1"]
title = "22 FEB 2024: NEW STAR GP RELEASE DATE CONFIRMED"
description = "Developers New Star Games, the BAFTA award-winning studio behind hit games like New Star Soccer, Retro Goal and Retro Bowl are pleased to announce that their new retro-styled racing game, New Star GP, will be released on March 7th on Xbox, PlayStation, Switch and PC Steam for £24.99 (regional pricing applies) Pre-order on the Xbox Game Store and Nintendo eShop, wishlist on Steam and PlayStation. New Star GP is a fast and exciting arcade motorsport game with stunning retro visuals. Like all New S"
full_description = "22 FEB 2024: NEW STAR GP RELEASE DATE CONFIRMEDDevelopers New Star Games, the BAFTA award-winning studio behind hit games like New Star Soccer, Retro Goal and Retro Bowl are pleased to announce that their new retro-styled racing game, New Star GP, will be released on March 7th on Xbox, PlayStation, Switch and PC Steam for £24.99 (regional pricing applies) Pre-order on the Xbox Game Store and Nintendo eShop, wishlist on Steam and PlayStation. New Star GP is a fast and exciting arcade motorsport game with stunning retro visuals. Like all New Star Games’ titles, New Star GP is simple to play at heart, but contains a surprising amount of depth and details that reward players with an experience like no other game they’ve played.Play Career Mode starting in the 80’s and work your way through 5 decades of racing while upgrading your car and your support team, or chase high scores in Championship Mode on your own or in split-screen with up to three friends.The game has 176 unique events to play, including time trials, checkpoint races, reverse races, rival races, elimination events, and GP styled races! Compete against 45 unique drivers across the decades of racing, each with their own personalities and driving styles. Race on 17 gorgeous track locations around the world, all with unique playing styles, weather conditions and track abrasion values, providing a varied racing experience that requires different race strategies to maximise the chances of success.New Star GP also boasts 17 unique championship competitions set across the tracks from the career mode that can be enjoyed either in single player, or with up to 4 players. Each has a unique roster of tracks and game settings. The game also has a creation mode that allows players to create their own, bespoke championship competitions. Set the number of laps, weather, track configuration, difficulty, race speed, and a host of other options. Custom competitions can be raced in single or multiplayer with up to 4 players. New Star GP has been developed by New Star Games and published by Five Aces Publishing."
