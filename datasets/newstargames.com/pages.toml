["https://www.newstargames.com/news/page/7"]
title = "NEWS | newstargames.com | Page 7 of 12"
description = "08 AUG 2023: NEW STAR GP ON STEAM EARLY ACCESSDevelopers New Star Games, the BAFTA award-winning studio behind hit games like New Star Soccer, Retro Goal and Retro Bowl are pleased to announce that the warmup lap is complete and their new retro-styled racing game, New Star GP, is now available for purchase on Steam Early Access for just $17.99 / £14.99 / €17.49. This represents a significant discount on what the expected price will be on exiting Early Access as more content gets added to the game.https://store.steampowered.com/app/2217580/New_Star_GP Early Access players will also get an exclusive, FREE body-shell. The Lucas 05 body-shell is a cool cosmetic exclusive, with a real nostalgic look to it.https://www.youtube.com/watch?v=9rmpLrkGsSI"
full_description = "08 AUG 2023: NEW STAR GP ON STEAM EARLY ACCESSDevelopers New Star Games, the BAFTA award-winning studio behind hit games like New Star Soccer, Retro Goal and Retro Bowl are pleased to announce that the warmup lap is complete and their new retro-styled racing game, New Star GP, is now available for purchase on Steam Early Access for just $17.99 / £14.99 / €17.49. This represents a significant discount on what the expected price will be on exiting Early Access as more content gets added to the game.https://store.steampowered.com/app/2217580/New_Star_GP Early Access players will also get an exclusive, FREE body-shell. The Lucas 05 body-shell is a cool cosmetic exclusive, with a real nostalgic look to it.https://www.youtube.com/watch?v=9rmpLrkGsSI Developers New Star Games, the BAFTA award-winning studio behind hit games like New Star Soccer, Retro Goal and Retro Bowl are pleased to announce that the warmup lap is complete and their new retro-styled racing game, New Star GP, is now available for purchase on Steam Early Access for just $17.99 / £14.99 / €17.49. This represents a significant discount on what the expected price will be on exiting Early Access as more content gets added to the game.https://store.steampowered.com/app/2217580/New_Star_GP Early Access players will also get an exclusive, FREE body-shell. The Lucas 05 body-shell is a cool cosmetic exclusive, with a real nostalgic look to it.https://www.youtube.com/watch?v=9rmpLrkGsSI 23 JUN 2023: NEW STAR GP ANNOUNCEDDevelopers New Star Games, the BAFTA award-winning studio behind hit games like New Star Soccer, Retro Goal and Retro Bowl are pleased to announce that their new retro-styled racing game, New Star GP, is racing into Steam Early Access very soon with console versions following later this year!New Star GP is a fast and exciting arcade motorsport game with stunning retro visuals. Play Career Mode starting in the 80’s and work your way through decades of racing while upgrading your car and your support team, or chase high scores in Championship Mode on your own or in split-screen with up to three friends.When the game hits Early Access it will have races set in both the 80’s and the 90’s. That equates to 56 individual race events taking in iconic racing venues like Brisbane, Quebec and Tokyo with plans to evolve Career Mode to include future decades of racing along with new cars, locations, tracks and rivals. Championship Mode will have a selection of different championships to play in either single player or with up to three other players, with plans to add more content while in Early Access.New Star GP is the biggest and most ambitious game that New Star Games has ever worked on, so is a great fit for Steam Early Access. With an excellent reputation for listening and working with the community on their titles, New Star Games are looking forward to getting player input on refining the current experience and also on adding new content and features.Simon Read, founder of New Star Games said that “New Star GP is about bringing the excitement of 90s arcade racing bang up-to-date with the deeper gameplay elements that the modern gamer expects. I believe we have succeeded in this aim because the team here have created a thing of pure joy!”Experience first-hand this joy in just a few weeks’ time. The Steam page is now live, players can add the game to their wishlist here:https://store.steampowered.com/app/2217580/New_Star_GP/View the New Star GP Announcement Trailer here:- https://youtu.be/jMd8AG_C28g New Star GP has been developed by New Star Games and published by Five Aces Publishing."
