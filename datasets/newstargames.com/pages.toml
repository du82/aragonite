title = "25 FEB 2025: RETRO SLAM TENNIS LAUNCHES!"
description = "Developers New Star Games, the BAFTA award-winning studio behind hit games like New Star Soccer, Retro Goal and Retro Bowl are pleased to announce that their new retro-styled Tennis game, Retro Slam Tennis, is now available to download for FREE on mobile devices.​Get ready to be the next tennis sensation! Work your way up the ranks and strive to be the world's best player. Compete on hard, clay and grass courts, hire coaches and complete their challenges, manage relationships with friends and fa"
full_description = '''25 FEB 2025: RETRO SLAM TENNIS LAUNCHES!Developers New Star Games, the BAFTA award-winning studio behind hit games like New Star Soccer, Retro Goal and Retro Bowl are pleased to announce that their new retro-styled Tennis game, Retro Slam Tennis, is now available to download for FREE on mobile devices.​Get ready to be the next tennis sensation! Work your way up the ranks and strive to be the world's best player. Compete on hard, clay and grass courts, hire coaches and complete their challenges, manage relationships with friends and family, acquire sponsors, buy luxury items, buy equipment, chug a can of NRG (or two) and oh - don't forget about your social media followers! Retro Slam Tennis is a full-on role-playing experience where if you work hard and hone your skills then you can be the "new star" in world tennis!Watch the Retro Slam Tennis trailer here: - https://youtube.com/shorts/aJtTh0iq7dQSimon Read, founder of New Star Games, had this to say about the game. “I have been wanting to make a tennis game for many years, using a similar approach to that of New Star Soccer with both the gameplay mechanic and the tongue-in-cheek simulation of a player career. Now it's finally here I can't wait to see how players take to it.”​ Developers New Star Games, the BAFTA award-winning studio behind hit games like New Star Soccer, Retro Goal and Retro Bowl are pleased to announce that their new retro-styled Tennis game, Retro Slam Tennis, is now available to download for FREE on mobile devices.​Get ready to be the next tennis sensation! Work your way up the ranks and strive to be the world's best player. Compete on hard, clay and grass courts, hire coaches and complete their challenges, manage relationships with friends and family, acquire sponsors, buy luxury items, buy equipment, chug a can of NRG (or two) and oh - don't forget about your social media followers! Retro Slam Tennis is a full-on role-playing experience where if you work hard and hone your skills then you can be the "new star" in world tennis!Watch the Retro Slam Tennis trailer here: - https://youtube.com/shorts/aJtTh0iq7dQSimon Read, founder of New Star Games, had this to say about the game. “I have been wanting to make a tennis game for many years, using a similar approach to that of New Star Soccer with both the gameplay mechanic and the tongue-in-cheek simulation of a player career. Now it's finally here I can't wait to see how players take to it.”​'''
