["https://www.newstargames.com/post/sep-04-2024-nfl-retro-bowl-25-announced"]
title = "04 SEP 2024: NFL RETRO BOWL '25 ANNOUNCED"
description = "The National Football League and the National Football League Players Association announced today the relaunch of New Star Games’ Retro Bowl+ as NFL Retro Bowl ’25. The game will be available exclusively on Apple Arcade, Apple’s popular game subscription service that offers unlimited access to more than 200 incredibly fun games, with no ads or in-app purchases. Incorporating the official NFL trademark for teams and players, NFL Retro Bowl ’25 combines authentic NFL rosters with easy-to-use contr"
full_description = "04 SEP 2024: NFL RETRO BOWL '25 ANNOUNCEDThe National Football League and the National Football League Players Association announced today the relaunch of New Star Games’ Retro Bowl+ as NFL Retro Bowl ’25. The game will be available exclusively on Apple Arcade, Apple’s popular game subscription service that offers unlimited access to more than 200 incredibly fun games, with no ads or in-app purchases. Incorporating the official NFL trademark for teams and players, NFL Retro Bowl ’25 combines authentic NFL rosters with easy-to-use controls and the retro style fans adore.“A hit on the App Store, Retro Bowl+ is a fan favorite, and we are excited to relaunch the classic mobile game as one of our own with the creation of NFL Retro Bowl ’25,” said Ed Kiang, vice president of video gaming at the NFL. “Existing fans can continue to enjoy the nostalgic retro gaming style, while the refreshed branding will captivate new audiences and take them through a unique gaming experience of NFL football management and gridiron action.”“New Star Games are delighted to show the fruits of our collaboration with the NFL and NFLPA to bring you this gem of a game,” said Paul Kilburn, director of Five Aces Publishing Ltd. “With real-life players and teams mixed seamlessly into classic Retro Bowl action, we’re extremely happy with this game and can’t wait to see it out in the wild.”NFL Retro Bowl ’25 allows fans to immerse themselves in the world of football management and gameplay. Fans can create their football dynasty by choosing their favorite NFL players and managing rosters and game strategies with a simple roster management system. From calling plays on the field to managing players in the locker room, every aspect of running a successful team falls under the control of the user. In the game, NFL players will be stylized in the game’s retro style along with unique, fully realized retro art and tuned attributes.“NFL Retro Bowl ’25 brings the fun, vibrant energy of 1980s arcade football games to life, with users at the heart of the experience,” said Sophie Gage, vice president of business & legal affairs at NFL Players Inc. “Fans can manage and play with their favorite players, enjoying a game that blends the nostalgic look and feel of a beloved era with today’s innovations. This game highlights our commitment to making users integral to every aspect of the football experience.”NFL Retro Bowl ’25 launches on Sept. 5 on Apple Arcade."
