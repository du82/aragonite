full_description = "Local SEO gets your Business seen in local searches by neighbors looking for services you offer. A major factor in determining how you rank locally is the quantity and quality of citations and NAP consistency across your citations. Incorrect NAP Name, Address, Phone) information greatly reduces both search engine & visitor confidence in your company. It can even lead to a penalty from the search engines. This is why getting citations with correct NAP information is SO important! NAP stands for Name, Address & Phone Number. It's a critical factor in local SEO and influences which companies Google and other search engines display for local intent searches. Your NAP data displayed throughout the Internet is referred to as a citation & all the NAP instances collectively are called citations. In other words, a citation is when your NAP data shows up on directory sites like Yelp or Angie's List, newspaper articles, blogs posts, etc. Your citation is the Name, Address and Phone number of your Business (also known as NAP). Having these correct and up-to-date is critical to making sure that Google authenticates your Business as a real, verifiable Business. If your NAP information isn't 100% consistent everywhere, it could lead to a penalty. Not to mention how incorrect contact information for your Business could lead to potential customers becoming frustrated and moving on to your competitor down the street who does have correct NAP information. We correctly maintain all this information for you and correct any errors immediately across over 300 of the most heavily trafficked websites on the Internet. Beyond just your Google Places NAP entry, Google also looks for citations (Mentions of your NAP) on other websites. If this information isn't 100% consistent, you will likely rank very low in Google Local, if you show up at all. Your citations can be hit particularly hard, if you've moved locations in the last few years. Do you want to make sure your company website ranks high in Google in your local community? Do you want to be found by patients or customers in your neighborhood? Do you want to improve the usability of your site by easily adding your location and opening hours to Google searches? When searching in Google (Or any other search engine) for a doctor, dentist or hairdresser etc. the results bring up local Businesses in that area. The results seem to be spontaneous, but in order for Google to give your Business a high local search listing, Google needs to know the exact location of your Business and also the exact services your Business provides. We set all this up and more for you with our Local SEO work."
