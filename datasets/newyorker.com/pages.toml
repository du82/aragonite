title = "About Us - The New Yorker | The New Yorker"
description = "Apps and digital editions, press information, writers’ biographies, and more"
full_description = "AboutAbout UsSave this storySave this storySave this storySave this storySince its founding, in 1925, The New Yorker has evolved from a Manhattan-centric “fifteen-cent comic paper”—as its first editor, Harold Ross, put it—to a multi-platform publication known worldwide for its in-depth reporting, political and cultural commentary, fiction, poetry, and humor. The weekly magazine is complemented by newyorker.com, a daily source of news and cultural coverage, plus an expansive audio division, an award-winning film-and-television arm, and a range of live events featuring people of note. Today, The New Yorker continues to stand apart for its rigor, fairness, and excellence, and for its singular mix of stories that surprise, delight, and inform.How to Access The New YorkerThe weekly magazine is available in print, at newsstands, and by subscription. Digital subscribers have access to our complete archive, which includes a digital replica of every issue of the print magazine, from 1925 to today.Our Web site, newyorker.com, features the full contents of each week’s magazine, plus up-to-the-minute reporting and commentary. You can also watch our videos, listen to our podcasts and narrated articles, explore our interactive features, solve our crossword puzzles, and enter the Cartoon Caption Contest from the site.All readers are welcome to enjoy the home page, the front page of each section, the video hub, Goings On About Town listings, and a limited number of articles per month at no charge.AppsThe New Yorker app, available for free in the App Store and Google Play Store, is the best way to stay on top of The New Yorker’s offerings. Download the app for a daily blend of in-depth reporting, political commentary, cultural criticism, and humor. iOS app users can also opt to receive alerts about breaking-news coverage and major stories.In addition to the app, The New Yorker publishes each week’s issue in its entirety for Kindles, Nooks, and more. Learn more.NewslettersSign up for our newsletters to get the best of The New Yorker in your in-box.Social MediaFollow us on Twitter, Facebook, Instagram, LinkedIn, and TikTok.Our ContributorsView biographies of New Yorker writers and artists, find their latest work, and more.The New Yorker Radio HourSubscribe to The New Yorker Radio Hour to hear The New Yorker’s editor, David Remnick, present a mix of in-depth interviews and stories every week.The New Yorker FestivalView the lineup for the most recent New Yorker Festival, a three-day celebration of ideas and the arts. The festival is held in the early fall in New York City, featuring New Yorker writers, artists, editors, and other guests.New Yorker MerchandiseShop The New Yorker Store for T-shirts, baseball caps, tote bags, and more.Press CenterVisit the Press Center to submit media inquiries.AdvertisingFor advertising inquiries, contact adinquiries@condenast.com, and view our media kit.F.A.Q. | Contact UsThe New Yorker is a division of Advance Magazine Publishers, Inc."
