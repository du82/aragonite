["https://newyorker.com/about/contact"]
title = "About Us - The New Yorker | The New Yorker"
description = "If you want to send a submission (fiction, poetry, humor) or request back issues and permissions, please visit our Contact Us page."
full_description = "AboutContact UsSave this storySave this storySave this storySave this storyAnswers to many common questions can be found in our F.A.Q.Subscriptions: To subscribe to The New Yorker, click here. For customer service, visit this page, e-mail help@newyorker.com, or call 800-444-7570 (outside the United States, 515-243-3273).Tablet: For tablet edition support and feedback, please use this form. For letters to the editor, submissions, and permissions requests, please follow the instructions below.Letters to the editor: Please send letters to themail@newyorker.com, and include your postal address and daytime phone number. Letters may be edited for length and clarity, and may be published in any medium. All letters become the property of The New Yorker.Fiction submissions: Please send your submissions (as PDF attachments) to fiction@newyorker.com, or by mail to Fiction Editor, The New Yorker, 1 World Trade Center, New York, NY 10007. We read all submissions within ninety days, and will contact you if we’re interested in publishing your material. We regret that, owing to the volume of submissions we receive, we are unable to call or e-mail unless a story is accepted for publication. If you have not heard from us within ninety days, please assume that we will not be able to publish your manuscript. Submissions sent by regular mail will not be returned, so please do not send original copies of your work.Poetry submissions: Poetry is reviewed on a rolling basis. We accept submissions via Submittable only. Send up to six poems (in a single document) per submission, but please do not submit more than twice in twelve months. We do not consider work that has appeared elsewhere (this includes all Web sites and personal blogs). We are interested in translations of poems that have never been published in English. Simultaneous submissions are welcome, but please notify us promptly, using your Submittable account, if a poem has been accepted elsewhere. We read all submissions and strive to respond within six months, but, due to the volume we receive, the wait may be longer.Shouts & Murmurs and Daily Shouts submissions: Please send your submission (as a PDF attachment) to TNY_Shouts@newyorker.com. We read all submissions and try to respond within six months. We ask that you not send us more than one submission at a time, and that you wait to hear back about each pending submission before sending another. Keep in mind that Shouts & Murmurs are humorous fiction; first-person essays will not be considered.Cartoon submissions: Cartoons are reviewed on a rolling basis. You may send as many as ten cartoons per submission, but please do not submit more than once a month. We do not consider work that has appeared elsewhere (including on Web sites and personal blogs), and we do not consider ideas for cartoons, only fully drawn cartoons. We also do not consider illustrations, caricatures, or covers. We try to respond as soon as possible, but we do receive a large number of submissions. We do not accept submissions via mail or e-mail; instead, please upload your work via Submittable.In the Dark Podcast: Please send feedback and tips to inthedark@newyorker.com.Other submissions: We regret that we cannot consider unsolicited Talk of the Town stories or other nonfiction.Advertising: For advertising inquiries, contact adinquiries@condenast.com, and view our media kit.Permissions and back issues: For permissions and licensing requests, please send an e-mail to image_licensing@condenast.com. Include the content title and description, as well as issue dates, page numbers, names of authors and artists, and any other relevant information.Job seekers: Visit our careers page."
