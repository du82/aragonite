["https://newyorker.com/100"]
title = "100 Years of The New Yorker | The New Yorker"
description = "A special digital collection including anniversary issues, events, games, and merchandise to celebrate our hundredth year, plus curated deep dives into the magazine’s archives of reporting, fiction, profiles, and cartoons."
full_description = "In 1925, Harold Ross, The New Yorker’s founding editor, envisioned a magazine of wit, reporting, fiction, art, and criticism—“a reflection in word and picture of metropolitan life.” A century later, The New Yorker is still known for its capacity to surprise, delight, and inform with accuracy and depth. In 2025, please join us in celebrating a hundred years of The New Yorker, and enjoy the host of special issues, festivals, exhibits, events, and more to come. Jill Lepore on the letters of New Yorker editors and writers, Adam Gopnik on Ernest Hemingway and Lillian Ross, and David Remnick on the magazine from 1925 to today. Plus: Lawrence Wright on the bond between women on death row in Texas and an order of nuns, Kathryn Schulz on learning to love the spider, Burkhard Bilger on marching bands, Dhruv Khullar on interplanetary travel, Kelefa Sanneh on Mike White, and more. Ross, a high-school dropout born in Colorado, was the unlikely visionary behind a new fifteen-cent “comic paper” that sought to cater to sophisticated Manhattan readers. During his tenure, from 1925 until 1951, The New Yorker established itself as a leading source of cultural criticism, humor, and reporting. Grant, who is often overlooked in histories of the magazine, was the first woman reporter in the New York Times’ city room. She met Ross in Europe during the First World War, and the pair later married and started The New Yorker. Together, they recruited the magazine’s primary financial backer, Raoul Fleischmann. Irvin, originally from San Francisco, designed the signature font of The New Yorker’s title and the top-hatted dandy Eustace Tilley, the figure on the début cover. Irvin was also crucial to the development of the magazine’s cartoons, whose single-line captions marked a minor revolution in illustrated humor. White joined The New Yorker six months after its first issue, and had a sweeping influence on the magazine. In three and a half decades on the staff, White refined the publication’s comic sensibilities, cultivated women writers, and pressed for the inclusion of serious poetry."
