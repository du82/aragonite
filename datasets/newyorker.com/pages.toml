title = "Frequently Asked Questions   The New Yorker | The New Yorker"
description = "Thank you for reading The New Yorker. If you don’t see the answer to your question here, please call us at 855 680 3077 (or 332 239 6553, if outside the United States) or e Mail help@newyorker.com."
full_description = 'Frequently Asked Questions: newyorker.com<img alt="Frequently Asked Questions The New Yorker" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.newyorker.com/photos/5e98a473db395c0009acc019/master/w_1600%2Cc_limit/0-lede.jpg" srcSet="https://media.newyorker.com/photos/5e98a473db395c0009acc019/master/w_120,c_limit/0-lede.jpg 120w, https://media.newyorker.com/photos/5e98a473db395c0009acc019/master/w_240,c_limit/0-lede.jpg 240w, https://media.newyorker.com/photos/5e98a473db395c0009acc019/master/w_320,c_limit/0-lede.jpg 320w, https://media.newyorker.com/photos/5e98a473db395c0009acc019/master/w_640,c_limit/0-lede.jpg 640w, https://media.newyorker.com/photos/5e98a473db395c0009acc019/master/w_960,c_limit/0-lede.jpg 960w, https://media.newyorker.com/photos/5e98a473db395c0009acc019/master/w_1280,c_limit/0-lede.jpg 1280w, https://media.newyorker.com/photos/5e98a473db395c0009acc019/master/w_1600,c_limit/0-lede.jpg 1600w" sizes="100vw"/>Jump to a section:Becoming a SubscriberManaging Your SubscriptionReading on a Phone, Computer, or TabletAdditional OfferingsTechnical TroubleshootingBecoming a SubscriberHow do I subscribe or give a gift subscription?Please visit our subscription Web site to find the best option for your needs.When will my first issue arrive?You will receive your first issue between three and six weeks after purchasing a print subscription. Each issue is published one week prior to the cover date, and most subscribers receive it a few days after publication. For subscribers outside the United States, each issue may arrive up to two weeks after the cover date.Check on which issue was mailed to you most recently or report a delivery problem.What does my subscription include?All subscriptions provide unlimited digital access to The New Yorker’s offerings, including newyorker.com, the online archive, and the New Yorker app. Print subscribers also receive the print edition of the magazine, published weekly (except for select combined issues throughout the year).My subscription included a tote bag. When can I expect it to arrive?The tote ships six to eight weeks after your payment is processed. International orders may take longer to ship, and packages may be delayed at customs. We regret that our staff cannot track tote bags after they enter the postal system.The New Yorker also offers tote bags with limited-time or seasonal designs. The design of the bag depends on the offer you purchase, and will be displayed on the order form when you subscribe. At this time, tote bags cannot be purchased independently from a subscription, and the design cannot vary from the one available with your offer.What forms of payment do you accept?We accept Visa, MasterCard, American Express, Discover, and Diners Club cards. We also accept PayPal, Apple Pay, and Amazon Pay. Alternatively, checks can be mailed to The New Yorker, P.O. Box 37684, Boone, IA 50037-0684.Can I get a receipt or confirmation of my subscription, account details, or cancellation?Yes, our staff would be happy to send you a receipt. After subscribing, you can expect to receive a confirmation e-mail within twenty-four hours. For all other requests, please e-mail help@newyorker.com or call 855-680-3077 (332-239-6553, if outside the United States).When will I be charged?Credit cards are charged as soon as your order is received. It may take up to three days for the charge to appear on your credit-card statement. Before the start of each renewal, you will be e-mailed a reminder notice summarizing the details of your subscription and the rate that you will be charged.Why do I need to provide a mailing address for a digital subscription?Should your e-mail address ever become defunct, we will send notifications about your subscription to your postal address instead.Can I subscribe to The New Yorker if I live outside the United States?Yes. You can subscribe to The New Yorker from most countries, although it may take longer to receive print issues in the mail. For assistance, e-mail help@newyorker.com or call 332-239-6553.Jump to a section:→ Becoming a SubscriberManaging Your SubscriptionReading on a Phone, Computer, or TabletAdditional OfferingsTechnical Troubleshooting<img alt="Image may contain Human and Person" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.newyorker.com/photos/5e98a473fe3260000878c2c5/master/w_1600%2Cc_limit/2%2520-%2520managing%2520your%2520current%2520subscription.jpg" srcSet="https://media.newyorker.com/photos/5e98a473fe3260000878c2c5/master/w_120,c_limit/2%20-%20managing%20your%20current%20subscription.jpg 120w, https://media.newyorker.com/photos/5e98a473fe3260000878c2c5/master/w_240,c_limit/2%20-%20managing%20your%20current%20subscription.jpg 240w, https://media.newyorker.com/photos/5e98a473fe3260000878c2c5/master/w_320,c_limit/2%20-%20managing%20your%20current%20subscription.jpg 320w, https://media.newyorker.com/photos/5e98a473fe3260000878c2c5/master/w_640,c_limit/2%20-%20managing%20your%20current%20subscription.jpg 640w, https://media.newyorker.com/photos/5e98a473fe3260000878c2c5/master/w_960,c_limit/2%20-%20managing%20your%20current%20subscription.jpg 960w, https://media.newyorker.com/photos/5e98a473fe3260000878c2c5/master/w_1280,c_limit/2%20-%20managing%20your%20current%20subscription.jpg 1280w, https://media.newyorker.com/photos/5e98a473fe3260000878c2c5/master/w_1600,c_limit/2%20-%20managing%20your%20current%20subscription.jpg 1600w" sizes="100vw"/>Managing Your SubscriptionI forgot my password. How can I recover it?On newyorker.com, select Sign In at the top-right corner of your screen, then Forgot password?. If there is a New Yorker account associated with your e-mail address, we will send you instructions for resetting your password.How do I make changes to my e-mail address or password?Please visit My Account to manage your newyorker.com account information, including your e-mail address and password.What does it mean to link or verify my subscription? Why is this important?Creating a newyorker.com account and subscribing to the magazine are independent operations. It is possible to create a newyorker.com account without being a subscriber, and vice versa. In order to read unlimited articles as a subscriber on newyorker.com, you’ll need to link your subscription to your newyorker.com account.To link your subscription:Sign in to your newyorker.com account (or create one, if you haven’t yet).Visit newyorker.com/account/link.Enter your account number or subscription number, which can be found in two places: the Account summary section of Customer Care and the mailing label of a magazine, if you are a print subscriber.Or, select the link to use your shipping address.If you have trouble linking your subscription, please e-mail help@newyorker.com or call 855-680-3077 (332-239-6553, if outside the United States).I have multiple New Yorker accounts. Can I combine them?Yes, our staff would be happy to assist you. Please e-mail help@newyorker.com or call 855-680-3077 (332-239-6553, if outside the United States).How do I unsubscribe from The New Yorker?You can cancel your subscription (or a gift subscription) via My Account by selecting Manage Subscription.For further assistance, please e-mail help@newyorker.com or call 855-680-3077 (332-239-6553, if outside the United States).If I cancel my subscription, when does the cancellation go into effect?The cancellation will be processed immediately, though you may receive one to two additional issues after ending your subscription.How can I receive confirmation of my cancellation?Our staff would be happy to send you a confirmation. Please e-mail help@newyorker.com or call 855-680-3077 (332-239-6553, if outside the United States).How can I cancel my print subscription and keep digital access only?Please e-mail help@newyorker.com or call our staff at 855-680-3077 (or 332-239-6553, if outside the United States).How do I check on when my subscription expires?You can view the expiration date of your subscription (or gift subscription) via Manage Account on your account profile page.How do I temporarily suspend my subscription?You can stop your subscription (or gift subscription) for up to one year, and then resume it, via Customer Care by selecting Manage Subscription, then Suspend Subscription.If I suspend my print subscription, will I still have access to newyorker.com, the archive, and New Yorker mobile apps?While your subscription is suspended, you will have limited access to newyorker.com. Just like a reader who has not subscribed, you will be able to view the newyorker.com home page, section pages, video hub, Goings On About Town listings, and a limited number of articles per month across the Web site. The archive and the New Yorker app are available to active subscribers only.In the NYer Print Edition app, you will continue to have access to any issues that were released while you were a subscriber.Jump to a section:Becoming a Subscriber→ Managing Your SubscriptionReading on a Phone, Computer, or TabletAdditional OfferingsTechnical Troubleshooting<img alt="Image may contain Human and Person" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.newyorker.com/photos/5e98a4748704120008b74fe9/master/w_1600%2Cc_limit/3%2520-%2520reading%2520on%2520a%2520phone%2520or%2520tablet.jpg" srcSet="https://media.newyorker.com/photos/5e98a4748704120008b74fe9/master/w_120,c_limit/3%20-%20reading%20on%20a%20phone%20or%20tablet.jpg 120w, https://media.newyorker.com/photos/5e98a4748704120008b74fe9/master/w_240,c_limit/3%20-%20reading%20on%20a%20phone%20or%20tablet.jpg 240w, https://media.newyorker.com/photos/5e98a4748704120008b74fe9/master/w_320,c_limit/3%20-%20reading%20on%20a%20phone%20or%20tablet.jpg 320w, https://media.newyorker.com/photos/5e98a4748704120008b74fe9/master/w_640,c_limit/3%20-%20reading%20on%20a%20phone%20or%20tablet.jpg 640w, https://media.newyorker.com/photos/5e98a4748704120008b74fe9/master/w_960,c_limit/3%20-%20reading%20on%20a%20phone%20or%20tablet.jpg 960w, https://media.newyorker.com/photos/5e98a4748704120008b74fe9/master/w_1280,c_limit/3%20-%20reading%20on%20a%20phone%20or%20tablet.jpg 1280w, https://media.newyorker.com/photos/5e98a4748704120008b74fe9/master/w_1600,c_limit/3%20-%20reading%20on%20a%20phone%20or%20tablet.jpg 1600w" sizes="100vw"/>Reading on a Phone, Computer, or TabletWhy should I create a newyorker.com account?All readers are encouraged to create a free account on newyorker.com, regardless of their subscription status. Signing in enables you to save your place while solving the crossword, submit ideas to the Cartoon Caption Contest in one step, save stories for later, and more.If you subscribe to The New Yorker, you also have unlimited access to articles on newyorker.com, as well as the New Yorker app and the complete New Yorker archive online. However, you won’t be able to access any of the above without a newyorker.com account.If you have not done so, please create a free account now.Are all New Yorker articles available on newyorker.com?Every article since 2007, whether it was published in the magazine or only on the Web, is available on newyorker.com. Every issue of the magazine dating back to its founding, in 1925, is available to subscribers at archives.newyorker.com.Do I need a subscription to access newyorker.com?If you are not a subscriber, you have limited access to The New Yorker’s Web site.You can view newyorker.com’s home page, section pages, video hub, Goings On About Town listings, and a limited number of articles per month across the Web site. The New Yorker app and archive are available to subscribers only.Subscribers enjoy unlimited access to newyorker.com.Is the magazine available on mobile and tablet devices?Yes. The New Yorker app allows you to view all of The New Yorker’s offerings on a mobile or tablet device, including daily news and culture coverage from the Web, and each week’s issue, in full.If you subscribed directly through The New Yorker (including newyorker.com and the New Yorker app), you can read the complete magazine by opening the New Yorker app, then selecting Magazine at the bottom of the screen. Every issue since 2008 is available to browse and save off-line.The New Yorker app is available through the App Store and Google Play Store. Digital editions of the magazine are available through the Nook bookstore.Which devices support the New Yorker app?The New Yorker app can be downloaded to your iPhone or iPad from the App Store or your Android phone or tablet from the Google Play Store.Do I need a New Yorker subscription to access the New Yorker app?Yes. The app is exclusive to subscribers, and is free to download. If you subscribed directly through The New Yorker (including newyorker.com and the New Yorker app), you can view as many articles and issues as you’d like. If eligible, non-subscribers will be invited to explore the app through a free trial.Can I share stories from the New Yorker app through e-mail or social media?Yes. While the app is available for subscribers only, each individual story is shareable. The link will direct viewers to the story on our Web site.I have an active digital subscription. How do I get unlimited access to the New Yorker app?Open the New Yorker app and tap Settings in the top-right corner.If you already have a newyorker.com account, select Already a subscriber? Sign in.If, after signing in, you see the option to Link your print subscription, please do so.If you do not have a newyorker.com account, select Link your print subscription, enter your subscription details, and create an account.You will then be able to use your newyorker.com account to get unlimited access to both of our apps, newyorker.com, and the online archive.How do I get unlimited access to the magazine on my phone or tablet?If you already have an active New Yorker subscription, purchased directly from The New Yorker, download the New Yorker app from the App Store or Google Play Store and sign in.If you are a subscriber but do not have a newyorker.com account, please create one and link your subscription.If you do not have an active New Yorker subscription, please subscribe to get unlimited access to the magazine.I subscribed through the New Yorker app or the NYer Print Edition app on my iPhone, iPad, or iPod. How do I get unlimited access to newyorker.com, the apps, and the archive?Immediately after you subscribed through the app, you were prompted to create a newyorker.com account. If you have not done so, you can now.If you subscribed through the New Yorker app:Open the app and select Settings in the top-right corner of the screen.Select Already a subscriber? Sign in.If you do not see Sign in or create an account, select Restore your Apple purchase.If you subscribed through the NYer Print Edition app:Visit the My Account tab in the NYer Print Edition app.Select Get newyorker.com access and sign up.If you have an account, sele'
