["https://nexo.com/blog/nexo-awarded-silver-globee-for-financial-company-of-the-year"]
title = "Nexo Awarded Silver Globee® for Financial Company of the Year"
description = "Nexo earns a Silver Globee® Award, recognizing its excellence in financial services and crypto innovation."
full_description = "Nexo Awarded Silver Globee® for Financial Company of the YearOct 25, 2021•2 min readLONDON, October 25, 2021 – Nexo, a leading institution for digital assets has won a Silver Globee® for Financial Company of the Year 2021 in the 8th annual International Best in Business Awards.The coveted International Best in Business Awards program recognizes and honors the world’s best in organizational performance, products and services, innovations, executives and management teams, women in business, successful deployments, product management, and numerous other areas from every major industry in the world. Through its selective criteria and engagement with industry leaders, this annual award celebrates the individuals and teams who set industry benchmarks for excellence.Nexo has been named a Silver Winner in the Financial Company of the Year category after a 5-month judging process. The Globee® Awards prestige is further supported by its reputable panel of judges including industry-leading experts from Deloitte, KPMG, JP Morgan, among others.“We are proud to be recognized as the Financial Company of the Year, especially knowing that many traditional financial firms also competed in this category. A digital assets company winning in this category is not only a milestone for Nexo, but for the entire crypto industry. This honor is one of many instances wherein Nexo’s strive to create compliant and transparent innovation truly propels the entire blockchain space forward into mainstream finance,” commented Antoni Trenchev, Co-Founder and Managing Partner of Nexo.This is the fourth business award Nexo has received in 2021. Since the beginning of the year, the firm has launched a much anticipated in-house exchange, pre-released the Nexo Card, implemented a governance feature, in addition to becoming the first crypto lender to share a third-party real-time reserves audit, proving its assets exceed liabilities at all times.See the complete list of 2021 winners here: https://globeeawards.com/international-business-awards/winners/About NexoNexo is a leading digital assets institution. Committed to enhancing the value and utility of digital assets, the company offers a comprehensive suite of services including advanced trading solutions, liquidity aggregation from top trading venues, and flexible asset-backed credit lines. Since its inception in 2018, Nexo has processed $130+ billion for 7,000,000+ satisfied users across more than 200 jurisdictions. For more details, visit: nexo.com.Media contact for NexoNexo PR Team [email protected]About the Globee Awards Globee Awards are conferred in eleven programs and competition: the American Best in Business Awards, Business Excellence Awards (Best Employers), CEO World Awards®, Communications Excellence Awards, Cyber Security Global Excellence Awards®, Disruptor Company Awards, Golden Bridge Awards®, International Best in Business Awards, IT World Awards®, Sales, Marketing, & Service Excellence Awards, and Women World Awards®. Learn more about the Globee Awards at https://globeeawards.com"
