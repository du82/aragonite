["https://nexo.com/blog/nexo-wins-bronze-stevie-award-in-2021-international-business-awards"]
title = "Nexo Wins Bronze Stevie® Award In 2021 International Business Awards®"
description = "Nexo is recognized for excellence with a Bronze Stevie® Award at the 2021 International Business Awards!"
full_description = "Nexo Wins Bronze Stevie® Award In 2021 International Business Awards®Aug 17, 2021•3 min readLONDON, August 17, 2021 – Nexo, a leading institution for digital assets, was named the winner of a Bronze Stevie® Award in the Financial Services category in The 18th Annual International Business Awards® on August 16, 2021.The International Business Awards are the world’s premier business awards program. All individuals and organizations worldwide – public and private, for-profit and non-profit, large and small – are eligible to submit nominations. The 2021 IBAs received entries from organizations in 63 nations and territories, with more than 3,700 nominations submitted for consideration.Nexo won in the Financial Services category for a medium-sized company. The digital assets institution received positive feedback from many Stevie Awards judges, noting the significance of Nexo’s business, its technical capabilities, and for granting its clients financial autonomy in a nascent, but rapidly growing industry.“Successful teams do not achieve success for individual glory, but because of the commitment to their work. This award represents our team's efforts to provide unmatched value to our users and it will serve as a future lever for growth,” commented Antoni Trenchev, Co-founder and Managing Partner at Nexo.This recognition comes amid an outstanding year for Nexo. Since the start of 2021, the company has launched a much anticipated crypto еxchange, implemented a governance feature, allowed users to earn daily interest on their NEXO Tokens, pre-releаsed the Nexo card, and introduced a year-round Transparency initiative, while the native NEXO Token saw an all-time high of $4.05.Тhese milestones would not have been possible without the talented and motivated Nexo team, which despite the Covid-19 crisis, has expanded two-fold in 2021 alone, growing to 260 employees as of August 2021.“What we’ve seen in this year’s IBA nominations is that organizations around the world, in every sector, have continued to innovate and succeed, despite the setbacks, obstacles, and tragedies of the ongoing COVID-19 pandemic,” said Stevie Awards president Maggie Gallagher. “All of this year’s Stevie Award winners are to be applauded for their persistence and their resilience. We look forward to celebrating their achievements with them during our 8 December virtual awards ceremony.”Stevie Award winners were determined by the average scores of more than 260 executives worldwide who participated in the judging process from June through early August.About NexoNexo is a leading digital assets institution. Committed to enhancing the value and utility of digital assets, the company offers a comprehensive suite of services including advanced trading solutions, liquidity aggregation from top trading venues, and flexible asset-backed credit lines. Since its inception in 2018, Nexo has processed $130+ billion for 7,000,000+ satisfied users across more than 200 jurisdictions. For more details, visit: nexo.com.Media contact for NexoNexo PR Team [email protected]About the Stevie AwardsStevie Awards are conferred in eight programs: the Asia-Pacific Stevie Awards, the German Stevie Awards, the Middle East & North Africa Stevie Awards, The American Business Awards®, The International Business Awards®, the Stevie Awards for Women in Business, the Stevie Awards for Great Employers, and the Stevie Awards for Sales & Customer Service. Stevie Awards competitions receive more than 12,000 nominations each year from organizations in more than 70 nations. Honoring organizations of all types and sizes and the people behind them, the Stevies recognize outstanding performances in the workplace worldwide. Learn more about the Stevie Awards at StevieAwards.com."
