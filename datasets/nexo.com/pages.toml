["https://nexo.com/blog/our-partnership-with-the-acapulco-tennis-open"]
title = "Our partnership with the Acapulco Tennis Open"
description = "A strategic move to bring more digital asset solutions to Latin America."
full_description = "Our partnership with the Acapulco Tennis OpenFeb 24•3 min readNexo has officially entered the world of elite sports partnerships through its collaboration with the Abierto Mexicano Telcel presentado por HSBC (Acapulco Tennis Open). This partnership with one of the most prestigious ATP 500 tournaments marks a decisive leap toward expanding our presence in Latin America while reinforcing our mission to provide smart digital asset solutions, designed for long-term growth.The Acapulco Tennis Open, held at Arena GNP Seguros from February 24 to March 1, 2025, will feature top-ranked players like Alexander Zverev, Casper Ruud, and Tommy Paul. Nexo’s role as an official partner underscores its focus on the Latin American market and its broader goal of integrating digital assets into global industries, including sports. Nexo’s plans for Latin AmericaLast year, Latin America experienced a 42.5% year-over-year growth in cryptocurrency adoption, positioning it as the second fastest-growing region globally. In 2025, 95% of Latin American cryptocurrency users expressed plans to increase their holdings, signaling the landscape is set for growth.Supporting the Acapulco Tennis Open is part of Nexo’s 2025 roadmap. Under our 2025 growth plan, Nexo is prioritizing Latin America with initiatives such as expanding the availability of the Dual-Mode Nexo Card, enhancing AI-powered innovations, and streamlining cross-border transactions. By investing in this tournament, Nexo reinforces its dedication to broadening access to digital asset solutions in the region.A shared vision for strategy and successKosta Kantchev, Co-founder and Executive Chairman of Nexo said of the partnership:We are grateful to the Acapulco Tennis Open for the opportunity to support a sport that embodies our values of excellence and perseverance at the highest level. This sponsorship is a testament to Nexo’s core belief that wealth creation, like championship success, requires foresight, commitment, and strategic execution. The same attributes that define great tennis players—discipline, long-term thinking, and resilience—are at the heart of Nexo’s offerings.Simultaneously, José Antonio Fernández Celorio, Chief Operating Officer, Abierto Mexicano Telcel presentado por HSBC, expressed the organizations enthusiasm to work with Nexo:Nexo’s partnership with the Acapulco Tennis Open brings together two worlds that thrive on precision, endurance, and long-term strategy. Just as success in tennis is shaped by vision and adaptability, Nexo equips its clients with the tools to navigate market cycles and pursue long-term growth. We’re excited to welcome Nexo to the tennis world as we continue to push the boundaries of excellence in the sport.Bringing digital assets to global audiencesTennis relies on precision, endurance, resilience, and adaptability – the same qualities that shape Nexo’s approach to digital asset management. Like top athletes who plan for long-term success, Nexo gives its clients the tools to navigate market cycles and build sustainable wealth. Beyond tennis, Nexo’s role in the Acapulco Tennis Open demonstrates its commitment to making digital assets accessible to mainstream audiences. Ultimately, in supporting a sport that aligns with our company values, we are focused on building trust and accelerating the adoption of digital assets worldwide. Whether on the court or in the world of digital assets, success depends on strategy, and Nexo is here to help its clients play the long game."
