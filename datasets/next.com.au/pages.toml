full_description = "Delivery key information How will my parcel be delivered? Great news, shipping is currently free for all orders over $100. Orders under $100 will be charged at $9 for shipping per order. Your order will be delivered by Skynet. Please allow extra days for delivery during Australian holidays, UK national holidays, weekends and sale time. Your order will normally be delivered within 4 - 5 working days. Delivery lead times will be confirmed at checkout. Additional delivery information We’re sorry, shipping to an alternative address in another country is not possible. Please be aware that if you place multiple orders close to each other, they may be packed together to ensure you receive the goods as quickly as possible. *Average delivery times should be used as a guide only. Will I be charged customs fees? You will be responsible for assuring that any products you order comply with state and federal government import regulations. Our terms of sale to our customers in Australia are DDP - Delivered Duty Paid. That is to say, the amount paid by you is fully inclusive of delivery to the specified delivery address and all duties, taxes and customs clearance fees including the new 10% GST. Related articles Key returns information Tracking my order What payment methods can I use? Contact us information Do I pay for returns?"
