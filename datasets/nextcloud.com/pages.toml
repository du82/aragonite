["https://nextcloud.com/groupware"]
title = "Nextcloud Groupware"
description = "Embark on your next vacation – stress free. Set a out-of-office status that will pop up around Hub, letting everybody know you are away and who to contact instead. Configurable in the “Availability” section of your personal settings, your absence status will automatically be updated throughout the platform, with an auto-responder in Mail and a dedicated calendar event for your selected dates."
full_description = 'Embark on your next vacation – stress free. Set a out-of-office status that will pop up around Hub, letting everybody know you are away and who to contact instead. Configurable in the “Availability” section of your personal settings, your absence status will automatically be updated throughout the platform, with an auto-responder in Mail and a dedicated calendar event for your selected dates. Hub 5 brings a new single column design to Contacts for a more simple, approachable look. Each contact can easily still be edited and returned back to view mode. We hope you enjoy the new style! Manage your incoming mail with options like creating subfolders, controlling subscriptions, and marking mail as read. Tailor your mailbox to how you work best. The best way to introduce our new, intelligent features is through the Smart Picker – a cross-application feature enabling users to use AI (and much more) in their daily work flow in a personal and collaborative way. Were your train or flight details sent to you? Keep them in a safe, organized way by importing details into your "personal" or "travel" customizeable folder. In Contacts, users can define their own, custom groups, named Circles. These can be managed in various ways, including with invitations, through an open listing where users can join with or without an approval step, with designated sub-managers and so on. Nextcloud Enterprise is designed to integrate well in Microsoft environments, with file storage, user directory, Outlook, Sharepoint, Windows Desktop, MS Office online server and Teams integrations available. Nextcloud Groupware is designed to deeply integrate in your infrastructure, using existing user directories and file storage systems. Nextcloud Groupware is engineered from the ground up to be secure with the latest web protections and secure login technologies like Brute Force Protection and 2-factor authentication. Nextcloud Groupware is built to host yourself and work with existing SMTP and IMAP servers. This simplifies compliance by putting you in control. Nextcloud supports you with excellent monitoring and audit-ready logging functionality.'
