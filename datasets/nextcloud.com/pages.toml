title = "Stadtsparkasse Munich facilitates customer data exchange with Nextcloud by HKN - Nextcloud"
description = "As one of the oldest banks in Germany, Stadtsparkasse Munich has gone through many groundbreaking changes since its founding in 1824. From introducing cashless payment transactions in 1899, to converting to a computerized electronic data processing system between 1968 and 1971, they have always put modernization first. In fact, the bank was one of the […]"
full_description = '''We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize As one of the oldest banks in Germany, Stadtsparkasse Munich has gone through many groundbreaking changes since its founding in 1824. From introducing cashless payment transactions in 1899, to converting to a computerized electronic data processing system between 1968 and 1971, they have always put modernization first. In fact, the bank was one of the first in Europe to introduce IT. In today’s day and age, they are now at the forefront of the Cloud. <img decoding="async" class="size-medium alignright overlay-trigger" src="https://nextcloud.com/wp-content/uploads/2022/02/Screenshot-2022-02-22-221316.jpg" alt="" /> For some time now, Stadtsparkasse München has been running an on premise Nextcloud server to exchange confidential data with customers. More recently, in 2020, the bank decided that they wanted to transfer all their internal managed systems to the data centers of competent, regional partners. With a Gold Partnership with Nextcloud, HKN stood out as an ideal partner for running their Nextcloud services. With 25 years of experience in hosting Linux applications, HKN was more than capable to deliver quality results with all Stadtsparkasse’s requirements for a provider. From being a German based data center, to having significant migration experience, their top five requirements were met. <img decoding="async" class="banner" src="https://nextcloud.com/wp-content/uploads/2022/02/Stadtsparkasse-Munich-blog-graphic-B.jpg" alt="" /> For several months, HKN was there throughout the entire process, ensuring a smooth migration and testing every detail. The end result satisfied employees and administrators. By switching to HKN’s Open Cloud, Stadtsparkasse München achieved high availability, scalability, DSGVO-compliant hosting, and more. Through HKN, Stadtsparkasse München benefits from Nextcloud Enterprise advantages like improved security, stability and of course direct access to our top engineers.'''
