["https://nextcloud.com/faq"]
title = "FAQ - Nextcloud"
description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally!            See our Privacy Policy for more information.                Customize"
full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize Self-hosting is the quickest and easiest way to legal compliance with a wide variety of regulations. By keeping data on your company servers, there is no need for contracts with other companies or complicated audit processes. You still have comply with security and compliance requirements demanding you take appropriate security measures. A Nextcloud Subscription delivers security patches and consulting based on our expertise and Security Bug Bounty Program, helping Nextcloud customers to make sure this requirement is met. To better deliver on the needs of our customers, they have access to a special Nextcloud Enterprise build pre-configured, optimized and hardened for the special needs of large scale, production-critical enterprise deployments. Nextcloud Enterprise provides the following key benefits: Improved reliability: Nextcloud Enterprise receives additional quality assurance to provide the highest degree of reliability and offers a longer life cycle. Improved scalability: Nextcloud Enterprise is pre-configured and optimized for the needs of large scale production at enterprises, rather than home users. Improved security: Nextcloud Enterprise customers get priority access to security and stability fixes to guarantee smooth operation out of the box. Certified integrity: Nextcloud Enterprise is a guaranteed proven, certified code base for legal compliance like GDPR and HIPAA. Nextcloud is used on anything from a raspberry pi for family calendar syncing to delivering secure team productivity for hundreds of thousands of employees at the German Federal Government, running on a large cluster with Global Scale. Those large enterprise deployments have vastly different needs from the hundreds of thousands of community users that deploy Nextcloud at home. To better deliver on the needs of our customers, we make a special Nextcloud Enterprise build available to them. This build is derived from the same 100% open source code base from Github but pre-configured, optimized and hardened for the special needs of large scale, production-critical enterprise deployments."
