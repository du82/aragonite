["https://nextcloud.com/blog/kiteworks-acquires-owncloud-dracoon"]
title = "Kiteworks acquires ownCloud & Dracoon - Nextcloud"
description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally!            See our Privacy Policy for more information.                Customize"
full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize Today, US-based file sync & share vendor Kiteworks announced their acquisition of ownCloud and Dracoon. Kiteworks points out that their customers now have access to their file-sharing application. It is to be expected they will not maintain 3 similar products, but customers will have to migrate to the US firms’ platform or look for another solution. Nextcloud offers a free hands-on migration service and takes over the remaining runtime of the contracts. Migration is a very quick and easy process, as shown by the many hundreds that have done this already over the last years. Kiteworks seems likely to consolidate its product portfolio over the coming months, reducing the duplication of 3 similar products. ownCloud and Dracoon customers will have to consider the costs and consequences of moving their file sync and share to the platform of the proprietary US vendor. Some customers need an on premise collaboration platform from an established European vendor. Others prioritize a forward-looking platform that integrates a wider range of collaboration capabilities or requires an open source solution. Hundreds of other customers have taken the well-established, easy, and fast migration path to Nextcloud, benefiting from increased functionality, usability, performance, and security. We are certain that Nextcloud will continue to be an appropriate platform for these needs, just like it is for the Archdiocese of Cologne or the Sorbonne University, to name two recent customers. Most customers looking for an on premise document sync and share platform need a reliable, open source, or fully European solution that complies with EU privacy regulations. The US tech firms that fall under the US CLOUD Act seriously hinder compliance efforts. Nextcloud, as the market leader in this space, as well as smaller competitors like ownCloud and Dracoon, delivers this US-independent, compliant, and fully open platform to tens of thousands of customers across the globe."
author = "Jos Poortvliet"
