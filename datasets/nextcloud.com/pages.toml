["https://nextcloud.com/about"]
title = "About Nextcloud"
description = "We are a sustainable company, aiming for long term stability, not a short term sale. So no growth at all cost: protect people, society and the environment."
full_description = "We are a sustainable company, aiming for long term stability, not a short term sale. So no growth at all cost: protect people, society and the environment. We believe that privacy is a fundamental human right. Everyone has the right of a secure communication. It’s the main motivation behind all our products. We trust each other to have shared goals and make decisions based on it. This enables remote and flexible work and decentralized, collaborative decision making over most things. We use and support open standards as much as possible. We don’t lock people in to proprietary formats. You can import and export everything. We are building decentralized products as alternative to centralized platforms. People can choose what they want and where they want it. Working in the open with a broad community leads to better results. We trust our community and empower them to take ownership over what they contribute to and have as much access to and control over it as legally and practically possible. Diverse teams and communities make us better and more innovative. We support people marginalized in open source to get involved and thrive. We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize"
