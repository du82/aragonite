title = "Nextcloud will be present at the Digitaler Staat 2025 event in Berlin - Nextcloud"
description = "Looking for another compelling reason to attend Digitaler Staat event in March? From March 18 to March 19, you can find Nextcloud at Digitaler Staat event in Berlin. You can participate in our panel session, visit our booth and engage with our team! Nextcloud will be showcasing how governments can become digitally sovereign and safeguard […]"
full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize From March 18 to March 19, you can find Nextcloud at Digitaler Staat event in Berlin. You can participate in our panel session, visit our booth and engage with our team! Nextcloud will be showcasing how governments can become digitally sovereign and safeguard confidential data of its administration, citizens and contacts with Nextcloud Hub. Governments are increasingly moving away from foreign cloud providers amid rising concerns about digital sovereignty and Nextcloud has emerged as the most deployed self-hosted private cloud solution in government. Frank founded the ownCloud project in 2010 to put home users and enterprises back in control of their data. To bring file sync and share technology to the next level and better align to the needs of users and customers he founded Nextcloud in 2016 and has been tirelessly working to realize his vision ever since. Ralf brings 30+ years of sales experience, including a decade in the public sector, with expertise in telecommunications, HR, and IT. He has driven digital transformation for government, education, and healthcare institutions. At Nextcloud, he helps organizations securely manage their data, empowering them to maintain control while collaborating seamlessly. Fabian worked for various industries always close to the customer and has been in the IT industry now for several years with a focus on customer relationship management. He is passionate about innovative and new technologies and his primary goal is to help our customers to fulfill their vision. Meet us at FOSSASIA Summit 2025 in Bangkok! We are delighted to showcase and discuss our latest release, Nextcloud Hub 10. Join us at the FOSSASIA Summit 2025 on March 13-15th. On the 13th of March at 11:30 am you will have a chance to hear Frank speak about How to build a sustainable Open Source […]"
