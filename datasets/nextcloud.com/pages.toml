description = "Main brand color"
full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize With these guidelines, we wish to encourage widespread use of the Nextcloud trademarks by the Nextcloud community while managing that use to protect the distinctive value of the trademarks and avoid confusion on the part of Nextcloud users and the general public. It is fundamentally important to us that any permitted use you make of the Nextcloud marks be of the highest quality and integrity and meet the highest standards. To ensure this is the case, we reserve the right to revoke your permission at any time and for any reason. We acknowledge and support your right to make “fair use” of the Nextcloud marks, and do not mean to suggest with these guidelines that our permission is required in such cases. We cannot, however, tell you categorically what will and will not qualify as a “fair use.” Only to be used when there is no space for text due to size. We never use the text without our logo, and avoid horizontal arrangement. When using our logo, please ensure that you give it room to breathe! Overall rule would be to add a blank space of half the height of the logo on all sides. When referring to Nextcloud make sure that it is spelled correctly. Nextcloud is ONE word and must not be separated into two words. It has one capital, at the beginning, NextCloud is NOT a correct spelling. Please contact us if you need assistance regarding these guidelines, e.g. for discussing your case or requesting permission, by using our contact form. Nextcloud offers a modern, on premise content collaboration platform with real-time document editing, video chat & groupware on mobile, desktop and web."
