["https://nextcloud.com/include"]
title = "Nextcloud Include - Supporting diversity in open source"
description = "Diversity strengthens a community. The Nextcloud Include initiative helps underrepresented groups to join the Nextcloud project, building an inclusive and diverse space where we collaborate and develop world class software"
full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize Diversity strengthens a community. The Nextcloud Include initiative helps underrepresented groups to join the Nextcloud project, building an inclusive and diverse space where we collaborate and develop world class software. We sponsor the travel & accommodation to help people from underrepresented groups in opensource to join Nextcloud events. There are many areas in Nextcloud you can get involved in. From technical tasks like building an app, design, coding on the front or back-end to translation and helping out on the forums. We want to enable everyone to get involved and we recognize that the privileged nature of the tech community is an extra barrier for underrepresented groups. We hope to help lower that barrier by connecting you directly to somebody who wants to help you. The Nextcloud community meets regularly at big hackweeks or smaller ad-hoc ones all over Europe. We also host our yearly Nextcloud Conference and attend many events like FOSDEM and SCALE. We want to support participants from underrepresented groups in Open Source to join these events by sponsoring part or the whole of their transportation and accomodation costs. If you would like to join a Nextcloud event, let us know! We typically support 80% of the travel & hotel costs but we can accommodate you if that would not be sufficient. Don’t hesitate to reach out and ask! If you don’t think you are part of an underrepresented group in Open Source and need travel support, please do not reach out here. You can read more about our community travel support program here. Nextcloud is always on the look-out for new talents and we’d like to give beginning developers, marketeers and sales people a chance to learn practical skills with us! We encourage people from underrepresented groups to apply for these positions and to send their resume."
