["https://nextcloud.com/human-rights-policy"]
title = "Human Rights Policy - Nextcloud"
description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally!            See our Privacy Policy for more information.                Customize"
full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize Human rights are rights inherent to all human beings, regardless of race, sex, nationality, ethnicity, language, religion, or any other status. Human rights include the right to life and liberty, freedom from slavery and torture, freedom of opinion and expression, the right to work and education, and many more. Everyone is entitled to these rights, without discrimination. International human rights law lays down the obligations of Governments to act in certain ways or to refrain from certain acts, in order to promote and protect human rights and fundamental freedoms of individuals or groups. One of the great achievements of the United Nations is the creation of a comprehensive body of human rights law—a universal and internationally protected code to which all nations can subscribe and all people aspire. The United Nations has defined a broad range of internationally accepted rights, including civil, cultural, economic, political and social rights. It has also established mechanisms to promote and protect these rights and to assist states in carrying out their responsibilities. The foundations of this body of law are the Charter of the United Nations and the Universal Declaration of Human Rights, adopted by the General Assembly in 1945 and 1948, respectively. Since then, the United Nations has gradually expanded human rights law to encompass specific standards for women, children, persons with disabilities, minorities and other vulnerable groups, who now possess rights that protect them from discrimination that had long been common in many societies. The Universal Declaration of Human Rights (UDHR) is a milestone document in the history of human rights. Drafted by representatives with different legal and cultural backgrounds from all regions of the world, the Declaration was proclaimed by the United Nations General Assembly in Paris on 10 December 1948 by General Assembly resolution 217 A (III) as a common standard of achievements for all peoples and all nations. It sets out, for the first time, fundamental human rights to be universally protected. Since its adoption in 1948, the UDHR has been translated into more than 500 languages – the most translated document in the world – and has inspired the constitutions of many newly independent States and many new democracies. The UDHR, together with the International Covenant on Civil and Political Rights and its two Optional Protocols (on the complaints procedure and on the death penalty) and the International Covenant on Economic, Social and Cultural Rights and its Optional Protocol, form the so-called International Bill of Human Rights."
