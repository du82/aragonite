["https://nextcloud.com/es/about"]
title = "About - Nextcloud"
description = "Somos una empresa sostenible, buscando la estabilidad a largo plazo, no una venta a corto plazo. Así que nada de crecimiento a toda costa: proteger a las personas, la sociedad y el medio ambiente."
full_description = "Somos una empresa sostenible, buscando la estabilidad a largo plazo, no una venta a corto plazo. Así que nada de crecimiento a toda costa: proteger a las personas, la sociedad y el medio ambiente. Creemos que la privacidad es un derecho humano fundamental. Todo el mundo tiene derecho a una comunicación segura. Es la principal motivación de todos nuestros productos. Respetamos el tiempo y la carga mental de las personas. Por eso hacemos que Nextcloud sea fácil de usar. Confiamos unos en otros para tener objetivos compartidos y tomar decisiones basadas en ello. Esto permite el trabajo remoto y flexible y la toma de decisiones descentralizada y colaborativa sobre la mayoría de las cosas. Todo lo que hacemos es 100% de código abierto. No hacemos núcleo abierto ni extensiones propietarias. Utilizamos y apoyamos los estándares abiertos en la medida de lo posible. No encerramos a la gente en formatos propietarios. Se puede importar y exportar todo. Construimos productos descentralizados como alternativa a las plataformas centralizadas. La gente puede elegir lo que quiere y dónde lo quiere. Trabajar en abierto con una amplia comunidad conduce a mejores resultados. Confiamos en nuestra comunidad y la capacitamos para que se apropie de aquello a lo que contribuye y tenga tanto acceso y control sobre ello como sea legal y prácticamente posible. Los equipos y comunidades diversos nos hacen mejores y más innovadores. Apoyamos a las personas marginadas en el código abierto para que participen y prosperen. Guardamos algunas cookies para contar los visitantes y facilitar el uso del sitio. Esto no sale de nuestro servidor y no es para rastrearte personalmente. Consulta nuestra política de privacidad para obtener más información. Personalización"
