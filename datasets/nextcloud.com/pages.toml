description = "Nextcloud Office supports editing your documents in real time with multiple other editors, showing high fidelity, WYSIWYG rendering and preserving the layout and formatting of your documents."
full_description = "Nextcloud Office supports editing your documents in real time with multiple other editors, showing high fidelity, WYSIWYG rendering and preserving the layout and formatting of your documents. Most people use online services for storing their data, communication and editing documents, often giving up control over their files in exchange for the convenience of online collaboration. With Nextcloud Office, this is no longer a trade-off. Nextcloud Office is Open Source, self-hosted and secure! Besides the powerful features of Nextcloud Office, Nextcloud also comes out of the box with an easy to use collaborative note taking application, Nextcloud Text. Collectives is a collaborative knowledge database or “Wiki”, a trustworthy space to share meeting notes, documents and information dedicated to a project. Nextcloud Tables, the impressive Microsoft SharePoint Lists or Airtables alternative, helps businesses and organizations manage their structured data. With Tables, you can manage your employees’ time off, customer data, health tracking and much more. One application that is very useful during audio/video calls or chat sessions is Nextcloud Whiteboard. It is a collaborative whiteboard with the ability for all participants to draw lines and shapes, take notes and write text, upload images, give a presentation and more. Files created with Whiteboard are saved among other regular files and can thus easily be shared. We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize"
