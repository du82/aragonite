title = "Download and install Nextcloud"
description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally!            See our Privacy Policy for more information.                Customize"
full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize Use the desktop clients to keep your files synchronized between your Nextcloud server and your desktop. Select one or more directories on your local machine and always have access to your latest files wherever you are. Use our Talk desktop client to quickly access your Nextcloud conversations without using the web browser. With the easy access to notifications, calls, screensharing and all your chats from the system tray, you’re always one step ahead. Looking for integration apps like browser add-ins for Passwords, a feedreader and more? Check our app store for integrations! You can already find Nextcloud Desktop client packages included in openSUSE Tumbleweed, Arch Linux, Fedora, Debian and Ubuntu. Packages for Alpine Linux over here. See the latest state and more packages in this post on our forums. Can’t find packages? Ask your distribution or contribute to creating them! Note that all of those packages are community-developed and maintained, Nextcloud currently only provides the Appimage you can download above. Nextcloud Files is using WebDAV, so you can also try out any other client you want! Try also our Microsoft integrations: Sync your files, calendars, contacts and tasks with Outlook or Mozilla Thunderbird The apps allow you to access, sync and upload your data and feature instant upload for photos and videos, upload management and more features. Nextcloud is using open standards like CalDAV, WebDAV and IMAP so many independent third party clients can connect to it. Stay in control of your data! Choose a hosting provider or download the Nextcloud server software for hosting on your own server. Find a Nextcloud provider you can trust! Nextcloud providers from all over the world provide you 2 or more GB of storage on a 100% free single user account, with all the basic Nextcloud apps. Through Simple Signup, we help you get started! Take the default provider (based on your location) or choose another."
