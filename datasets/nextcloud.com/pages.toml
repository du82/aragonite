["https://nextcloud.com/blog/migration-deutsche-telekom-by-t-systems"]
title = "How T-Systems migrated millions of MagentaCLOUD users to Nextcloud - Nextcloud"
description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally!            See our Privacy Policy for more information.                Customize"
full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize MagentaCLOUD’s migration to Nextcloud in 2021 resulted in an easy to use but powerful online document and photo storage for millions of users at Deutsche Telekom. Users can access, share and sync data with custom mobile and desktop clients, and use the integrated online office suite to work on their documents. In all this, they can trust that their data stays safe on the infrastructure of Deutsche Telekom at all times! Deutsche Telekom’s business-customer IT affiliate, T-Systems, led the migration from a third-party platform to the Telekom-hosted, Nextcloud based solution. In order for the millions of Deutsche Telekom users to continue to use the platform, the platform stayed active during the entirety of the six month process. As a result of the migration, all user data is furthermore safely stored but now within their own Open Telekom Cloud (OTC) infrastructure. Nextcloud matched Telekom’s needs for an advanced, modern solution with unrivaled data protection standards, high flexibility and enhancing functionalities. Due to Nextcloud being an open-source, on premise solution, MagentaCLOUD has full control with all user data stored in local data centers in Germany and compliant with the strict German and European data privacy protection laws and regulations including the GDPR. In the Nextcloud 2024 wrap-up, we want to take a moment to celebrate this year's achievements. Join us as we continue to reimagine what’s possible - shaping a world where open source, privacy and connection come together and drive progress for the greater good. Welcome Nextcloud Hub 10. Our latest release comes with reinforced performance in every app, deeper integration across the platform, and dozens of new features that will make your day easier. Organisations, small and large, need a way to ensure the resiliency and digital sovereignty of their operations – an open-source, privacy-respecting alternative to Teams. And today, we present that solution - Nextcloud Talk."
