full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize Nextcloud has been awarded Platinum at the IT Awards 2024! This proves once again that love and support of our community is everything. Today, we celebrate this win together! This recognition, decided by thousands of IT professionals, reflects the trust that our community places in us. It’s an incredible acknowledgment of our efforts to provide a secure, open-source, and flexible platform. The IT Awards, hosted by Vogel IT Media, celebrate outstanding IT solutions across various categories. Being recognized in this highly competitive contest is a testament to the hard work and dedication of our entire team. At Nextcloud, our mission is to enable individuals and organizations to regain control of their data through solutions that prioritize data sovereignty and privacy. Winning the Platinum Award strengthens our commitment to this vision, showing that our approach resonates with users and professionals alike. We are deeply grateful to our community, partners, and customers for their continued support. Your trust drives us to keep innovating and delivering solutions that meet the evolving demands of modern digital collaboration. We look forward to continuing this journey together, building a more open and secure digital future.You can read a full overview of the winners in this article (in German). Welcome Nextcloud Hub 10. Our latest release comes with reinforced performance in every app, deeper integration across the platform, and dozens of new features that will make your day easier. In the Nextcloud 2024 wrap-up, we want to take a moment to celebrate this year's achievements. Join us as we continue to reimagine what’s possible - shaping a world where open source, privacy and connection come together and drive progress for the greater good. Organisations, small and large, need a way to ensure the resiliency and digital sovereignty of their operations – an open-source, privacy-respecting alternative to Teams. And today, we present that solution - Nextcloud Talk."
