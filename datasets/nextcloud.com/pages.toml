["https://nextcloud.com/blog/bechtle-and-nextcloud-offer-digitally-sovereign-collaboration-services-for-the-public-sector"]
title = "Bechtle and Nextcloud offer digitally sovereign collaboration services for the public sector - Nextcloud"
description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally!            See our Privacy Policy for more information.                Customize"
full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize Amidst the growing threats to Europe’s sovereignty, the public sector is turning toward Nextcloud. In Germany, Bechtle and Nextcloud announce a complete managed collaboration platform that is ready for immediate deployment for federal and local authorities, without extensive preparation and a lengthy tender process. The scope of services includes setup, operation, hotline support and live system monitoring. Through existing framework agreements, all federal authorities, numerous state administrations and many other public institutions can obtain the digitally sovereign collaboration platform as an immediately usable SaaS service or as an on premise service. See the full press release (in German). Today, we also announce that Bechtle supports the Nextcloud Enterprise day, taking place April 24 in Munich. We invite you to join the conversation with the forward thinkers of the global IT. Save April 24 in your calendar and register today to secure your seat! Learn more in the sponsorship announcement. The digitally sovereign collaboration solution from Bechtle and Nextcloud can be hosted either in a German data center owned by Bechtle, the ITZ Bund or another cloud provider. The functionality can be adapted to individual needs and ranges from file synchronization and data sharing to the use of chat, video conferences, office applications, email, calendar and contacts to innovative AI functions and support for smartphones and tablets. With a high degree of flexibility and scalability from 50 to millions of users, the digitally sovereign collaboration platform is suitable for both public institutions and companies of all sizes. The open source nature of Nextcloud provides complete transparency and improves security. Nextcloud’s solutions are already being used successfully by many customers in the public sector. The joint offer guarantees the highest standards of security and data protection based on open source technology."
