["https://nextcloud.com/blog/category/general"]
title = "General Archives - Nextcloud"
description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally!            See our Privacy Policy for more information.                Customize"
full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize In the Nextcloud 2024 wrap-up, we want to take a moment to celebrate this year's achievements. Join us as we continue to reimagine what’s possible - shaping a world where open source, privacy and connection come together and drive progress for the greater good. By 2025 the most popular Microsoft Office products fall out of support. We believe there's a need for a real Microsoft 365 alternative that protects your privacy. In this article, we find out how open-source AI gets you your privacy back and explore examples of reliable AI models that you can use in your ecosystem. Today, the Open Source Initiative has released its first official definition of Open Source AI. This is an important milestone. Let me explain why. Discover Nextcloud Whiteboard, a collaborative digital whiteboard that enables sketching, drawing, planning and brainstorming on a new level. The first ethical, open-source AI assistant that can get a multitude of tasks done for you without compromising your data. Discover how the Deutsche Lebens-Rettungs-Gesellschaft uses Nextcloud to provide water safety to all! Nextcloud Hub 8 enables the federated chat feature that let you connect users from different instances via group chats. A CrowdStrike update took down countless Microsoft systems, disrupting flights, surgeries, banking and more all over the world. The incredible impact this single outage had shows the importance of digital resilience, especially in the public sector. Nextcloud offers a modern, on premise content collaboration platform with real-time document editing, video chat & groupware on mobile, desktop and web."
