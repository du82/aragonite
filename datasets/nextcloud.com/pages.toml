full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize In this article, we find out how open-source AI gets you your privacy back and explore examples of reliable AI models that you can use in your ecosystem. Today, the Open Source Initiative has released its first official definition of Open Source AI. This is an important milestone. Let me explain why. Discover the challenges of the ethical use of AI and find out how to employ AI tools without risking your privacy, compliance, and sustainability. We bring you a major update to the Nextcloud AI Assistant, plus the news we work with several big hosting providers like IONOS and OVHcloud to bring AI-as-a-Service options to you! Dropbox has recently ‘dropped’ a new enabled-by-default feature that has users worried about their data privacy. As almost every company in tech these days, Dropbox is latching onto the new capabilities of AI – specifically OpenAI – with a questionable approach to user privacy. Last... Over the last year, AI has become a popular topic. Some is hype, some is substance. Some is good, some is bad. We want to give you the good, not the bad, and ignore the hype! AI has a ton of opportunity – but also... Nextcloud offers a modern, on premise content collaboration platform with real-time document editing, video chat & groupware on mobile, desktop and web."
