["https://nextcloud.com/blog/nextcloud-2024-wrap-up"]
title = "Nextcloud powering the digital workspace of tomorrow: 2024 in review - Nextcloud"
description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally!            See our Privacy Policy for more information.                Customize"
full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize We at Nextcloud have remained true to our vision: empowering collaboration without compromising on privacy. This year has been a testament to that commitment. Together with the passion of our global team and the support of our community we have not just build the best open-source collaboration tools, but expanded our dedication to open source itself. In this annual wrap-up, we want to take a moment to celebrate this year’s achievements. Join us as we continue to reimagine what’s possible – shaping a world where open source, privacy and connection come together and drive progress for the greater good. Nextcloud is used around the world by private individuals, communities, enterprises, and governments. In 2024, millions of new users gained access through hundreds of new enterprise customers. In the wider community, exact numbers are difficult to come by but there are some 400-500K servers online and this number also continues to grow steadily, with tens of thousands of new deployments across the globe from the US to France, from Australia to Indonesia and South Africa to Hawaii. These numbers convert in the change Nextcloud brings about, contributing to a more connected, privacy-respecting, transparent, and safer digital world – where we interact with government services, access our education, cast votes in elections, fill forms on websites and call our colleagues and friends through video chat. This year, our team has grown significantly, reflecting our success. With 20% increase in size we are now 118 strong united by a shared vision across 23 countries. That includes 7 working students who get a chance to learn the ropes at Nextcloud. While we have expanded into a bigger office space in Berlin, we remain proudly remote-first, reflecting the flexibility and global collaboration that define our culture."
