["https://nextcloud.com/events"]
title = "Nextcloud events around the world"
description = "Nextcloud is represented at conferences and organizes its own meetups and events all across the globe. And you can participate!"
full_description = "Discover and attend our own events such as Nextcloud Community Conference and Nextcloud Enterprise Day. We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize Nextcloud is represented at conferences and organizes its own meetups and events all across the globe. And you can participate! Nextcloud organizes and participates in many events around the globe and here you can find details on where you can meet us! Virtual events have gained significant popularity in recent years, and Nextcloud has also observed this trend. As a result, we are committed to providing high-quality information through various virtual formats. Nextcloud is active at conferences and events globally. Check out our events calendar to see where we’re headed next and join us to connect, learn, and engage with our experts and the community! The most exciting event on the yearly calendar for Nextcloud is of course our very own Nextcloud Conference! Over 300 Nextcloud community members get together for a full week. During week days, we write and discuss code while on the weekend we have an exciting, educational and inspirational program with keynotes, lightning talks and workshops around private, self-hosted cloud technologies. You can read a report of our last conference in this blog and if you would like to join the upcoming conference, register here. The Nextcloud Enterprise Day provides IT professionals like project managers and decision makers the opportunity to define their own strategy to get the most out of their content collaboration platform. You get the opportunity to discuss changing demands in business and their impact on IT security. Our experts will help you get ahead of the curve, and benefit from the opportunities while avoiding the downsides of the cloud. Digital sovereignty isn’t just a concept —it’s the foundation for the future of progress and innovation. The Nextcloud Summit is a premier event that goes beyond the typical technology conversation. Here, you will gain the tools, insights, and strategies to drive immediate change while contributing to a greater mission: building a decentralized, open, and secure future for everyone. Designed for top industry leaders, visionaries, and open-source experts, the Nextcloud Summit is the platform where change begins. Together, we will shape the future of digital collaboration."
