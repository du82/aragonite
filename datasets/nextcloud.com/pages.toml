["https://nextcloud.com/es/athome"]
title = "Self-hosted cloud collaboration platform for home users - Nextcloud"
description = "1. Simple sign-upThis is by far the easiest solution. We have selected a range of providers who run a Nextcloud for you. Of course, it is still up to you to trust the server of your choice, as there are many.Find a provider here"
full_description = "This is by far the easiest solution. We have selected a range of providers who run a Nextcloud for you. Of course, it is still up to you to trust the server of your choice, as there are many. If you want to be even more in control of your data and have some more time and experience, you can run your own Nextcloud instance on the server of your choice. Of course, you don’t need to have your data on some server far away from you. Want to run your Nextcloud at home? You can do that too. Nextcloud is open source – there are no limitations and you can inspect, integrate, extend and modify Nextcloud however you want. Easy to use user interface which comes with search functionality, favorites, tags and even more ways to quickly reach the files you need. Run Nextcloud yourself, at home or in a cloud you trust. You can even buy a ready-to-go device with Nextcloud! Powerful, integrated logging, two-factor authentication and NIST compliant password policy control functionalities Fine-grained control from mobile, desktop or the Web over data access and sharing capabilities. Pick from the list of users and groups, stored either locally or on another, authorized, server. The Nextcloud Dashboard is your starting point of the day, giving you an overview of your upcoming appointments, urgent emails, chat messages, incoming tickets, latest tweets and much more! Users can set their status so others know what they are up to.. Operate your own secure and private audio/video communication service! You can access it through a browser, invite family or friends and collaborate in a group through secure, end to end encrypted audio and video communication. The WebRTC, peer to peer communication channel can not be intercepted even by the admin of the server. The talk app also supports chat and comes with mobile applications for Android and iOS so you can call others from your mobile phone! We are deeply committed to protecting the safety of your data and we’re certain that Nextcloud offers the best security in the self hosted file sync and share world, because: we follow industry best practices around security (aligned to ISO27001) we offer some of the highest open source security bug bounties we integrate unique in-transit, server-side and client-side end-to-end encryption technologies."
