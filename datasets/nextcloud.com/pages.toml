["https://nextcloud.com/blog/deges-handling-22-billion-worth-of-complex-infrastructure-projects"]
title = "DEGES: handling 22 billion worth of complex infrastructure projects - Nextcloud"
description = "DEGES is a project management company for complex infrastructure projects, founded by the Federal Government and five German states in 1991. In recent years, more states have joined as stakeholders and customers. DEGES plans transport routes (road, rail or waterway), coordinates, optimizes and manages the work of all external service providers (planners, architects, land purchasers, […]"
full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize DEGES is a project management company for complex infrastructure projects, founded by the Federal Government and five German states in 1991. In recent years, more states have joined as stakeholders and customers. DEGES plans transport routes (road, rail or waterway), coordinates, optimizes and manages the work of all external service providers (planners, architects, land purchasers, construction supervisors, construction companies and other service providers), maintains control over costs, plans and construction, handles invoicing and hands over the finished structure to the public clients according to the highest quality standards, within time and budget. Today, 350 DEGES employees in Berlin headquarters, Bremen, Hamburg, Düsseldorf and Frankfurt (Main) are responsible for the expansion and new construction of more than 2,300 km of federal highways with a contract volume of over € 22 billion. With the increasing expansion of the scope of tasks and activities DEGES faced a new challenge. Facing this required a realignment of IT in the organization, the initial trigger for the introduction of a file sync and share solution. “We needed a unified document exchange platform to organize collaboration across departments and with external parties.” The goal was to provide a unified, easy to use, efficient project collaboration platform that can be managed by the employees themselves. DEGES’s requirements included: DEGES initially tested ownCloud and after experiencing a number of issues they decided to look for a new platform that fulfilled all their requirements. They wanted to migrate & integrate into the existing infrastructure and workflows. That is when the decision to move to Nextcloud was made: a promising project with a roadmap for deeper, more integrated collaboration and communication that fulfilled their requirements."
