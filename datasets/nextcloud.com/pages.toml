title = "Nextcloud grew customer base 7x, added over 6.6 million lines of code and doubled its team in 2017 - Nextcloud"
description = "2017 has been the year of Nextcloud, if you would ask Google Trends: We’re clearly the project with the greatest momentum in the self-hosted Enterprise File Sync and Share market, steaming past the likes of Citrix Sharefile, Egnyte, Accellion, FileCloud and ownCloud. On the good news that our iOS client hit 300.000 downloads with a […]"
full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize 2017 has been the year of Nextcloud, if you would ask Google Trends: We’re clearly the project with the greatest momentum in the self-hosted Enterprise File Sync and Share market, steaming past the likes of Citrix Sharefile, Egnyte, Accellion, FileCloud and ownCloud. On the good news that our iOS client hit 300.000 downloads with a 4.7 star rating and our Collabora Online app was downloaded over 100.000 times in 2017, we are excited to share that Nextcloud GmbH has grown 7-fold in 2017, fueled by its unique technology. With already over 100 customers and partners active in Europe, North, Central and South America, Asia and Australia, Nextcloud continues to be a healthy and fast-growing enterprise. New and existing regulations like GDPR and HIPAA increase pressure on IT departments to find solutions that keep customers and patients’ data secure. We see customers come in from the automotive, banking and finance, manufacturing, services and technology markets as well as government and education. Major examples include SIEMENS, the TU Berlin, Raiffeisen, R+V betriebskrankenkasse, MMEC MANNESMANN and many others. We’ve blogged many times about how Nextcloud helps companies with compliance. Activists in Europe are gearing up to enforce compliance with GDPR by suing companies. Local data centers are often not a sufficient solution for the legal challenges of local regulations and public clouds continue to pose other threats as was shown just days ago with Spectre and Meltdown. All this contributes to the strong trend towards self-hosting. Nextcloud offers the premier solution, with a host of unique features from powerful File Access Control capabilities, Ransomware protection and both server-side and full End-to-end Encryption to one of the most intuitive interfaces in the industry and easy, deep integration in existing infrastructure."
