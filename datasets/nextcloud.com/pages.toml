["https://nextcloud.com/blog/ai-in-nextcloud-what-why-and-how"]
title = "AI in Nextcloud: what, why and how - Nextcloud"
description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally!            See our Privacy Policy for more information.                Customize"
full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize Over the last year, AI has become a popular topic. Some is hype, some is substance. Some is good, some is bad. We want to give you the good, not the bad, and ignore the hype! In Nextcloud Hub 4 and 5, we’ve focused on providing you the best tools that AI has to offer. Benefits like improving your work productivity and jump starting creativity, AI features can enhance your Nextcloud experience. To fit everyone’s needs, we offer several types of integrations for AI, from completely self-hosted options to integrations with external services. If you’re interested in setting up Nextcloud’s AI features on your instance, then keep reading for a breakdown of how to enable and use each one! 💙 First, let’s understand the difference between self-hosted AI features versus integrations from external services. All self-hosted AI features are built-in and only run on YOUR server, meaning no data leaves your premises and you’re in full control. Our self-hosted options can be installed from the Nextcloud App Store. Some are built-in and some require some command line commands to be run to download Ai models. We also offer AI features using remote AI services from companies like DeepL and OpenAI (ChatGPT and DALL·E). These features can be enabled on your server but data from the app is sent to the third party. Note that nothing is ever sent to external services by default unless you explicitly enable those features or install the related apps. However, if you like these services, then they are available to you! For some use cases, tools like ChatGPT might be a reasonable solution, while for other data, it is paramount to have a local, on-prem, open solution. To differentiate these, we developed an Ethical AI Rating. For every AI feature that Nextcloud supports, a rating is established. This shows you the risks you take with your data is when using a feature and it gives you a quick insight into the ethical implications of your choice."
author = "Mikaela Schneider"
year_published = 2023
year_updated = 2024
