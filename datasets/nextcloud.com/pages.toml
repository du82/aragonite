["https://nextcloud.com/blog/telekom-and-nextcloud-offer-collaboration-platform-for-european-data-sovereignty-and-gdpr-compliance"]
title = "Deutsche Telekom and Nextcloud offer Collaboration Platform for European Data Sovereignty and GDPR compliance - Nextcloud"
description = "We are very excited to announce a collaboration with Deutsche Telekom, Europe’s largest telecommunications company! Both Deutsche Telekom and Nextcloud GmbH support the GAIA-X initiative for building a data infrastructure based on European standards. Data on the joint collaboration platform never leave strict German jurisdiction and users do not have to worry about data compliance […]"
full_description = '''We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize We are very excited to announce a collaboration with Deutsche Telekom, Europe’s largest telecommunications company! Both Deutsche Telekom and Nextcloud GmbH support the GAIA-X initiative for building a data infrastructure based on European standards. Data on the joint collaboration platform never leave strict German jurisdiction and users do not have to worry about data compliance issues. With the quickly growing demand for online productivity technologies that preserve the digital sovereignty of their users and a European-wide push for technology providers to get together and deliver those, the joint offering provides the scaleable and comprehensive digital collaboration space businesses, educational organizations governments need to maintain productivity during the Covid crisis and after. <img decoding="async" class="banner" src="https://nextcloud.com/media/Telekom-and-Nextcloud-small.png" alt="image with Nextcloud and Telekom logos on a globe background"/> The managed solution is based on Nextcloud hub, delivering on the needs of the collaboration of modern organizations with secure data and document exchange with online editing capabilities, chat and video conferencing as well as task and calendar management. Users can access data through the browser, desktop and mobile application interfaces and data is hosted in Deutsche Telekom’s’ most modern data centers in the EU to guarantee the scalability, reliability and security enterprises require. 2021 will be a year of rebuilding our economies and the second wave of Covid-19 has further accelerated the need for remote collaboration, with many employees working from home. At the same time, the increase frequency of digital attacks and risks from privacy violations have increased awareness of security and digital sovereignty. There is a clear demand from organizations and policy makers for better protection of customers’ data, more transparency around security and data storage and respect for privacy from cloud vendors. In response, Telekom and Nextcloud have partnered up to provide an open source, 100% EU hosted, transparent and privacy respecting collaboration platform.'''
