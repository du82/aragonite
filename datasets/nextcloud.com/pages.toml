["https://nextcloud.com/fr/about"]
title = "À Propos - Nextcloud"
description = "Nous sommes une entreprise durable, qui vise la stabilité à long terme et non la vente à court terme. Pas de croissance à tout prix : nous protégeons les personnes, la société et l'environnement."
full_description = "Nous sommes une entreprise durable, qui vise la stabilité à long terme et non la vente à court terme. Pas de croissance à tout prix : nous protégeons les personnes, la société et l'environnement. Nous pensons que la protection de la vie privée est un droit humain fondamental. Chacun a le droit de communiquer en toute sécurité. C'est la principale motivation de tous nos produits. Nous respectons le temps et la charge mentale des gens. C'est pourquoi nous rendons Nextcloud facile à utiliser. Nous avons confiance en chacun pour avoir des objectifs communs et prendre des décisions en conséquence. Cela permet un travail à distance et flexible et une prise de décision décentralisée et collaborative sur la plupart des sujets. Tout ce que nous faisons est 100% open source. Nous ne développons pas de noyau ouvert ni d'extensions propriétaires. Nous utilisons et soutenons des normes ouvertes autant que possible. Nous n'enfermons pas les gens dans des formats propriétaires. Vous pouvez tout importer et exporter. Nous construisons des produits décentralisés comme alternative aux plateformes centralisées. Les gens peuvent choisir ce qu'ils veulent et où ils le veulent. Travailler de manière ouverte avec une large communauté permet d'obtenir de meilleurs résultats. Nous faisons confiance à notre communauté et lui donnons les moyens de s'approprier ce à quoi elle contribue et d'y avoir le plus d'accès et de contrôle possible, tant sur le plan légal que pratique. La diversité des équipes et des communautés nous rend meilleurs et plus innovants. Nous aidons les personnes marginalisées dans l'open source à s'impliquer et à s'épanouir. Nous enregistrons certains cookies pour compter les visiteurs et faciliter l'utilisation du site. Ces données ne quittent pas notre serveur et ne sont pas destinées à vous suivre personnellement ! Consultez notre politique de confidentialité pour plus d'informations Personnaliser"
