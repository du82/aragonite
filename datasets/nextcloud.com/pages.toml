["https://nextcloud.com/blog/nextcloud-founder-earns-european-free-software-award"]
title = "Nextcloud founder earns European Free Software Award - Nextcloud"
description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally!            See our Privacy Policy for more information.                Customize"
full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize Earlier today, our founder Frank Karlitschek accepted the honorary SFS Award for ongoing contribution to the mission of Free Software. The award is a highlight of the 20th annual SFSCON dedicated to promotion and implementation of FOSS in Europe and beyond. Image source: NOI Techpark European SFS Award is a big part of the South Tyrol Free Software Conference (SFSCON), an event centered around promotion and implementation of the Free Software culture. Each year, the award is presented to an individual who, according to the SFS community, has made a meaningful impact in advancing the principles and adoption of free software in their respective communities and in the broader software industry. In the 2023 edition, Frank Karlitschek earns the honor, dedicating the award to everyone participating in the Nextcloud project. I accept this award in the name of Nextcloud, our dynamic and dedicated community, and a hardworking team of bright individuals who made it happen. Today, we all win! In previous years, the European SFS Award has been given to the pioneers of Free Software representing a wide array of backgrounds including software engineering and research, open source project coordination, and free software advocacy. To the Nextcloud community, this is a milestone that recognizes our collective impact on the FOSS industry and the European IT as a whole. “He is not only a gifted technologist, but also a champion of the idea of digital freedom as a universal right. With his work he lives the ideals of transparency, privacy, and individual control over digital information, but he also laid the foundation for a diverse and engaged community.” SFSCON is one of Europe’s most established annual events focused on Free Software that has a history dating back to 2004. The event’s mission is the promotion of FOSS in digital infrastructures, as a means of creating the environment for better innovation and healthy competition. The event takes place in person in South Tirol, Italy."
author = "Mikhail Korotaev"
