["https://nextcloud.com/blog/german-federal-administration-relies-on-nextcloud-as-a-secure-file-exchange-solution"]
title = "German Federal Administration relies on Nextcloud as a secure file exchange solution - Nextcloud"
description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally!            See our Privacy Policy for more information.                Customize"
full_description = '''We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize <img decoding="async" class="alignright size-full wp-image-3932" src="https://nextcloud.com/wp-content/uploads/2019/10/Informationstechnikzentrum_Bund_logo.svg_.png" alt="" width="400" height="244" />Nextcloud is pleased to announce that the German Federal Information Technology Center (ITZBund) of German Federal Administration has chosen Nextcloud as their solution for efficient and secure file sharing and collaboration in a public tender. Nextcloud is operated by the ITZBund, the central IT service provider of the federal government, and made available to around 300,000 users. ITZBund uses a Nextcloud Enterprise Subscription to gain access to operational, scaling and security expertise of Nextcloud GmbH as well as long-term support of the software. ITZBund is the central IT service provider of the German federal government and operates IT Services for over one million administrative and industrial users. It emerged from the merger of the Federal Agency for Information Technology (Division of the Federal Ministry of the Interior), the Federal Agency for IT Services (Division of the Federal Ministry of Transport and Digital Infrastructure) and the Center for Information Processing and Information Technology (division of the Federal Ministry of Finance). ITZBund employs about 2.700 people, mostly IT specialists, engineers and network and security professionals. Storing and exchanging documents is central to productivity in an office. Cloud services offer powerful features to sync, share and collaborate on documents, but risk losing control over data. Nextcloud solves this conundrum, giving enterprises improved productivity without the loss of control over data locality and access associated with public clouds. Nextcloud offers a modern approach to collaboration that is familiar and easy to use for a new generation of employees and lets companies consolidate multiple technologies in one seamless platform. Being quick to deploy and easy to implement, it integrates deeply in existing infrastructure. This makes implementing Nextcloud the quickest way to bring data handling into compliance with various regulations like GDPR and HIPAA.'''
