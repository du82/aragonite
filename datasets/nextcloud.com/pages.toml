["https://nextcloud.com/fr/athome"]
title = "Nextcloud à la maison - Nextcloud"
description = "1. Une inscription simpleC'est assurément la solution la plus simple. Nous avons sélectionné une série de fournisseurs qui peuvent gérer Nextcloud pour vous. Bien entendu, c'est à vous de faire confiance à la solution de votre choix, car il y en a beaucoup. Le plus intéressant : vous pouvez ne pas être seul sur votre propre serveur ! Vous pouvez partager des données d'un serveur Nextcloud avec des utilisateurs d'un autre serveur, tout comme vous pouvez envoyer des courriels de Hotmail à Gmail (mais dans ce cas, Google et Microsoft ne verront pas vos fichiers).Trouvez un fournisseur ici"
full_description = "C'est assurément la solution la plus simple. Nous avons sélectionné une série de fournisseurs qui peuvent gérer Nextcloud pour vous. Bien entendu, c'est à vous de faire confiance à la solution de votre choix, car il y en a beaucoup. Le plus intéressant : vous pouvez ne pas être seul sur votre propre serveur ! Vous pouvez partager des données d'un serveur Nextcloud avec des utilisateurs d'un autre serveur, tout comme vous pouvez envoyer des courriels de Hotmail à Gmail (mais dans ce cas, Google et Microsoft ne verront pas vos fichiers). Si vous voulez davantage contrôler vos données et que vous avez du temps et les connaissances nécessaires, vous pouvez lancer votre propre installation de Nextcloud sur le serveur de votre choix. Nous essayons de rendre cela aussi simple que possible, et nous avons une communauté bienveillante où les contributeurs seront heureux de vous aider. Bien entendu, vous n'avez pas besoin d'avoir vos données sur un serveur éloigné de chez vous. Vous voulez faire fonctionner votre Nextcloud chez vous ? C'est tout à fait possible. Par exemple, vous pouvez le faire sur un Raspberry Pi. Vous pouvez aussi opter pour un routeur avec Nextcloud intégré. Gardez vos données à la maison ! Le tableau de bord Nextcloud est votre point de départ de la journée, vous donnant un aperçu de vos rendez-vous à venir, des emails urgents, des messages de tchat, des tickets entrants, des derniers tweets et bien plus encore ! Les utilisateurs peuvent définir leur statut afin que les autres sachent ce qu'ils font. L'interface web simple vous permet de partager des fichiers avec d'autres utilisateurs sur votre serveur, de créer et d'envoyer des liens publics protégés par mot de passe, de laisser d'autres personnes télécharger des fichiers sur votre cloud et de recevoir des notifications sur votre téléphone et votre bureau lorsqu'un utilisateur sur un autre serveur de cloud partage des fichiers directement avec vous. Vous pouvez également effectuer toutes ces opérations à partir de votre ordinateur de bureau ou vos appareils mobiles."
