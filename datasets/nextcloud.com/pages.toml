["https://nextcloud.com/blog/ionos-and-nextcloud-together-for-more-data-sovereignty"]
title = "IONOS and Nextcloud together for more data sovereignty - Nextcloud"
description = "With more than eight million customer contracts, IONOS is the leading European provider of cloud infrastructure, cloud services and hosting services. IONOS is Europe’s largest cloud and hosting provider and number two in the world! Nextcloud has teamed up with IONOS to offer users increased digital sovereignty: control over their data. “Data sovereignty is an […]"
full_description = '''We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize <img decoding="async" class="wp-image-81501 size-medium alignright" src="https://nextcloud.com/wp-content/uploads/2022/11/LOGO_IONOS.svg" alt="1&amp;1 IONOS SE" width="300" height="300" /> With more than eight million customer contracts, IONOS is the leading European provider of cloud infrastructure, cloud services and hosting services. IONOS is Europe’s largest cloud and hosting provider and number two in the world! Nextcloud has teamed up with IONOS to offer users increased digital sovereignty: control over their data. “Data sovereignty is an essential requirement for many customers when using cloud services to protect trade secrets. This applies to customers from the public sector as well as the private sector,” explains Frank Karlitschek, CEO of Nextcloud. Achim Weiß, CEO of IONOS, adds: “As German providers, IONOS and Nextcloud guarantee their users the sovereignty over their data – we rule out access by third parties as permitted by the US CLOUD Act. Our cooperation therefore gives Nextcloud customers the legal security they need”. Nextcloud customers can use their data and applications on the IONOS infrastructure, allowing them to customize and add additional functionality under full control. Both IONOS and Nextcloud are headquartered in Germany and are therefore subject to German legislation alone. Users therefore receive maximum protection against access based on the US CLOUD Act. In addition, the two companies rely on open source and thus differ from the major US providers. “The consistent use of open standards ensures transparency. Anyone can view the code at any time, check it for security gaps and change it if necessary. Moreover, only on an open source basis is it easy to link data and applications with other systems,” emphasizes Achim Weiß. In the coming months, the two companies want to further deepen their partnership and promote greater data sovereignty awareness. “Many companies and government agencies are putting much of their data in the hands of cloud providers from the USA. Nextcloud and IONOS want to work together to raise awareness of the fact that sensitive data in particular is better off with European providers,” says Achim Weiß.'''
author = "Jos Poortvliet"
year_published = 2020
year_updated = 2022
