full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize TrueNAS is an Open Source powered storage platform that scales from private home servers to 20PB+ storage platforms and has over a million deployments. Nextcloud Hub is be officially supported on TrueNAS systems with easy install of the official Nextcloud Hub app requiring just a few clicks. Together, Nextcloud and TrueNAS provide an extremely versatile and reliable collaboration and data storage platform. The cloud in your home or office. With NextBox by Nitrokey you get everything you need for your secure and private cloud It features easy installation and activation, selection of hardware among 10+ boards, easy use of external hard drives for storage, domain name for device and access to device through Internet, automatic HTTPS setup and more applications. NextcloudPi is a community effort building a preinstalled and preconfigured Nextcloud setup initially developed for Raspberry Pi and similar development board devices. It includes a management interface with all the tools you need to self host your private data in a single package and works on a variety of hardware. The Turris MOX: Cloud bundle is a ready-to-go kit with a 64bit dualcore CPU, 1GB RAM, wifi connectivity and four USB 3.0 ports for attaching storage. The MOX makes it easy for users to set up RAID storage and Nextcloud for hosting and can be extended with other router modules like network ports. Behind the award-winning designed device by struktur AG operates a secure video chat and file exchange solution for small enterprise usage. It offers Strong end-to-end encrypted audio and video chat, a Nextcloud based file sync and share solution and advanced security features with a silicon hardware key generator. The Spreedbox offers an optional SIP gateway, enabling web conferencing participants to dial in through a traditional telephone connection."
