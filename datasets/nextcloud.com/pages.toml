["https://nextcloud.com/education"]
title = "Nextcloud Enterprise for Universities and schools"
description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally!            See our Privacy Policy for more information.                Customize"
full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize Educators are entrusted with the future of our children. Protecting their privacy is a key responsibility. Students need to collaborate using tools which are as easy to use as the consumer platforms they are familiar with, or they will work around the tools provided. Remote learning continues to grow in importance and any platform deployed needs to have first-class support for studying from home. Students and especially researchers create large amounts of data which has to be handled efficiently and at competitive cost. Parents and society at large expect nothing but the best when it comes to the safety of their children, so privacy protection is critical. Nextcloud offers a modern, easy to use content collaboration platform accessible trough mobile, desktop and web interfaces. Students, teachers and researchers can collaborate in real time on documents, chat and engage in video calls, access their email or plan meetings in calendars. As a pure software vendor, Nextcloud does not force customers to host in its data centers but works with a variety of leading partners to provide SaaS or on premise solutions. Only Nextcloud Enterprise offers educational institutes the reliability, security and compliance they need to confidently deploy software in critical environments. Reduce risk, improve citizen communication and reduce operational expenses with the leading content collaboration platform. Contact us now to learn how Nextcloud can help you! Sharing of privacy-sensitive data with other universities and teams within the same organization is critical to DFN members. It allows them to work together and collaborate. At the same time, Germany has some of the strongest data privacy laws in the world, so tubCloud needs to maintain the balance between sharing and privacy. Nextcloud also has these two functionalities – ability to share, and total control over privacy – baked in at its core, shared Dr. Thomas Hildmann, Head of the infrastructure department at tubIT and chairman of the DFN forum cloud-services"
