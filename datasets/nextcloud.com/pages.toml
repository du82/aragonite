description = "Looking for another compelling reason to attend LEARNTEC 2025 in May? From May 6 to May 8, you can find Nextcloud at LEARNTEC in Karlsruhe. You can participate in our presentation, visit our booth and engage with our team! If you are eager to discover how Nextcloud Hub can be leveraged as the most secure […]"
full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize From May 6 to May 8, you can find Nextcloud at LEARNTEC in Karlsruhe. You can participate in our presentation, visit our booth and engage with our team! If you are eager to discover how Nextcloud Hub can be leveraged as the most secure solution in Italy for your universities, research institutes and schools, feel free to visit us at Hall 2, Booth N22. LEARNTEC will take place on May 6-8 in Karlsruhe, and you can find more information about the event and registration through the following link. We look forward to seeing you in Karlsruhe! Frank founded the ownCloud project in 2010 to put home users and enterprises back in control of their data. To bring file sync and share technology to the next level and better align to the needs of users and customers he founded Nextcloud in 2016 and has been tirelessly working to realize his vision ever since. Bilgin has a degree in Mechanical Engineering and more than 20 years of experience in Sales and Business Development. Fyruz did her post-graduate in International Business & Intercultural Management at the University of Heilbronn. She worked as key account manager in various IT startups and is driven to help the customers with the best suited solution. Looking for another compelling reason to attend Digitaler Staat event in March? From March 18 to March 19, you can find Nextcloud at Digitaler Staat event in Berlin. You can participate in our panel session, visit our booth and engage with our team! Nextcloud will be showcasing how governments can become digitally sovereign and safeguard […] Meet us at FOSSASIA Summit 2025 in Bangkok! We are delighted to showcase and discuss our latest release, Nextcloud Hub 10. Join us at the FOSSASIA Summit 2025 on March 13-15th. On the 13th of March at 11:30 am you will have a chance to hear Frank speak about How to build a sustainable Open Source […]"
