["https://nextcloud.com/blog/eu-governments-choose-independence-from-us-cloud-providers-with-nextcloud"]
title = "EU governments choose independence with Nextcloud - Nextcloud"
description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally!            See our Privacy Policy for more information.                Customize"
full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize As covered today in the German, French and international media, EU Governments are starting to take digital sovereignty more and more serious, moving away from cloud solutions from large, centralized, foreign firms. Responding to escalating trade tensions including the recent dispute over a digital tax in France, the introduction of the GDPR and legal challenges to the US Cloud Act, the French ministry of Interior, the Dutch ministry of Education and Swedish federal government agencies have joined the German federal government in deploying a European-designed, private cloud solution. During the last year, the French Ministry of Interior has evaluated building an internal cloud and is now preparing a roll-out of a production-ready Nextcloud to their users, designed to scale to the 300.000 employees of the ministry. These users will have access to easy, secure file exchange with mobile, desktop and web access and real-time collaborative office document editing. The French government cares deeply about the safety of the data of their citizens and employees. With the on premise content collaboration platform Nextcloud we have opted for a secure, easy to use solution from the leading European vendor. For FMI, security was clearly very important and this is of course a key advantage of Nextcloud. Like other major organizations using Nextcloud, FMI did an extensive internal security audit and internal certification. We have assisted with those audits, answered many security-related questions and regularly continue to do so as they continuously audit the code base while Nextcloud evolves. Nextcloud provides users with a modern, easy-to-use and productivity-oriented solution that enables efficient online and mobile collaboration and communication. ITZBund now provides an on premise open source solution from a German provider to keep control over their own data."
author = "Jos Poortvliet"
