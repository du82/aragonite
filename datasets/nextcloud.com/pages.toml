description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally!            See our Privacy Policy for more information.                Customize"
full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize Today, we bring you a major update to the Nextcloud AI Assistant with Context Chat, Context Write, GPU acceleration, the ability to split off the Nextcloud server & AI server, and MUCH more! And for those without $100K GPU’s (you know who you are), we have also incredible news: we are working with several prominent European hosting companies, including IONOS, OVHcloud and plusserver to deliver AI-as-a-Service solutions that respect your privacy and digital sovereignty! For our US users and customers, there are already several companies offering AI-as-a-Service and some we support (OpenAI in particular) while others are in the works. With a nearly complete overhaul of the user interface AND how our AI Assistant works on the back-end, plus a ton of new, big features, we decided that this is the moment to call this the Assistant 2.0. Let’s go over what’s new, but first a short summary of where we are today! Nextcloud has a ton of AI features, some big and elaborate, others more basic. Some train a neural network on your data, on your own server to give you a smart inbox in Mail or warnings about unexpected logins from Suspicious Login Detection. Others rely on a pre-trained network that can recognize faces and objects in photos, generate a transcript of your video call or modify text. We can also generate images, translate text and chat messages, and much more. Many of the features are accessible through our easy to use Nextcloud Assistant interface! Many of these features can help you, save you time, or improve your productivity. And best of all: as always we focus on making all these services available of running on your own server. Given even the US Congress doesn’t trust ChatGPT or Microsoft CoPilot, there are good reasons to want control over the data send to and from an AI service! Our Ethical AI Rating system provides you transparency about the AI used to generate your text, image or classify your photos:"
