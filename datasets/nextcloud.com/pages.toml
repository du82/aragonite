["https://nextcloud.com/blog/customer-success-story-germanys-public-radio-and-television-deploys-nextcloud"]
title = "Customer success story: Germany's public radio and television deploys Nextcloud - Nextcloud"
description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally!            See our Privacy Policy for more information.                Customize"
full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize IVZ, Germany’s public radio and television deploys Nextcloud for efficient file exchange and online content collaboration through ONLYOFFICE. Nextcloud presents an open source, easy to use self hosted solution that handles the required performance needed for exchanging large amounts of data, offering support and professional services for developing new features and integration capabilities. IVZ decided to purchase a Nextcloud Subscription in order to provide a reliable solution for a large number of users. IVZ shares their Nextcloud experience with us: keep reading for a summary of this use case or check the case study for the full story! ARD-ZDF-Box, built on Nextcloud and available on ard-zdf-box.de, is an exchange platform for public broadcasting related organizations in Germany. IVZ, the Informations-Verarbeitungs-Zentrum (Information Processing Centre), is a cooperation between all public broadcasting stations of Germany (together they form ARD), Deutschlandradio and DW.IVZ was initially founded in 1993 by only three stations, ORB, SFB and MDR, in the form of a public-law, non-legally capable administrative community. In the following years other public broadcasting stations joined the Coopo ration and since February 2017 all of them are on board. The IVZ cooperation is head-quartered at RBB in Berlin and operates at the locations of its clients, the public state broadcasting stations. ARD and Deutschlandradio cooperate on SAP applications as well as video archive and production systems. As a shared services organization, IVZ responds to requests from the individual radio and TV stations to deliver services and employees have to collaborate with each other or share/keep notes during meetings. Many users used their own preferred public cloud based storage/sharing method. Some teams were using Dropbox, some Google Drive and others OneDrive, each not inter-operable which made collaboration harder."
author = "Jos Poortvliet"
