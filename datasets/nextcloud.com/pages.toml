full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize Since 2018, Nextcloud partner HKN has offered OpenCloud, a GDPR compliant, ISO certified and German-hosted collaboration platform. Learn more in this interview! Last year we were joined by Roundcube, the most popular open source webmail client. At the time we promised to invest in the project (interview) and since then we have brought back the mailing lists and accelerating development. And today - we introduce enterprise support... We bring you a major update to the Nextcloud AI Assistant, plus the news we work with several big hosting providers like IONOS and OVHcloud to bring AI-as-a-Service options to you! OVHcloud and Nextcloud are bound by a strong partnership in sovereign cloud collaboration. Join us at Nextcloud Enterprise Day! Join us at Nextcloud Enterprise Day on April 24 in Munich and meet our sponsor, plusserver. Discover how they embody the pinnacle of 'cloud Made in Germany' with their commitment to data sovereignty and secure workplace solutions. We are excited to announce SpaceNet as a new sponsor of the Nextcloud Enterprise Day, a leading provider offering tailored Nextcloud hosting solutions that ensure robust security, efficiency, and data sovereignty. Learn about the collaboration between XWiki SAS and Nextcloud as these two open-source, privacy friendly companies forge closer ties through an investment and reseller agreement. Welcome the first sponsor of Nextcloud Enterprise Day 2024 — OVHcloud. A pioneer of the European cloud service industry, OVHcloud is committed to open source standards and provides the means to reach true digital sovereignty for businesses and public sector globally. Discover Sendent, an add-in that helps easily integrate Nextcloud into your workflow for secure and easy file sharing in Outlook. Nextcloud offers a modern, on premise content collaboration platform with real-time document editing, video chat & groupware on mobile, desktop and web."
