["https://nextcloud.com/de/athome"]
title = "Nextcloud zu Hause - Nextcloud"
description = "1. Einfache AnmeldungDies ist bei weitem die einfachste Lösung. Wir haben eine Reihe von Anbietern ausgewählt, die eine Nextcloud für Sie betreiben. Natürlich liegt es immer noch an Ihnen, dem Server Ihrer Wahl zu vertrauen, denn es gibt viele. Und das Beste daran: Sie sind nicht allein auf Ihrem eigenen Server! Sie können Ihre Daten von einem Nextcloud-Server an Nutzer auf einem anderen Server weitergeben, genauso wie Sie E-Mails von Hotmail an Gmail senden können (aber in diesem Fall sehen Google und Microsoft Ihre Dateien nicht).Mehr erfahren"
full_description = "Dies ist bei weitem die einfachste Lösung. Wir haben eine Reihe von Anbietern ausgewählt, die eine Nextcloud für Sie betreiben. Natürlich liegt es immer noch an Ihnen, dem Server Ihrer Wahl zu vertrauen, denn es gibt viele. Und das Beste daran: Sie sind nicht allein auf Ihrem eigenen Server! Sie können Ihre Daten von einem Nextcloud-Server an Nutzer auf einem anderen Server weitergeben, genauso wie Sie E-Mails von Hotmail an Gmail senden können (aber in diesem Fall sehen Google und Microsoft Ihre Dateien nicht). Wenn Sie noch mehr Kontrolle über Ihre Daten haben möchten und etwas mehr Zeit und Erfahrung haben, können Sie Ihre eigene Nextcloud-Instanz auf einem Server Ihrer Wahl betreiben. Wir versuchen, dies so einfach wie möglich zu machen, und wir haben eine nette Community, in der einige unserer Mitwirkenden Ihnen gerne helfen werden. Natürlich müssen Sie Ihre Daten nicht auf einem Server weit weg von Ihnen haben. Möchten Sie Nextcloud zu Hause betreiben? Auch das können Sie tun. Sie können das zum Beispiel auf einem Raspberry Pi machen. Oder Sie können sich für einen schönen Router mit integrierter Nextcloud entscheiden. Behalten Sie Ihre Daten zu Hause! Das Nextcloud Dashboard ist Ihr Startpunkt in den Tag. Es gibt Ihnen einen Überblick über Ihre anstehenden Termine, dringende E-Mails, Chat-Nachrichten, eingehende Tickets, die neuesten Tweets und vieles mehr! Nutzer können ihren Status einstellen, damit andere wissen, was sie gerade tun. Über die einfache Weboberfläche können Sie Dateien für andere Benutzer auf Ihrem Server freigeben, passwortgeschützte öffentliche Links erstellen und versenden, andere Personen Dateien in Ihre Cloud hochladen lassen und Benachrichtigungen auf Ihrem Telefon und Desktop erhalten, wenn ein Benutzer auf einem anderen Cloud-Server Dateien direkt mit Ihnen teilt. Und all diese Dinge können Sie auch über den Desktop oder die mobilen Clients erledigen. Der Betrieb eines eigenen Servers ist mit Arbeit verbunden, aber Nextcloud macht es Ihnen so einfach wie möglich, einen zuverlässigen und sicheren Dienst für Sie und Ihre Familie zu betreiben. Wir geben Ihnen Tipps und Empfehlungen im Einrichtungsbildschirm, warnen Sie vor Updates und lassen Sie ein Update mit ein paar Klicks in der Weboberfläche ausführen, bieten einen Webinstaller, sehr einfach zu verwaltende Snap- und VM-Images und vieles mehr."
