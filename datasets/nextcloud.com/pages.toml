["https://nextcloud.com/hub"]
title = "Nextcloud Hub - Content collaboration platform"
description = "With our app order configuration, you can decide which app is the default when you login and when you click on the Nextcloud logo. You can also order the apps to have your most used apps to the left. Admins can also set some key apps in this order to ensure the experience is consistent across the server."
full_description = "With our app order configuration, you can decide which app is the default when you login and when you click on the Nextcloud logo. You can also order the apps to have your most used apps to the left. Admins can also set some key apps in this order to ensure the experience is consistent across the server. Nextcloud has honed in on what makes a healthy online culture – from meetings to file storage. This release brings you accessible, helpful and powerful tools that allow your work life to be less stressful, cluttered and overwhelming in Nextcloud Hub. Nextcloud brings chat, comments, planning and document sharing and editing together for maximum productivity. Share and collaborate on documents, send and receive email, manage your calendar and have video chats without data leaks. Nextcloud is perfect for remote work, as millions of our users already know. Let us quickly explain why it is so awesome! Nextcloud Office empowers your users to collaborate on office documents with team members in real time. The best way to introduce our new, intelligent features is through the Smart Picker, a cross-application feature enabling users to use AI (and much more) in their daily work flow. Familar with file names like documentv3.1_reviewed_Final-3-John.docx? Losing track of the latest version? Not with Nextcloud! A key feature of Nextcloud is how it empowers team members to collaborate, leaving IT a facilitating role. Switching between different tools is more than cumbersome and inefficient: it also increases the chance for mistakes that can result in data leaks. Nextcloud offers the most comprehensive, deeply integrated on premise collaboration platform on the market, replacing dozens of other tools. Having a complete, all-in-one solution simplifies the IT infrastructure for both users and the IT team, improving productivity and security. Access existing storage silos like FTP, Windows Network Drives, SharePoint, Object Storage and Samba shares seamlessly through Nextcloud. Manage users locally or authenticate through LDAP / Active Directory, Kerberos and Shibboleth / SAML 2.0 and more."
