["https://nextcloud.com/blog/nextcloud-founder-wins-innovation-award-donates-prize-money-to-open-source-diversity-fund"]
title = "Nextcloud founder wins innovation award, donates prize money to open source diversity fund - Nextcloud"
description = "We’re proud to announce that Frank Karlitschek has won the Reinhard von Koenig award, receiving Eur 20.000 which he donates to the start of the Nextcloud Include open source diversity fund set up with KDE e.V.! The Nextcloud founder and entrepreneur has won the Reinhard von Koenig award for progress and technology. He has decided […]"
full_description = "We save some cookies to count visitors and make the site easier to use. This doesn't leave our server and isn't to track you personally! See our Privacy Policy for more information. Customize We’re proud to announce that Frank Karlitschek has won the Reinhard von Koenig award, receiving Eur 20.000 which he donates to the start of the Nextcloud Include open source diversity fund set up with KDE e.V.! The Nextcloud founder and entrepreneur has won the Reinhard von Koenig award for progress and technology. He has decided to use the 20.000 euro prize to fund an open source diversity initiative named Nextcloud Include. The funds will be managed by the KDE e.V., an open source promoting charitable foundation Frank has been board member of in the past. Previous winners of the Reinhard von Koenig includes employees from Daimler AG and Atlatec GmbH for work on self-driving cars. Equal opportunities and diversity are very important issues for the future, especially in technical professions. I am pleased that Nextcloud Include is a new important initiative that is focusing on these issues. The bi-annual Reinhard von Koenig award is named after inventor Baron Reinhard von Koenig (1899-1992) and awarded at his former family castle Fachsenfeld in Aalen, located in East Württemberg, the region with the largest number of globally leading companies in Germany. In 1982, Baron von Keunig donated his entire estate and assets to the Fachsenfeld Foundation he founded, with the goal of promoting technological and cultural innovations. The criteria for the award requires that the prize is awarded to people who have developed new technological approaches to socially relevant challenges, shown technical courage and made a significant contribution to sustainable progress.Frank had this to say: I’m extremely honored to be awarded this prize, as a recognition of the incredible impact privacy issues have on our society and the importance of Nextcloud in providing a solution. By donating the prize money to a diversity goal, I hope it will help catalyze another transformation that society needs."
